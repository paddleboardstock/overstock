name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck worker
        run: npm run check:worker
      - name: Check storefront
        run: npm run check
      - name: Build storefront
        run: npm run build
      - name: Dry-run worker bundle
        run: npx wrangler deploy --dry-run --config workers/shop-api/wrangler.toml

  # Deployment lives in deploy.yml (push to main / manual dispatch), driven by
  # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets.
