site:
  name: Aquafarer
  site: 'https://aquafarer.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Aquafarer | RIB Boats, Inflatable Boats & SUP Boards Manufacturer — OEM/ODM
    template: '%s — Aquafarer'
  description: 'RIB boats, inflatable boats and SUP boards manufacturer with full OEM/ODM capability. CE certified per applicable EU directives, 64 models, 15,000 units annual capacity.'
  keywords:
    - Aquafarer
    - RIB boat manufacturer
    - inflatable boat OEM
    - SUP board ODM
    - inflatable boats
    - RIB boats factory
    - drop stitch SUP
    - OEM ODM manufacturer
    - CE certified watercraft
    - inflatable SUP manufacturer
  author: Aquafarer
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Aquafarer
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: en_US
  twitter:
    handle: '@aquafarer'
    site: '@aquafarer'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'news/category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'news/tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

