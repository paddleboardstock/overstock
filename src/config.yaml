site:
  name: Paddle Board Overstock
  site: 'https://paddleboardoverstock.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Paddle Board Overstock | Inflatable SUP Boards Overstock & Clearance — Up to 60% Off Retail
    template: '%s — Paddle Board Overstock'
  description: 'Factory-direct inflatable SUP board overstock and clearance deals from Weihai Dongjilian Co., Ltd. Complete paddle board packages from $79. Limited stock, transparent prices, worldwide shipping, Stripe & PayPal checkout.'
  keywords:
    - Paddle Board Overstock
    - inflatable SUP overstock
    - paddle board clearance
    - SUP board sale
    - inflatable paddle board deals
    - SUP overstock clearance
    - cheap paddle boards
    - inflatable SUP package
    - paddle board accessories
    - factory direct SUP
  author: Paddle Board Overstock
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Paddle Board Overstock
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: en_US
  twitter:
    handle: '@paddleboardoverstock'
    site: '@paddleboardoverstock'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'news/category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'news/tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

