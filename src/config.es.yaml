site:
  name: Aquafarer
  site: 'https://aquafarer.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Aquafarer — Soluciones modernas para barcos inflables y productos técnicos
    template: '%s — Aquafarer'
  description: 'Aquafarer diseña y fabrica barcos inflables, RIB y productos técnicos de primera calidad. Explore nuestro catálogo, especificaciones técnicas y recursos.'
  keywords:
    - Aquafarer
    - barco inflable
    - RIB
    - PVC
    - marino
    - ingeniería
  author: Aquafarer
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Aquafarer
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: es_ES
  twitter:
    handle: '@Aquafarer'
    site: '@Aquafarer'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news' # News main path
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'news/category' # /category/<slug>
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'news/tag' # /tag/<slug>
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"

# --- Per-language site settings ---
