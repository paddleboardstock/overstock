site:
  name: Aquafarer
  site: 'https://aquafarer.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Aquafarer — Solusi modern untuk perahu karet dan produk teknis
    template: '%s — Aquafarer'
  description: 'Aquafarer merancang dan memproduksi perahu karet, RIB, dan produk teknis berkualitas tinggi. Jelajahi katalog, spesifikasi teknis, dan sumber daya kami.'
  keywords:
    - Aquafarer
    - perahu karet
    - RIB
    - PVC
    - kelautan
    - rekayasa
  author: Aquafarer
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Aquafarer
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: id_ID
  twitter:
    handle: '@Aquafarer'
    site: '@Aquafarer'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news' # News main path
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'news/category' # /category/<slug>
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'news/tag' # /tag/<slug>
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"

# --- Per-language site settings ---
