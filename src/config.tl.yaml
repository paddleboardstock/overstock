site:
  name: Paddle Board Overstock
  site: 'https://paddleboardoverstock.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Paddle Board Overstock — Inflatable SUP Boards, Overstock & Clearance Deals
    template: '%s — Paddle Board Overstock'
  description: 'Inflatable SUP board overstock and clearance from Weihai Dongjilian Co., Ltd. — complete paddle board packages and accessories at factory-direct prices. Limited stock, worldwide shipping, Stripe & PayPal checkout.'
  keywords:
    - Paddle Board Overstock
    - inflatable bangka
    - RIB
    - PVC
    - marino
    - inhinyeriya
  author: Paddle Board Overstock
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Paddle Board Overstock
    images:
      - url: '~/assets/images/default.webp'
        width: 1200
        height: 628
    type: website
    locale: tl_PH
  twitter:
    handle: '@paddleboardoverstock'
    site: '@paddleboardoverstock'
    cardType: summary_large_image

i18n:
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/news/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'news' # News main path
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'news/category' # /category/<slug>
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'news/tag' # /tag/<slug>
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"

