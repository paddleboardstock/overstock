content_benefits:
  tagline: Partnership Benefits
  title: 'Why Distributors<br />Choose Paddle Board Overstock'
  subtitle: 'A partnership designed for marine distributors who need reliable supply, competitive margins, and professional support.'
  items:
    - title: 'Territory Protection'
      description: 'Exclusive or semi-exclusive territory rights for qualified distributors. Market mapping and channel conflict management to protect your investment in building the Paddle Board Overstock brand in your region.'
      icon: tabler:map-pin
    - title: 'Competitive Wholesale Pricing'
      description: 'Tiered pricing based on annual volume commitments. Margin-protective pricing structure with advance price guarantees and transparent cost breakdowns (FOB Qingdao basis).'
      icon: tabler:currency-dollar
    - title: 'Marketing Support Kit'
      description: 'Professional product photography, specification sheets, compliance documentation templates, social media content, and co-branded marketing materials. Updated annually with new product launches.'
      icon: tabler:photo
    - title: 'Technical Training'
      description: 'Product training for your sales team (virtual or on-site), maintenance and repair training for your service technicians, and customer-facing FAQ and troubleshooting guides.'
      icon: tabler:school
    - title: 'Spare Parts & After-Sales'
      description: 'Dedicated spare parts supply with priority shipping. Replacement tube sections, valves, fins, and repair kits available for fast order fulfillment. Warranty claim processing support.'
      icon: tabler:tool
    - title: 'Compliance Documentation'
      description: 'Full compliance documentation package for your market: CE DoC, builder plate data, owner manuals, and regulatory registration support. Eliminates your compliance burden.'
      icon: tabler:file-certificate

content_requirements:
  tagline: What We Look For
  title: 'Distributor<br />Requirements'
  subtitle: 'We seek partners who can professionally represent and support Paddle Board Overstock products in their territory.'
  items:
    - title: 'Territory & Market Knowledge'
      description: 'Established presence in the marine, water sports, or outdoor recreation market. Understanding of local regulations, consumer preferences, and distribution channels for watercraft products.'
      icon: tabler:target
    - title: 'Industry Experience'
      description: 'Minimum 2 years of experience distributing marine, outdoor, or sports equipment. Proven track record with international brands and B2B wholesale operations.'
      icon: tabler:briefcase
    - title: 'Showroom or Warehouse'
      description: 'Physical facility for product display, inventory storage, and customer service. Ability to maintain demo units and spare parts inventory for your territory.'
      icon: tabler:building-store
    - title: 'Commitment to Brand Standards'
      description: 'Willingness to maintain Paddle Board Overstock brand presentation standards, provide customer support per our service protocols, and participate in annual product training updates.'
      icon: tabler:star

content_process:
  tagline: Application Process
  title: '4-Step Dealer<br />Application Process'
  subtitle: 'From initial inquiry to first shipment — a straightforward onboarding process.'
  steps:
    - number: '01'
      title: 'Initial Inquiry & Qualification'
      description: 'Submit your distributor application with company details, territory of interest, current product lines, and annual volume estimates. We review within 5 business days.'
      timeline: '5 days'
    - number: '02'
      title: 'Business Review & Terms'
      description: 'Virtual meeting to discuss territory strategy, pricing tiers, and partnership terms. Review compliance documentation requirements for your market. NDA signing if needed.'
      timeline: '1-2 weeks'
    - number: '03'
      title: 'Sample Order & Evaluation'
      description: 'Place an initial sample order (2-5 units) at distributor pricing for market evaluation and team training. Full compliance documentation and demo preparation included.'
      timeline: '30-45 days'
    - number: '04'
      title: 'Partnership Launch & Support'
      description: 'First container order with territory protection activated. Marketing kit delivered, sales team trained, and dedicated account manager assigned. Ongoing quarterly business reviews.'
      timeline: 'Ongoing'

content_application_docs:
  tagline: Application Documents
  title: 'Documents Required<br />for Dealer Application'
  subtitle: 'To apply for an Paddle Board Overstock dealership, please prepare the following documents and information for our review team.'
  items:
    - title: 'Business Registration Certificate'
      description: 'Valid company registration document showing legal entity name, registered address, and business scope covering marine, sports, or outdoor equipment distribution.'
      icon: tabler:file-text
    - title: 'Territory Coverage Plan'
      description: 'Geographic territory of interest, existing retail or distribution network, target customer segments, and proposed annual volume by product category (RIB, SUP, kayak).'
      icon: tabler:map
    - title: 'Showroom or Warehouse Capability'
      description: 'Physical facility for product display, inventory storage, and customer service. Photos or floor plans showing demo area and spare parts storage capacity.'
      icon: tabler:building
    - title: 'Financial Capability Statement'
      description: 'Bank reference or financial statement confirming ability to place initial container order and maintain inventory. Minimum initial order: one 20ft container (10-20 units mixed models).'
      icon: tabler:coin
    - title: 'After-Sales Support Capacity'
      description: 'Service technicians trained or trainable for inflatable boat maintenance and repair. Warranty claim processing capability and spare parts inventory commitment.'
      icon: tabler:tool
    - title: 'Previous Brand References'
      description: 'List of current or previous marine/sports equipment brands distributed. Contact references available upon mutual agreement. Startups without prior distribution experience may qualify with a stronger financial commitment.'
      icon: tabler:users

faq:
  title: Dealership Program — Frequently Asked Questions
  questions:
    - q: What is the minimum order quantity for distributors?
      a: 'Distributor MOQ starts at 10-20 units per order, with flexibility for mixed models (RIB, inflatable, SUP). Initial sample orders of 2-5 units are available at distributor pricing for market evaluation.'
    - q: Do you offer exclusive territory rights?
      a: 'Exclusive territory rights are available for qualified distributors who meet annual volume commitments and maintain brand standards. Semi-exclusive and non-exclusive arrangements are also available for emerging markets.'
    - q: What marketing support do you provide?
      a: 'We provide a comprehensive marketing kit including professional product photography, specification sheets, compliance documentation templates, social media content library, and co-branded materials. Updated annually with new product launches.'
    - q: How are warranty claims handled?
      a: 'Distributors serve as the first point of contact for warranty claims. We provide clear warranty criteria, photo documentation protocols, and fast replacement or credit processing. Warranty terms: 5-year limited on boat tube fabric/seams/hull; 2-year on SUP and accessories.'
    - q: Can I private-label Paddle Board Overstock products under my own brand?
      a: 'Yes, through our OEM/ODM program. Private-label options include custom tube graphics, console branding, retail packaging, and compliance documentation under your brand name. See our OEM/ODM services page for details.'
    - q: What compliance documentation is included for distributors?
      a: 'Every shipment includes model-specific CE DoC, builder plate data, owner manuals, and shipping documentation. We also provide regulatory registration support for your territory and assist with any local compliance requirements.'

