overview_section:
  tagline: Market Overview
  title: The Philippine SUP Market
  paragraphs:
    - With more than seven thousand islands, the Philippines is built for stand-up paddle. El Nido and Coron's lagoons, Siargao's laid-back surf-and-island scene, Boracay's beach-club energy, and Cebu's dive-and-watersports economy all create steady demand — from tourists taking a sunrise paddle in a limestone lagoon to locals building SUP fitness and yoga communities in Manila and beyond.
    - The buyers are typically resort and tour operators: island resorts adding a guest activity that needs no fuel, no engine, and no license; island-hopping tour operators broadening their offer; and small shops serving the domestic paddling community. Orders run small — 5–20 boards — and mixed between stable all-around boards for first-timers and a few premium editions for the resort-front look.
  customer_types:
    - title: Island Resorts
      description: Palawan, Siargao, and Boracay resorts adding guest SUP programs with compact mixed fleets.
    - title: Tour Operators
      description: Island-hopping and lagoon tour operators adding paddle stops to their itineraries.
    - title: Local Shops & Schools
      description: City-based schools and shops serving the growing Philippine paddling and SUP yoga community.
shipping_section:
  title: Ship to the Philippines
  paragraphs:
    - Orders ship from Weihai, China. Express air freight moves samples and 1–3 board orders fast into Manila and Cebu; consolidated sea freight serves 5–20 board wholesale orders through Manila and other Philippine ports. Transit estimates for your destination — metro Manila or provincial — are included in your quote.
    - We provide the commercial invoice and packing list clearance requires, with correct HS codes and declared values. Import duties and taxes are payable by the importer under Philippine rules.
  customs_note: For provincial destinations, final delivery from the port or airport is quoted as part of the door-to-door estimate. Confirm current import duty treatment for sports equipment with your broker; we supply complete documentation.
faq_section:
  title: Philippines FAQ
  items:
    - q: How long does shipping to the Philippines take?
      a: It depends on the method. Express air freight into Manila or Cebu is the fastest option for samples and 1–3 board orders; consolidated sea freight suits 5–20 board wholesale orders and is quoted with a transit window for your port. Both estimates are itemized in your quote before you commit.
    - q: Can boards reach provincial islands like Palawan or Siargao?
      a: Yes — door-to-door delivery to provincial destinations is quoted as part of the freight estimate, using onward domestic logistics from the arrival port or airport. Note the estimate and options in your inquiry and we will price it specifically.
    - q: What does a resort starter fleet look like?
      a: "Usually 5–10 boards: stable all-around models for guest lessons and free paddling, plus one or two premium art editions for the beachfront. Mixed models, one shipment, priced by total quantity."
    - q: Do the boards suit lagoon and reef-flat use?
      a: Yes — calm, shallow, warm-water conditions are exactly what all-around inflatable SUP boards are designed for, and the flexible fin and durable drop-stitch construction handle reef-flat and beach landings well.
