content_founding:
  tagline: O Início
  title: 'Nascidos na Frente Ribeirinha'
  subtitle: 'A Aquafarer começou numa oficina costeira em Qingdao com um barco e uma visão: construir embarcações infláveis capazes de enfrentar condições marítimas reais.'
  paragraphs:
    - 'Em 2012, os nossos fundadores identificaram uma lacuna no mercado — a maioria dos barcos infláveis era acessível mas pouco fiável, ou de alta qualidade mas proibitivamente cara. Acreditaram que havia espaço para um fabricante que entregasse qualidade e valor.'
    - 'O primeiro casco foi construído à mão, testado em águas locais e aperfeiçoado com base no feedback real de pescadores e pequenos operadores comerciais. Esse ciclo — construir, testar, ouvir, melhorar — continua a ser o núcleo da nossa filosofia de engenharia.'
    - 'Em 2015, a notícia tinha-se espalhado para além de Qingdao. Distribuidores internacionais começaram a pedir amostras. O que começou como uma oficina local tornava-se um fornecedor global.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Oficina de produção inicial da Aquafarer e fabrico
content_growth:
  tagline: Crescimento e Inovação
  title: 'Da Oficina a uma Instalação de 12,000 m²'
  subtitle: 'O investimento contínuo em pessoas, equipamentos e processos transformou a Aquafarer numa moderna instalação de fabrico marítimo.'
  paragraphs:
    - 'À medida que a procura crescia, as nossas instalações também cresciam. Expandimos de uma pequena oficina para uma fábrica de 12,000 m² com linhas de produção dedicadas a barcos RIB, barcos infláveis, SUP e acessórios.'
    - 'Investimos em máquinas de corte CNC, equipamento de soldadura de alta frequência, linhas de produção drop stitch e bancadas de ensaio abrangentes — permitindo-nos controlar todos os aspetos da qualidade de produção.'
    - 'Hoje, a nossa equipa de 200-300 pessoas inclui engenheiros navais, cientistas de materiais, especialistas em controlo de qualidade e artesãos qualificados — muitos dos quais estão com a Aquafarer desde os primeiros dias.'
content_mission:
  tagline: A Nossa Missão
  title: 'Engenharia de Liberdade na Água'
  subtitle: 'Cada produto Aquafarer é concebido para ajudar as pessoas a explorar, trabalhar e prosperar na água — de forma fiável, segura e acessível.'
  list:
    - 'Projetar embarcações que funcionam em condições marítimas reais — não apenas no papel'
    - 'Construir parcerias duradouras com distribuidores e marcas através de um serviço OEM/ODM fiável'
    - 'Melhorar continuamente os nossos processos de fabrico para entregar mais valor'
    - 'Apoiar cada produto com peças genuínas e experiência técnica'
cta:
  title: 'Pronto para fazer parceria com um fabricante<br />que se preocupa com a qualidade?'
  subtitle: 'Contacte a nossa equipa para discutir o seu projeto OEM/ODM — sem pressão de quantidade mínima, apenas conselhos honestos.'
  actions:
    - variant: primary
      text: Iniciar uma conversa
      href: /contact
    - text: Explorar os nossos produtos
      href: /products
