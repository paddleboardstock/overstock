content_challenge:
  tagline: O desafio
  title: Tenders de Iate Exigem<br />Desempenho e Apresentação
  subtitle: Um tender de iate é mais do que um bote auxiliar — é uma extensão da embarcação-mãe e uma declaração de qualidade.
  paragraphs:
    - Os proprietários e capitães de iates precisam de propostas que tenham um bom desempenho, sejam armazenadas de forma compacta e tenham uma bela apresentação. A proposta deve complementar a estética do iate e, ao mesmo tempo, fornecer transporte confiável para hóspedes e tripulação.
    - '**O armazenamento é fundamental** — A proposta deve caber no convés, na garagem ou em turcos. O peso é importante para os sistemas de lançamento e recuperação. Aquafarer Os RIBs oferecem excelentes relações potência/peso com perfis de armazenamento compactos.'
    - '**As expectativas de desempenho são altas** — Os hóspedes esperam uma viagem suave e seca ao serem transferidos para terra. As opções de motor devem equilibrar velocidade, alcance e níveis de ruído para uma experiência premium. Para operações de fretamento, a licitação funciona diariamente e deve suportar uso frequente.'
    - '**A aparência é importante** — Uma proposta incompatível ou desgastada prejudica a apresentação geral do iate. Cores de tubo personalizadas, estofamento e marca garantem que a proposta pareça pertencer.'
content_solution:
  tagline: Nossa solução
  title: Configurações de concurso<br />Para cada aplicação de iate
  subtitle: Aquafarer RIB as propostas podem ser personalizadas para atender à sua embarcação, tipo de operação e requisitos de armazenamento – desde especificações do construtor de super iates até programas de fretamento de frota.
  list:
    - Cores de tubos personalizadas para combinar ou complementar o recipiente-mãe — qualquer cor RAL disponível para tubos Hypalon ou PVC
    - Estofamento e costura personalizados – vinil premium de qualidade marítima com combinação de cores e logotipo bordado
    - Direção do console ou do leme — escolha com base no padrão de uso e na preferência do operador
    - Casco de fibra de vidro deep-V para um passeio suave e seco em diversas condições do mar
    - Armazenamento compacto – esvazia ou acomoda para armazenamento de garagem, armário ou turco
    - Hypalon tubos para resistência aos raios UV e preservação da aparência a longo prazo
    - Pontos de elevação e anéis de reboque padrão em todos os modelos
    - Cobertura de proa opcional, cobertura completa e protetores contra atrito
    - 'Gama de motores: 15 HP a 60 HP — configurações de motor de popa ou leme'
    - OEM/rotulagem privada disponível para construtores de iates e revendedores marítimos
content_segments:
  tagline: Perfis de clientes
  title: Soluções para licitações de iates<br />Por tipo de cliente
  subtitle: Diferentes segmentos da indústria de iates têm requisitos únicos. Aquafarer configura propostas para corresponder a cada aplicação.
  items:
    - title: Construtores de super iates
      subtitle: OEM integração da proposta – dimensões, cores e materiais personalizados
      description: 'Os construtores de iates enfrentam um desafio recorrente: cada nova embarcação tem restrições dimensionais, limites de peso e expectativas estéticas únicas. A proposta deve integrar-se perfeitamente com o sistema de turco da embarcação mãe, caber nas dimensões precisas da garagem e corresponder à linguagem de design de um iate multimilionário. Qualquer incompatibilidade – cor errada do tubo, posicionamento incorreto do ponto de içamento, peso incompatível – atrasa a entrega e reflete negativamente no construtor. Aquafarer trabalha diretamente com equipes de aquisição e design de construtores para entregar propostas com cores de tubos RAL personalizadas, estofamento correspondente, painéis de console de marca e pacotes completos de documentação OEM.'
      features:
        - Especificações dimensionais personalizadas que correspondem às restrições da garagem e do turco
        - Qualquer cor de tubo RAL e estofamento correspondente – amostras de aprovação de projeto fornecidas
        - OEM marca no console, tubo e encostos dos bancos
        - Validação do ponto de içamento e ajuste do turco para cada modelo
        - Peso do casco otimizado para sistemas específicos de lançamento e recuperação
        - Programação de entrega em massa alinhada com os cronogramas de produção
    - title: Empresas de gerenciamento de iates
      subtitle: Licitações padronizadas para frota — suporte global, tempo de inatividade mínimo
      description: As empresas de gestão supervisionam vários iates que operam no Mediterrâneo, Caribe, Pacífico Sul e além. Sua principal necessidade é a confiabilidade – uma licitação quebrada em um porto remoto significa horas extras para a tripulação, reclamações de hóspedes e substituições caras de última hora. As especificações padronizadas da frota reduzem o tempo de treinamento da tripulação nas embarcações e simplificam o gerenciamento de peças sobressalentes. Aquafarer oferece preços de frota para vários navios, especificações consistentes em todos os pedidos e suporte global de peças sobressalentes para empresas de gerenciamento com navios em diversas regiões.
      features:
        - Especificações padronizadas em toda a frota gerenciada
        - Peças sobressalentes intercambiáveis ​​em todas as propostas de frota
        - Preços de frota e descontos por volume para pedidos de várias unidades
        - Disponibilidade global de peças de reposição — envio rápido para qualquer porto
        - Documentação consistente de serviço e manutenção para a tripulação
        - Coordenação de entrega de múltiplas unidades para diferentes locais de navios
    - title: Operadores de fretamento de iates
      subtitle: Operações diárias de alta frequência — durabilidade sem comprometer a aparência
      description: 'As licitações de fretamento enfrentam o cronograma operacional mais exigente da indústria de iates: transferências diárias de hóspedes, viagens em terra, apoio a esportes aquáticos e licitações portuárias – geralmente mais de 200 operações por temporada de fretamento. A proposta deve parecer impecável para cada entrega de hóspede, ao mesmo tempo que resiste ao embarque contínuo, à exposição à água salgada e às horas de funcionamento do motor. A degradação da aparência é uma preocupação direta dos negócios – uma proposta desgastada afeta as avaliações dos hóspedes e as taxas de fretamento. Aquafarer configura propostas fretadas com estofamento atualizado, tubos Hypalon resistentes e áreas de manuseio reforçadas para durabilidade de longo prazo que mantém a qualidade da apresentação.'
      features:
        - Tubos Hypalon para serviços pesados ​​— vida útil de 5 a 8 anos em serviço fretado diário
        - Degraus de embarque reforçados e linhas de apoio para uso frequente
        - Estofamento de vinil premium resistente a manchas – fácil limpeza entre fretamentos
        - Superfícies de deck antiderrapantes e fáceis de limpar
        - Pacotes de motores de popa confiáveis ​​com fácil acesso para manutenção para prazos de entrega apertados
        - Materiais de qualidade cosmética que mantêm a aparência durante as temporadas de fretamento
    - title: Revendedores e corretores de iates
      subtitle: Fornecimento de proposta confiável para conclusão da embarcação e valor de revenda
      description: Os revendedores e corretores precisam de um fornecimento estável de ofertas de qualidade que complementem os navios que vendem – combinando o posicionamento da marca e melhorando a experiência do comprador. Uma licitação inconsistente ou atraso no fornecimento pode atrasar a entrega do iate ou diminuir a apresentação da listagem. Os revendedores exigem qualidade consistente em todos os lotes, prazos de entrega confiáveis ​​e preços competitivos para manter as margens. Aquafarer oferece programas de inventário de revendedores com programação de entrega sazonal, opções de co-branding para exibição em showroom e alocação prioritária durante a alta temporada.
      features:
        - Programas de estoque de estoque com modelos disponíveis sob demanda
        - Programação de entrega sazonal alinhada ao calendário de entrega
        - Co-branding do revendedor no console e nos tubos para exibição no showroom
        - Qualidade e especificações consistentes em todos os pedidos de lote
        - Preços competitivos para revendedores com nível baseado em volume
