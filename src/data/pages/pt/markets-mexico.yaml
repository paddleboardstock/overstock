hero:
  tagline: México
  title: SUP Placas Atacadistas para<br />Varejistas Mexicanos
  subtitle: De Cancún e Tulum a Puerto Vallarta e Los Cabos — pranchas de paddle recém-lançadas em estoque excessivo para lojas de praia mexicanas, hotéis e vendedores online, a partir de 5 pranchas.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Pranchas em estoque SUP para varejistas de praia e operadores de hotéis no México
direct_answer: Paddle Board Overstock fornece pranchas infláveis SUP em estoque totalmente novas para empresas mexicanas — varejistas de praia em Cancún, Tulum, Puerto Vallarta e Los Cabos, operadores de hotéis, frotas de aluguel e vendedores online. Pedidos por atacado começam a partir de 5 pranchas com modelos mistos em um único envio, enviados de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada prancha é 100% testada quanto à pressão e coberta pela Garantia de 2 Anos SUP.
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo às cidades de varejo de praia do Caribe e Pacífico do México
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado SUP Mexicano
  paragraphs:
    - O México possui duas das maiores costas turísticas de praia do mundo. O lado do Caribe — Cancún, Playa del Carmen, Tulum, Cozumel — oferece águas planas, quentes e turquesa, praticamente feitas para stand-up paddle, enquanto o lado do Pacífico — Puerto Vallarta, Sayulita, Los Cabos — combina cultura do surf com baías protegidas ideais para aulas e aluguéis. O turismo ao longo de todo o ano mantém a demanda constante, e uma comunidade mexicana de paddle crescente compra localmente entre visitadas.
    - The typical buyer here is a small beach business: Uma escola de paddle que vende pranchas para seus alunos, um hotel boutique adicionando SUP à experiência dos hóspedes, uma loja de surf expandindo para águas calmas, ou um vendedor online atendendo ao mercado interno. Os pedidos variam entre 5–20 pranchas, misturando modelos duráveis para iniciantes e para aulas/aluguel e algumas edições premium para exibição no varejo.
  customer_types:
    - title: Operadores da Costa do Caribe
      description: Escolas de paddle e pontos de aluguel em Cancún, Tulum e Playa del Carmen que atendem à demanda diária de turistas.
    - title: Hotéis Boutique
      description: Pequenos hotéis e pousadas adicionando programas de SUP para hóspedes com frotas mistas e compactas.
    - title: Vendedores Online
      description: Vendedores de e-commerce mexicanos importando seu primeiro estoque SUP para o mercado interno.
shipping_section:
  title: Envio para o México
  paragraphs:
    - Os pedidos são enviados de Weihai, China. O frete aéreo expresso transporta amostras e pedidos de 1–3 pranchas rapidamente para a Cidade do México e aeroportos de resorts; o frete marítimo consolidado atende pedidos por atacado de 5–20 pranchas através dos portos do Pacífico e do Golfo do México. Ambas as opções são cotadas com tempos estimados de trânsito para seu destino.
    - Fornecemos a fatura comercial e a lista de embalagem necessárias ao seu corretor aduaneiro, com códigos SH corretos e valores declarados. Direitos de importação e impostos são pagos pelo importador conforme regras mexicanas.
  customs_note: O regime de importação do México para equipamentos esportivos é orientado pelo corretor — trabalhe com seu agente aduanal para confirmar o tratamento atual de impostos e taxas antes de fazer o pedido. Nós fornecemos documentação completa e consistente para uma liberação aduaneira tranquila.
faq_section:
  title: FAQ México
  items:
    - q: As cotações e o suporte podem ser tratados em espanhol?
      a: Sim — trabalhamos com compradores que falam espanhol em toda a América Latina. Pergunte em sua consulta e lidaremos com sua cotação e pedido em espanhol.
    - q: Como é um primeiro pedido para uma loja em Tulum ou Cancún?
      a: 'A maioria começa com 5–10 pranchas: uma base de modelos all-around amigáveis para iniciantes voltados ao mercado turístico, mais uma ou duas edições premium art para exibição e venda no varejo. Modelos mistos, em um único envio, preço baseado na quantidade total.'
    - q: Como as pranchas chegam ao México?
      a: Transporte expresso por via aérea para amostras e pequenos pedidos urgentes; frete marítimo consolidado para quantidades de atacado, cotado por porto. Ambos estão detalhados em sua cotação com os tempos de trânsito estimados.
    - q: Quem cuida dos impostos de importação no México?
      a: Você, como importador, através do seu despachante aduaneiro. Nós fornecemos a fatura comercial e a lista de embalagem com os códigos HS corretos para que seu despachante possa liberar a remessa de maneira previsível.
