hero:
  tagline: América Latina
  title: SUP Placas Atacadistas para<br />Varejistas latino-americanos
  subtitle: Pranchas paddle novas em folha para lojas de praia, frotas de aluguel e vendedores online em toda a América Latina — de 5 pranchas, modelos mistos, expresso ou marítimo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Tábuas em excesso de estoque para varejistas de paddle boards da América Latina
direct_answer: Paddle Board Overstock forneça tábuas infláveis novas em folha SUP para pequenos varejistas em toda a América Latina — do México e Brasil até Colômbia, Peru, Chile e Argentina. Os pedidos no atacado começam com 5 tábuas e modelos mistos são bem-vindos, e cada pedido é enviado de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. As placas são 100% testadas sob pressão e cobertas pela Garantia de 2 Anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos em um único pedido, com preço por quantidade total
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - Mercados de língua espanhola e portuguesa atendidos em toda a região
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado Latino-Americano SUP
  paragraphs:
    - A América Latina é um dos mercados de stand up paddle que mais cresce no mundo. Longas costas em dois oceanos, economias estabelecidas no turismo de praia e uma forte cultura de esportes de prancha oferecem aos varejistas independentes de Tulum a Florianópolis uma base crescente de clientes — turistas que fazem sua primeira aula, remadores de fim de semana e uma comunidade local de SUP corridas e surfe em ascensão.
    - The retail landscape is dominated by small and mid-sized independent shops: Escolas de remo à beira-mar que vendem o que alugam, lojas de surf SUP adicionando linhas e vendedores online importando diretamente pela primeira vez. Esses negócios raramente precisam de caixas carregadas de um único modelo — eles precisam de 5 a 20 pranchas por pedido, misturando entre modelos completos e amigáveis para iniciantes e algumas edições premium.
  customer_types:
    - title: Lojistas de Beach Town
      description: Lojas em cidades turísticas que atendem turistas — elas precisam de pranchas resistentes para iniciantes em grande volume, além de alguns modelos premium para exibição e venda.
    - title: Escolas de Remo e Frotas de Aluguel
      description: Escolas combinando aulas com varejo e frotas de aluguel renovando placas a cada temporada com pedidos de modelos mistos.
    - title: Vendedores Online
      description: Vendedores de comércio eletrônico em espanhol e português introduzindo a SUP categoria em seu mercado nacional sem risco de escala de contêiner.
shipping_section:
  title: Navio para a América Latina
  paragraphs:
    - Os pedidos são enviados a partir de nossa base logística em Weihai, China. Amostras de trajes de carga aérea expressa, 1 a 3 pedidos de embarque e reabastecimento urgente; o frete marítimo consolidado é a rota econômica para 5 a 20 pedidos de embarcação no atacado para os principais portos da região.
    - Fornecemos documentação de exportação completa e precisa — fatura comercial e lista de embalagem — para manter a desalfança. Taxas e impostos de importação são definidos pelo seu país e pagos pelo importador; nunca agrupamos promessas vagas de "impostos incluídos" em um orçamento de frete.
  customs_note: As regras de importação e as taxas de imposto variam significativamente entre os países da América Latina. Verifique o regime atual de importação do seu país para equipamentos infláveis para esportes aquáticos antes de fazer o pedido e peça qualquer documentação extra que seu corretor precise.
faq_section:
  title: FAQ sobre a América Latina
  items:
    - q: Posso pedir um orçamento em espanhol ou português?
      a: Nossa equipe trabalha com compradores em toda a América Latina e pode lidar com cotações e confirmações de pedidos para clientes que falam espanhol e português. Pergunte em seu pedido.
    - q: Você envia para o meu país na América Latina?
      a: Enviamos para toda a região — México, Brasil, Colômbia, Peru, Chile, Argentina, Equador e além. Confirme seu destino exato na solicitação de orçamento e verificaremos o serviço atual de frete.
    - q: Qual é o mínimo no atacado para varejistas latino-americanos?
      a: Total de cinco pranchas, misturando qualquer modelo em estoque. Esse total define sua faixa de preço — você pode combinar edições all-around, touring e art em um único envio.
    - q: Quem paga os impostos de importação no meu país?
      a: Você, como importador, de acordo com as regras do seu país. Fornecemos a documentação correta e completa (fatura comercial, lista de embalagem) para que a liberação seja previsível — consulte nossa página de envio internacional para ver tudo detalhado.
