testimonial:
  content: Eu estava alugando 5 pranchas de uma loja local e perdendo 60% da minha receita para eles. Paddle Board Overstock me ajudou a construir minha própria frota de 15 SUPs. O calculador de ROI que eles forneceram mostrou que eu atingiria o ponto de equilíbrio em 4 meses — na verdade, levou 3. Agora estou expandindo para 30 pranchas.
  name: Daniel Okonkwo
  title: Proprietário, Lakeland SUP Rentals - Ontário, Canadá
content_segments:
  tagline: Perfis de aluguel
  title: Soluções em Aluguel de Esportes Aquáticos<br />Por Tipo de Operador
  subtitle: Diferentes operações de aluguel têm necessidades diferentes – desde pequenos aluguéis de SUP à beira-mar até centros de esportes aquáticos em resorts de grande escala. Adaptamos nossos pacotes de equipamentos e modelo de suporte de acordo.
  items:
    - title: Aluguel de SUP na praia e à beira do lago
      subtitle: Operações de alto volume e baixa complexidade
      description: Operadores que alugam pranchas de stand-up paddle diretamente para frequentadores de praias e visitantes de lagos. Sua prioridade é minimizar o tempo de rotatividade entre os alugueis, manter o equipamento em circulação e gerenciar picos de demanda sazonais com um pequeno espaço de armazenamento.
      features:
        - Frotas infláveis de SUP que se dobram — sem necessidade de doca ou trailer
        - PVC de qualidade comercial, com capacidade para 100+ ciclos de aluguel por temporada
        - Tecido de secagem rápida e resistente a UV, pronto para re-aluguel no mesmo dia
        - Gamas de pranchas codificadas por cor para fácil identificação da frota
    - title: Centros de esportes aquáticos em resorts e hotéis
      subtitle: Experiência do hóspede e alinhamento da marca
      description: Resorts e hotéis que oferecem esportes aquáticos como comodidade no local. O equipamento precisa ter uma aparência premium, ter um desempenho confiável para hóspedes iniciantes e intermediários e ser integrado aos fluxos de trabalho de reserva e cobrança de atividades existentes do resort.
      features:
        - Pranchas e coletes salva-vidas personalizados com marca própria combinando com as cores do resort
        - 'Frota mista: all-around, touring e art-series'
        - Soluções silenciosas e sem combustível com bomba elétrica para inflação na praia
        - Treinamento da equipe e integração de manutenção incluídos
    - title: Aluguéis Boutique & Móveis
      subtitle: Serviços de aluguel pop-up e delivery
      description: Operadores entregando pranchas diretamente ao cliente — entregas na praia do hotel, estações de aluguel pop-up em eventos e configurações móveis. O equipamento deve ser rápido de montar, fácil de transportar e apresentável à primeira vista, com dimensionamento de frota flexível para eventos e demanda sazonal.
      features:
        - Transporte de prancha estilo mochila — sem necessidade de trailer
        - Inflação rápida para montagem sob demanda em menos de 15 minutos
        - Equipamento apresentável que parece premium à primeira vista
        - Dimensionamento de frota flexível para eventos e demanda sazonal
    - title: Operadores turísticos e de aventura
      subtitle: Frotas de excursões guiadas
      description: Operadores conduzindo passeios guiados de esportes aquáticos — safáris de SUP, excursões de snorkeling e tours de exploração costeira. O equipamento deve ser estável o suficiente para convidados novatos, rápido de limpar entre grupos e durável para uso guiado diário em diversas condições de água.
      features:
        - Plataformas extra estáveis (SUP de 32" de largura+) para cavaleiros iniciantes
        - Plataformas extra grandes e estáveis para fotos de casal/grupo
        - Capacidade incorporada para equipamento de snorkeling, bolsas secas e coolers
        - Pacotes de equipamento de segurança para operações de turismo comercial
