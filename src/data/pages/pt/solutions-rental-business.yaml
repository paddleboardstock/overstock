testimonial:
  content: Eu estava alugando 5 pranchas em uma loja local e perdendo 60% da minha receita para elas. Aquafarer me ajudou a construir minha própria frota de 15 SUPs. A calculadora de ROI que eles forneceram mostrou que eu atingiria o ponto de equilíbrio em 4 meses - na verdade, foram necessários 3. Agora estou expandindo para 30 pranchas e adicionando caiaques.
  name: Daniel Okonkwo
  title: Proprietário, Lakeland SUP Rentals - Ontário, Canadá
content_segments:
  tagline: Perfis de aluguel
  title: Soluções de aluguel de esportes aquáticos<br />Por tipo de operadora
  subtitle: Diferentes operações de aluguel têm necessidades diferentes – desde pequenos aluguéis de SUP à beira-mar até centros de esportes aquáticos em resorts de grande escala. Adaptamos nossos pacotes de equipamentos e modelo de suporte de acordo.
  items:
    - title: Aluguel de SUP na praia e à beira do lago
      subtitle: Operações de alto volume e baixa complexidade
      description: Operadoras alugam pranchas de stand-up paddle e caiaques diretamente para banhistas e visitantes do lago. Sua prioridade é minimizar o tempo de resposta entre locações, manter os equipamentos em rotação e gerenciar picos de demanda sazonais com um pequeno espaço de armazenamento.
      features:
        - Frotas de SUP infláveis que guardam planas — sem necessidade de doca ou reboque
        - PVC de grau comercial avaliado para mais de 100 ciclos de aluguel por temporada
        - Tecido de secagem rápida e resistente aos UV para re-disponibilizar no mesmo dia
        - Linhas de pranchas com código de cores para fácil identificação da frota
    - title: Centros de esportes aquáticos em resorts e hotéis
      subtitle: Experiência do hóspede e alinhamento da marca
      description: Resorts e hotéis que oferecem esportes aquáticos como comodidade no local. O equipamento precisa ter uma aparência premium, ter um desempenho confiável para hóspedes iniciantes e intermediários e ser integrado aos fluxos de trabalho de reserva e cobrança de atividades existentes do resort.
      features:
        - Pranchas de SUP e coletes salva-vidas personalizados nas cores do resort
        - 'Frota mista: SUPs, caiaques, pedalinhos e pequenos tenders RIB'
        - Soluções de bombas elétricas silenciosas e sem combustível para inflagem na praia
        - Treinamento da equipe e introdução à manutenção inclusos
    - title: Operadores de aluguel de barcos e RIB
      subtitle: Frotas de aluguel de embarcações de nível comercial
      description: Operadores que alugam embarcações motorizadas – barcos RIB, barcos infláveis e pequenos runabouts – por hora ou meio dia. Sua frota deve atender aos regulamentos de segurança marítima, suportar o uso intenso dos hóspedes e minimizar o tempo de inatividade mecânica entre os fretamentos.
      features:
        - Pacotes RIB com espeques de popa prontos para motores de popa de 30–90 HP
        - Painéis de piso em compensado de grau marítimo para integridade estrutural de longo prazo
        - Sistemas de válvulas de lançamento rápido para rotatividade mais rápida
        - Kit de peças de reposição + suporte técnico SLA sob demanda
    - title: Operadores turísticos e de aventura
      subtitle: Frotas de excursões guiadas
      description: Operadores que realizam passeios guiados de esportes aquáticos — safáris de SUP, passeios de caiaque em cavernas, excursões de mergulho com snorkel ou passeios RIB por ilhas. O equipamento deve ser estável o suficiente para visitantes iniciantes, rápido de limpar entre grupos e durável o suficiente para uso guiado diário em diversas condições de água.
      features:
        - Plataformas SUP extraestáveis (82 cm ou mais de largura) para iniciantes
        - Opções de caiaque duplo para configurações de passeios em casal ou grupo
        - Capacidade de carga integrada para equipamento de mergulho, bolsas estanques e coolers
        - Documentação de conformidade CE + USCG para operações comerciais
