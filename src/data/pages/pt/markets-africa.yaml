hero:
  tagline: África
  title: SUP Placas Atacadistas para<br />Varejistas e Operadores Africanos
  subtitle: Operadores de turismo costeiro e varejistas de esportes aquáticos em toda a África — SUP novos painéis de estoque excedente de 5 unidades, modelos mistos, transporte expresso ou marítimo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Painéis de excedente para varejistas e operadores costeiros africanos
direct_answer: Paddle Board Overstock fornecem tábuas infláveis novas em folha SUP para empresas em toda a África — da África do Sul e Quênia ao Marrocos, Gana, Tanzânia e Egito. Os pedidos no atacado começam com 5 tábuas com modelos mistos em uma única remesta, enviadas de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada placa é 100% testada por pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo aos mercados turísticos costeiros do Norte da África até o Cabo
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado Africano SUP
  paragraphs:
    - Africa's coastline runs tens of thousands of kilometers through wildly different water worlds — the Atlantic surf towns of Morocco and South Africa, the reef-protected lagoons of Kenya and Tanzania, the Red Sea resorts of Egypt, and the growing beach scenes of West Africa. In each of them, stand-up paddle is finding its audience: turistas em busca de uma atividade aquática segura para a primeira água, e moradores locais construindo comunidades verdadeiras de canoagem.
    - Os negócios que compram SUP pranchas aqui são tipicamente pequenos e empreendedores — lojas de surfe adicionando uma opção de água calma, resorts de praia criando programas de atividades, operadores de mergulho e esportes aquáticos ampliando sua oferta, e lodges de safári e praia adicionando paddles ao pôr do sol. Eles fazem pedidos em frotas pequenas e precisam de pranchas que funcionem no primeiro dia e aguentem temporada após temporada.
  customer_types:
    - title: Resorts e Pousadas Costeiras
      description: Resorts de praia e safáris e lodges na praia adicionando SUP sessões para os hóspedes — pequenas frotas mistas, reabastecimento sazonal fácil.
    - title: Operadores de Esportes Aquáticos e Mergulho
      description: Operadores existentes adicionando SUP aluguel e aulas junto com operações de mergulho ou pipas.
    - title: Lojas de Surf e Praia
      description: Os varejistas nas cidades africanas estabelecidas de surfe estão se expandindo para águas calmas e fazendo turnês SUP para locais e turistas.
shipping_section:
  title: Navio para a África
  paragraphs:
    - Os pedidos são enviados de Weihai, China. O transporte aéreo expresso transporta amostras, 1–3 ordens de embarque e reabastecimento urgente para os principais aeroportos africanos; o frete marítimo consolidado atende de 5 a 20 pedidos de embarque no atacado pelos principais portos da região. Ambas as opções são cotadas com tempos estimados de trânsito para o seu destino específico.
    - Preparamos documentação completa de exportação — fatura comercial e lista de embalagem — e podemos apoiar seu corretor com qualquer papelada adicional que o processo de liberação exigir.
  customs_note: Os regimes de importação variam bastante entre os países africanos, e as taxas de imposto sobre equipamentos esportivos mudam periodicamente. Confirme as regras atuais com sua autoridade local ou agente de aprovação antes de fazer o pedido; fornecemos toda a documentação padrão.
faq_section:
  title: Perguntas Frequentes sobre África
  items:
    - q: Quais mercados africanos você atende?
      a: Enviamos para todo o continente, com guias dedicados para África do Sul e Quênia — além de destinos do Marrocos e Egito para Gana e Tanzânia. Confirme sua localização no seu pedido de orçamento.
    - q: Uma pequena loja pode pedir apenas alguns quadros?
      a: Sim — é exatamente para isso que o modelo de excedente foi construído. Cinco pranchas é o mínimo, modelos mistos são bem-vindos, e pequenas primeiras frotas são comuns entre os clientes do resort.
    - q: Como os aluguéis se sustentam em água salgada e sol?
      a: As pranchas usam a construção drop-stitch PVC que fornecemos para frotas de aluguel em todo o mundo. Enxágue após o uso em água salgada e armazene à sombra quando possível — cuidados padrão que mantêm as pranchas de aluguel utilizáveis por várias temporadas.
    - q: Quais são os passos para pagamento e envio?
      a: Você solicita um orçamento, nós confirmamos o estoque e apresentamos o preço unitário e opções de frete, você aprova o orçamento final, e nós testamos, embalamos e enviamos com rastreamento porta a porta. Os termos de pagamento são confirmados no momento da cotação.
