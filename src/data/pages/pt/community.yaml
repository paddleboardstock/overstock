stories:
  tagline: Histórias de Exploradores
  title: Aventuras reais de pessoas reais
  subtitle: Ouça relatos de remadores, famílias e profissionais que usam Paddle Board Overstock equipamentos na água.
  items:
    - name: Sarah & Mike
      title: SUP Proprietários do Explorer 11, Canadá
      content: Levamos nossos Explorer 11 para uma viagem de uma semana pelo Algonquin Park. Eles lidavam com portagens e travessias de lagos lindamente. A drop-stitch construção permitia que pudéssemos inflar até 15 PSI e obter desempenho em pranchas rígidas com uma prancha compactável.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Parque Algonquin, Canadá
    - name: Carlos R.
      title: Piloto Cheetah Surge, Espanha
      content: O Cheetah Surge é meu lugar preferido para cruzeiros costeiros. O design vibrante chama atenção na praia, e a estabilidade me dá confiança em leve onda. Ele se comporta lindamente, seja em turnê ou apenas curtindo o pôr do sol.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Espanha
    - name: Lina & família
      title: Remadores de Lótus Fluídos, Suécia
      content: Aventuras em família de fim de semana no arquipélago. O Flowing Lotus é estável o suficiente para minha filha ficar em pé enquanto eu remo. Infla em menos de 10 minutos — sem necessidade de trailer, só pura diversão em família na água.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Arquipélago de Estocolmo, Suécia
    - name: Andres D.
      title: Ocean Voyager explorer, Filipinas
      content: Uso minha Ocean Voyager para passeios costeiros de longa distância ao redor de Palawan. Depois de meses de uso diário em condições tropicais, a prancha ainda funciona como nova. O formato de turismo corta o movimento que impediria pranchas menores.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipinas
    - name: Emma T.
      title: Tropical Breeze iniciante, Austrália
      content: Eu nunca tinha estado em um SUP antes. O Tropical Breeze é tão estável que me senti confiante na primeira tentativa. Agora eu remar todo fim de semana. A curva de aprendizado é praticamente zero — e a prancha fica incrível na água.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Austrália
