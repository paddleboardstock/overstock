hero:
  tagline: Indonésia
  title: SUP Placas Atacadistas para<br />Negócios Indonésios
  subtitle: Lojas de esportes aquáticos em Bali, resorts insulares e operadores por todo o arquipélago — tábuas novas de 5 unidades, modelos mistos, enviadas da China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Tábuas de excedentes para resorts indonésios e lojas de esportes aquáticos em Bali
direct_answer: Paddle Board Overstock fornece pranchas infláveis novas em folha SUP para empresas indonésias — lojas de esportes aquáticos em Bali, resorts insulares de Lombok a Gillis e além, clubes de praia e operadores de aluguel. Os pedidos no atacado começam com 5 pranchas, com modelos mistos em um único envio, enviados de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada prancha é 100% testada por pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo à economia de esportes aquáticos e aos resorts insulares de Bali em todo o país
  - Rotas curtas de carga China–Indonésia, aéreas ou marítimas
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado Indonésio SUP
  paragraphs:
    - A Indonésia é uma das grandes economias de esportes aquáticos da Ásia, e Bali é seu coração pulsante. Dos clubes de praia de Seminyak e Canggu às calmas lagoas de Sanur e Nusa Dua, pranchas de remo aparecem por toda parte — remadas ao nascer do sol sobre recifes, SUP aulas de yoga, passeios pela lagoa e programas para hóspedes de hotéis. Além de Bali, Lombok, as Ilhas Gili e as crescentes cenas turísticas pelo arquipélago seguem o mesmo padrão.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: durabilidade, UV desempenho e facilidade de reparo importam mais do que o brilho do catálogo. Os pedidos são de 5 a 20 tábuas, misturadas para aulas, aluguel e exposição no varejo.
  customer_types:
    - title: Lojas de Esportes Aquáticos de Bali
      description: Operadores estabelecidos em Sanur, Seminyak e Canggu, adicionando SUP linhas de surf, mergulho e snorkel.
    - title: Resorts de Ilha e Clubes de Praia
      description: Resorts e clubes de praia em Bali, Lombok e Gillis oferecem programas de remo para hóspedes e SUP yoga.
    - title: Operadoras de Turismo e Aluguel
      description: Operadores turísticos de lagoas e manguezais e barracas de aluguel por hora renovando frotas sazonalmente.
shipping_section:
  title: Navio para a Indonésia
  paragraphs:
    - A Indonésia é uma das rotas de carga mais curtas a partir da nossa base em Weihai, China. O transporte aéreo expresso transporta amostras e 1 a 3 pedidos de embarque rapidamente para Denpasar e Jacarta; o frete marítimo consolidado atende de 5 a 20 pedidos de embarcado no atacado através de Tanjung Priok, Tanjung Benoa e outros portos. Ambas as opções são cotadas com tempos estimados de trânsito para o seu destino.
    - Fornecemos as exigências comerciais de fatura e lista de embalagem, com códigos HS corretos e valores declarados. Taxas e impostos de importação são pagos pelo importador segundo as regras indonésias.
  customs_note: A autorização indonésia para equipamentos esportivos é sensível à documentação — trabalhe com seu corretor alfandegário (PPJK) para confirmar o tratamento atual de impostos e impostos. Fornecemos documentação completa e consistente e respondemos rapidamente aos pedidos dos corretores.
faq_section:
  title: FAQ sobre Indonésia
  items:
    - q: Quão rápido é o transporte de carga da China para Bali?
      a: A Indonésia é um dos destinos de carga mais próximos de Weihai. O avião expresso para Denpasar ou Jacarta é a opção mais rápida para amostras e pequenos pedidos; o frete marítimo consolidado é cotado com janela de trânsito para pedidos atacados. Ambos estão detalhados no seu orçamento.
    - q: As pranchas são adequadas para aluguel diário em tropical UV?
      a: Sim — drop-stitch PVC a construção classificada para ciclos diários de aluguel é o que fornecemos para frotas em 50+ países. Cuidados padrão (enxaguar após água salgada, armazenamento sombreado) os mantém em operação durante muitas estações do sol em Bali.
    - q: Como é um pedido de loja de esportes aquáticos?
      a: Normalmente 5–15 pranchas, misturando modelos estáveis e versáteis para aulas e aluguel, e algumas edições premium de arte para exibição no varejo — um envio, precificado pelo total da quantidade.
    - q: Você pode apoiar nosso PPJK com documentação?
      a: Sim. Cada pedido é enviado com fatura comercial e lista de embalagem com códigos HS corretos e valores declarados, e respondemos rapidamente quando seu despachante precisar de documentos adicionais.
