hero:
  tagline: Capacidade de Produção
  title: Capacidade de Fabricação e Produção Anual
  subtitle: Instalação de 12.000 m² produzindo 15.000 pranchas por ano com possibilidade de expansão
intro: Paddle Board Overstock opera uma das maiores fábricas dedicadas à fabricação de pranchas infláveis SUP em Weihai, China. Nossa fábrica de 12.000 m² está organizada em seis oficinas especializadas operando em paralelo, proporcionando a capacidade de produzir 15.000 pranchas anualmente nas linhas all-around, touring e art-series SUP.
highlights:
  - value: 12,000 m²
    label: Piso total de fabricação
    detail: Em 6 oficinas especializadas
  - value: 15,000
    label: Placas produzidas anualmente
    detail: All-around, touring e art-series SUPs
  - value: 200-300
    label: Mão de obra qualificada
    detail: 25+ engenheiros, 2 turnos/dia
  - value: 50+
    label: Países de exportação
    detail: UE, EUA, AU, Oriente Médio, Ásia
  - value: 2-3
    label: Dias úteis para envio
    detail: Pedidos em estoque saem rapidamente de Weihai
  - value: 10+
    label: Anos de experiência em exportação
    detail: Desde 2012
workshops:
  - title: SUP Produção de Pranchas
    description: '4 linhas de montagem paralelas para pranchas infláveis SUP. Cada linha pode produzir 50–80 pranchas por turno. Estações de impressão digital e serigrafia operam simultaneamente. Capacidade anual SUP: 8.000+ pranchas.'
    output: 8.000+ SUPs/ano
  - title: Arte do Baralho & EVA Acabamento
    description: Oficina de acabamento dedicada para decks da art-series. Corte EVA de precisão, padrões de deck aplicados manualmente e acabamento final. A capacidade anual cobre toda a gama da art-series.
    output: Gama completa da art-series
  - title: Drop-Stitch Laminação
    description: 'Linhas de laminação a quente unem núcleos drop-stitch a laminados externos PVC. As faixas de borda são fundidas em três camadas para resistência hermética. Capacidade anual: 15.000+ núcleos.'
    output: 15.000+ núcleos/ano
  - title: Acessórios e Embalagem
    description: Linhas de montagem de acessórios e embalagem para bombas, remos, leashes e kits de reparo. As pranchas são embaladas a vácuo, caixas e paletizadas para envio mundial.
    output: Pacotes completos, prontos para envio
