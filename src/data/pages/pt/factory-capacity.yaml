hero:
  tagline: Capacidade de Produção
  title: Capacidade de Produção e Produção Anual
  subtitle: Instalação de 12.000 m² produzindo 15.000 barcos por ano com espaço para expandir

intro: A Aquafarer opera uma das maiores instalações dedicadas à fabricação de barcos infláveis em Qingdao, China. Nossa fábrica de 12.000 m² está organizada em seis oficinas especializadas operando em paralelo, dando-nos capacidade para produzir 15.000 barcos por ano nas linhas de SUP, caiaques, botes, RIB e equipamentos de segurança.

highlights:
  - value: 12,000 m²
    label: Área total de produção
    detail: Distribuída em 6 oficinas especializadas
  - value: 15,000
    label: Barcos produzidos por ano
    detail: SUPs, caiaques, RIBs, botes, equipamentos de segurança
  - value: 200-300
    label: Força de trabalho qualificada
    detail: Mais de 25 engenheiros, 2 turnos/dia
  - value: 50+
    label: Países de exportação
    detail: UE, EUA, Austrália, Oriente Médio, Ásia
  - value: 30–45
    label: Prazo de entrega padrão (dias)
    detail: Da confirmação do PO ao FOB
  - value: 10+
    label: Anos de experiência em exportação
    detail: Desde 2012

workshops:
  - title: Produção de Pranchas de SUP
    description: '4 linhas de montagem paralelas para pranchas de SUP infláveis. Cada linha produz 50 a 80 pranchas por turno. Estações de impressão digital e serigrafia operam simultaneamente. Capacidade anual de SUP: mais de 8.000 pranchas.'
    output: 8.000+ pranchas/ano
  - title: Produção de Barcos RIB
    description: 'Oficina dedicada de cascos de fibra de vidro com 6 estações de moldes para cascos de RIB de até 7,6 m. Área de soldagem e montagem de tubos atende 3 a 5 RIBs simultaneamente. Capacidade anual de RIB: mais de 2.000 barcos.'
    output: 2.000+ RIBs/ano
  - title: Barco Inflável e Bote
    description: 'Linhas de produção versáteis para barcos infláveis, caiaques e botes. Estações de soldagem a ar quente, prensas dielétricas de RF e postos de montagem são reconfigurados conforme o mix de pedidos. Capacidade anual: mais de 5.000 unidades.'
    output: 5.000+ unidades/ano
  - title: Equipamento de Segurança
    description: 'Área de produção separada em sala limpa para coletes salva-vidas e equipamentos de segurança. Costura dedicada, inserção de espuma e estações de teste. Capacidade anual de coletes: mais de 50.000 unidades.'
    output: 'Mais de 50.000 coletes/ano'

oem_capacity:
  moq: 'SUP: 5–10 unidades | RIB: 2–5 unidades | Caiaque/Bote: 10–20 unidades | Molde personalizado: 200+ unidades'
  lead_time: 'Padrão de 30 a 45 dias. Amostra em 15 a 20 dias. Urgência disponível.'
  payment: 'T/T 30% de sinal + 70% antes do embarque. L/C, Western Union aceitos.'
