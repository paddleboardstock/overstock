philosophy:
  tagline: Filosofia de Design
  title: Design Guiado pela Engenharia<br />— Cada Detalhe Importa
  subtitle: Nossa filosofia de engenharia se baseia em três princípios que orientam cada produto que construímos.
  list:
    - 'Confiabilidade em Primeiro Lugar: Cada produto é testado para suportar condições do mundo real — de expedições em águas frias a aluguel em praias tropicais. Superdimensionamos onde é mais importante.'
    - 'Precisão na Fabricação: Nossas instalações utilizam corte de alta precisão, soldagem de alta frequência e teste de pressão automatizado. Cada costura, cada válvula, cada ajuste atende às especificações documentadas.'
    - 'Inovação Contínua: Nossa equipe de P&D avalia continuamente novos materiais, métodos de produção e melhorias de design. Não esperamos problemas — nós os antecipamos.'
cta:
  title: Quer discutir um projeto com nossa equipe?
