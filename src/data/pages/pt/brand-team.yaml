hero:
  tagline: Nossa equipe
  title: As Pessoas por Trás de Paddle Board Overstock<br />— Engenharia da Liberdade na Água
  subtitle: Fundada em 2012 em Weihai, China, Paddle Board Overstock foi criada por engenheiros navais, cientistas de materiais e entusiastas de esportes aquáticos que acreditavam em tornar pranchas de stand up paddle infláveis de nível profissional acessíveis mundialmente.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock foto completa da equipe — engenharia, produção e liderança
founding:
  tagline: Nossa Fundação
  title: De uma Oficina Costeira<br />para uma Instalação de 12.000 m²
  subtitle: Paddle Board Overstock foi fundada por uma equipe de engenheiros navais com décadas de experiência combinada em design de SUP infláveis, construção de drop-stitch e fabricação global de esportes aquáticos.
  items:
    - title: 'Fundada: 2012'
      description: Estabelecida em Weihai, China — um importante centro marítimo com profunda tradição em construção naval.
      icon: tabler:calendar
    - title: 200-300 Funcionários
      description: Incluindo 14+ engenheiros de P&D, especialistas em controle de qualidade e técnicos de produção.
      icon: tabler:users
    - title: Instalação de 12.000 m²
      description: Planta de fabricação dedicada com 6 linhas de produção para pranchas e acessórios SUP.
      icon: tabler:building-factory
    - title: 50+ Países Atendidos
      description: Exportando para Europa, Américas, Oriente Médio, Ásia-Pacífico e África.
      icon: tabler:globe
