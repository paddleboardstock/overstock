philosophy:
  tagline: Filosofia de Design
  title: 'Design Liderado pela Engenharia<br />— Cada Detalhe Conta'
  subtitle: 'A nossa filosofia de engenharia centra-se em três princípios que orientam todos os produtos que construímos.'
  list:
    - 'Confiabilidade em Primeiro Lugar: Todos os produtos Paddle Board Overstock são testados para resistir a condições reais — desde operações de salvamento em águas frias a alugueres em resorts tropicais. Reforçamos a engenharia onde mais importa.'
    - 'Precisão de Fabrico: As nossas instalações usam corte CNC, soldadura de alta frequência e ensaios de pressão automatizados. Cada costura, cada válvula, cada acessório cumpre especificações documentadas.'
    - 'Inovação Contínua: A nossa equipa de I&D avalia continuamente novos materiais, métodos de produção e melhorias de design. Não esperamos pelos problemas — antecipamo-los.'
cta:
  title: 'Quer discutir um projeto com a nossa equipa?'
  subtitle: 'Os nossos engenheiros estão prontos para aconselhar sobre seleção de produtos, personalização e parcerias OEM/ODM.'
  actions:
    - variant: primary
      text: Fale com a nossa equipa
      href: /contact
    - text: Ver os nossos produtos
      href: /products
