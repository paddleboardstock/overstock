hero:
  tagline: A Nossa Equipa
  title: 'As Pessoas por Trás da Paddle Board Overstock<br />— Engenharia de Liberdade na Água'
  subtitle: 'Fundada em 2012 em Qingdao, China, a Paddle Board Overstock foi criada por engenheiros navais, especialistas em materiais e entusiastas de desportos aquáticos que acreditavam em tornar as embarcações insufláveis de nível profissional acessíveis em todo o mundo.'
  image:
    src: /images/team-all.webp
    alt: Foto da equipe completa da Paddle Board Overstock — engenharia, produção e liderança
founding:
  tagline: A Nossa Fundação
  title: 'De uma oficina costeira<br />a uma instalação de 12,000 m²'
  subtitle: 'A Paddle Board Overstock foi fundada por uma equipa de engenheiros navais com décadas de experiência combinada em design de barcos insufláveis, fabrico em PVC/Hypalon e produção global de equipamento marítimo.'
  items:
    - title: "Fundação: 2012"
      description: 'Estabelecida em Qingdao, China — um importante centro marítimo com forte herança de construção naval.'
      icon: tabler:calendar
    - title: 200-300 colaboradores
      description: 'Incluindo mais de 50 engenheiros de I&D, especialistas de controlo de qualidade e técnicos de produção.'
      icon: tabler:users
    - title: Instalações de 12,000 m²
      description: 'Fábrica dedicada com 6 linhas de produção para RIBs, barcos insufláveis e pranchas de SUP.'
      icon: tabler:building-factory
    - title: '50+ países servidos'
      description: 'Exportação para a Europa, Américas, Médio Oriente, Ásia-Pacífico e África.'
      icon: tabler:globe
