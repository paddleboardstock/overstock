content_segments:
  tagline: Perfis de parceiros
  title: Modelos de parceria de distribuição<br />Por tipo de parceiro
  subtitle: Diferentes distribuidores trazem diferentes pontos fortes de entrada no mercado – infraestrutura regional, alcance do comércio eletrônico, varejo especializado ou portfólios multimarcas. Estruturamos termos de parceria, níveis de preços e níveis de suporte para corresponder a cada perfil de parceiro.
  items:
    - title: Distribuidores Marítimos Regionais
      subtitle: Distribuição B2B exclusiva do território
      description: Distribuidores estabelecidos com infraestrutura de armazéns, redes de revendedores e recursos logísticos atendendo revendedores marítimos, varejistas de esportes aquáticos e locadores em um território geográfico definido. Você precisa de uma linha completa de produtos, preços protegidos e capacidade de atender contas de revendedores com estoque e suporte local.
      features:
        - Proteção exclusiva de território com termos de compromisso mínimo
        - Preços de atacado em todo o catálogo com rebates trimestrais por volume
        - Programa de consignação de stock local para SKUs de rotação rápida
        - Formação de rede de revendedores e programas de marketing co-branding
    - title: Comércio eletrônico e varejistas on-line
      subtitle: Canais de distribuição digitais
      description: Varejistas on-line que vendem equipamentos para esportes aquáticos por meio da Amazon, eBay ou de suas próprias plataformas de comércio eletrônico. Velocidade de lançamento no mercado, preços competitivos e logística direta ao consumidor são essenciais. Você precisa de um parceiro que possa enviar pedidos individuais de sua marca com atendimento rápido e risco zero de estoque.
      features:
        - 'Programa de drop-shipping: expedição direta da fábrica com a sua marca'
        - Feed de inventário em tempo real via API para a sua plataforma de e-commerce
        - Integração com Amazon Seller Central com suporte EAN/UPC
        - Logística de devoluções e processamento de reclamações de garantia incluídas
    - title: Varejistas especializados em esportes aquáticos
      subtitle: Parceiros de showrooms físicos
      description: Lojas físicas de varejo especializadas em equipamentos para esportes aquáticos – atendendo remadores, pescadores e velejadores locais com vendas presenciais, demonstrações e serviço pós-venda. Você precisa de embalagens otimizadas para varejo, programas de unidades de demonstração e materiais de ponto de venda que convertam clientes visitantes.
      features:
        - 'Programa de unidades de demonstração: quadros de exposição em showroom com desconto'
        - Embalagem pronta para retalho com design de caixa otimizado para prateleira
        - Expositores de ponto de venda, tabelas comparativas e guias de compra
        - Formação e certificação de pessoal em loja
    - title: Distribuidores multimarcas e lojas de departamentos
      subtitle: Distribuição ampla de artigos esportivos
      description: Distribuidores de grande porte que atendem lojas de departamentos, grandes varejistas e redes de artigos esportivos com catálogos multimarcas. Consistência, documentação de conformidade e conformidade do fornecedor são fundamentais – cada SKU deve atender aos padrões de embalagem, rotulagem e qualidade específicos do varejista.
      features:
        - 'Documentação de conformidade para retalhistas: especificação de embalagem, código de barras, rotulagem'
        - Integração EDI/ASN para os principais sistemas de encomenda de retalhistas
        - Inventário gerido pelo fornecedor e programas de reposição automática
        - Gestão de conta dedicada com SLA de resposta em 24 horas
