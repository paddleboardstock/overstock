process_steps:
  title: Processo de 6 Etapas OEM/ODM
  subtitle: Do briefing de design ao FOB Qingdao — um fluxo de trabalho simplificado
  steps:
    - number: '01'
      title: Brief de Design e Modelagem 3D em CAD
      description: Compartilhe suas especificações alvo, produto de referência ou conceito. Nossa equipe de engenharia desenvolve desenhos CAD detalhados e renderizações 3D para sua aprovação.
      timeline: 3–5 dias
    - number: '02'
      title: Seleção de Materiais e Teste de Tecidos
      description: Escolha entre tecidos de grau militar PVC (0,9–1,2 mm), Hypalon CSM ou drop-stitch core. Realizamos testes de resistência à tração, aderência de revestimento e estabilidade UV.
      timeline: 2–3 dias
    - number: '03'
      title: Protótipo rápido e produção de amostras
      description: Nós CNC-maquinamos moldes personalizados e produzimos amostras de pré-produção com as cores da sua marca, logotipo e materiais especificados. Amostras enviadas para sua aprovação.
      timeline: 7–14 dias
    - number: '04'
      title: Teste de Retenção em Alta Pressão de 24–48 Horas
      description: Cada protótipo passa por rigorosos testes de retenção de pressão a 1,25 vezes a pressão nominal. Testes de descolamento de costura e verificação dimensional são realizados.
      timeline: 1–2 dias
    - number: '05'
      title: CE/ISO Inspeção de Qualidade e Embalagem
      description: Lista de verificação de qualidade de 100 pontos. Cada unidade é inspecionada antes da embalagem pronta para venda. Declaração de conformidade CE e relatório de conformidade BSCI incluídos.
      timeline: 2–3 dias
    - number: '06'
      title: Transporte e Logística FOB Qingdao
      description: Produtos acabados paletizados, embalados a vácuo e carregados em contêiner no porto de Qingdao. Documentação completa de exportação, liberação alfandegária e rastreamento em tempo real.
      timeline: 7–14 dias
