faq:
  title: OEM/ODM — Perguntas Frequentes
  questions:
    - q: Qual é a quantidade mínima de pedido (MOQ) para SUPs infláveis personalizados?
      a: Para modelos padrão com moldes existentes, MOQ começa em 5–10 unidades por design. Para moldes e ferramentas totalmente personalizadas, MOQ é geralmente de 200 unidades. Trabalhamos com startups e marcas emergentes para encontrar pontos de entrada viáveis.
    - q: Qual é o MOQ para barcos RIB personalizados?
      a: Os modelos RIB começam com 2 a 5 unidades por design usando moldes existentes, enquanto moldes RIB totalmente personalizados requerem compromissos maiores. Trabalhamos com startups e marcas estabelecidas para encontrar pontos de entrada viáveis.
    - q: Quanto tempo leva o processo de amostra OEM?
      a: Amostras de protótipos padrão são concluídas dentro de 7 a 14 dias úteis após a aprovação do design. Pedidos urgentes podem ser priorizados para 5 a 7 dias mediante taxa adicional.
    - q: Qual é a diferença entre PVC e Hypalon para barcos infláveis?
      a: PVC é mais leve, mais acessível e oferece excelente flexibilidade em clima frio. Hypalon (CSM) fornece superior UV e resistência ao ozônio com uma vida útil mais longa (10–15 anos contra 5–8 anos). Recomendamos PVC para a maioria das aplicações recreativas e Hypalon para uso comercial/profissional.
    - q: Você pode personalizar o formato e o design do inflável?
      a: Sim. Nossa equipe de P&D pode desenvolver moldes personalizados para qualquer forma de casco, contorno de prancha ou configuração de tubo. Usamos moldes de alumínio usinados CNC para precisão e consistência.
    - q: Você oferece serviços de auditoria de fábrica?
      a: Recebemos auditorias de fábrica no local e de terceiros em nossa instalação de 12.000 m² em Qingdao. Mantemos as certificações ISO 9001 e BSCI e podemos compartilhar relatórios de auditoria mediante NDA.
    - q: Quais termos de envio vocês oferecem?
      a: Oferecemos termos de envio FOB Qingdao (padrão), CIF e DDP. O carregamento do contêiner e a documentação completa de exportação estão incluídos em todos os pedidos OEM.
content_profiles:
  tagline: Perfis de Marca
  title: OEM / Fabricação de Marca Própria<br /> Por Tipo de Cliente
  subtitle: Diferentes perfis de marca vêm com requisitos distintos — nós adaptamos nossos serviços OEM/ODM para corresponder ao seu modelo de negócio, escala e estratégia de entrada no mercado.
  items:
    - title: Marcas de Embarcações Startup
      subtitle: Baixo MOQ, aumento rápido
      description: Empreendedores e fundadores lançando sua primeira linha de barcos RIB, SUPs ou botes infláveis. Você precisa de um parceiro de fabricação que trate sua marca como se fosse sua — com baixos limites de entrada, tamanhos de lote flexíveis e orientação prática de design em cada etapa do processo.
      features:
        - MOQ tão baixo quanto 2–5 unidades (RIB) / 5–10 unidades (SUP) por SKU
        - Biblioteca de moldes pré-existentes para pular os custos de ferramentas
        - 'Pacote completo de branding: logotipo, gráficos para tubos, embalagens, etiquetas penduradas'
        - Fluxo de trabalho sample-first — aprovar antes da produção
    - title: Marcas Marinhas Estabelecidas
      subtitle: OEM escala com CE/ISO conformidade
      description: Marcas existentes de barcos, PWC ou acessórios marítimos adicionando embarcações infláveis ao seu portfólio. Você precisa de qualidade consistente em todas as produções, conformidade regulatória para mercados globais e a capacidade de co-desenvolver cascos ou formatos de tubos personalizados.
      features:
        - Engenharia de moldes 3D personalizados para designs proprietários
        - CE 2013/53/UE, UKCA, USCG documentação de conformidade
        - Relatórios de auditoria social BSCI para conformidade de varejistas
        - Gerenciamento de conta dedicado + slots de produção prioritários
    - title: Marcas DTC e de E-Commerce
      subtitle: Embalagem pronta para varejo em grande escala
      description: Marcas que priorizam o online vendendo através da Amazon, Shopify ou suas próprias lojas na web. Embalagem, experiência de unboxing e qualidade consistente das unidades são críticas. Você precisa de uma fábrica que compreenda a dinâmica de velocidade e taxa de devolução do comércio eletrônico.
      features:
        - Design de caixa pronto para varejo + impressão de cartão de inserção
        - Embalagem a vácuo / paletização para envio econômico
        - Código de barras EAN / UPC e documentação pronta para alfândega
        - Consolidação de contêineres mistos para otimizar o custo total
    - title: Operadores de Aluguel e Hospitalidade
      subtitle: Construções de nível frota para resorts e empresas de aluguel
      description: Resorts, centros de esportes aquáticos e operadores de aluguel precisam de frotas duráveis e de fácil manutenção com branding consistente. Nós fornecemos preços de frota, contêineres de modelos mistos e suporte a peças de reposição por anos de operação.
      features:
        - Preço de frota em pedidos de contêiner com modelos mistos
        - Opções de tubo e deck de grau comercial duráveis
        - Kits de peças sobressalentes e treinamento de manutenção
        - Branding consistente em SUP, RIB e frotas de caiaques
