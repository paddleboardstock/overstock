hero_text:
  tagline: Recursos
  title: 'Central de Downloads & Guias de Compra'
  subtitle: 'Acesse catálogos de produtos, guias OEM, checklists de compra e documentação técnica para ajudá-lo a tomar decisões de compra informadas.'
features3_downloads:
  tagline: Downloads
  title: 'Documentação de Produtos<br />& Recursos para Compradores'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Catálogo de Produtos Marítimos 2026'
      description: 'Linha completa de produtos incluindo barcos RIB, barcos infláveis, pranchas de SUP, caiaques e acessórios. Especificações, configurações e opções. Formato PDF.'
      icon: tabler:file-text
    - title: 'Guia de Manufatura OEM'
      description: 'Tudo o que você precisa saber sobre parcerias OEM/ODM: visão geral do processo, quantidades mínimas de pedido, opções de personalização, controle de qualidade e envio.'
      icon: tabler:building-factory
    - title: 'Guia de Compra de Barcos RIB'
      description: 'Como escolher o RIB certo: materiais do casco, materiais dos tubos, seleção de motor, considerações de tamanho e opções de configuração para diferentes aplicações.'
      icon: tabler:file-description
    - title: 'Checklist de Fornecedor de SUP'
      description: 'Considerações-chave ao selecionar um fabricante de pranchas de SUP: indicadores de qualidade, requisitos de certificação, considerações de MOQ e o que procurar em uma auditoria de fábrica.'
      icon: tabler:clipboard-check
    - title: 'Guia de Materiais para Barcos Infláveis'
      description: 'PVC vs Hypalon: comparação de durabilidade, resistência UV, vida útil, opções de reparo e considerações de custo para diferentes aplicações marítimas.'
      icon: tabler:files
    - title: 'Modelo de Brief de Manufatura Personalizada'
      description: 'Baixe nosso modelo de brief de produto. Preencha seus requisitos e devolva-nos para uma cotação na mesma semana e avaliação de viabilidade.'
      icon: tabler:template
faqs:
  title: Perguntas Frequentes
  subtitle: 'Perguntas comuns sobre nossos produtos, processo de manufatura e modelo de parceria.'
  columns: 2
  items:
    - title: Qual é a quantidade mínima de pedido?
      description: 'O MOQ varia por categoria de produto. Barcos RIB geralmente começam em 10 unidades por modelo. Pranchas de SUP a partir de 50 unidades. Contate nossa equipe de vendas para informações de MOQ específicas por produto.'
      icon: tabler:help-circle
    - title: Posso obter amostras antes de fazer um pedido?
      description: 'Sim. A Paddle Board Overstock oferece produção de amostras para avaliação antes da produção em massa. Os custos de amostra são negociáveis e frequentemente creditados no primeiro pedido de produção.'
      icon: tabler:package
    - title: Quais condições de pagamento estão disponíveis?
      description: 'Condições padrão: 30% de depósito com o pedido, 70% antes do envio. Condições de LC disponíveis para clientes qualificados. Contate nossa equipe financeira para discutir arranjos.'
      icon: tabler:currency-dollar
    - title: Quanto tempo leva a produção?
      description: 'Prazos típicos: barcos RIB 30-45 dias, pranchas de SUP 20-30 dias, barcos infláveis 25-35 dias. Desenvolvimento personalizado adiciona 15-30 dias para prototipagem.'
      icon: tabler:calendar-clock
    - title: Quais certificações seus produtos possuem?
      description: 'Certificação CE para mercados da UE, manufatura aprovada pela Guarda Costeira dos EUA, sistema de qualidade ISO, conformidade BSCI e conformidade de materiais REACH.'
      icon: tabler:certificate
    - title: Vocês oferecem embalagem e branding personalizados?
      description: 'Sim. Fornecemos embalagem personalizada com seu logotipo, cores e identidade de marca. O MOQ para embalagem personalizada depende da categoria do produto.'
      icon: tabler:color-swatch
cta:
  title: 'Precisa de ajuda para encontrar o recurso certo?'
  subtitle: 'Contate nossa equipe para orientação personalizada sobre seleção de produtos, parcerias OEM ou especificações técnicas.'
  actions:
    - variant: primary
      text: Fale com nossa equipe
      href: /contact
