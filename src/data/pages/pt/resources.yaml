hero_text:
  tagline: Recursos
  title: Centro de Download e Guias de Remo
  subtitle: Catálogos de produtos, guias de compra e instruções de cuidados para ajudar você a escolher, usar e aproveitar sua SUP prancha inflável.
features3_downloads:
  tagline: Downloads
  title: Documentação do Produto<br />& Recursos para Remo
  isBeforeContent: false
  columns: 2
  items:
    - title: Catálogo de Produtos 2026 SUP
      description: 'A linha completa Paddle Board Overstock SUP : pranchas completas, séries de arte e acessórios, com especificações completas e conteúdo do pacote. Formato PDF.'
      icon: tabler:file-text
    - title: Guia de Compra Inflável SUP
      description: 'Como escolher sua primeira prancha: comprimento, largura, espessura, volume, correspondência do peso do usuário e qual formato de prancha combina com seu estilo de remo.'
      icon: tabler:file-description
    - title: SUP Guia de Tamanho e Ajuste
      description: Ajuste o volume e as dimensões da prancha ao seu peso e nível de habilidade, com recomendações específicas para atividades como recreação, tours, yoga e fitness.
      icon: tabler:clipboard-check
    - title: Guia de Cuidados e Manutenção de Pensões
      description: 'Mantenha sua placa como nova: limpeza, secagem, armazenamento, UV proteção, cuidados com a válvula e pequenas instruções de reparo.'
      icon: tabler:tool
    - title: Guia de Materiais para Tábuas Infláveis
      description: PVC construção, drop-stitch núcleos, EVA almofadas de deck e o que PSI a rigidez 15 significa para desempenho e durabilidade.
      icon: tabler:files
    - title: Começando com SUP
      description: 'Básicos para remador de primeira viagem: inflação, carregamento, lançamento, braçadas básicas e itens essenciais de segurança para você ficar em pé no primeiro dia.'
      icon: tabler:swimming
faqs:
  title: Perguntas Frequentes
  subtitle: Perguntas comuns sobre nossas pranchas, pedidos e como entrar na água.
  columns: 2
  items:
    - title: O que vem incluído na minha placa?
      description: Todo pacote completo inclui a prancha, remo ajustável, bomba de alto fluxo, coleira, kit de reparo e mochila. O Conjunto de Remos e Bomba também está disponível separadamente.
      icon: tabler:package
    - title: Quanto tempo a inflação leva?
      description: Com a bomba de alto fluxo incluída, a maioria dos remadores atinge a pressão máxima em 8-12 minutos. Bombas elétricas também funcionam — basta parar na pressão nominal impressa perto da válvula.
      icon: tabler:clock
    - title: Como escolho o tabuleiro certo?
      description: 'Comece pelo seu peso e estilo de remada: iniciantes e famílias adoram plataformas largas e estáveis como a SUP Explorer 11; praticantes de yoga preferem tração em convés total; remadores de turismo querem formas rígidas e aerodinâmicas. Nossa equipe tem prazer em recomendar.'
      icon: tabler:help-circle
    - title: Quais métodos de pagamento vocês aceitam?
      description: Aceitamos cartões de crédito principais, PayPal e transferências bancárias. Todos os preços incluem o pacote completo — sem extras ocultos.
      icon: tabler:currency-dollar
    - title: Quanto tempo leva a entrega?
      description: Os pedidos são enviados pela nossa fábrica e normalmente chegam em 5 a 10 dias úteis, dependendo da sua região. O rastreamento é fornecido para cada pedido.
      icon: tabler:truck-delivery
    - title: Meu skate está coberto pela garantia?
      description: Sim — cada skate está protegido contra defeitos de fabricação, e cada unidade é testada sob pressão de 1,25 vezes a pressão nominal por 24-48 horas antes de sair da fábrica. Nossa taxa de solicitações de garantia é inferior a 2%.
      icon: tabler:shield-check
cta:
  title: Precisa de ajuda para encontrar o skate certo?
  subtitle: Entre em contato com nossa equipe para obter conselhos honestos sobre seleção de skate, dimensionamento ou dúvidas sobre pedidos.
  actions:
    - variant: primary
      text: Entre em contato com nossa equipe
      href: /contact
