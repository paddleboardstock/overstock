features3_brand:
  tagline: Quem somos
  title: Fundação da Marca<br />e Herança
  subtitle: A história, a experiência e o alcance global que definem Paddle Board Overstock como uma marca SUP confiável.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sobre Paddle Board Overstock
      description: Fundada em 2012 em Weihai, China. De uma oficina à beira-mar a uma instalação de 12.000 m² — a história completa Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: História da marca
      description: Como uma equipe de engenheiros navais decidiu tornar pranchas de stand-up paddle infláveis de nível profissional acessíveis em todo o mundo.
      icon: tabler:book
      link: /brand-story
    - title: Experiência na indústria marítima
      description: Ciência de materiais avançada, fabricação de precisão e testes no mundo real — décadas de engenharia marítima em cada prancha.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Por que excesso de estoque de pranchas de remo
      description: O que nos diferencia — qualidade, personalização, preços diretos de fábrica e suporte completo para cada remador.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Nossa equipe
      description: Conheça a liderança — engenheiros navais, cientistas de materiais e especialistas em manufatura impulsionando Paddle Board Overstock adiante.
      icon: tabler:users
      link: /brand/team
    - title: Equipe de Engenharia
      description: 78+ anos combinados de P&D, 40+ plataformas, 1.200+ projetos de engenharia. A equipe técnica por trás de cada produto.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Confiança e Qualidade
  title: Qualidade, Teste<br />& Prova
  subtitle: Testes rigorosos, dados de teste reais e evidências que demonstram nosso compromisso com a qualidade.
  isBeforeContent: false
  columns: 3
  items:
    - title: Qualidade e testes
      description: Cada produto é testado sob pressão antes do envio. Resistência da costura, resistência aos raios UV, flutuabilidade – verificada em todas as etapas.
      icon: tabler:clipboard-check
      link: /quality
    - title: Evidências e Provas
      description: Resultados de testes, fotos de implantação, relatórios de inspeção de terceiros e estudos de caso validando a qualidade do Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Gráfico de conhecimento
      description: Explore o gráfico de entidades Paddle Board Overstock — produtos, tecnologias, materiais e relacionamentos em uma base de conhecimento conectada.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderança
  title: Conheça a Equipe<br />Atrás de Paddle Board Overstock
  subtitle: Especialização na indústria que abrange engenharia marítima, ciência dos materiais, gestão de qualidade e comércio eletrônico global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Fundador e CEO
      description: 15+ anos em fabricação naval. Anteriormente liderou P&D em um grande fabricante naval chinês. Possui várias patentes em design de produtos infláveis.
      icon: tabler:crown
    - title: Zhang Wei – Engenheiro Chefe
      description: 20+ anos em fabricação de polímeros e design de estruturas infláveis. Ex-diretor técnico em uma empresa europeia de engenharia naval.
      icon: tabler:engine
    - title: Chen Ming – Chefe de P&D
      description: Doutorado em Ciência dos Materiais. Especializa-se em tecnologia drop-stitch e soldagem de alta frequência. 10+ anos em compósitos têxteis.
      icon: tabler:flask
    - title: Liu Qiang – Diretor de Produção
      description: 18+ anos em manufatura enxuta. Implementou sistemas rigorosos de qualidade em todas as linhas de produção.
      icon: tabler:settings
    - title: Wang Fang — Gerente de Qualidade
      description: 12+ anos em controle de qualidade marinho. Lidera auditorias internas de qualidade. Supervisiona os testes de cada lote de produção.
      icon: tabler:shield-check
    - title: Helen Lee - Diretora de Vendas
      description: 15 anos em comércio eletrônico internacional e logística. Envia pranchas para remadores em 50 países. Fluente em 4 idiomas.
      icon: tabler:briefcase
cta:
  title: Quer prova da nossa qualidade?
  subtitle: Entre em contato conosco para relatórios de teste, registros de inspeção ou para agendar uma visita à fábrica.
  actions:
    - variant: primary
      text: Solicitar documentação
      href: /contact
