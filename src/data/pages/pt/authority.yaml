hero:
  tagline: Centro de Autoridade
  title: Por que Paddle Board Overstock?<br />Confiança Construída Ao Longo de Uma Década
  subtitle: Cada prancha que construímos carrega o peso de 10+ anos de engenharia naval, controle de qualidade rigoroso e milhares de remadores na água em todo o mundo. É por isso que os remadores escolhem Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock instalação de fabricação marítima e equipe de engenharia
