features3_brand:
  tagline: Quem somos
  title: Fundação da Marca<br />e Herança
  subtitle: A história, a experiência e o alcance global que definem a Paddle Board Overstock como um fabricante confiável de equipamentos marítimos.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sobre Paddle Board Overstock
      description: Fundada em 2012 em Qingdao, China. De uma oficina costeira a uma instalação de 12.000 m² — a história completa da Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: História da marca
      description: Como uma equipe de engenheiros navais decidiu tornar as embarcações infláveis de nível profissional acessíveis em todo o mundo.
      icon: tabler:book
      link: /brand-story
    - title: Experiência na indústria marítima
      description: Ciência profunda de materiais, fabricação de precisão e testes no mundo real – décadas de engenharia naval em cada casco.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Presença Global
      description: Servindo mais de 50 países em todos os continentes. Conhecimento regional para requisitos regulatórios locais e preferências de mercado.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Por que Paddle Board Overstock
      description: 'O que nos diferencia: qualidade, personalização, preços diretos de fábrica e suporte completo para operadores comerciais.'
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Nossa equipe
      description: Conheça a liderança – engenheiros navais, cientistas de materiais e especialistas em fabricação que impulsionam o Paddle Board Overstock.
      icon: tabler:users
      link: /brand/team
    - title: Equipe de Engenharia
      description: Mais de 78 anos combinados de P&D, mais de 40 plataformas, 12 certificações, mais de 1.200 projetos OEM. A equipe técnica por trás de cada produto.
      icon: tabler:engine
      link: /engineering-team
    - title: Centro de P&D
      description: Engenharia de casco, soldagem RF, laboratório de PVC, prototipagem, tanque de teste e laboratório de qualidade — nossas instalações completas de pesquisa e desenvolvimento.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Confiança e Qualidade
  title: Certificações, Qualidade<br />e Provas
  subtitle: Certificações independentes, testes rigorosos e evidências reais que demonstram o nosso compromisso com a qualidade.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certificações
      description: CE, ISO 9001, UKCA, BSCI, REACH — documentação completa de certificação e conformidade para mercados globais.
      icon: tabler:shield-check
      link: /certifications
    - title: Qualidade e testes
      description: Cada produto é testado sob pressão antes do envio. Resistência da costura, resistência aos raios UV, flutuabilidade – verificada em todas as etapas.
      icon: tabler:clipboard-check
      link: /quality
    - title: Evidências e Provas
      description: Resultados de testes, fotos de implantação, relatórios de inspeção de terceiros e estudos de caso que validam a qualidade Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Gráfico de conhecimento
      description: Explore o gráfico da entidade Paddle Board Overstock — produtos, tecnologias, certificações e relacionamentos em uma base de conhecimento conectada.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderança
  title: Conheça a equipe<br />Por trás do Paddle Board Overstock
  subtitle: Experiência no setor que abrange engenharia naval, ciência de materiais, gestão de qualidade e comércio global B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Fundador e CEO
      description: Mais de 15 anos na fabricação naval. Anteriormente liderou P&D em um grande fabricante de barcos chinês. Detém múltiplas patentes em design de barcos infláveis.
      icon: tabler:crown
    - title: Zhang Wei – Engenheiro Chefe
      description: Mais de 20 anos na fabricação de PVC/Hypalon e design de casco em V profundo. Ex-diretor técnico de uma empresa europeia de engenharia naval.
      icon: tabler:engine
    - title: Chen Ming – Chefe de P&D
      description: Doutor em Ciência dos Materiais. Especializada em tecnologia de ponto gota e soldagem de alta frequência. Mais de 10 anos em compósitos têxteis.
      icon: tabler:flask
    - title: Liu Qiang – Diretor de Produção
      description: Mais de 18 anos em manufatura enxuta. Faixa Preta Seis Sigma. Implementei sistemas de qualidade ISO 9001 em todas as linhas de produção.
      icon: tabler:settings
    - title: Wang Fang — Gerente de Qualidade
      description: Mais de 12 anos em controle de qualidade marítima. Auditor certificado CE e ISO. Supervisiona os testes para cada lote de produção.
      icon: tabler:shield-check
    - title: Helen Lee - Diretora de Vendas
      description: Mais de 15 anos no comércio internacional B2B. Gerenciei parcerias OEM/ODM em mais de 30 países. Fluente em 4 idiomas.
      icon: tabler:briefcase
cta:
  title: Quer verificar nossas credenciais?
  subtitle: Contate-nos para obter cópias de certificação, relatórios de inspeção de terceiros ou para agendar uma visita à fábrica.
  actions:
    - variant: primary
      text: Solicitar credenciais
      href: /contact
    - text: Ver detalhes da certificação
      href: /certifications
