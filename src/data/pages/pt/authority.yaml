hero:
  tagline: Centro de Autoridade
  title: Por que Paddle Board Overstock?<br />Confiança construída ao longo de uma década
  subtitle: Cada barco que construímos carrega o peso de mais de 10 anos de engenharia naval, sistemas de qualidade certificados e milhares de operações bem-sucedidas em todo o mundo. É por isso que os profissionais da indústria escolhem Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Instalação de fabricação marítima Paddle Board Overstock e equipe de engenharia
stats:
  title: Paddle Board Overstock em Números
  stats:
    - title: Anos em operação
      amount: Since 2012
    - title: Engenheiros de P&D
      amount: 50+
    - title: Países atendidos
      amount: 50+
