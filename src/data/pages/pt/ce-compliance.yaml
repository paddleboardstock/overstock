content_scope:
  tagline: Escopo de Conformidade
  title: Quais produtos precisam de<br />conformidade com RCD?
  subtitle: A Diretiva 2013/53/UE sobre embarcações de recreio aplica-se a embarcações de recreio com comprimento de casco entre 2,5 m e 24 m. Compreender o escopo é o primeiro passo para a conformidade.
  items:
    - title: Barcos RIB (2,5–24 m)
      description: Barcos infláveis rígidos com comprimentos de casco de 2,5 m a 24 m se enquadram no RCD. As categorias de projeto A a D aplicam-se dependendo das condições do mar pretendidas e da força máxima do vento.
      icon: tabler:sailboat
    - title: Barcos infláveis (menos de 2,5 m)
      description: Pequenos barcos insufláveis e botes com menos de 2,5 m podem estar parcialmente isentos de RCD, mas ainda requerem a marcação CE ao abrigo de outras directivas aplicáveis e normas de construção EN ISO 6185.
      icon: tabler:sailboat
    - title: Pranchas e acessórios SUP
      description: As pranchas de stand-up paddle estão fora do escopo do RCD. No entanto, os dispositivos de flutuação pessoal (PFDs) associados exigem a marcação CE sob o Regulamento PPE (UE) 2016/425 com aprovação USCG Tipo III/V quando aplicável.
      icon: tabler:swimming
    - title: Barcos parcialmente concluídos
      description: Os barcos entregues sem motor ou instalações específicas exigem uma Declaração do Construtor para embarcações parcialmente concluídas, com total conformidade com o RCD preenchida pelo construtor ou importador final.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistema de confiança de três camadas
  title: Informações de conformidade<br />— Compartilhadas no nível certo
  subtitle: Nem todos os dados de conformidade pertencem a um site público. Seguimos uma abordagem de três camadas que protege a propriedade intelectual e ao mesmo tempo cria a confiança do comprador.
  items:
    - title: Camada 1 – Site Público
      description: Normas referenciadas, rotas de conformidade explicadas, tipos de documentos listados, escopo de certificação por família de modelos. Nenhum certificado real, dados de teste ou detalhes de engenharia proprietários.
      icon: tabler:world
    - title: Camada 2 – Compartilhamento Pós-Consulta
      description: 'Após uma consulta qualificada: amostra do DoC redigida, foto da placa do construtor, lista de padrões aplicáveis, lista de verificação de conformidade e resumos de certificação de materiais — compartilhados sob termos de uso justo.'
      icon: tabler:mail
    - title: Camada 3 - NDA / Estágio do pedido
      description: Arquivo técnico completo, avaliações de risco, cálculos de estabilidade, relatórios de testes, registros de lotes de materiais e documentação de rastreabilidade de produção — compartilhados somente sob NDA com compradores confirmados.
      icon: tabler:lock
content_standards:
  tagline: Padrões Aplicáveis
  title: Padrões ISO e EN<br />Nós construímos para
  subtitle: Os nossos produtos são concebidos e testados de acordo com as normas harmonizadas do RCD. Números e nomes padrão são referenciados; os textos padrão completos permanecem com direitos autorais ISO.
  items:
    - title: EN ISO 6185-3
      description: 'Barcos insufláveis — Parte 3: Barcos com potência máxima de motor igual ou superior a 15 kW. Requisitos de construção, estabilidade, flutuabilidade e recuperação homem ao mar para RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Barcos insufláveis — Parte 4: Barcos com potência motora máxima de 15 kW e superior ou igual a 4,5 kW. Requisitos adicionais estruturais e de estabilidade.'
      icon: tabler:file-text
    - title: Série ISO 12215
      description: Embarcações pequenas — Construção do casco e escantilhões. Projeto estrutural de casco, convés e anteparas para cascos RIB de fibra de vidro e alumínio.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Pequenas embarcações – Manual do proprietário. Conteúdo e formato obrigatórios para o manual do proprietário que acompanha cada barco RIB entregue na UE.
      icon: tabler:book
    - title: EN ISO 14945
      description: Pequenas embarcações – Placa do construtor. Informações a serem marcadas na placa do construtor fixada permanentemente em cada embarcação.
      icon: tabler:badge
    - title: ISO 8666
      description: Pequenas embarcações — Dados principais. Medições e parâmetros padronizados para especificações consistentes em toda a documentação do produto.
      icon: tabler:dimensions
content_process:
  tagline: Processo de Conformidade
  title: Conformidade CE em 6 etapas<br />Fluxo de trabalho
  subtitle: Do escopo do projeto à rastreabilidade em nível serial – cada modelo RIB segue um caminho de conformidade definido.
  steps:
    - number: '01'
      title: Escopo e Classificação do Projeto
      description: Defina o modelo RIB, categoria de projeto (A/B/C/D), número máximo de pessoas, carga útil, potência do motor e mercado-alvo. Determine se o RCD se aplica e qual módulo de avaliação de conformidade é necessário.
      timeline: 2–3 dias
    - number: '02'
      title: Identificação de Requisitos Aplicáveis
      description: Identifique todos os requisitos essenciais de segurança aplicáveis do Anexo I do RCD, normas harmonizadas relevantes (EN ISO 6185, 12215, 10240, 14945) e quaisquer requisitos nacionais adicionais para o mercado-alvo.
      timeline: 3–5 dias
    - number: '03'
      title: Projeto e documentação técnica
      description: 'Crie o Arquivo Técnico Mestre: desenhos de disposição geral, cálculos de estabilidade e flutuabilidade, avaliação de risco, especificações de materiais e análise de segurança de sistemas (combustível, elétrico, direção).'
      timeline: 10–15 dias
    - number: '04'
      title: Verificação e testes de produtos
      description: Realize verificação física – testes de pressão a 1,25x a pressão nominal por 24 a 48 horas, testes de estabilidade e flutuabilidade, testes de carga e comissionamento de sistemas. Registre todos os resultados dos testes por casco.
      timeline: 5–7 dias
    - number: '05'
      title: Documentação de marcação e entrega
      description: Afixar a marcação CE, a placa do construtor (EN ISO 14945) e o HIN/CIN (número de identificação do casco). Preparar a Declaração de Conformidade da UE, o manual do proprietário (EN ISO 10240) e a lista de verificação de conformidade.
      timeline: 2–3 dias
    - number: '06'
      title: Rastreabilidade em nível serial
      description: Cada casco recebe um Registro de Casco exclusivo vinculando-o ao Arquivo Técnico Mestre, lote de produção, certificados de materiais, resultados de testes e configuração final. Registros retidos por mais de 10 anos por RCD.
      timeline: Em andamento
content_document_cards:
  tagline: Tipos de documentos
  title: Documento de Conformidade<br />Cartões
  subtitle: Estes são os tipos de documentos que preparamos e mantemos para cada modelo RIB com certificação CE. As amostras estão disponíveis mediante consulta qualificada.
  items:
    - title: Certificado de conformidade CE/RCD
      description: Certificado específico do modelo confirmando que a embarcação atende a todos os Requisitos Essenciais de Segurança aplicáveis do RCD 2013/53/UE, emitido pelo fabricante com envolvimento do Órgão Notificado quando necessário.
      icon: tabler:certificate
    - title: Declaração de Conformidade da UE (DoC)
      description: Declaração assinada pelo fabricante ou representante autorizado, listando as diretivas, padrões, módulo de conformidade e detalhes do Órgão Notificado aplicáveis. Obrigatório para todos os modelos colocados no mercado da UE.
      icon: tabler:file-check
    - title: Placa do Construtor (EN ISO 14945)
      description: Placa fixada permanentemente mostrando número máximo de pessoas, potência máxima do motor, categoria de projeto e identificação do fabricante. Deve permanecer legível durante a vida útil da embarcação.
      icon: tabler:badge
    - title: Manual do Proprietário (EN ISO 10240)
      description: Manual abrangente que abrange operação segura, procedimentos de emergência, cronogramas de manutenção e avisos de segurança. Obrigatório para todos os RIB entregues na UE.
      icon: tabler:book
    - title: Relatórios de teste e inspeção ISO
      description: Registros de testes de pressão (1,25x / 24–48h), resultados de testes de estabilidade e flutuabilidade, certificados de testes de materiais e relatórios de verificação dimensional – todos vinculados a números de casco específicos.
      icon: tabler:test-pipe
    - title: Registros de rastreabilidade de materiais
      description: Rastreabilidade em nível de lote para tecidos de tubos, adesivos, fibra de vidro e ferragens. Vincula cada unidade de produção aos certificados de materiais recebidos e aos resultados da inspeção IQC.
      icon: tabler:link
    - title: Inspeção de qualidade e registros de controle de qualidade
      description: Lista de verificação de qualidade de 100 pontos por unidade, registros de CQ em processo, relatórios de não conformidade e ações corretivas. Parte da cadeia de rastreabilidade da produção.
      icon: tabler:clipboard-check
    - title: Pacote de documentos do projeto
      description: Pacote de documentação por casco, incluindo registro de configuração final, detalhes de instalação de motores e equipamentos, lista de verificação de comissionamento e documentação de entrega.
      icon: tabler:package
content_design_categories:
  tagline: Categorias de projeto de RCD
  title: Categoria de design A–D<br />— O que significam
  subtitle: O RCD atribui categorias de projeto com base na força máxima do vento e na altura significativa das ondas que a embarcação foi projetada para suportar.
  items:
    - title: Categoria A - Oceano
      description: Projetado para viagens prolongadas onde a força do vento pode exceder Beaufort 8 (>40 nós) e a altura significativa das ondas pode exceder 4 m. Requer a mais rigorosa verificação estrutural e de estabilidade.
      icon: tabler:ripple
    - title: Categoria B – Offshore
      description: Projetado para viagens offshore com força de vento de até Beaufort 8 (≤40 nós) e altura significativa de onda de até 4 m. Adequado para águas costeiras e semi-expostas.
      icon: tabler:anchor
    - title: Categoria C – Costeira
      description: Projetado para viagens costeiras com ventos de até Beaufort 6 (≤27 nós) e altura significativa de ondas de até 2 m. A maioria dos RIBs recreativos se enquadra nesta categoria.
      icon: tabler:sun
    - title: Categoria D – Abrigada
      description: Projetado para águas abrigadas com força de vento até Beaufort 4 (≤16 nós) e altura significativa de onda de até 0,3 m. Lagos, rios e portos protegidos.
      icon: tabler:pool
content_hin:
  tagline: Identificação de artesanato
  title: HIN / CIN e Placa do Construtor
  subtitle: Cada barco RIB requer um Número de Identificação do Casco (HIN) ou Número de Identificação da Embarcação (CIN) e uma placa do construtor de acordo com os requisitos da EN ISO 14945 e RCD.
  items:
    - title: Número de identificação do casco (HIN)
      description: Um código exclusivo de 14 caracteres marcado permanentemente no lado estibordo do painel de popa, codificando o código do fabricante (MIC), ano do modelo, ano de produção e número de série. Necessário para entrada no mercado da UE.
      icon: tabler:hash
    - title: Número de identificação da embarcação (CIN)
      description: De acordo com a EN ISO 10087, um número de identificação secundário oculto colocado em um local oculto para fins antirroubo e rastreabilidade.
      icon: tabler:eye-off
    - title: Conteúdo da Placa do Construtor
      description: Número máximo de pessoas, potência máxima do motor (kW), carga máxima (kg), categoria de projeto, nome do fabricante e marcação CE — todos exibidos permanentemente em uma placa resistente à corrosão.
      icon: tabler:badge
content_tech_file:
  tagline: Estrutura do arquivo técnico
  title: Arquivo Técnico Mestre<br />e Registro do Casco
  subtitle: 'Nosso sistema de documentação segue uma estrutura de dois níveis: o Arquivo Técnico Mestre para cada família de modelos e os Registros de Casco individuais para cada barco produzido.'
  items:
    - title: Arquivo Técnico Mestre
      description: 'Contém a documentação completa de conformidade para uma família de modelos: arranjo geral, avaliação de risco, cálculos de estabilidade/flutuabilidade, especificações de materiais, padrões aplicáveis e registros de avaliação de conformidade. Mantido por mais de 10 anos.'
      icon: tabler:folder
    - title: Registro do casco (rastreabilidade por barco)
      description: 'Cada casco possui um registro único vinculando-o ao Arquivo Técnico Mestre: HIN, data de produção, lote de tubos, certificados de materiais, resultado do teste de pressão, configuração final, instalação do motor e destino de entrega.'
      icon: tabler:file-description
    - title: Pacote de Conformidade do Cliente
      description: Pacote de entrega por casco, incluindo DoC, foto da placa do construtor, manual do proprietário, resumo do teste e folha de configuração final – fornecido com cada RIB enviado para a UE.
      icon: tabler:package
faq:
  title: Conformidade CE – Perguntas Frequentes
  questions:
    - q: Todos os barcos Aquafarer RIB têm certificação CE para o mercado da UE?
      a: Os barcos RIB em nosso catálogo são projetados e documentados para conformidade com RCD 2013/53/UE de acordo com as diretivas aplicáveis da UE. A marcação CE aplica-se por modelo e por configuração. Entre em contato conosco para obter um documento de escopo de conformidade específico do modelo.
    - q: Qual é a diferença entre conformidade com RCD e marcação CE?
      a: A RCD (Diretiva Embarcações de Recreio 2013/53/UE) é a legislação da UE que estabelece requisitos essenciais de segurança. A marcação CE é o símbolo visual colocado num produto que foi avaliado e confirmado para cumprir esses requisitos. Um produto deve estar em conformidade com o RCD antes de poder ostentar a marca CE.
    - q: Vocês fornecem Declarações de Conformidade com cada barco?
      a: Sim. Cada barco RIB entregue no mercado da UE inclui uma Declaração de Conformidade da UE específica do modelo, listando as diretivas aplicáveis, padrões harmonizados, módulo de avaliação de conformidade e detalhes do Organismo Notificado.
    - q: Qual módulo de avaliação de conformidade o Aquafarer usa?
      a: O módulo depende da categoria de projeto e do tipo de barco. A maioria dos modelos RIB na Categoria de Design C usa o Módulo A (controle interno de produção). Para barcos da Categoria de Design A/B ou configurações específicas, o Módulo B+C ou B+D pode ser aplicado com o envolvimento do Organismo Notificado. Aconselhamos sobre o módulo apropriado por projeto.
    - q: Você pode compartilhar a documentação de conformidade antes de fazermos um pedido?
      a: Após uma consulta qualificada, compartilhamos um documento de escopo de conformidade listando os padrões aplicáveis, a rota de conformidade e os tipos de documentos disponíveis para o modelo que você está avaliando. Arquivos técnicos completos são compartilhados sob NDA após a confirmação do pedido.
    - q: O que é um Número de Identificação do Casco (HIN) e ele está incluído?
      a: O HIN é um identificador exclusivo de 14 caracteres marcado permanentemente em cada barco, codificando o código do fabricante (MIC), designação do modelo, ano de produção e número de série. É obrigatório para todos os barcos RIB colocados no mercado da UE e está incluído em todos os RIB Aquafarer.
    - q: Por quanto tempo os arquivos técnicos são retidos?
      a: De acordo com os requisitos do RCD 2013/53/UE, o fabricante deve conservar a ficha técnica durante pelo menos 10 anos a partir da última data em que o produto foi colocado no mercado. Aquafarer mantém documentação técnica completa para todos os modelos produzidos.
    - q: Você ajuda com as obrigações do importador sob o RCD?
      a: 'Sim. Fornecemos o pacote de documentação que os importadores da UE precisam para cumprir suas obrigações: acesso a arquivos técnicos, DoC, placa do construtor, manual do proprietário e registros de rastreabilidade do produto. As responsabilidades do importador no âmbito do RCD estão claramente documentadas no nosso guia de conformidade.'
