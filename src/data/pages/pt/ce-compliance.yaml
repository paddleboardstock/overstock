hero:
  tagline: Conformidade CE e RCD
  title: Conformidade CE do barco RIB e documentação técnica
  subtitle: Os barcos RIB e embarcações infláveis Aquafarer são projetados e documentados para conformidade com o mercado da UE sob a Diretiva de Embarcações de Recreio 2013/53/UE. Da avaliação de risco à Declaração de Conformidade, fornecemos documentação de conformidade específica do modelo para cada casco.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Documentação e certificação de conformidade CE do barco RIB
direct_answer: Aquafarer fornece documentação de conformidade específica do modelo RCD 2013/53/UE para barcos RIB e embarcações infláveis, incluindo arquivos técnicos, declarações de conformidade, placas de construção e manuais do proprietário - todos alinhados com EN ISO 6185, ISO 12217 e padrões harmonizados aplicáveis.
