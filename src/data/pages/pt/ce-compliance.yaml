content_material_cert:
  tagline: Certificação de Materiais
  title: Rastreabilidade de materiais e<br />Evidências de certificação
  subtitle: Barcos de qualidade RIB começam com materiais controlados e processos documentados. Abaixo está como organizamos a certificação de materiais para cada grupo de componentes críticos.
  items:
    - title: Rastreabilidade do material do tubo inflável
      description: Os materiais dos tubos PVC e CSM/Hypalon são selecionados de acordo com o uso pretendido, condições climáticas e mercado-alvo. Dados técnicos do fornecedor (TDS), informações sobre lotes de materiais, rastreabilidade de lotes de tecidos, relatórios de testes UV e de intemperismo e declarações REACH/SVHC estão disponíveis dentro do escopo de documentação do projeto acordado.
      icon: tabler:circle
    - title: Rastreabilidade do Alumínio Marítimo
      description: Para projetos de casco de alumínio RIB, o grau da liga, a espessura e os lotes de materiais são controlados de acordo com as especificações aprovadas. Certificados de teste de material (MTC/MTR), documentação EN 10204 3.1, relatórios de composição química e propriedades mecânicas e rastreabilidade de calor/lote são fornecidos quando acordado.
      icon: tabler:rectangle
    - title: GRP Controle de materiais e processos do casco
      description: Para RIBs de casco de fibra de vidro, gelcoat, resina, reforço de fibra de vidro e materiais do núcleo são gerenciados por meio de especificações controladas. TDS/SDS de materiais, registros de lote, especificações de laminados e registros de cura e controle de oficina estão disponíveis mediante acordo do projeto.
      icon: tabler:layers-subtract
    - title: Suporte à documentação de componentes
      description: Para componentes selecionados – incluindo materiais de convés EVA, assentos, ferragens de aço inoxidável, sistemas de combustível, equipamentos elétricos e acessórios marítimos – a documentação aplicável do fornecedor é coordenada com base na configuração final e nos requisitos do mercado de destino.
      icon: tabler:package
    - title: Notificação de Escopo de Conformidade
      description: Certificados, relatórios de testes e documentos de conformidade aplicam-se apenas ao modelo de produto específico, material, componente, lote de produção ou escopo do projeto declarado no documento relevante. Contate-nos com seu mercado-alvo, uso pretendido e requisitos técnicos para que o pacote de documentação aplicável possa ser confirmado antes de fazer o pedido.
      icon: tabler:info-circle

