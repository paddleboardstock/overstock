content_challenge:
  tagline: O desafio
  title: Demandas de aquicultura<br />Equipamentos resistentes à água salgada
  subtitle: As pisciculturas, as explorações de pérolas e as fazendas oceânicas operam no ambiente marinho mais quimicamente agressivo – exposição prolongada à água salgada, resíduos de combustível e ração e uso diário contínuo.
  paragraphs:
    - As operações de aquicultura funcionam 365 dias por ano em ambientes costeiros expostos e no alto-mar. Os barcos de trabalho utilizados na inspeção de gaiolas, no transporte de ração, na manutenção das linhas de pérolas e no atendimento de equipamentos enfrentam imersão constante em água salgada, exposição aos UV e contato químico com combustíveis, ração para peixes e tratamentos anti-incrustantes.
    - '**A corrosão é o inimigo principal** — Os equipamentos marinhos padrão se deterioram rapidamente nestas condições. Motores fora de bordo, chassis de reboques e ferragens do casco exigem substituição constante. Os operadores precisam de barcos construídos com materiais resistentes à corrosão, capazes de suportar anos neste ambiente sem se degradarem.'
    - '**A confiabilidade diária é crucial** — Um barco de trabalho quebrado significa horários de alimentação perdidos, colheitas atrasadas e perdas de produção custosas. Para as fazendas de pérolas, um único dia de inspeção perdido pode significar danos significativos à colheita. Para as fazendas de peixes, uma alimentação atrasada afeta as taxas de crescimento e a rentabilidade.'
    - Os RIBs de aquicultura da Aquafarer são projetados com ferragens resistentes à corrosão, tubos de Hypalon de alta resistência e cascos reforçados, concebidos especificamente para as condições exigentes da piscicultura, do cultivo de pérolas e da pecuária oceânica.
content_solution:
  tagline: Nossa solução
  title: RIBs especificamente construídos<br />Para a indústria da aquicultura
  subtitle: Cada barco de trabalho para aquicultura Aquafarer é projetado para resistir a ambientes agressivos de água salgada, ao mesmo tempo que oferece desempenho diário confiável.
  list:
    - Tubos de Hypalon de qualidade marinha — resistência superior aos UV, à água salgada, aos combustíveis e aos produtos químicos da ração para peixes
    - Ferragens em aço inoxidável 316 em todo o barco — sem ferrugem em caso de exposição prolongada à água salgada
    - Cintas de atrito reforçadas e protetor de quilha para o contato repetido com cais e gaiolas
    - Convés autodrenante para lavagem e drenagem fáceis após o transporte de ração e as operações de colheita
    - Configuração de convés plano para transportar sacos de ração, caixas de colheita e equipamentos
    - Configurações de motor fora de bordo de 15 a 60 CV — otimizadas para o equilíbrio entre carga útil e consumo de combustível
    - Opções de cores de tubos de alta visibilidade para localização fácil em grandes áreas de fazendas
content_segments:
  tagline: Perfis de Aquicultura
  title: Soluções para barcos de trabalho<br />Por tipo de aquicultura
  subtitle: Diferentes operações de aquicultura têm diferentes requisitos para barcos de trabalho – desde pequenos RIBs ágeis para inspeção de gaiolas de peixes até plataformas de transporte estáveis para cultivo de pérolas e barcos de trabalho pesados para pecuária oceânica.
  items:
    - title: Operações de Piscicultura
      subtitle: Inspeção de gaiolas, transporte de ração, apoio à colheita
      description: As pisciculturas marinhas operam gaiolas em locais costeiros e offshore expostos. Barcos de trabalho são usados diariamente para inspeção de redes de gaiolas, operações de alimentação, apoio à colheita e manutenção de equipamentos. O principal desafio é a corrosão – os barcos estão constantemente expostos à água salgada, resíduos de ração para peixes e combustível. Um barco de trabalho confiável é essencial porque a falta de alimentação ou o atraso na colheita afetam diretamente a produção e a lucratividade.
      features:
        - 'Pacote para ambientes agressivos: ferragens em aço inoxidável 316, componentes de liga de qualidade marinha'
        - Layout de convés plano para o transporte de sacos de ração e caixas de colheita
        - Convés autodrenante para uma lavagem fácil após as operações
        - Tubos de Hypalon com revestimento resistente a produtos químicos para a exposição à ração e aos combustíveis
        - Cintas de atrito reforçadas para o contato frequente com gaiolas e cais
    - title: Operações de cultivo de pérolas
      subtitle: Transporte estável para inspeção e colheita de linhas de pérolas
      description: As fazendas de pérolas exigem barcos de trabalho estáveis e confiáveis para o transporte diário entre linhas de pérolas, inspeção de redes de ostras e coleta de colheita. Estas operações ocorrem em locais costeiros remotos com infraestrutura de manutenção limitada. O barco deve ser estável o suficiente para que a tripulação possa trabalhar enquanto inspeciona as linhas de pérolas, com embarque fácil e amplo espaço no convés para transportar ostras colhidas, redes e suprimentos. A confiabilidade e a fácil manutenção são essenciais em locais agrícolas remotos.
      features:
        - Design de casco estável para a tripulação de pé durante a inspeção das linhas de pérolas
        - Convés plano com superfície antiderrapante para movimentos seguros da tripulação
        - Borda livre baixa para acesso fácil às redes de ostras e à colheita
        - Configuração de motor fora de bordo simples para manutenção fácil no local
        - Conjunto de tubos e ferragens resistentes à corrosão para exposição contínua à água salgada
    - title: Pecuária oceânica e melhoria marinha
      subtitle: Transporte juvenil, manutenção de gaiolas, suporte de monitoramento
      description: As operações de pecuária oceânica envolvem a liberação de estoques juvenis em ambientes marinhos gerenciados, o monitoramento do crescimento e a manutenção de estruturas de melhoria. Os barcos de trabalho precisam transportar animais juvenis vivos em contentores arejados, transportar equipamento de monitorização e aceder a locais de libertação costeiros pouco profundos. O projeto do casco deve equilibrar a capacidade de carga com o calado raso para acesso à praia e ao estuário.
      features:
        - Espaço no convés para contêineres arejados de transporte de alevinos e equipamentos de monitoramento
        - Calado raso para acesso aos locais de soltura em praias e estuários
        - Desembarque fácil na praia — quilha reforçada e proteção de proa
        - Pontos de fixação de equipamentos para eletrônica de monitoramento e aparelhos de amostragem
        - Tubos de Hypalon de alta resistência para durabilidade em condições mistas de areia e água do mar
