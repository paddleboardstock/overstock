certifications:
  - title: Certificação CE (UE 2016/425)
    standard: Regulamento de EPI (UE) 2016/425 | EN ISO 12402
    description: Todos os equipamentos de segurança Aquafarer cumprem os requisitos de marcação CE ao abrigo do Regulamento Europeu de Equipamentos de Proteção Individual. Cada produto é testado de forma independente pela TÜV Rheinland, uma entidade notificada europeia. Os nossos barcos insufláveis e RIB cumprem os requisitos das categorias C e D da Diretiva de Embarcações de Recreio 2013/53/UE (RCD).
    body: A certificação CE abrange os requisitos essenciais de saúde e segurança para dispositivos de flutuação pessoal e embarcações insufláveis. A TÜV Rheinland audita anualmente a nossa unidade de produção para verificar a conformidade contínua.
  - title: SOLAS — Segurança da Vida Humana no Mar
    standard: Capítulo III do SOLAS | Código LSA
    description: O Life Vest Pro cumpre os regulamentos SOLAS para operações marítimas offshore e comerciais. Testado para retenção de flutuação por 24 horas, insuflação automática em caso de imersão e desempenho em estados de mar até Força 5. Cumpre os requisitos do Capítulo III para coletes salva-vidas em embarcações comerciais.
    body: A aprovação SOLAS exige testes independentes por uma entidade notificada de flutuação, resistência, visibilidade e ativação automática. O nosso Life Vest Pro possui aprovação de tipo SOLAS completa com certificação MED.
  - title: USCG Tipo III / Tipo V
    standard: 46 CFR Parte 160 | Aprovação USCG
    description: Coletes salva-vidas selecionados da Aquafarer cumprem a classificação da Guarda Costeira dos Estados Unidos para dispositivos Tipo III (auxílio de flutuação) e Tipo V (uso especial). Adequados para águas abrigadas, navegação costeira e operações comerciais que exigem PFD aprovados pela USCG.
    body: A aprovação USCG exige testes por um laboratório independente reconhecido pela Guarda Costeira. A aprovação Tipo V inclui conceções insufláveis híbridas que requerem ativação manual ou automática.
  - title: Conformidade Social BSCI
    standard: Código de Conduta amfori BSCI
    description: A nossa fábrica é auditada anualmente ao abrigo da Iniciativa de Conformidade Social Empresarial (BSCI) da amfori. Isto verifica práticas laborais éticas, segurança no local de trabalho, horários de trabalho justos e gestão ambiental em toda a nossa unidade de produção de 12.000 m².
    body: A conformidade BSCI é um pré-requisito para retalhistas e importadores europeus. A nossa classificação BSCI atual é "C" (Boa), auditada pela SGS.
  - title: Conformidade REACH e RoHS
    standard: Regulamento REACH da UE (CE) 1907/2006 | Diretiva RoHS 2011/65/UE
    description: Todos os compostos de PVC, adesivos e revestimentos usados nos produtos Aquafarer cumprem os regulamentos europeus de segurança química REACH e as restrições de substâncias perigosas RoHS. As fichas de dados de segurança de materiais (MSDS) estão disponíveis para cada linha de produtos.
    body: A conformidade REACH garante a ausência de substâncias SVHC restritas acima dos limites. Testes regulares em laboratórios independentes verificam a conformidade contínua de cada lote de produção.
  - title: Gestão da Qualidade ISO 9001:2015
    standard: ISO 9001:2015 | Certificado TÜV Rheinland
    description: O nosso sistema de gestão da qualidade é certificado ISO 9001:2015 pela TÜV Rheinland, abrangendo conceção, produção, testes e assistência pós-venda. Auditorias de vigilância anuais garantem melhoria contínua e controlo de processos.
    body: A certificação ISO 9001 exige políticas de qualidade documentadas, auditorias internas, revisões pela gestão, procedimentos de ação corretiva e registos de produção rastreáveis.
testimonial:
  quote: Adquirimos equipamentos de segurança a vários fornecedores na Ásia. A Aquafarer é a única fabricante que forneceu a documentação CE completa, os certificados SOLAS e relatórios de testes de entidades independentes desde o início — sem que lhe fosse pedido.
  author: Erik Lindström
  title: Responsável de Segurança
  company: Baltic Marine Supply
  location: Finlândia
content_overpressure:
  tagline: Segurança de Sobrepressão
  title: Gestão da Pressão dos Tubos de RIB<br />em Climas Quentes
  subtitle: A pressão dos tubos insufláveis aumenta com a temperatura. Compreender e gerir a sobrepressão evita danos e garante uma operação segura em ambientes tropicais e desérticos.
  items:
    - title: Válvulas de Alívio de Pressão Boyle
      description: Os tubos RIB da Aquafarer estão equipados com válvulas de alívio de sobrepressão que libertam automaticamente o excesso de pressão acima do máximo nominal. Evita tensão nas costuras e potencial rebentamento do tubo devido ao aquecimento solar.
      icon: tabler:gauge
    - title: Variação de Pressão da Manhã ao Meio-dia
      description: Um tubo insuflado a 3,5 PSI a 20 °C pode atingir 4,5+ PSI com exposição ao sol a 40 °C. Insufle sempre até ao limite inferior do intervalo recomendado em climas quentes e deixe a válvula de alívio gerir o excesso de pressão.
      icon: tabler:sun
    - title: Pressões de Operação Recomendadas
      description: 'Tubos de PVC: 3,0-3,5 PSI de operação, 4,5 PSI máximo. Tubos de Hypalon: 3,5-4,0 PSI de operação, 5,0 PSI máximo. Teste sempre a 1,25x o valor nominal (4,4 PSI para PVC, 5,0 PSI para Hypalon) conforme as normas de QC da Aquafarer.'
      icon: tabler:chart-bar
    - title: Boas Práticas de Exposição ao Sol
      description: Guarde os RIB em áreas sombreadas quando não estiverem em uso. Use capas de proteção UV para amarrações prolongadas. Verifique e ajuste a pressão dos tubos antes e depois das horas de pico de sol. Nunca exceda a pressão máxima nominal.
      icon: tabler:umbrella
    - title: Despressurização de Emergência
      description: Se o tubo parecer excessivamente firme ou a válvula de alívio estiver a libertar ar, liberte ar pela válvula Halkey-Roberts ou militar até a pressão regressar ao intervalo de operação. Transporte um manómetro para leituras precisas.
      icon: tabler:alert-circle
