content_overpressure:
  tagline: Segurança de Pressão
  title: Pressão da Placa<br />Gestão em climas quentes
  subtitle: A pressão da tábua inflável aumenta com a temperatura. Entender e gerenciar a sobrepressão protege sua prancha e mantém cada sessão segura.
  items:
    - title: Por que a pressão aumenta
      description: O ar se expande com o calor. Uma prancha inflada a PSI 15 graus a 20°C pode subir 1-2 PSI em 40°C de sol — a mesma física que faz uma prancha matinal fria parecer dura como pedra ao meio-dia.
      icon: tabler:gauge
    - title: Pressão Operacional Recomendada
      description: Enche para 12-15 PSI, conforme impresso próximo à válvula. A faixa nominal equilibra rigidez, segurança e vida útil da junta — mais não é melhor.
      icon: tabler:chart-bar
    - title: Melhores Práticas para Clima Quente
      description: Infle até a parte inferior da gama em dias quentes. Libere um pouco de ar antes de uma exposição prolongada ao sol e nunca deixe uma tábua totalmente inflada assando na praia.
      icon: tabler:sun
    - title: Exposição ao Sol e Armazenamento
      description: Guarde tábuas sombreadas e parcialmente esvaziadas quando não estiverem em uso. Use um saco de tábuas para UV proteção. Enxágue e seque antes de enrolar para armazenamento.
      icon: tabler:umbrella
    - title: Se o tabuleiro parecer duro como pedra
      description: Libere o ar pela válvula até que a placa volte à faixa nominal. Carregue o manômetro na sua bomba para leituras precisas — uma placa superinflada sobrecarrega as emendas desnecessariamente.
      icon: tabler:alert-circle
