faq:
  title: Desenhos Técnicos — Perguntas Frequentes
  questions:
    - q: O download dos PDFs do GA é realmente gratuito?
      a: Sim. PDFs de arranjo geral para nossos modelos principais estão disponíveis gratuitamente. Eles contêm informações em nível de planejamento suficientes para avaliação do projeto, alocação de espaço e revisão preliminar de especificações.
    - q: Como acesso arquivos DXF/DWG?
      a: Preencha o breve formulário de qualificação na página de download com o nome da sua empresa, tipo de projeto e uso pretendido. As solicitações aprovadas recebem um link para download por e-mail em até 1 dia útil.
    - q: Posso obter modelos 3D STEP/IGES?
      a: Arquivos de modelo 3D STEP ou IGES estão disponíveis através de nosso processo de inscrição de projeto. Forneça o escopo do projeto, requisitos de integração, cronograma e intenção de compra. Sujeito a aprovação – normalmente dentro de 3 a 5 dias úteis.
    - q: Por que você restringe o acesso a arquivos com mais detalhes?
      a: A geometria do casco, os dados do molde e os cálculos estruturais representam anos de investimento em P&D e são a principal propriedade intelectual da fabricação. Fornecemos tudo o que é necessário para o planejamento de aquisições e integração de projetos, ao mesmo tempo que protegemos nossa capacidade de continuar investindo no desenvolvimento de novos produtos.
    - q: Os desenhos incluem detalhes de fabricação?
      a: Não. Os desenhos públicos e de formato leve contêm informações em nível de aquisição para planejamento e especificação. Detalhes em nível de fabricação (cronogramas de laminação, caminhos de ferramentas, expansões de corte) são compartilhados somente sob NDA com pedidos confirmados.
    - q: Os desenhos estão disponíveis para configurações RIB personalizadas ou semipersonalizadas?
      a: Desenhos de projetos personalizados são preparados como parte do processo de desenvolvimento OEM/ODM. Se você estiver avaliando um projeto RIB personalizado, entre em contato conosco com suas necessidades e forneceremos desenhos GA específicos do projeto como parte da proposta.
