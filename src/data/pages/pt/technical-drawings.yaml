content_version_control:
  tagline: Controle de Versões
  title: Versão do desenho<br />Gerenciamento
  subtitle: Cada desenho segue um sistema de revisão controlado. Sempre verifique se você possui a revisão atual antes de usar desenhos para planejamento de projeto.
  items:
    - title: Controle de Revisões
      description: Cada desenho carrega um código de revisão (Rev-A, Rev-B, Rev-C), data de emissão, data da última revisão, modelo/configuração aplicável, unidades, tamanho do arquivo e formato. Apenas a revisão "Atual" está disponível para download.
      icon: tabler:git-branch
    - title: Aviso de status de desenho
      description: Todos os desenhos públicos estão marcados como "Apenas layout preliminar - não para construção, certificação ou uso de produção. Dimensões sujeitas a especificação final e confirmação do pedido." Isso protege ambas as partes contra aplicações incorretas.
      icon: tabler:alert-circle
    - title: Notificações de atualização
      description: Quando uma especificação de modelo é alterada, a revisão do desenho é atualizada e as versões anteriores são marcadas como "Substituídas". Os usuários registrados que baixaram pacotes DXF/DWG são notificados sobre atualizações significativas por e-mail.
      icon: tabler:bell

