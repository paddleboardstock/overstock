content_tiers:
  tagline: Baixar níveis
  title: Quatro níveis de acesso<br />— O detalhe certo para o estágio certo
  subtitle: Fornecemos desenhos no nível de aquisição, não arquivos no nível de fabricação. Cada nível corresponde a um estágio diferente do projeto.
  items:
    - title: Camada 1 – PDF público
      description: Arranjo geral (GA), desenho dimensional em 4 vistas e layout do deck em formato PDF. Disponível para download gratuito. Suficiente para planejamento de projetos, alocação de espaço e revisão preliminar de especificações.
      icon: tabler:file-type-pdf
    - title: Camada 2 — Formato leve DXF/DWG
      description: Arquivos CAD 2D (DXF ou DWG) para integração de layout em nível de planejamento. Requer um breve formulário de qualificação (nome da empresa, tipo de projeto, uso pretendido). Nenhum dado estrutural ou de fabricação incluído.
      icon: tabler:file-code
    - title: Nível 3 — Aplicação do Projeto STEP/IGES
      description: Arquivos de modelo 3D (STEP ou IGES) para integração de sistemas, projeto de equipamentos ou coordenação de arquitetura naval. Requer aplicação do projeto com escopo, cronograma e intenção de compra. Sujeito a aprovação.
      icon: tabler:cube
    - title: Nível 4 - Engenharia NDA
      description: Desenhos estruturais do casco, cronogramas de laminação, expansões de corte de tubos e dados de moldes. Disponível apenas sob NDA com pedidos confirmados. Estes são arquivos de nível de fabricação – não para distribuição pública.
      icon: tabler:lock
content_included:
  tagline: O que está incluído
  title: Conteúdo do desenho<br />Por modelo
  subtitle: Cada modelo possui um pacote de desenhos padrão que cobre as informações essenciais de planejamento para compradores B2B e engenheiros de projeto.
  items:
    - title: Arranjo Geral (AG)
      description: Perfil lateral, vista superior e seção transversal mostrando a forma do casco, posição do tubo, localização do console, assento, sistema de combustível e dimensões principais (LOA, viga, diâmetro do tubo, ângulo de nascimento). Status da revisão e direitos autorais anotados no bloco de título.
      icon: tabler:layout
    - title: Desenho de dimensão de 4 visualizações
      description: Vistas laterais, frontais, traseiras e superiores com dimensões gerais para planejamento de transporte (altura no reboque, viga para contêiner, peso para elevação). Inclui configurações operacionais e de transporte.
      icon: tabler:ruler-2
    - title: Layout do convés e plano de equipamentos
      description: Vista de cima para baixo do convés mostrando a base do console, posições dos assentos, localizações dos anéis em D, posições das luzes de navegação, acesso à bomba de esgoto, compartimento de bateria/combustível e pontos de montagem do equipamento. Precisão limitada em interfaces proprietárias.
      icon: tabler:map
    - title: Desenho de Transporte e Embalagem
      description: Plano de carregamento de contêineres, dimensões do berço, distribuição de peso e posições dos pontos de elevação para planejamento logístico. Inclui opções de embalagem padrão e personalizada.
      icon: tabler:truck
content_protection:
  tagline: Proteção IP
  title: O que não compartilhamos<br />e por quê
  subtitle: A proteção de nossa propriedade intelectual de engenharia garante que possamos continuar investindo em P&D e, ao mesmo tempo, fornecer tudo o que os compradores precisam para o planejamento do projeto.
  items:
    - title: Dados do núcleo do molde do casco
      description: Geometria de plug e molde, caminhos de ferramentas CNC e modelos de laminação são ativos de fabricação proprietários. Eles não são compartilhados em nenhum nível de acesso fora dos contratos NDA confirmados.
      icon: tabler:ban
    - title: Expansões de corte de tubo
      description: Arquivos de corte de padrão plano para tecido tubular são dados de nível de fabricação. Disponível apenas sob NDA com pedidos de produção confirmados e compartilhado apenas com a parte contratante.
      icon: tabler:ban
    - title: Cálculos Estruturais
      description: Análise detalhada de tensão, resultados FEA e cronogramas de laminados são documentos sensíveis à conformidade, compartilhados apenas com Órgãos Notificados e clientes vinculados ao NDA durante o processo de avaliação de conformidade.
      icon: tabler:ban
    - title: Triagem do Concorrente
      description: Reservamo-nos o direito de recusar solicitações de acesso CAD que pareçam ser de concorrentes, estudantes sem contexto de projeto ou partes sem intenção legítima de aquisição.
      icon: tabler:shield
