hero:
  tagline: Sobre nós
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Oficina Aquafarer
  title: |
    Engenharia naval, <br />
    feita à <span class="text-accent dark:text-white">Aquafarer</span>
  subtitle: 'Começámos numa oficina costeira com um barco e uma convicção teimosa: os produtos navais devem ser projetados como se fizessem diferença, porque fazem. Hoje enviamos para mais de 40 países, mas cada casco ainda passa pelas mesmas mãos que fundaram a empresa.'

stats:
  title: Em números
  columns: 4
  stats:
    - title: Cascos entregues
      amount: '2,400+'
    - title: Países de destino
      amount: '50+'
    - title: Anos de experiência combinada
      amount: '60'
    - title: Resposta média de garantia (horas)
      amount: '24'

features3_what_we_build:
  title: O que construímos
  subtitle: Uma linha de produtos focada que conhecemos de fio a pavio — sem experiências a meio, sem engenharia de fachada.
  columns: 3
  isBeforeContent: true
  items:
    - title: Barcos RIB
      description: RIBs de casco de alumínio de 3,3 m a 7,5 m. Projetados para patrulha, mergulho, pesca e uso familiar.
      icon: tabler:ship
    - title: Barcos insufláveis
      description: Dinghies insufláveis em PVC e Hypalon de 2,4 m a 4,2 m. Leves, resistentes e fáceis de arrumar.
      icon: tabler:speedboat
    - title: Tenders para superiates
      description: RIBs compactos e de alta especificação construídos à medida para combinar com o visual do seu iate.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Acessórios
      description: Remos, bombas, capas, sacos estanques, depósitos de combustível e eletrônica. Tudo compatível com os nossos barcos.
      icon: tabler:package
    - title: Reequipamento e reparação
      description: Substituição de tubos, retrofitting de eletrônica e upgrades de motor na nossa oficina.
      icon: tabler:tool
    - title: Construções personalizadas
      description: Projeto projeto-a-projeto para clientes comerciais, científicos e militares.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Construção de barco personalizado

steps2_values:
  title: Os nossos valores
  subtitle: Três princípios que moldam cada produto desde o primeiro dia.
  items:
    - title: Construir como se levasse a sua família
      description: Cada casco, soldadura e fixador é tratado como se fosse para a nossa própria família usar.
      icon: tabler:heart
    - title: Projetar antes de vender
      description: Se uma especificação está errada, alteramos a especificação — nunca o cliente.
      icon: tabler:settings
    - title: Apoio que supera a garantia
      description: Cascos com vinte anos ainda nos ligam a pedir peças, e nós continuamos a atender.
      icon: tabler:headset

steps2_milestones:
  title: Marcos
  subtitle: Uma versão resumida da história da Aquafarer.
  isReversed: true
  items:
    - title: Fundada numa oficina costeira
      description: Começada por dois arquitetos navais com uma CNC e uma ideia teimosa.
      icon: tabler:building-factory
    - title: Primeiros 1 000 cascos entregues
      description: Atingido no sétimo ano, sobretudo pelo passa-palavra e clientes recorrentes.
      icon: tabler:circle-check
    - title: Programa de exportação internacional
      description: Agora a enviar para mais de 40 países com parceiros de apoio localizados em cinco continentes.
      icon: tabler:world

features2_locations:
  title: As nossas localizações
  tagline: Encontre-nos
  columns: 3
  items:
    - title: Sede e oficina
      description: Parque industrial costeiro, edifício 4 — aberto Seg–Sex para visitas marcadas.
    - title: Centro de assistência UE
      description: Porto mediterranico — reequipamento, reparação e apoio de garantia para clientes europeus.
    - title: Rede de parceiros APAC
      description: Parceiros de assistência autorizados na Austrália, Japão, Singapura e Hong Kong.
brand_hub_tagline: Marca
brand_hub_title: Explore a nossa marca
brand_hub_subtitle: Aprofunde-se na nossa experiência em engenharia naval, presença global e os princípios que nos orientam.
brand_hub_cards:
  - title: Experiência Naval
    desc: 'Décadas de ciência de materiais, fabricação de precisão e testes reais — desde a fabricação de PVC/Hypalon até o design de casco em V profundo e tecnologia drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'Saiba mais →'
  - title: Presença Global
    desc: 'Envio para mais de 50 países a partir da nossa unidade em Qingdao com parceiros de serviço autorizados na Europa, Ásia-Pacífico e Américas.'
    link: /brand-global-presence
    link_label: 'Saiba mais →'
  - title: Por que a Aquafarer
    desc: 'Integração vertical, dupla certificação (ISO 9001 + BSCI), conformidade CE e MOQs baixos — construído para marcas, distribuidores e agências governamentais.'
    link: /brand-why-aquafarer
    link_label: 'Saiba mais →'

production_section:
  tagline: 'Excelência em produção'
  title: 'Garantindo um artesanato requintado'
  description: 'A linha de produção da Aquafarer é dedicada à fabricação de produtos infláveis de alta qualidade — duráveis e de alto desempenho.'
  cards:
    - title: 'Equipe de técnicos experientes'
      items:
        - 'Conhecimento profissional de PVC, Hypalon e materiais marítimos'
        - 'Artesanato preciso no corte, colagem e instalação de acessórios'
        - 'Treinamento contínuo para dominar as mais recentes tecnologias de produção'
    - title: 'Equipamento de produção avançado'
      items:
        - 'Equipamentos de corte CNC para corte preciso de tecidos com erro mínimo'
        - 'Colagem térmica/fria de alta precisão para costuras herméticas e duráveis'
        - 'Equipamentos profissionais de teste de hermeticidade e tração'
    - title: 'Sistema de gestão maduro'
      items:
        - 'Processos de produção padronizados com padrões de qualidade claros'
        - 'Filosofia de produção enxuta que reduz desperdícios e melhora a eficiência'
        - 'Gestão eficiente da cadeia de suprimentos com parcerias confiáveis'
    - title: 'Controle de qualidade rigoroso'
      items:
        - 'Sistema de gestão da qualidade certificado'
        - 'Inspeção em múltiplas etapas: matéria-prima, em processo, saída final'
        - 'Testes rigorosos de hermeticidade e durabilidade antes do envio'

global_ops_section:
  tagline: 'Arquitetura operacional global'
  title_html: 'Uma marca, <span class="text-white/90">dois polos</span>'
  description_html: 'Desde setembro de 2026, a Aquafarer é operada pela <strong class="text-white">Aquafarer LLC</strong> (Novo México, EUA) — a entidade global para distribuição, vendas B2B comerciais, contratos, faturamento e pós-venda. A P&D, a produção e o controle de qualidade permanecem no <strong class="text-white">Polo de Manufatura Aquafarer Qingdao</strong>, que envia cada pedido diretamente da fábrica, FOB Qingdao. A transição mudou quem assina o seu contrato — não quem constrói o seu barco.'
  stats:
    - value: '2,400+'
      label: 'Cascos entregues globalmente'
    - value: '50+'
      label: 'Países de exportação'
    - value: '10+'
      label: 'Anos de fabricação'
