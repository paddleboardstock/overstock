hero:
  tagline: Sobre nós
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fábrica e oficina de Paddle Board Overstock
  title: Sobre <span class="text-accent dark:text-white">Estoque excessivo de pranchas de remo</span>
  subtitle: Novas pranchas de SUP infláveis ​​a preços de excesso de estoque e liquidação - apoiadas por nossa própria fabricação em Weihai desde 2012, atacado de modelos mistos para pequenos varejistas e envio flexível para todo o mundo.
stats:
  title: Pelos números
  columns: 4
  stats:
    - title: Capacidade de produção anual
      amount: 15.000 unidades
    - title: Países enviados
      amount: 50+
    - title: Placas testadas sob pressão
      amount: 100%
    - title: Engenheiros de P&D
      amount: 14+
features3_what_we_build:
  title: O que construímos
  subtitle: Uma linha de produtos focada que conhecemos de dentro para fora — sem experimentos incompletos, sem engenharia de crachás.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pranchas infláveis ​​de SUP
      description: SUPs versáteis e de passeio de 10' a 12 pés. Estável, rígido e completo com bomba, remo e guia.
      icon: tabler:swimming
    - title: Decks de séries de arte
      description: Arte exclusiva do deck de EVA – Cheetah Surge, Tropical Breeze, Medusa Glow e muito mais.
      icon: tabler:hexagons
    - title: Pacotes completos
      description: 'Cada prancha é enviada como um kit completo: prancha, mochila, bomba, remo, barbatana, leash e kit de reparo.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Acessórios
      description: Bombas, pás, trelas, kits de reparo e sacos secos. Tudo combinado com nossas pranchas.
      icon: tabler:tool
    - title: Cuidado e reparo
      description: Suporte interno para reparos, peças de reposição e orientações de manutenção para manter sua prancha na água por anos.
      icon: tabler:settings
    - title: Frotas de clubes e aluguel
      description: Equipamento em massa para clubes, escolas e frotas de aluguel com suporte direto da fábrica.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Design da placa e discussão de engenharia
steps2_values:
  title: Nossos valores
  subtitle: Três princípios que moldaram cada produto desde o primeiro dia.
  items:
    - title: Construa como se carregasse sua família
      description: Cada tábua, costura e válvula são tratadas como se nossas próprias famílias fossem usá-las.
      icon: tabler:heart
    - title: Engenheiro antes de vender
      description: Se uma especificação estiver errada, nós alteramos a especificação – nunca o cliente.
      icon: tabler:settings
    - title: Suporte que dura além da garantia
      description: Placas que construímos anos atrás ainda nos pedem peças de reposição e nós ainda coletamos.
      icon: tabler:headset
steps2_milestones:
  title: Conquistas
  subtitle: Uma versão curta da história do Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fundada em Weihai
      description: Uma oficina costeira dedicada a pranchas de SUP infláveis ​​com ponto de gota.
      icon: tabler:building-factory
    - title: Campus de produção de 12.000 m²
      description: Expandido para uma instalação dedicada com soldagem RF e capacidade de produção de ponto gota.
      icon: tabler:circle-check
    - title: Programa de exportação internacional
      description: Agora enviamos para mais de 50 países com opções de frete expresso e marítimo.
      icon: tabler:world
    - title: Excesso de estoque e foco no atacado
      description: Em setembro de 2026, as operações da marca foram transferidas do Grupo Qingdao Vatrad para Weihai Dongjilian Co., Ltd.; o centro de fabricação de Weihai continua com pesquisa e desenvolvimento, produção e remessa direta da fábrica.
      icon: tabler:building-skyscraper
features2_locations:
  title: Nossas localizações
  tagline: Encontre-nos
  columns: 3
  items:
    - title: Sede e oficina
      description: Parque industrial costeiro, edifício 4 — aberto de segunda a sexta para visitas mediante agendamento.
    - title: Centro de serviços da UE
      description: Porto Mediterrâneo — reequipamento, reparação e suporte de garantia para clientes europeus.
    - title: Rede de parceiros APAC
      description: Parceiros de serviços autorizados na Austrália, Japão, Singapura e Hong Kong.
brand_hub_tagline: Marca
brand_hub_title: Explore nossa marca
brand_hub_subtitle: Aprofunde-se em nossa experiência em engenharia naval, presença global e nos princípios que nos motivam.
brand_hub_cards:
  - title: Experiência Marinha
    desc: Décadas de ciência de materiais, fabricação de precisão e testes no mundo real — desde núcleos de ponto gota até costuras soldadas e decks de séries artísticas.
    link: /brand-marine-expertise
    link_label: Saiba mais →
  - title: Por que excesso de estoque de pranchas de remo
    desc: Preço direto da fábrica, pranchas 100% testadas sob pressão e garantia de 2 anos - construídas para remadores, famílias e amantes de esportes aquáticos.
    link: /brand-why-paddleboardoverstock
    link_label: Saiba mais →
