hero:
  tagline: Processo
  title: Processo de Fabricação
  subtitle: Do material bruto à prancha pronta para o mar — cada etapa sob nosso controle
  back_label: De volta à Fábrica
  back_link: /factory
intro: Ao contrário de marcas que terceirizam a produção para fábricas de terceiros, Paddle Board Overstock possui e opera toda a sua cadeia de fabricação. Esta integração vertical nos permite manter um controle de qualidade rigoroso em cada estágio e fornecer qualidade de produto consistente de lote em lote. Aqui está como uma prancha é construída em nossas instalações.
steps:
  - step: '01'
    title: Recebimento e Inspeção de Material
    description: Cada lote de tecido PVC, núcleo drop-stitch, espuma EVA e ferragens é inspecionado de acordo com as especificações. Amostras de tecido são testadas quanto à resistência à tração, uniformidade de espessura e resistência UV antes de serem liberadas para a produção. Materiais não conformes são segregados e devolvidos.
    duration: 1–2 dias
  - step: '02'
    title: Corte Automático de PVC
    description: Tecidos aprovados são colocados na máquina de corte automático CNC e cortados com precisão submilimétrica. O encaixe otimizado por computador organiza os painéis para minimizar desperdício — geralmente abaixo de 5%. Os painéis cortados são etiquetados pelo modelo da prancha e câmara, depois agrupados para transferência para a oficina de soldagem.
    duration: 2–4 horas por kit de prancha
  - step: '03'
    title: Selagem a Calor e Soldagem de Tubos
    description: Os painéis são alinhados e unidos usando máquinas de selagem a calor com soldagem a ar quente em temperaturas controladas de 200–600 °C. As costuras principais são reforçadas com soldagem dielétrica RF para juntas herméticas e de alta resistência. As câmaras concluídas são infladas a 1,25× a pressão de trabalho por 30 minutos para validação de retenção de ar.
    duration: 1–2 dias por prancha
  - step: '04'
    title: Arte do Baralho & EVA Acabamento
    description: 'As pranchas da série Art ganham forma aqui: painéis de espuma EVA cortados com precisão são dispostos em padrões de deck completo, colados e aparados à mão. Antiderrapante, confortável e durável — o visual característico de toda prancha da série Art.'
    duration: 1–2 dias
  - step: '05'
    title: SUP Impressão e Decoração
    description: A arte do deck da prancha SUP é aplicada usando impressão digital para designs fotográficos em cores completas e serigrafia para logos duráveis e padrões repetitivos. As impressões são curadas e seladas para resistência UV e à abrasão.
    duration: 1–2 dias
  - step: '06'
    title: Montagem Final e Acabamento
    description: 'As pranchas recebem seus componentes finais: válvulas são apertadas e testadas, D-rings, alças e caixas de quilha são instalados, e o encaixe da leash é fixado. Cada prancha segue uma lista de verificação de montagem de 100 pontos com assinatura obrigatória em cada etapa.'
    duration: 2–3 dias
  - step: '07'
    title: Teste e Inspeção de Qualidade
    description: 'Toda prancha concluída passa por controle de qualidade obrigatório: teste de retenção de ar da câmara, verificação do funcionamento dos sistemas, verificação de torque dos fixadores e inspeção cosmética. Builds personalizados e protótipos também recebem testes no mar cobrindo velocidade, manuseio, estabilidade e resistência.'
    duration: 1–2 dias
  - step: '08'
    title: Embalagem e Envio
    description: As pranchas são esvaziadas, enroladas e embaladas em mochilas de viagem com bomba, remo, quilha, leash e kit de reparo, depois acondicionadas em caixas para envio por correio e frete. Cada pacote é etiquetado com modelo, número de série e destino. Enviamos para 50+ países em todo o mundo.
    duration: 1 dia
