content_priorities:
  tagline: O que os clientes verificam
  title: 8 coisas que os compradores verificam<br />em cada visita à fábrica
  subtitle: Com base no feedback de mais de 50 países compradores, estas são as oito prioridades que os clientes avaliam antes de fazer um pedido B2B.
  items:
    - title: Fabricante real
      description: 'Você é a fábrica real, não uma empresa comercial? Os compradores verificam: entidade comercial, equipamento de produção real, funcionários operando máquinas, ordens de produção atuais no local e consistência do site-oficina.'
      icon: tabler:building-factory
    - title: Produto adequado para aplicação
      description: O RIB corresponde ao seu caso de uso específico? Operadores de resort, resgate, mergulho, pesca e patrulha têm requisitos fundamentalmente diferentes. Os compradores avaliam o layout do convés, o material do tubo e as opções de equipamento no barco exibido.
      icon: tabler:target
    - title: Estabilidade e reprodutibilidade de qualidade
      description: A 50ª unidade é tão boa quanto a 1ª? Os compradores examinam os sistemas de controle de qualidade, os pontos de verificação em processo, o tratamento de não conformidades e pedem para ver os registros de múltiplas execuções de produção para verificar a consistência.
      icon: tabler:repeat
    - title: Autenticidade do Documento de Conformidade
      description: Os certificados CE são específicos do modelo? O DoC é assinado por uma pessoa real? A conformidade pode ser verificada por número de casco? Os compradores verificam as reivindicações gerais versus a documentação específica do modelo.
      icon: tabler:file-certificate
    - title: Execução de Personalização
      description: A fábrica pode realmente fornecer configurações personalizadas? Os compradores procuram evidências de projetos personalizados anteriores, amostras de protótipos em exibição, desenhos de engenharia e a capacidade de discutir modificações técnicas no local.
      icon: tabler:adjustments
    - title: Prazo de entrega e capacidade
      description: 'Os cronogramas citados são realistas? Os compradores avaliam: volume de produção atual, capacidade disponível, tamanho da força de trabalho, níveis de estoque de materiais e se a fábrica possui um sistema de planejamento de produção.'
      icon: tabler:clock
    - title: Preço e termos comerciais
      description: 'Os preços são transparentes? O preço FOB está claro? Os compradores verificam: detalhamento do preço unitário, custos de ferramentas, custos de embalagem e se a fábrica pode lidar com os termos DDP ou CIF com documentação de exportação adequada.'
      icon: tabler:currency-dollar
    - title: Pós-venda e peças de reposição
      description: 'O que acontece após o parto? Os compradores avaliam: disponibilidade de peças de reposição, processo de garantia, seções de tubos de substituição, substituição de válvulas e se a fábrica possui um protocolo de pós-venda documentado.'
      icon: tabler:headset
content_tour:
  tagline: Rota de visita à fábrica
  title: Tour de auditoria —<br />O que você verá
  subtitle: Nosso tour padrão pela fábrica segue uma rota definida projetada para responder às perguntas dos compradores em cada estação.
  items:
    - title: 1. Sala de Reuniões – Apresentação da Empresa
      description: Licença comercial, certificados ISO 9001 e BSCI, licenças de exportação e histórico da empresa. Visão geral rápida dos recursos de produção e escopo de conformidade.
      icon: tabler:users
    - title: 2. Armazém de Matéria Prima – Estação IQC
      description: Registros de inspeção de materiais recebidos, certificados de lotes de tecidos, adesivos e amostras de ferragens. Veja como os materiais são testados antes de entrarem em produção.
      icon: tabler:building-warehouse
    - title: 3. Fabricação de tubos – Soldagem RF e colagem manual
      description: Processo de soldagem ou colagem de tubos dinâmicos, demonstrações de testes de resistência de costura e instalação de válvulas. Observe a construção câmara por câmara e os pontos de verificação de qualidade.
      icon: tabler:flame
    - title: 4. Laminação de Casco – Workshop GRP
      description: Processo de colocação de fibra de vidro, aplicação de gelcoat e cura do casco. Consulte o cronograma de laminação e reforço estrutural para diferentes modelos de RIB.
      icon: tabler:layers-subtract
    - title: 5. Montagem e Integração
      description: União casco-tubo, instalação de console e assento, integração de sistemas elétricos e de combustível e montagem de equipamentos. Observe a linha de produção em operação.
      icon: tabler:tool
    - title: 6. Estação de teste de pressão
      description: Teste de retenção de pressão de 24 a 48 horas a 1,25x a pressão nominal. Visualize registros de testes, medidores de pressão e critérios de aprovação/reprovação. Veja como os resultados dos testes estão vinculados aos números de série do casco.
      icon: tabler:gauge
    - title: 7. Inspeção final e controle de qualidade
      description: Lista de verificação de qualidade de 100 pontos por unidade, verificação dimensional, inspeção cosmética e verificação de integridade da embalagem. Revise os logs de não conformidade e os registros de ações corretivas.
      icon: tabler:clipboard-check
    - title: 8. Sala de revisão de documentos
      description: Documentação de conformidade por modelo (DoC, placa de construção, manual do proprietário), registros de rastreabilidade de produção, registro HIN e demonstração de banco de dados de rastreamento de lote de materiais.
      icon: tabler:folder
content_qc_chain:
  tagline: Evidência de Qualidade
  title: Cadeia de controle de qualidade em 8 estágios<br />— Verificável em cada etapa
  subtitle: Nossa cadeia de controle de qualidade vai desde a entrada dos materiais até o envio final, com evidências documentadas em todas as etapas.
  items:
    - title: 'Etapa 1: Inspeção de entrada de materiais'
      description: Cada lote de PVC, Hypalon, fibra de vidro, alumínio, adesivos e ferragens é testado de acordo com as especificações antes de entrar em produção. Resistência à tração, adesão do revestimento e verificações dimensionais de acordo com AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Etapa 2: CQ de soldagem/colagem de tubos'
      description: Teste de resistência ao descascamento da costura por lote de produção. Parâmetros de solda RF monitorados e registrados. Costuras coladas à mão verificadas quanto à cobertura adesiva consistente e tempo de cura.
      icon: tabler:flame
    - title: 'Etapa 3: controle de qualidade da laminação do casco'
      description: Medição da espessura do gelcoat, verificação da disposição da fibra de vidro de acordo com a programação do laminado e monitoramento do tempo de cura. Posições de reforço estrutural verificadas em relação aos desenhos de engenharia.
      icon: tabler:layers-subtract
    - title: 'Etapa 4: Controle de qualidade de montagem e integração'
      description: Integridade da junta casco-tubo, torque de montagem do console e assento, continuidade elétrica e teste de vazamento do sistema de combustível. Cada ponto de instalação foi verificado em relação à lista de verificação de montagem específica do modelo.
      icon: tabler:tool
    - title: 'Etapa 5: Teste de retenção de pressão'
      description: Cada câmara inflável é pressurizada a 1,25x PSI e mantida por 24 a 48 horas. Queda de pressão registrada por câmara. Limite de aprovação/reprovação documentado. Vinculado ao número de série do casco.
      icon: tabler:gauge
    - title: 'Etapa 6: Inspeção Final'
      description: Lista de verificação de qualidade de 100 pontos que abrange precisão dimensional, acabamento cosmético, integridade dos acessórios, pacote de documentação e integridade da embalagem. Independente da equipe de produção.
      icon: tabler:clipboard-check
    - title: 'Etapa 7: Documentação de Conformidade'
      description: DoC específico do modelo, verificação da placa do fabricante, integridade do manual do proprietário e entrada de registro HIN. Todos os documentos de conformidade preparados e verificados antes da liberação da remessa.
      icon: tabler:file-certificate
    - title: 'Etapa 8: Liberação e rastreabilidade da remessa'
      description: A liberação final exige a aprovação de todos os estágios de CQ, a documentação de conformidade completa e a documentação de envio verificada. Registro do casco fechado e arquivado para retenção por mais de 10 anos.
      icon: tabler:truck
content_traceability:
  tagline: Rastreabilidade da Produção
  title: HIN → Arquivo Mestre →<br />Registro do Casco → Entrega
  subtitle: Cada barco RIB carrega um Número de Identificação de Casco exclusivo vinculado a uma cadeia completa de registros de produção e conformidade.
  items:
    - title: Número de identificação do casco (HIN)
      description: Identificador exclusivo de 14 caracteres marcado permanentemente em cada barco. Codifica o código do fabricante (MIC), designação do modelo, ano de produção e número de série. A chave que desbloqueia toda a cadeia de rastreabilidade.
      icon: tabler:hash
    - title: Arquivo Técnico Mestre
      description: A documentação de conformidade e engenharia para a família de modelos. Contém desenhos GA, avaliação de risco, cálculos de estabilidade, especificações de materiais e padrões aplicáveis. Vinculado a todos os cascos desse modelo.
      icon: tabler:folder
    - title: Registro Individual do Casco
      description: 'Registro de produção por casco: HIN, data de produção, lote de tubos, certificados de material, resultado do teste de pressão, configuração final, especificação do motor, resultados da lista de verificação de qualidade e destino de entrega. Mais de 21 campos de dados por casco.'
      icon: tabler:file-description
    - title: Pacote de Conformidade do Cliente
      description: Pacote de entrega por casco, incluindo DoC, foto da placa do construtor, manual do proprietário, lista de verificação de conformidade e folha de configuração final. Enviado com o barco e arquivado na fábrica por mais de 10 anos.
      icon: tabler:package
content_red_flags:
  tagline: Armadilhas de auditoria
  title: Compradores com bandeiras vermelhas<br />Facilmente identificados
  subtitle: Problemas comuns que prejudicam a confiança do comprador durante auditorias de fábrica. Abordamos proativamente cada um deles.
  items:
    - title: Reivindicações CE gerais sem escopo do modelo
      description: '“Todos os produtos com certificação CE” sem especificar qual diretiva, quais modelos e qual módulo de conformidade. Bandeira vermelha: sugere que a conformidade é superficial e não por modelo, por configuração.'
      icon: tabler:alert-triangle
    - title: Nenhuma evidência de teste físico
      description: 'Reivindicações de teste de pressão sem registros de teste, medidores ou estação de teste visíveis no chão de fábrica. Bandeira vermelha: as alegações de qualidade não podem ser verificadas durante a visita.'
      icon: tabler:alert-triangle
    - title: Rastreabilidade de material ausente
      description: 'Sem registros de lote, sem inspeção de entrada ou sem vínculo entre certificados de materiais e produtos acabados. Sinal de alerta: não há como rastrear problemas de qualidade até a origem.'
      icon: tabler:alert-triangle
    - title: Documentação genérica
      description: 'Um DoC cobrindo todos os modelos, sem registros específicos do HIN ou documentos de conformidade "modelo". Bandeira vermelha: a conformidade não está vinculada a unidades de produção individuais.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Envio e embalagem
  title: Carregamento e embalagem<br />de barcos RIB em contêiner
  subtitle: Nossas soluções de envio protegem seu investimento de Qingdao até o porto de destino. Planos de carregamento de contêiner e especificações de embalagem disponíveis para cada modelo.
  items:
    - title: Configurações de contêiner de 20 pés
      description: 'Contêiner padrão de 20 pés: 1-2 barcos RIB (4,0-5,5 m) encaixados com convés e tubos separados, ou 8-12 pranchas de SUP. Configurações mistas RIB + SUP disponíveis. Plano de carregamento detalhado fornecido por pedido.'
      icon: tabler:box
    - title: Configurações de contêiner de 40 pés
      description: 'Contêiner padrão de 40 pés: 2-4 barcos RIB (até 7,0 m) com cascos encaixados e tubos empilhados, ou 20-30 pranchas de SUP. Contêiner 40 pés HQ disponível para modelos de RIB mais altos. Embalagem otimizada em volume reduz o custo de envio por unidade.'
      icon: tabler:container
    - title: Embalagem de madeira para cascos de RIB
      description: Cascos de alumínio e GRP embalados em caixas de madeira sob medida com acolchoamento de espuma, barreira contra umidade e cintas de aço. Dimensões e peso das caixas por modelo disponíveis para planejamento logístico. Certificação ISPM-15 de madeira tratada termicamente incluída.
      icon: tabler:wood
    - title: Embalagem com separação de tubos e convés
      description: Tubos desinflados e dobrados separadamente dos cascos para eficiência de espaço. Placas do convés, consoles e assentos embalados em embalagem protetora com kits de ferragens de montagem. Instruções de remontagem incluídas em cada remessa.
      icon: tabler:package
    - title: Proteção contra umidade e corrosão
      description: Papel anticorrosivo VCI para componentes de alumínio, sachês dessecantes de gel de sílica e sacos de ferragens selados a vácuo. Previne danos por condensação durante o trânsito marítimo de 30-45 dias.
      icon: tabler:droplet-off
    - title: Documentação FOB Qingdao
      description: Conhecimento de embarque, fatura comercial, lista de embalagem, certificado de origem e documentação de conformidade por remessa. Consolidação FCL e LCL disponível. Suporte de documentação aduaneira para mercados da UE, EUA e Oriente Médio.
      icon: tabler:file-text
faq:
  title: Auditoria de fábrica — Perguntas frequentes
  questions:
    - q: Posso visitar a fábrica pessoalmente?
      a: Sim. Aceitamos auditorias de fábrica no local em nossas instalações de 12.000 m² em Qingdao. Nosso tour padrão abrange 8 estações, desde o armazém de matéria-prima até a sala de revisão de documentos. Visitas virtuais à fábrica por videochamada também estão disponíveis para qualificação inicial.
    - q: Você aceita auditorias de terceiros (BSCI, SMETA, SGS)?
      a: Sim. Mantemos a certificação BSCI (Intertek) e aceitamos protocolos de auditoria específicos do cliente. Também podemos organizar inspeções SGS ou TÜV mediante solicitação. Os relatórios de auditoria estão disponíveis sob NDA.
    - q: Posso ver o teste de pressão durante a visita?
      a: Nossa estação de teste de pressão faz parte da rota turística padrão. Dependendo do cronograma de produção, você poderá observar testes de pressão ativos com leituras de manômetros e registros de testes. Os registros de teste de pressão por casco estão sempre disponíveis para revisão.
    - q: Como você lida com produtos não conformes?
      a: As unidades não conformes são segregadas, documentadas e revisadas de acordo com nosso processo de ação corretiva ISO 9001. A análise da causa raiz é realizada, ações corretivas são implementadas e os registros são mantidos. Os compradores podem revisar nosso registro NCR durante as auditorias.
    - q: Que documentação de conformidade está disponível para análise?
      a: 'Durante a auditoria, você pode revisar: amostras de DoC específicas do modelo, especificações da placa do construtor, registro HIN, rascunhos do manual do proprietário, listas de padrões aplicáveis e registros de avaliação de conformidade por família de modelos.'
    - q: Como posso reservar uma visita virtual à fábrica?
      a: Entre em contato com nossa equipe de vendas para agendar um tour de vídeo ao vivo via WhatsApp, Zoom ou Teams. Seguimos a mesma rota de 8 estações e podemos nos concentrar em áreas específicas com base nos seus interesses. O tour virtual típico dura de 45 a 60 minutos.
    - q: A fábrica é o fabricante real ou uma empresa comercial?
      a: Aquafarer é o fabricante real. Operamos a fábrica em Laixi, Qingdao. Licença comercial, escopo de fabricação e produção física são verificáveis durante a auditoria.
    - q: Quais registros de qualidade posso revisar?
      a: Registros de inspeção de materiais recebidos, pontos de verificação de controle de qualidade em processo, registros de testes de pressão, listas de verificação de inspeção final de 100 pontos, relatórios de não conformidade, registros de ações corretivas e registros de rastreabilidade por casco. Tudo mantido de acordo com os requisitos da ISO 9001.
