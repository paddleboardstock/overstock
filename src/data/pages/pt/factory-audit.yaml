content_audit_evidence:
  tagline: Evidência de verificação
  title: Evidências de auditoria<br />Você pode verificar no local
  subtitle: Durante as visitas às fábricas, os clientes podem verificar evidências específicas em cada área de produção. Aqui está o que procurar – e o que preparamos para cada auditoria.
  areas:
    - area: Armazém de Matéria Prima
      what_to_verify: Os materiais são estáveis? Existe mistura em lote?
      evidence: Registros de inspeção de entrada, etiquetas de lote, armazenamento FIFO, lista de aprovação de fornecedores, certificados de materiais (PVC, Hypalon, fibra de vidro, alumínio, adesivos, ferragens)
      icon: tabler:building-warehouse
    - area: Produção de Tubos
      what_to_verify: Como é garantida a resistência da costura e a estanqueidade ao ar?
      evidence: Cartões de processo, confirmação do primeiro artigo, registros de teste de pressão por câmara, registros de reparo e reteste, registros de instalação de válvula
      icon: tabler:flame
    - area: Produção de Cascos
      what_to_verify: Como a consistência estrutural é controlada?
      evidence: Documentos de processo controlados, pontos de verificação de qualidade, numeração de produtos semiacabados, medições de espessura de gelcoat, verificação de cronograma de laminação
      icon: tabler:layers-subtract
    - area: Área de Montagem
      what_to_verify: Como as peças opcionais são evitadas contra montagem incorreta?
      evidence: BOM, ordens de serviço, listas de verificação de configuração, cartões de inspeção de estações de trabalho, verificações de torque e funcionais por modelo
      icon: tabler:tool
    - area: Estação de Testes
      what_to_verify: Como você confirma que o barco está bom antes da entrega?
      evidence: Procedimentos de teste, lista de instrumentos, registros de calibração, registros de testes de pressão (1,25x / 24-48h), listas de verificação de testes funcionais, critérios de aprovação/reprovação documentados
      icon: tabler:gauge
    - area: Área de Não Conformidade
      what_to_verify: Como os defeitos são tratados?
      evidence: Etiquetas de isolamento, registros NCR, análise de causa raiz, registros de aprovação de retrabalho, rastreamento de CAPA (Ação Corretiva e Preventiva)
      icon: tabler:alert-triangle
    - area: Armazém de produtos acabados
      what_to_verify: Como você evita envio incorreto e danos?
      evidence: Rótulos de produtos acabados, registros de correspondência de pedidos, padrões de embalagem, registros de inspeção pré-embarque
      icon: tabler:box
    - area: Peças de reposição e pós-venda
      what_to_verify: Você pode oferecer suporte ao pós-venda de longo prazo?
      evidence: Lista de peças de reposição comuns, estratégia de estoque, sistema de numeração de peças, documentação do processo de garantia, tutoriais de manutenção
      icon: tabler:headset
content_closing_script:
  tagline: Auditoria ao pedido
  title: Da visita à fábrica<br />ao projeto confirmado
  subtitle: Uma auditoria bem-sucedida não deve terminar com fotos e apertos de mão. Antes de partir, garantimos que três resultados comerciais sejam documentados.
  items:
    - title: Confirme a configuração técnica
      description: Combine o modelo, a aplicação, as principais opções, o mercado-alvo, a quantidade estimada e o cronograma de entrega – tudo documentado antes da partida.
      icon: tabler:checklist
    - title: Confirme os documentos da próxima etapa
      description: 'Defina o que Aquafarer fornece a seguir: GA revisado, lista de configuração, cotação, lista de verificação de documentos, plano de amostra ou NDA — com prazos específicos.'
      icon: tabler:file-plus
    - title: Confirmar cronograma mútuo
      description: Configuração revisada e cotação preliminar em 3 dias úteis. Confirmação de amostra ou aparência dentro de 7 dias. Revisão de engenharia ou inspeção de terceiros dentro de 14 dias. Data da próxima reunião e responsáveis ​​bloqueados.
      icon: tabler:calendar

