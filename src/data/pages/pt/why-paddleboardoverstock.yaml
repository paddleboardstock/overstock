hero:
  tagline: Por que Paddle Board Overstock
  title: Construído diferente. Feito para durar.<br />Os Conselhos por Trás de Aventuras Aquáticas ao Redor Mundo
  subtitle: Não apenas uma fábrica — uma equipe de remadores e engenheiros que projetam, testam e constroem SUP pranchas infláveis premium para famílias, aventureiros e clubes ao redor do mundo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock qualidade e expertise em manufatura
pillars:
  tagline: Três Pilares da Qualidade
  title: Por que os remadores do mundo todo escolhem Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Projetado Para Uso Comercial
      description: Nossas pranchas são projetadas para anos de remada regular. PVC drop-stitch Núcleos comerciais reforçados, UV materiais estáveis e equipamentos testados em campo significam menor manutenção e uma vida útil mais longa na água.
      icon: tabler:building-factory
      callToAction:
        text: Veja linha de produtos comercial
        href: /products
    - title: Testado Além dos Padrões
      description: Cada placa é inflada a 1,25 vezes a pressão nominal por 24-48 horas antes de sair da fábrica — 100% testada por pressão, 99,3% sem defeitos. Sua prancha já se comprova resistente antes mesmo de tocar na água.
      icon: tabler:shield-check
      callToAction:
        text: Veja como testamos
        href: /quality
    - title: Construído Para Condições Globais
      description: 'Produtos otimizados para cada clima: formulações para água fria PVC para a Europa, materiais resistentes UV para o Oriente Médio e Austrália, tratamentos anti-umidade para o Sudeste Asiático. Cada envio é calibrado para o ambiente de destino.'
      icon: tabler:world
