pillars:
  tagline: Três Pilares da Parceria
  title: Por que as empresas de água do mundo escolhem Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Projetado Para Uso Comercial
      description: Nosso equipamento é projetado para aluguel diário, não para recreação de fim de semana. Núcleos comerciais PVC, reforçados drop-stitch, opções UV-estáveis Hypalon e hardware testado em campo significam menor manutenção, vida útil mais longa e maior ROI para sua operação.
      icon: tabler:building-factory
      callToAction:
        text: Veja linha de produtos comercial
        href: /products
    - title: Da Ideia ao Mercado
      description: 'Lance sua marca de esportes aquáticos em 90 dias. Nós o guiamos em cada etapa: validação do conceito, seleção de produtos, protótipo, produção, design de embalagem e envio global. Sem pressão de pedido mínimo — comece pequeno, escale com confiança.'
      icon: tabler:rocket
      callToAction:
        text: Comece sua jornada de marca
        href: /oem-odm-blueprint
    - title: Construído Para Condições Globais
      description: 'Produtos otimizados para cada clima: formulações para água fria PVC para a Europa, materiais resistentes UV para o Oriente Médio e Austrália, tratamentos anti-umidade para o Sudeste Asiático. Cada envio é calibrado para o ambiente de destino.'
      icon: tabler:world
