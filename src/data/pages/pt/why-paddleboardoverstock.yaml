reasons:
  tagline: A Diferença Paddle Board Overstock
  title: O Que Nos Diferencia
  isBeforeContent: false
  columns: 3
  items:
    - title: Fabricação Real, Não Comércio
      description: Nós possuímos e operamos uma fábrica de 12.000 m². Quando você faz parceria com Paddle Board Overstock, você trabalha diretamente com as pessoas que projetam, engenheiram e constroem seus produtos — sem intermediários.
      icon: tabler:building-factory
    - title: Abordagem Liderada pela Engenharia
      description: Nosso processo de design começa com o caso de uso, não com a categoria do produto. Otimizamos o formato do casco, a seleção de materiais e a configuração para como a placa será realmente usada na água.
      icon: tabler:engine
    - title: Qualidade comprovada
      description: Cada placa é testada por pressão até 1,25 vezes a pressão nominal durante 24 a 48 horas antes do envio, e 99,3% das nossas remessas chegam sem defeitos — com garantia.
      icon: tabler:award
    - title: Design Remador Primeiro
      description: 'Todo modelo começa com a forma como você rema: plataformas estáveis para iniciantes, formatos aerodinâmicos para touring e decks em tamanho real para yoga. Projetamos para remadores de verdade, não para especificações de showroom.'
      icon: tabler:adjustments
    - title: Logística Mundial
      description: Armazém nos EUA na Califórnia, envio direto de Weihai, frete aéreo para pedidos urgentes. Nós cuidamos da papelada e documentação alfandegária em todo o mundo.
      icon: tabler:truck-delivery
    - title: Suporte Vitalício
      description: Estamos atrás de placas que construímos há 20 anos. Peças de reposição genuínas, aconselhamento técnico, orientações de reparo — nossa equipe está ao nosso lado quando você precisar, onde quer que esteja.
      icon: tabler:lifebuoy
testimonials:
  tagline: Confiável para remadores ao redor do mundo
  title: O que dizem os remadores
  items:
    - content: Minha Ocean Voyager já lidou com tudo, desde manhãs calmas no lago até tardes costeiras agitadas. Duas temporadas depois, ainda parece e anda como nova.
      name: — Remador Recreativo, Califórnia
    - content: Fiquei nervoso ao comprar minha primeira prancha inflável online, mas a qualidade ficou óbvia no momento em que a infleci. Rígida, estável e lindamente acabada.
      name: — SUP Proprietário de primeira viagem, Alemanha
    - content: Remamos em família todo fim de semana de verão. Três pranchas, nenhum problema, e as crianças adoram os designs vibrantes.
      name: — Family Paddler, Austrália
    - content: O teste de pressão não é um discurso de marketing — minha prancha é firme como uma rocha na pressão máxima e não mostra elasticidade depois de um ano remando semanalmente.
      name: — Weekly Paddler, Holanda
cta:
  title: Pronto para encontrar sua prancha perfeita?
  subtitle: Converse com nossos especialistas em remada para obter conselhos honestos sobre como escolher a prancha certa — sem pressão, apenas ajuda de verdade.
  actions:
    - variant: primary
      text: Fale com nossa equipe
      href: /contact
    - text: Baixar catálogo de produtos
      href: /resources
