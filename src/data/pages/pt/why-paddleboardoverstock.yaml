reasons:
  tagline: A Diferença Paddle Board Overstock
  title: O Que Nos Diferencia
  isBeforeContent: false
  columns: 3
  items:
    - title: Fabricação Real, Não Comércio
      description: Nós possuímos e operamos uma fábrica de 12.000 m². Quando você faz parceria com Paddle Board Overstock, você trabalha diretamente com as pessoas que projetam, engenheiram e constroem seus produtos — sem intermediários.
      icon: tabler:building-factory
    - title: Abordagem Liderada pela Engenharia
      description: Nosso processo de design começa com o caso de uso, não com a categoria do produto. Otimizamos a forma do casco, a seleção de materiais e a configuração com base em como o equipamento será realmente utilizado em ambientes comerciais.
      icon: tabler:engine
    - title: Qualidade Certificada
      description: CE certificado, ISO sistema de qualidade, BSCI conforme, REACH conforme, USCG coletes salva-vidas aprovados Tipo III/V; todos os produtos atendem às normas internacionais aplicáveis.
      icon: tabler:certificate
    - title: Flexível OEM/ODM
      description: Cores dos tubos, layout do console, branding, embalagem — personalizamos de acordo com suas especificações. Sem pressão de pedido mínimo. Comece com um protótipo, aumente a produção com confiança.
      icon: tabler:adjustments
    - title: Logística Mundial
      description: Armazém nos EUA na Califórnia, envio direto de Qingdao, frete aéreo para pedidos urgentes. Nós cuidamos da papelada e documentação alfandegária em todo o mundo.
      icon: tabler:truck-delivery
    - title: Suporte Vitalício
      description: Nós oferecemos suporte para barcos que construímos há 20 anos. Peças de reposição genuínas, aconselhamento técnico, orientação para reparos — nossa equipe está disponível quando você precisar, onde quer que você esteja.
      icon: tabler:lifebuoy
testimonials:
  tagline: Confiado por marcas em todo o mundo
  title: O Que Nossos Parceiros Dizem
  items:
    - content: Trabalhamos com vários fabricantes na China, mas Paddle Board Overstock se destaca pelo suporte de engenharia e pela qualidade consistente. Eles tratam nossa marca como se fosse deles.
      name: — OEM Parceiro, Marca Europeia de Esportes Aquáticos
    - content: Seus Hypalon RIBs estão em serviço em nossa frota há mais de 5 anos. Manutenção mínima, excelente resistência UV. A garantia de 5 anos nos tubos nos dá confiança.
      name: — Operador de Frota, Grupo de Resorts do Oriente Médio
    - content: A equipe Paddle Board Overstock nos ajudou a desenvolver um design de placa SUP personalizado do conceito à produção em 90 dias. A qualidade superou nossas expectativas.
      name: — Distribuidor, Esportes Aquáticos Australianos
    - content: Como proprietário de uma pequena empresa, eu estava preocupado com os MOQs. Paddle Board Overstock trabalhou dentro do meu orçamento e me ajudou a lançar minha marca com apenas 50 pranchas. Agora estou pedindo 500.
      name: — Fundador da Marca, EUA SUP Empresa de Aluguel
