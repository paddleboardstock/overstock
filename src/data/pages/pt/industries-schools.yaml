hero:
  tagline: Escolas e centros de treinamento de esportes aquáticos
  title: Soluções de equipamentos<br />Para escolas de SUP e Kayak
  subtitle: Equipamento confiável de nível comercial para escolas de paddle, aulas de surf, treinamento de caiaque e programas de educação em esportes aquáticos em qualquer escala.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Pranchas Aquafarer SUP para escolas e centros de treinamento
direct_answer: Aquafarer fornece escolas de SUP e caiaque em todo o mundo com pranchas de nível comercial, equipamentos de segurança e pacotes de instrutores. Nosso equipamento é construído para uso instrucional diário - PVC mais espesso, núcleos de ponto de gota reforçados e designs de casco estáveis que dão confiança aos iniciantes e confiabilidade aos instrutores. Os pacotes incluem marca personalizada, programas de peças de reposição e recursos de treinamento.
solution_offerings:
  - title: Pacote inicial escolar
    subtitle: Para novos programas e pequenos centros de treinamento
    badge: Popular
    features:
      - title: Pranchas para alunos
        description: 10 a 25 pranchas de SUP versáteis ou caiaques recreativos com plataformas estáveis para aulas para iniciantes
      - title: Pranchas para instrutores
        description: Pranchas mais largas e longas com estabilidade extra e decks de EVA antiderrapantes para treinamento
      - title: Equipamento de segurança
        description: Coletes salva-vidas, trelas, apitos e bolsas em cores correspondentes
      - title: Armazenamento e Transporte
        description: Racks empilháveis para pranchas, berços acolchoados para caiaque e carrinhos de transporte
      - title: Apoio Curricular
        description: Modelos de aulas, listas de verificação de segurança e guias de progressão de habilidades
    cta_text: Iniciar meu pacote escolar
    cta_href: /contact
  - title: Pacote Escolar Premium
    subtitle: Para escolas estabelecidas e operadores multiprogramas
    badge: Best Value
    features:
      - title: Frota Completa
        description: 25–50 pranchas ou caiaques com frota mista (versáteis, de turismo, tamanhos juvenis)
      - title: Frota de Instrutores
        description: 3 a 5 quadros de instrutores especializados com suportes de sistema de som integrados
      - title: Estação de Segurança
        description: Estação centralizada de equipamentos de segurança com PFDs, rádios, primeiros socorros e sinalização
      - title: Pacote de marca
        description: Impressão completa do logotipo em pranchas, remos, PFDs e uniformes
      - title: Programa de Manutenção
        description: Kits de manutenção trimestrais, pacotes de peças sobressalentes e treinamento de reparo
    cta_text: Montar pacote Premium
    cta_href: /contact
  - title: Pacote de Franquia Escolar
    subtitle: Para redes com vários locais e operadoras de franquia
    badge: Enterprise
    features:
      - title: Padronização de Frota
        description: Equipamentos idênticos em todos os locais para uma experiência consistente do aluno
      - title: Pedido Central
        description: Pedidos consolidados, preços em grandes quantidades e gerenciamento centralizado de peças de reposição
      - title: Treinamento de instrutor
        description: Certificação de manuseio e manutenção de equipamentos para todos os instrutores
      - title: Co-branding
        description: Marca conjunta com franquia + opções de co-branding Aquafarer
      - title: Suporte à Expansão
        description: Consulta de dimensionamento, previsão de equipamentos e configuração de novos locais
    cta_text: Discutir plano de franquia
    cta_href: /contact
benefits:
  - title: Construído para instrução diária
    description: PVC mais espesso e trilhos reforçados resistem ao uso diário dos alunos, quedas na areia e aterrissagens rochosas.
    icon: tabler:shield
  - title: Plataformas de aprendizagem estáveis
    description: Cascos mais largos e balancins mais planos dão confiança aos iniciantes. Os instrutores se concentram no ensino, não no equipamento.
    icon: tabler:scale
  - title: Fácil armazenamento e transporte
    description: Lojas de design inflável em espaços pequenos. As placas vazias cabem em porta-malas de veículos padrão para ensino móvel.
    icon: tabler:box-seam
  - title: Marca personalizada
    description: Logotipos e cores da escola em todos os quadros. Sua marca, sua identidade – não equipamentos genéricos de aluguel.
    icon: tabler:brush
content_segments:
  tagline: Perfis escolares
  title: Soluções para educação em esportes aquáticos<br />Por tipo de programa
  subtitle: Escolas de paddle, academias de surf, programas universitários e operadores de franquia enfrentam, cada um, diferentes desafios operacionais – desde a integração curricular até a padronização da frota em vários locais. Configuramos pacotes de equipamentos adequados ao modelo educacional.
  items:
    - title: Escolas independentes de SUP e caiaque
      subtitle: Centros de treinamento operados pelo proprietário
      description: Escolas de pequeno e médio porte administradas por instrutores proprietários que oferecem aulas de SUP, treinamento de caiaque e cursos de certificação. O equipamento deve ser durável o suficiente para uso instrucional diário, acessível para o orçamento de uma pequena empresa e versátil o suficiente para atender alunos iniciantes até intermediários em uma única frota.
      features:
        - Pranchas SUP polivalentes estáveis e caiaques recreativos para aulas de principiantes
        - Pranchas específicas para instrutores com estabilidade extra para instrução a partir da água
        - Modelos de planos de aula e guias de progressão de habilidades incluídos
        - Programa anual de renovação de equipamentos com descontos de troca
    - title: Programas de recreação universitária e universitária
      subtitle: Frotas de recreação estudantil em grande escala
      description: Departamentos de recreação universitária que operam clubes de paddle, programas de aluguel e cursos de instrução como parte das ofertas de recreação no campus. O equipamento enfrenta pico de uso durante os semestres, requer sistemas fáceis de check-in/check-out e deve suportar níveis variados de habilidade, desde estudantes iniciantes até remadores avançados.
      features:
        - Construção em PVC de alta durabilidade classificada para ciclos de uso institucional
        - Frotas codificadas por cores conforme o nível de habilidade para fácil gestão
        - Compatibilidade com sistemas de rastreamento de inventário por RFID ou etiquetas
        - Preços de atacado com pedidos e condições de pagamento semestrais
    - title: Escolas e academias de surf
      subtitle: Programas de instrução de surf costeiro
      description: Escolas de surf ensinando habilidades de SUP surf, remo propenso e caiaque de surf em ambientes oceânicos. O equipamento deve lidar com as condições da zona de surfe – resistência ao impacto, tolerância à areia e à água salgada e fácil troca de enxágue e retorno entre as aulas de hora em hora.
      features:
        - Formas específicas de surf com bordas reforçadas e construção resistente a impactos
        - Opções de quilhas flexíveis e leashs enrolados para a segurança dos alunos
        - Tecido de enxágue rápido que seca entre as rodadas de aulas
        - Programa de substituição de frota com inspeção e renovação no fim da temporada
    - title: Franquias e cadeias multilocais
      subtitle: Equipamento padronizado em todos os locais
      description: Operadores em vários locais executando programas de treinamento padronizados em diversas cidades ou regiões. A consistência da frota entre locais é fundamental – todos os alunos devem ter a mesma experiência com equipamentos, independentemente do local da franquia que visitam. Pedidos centralizados, uniformidade de marca e suporte de dimensionamento são essenciais.
      features:
        - Especificações de frota idênticas em todas as unidades de franquia
        - Pedidos centralizados e consolidados com preços por volume
        - 'Opções de co-branding: marca da franquia + co-branding da Aquafarer'
        - 'Kit de abertura de nova unidade: equipamento, sinalização e estoque inicial'
cta:
  title: Pronto para equipar sua escola?
  subtitle: Entre em contato com nossa equipe para um plano de equipamento personalizado. Trabalhamos com escolas de todos os portes.
  actions:
    - variant: primary
      text: Fale com nossa equipe
      href: /contact
    - text: Ver catálogo de produtos
      href: /products
