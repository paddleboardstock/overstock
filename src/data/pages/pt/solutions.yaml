features3_solutions:
  tagline: Soluções
  title: Sua aventura aquática<br />Parceiro de negócios
  isBeforeContent: false
  columns: 3
  items:
    - title: Clubes de esportes aquáticos
      description: Pacotes completos de equipamentos, marcas personalizadas e programas de manutenção para clubes SUP, clubes de caiaque, escolas de surf e centros de treinamento.
      icon: tabler:users
      link: /solutions/clubs
    - title: RIBs para esportes aquáticos
      description: RIBs especialmente desenvolvidos para escolas de vela, centros de esportes aquáticos e organizações de eventos. Barcos de ônibus, barcos de reboque e embarcações de marechal para esportes aquáticos profissionais.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorts e hotéis
      description: Programas premium de esportes aquáticos com equipamentos de frota, sistemas de segurança, treinamento de equipe e gerenciamento de receitas para propriedades hoteleiras.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Empreendedores de marcas de água
      description: Fabricação de marca própria OEM/ODM com baixo MOQ, design de produto personalizado, embalagem e remessa global para novos proprietários de marcas.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Barcos do Centro de Mergulho
      description: Plataformas RIB estáveis com entrada/saída fácil, armazenamento de equipamentos e configurações de motor otimizadas para operações de mergulho.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Embarcações de Resgate e Emergência
      description: RIBs de alta velocidade e barcos infláveis projetados para busca e resgate, resposta a emergências e operações da guarda costeira.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Soluções de Tender de Iate
      description: Tenders RIB compactos e elegantes que complementam superyates e embarcações recreativas. Armazenamento fácil, desempenho poderoso.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Soluções de Barcos de Pesca
      description: Barcos infláveis estáveis e duráveis e RIBs configurados para operações de pesca comerciais e recreativas.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Equipamentos de Turismo Marítimo
      description: Barcos infláveis prontos para frotas, pranchas SUP e caiaques para resorts, operadores de turismo e empresas de aluguel de esportes aquáticos.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIBs de energia offshore
      description: RIBs pesados ​​para suporte de plataformas de petróleo e gás, transferência de tripulação de parques eólicos, inspeção de cabos submarinos e construção marítima.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Barcos de trabalho para aquicultura
      description: RIBs resistentes à corrosão para piscicultura, cultivo de pérolas e pecuária oceânica. Hypalon tubos, ferragens de aço inoxidável, durabilidade no uso diário.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Pesquisa e levantamento marinho
      description: RIBs estáveis ​​e prontos para instrumentos para pesquisa oceanográfica, monitoramento ambiental, amostragem de qualidade da água e programas de ensino universitário.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Embarcações de Trabalho Comerciais
      description: RIBs reforçados para patrulha, levantamento, transporte e logística offshore. Construídos para as exigências rigorosas de operações comerciais.
      icon: tabler:ship
      link: /commercial-workboats
cta:
