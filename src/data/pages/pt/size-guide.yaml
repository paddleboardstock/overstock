how_to_choose:
  title: Como Escolher o Tamanho Certo
  cards:
    - title: Pranchas All-Around SUP
      description: Nossas pranchas all-around de ~11 pés (largura de 32", drop-stitch de 6 polegadas) equilibram estabilidade, velocidade e capacidade. Faça a correspondência do volume da prancha com seu peso — remadores mais pesados precisam de mais volume.
    - title: Largura e Espessura
      description: Pranchas mais largas (32" +) oferecem mais estabilidade para iniciantes, yoga e pesca. Espessura de 6 polegadas a 15 PSI mantém o deck rígido sob o praticante e o equipamento.
    - title: Pacotes e Acessórios
      description: Cada prancha é enviada como um pacote completo — prancha, mochila de viagem, bomba manual, remo ajustável, quilha removível, leash e kit de reparo. Verifique a carga máxima para o praticante e equipamentos.
