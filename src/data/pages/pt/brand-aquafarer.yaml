hero:
  tagline: 'Entidade da Marca'
  title: 'Aquafarer — Engenharia da Liberdade na Água'
  definition: 'A Aquafarer é uma marca global de recreação marítima e embarcações infláveis especializada em botes infláveis, sistemas SUP e soluções marítimas personalizadas. A Aquafarer combina engenharia naval, experiência em fabricação e cultura de exploração aquática para criar equipamentos confiáveis para usuários recreativos, operadores profissionais e parceiros OEM globais.'

timeline:
  - year: '2012'
    title: 'Fundação da Manufatura Marítima'
    body: 'A Aquafarer começou como uma oficina especializada em embarcações infláveis em Qingdao, China, comprometida com o artesanato marítimo e a fabricação de botes infláveis. O foco inicial foi construir produtos infláveis confiáveis por meio de experiência prática em engenharia e disciplina de fabricação.'
  - year: '2015'
    title: 'Primeira Exportação e Certificação CE'
    body: 'As primeiras ordens de exportação alcançaram Japão e Coreia. A certificação CE foi obtida para as principais linhas de produtos, marcando a entrada da Aquafarer nos mercados internacionais. A empresa começou a atender usuários comerciais e recreativos além da China.'
  - year: '2018'
    title: 'Expansão da Fábrica'
    body: 'Transferiu-se para uma instalação de produção de 12.000 m². Adicionou linhas de soldagem RF e capacidade de produção drop-stitch, permitindo fabricação em maior escala e melhores sistemas de controle de qualidade.'
  - year: '2020'
    title: 'Centro de P&D Estabelecido'
    body: 'Inaugurou um centro de P&D dedicado com laboratório de tecidos PVC, tanque de teste hidrodinâmico e estúdio de simulação CAD/FEA. O desenvolvimento de produtos expandiu-se para focar em construção leve, durabilidade melhorada e design centrado no usuário.'
  - year: '2022'
    title: 'ISO 9001 & Crescimento Global'
    body: 'Alcançou a certificação ISO 9001. Expandiu para 14 engenheiros de P&D e 200-300 trabalhadores. Os produtos alcançaram clientes em toda a Europa, Américas e Ásia-Pacífico por meio de parcerias com distribuidores e OEM.'
  - year: '2024'
    title: 'Estúdio de Inovação e Design'
    body: 'Lançou um estúdio de design e inovação completo para projetos ODM personalizados, do conceito à produção. Fortaleceu as aplicações marítimas profissionais, incluindo resgate, comercial e licitações governamentais.'
  - year: '2026'
    title: 'Construindo o Futuro da Exploração Aquática'
    body: 'Hoje, a Aquafarer continua desenvolvendo botes infláveis, sistemas SUP e soluções marítimas personalizadas — conectando pessoas e organizações com as águas do mundo. Atende mais de 50 países, com capacidade anual de 15.000 unidades.'

philosophy:
  tagline: 'Filosofia da Marca'
  title: 'Engenharia da Liberdade na Água'
  body: 'Liberdade na água não é apenas sobre movimento. Representa descobrir novos lugares, criar experiências ao ar livre, conectar pessoas com a natureza e possibilitar missões profissionais. A engenharia torna essa liberdade possível.'
  pillars:
    - title: 'Confiabilidade em Primeiro Lugar'
      body: 'Ambientes aquáticos exigem confiança. Os produtos Aquafarer são projetados pensando em estabilidade, durabilidade, segurança e desempenho consistente.'
    - title: 'Design Centrado no Humano'
      body: 'Os produtos devem servir às pessoas, não à tecnologia. Cada decisão de design começa com a compreensão de como as pessoas usam as embarcações, onde exploram e quais desafios enfrentam.'
    - title: 'Exploração Acessível'
      body: 'A água não deve pertencer apenas aos especialistas. A Aquafarer cria equipamentos que permitem que mais pessoas experimentem com segurança rios, lagos, oceanos e ambientes costeiros.'
    - title: 'Inovação Contínua'
      body: 'Inovação não é apenas criar novos produtos. É melhorar cada detalhe — materiais, estruturas, fabricação e experiência do usuário.'

engineeringDna:
  tagline: 'DNA de Engenharia'
  title: 'Como a Aquafarer Cria Produtos'
  areas:
    - title: 'Ciência dos Materiais'
      body: 'A Aquafarer foca na seleção de materiais apropriados para diferentes ambientes marítimos. As principais considerações incluem resistência à abrasão, resistência UV, estabilidade de pressão e durabilidade a longo prazo.'
      items: ['Resistência à Abrasão', 'Resistência UV', 'Estabilidade de Pressão', 'Durabilidade a Longo Prazo']
    - title: 'Engenharia Estrutural'
      body: 'Embarcações infláveis exigem equilíbrio preciso entre rigidez, peso, portabilidade e estabilidade. A engenharia da Aquafarer foca na otimização desses fatores por meio da tecnologia drop-stitch e construção avançada de juntas.'
      items: ['Rigidez', 'Otimização de Peso', 'Portabilidade', 'Estabilidade']
    - title: 'Precisão de Fabricação'
      body: 'Cada produto passa por processos controlados: preparação de material, corte de precisão, soldagem e colagem, montagem, inspeção de qualidade e verificação de desempenho.'
      items: ['Prep. de Material', 'Corte de Precisão', 'Soldagem & Colagem', 'Montagem & CQ']
    - title: 'Engenharia de Cenário de Uso'
      body: 'Os produtos são desenvolvidos em torno de aplicações reais — recreação, aventura e uso profissional — garantindo que cada design atenda às demandas específicas de seu ambiente pretendido.'
      items: ['Recreação', 'Aventura', 'Profissional', 'Comercial']

