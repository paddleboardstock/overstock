    body: 'A Aquafarer atende clientes em vários mercados globais, apoiando distribuidores, marcas de atividades ao ar livre e usuários marítimos profissionais em mais de 50 países na Europa, Ásia-Pacífico, Américas, Oriente Médio e África.'

