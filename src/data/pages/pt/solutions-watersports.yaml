content_challenge:
  tagline: O desafio
  title: Operações de esportes aquáticos<br />Exigem RIBs versáteis
  subtitle: Escolas de vela, centros de esportes aquáticos e organizadores de eventos precisam de barcos que possam desempenhar diversas funções – treinamento, reboque, segurança e transporte – muitas vezes alternando entre funções em questão de horas.
  paragraphs:
    - Os esportes aquáticos estão entre os setores marítimos mais diversificados — abrangendo desde a instrução de vela até atividades motorizadas como wakeboard e esqui aquático, passando por competições de todos os níveis. Cada aplicação exige capacidades diferentes da embarcação, mas muitos operadores precisam de uma única frota capaz de cumprir múltiplos papéis ao longo da jornada diária.
    - '**As escolas de vela** precisam de RIBs de instrução estáveis o suficiente para os instrutores ficarem de pé e fazerem demonstrações, rápidos o suficiente para alcançar velistas emborcados com agilidade e resistentes o suficiente para encalhes repetidos na praia. A embarcação precisa ser visível, manobrável nos espaços apertados da marina e capaz de rebocar veleiros de volta à margem quando o vento cai.'
    - '**Os centros de esportes aquáticos** que operam esqui aquático, wakeboard e passeios de boia precisam de barcos de reboque de propósito específico, com características de esteira consistentes, forte aceleração na arrancada e maior autonomia para sessões consecutivas de riders. A estabilidade em baixa velocidade é crítica para a recolha dos riders e o monitoramento de segurança.'
    - '**Os organizadores de eventos** que gerenciam regatas, triatlons e competições aquáticas exigem embarcações de marshalling e segurança capazes de patrulhar os limites do percurso, fazer cumprir as regras, responder a emergências e transportar oficiais — tudo isso mantendo uma aparência profissional e desempenho confiável ao longo de eventos de vários dias.'
    - O ponto comum dos três segmentos é a necessidade de RIBs versáteis, duráveis e equipados profissionalmente, capazes de operar em condições variadas com tempo de inatividade mínimo. A Paddle Board Overstock constrói RIBs para esportes aquáticos configurados para cada um desses papéis específicos.
content_solution:
  tagline: Nossa solução
  title: RIBs para esportes aquáticos<br />Construídos para todas as funções
  subtitle: Os RIBs para esportes aquáticos Paddle Board Overstock são projetados com configurações modulares que permitem que uma única plataforma de barco atenda a diversas funções em sua operação.
  list:
    - Projeto de casco estável — os instrutores podem ficar de pé e se mover com confiança enquanto ensinam a partir do barco
    - Mastro de reboque e pontos de fixação de corda para esqui aquático, wakeboard e reboque de boias
    - Aceleração rápida com pareamento motor-casco adequado para o reboque de esportes aquáticos
    - Layouts de assentos profissionais para o conforto do instrutor, técnico ou oficial durante longas sessões na água
    - Console completo com para-brisa, eletrônica de navegação, rádio VHF e compartimento para equipamentos de segurança
    - Tubos de Hypalon ou PVC de grau marítimo — resistentes a UV e à água salgada para maior vida útil
    - Superfície de convés antiderrapante — movimento seguro da tripulação quando o convés está molhado por respingos ou pela recolha dos riders
    - Personalização de marca e kits de adesivos — nas cores da sua escola, centro ou evento
    - Pontos de içamento para davits e reforço para encalhes na praia, para lançamento e recolha diários
    - Configurações de motores de popa 4 tempos econômicos para jornadas diárias de operação prolongadas
content_segments:
  tagline: Perfis de esportes aquáticos
  title: Soluções RIB<br />Por tipo de esportes aquáticos
  subtitle: Diferentes operações de desportos aquáticos exigem diferentes configurações de barco – adaptamos cada RIB à função específica que irá desempenhar.
  items:
    - title: Escolas e centros de treinamento de vela
      subtitle: RIBs de ônibus para instrução de navegação, cobertura de segurança e reboque de veleiro
      description: As escolas de vela operam em baías protegidas, lagos e águas costeiras – realizando sessões de treinamento para iniciantes até velejadores avançados durante todo o ano. O ônibus RIB serve como plataforma móvel de ensino, embarcação com cobertura de segurança e rebocador. Os instrutores precisam de um convés estável para ficar de pé e demonstrar, resposta rápida para alcançar os alunos emborcados e construção robusta para desembarques diários na praia e manobras na marina. A confiabilidade é fundamental – um barco quebrado significa aulas canceladas e alunos decepcionados. O barco também deve ter uma aparência profissional que reflita a qualidade da escola.
      features:
        - Plataforma estável com borda livre baixa para comunicação entre instrutor e aluno a curta distância
        - Convés antiderrapante e corrimãos para a segurança do instrutor em pé e em movimento
        - Mastro de reboque e ponto de fixação de tirante para devolver à margem veleiros avariados
        - Casco de deslize rápido para resposta imediata a alunos emborcados ou à deriva
        - Comprimento compacto (4,3-5,2 m) para reboque e armazenamento fáceis entre temporadas
        - Opções de cores de alta visibilidade para localização fácil em toda a área de treinamento
        - Opções de proteção de hélice para a segurança dos alunos em manobras de curta distância
    - title: Centros de esportes aquáticos e operadores de reboque
      subtitle: RIBs de reboque para esqui aquático, wakeboard e passeios de tubo inflável
      description: Centros de esportes aquáticos que operam em lagos, rios e trechos costeiros realizam operações de reboque de alto volume diariamente – esqui aquático, wakeboard, kneeboard e passeios de metrô rebocável para turistas e moradores locais. O barco de reboque precisa de características de esteira consistentes, forte aceleração para colocar os passageiros no plano rapidamente e manuseio estável em baixa velocidade para recuperação do piloto e queda. Esses barcos operam em águas rasas perto da costa, exigindo cascos reforçados e proteção das hélices. A eficiência de combustível é importante ao realizar sessões consecutivas de 8 a 10 horas diárias. O barco também serve como plataforma de segurança – transportando um motorista, um observador e, às vezes, um treinador – ao mesmo tempo que parece convidativo para os clientes pagantes.
      features:
        - Potência do motor adequada ao uso para forte arrancada e velocidade de reboque constante
        - Mastro de reboque e pontos de fixação de corda posicionados para um ângulo de tração ideal do rider
        - Esteira suave e previsível para uma experiência confortável e segura do rider
        - Estabilidade em baixa velocidade para recolha segura dos riders após quedas
        - Quilha e casco reforçados para operações frequentes na praia e em águas rasas
        - Túnel de hélice ou protetor para operação com segurança em áreas rasas
        - Capacidade de combustível ampliada para 6 a 8 horas de operações contínuas de reboque
        - Assentos para piloto e observador com visibilidade clara do rider em todos os momentos
    - title: Organizações de eventos e competições
      subtitle: RIBs de marechal, segurança e transporte oficial para eventos marítimos
      description: Os organizadores de regatas, diretores de corridas de triatlo e coordenadores de competições de esportes aquáticos precisam de RIBs confiáveis e com aparência profissional para gerenciamento de percurso, cobertura de segurança e transporte oficial. Esses barcos patrulham os limites do percurso, aplicam as regras de regata, fornecem assistência médica de primeira resposta e transportam juízes e pessoal da mídia. Os eventos acontecem em todas as condições climáticas – vento, oscilações e correntes – exigindo manuseio estável e desempenho confiável. A aparência do barco é importante porque representa a marca do evento diante dos participantes, espectadores e mídia. Eventos de vários dias exigem barcos que possam operar dia após dia com tempo mínimo de inatividade para manutenção.
      features:
        - Casco estável para oficiais em pé e operação segura de câmeras em qualquer condição
        - Conjunto completo de navegação — cartográfico GPS, rádio VHF e luzes de navegação para operações no início da manhã e fim da tarde
        - Compartimento para kit médico de primeira resposta para intervenções de emergência
        - Personalização profissional de marca e kits de adesivos para a visibilidade dos patrocinadores do evento
        - Múltiplas configurações de assentos para oficiais, imprensa e equipe médica
        - Velocidade de deslize rápida para reposicionamento ágil do percurso e resposta a emergências
        - Console com proteção contra intempéries e para-brisa para conforto em longas jornadas na água
        - Construção de tubos durável para o contato no cais em marinas de eventos lotadas
