materials:
  intro_p1: O desempenho, a durabilidade e a segurança de uma embarcação inflável dependem quase inteiramente dos materiais utilizados na sua fabricação. Do tecido que forma os flutuadores aos fios que dão rigidez a uma prancha de SUP — cada escolha de material afeta o comportamento do produto na água e sua vida útil.
  intro_p2: 'Este guia aborda os quatro materiais principais usados em embarcações infláveis modernas: tecido de PVC, borracha Hypalon CSM, construção com núcleo drop-stitch e coberturas de espuma EVA. Entender esses materiais ajudará você a escolher o produto certo para suas necessidades e a mantê-lo para a máxima vida útil.'
  labels:
    advantages: Vantagens
    limitations: Limitações
    best_for: 'Ideal para:'
  items:
    - name: PVC (cloreto de polivinila)
      summary: O padrão da indústria para barcos infláveis e SUPs de recreação. O tecido laminado multicamadas oferece excelente relação resistência-peso a um preço acessível.
      pros:
        - Acessível — 30-50 % mais barato que o Hypalon
        - Leve e fácil de manusear
        - Boa resistência aos raios UV com os revestimentos adequados
        - Ampla variedade de cores e acabamentos
        - Fácil de reparar com remendos de PVC e adesivo à base de solvente
      cons:
        - Vida útil mais curta que o Hypalon (7-10 anos)
        - Menos flexível em temperaturas baixas
        - Menor resistência química
        - Pode desenvolver migração de plastificantes com o tempo
      best_for: SUPs de recreação, barcos econômicos, frotas de aluguel, uso sazonal, águas doces e ambientes costeiros.
    - name: Hypalon (borracha CSM)
      summary: Material premium de borracha sintética conhecido por sua durabilidade excepcional, resistência aos raios UV e longevidade. O padrão-ouro para barcos infláveis comerciais e de grau militar.
      pros:
        - Resistência excepcional a raios UV e ozônio
        - Vida útil de 15-20 anos com os devidos cuidados
        - Excelente flexibilidade em clima frio
        - Superior resistência a produtos químicos e óleos
        - Retém a cor por mais tempo que o PVC
      cons:
        - Significativamente mais caro que o PVC
        - Tecido mais pesado
        - Menos opções de cores
        - Reparos exigem adesivos especializados
        - Menos unidades fabris no mundo
      best_for: RIBs comerciais, busca e resgate, aplicações militares, climas tropicais, posse de frota de longo prazo.
    - name: Núcleo drop-stitch
      summary: A tecnologia que revolucionou os SUPs infláveis. Milhares de fios de poliéster conectam as camadas superior e inferior do tecido, permitindo inflagem em alta pressão para desempenho de prancha rígida.
      pros:
        - Extremamente rígido a 12-20 PSI
        - Leve — 18-30 lbs para uma prancha de tamanho completo
        - Dobra-se plano para armazenamento e viagens
        - Excelente resistência a impactos
        - Desempenho consistente em todas as faixas de temperatura
      cons:
        - Requer bomba de alta pressão
        - Reparo de furos mais complexo que em construção de camada única
        - Custo de fabricação maior que o de infláveis padrão
        - Perda de pressão ao longo do tempo exige reforço periódico
      best_for: Pranchas de stand-up paddle, caiaques, pisos infláveis para barcos — qualquer aplicação que exija rigidez com a portabilidade inflável.
    - name: Cobertura de espuma EVA
      summary: Espuma EVA de células fechadas (etileno-acetato de vinila) usada nos tapetes de tração de pranchas de SUP e coberturas de barcos. Proporciona amortecimento, aderência e isolamento térmico.
      pros:
        - Excelente aderência antiderrapante, molhada ou seca
        - O amortecimento reduz a fadiga em remadas longas
        - Isolamento térmico contra superfícies frias
        - Resistente a raios UV e à água salgada
        - Disponível em composições multicoloridas e designs gravados a laser
      cons:
        - Pode desgastar-se com uso intenso após 2-3 anos
        - Deve ser colada corretamente para evitar delaminação
        - Não estrutural — não afeta a rigidez
        - Adiciona leve peso (200-400 g por prancha)
      best_for: Tração de cobertura para SUP, revestimento de coberta de barco, conforto do assento de caiaque — qualquer superfície que exija apoio antiderrapante.
  selection:
    title: Guia de seleção de materiais
    subtitle: 'Escolha o material certo com base no seu uso principal:'
    headers:
      - Uso
      - Material recomendado
      - Por quê
    rows:
      - - Remada de recreação em SUP
        - PVC drop-stitch
        - Leve, rígido, acessível — equilíbrio ideal para remadores casuais
      - - Bote familiar / barco de lago
        - PVC (1100 denier)
        - Custo-benefício, fácil de reparar, durabilidade suficiente para uso recreativo
      - - RIB comercial / barco de patrulha
        - Hypalon CSM
        - Máxima resistência aos raios UV, vida útil de 15-20 anos, resistência a químicos e óleos
      - - Frota de pranchas SUP para aluguel
        - PVC drop-stitch + cobertura EVA
        - Durável, reparável, bom custo-benefício para uso intenso
      - - Operações de busca e resgate
        - Hypalon CSM
        - Confiabilidade em condições extremas, flexibilidade a frio, resistência química
      - - Caiaque de travessia / expedição
        - PVC drop-stitch
        - Desempenho rígido com portabilidade dobrável para viagens
  deep_dive:
    title: Guias aprofundados
    topics:
      - title: PVC de grau marítimo
        desc: Tecido de PVC laminado multicamadas — resistência aos raios UV, testes de abrasão e índices denier explicados.
      - title: Comparação PVC vs Hypalon
        desc: A comparação definitiva dos dois materiais dominantes dos barcos infláveis — custo, vida útil, resistência aos raios UV.
      - title: Núcleo drop-stitch
        desc: Como milhares de fios internos criam estruturas infláveis rígidas de alta pressão a 12-15 PSI.
      - title: Tecnologia de soldagem RF
        desc: A soldagem por radiofrequência cria costuras fortes e uniformes — como funciona e por que é importante.
      - title: PSI e desempenho
        desc: Por que a pressão do ar importa para SUPs e barcos infláveis — rigidez, capacidade de carga e qualidade de navegação.
      - title: Testes de qualidade
        desc: Testes de pressão, testes de flutuação, envelhecimento UV e testes destrutivos — nosso processo de qualidade.
      - title: Coberturas de espuma EVA
        desc: Tapetes de espuma EVA de células fechadas — tração, conforto e durabilidade para coberturas de SUP e barcos.
      - title: Cuidados com os materiais
        desc: Limpeza, proteção UV, prevenção de mofo e boas práticas de armazenamento de produtos infláveis.
