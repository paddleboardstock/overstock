materials:
  intro_p1: O desempenho, a durabilidade e a segurança de uma prancha de paddle inflável dependem quase totalmente dos materiais usados em sua construção. Desde o laminado que forma o casco até os fios que dão a uma prancha SUP sua rigidez, cada escolha de material afeta como o produto se comporta na água e sua durabilidade.
  intro_p2: 'Este guia cobre os três materiais principais usados nas pranchas de paddle infláveis modernas: o laminado PVC, o núcleo drop-stitch e o deck de espuma EVA. Compreender esses materiais ajudará você a escolher a prancha certa para suas necessidades e a mantê-la para uma vida útil máxima.'
  labels:
    advantages: Vantagens
    limitations: Limitações
    best_for: 'Melhor para:'
  items:
    - name: PVC (cloreto de polivinila)
      summary: O padrão da indústria para SUPs infláveis. Tecido laminado multicamadas oferece excelente relação resistência-peso a um preço acessível.
      pros:
        - Excelente custo-benefício
        - Leve e fácil de manusear
        - Boa resistência a UV com revestimentos adequados
        - Ampla variedade de cores e acabamentos
        - Fácil de reparar com remendos PVC e adesivo solvente
      cons:
        - Vida útil típica de 7-10 anos com cuidados adequados
        - Menos flexível em temperaturas frias
        - Menor resistência química
        - Pode desenvolver migração de plastificante ao longo do tempo
      best_for: SUPs recreativas e de turismo, remadas em família, uso sazonal, ambientes de água doce e costeiros.
    - name: Drop-Stitch Núcleo
      summary: A tecnologia que revolucionou os SUPs infláveis. Milhares de fios de poliéster conectam as camadas superior e inferior do tecido, permitindo inflação de alta pressão para desempenho rígido, semelhante a cascos duros.
      pros:
        - Extremamente rígido entre 12-20 PSI
        - Leve — 18-30 lbs para prancha de tamanho completo
        - Dobra plana para armazenamento e viagem
        - Excelente resistência ao impacto
        - Desempenho consistente entre faixas de temperatura
      cons:
        - Requer bomba de alta pressão
        - Reparo de perfuração é mais complexo do que o de camada única
        - Custo de fabricação maior do que os infláveis padrão
        - A perda de pressão ao longo do tempo requer recarga periódica
      best_for: Pranchas de paddle up e qualquer equipamento que precise de desempenho rígido com portabilidade inflável.
    - name: EVA Deck de Espuma
      summary: Espuma de célula EVA fechada (acetato de etileno-vinil) usada para almofadas de tração em SUP placas. Oferece amortececimento, aderência e isolamento térmico — e carrega os designs da série Art.
      pros:
        - Excelente aderência antiderrapante, molhada ou seca
        - O amortecimento reduz a fadiga em remos longos
        - Isolamento térmico da superfície fria do deck
        - UV e resistente à água salgada
        - Disponível em peças multicoloridas e desenhos gravados a laser
      cons:
        - Pode ser usado intensamente por 2-3 anos
        - Deve ser devidamente colada para evitar a delaminação
        - Não estrutural — não afeta a rigidez
        - Adiciona um pouco de peso (200-400 g por tábua)
      best_for: SUP tração do deck, designs de decks da série Art e qualquer superfície que precise de estalagem antiderrapante.
  selection:
    title: Guia de Seleção de Material
    subtitle: 'Escolha o material certo com base no seu caso de uso principal:'
    headers:
      - Caso de Uso
      - Material Recomendado
      - Por quê
    rows:
      - - Remo recreativo SUP
        - Drop-stitch PVC
        - Leve, rígido, acessível — equilíbrio ideal para remadores casuais
      - - Remo em família e iniciantes
        - Larga drop-stitch PVC (32"+)
        - Estável e indulgente — confiança para remadores iniciantes
      - - Pesca e remadas com equipamento pesado
        - Larga drop-stitch PVC com convés completo EVA
        - Estabilidade extra para ficar em pé e lançar, alto volume para equipamento de pesca
      - - Pranchas de frota de aluguel SUP
        - Drop-stitch PVC + convés EVA
        - Durável, reparável, bom custo-benefício para uso de alta rotatividade
      - - Passeios e remadas mais longas
        - Drop-stitch PVC (~3,35 m)
        - Melhor rastreamento e eficiência de deslizamento para longas distâncias
      - - Yoga e remadas de fitness
        - Larga drop-stitch PVC com convés completo EVA
        - Plataforma estável e confortável para posturas e exercícios
  deep_dive:
    title: Guias de Mergulho Profundo
    topics:
      - title: Grau Marítimo PVC
        desc: Tecido PVC laminado em múltiplas camadas — resistência UV, testes de abrasão e classificações de denier explicadas.
      - title: Camadas de Laminação PVC
        desc: Como o PVC laminado em múltiplas camadas equilibra força, peso e resistência UV.
      - title: Drop-Stitch Núcleo
        desc: Como milhares de fios internos criam estruturas infláveis rígidas e de alta pressão a 15 PSI.
      - title: Tecnologia de Soldagem RF
        desc: A soldagem de alta frequência cria costuras fortes e consistentes — como funciona e por que é importante.
      - title: PSI & Desempenho
        desc: Por que a pressão do ar é importante para SUPs infláveis — rigidez, capacidade de peso e qualidade de passeio.
      - title: Teste de qualidade
        desc: Testes de pressão, testes de flutuabilidade, envelhecimento UV e testes destrutivos — nosso processo de qualidade.
      - title: Convés de Espuma EVA
        desc: Pads de convés de espuma de célula fechada EVA — tração, conforto e durabilidade para convés SUP.
      - title: Cuidados com o Material
        desc: Limpeza, proteção UV, prevenção de mofo e melhores práticas de armazenamento para produtos infláveis.
