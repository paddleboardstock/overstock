hero:
  tagline: Sudeste Asiático
  title: SUP Placas Atacadistas para<br />Negócios do Sudeste Asiático
  subtitle: Resorts insulares, clubes de praia e lojas de paddle das Filipinas até Bali e Phuket — pranchas novas de 5 unidades, modelos mistos, enviadas da China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Tábuas excedentes para resorts do Sudeste Asiático e lojas de paddle
direct_answer: Paddle Board Overstock fornece placas infláveis novas em folha SUP para empresas em todo o Sudeste Asiático — resorts insulares, casas de praia, operadores de aluguel e pequenos varejistas nas Filipinas, Indonésia, Tailândia, Vietnã, Malásia e além. O atacado começa com 5 placas com modelos mistos em um único pedido, enviando de Weihai, China, por transporte aéreo expresso ou frete marítimo consolidado. Cada placa é 100% testada por pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Modelo misto atacadista com 5 placas — construído para resorts e pequenas lojas, não para cargas de contêineres
  - Rotas curtas de carga da China para portos e aeroportos do Sudeste Asiático
  - UV Tábuas altas e duráveis, adequadas para uso tropical durante todo o ano
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado do Sudeste Asiático SUP
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: a mesa de atividades do resort, o operador do clube de praia e a escola de remo da ilha.
    - O cenário varejista da região é dominado por negócios operados por proprietários que atendem tanto turistas quanto a uma comunidade local de remadores em rápido crescimento. Eles fazem pedidos em pequenas quantidades — de 5 a 20 tábuas — e precisam de tábuas que resistam UV a ciclos tropicais, de água salgada e de aluguel diário, não protótipos de feiras.
  customer_types:
    - title: Resorts de Ilha e Clubes de Praia
      description: Programas de atividades do resort SUP se somam à sua programação, encomendando frotas mistas que atendem estreantes e hóspedes recorrentes.
    - title: Aluguel e Operadores de Turismo
      description: Operadores realizam aluguéis por hora e passeios por manguezais ou lagoas, substituindo placas de frotas gastas sazonalmente.
    - title: Lojas Locais de Remo
      description: Pequenas lojas que atendem a SUP crescente comunidade local da região, desde remadores de fim de semana até SUP aulas de yoga.
shipping_section:
  title: Navio para o Sudeste Asiático
  paragraphs:
    - O Sudeste Asiático é uma das regiões de carga mais próximas de Weihai, China — rotas marítimas curtas e rotas aéreas expressas diretas mantêm tanto o tempo de trânsito quanto o custo de frete amigáveis. O transporte aéreo expresso oferece amostras e 1 a 3 pedidos urgentes no embarque; o frete marítimo consolidado é a escolha econômica para 5 a 20 pedidos de atacado para os principais portos regionais.
    - Fornecemos a fatura comercial e a lista de embalagem que seu corretor precisa, com códigos HS corretos e valores declarados. Direitos e impostos de importação seguem as regras do seu país e são pagos pelo importador.
  customs_note: Os procedimentos alfandegários variam entre os membros da AS EAN. Verifique as regras de importação do seu país para equipamentos esportivos infláveis e pergunte na sua consulta se você precisa de documentação específica — nós a preparamos.
faq_section:
  title: Perguntas Frequentes sobre o Sudeste Asiático
  items:
    - q: Para quais países do Sudeste Asiático você envia envios?
      a: Filipinas, Indonésia, Tailândia, Vietnã, Malásia e além — além de guias dedicados para países das Filipinas, Indonésia e Tailândia. Confirme seu destino exato no pedido de orçamento.
    - q: As pranchas são adequadas para uso tropical durante o ano todo?
      a: Sim. As tábuas são construídas drop-stitch PVC com construção qualificada para uso diário em condições quentes UV e altas — as mesmas tábuas que fornecemos para frotas de aluguel em 50+ países. O cuidado padrão (enxágue após água salgada, armazenamento na sombra) as mantém em serviço por anos.
    - q: Como é um pedido de resort pequeno?
      a: 'Normalmente 5–15 pranchas: uma base de modelos versáteis e amigáveis para iniciantes para hóspedes, além de algumas edições de arte premium para exibição, fotos e venda no varejo. Modelos mistos em um único envio, com preço baseado na quantidade total.'
    - q: Quão rápido as pranchas podem chegar à região?
      a: O Sudeste Asiático é uma das rotas de frete mais curtas a partir de nossa base em Weihai. O transporte aéreo expresso é a opção mais rápida para amostras e pedidos pequenos; o frete marítimo é cotado por destino para quantidades no atacado. Ambos estão detalhados em seu orçamento.
