content_challenge:
  tagline: O desafio
  title: Demandas de pesquisa marinha<br />Plataformas estáveis e prontas para instrumentos
  subtitle: Os barcos de trabalho científico devem fornecer uma plataforma estável para instrumentação sensível, operação silenciosa para evitar perturbar a vida selvagem e layouts flexíveis para diversos equipamentos de pesquisa.
  paragraphs:
    - A pesquisa marinha e o monitoramento ambiental exigem embarcações de trabalho que funcionem como laboratórios móveis. Diferentemente das embarcações comerciais ou recreativas, os RIBs de pesquisa devem acomodar instrumentação eletrônica sensível, equipamentos de amostragem de água e sedimentos e, às vezes, o transporte de espécimes vivos — tudo isso mantendo uma plataforma estável para a coleta precisa de dados.
    - '**A estabilidade da plataforma é crítica** — Sonares, ecobatímetros e perfiladores CTD (condutividade, temperatura, profundidade) exigem um casco estável em repouso e em baixa velocidade. Esteira excessiva ou movimentos do casco introduzem ruído nos dados científicos. Um casco em V profundo com boas características de estabilidade é essencial.'
    - '**Integração de instrumentos** — Navios de pesquisa precisam de pontos de montagem para antenas de GPS, transdutores de sonar, braços de amostragem e equipamentos de registro de dados. O espaço do console deve acomodar múltiplos displays, a distribuição de energia dos instrumentos e armazenamento seguro para eletrônica sensível.'
    - '**Operação silenciosa** — Para levantamentos de biologia marinha e monitoramento ambiental, o ruído do motor e a vibração do casco podem assustar a vida marinha e comprometer observações comportamentais. Configurações silenciosas de motor de popa e projetos de casco com vibração reduzida são importantes para aplicações de pesquisa.'
    - Os RIBs de pesquisa Paddle Board Overstock são projetados com plataformas de casco estáveis, sistemas integrados de montagem de equipamentos e configurações silenciosas de motor de popa para aplicações científicas e de monitoramento ambiental.
content_solution:
  tagline: Nossa solução
  title: RIBs de pesquisa específicos para trabalhos científicos e ambientais
  subtitle: Cada RIB de pesquisa Paddle Board Overstock é configurado como uma plataforma estável e personalizável para instrumentação científica e equipamentos de amostragem de campo.
  list:
    - Casco de fibra de vidro em V profundo com excelente estabilidade em repouso e em velocidades baixas de levantamento
    - Deck plano com placas de montagem de equipamentos para sonar, GPS e material de amostragem
    - Console configurado para múltiplos displays — plotter cartográfico, ecobatímetro, registrador de dados
    - Distribuição de energia de acessórios de 12 V e 24 V para instrumentos científicos
    - Motor de popa de 4 tempos silencioso — vibração e ruído mínimos para levantamentos de fauna
    - Projeto opcional de casco de baixa esteira para perturbação mínima durante a coleta de dados
    - Cores de tubos personalizadas para a identidade visual de instituições de pesquisa e a identificação de frotas
content_segments:
  tagline: Perfis de pesquisa
  title: Soluções para ciências marinhas<br />Por tipo de aplicação
  subtitle: Diferentes aplicações de pesquisa têm requisitos de embarcação exclusivos – desde plataformas de ensino universitário até embarcações de pesquisa ambiental e RIBs de monitoramento da qualidade da água.
  items:
    - title: Programas Universitários de Ciências Marinhas
      subtitle: Plataformas de ensino, viagens de campo de estudantes, pesquisa costeira
      description: As universidades de ciências marinhas e os departamentos de oceanografia precisam de barcos de trabalho confiáveis e versáteis para ministrar cursos de campo, projetos de pesquisa de estudantes e pesquisas costeiras lideradas por professores. O barco deve ser fácil de operar para estudantes sob supervisão, estável o suficiente para a implantação prática de instrumentos e durável o suficiente para uso frequente por vários usuários durante períodos acadêmicos. As restrições orçamentárias em ambientes acadêmicos tornam a relação custo-benefício e a baixa manutenção considerações importantes.
      features:
        - Plataforma estável para a prática dos alunos de implantação e recuperação de instrumentos
        - Operação fácil — configuração com manche ou console único para uso estudantil supervisionado
        - Tubos de Hypalon resistentes para desembarques frequentes na praia e manuseio pelos alunos
        - Montagem de equipamentos para sonar de ensino, disco de Secchi e material de amostragem
        - Opção de PVC econômica para programas acadêmicos com orçamento limitado
    - title: Institutos de Pesquisa Marinha
      subtitle: RIBs de pesquisa com integração de instrumentos, GPS, equipamento de amostragem
      description: Organizações dedicadas de pesquisa marinha que conduzem pesquisas costeiras e offshore precisam de RIBs de pesquisa configurados profissionalmente com instrumentação integrada. Essas embarcações carregam sistemas de sonar para mapeamento batimétrico, perfiladores CTD para análise de coluna d'água, amostradores de sedimentos e equipamentos de coleta biológica. O barco deve fornecer uma plataforma estável em velocidades de pesquisa lentas, ter amplo espaço no convés para implantação de equipamentos e oferecer energia limpa de 12V/24V para componentes eletrônicos.
      features:
        - Montagem integrada de transdutor de sonar — configuração passa-casco ou no espelho de popa
        - Montagem de antena de GPS e integração ao console para navegação apta a levantamentos
        - Área de implantação de CTD e amostrador de água com pontos de amarração seguros
        - Distribuição de energia auxiliar de 12 V/24 V para instrumentos e registradores de dados
        - Estável em baixa velocidade (3-6 nós) para a precisão das linhas de levantamento
        - Pórtico em A ou davit opcional para implantar equipamentos de amostragem mais pesados
    - title: Monitoramento e Conservação Ambiental
      subtitle: Levantamentos ecológicos, observação da vida selvagem, avaliação de habitat
      description: ONG ambientais, agências governamentais e organizações de conservação realizam pesquisas ecológicas marinhas, monitorização da população de vida selvagem e avaliações de habitats. Estas operações requerem embarcações silenciosas e de baixo impacto que possam aproximar-se de habitats sensíveis sem perturbar a vida selvagem. Os barcos precisam de transportar equipamento fotográfico, GPS para mapeamento de transectos e equipamento de amostragem para recolha de água e sedimentos. A baixa esteira e o mínimo ruído do motor são essenciais para estudos de observação comportamental.
      features:
        - Motor de popa de 4 tempos silencioso — perturbação mínima à vida marinha
        - Plataforma de observação estável para documentação fotográfica e em vídeo
        - Montagem de equipamentos para rigs de câmera, rastreadores GPS e computadores de campo
        - Calado raso para acessar zonas úmidas costeiras, manguezais e estuários
        - Superfícies de deck e tubos de fácil limpeza para descontaminação entre locais
    - title: Monitoramento e testes de qualidade da água
      subtitle: Execuções regulares de amostragem, rastreamento de poluentes, monitoramento de conformidade
      description: As organizações de monitoramento da qualidade da água realizam amostragens regulares em zonas costeiras, portos e vias navegáveis interiores para rastrear os níveis de poluição, a proliferação de algas e a conformidade com as regulamentações ambientais. Estas operações necessitam de barcos eficientes e fiáveis para visitas repetidas a estações fixas de amostragem. A embarcação deve transportar equipamento de amostragem, refrigeradores para preservação de amostras e equipamento de teste de campo – com fácil lavagem do convés entre os locais de amostragem para evitar contaminação cruzada.
      features:
        - Área dedicada de estação de amostragem com caixa térmica e armazenamento de equipamentos
        - Deck e superfícies de tubos de fácil limpeza para descontaminação entre locais
        - Integração de GPS para o retorno preciso a coordenadas fixas de amostragem
        - Tamanho compacto para acesso a vias navegáveis restritas e canais estreitos
        - Motor de popa econômico para campanhas regulares de amostragem com boa relação custo-benefício
