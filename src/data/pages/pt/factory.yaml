workshops_section:
  tagline: Oficinas
  title: Oficinas de Manufatura
  workshops:
    - title: PVC Corte e Preparação de Materiais
      description: CNC Máquinas automáticas de corte PVC drop-stitch processam e fabricam tecidos com precisão submilimétrica. O nesting otimizado por computador minimiza o desperdício de materiais e garante que cada painel atenda à sua especificação dimensional antes da soldagem.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Soldagem e Vedação Térmica
      description: Oficina de soldagem dedicada com máquinas de selagem térmica e prensas dielétricas de RF. Soldadores de ar quente unem e fundem laminados de núcleo drop-stitch e bandas de trilho, enquanto soldagens RF produzem juntas herméticas de alta resistência.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Arte do Baralho & EVA Acabamento
      description: 'Os decks da série artística ganham forma aqui: painéis de espuma EVA cortados com precisão são dispostos em padrões de deck completo, colados e aparados à mão para um acabamento aderente, confortável e durável — o visual característico de cada prancha da série artística.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Impressão e Decoração
      description: As pranchas SUP são decoradas usando impressão digital para gráficos em cores completas e serigrafia para logotipos e padrões repetidos. Impressoras digitais produzem designs de deck com qualidade fotográfica, enquanto a serigrafia oferece marcas de marca duráveis e vívidas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montagem Final e Acabamento
      description: Linha de montagem onde as pranchas recebem suas válvulas, argolas em D, alças, quilhas e acessórios para leash. Cada prancha segue uma lista de verificação de montagem de 100 pontos assinada pelo líder da equipe.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Teste e Inspeção de Qualidade
      description: Cada placa concluída passa por testes obrigatórios de retenção de ar, verificação de descolamento das emendas e uma verificação completa dos sistemas antes do envio. Nosso laboratório de qualidade opera de forma independente da produção e reporta diretamente à gestão.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
