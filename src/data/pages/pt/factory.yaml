qc_section:
  tagline: Controle de Qualidade
  title: Processo de Teste e Garantia de Qualidade
  subtitle: Cada placa passa por testes obrigatórios antes do envio. Nosso laboratório de qualidade opera de forma independente da produção e se reporta diretamente à administração.
  steps:
    - step: '1'
      title: Inspeção de Matéria-Prima
      desc: Os tecidos PVC e drop-stitch passam por teste de tração, propagação de rasgo e verificação de resistência UV antes que qualquer lote entre em produção.
    - step: '2'
      title: Teste de Retenção de Ar de 48 Horas
      desc: Cada câmara da prancha é inflada a 125% da pressão nominal e mantida por 48 horas. Queda de pressão superior a 5% aciona a rejeição automática e a reinspeção da costura.
    - step: '3'
      title: Teste de Carga e Equilíbrio
      desc: As pranchas concluídas são carregadas até a capacidade máxima nominal e testadas quanto à estabilidade, borda livre e manuseio. Cada prancha é testada com água antes da inspeção final.
faq_section:
  tagline: Perguntas Frequentes
  title: Perguntas Frequentes
  questions:
    - q: Onde suas pranchas de stand up paddle são fabricadas?
      a: Cada prancha é construída em nossa própria fábrica de 12.000 m² em Weihai, China. Não terceirizamos — o design, materiais, soldagem, montagem e testes acontecem todos sob um mesmo teto, então a qualidade nunca depende de terceiros.
    - q: Como seus preços são tão mais baixos do que o varejo?
      a: Vendemos estoque excedente de fábrica e lotes de liquidação diretamente de nossa própria instalação de produção — sem intermediários, sem acréscimo de varejo. Isso significa pacotes completos SUP com até 60% de desconto em relação aos preços típicos de varejo, com a mesma qualidade testada sob pressão.
    - q: O que está incluído com uma prancha?
      a: 'Cada SUP é enviada como um pacote completo: prancha, mochila de viagem, bomba manual, remo ajustável, quilha removível, leash de espiral e kit de reparo.'
    - q: Quão rápido os pedidos são enviados?
      a: Pedidos em estoque saem da nossa fábrica em Weihai dentro de 2-3 dias úteis com entrega rastreada para 50+ países na UE, América do Norte, Ásia-Pacífico e outros.
production_flow:
  tagline: Fluxo de Produção
  title: Do Material à Prancha Acabada
  subtitle: Cada prancha passa por 6 etapas de produção com pontos de controle de QC em cada passo. Sem atalhos, sem inspeções puladas.
  stages:
    - stage: '01'
      title: Recebimento de materiais e controle de qualidade de entrada
      description: Todos os materiais recebidos são registrados por número de lote em nosso sistema ERP. Rolo de tecidos PVC, núcleos drop-stitch, válvulas, adesivos e ferragens são colocados em quarentena até a aprovação do QC.
      qc_check: Resistência à tração, resistência ao rasgo, medição de espessura, viscosidade do adesivo, inspeção visual de defeitos
      qc_threshold: 100% dos lotes testados. Rejeite se tração < 90% da especificação, rasgo < especificação mínima ou qualquer defeito visual
      responsibility: Equipe de controle de qualidade de entrada (3 inspetores)
    - stage: '02'
      title: Corte CNC e preparação de materiais
      description: O agrupamento otimizado por computador dispõe painéis em estoque PVC para minimizar o desperdício. As máquinas de corte CNC automáticas mantêm uma precisão posicional de 0,1 mm.
      qc_check: Verificação dimensional em arquivos CAD DXF, inspeção de qualidade de borda, verificação de contagem de painéis
      qc_threshold: Cada 20º painel medido. Tolerância ±0,5mm. Rejeitar lote se >2% fora da tolerância
      responsibility: Líder de oficina de corte
    - stage: '03'
      title: Soldagem e Colagem Drop-Stitch
      description: Núcleos Drop-stitch são colados às lâminas externas PVC usando laminação a quente. Câmaras de tubo são soldadas por RF ou soldagem a ar quente. Bordas são coladas por fusão em três camadas.
      qc_check: Teste de descolamento a cada 50 unidades, medição da largura da solda, revisão de registro de temperatura do ar quente, inspeção visual da costura sob luz de fundo
      qc_threshold: Força de descascamento mínimo 8 N/cm. Tolerância de largura de solda ±1 mm. Qualquer canalização visível = rejeição
      responsibility: CQ de soldagem (2 inspetores por turno)
    - stage: '04'
      title: Montagem e Rigging
      description: 'As pranchas passam para a montagem final, onde todos os componentes são instalados: válvulas, D-rings, alças, caixas de quilha e encaixe da bolsa de transporte. Cada unidade segue uma lista de verificação de 100 pontos.'
      qc_check: Aprovação da lista de verificação de 100 pontos por unidade, teste de função da válvula (10 ciclos de abertura/fechamento), verificação de torque de hardware, inspeção visual
      qc_threshold: Política de defeito zero para itens críticos de segurança (válvulas, D-rings, alças). Defeitos cosméticos menores dentro de limites cosméticos rigorosos.
      responsibility: Líder da equipe de montagem + controle de qualidade da linha
    - stage: '05'
      title: Teste de pressão e retenção de qualidade
      description: Cada câmara é inflada a 1,25× pressão nominal (normalmente 20–25 PSI) e mantida por 24–48 horas. Os sensores de pressão registram continuamente. Câmaras que excedam 5% de queda de pressão são rejeitadas e enviadas para reinspeção da junta.
      qc_check: Registro de retenção de pressão de 24 horas, calibração do sensor verificada diariamente, leitura de pressão com compensação de temperatura, novo teste de costura após reparo
      qc_threshold: Queda de pressão máxima de 5% em 24 horas em temperatura estável. Qualquer câmara que exceda isso = 100% de novo teste de todo o lote de produção
      responsibility: Laboratório de qualidade (independente da produção, reporta à gestão)
    - stage: '06'
      title: Inspeção Final e Embalagem
      description: Inspeção visual e funcional final. Defeitos superficiais, consistência de cores, verificação de etiqueta/BIN, integridade da embalagem e integridade dos acessórios. As unidades são embaladas a vácuo, encaixotadas e paletizadas para carregamento de contêineres.
      qc_check: Inspeção visual completa, lista de verificação de acessórios por SKU, teste de queda de embalagem (1 m, amostra aleatória), verificação de leitura de etiqueta/código de barras
      qc_threshold: Tolerância zero para defeitos de segurança. Defeitos cosméticos dentro de limites rigorosos. 100% das unidades inspecionadas visualmente.
      responsibility: Equipe final de controle de qualidade (4 inspetores) + líder da equipe de embalagem
workforce:
  tagline: Nosso povo
  title: Força de trabalho e experiência
  engineers: 25+
  engineers_detail: Engenheiros de pesquisa e desenvolvimento, projeto de moldes, laboratório de materiais e engenharia de produção. Média de 7+ anos na fabricação de infláveis.
  shift_pattern: 2 turnos/dia (07h00–15h30, 15h30–00h00). Turno noturno opcional para pedidos urgentes.
  training: Treinamento mensal de controle de qualidade, exercícios de segurança trimestrais, avaliação anual de habilidades. Os novos contratados completam a indução de 40 horas antes de trabalhar na linha de produção.
  departments:
    - name: P&D e Engenharia
      count: 25+
      role: Design de produto, engenharia de moldes, laboratório de materiais
    - name: Corte e preparação de material
      count: 15
      role: Corte CNC, preparação de painéis, manuseio de materiais
    - name: Soldagem e Laminação
      count: 40
      role: Soldagem por RF, soldagem a ar quente, ligação drop-stitch
    - name: Arte e Acabamento do Deck
      count: '25'
      role: Colocação do deck EVA, acabamento da série artística
    - name: Montagem e Rigging
      count: 35
      role: Montagem final, instalação de hardware, verificação de sistemas
    - name: Controle de Qualidade
      count: 12
      role: CQ de entrada, CQ em processo, inspeção final, testes de laboratório
    - name: Logística e Embalagem
      count: 20
      role: Embalagem, carregamento de contêineres, documentação de exportação
    - name: Gestão e Administração
      count: 15
      role: Vendas, compras, RH, finanças, conformidade
material_traceability:
  tagline: Rastreabilidade
  title: Rastreamento de materiais e controle de lote
  description: Cada lote de matéria-prima recebe um número de lote único em nosso sistema ERP. Desde a chegada, passando pela produção, até o produto acabado, a lista de materiais de cada prancha está vinculada ao lote original do fornecedor. Isso permite rastreabilidade completa a montante para qualquer consulta de qualidade.
  system: ERP personalizado (sistema interno) + etiquetas físicas de lote em cada ordem de serviço
  coverage: 100% dos materiais de produção — PVC, tecido drop-stitch, espuma EVA, adesivos, válvulas, ferragens, embalagens
  records_retained: 10 anos
