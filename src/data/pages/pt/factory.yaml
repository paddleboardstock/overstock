hero:
  tagline: Fábrica
  title: Fábrica e Manufatura
  subtitle: 12.000 m² de manufatura integrada — desde matéria-prima até o painel acabado
intro:
  - Como marca de fábrica do **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock controla todas as etapas da produção — desde a chegada das matérias-primas PVC drop-stitch e matérias-primas até a inspeção final pré-entrega da placa acabada. Nossa unidade de fabricação na Zona de Desenvolvimento Econômico de Weihai abrange 12.000 metros quadrados e abriga oficinas dedicadas para PVC corte, vedação térmica e soldagem, acabamento de arte de deck, montagem final e testes de qualidade.
  - Ao integrar design, engenharia, prototipagem, fabricação e testes sob um mesmo teto, eliminamos as ineficiências da manufatura por contrato e mantemos controle direto sobre a qualidade da construção, seleção de materiais e prazos de entrega. Cada placa que sai da nossa oficina é construída por nossas equipes, em nossos equipamentos, conforme nossos padrões.
