material_traceability:
  tagline: Rastreabilidade
  title: Rastreamento de materiais e controle de lote
  description: Cada lote de matéria-prima recebe um número de lote exclusivo em nosso sistema ERP. Desde a chegada, passando pela produção, até o produto acabado, a lista de materiais de cada barco está vinculada ao lote original do fornecedor. Isso permite rastreabilidade total a montante para qualquer consulta de qualidade ou conformidade.
  system: ERP personalizado (sistema interno) + etiquetas físicas de lote em cada ordem de serviço
  coverage: 100% dos materiais de produção — PVC, Hypalon, tecido com ponto gota, adesivos, válvulas, ferragens, embalagens
  records_retained: 10 anos (de acordo com CE requisito 2013/53/UE)
  suppliers:
    - material: PVC de grau marinho
      source: Fornecedores chineses e coreanos
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Fornecedor japonês
      certified: ISO 9001, REACH
    - material: Tecido drop-stitch
      source: Tecelagem própria + parceiro externo
      certified: CQ interno + fornecedor ISO 9001
    - material: Válvulas & Ferragens
      source: Fornecedores OEM chineses
      certified: ISO 9001, certificados de material por lote
