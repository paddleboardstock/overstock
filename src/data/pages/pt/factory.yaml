workshops_section:
  tagline: Oficinas
  title: Oficinas de Fabricação
  workshops:
    - title: Corte de PVC e Preparação de Material
      description: Máquinas de corte CNC automáticas processam tecidos de PVC, Hypalon e drop-stitch com precisão sub-milimétrica. O aninhamento otimizado por computador minimiza o desperdício de material e garante que cada painel atenda à sua especificação dimensional antes da soldagem.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Soldagem de Tubos e Selagem Térmica
      description: Oficina de soldagem dedicada com máquinas de selagem térmica e prensas dielétricas RF. Seladores térmicos a ar quente unem e fundem câmaras de tubos de PVC, enquanto soldas RF produzem juntas herméticas de alta resistência que excedem os requisitos ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Produção de Casco RIB — Fibra de Vidro
      description: Os cascos dos barcos RIB são produzidos usando moldagem de fibra de vidro por lay-up manual com sistemas de resina poliéster e viniléster. Cada camada é rolada manualmente e ensacada a vácuo para qualidade consistente. A cabine de spray gelcoat fornece um acabamento marítimo de alto brilho e resistente a UV.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: Impressão SUP e Decoração
      description: As pranchas SUP são decoradas usando impressão digital para gráficos coloridos e serigrafia para logotipos e padrões repetitivos. Impressoras digitais produzem designs de deck com qualidade fotográfica, enquanto a serigrafia oferece marcas duráveis e vibrantes.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montagem Final e Rigging
      description: Linha de montagem onde cascos de fibra de vidro e tubos de PVC são unidos, motores são montados, direção e controles são conectados e sistemas elétricos são cabeados. Cada barco segue uma lista de verificação de montagem de 100 pontos aprovada pelo líder da equipe.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Testes de Qualidade e Inspeção
      description: Cada barco concluído passa por teste obrigatório de retenção de ar, verificação de pelagem de juntas e uma verificação completa de sistemas antes do envio. Nosso laboratório de qualidade opera independentemente da produção e reporta diretamente à gerência.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
