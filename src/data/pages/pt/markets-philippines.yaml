hero:
  tagline: Filipinas
  title: SUP Placas Atacadistas para<br />Empresas Filipinas
  subtitle: Resorts insulares, clubes de praia e operadores de remo de El Nido e Siargao até Boracay — tábuas novas de excedente de 5 unidades, modelos mistos, enviadas da China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Tábuas de excedente para resorts das ilhas filipinas e operadores de remo
direct_answer: Paddle Board Overstock fornece tábuas infláveis novas em folha SUP para empresas filipinas — resorts insulares em Palawan e Siargao, beach clubs em Boracay e Cebu, operadores de aluguel e turismo, e pequenos varejistas. Os pedidos no atacado começam com 5 tábuas com modelos mistos em uma única remesta, enviadas de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada prancha é 100% testada sob pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo resorts insulares e clubes de praia por todo o arquipélago filipino
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado das Filipinas SUP
  paragraphs:
    - Com mais de sete mil ilhas, as Filipinas são feitas para remar em pé. As lagoas de El Nido e Coron, a cena relaxada de surfe e ilhas de Siargao, a energia de clube de praia de Boracay e a economia de mergulho e esportes aquáticos de Cebu criam demanda constante — desde turistas remando ao nascer do sol em uma lagoa calcária até moradores locais construindo SUP comunidades de fitness e yoga em Manila e além.
    - The buyers are typically resort and tour operators: resorts em ilhas adicionando uma atividade para hóspedes que não precisa de combustível, motor e nem licença; operadores turísticos que pulam de ilha em ilha ampliando sua oferta; e pequenas lojas que atendem à comunidade nacional de canoagem. Os pedidos são pequenos — de 5 a 20 pranchas — e misturadas entre pranchas estáveis e para quem está na primeira viagem e algumas edições premium para o visual de frente para resort.
  customer_types:
    - title: Resorts Insulares
      description: Resorts de Palawan, Siargao e Boracay adicionando programas para SUP hóspedes com frotas compactas e mistas.
    - title: Operadores de Turismo
      description: Viagens de ilha em ilha e operadores de turismo em lagoas adicionando paradas para remar em seus roteiros.
    - title: Lojas e Escolas Locais
      description: Escolas e lojas da cidade que atendem à crescente comunidade filipina de canoagem e SUP yoga.
shipping_section:
  title: Navio para as Filipinas
  paragraphs:
    - Pedidos enviados de Weihai, China. O frete aéreo expresso transporta amostras e 1 a 3 pedidos de embarque rapidamente para Manila e Cebu; o frete marítimo consolidado atende de 5 a 20 pedidos no atacado por Manila e outros portos filipinos. Estimativas de trânsito para seu destino — Metro Manila ou província — estão incluídas no seu orçamento.
    - Fornecemos as exigências comerciais de faturas e listas de empacotamento, com códigos HS corretos e valores declarados. Taxas e impostos de importação são pagos pelo importador segundo as regras filipinas.
  customs_note: Para destinos provinciais, a entrega final do porto ou aeroporto é cotada como parte do orçamento porta a porta. Confirme o tratamento atual de impostos de importação para equipamentos esportivos com seu corretor; fornecemos documentação completa.
faq_section:
  title: FAQ das Filipinas
  items:
    - q: Quanto tempo leva o envio para as Filipinas?
      a: Depende do método. Frete aéreo expresso para Manila ou Cebu é a opção mais rápida para amostras e 1–3 pedidos de embarque; frete marítimo consolidado atende de 5 a 20 pedidos de embarcado e é cotado com uma janela de trânsito para seu porto. Ambas as estimativas estão detalhadas no seu orçamento antes de você se comprometer.
    - q: Os conselhos podem alcançar ilhas provinciais como Palawan ou Siargao?
      a: Sim — a entrega porta a porta para destinos provinciais é cotada como parte da estimativa de frete, usando logística interna a partir do porto ou aeroporto de chegada. Observe a estimativa e as opções em sua consulta e nós a precificaremos especificamente.
    - q: Como é a frota inicial de um resort?
      a: 'Normalmente 5–10 pranchas: modelos estáveis para todos os usos, para aulas de convidados e remadas livres, além de uma ou duas edições artísticas premium para a orla. Modelos mistos, um único envio, precificados por quantidade total.'
    - q: As pranchas servem para uso em lagoas e planícies de recife?
      a: Sim — condições calmas, rasas e de água morna são exatamente para isso que todas as pranchas infláveis SUP são projetadas, e a quilha flexível e a construção durável drop-stitch lidam bem com recifes e desembarques na praia.
