content_challenge:
  tagline: O desafio
  title: Barcos de Pesca Precisam de<br />Estabilidade, Alcance e Durabilidade
  subtitle: Quer você opere embarcações de pesca comercial, gerencie uma frota cooperativa ou administre fretamentos de pesca – seu barco precisa ter um desempenho confiável todos os dias.
  paragraphs:
    - Barcos de pesca precisam de plataformas estáveis para trabalhar as linhas, manusear a captura e mover-se com segurança pelo convés. Infláveis e RIBs oferecem estabilidade inerente pelo design dos tubos — uma vantagem significativa sobre cascos rígidos de comprimento semelhante.
    - A eficiência de combustível é importante para as operações de pesca onde os custos operacionais têm um impacto direto na rentabilidade. Os RIBs e os barcos insufláveis ​​são mais leves do que os barcos rígidos equivalentes, exigindo menos energia e queimando menos combustível – fundamental para os operadores comerciais que gerem barcos diariamente e para as cooperativas que gerem os orçamentos das frotas.
    - A durabilidade em ambientes marinhos é essencial. Água salgada, exposição aos raios UV e uso constante exigem materiais que possam suportar condições adversas sem degradação. Para os operadores comerciais e cooperativos, a fiabilidade afecta directamente o rendimento – um barco avariado significa dias de pesca perdidos.
    - Aquafarer As configurações de pesca incluem porta-varas, localizadores de cardumes, poços de iscas, poços vivos e soluções de manuseio de carga projetadas para aplicações de pesca sérias em operações comerciais, cooperativas e recreativas.
content_solution:
  tagline: Nossa solução
  title: Configurações Prontas para Pesca
  subtitle: Cada barco de pesca Aquafarer pode ser configurado para sua aplicação específica de pesca.
  list:
    - Suporte de vara de pesca — instalado de fábrica ou pronto para instalação posterior
    - Placa de montagem de fishfinder/GPS na posição do console
    - Opções de tanque de isca ou tanque vivo para operadores de fretamento e comerciais
    - Configurações de caixa térmica/armazenamento para manuseio da captura
    - Casco deep-V para capacidade offshore — estável em repouso, suave em velocidade
    - Opções de tubos PVC ou Hypalon — Hypalon para exposição prolongada aos UV
    - Faixa de motores de popa de 15 HP a 115 HP dependendo do modelo e da aplicação
content_segments:
  tagline: Perfis de pesca
  title: Soluções para barcos de pesca infláveis<br />Por tipo de operador
  subtitle: Da pesca esportiva costeira ao palangre comercial – diferentes operações de pesca exigem diferentes configurações de casco, faixas de potência e configurações no convés. Adaptamos cada barco para combinar com a pesca, as águas e o estilo de trabalho.
  items:
    - title: Empresas de pesca comercial
      subtitle: Barcos de trabalho da frota para operações diárias de pesca, manuseio de redes e transporte de capturas
      description: As empresas de pesca comercial operam barcos de trabalho para colocação e recuperação de redes, manutenção de armadilhas, palangre e transporte de capturas. Esses barcos trabalham todos os dias em ambientes de água salgada e devem suportar cargas pesadas, movimentação constante no convés e longas horas de operação. A eficiência de combustível e a baixa manutenção são fundamentais para a rentabilidade da frota. A embarcação deve fornecer plataformas de trabalho estáveis ​​para a tripulação manusear os equipamentos e as capturas em diversas condições de mar.
      features:
        - Layout de deck plano para manuseio de redes, empilhamento de armadilhas e armazenamento de peixes
        - Motor de popa 40-115 HP com baixo consumo de combustível para baixo custo operacional diário
        - Tubos Hypalon resistentes para resistência à abrasão no uso diário
        - Faixas de fricção reforçadas para contato frequente com docas e embarcações
        - Plataforma com auto-balanço para fácil lavagem após as operações
        - Preços de frota e especificações consistentes para operadores multinavios
    - title: Operadores de pesca charter
      subtitle: Conforto para vários passageiros, manuseio de capturas, certificação de segurança
      description: Operadores que operam fretamentos de pesca de meio dia e de dia inteiro — desde a pesca em recifes costeiros até a pesca de fundo no mar. Seu barco precisa de assentos para passageiros com certificações de segurança, amplo espaço no convés para vários pescadores e poços integrados para manter a isca e o pescado frescos durante toda a viagem. O conforto dos hóspedes afeta diretamente as avaliações de viagens, reservas repetidas e avaliações online.
      features:
        - Direção do console com assentos anatômicos com absorção de choque
        - Suportes de haste instalados de fábrica (4–8 posições)
        - Alcance do motor de popa 60–115 HP para velocidades de cruzeiro offshore
        - CE Certificação Categoria C ou B para operações comerciais de passageiros
        - Bimini ou guarda-sol T-top para conforto dos hóspedes em viagens prolongadas
    - title: Pescadores artesanais e comerciais de pequena escala
      subtitle: Barcos de trabalho confiáveis ​​para o sustento diário
      description: Pescadores independentes que dependem do seu barco como principal fonte de rendimento – lançando redes, cuidando de armadilhas para peixes ou trabalhando perto da costa. Sua prioridade é a economia de combustível, a manutenção simples que você mesmo pode realizar e um barco que suporta cargas moderadas de pesca e equipamentos sem sacrificar a estabilidade.
      features:
        - Motor de popa de 15–40 HP com baixo consumo de combustível para baixo custo operacional
        - Hypalon CSM tubos para maior resistência aos raios UV e à abrasão
        - Layout de deck plano para manuseio de redes e armazenamento de peixes
        - Fácil capacidade de desembarque na praia com proteção de quilha inflável
    - title: Cooperativas de Pesca
      subtitle: Coleta de capturas, transporte de membros, distribuição de suprimentos
      description: As cooperativas de pesca operam frotas comunitárias para recolher as capturas dos pescadores membros, transportar mantimentos para comunidades piscatórias remotas e distribuir a colheita nos mercados. Esses barcos de trabalho precisam de alta capacidade de carga útil, operação diária confiável e fácil manutenção em locais remotos. As cooperativas muitas vezes operam em regiões em desenvolvimento onde a disponibilidade de peças e o acesso a serviços são limitados, tornando essenciais configurações externas simples e construção durável.
      features:
        - Alta capacidade de carga útil para transportar capturas e suprimentos
        - Configuração externa simples para fácil manutenção no local
        - Construção resistente PVC ou Hypalon para flexibilidade orçamentária
        - Plataforma plana com pontos de amarração para fixação de carga
        - Operação com baixo consumo de combustível, minimizando os custos operacionais cooperativos
    - title: Entusiastas de esportes e pesca esportiva
      subtitle: Desempenho e estilo para pescadores sérios
      description: Pescadores experientes que procuram uma plataforma de pesca capaz que proporcione velocidade em terrenos distantes, posições de combate em pé estáveis ​​e ajuste e acabamento premium. O barco deve se sentir em casa, seja navegando três quilômetros da costa até um recife ou explorando remansos estuarinos remotos.
      features:
        - Casco Deep-V RIB para um passeio suave em chop
        - Placa de montagem Fishfinder/GPS pré-cabeada no console
        - Baitwell e refrigerador integrados no módulo do banco traseiro
        - Opções personalizadas de cores do deck EVA combinando com gráficos de barco/tubo
    - title: Guia de pesca e operadores de turismo ecológico
      subtitle: Experiências de pesca guiadas para pescadores visitantes
      description: Guias que levam pequenos grupos de pescadores visitantes a locais de pesca produtivos – muitas vezes combinando a pesca com elementos de ecoturismo, como observação de pássaros ou exploração de manguezais. O barco deve navegar seco e confortável para hóspedes não acostumados com barcos pequenos, com fácil embarque e opções de sombra.
      features:
        - Topo Bimini ou pontos de montagem T-top instalados de fábrica
        - Escada de embarque com entrada suave para fácil embarque
        - Motor de popa silencioso de 4 tempos para minimizar perturbações
        - Compartimentos de armazenamento secos para telefones, carteiras e câmeras de convidados
