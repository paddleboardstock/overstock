features3_lab:
  title: Laboratório interno de testes e qualidade
  subtitle: Cada lote de material e produto acabado passa por nosso laboratório de testes no local antes de ser enviado.
  columns: 3
  isBeforeContent: true
  items:
    - title: Teste de resistência à tração
      description: 'Cada rolo de tecido PVC é testado de acordo com os padrões ASTM D751. Requisito mínimo: urdidura e trama de 350 N/cm. Os lotes rejeitados são devolvidos ao fornecedor – rejeitamos aproximadamente 3% dos materiais recebidos.'
      icon: tabler:scale
    - title: Envelhecimento Acelerado por UV
      description: Amostras de tecido passam por intemperismo acelerado QUV de 1.000 horas (ASTM G154). A retenção da resistência à tração deve exceder 80% após a exposição aos raios UV. Produtos classificados para mais de 3 anos de uso externo.
      icon: tabler:sun
    - title: Resistência ao Descascamento das Costuras
      description: Costuras soldadas por RF testadas com resistência mínima ao descascamento de 5 N/mm (ASTM D751). Costuras Hypalon coladas à mão testadas a 3,5 N/mm. Cada lote de produção possui amostras de costura testadas destrutivamente e arquivadas.
      icon: tabler:stack
    - title: Retenção de pressão de 24 a 48 horas
      description: 'Cada produto inflável é inflado a 1,25x PSI nominal e monitorado por 24 a 48 horas. Queda de pressão máxima permitida: 5%. Os produtos que não passam neste teste são retrabalhados e testados novamente antes do envio.'
      icon: tabler:wind
    - title: Teste de Ciclos de Válvulas
      description: Cada projeto de válvula passa por 10.000 ciclos de abertura e fechamento em nosso laboratório. As válvulas devem manter a vedação hermética a 1,25x a pressão nominal após o ciclo. Todas as válvulas Paddle Board Overstock classificadas para mais de 5 anos de uso regular.
      icon: tabler:rotate
    - title: Resistência a rachaduras a frio
      description: Materiais testados a -30°C por 4 horas conforme ISO 4646. Não são permitidas rachaduras ou fragilização. Produtos classificados para armazenamento no inverno e uso em água fria até -10°C de temperatura ambiente.
      icon: tabler:snowflake

