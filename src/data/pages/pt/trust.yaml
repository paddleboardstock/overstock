features3_certifications:
  title: Qualidade e testes
  subtitle: Cada placa é testada em nosso próprio laboratório antes do envio — números reais, registros reais, sem reivindicações de marketing.
  columns: 3
  isBeforeContent: true
  items:
    - title: Construído em Nossa Própria Fábrica
      description: Possuímos e operamos uma instalação de 12.000 m² em Weihai. Cada lote de produção é rastreável, documentado e inspecionado — sem fabricação misteriosa terceirizada.
      icon: tabler:building-factory
    - title: Laboratório de Testes de Materiais
      description: O laboratório interno de materiais testa resistência à tração, UV resistência, integridade da costura e abrasão para cada lote de tecido antes da produção.
      icon: tabler:microscope
    - title: Materiais de Grau Marítimo
      description: UV- PVC Estabilizados, drop-stitch núcleos e EVA espuma de deck — escolhidos e testados para estações de sol, sal e abuso.
      icon: tabler:flask
    - title: Garantia de 2 anos SUP
      description: Paddle Board Overstock SUP As placas são cobertas por uma garantia de 2 anos contra defeitos de fabricação, incluindo emendas, válvulas e delaminação de materiais. Nós defendemos o que construímos.
      icon: tabler:shield-check
testimonials:
  tagline: Confiança do Cliente
  title: O que nossos clientes dizem
  subtitle: De remadores iniciantes a exploradores experientes — veja por que eles Paddle Board Overstock confiam.
  items:
    - content: Como comprador de primeira viagem, eu estava nervoso em pedir do exterior. A equipe respondeu a todas as perguntas com fotos reais e registros de testes antes mesmo de eu perguntar. O conselho chegou em 6 dias e superou minhas expectativas.
      name: James Thorton
      title: SUP Proprietário do Explorer 11 — Vancouver, Canadá
features3_lab:
  title: Laboratório interno de testes e qualidade
  subtitle: Cada lote de material e produto acabado passa por nosso laboratório de testes no local antes de ser enviado.
  columns: 3
  isBeforeContent: true
  items:
    - title: Teste de resistência à tração
      description: 'Cada PVC rolo de tecido é testado internamente quanto à resistência à tração. Requisito mínimo: 350 N/cm de urdidura e trama. Lotes rejeitados são devolvidos ao fornecedor — rejeitamos aproximadamente 3% dos materiais recebidos.'
      icon: tabler:scale
    - title: Envelhecimento Acelerado por UV
      description: Amostras de tecido passam por um desgaste acelerado de 1.000 horas UV . A resistência à tração deve reter 80%+ após a exposição. Produtos classificados para uso externo de 3+ anos.
      icon: tabler:sun
    - title: Resistência do Descascamento da Costura
      description: As juntas soldadas são testadas até uma resistência mínima de 5 N/mm à descolagem. Cada lote de produção tem amostras de costura testadas e arquivadas de forma destrutiva.
      icon: tabler:stack
    - title: Retenção de pressão de 24 a 48 horas
      description: 'Cada produto inflável é inflado a 1,25x PSI nominal e monitorado por 24 a 48 horas. Queda de pressão máxima permitida: 5%. Os produtos que não passam neste teste são retrabalhados e testados novamente antes do envio.'
      icon: tabler:wind
    - title: Teste do Ciclo de Válvulas
      description: Cada projeto de válvula passa por 10.000 ciclos de abertura e fechamento em nosso laboratório. As válvulas devem manter a vedação hermética a 1,25x a pressão nominal após o ciclo. Todas Paddle Board Overstock as válvulas têm capacidade para+ 5 anos de uso regular.
      icon: tabler:rotate
    - title: Resistência a rachaduras a frio
      description: Os materiais são testados a -30°C por 4 horas. Não são permitidos fissuras ou fragilidade. Produtos classificados para armazenamento no inverno e uso em água fria até -10°C à temperatura ambiente.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Como garantimos a qualidade
  subtitle: Desde a inspeção da matéria-prima até o teste final de pressão — todo produto passa por uma cadeia rigorosa de qualidade.
  items:
    - title: Inspeção de Matéria-Prima
      description: Cada rolo de tecido PVC é testado quanto à espessura, resistência à tração e resistência UV antes de entrar na produção.
      icon: tabler:search
    - title: Controle de Qualidade em Processo
      description: As costuras, instalações de válvulas e uniões da câmara são inspecionadas em cada estação durante a montagem.
      icon: tabler:eye
    - title: Teste de pressão
      description: Todo produto inflável é inflado a 1,25x PSI nominal e mantido por 24–48 horas para verificar a retenção de ar e a integridade das costuras.
      icon: tabler:wind
    - title: Inspeção Final
      description: Cada unidade é inspecionada quanto ao acabamento, ferragens e embalagem antes de ser aprovada para envio. Amostras de lote vão ao nosso laboratório para testes destrutivos.
      icon: tabler:clipboard-check
faqs_sup:
  title: Perguntas Frequentes sobre Pranchas SUP
  subtitle: Perguntas comuns sobre nossas pranchas de stand-up paddle.
  columns: 2
  items:
    - title: Quais tamanhos de prancha SUP estão disponíveis?
      description: Oferecemos pranchas SUP de 9 pés a 12 pés, incluindo designs all-round, touring, yoga e especiais. Nossos modelos mais vendidos incluem o Tropical Breeze (10 pés) e o Ocean Voyager (11 pés).
    - title: O que é a construção drop-stitch?
      description: A construção Drop-stitch utiliza milhares de fios de poliéster conectando as camadas superior e inferior da prancha, permitindo que ela suporte alta pressão de ar (15–20 PSI) e alcance uma plataforma rígida e estável. Este é o padrão da indústria para SUPs infláveis premium.
    - title: Qual é o limite de peso para pranchas SUP?
      description: Nossas pranchas SUP suportam até 150 kg, dependendo do modelo e volume. A prancha Leviathan Wake é nosso modelo de maior capacidade, projetada para pilotos maiores e uso em yoga.
    - title: Vocês oferecem pacotes completos SUP?
      description: Sim. Cada prancha SUP é enviada com um pacote completo incluindo um remo de alumínio em 3 partes, bomba de mão de alta pressão, leash em espiral, mochila de viagem e kit de reparo. Alguns modelos também incluem um conjunto de quilhas removíveis.
    - title: Qual é a garantia das pranchas SUP?
      description: Todas as pranchas Paddle Board Overstock SUP têm garantia de 2 anos contra defeitos de fabricação, incluindo falha nas costuras, defeitos nas válvulas e descolamento de material sob uso normal.
    - title: Quanto tempo leva para inflar uma prancha SUP?
      description: Usando a bomba de mão incluída, uma inflação completa a 15 PSI leva aproximadamente 8–12 minutos. Para inflação mais rápida, recomendamos nossa bomba elétrica Paddle Board Overstock 12V, que infla uma prancha em menos de 4 minutos.
