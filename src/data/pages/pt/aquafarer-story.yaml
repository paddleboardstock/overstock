timeline:
  - year: '2012'
    title: Fundação de fabricação marítima
    body: Aquafarer começou como uma oficina especializada em embarcações infláveis ​​em Qingdao, China, comprometida com o artesanato marítimo e a fabricação de barcos infláveis. O foco inicial era construir produtos infláveis ​​confiáveis ​​através de experiência prática em engenharia e disciplina de fabricação.
  - year: '2015'
    title: Primeira exportação e certificação CE
    body: Os pedidos iniciais de exportação chegaram ao Japão e à Coreia. A certificação CE foi obtida para as principais linhas de produtos, marcando a entrada da Aquafarer nos mercados internacionais. A empresa começou a atender usuários comerciais e recreativos fora da China.
  - year: '2018'
    title: Expansão da Fábrica
    body: Transferido para uma unidade de produção de 12.000 m². Adicionadas linhas de soldagem RF e capacidade de produção de ponto gota, permitindo fabricação em maior escala e sistemas de controle de qualidade aprimorados.
  - year: '2020'
    title: Centro de P&D estabelecido
    body: Abriu um centro de P&D dedicado com laboratório de tecidos PVC, tanque de teste hidrodinâmico e estúdio de simulação CAD/FEA. O desenvolvimento do produto se expandiu para focar na construção leve, maior durabilidade e design centrado no usuário.
  - year: '2022'
    title: Certificação e crescimento global
    body: Obteve a certificação ISO 9001. Expandido para 14 engenheiros de P&D e mais de 200 trabalhadores. Os produtos alcançaram clientes em toda a Europa, Américas e Ásia-Pacífico através de distribuidores e parcerias OEM.
  - year: '2024'
    title: Estúdio de Inovação e Design
    body: Lançou um estúdio completo de design e inovação para projetos ODM personalizados, do conceito à produção. Aplicações marítimas profissionais fortalecidas, incluindo licitações de resgate, comerciais e governamentais.
  - year: '2026'
    title: Construindo o futuro da exploração da água
    body: Hoje, Aquafarer continua a desenvolver barcos infláveis, sistemas SUP e soluções marítimas personalizadas – conectando pessoas e organizações com as águas do mundo. Mais de 50 países atendidos, capacidade anual de 15.000 unidades.
content_founding:
  tagline: O Começo
  title: Nascido à beira-mar
  subtitle: 'Aquafarer começou em uma oficina costeira em Qingdao com um barco e uma visão: construir embarcações infláveis ​​que pudessem lidar com condições marinhas reais.'
  paragraphs:
    - 'Em 2012, nossos fundadores perceberam uma lacuna no mercado: a maioria dos barcos infláveis ​​eram acessíveis, mas não confiáveis, ou de alta qualidade, mas proibitivamente caros. Eles acreditavam que havia espaço para um fabricante que entregasse qualidade e valor.'
    - O primeiro casco foi construído à mão, testado em águas locais e refinado com base no feedback real de pescadores e pequenos operadores comerciais. Esse ciclo de feedback – construir, testar, ouvir, melhorar – permanece hoje no centro da nossa filosofia de engenharia.
    - Em 2015, a notícia se espalhou além de Qingdao. Distribuidores internacionais começaram a solicitar amostras. O que começou como uma oficina local tornou-se um fornecedor global.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Oficina de produção inicial e fabricação da Aquafarer
content_growth:
  tagline: Crescimento e Inovação
  title: Da oficina à instalação de 12.000 m²
  subtitle: O investimento contínuo em pessoas, equipamentos e processos transformou Aquafarer em uma moderna instalação de fabricação marítima.
  paragraphs:
    - À medida que a procura crescia, o mesmo acontecia com as nossas instalações. Expandimos de uma pequena oficina para uma fábrica de 12.000 m² com linhas de produção dedicadas para barcos RIB, barcos infláveis, pranchas SUP e acessórios.
    - Investimos em máquinas de corte CNC, equipamentos de soldagem de alta frequência, linhas de produção drop stitch e equipamentos de testes abrangentes – o que nos permite controlar todos os aspectos da qualidade da produção.
    - Hoje, nossa equipe de 200 a 300 pessoas inclui engenheiros navais, cientistas de materiais, especialistas em controle de qualidade e artesãos qualificados – muitos dos quais estão na Aquafarer desde os primeiros dias.
founder:
  tagline: Conheça o fundador
  title: Construído por um Waterman
  subtitle: O fundador David Chen reúne experiência em fabricação e uma paixão de longa data por esportes aquáticos – uma combinação que define como Aquafarer aborda o desenvolvimento de produtos.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — fundador da Aquafarer
  story:
    - David Chen cresceu na costa de Qingdao, onde o mar não era um destino de férias mas sim um modo de vida. Ele passou sua juventude andando de caiaque, navegando e pescando no Mar Amarelo – experiências que lhe deram uma compreensão intuitiva do que as embarcações precisam suportar.
    - Antes de fundar a Aquafarer, David passou uma década na fabricação naval, trabalhando em produção, qualidade e comércio internacional. Ele gerenciou programas OEM para marcas europeias e norte-americanas, aprendendo em primeira mão os padrões e expectativas dos mercados globais.
    - 'Em 2012, ele fundou a Aquafarer com uma missão simples: construir embarcações infláveis ​​nas quais ele confiaria para sua própria família na água. Esse padrão pessoal – eu usaria isso? — continua sendo o teste final para cada produto que sai da fábrica.'
    - Hoje, David lidera a estratégia de produtos e supervisiona a equipe de P&D, revisando pessoalmente novos designs e testando protótipos nas águas de Qingdao. Ele acredita que grandes produtos vêm da compreensão da engenharia e da experiência.
philosophy:
  tagline: Filosofia da Marca
  title: Liberdade de engenharia na água
  body: A liberdade na água não se trata apenas de movimento. Representa descobrir novos lugares, criar experiências ao ar livre, conectar as pessoas com a natureza e possibilitar missões profissionais. A engenharia torna essa liberdade possível.
  pillars:
    - title: Confiabilidade em primeiro lugar
      body: Os ambientes aquáticos exigem confiança. Aquafarer os produtos são projetados tendo em vista estabilidade, durabilidade, segurança e desempenho consistente.
    - title: Design Centrado no Ser Humano
      body: Os produtos devem servir às pessoas e não à tecnologia. Cada decisão de projeto começa com a compreensão de como as pessoas usam as embarcações, onde exploram e quais desafios enfrentam.
    - title: Exploração Acessível
      body: A água não deve pertencer apenas aos especialistas. Aquafarer cria equipamentos que permitem que mais pessoas experimentem com segurança rios, lagos, oceanos e ambientes costeiros.
    - title: Inovação Contínua
      body: Inovação não é apenas criar novos produtos. Está melhorando cada detalhe – materiais, estruturas, fabricação e experiência do usuário.
engineeringDna:
  tagline: ADN de engenharia
  title: Como Aquafarer cria produtos
  areas:
    - title: Ciência dos Materiais
      body: Aquafarer concentra-se na seleção de materiais apropriados para diferentes ambientes marinhos. As principais considerações incluem resistência à abrasão, resistência aos raios UV, estabilidade à pressão e durabilidade a longo prazo.
      items:
        - Resistência à Abrasão
        - Resistência UV
        - Estabilidade de Pressão
        - Durabilidade a longo prazo
    - title: Engenharia Estrutural
      body: As embarcações infláveis ​​exigem um equilíbrio preciso entre rigidez, peso, portabilidade e estabilidade. A engenharia Aquafarer concentra-se na otimização desses fatores por meio da tecnologia central de ponto gota e construção avançada de costura.
      items:
        - Rigidez
        - Otimização de Peso
        - Portabilidade
        - Estabilidade
    - title: Precisão de Fabricação
      body: 'Cada produto passa por processos controlados: preparação de material, corte de precisão, soldagem e colagem, montagem, inspeção de qualidade e verificação de desempenho.'
      items:
        - Preparação de materiais
        - Corte de precisão
        - Soldagem e colagem
        - Montagem e controle de qualidade
    - title: Engenharia de cenário de usuário
      body: Os produtos são desenvolvidos em torno de aplicações reais – recreação, aventura e uso profissional – garantindo que cada projeto atenda às demandas específicas do ambiente pretendido.
      items:
        - Recreação
        - Aventura
        - Profissional
        - Comercial
