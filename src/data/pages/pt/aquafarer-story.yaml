hero:
  tagline: Nossa história
  title: Aquafarer — Liberdade de engenharia na água
  subtitle: 'De uma oficina costeira a um fabricante marítimo global — nossa jornada é construída sobre uma crença teimosa: as embarcações devem ser projetadas como são importantes, porque são.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
