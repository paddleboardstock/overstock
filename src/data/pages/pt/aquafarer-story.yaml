  quality:
    title: Compromisso de Qualidade
    body: Desde a inspeção de materiais até os testes finais, Aquafarer mantém processos sistemáticos de qualidade para fornecer produtos marinhos confiáveis. Cada unidade passa por testes de pressão, inspeção de costura e verificação de desempenho antes do envio.
    items:
      - CE Certificado — 64 modelos atendem aos padrões de segurança europeus
      - ISO 9001:2015 — Sistema de gestão da qualidade certificado
      - UKCA Marcado — conformidade com o mercado do Reino Unido
  global:
    title: Presença Global
    body: Aquafarer atende clientes em vários mercados globais, apoiando distribuidores, marcas de atividades ao ar livre e usuários marítimos profissionais em mais de 50 países na Europa, Ásia-Pacífico, Américas, Oriente Médio e África.
