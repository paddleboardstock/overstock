content_system:
  tagline: Visão Geral do Sistema de QC
  title: Qualidade Integrada<br />Estrutura de Controle
  subtitle: Nosso sistema de CQ opera de forma independente da produção e reporta-se diretamente à administração. Nenhum lote é enviado sem a liberação de qualidade assinada pelo laboratório de qualidade.
  items:
    - title: Laboratório de Qualidade Independente
      description: Nosso laboratório de qualidade opera como uma função separada da produção. Os inspetores de CQ reportam-se ao Gerente de Qualidade, e não ao Diretor de Produção. Essa independência organizacional garante que as decisões de qualidade sejam tomadas de forma objetiva — os prazos de produção nunca se sobrepõem aos requisitos de qualidade.
      features:
        - Reporta-se diretamente à administração, independente da produção
        - Autorizado a interromper a produção por problemas de qualidade
        - 12 inspetores de QC dedicados em todas as etapas
        - Todo equipamento de teste calibrado anualmente
    - title: Rastreabilidade de Lote
      description: Cada lote de matéria-prima recebe um número de lote único em nosso sistema ERP. Desde a chegada do material até a produção e o produto acabado, a lista de materiais de cada placa se conecta aos lotes originais do fornecedor. Isso permite rastreabilidade completa a montante para qualquer consulta de qualidade ou conformidade.
      features:
        - Rastreamento de lote baseado em ERP desde o material até o produto acabado
        - Etiquetas de lote físico em cada ordem de serviço
        - Cobertura total de materiais — PVC, espuma drop-stitch, EVA, ferragens, adesivos
        - Registros mantidos por 10 anos
    - title: Gestão da Qualidade
      description: Nossos procedimentos de CQ seguem protocolos internos documentados. Os resultados dos testes são registrados, rastreáveis e revisados pelo nosso laboratório de qualidade independente. Taxa de 99,3% de produtos sem defeitos nas remessas dos últimos 12 meses.
      features:
        - Protocolos internos de CQ documentados, revisados anualmente
        - Taxa de 99,3% livre de defeitos em remessas dos últimos 12 meses
        - Tolerância zero com defeitos críticos de segurança
        - Registros mantidos por 10 anos
content_inspection:
  tagline: Estágios de Inspeção
  title: Seis estágios<br />Processo de Inspeção
  subtitle: Cada produto passa por 6 etapas de inspeção com pontos de verificação de controle de qualidade documentados. Defeitos são identificados cedo, ações corretivas são imediatas e cada lote é totalmente rastreável.
  stages:
    - stage: '1'
      title: Inspeção de Material de Entrada
      description: Todos os materiais recebidos são registrados pelo número de lote/lote e colocados em quarentena até a aprovação do Controle de Qualidade. PVC rolos de tecido são testados quanto à resistência à tração, resistência ao rasgo e espessura. Drop-stitch núcleos, válvulas, adesivos e ferragens são inspecionados visualmente e medidos de acordo com as especificações.
      checks: Resistência à tração, resistência ao rasgo, medição de espessura, viscosidade do adesivo, inspeção visual de defeitos
      threshold: 100% dos lotes testados. Rejeite se tração < 90% da especificação, rasgo < especificação mínima ou qualquer defeito visual
    - stage: '2'
      title: Controle de Qualidade em Processo — Corte e Preparação
      description: Os painéis cortados CNC são verificados dimensionalmente em relação aos arquivos CAD a cada vigésimo painel. A qualidade das bordas é inspecionada quanto a desfiamento, cortes irregulares ou desvio dimensional. A contagem de painéis é verificada em relação à BOM para cada lote de produção antes que os materiais sejam levados para a soldagem.
      checks: Verificação dimensional em arquivos CAD DXF, inspeção de qualidade de borda, verificação de contagem de painéis
      threshold: Tolerância ±0,5 mm. Rejeitar lote se >2% fora da tolerância
    - stage: '3'
      title: Controle de Qualidade em Processo — Soldagem e Colagem
      description: Durante a produção, a qualidade da solda é continuamente monitorada. Testes de descascamento são realizados em amostras a cada 50 unidades. A largura da solda é medida de acordo com a especificação. Registros de temperatura do ar quente são revisados para garantir consistência. Cada costura é inspecionada visualmente sob luz traseira em busca de canais ou vazios.
      checks: Teste de descascamento a cada 50 unidades, medição da largura de solda, revisão do registro da temperatura do ar quente, inspeção da costura do backlight
      threshold: Resistência à descamação mínima 8 N/cm. Tolerância da largura da solda ±1 mm. Qualquer canal visível = rejeitar
    - stage: '4'
      title: Controle de Qualidade de Montagem
      description: Cada unidade segue uma lista de verificação de montagem de 100 pontos assinada pelo líder da equipe. A função da válvula é testada através de 10 ciclos de abertura/fechamento. O torque do hardware é verificado. A inspeção visual cobre acabamento da superfície, consistência de cor, posicionamento de etiquetas e completude dos acessórios.
      checks: Lista de verificação de 100 pontos por unidade, teste de funcionamento da válvula, verificação de torque do hardware, inspeção visual
      threshold: 'Política de zero defeitos em itens críticos para segurança (válvulas, anéis em D, alças). Cosmético menor: meta de 99,3% sem defeitos'
    - stage: '5'
      title: Teste de pressão
      description: Cada câmara é inflada para 1,25× a pressão nominal e mantida por 24-48 horas. Sensores de pressão registram continuamente durante todo o período de manutenção. Leituras compensadas pela temperatura garantem a precisão. Qualquer câmara que exceda uma queda de pressão de 5% é rejeitada e enviada para reinspeção das costuras, com 100% de reteste de todo o lote de produção.
      checks: Registro de pressão mantida por 24-48h, calibração do sensor verificada diariamente, leitura compensada por temperatura, reteste da costura após reparo
      threshold: Queda máxima de pressão de 5% em 24h a temperatura estável. Excedendo = 100% re-teste de todo o lote
    - stage: '6'
      title: Inspeção Final e Liberação para Envio
      description: Inspeção visual e funcional final antes da embalagem. Defeitos na superfície, consistência de cor, verificação de etiquetas/BIN, integridade da embalagem e completude de acessórios são verificados em relação ao pedido do cliente. As unidades são embaladas a vácuo, colocadas em caixas e paletizadas. A assinatura final do Controle de Qualidade é necessária antes que qualquer produto saia da fábrica.
      checks: Inspeção visual completa, lista de verificação de acessórios por SKU, teste de queda de embalagem (amostra aleatória de 1m), verificação de leitura de etiqueta/código de barras
      threshold: Defeitos de segurança com tolerância zero. Meta de 99,3% sem defeitos. 100% das unidades inspecionadas visualmente
content_equipment:
  tagline: Equipamento de Teste
  title: Laboratório de QC<br />Equipamento
  subtitle: Nosso laboratório de qualidade é equipado com equipamentos de teste especializados para verificação de materiais, integridade de solda e validação do desempenho do produto.
  columns: 3
  items:
    - title: Máquina de Ensaio de Tração
      description: Mede a resistência à tração e alongamento do tecido conforme protocolo interno de teste. Usado para QC de entrada de todos os lotes de tecido PVC e drop-stitch.
      icon: tabler:scale
    - title: Câmara de Temperatura
      description: Câmara ambiental para teste de resistência UV e teste de flexibilidade em baixa temperatura. Simula condições extremas de operação.
      icon: tabler:temperature
    - title: Sensores e Registradores de Pressão
      description: Sensores de pressão digitais com registro contínuo de dados para testes de retenção de ar de 24-48 horas. Compensados por temperatura para precisão.
      icon: tabler:wind
    - title: Bancada de Teste de Descasque
      description: Equipamento de teste de descascamento calibrado para verificação da resistência da junta de solda. Amostras aleatórias de cada lote de produção.
      icon: tabler:files
    - title: Tanque de Detecção de Vazamento
      description: Tanque de água para teste de vazamento submerso de câmaras infladas. Detecção visual de bolhas para verificação da integridade da costura e da válvula.
      icon: tabler:ripple
    - title: Ferramentas de Inspeção
      description: Ferramentas de medição calibradas — medidores de espessura, chaves de torque, paquímetros dimensionais, testadores de dureza para estações de Controle de Qualidade de produção.
      icon: tabler:tools
content_metrics:
  tagline: Desempenho de QC
  title: Controle de Qualidade<br />Métricas
  subtitle: Dados reais de aprovação/reprovação da nossa linha de produção. Essas métricas são monitoradas diariamente e revisadas mensalmente pela gestão.
  columns: 3
  items:
    - title: 100% das Unidades Testadas
      description: Cada câmara de cada placa é testada quanto à pressão antes do envio. Sem amostragem — inspeção 100% da integridade da pressão.
      icon: tabler:check
    - title: <5% Queda de Pressão
      description: Perda máxima de pressão permitida em 24-48 horas a 1,25× a pressão nominal. Qualquer câmara que exceda esse limite aciona re-teste do lote.
      icon: tabler:gauge
    - title: 99,3% Livre de Defeitos
      description: Taxa de peças sem defeitos nos envios dos últimos 12 meses. Tolerância zero para defeitos críticos de segurança.
      icon: tabler:clipboard-check
    - title: Retenção de 24-48 horas
      description: As placas são mantidas por 24-48 horas dependendo do modelo e do lote. Sensores de pressão registram continuamente durante todo o período de retenção.
      icon: tabler:clock
    - title: 1,25× Pressão de Teste
      description: Margem de segurança em cada câmara — testada a 25% acima da pressão nominal para garantir margem acima das condições máximas de operação.
      icon: tabler:arrow-up
    - title: 0% Defeitos de Segurança
      description: Política de tolerância zero para defeitos críticos de segurança — válvulas, anéis em D, costuras e câmaras de flutuação. Qualquer defeito = re-inspeção de 100%.
      icon: tabler:shield
