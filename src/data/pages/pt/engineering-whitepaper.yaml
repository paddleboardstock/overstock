section_faq:
  title: Perguntas frequentes técnicas
  questions:
    - q: Como o ponto gota se compara à construção tradicional de casca dura?
      a: Os núcleos modernos de ponto gota a 20 PSI alcançam 85–90% da rigidez de revestimentos rígidos comparáveis de espuma EPS/fibra de vidro, ao mesmo tempo em que são totalmente desinfláveis para transporte. A compensação é um peso ligeiramente maior e menor rigidez final – mas para a maioria das aplicações recreativas e comerciais, a diferença é insignificante.
    - q: Qual densidade de fio é considerada qualidade premium?
      a: Os tecidos de ponto gota premium usam 2 fios por polegada quadrada (aproximadamente 3.100 fios por m²) tecidos com fio de poliéster 1.680 DTEX. Os tecidos básicos usam 1 fio por polegada quadrada com 1.100 fios DTEX.
    - q: O Hypalon pode ser soldado como o PVC?
      a: Não. Hypalon/CSM não pode ser soldado por RF. Deve ser montado com cimento de contato aplicado manualmente, o que torna a produção mais trabalhosa e as costuras dependentes da habilidade do operador. O PVC pode ser soldado por RF ou por ar quente para qualidade de costura consistente e automatizada.
    - q: Qual é a pressão máxima segura para barcos infláveis?
      a: Os tubos infláveis padrão para barcos operam a 8–12 PSI. Pisos com ponto de queda operam a 12–20 PSI. Núcleos de ponto de queda de alta pressão (SUPs) podem operar a 20–25 PSI. Cada produto inclui válvulas de alívio de pressão calibradas para evitar inflação excessiva.
    - q: Quanto tempo leva para fabricar um barco inflável personalizado?
      a: A produção OEM padrão leva de 30 a 45 dias a partir da confirmação do pedido até FOB Qingdao. O desenvolvimento de moldes personalizados adiciona 15 a 20 dias para produção e testes de protótipos.
