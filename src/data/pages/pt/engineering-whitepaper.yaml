hero:
  tagline: Artigo técnico de engenharia
  title: Tecnologia Drop-Stitch e Ciência dos Materiais:<br />A engenharia por trás das modernas embarcações infláveis
  subtitle: Uma referência técnica confiável que cobre a construção do núcleo com ponto de gota, comparação de material PVC vs Hypalon, testes de rigidez de vasos de alta pressão e padrões de fabricação de embarcações.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Laboratório de P&D Aquafarer – testes e engenharia de materiais
direct_answer: A tecnologia drop-stitch usa milhares de fios internos de poliéster conectando as camadas de tecido superior e inferior de um núcleo inflável. Quando inflados a 15–20 PSI, esses fios atuam como membros de tensão, evitando abaulamentos e criando uma estrutura rígida comparável à construção de casca dura. Combinado com revestimentos avançados de tecido de PVC ou Hypalon e soldagem RF, isso permite embarcações infláveis portáteis e de alto desempenho, adequadas para uso profissional, comercial e recreativo.
section_drop_stitch:
  title: Engenharia Estrutural Drop-Stitch
  subtitle: Como milhares de fios transformam tecido flexível em estrutura rígida
  content: |-
    O ponto gota (também conhecido como "tecido ponto gota" ou "núcleo ponto gota") representa um avanço na engenharia de estruturas infláveis. O princípio é aparentemente simples: milhares de fios de poliéster individuais são tecidos simultaneamente em duas camadas separadas de tecido base, conectando os painéis superior e inferior em um ângulo de 90 graus.

    Quando a câmara selada é pressurizada, a pressão interna do ar exerce força igualmente em todas as direções – tentando separar os painéis superior e inferior em uma forma cilíndrica. Os milhares de fios de ponto solto resistem a essa separação, transferindo a carga em tensão ao longo do eixo do fio. O resultado é um painel plano e rígido que pode suportar 15–20 PSI de pressão interna.

    A 20 PSI, um painel de ponto de queda de 1 m² experimenta aproximadamente 14.000 kg de força interna total – mas a matriz da linha o mantém perfeitamente plano. Isto proporciona às estruturas de ponto gota uma relação resistência/peso que rivaliza com os materiais rígidos tradicionais.
section_materials:
  title: PVC vs Hypalon – Comparação de materiais técnicos
  subtitle: Dados objetivos para seleção informada de materiais na fabricação de embarcações infláveis
  table:
    columns:
      - header: Propriedade
      - header: PVC (cloreto de polivinila)
      - header: Hipalon (CSM)
    rows:
      - property: Resistência UV
        pvc: Bom (com estabilizadores UV)
        hypalon: Excelente (inerente)
      - property: Resistência à Abrasão
        pvc: Bom
        hypalon: Muito bom
      - property: Resistência à tracção
        pvc: 3.000–5.000 N/5cm
        hypalon: 2.500–4.000 N/5cm
      - property: Peso por m²
        pvc: 850–1.200g
        hypalon: 1.100–1.500g
      - property: Frio Flexível
        pvc: -30ºC
        hypalon: -20ºC
      - property: Método de adesão
        pvc: Soldagem RF / Soldagem por ar quente
        hypalon: Colagem manual (cimento de contato)
      - property: Reparabilidade
        pvc: Fácil (solda por calor ou adesivo)
        hypalon: Requer adesivo CSM
      - property: Custo de materiais
        pvc: US$ 8–15/m²
        hypalon: US$ 20–40/m²
      - property: Vida útil (sol tropical)
        pvc: 5–8 anos
        hypalon: 10–15 anos
      - property: Gama de cores
        pvc: Amplo (espectro de cores completo)
        hypalon: Limitado (cores básicas)
      - property: Resistência Química
        pvc: Bom (graus resistentes a combustível/óleo)
        hypalon: Excelente (ampla gama química)
section_testing:
  title: Testes e protocolos de segurança
  subtitle: Estrutura de garantia de qualidade da Aquafarer para cada lote de produção
  protocols:
    - title: Teste de retenção de pressão nominal 1,25x
      description: Cada vaso montado é inflado a 1,25x sua pressão nominal de operação e mantido por 24 a 48 horas. Qualquer queda de pressão superior a 2% provoca rejeição e retrabalho.
      standard: ISO 6185
    - title: Teste de resistência ao descascamento da costura
      description: Amostras de solda e costura de cola de cada lote de produção são testadas quanto à resistência ao descascamento usando equipamento de tensão calibrado. Requer resistência mínima de descascamento de 4 kN/m.
      standard: ISO 2411
    - title: Teste de tração de tecido
      description: Os rolos de tecido recebidos passam por testes de resistência à tração e alongamento nas direções da urdidura e da trama. Limite de rejeição inferior a 3.000 N/5cm para PVC.
      standard: ISO 1421
    - title: Intemperismo Acelerado por UV
      description: Amostras de materiais são submetidas a mais de 1.000 horas de exposição UV acelerada em câmaras de teste QUV. Perda máxima de resistência à tração de 15% permitida.
      standard: ASTM G154
    - title: Integridade de válvulas e conexões
      description: Cada conjunto de válvula é testado quanto à integridade da vedação a uma pressão nominal de 1,25x. As válvulas de retorno são testadas quanto ao desempenho de vedação unidirecional.
      standard: ISO 12402
