hero_text:
  tagline: Contato
  title: ENTRE EM CONTATO
contact_form:
  id: form
  title: Envie-nos uma mensagem
  subtitle: Para perguntas sobre pedidos, orientação de tamanho ou suporte de produto, envie-nos uma mensagem. Respondemos dentro de um dia útil.
  email_to: info@paddleboardoverstock.com
  submit_button: Enviar Consulta → Obter um Orçamento
  success_message: Obrigado! Sua mensagem chegou à nossa caixa de entrada. Respondemos dentro de um dia útil.
  error_message: Algo deu errado ao enviar sua mensagem. Por favor, tente novamente ou envie um e-mail diretamente.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: por favor, resolva o seguinte'
  fields:
    - name: Nome
      label: Nome
      row: 1
    - name: Sobrenome
      label: Sobrenome
      row: 1
    - name: nome da empresa
      label: nome da empresa
      row: 2
    - name: address
      label: Endereço
      row: 3
    - name: zip
      label: CEP / Código Postal
      row: 4
    - name: country
      label: País
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: Volume do pedido
      label: Volume estimado do pedido
      row: 6
      type: select
      options:
        - value: ''
          label: Quantas pranchas você está comprando?...
        - value: one
          label: Apenas uma prancha
        - value: 2-4
          label: 2–4 pranchas
        - value: 5-plus
          label: 5+ pranchas (família, clube ou aluguel)
    - name: customization
      label: Com o que podemos ajudar?
      row: 7
      type: select
      options:
        - value: ''
          label: Selecione um tópico...
        - value: none
          label: Pergunta geral sobre o produto
        - value: sizing
          label: Ajuda para escolher a prancha certa
        - value: order
          label: Pedido, pagamento ou envio
        - value: warranty
          label: Suporte de garantia ou reparo
    - name: interesse do produto
      label: Categorias de Produtos de Interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Selecione a categoria de produto...
        - value: all
          label: Todos os produtos / Catálogo completo
        - value: sup
          label: SUP Pranchas / Stand up paddle (SUP)
        - value: packages
          label: Pacotes completos SUP
        - value: accessory
          label: Acessórios (bomba, remos, bolsas)
    - name: subject
      label: Assunto
      row: 9
    - name: message
      label: Mensagem
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Outras formas de nos contatar
  columns: 3
  items:
    - title: Ajuda com pedidos
      description: Perguntas sobre produtos, orientação de tamanho e suporte de pedidos.
      icon: tabler:shopping-bag
    - title: Suporte técnico
      description: Garantia, reparos, peças de reposição e dúvidas sobre o funcionamento.
      icon: tabler:tool
    - title: Imprensa & parcerias
      description: Kits de mídia, patrocínio e colaboração na indústria.
      icon: tabler:news
    - title: Telefone
      description: +1 279 732 3333 (Sede EUA) · +86 13305324192 (fábrica)
      icon: tabler:headset
    - title: E-mail
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Sede Global & Faturamento
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Nossa Localização
  subtitle: Visite nossa unidade de fabricação em Weihai
  address: Weihai, Shandong, China
  zoom: 15
