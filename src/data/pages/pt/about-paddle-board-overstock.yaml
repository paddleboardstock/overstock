  title: As Pessoas por Trás das Pranchas
  description: Nossa base em Weihai abriga um time de pesquisa e desenvolvimento de 14+ profissionais, envolvendo materiais, design estrutural e processos de produção. Ao redor deles opera a equipe mais ampla que gerencia controle de qualidade, estoque, logística e o suporte que você acessa quando nos contata — as mesmas pessoas, quer você compre uma prancha ou vinte.
