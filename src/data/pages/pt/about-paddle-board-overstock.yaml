hero:
  tagline: Sobre
  title: Sobre Paddle Board Overstock
  subtitle: Desde 2012, temos colocado pranchas infláveis novas SUP nas mãos de remadores e pequenos varejistas em 50+ países — estoque excedente, preços justos e uma garantia que realmente honramos.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Tábuas infláveis novas em folha SUP
direct_answer: Paddle Board Overstock é uma marca de equipamentos para esportes aquáticos fundada em 2012 e sediada em Weihai, China. Vendemos pranchas infláveis novas SUP a partir de estoque excedente — uma mistura de produção excedente da nossa própria base de fabricação e estoque cuidadosamente selecionado de fábricas parceiras — diretamente para remadores de extremidade e pequenos varejistas em 50+ países. Cada prancha é 100% testada por pressão, garantida por 2 anos SUP e enviada por transporte expresso ou marítimo.
tldr_points:
  - Fundada em 2012, sediada em Weihai, China — um dos SUP principais polos manufatureiros do mundo
  - 'Modelo com estoque: placas novas em folha abaixo do preço de varejo, sem intermediários'
  - 'O estoque é de fonte mista: produção excedente da nossa base mais estoque de fábricas parceiras selecionadas'
  - 50+ países atendidos, taxa de aprovação na inspeção final de 99,3%, garantia de 2 anos SUP
story_section:
  tagline: Nossa história
  title: Por que vendemos excedentes de estoque
  paragraphs:
    - Paddle Board Overstock iniciada em 2012 em Weihai, China — uma cidade costeira na província de Shandong que se tornou um dos SUP mais importantes polos mundiais de fabricação de infláveis. A partir dessa base, passamos mais de uma década fabricando pranchas infláveis e enviando-as para todo o mundo.
    - Along the way we noticed something that shapes everything we do today: Toda temporada de produção deixa para trás tábuas novas e perfeitamente boas — tiradas excedentes, pedidos cancelados, colorações da temporada passada. Enquanto isso, varejistas independentes ao redor do mundo foram impedidos de usar o atacado porque fornecedores tradicionais exigiam pedidos do tamanho de recipientes.
    - Essa lacuna é o nosso negócio. Ao vender estoque excedente — produção excedente da nossa própria base em Weihai, além de estoque cuidadosamente selecionado de fábricas parceiras — podemos oferecer pranchas novas a preços bem abaixo do varejo típico, em quantidades que servem para um único remador ou um pedido de loja de cinco tábuas. Nada é de segunda mão, nada é de segunda; é simplesmente estoque que merece um cliente, e não um armazém.
model_section:
  tagline: Nosso Modelo de Negócios
  title: Como Funciona o Modelo de Excesso de Estoque
  items:
    - title: Novo em folha, nunca usado
      description: Cada tábua que vendemos é nova e não usada. Estoque excessivo significa estoque excedente e estoque extra — não devoluções, nem recondicionados, nem segundos.
    - title: Inventário de Fonte Mista
      description: Nosso estoque combina produção excedente da nossa própria base de fabricação em Weihai com estoque selecionado de fábricas parceiras que mantemos no mesmo padrão de qualidade. As fontes são mistas; os padrões não.
    - title: Preços abaixo do varejo
      description: Estoque excedente custa menos para nós adquirir, então custa menos para você comprar. Sem preço inflacionado, sem descontos falsos — apenas preços honestos em estoque real.
    - title: Atacado Amigável para Pequenas Empresas
      description: O atacado começa com 5 tábuas, não com cargas em contêineres. Pequenos varejistas podem misturar qualquer modelo em estoque em um único pedido e escolher transporte expresso ou marítimo.
    - title: Envio Direto para Você
      description: Os pedidos são enviados diretamente da nossa base logística em Weihai até sua porta em 50+ países — expresso para amostras e pequenos pedidos, frete marítimo consolidado para atacado.
quality_section:
  tagline: Qualidade e Garantia
  title: A Qualidade por Trás de Cada Prancha
  subtitle: Precificação acima do estoque nunca significa padrões relaxados. Cada placa — seja qual for sua origem — passa pelo mesmo processo antes de ser enviada.
  items:
    - title: 100% testado em pressão
      description: Cada prancha é inflada e testada quanto à pressão a 15 PSI antes do envio. Nenhuma prancha é enviada sem teste, independentemente de onde veio seu estoque.
    - title: Testadas contra Sobrecarga a 1,25x
      description: As pranchas de nossas linhas de produção são testadas em amostras além da pressão nominal — mantidas em 1,25x a pressão de trabalho por 24–48 horas para verificar costuras, válvulas e construção drop-stitch.
    - title: Taxa de Aprovação na Inspeção Final de 99,3%
      description: Nosso processo de inspeção final aprova 99,3% das pranchas como sem defeitos — e a pequena fração que falha nunca entra em nosso estoque excedente.
    - title: Garantia de 2 anos SUP
      description: Cada prancha SUP possui Garantia de 2 Anos SUP cobrindo defeitos de fabricação. A mesma garantia se aplica a todos os clientes em todos os nossos 50+ mercados.
