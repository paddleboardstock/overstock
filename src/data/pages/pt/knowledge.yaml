hero:
  tagline: Gráfico de conhecimento
  title: Conhecimento sobre Exploração da Água
  subtitle: |
    Uma base de conhecimento estruturada sobre tecnologia de SUP inflável,<br />
    segurança na água, engenharia de prancha e planejamento de aventura.
  taglineSection: Explore. Aprenda. Vá com confiança.
clusters:
  tagline: Clusters de Conhecimento
  title: Explore por tópico
  subtitle: Análises profundas sobre a tecnologia, segurança e habilidades por trás de cada produto Paddle Board Overstock.
  items:
    - title: SUP Conhecimento
      description: Desde a escolha de sua primeira prancha até técnicas avançadas de passeios — tudo sobre stand-up paddle.
      icon: tabler:lifebuoy
      topics:
        - Como escolher seu primeiro SUP inflável
        - Melhor tamanho SUP para iniciantes
        - Quão difícil é praticar stand up paddle?
        - Comparação entre prancha inflável e prancha rígida
        - lista de verificação de segurança
    - title: Tecnologia de Placa
      description: Mergulhos técnicos profundos em núcleos drop-stitch, laminados PVC, trilhos e válvulas — como SUPs infláveis são projetados.
      icon: tabler:anchor
      topics:
        - Como os SUPs infláveis são feitos
        - PVC camadas de laminado explicadas
        - Construção de trilho e costura
        - mergulho profundo na tecnologia
        - Arte do deck explicada
    - title: Conhecimento de Segurança
      description: Conhecimento essencial de segurança para todo remador — desde a seleção de PFD até a leitura do clima e técnicas de auto-resgate.
      icon: tabler:shield
      topics:
        - lista de verificação de segurança
        - Você precisa de um colete salva-vidas?
        - Guia de segurança para remar no oceano
        - Segurança em rios e correntezas para remadores
        - Consciência sobre condições meteorológicas e da água
    - title: Tecnologia
      description: A engenharia por trás dos produtos Paddle Board Overstock — materiais, métodos de construção e testes de qualidade.
      icon: tabler:microscope
      topics:
        - Tecnologia PVC de nível marítimo
        - Drop-stitch núcleo explicado
        - Por que PSI é importante para SUPs infláveis
        - Soldagem por RF vs colagem adesiva
        - Testes de qualidade em cada prancha
    - title: Conhecimento para Clubes e Aluguel
      description: Guias práticos para gerenciar um programa SUP — desde operações de aluguel até frotas de resorts e clubes.
      icon: tabler:briefcase
      topics:
        - Como iniciar um negócio de aluguel SUP
        - Construindo um centro resort de esportes aquáticos
        - Dimensionamento da frota de paddle board para clubes
        - Inflável vs rígido SUP para uso comercial
        - Melhores pranchas SUP para frotas de aluguel
        - Estratégias de receita de esportes aquáticos em resorts
        - Guia de manutenção de equipamentos comerciais
