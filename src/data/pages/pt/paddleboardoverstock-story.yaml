timeline:
  - year: '2012'
    title: Fundação de fabricação marítima
    body: Paddle Board Overstock começou como uma oficina especializada de paddle board inflável em Weihai, China, dedicada ao artesanato marítimo e à fabricação de pranchas. O foco inicial foi construir produtos infláveis confiáveis por meio de experiência prática em engenharia e disciplina de fabricação.
  - year: '2015'
    title: Primeiras Exportações
    body: Os pedidos iniciais de exportação chegaram ao Japão e à Coreia, marcando Paddle Board Overstock a entrada de A empresa nos mercados internacionais. A empresa começou a atender remadores e entusiastas de esportes aquáticos além da China.
  - year: '2018'
    title: Expansão da Fábrica
    body: Realocados para uma unidade de produção de 12.000 m². Adicionaram linhas de soldagem RF e drop-stitch capacidade de produção, permitindo fabricação em maior escala e aprimoramento dos sistemas de controle de qualidade.
  - year: '2020'
    title: Centro de P&D estabelecido
    body: Abriu um centro de P&D dedicado com laboratório de tecidos PVC, tanque de teste hidrodinâmico e estúdio de simulação CAD/FEA. O desenvolvimento do produto se expandiu para focar na construção leve, maior durabilidade e design centrado no usuário.
  - year: '2022'
    title: Crescimento Global
    body: Expandido para 14 engenheiros de P&D e 200+ trabalhadores. As pranchas chegaram a remadores por toda a Europa, Américas e Ásia-Pacífico, enviando para 50+ países.
  - year: '2024'
    title: Estúdio de Inovação e Design
    body: Lançou um estúdio completo de design e inovação para novas séries de pranchas, do conceito à produção. Expandimos nossos decks e plataformas de turnê de séries artísticas exclusivas.
  - year: '2026'
    title: Construindo o futuro da exploração da água
    body: Hoje, Paddle Board Overstock continua desenvolvendo SUP tábuas infláveis, equipamentos de remo e soluções marinhas personalizadas — conectando pessoas e organizações às águas do mundo. 50+ países atendidos, com capacidade anual de 15.000 unidades.
content_founding:
  tagline: O Começo
  title: Nascido à beira-mar
  subtitle: 'Paddle Board Overstock começou em uma oficina costeira em Weihai com uma prancha e uma visão: construir pranchas infláveis que pudessem lidar com condições reais do mar.'
  paragraphs:
    - Em 2012, nossos fundadores perceberam uma lacuna no mercado — a maioria das pranchas infláveis era ou acessível, mas pouco confiável, ou de alta qualidade, mas proibitivamente cara. Eles acreditavam que havia espaço para um fabricante que entregasse qualidade e valor.
    - O primeiro casco foi construído à mão, testado em águas locais e refinado com base no feedback real de pescadores e pequenos operadores comerciais. Esse ciclo de feedback – construir, testar, ouvir, melhorar – permanece hoje no centro da nossa filosofia de engenharia.
    - Em 2015, a notícia já havia se espalhado além de Weihai. Remadores e lojas de esportes aquáticos por toda a Ásia começaram a solicitar pranchas. O que começou como uma oficina local estava se tornando uma marca global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Oficina e fabricação de produção inicial
content_growth:
  tagline: Crescimento e Inovação
  title: Da oficina à instalação de 12.000 m²
  subtitle: O investimento contínuo em pessoas, equipamentos e processos se transformou Paddle Board Overstock em uma moderna instalação de manufatura marítima.
  paragraphs:
    - À medida que a demanda crescia, nossa instalação também crescia. Expandimos de uma pequena oficina para uma fábrica de 12.000 m² com linhas de produção dedicadas para SUP placas, acessórios e equipamentos de segurança.
    - Investimos em máquinas de corte CNC, equipamentos de soldagem de alta frequência, linhas de produção drop stitch e equipamentos de testes abrangentes – o que nos permite controlar todos os aspectos da qualidade da produção.
    - Hoje, nossa equipe de 200 a 300 pessoas inclui engenheiros marítimos, cientistas de materiais, especialistas em controle de qualidade e artesãos qualificados — muitos dos quais estão na Paddle Board Overstock equipe desde os primeiros dias.
founder:
  tagline: Conheça o fundador
  title: Construído por um Waterman
  subtitle: O fundador David Chen une expertise em manufatura e uma paixão de longa data por esportes aquáticos — uma combinação que define como Paddle Board Overstock aborda o desenvolvimento de produtos.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fundador de Paddle Board Overstock
  story:
    - David Chen cresceu na costa de Weihai, onde o mar não era um destino de férias, mas um modo de vida. Ele passou a juventude remando, velejando e pescando no Mar Amarelo — experiências que lhe deram uma compreensão intuitiva do que as pranchas de remo precisam suportar.
    - Antes de fundar Paddle Board Overstock, David passou uma década na manufatura marítima, atuando em produção, qualidade e comércio internacional. Liderou programas de produção e qualidade para os mercados europeu e norte-americano, aprendendo de perto as expectativas dos remadores globais.
    - 'Em 2012, ele Paddle Board Overstock fundou com uma missão simples: construir pranchas infláveis que confiasse com sua própria família na água. Esse padrão pessoal — eu usaria isso? — continua sendo o teste final para todo produto que sai da fábrica.'
    - Hoje, David lidera a estratégia de produto e supervisiona a equipe de P&D, revisando pessoalmente novos projetos e testando protótipos nas águas de Weihai. Ele acredita que ótimos produtos vêm do entendimento tanto da engenharia quanto da experiência.
philosophy:
  tagline: Filosofia da Marca
  title: Liberdade de engenharia na água
  body: A liberdade na água não se trata apenas de movimento. Representa descobrir novos lugares, criar experiências ao ar livre, conectar as pessoas com a natureza e possibilitar missões profissionais. A engenharia torna essa liberdade possível.
  pillars:
    - title: Confiabilidade em primeiro lugar
      body: Ambientes aquáticos exigem confiança.Paddle Board Overstock Os produtos são projetados em torno da estabilidade, durabilidade, segurança e desempenho consistente.
    - title: Design Centrado no Ser Humano
      body: Produtos devem servir às pessoas, não à tecnologia. Cada decisão de design começa com entender como as pessoas usam seus quadros, onde exploram e quais desafios enfrentam.
    - title: Exploração Acessível
      body: A água não deve pertencer apenas a especialistas.Paddle Board Overstock Cria equipamentos que permitem que mais pessoas experimentem com segurança rios, lagos, oceanos e ambientes costeiros.
    - title: Inovação Contínua
      body: Inovação não é apenas criar novos produtos. Está melhorando cada detalhe – materiais, estruturas, fabricação e experiência do usuário.
engineeringDna:
  tagline: ADN de engenharia
  title: Como Paddle Board Overstock Cria Produtos
  areas:
    - title: Ciência dos Materiais
      body: Paddle Board Overstock foca na seleção de materiais apropriados para diferentes ambientes marinhos. As considerações principais incluem resistência à abrasão, resistência a UV, estabilidade à pressão e durabilidade a longo prazo.
      items:
        - Resistência à Abrasão
        - Resistência UV
        - Estabilidade de Pressão
        - Durabilidade a longo prazo
    - title: Engenharia Estrutural
      body: As pranchas de stand up paddle infláveis exigem um equilíbrio preciso entre rigidez, peso, portabilidade e estabilidade. A engenharia Paddle Board Overstock concentra-se em otimizar esses fatores por meio da tecnologia central drop-stitch e da construção avançada de costuras.
      items:
        - Rigidez
        - Otimização de Peso
        - Portabilidade
        - Estabilidade
    - title: Precisão de Fabricação
      body: 'Cada produto passa por processos controlados: preparação de material, corte de precisão, soldagem e colagem, montagem, inspeção de qualidade e verificação de desempenho.'
      items:
        - Preparação de materiais
        - Corte de precisão
        - Soldagem e colagem
        - Montagem e controle de qualidade
    - title: Engenharia de cenário de usuário
      body: Os produtos são desenvolvidos com base em aplicações reais de remo — recreação, aventura, família e turismo — garantindo que cada design atenda às demandas específicas do ambiente para o qual se destina.
      items:
        - Recreação
        - Aventura
        - Família
        - Turismo
