hero:
  tagline: Brasil
  title: SUP Placas Atacadistas para<br />Varejistas brasileiros
  subtitle: Para lojas e operadores do Rio e Florianópolis até a costa nordeste — paddle boards novinhos em excesso de 5 unidades, modelos mistos, enviados da China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Tábuas de excedente para varejistas de praia brasileiros e escolas de remo
direct_answer: Paddle Board Overstock fornece pranchas infláveis novas em folha SUP para empresas brasileiras — escolas e lojas de remo no Rio de Janeiro, Florianópolis e na costa nordeste, operadores de aluguel e vendedores online. Os pedidos no atacado começam com 5 pranchas com modelos mistos em uma única remessa, enviadas de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada placa é 100% testada por pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo à cultura costeira brasileira do Rio ao Nordeste
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado Brasileiro SUP
  paragraphs:
    - O Brasil é um dos mercados de stand up paddle mais naturais do mundo. A cultura de praia é cultura nacional — desde a cena de Stand Up Paddle nas lagoas do Rio e a mistura de surfe e águas calmas de Florianópolis até as águas quentes e calmas do Nordeste em Ceará, Pernambuco e Bahia. Escolas de remo, aluguel de lagoas e comunidades de surfe e a favor do vento SUP são todas atraídas por uma enorme população apaixonada por esportes.
    - Os compradores brasileiros são tipicamente negócios operados por proprietários — barracas de aluguel à beira da lagoa, escolas de praia, lojas de SUP surfe adicionando filas e vendedores domésticos de comércio eletrônico em crescimento. Eles fazem pedidos em pequenas quantidades (5 a 20 tábuas) e se preocupam com durabilidade para uso diário e competitividade de preços em um mercado com custos significativos de importação.
  customer_types:
    - title: Escolas Lagoon & Beach
      description: Escolas e operadores de aluguel nas lagoas do Rio e nas praias de águas calmas do Nordeste oferecem aulas e aluguel por hora.
    - title: Lojas de Surf
      description: Lojas de surfe estabelecidas adicionam águas calmas e passeios SUP para a comunidade local de canoagem.
    - title: Vendedores Online
      description: Vendedores domésticos de comércio eletrônico importando SUP estoques para atender ao enorme mercado interno do Brasil.
shipping_section:
  title: Navio para o Brasil
  paragraphs:
    - Pedidos enviados de Weihai, China. O transporte aéreo expresso transporta amostras e 1 a 3 pedidos de embarque para os principais aeroportos do Brasil; o frete marítimo consolidado atende de 5 a 20 pedidos no atacado por portos como Santos e outros portões costeiros. Estimativas de trânsito para seu destino estão incluídas no seu orçamento.
    - Fornecemos a fatura comercial e a lista de embalagem necessárias para a despaça, com códigos HS corretos e valores declarados. Taxas e impostos de importação são pagos pelo importador segundo as regras brasileiras.
  customs_note: Os impostos de importação do Brasil sobre artigos esportivos são significativos e variam conforme a classificação do produto. Confirme a taxa atual, o IVA e quaisquer cobranças estaduais com seu despachante antes de fazer o pedido — fornecemos documentação completa, mas não agrupamos impostos de importação nas cotações de frete.
faq_section:
  title: FAQ sobre o Brasil
  items:
    - q: Orçamentos e suporte podem ser tratados em português?
      a: Sim — trabalhamos com compradores de língua portuguesa. Pergunte em seu pedido e nós cuidaremos do seu orçamento e pedido em português.
    - q: Os impostos de importação do Brasil estão incluídos nos seus preços?
      a: Não. Taxas de importação, IVA e impostos estaduais são responsabilidade do importador segundo as regras brasileiras. Nós estimamos preços e frete de forma clara e separada, e fornecemos a documentação que seu despachante precisa.
    - q: Como é uma primeira encomenda para uma escola de praia brasileira?
      a: 'Normalmente 5–15 pranchas: modelos duráveis para aulas e aluguel por hora, além de algumas edições premium para exibição no varejo. Modelos mistos em um único envio, com preço baseado na quantidade total.'
    - q: Vocês enviam por frete marítimo para o Brasil?
      a: Sim — frete marítimo consolidado atende portos brasileiros para pedidos de atacado de 5–20 pranchas, com cotação por destino. Frete aéreo expresso está disponível para amostras e pedidos pequenos urgentes.
