testimonial:
  content: Começámos com o Club Starter Package para a nossa escola de surf em Portugal. 20 pranchas, remos, coletes – tudo chegou em 3 semanas. Após duas temporadas, atualizamos para o Pacote Pro. A marca personalizada com nosso logotipo foi uma virada de jogo para nossa imagem profissional.
  name: Ricardo Santos
  title: Proprietário, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Perfis de clube
  title: Soluções para Clubes de Esportes Aquáticos<br />Por Tipo de Clube
  subtitle: De clubes de paddle universitários a clubes náuticos privados exclusivos – cada tipo de clube tem necessidades de equipamento, padrões de uso e estruturas orçamentárias exclusivas. Adaptamos cada pacote para combinar com o modelo do clube.
  items:
    - title: Clubes de paddle universitários e universitários
      subtitle: Frotas estudantis de alto uso
      description: Clubes de remo administrados por estudantes ou apoiados por instituições, operando programas SUP para departamentos de recreação universitária. O equipamento é utilizado com alta frequência e alta rotatividade, por múltiplos níveis de habilidade a cada semestre. Durabilidade e fácil manutenção são críticas, além de preços acessíveis para organizações estudantis.
      features:
        - Construção PVC extra-durável, indicada para ciclos de uso estudantil
        - Gamas de pranchas codificadas por cores de acordo com o nível de habilidade para fácil gerenciamento da frota
        - Kit de reparo + com suporte em vídeo disponível para cada pedido
        - Preços com desconto para organizações estudantis e condições de pagamento baseadas em semestres
    - title: Remo comunitário e clubes sociais
      subtitle: Clubes recreativos voltados para associados
      description: Clubes comunitários oferecendo experiências de SUP e remadas sociais para os membros. O equipamento precisa equilibrar desempenho e conforto para uma ampla faixa etária, com branding que fortaleça a identidade do clube e o orgulho dos membros. A eficiência no armazenamento é fundamental para clubes que operam com acesso limitado à água.
      features:
        - 'Frota mista: SUPs para uso geral e turismo'
        - 'Branding completo do clube: cores personalizadas, impressão de logotipo, coletes salva-vidas com branding'
        - Soluções de armazenamento compactas para equipamentos infláveis
        - 'Kit inicial para crescimento de membros: cartões de indicação, fotografia com marca'
    - title: Escolas de Surf & Acadêmias de SUP
      subtitle: Desempenho e treinamento costeiro
      description: Escolas focadas em surf ensinando habilidades de SUP em ondas. O equipamento deve performar em condições de surf — manobrável, responsivo e durável o suficiente para lidar com quedas repetidas, abrasão da areia e exposição à água salgada sem degradação rápida.
      features:
        - Formas mais curtas e mais largas de SUP otimizadas para manobrabilidade em surf
        - Construção reforçada de bordas para resistência a impactos nas ondas
        - 'Equipamento de segurança específico para surf: leash enrolado, opções de quilha macia'
        - Programa de substituição de frota com descontos sazonais
    - title: Iate Clubes Corporativos e Privados
      subtitle: Experiências de membros premium
      description: Clubes privados exclusivos que oferecem esportes aquáticos como uma comodidade premium para os associados. Os padrões dos equipamentos são elevados – a estética, o alinhamento da marca e a apresentação preparada para os hóspedes são tão importantes quanto o desempenho. As expectativas de serviço incluem entrega de luvas brancas, soluções de armazenamento personalizadas e suporte em nível de concierge.
      features:
        - Pranchas premium com acabamento em EVA imitando madeira e detalhes metálicos
        - Correspondência de cores personalizada de acordo com as diretrizes de marca do clube
        - 'Entrega concierge: pré-infladas, organizadas e etiquetadas para cada temporada'
        - Gerenciamento de conta dedicado com SLA de resposta prioritária
