testimonial:
  content: Começámos com o Club Starter Package para a nossa escola de surf em Portugal. 20 pranchas, remos, coletes – tudo chegou em 3 semanas. Após duas temporadas, atualizamos para o Pacote Pro. A marca personalizada com nosso logotipo foi uma virada de jogo para nossa imagem profissional.
  name: Ricardo Santos
  title: Proprietário, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Perfis de clube
  title: Soluções para clubes de esportes aquáticos<br />Por tipo de clube
  subtitle: De clubes de paddle universitários a clubes náuticos privados exclusivos – cada tipo de clube tem necessidades de equipamento, padrões de uso e estruturas orçamentárias exclusivas. Adaptamos cada pacote para combinar com o modelo do clube.
  items:
    - title: Clubes de paddle universitários e universitários
      subtitle: Frotas estudantis de alto uso
      description: Clubes de paddle administrados por estudantes ou apoiados por instituições que operam programas de SUP e caiaque para departamentos de recreação universitária. Os equipamentos enfrentam uso de alta frequência e alta rotatividade em vários níveis de habilidade a cada semestre. A durabilidade e a facilidade de reparo são essenciais, juntamente com preços acessíveis para organizações estudantis.
      features:
        - 'Construção em PVC extra resistente avaliada para ciclos de uso estudantil'
        - 'Gamas de pranchas codificadas por cor conforme o nível para gestão fácil da frota'
        - 'Kit de reparação + suporte em vídeo a pedido incluído em cada encomenda'
        - 'Preços com desconto para organizações estudantis e pagamento por semestre'
    - title: Remo comunitário e clubes sociais
      subtitle: Clubes recreativos voltados para associados
      description: Clubes comunitários que oferecem experiências sociais de SUP, caiaque e remo aos membros. Os equipamentos precisam equilibrar desempenho e conforto para uma ampla faixa etária, com marcas que promovam a identidade do clube e o orgulho dos associados. A eficiência do armazenamento é fundamental para os clubes que operam com acesso limitado à zona portuária.
      features:
        - 'Frota mista: SUPs polivalentes, pranchas de passeio e caiaques de lazer'
        - 'Imagem de marca completa do clube: cores personalizadas, impressão do logótipo, coletes salva-vidas personalizados'
        - 'Soluções de armazenamento compacto para equipamento inflável'
        - 'Kit inicial para crescimento de membros: cartões de referência, fotografia de marca'
    - title: Escolas de Surf e Academias de Surf Kayak
      subtitle: Desempenho e treinamento costeiro
      description: Escolas focadas no surf que ensinam habilidades de surf SUP, surf caiaque e surfe nas ondas. O equipamento deve funcionar em condições de surf – manobrável, responsivo e durável o suficiente para lidar com quedas repetidas, abrasão pela areia e exposição à água salgada sem degradação rápida.
      features:
        - 'Formas de SUP mais curtas e largas otimizadas para manobrar no surf'
        - 'Construção reforçada dos bordos para resistência ao impacto nas ondas'
        - 'Equipamento de segurança específico para surf: leashs em espiral, opções de barbatanas flexíveis'
        - 'Programa de substituição de frota com descontos sazonais na troca'
    - title: Iate Clubes Corporativos e Privados
      subtitle: Experiências de membros premium
      description: Clubes privados exclusivos que oferecem esportes aquáticos como uma comodidade premium para os associados. Os padrões dos equipamentos são elevados – a estética, o alinhamento da marca e a apresentação preparada para os hóspedes são tão importantes quanto o desempenho. As expectativas de serviço incluem entrega de luvas brancas, soluções de armazenamento personalizadas e suporte em nível de concierge.
      features:
        - 'Pranchas com acabamento premium em EVA efeito madeira e detalhes metálicos'
        - 'Correspondência de cores personalizada conforme as diretrizes da marca do clube'
        - 'Entrega de concierge: pré-insufladas, preparadas e etiquetadas para cada época'
        - 'Gestão de conta dedicada com SLA de resposta prioritária'
