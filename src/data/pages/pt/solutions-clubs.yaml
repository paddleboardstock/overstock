hero:
  tagline: Clubes de esportes aquáticos
  title: Equipamentos e soluções<br />Para clubes de paddle e centros de treinamento
  subtitle: Pacotes completos de equipamentos, equipamentos de instrutor, marca e suporte de manutenção para clubes de SUP, clubes de caiaque, escolas de surf e centros de treinamento de esportes aquáticos de qualquer tamanho.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Pranchas Aquafarer SUP para clubes de desportos aquáticos e frotas de aluguer
direct_answer: Aquafarer fornece soluções completas de equipamentos para clubes de esportes aquáticos e centros de treinamento em todo o mundo. Nossos pacotes de clube incluem pranchas de SUP, caiaques, remos, bombas, kits de reparo e equipamentos de segurança a preços competitivos de atacado com MOQs baixos. Cada pacote pode ser personalizado com logotipos do clube, cores da marca e embalagens personalizadas. Também oferecemos treinamento em manutenção, suporte de peças de reposição e programas de rotação de equipamentos para maximizar a vida útil de sua frota.
solution_offerings:
  - title: Pacote inicial do clube
    subtitle: Para clubes emergentes com 10 a 30 associados
    badge: Best Seller
    features:
      - title: Equipamento principal
        description: 10–30 pranchas de SUP ou caiaques com remos, bombas e kits de reparo correspondentes
      - title: Equipamento de segurança
        description: Coletes salva-vidas, apitos e conjuntos de trelas nas cores do clube para cada prancha
      - title: Equipamento do Instrutor
        description: Pranchas específicas para treinadores com decks antiderrapantes e estabilidade extra
      - title: Pacote de marca
        description: Impressão de logotipo personalizado em pranchas, pás e embalagens
      - title: Materiais de treinamento
        description: Guias de aulas para iniciantes, protocolos de segurança e listas de verificação de manutenção
    cta_text: 'Montar o meu pacote de clube'
    cta_href: /contact
  - title: Pacote Clube Premium
    subtitle: Para clubes estabelecidos e operadoras com vários locais
    badge: Professional
    features:
      - title: Frota Completa
        description: 30–100 frota mista de SUPs, caiaques e acessórios
      - title: Sistema de segurança avançado
        description: Rastreamento de equipamentos RFID, aplicativo de relatório de danos, sinalização de segurança
      - title: Treinamento de pessoal
        description: Certificação de instrutor no local e oficina de manutenção de equipamentos
      - title: Suporte de marketing
        description: Fotografia profissional, brochuras e modelos de mídia social
      - title: Programa de Substituição
        description: Atualização anual do equipamento com tarifas reduzidas e opções de troca
    cta_text: 'Expandir o meu clube'
    cta_href: /contact
