hero:
  tagline: Clubes de esportes aquáticos
  title: Equipamentos e Soluções<br />Para Clubes de Paddle e Centros de Treinamento
  subtitle: Pacotes completos de equipamentos, material para instrutores, personalização de marca e suporte de manutenção para clubes SUP, escolas de surf e centros de treinamento de esportes aquáticos de qualquer tamanho.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP pranchas para clubes de esportes aquáticos e frotas de aluguel
direct_answer: Paddle Board Overstock fornece soluções de equipamentos completas para clubes de esportes aquáticos e centros de treinamento ao redor do mundo. Nossos pacotes para clubes incluem pranchas SUP, remos, bombas, kits de reparo e equipamentos de segurança com preços diretos de fábrica para clubes. Cada pacote pode ser personalizado com logotipos do clube, cores da marca e embalagem personalizada. Também oferecemos treinamento de manutenção, suporte de peças sobressalentes e programas de rotação de equipamentos para maximizar a vida útil da sua frota.
