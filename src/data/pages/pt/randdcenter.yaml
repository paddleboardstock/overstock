intro:
  - O Centro de Pesquisa e Desenvolvimento (P&D) da Paddle Board Overstock é a força motriz por trás da nossa missão de revolucionar o equipamento de desportos aquáticos. Capacitamos os entusiastas de desportos aquáticos globalmente com produtos mais seguros, mais confortáveis e mais agradáveis através de inovação incansável em pranchas SUP infláveis e barcos. A nossa equipa dedicada de engenheiros, designers e especialistas apaixonados por desportos aquáticos está a moldar o futuro da indústria, elevando constantemente o padrão de qualidade, desempenho e sustentabilidade.
  - A nossa instalação de P&D reúne cientistas de materiais, arquitetos navais e engenheiros de produção sob o mesmo teto. Desde formulação de tecidos e simulação de cascos até desenvolvimento de processos de soldagem e provas de mar em escala real, cada etapa do desenvolvimento do produto é orientada por dados e validada por testes.

