rd_services:
  tagline: P&D Personalizado
  title: Serviços de P&D para Parceiros
  services:
    - title: Desenvolvimento de Material Personalizado
      desc: Desenvolvemos formulações de tecido personalizadas, pilhas de laminados e sistemas adesivos adaptados ao seu ambiente operacional e objetivos de desempenho.
    - title: Engenharia de Produto OEM / ODM
      desc: De esboços conceptuais a pacotes de engenharia prontos para produção — a nossa equipa pode projetar, prototipar e validar barcos sob a sua marca.
    - title: Testes e Certificação de Terceiros
      desc: Utilize as nossas instalações de teste conformes ISO para testes independentes de materiais, validação de produtos e apoio à certificação.
  cta: Discuta os seus requisitos de P&D →
  cta_link: /contact

vision:
  tagline: Nossa Visão
  title: Moldar o Futuro dos Desportos Aquáticos
  body: A Paddle Board Overstock esforça-se por liderar a indústria de barcos infláveis e SUP através de inovação contínua, qualidade inabalável e um compromisso firme com a segurança e sustentabilidade — enriquecendo em última análise as experiências dos entusiastas de desportos aquáticos em todo o mundo. O Centro de P&D Paddle Board Overstock é onde a paixão encontra a inovação, estabelecendo novos padrões para a indústria de desportos aquáticos.

labs_section:
  tagline: Laboratórios
  title: Os Nossos Laboratórios
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: Laboratório de Tecidos PVC
      description: Pesquisa e teste contínuos de tecidos para tubos PVC e Hypalon quanto à resistência à tração, resistência UV, abrasão e flexibilidade a baixas temperaturas para garantir fiabilidade a longo prazo em ambientes marinhos.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Estúdio de Engenharia de Casco
      description: Design orientado por CAD e análise de elementos finitos de cascos HDPE, alumínio e fibra de vidro. Cada casco é simulado digitalmente para distribuição de tensões e resistência ao impacto antes da construção do primeiro protótipo.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: Centro de Soldagem RF
      description: Instalação dedicada de soldagem por radiofrequência com controlo preciso de temperatura e pressão, produzindo costuras estanques de alta resistência que excedem os padrões ISO 6185 para embarcações infláveis.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Tanque de Teste Hidrodinâmico
      description: Testes em modelo reduzido no nosso tanque de teste interno para otimizar a forma do casco, desempenho de planagem, estabilidade e eficiência de combustível numa variedade de condições de carga e mar.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Oficina de Protótipos
      description: Instalação de prototipagem e equipamento em escala real onde novos modelos são construídos, equipados e testados no mar. Cada protótipo passa por um programa mínimo de 20 horas de teste na água antes da aprovação de produção.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Laboratório de Qualidade e Inspeção
      description: Laboratório dedicado de garantia de qualidade que realiza testes de tração, ciclos de retenção de ar, testes de peeling de costuras e certificação de materiais para garantir que cada barco que sai da oficina cumpre as nossas especificações publicadas.
      href: /randdcenter/quality-inspection-lab
