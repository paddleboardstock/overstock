capabilities:
  tagline: Capacidades
  title: Capacidades de P&D
  subtitle: Quatro disciplinas principais que nos dão controlo total sobre o desenvolvimento do produto — desde a pesquisa de matérias-primas até à certificação final.
  groups:
    - title: Ciência de Materiais e Tecnologia de Tecidos
      items:
        - Análise e otimização de formulações de PVC e Hypalon
        - Desenvolvimento de estabilização UV, retardância de chama e aditivos antimicrobianos
        - Engenharia de laminação e adesão de tecidos multicamada
        - Testes de envelhecimento acelerado (UV, térmico, humidade, névoa salina)
    - title: Engenharia de Casco e Hidrodinâmica
      items:
        - Design paramétrico de casco 3D e otimização CFD
        - Análise de elementos finitos para cargas estruturais e de impacto
        - Testes em tanque de reboque com modelos em escala e validação de desempenho
        - Desenvolvimento de casco personalizado para perfis de missão especiais
    - title: Tecnologia de Soldagem e Junção
      items:
        - Desenvolvimento e otimização de processos de soldagem dielétrica RF
        - Métodos de soldagem por ar quente, cunha quente e ultrassónica
        - Qualificação de adesivos e fitas de costura
        - Modelação de resistência de solda e previsão de vida útil
    - title: Testes, Certificação e Conformidade
      items:
        - Testes de conformidade , e CE
        - Testes independentes de terceiros e apoio à certificação
        - Desenvolvimento de protocolos de teste personalizados para qualificação de aquisição
        - Análise de falhas em serviço e investigação de causa raiz

