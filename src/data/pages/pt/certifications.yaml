hero:
  tagline: Certificações & Normas
  title: 'Certificações de Qualidade<br />& Normas de Conformidade'
  subtitle: 'Os produtos Aquafarer são fabricados em conformidade com as normas internacionais de segurança marítima, sistemas de gestão de qualidade e regulamentações ambientais.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Certificações de qualidade e documentação de conformidade da Aquafarer
content_certifications:
  tagline: Nossas Certificações
  title: 'Qualidade Certificada,<br />Reconhecida Globalmente'
  subtitle: '64 modelos com certificação CE e certificações em toda a fábrica demonstram o nosso compromisso com a qualidade, a segurança e a responsabilidade ambiental.'
  items:
    - title: 'Certificado CE'
      description: '64 modelos com certificação CE cumprem os requisitos de marcação CE europeia para embarcações de recreio, garantindo que são respeitados os padrões de segurança, saúde e proteção ambiental.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'O nosso sistema de gestão da qualidade está certificado pela norma ISO 9001:2015, abrangendo o design, a fabricação e a distribuição de embarcações insufláveis e equipamento marinho.'
      icon: tabler:clipboard-check
    - title: 'Marcação UKCA'
      description: 'Os produtos vendidos no mercado do Reino Unido possuem marcação UKCA, confirmando a conformidade com os regulamentos do Reino Unido para equipamento marinho e embarcações de recreio.'
      icon: tabler:shield
    - title: 'Conforme com BSCI'
      description: 'A Aquafarer é auditada pela BSCI (Business Social Compliance Initiative), demonstrando práticas de fabricação éticas, condições de trabalho justas e responsabilidade na cadeia de abastecimento.'
      icon: tabler:heart-handshake
    - title: 'Conforme com REACH'
      description: 'Todos os materiais utilizados nos produtos Aquafarer cumprem o regulamento REACH da UE para segurança química, garantindo a ausência de substâncias restritas no nosso PVC, Hypalon ou componentes.'
      icon: tabler:flask
    - title: 'Ensaios de Materiais'
      description: 'Os tecidos são ensaiados quanto à resistência à tração, à resistência ao rasgo, à degradação UV e ao desempenho em frio extremo. Cada lote de produção é amostrado e verificado.'
      icon: tabler:test-pipe
content_factory:
  tagline: Normas de Fábrica
  title: 'Excelência de Fabrico<br />— Construído conforme Especificação'
  subtitle: 'A nossa instalação de 12,000 m² opera sob protocolos rigorosos de controlo de qualidade em todas as etapas da produção.'
  list:
    - 'Inspeção de Materiais Recebidos: Todas as matérias-primas — tecido de PVC, Hypalon, alumínio, contraplacado, adesivos — são ensaiadas contra especificações antes de entrarem em produção.'
    - 'Controlo de Qualidade em Processo: Cada etapa de produção tem pontos de controlo QC documentados. A resistência das soldaduras, o alinhamento das costuras, a instalação de válvulas e o aperto dos acessórios são verificados em linha.'
    - 'Teste de pressão: Cada câmara inflável é testada com pressão de 1,25× a pressão nominal por 24 a 48 horas. A taxa de vazamento deve ser zero para aprovação.'
    - 'Inspeção Final: Os produtos acabados são inspecionados quanto à precisão dimensional, ao acabamento estético, à completude dos acessórios e à integridade da embalagem antes do envio.'
    - 'Rastreabilidade de Lote: Cada produto possui um número de série ligado aos registos do lote de produção, permitindo rastreabilidade total desde a matéria-prima até ao produto acabado.'
content_safety:
  tagline: Normas de Segurança Marítima
  title: 'Segurança em Primeiro Lugar<br />— Concebido para Operação Fiável'
  subtitle: 'Os produtos Aquafarer são concebidos e ensaiados para cumprir as normas internacionais de segurança marítima para uso comercial e recreativo.'
  items:
    - title: 'ISO 6185'
      description: 'Os barcos insufláveis cumprem as normas ISO 6185 relativas à construção, estabilidade, flutuação e capacidade de carga.'
      icon: tabler:sailboat
    - title: 'Normas ABYC'
      description: 'Os sistemas elétricos e de combustível seguem as normas ABYC (American Boat & Yacht Council) para instalação e operação seguras.'
      icon: tabler:bolt
    - title: 'Conformidade SOLAS'
      description: 'O equipamento de segurança e os aparelhos de salvamento cumprem os requisitos SOLAS (Safety of Life at Sea) sempre que aplicável.'
      icon: tabler:lifebuoy
cta:
  title: 'Precisa de produtos certificados para o seu projeto?'
  subtitle: 'Contacte a nossa equipa para discutir requisitos de certificação, documentação e conformidade para o seu mercado.'
  actions:
    - variant: primary
      text: Solicitar documentos de certificação
      href: /contact
    - text: Ver a nossa página de qualidade
      href: /quality
