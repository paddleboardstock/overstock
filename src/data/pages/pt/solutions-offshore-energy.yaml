content_challenge:
  tagline: O desafio
  title: Demandas de energia offshore<br />Confiabilidade em ambientes extremos
  subtitle: 'As operações de energia offshore levam os equipamentos ao limite: condições climáticas extremas, locais remotos, ciclos de trabalho contínuos e tolerância zero a falhas.'
  paragraphs:
    - "A indústria de energia offshore opera nos ambientes marítimos mais exigentes do planeta. As embarcações de trabalho apoiam plataformas de petróleo e gás, instalações de turbinas eólicas offshore, operações de cabos submarinos e projetos de construção marítima — muitas vezes em mar aberto, com janelas meteorológicas limitadas. Uma falha de equipamento não é apenas cara: é perigosa."
    - '**A segurança é a máxima prioridade** — As embarcações de transferência de tripulação (CTV) devem operar com segurança em estados de mar que interromperiam qualquer outra operação. Estabilidade no ponto de transferência, desempenho confiável dos motores em qualquer clima e construção robusta para atracações repetidas contra estruturas offshore são requisitos obrigatórios.'
    - '**A capacidade para todas as condições climáticas é essencial** — Os parques eólicos offshore e as plataformas de petróleo operam o ano inteiro. As embarcações de trabalho precisam performar em mares pesados, ventos fortes e visibilidade reduzida. Operações diurnas e noturnas exigem conjuntos completos de navegação e sistemas de iluminação confiáveis.'
    - '**O setor de energia eólica offshore cresce rapidamente** — Milhares de novas turbinas estão sendo instaladas globalmente, cada uma exigindo transferência regular de tripulação, transporte de ferramentas e suporte de manutenção. Isso cria demanda sustentada por embarcações de transferência de tripulação (CTV) e RIBs de apoio construídos para esse fim.'
    - Os RIBs para energia offshore da Paddle Board Overstock são projetados com cascos deep-V reforçados, tubos Hypalon de alta resistência, conjuntos completos de navegação e sistemas de segurança desenvolvidos para as condições extremas das operações de energia offshore.
content_solution:
  tagline: Nossa solução
  title: RIBs Offshore Especialmente Construídos<br />Para a Indústria de Energia
  subtitle: Cada RIB de energia offshore Paddle Board Overstock é projetado para operação segura e confiável em condições marítimas extremas – do Mar do Norte ao Sudeste Asiático.
  list:
    - Casco deep-V reforçado para desempenho em águas agitadas e manuseio previsível
    - Tubos Hypalon de alta resistência com resistência a UV e a produtos químicos para serviço offshore prolongado
    - Ferragens em aço inoxidável 316 — sem corrosão em exposição contínua à água salgada
    - 'Conjunto completo de navegação: GPS, radar, VHF, luzes de navegação noturna — de série nos modelos offshore'
    - Convés auto-drenante para operação segura em mares que embarcam água
    - Configurações de motor múltiplas — popa simples ou dupla para redundância de missão
    - Mastro de reboque e bitas de alta resistência para manuseio de plataformas e bóias
    - Cores de tubos de alta visibilidade para identificação em canteiros offshore
content_segments:
  tagline: Perfis de Energia
  title: Soluções de energia offshore<br />Por tipo de aplicação
  subtitle: Diferentes setores de energia offshore têm requisitos únicos para barcos de trabalho – desde RIBs de suporte de plataforma até CTVs de parques eólicos e embarcações de inspeção submarinas.
  items:
    - title: Suporte a plataformas offshore de petróleo e gás
      subtitle: Transferência de tripulação, fornecimento de equipamentos, espera de segurança da plataforma
      description: As plataformas de petróleo e gás exigem troca diária de tripulação, transporte de equipamentos e suprimentos e cobertura de prontidão de segurança. Os barcos de trabalho devem operar com segurança em torno das estruturas da plataforma, em correntes fortes e estados de mar variáveis, e manter uma posição precisa durante a transferência de pessoal através de escadas ou passadiços. O ambiente extremo — hidrocarbonetos, produtos químicos, névoa salina constante — exige uma construção resistente à corrosão e um desempenho confiável.
      features:
        - Configuração de transferência de tripulação com acesso de embarque seguro e corrimãos
        - Tubos Hypalon anticorrosão e ferragens em aço inoxidável 316
        - Cintas de atrito reforçadas para contato frequente com as defesas da plataforma
        - Convés auto-drenante para águas oleosas e lavagens químicas
        - Tanque de combustível de alta capacidade para alcance operacional offshore estendido
        - Opção de motor duplo para redundância crítica de missão
    - title: Operações de parques eólicos offshore
      subtitle: Transferência de tripulação, manutenção de turbinas, transporte de ferramentas
      description: A energia eólica offshore é o setor que mais cresce na energia marinha. Os operadores precisam de embarcações de transferência de tripulação (CTVs) que possam transferir técnicos com segurança para plataformas de acesso a turbinas em estados marítimos com altura de onda significativa de até 1,5 m. A estabilidade durante a transferência, a capacidade em quaisquer condições climáticas e a operação diária confiável são essenciais. As embarcações de serviço de parques eólicos operam em horários apertados – qualquer tempo de inatividade atrasa o comissionamento ou a manutenção da turbina, afetando diretamente as receitas de produção de energia.
      features:
        - Forma de casco otimizada para transferência estável de tripulação na base da turbina
        - Entrada deep-V para navegação confortável em mar picado e ondulação offshore
        - Proteção climática completa — console fechado ou cabine de comando para o conforto da tripulação
        - Espaço de convés para ferramentas, peças de reposição e equipamentos de serviço
        - Pacote de operações noturnas para turnos de inverno limitados pela luz do dia
        - Operação silenciosa do motor de popa para impacto mínimo de ruído no ambiente marinho
    - title: Suporte para cabos e dutos submarinos
      subtitle: Inspeção, manutenção, suporte de ROV, vistoria
      description: Os operadores de cabos e dutos submarinos precisam de barcos de trabalho para inspeção de rotas, suporte de manutenção, operações de ROV e tarefas de pesquisa. Essas embarcações exigem plataformas estáveis para implantação e recuperação de equipamentos subaquáticos, manobras precisas para rastreamento de cabos e operação confiável em ambientes costeiros e offshore. A estabilidade do barco é crítica para a precisão do sonar e do equipamento de levantamento.
      features:
        - Plataforma estável em baixa velocidade para rastreamento de cabos e operações de levantamento
        - Layout de convés aberto para lançamento de ROVs, carretéis de cabos e equipamentos de levantamento
        - Placas de montagem de equipamentos para sonar, GPS e instrumentação de levantamento
        - Design de casco de esteira mínima para perturbação mínima do leito marinho durante a inspeção
        - Manobras precisas em baixa velocidade com direção de popa responsiva
    - title: Engenharia Marinha e Apoio à Construção
      subtitle: Transporte de pessoal, fornecimento de material, apoio ao mergulho
      description: Os empreiteiros de engenharia naval que trabalham na construção de portos, proteção costeira e projetos de instalação offshore precisam de barcos de trabalho versáteis para transporte de pessoal entre navios de construção e terra, fornecimento de materiais e ferramentas, apoio ao mergulho e pesquisas no local. Esses barcos operam em zonas de construção ativa com múltiplas embarcações, espaço de manobra restrito e condições de mar variáveis. Durabilidade e versatilidade são fundamentais.
      features:
        - Layout de convés multiuso para pessoal, materiais e equipamentos de mergulho
        - Escada de mergulho e fixações de equipamentos para operações de apoio ao mergulho
        - Bitas de alta resistência e mastro de reboque para manobras em canteiros de obras
        - Construção Hypalon robusta com resistência a entulhos de obra e abrasão
        - Configurações de assentos flexíveis — modo transporte de tripulação ou carga
