testimonials:
  - category: clubes
    name: Ricardo Santos
    title: Proprietário, Algarve Surf Academy
    location: Lagos, Portugal
    content: Começamos com o Club Starter Package para a nossa escola de surf. 20 pranchas, remos, coletes – tudo chegou em 3 semanas. Após duas temporadas, atualizamos para o Pacote Pro. A marca personalizada com nosso logotipo foi uma virada de jogo para nossa imagem profissional.
    rating: 5
    product: Pacote inicial do clube
    source: solutions/clubs
  - category: clubes
    name: Proprietário do clube
    title: Clube de esportes aquáticos
    location: Phuket, Tailândia
    content: O Club Starter Package foi o ponto de entrada perfeito. À medida que o nosso negócio crescia, a Aquafarer crescia connosco — a mesma qualidade, o mesmo preço, sem surpresas. Escalamos de 10 para 80 quadros em 18 meses.
    rating: 5
    product: Clube Starter + Pacote Premium
    source: success-stories
  - category: Estâncias
    name: Gerente Geral do Resort
    title: Estância balnear de 5 estrelas
    location: Grécia
    content: A Aquafarer não apenas entregou pranchas – eles nos ajudaram a construir uma experiência completa para os hóspedes. Nosso programa de esportes aquáticos passou de zero a destaque em resort em uma temporada. Mais de 300 reservas semanais e US$ 180 mil em receita anual.
    rating: 5
    product: Pacote Resort Premium
    source: success-stories
  - category: Estâncias
    name: Sophie Laurent
    title: Diretor de Experiência do Hóspede, Azure Bay Resorts
    location: Phuket, Tailândia
    content: A Aquafarer projetou e equipou todo o nosso programa de atividades na praia em três propriedades do resort. 80 SUPs, 40 caiaques, infraestrutura de segurança e treinamento de pessoal — tudo entregue em uma única remessa. A participação dos convidados aumentou 60% na primeira temporada.
    rating: 5
    product: Pacote Resort Premium
    source: solutions/resorts
  - category: empreendedores
    name: Parque Michael
    title: Fundador, Shoreline Paddle Co.
    location: Califórnia, EUA
    content: Lancei minha marca SUP sem nenhuma experiência no setor. A equipe da Aquafarer me orientou desde a seleção do produto até o design personalizado do logotipo e da embalagem. Meu primeiro contêiner chegou em 11 semanas e esgotou em 3 meses na Amazon.
    rating: 5
    product: Lançamento da marca inicial
    source: solutions/entrepreneurs
  - category: empreendedores
    name: Fundador
    title: Marca australiana de SUP
    location: Austrália
    content: Tive a ideia da marca, mas nenhum conhecimento de fabricação. Aquafarer literalmente segurou minha mão durante todo o processo – desde a escolha do design certo da placa até a desembalagem da minha primeira remessa. 90 dias do sonho à entrega.
    rating: 5
    product: Pacote de lançamento de marca
    source: success-stories
  - category: aluguel
    name: Daniel Okonkwo
    title: Proprietário, Aluguel de SUP em Lakeland
    location: Ontário, Canadá
    content: Eu estava alugando 5 pranchas em uma loja local e perdendo 60% da minha receita para elas. Aquafarer me ajudou a construir minha própria frota de 15 SUPs. A calculadora de ROI mostrou o ponto de equilíbrio em 4 meses – foram necessários 3. Agora estou expandindo para 30 conselhos.
    rating: 5
    product: Kit inicial de frota
    source: solutions/rental-business
  - category: aluguel
    name: Marco Valenti
    title: Diretor de Operações, Adriatic Adventure Tours
    location: Dubrovnik, Croácia
    content: Equipamos toda a nossa frota de aluguel com RIBs Aquafarer – 12 barcos em três locais. Duas temporadas depois, zero falhas. A documentação da certificação CE facilitou a aprovação do seguro. A equipe de engenharia até personalizou as cores dos tubos.
    rating: 5
    product: Kit de Expansão de Frota
    source: trust
  - category: aluguel
    name: Tenente Comandante Andres Reyes
    title: Oficial de compras marítimas, auxiliar da Guarda Costeira das Filipinas
    location: Manila, Filipinas
    content: Operamos 24 RIBs Aquafarer em toda a nossa frota de patrulha costeira. Seu processo de controle de qualidade é consistente em todos os lotes – sempre a mesma qualidade de costura, o mesmo posicionamento da válvula e a mesma classificação de pressão. Essa repetibilidade é importante quando vidas dependem do equipamento.
    rating: 5
    product: Frota de patrulha RIB
    source: trust
  - category: consumidores
    name: Sara K.
    title: Proprietário de SUP pela primeira vez
    location: Lago Tahoe, EUA
    content: Estável mesmo para um iniciante. Levei-o para o lago no meu primeiro dia e nunca mais caí. O pacote completo com bomba e remo significava que eu estava na água 20 minutos depois de abrir a caixa.
    rating: 5
    product: SUP Explorador 11
  - category: consumidores
    name: James Thorton
    title: Proprietário do SUP Explorer 11
    location: Vancouver, Canadá
    content: Como comprador pela primeira vez, fiquei nervoso com os pedidos de qualidade do exterior. A documentação ISO e os relatórios de testes de terceiros que eles compartilharam antes mesmo de eu perguntar me deram total confiança. A prancha chegou em 6 dias e superou minhas expectativas.
    rating: 5
    product: SUP Explorador 11
    source: trust
  - category: consumidores
    name: Mike R.
    title: Caiaque recreativo
    location: Flórida, EUA
    content: Qualidade de construção sólida. Lida com costeletas muito melhor do que eu esperava de um inflável. Coloquei-o no porta-malas do carro para uma viagem de fim de semana - inflado na rampa em menos de 4 minutos.
    rating: 5
    product: Caiaque inflável
