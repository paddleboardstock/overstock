testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Proprietário, Algarve Surf Academy
    location: Lagos, Portugal
    content: Começamos com o Club Starter Package para a nossa escola de surf. 20 pranchas, remos, coletes – tudo chegou em 3 semanas. Após duas temporadas, atualizamos para o Pacote Pro. A marca personalizada com nosso logotipo foi uma virada de jogo para nossa imagem profissional.
    rating: 5
    product: Pacote inicial do clube
    source: solutions/clubs
  - category: clubs
    name: Proprietário do clube
    title: Clube de esportes aquáticos
    location: Phuket, Tailândia
    content: O Pacote Inicial para Clubes foi o ponto de entrada perfeito. À medida que nosso negócio cresceu, Paddle Board Overstock cresceu conosco — mesma qualidade, mesmo preço, sem surpresas. Expandimos de 10 para 80 pranchas em 18 meses.
    rating: 5
    product: Clube Starter + Pacote Premium
    source: success-stories
  - category: resorts
    name: Gerente Geral do Resort
    title: Estância balnear de 5 estrelas
    location: Grécia
    content: Paddle Board Overstock não apenas entregou pranchas — eles nos ajudaram a construir uma experiência completa para os hóspedes. Nosso programa de esportes aquáticos passou de zero a destaque do resort em uma temporada. 300+ reservas semanais e $180K em receita anual.
    rating: 5
    product: Pacote Resort Premium
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Diretor de Experiência do Hóspede, Azure Bay Resorts
    location: Phuket, Tailândia
    content: Paddle Board Overstock projetou e equipou todo o nosso programa de atividades de praia em três propriedades do resort. 120 SUPs, infraestrutura de segurança e treinamento da equipe — tudo entregue em um único envio. A participação dos hóspedes aumentou 60% na primeira temporada.
    rating: 5
    product: Pacote Resort Premium
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Proprietário, Aluguel de SUP em Lakeland
    location: Ontário, Canadá
    content: Eu estava alugando 5 pranchas de uma loja local e perdendo 60% da minha receita para eles. Paddle Board Overstock me ajudou a montar minha própria frota de 15 SUPs. O calculador ROI mostrou ponto de equilíbrio em 4 meses — levou 3. Agora estou expandindo para 30 pranchas.
    rating: 5
    product: Kit inicial de frota
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Diretor de Operações, Adriatic Adventure Tours
    location: Dubrovnik, Croácia
    content: Equipamos toda a nossa frota de aluguel SUP com pranchas Paddle Board Overstock — 30 pranchas em três locais. Duas temporadas depois, zero falhas. A qualidade consistente em cada lote tornou nossa escolha fácil, e a equipe deles até combinou as cores com nossa marca.
    rating: 5
    product: Pacote de Frota de Aluguel
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Proprietária, Aluguéis de SUP Lake Garda
    location: Lake Garda, Itália
    content: Nossas pranchas de aluguel saem cinco vezes por dia na alta temporada. Desde a mudança para Paddle Board Overstock, as reclamações sobre danos caíram para quase zero, e os clientes continuam perguntando onde podem comprar sua própria prancha.
    rating: 5
    product: Pacote de Frota de Aluguel
    source: solutions/rental-business
  - category: consumers
    name: Sara K.
    title: Proprietário de SUP pela primeira vez
    location: Lago Tahoe, EUA
    content: Estável mesmo para um iniciante. Levei-o para o lago no meu primeiro dia e nunca mais caí. O pacote completo com bomba e remo significava que eu estava na água 20 minutos depois de abrir a caixa.
    rating: 5
    product: SUP Explorador 11
  - category: consumers
    name: James Thorton
    title: Proprietário do SUP Explorer 11
    location: Vancouver, Canadá
    content: Como comprador de primeira viagem, estava nervoso em pedir do exterior. A qualidade da construção se destacou no momento em que desembalei — rígida, costuras perfeitas, e chegou em apenas 6 dias.
    rating: 5
    product: SUP Explorador 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Remador de Fim de Semana
    location: Flórida, EUA
    content: Qualidade de construção sólida. Lida com costeletas muito melhor do que eu esperava de um inflável. Coloquei-o no porta-malas do carro para uma viagem de fim de semana - inflado na rampa em menos de 4 minutos.
    rating: 5
    product: SUP Brisa Tropical
