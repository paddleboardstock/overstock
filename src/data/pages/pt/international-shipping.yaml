process_section:
  tagline: Como o Envio Funciona
  title: Do Nosso Armazém Para Sua Porta
  steps:
    - title: Cotação com Opções de Frete
      description: Cada cotação detalha as opções de frete para o seu destino — expresso e marítimo — com tempos de trânsito estimados, para que nada seja decidido por você.
    - title: Verificação de Qualidade e Embalagem
      description: As pranchas são 100% testadas sob pressão e depois embaladas com bomba, remo, leash, quilha, mochila e kit de reparo — o mesmo pacote completo que vendemos no varejo.
    - title: Despacho de Weihai
      description: Sua remessa deixa nossa base logística com o método de frete que você escolheu e o rastreamento porta a porta é compartilhado com você no mesmo dia.
    - title: Desembaraço Aduaneiro
      description: Fornecemos a fatura comercial e a lista de embalagem necessárias para a importação. Impostos e taxas de importação em seu país são de responsabilidade do importador — veja a seção de alfândega abaixo.
    - title: Entrega e Inspeção
      description: Inspecione sua entrega ao chegar. Se algo estiver danificado ou faltando, entre em contato conosco com fotos e o número do pedido — veja nossa política de itens perdidos e danificados abaixo.
customs_section:
  tagline: Alfândega e Impostos
  title: Taxas Alfandegárias e Impostos de Importação
  subtitle: Mantemos as responsabilidades de frete explícitas em vez de fazer promessas vagas. Aqui está exatamente quem é responsável por quê.
  items:
    - title: O Que Cobrimos
      description: Sua cotação inclui o custo do frete até seu destino, e nós preparamos e fornecemos todos os documentos de exportação — fatura comercial, lista de embalagem e rastreamento da remessa.
    - title: O Que o Importador Cobre
      description: Impostos de importação, IVA/ICMS e quaisquer impostos do país de destino são pagos pelo importador (você ou sua empresa), de acordo com as regras do seu país. Não incluímos promessas vagas de impostos em nossas cotações de frete.
    - title: Suporte ao Desembaraço Aduaneiro
      description: Nossa papelada é completa e consistente — códigos HS corretos, valores declarados e especificações do quadro — o que mantém a desemaranhada fluida. Se seu corretor ou alfândega precisar de documentação extra, nós a fornecemos.
    - title: Verifique as tarifas locais antes de fazer o pedido
      description: As taxas de imposto sobre equipamentos infláveis para esportes aquáticos variam de país para país. Verifique as regras de importação do seu país ou pergunte em sua consulta — nossos guias regionais de mercado incluem notas alfandegárias para os principais mercados.
lost_damaged:
  title: Remessas Perdidas ou Danificadas
  description: Inspecione sua entrega quando ela chegar. No raro caso de uma placa chegar danificada ou um pacote estar faltando, entre em contato conosco o quanto antes com o número do seu pedido e fotos claras da embalagem e da placa. Avaliamos cada caso individualmente — dependendo da caixa, isso significa peça de reposição, placa de reposição ou reembolso do item afetado. Defeitos de fabricação são cobertos separadamente pela nossa Garantia de 2 Anos SUP .
destinations_section:
  tagline: Onde Embarcamos
  title: 50+ Países e Contando
  description: Enviamos para todo o mundo, com guias detalhados para nossos principais mercados regionais. Cada guia de mercado cobre tipos de clientes locais, notas de envio e dicas alfandegárias para aquela região.
  regions_label: Guias Regionais
  countries_label: Guias de País
faq_section:
  title: FAQ sobre Navegação
  items:
    - q: Quanto tempo leva o envio expresso?
      a: O tempo de trânsito expresso depende do destino — nós citamos o tempo estimado de trânsito para o seu país a cada consulta, antes que você se comprometa com qualquer coisa.
    - q: Quanto tempo leva o transporte marítimo?
      a: O transporte marítimo de cargas varia conforme o porto de destino e os horários de navegação. Nós citamos uma janela estimada para o seu destino junto com seu pedido, e você recebe rastreamento assim que a remessa parte.
    - q: Qual método de envio devo escolher?
      a: Expresso para 1–3 tábuas, amostras ou reabastecimento urgente. Frete marítimo para 5–20 pedidos de quadro no atacado, onde o custo por quadro importa mais do que a velocidade. Nós citamos ambos para que você possa comparar.
    - q: Taxas e impostos de importação estão incluídos no custo de envio?
      a: Não. O frete é cotado separadamente e os direitos de importação, IVA/GST e impostos de destino são responsabilidade do importador segundo as regras do seu país. Fornecemos documentação completa e precisa para manter a liquidação sem problemas.
    - q: Vocês enviam para o meu país?
      a: Enviamos para 50+ países. Confira nossos guias regionais e por país abaixo, ou simplesmente pergunte em sua consulta — confirmaremos o serviço atual para o seu endereço.
    - q: Posso rastrear meu pedido?
      a: Sim. Cada remessa — expressa ou marítima — inclui rastreamento porta a porta que compartilhamos com você no dia do envio.
