hero:
  tagline: Navegação Internacional
  title: Transporte Internacional —<br />Transporte Expresso e Marítimo para 50+ Países
  subtitle: Cada pedido é enviado a partir da nossa base logística em Weihai, China. Escolha frete aéreo expresso para amostras e reabastecimento urgente, ou frete marítimo consolidado para pedidos atacadistas de pequenas empresas.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Tábuas embaladas para envio internacional
direct_answer: Paddle Board Overstock envia para mais de 50 países a partir de Weihai, China. O frete aéreo expresso transporta de 1 a 3 placas, pedidos de amostras e reabastecimento urgente; o frete marítimo consolidado é a opção econômica para 5 a 20 pedidos atacadistas de placa. Cada remessa inclui rastreamento porta a porta, e cada placa é 100% testada sob pressão e embalada com seu kit completo de acessórios antes do envio.
tldr_points:
  - 'Transporte aéreo expresso: 1–3 placas, amostras, reposições urgentes — opção mais rápida'
  - 'Frete marítimo: 5–20 pedidos de atacado por embarcação — menor custo de frete por quadro'
  - Rastreamento porta a porta em cada remessa para 50+ países
  - Frete, seguro, desalfandega e taxas de importação estão detalhadas no seu orçamento — sem promessas vagas de tudo incluído
from_china:
  tagline: Navegação vinda da China
  title: De onde os pedidos são enviados
  description: Todas as ordens são enviadas a partir de nossa base logística em Weihai, China — o coração da nossa operação de produção e armazenagem. Weihai é uma importante cidade portuária costeira na província de Shandong, com conexões diretas de carga marítima e aérea, o que mantém os tempos de trânsito e os custos de frete competitivos para destinos na Ásia, Américas, África, Europa e Oriente Médio.
modes_section:
  tagline: Duas Opções
  title: Transporte Expresso ou Carga Marítima
  subtitle: O método certo de frete depende de quão rápido você precisa das placas e de quantas está pedindo. Ambas as opções são cotadas a cada consulta.
  express:
    name: Opção A — Envio Expresso
    best_for: Ideal para 1–3 pranchas, amostras e reposições urgentes
    description: A Air Express recebe pequenos pedidos e placas de amostras na sua porta em dias, não semanas. Ideal quando você está testando um modelo antes de um pedido maior, ou reabastecendo um best-seller no meio da temporada.
    features:
      - 1–3 placas, modelos individuais ou amostras de modelos mistos
      - O trânsito mais rápido das duas opções — cotado por destino
      - Rastreamento porta a porta com uma grande transportadora expressa
      - 'Uso típico: amostras, reposições urgentes, pequenos pedidos iniciais'
  sea:
    name: Opção B — Transporte Marítim
    best_for: Melhor para 5 a 20 pedidos de varejo e de tabuleiro
    description: O frete marítimo consolidado é a escolha econômica para pedidos atacadistas de pequenas empresas. As placas são agrupadas em uma única remessa consolidada de Weihai, mantendo o custo por tabela baixo.
    features:
      - 5–20 pedidos de varejista e atacado de placa
      - Menor custo de frete por placa entre as duas opções
      - Embalagem consolidada — uma remessa e uma desvenda
      - 'Uso típico: reabastecimento sazonal, pedidos atacadistas de modelos mistos'
