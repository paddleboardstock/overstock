hero:
  tagline: Conhecimento sobre Exploração da Água
  title: Aprender
  subtitle: |
    Guias, tutoriais e análises profundas — tudo que você precisa para explorar<br />
    nadar com confiança. Desde escolher seu primeiro SUP até dominar técnicas avançadas.
  taglineSection: Conhecimento para todos os remadores. Do iniciante ao profissional.
featured:
  tagline: Tópicos em Destaque
  title: Comece sua jornada de aprendizagem
  subtitle: Quer você seja novo em esportes aquáticos ou esteja procurando se aprimorar, nossos guias estão aqui para ajudar.
  items:
    - title: SUP Básico
      description: Tudo o que um iniciante precisa saber — tipos de prancha, tamanho do remo, postura e dicas para o primeiro dia.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Prancha Inflável vs Rígida
      description: Qual é o certo para você? Nós comparamos portabilidade, desempenho, durabilidade e custo lado a lado.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Segurança na Água
      description: Conhecimento essencial de segurança que todo remador deve ter — clima, coletes salva-vidas, auto-resgate e mais.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Guia de Materiais
      description: Drop-stitch cores, PVC lâminas, EVA espuma do deck — entenda do que sua prancha é feita.
      icon: tabler:hexagons
      href: /learn/materials
    - title: Guia de Tamanhos SUP
      description: Encontre o comprimento, largura e volume corretos da prancha para seu peso, habilidade e estilo de remada.
      icon: tabler:ruler
      href: /size-guide
    - title: Técnicas Intermediárias
      description: Melhore sua remada com técnicas avançadas, técnicas de curva e manejo em águas agitadas.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
