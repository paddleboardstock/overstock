    - option: Desenvolvimento totalmente personalizado
      standard: Fornecer conceito e requisitos do mercado-alvo
      premium: Projete do zero – casco personalizado, molde e documentação completa
content_customization:
  tagline: O que pode ser personalizado
  title: Personalização RIB<br />Opções
  subtitle: Cada elemento de um barco RIB pode ser adaptado às necessidades de sua aplicação, mercado e marca.
  items:
    - title: Casco e Estrutural
      description: Comprimento do casco (2,5–8,5 m), material do casco (fibra de vidro GRP ou alumínio de grau marítimo), cor do casco (gelcoat ou pintado), perfil da quilha (V profundo, V moderado, plano), tipo de popa (popa fechada com suporte ou poço) e reforço estrutural para requisitos de carga comercial.
      icon: tabler:sailboat
    - title: Tubo e colar
      description: Material do tubo (PVC de 0,9–1,2 mm ou Hypalon/CSM de 1,4–1,7 mm), diâmetro do tubo (40–55 cm), número de câmaras (3–7), tipo de válvula (Halkey-Roberts, Leafield D7 ou Boston), cor do tubo (padrão ou personalizado) e configuração de colar cônico/cone.
      icon: tabler:circle
    - title: Layout do convés e console
      description: Console central, console lateral ou direção do leme. Disposição dos assentos (assentos jockey, bancos corridos, assentos reforçados). Cobertura do convés (espuma EVA com aspecto de teca, tinta antiderrapante ou GRP puro). Pontos de montagem do equipamento, corrimões e posições de argolas em D.
      icon: tabler:layout-dashboard
    - title: Elétrica e Navegação
      description: Luzes de navegação (LED), sistema de bomba de esgoto, gerenciamento de bateria, instalação de rádio VHF, montagem de GPS/plotter cartográfico, portas de carregamento USB e configuração do painel de interruptores.
      icon: tabler:bolt
    - title: Marca e gráficos
      description: Gráficos de casco e tubo (serigrafia, transferência de calor, impressão digital UV), colocação de logotipo, esquemas de cores personalizados, marcas de identificação e documentação personalizada do proprietário com sua marca.
      icon: tabler:palette
    - title: Segurança e Conformidade
      description: Classificação de categoria de projeto (A/B/C/D por RCD), sistema de supressão de incêndio, especificação do sistema de combustível (tanque portátil, tanque fixo, subconvés) e pacote de documentação de conformidade para seu mercado-alvo.
      icon: tabler:shield
content_applications:
  tagline: Configurações do aplicativo
  title: Configurações RIB<br />Por aplicação
  subtitle: Missões diferentes exigem configurações diferentes. Aqui estão configurações comprovadas para as aplicações RIB mais comuns.
  items:
    - title: Resgate e Patrulha
      description: Casco em V profundo, tubos Hypalon, convés com auto-resgate, assentos reforçados, alças, luzes de navegação e anéis em D para serviço pesado. RCD Design Categoria B ou C. Sistema de combustível resistente ao fogo e elétrico de nível comercial.
      icon: tabler:lifebuoy
    - title: Apoio ao Mergulho
      description: Viga larga, escada de embarque traseira, posições de suporte de tanque, argolas em D extras, suporte para bandeira de mergulho, painel de popa reforçado para motores de popa duplos e cobertura antiderrapante de EVA em todo o convés.
      icon: tabler:mask
    - title: Turismo e Comercial
      description: Layout certificado para passageiros com bancos, guarda-sol/Bimini, barras de apoio, armazenamento a seco e sistema de bateria dupla. RCD Categoria C. Projetado para operações de frotas de resort e charter.
      icon: tabler:beach
    - title: Pesca
      description: Layout de convés aberto, posições de suporte de vara, poço de isca viva, suporte para localizador de peixes, suporte para motor de pesca, gio reforçado e sistema de combustível portátil. Opções de console central ou console lateral.
      icon: tabler:fish
    - title: Concurso de Lazer e Iate
      description: Casco leve, tubos de PVC, assento confortável, leme telescópico ou console compacto, pontos de elevação para turco e tanque de combustível removível. RCD Categoria C ou D.
      icon: tabler:sailboat
    - title: Barco de trabalho profissional
      description: Opção de casco de alumínio, reforço reforçado, direção hidráulica, elétrica de nível comercial, arco de radar e pontos de integração de equipamentos específicos da missão. Conformidade personalizada por projeto.
      icon: tabler:anchor
process_steps:
  title: Processo de desenvolvimento OEM/ODM RIB de 7 etapas
  subtitle: Do resumo do projeto ao pós-venda — um fluxo de trabalho definido com metas e resultados claros
  steps:
    - number: '01'
      title: Resumo e requisitos do projeto
      description: Defina a aplicação alvo, o tamanho do casco, o material do tubo, os requisitos de conformidade e as necessidades de marca. Avaliamos a viabilidade e confirmamos o modelo de colaboração (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 dias
    - number: '02'
      title: Revisão técnica e viabilidade
      description: A equipe de engenharia analisa a viabilidade estrutural, os cálculos de estabilidade e flutuabilidade, o caminho de conformidade e a disponibilidade de materiais. Identificamos moldes existentes ou requisitos de moldes personalizados.
      timeline: 5–7 dias
    - number: '03'
      title: Proposta e Cotação
      description: Receba uma proposta detalhada, incluindo especificações, renderizações 3D ou desenhos GA, escopo de conformidade, cronograma e preço unitário com base em níveis de volume e MOQ.
      timeline: 5–7 dias
    - number: '04'
      title: Confirmação e amostragem de projeto
      description: Aprovar a GA final, o layout do deck e a configuração do tubo. Produzimos uma amostra de pré-produção com as cores da sua marca, logotipo e materiais especificados para sua inspeção física.
      timeline: 15–20 dias
    - number: '05'
      title: Aprovação de amostra e protocolo de controle de qualidade
      description: 'Inspecione e aprove a amostra. Defina o protocolo de CQ de produção: teste de pressão (1,25x / 24–48h), verificações dimensionais e lista de verificação de documentação de conformidade por casco.'
      timeline: 3–5 dias
    - number: '06'
      title: Produção em massa e controle de qualidade
      description: Produção completa com lista de verificação de controle de qualidade de 100 pontos por unidade. Inspeções em processo, testes de pressão e rastreabilidade em nível de série. Documentação CE/ISO preparada em paralelo.
      timeline: 30–45 dias
    - number: '07'
      title: Embalagem, envio e pós-venda
      description: Embalagem personalizada (padrão, pronta para varejo ou paletizada), documentação de exportação, carregamento de contêineres e logística. Kits de peças de reposição e documentação de manutenção incluídos.
      timeline: 7–14 dias
