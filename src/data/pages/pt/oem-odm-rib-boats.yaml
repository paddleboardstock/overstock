comparison_matrix:
  title: OEM vs. ODM – Qual modelo se adapta ao seu projeto?
  subtitle: Quatro modos de colaboração, cada um com diferentes níveis de envolvimento da fábrica e controle da marca
  columns:
    - header: Modo de colaboração
    - header: O papel da sua marca
    - header: Papel do Aquafarer
  rows:
    - option: Fabricação OEM
      standard: Forneça marca, especificações e requisitos de conformidade
      premium: Construa de acordo com suas especificações usando nossos moldes e linhas de produção existentes
    - option: Personalização ODM
      standard: Selecione um modelo básico, personalize recursos e marca
      premium: Adapte a plataforma RIB comprovada com as modificações desejadas
    - option: RIB semi-personalizado
      standard: Definir comprimento do casco, material do tubo, layout do convés e equipamento
