content_service_modules:
  tagline: Módulos de Serviço
  title: OEM/ODM Módulos<br />Serviço
  subtitle: Cada projeto combina os módulos de serviço certos. Nem todo projeto precisa de todos os módulos — abrangemos apenas o que o seu projeto exige.
  items:
    - title: Revisão e Viabilidade de Engenharia
      description: 'Avaliação da plataforma do casco, verificação de viabilidade estrutural, verificação de estabilidade e flutuabilidade, identificação de caminho de conformidade e confirmação de disponibilidade de material. Resultado: relatório de viabilidade com recomendação de avançar/não avançar.'
      icon: tabler:math-function
    - title: Projeto e configuração
      description: 'Desenho GA, layout do deck, configuração dos tubos, posições do console e dos assentos, plano de montagem do equipamento e seleção de cores/materiais. Saída: GA aprovado e especificação de configuração.'
      icon: tabler:ruler
    - title: Amostra e protótipo
      description: Amostra de pré-produção com cores aprovadas, logotipo e materiais especificados para inspeção física. Inclui protocolo de aprovação de amostra, lista de verificação de inspeção e processo de solicitação de alteração.
      icon: tabler:3d-cube-sphere
    - title: Produção e Controle de Qualidade
      description: Produção em massa com lista de verificação de CQ de 100 pontos por unidade, inspeções em processo, testes de pressão (1,25x/24-48h) e rastreabilidade em nível de série. Documentação CE/ISO preparada em paralelo.
      icon: tabler:clipboard-check
    - title: Marca e embalagem
      description: Aplicação de logotipo de marca própria, gráficos personalizados de casco e tubo, documentação da marca do proprietário, embalagem pronta para varejo ou paletizada e preparação de kit de peças de reposição.
      icon: tabler:palette
    - title: Exportação e Documentação
      description: Embalagem de exportação, plano de carregamento de contêineres, documentação FOB/CIF/DDP, documentação de conformidade por mercado de destino e protocolo de comunicação pós-entrega.
      icon: tabler:world
content_risk_control:
  tagline: Controle de risco e entrega
  title: Risco de projeto e<br />Gerenciamento de entrega
  subtitle: Os compradores profissionais OEM/ODM se preocupam tanto com o controle de risco quanto com a qualidade do produto. Aqui está como gerenciamos isso.
  items:
    - title: Definição de escopo e propriedade
      description: 'Antes de iniciar o desenvolvimento, definimos por escrito: escopo de customização, requisitos de ferramentas, critérios de aprovação de amostras, propriedade de desenhos e moldes e responsabilidades de documentação. Não há ambiguidade sobre quem é dono do quê.'
      icon: tabler:file-text
    - title: Processo de controle de mudanças
      description: Todas as alterações nas especificações após a confirmação do projeto seguem um processo documentado de solicitação de alteração com avaliação de impacto (custo, cronograma, conformidade). Nenhuma modificação não aprovada entra em produção.
      icon: tabler:arrows-diff
    - title: Garantia de consistência de lote
      description: A 50ª unidade corresponde à 1ª amostra aprovada. As especificações aprovadas são congeladas, os parâmetros do material e do processo são bloqueados e os pontos de verificação no processo verificam a consistência em toda a produção.
      icon: tabler:repeat
    - title: Transparência de entrega e capacidade
      description: Os prazos de entrega são cotados com base na capacidade de produção real, nos níveis de estoque de materiais e na carga atual dos pedidos – e não nas metas aspiracionais. Cronograma de produção com datas de marcos fornecidas por pedido.
      icon: tabler:calendar-stats

