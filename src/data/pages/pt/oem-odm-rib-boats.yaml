faq:
  title: RIB OEM/ODM — Perguntas frequentes
  questions:
    - q: Qual é a diferença entre OEM e ODM para barcos RIB?
      a: 'OEM (Fabricação de Equipamento Original): você fornece especificações detalhadas e nós construímos seu projeto. ODM (Original Design Manufacturing): você seleciona uma plataforma Aquafarer RIB comprovada e nós a personalizamos com os recursos e marca desejados. ODM é mais rápido e de menor custo; OEM oferece máximo controle de projeto.'
    - q: Posso personalizar o formato e o tamanho do casco do RIB?
      a: Sim. Oferecemos modificações semipersonalizadas em moldes de casco existentes (diferentes layouts de convés, configurações de tubos) e desenvolvimento de casco totalmente personalizado com novos moldes usinados em CNC. Projetos semipersonalizados podem começar com 2 a 5 unidades; a personalização completa normalmente requer compromissos mais elevados.
    - q: Quais materiais de tubo estão disponíveis para RIBs personalizados?
      a: Oferecemos PVC de 0,9 a 1,2 mm para uso recreativo e comercial leve e Hypalon/CSM de 1,4 a 1,7 mm para aplicações profissionais, de resgate e comerciais que exigem resistência superior a UV e ozônio (vida útil de 10 a 15 anos versus 5 a 8 anos para PVC).
    - q: Você pode configurar RIBs para aplicações específicas como resgate, mergulho ou pesca?
      a: Sim. Mantemos modelos de configuração comprovados para aplicações de resgate/patrulha, apoio ao mergulho, turismo/fretamento, pesca, concurso de iates e barcos de trabalho profissionais. Cada modelo inclui tipo de casco recomendado, material do tubo, layout do convés e equipamento – que então personalizamos de acordo com suas necessidades exatas.
    - q: Quais informações você precisa para uma cotação RIB OEM/ODM?
      a: Aplicação alvo, comprimento desejado do casco, preferência de material do tubo (PVC ou Hypalon), quantidade aproximada e cronograma de entrega, requisitos de conformidade do mercado alvo e quaisquer produtos ou especificações de referência. Quanto mais detalhes você fornecer, mais rápida e precisa será nossa cotação.
    - q: Qual é o MOQ para barcos RIB personalizados?
      a: Para moldes de casco existentes com modificações padrão, o MOQ começa em 2 a 5 unidades por projeto. Para moldes personalizados e desenvolvimento totalmente personalizado, o MOQ depende da complexidade do projeto – normalmente 10-20 unidades para semi-personalizados e 30+ para totalmente personalizados com novas ferramentas.
    - q: Quem é o dono dos moldes e desenhos personalizados?
      a: Os moldes desenvolvidos usando designs de base Aquafarer permanecem propriedade da Aquafarer. Moldes totalmente personalizados encomendados e pagos pelo cliente podem ser atribuídos à propriedade do cliente de acordo com os termos do contrato. Todos os termos de propriedade do molde são documentados antes do início do projeto.
    - q: Como os RIBs personalizados são embalados para exportação?
      a: 'Padrão: berço personalizado + embalagem extensível para carregamento de contêineres. Premium: embalagens prontas para varejo, embaladas a vácuo ou paletizadas. Oferecemos remessa FOB Qingdao, CIF e DDP. Documentação completa de exportação e desembaraço aduaneiro incluídos.'
