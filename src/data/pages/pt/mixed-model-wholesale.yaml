hero:
  tagline: Atacado de Modelos Mistos
  title: Modelos mistos de paddle boards no atacado —<br />Misture SUP Diferentes Modelos em Uma Ordem
  subtitle: Por que limitar seu orçamento a um único modelo? Combine qualquer SUP prancha disponível — edições all-around, touring, surf e art — em um único pedido de atacado, com um total de apenas 5 pranchas.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Uma ordem mista de diferentes SUP modelos de tábuas infláveis de Paddle Board Overstock
direct_answer: O atacado de modelos mistos permite que um pequeno varejista faça vários SUP pedidos diferentes em uma única remessa consolidada, em vez de uma quantidade em grande quantidade de uma única placa. Paddle Board Overstock Em , quaisquer modelos em estoque podem ser combinados, o mínimo de pedidos é de 5 placas no total, e a quantidade total determina o escalão de preços. Pedidos mistos são enviados de Weihai, China, por frete aéreo expresso (1–3 tábuas) ou frete marítimo consolidado (5–20 tábuas) para 50+ países, e cada prancha é 100% testada por pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Misture quaisquer SUP modelos em estoque em uma única ordem — sem mínimos por modelo
  - A quantidade total do pedido (não quantidade por modelo) define seu nível de preços
  - Comece com 5 tábuas no total — feitas para pequenos varejistas, não para cargas de contêineres
  - 'Uma remessa consolidada: um custo de frete, um desalfandega e uma entrega'
why_mixed:
  tagline: Por que misto?
  title: Misture e combine. Compre mais variedade. Gaste menos.
  subtitle: Uma prateleira de pranchas idênticas atende um tipo de remador. Um pedido misto transforma o mesmo orçamento em uma linha completa de produtos.
  items:
    - title: Mais variedade na sua prateleira
      description: Combine pranchas para iniciantes, pranchas de turismo para aventureiros e pranchas estilo surf para riders — um pedido cobre toda a sua faixa de clientes.
    - title: Menor Risco por Modelo
      description: Em vez de apostar sua temporada em um modelo, peça 2 a 4 de cada. Se um modelo vender mais que o demais, reabasteça no próximo pedido com dados reais de vendas.
    - title: Teste o que vende no seu mercado
      description: Cada praia, lago e cidade tem demanda diferente. Uma primeira encomenda mista é a pesquisa de mercado mais barata — estoque seis modelos, veja quais se vendem.
    - title: Margens Melhores nas Edições de Arte
      description: Tabuleiros premium da série art (Leviathan Wake, Medusa Glow, Ocean Voyager) têm preços mais altos. Misture alguns em uma base de pranchas completas para aumentar sua margem média.
    - title: Uma Remessa Consolidada
      description: Um pedido misto significa uma reserva de frete, uma despacho alfandegário e uma entrega — em vez de cinco remessas separadas de cinco fornecedores distintos.
how_it_works:
  tagline: Como funciona
  title: Como funciona uma ordem mista de modelos
  steps:
    - title: Escolha Sua Mistura
      description: Escolha os modelos e quantidades para o seu mercado — ou use o seletor abaixo para criar uma combinação e ver ao vivo a atualização da contagem e do valor total.
    - title: Solicite uma Cotação
      description: Envie a mistura para nós. Confirmamos o estoque atual para cada modelo e estimamos o preço unitário, além das opções de frete expresso e marítimo para o seu país.
    - title: Confirme a ordem
      description: Aprove a cotação final — modelos, quantidades, frete, total. Nós bloqueamos o estoque e programamos o despacho de Weihai.
    - title: Testamos Cada Prancha
      description: Cada prancha no seu pedido misto é 100% testada sob pressão a 15 PSI antes da embalagem — o mesmo padrão para todos os modelos, seja um modelo iniciante versátil ou uma edição artística.
    - title: Uma Entrega na Sua Porta
      description: O pedido misto completo é enviado junto — transporte aéreo expresso para pedidos pequenos, frete marítimo consolidado para 5–20 pranchas — com rastreamento porta a porta.
