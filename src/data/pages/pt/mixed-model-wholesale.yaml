who_benefits:
  tagline: Quem Pode se Beneficiar
  title: Para Quem é o Atacado de Modelos Mistos
  items:
    - title: Importadores de Primeira Viagem
      description: Testando a categoria SUP com uma variedade de modelos em vez de se comprometer com um único SKU em lote.
    - title: Varejistas de Praia Sazonais
      description: Lojas que precisam de pranchas iniciais para turistas e edições premium para locais — no mesmo pedido de reposição.
    - title: Vendedores Online
      description: Listando vários modelos de uma vez para descobrir qual arte, comprimento e uso converte melhor.
    - title: Frotas de Aluguel e Escolas
      description: Frotas que precisam de tamanhos de prancha variados para diferentes pesos de praticantes e tipos de aula, não uma frota de especificação única.
faq_section:
  title: FAQ de Modelos Mistos
  items:
    - q: Existe uma quantidade mínima por modelo?
      a: Não. O mínimo de 5 pranchas se aplica ao pedido total, não a cada modelo. Você poderia pedir 5 modelos diferentes, uma prancha de cada.
    - q: Misturar modelos altera o preço?
      a: O preço unitário de atacado é cotado por modelo, mas seu nível de preço melhora com a contagem total de pranchas — misturar modelos não causa penalização.
    - q: Posso misturar pranchas e acessórios?
      a: Sim — remos extras, bombas e kits de reparo podem ser adicionados a um pedido misto. Pergunte na sua consulta.
    - q: Como sei quais modelos se adequam ao meu mercado?
      a: Envie-nos uma nota sobre seus clientes (litorâneos ou do interior, turistas ou locais, iniciantes ou praticantes) no formulário de consulta e recomendaremos uma combinação.
