testimonial:
  quote: O que diferencia Aquafarer é a ciência dos materiais. Eles não apenas montam componentes — eles projetam internamente os compostos PVC, os parâmetros de soldagem e a disposição estrutural. Essa integração vertical fica evidente no produto final.
  author: Parque David
  title: Gerente de Desenvolvimento de Produto
  company: Bluewater Sports Equipment
  location: Austrália
sections:
  - title: Núcleo de ponto solto
    standard: Pressão operacional de 12-15 PSI
    description: Milhares de fios internos de poliéster conectam as camadas superior e inferior, criando uma estrutura rígida de 12-15 PSI. Esta é a mesma tecnologia usada em pranchas de remo profissionais e barcos de corrida infláveis. Nossa densidade de ponto gota é otimizada por modelo para o equilíbrio ideal entre rigidez e peso.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Diagrama do núcleo drop-stitch
  - title: Grau Marítimo PVC
    standard: Soldado por fusão | Testado contra UV/água salgada/abrasão
    description: Tecido laminado multicamadas PVC classificado para ambientes marinhos. Cada camada é soldada por fusão em vez de colada, eliminando riscos de delaminação. Testado quanto à resistência UV (ASTM G154, mais de 1.000 horas), corrosão em água salgada (ISO 9227) e abrasão (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: Camada de PVC
  - title: Hypalon Tubos
    standard: CSM borracha | Resistente a UV/produtos químicos/temperaturas extremas
    description: Usada nos modelos RIB, a borracha Hypalon (CSM) oferece resistência superior a UV e produtos químicos em comparação com o padrão PVC. Hypalon os tubos mantêm a flexibilidade em temperaturas extremas e resistem à degradação causada pela exposição ao combustível e ao óleo. Todas as costuras são feitas à mão por técnicos certificados.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Piso do convés de ar
    standard: Inflável de alta pressão | Substitui madeira compensada/alumínio
    description: Sistema de piso inflável de alta pressão que substitui os tradicionais pisos de compensado ou ripas de alumínio. Reduz o tempo de configuração, o peso total e o volume de armazenamento, ao mesmo tempo que fornece rigidez adequada para ficar em pé, pescar e caminhar. Testado para suportar carga distribuída de mais de 200 kg.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Piso de ar (Air Deck)
