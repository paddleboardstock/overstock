testimonial:
  quote: O que me conquistou foi a construção. Costuras soldadas por fusão em vez de cola, um núcleo drop-stitch que parece sólido a 15 PSI, e sem instabilidade quando recuo para girar. Dois anos depois, nenhum problema.
  author: Marta Keller
  title: Comprador verificado
  company: Remadora de passeios em lago
  location: Alemanha
sections:
  - title: Drop-Stitch Núcleo
    standard: Pressão operacional de 12-15 PSI
    description: Milhares de fios internos de poliéster conectam as camadas superior e inferior, criando uma estrutura rígida a 12-15 PSI. Esta é a mesma tecnologia usada em pranchas de paddle profissionais. Nossa densidade drop-stitch é otimizada por modelo para o equilíbrio ideal entre rigidez e peso.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagrama do Núcleo DS
  - title: Grau Marítimo PVC
    standard: Soldado por fusão | Testado contra UV/água salgada/abrasão
    description: Tecido laminado em múltiplas camadas PVC classificado para ambientes marinhos. Cada camada é soldada por fusão em vez de colada, eliminando riscos de delaminação. Testado para resistência a UV (1.000+ horas), corrosão por água salgada e abrasão.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Camada PVC
  - title: Sistema de Deck EVA
    standard: Padrões artísticos confortáveis e aderentes
    description: Espuma de deck completo EVA proporciona aderência, amortecimento e o visual característico da série art. Painéis cortados com precisão são colocados em padrões sem costura — sem gráficos impressos para descascar, sem necessidade de cera.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Deck EVA
  - title: Sistema de Rail de Três Camadas
    standard: Fusão ligada | Superconstruído na zona de maior tensão
    description: As bandas do trilho são ligadas por fusão em três camadas e envolvidas na borda da prancha — a zona de maior tensão em qualquer inflável. É aqui que pranchas baratas falham primeiro; as nossas são superconstruídas.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistema de Trilho
