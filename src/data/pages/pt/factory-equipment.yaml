hero:
  tagline: Equipamento
  title: Equipamentos e Máquinas de Manufatura
  subtitle: Equipamentos de nível industrial em corte, soldagem, impressão e montagem
  back_label: De volta à Fábrica
  back_link: /factory
categories:
  - title: Corte e Preparação de Materiais
    items:
      - name: Máquina de Corte Automática PVC
        spec: CNC- controlado, 6,5 m × 2,5 m, 0,1 mm de precisão
        desc: Máquina automática de corte controlada por computador para PVC e drop-stitch tecidos. O software de aninhamento otimiza a utilização de materiais para menos de 5% de desperdício.
      - name: Espalhador de Tecidos
        spec: 3 m de largura máxima, alimentação controlada por tensão
        desc: Coloca o tecido em uma ou várias camadas com tensão controlada para evitar distorções antes do corte.
  - title: Soldagem e colagem
    items:
      - name: Máquina de Selagem a Quente
        spec: Soldagem a ar quente, variável 200–600 °C, 0,5–5 m/min
        desc: Máquina de vedação térmica a ar quente para colagem e PVC soldagem de laminados, bandas de trilhos e emendas de câmara. Usada para aderência, vedação e drop-stitch fusão de juntas de núcleo.
      - name: Prensa RF Dielétrica
        spec: 15 kW, placa 2000 × 600 mm
        desc: Prensa de soldagem por radiofrequência para emendas longitudinais principais, juntas de transom-tubo e fabricação em grandes câmaras.
      - name: CNC- Soldador RF Controlado
        spec: 8 kW, tabela XY 2500 × 1200 mm
        desc: Soldagem programável com costura curva para geometrias complexas, relevo de logotipo e patchwork de precisão.
  - title: Arte e Acabamento do Deck
    items:
      - name: EVA Máquina de Corte de Convés
        spec: CNC Corte com faca, 2 m de largura
        desc: Corte preciso de EVA painéis de espuma para deck para padrões de deck da série Art. Cada painel é cortado no formato para um encaixe integral integral sem costuras.
      - name: Prensa de Laminação de Deck
        spec: Controle de temperatura e pressão
        desc: Fixa EVA os painéis do deck à superfície da tábua com aderência consistente em toda a área do deck.
  - title: SUP Impressão e Decoração
    items:
      - name: Impressora Digital
        spec: Jato de tinta de alta resolução, até 2 m de largura de impressão
        desc: Impressão digital direta em tecido para gráficos de convés em cores completas SUP. Imprime padrões personalizados, gradientes e imagens com qualidade fotográfica usando tintas à base de água resistentes a UV.
      - name: Máquina de Serigrafia
        spec: Registro manual e semi-automático de várias cores
        desc: Serigrafia para logos de pranchas SUP, marcas de marca e padrões repetidos. Proporciona impressões duráveis e opacas com saturação de cor vibrante.
  - title: Montagem Final
    items:
      - name: Estação de Torque de Válvulas
        spec: Teste de função calibrado com 10 ciclos
        desc: Instala e aperta válvulas de inflação, depois testa cada válvula em 10 ciclos de abertura/fechamento.
      - name: Ajustador de Caixa de Quilha & D-Ring
        spec: Alinhamento por gabarito, adesivo curado
        desc: Posiciona e fixa caixas de quilha, D-rings e alças nos locais exatos do convés de acordo com a especificação do modelo.
  - title: Testes & Controle de Qualidade
    items:
      - name: Testador Universal de Tração
        spec: Capacidade de 50 kN
        desc: Teste de força de ruptura, alongamento na ruptura e propagação de rasgo para lotes de tecido.
      - name: Rig de Teste de Retenção de Ar
        spec: Programável, manutenção de pressão de 30 min
        desc: Teste automatizado de manutenção de pressão para cada câmara de tubo antes da montagem.
      - name: Testador de Desprendimento de Costura
        spec: Desprendimento motor 180° a 100 mm/min
        desc: Teste da resistência de costuras soldadas e coladas de acordo com protocolo interno.
      - name: Câmara de Envelhecimento Xenon-Arc
        spec: Exposição de 2000 h
        desc: Teste de resistência UV para alteração de cor e retenção de resistência.
