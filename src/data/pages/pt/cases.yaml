features3_cases:
  tagline: Casos em destaque
  title: Soluções personalizadas<br />Para desafios reais
  isBeforeContent: false
  columns: 3
  items:
    - title: Atualização de operações diárias do Bali Diving Center
      customer: Centro de Mergulho Oceano Azul
      country: Indonésia
      industry: Centro Comercial de Mergulho
      challenge: O Blue Ocean Diving Center em Bali operava um antigo barco de mergulho de fibra de vidro com espaço limitado no convés, difícil embarque para mergulhadores e alta manutenção em condições tropicais de água salgada. O carregamento do equipamento estava lotado, o tempo de preparação era longo e a plataforma instável criava preocupações de segurança para os turistas internacionais – incluindo mergulhadores iniciantes e viajantes mais velhos. O centro realiza de 3 a 5 viagens de mergulho diariamente, mais de 200 dias por ano.
      solution: Paddle Board Overstock forneceu um mergulho profissional personalizado RIB de 6,8 m com layout de convés expandido otimizado para armazenamento de equipamentos de mergulho, ampla escada de mergulho em aço inoxidável, tubos Hypalon resistentes para resistência a UV e água salgada, superfície de convés antiderrapante e solução de armazenamento de tanque. A configuração foi projetada em torno do fluxo de trabalho diário do centro de mergulho – e não baseada em um layout padrão de barco de recreio.
      product: Mergulho Profissional de 6,8m RIB
      results: A área de trabalho maior melhorou a eficiência da preparação do equipamento. Os mergulhadores experimentaram um embarque mais seguro e fácil. Os requisitos de manutenção foram reduzidos significativamente. O centro ganhou capacidade para atender mais clientes durante a alta temporada com maior confiança. O RIB tornou-se a base das operações diárias de mergulho.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Nosso barco de mergulho não é apenas transporte. É a base da nossa operação diária. Paddle Board Overstock RIB dá à nossa equipe mais confiança ao realizar diversas viagens de mergulho todos os dias.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Profissional RIB Atualização
      customer: Centro de Mergulho Ocean Explorer
      country: Tailândia
      industry: Centro Comercial de Mergulho
      challenge: O Ocean Explorer Diving Center em Phuket, Tailândia, precisava atualizar um barco de mergulho tradicional de fibra de vidro que não conseguia acompanhar a crescente demanda dos clientes. O espaço limitado no convés tornou a preparação do equipamento ineficiente. O embarque difícil criou desafios de segurança para os turistas internacionais. Os elevados requisitos de manutenção em condições tropicais de água salgada aumentaram os custos operacionais. O centro opera várias viagens diárias, mais de 200 dias por ano.
      solution: Paddle Board Overstock entregou um mergulho comercial personalizado de 6,8 m RIB com layout de convés de trabalho otimizado para armazenamento de tanques de mergulho, preparação de equipamentos e movimentação de mergulhadores. Os recursos incluíam ampla escada de mergulho com corrimãos de aço inoxidável, construção em tubo resistente com materiais resistentes a UV, piso antiderrapante, solução de armazenamento de tanque, console profissional e assento de passageiro – tudo configurado para operações de mergulho comercial.
      product: Mergulho Comercial 6,8m RIB
      results: A maior área do convés permitiu uma organização mais rápida do equipamento e um fluxo de trabalho diário mais eficiente. O conforto e a segurança no embarque do cliente melhoraram significativamente. O tempo de inatividade para manutenção diminuiu com a construção de nível marítimo. O centro de mergulho poderia atender mais clientes durante a alta temporada e expandir os serviços de mergulho profissional com confiança.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Para um centro de mergulho, o barco não é apenas um meio de transporte. É uma parte importante da nossa operação diária. Paddle Board Overstock RIB dá à nossa equipe confiança para realizar diversas viagens de mergulho todos os dias com maior segurança e eficiência.
      icon: tabler:lifebuoy
    - title: Frota do Centro Europeu de Mergulho
      customer: Centros de mergulho BlueMed
      country: Grécia
      industry: Mergulho e Turismo Marítimo
      challenge: Foram necessários 12 RIBs configurados para mergulho para uma cadeia de centros de mergulho em várias ilhas gregas. Cada barco precisava de uma escada de mergulho personalizada, armazenamento para 8 tanques e uma plataforma estável para entrada de mergulhadores em águas abertas. A frota precisava chegar em até 60 dias para o início da temporada turística.
      solution: Produzidos 12 modelos RIB 520 Dive com racks de tanque integrados, escadas de mergulho e tubos Hypalon extra-largos para estabilidade no embarque. Cada barco foi marcado com a pintura da frota do cliente. Todos os 12 barcos foram testados sob pressão e enviados de Qingdao em 55 dias.
      product: RIB 520 Mergulho
      results: Todos os 12 barcos entregues a tempo para a temporada turística. A frota está em operação diária há mais de 18 meses, sem nenhuma falha de material. O cliente encomendou 6 unidades adicionais no segundo ano.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: O RIB 520 Dive tem sido a espinha dorsal de nossas operações diárias de mergulho. A estabilidade em repouso é excelente e o layout de armazenamento do tanque mantém o convés limpo e seguro para os nossos hóspedes.
      icon: tabler:lifebuoy
    - title: Programa Distribuidor Australiano OEM
      customer: Pacific Watersports Pty Ltd
      country: Austrália
      industry: OEM/ODM Fabricação
      challenge: O distribuidor australiano precisava de uma linha de placas SUP de marca própria com preços competitivos para competir com as marcas chinesas de venda direta ao consumidor. São necessários 8 modelos exclusivos, abrangendo do iniciante ao avançado, com gráficos personalizados, embalagens personalizadas e atendimento direto para pontos de venda.
      solution: Desenvolvidos 8 modelos SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) com pacote gráfico australiano exclusivo. Embalagem de varejo personalizada com códigos QR vinculados a vídeos de configuração. Logística de envio direto configurada de Qingdao direto para lojas de varejo australianas.
      product: Linha SUP personalizada (8 modelos)
      results: Conceito para primeira remessa em 90 dias. Taxa de sell-through no varejo de 85% na primeira temporada. O distribuidor expandiu a parceria para incluir a linha de barcos infláveis ​​no segundo ano.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock entregou uma linha SUP completa em 90 dias — desde o projeto inicial até o varejo. A qualidade corresponde às marcas que vendem pelo dobro do preço.
      icon: tabler:arrows-exchange
    - title: Fornecimento de barcos de resgate no Oriente Médio
      customer: Autoridade Nacional de Defesa Civil
      country: Emirados Árabes Unidos
      industry: Busca e resgate
      challenge: A organização de defesa civil precisava de 20 RIBs prontos para patrulha para busca e resgate costeiro, segurança portuária e resposta a enchentes. Convés de auto-resgate necessários, suítes de navegação completas (GPS, radar, VHF), tubos laranja de alta visibilidade e conformidade com os regulamentos marítimos locais.
      solution: Fornecidos 20 RIB modelos Patrol 450 com decks auto-suficientes, suítes de navegação Garmin, holofotes LED, fita reflexiva SOLAS e tubos laranja Hypalon de alta visibilidade. Cada barco foi certificado CE e testado de acordo com os padrões ISO 6185. O pacote de documentação incluía certificados de conformidade para registro local.
      product: RIB Patrulha 450
      results: Frota implantada em 5 estações costeiras. Os barcos têm operado sob calor extremo (45°C+) sem degradação dos tubos. O alcance da patrulha e a eficiência de combustível excederam as especificações em 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: A Patrulha RIB 450 excedeu nossos requisitos operacionais. Em condições extremas de calor, os tubos Hypalon não apresentam sinais de degradação UV após 24 meses de uso diário.
      icon: tabler:alert-triangle
    - title: Parceria de Marca Europeia OEM
      customer: Equipamento Marítimo do Mar do Norte BV
      country: Holanda
      industry: OEM/ODM Fabricação
      challenge: A marca marítima europeia estabelecida queria expandir-se para o mercado RIB sem investir em instalações de produção. Precisava de um parceiro de marca branca capaz de produzir 5 modelos RIB (3,9m a 6,2m) com marca própria, certificação CE e direitos de distribuição exclusivos na UE.
      solution: Estabelecido acordo de fabricação de marca branca para modelos 5 RIB. Cada modelo é marcado com logotipos de clientes e esquema de cores. CE documentação de certificação preparada para cada modelo. Direitos exclusivos de distribuição na UE concedidos com compromissos de pedido mínimo. Documentação técnica e catálogo de peças de reposição fornecidos para rede de serviços local.
      product: Linha RIB personalizada (5 modelos)
      results: Acordo plurianual assinado. Primeira tiragem de produção de 50 unidades enviadas em 75 dias. Marca lançada na METSTRADE com recepção positiva dos revendedores.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Trabalhar com a Paddle Board Overstock nos permitiu entrar no mercado RIB sem construir uma fábrica — eles entregaram uma solução completa e pronta para uso com certificação CE e documentação de suporte do revendedor.
      icon: tabler:building
    - title: Frota de resorts caribenhos
      customer: Paradise Island Resorts Ltda
      country: Bahamas
      industry: Turismo Marítimo e Hotelaria
      challenge: 'O resort de luxo precisava de uma frota completa de equipamentos para esportes aquáticos para as atividades dos hóspedes: 40 SUP pranchas para visitas guiadas, 20 caiaques para exploração da lagoa, 10 barcos infláveis ​​para transferências de hóspedes e excursões de pesca, além de acessórios. Todos os equipamentos precisavam de uma marca de resort personalizada e deveriam ser entregues antes da alta temporada turística.'
      solution: 'Produzido pacote completo de esportes aquáticos: 40 pranchas SUP Voyager (modelo All-Around), 20 caiaques Explorer, 10 barcos infláveis ​​AirDeck 360, além de PFDs, remos, bombas e kits de reparo. Todos os equipamentos estampados com logotipo do resort e esquema de cores tropicais. Remessa em contêiner com manifesto de inventário completo.'
      product: Pacote completo de esportes aquáticos (mais de 70 unidades)
      results: A frota chegou 6 semanas antes da alta temporada. As pontuações de satisfação dos hóspedes com atividades de esportes aquáticos aumentaram 40% ano após ano. O equipamento durou 3 temporadas apenas com manutenção de rotina.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: A abordagem de pacote completo significou que recebemos tudo o que precisávamos em uma única remessa – pranchas, caiaques, barcos e acessórios, todos de marca e prontos para uso dos hóspedes. Nossos hóspedes adoram a qualidade do equipamento.
      icon: tabler:beach
    - title: Centro de Mergulho Comercial de Queensland RIB Atualização
      customer: Centro Comercial de Mergulho
      country: Austrália
      industry: Mergulho Comercial e Serviços Marítimos
      challenge: Um centro de mergulho comercial com sede em Queensland, especializado em inspeção de infraestrutura marítima, manutenção portuária e projetos de reparos subaquáticos, operava um antigo barco de trabalho. À medida que a demanda do projeto crescia, a antiga embarcação tornou-se um problema — a manutenção frequente causava interrupções no cronograma, o layout não foi projetado para operações modernas de mergulho (espaço limitado para cilindros, ferramentas e equipamentos) e o conforto da tripulação durante operações longas era ruim. A empresa precisava de uma embarcação que pudesse apoiar as suas operações profissionais todos os dias úteis.
      solution: Paddle Board Overstock conduziu uma análise operacional detalhada do fluxo de trabalho de mergulho do cliente, duração típica do projeto, tamanho da tripulação e requisitos de equipamento. Com base nesta análise, Paddle Board Overstock entregou um profissional personalizado RIB com um layout de convés funcional otimizado para preparação de equipamentos e movimentação do mergulhador, assentos profissionais para períodos de transporte mais longos, estabilidade aprimorada para entrada e saída mais segura do mergulhador e recursos de apoio ao mergulho integrados ao projeto.
      product: Mergulho Profissional Personalizado RIB
      results: O novo RIB tornou-se uma plataforma de trabalho diária confiável. A preparação dos equipamentos ficou mais rápida com o layout otimizado. A tripulação relatou maior conforto e segurança durante operações longas. A aparência profissional do barco fortaleceu a confiança do cliente ao trabalhar com operadores portuários e empreiteiros marítimos. O centro de mergulho ganhou uma embarcação à altura do profissionalismo do seu serviço.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Precisávamos de um barco que pudesse apoiar o nosso negócio todos os dias, e não apenas uma embarcação para transporte. Paddle Board Overstock trabalhou conosco para entender nossos requisitos operacionais e entregou uma solução RIB que se adapta ao nosso fluxo de trabalho de mergulho comercial.
      icon: tabler:lifebuoy
    - title: Contrato de Patrulha Costeira dos EUA
      customer: Agência de Segurança Costeira Atlântica
      country: Estados Unidos
      industry: Segurança Marítima e Aplicação da Lei
      challenge: A agência de segurança costeira dos EUA exigiu RIBs de patrulha pesada para operações de interceptação em águas abertas. Necessária configuração de dois motores para redundância, console blindado para proteção da tripulação, eletrônicos de especificação militar (comunicações criptografadas, FLIR, radar) e conformidade com os regulamentos da Guarda Costeira dos EUA.
      solution: Patrulha RIB 600 projetada com configuração externa dupla 115 HP, console blindado com proteção balística, imagem térmica FLIR, comunicações VHF/UHF criptografadas e pontos de montagem de armas integrados. Casco reforçado para manobras de interceptação em alta velocidade. Todos os componentes eletrônicos integrados e testados na fábrica. USCG documentação de conformidade fornecida.
      product: RIB Patrulha 600 (motor duplo)
      results: Os barcos atingiram velocidade máxima de 52 nós durante os testes de aceitação. A Agência relatou uma taxa de prontidão para a missão de 95% nos primeiros 12 meses. Pedido adicional feito para 8 unidades.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: O bimotor RIB 600 oferece às nossas tripulações a velocidade e a redundância necessárias para operações de interceptação em mar aberto. O console blindado oferece proteção crítica sem comprometer o desempenho.
      icon: tabler:shield
