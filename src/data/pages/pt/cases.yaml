features3_cases:
  tagline: Featured Stories
  title: Real Boards<br />For Real Adventures
  isBeforeContent: false
  columns: 3
  items:
    - title: From Sofa to Standing on the First Try
      customer: First-Time Paddler
      country: Germany
      industry: Beginner Recreation
      challenge: Anna had never paddled before and was nervous about balance, cold water, and looking foolish in front of others. Living in a small Munich apartment, she also had nowhere to store a hard board and no roof rack for transport.
      solution: The SUP Explorer 11 offers a wide, stable platform that forgives wobbly first strokes. The complete package — board, adjustable paddle, pump, leash, and bag — meant she could carry everything to the lake on foot. From box to water in under 20 minutes, with no experience needed.
      product: SUP Explorador 11
      results: Anna stood up on her very first attempt and paddled for an hour without falling. Two months later she paddles three times a week and has joined a local meet-up group. The board packs into a backpack that fits in her hallway closet.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: I expected to spend my first day swimming next to the board. Instead I was gliding across the lake within minutes — I could not believe how stable it feels.
      icon: tabler:school
    - title: One Board, Two Kids, Zero Complaints
      customer: Family of Four
      country: Italy
      industry: Recreação Familiar
      challenge: Marco and Giulia wanted a summer activity their two kids would actually leave their screens for. Previous cheap inflatables warped, leaked at the seams, and deflated mid-paddle — the kids lost confidence after one bad swim.
      solution: The Tropical Breeze Series brings a full island-vacation canvas — sunshine, coconut groves, and beach scenes — that made the kids want to get on the water. The drop-stitch core runs rigid at 15 PSI, and every board is pressure-tested to 1.25x its rated pressure for 24-48 hours in the factory before it ships.
      product: Tropical Breeze Series
      results: The family now paddles every weekend from June to September. After a full season of kid traffic, the board shows no seam stress or fading. Their daughter has started asking for her own board for her birthday.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: The kids fight over whose turn it is to paddle. After the cheap boards we tried before, this one feels like it is built to survive exactly our family.
      icon: tabler:users
    - title: A Floating Yoga Studio at Sunrise
      customer: Yoga Practitioner
      country: Indonésia
      industry: SUP Yoga & Meditation
      challenge: Putu ensina yoga em Bali e queria levar sua prática para a água, mas suas primeiras tentativas em uma prancha emprestada pareciam escorregadias e instáveis. Manter uma pose enquanto se desliza em águas abertas exige aderência, estabilidade e um design que induza calma.
      solution: A Série Flowing Lotus combina obras de arte de lótus, koi e libélula com uma almofada de tração gravada a laser que mantém mãos e pés ancorados no cachorro inclinado para baixo. O contorno largo ao redor e a espessura de 6 polegadas criam uma plataforma flutuante constante para fluxos e meditação sentada.
      product: Série Lótus Fluindo
      results: Putu agora lidera pequenas aulas de yoga ao nascer do sol SUP duas vezes por semana. Seus alunos reservam com semanas de antecedência, e o quadro se tornou a marca registrada de suas aulas — a arte faz metade do marketing dela.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Praticar na água muda tudo. A prancha é firme o suficiente para a pose do corvo, e o design de lótus faz cada aula parecer um ritual.
      icon: tabler:heart
    - title: Conteúdo que nunca desaparece — literalmente
      customer: Criador de Conteúdo de Viagem
      country: Portugal
      industry: Mídias Sociais e Criação de Conteúdo
      challenge: Miguel grava conteúdo de remo profissionalmente. As placas impressas que ele usava antes perderam a cor em uma estação de água salgada e sol — suas imagens começaram a parecer cansadas, e os seguidores notaram as plataformas do deck descascando
      solution: A Edição Cheetah Surge constrói seu motivo de guepardo a partir de peças em bloco multicoloridas e EVA recortadas, em vez de tinta de superfície. As cores fazem parte da própria espuma, então a água salgada, UV, e o fluxo de pedestres não podem desbotar, descascar ou arranhar o design.
      product: Edição Cheetah Surge
      results: Um ano inteiro de filmagens costeiras depois, o quadro parece totalmente novo nas câmeras. Seus clipes do nascer do sol do Algarve se tornaram seu conteúdo de melhor desempenho até agora, e o próprio quadro aparece em dezenas de colaborações com marcas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Meus quadros antigos envelheceram mais rápido que meu conteúdo. O Cheetah parece idêntico ao primeiro dia depois de um ano no oceano — meus seguidores ficam perguntando qual filtro eu uso. Não é um filtro. É o tabuleiro.
      icon: tabler:camera
    - title: Expedições costeiras de fim de semana
      customer: Remador de Turismo Costeiro
      country: Austrália
      industry: Passeios e Exploração
      challenge: Tom queria remar pelas calmas baías e promontórios da Gold Coast em turnês de várias horas, mas pranchas leves e econômicas se flexionavam na onda e o deixavam exausto após uma hora. Ele precisava de rigidez que pudesse carregar sozinho até pontos de entrada remotos.
      solution: A série Ocean Voyager combina uma arte de tartaruga marinha em azul azul-petróleo profundo e coral com um drop-stitch núcleo rígido que mantém a forma através de leve ondulação costeira. Com cerca de 20 lbs em sua mochila, Tom pode caminhar até praias que nenhum carro alcança, enchê-la com a bomba incluída e passear por horas.
      product: Série Ocean Voyager
      results: Tom agora mapeou onze rotas costeiras, incluindo uma travessia matinal inteira que ele já considerava além de sua habilidade. A tábua permanece rígida do lançamento ao almoço, e o design da tartaruga marinha se tornou sua assinatura reconhecível na água.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Tábuas rígidas parecem tábuas rígidas, e essa carrega como uma mochila. Ela abriu uma costa inteira que eu nunca conseguiria alcançar com carro e trailer.
      icon: tabler:compass
    - title: Fitness Corporal Completo, Zero Taxas de Academia.
      customer: Praticante de Fitness
      country: Canadá
      industry: Fitness & Treinamento
      challenge: Priya queria um treino de corpo inteiro de baixo impacto que não parecesse um treino. Correr machucava seus joelhos, e a academia parecia repetitiva — ela largou todas as rotinas em seis semanas.
      solution: 'A Dolphin Wave Series transformou o exercício em brincadeira: remar queima calorias, fortalece o core e os ombros, e desafia o equilíbrio, tudo isso enquanto passa pela paisagem de Vancouver. O convés estável de 32 polegadas perdoa golpes desajeitados enquanto ainda exige microequilíbrio constante — uma academia disfarçada de prancha de remo.'
      product: Série Dolphin Wave
      results: Priya rema cinco manhãs por semana antes do trabalho e mantém a rotina há 14 meses — seu recorde pessoal de qualquer plano de exercícios de todos os tempos. Amigos agora entram para o clube semanal de remo dela, e seus joelhos nunca estiveram tão felizes.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Nunca precisei me forçar a remar. O treino é real — só parei de notar porque estou ocupado demais aproveitando a água.
      icon: tabler:trophy
    - title: Um Labrador de 30 quilos e um deck muito estável
      customer: Remador com um Cachorro
      country: Estados Unidos
      industry: Remando com Animais de Estimação
      challenge: Jake queria trazer seu Labrador, Biscuit, para a água, mas sua antiga tábua estreita virou um submarino no momento em que o cachorro pulou a bordo. Garras também rasgaram a base barata do convés em poucas semanas.
      solution: A série Leviathan Wake oferece uma plataforma ampla e de alto volume que transporta remador e passageiros de 30 quilos sem se afundar. O EVA convés de tração sobrevive a garras que destruíram sua prancha anterior, e o totem baleia azul dá a Biscuit um "lugar" claramente visível para sentar.
      product: Série Leviathan Wake
      results: Biscuit agora salta a bordo sob comando e cavalga na proa como uma figura de proa. Dois verões depois, o convés não mostra nenhum dano nas garras, e os remos de rio deles se tornaram o conteúdo mais gostado no feed de Jake.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: Comprei uma prancha e peguei um imediato. O deck ignorava tudo que um cachorro grande e molhado podia jogar nele — literalmente.
      icon: tabler:dog
    - title: Orçamento Estudantil, Qualidade de Preço Integral
      customer: Estudante universitário
      country: Polônia
      industry: Estilo de Vida Estudantil
      challenge: Kasia é estudante em Gdansk com orçamento de estudante e rotina de verão no lago. Cada tábua barata que ela encontrava era frágil, feia ou ambos — e tábuas de qualidade custavam mais do que seu orçamento mensal de comida.
      solution: A Série Medusa Glow combina construção premium — drop-stitch núcleo, PSI rigidez 15, arte de água-viva em verde menta montada a partir de blocos recortados EVA — com Paddle Board Overstock preços de liquidação direta de fábrica que pulam todas as margens intermediárias.
      product: Série Medusa Glow
      results: Kasia pagou menos da metade do que placas premium comparáveis vendem localmente. Sua prancha sobreviveu a uma temporada completa de sessões diárias no lago e a uma semana na praia do Báltico, e três colegas encomendaram a sua própria após experimentar a dela.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Eu esperava compromissos orçamentários entre estudantes. Em vez disso, comprei uma placa que meus amigos achavam que custava três vezes mais — e ela durou mais que duas das deles.
      icon: tabler:backpack
    - title: Lançando a partir de uma plataforma estável
      customer: Pescador de fim de semana
      country: Estados Unidos
      industry: SUP Pesca Casual
      challenge: Devon pesca em águas calmas e rasas, muito rasas para qualquer embarcação a motor alcançar. Ele precisava de uma embarcação de remo estável o suficiente para lançar em pé, resistente o bastante para anzóis e equipamentos, e leve o bastante para ser carregada por uma trilha ao amanhecer.
      solution: A Jungle Mandala Series oferece a ele uma plataforma larga e rígida para arremessar, com um deck de hibisco e beija-flor em azul Tiffany que permanece fresco sob o sol da manhã. A prancha se encaixa no tamanho de mochila para a trilha, infla em minutos na beira da água, e a pele reforçada PVC se livra de enredos de ganchos e colisões com nadadeiras.
      product: Série Jungle Mandala
      results: Devon agora alcança três covas de desova que ninguém mais pode pescar. Sua taxa de captura dobrou ao longo da temporada, e a tábua — anzóis, cordão e tudo — ainda parece pronta para mais um verão.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Ficar em pé SUP mudou completamente a forma como eu pesco. Essa prancha é estável o suficiente para lançar, prender o anzol e desembarcar um peixe — tudo isso sem se molhar.
      icon: tabler:fish
