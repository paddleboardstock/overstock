        - Configurações de motor de popa de 4 tempos com baixo consumo de combustível
        - Tubos Hypalon resistentes para longa vida útil em locais remotos
        - Sistema elétrico compatível com energia solar para carregamento fora da rede
        - Layout de deck compacto para 8 a 10 convidados com pegada ambiental mínima
        - Design de fácil manutenção – componentes acessíveis para manutenção local
        - Opções de cores neutras que combinam com o ambiente natural
        - Construção leve para operações em praias e águas rasas
    - title: Operadores Premium de Liveaboard
      subtitle: Safaris de mergulho de vários dias, mergulho de expedição, atóis remotos
      description: 'Os operadores de liveaboard precisam de barcos auxiliares que atendam a diversas funções: transporte de mergulhadores para recifes, transporte de equipamentos, suporte de emergência e excursões de convidados. O RIB deve ser compacto o suficiente para ser armazenado no convés ou rebocado, mas capaz o suficiente para travessias em águas abertas em condições variadas. O lançamento e a recuperação diários exigem uma construção robusta.'
      features:
        - Design compacto (4,5-5,5 m) para armazenamento no convés ou reboque atrás de um liveaboard
        - Casco reforçado para desembarques frequentes na praia e navegação em recifes
        - Opções de tubo de enchimento/esvaziamento rápido para eficiência de armazenamento
        - Escada de mergulhador com perfil baixo para fácil embarque na água
        - Pontos de elevação resistentes para sistemas de lançamento de turcos ou guindastes
        - Alcance de combustível para mais de 50 milhas náuticas entre reabastecimentos
        - Materiais de tubo duráveis ​​resistentes à exposição ao sol, sal e combustível
    - title: Operações de fretamento privado VIP
      subtitle: Ilhas privadas ultraluxuosas, convidados famosos, fretamentos corporativos
      description: O mais alto nível de hospitalidade de resort, onde cada detalhe é personalizado e as expectativas são extremas. O barco deve ser imaculado, silencioso e ter um serviço perfeito. Privacidade, conforto e perfeição estética são fundamentais. Esses clientes não são sensíveis ao preço, mas são excepcionalmente sensíveis à qualidade.
      features:
        - Assentos ultra-premium com costura personalizada e opções de aquecimento
        - Compartimento do motor com isolamento acústico para navegação quase silenciosa
        - Opção de gabinete completo para privacidade e proteção contra intempéries
        - Sistema de entretenimento integrado com alto-falantes de nível marítimo
        - Bar personalizado ou estação de refrescos
        - Banheiro/vestiário de privacidade
        - Estação de tripulação dedicada com comunicações e navegação
        - Conjunto de propostas correspondente — nave-mãe coordenada e apoio RIB
