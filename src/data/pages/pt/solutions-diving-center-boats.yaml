        - Cor do casco e gráficos totalmente personalizados combinando com o resort VI
        - Estofamento premium com paleta de cores de resort coordenada
        - T-top ou guarda-sol com capota rígida e sistema de alto-falantes integrado
        - Escada de mergulho larga com corrimãos para facilitar o embarque em trajes de resort
        - Armazenamento refrigerado para bebidas premium e toalhas
        - Decks em estilo teca EVA para aparência luxuosa e segurança antiderrapante
        - Configuração silenciosa do motor para mínima perturbação sonora
    - title: Resorts boutique de mergulho ecológico
      subtitle: Propriedades à beira-mar, eco-lodges, com foco na sustentabilidade
      description: Propriedades menores em locais costeiros remotos que enfatizam a responsabilidade ambiental e experiências autênticas. Estas estâncias necessitam de barcos fiáveis ​​e de baixa manutenção, que possam operar de forma independente e com apoio técnico limitado. A eficiência de combustível e a durabilidade são mais importantes do que a velocidade máxima. O barco deve refletir o ambiente natural.
