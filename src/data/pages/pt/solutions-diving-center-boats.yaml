      description: Esses resorts atendem a viajantes de alto patrimônio que esperam que cada detalhe reflita luxo. O barco deve corresponder à propriedade – cores personalizadas do resort, marca integrada, assentos premium e proteção total contra o sol não são negociáveis. Os hóspedes costumam fotografar o barco para as redes sociais, tornando-o um ativo visível da marca.
