content_challenge:
  tagline: O desafio
  title: Por que os centros de mergulho precisam de barcos especialmente construídos
  subtitle: As operações de mergulho impõem demandas únicas às embarcações — requisitos que os barcos de uso geral muitas vezes não conseguem atender.
  paragraphs:
    - Os centros de mergulho comerciais operam de 200 a 300 dias por ano, realizando de 3 a 5 viagens de mergulho diariamente. Cada viagem requer o transporte de 10 a 20 tanques de mergulho, equipamento BCD completo, reguladores, nadadeiras, máscaras, equipamentos de segurança, equipamento de instrutor e passageiros. Um barco de uso geral simplesmente não consegue lidar com esta intensidade operacional.
    - '**Espaço limitado no convés** — A maioria dos barcos de recreio são projetados para velocidade e conforto dos passageiros, não para manuseio de equipamentos. Quando tanques, equipamentos e mergulhadores compartilham o mesmo espaço, o tempo de preparação aumenta, o movimento torna-se difícil e os riscos de segurança aumentam.'
    - '**Embarque difícil para mergulhadores** — Turistas internacionais, mergulhadores iniciantes e viajantes mais velhos precisam de entrada e saída fáceis e seguras. Uma posição de embarque elevada, apoio limitado para as mãos e plataformas instáveis ​​criam desconforto e riscos à segurança — especialmente quando os mergulhadores transportam 30 kg de equipamento.'
    - '**Corrosão por água salgada e danos UV** — Ambientes tropicais aceleram a degradação de materiais. Os tubos PVC padrão podem desbotar, vazar e exigir substituição dentro de 3 anos. A corrosão de componentes metálicos aumenta os custos de manutenção e o tempo de inatividade operacional.'
    - '**Estabilidade em repouso** — Os mergulhadores precisam de uma plataforma estável ao se preparar, entrar na água e subir novamente a bordo. A estabilidade insuficiente cria riscos de segurança e impacta negativamente a experiência do cliente.'
    - '**Altos custos operacionais** — A eficiência de combustível é importante ao realizar várias viagens todos os dias. Um barco que consome mais combustível reduz diretamente as margens de lucro. Os operadores comerciais de mergulho se preocupam mais com o custo operacional diário do que com a velocidade máxima.'
content_solution:
  tagline: Nossa solução
  title: Projetado em torno de operações<br />de mergulho reais
  subtitle: Cada Paddle Board Overstock mergulho RIB é configurado para as necessidades específicas dos centros de mergulho comerciais — não adaptados de um projeto de barco de recreio.
  list:
    - Layout de convés de trabalho grande — projetado para armazenamento de tanques de mergulho, preparação de equipamentos e movimentação de mergulhadores, não apenas para assentos de passageiros
    - Sistema de escada de mergulho profissional com corrimãos de aço inoxidável - embarque largo e baixo para entrada e saída fácil e segura do mergulhador
    - Tubos extralargos Hypalon ou PVC — proporcionam uma plataforma de embarque estável e melhoram a flutuabilidade quando os mergulhadores se movimentam pelo convés
    - Racks de armazenamento de tanques integrados — mantêm o peso baixo, o convés limpo e o equipamento organizado para um retorno mais rápido da viagem
    - Superfície do convés antiderrapante EVA — reduz o risco de escorregamento quando o convés está molhado e os mergulhadores estão se movendo com equipamentos pesados
    - Console posicionado para visibilidade clara dos mergulhadores na água – fundamental para monitoramento de segurança do instrutor
    - Opções de motor de 40 HP a 115 HP — configuração simples ou dupla, otimizada para eficiência de combustível em diversas viagens diárias
    - Construção de nível marítimo — materiais de tubos resistentes com resistência aos raios UV e à água salgada, estrutura reforçada para uso comercial diário
    - Configurações personalizadas de escada de mergulho e plataforma — de acordo com a profundidade da água operacional e o perfil do mergulhador
    - Placas de montagem de equipamentos para sonar, GPS e equipamentos de comunicação
