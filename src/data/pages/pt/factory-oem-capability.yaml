services:
  - title: Design e Engenharia de Produto
    description: Nossa equipe interna de P&D trabalha com seu conceito ou especificação para desenvolver desenhos CAD, modelos 3D e protótipos. Oferecemos design de moldes, otimização de formas de casco e orientação na seleção de materiais.
  - title: Branding e Gráficos Personalizados
    description: Impressão digital em cores completas, serigrafia, gravação em relevo e opções de etiquetas. Desenvolvemos gráficos de convés específicos da marca, branding de tubos e embalagem pronta para varejo.
  - title: Personalização de Materiais e Especificações
    description: Escolha entre PVC (padrão, ecológico, retardante de chama), Hypalon/CSM, drop-stitch e construções híbridas. Cores de tubos personalizadas, gramaturas de tecido e opções de reforço.
  - title: Embalagem e Logística
    description: Embalagem de varejo personalizada, caixas de marca própria, embalagem a vácuo, paletização e carregamento de contêiner. Condições de envio FOB Qingdao, CIF ou DDP disponíveis.

