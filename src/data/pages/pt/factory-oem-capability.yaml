hero:
  tagline: Manufatura OEM/ODM
  title: Manufatura OEM e Marca Própria
  subtitle: Do conceito ao contêiner — personalize cada detalhe da sua linha de embarcações infláveis

intro: A Aquafarer oferece serviços abrangentes de OEM e ODM para marcas, distribuidores e órgãos governamentais no mundo todo. Com mais de 10 anos de experiência em exportação e uma fábrica de 12.000 m² certificada ISO 9001 e BSCI, cuidamos de tudo, desde o design do produto e o desenvolvimento de moldes até a produção em escala, embalagem e logística.

