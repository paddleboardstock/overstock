why_us:
  - title: Integração Vertical
    description: Somos proprietários da nossa fábrica, moldes e cadeia de suprimentos — sem intermediários, sem subcontratados. Isso nos dá controle sobre qualidade, custo e entrega.
  - title: Certificação Dupla
    description: Gestão de qualidade ISO 9001 e certificação de conformidade social BSCI. Relatórios de auditoria de fábrica disponíveis mediante solicitação.
  - title: Conformidade CE
    description: Todos os modelos padrão possuem certificação CE 2013/53/EU. Modelos personalizados podem ser certificados CE por meio do nosso processo estabelecido.
  - title: MOQ baixo
    description: Comece com apenas 5 unidades para modelos padrão. Ajudamos marcas em ascensão a lançar sem comprometer excessivamente o estoque.
