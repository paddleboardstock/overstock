label: Garantia
headline: Paddle Board Overstock Garantia Limitada do Fabricante
subtitle: Paddle Board Overstock Garante a qualidade de cada SUP prancha inflável que fabricamos. Esta Garantia Limitada estabelece os termos e a cobertura da sua Paddle Board Overstock prancha.
seo:
  headline: Paddle Board Overstock SUP Garantia — Garantia Limitada de 2 Anos | Paddle Board Overstock
  description: Paddle Board Overstock oferece uma garantia limitada de 2 anos abrangendo drop-stitch emendas, construção dos trilhos, válvulas de inflação e acessórios incluídos em todas SUP as placas. Termos e condições completos.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Esta Garantia Limitada se aplica a Paddle Board Overstock SUP novas pranchas infláveis de marca adquiridas diretamente na Paddle Board Overstock loja online. A data de vigência é a data verificável da compra original.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Cobertura e Duração da Garantia</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anos</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Estrutura do núcleo e do deck</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anos</h3>
          <p class="text-sm text-gray-600 mt-1">Construção de trilhos e costuras</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anos</h3>
          <p class="text-sm text-gray-600 mt-1">Funcionalidade da válvula de inflação</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anos</h3>
          <p class="text-sm text-gray-600 mt-1">Acessórios incluídos (bomba, remo, guia, nadadeira)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 ano*</h3>
          <p class="text-sm text-gray-600 mt-1">Uso comercial, de aluguel ou de frota — todos os componentes</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Uso comercial, alugado ou em frota reduz a garantia para 1 ano. Uso em corridas ou competições anula totalmente a garantia.</p>
    </div>

    <h2>O que é coberto</h2>
    <h3>Drop-Stitch Estrutura do Núcleo e do Deck (2 Anos)</h3>
    <p>O drop-stitch núcleo interno e a estrutura externa da placa são garantidos contra defeitos de fabricação que comprometem a capacidade da placa de manter a inflação e rigidez operacionais.</p>

    <h3>Construção de Ferrovia e Costura (2 anos)</h3>
    <p>As emendas e as faixas de trilho de três camadas, quando unidas durante a fabricação, são garantidas contra defeitos de fabricação que resultam em vazamento substancial de ar através da emenda. Inspeção periódica e manutenção das pressões de inflação adequadas são condições de cobertura.</p>

    <h3>Funcionalidade da válvula de inflação (2 anos)</h3>
    <p>As válvulas de inflação de ar originalmente Paddle Board Overstock instaladas por são garantidas contra defeitos de fabricação em materiais ou mão de obra que impedem a válvula de reter o ar conforme projetado.</p>

    <h3>Acessórios Incluídos (2 Anos)</h3>
    <p>A bomba, pá ajustável, coleira, deriva removível e outros componentes incluídos no seu pacote de prancha são garantidos contra defeitos de material e mão de obra.</p>

    <h2>O que não é coberto</h2>
    <ul>
      <li>Defeitos cosméticos incluindo descoloração, manchas, desbotamento, calcamento ou qualquer alteração na aparência</li>
      <li>Perfurações, cortes, rasgos, rasgos ou outros danos físicos</li>
      <li>Fissuras, rachaduras, abrasão, arranhões ou deterioração por atrito ou contato</li>
      <li>Degradação devido UV à exposição à luz, intemperismo ou condições atmosféricas</li>
      <li>Danos por contato com solventes, ácidos, álcalis ou produtos químicos</li>
      <li>Danos por negligência, uso inadequado, abuso, acidente ou desgaste normal</li>
      <li>Danos por impacto, estresse, suporte inadequado ou transporte</li>
      <li>Danos causados por inflação/deflação inadequada ou uso de dispositivos de inflação não aprovados</li>
      <li>Equipamentos, componentes ou sistemas de terceiros (cobertos por seus respectivos fabricantes)</li>
    </ul>

    <h2>Obrigação e Solução do Fabricante</h2>
    <p>Paddle Board Overstock a única e exclusiva obrigação de S é o reparo ou substituição, a Paddle Board Overstock sua escolha, de qualquer componente considerado defeituoso em materiais ou mão de obra e coberto por esta garantia. Reparos ou substituições são realizados pela Paddle Board Overstock unidade de serviço designada ou por ela. Componentes reparados ou substituídos são garantidos apenas pela parte não expirada do período original de garantia.</p>

    <h2>Condições da Garantia</h2>
    <ul>
      <li><strong>Manutenção:</strong>O produto deve ser mantido de acordo com Paddle Board Overstock as diretrizes publicadas por ', incluindo inspeção periódica e manutenção das pressões de inflação apropriadas.</li>
      <li><strong>Cooperação:</strong>O comprador deve cooperar total e prontamente Paddle Board Overstock em todas as questões relacionadas a reivindicações de garantia.</li>
      <li><strong>Comprador Original:</strong>Essa garantia é estendida exclusivamente ao comprador final original e não é transferível.</li>
    </ul>

    <h2>Uso comercial</h2>
    <p>Se o produto for usado para fins comerciais, de aluguel ou de frota, o período de garantia para todos os componentes é reduzido para um (1) ano a partir da data original de compra. O uso em corridas, competições de velocidade ou resistência anula imediatamente e de forma irreversível a garantia.</p>

    <h2>Como Fazer uma Reclamação de Garantia</h2>
    <p>Contato Paddle Board Overstock com comprovante de compra e uma descrição detalhada do problema.Paddle Board Overstock Revisará a reclamação e fornecerá instruções para inspeção e serviço.</p>
    <p>Para dúvidas sobre serviço de garantia, entre em contato conosco através de nossa<a href="/contact" class="text-sky-600 underline">Página de contato</a>Com o número do seu pedido e detalhes do produto.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Esta declaração de garantia é um resumo da Paddle Board Overstock Garantia Limitada completa do fabricante. O documento legal completo de garantia rege todos os termos e condições da garantia. Especificações sujeitas a alteração sem aviso prévio.Paddle Board Overstock é uma marca de fábrica do Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
