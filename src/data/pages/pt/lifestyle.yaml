hero:
  tagline: Estilo de Vida
  title: O Paddle Board Overstock<br />Estilo de Vida
  subtitle: Construído para quem vive na água — desde exploradores de fim de semana até remadores diários que contam os dias entre as sessões.
values:
  - icon: 🌊
    title: Nascido na Água
    desc: Todo design começa com a compreensão de como a água se comporta. Nós projetamos a partir da borda das condições para o interior — porque o oceano é nosso professor, não nosso local de trabalho.
  - icon: 🔧
    title: Construído para Durar
    desc: O produto mais sustentável é aquele que não precisa ser substituído. Materiais de qualidade marítima, núcleos drop-stitch avaliados em 15 PSI, e costuras que duram mais do que a temporada.
  - icon: 🏆
    title: Acessível por Design
    desc: Esportes aquáticos não devem ser um luxo. Desempenho de nível profissional a um preço que faça sentido para famílias, guias e remadores do dia a dia — não apenas para profissionais.
  - icon: 🌍
    title: Comunidade Global
    desc: 'Da costa de Weihai aos lagos na Europa, rios no Sudeste Asiático e baías nas Américas — nossos clientes compartilham uma coisa: o amor por estar na água.'
  - icon: ♻️
    title: Fabricação Responsável
    desc: Cortes de aninhamento otimizados por CNC reduzem o desperdício de material para menos de 5%. A construção durável reduz os ciclos de substituição. Nós construímos para a longevidade porque essa é a escolha mais sustentável.
  - icon: 🤝
    title: Suporte que Dura
    desc: Pranchas que construímos anos atrás ainda nos procuram por peças de reposição. Nossa resposta de garantia é em média de 24 horas. Não desaparecemos após a venda — estamos aqui durante toda a vida útil do produto.
