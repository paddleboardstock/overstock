content_challenge:
  tagline: O desafio
  title: O turismo marítimo exige<br />Embarcações confiáveis ​​e prontas para os passageiros
  subtitle: Os operadores turísticos precisam de barcos que possam lidar com transferências diárias de passageiros, condições de mar variadas e elevadas expectativas dos hóspedes, mantendo ao mesmo tempo uma manutenção baixa e operações lucrativas.
  paragraphs:
    - Operadores de turismo insular em destinos como Maldivas, Filipinas, Indonésia e Tailândia realizam transferências diárias de passageiros, viagens de mergulho com snorkel e excursões marítimas. Seus barcos operam mais de 300 dias por ano em ambientes de água salgada com tempo mínimo de inatividade para manutenção.
    - '**Transferências em ilhas** exigem transporte rápido e confortável de passageiros entre resorts, aeroportos e locais de mergulho. Os passageiros esperam uma viagem tranquila, embarque fácil e proteção contra sol e respingos. Um barco lento ou desconfortável afeta diretamente a satisfação dos hóspedes e a repetição de reservas.'
    - '**Os operadores de observação de baleias e golfinhos** precisam de barcos que possam alcançar a vida selvagem rapidamente, manter plataformas de observação estáveis ​​e operar silenciosamente para evitar perturbar a vida marinha. Velocidade, estabilidade e manobrabilidade são essenciais – os passageiros esperam encontros próximos sem enjoar.'
    - Empresas de **turismo de aventura** realizam passeios de exploração costeira, excursões em cavernas e experiências com vida selvagem marinha. Seus barcos navegam em ambientes variados – desde mar aberto até enseadas rasas – exigindo projetos de casco versáteis e construção confiável.
    - Em todos os segmentos, a resistência à corrosão, a eficiência de combustível e o conforto dos passageiros são as principais preocupações. Um barco que falha ou requer reparos frequentes significa perda de receita, passeios cancelados e reputação prejudicada.
content_solution:
  tagline: Nossa solução
  title: RIBs para turismo<br />e equipamentos de frota
  subtitle: A Paddle Board Overstock fornece barcos comerciais RIB para operações de passageiros e equipamentos de frota (SUPs, caiaques, infláveis) para programas de atividades em resorts — tudo de um único fornecedor.
  list:
    - RIBs comerciais para passageiros de 4,8 m a 8 m — configurados para transferências de ilhas, passeios de mergulho com snorkel e observação da vida selvagem
    - Assentos confortáveis ​​com encostos e guarda-sol — conforto do passageiro para passeios de 1 a 2 horas
    - Boca larga e casco deep-V para estabilidade — reduz o enjôo e melhora a confiança dos passageiros
    - Opções de motores silenciosos para observação da vida selvagem – perturbação mínima para os animais marinhos
    - Escada de mergulho e plataforma de natação — essenciais para excursões de mergulho com snorkel e natação
    - Marca personalizada e esquemas de cores — logotipo da sua empresa e pintura da frota em todos os navios
    - Preços de frota para pedidos em massa RIB — especificações consistentes em operações com vários barcos
    - SUP pranchas, caiaques e barcos infláveis ​​para programas de atividades de hóspedes em resorts
    - Peças sobressalentes e suporte de manutenção — minimize o tempo de inatividade durante a alta temporada turística
content_segments:
  tagline: Segmentos de Turismo
  title: Soluções de Turismo Marítimo<br />Por Tipo de Operação
  subtitle: Diferentes operações turísticas requerem diferentes configurações de barco. Paddle Board Overstock corresponde ao RIB correto para sua aplicação específica.
  items:
    - title: Operadores de transferência de ilhas
      subtitle: Maldivas, Filipinas, Indonésia, Tailândia — transporte diário de hóspedes
      description: Os operadores de turismo insular no Sudeste Asiático e nas Maldivas realizam transferências diárias de passageiros entre aeroportos, resorts e locais de mergulho – muitas vezes mais de 300 dias por ano. O barco é a espinha dorsal da experiência do hóspede. Uma avaria significa hóspedes retidos, reservas canceladas e danos à reputação. Esses operadores precisam de barcos que sobrevivam ao uso de alta frequência em locais remotos, onde o suporte de manutenção é limitado e as peças são difíceis de obter.
      features:
        - Construção de nível comercial classificada para mais de 300 dias de operação por ano
        - Banco confortável com encosto para 8 a 16 passageiros
        - T-top ou guarda-sol Bimini para proteção solar tropical e respingos
        - Ampla plataforma de embarque para facilitar o acesso dos hóspedes com bagagem
        - Compartimentos de armazenamento secos para malas de hóspedes e provisões do resort
        - Motor de popa de 4 tempos com baixo consumo de combustível — baixo custo operacional por viagem
        - Tubos Hypalon resistentes para vida útil de 5 a 8 anos em condições tropicais
        - Design de fácil manutenção – componentes acessíveis para manutenção em local remoto
    - title: Operadores de observação de baleias
      subtitle: Capacidade offshore, velocidade de visualização, plataforma estável
      description: A observação de baleias é um segmento turístico sazonal, mas de alto valor, que opera em regiões como Hervey Bay (Austrália), Kaikoura (Nova Zelândia), Baja California (México) e Açores. Os operadores devem chegar rapidamente às áreas de observação offshore antes que as baleias mergulhem ou se movam, manter uma plataforma estável durante longos períodos de observação e operar silenciosamente para evitar perturbar os mamíferos marinhos. O conforto dos passageiros durante passeios de 2 a 4 horas afeta diretamente as avaliações e reservas repetidas. Um barco lento ou instável significa avistamentos perdidos e passeios reembolsados.
      features:
        - Configurações de 7-10m RIB para capacidade offshore em águas abertas
        - Motor de popa silencioso de 4 tempos – mínimo ruído e perturbação de vibração
        - Casco Deep-V com excelente estabilidade em repouso – plataforma de visualização confortável
        - Plataforma de observação de proa com corrimão para fotografia de convidados
        - Proteção total contra intempéries — T-top ou console fechado para condições offshore
        - Assento ergonômico projetado para conforto com duração de passeio de 2 a 4 horas
        - Materiais de qualidade marítima para exposição prolongada à água salgada e resistência aos raios UV
    - title: Operadores de observação de golfinhos
      subtitle: Perseguição rápida, capacidade para vários passageiros, abordagem silenciosa
      description: Os operadores de observação de golfinhos necessitam de um equilíbrio diferente de capacidades. Os golfinhos são mais rápidos e brincalhões do que as baleias, exigindo barcos que possam acelerar rapidamente, manobrar com precisão e aproximar-se dos grupos sem assustá-los. Esses passeios normalmente transportam mais passageiros por viagem e operam mais perto da costa. A operação silenciosa é crítica – os golfinhos que se acostumam com motores barulhentos evitarão os barcos, reduzindo o sucesso do avistamento. As operadoras também precisam de barcos confiáveis ​​para programações diárias de múltiplas viagens durante a alta temporada turística.
      features:
        - 5,5-8m RIB para agilidade, velocidade e acesso a águas rasas
        - Aceleração rápida para alcançar grupos de golfinhos ativos
        - Escape silencioso e casco de baixa vibração para aproximação próxima
        - Plataforma estável em repouso para visualização e fotografia dos visitantes
        - Alta capacidade de passageiros (10-18 pessoas) para passeios na alta temporada
        - Área de assento na proa para observação de golfinhos próximos à água
        - Calado raso para operações costeiras e na baía
    - title: Aventura e Turismo Ecológico
      subtitle: Exploração costeira, passeios em cavernas, encontros com vida selvagem
      description: Os operadores de turismo de aventura navegam em diversos ambientes – travessias em oceano aberto, exploração de lagoas rasas, acesso a cavernas costeiras e encontros com vida selvagem marinha. Seus barcos precisam de versatilidade para lidar com condições marítimas variadas, durabilidade para resistir ao uso em locais remotos e calado raso para acessar enseadas protegidas e desembarques em praias. A confiabilidade do equipamento é fundamental – uma pane em um local remoto pode arruinar um passeio e colocar os hóspedes em perigo.
      features:
        - Casco de calado raso para acesso a lagoas, cavernas e praias
        - Casco reforçado e tubos Hypalon para durabilidade em ambientes mistos
        - Assentos flexíveis — reconfiguráveis ​​para diferentes tipos de passeios e tamanhos de grupos
        - Pontos de montagem de equipamentos para equipamentos fotográficos e equipamentos especializados
        - Fácil capacidade de pouso na praia – proteção reforçada da quilha e do tubo
        - Proteção contra intempéries para conforto dos hóspedes durante passeios prolongados
    - title: Frotas de atividades em resorts
      subtitle: Programas completos de esportes aquáticos para hóspedes – RIBs, SUPs, caiaques, segurança
      description: Resorts que oferecem esportes aquáticos como parte da experiência do hóspede precisam de uma frota que equilibre variedade, durabilidade e apresentação da marca. A frota normalmente inclui RIBs para excursões e transferências de hóspedes, SUPs e caiaques para exploração autoguiada e barcos infláveis ​​para passeios de mergulho com snorkel em grupo. O gerenciamento de tipos mistos de equipamentos em volumes sazonais de hóspedes exige qualidade consistente, fácil manutenção e marca unificada. Uma avaria ou desgaste do equipamento afeta diretamente as avaliações e receitas dos hóspedes.
      features:
        - RIB propostas para excursões, traslados e passeios de mergulho com snorkel
        - SUP pranchas e caiaques para atividades autoguiadas dos hóspedes
        - Barcos infláveis ​​para passeios em grupo e mergulho com snorkel da praia aos recifes
        - Marca totalmente personalizada em todos os equipamentos — apresentação unificada do resort
        - 'Pacote de equipamentos de segurança: PFDs, apitos, primeiros socorros, linhas de bóia'
        - Materiais de treinamento de pessoal para manuseio de equipamentos e segurança dos hóspedes
