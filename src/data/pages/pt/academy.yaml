hero:
  tagline: Paddle Board Overstock Academia
  title: Centro de aprendizagem
  subtitle: Guias e tutoriais para todos os níveis de habilidade - desde o básico SUP até técnicas avançadas de resgate
categories:
  - level: Novato
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Básico
        desc: Aprenda os fundamentos do stand-up paddle – postura, técnica de braçada e equilíbrio.
        slug: beginner-sup-guide
      - title: Técnicas de remo
        desc: Golpe para frente, golpe de varredura, golpe de desenho e suporte baixo - domine os movimentos essenciais do remo.
        slug: sup-paddle-guide
      - title: Segurança em primeiro lugar
        desc: Práticas essenciais de segurança, incluindo verificações meteorológicas, uso de PFD, regras de trela e auto-resgate.
        slug: sup-safety-guide
  - level: Intermediário
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Fundamentos de turismo
        desc: Planejando remos de várias horas – navegação, hidratação, ritmo e leitura de previsões de vento.
        slug: touring-sup-guide
      - title: Leitura do tempo
        desc: Interprete previsões marítimas, identifique padrões de nuvens e entenda os efeitos do vento na água.
        slug: weather-planning-water-sports
      - title: Noções básicas de navegação
        desc: Leitura de cartas, uso de bússola, pontos de referência GPS e planejamento de rotas para remo costeiro.
        slug: sup-navigation-guide
      - title: Consciência das Marés
        desc: Compreender os ciclos das marés, as correntes e como eles afetam o tempo de lançamento e a rota.
        slug: understanding-tides
  - level: Avançado
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planejamento de viagem de vários dias
        desc: Logística da expedição – seleção de equipamentos, planejamento alimentar, protocolos de segurança e contatos de emergência.
        slug: sup-travel-guide
      - title: Técnicas de resgate
        desc: Protocolos de auto-resgate, resgate em T e reboque em águas abertas.
        slug: sup-self-rescue
      - title: Remo noturno
        desc: Navegação à noite — requisitos de iluminação, memória de rota, comunicação em grupo e conscientização sobre perigos.
        slug: sup-navigation-guide
  - level: Manutenção
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Limpeza e cuidados
        desc: Enxágue com água doce, proteção UV, prevenção de mofo e técnicas de secagem adequadas após cada sessão.
        slug: inflatable-sup-maintenance
      - title: Guia de armazenamento
        desc: Melhores práticas para armazenamento de pranchas infláveis — esvaziamento, dobra, controle de temperatura e vida útil.
        slug: inflatable-sup-storage
      - title: Noções básicas de reparo
        desc: Corrija pequenos furos, vazamentos de costura e problemas de válvula com kits de reparo PVC e técnicas de remendo.
        slug: inflatable-sup-repair
      - title: Manutenção de válvulas
        desc: Identifique os tipos de válvula (Halkey-Roberts, Boston, Leafield), limpe os detritos e substitua as hastes defeituosas.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centro de Conhecimento
knowledge_center_title: Guias e Conhecimento sobre Stand Up Paddle
knowledge_center_subtitle: Guias especializados e conselhos de compra para remadores de todos os níveis.
knowledge_sections:
  - title: Tecnologia e Construção de Pranchas
    tagline: Por dentro da sua prancha de stand up paddle
    desc: Como as pranchas infláveis são construídas — núcleos drop-stitch, camadas de laminação, decks EVA e testes de pressão na fábrica.
    guides:
      - title: Como as Pranchas de Stand Up Paddle São Feitas
        desc: Desde o corte do material e laminação até testes de pressão 100% — veja como cada prancha sai da fábrica.
        href: /factory/process
      - title: Tecnologia de Núcleo Drop-Stitch
        desc: Como milhares de fios internos criam uma estrutura inflável rígida e de alta pressão.
        href: /learn/drop-stitch-core
      - title: Referência de Materiais
        desc: Classificações de denier PVC, pesos dos tecidos, resistência UV e materiais do deck explicados.
        href: /learn/materials
      - title: Tecnologia de Pranchas Infláveis
        desc: Costuras soldadas, construção do rail e sistemas de válvula que mantêm sua prancha rígida e hermética.
        href: /learn/inflatable-technology
  - title: Guias de Compra
    tagline: Escolha a Prancha Certa
    desc: Tudo o que você precisa para escolher sua primeira — ou próxima — inflável SUP, desde tamanhos até construção.
    guides:
      - title: Como Escolher uma SUP Inflável
        desc: Os fatores chave — construção, espessura, configuração das quilhas e acessórios incluídos.
        href: /guides/how-to-choose-your-sup/
      - title: O Que É Stand-Up Paddle?
        desc: Uma introdução amigável ao esporte, aos equipamentos e por que pranchas infláveis facilitam o início.
        href: /guides/what-is-sup
      - title: Prancha Inflável vs Rígida
        desc: Compare iSUPs e placas de epóxi rígido em termos de portabilidade, durabilidade, desempenho e valor.
        href: /compare/inflatable-vs-hardboard
      - title: Guia de Tamanhos SUP
        desc: Encontre o comprimento, largura e volume corretos da prancha para seu peso, habilidade e estilo de remada.
        href: /size-guide
  - title: Habilidades & Segurança
    tagline: Remar com Confiança
    desc: Conhecimento prático para cada sessão — noções básicas para iniciantes, segurança na água, cuidados e reparos.
    guides:
      - title: SUP Noções Básicas — Guia do Iniciante
        desc: Tudo o que um iniciante precisa saber — tipos de prancha, tamanho do remo, postura e dicas para o primeiro dia.
        href: /v2/beginner-sup-guide
      - title: Essenciais de Segurança na Água
        desc: Verificação do clima, seleção de PFD, regras do leash, auto-resgate e melhores práticas para remar em grupo.
        href: /learn/water-safety
      - title: SUP Manutenção e cuidados
        desc: Limpeza, armazenamento, proteção de UV e dicas de cuidados para pranchas infláveis SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Noções Básicas de Reparo de Pranchas
        desc: Corrija pequenos furos, vazamentos de costura e problemas de válvula com kits de reparo PVC e técnicas de remendo.
        href: /v2/inflatable-sup-repair
