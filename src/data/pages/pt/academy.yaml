hero:
  tagline: Aquafarer Academia
  title: Centro de aprendizagem
  subtitle: Guias e tutoriais para todos os níveis de habilidade - desde o básico SUP até técnicas avançadas de resgate
categories:
  - level: Novato
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Básico
        desc: Aprenda os fundamentos do stand-up paddle – postura, técnica de braçada e equilíbrio.
        slug: beginner-sup-guide
      - title: Técnicas de remo
        desc: Golpe para frente, golpe de varredura, golpe de desenho e suporte baixo - domine os movimentos essenciais do remo.
        slug: sup-paddle-guide
      - title: Segurança em primeiro lugar
        desc: Práticas essenciais de segurança, incluindo verificações meteorológicas, uso de PFD, regras de trela e auto-resgate.
        slug: sup-safety-guide
  - level: Intermediário
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Fundamentos de turismo
        desc: Planejando remos de várias horas – navegação, hidratação, ritmo e leitura de previsões de vento.
        slug: touring-sup-guide
      - title: Leitura do tempo
        desc: Interprete previsões marítimas, identifique padrões de nuvens e entenda os efeitos do vento na água.
        slug: weather-planning-water-sports
      - title: Noções básicas de navegação
        desc: Leitura de cartas, uso de bússola, pontos de referência GPS e planejamento de rotas para remo costeiro.
        slug: sup-navigation-guide
      - title: Consciência das Marés
        desc: Compreender os ciclos das marés, as correntes e como eles afetam o tempo de lançamento e a rota.
        slug: understanding-tides
  - level: Avançado
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planejamento de viagem de vários dias
        desc: Logística da expedição – seleção de equipamentos, planejamento alimentar, protocolos de segurança e contatos de emergência.
        slug: sup-travel-guide
      - title: Técnicas de resgate
        desc: Auto-resgate, T-resgate, resgate de esquimós para caiaques e protocolos de reboque para águas abertas.
        slug: sup-self-rescue
      - title: Remo noturno
        desc: Navegação à noite — requisitos de iluminação, memória de rota, comunicação em grupo e conscientização sobre perigos.
        slug: sup-navigation-guide
  - level: Manutenção
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Limpeza e cuidados
        desc: Enxágue com água doce, proteção UV, prevenção de mofo e técnicas de secagem adequadas após cada sessão.
        slug: inflatable-sup-maintenance
      - title: Guia de armazenamento
        desc: Melhores práticas para armazenamento de pranchas e barcos infláveis ​​– esvaziamento, dobramento, controle de temperatura e prazo de validade.
        slug: inflatable-sup-storage
      - title: Noções básicas de reparo
        desc: Corrija pequenos furos, vazamentos de costura e problemas de válvula com kits de reparo PVC e técnicas de remendo.
        slug: inflatable-sup-repair
      - title: Manutenção de válvulas
        desc: Identifique os tipos de válvula (Halkey-Roberts, Boston, Leafield), limpe os detritos e substitua as hastes defeituosas.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centro de Conhecimento
knowledge_center_title: Equipamentos marítimos e guias da indústria
knowledge_center_subtitle: Conhecimento especializado e guias de compras para profissionais marítimos, operadores de frotas e entusiastas de esportes aquáticos.
knowledge_sections:
  - title: RIB Conhecimento do Barco
    tagline: Guias rígidos para barcos infláveis
    desc: Tudo sobre barcos RIB – projeto do casco, materiais, seleção de motores, manutenção e conselhos de compra para uso comercial e recreativo.
    guides:
      - title: Como escolher o barco RIB certo
        desc: Guia completo para selecionar um RIB — tamanho, potência do motor, material do tubo, tipo de casco e uso pretendido.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs Barco Inflável
        desc: Barco inflável rígido versus bote inflável tradicional – comparação entre design, desempenho, durabilidade e capacidade do casco.
        href: /compare/rib-vs-dinghy
      - title: Comercial RIB vs Recreativo RIB
        desc: Barcos de nível comercial versus barcos recreativos RIB – padrões de construção, materiais, vida útil, custo e certificações.
        href: /compare/commercial-vs-recreational-rib
      - title: Casco de alumínio vs fibra de vidro
        desc: Compare cascos de alumínio e fibra de vidro para barcos RIB em termos de peso, custo, durabilidade e resistência à corrosão.
        href: /compare/aluminum-vs-fiberglass
  - title: Guia de barco inflável
    tagline: Conhecimento sobre embarcações infláveis
    desc: Guias completos sobre barcos infláveis ​​— PVC vs Hypalon, métodos de construção, padrões de segurança e melhores práticas de manutenção.
    guides:
      - title: PVC vs Hypalon Guia de materiais
        desc: Comparação definitiva entre PVC e Hypalon CSM para construção de barcos infláveis.
        href: /compare/pvc-vs-hypalon
      - title: Como são feitos os barcos infláveis
        desc: Processo de fabricação — corte de material, soldagem HF, construção de costura, teste de pressão e controle de qualidade.
        href: /learn/inflatable-technology
      - title: Guia de segurança para barcos infláveis
        desc: Padrões de segurança, capacidade de carga, inflação adequada, verificações antes da partida e procedimentos de emergência.
        href: /learn/water-safety
      - title: Manutenção de barco inflável
        desc: Limpeza, armazenamento, proteção UV, preparação para o inverno e reparo de barcos infláveis ​​e RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Conhecimento do barco
    tagline: Barco inflável e cubo RIB
    desc: Guias técnicos que cobrem tipos de barcos infláveis, materiais, métodos de construção, manutenção e segurança – de botes a RIBs.
    guides:
      - title: Tipos de barcos infláveis
        desc: Botes, RIBs, caiaques e tenders – aprenda as diferenças e escolha o certo.
        href: /v2/inflatable-boat-buying-guide
      - title: Tecnologia Drop-Stitch
        desc: Como milhares de fios internos criam estruturas infláveis ​​rígidas e de alta pressão.
        href: /learn/drop-stitch-core
      - title: Referência de Materiais
        desc: PVC classificações de denier, pesos de tecido, resistência UV e materiais de qualidade marítima explicados.
        href: /learn/materials
      - title: RIB vs Bote
        desc: Compare barcos infláveis ​​rígidos com botes infláveis ​​tradicionais para diferentes casos de uso.
        href: /compare/rib-vs-dinghy
  - title: SUP Conhecimento
    tagline: Guias de stand-up paddle
    desc: Tudo sobre pranchas SUP - infláveis ​​vs rígidas, dimensões das pranchas, tecnologia de materiais e consultoria especializada para todos os níveis de habilidade.
    guides:
      - title: Inflável vs Difícil SUP
        desc: Compare iSUPs e placas de epóxi rígido em termos de portabilidade, durabilidade, desempenho e valor.
        href: /learn/sup
      - title: SUP Guia de dimensões da placa
        desc: Como o comprimento, a largura e a espessura afetam a estabilidade, a velocidade e a manobrabilidade.
        href: /learn/sup
      - title: SUP Manutenção e cuidados
        desc: Dicas de limpeza, armazenamento, proteção UV e reparo para pranchas infláveis ​​SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Escolhendo o seu primeiro SUP
        desc: Guia para iniciantes para selecionar a prancha de stand-up paddle certa para seu peso, nível de habilidade e uso pretendido.
        href: /learn/sup
  - title: Guia de equipamentos de mergulho
    tagline: Conhecimento comercial sobre barcos de mergulho
    desc: Guias especializados em barcos de mergulho, RIBs de mergulho e equipamentos para centros de mergulho, operadores de mergulho e equipes de mergulho comercial.
    guides:
      - title: Melhor RIB Barco para Centros de Mergulho
        desc: Como escolher o mergulho RIB certo para o seu centro de mergulho — capacidade, configuração e considerações orçamentárias.
        href: /solutions-diving-center-boats
      - title: Dive RIB Guia de configuração
        desc: Recursos essenciais para RIBs de mergulho — suportes para tanques, sistemas de escadas, plataforma de mergulho e armazenamento de equipamentos.
        href: /solutions-diving-center-boats
  - title: Guia de concurso de iate
    tagline: Soluções para concursos marítimos e de super iates
    desc: Guias para selecionar o barco de passeio perfeito - barcos infláveis, barcos RIB, soluções de armazenamento e acessórios para barcos.
    guides:
      - title: Como escolher um concurso de iate
        desc: Fatores a serem considerados ao selecionar uma proposta para o seu iate – tamanho, material, motor e armazenamento.
        href: /solutions-yacht-tender-solutions
      - title: Infláveis ​​vs RIB Propostas
        desc: Compare barcos infláveis ​​com barcos infláveis ​​rígidos em termos de desempenho, durabilidade e capacidade de armazenamento.
        href: /compare/rib-vs-dinghy
  - title: Guia de equipamentos de resgate
    tagline: Conhecimento de embarcações de busca e resgate
    desc: Guias profissionais em barcos de resgate, embarcações SAR e equipamentos de resposta a emergências para guarda costeira, salva-vidas e equipes de socorro em desastres.
    guides:
      - title: SAR Guia de seleção de barco
        desc: Como escolher o barco de busca e salvamento certo – velocidade, capacidade, durabilidade e requisitos de equipamento especializado.
        href: /solutions-rescue-watercraft
      - title: Comercial RIB para operações de resgate
        desc: Por que os RIBs de nível comercial são a escolha preferida para equipes profissionais de busca e resgate em todo o mundo.
        href: /use-cases/search-and-rescue
