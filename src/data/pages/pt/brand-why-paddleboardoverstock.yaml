features3_reasons:
  tagline: Por Que Escolher Paddle Board Overstock
  title: Sete Razões para Fazer Parceria Conosco
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Fabricação Real, Não Comércio
      description: Nós possuímos e operamos uma fábrica de 12.000 m². Quando você compra da Paddle Board Overstock, você compra diretamente das pessoas que projetam, desenvolvem e constroem sua prancha — sem intermediários, sem aumento de preço de varejo.
      icon: tabler:building-factory
    - title: 2. Abordagem Liderada por Engenharia
      description: Nosso processo de design começa pelo uso pretendido, não pela categoria do produto. Otimizamos a forma do casco, a seleção de materiais e a configuração para como a prancha será realmente utilizada.
      icon: tabler:engine
    - title: 3. Qualidade Comprovada
      description: Cada prancha é testada a 100% de pressão a 1,25x PSI antes do envio. Uma taxa de defeito de 99,3% livre de falhas — medida em cada lote, não apenas declarada.
      icon: tabler:shield-check
    - title: 4. Design Voltado para o Remador
      description: 'Arte do deck, séries de cores, suportes de acessórios e pacotes completos — pranchas projetadas em torno do remamento real: turismo, yoga, pesca, fitness e diversão em família.'
      icon: tabler:swimming
    - title: 5. Logística Global
      description: Envio direto de nossa fábrica em Weihai para remadores em 50+ países, com rastreamento completo e gerenciamento de alfândega.
      icon: tabler:truck-delivery
    - title: 6. Suporte Vitalício
      description: Suportamos pranchas que construímos anos atrás. Peças genuínas, aconselhamento técnico, orientação para reparos — nossa equipe está disponível quando você precisar.
      icon: tabler:lifebuoy
    - title: 7. Especificações Honestamente
      description: Capacidades reais de carga, dimensões reais, peso real. Sem inflação de marketing. O que publicamos é o que você recebe — verificado por testes independentes.
      icon: tabler:ruler-measure
testimonials:
  tagline: Confiado por marcas em todo o mundo
  title: O Que Nossos Parceiros Dizem
  items:
    - content: Minha prancha chegou nova de fábrica com tudo na caixa. Duas temporadas de remadas semanais e ainda mantém o ar perfeitamente.
      name: — Sarah M., Remadora de Fim de Semana, Flórida
    - content: Comparei especificações por semanas antes de comprar. Paddle Board Overstock foi a única marca que publicou pesos reais e pressões reais. O que eles listam é o que aparece.
      name: — Tomasz K., Remador de Turismo, Polônia
    - content: Toda a família agora rema. Começamos com uma prancha e acabamos com quatro — a qualidade facilitou a decisão.
      name: — Angela R., Remadora em Família, Austrália
