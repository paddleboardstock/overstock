features3_reasons:
  tagline: Por que escolher a Paddle Board Overstock
  title: 'Sete razões para ser nosso parceiro'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Fabrico real, não trading'
      description: 'Somos proprietários e operadores de uma fábrica de 12.000 m². Ao fazer parceria com a Paddle Board Overstock, trabalha diretamente com as pessoas que projetam, desenvolvem e constroem os seus produtos — sem intermediários.'
      icon: tabler:building-factory
    - title: '2. Abordagem orientada pela engenharia'
      description: 'O nosso processo de design começa pelo caso de utilização, não pela categoria de produto. Otimizamos a forma do casco, a seleção de materiais e a configuração para a forma como o barco será realmente utilizado.'
      icon: tabler:engine
    - title: '3. Qualidade certificada'
      description: 'Certificação CE, sistema de qualidade ISO, conformidade BSCI, conformidade REACH, aprovação USCG. Os nossos 64 modelos certificados CE cumprem as normas internacionais — não são apenas afirmações.'
      icon: tabler:certificate
    - title: '4. OEM/ODM flexível'
      description: 'Cores dos tubos, disposição da consola, branding, embalagem — personalizamos de acordo com as suas especificações. Sem pressão de quantidade mínima. Comece com um protótipo e escale com confiança.'
      icon: tabler:adjustments
    - title: '5. Logística global'
      description: 'Armazém nos EUA na Califórnia, expedição direta de Qingdao, transporte aéreo para encomendas urgentes. Tratamos da documentação e das formalidades aduaneiras.'
      icon: tabler:truck-delivery
    - title: '6. Suporte vitalício'
      description: 'Damos suporte a barcos que construímos há 20 anos. Peças sobresselentes genuínas, aconselhamento técnico, orientação de reparação — a nossa equipa está disponível quando precisa de nós.'
      icon: tabler:lifebuoy
    - title: '7. Especificações honestas'
      description: 'Cargas reais, dimensões reais, peso real. Sem inflação de marketing. O que publicamos é o que recebe — verificado por testes independentes.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Confiança de marcas em todo o mundo
  title: O que dizem os nossos parceiros
  items:
    - content: 'Trabalhámos com vários fabricantes na China, mas a Paddle Board Overstock destaca-se pelo suporte de engenharia e pela qualidade consistente. Tratam a nossa marca como se fosse deles.'
      name: '— Parceiro OEM, Marca Europeia de Desportos Aquáticos'
    - content: 'Os seus RIBs em Hypalon estão ao serviço da nossa frota há mais de 5 anos. Manutenção mínima, excelente resistência aos raios UV. A garantia de 5 anos nos tubos dá-nos confiança.'
      name: '— Operador de Frota, Grupo de Resorts do Médio Oriente'
    - content: 'A equipa da Paddle Board Overstock ajudou-nos a desenvolver um design personalizado de prancha de SUP do conceito à produção em 90 dias. A qualidade superou as nossas expectativas.'
      name: '— Distribuidor, desportos náuticos da Austrália'
cta:
  title: 'Pronto para sentir a diferença?'
  subtitle: 'Contacte a nossa equipa para falar sobre o seu projeto. Sem compromisso — apenas conselhos honestos sobre fabrico.'
  actions:
