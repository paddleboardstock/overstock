content_capability:
  tagline: Capacidade de Engenharia
  title: O que nossa equipe<br />de engenharia oferece
  subtitle: A engenharia Aquafarer cobre todo o ciclo de vida do produto – desde a pesquisa de mercado e design de conceito até a prototipagem, testes e produção em massa.
  items:
    - title: Desenho Industrial
      description: Nossa equipe de design industrial trabalha a partir dos requisitos do cliente, pesquisa de mercado e análise competitiva para desenvolver conceitos de produtos que equilibrem estética, funcionalidade e capacidade de fabricação. Produzimos esboços 2D, renderizações 3D e documentos de especificações para revisão do cliente antes de nos comprometermos com as ferramentas.
      features:
        - Desenvolvimento de conceitos e estudos de viabilidade
        - Desenhos de projeto 2D e renderizações 3D
        - Seleção e especificação de materiais
        - Análise de design para fabricação (DFM)
        - Avaliação ergonômica e de segurança
    - title: Engenharia Estrutural
      description: Nossos engenheiros estruturais são especializados em arquitetura de barcos infláveis – projeto de casco, configuração de câmara de tubo, engenharia de núcleo de ponto gota e distribuição de carga. Cada projeto é analisado quanto à integridade estrutural, otimização de peso e conformidade com os padrões relevantes (CE, ISO, AS).
      features:
        - Projeto de cascos de fibra de vidro em V profundo com ângulos de deadrise calculados
        - Configuração de tubos multicâmara para segurança e flutuabilidade
        - Especificação do núcleo drop-stitch e otimização de densidade
        - Análise de elementos finitos para componentes estruturais
        - Cálculos de distribuição de peso e estabilidade
    - title: Modelagem 3D e CAD
      description: Todos os projetos de produtos são desenvolvidos em CAD 3D antes do início da elaboração do protótipo. Nossos engenheiros usam SolidWorks e Rhino 3D para modelagem de produtos, permitindo que os clientes revisem cada detalhe — desde o perfil do tubo até o layout do console — antes de iniciar a produção.
      features:
        - Modelagem CAD 3D completa no SolidWorks e Rhino 3D
        - Renderizações fotorrealistas para apresentações a clientes
        - Pacotes de desenhos técnicos para produção
        - Projeto de moldes e ferramentas a partir de modelos 3D
        - Transferência direta de dados de CAD para CNC para corte de precisão
    - title: Prototipagem e Teste
      description: Antes da produção em massa, todo novo produto passa pela fase de protótipo. Construímos protótipos funcionais para avaliação do cliente e depois os submetemos ao nosso protocolo de testes completo – testes de pressão, testes de estabilidade, testes de carga e testes de água. As iterações de design na fase de protótipo são rápidas e econômicas.
      features:
        - Ferramentais rápidos para protótipos (prazo de 15 a 20 dias)
        - Protótipo funcional para avaliação em condições reais
        - Protocolo completo de testes antes da aprovação da produção
        - Refinamento iterativo do projeto com base nos resultados dos testes
        - Marco de aprovação do cliente antes da ferramentaria de produção
    - title: Integração de acessórios personalizados
      description: Muitos projetos OEM exigem integração de acessórios fornecidos pelo cliente ou de terceiros – consoles personalizados, assentos especializados, sistemas eletrônicos, suportes para equipamentos de mergulho ou elementos de marca. Nossa equipe de engenharia gerencia o projeto de integração, adaptação estrutural e validação de qualidade de todos os acessórios.
      features:
        - Projeto de consoles e layout do painel de instrumentos
        - Integração de assentos e estofados personalizados
        - Projeto e cabeamento de sistemas eletrônicos
        - Sistemas de fixação para equipamentos de mergulho e resgate
        - Especificações de aplicação de marca e gráficos
content_process:
  tagline: Processo de Desenvolvimento
  title: Do conceito<br />à produção
  subtitle: Nosso processo de desenvolvimento de produtos segue um fluxo de trabalho estruturado de 6 estágios projetado para minimizar riscos, reduzir prazos e garantir a prontidão de fabricação desde o primeiro dia.
  stages:
    - stage: '01'
      title: Requisitos e Pesquisa
      duration: 1-2 semanas
      description: Trabalhamos com o cliente para definir especificações do produto, requisitos do mercado-alvo, necessidades de conformidade regulatória e objetivos comerciais. Esta etapa produz um Documento de Requisitos do Produto (PRD) que orienta todo o trabalho subsequente.
      deliverables: PRD, análise de mercado, benchmark competitivo, estimativa preliminar de custos
    - stage: '02'
      title: Projeto Conceitual
      duration: 2-3 semanas
      description: A equipe de design industrial desenvolve conceitos de produtos baseados no PRD. Várias opções de projeto são apresentadas com renderizações 3D, recomendações de materiais e avaliações iniciais de engenharia. O cliente seleciona a direção para o desenvolvimento detalhado.
      deliverables: Renderizações de conceito 3D, especificações de materiais, justificativa do projeto, lista técnica preliminar
    - stage: '03'
      title: Engenharia Detalhada
      duration: 2-4 semanas
      description: O conceito selecionado é totalmente projetado – modelagem CAD 3D, análise estrutural, configuração de tubos, projeto de casco, integração de acessórios e documentação de produção. Todas as dimensões, materiais e processos são especificados para ferramentas.
      deliverables: Modelo CAD 3D completo, desenhos de engenharia, lista técnica final, especificações de ferramentas, plano de controle de qualidade
    - stage: '04'
      title: Prototipagem
      duration: 2-3 semanas
      description: Protótipos de ferramentas são produzidos e amostras funcionais são construídas. O cliente analisa o protótipo em relação às especificações do PRD. O teste é conduzido de acordo com o protocolo acordado. Os ajustes de projeto são feitos com base no feedback antes das ferramentas de produção.
      deliverables: Protótipo funcional, relatório de teste, registro de revisão de projeto, documento de aprovação do cliente
    - stage: '05'
      title: Ferramentas de produção
      duration: 2-3 semanas
      description: Depois que o protótipo é aprovado, as ferramentas de produção são comissionadas – moldes, gabaritos de soldagem, programas de corte, acessórios de montagem. A documentação de CQ e os critérios de inspeção são finalizados. Teste realizado para validação do processo.
      deliverables: Ferramentas de produção, documentação do processo, plano de inspeção de controle de qualidade, relatório de teste
    - stage: '06'
      title: Produção em massa e controle de qualidade
      duration: Em andamento
      description: A produção completa começa com o controle de qualidade em processo em todas as etapas. Os primeiros artigos são inspecionados e aprovados antes da liberação do lote. Monitoramento contínuo da qualidade, rastreamento de defeitos e melhoria contínua ao longo do ciclo de vida da produção.
      deliverables: Cronograma de produção, relatórios de controle de qualidade, registros de rastreabilidade de lote, documentação de remessa
content_customization:
  tagline: Opções de personalização
  title: O que pode ser<br />Personalizado
  subtitle: Quase todos os aspectos de nossos produtos podem ser personalizados para atender às necessidades do cliente. Abaixo estão as categorias de personalização mais comuns.
  columns: 3
  items:
    - title: Casco e Estrutura
      description: Comprimento personalizado do casco, largura da viga, ângulo de nascimento, diâmetro do tubo, configuração da câmara e classe do material.
      icon: tabler:sailboat
    - title: Cores e gráficos
      description: Cor do tubo (PVC/Hypalon), cor do gelcoat do casco, cor do console, gráficos do deck, colocação do logotipo e design da embalagem.
      icon: tabler:palette
    - title: Console e controles
      description: Console central, console lateral ou direção do leme. Layout personalizado do painel de instrumentos, posicionamento dos interruptores e posição do leme.
      icon: tabler:steering-wheel
    - title: Assentos e estofados
      description: Assentos jockey, bancos corridos, estofamento luxuoso, costura na cor correspondente, configurações dobráveis ou removíveis.
      icon: tabler:armchair
    - title: Acessórios e Equipamentos
      description: Escadas de mergulho, suportes para tanques, postes de reboque, T-tops, Bimini tops, sistemas de som, eletrônicos de navegação e equipamentos de segurança.
      icon: tabler:backpack
    - title: Embalagem e marca
      description: Embalagens de varejo personalizadas, caixas de marca própria, caixas de remessa com marcas de marca, etiquetas penduradas e manuais do usuário no idioma do cliente.
      icon: tabler:box
content_industries:
  tagline: Aplicações Industriais
  title: Soluções de engenharia<br />por setor
  subtitle: Nossa equipe de engenharia desenvolveu produtos para uma ampla gama de aplicações marítimas — cada uma com requisitos e critérios de desempenho distintos.
  columns: 3
  items:
    - title: Operações de Mergulho
      description: Decks reforçados, integração de escadas de mergulho, sistemas de armazenamento de tanques e plataformas estáveis para centros de mergulho comerciais em todo o mundo.
      icon: tabler:lifebuoy
    - title: Resgate e Emergência
      description: Projetos de cascos de alta velocidade, conveses auto-suficientes, sistemas de montagem de equipamentos e configurações de segurança multicâmaras para operações SAR.
      icon: tabler:alert-triangle
    - title: Turismo Marítimo
      description: Layouts de conforto dos passageiros, integração de guarda-sóis, sistemas de embarque e configurações de baixo consumo de combustível para operações de transferência em ilhas.
      icon: tabler:beach
    - title: Tenders para iates
      description: Projetos compactos para armazenamento de turcos, opções de acabamento luxuoso, cores correspondentes da nave-mãe e características de reboque de alto desempenho.
      icon: tabler:sailboat
    - title: Pesca e Aquicultura
      description: Configurações de deck plano, integração de livewell, layouts de suporte de haste, hardware resistente à corrosão para exposição contínua à água salgada.
      icon: tabler:fish
    - title: Portuário e Industrial
      description: Reforço de casco para serviços pesados, layouts de barcos de trabalho, configurações de transporte de pessoal e integração de equipamentos para operações offshore.
      icon: tabler:ship
