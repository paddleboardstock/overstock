process_section:
  eyebrow: O nosso processo
  title: Fluxo de trabalho OEM/ODM de ponta a ponta
  subtitle: Do briefing de design ao carregamento do contentor — seis passos para a sua embarcação insuflável de marca própria.
  steps:
    - step: '01'
      title: Especificação e briefing de design
      desc: Partilhe as suas especificações-alvo, desenhos CAD ou um produto de referência. A nossa equipa de engenharia revê materiais, dimensões e requisitos de conformidade (CE, BSCI) antes de apresentar o orçamento.
    - step: '02'
      title: Prototipagem de moldes 3D
      desc: Projetamos e mecanizamos por CNC moldes personalizados para pranchas de SUP, cascos de caiaque e componentes RIB. As amostras de protótipo são produzidas em 15-20 dias úteis para a sua aprovação.
    - step: '03'
      title: Seleção de materiais e produção de amostras
      desc: Escolha entre PVC de grau militar (0,9-1,2 mm), Hypalon CSM ou tecidos de núcleo drop-stitch. Produzimos amostras de pré-produção com as cores da sua marca, logótipo e embalagem para aprovação final.
    - step: '04'
      title: Auditoria de fábrica CE e conformidade
      desc: Cada encomenda OEM inclui documentação de conformidade — declaração de conformidade CE, registos de rastreabilidade ISO 9001, relatório de conformidade social BSCI e declarações de materiais REACH.
    - step: '05'
      title: Produção em massa e controlo de qualidade em linha
      desc: As corridas de produção seguem a nossa checklist de qualidade de 100 pontos. Cada unidade é submetida a testes de retenção de pressão de 24 horas, testes de descasque de costuras e inspeção visual antes da embalagem.
    - step: '06'
      title: Logística FOB Qingdao e expedição
      desc: Os produtos acabados são paletizados, embalados em película termo-retrátil e carregados em contentores no porto de Qingdao. Tratamos de toda a documentação de exportação, despacho aduaneiro e fornecemos rastreio de expedições em tempo real.
capabilities_section:
  eyebrow: Capacidades de fabrico
  title: O que fabricamos
  subtitle: Seis capacidades de produção fundamentais para parceiros B2B globais.
  items:
    - title: Fabrico de pranchas de SUP drop-stitch
      desc: Laminação de núcleo drop-stitch em todo o comprimento para pranchas de stand-up paddle rígidas de alta pressão (15-20 PSI). Comprimento, largura, espessura, perfil rocker e design gráfico personalizados.
    - title: Produção de barcos insufláveis de PVC
      desc: Botes, tenders e barcos desportivos de PVC soldados por alta frequência. Múltiplas configurações de câmaras, opções de piso (ripas, deck de ar, enrolável) e integração de acessórios.
    - title: Fabrico de RIB em Hypalon
      desc: Tubos CSM Hypalon de grau comercial colados a cascos de fibra de vidro ou alumínio em V profundo. Comprimentos de 3,3 m a 6,0 m para operações de patrulha, resgate, turismo e mergulho.
    - title: Marca própria e branding personalizado
      desc: 'Serviço completo de marca própria: logótipo personalizado por transferência térmica ou serigrafia, embalagem com marca (caixas de retalho, sacos de transporte), manuais de utilizador no seu idioma e registo de códigos de barras/UPC.'
    - title: Design de moldes e ferramentas personalizadas
      desc: Equipa interna de engenharia 3D CAD/CAM. Projetamos e fabricamos moldes personalizados de alumínio e materiais compósitos para formas de casco únicas, configurações de convés e pontos de montagem de acessórios.
    - title: Acessórios OEM e kitting
      desc: Coletes salva-vidas (CE 12402), bombas de dupla ação, remos de carbono/nylon, kits de reparação, sacos de transporte e leash. Kitting completo e embalagem em conjuntos para uma apresentação pronta para venda.
experience_section:
  eyebrow: Experiência real
  title: Parcerias que construíram marcas
  subtitle: Histórias reais de marcas e organizações que escolheram a Paddle Board Overstock para a fabricação OEM/ODM.
  stories:
    - quote: Chegámos à Paddle Board Overstock com um esboço num guardanapo e uma lista de requisitos. Oito meses depois, tínhamos um produto pronto para produção que passou a certificação CE à primeira tentativa.
      narrative: Uma startup europeia com um design de SUP inovador recorreu à Paddle Board Overstock para a fabricação ODM. A equipa de R&D da Paddle Board Overstock conduziu o conceito através do design CAD, análise estrutural FEA, simulação hidrodinâmica, criação do molde, fabrico do protótipo e ferramentas de produção. O fundador da startup visitou Qingdao três vezes durante o processo. O produto final passou a certificação CE sem quaisquer modificações — um resultado que o fundador atribui ao facto de a equipa de engenharia da Paddle Board Overstock compreender os requisitos regulamentares europeus desde o início.
      context: Lançamento de marca europeia de SUP, 2023-2024
      source: Fundador da marca
    - quote: O nível de proteção NDA e segurança da PI na Paddle Board Overstock dá-nos a confiança para partilhar os nossos designs proprietários. Tratam a nossa PI como se fosse deles.
      narrative: Uma empresa americana de equipamento marinho com tecnologia de válvulas proprietária precisava de um parceiro de fabrico capaz de proteger a sua PI produzindo à escala. Após auditar cinco fabricantes chineses, escolheram a Paddle Board Overstock com base nos protocolos de proteção de PI da fábrica, na gestão segura de ficheiros de design e na disposição para assinar NDAs rigorosos. A parceria produziu três linhas de produtos em quatro anos sem qualquer incidente de PI.
      context: Empresa americana de equipamento marinho, parceria OEM desde 2021
      source: Vice-presidente de Operações
