breadcrumb: Fabricante OEM/ODM
tldr:
  summary: A Paddle Board Overstock é um fabricante OEM/ODM diretamente de fábrica. Instalação de 12 000 m² certificada ISO 9001:2015, produção anual de 15 000 unidades, conformidade CE/BSCI/REACH/UKCA, MOQ baixos a partir de 2-10 unidades.
  points:
    - Fábrica em Qingdao de 12 000 m² certificada ISO 9001:2015
    - Capacidade anual de 15 000 unidades com 200-300 trabalhadores qualificados
    - Conformidade CE 2013/53/EU, UKCA, BSCI, REACH
    - 'MOQ baixos: 2-5 unidades (RIB), 5-10 unidades (SUP) para modelos padrão'
    - Exportação para mais de 50 países com envio FOB Qingdao
