hero:
  tagline: Presença global
  title: 'Ao serviço de mais de 50 países<br />em todos os continentes'
  subtitle: 'De operadores europeus de patrulha costeira a distribuidores australianos de desportos aquáticos e equipas de salvamento do Médio Oriente — os barcos Paddle Board Overstock navegaram em todo o mundo.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabricação e distribuição marinha global da Paddle Board Overstock
stats:
  title: Alcance global
  stats:
    - title: Países
      amount: '50+'
    - title: Mercados de exportação
      amount: Europa, Américas, Ásia, Médio Oriente, Oceania
    - title: Produção
      amount: Qingdao, China
    - title: Armazém nos EUA
      amount: Montclair, CA
features3_markets:
  tagline: Mercados-chave
  title: 'Especialização regional<br />para requisitos locais'
  subtitle: 'Compreendemos que diferentes mercados têm diferentes requisitos regulamentares, preferências e casos de utilização.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa e Reino Unido
      description: 'Produtos certificados CE em conformidade com as normas EN ISO 6185. Forte procura por RIBs, barcos insufláveis e pranchas de SUP nos mercados da UE. Os distribuidores do Reino Unido valorizam a nossa rápida resposta.'
      icon: tabler:map-pin
    - title: América do Norte
      description: 'Fabrico aprovado pela US Coast Guard. Armazém nos EUA em Montclair, CA para entrega rápida na Costa Oeste. Crescente procura por barcos de pesca, embarcações de salvamento e SUPs recreativos.'
      icon: tabler:map-pin
    - title: Austrália e Oceania
      description: 'Mercado forte para barcos RIB e tenders insufláveis. Os distribuidores australianos valorizam os nossos barcos em Hypalon pela resistência aos UV sob sol intenso. Envio rápido a partir da nossa unidade na Ásia.'
      icon: tabler:map-pin
    - title: Médio Oriente
      description: 'Crescente procura por barcos de patrulha e salvamento. Os nossos RIBs de casco de alumínio são populares junto de operadores de guarda costeira e segurança. Configurações personalizadas para ambientes de alta temperatura.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Rede de distribuição
  title: 'Parcerias com distribuidores<br />em todo o mundo'
  subtitle: 'Trabalhamos com distribuidores estabelecidos de equipamento marítimo, marcas OEM e agências de compras públicas.'
  isBeforeContent: false
  columns: 3
  items:
    - title: Parcerias OEM/ODM
      description: 'Fabrico em marca privada para marcas globais de desportos aquáticos. Tratamos de tudo, desde o design até à produção e ao drop-shipping.'
      icon: tabler:building
    - title: Rede de distribuidores
      description: 'Distribuidores autorizados em mais de 20 países com stock e suporte local. Novas candidaturas de distribuidores são bem-vindas.'
      icon: tabler:users
    - title: Governo e instituições
      description: 'Fornecimento direto a guardas costeiras, organizações de busca e salvamento e programas de aquisição militar. Conformidade com os requisitos de compras institucionais.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Logística e suporte global'
  subtitle: 'Da fábrica ao destino — gerimos toda a cadeia de abastecimento.'
  items:
    - title: Opções de envio
      description: 'Transporte marítimo (FOB Qingdao), transporte aéreo para encomendas urgentes e courier expresso para amostras e peças sobresselentes.'
      icon: tabler:truck-delivery
    - title: Armazém nos EUA
      description: 'Stock em Montclair, CA para entrega rápida em toda a América do Norte. Costa Oeste: 2-3 dias, Centro: 3-4 dias, Costa Este: 4-5 dias.'
      icon: tabler:building-warehouse
    - title: Peças sobresselentes
      description: 'Peças sobresselentes e consumíveis genuínos Paddle Board Overstock disponíveis todo o ano. Peças comuns enviadas em 24 horas.'
      icon: tabler:package
    - title: Suporte técnico
      description: 'Linha direta para a nossa equipa de engenharia para questões técnicas, aconselhamento de reparação e suporte de reequipamento. Damos suporte a barcos que construímos há 20 anos.'
      icon: tabler:headset
cta:
  title: 'Quer tornar-se distribuidor?'
  subtitle: 'Estamos a expandir ativamente a nossa rede de distribuição. Contacte a nossa equipa de exportação para discutir oportunidades de parceria.'
  actions:
    - variant: primary
      text: Consulta de parceria
      href: /contact
    - text: Ver a nossa gama de produtos
      href: /products
