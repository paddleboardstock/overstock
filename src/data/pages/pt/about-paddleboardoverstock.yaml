values:
  - title: Qualidade Primeiro
    desc: Cada barco que sai da nossa fábrica passa por testes obrigatórios de retenção de ar, peeling de costuras e sistemas antes do envio.
  - title: Integração Vertical
    desc: Controlamos cada etapa — desde o corte de PVC até à montagem final — eliminando ineficiências de contratos e garantindo qualidade consistente.
  - title: Segurança como Padrão
    desc: A certificação CE é essencial para o que fabricamos. Os nossos 64 modelos certificados CE cumprem as normas de segurança da UE para uso recreativo e comercial.
  - title: Foco no Parceiro
    desc: Construímos relações de longo prazo com parceiros OEM, ODM e private label através de transparência, fiabilidade e crescimento partilhado.

services:
  - title: Fabrico OEM
    desc: Produzimos de acordo com as suas especificações. Partilhe os seus desenhos e a nossa equipa de engenharia trata da prototipagem, ferramentas e produção.
  - title: Soluções ODM
    desc: Parta das nossas plataformas de design comprovadas. Personalize tamanho, cor, gráficos e embalagem para criar a sua linha única de produtos.
  - title: Private Label
    desc: A sua marca, o seu logótipo, a sua embalagem. Os produtos chegam prontos para venda a retalho com integração total da marca.
  - title: Branding Personalizado
    desc: Impressão no deck, gráficos de casco, decalques nos tubos e etiquetas personalizadas — presença consistente da marca em todas as superfícies.

certifications:
  - name: Certificação CE
    desc: Os nossos barcos e embarcações cumprem a Diretiva de Embarcações de Recreio da UE (2013/53/EU) e normas harmonizadas relevantes.
    scope: Barcos e embarcações
  - name:
    desc: Sistema de gestão da qualidade certificado para design, fabrico e distribuição de embarcações infláveis.
    scope: Instalação completa
  - name:
    desc: Barcos infláveis — requisitos de segurança e desempenho para barcos infláveis reforçados e de casco rígido.
    scope: Linhas RIB e infláveis

