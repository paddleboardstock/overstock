  tagline: Sobre
  title: 'Sobre a {SITE}'
  subtitle: Um fabricante de equipamentos aquáticos verticalmente integrado — da matéria-prima ao barco pronto

intro:
  - 'A Paddle Board Overstock foi fundada em 2012 com uma única missão: projetar e fabricar equipamentos para desportos aquáticos que tenham um desempenho tão bom na água quanto no relatório de qualidade. O que começou como uma oficina focada em pranchas SUP cresceu para uma instalação de fabrico integrada de 12 000 metros quadrados na Zona de Desenvolvimento Económico de Qingdao, produzindo barcos infláveis, RIB, caiaques, pranchas SUP, equipamentos de segurança e acessórios para clientes em mais de 50 países.'
  - Hoje, a Paddle Board Overstock opera como uma marca de fábrica — projetamos, desenvolvemos, prototipamos, fabricamos e testamos tudo sob o mesmo teto. Esta integração vertical dá-nos controlo direto sobre a seleção de materiais, qualidade de construção e prazos de entrega. Cada barco é construído pelos nossos colaboradores, nos nossos equipamentos, de acordo com os nossos padrões.
  - Atendemos utilizadores recreativos, operadores comerciais, agências governamentais e parceiros de marca em todo o mundo. Os nossos programas OEM e ODM ajudam empresas a lançar as suas próprias linhas de produtos sem investir em infraestrutura de fábrica. Quer necessite de um único protótipo ou de uma produção completa, a nossa equipa guia-o desde o conceito até à entrega pronta para o mar.

