  - label: Capacidade anual
    value: 15 000 barcos incluindo SUP, caiaques, dingues, RIB e equipamentos de segurança
  - label: Equipa de P&D
    value: Mais de 25 engenheiros em design de produto, ciência de materiais e engenharia da qualidade
  - label: Equipamento principal
    value: Mesas de corte CNC, seladores RF dielétricos, seladores de ar quente, impressoras digitais, moldes de fibra de vidro, bancadas de teste de retenção de ar
