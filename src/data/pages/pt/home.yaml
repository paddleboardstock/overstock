faqs:
  title: FAQ de Aprovisionamento B2B
  subtitle: 'Perguntas comuns de marcas, distribuidores e operadores comerciais sobre o fabrico OEM/ODM com a Paddle Board Overstock.'
  columns: 2
  items:
    - title: São fabricantes ou uma empresa de trading?
      description: 'Somos uma fábrica verticalmente integrada com controlo total sobre qualidade, materiais e prazos. Licença comercial e âmbito de produção verificáveis durante auditoria à fábrica.'
      icon: tabler:building-factory
      category: all
    - title: Como funciona o vosso processo OEM/ODM?
      description: 'Da análise de requisitos (48 h) à proposta, protótipo (7–14 dias) e produção (30–45 dias FOB Qingdao). Apoio de engenharia total, documentação de conformidade e rastreabilidade por casco em todas as fases.'
      icon: tabler:route
      category: all
    - title: Quais são os vossos requisitos de MOQ?
      description: 'Barcos RIB: 2–5 unidades por modelo (molde existente), 200+ para moldes personalizados. Pranchas SUP: 5–10 unidades por SKU. Encomendas mistas em contentor disponíveis. Encomendas de amostra de 2–5 unidades para avaliação.'
      icon: tabler:sort-ascending
      category: all
    - title: Que opções de personalização estão disponíveis?
      description: 'Design de casco, material dos tubos (PVC ou Hypalon/CSM), diâmetro dos tubos, disposição da consola, assentos, direção, sistema de combustível, layout do deck, cores da marca, grafismos de logótipo, design de pad EVA, embalagem de retalho e branding do manual do proprietário.'
      icon: tabler:adjustments
      category: all
    - title: Que documentos de conformidade podem fornecer para o meu mercado?
      description: 'Declaração CE conforme 2013/53/EU, marcação UKCA, certificado ISO 9001 (SGS), relatório de auditoria BSCI, conformidade REACH, relatórios de testes de materiais, registos de testes de pressão e dados da chapa de construtor específicos por modelo. Documentação específica por mercado a pedido.'
      icon: tabler:file-certificate
      category: all
    - title: Qual é o prazo de amostragem e produção?
      description: 'Amostras de pré-produção: 7–14 dias úteis. Produção standard: 30–45 dias FOB Qingdao. Produção urgente disponível com custo adicional. A época alta (março–junho) pode prolongar os prazos.'
      icon: tabler:clock
      category: all
    - title: Posso agendar uma auditoria à fábrica ou uma video-tour ao vivo?
      description: 'Sim. Auditorias presenciais na nossa instalação em Qingdao são bem-vindas com 3–5 dias de antecedência. Video-tours ao vivo via WhatsApp/Zoom disponíveis de imediato. Inspeções de terceiros (SGS, BV, TÜV) aceites.'
      icon: tabler:video
      category: all
    - title: Que inspeções de qualidade são feitas antes da expedição?
      description: 'Teste de retenção de pressão a 1,25× o nominal (24–48 h), teste de descasque de costuras, checklist de inspeção final de 100 pontos, verificação dimensional, inspeção cosmética, verificação da documentação de conformidade e verificação da integridade da embalagem. Tudo segundo procedimentos ISO 9001.'
      icon: tabler:clipboard-check
      category: all

