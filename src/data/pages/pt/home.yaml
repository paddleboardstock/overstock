features:
  id: features
  tagline: Por que Comprar de Paddle Board Overstock
  title: Fábrica de verdade,<br />Economia de verdade
  subtitle: Pacotes SUP com excesso de estoque e liquidação direto da fábrica - qualidade comprovada sem marcação de varejo.
  columns: 2
  items:
    - title: Até 60% de Desconto sobre o Varejo
      description: Vendemos lotes de estoque excedente e liquidação direto da fábrica — sem intermediários, sem margem de varejo. As mesmas pranchas que vendem por preço cheio em outros lugares, aqui com preço de liquidação.
      icon: tabler:rocket
    - title: Pacotes Completos
      description: 'Cada SUP vem como um pacote completo: prancha, mochila de viagem, bomba manual, remo ajustável, quilha removível, leash em espiral e kit de reparo.'
      icon: tabler:clipboard-list
    - title: Qualidade comprovada
      description: Cada placa é 100% testada com pressão de 1,25x PSI nominal antes de ser enviada. Taxa livre de defeitos de 99,3% em cada lote.
      icon: tabler:shield-check
    - title: Sem pedido mínimo
      description: Compre exatamente o que você precisa. Adicione uma placa ao carrinho, finalize a compra e pronto - sem mínimos, sem processo de cotação, sem espera.
      icon: tabler:adjustments
    - title: Envio Rápido para Todo o Mundo
      description: Pedidos em estoque são enviados de Weihai em 2-3 dias úteis. Entrega rastreada para 50+ países na UE, América do Norte, Ásia-Pacífico e outros.
      icon: tabler:truck-delivery
    - title: Garantia de 2 anos SUP
      description: Cada prancha e acessório SUP tem cobertura de 2 anos — incluindo costuras drop-stitch, válvulas de inflação e acessórios. Reclamações são resolvidas em dias, não semanas.
      icon: tabler:lifebuoy
