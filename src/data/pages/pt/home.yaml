content_customer_types:
  tagline: Quem Servimos
  title: 'Pensado para Compradores B2B<br />— Não para Consumidores Finais'
  subtitle: 'A Paddle Board Overstock fabrica para quatro tipos de clientes. Cada um tem prioridades diferentes — e nós respondemos a todas.'
  items:
    - title: Marcas / Private Label
      description: 'Design de produto personalizado, grafismos private-label, documentação de conformidade sob a sua marca e apoio de engenharia dedicado do conceito ao contentor.'
      icon: tabler:palette
      cta: Solicitar Orçamento OEM/ODM
      cta_href: /request-quotation
    - title: Distribuidores / Grossistas
      description: 'Proteção de território, preços competitivos de atacado, kits de apoio ao marketing, formação de produto e documentação de conformidade completa para o seu mercado.'
      icon: tabler:world
      cta: Candidatar-se a Concessionário
      cta_href: /dealers-distributors
    - title: Resorts / Operadores de Aluguer
      description: 'Durabilidade de nível comercial, aconselhamento de dimensionamento de frota, encomendas mistas em contentor, estratégia de peças sobressalentes e pacotes de equipamento com a marca do resort.'
      icon: tabler:beach
      cta: Obter um Pacote Comercial
      cta_href: /solutions/resorts
    - title: Resgate / Governo / Profissionais
      description: 'Construção em Hypalon/CSM, opções de conformidade SOLAS, certificação específica por projeto, apoio à documentação de concursos e engenharia protegida por NDA.'
      icon: tabler:shield
      cta: Discutir um Projeto
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Capacidades OEM/ODM
  title: 'O Que Obtém<br />com a Paddle Board Overstock'
  subtitle: 'Acesso direto à fábrica com apoio completo de engenharia, qualidade e conformidade — não uma empresa de trading.'
  columns: 2
  items:
    - title: Personalização OEM/ODM
      description: 'Design de casco personalizado, material dos tubos (PVC ou Hypalon/CSM), disposição da consola, assentos, branding, cores e embalagem. Desde pequenas modificações até à engenharia totalmente personalizada.'
      icon: tabler:adjustments
    - title: MOQ Baixo, Amostragem Rápida
      description: 'RIB: 2–5 unidades (molde existente). SUP: 5–10 unidades por SKU. Moldes personalizados: 200+ unidades. Amostras de pré-produção com a sua marca em 7–14 dias.'
      icon: tabler:rocket
    - title: Qualidade Pronta para Produção
      description: 'Cada unidade testada sob pressão a 1,25× o PSI nominal durante 24–48 horas. 99,3% livre de defeitos segundo AQL 2,5 / ISO 2859. Checklist de qualidade de 100 pontos por casco.'
      icon: tabler:certificate
    - title: Documentação de Conformidade Completa
      description: 'CE conforme 2013/53/EU (RCD), ISO 9001:2015 (SGS), auditoria social BSCI, conformidade REACH, marcação UKCA. Declaração de Conformidade específica por modelo e dados da chapa de construtor incluídos.'
      icon: tabler:file-certificate
    - title: Prazo de Entrega de 30–45 Dias
      description: 'Produção standard 30–45 dias FOB Qingdao. Protótipos em 7–14 dias. Produção urgente disponível. Planos de carregamento de contentor e embalagem ISPM-15 incluídos.'
      icon: tabler:truck-delivery
    - title: Pós-Venda & Peças Sobressalentes
      description: 'Garantia de 5 anos em barcos/caiaques/RIBs, 2 anos em SUP/acessórios. Fornecimento de peças sobressalentes com envio prioritário. Apoio ao processamento de reclamações de garantia.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Categorias de Produtos
  title: '5 Categorias,<br />64 Modelos Certificados CE'
  subtitle: 'De tenders RIB de 2,4 m a pranchas SUP de 15 pés — todos fabricados na nossa instalação ISO 9001 em Qingdao.'
  items:
    - title: Barcos RIB
      description: '2,4 m a 7,0 m com cascos de alumínio ou GRP. Tubos em PVC ou Hypalon/CSM. CE conforme 2013/53/EU. Configurações de patrulha, mergulho, resgate e uso comercial.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Barcos Insufláveis
      description: '2,0 m a 5,0 m com opções de piso em alumínio, madeira marítima ou air-deck. Modelos para pesca, lazer e tender.'
      icon: tabler:sailboat
      link: /products
    - title: Pranchas SUP
      description: '9 a 15 pés em Drop-Stitch de 4 e 6 polegadas. Modelos all-round, touring, yoga e pesca. Disponível em qualidade comercial.'
      icon: tabler:swimming
      link: /products
    - title: Caiaques
      description: 'Caiaques insufláveis de 1 a 3 lugares. Modelos de lazer e touring com opções de piso Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Acessórios de Segurança
      description: 'Coletes salva-vidas certificados CE, cabos de salvamento, kits de reparação, bombas e luzes de navegação. Coletes USCG Tipo III/V aprovados.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Força de Fábrica
  title: 'Produção Pronta para Auditoria<br />em Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Instalação ISO 9001 de 12.000 m² — Fabricante Real, Não Uma Empresa de Trading</h3>
  items:
    - title: 6 Linhas de Produção Dedicadas
      description: 'Linhas separadas para RIB, barcos insufláveis, SUP, caiaques, equipamento de segurança e OEM/ODM. Cada uma com postos de controlo QC dedicados e planeamento de produção próprio.'
    - title: 100% Testado sob Pressão
      description: 'Cada câmara insuflável pressurizada a 1,25× o PSI nominal e mantida durante 24–48 horas. Resultados dos testes ligados ao número de série do casco (HIN).'
    - title: Rastreabilidade por Casco
      description: 'Registos de produção ao nível do HIN com mais de 21 campos de dados por casco: lote de material, ID do soldador, resultado do teste de pressão, configuração final e destino de entrega.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Instalação de produção ISO 9001 de 12.000 m² da Paddle Board Overstock em Qingdao com linhas de produção RIB

content_compliance:
  tagline: Conformidade & Prova de Qualidade
  title: 'Evidência Documentada,<br />Não Apenas Afirmações'
  subtitle: 'Cada declaração de conformidade é sustentada por documentação específica do modelo, disponível para a sua verificação.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Sistema de gestão de qualidade certificado pela TÜV Rheinland/SGS. Auditorias de vigilância anuais. Processos QC documentados desde a receção de material até à libertação para expedição.'
      icon: tabler:certificate
    - title: CE conforme 2013/53/EU (RCD)
      description: '64 modelos com Declarações de Conformidade específicas por modelo. Avaliação de conformidade conforme os módulos aplicáveis. Registo HIN e dados da chapa de construtor para cada casco.'
      icon: tabler:file-certificate
    - title: Conformidade Social BSCI
      description: 'Auditoria BSCI anual pela SGS. Práticas laborais éticas verificadas, segurança no local de trabalho e gestão ambiental em toda a nossa instalação.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Todos os materiais de PVC e adesivos cumprem o regulamento REACH da UE. Marcação UKCA disponível para o mercado do Reino Unido. Fichas de dados de segurança de materiais a pedido.'
      icon: tabler:shield-check

steps:
  title: Processo OEM/ODM — Do Brief ao Contentor
  items:
    - title: 'Etapa 1: <span class="font-medium">Requisitos</span>'
      description: 'Partilhe as especificações do produto, mercado-alvo, quantidades e requisitos de conformidade. A nossa equipa de engenharia responde em 48 horas.'
      icon: tabler:file-text
    - title: 'Etapa 2: <span class="font-medium">Proposta</span>'
      description: 'Receba uma proposta detalhada com especificações, opções de materiais, MOQ, preços, prazo de entrega e âmbito de conformidade para o seu mercado.'
      icon: tabler:clipboard-list
    - title: 'Etapa 3: <span class="font-medium">Protótipo</span>'
      description: 'Amostra de pré-produção com a sua marca em 7–14 dias. Testes de qualidade completos a 1,25× a pressão nominal. Custo da amostra deduzido na produção.'
      icon: tabler:settings
    - title: 'Etapa 4: <span class="font-medium">Produção</span>'
      description: 'Produção de 30–45 dias FOB Qingdao após aprovação da amostra. Pontos de controlo QC em processo, testes de pressão e inspeção final de 100 pontos em cada unidade.'
      icon: tabler:building-factory
    - title: 'Etapa 5: <span class="font-medium">Entrega</span>'
      description: 'Plano de carregamento de contentor, embalagem em madeira ISPM-15, pacote de documentação de conformidade e expedição FOB Qingdao com toda a documentação de exportação.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Processo de fabrico OEM/ODM de barcos insufláveis da Paddle Board Overstock, do design à expedição em contentor

