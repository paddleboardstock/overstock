faqs:
  title: SUP Perguntas Frequentes sobre Pedidos e Produtos
  subtitle: Perguntas comuns sobre nossos placas de liquidação SUP, pedidos, pagamento, envio e garantia.
  columns: 2
  items:
    - title: É difícil aprender SUP?
      description: De jeito nenhum. A maioria dos iniciantes fica de pé e rema já na primeira aula. Nossas pranchas SUP versáteis possuem plataformas estáveis extra-largas, projetadas especificamente para remadores de primeira viagem. Comece em águas calmas e você estará navegando em minutos.
      icon: tabler:swimming
      category: e aí?
    - title: Qual é o limite de peso?
      description: Nosso suporte SUPs versátil suporta até 100 kg, e as plataformas de turismo e yoga suportam até 113 kg. Cada página de produto lista a capacidade exata de peso do usuário para que você possa combinar a prancha às suas necessidades.
      icon: tabler:adjustments
      category: e aí?
    - title: Posso viajar com um SUP inflável?
      description: Absolutamente. Cada prancha Paddle Board Overstock cabe em uma bolsa de transporte do tamanho de uma mochila. Com apenas 18-22 lbs, é fácil de levar para a praia, lago ou através de terminais de aeroportos. Verifique a política de bagagem da sua companhia aérea antes de viajar.
      icon: tabler:truck-delivery
      category: e aí?
    - title: O que vem na caixa?
      description: Cada Paddle Board Overstock SUP inclui a prancha, uma mochila de viagem, bomba manual, remo ajustável, quilha removível, leash de corda e kit de reparo.
      icon: tabler:clipboard-list
      category: e aí?
    - title: Por que seus preços são mais baixos que no varejo?
      description: Vendemos estoque excedente de fábrica – placas novas que sobraram de pedidos de produção concluídos – provenientes de nossa própria base de fabricação em Weihai e de parceiros de produção selecionados. Sem margens de varejo e sem intermediários, significa pacotes completos de SUP com até 60% de desconto nos preços típicos de varejo, com a mesma qualidade testada sob pressão.
      icon: tabler:shield-check
      category: pedidos
    - title: Como faço para fazer um pedido e pagar?
      description: Adicione seu pacote SUP ao carrinho e finalize a compra com segurança pelo Stripe ou PayPal. Aceitamos todos os principais cartões de crédito e débito. Todo pedido é confirmado por e-mail com uma nota fiscal completa.
      icon: tabler:file-text
      category: pedidos
    - title: Vocês entregam para todo o mundo?
      description: Sim. Enviamos para 50+ países na União Europeia, América do Norte, Ásia-Pacífico, Oriente Médio e África. Pedidos em estoque geralmente são enviados em 2-3 dias úteis com rastreamento fornecido para cada encomenda.
      icon: tabler:route
      category: pedidos
    - title: Que garantia as placas SUP incluem?
      description: 'Cada placa e acessório SUP têm garantia de 2 anos — incluindo a própria placa, costuras drop-stitch e válvulas de inflação. As reclamações são resolvidas em dias, não semanas: registre online e nós consertamos ou substituímos.'
      icon: tabler:lifebuoy
      category: pedidos
