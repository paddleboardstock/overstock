content_workshop:
  isReversed: true
  tagline: Força de Fábrica
  title: Por que Nossos Preços de Liquidação<br />São Reais
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Fábrica de Verdade, Economia de Verdade — Cada Prancha é Enviada de Nossa Instalação em Weihai</h3>
  items:
    - title: Mesmas Linhas de Produção de Marcas Principais
      description: Nossa fábrica de 12.000 m² em Weihai fabrica pranchas para marcas internacionais e nossos próprios lotes de excedentes nas mesmas linhas, com os mesmos materiais.
    - title: Testadas com 100% de Pressão
      description: Cada prancha é pressurizada a 1,25x PSI nominal e mantida antes do envio. Taxa de defeito de 99,3% por AQL 2,5 / ISO 2859.
    - title: Sem Intermediários
      description: As pranchas são enviadas diretamente da fábrica para sua porta. Sem acréscimos de distribuidor, sem acréscimos de varejo — é assim que os preços de liquidação permanecem até 60% abaixo do varejo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Fábrica de 12.000 m² em Weihai com linhas de produção de infláveis SUP
content_compliance:
  tagline: Conformidade & Comprovação de Qualidade
  title: Qualidade Certificada,<br />Documentada
  subtitle: Cada declaração de conformidade tem suporte de certificados e documentação específica por modelo disponível para sua verificação.
  items:
    - title: ISO 9001:2015
      description: Sistema de gestão da qualidade certificado por TÜV Rheinland/SGS. Auditorias de vigilância anuais. Processos de QC documentados desde a entrada do material até a liberação do envio.
      icon: tabler:certificate
    - title: CE Certificado
      description: 13 modelos CE-certificados SUP conforme as diretivas aplicáveis da UE, cada um com Declaração de Conformidade específica do modelo e dados da placa do fabricante.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Todos os materiais PVC e adesivos cumprem a regulamentação da UE REACH. Marca UKCA disponível para o mercado do Reino Unido. Fichas de dados de segurança dos materiais disponíveis mediante solicitação.
      icon: tabler:shield-check
    - title: Garantia de 2 anos SUP
      description: Cada prancha SUP e acessório têm cobertura de 2 anos — drop-stitch costuras, válvulas de inflação e acessórios incluídos. Solicitações resolvidas rapidamente.
      icon: tabler:lifebuoy
steps:
  title: Do Checkout à Água — Como Seu Pedido É Enviado
  items:
    - title: Passo 1:<span class="font-medium">Escolha sua prancha</span>
      description: Escolha entre modelos all-around, touring, yoga e para crianças. Nossos guias de compra ajudam você a combinar o tamanho e o estilo da prancha com o seu remar.
      icon: tabler:clipboard-list
    - title: Passo 2:<span class="font-medium">Checkout Seguro</span>
      description: Pague com segurança com Stripe ou PayPal. Todos os principais cartões de crédito e débito são aceitos. Nenhuma conta é necessária — a confirmação do pedido será enviada para sua caixa de entrada.
      icon: tabler:file-text
    - title: Passo 3:<span class="font-medium">Inspeção de Qualidade</span>
      description: Cada placa é testada com 100% de pressão a 1,25x do PSI nominal e verificada de acordo com uma lista completa de verificação de qualidade antes de ser embalada.
      icon: tabler:settings
    - title: Passo 4:<span class="font-medium">Despacho Rápido</span>
      description: Pedidos em estoque são enviados de nossa fábrica em Weihai dentro de 2-3 dias úteis. Atendimento expresso disponível para pedidos urgentes.
      icon: tabler:building-factory
    - title: Passo 5:<span class="font-medium">Entrega com rastreamento</span>
      description: Rastreamento de envio mundial para 50+ países. Sua garantia de 2 anos e o suporte pós-venda responsivo começam no dia em que sua prancha chegar.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP processo de pedido desde o checkout seguro até a entrega rastreada mundial
