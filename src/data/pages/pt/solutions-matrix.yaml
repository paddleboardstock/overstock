hero:
  tagline: Matriz de Soluções da Indústria
  title: Soluções marítimas baseadas em cenários<br />Para operações profissionais
  subtitle: Embarcações infláveis e RIBs projetados especificamente para aplicações de resgate, aluguel de frota, iate e pesca comercial - cada um apoiado por especificações técnicas e opções de personalização.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Soluções marítimas profissionais Paddle Board Overstock para diversas indústrias
direct_answer: 'A Paddle Board Overstock oferece embarcações infláveis projetadas em cenários e soluções RIB para operações marítimas comerciais: barcos de resgate e patrulha com tubos Hypalon reforçados e segurança multicâmara, frota de aluguel de SUPs e caiaques com PVC de 1,2 mm e costuras soldadas a ar quente para durabilidade de baixa manutenção, iates de luxo com RIBs de casco de alumínio em V profundo e configurações de pesca para serviço pesado com suportes de vara e sistemas livewell.'
solution_a:
  tagline: Solução A
  title: Resgate Marítimo e<br />Patrulha Comercial
  subtitle: RIBs de segurança multicâmaras de alta velocidade para operações profissionais de resposta a emergências e aplicação da lei.
  badge: Heavy-Duty Series
  description: Nossos RIBs de resgate e patrulha marítima são construídos com tubos de ar Hypalon/PVC reforçados de alta densidade com design de flutuação independente de múltiplas câmaras. Cada embarcação é equipada com fita refletiva de nível profissional, linhas de apoio de resgate e válvulas de enchimento rápido para prontidão para implantação. Os cascos de fibra de vidro Deep-V proporcionam estabilidade excepcional em altas velocidades e em condições de mar agitado.
  features:
    - title: Segurança Multicâmara
      description: 4–6 câmaras de ar independentes – qualquer punção em uma única câmara mantém a flutuação positiva
    - title: Tecido Tubo Reforçado
      description: Hypalon CSM de 1,2 mm ou PVC 1.680 DTEX com costuras soldadas a ar quente de camada dupla
    - title: Grau Profissional
      description: Fita refletiva SOLAS, linhas de apoio de resgate, presilhas de reboque, linha de pintura de liberação rápida
    - title: Casco de alta velocidade
      description: Casco de fibra de vidro ou alumínio Deep-V classificado para 25–45 nós, dependendo da configuração
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Material do casco
      value: Fibra de vidro / alumínio de grau marítimo
    - label: Tecido tubular
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Velocidade máxima
      value: 25–45 nós
    - label: Capacidade
      value: 6–12 pessoas
    - label: Gama de motores
      value: 40–200 CV
    - label: Certificação
      value: CE/ISO 9001
solution_b:
  tagline: Solução B
  title: Aluguel de esportes aquáticos e<br />equipamentos para frota de resort
  subtitle: SUPs, caiaques e barcos infláveis ultraduráveis e de baixa manutenção construídos para aluguel diário em resorts, clubes e operações turísticas.
  badge: Rental-Grade
  description: Nossos equipamentos para frota de aluguel são projetados para maior durabilidade e menor custo de manutenção. Usamos PVC reforçado de 1,2 mm com tecnologia de costura soldada a ar quente de camada tripla que resiste à degradação UV e danos frequentes por colisão. A construção com ponto de gota garante que as placas mantenham a rigidez mesmo após centenas de ciclos de aluguel. Todos os modelos apresentam anéis em D reforçados, faixas de trilho resistentes à abrasão e válvulas de nível comercial.
  features:
    - title: PVC de nível comercial
      description: PVC reforçado de 1,2 mm com estabilizadores UV — 3x mais espesso que materiais de consumo
    - title: Costuras soldadas a ar quente
      description: Soldagem por fusão de camada tripla – mais forte que a ligação adesiva, resiste à delaminação
    - title: Rigidez do ponto solto
      description: Núcleo DTEX de 1.680 com 2 roscas/pol² — classificado para 20 PSI para rigidez semelhante à de um painel duro
    - title: Design pronto para frota
      description: Anéis D reforçados, válvulas comerciais Halkey-Roberts, faixas de trilho resistentes à abrasão
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Material do tubo
      value: PVC reforçado de 1,0–1,2 mm
    - label: Tecnologia de costura
      value: Soldagem a ar quente de camada tripla
    - label: Pressão Máxima
      value: 15–20 PSI (modelos com ponto gota)
    - label: Resistência UV
      value: Mais de 1.000 horas de testes acelerados
    - label: Garantia
      value: 2–5 anos dependendo do modelo
    - label: Manutenção
      value: Mínimo – enxágue e guarde
solution_c:
  tagline: Solução C
  title: Propostas de iates e<br />embarcações de luxo
  subtitle: Tendas RIB leves e de alto desempenho projetadas para armazenamento de super iates e transporte de hóspedes com ajuste e acabamento luxuosos.
  badge: Premium Series
  description: Nossos RIBs para iates combinam construção leve com estética luxuosa. Os cascos de alumínio ou fibra de vidro Deep-V proporcionam uma qualidade de condução excepcional e fácil levantamento do turco. disponível com gráficos de tubo de cores correspondentes, estofamento premium e layouts de console personalizados. As dimensões compactas de armazenamento os tornam ideais para garagens de super iates e armazenamento no convés.
  features:
    - title: Construção leve
      description: Os cascos de alumínio de nível marítimo reduzem o peso em 30% em comparação com a fibra de vidro para facilitar o levantamento
    - title: Desempenho Deep V
      description: Casco com ponto morto de 18 a 22 graus para um passeio suave em cortes e excelente rastreamento
    - title: Ajuste e acabamento luxuosos
      description: Estofamento personalizado, tubos de cor correspondente, console de leme premium, pacote em aço inoxidável
    - title: Armazenamento compacto
      description: Projetado para garagens de super iates – tubos desinfláveis para armazenamento compacto
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Tipo de casco
      value: Deep-V Alumínio / Fibra de Vidro
    - label: Nascer da Morte
      value: 18–22 graus
    - label: Velocidade máxima
      value: 30–40 nós
    - label: Peso Seco
      value: 120–350 kg (casco de alumínio)
    - label: Levantamento de turco pronto
      value: Sim – pontos de elevação padrão
    - label: Armazenar
      value: Tubos desinfláveis, empilháveis
