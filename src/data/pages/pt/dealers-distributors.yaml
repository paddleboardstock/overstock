content_benefits:
  tagline: Benefícios da Parceria
  title: Por que os distribuidores<br />escolhem Aquafarer
  subtitle: Uma parceria concebida para distribuidores marítimos que necessitam de fornecimento confiável, margens competitivas e suporte profissional.
  items:
    - title: Proteção Territorial
      description: Direitos territoriais exclusivos ou semi-exclusivos para distribuidores qualificados. Mapeamento de mercado e gestão de conflitos de canais para proteger seu investimento na construção da marca Aquafarer em sua região.
      icon: tabler:map-pin
    - title: Preços competitivos no atacado
      description: Preços escalonados com base em compromissos anuais de volume. Estrutura de preços que protege as margens, com garantias antecipadas de preços e detalhamento transparente de custos (base FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Kit de suporte de marketing
      description: Fotografia profissional de produtos, folhas de especificações, modelos de documentação de conformidade, conteúdo de mídia social e materiais de marketing de marca conjunta. Atualizado anualmente com lançamentos de novos produtos.
      icon: tabler:photo
    - title: Treinamento Técnico
      description: Treinamento de produto para sua equipe de vendas (virtual ou no local), treinamento de manutenção e reparo para seus técnicos de serviço e perguntas frequentes voltadas para o cliente e guias de solução de problemas.
      icon: tabler:school
    - title: Peças de reposição e pós-venda
      description: Fornecimento dedicado de peças de reposição com envio prioritário. Seções de tubos de reposição, válvulas, aletas e kits de reparo disponíveis para atendimento rápido de pedidos. Suporte ao processamento de reclamações de garantia.
      icon: tabler:tool
    - title: Documentação de Conformidade
      description: 'Pacote completo de documentação de conformidade para o seu mercado: CE DoC, dados da placa do fabricante, manuais do proprietário e suporte de registro regulatório. Elimina sua carga de conformidade.'
      icon: tabler:file-certificate
content_requirements:
  tagline: O que procuramos
  title: Requisitos<br />do Distribuidor
  subtitle: Procuramos parceiros que possam representar e apoiar profissionalmente os produtos Aquafarer no seu território.
  items:
    - title: Conhecimento de território e mercado
      description: Presença consolidada no mercado náutico, de esportes náuticos ou de recreação ao ar livre. Compreensão das regulamentações locais, preferências do consumidor e canais de distribuição de produtos para embarcações.
      icon: tabler:target
    - title: Experiência na Indústria
      description: Mínimo de 2 anos de experiência na distribuição de equipamentos marítimos, outdoor ou esportivos. Histórico comprovado com marcas internacionais e operações de atacado B2B.
      icon: tabler:briefcase
    - title: Showroom ou Armazém
      description: Instalação física para exposição de produtos, armazenamento de estoque e atendimento ao cliente. Capacidade de manter unidades de demonstração e estoque de peças de reposição para seu território.
      icon: tabler:building-store
    - title: Compromisso com os padrões da marca
      description: Disposição para manter os padrões de apresentação da marca Aquafarer, fornecer suporte ao cliente de acordo com nossos protocolos de serviço e participar de atualizações anuais de treinamento de produtos.
      icon: tabler:star
content_process:
  tagline: Processo de inscrição
  title: Processo de inscrição para revendedor em 4 etapas
  subtitle: Desde a consulta inicial até a primeira remessa — um processo de integração simples.
  steps:
    - number: '01'
      title: Consulta Inicial e Qualificação
      description: Envie sua inscrição de distribuidor com detalhes da empresa, território de interesse, linhas de produtos atuais e estimativas de volume anual. Analisamos em até 5 dias úteis.
      timeline: 5 dias
    - number: '02'
      title: Revisão e termos de negócios
      description: Reunião virtual para discutir estratégia territorial, níveis de preços e termos de parceria. Revise os requisitos de documentação de conformidade para o seu mercado. Assinatura do NDA, se necessário.
      timeline: 1-2 semanas
    - number: '03'
      title: Pedido e avaliação de amostras
      description: Faça um pedido inicial de amostra (2 a 5 unidades) com preços de distribuidor para avaliação de mercado e treinamento de equipe. Documentação completa de conformidade e preparação de demonstração incluídas.
      timeline: 30-45 dias
    - number: '04'
      title: Lançamento e suporte de parceria
      description: Primeiro pedido de contêiner com proteção territorial ativada. Kit de marketing entregue, equipe de vendas treinada e gerente de conta dedicado designado. Revisões trimestrais de negócios em andamento.
      timeline: Em andamento
content_application_docs:
  tagline: Documentos de candidatura
  title: Documentos necessários<br />para a candidatura a revendedor
  subtitle: Para candidatar-se a uma concessão Aquafarer, prepare os seguintes documentos e informações para a nossa equipe de análise.
  items:
    - title: Certificado de Registro da Empresa
      description: Documento de registro empresarial válido mostrando a razão social, o endereço registrado e o objeto social cobrindo a distribuição de equipamentos náuticos, esportivos ou de ar livre.
      icon: tabler:file-text
    - title: Plano de Cobertura Territorial
      description: Território geográfico de interesse, rede de varejo ou distribuição existente, segmentos de clientes-alvo e volume anual proposto por categoria de produto (RIB, SUP, caiaque).
      icon: tabler:map
    - title: Capacidade de Showroom ou Armazém
      description: Instalação física para exposição de produtos, armazenamento de estoque e atendimento ao cliente. Fotos ou plantas mostrando a área de demonstração e a capacidade de armazenamento de peças de reposição.
      icon: tabler:building
    - title: Declaração de Capacidade Financeira
      description: 'Referência bancária ou demonstrativo financeiro confirmando a capacidade de fazer um pedido inicial de contêiner e manter estoque. Pedido inicial mínimo: um contêiner de 20 pés (10-20 unidades, modelos mistos).'
      icon: tabler:coin
    - title: Capacidade de Suporte Pós-venda
      description: Técnicos de serviço treinados ou treináveis para manutenção e reparo de barcos infláveis. Capacidade de processamento de reclamações de garantia e compromisso de estoque de peças de reposição.
      icon: tabler:tool
    - title: Referências de Marcas Anteriores
      description: Lista de marcas de equipamentos náuticos ou esportivos distribuídas atualmente ou anteriormente. Referências de contato disponíveis mediante acordo mútuo. Startups sem experiência anterior de distribuição podem qualificar-se com um compromisso financeiro maior.
      icon: tabler:users
faq:
  title: Programa de Concessionária – Perguntas Frequentes
  questions:
    - q: Qual é a quantidade mínima de pedido para distribuidores?
      a: O MOQ do distribuidor começa em 10-20 unidades por pedido, com flexibilidade para modelos mistos (RIB, inflável, SUP). Pedidos iniciais de amostras de 2 a 5 unidades estão disponíveis a preços de distribuidor para avaliação de mercado.
    - q: Vocês oferecem direitos territoriais exclusivos?
      a: Direitos territoriais exclusivos estão disponíveis para distribuidores qualificados que cumpram compromissos anuais de volume e mantenham os padrões da marca. Acordos semi-exclusivos e não exclusivos também estão disponíveis para mercados emergentes.
    - q: Que suporte de marketing você fornece?
      a: Fornecemos um kit de marketing abrangente, incluindo fotografia profissional de produtos, folhas de especificações, modelos de documentação de conformidade, biblioteca de conteúdo de mídia social e materiais de marca conjunta. Atualizado anualmente com lançamentos de novos produtos.
    - q: Como são tratadas as reclamações de garantia?
      a: 'Os distribuidores servem como o primeiro ponto de contato para reclamações de garantia. Fornecemos critérios de garantia claros, protocolos de documentação fotográfica e substituição rápida ou processamento de crédito. Termos de garantia: 5 anos limitados em tecido/costuras/casco do tubo do barco; 2 anos em SUP e acessórios.'
    - q: Posso comercializar produtos Aquafarer com marca própria sob minha própria marca?
      a: Sim, através do nosso programa OEM/ODM. As opções de marca própria incluem gráficos de tubo personalizados, marca do console, embalagem de varejo e documentação de conformidade sob sua marca. Consulte nossa página de serviços OEM/ODM para obter detalhes.
    - q: Que documentação de conformidade está incluída para os distribuidores?
      a: Cada remessa inclui CE DoC específico do modelo, dados da placa do fabricante, manuais do proprietário e documentação de remessa. Também fornecemos suporte de registro regulatório para o seu território e auxiliamos com quaisquer requisitos de conformidade locais.
