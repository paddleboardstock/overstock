hero:
  tagline: Experiência Marinha
  title: Décadas de Engenharia Marinha<br />em Cada Tabuleiro
  subtitle: Paddle Board Overstock Combina ciência profunda de materiais, manufatura de precisão e testes no mundo real para produzir placas que atuam quando realmente importam.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Equipe de engenharia marinha e P&D em ação
expertise_materials:
  tagline: Ciência dos Materiais
  title: Escolhendo o Material Certo<br />para Cada Aplicação
  subtitle: Trabalhamos com três materiais centrais — cada um selecionado para casos de uso específicos e requisitos de desempenho.
  columns: 3
  items:
    - title: Grau Marítimo PVC
      description: Tecido de 1100 PVC deniers — nosso material mais versátil. UV- Estabilizado, resistente à abrasão e comprovado no tempo. Ideal para SUP pranchas onde peso, rigidez e eficiência de custo importam.
      icon: tabler:droplet
    - title: Drop-Stitch Núcleo
      description: Milhares de fios de poliéster conectam as camadas superior e inferior do tecido, permitindo uma inflação de alta pressão (15 PSI) para um passeio rígido e estável que ainda enrola dentro da mochila.
      icon: tabler:building-arch
    - title: EVA Espuma de Deck
      description: Espuma de alta densidade com sulcos EVA oferece aderência em comprimento total, amortecimento para quedas e uma tela para nossos decks art-series característicos.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Capacidades de Fabricação
  title: Manufatura de Precisão<br />A Cada Passo
  subtitle: Nossa instalação de 12.000 m² está equipada com máquinas especializadas para todas as etapas da produção.
  columns: 2
  items:
    - title: CNC Corte
      description: O corte controlado por computador garante painéis de tecido precisos e repetíveis, com mínimo desperdício. Cada peça se encaixa exatamente como projetada.
      icon: tabler:cpu
    - title: Soldagem de Alta Frequência
      description: A soldagem industrial HF cria emendas mais resistentes do que o material base. Controle consistente de temperatura e pressão garante vedações herméticas em cada produção de produção.
      icon: tabler:bolt
    - title: Montagem do núcleo em ponto solto
      description: Milhares de fios de poliéster conectam camadas superiores e inferiores de tecido, permitindo inflação de alta pressão (15-20 PSI) para SUP tábuas e pisos rígidos e estáveis.
      icon: tabler:building-arch
    - title: Teste de pressão
      description: Cada tábua é testada por pressão antes do envio, mantida a 1,25x a pressão nominal — se permanecer ali, funcionará na água.
      icon: tabler:wind
    - title: Teste de Resistência da Costura
      description: Amostras aleatórias de cada lote de produção passam por testes destrutivos de resistência da junção. Os resultados são registrados e rastreáveis a execuções de produção específicas.
      icon: tabler:files
    - title: Testes de Água
      description: Todo design de prancha passa por testes com água real. Remadas no mundo real, em condições costeiras, validam desempenho, manuseio e estabilidade.
      icon: tabler:ripple
expertise_design:
  tagline: Design & Engenharia
  title: Projetado para Condições Reais
  subtitle: Nossa filosofia de design começa com a forma como a prancha será usada — e então constrói a engenharia em torno desse uso.
  items:
    - title: Formato & Contorno da Prancha
      description: Comprimento, largura e rocker são ajustados para o uso pretendido de cada modelo — contornos mais longos para turismo proporcionando deslizamento, formas mais largas para estabilidade e ioga.
    - title: Reforço de Rails & Stringers
      description: Rails reforçados e stringers centrais adicionam rigidez e absorvem impactos — os locais onde as pranchas sofrem mais desgaste temporada após temporada.
    - title: Layout do Deck & Tração
      description: Área de posição, colocação de alças, suportes em D e zonas de tração são projetadas com base nas posturas reais de remada — seja para passeio, pesca ou prática de ioga.
    - title: Arte & Séries de Cor
      description: Arte no deck, esquemas de cores e suportes para acessórios — cada série é projetada para combinar com uma personalidade distinta de remada.
cta:
  title: Tem uma aplicação específica em mente?
  subtitle: Nossa equipe pode ajudá-lo a escolher a prancha, o tamanho e os equipamentos certos para seu estilo de remada.
  actions:
    - variant: primary
      text: Pergunte aos nossos engenheiros
      href: /contact
    - text: Confira a linha de produtos
      href: /products
