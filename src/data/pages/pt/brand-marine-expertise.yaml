hero:
  tagline: Competência Marítima
  title: 'Décadas de Engenharia Naval<br />em Cada Casco'
  subtitle: 'A Paddle Board Overstock combina ciência profunda de materiais, fabricação de precisão e testes no mundo real para produzir embarcações que performam quando importa.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Equipe de engenharia marinha e P&D da Paddle Board Overstock em ação
expertise_materials:
  tagline: Ciência dos Materiais
  title: 'Escolhendo o Material Certo<br />para Cada Aplicação'
  subtitle: 'Trabalhamos com três materiais principais — cada um selecionado para casos de uso específicos e requisitos de desempenho.'
  columns: 3
  items:
    - title: PVC de Grau Marinho
      description: 'Tecido de PVC de 1100 denier — nosso material mais versátil. Estabilizado contra UV, resistente à abrasão e em conformidade com o REACH. Ideal para barcos recreativos, pranchas de SUP e caiaques onde peso e eficiência de custo importam.'
      icon: tabler:droplet
    - title: Hypalon/CSM Premium
      description: 'Superior resistência química e estabilidade UV. Barcos de Hypalon podem durar 15-20 anos com os devidos cuidados. Recomendado para aplicações comerciais, de resgate e militares onde a durabilidade a longo prazo é crítica.'
      icon: tabler:shield
    - title: Fibra de Vidro & Alumínio
      description: 'Cascos de fibra de vidro com V profundo para RIBs e barcos de patrulha — desempenho cortando ondas em condições adversas. Cascos de alumínio para barcos de trabalho comerciais pesados que exigem máxima resistência e capacidade de carga.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capacidades de Fabricação
  title: 'Fabricação de Precisão<br />em Cada Etapa'
  subtitle: 'Nossa instalação de 12.000 m² é equipada com maquinário especializado para cada etapa da produção.'
  columns: 2
  items:
    - title: Corte CNC
      description: 'O corte controlado por computador garante painéis de tecido precisos e repetíveis com desperdício mínimo. Cada peça se encaixa exatamente como projetado.'
      icon: tabler:cpu
    - title: Solda de Alta Frequência
      description: 'A solda HF industrial cria costuras mais resistentes que o material base. O controle consistente de temperatura e pressão garante vedações herméticas em toda a produção.'
      icon: tabler:bolt
    - title: Montagem de Núcleo Drop Stitch
      description: 'Milhares de fios de poliéster conectam as camadas superior e inferior do tecido, permitindo inflação em alta pressão (15-20 PSI) para pranchas de SUP e pisos rígidos e estáveis.'
      icon: tabler:building-arch
    - title: Teste de Pressão
      description: 'Todo produto inflável é testado quanto à pressão antes do envio. Os tubos dos RIBs são testados a 1,25x a pressão nominal — se resistirem, vão performar na água.'
      icon: tabler:wind
    - title: Teste de Resistência de Costura
      description: 'Amostras aleatórias de cada lote de produção passam por testes destrutivos de resistência de costura. Os resultados são registrados e rastreáveis até lotes específicos.'
      icon: tabler:files
    - title: Teste na Água
      description: 'Cada modelo de RIB passa por testes no mar antes da certificação. Testes reais em condições costeiras validam desempenho, manuseio e estabilidade.'
      icon: tabler:ripple
expertise_design:
  tagline: Design & Engenharia
  title: 'Projetado para Condições Reais'
  subtitle: 'Nossa filosofia de design começa com como o barco será usado — e então constrói a engenharia em torno desse caso de uso.'
  items:
    - title: Design de Casco Deep-V
      description: "Nossos cascos de fibra de vidro apresentam ângulos de deadrise calculados, otimizados para o comprimento e o uso pretendido de cada modelo. V mais acentuado para desempenho em águas agitadas, mais raso para estabilidade."
    - title: Segurança Multicâmara
      description: 'Cada barco possui 3-7 câmaras de ar independentes. Se um compartimento for comprometido, as câmaras restantes mantêm o barco flutuando e operacional.'
    - title: Layout Ergonômico
      description: 'Posição do console, altura dos tubos e colocação dos assentos são projetados para o conforto do operador em uso prolongado — seja patrulhando, pescando ou transportando.'
    - title: Configuração Personalizada
      description: 'Cores dos tubos, configuração do console, capacidade de combustível, suportes de acessórios — cada modelo pode ser personalizado para atender a requisitos operacionais específicos.'
cta:
  title: 'Tem uma aplicação específica em mente?'
  subtitle: 'Nossa equipe de engenharia pode orientar sobre seleção de materiais, design e fabricação para o seu projeto.'
  actions:
    - variant: primary
      text: Fale com nossos engenheiros
      href: /contact
    - text: Ver gama de produtos
      href: /products
