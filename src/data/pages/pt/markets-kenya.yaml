hero:
  tagline: Quênia
  title: SUP Placas Atacadistas para<br />Empresas quenianas
  subtitle: Diani, Watamu, Mombasa e Nairobi — operadores de praia, resorts e varejistas que oferecem placas novas de estoque a partir de 5 unidades, modelos mistos.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Painéis de excedente para resorts e operadores de praia do Quênia
direct_answer: Paddle Board Overstock fornece tábuas infláveis novas em folha SUP para empresas quenianas — operadores de praia e resorts em Diani, Watamu, Nyali e na costa ao redor de Mombaça, além de varejistas e escolas que alcançam a crescente comunidade de remadores de Nairóbi. Os pedidos no atacado começam com 5 pranchas com modelos mistos em uma única remessa, enviadas de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada prancha é 100% testada sob pressão e coberta pela Garantia de 2 Anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo ao turismo de praias do Oceano Índico do Quênia e aos acréscimos de safáris-lodges
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado Queniano SUP
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: uma atividade em águas calmas que funciona para hóspedes do resort, dias sem vento nas escolas de kitesurf e remadas ao pôr do sol sobre o recife.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: lodges e acampamentos adicionando sessões de remo aos cardápios de atividades. Entre operadores de praia, hotéis, escolas de kitesurf e mergulho ampliando sua oferta, e uma cena pequena, mas crescente, de canoagem em Nairóbi, os pedidos são pequenos e práticos — de 5 a 15 pranchas de modelos estáveis e duráveis para todas as áreas, com uma ou duas edições premium para exibição.
  customer_types:
    - title: Operadores de praia
      description: Operadores de Diani, Watamu e Mombaça adicionam SUP aluguel e aulas para turistas.
    - title: Resorts & Lodges de Safári e Praia
      description: Resorts e pousadas costeiras adicionando SUP programas para hóspedes com frotas compactas e mistas.
    - title: Escolas de Kitesurf e Mergulho
      description: Escolas de esportes aquáticos existentes ampliam sua oferta com remadas em águas calmas.
shipping_section:
  title: Navio para o Quênia
  paragraphs:
    - Os pedidos são enviados de Weihai, China. O transporte aéreo expresso transporta amostras e 1 a 3 pedidos de embarque para o aeroporto Jomo Kenyatta, em Nairóbi, e para a costa; o Consolidated Sea Freight atende de 5 a 20 pedidos no atacado pelo porto de Mombaça. Estimativas de trânsito para seu destino estão incluídas no seu orçamento.
    - Fornecemos as exigências comerciais de fatura e de lista de embarque, com códigos HS corretos e valores declarados. Taxas e impostos de importação são pagos pelo importador segundo as regras quenianas.
  customs_note: Confirme o tratamento atual de impostos e impostos para equipamentos esportivos com seu agente de compensação antes de fazer o pedido — a estrutura tarifária do Quênia muda periodicamente. Fornecemos documentação completa e consistente para uma liquidação tranquila.
faq_section:
  title: FAQ sobre o Quênia
  items:
    - q: As placas conseguem alcançar Diani ou Watamu diretamente?
      a: Cotações de entrega porta a porta cobrem destinos costeiros, utilizando logística a partir do aeroporto de chegada ou do porto de Mombaça. Indique sua localização exata na consulta e nós definiremos o preço específico.
    - q: Como é um pedido inicial de operador de praia?
      a: 'Normalmente 5 a 10 pranchas: modelos estáveis e completos para aulas de turismo e aluguel, além de uma ou duas edições premium para exibição. Modelos mistos, uma remessa com preço por quantidade total.'
    - q: As tábuas são adequadas para lagoas quentes e águas de recifes-planas?
      a: Sim — condições calmas, quentes e rasas são exatamente para isso que todos os infláveis versáteis SUPs são projetados, e a nadadeira flexível e a construção drop-stitch lidam bem com pousos em areia e recifes rasos.
    - q: Como é cotado o frete para o Quênia?
      a: Transporte expresso aéreo para Nairóbi ou para o litoral para amostras e pedidos pequenos; frete marítimo consolidado para Mombaça para quantidades de atacado. Ambos estão detalhados em sua cotação com tempos estimados de trânsito.
