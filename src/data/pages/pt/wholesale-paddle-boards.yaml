who_section:
  tagline: Para Quem Fornecemos
  title: Feito para Negócios Independentes de Esportes Aquáticos
  items:
    - title: Lojas de Praia e Surf
      description: Pequenos varejistas costeiros que precisam de 5–15 pranchas por temporada, misturadas entre modelos all-around para turistas e pranchas estilo surf para locais.
    - title: Vendedores Online
      description: Lojas de e-commerce e vendedores em marketplaces testando a categoria SUP sem se comprometer com um contêiner completo de um único modelo.
    - title: Frotas de Aluguel e Escolas
      description: Operações de aluguel e escolas SUP reabastecendo frotas — pranchas duráveis, modelos mistos para atender diferentes tamanhos de clientes e garantia de suporte.
    - title: Resorts e Operadores de Turismo
      description: Hotéis, resorts em ilhas e operadores de turismo adicionando SUP ao seu portfólio de atividades com pequenas frotas iniciais e reabastecimento sazonal fácil.
how_to_order:
  tagline: Como funciona
  title: Como Fazer um Pedido por Atacado
  steps:
    - title: Navegue pelo Estoque
      description: Revise os 11 modelos em estoque acima ou use o seletor de modelos mistos para criar uma combinação que se encaixe nos seus clientes.
    - title: Solicite uma Cotação
      description: Envie-nos os modelos, quantidades estimadas, seu país e a velocidade de envio preferida usando o formulário de consulta abaixo. Respondemos com preços unitários e opções de frete.
    - title: Confirmar e Pagar
      description: Aprove a cotação final — modelos, quantidades, método de frete e total. Os termos de pagamento são confirmados na cotação.
    - title: Nós Testamos, Embalamos e Enviamos
      description: Cada prancha é testada 100% com pressão, embalada com seu kit completo de acessórios e despachada de Weihai. Você recebe o rastreamento de toda a jornada.
