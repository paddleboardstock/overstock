hero:
  tagline: Placas Atacadistas SUP
  title: Pranchas infláveis infláveis no atacado<br />para Pequenas Empresas
  subtitle: Placas novas em quantidade SUP adequadas para pequenas empresas. Peça de 5 a 20 tábuas, misture qualquer modelo em uma única remessa e escolha frete expresso aéreo ou marítimo para 50+ países.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Placas infláveis no atacado SUP Paddle Board Overstock prontas para envio
direct_answer: Paddle Board Overstock Fornece placas infláveis novas em estoque SUP para pequenos varejistas ao redor do mundo. Não há um pedido mínimo grande — um pedido atacadista começa com apenas 5 tábuas, e você pode misturar qualquer modelo em estoque em um único pedido. As placas são enviadas de nossa base em Weihai, China, por frete aéreo expresso (1–3 tábuas, amostras ou reabastecimento urgente) ou frete marítimo consolidado (5–20 pedidos de varejistas de tábuas). Cada placa é 100% testada por pressão antes do envio e coberta pela nossa Garantia de 2 anos SUP .
tldr_points:
  - 'Baixo MOQ: os pedidos no atacado começam com 5 tábuas — tamanho para pequenas lojas, não para cargas de contêineres'
  - 'Pedidos mistos de modelos: combine quaisquer modelos em estoque SUP em um único envio'
  - 'Duas opções de transporte: frete aéreo expresso para 1–3 embarques, frete marítimo para 5–20 pedidos de embarque'
  - 'Estoque novo: 100% testado por pressão, 99,3% taxa de aprovação na inspeção final, garantia de 2 anos SUP'
why_retailers:
  title: Por que pequenos varejistas escolhem placas de excesso de estoque SUP
  subtitle: Você não precisa de um orçamento de depósito ou contêineres para comprar no atacado.
  items:
    - title: Quantidades Favoráveis para Pequenas Empresas
      description: O atacado tradicional exige centenas de unidades por pedido. Nosso modelo de excedente de estoque é feito para lojas independentes — comece com 5 placas e aumente seu pedido conforme sua loja cresce.
    - title: Preços Reais no Atacado Sem o Compromisso de Volume
      description: Como vendemos estoque excedente — produção excedente e estoque cuidadosamente obtido de fábricas parceiras selecionadas — você obtém precificação unitária em volume sem o risco de volume.
    - title: Misture modelos para combinar com seus clientes
      description: Lojas de praia, lojas de equipamentos de lagos e lojas da cidade atendem diferentes remadores. Misture modelos para todos os lados, turismo e estilo surf SUP em um único pedido para que sua prateleira atenda à demanda local.
    - title: Novo em folha, nunca usado
      description: Cada placa do nosso estoque excedente é nova e não usada — não segundas, nem devoluções. Cada placa é 100% testada por pressão antes de sair do depósito.
    - title: Envio Internacional Rápido e Flexível
      description: O frete aéreo expresso recebe rapidamente de 1 a 3 pedidos de quadro ou amostras na sua porta; o frete marítimo consolidado mantém o custo por quadro baixo em 5 a 20 pedidos de varejistas de placa.
    - title: Garantido por uma Garantia Real
      description: Atacado não significa sem suporte. Cada SUP placa traz nossa Garantia de 2 anos SUP , a mesma cobertura que oferecemos a todos os clientes em 50+ países.
pricing_section:
  tagline: Preços de atacado
  title: Preços Simples e Transparentes no Atacado
  subtitle: O preço é cotado por pedido com base nos modelos, quantidades e método de envio escolhido. Sem taxas ocultas — o orçamento que você recebe é o preço que você paga.
  points:
    - title: Escalonado por Quantidade
      description: Os preços das unidades diminuem conforme o tamanho do pedido aumenta. Um pedido de 10 conselhos custa melhor por conselho do que um pedido de 5 conselhos; um pedido de 20 conselhos ainda melhor.
    - title: Modelos mistos contam para um total
      description: Seu nível de desconto é baseado no número total de pranchas no pedido — não por modelo. Misturar 4 modelos diferentes × 3 pranchas cada conta como um pedido de 12 pranchas.
    - title: Cotado com Opções de Frete
      description: Cada cotação inclui opções de frete expresso e marítimo com tempos de trânsito estimados, para que você possa escolher o equilíbrio entre velocidade e custo que se encaixa no seu cronograma de reabastecimento.
    - title: Não é Necessário Conta ou Associação
      description: Não há clube atacadista para entrar nem taxa anual. Solicite uma cotação, confirme o pedido e nós enviamos.
