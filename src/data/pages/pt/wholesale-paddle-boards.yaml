faq_section:
  title: FAQ de Atacado
  items:
    - q: Qual é o pedido mínimo por atacado?
      a: Cinco pranchas. Nosso modelo de excesso de estoque é projetado para pequenos varejistas — você não precisa preencher um contêiner para obter preços de atacado.
    - q: Posso misturar diferentes modelos SUP em um pedido por atacado?
      a: Sim. Pedidos com modelos mistos são uma das maiores vantagens de comprar estoque excedente — combine quaisquer modelos em estoque em um único envio, e a contagem total de pranchas determina seu nível de preço. Veja nossa página de atacado com modelos mistos para detalhes.
    - q: As placas são totalmente novas?
      a: Sim. Cada placa é totalmente nova, estoque excedente não utilizado — nunca são de segunda, recondicionadas ou devoluções de clientes. Cada placa é testada a 100% antes do envio.
    - q: Quão mais barato é o atacado em comparação ao varejo?
      a: O preço unitário de atacado é cotado por pedido, com base nos modelos e quantidades, e é significativamente inferior aos preços de varejo listados acima. Solicite um orçamento para a sua combinação desejada e nós cobriremos exatamente o preço.
    - q: Qual método de envio devo escolher?
      a: Frete aéreo expresso é ideal para 1–3 placas, amostras e reposições urgentes. Frete marítimo consolidado é a opção econômica para pedidos de 5–20 placas de varejistas. Cotamos ambas as opções em cada solicitação.
    - q: Qual garantia as placas de atacado possuem?
      a: A mesma Garantia de 2 Anos SUP que oferecemos a todos os clientes, em cada um dos 50+ países para os quais enviamos.
    - q: Vocês enviam para o meu país?
      a: Atualmente, enviamos para mais de 50 países, com guias regionais para América Latina, Sudeste Asiático, África, Oriente Médio e mercados-chave incluindo México, Brasil, Filipinas, Indonésia, Tailândia, África do Sul, Quênia e Emirados Árabes Unidos. Pergunte em sua solicitação de orçamento e confirmaremos o serviço atual para seu endereço.
