hero:
  tagline: Empreendedores de marcas náuticas
  title: Lance sua própria marca de esportes aquáticos<br />com Paddle Board Overstock OEM/ODM
  subtitle: Fabricação de marca própria pronta para uso para vendedores da Amazon, influenciadores externos, distribuidores regionais e proprietários de marcas iniciantes - desde o design do produto até sua primeira remessa.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
