testimonial:
  content: Lancei minha marca SUP sem nenhuma experiência no setor. A equipe da Paddle Board Overstock me orientou desde a seleção do produto até o design personalizado do logotipo e da embalagem. Meu primeiro contêiner chegou em 11 semanas e esgotou em 3 meses na Amazon. Agora estou encomendando meu terceiro contêiner.
  name: Parque Michael
  title: Fundador, Shoreline Paddle Co. - Califórnia, EUA
content_segments:
  tagline: Perfis de empreendedores
  title: Lançamento de marca de esportes aquáticos<br />Por tipo de empreendedor
  subtitle: Diferentes fundadores possuem diferentes pontos fortes – experiência em comércio eletrônico, conexões com o setor, alcance de conteúdo ou infraestrutura de distribuição. Adaptamos o programa de lançamento OEM/ODM para corresponder à sua posição inicial e ambição de crescimento.
  items:
    - title: Amazon FBA e vendedores de comércio eletrônico
      subtitle: Construtores de marca orientados por dados e de rápido escalonamento
      description: Vendedores on-line experientes lançando produtos para esportes aquáticos na Amazon, no Walmart ou em suas próprias lojas do Shopify. Você sabe como otimizar listagens, gerenciar PPC e ler dados de categorias – mas precisa de um parceiro de fabricação que entenda a velocidade do comércio eletrônico, as taxas de retorno e as oscilações sazonais da demanda.
      features:
        - Embalagem pronta para venda a retalho, otimizada para os limites de dimensões da FBA
        - Geração de códigos de barras EAN/UPC e documentação em conformidade com a Amazon
        - MOQ baixo (2–5 unidades por SKU para RIB, 5–10 para SUP) para testar a procura antes de escalar
        - Consolidação de contentores mistos para otimizar o custo unitário em destino
    - title: Influenciadores de fitness e estilo de vida ao ar livre
      subtitle: Criadores de marcas que priorizam o público
      description: Criadores de conteúdo, preparadores físicos e personalidades de atividades ao ar livre com um público engajado e pronto para aderir a uma marca de estilo de vida. Você traz a comunidade e a história da marca – nós cuidamos da engenharia do produto, conformidade, embalagem e logística para que você possa se concentrar no conteúdo e na conversão.
      features:
        - 'Personalização de marca rápida: ciclo de amostras de 2 semanas com logótipo + cores'
        - Edições limitadas co-brandeadas e lançamentos de combinações de cores sazonais
        - Apoio à produção de fotografia lifestyle e conteúdo de vídeo
        - 'Entrega direta ao consumidor: drop shipping da fábrica → ao cliente'
    - title: Distribuidores regionais indo direto ao consumidor
      subtitle: Operadoras B2B lançando sua própria marca
      description: Distribuidores estabelecidos de equipamentos marítimos ou externos que desejam lançar sua própria marca junto ou em vez de revender produtos de terceiros. Você já tem infraestrutura de armazém, relacionamentos logísticos e uma base de clientes – você precisa de um parceiro de fábrica que possa fornecer qualidade de marca própria em grande escala.
      features:
        - Designs de produtos exclusivos para o seu território de mercado
        - Desenvolvimento completo de moldes OEM para formas e especificações proprietárias
        - Documentação de conformidade localizada (CE, UKCA, USCG) para a sua região
        - 'Embalagem co-brandeada: marca do distribuidor + selo de qualidade Paddle Board Overstock'
    - title: Fundadores de marca pela primeira vez
      subtitle: Criação de marca guiada de ponta a ponta
      description: Empreendedores apaixonados com zero experiência no setor de esportes aquáticos que desejam construir uma marca do zero. Você precisa de um parceiro que o acompanhe em todas as etapas — desde a seleção e nomenclatura do produto até o design da embalagem e a logística do primeiro contêiner — com prazos claros e preços transparentes.
      features:
        - Seleção consultiva de produtos entre mais de 50 designs base comprovados
        - 'Pacote de identidade de marca: denominação, logótipo, paleta de cores, design de embalagem'
        - Prazo de 60 a 90 dias do conceito à primeira expedição
        - Gestor de projeto dedicado para proprietários de marcas principiantes
