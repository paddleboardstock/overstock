hero:
  tagline: Histórias de sucesso
  title: Resultados reais de<br />Water Business Builders
  subtitle: Veja como clubes, resorts e empreendedores em todo o mundo construíram operações lucrativas de esportes aquáticos com equipamentos e suporte Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Histórias de sucesso de clientes Aquafarer
stories:
  - title: Como um resort mediterrâneo construiu um negócio lucrativo de aluguel de SUP
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: Estância balnear de 5 estrelas — Grécia
    problem: O resort precisava de atividades aquáticas premium para aumentar os índices de satisfação e criar um novo fluxo de receita, mas faltava equipamento, infraestrutura de segurança e experiência da equipe.
    solution: A Aquafarer entregou 50 pranchas de SUP de marca personalizada com cores e logotipo do resort, sistema de segurança completo, incluindo posto de salva-vidas e linhas de bóias, e um programa de treinamento de equipe de 3 dias cobrindo manuseio de equipamentos, instruções aos hóspedes e protocolos de segurança.
    result:
      - Mais de 300 atividades de hóspedes reservadas por semana no primeiro mês
      - 'Nota de satisfação dos hóspedes nas atividades aquáticas: 4,8/5'
      - 'Nova receita anual acessória: US$ 180 mil'
      - Zero incidentes de segurança na primeira temporada de operação
      - Custo de reposição de equipamentos reduzido em 40% em relação ao fornecedor anterior
    quote:
      text: A Aquafarer não apenas entregou pranchas – eles nos ajudaram a construir uma experiência completa para os hóspedes. Nosso programa de esportes aquáticos passou de zero a destaque em resort em uma temporada.
      author: Gerente Geral do Resort
    cta_text: Monte sua solução para resorts
    cta_href: /solutions/resorts
  - title: Como uma startup australiana construiu uma marca de água em 90 dias
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Empreendedor de primeira viagem - Austrália
    problem: Um entusiasta de atividades ao ar livre queria lançar sua própria marca de SUP para o mercado australiano, mas não tinha experiência em fabricação, não tinha relacionamento com fornecedores e tinha capital limitado.
    solution: O pacote de lançamento da marca Aquafarer forneceu consultoria sobre seleção de produtos, logotipo personalizado e design de cores, embalagem de varejo da marca com etiquetas penduradas, documentação de certificação CE e remessa FOB para Sydney.
    result:
      - Primeiro carregamento de 200 tabuleiros entregue em 75 dias desde o primeiro contato
      - Marca lançada na Shopify + Amazon AU em menos de 2 semanas após a chegada
      - Estoque inicial esgotado em 45 dias
      - 'Margem média: 55% sobre o preço de varejo'
      - 'Segundo pedido: 500 unidades feitas em menos de 60 dias após o lançamento'
    quote:
      text: Tive a ideia da marca, mas nenhum conhecimento de fabricação. Aquafarer literalmente segurou minha mão durante todo o processo – desde a escolha do design certo da placa até a desembalagem da minha primeira remessa. 90 dias do sonho à entrega.
      author: Fundador, marca australiana de SUP
    cta_text: Lance sua marca
    cta_href: /solutions/entrepreneurs
  - title: Como um Thai Beach Club escalou de 10 para 80 tabuleiros
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Clube de esportes aquáticos – Tailândia
    problem: Um pequeno clube de SUP à beira-mar em Phuket precisava passar de uma operação de hobby para um negócio de aluguel profissional atendendo turistas, mas não conseguiu encontrar um fornecedor de equipamentos confiável com qualidade e preços consistentes.
    solution: Começando com o Pacote Aquafarer Club Starter (10 pranchas, remos, equipamentos de segurança, marca), o clube cresceu através do programa Pacote Premium ao longo de 18 meses.
    result:
      - Crescimento de 10 para 80 tabuleiros em 18 meses com qualidade e preços consistentes
      - Adicionaram aluguel de caiaques e barcos a pedais com o mesmo fornecedor
      - A identidade visual personalizada do clube aumentou o reconhecimento da marca entre os turistas
      - Custos de manutenção reduzidos em 60% em comparação com os equipamentos econômicos anteriores
      - Atualmente mais de 150 aluguéis diários na alta temporada
    quote:
      text: O Club Starter Package foi o ponto de entrada perfeito. À medida que o nosso negócio crescia, a Aquafarer crescia connosco — a mesma qualidade, o mesmo preço, sem surpresas.
      author: Proprietário do clube, Phuket
    cta_text: Comece seu pacote para clubes
    cta_href: /solutions/clubs
  - title: Como uma rede de resorts caribenhos padronizou esportes aquáticos em cinco propriedades
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Rede de resorts – Caribe
    problem: Uma rede de resorts de luxo com cinco propriedades precisava de qualidade e marca consistentes de equipamentos para esportes aquáticos em todos os locais, com compras centralizadas e planejamento de substituição sazonal.
    solution: A Aquafarer entregou uma frota multipropriedade de 300 SUPs e 100 caiaques com marca unificada, estoque compartilhado de peças de reposição e cronograma de substituição anual com preços por volume.
    result:
      - Experiência dos hóspedes padronizada em todas as 5 propriedades
      - Redução de custos de 30% por meio de compras consolidadas e preços por volume
      - Um estoque centralizado de peças de reposição reduziu as paradas em 80%
      - O programa anual de renovação de equipamentos eliminou a correria de fim de temporada
      - A participação dos hóspedes em esportes aquáticos aumentou 45% ano a ano
    cta_text: Desenhe seu programa para resorts
    cta_href: /solutions/resorts
