testimonial:
  content: A Aquafarer projetou e equipou todo o nosso programa de atividades na praia em três propriedades do resort. 80 SUPs, 40 caiaques, infraestrutura de segurança e treinamento de pessoal — tudo entregue em uma única remessa. A participação de nossos hóspedes em atividades aquáticas aumentou 60% na primeira temporada.
  name: Sophie Laurent
  title: Diretor de Experiência do Hóspede, Azure Bay Resorts — Phuket, Tailândia
content_segments:
  tagline: Perfis de Resort
  title: Soluções de hospitalidade à beira-mar<br />Por tipo de propriedade
  subtitle: Cada propriedade resort tem um perfil de hóspedes, um mix de atividades e um ritmo operacional únicos – desde pousadas ecológicas boutique até amplos resorts de luxo à beira-mar. Projetamos programas de esportes aquáticos que atendem à classe da propriedade e às expectativas dos hóspedes.
  items:
    - title: Resorts de luxo à beira-mar
      subtitle: Transferências VIP, atividades aquáticas, experiência premium para hóspedes
      description: Propriedades sofisticadas à beira-mar – Four Seasons, Aman e grupos de luxo semelhantes – onde os esportes aquáticos são uma comodidade marcante para os hóspedes, gerando índices de satisfação e receitas auxiliares. A frota deve ter uma aparência premium, oferecer variedade para todas as faixas etárias e níveis de habilidade e integrar-se perfeitamente aos sistemas de concierge e reservas existentes no resort. As expectativas de presença dos hóspedes são extremamente altas – a condição e a apresentação do equipamento afetam diretamente as avaliações 5 estrelas.
      features:
        - 'Frota premium de marca: SUPs, caiaques, pedalinhos e pequenos tenders RIB'
        - 'Apresentação pronta para os hóspedes: cores combinando com o resort, marca com logotipo, exposição cenográfica dos equipamentos'
        - Pequeno RIB de luxo para transferências de hóspedes VIP com estofamento personalizado e cores combinadas
        - 'Infraestrutura de segurança integrada: linhas de bóia, postos de salva-vidas, DEA'
        - 'Gestão de receita: modelos de preços dinâmicos, treinamento de upsell, agrupamento de pacotes'
    - title: Resorts em ilhas privadas
      subtitle: Transporte de hóspedes em qualquer clima — zero tempo de inatividade, confiabilidade absoluta
      description: Os resorts em ilhas privadas operam em locais remotos onde o barco é a única conexão com o continente. As transferências diárias de hóspedes, abastecimentos e evacuações médicas de emergência dependem de um único navio – qualquer tempo de inatividade afeta diretamente a experiência dos hóspedes e as operações do resort. Esses operadores precisam de um barco que funcione de maneira confiável em todas as condições climáticas, que exija manutenção mínima e que tenha sistemas de backup para confiabilidade de missão crítica. O barco também deve apresentar-se lindamente quando os hóspedes chegam à ilha.
      features:
        - Configuração RIB para todas as condições climáticas com proteção climática completa e tubos reforçados
        - Previsão de motor duplo ou motor reserva para operações sem tempo de inatividade
        - Construção em Hypalon de grau comercial para vida útil de 5-8 anos em locais remotos
        - Design de fácil manutenção com componentes acessíveis para manutenção no local
        - Branding personalizado do resort e estofamento premium em harmonia com a estética da ilha
    - title: Beira do lago e resorts ecológicos
      subtitle: Experiências de hóspedes integradas à natureza
      description: Propriedades à beira do lago, pousadas ecológicas e retiros naturais que oferecem atividades aquáticas tranquilas e de baixo impacto que complementam o ambiente natural. Os equipamentos devem ser não motorizados sempre que possível, fáceis de armazenar em casas de barcos com espaço limitado e de uso silencioso para preservar a experiência ambiental para todos os hóspedes.
      features:
        - 'Frota não motorizada: SUPs, caiaques, canoas e pedalinhos'
        - Estações de inflação com bombas elétricas silenciosas para uso dos hóspedes sob demanda
        - Materiais e embalagens ecológicos alinhados à marca de sustentabilidade
        - Inclui suportes de armazenamento e sistemas de organização de casas de barcos
    - title: Clubes de praia
      subtitle: Transferências de hóspedes, entretenimento, pequenos RIBs de luxo
      description: Os clubes de praia operam em um ambiente de alta energia e focado no visual, onde o equipamento faz parte da atmosfera. Eles precisam de pequenos RIBs de luxo para transferências de hóspedes de hotéis ou docas próximas, e brinquedos aquáticos para entretenimento dos hóspedes – reboque de jet ski, escorregadores infláveis e pranchas de remo. A frota deve ter estilo, ser fácil de operar e suportar o uso diário por hóspedes com diversos níveis de habilidade. O armazenamento e a implantação rápida são essenciais durante os horários de pico.
      features:
        - RIB de luxo compacto (3,3-4,3 m) para transferências de hóspedes e serviço de tender
        - 'Brinquedos aquáticos: infláveis rebocáveis, pranchas de SUP, caiaques para o entretenimento dos hóspedes'
        - Cor e marca personalizadas em harmonia com a identidade visual do clube de praia
        - Sistemas de lançamento e recuperação rápidos para operações de alto giro
        - Construção durável em Hypalon para exposição diária à água salgada e aos UV
    - title: Clubes privados e iates clubes
      subtitle: Transporte portuário, propostas para associados, esportes aquáticos exclusivos
      description: Clubes privados onde os desportos aquáticos e o transporte de barco são um benefício para os membros e não um gerador de receitas. Os equipamentos devem atender a padrões estéticos mais elevados, estar disponíveis sob demanda para os membros e exigir supervisão mínima da equipe. Os iate clubes da marina precisam especificamente de licitações para transporte portuário – movimentação de membros entre o cais, o ancoradouro e a costa. O armazenamento e a manutenção devem ser invisíveis para os membros.
      features:
        - Tenders RIB de alto padrão para o transporte portuário e o serviço de transferência de associados
        - 'Equipamentos premium: decks de EVA, cores personalizadas para associados, estofamento com a marca'
        - Sistema de retirada self-service para acesso dos associados sem equipe
        - Armazenamento fora da temporada e programa de atualização anual
    - title: Hotéis focados em aventura e atividades
      subtitle: Visitas guiadas, SUP yoga, excursões de mergulho com snorkel, atividades em grupo
      description: Propriedades se posicionando como destinos de aventura – oferecendo visitas guiadas, SUP yoga, remos ao pôr do sol, excursões de mergulho com snorkel e atividades em grupo. A frota precisa oferecer suporte tanto para modelos de aluguel gratuito quanto para programas guiados, com equipamentos que transitem perfeitamente entre o uso próprio dos hóspedes e passeios guiados por instrutor. Essas propriedades precisam de equipamentos duráveis para rotatividade de alta frequência, com fácil limpeza entre grupos de hóspedes.
      features:
        - Frota mista versátil compatível com modelos de aluguel + tours guiados
        - Caiaques duplos e pranchas de SUP extra estáveis para atividades em grupo
        - 'Equipamentos para guias: pranchas de instrutor, caixas secas, comunicadores à prova d''água'
        - 'Rotação sazonal de equipamentos: frota de verão → programa de armazenamento de inverno'
        - Construção durável certificada para uso diário pelos hóspedes com manutenção mínima
