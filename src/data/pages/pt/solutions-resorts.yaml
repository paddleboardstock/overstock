testimonial:
  content: Paddle Board Overstock projetou e equipou todo o nosso programa de atividades de praia em três propriedades de resort. 120 SUPs, infraestrutura de segurança e treinamento de equipe — tudo entregue em um único envio. A participação dos nossos hóspedes em atividades aquáticas aumentou 60% na primeira temporada.
  name: Sophie Laurent
  title: Diretor de Experiência do Hóspede, Azure Bay Resorts — Phuket, Tailândia
content_segments:
  tagline: Perfis de Resort
  title: Waterfront Hospitality Solutions<br />Por Tipo de Propriedade
  subtitle: Cada propriedade resort tem um perfil de hóspedes, um mix de atividades e um ritmo operacional únicos – desde pousadas ecológicas boutique até amplos resorts de luxo à beira-mar. Projetamos programas de esportes aquáticos que atendem à classe da propriedade e às expectativas dos hóspedes.
  items:
    - title: Resorts de luxo à beira-mar
      subtitle: Transferências VIP, atividades aquáticas, experiência premium para hóspedes
      description: Propriedades sofisticadas à beira-mar – Four Seasons, Aman e grupos de luxo semelhantes – onde os esportes aquáticos são uma comodidade marcante para os hóspedes, gerando índices de satisfação e receitas auxiliares. A frota deve ter uma aparência premium, oferecer variedade para todas as faixas etárias e níveis de habilidade e integrar-se perfeitamente aos sistemas de concierge e reservas existentes no resort. As expectativas de presença dos hóspedes são extremamente altas – a condição e a apresentação do equipamento afetam diretamente as avaliações 5 estrelas.
      features:
        - Frota premium de SUPs em cores combinando com o resort
        - 'Apresentação pronta para hóspedes: cores combinando com o resort, marca/logo, exibição de equipamentos encenada'
        - Pranchas da série de arte exclusiva para experiências premium dos hóspedes e momentos de foto
        - 'Infraestrutura de segurança integrada: linhas de boias, postos de salva-vidas, DEA'
        - 'Gestão de receita: templates de precificação dinâmica, treinamento de upsell, pacotes agrupados'
    - title: Resorts em ilhas privadas
      subtitle: Atividades aquáticas tranquilas e autossuficientes para hóspedes
      description: 'Resorts privados em ilhas operam em locais remotos, onde a logística é complexa e cada entrega conta. As atividades aquáticas para hóspedes precisam ser autossuficientes: equipamentos que armazenam de forma compacta, inflam sob demanda, exigem manutenção mínima e se apresentam lindamente quando os hóspedes chegam. Planejamos programas de frota em torno das janelas de hidroaviões e cargas marítimas, e nossa construção durável mantém os equipamentos prontos para visitantes durante longas temporadas sem apoio do continente.'
      features:
        - Frota inflável compacta — navios e suprimentos de forma eficiente em ilhas remotas
        - Construção de grau PVC comercial para uso de hóspedes em várias temporadas
        - Manutenção fácil no local com kits de reparo incluídos e orientação em vídeo
        - Marca personalizada de resort combinando com a estética da ilha
    - title: Beira do lago e resorts ecológicos
      subtitle: Experiências de hóspedes integradas à natureza
      description: Propriedades à beira do lago, eco-lodges e retiros naturais oferecem atividades aquáticas tranquilas e de baixo impacto que complementam o ambiente natural. Os equipamentos devem ser não motorizados sempre que possível, fáceis de armazenar onde o espaço é limitado e silenciosos no uso para preservar a experiência ambiente de todos os hóspedes.
      features:
        - Frota não motorizada SUP em série de arte inspirada na natureza
        - Estações silenciosas de inflação de bombas elétricas para uso sob demanda por convidados
        - Materiais e embalagens ecológicos alinhados com a marca de sustentabilidade
        - Estantes de armazenamento e sistemas de organização no cais incluíam
    - title: Clubes de praia
      subtitle: Entretenimento para convidados e atmosfera à beira-mar
      description: Os clubes de praia operam em um ambiente energético e focado em visuais, onde equipamentos fazem parte do ambiente. Eles precisam de pranchas de remo estilosas para entretenimento dos convidados, SUP aluguel para atividades à beira-mar e equipamentos que sejam tão bons quanto o próprio local. A frota deve ser fácil de operar, suportar o uso diário de hóspedes com diferentes níveis de habilidade e ser implantada rapidamente durante os horários de pico.
      features:
        - Séries de arte SUPs assinaturas que também servem de decoração para locais
        - Frota pronta para aluguel SUP e entretenimento para convidados
        - Cor personalizada e marca combinando com a identidade visual do clube de praia
        - Sistemas de lançamento e recuperação rápida para operações de alta rotatividade
        - UV construção - resistente para exposição diária à água salgada
    - title: Clubes privados e iates clubes
      subtitle: Esportes aquáticos para membros e programas exclusivos de remo
      description: Clubes privados onde esportes aquáticos são um benefício para os membros e não uma fonte de receita. Os equipamentos devem atender a padrões estéticos mais altos, estar disponíveis sob demanda para os membros e exigir supervisão mínima de pessoal. Clubes de iates da marina utilizam SUP frotas de marca para recreação dos membros ao redor do porto. Armazenamento e manutenção devem ser invisíveis para os membros.
      features:
        - SUP Frotas premium para esportes aquáticos associados
        - 'Equipamentos premium: EVA decks, cores personalizadas dos membros, estofamento com marca'
        - Sistema de check-out self-service para acesso dos membros sem equipe
        - Armazenamento fora de temporada e programa anual de renovação
    - title: Hotéis focados em aventura e atividades
      subtitle: Visitas guiadas, SUP yoga, excursões de mergulho com snorkel, atividades em grupo
      description: Propriedades se posicionando como destinos de aventura – oferecendo visitas guiadas, SUP yoga, remos ao pôr do sol, excursões de mergulho com snorkel e atividades em grupo. A frota precisa oferecer suporte tanto para modelos de aluguel gratuito quanto para programas guiados, com equipamentos que transitem perfeitamente entre o uso próprio dos hóspedes e passeios guiados por instrutor. Essas propriedades precisam de equipamentos duráveis ​​para rotatividade de alta frequência, com fácil limpeza entre grupos de hóspedes.
      features:
        - Frota mista versátil apoiando modelos de passeios guiados +
        - Plataformas extra-estáveis SUP para atividades em grupo
        - "Equipamento do guia: pranchas de instrutor, caixas secas, comunicações à prova d'água"
        - 'Rotação de equipamentos sazonal: frota de verão → programa de armazenamento de inverno'
        - Construção durável classificada para uso diário de hóspedes com manutenção mínima
