hero:
  tagline: África do Sul
  title: SUP Placas Atacadistas para<br />Varejistas sul-africanos
  subtitle: Oficinas e operadores da Cidade do Cabo, Durban e Garden Route — pranchas paddle novas em excesso de 5 unidades, modelos mistos, enviadas da China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Placas de excedentes SUP de estoque para varejistas e operadores sul-africanos
direct_answer: Paddle Board Overstock fornecem tábuas infláveis novas em folha SUP para empresas sul-africanas — lojas e escolas na Cidade do Cabo, Durban e ao longo da Garden Route, operadores de aluguel e vendedores online. Os pedidos no atacado começam com 5 tábuas com modelos mistos em uma única remessa, enviadas de Weihai, China, por frete aéreo expresso ou frete marítimo consolidado. Cada prancha é 100% testada pela pressão e coberta pela Garantia de 2 anos SUP .
tldr_points:
  - Atacado a partir de 5 placas — modelos mistos, precificados por quantidade total
  - Atendendo ao mercado de varejo de esportes de board mais consolidado da África
  - Transporte aéreo expresso ou marítimo consolidado de Weihai, China
  - 100% testado pela pressão, garantia de 2 SUP anos em todas as placas
overview_section:
  tagline: Visão Geral do Mercado
  title: O Mercado Sul-Africano SUP
  paragraphs:
    - A África do Sul possui o mercado de esportes de plonga mais maduro do continente. A Cidade do Cabo combina pistas de surf de classe mundial e lagoas de águas calmas com uma cultura de surf profundo; Durban possui praias de águas quentes o ano todo; as lagoas de knysna e a Baía de Plettenberg da Garden Route são feitas para redemo. Uma infraestrutura comercial bem estabelecida e uma verdadeira comunidade local de remadores — de SUP surfistas a remadores de fitness em águas calmas — diferenciam esse mercado.
    - Buyers here are seasoned: lojas de surf com pisos de varejo reais, escolas de remo com frotas e operadores de aventura combinando SUP com passeios de caiaque e ciclismo. Eles avaliam equipamentos como profissionais — construção, garantia e reparabilidade — e encomendam em pequenos lotes deliberados de 5 a 20 pranchas, misturando all-around de alugado com edições premium para a garagem.
  customer_types:
    - title: Lojas de Surf & Paddle
      description: Estabeleciu varejistas da Cidade do Cabo e Durban, adicionando ou SUP expandindo linhas para a comunidade local de canoagem.
    - title: Escolas de Remo e Aluguel
      description: Escolas e frotas de aluguel em lagoas e praias de águas calmas renovando tábuas em um ciclo real de substituição.
    - title: Operadores de Aventura
      description: Operadores de Garden Route e Western Cape ampliando SUP as opções de aventura multi-atividade.
shipping_section:
  title: Navio para a África do Sul
  paragraphs:
    - Os pedidos são enviados de Weihai, China. O transporte aéreo expresso transporta amostras e 1–3 pedidos de embarque para Joanesburgo e Cidade do Cabo; o frete marítimo consolidado atende de 5 a 20 pedidos no atacado por Durban, Cidade do Cabo e outros portos. Estimativas de trânsito para seu destino estão incluídas na sua cotação.
    - Fornecemos as exigências comerciais de fatura e de lista de embalagem, com códigos HS corretos e valores declarados. Taxas de importação e IVA são pagas pelo importador segundo as regras sul-africanas.
  customs_note: A liberação do SARS é baseada em documentação — confirme o tratamento atual de impostos e IVA para equipamentos esportivos infláveis com seu agente de compensação antes de fazer o pedido. Fornecemos documentação completa e consistente e respondemos rapidamente aos pedidos dos corretores.
faq_section:
  title: Perguntas Frequentes sobre a África do Sul
  items:
    - q: As pranchas se encaixam nas condições mistas da Cidade do Cabo?
      a: Sim. Modelos completos suportam águas calmas em lagoas e dias calmos na costa, e a linha inclui pranchas voltadas para turismo para remadas mais longas. Para descidas em mar aberto a favor do vento, remadores experientes devem discutir seu caso de uso específico conosco antes de fazer o pedido.
    - q: Como é um pedido de loja?
      a: 'Normalmente de 5 a 20 placas: uma base de modelos completos para aulas e aluguel, além de edições artísticas premium para a parede de varejo — modelos mistos, uma remessa, precificada por quantidade total.'
    - q: Como é cotada a carga para a África do Sul?
      a: Envie por via aérea para Joanesburgo ou Cidade do Cabo para amostras e pequenos pedidos; frete marítimo consolidado para Durban ou Cidade do Cabo para quantidades por atacado. Ambos estão detalhados em sua cotação com os prazos de trânsito estimados.
    - q: Quem cuida dos direitos de importação e do IVA?
      a: Você, como importador, através do seu agente de desembaraço segundo as regras da SARS. Nós fornecemos a fatura comercial e a lista de embalagem com os códigos HS corretos e os valores declarados.
