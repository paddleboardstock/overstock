faq:
  title: Perguntas frequentes sobre pacotes
  questions:
    - q: Qual é a quantidade mínima de pedido para pacotes?
      a: O Pacote Club Starter tem no mínimo 10 unidades. Os pacotes Resort e Brand são personalizados de acordo com suas necessidades com MOQs flexíveis.
    - q: Quanto tempo leva a entrega?
      a: A produção padrão leva de 30 a 45 dias a partir da confirmação do pedido. A produção acelerada está disponível por uma taxa adicional.
    - q: Posso personalizar as cores e a marca do equipamento?
      a: Sim. Todos os pacotes incluem personalização total – cores do cartão, impressão de logotipo e design de embalagem.
    - q: Você fornece suporte pós-venda?
      a: Sim. Cada pacote inclui acesso aos nossos guias de manutenção on-line, tutoriais em vídeo e sistema de pedido de peças de reposição.
