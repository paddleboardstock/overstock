hero:
  tagline: Laboratório de Controle de Qualidade
  title: Laboratório de Testes e Garantia de Qualidade
  subtitle: Laboratório independente de qualidade — cada unidade testada antes do envio
intro: Paddle Board Overstock Opera um laboratório dedicado de controle de qualidade que opera independentemente da produção. Cada lote de matéria-prima e cada placa finalizada passa por protocolos de inspeção documentados antes da liberação. Nossa equipe de controle de qualidade reporta diretamente à gerência, garantindo decisões imparciais de qualidade.
highlights:
  - value: 100%
    label: Unidades testadas sob pressão
    detail: Cada câmara, cada tabuleiro
  - value: 48 h
    label: Duração do teste de retenção de ar
    detail: A 1,25× pressão nominal
  - value: '&lt;5%'
    label: Max permitiu a queda de pressão
    detail: Período de espera de mais de 24 horas
  - value: 99.3%
    label: Taxa sem defeitos
    detail: Remessas finais de 12 meses
test_procedures:
  - title: Inspeção de Matéria-Prima
    description: Cada lote recebido de PVC drop-stitch tecido, EVA espuma e ferragens é testado antes da aceitação. Resistência à tração, resistência a rasgos e UV resistência são verificadas. Materiais não conformes são colocados em quarentena e devolvidos.
    standards:
      - Resistência à tração (mínimo de 350 N/cm)
      - Resistência a rasgos
      - UV Resistência (1.000 h)
  - title: Checkpoints de controle de qualidade em processo
    description: Os operadores de produção realizam autoinspeção em cada etapa. Auditores de controle de qualidade realizam amostragens aleatórias durante todo o turno. Testes de descascamento de solda são realizados a cada 50 unidades. Verificações dimensionais acontecem a cada 20º painel.
    standards:
      - Teste de descascamento a cada 50 unidades
      - Checklist interno de 100 pontos
      - Auditorias de amostragem aleatória
  - title: Teste de Retenção de Ar de 48 Horas
    description: Cada câmara de tubo é inflada a 125% da pressão nominal e mantida por 48 horas. Sensores de pressão registram continuamente com compensação de temperatura. Qualquer câmara que ultrapasse 5% de queda de pressão aciona a reinspeção automática em lote.
    standards:
      - 1,25x a pressão nominal
      - <5% de queda máxima de pressão
  - title: Teste de Carga e Equilíbrio
    description: As placas finalizadas são testadas na capacidade máxima nominal para estabilidade, bordo livre e manuseio. Cada placa passa por testes de água antes da aprovação final da inspeção.
    standards:
      - Verificação de carga nominal 1,25x
      - Teste de água
equipment:
  - name: Máquina de Teste Universal (tração)
    spec: Capacidade de 5 kN
  - name: Testador de Decaimento de Pressão
    spec: Multicanal, 0–50 psi, registro de dados
  - name: Câmara de Intemperismo
    spec: UVA-340, 1.000 ciclos
  - name: Medidor de Espessura (digital)
    spec: Resolução de 0,01 mm
  - name: Testador de Desprendimento (solda)
