hero:
  tagline: Guias
  title: Novo no SUP?
  subtitle: Guias práticos para ajudá-lo a escolher, usar e desfrutar de equipamentos infláveis para esportes aquáticos.
size_guide:
  tagline: Tamanho e especificações
  title: Encontre o tamanho certo para suas necessidades
  desc: Compare as dimensões do produto, capacidades de peso e usos recomendados. Se você precisa de um SUP de turismo, um caiaque compacto ou um RIB comercial, nosso guia de tamanhos ajuda você a escolher o ajuste certo.
  link_label: Guia em tamanho grande com especificações do produto →
  link: /size-guide
  cards:
    - title: Pranchas SUP
      desc: Escolha o comprimento com base no seu peso e uso pretendido. Pranchas mais largas (32"+) oferecem mais estabilidade. Pranchas mais longas (11–12 pés) são melhores para passeios.
    - title: Caiaques
      desc: Caiaques individuais (9 pés) para viagens individuais e rios. Caiaques tandem (12 pés) para dois remadores ou um com equipamento. Verifique sempre a capacidade de peso.
    - title: Botes e RIBs
      desc: Escolha o comprimento de acordo com a contagem de passageiros e uso. RIBs maiores (4,5 m+) para offshore e resgate. Botes menores (2,7 m) como tenders e plataformas de pesca.
