hero:
  tagline: Guias
  title: Novo no SUP?
  subtitle: Guias práticos para ajudá-lo a escolher, usar e desfrutar de equipamentos infláveis ​​para esportes aquáticos.
size_guide:
  tagline: Tamanho e especificações
  title: Encontre o tamanho certo para suas necessidades
  desc: Compare as dimensões da prancha, a capacidade de peso e os usos recomendados. Quer você queira uma prancha estável para todos os usos ou um modelo mais rápido para passeios — nosso guia de tamanho ajuda a escolher o ajuste certo.
  link_label: Guia em tamanho grande com especificações do produto →
  link: /size-guide
  cards:
    - title: Pranchas All-Around SUP
      desc: Nossas pranchas de ~11 pés (32" de largura) equilibram estabilidade, velocidade e capacidade. O núcleo de 6 polegadas drop-stitch a 15 PSI mantém o deck rígido para remadores de todos os níveis.
    - title: Largura e Estabilidade
      desc: Pranchas mais largas (32"+) oferecem mais estabilidade para iniciantes, yoga e pesca. A espessura de 6 polegadas adiciona rigidez e capacidade de peso para o praticante e equipamentos.
    - title: Pacotes e Acessórios
      desc: Cada prancha é enviada como um pacote completo — prancha, mochila de viagem, bomba manual, remo ajustável, quilha removível, leash e kit de reparo. Verifique a carga máxima para o praticante e equipamentos.
