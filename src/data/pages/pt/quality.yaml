tests:
  - title: Teste de pressão
    standard: ISO 6185-1 | Especificações internas AF-PT-001
    description: As câmaras infláveis ​​são pressurizadas a 1,25x o limite operacional recomendado e mantidas por 30 minutos. A queda de pressão é medida para validar a estanqueidade e a integridade estrutural de materiais e costuras.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Teste de impacto
    standard: Especificações internas AF-IT-002
    description: Os produtos são submetidos a impactos controlados por meio de pesos de queda padronizados e aparelhos de pêndulo. Isso avalia a resistência à perfuração, a propagação do rasgo e a resiliência estrutural contra colisões com obstáculos, docas e detritos.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: Teste de resistência UV
    standard: ASTM G154 | ISO 4892-3
    description: Amostras de materiais são expostas a lâmpadas UVA-340 em câmaras de intemperismo acelerado por mais de 1.000 horas. Medimos a mudança de cor (Delta E), a retenção de brilho e a perda de resistência à tração para validar pacotes de estabilizadores UV.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Teste de resistência à abrasão
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Amostras de materiais são submetidas a rodas abrasivas CS-10 sob cargas de 500g/1.000g por 1.000 ciclos. A perda de massa e a classificação de desgaste visual determinam a durabilidade do revestimento contra areia, cascalho e lançamentos repetidos.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Teste de desempenho em baixa temperatura
    standard: Especificações internas AF-LT-003 | MIL-STD-810G
    description: Os produtos montados e os cupons de materiais são condicionados a -20°C, -10°C e 0°C por 24 horas e depois testados quanto à flexibilidade. Verificamos que PVC e Hypalon permanecem flexíveis sem rachaduras ou delaminação.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Teste de flutuabilidade e capacidade de carga
    standard: ISO 6185-1 | ISO 12402
    description: Os produtos são carregados de forma incremental até 1,25x a capacidade nominal em um pool controlado. Borda livre, estabilidade e desempenho de autodrenagem são registrados. A capacidade nominal de cada modelo é verificada matematicamente e empiricamente.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Teste de manobrabilidade
    standard: Especificações internas AF-MT-004
    description: Os testes na água medem o raio de giro, a aceleração, o tempo de planejamento e a resposta do remo/motor em uma variedade de condições de carga. As características de manuseio no mundo real são validadas em relação aos objetivos do projeto.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Teste de estanqueidade
    standard: ISO 6185-1 §7.3 | Especificações internas AF-WT-005
    description: Cada produto montado é testado em spray a 0,5 bar em todas as costuras, válvulas e conexões. Um teste de submersão pressurizada de 5 minutos valida a estanqueidade da câmara e da válvula. Padrão de vazamento zero antes do envio.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
