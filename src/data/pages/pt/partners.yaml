hero:
  tagline: Parcerias e Distribuição
  title: 'Torne-se um Parceiro Aquafarer<br />— Rede Global de Distribuição'
  subtitle: "Junte-se à rede global de parceiros da Aquafarer. Trabalhamos com distribuidores náuticos, revendedores de barcos, lojistas de equipamentos e parceiros de marca em mais de 50 países."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Rede global de parceiros e distribuidores da Aquafarer
content_programs:
  tagline: Programas de Parceria
  title: 'Programas de Parceria<br />Pensados para o Crescimento'
  subtitle: 'Seja você um distribuidor, revendedor ou parceiro de marca, a Aquafarer oferece programas desenhados para apoiar o seu negócio.'
  columns: 3
  items:
    - title: Programa de Distribuidores
      description: 'Distribuição exclusiva por território com preços por volume, apoio de marketing e acesso direto à fábrica. Compromisso mínimo exigido conforme o tamanho do território.'
      icon: tabler:world
    - title: Programa de Revendedores
      description: 'Preços diretos de revenda, formação de produto, materiais de marketing e suporte de garantia para lojas físicas e lojas online.'
      icon: tabler:building-store
    - title: Parceria OEM/ODM
      description: 'Manufatura OEM e ODM completa com marca própria, embalagem personalizada e especificações de produto. Do conceito ao contêiner.'
      icon: tabler:certificate
    - title: Parceria de Marca
      description: 'Programas de co-branding, marca própria e modelos exclusivos para marcas consolidadas nos segmentos náutico e de recreação ao ar livre.'
      icon: tabler:stars
    - title: 'Governo e Instituições'
      description: 'Programas de fornecedor preferencial para órgãos governamentais, guardas costeiras, forças armadas e organizações humanitárias. Documentação pronta para licitações.'
      icon: tabler:building-community
    - title: 'Parceiro de Resorts e Aluguel'
      description: 'Preços de frota, qualidade consistente e marca personalizada para resorts, centros de mergulho e operações de aluguel em todo o mundo.'
      icon: tabler:sun
content_benefits:
  tagline: Por que fazer parceria conosco
  title: 'Por que os Parceiros Escolhem a Aquafarer'
  subtitle: 'Nossos parceiros beneficiam de capacidade real de fabricação, qualidade consistente e suporte responsivo.'
  list:
    - 'Acesso Direto à Fábrica: Trabalhe diretamente com nossa equipe de manufatura — sem intermediários. Obtenha respostas mais rápidas, melhores preços e total visibilidade da produção.'
    - 'Pronto para Personalização: Marque seus produtos com cores, logotipos, embalagens e especificações personalizadas. Quantidades mínimas de pedido adaptadas ao seu mercado.'
    - 'Qualidade Garantida: Produção certificada ISO 9001 com conformidade CE, UKCA e BSCI. Cada produto testado antes do envio.'
    - 'Logística Global: Envio a partir de Qingdao, China com opções FOB, CIF e DDP. Armazém nos EUA em Montclair, CA para distribuição na América do Norte.'
    - 'Apoio de Marketing: Catálogos de produtos, fotografia, documentação técnica e ativos digitais para apoiar seus esforços de venda.'
    - 'Formação e Suporte: Formação de produto para sua equipe de vendas, suporte técnico para seus clientes e coordenação de serviços de garantia.'
content_process:
  tagline: Como se Tornar um Parceiro
  title: 'Processo de Parceria Simples'
  subtitle: 'Nosso processo de parceria é direto — desenhado para você começar a vender produtos Aquafarer rapidamente.'
  items:
    - title: 'Passo 1: Envie a Candidatura'
      description: 'Preencha nosso formulário de candidatura de parceiro com o perfil da sua empresa, mercado-alvo e produtos de interesse.'
    - title: 'Passo 2: Análise de Qualificação'
      description: 'Nossa equipe de parcerias analisa a sua candidatura e entra em contato em até 3 dias úteis para discutir oportunidades.'
    - title: 'Passo 3: Acordo e Configuração'
      description: 'Assine o acordo de parceria, configure sua conta e receba preços de parceiro, materiais de marketing e amostras de produtos.'
    - title: 'Passo 4: Formação e Lançamento'
      description: 'Formação de produto, apoio de vendas e materiais de marketing fornecidos. Você está pronto para começar a vender.'
cta:
  title: 'Pronto para se tornar um parceiro Aquafarer?'
  subtitle: 'Candidate-se à parceria e nossa equipe responderá em até 3 dias úteis.'
  actions:
    - variant: primary
      text: Candidatar-se à parceria
      href: /contact
    - text: Ver os nossos produtos
      href: /products
