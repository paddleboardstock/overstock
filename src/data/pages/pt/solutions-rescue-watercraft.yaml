content_challenge:
  tagline: O desafio
  title: Operações de Resgate Exigem<br />Confiabilidade Sem Compromissos
  subtitle: As organizações de busca e salvamento operam sob extrema responsabilidade de segurança – cada falha de barco acarreta consequências inaceitáveis.
  paragraphs:
    - Nas operações de resgate, a margem entre o sucesso e o fracasso é medida em minutos. O barco deve estar pronto para lançamento imediato, operar em condições adversas e retornar em segurança com os passageiros. A responsabilidade pela segurança é absoluta – uma falha mecânica durante uma missão de resgate não é um custo de reparo, é uma vida perdida.
    - SAR os barcos necessitam de alta velocidade para chegar rapidamente às vítimas, combinada com estabilidade excepcional para operações de recuperação seguras. Eles devem transportar equipamentos de resgate, suprimentos médicos e equipamentos de comunicação – muitas vezes em espaço limitado no convés. Os barcos que operam no serviço público também necessitam de uma longa vida útil (10-15+ anos) para justificar os orçamentos de compras públicas.
    - A visibilidade, tanto para o operador quanto para as buscas, é crítica. O design do console deve proporcionar visibilidade de 360 graus, e o barco deve ser altamente visível para aeronaves e outras embarcações.
    - Os RIBs de resgate da Aquafarer são projetados da quilha para cima para esses requisitos — com deques autodrenantes, cascos reforçados, conjuntos de navegação e postes de reboque como padrão nos modelos de patrulha.
content_solution:
  tagline: Nossa solução
  title: RIBs de Resgate de Propósito Específico
  subtitle: Cada barco de resgate Aquafarer é projetado para atender ou exceder os padrões SOLAS e nacionais de SAR.
  list:
    - Deck autodrenante — a água escoa automaticamente para estabilidade durante operações de recuperação
    - Casco deep-V reforçado — capacidade em águas agitadas com manuseio previsível em alta velocidade
    - Conjunto completo de luzes de navegação — operação dia e noite em todas as condições meteorológicas
    - Poste e cabo de reboque — pronto para reboque de embarcações ou operações com trenós de resgate
    - Placas de montagem de equipamentos — rádio, holofote, sirene e equipamentos médicos
    - Múltiplas configurações de motor — motor de popa único ou redundância de motores gêmeos
    - Cores de tubos de alta visibilidade — laranja, amarelo ou vermelho para máxima visibilidade
content_segments:
  tagline: Perfis de resgate
  title: Soluções para embarcações de busca e resgate<br />Por tipo de organização
  subtitle: Diferentes organizações de resgate operam sob diferentes mandatos, ciclos orçamentais e ambientes operacionais – desde tripulações costeiras voluntárias até frotas da guarda costeira nacional. Configuramos cada resgate RIB para corresponder ao perfil da missão.
  items:
    - title: Guarda Costeira e Agências Governamentais SAR
      subtitle: Responsabilidade absoluta pela segurança — padrões de frota de missão crítica
      description: As agências governamentais SAR assumem a mais alta responsabilidade pela segurança nas operações marítimas. Cada barco deve funcionar perfeitamente em condições extremas – a falha do equipamento durante uma missão de resgate não é uma opção. As decisões de aquisição são orientadas pelo custo total de propriedade ao longo de 10 a 15 anos de vida útil, e não pelo preço inicial. As agências precisam de embarcações que sobrevivam a anos de patrulha costeira, que cumpram normas nacionais rigorosas e que proporcionem um desempenho consistente em estações distribuídas. Documentação de conformidade abrangente e contratos de serviço plurianuais são obrigatórios.
      features:
        - Pacote de documentação de conformidade com padrões SOLAS e nacionais SAR
        - Comunalidade de peças em toda a frota — reduza a complexidade do inventário em nível de estação
        - Configuração bimotor para redundância de missão crítica
        - Projeto de vida útil de 10 a 15 anos com programas de manutenção programada
        - Capacidade para qualquer clima - casco deep-V reforçado para condições de mar agitado
    - title: Serviços de salva-vidas e resgate na praia
      subtitle: Operações de lançamento rápido em águas rasas
      description: Serviços de salva-vidas municipais e à beira-mar que necessitam de embarcações de resposta rápida que possam navegar através de zonas de arrebentação, operar em águas costeiras rasas e alcançar nadadores ou embarcações em perigo em poucos minutos. O equipamento deve ser leve o suficiente para ser rebocado na praia por um veículo pequeno ou manualmente.
      features:
        - Casco RIB de calado raso para zona de arrebentação e operação costeira
        - Lançamento de praia com alça de elevação de proa e proteção de quilha
        - Trenó de resgate integrado ou plataforma de nadador de resgate
        - Padrão de cores de tubo laranja ou amarelo de alta visibilidade
    - title: Departamentos de resgate de bombeiros
      subtitle: Integração de bomba de incêndio, montagem de equipamentos, resposta rápida
      description: As unidades marítimas de resgate de incêndio respondem a incêndios em estruturas à beira-mar, incêndios em embarcações e incidentes de resgate na água. Esses barcos devem transportar bombas de incêndio, monitores, armazenamento de mangueiras e aparelhos respiratórios – tudo integrado em uma plataforma estável e de resposta rápida. Os departamentos também usam essas embarcações para resposta a enchentes e operações de ajuda mútua. Os layouts dos consoles devem acomodar controles de bombas, sistemas de rádio e iluminação de emergência sem comprometer o espaço do convés para movimentação da tripulação.
      features:
        - Monitor de incêndio montado na proa com pacote de integração de bomba
        - Montagem de equipamento dedicado para bomba de incêndio, armazenamento de mangueiras e conjuntos BA
        - Layout do console configurável para controles de bomba, rádio e iluminação de emergência
        - Plataforma de auto-balanço para escoamento de água de combate a incêndios e estabilidade
        - 'Pacote de operações noturnas: holofote, iluminação de cena, barra de luz azul/vermelha'
    - title: Polícia Marinha e Segurança Portuária
      subtitle: Interdição, patrulha, operações de embarque
      description: As unidades de aplicação da lei marítima exigem navios capazes de perseguir em alta velocidade, abordar navios suspeitos e patrulhar a segurança portuária. Esses barcos devem ter armazenamento seguro para equipamentos e armas de fiscalização, integração de comunicação com o comando em terra e espaço de convés suficiente para operações da equipe de embarque. A capacidade de operações noturnas e a abordagem discreta são essenciais para missões de interdição.
      features:
        - Capacidade de perseguição em alta velocidade – casco planador com velocidade máxima de mais de 40 nós
        - Armários seguros para armas e compartimentos para armazenamento de equipamentos de aplicação da lei
        - Integração de console para rádio policial, MDT e sistemas de comunicação
        - 'Pacote de operações noturnas: holofote IR, montagem FLIR, iluminação secreta'
        - Plataforma de embarque reforçada com superfície antiderrapante
        - Iluminação de emergência azul/vermelha e sistema de sirene
    - title: Voluntário SAR e organizações sem fins lucrativos
      subtitle: Operações costeiras e lacustres baseadas na comunidade, financiadas por subsídios
      description: Grupos de resgate baseados na comunidade operam em lagos, rios e áreas costeiras onde a cobertura SAR do governo é limitada. Muitas vezes financiadas por doações ou subvenções governamentais, estas organizações necessitam de capacidade máxima por dólar – uma embarcação fiável e de baixa manutenção que os voluntários possam operar em segurança com um mínimo de formação dedicada. Os ciclos de aquisição de subvenções significam que os barcos devem cumprir os requisitos de conformidade, mantendo-se dentro dos orçamentos fixos.
      features:
        - Configuração de motor de popa único otimizada para menor custo de aquisição e operação
        - PVC construção para menor manutenção e fácil reparo em campo
        - Console multifuncional que minimiza a complexidade eletrônica para operadores voluntários
        - Pacote de documentação de conformidade de subvenções para pedidos de financiamento
        - Design leve para lançamento na praia sem reboque ou guindaste dedicado
    - title: Resgate contra inundações e resposta a desastres
      subtitle: Inundações interiores, águas rasas, ambientes carregados de detritos
      description: O resgate em inundações é um perfil operacional distinto – os barcos operam em áreas urbanas inundadas, correntes cheias de detritos e águas extremamente rasas, onde os obstáculos submersos são invisíveis. Os operadores precisam de embarcações que possam navegar pelas ruas inundadas, atravessar escombros e retirar vítimas de edifícios e veículos. A capacidade de correntes de ar rasas é crítica, assim como a capacidade de operar em correntes com riscos de protuberâncias. Esses barcos são frequentemente utilizados por bombeiros, defesa civil e ONGs de ajuda humanitária.
      features:
        - Casco de calado ultra-raso - opera em 30-50 cm de água
        - Arco defletor de detritos e proteção reforçada do tubo para obstáculos submersos
        - Plataforma de auto-resgate para escoamento de águas de enchentes e recuperação de vítimas
        - Tubos laranja ou amarelos de alta visibilidade para visibilidade de reconhecimento aéreo
        - Design leve para transporte de helicóptero e implantação rodoviária
        - Pontos de elevação reforçados para operações de içamento e resgate com corda
