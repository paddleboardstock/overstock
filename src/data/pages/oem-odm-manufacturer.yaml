breadcrumb: OEM/ODM Manufacturer
tldr:
  summary: Aquafarer is a direct-from-factory OEM/ODM manufacturer. 12,000 m² ISO 9001:2015 facility, 15,000 units annual output, CE/BSCI/REACH/UKCA compliance, low MOQs from 2-10 units.
  points:
    - 12,000 m² ISO 9001:2015 certified Qingdao facility
    - 15,000 units annual capacity with 200-300 skilled workers
    - CE 2013/53/EU, UKCA, BSCI, REACH compliance
    - 'Low MOQs: 2-5 units (RIB), 5-10 units (SUP) for standard models'
    - 50+ export countries with FOB Qingdao shipping
