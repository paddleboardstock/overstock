overview_section:
  tagline: Market Overview
  title: The Kenyan SUP Market
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: a calm-water activity that works for resort guests, kitesurf schools' no-wind days, and sunset paddles over the reef.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: lodges and camps adding paddle sessions to their activity menus. Between beach operators, hotels, kitesurf and dive schools broadening their offer, and a small but growing Nairobi paddling scene, orders are small and practical — 5–15 boards of stable, durable all-around models with a premium edition or two for display.
  customer_types:
    - title: Beach Operators
      description: Diani, Watamu, and Mombasa operators adding SUP rentals and lessons for tourists.
    - title: Resorts & Safari-and-Beach Lodges
      description: Coastal resorts and lodges adding guest SUP programs with compact mixed fleets.
    - title: Kitesurf & Dive Schools
      description: Existing watersports schools broadening their offer with calm-water paddling.
shipping_section:
  title: Ship to Kenya
  paragraphs:
    - Orders ship from Weihai, China. Express air freight carries samples and 1–3 board orders into Nairobi's Jomo Kenyatta airport and the coast; consolidated sea freight serves 5–20 board wholesale orders through the port of Mombasa. Transit estimates for your destination are included in your quote.
    - We provide the commercial invoice and packing list clearance requires, with correct HS codes and declared values. Import duties and taxes are payable by the importer under Kenyan rules.
  customs_note: Confirm current duty and tax treatment for sports equipment with your clearing agent before ordering — Kenya's tariff structure changes periodically. We supply complete, consistent documentation for smooth clearance.
faq_section:
  title: Kenya FAQ
  items:
    - q: Can boards reach Diani or Watamu directly?
      a: Door-to-door delivery quotes cover coastal destinations, using onward logistics from the arrival airport or the port of Mombasa. Note your exact location in the inquiry and we will price it specifically.
    - q: What does a beach operator starter order look like?
      a: "Usually 5–10 boards: stable all-around models for tourist lessons and rentals, plus one or two premium editions for display. Mixed models, one shipment, priced by total quantity."
    - q: Do the boards suit warm lagoon and reef-flat water?
      a: Yes — calm, warm, shallow conditions are exactly what all-around inflatable SUPs are designed for, and the flexible fin and drop-stitch construction handle sandy and reef-flat landings well.
    - q: How is freight quoted to Kenya?
      a: Express air into Nairobi or the coast for samples and small orders; consolidated sea freight to Mombasa for wholesale quantities. Both are itemized in your quote with estimated transit times.
