overview_section:
  tagline: Market Overview
  title: The Indonesian SUP Market
  paragraphs:
    - Indonesia is one of Asia's great water sports economies, and Bali is its beating heart. From the beach clubs of Seminyak and Canggu to the calm lagoons of Sanur and Nusa Dua, paddle boards appear everywhere — sunrise paddles over reefs, SUP yoga classes, lagoon tours, and hotel guest programs. Beyond Bali, Lombok, the Gili Islands, and the growing tourism scenes across the archipelago follow the same pattern.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: durability, UV performance, and repairability matter more than catalog gloss. Orders run 5–20 boards, mixed for lessons, rentals, and retail display.
  customer_types:
    - title: Bali Water Sports Shops
      description: Established Sanur, Seminyak, and Canggu operators adding SUP to surf, dive, and snorkel lines.
    - title: Island Resorts & Beach Clubs
      description: Resorts and beach clubs in Bali, Lombok, and the Gillis running guest paddles and SUP yoga programs.
    - title: Tour & Rental Operators
      description: Lagoon and mangrove tour operators and hourly rental stands refreshing fleets seasonally.
shipping_section:
  title: Ship to Indonesia
  paragraphs:
    - Indonesia is one of the shortest freight lanes from our Weihai, China base. Express air freight carries samples and 1–3 board orders fast into Denpasar and Jakarta; consolidated sea freight serves 5–20 board wholesale orders through Tanjung Priok, Tanjung Benoa, and other ports. Both options are quoted with estimated transit times for your destination.
    - We provide the commercial invoice and packing list clearance requires, with correct HS codes and declared values. Import duties and taxes are payable by the importer under Indonesian rules.
  customs_note: Indonesian clearance for sports equipment is documentation-sensitive — work with your customs broker (PPJK) to confirm current duty and tax treatment. We provide complete, consistent paperwork and respond quickly to broker requests.
faq_section:
  title: Indonesia FAQ
  items:
    - q: How fast is freight from China to Bali?
      a: Indonesia is one of our closest freight destinations from Weihai. Express air into Denpasar or Jakarta is the fastest option for samples and small orders; consolidated sea freight is quoted with a transit window for wholesale orders. Both are itemized in your quote.
    - q: Do the boards suit daily rental use in tropical UV?
      a: Yes — drop-stitch PVC construction rated for daily rental cycles is what we supply to fleets in 50+ countries. Standard care (rinse after salt water, shaded storage) keeps them in service across many seasons of Bali sun.
    - q: What does a water sports shop order look like?
      a: Typically 5–15 boards mixed between stable all-around models for lessons and rentals and a few premium art editions for retail display — one shipment, priced by total quantity.
    - q: Can you support our PPJK with documentation?
      a: Yes. Every order ships with a commercial invoice and packing list with correct HS codes and declared values, and we respond quickly when your broker needs additional documents.
