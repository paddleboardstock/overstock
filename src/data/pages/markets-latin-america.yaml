direct_answer: Paddle Board Overstock supplies brand-new overstock inflatable SUP boards to small retailers across Latin America — from Mexico and Brazil to Colombia, Peru, Chile, and Argentina. Wholesale orders start at 5 boards with mixed models welcome, and every order ships from Weihai, China by express air freight or consolidated sea freight. Boards are 100% pressure-tested and covered by the 2-Year SUP Warranty.
tldr_points:
  - "Wholesale from 5 boards — mixed models in one order, priced by total quantity"
  - "Express air or consolidated sea freight from Weihai, China"
  - "Spanish- and Portuguese-language markets served across the region"
  - "100% pressure-tested, 2-Year SUP Warranty on every board"
overview_section:
  tagline: Market Overview
  title: The Latin American SUP Market
  paragraphs:
    - Latin America is one of the fastest-growing stand-up paddle markets in the world. Long coastlines on two oceans, established beach tourism economies, and a strong board-sports culture give independent retailers from Tulum to Florianópolis a growing base of customers — tourists taking their first lesson, weekend paddlers, and a rising local SUP racing and surf community.
    - The retail landscape is dominated by small and mid-sized independent shops: beach-front paddle schools that sell what they rent, surf shops adding SUP lines, and online sellers importing directly for the first time. These businesses rarely need container-loads of a single model — they need 5–20 boards per order, mixed between beginner-friendly all-around models and a few premium editions.
  customer_types:
    - title: Beach Town Retailers
      description: Shops in resort towns serving tourists — they need durable beginner boards in volume plus a few premium models for display and sale.
    - title: Paddle Schools & Rental Fleets
      description: Schools pairing lessons with retail, and rental fleets refreshing boards each season with mixed-model orders.
    - title: Online Sellers
      description: Spanish- and Portuguese-language e-commerce sellers introducing the SUP category to their national market without container-scale risk.
shipping_section:
  title: Ship to Latin America
  paragraphs:
    - Orders ship from our logistics base in Weihai, China. Express air freight suits samples, 1–3 board orders, and urgent restocks; consolidated sea freight is the economical route for 5–20 board wholesale orders to major ports across the region.
    - We provide complete, accurate export paperwork — commercial invoice and packing list — to keep customs clearance smooth. Import duties and taxes are set by your country and payable by the importer; we never bundle vague "taxes included" promises into a freight quote.
  customs_note: Import rules and duty rates vary significantly across Latin American countries. Check your country's current import regime for inflatable water sports equipment before ordering, and ask us for any extra documentation your broker needs.
faq_section:
  title: Latin America FAQ
  items:
    - q: Can I get a quote in Spanish or Portuguese?
      a: Our team works with buyers across Latin America and can handle quotes and order confirmations for Spanish- and Portuguese-speaking customers. Ask in your inquiry.
    - q: Do you ship to my country in Latin America?
      a: We ship throughout the region — Mexico, Brazil, Colombia, Peru, Chile, Argentina, Ecuador, and beyond. Confirm your exact destination in your quote request and we will verify current freight service.
    - q: What is the wholesale minimum for Latin American retailers?
      a: Five boards total, mixing any in-stock models. That total sets your pricing tier — you can combine all-around, touring, and art editions in one shipment.
    - q: Who pays import duties in my country?
      a: You do, as the importer, under your country's rules. We provide correct, complete paperwork (commercial invoice, packing list) so clearance is predictable — see our international shipping page for the full picture.
