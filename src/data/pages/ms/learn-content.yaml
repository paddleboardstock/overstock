materials:
  intro_p1: Prestasi, ketahanan, dan keselamatan papan paddle tiup bergantung hampir sepenuhnya pada bahan yang digunakan dalam pembinaannya. Daripada laminat yang membentuk badan kapal hingga benang yang memberikan kekakuan pada papan SUP, setiap pilihan bahan mempengaruhi bagaimana produk berfungsi di air dan berapa lama ia bertahan.
  intro_p2: 'Panduan ini merangkumi tiga bahan utama yang digunakan dalam papan paddle tiup moden: laminat PVC, teras drop-stitch, dan dek busa EVA. Memahami bahan-bahan ini akan membantu anda memilih papan yang sesuai untuk keperluan anda dan mengekalkannya untuk jangka hayat maksimum.'
  labels:
    advantages: Kelebihan
    limitations: Keterbatasan
    best_for: 'Terbaik untuk:'
  items:
    - name: PVC (Polivinil Klorida)
      summary: Standard industri untuk SUPs tiup. Kain berlapis berbilang lapisan menawarkan nisbah kekuatan kepada berat yang sangat baik pada harga yang mampu dimiliki.
      pros:
        - Nilai yang sangat berbaloi
        - Ringan dan mudah dikendalikan
        - Ketahanan UV yang baik dengan salutan yang sesuai
        - Pelbagai warna dan kemasan
        - Mudah dibaiki dengan tampalan PVC dan gam pelarut
      cons:
        - Jangka hayat tipikal 7-10 tahun dengan penjagaan yang betul
        - Kurang fleksibel pada suhu sejuk
        - Ketahanan kimia lebih rendah
        - Boleh mengalami migrasi pelicin dari masa ke masa
      best_for: SUPs untuk rekreasi dan pelancongan, kayuhan keluarga, penggunaan bermusim, air tawar dan persekitaran pesisir.
    - name: Teras Drop-Stitch
      summary: Teknologi yang merevolusikan SUPs boleh kembung. Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, membolehkan inflasi tekanan tinggi untuk prestasi cangkerang keras yang tegar.
      pros:
        - Sangat kaku pada 12-20 PSI
        - Ringan — 18-30 lbs untuk papan bersaiz penuh
        - Boleh dilipat rata untuk penyimpanan dan perjalanan
        - Ketahanan hentakan yang sangat baik
        - Prestasi konsisten merentasi julat suhu
      cons:
        - Memerlukan pam tekanan tinggi
        - Pembaikan tusukan lebih kompleks daripada lapisan tunggal
        - Kos pengilangan lebih tinggi berbanding tiup standard
        - Kehilangan tekanan dari masa ke masa memerlukan penambahan berkala
      best_for: Papan dayung berdiri dan sebarang peralatan yang memerlukan prestasi teguh dengan kebolehpindahan boleh dipam.
    - name: Dek Buih EVA
      summary: Buih sel tertutup EVA (etilena-vinil asetat) digunakan untuk pad traksi pada papan SUP. Memberi kusyen, cengkaman, dan penebatan haba — serta memaparkan reka bentuk siri seni.
      pros:
        - Cengkaman anti-gelincir yang sangat baik sama ada basah atau kering
        - Kusyen mengurangkan keletihan semasa dayung panjang
        - Penebatan haba dari permukaan dek yang sejuk
        - Tahan UV dan air masin
        - Tersedia dalam penyambungan blok pelbagai warna dan rekaan diukir laser
      cons:
        - Boleh digunakan dengan penggunaan berat selama 2-3 tahun
        - Mesti disambungkan dengan betul untuk mengelakkan delaminasi
        - Bukan struktur — tidak menjejaskan ketegaran
        - Menambah sedikit berat (200-400 g setiap papan)
      best_for: Traksi dek SUP, reka bentuk dek siri seni, dan sebarang permukaan yang memerlukan tapak anti-gelincir.
  selection:
    title: Panduan Pemilihan Bahan
    subtitle: 'Pilih bahan yang sesuai berdasarkan penggunaan utama anda:'
    headers:
      - Kes Penggunaan
      - Bahan yang Disyorkan
      - Mengapa
    rows:
      - - Berkayak rekreasi SUP
        - Drop-stitch PVC
        - Ringan, tegar, mampu milik — keseimbangan ideal untuk pengayuh santai
      - - Keluarga & permulaan mendayung
        - Lebar drop-stitch PVC (32"+)
        - Stabil dan mudah dimaafkan — keyakinan untuk pendayung kali pertama
      - - Memancing & dayungan berserta peralatan berat
        - Lebar drop-stitch PVC dengan dek penuh EVA
        - Stabil tambahan untuk berdiri dan melontar, isipadu tinggi untuk peralatan
      - - Armada sewaan SUP papan
        - Drop-stitch PVC + EVA dek
        - Tahan lama, boleh dibaiki, nilai baik untuk penggunaan dengan giliran tinggi
      - - Pelayaran & dayungan jarak jauh
        - Drop-stitch PVC (~11 kaki)
        - Penjejakan dan kecekapan gelongsor yang lebih baik untuk jarak
      - - Yoga & dayungan kecergasan
        - Lebar drop-stitch PVC dengan dek penuh EVA
        - Platform stabil dan selesa untuk pose dan latihan
  deep_dive:
    title: Panduan Mendalam
    topics:
      - title: Gred Marin PVC
        desc: Kain berlapis pelbagai PVC — penjelasan mengenai rintangan UV, ujian geseran dan penarafan denier.
      - title: PVC Lapisan Laminat
        desc: Bagaimana PVC berlapis berbilang lapisan menyeimbangkan kekuatan, berat, dan rintangan UV.
      - title: Teras Drop-Stitch
        desc: Bagaimana ribuan benang dalaman mencipta struktur boleh kembung teguh pada tekanan 15 PSI.
      - title: Teknologi Kimpalan RF
        desc: Kimpalan frekuensi tinggi menghasilkan jahitan yang kukuh dan konsisten — cara ia berfungsi dan mengapa ia penting.
      - title: PSI & Prestasi
        desc: Mengapa tekanan udara penting untuk SUPs boleh kembung — keteguhan, kapasiti berat, dan kualiti tunggangan.
      - title: Ujian Kualiti
        desc: Ujian tekanan, ujian kebolehtenggelaman, penuaan UV, dan ujian merosakkan — proses kualiti kami.
      - title: EVA Dek Buih
        desc: Pad dek buih sel tertutup EVA — daya cengkaman, keselesaan, dan ketahanan untuk dek SUP.
      - title: Penjagaan Bahan
        desc: Pembersihan, perlindungan UV, pencegahan kulat, dan amalan penyimpanan terbaik untuk produk tiup.
