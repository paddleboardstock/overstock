articles:
  sup:
    - title: SUP Asas — Panduan Pemula
      desc: Segala yang perlu diketahui oleh seorang pemula — jenis papan, saiz raket, kedudukan, dan petua hari pertama.
    - title: SUP Panduan Saiz
      desc: Cari panjang papan, lebar, dan isipadu yang betul untuk berat badan, kemahiran, dan gaya dayung anda.
    - title: Papan Tiup vs Papan Keras
      desc: Yang mana sesuai untuk anda? Kebolehlaksanaan, prestasi, ketahanan, dan kos dibandingkan.
    - title: Teknik Pertengahan
      desc: Tingkatkan aktiviti mendayung anda dengan strok yang lebih maju, teknik pusingan, dan pengendalian air bergelora.
    - title: Cara Memilih SUP Inflatable
      desc: Navigasi faktor utama — pembinaan, ketebalan, set sirip, dan aksesori yang disertakan.
    - title: Keselamatan Air
      desc: Pengetahuan keselamatan penting termasuk membaca cuaca, pemilihan PFD, menyelamatkan diri sendiri, dan berkayak dalam kumpulan.
  inflatable-boat:
    - title: Rujukan Bahan
      desc: PVC, Hypalon, drop-stitch, penilaian denier — fahami daripada apa bahan peralatan tiup anda diperbuat.
    - title: PVC vs Hypalon
      desc: Perbandingan muktamad fabrik PVC dan Hypalon untuk bot tiup — ketahanan, rintangan UV, dan kos.
    - title: Drop-Stitch Teras Diterangkan
      desc: Bagaimana ribuan benang dalaman membentuk platform yang teguh pada 12-15 PSI untuk SUPs boleh kembung berprestasi tinggi.
    - title: Gambaran Keseluruhan Teknologi Boleh Ditiup
      desc: Bagaimana bot tiup dan SUPs dibina — dari lapisan bahan hingga sistem injap dan kimpalan jahitan.
    - title: Panduan Bot Tiup Kaku (RIB)
      desc: Segala-galanya tentang pembinaan RIB, jenis lamin, bahan tiub, dan memilih RIB yang sesuai untuk keperluan anda.
    - title: Bot Tiup vs RIB
      desc: Perbezaan utama antara bot tiup tradisional dan bot tiup berkhemah tegar untuk pelbagai kegunaan.
  water-safety:
    - title: Panduan Keselamatan Air
      desc: Pengetahuan keselamatan penting untuk setiap pengayuh — cuaca, PFD, penyelamatan diri, dan protokol berkayak berkumpulan.
    - title: Jaket Keselamatan & Panduan PFD
      desc: Cara memilih alat apungan peribadi yang sesuai untuk SUP, berkayak, bermuatan bot, dan penggunaan profesional.
    - title: SUP Senarai Semak Keselamatan
      desc: Senarai semak keselamatan sebelum pelancaran yang setiap pemain papan dayung berdiri harus ikuti sebelum memasuki air.
    - title: Keselamatan Mendayung di Air Sejuk
      desc: Langkah berjaga-jaga penting, peralatan, dan teknik untuk mendayung dalam keadaan air sejuk.
    - title: Kesilapan Mendayung oleh Pemula
      desc: Kesilapan biasa yang dilakukan oleh perenang kali pertama dan bagaimana mengelaknya untuk pengalaman yang lebih selamat dan menyeronokkan.
    - title: CE Penjelasan Sijil
      desc: Apa maksud sijil CE untuk kenderaan air tiup — piawaian, ujian, dan mengapa ia penting untuk keselamatan.
