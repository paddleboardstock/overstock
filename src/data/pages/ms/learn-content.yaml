materials:
  intro_p1: Prestasi, ketahanan, dan keselamatan kenderaan air tiup bergantung hampir sepenuhnya pada bahan yang digunakan dalam pembuatannya. Dari kain yang membentuk tiub hingga benang yang memberikan papan SUP ketegasan, setiap pilihan bahan mempengaruhi bagaimana produk berprestasi di air dan berapa lama ia bertahan.
  intro_p2: 'Panduan ini merangkumi empat bahan utama yang digunakan dalam kenderaan air tiup moden: kain PVC, getah Hypalon CSM, pembinaan teras drop-stitch, dan dek buih EVA. Memahami bahan-bahan ini akan membantu anda memilih produk yang sesuai untuk keperluan anda dan mengekalkannya untuk jangka hayat maksimum.'
  labels:
    advantages: Kelebihan
    limitations: Keterbatasan
    best_for: 'Terbaik untuk:'
  items:
    - name: PVC (Polivinil Klorida)
      summary: Standard industri untuk bot tiup rekreasi dan SUPs. Kain berlapis pelbagai menawarkan nisbah kekuatan kepada berat yang sangat baik pada harga yang mampu milik.
      pros:
        - Mampu milik — 30-50% lebih murah daripada Hypalon
        - Ringan dan mudah dikendalikan
        - Ketahanan UV yang baik dengan salutan yang sesuai
        - Pelbagai warna dan kemasan
        - Mudah dibaiki dengan tampalan PVC dan gam pelarut
      cons:
        - Jangka hayat lebih pendek daripada Hypalon (7-10 tahun)
        - Kurang fleksibel pada suhu sejuk
        - Ketahanan kimia lebih rendah
        - Boleh mengalami migrasi pelicin dari masa ke masa
      best_for: SUPs rekreasi, bot mesra bajet, armada sewaan, penggunaan bermusim, air tawar dan persekitaran pesisir.
    - name: Hypalon (CSM Getah)
      summary: Bahan getah sintetik premium terkenal kerana ketahanan luar biasa, ketahanan UV, dan jangka hayat panjang. Standard emas untuk bot tiup komersial dan ketenteraan.
      pros:
        - Ketahanan UV dan ozon yang luar biasa
        - Tempoh hayat 15-20 tahun dengan penjagaan yang betul
        - Fleksibiliti yang sangat baik dalam cuaca sejuk
        - Ketahanan unggul terhadap bahan kimia dan minyak
        - Mengekalkan warna lebih lama daripada PVC
      cons:
        - Lebih mahal secara ketara berbanding PVC
        - Berat kain lebih berat
        - Pilihan warna lebih sedikit
        - Pembetulan memerlukan pelekat khusus
        - Fasiliti pengilangan lebih sedikit di seluruh dunia
      best_for: RIBs Komersial, pencarian dan penyelamatan, aplikasi ketenteraan, iklim tropika, pemilikan armada jangka panjang.
    - name: Teras Drop-Stitch
      summary: Teknologi yang merevolusikan SUPs boleh kembung. Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, membolehkan inflasi tekanan tinggi untuk prestasi cangkerang keras yang tegar.
      pros:
        - Sangat kaku pada 12-20 PSI
        - Ringan — 18-30 lbs untuk papan bersaiz penuh
        - Boleh dilipat rata untuk penyimpanan dan perjalanan
        - Ketahanan hentakan yang sangat baik
        - Prestasi konsisten merentasi julat suhu
      cons:
        - Memerlukan pam tekanan tinggi
        - Pembaikan tusukan lebih kompleks daripada lapisan tunggal
        - Kos pengilangan lebih tinggi berbanding tiup standard
        - Kehilangan tekanan dari masa ke masa memerlukan penambahan berkala
      best_for: Papan dayung berdiri, kayak, dek udara untuk bot tiup, sebarang aplikasi yang memerlukan prestasi tegar dengan kemampuan mudah alih tiup.
    - name: Dek Buih EVA
      summary: Buih sel tertutup EVA (etilena-vinil asetat) digunakan untuk pad cengkaman pada papan SUP dan dek bot. Memberikan kusyen, cengkaman, dan penebatan haba.
      pros:
        - Cengkaman anti-gelincir yang sangat baik sama ada basah atau kering
        - Kusyen mengurangkan keletihan semasa dayung panjang
        - Penebatan haba dari permukaan dek yang sejuk
        - Tahan UV dan air masin
        - Tersedia dalam penyambungan blok pelbagai warna dan rekaan diukir laser
      cons:
        - Boleh digunakan dengan penggunaan berat selama 2-3 tahun
        - Mesti disambungkan dengan betul untuk mengelakkan delaminasi
        - Bukan struktur — tidak menjejaskan ketegaran
        - Menambah sedikit berat (200-400 g setiap papan)
      best_for: SUP tarikan dek, pelapik dek bot, keselesaan tempat duduk kayak, mana-mana permukaan yang memerlukan tapak anti-gelincir.
  selection:
    title: Panduan Pemilihan Bahan
    subtitle: 'Pilih bahan yang sesuai berdasarkan penggunaan utama anda:'
    headers:
      - Kes Penggunaan
      - Bahan yang Disyorkan
      - Mengapa
    rows:
      - - Berkayak rekreasi SUP
        - Drop-stitch PVC
        - Ringan, tegar, mampu milik — keseimbangan ideal untuk pengayuh santai
      - - Dinghy keluarga / bot tasik
        - PVC (1100 denier)
        - Kos efektif, mudah dibaiki, ketahanan mencukupi untuk penggunaan rekreasi
      - - Bot RIB / bot rondaan komersial
        - Hypalon CSM
        - Rintangan UV maksimum, jangka hayat 15-20 tahun, rintangan kimia/minyak
      - - Armada sewaan SUP papan
        - Drop-stitch PVC + EVA dek
        - Tahan lama, boleh dibaiki, nilai baik untuk penggunaan dengan giliran tinggi
      - - Operasi mencari & menyelamat
        - Hypalon CSM
        - Boleh dipercayai dalam keadaan ekstrem, fleksibiliti pada suhu sejuk, rintangan kimia
      - - Kayak jelajah / ekspedisi
        - Drop-stitch PVC
        - Prestasi tegar dengan kebolehpindahan yang boleh dibawa untuk perjalanan
  deep_dive:
    title: Panduan Mendalam
    topics:
      - title: Gred Marin PVC
        desc: Kain berlapis pelbagai PVC — penjelasan mengenai rintangan UV, ujian geseran dan penarafan denier.
      - title: PVC vs Hypalon
        desc: Perbandingan muktamad bagi dua bahan bot tiup dominan — kos, jangka hayat, rintangan UV.
      - title: Teras Drop-Stitch
        desc: Bagaimana beribu-ribu benang dalaman membentuk struktur tiup bertekanan tinggi yang tegar pada 12-15 PSI.
      - title: Teknologi Kimpalan RF
        desc: Kimpalan frekuensi tinggi menghasilkan jahitan yang kukuh dan konsisten — cara ia berfungsi dan mengapa ia penting.
      - title: PSI & Prestasi
        desc: Mengapa tekanan udara penting untuk SUPs dan bot tiup — ketegaran, kapasiti berat, dan kualiti pemanduan.
      - title: Ujian Kualiti
        desc: Ujian tekanan, ujian kebolehtenggelaman, penuaan UV, dan ujian merosakkan — proses kualiti kami.
      - title: EVA Dek Buih
        desc: Pad dek buih sel tertutup EVA — cengkaman, keselesaan, dan ketahanan untuk dek SUP dan bot.
      - title: Penjagaan Bahan
        desc: Pembersihan, perlindungan UV, pencegahan kulat, dan amalan penyimpanan terbaik untuk produk tiup.
