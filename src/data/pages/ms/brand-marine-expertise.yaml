hero:
  tagline: Kepakaran Marin
  title: Berpuluh Tahun Kejuruteraan Marin<br />dalam Setiap Papan
  subtitle: Paddle Board Overstock menggabungkan sains bahan yang mendalam, pembuatan tepat, dan ujian dunia sebenar untuk menghasilkan papan yang berprestasi apabila ia penting.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock pasukan kejuruteraan marin dan R&D sedang bekerja
expertise_materials:
  tagline: Sains Bahan
  title: Memilih Bahan Yang Tepat<br />untuk Setiap Aplikasi
  subtitle: Kami bekerja dengan tiga bahan teras — setiap satu dipilih untuk kes penggunaan dan keperluan prestasi tertentu.
  columns: 3
  items:
    - title: Gred Marin PVC
      description: Kain 1100 denier PVC — bahan kami yang paling serbaguna. UV-stabil, tahan abrasi, dan telah diuji masa. Sesuai untuk papan SUP di mana berat, kekakuan, dan kecekapan kos penting.
      icon: tabler:droplet
    - title: Teras Drop-Stitch
      description: Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, membenarkan inflasi bertekanan tinggi (15 PSI) untuk tunggangan yang kaku dan stabil tetapi masih boleh digulung ke dalam beg galas.
      icon: tabler:building-arch
    - title: <span>EVA Busa Dek</ph3>
      description: Busa EVA berketumpatan tinggi beralur memberikan cengkaman sepanjang panjang, kusyen untuk jatuh, dan kanvas untuk dek siri seni tanda tangan kami.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Keupayaan Pembuatan
  title: Pembuatan Tepat<br />di Setiap Langkah
  subtitle: Kemudahan seluas 12,000 m² kami dilengkapi dengan mesin khusus untuk setiap peringkat pengeluaran.
  columns: 2
  items:
    - title: CNC Pemotongan
      description: Pemotongan dikawal komputer memastikan panel kain yang tepat dan boleh diulang dengan sisa minimum. Setiap keping sesuai tepat seperti yang direka.
      icon: tabler:cpu
    - title: Pengelasan Frekuensi Tinggi
      description: Pengelasan HF industri menghasilkan jahitan yang lebih kuat daripada bahan asas. Kawalan suhu dan tekanan yang konsisten memastikan kekedapan udara di setiap pengeluaran.
      icon: tabler:bolt
    - title: Pemasangan Teras Drop Stitch
      description: Beribu-ribu benang poliester menghubungkan lapisan kain atas dan bawah, membolehkan inflasi tekanan tinggi (15-20 PSI) untuk papan dan lantai SUP yang kaku dan stabil.
      icon: tabler:building-arch
    - title: ujian tekanan
      description: Setiap papan diuji tekanan sebelum penghantaran, dipegang pada 1.25x tekanan yang dinilai — jika ia bertahan di situ, ia akan berprestasi di air.
      icon: tabler:wind
    - title: Ujian Kekuatan Jahitan
      description: Sampel rawak dari setiap kumpulan pengeluaran menjalani ujian kekuatan jahitan destruktif. Hasil dicatat dan boleh dijejaki kepada pengeluaran tertentu.
      icon: tabler:files
    - title: Ujian Air
      description: Setiap reka bentuk papan menjalani percubaan dengan air sebenar. Mendayung dalam keadaan pantai sebenar mengesahkan prestasi, pengendalian, dan kestabilan.
      icon: tabler:ripple
expertise_design:
  tagline: Reka Bentuk & Kejuruteraan
  title: Direka untuk Keadaan Sebenar
  subtitle: Falsafah reka bentuk kami bermula dengan cara papan akan digunakan — kemudian membina kejuruteraan berdasarkan kes penggunaan itu.
  items:
    - title: Bentuk dan Garis Besar Papan
      description: Panjang, lebar, dan rocker ditetapkan mengikut kegunaan yang dimaksudkan untuk setiap model — kontur pelancongan yang lebih panjang untuk meluncur, bentuk papan yang lebih lebar untuk kestabilan dan yoga.
    - title: Penguatan Rel & Stringer
      description: Rel kerangka yang diperkuat dan tali pusat menambah kekakuan dan menyerap hentakan — tempat di mana papan mengalami keausan paling banyak musim demi musim.
    - title: Susun Atur Dek & Tarikan
      description: Kawasan kedudukan, penempatan pemegang, pelekap D-ring, dan zon cengkaman direka mengikut postur mendayung sebenar — sama ada untuk bersiar-siar, memancing, atau mengamalkan yoga.
    - title: Siri Seni & Warna
      description: Seni dek, skim warna, dan tempat pemasangan aksesori — setiap siri direka untuk memadankan personaliti mendayung yang berbeza.
cta:
  title: Adakah anda mempunyai aplikasi tertentu dalam fikiran?
  subtitle: Pasukan kami boleh membantu anda memilih papan, saiz, dan perkakasan yang sesuai untuk gaya mendayung anda.
  actions:
    - variant: primary
      text: Tanya jurutera kami
      href: /contact
    - text: Lihat rangkaian produk
