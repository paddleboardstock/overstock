hero:
  tagline: Kepakaran Marin
  title: Berpuluh Tahun Kejuruteraan Marin<br />Dalam Setiap Lambung
  subtitle: Aquafarer menggabungkan sains bahan yang mendalam, pembuatan tepat, dan ujian dunia sebenar untuk menghasilkan kenderaan air yang berprestasi bila diperlukan.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer pasukan kejuruteraan marin dan R&D sedang bekerja
expertise_materials:
  tagline: Sains Bahan
  title: Memilih Bahan Yang Tepat<br />untuk Setiap Aplikasi
  subtitle: Kami bekerja dengan tiga bahan teras — setiap satu dipilih untuk kes penggunaan dan keperluan prestasi tertentu.
  columns: 3
  items:
    - title: Gred Marin PVC
      description: Kain 1100 denier PVC — bahan paling serbaguna kami. UV-stabil, tahan haus, dan mematuhi REACH. Sesuai untuk bot rekreasi, SUP papan, dan kayak di mana berat dan kos kepelbagaian penting.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Ketahanan kimia yang unggul dan kestabilan UV. Bot Hypalon boleh bertahan 15-20 tahun dengan penjagaan yang betul. Disyorkan untuk aplikasi komersial, penyelamatan, dan ketenteraan di mana daya tahan jangka panjang adalah kritikal.
      icon: tabler:shield
    - title: Fiberglass & Aluminium
      description: Lambung fiberglass Deep-V untuk RIBs dan bot rondaan — prestasi memotong ombak dalam keadaan kasar. Lambung aluminium untuk bot kerja komersial berat yang memerlukan kekuatan maksimum dan kapasiti muatan.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Keupayaan Pembuatan
  title: Pembuatan Tepat<br />di Setiap Langkah
  subtitle: Kemudahan seluas 12,000 m² kami dilengkapi dengan mesin khusus untuk setiap peringkat pengeluaran.
  columns: 2
  items:
    - title: CNC Pemotongan
      description: Pemotongan dikawal komputer memastikan panel kain yang tepat dan boleh diulang dengan sisa minimum. Setiap keping sesuai tepat seperti yang direka.
      icon: tabler:cpu
    - title: Pengelasan Frekuensi Tinggi
      description: Pengelasan HF industri menghasilkan jahitan yang lebih kuat daripada bahan asas. Kawalan suhu dan tekanan yang konsisten memastikan kekedapan udara di setiap pengeluaran.
      icon: tabler:bolt
    - title: Pemasangan Teras Drop Stitch
      description: Beribu-ribu benang poliester menghubungkan lapisan kain atas dan bawah, membolehkan inflasi tekanan tinggi (15-20 PSI) untuk papan dan lantai SUP yang kaku dan stabil.
      icon: tabler:building-arch
    - title: Ujian Tekanan
      description: Setiap produk boleh tiup diuji tekanan sebelum penghantaran. Tiub RIB diuji pada 1.25x tekanan yang dinilai — jika ia menahannya, ia akan berfungsi di air.
      icon: tabler:wind
    - title: Ujian Kekuatan Jahitan
      description: Sampel rawak dari setiap kumpulan pengeluaran menjalani ujian kekuatan jahitan destruktif. Hasil dicatat dan boleh dijejaki kepada pengeluaran tertentu.
      icon: tabler:files
    - title: Ujian Air
      description: Setiap model RIB menjalani ujian laut sebelum pensijilan. Ujian dunia sebenar dalam keadaan pesisir pantai mengesahkan prestasi, pengendalian, dan kestabilan.
      icon: tabler:ripple
expertise_design:
  tagline: Reka Bentuk & Kejuruteraan
  title: Direka untuk Keadaan Sebenar
  subtitle: Falsafah reka bentuk kami bermula dengan cara bot akan digunakan — kemudian membina kejuruteraan berdasarkan kes penggunaan itu.
  items:
    - title: Reka Bentuk Lambung V- Dalam
      description: Layar gentian kaca kami menampilkan sudut deadrise yang dikira dan dioptimumkan untuk panjang dan kegunaan setiap model. V yang lebih curam untuk prestasi di air bergelora, lebih cetek untuk kestabilan.
    - title: Keselamatan Berbilang Komponen
      description: Setiap bot mempunyai 3-7 ruang udara yang berdikari. Jika satu ruang terjejas, ruang yang tinggal memastikan bot tetap terapung dan beroperasi.
    - title: Susun atur ergonomik
      description: Kedudukan konsol, ketinggian tiub, dan penempatan kerusi direka berdasarkan keselesaan pengendali semasa penggunaan jangka panjang — sama ada melakukan rondaan, memancing, atau mengangkut.
    - title: Konfigurasi Tersuai
      description: Warna tiub, konfigurasi konsol, kapasiti bahan bakar, pemegang aksesori — setiap model boleh disesuaikan untuk memenuhi keperluan operasi tertentu.
cta:
  title: Adakah anda mempunyai aplikasi tertentu dalam fikiran?
  subtitle: Pasukan kejuruteraan kami boleh memberi nasihat tentang pemilihan bahan, reka bentuk, dan pembuatan untuk projek anda.
  actions:
    - variant: primary
      text: Tanya jurutera kami
      href: /contact
    - text: Lihat rangkaian produk
      href: /products
