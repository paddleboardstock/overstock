hero:
  tagline: Mengapa Aquafarer
  title: Dibina Berbeza. Dibina untuk Perniagaan.<br />Rakan Kongsi di Sebalik Pengembaraan Air Sepanjang Dunia
  subtitle: Bukan sekadar pengeluar — rakan perniagaan yang mereka bentuk, merekabentuk, dan menghantar peralatan gred komersial untuk kelab, pusat peranginan, pengendali sewaan, dan jenama air yang sedang berkembang.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer kualiti dan kepakaran pengilangan
pillars:
  tagline: Tiga Tiang Perkongsian
  title: Mengapa Perniagaan Air di Seluruh Dunia Memilih Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Direka Untuk Penggunaan Komersial
      description: Peralatan kami direka untuk sewaan harian, bukan rekreasi hujung minggu. PVC gred komersial, teras drop-stitch bertetulang, pilihan UV-stabil Hypalon, dan perkakasan yang diuji di lapangan bermakna penyelenggaraan lebih rendah, jangka hayat lebih panjang, dan ROI lebih tinggi untuk operasi anda.
      icon: tabler:building-factory
      callToAction:
        text: Lihat barisan produk komersial
        href: /products
    - title: Dari Idea Ke Pasaran
      description: 'Lancarkan jenama sukan air anda dalam 90 hari. Kami membimbing anda melalui setiap langkah: pengesahan konsep, pemilihan produk, prototaip, pengeluaran, reka bentuk pembungkusan, dan penghantaran global. Tiada tekanan pesanan minimum — mulakan kecil, berkembang dengan yakin.'
      icon: tabler:rocket
      callToAction:
        text: Mulakan perjalanan jenama anda
        href: /oem-odm-blueprint
    - title: Dibina Untuk Keadaan Global
      description: 'Produk dioptimumkan untuk setiap iklim: formulasi PVC air sejuk untuk Eropah, bahan UV-tahan untuk Timur Tengah dan Australia, rawatan anti-kelembapan untuk Asia Tenggara. Setiap penghantaran dikalibrasi mengikut persekitaran destinasi.'
      icon: tabler:world
