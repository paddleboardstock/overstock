reasons:
  tagline: Perbezaan Aquafarer
  title: Apa yang Membezakan Kami
  isBeforeContent: false
  columns: 3
  items:
    - title: Pengilangan Sebenar, Bukan Perdagangan
      description: Kami memiliki dan mengendalikan kilang seluas 12,000 m². Apabila anda bekerjasama dengan Aquafarer, anda berurusan terus dengan orang yang mereka bentuk, merekabentuk, dan membina produk anda — tiada orang tengah.
      icon: tabler:building-factory
    - title: Pendekatan Dipimpin Kejuruteraan
      description: Proses reka bentuk kami bermula dengan kes penggunaan, bukan kategori produk. Kami mengoptimumkan bentuk badan bot, pemilihan bahan, dan konfigurasi untuk bagaimana peralatan akan digunakan secara sebenar dalam persekitaran komersial.
      icon: tabler:engine
    - title: Kualiti Bertauliah
      description: Bertauliah CE, sistem kualiti ISO, mematuhi BSCI, mematuhi REACH, jaket keselamatan jenis III/V USCG diluluskan; semua produk memenuhi piawaian antarabangsa yang berkaitan.
      icon: tabler:certificate
    - title: Fleksibel OEM/ODM
      description: Warna tiub, susun atur konsol, penjenamaan, pembungkusan — kami menyesuaikan mengikut spesifikasi anda. Tiada tekanan pesanan minimum. Mulakan dengan prototaip, berkembang dengan yakin.
      icon: tabler:adjustments
    - title: Logistik Global
      description: Gudang AS di California, penghantaran terus dari Qingdao, penghantaran udara untuk pesanan segera. Kami menguruskan dokumen kastam dan dokumentasi di seluruh dunia.
      icon: tabler:truck-delivery
    - title: Sokongan Sepanjang Hayat
      description: Kami menyokong bot yang kami bina 20 tahun lalu. Alat ganti asli, nasihat teknikal, panduan pembaikan — pasukan kami tersedia apabila anda memerlukan kami, di mana sahaja anda berada.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dipercayai oleh Jenama di Seluruh Dunia
  title: Apa Kata Rakan Kongsi Kami
  items:
    - content: Kami telah bekerja dengan beberapa pengilang di China, tetapi Aquafarer menonjol kerana sokongan kejuruteraan mereka dan kualiti yang konsisten. Mereka melayan jenama kami seperti jenama mereka sendiri.
      name: — OEM Rakan Kongsi, Jenama Sukan Air Eropah
    - content: Hypalon RIBs mereka telah digunakan dalam armada kami selama lebih 5 tahun. Penyelenggaraan minima, rintangan UV yang sangat baik. Jaminan 5 tahun pada tiub memberi kami keyakinan.
      name: — Pengendali Armada, Kumpulan Resort Timur Tengah
    - content: Pasukan Aquafarer membantu kami membangunkan reka bentuk papan SUP khusus dari konsep ke pengeluaran dalam 90 hari. Kualitinya melebihi jangkaan kami.
      name: — Pengedar, Sukan Air Australia
    - content: Sebagai pemilik perniagaan kecil, saya bimbang tentang MOQs. Aquafarer bekerjasama dengan bajet saya dan membantu saya melancarkan jenama saya dengan hanya 50 papan. Kini saya membuat pesanan 500.
      name: — Pengasas Jenama, Syarikat Penyewaan SUP AS
cta:
  title: Bersedia untuk membina perniagaan air anda?
  subtitle: Hubungi pasukan kami untuk konsultasi percuma. Tiada komitmen — hanya nasihat jujur tentang peralatan dan pembuatan.
  actions:
    - variant: primary
      text: Berbual dengan pasukan kami
      href: /contact
    - text: Muat turun katalog produk
      href: /resources
