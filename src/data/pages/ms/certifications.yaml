hero:
  tagline: Pensijilan & Piawaian
  title: Pensijilan Kualiti<br />& Piawaian Pematuhan
  subtitle: Produk Aquafarer dihasilkan selaras dengan piawaian keselamatan marin antarabangsa, sistem pengurusan kualiti, dan peraturan alam sekitar.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Pensijilan kualiti Aquafarer dan dokumen pematuhan
content_certifications:
  tagline: Pensijilan Kami
  title: Kualiti Bersijil,<br />Diiktiraf Secara Global
  subtitle: 64 model CE-bersijil dan pensijilan kilang secara menyeluruh menunjukkan komitmen kami terhadap kualiti, keselamatan, dan tanggungjawab alam sekitar.
  items:
    - title: CE Diperakui
      description: 64 model CE-bersijil mematuhi keperluan penandaan CE Eropah untuk kapal rekreasi, memastikan piawaian keselamatan, kesihatan, dan perlindungan alam sekitar dipenuhi.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Sistem pengurusan kualiti kami ISO disijilkan 9001:2015, merangkumi reka bentuk, pembuatan, dan pengedaran kenderaan air boleh kembung serta peralatan marin.
      icon: tabler:clipboard-check
    - title: UKCA Ditanda
      description: Produk yang dijual di pasaran UK membawa penandaan UKCA, mengesahkan pematuhan dengan peraturan UK untuk peralatan marin dan kenderaan air peribadi.
      icon: tabler:shield
    - title: BSCI Mematuhi
      description: Aquafarer diaudit BSCI (Inisiatif Pematuhan Sosial Perniagaan), menunjukkan amalan pengilangan beretika, syarat kerja adil, dan tanggungjawab rantaian bekalan.
      icon: tabler:heart-handshake
    - title: REACH Mematuhi
      description: Semua bahan yang digunakan dalam produk Aquafarer mematuhi peraturan EU REACH untuk keselamatan bahan kimia, memastikan tiada bahan terhad dalam PVC, Hypalon, atau komponen kami.
      icon: tabler:flask
    - title: Ujian Bahan
      description: Kain diuji untuk kekuatan tegangan, rintangan koyak, degradasi UV, dan prestasi retak sejuk. Setiap kumpulan pengeluaran diambil sampel dan disahkan.
      icon: tabler:test-pipe
content_factory:
  tagline: Piawaian Kilang
  title: Kecemerlangan Pembuatan<br />— Dibina Mengikut Spesifikasi
  subtitle: Fasiliti 12,000 m² kami beroperasi di bawah protokol kawalan kualiti yang ketat pada setiap peringkat pengeluaran.
  list:
    - 'Pemeriksaan Bahan Masuk: Semua bahan mentah — kain PVC, Hypalon, aluminium, kayu lapis, gam — diuji mengikut spesifikasi sebelum masuk ke pengeluaran.'
    - 'Kawalan Kualiti Dalam Proses: Setiap peringkat pengeluaran mempunyai titik semak QC yang didokumenkan. Kekuatan kimpalan, penjajaran jahitan, pemasangan injap, dan tork sambungan disahkan secara langsung.'
    - 'Ujian Tekanan: Setiap ruang boleh kembung diuji tekanan pada 1.25× tekanan berperingkat selama 24–48 jam. Kadar kebocoran mesti berada dalam had yang diterima mengikut ISO 6185.'
    - 'Pemeriksaan Akhir: Produk yang siap diperiksa untuk ketepatan dimensi, kemasan kosmetik, kelengkapan aksesori, dan integriti pembungkusan sebelum penghantaran.'
    - 'Kebolehsanan Kumpulan: Setiap produk mempunyai nombor siri yang dikaitkan dengan rekod kumpulan pengeluaran, membolehkan kebolehsanan penuh dari bahan mentah ke barang siap.'
content_safety:
  tagline: Standard Keselamatan Marin
  title: Keselamatan Terlebih Dahulu<br />— Direka untuk Operasi yang Boleh Dipercayai
  subtitle: Produk Aquafarer direka dan diuji untuk memenuhi standard keselamatan marin antarabangsa untuk penggunaan komersial dan rekreasi.
  items:
    - title: ISO 6185
      description: Bot tiup mematuhi standard ISO 6185 untuk pembinaan, kestabilan, daya apung, dan kapasiti muatan.
      icon: tabler:sailboat
    - title: Standard ABYC
      description: Sistem elektrik dan sistem bahan api mengikuti standard ABYC (American Boat & Yacht Council) untuk pemasangan dan operasi yang selamat.
      icon: tabler:bolt
    - title: SOLAS Pematuhan
      description: Peralatan keselamatan dan alatan menyelamat memenuhi keperluan SOLAS (Keselamatan Nyawa di Laut) di mana berkenaan.
      icon: tabler:lifebuoy
