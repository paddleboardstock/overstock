hero:
  tagline: Brazil
  title: Papan Borong SUP untuk<br />Peruncit Brazil
  subtitle: Untuk kedai dan pengendali dari Rio dan Florianópolis hingga ke pantai Timur Laut — papan dayung overstock baharu dari 5 unit, model campuran, dihantar dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan stok berlebihan SUP untuk peruncit pantai Brazil dan sekolah dayung
direct_answer: Paddle Board Overstock membekalkan papan kembung overstock baharu SUP kepada perniagaan Brazil — sekolah dayung dan kedai di Rio de Janeiro, Florianópolis, dan pantai Timur Laut, pengendali sewaan, dan penjual dalam talian. Pesanan borong bermula dengan 5 papan dengan model campuran dalam satu penghantaran, dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut tergabung. Setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran, dihargai mengikut jumlah keseluruhan
  - Menyajikan budaya pantai Brazil dari Rio ke Timur Laut
  - Kargo udara ekspres atau laut konsolidasi dari Weihai, China
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: SUP Pasar Brazil
  paragraphs:
    - Brazil adalah salah satu pasar stand-up paddle paling semula jadi di dunia. Budaya pantai adalah budaya kebangsaan — dari suasana Stand Up Paddle di lagun Rio dan campuran ombak dan air rata di Florianópolis hingga ke perairan hangat dan tenang di Timur Laut di Ceará, Pernambuco, dan Bahia. Sekolah dayung, penyewaan lagun, serta komuniti downwind dan surf SUP semuanya menarik daripada populasi yang besar dan gila sukan.
    - Pembeli Brazil biasanya perniagaan yang dikendalikan sendiri — gerai sewaan di tepi lagun, sekolah pantai, kedai luncur yang menambah SUP barisan, dan penjual e-dagang domestik yang semakin berkembang. Mereka membuat pesanan dalam jumlah kecil (5–20 papan), dan mereka mengambil berat tentang ketahanan untuk kegunaan harian serta daya saing harga dalam pasaran dengan kos import yang bermakna.
  customer_types:
    - title: Sekolah Lagoon & Beach
      description: Sekolah dan pengendali sewaan di lagun Rio serta pantai air tenang di Timur Laut menyediakan kelas dan sewaan setiap jam.
    - title: Kedai Luncur
      description: Peruncit luncur yang sudah mantap menambah air tenang dan pelancongan SUP untuk komuniti pendayung tempatan.
    - title: Penjual Dalam Talian
      description: Penjual e-dagang domestik mengimport SUP stok untuk melayani pasaran dalaman Brazil yang besar.
shipping_section:
  title: Kapal ke Brazil
  paragraphs:
    - Pesanan dihantar dari Weihai, China. Kargo udara ekspres membawa sampel dan 1–3 pesanan papan ke lapangan terbang utama Brazil; Consolidated Sea Freight melayani 5–20 pesanan borong papan melalui pelabuhan seperti Santos dan pintu masuk pantai lain. Anggaran transit destinasi anda termasuk dalam sebut harga anda.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan untuk pelepasan, dengan kod HS yang betul dan nilai yang diisytiharkan. Duti import dan cukai perlu dibayar oleh pengimport di bawah peraturan Brazil.
  customs_note: Cukai import Brazil ke atas barangan sukan adalah signifikan dan berbeza mengikut klasifikasi produk. Sahkan duti semasa, VAT, dan sebarang caj peringkat negeri dengan broker kastam anda (despachante) sebelum membuat pesanan — kami menyediakan dokumentasi lengkap tetapi tidak menggabungkan cukai import ke dalam sebut harga penghantaran.
faq_section:
  title: Soalan Lazim Brazil
  items:
    - q: Bolehkah sebut harga dan sokongan dikendalikan dalam bahasa Portugis?
      a: Ya — kami bekerjasama dengan pembeli berbahasa Portugis. Tanya dalam pertanyaan anda dan kami akan mengendalikan sebut harga dan pesanan anda dalam bahasa Portugis.
    - q: Adakah cukai import Brazil termasuk dalam harga anda?
      a: Tidak. Duti import, VAT, dan cukai peringkat negeri adalah tanggungjawab pengimport di bawah peraturan Brazil. Kami menyatakan harga papan dan penghantaran dengan jelas dan berasingan, serta menyediakan dokumen yang diperlukan oleh penghantar anda.
    - q: Bagaimana rupa pesanan pertama untuk sekolah pantai Brazil?
      a: 'Biasanya 5–15 papan: model serba boleh yang tahan lasak untuk pelajaran dan sewaan setiap jam, serta beberapa edisi premium untuk paparan runcit. Campuran model dalam satu penghantaran, harga berdasarkan jumlah keseluruhan.'
    - q: Adakah anda menghantar melalui kargo laut ke Brazil?
      a: Ya — kargo laut terkumpul melayani pelabuhan Brazil untuk pesanan borong 5–20 papan, dengan sebut harga mengikut destinasi. Penghantaran udara ekspres tersedia untuk sampel dan pesanan kecil yang segera.
