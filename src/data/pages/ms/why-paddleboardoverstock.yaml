reasons:
  tagline: Perbezaan Paddle Board Overstock
  title: Apa yang Membezakan Kami
  isBeforeContent: false
  columns: 3
  items:
    - title: Pengilangan Sebenar, Bukan Perdagangan
      description: Kami memiliki dan mengendalikan kilang seluas 12,000 m². Apabila anda bekerjasama dengan Paddle Board Overstock, anda bekerja terus dengan orang yang mereka bentuk, mengjurutera, dan membina produk anda — tanpa orang tengah.
      icon: tabler:building-factory
    - title: Pendekatan Dipimpin Kejuruteraan
      description: Our design process starts with the use case, not the product category. We optimize hull shape, material selection, and configuration for how the board will actually be used on the water.
      icon: tabler:engine
    - title: Proven Quality
      description: Every board is pressure-tested to 1.25x its rated pressure for 24-48 hours before shipping, and 99.3% of our shipments arrive defect-free — backed by our warranty.
      icon: tabler:award
    - title: Paddler-First Design
      description: "Every model starts with how you paddle: stable platforms for beginners, streamlined shapes for touring, and full-size decks for yoga. We design for real paddlers, not showroom specs."
      icon: tabler:adjustments
    - title: Logistik Global
      description: Gudang AS di California, penghantaran terus dari Weihai, penghantaran udara untuk pesanan segera. Kami menguruskan dokumen dan kertas kerja kastam di seluruh dunia.
      icon: tabler:truck-delivery
    - title: Sokongan Sepanjang Hayat
      description: We stand behind boards we built 20 years ago. Genuine spare parts, technical advice, repair guidance — our team is there when you need us, wherever you are.
      icon: tabler:lifebuoy
testimonials:
  tagline: Trusted by Paddlers Worldwide
  title: What Paddlers Say
  items:
    - content: My Ocean Voyager has handled everything from calm lake mornings to choppy coastal afternoons. Two seasons in, it still looks and rides like new.
      name: — Recreational Paddler, California
    - content: I was nervous buying my first inflatable board online, but the quality was obvious the moment I inflated it. Rigid, stable, and beautifully finished.
      name: — First-Time SUP Owner, Germany
    - content: We paddle as a family every summer weekend. Three boards, zero issues, and the kids love the bright designs.
      name: — Family Paddler, Australia
    - content: The pressure testing is not marketing talk — my board is rock-solid at full pressure and shows no stretch after a year of weekly paddling.
      name: — Weekly Paddler, Netherlands
