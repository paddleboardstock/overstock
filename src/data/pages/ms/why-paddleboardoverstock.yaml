pillars:
  tagline: Tiga Tonggak Kualiti
  title: Mengapa Pendayung di Seluruh Dunia Memilih Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Direka Untuk Penggunaan Komersial
      description: Papan kami direka untuk bertahun-tahun mendayung secara berkala. PVC Teras bertetulang gred komersial drop-stitch UV, bahan yang stabil, dan perkakasan yang diuji di lapangan bermakna penyelenggaraan yang lebih rendah dan hayat yang lebih lama di atas air.
      icon: tabler:building-factory
      callToAction:
        text: Lihat barisan produk komersial
        href: /products
    - title: Diuji melebihi piawaian
      description: Setiap papan dipompa sehingga 1.25x tekanan yang dinilai selama 24-48 jam sebelum keluar dari kilang kami — 100% diuji tekanan, 99.3% bebas kecacatan. Papan anda terbukti tahan lasak sebelum ia terkena air.
      icon: tabler:shield-check
      callToAction:
        text: Lihat bagaimana kami menguji
        href: /quality
    - title: Dibina Untuk Keadaan Global
      description: 'Produk dioptimumkan untuk setiap iklim: formulasi PVC air sejuk untuk Eropah, bahan UV-tahan untuk Timur Tengah dan Australia, rawatan anti-kelembapan untuk Asia Tenggara. Setiap penghantaran dikalibrasi mengikut persekitaran destinasi.'
      icon: tabler:world
