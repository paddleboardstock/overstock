reasons:
  tagline: Perbezaan Paddle Board Overstock
  title: Apa yang Membezakan Kami
  isBeforeContent: false
  columns: 3
  items:
    - title: Pengilangan Sebenar, Bukan Perdagangan
      description: Kami memiliki dan mengendalikan kilang seluas 12,000 m². Apabila anda bekerjasama dengan Paddle Board Overstock, anda bekerja terus dengan orang yang mereka bentuk, mengjurutera, dan membina produk anda — tanpa orang tengah.
      icon: tabler:building-factory
    - title: Pendekatan Dipimpin Kejuruteraan
      description: Proses reka bentuk kami bermula dengan kes penggunaan, bukan kategori produk. Kami mengoptimumkan bentuk badan kapal, pemilihan bahan, dan konfigurasi untuk bagaimana papan itu sebenarnya akan digunakan di atas air.
      icon: tabler:engine
    - title: Kualiti Terbukti
      description: Setiap papan diuji tekanan sehingga 1.25x tekanan yang dinilai selama 24-48 jam sebelum penghantaran, dan 99.3% penghantaran kami tiba tanpa kecacatan — disokong oleh jaminan kami.
      icon: tabler:award
    - title: Reka Bentuk Paddler-First
      description: 'Setiap model bermula dengan cara anda mendayung: platform stabil untuk pemula, bentuk aerodinamik untuk pelancongan, dan dek bersaiz penuh untuk yoga. Kami mereka bentuk untuk pendayung sebenar, bukan spesifikasi bilik pameran.'
      icon: tabler:adjustments
    - title: Logistik Global
      description: Gudang AS di California, penghantaran terus dari Weihai, penghantaran udara untuk pesanan segera. Kami menguruskan dokumen dan kertas kerja kastam di seluruh dunia.
      icon: tabler:truck-delivery
    - title: Sokongan Sepanjang Hayat
      description: Kami berdiri di belakang papan yang kami bina 20 tahun lalu. Alat ganti asli, nasihat teknikal, panduan pembaikan — pasukan kami sentiasa ada apabila anda memerlukan kami, di mana sahaja anda berada.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dipercayai oleh Paddlers Worldwide
  title: Apa Kata Pendayung
  items:
    - content: Ocean Voyager saya telah mengendalikan segala-galanya dari pagi tasik yang tenang hingga petang pantai yang bergelora. Selepas dua musim, ia masih kelihatan dan bergerak seperti baru.
      name: — Pendayung Rekreasi, California
    - content: Saya agak gugup membeli papan tiup pertama saya secara dalam talian, tetapi kualitinya jelas sebaik sahaja saya mengembangkannya. Kukuh, stabil, dan kemasan yang cantik.
      name: — Pemilik Kali Pertama SUP , Jerman
    - content: Kami mendayung sebagai keluarga setiap hujung minggu musim panas. Tiga papan, tiada masalah, dan anak-anak suka reka bentuk yang terang.
      name: — Perahu Keluarga, Australia
    - content: Ujian tekanan bukan sekadar perbincangan pemasaran — papan saya sangat kukuh pada tekanan penuh dan tidak menunjukkan regangan selepas setahun mendayung mingguan.
      name: — Pendayung Mingguan, Belanda
cta:
  title: Bersedia untuk mencari papan yang sempurna untuk anda?
  subtitle: Berbincanglah dengan pakar mendayung kami untuk nasihat jujur tentang memilih papan yang tepat — tiada tekanan, hanya bantuan sebenar.
  actions:
    - variant: primary
      text: Berbual dengan pasukan kami
      href: /contact
    - text: Muat turun katalog produk
      href: /resources
