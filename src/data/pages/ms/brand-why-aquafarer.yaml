features3_reasons:
  tagline: Mengapa Memilih Aquafarer
  title: Tujuh sebab untuk bekerjasama dengan kami
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Pembuatan Sebenar, Bukan Perdagangan
      description: Kami memiliki dan mengendalikan sebuah kilang seluas 12,000 m². Apabila anda bekerjasama dengan Aquafarer, anda bekerja secara langsung dengan orang yang mereka bentuk, mereka bentuk, dan membina produk anda — tiada orang tengah.
      icon: tabler:building-factory
    - title: 2. Pendekatan Berpandukan Kejuruteraan
      description: Proses reka bentuk kami bermula dengan kes penggunaan, bukan kategori produk. Kami mengoptimumkan bentuk badan kapal, pemilihan bahan, dan konfigurasi untuk bagaimana bot sebenarnya akan digunakan.
      icon: tabler:engine
    - title: 3. Kualiti Bertauliah
      description: CE diperakui, ISO sistem kualiti, BSCI mematuhi, REACH mematuhi, USCG diluluskan. CEModel kami yang diperakui 64 memenuhi piawaian antarabangsa — bukan sekadar tuntutan.
      icon: tabler:certificate
    - title: 4. Fleksibel OEM/ODM
      description: Warna tiub, susun atur konsol, penjenamaan, pembungkusan — kami sesuaikan mengikut spesifikasi anda. Tiada tekanan pesanan minimum. Mulakan dengan prototaip, skala dengan yakin.
      icon: tabler:adjustments
    - title: 5. Logistik Global
      description: Gudang AS di California, penghantaran terus dari Qingdao, penghantaran udara untuk pesanan segera. Kami menguruskan dokumen kastam dan dokumentasi.
      icon: tabler:truck-delivery
    - title: 6. Sokongan Sepanjang Hayat
      description: Kami menyokong bot yang kami bina 20 tahun lalu. Alat ganti asli, nasihat teknikal, panduan pembaikan — pasukan kami sentiasa bersedia apabila anda memerlukan kami.
      icon: tabler:lifebuoy
    - title: 7. Spesifikasi Jujur
      description: Penarafan beban sebenar, dimensi sebenar, berat sebenar. Tiada inflasi pemasaran. Apa yang kami terbitkan adalah apa yang anda dapat — disahkan melalui ujian bebas.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dipercayai oleh Jenama di Seluruh Dunia
  title: Apa Kata Rakan Kongsi Kami
  items:
    - content: Kami telah bekerjasama dengan beberapa pengeluar di China, tetapi Aquafarer menonjol kerana sokongan kejuruteraan dan kualiti yang konsisten. Mereka menganggap jenama kami seperti milik mereka sendiri.
      name: — OEM Rakan Kongsi, Jenama Sukan Air Eropah
    - content: Hypalon RIBs mereka telah digunakan bersama armada kami selama lebih 5 tahun. Penyelenggaraan minimum, ketahanan UV yang cemerlang. Waranti 5 tahun untuk tiub memberikan kami keyakinan.
      name: — Pengendali Armada, Kumpulan Resort Timur Tengah
    - content: Pasukan Aquafarer membantu kami membangunkan reka bentuk papan SUP khusus dari konsep hingga pengeluaran dalam 90 hari. Kualitinya melebihi jangkaan kami.
      name: — Pengedar, Sukan Air Australia
cta:
  title: Sedia untuk mengalami perbezaannya?
  subtitle: Hubungi pasukan kami untuk membincangkan projek anda. Tiada komitmen diperlukan — hanya nasihat jujur mengenai pembuatan.
  actions:
    - variant: primary
      text: Bercakap dengan pasukan kami
      href: /contact
    - text: Muat turun katalog produk
      href: /resources
