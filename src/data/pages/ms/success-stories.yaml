stories:
  - title: Bagaimana Resort Mediterranean Membangunkan Perniagaan Sewa SUP yang Menguntungkan
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: Resort pantai bertaraf 5 bintang — Greece
    problem: Resort ini memerlukan aktiviti air premium untuk tetamu bagi meningkatkan skor kepuasan dan mencipta aliran pendapatan baru, tetapi kekurangan peralatan, infrastruktur keselamatan, dan kepakaran kakitangan.
    solution: Paddle Board Overstock menyerahkan 50 papan SUP berjenama khas dengan warna dan logo resort, sistem keselamatan lengkap termasuk stesen penyelamat dan tali pelampung, serta program latihan kakitangan selama 3 hari merangkumi pengendalian peralatan, arahan untuk tetamu, dan protokol keselamatan.
    result:
      - 300+ aktiviti tetamu mingguan ditempah dalam bulan pertama
      - 'Skor kepuasan tetamu untuk aktiviti air: 4.8/5'
      - 'Pendapatan tambahan tahunan baru: $180K'
      - Tiada insiden keselamatan dalam musim operasi pertama
      - Kos penggantian peralatan dikurangkan 40% berbanding pembekal sebelumnya
    quote:
      text: Paddle Board Overstock bukan sekadar menghantar papan — mereka membantu kami membina pengalaman tetamu yang lengkap. Program sukan air kami meningkat dari sifar menjadi tarikan utama resort dalam satu musim.
      author: Pengurus Besar Resort
    cta_text: Bina Penyelesaian Resort Anda
    cta_href: /solutions/resorts
  - title: Bagaimana Kelab Pantai Thai Meningkat Dari 10 ke 80 Papan
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Kelab sukan air — Thailand
    problem: Sebuah kelab kecil di tepi pantai di Phuket perlu berkembang daripada operasi hobi kepada perniagaan penyewaan profesional untuk pelancong, tetapi tidak dapat menemui pembekal peralatan yang boleh dipercayai dengan kualiti dan harga yang konsisten.
    solution: Bermula dengan Pakej Permulaan Kelab Paddle Board Overstock (10 papan, dayung, peralatan keselamatan, penjenamaan), kelab ini berkembang melalui program Pakej Premium selama 18 bulan.
    result:
      - Berkembang dari 10 ke 80 papan dalam 18 bulan dengan kualiti dan harga yang konsisten
      - Menambahkan kelas yoga dan kecergasan SUP ke dalam jadual mingguan
      - Penjenamaan kelab khusus meningkatkan pengiktirafan jenama di kalangan pelancong
      - Kos penyelenggaraan dikurangkan 60% berbanding peralatan bajet sebelumnya
      - Kini menyelenggara 150 + penyewaan harian semasa musim puncak
    quote:
      text: Pakej Permulaan Kelab adalah titik permulaan yang sempurna. Apabila perniagaan kami berkembang, Paddle Board Overstock berkembang bersama kami — kualiti yang sama, harga yang sama, tiada kejutan.
      author: Pemilik Kelab, Phuket
    cta_text: Mulakan Pakej Kelab Anda
    cta_href: /solutions/clubs
  - title: Bagaimana Rangkaian Resort Caribbean Menyeragamkan Sukan Air di 5 Hartanah
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Rangkaian resort — Caribbean
    problem: Sebuah rangkaian resort mewah dengan 5 hartanah memerlukan kualiti peralatan sukan air dan penjenamaan yang konsisten di semua lokasi, dengan perolehan berpusat dan perancangan penggantian bermusim.
    solution: Paddle Board Overstock menyediakan armada pelbagai hartanah sebanyak 400 SUPs dengan penjenamaan seragam, inventori alat ganti bersama, dan jadual penggantian tahunan dengan harga berjumlah.
    result:
      - Menyeragamkan pengalaman tetamu di semua 5 hartanah
      - Pengurangan kos sebanyak 30% melalui pembelian terkonsolidasi dan harga volume
      - Inventori alat ganti berpusat mengurangkan masa henti sebanyak 80%
      - Program penyegaran peralatan tahunan menghapuskan keperluan tergesa-gesa pada hujung musim
      - Penyertaan sukan air tetamu meningkat 45% dari tahun ke tahun
    cta_text: Reka Program Resort Anda
    cta_href: /solutions/resorts
