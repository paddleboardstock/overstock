hero:
  tagline: Kisah Kejayaan
  title: Hasil Sebenar Dari<br />Pembina Perniagaan Air
  subtitle: Lihat bagaimana kelab, resort, dan usahawan di seluruh dunia membina operasi sukan air yang menguntungkan dengan peralatan dan sokongan Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Kisah kejayaan pelanggan Aquafarer
stories:
  - title: Bagaimana Resort Mediterranean Membangunkan Perniagaan Sewa SUP yang Menguntungkan
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: Resort pantai bertaraf 5 bintang — Greece
    problem: Resort ini memerlukan aktiviti air premium untuk tetamu bagi meningkatkan skor kepuasan dan mencipta aliran pendapatan baru, tetapi kekurangan peralatan, infrastruktur keselamatan, dan kepakaran kakitangan.
    solution: Aquafarer menyediakan 50 papan SUP jenama custom dengan warna dan logo resort, sistem keselamatan lengkap termasuk stesen penyelamat dan tali pelampung, serta program latihan kakitangan 3 hari merangkumi pengendalian peralatan, arahan untuk tetamu, dan protokol keselamatan.
    result:
      - 300+ aktiviti tetamu mingguan ditempah dalam bulan pertama
      - 'Skor kepuasan tetamu untuk aktiviti air: 4.8/5'
      - 'Pendapatan tambahan tahunan baru: $180K'
      - Tiada insiden keselamatan dalam musim operasi pertama
      - Kos penggantian peralatan dikurangkan 40% berbanding pembekal sebelumnya
    quote:
      text: Aquafarer bukan sahaja menyediakan papan — mereka membantu kami membina pengalaman tetamu yang lengkap. Program sukan air kami pergi dari sifar ke tarikan utama resort dalam satu musim.
      author: Pengurus Besar Resort
    cta_text: Bina Penyelesaian Resort Anda
    cta_href: /solutions/resorts
  - title: Bagaimana Startup Australia Membangunkan Jenama Air Dalam 90 Hari
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Usahawan pertama kali — Australia
    problem: Seorang pencinta aktiviti luar ingin melancarkan jenamanya sendiri SUP untuk pasaran Australia tetapi tidak mempunyai pengalaman pembuatan, tiada hubungan dengan pembekal, dan modal terhad.
    solution: Pakej Pelancaran Jenama Aquafarer menyediakan konsultasi pemilihan produk, reka bentuk logo dan warna custom, pembungkusan runcit berjenama dengan tag gantung, dokumentasi pensijilan CE, dan penghantaran FOB ke Sydney.
    result:
      - Penghantaran pertama 200 papan disampaikan dalam 75 hari dari kontak pertama
      - Jenama dilancarkan di Shopify + Amazon AU dalam 2 minggu selepas ketibaan
      - Inventori awal habis dijual dalam 45 hari
      - 'Margin purata: 55% pada harga runcit'
      - 'Tempahan kedua: 500 unit dibuat dalam 60 hari selepas pelancaran'
    quote:
      text: Saya mempunyai idea jenama tetapi tiada pengetahuan pembuatan. Aquafarer benar-benar memegang tangan saya sepanjang proses — dari memilih reka bentuk papan yang betul hingga membuka bungkusan penghantaran pertama saya. 90 hari dari impian ke penghantaran.
      author: Pengasas, Jenama SUP Australia
    cta_text: Lancarkan Jenama Anda
    cta_href: /solutions/entrepreneurs
  - title: Bagaimana Kelab Pantai Thai Meningkat Dari 10 ke 80 Papan
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Kelab sukan air — Thailand
    problem: Sebuah kelab kecil di tepi pantai di Phuket perlu berkembang daripada operasi hobi kepada perniagaan penyewaan profesional untuk pelancong, tetapi tidak dapat menemui pembekal peralatan yang boleh dipercayai dengan kualiti dan harga yang konsisten.
    solution: Bermula dengan Pakej Permulaan Kelab Aquafarer (10 papan, dayung, peralatan keselamatan, penjenamaan), kelab ini berkembang melalui program Pakej Premium selama 18 bulan.
    result:
      - Berkembang dari 10 ke 80 papan dalam 18 bulan dengan kualiti dan harga yang konsisten
      - Menambah sewaan kayak dan bot kayuh menggunakan pembekal yang sama
      - Penjenamaan kelab khusus meningkatkan pengiktirafan jenama di kalangan pelancong
      - Kos penyelenggaraan dikurangkan 60% berbanding peralatan bajet sebelumnya
      - Kini menyelenggara 150 + penyewaan harian semasa musim puncak
    quote:
      text: Pakej Permulaan Kelab adalah titik permulaan yang sempurna. Apabila perniagaan kami berkembang, Aquafarer berkembang bersama kami — kualiti sama, harga sama, tiada kejutan.
      author: Pemilik Kelab, Phuket
    cta_text: Mulakan Pakej Kelab Anda
    cta_href: /solutions/clubs
  - title: Bagaimana Rangkaian Resort Caribbean Menyeragamkan Sukan Air di 5 Hartanah
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Rangkaian resort — Caribbean
    problem: Sebuah rangkaian resort mewah dengan 5 hartanah memerlukan kualiti peralatan sukan air dan penjenamaan yang konsisten di semua lokasi, dengan perolehan berpusat dan perancangan penggantian bermusim.
    solution: Aquafarer menyediakan armada pelbagai hartanah terdiri daripada 300 SUPs dan 100 kayak dengan penjenamaan yang disatukan, inventori alat ganti dikongsi, dan jadual penggantian tahunan dengan harga volume.
    result:
      - Menyeragamkan pengalaman tetamu di semua 5 hartanah
      - Pengurangan kos sebanyak 30% melalui pembelian terkonsolidasi dan harga volume
      - Inventori alat ganti berpusat mengurangkan masa henti sebanyak 80%
      - Program penyegaran peralatan tahunan menghapuskan keperluan tergesa-gesa pada hujung musim
      - Penyertaan sukan air tetamu meningkat 45% dari tahun ke tahun
    cta_text: Reka Program Resort Anda
    cta_href: /solutions/resorts
