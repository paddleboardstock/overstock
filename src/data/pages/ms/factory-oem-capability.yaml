why_us:
  - title: Integrasi Menegak
    description: Kami memiliki kilang, acuan, dan rantaian bekalan kami sendiri — tiada orang tengah, tiada subkontraktor. Ini memberi kami kawalan ke atas kualiti, kos, dan penghantaran.
  - title: Pensijilan Berganda
    description: ISO pengurusan kualiti 9001 dan BSCI pensijilan pematuhan sosial. Laporan audit kilang tersedia atas permintaan.
  - title: CE Pematuhan
    description: Semua model standard mempunyai CE pensijilan 2013/53/EU. Model tersuai boleh CE disahkan melalui proses yang telah kami tetapkan.
  - title: Kos Rendah MOQ
    description: Mula dengan serendah 5 unit untuk model standard. Kami membantu jenama baharu melancarkan tanpa komitmen inventori yang berlebihan.
