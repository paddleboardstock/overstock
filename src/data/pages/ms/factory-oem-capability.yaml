services:
  - title: Reka Bentuk & Kejuruteraan Produk
    description: Pasukan R&D dalaman kami bekerja dengan konsep atau spesifikasi anda untuk membangunkan lukisan CAD, model 3D, dan prototaip. Kami menawarkan reka bentuk acuan, pengoptimuman bentuk kapal, dan panduan pemilihan bahan.
  - title: Penjenamaan & Grafik Tersuai
    description: Percetakan digital berwarna penuh, percetakan skrin, embossing, dan pilihan label. Kami membangunkan grafik dek khusus jenama, penjenamaan tiub, dan pembungkusan sedia untuk runcit.
  - title: Penyesuaian Bahan & Spesifikasi
    description: Pilih dari PVC (standard, mesra alam, kalis api), Hypalon/CSM, drop-stitch, dan pembinaan hibrid. Warna tiub, berat kain, dan pilihan pengukuhan yang boleh disesuaikan.
  - title: Pembungkusan & Logistik
    description: Pembungkusan runcit tersuai, kotak jenama peribadi, pembungkusan vakum, pemaletan, dan pemuatan kontena. FOB Qingdao, CIF, atau DDP syarat penghantaran tersedia.
