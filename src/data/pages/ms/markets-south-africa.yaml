hero:
  tagline: Afrika Selatan
  title: Papan Borong SUP untuk<br />Peruncit Afrika Selatan
  subtitle: Kedai dan pengendali Cape Town, Durban, dan Garden Route — papan dayung overstock baharu daripada 5 unit, model campuran, dihantar dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan stok berlebihan SUP untuk peruncit dan pengendali Afrika Selatan
direct_answer: Paddle Board Overstock membekalkan papan kembung overstock baharu SUP kepada perniagaan Afrika Selatan — kedai dan sekolah di Cape Town, Durban, serta sepanjang Garden Route, pengendali sewaan, dan penjual dalam talian. Pesanan borong bermula dengan 5 papan dengan model campuran dalam satu penghantaran, dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut tergabung. Setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran, dihargai mengikut jumlah keseluruhan
  - Melayani pasaran runcit sukan papan paling mantap di Afrika
  - Kargo udara ekspres atau laut konsolidasi dari Weihai, China
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: Pasaran Afrika Selatan SUP
  paragraphs:
    - Afrika Selatan mempunyai pasaran sukan papan paling matang di benua ini. Cape Town menggabungkan laluan angin bertaraf dunia dan lagun air rata dengan budaya luncur ombak yang mendalam; Durban mengendalikan pantai air hangat sepanjang tahun; lagun knysna dan Teluk Plettenberg di Garden Route direka untuk aktiviti mendayung rekreasi. Infrastruktur runcit yang mantap dan komuniti mendayung tempatan yang tulen — daripada SUP peselancar hingga pendayung kecergasan air rata — membezakan pasaran ini.
    - Buyers here are seasoned: Kedai luncur dengan lantai runcit sebenar, sekolah dayung dengan armada, dan pengendali pengembaraan yang SUP digabungkan dengan lawatan kayak dan berbasikal. Mereka menilai peralatan seperti profesional — pembinaan, jaminan, dan kebolehbaikan — dan mereka membuat pesanan dalam kumpulan kecil yang sengaja terdiri daripada 5–20 papan, menggabungkan peralatan serba boleh gred sewa dengan edisi premium untuk dinding runcit.
  customer_types:
    - title: Kedai Surf & Paddle
      description: Peruncit Cape Town dan Durban yang sudah bertapak menambah atau memperluaskan SUP barisan untuk komuniti pendayung tempatan.
    - title: Sekolah & Sewaan Paddle
      description: Sekolah dan armada sewa di lagun dan pantai air tenang, papan penyegaran dalam kitaran pengganti sebenar.
    - title: Pengendali Pengembaraan
      description: Pengendali Garden Route dan Western Cape menambah SUP tawaran pengembaraan pelbagai aktiviti.
shipping_section:
  title: Kapal ke Afrika Selatan
  paragraphs:
    - Pesanan dihantar dari Weihai, China. Kargo udara ekspres membawa sampel dan 1–3 pesanan papan ke Johannesburg dan Cape Town; Kargo laut konsolidasi melayani 5–20 pesanan borong papan melalui Durban, Cape Town, dan pelabuhan lain. Anggaran transit untuk destinasi anda disertakan dalam sebut harga anda.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan, dengan kod HS yang betul dan nilai yang diisytiharkan. Duti import dan VAT perlu dibayar oleh pengimport mengikut peraturan Afrika Selatan.
  customs_note: Pelepasan SARS adalah berasaskan dokumentasi — sahkan layanan duti semasa dan VAT untuk peralatan sukan kembung dengan ejen penyelesaian anda sebelum membuat pesanan. Kami membekalkan dokumen yang lengkap dan konsisten serta memberi respons pantas kepada permintaan broker.
faq_section:
  title: Soalan Lazim Afrika Selatan
  items:
    - q: Adakah papan sesuai dengan keadaan campuran di Cape Town?
      a: Ya. Model serba boleh mengendalikan air tenang lagun dan hari pantai yang tenang, dan rangkaian ini termasuk papan berorientasikan touring untuk dayung yang lebih panjang. Untuk larian di bawah angin lautan terbuka, pendayung berpengalaman harus berbincang dengan kami sebelum membuat pesanan.
    - q: Bagaimana rupa pesanan kedai?
      a: 'Biasanya 5–20 papan: asas model serba boleh untuk pelajaran dan sewaan serta edisi seni premium untuk dinding runcit — model campuran, satu penghantaran, dengan harga mengikut jumlah keseluruhan.'
    - q: Bagaimana sebut harga kargo ke Afrika Selatan?
      a: Hantar udara ke Johannesburg atau Cape Town untuk sampel dan pesanan kecil; penghantaran laut terkumpul ke Durban atau Cape Town untuk kuantiti borong. Kedua-duanya diperincikan dalam sebut harga anda dengan anggaran masa transit.
    - q: Siapa yang menguruskan duti import dan VAT?
      a: Anda melakukannya, sebagai pengimport, melalui ejen kastam anda mengikut peraturan SARS. Kami menyediakan invois komersial dan senarai pembungkusan dengan kod HS yang betul dan nilai yang diisytiharkan.
