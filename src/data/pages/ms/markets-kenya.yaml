hero:
  tagline: Kenya
  title: Papan Borong SUP untuk<br />Perniagaan Kenya
  subtitle: Diani, Watamu, Mombasa, dan Nairobi — pengendali pantai, resort, dan peruncit yang menyimpan papan stok baru dari 5 unit, model campuran.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan stok berlebihan SUP untuk resort pantai Kenya dan pengendali
direct_answer: Paddle Board Overstock membekalkan papan kembung overstock baharu SUP kepada perniagaan Kenya — pengendali pantai dan resort di Diani, Watamu, Nyali, dan pantai sekitar Mombasa, serta peruncit dan sekolah yang sampai ke komuniti pendayung Nairobi yang semakin berkembang. Pesanan borong bermula dengan 5 papan dengan model campuran dalam satu penghantaran, dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut konsolidasi. Setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran, dihargai mengikut jumlah keseluruhan
  - Melayani pelancongan pantai Lautan Hindi Kenya dan tambahan safari-lodge
  - Kargo udara ekspres atau laut konsolidasi dari Weihai, China
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: SUP Pasaran Kenya
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: Aktiviti air tenang yang sesuai untuk tetamu resort, hari tanpa angin di sekolah kitesurf, dan mendayung matahari terbenam di atas terumbu.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: Lodge dan kem menambah sesi dayung ke dalam menu aktiviti mereka. Antara pengendali pantai, hotel, sekolah kitesurf dan menyelam yang memperluaskan tawaran mereka, serta dunia dayung Nairobi yang kecil tetapi berkembang, pesanan adalah kecil dan praktikal — 5–15 papan model serba boleh yang stabil dan tahan lasak dengan satu atau dua edisi premium untuk dipamerkan.
  customer_types:
    - title: Pengendali Pantai
      description: Pengendali Diani, Watamu, dan Mombasa menambah SUP sewaan dan kelas untuk pelancong.
    - title: Resort & Lodge Safari dan Pantai
      description: Resort pantai dan lodge menambah program tetamu SUP dengan armada campuran yang padat.
    - title: Sekolah Luncur Layang & Menyelam
      description: Sekolah sukan air sedia ada memperluaskan tawaran mereka dengan aktiviti mendayung di air tenang.
shipping_section:
  title: Kapal ke Kenya
  paragraphs:
    - Pesanan dihantar dari Weihai, China. Kargo udara ekspres membawa sampel dan 1–3 pesanan papan ke lapangan terbang Jomo Kenyatta Nairobi dan pantai; Consolidated Sea Freight melayani 5–20 pesanan borong papan melalui pelabuhan Mombasa. Anggaran transit destinasi anda disertakan dalam sebut harga anda.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan untuk pelepasan, dengan kod HS yang betul dan nilai yang diisytiharkan. Duti import dan cukai perlu dibayar oleh pengimport mengikut peraturan Kenya.
  customs_note: Sahkan layanan duti dan cukai semasa untuk peralatan sukan dengan ejen penjelasan anda sebelum membuat pesanan — struktur tarif Kenya berubah secara berkala. Kami menyediakan dokumentasi lengkap dan konsisten untuk penyelesaian yang lancar.
faq_section:
  title: Soalan Lazim Kenya
  items:
    - q: Bolehkah lembaga menghubungi Diani atau Watamu secara langsung?
      a: Sebut harga penghantaran dari pintu ke pintu meliputi destinasi pantai, menggunakan logistik seterusnya dari lapangan terbang ketibaan atau pelabuhan Mombasa. Catat lokasi tepat anda dalam pertanyaan dan kami akan menetapkan harga secara khusus.
    - q: Bagaimana rupa pesanan permulaan operator pantai?
      a: 'Biasanya 5–10 papan: model serba boleh yang stabil untuk pelajaran pelancong dan sewa, serta satu atau dua edisi premium untuk dipamerkan. Model campuran, satu penghantaran, dihargai mengikut jumlah keseluruhan.'
    - q: Adakah papan ini sesuai untuk lagun yang hangat dan air rata seperti terumbu?
      a: Ya — keadaan tenang, hangat, dan cetek adalah tepat apa yang direka untuk semua jenis SUPs tiup, dan sirip fleksibel serta pembinaan drop-stitch menangani pendaratan di pasir dan terumbu dengan baik.
    - q: Bagaimana kargo dikutip ke Kenya?
      a: Laluan udara ekspres ke Nairobi atau pantai untuk sampel dan pesanan kecil; kargo laut konsolidasi ke Mombasa untuk kuantiti borong. Kedua-duanya disenaraikan dalam sebut harga anda dengan anggaran masa penghantaran.
