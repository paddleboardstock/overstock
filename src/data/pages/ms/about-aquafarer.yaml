values:
  - title: Kualiti Diutamakan
    desc: Setiap bot yang keluar dari kilang kami melalui ujian wajib pengekalan udara, pengelupasan jahitan, dan sistem sebelum penghantaran.
  - title: Integrasi Menegak
    desc: Kami mengawal setiap tahap — dari pemotongan PVC hingga pemasangan akhir — menghapuskan ketidakefisienan kontraktor dan memastikan kualiti konsisten.
  - title: Keselamatan Sebagai Standard
    desc: Pensijilan CE adalah teras kepada apa yang kami bina. 64 model CE kami yang bertauliah memenuhi standard keselamatan EU untuk penggunaan rekreasi dan komersial.
  - title: Berfokuskan Rakan Kongsi
    desc: Kami membina hubungan jangka panjang dengan OEM, ODM, dan rakan kongsi label peribadi melalui ketelusan, kebolehpercayaan, dan pertumbuhan bersama.
services:
  - title: Pengilangan OEM
    desc: Kami membina mengikut spesifikasi anda. Kongsi lukisan anda, dan pasukan kejuruteraan kami menguruskan prototaip, pembinaan alat, dan pengeluaran.
  - title: Penyelesaian ODM
    desc: Mulakan dari rekabentuk platform yang terbukti. Sesuaikan saiz, warna, grafik, dan pembungkusan untuk mencipta rangkaian produk unik anda.
  - title: Label Peribadi
    desc: Nama jenama anda, logo anda, pembungkusan anda. Produk tiba sedia jual runcit dengan integrasi jenama sepenuhnya.
  - title: Penjenamaan Tersuai
    desc: Cetakan pad dek, grafik lambung, pelekat tiub, dan label tersuai — kehadiran jenama konsisten di setiap permukaan.
certifications:
  - name: Pensijilan CE
    desc: Bot dan kenderaan air kami mematuhi Arahan Kenderaan Rekreasi EU (2013/53/EU) dan standard harmonised yang berkaitan.
    scope: Bot & kenderaan air
  - name: null
