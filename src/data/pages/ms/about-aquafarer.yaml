  subtitle: Pengeluar sukan air berpadu secara menegak — daripada bahan mentah hingga bot siap
intro:
  - 'Aquafarer ditubuhkan pada tahun 2012 dengan satu misi: mereka dan hasilkan peralatan sukan air yang berprestasi sama baik di atas air seperti dalam laporan kualiti. Apa yang bermula sebagai bengkel papan SUP yang fokus telah berkembang menjadi kemudahan pembuatan terpadu seluas 12,000 meter persegi di Zon Pembangunan Ekonomi Qingdao, menghasilkan bot tiup, RIBs, kayak, papan SUP, peralatan keselamatan, dan aksesori untuk pelanggan di 50+ negara.'
  - Hari ini, Aquafarer beroperasi sebagai jenama kilang — kami mereka bentuk, merekabentuk kejuruteraan, membuat prototaip, mengilang, dan menguji semua di bawah satu bumbung. Integrasi menegak ini memberi kami kawalan langsung terhadap pemilihan bahan, kualiti binaan, dan garis masa penghantaran. Setiap bot dibina oleh tenaga kerja kami, pada peralatan kami, mengikut piawaian kami.
  - Kami melayani pengguna rekreasi, pengendali komersial, agensi kerajaan, dan rakan jenama di seluruh dunia. Program OEM dan ODM kami membantu perniagaan melancarkan rangkaian produk mereka sendiri tanpa melabur dalam infrastruktur kilang. Sama ada anda memerlukan satu prototaip atau pengeluaran sepenuhnya, pasukan kami membimbing anda dari konsep hingga penghantaran sedia laut.
