content_priorities:
  tagline: Apa yang Disahkan Pelanggan
  title: 8 Perkara Pembeli Sahkan<br />di Setiap Lawatan Kilang
  subtitle: Berdasarkan maklum balas daripada 50+ pembeli negara, ini adalah lapan keutamaan yang dinilai pelanggan sebelum membuat pesanan B2B.
  items:
    - title: Pengeluar Sebenar
      description: 'Adakah anda kilang sebenar, bukan syarikat perdagangan? Pembeli menyemak: entiti perniagaan, peralatan pengeluaran sebenar, pekerja yang mengendalikan mesin, pesanan pengeluaran semasa di lantai, dan kesesuaian laman web-workshop.'
      icon: tabler:building-factory
    - title: Keserasian Produk dengan Aplikasi
      description: Adakah RIB sesuai dengan penggunaan khusus mereka? Operator resort, penyelamatan, menyelam, memancing, dan rondaan mempunyai keperluan asas yang berbeza. Pembeli menilai susun atur dek, bahan tiub, dan pilihan peralatan pada bot yang dipamerkan.
      icon: tabler:target
    - title: Kestabilan & Kebolehpengeluaran Kualiti
      description: Adakah unit ke-50 sebaik unit ke-1? Pembeli memeriksa sistem QC, checkpoint semasa proses, pengendalian ketidakpatuhan, dan meminta melihat rekod daripada beberapa pengeluaran untuk mengesahkan konsistensi.
      icon: tabler:repeat
    - title: Keaslian Dokumen Pematuhan
      description: Adakah sijil CE khusus untuk model? Adakah DoC ditandatangani oleh orang sebenar? Bolehkah pematuhan disahkan mengikut nombor lambung? Pembeli menyemak tuntutan umumnya vs dokumentasi khusus model.
      icon: tabler:file-certificate
    - title: Pelaksanaan Penyesuaian
      description: Bolehkah kilang benar-benar menyediakan konfigurasi custom? Pembeli mencari bukti projek custom terdahulu, sampel prototaip yang dipamerkan, lukisan kejuruteraan, dan keupayaan untuk membincangkan pengubahsuaian teknikal di lokasi.
      icon: tabler:adjustments
    - title: Masa Memimpin & Kapasiti
      description: 'Adakah garis masa yang dinyatakan realistik? Pembeli menilai: jumlah pengeluaran semasa, kapasiti yang ada, saiz tenaga kerja, tahap stok bahan, dan sama ada kilang mempunyai sistem perancangan pengeluaran.'
      icon: tabler:clock
    - title: Harga & Terma Perdagangan
      description: 'Adakah harga telus? Adakah penetapan harga FOB jelas? Pembeli mengesahkan: pecahan harga seunit, kos peralatan, kos pembungkusan, dan sama ada kilang boleh mengendalikan istilah DDP atau CIF dengan dokumentasi eksport yang betul.'
      icon: tabler:currency-dollar
    - title: Perkhidmatan Selepas Jualan & Alat Ganti
      description: 'Apa yang berlaku selepas penghantaran? Pembeli menilai: ketersediaan alat ganti, proses waranti, bahagian tiub ganti, penggantian injap, dan sama ada kilang mempunyai protokol selepas jualan yang didokumenkan.'
      icon: tabler:headset
content_tour:
  tagline: Laluan Lawatan Kilang
  title: Lawatan Audit —<br />Apa Yang Akan Anda Lihat
  subtitle: Lawatan kilang standard kami mengikuti laluan yang ditetapkan yang direka untuk menjawab soalan pembeli di setiap stesen.
  items:
    - title: 1. Bilik Mesyuarat — Pengenalan Syarikat
      description: Lesen perniagaan, sijil ISO 9001 dan BSCI, lesen eksport, dan sejarah syarikat. Gambaran keseluruhan cepat mengenai keupayaan pengeluaran dan skop pematuhan.
      icon: tabler:users
    - title: 2. Gudang Bahan Mentah — Stesen IQC
      description: Rekod pemeriksaan bahan yang diterima, sijil kumpulan kain, sampel pelekat dan perkakasan. Lihat bagaimana bahan diuji sebelum memasuki pengeluaran.
      icon: tabler:building-warehouse
    - title: 3. Pembuatan Tiub — Pengimpalan RF & Pengeleman Tangan
      description: Proses kimpalan atau pelekat tiub secara langsung, demonstrasi ujian kekuatan jahitan, dan pemasangan injap. Perhatikan pembinaan setiap ruang dan titik pemeriksaan kualiti.
      icon: tabler:flame
    - title: 4. Laminasi Lambung — Bengkel GRP
      description: Proses lapisan fiberglass, aplikasi gelcoat, dan pengerasan lambung. Lihat jadual laminasi dan penguatan struktur untuk model RIB yang berbeza.
      icon: tabler:layers-subtract
    - title: 5. Pemasangan & Integrasi
      description: Penyambungan tiub lambung, pemasangan konsol dan tempat duduk, integrasi sistem elektrik dan bahan api, serta pemasangan peralatan. Perhatikan barisan pengeluaran beroperasi.
      icon: tabler:tool
    - title: 6. Stesen Ujian Tekanan
      description: Ujian tahan tekanan 24-48 jam pada 1.25x tekanan yang dinilai. Lihat rekod ujian, pengukur tekanan, dan kriteria lulus/gagal. Lihat bagaimana keputusan ujian dikaitkan dengan nombor siri kapal.
      icon: tabler:gauge
    - title: 7. Pemeriksaan Akhir & Kawalan Kualiti
      description: Senarai semak kualiti 100 mata setiap unit, pengesahan dimensi, pemeriksaan kosmetik, dan pemeriksaan integriti pembungkusan. Semak log ketidakpatuhan dan rekod tindakan pembetulan.
      icon: tabler:clipboard-check
    - title: 8. Bilik Semakan Dokumen
      description: Dokumentasi pematuhan mengikut model (DoC, plat pembina, manual pemilik), rekod kebolehlacakan pengeluaran, daftar HIN, dan demonstrasi pangkalan data penjejakan batch bahan.
      icon: tabler:folder
content_qc_chain:
  tagline: Bukti Berkualiti
  title: Rantaian QC 8-Peringkat<br />— Boleh Disahkan Pada Setiap Langkah
  subtitle: Rantaian kawalan kualiti kami berjalan dari bahan masuk hingga penghantaran akhir, dengan bukti yang didokumenkan pada setiap peringkat.
  items:
    - title: 'Peringkat 1: Pemeriksaan Bahan Masuk'
      description: Setiap kumpulan PVC, Hypalon, gentian kaca, aluminium, pelekat, dan perkakasan diuji mengikut spesifikasi sebelum memasuki pengeluaran. Kekuatan tegangan, lekatan salutan, dan pemeriksaan dimensi mengikut AQL 2.5/ISO2859.
      icon: tabler:package
    - title: 'Peringkat 2: Kimpalan Tiub / Gaming QC'
      description: Ujian kekuatan pengelupasan jahitan setiap kelompok pengeluaran. Parameter kimpalan RF dipantau dan direkodkan. Jahitan yang digamkan tangan diperiksa untuk liputan pelekat yang konsisten dan masa pengerasan.
      icon: tabler:flame
    - title: 'Peringkat 3: QC Laminasi Badan'
      description: Pengukuran ketebalan gelcoat, pengesahan susunan gentian kaca mengikut jadual laminasi, dan pemantauan masa pengerasan. Kedudukan pengukuhan struktur disahkan berdasarkan lukisan kejuruteraan.
      icon: tabler:layers-subtract
    - title: 'Peringkat 4: QC Pemasangan & Integrasi'
      description: Integriti sambungan tiub badan, tork pemasangan konsol dan tempat duduk, kesinambungan elektrik, dan ujian kebocoran sistem bahan api. Setiap titik pemasangan disahkan mengikut senarai semak pemasangan khusus model.
      icon: tabler:tool
    - title: 'Peringkat 5: Ujian Tahan Tekanan'
      description: Setiap ruang kembung ditekan pada 1.25x dan PSI tahan selama 24-48 jam. Penurunan tekanan direkodkan setiap ruang. Ambang lulus/gagal didokumentasikan. Dihubungkan dengan nombor siri badan kapal.
      icon: tabler:gauge
    - title: 'Peringkat 6: Pemeriksaan Akhir'
      description: Senarai semak kualiti 100 mata merangkumi ketepatan dimensi, kemasan kosmetik, kelengkapan aksesori, pakej dokumentasi, dan integriti pembungkusan. Bebas daripada pasukan pengeluaran.
      icon: tabler:clipboard-check
    - title: 'Peringkat 7: Dokumentasi Pematuhan'
      description: DoC khusus model, pengesahan plat pembina, kelengkapan manual pemilik, dan kemasukan daftar HIN. Semua dokumen pematuhan disediakan dan disahkan sebelum penghantaran dilepaskan.
      icon: tabler:file-certificate
    - title: 'Tahap 8: Pelepasan Penghantaran & Kebolehkesanan'
      description: Keluaran akhir memerlukan semua peringkat QC dilepaskan, dokumentasi pematuhan lengkap, dan dokumentasi penghantaran disahkan. Rekod lambung ditutup dan diarkibkan untuk penyimpanan selama 10+ tahun.
      icon: tabler:truck
content_traceability:
  tagline: Kebolehkesanan Pengeluaran
  title: → Fail →Induk HIN<br />Penghantaran Rekod Hull →
  subtitle: Setiap RIB bot membawa Nombor Pengenalan Badan Kapal yang unik yang dihubungkan kepada rantaian rekod pengeluaran dan pematuhan yang lengkap.
  items:
    - title: Nombor Pengenalan Lambung (HIN)
      description: Pengenal unik 14 aksara ditandakan secara kekal pada setiap bot. Mengekod kod pengeluar (MIC), penamaan model, tahun pengeluaran, dan nombor siri. Kunci yang membuka keseluruhan rantaian kebolehjejakan.
      icon: tabler:hash
    - title: Fail Teknikal Induk
      description: Dokumentasi pematuhan dan kejuruteraan untuk keluarga model. Mengandungi lukisan GA, penilaian risiko, pengiraan kestabilan, spesifikasi bahan, dan piawaian yang berkenaan. Dihubungkan kepada semua badan model tersebut.
      icon: tabler:folder
    - title: Rekod Badan Kapal Individu
      description: 'Rekod pengeluaran setiap lambung: HIN, tarikh pengeluaran, kelompok tiub, sijil bahan, keputusan ujian tekanan, konfigurasi akhir, spesifikasi enjin, keputusan senarai semak kualiti, dan destinasi penghantaran. 21+ medan data bagi setiap lambung.'
      icon: tabler:file-description
    - title: Pek Pematuhan Pelanggan
      description: Pakej penghantaran setiap lambung termasuk DoC, foto plat pembina, manual pemilik, senarai semak pematuhan, dan helaian konfigurasi akhir. Dihantar bersama bot dan diarkibkan di kilang selama 10+ tahun.
      icon: tabler:package
content_red_flags:
  tagline: Perangkap Audit
  title: Pembeli Bendera Merah<br />mudah dikenali
  subtitle: Isu biasa yang merosakkan keyakinan pembeli semasa audit kilang. Kami menangani setiap satu secara proaktif.
  items:
    - title: Tuntutan CE Menyeluruh Tanpa Skop Model
      description: '“Semua produk CE diperakui” tanpa menyatakan arahan mana, model mana, dan modul pematuhan mana. Amaran merah: mencadangkan pematuhan bersifat luaran dan bukannya mengikut setiap model dan konfigurasi.'
      icon: tabler:alert-triangle
    - title: Tiada Bukti Ujian Fizikal
      description: 'Tuntutan ujian tekanan tanpa rekod ujian, pengukur, atau stesen ujian yang kelihatan di lantai kilang. Bendera merah: tuntutan kualiti tidak dapat disahkan semasa lawatan.'
      icon: tabler:alert-triangle
    - title: Ketelusan Bahan Hilang
      description: 'Tiada rekod batch, tiada pemeriksaan masuk, atau tiada pautan antara sijil bahan dan produk siap. Bendera merah: tiada cara untuk menjejak isu kualiti ke sumber.'
      icon: tabler:alert-triangle
    - title: Dokumentasi Am
      description: "Satu DoC merangkumi semua model, tiada rekod HIN khusus, atau dokumen pematuhan 'templat'. Amaran: pematuhan tidak dihubungkan dengan unit pengeluaran individu."
      icon: tabler:alert-triangle
content_shipping:
  tagline: Penghantaran & Pembungkusan
  title: RIB Kontena Bot<br />Memuat & Membuat Peti
  subtitle: Penyelesaian penghantaran kami melindungi pelaburan anda dari Qingdao ke pelabuhan destinasi. Pelan pemuatan kontena dan spesifikasi pembingkaian tersedia untuk setiap model.
  items:
    - title: Konfigurasi Kontena 20kaki
      description: 'Kontena standard 20 kaki: 1-2 RIB bot (4.0-5.5m) bersarang dengan dek dan tiub dipisahkan, atau 8-12 SUP papan. Konfigurasi campuran RIB + SUP tersedia. Pelan pemuatan terperinci disediakan untuk setiap pesanan.'
      icon: tabler:box
    - title: Konfigurasi Kontena 40kaki
      description: 'Kontena standard 40 kaki: 2-4 RIB bot (sehingga 7.0m) dengan badan bot disusun bersarang dan tiub ditumpuk, atau 20-30 SUP papan. 40 kaki HQ tersedia untuk model RIB yang lebih tinggi. Pembungkusan yang dioptimumkan dari segi isipadu mengurangkan kos penghantaran setiap unit.'
      icon: tabler:container
    - title: Pembungkusan Kayu untuk Lambung RIB
      description: Lambung aluminium dan GRP dibungkus dalam peti kayu bersaiz khusus dengan lapisan buih, penghalang kelembapan, dan tali keluli. Dimensi dan berat peti bagi setiap model tersedia untuk perancangan logistik. Sijil kayu rawatan haba ISPM-15 disertakan.
      icon: tabler:wood
    - title: Pembungkusan Pemisahan Tiub & Dek
      description: Tiub dikempiskan dan dilipat secara berasingan daripada tubuh untuk kecekapan ruang. Plat dek, konsol, dan tempat duduk dibungkus dalam pembalut pelindung bersama kit perkakasan pemasangan. Arahan pemasangan semula disertakan dengan setiap penghantaran.
      icon: tabler:package
    - title: Perlindungan Kelembapan & Kakisan
      description: Kertas anti-kakisan VCI untuk komponen aluminium, pek penyerap kelembapan gel silika, dan beg perkakasan yang disedut vakum. Mencegah kerosakan akibat kondensasi semasa penghantaran laut 30-45 hari.
      icon: tabler:droplet-off
    - title: FOB Dokumentasi Qingdao
      description: Bilik Muatan, Invois Komersial, Senarai Pembungkusan, Sijil Asal, dan dokumentasi pematuhan bagi setiap penghantaran. Penyatuan FCL dan LCL tersedia. Sokongan dokumentasi kastam untuk pasaran EU, AS, dan Timur Tengah.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Bukti Pengesahan
  title: Bukti Audit<br />Anda Boleh Mengesahkan di Tapak
  subtitle: Semasa lawatan kilang, pelanggan boleh mengesahkan bukti tertentu di setiap kawasan pengeluaran. Inilah yang perlu diperhatikan — dan apa yang kami sediakan untuk setiap audit.
  areas:
    - area: Gudang Bahan Mentah
      what_to_verify: Adakah bahan-bahan stabil? Adakah terdapat pencampuran batch?
      evidence: Rekod pemeriksaan masuk, label kelompok, penyimpanan FIFO, senarai kelulusan pembekal, sijil bahan (PVC, Hypalon, gentian kaca, aluminium, gam, perkakasan)
      icon: tabler:building-warehouse
    - area: Pengeluaran Tiub
      what_to_verify: Bagaimana kekuatan jahitan dan ketahanan udara dijamin?
      evidence: Kad proses, pengesahan artikel pertama, rekod ujian tekanan setiap ruang, rekod pembaikan dan ujian semula, rekod pemasangan injap
      icon: tabler:flame
    - area: Pengeluaran Lambung
      what_to_verify: Bagaimana konsistensi struktur dikawal?
      evidence: Dokumen proses terkawal, titik pemeriksaan kualiti, penomboran produk separuh siap, pengukuran ketebalan gelcoat, pengesahan jadual laminasi
      icon: tabler:layers-subtract
    - area: Kawasan Perhimpunan
      what_to_verify: Bagaimana bahagian pilihan dihalang daripada dipasang secara salah?
      evidence: BOM, pesanan kerja, senarai semak konfigurasi, kad pemeriksaan stesen kerja, pemeriksaan tork dan fungsi mengikut model
      icon: tabler:tool
    - area: Stesen Ujian
      what_to_verify: Bagaimana anda mengesahkan bahawa bot itu dalam keadaan baik sebelum penghantaran?
      evidence: Prosedur ujian, senarai instrumen, rekod penalaian, log ujian tekanan (1.25x / 24-48j), senarai semak ujian fungsi, kriteria lulus/gagal didokumenkan
      icon: tabler:gauge
    - area: Kawasan Ketidakpatuhan
      what_to_verify: Bagaimana kecacatan ditangani?
      evidence: Label pengasingan, log NCR, analisis punca akar, rekod kelulusan kerja semula, penjejakan CAPA (Tindakan Pembetulan dan Pencegahan)
      icon: tabler:alert-triangle
    - area: Gudang Barang Siap
      what_to_verify: Bagaimana anda mencegah penghantaran yang salah dan kerosakan?
      evidence: Label produk siap, rekod pemadanan pesanan, standard pembungkusan, rekod pemeriksaan sebelum penghantaran
      icon: tabler:box
    - area: Alat Ganti & Selepas Jualan
      what_to_verify: Bolehkah anda menyokong perkhidmatan selepas jualan jangka panjang?
      evidence: Senarai alat ganti biasa, strategi inventori, sistem penomboran alat ganti, dokumentasi proses jaminan, tutorial penyelenggaraan
      icon: tabler:headset
content_closing_script:
  tagline: Audit untuk Tempahan
  title: Dari Lawatan Kilang<br />kepada Projek yang Disahkan
  subtitle: Audit yang berjaya tidak seharusnya berakhir dengan bergambar dan bersalaman. Sebelum beredar, kami memastikan tiga hasil komersial didokumenkan.
  items:
    - title: Sahkan Konfigurasi Teknikal
      description: Bersetuju mengenai model, aplikasi, pilihan utama, pasaran sasaran, anggaran kuantiti, dan jadual penghantaran — semuanya didokumenkan sebelum berlepas.
      icon: tabler:checklist
    - title: Sahkan Dokumen Langkah Seterusnya
      description: 'Tentukan apa yang Paddle Board Overstock sediakan seterusnya: GA yang disemak semula, senarai konfigurasi, sebut harga, senarai semak dokumen, pelan contoh, atau NDA — dengan garis masa tertentu.'
      icon: tabler:file-plus
    - title: Sahkan Garis Masa Bersama
      description: Konfigurasi yang disemak semula dan sebut harga awal dalam 3 hari bekerja. Pengesahan sampel atau penampilan dalam 7 hari. Semakan kejuruteraan atau pemeriksaan pihak ketiga dalam 14 hari. Tarikh mesyuarat seterusnya dan pihak bertanggungjawab ditetapkan.
      icon: tabler:calendar
faq:
  title: Audit Kilang — Soalan Lazim
  questions:
    - q: Bolehkah saya mengunjungi kilang secara peribadi?
      a: Ya. Kami mengalu-alukan audit kilang secara langsung di fasiliti kami yang seluas 12,000 m² di Qingdao. Lawatan standard kami merangkumi 8 stesen daripada gudang bahan mentah hingga bilik semakan dokumen. Lawatan kilang secara maya melalui panggilan video juga tersedia untuk kelayakan awal.
    - q: Adakah anda menerima audit pihak ketiga (BSCI, SMETA, SGS)?
      a: Ya. Kami mengekalkan pensijilan BSCI (Intertek) dan mengalu-alukan protokol audit khusus pelanggan. Kami juga boleh mengatur pemeriksaan SGS atau TÜV atas permintaan. Laporan audit tersedia di bawah NDA.
    - q: Bolehkah saya melihat ujian tekanan semasa lawatan?
      a: Stesen ujian tekanan kami adalah sebahagian daripada laluan lawatan standard. Bergantung pada jadual pengeluaran, anda boleh memerhatikan ujian tekanan yang aktif dengan bacaan penunjuk dan rekod ujian. Log ujian tekanan bagi setiap kapal sentiasa tersedia untuk semakan.
    - q: Bagaimana anda mengendalikan produk yang tidak mematuhi?
      a: Unit yang tidak mematuhi dipisahkan, didokumenkan, dan disemak mengikut proses tindakan pembetulan ISO 9001 kami. Analisis punca utama dilakukan, tindakan pembetulan dilaksanakan, dan rekod dikekalkan. Pembeli boleh menyemak log NCR kami semasa audit.
    - q: Dokumen pematuhan apa yang tersedia untuk semakan?
      a: 'Semasa audit, anda boleh menyemak: sampel DoC khusus model, spesifikasi plat pembina, daftar HIN, draf manual pemilik, senarai standard yang terpakai, dan rekod penilaian pematuhan mengikut keluarga model.'
    - q: Bagaimana saya menempah lawatan kilang maya?
      a: Hubungi pasukan jualan kami untuk menjadualkan lawatan video langsung melalui WhatsApp, Zoom, atau Teams. Kami mengikuti laluan 8 stesen yang sama dan boleh menumpukan pada kawasan tertentu berdasarkan minat anda. Lawatan maya biasa adalah 45-60 minit.
    - q: Adakah kilang ini pengeluar sebenar atau syarikat perdagangan?
      a: Paddle Board Overstock adalah pengeluar sebenar. Kami mengendalikan kilang di Laixi, Qingdao. Lesen perniagaan, skop pengeluaran, dan pengeluaran fizikal boleh disahkan semasa audit.
    - q: Rekod kualiti apa yang boleh saya semak?
      a: Rekod pemeriksaan bahan masuk, titik semak QC dalam proses, log ujian tekanan, senarai semak pemeriksaan akhir 100 mata, laporan ketidaksesuaian, rekod tindakan pembetulan, dan rekod kebolehsesan setiap kapal. Semua dikekalkan mengikut keperluan ISO 9001.
