hero:
  tagline: Asia Tenggara
  title: Papan Borong SUP untuk<br />Perniagaan Asia Tenggara
  subtitle: Resort pulau, kelab pantai, dan kedai dayung dari Filipina ke Bali dan Phuket — papan stok baru dari 5 unit, model campuran, dihantar dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan stok berlebihan SUP untuk resort Asia Tenggara dan kedai dayung
direct_answer: Paddle Board Overstock membekalkan papan kembung stok berlebihan baharu SUP kepada perniagaan di seluruh Asia Tenggara — resort pulau, kelab pantai, pengendali sewaan, dan peruncit kecil di Filipina, Indonesia, Thailand, Vietnam, Malaysia, dan lain-lain. Borong bermula dengan 5 papan dengan model campuran dalam satu pesanan, dihantar dari Weihai, China melalui udara ekspres atau kargo laut bersatu. Setiap papan telah diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong model campuran daripada 5 papan — dibina untuk resort dan kedai kecil, bukan muatan kontena
  - Laluan kargo pendek dari China ke pelabuhan dan lapangan terbang Asia Tenggara
  - Papan tinggi yang tahan lama UV sesuai untuk kegunaan tropika sepanjang tahun
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: Pasaran Asia Tenggara SUP
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: kaunter aktiviti resort, pengendali kelab pantai, dan sekolah dayung pulau.
    - Arena runcit di rantau ini didominasi oleh perniagaan yang dikendalikan sendiri yang melayani pelancong dan komuniti pendayung tempatan yang berkembang pesat. Mereka membuat pesanan dalam jumlah kecil — 5 hingga 20 papan — dan mereka memerlukan papan yang mampu bertahan dalam UV kitaran sewaan tropika, air masin, dan harian, bukan prototaip pameran perdagangan.
  customer_types:
    - title: Resort Pulau & Kelab Pantai
      description: Program aktiviti resort SUP menambah barisan mereka, memesan armada campuran yang melayani pengunjung baru dan tetamu berulang.
    - title: Pengendali Sewa & Pelancongan
      description: Pengendali menjalankan sewaan setiap jam dan lawatan bakau atau lagun, menggantikan papan armada yang haus mengikut musim.
    - title: Kedai Dayung Tempatan
      description: Kedai-kedai kecil yang berkhidmat untuk komuniti tempatan yang semakin berkembang di rantau ini SUP , daripada pendayung hujung minggu hingga SUP kelas yoga.
shipping_section:
  title: Kapal ke Asia Tenggara
  paragraphs:
    - Asia Tenggara adalah salah satu wilayah kargo terdekat kami dari Weihai, China — laluan laut pendek dan laluan udara ekspres terus mengekalkan masa transit dan kos kargo yang mesra. Sampel pakaian kargo udara ekspres dan 1–3 pesanan kecemasan papan; Kargo laut konsolidasi adalah pilihan ekonomi untuk pesanan borong 5–20 papan ke pelabuhan serantau utama.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan oleh broker anda, dengan kod HS yang betul dan nilai yang diisytiharkan. Duti import dan cukai mengikut peraturan negara anda dan perlu dibayar oleh pengimport.
  customs_note: Prosedur kastam berbeza antara ahli AS EAN. Semak peraturan import negara anda untuk peralatan sukan boleh tiup, dan tanya dalam pertanyaan anda jika anda memerlukan dokumen khusus — kami akan menyediakannya.
faq_section:
  title: Soalan Lazim Asia Tenggara
  items:
    - q: Negara Asia Tenggara mana yang anda hantar?
      a: Filipina, Indonesia, Thailand, Vietnam, Malaysia, dan lain-lain — serta panduan negara khusus untuk Filipina, Indonesia, dan Thailand. Sahkan destinasi tepat anda dalam permintaan sebut harga anda.
    - q: Adakah papan ini sesuai untuk kegunaan tropika sepanjang tahun?
      a: Ya. Papan-papan ini dibina dengan drop-stitch PVC pembinaan yang dinilai untuk kegunaan harian dalam UV keadaan panas dan tinggi — papan yang sama yang kami bekalkan kepada armada sewa di 50+ negara. Penjagaan standard (bilas selepas air garam, penyimpanan teduh) memastikan ia beroperasi selama bertahun-tahun.
    - q: Bagaimana rupa pesanan resort kecil?
      a: 'Biasanya 5–15 papan: asas model mesra pemula untuk tetamu, ditambah beberapa edisi seni premium untuk pameran, foto, dan jualan runcit. Model bercampur dalam satu penghantaran, harga berdasarkan jumlah keseluruhan.'
    - q: Berapa cepat papan boleh sampai ke rantau ini?
      a: Asia Tenggara adalah salah satu laluan penghantaran terpendek dari pangkalan kami di Weihai. Penghantaran udara ekspres adalah pilihan terpantas untuk sampel dan pesanan kecil; penghantaran laut dikutip mengikut destinasi untuk kuantiti borong. Kedua-duanya disenaraikan dalam sebut harga anda.
