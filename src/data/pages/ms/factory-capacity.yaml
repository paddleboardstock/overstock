hero:
  tagline: Kapasiti Pengeluaran
  title: Kapasiti Pembuatan & Pengeluaran Tahunan
  subtitle: Fasiliti seluas 12,000 m² menghasilkan 15,000 papan setahun dengan ruang untuk berkembang
intro: Paddle Board Overstock mengendalikan salah satu kilang pembuatan papan tiup SUP yang terbesar di Weihai, China. Kilang kami seluas 12,000 m² diatur dalam enam bengkel khusus yang beroperasi secara selari, memberi kami kapasiti untuk menghasilkan 15,000 papan setiap tahun merentasi semua barisan SUP serba boleh, pelancongan, dan seni.
highlights:
  - value: 12,000 m²
    label: Jumlah lantai pembuatan
    detail: Merentasi 6 bengkel khusus
  - value: 15,000
    label: Papan yang dihasilkan setiap tahun
    detail: Serbaguna, pelancongan & siri seni SUPs
  - value: 200-300
    label: Tenaga kerja berkepakaran
    detail: 25+ jurutera, 2 syif/hari
  - value: 50+
    label: Negara eksport
    detail: EU, AS, AU, Timur Tengah, Asia
  - value: 2-3
    label: Hari bekerja untuk penghantaran
    detail: Pesanan yang ada dalam stok meninggalkan Weihai dengan cepat
  - value: 10+
    label: Tahun pengalaman eksport
    detail: Sejak 2012
workshops:
  - title: SUP Pengeluaran Papan
    description: '4 lini pemasangan selari untuk papan tiup SUP. Setiap lini boleh menghasilkan 50–80 papan sesyif. Stesen cetakan digital dan cetakan skrin beroperasi serentak. Kapasiti tahunan SUP: 8,000+ papan.'
    output: 8,000+ SUPs/tahun
  - title: Seni Dek & EVA Penamat
    description: Bengkel penyelesaian khas untuk dek siri seni. Pemotongan EVA yang tepat, corak dek yang disusun secara tangan, dan trim akhir. Kapasiti tahunan merangkumi keseluruhan julat siri seni.
    output: Julat siri seni penuh
  - title: Drop-Stitch Pelapisan
    description: 'Garis laminasi haba mengikat teras drop-stitch kepada laminat luar PVC. Jalur rel diikat secara fusi tiga lapisan untuk kekuatan kedap udara. Kapasiti tahunan: 15,000 teras +.'
    output: 15,000+ teras/tahun
  - title: Aksesori & Pembungkusan
    description: Barisan pemasangan aksesori dan pembungkusan untuk pam, dayung, tali, dan kit pembaikan. Papan dibungkus vakum, diletakkan dalam kotak, dan dipalang untuk penghantaran ke seluruh dunia.
    output: Pakej lengkap, siap untuk dihantar
tldr:
  summary: Paddle Board Overstock membina 15,000 papan dayung setahun di kilangnya sendiri seluas 12,000 m² di Weihai, China. 200-300 pekerja mahir mengikut 2 syif, menjual terus kepada pengayuh di 50+ negara.
  points:
    - Kampus pengeluaran seluas 12,000 m² di Weihai
    - 15,000 papan dibina setiap tahun
    - 200-300 pekerja mahir, 2 syif/hari
    - Pesanan dalam stok dihantar dalam 2-3 hari bekerja
    - Jaminan 2 tahun pada setiap papan
