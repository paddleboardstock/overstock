hero:
  tagline: Kapasiti Pengeluaran
  title: Kapasiti Pembuatan & Pengeluaran Tahunan
  subtitle: Kemudahan 12,000 m² menghasilkan 15,000 bot setahun dengan ruang untuk memperluas
intro: Aquafarer mengendalikan salah satu kemudahan pembuatan bot tiup terbesar di Qingdao, China. Kilang kami seluas 12,000 m² diatur ke dalam enam bengkel khusus yang beroperasi secara selari, memberikan kami kapasiti untuk menghasilkan 15,000 bot setahun merentasi SUP, kayak, bot kecil, RIB, dan barisan peralatan keselamatan.
highlights:
  - value: 12,000 m²
    label: Jumlah lantai pembuatan
    detail: Merentasi 6 bengkel khusus
  - value: 15,000
    label: Bot dihasilkan setiap tahun
    detail: SUPs, kayak, RIBs, bot kecil, peralatan keselamatan
  - value: 200-300
    label: Tenaga kerja mahir
    detail: 25+ jurutera, 2 syif/hari
  - value: 50+
    label: Negara eksport
    detail: EU, US, AU, Timur Tengah, Asia
  - value: 30–45
    label: Masa penyampaian standard (hari)
    detail: Dari pengesahan PO hingga FOB
  - value: 10+
    label: Tahun pengalaman eksport
    detail: Sejak 2012
workshops:
  - title: SUP Pengeluaran Papan
    description: '4 barisan pemasangan selari untuk papan SUP tiup. Setiap barisan boleh menghasilkan 50–80 papan setiap syif. Stesen cetakan digital dan cetakan skrin dijalankan serentak. Kapasiti tahunan SUP: 8,000+ papan.'
    output: 8,000+ SUPs/setahun
  - title: RIB Pengeluaran Bot
    description: 'Bengkel sarung fiberglass khusus dengan 6 stesen acuan untuk sarung RIB sehingga 7.6 m. Kawasan pengelasan tiub dan pemasangan mengendalikan 3–5 RIBs secara serentak. Kapasiti tahunan RIB: 2,000+ bot.'
    output: 2,000+ RIBs/setahun
  - title: Bot Tiup & Bot Kecil
    description: 'Barisan pengeluaran pelbagai guna untuk bot tiup, kayak, dan bot kecil. Stesen pengelasan udara panas, tekan dielektrik RF, dan stesen pemasangan disesuaikan berdasarkan campuran pesanan. Kapasiti tahunan: 5,000+ unit.'
    output: 5,000+ unit/setahun
  - title: Peralatan Keselamatan
    description: 'Kawasan pengeluaran bilik bersih berasingan untuk jaket keselamatan dan peralatan keselamatan. Stesen menjahit, penyisipan buih, dan ujian khusus. Kapasiti tahunan jaket keselamatan: 50,000+ unit.'
    output: 50,000+ jaket keselamatan/setahun
oem_capacity:
  moq: 'SUP: 5–10 unit | RIB: 2–5 unit | Kayak/Bot Kecil: 10–20 unit | Acuan khas: 200+ unit'
  lead_time: Standard 30–45 hari. Sampel 15–20 hari. Percepatan tersedia.
  payment: T/T deposit 30% + 70% sebelum penghantaran. L/C, Western Union diterima.
