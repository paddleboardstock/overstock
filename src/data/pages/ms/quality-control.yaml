  actions:
    - variant: primary
      text: Minta dokumentasi QC
      href: /contact
    - text: Lihat protokol ujian
      href: /quality
tldr:
  summary: 'Sistem kawalan kualiti enam peringkat: pemeriksaan bahan, QC dalam proses, pengesahan kimpalan, QC perhimpunan, ujian tekanan pada 1.25x kapasiti dinilai, dan pemeriksaan akhir. Ujian tekanan unit 100%. Kadar bebas kecacatan 99.3% mengikut pensampelan AQL 2.5.'
  points:
    - 'QC enam peringkat: pemeriksaan bahan, QC dalam proses, pengesahan kimpalan, QC perhimpunan, ujian tekanan 1.25x, dan pemeriksaan akhir 100 titik'
    - Pemeriksaan akhir 100 titik pada setiap papan sebelum pembungkusan
    - 100% unit menjalani penahanan 24-48 jam pada tekanan 1.25x kapasiti dinilai dengan toleransi penurunan maksimum 5%
    - Pensampelan AQL 2.5 memastikan kadar bebas kecacatan 99.3%
    - 'QC kimpalan: ujian kupas, pengesahan lebar kimpalan, dan pemeriksaan jahitan lampu belakang pada setiap sambungan kimpalan'
