testimonial:
  content: Saya menyewa 5 papan dari kedai tempatan dan kehilangan 60% daripada pendapatan saya kepada mereka. Paddle Board Overstock membantu saya membina armada saya sendiri sebanyak 15 SUPs. Kalkulator ROI yang mereka sediakan menunjukkan saya akan pulang modal dalam 4 bulan — sebenarnya hanya mengambil masa 3 bulan. Kini saya sedang mengembangkan kepada 30 papan.
  name: Daniel Okonkwo
  title: Pemilik, Sewa Lakeland SUP — Ontario, Kanada
content_segments:
  tagline: Profil Sewa
  title: Penyelesaian Penyewaan Sukan Air<br />Mengikut Jenis Operator
  subtitle: Operasi sewaan yang berbeza mempunyai keperluan yang berbeza — daripada sewaan tepi pantai SUP yang kecil kepada pusat sukan air resort berskala besar. Kami menyesuaikan pakej peralatan dan model sokongan kami mengikut keperluan.
  items:
    - title: Sewa Pantai & Tepi Tasik SUP
      subtitle: Operasi berjumlah tinggi, berkompleksiti rendah
      description: Operator menyewa papan paddle berdiri terus kepada pengunjung pantai dan tasik. Keutamaan anda adalah meminimumkan masa pusingan antara sewaan, memastikan peralatan berada dalam putaran, dan mengurus lonjakan permintaan bermusim dengan jejak penyimpanan yang kecil.
      features:
        - Flotila SUP boleh tiup yang boleh dilipat — tidak memerlukan dok atau treler
        - Gred komersial PVC dinilai untuk 100+ kitaran sewaan setiap musim
        - Kain cepat kering, tahan UV untuk kesediaan sewaan semula pada hari yang sama
        - Julat papan berwarna untuk pengenalpastian armada yang mudah
    - title: Pusat Sukan Air di Resort & Hotel
      subtitle: Pengalaman tetamu dan penyelarasan jenama
      description: Resort dan hotel yang menawarkan sukan air sebagai kemudahan di tapak. Peralatan perlu kelihatan premium, berprestasi boleh dipercayai bagi tetamu dari tahap permulaan hingga sederhana, dan boleh digabungkan dengan aliran kerja tempahan dan pengebilan aktiviti sedia ada di resort.
      features:
        - Papan dan jaket keselamatan berjenama tersuai selaras dengan warna resort
        - 'Flotila campuran: serba boleh, persiaran, dan siri seni SUPs'
        - Penyelesaian pam elektrik tanpa bunyi dan tanpa bahan api untuk inflasi di pantai
        - Latihan kakitangan dan orientasi penyelenggaraan termasuk
    - title: Sewa Butik & Mudah Alih SUP
      subtitle: Perkhidmatan sewa berasaskan pop-up dan penghantaran
      description: Pengendali membawa papan terus kepada pelanggan — penghantaran pantai hotel, stesen sewa pop-up di acara, dan pembentukan mudah alih. Peralatan mesti cepat dipasang, mudah diangkut, dan kelihatan menarik pada pandangan pertama, dengan saiz flotila yang fleksibel untuk acara dan permintaan bermusim.
      features:
        - Pengangkutan papan gaya beg galas — tiada treler diperlukan
        - Inflasi cepat untuk persediaan sebaik permintaan dalam masa kurang daripada 15 minit
        - Peralatan yang menarik yang kelihatan premium pada pandangan pertama
        - Saiz flotila yang fleksibel untuk acara dan permintaan bermusim
    - title: Pengendali Pelancongan & Pengembaraan
      subtitle: Armada lawatan berpemandu
      description: Pengendali menjalankan lawatan sukan air berpandu — SUP safari, ekspedisi snorkeling, dan lawatan penerokaan pesisir pantai. Peralatan mesti cukup stabil untuk tetamu lawatan pemula, cepat dibersihkan antara kumpulan, dan tahan lama untuk penggunaan berpandu harian dalam pelbagai keadaan air.
      features:
        - Platform SUP ekstra stabil (32" lebar +) untuk penunggang kali pertama
        - Platform stabil bersaiz ekstra besar untuk foto lawatan pasangan/kumpulan
        - Kapasiti muatan terbina dalam untuk peralatan snorkeling, beg kering, dan peti sejuk
        - Pakej peralatan keselamatan untuk operasi lawatan komersial
