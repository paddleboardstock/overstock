testimonial:
  content: Saya menyewa 5 papan dari kedai tempatan dan kehilangan 60% daripada hasil saya kepada mereka. Aquafarer membantu saya membina armada sendiri sebanyak 15 SUPs. Kalkulator ROI yang mereka sediakan menunjukkan saya akan pulang modal dalam 4 bulan — sebenarnya ia mengambil masa 3 bulan. Kini saya sedang mengembangkan kepada 30 papan dan menambah kayak.
  name: Daniel Okonkwo
  title: Pemilik, Sewa Lakeland SUP — Ontario, Kanada
content_segments:
  tagline: Profil Sewa
  title: Penyelesaian Penyewaan Sukan Air<br />Mengikut Jenis Operator
  subtitle: Operasi sewaan yang berbeza mempunyai keperluan yang berbeza — daripada sewaan tepi pantai SUP yang kecil kepada pusat sukan air resort berskala besar. Kami menyesuaikan pakej peralatan dan model sokongan kami mengikut keperluan.
  items:
    - title: Sewa Pantai & Tepi Tasik SUP
      subtitle: Operasi berjumlah tinggi, berkompleksiti rendah
      description: Pengendali menyewa papan dayung berdiri dan kayak secara langsung kepada pengunjung pantai dan tasik. Keutamaan anda adalah meminimumkan masa putaran antara penyewaan, memastikan peralatan sentiasa digunakan, dan mengurus lonjakan permintaan bermusim dengan ruang simpanan yang kecil.
      features:
        - Flotila SUP boleh tiup yang boleh dilipat — tidak memerlukan dok atau treler
        - Gred komersial PVC dinilai untuk 100+ kitaran sewaan setiap musim
        - Kain cepat kering, tahan UV untuk kesediaan sewaan semula pada hari yang sama
        - Julat papan berwarna untuk pengenalpastian armada yang mudah
    - title: Pusat Sukan Air di Resort & Hotel
      subtitle: Pengalaman tetamu dan penyelarasan jenama
      description: Resort dan hotel yang menawarkan sukan air sebagai kemudahan di tapak. Peralatan perlu kelihatan premium, berprestasi boleh dipercayai bagi tetamu dari tahap permulaan hingga sederhana, dan boleh digabungkan dengan aliran kerja tempahan dan pengebilan aktiviti sedia ada di resort.
      features:
        - Papan dan jaket keselamatan berjenama tersuai selaras dengan warna resort
        - 'Kapal campuran: SUPs, kayak, bot pedal, dan tender kecil RIB'
        - Penyelesaian pam elektrik tanpa bunyi dan tanpa bahan api untuk inflasi di pantai
        - Latihan kakitangan dan orientasi penyelenggaraan termasuk
    - title: Pengendali Penyewaan Bot & RIB
      subtitle: Armada penyewaan kapal gred komersial
      description: Pengendali yang menyewa kapal berkuasa — tender RIB, bot tiup, dan runabout kecil — mengikut jam atau setengah hari. Armada anda mesti mematuhi peraturan keselamatan marin, mampu menahan penggunaan berat oleh tetamu, dan meminimumkan masa henti mekanikal antara sewaan.
      features:
        - Pakej RIB dengan 30–90 HP transom sedia enjin luar
        - Panel lantai papan lapis gred marin untuk integriti struktur jangka panjang
        - Sistem injap pelancaran pantas untuk pertukaran lebih cepat
        - Kit alat ganti + sokongan teknikal atas panggilan SLA
    - title: Pengendali Pelancongan & Pengembaraan
      subtitle: Armada lawatan berpemandu
      description: Pengendali yang menjalankan lawatan sukan air berpandu — safari SUP, kayak gua, lawatan snorkeling, atau lawatan RIB pulau-pulau. Peralatan mesti cukup stabil untuk tetamu lawatan pemula, mudah dibersihkan antara kumpulan, dan tahan lama untuk kegunaan harian berpandu dalam pelbagai kondisi air.
      features:
        - Platform SUP ekstra stabil (32" lebar +) untuk penunggang kali pertama
        - Pilihan kayak tandem untuk konfigurasi lawatan pasangan/kumpulan
        - Kapasiti muatan terbina dalam untuk peralatan snorkeling, beg kering, dan peti sejuk
        - Dokumentasi pematuhan CE + USCG untuk operasi komersial
