hero:
  tagline: Pematuhan CE & RCD
  title: RIB Bot CE Pematuhan<br />& Dokumentasi Teknikal
  subtitle: Paddle Board Overstock RIB bot dan kenderaan air tiup direka dan didokumenkan untuk pematuhan pasaran EU di bawah Arahan Kenderaan Rekreasi 2013/53/EU. Dari penilaian risiko hingga Pengisytiharan Keselarasan, kami menyediakan dokumentasi pematuhan spesifik model untuk setiap badan kapal.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: dokumentasi dan pensijilan pematuhan bot
direct_answer: Paddle Board Overstock menyediakan dokumentasi pematuhan RCD 2013/53/EU khusus model untuk bot RIB dan kenderaan air tiup, termasuk fail teknikal, Pengisytiharan Pematuhan, plat pembina, dan manual pemilik — semuanya selaras dengan EN ISO 6185, ISO 12217, dan standard harmonisasi yang berkenaan.
