content_scope:
  tagline: Skop Pematuhan
  title: Produk Mana Yang Diperlukan<br />RCD Pematuhan?
  subtitle: Arahan Kraf Rekreasi 2013/53/EU terpakai kepada kraf rekreasi dengan panjang hull antara 2.5 m dan 24 m. Memahami skop adalah langkah pertama untuk pematuhan.
  items:
    - title: RIB Bot (2.5–24 m)
      description: Bot tiup kaku dengan panjang hull dari 2.5 m hingga 24 m tergolong dalam RCD. Kategori reka bentuk A hingga D digunakan bergantung pada keadaan laut yang dimaksudkan dan daya angin maksimum.
      icon: tabler:sailboat
    - title: Bot Tiup (di bawah 2.5 m)
      description: Bot tiup kecil dan bot kecil di bawah 2.5 m mungkin dikecualikan sebahagian daripada RCD tetapi masih memerlukan penandaan CE di bawah arahan lain yang berkenaan dan piawaian pembinaan EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Papan & Aksesori
      description: Papan dayung berdiri (stand-up paddle boards) berada di luar skop RCD. Walau bagaimanapun, alat keselamatan peribadi yang berkaitan (PFD) memerlukan penandaan CE di bawah Peraturan PPE (EU) 2016/425 dengan kelulusan USCG Jenis III/V jika berkenaan.
      icon: tabler:swimming
    - title: Bot Separuh Siap
      description: Bot yang dihantar tanpa enjin atau pemasangan tertentu memerlukan Pengisytiharan Pembina untuk kraf yang separa lengkap, dengan pematuhan RCD penuh diselesaikan oleh pembina terakhir atau pengimport.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistem Kepercayaan Tiga Lapisan
  title: Maklumat Pematuhan<br />— Dikongsi pada Tahap yang Betul
  subtitle: Tidak semua data pematuhan sesuai dipaparkan di laman web awam. Kami mengikuti pendekatan tiga lapisan yang melindungi harta intelek sambil membina keyakinan pembeli.
  items:
    - title: Lapisan 1 — Laman Web Awam
      description: Piawaian dirujuk, laluan pematuhan diterangkan, jenis dokumen disenaraikan, skop pensijilan mengikut keluarga model. Tiada sijil sebenar, data ujian, atau butiran kejuruteraan proprietari.
      icon: tabler:world
    - title: Lapisan 2 — Perkongsian Selepas Pertanyaan
      description: 'Selepas pemeriksaan yang layak: sampel DoC yang disunting, foto plat pembina, senarai piawaian yang berkenaan, senarai semak pematuhan, dan ringkasan sijil bahan — dikongsi di bawah terma penggunaan adil.'
      icon: tabler:mail
    - title: Lapisan 3 — NDA / Tahap Pesanan
      description: Fail teknikal penuh, penilaian risiko, pengiraan kestabilan, laporan ujian, rekod batch bahan, dan dokumentasi kebolehlacakan pengeluaran — dikongsi hanya di bawah NDA dengan pembeli yang disahkan.
      icon: tabler:lock
content_standards:
  tagline: Standard yang Berkenaan
  title: ISO & Standard EN<br />Kami Membina Untuk
  subtitle: Produk kami direka dan diuji mengikut piawaian seragam di bawah RCD. Nombor dan nama piawaian dirujuk; teks penuh piawaian tetap ISO hak cipta.
  items:
    - title: EN ISO 6185-3
      description: 'Bot tiup — Bahagian 3: Bot dengan kuasa enjin maksimum 15 kW atau lebih. Keperluan pembinaan, kestabilan, daya apung, dan pemulihan orang jatuh ke laut untuk RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Bot tiup — Bahagian 4: Bot dengan kuasa enjin maksimum 15 kW dan lebih besar atau sama dengan 4.5 kW. Keperluan struktur dan kestabilan tambahan.'
      icon: tabler:file-text
    - title: ISO Siri 12215
      description: Kapal kecil — Pembinaan badan kapal dan ukuran kayu. Reka bentuk struktur badan kapal, dek, dan sekat untuk badan kapal fiberglass dan aluminium RIB.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Kraf kecil — Manual pemilik. Kandungan dan format yang diperlukan untuk manual pemilik yang disertakan dengan setiap RIB bot yang dihantar di EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Kenderaan kecil — Plat pembina. Maklumat yang perlu ditandakan pada plat pembina yang dipasang secara kekal pada setiap kenderaan.
      icon: tabler:badge
    - title: ISO 8666
      description: Kapal kecil — Data utama. Ukuran dan parameter standard untuk spesifikasi yang konsisten di semua dokumentasi produk.
      icon: tabler:dimensions
content_process:
  tagline: Proses Pematuhan
  title: Pematuhan CE 6-Langkah<br />Aliran Kerja
  subtitle: Daripada skop projek ke kebolehsinggahan pada peringkat siri — setiap RIB model mengikuti laluan pematuhan yang ditetapkan.
  steps:
    - number: '01'
      title: Skop & Klasifikasi Projek
      description: Tentukan model RIB, kategori reka bentuk (A/B/C/D), jumlah maksimum orang, muatan, kuasa enjin, dan pasaran sasaran. Tentukan jika RCD terpakai dan modul penilaian kesesuaian yang diperlukan.
      timeline: 2–3 hari
    - number: '02'
      title: Pengenalan Keperluan yang Berkenaan
      description: Kenal pasti semua Keperluan Keselamatan Asas yang berkenaan dari RCD Lampiran I, piawaian harmoni yang berkaitan (EN ISO 6185, 12215, 10240, 14945), dan mana-mana keperluan tambahan negara untuk pasaran sasaran.
      timeline: 3–5 hari
    - number: '03'
      title: Reka Bentuk & Dokumentasi Teknikal
      description: 'Buat Fail Teknikal Utama: lukisan susun atur umum, pengiraan kestabilan dan timbangan, penilaian risiko, spesifikasi bahan, dan analisis keselamatan sistem (bahan api, elektrik, stereng).'
      timeline: 10–15 hari
    - number: '04'
      title: Pengesahan & Ujian Produk
      description: Laksanakan pengesahan fizikal — ujian tekanan pada 1.25x tekanan yang dinilai selama 24–48 jam, ujian kestabilan dan daya apung, ujian beban, dan pentauliahan sistem. Rekod semua keputusan ujian bagi setiap kapal.
      timeline: 5–7 hari
    - number: '05'
      title: Dokumentasi Penandaan & Penghantaran
      description: Lampirkan penandaan CE, plat pembina (EN ISO 14945), dan HIN/CIN (nombor pengenalan kapal). Sediakan Perisytiharan Pemenuhan EU, manual pemilik (EN ISO 10240), dan senarai semak pematuhan.
      timeline: 2–3 hari
    - number: '06'
      title: Keterjejakkan Tahap Siri
      description: Setiap tubuh kapal menerima Rekod Tubuh Kapal unik yang menghubungkannya dengan Fail Teknikal Utama, kelompok pengeluaran, sijil bahan, keputusan ujian, dan konfigurasi akhir. Rekod disimpan selama 10+ tahun mengikut RCD.
      timeline: Berlaku
content_document_cards:
  tagline: Jenis Dokumen
  title: Dokumen Pematuhan<br />Kad
  subtitle: Ini adalah jenis dokumen yang kami sediakan dan kemas kini untuk setiap model RIB yang disahkan CE. Sampel tersedia atas permintaan yang layak.
  items:
    - title: Sijil Pematuhan CE / RCD
      description: Sijil khusus model yang mengesahkan kraf tersebut memenuhi semua Keperluan Keselamatan Asas yang berkenaan dalam RCD 2013/53/EU, dikeluarkan oleh pengilang dengan penglibatan Badan Beritahu apabila diperlukan.
      icon: tabler:certificate
    - title: Deklarasi Keselarasan EU (DoC)
      description: Penyataan yang ditandatangani oleh pengilang atau wakil yang diberi kuasa, yang menyenaraikan arahan, standard, modul pematuhan, dan butiran Badan Beritahu yang berkaitan. Diperlukan bagi setiap model yang diletakkan di pasaran EU.
      icon: tabler:file-check
    - title: Plat Pembina (EN ISO 14945)
      description: Plat yang dipasang secara kekal menunjukkan bilangan maksimum orang, kuasa enjin maksimum, kategori reka bentuk, dan pengenalan pengeluar. Mestilah kekal boleh dibaca sepanjang hayat kraf.
      icon: tabler:badge
    - title: Manual Pemilik (EN ISO 10240)
      description: Manual komprehensif yang merangkumi operasi selamat, prosedur kecemasan, jadual penyelenggaraan, dan amaran keselamatan. Wajib untuk setiap RIB yang dihantar di EU.
      icon: tabler:book
    - title: ISO Laporan Ujian & Pemeriksaan
      description: Rekod ujian tekanan (1.25x / 24–48j), keputusan ujian kestabilan dan daya apung, sijil ujian bahan, dan laporan pengesahan dimensi — semuanya dipautkan kepada nombor badan tertentu.
      icon: tabler:test-pipe
    - title: Rekod Kebolehsusunan Bahan
      description: Kebolehkesanan peringkat kelompok untuk kain tiub, pelekat, gentian kaca, dan perkakasan. Menghubungkan setiap unit pengeluaran dengan sijil bahan masuk dan hasil pemeriksaan IQC.
      icon: tabler:link
    - title: Pemeriksaan Kualiti & Rekod QC
      description: Senarai semak kualiti 100 mata setiap unit, rekod QC semasa proses, laporan ketidakpatuhan, dan tindakan pembetulan. Sebahagian daripada rantaian kebolehlacakan pengeluaran.
      icon: tabler:clipboard-check
    - title: Pek Dokumen Projek
      description: Pakej dokumentasi setiap lambung termasuk rekod konfigurasi akhir, butiran pemasangan enjin dan peralatan, senarai semak pentauliahan, dan dokumentasi penghantaran.
      icon: tabler:package
content_design_categories:
  tagline: Kategori Reka Bentuk RCD
  title: Kategori Rekabentuk A–D<br />— Apa Maksud Mereka
  subtitle: RCD menetapkan kategori reka bentuk berdasarkan daya angin maksimum dan ketinggian ombak yang signifikan yang direka untuk ditahan oleh kenderaan itu.
  items:
    - title: Kategori A — Laut
      description: Direka untuk pelayaran jarak jauh di mana kekuatan angin mungkin melebihi Beaufort 8 (>40 knot) dan ketinggian gelombang yang ketara mungkin melebihi 4 m. Memerlukan pengesahan struktur dan kestabilan yang paling ketat.
      icon: tabler:ripple
    - title: Kategori B — Luar Pesisir
      description: Direka untuk pelayaran luar pesisir dengan kekuatan angin sehingga Beaufort 8 (≤40 knot) dan ketinggian ombak yang ketara sehingga 4 m. Sesuai untuk perairan pantai dan separa terbuka.
      icon: tabler:anchor
    - title: Kategori C — Perairan Dalam
      description: Direka untuk pelayaran pantai dengan kekuatan angin sehingga Beaufort 6 (≤27 knot) dan ketinggian ombak ketara sehingga 2 m. Kebanyakan RIBs rekreasi tergolong dalam kategori ini.
      icon: tabler:sun
    - title: Kategori D — Dilindungi
      description: Direka untuk perairan terlindung dengan kekuatan angin sehingga Beaufort 4 (≤16 knot) dan ketinggian ombak yang ketara sehingga 0.3 m. Tasik, sungai, dan pelabuhan yang dilindungi.
      icon: tabler:pool
content_hin:
  tagline: Pengenalpastian Kraf
  title: HIN / CIN & Plat Pembina
  subtitle: Setiap bot RIB memerlukan Nombor Pengenalan Lambung (HIN) atau Nombor Pengenalan Kraf (CIN) dan plat pembina mengikut EN ISO 14945 dan keperluan RCD.
  items:
    - title: Nombor Pengenalan Lambung (HIN)
      description: Kod unik 14 aksara yang ditandakan secara kekal di bahagian buritan sisi kanan, yang mengekodkan kod pengeluar (MIC), tahun model, tahun pengeluaran, dan nombor siri. Diperlukan untuk kemasukan pasaran EU.
      icon: tabler:hash
    - title: Nombor Pengenalan Kraf (CIN)
      description: Menurut EN ISO 10087, nombor pengenalan sekunder tersembunyi yang diletakkan di lokasi yang tersembunyi untuk tujuan anti-kecurian dan kebolehlacakan.
      icon: tabler:eye-off
    - title: Kandungan Plat Pembina
      description: Bilangan maksimum orang, kuasa enjin maksimum (kW), muatan maksimum (kg), kategori reka bentuk, nama pengeluar, dan penandaan CE — semuanya dipaparkan secara kekal pada plat tahan karat.
      icon: tabler:badge
content_tech_file:
  tagline: Struktur Fail Teknikal
  title: Fail Teknikal Induk<br />& Rekod Hull
  subtitle: 'Sistem dokumentasi kami mengikut struktur dua peringkat: Fail Teknikal Induk untuk setiap keluarga model, dan Rekod Lambung individu untuk setiap bot yang dihasilkan.'
  items:
    - title: Fail Teknikal Induk
      description: 'Mengandungi dokumentasi pematuhan lengkap untuk keluarga model: susunan umum, penilaian risiko, pengiraan kestabilan/kebolehapungan, spesifikasi bahan, piawaian yang berkenaan, dan rekod penilaian kesesuaian. Disimpan selama 10+ tahun.'
      icon: tabler:folder
    - title: Rekod Lambung (Ketelusan Setiap Perahu)
      description: 'Setiap badan kapal mempunyai rekod unik yang menghubungkannya dengan Fail Teknikal Induk: HIN, tarikh pengeluaran, kelompok tiub, sijil bahan, keputusan ujian tekanan, konfigurasi akhir, pemasangan enjin, dan destinasi penghantaran.'
      icon: tabler:file-description
    - title: Pek Pematuhan Pelanggan
      description: Pakej penghantaran setiap kapal termasuk DoC, foto plat pembina, manual pemilik, ringkasan ujian, dan helaian konfigurasi akhir — disediakan dengan setiap RIB yang dihantar ke EU.
      icon: tabler:package
content_material_cert:
  tagline: Pensijilan Bahan
  title: Ketelusan Bahan &<br />Bukti Pensijilan
  subtitle: Bot RIB berkualiti bermula dengan bahan yang terkawal dan proses yang didokumenkan. Berikut adalah cara kami mengatur pensijilan bahan untuk setiap kumpulan komponen kritikal.
  items:
    - title: Keterjejakkan Bahan Tiub Boleh Kembung
      description: Bahan tiub PVC dan CSM/Hypalon dipilih mengikut penggunaan yang dimaksudkan, keadaan iklim dan pasaran sasaran. Data teknikal pembekal (TDS), maklumat kelompok bahan, ketelusuran kelompok fabrik, UV dan laporan ujian cuaca, serta pengisytiharan REACH/SVHC tersedia dalam skop dokumentasi projek yang dipersetujui.
      icon: tabler:circle
    - title: Ketelusan Aluminium Marin
      description: Bagi projek RIB dengan kulit aluminium, gred aloi, ketebalan dan kelompok bahan dikawal mengikut spesifikasi yang diluluskan. Sijil ujian bahan (MTC/MTR), dokumentasi EN 10204 3.1, laporan komposisi kimia dan sifat mekanikal, serta ketelusuran haba/lotis disediakan di mana dipersetujui.
      icon: tabler:rectangle
    - title: Bahan & Kawalan Proses Sarung GRP
      description: Bagi RIBs berkayuh fiberglass, gelcoat, resin, penguatan fiberglass dan bahan teras dikawal melalui spesifikasi yang terkawal. TDS/SDS bahan, rekod kumpulan, spesifikasi laminasi, serta rekod kawalan penyembuhan dan bengkel tersedia mengikut persetujuan projek.
      icon: tabler:layers-subtract
    - title: Sokongan Dokumentasi Komponen
      description: Bagi komponen terpilih — termasuk bahan dek EVA, tempat duduk, perkakasan keluli tahan karat, sistem bahan api, peralatan elektrik dan aksesori marin — dokumentasi pembekal yang berkaitan diselaraskan berdasarkan konfigurasi akhir dan keperluan pasaran destinasi.
      icon: tabler:package
    - title: Notis Skop Pematuhan
      description: Sijil, laporan ujian dan dokumen pematuhan hanya terpakai kepada model produk, bahan, komponen, kumpulan pengeluaran atau skop projek tertentu yang dinyatakan dalam dokumen berkaitan. Hubungi kami dengan pasaran sasaran, kegunaan yang dimaksudkan dan keperluan teknikal anda supaya pek dokumentasi yang terpakai dapat disahkan sebelum membuat pesanan.
      icon: tabler:info-circle
faq:
  title: CE Pematuhan — Soalan Lazim
  questions:
    - q: Adakah semua Paddle Board Overstock RIB bot CE disahkan untuk pasaran EU?
      a: Bot RIB dalam katalog kami direka dan didokumentasikan untuk pematuhan RCD 2013/53/EU mengikut arahan EU yang berkenaan. Penandaan CE terpakai berdasarkan setiap model dan setiap konfigurasi. Hubungi kami untuk dokumen skop pematuhan spesifik model.
    - q: Apakah perbezaan antara pematuhan RCD dan penandaan CE?
      a: RCD (Arahan Kenderaan Rekreasi 2013/53/EU) ialah undang-undang EU yang menetapkan Keperluan Keselamatan Asas. Penanda CE ialah simbol visual yang diletakkan pada produk yang telah dinilai dan disahkan memenuhi keperluan tersebut. Sesuatu produk mesti mematuhi RCD sebelum ia boleh membawa penanda CE.
    - q: Adakah anda menyediakan Pengisytiharan Pematuhi dengan setiap bot?
      a: Ya. Setiap bot RIB yang dihantar ke pasaran EU termasuk Pengisytiharan Keserasian EU khusus model yang menyenaraikan arahan yang berkenaan, standard yang digabungkan, modul penilaian keserasian, dan butiran Badan Beritahu.
    - q: Mod penilaian pematuhan apa yang digunakan oleh Paddle Board Overstock?
      a: Modul bergantung kepada kategori reka bentuk dan jenis bot. Kebanyakan model RIB dalam Kategori Reka Bentuk C menggunakan Modul A (kawalan pengeluaran dalaman). Untuk bot Kategori Reka Bentuk A/B atau konfigurasi tertentu, Modul B+C atau B+D mungkin terpakai dengan penglibatan Badan Diberitahu. Kami memberi nasihat mengenai modul yang sesuai bagi setiap projek.
    - q: Bolehkah anda berkongsi dokumentasi pematuhan sebelum kami membuat pesanan?
      a: Selepas siasatan yang layak, kami berkongsi dokumen skop pematuhan yang menyenaraikan standard yang terpakai, laluan pematuhan, dan jenis dokumen yang tersedia untuk model yang anda sedang nilai. Fail teknikal penuh dikongsi di bawah NDA selepas pengesahan pesanan.
    - q: Apakah Nombor Pengenalan Lambung (HIN) dan adakah ia disertakan?
      a: HIN adalah pengecam unik 14 aksara yang ditanda secara kekal pada setiap bot, yang menyandikan kod pengeluar (MIC), penamaan model, tahun pengeluaran, dan nombor siri. Ia adalah wajib untuk semua bot RIB yang diletakkan di pasaran EU dan dimasukkan pada setiap Paddle Board Overstock RIB.
    - q: Berapa lama fail teknikal disimpan?
      a: Menurut keperluan RCD 2013/53/EU, pengilang mesti menyimpan fail teknikal sekurang-kurangnya 10 tahun dari tarikh terakhir produk diletakkan di pasaran. Paddle Board Overstock menyimpan dokumentasi teknikal lengkap untuk semua model yang dihasilkan.
    - q: Adakah anda membantu dengan kewajipan pengimport di bawah RCD?
      a: 'Ya. Kami menyediakan pakej dokumentasi yang diperlukan oleh pengimport EU untuk memenuhi tanggungjawab mereka: akses fail teknikal, DoC, plat pembina, manual pemilik, dan rekod penjejakan produk. Tanggungjawab pengimport di bawah RCD didokumentasikan dengan jelas dalam panduan pematuhan kami.'
