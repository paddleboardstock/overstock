hero:
  tagline: Timur Tengah
  title: Papan Borong SUP untuk<br />Peruncit Timur Tengah
  subtitle: Peruncit Teluk, kelab pantai hotel, dan pengendali Laut Merah — papan dayung overstock baru dari 5 unit, model campuran, dihantar dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan lebihan SUP stok untuk peruncit Timur Tengah dan kelab pantai
direct_answer: Paddle Board Overstock membekalkan papan kembung overstock baharu SUP kepada perniagaan di seluruh Timur Tengah — peruncit dan pengendali hotel di UAE, Arab Saudi, Qatar, Mesir, dan lain-lain. Pesanan borong bermula dengan 5 papan dengan model campuran dalam satu penghantaran, dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut tergabung. Setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran, dihargai mengikut jumlah keseluruhan
  - Melayani hab runcit Teluk dan destinasi peranginan Laut Merah
  - Kargo udara ekspres atau laut konsolidasi dari Weihai, China
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: Pasaran Timur Tengah SUP
  paragraphs:
    - The Middle East has built some of the world's most impressive waterfronts — Dubai's beach clubs, Abu Dhabi's mangrove tours, the Red Sea projects transforming Saudi Arabia's west coast, and the established resort scenes of Egypt's Sinai and Hurghada. Across them, stand-up paddle has become a signature activity: mudah diakses, fotogenik, dan sesuai untuk air yang tenang dan hangat hampir sepanjang tahun.
    - Pembeli di sini adalah profesional dan mementingkan kualiti. Kelab pantai hotel sentiasa memperbaharui armada, pengendali sukan air memerlukan papan yang kelihatan premium dalam gambar, dan peruncit di rantau ini melayani kedua-dua pendayung ekspatriat serta komuniti tempatan yang berkembang pesat. Mereka membuat pesanan dalam kumpulan kecil yang teliti dan mengharapkan dokumentasi yang tepat serta penghantaran tepat pada masanya.
  customer_types:
    - title: Hotel Beach Clubs & Resorts
      description: Pengendali hotel Teluk menjalankan program tetamu SUP , memesan armada campuran kecil dengan edisi seni premium untuk penampilan tepi laut.
    - title: Pengendali Sukan Air
      description: Pengendali pelancongan bakau dan lagun, pusat menyelam, serta gerai sewaan pantai di sepanjang pantai Teluk dan Laut Merah.
    - title: Peruncit
      description: Kedai dan penjual dalam talian yang melayani komuniti ekspatriat dan pendayung tempatan di UAE, Arab Saudi, Qatar, dan Kuwait.
shipping_section:
  title: Kapal ke Timur Tengah
  paragraphs:
    - Pesanan dihantar dari Weihai, China. Kargo udara ekspres memindahkan sampel dan 1–3 pesanan papan dengan pantas ke hab utama rantau ini; kargo laut konsolidasi melayani 5–20 pesanan borong papan melalui pelabuhan Teluk dan Laut Merah. Anggaran transit untuk destinasi anda disertakan dalam setiap sebut harga.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan untuk pelepasan, dengan nilai yang konsisten dan kod HS yang betul — dokumen yang dijangka oleh proses kastam Teluk.
  customs_note: Prosedur import di rantau ini secara amnya cekap tetapi sensitif terhadap dokumen. Sahkan layanan duti dan cukai semasa untuk peralatan sukan di emiriah atau negara anda dengan ejen penjelasan anda; kami membekalkan semua dokumentasi standard dengan segera.
faq_section:
  title: Soalan Lazim Timur Tengah
  items:
    - q: Destinasi Timur Tengah mana yang anda hantar?
      a: UAE, Arab Saudi, Qatar, Kuwait, Bahrain, Oman, Mesir, dan lain-lain — lihat panduan khusus UAE kami untuk pasaran runcit terbesar di Teluk. Sahkan destinasi anda dalam permintaan sebut harga anda.
    - q: Adakah papan ini menahan haba musim panas di rantau ini?
      a: 'Papan-papan ini tahan haba dengan baik dengan penjagaan asas: simpan dalam keadaan kempis dan teduhan sepanjang musim panas puncak, elakkan papan dibiarkan mengembang di permukaan panas, dan bilas selepas digunakan dalam air laut. Ini adalah garis panduan yang sama yang kami berikan kepada armada sewaan di 50+ negara.'
    - q: Bolehkah kami memesan edisi seni premium untuk hotel di tepi air?
      a: Ya — edisi seni seperti Leviathan Wake, Medusa Glow, dan Ocean Voyager popular di kelab pantai hotel kerana ia kelihatan cantik dalam gambar. Gabungkan dengan papan tetamu serba boleh dalam satu pesanan.
    - q: Adakah dokumentasi tersedia untuk kastam Teluk?
      a: Ya. Setiap pesanan dihantar dengan invois komersial dan senarai pembungkusan dengan kod HS dan nilai yang diisytiharkan yang betul, dan kami bertindak balas dengan cepat apabila broker meminta dokumentasi tambahan.
