hero:
  tagline: Filipina
  title: Papan Borong SUP untuk<br />Perniagaan Filipina
  subtitle: Resort pulau, kelab pantai, dan pengendali dayung dari El Nido dan Siargao ke Boracay — papan stok baru dari 5 unit, model campuran, dihantar dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan lebihan SUP stok untuk resort pulau Filipina dan pengendali paddle
direct_answer: Paddle Board Overstock membekalkan papan kembung stok berlebihan baharu SUP kepada perniagaan Filipina — resort pulau di Palawan dan Siargao, kelab pantai di Boracay dan Cebu, pengendali sewa dan pelancongan, serta peruncit kecil. Pesanan borong bermula dengan 5 papan dengan model campuran dalam satu penghantaran, dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut bersatu. Setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran, dihargai mengikut jumlah keseluruhan
  - Berkhidmat untuk resort pulau dan kelab pantai di seluruh kepulauan Filipina
  - Kargo udara ekspres atau laut konsolidasi dari Weihai, China
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: SUP Pasar Filipina
  paragraphs:
    - Dengan lebih daripada tujuh ribu pulau, Filipina dibina untuk aktiviti dayung berdiri. Lagun El Nido dan Coron, suasana luncur dan pulau yang santai di Siargao, tenaga kelab pantai Boracay, dan ekonomi sukan menyelam dan air di Cebu semuanya mencipta permintaan yang stabil — daripada pelancong yang mendayung waktu matahari terbit di lagun batu kapur hingga penduduk tempatan membina SUP komuniti kecergasan dan yoga di Manila dan sekitarnya.
    - The buyers are typically resort and tour operators: resort pulau menambah aktiviti tetamu yang tidak memerlukan bahan api, enjin, dan lesen; pengendali pelancongan melompat-pulau yang memperluaskan tawaran mereka; dan kedai kecil yang melayani komuniti pendayung domestik. Pesanan adalah kecil — 5–20 papan — dan bercampur antara papan serba boleh yang stabil untuk pemula dan beberapa edisi premium untuk penampilan resort.
  customer_types:
    - title: Resort Pulau
      description: Resort Palawan, Siargao, dan Boracay menambah program tetamu SUP dengan armada campuran yang padat.
    - title: Pengendali Pelancongan
      description: Pengendali lawatan melompat pulau dan lagun menambah hentian mendayung dalam jadual perjalanan mereka.
    - title: Kedai & Sekolah Tempatan
      description: Sekolah dan kedai berasaskan bandar yang melayani komuniti dayung dan yoga Filipina yang semakin berkembang SUP .
shipping_section:
  title: Kapal ke Filipina
  paragraphs:
    - Pesanan dihantar dari Weihai, China. Kargo udara ekspres memindahkan sampel dan 1–3 pesanan papan dengan pantas ke Manila dan Cebu; Gabungan kargo laut melayani 5–20 pesanan borong papan melalui Manila dan pelabuhan Filipina lain. Anggaran transit untuk destinasi anda — metro Manila atau wilayah — disertakan dalam sebut harga anda.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan, dengan kod HS yang betul dan nilai yang diisytiharkan. Duti import dan cukai perlu dibayar oleh pengimport mengikut peraturan Filipina.
  customs_note: Untuk destinasi wilayah, penghantaran akhir dari pelabuhan atau lapangan terbang dinyatakan sebagai sebahagian daripada anggaran dari pintu ke pintu. Sahkan layanan duti import semasa untuk peralatan sukan dengan broker anda; kami menyediakan dokumentasi lengkap.
faq_section:
  title: Soalan Lazim Filipina
  items:
    - q: Berapa lama masa penghantaran ke Filipina?
      a: Ia bergantung pada kaedah. Kargo udara ekspres ke Manila atau Cebu adalah pilihan terpantas untuk sampel dan 1–3 pesanan papan; Gabungan kargo laut sesuai 5–20 pesanan borong papan dan akan disebutkan dengan tingkap transit untuk pelabuhan anda. Kedua-dua anggaran akan disenaraikan dalam sebut harga anda sebelum anda membuat komitmen.
    - q: Bolehkah lembaga mencapai pulau-pulau wilayah seperti Palawan atau Siargao?
      a: Ya — penghantaran dari pintu ke pintu ke destinasi wilayah dikira sebagai sebahagian daripada anggaran kargo, menggunakan logistik domestik seterusnya dari pelabuhan atau lapangan terbang ketibaan. Perhatikan anggaran dan pilihan dalam pertanyaan anda dan kami akan menentukannya secara khusus.
    - q: Seperti apa rupa armada pemula di resort?
      a: 'Biasanya 5–10 papan: model stabil serbaguna untuk pelajaran tetamu dan mendayung bebas, serta satu atau dua edisi seni premium untuk tepi pantai. Campuran model, satu penghantaran, harga berdasarkan jumlah keseluruhan.'
    - q: Adakah papan sesuai untuk kegunaan lagun dan dataran terumbu?
      a: Ya — keadaan air yang tenang, cetek, dan hangat adalah tepat untuk papan tiup SUP serba guna, dan sirip yang fleksibel serta pembinaan drop-stitch yang tahan lasak menangani pendaratan di dataran terumbu dan pantai dengan baik.
