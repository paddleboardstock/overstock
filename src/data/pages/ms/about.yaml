features3_what_we_build:
  title: Apa yang kami bina
  subtitle: Satu rangkaian produk yang fokus yang kami kenali dengan mendalam — tiada eksperimen yang setengah siap, tiada penaik-jenama.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB bot
      description: Kapal dengan lambung aluminium RIBs dari 3.3 m hingga 7.5 m. Direka untuk rondaan, menyelam, memancing dan kegunaan keluarga.
      icon: tabler:ship
    - title: Bot tiup
      description: PVC dan Hypalon bot tiup dari 2.4 m hingga 4.2 m. Ringan, tahan lasak dan mudah disimpan.
      icon: tabler:speedboat
    - title: Bot laju mewah
      description: Padat, berspesifikasi tinggi RIBs dibina khas untuk menyesuaikan rupa kapal induk anda.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksesori
      description: Dayung, pam, penutup, beg kering, tangki bahan api dan elektronik. Semua disesuaikan dengan bot kami.
      icon: tabler:package
    - title: Pembaharuan & pembaikan
      description: Penggantian tiub dalaman, penambahbaikan elektronik dan peningkatan enjin.
      icon: tabler:tool
    - title: Binaan tersuai
      description: Reka bentuk mengikut projek untuk pelanggan komersial, saintifik dan ketenteraan.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Perbincangan reka bentuk bot dan kejuruteraan
steps2_values:
  title: Nilai-nilai kami
  subtitle: Tiga prinsip yang telah membentuk setiap produk sejak hari pertama.
  items:
    - title: Bina seolah-olah ia membawa keluarga anda
      description: Setiap lambung, kimpalan dan pemegang skru dilayan seolah-olah keluarga kami sendiri yang akan menggunakannya.
      icon: tabler:heart
    - title: Jurukrek sebelum kami menjual
      description: Jika spesifikasi salah, kami menukar spesifikasi — bukan pelanggan.
      icon: tabler:settings
    - title: Sokongan yang melebihi jangka hayat waranti
      description: Lambung berusia dua puluh tahun masih menghubungi kami untuk alat ganti, dan kami masih menjawab.
      icon: tabler:headset
steps2_milestones:
  title: Pencapaian
  subtitle: Versi pendek kisah Paddle Board Overstock.
  isReversed: true
  items:
    - title: Ditubuhkan di bengkel pesisir
      description: Dimulakan oleh dua arkitek tentera laut dengan kilang CNC dan idea yang degil.
      icon: tabler:building-factory
    - title: Seribu lambung pertama dihantar
      description: Dicapai pada tahun ketujuh kami, terutamanya melalui perkataan mulut ke mulut dan pelanggan berulang.
      icon: tabler:circle-check
    - title: Program eksport antarabangsa
      description: Kini dihantar ke 50+ negara dengan rakan sokongan tempatan di lima benua.
      icon: tabler:world
    - title: Struktur operasi global baru
      description: Pada September 2026, operasi jenama berpindah dari Qingdao Vatrad Group ke Weihai Dongjilian Co., Ltd. (New Mexico, USA); hab pembuatan Qingdao terus menjalankan R&D, pengeluaran, dan eksport terus dari kilang.
      icon: tabler:building-skyscraper
features2_locations:
  title: Lokasi kami
  tagline: Cari kami
  columns: 3
  items:
    - title: Ibu pejabat & bengkel
      description: Taman perindustrian pesisir, bangunan 4 — dibuka Isnin–Jumaat untuk lawatan dengan janji temu.
    - title: Pusat perkhidmatan EU
      description: Pelabuhan Mediterranean — penambahbaikan, pembaikan dan sokongan waranti untuk pelanggan Eropah.
    - title: Rangkaian rakan kongsi APAC
      description: Rakan perkhidmatan sah di Australia, Jepun, Singapura dan Hong Kong.
brand_hub_tagline: Jenama
brand_hub_title: Terokai Jenama Kami
brand_hub_subtitle: Selami kepakaran kejuruteraan marin kami, kehadiran global, dan prinsip yang memacu kami.
brand_hub_cards:
  - title: Kepakaran Marin
    desc: Beberapa dekad sains bahan, pembuatan tepat, dan ujian dunia nyata — dari fabrikasi PVC/Hypalon ke reka bentuk lambung V-dalam dan teknologi drop-stitch.
    link: /brand-marine-expertise
    link_label: Ketahui lebih lanjut →
  - title: Kehadiran Global
    desc: Penghantaran ke 50+ negara dari fasiliti kami di Qingdao dengan rakan perkhidmatan yang dibenarkan di seluruh Eropah, Asia-Pasifik, dan Amerika.
    link: /brand-global-presence
    link_label: Ketahui lebih lanjut →
  - title: Kenapa Paddle Board Overstock
    desc: Integrasi menegak, pensijilan berganda (ISO 9001 + BSCI), pematuhan CE, dan MOQs rendah — dibina untuk jenama, pengedar, dan agensi kerajaan.
    link: /brand-why-paddleboardoverstock
    link_label: Ketahui lebih lanjut →
production_section:
  tagline: Kecemerlangan Pengeluaran
  title: Memastikan Ketelitian Seni Kraf
  description: Talian pengeluaran Paddle Board Overstock didedikasikan untuk menghasilkan produk bot tiup yang berkualiti tinggi, tahan lama, dan berprestasi tinggi.
  cards:
    - title: Pasukan Juruteknik Berpengalaman
      items:
        - Pengetahuan profesional tentang PVC, Hypalon, dan bahan marin
        - Ketekunan dalam pemotongan, penyambungan, dan pemasangan aksesori
        - Latihan berterusan untuk menguasai teknologi pengeluaran terkini
    - title: Peralatan Pengeluaran Lanjutan
      items:
        - CNC peralatan pemotongan untuk pemotongan kain yang tepat dengan ralat minimal
        - Pemanasan/pengkaitan sejuk berketepatan tinggi untuk jahitan kedap udara dan tahan lama
        - Peralatan profesional untuk ujian ketahanan udara dan tegangan
    - title: Sistem Pengurusan Matang
      items:
        - Proses pengeluaran yang distandardkan dengan piawaian kualiti yang jelas
        - Falsafah pengeluaran lean mengurangkan pembaziran dan meningkatkan kecekapan
        - Pengurusan rantaian bekalan yang cekap dengan kerjasama pembekal yang boleh dipercayai
    - title: Kawalan Kualiti Yang Ketat
      items:
        - sistem pengurusan kualiti yang disahkan
        - 'Pemeriksaan berbilang peringkat: bahan mentah, dalam proses, keluar akhir'
        - Ujian ketat ketahanan udara dan ketahanan sebelum penghantaran
global_ops_section:
  tagline: Seni Bina Operasi Global
  title_html: Satu jenama,<span class="text-white/90">dua hab</span>
  description_html: Sejak September 2026, Paddle Board Overstock telah dioperasikan oleh<strong class="text-white">Paddle Board Overstock Sdn. Bhd.</strong>(New Mexico, AS) — entiti global untuk pengedaran, jualan komersial B2B, kontrak, pengebilan, dan selepas jualan. R&D, pengeluaran, dan kawalan kualiti kekal di<strong class="text-white">Paddle Board Overstock Hab Pembuatan Qingdao</strong>, yang menghantar setiap pesanan terus dari kilang, FOB Qingdao. Peralihan ini menukar siapa yang menandatangani kontrak anda — bukan siapa yang membina bot anda.
  stats:
    - value: 2,400+
      label: Hul keseluruhan dihantar ke seluruh dunia
    - value: 50+
      label: Negara-negara dieksport
    - value: 10+
      label: Tahun-tahun pembuatan
