hero:
  tagline: Tentang kami
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock kilang dan bengkel
  title: |
    Kejuruteraan marin<br />
    membina<span class="text-accent dark:text-white">Paddle Board Overstock</span>cara
  subtitle: 'Kami bermula di sebuah bengkel tepi pantai dengan satu bot dan kepercayaan yang degil: produk marin harus direka seperti ianya penting, kerana ia memang penting. Hari ini kami menghantar ke lebih 50 negara, tetapi setiap tubuh bot masih melalui tangan yang sama yang memulakan syarikat ini.'
stats:
