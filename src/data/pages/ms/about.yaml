hero:
  tagline: Tentang kami
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock kilang dan bengkel
  title: Tentang <span class="text-accent dark:text-white">Overstock Papan Kayuh</span>
  subtitle: Papan SUP kembung baharu pada harga terlebih stok dan pelepasan — disokong oleh pembuatan Weihai kami sendiri sejak 2012, borong model campuran untuk peruncit kecil, dan penghantaran seluruh dunia yang fleksibel.
stats:
  title: Menurut nombor
  columns: 4
  stats:
    - title: Kapasiti pengeluaran tahunan
      amount: 15,000 units
    - title: Negara dihantar
      amount: 50+
    - title: Tekanan papan diuji
      amount: 100%
    - title: Jurutera R&D
      amount: 14+
features3_what_we_build:
  title: Apa yang kami bina
  subtitle: Satu rangkaian produk yang fokus yang kami kenali dengan mendalam — tiada eksperimen yang setengah siap, tiada penaik-jenama.
  columns: 3
  isBeforeContent: true
  items:
    - title: Papan SUP KEMBUNG
      description: Sup serba lengkap dan jelajah dari 10' hingga 12 kaki. Stabil, tegar, dan lengkap dengan pam, dayung, dan tali.
      icon: tabler:swimming
    - title: Dek siri seni
      description: Karya seni dek EVA khas — Lonjakan Cheetah, Bayu Tropika, Cahaya Medusa, dan banyak lagi.
      icon: tabler:hexagons
    - title: Pakej lengkap
      description: 'Setiap papan dihantar sebagai kit penuh: papan, beg galas, pam, dayung, sirip, tali leher, dan kit pembaikan.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksesori
      description: Pam, dayung, tali leher, kit pembaikan, dan beg kering. Semua dipadankan dengan papan kami.
      icon: tabler:tool
    - title: Penjagaan & pembaikan
      description: Sokongan pembaikan dalaman, alat ganti, dan panduan penyelenggaraan untuk memastikan papan anda berada di atas air selama bertahun-tahun.
      icon: tabler:settings
    - title: Armada kelab & sewaan
      description: Kelengkapan pukal untuk kelab, sekolah, dan armada sewaan dengan sokongan kilang langsung.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Perbincangan reka bentuk dan kejuruteraan lembaga
steps2_values:
  title: Nilai-nilai kami
  subtitle: Tiga prinsip yang telah membentuk setiap produk sejak hari pertama.
  items:
    - title: Bina seolah-olah ia membawa keluarga anda
      description: Setiap papan, jahitan, dan injap dilayan seolah-olah keluarga kita sendiri akan menggunakannya.
      icon: tabler:heart
    - title: Jurukrek sebelum kami menjual
      description: Jika spesifikasi salah, kami menukar spesifikasi — bukan pelanggan.
      icon: tabler:settings
    - title: Sokongan yang melebihi jangka hayat waranti
      description: Papan yang kami bina bertahun-tahun yang lalu masih menghubungi kami untuk alat ganti, dan kami masih mengambil.
      icon: tabler:headset
steps2_milestones:
  title: Pencapaian
  subtitle: Versi pendek cerita Paddle Board Overstock.
  isReversed: true
  items:
    - title: Diasaskan di Weihai
      description: Bengkel pantai khusus untuk jatuhkan papan SUP kembung.
      icon: tabler:building-factory
    - title: Kampus pengeluaran 12,000 m²
      description: Diperluaskan ke kemudahan khusus dengan kimpalan RF dan kapasiti pengeluaran jahitan.
      icon: tabler:circle-check
    - title: Program eksport antarabangsa
      description: Kini dihantar ke 50+ negara dengan pilihan pengangkutan ekspres dan laut.
      icon: tabler:world
    - title: Terlalu banyak stok & tumpuan borong
      description: Pada bulan September 2026, operasi jenama berpindah dari Qingdao Vatrad Group ke Weihai Dongjilian Co., Ltd.; hab pembuatan Weihai meneruskan R&D, pengeluaran, dan penghantaran langsung kilang.
      icon: tabler:building-skyscraper
features2_locations:
  title: Lokasi kami
  tagline: Cari kami
  columns: 3
  items:
    - title: Ibu pejabat & bengkel
      description: Taman perindustrian pesisir, bangunan 4 — dibuka Isnin–Jumaat untuk lawatan dengan janji temu.
    - title: Pusat perkhidmatan EU
      description: Pelabuhan Mediterranean — penambahbaikan, pembaikan dan sokongan waranti untuk pelanggan Eropah.
    - title: Rangkaian rakan kongsi APAC
      description: Rakan perkhidmatan sah di Australia, Jepun, Singapura dan Hong Kong.
brand_hub_tagline: Jenama
brand_hub_title: Terokai Jenama Kami
brand_hub_subtitle: Selami kepakaran kejuruteraan marin kami, kehadiran global, dan prinsip yang memacu kami.
brand_hub_cards:
  - title: Kepakaran Marin
    desc: Dekad sains bahan, pembuatan ketepatan, dan ujian dunia sebenar — dari teras jahitan ke jahitan yang dikimpal dan dek siri seni.
    link: /brand-marine-expertise
    link_label: Ketahui lebih lanjut →
  - title: Kenapa Paddle Board Overstock
    desc: Harga langsung kilang, papan diuji tekanan 100%, dan jaminan 2 tahun — dibina untuk pendayung, keluarga, dan pencinta sukan air.
    link: /brand-why-paddleboardoverstock
    link_label: Ketahui lebih lanjut →
