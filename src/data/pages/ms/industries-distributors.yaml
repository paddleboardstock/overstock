content_segments:
  tagline: Profil Rakan Kongsi
  title: Model Perkongsian Pengedaran<br />Mengikut Jenis Rakan Kongsi
  subtitle: Pengedar yang berbeza membawa kekuatan pasaran yang berbeza — infrastruktur serantau, capaian e-dagang, runcit khusus, atau portfolio pelbagai jenama. Kami menyusun terma perkongsian, lapisan harga, dan tahap sokongan untuk menyesuaikan dengan setiap profil rakan kongsi.
  items:
    - title: Pengedar Marin Serantau
      subtitle: Pengedaran eksklusif wilayah B2B
      description: Pengedar yang telah mapan dengan infrastruktur gudang, rangkaian pengedar, dan keupayaan logistik yang berkhidmat kepada pengedar marin, peruncit sukan air, dan operator sewaan dalam wilayah geografi yang ditetapkan. Anda memerlukan barisan produk lengkap, harga dilindungi, dan kemampuan untuk menyervis akaun pengedar dengan stok tempatan dan sokongan.
      features:
        - Perlindungan wilayah eksklusif dengan terma komitmen minimum
        - Harga borong katalog penuh dengan rebat volum suku tahunan
        - Program konsainan stok tempatan untuk SKU bergerak pantas
        - Latihan rangkaian pengedar dan program pemasaran bersama jenama
    - title: E-Dagang & Peruncit Dalam Talian
      subtitle: Saluran pengedaran berfokus digital
      description: Peruncit dalam talian yang menjual peralatan sukan air melalui Amazon, eBay, atau platform e-dagang mereka sendiri. Kepantasan ke pasaran, harga kompetitif, dan logistik terus kepada pengguna adalah kritikal. Anda memerlukan rakan kongsi yang boleh melaksanakan pemenuhan pesanan secara drop-ship di bawah jenama anda dengan pemenuhan pantas dan risiko inventori sifar.
      features:
        - 'Program drop-ship: pemenuhan terus dari kilang dengan jenama anda'
        - Sumber API inventori masa nyata untuk platform e-dagang anda
        - Integrasi Amazon Seller Central dengan sokongan EAN/UPC
        - Logistik pemulangan dan pemprosesan tuntutan jaminan disertakan
    - title: Peruncit Sukan Air Khusus
      subtitle: Rakan kongsi bilik pameran fizikal
      description: Kedai runcit fizikal yang mengkhususkan dalam peralatan sukan air — melayani pendayung, pemancing, dan pemilik bot tempatan dengan jualan secara bersemuka, demonstrasi, dan perkhidmatan selepas jualan. Anda memerlukan pembungkusan yang dioptimumkan untuk runcit, program unit demo, dan bahan titik jualan yang menukar pelanggan yang datang terus.
      features:
        - 'Program unit demo: papan pameran bilik pameran dengan diskaun'
        - Pembungkusan sedia runcit dengan reka bentuk kotak dioptimumkan untuk rak
        - Paparan titik jualan, carta perbandingan, dan panduan pembeli
        - Latihan kakitangan dalam kedai dan program pensijilan
    - title: Pengedar Berbilang Jenama & Kedai Serbaneka
      subtitle: Pengedaran barangan sukan garis luas
      description: Pengedar berskala besar yang melayani kedai serbaneka, peruncit kotak besar, dan rangkaian barangan sukan dengan katalog berbilang jenama. Konsistensi, dokumentasi pematuhan, dan pematuhan vendor sangat penting — setiap SKU mesti memenuhi standard pembungkusan, pelabelan, dan kualiti spesifik peruncit.
      features:
        - 'Dokumentasi pematuhan peruncit: spesifikasi pembungkusan, kod bar, pelabelan'
        - Integrasi EDI/ASN untuk sistem pesanan peruncit utama
        - Inventori diurus vendor dan program pengisian semula automatik
        - Pengurusan akaun berdedikasi dengan SLA tindak balas 24 jam
