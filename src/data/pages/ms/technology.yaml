testimonial:
  quote: Apa yang membezakan Paddle Board Overstock adalah sains bahan mereka. Mereka tidak hanya memasang komponen — mereka mereka sebatian PVC, parameter pengelasan, dan lapisan struktur dalaman. Integrasi menegak ini kelihatan pada produk akhir.
  author: David Park
  title: Pengurus Pembangunan Produk
  company: Bluewater Sports Equipment
  location: Australia
sections:
  - title: Teras Drop-Stitch
    standard: 12-15 PSI tekanan operasi
    description: Beribu-ribu benang poliester dalaman menghubungkan lapisan atas dan bawah, mencipta struktur kaku pada 12-15 PSI. Ini adalah teknologi yang sama digunakan dalam papan dayung profesional dan bot perlumbaan tiup. Ketumpatan drop-stitch kami dioptimumkan mengikut model untuk keseimbangan ideal antara kekakuan dan berat.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagram Teras DS
  - title: Gred Marin PVC
    standard: Dipasangkan gabungan | UV / air masin / tahan calar
    description: Kain PVC bertingkat-lapis yang berlapis-lapis dinilai untuk persekitaran marin. Setiap lapisan digabungkan dengan pengelasan fusion dan bukannya digam, menghapuskan risiko delaminasi. Diuji untuk rintangan UV (ASTM G154, 1,000+ jam), kakisan air masin (ISO 9227), dan calar (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Lapisan PVC
  - title: Tiub Hypalon
    standard: Getah CSM | UV / tahan bahan kimia / suhu ekstrem
    description: Digunakan pada model RIB, getah Hypalon (CSM) memberikan ketahanan superior terhadap UV dan bahan kimia berbanding PVC standard. Tiub Hypalon mengekalkan keanjalan pada suhu ekstrem dan menahan kemerosotan akibat pendedahan kepada bahan api dan minyak. Semua jahitan disusun tangan oleh juruteknik yang disahkan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Lantai Geladak Udara
    standard: Boleh Tiup Tekanan Tinggi | Menggantikan papan lapis/aluminium
    description: Sistem lantai boleh tiup tekanan tinggi yang menggantikan lantai papan lapis atau jalur aluminium tradisional. Mengurangkan masa penyediaan, berat keseluruhan, dan isipadu penyimpanan sambil menyediakan kekakuan yang mencukupi untuk berdiri, memancing, dan berjalan. Diuji untuk menyokong beban diedarkan 200 kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Dek Udara
