testimonial:
  quote: Apa yang membuatkan saya berminat ialah pembinaannya. Jahitan lasak gabungan las fusion bukannya gam, teras drop-stitch yang terasa kukuh pada 15 PSI, dan tiada goyah apabila saya melangkah ke belakang untuk berpaling. Dua tahun berlalu, tiada masalah.
  author: Marta Keller
  title: Pembeli yang disahkan
  company: Pengayuh jelajah tasik
  location: Jerman
sections:
  - title: Teras Drop-Stitch
    standard: 12-15 PSI tekanan operasi
    description: Beribu-ribu benang poliester dalaman menghubungkan lapisan atas dan bawah, mewujudkan struktur kaku pada 12-15 PSI. Ini adalah teknologi yang sama digunakan dalam papan dayung profesional. Ketumpatan drop-stitch kami dioptimumkan mengikut model untuk keseimbangan ideal antara kekakuan dan berat.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagram Teras DS
  - title: Gred Marin PVC
    standard: Dipasangkan gabungan | UV / air masin / tahan calar
    description: Kain PVC berlapis pelbagai lapisan yang dinilai untuk persekitaran marin. Setiap lapisan dilas bersama bukannya digam, menghapuskan risiko delaminasi. Diuji untuk ketahanan UV (1,000+ jam), kakisan air masin, dan abrasi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Lapisan PVC
  - title: Sistem Dek EVA
    standard: Corak siri seni yang selamat dan selesa
    description: Buih EVA penuh dek memberikan cengkaman, kusyen, dan penampilan siri seni yang tersendiri. Panel yang dipotong dengan tepat diletakkan dalam corak tanpa jahitan — tiada grafik tercetak yang boleh tercalar, tiada lilin diperlukan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Dek EVA
  - title: Sistem Rail Tiga Lapisan
    standard: Fusi terpaut | Dibina berlebihan di zon tekanan tertinggi
    description: Jalur rel mempunyai fusi tiga lapisan dan dibalut di sekitar tepi papan — zon tekanan tertinggi pada mana-mana tiup. Di sinilah papan murah gagal terlebih dahulu; papan kami dibina berlebihan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistem Rel
