trustSignals:
  tagline: Isyarat Kepercayaan
  title: Mengapa Aquafarer Adalah Rakan Kongsi yang Boleh Dipercayai
  manufacturing:
    title: Keupayaan Pembuatan
    body: Kemudahan pengeluaran seluas 12,000 m² dengan 200-300 pekerja mahir dan 14+ jurutera R&D. Sistem pengurusan kualiti ISO 9001 disahkan. Pengeluaran tahunan 15,000 unit kenderaan air tiup yang menyasar 50+ negara.
    stats:
      - label: Saiz Kemudahan
        value: 12,000 m²
      - label: Tenaga Kerja
        value: 200-300
      - label: Jurutera R&D
        value: 14+
      - label: Kapasiti Tahunan
        value: 15,000
  quality:
    title: Komitmen Kualiti
    body: Daripada pemeriksaan bahan hingga ujian akhir, Aquafarer mengekalkan proses kualiti yang sistematik untuk menghasilkan produk marin yang boleh dipercayai. Setiap unit menjalani ujian tekanan, pemeriksaan jahitan, dan pengesahan prestasi sebelum penghantaran.
    items:
      - CE Disahkan — 64 model memenuhi piawaian keselamatan Eropah
      - ISO 9001:2015 — Sistem pengurusan kualiti disahkan
      - UKCA Ditanda — Keserasian pasaran UK
  global:
    title: Kehadiran Global
    body: Aquafarer berkhidmat kepada pelanggan di pelbagai pasaran global, menyokong pengedar, jenama luar rumah, dan pengguna marin profesional di 50+ negara di Eropah, Asia-Pasifik, Amerika, Timur Tengah, dan Afrika.
comparison:
  tagline: Penentuan Kedudukan Jenama
  title: Aquafarer dalam Pasaran
  position: Pengeluar marin yang memfokuskan kejuruteraan menggabungkan kepakaran kenderaan air boleh tiup dengan keupayaan OEM/ODM penuh, pembangunan tersuai, dan pengalaman pengeluaran eksport selama 12+ tahun.
  strengths:
    - Kepakaran kejuruteraan perahu kembung
    - Kemampuan pembuatan OEM/ODM penuh
    - Pembangunan dan reka bentuk produk khusus
    - Kemudahan pengeluaran bersijil ISO seluas 12,000 m²
  bestFor:
    - Pengguna rekreasi luar rumah yang mencari perahu kembung yang boleh dipercayai
    - Operator marin yang memerlukan peralatan gred komersial
    - Rakan jenama yang memerlukan pembuatan OEM/ODM
    - Organisasi penyelamatan dan rondaan profesional
