  shift_pattern: 2 syif/hari (07:00–15:30, 15:30–00:00). Syif malam pilihan untuk pesanan segera.
  training: Latihan QC bulanan, latihan keselamatan suku tahunan, penilaian kemahiran tahunan. Pekerja baru menyelesaikan induksi 40 jam sebelum bekerja di barisan pengeluaran.
