workshops_section:
  tagline: Bengkel
  title: Bengkel Pembuatan
  workshops:
    - title: PVC Pemotongan & Persediaan Bahan
      description: CNC Mesin pemotong automatik memproses PVC dan drop-stitch membuat fabrik dengan ketepatan sub-milimeter. Penyusunan sarang yang dioptimumkan komputer meminimumkan pembaziran bahan dan memastikan setiap panel memenuhi spesifikasi dimensinya sebelum kimpalan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Kimpalan & Penutup Haba
      description: Bengkel kimpalan khusus dengan mesin pengedapan haba dan tekan dielektrik RF. Pengimpal udara panas mengikat dan menyatukan laminat teras drop-stitch dan jalur rel, manakala kimpalan RF menghasilkan jahitan kedap udara berkuat tinggi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Seni Dek & EVA Penamat
      description: 'Dek siri seni dibentuk di sini: panel busa EVA yang dipotong dengan tepat diletakkan dalam corak dek penuh, digabungkan dan dipangkas dengan tangan untuk kemasan yang selesa, tahan lama dan memberikan cengkaman — penampilan khas setiap papan siri seni.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Percetakan & Hiasan
      description: Papan SUP dihiasi menggunakan pencetakan digital untuk grafik penuh warna dan pencetakan skrin untuk logo dan corak berulang. Pencetak digital menghasilkan reka bentuk dek berkualiti gambar, manakala pencetakan skrin memberikan tanda jenama yang tahan lama dan jelas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Pemasangan Akhir & Rigging
      description: Barisan pemasangan di mana papan menerima injap, cincin-D, pemegang, sirip, dan lampiran tali. Setiap papan mengikuti senarai semak pemasangan 100 mata yang disahkan oleh ketua pasukan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Ujian & Pemeriksaan Kualiti
      description: Setiap papan yang lengkap menjalani ujian penahanan udara wajib, pengesahan pengelupasan jahitan, dan pemeriksaan sistem penuh sebelum penghantaran. Makmal kualiti kami beroperasi secara bebas daripada pengeluaran dan melapor terus kepada pengurusan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
