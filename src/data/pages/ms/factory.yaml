hero:
  tagline: Kilang
  title: Kilangan & Pembuatan
  subtitle: 12,000 m2 pembuatan bersepadu — dari bahan mentah hingga papan siap
intro:
  - Sebagai jenama kilang **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock mengawal setiap peringkat pengeluaran — dari ketibaan bahan mentah PVC dan drop-stitch bahan hingga pemeriksaan pra-penghantaran akhir papan siap. Kemudahan pembuatan kami di Zon Pembangunan Ekonomi Weihai meliputi 12,000 meter persegi dan menempatkan bengkel khusus untuk PVC pemotongan, pengedapan haba dan kimpalan, kemasan seni dek, pemasangan akhir, dan ujian kualiti.
  - Dengan mengintegrasikan reka bentuk, kejuruteraan, prototaip, pembuatan, dan ujian di bawah satu bumbung, kami menghapuskan ketidakcekapan pembuatan kontrak dan mengekalkan kawalan langsung ke atas kualiti binaan, pemilihan bahan, dan garis masa penghantaran. Setiap papan yang meninggalkan bengkel kami dibina oleh kakitangan kami, peralatan kami, mengikut piawaian kami.
