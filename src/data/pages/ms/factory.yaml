material_traceability:
  tagline: Kebolehlacakan
  title: Pengesanan Bahan & Kawalan Batch
  description: Setiap batch bahan mentah diberikan nombor lot unik dalam sistem ERP kami. Dari ketibaan hingga pengeluaran ke produk siap, bil bahan setiap bot dikaitkan kembali kepada batch pembekal asal. Ini membolehkan kebolehlacakan hulu penuh bagi sebarang pertanyaan kualiti atau pematuhan.
  system: ERP tersuai (sistem dalaman) + tag batch fizikal pada setiap pesanan kerja
  coverage: 100% bahan pengeluaran — PVC, Hypalon, drop-stitch fabrik, pelekat, injap, perkakasan, pembungkusan
  records_retained: 10 tahun (mengikut CE keperluan 2013/53/EU)
  suppliers:
    - material: Kualiti marin PVC
      source: Pembekal Cina dan Korea
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch fabrik
      source: Tenunan dalaman + rakan kongsi luaran
      certified: QC dalaman + pembekal ISO 9001
    - material: Injap & Perkakasan
      source: Chinese OEM suppliers
      certified: ISO 9001, sijil bahan setiap batch
