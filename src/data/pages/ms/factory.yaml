material_traceability:
  tagline: Kebolehlacakan
  title: Pengesanan Bahan & Kawalan Batch
  description: Setiap kumpulan bahan mentah diberikan nombor lot unik dalam sistem ERP kami. Dari ketibaan sehingga pengeluaran ke produk siap, setiap bil bahan papan berkait semula kepada kumpulan pembekal asal. Ini membolehkan penjejakan sepenuhnya ke hulu untuk sebarang pertanyaan kualiti.
  system: ERP tersuai (sistem dalaman) + tag batch fizikal pada setiap pesanan kerja
  coverage: 100% bahan pengeluaran — PVC, kain drop-stitch, busa EVA, pelekat, injap, perkakasan, pembungkusan
  records_retained: 10 tahun
qc_dashboard:
  tagline: QC mengikut Nombor
  title: Metrik Kawalan Kualiti
  subtitle: Data lulus/gagal sebenar dari barisan pengeluaran kami. Makmal kualiti kami beroperasi secara bebas dari pengeluaran dan melaporkan terus kepada pengurusan.
  stats:
    - value: 100%
      label: Unit diuji tekanan
      detail: Setiap papan, setiap dewan, setiap kumpulan
    - value: <5%
      label: Kehilangan tekanan maksimum
      detail: over 24 jam pada 1.25× tekanan yang dinilai
    - value: 99.3%
      label: Kadar bebas kecacatan
      detail: Mengikut pengambilan sampel QC dalaman
    - value: 24–48h
      label: Tempoh penahanan tekanan
      detail: Bergantung kepada kategori produk
    - value: 1.25×
      label: Tekanan ujian vs dinilai
      detail: Margin keselamatan pada setiap komora
    - value: 0%
      label: Toleransi kecacatan keselamatan
      detail: Injap, cincin D, jahitan, daya apungan
