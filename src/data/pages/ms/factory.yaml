qc_section:
  tagline: Kawalan Kualiti
  title: Proses Ujian & Jaminan Kualiti
  subtitle: Setiap bot menjalani ujian wajib sebelum dihantar. Makmal kualiti kami beroperasi secara bebas daripada pengeluaran dan melaporkan terus kepada pengurusan.
  steps:
    - step: '1'
      title: Pemeriksaan Bahan Mentah
      desc: PVC, Hypalon, dan drop-stitch fabrik menjalani ujian tegangan (ASTM D751), penyebaran koyakan, dan UV pengesahan rintangan sebelum mana-mana kelompok memasuki pengeluaran.
    - step: '2'
      title: Ujian Penahanan Udara 48 Jam
      desc: Setiap ruang tiub dipompa sehingga 125% daripada tekanan yang dinilai dan disimpan selama 48 jam. Penurunan tekanan melebihi 5% akan mencetuskan penolakan automatik dan pemeriksaan semula jahitan.
    - step: '3'
      title: Ujian Beban & Imbangan
      desc: Bot yang siap dimuatkan pada kapasiti maksimum dan diuji kestabilan, freeboard, dan pengendalian. Setiap kapal diuji dalam air sebelum pemeriksaan akhir.
oem_section:
  tagline: OEM Projek
  title: Kajian Kes Jenama & OEM Perkongsian
  subtitle: Dari konsep ke kontena — bagaimana kami membantu jenama global melancarkan dan mengembangkan barisan kenderaan air tiup mereka.
  cases:
    - challenge: Peruncit luar Eropah memerlukan barisan label peribadi SUP dengan grafik dek unik, mesra alamPVC, dan pembungkusan yang sedia untuk runcit — semuanya dihantar dalam masa 60 hari.
      solution: Membangunkan fail cetakan digital tersuai, REACHmematuhi sumberPVC, dan pensampelan termampat dari 3 pusingan ke 1 dengan menempatkan pasukan reka bentuk bersama di kilang Qingdao kami.
      result: 55 hari dari PO yang ditandatangani hingga FOB. 2,400 unit merentasi 4 SKU. Pesanan ulang dibuat sebelum kontena pertama tiba.
    - challenge: Syarikat permulaan sukan air di AS memerlukan kayak berprestasi tinggi drop-stitch dengan bentuk badan kapal yang disesuaikan, pembungkusan berjenama bersama, dan BSCI pensijilan untuk penempatan runcit.
      solution: Menyesuaikan drop-stitch acuan kayak sedia ada dengan profil rocker yang diubah suai, membangunkan karya seni pembungkusan berjenama bersama, dan menyediakan BSCI dokumentasi audit penuh.
      result: Berjaya disenaraikan di 3 rangkaian luar utama di AS. 5,000+ unit pada tahun pertama dengan kadar jualan 98%.
    - challenge: Pengedar Australia memerlukan CErangkaian yang diperakui -dengan RIB warna tiub tersuai, Hypalon pilihan naik taraf, dan pematuhan dengan Standard Australia AS 1799.
      solution: Menghasilkan sampel pra-pengeluaran dengan 4 varian warna tiub, diperoleh CSM Hypalon daripada pembekal Jepun, dan diselaraskan ujian pematuhan pihak ketiga AS 1799.
      result: Rangkaian 3-model RIB dilancarkan di pasaran AU/NZ. Diikuti dengan kemenangan tender kerajaan untuk 12 rondaanRIBs.
faq_section:
  tagline: Soalan Lazim
  title: '& B2B OEM Soalan Lazim'
  questions:
    - q: Apakah kuantiti pesanan minimum (MOQ) untuk OEM papan boleh tiup SUP ?
      a: MOQ bermula pada 5–10 unit untuk OEM model standard. Acuan khas dan projek label peribadi memerlukan minimum 200 unit bergantung pada kerumitan. Pesanan percubaan dan pengeluaran sampel tersedia untuk pelancaran jenama baru.
    - q: Adakah Aquafarer anda memegang BSCI sijil?
      a: Ya. Kilang kami mengekalkan BSCI pensijilan pematuhan sosial yang sah (laporan audit tersedia atas permintaan). Kami juga memegang ISO 9001:2015 untuk pengurusan kualiti, dan 64 model produk kami mempunyai CE pensijilan (TÜVRheinland).REACH dan RoHS dokumentasi pematuhan disediakan dengan setiap OEM penghantaran.
    - q: Apakah masa penyediaan tipikal untuk OEM sesuatu pesanan?
      a: Masa tunggu standard adalah 30–45 hari dari PO yang disahkan dan deposit. Pembangunan acuan khas menambah 15–20 hari untuk pembuatan alat. Kami menawarkan pengeluaran dipercepat untuk pesanan segera dan kesibukan musiman semasa tempoh pra-musim panas (Jan–Mac).
    - q: Bolehkah anda menghantar FOB Qingdao atau CIF ke pelabuhan kami?
      a: Ya. Kami menghantar FOB Qingdao, CIF pelabuhan utama global, dan DDP untuk rakan kongsi yang layak. Pasukan logistik kami mengurus tempahan kontena, dokumentasi eksport, dan pelepasan kastam. Kami menghantar ke 50+ negara di seluruh pasaran EU, AS, AU, dan Asia.
b2b_moq: 'Standard MOQ: 5–10 unit setiap model (SUP/kayak/drop-stitch). RIB MOQ: 2–5 unit. Pesanan percubaan dialu-alukan untuk kerjasama baru.'
production_flow:
  tagline: Aliran Pengeluaran
  title: Daripada Bahan kepada Bot Siap
  subtitle: Setiap bot melalui 6 peringkat pengeluaran dengan titik pemeriksaan QC di setiap langkah. Tiada pintasan, tiada pemeriksaan yang dilepaskan.
  stages:
    - stage: '01'
      title: Penerimaan Bahan & Kawalan Kualiti Masuk
      description: Semua bahan yang diterima dicatat mengikut nombor batch/lot dalam sistem ERP kami. PVC gulungan kain, drop-stitch teras, injap, pelekat, dan perkakasan dikarantin sehingga disahkan oleh QC.
      qc_check: Kekuatan tegangan (ASTM D751), ketahanan koyak (ISO 4674), pengukur ketebalan, kelikatan pelekat, imbasan kecacatan visual
      qc_threshold: 100% daripada kumpulan diuji. Tolak jika tegangan < 90% daripada spesifikasi, koyak < minimum spesifikasi, atau sebarang kecacatan visual
      responsibility: Pasukan QC yang akan datang (3 pemeriksa)
    - stage: '02'
      title: CNC Pemotongan & Penyediaan Bahan
      description: Susunan bersarang yang dioptimumkan komputer meletakkan panel pada stok PVC untuk mengurangkan pembaziran. Mesin pemotong CNC automatik mengekalkan ketepatan kedudukan 0.1 mm.
      qc_check: Pemeriksaan dimensi terhadap fail CAD DXF, pemeriksaan kualiti tepi, pengesahan bilangan panel
      qc_threshold: Setiap panel ke-20 diukur. Toleransi ±0.5 mm. Tolak batch jika >2% melebihi toleransi
      responsibility: Ketua bengkel pemotongan
    - stage: '03'
      title: Pengimpalan & Drop-Stitch Pengikatan
      description: Teras Drop-stitch diikat kepada lapisan luar PVC menggunakan laminasi haba. Bilik tiub dikimpal RF atau dikimpal udara panas. Tali rel diikat dengan gabungan lapisan tiga.
      qc_check: Ujian kupas setiap 50 unit (ASTM D751), pengukuran lebar kimpalan, semakan catatan suhu udara panas, pemeriksaan jahitan secara visual di bawah cahaya belakang
      qc_threshold: Kekuatan kupasan min 8 N/cm. Toleransi lebar kimpalan ±1 mm. Sebarang saluran yang kelihatan = tolak
      responsibility: QC Pengelasan (2 pemeriksa setiap syif)
    - stage: '04'
      title: Pemasangan & Peralatan
      description: 'Perahu dipindahkan ke pemasangan akhir di mana semua komponen disambungkan: hull + tiub, injap dipasang, cincin D, pemegang, kotak sirip, dan pemasangan beg galas. Setiap unit mengikuti senarai semak pemasangan 100 mata.'
      qc_check: Tandatangan senarai semak 100 mata bagi setiap unit, ujian fungsi injap (10 kitaran buka/tutup), pengesahan tork perkakasan, pemeriksaan visual
      qc_threshold: 'Polisi sifar kecacatan pada item kritikal keselamatan (injap, cincin D, pemegang). Kosmetik kecil: AQL 2.5 (ISO 2859)'
      responsibility: Ketua pasukan pemasangan + QC baris
    - stage: '05'
      title: Ujian Tekanan & Pegangan Kualiti
      description: Setiap ruang ditiup ke tekanan 1.25× tekanan yang dinilai (biasanya 20–25 PSI) dan dikekalkan selama 24–48 jam. Sensor tekanan mencatat secara berterusan. Ruang yang melebihi penurunan tekanan 5% akan ditolak dan dihantar untuk pemeriksaan semula jahitan.
      qc_check: Log penahanan tekanan 24 jam, pengesahan penentukuran sensor setiap hari, bacaan tekanan yang dilaraskan dengan suhu, ujian semula jahitan selepas pembaikan
      qc_threshold: Kehilangan tekanan maks 5% dalam 24 jam pada suhu stabil. Mana-mana ruang yang melebihi ini = 100% ujian semula keseluruhan batch pengeluaran
      responsibility: Makmal Kualiti (bebas daripada pengeluaran, melapor kepada pengurusan)
    - stage: '06'
      title: Pemeriksaan Akhir & Pembungkusan
      description: Pemeriksaan visual dan fungsi akhir. Kecacatan permukaan, keseragaman warna, pengesahan label/BIN, integriti pembungkusan, dan kelengkapan aksesori. Unit dibungkus secara vakum, dimasukkan ke dalam kotak, dan dipaleti untuk pemuatan kontena.
      qc_check: Pemeriksaan visual penuh, senarai semak aksesori setiap SKU, ujian jatuh pembungkusan (1 m, sampel rawak), pengesahan pengimbasan label/bar kod
      qc_threshold: AQL 2.5 untuk kecacatan utama, AQL 4.0 untuk kecacatan kecil. Tiada toleransi untuk kecacatan keselamatan. 100% unit diperiksa secara visual
      responsibility: Pasukan QC akhir (4 pemeriksa) + Ketua pasukan pembungkusan
workforce:
  tagline: Orang Kita
  title: Tenaga Kerja & Kepakaran
  engineers: 25+
