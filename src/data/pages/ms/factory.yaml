hero:
  tagline: Kilang
  title: Kilangan & Pembuatan
  subtitle: 12,000 m2 pembuatan bersepadu — dari bahan mentah hingga bot siap
intro:
  - Sebagai jenama kilang **Aquafarer Pusat Pembuatan Qingdao**, Aquafarer mengawal setiap peringkat pengeluaran — dari ketibaan bahan PVC dan gentian kaca hingga pemeriksaan akhir sebelum penghantaran bot siap. Kemudahan pembuatan kami di Zon Pembangunan Ekonomi Qingdao merangkumi 12,000 meter persegi dan menempatkan bengkel khusus untuk pemotongan PVC, penyegelan haba tiub, pengeluaran badan bot gentian kaca RIB, percetakan digital SUP, pemasangan akhir, dan ujian kualiti.
  - Dengan mengintegrasikan reka bentuk, kejuruteraan, penyaduran prototaip, pembuatan, dan ujian di bawah satu bumbung, kami menghapuskan ketidakcekapan pembuatan kontrak dan mengekalkan kawalan langsung ke atas kualiti pembinaan, pemilihan bahan, dan garis masa penghantaran. Setiap bot yang keluar dari bengkel kami dibina oleh pekerja kami, dengan peralatan kami, mengikut standard kami.
