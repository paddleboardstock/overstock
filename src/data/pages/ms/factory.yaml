workshops_section:
  tagline: Bengkel
  title: Bengkel Pembuatan
  workshops:
    - title: PVC Pemotongan & Persediaan Bahan
      description: Mesin pemotong CNC automatik memproses kain PVC, Hypalon, dan drop-stitch dengan ketepatan sub-milimeter. Penempatan sarang yang dioptimumkan komputer mengurangkan pembaziran bahan dan memastikan setiap panel memenuhi spesifikasi ukurannya sebelum pengelasan.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Pengelasan Tiub & Pengedapan Panas
      description: Bengkel pengelasan khusus dengan mesin pengedap panas dan tekanan dielektrik RF. Pengedap panas udara panas mengikat dan menyatu ruang tiub PVC, sementara pengelasan RF menghasilkan jahitan kedap udara berkuat tinggi yang melebihi keperluan ISO 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Pengeluaran Lambung — Fiberglass
      description: Lambung bot RIB dihasilkan menggunakan acuan fiberglass tangan dengan sistem resin poliester dan vinilester. Setiap lapisan digulung dengan tangan dan disedut menggunakan vakum untuk kualiti yang konsisten. Bilik semburan gelcoat memberikan kemasan marin berkilat tinggi dan tahan UV.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Percetakan & Hiasan
      description: Papan SUP dihiasi menggunakan pencetakan digital untuk grafik penuh warna dan pencetakan skrin untuk logo dan corak berulang. Pencetak digital menghasilkan reka bentuk dek berkualiti gambar, manakala pencetakan skrin memberikan tanda jenama yang tahan lama dan jelas.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Pemasangan Akhir & Peralatan
      description: Laluan pemasangan di mana lambung fiberglass dan tiub PVC digabungkan, enjin dipasang, stereng dan kawalan disambungkan, dan sistem elektrik dipasang. Setiap bot mengikuti senarai semak pemasangan 100 mata yang disahkan oleh ketua pasukan.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Ujian & Pemeriksaan Kualiti
      description: Setiap bot yang siap menjalani ujian pengekalan udara wajib, pengesahan pelepasan jahitan, dan pemeriksaan sistem penuh sebelum penghantaran. Makmal kualiti kami beroperasi secara bebas dari pengeluaran dan melapor terus kepada pengurusan.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
