qc_section:
  tagline: Kawalan Kualiti
  title: Proses Ujian & Jaminan Kualiti
  subtitle: Setiap papan menjalani ujian wajib sebelum penghantaran. Makmal kualiti kami beroperasi secara bebas daripada pengeluaran dan melaporkan terus kepada pihak pengurusan.
  steps:
    - step: '1'
      title: Pemeriksaan Bahan Mentah
      desc: Kain PVC dan drop-stitch menjalani ujian tarik, penyebaran koyakan, dan pengesahan ketahanan UV sebelum sebarang kumpulan memasuki pengeluaran.
    - step: '2'
      title: Ujian Penahanan Udara 48-Jam
      desc: Setiap ruang papan ditiup sehingga 125% daripada tekanan yang dinilai dan dikekalkan selama 48 jam. Penurunan tekanan melebihi 5% akan mencetuskan penolakan automatik dan pemeriksaan semula jahitan.
    - step: '3'
      title: Ujian Beban & Keseimbangan
      desc: Papan yang lengkap dimuatkan hingga kapasiti maksima yang dinilai dan diuji untuk kestabilan, paras bebas, dan pengendalian. Setiap papan diuji dengan air sebelum pemeriksaan akhir.
faq_section:
  tagline: Soalan Lazim
  title: Soalan Lazim
  questions:
    - q: Di manakah papan dayung anda dibuat?
      a: Setiap papan dibina di kilang kami sendiri seluas 12,000 m² di Weihai, China. Kami tidak mengalih keluar kerja — reka bentuk, bahan, pengelasan, pemasangan, dan ujian semuanya berlaku di bawah satu bumbung, jadi kualiti tidak pernah bergantung pada pihak ketiga.
    - q: Bagaimana harga anda boleh jauh lebih rendah daripada harga runcit?
      a: Kami menjual lebihan stok kilang dan batch pelepasan secara terus dari fasiliti pengeluaran kami sendiri — tiada orang tengah, tiada kenaikan harga runcit. Itu bermakna pakej SUP lengkap sehingga 60% lebih murah daripada harga runcit biasa, dengan kualiti yang sama yang diuji ketahanannya.
    - q: Apakah yang termasuk dengan papan?
      a: 'Setiap SUP dihantar sebagai pakej lengkap: papan, beg galas perjalanan, pam tangan, dayung laras, sirip boleh tanggal, tali gegelung, dan kit pembaikan.'
    - q: Berapa cepat pesanan dihantar?
      a: Pesanan yang ada dalam stok akan dihantar dari kilang kami di Weihai dalam masa 2-3 hari bekerja dengan penghantaran yang dikesan ke 50+ negara di seluruh EU, Amerika Utara, Asia-Pasifik, dan seterusnya.
production_flow:
  tagline: Aliran Pengeluaran
  title: Daripada Bahan kepada Papan Siap
  subtitle: Setiap papan melalui 6 peringkat pengeluaran dengan titik pemeriksaan QC di setiap langkah. Tiada pintasan, tiada pemeriksaan yang dilangkau.
  stages:
    - stage: '01'
      title: Penerimaan Bahan & Kawalan Kualiti Masuk
      description: Semua bahan yang diterima dicatat mengikut nombor batch/lot dalam sistem ERP kami. PVC gulungan kain, drop-stitch teras, injap, pelekat, dan perkakasan dikarantin sehingga disahkan oleh QC.
      qc_check: Kekuatan tegangan, rintangan koyak, pengukur ketebalan, kelikatan pelekat, imbasan kecacatan visual
      qc_threshold: 100% daripada kumpulan diuji. Tolak jika tegangan < 90% daripada spesifikasi, koyak < minimum spesifikasi, atau sebarang kecacatan visual
      responsibility: Pasukan QC yang akan datang (3 pemeriksa)
    - stage: '02'
      title: CNC Pemotongan & Penyediaan Bahan
      description: Susunan bersarang yang dioptimumkan komputer meletakkan panel pada stok PVC untuk mengurangkan pembaziran. Mesin pemotong CNC automatik mengekalkan ketepatan kedudukan 0.1 mm.
      qc_check: Pemeriksaan dimensi terhadap fail CAD DXF, pemeriksaan kualiti tepi, pengesahan bilangan panel
      qc_threshold: Setiap panel ke-20 diukur. Toleransi ±0.5 mm. Tolak batch jika >2% melebihi toleransi
      responsibility: Ketua bengkel pemotongan
    - stage: '03'
      title: Pengimpalan & Drop-Stitch Pengikatan
      description: Teras Drop-stitch diikat kepada lapisan luar PVC menggunakan laminasi haba. Bilik tiub dikimpal RF atau dikimpal udara panas. Tali rel diikat dengan gabungan lapisan tiga.
      qc_check: Ujian kupas setiap 50 unit, pengukuran lebar kimpalan, semakan log suhu udara panas, pemeriksaan jahitan visual di bawah cahaya belakang
      qc_threshold: Kekuatan kupasan min 8 N/cm. Toleransi lebar kimpalan ±1 mm. Sebarang saluran yang kelihatan = tolak
      responsibility: QC Pengelasan (2 pemeriksa setiap syif)
    - stage: '04'
      title: Pemasangan & Pengemasan
      description: 'Papan dipindahkan ke pemasangan akhir di mana semua komponen dipasang: injap dipasang, D-ring, pemegang, kotak sirip, dan pemasangan beg galas. Setiap unit mengikuti senarai semak pemasangan 100 mata.'
      qc_check: Tandatangan senarai semak 100 mata bagi setiap unit, ujian fungsi injap (10 kitaran buka/tutup), pengesahan tork perkakasan, pemeriksaan visual
      qc_threshold: Polisi sifar kecacatan pada item keselamatan kritikal (injap, D-ring, pemegang). Kecacatan kosmetik kecil dalam had kosmetik yang ketat.
      responsibility: Ketua pasukan pemasangan + QC baris
    - stage: '05'
      title: Ujian Tekanan & Pegangan Kualiti
      description: Setiap ruang ditiup ke tekanan 1.25× tekanan yang dinilai (biasanya 20–25 PSI) dan dikekalkan selama 24–48 jam. Sensor tekanan mencatat secara berterusan. Ruang yang melebihi penurunan tekanan 5% akan ditolak dan dihantar untuk pemeriksaan semula jahitan.
      qc_check: Log penahanan tekanan 24 jam, pengesahan penentukuran sensor setiap hari, bacaan tekanan yang dilaraskan dengan suhu, ujian semula jahitan selepas pembaikan
      qc_threshold: Kehilangan tekanan maks 5% dalam 24 jam pada suhu stabil. Mana-mana ruang yang melebihi ini = 100% ujian semula keseluruhan batch pengeluaran
      responsibility: Makmal Kualiti (bebas daripada pengeluaran, melapor kepada pengurusan)
    - stage: '06'
      title: Pemeriksaan Akhir & Pembungkusan
      description: Pemeriksaan visual dan fungsi akhir. Kecacatan permukaan, keseragaman warna, pengesahan label/BIN, integriti pembungkusan, dan kelengkapan aksesori. Unit dibungkus secara vakum, dimasukkan ke dalam kotak, dan dipaleti untuk pemuatan kontena.
      qc_check: Pemeriksaan visual penuh, senarai semak aksesori setiap SKU, ujian jatuh pembungkusan (1 m, sampel rawak), pengesahan pengimbasan label/bar kod
      qc_threshold: Toleransi sifar pada kecacatan keselamatan. Kecacatan kosmetik dalam had yang ketat. 100% unit diperiksa secara visual.
      responsibility: Pasukan QC akhir (4 pemeriksa) + Ketua pasukan pembungkusan
