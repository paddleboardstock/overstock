hero:
  tagline: Kajian Kes
  title: Projek Sebenar, Hasil Sebenar<br />— Paddle Board Overstock dalam Tindakan
  subtitle: Lihat bagaimana Paddle Board Overstock bekerjasama dengan pengedar, jenama, dan pengendali di seluruh dunia untuk menyediakan penyelesaian marin khusus bagi setiap aplikasi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock Kajian Kes — Projek Pembuatan Marin Khas
features3_cases:
  tagline: Kes Pilihan
  title: Penyelesaian Tersuai<br />Untuk Cabaran Sebenar
  isBeforeContent: false
  columns: 3
  items:
    - title: Naik Taraf Operasi Harian Pusat Selaman Bali
      customer: Pusat Menyelam Lautan Biru
      country: Indonesia
      industry: Pusat Selam Komersial
      challenge: Blue Ocean Diving Center di Bali mengendalikan bot selam gentian kaca lama dengan ruang dek yang terhad, penyelam yang sukar untuk menaiki kapal, dan penyelenggaraan tinggi dalam keadaan air masin tropika. Pemuatan peralatan sesak, masa persiapan panjang, dan platform yang tidak stabil menimbulkan kebimbangan keselamatan kepada pelancong antarabangsa — termasuk penyelam kali pertama dan pelancong yang lebih tua. Pusat ini menjalankan 3-5 perjalanan menyelam setiap hari, 200+ hari setahun.
      solution: Paddle Board Overstock membekalkan penyelaman profesional khusus 6.8m RIB dengan susun atur dek yang diperluaskan yang dioptimumkan untuk penyimpanan peralatan skuba, tangga selam keluli tahan karat yang lebar, Hypalon tiub tugas berat UV dan ketahanan air masin, permukaan dek anti-gelincir, dan penyelesaian penyimpanan tangki. Konfigurasi ini direka mengikut aliran kerja harian pusat menyelam — bukan berdasarkan susun atur bot rekreasi standard.
      product: Menyelam RIBProfesional 6.8m
      results: Kawasan kerja yang lebih besar meningkatkan kecekapan penyediaan peralatan. Penyelam mengalami proses menaiki kapal dengan lebih selamat dan mudah. Keperluan penyelenggaraan berkurangan dengan ketara. Pusat ini memperoleh kapasiti untuk mengendalikan lebih ramai pelanggan semasa musim puncak dengan keyakinan yang lebih tinggi. Ini RIB menjadi asas operasi menyelam harian.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Bot selam kami bukan sekadar pengangkutan. Ia adalah asas operasi harian kami.Paddle Board Overstock RIB Memberi pasukan kami lebih keyakinan apabila menjalankan beberapa perjalanan menyelam setiap hari.
      icon: tabler:lifebuoy
    - title: Naik Taraf Profesional Pusat Selaman Phuket RIB
      customer: Pusat Menyelam Ocean Explorer
      country: Thailand
      industry: Pusat Selam Komersial
      challenge: Ocean Explorer Diving Center di Phuket, Thailand, perlu menaik taraf daripada bot selam gentian kaca tradisional yang tidak dapat memenuhi permintaan pelanggan yang semakin meningkat. Ruang dek yang terhad menjadikan persiapan peralatan tidak cekap. Menaiki pesawat yang sukar mencipta cabaran keselamatan untuk pelancong antarabangsa. Keperluan penyelenggaraan yang tinggi dalam keadaan air masin tropika meningkatkan kos operasi. Pusat ini mengendalikan beberapa perjalanan harian, 200+ hari setahun.
      solution: Paddle Board Overstock menyediakan Penyelaman Komersial setinggi 6.8m RIB yang disesuaikan dengan susun atur dek kerja yang dioptimumkan untuk penyimpanan tangki skuba, penyediaan peralatan, dan pergerakan penyelam. Ciri-ciri termasuk tangga menyelam lebar dengan pemegang tangan keluli tahan karat, pembinaan tiub tugas berat dengan UVbahan tahan kalis, lantai anti-gelincir, penyelesaian penyimpanan tangki, konsol profesional, dan tempat duduk penumpang — semuanya dikonfigurasikan untuk operasi menyelam komersial.
      product: Menyelam RIBKomersial 6.8m
      results: Kawasan dek yang lebih besar membolehkan organisasi peralatan yang lebih pantas dan aliran kerja harian yang lebih cekap. Keselesaan dan keselamatan pelanggan menaiki pesawat bertambah baik dengan ketara. Masa henti penyelenggaraan berkurangan dengan pembinaan gred marin. Pusat menyelam dapat melayani lebih ramai pelanggan semasa musim puncak dan mengembangkan perkhidmatan menyelam profesional dengan yakin.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Bagi pusat menyelam, bot bukan sekadar pengangkutan. Ia adalah bahagian penting dalam operasi harian kami.Paddle Board Overstock RIB Memberi keyakinan kepada pasukan kami untuk menjalankan beberapa perjalanan menyelam setiap hari dengan keselamatan dan kecekapan yang lebih baik.
      icon: tabler:lifebuoy
    - title: Armada Pusat Selaman Eropah
      customer: Pusat Menyelam BlueMed
      country: Yunani
      industry: Menyelam & Pelancongan Marin
      challenge: Diperlukan 12 konfigurasi selaman RIBs untuk rangkaian pusat menyelam merentasi beberapa pulau Greece. Setiap bot memerlukan tangga selam khas, simpanan tangki untuk 8 tangki, dan platform stabil untuk kemasukan penyelam di air terbuka. Armada perlu tiba dalam masa 60 hari untuk permulaan musim pelancongan.
      solution: Menghasilkan 12 RIB model 520 Dive dengan rak tangki terbina dalam, tangga menyelam, dan Hypalon tiub ekstra lebar untuk kestabilan menaiki kapal. Setiap bot diberi jenama dengan livery armada pelanggan. Kesemua 12 bot diuji tekanan dan dihantar dari Qingdao dalam masa 55 hari.
      product: RIB 520 Dive
      results: Kesemua 12 bot dihantar tepat pada masanya untuk musim pelancongan. Armada telah beroperasi setiap hari selama 18+ bulan tanpa sebarang kegagalan bahan. Pelanggan memesan 6 unit tambahan pada tahun kedua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive telah menjadi tulang belakang operasi menyelam harian kami. Kestabilan ketika berehat adalah sangat baik, dan susun atur simpanan tangki memastikan dek bersih dan selamat untuk tetamu kami.
      icon: tabler:lifebuoy
    - title: Program Pengedar Australia OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Pembuatan
      challenge: Pengedar Australia memerlukan SUP rangkaian papan label peribadi pada harga yang kompetitif untuk bersaing dengan jenama terus kepada pengguna China. Diperlukan 8 model unik yang merangkumi pemula hingga lanjutan, dengan grafik tersuai, pembungkusan tersuai, dan pemenuhan drop-ship ke kedai runcit.
      solution: Membangunkan 8 SUP model (Serba Boleh, Pelancongan, Yoga, Kanak-kanak, Sukan, Ultra-Kompak, Ultra-Stabil, Air) dengan pakej grafik eksklusif Australia. Pembungkusan runcit tersuai dengan kod QR yang dipautkan ke video tetapan. Logistik drop-ship dikonfigurasikan dari Qingdao terus ke kedai runcit Australia.
      product: SUP Custom Line (8 model)
      results: Konsep hingga penghantaran pertama dalam 90 hari. Kadar jualan runcit sebanyak 85% pada musim pertama. Pengedar memperluaskan kerjasama untuk memasukkan barisan bot kembung pada tahun kedua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock Menghantar SUP satu rangkaian lengkap dalam 90 hari — dari reka bentuk awal hingga ke lantai runcit. Kualitinya setanding dengan jenama yang dijual pada harga dua kali ganda.
      icon: tabler:arrows-exchange
    - title: Bekalan Bot Penyelamat Timur Tengah
      customer: Pihak Berkuasa Pertahanan Awam Kebangsaan
      country: Emiriah Arab Bersatu
      industry: Cari & Menyelamat
      challenge: Organisasi pertahanan awam memerlukan 20 unit yang bersedia RIBs untuk rondaan untuk pencarian dan penyelamatan pantai, keselamatan pelabuhan, dan tindak balas banjir. Diperlukan dek yang boleh memuatkan sendiri, suite navigasi lengkap (GPS, radar, VHF), tiub oren bercahaya tinggi, dan pematuhan kepada peraturan maritim tempatan.
      solution: Membekalkan 20 RIB model 450 Patrol dengan dek self-bailing, suite navigasi Garmin, lampu sorot LED, SOLAS pita reflektif, dan tiub oren bercahaya tinggi Hypalon . Setiap bot telah CEdisahkan dan diuji mengikut ISO piawaian 6185. Pakej dokumentasi termasuk sijil pematuhan untuk pendaftaran tempatan.
      product: RIB 450 Patrol
      results: Armada dikerahkan di 5 stesen pantai. Bot beroperasi dalam keadaan panas melampau (45°C+) tanpa kerosakan tiub. Jarak rondaan dan kecekapan bahan api melebihi spesifikasi sebanyak 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450 Patrol melebihi keperluan operasi kami. Dalam keadaan panas melampau, Hypalon tiub tidak menunjukkan tanda-tanda UV kerosakan selepas 24 bulan penggunaan harian.
      icon: tabler:alert-triangle
    - title: OEM Perkongsian Jenama Eropah
      customer: Peralatan Marin Laut Utara BV
      country: Belanda
      industry: OEM/ODM Pembuatan
      challenge: Jenama marin Eropah yang kukuh ingin berkembang ke RIB pasaran tanpa melabur dalam kemudahan pembuatan. Memerlukan rakan kongsi label putih yang mampu menghasilkan 5 RIB model (3.9 juta hingga 6.2 juta) dengan penjenamaan peribadi, CE pensijilan, dan hak pengedaran eksklusif EU.
      solution: Perjanjian pembuatan label putih telah ditetapkan untuk 5 RIB model. Setiap model berjenama dengan logo pelanggan dan skema warna.CE Dokumentasi pensijilan disediakan untuk setiap model. Hak pengedaran eksklusif EU diberikan dengan komitmen pesanan minimum. Dokumentasi teknikal dan katalog alat ganti disediakan untuk rangkaian perkhidmatan tempatan.
      product: RIB Custom Line (5 model)
      results: Perjanjian berbilang tahun ditandatangani. Pengeluaran pertama sebanyak 50 unit dihantar dalam masa 75 hari. Jenama dilancarkan di METSTRADE dengan penerimaan positif kepada pengedar.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Bekerjasama Paddle Board Overstock membolehkan kami memasuki RIB pasaran tanpa perlu membina kilang — mereka menyediakan penyelesaian siap pakai lengkap dengan CE pensijilan dan dokumentasi sokongan pengedar.
      icon: tabler:building
    - title: Armada Resort Caribbean
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Pelancongan Marin & Hospitaliti
      challenge: 'Resort mewah memerlukan armada lengkap peralatan sukan air untuk aktiviti tetamu: 40 SUP papan untuk lawatan berpandu, 20 kayak untuk penerokaan lagun, 10 bot tiup untuk pemindahan tetamu dan lawatan memancing, serta aksesori. Semua peralatan memerlukan penjenamaan resort khas dan perlu dihantar sebelum musim pelancongan puncak.'
      solution: 'Menghasilkan pakej lengkap sukan air: 40 SUP papan Voyager (model Serba Boleh), 20 kayak Explorer, 10 AirDeck bot tiup 360, serta PFD, dayung, pam, dan kit pembaikan. Semua peralatan dicetak dengan logo resort dan skema warna tropika. Penghantaran kontena dengan manifest inventori penuh.'
      product: Pakej Sukan Air Penuh (70+ unit)
      results: Armada tiba 6 minggu sebelum musim puncak. Skor kepuasan tetamu untuk aktiviti sukan air meningkat 40% tahun ke tahun. Peralatan telah bertahan selama 3 musim dengan hanya penyelenggaraan rutin.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Pendekatan pakej lengkap bermakna kami menerima segala yang diperlukan dalam satu penghantaran — papan, kayak, bot, dan aksesori yang semuanya berjenama dan sedia untuk kegunaan tetamu. Tetamu kami sangat menyukai kualiti peralatan.
      icon: tabler:beach
    - title: Peningkatan Pusat Selaman Komersial Queensland RIB
      customer: Pusat Selam Komersial
      country: Australia
      industry: Perkhidmatan Menyelam & Marin Komersial
      challenge: Sebuah pusat menyelam komersial yang berpusat di Queensland yang mengkhusus dalam pemeriksaan infrastruktur marin, penyelenggaraan pelabuhan, dan projek pembaikan bawah air sedang mengendalikan sebuah bot kerja yang sudah usang. Apabila permintaan projek meningkat, kapal lama itu menjadi liabiliti — penyelenggaraan yang kerap menyebabkan gangguan jadual, susun atur tidak direka untuk operasi menyelam moden (ruang terhad untuk silinder, alat, dan peralatan), dan keselesaan kru semasa operasi lama adalah terhad. Syarikat memerlukan kapal yang boleh menyokong operasi profesional mereka setiap hari bekerja.
      solution: Paddle Board Overstock menjalankan analisis operasi terperinci mengenai aliran kerja menyelam pelanggan, tempoh projek tipikal, saiz kru, dan keperluan peralatan. Berdasarkan analisis ini, Paddle Board Overstock beliau menyediakan profesional yang disesuaikan RIB dengan susun atur dek fungsional yang dioptimumkan untuk persiapan peralatan dan pergerakan penyelam, tempat duduk profesional untuk tempoh pengangkutan yang lebih lama, kestabilan yang dipertingkatkan untuk kemasukan dan keluar penyelam yang lebih selamat, serta ciri sokongan menyelam yang diintegrasikan ke dalam reka bentuk.
      product: Menyelam RIBProfesional Khas
      results: Yang baru RIB menjadi platform kerja harian yang boleh dipercayai. Penyediaan peralatan menjadi lebih pantas dengan susun atur yang dioptimumkan. Kru melaporkan peningkatan keselesaan dan keselamatan semasa operasi yang panjang. Penampilan profesional bot mengukuhkan keyakinan pelanggan apabila bekerjasama dengan pengendali pelabuhan dan kontraktor marin. Pusat selam memperoleh kapal yang setanding dengan profesionalisme perkhidmatan mereka.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Kami memerlukan sebuah bot yang dapat menyokong perniagaan kami setiap hari, bukan sekadar kapal untuk pengangkutan. Paddle Board Overstock bekerjasama dengan kami untuk memahami keperluan operasi kami dan menyediakan penyelesaian RIB yang sesuai dengan aliran kerja menyelam komersial kami.
      icon: tabler:lifebuoy
    - title: Kontrak Rondaan Pantai AS
      customer: Agensi Keselamatan Pesisiran Atlantik
      country: Amerika Syarikat
      industry: Keselamatan Maritim & Penguatkuasaan Undang-Undang
      challenge: Agensi keselamatan pantai AS memerlukan RIBs rondaan berat untuk operasi pemintas di perairan terbuka. Memerlukan konfigurasi enjin berkembar untuk ketahanan, konsol berperisai untuk perlindungan kru, elektronik spesifikasi tentera (komunikasi disulitkan, FLIR, radar), dan mematuhi peraturan Pengawal Pantai AS.
      solution: Dibina RIB 600 Patrol dengan konfigurasi luar pesisir berkembar 115 HP, konsol berperisai dengan perlindungan balistik, pengimejan termal FLIR, komunikasi VHF/UHF disulitkan, dan titik pemasangan senjata bersepadu. Lambung diperkuat untuk manuver pencegatan berkelajuan tinggi. Semua elektronik disepadukan dan diuji di kilang. Dokumen pematuhan USCG disediakan.
      product: RIB 600 Rondaan (Enjin Berkembar)
      results: Bot mencapai kelajuan maksimum 52 knot semasa ujian penerimaan. Agensi melaporkan kadar kesiapsiagaan misi 95% dalam tempoh 12 bulan pertama. Pesanan tambahan dibuat untuk 8 unit.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Pesawat berkembar RIB 600 memberikan krew kami kelajuan dan redundansi yang diperlukan untuk operasi tangkapan di perairan terbuka. Konsol berperisai menyediakan perlindungan penting tanpa mengurangkan prestasi.
      icon: tabler:shield
