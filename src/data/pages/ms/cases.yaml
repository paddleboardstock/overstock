hero:
  tagline: Kajian Kes
  title: Pendayung Sebenar, Kisah Sebenar<br />— Paddle Board Overstock dalam Tindakan
  subtitle: Lihat bagaimana pendayung, keluarga, dan pengembara di seluruh dunia berada di atas air dengan Paddle Board Overstock papan kembung SUP .
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
