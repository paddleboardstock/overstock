label: Jaminan
headline: Paddle Board Overstock Jaminan Terhad Pengilang
subtitle: Paddle Board Overstock berdiri di belakang kualiti setiap papan SUP boleh kembung yang kami hasilkan. Jaminan Terhad ini menetapkan terma dan perlindungan untuk papan Paddle Board Overstock anda.
seo:
  headline: Paddle Board Overstock SUP Jaminan — Jaminan Terhad 2 Tahun | Paddle Board Overstock
  description: Paddle Board Overstock menawarkan jaminan terhad 2 tahun yang merangkumi jahitan drop-stitch, pembinaan rel, injap inflasi, dan aksesori yang disertakan pada setiap papan SUP. Terma dan syarat penuh.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Jaminan Terhad ini terpakai kepada papan Paddle Board Overstock berjenama baru yang boleh kembung yang dibeli terus dari kedai dalam talian Paddle Board Overstock. Tarikh berkuat kuasa adalah tarikh pembelian asal yang boleh disahkan.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Perlindungan & Tempoh Jaminan</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch struktur teras & dek</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Pembinaan rel & jahitan</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Fungsi injap inflasi</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Aksesori yang disertakan (pam, dayung, tali pengikat, sirip)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Tahun*</h3>
          <p class="text-sm text-gray-600 mt-1">Penggunaan komersial, sewaan, atau armada — semua komponen</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Penggunaan komersial, sewaan, atau armada mengurangkan jaminan kepada 1 tahun. Penggunaan untuk perlumbaan atau pertandingan membatalkan jaminan sepenuhnya.</p>
    </div>

    <h2>Apa yang Dilindungi</h2>
    <h3>Drop-Stitch Struktur Teras & Dek (2 Tahun)</h3>
    <p>Teras drop-stitch dalaman dan struktur luar papan dijamin bebas daripada kecacatan pengilangan yang menjejaskan keupayaan papan untuk mengekalkan inflasi dan kekakuan semasa operasi.</p>

    <h3>Pembinaan Rel & Jahitan (2 Tahun)</h3>
    <p>Jahitan dan jalur rel tiga lapisan, di mana digabungkan semasa pengilangan, dijamin bebas daripada kecacatan pengilangan yang mengakibatkan kebocoran udara yang ketara melalui jahitan. Pemeriksaan berkala dan penyelenggaraan tekanan inflasi yang sesuai adalah syarat perlindungan.</p>

    <h3>Fungsi Injap Inflasi (2 Tahun)</h3>
    <p>Injap inflasi udara yang dipasang asal oleh Paddle Board Overstock dijamin terhadap kecacatan pengilangan dalam bahan atau kerja yang menghalang injap mengekalkan udara seperti yang direka.</p>

    <h3>Aksesori yang Disertakan (2 Tahun)</h3>
    <p>Pam, dayung boleh laras, tali pengikat, sirip boleh alih, dan komponen lain yang disertakan dengan pakej papan anda dijamin bebas daripada kecacatan bahan dan kerajinan.</p>

    <h2>Apa yang Tidak Dilindungi</h2>
    <ul>
      <li>Kecacatan kosmetik termasuk perubahan warna, kotoran, pudar, pengapur, atau sebarang perubahan penampilan</li>
      <li>Tusukan, potongan, koyakan, robekan, atau kerosakan fizikal lain</li>
      <li>Retakan halus, rekahan, haus, calar, atau kemerosotan akibat geseran atau sentuhan</li>
      <li>Kemerosotan akibat pendedahan cahaya UV, hakisan, atau keadaan atmosfera</li>
      <li>Kerusakan akibat sentuhan dengan pelarut, asid, alkali, atau bahan kimia</li>
      <li>Kerosakan akibat kecuaian, penggunaan yang tidak betul, penyalahgunaan, kemalangan, atau kehausan normal</li>
      <li>Kerosakan akibat impak, tekanan, sokongan yang tidak betul, atau pengangkutan</li>
      <li>Kerosakan akibat inflasi/deflasi yang tidak betul atau penggunaan peranti inflasi yang tidak diluluskan</li>
      <li>Peralatan, komponen, atau sistem pihak ketiga (dilindungi oleh pengeluar masing-masing)</li>
    </ul>

    <h2>Kewajipan &amp; Penambahbaikan Pengilang</h2>
    <p>Kewajipan tunggal dan eksklusif Paddle Board Overstock adalah untuk membaiki atau menggantikan, mengikut pilihan Paddle Board Overstock, mana-mana komponen yang ditentukan sebagai rosak dari segi bahan atau kerja tangan dan dilindungi di bawah jaminan ini. Pembaikan atau penggantian dilakukan oleh Paddle Board Overstock atau pusat servis yang ditetapkan olehnya. Komponen yang dibaiki atau diganti hanya dijamin untuk tempoh baki jaminan asal yang belum tamat.</p>

    <h2>Syarat-syarat Waranti</h2>
    <ul>
      <li><strong>Penyelenggaraan:</strong>Produk mesti diselenggara mengikut panduan yang diterbitkan oleh Paddle Board Overstock, termasuk pemeriksaan berkala dan penyelenggaraan tekanan yang sesuai.</li>
      <li><strong>Kerjasama:</strong>Pembeli mesti bekerjasama sepenuhnya dan segera dengan Paddle Board Overstock dalam semua perkara yang berkaitan dengan tuntutan jaminan.</li>
      <li><strong>Pembeli Asal:</strong>Jaminan ini diberikan secara eksklusif kepada pembeli asal pengguna akhir dan tidak boleh dipindah milik.</li>
    </ul>

    <h2>Kegunaan Komersial</h2>
    <p>Jika produk digunakan untuk tujuan komersial, penyewaan, atau armada, tempoh jaminan untuk semua komponen dikurangkan kepada satu (1) tahun dari tarikh pembelian asal. Penggunaan dalam perlumbaan, kelajuan atau pertandingan ketahanan secara serta-merta dan tidak boleh dibatalkan akan membatalkan sepenuhnya jaminan.</p>

    <h2>Cara Membuat Tuntutan Waranti</h2>
    <p>Hubungi Paddle Board Overstock dengan bukti pembelian dan penerangan terperinci tentang isu tersebut. Paddle Board Overstock akan menyemak tuntutan dan memberikan arahan untuk pemeriksaan dan servis.</p>
    <p>Untuk pertanyaan perkhidmatan jaminan, sila hubungi kami melalui<a href="/contact" class="text-sky-600 underline">halaman hubungan</a>dengan nombor pesanan dan maklumat produk anda.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Kenyataan jaminan ini adalah ringkasan kepada Jaminan Terhad Pengilang Paddle Board Overstock yang lengkap. Dokumen jaminan undang-undang penuh mengawal semua terma dan syarat jaminan. Spesifikasi tertakluk kepada perubahan tanpa notis. Paddle Board Overstock adalah jenama kilang daripada Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
