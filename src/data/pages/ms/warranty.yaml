label: Jaminan
headline: Paddle Board Overstock Jaminan Terhad Pengilang
subtitle: Paddle Board Overstock menyokong kualiti setiap produk marin tiup yang kami hasilkan. Jaminan Terhad ini menetapkan terma dan liputan untuk produk Paddle Board Overstock anda.
seo:
  headline: Paddle Board Overstock Jaminan Bot Tiup — Jaminan Terhad 5 Tahun | Paddle Board Overstock
  description: Paddle Board Overstock menawarkan jaminan terhad 5 tahun untuk fabrik tiub utama, jahitan, dan integriti struktur lambung fiberglass. Juga merangkumi injap inflasi serta aksesori yang dipasang di kilang. Terma dan syarat penuh untuk jaminan bot tiup Paddle Board Overstock.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Jaminan Terhad ini terpakai kepada produk marin tiup jenama baru Paddle Board Overstock yang dibeli terus dari Paddle Board Overstock atau daripada pengedar atau peruncit Paddle Board Overstock yang sah. Tarikh efektif adalah tarikh yang boleh disahkan bagi pembelian runcit asal.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Liputan & Tempoh Jaminan</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Integriti fabrik tiub utama (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Integriti struktur lambung fiberglass</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Keupayaan penyimpanan udara pada jahitan tiub tiup</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Fungsi injap inflasi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Aksesori dan pemasangan tambahan di kilang</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Tahun*</h3>
        <p class="text-sm text-gray-600 mt-1">Penggunaan komersial, sewaan, atau armada — semua komponen</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Penggunaan komersial, kerajaan, sewaan, atau pengajaran mengurangkan jaminan kepada 1 tahun. Penggunaan perlumbaan atau pertandingan membatalkan jaminan sepenuhnya.</p>
  </div>

  <h2>Apa yang Dilindungi</h2>
  <h3>Fabrik Tiub Utama (5 Tahun)</h3>
  <p>Paddle Board Overstock menjamin fabrik tiub utama terhadap kemerosotan porositi yang secara signifikan menjejaskan kemampuan produk untuk mengekalkan inflasi beroperasi. Ini terpakai kepada CSM (Hypalon) fabrik bersalut dan semua bahan fabrik tiub lain yang digunakan dalam pembuatan.</p>

  <h3>Integriti Struktur Lambung Fiberglass (5 Tahun)</h3>
  <p>Untuk produk dengan lambung plastik bertetulang fiberglass (FRP), struktur komposit asas dijamin terhadap kegagalan struktur akibat kecacatan bahan atau kerja.</p>

  <h3>Keupayaan Penyimpanan Udara Jahitan Tiub Tiup (5 Tahun)</h3>
  <p>Jahitan tiub tiup, di mana digabungkan semasa pembuatan, dijamin terhadap kecacatan pengilangan yang menyebabkan kebocoran udara ketara melalui jahitan. Pemeriksaan berkala dan penyelenggaraan tekanan inflasi yang sesuai adalah syarat liputan.</p>

  <h3>Fungsi Injap Inflasi (5 Tahun)</h3>
  <p>Injap inflasi udara yang dipasang asal oleh Paddle Board Overstock dijamin terhadap kecacatan pengilangan dalam bahan atau kerja yang menghalang injap mengekalkan udara seperti yang direka.</p>

  <h3>Aksesori Pemasangan Kilang (1 Tahun)</h3>
  <p>Komponen dan pemasangan yang dihasilkan oleh Paddle Board Overstock dan dipasang asal di kilang dijamin terhadap kecacatan bahan dan kerja selama satu tahun. Ini tidak termasuk barangan pihak ketiga, yang hanya dilindungi oleh jaminan pengilang masing-masing.</p>

  <h2>Apa yang Tidak Dilindungi</h2>
  <ul>
    <li>Kecacatan kosmetik termasuk perubahan warna, kotoran, pudar, pengapur, atau sebarang perubahan penampilan</li>
    <li>Tusukan, potongan, koyakan, robekan, atau kerosakan fizikal lain</li>
    <li>Retakan halus, rekahan, haus, calar, atau kemerosotan akibat geseran atau sentuhan</li>
    <li>Kemerosotan akibat pendedahan cahaya UV, hakisan, atau keadaan atmosfera</li>
    <li>Kerosakan daripada sentuhan dengan bahan api, pelarut, asid, alkali, atau bahan kimia</li>
    <li>Kerosakan akibat kecuaian, penggunaan yang tidak betul, penyalahgunaan, kemalangan, atau kehausan normal</li>
    <li>Masalah permukaan lapisan gel atau cat (gelembung, retak halus, perubahan warna, pudar)</li>
    <li>Kerosakan akibat hentakan, tekanan, sokongan yang tidak betul, atau pengangkutan menggunakan treler</li>
    <li>Kerosakan akibat inflasi/deflasi yang tidak betul atau penggunaan peranti inflasi yang tidak diluluskan</li>
    <li>Peralatan, komponen, atau sistem pihak ketiga (dilindungi oleh pengeluar masing-masing)</li>
  </ul>

  <h2>Kewajiban & Remedy Pengilang</h2>
  <p>Kewajipan tunggal dan eksklusif Paddle Board Overstock adalah pembaikan atau penggantian, mengikut pilihan Paddle Board Overstock, bagi mana-mana komponen yang ditentukan mempunyai kecacatan dari segi bahan atau kerja dan dilindungi di bawah jaminan ini. Pembaikan atau penggantian dilakukan oleh Paddle Board Overstock atau fasiliti perkhidmatan bertauliah yang ditentukan olehnya. Komponen yang dibaiki atau diganti dijamin hanya untuk baki tempoh jaminan asal yang belum tamat.</p>

  <h2>Syarat-syarat Waranti</h2>
  <ul>
    <li><strong>Pendaftaran:</strong>Produk mesti didaftarkan dengan betul seperti yang dikehendaki dalam terma jaminan.</li>
    <li><strong>Penyelenggaraan:</strong>Produk mesti dijaga mengikut garis panduan yang diterbitkan oleh Paddle Board Overstock, termasuk pemeriksaan berkala dan penyelenggaraan tekanan angin yang sesuai.</li>
    <li><strong>Kerjasama:</strong>Pembeli mesti bekerjasama sepenuhnya dan dengan segera dengan Paddle Board Overstock dalam semua perkara yang berkaitan dengan tuntutan waranti.</li>
    <li><strong>Pembeli Asal:</strong>Jaminan ini diberikan secara eksklusif kepada pembeli asal pengguna akhir dan tidak boleh dipindah milik.</li>
  </ul>

  <h2>Kegunaan Komersial</h2>
  <p>Jika produk digunakan untuk tujuan komersial, kerajaan, bukan untung, piagam, sewaan, pengajaran, atau apa-apa tujuan selain daripada penggunaan rekreasi peribadi, tempoh jaminan untuk semua komponen dikurangkan kepada satu (1) tahun dari tarikh pembelian runcit asal. Penggunaan dalam perlumbaan, kelajuan atau pertandingan ketahanan serta-merta dan secara tidak boleh dipulihkan membatalkan jaminan sepenuhnya.</p>

  <h2>Cara Membuat Tuntutan Waranti</h2>
  <p>Hubungi Paddle Board Overstock atau pengedar sah anda dengan bukti pembelian dan penerangan terperinci mengenai masalah tersebut. Paddle Board Overstock akan menilai tuntutan tersebut dan memberikan arahan untuk pemeriksaan dan perkhidmatan.</p>
  <p>Untuk pertanyaan perkhidmatan jaminan, sila hubungi kami melalui<a href="/contact" class="text-sky-600 underline">halaman hubungan</a>dengan nombor pesanan dan maklumat produk anda.</p>

  <h2>Barangan Pihak Ketiga</h2>
  <p>Peralatan, komponen, atau sistem yang dihasilkan oleh pihak ketiga (walaupun dipasang oleh Paddle Board Overstock) dilindungi secara eksklusif oleh sebarang jaminan yang ditawarkan oleh pengilang masing-masing. Paddle Board Overstock dengan jelas menafikan sebarang tanggungjawab jaminan untuk item pihak ketiga tersebut.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Pernyataan waranti ini adalah ringkasan kepada Paddle Board Overstock Waranti Terhad Pengilang yang lengkap. Dokumen waranti undang-undang penuh mengawal semua terma dan syarat waranti. Spesifikasi tertakluk kepada perubahan tanpa notis. Paddle Board Overstock adalah jenama kilang Paddle Board Overstock Pusat Pembuatan Qingdao.
  </p>
