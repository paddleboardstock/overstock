content_challenge:
  tagline: Cabaran
  title: Keperluan Akuakultur<br />Peralatan Tahan Air Masin
  subtitle: Kilang ikan, ladang mutiara, dan ladang laut beroperasi dalam persekitaran marin yang paling agresif secara kimia — pendedahan panjang kepada air masin, sisa bahan bakar dan makanan, serta penggunaan harian berterusan.
  paragraphs:
    - Operasi akuakultur dijalankan 365 hari setahun di persekitaran pesisir dan luar pesisir yang terdedah. Bot kerja yang digunakan untuk pemeriksaan sangkar, pengangkutan makanan, penyelenggaraan tali mutiara, dan perkhidmatan peralatan menghadapi rendaman air masin yang berterusan, UV pendedahan, dan kontak kimia daripada bahan bakar, makanan ikan, dan rawatan anti-lumut.
    - '**Kakisisan adalah musuh utama** — Peralatan marin standard cepat rosak dalam keadaan ini. Enjin luar papan, rangka treler, dan kelengkapan perahu memerlukan penggantian berterusan. Pengendali memerlukan bot yang diperbuat daripada bahan kalis kakisan yang boleh bertahan bertahun-tahun dalam persekitaran ini tanpa merosot.'
    - '**Kebolehpercayaan harian adalah kritikal** — Bot kerja yang rosak bermakna jadual pemberian makanan terlepas, tuaian tertunda, dan kerugian pengeluaran yang mahal. Untuk ladang mutiara, satu hari terlepas pemeriksaan boleh menyebabkan kerosakan tanaman yang signifikan. Untuk ladang ikan, kelewatan pemberian makanan menjejaskan kadar pertumbuhan dan keuntungan.'
    - Aquafarer akuakultur RIBs direka dengan perkakasan kalis kakisan, tiub berat-duty Hypalon, dan lambung diperkuat yang direka khusus untuk kondisi menuntut operasi penternakan ikan, penanaman mutiara, dan ladang laut.
content_solution:
  tagline: Penyelesaian Kami
  title: Dibina Khusus RIBs<br />Untuk Industri Akuakultur
  subtitle: Setiap Aquafarer bot kerja akuakultur direka untuk menahan persekitaran air masin yang agresif sambil memberikan prestasi harian yang boleh dipercayai.
  list:
    - Tiub gred marin — rintangan unggul terhadap UV, air masin, bahan bakar, dan bahan kimia makanan ikan
    - Perkakasan keluli tahan karat 316 sepanjang — tiada karat dalam pendedahan air masin yang panjang
    - Strake gosok dan pelindung lunas diperkuat untuk sentuhan dok dan sangkar berulang
    - Dek salur sendiri untuk pencucian dan saliran mudah setelah operasi pengangkutan makanan dan tuaian
    - Konfigurasi dek rata untuk membawa beg makanan, bak hasil tuaian, dan peralatan
    - Konfigurasi luar papan daripada 15 HP hingga 60 HP — dioptimumkan untuk muatan berbanding kecekapan bahan api
    - Pilihan warna tiub berkelihatan tinggi untuk mudah dikesan di kawasan ladang besar
content_segments:
  tagline: Profil Akuakultur
  title: Penyelesaian Bot Kerja<br />Mengikut Jenis Akuakultur
  subtitle: Operasi akuakultur yang berbeza mempunyai keperluan bot kerja yang berbeza — daripada RIBs kecil yang lincah untuk pemeriksaan sangkar ikan kepada platform pengangkutan stabil untuk penternakan mutiara dan bot kerja berat untuk penternakan lautan.
  items:
    - title: Operasi Penternakan Ikan
      subtitle: Pemeriksaan sangkar, pengangkutan makanan, sokongan hasil tuaian
      description: Ladang ikan laut mengendalikan sangkar di lokasi pesisir dan luar pesisir yang terbuka. Bot kerja digunakan setiap hari untuk pemeriksaan jaring sangkar, operasi pemberian makanan, sokongan hasil tuaian, dan penyelenggaraan peralatan. Cabaran utama ialah hakisan — bot sentiasa terdedah kepada air masin, sisa makanan ikan, dan bahan api. Bot kerja yang boleh dipercayai adalah penting kerana waktu pemberian makanan yang terlepas atau hasil tuaian yang tertunda secara langsung menjejaskan keluaran pengeluaran dan keuntungan.
      features:
        - 'Pakej persekitaran agresif: perkakasan keluli tahan karat 316, komponen aloi gred marin'
        - Tata letak dek rata untuk pengangkutan beg makanan dan bak hasil tuaian
        - Dek membuang air sendiri untuk mudah dibersihkan selepas operasi
        - Tiub Hypalon dengan salutan tahan kimia untuk terdedah kepada makanan dan bahan api
        - Tali pemukul diperkuat untuk sentuhan kerap dengan sangkar dan dermaga
    - title: Operasi Penternakan Mutiara
      subtitle: Pengangkutan stabil untuk pemeriksaan larik mutiara dan hasil tuaian
      description: Ladang mutiara memerlukan bot kerja yang stabil dan boleh dipercayai untuk pengangkutan harian antara larik mutiara, pemeriksaan jaring kerang, dan pengumpulan hasil. Operasi ini dijalankan di lokasi pesisir terpencil dengan infrastruktur penyelenggaraan yang terhad. Bot mesti cukup stabil untuk kru bekerja semasa memeriksa larik mutiara, dengan kemudahan menaiki yang mudah dan dek luas untuk membawa kerang hasil tuaian, jaring, dan bekalan. Kebolehpercayaan dan penyelenggaraan mudah adalah kritikal di lokasi ladang terpencil.
      features:
        - Reka bentuk hull stabil untuk kru berdiri semasa pemeriksaan larik mutiara
        - Dek rata dengan permukaan anti-gelincir untuk pergerakan kru yang selamat
        - Bording rendah untuk akses mudah jaring kerang dan hasil tuaian
        - Konfigurasi luar papan yang mudah untuk penyelenggaraan di lokasi
        - Pakej tiub dan perkakasan tahan hakisan untuk pendedahan berterusan kepada air masin
    - title: Penternakan Laut & Peningkatan Marin
      subtitle: Pengangkutan juvenil, servis sangkar, sokongan pemantauan
      description: Operasi penternakan laut melibatkan pelepasan stok juvenil ke dalam persekitaran marin yang dikawal, pemantauan pertumbuhan, dan penyelenggaraan struktur peningkatan. Bot kerja perlu mengangkut stok juvenil hidup dalam bekas berudara, membawa peralatan pemantauan, dan mengakses tapak pelepasan pesisir cetek. Reka bentuk hull mesti menyeimbangkan kapasiti pengangkutan dengan draf cetek untuk akses pantai dan muara.
      features:
        - Ruang dek untuk bekas pengangkutan juvenil berudara dan peralatan pemantauan
        - Draf cetek untuk akses tapak pelepasan pantai dan muara
        - Pendaratan pantai mudah — lunas dan pelindung bujur diperkuat
        - Titik pemasangan peralatan untuk elektronik pemantauan dan peralatan sampel
        - Tiub Hypalon berat untuk ketahanan dalam keadaan pasir campur dan air laut
