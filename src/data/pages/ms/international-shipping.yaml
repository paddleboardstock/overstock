hero:
  tagline: Penghantaran Antarabangsa
  title: Penghantaran Antarabangsa —<br />Kargo Ekspres & Laut ke 50+ Negara
  subtitle: Setiap pesanan dihantar dari pangkalan logistik kami di Weihai, China. Pilih kargo udara ekspres untuk sampel dan stok segera, atau kargo laut terkonsolidasi untuk pesanan borong perniagaan kecil.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP papan yang dibungkus untuk penghantaran antarabangsa
direct_answer: Paddle Board Overstock dihantar ke lebih daripada 50 negara dari Weihai, China. Kargo udara ekspres membawa 1–3 papan, pesanan sampel, dan stok semula segera; kargo laut konsolidasi adalah pilihan ekonomik untuk pesanan borong 5–20 papan. Setiap penghantaran termasuk penjejakan dari pintu ke pintu, dan setiap papan diuji tekanan 100% serta dibungkus dengan kit aksesori penuh sebelum penghantaran.
tldr_points:
  - 'Kargo udara ekspres: 1–3 papan, sampel, stok semula segera — pilihan terpantas'
  - 'Penghantaran laut: pesanan borong 5–20 papan — kos penghantaran per papan terendah'
  - Penjejakan dari pintu ke pintu untuk setiap penghantaran ke 50+ negara
  - Duti penghantaran, insurans, pelepasan kastam, dan import disenaraikan dalam sebut harga anda — tiada janji yang samar
from_china:
  tagline: Penghantaran dari China
  title: Dari mana pesanan dihantar
  description: Semua pesanan dihantar dari pangkalan logistik kami di Weihai, China — nadi operasi pengeluaran dan pergudangan kami. Weihai ialah bandar pelabuhan pesisir utama di wilayah Shandong dengan sambungan kargo laut dan udara secara langsung, yang memastikan masa transit dan kos kargo sentiasa kompetitif ke destinasi di Asia, Amerika, Afrika, Eropah, dan Timur Tengah.
modes_section:
  tagline: Dua Pilihan
  title: Penghantaran Ekspres atau Kargo Laut
  subtitle: Kaedah penghantaran yang betul bergantung pada seberapa pantas anda memerlukan papan dan berapa banyak yang anda pesan. Kedua-dua pilihan akan diberikan setiap pertanyaan.
  express:
    name: Pilihan A — Penghantaran Ekspres
    best_for: Terbaik untuk 1–3 papan, sampel, dan stok semula segera
    description: Air Express akan menerima pesanan kecil dan papan sampel ke pintu anda dalam beberapa hari, bukan minggu. Sesuai apabila anda menguji model sebelum pesanan yang lebih besar, atau mengisi semula produk terlaris pada pertengahan musim.
    features:
      - 1–3 papan, model tunggal, atau sampel model campuran
      - Transit terpantas antara dua pilihan — sebut harga mengikut destinasi
      - Penjejakan dari pintu ke pintu dengan pengangkut ekspres utama
      - 'Penggunaan biasa: sampel, stok semula segera, pesanan pertama kecil'
  sea:
    name: Pilihan B — Kargo Laut
    best_for: Terbaik untuk pesanan borong dan peruncit 5–20 papan
    description: Kargo laut terkonsolidasi adalah pilihan ekonomik untuk pesanan borong perniagaan kecil. Papan dibungkus bersama dalam satu penghantaran terkonsolidasi dari Weihai, menjadikan kos kargo per papan rendah.
    features:
      - 5–20 pesanan peruncit papan dan borong
      - Kos penghantaran per papan terendah antara kedua-dua pilihan
      - Pembungkusan terkonsolidasi — satu penghantaran, satu pelepasan
      - 'Penggunaan tipikal: stok semula bermusim, pesanan borong model campuran'
