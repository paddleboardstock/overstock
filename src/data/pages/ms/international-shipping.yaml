process_section:
  tagline: Bagaimana Penghantaran Berfungsi
  title: Dari Gudang Kami ke Pintu Anda
  steps:
    - title: Sebut harga dengan pilihan penghantaran
      description: Setiap sebut harga menyenaraikan pilihan kargo untuk destinasi anda — ekspres dan laut — dengan anggaran masa transit, jadi tiada apa yang diputuskan untuk anda.
    - title: Pemeriksaan Kualiti dan Pek
      description: Papan diuji tekanan 100%, kemudian dibungkus dengan pam, dayung, tali, sirip, beg galas, dan kit pembaikan — pakej lengkap yang sama yang kami jual.
    - title: Penghantaran dari Weihai
      description: Penghantaran anda meninggalkan pangkalan logistik kami dengan kaedah penghantaran yang anda pilih dan penjejakan dari pintu ke pintu dikongsi dengan anda pada hari yang sama.
    - title: pelepasan kastam
      description: Kami menyediakan invois komersial dan senarai pembungkusan yang anda perlukan untuk import. Duti import dan cukai di negara anda adalah tanggungjawab pengimport — lihat bahagian kastam di bawah.
    - title: Penghantaran dan Pemeriksaan
      description: Periksa penghantaran anda semasa ketibaan. Jika ada apa-apa yang rosak atau hilang, hubungi kami dengan gambar dan nombor pesanan anda — lihat polisi hilang dan rosak kami di bawah.
customs_section:
  tagline: Kastam & Duti
  title: Duti kastam dan cukai import
  subtitle: Kami mengekalkan tanggungjawab pengangkutan secara jelas dan bukannya membuat janji samar. Ini adalah siapa yang bertanggungjawab untuk apa.
  items:
    - title: Apa yang Kami Terangkan
      description: Sebut harga anda termasuk kos penghantaran ke destinasi anda, dan kami menyediakan serta menyediakan semua dokumen eksport — invois komersial, senarai pembungkusan, dan penjejakan penghantaran.
    - title: Apa yang Diliputi oleh Pengimport
      description: Duti import, VAT/GST, dan sebarang cukai negara destinasi perlu dibayar oleh pengimport (anda atau perniagaan anda) mengikut peraturan negara anda. Kami tidak menggabungkan janji cukai yang samar ke dalam sebut harga pengangkutan kami.
    - title: Sokongan Pelepasan Kastam
      description: Dokumen kami lengkap dan konsisten — kod HS yang betul, nilai yang diisytiharkan, dan spesifikasi papan — yang memastikan proses pelepasan berjalan lancar. Jika broker atau pejabat kastam anda memerlukan dokumentasi tambahan, kami akan menyediakannya.
    - title: Semak kadar tempatan anda sebelum membuat pesanan
      description: Kadar duti ke atas peralatan sukan air boleh tiup berbeza mengikut negara. Semak peraturan import negara anda atau tanya dalam pertanyaan anda — panduan pasaran serantau kami termasuk nota kastam untuk pasaran utama.
lost_damaged:
  title: Penghantaran Hilang atau Rosak
  description: Periksa penghantaran anda apabila ia tiba. Dalam kes jarang papan tiba dalam keadaan rosak atau bungkusan hilang, hubungi kami secepat mungkin dengan nombor pesanan anda dan gambar jelas pembungkusan serta papan. Kami menilai setiap kes secara individu — bergantung pada kes, itu bermakna alat ganti, papan gantian, atau bayaran balik untuk item yang terjejas. Kecacatan pembuatan dilindungi secara berasingan oleh SUP Jaminan 2 Tahun kami.
destinations_section:
  tagline: Tempat Kami Menghantar
  title: 50+ Negara dan Semakin Bertambah
  description: Kami menghantar ke seluruh dunia, dengan panduan terperinci untuk pasaran serantau utama kami. Setiap panduan pasaran merangkumi jenis pelanggan tempatan, nota penghantaran, dan petua kastam untuk wilayah tersebut.
  regions_label: Panduan Serantau
  countries_label: Panduan Negara
faq_section:
  title: Soalan Lazim Penghantaran
  items:
    - q: Berapa lama masa penghantaran ekspres diambil?
      a: Masa transit ekspres bergantung kepada destinasi — kami akan menyebut anggaran masa transit untuk negara anda dengan setiap pertanyaan, sebelum anda membuat sebarang komitmen.
    - q: Berapa lama masa yang diambil untuk kargo laut?
      a: Transit kargo laut berbeza mengikut pelabuhan destinasi dan jadual pelayaran. Kami memberikan anggaran jangka waktu untuk destinasi anda bersama pesanan anda, dan anda akan menerima penjejakan selepas penghantaran berlepas.
    - q: Kaedah penghantaran mana yang patut saya pilih?
      a: Ekspres untuk 1–3 papan, sampel, atau stok semula segera. Kargo laut untuk pesanan borong 5–20 papan di mana kos per papan lebih penting daripada kelajuan. Kami sebut harga kedua-duanya supaya anda boleh membandingkan.
    - q: Adakah duti import dan cukai termasuk dalam kos penghantaran?
      a: Tidak. Penghantaran akan dinyatakan secara berasingan dan duti import, VAT/GST, serta cukai destinasi adalah tanggungjawab pengimport mengikut peraturan negara anda. Kami menyediakan dokumen yang lengkap dan tepat untuk memastikan proses pelepasan berjalan lancar.
    - q: Adakah anda menghantar ke negara saya?
      a: Kami menghantar ke 50+ negara. Semak panduan serantau dan negara kami di bawah, atau hanya tanya dalam pertanyaan anda — kami akan mengesahkan perkhidmatan semasa ke alamat anda.
    - q: Bolehkah saya jejak pesanan saya?
      a: Ya. Setiap penghantaran — ekspres atau laut — termasuk penjejakan dari pintu ke pintu yang kami kongsikan dengan anda pada hari penghantaran.
