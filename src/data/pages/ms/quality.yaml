tests:
  - title: ujian tekanan
    standard: ISO 6185-1 | Spesifikasi Dalaman AF-PT-001
    description: Ruang kembung ditekan sehingga 1.25x daripada had operasi yang disyorkan dan disimpan selama 30 minit. Pereputan tekanan diukur untuk mengesahkan ketahanan udara dan integriti struktur bahan dan sambungan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Ujian Impak
    standard: Spesifikasi Dalaman AF-IT-002
    description: Produk terdedah kepada impak terkawal daripada pemberat jatuh standard dan alat pendulum. Ini menilai ketahanan tusukan, penyebaran koyakan, dan ketahanan struktur terhadap perlanggaran dengan halangan, dok, dan serpihan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Ujian Rintangan
    standard: ASTM G154 |ISO 4892-3
    description: Sampel bahan didedahkan kepada lampu UVA-340 dalam ruang pelapukan dipercepat selama 1,000+ jam. Kami mengukur perubahan warna (Delta E), pengekalan kilauan, dan kehilangan kekuatan tegangan untuk mengesahkan UV pakej penstabil.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Ujian Ketahanan Lelasan
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Sampel bahan dikenakan roda abrasif CS-10 di bawah beban 500g/1,000g selama 1,000 kitaran. Kehilangan jisim dan penggredan kehausan visual menentukan ketahanan salutan terhadap pasir, kerikil, dan pelancaran berulang.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Ujian Prestasi Suhu Rendah
    standard: Spesifikasi Dalaman AF-LT-003 | MIL-STD-810G
    description: Produk dan kupon bahan yang dipasang dikondisikan pada -20°C, -10°C, dan 0°C selama 24 jam kemudian diuji secara fleksibel. Kami mengesahkan perkara PVC ini dan Hypalon kekal fleksibel tanpa retak atau delaminasi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Ujian Daya Apungan & Kapasiti Beban
    standard: ISO 6185-1 |ISO 12402
    description: Produk dimuatkan secara berperingkat kepada kapasiti penarafan 1.25x dalam kolam terkawal. Freeboard, kestabilan, dan prestasi saliran sendiri direkodkan. Kapasiti penarafan setiap model disahkan secara matematik dan empirikal.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Ujian Kebolehan Manuver
    standard: Spesifikasi Dalaman AF-MT-004
    description: Ujian di atas air mengukur jejari pusingan, pecutan, masa perancangan, dan tindak balas dayung/motor merentasi pelbagai keadaan beban. Ciri-ciri pengendalian dunia sebenar disahkan berdasarkan sasaran reka bentuk.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Ujian Kalis Air
    standard: ISO 6185-1 §7.3 | Spesifikasi Dalaman AF-WT-005
    description: Setiap produk yang dipasang diuji dengan semburan pada 0.5 bar pada semua sambungan, injap, dan kelengkapan. Ujian rendaman bertekanan selama 5 minit mengesahkan kalis air ruang dan injap. Standard tanpa kebocoran sebelum penghantaran.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: Prosedur Ujian
  title: Ujian ketat di setiap peringkat
commitment:
  title: Komitmen Kami
  body: Melalui prosedur ujian yang ketat ini, {SITE} memberikan jaminan kepada pelanggan bahawa bot kembung SUPs dan bot kami bukan sahaja berprestasi tinggi tetapi juga dibina untuk tahan lama — memastikan pelbagai pengembaraan yang menyeronokkan dan selamat di atas air. Makmal kualiti kami beroperasi secara bebas daripada pengeluaran dan melapor terus kepada pengurusan.
  cta: Minta dokumentasi ujian
  cta_link: /contact
