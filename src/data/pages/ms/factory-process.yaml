intro: Tidak seperti jenama yang mengalih keluar pengeluaran kepada kilang pihak ketiga, Paddle Board Overstock mereka memiliki dan mengendalikan keseluruhan rantaian pembuatannya. Integrasi menegak ini membolehkan kami mengekalkan kawalan kualiti yang ketat di setiap peringkat, bertindak balas dengan pantas kepada keperluan tersuai, dan menghasilkan kualiti produk yang konsisten secara batch demi batch. Beginilah cara sebuah bot dibina di fasiliti kami.
steps:
  - step: '01'
    title: Penerimaan & Pemeriksaan Bahan
    description: Setiap kumpulan PVC fabrik, tikar gentian kaca, resin, dan perkakasan yang masuk akan diperiksa mengikut spesifikasi. Sampel fabrik diuji untuk kekuatan tegangan, ketebalan yang seragam, dan UV ketahanan sebelum dilepaskan ke pengeluaran. Bahan yang tidak mematuhi akan dikuarantin dan dikembalikan.
    duration: 1–2 hari
  - step: '02'
    title: PVC Pemotongan Automatik
    description: Fabrik yang diluluskan diletakkan pada CNC mesin pemotong automatik dan dipotong dengan ketepatan sub-milimeter. Nesting yang dioptimumkan komputer menyusun panel untuk meminimumkan pembaziran — biasanya di bawah 5%. Panel yang dipotong dilabel mengikut model bot dan ruang pemotongan, kemudian dibundel untuk dipindahkan ke bengkel kimpalan.
    duration: 2–4 jam setiap kit bot
  - step: '03'
    title: Tiub Pengedap Haba & Kimpalan
    description: Panel dipasang dan diikat menggunakan mesin pengedap haba dengan kimpalan udara panas pada suhu terkawal 200–600 °C. Jahitan utama diperkuat dengan kimpalan dielektrik RF untuk sambungan kedap udara dan kekuatan tinggi. Ruang yang siap dikembangkan kepada tekanan kerja 1.25× untuk pengesahan penahanan udara selama 30 minit.
    duration: 1–2 hari setiap bot
  - step: '04'
    title: RIB Acuan Badan Gentian Kaca
    description: RIB Badan bot dihasilkan menggunakan acuan gentian kaca yang diletakkan secara tangan. Lapisan tikar gentian kaca dan roving tenunan digulung tangan dengan resin poliester atau vinilester dalam acuan ketepatan. Setiap lapisan dibungkus vakum untuk kualiti laminat yang konsisten. Badan kapal disiapkan dengan gelcoat untuk permukaan marin yang berkilat tinggi dan UVtahan lasak.
    duration: 2–4 hari setiap badan kapal
  - step: '05'
    title: SUP Percetakan & Hiasan
    description: SUP Grafik dek papan digunakan menggunakan cetakan digital untuk reka bentuk foto berwarna penuh, dan cetakan skrin untuk logo tahan lama dan corak berulang. Cetakan dikeringkan dan disegel untuk UV ketahanan terhadap lecet.
    duration: 1–2 hari
  - step: '06'
    title: Pemasangan Akhir & Rigging
    description: Badan gentian kaca dan PVC pemasangan tiub dipasangkan di barisan pemasangan. Enjin dipasang, kawalan stereng dan pendikit disambungkan, sistem bahan api dipasang, dan abah-abah elektrik penuh disambungkan. Setiap bot mengikuti senarai semak pemasangan 100 mata dengan pengesahan wajib pada setiap peringkat.
    duration: 2–3 hari
  - step: '07'
    title: Ujian & Pemeriksaan Kualiti
    description: 'Setiap bot yang siap menjalani pintu kualiti wajib: ujian penahanan udara ruang, pemeriksaan fungsi sistem, pengesahan tork pengikat, dan pemeriksaan kosmetik. Binaan khas dan prototaip juga menerima ujian laut dalam air yang merangkumi kelajuan, pengendalian, kestabilan, dan ketahanan.'
    duration: 1–2 hari
  - step: '08'
    title: Pembungkusan & Penghantaran
    description: Bot dikempiskan, dilipat mengikut prosedur, dibungkus dalam beg tenunan berat atau peti papan lapis, dan dimuatkan untuk penghantaran. Setiap bungkusan dilabel dengan model, nombor siri, dan destinasi. Kami berkoordinasi dengan penghantaran kontena FCL dan LCL di seluruh dunia.
    duration: 1 hari
