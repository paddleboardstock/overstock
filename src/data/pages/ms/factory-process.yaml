  tagline: Proses
  title: proses pembuatan
  subtitle: Daripada bahan mentah hingga papan sedia laut — setiap langkah di bawah kawalan kami
  back_label: Kembali ke Kilang
  back_link: /factory
intro: Berbeza dengan jenama yang mengalih keluar pengeluaran kepada kilang pihak ketiga, Paddle Board Overstock mereka memiliki dan mengendalikan keseluruhan rantaian pembuatannya. Integrasi menegak ini membolehkan kami mengekalkan kawalan kualiti yang ketat di setiap peringkat dan menghasilkan kualiti produk yang konsisten demi batch. Beginilah cara papan dibina di fasiliti kami.
steps:
  - step: '01'
    title: Penerimaan & Pemeriksaan Bahan
    description: Setiap kumpulan PVC fabrik, drop-stitch teras, EVA buih, dan perkakasan yang masuk akan diperiksa mengikut spesifikasi. Sampel fabrik diuji untuk kekuatan tegangan, ketebalan, keseragaman, dan UV ketahanan sebelum dilepaskan ke pengeluaran. Bahan yang tidak mematuhi akan dikuarantin dan dikembalikan.
    duration: 1–2 hari
  - step: '02'
    title: PVC Pemotongan Automatik
    description: Fabrik yang diluluskan diletakkan pada CNC mesin pemotong automatik dan dipotong dengan ketepatan sub-milimeter. Nesting yang dioptimumkan komputer menyusun panel untuk meminimumkan pembaziran — biasanya di bawah 5%. Panel yang dipotong dilabel mengikut model papan dan ruang, kemudian dibundel untuk dipindahkan ke bengkel kimpalan.
    duration: 2–4 jam setiap set papan
  - step: '03'
    title: Tiub Pengedap Haba & Kimpalan
    description: Panel dipasang dan diikat menggunakan mesin pengedap haba dengan kimpalan udara panas pada suhu terkawal 200–600 °C. Jahitan utama diperkuat dengan kimpalan dielektrik RF untuk sambungan kedap udara dan kekuatan tinggi. Ruang yang siap dikembangkan kepada tekanan kerja 1.25× untuk pengesahan penahanan udara selama 30 minit.
    duration: 1–2 hari setiap papan
  - step: '04'
    title: Seni Dek & EVA Penamat
    description: 'Dek siri seni terbentuk di sini: panel buih yang dipotong dengan tepat EVA disusun menjadi corak dek penuh, diikat, dan dipotong secara manual. Cengkaman, selesa, dan tahan lama — penampilan tanda tangan setiap papan siri seni.'
    duration: 1–2 hari
  - step: '05'
    title: SUP Percetakan & Hiasan
    description: SUP Grafik dek papan digunakan menggunakan cetakan digital untuk reka bentuk foto berwarna penuh, dan cetakan skrin untuk logo tahan lama dan corak berulang. Cetakan dikeringkan dan disegel untuk UV ketahanan terhadap lecet.
    duration: 1–2 hari
  - step: '06'
    title: Pemasangan Akhir & Rigging
    description: 'Papan menerima komponen akhir mereka: injap ditorsi dan diuji fungsi, cincin D, pemegang, dan kotak sirip dipasang, dan sambungan tali diikat. Setiap papan mengikuti senarai semak pemasangan 100 mata dengan pengesahan wajib pada setiap peringkat.'
    duration: 2–3 hari
  - step: '07'
    title: Ujian & Pemeriksaan Kualiti
    description: 'Setiap papan yang siap menjalani pintu kualiti wajib: ujian penahanan udara ruang, pemeriksaan fungsi sistem, pengesahan tork pengikat, dan pemeriksaan kosmetik. Binaan khas dan prototaip juga menerima ujian laut dalam air yang merangkumi kelajuan, pengendalian, kestabilan, dan ketahanan.'
    duration: 1–2 hari
  - step: '08'
    title: Pembungkusan & Penghantaran
    description: Papan akan dikempiskan, digulung, dan dibungkus dalam beg galas perjalanan dengan kit pam, dayung, sirip, tali leher, dan kit pembaikan, kemudian dibungkus untuk penghantaran kurier dan kargo. Setiap bungkusan dilabel dengan model, nombor siri, dan destinasi. Kami menghantar ke 50+ negara di seluruh dunia.
    duration: 1 hari
