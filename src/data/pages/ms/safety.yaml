testimonial:
  quote: Saya semak log ujian tekanan yang disertakan dengan papan saya dan emel sokongan dua soalan tentang inflasi dalam panas musim panas. Mereka menjawab dengan angka sebenar pada hari yang sama. Itu lebih banyak daripada apa yang pernah dilakukan oleh mana-mana kedai untuk saya.
  author: Sofia Marchetti
  title: Pembeli yang disahkan
  company: Pengayuh pantai
  location: Itali
content_overpressure:
  tagline: Keselamatan Tekanan
  title: Tekanan Papan<br />Pengurusan di Iklim Panas
  subtitle: Tekanan papan kembung meningkat dengan suhu. Memahami dan mengurus tekanan berlebihan melindungi papan anda dan memastikan setiap sesi selamat.
  items:
    - title: Mengapa Tekanan Meningkat
      description: Udara mengembang dengan haba. Papan yang dipompa ke 15 PSI pada 20°C boleh naik 1-2 PSI di bawah matahari 40°C — fizik yang sama yang membuatkan papan pagi yang sejuk terasa keras seperti batu menjelang tengah hari.
      icon: tabler:gauge
    - title: Tekanan Operasi Disyorkan
      description: Kembangkan kepada 12-15, PSI seperti yang dicetak berhampiran injap. Julat yang dinilai mengimbangi ketegaran, keselamatan, dan hayat jahitan — lebih banyak tidak lebih baik.
      icon: tabler:chart-bar
    - title: Amalan Terbaik Iklim Panas
      description: Kembangkan ke hujung bawah julat pada hari panas. Lepaskan sedikit udara sebelum terdedah kepada cahaya matahari yang lama dan jangan biarkan papan yang sudah kembung sepenuhnya terbakar di pantai.
      icon: tabler:sun
    - title: Pendedahan & Penyimpanan Matahari
      description: Simpan papan dalam keadaan teduh dan sebahagiannya kempis apabila tidak digunakan. Gunakan beg papan untuk UV perlindungan. Bilas dan keringkan sebelum digulung untuk penyimpanan.
      icon: tabler:umbrella
    - title: Jika papan terasa keras seperti batu
      description: Lepaskan udara melalui injap sehingga papan kembali ke julat yang dinilai. Bawa tolok pada pam anda untuk bacaan yang tepat — papan yang terlalu mengembang akan menekan jahitan tanpa perlu.
      icon: tabler:alert-circle
