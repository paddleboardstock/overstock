hero:
  tagline: Keselamatan
  title: Standard & Sijil Keselamatan
  subtitle: Setiap produk Aquafarer menjalani ujian yang ketat, dan 64 model bersertifikasi CE memenuhi standard keselamatan antarabangsa untuk kegunaan rekreasi dan profesional. Kilang ISO bersertifikasi 9001.
