content_overpressure:
  tagline: Pressure Safety
  title: Board Pressure<br />Management in Hot Climates
  subtitle: Inflatable board pressure increases with temperature. Understanding and managing overpressure protects your board and keeps every session safe.
  items:
    - title: Why Pressure Rises
      description: Air expands with heat. A board inflated to 15 PSI at 20°C can climb 1-2 PSI in 40°C sun — the same physics that makes a cool morning board feel rock-hard by noon.
      icon: tabler:gauge
    - title: Recommended Operating Pressure
      description: Inflate to 12-15 PSI, as printed near the valve. The rated range balances rigidity, safety, and seam life — more is not better.
      icon: tabler:chart-bar
    - title: Hot-Climate Best Practices
      description: Inflate to the lower end of the range on hot days. Release a little air before extended sun exposure and never leave a fully inflated board baking on the beach.
      icon: tabler:sun
    - title: Sun Exposure & Storage
      description: Store boards shaded and partially deflated when not in use. Use a board bag for UV protection. Rinse and dry before rolling for storage.
      icon: tabler:umbrella
    - title: If the Board Feels Rock-Hard
      description: Release air through the valve until the board returns to the rated range. Carry the gauge on your pump for accurate readings — an over-inflated board stresses seams unnecessarily.
      icon: tabler:alert-circle
