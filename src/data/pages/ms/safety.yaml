certifications:
  - title: CE Pensijilan (EU 2016/425)
    standard: Peraturan PPE (EU) 2016/425 | EN ISO 12402
    description: Semua peralatan keselamatan Aquafarer mematuhi kehendak penandaan CE di bawah Peraturan Peralatan Perlindungan Peribadi Eropah. Setiap produk diuji secara bebas oleh TÜV Rheinland, Badan Beritahu Eropah. Bot tiup kami dan RIBs mematuhi keperluan Arahan Kenderaan Rekreasi 2013/53/EU (RCD) Kategori C dan D.
    body: Pensijilan CE merangkumi keperluan kesihatan dan keselamatan asas untuk alat apungan peribadi dan kenderaan air tiup. TÜV Rheinland mengaudit kemudahan pengeluaran kami setiap tahun untuk mengesahkan pematuhan berterusan.
  - title: SOLAS — Keselamatan Hidup di Laut
    standard: SOLAS Bab III | Kod LSA
    description: Life Vest Pro mematuhi peraturan SOLAS untuk operasi marin lepas pantai dan komersial. Diuji untuk mengekalkan keapungan selama 24 jam, inflasi automatik apabila direndam, dan prestasi dalam keadaan laut sehingga Kekuatan 5. Memenuhi keperluan Bab III untuk jaket keselamatan di kapal komersial.
    body: Kelulusan SOLAS memerlukan ujian bebas oleh badan yang diberitahu untuk keapungan, kekuatan, kebolehlihatan, dan pengaktifan automatik. Life Vest Pro kami membawa kelulusan jenis penuh SOLAS dengan pensijilan MED.
  - title: USCG Jenis III / Jenis V
    standard: 46 CFR Bahagian 160 | Kelulusan USCG
    description: Jaket keselamatan pilihan Aquafarer memenuhi klasifikasi Pengawal Pantai Amerika Syarikat untuk Jenis III (bantuan apungan) dan Jenis V (penggunaan khas). Sesuai untuk perairan terlindung, pelayaran persisiran, dan operasi komersial yang memerlukan PFD bersertifikasi USCG.
    body: Kelulusan USCG memerlukan ujian oleh makmal bebas yang diiktiraf CG. Kelulusan Jenis V merangkumi reka bentuk hibrid tiup yang memerlukan pengaktifan manual atau automatik.
  - title: BSCI Pematuhan Sosial
    standard: Kod Tingkah Laku amfori BSCI
    description: Kilang kami diaudit setiap tahun di bawah Inisiatif Pematuhan Sosial Perniagaan amfori (BSCI). Ini mengesahkan amalan buruh yang beretika, keselamatan tempat kerja, waktu kerja yang adil, dan pengurusan alam sekitar di seluruh kemudahan pengeluaran kami seluas 12,000 m².
    body: Pematuhan BSCI adalah prasyarat untuk peruncit dan pengimport Eropah. Penarafan BSCI semasa kami adalah "C" (Baik), diaudit oleh SGS.
  - title: REACH & RoHS Pematuhan
    standard: Peraturan EU REACH (EC) 1907/2006 | RoHS Arahan 2011/65/EU
    description: Semua PVC sebatian, pelekat, dan salutan yang digunakan dalam Aquafarer produk mematuhi peraturan keselamatan kimia EU REACH dan sekatan bahan berbahaya RoHS. Lembaran data keselamatan bahan (MSDS) tersedia untuk setiap barisan produk.
    body: Pematuhan REACH memastikan tiada bahan SVHC yang terhad melebihi had ambang. Ujian makmal pihak ketiga secara berkala mengesahkan pematuhan berterusan untuk setiap kumpulan pengeluaran.
  - title: ISO 9001:2015 Pengurusan Kualiti
    standard: ISO 9001:2015 | TÜV Disahkan Rheinland
    description: Sistem pengurusan kualiti kami disahkan ISO 9001:2015 oleh TÜV Rheinland, merangkumi reka bentuk, pengeluaran, ujian, dan perkhidmatan selepas jualan. Audit pemantauan tahunan memastikan penambahbaikan berterusan dan kawalan proses.
    body: Sijil 9001 memerlukan polisi kualiti yang didokumentasikan, audit dalaman, ulasan pengurusan, prosedur tindakan pembetulan, dan rekod pengeluaran yang boleh dijejaki.
testimonial:
  quote: Kami telah mendapatkan peralatan keselamatan dari pelbagai pembekal di seluruh Asia. Aquafarer adalah satu-satunya pengeluar yang menyediakan seluruh dokumentasi CE, sijil SOLAS, dan laporan ujian pihak ketiga secara awal — tanpa diminta.
  author: Erik Lindström
  title: Pegawai Keselamatan
  company: Baltic Marine Supply
  location: Finland
content_overpressure:
  tagline: Keselamatan Tekanan Berlebihan
  title: RIB Tekanan Tiub<br />Pengurusan di Iklim Panas
  subtitle: Tekanan tiub tiup meningkat dengan suhu. Memahami dan mengurus tekanan berlebihan mencegah kerosakan dan memastikan operasi selamat di persekitaran tropika dan gurun.
  items:
    - title: Injap Pelepas Tekanan Boyle
      description: Aquafarer RIB tiub dilengkapi dengan injap pelepas tekanan berlebihan yang secara automatik melepaskan tekanan yang melebihi had maksimum. Mengelakkan tekanan pada jahitan dan potensi pecah tiub akibat pemanasan solar.
      icon: tabler:gauge
    - title: Perubahan Tekanan Dari Pagi ke Tengahari
      description: Tiub yang ditiup kepada 3.5 PSI pada 20C mungkin mencapai 4.5 + PSI apabila terdedah kepada matahari 40C. Sentiasa tiup pada hujung bawah julat yang disyorkan di iklim panas dan biarkan injap pelepas menguruskan tekanan berlebihan.
      icon: tabler:sun
    - title: Tekanan Operasi yang Disyorkan
      description: 'Tiub PVC: 3.0-3.5 PSI operasi, 4.5 PSI maksimum. Tiub Hypalon: 3.5-4.0 PSI operasi, 5.0 PSI maksimum. Sentiasa uji pada 1.25x nilai yang dinilai (4.4 PSI untuk PVC, 5.0 PSI untuk Hypalon) mengikut standard QC Aquafarer.'
      icon: tabler:chart-bar
    - title: Amalan Terbaik Terhadap Pendedahan Matahari
      description: Simpan RIBs di kawasan berteduh apabila tidak digunakan. Gunakan penutup pelindung UV untuk berlabuh dalam tempoh panjang. Periksa dan laraskan tekanan tiub sebelum dan selepas jam matahari puncak. Jangan melebihi tekanan maksimum.
      icon: tabler:umbrella
    - title: Depressurisasi Kecemasan
      description: Jika tiub terasa terlalu keras atau injap pelepas berfungsi, lepaskan udara melalui injap Halkey-Roberts atau ketenteraan sehingga tekanan kembali ke julat operasi. Bawa alat pengukur tekanan untuk bacaan yang tepat.
      icon: tabler:alert-circle
