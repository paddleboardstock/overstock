testimonial:
  content: Kami bermula dengan Pakej Permulaan Kelab untuk sekolah luncur kami di Portugal. 20 papan, dayung, vest — semuanya tiba dalam masa 3 minggu. Selepas dua musim, kami menaik taraf ke Pakej Pro. Penjenamaan khusus dengan logo kami mengubah permainan imej profesional kami.
  name: Ricardo Santos
  title: Pemilik, Akademi Luncur Algarve — Lagos, Portugal
content_segments:
  tagline: Profil Kelab
  title: Penyelesaian Kelab Sukan Air<br />Mengikut Jenis Kelab
  subtitle: Daripada kelab dayung universiti hingga kelab kapal layar persendirian eksklusif — setiap jenis kelab mempunyai keperluan peralatan yang unik, corak penggunaan, dan struktur bajet. Kami menyesuaikan setiap pakej mengikut model kelab.
  items:
    - title: Kelab Dayung Universiti & Kolej
      subtitle: Armada pelajar dengan penggunaan tinggi
      description: Kelab padel yang dijalankan oleh pelajar atau disokong oleh institusi yang mengendalikan SUP program untuk jabatan rekreasi universiti. Peralatan digunakan dengan kekerapan tinggi dan perolehan tinggi di pelbagai tahap kemahiran setiap semester. Ketahanan dan kemudahan pembaikan adalah kritikal, bersama dengan harga mesra bajet untuk organisasi pelajar.
      features:
        - PVC Pembinaan ekstra tahan lama yang dinilai untuk kitaran kegunaan pelajar
        - Papan berwarna mengikut tahap kemahiran untuk pengurusan armada yang mudah
        - Kit pembaikan + sokongan video panggilan disertakan dengan setiap pesanan
        - Harga diskaun organisasi pelajar dan terma pembayaran berdasarkan semester
    - title: Kelab Dayung & Sosial Komuniti
      subtitle: Kelab rekreasi berasaskan keahlian
      description: Kelab berasaskan komuniti yang menawarkan SUP dan pengalaman mendayung sosial kepada ahli. Peralatan perlu seimbang antara prestasi dan keselesaan untuk pelbagai peringkat umur, dengan penjenamaan yang mengukuhkan identiti kelab dan rasa bangga ahli. Kecekapan penyimpanan adalah penting bagi kelab yang beroperasi dari akses tepi air yang terhad.
      features:
        - 'Kapal campuran: SUPs serbaguna dan pelancongan'
        - 'Penjenamaan penuh kelab: warna tersuai, cetakan logo, PFD berjenama'
        - Penyelesaian penyimpanan kompak untuk peralatan tiup
        - 'Kit permulaan pertumbuhan keahlian: kad rujukan, fotografi berjenama'
    - title: Sekolah Surf & Akademi SUP
      subtitle: Prestasi dan latihan pesisiran pantai
      description: Sekolah yang menumpukan pada surf mengajar kemahiran meluncur SUP dan menunggang ombak. Peralatan mesti berprestasi dalam keadaan surf — mudah dikawal, responsif, dan cukup tahan lama untuk menahan kejatuhan berulang, geseran pasir, dan pendedahan air masin tanpa merosot dengan cepat.
      features:
        - Bentuk SUP lebih pendek dan lebih lebar dioptimumkan untuk kemudahan manuver dalam ombak
        - Konstruksi rel diperkuat untuk ketahanan terhadap hentaman di ombak
        - 'Peralatan keselamatan khusus surf: tali leashed bergelung, pilihan sirip lembut'
        - Program penggantian flot dengan diskaun tukar musim
    - title: Kelab Kapal Pesiar Korporat & Swasta
      subtitle: Pengalaman ahli premium
      description: Kelab eksklusif swasta menawarkan sukan air sebagai kemudahan premium untuk ahli. Standard peralatan adalah tinggi — estetik, keselarasan jenama, dan persembahan sedia tetamu sama pentingnya dengan prestasi. Jangkaan perkhidmatan termasuk penghantaran sarung tangan putih, penyelesaian penyimpanan tersuai, dan sokongan tahap concierge.
      features:
        - Papan dengan kemasan premium bertekstur kayu EVA dan aksen logam
        - Padanan warna tersuai mengikut garis panduan jenama kelab
        - 'Penghantaran concierge: pra-digelembungkan, disusun, dan dilabel untuk setiap musim'
        - Pengurusan akaun khusus dengan SLA tindak balas keutamaan
