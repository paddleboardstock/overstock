hero:
  tagline: Peralatan
  title: Peralatan & Mesin Pembuatan
  subtitle: Peralatan gred industri merangkumi pemotongan, pengelasan, percetakan, dan pemasangan
  back_label: Kembali ke Kilang
  back_link: /factory
categories:
  - title: Pemotongan & Persediaan Bahan
    items:
      - name: Mesin Pemotong Automatik PVC
        spec: Dikawal oleh CNC, 6.5 m × 2.5 m, ketepatan 0.1 mm
        desc: Mesin pemotongan automatik yang dikawal komputer untuk fabrik PVC dan drop-stitch. Perisian penempatan mengoptimumkan penggunaan bahan sehingga kurang daripada 5% sisa.
      - name: Penyebar Kain
        spec: Lebar maksima 3 m, pemberian dikawal ketegangan
        desc: Menyebarkan kain dalam satu atau beberapa lapisan dengan ketegangan terkawal untuk mengelakkan ubah bentuk sebelum pemotongan.
  - title: Pengelasan & Pengikatan
    items:
      - name: Mesin Pengedap Panas
        spec: Pengelasan udara panas, boleh ubah 200–600 °C, 0.5–5 m/min
        desc: Mesin pengelasan haba udara panas untuk mengikat dan mengimpal laminat PVC, jalur rel, dan jahitan ruang. Digunakan untuk menempel, mengelap, dan menyatukan sambungan teras drop-stitch.
      - name: Tekan RF Dielektrik
        spec: 15 kW, plat 2000 × 600 mm
        desc: Press pengelasan frekuensi radio untuk jahitan longitudinal utama, sambungan transom-ke-tiub, dan pembuatan ruang besar.
      - name: Pengelasan RF Dikawal CNC
        spec: 8 kW, meja XY 2500 × 1200 mm
        desc: Pengelasan jahitan melengkung boleh atur cara untuk geometri kompleks, emboss logo, dan kerja tampal yang tepat.
  - title: Seni & Penamat Dek
    items:
      - name: EVA Mesin Pemotong Dek
        spec: Pemotongan pisau CNC, lebar 2 m
        desc: Pemotongan tepat panel buih dek EVA untuk corak dek siri seni. Setiap panel dipotong mengikut bentuk untuk padanan penuh dek yang sempurna.
      - name: Press Laminasi Dek
        spec: Suasana & tekanan dikawal
        desc: Mengikat panel dek EVA ke permukaan papan dengan lekatan yang konsisten di seluruh kawasan dek.
  - title: SUP Percetakan & Hiasan
    items:
      - name: Pencetak Digital
        spec: Inkjet resolusi tinggi, sehingga lebar cetakan 2 m
        desc: Percetakan digital terus ke fabrik untuk grafik dek SUP berwarna penuh. Mencetak corak tersuai, gradasi, dan imej berkualiti gambar dengan dakwat berasaskan air yang tahan UV.
      - name: Mesin Cetak Skrin
        spec: Manual dan semi-automatik, pendaftaran berbilang warna
        desc: Percetakan skrin untuk logo papan SUP, tanda jenama, dan corak berulang. Memberikan cetakan yang tahan lama, legap dengan ketepuan warna yang cerah.
  - title: Pemasangan Akhir
    items:
      - name: Stesen Tork Injap
        spec: Dikalibrasi, ujian fungsi 10-kitaran
        desc: Memasang dan mengetatkan injap inflasi, kemudian menguji fungsi setiap injap melalui 10 kitaran buka/tutup.
      - name: Pemasang Kotak Sirip & D-Ring
        spec: Disusun mengikut jigi, pelekat telah dirawat
        desc: Membuat kedudukan dan melekatkan kotak sirip, D-ring, dan pemegang pada lokasi dek tepat mengikut spesifikasi model.
  - title: Ujian & Kawalan Kualiti
    items:
      - name: Penguji Tarik Universal
        spec: Kapasiti 50 kN
        desc: Ujian daya putus, pengecutan semasa putus, dan penyebaran koyakan untuk kumpulan fabrik.
      - name: Rig Ujian Penahanan Udara
        spec: Boleh atur, tahan tekanan 30 min
        desc: Ujian tahan tekanan automatik untuk setiap ruang tiub sebelum pemasangan.
      - name: Penguji Kupas Jahitan
        spec: Dimotorkan 180° kupas pada 100 mm/min
        desc: Ujian kekuatan las dan sambungan berlekatan mengikut protokol dalaman.
      - name: Kamera Cuaca Xenon-Arc
        spec: Pendedahan 2000 jam
        desc: Ujian ketahanan UV untuk perubahan warna dan pengekalan kekuatan.
cta:
  title: Berminat dengan lawatan kilang?
  desc: Kami mengalu-alukan pelawat ke fasiliti Weihai kami. Lihat peralatan dan proses kami secara langsung.
  label: Jadualkan lawatan →
  link: /contact
tldr:
  summary: Paddle Board Overstock mengendalikan 12,000 m² ruang pengeluaran yang dilengkapi dengan mesin pemotong PVC automatik, pengelasan RF frekuensi tinggi, stesen pemotongan dan penamat dek EVA, pencetak pengedapan haba, dan peralatan pemasangan akhir. Setiap papan menjalani ujian tahan tekanan 1.25x dari yang dinilai.
  points:
    - Pemotongan PVC automatik dengan ketepatan CNC
    - Pengelasan RF frekuensi tinggi untuk integriti sendi
    - Stesen pemotongan dan penamat tangan dek EVA
    - Peralatan tork injap dan pemasangan kotak sirip
    - Ujian tahan tekanan 1.25x pada 100% papan
