hero:
  tagline: Makmal Kawalan Kualiti
  title: Makmal Ujian & Jaminan Kualiti
  subtitle: Makmal kualiti bebas — setiap unit diuji sebelum penghantaran
  back_label: Kembali ke Kilang
intro: Paddle Board Overstock mengendalikan makmal kawalan kualiti khusus yang beroperasi secara bebas daripada pengeluaran. Setiap batch bahan mentah dan setiap papan siap melalui protokol pemeriksaan yang didokumentasikan sebelum dilepaskan. Pasukan QC kami melaporkan terus kepada pengurusan, memastikan keputusan kualiti yang tidak berat sebelah.
highlights:
  - value: 100%
    label: Unit diuji tekanan
    detail: Setiap bilik, setiap papan
  - value: 48 h
    label: Tempoh ujian penahanan udara
    detail: Pada tekanan 1.25× tahap yang dinilai
  - value: <5%
    label: Jumlah kejatuhan tekanan maksimum yang dibenarkan
    detail: Dalam tempoh tahan 24 jam
  - value: 99.3%
    label: Kadar bebas kecacatan
    detail: Penghantaran 12 bulan lepas
test_procedures:
  - title: Pemeriksaan Bahan Mentah
    description: Setiap batch masuk PVC, fabrik drop-stitch, buih EVA, dan perkakasan diuji sebelum diterima. Kekuatan tegangan, rintangan koyakan, dan rintangan UV disahkan. Bahan yang tidak mematuhi piawaian dikarantin dan dikembalikan.
    standards:
      - Kekuatan tegangan (min 350 N/cm)
      - Rintangan koyakan
      - Rintangan UV (1,000 jam)
  - title: Pemeriksaan QC Semasa Proses
    description: Operator pengeluaran melakukan pemeriksaan sendiri pada setiap peringkat. Juruaudit QC melakukan persampelan rawak sepanjang syif. Ujian pengelupasan kimpalan dilakukan setiap 50 unit. Pemeriksaan dimensi dilakukan setiap panel ke-20.
    standards:
      - Ujian jelut setiap 50 unit
      - Senarai semak 100-mata dalaman
      - Audit pengambilan sampel rawak
  - title: Ujian Penahanan Udara 48-Jam
    description: Setiap ruang tiub ditiup ke 125% tekanan dinilai dan ditahan selama 48 jam. Sensor tekanan mencatat secara berterusan dengan pampasan suhu. Sebarang ruang yang melepasi kejatuhan tekanan 5% akan mencetuskan pemeriksaan semula batch secara automatik.
    standards:
      - Pegangan tekanan 1.25x dari nilai dinilai
      - Penurunan tekanan maksimum <5%
  - title: Ujian Beban & Keseimbangan
    description: Papan siap diuji pada kapasiti maksimum yang dinilai untuk kestabilan, lebihan bebas, dan pengendalian. Setiap papan menjalani ujian air sebelum kelulusan pemeriksaan akhir.
    standards:
      - Pengesahan beban 1.25x dari nilai dinilai
      - Ujian air
