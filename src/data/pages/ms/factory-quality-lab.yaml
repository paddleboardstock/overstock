tldr:
  summary: 'Makmal kualiti Paddle Board Overstock beroperasi secara bebas daripada pengeluaran, menjalankan ujian tegangan, lepasan, UV, dan tekanan mengikut protokol dalaman yang didokumenkan. 100% unit menjalani ujian tahan tekanan 1.25x tekanan yang dinilai. Kadar bebas kecacatan: 99.3% bagi penghantaran 12 bulan kebelakangan.'
  points:
    - Makmal bebas yang dipisahkan daripada pengeluaran untuk pengesahan kualiti tanpa berat sebelah
    - 100% ujian tekanan pada 1.25x tekanan yang dinilai untuk tahan 24-48 jam setiap unit
    - Protokol dalaman yang didokumenkan mengawal setiap ujian
    - Kadar bebas kecacatan 99.3% bagi penghantaran 12 bulan terdahulu
    - Setiap unit diperiksa melalui kawalan kualiti 6 peringkat sebelum penghantaran
protocols_label: Protokol
