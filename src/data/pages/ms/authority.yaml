hero:
  tagline: Pusat Autoriti
  title: Why Paddle Board Overstock?<br />Trust Built Over a Decade
  subtitle: Every board we build carries the weight of 10+ years of marine engineering, rigorous quality control, and thousands of paddlers on the water worldwide. This is why paddlers choose Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock kemudahan pembuatan marin dan pasukan kejuruteraan
