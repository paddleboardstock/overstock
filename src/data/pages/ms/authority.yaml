hero:
  tagline: Pusat Autoriti
  title: Mengapa Paddle Board Overstock?<br />Kepercayaan yang Dibina Sepanjang Satu Dekad
  subtitle: Setiap bot yang kami bina membawa berat pengalaman 10+ tahun dalam kejuruteraan marin, sistem kualiti yang diperakui, dan ribuan operasi berjaya di seluruh dunia. Inilah sebabnya mengapa profesional industri memilih Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock kemudahan pembuatan marin dan pasukan kejuruteraan
stats:
  title: Paddle Board Overstock Mengikut Nombor
  stats:
    - title: Tahun Beroperasi
      amount: Sejak 2012
    - title: Jurutera R&D
      amount: 50+
    - title: Negara Dirantai
      amount: 50+
    - title: Peralatan Dihantar
      amount: 15,000+
features3_brand:
  tagline: Siapa Kami
  title: Asas Jenama<br />& Warisan
  subtitle: Kisah, kepakaran, dan jangkauan global yang mentakrifkan Paddle Board Overstock sebagai pengeluar peralatan marin yang dipercayai.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kira-kira Paddle Board Overstock
      description: Diasaskan pada tahun 2012 di Qingdao, China. Dari bengkel di tepi pantai ke kemudahan seluas 12,000 m² — kisah lengkap Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Kisah Jenama
      description: Bagaimana satu pasukan jurutera marin berusaha untuk menjadikan kenderaan air tiup gred profesional dapat diakses di seluruh dunia.
      icon: tabler:book
      link: /brand-story
    - title: Kepakaran Industri Marin
      description: Sains bahan mendalam, pembuatan tepat, dan ujian dunia sebenar — beberapa dekad kejuruteraan marin dalam setiap lambung.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Kehadiran Global
      description: Berkhidmat di 50+ negara di setiap benua. Kepakaran serantau untuk keperluan peraturan tempatan dan keutamaan pasaran.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Mengapa Paddle Board Overstock
      description: Apa yang membezakan kami — kualiti, penyesuaian, harga terus dari kilang, dan sokongan menyeluruh untuk pengendali komersial.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Pasukan Kami
      description: Temui kepimpinan — jurutera marin, saintis bahan, dan pakar pembuatan yang memacu Paddle Board Overstock ke hadapan.
      icon: tabler:users
      link: /brand/team
    - title: Pasukan Kejuruteraan
      description: 78+ tahun gabungan R&D, 40+ platform, 12 pensijilan, 1200+ OEM projek. Pasukan teknikal di sebalik setiap produk.
      icon: tabler:engine
      link: /engineering-team
    - title: Pusat R&D
      description: Kejuruteraan hull, pengelasan RF, makmal PVC, prototaip, tangki ujian, dan makmal kualiti — kemudahan penyelidikan dan pembangunan penuh kami.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Kepercayaan & Kualiti
  title: Pensijilan, Kualiti<br />& Bukti
  subtitle: Sijil bebas, ujian yang ketat, dan bukti nyata yang menunjukkan komitmen kami terhadap kualiti.
  isBeforeContent: false
  columns: 3
  items:
    - title: Pensijilan
      description: CE, ISO 9001, UKCA, BSCI, REACH — dokumentasi pensijilan penuh dan pematuhan untuk pasaran global.
      icon: tabler:shield-check
      link: /certifications
    - title: Kualiti & Pengujian
      description: Setiap produk diuji tekanan sebelum penghantaran. Ketahanan jahitan, ketahanan UV, daya apung — disahkan pada setiap peringkat.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bukti & Bukti
      description: Keputusan ujian, foto penyebaran, laporan pemeriksaan pihak ketiga, dan kajian kes yang mengesahkan kualiti Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Graf Pengetahuan
      description: Terokai graf entiti Paddle Board Overstock — produk, teknologi, pensijilan, dan hubungan dalam pangkalan pengetahuan yang bersambung.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Kepimpinan
  title: Temui Pasukan<br />Di belakang Paddle Board Overstock
  subtitle: Kepakaran industri yang merangkumi kejuruteraan marin, sains bahan, pengurusan kualiti, dan perdagangan global B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Pengasas & Ketua Pegawai Eksekutif
      description: 15+ tahun dalam pembuatan marin. Sebelumnya mengetuai R&D di pengeluar bot utama China. Memegang beberapa paten dalam reka bentuk bot tiup.
      icon: tabler:crown
    - title: Zhang Wei — Ketua Jurutera
      description: 20+ tahun dalam pembuatan PVC/Hypalon dan reka bentuk hull V-dalam. Bekas pengarah teknikal di sebuah firma kejuruteraan marin Eropah.
      icon: tabler:engine
    - title: Chen Ming — Ketua R&D
      description: PhD dalam Sains Bahan. Mengkhusus dalam teknologi drop-stitch dan kimpalan frekuensi tinggi. 10+ tahun dalam komposit tekstil.
      icon: tabler:flask
    - title: Liu Qiang — Pengarah Pengeluaran
      description: 18+ tahun dalam pengilangan ramping. Six Sigma Black Belt. Melaksanakan sistem kualiti ISO 9001 di semua barisan pengeluaran.
      icon: tabler:settings
    - title: Wang Fang — Pengurus Kualiti
      description: 12+ tahun dalam kawalan kualiti marin. Bertauliah CE dan ISO juruaudit. Mengawasi ujian untuk setiap kumpulan pengeluaran.
      icon: tabler:shield-check
    - title: Helen Lee — Pengarah Jualan
      description: 15+ tahun dalam perdagangan B2B antarabangsa. Menguruskan perkongsian OEM/ODM di 30+ negara. Fasih dalam 4 bahasa.
      icon: tabler:briefcase
cta:
  title: Ingin mengesahkan kredensial kami?
  subtitle: Hubungi kami untuk salinan sijil, laporan pemeriksaan pihak ketiga, atau untuk menjadualkan lawatan kilang.
  actions:
    - variant: primary
      text: Permintaan kelayakan
      href: /contact
    - text: Lihat butiran sijil
      href: /certifications
