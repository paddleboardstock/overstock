hero:
  tagline: Pusat Autoriti
  title: Mengapa Paddle Board Overstock?<br />Kepercayaan yang Dibina Sepanjang Satu Dekad
  subtitle: Setiap papan yang kami bina memikul berat 10+ tahun kejuruteraan marin, kawalan kualiti yang ketat, dan ribuan pengayuh di air di seluruh dunia. Inilah sebabnya pengayuh memilih Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock kemudahan pembuatan marin dan pasukan kejuruteraan
stats:
  title: Paddle Board Overstock mengikut Nombor
  stats:
    - title: Tahun Operasi
      amount: Sejak 2012
    - title: Jurutera R&D
      amount: 14+
    - title: Negara yang Dihidangkan
      amount: 50+
    - title: Unit Dihasilkan Setiap Tahun
      amount: 15,000+
features3_brand:
  tagline: Siapa Kami
  title: Asas Jenama<br />& Warisan
  subtitle: Cerita, kepakaran, dan capaian global yang mentakrifkan Paddle Board Overstock sebagai jenama SUP yang dipercayai.
  isBeforeContent: false
  columns: 3
  items:
    - title: Mengenai Paddle Board Overstock
      description: Ditubuhkan pada tahun 2012 di Weihai, China. Dari bengkel tepi pantai ke kemudahan seluas 12,000 m² — keseluruhan kisah Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Kisah Jenama
      description: Bagaimana sekumpulan jurutera marin berusaha untuk menjadikan papan dayung tiup tahap profesional dapat diakses di seluruh dunia.
      icon: tabler:book
      link: /brand-story
    - title: Kepakaran Industri Marin
      description: Sains bahan yang mendalam, pembuatan tepat, dan ujian dunia nyata — beberapa dekad kejuruteraan marin dalam setiap papan.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Kenapa Paddle Board Overstock
      description: Apa yang membezakan kami — kualiti, penyesuaian, harga terus dari kilang, dan sokongan menyeluruh untuk setiap pengayuh.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Pasukan Kami
      description: Temui kepimpinan — jurutera marin, saintis bahan, dan pakar pembuatan yang memacu Paddle Board Overstock ke hadapan.
      icon: tabler:users
      link: /brand/team
    - title: Pasukan Kejuruteraan
      description: 78+ tahun gabungan R&D, 40+ platform, 1,200+ projek kejuruteraan. Pasukan teknikal di sebalik setiap produk.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Kepercayaan & Kualiti
  title: Kualiti, Ujian<br />& Bukti
  subtitle: Ujian ketat, data ujian sebenar, dan bukti yang menunjukkan komitmen kami terhadap kualiti.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kualiti & Pengujian
      description: Setiap produk diuji tekanan sebelum penghantaran. Ketahanan jahitan, ketahanan UV, daya apung — disahkan pada setiap peringkat.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bukti & Bukti
      description: Keputusan ujian, gambar pemasangan, laporan pemeriksaan pihak ketiga, dan kajian kes yang mengesahkan kualiti Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Graf Pengetahuan
      description: Terokai graf entiti Paddle Board Overstock — produk, teknologi, bahan, dan hubungan dalam pangkalan pengetahuan yang bersambung.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Kepimpinan
  title: Temui Pasukan<br />Di sebalik Paddle Board Overstock
  subtitle: Kepakaran industri yang merangkumi kejuruteraan marin, sains bahan, pengurusan kualiti, dan e-dagang global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Pengasas & Ketua Pegawai Eksekutif
      description: 15+ tahun dalam pembuatan marin. Sebelumnya mengetuai R&D di sebuah pengeluar marin utama China. Memegang beberapa paten dalam reka bentuk produk tiup.
      icon: tabler:crown
    - title: Zhang Wei — Ketua Jurutera
      description: 20+ tahun dalam fabrikasi polimer dan reka bentuk struktur tiup. Bekas pengarah teknikal di sebuah firma kejuruteraan marin Eropah.
      icon: tabler:engine
    - title: Chen Ming — Ketua R&D
      description: PhD dalam Sains Bahan. Mengkhusus dalam teknologi drop-stitch dan kimpalan frekuensi tinggi. 10+ tahun dalam komposit tekstil.
      icon: tabler:flask
    - title: Liu Qiang — Pengarah Pengeluaran
      description: 18+ tahun dalam pembuatan lean. Melaksanakan sistem kualiti ketat di semua garis pengeluaran.
      icon: tabler:settings
    - title: Wang Fang — Pengurus Kualiti
      description: 12+ tahun dalam kawalan kualiti marin. Memimpin audit kualiti dalaman. Memantau ujian untuk setiap kumpulan pengeluaran.
      icon: tabler:shield-check
    - title: Helen Lee — Pengarah Jualan
      description: 15+ tahun dalam e-dagang dan logistik antarabangsa. Menghantar papan kepada pendayung di 50+ negara. Fasih dalam 4 bahasa.
      icon: tabler:briefcase
cta:
  title: Mahukan bukti kualiti kami?
  subtitle: Hubungi kami untuk laporan ujian, rekod pemeriksaan, atau untuk menjadualkan lawatan kilang.
  actions:
    - variant: primary
      text: Minta dokumentasi
      href: /contact
