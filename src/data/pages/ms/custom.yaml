hero:
  tagline: Aquafarer Makmal Tersuai
  title: Reka Sendiri<br />Kenderaan air
  subtitle: OEM, ODM, label peribadi, dan perkhidmatan penjenamaan khas untuk perniagaan di seluruh dunia. Dari satu prototaip hingga pengeluaran penuh.
  cta: Mulakan projek anda
  footer_link: /contact
steps_section:
  tagline: Bagaimana ia berfungsi
  title: Dari konsep ke pengeluaran
  subtitle: Empat langkah dari idea anda kepada produk siap yang sedia untuk laut.
  steps:
    - num: '01'
      title: Pilih Papan Anda
      desc: Pilih dari model teras kami — SUP, kayak, perahu kembung, atau RIB. Pilih saiz, bahan, dan warna.
    - num: '02'
      title: Muat Naik Rekaan Anda
      desc: Hantar logo, karya seni, atau panduan jenama anda kepada kami. Pasukan reka bentuk kami menyediakan bukti digital.
    - num: '03'
      title: Ulasan Lakaran AI
      desc: Lihat mockup AI fotorealistik papan khusus anda sebelum pengeluaran bermula.
    - num: '04'
      title: Pengeluaran & Penghantaran
      desc: Setelah diluluskan, pesanan anda akan memasuki garis pengeluaran bersihifikasi ISO kami. Masa pemprosesan dari 30 hari.
services_section:
  tagline: Perkhidmatan
  title: Perkhidmatan pembuatan untuk jenama global
  subtitle: Model penglibatan yang fleksibel — daripada pembuatan kontrak hingga pembinaan jenama sepenuhnya.
  items:
    - title: Pengilangan OEM
      desc: Kami menghasilkan reka bentuk anda mengikut spesifikasi — IP anda, lukisan anda, piawaian kualiti anda. Perlindungan penuh NDA.
      icon: ⚙️
    - title: Penyelesaian ODM
      desc: Pilih daripada 50+ platform yang terbukti dan ubah suai saiz, warna, grafik, dan pembungkusan.
      icon: 🎨
    - title: Label Peribadi
      desc: Jenama anda pada produk kami — logo, pembungkusan, tag gantung, manual. Sedia untuk dijual terus dari kotak.
      icon: 🏷️
    - title: Penjenamaan Tersuai
      desc: Cetakan pad dek, grafik badan kapal, pelekat tiub, dan label tersuai — integrasi jenama sepenuhnya.
      icon: ✨
capabilities_section:
  tagline: Kebolehan
  title: Keupayaan pengeluaran & penyesuaian
  subtitle: Segala yang anda perlu tahu sebelum membuat pesanan anda.
  capabilities:
    - label: Jumlah pesanan
      value: MOQ 5–10 unit (SUP/kayak), 2–5 unit (RIB)
    - label: Masa pemprosesan
      value: 30–45 hari standard; 15–20 hari untuk prototaip
    - label: Pengubahsuaian
      value: Saiz, bentuk, warna, grafik, pembungkusan, perkakasan
    - label: Bahan
      value: PVC, Hypalon, drop-stitch, fiberglass, aluminium
    - label: Percetakan
      value: Digital (CMYK), cetakan skrin, pemindahan haba, sublimasi
    - label: Pensijilan
      value: CE, ISO 9001, BSCI, UKCA (sokongan untuk pematuhan global)
why_section:
  tagline: Mengapa Aquafarer
  title: Satu kilang. Satu standard. Tiada kompromi.
  points:
    - text: Fasiliti pengilangan bersepadu 12,000 sqm
      highlight: 12,000 sqm
    - text: 200-300 pekerja mahir dan jurutera
      highlight: 200-300
    - text: 15,000 bot dihasilkan setiap tahun
      highlight: 15,000
    - text: ISO kualiti pengurusan disahkan 9001
      highlight: ISO 9001
    - text: CE produk disahkan untuk pasaran EU
      highlight: CE
  cta: Lihat butiran kilang
  cta_link: /factory
  contact:
    title: Sedia untuk berbincang tentang projek anda?
    desc: Pasukan kami akan memberi respons dalam masa 24 jam dengan sebutharga awal.
