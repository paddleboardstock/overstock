stories:
  tagline: Kisah Penjelajah
  title: Pengembaraan sebenar dari orang sebenar
  subtitle: Dengar dari pemain mendayung, keluarga, dan profesional yang menggunakan peralatan Paddle Board Overstock di air.
  items:
    - name: Sarah & Mike
      title: Pemilik Explorer 11, Kanada
      content: Kami membawa Explorer 11 kami dalam perjalanan selama seminggu melalui Taman Algonquin. Mereka mengendalikan portage dan penyeberangan tasik dengan indah. Konstruksi drop-stitch bermakna kami boleh mengembang hingga 15 PSI dan mendapatkan prestasi papan keras dari papan yang boleh dibawa.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Taman Algonquin, Kanada
    - name: Carlos R.
      title: Penunggang Cheetah Surge, Sepanyol
      content: Cheetah Surge adalah pilihan saya untuk menjelajah pantai. Rekabentuk yang ceria menarik perhatian di pantai, dan kestabilannya memberi saya keyakinan dalam gelombang ringan. Ia mengendalikan dengan indah sama ada saya sedang menjelajah atau hanya menikmati matahari terbenam.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Sepanyol
    - name: Lina & keluarga
      title: Pendayung Lotus Mengalir, Sweden
      content: Pengembaraan keluarga hujung minggu di kepulauan. The Flowing Lotus cukup stabil untuk anak perempuan saya berdiri sambil saya mendayung. Mengembang dalam masa kurang 10 minit — tidak memerlukan treler, hanya keseronokan keluarga di atas air.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Kepulauan Stockholm, Sweden
    - name: Lt. Cmdr. Andres
      title: Penjelajah Ocean Voyager, Filipina
      content: Saya menggunakan Ocean Voyager saya untuk lawatan pantai jarak jauh di sekitar Palawan. Selepas berbulan-bulan penggunaan harian dalam keadaan tropika, papan itu masih berfungsi seperti baru. Bentuk papan untuk lawatan memotong ombak yang akan menghentikan papan lain yang lebih lemah.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipina
    - name: Emma T.
      title: Tropical Breeze pertama kali, Australia
      content: Saya tidak pernah menaiki SUP sebelum ini. Tropical Breeze sangat stabil sehingga saya berasa yakin pada percubaan pertama saya. Kini saya mendayung setiap hujung minggu. Lengkung pembelajaran hampir tiada — dan papan kelihatan menakjubkan di atas air.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
