features3_reasons:
  tagline: Mengapa Pilih Paddle Board Overstock
  title: Tujuh sebab untuk bekerjasama dengan kami
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Pembuatan Sebenar, Bukan Perdagangan
      description: Kami memiliki dan mengendalikan sebuah kilang seluas 12,000 m². Apabila anda membeli Paddle Board Overstock daripada, anda membeli terus daripada orang yang mereka bentuk, mereka bentuk, dan membina papan anda — tiada orang tengah, tiada markup runcit.
      icon: tabler:building-factory
    - title: 2. Pendekatan Berpandukan Kejuruteraan
      description: Proses reka bentuk kami bermula dengan kes penggunaan, bukan kategori produk. Kami mengoptimumkan bentuk badan, pemilihan bahan, dan konfigurasi untuk bagaimana papan itu sebenarnya akan digunakan.
      icon: tabler:engine
    - title: 3. Kualiti Terbukti
      description: Setiap papan diuji tekanan 100% pada penarafan 1.25x PSI sebelum dihantar. Kadar tanpa kecacatan 99.3% — diukur pada setiap batch, bukan hanya dituntut.
      icon: tabler:shield-check
    - title: 4. Reka Bentuk Paddler-First
      description: 'Seni dek, siri warna, aksesori, dan pakej lengkap — papan direka untuk aktiviti mendayung sebenar: pelancongan, yoga, memancing, kecergasan, dan keseronokan keluarga.'
      icon: tabler:swimming
    - title: 5. Logistik Global
      description: Penghantaran terus dari kilang kami di Weihai kepada para pendayung di 50+ negara, dengan penjejakan penuh dan pengendalian kastam.
      icon: tabler:truck-delivery
    - title: 6. Sokongan Sepanjang Hayat
      description: Kami menyokong papan yang kami bina bertahun-tahun lalu. Alat ganti asli, nasihat teknikal, panduan pembaikan — pasukan kami sentiasa tersedia apabila anda memerlukan kami.
      icon: tabler:lifebuoy
    - title: 7. Spesifikasi Jujur
      description: Penarafan beban sebenar, dimensi sebenar, berat sebenar. Tiada inflasi pemasaran. Apa yang kami terbitkan adalah apa yang anda dapat — disahkan melalui ujian bebas.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dipercayai oleh Jenama di Seluruh Dunia
  title: Apa Kata Rakan Kongsi Kami
  items:
    - content: Papan saya tiba dalam keadaan segar dari kilang dengan semua barang dalam kotak. Dua musim mendayung mingguan dan ia masih mengekalkan udara dengan sempurna.
      name: — Sarah M., Pendayung Hujung Minggu, Florida
    - content: Saya bandingkan spesifikasi selama berminggu-minggu sebelum membeli.Paddle Board Overstock Itu satu-satunya jenama yang menerbitkan berat sebenar dan tekanan sebenar. Apa yang mereka senaraikan adalah apa yang muncul.
      name: — Tomasz K., Pendayung Touring, Poland
    - content: Seluruh keluarga kini berdayung. Kami bermula dengan satu papan dan akhirnya mendapat empat — kualiti memudahkan keputusan.
      name: — Angela R., Pendayung Keluarga, Australia
cta:
  title: Sedia untuk mengalami perbezaannya?
