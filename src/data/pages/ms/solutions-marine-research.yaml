content_challenge:
  tagline: Cabaran
  title: Tuntutan Penyelidikan Marin<br />Platform Stabil & Sedia Untuk Peralatan
  subtitle: Bot kerja saintifik mesti menyediakan platform yang stabil untuk instrumentasi sensitif, operasi senyap untuk mengelakkan mengganggu hidupan liar, dan susun atur fleksibel untuk peralatan penyelidikan yang pelbagai.
  paragraphs:
    - Penyelidikan marin dan pemantauan alam sekitar memerlukan bot kerja yang berfungsi sebagai makmal bergerak. Berbeza dengan kapal komersial atau rekreasi, RIBs penyelidikan mesti menampung instrumentasi elektronik yang sensitif, peralatan pensampelan air dan sedimen, dan kadang-kadang pengangkutan spesimen hidup — semuanya sambil mengekalkan platform yang stabil untuk pengumpulan data yang tepat.
    - '**Kestabilan platform adalah kritikal** — Sonar, echo sounder, dan profiler CTD (konduktiviti, suhu, kedalaman) memerlukan hull yang stabil semasa berehat dan pada kelajuan perlahan. Gelombang berlebihan atau pergerakan hull akan menambah bunyi pada data saintifik. Hull V-dalam dengan ciri kestabilan yang baik adalah penting.'
    - '**Integrasi peralatan** — Kapal penyelidikan memerlukan titik pemasangan untuk antena GPS, transduser sonar, lengan pensampelan, dan peralatan log data. Ruang konsol mesti menampung pelbagai paparan, pengagihan kuasa untuk instrumen, dan penyimpanan selamat untuk elektronik sensitif.'
    - '**Operasi senyap** — Untuk tinjauan biologi marin dan pemantauan alam sekitar, bunyi enjin dan getaran hull boleh menakutkan hidupan laut dan menjejaskan pemerhatian tingkah laku. Konfigurasi luar pesisir yang senyap dan reka bentuk hull dengan getaran rendah penting untuk aplikasi penyelidikan.'
    - Paddle Board Overstock penyelidikan RIBs direka dengan platform hull yang stabil, sistem pemasangan peralatan bersepadu, dan konfigurasi luar pesisir yang senyap untuk aplikasi saintifik dan pemantauan alam sekitar.
content_solution:
  tagline: Penyelesaian Kami
  title: Platform Penyelidikan Reka Bentuk Khusus RIBs<br />Untuk Kerja Sains & Alam Sekitar
  subtitle: Setiap Paddle Board Overstock penyelidikan RIB dikonfigurasikan sebagai platform stabil dan boleh disesuaikan untuk instrumentasi saintifik dan peralatan pensampelan lapangan.
  list:
    - Hull fiberglass Deep-V dengan kestabilan cemerlang semasa berehat dan pada kelajuan tinjauan perlahan
    - Susun atur dek rata dengan plat pemasangan peralatan untuk sonar, GPS, dan peralatan pensampelan
    - Konsol dikonfigurasikan untuk pelbagai paparan — plotter, sounder, log data
    - Pengagihan kuasa aksesori 12V dan 24V untuk instrumen saintifik
    - Luar pesisir 4-lejang yang senyap — getaran dan bunyi minimum untuk kajian hidupan liar
    - Reka bentuk lambung opsyenal dengan gelombang rendah untuk gangguan minimum semasa pengumpulan data
    - Warna tiub custom untuk penjenamaan institusi penyelidikan dan pengenalan armada
content_segments:
  tagline: Profil Penyelidikan
  title: Penyelesaian Sains Marin<br />Berdasarkan Jenis Aplikasi
  subtitle: Aplikasi penyelidikan yang berbeza mempunyai keperluan kapal yang unik — daripada platform pengajaran universiti hingga kapal tinjauan alam sekitar dan pemantauan kualiti air RIBs.
  items:
    - title: Program Sains Marin Universiti
      subtitle: Platform pengajaran, lawatan lapangan pelajar, penyelidikan pesisir
      description: Universiti sains marin dan jabatan oseanografi memerlukan bot kerja yang boleh dipercayai dan serba boleh untuk mengajar kursus lapangan, projek penyelidikan pelajar, dan tinjauan pesisir yang diketuai fakulti. Bot mesti mudah dikendalikan oleh pelajar di bawah pengawasan, cukup stabil untuk penempatan instrumen secara langsung, dan tahan lama untuk digunakan kerap oleh pelbagai pengguna sepanjang semester akademik. Kekangan bajet dalam persekitaran akademik menjadikan kos efektif dan penyelenggaraan rendah sebagai pertimbangan penting.
      features:
        - Platform stabil untuk latihan penempatan dan pemulihan instrumen pelajar
        - Operasi mudah — konfigurasi tiller atau konsol tunggal untuk penggunaan pelajar yang diawasi
        - Tiub Hypalon tahan lama untuk mendarat di pantai secara kerap dan pengendalian pelajar
        - Pemasangan peralatan untuk sonar tahap pengajaran, cakera secchi, dan alat pengambilan sampel
        - Pilihan PVC kos efektif untuk program akademik dengan bajet terhad
    - title: Institut Penyelidikan Marin
      subtitle: Tinjauan RIBs dengan integrasi instrumen, GPS, peralatan pengambilan sampel
      description: Organisasi penyelidikan marin khusus yang menjalankan tinjauan pesisir dan luar pesisir memerlukan RIBs tinjauan yang dikonfigurasi secara profesional dengan integrasi instrumen. Kapal ini membawa sistem sonar untuk pemetaan batimetri, profiler CTD untuk analisis kolum air, pengambil sampel sedimen, dan peralatan pengambilan biologi. Bot mesti menyediakan platform stabil pada kelajuan tinjauan perlahan, mempunyai ruang dek yang luas untuk penempatan peralatan, dan menawarkan kuasa 12V/24V yang bersih untuk elektronik.
      features:
        - Pemasangan transduser sonar bersepadu — melalui lambung atau konfigurasi transom
        - Pemasangan antena GPS dan integrasi konsol untuk navigasi tahap tinjauan
        - Kawasan pelancaran CTD dan pengambil sampel air dengan titik pengikat yang selamat
        - Pengagihan kuasa tambahan 12V/24V untuk instrumen dan pencatat data
        - Stabil pada kelajuan perlahan (3-6 knot) untuk ketepatan garis tinjauan
        - Opsyen rangka-A atau davit untuk menurunkan peralatan pengambilan sampel yang lebih berat
    - title: Pemantauan & Pemuliharaan Alam Sekitar
      subtitle: Tinjauan ekologi, pemerhatian hidupan liar, penilaian habitat
      description: NGO alam sekitar, agensi kerajaan, dan organisasi pemuliharaan menjalankan tinjauan ekologi marin, pemantauan populasi hidupan liar, dan penilaian habitat. Operasi ini memerlukan kapal yang senyap dan berdampak rendah yang boleh mendekati habitat sensitif tanpa mengganggu hidupan liar. Bot perlu membawa peralatan kamera, GPS untuk pemetaan transeks, dan peralatan pengambilan sampel untuk air dan sedimen. Gelombang rendah dan bunyi enjin minimum adalah kritikal untuk kajian pemerhatian tingkah laku.
      features:
        - Luar pesisir 4-lejang yang senyap — gangguan minimum kepada hidupan laut
        - Platform pemerhatian stabil untuk fotografi dan dokumentasi video
        - Pemasangan peralatan untuk rig kamera, penjejak GPS, dan komputer lapangan
        - Draf cetek untuk mengakses paya pantai, bakau, dan muara
        - Permukaan dek dan tiub yang mudah dibersihkan untuk dekontaminasi antara tapak
    - title: Pemantauan & Ujian Kualiti Air
      subtitle: Larian pensampelan berkala, penjejakan pencemar, pemantauan pematuhan
      description: Organisasi pemantauan kualiti air menjalankan siri pengambilan sampel secara berkala di kawasan pesisir, pelabuhan, dan laluan air pedalaman untuk menjejaki tahap pencemaran, ledakan alga, dan pematuhan dengan peraturan alam sekitar. Operasi ini memerlukan bot yang cekap dan boleh dipercayai untuk kunjungan berulang ke stesen pengambilan sampel tetap. Kapal tersebut mesti membawa peralatan pengambilan sampel, penyejuk untuk pemeliharaan sampel, dan peralatan ujian lapangan — dengan kemudahan mencuci dek antara tapak pengambilan sampel untuk mengelakkan pencemaran silang.
      features:
        - Kawasan stesen pensampelan khas dengan penyejuk dan stor peralatan
        - Permukaan dek dan tiub yang mudah dibersihkan untuk dekontaminasi antara tapak
        - Integrasi GPS untuk kembali tepat ke koordinat pensampelan tetap
        - Saiz kompak untuk akses ke laluan air yang terhad dan saluran sempit
        - Enjin luar yang cekap bahan api untuk perjalanan pensampelan berkala yang menjimatkan kos
