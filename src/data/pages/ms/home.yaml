      description: Setiap papan dinyatakan bertekanan pada 1.25x PSI yang dinilai dan ditahan sebelum dihantar. Kadar bebas kecacatan 99.3% bagi AQL 2.5 / ISO 2859.
    - title: Tiada Orang Tengah
