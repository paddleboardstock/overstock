faqs:
  title: B2B Soalan Lazim Perolehan
  subtitle: Soalan lazim daripada jenama, pengedar, dan pengendali komersial tentang pengilangan OEM/ODM dengan Paddle Board Overstock.
  columns: 2
  items:
    - title: Adakah anda seorang pengilang atau syarikat perdagangan?
      description: Kami adalah kilang bersepadu secara menegak dengan kawalan penuh ke atas kualiti, bahan, dan masa pengeluaran. Lesen perniagaan dan skop pengeluaran boleh disahkan semasa audit kilang.
      icon: tabler:building-factory
      category: all
    - title: Apakah proses OEM/ODM anda?
      description: Semakan keperluan (48 jam) kepada cadangan kepada prototaip (7-14 hari) kepada pengeluaran (30-45 hari FOB Qingdao). Sokongan kejuruteraan penuh, dokumentasi pematuhan, dan kebolehlacakan mengikut setiap hull sepanjang proses.
      icon: tabler:route
      category: all
    - title: Apakah MOQ keperluan anda?
      description: 'RIB bot: 2-5 unit setiap model (acuan sedia ada), 200+ untuk acuan khas. SUP papan: 5-10 unit setiap SKU. Pesanan kontena model campuran tersedia. Pesanan sampel pada 2-5 unit untuk penilaian.'
      icon: tabler:sort-ascending
      category: all
    - title: Pilihan pengubahsuaian apa yang tersedia?
      description: Reka bentuk sarung, bahan tiub (PVC atau Hypalon/CSM), diameter tiub, susun atur konsol, tempat duduk, stereng, sistem bahan api, susun atur dek, warna jenama, grafik logo, reka bentuk pad EVA, pembungkusan runcit, dan penjenamaan manual pemilik.
      icon: tabler:adjustments
      category: all
    - title: Dokumen pematuhan yang mana boleh anda sediakan untuk pasaran saya?
      description: CE DoC mengikut 2013/53/EU, penandaan UKCA, sijil 9001 (SGS), laporan audit BSCI, pematuhan REACH, laporan ujian bahan, log ujian tekanan, dan data plat pembina khusus model. Dokumentasi khusus pasaran atas permintaan.
      icon: tabler:file-certificate
      category: all
    - title: Apakah masa utama pensampelan dan pengeluaran?
      description: 'Sampel pra-pengeluaran: 7-14 hari bekerja. Pengeluaran standard: 30-45 hari FOB Qingdao. Pengeluaran segera tersedia dengan kos tambahan. Musim puncak (Mac-Jun) mungkin memanjangkan masa pemprosesan.'
      icon: tabler:clock
      category: all
    - title: Bolehkah saya mengatur audit kilang atau lawatan video secara langsung?
      description: Ya. Pemeriksaan kilang di tapak di fasiliti kami di Qingdao dialu-alukan dengan notis 3-5 hari. Lawatan video langsung melalui WhatsApp/Zoom tersedia dengan segera. Pemeriksaan pihak ketiga (SGS, BV, TÜV) boleh diatur.
      icon: tabler:video
      category: all
    - title: Apakah pemeriksaan kualiti yang dilakukan sebelum penghantaran?
      description: Ujian tahan tekanan dinilai 1.25x (24-48 jam), ujian kelupasan jahitan, senarai semak pemeriksaan akhir 100 mata, pengesahan dimensi, pemeriksaan kosmetik, pengesahan dokumentasi pematuhan, dan pemeriksaan integriti pembungkusan. Semua mengikut prosedur ISO 9001.
      icon: tabler:clipboard-check
      category: all
