features:
  id: features
  tagline: Mengapa Beli Dari Paddle Board Overstock
  title: Kilangan Sebenar,<br />Penjimatan Sebenar
  subtitle: Stok lebihan kilang dan pakej penghabisan SUP terus dari kilang — kualiti disahkan tanpa markup runcit.
  columns: 2
  items:
    - title: Diskaun Sehingga 60% Daripada Harga Runcit
      description: Kami menjual stok lebihan kilang dan batch penghabisan terus — tiada orang tengah, tiada markup runcit. Papan yang dijual pada harga penuh di tempat lain, dijual pada harga penghabisan di sini.
      icon: tabler:rocket
    - title: Pakej Lengkap
      description: 'Setiap SUP datang sebagai pakej lengkap: papan, beg galas perjalanan, pam tangan, paddle boleh laras, sirip boleh tanggal, tali gegelung, dan kit pembaikan.'
      icon: tabler:clipboard-list
    - title: Kualiti Bertauliah
      description: 13 model CE-disahkan SUP mengikut arahan relevan EU. Setiap papan diuji tekanan 100% pada 1.25x PSI yang dinilai sebelum dihantar. Kadar bebas kecacatan 99.3% mengikut AQL 2.5.
      icon: tabler:certificate
    - title: Tiada MOQ — Pesan Satu Papan
      description: Penghabisan stok lebihan bermakna pesanan unit tunggal dialu-alukan. Tambah papan ke kereta, daftar keluar, selesai. Tiada pesanan minimum, tiada proses sebut harga.
      icon: tabler:adjustments
    - title: Penghantaran Pantas ke Seluruh Dunia
      description: Pesanan sedia ada dihantar dari Weihai dalam 2-3 hari bekerja. Penghantaran dengan penjejakan ke 50+ negara di seluruh EU, Amerika Utara, Asia-Pasifik, dan lain-lain.
      icon: tabler:truck-delivery
    - title: Jaminan SUP 2 Tahun
      description: Setiap papan dan aksesori SUP dilindungi selama 2 tahun — termasuk jahitan drop-stitch, injap inflasi, dan aksesori. Tuntutan diselesaikan dalam beberapa hari, bukan minggu.
      icon: tabler:lifebuoy
