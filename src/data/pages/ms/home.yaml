    - title: CE Disahkan
      description: 13 model CE yang disahkan SUP mengikut arahan EU yang berkenaan, masing-masing dengan Deklarasi Pemenuhan khusus model dan data plat pembina.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Semua PVC dan bahan pelekat mematuhi peraturan EU REACH. Penandaan UKCA tersedia untuk pasaran UK. Lembaran data keselamatan bahan boleh didapati atas permintaan.
