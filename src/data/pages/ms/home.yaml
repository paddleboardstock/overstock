features:
  id: features
  tagline: OEM/ODM Keupayaan
  title: Apa yang anda dapat<br />dengan Paddle Board Overstock
  subtitle: Akses kilang secara langsung dengan sokongan penuh kejuruteraan, kualiti, dan pematuhan — bukan syarikat perdagangan.
  columns: 2
  items:
    - title: OEM/ODM Penyesuaian
      description: Reka bentuk badan kapal tersuai, bahan tiub (PVCatau Hypalon/CSM), susun atur konsol, tempat duduk, penjenamaan, warna, dan pembungkusan. Daripada pengubahsuaian kecil hingga kejuruteraan khas sepenuhnya.
      icon: tabler:adjustments
    - title: MOQPensampelan Rendah dan Pantas
      description: ': RIB2-5 unit (acuan sedia ada). SUP: 5-10 unit setiap SKU. Acuan khas: 200+ unit. Sampel pra-pengeluaran dengan penjenamaan anda dalam 7-14 hari.'
      icon: tabler:rocket
    - title: Kualiti Sedia Pengeluaran
      description: Setiap unit diuji tekanan pada 1.25x dinilai PSI selama 24-48 jam. Kadar bebas kecacatan 99.3% bagi AQL setiap 2.5 / ISO 2859. Senarai semak kualiti 100 mata bagi setiap badan kapal.
      icon: tabler:certificate
    - title: Dokumentasi Pematuhan Penuh
      description: CE mengikut 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI audit sosial, REACH pematuhan, UKCA penandaan. Data DoC dan plat pembina khusus model disertakan.
      icon: tabler:file-certificate
    - title: Masa Penyediaan 30-45 Hari
      description: Pengeluaran standard 30-45 hari FOB Qingdao. Prototaip 7-14 hari. Pengeluaran segera tersedia. Pelan pemuatan kontena dan peti ISPM-15 disertakan.
      icon: tabler:truck-delivery
    - title: Selepas Jualan & Alat Ganti
      description: Jaminan 5 tahun untuk bot/kayakRIBs/, 2 tahun untuk SUP/aksesori. Bekalan alat ganti dengan penghantaran keutamaan. Sokongan pemprosesan tuntutan jaminan.
      icon: tabler:lifebuoy
