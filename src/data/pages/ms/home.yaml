faqs:
  title: SUP Soalan Lazim Pemesanan & Produk
  subtitle: Soalan lazim tentang papan pelepasan SUP kami, pesanan, pembayaran, penghantaran, dan jaminan.
  columns: 2
  items:
    - title: Adakah SUP sukar untuk dipelajari?
      description: Tidak sama sekali. Kebanyakan pemula berdiri dan mendayung dalam sesi pertama mereka. Papan SUP serba boleh kami menampilkan platform yang luas dan stabil yang direka khusus untuk pendayung kali pertama. Mulakan di air yang tenang dan anda akan meluncur dalam beberapa minit.
      icon: tabler:swimming
      category: sup
    - title: Apakah had berat?
      description: Sokongan serba boleh kami SUPs sehingga 220 lbs dan platform pelancongan serta yoga menyokong sehingga 250 lbs. Setiap halaman produk menyenaraikan kapasiti berat penunggang yang tepat supaya anda boleh menyesuaikan papan dengan keperluan anda.
      icon: tabler:adjustments
      category: sup
    - title: Bolehkah saya melakukan perjalanan dengan kembung SUP?
      description: Sudah tentu. Setiap papan Paddle Board Overstock dimasukkan ke dalam bekas pembawa bersaiz beg galas. Dengan berat hanya 18-22 lbs, ia mudah dibawa ke pantai, tasik, atau melalui terminal lapangan terbang. Semak polisi bagasi syarikat penerbangan anda sebelum perjalanan.
      icon: tabler:truck-delivery
      category: sup
    - title: Apa yang terdapat dalam kotak?
      description: Setiap Paddle Board Overstock SUP termasuk papan, beg galas perjalanan, pam tangan, dayung yang boleh dilaras, sirip boleh tanggal, tali gegelung, dan kit pembaikan.
      icon: tabler:clipboard-list
      category: sup
    - title: Mengapa harga anda lebih rendah daripada runcit?
      description: Kami menjual lebihan stok kilang dan batch pelepasan terus dari fasiliti pengeluaran kami sendiri di Weihai, China — tiada orang tengah, tiada kenaikan harga runcit. Itu bermakna pakej SUP lengkap dengan diskaun sehingga 60% daripada harga runcit biasa, dengan kualiti yang disahkan CE yang sama.
      icon: tabler:certificate
      category: orders
    - title: Bagaimana saya membuat pesanan dan membayar?
      description: Tambah pakej SUP anda ke dalam troli dan bayar dengan selamat melalui Stripe atau PayPal. Kami menerima semua kad kredit dan debit utama. Setiap pesanan disahkan melalui e-mel dengan invois penuh.
      icon: tabler:file-text
      category: orders
    - title: Adakah anda menghantar ke seluruh dunia?
      description: Ya. Kami menghantar ke 50+ negara di seluruh EU, Amerika Utara, Asia-Pasifik, Timur Tengah, dan Afrika. Pesanan yang ada dalam stok biasanya dihantar dalam 2-3 hari bekerja dengan nombor penjejakan untuk setiap bungkusan.
      icon: tabler:route
      category: orders
    - title: Apakah jaminan yang termasuk pada papan SUP?
      description: 'Setiap papan SUP dan aksesori dilindungi oleh jaminan 2 tahun — termasuk papan itu sendiri, sambungan drop-stitch, dan injap inflasi. Tuntutan diselesaikan dalam beberapa hari, bukan minggu: hantar secara dalam talian dan kami akan membaiki atau menggantinya.'
      icon: tabler:lifebuoy
      category: orders
