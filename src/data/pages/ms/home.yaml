      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Kekuatan Kilang
  title: Pembuatan Sedia-Audit<br />di Qingdao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12,000 m² ISO Kemudahan 9001 — Pengilang Sebenar, Bukan Syarikat Perdagangan</h3>
  items:
    - title: 6 Barisan Pengeluaran Terdedikasi
      description: Barisan RIB, bot tiup, SUP, kayak, peralatan keselamatan, dan OEM/ODM yang berasingan. Setiap satu mempunyai titik QC dan perancangan pengeluaran sendiri.
    - title: 100% Ujian Tekanan
      description: Setiap ruang tiup dipam pada 1.25x PSI yang dinilai dan ditahan selama 24-48 jam. Keputusan ujian dikaitkan dengan nombor siri pelampung (HIN).
    - title: Kebolehlacakan Setiap Pelampung
      description: 'Rekod pengeluaran per tahap HIN dengan 21 bidang data + setiap pelampung: kumpulan bahan, ID pengeluar kimpalan, keputusan ujian tekanan, konfigurasi akhir, dan destinasi penghantaran.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Kemudahan pembuatan 12,000 m² ISO 9001 di Qingdao dengan barisan pengeluaran RIB
content_compliance:
  tagline: Pematuhan & Bukti Kualiti
  title: Bukti Terdokumentasi,<br />Bukan Sekadar Tuntutan
  subtitle: Setiap tuntutan pematuhan disokong oleh dokumentasi spesifik model untuk pengesahan anda.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Sistem pengurusan kualiti diperakui oleh TÜV Rheinland/SGS. Audit pengawasan tahunan. Proses QC yang didokumentasi dari bahan masuk hingga pelepasan penghantaran.
      icon: tabler:certificate
    - title: CE mengikut 2013/53/EU (RCD)
      description: 64 model dengan Deklarasi Keserasian spesifik per model. Penilaian keserasian mengikut modul yang terpakai. Pendaftaran HIN dan data plat pembina untuk setiap pelampung.
      icon: tabler:file-certificate
    - title: BSCI Pematuhan Sosial
      description: Audit tahunan BSCI oleh SGS. Memeriksa amalan buruh beretika, keselamatan tempat kerja, dan pengurusan alam sekitar di seluruh kemudahan kami.
      icon: tabler:users
    - title: REACH & UKCA
      description: Semua PVC dan bahan pelekat mematuhi peraturan EU REACH. Penandaan UKCA tersedia untuk pasaran UK. Lembaran data keselamatan bahan boleh diminta.
      icon: tabler:shield-check
