content_compliance:
  tagline: Kualiti & Pengujian
  title: Kualiti Diuji,<br />Didokumenkan
  subtitle: Setiap tuntutan kualiti disokong oleh nombor sebenar daripada barisan pengeluaran kami — ujian tekanan, rekod kelompok dan kadar kecacatan yang diukur.
  items:
    - title: 100% Diuji Tekanan
      description: Setiap papan dinaikkan kepada 1.25x nilai PSI dan dipegang sebelum ia dihantar. Jika jahitan, injap, atau benang jahitan jatuh gagal, papan tidak akan meninggalkan kilang.
      icon: tabler:shield-check
    - title: 99.3% Kadar Tanpa Kecacatan
      description: Diukur merentas setiap kumpulan pengeluaran. Nombor itu datang daripada rekod pemeriksaan akhir kami sendiri — bukan pemasaran.
      icon: tabler:gauge
    - title: Keterkesanan Jejak Kumpulan
      description: Setiap papan membawa kod kelompok pengeluaran, jadi tuntutan jaminan dan pemeriksaan kualiti dikesan kembali kepada bahan dan larian yang tepat.
      icon: tabler:clipboard-check
    - title: Jaminan SUP 2 Tahun
      description: Setiap papan SUP dan aksesori dilindungi selama 2 tahun — sambungan drop-stitch, injap inflasi, dan aksesori termasuk. Tuntutan diselesaikan dengan cepat.
      icon: tabler:lifebuoy
