hero:
  tagline: Cerita Kami
  title: Aquafarer — Kejuruteraan Kebebasan Di Air
  subtitle: 'Dari bengkel pesisir pantai ke pengeluar marin global — perjalanan kami dibina atas kepercayaan yang teguh: kenderaan air harus direka kejuruteraan seolah-olah ia penting, kerana ia memang penting.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer kilang dan fasiliti pembuatan marin di Qingdao
