timeline:
  - year: '2012'
    title: Asas Pembuatan Marin
    body: Aquafarer bermula sebagai bengkel khusus kenderaan air tiup di Qingdao, China, yang komited terhadap kemahiran marin dan pembuatan bot tiup. Fokus awal adalah membina produk tiup yang boleh dipercayai melalui pengalaman kejuruteraan praktikal dan disiplin pembuatan.
  - year: '2015'
    title: Eksport Pertama & CE Pensijilan
    body: Pesanan eksport awal mencapai Jepun dan Korea. Pensijilan CE dicapai untuk barisan produk utama, menandakan kemasukan Aquafarer ke pasaran antarabangsa. Syarikat mula berkhidmat kepada pengguna komersial dan rekreasi di luar China.
  - year: '2018'
    title: Pengembangan Kilang
    body: Berpindah ke fasiliti pengeluaran seluas 12,000 m². Menambah talian kimpalan RF dan kapasiti pengeluaran drop-stitch, membolehkan pembuatan skala lebih besar dan sistem kawalan kualiti yang diperbaiki.
  - year: '2020'
    title: Pusat R&D Ditubuhkan
    body: Membuka pusat R&D khusus dengan makmal kain PVC, tangki ujian hidrodinamik, dan studio simulasi CAD/FEA. Pembangunan produk diperluas untuk menumpukan pada pembinaan ringan, ketahanan yang diperbaiki, dan reka bentuk berpusatkan pengguna.
  - year: '2022'
    title: Pensijilan & Pertumbuhan Global
    body: Mencapai pensijilan ISO 9001. Memperluas kepada 14 jurutera R&D dan 200+ pekerja. Produk mencapai pelanggan di seluruh Eropah, Amerika, dan Asia-Pasifik melalui pengedar dan perkongsian OEM.
  - year: '2024'
    title: Inovasi & Studio Reka Bentuk
    body: Melancarkan studio reka bentuk dan inovasi perkhidmatan penuh untuk projek ODM tersuai, dari konsep hingga pengeluaran. Memperkukuh aplikasi marin profesional termasuk penyelamatan, komersial, dan tender kerajaan.
  - year: '2026'
    title: Membina Masa Depan Eksplorasi Air
    body: Hari ini, Aquafarer terus membangunkan bot tiup, sistem SUP, dan penyelesaian marin tersuai — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara dilayani, kapasiti tahunan 15,000 unit.
content_founding:
  tagline: Permulaan
  title: Lahir Di Tepi Air
  subtitle: 'Aquafarer bermula di bengkel pesisir pantai di Qingdao dengan satu bot dan satu visi: untuk membina kenderaan air tiup yang mampu menghadapi keadaan marin sebenar.'
  paragraphs:
    - Pada 2012, pengasas kami melihat kekosongan di pasaran — kebanyakan bot tiup sama ada mampu milik tetapi tidak boleh dipercayai, atau berkualiti tinggi tetapi terlalu mahal. Mereka percaya terdapat ruang untuk pengeluar yang menawarkan kedua-dua kualiti dan nilai.
    - Badan kapal pertama dibina secara manual, diuji di perairan tempatan, dan diperhalusi berdasarkan maklum balas sebenar daripada nelayan dan pengendali komersial kecil. Gelung maklum balas itu — bina, uji, dengar, tambah baik — kekal sebagai teras falsafah kejuruteraan kami hari ini.
    - Menjelang 2015, berita telah tersebar melangkaui Qingdao. Pengedar antarabangsa mula meminta sampel. Apa yang bermula sebagai bengkel tempatan kini menjadi pembekal global.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Bengkel pengeluaran awal dan pembuatan
content_growth:
  tagline: Pertumbuhan & Inovasi
  title: Dari Bengkel ke Kemudahan seluas 12,000 m²
  subtitle: Pelaburan berterusan dalam manusia, peralatan, dan proses telah berubah Aquafarer menjadi kemudahan pembuatan marin moden.
  paragraphs:
    - Apabila permintaan meningkat, kemudahan kami juga meningkat. Kami berkembang dari bengkel kecil kepada kilang seluas 12,000 m² dengan barisan pengeluaran khusus untuk RIB bot, bot tiup, SUP papan dan aksesori.
    - Kami melabur dalam CNC mesin pemotong, peralatan kimpalan frekuensi tinggi, barisan pengeluaran jahitan jatuh, dan rig ujian menyeluruh — membolehkan kami mengawal setiap aspek kualiti pengeluaran.
    - Hari ini, pasukan kami seramai 200-300 orang terdiri daripada jurutera marin, saintis bahan, pakar kawalan kualiti, dan tukang mahir — ramai di antara mereka telah bersama Aquafarer sejak zaman awal.
founder:
  tagline: Kenali Pengasas
  title: Dibina oleh Seorang Pengangkut Air
  subtitle: Pengasas David Chen menggabungkan kepakaran pembuatan dan minat seumur hidup terhadap sukan air — gabungan yang menentukan cara Aquafarer membangunkan produk.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Pengasas Aquafarer
  story:
    - David Chen membesar di pantai Qingdao, di mana laut bukanlah destinasi percutian tetapi cara hidup. Beliau menghabiskan zaman mudanya dengan berkayak, belayar, dan memancing di Laut Kuning — pengalaman yang memberinya pemahaman intuitif tentang apa yang perlu dihadapi oleh kenderaan air.
    - Sebelum menubuhkanAquafarer, David menghabiskan satu dekad dalam pembuatan marin, bekerja merentasi pengeluaran, kualiti, dan perdagangan antarabangsa. Beliau menguruskan OEM program untuk jenama Eropah dan Amerika Utara, mempelajari piawaian dan jangkaan pasaran global secara langsung.
    - 'Pada tahun 2012, beliau menubuhkan Aquafarer dengan misi mudah: membina kenderaan air boleh tiup yang akan dipercayai bersama keluarganya sendiri di atas air. Standard peribadi itu — adakah saya akan menggunakannya? — kekal sebagai ujian terakhir untuk setiap produk yang keluar dari kilang.'
    - Hari ini, David mengetuai strategi produk dan mengawasi pasukan R&D, secara peribadi mengkaji reka bentuk baru dan menguji prototaip di perairan luar Qingdao. Beliau percaya bahawa produk hebat datang daripada memahami kedua-dua aspek kejuruteraan dan pengalaman.
philosophy:
  tagline: Falsafah Jenama
  title: Kebebasan Kejuruteraan Di Air
  body: Kebebasan di atas air bukan sekadar tentang pergerakan. Ia mewakili penemuan tempat baru, mencipta pengalaman luar, menghubungkan orang dengan alam semula jadi, dan membolehkan misi profesional. Kejuruteraan menjadikan kebebasan itu mungkin.
  pillars:
    - title: Kebolehpercayaan Diutamakan
      body: Persekitaran air memerlukan kepercayaan.Aquafarer Produk direka berdasarkan kestabilan, ketahanan, keselamatan, dan prestasi yang konsisten.
    - title: Reka Bentuk Berpusatkan Manusia
      body: Produk harus berkhidmat kepada manusia, bukan teknologi. Setiap keputusan reka bentuk bermula dengan memahami bagaimana orang menggunakan kenderaan air, di mana mereka meneroka, dan cabaran yang mereka hadapi.
    - title: Eksplorasi Mudah Diakses
      body: Air tidak seharusnya dimiliki oleh pakar sahaja.Aquafarer mewujudkan peralatan yang membolehkan lebih ramai orang mengalami sungai, tasik, lautan, dan persekitaran pesisir dengan selamat.
    - title: Inovasi berterusan
      body: Inovasi bukan sahaja mencipta produk baru. Ia memperbaiki setiap perincian — bahan, struktur, pembuatan, dan pengalaman pengguna.
engineeringDna:
  tagline: DNA Kejuruteraan
  title: Cara Aquafarer Mencipta Produk
  areas:
    - title: Sains Bahan
      body: Aquafarer menumpukan pada pemilihan bahan yang sesuai untuk pelbagai persekitaran marin. Pertimbangan utama termasuk ketahanan terhadap haus geseran, UV ketahanan, kestabilan tekanan, dan ketahanan jangka panjang.
      items:
        - Rintangan Lelasan
        - Rintangan UV
        - Kestabilan Tekanan
        - Ketahanan Jangka Panjang
    - title: Kejuruteraan Struktur
      body: Kenderaan air tiup memerlukan keseimbangan yang tepat antara kekukuhan, berat, kebolehbawaan, dan kestabilan. Kejuruteraan Aquafarer menumpukan pada pengoptimuman faktor-faktor ini melalui teknologi teras drop-stitch dan pembinaan jahitan yang maju.
      items:
        - Kekukuhan
        - Pengoptimuman Berat
        - Mudah alih
        - Kestabilan
    - title: Ketepatan Pembuatan
      body: 'Setiap produk melalui proses terkawal: penyediaan bahan, pemotongan tepat, pengelasan dan pengikatan, pemasangan, pemeriksaan kualiti, dan pengesahan prestasi.'
      items:
        - Penyediaan Bahan
        - Pemotongan Tepat
        - Pengelasan & Pengikatan
        - Pemasangan & QC
    - title: Kejuruteraan Senario Pengguna
      body: Produk dibangunkan berdasarkan aplikasi sebenar — rekreasi, pengembaraan, dan penggunaan profesional — memastikan setiap reka bentuk memenuhi keperluan spesifik persekitaran yang dituju.
      items:
        - Rekreasi
        - Pengembaraan
        - Professional
        - Komersil
