      name: Wang Fang
      description: 12+ tahun dalam kawalan kualiti marin. Bertauliah CE dan ISO juruaudit. Mengawasi ujian untuk setiap kumpulan pengeluaran.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Pengarah Jualan & Operasi
      name: Helen Lee
      description: 15+ tahun dalam perdagangan B2B antarabangsa. Menguruskan perkongsian OEM/ODM di 30+ negara. Fasih dalam 4 bahasa.
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Falsafah Rekabentuk
  title: Rekabentuk Berpandukan Kejuruteraan<br />— Setiap Butiran Penting
  subtitle: Falsafah kejuruteraan kami berpusat pada tiga prinsip yang membimbing setiap produk yang kami bina.
  list:
    - 'Keandalan Utama: Setiap produk diuji untuk menahan keadaan dunia sebenar — dari operasi menyelamat air sejuk hingga sewaan resort tropika. Kami membuat rekabentuk berlebihan di mana ia paling penting.'
    - 'Ketepatan Pengilangan: Kemudahan kami menggunakan pemotongan canggih, kimpalan berfrekuensi tinggi, dan ujian tekanan automatik. Setiap jahitan, setiap injap, setiap sambungan memenuhi spesifikasi yang didokumenkan.'
    - 'Inovasi Berterusan: Pasukan R&D kami sentiasa menilai bahan baru, kaedah pengeluaran, dan penambahbaikan rekabentuk. Kami tidak menunggu masalah — kami menjangka mereka.'
