hero:
  tagline: Pasukan Kami
  title: Orang-Orang di Sebalik Aquafarer<br />— Kejuruteraan Kebebasan di Air
  subtitle: Ditubuhkan pada 2012 di Qingdao, China, Aquafarer dibina oleh jurutera marin, saintis bahan, dan peminat sukan air yang percaya dalam menjadikan kenderaan air tiup profesional mudah diakses di seluruh dunia.
  image:
    src: /images/team-all.webp
    alt: Aquafarer foto penuh pasukan — kejuruteraan, pengeluaran, dan kepimpinan
founding:
  tagline: Penubuhan Kami
  title: Dari Bengkel Pesisir<br />ke Fasiliti 12,000 m²
  subtitle: Aquafarer ditubuhkan oleh sekumpulan jurutera marin dengan pengalaman gabungan berdekad-dekad dalam reka bentuk bot tiup, pembuatan PVC/Hypalon, dan pengilangan peralatan marin global.
  items:
    - title: 'Ditubuhkan: 2012'
      description: Ditubuhkan di Qingdao, China — pusat maritim utama dengan warisan pembinaan kapal yang mendalam.
      icon: tabler:calendar
    - title: 200-300 Pekerja
      description: Termasuk 50+ jurutera R&D, pakar kawalan kualiti, dan juruteknik pengeluaran.
      icon: tabler:users
    - title: Fasiliti 12,000 m²
      description: Planta pengeluaran khusus dengan 6 garis pengeluaran untuk RIBs, bot tiup, dan papan SUP.
      icon: tabler:building-factory
    - title: 50+ Negara Disediakan
      description: Mengeksport ke Eropah, Amerika, Timur Tengah, Asia Pasifik, dan Afrika.
      icon: tabler:globe
leadership:
  tagline: Kepimpinan
  title: Kepimpinan Pengurusan & Kejuruteraan
  subtitle: Pasukan kepimpinan kami menggabungkan kepakaran mendalam dalam kejuruteraan marin, perdagangan antarabangsa, dan pengurusan kualiti.
  columns: 3
  items:
    - title: Pengasas & CEO
      name: Toby Liu
      description: 15+ tahun dalam pembuatan marin. Sebelumnya mengetuai R&D di pengeluar bot utama China. Memegang beberapa paten dalam reka bentuk bot tiup.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: Ketua Jurutera
      name: Zhang Wei
      description: 20+ tahun dalam pembuatan PVC/Hypalon dan reka bentuk hull V-dalam. Bekas pengarah teknikal di sebuah firma kejuruteraan marin Eropah.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ketua R&D
      name: Chen Ming
      description: PhD dalam Sains Bahan. Mahir dalam teknologi drop-stitch dan proses kimpalan frekuensi tinggi. 10+ tahun dalam komposit tekstil.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Pengarah Pengeluaran
      name: Liu Qiang
      description: 18 tahun dalam pembuatan lean dan pengoptimuman lini produksi. Tali Hitam Six Sigma. Telah melaksanakan sistem kualiti ISO 9001.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
