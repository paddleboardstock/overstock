content_challenge:
  tagline: Cabaran
  title: Keperluan Operasi Penyelamatan<br />Kebolehpercayaan Tanpa Kompromi
  subtitle: Organisasi carian dan penyelamatan beroperasi dengan tanggungjawab keselamatan yang ekstrem — setiap kegagalan bot membawa akibat yang tidak dapat diterima.
  paragraphs:
    - Dalam operasi penyelamatan, sempadan antara kejayaan dan kegagalan diukur dalam minit. Bot mesti bersedia untuk dilancarkan segera, beroperasi dalam keadaan kasar, dan kembali dengan selamat bersama penumpang. Tanggungjawab keselamatan adalah mutlak — kegagalan mekanikal semasa misi penyelamatan bukanlah kos pembaikan, ia adalah nyawa yang hilang.
    - Bot SAR memerlukan kelajuan tinggi untuk sampai kepada mangsa dengan cepat, digabungkan dengan kestabilan luar biasa untuk operasi pemulihan yang selamat. Mereka mesti membawa peralatan penyelamatan, bekalan perubatan, dan peralatan komunikasi — selalunya dalam ruang dek yang terhad. Bot yang beroperasi dalam perkhidmatan kerajaan juga memerlukan jangka hayat perkhidmatan panjang (10-15+ tahun) untuk membenarkan belanjawan perolehan awam.
    - Kebolehlihatan, baik untuk pengendali mahupun untuk pencarian, adalah kritikal. Reka bentuk konsol mesti menyediakan kebolehlihatan 360 darjah, dan bot harus sangat jelas kelihatan untuk pesawat dan kapal lain.
    - Aquafarer bot penyelamat RIBs direka dari lunas ke atas untuk keperluan ini — dengan dek membuang air sendiri, lambung diperkuat, suite navigasi, dan tiang tali tunda standard pada model patroli.
content_solution:
  tagline: Penyelesaian Kami
  title: Penyelamat Reka Khusus RIBs
  subtitle: Setiap Aquafarer bot penyelamat direka untuk memenuhi atau melebihi standard SOLAS dan SAR nasional.
  list:
    - Dek membuang air sendiri — air mengalir secara automatik untuk kestabilan semasa operasi pemulihan
    - Lambung V-dalam diperkuat — kemampuan air kasar dengan pengendalian yang boleh diramalkan pada kelajuan
    - Suite lampu navigasi penuh — beroperasi siang dan malam dalam semua keadaan cuaca
    - Tiang dan tali tunda — siap untuk operasi tunda kapal atau kereta luncur penyelamat
    - Plat pemasangan peralatan — radio, lampu sorot, siren, dan peralatan perubatan
    - Pelbagai konfigurasi enjin — enjin luar tunggal atau kebergantungan enjin berkembar
    - Warna tiub yang mudah dilihat — oren, kuning, atau merah untuk keterlihatan maksimum
content_segments:
  tagline: Profil Penyelamatan
  title: Penyelesaian Kapal Air Cari & Selamat<br />Mengikut Jenis Organisasi
  subtitle: Organisasi penyelamatan yang berbeza beroperasi di bawah mandat, kitaran bajet, dan persekitaran operasi yang berbeza — dari kru sukarelawan pantai hingga armada pengawal pantai kebangsaan. Kami mengkonfigurasi setiap penyelamatan RIB untuk menepati profil misi.
  items:
    - title: Agensi SAR Pengawal Pantai & Kerajaan
      subtitle: Tanggungjawab keselamatan mutlak — standard armada kritikal misi
      description: Agensi SAR kerajaan memikul tanggungjawab keselamatan tertinggi dalam operasi maritim. Setiap bot mesti berfungsi tanpa kesilapan dalam keadaan ekstrem — kegagalan peralatan semasa misi penyelamatan bukan pilihan. Keputusan perolehan didorong oleh jumlah kos pemilikan sepanjang hayat perkhidmatan 10-15 tahun, bukan harga awal. Agensi memerlukan kapal yang dapat bertahan bertahun-tahun dalam rondaan pantai, memenuhi standard kebangsaan yang ketat, dan memberikan prestasi konsisten di stesen yang berbeza. Dokumentasi pematuhan menyeluruh dan perjanjian servis berbilang tahun adalah wajib.
      features:
        - Pakej dokumentasi pematuhan SOLAS dan standard SAR kebangsaan
        - Kesamaan komponen di seluruh armada — mengurangkan kerumitan inventori di peringkat stesen
        - Konfigurasi enjin berkembar untuk kebergantungan kritikal misi
        - Reka bentuk hayat perkhidmatan 10-15 tahun dengan program penyelenggaraan berjadual
        - Keupayaan serba cuaca — hull deep-V yang diperkuat untuk keadaan laut yang bergelora
    - title: Perkhidmatan Penjaga Pantai & Penyelamatan Pantai
      subtitle: Operasi pelancaran cepat di perairan cetek
      description: Perkhidmatan penjaga pantai dan tepi pantai bandar yang memerlukan kapal tindak balas pantas yang boleh dilancarkan melalui zon ombak, beroperasi di perairan cetek dalam negeri, dan mencapai perenang atau kapal yang dalam kesusahan dalam beberapa minit. Peralatan mesti cukup ringan untuk ditarik ke pantai oleh kenderaan kecil atau secara manual.
      features:
        - Hull RIB cetek untuk operasi zon ombak dan inshore
        - Boleh dilancarkan dari pantai dengan pemegang depan dan pelindung lunas
        - Sled penyelamatan atau platform penyelam penyelamat bersepadu
        - Warna tiub oren atau kuning yang mudah dilihat adalah standard
    - title: Jabatan Penyelamat Kebakaran
      subtitle: Integrasi pam kebakaran, pemasangan peralatan, tindak balas cepat
      description: Unit marin penyelamat kebakaran bertindak balas terhadap kebakaran struktur tepi air, kebakaran kapal, dan insiden penyelamatan berasaskan air. Bot ini mesti membawa pam kebakaran, monitor, penyimpanan hos, dan alat pernafasan — semuanya dipasang pada platform stabil dan tindak balas pantas. Jabatan juga menggunakan kapal ini untuk tindak balas banjir dan operasi bantuan bersama. Susun atur konsol mesti dapat menampung kawalan pam, sistem radio, dan lampu kecemasan tanpa menjejaskan ruang dek untuk pergerakan kru.
      features:
        - Monitor kebakaran dipasang di depan dengan pakej integrasi pam
        - Pemasangan peralatan khusus untuk pam kebakaran, penyimpanan hos, dan set BA
        - Susun atur konsol boleh dikonfigurasi untuk kawalan pam, radio, dan lampu kecemasan
        - Dek membasuh sendiri untuk aliran air pemadam kebakaran dan kestabilan
        - 'Pakej operasi malam: lampu sorot, lampu adegan, bar lampu biru/merah'
    - title: Polis Marin & Keselamatan Pelabuhan
      subtitle: Operasi sekatan, rondaan, menaiki pesawat
      description: Unit penguatkuasaan undang-undang marin memerlukan kapal yang mampu mengejar berkelajuan tinggi, menaiki kapal yang disyaki, dan rondaan keselamatan pelabuhan. Bot-bot ini mesti mempunyai simpanan selamat untuk peralatan penguatkuasaan dan senjata, integrasi komunikasi dengan komando darat, dan ruang dek yang mencukupi untuk operasi pasukan menaiki kapal. Keupayaan operasi malam dan pendekatan berprofil rendah adalah penting untuk misi interdiksi.
      features:
        - Keupayaan pengejaran berkelajuan tinggi — badan kapal terbang dengan+ kelajuan maksimum 40 knot
        - Ruang simpanan senjata dan peralatan penguatkuasaan yang selamat
        - Integrasi konsol untuk radio polis, MDT, dan sistem komunikasi
        - 'Pakej operasi malam: lampu sorot IR, pemasangan FLIR, pencahayaan tersembunyi'
        - Platform menaiki yang diperkuat dengan permukaan anti-gelincir
        - Sistem pencahayaan kecemasan dan siren biru/merah
    - title: Sukarelawan SAR & Organisasi Bukan Untung
      subtitle: Operasi pesisir dan tasik berasaskan komuniti yang dibiayai geran
      description: Kumpulan penyelamat berasaskan komuniti beroperasi di tasik, sungai, dan kawasan pesisir di mana liputan SAR kerajaan adalah terhad. Selalunya dibiayai oleh sumbangan atau geran kerajaan, organisasi-organisasi ini memerlukan keupayaan maksimum setiap dolar — sebuah kapal yang boleh dipercayai dan rendah penyelenggaraan yang boleh dikendalikan oleh sukarelawan dengan selamat dengan latihan khusus yang minimum. Kitaran perolehan geran bermakna bot mesti memenuhi keperluan pematuhan sambil kekal dalam bajet tetap.
      features:
        - Konfigurasi luar tunggal yang dioptimumkan untuk kos pemerolehan dan operasi yang lebih rendah
        - PVC pembinaan untuk penyelenggaraan rendah dan pembaikan lapangan yang mudah
        - Konsol pelbagai fungsi meminimumkan kerumitan elektronik untuk pengendali sukarelawan
        - Pakej dokumentasi pematuhan geran untuk permohonan pembiayaan
        - Reka bentuk ringan untuk pelancaran pantai tanpa treler atau kren khusus
    - title: Penyelamatan Banjir & Tindak Balas Bencana
      subtitle: Banjir pedalaman, air cetek, persekitaran yang sarat dengan serpihan
      description: Penyelamatan banjir adalah profil operasi yang tersendiri — bot beroperasi di kawasan bandar yang banjir, arus yang dipenuhi serpihan, dan air yang sangat cetek di mana halangan yang tenggelam tidak kelihatan. Pengendali memerlukan kapal yang boleh menavigasi jalan yang banjir, menolak serpihan, dan mengeluarkan mangsa dari bangunan dan kenderaan. Keupayaan cetek adalah kritikal, begitu juga keupayaan untuk beroperasi dalam arus yang mempunyai bahaya tersangkut. Bot ini sering digunakan oleh jabatan bomba, pertahanan awam, dan NGO bantuan bencana.
      features:
        - Badan kapal dengan draf sangat cetek — beroperasi dalam kedalaman 30-50 cm
        - Perlindungan haluan dan tiub diperkuat untuk halangan tenggelam
        - Dek bailing sendiri untuk aliran air banjir dan pemulihan mangsa
        - Tiub oren atau kuning berkelihatan tinggi untuk penglihatan udara
        - Reka bentuk ringan untuk pengangkutan helikopter dan penempatan jalan raya
        - Titik angkat yang diperkuat untuk operasi angkat dan penyelamatan tali
