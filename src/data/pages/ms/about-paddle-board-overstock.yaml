hero:
  tagline: Tentang
  title: Mengenai Paddle Board Overstock
  subtitle: Sejak 2012, kami telah meletakkan papan kembung baharu SUP di tangan para pendayung dan peruncit kecil di 50+ negara — inventori stok berlebihan, harga yang adil, dan jaminan yang benar-benar kami hormati.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock papan kembung baharu SUP
direct_answer: Paddle Board Overstock ialah jenama peralatan sukan air yang diasaskan pada tahun 2012 dan berpusat di Weihai, China. Kami menjual papan kembung baharu SUP daripada inventori lebihan — gabungan lebihan pengeluaran dari asas pembuatan kami sendiri dan stok yang dipilih dengan teliti dari kilang rakan kongsi — terus kepada pendayung akhir dan peruncit kecil di 50+ negara. Setiap papan diuji tekanan 100%, disokong oleh SUP Jaminan 2 Tahun, dan dihantar melalui kargo ekspres atau laut.
tldr_points:
  - Ditubuhkan pada tahun 2012, berpusat di Weihai, China — salah satu SUP hab pembuatan utama dunia
  - 'Model lebihan stok: papan baru pada harga di bawah runcit, tiada orang tengah'
  - 'Inventori adalah sumber campuran: lebihan pengeluaran dari asas kami serta stok kilang rakan kongsi yang telah disemak'
  - 50+ negara dilayan, kadar lulus pemeriksaan akhir 99.3%, Jaminan 2 Tahun SUP
story_section:
  tagline: Cerita Kami
  title: Mengapa Kami Menjual Stok Berlebihan
  paragraphs:
    - Paddle Board Overstock bermula pada tahun 2012 di Weihai, China — sebuah bandar pesisir di wilayah Shandong yang telah berkembang menjadi salah satu hab pembuatan kembung paling penting di dunia SUP . Dari pangkalan itu, kami telah menghabiskan lebih sedekad membuat papan dayung kembung dan menghantarnya ke seluruh dunia.
    - Along the way we noticed something that shapes everything we do today: Setiap musim pengeluaran meninggalkan papan baru yang masih sempurna — lebihan keluaran, pesanan yang dibatalkan, warna musim lalu. Sementara itu, peruncit bebas di seluruh dunia terkunci untuk borong kerana pembekal tradisional menuntut pesanan bersaiz kontena.
    - Jurang itu adalah perniagaan kami. Dengan menjual inventori lebihan — lebihan pengeluaran dari pangkalan Weihai kami sendiri, serta stok yang dipilih dengan teliti dari kilang rakan kongsi — kami boleh menawarkan papan baru pada harga jauh di bawah runcit biasa, dalam kuantiti yang sesuai untuk satu pendayung atau pesanan kedai lima papan. Tiada yang terpakai, tiada yang kedua; ia hanyalah inventori yang layak mendapat pelanggan dan bukannya gudang.
model_section:
  tagline: Model Perniagaan Kami
  title: Bagaimana Model Overstock Berfungsi
  items:
    - title: Serba Baru, Tidak Pernah Digunakan
      description: Setiap papan yang kami jual adalah baru dan tidak digunakan. Stok berlebihan bermaksud lebihan dan inventori berlebihan — bukan pemulangan, bukan pengubahsuaian, bukan kedua.
    - title: Inventori Sumber Campuran
      description: Stok kami menggabungkan lebihan pengeluaran dari pangkalan pembuatan Weihai kami sendiri dengan inventori yang dipilih dari kilang rakan kongsi yang kami pegang pada tahap kualiti yang sama. Sumber adalah bercampur; piawaian tidak.
    - title: Harga di bawah runcit
      description: Stok lebihan menelan kos yang lebih rendah untuk kami dapatkan, jadi kos pembelian anda lebih murah. Tiada harga senarai yang dibesar-besarkan, tiada diskaun palsu — hanya harga yang jujur pada inventori sebenar.
    - title: Borong Mesra Perniagaan Kecil
      description: Borong bermula pada 5 papan, bukan muatan kontena. Peruncit kecil boleh mencampurkan mana-mana model stok dalam satu pesanan dan memilih kargo ekspres atau laut.
    - title: Penghantaran Terus ke Anda
      description: Pesanan dihantar terus dari pangkalan logistik Weihai kami ke pintu anda di 50+ negara — ekspres untuk sampel dan pesanan kecil, kargo laut terkonsolidasi untuk borong.
quality_section:
  tagline: Kualiti & Jaminan
  title: Kualiti di Sebalik Setiap Papan
  subtitle: Penetapan harga stok berlebihan tidak bermakna piawaian yang longgar. Setiap lembaga — tidak kira sumbernya — melalui proses yang sama sebelum dihantar.
  items:
    - title: 100% Diuji Tekanan
      description: Setiap papan diuji tekanan dan dipam sehingga 15 PSI sebelum dihantar. Tiada papan yang dihantar tanpa diuji, tidak kira dari mana inventori asalnya.
    - title: Ujian Beban Berlebihan hingga 1.25x
      description: Papan daripada pengeluaran kami diuji sampel melampaui tekanan yang ditetapkan — ditahan pada 1.25x tekanan kerja selama 24–48 jam untuk mengesahkan sambungan, injap, dan pembinaan drop-stitch.
    - title: Kadar Lulus Pemeriksaan Akhir 99.3%
      description: Proses pemeriksaan akhir kami meluluskan 99.3% papan sebagai bebas kecacatan — dan sebilangan kecil yang gagal tidak pernah dimasukkan ke inventori lebihan kami.
    - title: Jaminan SUP 2 Tahun
      description: Setiap papan SUP dilengkapi Waranti SUP 2 Tahun yang meliputi kecacatan pembuatan. Waranti yang sama terpakai untuk setiap pelanggan di semua 50+ pasaran kami.
