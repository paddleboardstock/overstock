team_section:
  tagline: Pasukan
  title: Orang di Sebalik Papan
  description: Pangkalan Weihai kami menempatkan pasukan penyelidikan dan pembangunan seramai 14+ orang yang merangkumi bahan, reka bentuk struktur, dan proses pengeluaran. Sekitar mereka beroperasi pasukan yang lebih luas yang menjalankan kawalan kualiti, inventori, logistik, dan sokongan yang anda hubungi apabila menghubungi kami — orang yang sama, sama ada anda membeli satu papan atau dua puluh papan.
