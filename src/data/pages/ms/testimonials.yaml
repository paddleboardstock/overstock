testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Pemilik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Kami bermula dengan Pakej Permulaan Kelab untuk sekolah selancar kami. 20 papan, dayung, jaket keselamatan — semuanya tiba dalam masa 3 minggu. Selepas dua musim, kami meningkatkan kepada Pakej Pro. Penjenamaan khusus dengan logo kami telah mengubah imej profesional kami.
    rating: 5
    product: Pakej Permulaan Kelab
    source: solutions/clubs
  - category: clubs
    name: Pemilik Kelab
    title: Kelab Sukan Air
    location: Phuket, Thailand
    content: Pakej Permulaan Kelab adalah titik permulaan yang sempurna. Apabila perniagaan kami berkembang, Paddle Board Overstock berkembang bersama kami — kualiti sama, harga sama, tiada kejutan. Kami meningkat dari 10 ke 80 papan dalam 18 bulan.
    rating: 5
    product: Pakej Permulaan Kelab + Pakej Premium
    source: success-stories
  - category: resorts
    name: Pengurus Besar Resort
    title: Resort Pantai 5-Bintang
    location: Greece
    content: Paddle Board Overstock bukan sahaja menghantar papan — mereka membantu kami membina pengalaman tetamu yang lengkap. Program sukan air kami meningkat dari sifar kepada tarikan utama resort dalam satu musim. 300+ tempahan mingguan dan $180K hasil tahunan.
    rating: 5
    product: Pakej Premium Resort
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Pengarah Pengalaman Tetamu, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock mereka bentuk dan melengkapi keseluruhan program aktiviti pantai kami di tiga hartanah resort. 80 SUPs, 40 kayak, infrastruktur keselamatan, dan latihan kakitangan — semua dihantar dalam satu penghantaran. Penyertaan tetamu meningkat 60% pada musim pertama.
    rating: 5
    product: Pakej Premium Resort
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Pengasas, Shoreline Paddle Co.
    location: California, USA
    content: Saya melancarkan jenama SUP saya dengan tiada pengalaman dalam industri. Pasukan Paddle Board Overstock membimbing saya dari pemilihan produk hingga reka bentuk logo tersuai dan pembungkusan. Kontena pertama saya tiba dalam 11 minggu, dan saya habis dijual dalam 3 bulan di Amazon.
    rating: 5
    product: Pelancaran Jenama Permulaan
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Pengasas
    title: Jenama SUP Australia
    location: Australia
    content: Saya mempunyai idea jenama tetapi tiada pengetahuan pembuatan. Paddle Board Overstock benar-benar memegang tangan saya sepanjang proses — dari memilih reka bentuk papan yang betul hingga membuka bungkusan penghantaran pertama saya. 90 hari dari impian ke penghantaran.
    rating: 5
    product: Pakej Pelancaran Jenama
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Pemilik, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Saya menyewa 5 papan dari kedai tempatan dan kehilangan 60% daripada hasil saya kepada mereka. Paddle Board Overstock membantu saya membina armada sendiri dengan 15 SUPs. Kalkulator ROI menunjukkan pulang modal dalam 4 bulan — ia mengambil masa 3 bulan. Kini saya mengembangkan kepada 30 papan.
    rating: 5
    product: Set Permulaan Armada
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Pengarah Operasi, Adriatic Adventure Tours
    location: Dubrovnik, Croatia
    content: Kami melengkapi seluruh armada penyewaan kami dengan Paddle Board Overstock RIBs — 12 bot di tiga lokasi. Dua musim berlalu, tiada kegagalan. Dokumen pensijilan CE memudahkan kelulusan insurans. Pasukan kejuruteraan mereka bahkan menyesuaikan warna tiub.
    rating: 5
    product: Kit Pengembangan Armada
    source: trust
  - category: rental
    name: Lt. Komander Andres Reyes
    title: Pegawai Perolehan Maritim, Bantuan Pengawal Pantai Filipina
    location: Manila, Filipina
    content: Kami mengendalikan 24 Paddle Board Overstock RIBs di seluruh armada rondaan pesisir kami. Proses QC mereka konsisten di setiap batch — kualiti jahitan yang sama, penempatan injap yang sama, penarafan tekanan yang sama setiap kali. Kebolehulangan itu penting ketika nyawa bergantung pada peralatan.
    rating: 5
    product: Armada Rondaan RIB
    source: trust
  - category: consumers
    name: Sarah K.
    title: Pemilik SUP untuk kali pertama
    location: Tasik Tahoe, USA
    content: Stabil walaupun untuk pemula sepenuhnya. Membawanya ke tasik pada hari pertama saya dan tidak jatuh. Pakej lengkap dengan pam dan paddle membolehkan saya berada di air 20 minit selepas membuka kotak.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Pemilik Explorer 11
    location: Vancouver, Kanada
    content: Sebagai pembeli kali pertama, saya gementar tentang kualiti apabila memesan dari luar negara. Dokumentasi ISO dan laporan ujian pihak ketiga yang mereka kongsi sebelum saya bertanya memberi saya keyakinan sepenuhnya. Papan sampai dalam 6 hari dan melebihi jangkaan saya.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Pengayuh Rekreasi
    location: Florida, USA
    content: Kualiti binaan yang kukuh. Mengendalikan ombak pantai jauh lebih baik daripada yang saya jangka daripada papan tiup. Memasukkannya ke dalam bonet kereta saya untuk perjalanan hujung minggu — mengembungkannya di jalan pelancaran dalam masa kurang dari 4 minit.
    rating: 5
    product: Kayak Tiup
