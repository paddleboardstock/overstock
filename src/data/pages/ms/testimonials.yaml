testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Pemilik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Kami bermula dengan Pakej Permulaan Kelab untuk sekolah selancar kami. 20 papan, dayung, jaket keselamatan — semuanya tiba dalam masa 3 minggu. Selepas dua musim, kami meningkatkan kepada Pakej Pro. Penjenamaan khusus dengan logo kami telah mengubah imej profesional kami.
    rating: 5
    product: Pakej Permulaan Kelab
    source: solutions/clubs
  - category: clubs
    name: Pemilik Kelab
    title: Kelab Sukan Air
    location: Phuket, Thailand
    content: Pakej Permulaan Kelab adalah titik permulaan yang sempurna. Apabila perniagaan kami berkembang, Paddle Board Overstock berkembang bersama kami — kualiti sama, harga sama, tiada kejutan. Kami berkembang daripada 10 kepada 80 papan dalam 18 bulan.
    rating: 5
    product: Pakej Permulaan Kelab + Pakej Premium
    source: success-stories
  - category: resorts
    name: Pengurus Besar Resort
    title: Resort Pantai 5-Bintang
    location: Yunani
    content: Paddle Board Overstock bukan sahaja membekalkan papan — mereka membantu kami membina pengalaman tetamu yang lengkap. Program sukan air kami berkembang daripada sifar kepada tumpuan resort dalam satu musim. 300 tempahan mingguan + dan $180K hasil tahunan.
    rating: 5
    product: Pakej Premium Resort
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Pengarah Pengalaman Tetamu, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock mereka bentuk dan membekalkan keseluruhan program aktiviti pantai kami di tiga hartanah resort. 120 SUPs, infrastruktur keselamatan, dan latihan kakitangan — semuanya disampaikan dalam satu penghantaran. Penyertaan tetamu meningkat 60% dalam musim pertama.
    rating: 5
    product: Pakej Premium Resort
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Pemilik, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Saya menyewa 5 papan dari kedai tempatan dan kehilangan 60% hasil kepada mereka. Paddle Board Overstock membantu saya membina armada sendiri dengan 15 SUPs. Kalkulator ROI menunjukkan titik pulang modal dalam 4 bulan — ia mengambil masa 3 bulan. Kini saya sedang mengembangkan kepada 30 papan.
    rating: 5
    product: Set Permulaan Armada
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Pengarah Operasi, Adriatic Adventure Tours
    location: Dubrovnik, Croatia
    content: Kami melengkapkan seluruh armada SUP sewa kami dengan papan Paddle Board Overstock — 30 papan di tiga lokasi. Dua musim berlalu, tiada kegagalan. Kualiti yang konsisten di setiap batch memudahkan pilihan kami, dan pasukan mereka juga menyesuaikan warna mengikut jenama kami.
    rating: 5
    product: Pakej Armada Sewa
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Pemilik, Sewa SUP Lake Garda
    location: Lake Garda, Italy
    content: Papan sewa kami digunakan lima kali sehari pada musim puncak. Sejak beralih ke Paddle Board Overstock, aduan kerosakan hampir jatuh ke sifar, dan pelanggan terus bertanya di mana mereka boleh membeli papan mereka sendiri.
    rating: 5
    product: Pakej Armada Sewa
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Pemilik SUP untuk kali pertama
    location: Tasik Tahoe, USA
    content: Stabil walaupun untuk pemula sepenuhnya. Membawanya ke tasik pada hari pertama saya dan tidak jatuh. Pakej lengkap dengan pam dan paddle membolehkan saya berada di air 20 minit selepas membuka kotak.
    rating: 5
    product: SUP Penjelajah 11
  - category: consumers
    name: James Thornton
    title: SUP Pemilik Explorer 11
    location: Vancouver, Kanada
    content: Sebagai pembeli kali pertama, saya berasa cemas untuk membuat pesanan dari luar negara. Kualiti binaan sudah jelas sejak saya membuka kotak — kukuh, jahitan tanpa cela, dan tiba hanya dalam 6 hari.
    rating: 5
    product: SUP Penjelajah 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Pendayung Hujung Minggu
    location: Florida, USA
    content: Kualiti binaan yang kukuh. Mengendalikan ombak pantai jauh lebih baik daripada yang saya jangka daripada papan tiup. Memasukkannya ke dalam bonet kereta saya untuk perjalanan hujung minggu — mengembungkannya di jalan pelancaran dalam masa kurang dari 4 minit.
    rating: 5
    product: SUP Angin Tropika
