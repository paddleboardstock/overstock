hero:
  tagline: Paddle Board Overstock Akademi
  title: Pusat Pembelajaran
  subtitle: Panduan dan tutorial untuk setiap tahap kemahiran — dari asas SUP hingga teknik penyelamatan lanjutan
categories:
  - level: Pemula
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Asas
        desc: Pelajari asas-asas papan dayung berdiri — kedudukan, teknik kayuhan, dan keseimbangan.
        slug: beginner-sup-guide
      - title: Teknik Kayuhan
        desc: Kayuhan ke hadapan, kayuhan sapuan, kayuhan tarik, dan pengawasan rendah — kuasai pergerakan kayuhan asas.
        slug: sup-paddle-guide
      - title: Keselamatan Terlebih Dahulu
        desc: Amalan keselamatan asas termasuk pemeriksaan cuaca, penggunaan PFD, peraturan tali pelekat, dan penyelamatan diri.
        slug: sup-safety-guide
  - level: Pertengahan
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Asas Pelayaran
        desc: Merancang kayuhan berjam-jam — navigasi, hidrasi, kelajuan, dan membaca ramalan angin.
        slug: touring-sup-guide
      - title: Membaca Cuaca
        desc: Menafsirkan ramalan laut, mengenal corak awan, dan memahami kesan angin terhadap air.
        slug: weather-planning-water-sports
      - title: Asas Navigasi
        desc: Membaca carta, penggunaan kompas, titik GPS, dan perancangan laluan untuk kayuhan pesisiran pantai.
        slug: sup-navigation-guide
      - title: Kesedaran Pasang Surut
        desc: Memahami kitaran pasang surut, arus, dan bagaimana ia mempengaruhi masa pelancaran dan laluan.
        slug: understanding-tides
  - level: Maju
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Perancangan Perjalanan Berhari-Hari
        desc: Logistik ekspedisi — pemilihan peralatan, perancangan makanan, protokol keselamatan, dan kontak kecemasan.
        slug: sup-travel-guide
      - title: Teknik Penyelamatan
        desc: Protokol menyelamat diri, menyelamat T, dan menunda untuk air terbuka.
        slug: sup-self-rescue
      - title: Kayuhan Malam
        desc: Navigasi selepas gelap — keperluan pencahayaan, mengingati laluan, komunikasi kumpulan, dan kesedaran bahaya.
        slug: sup-navigation-guide
  - level: Penyelenggaraan
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Pembersihan & Penjagaan
        desc: Pembilasan air tawar, perlindungan UV, pencegahan kulat, dan teknik pengeringan yang betul selepas setiap sesi.
        slug: inflatable-sup-maintenance
      - title: Panduan Penyimpanan
        desc: Amalan terbaik untuk menyimpan papan tiup — pengosongan udara, pelipatan, kawalan suhu, dan jangka hayat rak.
        slug: inflatable-sup-storage
      - title: Asas Pembaikan
        desc: Perbaiki puncture kecil, kebocoran jahitan, dan isu injap dengan kit pembaikan PVC dan teknik tampalan.
        slug: inflatable-sup-repair
      - title: Penyelenggaraan Injap
        desc: Kenal pasti jenis injap (Halkey-Roberts, Boston, Leafield), bersihkan serpihan, dan ganti batang yang rosak.
        slug: inflatable-sup-repair
knowledge_center_tagline: Pusat Pengetahuan
knowledge_center_title: Panduan & Pengetahuan Papan Berkayak
knowledge_center_subtitle: Panduan pakar dan nasihat pembelian untuk pemain papan berkayak dari semua peringkat.
knowledge_sections:
  - title: Teknologi & Pembinaan Papan
    tagline: Di Dalam Papan Berkayak Anda
    desc: Bagaimana papan berkayak tiup dibina — teras drop-stitch, lapisan laminat, dek EVA, dan ujian tekanan di kilang.
    guides:
      - title: Bagaimana Papan Berkayak Dibuat
        desc: Daripada pemotongan bahan dan laminasi hingga ujian tekanan 100% — lihat bagaimana setiap papan meninggalkan kilang.
        href: /factory/process
      - title: Teknologi Teras Drop-Stitch
        desc: Bagaimana ribuan benang dalaman mencipta struktur tiup bertekanan tinggi yang kaku.
        href: /learn/drop-stitch-core
      - title: Rujukan Bahan
        desc: Penilaian denier PVC, berat fabrik, rintangan UV, dan bahan dek dijelaskan.
        href: /learn/materials
      - title: Teknologi Papan Tiup
        desc: Jahitan yang dikimpal, pembinaan rel, dan sistem injap yang mengekalkan papan anda tegap dan kedap udara.
        href: /learn/inflatable-technology
  - title: Panduan Membeli
    tagline: Pilih Papan Yang Betul
    desc: Segala yang anda perlukan untuk memilih SUP tiup pertama — atau seterusnya — daripada saiz hingga pembinaan.
    guides:
      - title: Cara Memilih SUP Inflatable
        desc: Faktor utama — pembinaan, ketebalan, susunan sirip, dan aksesori termasuk.
        href: /guides/how-to-choose-your-sup/
      - title: Apakah Stand-Up Paddleboarding?
        desc: Pengenalan mesra kepada sukan ini, peralatannya, dan mengapa papan tiup memudahkan untuk mula.
        href: /guides/what-is-sup
      - title: Papan Tiup vs Papan Keras
        desc: Bandingkan iSUP dan papan epoksi keras dari segi kebolehbawaan, ketahanan, prestasi, dan nilai.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Panduan Saiz
        desc: Cari panjang papan, lebar, dan isipadu yang betul untuk berat badan, kemahiran, dan gaya dayung anda.
        href: /size-guide
  - title: Kemahiran & Keselamatan
    tagline: Dayung dengan Keyakinan
    desc: Pengetahuan praktikal untuk setiap sesi — asas untuk pemula, keselamatan air, penjagaan, dan pembaikan.
    guides:
      - title: SUP Asas — Panduan Pemula
        desc: Segala yang perlu diketahui oleh seorang pemula — jenis papan, saiz raket, kedudukan, dan petua hari pertama.
        href: /v2/beginner-sup-guide
      - title: Asas Keselamatan Air
        desc: Semakan cuaca, pemilihan PFD, peraturan tali pengikat, menyelamatkan diri, dan amalan terbaik dayung berkumpulan.
        href: /learn/water-safety
      - title: Penyelenggaraan & Penjagaan SUP
        desc: Pembersihan, penyimpanan, perlindungan UV, dan tips penjagaan untuk papan SUP tiup.
        href: /v2/inflatable-sup-maintenance
      - title: Asas Pembaikan Papan
        desc: Perbaiki puncture kecil, kebocoran jahitan, dan isu injap dengan kit pembaikan PVC dan teknik tampalan.
        href: /v2/inflatable-sup-repair
