hero:
  tagline: Aquafarer Akademi
  title: Pusat Pembelajaran
  subtitle: Panduan dan tutorial untuk setiap tahap kemahiran — dari asas SUP hingga teknik penyelamatan lanjutan
categories:
  - level: pemula
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Asas
        desc: Pelajari asas-asas papan dayung berdiri — kedudukan, teknik kayuhan, dan keseimbangan.
        slug: beginner-sup-guide
      - title: Teknik Kayuhan
        desc: Kayuhan ke hadapan, kayuhan sapuan, kayuhan tarik, dan pengawasan rendah — kuasai pergerakan kayuhan asas.
        slug: sup-paddle-guide
      - title: Keselamatan Terlebih Dahulu
        desc: Amalan keselamatan asas termasuk pemeriksaan cuaca, penggunaan PFD, peraturan tali pelekat, dan penyelamatan diri.
        slug: sup-safety-guide
  - level: Pertengahan
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Asas Pelayaran
        desc: Merancang kayuhan berjam-jam — navigasi, hidrasi, kelajuan, dan membaca ramalan angin.
        slug: touring-sup-guide
      - title: Membaca Cuaca
        desc: Menafsirkan ramalan laut, mengenal corak awan, dan memahami kesan angin terhadap air.
        slug: weather-planning-water-sports
      - title: Asas Navigasi
        desc: Membaca carta, penggunaan kompas, titik GPS, dan perancangan laluan untuk kayuhan pesisiran pantai.
        slug: sup-navigation-guide
      - title: Kesedaran Pasang Surut
        desc: Memahami kitaran pasang surut, arus, dan bagaimana ia mempengaruhi masa pelancaran dan laluan.
        slug: understanding-tides
  - level: Maju
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Perancangan Perjalanan Berhari-Hari
        desc: Logistik ekspedisi — pemilihan peralatan, perancangan makanan, protokol keselamatan, dan kontak kecemasan.
        slug: sup-travel-guide
      - title: Teknik Penyelamatan
        desc: Penyelamatan diri, penyelamatan T, penyelamatan Eskimo untuk kayak, dan protokol penarik untuk air terbuka.
        slug: sup-self-rescue
      - title: Kayuhan Malam
        desc: Navigasi selepas gelap — keperluan pencahayaan, mengingati laluan, komunikasi kumpulan, dan kesedaran bahaya.
        slug: sup-navigation-guide
  - level: Penyelenggaraan
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Pembersihan & Penjagaan
        desc: Pembilasan air tawar, perlindungan UV, pencegahan kulat, dan teknik pengeringan yang betul selepas setiap sesi.
        slug: inflatable-sup-maintenance
      - title: Panduan Penyimpanan
        desc: Amalan terbaik untuk menyimpan papan dan bot boleh tiup — pelepasan udara, lipatan, kawalan suhu, dan jangka hayat simpanan.
        slug: inflatable-sup-storage
      - title: Asas Pembaikan
        desc: Perbaiki puncture kecil, kebocoran jahitan, dan isu injap dengan kit pembaikan PVC dan teknik tampalan.
        slug: inflatable-sup-repair
      - title: Penyelenggaraan Injap
        desc: Kenal pasti jenis injap (Halkey-Roberts, Boston, Leafield), bersihkan serpihan, dan ganti batang yang rosak.
        slug: inflatable-sup-repair
knowledge_center_tagline: Pusat Ilmu
knowledge_center_title: Panduan Peralatan Marin & Industri
knowledge_center_subtitle: Pengetahuan pakar dan panduan pembelian untuk profesional marin, pengendali armada, dan penggemar sukan air.
knowledge_sections:
  - title: Pengetahuan RIB Bot
    tagline: Panduan Bot Tiup Kaku
    desc: Segala tentang bot RIB — reka bentuk kapal, bahan, pemilihan enjin, penyelenggaraan, dan nasihat membeli untuk kegunaan komersial dan rekreasi.
    guides:
      - title: Cara Memilih Bot RIB yang Betul
        desc: Panduan lengkap untuk memilih RIB — saiz, kuasa enjin, bahan tiub, jenis kapal, dan kegunaan yang dimaksudkan.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs Bot Tiup
        desc: Bot tiup kaku vs bot tiup tradisional — reka bentuk kapal, prestasi, ketahanan, dan kapasiti dibandingkan.
        href: /compare/rib-vs-dinghy
      - title: Komersial RIB lwn Rekreasi RIB
        desc: Bot RIB komersial vs rekreasi — standard pembinaan, bahan, jangka hayat, kos, dan pensijilan.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminium vs Fiberglass Hull
        desc: Bandingkan struktur aluminium dan fiberglass untuk bot RIB dari segi berat, kos, ketahanan, dan rintangan kakisan.
        href: /compare/aluminum-vs-fiberglass
  - title: Panduan Bot Tiup
    tagline: Pengetahuan Kenderaan Air Tiup
    desc: Panduan komprehensif tentang bot tiup — PVC vs Hypalon, kaedah pembinaan, standard keselamatan, dan amalan terbaik penyelenggaraan.
    guides:
      - title: Panduan Bahan PVC vs Hypalon
        desc: Perbandingan muktamad antara PVC dan Hypalon CSM untuk pembinaan bot tiup.
        href: /compare/pvc-vs-hypalon
      - title: Cara Bot Tiup Dibuat
        desc: Proses pembuatan — pemotongan bahan, kimpalan HF, pembinaan jahitan, ujian tekanan, dan kawalan kualiti.
        href: /learn/inflatable-technology
      - title: Panduan Keselamatan Bot Tiup
        desc: Standard keselamatan, kapasiti muatan, pengaturan udara yang betul, pemeriksaan sebelum berlepas, dan prosedur kecemasan.
        href: /learn/water-safety
      - title: Penyelenggaraan Bot Tiup
        desc: Pembersihan, penyimpanan, perlindungan UV, persiapan musim sejuk, dan pembaikan bot tiup dan RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Pengetahuan Bot
    tagline: Bot Tiup & RIB Hub
    desc: Panduan teknikal merangkumi jenis bot tiup, bahan, kaedah pembinaan, penyelenggaraan, dan keselamatan — dari bot kecil hingga RIBs.
    guides:
      - title: Jenis Bot Tiup
        desc: Bot kecil, RIBs, kayak, dan tender — pelajari perbezaan dan pilih yang sesuai.
        href: /v2/inflatable-boat-buying-guide
      - title: Teknologi Drop-Stitch
        desc: Bagaimana ribuan benang dalaman mencipta struktur tiup teguh bertekanan tinggi.
        href: /learn/drop-stitch-core
      - title: Rujukan Bahan
        desc: Penjelasan mengenai penilaian denier PVC, berat kain, ketahanan UV, dan bahan gred maritim.
        href: /learn/materials
      - title: RIB lwn Dinghy
        desc: Bandingkan bot tiup rigid dengan dinghy tiup tradisional untuk pelbagai kegunaan.
        href: /compare/rib-vs-dinghy
  - title: SUP Pengetahuan
    tagline: Panduan Papan Dayung Berdiri
    desc: Segala-galanya tentang papan SUP — tiup vs rigid, dimensi papan, teknologi bahan, dan nasihat pakar untuk semua tahap kemahiran.
    guides:
      - title: Tiup vs Papan SUP Keras
        desc: Bandingkan iSUP dan papan epoksi keras dari segi kebolehbawaan, ketahanan, prestasi, dan nilai.
        href: /learn/sup
      - title: Panduan Dimensi Papan SUP
        desc: Bagaimana panjang, lebar, dan ketebalan mempengaruhi kestabilan, kelajuan, dan keupayaan manuver.
        href: /learn/sup
      - title: Penyelenggaraan & Penjagaan SUP
        desc: Tips membersihkan, menyimpan, melindungi UV, dan membaiki papan tiup SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Memilih SUP Pertama Anda
        desc: Panduan pemula untuk memilih papan dayung berdiri yang sesuai untuk berat badan, tahap kemahiran, dan tujuan penggunaan.
        href: /learn/sup
  - title: Panduan Peralatan Menyelam
    tagline: Pengetahuan Bot Menyelam Komersial
    desc: Panduan khusus mengenai bot menyelam, RIBs menyelam, dan peralatan untuk pusat menyelam, pengendali menyelam, dan pasukan menyelam komersial.
    guides:
      - title: Bot RIB Terbaik untuk Pusat Menyelam
        desc: Cara memilih RIB menyelam yang betul untuk pusat menyelam anda — kapasiti, konfigurasi, dan pertimbangan bajet.
        href: /solutions-diving-center-boats
      - title: Panduan Konfigurasi RIB Menyelam
        desc: Ciri penting untuk RIBs menyelam — rak tangki, sistem tangga, platform menyelam, dan penyimpanan peralatan.
        href: /solutions-diving-center-boats
  - title: Panduan Tender Yacht
    tagline: Penyelesaian Superyacht & Tender Marin
    desc: Panduan memilih tender kapal mewah yang sempurna — tender boleh tiup, tender RIB, penyelesaian penyimpanan, dan aksesori tender.
    guides:
      - title: Cara Memilih Tender Kapal Mewah
        desc: Faktor yang perlu dipertimbangkan ketika memilih tender untuk kapal mewah anda — saiz, bahan, enjin, dan penyimpanan.
        href: /solutions-yacht-tender-solutions
      - title: Tender Boleh Tiup vs Tender RIB
        desc: Bandingkan tender bot tiup dengan tender bot tiup pepejal untuk prestasi, ketahanan, dan kemudahan penyimpanan.
        href: /compare/rib-vs-dinghy
  - title: Panduan Peralatan Penyelamatan
    tagline: Pengetahuan Kapal Penyelamat & Carian
    desc: Panduan profesional mengenai bot penyelamat, kapal SAR, dan peralatan tindak balas kecemasan untuk pengawal pantai, pengawal pantai, dan pasukan bantuan bencana.
    guides:
      - title: Panduan Pemilihan Bot SAR
        desc: Cara memilih bot carian dan penyelamatan yang tepat — kelajuan, kapasiti, ketahanan, dan keperluan peralatan khas.
        href: /solutions-rescue-watercraft
      - title: RIB Komersial untuk Operasi Penyelamatan
        desc: Mengapa RIBs gred komersial menjadi pilihan utama untuk pasukan carian dan penyelamatan profesional di seluruh dunia.
        href: /use-cases/search-and-rescue
