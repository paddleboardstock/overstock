content_benefits:
  tagline: Manfaat Perkongsian
  title: Kenapa Pengedar<br />Pilih Aquafarer
  subtitle: Satu perkongsian yang direka untuk pengedar marin yang memerlukan bekalan yang boleh dipercayai, margin kompetitif, dan sokongan profesional.
  items:
    - title: Perlindungan Wilayah
      description: Hak wilayah eksklusif atau separa eksklusif untuk pengedar yang layak. Pemetaan pasaran dan pengurusan konflik saluran untuk melindungi pelaburan anda dalam membina jenama Aquafarer di kawasan anda.
      icon: tabler:map-pin
    - title: Harga Borong Kompetitif
      description: Harga bertingkat berdasarkan komitmen volum tahunan. Struktur harga yang melindungi margin dengan jaminan harga awal dan pecahan kos yang telus (FOB asas Qingdao).
      icon: tabler:currency-dollar
    - title: Kit Sokongan Pemasaran
      description: Fotografi produk profesional, helaian spesifikasi, templat dokumentasi pematuhan, kandungan media sosial, dan bahan pemasaran bersama jenama. Dikemas kini setiap tahun dengan pelancaran produk baru.
      icon: tabler:photo
    - title: Latihan Teknikal
      description: Latihan produk untuk pasukan jualan anda (secara maya atau di lokasi), latihan penyelenggaraan dan pembaikan untuk juruteknik servis anda, dan panduan FAQ dan penyelesaian masalah untuk pelanggan.
      icon: tabler:school
    - title: Alat Ganti & Selepas Jualan
      description: Bekalan alat ganti khusus dengan penghantaran keutamaan. Seksyen tiub pengganti, injap, sirip, dan kit pembaikan tersedia untuk penyelesaian pesanan yang cepat. Sokongan pemprosesan tuntutan jaminan.
      icon: tabler:tool
    - title: Dokumentasi Pematuhan
      description: 'Pakej dokumentasi pematuhan penuh untuk pasaran anda: CE DoC, data plat pembina, manual pemilik, dan sokongan pendaftaran peraturan. Menghapuskan beban pematuhan anda.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Apa Yang Kami Cari
  title: Pengedar<br />Keperluan
  subtitle: Kami mencari rakan kongsi yang dapat mewakili dan menyokong produk Aquafarer secara profesional di wilayah mereka.
  items:
    - title: Pengetahuan Wilayah & Pasaran
      description: Kehadiran yang mantap dalam pasaran marin, sukan air, atau rekreasi luar. Memahami peraturan tempatan, keutamaan pengguna, dan saluran pengedaran untuk produk perahu.
      icon: tabler:target
    - title: Pengalaman Industri
      description: Sekurang-kurangnya 2 tahun pengalaman dalam mengedar peralatan marin, luar, atau sukan. Rekod prestasi yang terbukti dengan jenama antarabangsa dan operasi borong B2B.
      icon: tabler:briefcase
    - title: Bilik Pameran atau Gudang
      description: Kemudahan fizikal untuk paparan produk, penyimpanan inventori, dan perkhidmatan pelanggan. Keupayaan untuk menyelenggara unit demo dan inventori alat ganti untuk wilayah anda.
      icon: tabler:building-store
    - title: Komitmen terhadap Standard Jenama
      description: Kesediaan untuk mengekalkan standard penyampaian jenama Aquafarer, memberikan sokongan pelanggan mengikut protokol perkhidmatan kami, dan menyertai kemas kini latihan produk tahunan.
      icon: tabler:star
content_process:
  tagline: Proses Permohonan
  title: 4-Langkah Peniaga<br />Proses Permohonan
  subtitle: Dari pertanyaan awal hingga penghantaran pertama — satu proses onboarding yang mudah.
  steps:
    - number: '01'
      title: Pertanyaan Awal & Kelayakan
      description: Hantar permohonan pengedar anda beserta butiran syarikat, wilayah yang diminati, garis produk semasa, dan anggaran volum tahunan. Kami akan menyemak dalam masa 5 hari perniagaan.
      timeline: 5 hari
    - number: '02'
      title: Ulasan & Terma Perniagaan
      description: Mesyuarat maya untuk membincangkan strategi wilayah, tahap harga, dan terma perkongsian. Semak keperluan dokumentasi pematuhan untuk pasaran anda. NDA menandatangani jika perlu.
      timeline: 1-2 minggu
    - number: '03'
      title: Pesanan & Penilaian Sampel
      description: Buat pesanan sampel awal (2-5 unit) pada harga pengedar untuk penilaian pasaran dan latihan pasukan. Dokumentasi pematuhan penuh dan penyediaan demo disertakan.
      timeline: 30-45 hari
    - number: '04'
      title: Pelancaran & Sokongan Perkongsian
      description: Pesanan bekas pertama dengan perlindungan wilayah diaktifkan. Kit pemasaran dihantar, pasukan jualan dilatih, dan pengurus akaun khusus dilantik. Semakan perniagaan suku tahunan sedang dijalankan.
      timeline: Berlaku
content_application_docs:
  tagline: Dokumen Permohonan
  title: Dokumen Diperlukan<br />untuk Permohonan Dealer
  subtitle: Untuk memohon untuk francais Aquafarer, sila sediakan dokumen dan maklumat berikut untuk pasukan semakan kami.
  items:
    - title: Sijil Pendaftaran Perniagaan
      description: Dokumen pendaftaran syarikat yang sah yang menunjukkan nama entiti undang-undang, alamat berdaftar, dan skop perniagaan yang merangkumi pengedaran peralatan marin, sukan, atau luar.
      icon: tabler:file-text
    - title: Pelan Liputan Wilayah
      description: Wilayah geografi yang diminati, rangkaian runcit atau pengedaran sedia ada, segmen pelanggan sasaran, dan jumlah tahunan yang dicadangkan mengikut kategori produk (RIB, SUP, kayak).
      icon: tabler:map
    - title: Keupayaan Bilik Pameran atau Gudang
      description: Kemudahan fizikal untuk paparan produk, penyimpanan inventori, dan khidmat pelanggan. Foto atau pelan lantai menunjukkan kawasan demo dan kapasiti penyimpanan alat ganti.
      icon: tabler:building
    - title: Penyata Keupayaan Kewangan
      description: 'Rujukan bank atau penyata kewangan yang mengesahkan keupayaan untuk membuat pesanan kontena awal dan mengekalkan inventori. Pesanan awal minimum: satu kontena 20 kaki (model campuran 10-20 unit).'
      icon: tabler:coin
    - title: Kapasiti Sokongan Selepas Jualan
      description: Juruteknik servis yang dilatih atau boleh dilatih untuk penyelenggaraan dan pembaikan bot kembung. Keupayaan pemprosesan tuntutan jaminan dan komitmen inventori alat ganti.
      icon: tabler:tool
    - title: Rujukan Jenama Terdahulu
      description: Senarai jenama peralatan marin/sukan semasa atau terdahulu yang diedarkan. Rujukan hubungi tersedia atas persetujuan bersama. Syarikat permulaan tanpa pengalaman pengedaran sebelum ini mungkin layak dengan komitmen kewangan yang lebih kukuh.
      icon: tabler:users
faq:
  title: Program Pengedar — Soalan Lazim
  questions:
    - q: Apakah kuantiti pesanan minimum untuk pengedar?
      a: Pengedar MOQ bermula pada 10-20 unit setiap pesanan, dengan fleksibiliti untuk model campuran (RIBboleh tiup, SUP). Pesanan sampel awal sebanyak 2-5 unit tersedia pada harga pengedar untuk penilaian pasaran.
    - q: Adakah anda menawarkan hak wilayah eksklusif?
      a: Hak wilayah eksklusif tersedia untuk pengedar yang layak yang memenuhi komitmen volum tahunan dan mengekalkan piawaian jenama. Susunan separa eksklusif dan bukan eksklusif juga tersedia untuk pasaran baru muncul.
    - q: Apakah sokongan pemasaran yang anda berikan?
      a: Kami menyediakan kit pemasaran menyeluruh termasuk fotografi produk profesional, helaian spesifikasi, templat dokumentasi pematuhan, perpustakaan kandungan media sosial, dan bahan berjenama bersama. Dikemas kini setiap tahun dengan pelancaran produk baru.
    - q: Bagaimana tuntutan jaminan dikendalikan?
      a: 'Pengedar berfungsi sebagai titik hubungan pertama untuk tuntutan jaminan. Kami menyediakan kriteria jaminan yang jelas, protokol dokumentasi foto, dan penggantian atau pemprosesan kredit yang pantas. Terma jaminan: Terhad 5 tahun untuk fabrik/jahitan/badan tiub bot; 2 tahun dan SUP aksesori.'
    - q: Bolehkah saya label produk secara peribadi Aquafarer di bawah jenama saya sendiri?
      a: Ya, melalui OEMprogram / kamiODM. Pilihan label peribadi termasuk grafik tiub tersuai, penjenamaan konsol, pembungkusan runcit, dan dokumentasi pematuhan di bawah jenama anda. Lihat OEMODM halaman / perkhidmatan kami untuk maklumat lanjut.
    - q: Apakah dokumentasi pematuhan yang disertakan untuk pengedar?
      a: Setiap penghantaran termasuk CE DoC khusus model, data plat pembina, manual pemilik, dan dokumentasi penghantaran. Kami juga menyediakan sokongan pendaftaran peraturan untuk wilayah anda dan membantu dengan sebarang keperluan pematuhan tempatan.
