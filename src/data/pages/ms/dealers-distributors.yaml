hero:
  tagline: Program Dealer
  title: Menjadi Aquafarer<br />Pengedar
  subtitle: Berkongsi dengan CE yang disahkan RIB dan pengeluar kenderaan air tiup yang berkhidmat di 50+ negara. Perlindungan wilayah, sokongan pemasaran, dan harga kompetitif untuk pengedar marin yang telah established.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer program dealer dan pengedar
direct_answer: Aquafarer menawarkan perkongsian dealer dan pengedaran dengan perlindungan wilayah, harga borong kompetitif, kit sokongan pemasaran, dan dokumentasi pematuhan penuh (CE, ISO 9001, BSCI). MOQ bermula dari 10-20 unit setiap pesanan dengan pengurusan akaun khusus.
