comparison_matrix:
  title: OEM vs. ODM — Model Mana Sesuai Untuk Projek Anda?
  subtitle: Empat mod kerjasama, masing-masing dengan tahap penglibatan kilang dan kawalan jenama yang berbeza
  columns:
    - header: Mod Kolaborasi
    - header: Peranan Jenama Anda
    - header: Aquafarer Peranan
  rows:
    - option: OEM Pembuatan
      standard: Sediakan jenama, spesifikasi, dan keperluan pematuhan
      premium: Bina mengikut spesifikasi anda menggunakan acuan dan talian pengeluaran sedia ada kami
    - option: ODM Penyesuaian
      standard: Pilih model asas, sesuaikan ciri dan penjenamaan
      premium: Sesuaikan platform RIB yang terbukti dengan pengubahsuaian yang anda inginkan
    - option: Separuh-Kustom RIB
      standard: Tetapkan panjang lambung, bahan tiub, susun atur dek, dan peralatan
      premium: Ubah suai hull sedia ada dengan konfigurasi tiub tersuai dan pelan dek
    - option: Pembangunan Khusus Penuh
      standard: Sediakan konsep dan keperluan pasaran sasaran
      premium: Reka bentuk dari awal — lambung khas, acuan, dan dokumentasi lengkap
content_customization:
  tagline: Apa Yang Boleh Disesuaikan
  title: RIB Penyesuaian<br />Pilihan
  subtitle: Setiap elemen sebuah kapal RIB boleh disesuaikan mengikut aplikasi, pasaran, dan keperluan jenama anda.
  items:
    - title: Laut & Struktur
      description: Panjang hull (2.5–8.5 m), bahan hull (fiberglass GRP atau aluminium gred marin), warna hull (gelcoat atau dicat), profil lunas (V dalam, V sederhana, rata), jenis transom (transom tertutup dengan braket atau baik), dan pengukuhan struktur untuk keperluan muatan komersial.
      icon: tabler:sailboat
    - title: Tiub & Kolar
      description: Bahan tiub (0.9–1.2 mm PVC atau 1.4–1.7 mm Hypalon/CSM), diameter tiub (40–55 cm), bilangan ruang (3–7), jenis injap (Halkey-Roberts, Leafield D7, atau Boston), warna tiub (standard atau khas), dan konfigurasi kon/taper kolar.
      icon: tabler:circle
    - title: Susun Atur Dek & Konsol
      description: Konsol tengah, konsol sisi, atau stereng tiller. Susunan tempat duduk (tempat duduk joki, tempat duduk bangku, tempat duduk penopang). Penutup dek (EVA buih gaya kayu jati, cat anti-gelincir, atau GRP kosong). Titik pemasangan peralatan, rel pemegang, dan kedudukan D-ring.
      icon: tabler:layout-dashboard
    - title: Elektrik & Navigasi
      description: Lampu navigasi (LED), sistem pam bilge, pengurusan bateri, pemasangan radio VHF, pemasangan GPS/pemetaan carta, port pengecasan USB, dan konfigurasi panel suis.
      icon: tabler:bolt
    - title: Penjenamaan & Grafik
      description: Grafik hull dan tiub (percetakan skrin, pemindahan haba, percetakan digital UV), penempatan logo, skim warna tersuai, penanda pengenalan, dan dokumentasi pemilik khusus dengan jenama anda.
      icon: tabler:palette
    - title: Keselamatan & Pematuhan
      description: Penarafan kategori reka bentuk (A/B/C/D setiap RCD), sistem pemadaman kebakaran, spesifikasi sistem bahan api (tangki mudah alih, tangki tetap, di bawah dek), dan pakej dokumentasi pematuhan untuk pasaran sasaran anda.
      icon: tabler:shield
content_applications:
  tagline: Konfigurasi Aplikasi
  title: RIB Konfigurasi<br />Mengikut Permohonan
  subtitle: Misi yang berbeza memerlukan konfigurasi yang berbeza. Berikut adalah tetapan yang terbukti untuk aplikasi RIB yang paling biasa.
  items:
    - title: Menyelamat & Rondaan
      description: Laras Deep-V, tiub Hypalon, dek pemungut air sendiri, tempat duduk penyangga, pemegang genggam, lampu navigasi, dan cincin D tahan lasak. RCD Kategori Reka Bentuk B atau C. Sistem bahan bakar tahan api dan elektrik gred komersial.
      icon: tabler:lifebuoy
    - title: Sokongan Menyelam
      description: Balk lebar, tangga menaiki di bahagian belakang, posisi rak tangki, cincin D tambahan, pemasangan bendera selam, transom diperkuat untuk enjin luar dua dan penutup dek penuh anti-gelincir EVA.
      icon: tabler:mask
    - title: Pelancongan & Komersial
      description: Susun atur yang disahkan untuk penumpang dengan tempat duduk bangku, teduhan matahari/Bimini, rel pegangan, stor kering, dan sistem bateri berganda. RCD Kategori C. Direka untuk operasi flot hotel dan sewaan.
      icon: tabler:beach
    - title: Memancing
      description: Rekaan dek terbuka, kedudukan pemegang joran, kolam umpan hidup, pemasangan penjejak ikan, pemasangan enjin trolling, transom diperkuat, dan sistem bahan api mudah alih. Pilihan konsol tengah atau konsol sisi.
      icon: tabler:fish
    - title: Rekreasi & Tender Yacht
      description: Lampang kapal ringan, tiub PVC, tempat duduk selesa, kemudi teleskopik atau konsol kompak, titik angkat untuk davit, dan tangki bahan api boleh ditanggalkan. RCD Kategori C atau D.
      icon: tabler:sailboat
    - title: Bot Kerja Profesional
      description: Pilihan hull aluminium, pengukuhan berat, stereng hidraulik, elektrik gred komersial, lengkungan radar, dan titik integrasi peralatan khusus misi. Pematuhan tersuai mengikut projek.
      icon: tabler:anchor
process_steps:
  title: Proses Pembangunan 7-Langkah RIB OEM/ODM
  subtitle: Daripada ringkasan projek hingga selepas jualan — aliran kerja yang ditakrifkan dengan titik pencapaian dan hasil yang jelas
  steps:
    - number: '01'
      title: Ringkasan Projek & Keperluan
      description: Tentukan aplikasi sasaran, saiz hull, bahan tiub, keperluan pematuhan, dan keperluan penjenamaan. Kami menilai kebolehlaksanaan dan mengesahkan model kerjasama (OEM/ODM/Separuh-Tersuai/Full-Tersuai).
      timeline: 3–5 hari
    - number: '02'
      title: Ulasan Teknikal & Kebolehlaksanaan
      description: Pasukan kejuruteraan meninjau kebolehlaksanaan struktur, pengiraan kestabilan dan daya apung, laluan pematuhan, dan ketersediaan bahan. Kami mengenal pasti acuan sedia ada atau keperluan acuan tersuai.
      timeline: 5–7 hari
    - number: '03'
      title: Cadangan & Sebut Harga
      description: Menerima cadangan terperinci termasuk spesifikasi, render 3D atau lukisan GA, skop pematuhan, jadual masa, dan harga unit berdasarkan peringkat volum dan MOQ.
      timeline: 5–7 hari
    - number: '04'
      title: Pengesahan Rekabentuk & Persampelan
      description: Lulus GA akhir, susun atur dek, dan konfigurasi tiub. Kami menghasilkan sampel pra-pengeluaran dengan warna jenama anda, logo, dan bahan yang ditetapkan untuk pemeriksaan fizikal anda.
      timeline: 15–20 hari
    - number: '05'
      title: Kelulusan Sampel & Protokol QC
      description: 'Memeriksa dan meluluskan sampel. Menetapkan protokol QC pengeluaran: ujian tekanan (1.25x / 24–48h), pemeriksaan dimensi, dan senarai semak dokumentasi pematuhan setiap hull.'
      timeline: 3–5 hari
    - number: '06'
      title: Pengeluaran Massa & Kawalan Kualiti
      description: Larian pengeluaran penuh dengan senarai semak QC 100 mata setiap unit. Pemeriksaan semasa proses, ujian tekanan, dan kebolehlacakan peringkat siri. Dokumentasi CE/ISO disediakan selari.
      timeline: 30–45 hari
    - number: '07'
      title: Pembungkusan, Penghantaran & Selepas Jualan
      description: Pembungkusan tersuai (standard, siap jualan runcit, atau dipallet), dokumentasi eksport, pemuatan kontena, dan logistik. Kit alat ganti dan dokumentasi penyelenggaraan disertakan.
      timeline: 7–14 hari
certifications:
  title: Pematuhan & Sijil untuk Bot RIB
  subtitle: Setiap pesanan RIB tersuai dihantar dengan dokumentasi pematuhan khusus model
  items:
    - name: CE 2013/53/EU
      description: RCD pematuhan mengikut model dan kategori rekabentuk — DoC, plat pembina, manual pemilik termasuk
      badge: CE
    - name: ISO 9001:2015
      description: Sistem pengurusan kualiti yang disahkan oleh SGS meliputi reka bentuk, pengeluaran, dan pengedaran
      badge: ISO
    - name: EN ISO 6185
      description: Standard pembinaan bot tiup — kestabilan, daya apung, dan pemulihan lelaki yang jatuh ke laut
      badge: 6185
    - name: EN ISO 14945
      description: Piring penanda pembina standard — maklumat pengecaman dan kapasiti yang ditanda secara kekal
      badge: 14945
    - name: BSCI
      description: Audit pematuhan sosial untuk pengilangan beretika — diperlukan oleh peruncit EU
      badge: BSCI
    - name: REACH
      description: Pematuhan keselamatan kimia EU untuk PVC, Hypalon, pelekat, dan salutan
      badge: REACH
content_service_modules:
  tagline: Modul Perkhidmatan
  title: Perkhidmatan OEM/ODM<br />Modul
  subtitle: Setiap projek menggabungkan modul perkhidmatan yang sesuai. Tidak setiap projek memerlukan setiap modul — kami hanya menentukan skop apa yang diperlukan oleh projek anda.
  items:
    - title: Semakan Kejuruteraan & Kebolehlaksanaan
      description: 'Penilaian platform kapal, semakan kebolehlaksanaan struktur, pengesahan kestabilan dan daya apungan, pengecaman laluan pematuhan, dan pengesahan ketersediaan bahan. Hasil: laporan kebolehlaksanaan dengan saranan diteruskan/tidak diteruskan.'
      icon: tabler:math-function
    - title: Reka Bentuk & Konfigurasi
      description: 'Lukisan GA, susun atur dek, konfigurasi tiub, kedudukan konsol dan tempat duduk, pelan pemasangan peralatan, dan pemilihan warna/bahan. Hasil: spesifikasi GA dan konfigurasi yang diluluskan.'
      icon: tabler:ruler
    - title: Sampel & Prototip
      description: Sampel pra-pengeluaran dengan warna, logo, dan bahan yang ditetapkan yang diluluskan untuk pemeriksaan fizikal. Termasuk protokol kelulusan sampel, senarai semak pemeriksaan, dan proses permintaan perubahan.
      icon: tabler:3d-cube-sphere
    - title: Pengeluaran & Kawalan Kualiti
      description: Pengeluaran besar-besaran dengan senarai semak QC 100 mata bagi setiap unit, pemeriksaan semasa proses, ujian tekanan (1.25x / 24-48j), dan kebolehjejak pada tahap bersiri. Dokumentasi CE/ISO disediakan secara selari.
      icon: tabler:clipboard-check
    - title: Penjenamaan & Pembungkusan
      description: Permohonan logo jenama peribadi, grafik kapal dan tiub tersuai, dokumentasi pemilik berjenama, pembungkusan sedia untuk runcit atau dipalet, dan penyediaan kit alat ganti.
      icon: tabler:palette
    - title: Eksport & Dokumentasi
      description: Pembungkusan eksport, pelan pemuatan kontena, dokumentasi FOB/CIF/DDP, dokumen pematuhan mengikut pasaran destinasi, dan protokol komunikasi selepas penghantaran.
      icon: tabler:world
content_risk_control:
  tagline: Kawalan Risiko & Penghantaran
  title: Risiko Projek &<br />Pengurusan Penghantaran
  subtitle: Pembeli profesional OEM/ODM mengambil berat tentang kawalan risiko sama seperti kualiti produk. Inilah cara kami menguruskannya.
  items:
    - title: Definisi Skop & Pemilikan
      description: 'Sebelum pembangunan bermula, kami mentakrifkan secara bertulis: skop penyesuaian, keperluan alat, kriteria kelulusan sampel, pemilikan lukisan dan acuan, serta tanggungjawab dokumentasi. Tiada kekaburan tentang siapa yang memiliki apa.'
      icon: tabler:file-text
    - title: Proses Kawalan Perubahan
      description: Semua perubahan spesifikasi selepas pengesahan reka bentuk mengikuti proses permintaan perubahan yang didokumenkan dengan penilaian impak (kos, garis masa, pematuhan). Tiada pengubahsuaian yang tidak diluluskan memasuki pengeluaran.
      icon: tabler:arrows-diff
    - title: Jaminan Konsistensi Batch
      description: Unit ke-50 sepadan dengan sampel pertama yang diluluskan. Spesifikasi yang diluluskan dibekukan, parameter bahan dan proses dikunci, dan titik semak dalam proses mengesahkan konsistensi sepanjang tempoh pengeluaran.
      icon: tabler:repeat
    - title: Ketelusan Penghantaran & Kapasiti
      description: Masa penyediaan diberikan berdasarkan kapasiti pengeluaran sebenar, tahap stok bahan, dan beban pesanan semasa — bukan sasaran aspirasi. Jadual pengeluaran dengan tarikh penanda aras disediakan setiap pesanan.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Soalan Lazim
  questions:
    - q: Apakah perbezaan antara OEM ODM RIB dan untuk bot?
      a: '(OEMPembuatan Peralatan Asal): anda menyediakan spesifikasi terperinci dan kami membina reka bentuk anda.ODM (Pembuatan Reka Bentuk Asal): anda memilih platform yang terbukti Aquafarer RIB dan kami sesuaikannya dengan ciri dan penjenamaan yang anda inginkan.ODM lebih pantas dan kos lebih rendah;OEM menawarkan kawalan reka bentuk maksimum.'
    - q: Bolehkah saya menyesuaikan RIB bentuk dan saiz badan kapal?
      a: Ya. Kami menawarkan pengubahsuaian separa khusus pada acuan badan kapal sedia ada (susun atur dek berbeza, konfigurasi tiub) dan pembangunan badan kapal sepenuhnya dengan CNCacuan -mesin baru. Projek separa tersuai boleh bermula pada 2-5 unit; penyesuaian penuh biasanya memerlukan komitmen yang lebih tinggi.
    - q: Apakah bahan tiub yang tersedia untuk khasRIBs?
      a: Kami menawarkan 0.9-1.2 mm PVC untuk kegunaan rekreasi dan komersial ringan, serta 1.4-1.7 mm HypalonCSM / untuk aplikasi profesional, penyelamatan, dan komersial yang memerlukan UV ketahanan ozon yang unggul (jangka hayat 10-15 tahun berbanding 5-8 tahun untuk PVC).
    - q: Bolehkah anda RIBs konfigurasikan untuk aplikasi tertentu seperti menyelamat, menyelam, atau memancing?
      a: Ya. Kami mengekalkan templat konfigurasi yang terbukti untuk penyelamatan/rondaan, sokongan menyelam, pelancongan/sewaan, memancing, tender kapal layar, dan aplikasi bot kerja profesional. Setiap templat termasuk jenis badan kapal yang disyorkan, bahan tiub, susun atur dek, dan peralatan — yang kemudian kami sesuaikan mengikut keperluan anda.
    - q: Maklumat apa yang anda perlukan untuk RIB OEMODM sebut harga / sebut harga?
      a: Aplikasi sasaran, panjang badan kapal yang dikehendaki, keutamaan bahan tiub (PVCatauHypalon), anggaran kuantiti dan jadual penghantaran, keperluan pematuhan pasaran sasaran, serta sebarang produk atau spesifikasi rujukan. Semakin banyak butiran yang anda berikan, semakin pantas dan tepat sebut harga kami.
    - q: Apa yang MOQ perlu dilakukan untuk bot khas RIB ?
      a: Untuk acuan badan sedia ada dengan pengubahsuaian standard, MOQ bermula dari 2-5 unit setiap reka bentuk. Untuk acuan khas dan pembangunan tersuai penuh, MOQ bergantung pada kerumitan projek — biasanya 10-20 unit untuk separa tersuai dan 30+ unit untuk tersuai penuh dengan alat baru.
    - q: Siapa pemilik acuan dan lukisan khas?
      a: Acuan yang dibangunkan menggunakan Aquafarer reka bentuk asas kekal Aquafarer sebagai milik. Acuan yang sepenuhnya disesuaikan dan dibiayai oleh pelanggan boleh diserahkan kepada pemilikan pelanggan mengikut terma kontrak. Semua terma pemilikan acuan didokumentasikan sebelum projek bermula.
    - q: Bagaimana RIBs pembungkusan khas untuk eksport?
      a: 'Standard: + pembalut stretch-wrap cradle khas untuk pemuatan kontena. Premium: pembungkusan sedia runcit, pek vakum, atau palet. Kami menawarkan FOB Qingdao, CIF, dan DDP penghantaran. Dokumentasi eksport penuh dan pelepasan kastam disertakan.'
