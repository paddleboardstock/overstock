hero:
  tagline: Rakan Kongsi & Pengedaran
  title: Menjadi Aquafarer Rakan Kongsi<br />— Rangkaian Pengedaran Global
  subtitle: Sertai rangkaian rakan kongsi global Aquafarer. Kami bekerjasama dengan pengedar marin, penjual bot, peruncit peralatan, dan rakan jenama di 50+ negara.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Rangkaian rakan kongsi dan pengedar global Aquafarer
content_programs:
  tagline: Program Rakan Kongsi
  title: Program Rakan Kongsi<br />Direka untuk Pertumbuhan
  subtitle: Sama ada anda seorang pengedar, peniaga, atau rakan jenama, Aquafarer menawarkan program yang direka untuk menyokong perniagaan anda.
  columns: 3
  items:
    - title: Program Pengedar
      description: Pengedaran wilayah eksklusif dengan harga volum, sokongan pemasaran, dan akses langsung ke kilang. Komitmen minimum diperlukan berdasarkan saiz wilayah.
      icon: tabler:world
    - title: Program Peniaga
      description: Harga peniaga langsung, latihan produk, bahan pemasaran, dan sokongan waranti untuk lokasi runcit dan kedai dalam talian.
      icon: tabler:building-store
    - title: OEM/ODM Perkongsian
      description: Perkhidmatan penuh OEM dan pembuatan ODM dengan penjenamaan khusus, pembungkusan, dan spesifikasi produk. Dari konsep hingga kontena.
      icon: tabler:certificate
    - title: Perkongsian Jenama
      description: Penjenamaan bersama, label peribadi, dan program model eksklusif untuk jenama yang telah mapan dalam bidang marin dan rekreasi luar.
      icon: tabler:stars
    - title: Kerajaan & Institusi
      description: Program pembekal pilihan untuk agensi kerajaan, pengawal pantai, tentera, dan organisasi kemanusiaan. Dokumentasi sedia tender.
      icon: tabler:building-community
    - title: Rakan Kongsi Resort & Sewa
      description: Harga armada, kualiti konsisten, dan penjenamaan khas untuk resort, pusat menyelam, dan operasi sewaan di seluruh dunia.
      icon: tabler:sun
content_benefits:
  tagline: Mengapa Menjadi Rakan Kongsi Dengan Kami
  title: Mengapa Rakan Kongsi Memilih Aquafarer
  subtitle: Rakan kongsi kami mendapat manfaat dari keupayaan pembuatan sebenar, kualiti konsisten, dan sokongan yang responsif.
  list:
    - 'Akses Kilang Langsung: Bekerja terus dengan pasukan pembuatan kami — tiada orang tengah. Dapatkan respons lebih cepat, harga lebih baik, dan keterlihatan penuh ke dalam pengeluaran.'
    - 'Sedia untuk Penyesuaian: Jenamakan produk anda dengan warna khusus, logo, pembungkusan, dan spesifikasi. Kuantiti pesanan minimum disesuaikan dengan pasaran anda.'
    - 'Kualiti Dijamin: Pengeluaran bersertifikasi 9001 ISO dengan pematuhan CE, UKCA, dan BSCI. Setiap produk diuji sebelum penghantaran.'
    - 'Logistik Global: Penghantaran dari Qingdao, China dengan pilihan FOB, CIF, dan DDP. Gudang di AS di Montclair, CA untuk pengedaran Amerika Utara.'
    - 'Sokongan Pemasaran: Katalog produk, fotografi, dokumentasi teknikal, dan aset digital untuk menyokong usaha jualan anda.'
    - 'Latihan & Sokongan: Latihan produk untuk pasukan jualan anda, sokongan teknikal untuk pelanggan anda, dan koordinasi servis waranti.'
content_process:
  tagline: Cara Menjadi Rakan Kongsi
  title: Proses Perkongsian Mudah
  subtitle: Proses perkongsian kami mudah — direka untuk membolehkan anda menjual produk Aquafarer dengan cepat.
  items:
    - title: 'Langkah 1: Hantar Permohonan'
      description: Lengkapkan borang permohonan rakan kongsi kami dengan profil syarikat anda, pasaran sasaran, dan minat produk.
    - title: 'Langkah 2: Semakan Kelayakan'
      description: Pasukan perkongsian kami akan meneliti permohonan anda dan menghubungi anda dalam masa 3 hari bekerja untuk membincangkan peluang.
    - title: 'Langkah 3: Perjanjian & Persediaan'
      description: Tandatangani perjanjian perkongsian, sediakan akaun anda, dan terima harga rakan kongsi, bahan pemasaran, dan sampel produk.
    - title: 'Langkah 4: Latihan & Pelancaran'
      description: Latihan produk, sokongan jualan, dan bahan pemasaran disediakan. Anda sedia untuk mula menjual.
cta:
  title: Sedia untuk menjadi rakan kongsi Aquafarer?
  subtitle: Mohon untuk perkongsian dan pasukan kami akan memberi maklum balas dalam masa 3 hari bekerja.
  actions:
