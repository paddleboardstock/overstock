content_challenge:
  tagline: Cabaran
  title: Keperluan Bot Memancing<br />Stabiliti, Julat & Ketahanan
  subtitle: Sama ada anda mengendalikan kapal memancing komersial, mengurus armada koperasi, atau menjalankan sewaan memancing — bot anda perlu berfungsi dengan boleh dipercayai setiap hari.
  paragraphs:
    - Bot memancing memerlukan platform stabil untuk mengendalikan tali, menangkap ikan, dan bergerak di dek dengan selamat. Bot tiup dan RIBs menawarkan kestabilan semula jadi melalui reka bentuk tiub mereka — satu kelebihan yang ketara berbanding lambung keras dengan panjang yang setara.
    - Penjimatan bahan bakar penting untuk operasi memancing di mana kos operasi terus mempengaruhi keuntungan. RIBs dan bot tiup lebih ringan daripada bot keras yang setara, memerlukan kuasa lebih sedikit dan menggunakan bahan bakar lebih sedikit — kritikal untuk pengendali komersial yang menjalankan bot setiap hari dan koperasi yang mengurus bajet armada.
    - Ketahanan dalam persekitaran marin adalah penting. Air masin, pendedahan UV, dan penggunaan berterusan memerlukan bahan yang dapat menahan keadaan keras tanpa merosot. Bagi pengendali komersial dan koperasi, kebolehpercayaan secara langsung menjejaskan pendapatan — bot rosak bermakna kehilangan hari memancing.
    - Konfigurasi Aquafarer untuk memancing termasuk pemegang rod, pencari ikan, tangki umpan, tangki hidup, dan penyelesaian pengendalian kargo yang direka untuk aplikasi memancing serius dalam operasi komersial, koperasi, dan rekreasi.
content_solution:
  tagline: Penyelesaian Kami
  title: Konfigurasi Sedia untuk Memancing
  subtitle: Setiap bot memancing Aquafarer boleh dikonfigurasi untuk aplikasi memancing khusus anda.
  list:
    - Pemasangan pemegang rod — dipasang di kilang atau sedia untuk pemasangan selepas pasaran
    - Plat pemasangan pencari ikan/GPS di posisi konsol
    - Pilihan tangki umpan atau tangki hidup untuk pengendali sewaan dan komersial
    - Konfigurasi penyejuk/kediaman untuk pengendalian hasil tangkapan
    - Lambung Deep-V untuk kemampuan jauh dari pantai — stabil ketika rehat, lancar ketika bergerak laju
    - PVC atau Hypalon pilihan tiub — Hypalon untuk pendedahan UV yang panjang
    - Keluaran luar pesisir dari 15 HP hingga 115 HP bergantung pada model dan aplikasi
content_segments:
  tagline: Profil Memancing
  title: Penyelesaian Bot Memancing Tiup<br />Mengikut Jenis Operator
  subtitle: Daripada memancing sukan di perairan pantai hingga longlining komersial — operasi memancing yang berbeza memerlukan konfigurasi badan bot, julat kuasa, dan susunan dek yang berbeza. Kami menyesuaikan setiap bot untuk padan dengan perikanan, perairan, dan gaya kerja.
  items:
    - title: Syarikat Memancing Komersial
      subtitle: Bot kerja armada untuk operasi memancing harian, pengendalian jaring, pengangkutan hasil tangkapan
      description: Syarikat memancing komersial mengendalikan bot kerja untuk menyiapkan dan menarik jaring, menyelenggara perangkap, longlining, dan pengangkutan hasil tangkapan. Bot ini bekerja setiap hari di persekitaran air masin dan mesti menahan beban berat, pengendalian dek yang berterusan, dan jam operasi yang panjang. Kecekapan bahan bakar dan penyelenggaraan rendah adalah kritikal untuk keuntungan armada. Kapal mesti menyediakan platform kerja yang stabil bagi kru yang mengendalikan peralatan dan hasil tangkapan dalam keadaan laut yang berbeza-beza.
      features:
        - Susunan dek rata untuk pengendalian jaring, susunan perangkap, dan penyimpanan ikan
        - Enjin luar pesisir 40-115 HP yang menjimatkan bahan bakar untuk kos operasi harian rendah
        - Tiub Hypalon tahan lasak untuk ketahanan terhadap geseran dalam penggunaan harian
        - Strake geser diperkuat untuk sentuhan kerap dengan dermaga dan kapal
        - Dek membuang air sendiri untuk mudah dibersihkan selepas operasi
        - Harga armada dan spesifikasi konsisten untuk operator multi-kapal
    - title: Operator Memancing Sewaan
      subtitle: Keselesaan pelbagai penumpang, pengendalian hasil tangkapan, disahkan keselamatan
      description: Operator yang menjalankan sewaan memancing separuh hari dan sehari penuh — dari memancing terumbu di pantai hingga memancing dasar jauh. Bot anda memerlukan tempat duduk penumpang dengan sijil keselamatan, ruang dek yang cukup untuk beberapa pemancing, dan ruang livewell terintegrasi untuk menjaga umpan dan hasil tangkapan segar sepanjang perjalanan. Keselesaan tetamu secara langsung mempengaruhi ulasan perjalanan, tempahan semula, dan penilaian dalam talian.
      features:
        - Stereng konsol dengan tempat duduk baldi penyerap hentakan
        - Pemegang rod yang dipasang dari kilang (4–8 posisi)
        - Julat enjin luar 60–115 HP untuk kelajuan pelayaran pesisir jauh
        - Sijil CE Kategori C atau B untuk operasi penumpang komersial
        - Bimini atau T-top sebagai teduhan matahari untuk keselesaan tetamu sepanjang perjalanan panjang
    - title: Nelayan Artisanal & Skala Kecil Komersial
      subtitle: Bot kerja yang boleh dipercayai untuk mata pencarian harian
      description: Nelayan bebas yang bergantung pada bot mereka sebagai sumber pendapatan utama — memasang jaring, menjaga perangkap ikan, atau memancing tangan dekat pantai. Keutamaan anda adalah kecekapan bahan bakar, penyelenggaraan mudah yang boleh anda lakukan sendiri, dan bot yang menampung beban sederhana hasil tangkapan dan peralatan tanpa mengorbankan kestabilan.
      features:
        - Enjin luar 15–40 HP yang menjimatkan bahan bakar untuk kos operasi rendah
        - Tiub Hypalon CSM untuk UV panjang dan ketahanan terhadap geseran
        - Susunan dek rata untuk pengendalian jaring dan penyimpanan ikan
        - Keupayaan pantai mendarat yang mudah dengan perlindungan lunas tiup
    - title: Koperasi Perikanan
      subtitle: Pengumpulan tangkapan, pengangkutan ahli, pengedaran bekalan
      description: Koperasi perikanan mengendalikan armada berasaskan komuniti untuk mengumpul tangkapan daripada nelayan ahli, mengangkut bekalan ke komuniti nelayan yang terpencil, dan mengedarkan hasil tangkapan ke pasaran. Bot kerja ini memerlukan kapasiti muatan tinggi, operasi harian yang boleh dipercayai, dan penyelenggaraan mudah di lokasi terpencil. Koperasi selalunya beroperasi di kawasan membangun di mana ketersediaan alat ganti dan akses perkhidmatan terhad, menjadikan konfigurasi enjin luar yang ringkas dan pembinaan tahan lasak sangat penting.
      features:
        - Kapasiti muatan tinggi untuk mengangkut tangkapan dan bekalan
        - Konfigurasi luar papan yang mudah untuk penyelenggaraan di lokasi
        - Konstruksi PVC atau Hypalon tahan lasak untuk fleksibiliti belanjawan
        - Dek rata dengan titik pengikat untuk mengamankan kargo
        - Operasi jimat bahan api untuk meminimumkan kos operasi koperasi
    - title: Peminat Memancing Sukan & Permainan
      subtitle: Prestasi dan gaya untuk pemancing serius
      description: Pemancing berpengalaman mencari platform memancing yang mampu memberikan kelajuan ke laut jauh, posisi perlawanan berdiri yang stabil, dan kelengkapan premium. Bot mesti selesa sama ada merentasi dua batu laut ke terumbu atau meneroka kawasan air payau terpencil.
      features:
        - Hul Deep-V RIB untuk perjalanan lancar di laut yang bergelombang
        - Plat pemasangan Fishfinder/GPS telah dipasang dan berwayar di konsol
        - Baitwell dan penyejuk terintegrasi dalam modul tempat duduk belakang
        - Pilihan warna dek EVA khas yang sepadan dengan grafik bot/tube
    - title: Panduan Memancing & Operator Eko-Pelancongan
      subtitle: Pengalaman memancing berpandu untuk pemancing pelawat
      description: Panduan yang membawa kumpulan kecil pemancing pelawat ke lokasi memancing yang produktif — sering menggabungkan memancing dengan elemen eko-pelancongan seperti memerhati burung atau meneroka hutan bakau. Bot mesti memberikan perjalanan kering dan selesa untuk tetamu yang tidak biasa dengan bot kecil, dengan kemudahan naik dan pilihan teduhan.
      features:
        - Titik pemasangan Bimini atau T-top dipasang di kilang
        - Tangga menaiki yang lancar untuk kemudahan kembali menaiki bot
        - Enjin luar 4-lejang yang senyap untuk meminimumkan gangguan
        - Ruang penyimpanan kering untuk telefon, dompet, kamera tetamu
