hero:
  tagline: Matriks Penyelesaian Industri
  title: Penyelesaian Marin Berdasarkan Senario<br />Untuk Operasi Profesional
  subtitle: Kenderaan air tiup yang direka khas dan RIBs yang dikonfigurasikan untuk aplikasi penyelamatan, armada sewaan, tender kapal layar, dan perikanan komersial — setiap satunya disokong oleh spesifikasi teknikal dan pilihan penyesuaian.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock penyelesaian marin profesional untuk pelbagai industri
direct_answer: 'Paddle Board Overstock menyediakan kenderaan air tiup dan penyelesaian RIB yang direka berdasarkan senario untuk operasi marin komersial: kapal penyelamat dan rondaan dengan tiub Hypalon diperkuat dan keselamatan berbilang ruang, armada sewaan SUPs dan kayak dengan 1.2 mm PVC dan jahitan dikimpal udara panas untuk ketahanan rendah penyelenggaraan, tender kapal layar mewah dengan hull aluminium V-dalam RIBs, dan konfigurasi perikanan berat dengan pemegang joran dan sistem hidup-air.'
solution_a:
  tagline: Penyelesaian A
  title: Penyelamatan Marin &<br />Rondaan Komersial
  subtitle: RIBs keselamatan berbilang ruang berkelajuan tinggi untuk tindak balas kecemasan profesional dan operasi penguatkuasaan undang-undang.
  badge: Heavy-Duty Series
  description: Kenderaan air penyelamat dan rondaan marin kami RIBs dibina dengan tiub udara Hypalon/PVC ketumpatan tinggi diperkuat yang menampilkan reka bentuk pelayaran bebas berbilang ruang. Setiap kapal dilengkapi dengan pita reflektif gred profesional, tali cengkaman penyelamatan, dan injap inflasi cepat untuk kesiapsiagaan penempatan. Hull fiberglass V-dalam memberikan kestabilan yang luar biasa pada kelajuan tinggi dan dalam kondisi laut bergelora.
  features:
    - title: Keselamatan Berbilang Ruang
      description: 4–6 ruang udara bebas — sebarang bocoran satu ruang mengekalkan apungan positif
    - title: Kain Tiub Diperkuat
      description: 1.2 mm Hypalon CSM atau 1,680 DTEX PVC dengan jahitan dua lapisan dikimpal udara panas
    - title: Gred Profesional
      description: Pita reflektif SOLAS, tali cengkaman penyelamatan, cleat tunda, tali pelukis lepaskan cepat
    - title: Hull Berkelajuan Tinggi
      description: Hull fiberglass atau aluminium V-dalam dinilai untuk 25–45 knot bergantung pada konfigurasi
  recommended_models:
    - RIB 450 Rondaan
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Bahan Hull
      value: Fiberglass / Aluminium Gred Marin
    - label: Kain Tiub
      value: 1.2 mm Hypalon CSM / 1,680 DTEX PVC
    - label: Kelajuan Maksimum
      value: 25–45 knot
    - label: Kapasiti
      value: 6–12 orang
    - label: Julat Enjin
      value: 40–200 HP
    - label: Pensijilan
      value: CE / ISO 9001
solution_b:
  tagline: Penyelesaian B
  title: Sewa Sukan Air &<br />Peralatan Armada Resort
  subtitle: SUPs tiup yang sangat tahan lasak dan mudah dijaga, kayak, dan bot yang dibina untuk kegunaan sewaan harian di resort, kelab, dan operasi lawatan.
  badge: Rental-Grade
  description: Peralatan armada sewaan kami direka untuk ketahanan tertinggi dan kos penyelenggaraan terendah. Kami menggunakan 1.2 mm PVC yang diperkuat dengan teknologi sambungan dikimpal panas bertiga lapisan yang menahan degradasi UV dan kerosakan akibat perlanggaran yang kerap. Pembinaan Drop-stitch memastikan papan mengekalkan kekakuan walaupun selepas ratusan kitaran penyewaan. Semua model mempunyai D-ring yang diperkuat, tali rel tahan haus, dan injap gred komersial.
  features:
    - title: Gred Komersial PVC
      description: 1.2 mm diperkuat PVC dengan penstabil UV — 3x lebih tebal daripada bahan gred pengguna
    - title: Jahitan Dikimpal Dengan Udara Panas
      description: Penyambungan pelapisan tiga lapisan — lebih kuat daripada pengikatan pelekat, menahan delaminasi
    - title: Drop-Stitch Kekakuan
      description: 1,680 DTEX teras dengan 2 benang/in² — dinilai sehingga 20 PSI untuk kekakuan seperti papan keras
    - title: Reka Bentuk Sedia Armada
      description: Cincin D yang diperkukuh, injap Halkey-Roberts komersial, jalur rel tahan geseran
  recommended_models:
    - SUP Letupan Cheetah
    - SUP Pelaut Lautan
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Bahan Tiub
      value: 1.0–1.2 mm Diperkuat PVC
    - label: Teknologi Jahitan
      value: Pengelasan udara panas tiga lapisan
    - label: Tekanan Maksimum
      value: 15–20 PSI (model drop-stitch)
    - label: UV Rintangan
      value: 1,000+ jam ujian dipercepat
    - label: Jaminan
      value: 2–5 tahun bergantung pada model
    - label: Penyelenggaraan
      value: Minimal — bilas dan simpan
solution_c:
  tagline: Penyelesaian C
  title: Bot Bantuan Yacht &<br />Kapal Mewah
  subtitle: Tender RIB ringan, berprestasi tinggi yang direka untuk penyimpanan superyacht dan pengangkutan tetamu dengan kemasan dan susun atur mewah.
  badge: Premium Series
  description: Tender kapal layar kami RIBs menggabungkan pembinaan ringan dengan estetika mewah. Lambung aluminium atau fiberglass Deep-V memberikan kualiti tunggangan yang luar biasa dan mudah diangkat dengan davit. Tersedia dengan grafik tiub yang sepadan dengan warna, upholsteri premium, dan susun atur konsol tersuai. Dimensi penyimpanan kompak menjadikannya ideal untuk garaj superyacht dan penyimpanan dek.
  features:
    - title: Pembinaan Ringan
      description: Lautan-aluminium gred lambung mengurangkan berat sebanyak 30% berbanding gentian kaca untuk mudah diangkat
    - title: Prestasi Deep-V
      description: Laras badan kapal dengan deadrise 18–22 darjah untuk perjalanan yang lancar di laut bergelombang dan penjejakan yang cemerlang
    - title: Kemasan dan Kesesuaian Mewah
      description: Tukangan upholsteri khas, tiub dipadankan warna, konsol helm premium, pakej keluli tahan karat
    - title: Penyimpanan Padat
      description: Direka untuk garaj kapal mewah — tiub boleh kempis untuk penyimpanan padat
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Jenis Lambung
      value: Aluminium / Fiberglass V-Mendalam
    - label: Sudut lunas
      value: 18–22 darjah
    - label: Kelajuan Maksimum
      value: 30–40 knot
    - label: Berat Kering
      value: 120–350 kg (lencana aluminium)
    - label: Davit Lif Siap
      value: Ya — standard titik pengangkatan
    - label: Penyimpanan
      value: Tiub boleh kempis, boleh ditindih
