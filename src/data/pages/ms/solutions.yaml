features3_solutions:
  tagline: Penyelesaian
  title: Pengembaraan Air Anda<br />Rakan Perniagaan
  isBeforeContent: false
  columns: 3
  items:
    - title: Kelab Sukan Air
      description: Pakej peralatan lengkap, penjenamaan custom, dan program penyelenggaraan untuk kelab SUP, kelab kayak, sekolah luncur, dan pusat latihan.
      icon: tabler:users
      link: /solutions/clubs
    - title: Sukan Air RIBs
      description: RIBs yang dibina khusus untuk sekolah belayar, pusat sukan air, dan organisasi acara. Bot jurulatih, bot penarik, dan bot marshal untuk sukan air profesional.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resort & Hotel
      description: Program sukan air premium dengan peralatan armada, sistem keselamatan, latihan kakitangan, dan pengurusan pendapatan untuk hartanah hospitaliti.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Usahawan Jenama Air
      description: Pembuatan label peribadi OEM/ODM dengan MOQs rendah, reka bentuk produk custom, pembungkusan, dan penghantaran global untuk pemilik jenama baru.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Bot Pusat Menyelam
      description: Platform RIB yang stabil dengan kemasukan/keluaran mudah, penyimpanan peralatan, dan konfigurasi enjin yang dioptimumkan untuk operasi menyelam.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Kapal Penyelamat & Kecemasan Air
      description: Bot RIBs berkelajuan tinggi dan bot tiup yang direka untuk pencarian dan penyelamatan, tindak balas kecemasan, dan operasi pengawal pantai.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Penyelesaian Tender Kapal Layar
      description: Tender RIB yang kompak dan bergaya yang melengkapkan kapal layar mewah dan kapal rekreasi. Penyimpanan mudah, prestasi berkuasa.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Penyelesaian Bot Memancing
      description: Bot tiub yang stabil dan tahan lama serta RIBs yang dikonfigurasi untuk operasi memancing komersial dan rekreasi.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Peralatan Pelancongan Marin
      description: Bot tiup sedia armada, papan SUP, dan kayak untuk resort, pengendali pelancongan, dan perniagaan penyewaan sukan air.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Tenaga Lepas Pantai RIBs
      description: RIBs berat untuk sokongan platform minyak dan gas, pemindahan kru ladang angin, pemeriksaan kabel bawah laut, dan pembinaan marin.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Bot Kerja Akuakultur
      description: RIBs tahan kakisan untuk penternakan ikan, pembiakan mutiara, dan ternakan laut. Tiub Hypalon, perkakasan keluli tahan karat, ketahanan penggunaan harian.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Penyelidikan & Kajian Marin
      description: RIBs stabil bersedia dengan instrumen untuk penyelidikan oseanografi, pemantauan alam sekitar, pensampelan kualiti air, dan program pengajaran universiti.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Bot Kerja Komersial
      description: RIBs berat untuk rondaan, kajian, pengangkutan, dan logistik lepas pantai. Dibina untuk memenuhi tuntutan operasi komersial yang ketat.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Tidak Pasti Mana Laluan Sesuai Dengan Perniagaan Anda?
  subtitle: Ceritakan kepada kami tentang operasi anda — kami akan mengesyorkan pakej peralatan yang sesuai, program penjenamaan, atau penyelesaian khusus.
  actions:
    - variant: primary
      text: Dapatkan Konsultasi Percuma
      href: /contact
