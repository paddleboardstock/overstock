content_founding:
  tagline: Permulaan
  title: Lahir Di Tepi Air
  subtitle: 'Aquafarer bermula di bengkel pesisir pantai di Qingdao dengan satu bot dan satu visi: untuk membina kenderaan air tiup yang mampu menghadapi keadaan marin sebenar.'
  paragraphs:
    - Pada 2012, pengasas kami melihat kekosongan di pasaran — kebanyakan bot tiup sama ada mampu milik tetapi tidak boleh dipercayai, atau berkualiti tinggi tetapi terlalu mahal. Mereka percaya terdapat ruang untuk pengeluar yang menawarkan kedua-dua kualiti dan nilai.
    - Badan kapal pertama dibina secara manual, diuji di perairan tempatan, dan diperhalusi berdasarkan maklum balas sebenar daripada nelayan dan pengendali komersial kecil. Gelung maklum balas itu — bina, uji, dengar, tambah baik — kekal sebagai teras falsafah kejuruteraan kami hari ini.
    - Menjelang 2015, berita telah tersebar melangkaui Qingdao. Pengedar antarabangsa mula meminta sampel. Apa yang bermula sebagai bengkel tempatan kini menjadi pembekal global.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Bengkel pengeluaran awal dan pembuatan
content_growth:
  tagline: Pertumbuhan & Inovasi
  title: Dari Bengkel ke Kemudahan seluas 12,000 m²
  subtitle: Pelaburan berterusan dalam manusia, peralatan, dan proses telah berubah Aquafarer menjadi kemudahan pembuatan marin moden.
  paragraphs:
    - Apabila permintaan meningkat, kemudahan kami juga meningkat. Kami berkembang dari bengkel kecil kepada kilang seluas 12,000 m² dengan barisan pengeluaran khusus untuk RIB bot, bot tiup, SUP papan dan aksesori.
    - Kami melabur dalam CNC mesin pemotong, peralatan kimpalan frekuensi tinggi, barisan pengeluaran jahitan jatuh, dan rig ujian menyeluruh — membolehkan kami mengawal setiap aspek kualiti pengeluaran.
    - Hari ini, pasukan kami seramai 200-300 orang terdiri daripada jurutera marin, saintis bahan, pakar kawalan kualiti, dan tukang mahir — ramai di antara mereka telah bersama Aquafarer sejak zaman awal.
content_mission:
  tagline: Misi Kami
  title: Kebebasan Kejuruteraan Di Air
  subtitle: Setiap produk Aquafarer direka untuk membantu orang meneroka, bekerja, dan berkembang di atas air — dengan boleh dipercayai, selamat, dan berpatutan.
  list:
    - Reka kenderaan air yang berprestasi dalam keadaan marin sebenar — bukan hanya di atas kertas
    - Membina kerjasama jangka panjang dengan pengedar dan jenama melalui perkhidmatan OEM/ODM yang boleh dipercayai
    - Sentiasa memperbaiki proses pembuatan kami untuk memberikan nilai yang lebih baik
    - Menyokong setiap produk dengan alat ganti tulen dan kepakaran teknikal
cta:
