  title: Paddle Board Overstock — Kejuruteraan Kebebasan Di Air
  subtitle: 'Dari bengkel pesisir ke pengeluar marin global — perjalanan kami dibina atas kepercayaan yang degil: papan dayung harus direka seperti ia penting, kerana ia memang penting.'
