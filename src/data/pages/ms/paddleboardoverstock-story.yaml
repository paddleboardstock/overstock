timeline:
  - year: '2012'
    title: Asas Pembuatan Marin
    body: Paddle Board Overstock bermula sebagai bengkel papan dayung tiup khusus di Weihai, China, yang komited terhadap kehandalan marin dan pembuatan papan. Tumpuan awal adalah membina produk tiup yang boleh dipercayai melalui pengalaman kejuruteraan praktikal dan disiplin pembuatan.
  - year: '2015'
    title: Eksport Pertama
    body: Pesanan eksport awal telah sampai ke Jepun dan Korea, menandakan kemasukan Paddle Board Overstock ke pasaran antarabangsa. Syarikat itu mula menyediakan perkhidmatan kepada perenang dan peminat sukan air di luar China.
  - year: '2018'
    title: Pengembangan Kilang
    body: Berpindah ke fasiliti pengeluaran seluas 12,000 m². Menambah talian kimpalan RF dan kapasiti pengeluaran drop-stitch, membolehkan pembuatan skala lebih besar dan sistem kawalan kualiti yang diperbaiki.
  - year: '2020'
    title: Pusat R&D Ditubuhkan
    body: Membuka pusat R&D khusus dengan makmal kain PVC, tangki ujian hidrodinamik, dan studio simulasi CAD/FEA. Pembangunan produk diperluas untuk menumpukan pada pembinaan ringan, ketahanan yang diperbaiki, dan reka bentuk berpusatkan pengguna.
  - year: '2022'
    title: Pertumbuhan Global
    body: Diperluas kepada 14 jurutera R&D dan 200+ pekerja. Papan telah sampai kepada pengayuh di seluruh Eropah, Amerika, dan Asia-Pasifik, dihantar ke 50+ negara.
  - year: '2024'
    title: Inovasi & Studio Reka Bentuk
    body: Melancarkan studio reka bentuk dan inovasi perkhidmatan penuh untuk siri papan baru, dari konsep hingga pengeluaran. Mengembangkan dek siri seni tanda tangan kami dan platform jelajah.
  - year: '2026'
    title: Membina Masa Depan Eksplorasi Air
    body: Hari ini, Paddle Board Overstock terus membangunkan papan SUP boleh tiup, perkakasan mendayung, dan penyelesaian marin tersuai — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara dilayani, kapasiti tahunan 15,000 unit.
content_founding:
  tagline: Permulaan
  title: Lahir Di Tepi Air
  subtitle: 'Paddle Board Overstock bermula di sebuah bengkel pantai di Weihai dengan satu papan dan sebuah visi: untuk membina papan dayung tiup yang mampu menghadapi keadaan laut sebenar.'
  paragraphs:
    - Pada tahun 2012, pengasas kami melihat satu jurang dalam pasaran — kebanyakan papan tiup sama ada mampu milik tetapi tidak boleh dipercayai, atau berkualiti tinggi tetapi mahal secara melampau. Mereka percaya terdapat ruang untuk pengeluar yang dapat menawarkan kedua-dua kualiti dan nilai.
    - Badan kapal pertama dibina secara manual, diuji di perairan tempatan, dan diperhalusi berdasarkan maklum balas sebenar daripada nelayan dan pengendali komersial kecil. Gelung maklum balas itu — bina, uji, dengar, tambah baik — kekal sebagai teras falsafah kejuruteraan kami hari ini.
    - Menjelang 2015, berita telah tersebar ke luar Weihai. Pemain papan dayung dan kedai sukan air di seluruh Asia mula membuat permintaan untuk papan-papan tersebut. Apa yang bermula sebagai bengkel tempatan sedang menjadi jenama global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock bengkel pengeluaran awal dan pembuatan
content_growth:
  tagline: Pertumbuhan & Inovasi
  title: Dari Bengkel ke Kemudahan seluas 12,000 m²
  subtitle: Pelaburan berterusan dalam sumber manusia, peralatan, dan proses telah mengubah Paddle Board Overstock menjadi kemudahan pembuatan marin moden.
  paragraphs:
    - Seiring dengan meningkatnya permintaan, begitu juga kemudahan kami. Kami berkembang dari bengkel kecil kepada kilang seluas 12,000 m² dengan barisan pengeluaran khas untuk papan SUP, aksesori, dan peralatan keselamatan.
    - Kami melabur dalam CNC mesin pemotong, peralatan kimpalan frekuensi tinggi, barisan pengeluaran jahitan jatuh, dan rig ujian menyeluruh — membolehkan kami mengawal setiap aspek kualiti pengeluaran.
    - Hari ini, pasukan kami yang terdiri daripada 200-300 orang termasuk jurutera marin, saintis bahan, pakar kawalan kualiti, dan tukang mahir — ramai daripada mereka telah bersama Paddle Board Overstock sejak awal penubuhan.
founder:
  tagline: Kenali Pengasas
  title: Dibina oleh Seorang Pengangkut Air
  subtitle: Pengasas David Chen menggabungkan kepakaran pembuatan dengan minat seumur hidup dalam sukan air — gabungan yang menentukan bagaimana Paddle Board Overstock mendekati pembangunan produk.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Pengasas Paddle Board Overstock
  story:
    - David Chen membesar di pesisir Weihai, di mana laut bukan destinasi percutian tetapi cara hidup. Dia menghabiskan zaman mudanya dengan mendayung, belayar, dan memancing di Laut Kuning — pengalaman yang memberikannya pemahaman intuitif tentang apa yang perlu dihadapi oleh papan dayung.
    - Sebelum menubuhkan Paddle Board Overstock, David menghabiskan satu dekad dalam pembuatan marin, bekerja dalam pengeluaran, kualiti, dan perdagangan antarabangsa. Dia mengetuai program pengeluaran dan kualiti untuk pasaran Eropah dan Amerika Utara, mempelajari harapan pemain papan dayung global secara langsung.
    - 'Pada 2012, dia menubuhkan Paddle Board Overstock dengan misi mudah: membina papan dayung tiup yang dia sendiri akan percayai untuk keluarganya di atas air. Standard peribadi itu — adakah saya akan menggunakan ini? — kekal sebagai ujian terakhir untuk setiap produk yang keluar dari kilang.'
    - Hari ini, David memimpin strategi produk dan mengawasi pasukan R&D, secara peribadi menyemak reka bentuk baru dan menguji prototaip di perairan Weihai. Beliau percaya bahawa produk hebat datang dari memahami kedua-dua kejuruteraan dan pengalaman.
philosophy:
  tagline: Falsafah Jenama
  title: Kebebasan Kejuruteraan Di Air
  body: Kebebasan di atas air bukan sekadar tentang pergerakan. Ia mewakili penemuan tempat baru, mencipta pengalaman luar, menghubungkan orang dengan alam semula jadi, dan membolehkan misi profesional. Kejuruteraan menjadikan kebebasan itu mungkin.
  pillars:
    - title: Kebolehpercayaan Diutamakan
      body: Persekitaran air menuntut kepercayaan. Produk Paddle Board Overstock direka berdasarkan kestabilan, ketahanan, keselamatan, dan prestasi konsisten.
    - title: Reka Bentuk Berpusatkan Manusia
      body: Produk seharusnya berkhidmat untuk manusia, bukan teknologi. Setiap keputusan reka bentuk bermula dengan memahami bagaimana orang menggunakan papan mereka, di mana mereka menjelajah, dan cabaran apa yang mereka hadapi.
    - title: Eksplorasi Mudah Diakses
      body: Air tidak sepatutnya hanya milik pakar. Paddle Board Overstock mencipta peralatan yang membolehkan lebih ramai orang mengalami sungai, tasik, lautan, dan persekitaran pesisir dengan selamat.
    - title: Inovasi berterusan
      body: Inovasi bukan sahaja mencipta produk baru. Ia memperbaiki setiap perincian — bahan, struktur, pembuatan, dan pengalaman pengguna.
engineeringDna:
  tagline: DNA Kejuruteraan
  title: Bagaimana Paddle Board Overstock Mencipta Produk
  areas:
    - title: Sains Bahan
      body: Paddle Board Overstock memfokuskan pada pemilihan bahan yang sesuai untuk pelbagai persekitaran marin. Pertimbangan utama termasuk ketahanan terhadap geseran, ketahanan UV, kestabilan tekanan, dan ketahanan jangka panjang.
      items:
        - Rintangan Lelasan
        - UV Rintangan
        - Kestabilan Tekanan
        - Ketahanan Jangka Panjang
    - title: Kejuruteraan Struktur
      body: Papan dayung tiup memerlukan keseimbangan yang tepat antara kekakuan, berat, kebolehpindahan, dan kestabilan. Kejuruteraan Paddle Board Overstock menumpukan pada mengoptimumkan faktor-faktor ini melalui teknologi teras drop-stitch dan pembinaan jahitan canggih.
      items:
        - Kekukuhan
        - Pengoptimuman Berat
        - Kebolehpindahan
        - Kestabilan
    - title: Ketepatan Pembuatan
      body: 'Setiap produk melalui proses terkawal: penyediaan bahan, pemotongan tepat, pengelasan dan pengikatan, pemasangan, pemeriksaan kualiti, dan pengesahan prestasi.'
      items:
        - Penyediaan Bahan
        - Pemotongan Tepat
        - Pengelasan & Pengikatan
        - Pemasangan & QC
    - title: Kejuruteraan Senario Pengguna
      body: Produk dibangunkan berdasarkan aplikasi mendayung sebenar — rekreasi, pengembaraan, keluarga, dan pelancongan — memastikan setiap reka bentuk memenuhi tuntutan khusus persekitaran yang dimaksudkan.
      items:
        - Rekreasi
        - Pengembaraan
        - Keluarga
        - Pelancongan
