rd_services:
  tagline: R&D Tersuai
  title: Perkhidmatan R&D untuk Rakan Kongsi
  services:
    - title: Pembangunan Bahan Tersuai
      desc: Kami membangunkan formulasi fabrik tersuai, tumpukan laminat, dan sistem pelekat yang disesuaikan dengan persekitaran operasi dan sasaran prestasi anda.
    - title: OEM / ODM Kejuruteraan Produk
      desc: Daripada lakaran konsep hingga pakej kejuruteraan sedia pengeluaran — pasukan kami boleh mereka bentuk, membuat prototaip, dan mengesahkan bot di bawah jenama anda.
    - title: Ujian & Pensijilan Pihak Ketiga
      desc: Gunakan fasiliti ujian ISO-mematuhi kami untuk pengujian bahan bebas, pengesahan produk, dan sokongan pensijilan.
  cta: Bincangkan keperluan R&D anda →
  cta_link: /contact
vision:
  tagline: Visi Kami
  title: Membentuk Masa Depan Sukan Air
  body: Aquafarer berusaha memimpin industri bot tiup dan SUP melalui inovasi berterusan, kualiti yang tidak tergoyahkan, serta komitmen teguh terhadap keselamatan dan kelestarian — akhirnya memperkayakan pengalaman peminat sukan air di seluruh dunia. Pusat R&D Aquafarer adalah tempat di mana semangat bertemu inovasi, menetapkan piawaian baru untuk industri sukan air.
labs_section:
  tagline: Makmal
  title: Makmal Kami
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Makmal Fabrik
      description: Penyelidikan dan ujian berterusan ke atas kain tiub PVC dan Hypalon untuk kekuatan tegangan, rintangan UV, keausan, dan fleksibiliti pada suhu rendah bagi memastikan kebolehpercayaan jangka panjang dalam persekitaran marin.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studio Kejuruteraan Hull
      description: Rekaan berasaskan CAD dan analisis elemen terhingga bagi hull HDPE, aluminium, dan fiberglass. Setiap hull disimulasikan secara digital untuk agihan tekanan dan ketahanan impak sebelum prototaip pertama dibina.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Pusat Kimpalan RF
      description: Fasiliti kimpalan frekuensi radio khusus dengan kawalan suhu dan tekanan yang tepat, menghasilkan jahitan kedap udara yang kuat dan memenuhi piawaian industri marin bagi kenderaan tiup.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Tangki Ujian Hidrodinamik
      description: Ujian model berskala dalam tangki ujian dalaman kami untuk mengoptimumkan bentuk lunas, prestasi meluncur, kestabilan, dan kecekapan bahan api merentasi pelbagai keadaan muatan dan laut.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Bengkel Prototaip
      description: Fasiliti prototaip dan pemasangan skala penuh di mana model baharu dibina, dipasang, dan diuji di laut. Setiap prototaip menjalani program ujian di dalam air sekurang-kurangnya 20 jam sebelum kelulusan pengeluaran.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Makmal Kualiti & Pemeriksaan
      description: Makmal jaminan kualiti khusus yang melakukan ujian tegangan, kitaran pengekalan udara, ujian pelepasan jahitan, dan pensijilan bahan untuk memastikan setiap bot yang keluar dari bengkel memenuhi spesifikasi yang diterbitkan oleh kami.
      href: /randdcenter/quality-inspection-lab
