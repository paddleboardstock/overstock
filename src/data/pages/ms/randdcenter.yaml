hero:
  tagline: Pusat R&D
  title: Pusat R & D
  subtitle: Fokus pada Kemajuan
intro:
  - Pusat Penyelidikan dan Pembangunan (R&D) Aquafarer adalah kuasa pendorong di sebalik misi kami untuk merevolusikan peralatan sukan air. Kami memberdayakan penggemar sukan air di seluruh dunia dengan produk yang lebih selamat, lebih selesa, dan lebih menyeronokkan melalui inovasi tiada henti dalam papan dayung berdiri tiup (SUPs) dan bot. Pasukan berdedikasi kami yang terdiri daripada jurutera, pereka, dan pakar sukan air yang bersemangat sedang membentuk masa depan industri, sentiasa meningkatkan piawaian kualiti, prestasi, dan kelestarian.
  - Kemudahan R&D kami menyatukan saintis bahan, arkitek kapal, dan jurutera pengeluaran di bawah satu bumbung. Dari formulasi kain dan simulasi tubuh kapal hingga pembangunan proses pengelasan dan ujian laut berskala penuh, setiap peringkat pembangunan produk didorong oleh data dan disahkan melalui ujian.
mission:
  tagline: Misi Kami
  title: Mencipta Masa Depan Sukan Air
  pillars:
    - icon: lightning
      title: Kemajuan Teknologi
      desc: Memelopori bahan, reka bentuk, dan pembuatan baharu untuk prestasi dan ketahanan produk yang unggul.
    - icon: design
      title: Reka Bentuk Berpusat Pada Pengguna
      desc: Memahami dengan mendalam dan melebihi keperluan pengguna melalui reka bentuk produk yang ergonomik dan intuitif.
    - icon: globe
      title: Amalan Lestari
      desc: Meminimumkan jejak alam sekitar kita dengan menggunakan bahan dan proses mesra alam.
    - icon: shield
      title: Keselamatan Tanpa Kompromi
      desc: Memastikan piawaian keselamatan tertinggi melalui ujian dan pensijilan yang ketat.
pillars:
  - title: Kemajuan Teknologi
    desc: Meneroka bahan, reka bentuk, dan proses pembuatan baru untuk memberikan prestasi produk yang unggul dan ketahanan yang lama.
    icon: tech
  - title: Bahan Lanjutan
    desc: Menyiasat PVC, Hypalon, komposit terkini, dan alternatif lestari untuk ciri produk yang dipertingkatkan.
    icon: materials
  - title: Kelestarian
    desc: 'Komitmen Teras: Kami berdedikasi kepada pemuliharaan alam sekitar melalui pembuatan yang lestari dan bahan boleh kitar semula.'
    icon: sustainability
capabilities:
  tagline: Kebolehan
  title: Keupayaan R&D
  subtitle: Empat disiplin teras yang memberi kita kawalan menyeluruh ke atas pembangunan produk — dari penyelidikan bahan mentah hingga pensijilan akhir.
  groups:
    - title: Sains Bahan & Teknologi Kain
      items:
        - Analisis dan pengoptimuman formulasi PVC dan Hypalon
        - UV penstabilan, ketahanan api, dan pembangunan bahan tambahan anti-mikrob
        - Laminasi fabrik berbilang lapisan dan kejuruteraan lekatan
        - Ujian penuaan dipercepat (UV, terma, kelembapan, semburan garam)
    - title: Kejuruteraan Lambung & Hidrodinamik
      items:
        - Reka bentuk keseluruhan 3D parametrik dan pengoptimuman CFD
        - Analisis unsur terhingga untuk beban struktur dan impak
        - Ujian kolam penarik model skala dan pengesahan prestasi
        - Pembangunan lambung khusus untuk profil misi khas
    - title: Teknologi Pengelasan & Penyambungan
      items:
        - Pembangunan dan pengoptimuman proses pengelasan dielektrik RF
        - Kaedah pengelasan udara panas, wig panas, dan ultrasonik
        - Kelayakan penyambungan pelekat dan pita jahitan
        - Pemodelan kekuatan kimpalan dan ramalan jangka hayat
    - title: Ujian, Pensijilan & Pematuhan
      items:
        - Pengurusan kualiti dan ujian pematuhan CE
        - Sokongan pengujian dan pensijilan pihak ketiga yang bebas
        - Pembangunan protokol ujian tersuai untuk kelayakan perolehan
        - Analisis kegagalan semasa perkhidmatan dan penyiasatan punca akar
