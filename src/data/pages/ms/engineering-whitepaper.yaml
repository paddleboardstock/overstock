      scope: Bot tiup — pembinaan, kestabilan, apungan, ujian tekanan
    - name: REACH
      body: Peraturan EU
      scope: Keselamatan kimia — bahan terhad dalam bahan dan salutan
section_faq:
  title: Soalan Lazim Teknikal
  questions:
    - q: Bagaimana drop-stitch dibandingkan dengan pembinaan keras tradisional?
      a: Teras drop-stitch moden pada 20 PSI mencapai 85–90% kekakuan EPS foam/fiberglass yang setara dengan cangkerang keras, sambil sepenuhnya boleh dikempiskan untuk pengangkutan. Pertukaran adalah berat sedikit lebih tinggi dan kekakuan maksimum lebih rendah — tetapi untuk kebanyakan aplikasi rekreasi dan komersial, perbezaannya tidak ketara.
    - q: Apakah ketumpatan benang yang dianggap kualiti premium?
      a: Kain drop-stitch premium menggunakan 2 benang per inci persegi (lebih kurang 3,100 benang per m²) tenunan daripada 1,680 benang poliester DTEX. Kain tahap permulaan menggunakan 1 benang per inci persegi dengan 1,100 benang DTEX.
    - q: Bolehkah Hypalon dikimpal seperti PVC?
      a: Tidak. Hypalon/CSM tidak boleh dikimpal RF. Ia mesti dipasang menggunakan simen sentuhan secara manual, yang menjadikan pengeluaran lebih intensif tenaga kerja dan jahitan bergantung pada kemahiran operator. PVC boleh dikimpal RF atau dikimpal udara panas untuk kualiti jahitan automatik yang konsisten.
    - q: Apakah tekanan maksimum selamat untuk bot tiup?
      a: Tiub bot tiup standard beroperasi pada 8–12 PSI. Lantai Drop-stitch beroperasi pada 12–20 PSI. Teras drop-stitch tekanan tinggi (SUPs) boleh beroperasi pada 20–25 PSI. Setiap produk termasuk injap pelepas tekanan yang diikat untuk mengelakkan pengembangan berlebihan.
    - q: Berapa lama masa yang diperlukan untuk mengilangkan bot tiup khusus?
      a: Pengeluaran OEM standard mengambil masa 30–45 hari dari pengesahan pesanan hingga FOB Qingdao. Pembangunan acuan tersuai menambah 15–20 hari untuk pengeluaran prototaip dan ujian.
