hero:
  tagline: Kertas Putih Kejuruteraan
  title: Drop-Stitch Teknologi & Sains Bahan:<br />Kejuruteraan di Sebalik Kenderaan Air Tiup Moden
  subtitle: Rujukan teknikal yang berwibawa merangkumi drop-stitch pembinaan teras, PVC Hypalon perbandingan berbanding bahan, ujian ketegaran bekas tekanan tinggi, dan piawaian pembuatan kenderaan air.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer Makmal R&D — ujian bahan dan kejuruteraan
direct_answer: Drop-stitch Teknologi menggunakan ribuan benang poliester dalaman yang menghubungkan lapisan atas dan bawah fabrik teras boleh tiup. Apabila dikembangkan kepada 15–20PSI, ulir-ulir ini bertindak sebagai anggota ketegangan, mengelakkan kembung dan mewujudkan struktur kukuh yang setanding dengan pembinaan cangkerang keras. Digabungkan dengan PVC Hypalon salutan fabrik canggih dan kimpalan RF, ini membolehkan kenderaan air mudah alih berprestasi tinggi yang sesuai untuk kegunaan profesional, komersial, dan rekreasi.
section_drop_stitch:
  title: Drop-Stitch Kejuruteraan Struktur
  subtitle: Bagaimana ribuan benang mengubah fabrik fleksibel menjadi struktur yang kukuh
  content: |
    Drop-stitch (juga dikenali sebagai "drop-stitchfabrik" atau "drop-stitchteras") mewakili satu kejayaan dalam kejuruteraan struktur boleh tiup. Prinsipnya kelihatan mudah: ribuan benang poliester individu dianyam serentak menjadi dua lapisan fabrik asas yang berasingan, menghubungkan panel atas dan bawah pada sudut 90 darjah.

    Apabila ruang tertutup bertekanan, tekanan udara dalaman memberikan daya sama rata ke semua arah — cuba menolak panel atas dan bawah menjadi bentuk silinder. Beribu-ribu drop-stitch benang menahan pemisahan ini, memindahkan beban ke dalam ketegangan sepanjang paksi benang. Hasilnya ialah panel rata dan kaku yang mampu menahan tekanan dalaman 15–20.PSI

    Pada 20 PSI, panel seluas 1 m² drop-stitch mengalami kira-kira 14,000 kg daya dalaman keseluruhan — namun matriks benang menahannya dengan sempurna. Ini memberikan drop-stitch struktur nisbah kekuatan kepada berat yang setanding dengan bahan keras tradisional.
section_materials:
  title: PVC vs Hypalon — Perbandingan Bahan Teknikal
  subtitle: Data objektif untuk pemilihan bahan yang berinformasi dalam pembuatan kenderaan air boleh tiup
  table:
    columns:
      - header: Harta
      - header: PVC (Polivinil Klorida)
      - header: Hypalon (CSM)
    rows:
      - property: Rintangan UV
        pvc: Baik (dengan UV penstabil)
        hypalon: Cemerlang (sendiri)
      - property: Rintangan Lelasan
        pvc: bagus
        hypalon: Sangat bagus
      - property: kekuatan tegangan
        pvc: 3,000–5,000 N/5cm
        hypalon: 2,500–4,000 N/5cm
      - property: Berat per m²
        pvc: 850–1,200 g
        hypalon: 1,100–1,500 g
      - property: Cold Flex
        pvc: -30°C
        hypalon: -20°C
      - property: Kaedah Penyambungan
        pvc: Kimpalan RF / Kimpalan udara panas
        hypalon: Gam tangan (simen sentuhan)
      - property: Kebolehbaikan
        pvc: Mudah (las haba atau pelekat)
        hypalon: Memerlukan pelekat CSM
      - property: Kos Bahan
        pvc: $8–15 / m²
        hypalon: $20–40 / m²
      - property: Jangka Hayat (matahari tropika)
        pvc: 5–8 tahun
        hypalon: 10–15 tahun
      - property: Julat Warna
        pvc: Luas (spectrum warna penuh)
        hypalon: Terhad (warna asas)
      - property: Rintangan Kimia
        pvc: Baik (gred tahan bahan api/minyak)
        hypalon: Cemerlang (julat kimia luas)
section_testing:
  title: Protokol Ujian & Keselamatan
  subtitle: Rangka kerja jaminan kualiti Aquafarer untuk setiap lot pengeluaran
  protocols:
    - title: Ujian Tahan Tekanan 1.25x Dinilai
      description: Setiap bekas yang dipasang dipam sehingga 1.25x tekanan operasi yang dinilai dan ditahan selama 24–48 jam. Sebarang penurunan tekanan melebihi 2% akan menyebabkan penolakan dan kerja semula.
      standard: ISO 6185
    - title: Ujian Kekuatan Tanggalkan Jahitan
      description: Contoh jahitan las dan gam dari setiap lot pengeluaran diuji untuk kekuatan tanggalkan menggunakan peralatan tegangan yang dikalibrasi. Ketahanan tanggalkan minimum 4 kN/m diperlukan.
      standard: ISO 2411
    - title: Ujian Tegangan Kain
      description: Gulung kain yang masuk menjalani ujian kekuatan tegangan dan regangan dalam arah lungsi dan pakan. Ambang penolakan di bawah 3,000 N/5cm untuk PVC.
      standard: ISO 1421
    - title: UV Penuaan Percepat
      description: Contoh bahan dikenakan 1,000+ jam pendedahan UV percepat dalam bilik ujian QUV. Kehilangan kekuatan tegangan maksimum 15% dibenarkan.
      standard: ASTM G154
    - title: Integriti Injap & Fitment
      description: Setiap pemasangan injap diuji untuk integriti pengedap pada 1.25x tekanan yang dinilai. Injap balik diuji untuk prestasi pengedap sehala.
      standard: ISO 12402
section_manufacturing:
  title: Standard Pengilangan & Pensijilan Kualiti
  subtitle: Pematuhan standard industri untuk akses pasaran global
  standards:
    - name: ISO 9001:2015
      body: SGS Disahkan
      scope: Sistem pengurusan kualiti merangkumi reka bentuk, pengeluaran, dan penghantaran
    - name: CE 2013/53/EU
      body: Badan Notifikasi EU
      scope: Arahan Kraf Rekreasi — reka bentuk hull, kestabilan, apungan, pelepasan
    - name: BSCI
      body: Amfori
      scope: Pematuhan sosial — keselamatan pekerja, pekerjaan adil, pengurusan alam sekitar
