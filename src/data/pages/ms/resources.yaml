hero_text:
  tagline: Sumber
  title: Muat turun Pusat & Panduan Mendayung
  subtitle: Katalog produk, panduan pembelian, dan arahan penjagaan untuk membantu anda memilih, menggunakan, dan menikmati papan kembung anda SUP .
features3_downloads:
  tagline: Muat Turun
  title: Dokumentasi Produk<br />& Sumber Mendayung
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog Produk 2026 SUP
      description: 'Paddle Board Overstock SUP Rangkaian lengkap: papan serba boleh, siri seni, dan aksesori, dengan spesifikasi penuh dan kandungan pakej. Format PDF.'
      icon: tabler:file-text
    - title: Panduan Pembeli Tiup SUP
      description: 'Cara memilih papan pertama anda: panjang, lebar, ketebalan, isipadu, padanan berat penunggang, dan bentuk papan yang sesuai dengan gaya mendayung anda.'
      icon: tabler:file-description
    - title: SUP Panduan Saiz & Padanan
      description: Padankan isipadu dan dimensi papan mengikut berat badan dan tahap kemahiran anda, dengan cadangan aktiviti khusus untuk rekreasi, jelajah, yoga, dan kecergasan.
      icon: tabler:clipboard-check
    - title: Panduan Penjagaan & Penyelenggaraan Papan
      description: 'Pastikan papan anda seperti baru: pembersihan, pengeringan, penyimpanan, UV perlindungan, penjagaan injap, dan arahan pembaikan kecil.'
      icon: tabler:tool
    - title: Panduan Bahan Papan Kembung
      description: PVC pembinaan, drop-stitch teras, EVA pad dek, dan apa PSI maksud kekakuan 15 untuk prestasi dan ketahanan.
      icon: tabler:files
    - title: Memulakan dengan SUP
      description: 'Asas pendayung kali pertama: inflasi, membawa, melancarkan, gerakan asas, dan keperluan keselamatan untuk membuat anda berdiri pada hari pertama.'
      icon: tabler:swimming
faqs:
  title: Soalan Lazim
  subtitle: Soalan biasa tentang papan kami, pesanan, dan cara berada di atas air.
  columns: 2
  items:
    - title: Apa yang disertakan dengan papan saya?
      description: Setiap pakej lengkap termasuk papan, paddle boleh laras, pam aliran tinggi, tali, kit pembaikan, dan beg galas. Set Oars & Pump juga tersedia secara berasingan.
      icon: tabler:package
    - title: Berapa lama inflasi mengambil masa?
      description: Dengan pam aliran tinggi yang disertakan, kebanyakan pendayung mencapai tekanan penuh dalam 8-12 minit. Pam elektrik juga berfungsi — hanya berhenti pada tekanan yang dicetak berhampiran injap.
      icon: tabler:clock
    - title: Bagaimana saya memilih papan yang betul?
      description: 'Mulakan dengan berat badan dan gaya mendayung anda: pemula dan keluarga gemar platform yang lebar dan stabil seperti SUP Explorer 11; pendayung yoga lebih suka cengkaman dek penuh; pendayung pelancong mahukan bentuk yang kaku dan aerodinamik. Pasukan kami dengan senang hati mengesyorkan.'
      icon: tabler:help-circle
    - title: Apakah kaedah pembayaran yang anda terima?
      description: Kami menerima kad kredit utama, PayPal, dan pemindahan bank. Semua harga termasuk pakej lengkap — tiada tambahan tersembunyi.
      icon: tabler:currency-dollar
    - title: Berapa lama penghantaran mengambil masa?
      description: Pesanan dihantar dari kilang kami dan biasanya tiba dalam masa 5-10 hari bekerja bergantung pada kawasan anda. Penjejakan disediakan untuk setiap pesanan.
      icon: tabler:truck-delivery
    - title: Adakah papan saya dilindungi oleh jaminan?
      description: Ya — setiap papan dilindungi daripada kecacatan pembuatan, dan setiap unit diuji tekanan pada 1.25x tekanan berdaftarnya selama 24-48 jam sebelum keluar dari kilang. Kadar tuntutan jaminan kami adalah kurang daripada 2%.
      icon: tabler:shield-check
cta:
  title: Perlu bantuan untuk mencari papan yang sesuai?
  subtitle: Hubungi pasukan kami untuk nasihat jujur tentang pemilihan papan, saiz, atau soalan pesanan.
  actions:
    - variant: primary
      text: Hubungi pasukan kami
      href: /contact
