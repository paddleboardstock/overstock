hero_text:
  tagline: Sumber
  title: Pusat Muat Turun & Panduan Pembeli
  subtitle: Akses katalog produk, OEM panduan, senarai semak pembeli, dan dokumentasi teknikal untuk membantu anda membuat keputusan perolehan yang berinformasi.
features3_downloads:
  tagline: Muat Turun
  title: Dokumentasi Produk<br />& Sumber Pembeli
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog Produk Marin 2026
      description: Rangkaian produk lengkap termasuk RIB bot, bot kembung, SUP papan, kayak, dan aksesori. Spesifikasi, konfigurasi, dan pilihan. Format PDF.
      icon: tabler:file-text
    - title: OEM Panduan Pembuatan
      description: 'Segala yang anda perlu tahu tentang OEM/ODM perkongsian: gambaran keseluruhan proses, kuantiti pesanan minimum, pilihan penyesuaian, kawalan kualiti, dan penghantaran.'
      icon: tabler:building-factory
    - title: RIB Panduan Pembeli Bot
      description: 'Cara memilih yang betul: RIBbahan badan kapal, bahan tiub, pemilihan enjin, pertimbangan saiz, dan pilihan konfigurasi untuk pelbagai aplikasi.'
      icon: tabler:file-description
    - title: SUP Senarai Semak Pembekal
      description: 'Pertimbangan utama semasa memilih SUP pengeluar papan: penunjuk kualiti, keperluan pensijilan, MOQ pertimbangan, dan apa yang perlu diperhatikan dalam audit kilang.'
      icon: tabler:clipboard-check
    - title: Panduan Bahan Bot Tiup
      description: 'PVC vsHypalon: perbandingan ketahanan, UV rintangan, jangka hayat, pilihan pembaikan, dan pertimbangan kos untuk pelbagai aplikasi marin.'
      icon: tabler:files
    - title: Templat Ringkasan Pembuatan Tersuai
      description: Muat turun templat ringkasan produk kami. Isikan keperluan anda dan pulangkan kepada kami untuk sebut harga dan penilaian kebolehlaksanaan pada minggu yang sama.
      icon: tabler:template
faqs:
  title: Soalan Lazim
  subtitle: Soalan biasa mengenai produk kami, proses pembuatan, dan model perkongsian.
  columns: 2
  items:
    - title: Apakah kuantiti pesanan minimum?
      description: MOQ berbeza mengikut kategori produk.RIB bot biasanya bermula dari 10 unit setiap model.SUP papan dari 50 unit. Hubungi pasukan jualan kami untuk maklumat khusus produk MOQ .
      icon: tabler:help-circle
    - title: Bolehkah saya mendapatkan sampel sebelum membuat pesanan?
      description: Ya.Aquafarer menyediakan pengeluaran sampel untuk penilaian sebelum pengeluaran besar-besaran. Kos sampel boleh dirunding dan sering dikreditkan untuk pesanan pengeluaran pertama.
      icon: tabler:package
    - title: Apakah terma pembayaran yang tersedia?
      description: Terma standard ialah 30% deposit dengan pesanan, 70% sebelum penghantaran. Terma LC tersedia untuk pelanggan yang layak. Hubungi pasukan kewangan kami untuk membincangkan pengaturan.
      icon: tabler:currency-dollar
    - title: Berapa lama masa penghasilan diambil?
      description: 'Masa penyediaan tipikal: RIB bot 30-45 hari, SUP papan 20-30 hari, bot kembung 25-35 hari. Pembangunan khas menambah 15-30 hari untuk prototaip.'
      icon: tabler:calendar-clock
    - title: Apakah sijil yang dimiliki oleh produk anda?
      description: CE pensijilan untuk pasaran EU, pembuatan, ISO sistem kualiti, BSCI pematuhan, dan REACH pematuhan bahan yang diluluskan Pengawal Pantai AS.
      icon: tabler:certificate
    - title: Adakah anda menawarkan pembungkusan dan penjenamaan khas?
      description: Ya. Kami menyediakan pembungkusan khas dengan logo, warna, dan identiti jenama anda. MOQ untuk pembungkusan khas bergantung pada kategori produk.
      icon: tabler:color-swatch
cta:
  title: Perlu bantuan untuk mencari sumber yang tepat?
  subtitle: Hubungi pasukan kami untuk panduan yang diperibadikan mengenai pemilihan produk, OEM perkongsian, atau spesifikasi teknikal.
  actions:
    - variant: primary
      text: Hubungi pasukan kami
      href: /contact
