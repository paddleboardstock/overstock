hero:
  tagline: Panduan
  title: Baru di SUP?
  subtitle: Panduan praktikal untuk membantu anda memilih, menggunakan, dan menikmati peralatan sukan air tiup.
size_guide:
  tagline: Saiz & Spesifikasi
  title: Cari Saiz Yang Sesuai Untuk Keperluan Anda
  desc: Bandingkan dimensi produk, kapasiti berat, dan kegunaan yang disyorkan. Sama ada anda memerlukan SUP untuk pelancongan, kayak kompak, atau RIB komersial — panduan saiz kami membantu anda memilih saiz yang tepat.
  link_label: Panduan saiz penuh dengan spesifikasi produk →
  link: /size-guide
  cards:
    - title: Papan SUP
      desc: Pilih panjang berdasarkan berat dan kegunaan yang dimaksudkan. Papan yang lebih lebar (32"+) menawarkan lebih kestabilan. Papan yang lebih panjang (11–12 kaki) lebih baik untuk pelancongan.
    - title: Kayak
      desc: Kayak tunggal (9 kaki) untuk perjalanan solo dan sungai. Kayak tandem (12 kaki) untuk dua pengayuh atau satu dengan peralatan. Sentiasa periksa kapasiti berat.
    - title: Perahu kecil & RIBs
      desc: Pilih panjang berdasarkan bilangan penumpang dan kegunaan. RIBs yang lebih besar (4.5 m+) untuk luar pantai dan menyelamat. Perahu kecil yang lebih kecil (2.7 m) sebagai tender dan platform memancing.
