hero:
  tagline: Panduan
  title: Baru di SUP?
  subtitle: Panduan praktikal untuk membantu anda memilih, menggunakan, dan menikmati peralatan sukan air tiup.
size_guide:
  tagline: Saiz & Spesifikasi
  title: Cari Saiz Yang Sesuai Untuk Keperluan Anda
  desc: Bandingkan dimensi papan, kapasiti berat, dan kegunaan yang disyorkan. Sama ada anda mahukan papan serba boleh yang stabil atau bentuk melancong yang lebih pantas — panduan saiz kami membantu anda memilih yang sesuai.
  link_label: Panduan saiz penuh dengan spesifikasi produk →
  link: /size-guide
  cards:
    - title: Papan SUP Serbaguna
      desc: Papan kami yang panjangnya ~11 kaki (32" lebar) mengimbangi kestabilan, kelajuan, dan kapasiti. Teras 6 inci drop-stitch pada 15 PSI memastikan dek kekal kaku untuk pendayung pada setiap tahap.
    - title: Lebar & Kestabilan
      desc: Papan yang lebih lebar (32"+) menawarkan lebih kestabilan untuk pemula, yoga, dan memancing. Ketebalan 6 inci menambah kekakuan dan kapasiti berat untuk penunggang dan peralatan.
    - title: Pakej & Aksesori
      desc: Setiap papan dihantar sebagai pakej lengkap — papan, beg galas untuk perjalanan, pam tangan, dayung boleh laras, sirip boleh tanggal, tali gegelung, dan set alat pembaikan. Semak muatan maksimum bagi penunggang serta peralatan.
