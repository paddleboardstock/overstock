content_segments:
  tagline: Profil Sekolah
  title: Penyelesaian Pendidikan Sukan Air<br />Mengikut Jenis Program
  subtitle: Sekolah paddle, akademi surf, program universiti, dan pengendali francais masing-masing menghadapi cabaran operasi yang berbeza — daripada integrasi kurikulum hingga penyeragaman armada berbilang lokasi. Kami menyesuaikan pakej peralatan untuk sepadan dengan model pendidikan.
  items:
    - title: Sekolah SUP & Kayak Bebas
      subtitle: Pusat latihan yang dikendalikan pemilik
      description: Sekolah kecil hingga sederhana yang dikendalikan oleh pengajar-pemilik menawarkan pelajaran SUP, latihan kayak, dan kursus sijil. Peralatan mesti cukup tahan untuk penggunaan instruksional harian, mampu milik untuk bajet perniagaan kecil, dan serba boleh untuk pelajar pemula hingga pertengahan dalam satu armada.
      features:
        - Papan SUP yang stabil untuk semua peringkat dan kayak rekreasi untuk pelajaran pemula
        - Papan khusus pengajar dengan kestabilan tambahan untuk pengajaran di atas air
        - Templat pelan pelajaran dan panduan kemajuan kemahiran disertakan
        - Program penyegaran peralatan tahunan dengan diskaun tukar beli
    - title: Program Rekreasi Universiti & Kolej
      subtitle: Kapal rekreasi pelajar skala besar
      description: Jabatan rekreasi universiti mengendalikan kelab paddle, program penyewaan, dan kursus pengajaran sebagai sebahagian daripada tawaran rekreasi kampus. Peralatan mengalami penggunaan maksimum sepanjang semester, memerlukan sistem daftar masuk/keluar yang mudah, dan mesti tahan untuk pelbagai tahap kemahiran dari pelajar kali pertama hingga pengayuh tahap lanjutan.
      features:
        - Pembinaan PVC berketahanan tinggi yang dinilai untuk kitaran penggunaan institusi
        - Flot warna kod mengikut tahap kemahiran untuk pengurusan mudah
        - Keserasian sistem pengesanan inventori berasaskan RFID atau pelekat
        - Harga pukal dengan tempahan dan syarat pembayaran berdasarkan semester
    - title: Sekolah Surf & Akademi Surf
      subtitle: Program pengajaran selancar persisiran
      description: Sekolah surf mengajar kemahiran SUP selancar, paddle prone, dan kayak surf di persekitaran laut. Peralatan mesti mampu menghadapi keadaan zon ombak — rintangan hentaman, ketahanan pasir dan air masin, serta mudah dibilas dan dikembalikan antara pelajaran setiap jam.
      features:
        - Bentuk khusus surf dengan rel diperkuat dan pembinaan rintangan hentaman
        - Pilihan sirip lembut dan tali coiled untuk keselamatan pelajar
        - Kain cepat kering yang kering antara rotasi pelajaran
        - Program penggantian armada dengan pemeriksaan dan penyegaran pada akhir musim
    - title: Francais & Rangkaian Pelbagai Lokasi
      subtitle: Peralatan standard merentasi lokasi
      description: Pengendali berbilang lokasi menjalankan program latihan standard merentasi beberapa bandar atau wilayah. Konsistensi armada merentasi lokasi adalah penting — setiap pelajar harus mempunyai pengalaman peralatan yang sama tanpa mengira lokasi francais yang dikunjungi. Tempahan berpusat, keseragaman jenama, dan sokongan penskalaan adalah penting.
      features:
        - Spesifikasi armada yang sama di semua lokasi francais
        - Tempahan berpusat yang disatukan dengan harga volum
        - 'Pilihan pemerkongsian jenama: jenama francais + Paddle Board Overstock perkongsian jenama'
        - 'Kit penyediaan lokasi baru: peralatan, papan tanda, dan inventori pembukaan'
