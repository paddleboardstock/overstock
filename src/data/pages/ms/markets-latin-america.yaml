hero:
  tagline: Amerika Latin
  title: Papan Borong SUP untuk<br />Peruncit Amerika Latin
  subtitle: Papan dayung overstock baharu untuk kedai pantai, armada sewa, dan penjual dalam talian di seluruh Amerika Latin — daripada 5 papan, model campuran, ekspres atau kargo laut.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan lebihan SUP stok untuk peruncit papan dayung Amerika Latin
direct_answer: Paddle Board Overstock membekalkan papan inflatable overstock baharu SUP kepada peruncit kecil di seluruh Amerika Latin — dari Mexico dan Brazil ke Colombia, Peru, Chile, dan Argentina. Pesanan borong bermula dengan 5 papan dengan model campuran dialu-alukan, dan setiap pesanan dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut tergabung. Papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran dalam satu pesanan, dihargai mengikut jumlah keseluruhan
  - Kargo udara ekspres atau laut konsolidasi dari Weihai, China
  - Pasaran berbahasa Sepanyol dan Portugis yang dilayani di seluruh rantau ini
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: Pasaran Amerika Latin SUP
  paragraphs:
    - Amerika Latin adalah salah satu pasaran dayung berdiri yang paling pesat berkembang di dunia. Pantai yang panjang di dua lautan, ekonomi pelancongan pantai yang kukuh, dan budaya sukan papan yang kukuh memberikan peruncit bebas dari Tulum ke Florianópolis pangkalan pelanggan yang semakin berkembang — pelancong yang mengambil kelas pertama mereka, pendayung hujung minggu, dan SUP komuniti perlumbaan serta luncur tempatan yang semakin meningkat.
    - The retail landscape is dominated by small and mid-sized independent shops: Sekolah dayung tepi pantai yang menjual apa yang mereka sewa, kedai luncur yang menambah SUP barisan, dan penjual dalam talian yang mengimport terus buat kali pertama. Perniagaan ini jarang memerlukan kontena penuh satu model — mereka memerlukan 5–20 papan setiap pesanan, campuran antara model serba boleh mesra pemula dan beberapa edisi premium.
  customer_types:
    - title: Peruncit Beach Town
      description: Kedai di bandar peranginan yang melayani pelancong — mereka memerlukan papan pemula yang tahan lasak dalam jumlah dan beberapa model premium untuk dipamerkan dan dijual.
    - title: Sekolah Paddle & Armada Sewa
      description: Sekolah memadankan kelas dengan runcit, dan armada sewa menyegarkan papan setiap musim dengan pesanan model campuran.
    - title: Penjual Dalam Talian
      description: Penjual e-dagang berbahasa Sepanyol dan Portugis memperkenalkan SUP kategori ini ke pasaran nasional mereka tanpa risiko skala kontena.
shipping_section:
  title: Kapal ke Amerika Latin
  paragraphs:
    - Pesanan dihantar dari pangkalan logistik kami di Weihai, China. Sampel sut kargo udara ekspres, 1–3 pesanan papan, dan stok semula segera; kargo laut konsolidasi adalah laluan ekonomi untuk pesanan borong 5–20 papan ke pelabuhan utama di seluruh rantau.
    - Kami menyediakan dokumen eksport yang lengkap dan tepat — invois komersial dan senarai pembungkusan — untuk memastikan pelepasan kastam lancar. Duti import dan cukai ditetapkan oleh negara anda dan perlu dibayar oleh pengimport; kami tidak pernah menggabungkan janji "termasuk cukai" yang samar ke dalam sebut harga penghantaran.
  customs_note: Peraturan import dan kadar duti berbeza dengan ketara di negara-negara Amerika Latin. Semak rejim import semasa negara anda untuk peralatan sukan air boleh tiup sebelum membuat pesanan, dan minta kami untuk sebarang dokumen tambahan yang diperlukan oleh broker anda.
faq_section:
  title: Soalan Lazim Amerika Latin
  items:
    - q: Bolehkah saya mendapatkan sebut harga dalam bahasa Sepanyol atau Portugis?
      a: Pasukan kami bekerjasama dengan pembeli di seluruh Amerika Latin dan boleh mengendalikan sebut harga serta pengesahan pesanan untuk pelanggan berbahasa Sepanyol dan Portugis. Tanya dalam pertanyaan anda.
    - q: Adakah anda menghantar ke negara saya di Amerika Latin?
      a: Kami menghantar ke seluruh rantau — Mexico, Brazil, Colombia, Peru, Chile, Argentina, Ecuador, dan lain-lain. Sahkan destinasi tepat anda dalam permintaan sebut harga anda dan kami akan mengesahkan perkhidmatan kargo semasa.
    - q: Apakah minimum borong untuk peruncit Amerika Latin?
      a: Jumlah lima papan, mencampur mana-mana model yang ada dalam stok. Jumlah itu menetapkan tahap harga anda — anda boleh menggabungkan edisi serba boleh, pelancongan, dan seni dalam satu penghantaran.
    - q: Siapa yang membayar duti import di negara saya?
      a: Anda, sebagai pengimport, mengikut peraturan negara anda. Kami menyediakan dokumen yang betul dan lengkap (invois komersial, senarai pembungkusan) supaya pelepasan kastam dapat dijangka — lihat halaman penghantaran antarabangsa kami untuk gambaran penuh.
cta:
  title: Sedia untuk Menyediakan Papan untuk Pasaran Anda?
  subtitle: Beritahu kami negara anda, campuran sasaran, dan saiz pesanan — kami akan membalas dengan harga borong dan kedua-dua pilihan pengangkutan.
