hero:
  tagline: Graf Pengetahuan
  title: Pengetahuan Eksplorasi Air
  subtitle: |
    Pangkalan pengetahuan berstruktur yang merangkumi teknologi boleh kembangkan SUP,<br />
    keselamatan air, kejuruteraan papan, dan perancangan pengembaraan.
  taglineSection: Terokai. Belajar. Majulah dengan keyakinan.
clusters:
  tagline: Kumpulan Pengetahuan
  title: Terokai mengikut topik
  subtitle: Menyelami secara mendalam teknologi, keselamatan, dan kemahiran di sebalik setiap produk Paddle Board Overstock.
  items:
    - title: SUP Pengetahuan
      description: Daripada memilih papan pertama anda hingga teknik jelajah lanjutan — segala-galanya mengenai papan dayung berdiri.
      icon: tabler:lifebuoy
      topics:
        - Bagaimana memilih SUP tiup pertama anda
        - Saiz SUP terbaik untuk pemula
        - Sejauh manakah sukar berselancar dengan papan dayung?
        - Perbandingan papan tiup vs papan keras
        - senarai semak keselamatan SUP
    - title: Teknologi Lembaga
      description: Pendalaman teknikal mengenai teras drop-stitch, laminat PVC, rel, dan injap — bagaimana SUPs yang boleh inflasi direka.
      icon: tabler:anchor
      topics:
        - Bagaimana SUPs tiup dibuat
        - PVC lapisan laminasi diterangkan
        - Pembinaan rel dan jahitan
        - penerokaan mendalam teknologi Drop-stitch
        - EVA seni dek dijelaskan
    - title: Pengetahuan Keselamatan
      description: Pengetahuan keselamatan penting untuk setiap pendayung — daripada pemilihan PFD hingga pembacaan cuaca dan teknik menyelamat diri.
      icon: tabler:shield
      topics:
        - senarai semak keselamatan SUP
        - Adakah anda memerlukan jaket keselamatan?
        - Panduan keselamatan mendayung di laut
        - Keselamatan sungai dan arus untuk pengayuh
        - Kesedaran tentang cuaca dan keadaan air
    - title: Teknologi
      description: Kejuruteraan di sebalik produk Paddle Board Overstock — bahan, kaedah pembinaan, dan ujian kualiti.
      icon: tabler:microscope
      topics:
        - Teknologi gred marin PVC
        - Drop-stitch teras dijelaskan
        - Mengapa PSI penting untuk kembung SUPs
        - Kimpalan RF vs pelekat
        - Ujian kualiti pada setiap papan
    - title: Pengetahuan Kelab & Sewaan
      description: Panduan praktikal untuk menjalankan program SUP — dari operasi sewaan hingga armada resort dan kelab.
      icon: tabler:briefcase
      topics:
        - Cara memulakan SUP perniagaan sewaan
        - Membina pusat sukan air resort
        - Saiz armada papan dayung untuk kelab
        - Boleh tiup vs sukar SUP untuk kegunaan komersial
        - Papan SUP terbaik untuk armada sewaan
        - Strategi pendapatan sukan air resort
        - Panduan penyelenggaraan peralatan komersial
