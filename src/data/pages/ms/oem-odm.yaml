process_steps:
  title: Proses 6-Langkah OEM/ODM
  subtitle: Daripada ringkasan reka bentuk hingga FOB Qingdao — aliran kerja yang dipercepatkan
  steps:
    - number: '01'
      title: Ringkasan Reka Bentuk & Pemodelan CAD 3D
      description: Kongsi spesifikasi sasaran, produk rujukan, atau konsep anda. Pasukan kejuruteraan kami membangunkan lukisan CAD terperinci dan rendering 3D untuk kelulusan anda.
      timeline: 3–5 hari
    - number: '02'
      title: Pemilihan Bahan & Ujian Kain
      description: Pilih daripada PVC gred ketenteraan (0.9–1.2 mm), Hypalon CSM, atau drop-stitch kain inti. Kami menjalankan ujian kekuatan tali, lekatan salutan, dan ujian kestabilan UV.
      timeline: 2–3 hari
    - number: '03'
      title: Prototip Pantas & Pengeluaran Sampel
      description: Kami CNC-membuat acuan khas dan menghasilkan sampel prapengeluaran dengan warna jenama, logo, dan bahan yang ditentukan. Sampel dihantar untuk kelulusan anda.
      timeline: 7–14 hari
    - number: '04'
      title: Ujian Tahanan Tekanan Tinggi 24–48 Jam
      description: Setiap prototaip menjalani ujian ketahanan tekanan yang ketat pada 1.25x tekanan berkadar. Ujian pelepasan jahitan dan pengesahan dimensi dilaksanakan.
      timeline: 1–2 hari
    - number: '05'
      title: CE/ISO Pemeriksaan Kualiti & Pembungkusan
      description: Senarai semak kualiti 100 mata. Setiap unit diperiksa sebelum pembungkusan sedia untuk jualan. CE perisytiharan pematuhan dan BSCI laporan pematuhan disertakan.
      timeline: 2–3 hari
    - number: '06'
      title: FOB Penghantaran & Logistik Qingdao
      description: Barangan siap dipalet, dibalut penyusutan, dan dimuatkan ke dalam kontena di pelabuhan Qingdao. Dokumentasi eksport penuh, pelepasan kastam, dan penjejakan masa nyata.
      timeline: 7–14 hari
