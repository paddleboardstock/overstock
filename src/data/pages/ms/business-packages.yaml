faq:
  title: Soalan Lazim Pakej
  questions:
    - q: Apakah kuantiti pesanan minimum untuk pakej?
      a: Pakej Pemula Kelab mempunyai minimum 10 unit. Pakej Resort dan Jenama disesuaikan mengikut keperluan anda dengan MOQs yang fleksibel.
    - q: Berapa lama penghantaran mengambil masa?
      a: Pengeluaran standard adalah 30–45 hari dari pengesahan pesanan. Pengeluaran segera tersedia dengan bayaran tambahan.
    - q: Bolehkah saya menyesuaikan warna peralatan dan penjenamaan?
      a: Ya. Semua pakej termasuk penyesuaian sepenuhnya — warna papan, cetakan logo, dan reka bentuk pembungkusan.
    - q: Adakah anda menyediakan sokongan selepas jualan?
      a: Ya. Setiap pakej termasuk akses kepada panduan penyelenggaraan dalam talian, tutorial video, dan sistem tempahan alat ganti.
