hero:
  tagline: Kehadiran Global
  title: Melayani 50+ Negara<br />Di Setiap Benua
  subtitle: Daripada pengendali rondaan pantai Eropah kepada pengedar sukan air Australia hingga pasukan penyelamat di Timur Tengah — Aquafarer bot berada di perairan di seluruh dunia.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer pengeluaran dan pengedaran marin global
stats:
  title: Jangkauan Global
  stats:
    - title: Negara
      amount: 50+
    - title: Pasaran Eksport
      amount: Eropah, Amerika, Asia, Timur Tengah, Oceania
    - title: Pengeluaran
      amount: Qingdao, China
    - title: Gudang AS
      amount: Montclair, CA
features3_markets:
  tagline: Pasaran Utama
  title: Kepakaran Serantau<br />untuk Keperluan Tempatan
  subtitle: Kami memahami bahawa pasaran yang berbeza mempunyai keperluan peraturan, keutamaan, dan penggunaan yang berbeza.
  isBeforeContent: false
  columns: 4
  items:
    - title: Eropah & UK
      description: Produk bersertifikat CE memenuhi standard EN ISO 6185. Permintaan tinggi untuk RIBs, bot tiup, dan papan SUP di pasaran EU. Pengedar UK menghargai pengiriman pantas kami.
      icon: tabler:map-pin
    - title: Amerika Utara
      description: Pengeluaran yang diluluskan Pengawal Pantai AS. Gudang AS di Montclair, CA untuk penghantaran pantai Barat yang pantas. Permintaan yang meningkat untuk bot memancing, bot penyelamat, dan SUPs rekreasi.
      icon: tabler:map-pin
    - title: Australia & Oseania
      description: Pasaran kuat untuk bot RIB dan tali ulang-alik tiup. Pengedar Australia menghargai bot Hypalon kami untuk rintangan UV dalam keadaan matahari yang terik. Penghantaran cepat dari kemudahan Asia kami.
      icon: tabler:map-pin
    - title: Timur Tengah
      description: Permintaan yang meningkat untuk bot rondaan dan penyelamat. RIBs hull aluminium kami popular dengan pengendali pengawal pantai dan keselamatan. Konfigurasi khas untuk persekitaran bersuhu tinggi.
      icon: tabler:map-pin
features3_distribution:
  tagline: Rangkaian Pengedaran
  title: Bekerjasama dengan Pengedar<br />Seluruh Dunia
  subtitle: Kami bekerjasama dengan pengedar peralatan marin yang mantap, jenama OEM, dan agensi perolehan kerajaan.
  isBeforeContent: false
  columns: 3
  items:
    - title: Perkongsian OEM/ODM
      description: Pembuatan label peribadi untuk jenama sukan air global. Kami menguruskan semuanya dari reka bentuk hingga pengeluaran hingga penghantaran terus.
      icon: tabler:building
    - title: Rangkaian Pengedar
      description: Pengedar sah di 20+ negara menyimpan stok dan menyediakan sokongan tempatan. Pertanyaan pengedar baharu dialu-alukan.
      icon: tabler:users
    - title: Kerajaan & Institusi
      description: Bekalan langsung kepada pengawal pantai, organisasi mencari dan menyelamat, serta program perolehan ketenteraan. Pematuhan kepada keperluan perolehan institusi.
      icon: tabler:building-community
steps2_logistics:
  title: Logistik & Sokongan Global
  subtitle: Dari kilang ke destinasi — kami menguruskan seluruh rantaian bekalan.
  items:
    - title: Pilihan Penghantaran
      description: Pengangkutan laut (FOB Qingdao), pengangkutan udara untuk pesanan segera, dan kurier ekspres untuk sampel dan alat ganti.
      icon: tabler:truck-delivery
    - title: Gudang AS
      description: 'Stok disimpan di Montclair, CA untuk penghantaran cepat di seluruh Amerika Utara. Pantai Barat: 2-3 hari, Pusat: 3-4 hari, Pantai Timur: 4-5 hari.'
      icon: tabler:building-warehouse
    - title: Alat Ganti
      description: Alat ganti dan bahan habis pakai Aquafarer tulen disimpan sepanjang tahun. Alat ganti biasa dihantar dalam masa 24 jam.
      icon: tabler:package
    - title: Sokongan Teknikal
      description: Talian terus ke pasukan kejuruteraan kami untuk soalan teknikal, nasihat pembaikan, dan sokongan pengubahsuaian. Kami menyokong bot yang kami bina 20 tahun yang lalu.
      icon: tabler:headset
cta:
  title: Ingin menjadi pengedar?
  subtitle: Kami sedang giat mengembangkan rangkaian pengedaran kami. Hubungi pasukan eksport kami untuk membincangkan peluang kerjasama.
  actions:
    - variant: primary
      text: Pertanyaan perkongsian
      href: /contact
    - text: Lihat rangkaian produk kami
      href: /products
