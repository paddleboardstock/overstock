hero:
  tagline: Borong Model Campuran
  title: Model Campuran Borong Papan Dayung —<br />Campurkan SUP Model Berbeza dalam Satu Susunan
  subtitle: Mengapa mengikat bajet anda kepada satu model? Gabungkan mana-mana papan yang ada dalam stok SUP — edisi serba boleh, jelajah, luncur, dan seni — dalam satu pesanan borong, dengan jumlah serendah 5 papan.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Pesanan campuran SUP model papan tiup yang berbeza dari Paddle Board Overstock
direct_answer: Borong model campuran membolehkan peruncit kecil memesan beberapa SUP model berbeza dalam satu penghantaran konsolidasi dan bukannya kuantiti pukal satu papan. Pada Paddle Board Overstock, mana-mana model stok boleh digabungkan, minimum pesanan adalah 5 papan keseluruhan, dan jumlah keseluruhan menentukan tahap harga. Pesanan campuran dihantar dari Weihai, China dengan kargo udara ekspres (1–3 papan) atau kargo laut terkonsolidasi (5–20 papan) ke 50+ negara, dan setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Campurkan SUP mana-mana model dalam stok dalam satu pesanan — tiada minimum per model
  - Kuantiti pesanan keseluruhan (bukan kuantiti per model) menetapkan tahap harga anda
  - Mulakan dengan 5 papan keseluruhan — direka untuk peruncit kecil, bukan muatan kontena
  - 'Satu penghantaran tergabung: satu kos penghantaran, satu pelepasan kastam, satu penghantaran'
why_mixed:
  tagline: Kenapa bercampur?
  title: Campur & Padankan. Beli Lebih Banyak Kepelbagaian. Berbelanja Kurang.
  subtitle: Satu rak papan yang sama digunakan untuk satu jenis dayung. Pesanan campuran menukar bajet yang sama menjadi satu rangkaian produk penuh.
  items:
    - title: Lebih Banyak Variasi di Rak Anda
      description: Gabungkan papan serba boleh untuk pemula, papan touring untuk pengembara, dan papan gaya luncur untuk penunggang — satu pesanan memenuhi seluruh rangkaian pelanggan anda.
    - title: Risiko lebih rendah mengikut Model
      description: Daripada bertaruh musim anda pada satu model, pesan 2–4 model setiap satu. Jika satu model lebih laris daripada yang lain, isi semula pesanan seterusnya dengan data jualan sebenar.
    - title: Uji Apa yang Laris di Pasaran Anda
      description: Setiap pantai, tasik, dan bandar mempunyai permintaan yang berbeza. Pesanan pertama campuran adalah kajian pasaran paling murah — stok enam model, lihat mana yang bergerak.
    - title: Margin Lebih Baik untuk Edisi Seni
      description: Papan siri seni premium (Leviathan Wake, Medusa Glow, Ocean Voyager) menawarkan harga runcit yang lebih tinggi. Campurkan beberapa ke dalam asas papan serba boleh untuk meningkatkan margin purata anda.
    - title: Satu Penghantaran Konsolidasi
      description: Satu pesanan campuran bermakna satu tempahan penghantaran, satu pelepasan kastam, dan satu penghantaran — bukannya lima penghantaran berasingan dari lima pembekal berasingan.
how_it_works:
  tagline: Bagaimana Ia Berfungsi
  title: Bagaimana Pesanan Model Campuran Berfungsi
  steps:
    - title: Pilih campuran anda
      description: Pilih model dan kuantiti untuk pasaran anda — atau gunakan pemilih di bawah untuk merangka gabungan dan melihat kemas kini kiraan papan dan nilai keseluruhan secara langsung.
    - title: Minta Sebut Harga
      description: Hantarkan campuran kepada kami. Kami mengesahkan stok semasa untuk setiap model dan harga unit harga serta pilihan penghantaran ekspres dan laut ke negara anda.
    - title: Sahkan Pesanan
      description: Luluskan sebut harga terakhir — model, kuantiti, penghantaran, jumlah. Kami akan mengunci stok dan menjadualkan penghantaran dari Weihai.
    - title: Kami Menguji Setiap Papan
      description: Setiap papan dalam pesanan campuran anda 100% diuji tekanan sehingga 15 PSI sebelum dibungkus — standard yang sama untuk setiap model, sama ada ia model serba boleh pemula atau edisi seni.
    - title: Satu Penghantaran ke Pintu Anda
      description: Keseluruhan pesanan campuran dihantar bersama — udara ekspres untuk pesanan kecil, penghantaran laut terkonsolidasi untuk 5–20 papan — dengan penjejakan dari pintu ke pintu.
