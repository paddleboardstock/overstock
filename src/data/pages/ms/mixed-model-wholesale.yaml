who_benefits:
  tagline: Siapa Yang Boleh Mendapat Manfaat
  title: Siapa Yang Sesuai Dengan Jualan Borong Model Campuran
  items:
    - title: Pengimport Kali Pertama
      description: Menguji kategori SUP dengan pelbagai model daripada komitmen kepada satu SKU pukal.
    - title: Peruncit Pantai Musiman
      description: Kedai yang memerlukan papan permulaan untuk pelancong dan edisi premium untuk penduduk tempatan — dalam pesanan pembelian semula yang sama.
    - title: Penjual Dalam Talian
      description: Menyenaraikan beberapa model sekaligus untuk mengetahui karya seni, panjang, dan kes penggunaan yang paling laris.
    - title: Armada Sewa & Sekolah
      description: Flotila yang memerlukan saiz papan yang berbeza untuk berat penunggang dan jenis pelajaran yang berbeza, bukan flotila spesifikasi tunggal.
faq_section:
  title: Soalan Lazim Model Campuran
  items:
    - q: Adakah terdapat kuantiti minimum bagi setiap model?
      a: Tidak. Minimum 5 papan adalah untuk jumlah pesanan, bukan bagi setiap model. Anda boleh memesan 5 model berbeza, satu papan setiap satu.
    - q: Adakah mencampur model menukar harga?
      a: Harga borong setiap unit dikutip mengikut model, tetapi tahap harga anda bertambah baik dengan jumlah papan keseluruhan — mencampur model tidak mengenakan penalti.
    - q: Bolehkah saya mencampur papan dan aksesori?
      a: Ya — pendayung gantian, pam, dan kit pembaikan boleh ditambahkan dalam pesanan campuran. Tanyakan dalam pertanyaan anda.
    - q: Bagaimana saya tahu model mana yang sesuai dengan pasaran saya?
      a: Hantar nota mengenai pelanggan anda (pesisir atau pedalaman, pelancong atau penduduk tempatan, pemula atau penunggang) dalam borang pertanyaan dan kami akan mencadangkan campuran.
