features3_certifications:
  title: Kualiti & Pengujian
  subtitle: Every board is tested in our own lab before it ships — real numbers, real records, no marketing claims.
  columns: 3
  isBeforeContent: true
  items:
    - title: Built In Our Own Factory
      description: We own and operate a 12,000 m² Weihai facility. Every production batch is traceable, documented, and inspected — no outsourced mystery manufacturing.
      icon: tabler:building-factory
    - title: Makmal Ujian Bahan
      description: Makmal bahan dalaman menguji kekuatan tegangan, UV ketahanan, integriti jahitan, dan lelahan untuk setiap kumpulan fabrik sebelum pengeluaran.
      icon: tabler:microscope
    - title: Marine-Grade Materials
      description: UV-stabilized PVC, drop-stitch cores, and EVA deck foam — chosen and tested for seasons of sun, salt, and abuse.
      icon: tabler:flask
    - title: Jaminan SUP 2 Tahun
      description: Paddle Board Overstock Papan SUP dilindungi oleh waranti 2 tahun terhadap kecacatan pengilangan, termasuk jahitan, injap, dan delaminasi bahan. Kami berdiri di belakang apa yang kami bina.
      icon: tabler:shield-check
