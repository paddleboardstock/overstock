features3_lab:
  title: Makmal Ujian & Kualiti Dalaman
  subtitle: Setiap lote bahan dan produk siap melalui makmal ujian di lokasi sebelum dihantar.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ujian Kekuatan Tegangan
      description: 'Every PVC fabric roll is tested for tensile strength in-house. Minimum requirement: 350 N/cm warp and weft. Rejected batches are returned to supplier — we reject approximately 3% of incoming materials.'
      icon: tabler:scale
    - title: UV Penuaan Dipercepat
      description: Fabric samples undergo 1,000-hour accelerated UV weathering. Tensile strength must retain 80%+ after exposure. Products rated for 3+ years of outdoor use.
      icon: tabler:sun
    - title: Kekuatan Lepasan Jahitan
      description: Welded seams are tested to a 5 N/mm minimum peel strength. Each production batch has seam samples destructively tested and archived.
      icon: tabler:stack
    - title: Pegangan Tekanan 24–48 Jam
      description: 'Setiap produk tiup ditiup sehingga 1.25x PSI yang dinilai dan dipantau selama 24–48 jam. Penurunan tekanan maksimum yang dibenarkan: 5%. Produk yang gagal ujian ini dibaiki dan diuji semula sebelum penghantaran.'
      icon: tabler:wind
    - title: Ujian Kitaran Injap
      description: Setiap reka bentuk injap menjalani 10,000 kitaran buka-tutup di makmal kami. Injap mesti mengekalkan penutup kedap udara pada tekanan 1.25x daripada tekanan yang dinilai selepas kitaran. Semua injap Paddle Board Overstock dinilai untuk 5+ tahun penggunaan biasa.
      icon: tabler:rotate
    - title: Ketahanan Retak Dingin
      description: Materials are tested at -30°C for 4 hours. No cracking or embrittlement allowed. Products rated for winter storage and cold-water use down to -10°C ambient temperature.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Bagaimana kami memastikan kualiti
  subtitle: Dari pemeriksaan bahan mentah hingga ujian tekanan akhir — setiap produk melalui rantaian kawalan kualiti yang ketat.
  items:
    - title: Pemeriksaan Bahan Mentah
      description: Setiap gulung kain PVC diuji untuk ketebalan, kekuatan tegangan, dan ketahanan UV sebelum memasuki pengeluaran.
      icon: tabler:search
    - title: QC Semasa Proses
      description: Jahitan kimpalan, pemasangan injap, dan ikatan ruang diperiksa di setiap stesen semasa pemasangan.
      icon: tabler:eye
    - title: ujian tekanan
      description: Setiap produk boleh tiup ditiup sehingga 1.25x penarafan PSI dan disimpan selama 24–48 jam untuk mengesahkan pengekalan udara dan integriti jahitan.
      icon: tabler:wind
    - title: Pemeriksaan Akhir
      description: Setiap unit diperiksa untuk kemasan, perkakasan, dan pembungkusan sebelum diluluskan untuk penghantaran. Sampel kelompok dihantar ke makmal kami untuk ujian merosakkan.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Soalan Lazim Papan
  subtitle: Soalan biasa mengenai papan dayung berdiri kami.
  columns: 2
  items:
    - title: Apakah SUP saiz papan yang tersedia?
      description: Kami menawarkan SUP papan dari 9 kaki hingga 12 kaki, termasuk reka bentuk serbaguna, pelayaran, yoga, dan khusus. Model terlaris kami termasuk Tropical Breeze (10 kaki) dan Ocean Voyager (11 kaki).
    - title: Apakah itu drop-stitch pembinaan?
      description: Drop-stitch pembinaan menggunakan ribuan benang poliester yang menghubungkan lapisan atas dan bawah papan, membolehkan ia menahan tekanan udara tinggi (15–20 PSI) dan mencapai platform yang mantap serta stabil. Ini adalah standard industri untuk SUPs boleh kembung premium.
    - title: Apakah had berat untuk SUP papan?
      description: SUP papan kami menyokong sehingga 150 kg bergantung pada model dan isipadu. Papan Leviathan Wake adalah model kapasiti tertinggi kami, direka untuk penunggang yang lebih besar dan penggunaan yoga.
    - title: Adakah anda menawarkan pakej SUP lengkap?
      description: Ya. Setiap SUP papan dihantar dengan pakej lengkap termasuk dayung aluminium 3 keping, pam tangan tekanan tinggi, tali kecemasan, beg galas untuk perjalanan, dan kit pembaikan. Sesetengah model juga termasuk set sirip boleh tanggal.
    - title: Apakah waranti untuk SUP papan?
      description: Semua papan Paddle Board Overstock SUP disertakan dengan jaminan 2 tahun terhadap kecacatan pengilangan, termasuk kegagalan jahitan, kecacatan injap, dan delaminasi bahan di bawah penggunaan normal.
    - title: Berapa lama untuk mengembang SUP papan?
      description: Menggunakan pam tangan yang disertakan, inflasi penuh hingga 15 PSI mengambil masa kira-kira 8–12 minit. Untuk inflasi yang lebih pantas, kami mencadangkan pam elektrik 12V Paddle Board Overstock kami, yang boleh mengisi sebuah papan dalam masa kurang dari 4 minit.
