features3_certifications:
  title: Pensijilan & Pematuhan
  subtitle: Setiap produk diuji secara bebas; 64 model CE disahkan mengikut piawaian antarabangsa.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Pensijilan
      description: 64 CEmodel yang diperakui merentasi SUPs, kayak, dinghy, dan RIBs memenuhi CE piawaian keselamatan Eropah untuk kenderaan air rekreasi. Setiap produk menjalani ujian tekanan, daya apungan, dan beban sebelum keluar dari kilang.
      icon: tabler:certificate
    - title: ''
      description: Kemudahan kami seluas 12,000 m² di Qingdao beroperasi di bawah ISO sistem pengurusan kualiti 9001. Setiap kelompok pengeluaran boleh dijejaki, didokumentasikan, dan diperiksa.
      icon: tabler:clipboard-check
    - title: BSCI Pematuhan Sosial
      description: Kami BSCIbertauliah, memastikan amalan buruh beretika, keadaan kerja yang selamat, dan tanggungjawab alam sekitar di seluruh rantaian bekalan kami.
      icon: tabler:users
    - title: REACH & RoHS
      description: Semua bahan — PVC, Hypalon, EVA buih, pelekat — mematuhi peraturan EU REACH dan RoHS peraturan. Tiada bahan terhad, tiada kompromi.
      icon: tabler:flask
    - title: Makmal Ujian Bahan
      description: Makmal bahan dalaman menguji kekuatan tegangan, UV ketahanan, integriti jahitan, dan lelahan untuk setiap kumpulan fabrik sebelum pengeluaran.
      icon: tabler:microscope
    - title: Jaminan Bot 5 Tahun
      description: Paddle Board Overstock Bot dilindungi oleh jaminan terhad selama 5 tahun untuk fabrik tiub, jahitan, dan badan kapal.SUP Papan dan aksesori mempunyai jaminan 2 tahun. Kami menyokong apa yang kami bina.
      icon: tabler:shield-check
testimonials:
  tagline: Kepercayaan Pelanggan
  title: Apa yang pelanggan kami katakan
  subtitle: Daripada pendayung kali pertama hingga pengendali armada profesional — lihat mengapa mereka Paddle Board Overstockmempercayai.
  items:
    - content: Kami melengkapi seluruh armada sewaan kami dengan Paddle Board Overstock RIBs — 12 bot di tiga lokasi. Dua musim berlalu, tiada kegagalan. Dokumentasi pensijilan CE memudahkan kelulusan insurans. Pasukan kejuruteraan mereka juga menyesuaikan warna tiub untuk menepati jenama kami.
      name: Marco Valenti
      title: Pengarah Operasi, Adriatic Adventure Tours — Dubrovnik, Croatia
    - content: Sebagai pembeli kali pertama, saya gementar tentang kualiti apabila memesan dari luar negara. Dokumentasi ISO dan laporan ujian pihak ketiga yang mereka kongsi sebelum saya bertanya memberi saya keyakinan sepenuhnya. Papan sampai dalam 6 hari dan melebihi jangkaan saya.
      name: James Thornton
      title: SUP Pemilik Explorer 11 — Vancouver, Kanada
    - content: Kami mengendalikan 24 Paddle Board Overstock RIBs di seluruh armada rondaan pesisir kami. Proses QC mereka konsisten di setiap batch — kualiti jahitan yang sama, penempatan injap yang sama, penarafan tekanan yang sama setiap kali. Kebolehulangan itu penting ketika nyawa bergantung pada peralatan.
      name: Lt. Komander Andres Reyes
      title: Pegawai Perolehan Maritim, Pasukan Pembantu Pengawal Pantai Filipina — Manila, Filipina
features3_lab:
  title: Makmal Ujian & Kualiti Dalaman
  subtitle: Setiap lote bahan dan produk siap melalui makmal ujian di lokasi sebelum dihantar.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ujian Kekuatan Tegangan
      description: 'Setiap gulung kain PVC diuji mengikut standard ASTM D751. Keperluan minimum: 350 N/cm henjang dan jejala. Lote yang gagal dikembalikan kepada pembekal — kami menolak kira-kira 3% bahan yang diterima.'
      icon: tabler:scale
    - title: UV Penuaan Dipercepat
      description: Sampel kain menjalani penuaan dipercepat QUV selama 1,000 jam (ASTM G154). Pengekalan kekuatan tegangan mesti melebihi 80% selepas pendedahan UV. Produk dinilai untuk penggunaan luar selama 3+ tahun.
      icon: tabler:sun
    - title: Kekuatan Lepasan Jahitan
      description: Jahitan RF diuji pada kekuatan lepas minimum 5 N/mm (ASTM D751). Jahitan Hypalon yang digam tangan diuji pada 3.5 N/mm. Setiap lote pengeluaran mempunyai sampel jahitan yang diuji secara memusnahkan dan diarkibkan.
      icon: tabler:stack
    - title: Pegangan Tekanan 24–48 Jam
      description: 'Setiap produk tiup ditiup sehingga 1.25x PSI yang dinilai dan dipantau selama 24–48 jam. Penurunan tekanan maksimum yang dibenarkan: 5%. Produk yang gagal ujian ini dibaiki dan diuji semula sebelum penghantaran.'
      icon: tabler:wind
    - title: Ujian Kitaran Injap
      description: Setiap reka bentuk injap melalui 10,000 kitaran buka-tutup dalam makmal kami. Injap mesti mengekalkan penutup udara pada 1.25x tekanan yang dinilai selepas kitaran. Semua injap Paddle Board Overstock dinilai untuk 5+ tahun penggunaan biasa.
      icon: tabler:rotate
    - title: Ketahanan Retak Dingin
      description: Bahan diuji pada -30°C selama 4 jam mengikut ISO 4646. Tiada retakan atau pengerasan dibenarkan. Produk dinilai untuk penyimpanan musim sejuk dan penggunaan air sejuk sehingga suhu persekitaran -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Bagaimana kami memastikan kualiti
  subtitle: Dari pemeriksaan bahan mentah hingga ujian tekanan akhir — setiap produk melalui rantaian kawalan kualiti yang ketat.
  items:
    - title: Pemeriksaan Bahan Mentah
      description: Setiap gulung kain PVC diuji untuk ketebalan, kekuatan tegangan, dan ketahanan UV sebelum memasuki pengeluaran.
      icon: tabler:search
    - title: QC Semasa Proses
      description: Jahitan kimpalan, pemasangan injap, dan ikatan ruang diperiksa di setiap stesen semasa pemasangan.
      icon: tabler:eye
    - title: ujian tekanan
      description: Setiap produk boleh tiup ditiup sehingga 1.25x penarafan PSI dan disimpan selama 24–48 jam untuk mengesahkan pengekalan udara dan integriti jahitan.
      icon: tabler:wind
    - title: Pemeriksaan Akhir
      description: Setiap unit diperiksa untuk kemasan, perkakasan, dan pembungkusan sebelum diluluskan untuk penghantaran. Sampel kelompok dihantar ke makmal kami untuk ujian merosakkan.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Soalan Lazim Bot
  subtitle: Soalan biasa mengenai bot kembung berbadan keras kami.
  columns: 2
  items:
    - title: Apakah saiz RIB bot yang Paddle Board Overstock ditawarkan?
      description: Kami menawarkan 35 RIB model dari 2.5 m hingga 7.6 m, merangkumi segala-galanya dari tender kompak hingga kapal komersial dan rondaan tugas berat. Setiap model tersedia dengan pelbagai pilihan konfigurasi.
    - title: Apakah perbezaan antara RIB bot tiup dan bot tiup tradisional?
      description: A RIB (Rigid-Hull Inflatable Boat) menggabungkan badan fiberglass pepejal atau aluminium deep-V dengan Hypalon PVC tiub atau tiub. Ini memberikan anda kestabilan dan kapasiti muatan bot keras dengan penyerapan hentakan dan daya apungan seperti bot kembung.
    - title: Enjin apa yang serasi dengan Paddle Board Overstock RIBs?
      description: Kami RIBs menyokong enjin luar dari 3 HP hingga 250 HP bergantung pada model. Setiap halaman produk menyenaraikan kuasa enjin maksimum yang dinilai. Kami mengesyorkan anda berunding dengan pengedar anda untuk padanan yang ideal.
    - title: Adakah Paddle Board Overstock RIBs CE mereka bertauliah?
      description: Ya. Semua model rekreasi RIB CE diperakui di bawah piawaian Eropah yang berkenaan untuk kenderaan air rekreasi. Model komersial dan rondaan memenuhi keperluan kestabilan dan beban tambahan.
    - title: Apakah jaminan untuk RIB bot?
      description: Semua Paddle Board Overstock RIBs didatangkan dengan jaminan terhad 5 tahun untuk fabrik tiub, jahitan, dan badan kapal; injap inflasi dilindungi selama 5 tahun; aksesori dipasang kilang selama 1 tahun.
    - title: Berapa banyak ruang udara Paddle Board Overstock RIBs yang ada?
      description: Kami RIBs mempunyai 3 hingga 7 ruang udara bebas bergantung pada panjang model. Reka bentuk pelbagai ruang ini memastikan bot kekal terapung walaupun satu ruang terjejas.
faqs_inflatable:
  title: Soalan Lazim tentang Bot Tiup
  subtitle: Soalan biasa mengenai bot kecil kembung, kayak, dan bot kami.
  columns: 2
  items:
    - title: Apakah bahan yang digunakan dalam Paddle Board Overstock bot kembung?
      description: Kami menggunakan gred ketenteraan PVC (1100 denier) dan premium Hypalon/CSM getah, bergantung pada model. Kedua-dua bahan ini UVdistabilkan, tahan lelas, dan mematuhi EU REACH serta RoHS peraturan.
    - title: Berapa lama bot tiup bertahan?
      description: Dengan penjagaan yang betul, PVC bot tiup berkualiti boleh bertahan 7–10 tahun, manakala Hypalon model boleh bertahan 15–20 tahun. Pembersihan berkala, UV perlindungan, dan penyimpanan yang betul memanjangkan jangka hayat perkhidmatan dengan ketara.
    - title: Apakah penyelenggaraan yang diperlukan untuk bot tiup?
      description: Penyelenggaraan asas termasuk membilas dengan air segar selepas setiap penggunaan (terutamanya dalam air masin), mengeringkan sebelum penyimpanan, memeriksa meterai injap setiap tahun, dan menyapu UV pelindung pada tiub. Elakkan pendedahan matahari yang berpanjangan apabila tidak digunakan.
    - title: Bolehkah bot kembung digunakan di air masin?
      description: Ya. Semua Paddle Board Overstock bot tiup direka untuk kegunaan air tawar dan air masin. Kami mengesyorkan bilas dengan air tawar dan keringkan dengan teliti selepas terdedah kepada air masin untuk mengelakkan kakisan yang dipasang dan pengkristalan garam fabrik.
    - title: Bagaimana saya menyimpan bot tiup?
      description: Kempiskan, bersihkan, dan keringkan bot sepenuhnya sebelum penyimpanan. Gulung longgar (elakkan lipatan ketat), simpan di tempat sejuk dan kering jauh dari cahaya matahari langsung, dan elakkan lantai konkrit untuk mengelakkan penyerap kelembapan.
    - title: Apakah kapasiti berat Paddle Board Overstock bot kembung?
      description: Kapasiti berat bermula dari 290 kg untuk model terkecil kami hingga melebihi 2000 kg untuk kenderaan komersial yang lebih besar. Setiap halaman produk menyenaraikan penarafan beban maksimum untuk model spesifik anda.
faqs_sup:
  title: SUP Soalan Lazim Papan
  subtitle: Soalan biasa mengenai papan dayung berdiri kami.
  columns: 2
  items:
    - title: Apakah SUP saiz papan yang tersedia?
      description: Kami menawarkan SUP papan dari 9 kaki hingga 12 kaki, termasuk reka bentuk serbaguna, pelayaran, yoga, dan khusus. Model terlaris kami termasuk Tropical Breeze (10 kaki) dan Ocean Voyager (11 kaki).
    - title: Apakah itu drop-stitch pembinaan?
      description: Drop-stitch pembinaan menggunakan ribuan benang poliester yang menghubungkan lapisan atas dan bawah papan, membolehkan ia menahan tekanan udara tinggi (15–20 PSI) dan mencapai platform yang mantap serta stabil. Ini adalah standard industri untuk SUPs boleh kembung premium.
    - title: Apakah had berat untuk SUP papan?
      description: SUP papan kami menyokong sehingga 150 kg bergantung pada model dan isipadu. Papan Leviathan Wake adalah model kapasiti tertinggi kami, direka untuk penunggang yang lebih besar dan penggunaan yoga.
    - title: Adakah anda menawarkan pakej SUP lengkap?
      description: Ya. Setiap SUP papan dihantar dengan pakej lengkap termasuk dayung aluminium 3 keping, pam tangan tekanan tinggi, tali kecemasan, beg galas untuk perjalanan, dan kit pembaikan. Sesetengah model juga termasuk set sirip boleh tanggal.
    - title: Apakah waranti untuk SUP papan?
      description: Semua Paddle Board Overstock SUP papan menawarkan waranti 2 tahun terhadap kecacatan pembuatan, termasuk kegagalan jahitan, kecacatan injap, dan delaminasi bahan di bawah penggunaan normal.
    - title: Berapa lama untuk mengembang SUP papan?
      description: Menggunakan pam tangan yang disertakan, pengembangan penuh kepada 15 PSI mengambil masa kira-kira 8–12 minit. Untuk pengembangan lebih cepat, kami mengesyorkan pam elektrik 12V Paddle Board Overstock kami, yang mengembang papan dalam kurang daripada 4 minit.
