hero:
  tagline: Pengetahuan Eksplorasi Air
  title: Belajar
  subtitle: |
    Panduan, tutorial, dan penerokaan mendalam — segala yang anda perlukan untuk meneroka<br />
    air dengan keyakinan. Dari memilih SUP pertama anda hingga menguasai teknik lanjutan.
  taglineSection: Pengetahuan untuk setiap pengayuh. Dari pemula hingga profesional.
featured:
  tagline: Topik Pilihan
  title: Mulakan perjalanan pembelajaran anda
  subtitle: Sama ada anda baru dalam sukan air atau ingin meningkatkan kemahiran, panduan kami sedia membantu anda.
  items:
    - title: SUP Asas
      description: Segala yang perlu diketahui oleh seorang pemula — jenis papan, saiz raket, kedudukan, dan petua hari pertama.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Papan Tiup vs Papan Keras
      description: Yang mana sesuai untuk anda? Kami membandingkan kebolehpindahan, prestasi, ketahanan, dan kos secara sebelah menyebelah.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Keselamatan Air
      description: Pengetahuan keselamatan penting yang setiap pendayung harus ada — cuaca, PFD, penyelamatan diri, dan banyak lagi.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Panduan Bahan
      description: PVC vs Hypalon, teknologi drop-stitch, penarafan penafian — fahami apa bahan peralatan anda.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Panduan Saiz
      description: Cari panjang papan, lebar, dan isipadu yang betul untuk berat badan, kemahiran, dan gaya dayung anda.
      icon: tabler:ruler
      href: /size-guide
    - title: Teknik Pertengahan
      description: Tingkatkan aktiviti mendayung anda dengan strok yang lebih maju, teknik pusingan, dan pengendalian air bergelora.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
