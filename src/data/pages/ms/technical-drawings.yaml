content_version_control:
  tagline: kawalan versi
  title: Versi Lukisan<br />Pengurusan
  subtitle: Setiap lukisan mengikuti sistem semakan terkawal. Sentiasa pastikan anda mempunyai semakan semasa sebelum menggunakan lukisan untuk perancangan projek.
  items:
    - title: Penjejakan Semakan
      description: Setiap lukisan membawa kod semakan (Rev-A, Rev-B, Rev-C), tarikh keluaran, tarikh semakan terakhir, model/konfigurasi yang berkenaan, unit, saiz fail, dan format. Hanya semakan "Semasa" yang tersedia untuk dimuat turun.
      icon: tabler:git-branch
    - title: Notis Status Lukisan
      description: Semua lukisan awam ditandakan "Susun atur awal sahaja — bukan untuk kegunaan pembinaan, pensijilan, atau pengeluaran. Dimensi tertakluk kepada spesifikasi akhir dan pengesahan pesanan." Ini melindungi kedua-dua pihak daripada salah guna.
      icon: tabler:alert-circle
    - title: Notifikasi Kemas Kini
      description: Apabila spesifikasi model berubah, semakan lukisan akan dikemas kini dan versi terdahulu ditandakan "Digantikan." Pengguna berdaftar yang memuat turun pek DXF/DWG akan dimaklumkan tentang kemas kini penting melalui emel.
      icon: tabler:bell
faq:
  title: Lukisan Teknikal — Soalan Lazim
  questions:
    - q: Adakah PDF GA benar-benar percuma?
      a: Ya. PDF susunan umum untuk model utama kami tersedia secara percuma — lengkapkan borang kelayakan ringkas di bawah dan pautan muat turun dihantar melalui emel dalam masa 1 hari bekerja. Ia mengandungi maklumat peringkat perancangan yang mencukupi untuk penilaian projek, peruntukan ruang, dan semakan spesifikasi awal.
    - q: Bagaimana saya boleh mengakses fail DXF/DWG?
      a: Lengkapkan borang kelayakan ringkas di halaman muat turun dengan nama syarikat, jenis projek, dan tujuan penggunaan anda. Permintaan yang diluluskan akan menerima pautan muat turun melalui emel dalam masa 1 hari bekerja.
    - q: Bolehkah saya mendapatkan model 3D STEP/IGES?
      a: Fail model 3D STEP atau IGES tersedia melalui proses permohonan projek kami. Berikan skop projek anda, keperluan integrasi, garis masa, dan niat pembelian. Tertakluk kepada kelulusan — biasanya dalam masa 3-5 hari bekerja.
    - q: Mengapa anda mengehadkan akses kepada fail yang lebih terperinci?
      a: Geometri badan kapal, data acuan, dan pengiraan struktur mewakili pelaburan R&D bertahun-tahun dan merupakan IP teras pembuatan. Kami menyediakan segala yang diperlukan untuk perancangan perolehan dan integrasi projek sambil melindungi keupayaan kami untuk terus melabur dalam pembangunan produk baru.
    - q: Adakah lukisan termasuk butiran pembuatan?
      a: Tidak. Lukisan awam dan bentuk ringan mengandungi maklumat peringkat perolehan untuk perancangan dan spesifikasi. Butiran peringkat pembuatan (jadual laminasi, laluan alat, pengembangan pemotongan) hanya dikongsi NDA di bawah pesanan yang disahkan.
    - q: Adakah lukisan tersedia untuk konfigurasi tersuai atau separa tersuai RIB ?
      a: Lukisan projek tersuai disediakan sebagai sebahagian daripada OEMODM proses / pembangunan. Jika anda menilai projek tersuai RIB , hubungi kami dengan keperluan anda dan kami akan menyediakan lukisan GA khusus projek sebagai sebahagian daripada cadangan.
