content_tiers:
  tagline: Tahap Muat Turun
  title: Empat Tahap Akses<br />— Butiran Tepat untuk Tahap yang Tepat
  subtitle: Kami menyediakan lukisan tahap perolehan, bukan fail tahap pembuatan. Setiap tahap sesuai untuk tahap projek yang berbeza.
  items:
    - title: Tahap 1 — PDF Awam
      description: Susun atur umum (GA), lukisan dimensi 4-pandang, dan susun atur dek dalam format PDF. Tersedia untuk dimuat turun secara percuma. Mencukupi untuk perancangan projek, peruntukan ruang, dan semakan spesifikasi awal.
      icon: tabler:file-type-pdf
    - title: Tahap 2 — DXF/DWG Bentuk Ringan
      description: Fail CAD 2D (DXF atau DWG) untuk integrasi susun atur tahap perancangan. Memerlukan borang kelayakan pendek (nama syarikat, jenis projek, kegunaan yang dimaksudkan). Tiada data struktur atau pembuatan disertakan.
      icon: tabler:file-code
    - title: Tahap 3 — STEP/IGES Permohonan Projek
      description: Fail model 3D (STEP atau IGES) untuk integrasi sistem, reka bentuk kelengkapan, atau koordinasi seni bina kapal. Memerlukan permohonan projek dengan skop, garis masa, dan niat pembelian. Tertakluk kepada kelulusan.
      icon: tabler:cube
    - title: Tahap 4 — NDA Kejuruteraan
      description: Lukisan struktur hull, jadual laminasi, pengembangan pemotongan tiub, dan data acuan. Tersedia hanya di bawah NDA dengan pesanan disahkan. Ini adalah fail tahap pembuatan — bukan untuk diedarkan secara awam.
      icon: tabler:lock
content_included:
  tagline: Apa Yang Termasuk
  title: Kandungan Lukisan<br />Setiap Model
  subtitle: Setiap model mempunyai pakej lukisan standard yang merangkumi maklumat perancangan penting untuk pembeli B2B dan jurutera projek.
  items:
    - title: Susunan Umum (GA)
      description: Profil sisi, pandangan atas, dan keratan rentas yang menunjukkan bentuk hull, kedudukan tiub, lokasi konsol, tempat duduk, sistem bahan api, dan dimensi utama (LOA, lebar, diameter tiub, sudut deadrise). Status semakan dan hak cipta dinyatakan pada blok tajuk.
      icon: tabler:layout
    - title: Lukisan Dimensi 4-Pandangan
      description: Pandangan sisi, depan, belakang, dan atas dengan dimensi keseluruhan untuk perancangan pengangkutan (ketinggian pada treler, lebar untuk kontena, berat untuk pengangkatan). Termasuk konfigurasi operasi dan pengangkutan.
      icon: tabler:ruler-2
    - title: Susun Atur Dek & Pelan Peralatan
      description: Pandangan atas dek yang menunjukkan asas konsol, kedudukan tempat duduk, lokasi D-ring, kedudukan lampu navigasi, akses pam bilge, ruang bateri/bahan api, dan titik pemasangan peralatan. Ketepatan terhad pada antara muka proprietari.
      icon: tabler:map
    - title: Lukisan Pengangkutan & Pembungkusan
      description: Pelan pemuatan kontena, dimensi buaian, pengagihan berat, dan kedudukan titik pengangkatan untuk perancangan logistik. Termasuk pilihan pembungkusan standard dan tersuai.
      icon: tabler:truck
content_protection:
  tagline: Perlindungan IP
  title: Apa Yang Tidak Kami Kongsi<br />& Mengapa
  subtitle: Melindungi IP kejuruteraan kami memastikan kami boleh terus melabur dalam R&D sambil masih menyediakan segala yang diperlukan pembeli untuk perancangan projek.
  items:
    - title: Data Teras Acuan Hull
      description: Geometri plag dan acuan, laluan alat CNC, dan templat lamina adalah aset pembuatan proprietari. Ia tidak dikongsi pada mana-mana tahap akses di luar kontrak NDA yang disahkan.
      icon: tabler:ban
    - title: Pengembangan Pemotongan Tiub
      description: Fail pemotongan corak rata untuk fabrik tiub adalah data peringkat pembuatan. Tersedia hanya di bawah NDA dengan pesanan pengeluaran yang disahkan dan hanya dikongsi dengan pihak kontrak.
      icon: tabler:ban
    - title: Pengiraan Struktur
      description: Analisis tegasan terperinci, hasil FEA, dan jadual lamina adalah dokumen yang sensitif terhadap pematuhan yang dikongsi hanya dengan Badan Notifikasi dan pelanggan yang terikat NDA semasa proses penilaian kesesuaian.
      icon: tabler:ban
    - title: Saringan Pesaing
      description: Kami berhak menolak permintaan akses CAD yang nampaknya daripada pesaing, pelajar tanpa konteks projek, atau pihak tanpa niat perolehan yang sah.
      icon: tabler:shield
content_models:
  tagline: Model Yang Tersedia
  title: Lukisan Teknikal<br />Ketersediaan Mengikut Model
  subtitle: Muat turun PDF GA tersedia untuk model RIB utama kami dan model bot tiup. Hubungi kami untuk lukisan model spesifik yang tidak disenaraikan.
  items:
    - title: AF580 RIB
      description: 5.8 m RIB, hull V-dalam GRP, tiub Hypalon atau PVC, konsol tengah. GA, dimensi, susun atur dek, dan pelan pengangkutan tersedia. Kategori Reka Bentuk C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5.2 m RIB, hull GRP sederhana-V, tiub Hypalon atau PVC, konsol sisi atau tengah. GA dan dimensi tersedia. Kategori Reka Bentuk C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4.3 m RIB, tubuh GRP, tiub PVC, kemudi atau konsol. GA dan dimensi tersedia. Kategori Reka Bentuk C/D.
      icon: tabler:sailboat
    - title: Bot Boleh Tiup AF380
      description: Perahu tiup 3.8 m, lantai aluminium, tiub PVC. Dimensi GA dan pembungkusan tersedia. Mematuhi EN ISO 6185.
      icon: tabler:sailboat
    - title: Bot Boleh Tiup AF320
      description: Bot tiup 3.2 m, lantai dek udara, tiub PVC. Dimensi GA dan pembungkusan tersedia. Mematuhi EN ISO 6185.
      icon: tabler:sailboat
