hero:
  tagline: Lukisan Teknikal & CAD
  title: RIB & Bot Inflatable<br />Muat Turun Lukisan Teknikal & CAD
  subtitle: Lukisan GA pada tahap perancangan, helaian dimensi, dan susun atur dek untuk penilaian projek dan spesifikasi. Akses lukisan teknikal pada tahap yang tepat — daripada PDF awam hingga fail STEP tahap projek.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB muat turun lukisan teknikal dan CAD bot
direct_answer: Paddle Board Overstock menyediakan lukisan teknikal pada tahap perolehan untuk bot RIB dan kenderaan air tiup — termasuk PDF susun atur umum (GA), helaian dimensi, dan lukisan susun atur dek. Format dengan butiran lebih tinggi (DXF/DWG, STEP/IGES) tersedia atas pertanyaan berkelayakan atau permohonan projek.
stats:
  - value: PDF GA
    label: Muat Turun Percuma
