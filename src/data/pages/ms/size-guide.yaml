hero:
  title: Panduan Saiz & Spesifikasi
  subtitle: Dimensi, kapasiti, dan kegunaan yang disyorkan untuk setiap produk Aquafarer.
categories:
  inflatable: Perahu tiup SUPs dan kayak direka untuk mudah alih tanpa mengorbankan prestasi. Padankan saiz yang betul dengan berat badan dan gaya mendayung anda.
  rib: Perahu tiup dengan badan keras untuk navigasi pesisir, rondaan, dan operasi marin profesional. Pilih mengikut panjang dan kapasiti enjin.
  accessory: Aksesori dan peralatan keselamatan untuk melengkapi kenderaan air anda. Saiz sejagat dengan pelbagai pilihan.
table:
  headers:
    product: Produk
    length: Panjang
    width: Lebar
    weight: Berat
    max_load: Muatan Maksimum
    best_for: Terbaik Untuk
how_to_choose:
  title: Cara Memilih Saiz Yang Betul
  cards:
    - title: Papan SUP
      description: Pilih panjang berdasarkan berat badan dan kegunaan yang dimaksudkan. Papan yang lebih lebar (32"+) menawarkan lebih kestabilan. Papan yang lebih panjang (11-12 kaki) lebih baik untuk pelayaran. Pengayuh yang lebih berat memerlukan papan dengan isipadu lebih tinggi.
    - title: Kayak
      description: Kayak tunggal (9 kaki) terbaik untuk perjalanan solo dan sungai. Kayak tandem (12 kaki) boleh menampung dua pengayuh atau seorang dewasa dengan peralatan. Semak kapasiti berat untuk jumlah muatan termasuk peralatan.
    - title: Perahu kecil & RIBs
      description: Pilih panjang bot kecil mengikut bilangan penumpang dan kegunaan yang dimaksudkan. RIBs yang lebih besar (4.5 m+) sesuai untuk luar pesisir dan penyelamatan. Bot kecil yang lebih kecil (2.7 m) sesuai sebagai bot pengiring dan platform memancing.
