how_to_choose:
  title: Cara Memilih Saiz Yang Betul
  cards:
    - title: Papan SUP Serbaguna
      description: Papan serba boleh kami yang panjangnya ~11 kaki (32" lebar, 6 inci drop-stitch) menyeimbangkan kestabilan, kelajuan, dan kapasiti. Sesuaikan jumlah papan dengan berat anda — pengayuh yang lebih berat memerlukan lebih banyak jumlah.
    - title: Lebar & Ketebalan
      description: Papan yang lebih lebar (32"+) menawarkan lebih kestabilan untuk pemula, yoga, dan memancing. Ketebalan 6 inci pada 15 PSI mengekalkan dek kukuh di bawah penunggang dan peralatan.
    - title: Pakej & Aksesori
      description: Setiap papan dihantar sebagai pakej lengkap — papan, beg galas untuk perjalanan, pam tangan, dayung boleh laras, sirip boleh tanggal, tali gegelung, dan set alat pembaikan. Semak muatan maksimum bagi penunggang serta peralatan.
