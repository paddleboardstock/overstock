who_section:
  tagline: Siapa yang Kami Bekalkan
  title: Dibina untuk perniagaan sukan air bebas
  items:
    - title: Kedai Pantai & Luncur
      description: Peruncit kecil di pesisir pantai yang memerlukan 5–15 papan setiap musim, campuran antara model serba boleh untuk pelancong dan papan gaya luncur untuk penduduk tempatan.
    - title: Penjual Dalam Talian
      description: Kedai e-dagang dan penjual pasaran menguji SUP kategori tanpa membuat komitmen kepada satu kontena penuh bagi satu model sahaja.
    - title: Armada Sewa & Sekolah
      description: Operasi sewaan dan SUP sekolah menambah armada — papan tahan lama, model campuran untuk memenuhi saiz pelanggan yang berbeza, dan sandaran jaminan.
    - title: Resort & Pengendali Pelancongan
      description: Hotel, resort pulau, dan pengendali pelancongan menambah SUP barisan aktiviti mereka dengan armada awal yang kecil dan pengisian semula bermusim yang mudah.
