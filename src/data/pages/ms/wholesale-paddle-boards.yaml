faq_section:
  title: Soalan Lazim Borong
  items:
    - q: Apakah pesanan borong minimum?
      a: Lima papan. Model stok berlebihan kami dibina untuk peruncit kecil — anda tidak perlu mengisi kontena untuk mendapatkan harga borong.
    - q: Bolehkah saya mencampur model SUP yang berbeza dalam satu pesanan borong?
      a: Ya. Pesanan model campuran adalah salah satu kelebihan terbesar membeli stok berlebihan — gabungkan sebarang model dalam stok dalam satu penghantaran, dan jumlah papan menentukan tier harga anda. Lihat halaman borong model campuran kami untuk maklumat lanjut.
    - q: Adakah papan itu benar-benar baru?
      a: Ya. Setiap papan adalah inventori lebihan yang baru sepenuhnya, tidak pernah digunakan — bukan barangan kedua, diperbaharui, atau pulangan pelanggan. Setiap papan diuji tekanan 100% sebelum dihantar.
    - q: Berapa lebih murah borong daripada runcit?
      a: Harga unit borong dinyatakan bagi setiap pesanan berdasarkan model dan kuantiti, dan adalah secara signifikan lebih rendah daripada harga runcit yang disenaraikan di atas. Mohon sebut harga untuk campuran sasaran anda dan kami akan menentukannya dengan tepat.
    - q: Kaedah penghantaran mana yang patut saya pilih?
      a: Penghantaran udara ekspres sesuai untuk 1–3 papan, sampel, dan stok semula yang mendesak. Penghantaran laut terkonsolidasi adalah pilihan ekonomik untuk pesanan peruncit 5–20 papan. Kami memberikan sebut harga untuk kedua-dua pilihan dengan setiap pertanyaan.
    - q: Apakah jaminan yang disertakan dengan papan borong?
      a: Jaminan 2-Tahun SUP yang sama yang kami berikan kepada setiap pelanggan, di setiap satu daripada 50+ negara yang kami hantar.
    - q: Adakah anda menghantar ke negara saya?
      a: Kami kini menghantar ke lebih daripada 50 negara, dengan panduan wilayah untuk Amerika Latin, Asia Tenggara, Afrika, Timur Tengah, dan pasaran utama termasuk Mexico, Brazil, Filipina, Indonesia, Thailand, Afrika Selatan, Kenya, dan UAE. Tanyakan dalam permintaan sebut harga anda dan kami akan mengesahkan perkhidmatan semasa ke alamat anda.
