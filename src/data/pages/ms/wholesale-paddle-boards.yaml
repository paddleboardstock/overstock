hero:
  tagline: Papan Borong SUP
  title: Borong Papan Dayung Tiup<br />untuk Perniagaan Kecil
  subtitle: Papan stok berlebihan baharu SUP dalam kuantiti mesra perniagaan kecil. Pesan 5–20 papan, campurkan mana-mana model dalam satu penghantaran, dan pilih kargo ekspres udara atau laut ke 50+ negara.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan kembung borong SUP dari Paddle Board Overstock sedia untuk penghantaran
direct_answer: Paddle Board Overstock membekalkan papan kembung stok berlebihan baharu SUP kepada peruncit kecil di seluruh dunia. Tiada pesanan minimum besar — pesanan borong bermula hanya pada 5 papan, dan anda boleh mencampurkan mana-mana model stok dalam satu pesanan. Papan dihantar dari pangkalan kami di Weihai, China melalui kargo udara ekspres (1–3 papan, sampel, atau stok segera) atau kargo laut terkonsolidasi (5–20 pesanan peruncit papan). Setiap papan diuji tekanan 100% sebelum dihantar dan dilindungi oleh Jaminan 2 Tahun kami SUP .
tldr_points:
  - 'Rendah MOQ: pesanan borong bermula pada 5 papan — bersaiz untuk kedai kecil, bukan muatan kontena'
  - 'Pesanan model campuran: gabungkan SUP mana-mana model yang ada dalam stok dalam satu penghantaran'
  - 'Dua pilihan penghantaran: kargo udara ekspres untuk 1–3 papan, kargo laut untuk pesanan 5–20 papan'
  - 'Stok baharu: 100% diuji tekanan, kadar lulus pemeriksaan akhir 99.3%, SUP Waranti 2 Tahun'
why_retailers:
  title: Mengapa Peruncit Kecil Memilih SUP Papan Stok Berlebihan
  subtitle: Anda tidak memerlukan gudang atau bajet kontena untuk membeli pada harga borong.
  items:
    - title: Kuantiti Mesra Perniagaan Kecil
      description: Borong tradisional memerlukan ratusan unit setiap pesanan. Model stok berlebihan kami dibina untuk kedai bebas — mulakan dengan 5 papan dan kembangkan pesanan anda apabila kedai anda berkembang.
    - title: Penetapan harga borong sebenar tanpa komitmen volum
      description: Kerana kami menjual inventori lebihan — pengeluaran lebihan dan stok yang diperoleh dengan teliti dari kilang rakan kongsi terpilih — anda mendapat harga unit pada tahap volum tanpa risiko tahap volum.
    - title: Campurkan Model untuk Sesuai dengan Pelanggan Anda
      description: Kedai pantai, penyedia tasik, dan kedai bandar menyajikan pelbagai jenis pendayung yang berbeza. Campurkan model serba boleh, pelancongan, dan gaya luncur SUP dalam satu susunan supaya rak anda sesuai dengan permintaan tempatan.
    - title: Serba Baru, Tidak Pernah Digunakan
      description: Setiap papan dalam inventori lebihan stok kami adalah baru dan tidak digunakan — bukan saat, bukan pemulangan. Setiap papan diuji tekanan 100% sebelum keluar dari gudang.
    - title: Penghantaran antarabangsa yang pantas dan fleksibel
      description: Kargo udara ekspres akan menerima 1–3 papan atau pesanan sampel ke pintu anda dengan cepat; kargo laut bersepadu mengekalkan kos per papan rendah pada pesanan peruncit 5–20 papan.
    - title: Disokong oleh Jaminan Sebenar
      description: Borong tidak bermakna tidak disokong. Setiap SUP papan mempunyai Jaminan 2 Tahun kami SUP , perlindungan yang sama yang kami berikan kepada setiap pelanggan di 50+ negara.
pricing_section:
  tagline: Harga Borong
  title: Harga Borong Mudah dan Telus
  subtitle: Harga diberikan setiap pesanan berdasarkan model, kuantiti, dan kaedah penghantaran yang anda pilih. Tiada yuran tersembunyi — sebut harga yang anda terima adalah harga yang anda bayar.
  points:
    - title: Bertingkat mengikut Kuantiti
      description: Harga unit menurun apabila saiz pesanan meningkat. Pesanan 10 papan berharga lebih baik setiap papan berbanding pesanan 5 papan; pesanan 20 papan lebih baik lagi.
    - title: Model campuran dikira dalam satu jumlah keseluruhan
      description: Tahap diskaun anda adalah berdasarkan jumlah keseluruhan papan dalam pesanan — bukan mengikut model. Mencampurkan 4 model berbeza × 3 papan setiap satu dikira sebagai pesanan 12 papan.
    - title: Disebutkan Harga Dengan Pilihan Penghantaran
      description: Setiap sebut harga termasuk pilihan kargo ekspres dan laut dengan anggaran masa transit, jadi anda boleh memilih baki kelajuan ke kos yang sesuai dengan jadual restock anda.
    - title: Tiada Akaun atau Keahlian Diperlukan
      description: Tiada kelab borong untuk disertai dan tiada yuran tahunan. Minta sebut harga, sahkan pesanan, dan kami akan menghantar.
