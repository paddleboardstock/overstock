hero:
  tagline: Gaya Hidup
  title: Aquafarer<br />Gaya Hidup
  subtitle: Dibina untuk mereka yang hidup di atas air — dari pengembara hujung minggu hingga pengendali komersial yang bergantung pada peralatan mereka setiap hari.
values:
  - icon: 🌊
    title: Lahir di Air
    desc: Setiap reka bentuk bermula dengan memahami bagaimana air bertindak. Kami mereka dari tepi keadaan ke dalam — kerana lautan adalah guru kami, bukan tempat kerja kami.
  - icon: 🔧
    title: Dibina Untuk Tahan Lama
    desc: Produk yang paling lestari adalah yang tidak perlu diganti. Bahan gred marin, teras drop-stitch yang dinilai sehingga 15 PSI, dan jahitan yang tahan lebih lama dari musim.
  - icon: 🏆
    title: Aksesible Mengikut Reka Bentuk
    desc: Sukan air tidak sepatutnya menjadi kemewahan. Prestasi tahap profesional pada harga yang masuk akal untuk keluarga, pemandu, dan pengendali kecil — bukan hanya armada komersial.
  - icon: 🌍
    title: Komuniti Global
    desc: 'Dari pantai Qingdao hingga tasik di Eropah, sungai di Asia Tenggara, dan teluk di Amerika — pelanggan kami berkongsi satu perkara: cinta untuk berada di atas air.'
  - icon: ♻️
    title: Pembuatan Bertanggungjawab
    desc: CNC-optimumkan pemotongan bertingkat untuk mengurangkan pembaziran bahan di bawah 5%. Pembinaan yang tahan lama mengurangkan kitaran penggantian. Kami membina untuk ketahanan kerana itu adalah pilihan yang paling lestari.
  - icon: 🤝
    title: Sokongan Yang Kekal
    desc: Lambung berusia dua puluh tahun masih menghubungi kami untuk alat ganti. Purata masa tindak balas jaminan ialah 24 jam. Kami tidak hilang selepas jualan — kami berada di sini untuk sepanjang hayat produk.
