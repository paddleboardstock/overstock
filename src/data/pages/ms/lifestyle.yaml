hero:
  tagline: Gaya Hidup
  title: The Paddle Board Overstock<br />Gaya Hidup
  subtitle: Dibina untuk mereka yang hidup di atas air — dari penjelajah hujung minggu hingga peminat paddling harian yang menantikan sesi berikutnya.
values:
  - icon: 🌊
    title: Lahir di Air
    desc: Setiap reka bentuk bermula dengan memahami bagaimana air bertindak. Kami mereka dari tepi keadaan ke dalam — kerana lautan adalah guru kami, bukan tempat kerja kami.
  - icon: 🔧
    title: Dibina Untuk Tahan Lama
    desc: Produk yang paling lestari adalah yang tidak perlu diganti. Bahan gred marin, teras drop-stitch yang dinilai sehingga 15 PSI, dan jahitan yang tahan lebih lama dari musim.
  - icon: 🏆
    title: Boleh Diakses Mengikut Reka Bentuk
    desc: Sukan air tidak seharusnya menjadi kemewahan. Prestasi setaraf profesional dengan harga yang berpatutan untuk keluarga, pemandu, dan peminat paddling harian — bukan hanya profesional.
  - icon: 🌍
    title: Komuniti Global
    desc: 'Dari pantai Weihai ke tasik-tasik di Eropah, sungai-sungai di Asia Tenggara, dan teluk di Amerika — pelanggan kami berkongsi satu perkara: cinta untuk berada di atas air.'
  - icon: ♻️
    title: Pembuatan Bertanggungjawab
    desc: CNC-optimumkan pemotongan bertingkat untuk mengurangkan pembaziran bahan di bawah 5%. Pembinaan yang tahan lama mengurangkan kitaran penggantian. Kami membina untuk ketahanan kerana itu adalah pilihan yang paling lestari.
  - icon: 🤝
    title: Sokongan Yang Kekal
    desc: Papan yang kami bina bertahun-tahun lalu masih menghubungi kami untuk alat ganti. Purata tindak balas jaminan kami adalah 24 jam. Kami tidak hilang setelah jualan — kami ada untuk sepanjang hayat produk.
