breadcrumb: OEM/ODM Pengilang
tldr:
  summary: Paddle Board Overstock adalah pengilang OEM/ODM terus dari kilang. Kemudahan 12,000 m² ISO 9001:2015, kapasiti pengeluaran tahunan 15,000 unit, pematuhan CE/BSCI/REACH/UKCA, pesanan minima MOQs dari 2-10 unit.
  points:
    - Kemudahan Qingdao 12,000 m² ISO disahkan 9001:2015
    - Kapasiti tahunan 15,000 unit dengan 200-300 pekerja mahir
    - Pematuhan CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Pesanan minima MOQs: 2-5 unit (RIB), 5-10 unit (SUP) untuk model standard'
    - 50+ negara eksport dengan penghantaran FOB Qingdao
