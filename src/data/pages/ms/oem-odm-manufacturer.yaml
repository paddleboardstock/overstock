process_section:
  eyebrow: Proses Kami
  title: Aliran Kerja OEM/ODM Lengkap
  subtitle: Dari ringkasan reka bentuk hingga muatan kontena — enam langkah ke kenderaan air tiup label peribadi anda.
  steps:
    - step: '01'
      title: Spesifikasi & Ringkasan Reka Bentuk
      desc: Kongsi spesifikasi sasaran, lukisan CAD, atau produk rujukan anda. Pasukan kejuruteraan kami menyemak bahan, dimensi, dan keperluan pematuhan (CE, BSCI) sebelum memberikan sebut harga.
    - step: '02'
      title: Prototip Acuan 3D
      desc: Kami mereka dan CNC-mesin acuan khusus untuk papan SUP, badan kayak, dan komponen RIB. Sampel prototip dihasilkan dalam 15–20 hari bekerja untuk kelulusan anda.
    - step: '03'
      title: Pemilihan Bahan & Pengeluaran Sampel
      desc: Pilih dari PVC gred ketenteraan (0.9mm–1.2mm), Hypalon CSM, atau fabrik teras drop-stitch. Kami menghasilkan sampel pra-pengeluaran dengan warna jenama, logo, dan pembungkusan anda untuk kelulusan.
    - step: '04'
      title: Audit Kilang & Pematuhan CE
      desc: Setiap pesanan OEM termasuk dokumentasi pematuhan — deklarasi kesesuaian CE, rekod kebolehsusuran 9001 ISO, laporan pematuhan sosial BSCI, dan deklarasi bahan REACH.
    - step: '05'
      title: Pengeluaran Besar & Kawalan Kualiti Sejajar
      desc: Larian pengeluaran mengikuti senarai semak kualiti 100-titik kami. Setiap unit diuji pengekalan tekanan 24 jam, ujian lekapan jahitan, dan pemeriksaan visual sebelum pembungkusan.
    - step: '06'
      title: Logistik & Penghantaran FOB Qingdao
      desc: Barang siap dipaletas, dibungkus penyusutan, dan dimuatkan ke kontena di pelabuhan Qingdao. Kami mengurus semua dokumentasi eksport, pelepasan kastam, dan menyediakan penjejakan penghantaran masa nyata.
capabilities_section:
  eyebrow: Keupayaan Pembuatan
  title: Apa yang Kami Bina
  subtitle: Enam keupayaan pengeluaran teras untuk rakan kongsi global B2B.
  items:
    - title: Drop-Stitch SUP Pembuatan Papan
      desc: Laminasi teras drop-stitch sepenuhnya untuk papan berkaki rigid bertekanan tinggi (15–20 PSI). Panjang, lebar, ketebalan, profil rocker, dan reka bentuk grafik tersuai.
    - title: PVC Pengeluaran Bot Tiup
      desc: Perahu, tender, dan bot sukan yang dikimpal frekuensi tinggi PVC. Konfigurasi bilik berkembar, pilihan lantai (slat, dek udara, gulung), dan integrasi aksesori.
    - title: Hypalon RIB Fabrikasi Bot
      desc: Tiub Hypalon CSM gred komersial yang digabungkan pada badan V-dalam fiberglass atau aluminium. Panjang 3.3 m hingga 6.0 m untuk operasi rondaan, penyelamatan, lawatan, dan menyelam.
    - title: Label Peribadi & Penjenamaan Tersuai
      desc: 'Perkhidmatan label peribadi penuh: logo tersuai pemindahan haba atau cetakan skrin, pembungkusan berjenama (kotak runcit, beg membawa), manual pengguna dalam bahasa anda, dan pendaftaran barkod/UPC.'
    - title: Reka Bentuk Acuan & Alat Tersuai
      desc: Pasukan kejuruteraan 3D CAD/CAM dalaman. Kami merekabentuk dan menghasilkan acuan aluminium dan komposit tersuai untuk bentuk badan unik, konfigurasi dek, dan titik pemasangan aksesori.
    - title: OEM Aksesori & Pengemasan
      desc: Jak vest (CE 12402), pam tindakan ganda, dayung karbon/nylon, kit pembaikan, beg membawa, dan perhimpunan tali keselamatan. Pengemasan penuh dan pembungkusan set untuk penyampaian sedia runcit.
experience_section:
  eyebrow: Pengalaman Dunia Sebenar
  title: Kerjasama yang Membangun Jenama
  subtitle: Cerita sebenar dari jenama dan organisasi yang bekerjasama dengan Paddle Board Overstock untuk pengeluaran OEM/ODM.
  stories:
    - quote: Kami datang ke Paddle Board Overstock dengan lakaran pada tisu dan senarai keperluan. Lapan bulan kemudian, kami mempunyai produk siap pengeluaran yang lulus pensijilan CE pada percubaan pertama.
      narrative: Sebuah syarikat permulaan Eropah dengan reka bentuk SUP yang baru mendekati Paddle Board Overstock untuk pengeluaran ODM. Pasukan R&D Paddle Board Overstock membawa konsep itu melalui reka bentuk CAD, analisis struktur FEA, simulasi hidrodinamik, penciptaan acuan, pembuatan prototaip, dan peralatan pengeluaran. Pengasas permulaan itu mengunjungi Qingdao tiga kali sepanjang proses. Produk akhir lulus pensijilan CE tanpa sebarang pengubahsuaian — keputusan ini disebabkan oleh pasukan kejuruteraan Paddle Board Overstock yang memahami keperluan peraturan Eropah dari awal.
      context: Pelancaran jenama Eropah SUP, 2023-2024
      source: Brand Founder
    - quote: Tahap perlindungan NDA dan keselamatan IP di Paddle Board Overstock memberi keyakinan kepada kami untuk berkongsi reka bentuk proprietari kami. Mereka melayan IP kami seolah-olah milik mereka sendiri.
      narrative: Sebuah syarikat peralatan marin berpangkalan di AS dengan teknologi injap proprietari memerlukan rakan kongsi pembuatan yang boleh melindungi IP mereka sambil mengeluarkan pada skala besar. Selepas mengaudit lima pengeluar Cina, mereka memilih Paddle Board Overstock berdasarkan protokol perlindungan IP kilang, pengendalian fail reka bentuk selamat, dan kesediaan menandatangani NDA ketat. Kerjasama ini telah menghasilkan tiga barisan produk dalam tempoh empat tahun tanpa sebarang insiden IP.
      context: Syarikat peralatan marin AS, kerjasama OEM sejak 2021
      source: Naib Presiden Operasi
