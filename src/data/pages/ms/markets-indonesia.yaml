hero:
  tagline: Indonesia
  title: Papan Borong SUP untuk<br />Perniagaan Indonesia
  subtitle: Kedai sukan air Bali, resort pulau, dan pengendali di seluruh kepulauan — papan stok tambahan baharu dari 5 unit, model campuran, dihantar dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan stok berlebihan SUP untuk resort Indonesia dan kedai sukan air di Bali
direct_answer: Paddle Board Overstock membekalkan papan kembung stok berlebihan baharu SUP kepada perniagaan Indonesia — kedai sukan air di Bali, resort pulau dari Lombok ke Gillis dan seterusnya, kelab pantai, dan pengendali sewaan. Pesanan borong bermula dengan 5 papan dengan model campuran dalam satu penghantaran, dihantar dari Weihai, China melalui kargo udara ekspres atau kargo laut bersatu. Setiap papan diuji tekanan 100% dan dilindungi oleh SUP Jaminan 2 Tahun.
tldr_points:
  - Borong dari 5 papan — model campuran, dihargai mengikut jumlah keseluruhan
  - Berkhidmat kepada ekonomi sukan air Bali dan resort pulau di seluruh negara
  - Laluan kargo pendek China–Indonesia, udara atau laut
  - 100% diuji tekanan, jaminan 2 tahun SUP pada setiap papan
overview_section:
  tagline: Gambaran Pasaran
  title: SUP Pasaran Indonesia
  paragraphs:
    - Indonesia adalah salah satu ekonomi sukan air terbesar di Asia, dan Bali adalah jantungnya. Dari kelab pantai Seminyak dan Canggu hingga lagun tenang Sanur dan Nusa Dua, papan dayung muncul di mana-mana — mendayung matahari terbit di atas terumbu SUP , kelas yoga, lawatan lagun, dan program tetamu hotel. Selain Bali, Lombok, Kepulauan Gili, dan suasana pelancongan yang berkembang di seluruh kepulauan mengikuti corak yang sama.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: Ketahanan, UV prestasi, dan kebolehbaikan lebih penting daripada kilauan katalog. Pesanan terdiri daripada 5–20 papan, dicampur untuk kelas, sewaan, dan paparan runcit.
  customer_types:
    - title: Kedai Sukan Air Bali
      description: Pengendali Sanur, Seminyak, dan Canggu yang telah mantap SUP menambah kepada barisan luncur, menyelam, dan snorkel.
    - title: Resort Pulau & Kelab Pantai
      description: Resort dan kelab pantai di Bali, Lombok, dan Gillis menjalankan program dayung tetamu dan SUP yoga.
    - title: Pengendali Lawatan & Sewa
      description: Pengendali pelancongan lagun dan bakau serta gerai sewaan setiap jam yang menyegarkan armada mengikut musim.
shipping_section:
  title: Kapal ke Indonesia
  paragraphs:
    - Indonesia adalah salah satu laluan kargo terpendek dari pangkalan kami di Weihai, China. Kargo udara ekspres membawa sampel dan 1–3 pesanan papan dengan pantas ke Denpasar dan Jakarta; kargo laut konsolidasi melayani 5–20 pesanan borong papan melalui Tanjung Priok, Tanjung Benoa, dan pelabuhan lain. Kedua-dua pilihan dinyatakan dengan anggaran masa transit destinasi anda.
    - Kami menyediakan invois komersial dan senarai pembungkusan yang diperlukan untuk pelepasan, dengan kod HS yang betul dan nilai yang diisytiharkan. Duti import dan cukai perlu dibayar oleh pengimport mengikut peraturan Indonesia.
  customs_note: Pelepasan peralatan sukan di Indonesia adalah sensitif dari segi dokumentasi — bekerjasama dengan broker kastam anda (PPJK) untuk mengesahkan layanan duti dan cukai semasa. Kami menyediakan dokumen yang lengkap dan konsisten serta memberi respons pantas kepada permintaan broker.
faq_section:
  title: Soalan Lazim Indonesia
  items:
    - q: Seberapa laju kargo dari China ke Bali?
      a: Indonesia adalah salah satu destinasi kargo terdekat kami dari Weihai. Udara ekspres ke Denpasar atau Jakarta adalah pilihan terpantas untuk sampel dan pesanan kecil; kargo laut konsolidasi akan dinyatakan dengan tingkap transit untuk pesanan borong. Kedua-duanya disenaraikan dalam sebut harga anda.
    - q: Adakah papan ini sesuai untuk kegunaan sewaan harian di kawasan tropika UV?
      a: Ya — drop-stitch PVC pembinaan yang dinilai untuk kitaran sewaan harian adalah apa yang kami bekalkan kepada armada di 50+ negara. Penjagaan standard (bilas selepas air masin, penyimpanan teduh) memastikan mereka beroperasi sepanjang banyak musim matahari Bali.
    - q: Bagaimana rupa pesanan kedai sukan air?
      a: Biasanya 5–15 papan dicampur antara model serba boleh yang stabil untuk pelajaran dan sewaan serta beberapa edisi seni premium untuk paparan runcit — satu penghantaran, harga berdasarkan jumlah keseluruhan.
    - q: Bolehkah anda menyokong PPJK kami dengan dokumentasi?
      a: Ya. Setiap pesanan dihantar bersama invois komersial dan senarai pembungkusan dengan kod HS yang betul dan nilai yang diisytiharkan, dan kami bertindak balas dengan cepat apabila ejen anda memerlukan dokumen tambahan.
