content_capability:
  tagline: Keupayaan Kejuruteraan
  title: Apa yang Pasukan<br />Kejuruteraan Kami Sampaikan
  subtitle: Kejuruteraan Aquafarer merangkumi keseluruhan kitaran hidup produk — daripada penyelidikan pasaran dan reka bentuk konsep hingga prototaip, ujian, dan pengeluaran besar-besaran.
  items:
    - title: Reka Bentuk Industri
      description: Pasukan reka bentuk industri kami berfungsi berdasarkan keperluan pelanggan, penyelidikan pasaran, dan analisis persaingan untuk membangunkan konsep produk yang mengimbangi estetika, fungsi, dan kemampuan pengilangan. Kami menghasilkan lakaran 2D, rendering 3D, dan dokumen spesifikasi untuk semakan pelanggan sebelum melakukan pengeluaran alatan.
      features:
        - Pembangunan konsep dan kajian kebolehlaksanaan
        - Lukisan reka bentuk 2D dan rendering 3D
        - Pemilihan dan spesifikasi bahan
        - Analisis Reka Bentuk untuk Pengilangan (DFM)
        - Penilaian ergonomik dan keselamatan
    - title: Kejuruteraan Struktur
      description: Jurutera struktur kami pakar dalam seni bina bot tiup — reka bentuk lambung, konfigurasi bilik tiub, kejuruteraan inti drop-stitch, dan pengagihan beban. Setiap reka bentuk dianalisis untuk integriti struktur, pengoptimuman berat, dan pematuhan dengan piawaian berkaitan (CE, ISO, AS).
      features:
        - Reka bentuk lambung fiberglass Deep-V dengan sudut deadrise yang dikira
        - Konfigurasi bilik tiub berbilang untuk keselamatan dan daya apung
        - Spesifikasi dan pengoptimuman ketumpatan inti Drop-stitch
        - Analisis elemen terhingga untuk komponen menanggung beban
        - Pengiraan pengagihan berat dan kestabilan
    - title: Pemodelan 3D & CAD
      description: Kesemua reka bentuk produk dibangunkan dalam 3D CAD sebelum peralatan prototaip dimulakan. Jurutera kami menggunakan SolidWorks dan Rhino 3D untuk pemodelan produk, membolehkan pelanggan menyemak setiap perincian — daripada profil tiub hingga susun atur konsol — sebelum membuat komitmen untuk pengeluaran.
      features:
        - Pemodelan 3D CAD penuh dalam SolidWorks dan Rhino 3D
        - Rendering foto-realistik untuk pembentangan pelanggan
        - Pakej lukisan teknikal untuk pengeluaran
        - Reka bentuk acuan dan peralatan daripada model 3D
        - Pemindahan data terus CAD-ke-CNC untuk pemotongan tepat
    - title: Prototyping & Ujian
      description: Sebelum pengeluaran besar-besaran, setiap produk baharu melalui peringkat prototaip. Kami membina prototaip berfungsi untuk penilaian pelanggan, kemudian menjalankannya melalui protokol ujian penuh kami — ujian tekanan, ujian kestabilan, ujian beban, dan percubaan air. Iterasi reka bentuk pada peringkat prototaip adalah pantas dan kos-efektif.
      features:
        - Peralatan prototaip pantas (tempoh 15-20 hari)
        - Prototaip berfungsi untuk penilaian dunia sebenar
        - Protokol ujian penuh sebelum kelulusan pengeluaran
        - Penambahbaikan reka bentuk berulang berdasarkan hasil ujian
        - Pencapaian kelulusan pelanggan sebelum peralatan pengeluaran
    - title: Integrasi Aksesori Tersuai
      description: Banyak projek OEM memerlukan integrasi aksesori yang dibekalkan oleh pelanggan atau pihak ketiga — konsol tersuai, tempat duduk khusus, sistem elektronik, pemasangan peralatan menyelam, atau elemen penjenamaan. Pasukan kejuruteraan kami mengurus reka bentuk integrasi, penyesuaian struktur, dan pengesahan kualiti semua aksesori.
      features:
        - Reka bentuk konsol dan susun atur panel instrumen
        - Integrasi tempat duduk dan upholsteri tersuai
        - Reka bentuk sistem elektronik dan pendawaian
        - Sistem pemasangan peralatan menyelam dan penyelamat
        - Spesifikasi penjenamaan dan aplikasi grafik
content_process:
  tagline: Proses Pembangunan
  title: Daripada Konsep<br />hingga Pengeluaran
  subtitle: Proses pembangunan produk kami mengikuti aliran kerja 6 peringkat yang terstruktur yang direka untuk mengurangkan risiko, memadatkan tempoh masa, dan memastikan kesediaan pembuatan dari hari pertama.
  stages:
    - stage: '01'
      title: Keperluan & Penyelidikan
      duration: 1-2 minggu
      description: Kami bekerja dengan pelanggan untuk menentukan spesifikasi produk, keperluan pasaran sasaran, keperluan pematuhan peraturan, dan objektif komersial. Peringkat ini menghasilkan Dokumen Keperluan Produk (PRD) yang membimbing semua kerja seterusnya.
      deliverables: PRD, analisis pasaran, penanda aras pesaing, anggaran kos awal
    - stage: '02'
      title: Reka Bentuk Konsep
      duration: 2-3 minggu
      description: Pasukan reka bentuk industri membangunkan konsep produk berdasarkan PRD. Pelbagai pilihan reka bentuk dibentangkan dengan rendering 3D, cadangan bahan, dan penilaian kejuruteraan awal. Pelanggan memilih arah untuk pembangunan terperinci.
      deliverables: Penerangan konsep 3D, spesifikasi bahan, rasional reka bentuk, BOM awal
    - stage: '03'
      title: Kejuruteraan Terperinci
      duration: 2-4 minggu
      description: Konsep yang dipilih direka sepenuhnya — pemodelan 3D CAD, analisis struktur, konfigurasi tiub, rekaan lambung, integrasi aksesori, dan dokumentasi pengeluaran. Semua dimensi, bahan, dan proses ditentukan untuk peralatan.
      deliverables: Model CAD 3D penuh, lukisan kejuruteraan, BOM akhir, spesifikasi peralatan, pelan QC
    - stage: '04'
      title: Prototyp
      duration: 2-3 minggu
      description: Alat prototaip dihasilkan dan sampel berfungsi dibina. Pelanggan menyemak prototaip mengikut spesifikasi PRD. Ujian dijalankan mengikut protokol yang dipersetujui. Penyesuaian reka bentuk dibuat berdasarkan maklum balas sebelum alat pengeluaran.
      deliverables: Prototip fungsian, laporan ujian, log semakan reka bentuk, dokumen kelulusan pelanggan
    - stage: '05'
      title: Peralatan Pengeluaran
      duration: 2-3 minggu
      description: Sebaik sahaja prototaip diluluskan, peralatan pengeluaran dikomersialkan — acuan, jig pengelasan, program pemotongan, alat pemasangan. Dokumentasi QC dan kriteria pemeriksaan dimuktamadkan. Larian percubaan dijalankan untuk pengesahan proses.
      deliverables: Alat pengeluaran, dokumentasi proses, pelan pemeriksaan QC, laporan percubaan
    - stage: '06'
      title: Pengeluaran Besar-besaran & Kawalan Kualiti
      duration: Berlaku
      description: Pengeluaran penuh bermula dengan kawalan kualiti dalam proses pada setiap peringkat. Artikel pertama diperiksa dan diluluskan sebelum pelepasan kumpulan. Pemantauan kualiti berterusan, penjejakan kecacatan, dan peningkatan berterusan sepanjang kitaran hayat pengeluaran.
      deliverables: Jadual pengeluaran, laporan QC, rekod penjejakan batch, dokumentasi penghantaran
content_customization:
  tagline: Pilihan Penyesuaian
  title: Apa Yang Boleh<br />Tersuai
  subtitle: Hampir setiap aspek produk kami boleh disesuaikan untuk memenuhi keperluan pelanggan. Berikut adalah kategori penyesuaian yang paling biasa.
  columns: 3
  items:
    - title: Laut & Struktur
      description: Panjang badan kapal tersuai, lebar batangan, sudut deadrise, diameter tiub, konfigurasi bilik, dan gred bahan.
      icon: tabler:sailboat
    - title: Warna & Grafik
      description: Warna tiub (PVC/Hypalon), warna gelcoat lambung, warna konsol, grafik dek, penempatan logo, dan reka bentuk pembungkusan.
      icon: tabler:palette
    - title: Konsol & Kawalan
      description: Konsol tengah, konsol sisi, atau stereng kemudi. Susun atur panel instrumen khusus, penempatan suis, dan posisi kemudi.
      icon: tabler:steering-wheel
    - title: Tempat Duduk & Perabot Dalaman
      description: Tempat duduk joki, tempat duduk bangku, upholsteri mewah, jahitan yang sepadan dengan warna, konfigurasi boleh lipat atau boleh tanggal.
      icon: tabler:armchair
    - title: Aksesori & Peralatan
      description: Tangga selam, rak tangki, tiang tunda, T-top, Bimini top, sistem bunyi, elektronik navigasi, dan peralatan keselamatan.
      icon: tabler:backpack
    - title: Pembungkusan & Penjenamaan
      description: Pembungkusan runcit khas, kotak label peribadi, kotak penghantaran dengan tanda jenama, tag gantung, dan manual pengguna dalam bahasa pelanggan.
      icon: tabler:box
content_industries:
  tagline: Aplikasi Industri
  title: Penyelesaian Kejuruteraan<br />mengikut Industri
  subtitle: Pasukan kejuruteraan kami telah membangunkan produk untuk pelbagai aplikasi marin — setiap satu dengan keperluan dan kriteria prestasi yang berbeza.
  columns: 3
  items:
    - title: Operasi Menyelam
      description: Dek diperkuat, integrasi tangga menyelam, sistem penyimpanan tangki, dan platform stabil untuk pusat menyelam komersial di seluruh dunia.
      icon: tabler:lifebuoy
    - title: Menyelamat & Kecemasan
      description: Reka bentuk lambung berkelajuan tinggi, dek pembuangan sendiri, sistem pemasangan peralatan, dan konfigurasi keselamatan pelbagai bilik untuk operasi SAR.
      icon: tabler:alert-triangle
    - title: Pelancongan Marin
      description: Susun atur keselesaan penumpang, integrasi peneduh matahari, sistem menaiki, dan konfigurasi mesra bahan api untuk operasi pemindahan pulau.
      icon: tabler:beach
    - title: Tender Yacht
      description: Reka bentuk kompak untuk simpanan davit, pilihan kemasan mewah, warna yang padan dengan kapal induk, dan ciri tunda berprestasi tinggi.
      icon: tabler:sailboat
    - title: Perikanan & Akuakultur
      description: Konfigurasi dek rata, integrasi livewell, susun atur pemegang rod, perkakasan kalis kakisan untuk pendedahan berterusan kepada air masin.
      icon: tabler:fish
    - title: Pelabuhan & Industri
      description: Pengukuhan lambung berat, susun atur bot kerja, konfigurasi pengangkutan kakitangan, dan integrasi peralatan untuk operasi luar pesisir.
      icon: tabler:ship
