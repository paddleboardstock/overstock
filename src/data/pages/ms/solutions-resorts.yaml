testimonial:
  content: Paddle Board Overstock merancang dan melengkapi keseluruhan program aktiviti pantai kami di tiga hartanah resort. 120 SUPs, infrastruktur keselamatan, dan latihan kakitangan — semuanya dihantar dalam satu penghantaran. Penyertaan tetamu kami dalam aktiviti air meningkat sebanyak 60% pada musim pertama.
  name: Sophie Laurent
  title: Pengarah Pengalaman Tetamu, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Profil Resort
  title: Penyelesaian Hospitaliti Tepi Air<br />Mengikut Jenis Hartanah
  subtitle: Setiap hartanah resort mempunyai profil tetamu unik, gabungan aktiviti, dan irama operasi — dari penginapan eko butik hingga resort pantai mewah yang luas. Kami merancang program sukan air yang sesuai dengan kelas hartanah dan jangkaan tetamu.
  items:
    - title: Resort Mewah Tepi Pantai
      subtitle: Pemindahan VIP, aktiviti air, pengalaman tetamu premium
      description: Hartanah mewah tepi pantai — Four Seasons, Aman, dan kumpulan mewah serupa — di mana sukan air adalah kemudahan utama tetamu yang mendorong skor kepuasan dan pendapatan tambahan. Armada perlu kelihatan premium, menawarkan pelbagai untuk semua peringkat umur dan tahap kebolehan, dan berintegrasi dengan lancar dengan sistem kaunseling dan tempahan resort sedia ada. Jangkaan penampilan tetamu sangat tinggi — keadaan dan persembahan peralatan secara langsung mempengaruhi ulasan 5 bintang.
      features:
        - Armada berjenama premium SUPs dengan warna resort yang sepadan
        - 'Persembahan sedia tetamu: warna resort sepadan, jenama logo, paparan peralatan yang tersusun'
        - Papan siri seni tanda tangan untuk pengalaman tetamu premium dan detik bergambar
        - 'Infrastruktur keselamatan bersepadu: tali pelampung, stesen penyelamat, AED'
        - 'Pengurusan pendapatan: templat harga dinamik, latihan jualan tambahan, pembungkusan pakej'
    - title: Resort Pulau Peribadi
      subtitle: Aktiviti air tetamu yang tenang dan berdikari
      description: 'Resort pulau persendirian beroperasi di lokasi terpencil di mana logistik adalah kompleks dan setiap penghantaran penting. Aktiviti air tetamu perlu berdikari: peralatan yang disimpan secara padat, boleh dikembangkan mengikut permintaan, memerlukan penyelenggaraan minimum, dan dipersembahkan dengan cantik apabila tetamu tiba. Kami merancang program armada di sekitar tingkap kapal terbang amfibia dan kargo laut, dan pembinaan kukuh kami memastikan peralatan sentiasa sedia untuk tetamu sepanjang musim panjang tanpa sokongan dari tanah besar.'
      features:
        - Armada tiup padat — menghantar dan menyimpan dengan cekap di pulau-pulau terpencil
        - Pembinaan gred komersial PVC untuk kegunaan tetamu berbilang musim
        - Penyelenggaraan mudah di tapak dengan kit pembaikan dan panduan video yang disertakan
        - Penjenamaan resort tersuai yang sepadan dengan estetika pulau
    - title: Resort Tepi Tasik & Eko
      subtitle: Pengalaman tetamu bersepadu dengan alam semula jadi
      description: Hartanah tepi tasik, eko-lodge, dan tempat percutian alam semula jadi yang menawarkan aktiviti air yang tenang dan berimpak rendah yang melengkapi persekitaran semula jadi. Peralatan harus tidak bermotor jika boleh, mudah disimpan jika ruang terhad, dan senyap digunakan untuk mengekalkan pengalaman suasana untuk semua tetamu.
      features:
        - Armada tanpa motor SUP dalam siri seni yang diinspirasikan oleh alam semula jadi
        - Stesen pam elektrik senyap untuk inflasi apabila diperlukan oleh tetamu
        - Bahan mesra alam dan pembungkusan selaras dengan penjenamaan kelestarian
        - Rak penyimpanan dan sistem organisasi di tepi dok disertakan
    - title: Kelab Pantai
      subtitle: Hiburan tetamu dan suasana tepi laut
      description: Kelab pantai mengendalikan persekitaran yang bertenaga tinggi dan fokus visual di mana peralatan menjadi sebahagian daripada suasana. Mereka memerlukan papan dayung bergaya untuk hiburan tetamu, SUP sewaan untuk aktiviti tepi pantai, dan peralatan yang kelihatan sebaik tempat itu sendiri. Armada mesti mudah dikendalikan, tahan penggunaan harian oleh tetamu dengan pelbagai tahap kemahiran, dan boleh digunakan dengan cepat semasa waktu puncak.
      features:
        - Siri seni tanda tangan SUPs yang juga berfungsi sebagai hiasan tempat acara
        - Armada sedia untuk disewa SUP untuk hiburan tetamu
        - Warna dan penjenamaan tersuai sepadan dengan identiti visual kelab pantai
        - Sistem pelancaran dan pengambilan cepat untuk operasi pusingan tinggi
        - UV-Pembinaan tahan untuk pendedahan air masin harian
    - title: Kelab Ahli Persendirian & Kelab Yacht
      subtitle: Ahli sukan air dan program mendayung eksklusif
      description: Kelab swasta di mana sukan air adalah manfaat ahli dan bukannya pemacu hasil. Peralatan mesti memenuhi piawaian estetika yang lebih tinggi, tersedia atas permintaan untuk ahli, dan memerlukan pengawasan kakitangan yang minimum. Kelab kapal layar marina menggunakan SUP armada berjenama untuk rekreasi ahli di sekitar pelabuhan. Penyimpanan dan penyelenggaraan harus tidak kelihatan kepada ahli.
      features:
        - Armada berjenama premium SUP untuk sukan air ahli
        - 'Peralatan premium: dek EVA, warna ahli tersuai, upholsteri berjenama'
        - Sistem daftar keluar layan diri untuk akses ahli tanpa kakitangan
        - Penyimpanan luar musim dan program penyegaran tahunan
    - title: Hotel Fokus Pengembaraan & Aktiviti
      subtitle: Lawatan berpandu, SUP yoga, ekspedisi snorkeling, aktiviti berkumpulan
      description: Hartana yang meletakkan diri mereka sebagai destinasi pengembaraan — menawarkan lawatan berpandu, SUP yoga, kayuhan matahari terbenam, ekspedisi snorkeling, dan aktiviti berkumpulan. Armada perlu menyokong kedua-dua model sewaan bebas dan program berpandu, dengan peralatan yang boleh digunakan dengan lancar antara penggunaan sendiri tetamu dan lawatan yang dikendalikan oleh pengajar. Hartana ini memerlukan peralatan yang tahan lama untuk penggantian kerap, dengan pembersihan yang mudah antara kumpulan tetamu.
      features:
        - Armada pelbagai guna yang menyokong model sewaan + lawatan berpandu
        - Platform SUP yang sangat stabil untuk aktiviti berkumpulan
        - 'Peralatan pengajar: papan pengajar, kotak kering, komunikasi kalis air'
        - 'Putaran peralatan bermusim: armada musim panas → program penyimpanan musim sejuk'
        - Pembinaan tahan lama yang dinilai untuk penggunaan harian tetamu dengan penyelenggaraan minima
