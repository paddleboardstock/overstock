testimonial:
  content: Paddle Board Overstock mereka bentuk dan membekalkan keseluruhan program aktiviti pantai kami di tiga hartanah resort. 80 SUPs, 40 kayak, infrastruktur keselamatan, dan latihan kakitangan — semuanya dihantar dalam satu penghantaran. Penyertaan tetamu dalam aktiviti air meningkat sebanyak 60% pada musim pertama.
  name: Sophie Laurent
  title: Pengarah Pengalaman Tetamu, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Profil Resort
  title: Penyelesaian Hospitaliti Tepi Air<br />Mengikut Jenis Hartanah
  subtitle: Setiap hartanah resort mempunyai profil tetamu unik, gabungan aktiviti, dan irama operasi — dari penginapan eko butik hingga resort pantai mewah yang luas. Kami merancang program sukan air yang sesuai dengan kelas hartanah dan jangkaan tetamu.
  items:
    - title: Resort Mewah Tepi Pantai
      subtitle: Pemindahan VIP, aktiviti air, pengalaman tetamu premium
      description: Hartanah mewah tepi pantai — Four Seasons, Aman, dan kumpulan mewah serupa — di mana sukan air adalah kemudahan utama tetamu yang mendorong skor kepuasan dan pendapatan tambahan. Armada perlu kelihatan premium, menawarkan pelbagai untuk semua peringkat umur dan tahap kebolehan, dan berintegrasi dengan lancar dengan sistem kaunseling dan tempahan resort sedia ada. Jangkaan penampilan tetamu sangat tinggi — keadaan dan persembahan peralatan secara langsung mempengaruhi ulasan 5 bintang.
      features:
        - 'Armada berjenama premium: SUPs, kayak, bot pedal, dan tender kecil RIB'
        - 'Persembahan sedia tetamu: warna resort sepadan, jenama logo, paparan peralatan yang tersusun'
        - RIB mewah kecil untuk pemindahan tetamu VIP dengan kusyen dan warna tersuai
        - 'Infrastruktur keselamatan bersepadu: tali pelampung, stesen penyelamat, AED'
        - 'Pengurusan pendapatan: templat harga dinamik, latihan jualan tambahan, pembungkusan pakej'
    - title: Resort Pulau Peribadi
      subtitle: Pengangkutan tetamu sepanjang cuaca — sifar masa henti, kebolehpercayaan mutlak
      description: Resort pulau persendirian beroperasi di lokasi terpencil di mana bot adalah satu-satunya hubungan ke tanah besar. Pemindahan tetamu harian, penghantaran bekalan, dan evakuasi perubatan kecemasan bergantung pada satu kapal — sebarang masa henti secara langsung memberi kesan kepada pengalaman tetamu dan operasi resort. Pengendali ini memerlukan bot yang beroperasi dengan boleh dipercayai dalam semua keadaan cuaca, memerlukan penyelenggaraan minimum, dan mempunyai sistem sandaran untuk ketekalan yang kritikal. Bot juga mesti kelihatan cantik apabila tetamu tiba di pulau.
      features:
        - Konfigurasi RIB sepanjang cuaca dengan penutup sepenuhnya dan tiub berat
        - Dwi-enjin atau penyediaan enjin sandaran untuk operasi tanpa masa henti
        - Pembinaan gred komersial Hypalon untuk jangka hayat 5-8 tahun dalam perkhidmatan terpencil
        - Reka bentuk penyelenggaraan mudah dengan komponen yang boleh diakses untuk penyelenggaraan di lokasi
        - Penjenamaan resort tersuai dan upholsteri premium yang sepadan dengan estetika pulau
    - title: Resort Tepi Tasik & Eko
      subtitle: Pengalaman tetamu bersepadu dengan alam semula jadi
      description: Hartanah tepi tasik, eko-lodge, dan tempat percutian alam semula jadi menawarkan aktiviti air yang tenang dan berkesan rendah yang melengkapkan persekitaran semula jadi. Peralatan harus tidak bermotor jika boleh, mudah disimpan di rumah bot yang terhad ruang, dan senyap digunakan untuk mengekalkan pengalaman ambien untuk semua tetamu.
      features:
        - 'Kapal tidak bermotor: SUPs, kayak, kano, dan bot dayung'
        - Stesen pam elektrik senyap untuk inflasi apabila diperlukan oleh tetamu
        - Bahan mesra alam dan pembungkusan selaras dengan penjenamaan kelestarian
        - Rak storan dan sistem pengurusan rumah bot disertakan
    - title: Kelab Pantai
      subtitle: Pemindahan tetamu, hiburan, RIBs kecil mewah
      description: Kelab pantai beroperasi dalam persekitaran bertenaga tinggi dengan fokus visual di mana peralatan adalah sebahagian daripada suasana. Mereka memerlukan RIBs kecil mewah untuk pemindahan tetamu dari hotel atau dok berhampiran, dan mainan air untuk hiburan tetamu — menarik jet ski, gelongsor tiup, dan papan dayung. Armada mesti kelihatan bergaya, mudah dikendalikan, dan tahan penggunaan harian oleh tetamu dengan tahap kemahiran berbeza. Penyimpanan dan pelancaran cepat adalah kritikal semasa waktu puncak.
      features:
        - RIB mewah kompak (3.3-4.3m) untuk pemindahan tetamu dan perkhidmatan tender
        - 'Mainan air: tiup yang boleh ditarik, papan SUP, kayak untuk hiburan tetamu'
        - Warna dan penjenamaan tersuai sepadan dengan identiti visual kelab pantai
        - Sistem pelancaran dan pengambilan cepat untuk operasi pusingan tinggi
        - Pembinaan Hypalon yang tahan lama untuk pendedahan harian kepada air masin dan UV
    - title: Kelab Ahli Persendirian & Kelab Yacht
      subtitle: Pengangkutan pelabuhan, tender ahli, sukan air eksklusif
      description: Kelab persendirian di mana sukan air dan pengangkutan bot adalah manfaat ahli dan bukan pemacu pendapatan. Peralatan mesti memenuhi piawai estetik yang lebih tinggi, tersedia bila diperlukan untuk ahli, dan memerlukan penyeliaan kakitangan minimum. Kelab yacht marina memerlukan tender untuk pengangkutan di pelabuhan — memindahkan ahli antara dok, sauh, dan pantai. Penyimpanan dan penyelenggaraan harus tidak kelihatan oleh ahli.
      features:
        - Tender RIB mewah untuk pengangkutan pelabuhan dan perkhidmatan pemindahan ahli
        - 'Peralatan premium: dek EVA, warna ahli tersuai, upholsteri berjenama'
        - Sistem daftar keluar layan diri untuk akses ahli tanpa kakitangan
        - Penyimpanan luar musim dan program penyegaran tahunan
    - title: Hotel Fokus Pengembaraan & Aktiviti
      subtitle: Lawatan berpandu, SUP yoga, ekspedisi snorkeling, aktiviti berkumpulan
      description: Hartana yang meletakkan diri mereka sebagai destinasi pengembaraan — menawarkan lawatan berpandu, SUP yoga, kayuhan matahari terbenam, ekspedisi snorkeling, dan aktiviti berkumpulan. Armada perlu menyokong kedua-dua model sewaan bebas dan program berpandu, dengan peralatan yang boleh digunakan dengan lancar antara penggunaan sendiri tetamu dan lawatan yang dikendalikan oleh pengajar. Hartana ini memerlukan peralatan yang tahan lama untuk penggantian kerap, dengan pembersihan yang mudah antara kumpulan tetamu.
      features:
        - Armada pelbagai guna yang menyokong model sewaan + lawatan berpandu
        - Kayak tandem dan platform SUP yang sangat stabil untuk aktiviti berkumpulan
        - 'Peralatan pengajar: papan pengajar, kotak kering, komunikasi kalis air'
        - 'Putaran peralatan bermusim: armada musim panas → program penyimpanan musim sejuk'
        - Pembinaan tahan lama yang dinilai untuk penggunaan harian tetamu dengan penyelenggaraan minima
