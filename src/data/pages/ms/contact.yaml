hero_text:
  tagline: Hubungi
  title: BERHUBUNG
contact_form:
  id: form
  title: Hantar kami mesej
  subtitle: Untuk soalan mengenai pesanan, nasihat saiz atau sokongan produk, hubungi kami. Kami akan membalas dalam satu hari bekerja.
  email_to: info@paddleboardoverstock.com
  submit_button: Hantar Pertanyaan → Dapatkan Sebutharga
  success_message: Terima Kasih! Mesej anda telah sampai ke peti masuk kami. Kami akan membalas dalam satu hari bekerja.
  error_message: Terdapat masalah menghantar mesej anda. Sila cuba lagi atau emel kami secara langsung.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: sila selesaikan yang berikut'
  fields:
    - name: namaPertama
      label: Nama Pertama
      row: 1
    - name: namaAkhir
      label: Nama Akhir
      row: 1
    - name: namaSyarikat
      label: Nama Syarikat
      row: 2
    - name: address
      label: Alamat
      row: 3
    - name: zip
      label: Poskod / Kode Pos
      row: 4
    - name: country
      label: Negara
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mel
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: jumlahPesanan
      label: Anggaran Jumlah Pesanan
      row: 6
      type: select
      options:
        - value: ''
          label: Berapa banyak papan yang anda ingin beli?...
        - value: one
          label: Hanya satu papan
        - value: 2-4
          label: 2–4 papan
        - value: 5-plus
          label: 5 papan+ (untuk keluarga, kelab, atau sewaan)
    - name: customization
      label: Apa yang boleh kami bantu?
      row: 7
      type: select
      options:
        - value: ''
          label: Pilih topik...
        - value: none
          label: Soalan produk umum
        - value: sizing
          label: Bantuan memilih papan yang sesuai
        - value: order
          label: Pesanan, pembayaran atau penghantaran
        - value: warranty
          label: Sokongan jaminan atau pembaikan
    - name: minatProduk
      label: Kategori Produk yang Diminati
      row: 8
      type: select
      options:
        - value: ''
          label: Pilih kategori produk...
        - value: all
          label: Semua produk / Katalog penuh
        - value: sup
          label: SUP Papan / Papan Dayung
        - value: packages
          label: Pakej SUP lengkap
        - value: accessory
          label: Aksesori (pam, dayung, beg)
    - name: subject
      label: Subjek
      row: 9
    - name: message
      label: Mesej
      row: 10
      type: textarea
      rows: 6
