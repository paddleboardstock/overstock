overview_section:
  tagline: Market Overview
  title: The Mexican SUP Market
  paragraphs:
    - Mexico has two of the world's great beach tourism coastlines. The Caribbean side — Cancún, Playa del Carmen, Tulum, Cozumel — offers flat, warm, turquoise water that is practically made for stand-up paddle, while the Pacific side — Puerto Vallarta, Sayulita, Los Cabos — blends surf culture with protected bays ideal for lessons and rentals. Year-round tourism keeps demand steady, and a growing Mexican paddling community shops locally between visits.
    - The typical buyer here is a small beach business: a paddle school that sells boards to its students, a boutique hotel adding SUP to its guest experience, a surf shop broadening into flat water, or an online seller serving the domestic market. Orders run 5–20 boards, mixed between durable all-around models for lessons and rentals and a few premium editions for retail display.
  customer_types:
    - title: Caribbean Coast Operators
      description: Paddle schools and rental stands in Cancún, Tulum, and Playa del Carmen serving daily tourist demand.
    - title: Boutique Hotels
      description: Small hotels and guesthouses adding guest SUP programs with compact mixed fleets.
    - title: Online Sellers
      description: Mexican e-commerce sellers importing their first SUP stock for the domestic market.
shipping_section:
  title: Ship to Mexico
  paragraphs:
    - Orders ship from Weihai, China. Express air freight carries samples and 1–3 board orders quickly into Mexico City and the resort airports; consolidated sea freight serves 5–20 board wholesale orders through Mexico's Pacific and Gulf ports. Both options are quoted with estimated transit times for your destination.
    - We provide the commercial invoice and packing list your customs broker needs, with correct HS codes and declared values. Import duties and taxes are payable by the importer under Mexican rules.
  customs_note: Mexico's import regime for sports equipment is broker-driven — work with your agente aduanal to confirm current duty and tax treatment before ordering. We supply complete, consistent documentation for smooth clearance.
faq_section:
  title: Mexico FAQ
  items:
    - q: Can quotes and support be handled in Spanish?
      a: Yes — we work with Spanish-speaking buyers across Latin America. Ask in your inquiry and we will handle your quote and order in Spanish.
    - q: What does a first order for a Tulum or Cancún shop look like?
      a: "Most start with 5–10 boards: a base of beginner-friendly all-around models for the tourist market, plus one or two premium art editions for display and retail sale. Mixed models, one shipment, priced by total quantity."
    - q: How do boards reach Mexico?
      a: Express air for samples and urgent small orders; consolidated sea freight for wholesale quantities, quoted per port. Both are itemized in your quote with estimated transit times.
    - q: Who handles Mexican import duties?
      a: You do, as the importer, through your customs broker. We provide the commercial invoice and packing list with correct HS codes so your broker can clear the shipment predictably.
