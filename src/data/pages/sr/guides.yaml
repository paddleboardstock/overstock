hero:
  tagline: Vodiči
  title: Nova si u SUP?
  subtitle: Praktični vodiči koji vam pomažu da izaberete, koristite i uživate u napuhavajućoj opremi za vodene sportove.
size_guide:
  tagline: Veličina i specifikacije
  title: Pronađite pravu veličinu za vaše potrebe
  desc: Uporedite dimenzije proizvoda, kapacitete težine i preporučene namene. Bilo da vam treba touring SUP, kompaktni kajak ili komercijalni RIB — naš vodič za veličinu pomaže vam da izaberete pravi.
  link_label: Puni vodič za veličine sa specifikacijama proizvoda →
  link: /size-guide
  cards:
    - title: SUP Daske
      desc: Izaberite dužinu prema svojoj težini i nameni. Šire daske (32"+) nude veću stabilnost. Duže daske (11–12 ft) bolje prate putanju za turizam.
    - title: Kajaci
      desc: Jednostruki kajaci (9 ft) za solo putovanja i reke. Tandem kajaci (12 ft) za dva veslača ili jednog sa opremom. Uvek proverite kapacitet težine.
    - title: Čamci i RIBs
      desc: Izaberite dužinu prema broju putnika i upotrebi. Veći RIBs (4,5 m+) za otvoreno more i spasavanje. Manji čamci (2,7 m) kao pomoćni čamci i platforme za pecanje.
