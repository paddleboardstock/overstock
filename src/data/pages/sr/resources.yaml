hero_text:
  tagline: Resursi
  title: Dovnload Center & Vodiči za kupce
  subtitle: Pristupite katalozima proizvoda, OEM vodičima, kontrolnim listama kupaca i tehničkoj dokumentaciji koji će vam pomoći da donesete informisane odluke o nabavci.
features3_downloads:
  tagline: Preuzimanja
  title: Dokumentacija proizvoda<br />& Resursi za kupce
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 Marine katalog proizvoda
      description: Kompletan asortiman proizvoda, uključujući RIB čamce, čamce na naduvavanje, SUP daske, kajake i dodatnu opremu. Specifikacije, konfiguracije i opcije. PDF format.
      icon: tabler:file-text
    - title: OEM Vodič za proizvodnju
      description: 'Sve što trebate znati o OEM/ODM partnerstvima: pregled procesa, minimalne količine narudžbine, opcije prilagođavanja, kontrola kvaliteta i otprema.'
      icon: tabler:building-factory
    - title: RIB Vodič za kupce brodova
      description: 'Kako odabrati pravoRIB: trup materijali, cevi materijali, izbor motora, veličina razmatranja, i opcije konfiguracije za različite aplikacije.'
      icon: tabler:file-description
    - title: SUP Kontrolna lista dobavljača
      description: 'Ključna razmatranja pri izboru SUP proizvođača odbora: indikatori kvaliteta, zahtevi za sertifikaciju, MOQ razmatranja i šta treba tražiti u fabričkoj reviziji.'
      icon: tabler:clipboard-check
    - title: Naduvavanje Čamac Materijal Vodič
      description: 'PVC HypalonVs: Poređenje trajnosti, UV otpornosti, životnog veka, opcija popravke i razmatranja troškova za različite morske aplikacije.'
      icon: tabler:files
    - title: Custom Proizvodnja Kratak Šablon
      description: Preuzmite naš kratak predložak proizvoda. Popunite svoje zahteve i vratite nam ga za istu nedelju ponude i procenu izvodljivosti.
      icon: tabler:template
faqs:
  title: Često postavljana pitanja
  subtitle: Uobičajena pitanja o našim proizvodima, proizvodnom procesu i modelu partnerstva.
  columns: 2
  items:
    - title: Koja je minimalna količina porudžbine?
      description: MOQ Razlikuje se u zavisnosti od kategorije proizvoda.RIB Brodovi obično počinju od 10 jedinica po modelu.SUP ploče od 50 jedinica. Kontaktirajte naš prodajni tim za MOQ informacije specifične za proizvod.
      icon: tabler:help-circle
    - title: Mogu li dobiti uzorke pre naručivanja?
      description: Da.Paddle Board Overstock Obezbeđuje proizvodnju uzoraka za procenu pre masovne proizvodnje. Troškovi uzorka se mogu pregovarati i često se pripisuju prvom proizvodnom nalogu.
      icon: tabler:package
    - title: Koji uslovi plaćanja su dostupni?
      description: Standardni uslovi su 30% depozit sa porudžbinom, 70% pre isporuke. LK uslovi dostupni za kvalifikovane kupce. Kontaktirajte naš finansijski tim da razgovaraju o aranžmanima.
      icon: tabler:currency-dollar
    - title: Koliko dugo traje proizvodnja?
      description: 'Tipična vremena isporuke: RIB čamci 30-45 dana, SUP ploče 20-30 dana, čamci na naduvavanje 25-35 dana. Prilagođeni razvoj dodaje 15-30 dana za izradu prototipova.'
      icon: tabler:calendar-clock
    - title: Koje sertifikate nose vaši proizvodi?
      description: CE sertifikacija za tržišta EU, američka obalska straža odobrila proizvodnju, ISO sistem kvaliteta BSCI , usklađenost i REACH usklađenost materijala.
      icon: tabler:certificate
    - title: Da li nudite prilagođenu ambalažu i brendiranje?
      description: Da. Nudimo prilagođenu ambalažu sa vašim logotipom, bojama i identitetom brenda. MOQ za prilagođenu ambalažu zavisi od kategorije proizvoda.
      icon: tabler:color-swatch
cta:
  title: Treba vam pomoć u pronalaženju pravog resursa?
  subtitle: Kontaktirajte naš tim za personalizovanu pomoć u izboru proizvoda, OEM partnerstvima, ili tehničkim specifikacijama.
  actions:
    - variant: primary
      text: Kontaktirajte naš tim
      href: /contact
