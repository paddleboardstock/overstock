testimonial:
  content: Pokrenuo sam svoj SUP brend bez ikakvog iskustva u industriji. Tim Paddle Board Overstock me je vodio od izbora proizvoda do dizajna prilagođenog logotipa i pakovanja. Moj prvi kontejner je stigao za 11 nedelja, i rasprodao sam se za 3 meseca na Amazonu. Sada naručujem svoj treći kontejner.
  name: Michael Park
  title: Osnivač, Shoreline Paddle Co. — Kalifornija, SAD
content_segments:
  tagline: Profil Preduzetnika
  title: Pokretanje Brenda za Vodene Sportove<br />Po Tipu Preduzetnika
  subtitle: Različiti osnivači dolaze sa različitim snagama — stručnost u e-trgovini, industrijske veze, doseg sadržaja ili infrastruktura distribucije. Prilagođavamo OEM/ODM program lansiranja da odgovara vašoj početnoj poziciji i želji za rastom.
  items:
    - title: Amazon FBA & Prodavci E-trgovine
      subtitle: Brend kreatori vođeni podacima i brzim skaliranjem
      description: Iskusni online prodavci koji lansiraju proizvode za vodene sportove na Amazon, Walmart ili svoje Shopify prodavnice. Znate kako da optimizujete liste, upravljate PPC kampanjama i čitate kategorijske podatke — ali vam je potreban proizvodni partner koji razume brzinu e-trgovine, stope povraćaja i sezonske promene potražnje.
      features:
        - Pakovanje spremno za maloprodaju optimizovano za FBA dimenzijske limite
        - EAN/UPC generisanje barkodova i dokumentacija u skladu sa Amazon standardima
        - Niska MOQ (2–5 jedinica po RIB SKU, 5–10 po SUP) za testiranje potražnje pre skaliranja
        - Kombinovana konsolidacija kontejnera radi optimizacije po jedinici ukupnog troška
    - title: Fitnes & Influenceri životnog stila na otvorenom
      subtitle: Kreatori brendova sa fokusom na publiku
      description: Kreatori sadržaja, fitnes treneri i outdoor ličnosti sa angažovanom publikom spremnom da podrži brend životnog stila. Vi donosite zajednicu i priču brenda — mi se bavimo proizvodnjom, usklađenošću, pakovanjem i logistikom kako biste se vi mogli fokusirati na sadržaj i konverziju.
      features:
        - 'Brzo prilagođavanje brenda: 2-nedeljni ciklus uzoraka sa logoom + boja'
        - Ko-brendirane limitirane edicije i sezonska izdanja boja
        - Podrška za produkciju lifestyle fotografija i video sadržaja
        - 'Isporuka direktno potrošačima: fabrika → direktna isporuka kupcima'
    - title: Regionalni distributeri koji prelaze na direktnu prodaju potrošačima
      subtitle: B2B operateri koji pokreću sopstveni brend
      description: Uspostavljeni distributeri opreme za more ili na otvorenom koji žele da lansiraju svoj brend pored ili umesto preprodaje proizvoda drugih proizvođača. Već imate infrastrukturu skladišta, logističke veze i bazu kupaca — potrebna vam je fabrička partner koji može isporučiti kvalitet privatne etikete u velikoj meri.
      features:
        - Ekskluzivni dizajni proizvoda za vaše tržišno područje
        - Potpuna OEM izrada kalupa za vlasničke oblike i specifikacije
        - Lokalizovana dokumentacija o usklađenosti (CE, UKCA, USCG) za vašu regiju
        - 'Ko-brendirano pakovanje: distributerski brend + Paddle Board Overstock oznaka kvaliteta'
    - title: Prvi put osnivači brenda
      subtitle: Vodič za kreiranje brenda od početka do kraja
      description: Strastveni preduzetnici bez iskustva u industriji vodnih sportova koji žele da izgrade brend od nule. Treba vam partner koji će vas voditi kroz svaku fazu — od izbora proizvoda i imenovanja do dizajna pakovanja i logistike prve pošiljke — sa jasnim rokovima i transparentnim cenama.
      features:
        - Konsultantski izbor proizvoda iz 50+ provereno uspešnih osnovnih dizajna
        - 'Paket identiteta brenda: imenovanje, logo, paleta boja, dizajn pakovanja'
        - Vremenski okvir od 60–90 dana od koncepta do prve pošiljke
        - Posvećeni menadžer projekta za vlasnike brenda prvi put
