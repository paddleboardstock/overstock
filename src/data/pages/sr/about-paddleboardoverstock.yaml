    value: 12.000 m² (130.000 ft²) integrisan kampus u Zoni ekonomske razvijenosti Qingdao
  - label: Godišnji kapacitet
    value: 15.000 čamaca uključujući SUPs, kajake, čamce, RIBs i sigurnosnu opremu
  - label: R&D tim
    value: 25+ inženjera u oblastima dizajna proizvoda, nauke o materijalima i inženjeringa kvaliteta
  - label: Ključna oprema
    value: CNC stolovi za sečenje, RF dijalektrični zavarivači, vrelovazdušni zaptivači, digitalni printeri, kalupi od stakloplastike, uređaji za testiranje zadržavanja vazduha
  - label: Proizvodne linije
    value: '6 posvećenih linija: PVC sečenje, zavarivanje cevi, postavljanje trupova od stakloplastike, sklapanje SUP, sklapanje RIB, finalna kontrola kvaliteta'
  - label: Godišnji obim izvoza
    value: USD $8M+ izvezeno u 50+ zemalja u Evropi, Americi, Azijsko-pacifičkoj regiji i na Bliskom istoku
