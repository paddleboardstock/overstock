hero:
  tagline: O nama
  title: O {SITE}
  subtitle: Vertikalno integrisani proizvođač opreme za vodene sportove — od sirovog materijala do gotove čamce
intro:
  - 'Paddle Board Overstock je osnovan 2012. godine sa jednom jednostavnom misijom: dizajnirati i proizvoditi opremu za vodene sportove koja jednako dobro funkcioniše na vodi kao i u izveštaju o kvalitetu. Ono što je počelo kao fokusirana SUP radionica za daske razvilo se u integrisani proizvodni kompleks od 12.000 kvadratnih metara u Zoni ekonomske razvijenosti Qingdao, proizvodeći čamce na naduvavanje, RIBs, kajake, SUP daske, sigurnosnu opremu i dodatke za kupce u 50+ zemalja.'
  - Danas, Paddle Board Overstock posluje kao fabrička marka — dizajniramo, inženjerski oblikujemo, pravimo prototipe, proizvodimo i testiramo sve pod jednim krovom. Ova vertikalna integracija nam omogućava direktnu kontrolu nad izborom materijala, kvalitetom izrade i rokovima isporuke. Svaki čamac prave naši ljudi, na našoj opremi, po našim standardima.
  - Pružamo usluge rekreativnim korisnicima, komercijalnim operaterima, vladinim agencijama i partnerskim brendovima širom sveta. Naši OEM i ODM programi pomažu firmama da lansiraju svoje proizvode bez ulaganja u fabričku infrastrukturu. Bilo da vam je potreban jedan prototip ili kompletna proizvodna serija, naš tim vas vodi od koncepta do isporuke spremne za more.
