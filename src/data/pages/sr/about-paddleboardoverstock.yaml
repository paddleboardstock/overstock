values:
  - title: Kvalitet na prvom mestu
    desc: Svaka čamac koji napusti našu fabriku prolazi obavezno testiranje zadržavanja vazduha, odvajanja šavova i sistema pre isporuke.
  - title: Vertikalna integracija
    desc: Kontrolišemo svaki korak — od sečenja PVC do finalne montaže — eliminišući neefikasnost izvođača i osiguravajući konzistentan kvalitet.
  - title: Bezbednost kao standard
    desc: CE sertifikacija je osnov svega što pravimo. Naša 64 CE-sertifikovana modela ispunjavaju standarde bezbednosti EU za rekreativnu i komercijalnu upotrebu.
  - title: Partneri u centru pažnje
    desc: Izgrađujemo dugoročne odnose sa OEM, ODM i partnerima sa privatnom robnom markom kroz transparentnost, pouzdanost i zajednički rast.
services:
  - title: OEM Proizvodnja
    desc: Pravimo prema vašim specifikacijama. Podelite svoje crteže, a naš inženjerski tim se bavi prototipovanjem, alatima i proizvodnjom.
  - title: ODM Rešenja
    desc: Počnite od naših proverenih platformi. Prilagodite veličinu, boju, grafiku i pakovanje kako biste stvorili svoju jedinstvenu liniju proizvoda.
  - title: Privatna robna marka
    desc: Vaše ime brenda, vaš logo, vaše pakovanje. Proizvodi stižu spremni za prodaju sa potpunom integracijom brenda.
  - title: Prilagođeni brending
    desc: Štampa na palubi, grafika na trupu, nalepnice na tubusu i prilagođene etikete — dosledno prisustvo brenda na svakoj površini.
certifications:
  - name: CE Sertifikacija
    desc: Naši čamci i vodeni proizvodi su u skladu sa Direktivom EU o rekreativnim plovilima (2013/53/EU) i relevantnim harmonizovanim standardima.
    scope: Čamci i vodena plovila
  - name: null
    desc: Sistem upravljanja kvalitetom sertifikovan za dizajn, proizvodnju i distribuciju napuhavajućih plovila.
    scope: Cela fabrika
  - name: null
    desc: Napuhavajući čamci — zahtevi za bezbednost i performanse za ojačane i krute napuhavajuće čamce.
    scope: RIB & linije napuhujućih plovila
