content_customization:
  tagline: Šta se može prilagoditi
  title: RIB Prilagođavanje<br />Opcije
  subtitle: Svaki element RIB čamca može biti prilagođen vašoj upotrebi, tržištu i zahtevima brenda.
  items:
    - title: Trup i struktura
      description: Dužina trupa (2,5–8,5 m), materijal trupa (GRP stakloplastika ili aluminijum marine klase), boja trupa (gelcoat ili bojena), profil kila (deep-V, moderate-V, flat), tip krme (zatvorena krma sa konzolom ili bunar), i strukturno pojačanje za komercijalna opterećenja.
      icon: tabler:sailboat
    - title: Tuba i kragna
      description: Materijal tube (0,9–1,2 mm PVC ili 1,4–1,7 mm Hypalon/CSM), prečnik tube (40–55 cm), broj komora (3–7), tip ventila (Halkey-Roberts, Leafield D7, ili Boston), boja tube (standardna ili prilagođena), i konfiguracija konusa/rediometra kragne.
      icon: tabler:circle
    - title: Paluba i raspored konzole
      description: Središnja konzola, bočna konzola ili upravljanje kormilom. Raspored sedišta (jockey sedišta, klupe, bolster sedišta). Pokrivači palube (EVA pena teak-look, neklizajuća boja ili gola GRP). Montažne tačke za opremu, rukohvati i pozicije D-prstenova.
      icon: tabler:layout-dashboard
    - title: Elektrika i navigacija
      description: Navigaciona svetla (LED), sistem pumpi za pramac, upravljanje baterijom, ugradnja VHF radija, montaža GPS/chartplottera, USB portovi za punjenje i konfiguracija panela prekidača.
      icon: tabler:bolt
    - title: Brendiranje i grafika
      description: Grafika trupa i tube (sitotisak, prenos toplote, UV digitalni print), pozicija logotipa, prilagođene šeme boja, identifikacione oznake i prilagođena dokumentacija vlasnika sa vašim brendom.
      icon: tabler:palette
    - title: Bezbednost i usklađenost
      description: Kategorija dizajna (A/B/C/D prema RCD), sistem za gašenje požara, specifikacija sistema goriva (prenosivi tank, fiksni tank, ispod-palubni), i paket dokumentacije za usklađenost za vaše ciljno tržište.
      icon: tabler:shield
content_applications:
  tagline: Konfiguracije za upotrebu
  title: RIB Konfiguracije<br />Po upotrebi
  subtitle: Različite misije zahtevaju različite konfiguracije. Evo dokazanih postavki za najčešće RIB primene.
  items:
    - title: Spašavanje i patrola
      description: Deep-V trup, Hypalon tube, samo-ispusna paluba, bolster sedišta, rukohvati, navigaciona svetla i teški D-prstenovi. RCD Kategorija dizajna B ili C. Vatrootporan sistem goriva i elektrika komercijalnog kvaliteta.
      icon: tabler:lifebuoy
    - title: Pomoć pri ronjenju
      description: Široki trup, zadnja meračka ljestva, pozicije za stalke boce, dodatni D-prstenovi, montaža oznake za ronjenje, pojačana krma za dva izvanbrodska motora, i neklizajuće celo-palubno EVA pokrivanje.
      icon: tabler:mask
    - title: Turizam i komercijalna upotreba
      description: Raspored sa sertifikatom za putnike sa klupama, suncobran/Bimini, rukohvati, suva skladišta i sistem sa dve baterije. RCD Kategorija C. Dizajnirano za rad u rizortima i floti čartera.
      icon: tabler:beach
    - title: Ribolov
      description: Otvoreni raspored palube, pozicije držača štapova, rezervoar za živi mamac, montaža za fishfinder, montaža za trolling motor, pojačana krma i prenosivi sistem goriva. Opcije središnje ili bočne konzole.
      icon: tabler:fish
    - title: Tender za slobodno vreme i jahte
      description: Lagan trup, PVC cevi, udobno sedenje, teleskopski kormilo ili kompaktna konzola, tačke za podizanje za davit, i prenosivi rezervoar za gorivo.RCD Kategorija C ili D.
      icon: tabler:sailboat
    - title: Stručni Vorkboat
      description: Opcija aluminijumskog trupa, armatura za teške uslove rada, hidraulični upravljač, komercijalni razred električni, radarski luk i tačke integracije opreme specifične za misiju. Prilagođena usklađenost po projektu.
      icon: tabler:anchor
process_steps:
  title: KSNUMKS-Korak RIB OEM/ODM Proces razvoja
  subtitle: Od projektnog ukratkog do post-prodaje - definisan radni tok sa jasnim prekretnicama i rezultatima
  steps:
    - number: '01'
      title: Kratak pregled projekta i zahtevi
      description: Definišite ciljnu aplikaciju, veličinu trupa, materijal cevi, zahteve usklađenosti i potrebe brendiranja. Procenjujemo izvodljivost i potvrđujemo model saradnje (OEM/ODM/Semi-Custom / Full Custom).
      timeline: 3–5 dana
    - number: '02'
      title: Tehnički pregled i izvodljivost
      description: Inženjerski tim razmatra strukturnu izvodljivost, stabilnost i proračune plovnosti, put usklađenosti i dostupnost materijala. Identifikujemo postojeće kalupe ili prilagođene zahteve kalupa.
      timeline: 5–7 dana
    - number: '03'
      title: Predlog & Citat
      description: Primite detaljan predlog koji uključuje specifikacije, 3D renderings ili GA crteže, obim usklađenosti, vremensku liniju i jedinične cene na osnovu nivoa zapremine i MOQ.
      timeline: 5–7 dana
    - number: '04'
      title: Potvrda dizajna i uzorkovanje
      description: Odobrite konačni GA, raspored palube i konfiguraciju cevi. Proizvodimo predproizvodni uzorak sa bojama vašeg brenda, logotipom i određenim materijalima za vašu fizičku inspekciju.
      timeline: 15–20 dana
    - number: '05'
      title: Uzorak Odobrenje & KC protokol
      description: 'Pregledajte i odobrite uzorak. Definišite proizvodni KC protokol: test pritiska (1.25k / 24–48h), provere dimenzija i kontrolna lista dokumentacije o usklađenosti po trupu.'
      timeline: 3–5 dana
    - number: '06'
      title: Masovna proizvodnja i kontrola kvaliteta
      description: Puna proizvodnja sa kontrolnom listom kontrole kvaliteta od 100 tačaka po jedinici. Inspekcije u procesu, ispitivanje pritiska i sledljivost na serijskom nivou. CE/ISO Dokumentacija pripremljena paralelno.
      timeline: 30–45 dana
    - number: '07'
      title: Pakovanje, Dostava i nakon prodaje
      description: Prilagođena ambalaža (standardna, spremna za maloprodaju ili paletizovana), izvozna dokumentacija, utovar kontejnera i logistika. Uključeni su kompleti rezervnih delova i dokumentacija o održavanju.
      timeline: 7–14 dana
certifications:
  title: Usaglašenost i sertifikati za RIB brodove
  subtitle: RIB Svaka prilagođena narudžba isporučuje se sa dokumentacijom o usklađenosti specifičnom za model
  items:
    - name: CE 2013/53/EU
      description: RCD usklađenost po modelu i kategoriji dizajna — DoC, ploča graditelja, uputstvo za vlasnika uključeno
      badge: CE
    - name: ISO 9001:2015
      description: Sistem menadžmenta kvalitetom sertifikovan SGS pokrivanjem dizajna, proizvodnje i distribucije
      badge: ISO
    - name: EN ISO 6185
      description: Standard konstrukcije čamca na naduvavanje — stabilnost, plovnost i oporavak čoveka u moru
      badge: 6185
    - name: EN ISO 14945
      description: Builder's plate standard — trajno označena identifikacija i informacije o kapacitetu
      badge: 14945
    - name: BSCI
      description: Revizija socijalne usklađenosti za etičku proizvodnju — zahtevaju trgovci u EU
      badge: BSCI
    - name: REACH
      description: Usklađenost EU sa hemijskom bezbednošću zaPVC, Hypalonlepkove i premaze
      badge: REACH
content_service_modules:
  tagline: Servisni moduli
  title: / OEMODM Servis<br />Moduli
  subtitle: Svaki projekat kombinuje prave servisne module. Nije svakom projektu potreban svaki modul - mi obuhvatimo samo ono što vaš projekat zahteva.
  items:
    - title: Inženjering pregled i izvodljivost
      description: 'Procena platforme trupa, provera strukturne izvodljivosti, verifikacija stabilnosti i plovnosti, identifikacija putanje usklađenosti i potvrda dostupnosti materijala. Izlaz: izveštaj o izvodljivosti sa preporukom go/no-go.'
      icon: tabler:math-function
    - title: Dizajn i konfiguracija
      description: 'GA crtež, paluba raspored, konfiguracija cevi, konzola i mesta za sedenje, oprema montaža plan, i izbor boja / materijala. Izlaz: odobren GA i konfiguracija specifikacija.'
      icon: tabler:ruler
    - title: Uzorak i prototip
      description: Predproizvodni uzorak sa odobrenim bojama, logotipom i određenim materijalima za fizičku inspekciju. Uključuje protokol za odobravanje uzorka, kontrolnu listu inspekcije i proces zahteva za promenu.
      icon: tabler:3d-cube-sphere
    - title: Proizvodnja i kontrola kvaliteta
      description: Masovna proizvodnja sa kontrolnom listom kontrole kvaliteta od 100 tačaka po jedinici, inspekcije u procesu, ispitivanje pritiska (1.25k / 24-48h) i sledljivost na serijskom nivou. CE/ISO Dokumentacija pripremljena paralelno.
      icon: tabler:clipboard-check
    - title: Brendiranje i pakovanje
      description: Aplikacija logotipa privatne etikete, prilagođena grafika trupa i cevi, brendirana vlasnička dokumentacija, maloprodajna ili paletizovana ambalaža i priprema kompleta rezervnih delova.
      icon: tabler:palette
    - title: Izvoz i dokumentacija
      description: Izvozno pakovanje, plan utovara kontejnera, FOB/CIF/DDP dokumentacija, usklađenost papirologija po odredišnom tržištu i protokol komunikacije nakon isporuke.
      icon: tabler:world
content_risk_control:
  tagline: Kontrola rizika i isporuke
  title: Rizik projekta i<br />Upravljanje isporukom
  subtitle: Profesionalci OEM/ODM kupci brinu o kontroli rizika koliko i o kvalitetu proizvoda. Evo kako to upravljamo.
  items:
    - title: Obim i definicija vlasništva
      description: 'Pre nego što počne razvoj, definišemo u pisanoj formi: obim prilagođavanja, zahteve za alate, kriterijume za odobravanje uzoraka, vlasništvo nad crtežima i kalupima i odgovornosti za dokumentaciju. Nema dvosmislenosti o tome ko je vlasnik šta.'
      icon: tabler:file-text
    - title: Proces kontrole promena
      description: Sve promene specifikacija nakon potvrde dizajna prate dokumentovani proces zahteva za promenu sa procenom uticaja (troškovi, vremenski okvir, usklađenost). Nema neodobrenih modifikacija ulazi u proizvodnju.
      icon: tabler:arrows-diff
    - title: Garancija konzistentnosti serije
      description: 50. jedinica odgovara 1. odobrenom uzorku. Odobrene specifikacije su zamrznute, parametri materijala i procesa su zaključani, a kontrolne tačke u procesu verifikuju konzistentnost tokom proizvodne serije.
      icon: tabler:repeat
    - title: Transparentnost isporuke i kapaciteta
      description: Olovna vremena se navode na osnovu stvarnog proizvodnog kapaciteta, nivoa zaliha materijala i trenutnog opterećenja narudžbe - a ne aspiracijskih ciljeva. Raspored proizvodnje sa datumima prekretnica po narudžbi.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Često postavljana pitanja
  questions:
    - q: Koja je razlika između OEM i ODM za RIB brodove?
      a: 'OEM (Proizvodnja originalne opreme): pružate detaljne specifikacije i mi gradimo vaš dizajn.ODM (Original Design Manufacturing): izaberete dokazanu Aquafarer RIB platformu i mi je prilagodimo željenim karakteristikama i brendiranju.ODM je brži i jeftiniji;OEM nudi maksimalnu kontrolu dizajna.'
    - q: Mogu li prilagoditi RIB oblik i veličinu trupa?
      a: Da. Nudimo polu-prilagođene modifikacije postojećih kalupa za trup (različiti rasporedi palube, konfiguracije cevi) i potpuni razvoj trupa sa novim CNCkalupima. Polu-prilagođeni projekti mogu početi od 2-5 jedinica; puni običaj obično zahteva veće obaveze.
    - q: Šta cevi materijali su dostupni za običajRIBs?
      a: Nudimo 0.9-1.2 mm PVC za rekreativnu i laku komercijalnu upotrebu, i 1.4-1.7 mm Hypalon/CSM za profesionalne, spasilačke i komercijalne aplikacije koje zahtevaju UV superiornu i otpornost na ozon (10-15 godina životni vek vs. 5-8 godina zaPVC).
    - q: Možete li konfigurisati RIBs za određene aplikacije kao što su spašavanje, ronjenje ili ribolov?
      a: Da. Održavamo dokazane konfiguracijske šablone za spašavanje / patrolu, ronilačku podršku, turizam / čarter, ribolov, tender za jahte i profesionalne aplikacije za radne čamce. Svaki šablon uključuje preporučeni tip trupa, materijal cevi, raspored palube i opremu - koju zatim prilagođavamo vašim tačnim zahtevima.
    - q: Koje informacije su vam potrebne za RIB OEMODM / citat?
      a: Ciljna primena, željena dužina trupa, cevi materijal preferencija (PVCiliHypalon), približna količina i raspored isporuke, zahtevi usklađenosti ciljnog tržišta, i sve referentne proizvode ili specifikacije. Što više detalja pružite, brže i preciznije naš citat.
    - q: Šta je MOQ za RIB prilagođene brodove?
      a: Za postojeće kalupe trupa sa standardnim modifikacijama, MOQ počinje od 2-5 jedinica po dizajnu. Za prilagođene kalupe i potpuni razvoj po narudžbi, MOQ zavisi od složenosti projekta - obično 10-20 jedinica za polu-prilagođene i 30+ za punu prilagođenu sa novim alatima.
    - q: Ko je vlasnik prilagođenih kalupa i crteža?
      a: Kalupi razvijeni korišćenjem Aquafarer osnovnih dizajna ostaju Aquafarer vlasništvo. Potpuno prilagođeni kalupi naručeni i plaćeni od strane klijenta mogu se dodeliti vlasništvu klijenta po uslovima ugovora. Svi uslovi vlasništva kalupa su dokumentovani pre početka projekta.
    - q: Kako su RIBs prilagođeni upakovane za izvoz?
      a: 'Standard: prilagođena kolevka + za utovar kontejnera. Premium: pakovanje spremno za maloprodaju, vakuumsko pakovanje ili paletizovano. Nudimo FOB Kingdao, CIFi DDP isporuku. Kompletna izvozna dokumentacija i carinjenje uključeni.'
