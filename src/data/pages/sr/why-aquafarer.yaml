reasons:
  tagline: Aquafarer Razlika
  title: Šta nas izdvaja
  isBeforeContent: false
  columns: 3
  items:
    - title: Prava proizvodnja, ne trgovina
      description: Posedujemo i upravljamo fabrikom od 12.000 m². Kada sarađujete sa Aquafarer, radite direktno sa ljudima koji projektuju, inženjerski osmišljavaju i izrađuju vaše proizvode — bez posrednika.
      icon: tabler:building-factory
    - title: Pristup vođen inženjeringom
      description: Naš proces dizajna počinje od slučaja upotrebe, a ne od kategorije proizvoda. Optimizujemo oblik trupa, izbor materijala i konfiguraciju za način na koji će se oprema zapravo koristiti u komercijalnim okruženjima.
      icon: tabler:engine
    - title: Sertifikovani kvalitet
      description: CE sertifikovan, ISO sistem kvaliteta, BSCI u skladu, REACH u skladu, USCG odobreni prsluci za spavanje Tip III/V; svi proizvodi ispunjavaju važeće međunarodne standarde.
      icon: tabler:certificate
    - title: Fleksibilan OEM/ODM
      description: Boje tube, raspored konzole, brendiranje, pakovanje — prilagođavamo prema vašim specifikacijama. Nema pritiska minimalne porudžbine. Počnite sa prototipom, skalirajte sa poverenjem.
      icon: tabler:adjustments
    - title: Globalna logistika
      description: Skladište u SAD-u u Kaliforniji, direktna isporuka iz Čingdaoa, vazdušni transport za hitne narudžbine. Mi se bavimo carinskom papirologijom i dokumentacijom širom sveta.
      icon: tabler:truck-delivery
    - title: Doživotna podrška
      description: Podržavamo brodove koje smo napravili pre 20 godina. Originalni rezervni delovi, tehnički saveti, uputstva za popravku — naš tim je dostupan kada vam zatreba, gde god da se nalazite.
      icon: tabler:lifebuoy
testimonials:
  tagline: Poverenje brendova širom sveta
  title: Šta naši partneri kažu
  items:
    - content: Saradili smo sa nekoliko proizvođača u Kini, ali Aquafarer se izdvaja po podršci inženjeringa i doslednom kvalitetu. Oni tretiraju naš brend kao svoj sopstveni.
      name: — OEM Partner, evropski brend vodenih sportova
    - content: Njihovi Hypalon RIBs su u upotrebi u našoj floti više od 5 godina. Minimalno održavanje, odlična otpornost UV. Petogodišnja garancija na tubuse nam uliva poverenje.
      name: — Operater flote, Grupa odmarališta na Bliskom Istoku
    - content: Aquafarer tim nam je pomogao da razvijemo prilagođeni SUP dizajn daske od koncepta do proizvodnje za 90 dana. Kvalitet je premašio naša očekivanja.
      name: — Distributer, australijski vodeni sportovi
    - content: Kao vlasnik malog preduzeća, brinuo sam se oko MOQs. Aquafarer je radio u okviru mog budžeta i pomogao mi da lansiram svoj brend sa samo 50 dasaka. Sada naručujem 500.
      name: — Osnivač brenda, US SUP Rental Company
cta:
  title: Spremni da razvijete svoje vodeno poslovanje?
  subtitle: Kontaktirajte naš tim za besplatnu konsultaciju. Bez obaveza — samo iskreni saveti o opremi i proizvodnji.
  actions:
    - variant: primary
      text: Razgovarajte sa našim timom
      href: /contact
    - text: Preuzmite katalog proizvoda
