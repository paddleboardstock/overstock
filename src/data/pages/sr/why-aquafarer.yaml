hero:
  tagline: Zašto Aquafarer
  title: Izgrađeno drugačije. Izgrađeno za biznis.<br />Partner iza vodenih avantura širom sveta
  subtitle: Ne samo proizvođač — poslovni partner koji dizajnira, projektuje i isporučuje opremu komercijalnog kvaliteta za klubove, odmarališta, operatere iznajmljivanja i nove water brendove.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer proizvodni kvalitet i stručnost
pillars:
  tagline: Tri stuba partnerstva
  title: Zašto svetski water biznisi biraju Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Dizajnirano za komercijalnu upotrebu
      description: Naša oprema je dizajnirana za dnevni zakup, a ne za vikend rekreaciju. Komercijalni PVC, ojačani drop-stitch jezgra, UV-stabilne Hypalon opcije i testirani hardver u terenskim uslovima znače manje održavanja, duži vek trajanja i veći ROI za vašu operaciju.
      icon: tabler:building-factory
      callToAction:
        text: Pogledajte liniju komercijalnih proizvoda
        href: /products
    - title: Od ideje do tržišta
      description: 'Pokrenite svoj brend vodnih sportova za 90 dana. Vodimo vas kroz svaki korak: validacija koncepta, izbor proizvoda, prototip, proizvodnja, dizajn pakovanja i globalna dostava. Nema pritiska minimuma porudžbine — počnite sa malim, skalirajte sa poverenjem.'
      icon: tabler:rocket
      callToAction:
        text: Započni svoje putovanje brenda
        href: /oem-odm-blueprint
    - title: Izgrađeno za globalne uslove
      description: 'Proizvodi optimizovani za svaki klimatski uslov: formulacije za hladnu vodu PVC za Evropu, materijali otporni na UV za Bliski istok i Australiju, tretmani protiv vlage za jugoistočnu Aziju. Svaka pošiljka je kalibrisna prema okruženju svoje destinacije.'
      icon: tabler:world
