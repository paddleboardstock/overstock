hero:
  tagline: Tehnički crteži i CAD
  title: RIB i čamac na naduvavanje<br />Preuzimanja tehničkih crteža i CAD-a
  subtitle: Crteži opšteg rasporeda (GA) na nivou planiranja, listovi dimenzija i rasporedi palube za evaluaciju projekta i specifikaciju. Pristupite tehničkim crtežima na odgovarajućem nivou — od javnih PDF-ova do fajlova STEP na nivou projekta.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB tehnički crteži čamaca i CAD preuzimanja
direct_answer: Paddle Board Overstock pruža tehničke crteže na nivou nabavke za RIB čamce i naduvane vodene letelice — uključujući PDF-ove opšteg rasporeda (GA), listove dimenzija i crteže rasporeda palube. Formati sa višim detaljima (DXF/DWG, STEP/IGES) dostupni su na kvalifikovano upit ili apliciranje za projekat.
stats:
  - value: GA PDF
    label: Besplatno preuzimanje
    detail: Opšti raspored po modelu
  - value: DXF/DWG
