content_tiers:
  tagline: Nivoi preuzimanja
  title: Četiri nivoa pristupa<br />— Pravi detalj za pravu fazu
  subtitle: Pružamo crteže na nivou nabavke, ne fajlove na nivou proizvodnje. Svaki nivo odgovara drugačjoj fazi projekta.
  items:
    - title: Nivo 1 — Javni PDF
      description: Opšti raspored (GA), crtež dimenzija u 4 pogleda i raspored palube u PDF formatu. Dostupno za besplatno preuzimanje. Dovoljno za planiranje projekta, raspodelu prostora i preliminarni pregled specifikacija.
      icon: tabler:file-type-pdf
    - title: Nivo 2 — Lakši DXF/DWG
      description: 2D CAD fajlovi (DXF ili DWG) za integraciju rasporeda na nivou planiranja. Zahteva kratak formular za kvalifikaciju (naziv kompanije, tip projekta, predviđena upotreba). Ne uključuje strukturne ili proizvodne podatke.
      icon: tabler:file-code
    - title: Nivo 3 — Apliciranje za projekat STEP/IGES
      description: 3D model fajlovi (STEP ili IGES) za integraciju sistema, dizajn opreme ili koordinaciju brodogradnje. Zahteva apliciranje za projekat sa obimom, vremenskim okvirom i namerom kupovine. Podložno odobravanju.
      icon: tabler:cube
    - title: Nivo 4 — NDA Inženjering
      description: Strukturni crteži trupa, rasporedi laminacije, proširenja za sečenje cevi i podaci o kalupima. Dostupno samo pod NDA sa potvrđenim narudžbinama. Ovo su fajlovi na nivou proizvodnje — nisu za javnu distribuciju.
      icon: tabler:lock
content_included:
  tagline: Šta Je Uključeno
  title: Sadržaj Crteža<br />Po Modelu
  subtitle: Svaki model ima standardni paket crteža koji pokriva osnovne informacije za planiranje za B2B kupce i projektne inženjere.
  items:
    - title: Generalni Raspored (GA)
      description: Bočni profil, pogled odozgo i preseci prikazuju oblik trupa, poziciju tubusa, lokaciju konzole, sedišta, sistem goriva i ključne dimenzije (LOA, širina, prečnik tubusa, ugao deadrise). Status revizije i autorska prava navedeni su u naslovnom bloku.
      icon: tabler:layout
    - title: Crtež Dimenzija u 4 Pogleda
      description: Bočni, prednji, zadnji i pogled odozgo sa ukupnim dimenzijama za planiranje transporta (visina na prikolici, širina za kontejner, težina za podizanje). Uključene operativne i transportne konfiguracije.
      icon: tabler:ruler-2
    - title: Raspored Palube i Plan Opreme
      description: Pogled palube odozgo koji prikazuje bazu konzole, pozicije sedišta, lokacije D-prstenova, pozicije navigacionih svetala, pristup pumpi za izbacivanje vode, odeljak za baterije/gorivo i montiranje opreme. Ograničena preciznost na vlasničkim interfejsima.
      icon: tabler:map
    - title: Crtež Transporta i Pakovanja
      description: Plan utovara u kontejner, dimenzije kolica, raspodela težine i pozicije tačaka za podizanje za planiranje logistike. Uključuje standardne i prilagođene opcije pakovanja.
      icon: tabler:truck
content_protection:
  tagline: Zaštita IP
  title: Šta Ne Delimo<br />& Zašto
  subtitle: Zaštita našeg inženjerskog IP omogućava nam da nastavimo sa ulaganjima u R&D, dok istovremeno pružamo sve što kupci trebaju za planiranje projekata.
  items:
    - title: Podaci o Jezgru Kalupa Trupa
      description: Plug i geometrija kalupa, CNC putanje alata i šabloni laminacije su vlasnički proizvodni resursi. Nisu deljeni na bilo kom pristupnom nivou van potvrđenih NDA ugovora.
      icon: tabler:ban
    - title: Proširenja Za Sečenje Tubusa
      description: Fajlovi za sečenje u ravnoj formi za tkaninu tubusa su podatak za proizvodnju. Dostupan samo pod NDA sa potvrđenim narudžbinama i deljen samo sa ugovornom stranom.
      icon: tabler:ban
    - title: Strukturne Kalkulacije
      description: Detaljna analiza napona, rezultati FEA i rasporedi lamina su dokumenti osetljivi na usklađenost, koji se dele samo sa obaveštenim telima i klijentima vezanim za NDA tokom procesa procene usklađenosti.
      icon: tabler:ban
    - title: Provera Konkurencije
      description: Zadržavamo pravo da odbijemo zahteve za pristup CAD-u koji izgledaju kao da dolaze od konkurenata, studenata bez konteksta projekta ili strana bez legitimne namere nabavke.
      icon: tabler:shield
content_models:
  tagline: Dostupni Modeli
  title: Tehnički Crtež<br />Dostupnost po Modelu
  subtitle: GA PDF preuzimanja su dostupna za naše glavne RIB i modele gumenih čamaca. Kontaktirajte nas za crteže specifičnih modela koji nisu navedeni.
  items:
    - title: AF580 RIB
      description: 5.8 m RIB, GRP trup dubokog V oblika, Hypalon ili PVC tubusi, centralna konzola. GA, dimenzije, raspored palube i plan transporta dostupni. Kategorija dizajna C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP trup srednje V forme, Hypalon ili PVC tube, bočna ili centralna konzola. GA i dimenzije dostupne. Kategorija dizajna C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP trup, PVC tube, kormilo ili konzola. GA i dimenzije dostupne. Kategorija dizajna C/D.
      icon: tabler:sailboat
    - title: AF380 Plutajuća Čamac
      description: 3,8 m gumeni čamac, aluminijumski pod, PVC tube. GA i dimenzije pakovanja dostupne. Usklađen sa EN ISO 6185.
      icon: tabler:sailboat
    - title: AF320 Plutajuća Čamac
      description: 3,2 m gumeni čamac, pod od vazdušnog patosa, PVC tube. GA i dimenzije pakovanja dostupne. Usklađen sa EN ISO 6185.
      icon: tabler:sailboat
