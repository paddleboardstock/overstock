content_version_control:
  tagline: Kontrola verzija
  title: Verzija crteža<br />Upravljanje
  subtitle: Svaki crtež prati kontrolisani sistem revizije. Uvek proverite da li imate aktuelnu reviziju pre korišćenja crteža za planiranje projekta.
  items:
    - title: Praćenje revizija
      description: Svaki crtež nosi kod revizije (Rev-A, Rev-B, Rev-C), datum izdavanja, datum poslednje provere, primenjeni model/konfiguraciju, jedinice, veličinu fajla i format. Samo "Trenutna" revizija je dostupna za preuzimanje.
      icon: tabler:git-branch
    - title: Obaveštenje o statusu crteža
      description: Svi javni crteži su označeni kao "Samo preliminarni raspored — nije za izgradnju, sertifikaciju ili proizvodnju. Dimenzije podležu konačnoj specifikaciji i potvrdi narudžbine." Ovo štiti obe strane od pogrešne upotrebe.
      icon: tabler:alert-circle
    - title: Obaveštenja o ažuriranju
      description: Kada se specifikacija modela promeni, revizija crteža se ažurira i prethodne verzije se označavaju kao "Zamenjeno". Registrovani korisnici koji su preuzeli DXF/DWG pakete obaveštavaju se o značajnim ažuriranjima putem e-pošte.
      icon: tabler:bell
faq:
  title: Tehnički crteži — Često postavljana pitanja
  questions:
    - q: Da li su GA PDF-ovi zaista besplatni?
      a: Da. PDF-ovi generalnog rasporeda za naše glavne modele su besplatni — popunite kratak kvalifikacioni obrazac ispod i link za preuzimanje stiže putem e-pošte u roku od 1 radnog dana. Sadrže informacije na nivou planiranja dovoljne za procenu projekta, raspodelu prostora i preliminarnu reviziju specifikacija.
    - q: Kako da pristupim DXF/DWG fajlovima?
      a: Popunite kratak kvalifikacioni obrazac na stranici za preuzimanje sa imenom vaše kompanije, tipom projekta i planiranom upotrebom. Odobreni zahtevi dobijaju link za preuzimanje putem e-pošte u roku od 1 radnog dana.
    - q: Mogu li dobiti STEP/IGES 3D modele?
      a: STEP ili IGES 3D fajlovi su dostupni kroz naš proces prijave za projekat. Navedite obim projekta, zahteve za integraciju, rokove i nameru kupovine. Podložno odobrenju — obično u roku od 3-5 radnih dana.
    - q: Zašto ograničavate pristup fajlovima sa višim nivoom detalja?
      a: Geometrija trupa, podaci o kalupima i strukturne kalkulacije predstavljaju višegodišnja ulaganja u istraživanje i razvoj i predstavljaju osnovnu intelektualnu svojinu u proizvodnji. Obezbeđujemo sve što je potrebno za planiranje nabavke i integraciju projekta, dok štitimo našu sposobnost da nastavimo ulaganja u razvoj novih proizvoda.
    - q: Da li crteži uključuju proizvodne detalje?
      a: Ne. Javni i kratki crteži sadrže informacije na nivou nabavke za planiranje i specifikaciju. Detalji na nivou proizvodnje (rasporedi laminacije, putevi alata, ekspanzije za sečenje) dele se samo pod NDA uz potvrđene narudžbine.
    - q: Da li su crteži dostupni za prilagođene ili polu-prilagođene RIB konfiguracije?
      a: Crteži za prilagođene projekte se pripremaju kao deo procesa razvoja OEM/ODM. Ako procenjujete prilagođeni RIB projekat, kontaktirajte nas sa vašim zahtevima i obezbedićemo GA crteže specifične za projekat kao deo ponude.
