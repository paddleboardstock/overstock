hero:
  tagline: Centar Autoriteta
  title: Zašto Paddle Board Overstock?<br />Poverenje izgrađeno tokom decenije
  subtitle: Svaka čamac koji pravimo nosi težinu 10+ godina inženjeringa u oblasti pomorstva, sertifikovanih sistema kvaliteta i hiljada uspešnih operacija širom sveta. Zbog toga profesionalci u industriji biraju Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock proizvodna pomorska fabrika i inženjerski tim
