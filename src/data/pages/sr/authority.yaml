features3_brand:
  tagline: Ko smo mi
  title: Osnova brenda<br />& Nasleđe
  subtitle: Priča, stručnost i globalni doseg koji definišu Paddle Board Overstock kao pouzdanog proizvođača pomorske opreme.
  isBeforeContent: false
  columns: 3
  items:
    - title: O Paddle Board Overstock
      description: Osnovan 2012. u Qingdao, Kina. Od obalske radionice do objekta od 12.000 m² — kompletna Paddle Board Overstock priča.
      icon: tabler:building-factory
      link: /about
    - title: Priča o brendu
      description: Kako je tim pomorskih inženjera krenuo da učini profesionalna naduvavanja plovila dostupnim širom sveta.
      icon: tabler:book
      link: /brand-story
    - title: Stručnost u pomorskoj industriji
      description: Duboka nauka o materijalima, precizna proizvodnja i testiranje u realnom svetu — decenije pomorskog inženjeringa u svakom trupu.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globalna prisutnost
      description: Serviramo 50+ zemalja na svim kontinentima. Regionalna stručnost za lokalne regulatorne zahteve i tržišne preferencije.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Zašto Paddle Board Overstock
      description: Ono što nas izdvaja — kvalitet, prilagođavanje, direktne cene iz fabrike i potpuna podrška za komercijalne operatore.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Naš tim
      description: Upoznajte rukovodstvo — pomorske inženjere, naučnike materijala i stručnjake za proizvodnju koji vode Paddle Board Overstock napred.
      icon: tabler:users
      link: /brand/team
    - title: Inženjerski tim
      description: 78+ godina kombinovanih istraživanja i razvoja, 40+ platformi, 12 sertifikata, 1200+ OEM projekata. Tehnički tim iza svakog proizvoda.
      icon: tabler:engine
      link: /engineering-team
    - title: Centar za istraživanje i razvoj
      description: Projektovanje trupa, RF zavarivanje, PVC laboratorija, prototipovanje, ispitni rezervoar i laboratorija za kontrolu kvaliteta — naša kompletna istraživačko-razvojna jedinica.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Poverenje i Kvalitet
  title: Sertifikati, Kvalitet<br />i Dokazi
  subtitle: Nezavisne sertifikacije, rigorozna ispitivanja i stvarni dokazi koji pokazuju našu posvećenost kvalitetu.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifikati
      description: CE, ISO 9001, UKCA, BSCI, REACH — kompletna dokumentacija o sertifikaciji i usklađenosti za globalna tržišta.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalitet i Ispitivanje
      description: Svaki proizvod se ispituje na pritisak pre isporuke. Čvrstoća šava, otpor UV, plovnost — verifikovani u svakoj fazi.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dokazi i Potvrde
      description: Rezultati testova, fotografije prilikom postavljanja, izveštaji nezavisnih inspekcija i studije slučaja koje potvrđuju Paddle Board Overstock kvalitet.
      icon: tabler:file-check
      link: /evidence
    - title: Graf Znanja
      description: Istražite Paddle Board Overstock graf entiteta — proizvodi, tehnologije, sertifikati i odnosi u povezanoj bazi znanja.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderstvo
  title: Upoznajte Tim<br />Iza Paddle Board Overstock
  subtitle: Stručnost u industriji koja obuhvata pomorsko inženjerstvo, nauku o materijalima, upravljanje kvalitetom i globalnu B2B trgovinu.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Osnivač i CEO
      description: 15+ godina u proizvodnji plovila. Ranije je vodio R&D u velikom kineskom proizvođaču čamaca. Poseduje više patenata u dizajnu napuhanih čamaca.
      icon: tabler:crown
    - title: Zhang Wei — Glavni inženjer
      description: 20+ godina u PVC/Hypalon izradi i dizajnu trupova dubokog V. Bivši tehnički direktor u evropskoj firmi za pomorsko inženjerstvo.
      icon: tabler:engine
    - title: Chen Ming — Šef R&D
      description: Doktorat iz Nauke o Materijalima. Specijalista za drop-stitch tehnologiju i visokofrekventno zavarivanje. 10+ godina u tekstilnim kompozitima.
      icon: tabler:flask
    - title: Liu Qiang — Direktor proizvodnje
      description: 18+ godina u lean proizvodnji. Six Sigma Crni pojas. Implementirao ISO 9001 sisteme kvaliteta na svim proizvodnim linijama.
      icon: tabler:settings
    - title: Wang Fang — Menadžer kvaliteta
      description: 12+ godina u pomorskoj kontroli kvaliteta. Sertifikovani CE i ISO auditor. Nadgleda ispitivanja svake proizvodne serije.
      icon: tabler:shield-check
    - title: Helen Lee — Direktor prodaje
      description: 15+ godina u međunarodnoj B2B trgovini. Upravljala OEM/ODM partnerstvima u 30+ zemalja. Tečno govori 4 jezika.
      icon: tabler:briefcase
