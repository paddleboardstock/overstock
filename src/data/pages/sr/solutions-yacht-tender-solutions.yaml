content_challenge:
  tagline: Izazov
  title: Gliseri za Jahte Zahtevaju<br />Performanse & Prikaz
  subtitle: Gliser za jahtu je više od čamca — on je produžetak matične jahte i izjava o kvalitetu.
  paragraphs:
    - Vlasnici jahti i kapetani trebaju glisere koji dobro rade, zauzimaju malo prostora i lepo izgledaju. Gliser treba da dopunjuje estetiku jahte dok pruža pouzdan prevoz za goste i posadu.
    - '**Skladištenje je ključno** — Gliser mora da stane na palubu, u garažu ili na davite. Težina je važna za sisteme za lansiranje i povratak na brod. Aquafarer RIBs nude odličan odnos snage i težine sa kompaktno specijalizovanim profilima skladištenja.'
    - '**Očekivanja performansi su visoka** — Gosti očekuju glatku i suvu vožnju prilikom trasferovanja na kopno. Opcije motora moraju da balansiraju brzinu, domet i nivo buke za premium iskustvo. Za čarter operacije, gliser se koristi svakodnevno i mora izdržati čestu upotrebu.'
    - '**Izgled je važan** — Gliser koji ne odgovara ili je istrošen narušava celokupni izgled jahte. Prilagođene boje tubusa, tapaciranja i brendiranje osiguravaju da gliser izgleda kao deo jahte.'
content_solution:
  tagline: Naše rešenje
  title: Konfiguracije Glisera<br />Za Svaku Primenu na Jahtama
  subtitle: Aquafarer RIB gliseri mogu biti prilagođeni kako bi se poklapali sa vašim plovilom, tipom operacija i zahtevima skladištenja — od specifikacija brodograditelja superjahti do programa čarter flote.
  list:
    - Prilagođene boje tubusa u skladu sa matičnim plovilom — bilo koja RAL boja dostupna za Hypalon ili PVC tubuse
    - Prilagođeno tapaciranje i šivenje — premium vinil za marine sa usklađivanjem boja i vezenim logotipom
    - Konzolno ili kormilarsko upravljanje — birajte u skladu sa obrascem upotrebe i preferencijama operatera
    - Fiberglass dubok-V trup za glatku i suvu vožnju u različitim morskim uslovima
    - Kompaktno skladištenje — može se naduvati ili složiti za skladištenje na palubi, u garaži, ormariću ili na davitu
    - Hypalon cevi za UV otpornost i dugotrajno očuvanje izgleda
    - Ugrađene tačke za podizanje i vučne prstenove na svim modelima
    - Opcionalne prednje navlake, potpune navlake i zaštitne obloge protiv habanja
    - 'Raspon motora: 15 HP do 60 HP — vanbrodski ili sa upravljačkom ručkom'
    - OEM/prilagođeno označavanje dostupno za proizvođače jahti i prodavce nautičke opreme
content_segments:
  tagline: Profili kupaca
  title: Rešenja za tender čamce<br />Po tipu kupca
  subtitle: Različiti segmenti jaht industrije imaju jedinstvene zahteve. Aquafarer konfiguriše pomoćne čamce da odgovaraju svakoj primeni.
  items:
    - title: Proizvođači superjahti
      subtitle: OEM integracija pomoćnog čamca — prilagođene dimenzije, boje i materijali
      description: 'Proizvođači jahti suočavaju se sa stalnim izazovom: svako novo plovilo ima jedinstvena dimenzionalna ograničenja, limite težine i estetska očekivanja. Pomoćni čamac mora se savršeno uklopiti sa davit sistemom matične jahte, stati unutar preciznih dimenzija garaže i odgovarati dizajnerskom jeziku jahte vredne više miliona evra. Bilo kakva nepravilnost — pogrešna boja cevi, neispravno postavljene tačke za podizanje, nekompatibilna težina — odlaže isporuku i loše odražava graditelja. Aquafarer radi direktno sa timovima nabavke i dizajna graditelja kako bi isporučio pomoćne čamce sa prilagođenim RAL bojama cevi, odgovarajućim presvlakama, brendiranim konzolnim panelima i kompletnim OEM dokumentacionim paketima.'
      features:
        - Prilagođene dimenzionalne specifikacije koje odgovaraju ograničenjima garaže i davita
        - Bilo koja RAL boja cevi i odgovarajuće presvlake — uzorci za odobrenje dizajna su dostupni
        - OEM brendiranje na konzoli, cevi i naslonima sedišta
        - Validacija tačaka za podizanje i montaže za davit za svaki model
        - Težina trupa optimizovana za određene sisteme lansiranja i podizanja
        - Raspored masovne isporuke usklađen sa proizvodnim rokovima
    - title: Kompanije za upravljanje jahtama
      subtitle: Standardizovani pomoćni čamci — globalna podrška, minimalno vreme zastoja
      description: Kompanije za upravljanje nadgledaju više jahti koje plove po Mediteranu, Karibima, Južnom Pacifiku i šire. Njihova osnovna potreba je pouzdanost — pokvaren pomoćni čamac u udaljenom portu znači prekovremeni rad posade, pritužbe gostiju i skupe zamene u poslednjem trenutku. Standardizovane flote smanjuju vreme obuke posade na različitim plovilima i pojednostavljuju upravljanje rezervnim delovima. Aquafarer nudi cene za više plovila, dosledne specifikacije u svim porudžbinama i globalnu podršku za rezervne delove za kompanije koje upravljaju plovilima u više regiona.
      features:
        - Standardizovane specifikacije za čitavu flotu pod upravljanjem
        - Zamenjivi rezervni delovi za sve pomoćne čamce u floti
        - Cene flote i popusti za porudžbine više jedinica
        - Globalna dostupnost rezervnih delova — brza isporuka u bilo koji port
        - Dosledna dokumentacija za servis i održavanje za posadu
        - Koordinacija isporuke više jedinica do različitih lokacija plovila
    - title: Operatori jaht šartera
      subtitle: Visokofrekventne dnevne operacije — izdržljivost bez kompromisa u izgledu
      description: 'Tenderi za čarter suočavaju se sa najzahtevnijim operativnim rasporedom u jahting industriji: svakodnevni transferi gostiju, izleti na obalu, podrška za vodene sportove i pristajanje u luku — često 200+ operacija po sezoni čartera. Tender mora izgledati besprekorno pri svakom predavanju gostima, dok istovremeno podnosi kontinuirano ukrcavanje, izloženost slanoj vodi i sate rada motora. Propadanje izgleda predstavlja direktan poslovni problem — istrošen tender utiče na ocene gostiju i stope čartera. Aquafarer oprema tendera za čarter unapređenim presvlakama, teškim Hypalon tubevima i ojačanim delovima za rukovanje, radi dugotrajne izdržljivosti koja održava kvalitet prezentacije.'
      features:
        - Tubi za teške uslove Hypalon — životni vek 5-8 godina u svakodnevnoj čarter usluzi
        - Ojačani gazišta i ručke za rukovanje za čestu upotrebu
        - Premium vinil za presvlake otporan na mrlje — lako čišćenje između čartera
        - Površine palube koje se lako čiste i ne klizaju
        - Pouzdani vanbrodski paketi sa lakim pristupom za održavanje za brze rokove
        - Materijali kozmetičkog kvaliteta koji zadržavaju izgled tokom svih sezona čartera
    - title: Prodavci i posrednici jahti
      subtitle: Pouzdana isporuka tendera za dovršetak plovila i vrednost za preprodaju
      description: Diljeri i brokeri trebaju stabilnu isporuku kvalitetnih tendera koji dopunjuju brodove koje prodaju — usklađujući se sa pozicioniranjem brenda i poboljšavajući iskustvo kupca. Nedosledan tender ili kašnjenje u isporuci može odložiti predaju jahte ili umanjiti prezentaciju na listingu. Diljeri zahtevaju dosledan kvalitet među serijama, pouzdane rokove isporuke i konkurentne cene kako bi održali marže. Aquafarer nudi programe inventara za dilere sa sezonskim rasporedom isporuke, opcijama za zajedničko brendiranje za izlaganje u salonu i prioritetnom alokacijom tokom vrhunske sezone.
      features:
        - Programi za skladištenje zaliha sa modelima dostupnim na zahtev
        - Sezonsko planiranje isporuka usklađeno sa kalendarom predaje
        - Zajednički brendiranje prodavca na konzoli i cevima za izlaganje u salonu
        - Dosledan kvalitet i specifikacije u svim serijama porudžbina
        - Konkuretne cene za dilere sa nivoima zasnovanim na količini
