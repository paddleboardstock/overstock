content_challenge:
  tagline: Izazov
  title: Zahtevi za energiju na moru<br />Ekstremna pouzdanost životne sredine
  subtitle: Offshore energetske operacije guraju opremu do krajnjih granica - ekstremne vremenske prilike, udaljene lokacije, kontinuirani radni ciklusi i nulta tolerancija za kvar.
  paragraphs:
    - Offshore energetska industrija posluje u najzahtevnijim morskim sredinama na zemlji. Radni čamci podržavaju naftne i gasne platforme, instalacije vetrogeneratora, operacije podmorskih kablova i projekte izgradnje mora - često u uslovima otvorenog okeana sa ograničenim vremenskim prozorima. Kvar opreme nije samo skup, već je opasan.
    - '** Bezbednost je najveći prioritet ** - Brodovi za prenos posade moraju bezbedno raditi u morskim stanjima koja bi zaustavila druge operacije. Stabilnost na mestu prenosa, pouzdane performanse motora u svim vremenskim uslovima i robusna konstrukcija za ponovljeno pristajanje protiv offshore struktura su obavezni zahtevi.'
    - '** Sposobnost za sve vremenske uslove je od suštinskog značaja ** - Offshore vetroelektrane i naftne platforme rade tokom cele godine. Radni čamci moraju da rade na teškom moru, jakim vetrovima i ograničenoj vidljivosti. Dnevne i noćne operacije zahtevaju pune navigacione pakete i pouzdane sisteme osvetljenja.'
    - '** Sektor vjetroelektrana na moru brzo raste ** - Hiljade novih turbina se instaliraju širom sveta, od kojih svaka zahteva redovno prebacivanje posade, transport alata i podršku za održavanje. Ovo stvara stalnu potražnju za namenskim brodovima za prenos posade (CTV) i podrškomRIBs.'
    - Paddle Board Overstock offshore energija RIBs je projektovana sa ojačanim dubokim V trupovima, Hypalon teškim cijevima, punim navigacionim apartmanima i sigurnosnim sistemima dizajniranim za ekstremne uslove offshore energetskih operacija.
content_solution:
  tagline: Naše rešenje
  title: Namenski izgrađen šor RIBs<br />Za energetsku industriju
  subtitle: Paddle Board Overstock Svaka energija na moru RIB dizajnirana je za siguran i pouzdan rad u ekstremnim morskim uslovima - od Severnog mora do jugoistočne Azije.
  list:
    - Ojačana duboko-V trup za grube vode performanse i predvidljivo rukovanje
    - Cevi za teške uslove rada Hypalon sa UV hemijskom otpornošću za proširenu uslugu na moru
    - 316 hardver od nerđajućeg čelika — nema korozije u kontinuiranom izlaganju slanoj vodi
    - 'Kompletan navigacioni paket: GPS, radar, VHF, noćna navigaciona svetla — standard na offshore modelima'
    - Samo-bailing paluba za bezbedan rad u uslovima ukrcaja na moru
    - Više konfiguracija motora — jedan ili dva vanbrodska motora za pouzdanost misije
    - točka za vuču i teški priključci za rukovanje platformom i bova
    - Boje cevi visoke vidljivosti radi identifikacije na offshore radnim mestima
content_segments:
  tagline: Profil energije
  title: Rešenja za offshore energiju<br />Prema tipu aplikacije
  subtitle: Različite offshore energetske sektore imaju jedinstvene zahteve za radne brodove — od podrške platformama RIBs do brodova za transport radnika na vetroparkovima do plovila za inspekciju podvodnih instalacija.
  items:
    - title: Podrška platformama za offshore naftu i gas
      subtitle: Prevoz posade, snabdevanje opremom, pripravnost za bezbednost platforme
      description: Naftne i gasne platforme zahtevaju dnevnu smenu posade, transport opreme i snabdevanje, kao i pokrivanje u pripravnosti za bezbednost. Radni brodovi moraju sigurno da operišu oko struktura platformi, u jakim strujama i promenjivim morskim uslovima, i da održavaju precizno pozicioniranje prilikom prenosa osoblja preko lestve ili mostića. Ekstremni uslovi — ugljovodonici, hemikalije, stalna slana prskanja — zahtevaju konstrukciju otpornu na koroziju i pouzdan rad.
      features:
        - Konfiguracija za prevoz posade sa sigurnim pristupom za ukrcavanje i rukohvatima
        - Cevi otporne na koroziju Hypalon i hardver od 316 nerđajućeg čelika
        - Ojačane bočne lajsne za čestu kontakt sa platformskim odbojnikom
        - Paluba sa samopražnjenjem za naftnu vodu i hemijsko čišćenje
        - Rezervoar za gorivo velikog kapaciteta za produženi opseg rada na moru
        - Opcija sa dva motora za kritičnu pouzdanost misije
    - title: Operacije na offshore vetroparkovima
      subtitle: Prevoz posade, održavanje turbina, transport alata
      description: Offshore vetroenergija je najbrže rastući sektor u morskoj energiji. Operateri trebaju brodove za prevoz posade (CTV) koji mogu sigurno preneti tehničare na platforme za pristup turbinama u talasima do 1,5 m visine značajnog talasa. Stabilnost prilikom prenosa, sposobnost rada u svim vremenskim uslovima i pouzdan svakodnevni rad su ključni. Servisni brodovi na vetroparkovima rade po strogim rasporedima — svaka zastoja odlaže puštanje turbine u rad ili održavanje, direktno utičući na prihode od proizvodnje energije.
      features:
        - Optimizovan oblik trupa za stabilan prevoz posade kod baze turbine
        - Deep-V ulaz za udoban prelazak kroz talase i nemirno more
        - Potpuna zaštita od vremenskih uslova — zatvorena konzola ili kormilarnica za udobnost posade
        - Prostor na palubi za alate, rezervne delove i servisnu opremu
        - Pakovanje za noćne operacije za produžene smene tokom zime sa ograničenim dnevnim svetlom
        - Tih rad vanbrodskog motora za minimalan uticaj buke na morsko okruženje
    - title: Podvodna podrška kablovima i cevovodima
      subtitle: Inspekcija, održavanje, podrška ROV-u, istraživanje
      description: Operateri podvodnih kablova i cevovoda trebaju radne brodove za inspekciju trase, podršku održavanju, ROV operacije i zadatke istraživanja. Ova plovila zahtevaju stabilne platforme za postavljanje i povlačenje podvodne opreme, precizno manevrisanje pri niskoj brzini za praćenje kablova i pouzdan rad u priobalnim i offshore okruženjima. Stabilnost broda je ključna za tačnost sonarskih i istraživačkih sistema.
      features:
        - Stabilna platforma pri niskoj brzini za praćenje kablova i istraživačke operacije
        - Otvorena paluba za postavljanje ROV-a, kalemove kablova i istraživačku opremu
        - Ploče za montažu opreme za sonar, GPS i instrumentaciju za istraživanje
        - Dizajn trupa sa malim talasima za minimalno ometanje morskog dna tokom inspekcije
        - Precizno manevrisanje pri niskim brzinama sa responzivnim upravljanjem vanbrodskim motorom
    - title: Podrška za pomorsko inženjerstvo i izgradnju
      subtitle: Transport osoblja, snabdevanje materijalom, podrška roniocima
      description: Izvođači pomorskog inženjerstva koji rade na izgradnji luka, zaštiti obale i projektima offshore instalacija potrebni su svestrani radni brodovi za transport osoblja između plovila za izgradnju i obale, snabdevanje materijalom i alatima, podršku roniocima i istraživačke zadatke na lokaciji. Ovi brodovi rade u aktivnim gradilišnim zonama sa više plovila, ograničenim prostorom za manevrisanje i promenljivim uslovima mora. Izdržljivost i svestranost su od presudne važnosti.
      features:
        - Višenamenski raspored palube za osoblje, materijal i ronilačku opremu
        - Merdevine za ronjenje i montaža opreme za operacije podrške ronjenju
        - Klinovi i stub za vuču velike čvrstoće za manevrisanje na gradilištu
        - Robusna Hypalon konstrukcija za otpornost na otpad i abraziju
        - Fleksibilna konfiguracija sedišta — transport posade ili režim tereta
