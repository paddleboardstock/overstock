hero:
  tagline: Znanje o istraživanju vode
  title: Uči
  subtitle: |
    Vodiči, tutorijali i detaljna istraživanja — sve što vam je potrebno za istraživanje<br />
    voda sa poverenjem. Od izbora svog prvog SUP do savladavanja naprednih tehnika.
  taglineSection: Znanje za svakog veslača. Od početnika do profesionalca.
featured:
  tagline: Izdvojene teme
  title: Započni svoje putovanje učenja
  subtitle: Bilo da ste novi u vodenim sportovima ili želite da unapredite svoje veštine, naši vodiči su tu za vas.
  items:
    - title: SUP Osnove
      description: Sve što početnik treba da zna — tipovi dasaka, veličina reketa, stav i saveti za prvi dan.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Naduvavanje vs hard odbor
      description: Koji je pravi za vas? Upoređujemo prenosivost, performanse, izdržljivost i cenu jedno pored drugog.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Bezbednost vode
      description: Osnovno znanje o bezbednosti koje svaki kajakaš treba da ima — vreme, PFD-ovi, samopomoć u vodi i još mnogo toga.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Vodič za materijale
      description: PVC vs Hypalon, drop-stitch tehnologija, ocene poricanja — razumite od čega je vaša oprema napravljena.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Vodič za veličinu
      description: Pronađite pravu dužinu, širinu i zapreminu daske za vašu težinu, veštinu i stil veslanja.
      icon: tabler:ruler
      href: /size-guide
    - title: Srednji tehnike
      description: Unapredi svoje veslanje uz napredne udarce, tehnike okretanja i upravljanje na nemirnoj vodi.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
