content_priorities:
  tagline: Šta kupci proveravaju
  title: 8 stvari koje kupci proveravaju<br />na svakoj poseti fabrici
  subtitle: Na osnovu povratnih informacija od kupaca iz 50+ zemalja, ovo je osam prioriteta koje klijenti ocenjuju pre nego što naruče B2B.
  items:
    - title: Pravi proizvođač
      description: 'Da li ste zapravo fabrika, a ne trgovinska kompanija? Kupci proveravaju: poslovno lice, stvarnu proizvodnu opremu, zaposlene koji upravljaju mašinama, trenutne proizvodne porudžbine u pogonu i usklađenost sajta i radionice.'
      icon: tabler:building-factory
    - title: Proizvod prilagođen primeni
      description: Da li RIB odgovara njihovoj specifičnoj nameni? Operateri u odmaralištima, spasilačke službe, ronioci, ribolovci i patrola imaju fundamentalno različite zahteve. Kupci ocenjuju raspored palube, materijal tubusa i opcije opreme na prikazanoj čamči.
      icon: tabler:target
    - title: Stabilnost i ponovljivost kvaliteta
      description: Da li je 50. jedinica jednako kvalitetna kao prva? Kupci pregledaju QC sisteme, kontrolne tačke u procesu, rukovanje neusaglašenošću i traže evidenciju iz više serija proizvodnje kako bi proverili konzistentnost.
      icon: tabler:repeat
    - title: Autentičnost dokumenata o usklađenosti
      description: Da li su CE sertifikati specifični za model? Da li je DoC potpisao stvarni čovek? Može li se usklađenost proveriti po HIN broju trupa? Kupci proveravaju opšte tvrdnje naspram dokumentacije specifične za model.
      icon: tabler:file-certificate
    - title: Izvršenje prilagođavanja
      description: Da li fabrika zaista može isporučiti prilagođene konfiguracije? Kupci traže dokaze o prošlim projektima po meri, prototipove na prikazu, inženjerske crteže i mogućnost da na licu mesta razgovaraju o tehničkim modifikacijama.
      icon: tabler:adjustments
    - title: Vreme isporuke i kapacitet
      description: 'Da li su navedeni rokovi realni? Kupci procenjuju: trenutni obim proizvodnje, raspoloživi kapaciteti, veličina radne snage, nivoi zaliha materijala, i da li fabrika ima sistem planiranja proizvodnje.'
      icon: tabler:clock
    - title: Цena i trgovinski uslovi
      description: 'Da li su cene transparentne? Da li FOB je cena jasna? Kupci verifikuju: raščlambu jedinične cene, troškove alata, troškove pakovanja i da li fabrika može da podnese DDP ili CIF uslove sa odgovarajućom izvoznom dokumentacijom.'
      icon: tabler:currency-dollar
    - title: Nakon prodaje i rezervnih delova
      description: 'Šta se dešava nakon isporuke? Kupci procenjuju: dostupnost rezervnih delova, proces garancije, zamena cevi sekcije, zamena ventila, i da li fabrika ima dokumentovani protokol nakon prodaje.'
      icon: tabler:headset
content_tour:
  tagline: Obilazak fabrike Ruta
  title: Revizijska turneja —<br />Šta ćete videti
  subtitle: Naša standardna turneja fabrike prati definisanu rutu dizajniranu da odgovori na pitanja kupaca na svakoj stanici.
  items:
    - title: 1. Sala za sastanke — Uvod u kompaniju
      description: Poslovna dozvola, ISO 9001 i BSCI sertifikati, izvozne dozvole i istorija kompanije. Brzi pregled proizvodnih mogućnosti i obima usklađenosti.
      icon: tabler:users
    - title: 2. Skladište sirovina — IQC stanica
      description: Dolazni materijal inspekcije evidencije, tkanina serije sertifikati, lepkovi i uzorci hardvera. Pogledajte kako se materijali testiraju pre ulaska u proizvodnju.
      icon: tabler:building-warehouse
    - title: 3. Tube Fabrication — RF zavarivanje i ručno lepljenje
      description: Live cevi zavarivanje ili lepljenje proces, test šav demonstracije, i instalacija ventila. Posmatrajte chamber-bi-chamber izgradnju i kontrolne punktove kvaliteta.
      icon: tabler:flame
    - title: 4. Laminiranje trupa — GRP radionica
      description: Proces polaganja fiberglasa, primena gelcoat i sušenje trupa. Pogledajte raspored laminacije i strukturnu armaturu za različite RIB modele.
      icon: tabler:layers-subtract
    - title: 5. Montaža i integracija
      description: Spajanje cevi trupa, instalacija konzole i sedišta, integracija električnog i gorivnog sistema i montaža opreme. Posmatrajte proizvodnu liniju u radu.
      icon: tabler:tool
    - title: 6. Stanica za testiranje pritiska
      description: 24-48h pritisak hold test na 1.25k nominalnog pritiska. Pogledaj test zapise, manometre, i pass / fail kriterijume. Pogledajte kako su rezultati testa povezani sa trupa serijskih brojeva.
      icon: tabler:gauge
    - title: 7. Završna inspekcija i kontrola kvaliteta
      description: Kontrolna lista kvaliteta od 100 tačaka po jedinici, verifikacija dimenzija, kozmetička inspekcija i provera integriteta ambalaže. Pregledajte evidencije o neusaglašenosti i korektivne mere.
      icon: tabler:clipboard-check
    - title: 8. Soba za pregled dokumenata
      description: Dokumentacija o usklađenosti po modelu (DoC, ploča graditelja, uputstvo za vlasnika), evidencija o sledljivosti proizvodnje, HIN registar i demonstracija baze podataka za praćenje serije materijala.
      icon: tabler:folder
content_qc_chain:
  tagline: Dokazi o kvalitetu
  title: 8-faza kontrole kvaliteta lanac<br />— Proverljivo na svakom koraku
  subtitle: Naš lanac kontrole kvaliteta traje od dolaznih materijala do konačne isporuke, sa dokumentovanim dokazima u svakoj fazi.
  items:
    - title: 'Faza 1: Dolazni materijal Inspekcija'
      description: Svaka serija PVC, Hypalonfiberglasa, aluminijuma, lepkova i hardvera se testira prema specifikacijama pre ulaska u proizvodnju. Zatezna čvrstoća, adhezija premaza i provere dimenzija po AQL 2.5 /ISO 2859.
      icon: tabler:package
    - title: 'Faza 2: cevi za zavarivanje / lepljenje KC'
      description: Testiranje čvrstoće šava po proizvodnoj seriji. RF parametri zavarivanja prate i snimaju. Ručno lepljeni šavovi proverava za doslednu pokrivenost lepka i vreme očvršćavanja.
      icon: tabler:flame
    - title: 'Faza 3: Trup laminacija KC'
      description: Merenje debljine gelcoat, verifikacija fiberglasa laiup po rasporedu laminata, i praćenje vremena očvršćavanja. Pozicije strukturne armature verifikovane u odnosu na inženjerske crteže.
      icon: tabler:layers-subtract
    - title: 'Faza 4: Skupština i integracija KC'
      description: Trup-cevi zajednički integritet, konzola i sedište montažni obrtni moment, električni kontinuitet i test curenja sistema goriva. Svaka tačka instalacije verifikovana u odnosu na kontrolnu listu za montažu specifičnu za model.
      icon: tabler:tool
    - title: 'Faza 5: Test zadržavanja pritiska'
      description: Svaka komora na naduvavanje pod pritiskom na 1.25k ocijenio PSI i održava za 24-48 sati. Pad pritiska zabeležen po komori. Pass / fail prag dokumentovan. Povezan sa serijskim brojem trupa.
      icon: tabler:gauge
    - title: 'Faza 6: Završna inspekcija'
      description: Kontrolna lista kvaliteta KSNUMKS-tačaka koja pokriva dimenzionalnu tačnost, kozmetičku završnu obradu, kompletnost dodatne opreme, paket dokumentacije i integritet ambalaže. Nezavisno od proizvodnog tima.
      icon: tabler:clipboard-check
    - title: 'Faza KSNUMKS: Dokumentacija o usklađenosti'
      description: DoC specifičan za model, verifikacija ploče graditelja, potpunost vlasnika priručnika i unos HIN registra. Svi dokumenti o usklađenosti pripremljeni i verifikovani pre puštanja pošiljke.
      icon: tabler:file-certificate
    - title: 'Faza 8: Oslobađanje pošiljke i sledljivost'
      description: Konačno izdanje zahteva sve KC faze prošao, usklađenost dokumentacija kompletna, i isporuka dokumentacija verifikovana. Trup zapis zatvoren i arhiviran za+ 10 godina zadržavanja.
      icon: tabler:truck
content_traceability:
  tagline: Proizvodnja Sledljivost
  title: HIN → Master fajl →<br />Isporuka zapisa o trupu →
  subtitle: Svaki RIB brod nosi jedinstveni identifikacioni broj trupa povezan sa kompletnim lancem evidencije proizvodnje i usklađenosti.
  items:
    - title: Identifikacioni broj trupa (HIN)
      description: Jedinstveni identifikator KSNUMKS-karaktera trajno označen na svakom brodu. Kodira kod proizvođača (MIC), oznaku modela, godinu proizvodnje i serijski broj. Ključ koji otključava puni lanac sledljivosti.
      icon: tabler:hash
    - title: Glavna tehnička datoteka
      description: Usklađenost i inženjerska dokumentacija za porodicu modela. Sadrži GA crteže, procenu rizika, proračune stabilnosti, specifikacije materijala i važeće standarde. Povezan sa svim trupovima tog modela.
      icon: tabler:folder
    - title: Individualni Trup Rekord
      description: 'Zapis o proizvodnji po trupu: HIN, datum proizvodnje, serija cevi, materijalni sertifikati, rezultat ispitivanja pritiska, konačna konfiguracija, specifikacija motora, rezultati kontrolne liste kvaliteta i odredište isporuke. 21+ polja podataka po trupu.'
      icon: tabler:file-description
    - title: Paket za usaglašenost kupaca
      description: Paket za isporuku po trupu, uključujući DoC, fotografiju graditeljske ploče, uputstvo za vlasnika, kontrolnu listu usklađenosti i konačnu konfiguraciju. Isporučuje se sa brodom i arhivira u fabrici 10+ godina.
      icon: tabler:package
content_red_flags:
  tagline: Revizija zamke
  title: Crvene zastave Kupci<br />Lako uočiti
  subtitle: Uobičajena pitanja koja podrivaju poverenje kupaca tokom fabričkih revizija. Proaktivno se bavimo svakim od njih.
  items:
    - title: CE Ćebe potraživanja bez obima modela
      description: '"Svi proizvodi CE sertifikovani" bez navođenja koja direktiva, koji modeli i koji modul usaglašenosti. Crvena zastava: sugeriše da je usklađenost površna, a ne po modelu, po konfiguraciji.'
      icon: tabler:alert-triangle
    - title: Nema dokaza o fizičkom testiranju
      description: 'Tvrdnje o ispitivanju pritiska bez evidencije o ispitivanju, mjerača ili test stanice vidljive na fabričkom podu. Crvena zastava: tvrdnje o kvalitetu ne mogu se proveriti tokom posete.'
      icon: tabler:alert-triangle
    - title: Nedostaje materijal Sledljivost
      description: 'Nema batch evidencije, nema dolazne inspekcije, ili nema veze između sertifikata materijala i gotovih proizvoda. Crvena zastava: nema načina da se prate pitanja kvaliteta na izvor.'
      icon: tabler:alert-triangle
    - title: Generička dokumentacija
      description: 'Jedan DoC koji pokriva sve modele, nema HIN-specifičnih evidencija, ili "šablon" usaglašenosti dokumenata. Crvena zastava: usklađenost nije vezana za pojedinačne proizvodne jedinice.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Dostava i pakovanje
  title: RIB brod kontejnera<br />Utovar i sanduk
  subtitle: Naša rešenja za isporuku štite vašu investiciju od Kingdao do odredišne luke. Planovi za utovar kontejnera i specifikacije sanduka dostupne su za svaki model.
  items:
    - title: 20ft Kontejner Konfiguracije
      description: 'Standardni 20ft kontejner: 1-2 RIB brodovi (4.0-5.5m) ugnežđeni sa palube i cevi odvojeno, ili 8-12 SUP odbora. Mešovite RIB + SUP konfiguracije dostupne. Detaljan plan utovara obezbeđen po nalogu.'
      icon: tabler:box
    - title: 40ft Kontejner Konfiguracije
      description: 'Standardni KSNUMKSft kontejner: KSNUMKS-KSNUMKS RIB brodovi (do KSNUMKSm) sa trupovima ugnežđenim i cevima naslaganim, ili SUP KSNUMKS-KSNUMKS pločama. KSNUMKSft HK dostupan za RIB više modele. Pakovanje optimizovano za obim smanjuje troškove isporuke po jedinici.'
      icon: tabler:container
    - title: Drveni sanduk za RIB trupove
      description: Aluminijumski i GRP trupovi u drvenim sanducima po meri sa penastom podlogom, barijerom za vlagu i čeličnim trakama. Dimenzije sanduka i težina po modelu dostupni za planiranje logistike. Uključena je sertifikacija toplotno obrađenog drveta ISPM-KSNUMKS.
      icon: tabler:wood
    - title: Tube & paluba Odvajanje Pakovanje
      description: Cevi ispuhane i isključene odvojeno od trupa za efikasnost prostora. Paluba ploče, konzole, i sedišta upakovane u zaštitnu ambalažu sa montažnim hardverskim kompletima. Uputstva za ponovno sklapanje uključena u svaku pošiljku.
      icon: tabler:package
    - title: Zaštita od vlage i korozije
      description: VCI antikorozivni papir za aluminijumske komponente, silikagel sredstva za sušenje pakovanja, i vakuum zapečaćene hardverske kese. Sprečava oštećenja kondenzacije tokom 30-45 dana okean tranzita.
      icon: tabler:droplet-off
    - title: FOB Kingdao Dokumentacija
      description: Teretnica, komercijalna faktura, lista pakovanja, potvrda o poreklu i dokumentacija o usklađenosti po pošiljci. FCL i LCL konsolidacija dostupna. Podrška carinskoj dokumentaciji za tržišta EU, SAD i Bliskog istoka.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Dokazi o verifikaciji
  title: Dokazi revizije<br />Možete potvrditi na licu mesta
  subtitle: Tokom poseta fabrici, klijenti mogu da verifikuju specifične dokaze u svakoj proizvodnoj oblasti. Evo šta treba tražiti - i šta pripremamo za svaku reviziju.
  areas:
    - area: Sirovina Magacin
      what_to_verify: Da li su materijali stabilni? Da li postoji mešanje serija?
      evidence: Evidencija prijema inspekcije, etikete serija, FIFO skladištenje, lista odobrenih dobavljača, sertifikati materijala (PVC, Hypalon, staklena vlakna, aluminijum, lepkovi, oprema)
      icon: tabler:building-warehouse
    - area: Proizvodnja cevi
      what_to_verify: Kako je zagarantovana čvrstoća spojeva i nepropustljivost?
      evidence: Procesne kartice, potvrda prvog uzorka, evidencija pritiska po komori, zapisnici o popravci i ponovnom testiranju, evidencija instalacije ventila
      icon: tabler:flame
    - area: Proizvodnja trupa
      what_to_verify: Kako se kontroliše strukturalna konzistencija?
      evidence: Kontrolisana procesna dokumentacija, kontrolne tačke kvaliteta, označavanje poluproizvoda, merenja debljine gelcoata, verifikacija rasporeda laminacije
      icon: tabler:layers-subtract
    - area: Sklopna zona
      what_to_verify: Kako se sprečava pogrešna montaža opcionalnih delova?
      evidence: BOM, radni nalozi, kontrolne liste konfiguracije, kartice inspekcije radne stanice, provere momenta i funkcionalnosti po modelu
      icon: tabler:tool
    - area: Testna stanica
      what_to_verify: Kako potvrđujete da je čamac ispravan pre isporuke?
      evidence: Test procedure, lista instrumenata, evidencija kalibracije, zapisnici testova pritiska (1,25x / 24-48h), kontrolne liste funkcionalnih testova, dokumentovani kriterijumi prođe/ne prođe
      icon: tabler:gauge
    - area: Zona nekonformiteta
      what_to_verify: Kako se rukuje sa defektima?
      evidence: Etikete za izolaciju, zapisnici NCR, analiza osnovnog uzroka, zapisi odobrenja za preradu, praćenje CAPA (korektivna i preventivna akcija)
      icon: tabler:alert-triangle
    - area: Magacin gotovih proizvoda
      what_to_verify: Kako sprečiti pogrešnu isporuku i oštećenja?
      evidence: Etikete gotovih proizvoda, zapisnici usklađivanja narudžbina, standardi pakovanja, zapisnici pregleda pre isporuke
      icon: tabler:box
    - area: Rezervni delovi i postprodaja
      what_to_verify: Možete li podržati dugoročno postprodajno održavanje?
      evidence: Lista uobičajenih rezervnih delova, strategija inventara, sistem označavanja delova, dokumentacija procesa garancije, uputstva za održavanje
      icon: tabler:headset
content_closing_script:
  tagline: Revizija po narudžbini
  title: Od posete fabrike<br />do potvrđenog projekta
  subtitle: Uspešna revizija ne bi trebala da se završi fotografijama i rukovanjem. Pre odlaska, osiguravamo da su dokumentovana tri komercijalna ishoda.
  items:
    - title: Potvrditi tehničku konfiguraciju
      description: Dogovoriti se o modelu, primeni, ključnim opcijama, ciljnom tržištu, procenjenoj količini i rasporedu isporuke — sve dokumentovano pre odlaska.
      icon: tabler:checklist
    - title: Potvrditi dokumente za sledeći korak
      description: 'Definišite šta Paddle Board Overstock dalje obezbeđuje: revidirani GA, konfiguraciona lista, citat, kontrolna lista dokumenata, plan uzorka, ili NDA — sa određenim vremenskim rokovima.'
      icon: tabler:file-plus
    - title: Potvrdite uzajamnu vremensku liniju
      description: Revidirana konfiguracija i preliminarna ponuda u roku od 3 radna dana. Potvrda uzorka ili izgleda u roku od 7 dana. Inženjerski pregled ili inspekcija treće strane u roku od 14 dana. Sledeći datum sastanka i odgovorne strane zaključane.
      icon: tabler:calendar
faq:
  title: Fabrička revizija — Često postavljana pitanja
  questions:
    - q: Mogu li lično posetiti fabriku?
      a: Da. Pozdravljamo revizije fabrika na licu mesta u našem objektu od 12.000 m² Kingdao. Naša standardna turneja pokriva 8 stanica od skladišta sirovina do sobe za pregled dokumenata. Virtuelne obilaske fabrike putem video poziva su takođe dostupne za početnu kvalifikaciju.
    - q: Da li prihvatate revizije trećih strana (BSCI, SMETA, SGS)?
      a: Da. Održavamo BSCI sertifikaciju (Intertek) i pozdravljamo protokole revizije specifične za kupca. Takođe možemo organizovati SGS TÜV ili inspekcije na zahtev. Izveštaji o reviziji dostupni su pod NDA.
    - q: Mogu li da vidim testiranje pritiska tokom posete?
      a: Naša stanica za testiranje pritiska je deo standardne rute turneje. U zavisnosti od rasporeda proizvodnje, možete posmatrati aktivne testove pritiska sa očitavanjem merača i test evidencije. Evidencija ispitivanja pritiska po trupu je uvek dostupna za pregled.
    - q: Kako se nosite sa neusaglašenim proizvodima?
      a: Neusaglašene jedinice su odvojene, dokumentovane i pregledane po ISO našem procesu korektivnih mera KSNUMKS. Vrši se analiza uzroka, sprovode se korektivne mere i održava evidencija. Kupci mogu pregledati naš NCR dnevnik tokom revizije.
    - q: Koja dokumentacija o usklađenosti je dostupna za pregled?
      a: 'Tokom revizije, možete pregledati: uzorke DoC-a specifične za model, specifikacije graditelja ploča, HIN registar, nacrte priručnika za vlasnike, važeće liste standarda i evidenciju o ocenjivanju usaglašenosti po porodici modela.'
    - q: Kako da rezervišem virtuelni obilazak fabrike?
      a: Obratite se našem prodajnom timu da biste zakazali video turneju uživo putem VhatsApp-a, Zoom-a ili Teams-a. Pratimo istu rutu KSNUMKS-stanica i možemo se fokusirati na određene oblasti na osnovu vaših interesovanja. Tipična virtuelna turneja je KSNUMKS-KSNUMKS minuta.
    - q: Da li je fabrika stvarni proizvođač ili trgovačko preduzeće?
      a: Paddle Board Overstock je stvarni proizvođač. Mi upravljamo fabrikom u Laikiju, Kingdao. Poslovna dozvola, obim proizvodnje i fizička proizvodnja mogu se proveriti tokom revizije.
    - q: Koje kvalitetne zapise mogu pregledati?
      a: Dolazni materijal inspekcije evidencije, u procesu kontrole kvaliteta kontrolnih punktova, pritisak test evidencije, 100 tačaka završne inspekcije kontrolne liste, izveštaji o neusaglašenosti, korektivne mere evidencije, i per-trupa sledljivost evidencije. Sve održava po ISO 9001 zahtevima.
