stories:
  - title: Kako je mediteransko odmaralište izgradilo profitabilan SUP posao iznajmljivanja
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: Odmaralište sa 5 zvezdica — Grčka
    problem: Odmaralištu su bile potrebne vrhunske vodene aktivnosti za goste kako bi povećali ocene zadovoljstva i stvorili novi tok prihoda, ali su im nedostajala oprema, bezbednosna infrastruktura i stručnost osoblja.
    solution: Aquafarer je isporučio 50 dasaka sa brendom po meri u bojama i logou odmarališta, kompletan bezbednosni sistem uključujući stanicu spasilaca i linije s bovu, i 3-dnevni program obuke osoblja koji pokriva rukovanje opremom, uputstvo za goste i bezbednosne protokole.
    result:
      - 300+ rezervisanih aktivnosti za goste nedeljno u prvom mesecu
      - 'Ocene zadovoljstva gostiju za vodene aktivnosti: 4.8/5'
      - 'Novi godišnji dodatni prihod: $180K'
      - Nulta bezbednosna incidenta u prvoj sezoni rada
      - Troškovi zamene opreme smanjeni 40% u odnosu na prethodnog dobavljača
    quote:
      text: Aquafarer nisu samo isporučili daske — pomogli su nam da izgradimo kompletno iskustvo za goste. Naš program vodenih sportova otišao je od nula do glavne atrakcije odmarališta u jednoj sezoni.
      author: Generalni menadžer odmarališta
    cta_text: Izgradite rešenje za vaše odmaralište
    cta_href: /solutions/resorts
  - title: Kako je australski startup izgradio vodeni brend za 90 dana
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Preduzetnik po prvi put — Australija
    problem: Ljubitelj aktivnosti na otvorenom želeo je da pokrene svoj SUP brend za australijsko tržište, ali nije imao iskustva u proizvodnji, ni odnosa sa dobavljačima, i ograničen kapital.
    solution: Paket za pokretanje brenda Aquafarer pružio je konsultacije za izbor proizvoda, dizajn prilagođenog loga i boja, brendiranu maloprodajnu ambalažu sa etiketama, CE dokumentaciju za sertifikaciju i FOB transport do Sidneja.
    result:
      - Prva pošiljka od 200 dasaka isporučena 75 dana od prvog kontakta
      - Brend lansiran na Shopify + Amazon AU u roku od 2 nedelje od dolaska
      - Početni inventar rasprodat za 45 dana
      - 'Prosečna marža: 55% na maloprodajne cene'
      - 'Druga porudžbina: 500 jedinica naručeno u roku od 60 dana od lansiranja'
    quote:
      text: Imao sam ideju za brend, ali nula znanja o proizvodnji. Aquafarer me je doslovno vodio kroz ceo proces — od izbora pravog dizajna daske do otpakivanja prve pošiljke. 90 dana od sna do isporuke.
      author: Osnivač, australijski SUP brend
    cta_text: Pokrenite svoj brend
    cta_href: /solutions/entrepreneurs
  - title: Kako je tajlandski plažni klub porastao sa 10 na 80 dasaka
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Klub vodnih sportova — Tajland
    problem: Mali plažni SUP klub u Phuketu je morao da se proširi iz hobističkog poslovanja u profesionalni biznis iznajmljivanja za turiste, ali nije mogao da pronađe pouzdanog dobavljača opreme sa konzistentnim kvalitetom i cenama.
    solution: Počevši sa Aquafarer Club Starter Paketom (10 dasaka, vesla, sigurnosna oprema, brendiranje), klub je rastao kroz Premium Paket program tokom 18 meseci.
    result:
      - Rast od 10 do 80 dasaka u 18 meseci sa konzistentnim kvalitetom i cenama
      - Dodato iznajmljivanje kajaka i pedalinaca koristeći istog dobavljača
      - Prilagođeno brendiranje kluba povećalo prepoznatljivost brenda među turistima
      - Troškovi održavanja smanjeni za 60% u odnosu na prethodni budžet za opremu
      - Sada dnevno služe 150+ iznajmljivanja tokom vrhunca sezone
    quote:
      text: Club Starter Paket je bio savršen početak. Kako je naš biznis rastao, Aquafarer je rastao sa nama — isti kvalitet, iste cene, bez iznenađenja.
      author: Vlasnik kluba, Phuket
    cta_text: Započnite svoj Club Paket
    cta_href: /solutions/clubs
  - title: Kako je karipski lanac odmarališta standardizovao vodne sportove u 5 lokacija
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Lanac odmarališta — Karibi
    problem: Luksuzni lanac odmarališta sa 5 lokacija je imao potrebu za konzistentnim kvalitetom opreme za vodne sportove i brendiranjem na svim lokacijama, uz centralizovanu nabavku i sezonsko planiranje zamene.
    solution: Aquafarer je isporučio flotu za više lokacija od 300 SUPs i 100 kajaka sa jedinstvenim brendiranjem, zajedničkim inventarom rezervnih delova i godišnjim planom zamene uz cene po količini.
    result:
      - Standardizovano iskustvo gostiju na svih 5 lokacija
      - 30% smanjenje troškova kroz konsolidovanu nabavku i cene po količini
      - Centralizovani inventar rezervnih delova smanjio zastoje za 80%
      - Godišnji program osvežavanja opreme eliminisao gužvu na kraju sezone
      - Učešće gostiju u vodnim sportovima povećano za 45% na godišnjem nivou
    cta_text: Dizajnirajte svoj Resort Program
    cta_href: /solutions/resorts
