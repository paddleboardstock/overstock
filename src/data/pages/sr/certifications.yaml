hero:
  tagline: Sertifikati i standardi
  title: Kvalitetni sertifikati<br />i standardi usklađenosti
  subtitle: Paddle Board Overstock proizvodi se proizvode u skladu sa međunarodnim standardima bezbednosti na moru, sistemima upravljanja kvalitetom i propisima o zaštiti životne sredine.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock sertifikati kvaliteta i dokumentacija o usklađenosti
content_certifications:
  tagline: Naši sertifikati
  title: Sertifikovani kvalitet,<br />Globalno priznat
  subtitle: 64 CE sertifikovana modela i sertifikati cele fabrike pokazuju našu posvećenost kvalitetu, bezbednosti i odgovornosti prema životnoj sredini.
  items:
    - title: CE Sertifikovano
      description: 64 CE sertifikovana modela su u skladu sa evropskim zahtevima oznake CE za rekreativna plovila, osiguravajući ispunjenje standarda bezbednosti, zdravlja i zaštite životne sredine.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Naš sistem upravljanja kvalitetom je sertifikovan prema ISO 9001:2015 standardu, pokrivajući projektovanje, proizvodnju i distribuciju naduvavajućih plovila i mornarske opreme.
      icon: tabler:clipboard-check
    - title: UKCA Obeleženo
      description: Proizvodi koji se prodaju na tržištu Velike Britanije nose UKCA oznaku, potvrđujući usklađenost sa britanskim propisima za mornarsku opremu i lična plovila.
      icon: tabler:shield
    - title: BSCI Usklađeno
      description: Paddle Board Overstock je revidiran po BSCI (Business Social Compliance Initiative), pokazujući etičke proizvodne prakse, poštene radne uslove i odgovornost u lancu snabdevanja.
      icon: tabler:heart-handshake
    - title: REACH Usklađeno
      description: Svi materijali korišćeni u Paddle Board Overstock proizvodima ispunjavaju EU REACH propise za hemijsku bezbednost, osiguravajući da nema zabranjenih supstanci u našim PVC, Hypalon ili komponentama.
      icon: tabler:flask
    - title: Testiranje materijala
      description: Tkanine se testiraju na vlačnu čvrstoću, otpornost na kidanje, UV degradaciju i ponašanje pri hladnom pucanju. Svaka proizvodna serija se uzorkuje i verifikuje.
      icon: tabler:test-pipe
content_factory:
  tagline: Standardi fabrike
  title: Izvrsnost u proizvodnji<br />— Proizvedeno prema specifikaciji
  subtitle: Naš objekat od 12.000 m² funkcioniše pod strogim protokolima kontrole kvaliteta u svakoj fazi proizvodnje.
  list:
    - 'Inspekcija ulaznog materijala: Svi sirovi materijali — PVC tkanina, Hypalon, aluminijum, šperploča, lepkovi — testiraju se prema specifikacijama pre ulaska u proizvodnju.'
    - 'Kontrola kvaliteta u procesu proizvodnje: Svaka proizvodna faza ima dokumentovane QC tačke. Proveravaju se čvrstoća zavarivanja, poravnanje šavova, instalacija ventila i zatezni moment spojnica inline.'
    - 'Testiranje pritiska: Svaka naduvavajuća komora se testira pod pritiskom od 1,25× nominalnog pritiska 24–48 sati. Stopu curenja mora biti unutar prihvatljivih granica prema ISO 6185.'
    - 'Konačna inspekcija: Završeni proizvodi se pregledaju po dimenzijskoj tačnosti, kozmetičkoj završnoj obradi, kompletnosti dodatne opreme i integritetu pakovanja pre isporuke.'
    - 'Praćenje serija: Svaki proizvod nosi serijski broj povezan sa zapisnicima proizvodne serije, omogućavajući potpunu sledljivost od sirovog materijala do gotovih proizvoda.'
content_safety:
  tagline: Standardi pomorske bezbednosti
  title: Bezbednost na prvom mestu<br />— Dizajnirano za pouzdan rad
  subtitle: Paddle Board Overstock proizvodi su dizajnirani i testirani kako bi ispunili međunarodne standarde pomorske bezbednosti za komercijalnu i rekreativnu upotrebu.
  items:
    - title: ISO 6185
      description: Naduvavanje čamci ispunjavaju ISO 6185 standarde za konstrukciju, stabilnost, plovnost i nosivost.
      icon: tabler:sailboat
    - title: ABYC standardi
      description: Električni sistemi i sistemi goriva slede ABYC (American Boat & Yacht Council) standarde za sigurnu instalaciju i rad.
      icon: tabler:bolt
    - title: SOLAS Usklađenost
      description: Oprema za bezbednost i spasilački uređaji ispunjavaju zahteve SOLAS (Safety of Life at Sea) gde je primenljivo.
      icon: tabler:lifebuoy
