process_section:
  eyebrow: Naš proces
  title: End-to-End OEM/ODM Tok posla
  subtitle: Od dizajna do utovara kontejnera - šest koraka do vašeg privatnog brenda na naduvavanje.
  steps:
    - step: '01'
      title: Specifikacija i dizajn Kratak
      desc: Podelite svoje ciljne specifikacije, CAD crteže ili referentni proizvod. Naš inženjerski tim razmatra materijale, dimenzije i zahteve za usaglašenost (CE, BSCI) pre citiranja.
    - step: '02'
      title: 3D kalupa Izrada prototipova
      desc: Dizajniramo i CNCmašinski prilagođene kalupe za SUP daske, kajak trupove i RIB komponente. Prototip uzoraka proizveden u roku od 15-20 radnih dana za vaše odobrenje.
    - step: '03'
      title: Izbor materijala i proizvodnja uzoraka
      desc: Izaberite između vojnih PVC (0.9 mm - 1.2 mm) Hypalon CSMili drop-stitch osnovnih tkanina. Proizvodimo predprodukcijske uzorke sa bojama vašeg brenda, logotipom i ambalažom za potpisivanje.
    - step: '04'
      title: CE Fabrička revizija i usklađenost
      desc: OEM Svaka narudžba uključuje dokumentaciju o CE usaglašenosti - izjavu o usaglašenosti, ISO 9001 evidenciju o sledljivosti BSCI , izveštaj o socijalnoj usklađenosti i REACH materijalne deklaracije.
    - step: '05'
      title: Bulk Proizvodnja i Inline KC
      desc: Proizvodnja radi prati našu 100 tačaka kvalitet kontrolnu listu. Svaka jedinica prolazi 24-časovno testiranje zadržavanja pritiska, šav piling testiranje, i vizuelni pregled pre pakovanja.
    - step: '06'
      title: FOB Kingdao Logistika i špedicija
      desc: Gotovi proizvodi su paletizovani, umotani i utovareni u kontejnere u luci Kingdao. Mi se bavimo svu izvoznu dokumentaciju, carinjenje i obezbeđujemo praćenje pošiljke u realnom vremenu.
capabilities_section:
  eyebrow: Mogućnosti proizvodnje
  title: Ono što gradimo
  subtitle: Šest osnovnih proizvodnih mogućnosti za B2B globalne partnere.
  items:
    - title: Drop-Stitch SUP odbor Proizvodnja
      desc: Puna drop-stitch dužina jezgra laminacija za krute, visokog pritiska (15–20PSI) stand-up paddle boards. Prilagođena dužina, širina, debljina, rocker profil, i grafički dizajn.
    - title: PVC Naduvavanje Boat Proizvodnja
      desc: Visokofrekventni PVC zavareni čamci, tenderi i sportski čamci. Višestruke konfiguracije komora, opcije poda (letvica, vazdušna paluba, roll-up) i integracija dodatne opreme.
    - title: Hypalon RIB Brod Izrada
      desc: Komercijalni razred Hypalon CSM cevi vezan za fiberglasa ili aluminijuma duboko-V trupa. 3.3 m do 6.0 m dužine za patrolu, spašavanje, turneju, i ronjenje operacije.
    - title: Privatna marka i prilagođeni brend
      desc: 'Puna privatna robna marka usluga: prilagođeni logo prenos toplote ili sitotisak, brendirana ambalaža (maloprodajne kutije, torbe), korisnički priručnici na vašem jeziku, i barkod /UPC registracija.'
    - title: Prilagođeni kalupa i alati Dizajn
      desc: In-house 3D CAD / CAM inženjerski tim. Dizajniramo i izrađujemo prilagođene aluminijumske i kompozitne kalupe za jedinstvene oblike trupa, konfiguracije palube i dodatne tačke za montažu.
    - title: OEM Dodatna oprema i kiting
      desc: Prsluci za spašavanje (CE12402), pumpe sa dvostrukim dejstvom, vesla od ugljenika / najlona, kompleti za popravku, torbe za nošenje i sklopovi povodca. Kompletno kompletiranje i pakovanje paketa za prezentaciju spremnu za maloprodaju.
experience_section:
  eyebrow: Iskustvo u stvarnom svetu
  title: Partnerstva koja su izgradila brendove
  subtitle: Stvarne priče iz brendova i organizacija koje su se udružile Paddle Board Overstock sa za OEMODM / proizvodnju.
  stories:
    - quote: Došli smo Paddle Board Overstock do skice na salveti i liste zahteva. Osam meseci kasnije, imali smo proizvod spreman za proizvodnju koji je prošao CE sertifikat iz prvog pokušaja.
      narrative: Evropski startup sa novim SUP dizajnom pristupio Paddle Board Overstock ODM je proizvodnji. Paddle Board Overstock Tim za istraživanje i razvoj preuzeo je koncept kroz CAD dizajn, FEA strukturnu analizu, hidrodinamičku simulaciju, stvaranje kalupa, izradu prototipa i proizvodne alate. Osnivač startupa posetio je Kingdao tri puta tokom procesa. Konačni proizvod je prošao CE sertifikaciju bez ikakvih izmena - rezultat koji osnivač pripisuje Paddle Board Overstockinženjerskom timu koji je od samog početka razumeo evropske regulatorne zahteve.
      context: SUP Lansiranje evropskog brenda, 2023-2024
      source: Brand Founder
    - quote: Nivo NDA zaštite i IP bezbednosti Paddle Board Overstock daje nam poverenje da delimo naše vlasničke dizajne. Oni tretiraju našu IP kao da je njihova.
      narrative: Američka kompanija za pomorsku opremu sa vlasničkom tehnologijom ventila trebala je proizvodnog partnera koji bi mogao zaštititi svoju IP dok proizvodi u velikoj mjeri. Nakon revizije pet kineskih proizvođača, odabrali su Paddle Board Overstock na osnovu protokola za zaštitu intelektualne svojine u fabrici, sigurnog rukovanja datotekama dizajna i spremnosti da potpišu stroge NDA. Partnerstvo je proizvelo tri linije proizvoda tokom četiri godine sa nula IP incidenata.
      context: Američka kompanija za pomorsku opremu, OEM partnerstvo od 2021. godine
      source: Potpredsednik operacija
