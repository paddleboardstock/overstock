hero:
  tagline: Partneri i Distribucija
  title: Postanite Aquafarer Partner<br />— Globalna mreža distribucije
  subtitle: Pridružite se globalnoj mreži partnera Aquafarer. Radimo sa distributerima za pomorsku opremu, prodavcima brodova, trgovcima opreme i brend partnerima u 50+ zemalja.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer globalna mreža partnera i distributera
content_programs:
  tagline: Programi partnerstva
  title: Programi partnerstva<br />Razvijeno za rast
  subtitle: Bilo da ste distributer, trgovac ili brend partner, Aquafarer nudi programe dizajnirane da podrže vaše poslovanje.
  columns: 3
  items:
    - title: Distribucioni program
      description: Ekskluzivna teritorijalna distribucija sa količinskim cenama, marketinškom podrškom i direktnim pristupom fabrici. Minimalna obaveza je potrebna u zavisnosti od veličine teritorije.
      icon: tabler:world
    - title: Program za trgovce
      description: Direktne cene za trgovce, obuka za proizvode, marketinški materijali i podrška za garanciju za maloprodajne lokacije i online prodavnice.
      icon: tabler:building-store
    - title: OEM/ODM Partnerstvo
      description: Potpuna OEM i ODM proizvodnja sa mogućnošću prilagođavanja brenda, pakovanja i specifikacija proizvoda. Od koncepta do kontejnera.
      icon: tabler:certificate
    - title: Partnerstvo brenda
      description: Zajednički brending, privatna oznaka i ekskluzivni programi modela za etablirane brendove u pomorskoj i rekreativnoj industriji na otvorenom.
      icon: tabler:stars
    - title: Vlada i institucije
      description: Programi za specijalizovane dobavljače za vladine agencije, obalske straže, vojsku i humanitarne organizacije. Dokumentacija spremna za tendere.
      icon: tabler:building-community
    - title: Partner za odmarališta i iznajmljivanje
      description: Cene za flotu, dosledan kvalitet i prilagođavanje brenda za odmarališta, centara za ronjenje i operacije iznajmljivanja širom sveta.
      icon: tabler:sun
content_benefits:
  tagline: Zašto biti naš partner
  title: Zašto partneri biraju Aquafarer
  subtitle: Naši partneri imaju koristi od realne proizvodne sposobnosti, doslednog kvaliteta i brze podrške.
  list:
    - 'Direktan pristup fabrici: Radite direktno sa našim proizvodnim timom — bez posrednika. Brže odgovore, bolje cene i potpunu preglednost u proizvodnji.'
    - 'Spremno za prilagođavanje: Brendirajte svoje proizvode sa prilagođenim bojama, logotipima, pakovanjem i specifikacijama. Minimalne količine su prilagođene vašem tržištu.'
    - 'Kvalitet garantovan: ISO 9001 sertifikovana proizvodnja sa CE, UKCA i BSCI usklađenošću. Svaki proizvod se testira pre isporuke.'
    - 'Globalna logistika: Isporuka iz Qingdao, Kina sa FOB, CIF i DDP opcijama. Magacin u SAD-u u Montclair, CA za distribuciju u Severnoj Americi.'
    - 'Marketinška podrška: Katalozi proizvoda, fotografije, tehnička dokumentacija i digitalni materijali za podršku vašoj prodaji.'
    - 'Obuka i podrška: Obuka za proizvode za vaš prodajni tim, tehnička podrška za vaše kupce i koordinacija usluge garancije.'
content_process:
  tagline: Kako postati partner
  title: Jednostavan proces partnerstva
  subtitle: Naš proces partnerstva je jednostavan — osmišljen da vam omogući brzo prodavanje Aquafarer proizvoda.
  items:
    - title: 'Korak 1: Podnošenje prijave'
      description: Popunite naš obrazac za prijavu partnera sa podacima o vašoj kompaniji, ciljnom tržištu i interesovanim proizvodima.
    - title: 'Korak 2: Pregled kvalifikacija'
      description: Naš tim za partnerstva pregleda vašu prijavu i kontaktira vas u roku od 3 radna dana kako bi razgovarao o mogućnostima.
    - title: 'Korak 3: Ugovor i postavljanje'
      description: Potpišite ugovor o partnerstvu, postavite svoj račun i primite partnerske cene, marketinške materijale i uzorke proizvoda.
    - title: 'Korak 4: Obuka i lansiranje'
      description: Pružaju se obuka za proizvode, podrška u prodaji i marketinški materijali. Spremni ste za početak prodaje.
cta:
  title: Spremni da postanete Aquafarer partner?
  subtitle: Prijavite se za partnerstvo i naš tim će odgovoriti u roku od 3 radna dana.
  actions:
    - variant: primary
      text: Prijavite se za partnerstvo
      href: /contact
    - text: Pogledajte naše proizvode
      href: /products
