hero:
  tagline: Pretraga
  title: Proizvodni proces
  subtitle: Od sirovine do broda spremnog za more - svaki korak pod našom kontrolom
  back_label: Nazad u Fabriku
  back_link: /factory
intro: Za razliku od brendova koji prepuštaju proizvodnju nezavisnim fabrikama, Aquafarer poseduje i upravlja čitavim proizvodnim lancem. Ova vertikalna integracija nam omogućava da održimo strogu kontrolu kvaliteta u svakoj fazi, brzo reagujemo na prilagođene zahteve i isporučujemo konzistentan kvalitet proizvoda seriju nakon serije. Evo kako se brod gradi u našem objektu.
steps:
  - step: '01'
    title: Prijem i inspekcija materijala
    description: Svaka dolazna serija PVC tkanine, fiberglasa prostirka, smole i hardvera se pregledava u skladu sa specifikacijama. Uzorci tkanina su testirani na zateznu čvrstoću, debljine uniformnosti i UV otpornosti pre puštanja u proizvodnju. Neusaglašeni materijali su u karantinu i vraćeni.
    duration: 1–2 dana
  - step: '02'
    title: PVC Automatsko sečenje
    description: Odobrene tkanine se polažu na CNC automatsku mašinu za sečenje i seku sa tačnošću ispod milimetra. Kompjuterski optimizovano gnežđenje uređuje panele kako bi se smanjio otpad - obično ispod 5%. Isečeni paneli su označeni modelom broda i komorom, a zatim se spajaju za prenos u radionicu za zavarivanje.
    duration: 2-4 sata po kompletu broda
  - step: '03'
    title: Cevi toplote zaptivanje i zavarivanje
    description: Paneli se lepe i lepe pomoću mašina za toplotno zaptivanje sa zavarivanjem toplim vazduhom na kontrolisanim temperaturama od 200–600 °C. Glavni šavovi su ojačani RF dielektričnim zavarivanjem za hermetički zatvorene spojeve visoke čvrstoće. Završene komore su naduvane na 1,25× radnog pritiska za 30-minutnu validaciju zadržavanja vazduha.
    duration: 1-2 dana po brodu
  - step: '04'
    title: Fiberglas RIB Trup Lajsne
    description: RIB Trupovi brodova se proizvode korišćenjem ručnog lai-up fiberglasa. Slojevi fiberglasa prostirke i tkanog lutanja su ručno valjani sa poliesterom ili vinilester smole u preciznim kalupima. Svaki sloj je vakuum-vreća za dosledan kvalitet laminata. Trup je završen sa gelcoat za visokog sjaja, UV-otporan morske površine.
    duration: 2–4 dana po trupu
  - step: '05'
    title: SUP Štampa i dekoracija
    description: SUP Board deck grafika se primenjuje korišćenjem digitalne štampe za foto-kvalitet dizajna u boji, i sito štampa za trajne logotipe i ponavljaju obrasce. Otisci su očvrsnuti i zapečaćeni za UV i otpornost na habanje.
    duration: 1–2 dana
  - step: '06'
    title: Konačna montaža i opremanje
    description: Fiberglas trupovi i PVC cevi sklopovi su upareni na pokretnoj traci. Motor je montiran, upravljanje i kontrole gasa su povezani, sistem goriva je instaliran, a puna električni svežanj je ožičen. Svaki brod prati 100 tačaka skupštine kontrolnu listu sa obaveznim potpisivanjem u svakoj fazi.
    duration: 2–3 dana
  - step: '07'
    title: Testiranje kvaliteta i inspekcija
    description: 'Svaki završeni brod prolazi obaveznu kapiju kvaliteta: test zadržavanja vazduha u komori, proveru funkcije sistema, verifikaciju obrtnog momenta pričvršćivača i kozmetičku inspekciju. Prilagođene i prototipne građe takođe dobijaju ispitivanja u vodi koja pokrivaju brzinu, rukovanje, stabilnost i izdržljivost.'
    duration: 1–2 dana
  - step: '08'
    title: Pakovanje i isporuka
    description: Brodovi su ispuhani, isključen po postupku, upakovan u teške vreće ili šperploče sanduke, i loaded za isporuku. Svaki paket je označen sa modelom, serijskim brojem, i odredište. Mi koordiniramo sa špediterima za FCL i LCL kontejnera pošiljke širom sveta.
    duration: 1 dan
