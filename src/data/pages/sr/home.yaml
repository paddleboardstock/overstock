      cta: Preuzmite komercijalni paket
      cta_href: /solutions/resorts
    - title: Spasavanje / Vlada / Profesionalci
      description: Hypalon/CSM konstrukcija, SOLAS opcije usklađenosti, sertifikacija specifična za projekat, podrška za tendersku dokumentaciju i inženjering zaštićen NDA.
      icon: tabler:shield
      cta: Razgovarajte o projektu
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM sposobnosti
  title: Šta dobijate<br />sa Paddle Board Overstock
  subtitle: Direktan pristup fabrici sa punom inženjerskom, kvalitetnom i podrškom za usklađenost — ne trgovačka kompanija.
  columns: 2
  items:
    - title: OEM/ODM prilagođavanje
      description: Prilagođeni dizajn trupa, materijal cevi (PVC ili Hypalon/CSM), raspored konzole, sedišta, brendiranje, boje i pakovanje. Od manjih modifikacija do potpunog prilagođenog inženjeringa.
      icon: tabler:adjustments
    - title: Nisko MOQ, brza izrada uzoraka
      description: 'RIB: 2-5 jedinica (postojeći kalup). SUP: 5-10 jedinica po SKU. Prilagođeni kalupi: 200+ jedinica. Predproizvodni uzorci sa vašim brendom za 7-14 dana.'
      icon: tabler:rocket
    - title: Kvalitet spreman za proizvodnju
      description: Svaka jedinica testirana pritiskom od 1,25x nominalnog PSI tokom 24-48 sati. 99,3% bez grešaka po AQL 2.5 / ISO 2859. Kontrolna lista kvaliteta sa 100 tačaka po trupu.
      icon: tabler:certificate
    - title: Kompletna dokumentacija za usklađenost
      description: CE po 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI socijalni audit, REACH usklađenost, UKCA označavanje. Model-specifični DoC i podaci sa pločice brodice uključeni.
      icon: tabler:file-certificate
    - title: Vreme isporuke 30-45 dana
      description: Standardna proizvodnja 30-45 dana FOB Qingdao. Prototipovi 7-14 dana. Dostupna hitna proizvodnja. Planovi utovara kontejnera i pakovanje ISPM-15 uključeni.
      icon: tabler:truck-delivery
    - title: Posleprodajna podrška & rezervni delovi
      description: 5 godina garancije na čamce/kajake/RIBs, 2 godine na SUP/pribor. Snabdevanje rezervnim delovima sa prioritetnom isporukom. Podrška u obradi reklamacija.
      icon: tabler:lifebuoy
content_categories:
  tagline: Kategorije proizvoda
  title: 5 kategorija,<br />64 CE sertifikovana modela
  subtitle: Od 2,4 m RIB tendera do 15ft SUP dasaka — sve proizvedeno u našoj Qingdao ISO 9001 fabrici.
  items:
    - title: RIB Čamci
      description: KSNUMKSm do KSNUMKSm sa aluminijumskim ili GRP trupovima.PVC ili Hypalon/CSM cevi.CE po KSNUMKS / KSNUMKS / EU. Patrolne, ronilačke, spasilačke i komercijalne konfiguracije.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Čamci na naduvavanje
      description: KSNUMKSm do KSNUMKSm sa aluminijumskim podom, podom od šperploče ili opcijama vazdušne palube. Ribolov, rekreacija i tenderski modeli.
      icon: tabler:sailboat
      link: /products
    - title: SUP Odbori
      description: KSNUMKSft do KSNUMKSft u KSNUMKS-inčnim i KSNUMKS-inčnimDrop-Stitch. Svestrani, touring, joga i ribolovni modeli. Komercijalni razred dostupan.
      icon: tabler:swimming
      link: /products
    - title: Kajaci
      description: 1-osoba do 3-osoba naduvavanje kajaka. Rekreativni i touring modeli sa Drop-Stitch opcijama poda.
      icon: tabler:kayak
      link: /products
    - title: Sigurnosni pribor
      description: CE-sertifikovani prsluci za spašavanje, bacanje konopaca, kompleti za popravke, pumpe i navigaciona svetla.USCG Tip III / V odobreni PFD.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Fabrika Snaga
  title: Revizija-Spreman Proizvodnja<br />u Kingdao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO 9001 Objekat — Pravi proizvođač, a ne trgovačko preduzeće</h3>
  items:
    - title: 6 Namenski proizvodne linije
      description: RIBOdvojeni, gumeni čamac, SUPkajak, sigurnosna oprema i OEMODM / linije. Svaki sa namenskim kontrolnim punktovima kontrole kvaliteta i planiranja proizvodnje.
    - title: 100% testiran pod pritiskom
      description: Svaka komora na naduvavanje pod pritiskom na 1.25k PSI ocijenjena i održana 24-48 sati. Rezultati ispitivanja povezani sa serijskim brojem trupa (HIN).
    - title: Per-trupa sledljivost
      description: 'Evidencija o proizvodnji na nivou HIN-a sa 21+ poljima podataka po trupu: serija materijala, ID zavarivača, rezultat ispitivanja pritiska, konačna konfiguracija i odredište isporuke.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² ISO 9001 proizvodni pogon u Kingdao sa RIB proizvodnim linijama
content_compliance:
  tagline: Usklađenost i dokaz kvaliteta
  title: dokumentovani dokazi,<br />Ne samo tvrdnje
  subtitle: Svaki zahtev za usklađenost je podržan dokumentacijom specifičnom za model koja je dostupna za vašu verifikaciju.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Sistem upravljanja kvalitetom sertifikovan od strane TÜV Rheinland /SGS. Godišnje revizije nadzora. Dokumentovani KC procesi od dolaznog materijala do oslobađanja pošiljke.
      icon: tabler:certificate
    - title: CE po 2013/53/EU (RCD)
      description: 64 modela sa izjavama o usaglašenosti specifičnim za model. Procena usaglašenosti po važećim modulima. HIN registracija i podaci o graditeljskoj tablici za svaki trup.
      icon: tabler:file-certificate
    - title: BSCI Socijalna usklađenost
      description: Godišnji BSCI revizija od strane SGS. Proverene etičke radne prakse, bezbednost na radu i upravljanje životnom sredinom u celoj našoj ustanovi.
      icon: tabler:users
    - title: REACH & UKCA
      description: Svi PVC i lepljivi materijali su u skladu sa EU REACH regulativom. UKCA oznaka dostupna za tržište Velike Britanije. Liste podataka o bezbednosti materijala dostupne na zahtev.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proces — Od Brifa do Kontejnera
  items:
    - title: Korak 1:<span class="font-medium">Zahtevi</span>
      description: Podelite specifikacije vašeg proizvoda, ciljano tržište, količinu i zahteve za usklađenost. Naš inženjerski tim će pregledati u roku od 48 sati.
      icon: tabler:file-text
    - title: Korak 2:<span class="font-medium">Predlog</span>
      description: Primite detaljan predlog sa specifikacijama, opcijama materijala, MOQ, cenama, vremenom isporuke i obimom usklađenosti za vaše tržište.
      icon: tabler:clipboard-list
    - title: Korak 3:<span class="font-medium">Prototip</span>
      description: Pre-produkcioni uzorak sa vašim brendingom za 7-14 dana. Potpuno testiranje kvaliteta pri 1,25 puta nominalnog pritiska. Trošak uzorka se uračunava u proizvodnju.
      icon: tabler:settings
    - title: Korak 4:<span class="font-medium">Proizvodnja</span>
      description: 30-45 dana proizvodnje u Qingdao nakon odobrenja uzorka. Kontrolne tačke QC tokom procesa, testiranje pritiska i finalna inspekcija od 100 tačaka na svakoj jedinici.
      icon: tabler:building-factory
    - title: Korak 5:<span class="font-medium">Dostava</span>
      description: Plan utovara kontejnera, drvene kuke prema ISPM-15, paket dokumentacije o usklađenosti, i FOB pošiljka iz Qingdaoa sa kompletnom izvozom dokumentacije.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM proces proizvodnje gumenih čamaca od dizajna do slanja u kontejneru
blog_latest:
  title: Industrijski i tehnički uvidi
  information: |
    RCD vodiči za usklađenost, OEM/ODM članci o procesima, uporedni prikazi materijala,
    i resurse za inspekciju fabrike od Paddle Board Overstock inženjerskog tima.
faqs:
  title: B2B Česta pitanja o nabavci
  subtitle: Uobičajena pitanja od brendova, distributera i komercijalnih operatera o proizvodnji OEM/ODM sa Paddle Board Overstock.
  columns: 2
  items:
    - title: Da li ste proizvođač ili trgovačka kompanija?
      description: Mi smo vertikalno integrisana fabrika sa potpunom kontrolom nad kvalitetom, materijalima i rokovima. Poslovna licenca i obim proizvodnje mogu se proveriti tokom audita fabrike.
      icon: tabler:building-factory
      category: all
    - title: Koji je vaš OEM/ODM proces?
      description: Pregled zahteva (48h) do predloga za prototip (7-14 dana) do proizvodnje (30-45 dana FOB Qingdao). Puna inženjerska podrška, dokumentacija za usklađenost i praćenje po trupu kroz čitav proces.
      icon: tabler:route
      category: all
    - title: Koji su vaši MOQ zahtevi?
      description: 'RIB čamci: 2-5 jedinica po modelu (postojeći kalup), 200+ za prilagođene kalupe. SUP daske: 5-10 jedinica po SKU. Dostupne narudžbine kontejnera sa mešanim modelima. Uzorci se naručuju u količini od 2-5 jedinica za evaluaciju.'
      icon: tabler:sort-ascending
      category: all
    - title: Koje opcije prilagođavanja su dostupne?
      description: Dizajn trupa, materijal cevi (PVC ili Hypalon/CSM), prečnik cevi, raspored konzole, sedišta, upravljanje, sistem goriva, raspored palube, boje brenda, logo grafika, dizajn EVA podloge, pakovanje za maloprodaju i brendiranje uputstava za vlasnika.
      icon: tabler:adjustments
      category: all
    - title: Koja dokumentacija za usklađenost može biti obezbeđena za moje tržište?
      description: CE DoC prema 2013/53/EU, UKCA označavanje, ISO 9001 sertifikat (SGS), BSCI izveštaj sa audita, REACH usklađenost, izveštaji o testiranju materijala, zapisnici ispitivanja pritiska i podaci table specifične za model. Dokumentacija specifična za tržište dostupna na zahtev.
      icon: tabler:file-certificate
      category: all
    - title: Koliko traje vreme za uzorkovanje i proizvodnju?
      description: 'Uzorci pre proizvodnje: 7-14 radnih dana. Standardna proizvodnja: 30-45 dana FOB Qingdao. Brza proizvodnja dostupna uz dodatnu nadoknadu. U sezoni vrhunca (mart-jun) vremena isporuke mogu biti duža.'
      icon: tabler:clock
      category: all
    - title: Mogu li da zakažem audit fabrike ili uživo video turu?
      description: Da. Auditi u fabrici u našoj Qingdao lokaciji su dobrodošli uz 3-5 dana prethodnog obaveštenja. Uživo video ture preko WhatsApp/Zoom dostupne odmah. Inspekcije treće strane (SGS, BV, TÜV) su omogućene.
      icon: tabler:video
      category: all
    - title: Koje provere kvaliteta se vrše pre isporuke?
      description: 1. Test zadržavanja pritiska 1,25x nominalnog (24-48h), test ljuštenja šavova, finalna kontrolna lista od 100 tačaka, verifikacija dimenzija, estetska inspekcija, verifikacija dokumentacije o usklađenosti i provera integriteta pakovanja. Sve prema procedurama ISO 9001.
      icon: tabler:clipboard-check
      category: all
