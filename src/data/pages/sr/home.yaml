content_customer_types:
  tagline: Kome služimo
  title: Izgrađeno za B2B kupce<br />— Ne maloprodajni kupci
  subtitle: Paddle Board Overstock proizvodi za četiri tipa kupaca. Svaki ima različite prioritete, i mi se bavimo svim njima.
  items:
    - title: Vlasnici brenda / Privatna marka
      description: Dizajn prilagođenih proizvoda, grafike sa privatnom oznakom, dokumentacija o usklađenosti pod vašim brendom i posvećena inženjerska podrška od koncepta do kontejnera.
      icon: tabler:palette
      cta: Zahtevajte OEM/ODM ponudu
      cta_href: /request-quotation
    - title: Distributeri / Veliko-prodaja
      description: Zaštita teritorije, konkurentne veleprodajne cene, marketinški podržavajući setovi, obuka za proizvode i kompletna dokumentacija za usklađenost za vaše tržište.
      icon: tabler:world
      cta: Prijavite se za dilerski ugovor
      cta_href: /dealers-distributors
    - title: Odmarališta / Operateri iznajmljivanja
      description: Tvrdoća komercijalnog kvaliteta, saveti za veličinu flote, porudžbine kontejnera sa mešanim modelima, strategija rezervnih delova i paketi opreme sa brendom odmarališta.
