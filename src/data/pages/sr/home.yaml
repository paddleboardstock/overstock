      description: Pumpe, vesla, prsluci za spašavanje, povodci, kompleti za popravku i rezervni delovi za svaku ploču koju prodajemo.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Fabrika Snaga
  title: Zašto naše cene čišćenja<br />Da li su stvarni
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Prava fabrika, stvarne uštede - Svaki odbor se isporučuje iz našeg objekta Veihai</h3>
  items:
    - title: Iste proizvodne linije kao i velikih brendova
      description: Naša fabrika Veihai od 12.000 m² gradi ploče za međunarodne brendove i sopstvene serije zaliha na istim linijama sa istim materijalima.
    - title: 100% testiran pod pritiskom
      description: Svaki odbor je pod pritiskom na 1.25k ocijenio PSI i održan pre nego što brodova. 99.3% defekta bez stope po AQL 2.5 / ISO 2859.
    - title: Nema posrednika
      description: Ploče se isporučuju fabrički direktno na vaša vrata. Nema oznake distributera, nema maloprodajne marže - tako cene carinjenja ostaju do 60% ispod maloprodaje.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² fabrika Veihai sa proizvodnim linijama na naduvavanje SUP
content_compliance:
  tagline: Usklađenost i dokaz kvaliteta
  title: Sertifikovani kvalitet,<br />Dokumentovano
  subtitle: Svaka tvrdnja o usklađenosti je podržana sertifikatima i dokumentacijom specifičnom za model koja je dostupna za vašu verifikaciju.
  items:
    - title: ISO 9001:2015
      description: Sistem upravljanja kvalitetom sertifikovan od strane TÜV Rheinland /SGS. Godišnje revizije nadzora. Dokumentovani KC procesi od dolaznog materijala do oslobađanja pošiljke.
      icon: tabler:certificate
    - title: CE Sertifikovano
      description: 13 CE-certifikovani SUP modeli u skladu sa važećim EU direktivama, svaki sa izjavom o usklađenosti specifičnom za model i podacima sa pločice proizvođača.
      icon: tabler:file-certificate
    - title: REACH > UKCA
      description: Svi PVC i lepljivi materijali su u skladu sa REACH propisima EU.UKCA Oznaka dostupna za tržište Velike Britanije. Listovi sa sigurnosnim podacima na zahtev.
      icon: tabler:shield-check
    - title: 2-godišnja SUP garancija
      description: SUP Svaka ploča i pribor pokriveni za 2 godine - drop-stitch šavovi, ventili za naduvavanje, i pribor uključeni. Zahtevi rešeni brzo.
      icon: tabler:lifebuoy
steps:
  title: Od naplate do vode - Kako se vaša narudžba isporučuje
  items:
    - title: Korak 1:<span class="font-medium">Izaberite svoju ploču</span>
      description: Izaberite neku od svestranih, turnejskih, joga i dečijih modela. Naši vodiči za kupovinu pomažu vam da uskladite veličinu odbora i stil sa vašim veslanjem.
      icon: tabler:clipboard-list
    - title: Korak 2:<span class="font-medium">Bezbedna provera</span>
      description: Platite bezbedno sa Stripe ili PayPal. Sve glavne kreditne i debitne kartice prihvaćene. Nije potreban nalog - potvrda porudžbine sleti u vaš inbok.
      icon: tabler:file-text
    - title: Korak 3:<span class="font-medium">Inspekcija kvaliteta</span>
      description: Svaka ploča je 100% testirana pod pritiskom na 1.25k PSI ocenjena i proverena u odnosu na punu listu kvaliteta pre nego što se upakuje.
      icon: tabler:settings
    - title: Korak 4:<span class="font-medium">Brza otprema</span>
      description: Na lageru nalozi brod iz naše fabrike Veihai u roku od 2-3 radnih dana. Rush rukovanje na raspolaganju za hitne naloge.
      icon: tabler:building-factory
    - title: Korak 5:<span class="font-medium">Isporuka sa gusjenicama</span>
      description: Praćena isporuka širom sveta u+ 50 zemalja. Vaša 2-godišnja garancija i odgovarajuća podrška nakon prodaje počinju onog dana kada stigne vaš odbor.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Proces naručivanja od sigurne blagajne do praćene isporuke širom sveta
blog_latest:
  title: SUP Vodiči i tehnički uvidi
  information: |
    Kupovina vodiča, tehnika veslanja, bezbednosne osnove, i izgradnja
    istraživanje Paddle Board Overstock iz tima.
faqs:
  title: SUP Naručivanje i često postavljana pitanja o proizvodima
  subtitle: Uobičajena pitanja o našim SUP klirens pločama, naručivanje, plaćanje, isporuka, i garancija.
  columns: 2
  items:
    - title: Da li je SUP teško naučiti?
      description: Uopšte ne. Većina početnika ustane i vesla u svojoj prvoj sesiji. Naši SUP sveobuhvatni odbori imaju ekstra široke stabilne platforme dizajnirane specijalno za prvi put veslače. Počnite na mirnoj vodi i bićete krstarenje za nekoliko minuta.
      icon: tabler:swimming
      category: sup
    - title: Koja je granica težine?
      description: Naša SUPs sveobuhvatna podrška do 220 lbs i touring i joga platforme podržavaju do 250 cm. Svaka stranica proizvoda navodi tačan kapacitet težine vozača, tako da možete uskladiti ploču sa vašim potrebama.
      icon: tabler:adjustments
      category: sup
    - title: Mogu li da putujem sa naduvavanjem SUP?
      description: Apsolutno. Paddle Board Overstock Svaki odbor pakuje u torbu veličine ranac. Na samo 18-22 kg, lako je nositi na plažu, jezero, ili preko aerodromskih terminala. Proverite politiku prtljaga avio pre putovanja.
      icon: tabler:truck-delivery
      category: sup
    - title: Šta dolazi u kutiji?
      description: Svaki Paddle Board Overstock SUP uključuje ploču, putni ranac, ručnu pumpu, podesivo veslo, prenosivi peraja, kalem povodac, i komplet za popravku.
      icon: tabler:clipboard-list
      category: sup
    - title: Zašto su vaše cene niže od maloprodajnih?
      description: Prodajemo fabričke viškove i serije na rasprodaji direktno iz naše proizvodne fabrike u Vajhaiu, Kina — bez posrednika, bez maloprodajne marže. To znači kompletne SUP pakete po cenama do 60% nižim od uobičajenih maloprodajnih cena, sa istim CE-certifikovanim kvalitetom.
      icon: tabler:certificate
      category: orders
    - title: Kako da naručim i platim?
      description: Dodajte vaš SUP paket u korpu i obavite sigurnu kupovinu putem Stripe ili PayPal. Prihvatamo sve glavne kreditne i debitne kartice. Svaka porudžbina se potvrđuje putem e-pošte sa punim računom.
      icon: tabler:file-text
      category: orders
    - title: Da li šaljete širom sveta?
      description: Da. Šaljemo u 50+ zemalja širom EU, Severne Amerike, Azijsko-pacifičkog regiona, Bliskog istoka i Afrike. Porudžbine koje su na lageru obično se šalju u roku od 2-3 radna dana uz praćenje koje je obezbeđeno za svaki paket.
      icon: tabler:route
      category: orders
    - title: Koju garanciju uključuju SUP ploče?
      description: 'Svaka SUP daska i dodatak ima garanciju od 2 godine — uključujući samu dasku, drop-stitch šavove i ventile za naduvavanje. Zahtevi se rešavaju za dane, a ne nedelje: podnesite ih online i mi popravimo ili zamenimo.'
      icon: tabler:lifebuoy
      category: orders
