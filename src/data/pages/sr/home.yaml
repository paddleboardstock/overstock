    - title: Joga i fitnes SUPs
      description: Ekstra široke, ultra-stabilne platforme sa jastučićima za palubu u punoj dužini za jogu i treninge na vodi.
      icon: tabler:users
      link: /supboard
    - title: Za decu SUPs
      description: Lakše, kraće daske veličine za decu — drop-stitch istog kvaliteta u pakovanju prilagođenom deci.
      icon: tabler:lifebuoy
      link: /products
