features:
  id: features
  tagline: Zašto kupovati od Paddle Board Overstock
  title: Prava Fabrika,<br />Prava štednja
  subtitle: Višak robe i rasprodaja direktno iz fabrike SUP paketi — sertifikovan kvalitet bez maloprodajne marže.
  columns: 2
  items:
    - title: Do 60% popusta na maloprodaju
      description: Prodajemo fabričke viškove i serije na rasprodaji direktno — bez posrednika, bez maloprodajne marže. Iste ploče koje se drugde prodaju po punoj ceni, ovde su po cenama na rasprodaji.
      icon: tabler:rocket
    - title: Kompletni paketi
      description: 'Svaki SUP dolazi kao kompletan paket: daska, putni ranac, ručna pumpa, podesiva vesla, odvojiva peraja, spirala povodca i set za popravku.'
      icon: tabler:clipboard-list
    - title: Sertifikovani kvalitet
      description: 13 CE-certifikovani SUP modeli po važećim EU direktivama. Svaka ploča je 100% testirana na pritisak od 1,25x nazivne PSI pre slanja. Stopa od 99,3% bez defekata po AQL 2,5.
      icon: tabler:certificate
    - title: Br. MOQ — Naručite jednu tablu
      description: Rasprodaja viška zaliha znači da su narudžbine po jednoj jedinici dobrodošle. Dodajte ploču u korpu, završite kupovinu, gotovo. Nema minimalne narudžbine, nema procesa dobavljanja ponude.
      icon: tabler:adjustments
    - title: Brza isporuka širom sveta
      description: Porudžbine na stanju šalju se iz Weihai-a u roku od 2-3 radna dana. Praćena dostava u 50+ zemalja širom EU, Severne Amerike, Azijsko-Pacifičkog regiona i šire.
      icon: tabler:truck-delivery
    - title: 2-godišnja SUP garancija
      description: Svaka SUP daska i dodatak su pokriveni 2 godine — drop-stitch šavovi, ventili za pumpanje i dodaci uključeni. Zahtevi se rešavaju za dane, a ne nedeljama.
      icon: tabler:lifebuoy
