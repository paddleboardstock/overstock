features3_reasons:
  tagline: Zašto odabrati Paddle Board Overstock
  title: Sedam razloga da postanete naš partner
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Prava proizvodnja, ne trgovina
      description: Posedujemo i upravljamo fabrikom od 12.000 m². Kada sarađujete sa Paddle Board Overstock, radite direktno sa ljudima koji projektuju, inženjerski osmišljavaju i izrađuju vaše proizvode — bez posrednika.
      icon: tabler:building-factory
    - title: 2. Pristup vođen inženjeringom
      description: Naš proces dizajna počinje sa slučajem upotrebe, a ne sa kategorijom proizvoda. Optimizujemo oblik trupa, izbor materijala i konfiguraciju za način na koji će čamac zapravo biti korišćen.
      icon: tabler:engine
    - title: 3. Sertifikovani kvalitet
      description: CE sertifikovan, ISO sistem kvaliteta, BSCI u skladu, REACH u skladu, USCG odobren. Naših 64 CE-sertifikovana modela ispunjavaju međunarodne standarde — ne samo tvrdnje.
      icon: tabler:certificate
    - title: 4. Fleksibilan OEM/ODM
      description: Boje tube, raspored konzole, brendiranje, pakovanje — prilagođavamo prema vašim specifikacijama. Nema pritiska minimalne porudžbine. Počnite sa prototipom, skalirajte sa poverenjem.
      icon: tabler:adjustments
    - title: 5. Globalna logistika
      description: Skladište u SAD-u u Kaliforniji, direktna isporuka iz Čingdao-a, avionski transport za hitne narudžbine. Mi obavljamo carinsku papirologiju i dokumentaciju.
      icon: tabler:truck-delivery
    - title: 6. Doživotna podrška
      description: Podržavamo čamce koje smo izgradili pre 20 godina. Originalni rezervni delovi, tehnički saveti, uputstva za popravku — naš tim je dostupan kad vam zatrebamo.
      icon: tabler:lifebuoy
    - title: 7. Iskrene specifikacije
      description: Prave ocene opterećenja, prave dimenzije, prava težina. Nema marketinškog uvećavanja. Ono što objavljujemo je ono što dobijate — potvrđeno nezavisnim testiranjem.
      icon: tabler:ruler-measure
testimonials:
  tagline: Poverenje brendova širom sveta
  title: Šta naši partneri kažu
  items:
    - content: Saradili smo sa nekoliko proizvođača u Kini, ali Paddle Board Overstock se izdvaja po podršci inženjeringa i doslednom kvalitetu. Oni tretiraju naš brend kao svoj sopstveni.
      name: — OEM Partner, evropski brend vodenih sportova
    - content: Njihovi Hypalon RIBs su u upotrebi u našoj floti više od 5 godina. Minimalno održavanje, odlična otpornost UV. Petogodišnja garancija na tubuse nam uliva poverenje.
      name: — Operater flote, Grupa odmarališta na Bliskom Istoku
    - content: Paddle Board Overstock tim nam je pomogao da razvijemo prilagođeni SUP dizajn daske od koncepta do proizvodnje za 90 dana. Kvalitet je premašio naša očekivanja.
      name: — Distributer, australijski vodeni sportovi
