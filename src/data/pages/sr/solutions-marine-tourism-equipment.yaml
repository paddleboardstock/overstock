content_challenge:
  tagline: Izazov
  title: Zahtevi morskog turizma<br />Pouzdani, spremni brodovi za prevoz putnika
  subtitle: Operateri turizma trebaju brodove koji mogu da podnesu svakodnevne transfere putnika, različite uslove na moru i visoka očekivanja gostiju — uz održavanje niskih troškova i profitabilne operacije.
  paragraphs:
    - Operatori turizma na ostrvima u destinacijama kao što su Maldivi, Filipini, Indonezija i Tajland vode svakodnevne transfere putnika, ture snorklinga i morske izlete. Njihovi brodovi rade 300+ dana godišnje u slanim vodama sa minimalnim zastojevima zbog održavanja.
    - '**Transferi između ostrva** zahtevaju brz i udoban transport putnika između odmarališta, aerodroma i lokacija za ronjenje. Putnici očekuju glatku vožnju, jednostavno ukrcavanje i zaštitu od sunca i morskih prskanja. Spori ili neudobni brodovi direktno utiču na zadovoljstvo gostiju i ponovljene rezervacije.'
    - '**Operateri posmatranja kitova i delfina** trebaju brodove koji brzo mogu da stignu do divljih životinja, održavaju stabilne platforme za posmatranje i rade tiho kako ne bi uznemiravali morski život. Brzina, stabilnost i manevrabilnost su ključni — putnici očekuju bliske susrete bez osećaja morske bolesti.'
    - '**Avanturistički turizam** kompanije vode obalne ture, izlete u pećine i iskustva sa morskim životinjama. Njihovi brodovi navigavaju kroz različite sredine — od otvorenog okeana do plitkih uvala — što zahteva svestrane dizajne trupa i pouzdanu konstrukciju.'
    - U svim segmentima, otpornost na koroziju, efikasnost goriva i udobnost putnika su najvažniji faktori. Brod koji otkaže ili zahteva česte popravke znači izgubljeni prihod, otkazane ture i narušenu reputaciju.
content_solution:
  tagline: Naše rešenje
  title: Turističkog standarda RIBs<br />& Oprema za flotu
  subtitle: Paddle Board Overstock pruža kako komercijalne RIB brodove za prevoz putnika, tako i opremu za flotu (SUPs, kajaci, naduvavanje) za programe aktivnosti u odmaralištima — sve od jednog dobavljača.
  list:
    - Komercijalni putnički RIBs od 4,8m do 8m — konfigurisan za transfere između ostrva, ture snorklinga i posmatranje divljih životinja
    - Udobna sedišta sa naslonima i zaštitom od sunca — udobnost putnika za ture od 1-2 sata
    - Široka greda i trup tipa deep-V za stabilnost — smanjuje morsku bolest i povećava sigurnost putnika
    - Tihi motori za posmatranje divljih životinja — minimalno ometanja morskih životinja
    - Ladder za ronjenje i platforma za kupanje — neophodno za ture snorklinga i plivanja
    - Prilagođeno brendiranje i šeme boja - logotip vaše kompanije i livreja flote na svakom plovilu
    - Cene flote za RIB masovne narudžbe - konzistentne specifikacije u operacijama sa više brodova
    - SUP daske, kajaci i čamci na naduvavanje za programe aktivnosti gostiju u odmaralištu
    - Rezervni delovi i podrška za održavanje — minimizirajte zastoje tokom vrhunca turističke sezone
content_segments:
  tagline: Segmenti turizma
  title: Rešenja za morski turizam<br />Po vrsti operacije
  subtitle: Različite turističke operacije zahtevaju različite konfiguracije brodova.Paddle Board Overstock odgovara pravo RIB na vašu specifičnu aplikaciju.
  items:
    - title: Island Transfer Operatori
      subtitle: Maldivi, Filipini, Indonezija, Tajland — dnevni prevoz gostiju
      description: Ostrvski turistički operateri u jugoistočnoj Aziji i Maldivima svakodnevno prevoze putnika između aerodroma, odmarališta i ronilačkih lokacija - često 300+ dana godišnje. Brod je okosnica iskustva gostiju. Kvar znači nasukane goste, otkazane rezervacije i štetu ugledu. Ovim operaterima su potrebni brodovi koji preživljavaju visokofrekventnu upotrebu na udaljenim lokacijama gde je podrška za održavanje ograničena, a delovi su teško nabaviti.
      features:
        - Komercijalni razred gradnja ocijenjen za 300+ radnih dana godišnje
        - Udobna klupa za sedenje sa naslonima za 8-16 putnika
        - T-top ili Bimini suncobran za zaštitu od tropskog sunca i prskanja
        - Široka platforma za ukrcavanje za lak pristup gostima sa prtljagom
        - Suvi pregrade za odlaganje torbi za goste i odredbe odmarališta
        - Štedljiv 4-taktni vanbrodski motor — niski operativni troškovi po putovanju
        - Cevi za teške uslove rada Hypalon za životni vek od 5-8 godina u tropskim uslovima
        - Dizajn koji se lako održava — pristupačne komponente za servisiranje na udaljenoj lokaciji
    - title: Operateri za posmatranje kitova
      subtitle: Offshore sposobnost, brzina gledanja terena, stabilna platforma
      description: Posmatranje kitova je sezonski, ali visoko vredan turistički segment koji posluje u regionima kao što su Hervei Bai (Australija), Kaikoura (Novi Zeland), Baja California (Meksiko) i Azori. Operateri moraju brzo da dođu do područja za gledanje na moru pre nego što kitovi zarone ili krenu dalje, održavaju stabilnu platformu za produžene periode posmatranja i rade tiho kako bi izbegli uznemiravanje morskih sisara. Udobnost putnika tokom 2-4 sata ture direktno utiče na preglede i ponovljene rezervacije. Spor ili nestabilan brod znači propuštena viđenja i vraćene ture.
      features:
        - KSNUMKS-KSNUMKSm RIB konfiguracije za offshore sposobnost u otvorenim vodama
        - Tihi 4-taktni vanbrodski motor — minimalna buka i vibracije
        - Deep-V trup sa odličnom stabilnošću u mirovanju — udobna platforma za gledanje
        - Platforma za posmatranje luka sa rukohvatima za fotografiju gostiju
        - Potpuna zaštita od vremenskih prilika — T-top ili zatvorena konzola za offshore uslove
        - Ergonomsko sedenje dizajnirano za udobnost trajanja turneje KSNUMKS-KSNUMKS
        - Materijali morskog razreda za produženo izlaganje slanoj vodi i UV otpornost
    - title: Delfin posmatranje Operatori
      subtitle: Brza potraga, kapacitet za više putnika, miran pristup
      description: Operateri za posmatranje delfina trebaju drugačiji balans mogućnosti. Delfini su brži i razigraniji od kitova, zahtevajući čamce koji mogu brzo ubrzati, precizno manevrirati i približiti mahune bez da ih zapanjuju. Ove ture obično nose više putnika po putovanju i rade bliže obali. Tihi rad je kritičan - delfini koji se naviknu na glasne motore će izbegavati čamce, smanjujući uspeh viđenja. Operateri takođe trebaju pouzdane čamce za dnevne rasporede više putovanja tokom vrhunca turističke sezone.
      features:
        - 5.5-8m RIB za agilnost, brzinu i pristup plitkoj vodi
        - Brzo ubrzanje za postizanje aktivnih delfina mahuna
        - Tihi izduvni i niske vibracije trup za bliski pristup
        - Stabilna platforma u mirovanju za gledanje gostiju i fotografisanje
        - Veliki putnički kapacitet (10-18 osoba) za špico sezone ture
        - Pramčani prostor za sjedenje za gledanje delfina u blizini vode
        - Plitki nacrt za primorske i zalivske operacije
    - title: Avantura i eko turizam
      subtitle: Istraživanje obale, pećinske ture, susreti sa divljim životinjama
      description: Operateri avanturističkog turizma kreću se različitim okruženjima - otvorenim prelazima okeana, istraživanjem plitke lagune, pristupom obalnim pećinama i susretima sa morskim divljim životinjama. Njihovim brodovima je potrebna svestranost da bi se nosili sa različitim uslovima na moru, izdržljivost da izdrže upotrebu na udaljenoj lokaciji i plitki nacrt za pristup zaštićenim uvalama i sletanju na plaže. Pouzdanost opreme je najvažnija - kvar na udaljenoj lokaciji može uništiti turneju i ugroziti goste.
      features:
        - Plitki nacrt trupa za pristup laguni, pećini i plaži
        - Ojačani trup i Hypalon cevi za trajnost mešovitog okruženja
        - Fleksibilna sedišta — rekonfigurabilna za različite tipove tura i veličine grupa
        - Tačke za montažu opreme za fotografsku opremu i specijalizovanu opremu
        - Mogućnost lakog sletanja na plažu — ojačana kobilica i zaštita cevi
        - Zaštita od vremenskih prilika za udobnost gostiju tokom produženih turneja
    - title: Odmaralište Aktivnost Flote
      subtitle: Kompletni programi za gostujuće sportove na vodi — RIBs, SUPs, kajaci, bezbednost
      description: Odmarališta koja nude vodene sportove kao deo iskustva gostiju trebaju flotu koja balansira raznolikost, trajnost i prezentaciju brenda. RIBs Flota obično uključuje izlete i transfere gostiju, SUPs i kajake za samostalno istraživanje i čamce na naduvavanje za grupne ture za ronjenje. Upravljanje mešovitim tipovima opreme u sezonskim količinama gostiju zahteva dosledan kvalitet, lako održavanje i jedinstveno brendiranje. Kvar ili istrošena oprema direktno utiče na recenzije gostiju i prihode.
      features:
        - RIB tenderi za izlete gostiju, transfere i izlete za ronjenje
        - SUP Daske i kajaci za samostalne aktivnosti gostiju
        - Gumeni čamci za grupne ture i snorkeling od plaže do grebena
        - Potpuno prilagođeno brendiranje na svoj opremi — jedinstvena prezentacija odmarališta
        - 'Paket sigurnosne opreme: PFD, zviždaljke, prva pomoć, linije bova'
        - Materijali za obuku osoblja za rukovanje opremom i bezbednost gostiju
