testimonial:
  content: Iznajmljivao sam 5 dasaka iz lokalne prodavnice i gubio 60% svog prihoda njima. Paddle Board Overstock mi je pomogao da izgradim sopstvenu flotu od 15 SUPs. Kalkulator ROI koji su dali pokazao je da ću se pokriti za 4 meseca — zapravo je trebalo 3. Sada proširujem na 30 dasaka i dodajem kajake.
  name: Daniel Okonkwo
  title: Vlasnik, Lakeland SUP Iznajmljivanja — Ontario, Kanada
content_segments:
  tagline: Profilis najma
  title: Rešenja za iznajmljivanje vodnih sportova<br />Po tipu operatera
  subtitle: Različite rent-a-korisničke operacije imaju različite potrebe — od malih rentala na plaži SUP do velikih centara za vodene sportove u odmaralištima. Prilagođavamo naše pakete opreme i model podrške u skladu s tim.
  items:
    - title: Iznajmljivanje na plaži i pored jezera SUP
      subtitle: Operacije visokog obima, niske složenosti
      description: Operateri koji iznajmljuju daske za veslanje u stojećem položaju i kajake direktno posetiocima plaže i jezera. Vaš prioritet je minimiziranje vremena između iznajmljivanja, održavanje opreme u rotaciji i upravljanje sezonskim skokovima potražnje sa malim prostorom za skladištenje.
      features:
        - Naduvane SUP flote koje se pakuju ravno — nije potrebno pristanište ili prikolica
        - Komercijalni PVC ocenjivan za 100+ ciklusa iznajmljivanja po sezoni
        - Tkanina koja se brzo suši i otporna na UV za spremnost za ponovnu iznajmljivanje istog dana
        - Opseg tabli kodiranih bojama za lakšu identifikaciju flote
    - title: Kompleksi za vodene sportove pri odmaralištima i hotelima
      subtitle: Iskustvo gostiju i usklađenost sa brendom
      description: Resorti i hoteli koji nude vodene sportove kao uslugu na licu mesta. Oprema treba da izgleda premium, da pouzdano funkcioniše za goste od početničkog do srednjeg nivoa i da se integriše sa postojećim procesima rezervacije i naplate aktivnosti u resortu.
      features:
        - Prilagođene daske i prsluci za spašavanje u bojama resorta
        - 'Mešovita flota: SUPs, kajaci, pedaline i mali RIB čamci'
        - Tihi, bezgorivni električni pumpni sistemi za napuhavanje na plaži
        - Uključeno obučavanje osoblja i onboarding za održavanje
    - title: Operatori iznajmljivanja čamaca i RIB
      subtitle: Flote čamaca komercijalnog kvaliteta
      description: Operateri koji iznajmljuju motorizovane čamce — RIB čamci, naduvani čamci i mali motorni čamci — po satu ili pola dana. Vaša flota mora da zadovolji pomorske sigurnosne propise, da izdrži intenzivnu upotrebu od strane gostiju i da minimizuje mehaničko zastoje između čartera.
      features:
        - RIB paketi sa 30–90 HP spremnih za vanbrodski motor
        - Podne ploče od pomorskog špera za dugoročnu strukturnu izdržljivost
        - Sistemi ventila za brzo lansiranje radi bržeg rotiranja
        - Komplet rezervnih delova + tehnička podrška na poziv SLA
    - title: Operatori tura i avantura
      subtitle: Flote za vođene izlete
      description: Operateri koji organizuju vođene ture vodenih sportova — SUP safariji, kajaking po pećinama, izleti sa ronjenjem ili ture skakanja sa ostrva na ostrvo RIB ture. Oprema mora biti dovoljno stabilna za početnike, brzo se čistiti između grupa i izdržati svakodnevnu upotrebu u različitim vodenim uslovima.
      features:
        - Extra-stabilne SUP platforme (širine 32"+) za početnike
        - Tandem kajak opcije za ture za parove/grupe
        - Ugrađeni kapacitet za prtljag za opremu za ronjenje, suve torbe i hladnjake
        - CE + USCG dokumentacija o usklađenosti za komercijalne operacije
