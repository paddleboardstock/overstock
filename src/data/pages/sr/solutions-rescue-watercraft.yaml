content_challenge:
  tagline: Izazov
  title: Operacije spasavanja zahtevaju<br />Nepopustljivu pouzdanost
  subtitle: Organizacije za traganje i spašavanje rade pod ekstremnom odgovornošću za bezbednost — svaki kvar čamca nosi neprihvatljive posledice.
  paragraphs:
    - U spasilačkim operacijama, razlika između uspeha i neuspeha meri se u minutima. Čamac mora biti spreman za trenutni izlazak na vodu, raditi u težim uslovima i bezbedno se vratiti sa putnicima. Odgovornost za bezbednost je apsolutna — mehanički kvar tokom spasilačke misije nije trošak popravke, već izgubljen život.
    - SAR čamci treba da imaju visoku brzinu da brzo stignu do žrtava, u kombinaciji sa izuzetnom stabilnošću za sigurne operacije spašavanja. Moraju nositi spasilačku opremu, medicinske zalihe i komunikacionu opremu — često u ograničenom prostoru na palubi. Čamci koji rade u državnoj službi takođe trebaju dug vek trajanja (10-15+ godina) da bi opravdali budžet javnih nabavki.
    - Vidljivost, kako za operatera tako i za pretraživanje, je kritična. Dizajn komandnog konzola mora omogućiti vidljivost od 360 stepeni, a čamac treba biti visoko vidljiv za avione i druge plovne objekte.
    - Paddle Board Overstock spasilački RIBs su projektovani od kobilice naviše za ove zahteve — sa palubama koje samostalno otpuštaju vodu, ojačanim trupom, navigacionim sistemima i stubovima za vuču standardno na patrolnim modelima.
content_solution:
  tagline: Naše rešenje
  title: Specijalno dizajnirani spasilački RIBs
  subtitle: Svaki Paddle Board Overstock spasilački čamac je dizajniran da ispunjava ili premašuje SOLAS i nacionalne SAR standarde.
  list:
    - Paluba koja samostalno otpušta vodu — voda se automatski oslobađa radi stabilnosti tokom operacija spašavanja
    - Ojačani trup dubokog-V oblika — mogućnost plovidbe po valovitom moru sa predvidljivim rukovanjem pri velikim brzinama
    - Puna navigaciona svetlosna oprema — operativno danju i noću u svim vremenskim uslovima
    - Stub i uže za vuču — spremno za vuču plovila ili operacije sa spasilačkim sanke
    - Ploče za montažu opreme — radio, reflektor, sirena i medicinska oprema
    - Višestruke konfiguracije motora — jedna vanbrodska ili dvomotorna redundantnost
    - Boje cevi visoke vidljivosti — narandžasta, žuta ili crvena za maksimalnu vidljivost
content_segments:
  tagline: Profili za spašavanje
  title: Search & Rescue Watercraft rešenja<br />Prema tipu organizacije
  subtitle: Različite spasilačke organizacije rade pod različitim mandatima, budžetskim ciklusima i operativnim okruženjima - od obalnih volonterskih posada do nacionalnih flota obalske straže. Konfigurišemo svako spašavanje RIB tako da odgovara profilu misije.
  items:
    - title: Obalska straža i vladine agencije za traganje i spašavanje
      subtitle: Apsolutna odgovornost za bezbednost — kritični standardi flote
      description: Vladine agencije za spašavanje i spašavanje nose najveću odgovornost za bezbednost u pomorskim operacijama. Svaki brod mora da radi besprekorno u ekstremnim uslovima - kvar opreme tokom misije spašavanja nije opcija. Odluke o nabavci su vođene ukupnim troškovima vlasništva tokom 10-15 godina radnog veka, a ne unapred cenom. Agencijama su potrebna plovila koja prežive godine obalne patrole, ispunjavaju stroge nacionalne standarde i pružaju konzistentne performanse na distribuiranim stanicama. Sveobuhvatna dokumentacija o usklađenosti i višegodišnji ugovori o uslugama su obavezni.
      features:
        - SOLAS i paket dokumentacije o usklađenosti sa nacionalnim SAR standardima
        - Zajedništvo delova širom flote — smanjite složenost zaliha na nivou stanice
        - Konfiguracija sa dva motora za kritičnu redundantnost
        - 10-15 godina radnog veka dizajn sa planiranim programima održavanja
        - Sposobnost za sve vremenske uslove — ojačan duboko-V trup za nemirna stanja na moru
    - title: Spasilačka služba i usluge spašavanja na plaži
      subtitle: Operacije brzog lansiranja, plitke vode
      description: Opštinskim i plažnim spasilačkim službama kojima su potrebna plovila za brzo reagovanje koja mogu da se lansiraju kroz zone surfanja, rade u plitkim obalnim vodama i dođu do plivača ili ugroženih plovila u roku od nekoliko minuta. Oprema mora biti dovoljno lagana za vuču plaže malim vozilom ili ručno.
      features:
        - Trup plitkog nacrta RIB za surf zonu i priobalni rad
        - Plaža-lansiranje sposoban sa pramčanom ručkom za podizanje i kobilicom
        - Integrisana platforma za spašavanje ili plivač za spašavanje
        - Visoka vidljivost narandžaste ili žute boje cevi standard
    - title: Vatrogasne službe
      subtitle: Integracija vatrogasne pumpe, montaža opreme, brz odgovor
      description: Vatrogasne spasilačke jedinice reaguju na požare na obali, požare na brodovima i incidente spašavanja na vodi. Ovi brodovi moraju nositi vatrogasne pumpe, monitore, skladištenje creva i aparate za disanje - sve integrisano u stabilnu platformu brzog odziva. Odeljenja takođe koriste ove brodove za odgovor na poplave i operacije uzajamne pomoći. Rasporedi konzola moraju da prihvate kontrole pumpi, radio sisteme i osvetljenje u slučaju nužde bez ugrožavanja prostora na palubi za kretanje posade.
      features:
        - Pramčani vatrogasni monitor sa paketom za integraciju pumpe
        - Namenska montaža opreme za vatrogasnu pumpu, skladištenje creva i BA setove
        - Raspored konzole podesiv za kontrole pumpe, radio i osvetljenje u slučaju nužde
        - Samo-bailing paluba za gašenje požara vode otjecanje i stabilnost
        - 'Paket za noćne operacije: reflektor, osvetljenje scene, plava / crvena svetlosna traka'
    - title: Pomorska policija i lučka bezbednost
      subtitle: Zabrana, patrola, ukrcajne operacije
      description: Marine jedinice za sprovođenje zakona zahtevaju plovila sposobna za visokobrzinsko praćenje, ukrcavanje na sumnjiva plovila i patrolu sigurnosti u luci. Ovi brodovi moraju imati siguran prostor za opremu i oružje za sprovođenje zakona, integraciju komunikacije sa obalnom komandom i dovoljno prostora na palubi za operacije ukrcavale ekipe. Sposobnost noćnih operacija i nenapadni pristup su neophodni za misije zaplene.
      features:
        - Sposobnost visokobrzinske potrage — trup za glisiranje sa maksimalnom brzinom od 40 čvorova
        - Sigurni ormarić za oružje i pregrade za skladištenje opreme za sprovođenje zakona
        - Integracija konzole za policijski radio, MDT i komunikacione sisteme
        - 'Paket za noćne operacije: IR reflektor, FLIR nosač, prikriveno osvetljenje'
        - Ojačana ukrcajna platforma sa nelizajućom površinom
        - Plavo/crveno hitno osvetljenje i sistem sirene
    - title: Dobrovoljne SAR i neprofitne organizacije
      subtitle: Finansirane grantom, zajedničke obalske i jezerske operacije
      description: Spasilačke grupe zasnovane na zajednici rade u jezerima, rekama i obalnim područjima gde je pokrivenost spasilačkih službi od strane države ograničena. Često finansirane donacijama ili državnim subvencijama, ove organizacije trebaju maksimalnu sposobnost po uloženom dolaru — pouzdano, malo održavano plovilo koje volonteri mogu bezbedno upravljati uz minimalnu obuku. Cycles dobijanja subvencija znače da plovila moraju ispunjavati zahteve usklađenosti dok ostaju unutar fiksnih budžeta.
      features:
        - Konfiguracija sa jednim vanbrodskim motorom optimizovana za niže troškove nabavke i eksploatacije
        - PVC konstrukcija za niže održavanje i jednostavnu popravku u polju
        - Multifunkcionalna konzola koja minimizira elektronsku složenost za dobrovoljne operatere
        - Dokumentacija u skladu sa zahtevima za grant za prijave za finansiranje
        - Lagani dizajn za lansiranje na plaži bez posebnog prikolice ili krana
    - title: Spašavanje od poplava i reagovanje u slučaju katastrofa
      subtitle: Poplave u unutrašnjosti, plitke vode, okruženja puna krhotina
      description: Spasavanje od poplava je poseban operativni profil — čamci rade u poplavljenim urbanim područjima, rekama punim otpada i veoma plitkoj vodi gde su potopljene prepreke nevidljive. Operateri trebaju plovila koja mogu da se kreću po poplavljenim ulicama, probijaju se kroz otpad i izvlače žrtve iz zgrada i vozila. Sposobnost plitkog gazanja je ključna, kao i sposobnost rada u tekućoj vodi sa rizikom od zakačenja. Ovi čamci se često koriste od strane vatrogasnih službi, civilne zaštite i nevladinih organizacija za pomoć u katastrofama.
      features:
        - Ultra plitko gazno trup — radi u vodi dubine 30-50 cm
        - Luk koji odbija krhotine i ojačana zaštita cevi za potopljene prepreke
        - Samopražnjenje palube za oticanje poplavnih voda i spašavanje žrtava
        - Narandžaste ili žute cevi visoke vidljivosti za vazdušno izviđanje
        - Lagana konstrukcija za transport helikopterom i postavljanje na putu
        - Ojačane tačke za podizanje za dizalicu i spasilačke operacije užetom
