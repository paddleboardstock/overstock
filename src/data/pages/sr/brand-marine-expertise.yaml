hero:
  tagline: Marine Stručnost
  title: Decenije pomorskog inženjeringa<br />u svakom trupu
  subtitle: Paddle Board Overstock kombinuje duboko znanje o materijalima, preciznu proizvodnju i testiranje u stvarnom svetu kako bi proizveo plovila koja funkcionišu kada je to važno.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock tim za pomorski inženjering i istraživanje i razvoj na delu
expertise_materials:
  tagline: Nauka o materijalima
  title: Izbor pravog materijala<br />za svaku namenu
  subtitle: Radimo sa tri osnovna materijala — svaki odabran za specifične slučajeve upotrebe i zahteve u performansama.
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: 1100 denier PVC tkanina — naš najraznovrsniji materijal. UV-stabilizovana, otporna na habanje i usklađena sa REACH standardima. Idealna za rekreativne čamce, SUP daske i kajake gde su bitni težina i efikasnost troškova.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Superiorna hemijska otpornost i UV stabilnost. Hypalon čamci mogu trajati 15-20 godina uz odgovarajuću negu. Preporučuje se za komercijalne, spasilačke i vojne primene gde je dugoročna izdržljivost ključna.
      icon: tabler:shield
    - title: Staklena vlakna i aluminijum
      description: Trupi od staklenih vlakana Deep-V za RIBs i patrolne čamce — performanse koje režu talase u lošim uslovima. Aluminijumski trupovi za teške komercijalne radne čamce koji zahtevaju maksimalnu čvrstoću i nosivost.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Mogućnosti proizvodnje
  title: Precizna proizvodnja<br />na svakom koraku
  subtitle: Naš pogon od 12.000 m² opremljen je specijalizovanom mašinerijom za svaki korak proizvodnje.
  columns: 2
  items:
    - title: CNC Sečenje
      description: Sečenje pod kontrolom računara osigurava precizne, ponovljive tkanine sa minimalnim otpadom. Svaki deo pristaje tačno kako je dizajniran.
      icon: tabler:cpu
    - title: Visokofrekventno zavarivanje
      description: Industrijsko HF zavarivanje stvara šavove jače od osnovnog materijala. Kontrola temperature i pritiska osigurava vazdušno-zatvorene zaptivače u svakom proizvodnom ciklusu.
      icon: tabler:bolt
    - title: Sastavljanje Drop Stitch jezgra
      description: Hiljade poliesterskih niti povezuju gornje i donje slojeve tkanine, omogućavajući visoki pritisak napumpavanja (15-20 PSI) za čvrste, stabilne SUP daske i podove.
      icon: tabler:building-arch
    - title: Testiranje pritiska
      description: Svaki naduvani proizvod se testira pod pritiskom pre isporuke. RIB tube se testiraju na 1,25x nominalnog pritiska — ako izdrži, performiraće na vodi.
      icon: tabler:wind
    - title: Testiranje čvrstoće šavova
      description: Nasumični uzorci iz svake proizvodne serije podvrgavaju se destruktivnom testiranju čvrstoće šavova. Rezultati se evidentiraju i mogu se pratiti do specifičnih proizvodnih serija.
      icon: tabler:files
    - title: Testiranje na vodi
      description: Svaki RIB model prolazi ispitivanja na moru pre sertifikacije. Testiranje u realnim uslovima na obali potvrđuje performanse, upravljivost i stabilnost.
      icon: tabler:ripple
expertise_design:
  tagline: Dizajn i inženjering
  title: Projektovano za stvarne uslove
  subtitle: Naša filozofija dizajna počinje od toga kako će čamac biti korišćen — a zatim se inženjering gradi oko tog slučaja upotrebe.
  items:
    - title: Dizajn trupa Deep-V
      description: Naši fiberglas trupovi imaju proračunate uglove deadrise optimizovane za dužinu i namenu svakog modela. Strmiji V za performanse u nemirnoj vodi, plići za stabilnost.
    - title: Višenamenske komore za bezbednost
      description: Svaki čamac ima 3-7 nezavisnih vazdušnih komora. Ako je jedna komora kompromitovana, preostale komore održavaju čamac na vodi i funkcionalnim.
    - title: Ergonomski raspored
      description: Pozicija konzole, visina tubo i raspored sedišta dizajnirani su oko udobnosti operatera tokom dugotrajnog korišćenja — bilo da se patrolira, pecanjem ili transportuje.
    - title: Prilagođena konfiguracija
      description: Boje tubo, konfiguracija konzole, kapacitet goriva, nosači dodatne opreme — svaki model može biti prilagođen da odgovara specifičnim operativnim zahtevima.
