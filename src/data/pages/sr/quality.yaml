tests:
  - title: Testiranje pritiska
    standard: ISO 6185-1 | Interna Spec AF-PT-001
    description: Komore na naduvavanje su pod pritiskom do 1.25k preporučene radne granice i održavaju se 30 minuta. Propadanje pritiska se meri kako bi se potvrdila nepropusnost i strukturni integritet materijala i šavova.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Testiranje uticaja
    standard: Interna Speц AF-IT-002
    description: Proizvodi su podvrgnuti kontrolisanim uticajima od standardizovanih pada težine i klatna aparata. Ovo procenjuje otpornost na probijanje, širenje suza, i strukturnu otpornost protiv sudara sa preprekama, dokovima, i krhotine.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Testiranje otpornosti
    standard: ASTM G154 |ISO 4892-3
    description: Uzorci materijala su izloženi UVA-340 lampama u ubrzanim vremenskim komorama za 1.000+ sati. Merimo promenu boje (Delta E), zadržavanje sjaja i gubitak zatezne čvrstoće kako bismo potvrdili UV pakete stabilizatora.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Testiranje otpornosti na abraziju
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Uzorci materijala su podvrgnuti CS-10 abrazivnim točkovima pod 500g / 1,000g opterećenja za 1,000 ciklusa. Gubitak mase i vizuelno ocenjivanje habanja određuju trajnost premaza protiv peska, šljunka i ponovljenog lansiranja.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Testiranje performansi na niskim temperaturama
    standard: Interna specifikacija AF-LT-003 | MIL-STD-810G
    description: Sastavljeni proizvodi i kuponi za materijal se kondicioniraju na -20 ° C, -10 ° C i 0 ° C tokom 24 sata, a zatim se testiraju fleksibilno. To potvrđujemo PVC i Hypalon ostajemo fleksibilni bez pucanja ili raslojavanja.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Ispitivanje plovnosti i nosivosti
    standard: ISO 6185-1 |ISO 12402
    description: Proizvodi se inkrementalno učitavaju do 1.25k nominalnog kapaciteta u kontrolisanom bazenu. Beleže se nadvođe, stabilnost i performanse samopražnjenja. Nazivni kapacitet svakog modela je matematički i empirijski verifikovan.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Testiranje manevrisanja
    standard: Interna Speц AF MT-004
    description: Ispitivanja na vodi mere radijus okretanja, ubrzanje, vreme planiranja i odziv vesla / motora u nizu uslova opterećenja. Karakteristike rukovanja u stvarnom svetu su potvrđene u odnosu na ciljeve dizajna.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Ispitivanje vodonepropusnosti
    standard: ISO 6185-1 §7.3 | Interna specifikacija AF-WT-005
    description: Svaki sklopljeni proizvod je testiran sprejom na 0,5 bara na svim šavovima, ventilima i armaturama. 5-minutni test potapanja pod pritiskom potvrđuje vodonepropusnost komore i ventila. Standard nultog curenja pre isporuke.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
