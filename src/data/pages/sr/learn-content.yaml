articles:
  sup:
    - title: SUP Osnove — Vodič za početnike
      desc: Sve što početnik treba da zna — tipovi dasaka, veličina reketa, stav i saveti za prvi dan.
    - title: SUP Vodič za veličinu
      desc: Pronađite pravu dužinu, širinu i zapreminu daske za vašu težinu, veštinu i stil veslanja.
    - title: Naduvavanje vs hard odbor
      desc: Koji je pravi za vas? Upoređeni prenosivost, performanse, izdržljivost i cena.
    - title: Srednji tehnike
      desc: Unapredi svoje veslanje uz napredne udarce, tehnike okretanja i upravljanje na nemirnoj vodi.
    - title: Kako izabrati naduvavajući SUP
      desc: Pratite ključne faktore — konstrukcija, debljina, postavljanje peraja i uključeni dodaci.
    - title: Bezbednost vode
      desc: Osnovno znanje o bezbednosti uključujući čitanje vremenskih prilika, PFD izbor, samopomoć i grupno veslanje.
  inflatable-boat:
    - title: Priručnik za materijale
      desc: PVC, Hypalon, drop-stitch, denier ocene — razumite od čega je napravljena vaša naduvavajuća oprema.
    - title: PVC vs Hypalon
      desc: Definitivno poređenje PVC i Hypalon tkanina za naduvavajuće čamce — izdržljivost, UV otpornost i cena.
    - title: Drop-Stitch Jezgro Objašnjeno
      desc: Kako hiljade unutrašnjih niti stvaraju čvrstu platformu na 12-15 PSI za visokoperformansne naduvavajuće SUPs.
    - title: Pregled tehnologije naduvavanja
      desc: Kako se prave naduvavajući čamci i SUPs — od slojeva materijala do sistema ventila i zavarivanja šavova.
    - title: Vodič za rigidne naduvavajuće čamce (RIB)
      desc: Sve o RIB konstrukciji, tipovima trupa, materijalima cevi i izboru pravog RIB za vaše potrebe.
    - title: Naduvavajući čamac vs RIB
      desc: Ključne razlike između tradicionalnih naduvavajućih čamaca i rigidno-trupnih naduvavajućih čamaca za različite namene.
  water-safety:
    - title: Vodič za bezbednost vode
      desc: Osnovno znanje o bezbednosti za svakog veslača — vremenske prilike, PFD uređaji, samopomoć i protokoli grupnog veslanja.
    - title: Vodič za prsluke za spašavanje i PFD
      desc: Kako izabrati pravi lični uređaj za plovnost za SUP, kajak, čamce i profesionalnu upotrebu.
    - title: SUP Kontrolna lista bezbednosti
      desc: Pre-lansirna kontrolna lista bezbednosti koju svaki veslač na stand-up dasci treba da prati pre ulaska u vodu.
    - title: Bezbednost kajakarenja u hladnoj vodi
      desc: Osnovne mere predostrožnosti, oprema i tehnike za kajakarenje u hladnim vodenim uslovima.
    - title: Greške početnika u kajakarenju
      desc: Uobičajene greške koje prave osobe koje prvi put kajakare i kako ih izbeći za bezbednije i prijatnije iskustvo.
    - title: CE Objašnjenje sertifikacije
      desc: Šta CE sertifikacija znači za naduvavanje vodenih plovila — standardi, testiranje i zašto je važna za bezbednost.
ui:
  read_guide: Pročitajte vodič →
  card_tech: Inženjering morske bezbednosti i testiranje materijala
  card_products: Istražite ceo Aquafarer katalog proizvoda
  card_trust: CE, ISO i BSCI usklađenost
materials:
  intro_p1: Performanse, izdržljivost i bezbednost naduvavnog plovila gotovo u potpunosti zavise od materijala korišćenih u njegovoj izradi. Od tkanine koja formira cevi do konaca koji pružaju SUP dasci njenu čvrstinu, svaki izbor materijala utiče na to kako proizvod funkcioniše na vodi i koliko dugo traje.
  intro_p2: 'Ovaj vodič pokriva četiri osnovna materijala korišćena u modernim naduvavnim plovilima: PVC tkanina, Hypalon CSM guma, drop-stitch konstrukcija jezgra i EVA penasta paluba. Razumevanje ovih materijala pomoći će vam da odaberete pravi proizvod za svoje potrebe i održavate ga za maksimalan vek trajanja.'
  labels:
    advantages: Prednosti
    limitations: Ograničenja
    best_for: 'Najbolje za:'
  items:
    - name: PVC (Polivinil hlorid)
      summary: Industrijski standard za rekreativne naduvane čamce i SUPs. Višeslojna laminirana tkanina nudi odličan odnos čvrstoće i težine po pristupačnoj ceni.
      pros:
        - Pristupačno — 30-50% jeftinije od Hypalon
        - Lako i jednostavno za rukovanje
        - Dobra otpornost na UV uz odgovarajuće premaze
        - Širok izbor boja i završnih obrada
        - Jednostavno za popravku sa PVC zakrpama i rastvaračkim lepkovima
      cons:
        - Kraći vek trajanja od Hypalon (7-10 godina)
        - Manje fleksibilno na niskim temperaturama
        - Niža hemijska otpornost
        - Može doći do migracije plastifikatora tokom vremena
      best_for: Rekreativni SUPs, čamci pogodni za budžet, flote za iznajmljivanje, sezonska upotreba, slatka i obalna voda.
    - name: Hypalon (CSM Guma)
      summary: Premijum sintetički gumeni materijal poznat po izuzetnoj izdržljivosti, otpornosti na UV i dugovečnosti. Zlatni standard za komercijalne i vojne naduvne čamce.
      pros:
        - Izuzetna otpornost na UV i ozon
        - Vek trajanja 15-20 godina uz pravilnu negu
        - Odlična fleksibilnost na niskim temperaturama
        - Superiorna otpornost na hemikalije i ulja
        - Zadržava boju duže od PVC
      cons:
        - Značajno skuplji od PVC
        - Teža tkanina
        - Manje opcija boja
        - Popravke zahtevaju specijalizovana lepila
        - Manje proizvodnih postrojenja širom sveta
      best_for: Komercijalna RIBs, potraga i spasavanje, vojne primene, tropske klime, dugoročno vlasništvo flote.
    - name: Drop-Stitch Jezgro
      summary: Tehnologija koja je revolucionisala naduvavanje SUPs. Hiljade poliesterskih niti povezuju gornji i donji sloj tkanine, omogućavajući visok pritisak inflacije za čvrst, hard-shell performans.
      pros:
        - Ekstremno rigidno pri 12-20 PSI
        - Lako — 18-30 lbs za full-size dasku
        - Presavija se ravno za čuvanje i putovanja
        - Odlična otpornost na udarce
        - Konzistentne performanse kroz temperaturne rasponе
      cons:
        - Zahteva pumpu za visok pritisak
        - Popravka bušenja složenija nego kod jednoslojne
        - Veći trošak proizvodnje nego kod standardnih naduvavanja
        - Gubitak pritiska tokom vremena zahteva povremeno dopunjavanje
      best_for: Daska za stajanje na vodi (stand-up paddle), kajaci, vazdušni podovi za naduvavanja čamaca, sve primene koje zahtevaju čvrste performanse sa prenosivom naduvavanjem.
    - name: EVA Peni Stol
      summary: Zatvoreni EVA (etilen-vinil acetat) peni korišćen za podloge za prijanjanje na SUP daskama i palubama čamaca. Pruža jastuk, prijanjanje i termalnu izolaciju.
      pros:
        - Odličan protivklizni prijanjanje mokro ili suvo
        - Jastuk smanjuje zamor pri dugim veslanjima
        - Termalna izolacija od hladne palube
        - UV i otporan na slanu vodu
        - Dostupan u više boja blok dizajnima i laserski ugraviranim uzorcima
      cons:
        - Može izdržati tešku upotrebu tokom 2-3 godine
        - Mora biti pravilno povezano da bi se sprečilo ljuštenje
        - Nije strukturno — ne utiče na čvrstoću
        - Dodaje malu težinu (200-400 g po tabli)
      best_for: SUP prianjanje na palubi, podloga na palubi čamca, udobnost sedišta kajaka, bilo koja površina koja zahteva neskliznu podlogu.
  selection:
    title: Vodič za izbor materijala
    subtitle: 'Izaberite odgovarajući materijal na osnovu primarne upotrebe:'
    headers:
      - Koristite slučaj
      - Preporučeni materijal
      - Zašto
    rows:
      - - Rekreativno SUP veslanje
        - Drop-stitch PVC
        - Lagan, čvrst, pristupačan — idealna ravnoteža za povremene veslače
      - - Porodični čamac / jezerski čamac
        - PVC (1100 denier)
        - Isplativo, lako za popravku, dovoljna izdržljivost za rekreativnu upotrebu
      - - Komercijalni RIB / patrolni čamac
        - Hypalon CSM
        - Maksimalna UV otpornost, životni vek 15-20 godina, otpornost na hemikalije/ulja
      - - Iznajmljivanje flote SUP dasaka
        - Drop-stitch PVC + EVA paluba
        - Izdržljiv, popravljiv, dobra vrednost za upotrebu sa velikim prometom
      - - Operacije potrage i spašavanja
        - Hypalon CSM
        - Pouzdanost u ekstremnim uslovima, fleksibilnost na hladnoći, hemijska otpornost
      - - Turing / ekspedicioni kajak
        - Drop-stitch PVC
        - Čvrste performanse sa prenosivom skladišnom funkcijom za putovanja
  deep_dive:
    title: Vodiči za dubinsko proučavanje
    topics:
      - title: Morski kvalitet PVC
        desc: Višeslojna laminirana PVC tkanina — UV otpornost, testiranje habanja i objašnjene denier ocene.
      - title: PVC vs Hypalon
        desc: Definitivno poređenje dva dominantna materijala za napuhljive čamce — cena, životni vek, UV otpornost.
      - title: Drop-Stitch Jezgro
        desc: Kako hiljade unutrašnjih niti stvaraju čvrste, visokopritisne napuhljive strukture na 12-15 PSI.
      - title: RF Tehnologija Zavarivanja
        desc: Visokofrekventno zavarivanje stvara jake, konzistentne šavove — kako funkcioniše i zašto je važno.
      - title: PSI & Performanse
        desc: Zašto je vazdušni pritisak važan za napuhavajuće SUPs i čamce — čvrstoća, nosivost i kvaliteta vožnje.
      - title: Testiranje Kvaliteta
        desc: Testiranje pritiska, testovi plovnosti, UV starenje i destruktivno testiranje — naš proces kontrole kvaliteta.
      - title: EVA Penasti Tereti
        desc: Podloge od pene zatvorenih ćelija EVA — prianjanje, udobnost i izdržljivost za SUP i palube čamaca.
      - title: Briga o Materijalima
        desc: Čišćenje, UV zaštita, prevencija plesni i najbolje prakse skladištenja za napuhavajuće proizvode.
