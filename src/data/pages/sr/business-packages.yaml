faq:
  title: FAQ za pakete
  questions:
    - q: Koja je minimalna količina porudžbine za pakete?
      a: Klubski početni paket ima minimum od 10 jedinica. Paket za odmor i paket za brend prilagođeni su vašim potrebama sa fleksibilnim MOQs.
    - q: Koliko traje isporuka?
      a: Standardna proizvodnja traje 30–45 dana od potvrde porudžbine. Ubrzana proizvodnja je dostupna uz dodatnu naknadu.
    - q: Mogu li prilagoditi boje opreme i brendiranje?
      a: Da. Svi paketi uključuju potpunu prilagodbu — boje dasaka, štampu logotipa i dizajn pakovanja.
    - q: Da li pružate podršku nakon prodaje?
      a: Da. Svaki paket uključuje pristup našim online vodičima za održavanje, video tutorijalima i sistemu za naručivanje rezervnih delova.
