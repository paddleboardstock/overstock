content_challenge:
  tagline: Izazov
  title: Zahtevi za akvakulturu<br />Slana voda-Tough Oprema
  subtitle: Ribogojilišta, farme bisera i okeanski rančevi rade u hemijski najagresivnijem morskom okruženju - produženom izlaganju slanoj vodi, ostacima goriva i hrane i kontinuiranoj svakodnevnoj upotrebi.
  paragraphs:
    - Operacije akvakulture rade KSNUMKS dana u godini u izloženim obalnim i offshore sredinama. Radni brodovi koji se koriste za inspekciju kaveza, transport hrane, održavanje bisernih linija i servisiranje opreme suočavaju se sa stalnim uranjanjem u slanu vodu, UV izlaganjem i hemijskim kontaktom sa gorivima, hranom za ribe i tretmanima protiv obraštanja.
    - '** Korozija je primarni neprijatelj ** - Standardna pomorska oprema se brzo pogoršava u ovim uslovima. Vanbrodski motori, okviri prikolice i oprema trupa trebaju stalnu zamenu. Operaterima su potrebni brodovi izgrađeni od materijala otpornih na koroziju koji mogu preživjeti godine u ovom okruženju bez degradacije.'
    - '** Dnevna pouzdanost je kritična ** - Slomljeni radni brod znači propuštene rasporede hranjenja, odložene žetve i skupe gubitke u proizvodnji. Za farme bisera, jedan dan propuštene inspekcije može značiti značajnu štetu na usjevima. Za ribogojilišta, odloženo hranjenje utiče na stope rasta i profitabilnost.'
    - Aquafarer Akvakultura RIBs je projektovana sa hardverom otpornim na koroziju Hypalon , teškim cevima i ojačanim trupovima dizajniranim specijalno za zahtevne uslove uzgoja ribe, uzgoja bisera i operacija okeanskog ranča.
content_solution:
  tagline: Naše rešenje
  title: Namenski izgrađen RIBs<br />Za industriju akvakulture
  subtitle: Svaki Aquafarer radni brod za akvakulturu dizajniran je da izdrži agresivna okruženja sa slanom vodom, a istovremeno pruža pouzdane dnevne performanse.
  list:
    - Hypalon Cevi morskog razreda — superiorna otpornost na UVslanu vodu, goriva i hemikalije za hranu za ribe
    - 316 hardver od nerđajućeg čelika - bez rđe u produženom izlaganju slanoj vodi
    - Ojačane trake za trljanje i štitnik kobilice za ponovljeni kontakt sa pristaništem i kavezom
    - Samo-bailing paluba za lako pranje i odvodnjavanje nakon transporta hrane i žetve operacija
    - Ravna konfiguracija palube za prevoz vreća sa hranom, žetvenih korpi i opreme
    - Izvedbe sa vanbrodskim motorima od 15 HP do 60 HP — optimizovane za odnos korisnog tereta i potrošnje goriva
    - Opcije boja cevi sa visokom vidljivošću za lako uočavanje na velikim površinama farme
content_segments:
  tagline: Profili akvakulture
  title: Rešenja za radne brodove<br />Po tipu akvakulture
  subtitle: Različite akvakulturne operacije imaju različite zahteve za radne brodove — od malih agilnih RIBs za inspekciju ribljih kaveza do stabilnih transportnih platformi za uzgoj bisera i teških radnih brodova za okeanski uzgoj.
  items:
    - title: Operacije u ribarstvu
      subtitle: Inspekcija kaveza, transport hrane, podrška žetvi
      description: Morske ribarske farme koriste kaveze na izloženim obalnim i offshore lokacijama. Radni brodovi se svakodnevno koriste za inspekciju mreža kaveza, hranidbene operacije, podršku žetvi i održavanje opreme. Glavni izazov je korozija — brodovi su stalno izloženi slanoj vodi, ostacima riblje hrane i gorivu. Pouzdan radni brod je ključan jer propuštena hranidba ili odložena žetva direktno utiču na proizvodnju i profitabilnost.
      features:
        - 'Paket za agresivno okruženje: hardver od 316 nerđajućeg čelika, komponente od legure morske klase'
        - Raspored ravne palube za transport vreća sa hranom i korpi za žetvu
        - Samoprazneća paluba za lakše pranje nakon operacija
        - Hypalon cevi sa hemijski otpornim premazom na izloženost hrani i gorivu
        - Ojačani rubnici za čestu interakciju sa kavezima i pristaništima
    - title: Operacije u uzgoju bisera
      subtitle: Stabilan transport za inspekciju bisernih linija i žetvu
      description: Farma bisera zahteva stabilne, pouzdane radne brodove za svakodnevni transport između bisernih linija, inspekciju mreža ostriga i prikupljanje žetve. Ove operacije se odvijaju na udaljenim obalnim lokacijama sa ograničenom infrastrukturom za održavanje. Brod mora biti dovoljno stabilan da posada može raditi tokom inspekcije bisernih linija, sa jednostavnim ukrcajem i dovoljno palubnog prostora za prevoz ubrani ostriga, mreža i zaliha. Pouzdanost i lako održavanje su ključni na udaljenim farmama.
      features:
        - Stabilan dizajn trupa za stajanje posade tokom inspekcije bisernih linija
        - Ravna paluba sa nelepljivom površinom za sigurno kretanje posade
        - Niska bočna ograda za lak pristup mrežama i žetvi ostriga
        - Jednostavna konfiguracija vanbrodskog motora za lako servisiranje na licu mesta
        - Otporn paket cevi i hardvera na koroziju za kontinuirano izlaganje slanoj vodi
    - title: Okeanski uzgoj i poboljšanja u morskom okruženju
      subtitle: Transport mladih, servisiranje kaveza, podrška u nadzoru
      description: Operacije okeanskog uzgoja uključuju puštanje mladunaca u kontrolisane morske sredine, nadzor rasta i servisiranje struktura za poboljšanje. Radni brodovi moraju transportovati žive mladunce u aeriranim kontejnerima, nositi opremu za nadzor i pristupati plitkim obalnim lokacijama za puštanje. Dizajn trupa mora balansirati između nosivosti i plitkog gaza za pristup plažama i ušćima.
      features:
        - Palubni prostor za aerirane kontejnere za transport mladunaca i opremu za nadzor
        - Plitak gaz za pristup plažama i ušćima
        - Jednostavno prizemljavanje na plaži — ojačano kobilasto dno i zaštita pramca
        - Tačke za montažu opreme za nadzor i uzorkovanje
        - Teški Hypalon tubusi za izdržljivost u uslovima mešane peskovite i morske vode
