  tagline: Bezbednost
  title: Standardi i sertifikacija bezbednosti
  subtitle: Svaki Aquafarer proizvod prolazi rigorozna testiranja, a 64 CE sertifikovana modela zadovoljavaju međunarodne standarde bezbednosti za rekreativnu i profesionalnu upotrebu. ISO 9001 sertifikovana fabrika.
