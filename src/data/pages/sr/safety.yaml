certifications:
  - title: CE Sertifikacija (EU 2016/425)
    standard: Uredba o PPE (EU) 2016/425 | EN ISO 12402
    description: Sve Aquafarer sigurnosne opreme zadovoljavaju zahteve CE označavanja u skladu sa Evropskom Uredbom o ličnoj zaštitnoj opremi. Svaki proizvod je nezavisno testiran od strane TÜV Rheinland, evropskog Nominovanog Tela. Naše gumene čamce i RIBs zadovoljavaju zahteve Direktive o rekreativnim plovilima 2013/53/EU (RCD), kategorija C i D.
    body: CE sertifikacija pokriva suštinske zahteve zdravlja i bezbednosti za lične plutajuće sprave i naduvavajuća plovila. TÜV Rheinland vrši godišnje audite naše proizvodne fabrike kako bi potvrdio kontinuiranu usklađenost.
  - title: SOLAS — Bezbednost života na moru
    standard: SOLAS Poglavlje III | LSA kodeks
    description: Life Vest Pro je u skladu sa SOLAS propisima za operacije na otvorenom moru i komercijalne pomorske aktivnosti. Testiran za zadržavanje plutanja 24 sata, automatsko napuhavanje prilikom uranjanja i performanse u morskim stanjima do sile vetra 5. Zadovoljava zahteve Poglavlja III za prsluke za spasavanje na komercijalnim plovilima.
    body: SOLAS odobrenje zahteva nezavisno testiranje od strane nominovanog tela za plutanje, čvrstoću, vidljivost i automatsko aktiviranje. Naš Life Vest Pro nosi punu SOLAS tip odobrenja sa MED sertifikacijom.
  - title: USCG Tip III / Tip V
    standard: 46 CFR Deo 160 | USCG Odobrenje
    description: Izabrani Aquafarer prsluci za spašavanje zadovoljavaju klasifikaciju Obalske straže SAD za Tip III (pomagala za plutanje) i Tip V (uređaji za specijalnu upotrebu). Pogodni za zaštićene vode, obalna krstarenja i komercijalne operacije koje zahtevaju USCG-odobrene PFD-ove.
    body: USCG odobrenje zahteva testiranje od strane nezavisne laboratorije priznate od CG. Tip V odobrenje uključuje hibridne naduvavajuće dizajne koji zahtevaju ručno ili automatsko aktiviranje.
  - title: BSCI Socijalna usklađenost
    standard: amfori BSCI Kodeks ponašanja
    description: Naša fabrika se godišnje revidira u okviru inicijative amfori Business Social Compliance Initiative (BSCI). Ovo verifikuje etičku praksu rada, bezbednost na radu, pošteno radno vreme i upravljanje životnom sredinom u našoj proizvodnoj hali od 12,000 m².
    body: BSCI usklađenost je preduslov za evropske trgovce i uvoznike. Naša trenutna BSCI ocena je "C" (Dobar), reviziju vrši SGS.
  - title: REACH & RoHS Usklađenost
    standard: Uredba EU REACH (EC) 1907/2006 |RoHS Direktiva 2011/65/EU
    description: PVC Sva jedinjenja, lepkovi i premazi koji se koriste u Aquafarer proizvodima u skladu su REACH sa propisima EU o hemijskoj bezbednosti i RoHS ograničenjima opasnih materija. Listovi sa sigurnosnim podacima (MSDS) dostupni su za svaku liniju proizvoda.
    body: REACH usklađenost osigurava da nema ograničenih SVHC supstanci iznad graničnih granica. Redovno laboratorijsko testiranje treće strane potvrđuje stalnu usklađenost za svaku proizvodnu seriju.
  - title: ISO 9001:2015 Menadžment kvalitetom
    standard: ISO 9001:2015 |TÜV Rheinland sertifikovan
    description: 'Naš sistem upravljanja kvalitetom je ISO 9001: 2015 sertifikovan od strane TÜV Rheinland, koji pokriva dizajn, proizvodnju, testiranje i uslugu nakon prodaje. Godišnje revizije nadzora obezbeđuju kontinuirano poboljšanje i kontrolu procesa.'
    body: ISO 9001 sertifikacija zahteva dokumentovane politike kvaliteta, interne revizije, preglede menadžmenta, procedure korektivnih mera i sledljive evidencije o proizvodnji.
testimonial:
  quote: Nabavili smo sigurnosnu opremu od više dobavljača širom Azije.Aquafarer je jedini proizvođač koji je CE unapred obezbedio potpunu SOLAS dokumentaciju, sertifikate i izveštaje o ispitivanju nezavisnih proizvođača - bez pitanja.
  author: Srpskohrvatski / srpskohrvatski
  title: Službenik za bezbednost
  company: Baltički morski snabdevanje
  location: Finska
content_overpressure:
  tagline: Bezbednost nad pritiskom
  title: RIB Pritisak cevi<br />Menadžment u toplim klimatskim uslovima
  subtitle: Pritisak cevi na naduvavanje raste sa temperaturom. Razumevanje i upravljanje nadpritiskom sprečava oštećenja i obezbeđuje bezbedan rad u tropskim i pustinjskim sredinama.
  items:
    - title: Bojl pritiska ventili
      description: Aquafarer RIB Cevi su opremljene ventilima za smanjenje pritiska koji automatski odzračuju višak pritiska iznad nominalnog maksimuma. Sprečava naprezanje šava i potencijalno pucanje cevi od solarnog grejanja.
      icon: tabler:gauge
    - title: Promena pritiska od jutra do podneva
      description: Cev naduvana na 3,5 PSI na 20 C može dostići 4,5+ PSI na 40 C izlaganja suncu. Uvek naduvajte do donjeg kraja preporučenog opsega u toplim klimatskim uslovima i pustite da sigurnosni ventil upravlja viškom pritiska.
      icon: tabler:sun
    - title: Preporučeni radni pritisci
      description: 'PVC cevi: 3.0-3.5 PSI operativni, 4.5 PSI mak. Hypalon cevi: 3.5-4.0 PSI radni, 5.0 PSI maks. Uvek testirajte na 1.25k ocijenio (4.4 PSI za PVC, 5.0 PSI zaHypalon) po Aquafarer KC standardima.'
      icon: tabler:chart-bar
    - title: Najbolje prakse izlaganja suncu
      description: Čuvati RIBs u osenčenim područjima kada nije u upotrebi. Koristite UV-zaštitne poklopce za produženi privez. Proverite i podesite pritisak cevi pre i posle vrhunca sunčanih sati. Nikada ne prekoračite maksimalni nazivni pritisak.
      icon: tabler:umbrella
    - title: Hitno smanjenje pritiska
      description: Ako cev oseća preterano čvrst ili sigurnosni ventil se odzračivanje, oslobodite vazduh preko Halkei-Roberts ili vojnog ventila dok se pritisak ne vrati u radni opseg. Nosite manometar za precizna očitavanja.
      icon: tabler:alert-circle
