content_challenge:
  tagline: Izazov
  title: Ribarski brodovi Need<br />Stabilnost, opseg i izdržljivost
  subtitle: Bez obzira da li upravljate komercijalnim ribarskim brodovima, upravljate kooperativnom flotom ili vodite ribolovne povelje - vaš brod mora pouzdano obavljati svaki dan.
  paragraphs:
    - Ribarskim brodovima su potrebne stabilne platforme za radne linije, rukovanje ulovom i bezbedno kretanje po palubi. Gumenjaci i RIBs nude svojstvenu stabilnost kroz dizajn cevi - značajna prednost u odnosu na krute trupove slične dužine.
    - Efikasnost goriva je važna za ribolovne operacije u kojima operativni troškovi direktno utiču na profitabilnost.RIBs I čamci na naduvavanje su lakši od ekvivalentnih krutih čamaca, zahtevaju manje energije i sagorevaju manje goriva - kritično za komercijalne operatere koji svakodnevno pokreću čamce i zadruge koje upravljaju budžetima flote.
    - Trajnost u morskim sredinama je od suštinskog značaja. Slana voda UV , izloženost i stalna upotreba zahtevaju materijale koji mogu da izdrže teške uslove bez degradacije. Za komercijalne i kooperativne operatere, pouzdanost direktno utiče na prihode - slomljen brod znači izgubljene ribolovne dane.
    - Paddle Board Overstock Ribolov konfiguracije uključuju držače štapova, fishfinders, mamac bunare, livevells, i rukovanje teretom rešenja dizajnirana za ozbiljne ribolovne aplikacije u komercijalnim, kooperativnim i rekreativnim operacijama.
content_solution:
  tagline: Naše rešenje
  title: Konfiguracije spremne za ribolov
  subtitle: Svaki Paddle Board Overstock ribarski brod može biti konfigurisan za vašu specifičnu ribolovnu aplikaciju.
  list:
    - Montaža držača štapa — fabrički instalirana ili spremna za naknadnu ugradnju
    - Fishfinder / GPS montažna ploča na položaju konzole
    - Mamac i ili livevell opcije za čarter i komercijalne operatere
    - Konfiguracije hladnjaka / skladištenja za rukovanje ulovom
    - Deep-V trup za offshore sposobnost - stabilan u mirovanju, glatka pri brzini
    - PVC ili Hypalon opcije tubo — Hypalon za produženu UV izloženost
    - Vanbrodski opseg od 15 HP do 115 HP u zavisnosti od modela i primene
content_segments:
  tagline: Profil ribolova
  title: Rešenja za ribolov sa napuhavanim čamcima<br />Po tipu operatera
  subtitle: Od sportskog ribolova u priobalju do komercijalnog dugolinijskog ribolova — različite ribolovne operacije zahtevaju različite konfiguracije trupa, raspon snage i postavke na palubi. Mi prilagođavamo svaki čamac tako da odgovara ribolovu, vodama i stilu rada.
  items:
    - title: Komercijalne ribolovačke kompanije
      subtitle: Radni čamci flote za svakodnevne ribolovne operacije, rukovanje mrežama, transport ulova
      description: Komercijalne ribolovačke kompanije koriste radne čamce za postavljanje i izvlačenje mreža, održavanje klopki, dugolinijski ribolov i transport ulova. Ovi čamci rade svaki dan u slanim vodama i moraju izdržati teška opterećenja, stalno rukovanje na palubi i duže radne sate. Efikasnost goriva i nisko održavanje su ključni za profitabilnost flote. Plovilo mora pružiti stabilne radne platforme za posadu koja rukuje opremom i ulovom u različitim uslovima mora.
      features:
        - Ravna paluba za rukovanje mrežama, slaganje klopki i skladištenje ribe
        - Štedljiv 40-115 HP vanbrodski motor za nizak dnevni trošak rada
        - Teški Hypalon tube za otpornost na habanje pri svakodnevnoj upotrebi
        - Ojačani rubni limovi za česte kontakte sa dokom i plovilom
        - Samoprazneća paluba za lakše pranje nakon operacija
        - Cene flote i dosledna specifikacija za operatore sa više plovila
    - title: Operatori šaranskog ribolova na najam
      subtitle: Komfor za više putnika, rukovanje ulovom, sertifikovana bezbednost
      description: Operateri koji vode poludnevne i celodnevne ribolovne ture — od ribolova na priobalnim grebenima do dubokomorskog ribolova sa dna. Vaš čamac treba sedišta za putnike sa sertifikatima bezbednosti, dovoljno prostora na palubi za više ribolovaca i integrisane žive bunare za očuvanje mamca i ulova sve vreme ture. Komfor gostiju direktno utiče na ocene ture, ponovne rezervacije i online ocene.
      features:
        - Konzolno upravljanje sa amortizovanim sedištima
        - Fabricki ugrađeni držači štapova (4–8 pozicija)
        - Vanbrodski raspon od 60–115 HP za brzine na otvorenom moru
        - CE Kategorija C ili B sertifikacija za komercijalni prevoz putnika
        - Bimini ili T-top suncobran za komfor gostiju na dužim turama
    - title: Artizanski i mali komercijalni ribari
      subtitle: Pouzdani radni čamci za svakodnevni život
      description: Nezavisni ribari koji se oslanjaju na svoj čamac kao glavni izvor prihoda — postavljanje mreža, održavanje ribolovačkih klopki ili ribolov štapom blizu obale. Vaš prioritet je ekonomičnost goriva, jednostavno održavanje koje možete sami obaviti i čamac koji može da nosi umerene količine ulova i opreme bez gubitka stabilnosti.
      features:
        - Štedljiv 15–40 HP vanbrodski motor za nizak trošak rada
        - Hypalon CSM tube za produženu UV i otpornost na habanje
        - Ravna paluba za rukovanje mrežama i skladištenje ribe
        - Lako iskrcavanje na plaži sa zaštitom napuhivim kobilicom
    - title: Ribolovačke zadruge
      subtitle: Prikupljanje ulova, prevoz članova, distribucija zaliha
      description: Ribarske zadruge upravljaju flotama zasnovanim na zajednici za prikupljanje ulova od članova ribara, transportovanje zaliha do udaljenih ribarskih zajednica i distribuciju žetve na tržišta. Ovi radni brodovi trebaju veliku nosivost, pouzdan svakodnevni rad i jednostavno održavanje na udaljenim lokacijama. Zadruge često rade u zemljama u razvoju gde je dostupnost delova i pristup servisima ograničen, što čini jednostavne konfiguracije vanbrodskih motora i izdržljivu konstrukciju neophodnim.
      features:
        - Visok kapacitet nosivosti za prevoz ulova i zaliha
        - Jednostavna konfiguracija vanbrodskog motora za lako servisiranje na licu mesta
        - Teška PVC ili Hypalon konstrukcija za fleksibilnost budžeta
        - Ravna platforma sa tačkama za vezivanje za pričvršćivanje tereta
        - Efikasan rad sa gorivom koji minimizira zajedničke operativne troškove
    - title: Ljubitelji sportskog i rekreativnog ribolova
      subtitle: Performanse i stil za ozbiljne pecaroše
      description: Iskusni ribolovci koji traže sposobnu ribolovačku platformu koja pruža brzinu do dalekih lovišta, stabilne pozicije za stajanje tokom borbe s ribom i vrhunski završni izgled i kvalitet. Čamac mora delovati kao kod kuće bilo da ide dva milje od obale do grebena ili istražuje udaljene estuarne rukavce.
      features:
        - Deep-V RIB trup za glatku vožnju po talasima
        - Plata za montažu Fishfinder/GPS-a prethodno ožičena na konzoli
        - Baitwell i hladnjak integrisani u modul zadnje sedište
        - Prilagođene opcije boja špila EVA koje odgovaraju grafici čamca/cevi
    - title: Vodič za pecanje i operateri eko-tura
      subtitle: Vođeni ribolovački doživljaji za posetioce-ribolovce
      description: Vodiči koji vode male grupe posetilaca ribolovaca na produktivna mesta za pecanje — često kombinujući ribolov sa elementima ekoturizma kao što su posmatranje ptica ili istraživanje mangrova. Čamac mora ploviti suvo i biti udoban za goste koji nisu navikli na male čamce, sa lakim ukrcavanjem i opcijama za hladovinu.
      features:
        - Tačke za montažu Bimini krova ili T-krova fabrički ugrađene
        - Glatka ulazna ljestvа za jednostavno ponovo ukrcavanje
        - Tihi 4-taktni vanbrodski motor za minimalno ometanje
        - Suvi odeljci za čuvanje telefona, novčanika, fotoaparata gostiju
