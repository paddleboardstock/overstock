hero:
  tagline: Graf Znanja
  title: Znanje o istraživanju vode
  subtitle: |
    Struktuirana baza znanja koja pokriva tehnologiju naduvavanja SUP,<br />
    bezbednost na vodi, inženjering brodova i planiranje avantura.
  taglineSection: Istraži. Uči. Idi sa samopouzdanjem.
clusters:
  tagline: Klasteri znanja
  title: Istraži po temi
  subtitle: Duboko zaranjanje u tehnologiju, bezbednost i veštine iza svakog Aquafarer proizvoda.
  items:
    - title: SUP Znanje
      description: Od izbora vaše prve daske do naprednih tehnika ture — sve o stend-ap paddle bordingu.
      icon: tabler:lifebuoy
      topics:
        - Kako izabrati svoj prvi naduvni SUP
        - Najbolja SUP veličina za početnike
        - Koliko je teško igrati paddle boarding?
        - Upoređivanje na naduvavanje i čvrstih dasaka
        - SUP lista provere bezbednosti
    - title: Znanje o čamcima
      description: Tehnički vodiči o gumenim čamcima, RIBs, čamcima i kajacima — inženjering, materijali i rad.
      icon: tabler:sailboat
      topics:
        - Objašnjeni tipovi gumenih čamaca
        - PVC vs Hypalon poređenje
        - RIB nasuprot Dinghy poređenja
        - Drop-stitch tehnološka dubinska analiza
        - Vodič za nauku o pomorskim materijalima
    - title: Znanje o bezbednosti
      description: Osnovno znanje o bezbednosti za svakog veslača — od izbora PFD, preko čitanja vremenskih uslova, do tehnika samopomoći.
      icon: tabler:shield
      topics:
        - SUP lista provere bezbednosti
        - Da li ti treba prsluk za spašavanje?
        - Vodič za bezbednost pri veslanju po oceanu
        - Bezbednost na reci za naduvavajuće kajake
        - Svest o vremenskim i vodnim uslovima
    - title: Tehnologija
      description: Inženjering iza Aquafarer proizvoda — materijali, metode izrade i testiranje kvaliteta.
      icon: tabler:microscope
      topics:
        - Tehnologija morskog razreda PVC
        - Drop-stitch Jezgro je objašnjeno
        - Zašto PSI je važno za naduvavanje SUPs
        - RF zavarivanje vs lepljenje lepljenje
        - Testiranje i sertifikacija kvaliteta
    - title: Poslovno znanje
      description: Komercijalni vodiči za izgradnju i skaliranje vašeg poslovanja sa vodenim sportovima - od operacija iznajmljivanja do brendiranja privatnih robnih marki.
      icon: tabler:briefcase
      topics:
        - Kako započeti SUP posao iznajmljivanja
        - Izgradnja centra za vodene sportove u odmaralištu
        - Paddle board flota dimenzionisanje za klubove
        - Naduvavanje vs teško SUP za komercijalnu upotrebu
        - Najbolji kajak materijal za iznajmljivanje flote
        - Pokretanje brenda vode privatne robne marke
        - Strategije prihoda od vodenih sportova odmarališta
        - Vodič za održavanje komercijalne opreme
