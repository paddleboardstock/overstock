hero:
  tagline: Paddle Board Overstock Prilagođena laboratorija
  title: Dizajnirajte svoj<br />vodeni brod
  subtitle: OEM, ODM, privatna oznaka i usluge prilagođenog brendiranja za preduzeća širom sveta. Od jednog prototipa do kompletnih proizvodnih serija.
  cta: Započni svoj projekat
  footer_link: /contact
steps_section:
  tagline: Kako funkcioniše
  title: Od koncepta do proizvodnje
  subtitle: Četiri koraka od vaše ideje do gotovog proizvoda spremnog za more.
  steps:
    - num: '01'
      title: Izaberite vašu dasku
      desc: Odaberite iz naših osnovnih modela — SUP, kajak, čamac ili RIB. Odaberite veličinu, materijal i boju.
    - num: '02'
      title: Otpremite vaš dizajn
      desc: Pošaljite nam vaš logo, umetnički rad ili smernice brenda. Naš dizajnerski tim priprema digitalni predlog.
    - num: '03'
      title: Pregled AI makete
      desc: Pogledajte fotorealističnu AI-generisanu maketu vaše prilagođene daske pre nego što proizvodnja počne.
    - num: '04'
      title: Proizvodnja i isporuka
      desc: Kada se odobri, vaša narudžbina ulazi u našu proizvodnu liniju sa sertifikatom ISO. Vremenski rokovi od 30 dana.
services_section:
  tagline: Usluge
  title: Proizvodne usluge za globalne brendove
  subtitle: Fleksibilni modeli angažovanja — od proizvodnje po ugovoru do kompletne gradnje brenda.
  items:
    - title: OEM Proizvodnja
      desc: Proizvodimo vaše dizajne prema specifikacijama — vaša IP, vaši crteži, vaši standardi kvaliteta. Potpuna zaštita NDA.
      icon: ⚙️
    - title: ODM Rešenja
      desc: Izaberite između 50+ proverenih platformi i prilagodite veličinu, boju, grafiku i pakovanje.
      icon: 🎨
    - title: Privatna robna marka
      desc: Vaš brend na našim proizvodima — logo, pakovanje, kartice, priručnici. Spremno za maloprodaju direktno iz kutije.
      icon: 🏷️
    - title: Prilagođeni brending
      desc: Štampanje podloga za dasku, grafike talije, nalepnice za cevi i prilagođene etikete — potpuna integracija brenda.
      icon: ✨
capabilities_section:
  tagline: Mogućnosti
  title: Proizvodne i prilagodljive mogućnosti
  subtitle: Sve što treba da znate pre nego što naručite.
  capabilities:
    - label: Obim narudžbine
      value: MOQ 5–10 jedinica (SUP/kajak), 2–5 jedinica (RIB)
    - label: Vreme isporuke
      value: 30–45 dana standardno; 15–20 dana za prototipe
    - label: Prilagođavanje
      value: Veličina, oblik, boja, grafika, pakovanje, hardver
    - label: Materijali
      value: PVC, Hypalon, drop-stitch, stakloplastika, aluminijum
    - label: Štampa
      value: Digitalna (CMYK), sitotisak, toplotni transfer, sublimacija
    - label: Sertifikacija
      value: CE, ISO 9001, BSCI, UKCA (podrška za globalnu usklađenost)
why_section:
