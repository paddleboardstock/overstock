  items:
    - title: RIB 500 ronilac
      description: '5.0m fiberglasa RIB sa merdevinama za ronjenje, nosačima rezervoara, neklizajućom palubom i 60 HP vanbrodskim. Idealan za male škole ronjenja i operacije zaštićene vode koje rade 1-2 putovanja dnevno. Kapacitet: 8 osoba.'
    - title: RIB 520 ronilac
      description: 'KSNUMKSm RIB sa poboljšanom stabilnošću, rezervoarom za gorivo proširenog dometa, ronilačkim merdevinama, skladištem rezervoara i HP KSNUMKS motorom. Pogodno za obalne ronilačke centre koji rade na više dnevnih putovanja. Kapacitet: KSNUMKS osobe.'
    - title: RIB 550 ronilac
      description: 'KSNUMKSm RIB sa velikim rasporedom palube, profesionalnim ronilačkim merdevinama, nosačima za rezervoare i cevima za teške uslove. Dizajniran za ronilačke operacije sa mešovitim grupama putnika. Kapacitet: KSNUMKS osobe.'
    - title: RIB 580 ronilac pro
