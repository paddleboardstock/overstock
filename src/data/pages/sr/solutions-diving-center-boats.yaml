content_challenge:
  tagline: Izazov
  title: Zašto su ronilački centri potrebni<br />Namenski izgrađeni brodovi
  subtitle: Ronilačke operacije postavljaju jedinstvene zahteve za plovila - zahteve koje čamci opšte namene često ne ispunjavaju.
  paragraphs:
    - Komercijalni ronilački centri rade 200-300 dana godišnje, svakodnevno pokreću 3-5 ronilačkih putovanja. Svako putovanje zahteva prevoz 10-20 ronilačkih rezervoara, pune BCD opreme, regulatora, peraja, maski, zaštitne opreme, opreme za instruktore i putnika. Brod opšte namene jednostavno ne može da podnese ovaj operativni intenzitet.
    - '** Ograničen prostor na palubi ** — Većina rekreativnih brodova dizajnirana je za brzinu i udobnost putnika, a ne za rukovanje opremom. Kada tenkovi, oprema i ronioci dele isti prostor, vreme pripreme se povećava, kretanje postaje teško, a bezbednosni rizici rastu.'
    - '** Teško ukrcavanje ronilaca ** — Međunarodni turisti, prvi put ronioci i stariji putnici trebaju siguran, lak ulazak i izlazak. Visoka pozicija za ukrcavanje, ograničena podrška za ruke i nestabilne platforme stvaraju nelagodu i opasnosti po bezbednost - posebno kada ronioci nose 30 kg opreme.'
    - '** Korozija i oštećenje slane vode UV ** — Tropska okruženja ubrzavaju degradaciju materijala. PVC Standardne cevi mogu izbledeti, curiti i zahtevati zamenu u roku od 3 godine. Korozija metalnih komponenti povećava troškove održavanja i operativne zastoje.'
    - '**Stabilnost u mirovanju** — Roniocima je potrebna stabilna platforma prilikom spremanja, ulaska u vodu i penjanja nazad na brod. Nedovoljna stabilnost stvara bezbednosne rizike i negativno utiče na korisničko iskustvo.'
    - '** Visoki operativni troškovi ** — Efikasnost goriva je važna kada se radi više putovanja svaki dan. Brod koji troši više goriva direktno smanjuje profitne marže. Komercijalni ronilački operateri više brinu o dnevnim operativnim troškovima nego o maksimalnoj brzini.'
content_solution:
  tagline: Naše rešenje
  title: Dizajniran oko stvarnog<br />Operacije Ronjenja
  subtitle: Svako Aquafarer ronjenje RIB je konfigurisano za specifične potrebe komercijalnih ronilačkih centara - nije prilagođeno dizajnu rekreativnog broda.
  list:
    - Veliki raspored radne palube — dizajniran za skladištenje rezervoara za ronjenje, pripremu opreme i kretanje ronilaca, a ne samo za sedenje putnika
    - Profesionalni sistem ronilačkih merdevina sa rukohvatima od nerđajućeg čelika — širok, niski stepen ukrcaja za siguran i lak ulazak i izlazak ronioca
    - Ekstra široke Hypalon PVC ili cevi — obezbeđuje stabilnu platformu za ukrcavanje i poboljšava plovnost kada se ronioci kreću po palubi
    - Integrisani stalci za skladištenje rezervoara — održava nisku težinu, palubu čistu i opremu organizovanu za brži preokret putovanja
    - EVA Neklizajuća površina palube — smanjuje rizik od klizanja kada je paluba mokra i ronioci se kreću u teškoj opremi
    - Konzola pozicionirana za jasnu vidljivost ronilaca u vodi - kritična za praćenje bezbednosti instruktora
    - Opcije motora od 40 HP do 115 HP — jednostruka ili dvostruka konfiguracija, optimizovana za efikasnost goriva tokom više dnevnih putovanja
    - Pomorska konstrukcija — teški cevni materijali sa UV otpornošću na slanu vodu, ojačana struktura za svakodnevnu komercijalnu upotrebu
    - Prilagođene konfiguracije merdevina i platforme za ronjenje - usklađene sa vašom operativnom dubinom vode i profilom ronioca
    - Montažne ploče za opremu za sonar, GPS i komunikacionu opremu
