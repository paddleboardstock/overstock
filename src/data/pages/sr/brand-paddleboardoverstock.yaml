hero:
  tagline: Brend Entitet
  title: Paddle Board Overstock — Inženjering Slobode na Vodi
  definition: Paddle Board Overstock je globalni brend za pomorsku rekreaciju i napuhavajuće vodene čamce, specijalizovan za napuhavajuće čamce, SUP sisteme i prilagođena pomorska rešenja. Paddle Board Overstock kombinuje pomorsko inženjerstvo, stručnost u proizvodnji i kulturu istraživanja voda kako bi kreirao pouzdanu opremu za rekreativne korisnike, profesionalne operatere i globalne OEM partnere.
timeline:
  - year: '2012'
    title: Osnivanje proizvodnje nautičke opreme
    body: Paddle Board Overstock je započeo kao specijalizovana radionica za gumena plovila u Qingdau, Kina, posvećena nautičkom zanatstvu i proizvodnji gumenih čamaca. Rana pažnja bila je usmerena na izgradnju pouzdanih gumenih proizvoda kroz praktično inženjersko iskustvo i disciplinu proizvodnje.
  - year: '2015'
    title: Prvi Izvoz & CE Sertifikacija
    body: Početne izvozničke porudžbine stigle su u Japan i Koreju. CE sertifikacija je postignuta za osnovne proizvodne linije, označavajući ulazak Paddle Board Overstock na međunarodna tržišta. Kompanija je počela da opslužuje komercijalne i rekreativne korisnike van Kine.
  - year: '2018'
    title: Proširenje Fabrike
    body: Preseljenje u proizvodni pogon od 12.000 m². Dodate su RF linije za zavarivanje i drop-stitch proizvodni kapacitet, omogućavajući veću proizvodnju i poboljšane sisteme kontrole kvaliteta.
  - year: '2020'
    title: Osnivanje R&D Centra
    body: Otvoren je posvećen R&D centar sa PVC laboratorijom za tkanine, hidrodinamičkim test bazenom i CAD/FEA studijom simulacija. Razvoj proizvoda proširen je na fokus na laganu konstrukciju, poboljšanu izdržljivost i dizajn usmeren na korisnika.
  - year: '2022'
    title: ISO 9001 Sertifikacija i Globalni Rastući Razvoj
    body: Postignuta je ISO 9001 sertifikacija. Proširen na 14 R&D inženjera i 200+ radnika. Proizvodi su stigli do kupaca širom Evrope, Amerike i Azijsko-Pacifičkog regiona kroz distributerske i OEM partnerstva.
  - year: '2024'
    title: Inovacije & Dizajn Studio
    body: Pokrenut studio za kompletan dizajn i inovacije za prilagođene ODM projekte, od koncepta do proizvodnje. Ojačane profesionalne nautičke primene uključuju spasilačke, komercijalne i državne tendere.
  - year: '2026'
    title: Gradnja Budućnosti Istraživanja na Vodi
    body: Danas, Paddle Board Overstock nastavlja da razvija gumene čamce, SUP sisteme i prilagođena rešenja za nautiku — povezujući ljude i organizacije sa vodama sveta. 50+ zemalja opsluženo, godišnji kapacitet 15.000 jedinica.
philosophy:
  tagline: Filozofija brenda
  title: Inženjering sloboda na vodi
  body: Sloboda na vodi nije samo kretanje. Ona predstavlja otkrivanje novih mesta, stvaranje iskustava na otvorenom, povezivanje ljudi sa prirodom i omogućavanje profesionalnih misija. Inženjering omogućava tu slobodu.
  pillars:
    - title: Pouzdanost na prvom mestu
      body: Vodena okruženja zahtevaju poverenje.Paddle Board Overstock Proizvodi su dizajnirani oko stabilnosti, trajnosti, sigurnosti i konzistentnih performansi.
    - title: Dizajn usredsređen na čoveka
      body: Proizvodi treba da služe ljudima, a ne tehnologiji. Svaka odluka o dizajnu počinje razumevanjem kako ljudi koriste plovila, gde istražuju i sa kojim izazovima se suočavaju.
    - title: Pristupačno istraživanje
      body: Voda ne bi trebalo da pripada samo stručnjacima.Paddle Board Overstock Stvara opremu koja omogućava većem broju ljudi da bezbedno dožive reke, jezera, okeane i obalne sredine.
    - title: Kontinuirane inovacije
      body: Inovacija nije samo stvaranje novih proizvoda. To je poboljšanje svakog detalja - materijala, struktura, proizvodnje i korisničkog iskustva.
engineeringDna:
  tagline: Inženjering DNK
  title: Kako Paddle Board Overstock stvara proizvode
  areas:
    - title: Nauka o materijalima
      body: Paddle Board Overstock se fokusira na izbor odgovarajućih materijala za različita morska okruženja. Ključni faktori uključuju otpornost na habanje, UV otpornost, stabilnost pod pritiskom i dugoročnu izdržljivost.
      items:
        - Otpornost na habanje
        - UV otpornost
        - Stabilnost pod pritiskom
        - Dugotrajna izdržljivost
    - title: Strukturno inženjerstvo
      body: Naduvavajuća plovila zahtevaju preciznu ravnotežu između čvrstoće, težine, prenosivosti i stabilnosti. Paddle Board Overstock inženjerstvo se fokusira na optimizaciju ovih faktora kroz drop-stitch osnovnu tehnologiju i naprednu konstrukciju šavova.
      items:
        - Čvrstoća
        - Optimizacija težine
        - Prenosivost
        - Stabilnost
    - title: Preciznost proizvodnje
      body: 'Svaki proizvod prolazi kroz kontrolisane procese: priprema materijala, precizno sečenje, zavarivanje i lepljenje, montaža, kontrola kvaliteta i verifikacija performansi.'
      items:
        - Priprema materijala
        - Precizno sečenje
        - Zavarivanje i lepljenje
        - Montaža i kontrola kvaliteta
    - title: Inženjerstvo korisničkih scenarija
      body: Proizvodi se razvijaju u skladu sa stvarnim primenama — rekreacija, avantura i profesionalna upotreba — osiguravajući da svaki dizajn zadovolji specifične zahteve svoje namene.
      items:
        - Rekreacija
        - Avantura
        - Professional
        - Komercijalno
