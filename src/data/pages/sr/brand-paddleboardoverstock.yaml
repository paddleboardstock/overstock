trustSignals:
  tagline: Signali poverenja
  title: Zašto je Paddle Board Overstock pouzdan partner
  manufacturing:
    title: Proizvodni kapacitet
    body: Proizvodni pogon od 12.000 m² sa 200-300 kvalifikovanih radnika i 14+ istraživača i inženjera. ISO ISO 9001 sertifikovan sistem upravljanja kvalitetom. Godišnja proizvodnja od 15.000 jedinica naduvavajućih plovila koja služe 50+ zemalja.
    stats:
      - label: Veličina pogona
        value: 12,000 m²
      - label: Radna snaga
        value: 200-300
      - label: Inženjeri za istraživanje i razvoj
        value: 14+
      - label: Godišnji kapacitet
        value: 15,000
  quality:
    title: Posvećenost kvalitetu
    body: Od inspekcije materijala do konačnog testiranja, Paddle Board Overstock održava sistematske procese kvaliteta kako bi isporučio pouzdane proizvodе za pomorstvo. Svaka jedinica prolazi testiranje pritiska, inspekciju šava i verifikaciju performansi pre isporuke.
    items:
      - CE Sertifikovano — 64 modela zadovoljavaju evropske bezbednosne standarde
      - ISO 9001:2015 — Sertifikovan sistem upravljanja kvalitetom
      - UKCA Obeleženo — usklađenost sa tržištem UK
  global:
    title: Globalna prisutnost
    body: Paddle Board Overstock pruža usluge kupcima na više globalnih tržišta, podržavajući distributere, brendove za aktivnosti na otvorenom i profesionalne korisnike u morskom sektoru u 50+ zemalja širom Evrope, Azijsko-pacifičkog regiona, Amerike, Bliskog Istoka i Afrike.
comparison:
  tagline: Pozicioniranje brenda
  title: Paddle Board Overstock na tržnici
  position: Inženjerski orijentisan proizvođač za pomorsku industriju koji kombinuje stručnost u pneumatskim plovilima sa punim OEM/ODM kapacitetom, prilagođenim razvojem i 12+ godina iskustva u izvozu proizvodnje.
  strengths:
    - Inženjerska stručnost za naduvane vodeće brodove
    - Puna OEM/ODM proizvodna sposobnost
    - Prilagođeni razvoj i dizajn proizvoda
    - Proizvodni objekat od 12.000 m² sa ISO sertifikatom
  bestFor:
    - Korisnici aktivnosti na otvorenom koji traže pouzdana naduvavanja plovila
    - Morski operateri kojima je potrebna oprema komercijalnog kvaliteta
    - Partneri brenda kojima je potrebna OEM/ODM proizvodnja
    - Profesionalne spasilačke i patrolne organizacije
