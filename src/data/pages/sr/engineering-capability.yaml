content_capability:
  tagline: Inženjerska sposobnost
  title: Šta Naše Inženjerstvo<br />Tim isporučuje
  subtitle: Paddle Board Overstock inženjering obuhvata ceo životni ciklus proizvoda — od istraživanja tržišta i dizajna koncepta, preko prototipovanja, testiranja, do masovne proizvodnje.
  items:
    - title: Industrijski dizajn
      description: Naš tim za industrijski dizajn radi na osnovu zahteva kupaca, istraživanja tržišta i analize konkurencije kako bi razvio koncept proizvoda koji balansira estetiku, funkcionalnost i mogućnost proizvodnje. Pravimo 2D skice, 3D prikaze i dokumente specifikacija za pregled klijenata pre nego što se odlučimo za izradu alata.
      features:
        - Razvoj koncepta i studije izvodljivosti
        - 2D dizajn crteži i 3D prikazi
        - Odabir materijala i specifikacija
        - Analiza dizajna za proizvodnju (DFM)
        - Ergonomska i bezbednosna procena
    - title: Strukturno inženjerstvo
      description: Naši konstruktori specijalizovani su za arhitekturu napuhavajućih čamaca — dizajn trupa, konfiguraciju komora na cevima, drop-stitch osnovno inženjerstvo i raspodelu opterećenja. Svaki dizajn se analizira radi strukturnog integriteta, optimizacije težine i usklađenosti sa relevantnim standardima (CE, ISO, AS).
      features:
        - Dizajn trupa od fiberglasa sa dubokim V sa izračunatim uglovima nagiba
        - Višekamerna konfiguracija cevi za bezbednost i plovnost
        - Drop-stitch specifična jezgra i optimizacija gustine
        - Analiza konačnih elemenata za nosive komponente
        - Proračun raspodele težine i stabilnosti
    - title: 3D modelovanje i CAD
      description: Svi dizajni proizvoda razvijaju se u 3D CAD-u pre nego što počne izrada prototipa. Naši inženjeri koriste SolidWorks i Rhino 3D za modeliranje proizvoda, što omogućava klijentima da pregledaju svaki detalj — od profila cevi do rasporeda konzole — pre nego što se odluče za proizvodnju.
      features:
        - Puno 3D CAD modeliranje u SolidWorks i Rhino 3D
        - Foto-realistički prikaz za prezentacije klijentima
        - Tehnički crtački paketi za proizvodnju
        - Dizajn kalupa i alata iz 3D modela
        - Direktni prenos podataka iz CAD-a u CNC za precizno sečenje
    - title: Prototipiranje i testiranje
      description: Pre nego što proizvodnja krene u masovnu proizvodnju, svaki novi proizvod prolazi kroz fazu prototipa. Pravimo funkcionalne prototipe za ocenu klijenata, a zatim ih podvrgavamo našem kompletnom protokolom testiranja — testiranje pritiska, testiranje stabilnosti, testiranje opterećenja i vodena ispitivanja. Iteracije dizajna u fazi prototipa su brze i ekonomične.
      features:
        - Alati za brzu izradu prototipa (vreme izrade 15-20 dana)
        - Funkcionalni prototip za evaluaciju u stvarnom svetu
        - Kompletan protokol testiranja pre odobrenja proizvodnje
        - Iterativno usavršavanje dizajna na osnovu rezultata testiranja
        - Klijent odobrio ključni korak pre proizvodnog alata
    - title: Prilagođena integracija dodataka
      description: Mnogi OEM projekti zahtevaju integraciju dodatne opreme koju obezbeđuje klijent ili treća strana — prilagođene konzole, specijalizovana sedišta, elektronske sisteme, nosače opreme za ronjenje ili elemente brendiranja. Naš inženjerski tim upravlja dizajnom integracije, strukturnom adaptacijom i validacijom kvaliteta sve dodatne opreme.
      features:
        - Dizajn konzole i raspored instrument table
        - Prilagođeno sedenje i integracija tapacirunga
        - Dizajn i ožičavanje elektronskog sistema
        - Sistemi za montiranje opreme za ronjenje i spasavanje
        - Specifikacije brendiranja i grafičke primene
content_process:
  tagline: Proces razvoja
  title: Od koncepta<br />u proizvodnju
  subtitle: Naš proces razvoja proizvoda prati strukturisan radni tok u 6 faza, dizajniran da minimizira rizik, skrati rokove i obezbedi spremnost za proizvodnju od prvog dana.
  stages:
    - stage: '01'
      title: Zahtevi i istraživanje
      duration: 1-2 nedelje
      description: Radimo sa klijentom na definisanju specifikacija proizvoda, zahteva ciljnog tržišta, potreba za usklađenošću sa propisima i komercijalnih ciljeva. Ova faza proizvodi Dokument o zahtevima za proizvod (PRD) koji vodi sve naredne radove.
      deliverables: PRD, analiza tržišta, konkurentni benchmark, preliminarna procena troškova
    - stage: '02'
      title: Koncepcijski dizajn
      duration: 2-3 nedelje
      description: Tim za industrijski dizajn razvija koncepte proizvoda zasnovane na PRD-u. Više opcija dizajna se prezentuje sa 3D prikazima, preporukama materijala i inicijalnim inženjerskim procenama. Klijent bira smer za detaljan razvoj.
      deliverables: 3D konceptualni prikazi, specifikacije materijala, obrazloženje dizajna, preliminarni BOM
    - stage: '03'
      title: Detaljno inženjerstvo
      duration: 2-4 nedelje
      description: Izabrani koncept je potpuno inženjerski obrađen — 3D CAD modeliranje, strukturna analiza, konfiguracija cevi, dizajn trupa, integracija dodatne opreme i dokumentacija za proizvodnju. Sve dimenzije, materijali i procesi su specificirani za izradu alata.
      deliverables: Puni 3D CAD model, inženjerski crteži, finalni BOM, specifikacije alata, plan kontrole kvaliteta
    - stage: '04'
      title: Prototipiranje
      duration: 2-3 nedelje
      description: Proizvodi se alat za prototip i prave funkcionalni uzorci. Klijent pregledava prototip u odnosu na PRD specifikacije. Testiranje se sprovodi prema dogovorenom protokolu. Izmene dizajna se vrše na osnovu povratnih informacija pre izrade proizvodnog alata.
      deliverables: Funkcionalni prototip, izveštaj o testiranju, zapisnik o reviziji dizajna, dokument potvrde klijenta
    - stage: '05'
      title: Proizvodni alati
      duration: 2-3 nedelje
      description: Kada je prototip odobren, naručuju se proizvodni alati — kalupi, zavarivačke fixtur-e, programi za sečenje, fixtur-e za montažu. Dokumentacija QC i kriterijumi inspekcije se finalizuju. Sprovodi se probni rad za validaciju procesa.
      deliverables: Proizvodni alati, dokumentacija procesa, plan inspekcije QC, izveštaj o probnom radu
    - stage: '06'
      title: Masovna proizvodnja i QC
      duration: Tokom trajanja
      description: Počinje puna proizvodnja sa kontrolom kvaliteta u toku procesa na svim fazama. Prvi primerci se pregledaju i odobravaju pre oslobađanja serije. Kontinuirano praćenje kvaliteta, praćenje defekata i kontinuirano unapređenje tokom životnog ciklusa proizvodnje.
      deliverables: Raspored proizvodnje, QC izveštaji, evidencija praćenja serije, dokumentacija za slanje
content_customization:
  tagline: Opcije prilagođavanja
  title: Šta se može<br />prilagoditi
  subtitle: Gotovo svaki aspekt naših proizvoda može biti prilagođen zahtevima klijenta. Ispod su najčešće kategorije prilagođavanja.
  columns: 3
  items:
    - title: Trup i struktura
      description: Prilagođena dužina trupa, širina gaza, ugao deadrise-a, prečnik cevi, konfiguracija komora i kvalitet materijala.
      icon: tabler:sailboat
    - title: Boje i grafika
      description: Boja cevi (PVC/Hypalon), boja gelcoata trupa, boja konzole, grafika palube, pozicija logotipa i dizajn pakovanja.
      icon: tabler:palette
    - title: Konzola i kontrola
      description: Centralna konzola, bočna konzola ili upravljanje volanom. Prilagođen raspored instrument table, pozicija prekidača i položaj komandnog mesta.
      icon: tabler:steering-wheel
    - title: Sedenje i tapacirung
      description: Jahačka sedišta, klupe, luksuzni tapacirung, šavovi u boji, preklopne ili uklonjive konfiguracije.
      icon: tabler:armchair
    - title: Dodaci i oprema
      description: Ronilačke merdevine, držači za boce, vučne stubove, T-tops, Bimini krovovi, audio sistemi, navigaciona elektronika i sigurnosna oprema.
      icon: tabler:backpack
    - title: Pakovanje i Brendiranje
      description: Prilagođeno maloprodajno pakovanje, kutije sa privatnom markom, transportni kartoni sa brend oznakama, etikete i uputstva za upotrebu na jeziku klijenta.
      icon: tabler:box
content_industries:
  tagline: Primena u industriji
  title: Inženjerska Rešenja<br />po industriji
  subtitle: Naš tim inženjera razvio je proizvode za širok spektar pomorskih primena — svaki sa različitim zahtevima i kriterijumima performansi.
  columns: 3
  items:
    - title: Operacije Ronjenja
      description: Ojačani palubi, integracija merdevina za ronjenje, sistemi za skladištenje boca i stabilne platforme za komercijalne ronilačke centre širom sveta.
      icon: tabler:lifebuoy
    - title: Spasavanje i Vanredne Situacije
      description: Dizajn brzih trupa, palube sa samopražnjenjem, sistemi za montiranje opreme i višekamerne bezbednosne konfiguracije za SAR operacije.
      icon: tabler:alert-triangle
    - title: Pomorski Turizam
      description: Rasporedi za udobnost putnika, integracija sunčanih sijenki, sistemi ukrcaja i konfiguracije štedljive na gorivu za operacije prenosa između ostrva.
      icon: tabler:beach
    - title: Tenderi za Jahting
      description: Kompaktni dizajni za skladištenje na davitu, opcije luksuznog završetka, usklađivanje boja sa matičnom jahtom i karakteristike vuče visokih performansi.
      icon: tabler:sailboat
    - title: Ribarstvo i Akvakultura
      description: Konfiguracije ravne palube, integracija sistema za održavanje živih riba, rasporedi držača štapova i hardver otporan na koroziju za kontinuiranu izloženost slanoj vodi.
      icon: tabler:fish
    - title: Luka i Industrija
      description: Ojačavanje trupova za teške uslove, rasporedi radnih brodova, konfiguracije za transport osoblja i integracija opreme za offshor operacije.
      icon: tabler:ship
