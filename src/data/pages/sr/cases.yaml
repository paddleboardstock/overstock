features3_cases:
  tagline: Istaknuti slučajevi
  title: Prilagođena rešenja<br />Za stvarne izazove
  isBeforeContent: false
  columns: 3
  items:
    - title: Nadogradnja dnevnih operacija ronilačkog centra Bali
      customer: Ronilački centar Blue Ocean
      country: Indonezija
      industry: Komercijalni ronilački centar
      challenge: Ronilački centar Blue Ocean na Baliju upravljao je starijim ronilačkim čamcem od stakloplastike sa ograničenim prostorom na palubi, teškim ukrcavanjem ronilaca i visokim održavanjem u uslovima tropske slane vode. Utovar opreme je bio prepun, vreme pripreme je bilo dugo, a nestabilna platforma stvorila je bezbednosne probleme za međunarodne turiste - uključujući ronioce koji prvi put i starije putnike. Centar vodi 3-5 ronilačkih putovanja dnevno, 200+ dana godišnje.
      solution: Paddle Board Overstock isporučuje prilagođeni 6.8m Professional Diving RIB sa proširenim rasporedom palube optimizovanim za skladištenje opreme za ronjenje, širokim merdevinama za ronjenje od nerđajućeg čelika, Hypalon teškim cevima za UV otpornost na slanu vodu, neklizajućom površinom palube i rešenjem za skladištenje rezervoara. Konfiguracija je dizajnirana oko dnevnog toka toka ronilačkog centra - ne zasnovanog na standardnom rasporedu rekreativnog broda.
      product: 6.8m Profesionalno ronjenje RIB
      results: Veća radna površina poboljšala je efikasnost pripreme opreme. Ronioci su iskusili sigurnije i lakše ukrcavanje. Zahtevi za održavanjem su se značajno smanjili. Centar je stekao kapacitet za rukovanje više kupaca tokom vrhunca sezone sa većim poverenjem. RIB Postao je temelj svakodnevnih ronilačkih operacija.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Naš ronilački brod nije samo prevoz. To je temelj našeg svakodnevnog rada.Paddle Board Overstock RIB Daje našem timu više samopouzdanja prilikom svakodnevnog vođenja više ronilačkih putovanja.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center RIB Profesionalna nadogradnja
      customer: Ronilački centar Ocean Ekplorer
      country: Tajland
      industry: Komercijalni ronilački centar
      challenge: Ronilački centar Ocean Ekplorer u Puketu, Tajland, morao je da nadogradi tradicionalni ronilački brod od fiberglasa koji nije mogao da prati rastuću potražnju kupaca. Ograničen prostor na palubi učinio je pripremu opreme neefikasnom. Teško ukrcavanje stvorilo je bezbednosne izazove za međunarodne turiste. Visoki zahtevi za održavanjem u uslovima tropske slane vode povećali su operativne troškove. Centar radi više dnevnih putovanja, KSNUMKS+ dana godišnje.
      solution: Paddle Board Overstock isporučeno prilagođeno komercijalno ronjenje od 6,8 m RIB sa optimizovanim rasporedom radne palube za skladištenje rezervoara za ronjenje, pripremu opreme i kretanje ronilaca. Karakteristike su uključivale široke ronilačke merdevine sa rukohvatima od nerđajućeg čelika, konstrukciju cevi za teške uslove rada sa UVmaterijalima otpornim na materijale, neklizajuće podove, rešenje za skladištenje rezervoara, profesionalnu konzolu i putnička sedišta - sve konfigurisano za komercijalne ronilačke operacije.
      product: 6.8m Komercijalno ronjenje RIB
      results: Veća površina palube omogućila je bržu organizaciju opreme i efikasniji dnevni radni tok. Udobnost i sigurnost ukrcaja kupaca značajno su se poboljšali. Zastoji u održavanju smanjeni su sa izgradnjom morskog razreda. Ronilački centar mogao bi služiti većem broju kupaca tokom vrhunca sezone i sa povjerenjem proširiti profesionalne ronilačke usluge.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Za ronilački centar, brod nije samo prevoz. To je važan deo našeg svakodnevnog rada.Paddle Board Overstock RIB Daje našem timu samopouzdanje da svakodnevno vodi više ronilačkih putovanja uz bolju sigurnost i efikasnost.
      icon: tabler:lifebuoy
    - title: Flota Evropskog ronilačkog centra
      customer: BlueMed ronilački centri
      country: Grčka
      industry: Ronjenje i morski turizam
      challenge: Potreban KSNUMKS ronilački konfigurisan RIBs za lanac ronilačkih centara na više grčkih ostrva. Svaki brod je trebao prilagođene ronilačke merdevine, rezervoar za rezervoare KSNUMKS i stabilnu platformu za ulazak ronioca u otvorene vode. Flota je morala stići u roku od KSNUMKS dana za početak turističke sezone.
      solution: RIB Proizvedeni KSNUMKS KSNUMKS Dive modeli sa integrisanim nosačima rezervoara, merdevinama za ronjenje i ekstra Hypalon širokim cevima za stabilnost ukrcavanja. Svaki brod je brendiran sa livrejom flote kupaca. Svi KSNUMKS brodovi su testirani pod pritiskom i isporučeni iz Kingdaoa u roku od KSNUMKS dana.
      product: RIB 520 ronjenje
      results: Svih 12 brodova isporučeno je na vreme za turističku sezonu. Flota je u svakodnevnom radu 18+ meseci sa nula materijalnih kvarova. Kupac je naručio 6 dodatnih jedinica u drugoj godini.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB KSNUMKS Dive je bio okosnica naših svakodnevnih ronilačkih operacija. Stabilnost u mirovanju je odlična, a raspored rezervoara održava palubu čistom i sigurnom za naše goste.
      icon: tabler:lifebuoy
    - title: OEM Australijski program distributera
      customer: Pacifik Vodeni sportovi Pti doo
      country: Australija
      industry: / OEMODM Proizvodnja
      challenge: Australijskom distributeru je bio potreban asortiman ploča za privatnu robnu marku SUP po konkurentnim cenama kako bi se takmičio sa kineskim brendovima direktnih potrošača. Potrebni su KSNUMKS jedinstveni modeli koji pokrivaju početnike do naprednih, sa prilagođenom grafikom, prilagođenim pakovanjem i ispunjavanjem isporuka na maloprodajnim objektima.
      solution: Razvijeni SUP KSNUMKS modeli (All-Around, Touring, Joga, Kids, Sport, Ultra-Compact, Ultra-Stable, Vhitevater) sa ekskluzivnim australijskim grafičkim paketom. Prilagođena maloprodajna ambalaža sa KR kodovima koji se povezuju sa video zapisima za podešavanje. Drop-ship logistika konfigurisana iz Kingdaoa direktno u australijske maloprodajne objekte.
      product: SUP Prilagođena linija (8 modela)
      results: Koncept za prvu isporuku u 90 dana. Maloprodaja stopa 85% u prvoj sezoni. Distributer proširio partnerstvo da uključi naduvavanje brod liniju u drugoj godini.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock isporučio kompletnu SUP liniju za 90 dana - od početnog dizajna do maloprodajnog poda. Kvalitet odgovara brendovima koji se prodaju po dvostruko većoj ceni.
      icon: tabler:arrows-exchange
    - title: Bliski Istok Rescue Boat Snabdevanje
      customer: Nacionalna uprava civilne zaštite
      country: Ujedinjeni Arapski Emirati
      industry: Traganje i spašavanje
      challenge: Organizacija civilne zaštite je trebala KSNUMKS patrolu RIBs spremnu za obalnu potragu i spašavanje, bezbednost luke i odgovor na poplave. Potrebne palube za samospašavanje, puni navigacioni apartmani (GPS, radar, VHF), narandžaste cevi visoke vidljivosti i usklađenost sa lokalnim pomorskim propisima.
      solution: Isporučuje RIB se KSNUMKS KSNUMKS Patrol modeli sa samo-bailing palubama, Garmin navigacionim apartmanima, LED reflektorima, SOLAS reflektujućom trakom i narandžastim cevima visoke vidljivosti Hypalon . Svaki brod je CEsertifikovan i testiran na ISO KSNUMKS standarde. Paket dokumentacije uključivao je sertifikate o usaglašenosti za lokalnu registraciju.
      product: RIB 450 Patrola
      results: Flota raspoređena preko KSNUMKS obalnih stanica. Brodovi su radili u ekstremnim vrućinama (KSNUMKS ° C+) bez degradacije cevi. Patrolni opseg i efikasnost goriva premašili su specifikacije za KSNUMKS%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: KSNUMKS RIB Patrola je premašila naše operativne zahteve. U ekstremnim toplotnim uslovima Hypalon , cevi ne pokazuju znake UV degradacije nakon KSNUMKS meseci svakodnevne upotrebe.
      icon: tabler:alert-triangle
    - title: OEM Evropsko partnerstvo za brend
      customer: Severno more morski Oprema BV
      country: Holandija
      industry: / OEMODM Proizvodnja
      challenge: Uspostavljen evropski morski brend želeo je da se proširi na RIB tržište bez ulaganja u proizvodne pogone. Potreban je partner sa belom etiketom sposoban da proizvede RIB KSNUMKS modele (KSNUMKSm do KSNUMKSm) sa privatnim CE brendiranjem, sertifikacijom i ekskluzivnim pravima distribucije u EU.
      solution: Uspostavljen ugovor o proizvodnji bele etikete za RIB 5 modela. Svaki model brendiran sa logotipima kupaca i shemom boja.CE Sertifikaciona dokumentacija pripremljena za svaki model. Ekskluzivna prava distribucije u EU dodeljena sa minimalnim obavezama narudžbine. Tehnička dokumentacija i katalog rezervnih delova obezbeđeni za lokalnu servisnu mrežu.
      product: RIB Prilagođena linija (5 modela)
      results: Potpisan višegodišnji ugovor. Prva proizvodnja od 50 jedinica isporučena u roku od 75 dana. Brend lansiran na METSTRADE sa pozitivnim prijemom dilera.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Rad sa Paddle Board Overstock nama nam je omogućio da uđemo RIB na tržište bez izgradnje fabrike - isporučili su kompletno rešenje po sistemu "ključ u ruke" sa CE sertifikacijom i dokumentacijom za podršku dilera.
      icon: tabler:building
    - title: Karibski resort flota
      customer: Paradise Island Resorts Ltd
      country: San-Tome i Prinsipi
      industry: Morski turizam i ugostiteljstvo
      challenge: 'Luksuznom odmaralištu bila je potrebna kompletna flota opreme za sportove na vodi za aktivnosti gostiju: SUP 40 ploča za obilaske sa vodičem, 20 kajaka za istraživanje lagune, 10 čamaca na naduvavanje za transfere gostiju i ribolovne izlete, plus pribor. Sva oprema je trebala brendiranje prilagođenog odmarališta i morala je biti isporučena prije vrhunca turističke sezone.'
      solution: 'Proizveden kompletan paket za vodene sportove: 40 SUP Voiager odbora (All-Around model), 20 Ekplorer kajaka, 10 AirDeck 360 čamaca na naduvavanje, plus PFD, vesla, pumpe i kompleti za popravku. Sva oprema štampana sa logotipom odmarališta i tropskim bojama. Kontejnerizovana pošiljka sa punim inventarom manifesta.'
      product: Kompletan paket vodenih sportova (KSNUMKS+ jedinice)
      results: Flota je stigla 6 nedelja pre vrhunca sezone. Rezultati zadovoljstva gostiju za vodene sportove povećali su se za 40% u odnosu na prethodnu godinu. Oprema je trajala 3 sezone sa samo rutinskim održavanjem.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Kompletan pristup paketu značio je da smo dobili sve što nam je potrebno u jednoj pošiljci - daske, kajaci, čamci i pribor - sve brendirane i spremne za upotrebu gostiju. Naši gosti vole kvalitet opreme.
      icon: tabler:beach
    - title: Nadogradnja komercijalnog ronilačkog centra u Kvinslendu RIB
      customer: Komercijalni ronilački centar
      country: Australija
      industry: Komercijalne ronilačke i pomorske usluge
      challenge: Komercijalni ronilački centar sa sedištem u Kvinslendu specijalizovan za inspekciju pomorske infrastrukture, održavanje luka i podvodne popravke projekte upravljao je starim radnim brodom. Kako je potražnja za projektom rasla, stari brod je postao obaveza - često održavanje izazvalo je poremećaje u rasporedu, raspored nije bio dizajniran za moderne ronilačke operacije (ograničen prostor za cilindre, alate i opremu), a udobnost posade tokom dugih operacija bila je loša. Kompaniji je bio potreban brod koji bi mogao da podrži njihove profesionalne operacije svakog radnog dana.
      solution: Paddle Board Overstock Sproveo je detaljnu operativnu analizu toka posla ronilačkog klijenta, tipičnog trajanja projekta, veličine posade i zahteva za opremom. Na osnovu ove analize, Paddle Board Overstock isporučen je prilagođeni profesionalac RIB sa funkcionalnim rasporedom palube optimizovan za pripremu opreme i kretanje ronilaca, profesionalnim sedištima za duže periode transporta, poboljšanom stabilnošću za sigurniji ulazak i izlazak ronilaca i funkcije podrške ronjenju integrisane u dizajn.
      product: Prilagođeno profesionalno ronjenje RIB
      results: Novi RIB je postao pouzdana svakodnevna radna platforma. Priprema opreme postala je brža sa optimizovanim rasporedom. Posada je prijavila poboljšanu udobnost i sigurnost tokom dugih operacija. Profesionalni izgled broda ojačao je poverenje kupaca u radu sa lučkim operaterima i pomorskim izvođačima. Ronilački centar je dobio plovilo koje je odgovaralo profesionalizmu njihove usluge.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Trebao nam je brod koji može da podrži naše poslovanje svaki dan, a ne samo plovilo za prevoz. Paddle Board Overstock je radio s nama da razume naše operativne zahteve i isporučio RIB rešenje koje odgovara našem poslovnom radu u komercijalnom ronjenju.
      icon: tabler:lifebuoy
    - title: Ugovor o obalnoj patroli SAD-a
      customer: Agencija za bezbednost atlantske obale
      country: Sjedinjene Američke Države
      industry: Pomorska bezbednost i sprovođenje zakona
      challenge: Agencija za bezbednost obala SAD zahtevala je tešku patrolnu RIBs za operacije presretanja na otvorenim vodama. Bilo je potrebno dvomotorno rešenje radi redundancije, oklopna konzola za zaštitu posade, vojne elektronike (kriptovana komunikacija, FLIR, radar) i usklađenost sa propisima Obalske straže SAD.
      solution: Projektovan RIB 600 Patrol sa dvostrukom 115 HP vanbrodskom konfiguracijom, oklopljenom konzolom sa balističkom zaštitom, FLIR termalnim snimanjem, enkriptovanom VHF/UHF komunikacijom i integrisanim mestima za montažu oružja. Trup ojačan za manevarisanje velikom brzinom. Sva elektronika integrisana i testirana u fabrici. Dokumentacija o usklađenosti USCG je obezbeđena.
      product: RIB 600 Patrol (Dvostruki motor)
      results: Brodovi su postigli maksimalnu brzinu od 52 čvora tokom probnih prihvatanja. Agencija je izvestila o 95% stope spremnosti za misije u prvih 12 meseci. Dodatna narudžbina je postavljena za 8 jedinica.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Dvomejski RIB 600 daje našim posadama brzinu i rezervu potrebnu za operacije presretanja na otvorenoj vodi. Oklopljena konzola pruža kritičnu zaštitu bez kompromitovanja performansi.
      icon: tabler:shield
