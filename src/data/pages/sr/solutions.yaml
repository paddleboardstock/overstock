features3_solutions:
  tagline: Rešenja
  title: Vaša vodena avantura<br />Poslovni partner
  isBeforeContent: false
  columns: 3
  items:
    - title: Klubovi vodenih sportova
      description: Kompletni paketi opreme, prilagođeni brendirani sadržaji i programi održavanja za SUP klubove, kajak klubove, škole surfovanja i treninzi centre.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vodenih sportova RIBs
      description: Specijalno dizajnirani RIBs za škole jedrenja, centre vodenih sportova i organizacije događaja. Čamci za trenere, čamci za vuču i marshal čamci za profesionalne vodene sportove.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Odmarališta i hoteli
      description: Premium programi vodenih sportova sa flotom opreme, sistemima bezbednosti, obukom osoblja i upravljanjem prihodom za ugostiteljske objekte.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Brend preduzetnici u vodenim sportovima
      description: Proizvodnja privatne marke OEM/ODM sa niskim MOQs, prilagođenim dizajnom proizvoda, pakovanjem i globalnom isporukom za nove vlasnike brenda.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Čamci ronilačkih centara
      description: Stabilne RIB platforme sa lakim ulaskom/izlaskom, skladištenjem opreme i konfiguracijama motora optimizovanim za ronilačke operacije.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Spasilački i hitni čamci
      description: Brzi RIBs i gumeni čamci dizajnirani za potragu i spasavanje, hitne intervencije i operacije obalske straže.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Rešenja za tender čamce
      description: Kompaktni, stilizovani RIB tenderi koji nadopunjuju superjahte i rekreativna plovila. Lako skladištenje, snažne performanse.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Rešenja za ribarske čamce
      description: Stabilni, izdržljivi gumeni čamci i RIBs konfigurisani za komercijalne i rekreativne ribolovne operacije.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Oprema za pomorski turizam
      description: Flotno spremni gumeni čamci, SUP daske i kajaci za odmarališta, turističke operatere i biznise za iznajmljivanje vodenih sportova.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore energija RIBs
      description: Teška RIBs za podršku na platformama za naftu i gas, prevoz posade na vetroelektrane, inspekciju podmorskih kablova i pomorsku konstrukciju.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Radni čamci za akvakulturu
      description: Otporniji na koroziju RIBs za ribarstvo, uzgoj bisera i obalsko farmarstvo. Hypalon cevi, hardver od nerđajućeg čelika, izdržljivost za svakodnevnu upotrebu.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Pomorska istraživanja i merenja
      description: Stabilni RIBs spremni za instrumente za okeanografska istraživanja, praćenje životne sredine, uzorkovanje kvaliteta vode i univerzitetske nastave.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komercijalni radni čamci
      description: Teški RIBs za patroli, istraživanja, transport i offshore logistiku. Dizajnirani za rigorozne zahteve komercijalnog poslovanja.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Niste sigurni koji put odgovara vašem poslovanju?
  subtitle: Recite nam o vašem poslovanju — preporučićemo pravi paket opreme, program brendiranja ili prilagođeno rešenje.
  actions:
    - variant: primary
      text: Zakažite besplatnu konsultaciju
      href: /contact
