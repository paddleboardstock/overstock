philosophy:
  tagline: Filozofija dizajna
  title: Dizajn vođen inženjeringom<br />— Svaki detalj je važan
  subtitle: Naša inženjerska filozofija zasniva se na tri principa koji vode svaki proizvod koji pravimo.
  list:
    - 'Pouzdanost na prvom mestu: Svaki Paddle Board Overstock proizvod se testira da izdrži uslove stvarnog sveta — od spasilačkih akcija u hladnoj vodi do iznajmljivanja u tropskim odmaralištima. Prekomerno inženjerstvo primenjujemo tamo gde je najvažnije.'
    - 'Preciznost proizvodnje: Naše fabrike koriste CNC sečenje, visokofrekventno zavarivanje i automatizovano testiranje pritiska. Svaki šav, svaki ventil, svaki priključak ispunjava dokumentovane specifikacije.'
    - 'Kontinuirane inovacije: Naš R&D tim kontinuirano ocenjuje nove materijale, metode proizvodnje i poboljšanja dizajna. Ne čekamo probleme — predviđamo ih.'
