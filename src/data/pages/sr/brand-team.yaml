hero:
  tagline: Naš tim
  title: Ljudi iza Paddle Board Overstock<br />— Inženjering slobode na vodi
  subtitle: Osnovan 2012. godine u Čingdau, Kina, Paddle Board Overstock su osnovali pomorski inženjeri, naučnici za materijale i zaljubljenici u vodene sportove koji su verovali u to da profesionalne napuhavajuće vodene plovke mogu biti dostupne širom sveta.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock kompletna fotografija tima — inženjering, proizvodnja i liderstvo
founding:
  tagline: Naše osnivanje
  title: Iz obalske radionice<br />do postrojenja od 12.000 m²
  subtitle: Paddle Board Overstock su osnovali tim pomorskih inženjera sa decenijama kombinovanog iskustva u dizajnu napuhavajućih čamaca, izradi PVC/Hypalon i globalnoj proizvodnji pomorske opreme.
  items:
    - title: 'Osnovano: 2012'
      description: Osnovano u Čingdau, Kina — važnom pomorskom čvorištu sa bogatom tradicijom brodogradnje.
      icon: tabler:calendar
    - title: 200-300 zaposlenih
      description: Uključujući 50+ inženjera za istraživanje i razvoj, stručnjaka za kontrolu kvaliteta i tehničara u proizvodnji.
      icon: tabler:users
    - title: Postrojenje od 12.000 m²
      description: Specijalizovana fabrika sa 6 proizvodnih linija za RIBs, napuhavajuće čamce i SUP daske.
      icon: tabler:building-factory
    - title: 50+ zemalja u kojima poslujemo
      description: Izvozimo u Evropu, Ameriku, Bliski Istok, Azijsko-pacifički region i Afriku.
      icon: tabler:globe
