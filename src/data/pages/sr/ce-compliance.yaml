content_scope:
  tagline: Obim usklađenosti
  title: Koji proizvodi trebaju<br />RCD Usklađenost?
  subtitle: Direktiva o rekreativnim plovilima 2013/53 / EU odnosi se na rekreativne plovila sa dužinom trupa između 2,5 m i 24 m. Razumevanje opsega je prvi korak ka usaglašenosti.
  items:
    - title: RIB Čamci (2,5–24 m)
      description: Kruti čamci na naduvavanje sa dužinom trupa od 2,5 m do 24 m spadaju pod RCD. Kategorije dizajna od A do D primenjuju se u zavisnosti od predviđenih uslova na moru i maksimalne sile vetra.
      icon: tabler:sailboat
    - title: Čamci na naduvavanje (ispod 2,5 m)
      description: Mali čamci na naduvavanje i gumenjaci ispod 2,5 m mogu biti delimično izuzeti RCD , ali i dalje zahtevaju CE obeležavanje u skladu sa drugim važećim direktivama i ISO EN 6185 građevinskim standardima.
      icon: tabler:sailboat
    - title: SUP Ploče i dodatna oprema
      description: Stand-up paddle boards su izvan RCD opsega. Međutim, povezani lični uređaji za plutanje (PFD) zahtevaju CE obeležavanje u skladu sa Uredbom OZO (EU) KSNUMKS / KSNUMKS sa USCG odobrenjem tipa III / V gde je to moguće.
      icon: tabler:swimming
    - title: Delimično završeni brodovi
      description: Brodovi isporučeni bez motora ili specifičnih instalacija zahtevaju deklaraciju graditelja za delimično završen zanat, sa RCD potpunom usklađenošću završen od strane konačnog graditelja ili uvoznika.
      icon: tabler:tool
content_trust_layers:
  tagline: Troslojni sistem poverenja
  title: Informacije o usklađenosti<br />— Deljeno na odgovarajućem nivou
  subtitle: Nisu svi podaci o usklađenosti namenjeni za javni vebsajt. Primenjujemo pristup u tri sloja koji štiti intelektualnu svojinu uz izgradnju poverenja kupaca.
  items:
    - title: Nivo 1 — Javni vebsajt
      description: Referencirani standardi, objašnjeni putevi usklađenosti, navedeni tipovi dokumenata, opseg sertifikacije po porodici modela. Nema stvarnih sertifikata, test podataka ili poverljivih inženjerskih detalja.
      icon: tabler:world
    - title: Nivo 2 — Deljenje nakon upita
      description: 'Nakon kvalifikovanog upita: izmenjeni DoC uzorak, fotografija pločice proizvođača, lista važećih standarda, kontrolna lista usklađenosti i rezimei sertifikata materijala — podeljeno pod uslovima poštene upotrebe.'
      icon: tabler:mail
    - title: Sloj 3 — NDA / Faza porudžbine
      description: Puna tehnička dokumentacija, procene rizika, proračuni stabilnosti, izveštaji o testiranju, zapisi o serijama materijala i dokumentacija o sledljivosti proizvodnje — deljeni samo pod NDA sa potvrđenim kupcima.
      icon: tabler:lock
content_standards:
  tagline: Primjenjivi standardi
  title: ISO & EN standardi<br />Mi gradimo da
  subtitle: Naši proizvodi su dizajnirani i testirani u skladu sa usklađenim standardima pod RCD. Brojevi i nazivi standarda su navedeni; puni tekstovi standarda ostaju ISO zaštićeni autorskim pravima.
  items:
    - title: SR ISO 6185-3
      description: 'Naduvavanje čamci — Deo 3: Čamci sa maksimalnom snagom motora od 15 kW ili više. Zahtevi za konstrukciju, stabilnost, plovnost i spašavanje čoveka koji je pao u vodu za RIBs.'
      icon: tabler:file-text
    - title: SR ISO 6185-4
      description: 'Naduvavajući čamci — Deo 4: Čamci sa maksimalnom snagom motora od 15 kW i većom ili jednako 4,5 kW. Dodatni zahtevi za konstrukciju i stabilnost.'
      icon: tabler:file-text
    - title: ISO Serija 12215
      description: Mali plovci — Konstrukcija trupa i dimenzionisanje. Strukturni dizajn trupa, palube i pregrada za trupove od stakloplastike i aluminijuma RIB.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Mali plovili — Uputstvo za vlasnika. Obavezan sadržaj i format uputstva za vlasnika koje prati svaku RIB čamac isporučen u EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Mali brod — Oznaka proizvođača. Informacije koje treba trajno označiti na oznaci proizvođača pričvršćenoj na svaki brod.
      icon: tabler:badge
    - title: ISO 8666
      description: Mali brodovi — Glavni podaci. Standardizovana merenja i parametri za doslednu specifikaciju u svim dokumentima o proizvodu.
      icon: tabler:dimensions
content_process:
  tagline: Proces usklađenosti
  title: 6-step CE usklađenost<br />Tok rada
  subtitle: Od opsega projekta do sledljivosti na serijskom nivou — svaki RIB model prati definisanu putanju usklađenosti.
  steps:
    - number: '01'
      title: Obim i klasifikacija projekta
      description: Definišite RIB model, kategoriju dizajna (A/B/C/D), maksimalan broj osoba, nosivost, snagu motora i ciljano tržište. Odredite da li se RCD primenjuje i koji modul procene usklađenosti je potreban.
      timeline: 2–3 dana
    - number: '02'
      title: Identifikacija primenjivih zahteva
      description: Identifikujte sve primenjive osnovne zahteve sigurnosti iz RCD Aneks I, relevantne harmonizovane standarde (EN ISO 6185, 12215, 10240, 14945), i sve dodatne nacionalne zahteve za ciljano tržište.
      timeline: 3–5 dana
    - number: '03'
      title: Dizajn i tehnička dokumentacija
      description: 'Kreirajte Glavnu tehničku dokumentaciju: crtanje opšteg rasporeda, proračuni stabilnosti i plovnosti, procena rizika, specifikacije materijala i analiza sigurnosti sistema (gorivo, elektrika, upravljanje).'
      timeline: 10–15 dana
    - number: '04'
      title: Verifikacija i testiranje proizvoda
      description: Sprovođenje fizičke verifikacije — testiranje pod pritiskom pri 1,25x nominalnog pritiska tokom 24–48 sati, testovi stabilnosti i plovnosti, testovi opterećenja i puštanje sistema u rad. Zabeležite sve rezultate testova po trupu.
      timeline: 5–7 dana
    - number: '05'
      title: Označavanje i dokumentacija isporuke
      description: Postavite CE oznaku, ploču proizvođača (EN ISO 14945) i HIN/CIN (broj identifikacije trupa). Pripremite EU izjavu o usklađenosti, priručnik za vlasnika (EN ISO 10240) i kontrolni spisak usklađenosti.
      timeline: 2–3 dana
    - number: '06'
      title: Praćenje na nivou serije
      description: Svaki trup dobija jedinstveni Zapis o trupu koji ga povezuje sa Glavnom tehničkom dokumentacijom, proizvodnom serijom, sertifikatima materijala, rezultatima testova i konačnom konfiguracijom. Zapisnici se čuvaju 10+ godina prema RCD.
      timeline: Tokom trajanja
content_document_cards:
  tagline: Tipovi dokumenata
  title: Dokument o usklađenosti<br />Kartice
  subtitle: Ovo su tipovi dokumenata koje pripremamo i održavamo za svaki CE-sertifikovani RIB model. Uzorci su dostupni nakon kvalifikovanog upita.
  items:
    - title: CE / RCD Sertifikat o usklađenosti
      description: Sertifikat specifičan za model koji potvrđuje da plovilo ispunjava sve primenjive osnovne zahteve sigurnosti iz RCD 2013/53/EU, izdat od strane proizvođača uz učešće Notifikovanog tela gde je potrebno.
      icon: tabler:certificate
    - title: EU Izjava o usklađenosti (DoC)
      description: Potpisana izjava proizvođača ili ovlašćenog predstavnika, u kojoj se navode primenljive direktive, standardi, modul usklađenosti i podaci o Notifikovanom telu. Potrebna je za svaki model plasiran na tržište EU.
      icon: tabler:file-check
    - title: Ploča proizvođača (EN ISO 14945)
      description: Permanetno postavljena ploča koja pokazuje maksimalan broj osoba, maksimalnu snagu motora, kategoriju dizajna i identifikaciju proizvođača. Mora ostati čitljiva tokom celog životnog veka plovila.
      icon: tabler:badge
    - title: Priručnik za vlasnika (EN ISO 10240)
      description: Sveobuhvatni priručnik koji obuhvata bezbednu upotrebu, procedure u vanrednim situacijama, raspored održavanja i upozorenja o bezbednosti. Obavezan je za svako RIB isporučeno u EU.
      icon: tabler:book
    - title: ISO Izveštaji o testiranju i inspekciji
      description: Zapisnici o testu pod pritiskom (1,25x / 24–48h), rezultati testova stabilnosti i plovnosti, sertifikati testiranih materijala, i izveštaji o dimenzionalnoj verifikaciji — sve povezano sa pojedinačnim brojevima trupa.
      icon: tabler:test-pipe
    - title: Evidencija sledljivosti materijala
      description: Praćenje na nivou serije za tkaninu cevi, lepke, stakloplastiku i hardver. Povezuje svaku proizvodnu jedinicu sa sertifikatima ulaznog materijala i rezultatima IQC inspekcije.
      icon: tabler:link
    - title: Inspekcija kvaliteta i QC zapisnici
      description: Kontrolna lista kvaliteta od 100 poena po jedinici, zapisi interne kontrole kvaliteta u toku procesa, izveštaji o neusklađenosti i korektivne radnje. Deo lanca sledljivosti proizvodnje.
      icon: tabler:clipboard-check
    - title: Paket projektne dokumentacije
      description: Paket dokumentacije po trupu koji uključuje konačni zapisnik o konfiguraciji, detalje o instalaciji motora i opreme, kontrolnu listu za puštanje u rad i dokumentaciju o isporuci.
      icon: tabler:package
content_design_categories:
  tagline: RCD Kategorije dizajna
  title: Kategorija dizajna A–D<br />— Šta Oni Znače
  subtitle: RCD dodeljuje kategorije dizajna na osnovu maksimalne sile vetra i značajne visine talasa koju plovilo može izdržati.
  items:
    - title: Kategorija A — Okean
      description: Dizajniran za duža putovanja gde snaga vetra može premašiti Boforovih 8 (>40 čvorova) i gde visina talasa može premašiti 4 m. Zahteva najstrožu proveru strukture i stabilnosti.
      icon: tabler:ripple
    - title: Kategorija B — Offshore
      description: Dizajniran za pomorske plovidbe uz vetar jačine do 8 po Bofortu (≤40 čvorova) i značajnu visinu talasa do 4 m. Pogodan za priobalne i polu-izložene vode.
      icon: tabler:anchor
    - title: Kategorija C — Priobalna
      description: Dizajnirano za priobalna putovanja pri snazi vetra do 6 po Boforu (≤27 čvorova) i značajnoj visini talasa do 2 m. Većina rekreativnih RIBs spada u ovu kategoriju.
      icon: tabler:sun
    - title: Kategorija D — Zaštićeno
      description: Dizajnirano za zaštićene vode sa snagom vetra do 4 po Boforu (≤16 čvorova) i značajnom visinom talasa do 0,3 m. Jezerca, reke i zaštićene luke.
      icon: tabler:pool
content_hin:
  tagline: Identifikacija zanata
  title: HIN / CIN i tabla proizvođača
  subtitle: Svaka RIB čamca zahteva Hull Identification Number (HIN) ili Craft Identification Number (CIN) i pločicu proizvođača prema EN ISO 14945 i RCD zahtevima.
  items:
    - title: Identifikacioni broj trupa (HIN)
      description: Jedinstveni 14-znamenkasti kod trajno označen na desnoj strani zadnjeg dela broda, koji kodira kod proizvođača (MIC), godinu modela, godinu proizvodnje i serijski broj. Potreban za ulazak na tržište EU.
      icon: tabler:hash
    - title: Identifikacioni broj plovila (CIN)
      description: Prema EN ISO 10087, skriveni sekundarni identifikacioni broj smešten na skrivenoj lokaciji u svrhu zaštite od krađe i pratljivosti.
      icon: tabler:eye-off
    - title: Sadržaj table graditelja
      description: Maksimalan broj osoba, maksimalna snaga motora (kW), maksimalno opterećenje (kg), kategorija dizajna, naziv proizvođača i CE oznaka — sve trajno prikazano na pločici otpornog na koroziju.
      icon: tabler:badge
content_tech_file:
  tagline: Struktura tehničke datoteke
  title: Glavna tehnička datoteka<br />& Hull Zapis
  subtitle: 'Naš sistem dokumentacije prati dvoslojnu strukturu: glavnu tehničku datoteku za svaku porodicu modela i pojedinačne zapise trupa za svaki proizvedeni brod.'
  items:
    - title: Glavna tehnička datoteka
      description: 'Sadrži kompletnu dokumentaciju o usklađenosti za porodicu modela: opšti aranžman, procenu rizika, proračune stabilnosti / plovnosti, specifikacije materijala, važeće standarde i evidenciju o ocenjivanju usaglašenosti. Zadržan za 10+ godina.'
      icon: tabler:folder
    - title: Zapis trupa (sledljivost po brodu)
      description: 'Svaki trup ima jedinstveni zapis koji ga povezuje sa glavnom tehničkom datotekom: HIN, datum proizvodnje, serija cevi, sertifikati materijala, rezultat ispitivanja pritiska, konačna konfiguracija, instalacija motora i odredište isporuke.'
      icon: tabler:file-description
    - title: Paket za usaglašenost kupaca
      description: Paket za isporuku po trupu, uključujući DoC, fotografiju ploče graditelja, uputstvo za vlasnika, rezime testa i konačni konfiguracioni list - obezbeđen sa svakim RIB isporučenim u EU.
      icon: tabler:package
content_material_cert:
  tagline: Sertifikacija materijala
  title: Materijal Sledljivost &<br />Dokazi o sertifikaciji
  subtitle: Kvalitetni RIB brodovi počinju sa kontrolisanim materijalima i dokumentovanim procesima. Ispod je kako organizujemo sertifikaciju materijala za svaku kritičnu grupu komponenti.
  items:
    - title: Naduvavanje cevi materijal sledljivost
      description: PVC i CSM/Hypalon tube materijali se biraju prema namenu upotrebe, klimatskim uslovima i ciljnom tržištu. Dobavljač tehnički podaci (TDS), informacije o seriji materijala, tkanina serija sledljivosti, UV i vremenske uslove test izveštaji, i REACH/ SVHC deklaracije su dostupni u okviru dogovorenog obima projektne dokumentacije.
      icon: tabler:circle
    - title: Marine aluminijuma sledljivost
      description: Za projekte aluminijuma trupa RIB , legure razreda, debljine i materijala serije se kontrolišu po odobrenoj specifikaciji. Sertifikati o ispitivanju materijala (MTC / MTR), EN KSNUMKS KSNUMKS dokumentacija, izveštaji o hemijskom sastavu i mehaničkim svojstvima i sledljivost toplote / partije se isporučuju tamo gde je dogovoreno.
      icon: tabler:rectangle
    - title: GRP trup Materijal i kontrola procesa
      description: Za fiberglasa-trupaRIBs, gelcoat, smola, fiberglas armatura i jezgro materijali se upravljaju kroz kontrolisane specifikacije. Materijal TDS / SDS, serija evidencije, laminat specifikacije, i sušenje i radionica kontrola evidencije su dostupni po dogovoru projekta.
      icon: tabler:layers-subtract
    - title: Podrška za dokumentaciju komponenti
      description: Za odabrane komponente - uključujući EVA materijale palube, sedišta, hardver od nerđajućeg čelika, sisteme goriva, električnu opremu i pomorsku dodatnu opremu - važeća dokumentacija dobavljača se koordinira na osnovu konačne konfiguracije i zahteva odredišta-tržišta.
      icon: tabler:package
    - title: Obaveštenje o opsegu usklađenosti
      description: Sertifikati, izveštaji o ispitivanju i dokumenti o usaglašenosti odnose se samo na određeni model proizvoda, materijal, komponentu, proizvodnu seriju ili obim projekta naveden u odgovarajućem dokumentu. Kontaktirajte nas sa svojim ciljnim tržištem, namenom upotrebe i tehničkim zahtevima kako bi se važeći paket dokumentacije mogao potvrditi pre naručivanja.
      icon: tabler:info-circle
faq:
  title: CE Usklađenost — Često postavljana pitanja
  questions:
    - q: Da li su Paddle Board Overstock RIB svi brodovi CE sertifikovani za tržište EU?
      a: RIB brodovi u našem katalogu su dizajnirani i dokumentovani za RCD usklađenost KSNUMKS / KSNUMKS / EU prema važećim direktivama EU.CE Označavanje se primenjuje po modelu, po konfiguraciji. Kontaktirajte nas za dokument o usklađenosti specifičan za model.
    - q: Koja je razlika između RCD usklađenosti i CE obeležavanja?
      a: RCD (Direktiva o rekreativnim plovilima 2013 / 53 / EU) je zakonodavstvo EU koje postavlja osnovne bezbednosne zahteve.CE Obeležavanje je vizuelni simbol postavljen na proizvod koji je procenjen i potvrđen da ispunjava te zahteve. Proizvod mora biti u skladu sa RCD pre nego što može da nosi CE oznaku.
    - q: Da li pružate deklaracije o usaglašenosti sa svakim brodom?
      a: Da. Svaka RIB čamac isporučen na tržište EU uključuje model-specifičnu EU Deklaraciju o usaglašenosti koja navodi primenjene direktive, harmonizovane standarde, modul ocene usaglašenosti i podatke o Obaveštenom telu.
    - q: Koji modul ocene usaglašenosti koristi Paddle Board Overstock?
      a: Modul zavisi od kategorije dizajna i tipa čamca. Većina RIB modela u dizajnerskoj kategoriji C koristi Modul A (interni nadzor proizvodnje). Za čamce dizajnerske kategorije A/B ili specifične konfiguracije, može se primeniti Modul B+C ili B+D uz učešće Obaveštenog tela. Savetujemo o odgovarajućem modulu po projektu.
    - q: Možete li podeliti dokumentaciju o usaglašenosti pre nego što izvršimo narudžbinu?
      a: Nakon kvalifikovanog upita, delimo dokument o opsegu usaglašenosti koji navodi primenjene standarde, put ocene usaglašenosti i vrste dokumenata dostupne za model koji procenjujete. Potpuni tehnički dosijei se dele pod NDA nakon potvrde narudžbine.
    - q: Šta je Broj identifikacije trupa (HIN) i da li je uključen?
      a: HIN je jedinstveni identifikator od 14 karaktera, trajno označen na svakom čamcu, kodira šifru proizvođača (MIC), oznaku modela, godinu proizvodnje i serijski broj. Obavezan je za sve RIB čamce plasirane na tržište EU i uključen je na svakom Paddle Board Overstock RIB.
    - q: Koliko dugo se tehnički dosijei čuvaju?
      a: Prema RCD 2013/53/EU, proizvođač mora čuvati tehnički dosije najmanje 10 godina od poslednjeg datuma stavljanja proizvoda na tržište. Paddle Board Overstock održava kompletnu tehničku dokumentaciju za sve proizvedene modele.
    - q: Da li pomažete u obaveznim zadacima uvoznika prema RCD?
      a: 'Da. Pružamo paket dokumentacije koji uvoznici u EU trebaju da ispune svoje obaveze: pristup tehničkom dosijeu, DoC, tablu proizvođača, uputstvo za vlasnika i evidenciju praćenja proizvoda. Obaveze uvoznika prema RCD jasno su dokumentovane u našem vodiču za usaglašenost.'
