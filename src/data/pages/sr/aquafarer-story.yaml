  tagline: Naša Priča
  title: Aquafarer — Inženjering Slobode na Vodi
  subtitle: 'Od obalske radionice do globalnog proizvođača nautičke opreme — naše putovanje je zasnovano na upornom verovanju: plovila treba projektovati kao da su važna, jer zaista jesu.'
  image:
