        value: 12,000 m²
      - label: Radna snaga
        value: 200-300
      - label: Inženjeri za istraživanje i razvoj
        value: 14+
      - label: Godišnji kapacitet
        value: 15,000
  quality:
    title: Posvećenost kvalitetu
    body: Od inspekcije materijala do konačnog testiranja, Aquafarer održava sistematske procese kvaliteta kako bi isporučio pouzdane proizvodе za pomorstvo. Svaka jedinica prolazi testiranje pritiska, inspekciju šava i verifikaciju performansi pre isporuke.
    items:
      - CE Sertifikovano — 64 modela zadovoljavaju evropske bezbednosne standarde
      - ISO 9001:2015 — Sertifikovan sistem upravljanja kvalitetom
      - UKCA Obeleženo — usklađenost sa tržištem UK
  global:
    title: Globalna prisutnost
    body: Aquafarer pruža usluge kupcima na više globalnih tržišta, podržavajući distributere, brendove za aktivnosti na otvorenom i profesionalne korisnike u morskom sektoru u 50+ zemalja širom Evrope, Azijsko-pacifičkog regiona, Amerike, Bliskog Istoka i Afrike.
comparison:
  tagline: Pozicioniranje brenda
  title: Aquafarer na tržnici
  position: Inženjerski fokusiran proizvođač pomorske opreme koji kombinuje stručnost u izradi napuhavajućih plovila sa potpunom OEM/ODM sposobnošću, prilagođenim rešenjima i dubokim iskustvom u proizvodnji.
  strengths:
    - Inženjerska stručnost za naduvane vodeće brodove
    - Puna OEM/ODM proizvodna sposobnost
    - Prilagođeni razvoj i dizajn proizvoda
    - 12.000 m² ISO proizvodni pogon sertifikovan po standardu 9001
  bestFor:
    - Korisnici aktivnosti na otvorenom koji traže pouzdana naduvavanja plovila
    - Morski operateri kojima je potrebna oprema komercijalnog kvaliteta
    - Partneri brenda kojima je potrebna OEM/ODM proizvodnja
    - Profesionalne spasilačke i patrolne organizacije
