timeline:
  - year: '2012'
    title: Osnivanje proizvodnje nautičke opreme
    body: Aquafarer je započeo kao specijalizovana radionica za gumena plovila u Qingdau, Kina, posvećena nautičkom zanatstvu i proizvodnji gumenih čamaca. Rana pažnja bila je usmerena na izgradnju pouzdanih gumenih proizvoda kroz praktično inženjersko iskustvo i disciplinu proizvodnje.
  - year: '2015'
    title: Prvi Izvoz & CE Sertifikacija
    body: Početne izvozničke porudžbine stigle su u Japan i Koreju. CE sertifikacija je postignuta za osnovne proizvodne linije, označavajući ulazak Aquafarer na međunarodna tržišta. Kompanija je počela da opslužuje komercijalne i rekreativne korisnike van Kine.
  - year: '2018'
    title: Proširenje Fabrike
    body: Preseljenje u proizvodni pogon od 12.000 m². Dodate su RF linije za zavarivanje i drop-stitch proizvodni kapacitet, omogućavajući veću proizvodnju i poboljšane sisteme kontrole kvaliteta.
  - year: '2020'
    title: Osnivanje R&D Centra
    body: Otvoren je posvećen R&D centar sa PVC laboratorijom za tkanine, hidrodinamičkim test bazenom i CAD/FEA studijom simulacija. Razvoj proizvoda proširen je na fokus na laganu konstrukciju, poboljšanu izdržljivost i dizajn usmeren na korisnika.
  - year: '2022'
    title: Sertifikacija & Globalni Rast
    body: Postignuta je ISO 9001 sertifikacija. Proširen na 14 R&D inženjera i 200+ radnika. Proizvodi su stigli do kupaca širom Evrope, Amerike i Azijsko-Pacifičkog regiona kroz distributerske i OEM partnerstva.
  - year: '2024'
    title: Inovacije & Dizajn Studio
    body: Pokrenut studio za kompletan dizajn i inovacije za prilagođene ODM projekte, od koncepta do proizvodnje. Ojačane profesionalne nautičke primene uključuju spasilačke, komercijalne i državne tendere.
  - year: '2026'
    title: Gradnja Budućnosti Istraživanja na Vodi
    body: Danas, Aquafarer nastavlja da razvija gumene čamce, SUP sisteme i prilagođena rešenja za nautiku — povezujući ljude i organizacije sa vodama sveta. 50+ zemalja opsluženo, godišnji kapacitet 15.000 jedinica.
content_founding:
  tagline: Početak
  title: Rođeni na Obali
  subtitle: 'Aquafarer je započeo u obalskoj radionici u Qingdau sa jednim čamcem i vizijom: da izgradi gumena plovila koja mogu podneti stvarne pomorske uslove.'
  paragraphs:
    - Godine 2012, naši osnivači su uvideli prazninu na tržištu — većina gumenih čamaca bila je ili pristupačna ali nepouzdana, ili visokog kvaliteta ali previše skupa. Verovali su da postoji prostor za proizvođača koji pruža i kvalitet i vrednost.
    - Prvi trup je izgrađen ručno, testiran u lokalnim vodama i rafiniran na osnovu stvarnih povratnih informacija od ribara i malih komercijalnih operatera. Ta povratna petlja - izgraditi, testirati, slušati, poboljšati - ostaje u srži naše inženjerske filozofije danas.
    - Do 2015. godine, reč se proširila izvan Kingdaoa. Međunarodni distributeri počeli su da traže uzorke. Ono što je počelo kao lokalna radionica postajalo je globalni dobavljač.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer rano proizvodnja radionica i proizvodnja
content_growth:
  tagline: Rast i inovacije
  title: Od radionice do 12.000 m² objekta
  subtitle: Kontinuirano ulaganje u ljude, opremu i proces transformisano je Aquafarer u moderan morski proizvodni pogon.
  paragraphs:
    - Kako je potražnja rasla, tako je i naš objekat. Proširili smo se iz male radionice u fabriku od 12.000 m² sa namenskim proizvodnim linijama za RIB čamce, čamce na naduvavanje, SUP daske i pribor.
    - Uložili smo u CNC mašine za sečenje, opremu za visokofrekventno zavarivanje, proizvodne linije za kapanje i sveobuhvatne platforme za testiranje - što nam omogućava da kontrolišemo svaki aspekt kvaliteta proizvodnje.
    - Danas, naš tim od 200-300 uključuje pomorske inženjere, naučnike za materijale, stručnjake za kontrolu kvaliteta i kvalifikovane zanatlije - od kojih su mnogi bili Aquafarer sa od ranih dana.
founder:
  tagline: Upoznajte osnivača
  title: Izgradio Vaterman
  subtitle: Osnivač David Chen okuplja stručnost u proizvodnji i doživotnu strast prema vodenim sportovima - kombinacija koja definiše kako Aquafarer pristupa razvoju proizvoda.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Osnivač Aquafarer
  story:
    - Dejvid Čen je odrastao na obali Kingdaoa, gde more nije bilo destinacija za odmor već način života. Mladost je proveo vozeći kajak, jedrenje i ribolov u Žutom moru - iskustva koja su mu dala intuitivno razumevanje šta plovila treba da izdrže.
    - Pre osnivanjaAquafarer, David je proveo deceniju u pomorskoj proizvodnji, radeći u proizvodnji, kvalitetu i međunarodnoj trgovini. Upravljao OEM je programima za evropske i severnoameričke brendove, učeći standarde i očekivanja globalnih tržišta iz prve ruke.
    - 'Godine 2012. osnovao je Aquafarer jednostavnu misiju: izgraditi plovilo na naduvavanje koje bi poverio svojoj porodici na vodi. Taj lični standard - da li bih ovo koristio? - ostaje konačni test za svaki proizvod koji napusti fabriku.'
    - Danas David vodi strategiju proizvoda i nadgleda tim za istraživanje i razvoj, lično pregledajući nove dizajne i testiranje prototipova na vodama kod Kingdaoa. On veruje da odlični proizvodi dolaze iz razumevanja i inženjeringa i iskustva.
philosophy:
  tagline: Filozofija brenda
  title: Inženjering sloboda na vodi
  body: Sloboda na vodi nije samo kretanje. Ona predstavlja otkrivanje novih mesta, stvaranje iskustava na otvorenom, povezivanje ljudi sa prirodom i omogućavanje profesionalnih misija. Inženjering omogućava tu slobodu.
  pillars:
    - title: Pouzdanost na prvom mestu
      body: Vodena okruženja zahtevaju poverenje.Aquafarer Proizvodi su dizajnirani oko stabilnosti, trajnosti, sigurnosti i konzistentnih performansi.
    - title: Dizajn usredsređen na čoveka
      body: Proizvodi treba da služe ljudima, a ne tehnologiji. Svaka odluka o dizajnu počinje razumevanjem kako ljudi koriste plovila, gde istražuju i sa kojim izazovima se suočavaju.
    - title: Pristupačno istraživanje
      body: Voda ne bi trebalo da pripada samo stručnjacima.Aquafarer Stvara opremu koja omogućava većem broju ljudi da bezbedno dožive reke, jezera, okeane i obalne sredine.
    - title: Kontinuirane inovacije
      body: Inovacija nije samo stvaranje novih proizvoda. To je poboljšanje svakog detalja - materijala, struktura, proizvodnje i korisničkog iskustva.
engineeringDna:
  tagline: Inženjering DNK
  title: Kako Aquafarer stvara proizvode
  areas:
    - title: Nauka o materijalima
      body: Aquafarer se fokusira na izbor odgovarajućih materijala za različita morska okruženja. Ključni faktori uključuju otpornost na habanje, UV otpornost, stabilnost pod pritiskom i dugoročnu izdržljivost.
      items:
        - Otpornost na habanje
        - UV otpornost
        - Stabilnost pod pritiskom
        - Dugotrajna izdržljivost
    - title: Strukturno inženjerstvo
      body: Naduvavajuća plovila zahtevaju preciznu ravnotežu između čvrstoće, težine, prenosivosti i stabilnosti. Aquafarer inženjerstvo se fokusira na optimizaciju ovih faktora kroz drop-stitch osnovnu tehnologiju i naprednu konstrukciju šavova.
      items:
        - Čvrstoća
        - Optimizacija težine
        - Prenosivost
        - Stabilnost
    - title: Preciznost proizvodnje
      body: 'Svaki proizvod prolazi kroz kontrolisane procese: priprema materijala, precizno sečenje, zavarivanje i lepljenje, montaža, kontrola kvaliteta i verifikacija performansi.'
      items:
        - Priprema materijala
        - Precizno sečenje
        - Zavarivanje i lepljenje
        - Montaža i kontrola kvaliteta
    - title: Inženjerstvo korisničkih scenarija
      body: Proizvodi se razvijaju u skladu sa stvarnim primenama — rekreacija, avantura i profesionalna upotreba — osiguravajući da svaki dizajn zadovolji specifične zahteve svoje namene.
      items:
        - Rekreacija
        - Avantura
        - Professional
        - Komercijalno
trustSignals:
  tagline: Signali poverenja
  title: Zašto je Aquafarer pouzdan partner
  manufacturing:
    title: Proizvodni kapacitet
    body: Proizvodni pogon od 12.000 m² sa 200-300 kvalifikovanih radnika i 14+ istraživača i inženjera. ISO ISO 9001 sertifikovan sistem upravljanja kvalitetom. Godišnja proizvodnja od 15.000 jedinica naduvavajućih plovila koja služe 50+ zemalja.
    stats:
