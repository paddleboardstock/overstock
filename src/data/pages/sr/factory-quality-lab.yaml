  - name: Tester ljuštenja (zavarivanje)
    spec: Motorni, kapacitet 50 N
  - name: Komora za temperaturu
    spec: -40 °C do +100 °C
  - name: Tank za detekciju curenja
    spec: 6 m × 2 m, osvetljen
