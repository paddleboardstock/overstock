  title: Sistem kontrole kvaliteta<br />za OEM Marine Manufacturing
  subtitle: Višestepeni inspekcioni proces koji obuhvata dolazne materijale, proizvodnju u toku, testiranje pod pritiskom, konačnu montažu i proveru pre slanja. Svaka serija je pratljiva, svaki test je zabeležen.
