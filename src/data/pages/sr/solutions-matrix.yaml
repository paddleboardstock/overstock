hero:
  tagline: Matrica industrijskih rešenja
  title: Morska rešenja zasnovana na scenariju<br />Za profesionalne operacije
  subtitle: Namenski konstruisana plovila na naduvavanje i RIBs konfigurisana za spašavanje, iznajmljivanje flote, tender jahti i komercijalne ribolovne aplikacije - svaka podržana tehničkim specifikacijama i opcijama prilagođavanja.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer Profesionalna morska rešenja za različite industrije
direct_answer: 'Aquafarer isporučuje scenarij projektovanih gumenih plovila i RIB rešenja za komercijalne pomorske operacije: spasilačke i patrolne čamce sa Hypalon ojačanim cevima i višekomornom sigurnošću, iznajmljivanje SUPs flote i kajaka sa KSNUMKS mm PVC i vrućim vazduhom zavarenim šavovima za nisku izdržljivost održavanja, luksuzne jahte tenderi sa dubokim V aluminijumskim trupom RIBsi teške ribolovne konfiguracije sa držačima štapova i Livevell sistemima.'
solution_a:
  tagline: Rešenje A
  title: Marine Rescue &<br />Komercijalna patrola
  subtitle: Brza, višekomorna sigurnost RIBs za profesionalno reagovanje u vanrednim situacijama i operacije sprovođenja zakona.
  badge: Heavy-Duty Series
  description: Naše morsko spašavanje i patrola RIBs su konstruisani sa ojačanim cevima visoke gustine Hypalon/PVC vazduha sa višekomornim nezavisnim dizajnom flotacije. Svaki brod je opremljen profesionalnom reflektujućom trakom, spasilačkim linijama i ventilima za brzo naduvavanje za spremnost za raspoređivanje. Deep-V trupovi od fiberglasa pružaju izuzetnu stabilnost pri velikim brzinama i u teškim uslovima mora.
  features:
    - title: Višenamenske komore za bezbednost
      description: 4–6 nezavisnih vazdušnih komora — bilo koja punkcija u jednoj komori održava pozitivnu flotaciju
    - title: Ojačana cevi tkanina
      description: 1,2 mm Hypalon CSM ili 1.680 DTEX PVC sa dvoslojnim zavarenim šavovima sa toplim vazduhom
    - title: Stručni razred
      description: SOLAS reflektujuća traka, spasavanje grab linije, vuča bitve, brzo oslobađanje slikar linija
    - title: Trup velike brzine
      description: Deep-V fiberglasa ili aluminijumski trup ocijenjen za 25–45 čvorova u zavisnosti od konfiguracije
  recommended_models:
    - RIB 450 Patrola
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materijal trupa
      value: Fiberglas / Marine-razred aluminijuma
    - label: cevi tkanina
      value: 1.2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Maksimalna brzina
      value: 25–45 čvorova
    - label: Kapacitet
      value: 6–12 osoba
    - label: Opseg motora
      value: 40–200 HP
    - label: Sertifikacija
      value: CE / ISO 9001
solution_b:
  tagline: Rešenje B
  title: Iznajmljivanje vodnih sportova &<br />Oprema za flotu resorta
  subtitle: Ekstremno izdržljivi, niskog održavanja napuhavajući SUPs, kajaci i čamci izrađeni za svakodnevnu upotrebu u iznajmljivanju u resortima, klubovima i turističkim operacijama.
  badge: Rental-Grade
  description: Naša oprema za iznajmljivanje flote projektovana je za maksimalnu izdržljivost i minimalne troškove održavanja. Koristimo 1,2 mm ojačani PVC sa tehnologijom spajanja šavova triplim zavarivanjem toplim vazduhom koja odoleva UV degradaciji i čestom oštećenju usled sudara. Drop-stitch konstrukcija osigurava da daske zadrže čvrstoću čak i nakon stotina ciklusa iznajmljivanja. Svi modeli imaju ojačane D-prstenove, otpornе na habanje rubne trake i komercijalne ventile.
  features:
    - title: Komercijalni PVC
      description: 1,2 mm ojačani PVC sa UV stabilizatorima — 3x deblji od materijala za potrošače
    - title: Šavovi zavareni toplim vazduhom
      description: Trostruko zavarivanje fuzijom — jače od lepljenja, odoleva delaminaciji
    - title: Drop-Stitch Krutost
      description: 1.680 DTEX jezgro sa 2 nite/inč — ocenjena na 20 PSI za čvrstoću sličnu tvrdim daskama
    - title: Dizajn spreman za flotu
      description: Ojačani D-prstenovi, komercijalni Halkey-Roberts ventili, rubne trake otporne na habanje
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materijal cevi
      value: 1,0–1,2 mm ojačani PVC
    - label: Tehnologija šava
      value: Trostruko zavarivanje toplim vazduhom
    - label: Maksimalni pritisak
      value: 15–20 PSI (drop-stitch modeli)
    - label: UV otpornost
      value: 1.000+ sati ubrzanog testiranja
    - label: Garancija
      value: 2–5 godina u zavisnosti od modela
    - label: Održavanje
      value: Minimalno — isprati i čuvati
solution_c:
  tagline: Rastvor C
  title: Jaht Tenders &<br />Luksuzna plovila
  subtitle: Lagana, visokoperformantna RIB plovila dizajnirana za skladištenje na superjahtama i transport gostiju sa luksuznom obradom i završnom obradom.
  badge: Premium Series
  description: Naši jaht tenders RIBs kombinuju laganu konstrukciju sa luksuznom estetikom. Trupovi od aluminijuma ili stakloplastike sa dubokim V oblikom pružaju izuzetno kvalitetno plovidbu i lako podizanje dizalicom. Dostupni su sa grafikom na cevima u boji, premium tapacirungom i prilagođenim rasporedom konzola. Kompaktne dimenzije skladištenja čine ih idealnim za garaže i palube superjahti.
  features:
    - title: Lagana konstrukcija
      description: Trupovi od aluminijuma marine klase smanjuju težinu za 30% u odnosu na stakloplastiku za lako podizanje
    - title: Deep-V performanse
      description: Trup sa 18–22 stepena za glatku vožnju po talasima i odličnu stabilnost
    - title: Luksuzna obrada i završna obrada
      description: Prilagođeni tapacirung, cevi u boji, premium komandna konzola, paket od nerđajućeg čelika
    - title: Kompaktno skladištenje
      description: Dizajnirano za garaže superjahta — cevasti delovi se mogu ispustiti za kompaktno skladištenje
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Tip trupa
      value: Duboko-V Aluminijum / Stakloplastika
    - label: Deadrise
      value: 18–22 stepena
    - label: Maksimalna brzina
      value: 30–40 čvorova
    - label: Suva težina
      value: 120–350 kg (aluminijumski trup)
    - label: Pripremljeno za dizalicu
      value: Da — standardne tačke za podizanje
    - label: Skladištenje
      value: Cevasti delovi koji se mogu ispustiti, naslagivi
