testimonial:
  content: Aquafarer Dizajnirao i opremio ceo naš program aktivnosti na plaži u tri odmarališta. 80SUPs, 40 kajaka, bezbednosna infrastruktura i obuka osoblja - sve isporučeno u jednoj pošiljci. Naše učešće gostiju u vodenim aktivnostima poraslo je za 60% u prvoj sezoni.
  name: Sofi Loran
  title: Direktor iskustva gostiju, Azure Bay Resorts — Phuket, Tajland
content_segments:
  tagline: Profili odmarališta
  title: Vaterfront Hospitaliti Solutions<br />Po vrsti imovine
  subtitle: Svako odmaralište ima jedinstven profil gostiju, kombinaciju aktivnosti i operativni ritam - od butik eko-loža do prostranih luksuznih odmarališta na plaži. Dizajniramo programe vodenih sportova koji odgovaraju klasi imovine i očekivanjima gostiju.
  items:
    - title: Luksuzna odmarališta na plaži
      subtitle: VIP transferi, vodene aktivnosti, vrhunsko iskustvo gostiju
      description: Vrhunske nekretnine na plaži - Four Seasons, Aman i slične luksuzne grupe - gde su vodeni sportovi šatorski pogodnost za goste koji voze rezultate zadovoljstva i prateće prihode. Flota mora izgledati vrhunski, nuditi raznolikost u svim starosnim grupama i nivoima sposobnosti i neprimetno se integrisati sa postojećim concierge i sistemima rezervacija u odmaralištu. Očekivanja od gostovanja su izuzetno visoka - stanje opreme i prezentacija direktno utiču na ocene sa 5 zvezdica.
      features:
        - 'Vrhunska brendirana flota: SUPskajaci, pedaline i RIB mali tenderi'
        - 'Prezentacija spremna za goste: odgovarajuće boje odmarališta, brendiranje logotipa, prikaz opreme'
        - Mali luksuz RIB za VIP transfere gostiju sa prilagođenim presvlakama i podudaranjem boja
        - 'Integrisana bezbednosna infrastruktura: linije plutača, spasilačke stanice, AED'
        - 'Upravljanje prihodima: dinamički šabloni cena, upsell obuka, paket grupisanje'
    - title: Privatno ostrvo Odmarališta
      subtitle: Prevoz gostiju u svim vremenskim uslovima — nula zastoja, apsolutna pouzdanost
      description: Privatna ostrvska odmarališta rade na udaljenim lokacijama gde je brod jedina veza sa kopnom. Dnevni transferi gostiju, snabdevanje i hitne medicinske evakuacije zavise od jednog plovila - svaki zastoj direktno utiče na iskustvo gostiju i operacije odmarališta. Ovim operaterima je potreban brod koji pouzdano radi u svim vremenskim uslovima, zahteva minimalno održavanje i ima rezervne sisteme za kritičnu pouzdanost. Brod takođe mora biti lepo predstavljen dok gosti stižu na ostrvo.
      features:
        - Konfiguracija za sve vremenske uslove RIB sa punim vremenskim kućištem i cevima za teške uslove rada
        - Dvostruki motor ili rezervni motor za operacije sa nultim zastojima
        - Hypalon Komercijalni razred konstrukcija za 5-8 godina životnog veka u daljinskom servisu
        - Dizajn koji se lako održava sa pristupačnim komponentama za servisiranje na licu mesta
        - Prilagođeno brendiranje odmarališta i vrhunska presvlaka koja odgovara ostrvskoj estetici
    - title: Odmarališta pored jezera i ekološka odmarališta
      subtitle: Iskustva gostiju integrisana u prirodu
      description: Lakeside svojstva, eko-lože i priroda povlačenja nude tihe vodene aktivnosti sa malim uticajem koje dopunjuju prirodno okruženje. Oprema treba da bude nemotorizovana gde je to moguće, lako se skladišti u kućicama sa ograničenim prostorom i tiho u upotrebi kako bi se očuvalo ambijentalno iskustvo za sve goste.
      features:
        - 'Nemotorizovana flota: SUPskajaci, kanui i pedaline'
        - Tihe stanice za naduvavanje električnih pumpi za goste na zahtev
        - Ekološki prihvatljivi materijali i ambalaža usklađeni sa brendiranjem održivosti
        - Uključeni su regali za skladištenje i sistemi organizacije kućica za čamce
    - title: Klubovi na plaži
      subtitle: Transferi gostiju, zabava, mali luksuz RIBs
      description: Klubovi na plaži upravljaju visokoenergetskim, vizuelno fokusiranim okruženjem u kojem je oprema deo atmosfere. Potreban im je mali luksuz RIBs za transfere gostiju iz obližnjih hotela ili pristaništa, i vodene igračke za zabavu gostiju - vuča jet skija, tobogani na naduvavanje i daske za veslanje. Flota mora izgledati elegantno, biti jednostavna za rukovanje i izdržati svakodnevnu upotrebu od strane gostiju sa različitim nivoima veština. Skladištenje i brzo raspoređivanje su kritični tokom vršnih sati.
      features:
        - Kompaktan luksuz RIB (3.3-4.3m) za transfere gostiju i tenderske usluge
        - 'Vodene igračke: vučni gumenjaci SUP , daske, kajaci za zabavu gostiju'
        - Prilagođena boja i brendiranje odgovarajuća plaža klub vizuelni identitet
        - Sistemi za brzo pokretanje i pronalaženje za operacije sa velikim prometom
        - Hypalon Izdržljiva konstrukcija za svakodnevno izlaganje slanoj vodi i UV
    - title: Privatni članovi Klubovi i Yacht Clubs
      subtitle: Lučki prevoz, tenderi za članove, ekskluzivni sportovi na vodi
      description: Privatni klubovi u kojima su vodeni sportovi i brodski prevoz korist od članova, a ne pokretač prihoda. Oprema mora zadovoljiti više estetske standarde, biti dostupna na zahtev za članove i zahtevati minimalan nadzor osoblja. Marina jahti klubovi posebno trebaju tendere za lučki prevoz - premeštanje članova između pristaništa, veza i obale. Skladištenje i održavanje treba da budu nevidljivi članovima.
      features:
        - RIB Vrhunski tenderi za lučki prevoz i uslugu prenosa članova
        - 'Vrhunska oprema: EVA palube, prilagođene boje članova, brendirane presvlake'
        - Samouslužni check-out sistem za pristup članovima bez osoblja
        - Van sezone skladištenje i godišnji program osvežavanja
    - title: Hoteli fokusirani na avanturu i aktivnosti
      subtitle: Vođene ture, SUP joga, izleti za ronjenje sa maskom i disalicom, grupne aktivnosti
      description: Objekti koji se pozicioniraju kao destinacije za avanturistički odmor — nude vođene ture, SUP jogu, vožnje kajakom za vreme zalaska sunca, izlete za ronjenje sa maskom i disalicom, i grupne aktivnosti. Flota treba da podržava i modele slobodnog iznajmljivanja i vođene programe, sa opremom koja se lako prilagođava upotrebi od strane gostiju ili vođenim turama sa instruktorom. Ovi objekti zahtevaju izdržljivu opremu za učestalu upotrebu, sa lakoćom čišćenja između grupa gostiju.
      features:
        - Svestrana mešana flota koja podržava modele iznajmljivanja i vođenih tura +
        - Tandem kajaci i dodatno stabilne SUP platforme za grupne aktivnosti
        - 'Oprema za instruktore: daske za instruktore, vodootporne kutije, vodootporni komunikacioni uređaji'
        - 'Sezonska rotacija opreme: letnja flota → zimski skladišni program'
        - Izdržljiva konstrukcija namenjena svakodnevnoj upotrebi od strane gostiju uz minimalno održavanje
