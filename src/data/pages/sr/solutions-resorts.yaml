hero:
  tagline: Hoteli, odmarališta i ugostiteljstvo
  title: Premium doživljaji na vodi<br />Za hotele, odmarališta i jahting klubove
  subtitle: Kompletni programi vodenih sportova za hotele na plaži, odmarališta na privatnim ostrvima, plažne klubove i jahting klubove — od opreme za goste i RIB pomoću do sigurnosnih sistema i obuke osoblja.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer gumeni čamci za aktivnosti na vodi u odmaralištima
direct_answer: Aquafarer sarađuje sa hotelima, odmaralištima, privatnim ostrvima, plažnim klubovima i jahting klubovima širom sveta kako bi kreirao premium doživljaje na vodi. Naša rešenja uključuju SUP flote za iznajmljivanje, kajake za vođene ture, tender RIBs za prevoz gostiju, male luksuzne RIBs za transfere do plažnih klubova i kompletnu sigurnosnu opremu. Svaki deo opreme može biti brendiran logoom i bojama vaše nekretnine. Takođe pružamo obuku osoblja, konsultacije za dizajn programa i planiranje zamene flote kako bismo osigurali dosledan kvalitet tokom cele sezone.
