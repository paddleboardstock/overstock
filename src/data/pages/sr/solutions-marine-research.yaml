content_challenge:
  tagline: Izazov
  title: Zahtevi za morska istraživanja<br />Stabilne platforme spremne za instrumente
  subtitle: Naučni radni brodovi moraju obezbediti stabilnu platformu za osetljive instrumente, tihi rad kako bi se izbeglo uznemiravanje divljih životinja i fleksibilne rasporede za raznovrsnu istraživačku opremu.
  paragraphs:
    - Morska istraživanja i praćenje životne sredine zahtevaju radne brodove koji služe kao mobilni laboratoriji. Za razliku od komercijalnih ili rekreativnih plovila, istraživački RIBs moraju moći smestiti osetljivu elektronsku opremu, uređaje za uzorkovanje vode i sedimenta, i ponekad transport živih uzoraka — sve dok održavaju stabilnu platformu za tačno prikupljanje podataka.
    - '**Stabilnost platforme je ključna** — Sonari, odjeci-tajmeri i CTD (provodljivost, temperatura, dubina) profajleri zahtevaju stabilan trup pri mirovanju i pri maloj brzini. Prekomerni talas ili pomeranje trupa uvodi šum u naučne podatke. Duboki V-trup sa dobrim karakteristikama stabilnosti je neophodan.'
    - '**Integracija instrumenata** — Istraživačka plovila zahtevaju montažne tačke za GPS antene, sonar transducere, ruke za uzorkovanje i opremu za snimanje podataka. Konsola mora imati prostor za više ekrana, distribuciju napajanja za instrumente i sigurno skladištenje osetljive elektronike.'
    - '**Tihi rad** — Za morske biološke preglede i praćenje životne sredine, buka motora i vibracije trupa mogu uplašiti morski život i kompromitovati posmatranje ponašanja. Tihi vanbrodski motori i dizajn trupa sa smanjenim vibracijama su važni za istraživačke primene.'
    - Paddle Board Overstock istraživački RIBs su dizajnirani sa stabilnim trupovima, integrisanim sistemima za montažu opreme i tihim vanbrodskim konfiguracijama za naučne i ekološke aplikacije.
content_solution:
  tagline: Naše rešenje
  title: Namenski istraživački RIBs<br />Za nauku i ekološki rad
  subtitle: Svaki Paddle Board Overstock istraživački RIB je konfigurisana kao stabilna, prilagodljiva platforma za naučne instrumente i opremu za terensko uzorkovanje.
  list:
    - Duboki V-trup od fiberglasa sa odličnom stabilnošću pri mirovanju i sporim istraživačkim brzinama
    - Ravni raspored palube sa montažnim pločama za sonar, GPS i opremu za uzorkovanje
    - Konsola konfigurisana za više ekrana — plotter, dubinomerni uređaj, uređaj za snimanje podataka
    - 12V i 24V pomoćna distribucija napajanja za naučne instrumente
    - Tihi 4-taktni vanbrodski motor — minimalne vibracije i buka za istraživanja divljih životinja
    - Opcioni dizajn trupa sa niskim buđenjem za minimalne smetnje tokom prikupljanja podataka
    - Prilagođene boje cevi za brendiranje istraživačkih institucija i identifikaciju flote
content_segments:
  tagline: Profili istraživanja
  title: Marine Science Rešenja<br />Prema tipu aplikacije
  subtitle: Različite istraživačke aplikacije imaju jedinstvene zahteve za plovila - od univerzitetskih nastavnih platformi do plovila za istraživanje životne sredine do praćenja kvaliteta vodeRIBs.
  items:
    - title: Univerzitetski programi nauke o moru
      subtitle: Nastavne platforme, studentske ekskurzije, primorska istraživanja
      description: Morski univerziteti i odeljenja za okeanografiju trebaju pouzdane, svestrane radne čamce za nastavu terenskih kurseva, studentskih istraživačkih projekata i priobalnih istraživanja fakulteta. Brod mora biti jednostavan za rukovanje za studente pod nadzorom, dovoljno stabilan za praktičnu implementaciju instrumenata i dovoljno izdržljiv za čestu upotrebu od strane više korisnika u akademskim terminima. Budžetska ograničenja u akademskim okruženjima čine isplativost i nisko održavanje važnim razmatranjima.
      features:
        - Stabilna platforma za praksu raspoređivanja i oporavka studentskih instrumenata
        - Jednostavno rukovanje — konfiguracija kormila ili jedne konzole za nadgledanu upotrebu učenika
        - Hypalon Izdržljive cevi za česta sletanja na plažu i rukovanje studentima
        - Oprema za montažu za nastavni razred sonar, secchi disk, i uzorkovanje opremu
        - PVC Isplativa opcija za budžetski ograničene akademske programe
    - title: Instituti za istraživanje mora
      subtitle: Istraživanje RIBs sa integracijom instrumenata, GPS-om, opremom za uzorkovanje
      description: Posvećene morske istraživačke organizacije koje sprovode obalne i offshore istraživanja trebaju profesionalno konfigurisano istraživanje RIBs sa integrisanim instrumentima. Ovi brodovi nose sonarne sisteme za batimetrijsko mapiranje, CTD profilere za analizu vodenog stuba, uzorke sedimenta i opremu za biološko prikupljanje. Brod mora da obezbedi stabilnu platformu pri malim brzinama istraživanja, ima dovoljno prostora na palubi za raspoređivanje opreme i nudi čistu KSNUMKSV / KSNUMKSV snagu za elektroniku.
      features:
        - Integrisana montaža sonarnog pretvarača — konfiguracija kroz trup ili krmeno zrcalo
        - Montaža GPS antene i integracija konzole za navigaciju u istraživanju
        - Područje za raspoređivanje CTD-a i uzorkivača vode sa sigurnim tačkama vezivanja
        - 12V / 24V pomoćna distribucija napajanja za instrumente i data loggers
        - Stabilan pri maloj brzini (3-6 čvorova) za tačnost anketne linije
        - Opcioni A-okvir ili davit za raspoređivanje teže opreme za uzorkovanje
    - title: Monitoring i očuvanje životne sredine
      subtitle: Ekološka istraživanja, posmatranje divljih životinja, procena staništa
      description: Nevladine organizacije za zaštitu životne sredine, vladine agencije i organizacije za očuvanje sprovode morska ekološka istraživanja, praćenje populacije divljih životinja i procjene staništa. Ove operacije zahtijevaju tihe plovila sa malim uticajem koja mogu pristupiti osjetljivim staništima bez uznemiravanja divljih životinja. Brodovi moraju nositi opremu za kamere, GPS za mapiranje transekta i opremu za uzorkovanje za prikupljanje vode i sedimenta. Niska buđenja i minimalna buka motora su kritični za studije posmatranja ponašanja.
      features:
        - Tihi 4-taktni vanbrodski motor — minimalno uznemiravanje morskih divljih životinja
        - Stabilna platforma za posmatranje za fotografiju i video dokumentaciju
        - Montiranje opreme za kamere, GPS sledilice i terenske računare
        - Plitak gaz za pristupanje priobalnim močvarama, mangrovima i ušćima
        - Površine palube i cevi koje se lako čiste za dekontaminaciju između lokacija
    - title: Praćenje i testiranje kvaliteta vode
      subtitle: Redovne uzorke, praćenje zagađenja, praćenje usklađenosti
      description: Organizacije za praćenje kvaliteta vode obavljaju redovne uzorke širom priobalnih zona, luka i unutrašnjih vodotokova kako bi pratili nivo zagađenja, cvetanje algi i usklađenost sa ekološkim propisima. Ove operacije zahtevaju efikasne, pouzdane čamce za ponovljene posete fiksnim stanicama za uzorkovanje. Plovilo mora da nosi opremu za uzorkovanje, hladnjake za očuvanje uzoraka i terensku laboratorijsku opremu — sa lako opranim palubama između lokacija kako bi se sprečila unakrsna kontaminacija.
      features:
        - Posvećena oblast stanice za uzorkovanje sa prostorom za skladištenje hladnjaka i opreme
        - Paluba i cevi koje se lako čiste između lokacija za dekontaminaciju
        - GPS integracija za precizan povratak na fiksne koordinate za uzorkovanje
        - Kompaktna veličina za pristup ograničenim vodotokovima i uskim kanalima
        - Ekonomičan vanbrodski motor za isplative redovne uzorke
