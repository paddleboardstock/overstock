testimonials:
  - category: clubs
    name: Rikardo Santos
    title: Vlasnik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Počeli smo sa Paketom za početnike za našu školu surfovanja. 20 dasaka, vesla, prsluci — sve je stiglo u roku od 3 nedelje. Nakon dve sezone, nadogradili smo na Pro paket. Prilagođeni izgled sa našim logom je bio prekretnica za naš profesionalni imidž.
    rating: 5
    product: Paket Club Starter
    source: solutions/clubs
  - category: clubs
    name: Vlasnik kluba
    title: Klub za vodene sportove
    location: Puket, Tajland
    content: Paket za početnike bio je savršen početak. Kako je naš posao rastao, Paddle Board Overstock je rastao s nama — ista kvalitet, ista cena, bez iznenađenja. Proširili smo broj dasaka sa 10 na 80 za 18 meseci.
    rating: 5
    product: Početni paket kluba + Premium paket
    source: success-stories
  - category: resorts
    name: Generalni menadžer odmarališta
    title: Odmaralište sa 5 zvezdica
    location: Grčka
    content: Paddle Board Overstock nije samo isporučio daske — pomogao nam je da izgradimo kompletno iskustvo za goste. Naš program vodenih sportova od nule postao je glavna atrakcija odmarališta u jednoj sezoni. 300+ nedeljnih rezervacija i 180.000$ godišnjih prihoda.
    rating: 5
    product: Paket Resort Premium
    source: success-stories
  - category: resorts
    name: Sofi Loran
    title: Direktor za iskustvo gostiju, Azure Bay Resorts
    location: Puket, Tajland
    content: Paddle Board Overstock je dizajnirao i opremio ceo naš program aktivnosti na plaži u tri resort objekta. 80 SUPs, 40 kajaka, bezbednosna infrastruktura i obuka osoblja — sve isporučeno u jednoj pošiljci. Učešće gostiju je poraslo za 60% u prvoj sezoni.
    rating: 5
    product: Paket Resort Premium
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Osnivač, Shoreline Paddle Co.
    location: Kalifornija, SAD
    content: Pokrenuo sam svoj SUP brend bez ikakvog iskustva u industriji. Tim Paddle Board Overstock me je vodio od odabira proizvoda do dizajna prilagođenog logotipa i pakovanja. Moj prvi kontejner je stigao za 11 nedelja, a rasprodao sam sve za 3 meseca na Amazonu.
    rating: 5
    product: Pokretanje Starter Brenda
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Osnivač
    title: Australijski SUP Brend
    location: Australija
    content: Imao sam ideju za brend, ali nula znanja o proizvodnji. Paddle Board Overstock me je doslovno vodio kroz ceo proces — od izbora pravog dizajna daske do otpakivanja prve pošiljke. 90 dana od sna do isporuke.
    rating: 5
    product: Paket za lansiranje brenda
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Vlasnik, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Iznajmljivao sam 5 dasaka iz lokalne prodavnice i gubio 60% prihoda. Paddle Board Overstock mi je pomogao da izgradim sopstvenu flotu od 15 SUPs. ROI kalkulator je pokazao povraćaj investicije za 4 meseca — ostvario se za 3. Sada proširujem na 30 dasaka.
    rating: 5
    product: Početni komplet za flotu
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktor operacija, Adriatic Adventure Tours
    location: Dubrovnik, Hrvatska
    content: Opremili smo celu našu flotu za iznajmljivanje sa Paddle Board Overstock RIBs — 12 brodova na tri lokacije. Dve sezone, nula kvarova. CE sertifikaciona dokumentacija je omogućila jednostavno odobrenje osiguranja. Njihov inženjerski tim je čak prilagodio boje tube.
    rating: 5
    product: Komplet za proširenje flote
    source: trust
  - category: rental
    name: Poručnik Andres Reyes
    title: Službenik za pomorsku nabavku, Filipinska Pomorska Pomoćna Garda
    location: Manila, Filipini
    content: Upravljamo sa 24 Paddle Board Overstock RIBs u celoj floti za obalnu patroli. Njihov QC proces je konzistentan u svakoj seriji — ista kvaliteta šava, isto postavljanje ventila, isti pritisak svaki put. Ta ponovljivost je bitna kada životi zavise od opreme.
    rating: 5
    product: RIB Patroli flota
    source: trust
  - category: consumers
    name: Sarah K.
    title: Vlasnica SUP po prvi put
    location: Jezero Tahoe, SAD
    content: Stabilan čak i za potpune početnike. Izveo sam ga na jezero prvog dana i nikada nisam pao. Kompletan paket sa pumpom i veslom značio je da sam bio na vodi 20 minuta nakon otvaranja kutije.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Vlasnik Explorer 11
    location: Vankuver, Kanada
    content: Kao prvi kupac, bio sam nervozan zbog kvaliteta naručivanja iz inostranstva. ISO dokumentacija i izveštaji o testiranju treće strane koje su podelili pre nego što sam ih i pitao dali su mi potpuno poverenje. Daska je stigla za 6 dana i premašila moja očekivanja.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Rekreativni kajakaš
    location: Florida, SAD
    content: Čvrsta konstrukcija. Rukuje obalnim talasima daleko bolje nego što sam očekivao od napuhive daske. Spakovao sam je u gepek automobila za vikend putovanje — napumpao na rampi za manje od 4 minuta.
    rating: 5
    product: Naduvavajući Kajak
