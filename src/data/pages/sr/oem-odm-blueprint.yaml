faq:
  title: OEM/ODM — Najčešće postavljana pitanja
  questions:
    - q: Koja je minimalna količina porudžbine (MOQ) za prilagođeni napuhavajući SUPs?
      a: Za standardne modele sa postojećim kalupima, MOQ počinje od 5-10 jedinica po dizajnu. Za potpuno prilagođene kalupe i alate, MOQ obično je 200+ jedinica. Radimo sa startupima i novim brendovima kako bismo pronašli izvodljive ulazne tačke.
    - q: Koliko dugo OEM traje proces uzorka?
      a: Standardni uzorci prototipa su završeni u roku od 7-14 radnih dana nakon odobrenja dizajna. Rush nalozi mogu biti prioritet na 5-7 dana uz dodatnu naknadu.
    - q: Koja je razlika između PVC i Hypalon za čamce na naduvavanje?
      a: PVC je lakši, pristupačniji i nudi odličnu fleksibilnost u hladnom vremenu.Hypalon (CSM) pruža UV superiornu i otpornost na ozon sa dužim životnim vekom (10–15 godina naspram 5–8 godina). Preporučujemo PVC za većinu rekreativnih aplikacija i Hypalon za komercijalnu / profesionalnu upotrebu.
    - q: Možete li prilagoditi oblik i dizajn na naduvavanje?
      a: Da. Naš tim za istraživanje i razvoj može razviti prilagođene kalupe za bilo koji oblik trupa, obris ploče ili konfiguraciju cevi. Koristimo CNCaluminijumske kalupe za preciznost i konzistentnost.
    - q: Da li pružate usluge revizije fabrike?
      a: Pozdravljamo na licu mesta i treće strane fabričke revizije u našem 12.000 m² Kingdao objektu. Mi održavamo ISO 9001 i BSCI sertifikate i možemo da delimo izveštaje o reviziji naNDA.
    - q: Koje uslove isporuke nudite?
      a: Nudimo FOB Kingdao (standard), CIFi DDP uslove isporuke. Kontejner utovar i kompletna izvozna dokumentacija su uključeni u OEM svim nalozima.
content_profiles:
  tagline: Profili brendova
  title: / OEM Privatna robna marka Proizvodnja<br />Po tipu kupca
  subtitle: Različiti profili brendova dolaze sa različitim zahtevima - prilagođavamo OEMODM naše / usluge tako da odgovaraju vašem poslovnom modelu, obimu i strategiji izlaska na tržište.
  items:
    - title: Startup Vatercraft Brendovi
      subtitle: NiskaMOQ, brza rampa
      description: Preduzetnici i osnivači koji lansiraju svoju prvu liniju SUPs, kajaka ili naduvavajućih čamaca. Potreban vam je proizvodni partner koji tretira vaš brend kao svoj — sa niskim pragovima ulaska, fleksibilnim veličinama serija i praktičnim savetima za dizajn u svakom koraku.
      features:
        - MOQ već od 50–100 jedinica po SKU, ne hiljade
        - Već postojeća biblioteka kalupa za preskakanje troškova alata
        - 'Kompletan brending paket: logo, tube grafika, pakovanje, visi oznake'
        - Uzorak prvi tok posla — odobri pre proizvodnje
    - title: Osnovani morski brendovi
      subtitle: OEM skala sa CE/ISO usklađenost
      description: Postojeći brendovi brodova, PVC-a ili morskih dodataka dodaju plovila na naduvavanje u svoj portfelj. Potreban vam je dosledan kvalitet u proizvodnim serijama, usklađenost sa propisima za globalna tržišta i mogućnost zajedničkog inženjeringa prilagođenih trupova ili oblika cevi.
      features:
        - Custom 3D kalup inženjering za vlasničke dizajna
        - CE 2013/53/EU, UKCA, USCG usklađenost dokumentacija
        - BSCI Izveštaji o socijalnoj reviziji za usklađenost trgovaca
        - Posvećeno upravljanje računom + prioritetne proizvodne linije
    - title: DTC i E-komerc brendovi
      subtitle: Pakovanje spremno za maloprodaju u velikim količinama
      description: Brendovi koji su online-prvi, prodaju putem Amazon-a, Shopify-a ili svojih web prodavnica. Pakovanje, iskustvo otvaranja kutije i dosledan kvalitet jedinica su ključni. Potreban vam je pogon koji razume dinamiku brzine i stope povrata u e-trgovini.
      features:
        - Dizajn kutije spremne za maloprodaju + štampa umetnutih kartica
        - Vakumsko pakovanje / paletizacija za isplativu dostavu
        - EAN / UPC barkod i dokumentacija spremna za carinu
        - Konsolidacija mešanih kontejnera za optimizaciju konačne cene
    - title: Lifestyle i brendovi za aktivnosti na otvorenom
      subtitle: White-label dizajn + proširenje kategorije
      description: Brendovi odeće, opreme za aktivnosti na otvorenom ili putovanja koji ulaze u kategoriju vodnih sportova pod sopstvenom etiketom. Možda nemate stručnost u brodogradnji u kući — zato vam je potreban partner koji vas može voditi od koncepta do kontejnera uz minimalne prepreke.
      features:
        - Istraživanje trendova i konceptualne mood table
        - Limitirana izdanja i sezonske boje u saradnji
        - Ciklus od dizajna do uzorka za 10–14 radnih dana
        - 'Logistika od početka do kraja: fabrika → skladište → potrošač'
