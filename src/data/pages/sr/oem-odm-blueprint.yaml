process_steps:
  title: 6-stepeni OEM/ODM proces
  subtitle: Od dizajnerskog brifa do FOB Qingdaoa — pojednostavljen radni tok
  steps:
    - number: '01'
      title: Dizajnerski brief i 3D CAD modeliranje
      description: Podelite svoje ciljane specifikacije, referentni proizvod ili koncept. Naš inženjerski tim razvija detaljne CAD crteže i 3D prikaze za vaše odobrenje.
      timeline: 3–5 dana
    - number: '02'
      title: Izbor materijala i testiranje tkanina
      description: Izaberite između materijala vojnog kvaliteta PVC (0,9–1,2 mm), Hypalon CSM ili drop-stitch osnovnih tkanina. Sprovodimo testove zatezne čvrstoće, adhezije premaza i stabilnosti UV.
      timeline: 2–3 dana
    - number: '03'
      title: Brzo prototipiranje i proizvodnja uzoraka
      description: Mi CNC-mašinom izrađujemo specijalne kalupe i proizvodimo uzorke pre proizvodnje sa vašim brend bojama, logotipom i specificiranim materijalima. Uzorci se šalju na vaše odobrenje.
      timeline: 7–14 dana
    - number: '04'
      title: Test zadržavanja visokog pritiska 24–48 sati
      description: Svaki prototip prolazi rigorozno testiranje zadržavanja pritiska na 1,25x nazivne vrednosti. Sprovode se testovi ljuštenja šava i verifikacija dimenzija.
      timeline: 1–2 dana
    - number: '05'
      title: CE/ISO Inspekcija kvaliteta i pakovanje
      description: Kontrolna lista kvaliteta od 100 tačaka. Svaka jedinica je proverena pre pakovanja spremnog za maloprodaju. CE izjava o usklađenosti i BSCI izveštaj o usklađenosti su uključeni.
      timeline: 2–3 dana
    - number: '06'
      title: FOB Špedicija i logistika Qindao
      description: Gotovi proizvodi na paletama, umotani u foliju i utovareni u kontejnere u luci Qindao. Potpuna izvozna dokumentacija, carinsko odobrenje i praćenje u realnom vremenu.
      timeline: 7–14 dana
