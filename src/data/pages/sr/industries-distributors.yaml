content_segments:
  tagline: Profili partnera
  title: Modeli distributerskog partnerstva<br />Po tipu partnera
  subtitle: Različiti distributeri donose različite prednosti za izlazak na tržište — regionalna infrastruktura, domet e-trgovine, specijalizovana maloprodaja ili portfoliji više brendova. Strukturiramo uslove partnerstva, cenovne nivoe i nivoe podrške da odgovaraju svakom profilu partnera.
  items:
    - title: Regionalni distributeri za nautičku opremu
      subtitle: Distribucija ekskluzivna za teritoriju B2B
      description: Uspostavljeni distributeri sa skladišnom infrastrukturom, mrežama dilera i logističkim kapacitetima koji opslužuju marine, prodavce opreme za vodene sportove i operatore za iznajmljivanje unutar definisane geografske teritorije. Potreban vam je kompletan asortiman proizvoda, zaštićene cene i mogućnost servisiranja diler računa sa lokalnim zalihama i podrškom.
      features:
        - Ekskluzivna zaštita teritorije sa minimalnim obavezama
        - Veleprodajne cene iz celokupnog kataloga sa kvartalnim rabatima po obimu
        - Program lokalne konsignacije zaliha za brzo prodavane SKU-ove
        - Obuka distributerske mreže i programski marketing sa zajedničkim brendom
    - title: E-trgovina i online prodavci
      subtitle: Distribucioni kanali fokusirani na digitalno
      description: Online prodavci koji prodaju opremu za vodene sportove preko Amazona, eBaya ili sopstvenih e-trgovinskih platformi. Brzina plasiranja na tržište, konkurentne cene i logistika direktno ka potrošaču su ključni. Potreban vam je partner koji može da isporuči pojedinačne narudžbine pod vašim brendom sa brzim izvršenjem i bez rizika od zaliha.
      features:
        - 'Program drop-ship-a: direktna isporuka iz fabrike sa vašim brendom'
        - API feed zaliha u realnom vremenu za vašu e-trgovinsku platformu
        - Integracija sa Amazon Seller Central sa podrškom EAN/UPC
        - Uključena logistika povraćaja i obrada reklamacija
    - title: Specijalizovani prodavci opreme za vodene sportove
      subtitle: Partneri sa fizičkim salonima
      description: Fizički maloprodajni objekti specijalizovani za opremu za vodene sportove — služe lokalnim veslačima, ribarima i vlasnicima čamaca kroz prodaju uživo, demonstracije i postprodajnu uslugu. Potrebna vam je ambalaža optimizovana za maloprodaju, program demonstracionih jedinica i prodajni materijali koji pretvaraju posetioce u kupce.
      features:
        - 'Program demonstracionih jedinica: popust na izložbene panele u salonu'
        - Pakovanje spremno za maloprodaju sa dizajnom kutije optimizovanim za police
        - Displeji na prodajnom mestu, uporedne tabele i vodiči za kupce
        - Program obuke i sertifikacije osoblja u prodavnici
    - title: Distributeri multi-brendova i robnih kuća
      subtitle: Distribucija širokog asortimana sportske opreme
      description: Veliki distributeri koji snabdevaju robne kuće, velike maloprodajne lance i lanace sportske opreme sa katalogom više brendova. Konzistentnost, dokumentacija usklađenosti i poštovanje zahteva dobavljača su ključni — svaki SKU mora da zadovolji standarde pakovanja, etiketiranja i kvaliteta specifične za maloprodavca.
      features:
        - 'Dokumentacija o usklađenosti sa maloprodajom: specifikacija pakovanja, barkod, etiketiranje'
        - EDI/ASN integracija za sisteme naručivanja glavnih maloprodavaca
        - Programi upravljanja zalihama od strane dobavljača i automatskog dopunjavanja
        - Posvećen menadžment naloga sa SLA odgovorom od 24 sata
