content_benefits:
  tagline: Prednosti partnerstva
  title: Zašto distributeri<br />Izaberi Paddle Board Overstock
  subtitle: Partnerstvo dizajnirano za morske distributere kojima je potreban pouzdan snabdevanje, konkurentna marža i profesionalna podrška.
  items:
    - title: Zaštita teritorije
      description: Ekskluzivna ili poluekskluzivna prava teritorije za kvalifikovane distributere. Mapiranje tržišta i upravljanje kanalima sukoba kako bi se zaštitovala vaša investicija u izgradnju Paddle Board Overstock brenda u vašem regionu.
      icon: tabler:map-pin
    - title: Konkurentne veleprodajne cene
      description: Nivoizirane cene zasnovane na godišnjim obavezama po količini. Struktura cena koja štiti maržu sa unapred garantovanim cenama i transparentnim razlaganjem troškova (FOB Qingdao baza).
      icon: tabler:currency-dollar
    - title: Marketinški paket podrške
      description: Profesionalne fotografije proizvoda, tehnički listovi, šabloni za dokumentaciju o usklađenosti, sadržaji za društvene mreže i marketinški materijali sa zajedničkim brendom. Ažurira se svake godine sa novim lansiranjima proizvoda.
      icon: tabler:photo
    - title: Tehnička obuka
      description: Obuka za proizvode za vaš prodajni tim (virtuelno ili na licu mesta), obuka za održavanje i popravku za vaše servisne tehničare, i vodiči sa često postavljanim pitanjima i rešavanjem problema za krajnje korisnike.
      icon: tabler:school
    - title: Rezervni delovi i postprodaja
      description: Posvećena isporuka rezervnih delova sa prioritetnom dostavom. Dostupne zamenske sekcije cevi, ventili, peraja i kompleti za popravku za brzu realizaciju porudžbina. Podrška u obradi reklamacija u garantnom roku.
      icon: tabler:tool
    - title: Dokumentacija o usklađenosti
      description: 'Kompletna dokumentacija o usklađenosti za vaše tržište: CE DoC, podaci sa pločice proizvođača, uputstva za vlasnike i podrška za regulatornu registraciju. Uklanja vaš teret usklađenosti.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Šta Tražimo
  title: Distributer<br />Zahtevi
  subtitle: Tražimo partnere koji mogu profesionalno da predstavljaju i podržavaju Paddle Board Overstock proizvode u svojoj teritoriji.
  items:
    - title: Teritorija i Poznavanje Tržišta
      description: Uspostavljeno prisustvo na tržištu marine, sportova na vodi ili aktivnosti na otvorenom. Razumevanje lokalnih propisa, preferencija potrošača i distributivnih kanala za proizvode za plovila.
      icon: tabler:target
    - title: Iskustvo u Industriji
      description: Minimalno 2 godine iskustva u distribuciji opreme za more, aktivnosti na otvorenom ili sportsku opremu. Dokazano iskustvo sa međunarodnim brendovima i B2B veleprodajnim operacijama.
      icon: tabler:briefcase
    - title: Salon ili Magacin
      description: Fizički objekat za izlaganje proizvoda, skladištenje inventara i korisničku podršku. Sposobnost održavanja demo jedinica i zaliha rezervnih delova za vašu teritoriju.
      icon: tabler:building-store
    - title: Posvećenost Standardima Brenda
      description: Spremnost da se održavaju standardi prezentacije Paddle Board Overstock brenda, da se pruža korisnička podrška prema našim servisnim protokolima i da se učestvuje u godišnjim obukama za proizvode.
      icon: tabler:star
content_process:
  tagline: Proces Prijave
  title: 4-Koraka za Distributere<br />Proces Prijave
  subtitle: Od inicijalnog upita do prve isporuke — jednostavan proces onboarding-a.
  steps:
    - number: '01'
      title: Inicijalni Upit i Kvalifikacija
      description: Podnesite vašu distributersku prijavu sa informacijama o kompaniji, teritoriji od interesa, trenutnim proizvodnim linijama i proceni godišnjeg volumena. Pregled vršimo u roku od 5 radnih dana.
      timeline: 5 dana
    - number: '02'
      title: Poslovni Pregled i Uslovi
      description: Virtuelni sastanak za diskusiju o strategiji teritorije, nivoima cena i uslovima partnerstva. Pregled zahteva za dokumentaciju o usklađenosti za vaše tržište. NDA potpisivanje ako je potrebno.
      timeline: 1-2 nedelje
    - number: '03'
      title: Naručivanje Uzoraka i Evaluacija
      description: Postavite inicijalnu narudžbinu uzoraka (2-5 jedinica) po distributerskim cenama za evaluaciju tržišta i obuku tima. Uključena je kompletna dokumentacija o usklađenosti i priprema demo jedinica.
      timeline: 30-45 dana
    - number: '04'
      title: Pokretanje Partnerstva i Podrška
      description: Prva narudžbina iz kontejnera sa aktiviranom zaštitom teritorije. Dostavljena marketinška oprema, obučeni prodajni tim i dodeljen posvećeni menadžer naloga. Kontinualni kvartalni poslovni pregledi.
      timeline: Tokom trajanja
content_application_docs:
  tagline: Dokumenti za Prijavu
  title: Potrebni Dokumenti<br />za Prijavu Distributera
  subtitle: Da biste se prijavili za Paddle Board Overstock distributersku saradnju, molimo pripremite sledeće dokumente i informacije za naš tim za pregled.
  items:
    - title: Potvrda o registraciji preduzeća
      description: Važeći dokument o registraciji kompanije koji pokazuje ime pravnog lica, registrovanu adresu i obim poslovanja koji pokriva pomorsku, sportsku ili otvorenu distribuciju opreme.
      icon: tabler:file-text
    - title: Plan pokrivanja teritorije
      description: Geografska teritorija interesa, postojeća maloprodajna ili distributivna mreža, ciljni segmenti kupaca i predloženi godišnji obim po kategoriji proizvoda (RIB, SUP, kajak).
      icon: tabler:map
    - title: Izložbeni salon ili skladište Sposobnost
      description: Fizički objekat za prikaz proizvoda, skladištenje zaliha i korisnički servis. Fotografije ili tlocrti koji prikazuju demo prostor i kapacitet za skladištenje rezervnih delova.
      icon: tabler:building
    - title: Izjava o finansijskoj sposobnosti
      description: 'Banka referenca ili finansijski izveštaj potvrđuje sposobnost da postavi početni kontejner nalog i održava inventar. Minimalna početna porudžbina: jedan 20ft kontejner (10-20 jedinica mešovitih modela).'
      icon: tabler:coin
    - title: Nakon prodaje Podrška Kapacitet
      description: Serviseri obučeni ili obučeni za održavanje i popravku čamca na naduvavanje. Mogućnost obrade garancijskih potraživanja i posvećenost zaliha rezervnih delova.
      icon: tabler:tool
    - title: Prethodni brend Reference
      description: Lista trenutnih ili prethodnih brendova pomorske / sportske opreme distribuiranih. Kontakt reference dostupne po međusobnom dogovoru. Startupi bez prethodnog iskustva u distribuciji mogu se kvalifikovati sa jačom finansijskom obavezom.
      icon: tabler:users
faq:
  title: Zastupnički program — Često postavljana pitanja
  questions:
    - q: Koja je minimalna količina porudžbine za distributere?
      a: Distributer MOQ počinje od 10-20 jedinica po porudžbini, sa fleksibilnošću za mešovite modele (RIB, naduvavanje, SUP). Početni uzorak naloga 2-5 jedinica su dostupni po cenama distributera za procenu tržišta.
    - q: Da li nudite ekskluzivna teritorijalna prava?
      a: Ekskluzivna teritorijalna prava dostupna su kvalifikovanim distributerima koji ispunjavaju godišnje obaveze obima i održavaju standarde brenda. Poluekskluzivni i neekskluzivni aranžmani su takođe dostupni za tržišta u razvoju.
    - q: Kakvu marketinšku podršku pružate?
      a: Pružamo sveobuhvatan marketinški komplet koji uključuje profesionalnu fotografiju proizvoda, specifikacijske listove, šablone dokumentacije o usklađenosti, biblioteku sadržaja društvenih medija i ko-brendirane materijale. Ažurira se svake godine sa lansiranjem novih proizvoda.
    - q: Kako se postupa sa garancijskim zahtevima?
      a: 'Distributeri služe kao prva tačka kontakta za garancijske zahteve. Pružamo jasne kriterijume garancije, protokole foto dokumentacije i brzu zamenu ili obradu kredita. Uslovi garancije: 5 godina ograničeno na tkaninu / šavove / trup brodskih cevi; 2 godine SUP i pribor.'
    - q: Mogu li proizvode privatne robne marke Paddle Board Overstock pod sopstvenim brendom?
      a: Da, kroz OEMODM naš / program. Opcije privatne robne marke uključuju prilagođenu grafiku cevi, brendiranje konzole, maloprodajno pakovanje i dokumentaciju o usklađenosti pod vašim brendom. OEMODM Za detalje pogledajte našu / stranicu usluga.
    - q: Koja dokumentacija o usklađenosti je uključena za distributere?
      a: Svaka pošiljka uključuje DoC specifične za model CE , podatke o graditeljskim pločama, priručnike za vlasnike i dokumentaciju za isporuku. Takođe pružamo regulatornu podršku za registraciju za vašu teritoriju i pomažemo u svim lokalnim zahtevima usklađenosti.
