hero:
  tagline: Globalna prisutnost
  title: Opsluživanje 50+ zemalja<br />Na svim kontinentima
  subtitle: Od evropskih operatera priobalne patrole do australijskih distributera opreme za vodene sportove i timova za spasavanje na Bliskom istoku — Paddle Board Overstock čamci su prisutni na vodi širom sveta.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock globalna proizvodnja i distribucija nautičke opreme
stats:
  title: Globalni domet
  stats:
    - title: Zemlje
      amount: 50+
    - title: Izvozni tržišta
      amount: Evropa, Amerika, Azija, Bliski istok, Okeanija
    - title: Proizvodnja
      amount: Qingdao, Kina
    - title: Skladište u SAD
      amount: Montclair, CA
features3_markets:
  tagline: Ključna tržišta
  title: Regionalno iskustvo<br />za lokalne zahteve
  subtitle: Razumemo da različita tržišta imaju različite regulatorne zahteve, preferencije i upotrebu.
  isBeforeContent: false
  columns: 4
  items:
    - title: Evropa i UK
      description: CE-sertifikovani proizvodi koji ispunjavaju EN ISO 6185 standarde. Velika potražnja za RIBs, naduvavajuće čamce i SUP daske na tržištima EU. Distribuiteri u UK cene naš brzi rok isporuke.
      icon: tabler:map-pin
    - title: Severna Amerika
      description: Proizvodnja odobrena od strane Obalske straže SAD. Skladište u Montclairu, CA za brzu isporuku na Zapadnu obalu. Rastuća potražnja za ribolovačkim čamcima, spasilačkim plovilima i rekreativnim SUPs.
      icon: tabler:map-pin
    - title: Australija i Okeanija
      description: Jako tržište za RIB čamce i naduvavajuće tende. Australijski distributeri cene naše Hypalon čamce zbog otpornosti na UV u uslovima jakog sunca. Brza isporuka iz naše azijske fabrike.
      icon: tabler:map-pin
    - title: Bliski istok
      description: Rastuća potražnja za patrolnim i spasilačkim čamcima. Naši čamci sa aluminijumskim trupom RIBs su popularni kod Obalske straže i sigurnosnih operatera. Prilagođene konfiguracije za specijalne uslove visoke temperature.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribuciona mreža
  title: Partnerstvo sa distributerima<br />Širom sveta
  subtitle: Saradjujemo sa etabliranim distributerima nautičke opreme, OEM brendovima i vladinim agencijama za nabavku.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerstva
      description: Proizvodnja pod privatnim brendom za globalne brendove vodnih sportova. Mi brinemo o svemu, od dizajna do proizvodnje i direktne dostave.
      icon: tabler:building
    - title: Mreža distributera
      description: Ovlašćeni distributeri u 20+ zemalja drže zalihe i pružaju lokalnu podršku. Upiti novih distributera su dobrodošli.
      icon: tabler:users
    - title: Vlada i institucije
      description: Direktna isporuka obalskim stražama, organizacijama za pretragu i spašavanje, i vojnim programima nabavke. Usklađenost sa zahtevima institucionalne nabavke.
      icon: tabler:building-community
steps2_logistics:
  title: Globalna logistika i podrška
  subtitle: Od fabrike do odredišta — mi upravljamo celokupnim lancem snabdevanja.
  items:
    - title: Opcije dostave
      description: Morski transport (FOB Qingdao), avionski transport za hitne narudžbine i ekspres kurir za uzorke i rezervne delove.
      icon: tabler:truck-delivery
    - title: Skladište u SAD
      description: 'Zaliha se nalazi u Montclairu, Kalifornija za brzu isporuku širom Severne Amerike. Zapadna obala: 2-3 dana, Centralna: 3-4 dana, Istočna obala: 4-5 dana.'
      icon: tabler:building-warehouse
    - title: Rezervni delovi
      description: Originalni Paddle Board Overstock rezervni delovi i potrošni materijal skladište se tokom cele godine. Uobičajeni delovi se šalju u roku od 24 sata.
      icon: tabler:package
    - title: Tehnička podrška
      description: Direktna linija do našeg inženjerskog tima za tehnička pitanja, savete za popravku i podršku pri adaptaciji. Podržavamo brodove koje smo izgradili pre 20 godina.
      icon: tabler:headset
cta:
  title: Želite da postanete distributer?
  subtitle: Aktivno širimo našu distribucionu mrežu. Kontaktirajte naš tim za izvoz da biste razgovarali o mogućnostima partnerstva.
  actions:
    - variant: primary
      text: Upit za partnerstvo
      href: /contact
    - text: Pogledajte naš asortiman proizvoda
      href: /products
