how_to_choose:
  title: Kako izabrati pravu veličinu
  cards:
    - title: SUP Daske
      description: Izaberite dužinu prema svojoj težini i nameravanoj upotrebi. Šire daske (32"+) nude više stabilnosti. Duže daske (11-12 ft) bolje prate pravac za ture. Teži veslači treba da koriste daske većeg zapremine.
    - title: Kajaci
      description: Jednostruki kajaci (9 ft) su najbolji za solo putovanja i reke. Tandem kajaci (12 ft) mogu da prime dva veslača ili jednog odraslog sa opremom. Proverite nosivost za ukupno opterećenje uključujući opremu.
    - title: Čamci i RIBs
      description: Izaberite dužinu čamca prema broju putnika i nameravanoj upotrebi. Veći RIBs (4,5 m+) su pogodni za offshore i spašavanje. Manji čamci (2,7 m) služe kao tenderi i platforme za pecanje.
