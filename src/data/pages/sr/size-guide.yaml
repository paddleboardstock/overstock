hero:
  title: Vodič za veličinu i specifikacije
  subtitle: Dimenzije, kapaciteti i preporučena upotreba za svaki Paddle Board Overstock proizvod.
categories:
  inflatable: Naduvavajući SUPs i kajaci dizajnirani za prenosivost bez kompromisa u performansama. Pronađite pravu veličinu prema svojoj težini i stilu veslanja.
  rib: Čvrsti čamci sa napuhavajućim trupom za obalnu navigaciju, patrolu i profesionalne pomorske operacije. Birajte prema dužini i snazi motora.
  accessory: Dodaci i sigurnosna oprema za dopunu vašeg plovila. Univerzalne veličine sa više opcija.
