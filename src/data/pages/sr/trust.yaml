features3_certifications:
  title: Sertifikati i usklađenost
  subtitle: Svaki proizvod je nezavisno testiran; 64 modela su CE sertifikovana prema međunarodnim standardima.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Sertifikacija
      description: 64 CE-sertifikovanih modela preko SUPs, kajaka, čamaca i RIBs ispunjavaju evropski CE bezbednosni standard za rekreativne plovne objekte. Svaki proizvod prolazi testiranje pritiska, plovnosti i opterećenja pre nego što napusti fabriku.
      icon: tabler:certificate
    - title: ''
      description: Naš objekat u Qingdau od 12.000 m² posluje pod ISO 9001 sistemom upravljanja kvalitetom. Svaka proizvodna serija je sledljiva, dokumentovana i pregledana.
      icon: tabler:clipboard-check
    - title: BSCI Socijalna usklađenost
      description: Mi smo BSCI-sertifikovani, što osigurava etičke radne prakse, sigurne radne uslove i odgovornost prema životnoj sredini u čitavom našem lancu snabdevanja.
      icon: tabler:users
    - title: REACH & RoHS
      description: Svi materijali — PVC, Hypalon, EVA pena, lepkovi — usklađeni su sa EU REACH i RoHS regulativama. Nema zabranjenih supstanci, nema kompromisa.
      icon: tabler:flask
    - title: Laboratorija za testiranje materijala
      description: Interna laboratorija za materijale testira vlačnu čvrstoću, otpornost na UV, integritet šava i otpornost na habanje za svaki uzorak tkanine pre proizvodnje.
      icon: tabler:microscope
    - title: 5-godišnja garancija za čamac
      description: Paddle Board Overstock čamci imaju ograničenu garanciju od 5 godina na tkaninu na tubama, šavove i trup. SUP daske i dodaci imaju garanciju od 2 godine. Mi stojimo iza onoga što pravimo.
      icon: tabler:shield-check
testimonials:
  tagline: Poverenje kupaca
  title: Šta naši kupci kažu
  subtitle: Od početnika u veslanju do profesionalnih operatera flote — pogledajte zašto veruju Paddle Board Overstock.
  items:
    - content: Opremljeni smo čitavim flotom za iznajmljivanje sa Paddle Board Overstock RIBs — 12 čamaca na tri lokacije. Nakon dve sezone, nula kvarova. Dokumentacija za CE sertifikaciju omogućila je neometano odobrenje osiguranja. Njihov tim inženjera čak je prilagodio boje cevovoda da odgovaraju našem brendu.
      name: Marco Valenti
      title: Direktor operacija, Adriatic Adventure Tours — Dubrovnik, Hrvatska
    - content: Kao prvi kupac, bio sam nervozan zbog kvaliteta naručivanja iz inostranstva. ISO dokumentacija i izveštaji o testiranju treće strane koje su podelili pre nego što sam ih i pitao dali su mi potpuno poverenje. Daska je stigla za 6 dana i premašila moja očekivanja.
      name: James Thornton
      title: SUP vlasnik Explorer 11 — Vancouver, Kanada
    - content: Upravljamo sa 24 Paddle Board Overstock RIBs u celoj floti za obalnu patroli. Njihov QC proces je konzistentan u svakoj seriji — ista kvaliteta šava, isto postavljanje ventila, isti pritisak svaki put. Ta ponovljivost je bitna kada životi zavise od opreme.
      name: Poručnik Andres Reyes
      title: Službenik za maritimnu nabavku, Filipino Coast Guard Auxiliary — Manila, Filipini
features3_lab:
  title: Interni laboratorij za testiranje i kvalitet
  subtitle: Svaka serija materijala i gotov proizvod prolazi kroz naš laboratorij za testiranje na licu mesta pre slanja.
  columns: 3
  isBeforeContent: true
  items:
    - title: Testiranje zatezne jačine
      description: 'Svaka rolna PVC tkanine testira se prema ASTM D751 standardima. Minimalni zahtev: 350 N/cm uzduž i poprečno. Odbijene serije vraćaju se dobavljaču — odbacujemo približno 3% dolaznih materijala.'
      icon: tabler:scale
    - title: UV Akselerirano starenje
      description: Uzorci tkanine prolaze kroz 1.000 sati QUV ubrzanog izlaganja vremenskim uslovima (ASTM G154). Zadržavanje zatezne jačine mora biti preko 80% nakon UV izlaganja. Proizvodi su ocenjeni za 3+ godine korišćenja na otvorenom.
      icon: tabler:sun
    - title: Čvrstoća spojeva
      description: RF zavareni šavovi testirani su na minimalnu čvrstoću od 5 N/mm (ASTM D751). Ručno lepljeni Hypalon šavovi testirani su na 3,5 N/mm. Svaka serija proizvodnje ima uzorke šavova koji se destruktivno testiraju i arhiviraju.
      icon: tabler:stack
    - title: Zadržavanje pritiska 24–48 sati
      description: 'Svaki naduvani proizvod naduva se do 1,25x naznačenog PSI i prati 24–48 sati. Maksimalni dozvoljeni pad pritiska: 5%. Proizvodi koji ne prođu ovaj test preradjuju se i ponovo testiraju pre slanja.'
      icon: tabler:wind
    - title: Testiranje ciklusa ventila
      description: Svaki dizajn ventila prolazi 10.000 ciklusa otvaranja i zatvaranja u našem laboratoriju. Ventili moraju održati vazdušno zaptivanje na 1,25x naznačenog pritiska nakon ciklusa. Svi Paddle Board Overstock ventili ocenjeni su za 5+ godina uobičajene upotrebe.
      icon: tabler:rotate
    - title: Otpornost na hladno pucanje
      description: Materijali se testiraju na -30°C tokom 4 sata po ISO 4646. Nema pucanja ili krutosti. Proizvodi su ocenjeni za zimsko skladištenje i korišćenje u hladnoj vodi do -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kako osiguravamo kvalitet
  subtitle: Od inspekcije sirovina do finalnog testiranja pritiska — svaki proizvod prolazi kroz rigorozan lanac kontrole kvaliteta.
  items:
    - title: Sirovina Inspekcija
      description: Svaka rolna PVC tkanine testira se na debljinu, zateznu čvrstoću i otpornost na UV pre ulaska u proizvodnju.
      icon: tabler:search
    - title: Kontrola kvaliteta u procesu
      description: Zavareni šavovi, instalacije ventila i spojevi komora se pregledaju na svakoj stanici tokom montaže.
      icon: tabler:eye
    - title: Testiranje pritiska
      description: Svaki proizvod na naduvavanje je naduvan na 1.25k ocijenjen PSI i održava se 24-48 sati kako bi se potvrdilo zadržavanje vazduha i integritet šava.
      icon: tabler:wind
    - title: Završna inspekcija
      description: Svaka jedinica se pregledava za završnu obradu, hardver i pakovanje pre nego što bude odobrena za isporuku. Uzorci serije idu u našu laboratoriju za destruktivno testiranje.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Brod Često postavljana pitanja
  subtitle: Uobičajena pitanja o našim čamcima na naduvavanje sa krutim trupom.
  columns: 2
  items:
    - title: Koje veličine RIB brodova Paddle Board Overstock nudi?
      description: Nudimo RIB 35 modela u rasponu od 2,5 m do 7,6 m, koji pokrivaju sve od kompaktnih tendera do teških komercijalnih i patrolnih plovila. Svaki model je dostupan sa više opcija konfiguracije.
    - title: Koja je razlika između RIB i tradicionalnog čamca na naduvavanje?
      description: A RIB (Rigid-Hull naduvavanje) kombinuje čvrstu fiberglasa ili aluminijuma duboko-V trup sa naduvavanjem Hypalon ili PVC cevi. To vam daje stabilnost i nosivost tvrdog broda sa apsorpcijom udara i plovnosti na naduvavanje.
    - title: Koji motori su kompatibilni sa Paddle Board Overstock RIBs?
      description: Naša RIBs podrška vanbrodskim motorima od 3 HP do 250 HP u zavisnosti od modela. Svaka stranica proizvoda navodi maksimalnu nominalnu snagu motora. Preporučujemo da se konsultujete sa svojim prodavcem za idealnu utakmicu.
    - title: Da li su Paddle Board Overstock RIBs CE sertifikovani?
      description: Da. Svi RIB rekreativni modeli su CE sertifikovani prema važećim evropskim standardima za rekreativna plovila. Komercijalni i patrolni modeli ispunjavaju dodatne zahteve za stabilnost i opterećenje.
    - title: Koja je garancija na RIB brodovima?
      description: Svi Paddle Board Overstock RIBs dolaze sa 5 godina ograničenom garancijom na cevi tkanine, šavovi, i trup; naduvavanje ventili pokriveni za 5 godina; fabrički instaliran pribor pokriven za 1 godine.
    - title: Koliko vazdušnih komora Paddle Board Overstock RIBs imaju?
      description: Naša RIBs karakteristika KSNUMKS do KSNUMKS nezavisnih vazdušnih komora u zavisnosti od dužine modela. Ovaj višekomorni dizajn osigurava da brod ostane na površini čak i ako je jedan odeljak ugrožen.
faqs_inflatable:
  title: Gumenjak Čamac FAK
  subtitle: Uobičajena pitanja o našim gumenjacima, kajacima i čamcima.
  columns: 2
  items:
    - title: Koji materijali se koriste u Paddle Board Overstock čamcima na naduvavanje?
      description: Koristimo vojni razred PVC (1100 denier) i premija Hypalon/CSM guma, u zavisnosti od modela. Oba materijala su UV-stabilizovana, otporna na habanje i u skladu sa EU REACH i RoHS propisima.
    - title: Koliko dugo traju čamci na naduvavanje?
      description: Uz pravilnu negu, PVC kvalitetan čamac na naduvavanje traje 7-10 godina, dok Hypalon modeli mogu trajati 15-20 godina. Redovno čišćenje UV , zaštita i pravilno skladištenje značajno produžavaju vijek trajanja.
    - title: Koje održavanje je potrebno za čamac na naduvavanje?
      description: Osnovno održavanje uključuje ispiranje svežom vodom nakon svake upotrebe (posebno u slanoj vodi), sušenje pre skladištenja, proveru zaptivki ventila godišnje i nanošenje UV zaštitnog sredstva na cevi. Izbegavajte dugotrajno izlaganje suncu kada se ne koristi.
    - title: Mogu li se čamci na naduvavanje koristiti u slanoj vodi?
      description: Da. Svi Paddle Board Overstock čamci na naduvavanje su dizajnirani za upotrebu slatke i slane vode. Preporučujemo ispiranje svežom vodom i temeljno sušenje nakon izlaganja slanoj vodi kako bi se sprečilo koroziju ugradnje i kristalizaciju soli tkanine.
    - title: Kako da skladištim čamac na naduvavanje?
      description: Ispuhati, očistiti, i osušiti brod potpuno pre skladištenja. Roll labavo (izbegavajte čvrste nabore), čuvati na hladnom i suvom mestu daleko od direktne sunčeve svetlosti, i držati dalje od betonskih podova kako bi se sprečilo vlage upijanje.
    - title: Kolika je kapacitet težine Paddle Board Overstock čamaca na naduvavanje?
      description: Kapaciteti težine variraju od 290 kg za naše najmanje modele do preko 2000 kg za veće komercijalne plovila. Svaka stranica proizvoda navodi maksimalnu nosivost za vaš specifični model.
faqs_sup:
  title: SUP Česta pitanja o odboru
  subtitle: Česta pitanja o našim stand-up paddle daskama.
  columns: 2
  items:
    - title: Koje su SUP veličine ploča dostupne?
      description: Nudimo SUP daske od 9 ft do 12 ft, uključujući sveobuhvatne, za turizam, jogu i specijalne dizajne. Naši najprodavaniji modeli uključuju Tropical Breeze (10 ft) i Ocean Voyager (11 ft).
    - title: Šta je drop-stitch konstrukcija?
      description: Drop-stitch konstrukcija koristi hiljade poliesterskih niti koje povezuju gornji i donji sloj daske, omogućavajući joj da izdrži visok pritisak vazduha (15–20 PSI) i postigne čvrstu, stabilnu platformu. Ovo je industrijski standard za premijum naduvavanje SUPs.
    - title: Koja je težinska granica za SUP table?
      description: Naše SUP daske podržavaju do 150 kg u zavisnosti od modela i zapremine. Leviathan Wake daska je naš model sa najvećim kapacitetom, dizajniran za veće vozače i korišćenje u jogi.
    - title: Da li nudite kompletne SUP pakete?
      description: Da. Svaka SUP daska dolazi sa kompletnim pakovanjem koje uključuje 3-delnu aluminijumsku veslo, ručnu pumpu visokog pritiska, rolni kaiš, putni ranac i komplet za popravku. Neki modeli takođe uključuju odstranjivi set peraja.
    - title: Koliko traje garancija na SUP ploče?
      description: Sve Paddle Board Overstock SUP daske imaju dvogodišnju garanciju protiv proizvodnih nedostataka, uključujući pucanje šava, greške na ventilima i delaminaciju materijala tokom normalne upotrebe.
    - title: Koliko vremena je potrebno da se naduva SUP daska?
      description: Koristeći priloženu ručnu pumpu, potpuno naduvavanje do 15 PSI traje približno 8–12 minuta. Za brže naduvavanje, preporučujemo našu Paddle Board Overstock 12V električnu pumpu, koja naduva dasku za manje od 4 minuta.
