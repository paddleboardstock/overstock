testimonial:
  quote: Ono što Paddle Board Overstock izdvaja je njihova nauka o materijalima. Oni ne samo da sklapanju komponente — oni inženjerski razvijaju PVC spojeve, parametre zavarivanja i strukturni raspored u kući. Ta vertikalna integracija se vidi u krajnjem proizvodu.
  author: David Park
  title: Menadžer za razvoj proizvoda
  company: Bluewater Sports Equipment
  location: Australija
sections:
  - title: Drop-Stitch Jezgro
    standard: 12-15 PSI radnog pritiska
    description: Hiljade unutrašnjih poliesterskih niti povezuje gornje i donje slojeve, stvarajući čvrstu strukturu na 12-15 PSI. Ovo je ista tehnologija koja se koristi u profesionalnim daskama za veslanje i naduvavajućim trkačkim čamcima. Naša drop-stitch gustina je optimizovana po modelu za idealnu ravnotežu čvrstoće i težine.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS dijagram jezgra
  - title: Morski kvalitet PVC
    standard: Fuziono zavareni | UV / testirano u slanoj vodi / otporno na habanje
    description: Višeslojna laminirana PVC tkanina ocenjena za morska okruženja. Svaki sloj je fuziono zavareni umesto lepljen, eliminišući rizik od delaminacije. Testirano na otpornost prema UV (ASTM G154, 1.000+ sati), koroziju u slanoj vodi (ISO 9227) i habanje (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC sloj
  - title: Hypalon cevi
    standard: CSM guma | UV / hemijska / otpornost na ekstremne temperature
    description: Koristi se na RIB modelima, Hypalon (CSM) guma pruža superiornu UV i hemijsku otpornost u poređenju sa standardnom PVC. Hypalon cevi održavaju fleksibilnost na ekstremnim temperaturama i odolevaju degradaciji izazvanoj izlaganjem gorivu i ulju. Svi šavovi su ručno postavljeni od strane sertifikovanih tehničara.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Podni sloj Air Deck
    standard: Inflatable pod visokim pritiskom | Zamenjuje šperploču/aluminijum
    description: Sistem poda na naduvavanje pod visokim pritiskom koji zamenjuje tradicionalne podove od šperploče ili aluminijumskih letvica. Smanjuje vreme postavljanja, ukupnu težinu i zapreminu skladištenja, uz obezbeđivanje dovoljne čvrstoće za stajanje, pecanje i hodanje. Testirano da podrži raspodeljeno opterećenje od 200 kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Vazdušna paluba
