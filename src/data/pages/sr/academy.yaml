hero:
  tagline: Paddle Board Overstock Akademija
  title: Centar za učenje
  subtitle: Vodiči i tutorijali za svaki nivo veštine — od SUP osnova do naprednih tehnika spasavanja
categories:
  - level: Početnik
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Osnove
        desc: Naučite osnove stand-up paddleboarding-a — stav, tehnika veslanja i ravnoteža.
        slug: beginner-sup-guide
      - title: Tehnike veslanja
        desc: Napredni udar, cirkularni udar, povlačenje i niska zaštita — savladajte osnovne pokrete veslom.
        slug: sup-paddle-guide
      - title: Bezbednost na prvom mestu
        desc: Osnovne bezbednosne prakse uključuju proveru vremena, PFD upotrebu, pravila vezivanja i samospasavanje.
        slug: sup-safety-guide
  - level: Srednji nivo
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Osnovne ture
        desc: Planiranje višesatnih vožnji — navigacija, hidratacija, tempo i čitanje vremenskih prognoza.
        slug: touring-sup-guide
      - title: Čitanje vremena
        desc: Interpretacija morskih prognoza, prepoznavanje oblaka i razumevanje uticaja vetra na vodu.
        slug: weather-planning-water-sports
      - title: Osnove navigacije
        desc: Čitanje karti, upotreba kompasa, GPS tačke i planiranje ruta za obalno veslanje.
        slug: sup-navigation-guide
      - title: Svest o plimi i oseci
        desc: Razumevanje ciklusa plime i oseke, struja i kako one utiču na vreme polaska i planiranje ruta.
        slug: understanding-tides
  - level: Napredni nivo
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planiranje višednevnih putovanja
        desc: Logistika ekspedicije — izbor opreme, planiranje hrane, bezbednosni protokoli i hitni kontakti.
        slug: sup-travel-guide
      - title: Tehnike spasavanja
        desc: Samospasavanje, T-rescue, eskimsko spasavanje za kajake i protokoli vuče na otvorenoj vodi.
        slug: sup-self-rescue
      - title: Noćno veslanje
        desc: Navigacija nakon mraka — zahtevi za osvetljenje, pamćenje rute, komunikacija u grupi i svest o opasnostima.
        slug: sup-navigation-guide
  - level: Održavanje
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Čišćenje i nega
        desc: Ispiranje slatkom vodom, UV zaštita, prevencija plesni i pravilna tehnika sušenja nakon svake sesije.
        slug: inflatable-sup-maintenance
      - title: Vodič za skladištenje
        desc: Najbolje prakse za skladištenje naduvanih dasaka i čamaca — ispumpavanje, savijanje, kontrola temperature i vek trajanja.
        slug: inflatable-sup-storage
      - title: Osnovi popravke
        desc: Popravite male probušene delove, curenja na šavovima i probleme sa ventilom pomoću PVC kompleta za popravku i metoda zakrpa.
        slug: inflatable-sup-repair
      - title: Održavanje ventila
        desc: Identifikujte tipove ventila (Halkey-Roberts, Boston, Leafield), očistite ostatke i zamenite neispravne nastavke.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centar znanja
knowledge_center_title: Vodiči za morsku opremu i industriju
knowledge_center_subtitle: Stručno znanje i vodiči za kupovinu za morske profesionalce, operatore flote i entuzijaste vodenih sportova.
knowledge_sections:
  - title: RIB Znanje o čamcima
    tagline: Vodiči za krute naduvane čamce
    desc: Sve o RIB čamcima — dizajn trupa, materijali, izbor motora, održavanje i saveti za kupovinu za komercijalnu i rekreativnu upotrebu.
    guides:
      - title: Kako odabrati pravi RIB čamac
        desc: Kompletan vodič za izbor RIB — veličina, snaga motora, materijal tube, tip trupa i predviđena upotreba.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs naduvani čamac
        desc: Kruti naduvani čamac naspram tradicionalnog naduvanog čamca — dizajn trupa, performanse, izdržljivost i poređenje kapaciteta.
        href: /compare/rib-vs-dinghy
      - title: Komercijalni RIB vs rekreativni RIB
        desc: Komercijalni vs rekreativni RIB čamci — standardi izgradnje, materijali, vek trajanja, cena i sertifikati.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminijumski vs stakloplastični trup
        desc: Poređenje aluminijumskih i stakloplastičnih trupa za RIB čamce po težini, ceni, izdržljivosti i otpornosti na koroziju.
        href: /compare/aluminum-vs-fiberglass
  - title: Vodič za naduvane čamce
    tagline: Znanje o naduvanoj plovnoj opremi
    desc: Sveobuhvatni vodiči o naduvanim čamcima — PVC vs Hypalon, metode izgradnje, standardi bezbednosti i najbolje prakse održavanja.
    guides:
      - title: PVC vs Hypalon Vodič za materijal
        desc: Definitivno poređenje između PVC i Hypalon CSM za izradu naduvanih čamaca.
        href: /compare/pvc-vs-hypalon
      - title: Kako se prave naduvani čamci
        desc: Proces proizvodnje — sečenje materijala, HF zavarivanje, konstrukcija šavova, testiranje pritiska i kontrola kvaliteta.
        href: /learn/inflatable-technology
      - title: Vodič za bezbednost naduvanih čamaca
        desc: Standardi bezbednosti, nosivost, pravilno naduvavanje, provere pre polaska i procedure u vanrednim situacijama.
        href: /learn/water-safety
      - title: Održavanje naduvanih čamaca
        desc: Čišćenje, skladištenje, zaštita UV, zimska priprema i popravka naduvanih čamaca i RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Znanje o čamcima
    tagline: Naduvavanje čamca & RIB Hub
    desc: Tehnički vodiči koji pokrivaju vrste napuhavajućih čamaca, materijale, metode izrade, održavanje i bezbednost — od čamaca do RIBs.
    guides:
      - title: Vrste napuhavajućih čamaca
        desc: Čamci, RIBs, kajaci i manji čamci — naučite razlike i izaberite pravi.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Tehnologija
        desc: Kako hiljade unutrašnjih niti stvaraju krute, visokopritisne naduvavajuće strukture.
        href: /learn/drop-stitch-core
      - title: Priručnik za materijale
        desc: PVC denier ocene, težina tkanine, UV otpornost i materijali morske klase objašnjeni.
        href: /learn/materials
      - title: RIB vs Čamac
        desc: Uporedite krute naduvavajuće čamce sa tradicionalnim naduvavajućim čamcima za različite namene.
        href: /compare/rib-vs-dinghy
  - title: SUP Znanje
    tagline: Vodiči za Stand-Up Paddleboard
    desc: Sve o SUP daskama — naduvavajuće vs krute, dimenzije dasaka, tehnologija materijala i stručni saveti za sve nivoe veština.
    guides:
      - title: Naduvavajuća vs Kruta SUP
        desc: Uporedite iSUP i krute epoksidne daske po prenosivosti, izdržljivosti, performansama i vrednosti.
        href: /learn/sup
      - title: SUP Vodič za dimenzije dasaka
        desc: Kako dužina, širina i debljina utiču na stabilnost, brzinu i upravljivost.
        href: /learn/sup
      - title: SUP Održavanje i nega
        desc: Čišćenje, skladištenje, UV zaštita i saveti za popravku naduvavajućih SUP dasaka.
        href: /v2/inflatable-sup-maintenance
      - title: Izbor vaše prve SUP
        desc: Vodič za početnike za odabir pravog stand-up paddleboarda prema vašoj težini, nivou veštine i nameni korišćenja.
        href: /learn/sup
  - title: Vodič za ronilačku opremu
    tagline: Znanje o komercijalnim ronilačkim čamcima
    desc: Specijalizovani vodiči o ronilačkim čamcima, ronilačkom RIBs i opremi za ronilačke centre, operatore i komercijalne ronilačke timove.
    guides:
      - title: Najbolji RIB čamac za ronilačke centre
        desc: Kako izabrati pravi ronilački RIB za vaš ronilački centar — kapacitet, konfiguracija i budžetska razmatranja.
        href: /solutions-diving-center-boats
      - title: Vodič za konfiguraciju ronilačkog RIB
        desc: Osnovne funkcije za ronilački RIBs — stalci za boce, sisteme stepenika, ronilačku platformu i skladištenje opreme.
        href: /solutions-diving-center-boats
  - title: Vodič za pomoćni čamac za jahte
    tagline: Rešenja za superjahte i marine tendere
    desc: Vodiči za odabir savršenog tendera za jahtu — naduvavajući tenderi, RIB tenderi, rešenja za skladištenje i dodaci za tendere.
    guides:
      - title: Kako odabrati tender za jahtu
        desc: Faktori koje treba razmotriti pri odabiru tendera za vašu jahtu — veličina, materijal, motor i skladištenje.
        href: /solutions-yacht-tender-solutions
      - title: Naduvavajući vs RIB tenderi
        desc: Uporedite naduvavajuće dingije sa čvrstim naduvavajućim čamcima po pitanju performansi, izdržljivosti i mogućnosti skladištenja.
        href: /compare/rib-vs-dinghy
  - title: Vodič za spasilačku opremu
    tagline: Znanje o spasilačkim plovilima
    desc: Profesionalni vodiči o spasilačkim čamcima, SAR plovilima i opremi za vanredne situacije za obalsku stražu, spasioca i timove za pomoć u katastrofama.
    guides:
      - title: Vodič za izbor SAR čamca
        desc: Kako odabrati pravi čamac za pretragu i spasavanje — brzina, kapacitet, izdržljivost i zahtevi za specijalizovanu opremu.
        href: /solutions-rescue-watercraft
      - title: Komercijalni RIB za spasilačke operacije
        desc: Zašto su komercijalni RIBs preferirani izbor za profesionalne timove za pretragu i spasavanje širom sveta.
        href: /use-cases/search-and-rescue
