testimonial:
  content: Počeli smo sa Club Starter paketom za našu školu surfovanja u Portugalu. 20 dasaka, vesla, prsluci — sve je stiglo za 3 nedelje. Posle dve sezone, nadogradili smo na Pro paket. Prilagođeni brending sa našim logom bio je presudan za naš profesionalni imidž.
  name: Rikardo Santos
  title: Vlasnik, Algarve Surf Akademija — Lagos, Portugal
content_segments:
  tagline: Profile klubova
  title: Rešenja za klubove vodenih sportova<br />Po tipu kluba
  subtitle: Od univerzitetskih klupova za veslanje do ekskluzivnih privatnih jahting klubova — svaki tip kluba ima jedinstvene potrebe za opremom, obrasce korišćenja i strukture budžeta. Prilagođavamo svaki paket da odgovara modelu kluba.
  items:
    - title: Univerzitetski i koledž klubovi veslanja
      subtitle: Flote studenata sa visokim korišćenjem
      description: Klubovi za veslanje i kajak koje vode studenti ili koje podržava institucija, a koji vode programe SUP i kajaka za univerzitetske odseke za rekreaciju. Oprema je izložena učestaloj i intenzivnoj upotrebi, sa velikim brojem korisnika različitih nivoa veština svake školske godine. Izdržljivost i laka popravka su ključni, pored pristupačnih cena za studentske organizacije.
      features:
        - Ekstra-izdržljiva PVC konstrukcija ocenjena za cikluse korišćenja od strane studenata
        - Tabela sa bojama po nivoima veština za lako upravljanje flotom
        - Komplet za popravku + uključena video podrška po pozivu uz svaku porudžbinu
        - Cene sa popustom za studentske organizacije i uslovi plaćanja po semestru
    - title: Zajednički veslački i društveni klubovi
      subtitle: Rekreativni klubovi zasnovani na članstvu
      description: Klubovi zasnovani na zajednici koji članovima nude iskustva veslanja na SUP, kajaku i socijalno veslanje. Oprema mora da uravnoteži performanse i udobnost za širok uzrast, sa brendingom koji jača identitet kluba i ponos članova. Efikasno skladištenje je ključno za klubove koji posluju sa ograničenim pristupom obali.
      features:
        - 'Mešana flota: univerzalni SUPs, turistički daske i rekreativni kajaci'
        - 'Puno brendiranje kluba: prilagođene boje, štampa logotipa, brendirani PFD-ovi'
        - Kompaktna rešenja za skladištenje naduvavajuće opreme
        - 'Početni paket za rast članstva: kartice za preporuke, brendirane fotografije'
    - title: Škole surfovanja i akademije za surf kajak
      subtitle: Kobalna izvedba i koučing
      description: Škole fokusirane na surfovanje koje podučavaju SUP surfovanju, surf kajakingu i veštinama jahanja talasa. Oprema mora da funkcioniše u uslovima surfovanja — upravljiva, responzivna i dovoljno izdržljiva da izdrži ponovljene padove, abraziju peskom i izloženost slanoj vodi bez brze degradacije.
      features:
        - Kraći, širi SUP oblici optimizovani za pokretljivost na talasu
        - Ojačana konstrukcija tračnica za otpornost na udar u talasima
        - 'Oprema za bezbednost specifična za surfovanje: uvijene uzice, opcije sa mekim perajama'
        - Program zamene voznog parka sa sezonskim popustima pri zameni
    - title: Korporativni i privatni jaht klubovi
      subtitle: Iskustva premium članova
      description: Ekskluzivni privatni klubovi koji nude vodene sportove kao vrhunsku pogodnost za članove. Standardi opreme su visoki — estetika, usklađenost sa brendom i pripremljenost za goste su podjednako važni kao i performanse. Očekivanja usluge uključuju isporuku poput bele rukavice, prilagođena rešenja za skladištenje i podršku na nivou konsijerža.
      features:
        - Ploče sa premium završnom obradom sa drvenim teksturama EVA i metalnim akcentima
        - Prilagođeno usklađivanje boja sa smernicama brenda kluba
        - 'Dostava konsijerža: prethodno napumpano, raspoređeno i označeno za svaku sezonu'
        - Posvećeno upravljanje nalogom sa prioritetnim SLA za odgovore
