material_traceability:
  tagline: Pratljivost
  title: Praćenje materijala i kontrola serije
  description: Svaka serija sirovina dobija jedinstveni broj partije u našem ERP sistemu. Od dolaska preko proizvodnje do gotovog proizvoda, sva dokumentacija o materijalima za svaki čamac povezana je sa originalnom serijom dobavljača. Ovo omogućava potpunu uzvodnu pratljivost za svaki upit u vezi kvaliteta ili usklađenosti.
  system: Custom ERP (interni sistem) + fizičke oznake serije na svakoj radnoj narudžbini
  coverage: 100% proizvodnih materijala — PVC, Hypalon, drop-stitch tkanina, lepila, ventili, hardver, pakovanje
  records_retained: 10 godina (po CE zahtevima 2013/53/EU)
  suppliers:
    - material: Marine-grade PVC
      source: Kineski i korejski dobavljači
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch tkanina
      source: Unutrašnje tkanje + spoljašnji partner
      certified: Interna kontrola kvaliteta + dobavljač ISO 9001
    - material: Ventili i hardver
      source: Chinese OEM suppliers
      certified: ISO 9001, sertifikati materijala po seriji
