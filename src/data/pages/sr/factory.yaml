qc_section:
  tagline: Kontrola kvaliteta
  title: Proces testiranja i osiguranja kvaliteta
  subtitle: Svaki brod prolazi obavezno testiranje pre otpreme. Naša laboratorija za kvalitet radi nezavisno od proizvodnje i izveštava direktno menadžmentu.
  steps:
    - step: '1'
      title: Sirovina Inspekcija
      desc: PVC, Hypalon, i drop-stitch tkanine prolaze kroz zatezno ispitivanje (ASTM D751), suza širenje, i UV verifikacija otpora pre nego što bilo koja serija ulazi u proizvodnju.
    - step: '2'
      title: 48-časovni test zadržavanja vazduha
      desc: Svaka komora cevi je naduvana na 125% nominalnog pritiska i održava se 48 sati. Pad pritiska koji prelazi 5% pokreće automatsko odbacivanje i ponovnu inspekciju šava.
    - step: '3'
      title: Testiranje opterećenja i ravnoteže
      desc: Završeni brodovi su napunjeni do maksimalnog nominalnog kapaciteta i testirani na stabilnost, nadvođe i rukovanje. Svaki brod je testiran na vodi pre konačne inspekcije.
oem_section:
  tagline: OEM Projekti
  title: OEM Studije slučaja brenda i partnerstva
  subtitle: Od koncepta do kontejnera - kako pomažemo globalnim brendovima da lansiraju i skaliraju svoje linije plovila na naduvavanje.
  cases:
    - challenge: Evropskom trgovcu na otvorenom bila je potrebna linija privatne robne SUP marke sa jedinstvenom grafikom palubePVC, ekološkom ambalažom i ambalažom spremnom za maloprodaju - sve isporučeno u roku od 60 dana.
      solution: Razvijene prilagođene datoteke za digitalnu štampu, izvorno REACHusaglašene PVCi komprimovano uzorkovanje od 3 runde do 1 zajedničkim lociranjem dizajnerskog tima u našoj fabrici Kingdao.
      result: 55 dana od potpisanog PO doFOB. 2,400 jedinica preko 4 SKU-a. Ponovite porudžbinu postavljenu pre nego što je stigao prvi kontejner.
    - challenge: Američkom startupu za vodene sportove potreban drop-stitch je kajak visokih performansi sa prilagođenim oblikom trupa, ko-brendiranom ambalažom i BSCI sertifikacijom za maloprodaju.
      solution: Prilagođen postojeći drop-stitch kajak kalup sa modifikovanim rocker profilom, razvio co-brendiran pakovanje umetničko delo, i obezbedio BSCI potpunu reviziju dokumentacije.
      result: Uspešno naveden u 3 glavna američka lanca na otvorenom. 5,000+ jedinica u prvoj godini sa 98% stopom prodaje.
    - challenge: Australijski distributer je zahtevao CERIB sertifikovani asortiman sa prilagođenim bojama cevi Hypalon , opcijom nadogradnje i usklađenošću sa australijskim standardom AS 1799.
      solution: Proizvedeni predprodukcijski uzorci sa 4 varijante boja cevi, poreklom CSM Hypalon od japanskog dobavljača, i koordinira treće strane AS 1799 testiranje usaglašenosti.
      result: RIB 3-model asortiman lansiran na AU / NZ tržištu. Sledi pobeda vlade tendera za 12 patroleRIBs.
faq_section:
  tagline: Fejsbuk
  title: B2B & OEM Često postavljana pitanja
  questions:
    - q: Koja je minimalna količina porudžbine (MOQ) za OEM SUP naduvavanje?
      a: MOQ počinje na 5–10 jedinica za OEM standardne modele. Prilagođeni kalupi i projekti privatne robne marke zahtevaju najmanje 200 jedinica u zavisnosti od složenosti. Probne narudžbe i uzorci su dostupni za lansiranje novih brendova.
    - q: Paddle Board Overstock Da li drži BSCI sertifikat?
      a: 'Da. Naša fabrika održava BSCI važeću sertifikaciju socijalne usklađenosti (izveštaj o reviziji dostupan na zahtev). Takođe držimo ISO 9001: 2015 za upravljanje kvalitetom, a 64 naših modela proizvoda nose CE sertifikat (TÜVRheinland).REACH i RoHS dokumentacija o usklađenosti koja se isporučuje sa svakom OEM pošiljkom.'
    - q: Koje je tipično vreme isporuke OEM za narudžbu?
      a: Standardno vreme isporuke je 30–45 dana od potvrđene porudžbine i depozita. Razvoj prilagođenih kalupa dodaje 15–20 dana za izradu alata. Nudimo ubrzanu proizvodnju za hitne narudžbine i sezonske navale tokom pred-letnjeg perioda (jan–mar).
    - q: Možete li poslati FOB iz Qingdaoa ili CIF u našu luku?
      a: Da. Isporučujemo u FOB Qingdao, CIF glavne svetske luke, i DDP za kvalifikovane partnere. Naš logistički tim upravlja rezervacijom kontejnera, izvoznom dokumentacijom i carinskim prijemom. Isporučujemo u 50+ zemalja širom EU, SAD, AU i azijskih tržišta.
b2b_moq: 'Standard MOQ: 5–10 jedinica po modelu (SUP/kajak/drop-stitch). RIB MOQ: 2–5 jedinica. Probne porudžbine su dobrodošle za nova partnerstva.'
production_flow:
  tagline: Tok proizvodnje
  title: Od materijala do gotove čamca
  subtitle: Svaka čamac prolazi kroz 6 proizvodnih faza sa kontrolnim tačkama kvaliteta na svakom koraku. Nema prečica, nema preskočenih inspekcija.
  stages:
    - stage: '01'
      title: Prijem materijala i ulazna kontrola kvaliteta
      description: Svi dolazni materijali se beleže po serijskom/broju partije u našem ERP sistemu. PVC role tkanine, drop-stitch jezgra, ventili, lepkovi i hardver se stavljaju u karantin dok QC ne odobri.
      qc_check: Vlačna čvrstoća (ASTM D751), otpornost na cepanje (ISO 4674), debljina, viskozitet lepka, vizuelna kontrola nedostataka
      qc_threshold: 100% batcheva testirano. Odbiti ako je vlačna čvrstoća < 90% specifikacije, poderanje < minimalne specifikacije ili bilo koji vizuelni nedostatak
      responsibility: Dolazeći QC tim (3 inspektora)
    - stage: '02'
      title: CNC Sečenje i priprema materijala
      description: Računarom optimizovano raspoređivanje postavlja panele na PVC materijal kako bi se smanjio otpad. Automatske CNC mašine za sečenje zadržavaju tačnost pozicioniranja od 0,1 mm.
      qc_check: Dimenzionalna provera u odnosu na CAD DXF fajlove, inspekcija kvaliteta ivica, provera broja panela
      qc_threshold: Svaki 20. panel je izmeren. Tolerancija ±0,5 mm. Odbaciti seriju ako je >2% van tolerancije
      responsibility: Vođa radionice za sečenje
    - stage: '03'
      title: Zavarivanje i Drop-Stitch Lepljenje
      description: Drop-stitch jezgra su vezana za spoljne PVC laminate pomoću termo laminacije. Komore cevi su RF zavarene ili zavarene toplim zrakom. Trake šina su spojene fuzijom u tri sloja.
      qc_check: Peel test na svakih 50 jedinica (ASTM D751), merenje širine zavara, pregled evidencije temperature toplog vazduha, vizuelna inspekcija šava pod backlight-om
      qc_threshold: Minimalna čvrstoća ljuštenja 8 N/cm. Tolerancija širine zavarivanja ±1 mm. Bilo kakvo vidljivo kanalizovanje = odbiti
      responsibility: Kontrola kvaliteta zavarivanja (2 inspektora po smeni)
    - stage: '04'
      title: Sastavljanje i podešavanje
      description: 'Čamci se premještaju na finalnu montažu gde se svi delovi spajaju: trup, cevke, ugrađeni ventili, D-prstenovi, ručke, ležišta peraja i pričvršćivanje torbe za nošenje. Svaka jedinica prati kontrolnu listu montaže od 100 tačaka.'
      qc_check: Potpisivanje liste od 100 tačaka po jedinici, test funkcije ventila (10 ciklusa otvaranja/zatvaranja), provera zatezanja hardvera, vizuelna inspekcija
      qc_threshold: 'Politika nulte tolerancije na greške kod bezbednosno kritičnih stavki (ventili, D-prstenovi, ručke). Sitne kozmetičke nepravilnosti: AQL 2,5 (ISO 2859)'
      responsibility: Vođa tima za montažu + kontrola kvaliteta na liniji
    - stage: '05'
      title: Testiranje pritiska i zadržavanje kvaliteta
      description: Svaka komora se napumpa na 1,25× nazivne pritiske (obično 20–25 PSI) i održava 24–48 sati. Senzori pritiska beleže stalno. Komore koje prekorače pad pritiska od 5% se odbacuju i šalju na ponovnu inspekciju šavova.
      qc_check: 24h log pritiska, kalibracija senzora proveravana dnevno, očitavanje pritiska kompenzovano temperaturom, ponovni test šava nakon popravke
      qc_threshold: Maksimalno 5% pada pritiska tokom 24h pri stabilnoj temperaturi. Svaka komora koja premaši ovo = 100% retest cele proizvodne serije
      responsibility: Kvalitetni laboratorij (nezavistan od proizvodnje, izveštava menadžmentu)
    - stage: '06'
      title: Završna inspekcija i pakovanje
      description: Završna vizuelna i funkcionalna inspekcija. Površinske mane, konzistentnost boje, provera etiketa/BIN-ova, integritet pakovanja i kompletnost dodataka. Jedinice su vakuum pakovane, kutijene i paletizovane za utovar u kontejnere.
      qc_check: Puna vizuelna inspekcija, kontrolna lista dodataka po SKU, test otpornosti pakovanja (1 m, slučajni uzorak), verifikacija skeniranja etiketa/barenog koda
      qc_threshold: AQL 2,5 za glavne defekte, AQL 4,0 za manje. Nulta tolerancija na bezbednosne defekte. 100% jedinica vizuelno pregledano
      responsibility: Završni QC tim (4 inspektora) + Vođa pakovanja
