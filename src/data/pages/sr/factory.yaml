workshops_section:
  tagline: Radionice
  title: Proizvodne radionice
  workshops:
    - title: PVC Sečenje i priprema materijala
      description: Automatske CNC mašine za sečenje obrađuju PVC, Hypalon i drop-stitch tkanine sa preciznošću manjom od milimetra. Računarski optimizovano raspoređivanje minimizira otpad materijala i osigurava da svaki panel zadovoljava dimenzijske specifikacije pre zavarivanja.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Zavarivanje cevi i toplinsko zaptivanje
      description: Specijalizovana radionica za zavarivanje sa mašinama za toplinsko zaptivanje i RF dielektričnim presama. Toplomenom zaptivači spajaju i fiksiraju PVC cevi, dok RF zavarivanje proizvodi čvrste i nepropusne šavove koji premašuju zahteve ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: RIB Proizvodnja trupa — Stakloplastika
      description: RIB trupovi čamaca se proizvode pomoću ručnog nanosa stakloplastike sa poliester i vinil-ester smolama. Svaki sloj se ručno razvlači i vakumira za konzistentan kvalitet. Kabina za prskanje gelcoata pruža visokosjlajan, UV-otpornan morski završni sloj.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: SUP Štampa i dekoracija
      description: SUP ploče se dekoriraju digitalnom štampom za celobojne grafike i sitotiskom za logotipe i ponavljajuće šare. Digitalni štampači proizvode foto-kvalitet dek grafika, dok sitotisak obezbeđuje trajne, žive oznake brenda.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Konačna montaža i opremanje
      description: Linija za montažu gde se trupovi od stakloplastike i PVC cevi spajaju, motori se postavljaju, kormilo i kontrole se povezuju, a električni sistemi se ožičavaju. Svaki čamac prolazi 100-tačkastu listu provere montaže koju potpisuje vođa tima.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Testiranje kvaliteta i inspekcija
      description: Svaki gotov čamac prolazi obavezno testiranje vazdušne nepropusnosti, provere šavova i kompletnu sistemsku proveru pre isporuke. Naša laboratorija kvaliteta posluje nezavisno od proizvodnje i izveštava direktno menadžment.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
