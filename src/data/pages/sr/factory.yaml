hero:
  tagline: Fabrika
  title: Fabrika i proizvodnja
  subtitle: 12.000 m² integrisane proizvodnje — od sirovina do gotove čamca
intro:
  - Kao fabrika brenda **Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock kontroliše svaki korak proizvodnje — od dolaska sirovih PVC i stakloplastičnih materijala do konačne inspekcije pre isporuke gotovog čamca. Naša proizvodna hala u Qingdao Ekonomskom Razvojnom Zoni prostire se na 12.000 kvadratnih metara i obuhvata posvećene radionice za PVC sečenje, zaptivanje cevi toplinom, proizvodnju stakloplastičnog RIB trupa, SUP digitalni print, finalnu montažu i testiranje kvaliteta.
  - Integracijom dizajna, inženjeringa, prototipovanja, proizvodnje i testiranja pod jednim krovom, eliminišemo neefikasnosti ugovorne proizvodnje i zadržavamo direktnu kontrolu nad kvalitetom izrade, izborom materijala i rokovima isporuke. Svaki čamac koji napusti našu radionicu izrađen je od strane naših ljudi, na našoj opremi, prema našim standardima.
