        description: 25–50 dasaka ili kajaka sa mešovitom flotom (univerzalne, za turing, veličine za mlade)
      - title: Instruktorski flot
        description: 3–5 specijalizovanih dasaka za instruktore sa ugrađenim nosačima za zvučnike
      - title: Stanica za bezbednost
        description: Centralizovana stanica sa opremom za bezbednost, PFD-ovima, radio uređajima, prvu pomoć i signalizacijom
      - title: Paket za brending
        description: Puno štampanje logotipa na daskama, veslima, PFD-ovima i uniformama
