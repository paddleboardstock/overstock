      - title: Standardizacija flote
        description: Identična oprema na svim lokacijama za dosledno iskustvo učenika
      - title: Centralno naručivanje
        description: Konsolidovano naručivanje, veleprodajne cene i centralizovano upravljanje rezervnim delovima
      - title: Obuka instruktora
        description: Sertifikacija za rukovanje i održavanje opreme za sve instruktore
