hero:
  tagline: Škole i centri za obuku vodenih sportova
  title: Rešenja za opremu<br />Za SUP i škole kajaka
  subtitle: Pouzdana oprema komercijalnog kvaliteta za škole veslanja, instrukcije surfovanja, obuku kajaka i obrazovne programe vodenih sportova bilo koje veličine.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP daske za škole i centre za obuku
direct_answer: Aquafarer obezbeđuje SUP i školama kajaka širom sveta opremu komercijalnog kvaliteta, sigurnosnu opremu i pakete za instruktore. Naša oprema je napravljena za svakodnevnu upotrebu u nastavi — deblji PVC, ojačani drop-stitch jezgra i stabilni trupi koji pružaju početnicima sigurnost i instruktorima pouzdanost. Paketi uključuju prilagođeni brending, programe rezervnih delova i resurse za obuku.
solution_offerings:
  - title: Paket za početnike škole
    subtitle: Za nove programe i male centre za obuku
    badge: Popular
    features:
      - title: Daske za učenike
        description: 10–25 univerzalnih SUP dasaka ili rekreativnih kajaka sa stabilnim platformama za početne časove
      - title: Daske za instruktore
        description: Šire, duže daske sa dodatnom stabilnošću i protivkliznim EVA palubama za obuku
      - title: Oprema za bezbednost
        description: Prsluci za spašavanje, pojasevi, zviždaljke i vreće za bacanje u odgovarajućim bojama
      - title: Skladištenje i transport
        description: Police za slaganje dasaka, obložene korpe za kajake i kolica za transport
      - title: Podrška za nastavni plan
        description: Predlošci časova, kontrolne liste bezbednosti i vodiči za napredovanje veština
    cta_text: Paket Za Moju Školu
    cta_href: /contact
  - title: Premium paket škole
    subtitle: Za etablirane škole i operatore sa više programa
    badge: Best Value
    features:
