        description: Zajedničko brendiranje sa franšizom + Aquafarer opcije su-brendiranja
      - title: Podrška za širenje
        description: Konsultacije za proširenje, prognoza opreme i postavljanje novih lokacija
    cta_text: Razgovarajte o franšiznom planu
    cta_href: /contact
benefits:
  - title: Pravljeno za svakodnevnu nastavu
    description: Deublje PVC i ojačane šine podnose svakodnevnu upotrebu od strane učenika, padove na pesku i kamenite doskoke.
    icon: tabler:shield
  - title: Stabilne platforme za učenje
    description: Širi trupovi i ravniji klizači daju sigurnost početnicima. Instruktori se fokusiraju na podučavanje, ne na opremu.
    icon: tabler:scale
  - title: Jednostavno skladištenje i transport
    description: Naduvani dizajn se sprema u male prostore. Ispuštene daske staju u standardne gepeke vozila za mobilno podučavanje.
    icon: tabler:box-seam
  - title: Prilagođeni brending
    description: Logoi i boje škole na svakoj dasci. Vaš brend, vaš identitet — ne generička iznajmljena oprema.
    icon: tabler:brush
content_segments:
  tagline: Školski profili
  title: Rešenja za obrazovanje u vodenim sportovima<br />Po tipu programa
  subtitle: Škole veslanja, akademije surfovanja, univerzitetski programi i operateri franšiza suočavaju se sa različitim operativnim izazovima — od integracije kurikuluma do standardizacije flote na više lokacija. Konfigurišemo pakete opreme prema obrazovnom modelu.
  items:
    - title: Nezavisne SUP i škole kajaka
      subtitle: Centri za obuku kojima upravljaju vlasnici
      description: Male do srednje škole kojima upravljaju instruktori-vlasnici nude SUP časove, obuku kajaka i kurseve sertifikacije. Oprema mora biti dovoljno izdržljiva za svakodnevnu nastavu, pristupačna za budžet malog biznisa i dovoljno svestrana da služi od početnika do srednje nivoe učenika u jednoj floti.
      features:
        - SUP Stabilne svestrane daske i rekreativni kajaci za početnike
        - Ploče specifične za instruktore sa dodatnom stabilnošću za treniranje iz vode
        - Uključeni su šabloni plana lekcija i vodiči za napredovanje veština
        - Godišnji program osvežavanja opreme sa popustima za trgovinu
    - title: Univerzitet & Koledž Rekreacioni programi
      subtitle: Velike studentske rekreativne flote
      description: Univerzitetska odeljenja za rekreaciju rade veslačke klubove, programe iznajmljivanja i nastavne kurseve kao deo rekreacijskih ponuda u kampusu. Oprema se suočava sa vrhunskom upotrebom tokom semestara, zahteva jednostavne sisteme za prijavu / odjavu, i mora da izdrži različite nivoe veština od studenata koji prvi put do naprednih veslača.
      features:
        - Konstrukcija visoke izdržljivosti PVC ocijenjena za cikluse institucionalne upotrebe
        - Flote u boji po nivou veštine za jednostavno upravljanje
        - RFID ili kompatibilnost sistema za praćenje zaliha na bazi nalepnica
        - Bulk cene sa uslovima naručivanja i plaćanja zasnovanih na semestru
    - title: Surf škole i surf akademije
      subtitle: Primorski surf nastavni programi
      description: Škole surfanja podučavaju SUP veštine surfovanja, veslanja i kajaka u okeanu. Oprema mora da se nosi sa uslovima zone surfovanja - otpornošću na udarce, tolerancijom na pesak i slanu vodu i lakim ispiranjem i povratkom između časova po satu.
      features:
        - Oblici specifični za surfovanje sa ojačanim šinama i konstrukcijom otpornom na udarce
        - Opcije mekih peraja i namotani povodci za bezbednost učenika
        - Tkanina za brzo ispiranje koja se suši između rotacija lekcija
        - Program zamene voznog parka sa pregledom i osvežavanjem na kraju sezone
    - title: Franšize i lanci na više lokacija
      subtitle: Standardizovana oprema na svim lokacijama
      description: Operateri na više lokacija koji pokreću standardizovane programe obuke u više gradova ili regiona. Konzistentnost flote na svim lokacijama je najvažnija - svaki učenik treba da ima isto iskustvo sa opremom bez obzira na to koju lokaciju franšize posećuje. Centralizovano naručivanje, brendirana uniformnost i podrška za skaliranje su od suštinskog značaja.
      features:
        - Identične specifikacije flote na svim lokacijama franšize
        - Centralizovano konsolidovano naručivanje sa obimnim cenama
        - 'Opcije zajedničkog brendiranja: + Aquafarer ko-brend franšize'
        - 'Komplet za podešavanje nove lokacije: oprema, signalizacija i otvaranje inventara'
