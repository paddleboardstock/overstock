hero:
  tagline: Proizvodni kapacitet
  title: Proizvodni Kapacitet i Godišnja Proizvodnja
  subtitle: Objekat od 12.000 m² koji proizvodi 15.000 čamaca godišnje sa mogućnošću širenja
intro: Aquafarer upravlja jednim od najvećih specijalizovanih objekata za proizvodnju napuhanih čamaca u Qingdao, Kina. Naša fabrika od 12.000 m² organizovana je u šest specijalizovanih radionica koje rade paralelno, što nam daje kapacitet za proizvodnju 15.000 čamaca godišnje u linijama SUP, kajaka, čamaca, RIB i opreme za bezbednost.
highlights:
  - value: 12,000 m²
    label: Ukupna površina proizvodnje
    detail: Kroz 6 specijalizovanih radionica
  - value: 15,000
    label: Godinašnji broj proizvedenih čamaca
    detail: SUPs, kajaci, RIBs, čamci, oprema za bezbednost
  - value: 200-300
    label: Kvalifikovana radna snaga
    detail: 25+ inženjera, 2 smene/dan
  - value: 50+
    label: Zemlje izvoza
    detail: EU, SAD, AU, Bliski Istok, Azija
  - value: 30–45
    label: Standardno vreme isporuke (dana)
    detail: Od potvrde porudžbine do FOB
  - value: 10+
    label: Godine iskustva u izvozu
    detail: Od 2012.
workshops:
  - title: SUP Proizvodnja dasaka
    description: '4 paralelne montažne linije za naduvavajuće SUP daske. Svaka linija može proizvesti 50–80 dasaka po smeni. Stanice za digitalni i screen štampu rade istovremeno. Godišnji kapacitet SUP: 8,000+ dasaka.'
    output: 8,000+ SUPs/godina
  - title: RIB Proizvodnja čamaca
    description: 'Specijalna radionica za fiberglas trupa sa 6 stanica za kalupe za RIB trupove do 7,6 m. Zona za zavarivanje cevi i montažu rukuje sa 3–5 RIBs istovremeno. Godišnji kapacitet RIB: 2,000+ čamaca.'
    output: 2,000+ RIBs/godina
  - title: Naduvavajući čamci i čamci
    description: 'Višenamenske proizvodne linije za naduvavajuće čamce, kajake i čamce. Stanice za zavarivanje vrućim vazduhom, RF dielektrične prese i montažne stanice se rekonfigurišu prema miksu porudžbina. Godišnji kapacitet: 5,000+ jedinica.'
    output: 5,000+ jedinica/godina
  - title: Oprema za bezbednost
    description: 'Posebna proizvodna zona sa čistom sobom za prsluke za spasavanje i sigurnosnu opremu. Posvećene stanice za šivenje, umetanje pene i testiranje. Godišnji kapacitet prsluka: 50,000+ jedinica.'
    output: 50,000+ prsluka/godina
oem_capacity:
  moq: 'SUP: 5–10 jedinica | RIB: 2–5 jedinica | Kajak/Čamac: 10–20 jedinica | Prilagođeni kalup: 200+ jedinica'
  lead_time: Standardno 30–45 dana. Uzorak 15–20 dana. Hitna proizvodnja dostupna.
  payment: T/T 30% depozit + 70% pre isporuke. L/C, Western Union prihvaćeni.
