hero:
  tagline: Oprema
  title: Proizvodna oprema i mašine
  subtitle: Industrijska oprema za sečenje, zavarivanje, štampanje i sklapanje
  back_label: Nazad u Fabriku
  back_link: /factory
categories:
  - title: Sečenje i priprema materijala
    items:
      - name: Automatska PVC mašina za sečenje
        spec: CNC-kontrolisano, 6,5 m × 2,5 m, tačnost 0,1 mm
        desc: Kompjuterski kontrolisana automatska mašina za sečenje za PVC, Hypalon i drop-stitch tkanine. Softver za raspoređivanje optimizuje korišćenje materijala da bude ispod 5% otpada.
      - name: Razvlačivač tkanine
        spec: Maksimalna širina 3 m, napajanje kontrolisano zatezanjem
        desc: Postavlja tkaninu u jednoj ili više slojeva sa kontrolisanim zatezanjem da se spreči deformacija pre sečenja.
  - title: Zavarivanje i spajanje cevi
    items:
      - name: Mašina za toplinsko zaptivanje
        spec: Vrući-zračni zavar, promenljiva temperatura 200–600 °C, 0,5–5 m/min
        desc: Mašina za zavarivanje i zaptivanje vrućim vazduhom za spajanje i zavarivanje PVC i Hypalon šavova cevi. Koristi se za privremeno spajanje, zaptivanje i spajanje komora cevi i plovnih zglobova.
      - name: Dijelektrični RF pres
        spec: 15 kW, plata 2000 × 600 mm
        desc: Press za zavarivanje radio-frekvencijom za glavne uzdužne šavove, spojeve od krme do cevi i izradu velikih komora.
      - name: CNC-kontrolisani RF zavarivač
        spec: 8 kW, XY sto 2500 × 1200 mm
        desc: Programabilno zavarivanje zakrivljenih šavova za složene geometrije, utiskivanje logoa i precizan rad sa zakrpama.
  - title: RIB proizvodnja trupa
    items:
      - name: Kalupi za ručni nanos stakloplastike
        spec: Više kalupa za RIB trupove do 6 m dužine
        desc: Tradicionalno ručno oblikovanje stakloplastike sa poliester i vinilester smolama. Svaki sloj se ručno valja i vakumski upakuje za dosledan kvalitet i snagu laminata.
      - name: Kabina za prskanje gelcoata
        spec: Temperaturan kontrolisana, filtrirana ventilacija vazduha
        desc: Nanošenje gelcoata za RIB trupove. Obespečuje visokosjajni završetak otporan na UV sa preciznom kontrolom debljine.
      - name: CNC Ruter (5-osni)
        spec: Obim 3 m × 2 m × 1 m, vreteno hlađeno vodom
        desc: Obrada umetaka trupa, kalupa za konzole, postolja za sedišta i prilagođenih nosača.
  - title: SUP Štampa i dekoracija
    items:
      - name: Digitalni štampač
        spec: Štampa visoke rezolucije, inkjet, do 2 m širine štampe
        desc: Digitalna direktna štampa na tkanini za grafiku palube u punoj boji SUP. Štampa prilagođene šablone, prelaze i slike kvaliteta fotografije sa vodootpornim UV-bojenim mastilom.
      - name: Sito štamparska mašina
        spec: Ručno i poluautomatsko, višebojno poravnanje
        desc: Sitotisak za SUP logotipe dasaka, oznake brenda i ponavljajuće šare. Omogućava trajnu, neprozirnu štampu sa živim zasićenjem boja.
  - title: Sastavljanje i podešavanje
    items:
      - name: Dizalica za motore
        spec: Kapacitet 500 kg, podesiva šipka
        desc: Sigurno postavljanje vanbrodskih motora od 2,5 do 60 ks.
      - name: Rama za maketu konzole
        spec: Podesiva visina i ugao
        desc: Predmontiranje upravljača, gasa i kontrolnih panela pre instalacije.
      - name: Pres za hidraulične creva
        spec: Do 1" ID, digitalni merač pritiska
        desc: Hidraulički sklopovi upravljačkih creva prilagođene dužine sa stegnutim priključcima.
      - name: Tabla za električni kabl
        spec: 3 m × 1,5 m, prethodno štampani šematski prikazi
        desc: Montaža i testiranje kompletnih električnih kablova van broda.
  - title: Testiranje i kontrola kvaliteta
    items:
      - name: Univerzalni tester vlačne čvrstoće
        spec: 50 kN, / ASTM D751
        desc: Testiranje sile pucanja, izduženja pri pucanju i širenja cepanja za tkanine.
      - name: Test Rig za zadržavanje vazduha
        spec: Programabilan, 30-minutno zadržavanje pritiska
        desc: Automatski test zadržavanja pritiska za svaku komoru cevi pre montaže.
      - name: Tester odvajanja šava
        spec: Motorni 180° odvoj na 100 mm/min
        desc: Testiranje čvrstoće zavara i spojenih šavova prema ISO 6185.
      - name: Ksenonska komora za izlaganje vremenskim uticajima
        spec: 2000 sati izlaganja
        desc: Testiranje otpornosti UV na promenu boje i očuvanje čvrstoće.
