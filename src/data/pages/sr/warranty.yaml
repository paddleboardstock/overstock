label: Garancija
headline: Paddle Board Overstock Ograničena garancija proizvođača
subtitle: Paddle Board Overstock stoji iza kvaliteta svakog morskog proizvoda na naduvavanje koji proizvodimo. Ova ograničena garancija utvrđuje uslove i pokrivenost vašeg Paddle Board Overstock proizvoda.
seo:
  headline: Paddle Board Overstock Garancija za čamac na naduvavanje — 5-godišnja ograničena garancija | Paddle Board Overstock
  description: Paddle Board Overstock nudi 5-godišnju ograničenu garanciju na primarne cevi tkanine, šavova i fiberglasa trupa strukturnog integriteta. Takođe pokriva ventile za naduvavanje i fabrički instaliran pribor. Potpuni uslovi za Paddle Board Overstock garanciju na naduvavanje.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ova ograničena garancija odnosi se na nove Paddle Board Overstock brendirane gumene morske proizvode kupljene direktno od Paddle Board Overstock ili od ovlašćenog Paddle Board Overstock dilera ili prodavca. Datum stupanja na snagu je proverljiv datum originalne maloprodajne kupovine.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Pokrivenost garancijom i trajanje</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godine</h3>
        <p class="text-sm text-gray-600 mt-1">Integritet tkanine primarne cevi (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godine</h3>
        <p class="text-sm text-gray-600 mt-1">Fiberglas trup strukturni integritet</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godine</h3>
        <p class="text-sm text-gray-600 mt-1">Naduvavanje cevi šav vazduh-držanje sposobnost</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godine</h3>
        <p class="text-sm text-gray-600 mt-1">Funkcionalnost ventila za naduvavanje</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 godine</h3>
        <p class="text-sm text-gray-600 mt-1">Fabrički instaliran pribor i pomoćni pribor</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 godine*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercijalna, iznajmljivanje ili upotreba voznog parka — sve komponente</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">* Komercijalna, vladina, čarter, iznajmljivanje ili nastavna upotreba smanjuje garanciju na KSNUMKS godinu. Trke ili takmičenje upotreba poništava garanciju u potpunosti.</p>
  </div>

  <h2>Šta je pokriveno</h2>
  <h3>Primarna cevi tkanina (5 godina)</h3>
  <p>Paddle Board Overstock garantuje glavnu cev tkaninu protiv pogoršanja poroznosti koja značajno ugrožava sposobnost proizvoda da održi operativnu inflaciju. Ovo se odnosi na CSM Hypalon() obložene tkanine i sve ostale materijale cevi tkanine koji se koriste u proizvodnji.</p>

  <h3>Fiberglas trup strukturni integritet (5 godina)</h3>
  <p>Za proizvode sa plastičnim () trupom ojačanim fiberglasomFRP, osnovna kompozitna struktura je garantovana protiv strukturnog kvara zbog nedostataka u materijalima ili izradi.</p>

  <h3>Naduvavanje cevi šav vazduha Holding Sposobnost (5 godina)</h3>
  <p>Šavovi cevi na naduvavanje, gde su spojeni tokom proizvodnje, garantovani su protiv proizvodnih nedostataka koji dovode do značajnog curenja vazduha kroz šav. Periodična inspekcija i održavanje odgovarajućih pritisaka inflacije su uslovi pokrivenosti.</p>

  <h3>Ventil za naduvavanje Funkcionalnost (5 godina)</h3>
  <p>Ventili za naduvavanje vazduha prvobitno instalirani Paddle Board Overstock su garantovani protiv proizvodnih nedostataka u materijalima ili izrade koji sprečavaju ventil da drži vazduh kao što je dizajnirano.</p>

  <h3>Fabrički instaliran pribor (1 godina)</h3>
  <p>Komponente i okovi proizvedeni Paddle Board Overstock i prvobitno instalirani u fabrici imaju garanciju protiv nedostataka u materijalu i izradi za godinu dana. Ovo isključuje stavke trećih strana, koje su pokrivene samo njihovim garancijama proizvođača.</p>

  <h2>Šta nije pokriveno</h2>
  <ul>
    <li>Kozmetički nedostaci, uključujući promenu boje, bojenje, bledi, kreda ili bilo kakve promene u izgledu</li>
    <li>Bušenja, posekotine, cepanja, kidanja ili druga fizička oštećenja</li>
    <li>Pucanje, lomljenje, habanje, ogrebotine ili propadanje usled trenja ili kontakta</li>
    <li>Propadanje usled izloženosti svetlu UV, vremenskim uticajima ili atmosferskim uslovima</li>
    <li>Oštećenje usled kontakta sa gorivima, rastvaračima, kiselinama, alkalijama ili hemikalijama</li>
    <li>Šteta nastala zbog nepažnje, nepravilne upotrebe, zloupotrebe, nezgode ili uobičajenog habanja</li>
    <li>Problemi sa gelkoatom ili površinom boje (belež, pucanje, promena boje, bledenje)</li>
    <li>Oštećenje usled udarca, naprezanja, nepravilne potpore ili transporta na prikolici</li>
    <li>Oštećenje zbog nepravilnog naduvavanja/ispuštanja vazduha ili upotrebe neodobrenih uređaja za naduvavanje</li>
    <li>Oprema, komponente ili sistemi trećih strana (pokriveni od strane njihovih odgovarajućih proizvođača)</li>
  </ul>

  <h2>Obaveza proizvođača i pravni lek</h2>
  <p>Jedina i isključiva obaveza Paddle Board Overstock jeste popravka ili zamena, prema izboru Paddle Board Overstock, bilo koje komponente koja se utvrdi da je neispravna u materijalima ili izradi i koja je pokrivena ovom garancijom. Popravke ili zamene obavlja Paddle Board Overstock ili njegov ovlašćeni servisni centar. Komponente koje su popravljene ili zamenjene imaju garanciju samo za neiskorišćeni deo originalnog garancijskog perioda.</p>

  <h2>Uslovi garancije</h2>
  <ul>
    <li><strong>Registracija:</strong>Proizvod mora biti pravilno registrovan kako je propisano uslovima garancije.</li>
    <li><strong>Održavanje:</strong>Proizvod mora biti održavan u skladu sa objavljenim smernicama Paddle Board Overstock, uključujući periodične inspekcije i održavanje odgovarajućih pritisaka napumpavanja.</li>
    <li><strong>Saradnja:</strong>Kupac mora u potpunosti i bez odlaganja sarađivati sa Paddle Board Overstock u svim pitanjima koja se tiču reklamacija.</li>
    <li><strong>Originalni kupac:</strong>Ova garancija se pruža isključivo originalnom krajnjem kupcu i nije prenosiva.</li>
  </ul>

  <h2>Komercijalna upotreba</h2>
  <p>Ako se proizvod koristi za komercijalne, vladine, neprofitne, čarter, iznajmljivanje, obrazovne ili bilo koju svrhu osim privatne rekreativne upotrebe, period garancije za sve komponente se smanjuje na jednu (1) godinu od originalnog datuma kupovine u maloprodaji. Korišćenje u trkama, takmičenjima brzine ili izdržljivosti odmah i nepovratno poništava garanciju u potpunosti.</p>

  <h2>Kako podneti reklamaciju</h2>
  <p>Kontaktirajte Paddle Board Overstock ili svog ovlašćenog prodavca sa dokazom o kupovini i detaljnim opisom problema. Paddle Board Overstock će pregledati zahtev i dati uputstva za inspekciju i servis.</p>
  <p>Za upite u vezi sa garancijom, molimo kontaktirajte nas putem našeg<a href="/contact" class="text-sky-600 underline">kontakt stranica</a>sa vašim brojem narudžbine i detaljima proizvoda.</p>

  <h2>Stvari trećih strana</h2>
  <p>Oprema, komponente ili sistemi koje proizvode treće strane (čak i ako ih instalira Paddle Board Overstock) pokrivaju isključivo garancije koje nudi njihov odgovarajući proizvođač. Paddle Board Overstock izričito odbacuje bilo kakvu odgovornost za garanciju za takve proizvode trećih strana.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Ova izjava o garanciji je sažetak potpune Paddle Board Overstock Ograničene garancije proizvođača. Celokupan pravni dokument o garanciji reguliše sve uslove i odredbe garancije. Specifikacije su podložne promenama bez prethodne najave. Paddle Board Overstock je fabrički brend Paddle Board Overstock Qingdao proizvodnog centra.
  </p>
