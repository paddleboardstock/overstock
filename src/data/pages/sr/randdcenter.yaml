rd_services:
  tagline: Prilagođeni istraživački i razvojni rad
  title: Usluge istraživanja i razvoja za partnere
  services:
    - title: Prilagođeni razvoj materijala
      desc: Razvijamo prilagođene formulacije tkanina, slojeve laminata i adhezivne sisteme prilagođene vašem radnom okruženju i ciljevima performansi.
    - title: OEM / ODM Inženjering proizvoda
      desc: Od konceptualnih skica do inženjerskih paketa spremnih za proizvodnju — naš tim može dizajnirati, prototipizirati i validirati brodove pod vašim brendom.
    - title: Nezavisno testiranje i sertifikacija
      desc: Koristite naše ISO-usklađene test objekte za nezavisno testiranje materijala, verifikaciju proizvoda i podršku za sertifikaciju.
  cta: Razgovarajte o vašim potrebama za istraživanjem i razvojem →
  cta_link: /contact
vision:
  tagline: Naša vizija
  title: Oblikovanje budućnosti vodenih sportova
  body: Paddle Board Overstock teži da predvodi industriju napuhavajućih čamaca i SUP kroz kontinuirane inovacije, nepokolebljiv kvalitet i čvrstu posvećenost bezbednosti i održivosti — na kraju obogaćujući iskustva ljubitelja vodenih sportova širom sveta. Paddle Board Overstock R&D centar je mesto gde se strast susreće sa inovacijom, postavljajući nove standarde u industriji vodenih sportova.
labs_section:
  tagline: Laboratorije
  title: Naše laboratorije
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC Tkanina Lab
      description: Kontinuirana istraživanja i testiranje tkanina cevi PVC i Hypalon na vlačnu čvrstoću, otpornost UV, habanje i fleksibilnost na niskim temperaturama kako bi se osigurala dugoročna pouzdanost u morskih okruženjima.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Hull Inženjerski Studio
      description: Dizajn vođen CAD-om i analiza konačnih elemenata HDPE, aluminijumskih i stakloplastičnih trupa. Svaki trup se digitalno simulira za raspodelu naprezanja i otpornost na udar pre nego što se izgradi prvi prototip.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF Centar za zavarivanje
      description: Specijalizovana radionica za zavarivanje radio-frekvencijom sa preciznom kontrolom temperature i pritiska, koja proizvodi šavove velike čvrstoće i hermetičnosti koji zadovoljavaju standarde pomorske industrije za napuhljive čamce.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Hidrodinamički test rezervoar
      description: Testiranje maketa u našem internom test rezervoaru kako bismo optimizovali oblik trupa, performanse pri klizanju po vodi, stabilnost i efikasnost potrošnje goriva u različitim uslovima opterećenja i mora.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Radionica prototipa
      description: Puna skala prototipiranja i opreme gde se prave, montiraju i testiraju novi modeli na moru. Svaki prototip prolazi minimalno 20-satni program testiranja u vodi pre odobrenja za proizvodnju.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Laboratorija za kvalitet i inspekciju
      description: Posvećen laboratorij za kontrolu kvaliteta koji vrši testiranje na zatezanje, cikluse zadržavanja vazduha, testove ljuštenja šava i sertifikaciju materijala kako bi se osiguralo da svaki čamac koji napusti radionicu ispunjava naše objavljene specifikacije.
      href: /randdcenter/quality-inspection-lab
