hero:
  tagline: Centar za istraživanje i razvoj
  title: R & D Centar
  subtitle: Fokusiran na napredak
intro:
  - R&D centar kompanije Paddle Board Overstock je pokretačka snaga naše misije da revolucionizujemo opremu za vodene sportove. Omogućavamo entuzijastima vodenih sportova širom sveta bezbednije, udobnije i prijatnije proizvode kroz neumornu inovaciju na napuhavajućim daskama za stajanje na vodi (SUPs) i čamcima. Naš posvećeni tim inženjera, dizajnera i strastvenih stručnjaka za vodene sportove oblikuje budućnost industrije, stalno podižući standarde kvaliteta, performansi i održivosti.
  - Naš R&D objekat okuplja naučnike materijala, brodograditelje i proizvodne inženjere pod istim krovom. Od formulacije tkanina i simulacije trupa do razvoja procesa zavarivanja i testiranja punog obima na moru, svaki korak razvoja proizvoda je zasnovan na podacima i potvrđen testiranjem.
mission:
  tagline: Naša Misija
  title: Inoviranje budućnosti vodenih sportova
  pillars:
    - icon: lightning
      title: Tehnološki napredak
      desc: Pionirski razvijamo nove materijale, dizajne i proizvodnju kako bismo postigli superiorne performanse proizvoda i dugovečnost.
    - icon: design
      title: Dizajn orijentisan na korisnika
      desc: Duboko razumemo i prevazilazimo potrebe korisnika kroz ergonomski i intuitivan dizajn proizvoda.
    - icon: globe
      title: Održive prakse
      desc: Minimiziramo ekološki otisak korišćenjem ekoloških materijala i procesa.
    - icon: shield
      title: Nepopustljiva sigurnost
      desc: Obezbeđujemo najviše standarde sigurnosti kroz rigorozno testiranje i sertifikaciju.
pillars:
  - title: Tehnološki napredak
    desc: Pionirski razvijamo nove materijale, dizajne i proizvodne procese kako bismo pružili superiorne performanse proizvoda i dugovečnost.
    icon: tech
  - title: Napredni materijali
    desc: Istražujemo vrhunske PVC, Hypalon, kompozite i održive alternative za poboljšane karakteristike proizvoda.
    icon: materials
  - title: Održivi razvoj
    desc: 'Osnovna posvećenost: posvećeni smo očuvanju životne sredine kroz održivu proizvodnju i reciklabilne materijale.'
    icon: sustainability
capabilities:
  tagline: Mogućnosti
  title: R&D kapaciteti
  subtitle: Četiri osnovne discipline koje nam omogućavaju sveobuhvatnu kontrolu nad razvojem proizvoda — od istraživanja sirovina do finalne sertifikacije.
  groups:
    - title: Nauka o materijalima & tehnologija tkanina
      items:
        - Analiza i optimizacija formulacija PVC i Hypalon
        - Razvoj stabilizacije UV, otpornosti na plamen i antimikrobnih aditiva
        - Laminacija višeslojnih tkanina i inženjering adhezije
        - Testiranje ubrzanog starenja (UV, termalno, vlažnost, slani sprej)
    - title: Brodostrojstvo & Hidrodinamika
      items:
        - Parametarski 3D dizajn trupa i CFD optimizacija
        - Analiza konačnih elemenata za strukturna opterećenja i udarne sile
        - Testiranje u vučnom bazenu sa skaliranim modelom i verifikacija performansi
        - Razvoj prilagođenog trupa za specijalne misijske profile
    - title: Tehnologija zavarivanja i spajanja
      items:
        - Razvoj i optimizacija RF dielektričnog procesa zavarivanja
        - Metode zavarivanja toplim vazduhom, toplim klinom i ultrazvukom
        - Kvalifikacija lepljenja i traka za šavove
        - Modeliranje čvrstoće zavara i predviđanje veka trajanja
    - title: Testiranje, Sertifikacija i Usklađenost
      items:
        - Upravljanje kvalitetom i CE testiranje usklađenosti
        - Podrška za nezavisno testiranje i sertifikaciju treće strane
        - Razvoj prilagođenih test protokola za kvalifikaciju nabavke
        - Analiza kvarova u toku servisa i istraživanje osnovnog uzroka
