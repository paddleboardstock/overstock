stories:
  tagline: Priče istraživača
  title: Prave avanture od pravih ljudi
  subtitle: Slušajte kajakaše, porodice i profesionalce koji koriste Paddle Board Overstock opremu na vodi.
  items:
    - name: Sara i Majk
      title: SUP Vlasnici Explorera 11, Kanada
      content: Odveli smo naše Explorer 11 na sedmodnevno putovanje kroz Algonquin Park. Lako su se nosili s prenošenjem i prelascima jezera. Konstrukcija drop-stitch je značila da možemo napumpati na 15 PSI i dobiti performanse tvrdih dasaka od sklopive daske.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonkin park, Kanada
    - name: Carlos R.
      title: Cheetah Surge vozač, Španija
      content: Cheetah Surge mi je prvi izbor za plovidbu uz obalu. Živopisni dizajn privlači poglede na plaži, a stabilnost mi uliva poverenje pri laganim talasima. Odlično se upravlja kako tokom ture, tako i dok uživam u zalasku sunca.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Kosta Brava, Španija
    - name: Lina i porodica
      title: Veslači Flowing Lotus, Švedska
      content: Porodične avanture vikendom na arhipelagu. The Flowing Lotus je dovoljno stabilan da moja ćerka može da stoji dok ja veslam. Naduva se za manje od 10 minuta — nije potreban prikolica, samo čista porodična zabava na vodi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Arhipelag Stokholm, Švedska
    - name: Por. komandant Andres
      title: Istraživač Ocean Voyager, Filipini
      content: Koristim svoj Ocean Voyager za dugolinijske obalne ture oko Palavana. Nakon meseci svakodnevne upotrebe u tropskim uslovima, daska i dalje radi kao nova. Oblik za ture probija kroz talase koji bi zaustavili slabije daske.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palavan, Filipini
    - name: Ema T.
      title: Tropical Breeze početnik, Australija
      content: Nikada ranije nisam bio na SUP. Tropical Breeze je toliko stabilan da sam se osećao sigurno pri prvom pokušaju. Sada veslam svakog vikenda. Krivulja učenja je praktično nula — i daska izgleda neverovatno na vodi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australija
