services:
  - title: Dizajn proizvoda i inženjering
    description: Naš interni R&D tim radi sa vašim konceptom ili specifikacijom kako bi razvio CAD crteže, 3D modele i prototipe. Nudimo dizajn kalupa, optimizaciju oblika trupa i smernice za izbor materijala.
  - title: Prilagođeni brend i grafika
    description: Digitalni štampa u punoj boji, sitotisak, utiskivanje i opcije etiketa. Razvijamo grafike palube specifične za brend, brendiranje cevi i pakovanje spremno za maloprodaju.
  - title: Prilagođavanje materijala i specifikacija
    description: Birajte između PVC (standardni, ekološki prihvatljiv, otporn na vatru), Hypalon/CSM, drop-stitch i hibridnih konstrukcija. Prilagođene boje cevi, težine tkanine i opcije ojačanja.
  - title: Pakovanje i logistika
    description: Prilagođeno maloprodajno pakovanje, privatne kutije, vakumsko pakovanje, paletizacija i utovar u kontejnere. FOB Qingdao, CIF, ili DDP dostupni uslovi isporuke.
