why_us:
  - title: Vertikalna integracija
    description: Posedujemo našu fabriku, kalupe i lanac snabdevanja — bez posrednika, bez podizvođača. Ovo nam daje kontrolu nad kvalitetom, troškovima i isporukom.
  - title: Dvostruka sertifikacija
    description: ISO 9001 za upravljanje kvalitetom i sertifikat za društvenu usklađenost. Izveštaji sa audita fabrike dostupni na zahtev.
  - title: Usklađenost
    description: Svi standardni modeli imaju sertifikat 2013/53/EU. Prilagođeni modeli mogu biti sertifikovani kroz naš uspostavljeni proces.
  - title: Niska količina narudžbine
    description: Počnite sa samo 5 jedinica za standardne modele. Pomažemo novim brendovima da lansiraju proizvode bez prevelikog zaliha.
