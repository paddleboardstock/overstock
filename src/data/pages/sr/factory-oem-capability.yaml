hero:
  tagline: / OEMODM Proizvodnja
  title: OEM & Privatna proizvodnja brendova
  subtitle: Od koncepta do kontejnera — prilagodite svaki detalj vaše linije napuhanih vodene opreme
intro: Aquafarer nudi sveobuhvatne OEM i ODM usluge za brendove, distributere i državne agencije širom sveta. Sa 10+ godina iskustva u izvozu i fabričkom pogonom od 12.000 m² sa sertifikatima 9001 & BSCI, rukovodimo svim procesima od dizajna proizvoda i razvoja kalupa do proizvodnje u punom obimu, pakovanja i logistike.
