hero:
  tagline: O nama
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock fabrika i radionica
  title: |
    Pomorsko inženjerstvo,<br />
    izgradili smo<span class="text-accent dark:text-white">Paddle Board Overstock</span>način
  subtitle: 'Počeli smo u obalnoj radionici sa jednom čamcem i tvrdoglavim uverenjem: pomorski proizvodi treba da se projektuju kao da su važni, jer jesu. Danas šaljemo u preko 50 zemalja, ali svaki trup i dalje prolazi kroz iste ruke koje su pokrenule kompaniju.'
stats:
  title: Brojke
  columns: 4
  stats:
    - title: Isporučeni trupovi
      amount: 2,400+
    - title: Zemlje u koje se šalje
      amount: 50+
    - title: Godine kombinovanog iskustva
      amount: '60'
    - title: Prosečno vreme odgovora na garanciju (sati)
      amount: '24'
features3_what_we_build:
  title: Šta pravimo
  subtitle: Fokusirana linija proizvoda koju poznajemo do najsitnijeg detalja — bez polovičnih eksperimenata, bez "badge" inženjeringa.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB čamci
      description: Čamci sa aluminijumskim trupom RIBs od 3,3 m do 7,5 m. Dizajnirani za patrolu, ronjenje, pecanje i porodičnu upotrebu.
      icon: tabler:ship
    - title: Naduvavajući čamci
      description: PVC i Hypalon naduvavajući dingiji od 2,4 m do 4,2 m. Lagani, čvrsti i laki za skladištenje.
      icon: tabler:speedboat
    - title: Tenderi za superjahte
      description: Kompaktni, visokospecijalizovani RIBs izrađeni po meri kako bi se uklopili u izgled vaše matične jahte.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Dodaci
      description: Vesla, pumpe, prekrivači, suve torbe, rezervoari za gorivo i elektronika. Sve prilagođeno našim čamcima.
      icon: tabler:package
    - title: Obnova i popravka
      description: Zamena tubusa, retrofitting elektronike i nadogradnje motora u našim prostorijama.
      icon: tabler:tool
    - title: Pravljenje po meri
      description: Dizajn po projektu za komercijalne, naučne i vojne korisnike.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Diskusija o dizajnu i inženjerstvu čamaca
steps2_values:
  title: Naše vrednosti
  subtitle: Tri principa koja su oblikovala svaki proizvod od prvog dana.
  items:
    - title: Pravi kao da prevozi tvoju porodicu
      description: Svaki trup, zavar i pričvršćivač tretirani su kao da će ih koristiti naše vlastite porodice.
      icon: tabler:heart
    - title: Inženjeri pre nego što prodamo
      description: Ako je specifikacija pogrešna, menjamo specifikaciju — nikada kupca.
      icon: tabler:settings
    - title: Podrška koja nadmašuje garanciju
      description: Trupi stare dvadeset godina i dalje nas kontaktiraju za rezervne delove, i mi i dalje odgovaramo.
      icon: tabler:headset
steps2_milestones:
  title: Prekretnice
  subtitle: Kratka verzija priče Paddle Board Overstock.
  isReversed: true
  items:
    - title: Osnovano u radionici na obali
      description: Pokrenuto od strane dva brodograđevna arhitekta sa CNC mlinom i tvrdoglavom idejom.
      icon: tabler:building-factory
    - title: Prvih 1.000 isporučenih trupova
      description: Postignuto u našoj sedmoj godini, uglavnom preko usmenih preporuka i ponovnih kupaca.
      icon: tabler:circle-check
    - title: Program međunarodnog izvoza
      description: Sada isporučujemo u 50+ zemalja sa lokalnim partnerima za podršku na pet kontinenata.
      icon: tabler:world
    - title: Nova globalna operativna struktura
      description: U septembru 2026, operacije brenda prebačene su iz Qingdao Vatrad Grupe u Weihai Dongjilian Co., Ltd. (New Mexico, SAD); proizvodni centar u Qingdau nastavlja sa istraživanjem i razvojem, proizvodnjom i direktnim izvoznim isporukama iz fabrike.
      icon: tabler:building-skyscraper
features2_locations:
  title: Naše lokacije
  tagline: Pronađite nas
  columns: 3
  items:
    - title: Kancelarija i radionica
      description: Industrijski park na obali, zgrada 4 — otvoreno pon–pet uz prethodnu najavu.
    - title: EU servisni centar
      description: Mediteranska luka — remont, popravka i podrška sa garancijom za evropske kupce.
    - title: APAC partnerska mreža
      description: Odobreni servisni partneri u Australiji, Japanu, Singapuru i Hong Kongu.
brand_hub_tagline: Brend
brand_hub_title: Istražite naš brend
brand_hub_subtitle: Uronite dublje u naše iskustvo u pomorskom inženjerstvu, globalnoj prisutnosti i principima koji nas pokreću.
brand_hub_cards:
  - title: Pomorsko iskustvo
    desc: Decenije nauke o materijalima, precizne proizvodnje i realnog testiranja — od proizvodnje PVC/Hypalon do dizajna dubokoveknog V-trupa i drop-stitch tehnologije.
    link: /brand-marine-expertise
    link_label: Saznajte više →
  - title: Globalna prisutnost
    desc: Isporuka u 50+ zemalja iz naše fabrike u Qingdau uz ovlašćene servisne partnere širom Evrope, Azijsko-pacifičkog regiona i Amerike.
    link: /brand-global-presence
    link_label: Saznajte više →
  - title: Zašto Paddle Board Overstock
    desc: Vertikalna integracija, dvostruka sertifikacija (ISO 9001 + BSCI), CE usklađenost i nizak MOQs — napravljeno za brendove, distributere i državne agencije.
    link: /brand-why-paddleboardoverstock
    link_label: Saznajte više →
production_section:
  tagline: Izvrsnost u proizvodnji
  title: Osiguravanje izuzetne izrade
  description: Paddle Board Overstock proizvodna linija je posvećena proizvodnji visokokvalitetnih, izdržljivih i visokoperformansnih proizvoda na naduvavanje.
  cards:
    - title: Iskusan tim tehničara
      items:
        - Profesionalno znanje o PVC, Hypalon i morskim materijalima
        - Precizna izrada u sečenju, lepljenju i montaži dodataka
        - Kontinuirana obuka za savladavanje najnovijih proizvodnih tehnologija
    - title: Napredna proizvodna oprema
      items:
        - CNC oprema za sečenje za precizno rezanje tkanine uz minimalnu grešku
        - Visokoprecizno lepljenje toplotom/hladno za vazdušno nezavisan, izdržljiv šav
        - Profesionalna oprema za testiranje nepropusnosti i zatezanja
    - title: Zreli sistem upravljanja
      items:
        - Standardizovani proizvodni procesi sa jasnim standardima kvaliteta
        - Filozofija vitke proizvodnje koja smanjuje otpad i poboljšava efikasnost
        - Efikasno upravljanje lancem snabdevanja uz pouzdana partnerstva sa dobavljačima
    - title: Stroga kontrola kvaliteta
      items:
        - sertifikovani sistem upravljanja kvalitetom
        - 'Višestepena inspekcija: sirovina, u toku procesa, konačni izlaz'
        - Strogo testiranje nepropustljivosti i izdržljivosti pre slanja
global_ops_section:
  tagline: Globalna operativna arhitektura
  title_html: Jedan brend,<span class="text-white/90">dva čvorišta</span>
  description_html: Od septembra 2026. godine, Paddle Board Overstock je u vlasništvu<strong class="text-white">Paddle Board Overstock DOO</strong>(New Mexico, SAD) — globalna kompanija za distribuciju, komercijalnu B2B prodaju, ugovore, fakturisanje i posleprodajnu podršku. Istraživanje i razvoj, proizvodnja i kontrola kvaliteta ostaju u<strong class="text-white">Paddle Board Overstock Proizvodni centar Qingdao</strong>, koja šalje svaku porudžbinu direktno iz fabrike, FOB Qingdao. Promena nije uticala na to ko pravi vaš brod, već ko potpisuje vaš ugovor.
  stats:
    - value: 2,400+
      label: Trupovi isporučeni globalno
    - value: 50+
      label: Zemlje izvozile
    - value: 10+
      label: Godine proizvodnje
