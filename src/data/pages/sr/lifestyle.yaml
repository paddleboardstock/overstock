hero:
  tagline: Životni stil
  title: Paddle Board Overstock<br />Životni stil
  subtitle: Pravljeno za one koji žive na vodi — od vikend istraživača do komercijalnih operatera koji se svakodnevno oslanjaju na svoju opremu.
values:
  - icon: 🌊
    title: Rođeno na Vodi
    desc: Svaki dizajn počinje razumevanjem kako se voda ponaša. Inženjerski pristup gradimo od ivice uslova ka unutra — jer je okean naš učitelj, a ne naše radno mesto.
  - icon: 🔧
    title: Dizajnirano da Traje
    desc: Najodrživiji proizvod je onaj koji ne treba zamenjivati. Materijali morske klase, drop-stitch jezgra ocenjena do 15 PSI, i šavovi koji nadmašuju sezonu.
  - icon: 🏆
    title: Pristupačno Po Dizajnu
    desc: Vodeni sportovi ne bi trebalo da budu luksuz. Profesionalni performansi po ceni koja ima smisla za porodice, vodiče i male operatore — ne samo za komercijalne flote.
  - icon: 🌍
    title: Globalna zajednica
    desc: 'Od obale Qindaoa do jezera u Evropi, reka u Jugoistočnoj Aziji, i zaliva u Americi — naši kupci dele jednu stvar: ljubav prema boravku na vodi.'
  - icon: ♻️
    title: Odgovorna Proizvodnja
    desc: CNC-optimizovane ulegnute preseke smanjuju otpad materijala ispod 5%. Trajna konstrukcija smanjuje cikluse zamene. Pravimo za dugovečnost jer je to najodrživiji izbor.
  - icon: 🤝
    title: Podrška Koja Traje
    desc: Dvadestogodišnji trupovi i dalje nas zovu za rezervne delove. Naš prosek odgovora na garanciju je 24 sata. Ne nestajemo nakon prodaje — tu smo za ceo vek trajanja proizvoda.
