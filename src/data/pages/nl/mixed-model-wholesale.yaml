who_benefits:
  tagline: Wie kan profiteren
  title: Voor wie wholesale met gemengd model is
  items:
    - title: Eerstekeerimporteurs
      description: Het testen van de SUP categorie met een spreiding van modellen in plaats van zich te verbinden aan één bulk SKU.
    - title: Seizoensgebonden strandwinkeliers
      description: Winkels die beginnersborden voor toeristen en premiumedities voor lokale klanten nodig hebben — in dezelfde herbevoorradingsbestelling.
    - title: Online verkopers
      description: Meerdere modellen tegelijk op een rij zetten om te leren welk kunstwerk, welke lengte en welk gebruik het beste converteert.
    - title: Verhuurfleets & Scholen
      description: Vloten die verschillende boardmaten nodig hebben voor verschillende rijdersgewichten en lestypen, niet een vloot met één specificatie.
faq_section:
  title: Veelgestelde vragen over gemengd model
  items:
    - q: Is er een minimale hoeveelheid per model?
      a: Nee. Het minimum van 5 borden geldt voor de totale bestelling, niet voor elk model. Je zou 5 verschillende modellen kunnen bestellen, één bord van elk.
    - q: Verandert het mengen van modellen de prijs?
      a: Groothandelsprijs per eenheid wordt per model vermeld, maar uw prijsklasse verbetert met het totale aantal borden — het mixen van modellen wordt niet bestraft.
    - q: Kan ik boards en accessoires mixen?
      a: Ja — extra peddels, pompen en reparatiesets kunnen aan een gemengde bestelling worden toegevoegd. Vraag ernaar in uw aanvraag.
    - q: Hoe weet ik welke modellen bij mijn markt passen?
      a: Stuur ons een bericht over uw klanten (aan de kust of in het binnenland, toeristen of lokaal, beginners of rijders) in het aanvraagformulier en wij zullen een mix aanbevelen.
