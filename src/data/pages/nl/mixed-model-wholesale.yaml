hero:
  tagline: Gemengde model groothandel
  title: Mixed Model Wholesale Paddle Boards —<br />Mix verschillende SUP modellen in één volgorde
  subtitle: Waarom zou je je budget vastzetten aan één model? Combineer alle op voorraad zijnde SUP boards — allround-, touring-, surf- en artedities — in één groothandelsbestel, met een totaal van slechts 5 boards.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Een gemengde volgorde van verschillende opblaasbare SUP printmodellen van Paddle Board Overstock
direct_answer: Gemengde model groothandel stelt een kleine retailer in staat meerdere verschillende SUP modellen in één geconsolideerde zending te bestellen in plaats van een bulkhoeveelheid van één enkel karton. Bij Paddle Board Overstock, kunnen alle op voorraad zijnde modellen worden gecombineerd, het bestelminimum is 5 borden in totaal en bepaalt de totale hoeveelheid de prijsklasse. Gemengde bestellingen worden vanuit Weihai, China verzonden per express luchtvracht (1–3 borden) of geconsolideerde zeevracht (5–20 borden) naar 50+ landen, en elke plank wordt 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Meng alle op voorraad SUP bestaande modellen in één volgorde — geen minimale per model
  - De totale bestelhoeveelheid (niet per model) bepaalt je prijsniveau
  - Begin met in totaal 5 boards — gebouwd voor kleine retailers, niet voor containerladingen
  - 'Eén geconsolideerde zending: één vrachtkosten, één douaneafhandeling, één levering'
why_mixed:
  tagline: Waarom gemengd?
  title: Mix & Match. Koop meer variatie. Geef minder uit.
  subtitle: Een plank met identieke boards bedient één soort peddel. Een gemengde bestelling verandert hetzelfde budget in een volledige productlijn.
  items:
    - title: Meer variatie op je plank
      description: Combineer allround boards voor beginners, touring boards voor avonturiers en surfstyle boards voor rijders — één bestelling dekt je hele klantenbestand.
    - title: Lager risico per model
      description: In plaats van je seizoen op één model te zetten, bestel je 2–4 van elk. Als één model de rest overtreft, vul het dan bij de volgende bestelling aan met echte verkoopgegevens.
    - title: Test wat in jouw markt verkoopt
      description: Elk strand, meer en elke stad heeft een andere vraag. Een gemengde eerste bestelling is het goedkoopste marktonderzoek dat er is — verkoop zes modellen, kijk welke bewegen.
    - title: Betere marges op kunstedities
      description: Premium art-serie boards (Leviathan Wake, Medusa Glow, Ocean Voyager) hebben hogere verkoopcijfers. Meng er een paar in een basis van allround boards om je gemiddelde marge te verhogen.
    - title: Eén geconsolideerde zending
      description: Eén gemengde bestelling betekent één vrachtboeking, één douaneafhandeling en één levering — in plaats van vijf afzonderlijke zendingen van vijf verschillende leveranciers.
how_it_works:
  tagline: Hoe het werkt
  title: Hoe een gemengde modelvolgorde werkt
  steps:
    - title: Kies je mix
      description: Kies de modellen en aantallen voor jouw markt — of gebruik de selector hieronder om een combinatie te ontwerpen en de update van het aantal borden en de totale waarde live te bekijken.
    - title: Vraag een offerte aan
      description: Stuur ons de mix. Wij bevestigen de huidige voorraad voor elk model en offerte-eenheid, plus express- en zeevrachtopties naar uw land.
    - title: Bevestig het bevel
      description: Goedkeur de definitieve offerte — modellen, aantallen, vracht, totaal. We reserveren de voorraad en plannen verzending vanuit Weihai.
    - title: We Testen Elke Plank
      description: Elke plank in uw gemengde bestelling wordt 100% drukt getest tot 15 PSI voordat deze wordt verpakt — dezelfde standaard voor elk model, of het nu een instap allrounder of een kunsteditie is.
    - title: Eén Levering aan Uw Deur
      description: De volledige gemengde bestelling wordt samen verzonden — expres luchtvracht voor kleine bestellingen, geconsolideerde zeevracht voor 5–20 planken — met tracking van deur tot deur.
