breadcrumb: OEM/ODM-fabrikant
tldr:
  summary: Paddle Board Overstock is een OEM/ODM-fabrikant die direct vanuit de fabriek levert. Faciliteit van 12.000 m² met ISO 9001:2015-certificering, jaarlijkse productie van 15.000 eenheden, CE/BSCI/REACH/UKCA-naleving, lage MOQ’s vanaf 2-10 eenheden.
  points:
    - Fabriek in Qingdao van 12.000 m², ISO 9001:2015-gecertificeerd
    - Jaarlijkse capaciteit van 15.000 eenheden met 200-300 geschoolde werknemers
    - Naleving van CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Lage MOQ’s: 2-5 eenheden (RIB), 5-10 eenheden (SUP) voor standaardmodellen'
    - Export naar 50+ landen met FOB Qingdao-verzending
