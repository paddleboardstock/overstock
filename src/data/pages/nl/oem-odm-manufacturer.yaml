process_section:
  eyebrow: Ons proces
  title: End-to-end OEM/ODM-workflow
  subtitle: Van ontwerpbrief tot containerladen — zes stappen naar uw opblaasbare vaartuig onder eigen label.
  steps:
    - step: '01'
      title: Specificatie & ontwerpbrief
      desc: Deel uw doelspecificaties, CAD-tekeningen of een referentieproduct. Ons engineeringteam beoordeelt materialen, afmetingen en nalevingseisen (CE, BSCI) vóór offrering.
    - step: '02'
      title: 3D-maal-prototyping
      desc: Wij ontwerpen en CNC-bewerken op maat gemaakte mallen voor SUP-boards, kajakrompen en RIB-componenten. Prototypemonsters worden binnen 15-20 werkdagen geproduceerd voor uw goedkeuring.
    - step: '03'
      title: Materiaalkeuze & monsterproductie
      desc: Kies uit PVC van militaire kwaliteit (0,9-1,2 mm), Hypalon CSM of drop-stitch kernstoffen. Wij produceren pre-productiemonsters in uw merkkleuren, logo en verpakking voor definitieve goedkeuring.
    - step: '04'
      title: CE-fabrieksaudit & naleving
      desc: Elke OEM-order bevat nalevingsdocumentatie — CE-conformiteitsverklaring, ISO 9001-traceerbaarheidsrecords, BSCI-sociale nalevingsrapport en REACH-materiaalverklaringen.
    - step: '05'
      title: Massaproductie & inline kwaliteitscontrole
      desc: Productieruns volgen onze 100-punten kwaliteitschecklist. Elke eenheid ondergaat 24-uurs drukbehoudtests, naadpelingtests en visuele inspectie vóór verpakking.
    - step: '06'
      title: FOB Qingdao-logistiek & verzending
      desc: Klaargeproducten worden gepalletiseerd, folieverpakt en in containers geladen in de haven van Qingdao. Wij verzorgen alle exportdocumentatie, douaneafhandeling en bieden realtime zendingtracking.
capabilities_section:
  eyebrow: Productiemogelijkheden
  title: Wat wij bouwen
  subtitle: Zes kernproductiemogelijkheden voor wereldwijde B2B-partners.
  items:
    - title: Drop-stitch SUP-boardproductie
      desc: Full-length drop-stitch-kernlaminatie voor stijve, hogedruk- (15-20 PSI) stand-up paddle boards. Aangepaste lengte, breedte, dikte, rockerprofiel en grafisch ontwerp.
    - title: Productie van opblaasbare PVC-boten
      desc: Hoogfrequent gelaste PVC sloepen, tenders en sportboten. Meerdere kamerverdelingen, vloeropties (lat, luchtdesk, oprolbaar) en accessoire-integratie.
    - title: Hypalon RIB-fabricage
      desc: Commerciële Hypalon CSM-buizen gebonden aan glasvezel- of aluminium diepe-V-rompen. Lengtes van 3,3 m tot 6,0 m voor patrouille-, reddings-, tour- en duikoperaties.
    - title: Private label & custom branding
      desc: 'Volledige private-labelservice: aangepast logo in warmtransfer of zeefdruk, merkartikelverpakking (winkelboxen, draagtassen), gebruikershandleidingen in uw taal en barcode/UPC-registratie.'
    - title: Custom mal- & gereedschapsontwerp
      desc: Eigen 3D CAD/CAM-engineeringteam. Wij ontwerpen en vervaardigen op maat gemaakte aluminium en composiet mallen voor unieke rompvormen, dekconfiguraties en accessoire-bevestigingspunten.
    - title: OEM-accessoires & kitting
      desc: Zwemvesten (CE 12402), dubbelwerkende pompen, carbon/nylon peddels, reparatiesets, draagtassen en leashsets. Volledige kitting en bundelverpakking voor verkoopklare presentatie.
experience_section:
  eyebrow: Praktijkervaring
  title: Partnerschappen die merken hebben gebouwd
  subtitle: Echte verhalen van merken en organisaties die voor Paddle Board Overstock als OEM/ODM-fabrikant kozen.
  stories:
    - quote: We kwamen bij Paddle Board Overstock met een schets op een servet en een lijst met eisen. Acht maanden later hadden we een productieklaar product dat de CE-certificering in één keer doorstond.
      narrative: Een Europese startup met een vernieuwend SUP-ontwerp benaderde Paddle Board Overstock voor ODM-productie. Het R&D-team van Paddle Board Overstock begeleidde het concept door CAD-ontwerp, FEA-structuuranalyse, hydrodynamische simulatie, malcreatie, prototypefabricage en productiegereedschap. De oprichter van de startup bezocht Qingdao drie keer tijdens het proces. Het eindproduct doorstond de CE-certificering zonder enige modificatie — een resultaat dat de oprichter toeschrijft aan het feit dat het engineeringteam van Paddle Board Overstock de Europese regelgevende eisen vanaf het begin begreep.
      context: Europese SUP-merklancering, 2023-2024
      source: Merkoprichter
    - quote: Het niveau van NDA-bescherming en IP-veiligheid bij Paddle Board Overstock geeft ons het vertrouwen om onze gepatenteerde ontwerpen te delen. Ze behandelen onze IP alsof het hun eigen is.
      narrative: Een Amerikaans bedrijf in scheepsuitrusting met gepatenteerde kleptechnologie zocht een productiepartner die hun IP kon beschermen en op schaal kon produceren. Na audit van vijf Chinese fabrikanten kozen ze voor Paddle Board Overstock vanwege de IP-beschermingsprotocollen van de fabriek, de veilige omgang met ontwerpbestanden en de bereidheid strikte NDA’s te tekenen. Het partnerschap heeft in vier jaar drie productlijnen opgeleverd zonder enig IP-incident.
      context: Amerikaans bedrijf in scheepsuitrusting, OEM-partnerschap sinds 2021
      source: VP Operaties
