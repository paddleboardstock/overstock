hero:
  tagline: Kennisgrafiek
  title: Waterverkenningskennis
  subtitle: |
    Een gestructureerde kennisbank over opblaasbare SUP-technologie,<br />
    waterveiligheid, board-engineering en avonturenplanning.
  taglineSection: Verken. Leer. Ga met vertrouwen.
clusters:
  tagline: Kennisclusters
  title: Verken op onderwerp
  subtitle: Diepgaande analyses van de technologie, veiligheid en vaardigheden achter elk Paddle Board Overstock-product.
  items:
    - title: SUP Kennis
      description: Van het kiezen van je eerste board tot geavanceerde toertochten — alles over stand-up paddleboarden.
      icon: tabler:lifebuoy
      topics:
        - Hoe kies je je eerste opblaasbare SUP
        - Beste SUP maat voor beginners
        - Hoe moeilijk is suppen?
        - Opblaasbaar versus hardboard vergelijking
        - SUP veiligheidschecklist
    - title: Bordtechnologie
      description: Technische diepgaande analyses van drop-stitch-cores, PVC-laminaten, rails en kleppen — hoe opblaasbare SUPs worden ontworpen.
      icon: tabler:anchor
      topics:
        - Hoe opblaasbare SUPs worden gemaakt
        - PVC laminaatlagen uitgelegd
        - Rail- en naadconstructie
        - Drop-stitch technologie diepgaande verkenning
        - EVA deckkunst uitgelegd
    - title: Veiligheidskennis
      description: Essentiële veiligheidskennis voor elke peddelaar — van PFD-selectie tot weersvoorspelling en zelfreddingstechnieken.
      icon: tabler:shield
      topics:
        - SUP veiligheidschecklist
        - Heb je een reddingsvest nodig?
        - Gids voor veilig peddelen op zee
        - Rivier- en stroomveiligheid voor peddelaars
        - Weer- en waterconditiebewustzijn
    - title: Technologie
      description: De techniek achter Paddle Board Overstock-producten — materialen, constructiemethoden en kwaliteitscontrole.
      icon: tabler:microscope
      topics:
        - Marine-grade PVC technologie
        - Drop-stitch kern uitgelegd
        - Waarom PSI belangrijk is voor opblaasbare SUPs
        - RF-lassen versus lijmbinding
        - Kwaliteitstesten op elk board
    - title: Club- & Verhuurkennis
      description: Praktische handleidingen voor het runnen van een SUP-programma — van verhuuractiviteiten tot resort- en clubvloten.
      icon: tabler:briefcase
      topics:
        - Hoe u een verhuurbedrijf van SUP start
        - Het bouwen van een watersportcentrum
        - Maatvoering van de paddleboardvloot voor clubs
        - Opblaasbaar versus hard SUP voor commercieel gebruik
        - Beste SUP boards voor verhuurvloten
        - Inkomstenstrategieën voor watersportresorts
        - Onderhoudsgids voor commerciële apparatuur
