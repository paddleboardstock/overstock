hero:
  tagline: Kennisgraaf
  title: Waterverkenning Kennis
  subtitle: |
    Een gestructureerde kennisbank over opblaasbare SUP-technologie,<br />
    waterveiligheid, boottechniek en avonturenplanning.
  taglineSection: Verken. Leer. Ga met vertrouwen.
clusters:
  tagline: Kennisclusters
  title: Verken op onderwerp
  subtitle: Diepgaande duiken in de technologie, veiligheid en vaardigheden achter elk Aquafarer product.
  items:
    - title: SUP Kennis
      description: Van het kiezen van je eerste board tot geavanceerde touringtechnieken — alles over stand-up paddle boarding.
      icon: tabler:lifebuoy
      topics:
        - Hoe kies je je eerste opblaasbare SUP
        - Beste SUP maat voor beginners
        - Hoe moeilijk is paddle boarding?
        - Opblaasbaar vs hardboard vergelijking
        - SUP veiligheidschecklist
    - title: Boot Kennis
      description: Technische gidsen over opblaasbare boten, RIBs, bijboten en kajaks — techniek, materialen en bediening.
      icon: tabler:sailboat
      topics:
        - Types opblaasbare boten uitgelegd
        - PVC vs Hypalon vergelijking
        - RIB vs Bijboot vergelijking
        - Drop-stitch technologie verdieping
        - Mariene materiaalkunde gids
    - title: Veiligheid Kennis
      description: Essentiële veiligheidskennis voor elke peddelaar — van PFD-keuze tot weerslezen tot zelfreddingstechnieken.
      icon: tabler:shield
      topics:
        - SUP veiligheidschecklist
        - Heb je een zwemvest nodig?
        - Oceaan peddelen veiligheidsgids
        - Rivierveiligheid voor opblaasbare kajaks
        - Weer- en waterconditiebewustzijn
    - title: Technologie
      description: De techniek achter Aquafarer producten — materialen, constructiemethoden en kwaliteitstesten.
      icon: tabler:microscope
      topics:
        - Marine-grade PVC technologie
        - Drop-stitch kern uitgelegd
        - Waarom PSI belangrijk is voor opblaasbare SUPs
        - RF-lassen vs adhesieve verbinding
        - Kwaliteitstesten en certificering
    - title: Business Knowledge
      description: Commerciële handleidingen voor het opbouwen en opschalen van uw watersportbedrijf – van verhuuractiviteiten tot private label branding.
      icon: tabler:briefcase
      topics:
        - Hoe u een verhuurbedrijf van SUP start
        - Het bouwen van een watersportcentrum
        - Maatvoering van de paddleboardvloot voor clubs
        - Opblaasbaar versus hard SUP voor commercieel gebruik
        - Beste kajakmateriaal voor verhuurvloten
        - Het starten van een private label watermerk
        - Inkomstenstrategieën voor watersportresorts
        - Onderhoudsgids voor commerciële apparatuur
