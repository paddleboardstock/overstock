direct_answer: levert Paddle Board Overstock gloednieuwe overtollige opblaasbare SUP boards aan Zuid-Afrikaanse bedrijven — winkels en scholen in Kaapstad, Durban en langs de Garden Route, verhuurbedrijven en online verkopers. Groothandelsbestellingen beginnen bij 5 boards met gemengde modellen in één zending, verzonden vanuit Weihai, China per express luchtvracht of geconsolideerde zeevracht. Elke board wordt 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Groothandel vanaf 5 boards — gemengde modellen, geprijsd op totale hoeveelheid
  - Bedienen Afrika's meest gevestigde retailmarkt voor boardsporten
  - Expresslucht of geconsolideerde zeevracht vanuit Weihai, China
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De Zuid-Afrikaanse SUP Markt
  paragraphs:
    - Zuid-Afrika heeft de meest volwassen boardsportmarkt van het continent. Kaapstad combineert wereldklasse downwind-runs en platwaterlagunes met een diepe surfcultuur; Durban heeft het hele jaar door warmwaterstranden; de knysna-lagunes en Plettenbergbaai van de Garden Route zijn gemaakt voor recreatief peddelen. Een goed gevestigde winkelinfrastructuur en een echte lokale peddelgemeenschap — van SUP surfers tot vlakwater-fitnesspeddelaars — onderscheiden deze markt.
    - Buyers here are seasoned: Surfwinkels met echte winkelvloeren, peddelscholen met vloten, en avontuurlijke operators gecombineerd SUP met kajak- en fietstochten. Ze evalueren uitrusting als professionals — constructie, garantie en reparatie — en bestellen in kleine, bewuste batches van 5–20 planken, waarbij ze huurkwaliteit allrounders combineren met premium edities voor de winkelwand.
  customer_types:
    - title: Surf- en Paddle-winkels
      description: Gevestigde winkels in Kaapstad en Durban voegden of breidden SUP lijnen toe voor de lokale peddelgemeenschap.
    - title: Paddlescholen & verhuur
      description: Scholen en huurvloten op lagunes en kalme stranden, verfrissend borden op een echte vervangingscyclus.
    - title: Avonturenoperatoren
      description: Garden Route- en Western Cape-exploitanten voegen SUP toe aan het multi-activiteit avontuuraanbod die worden aangebied.
shipping_section:
  title: Schip naar Zuid-Afrika
  paragraphs:
    - Bestellingen worden verzonden vanuit Weihai, China. Express luchtvracht vervoert monsters en 1–3 boardorders naar Johannesburg en Kaapstad; Consolidated Sea Freight bedient 5–20 board groothandelsbestellingen via Durban, Kaapstad en andere havens. Transitschattingen voor uw bestemming zijn opgenomen in uw offerte.
    - Wij leveren de benodigde commerciële facturatie en verpakkingslijst, met de juiste HS-codes en aangegeven waarden. Invoerrechten en btw worden door de importeur betaald volgens Zuid-Afrikaanse regels.
  customs_note: SARS-clearance is documentatiegericht — bevestig de huidige belasting en btw-behandeling voor opblaasbare sportuitrusting met uw clearing agent voordat u bestelt. Wij leveren volledige, consistente papieren en reageren snel op verzoeken van makelaars.
faq_section:
  title: Zuid-Afrika FAQ
  items:
    - q: Passen de boards bij de gemengde omstandigheden in Kaapstad?
      a: Ja. Allround modellen kunnen lagunevlakte wateren en kalme kustdagen aan, en het assortiment omvat touring-gerichte boards voor langere peddels. Voor open oceaan met de wind afgeleide routes moeten ervaren peddelaars hun specifieke gebruikssituatie met ons bespreken voordat ze bestellen.
    - q: Hoe ziet een winkelbestelling eruit?
      a: 'Typisch 5–20 borden: een basis van allround modellen voor lessen en verhuur, plus premium kunstedities voor de winkelwand — gemengde modellen, één zending, geprijsd op totale hoeveelheid.'
    - q: Hoe wordt vracht geofferd aan Zuid-Afrika?
      a: Luchtvracht naar Johannesburg of Kaapstad voor monsters en kleine bestellingen; geconsolideerde zeevracht naar Durban of Kaapstad voor groothandelsvolumes. Beide worden gespecificeerd in uw offerte met geschatte transittijden.
    - q: Wie regelt invoerrechten en BTW?
      a: U, als importeur, via uw douane-expediteur volgens de regels van SARS. Wij leveren de commerciële factuur en paklijst met correcte HS-codes en aangegeven waarden.
