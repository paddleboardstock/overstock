testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Eigenaar, Algarve Surf Academy
    location: Lissabon, Portugal
    content: We zijn begonnen met het Club Starterpakket voor onze surfschool. 20 boards, peddels, vesten - alles arriveerde binnen 3 weken. Na twee seizoenen hebben we geüpgraded naar het Pro-pakket. De aangepaste branding met ons logo was een gamechanger voor ons professionele imago.
    rating: 5
    product: Clubstartpakket
    source: solutions/clubs
  - category: clubs
    name: Club-eigenaar
    title: Watersportclub
    location: Phuket, Thailand
    content: Het Club Starter Package was het perfecte startpunt. Naarmate ons bedrijf groeide, groeide Paddle Board Overstock met ons mee — dezelfde kwaliteit, dezelfde prijzen, geen verrassingen. We schaalden van 10 naar 80 boards in 18 maanden.
    rating: 5
    product: Clubstarter + Premiumpakket
    source: success-stories
  - category: resorts
    name: Algemeen resortmanager
    title: 5-sterren strandresort
    location: Griekenland
    content: Paddle Board Overstock leverde niet alleen boards — ze hielpen ons een complete gastbeleving op te bouwen. Ons watersportprogramma ging van nul naar een hoogtepunt van het resort in één seizoen. 300+ wekelijkse boekingen en $180K aan jaarlijkse omzet.
    rating: 5
    product: Resort Premium-pakket
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Directeur gastervaring, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock ontwierp en rustte ons hele strandactiviteitenprogramma uit over drie resortlocaties. 120 SUPs, veiligheidsinfrastructuur en personeelstraining — allemaal geleverd in één zending. Het aantal deelnemende gasten steeg met 60% in het eerste seizoen.
    rating: 5
    product: Resort Premium-pakket
    source: solutions/resorts
  - category: rental
    name: Daniël Okonkwo
    title: Eigenaar, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Ik huurde 5 boards van een lokale winkel en verloor 60% van mijn inkomsten aan hen. Paddle Board Overstock hielp me mijn eigen vloot van 15 SUPs op te bouwen. De ROI calculator liet zien dat ik in 4 maanden break-even zou draaien — het duurde 3. Nu breid ik uit naar 30 boards.
    rating: 5
    product: Vlootstartpakket
    source: solutions/rental-business
  - category: rental
    name: Marco Valentini
    title: Operationeel directeur, Adriatic Adventure Tours
    location: Dubrovnik, Kroatië
    content: We hebben onze hele SUP verhuurvloot uitgerust met Paddle Board Overstock boards — 30 boards verspreid over drie locaties. Twee seizoenen lang geen enkel falen. De consistente kwaliteit over elke batch maakte onze keuze makkelijk, en hun team paste zelfs de kleuren aan onze merkstijl aan.
    rating: 5
    product: Verhuurfleetpakket
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Eigenaar, Lake Garda SUP Rentals
    location: Lago di Garda, Italië
    content: Onze verhuurboards gaan vijf keer per dag de deur uit in het hoogseizoen. Sinds de overstap naar Paddle Board Overstock zijn de klachten over schade vrijwel tot nul gedaald, en klanten vragen steeds waar ze hun eigen board kunnen kopen.
    rating: 5
    product: Verhuurfleetpakket
    source: solutions/rental-business
  - category: consumers
    name: Sara K.
    title: Eerste SUP-eigenaar
    location: Lake Tahoe, VS
    content: Stabiel, zelfs voor een complete beginner. Ik heb hem de eerste dag mee het meer op genomen en ben nooit gevallen. Door het complete pakket met pomp en peddel stond ik 20 minuten na het openen van de doos al op het water.
    rating: 5
    product: SUP-verkenner 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 Eigenaar
    location: Vancouver, Canada
    content: Als eerste koper was ik nerveus om uit het buitenland te bestellen. De bouwkwaliteit sprak voor zich op het moment dat ik het uitpakte — stijf, foutloze naden, en het arriveerde in slechts 6 dagen.
    rating: 5
    product: SUP-verkenner 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Weekendpeddelaar
    location: Florida, VS
    content: Solide bouwkwaliteit. Kan veel beter met kusthakselen omgaan dan ik van een opblaasboot had verwacht. Ik stopte hem in de kofferbak van mijn auto voor een weekendje weg – in minder dan 4 minuten opgeblazen bij de oprit.
    rating: 5
    product: SUP Tropische Bries
