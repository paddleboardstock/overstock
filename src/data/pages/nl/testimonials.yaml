testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Eigenaar, Algarve Surf Academy
    location: Lagos, Portugal
    content: We zijn begonnen met het Club Starterpakket voor onze surfschool. 20 boards, peddels, vesten - alles arriveerde binnen 3 weken. Na twee seizoenen hebben we geüpgraded naar het Pro-pakket. De aangepaste branding met ons logo was een gamechanger voor ons professionele imago.
    rating: 5
    product: Clubstartpakket
    source: solutions/clubs
  - category: clubs
    name: Club-eigenaar
    title: Watersportclub
    location: Phuket, Thailand
    content: 'Het Club Starterspakket was de perfecte instap. Naarmate ons bedrijf groeide, groeide Paddle Board Overstock met ons mee: dezelfde kwaliteit, dezelfde prijzen, geen verrassingen. We zijn in 18 maanden tijd opgeschaald van 10 naar 80 boards.'
    rating: 5
    product: Clubstarter + Premiumpakket
    source: success-stories
  - category: Resorts
    name: Algemeen resortmanager
    title: 5-sterren strandresort
    location: Griekenland
    content: Paddle Board Overstock heeft niet alleen boards geleverd; ze hebben ons geholpen een complete gastervaring op te bouwen. Ons watersportprogramma ging in één seizoen van nul naar resorthoogtepunt. Meer dan 300 wekelijkse boekingen en een jaarlijkse omzet van $ 180.000.
    rating: 5
    product: Resort Premium-pakket
    source: success-stories
  - category: Resorts
    name: Sophie Laurent
    title: Directeur gastervaring, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock ontwierp en rustte ons volledige strandactiviteitenprogramma uit in drie resorts. 80 SUP's, 40 kajaks, veiligheidsinfrastructuur en training van het personeel - alles geleverd in één zending. De gastparticipatie steeg in het eerste seizoen met 60%.
    rating: 5
    product: Resort Premium-pakket
    source: solutions/resorts
  - category: ondernemers
    name: Michael Park
    title: Oprichter van Shoreline Paddle Co.
    location: Californië, VS
    content: Ik lanceerde mijn SUP-merk zonder enige ervaring in de sector. Het team van Paddle Board Overstock begeleidde mij van de productselectie tot het aangepaste logo-ontwerp en de verpakking. Mijn eerste container arriveerde binnen 11 weken en ik was binnen 3 maanden uitverkocht op Amazon.
    rating: 5
    product: Lancering van een startersmerk
    source: solutions/entrepreneurs
  - category: ondernemers
    name: Oprichter
    title: Australisch SUP-merk
    location: Australië
    content: 'Ik had het merkidee, maar geen productiekennis. Paddle Board Overstock hield mij letterlijk bij de hand tijdens het hele proces: van het kiezen van het juiste boardontwerp tot het uitpakken van mijn eerste zending. 90 dagen van droom tot levering.'
    rating: 5
    product: Merklanceringspakket
    source: success-stories
  - category: verhuur
    name: Daniël Okonkwo
    title: Eigenaar, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Ik huurde 5 boards bij een plaatselijke winkel en verloor 60% van mijn inkomsten aan hen. Paddle Board Overstock heeft me geholpen mijn eigen vloot van 15 SUP's te bouwen. De ROI-calculator toonde break-even in 4 maanden – het duurde 3. Nu breid ik uit naar 30 borden.
    rating: 5
    product: Vlootstartpakket
    source: solutions/rental-business
  - category: verhuur
    name: Marco Valentini
    title: Operationeel directeur, Adriatic Adventure Tours
    location: Dubrovnik, Kroatië
    content: "We hebben onze volledige verhuurvloot uitgerust met Paddle Board Overstock RIB's: twaalf boten verspreid over drie locaties. Twee seizoenen later, nul mislukkingen. De CE-certificeringsdocumentatie maakte de goedkeuring van verzekeringen naadloos. Hun technische team heeft zelfs de buiskleuren aangepast."
    rating: 5
    product: Vlootuitbreidingskit
    source: trust
  - category: verhuur
    name: Luitenant-commandant Andres Reyes
    title: Maritieme inkoopfunctionaris, Filippijnse kustwachthulp
    location: Manilla, Filippijnen
    content: "We exploiteren 24 Paddle Board Overstock RIB's in onze kustpatrouillevloot. Hun kwaliteitscontroleproces is consistent voor elke batch: elke keer dezelfde naadkwaliteit, dezelfde klepplaatsing en dezelfde drukwaarde. Die herhaalbaarheid is van belang als levens afhangen van de apparatuur."
    rating: 5
    product: RIB-patrouillevloot
    source: trust
  - category: consumenten
    name: Sara K.
    title: Eerste SUP-eigenaar
    location: Lake Tahoe, VS
    content: Stabiel, zelfs voor een complete beginner. Ik heb hem de eerste dag mee het meer op genomen en ben nooit gevallen. Door het complete pakket met pomp en peddel stond ik 20 minuten na het openen van de doos al op het water.
    rating: 5
    product: SUP-verkenner 11
  - category: consumenten
    name: James Thornton
    title: SUP Explorer 11 Eigenaar
    location: Vancouver, Canada
    content: Als eerste koper was ik zenuwachtig over kwaliteitsbestellingen uit het buitenland. De ISO-documentatie en de testrapporten van derden die ze deelden voordat ik erom vroeg, gaven me het volste vertrouwen. Het bord arriveerde binnen 6 dagen en overtrof mijn verwachtingen.
    rating: 5
    product: SUP-verkenner 11
    source: trust
  - category: consumenten
    name: Mike R.
    title: Recreatieve kajakker
    location: Florida, VS
    content: 'Solide bouwkwaliteit. Kan veel beter met kusthakselen omgaan dan ik van een opblaasboot had verwacht. Ik stop hem in de kofferbak van mijn auto voor een weekendje weg – in minder dan 4 minuten opgeblazen bij de oprit.'
    rating: 5
    product: Opblaasbare kajak
