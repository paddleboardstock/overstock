production_flow:
  tagline: Productieproces
  title: Van materiaal tot afgewerkte boot
  subtitle: Elke boot doorloopt 6 productiefasen met bij elke stap QC-controlepunten. Geen sluiproutes, geen overgeslagen inspecties.
  stages:
    - stage: '01'
      title: Materiaalontvangst en inkomende QC
      description: Alle binnenkomende materialen worden per batch/lotnummer geregistreerd in ons ERP-systeem. PVC stofrollen, drop-stitch-kernen, kleppen, lijmen en hardware worden in quarantaine geplaatst totdat de kwaliteitscontrole is afgerond.
      qc_check: Treksterkte (ASTM D751), scheurweerstand (ISO 4674), diktemeter, lijmviscositeit, visuele defectscan
      qc_threshold: 100% van de batches getest. Weigeren indien treksterkte < 90% van specificaties, scheur < spec min, of enig visueel defect
      responsibility: Inkomend QC-team (3 inspecteurs)
    - stage: '02'
      title: CNC-snijden en materiaalvoorbereiding
      description: Computergeoptimaliseerd nesten legt panelen op PVC voorraad om verspilling te minimaliseren. Automatische CNC-snijmachines behouden een positionele nauwkeurigheid van 0,1 mm.
      qc_check: Dimensionale controle aan de hand van CAD DXF-bestanden, inspectie van de randkwaliteit, verificatie van het aantal panelen
      qc_threshold: Elk 20e paneel gemeten. Tolerantie ±0,5 mm. Batch afwijzen als >2% buiten de tolerantie
      responsibility: Lood uit een werkplaats snijden
    - stage: '03'
      title: Lassen en drop-stitch-verbindingen
      description: Drop-stitch-kernen worden met behulp van hittelaminering aan buitenste PVC-laminaten gehecht. Buiskamers zijn RF-gelast of heteluchtgelast. Spoorbanden zijn drielaags door smelten gebonden.
      qc_check: Afpeltest elke 50 eenheden (ASTM D751), meting van de lasbreedte, beoordeling van het heteluchttemperatuurlogboek, visuele naadinspectie onder achtergrondverlichting
      qc_threshold: Afpelsterkte min. 8 N/cm. Lasbreedtetolerantie ±1 mm. Elke zichtbare channeling = afwijzen
      responsibility: Lassen QC (2 inspecteurs per ploegendienst)
    - stage: '04'
      title: Montage en uitrusting
      description: 'Boten gaan naar de eindmontage waar alle componenten aan elkaar worden gekoppeld: romp + buizen, kleppen geïnstalleerd, D-ringen, handgrepen, vinboxen en draagtasbevestiging. Elke eenheid volgt een montagechecklist van 100 punten.'
      qc_check: 100-punten checklist aftekening per eenheid, klepfunctietest (10 open/dicht-cycli), hardwarekoppelverificatie, visuele inspectie
      qc_threshold: 'Zero-defect-beleid op veiligheidskritische items (kleppen, D-ringen, handgrepen). Klein cosmetisch: AQL 2,5 (ISO 2859)'
      responsibility: Assemblageteamleider + lijn QC
    - stage: '05'
      title: Druktesten en kwaliteitsbehoud
      description: Elke kamer wordt opgeblazen tot 1,25 x nominale druk (doorgaans 20–25 PSI) en 24–48 uur vastgehouden. Druksensoren loggen continu. Kamers met een drukval van meer dan 5% worden afgewezen en voor herinspectie van de naden verzonden.
      qc_check: 24-uurs drukhoudlogboek, sensorkalibratie dagelijks geverifieerd, temperatuurgecompenseerde drukmeting, naadhertest na reparatie
      qc_threshold: Max. 5% drukval over 24 uur bij stabiele temperatuur. Elke kamer die dit overschrijdt = 100% hertest van de gehele productiebatch
      responsibility: Kwaliteitslab (onafhankelijk van productie, rapporteert aan management)
    - stage: '06'
      title: Laatste inspectie en verpakking
      description: Laatste visuele en functionele inspectie. Oppervlaktedefecten, kleurconsistentie, label-/BIN-verificatie, verpakkingsintegriteit en volledigheid van accessoires. Eenheden worden vacuümverpakt, in dozen gedaan en gepalletiseerd voor het laden van containers.
      qc_check: Volledige visuele inspectie, checklist voor accessoires per SKU, valtest van de verpakking (1 m, willekeurig monster), verificatie van de scan van labels/barcodes
      qc_threshold: AQL 2,5 voor grote gebreken, AQL 4,0 voor kleine gebreken. Nultolerantie op het gebied van veiligheidsgebreken. 100% van de eenheden visueel geïnspecteerd
      responsibility: Laatste QC-team (4 inspecteurs) + teamleider verpakking
