material_traceability:
  tagline: Traceerbaarheid
  title: Materiaaltracering en batchcontrole
  description: Aan elke partij grondstoffen wordt een uniek batchnummer toegewezen in ons ERP-systeem. Van aankomst tot productie en het eindproduct, de stuklijst van elk board verwijst terug naar de oorspronkelijke leveranciersbatch. Dit maakt volledige terugwaartse traceerbaarheid mogelijk voor elke kwaliteitsvraag.
  system: Aangepaste ERP (intern systeem) + fysieke batchtags op elke werkorder
  coverage: 100% van de productiematerialen — PVC, drop-stitch stof, EVA schuim, lijmen, kleppen, hardware, verpakking
  records_retained: 10 jaar
