  title: Personeel en expertise
  engineers: 25+
  engineers_detail: Ingenieurs op het gebied van R&D, matrijsontwerp, materiaallaboratorium en productietechniek. Gemiddeld 7+ jaar in de productie van opblaasbare producten.
  shift_pattern: 2 diensten/dag (07:00–15:30, 15:30–00:00). Optionele nachtdienst voor dringende bestellingen.
  training: Maandelijkse QC-training, driemaandelijkse veiligheidsoefeningen, jaarlijkse beoordeling van vaardigheden. Nieuwe medewerkers voltooien een introductieperiode van 40 uur voordat ze aan de productielijn gaan werken.
