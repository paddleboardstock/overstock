workshops_section:
  tagline: Werkplaatsen
  title: Productiewerkplaatsen
  workshops:
    - title: PVC Snijden en materiaalvoorbereiding
      description: Automatische CNC snijmachines PVC verwerken en drop-stitch stoffen met submillimeterprecisie. Computergeoptimaliseerd Snijwerk minimaliseert materiaalverspilling en zorgt ervoor dat elk paneel aan zijn afmetingen voldoet vóór het lassen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Lassen & Warmtedichting
      description: Speciale laswerkplaats met warmteafdichtingsmachines en RF-diëlektrische persen. Warmeluchtlassers verbinden en smelten drop-stitch kernlaminaten en railbanden samen, terwijl RF-lassen hoogsterke, luchtdichte naden produceren.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Deck Art & EVA Afwerking
      description: 'Art-series decks krijgen hier vorm: precisie-gesneden EVA schuimpanelen worden in full-deck patronen gelegd, met de hand gelijmd en bijgesneden voor een gripvolle, comfortabele en duurzame afwerking — het kenmerkende uiterlijk van elk art-series board.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Drukwerk & Decoratie
      description: SUP Borden worden versierd met digitale druk voor fullcolour graphics en zeefdruk voor logo's en herhalende patronen. Digitale drukkers produceren fotokwaliteit deckontwerpen, terwijl zeefdruk duurzame, levendige merkmerken levert.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Eindmontage & Tuigage
      description: Assemblagelijn waar de boards hun kleppen, D-ringen, handgrepen, vinnen en riembevestigingen ontvangen. Elke plank volgt een 100-punts montagechecklist die door de teamleider is goedgekeurd.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Kwaliteitstesten & Inspectie
      description: Elke voltooide plank ondergaat verplichte luchtretentietesten, naadaftrekverificatie en een volledige systeemcontrole vóór verzending. Ons kwaliteitslab werkt onafhankelijk van de productie en rapporteert rechtstreeks aan het management.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
