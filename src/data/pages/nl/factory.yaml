qc_section:
  tagline: Kwaliteitscontrole
  title: Test- en kwaliteitsborgingsproces
  subtitle: Elke board ondergaat verplichte tests voordat ze worden verzonden. Ons kwaliteitslab werkt onafhankelijk van de productie en rapporteert rechtstreeks aan het management.
  steps:
    - step: '1'
      title: Grondstofinspectie
      desc: PVC en drop-stitch stoffen ondergaan trektesten, scheurvoortplanting en UV weerstandsverificatie voordat een batch in productie gaat.
    - step: '2'
      title: 48-uur luchtretentietest
      desc: Elke boardkamer wordt opgeblazen tot 125% van de nominale druk en gedurende 48 uur vastgehouden. Een drukval van meer dan 5% leidt tot automatische afwijzing en herinspectie van de naad.
    - step: '3'
      title: Load & Balance Testen
      desc: Voltooide boards worden belast tot de maximale nominale capaciteit en getest op stabiliteit, vrije boord en hanteerbaarheid. Elk board wordt getest met water voordat de definitieve inspectie plaatsvindt.
faq_section:
  tagline: Veelgestelde vragen
  title: Veelgestelde Vragen
  questions:
    - q: Waar worden uw paddleboards gemaakt?
      a: Elk board wordt gebouwd in onze eigen 12.000 m² fabriek in Weihai, China. Wij besteden niets uit — ontwerp, materialen, lassen, assemblage en testen gebeuren allemaal onder één dak, zodat de kwaliteit nooit afhankelijk is van een derde partij.
    - q: Hoe komen uw prijzen zo veel lager uit dan in de winkel?
      a: Wij verkopen fabrieksoverstock en opruimingsbatchen rechtstreeks vanuit onze eigen productiefaciliteit — geen tussenpersonen, geen winkelopslag. Dat betekent complete SUP pakketten met tot 60% korting op de gebruikelijke winkelprijzen, met dezelfde drukgeteste kwaliteit.
    - q: Wat is inbegrepen bij een board?
      a: 'Elk SUP wordt verzonden als een compleet pakket: board, reistas, handpomp, verstelbare peddel, verwijderbare vin, kookwikkel, en reparatieset.'
    - q: Hoe snel worden bestellingen verzonden?
      a: Bestellingen op voorraad verlaten onze fabriek in Weihai binnen 2-3 werkdagen met traceerbare levering naar 50+ landen in de EU, Noord-Amerika, Azië-Pacific en daarbuiten.
production_flow:
  tagline: Productiestroom
  title: Van Materiaal tot Voltooid Board
  subtitle: Elk board doorloopt 6 productiestadia met QC-controlepunten bij elke stap. Geen shortcuts, geen overgeslagen inspecties.
  stages:
    - stage: '01'
      title: Materiaalontvangst en inkomende QC
      description: Alle binnenkomende materialen worden per batch/lotnummer geregistreerd in ons ERP-systeem. PVC stofrollen, drop-stitch-kernen, kleppen, lijmen en hardware worden in quarantaine geplaatst totdat de kwaliteitscontrole is afgerond.
      qc_check: Treksterkte, scheurweerstand, diktemeter, lijmviscositeit, visuele defectscan
      qc_threshold: 100% van de batches getest. Weigeren indien treksterkte < 90% van specificaties, scheur < spec min, of enig visueel defect
      responsibility: Inkomend QC-team (3 inspecteurs)
    - stage: '02'
      title: CNC-snijden en materiaalvoorbereiding
      description: Computergeoptimaliseerd nesten legt panelen op PVC voorraad om verspilling te minimaliseren. Automatische CNC-snijmachines behouden een positionele nauwkeurigheid van 0,1 mm.
      qc_check: Dimensionale controle aan de hand van CAD DXF-bestanden, inspectie van de randkwaliteit, verificatie van het aantal panelen
      qc_threshold: Elk 20e paneel gemeten. Tolerantie ±0,5 mm. Batch afwijzen als >2% buiten de tolerantie
      responsibility: Lood uit een werkplaats snijden
    - stage: '03'
      title: Lassen en drop-stitch-verbindingen
      description: Drop-stitch-kernen worden met behulp van hittelaminering aan buitenste PVC-laminaten gehecht. Buiskamers zijn RF-gelast of heteluchtgelast. Spoorbanden zijn drielaags door smelten gebonden.
      qc_check: Peeltest elke 50 eenheden, lasbreedtemeting, beoordeling van hete-lucht temperatuurlog, visuele naadinspectie onder backlight
      qc_threshold: Afpelsterkte min. 8 N/cm. Lasbreedtetolerantie ±1 mm. Elke zichtbare channeling = afwijzen
      responsibility: Lassen QC (2 inspecteurs per ploegendienst)
    - stage: '04'
      title: Assemblage & Takelen
      description: 'Borden gaan naar de definitieve assemblage waar alle componenten worden bevestigd: kleppen geïnstalleerd, D-ringen, handvatten, vinbakken en draagtas bevestigd. Elk apparaat volgt een checklist van 100 punten voor assemblage.'
      qc_check: 100-punten checklist aftekening per eenheid, klepfunctietest (10 open/dicht-cycli), hardwarekoppelverificatie, visuele inspectie
      qc_threshold: Nul-defectbeleid voor veiligheid kritieke items (kleppen, D-ringen, handvatten). Kleine cosmetische gebreken binnen strikte cosmetische grenzen
      responsibility: Assemblageteamleider + lijn QC
    - stage: '05'
      title: Druktesten en kwaliteitsbehoud
      description: Elke kamer wordt opgeblazen tot 1,25 x nominale druk (doorgaans 20–25 PSI) en 24–48 uur vastgehouden. Druksensoren loggen continu. Kamers met een drukval van meer dan 5% worden afgewezen en voor herinspectie van de naden verzonden.
      qc_check: 24-uurs drukhoudlogboek, sensorkalibratie dagelijks geverifieerd, temperatuurgecompenseerde drukmeting, naadhertest na reparatie
      qc_threshold: Max. 5% drukval over 24 uur bij stabiele temperatuur. Elke kamer die dit overschrijdt = 100% hertest van de gehele productiebatch
      responsibility: Kwaliteitslab (onafhankelijk van productie, rapporteert aan management)
    - stage: '06'
      title: Laatste inspectie en verpakking
      description: Laatste visuele en functionele inspectie. Oppervlaktedefecten, kleurconsistentie, label-/BIN-verificatie, verpakkingsintegriteit en volledigheid van accessoires. Eenheden worden vacuümverpakt, in dozen gedaan en gepalletiseerd voor het laden van containers.
      qc_check: Volledige visuele inspectie, checklist voor accessoires per SKU, valtest van de verpakking (1 m, willekeurig monster), verificatie van de scan van labels/barcodes
      qc_threshold: Nultolerantie voor veiligheidsgebreken. Cosmetische gebreken binnen strikte grenzen. 100% van de eenheden visueel geïnspecteerd
      responsibility: Laatste QC-team (4 inspecteurs) + teamleider verpakking
workforce:
