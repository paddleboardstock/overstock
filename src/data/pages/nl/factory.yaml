hero:
  tagline: Fabriek
  title: Fabriek & Productie
  subtitle: 12.000 m2 geïntegreerde productie — van grondstof tot eindplaat
intro:
  - Als fabrieksmerk van het **Paddle Board Overstock Weihai Manufacturing Hub** Paddle Board Overstock controleert het elke fase van de productie — van de aankomst van grondstoffen PVC en drop-stitch materialen tot de laatste pre-delivery inspectie van het eindpaneel. Onze productiefaciliteit in de Weihai Economische Ontwikkelingszone beslaat 12.000 vierkante meter en herbergt speciale werkplaatsen voor PVC snijden, hittedichten en lassen, afwerking van dekkunst, eindassemblage en kwaliteitscontrole.
  - Door ontwerp, engineering, prototyping, productie en testen onder één dak te integreren, elimineren we de inefficiënties van contractproductie en behouden we directe controle over de bouwkwaliteit, materiaalkeuze en leveringstijden. Elke plank die onze werkplaats verlaat, wordt gebouwd door onze mensen, op onze apparatuur, volgens onze standaarden.
