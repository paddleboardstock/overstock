material_traceability:
  tagline: Traceerbaarheid
  title: Materiaaltracering en batchcontrole
  description: Iedere partij grondstof krijgt in ons ERP-systeem een ​​uniek lotnummer toegewezen. Vanaf de aankomst via de productie tot aan het eindproduct is de stuklijst van elke boot terug te koppelen naar de oorspronkelijke partij van de leverancier. Dit maakt volledige traceerbaarheid upstream mogelijk voor elk kwaliteits- of nalevingsonderzoek.
  system: Aangepaste ERP (intern systeem) + fysieke batchtags op elke werkorder
  coverage: 100% van de productiematerialen — PVC, Hypalon, drop-stitch-stof, lijmen, kleppen, hardware, verpakking
  records_retained: 10 jaar (volgens CE 2013/53/EU-vereiste)
  suppliers:
    - material: PVC van marinekwaliteit
      source: Chinese en Koreaanse leveranciers
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanse leverancier
      certified: ISO 9001, REACH
    - material: Drop-stitch stof
      source: Eigen weverij + externe partner
      certified: Interne kwaliteitscontrole + leverancier ISO 9001
    - material: Ventielen & beslag
      source: Chinese OEM-leveranciers
      certified: ISO 9001, materiaalcertificaten per batch
