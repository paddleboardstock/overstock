hero:
  tagline: Levensstijl
  title: De Paddle Board Overstock<br />Levensstijl
  subtitle: Gemaakt voor degenen die op het water leven — van weekendontdekkers tot dagelijkse peddelaars die aftellen tot de volgende sessie.
values:
  - icon: 🌊
    title: Geboren op het Water
    desc: Elk ontwerp begint met het begrijpen van hoe water zich gedraagt. We ontwerpen van de rand van de omstandigheden naar binnen — omdat de oceaan onze leraar is, niet onze werkplek.
  - icon: 🔧
    title: Gemaakt om te Duur
    desc: Het meest duurzame product is degene die niet vervangen hoeft te worden. Materialen van maritieme kwaliteit, drop-stitch-kernen beoordeeld op 15 PSI, en naden die langer meegaan dan het seizoen.
  - icon: 🏆
    title: Toegankelijk door Ontwerp
    desc: Watersport mag geen luxe zijn. Professionele prestaties tegen een prijs die logisch is voor gezinnen, gidsen en dagelijkse peddelaars — niet alleen voor professionals.
  - icon: 🌍
    title: Wereldwijde gemeenschap
    desc: 'Van de kust van Weihai tot meren in Europa, rivieren in Zuidoost-Azië en baaien in Amerika — onze klanten delen één ding: een liefde voor het water.'
  - icon: ♻️
    title: Verantwoord Produceren
    desc: CNC-geoptimaliseerde nestings verminderen materiaalverspilling tot onder de 5%. Duurzame constructie verkort vervangingscycli. We bouwen voor duurzaamheid omdat dat de meest verantwoorde keuze is.
  - icon: 🤝
    title: Ondersteuning die Blijft
    desc: Boards die we jaren geleden bouwden nemen nog steeds contact op voor onderdelen. Onze garantieafhandeling gemiddeld binnen 24 uur. We verdwijnen niet na de verkoop — we zijn er voor de levensduur van het product.
