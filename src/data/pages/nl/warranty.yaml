label: Garantie
headline: Paddle Board Overstock Fabrikant Beperkte Garantie
subtitle: Paddle Board Overstock Staat ten grondslag van de kwaliteit van elk opblaasbaar SUP board dat wij produceren. Deze Limited Warranty legt de voorwaarden en dekking voor uw Paddle Board Overstock board vast.
seo:
  headline: Paddle Board Overstock SUP Garantie — 2 jaar beperkte garantie | Paddle Board Overstock
  description: biedt Paddle Board Overstock een beperkte garantie van 2 jaar drop-stitch die naden, railconstructie, inblaasventielen en inbegrepen accessoires op elk board dekt SUP . Volledige voorwaarden en voorwaarden.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Deze beperkte garantie geldt voor nieuwe Paddle Board Overstock opblaasbare boards van merk die SUP rechtstreeks bij de Paddle Board Overstock online winkel worden gekocht. De ingangsdatum is de verifieerbare datum van oorspronkelijke aankoop.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Garantiedekking en duur</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jaar</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Kern- en dekstructuur</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jaar</h3>
          <p class="text-sm text-gray-600 mt-1">Rail- en naadconstructie</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jaar</h3>
          <p class="text-sm text-gray-600 mt-1">Functionaliteit van inflatieklep</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jaar</h3>
          <p class="text-sm text-gray-600 mt-1">Inbegrepen accessoires (pomp, peddel, riem, vin)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 jaar*</h3>
          <p class="text-sm text-gray-600 mt-1">Commercieel, verhuur of wagenparkgebruik — alle componenten</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Commercieel, verhuur of vlootgebruik verkort de garantie tot 1 jaar. Race- of wedstrijdgebruik maakt de garantie volledig ongeldig.</p>
    </div>

    <h2>Wat is gedekt</h2>
    <h3>Drop-Stitch Kern- en dekstructuur (2 jaar)</h3>
    <p>De interne drop-stitch kern en buitenstructuur van het bord zijn gewaarborgd tegen fabricagefouten die het vermogen van het board om operationele inflatie en stijfheid te handhaven, belemmeren.</p>

    <h3>Rail- en naadconstructie (2 jaar)</h3>
    <p>De naden en drievoudige railbanden, waar ze tijdens de productie aan elkaar zijn gehecht, zijn gewaarborgd tegen fabricagefouten die leiden tot aanzienlijke luchtlekkage door de naad. Periodieke inspectie en het onderhoud van de juiste inflatiedruk zijn dekkingsvoorwaarden.</p>

    <h3>Functionaliteit van het inflatieventiel (2 jaar)</h3>
    <p>Luchtinblaaskleppen die oorspronkelijk door Paddle Board Overstock zijn geïnstalleerd, zijn gewaarborgd tegen fabricagefouten in materialen of vakmanschap die voorkomen dat het ventiel lucht kan vasthouden zoals bedoeld.</p>

    <h3>Inbegrepen accessoires (2 jaar)</h3>
    <p>De pomp, verstelbare paddle, riem, afneembare vin en andere onderdelen die bij je boardpakket zijn inbegrepen, zijn gegarandeerd tegen materiaal- en vakmanschapsgebreken.</p>

    <h2>Wat Niet Wordt Gedekt</h2>
    <ul>
      <li>Cosmetische gebreken zoals verkleuring, vlekken, vervaging, krijt of elke verandering in het uiterlijk</li>
      <li>Doorboringen, snijwonden, scheuren, scheuren of andere fysieke schade</li>
      <li>Kraken, barsten, schuren, schuren of achteruitgang door wrijving of contact</li>
      <li>Degradatie door UV lichtblootstelling, verwering of atmosferische omstandigheden</li>
      <li>Schade door contact met oplosmiddelen, zuren, alkaliën of chemicaliën</li>
      <li>Schade door nalatigheid, onjuist gebruik, misbruik, ongeluk of normale slijtage</li>
      <li>Schade door impact, spanning, onjuiste ondersteuning of transport</li>
      <li>Schade door onjuiste inflatie/deflatie of gebruik van niet-goedgekeurde inflatieapparaten</li>
      <li>Apparatuur, componenten of systemen van derden (gedekt door hun respectieve fabrikanten)</li>
    </ul>

    <h2>Verplichting van de fabrikant &amp; Herstel</h2>
    <p>De enige en exclusieve verplichting van Paddle Board Overstock is de reparatie of vervanging, naar keuze van Paddle Board Overstock, van elk onderdeel dat als defect wordt aangemerkt in materiaal of vakmanschap en gedekt is onder deze garantie. Reparaties of vervangingen worden uitgevoerd door Paddle Board Overstock of zijn aangewezen servicecentrum. Gerepareerde of vervangen componenten zijn alleen gedekt voor het resterende deel van de oorspronkelijke garantieperiode.</p>

    <h2>Garantievoorwaarden</h2>
    <ul>
      <li><strong>Onderhoud:</strong>Het product moet worden onderhouden volgens de gepubliceerde richtlijnen van Paddle Board Overstock, inclusief periodieke inspectie en onderhoud van de juiste inflatiedrukken.</li>
      <li><strong>Samenwerking:</strong>De koper moet volledig en tijdig meewerken met Paddle Board Overstock in alle zaken met betrekking tot garantieclaims.</li>
      <li><strong>Oorspronkelijke koper:</strong>Deze garantie wordt uitsluitend verleend aan de oorspronkelijke eindgebruiker en is niet overdraagbaar.</li>
    </ul>

    <h2>Commercieel gebruik</h2>
    <p>Als het product wordt gebruikt voor commerciële doeleinden, verhuur of vlootgebruik, wordt de garantietermijn voor alle componenten verkort tot één (1) jaar vanaf de originele aankoopdatum. Gebruik in races, snelheid- of uithoudingswedstrijden maakt de garantie onmiddellijk en onherroepelijk volledig nietig.</p>

    <h2>Hoe een garantieclaim in te dienen</h2>
    <p>Neem contact op met Paddle Board Overstock met het aankoopbewijs en een gedetailleerde beschrijving van het probleem. Paddle Board Overstock zal de claim beoordelen en instructies geven voor inspectie en service.</p>
    <p>Voor vragen over garantiereparaties kunt u contact met ons opnemen via onze<a href="/contact" class="text-sky-600 underline">contactpagina</a>met uw ordernummer en productgegevens.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Deze garantieverklaring is een samenvatting van de volledige Paddle Board Overstock Beperkte Fabrikantengarantie. Het volledige wettelijke garantiedocument is bindend voor alle garantievoorwaarden. Specificaties kunnen zonder voorafgaande kennisgeving worden gewijzigd. Paddle Board Overstock is een fabrieksmerk van Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
