reasons:
  tagline: Het Paddle Board Overstock Verschil
  title: Wat Ons Onderscheidt
  isBeforeContent: false
  columns: 3
  items:
    - title: Echte productie, geen handel
      description: We bezitten en exploiteren een fabriek van 12.000 m². Wanneer u samenwerkt met Paddle Board Overstock, werkt u rechtstreeks met de mensen die uw producten ontwerpen, ontwikkelen en bouwen — zonder tussenpersonen.
      icon: tabler:building-factory
    - title: Ingenieursgestuurde aanpak
      description: Ons ontwerpproces begint met de use case, niet met de productcategorie. We optimaliseren de rompvorm, materiaalkeuze en configuratie voor hoe het board daadwerkelijk op het water zal worden gebruikt.
      icon: tabler:engine
    - title: Bewezen kwaliteit
      description: Elke printplaat wordt 24-48 uur voor verzending onder druk getest tot 1,25 keer de nominale druk, en 99,3% van onze zendingen arriveert foutloos — met garantie op de hand.
      icon: tabler:award
    - title: Paddler-First ontwerp
      description: 'Elk model begint met hoe je peddelt: stabiele platforms voor beginners, gestroomlijnde vormen voor toeren en full-size dekks voor yoga. Wij ontwerpen voor echte peddelaars, niet voor showroomspecificaties.'
      icon: tabler:adjustments
    - title: Mondiale logistiek
      description: VS-magazijn in Californië, directe verzending vanuit Weihai, luchtvracht voor dringende bestellingen. Wij regelen douanepapieren en documentatie wereldwijd.
      icon: tabler:truck-delivery
    - title: Levenslange ondersteuning
      description: Wij staan achter de boards die we twintig jaar geleden hebben gebouwd. Echte reserveonderdelen, technisch advies, reparatiebegeleiding — ons team is er wanneer u ons nodig heeft, waar u ook bent.
      icon: tabler:lifebuoy
testimonials:
  tagline: Vertrouwd door paddelaars wereldwijd
  title: Wat peddelaars zeggen
  items:
    - content: Mijn Ocean Voyager heeft alles aangedaan, van kalme ochtenden op het meer tot ruige kustmiddagen. Na twee seizoenen ziet hij er nog steeds uit en rijdt hij als nieuw.
      name: — Recreatieve peddelaar, Californië
    - content: Ik was nerveus om mijn eerste opblaasbare board online te kopen, maar de kwaliteit was meteen duidelijk toen ik het opblies. Stijf, stabiel en prachtig afgewerkt.
      name: — Eerste SUP keer eigenaar, Duitsland
    - content: We peddelen als gezin elk zomerweekend. Drie planken, geen problemen, en de kinderen zijn dol op de felle ontwerpen.
      name: — Family Paddler, Australië
    - content: De druktesten zijn geen marketingpraat — mijn board is rotsvast bij volle druk en laat na een jaar wekelijks paddlen geen stretch zien.
      name: — Weekly Paddler, Nederland
cta:
  title: Klaar om je perfecte board te vinden?
  subtitle: Praat met onze peddelexperts voor eerlijk advies over het kiezen van het juiste board — geen druk, gewoon echte hulp.
  actions:
    - variant: primary
      text: Praat met ons team
      href: /contact
    - text: Productcatalogus downloaden
