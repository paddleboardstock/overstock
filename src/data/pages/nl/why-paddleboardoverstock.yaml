hero:
  tagline: Waarom Paddle Board Overstock
  title: Anders gebouwd. Gebouwd om lang mee te gaan.<br />De borden achter wateravonturen wereldwijd
  subtitle: Niet zomaar een fabriek — een team van peddelaars en ingenieurs die premium opblaasbare boards ontwerpen, testen en bouwen SUP voor gezinnen, avonturiers en clubs wereldwijd.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock productiekwaliteit en deskundigheid
pillars:
  tagline: Drie pijlers van kwaliteit
  title: Waarom peddelaars wereldwijd kiezen Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Ontworpen voor commercieel gebruik
      description: Onze boards zijn ontworpen voor jarenlang regelmatig peddelen. Commercieel gewassen PVC, versterkte drop-stitch kernen, UV stabiele materialen en in het veld geteste hardware zorgen voor minder onderhoud en een langere levensduur op het water.
      icon: tabler:building-factory
      callToAction:
        text: Zie commerciële productlijn
        href: /products
    - title: Getest boven de normen
      description: Elke plank wordt opgeblazen tot 1,25 keer de nominale druk gedurende 24-48 uur voordat hij onze fabriek verlaat — 100% drukgetest, 99,3% foutvrij. Je board is al sterk voordat hij het water raakt.
      icon: tabler:shield-check
      callToAction:
        text: Kijk hoe we testen
        href: /quality
    - title: Gebouwd voor wereldwijde omstandigheden
      description: 'Producten geoptimaliseerd voor elk klimaat: koudwaterPVCformuleringen voor Europa, UV-bestendige materialen voor het Midden-Oosten en Australië, anti-vochtbehandelingen voor Zuidoost-Azië. Elke verzending is afgestemd op de omgeving van de bestemming.'
      icon: tabler:world
