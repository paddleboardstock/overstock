hero:
  tagline: Kwaliteitscontrole Laboratorium
  title: Testlaboratorium & Kwaliteitsborging
  subtitle: Onafhankelijk kwaliteitslab — elk apparaat getest vóór verzending
intro: Paddle Board Overstock exploiteert een speciaal kwaliteitscontrolelaboratorium dat onafhankelijk van de productie opereert. Elke partij grondstof en elk afgewerkt bord doorloopt gedocumenteerde inspectieprotocollen voordat het wordt vrijgegeven. Ons QC-team rapporteert rechtstreeks aan het management, wat zorgt voor onpartijdige kwaliteitsbeslissingen.
highlights:
  - value: 100%
    label: Eenheden onder druk getest
    detail: Elke kamer, elk bord
  - value: 48 h
    label: Duur van luchtdichtheidstest
    detail: Bij 1,25× nominale druk
  - value: '&lt;5%'
    label: Maximaal toegestane drukval
    detail: Over 24-uurs houdperiode
  - value: 99.3%
    label: Defectvrije snelheid
    detail: Verzendingen van de afgelopen 12 maanden
test_procedures:
  - title: Grondstofinspectie
    description: Elke inkomende partij PVC, drop-stitch stof, EVA schuim en hardware wordt getest vóór acceptatie. Treksterkte, scheurweerstand en UV weerstand worden geverifieerd. Niet-conforme materialen worden in quarantaine geplaatst en teruggestuurd.
    standards:
      - Treksterkte (minimaal 350 N/cm)
      - Scheurweerstand
      - UV weerstand (1.000 h)
  - title: QC-controlepunten tijdens het proces
    description: Productieoperators voeren zelfinspecties uit bij elke stap. QC-auditors voeren willekeurige steekproeven gedurende de ploeg uit. Lasafpeltests worden uitgevoerd bij elke 50 eenheden. Dimensionale controles vinden plaats bij elk 20e paneel.
    standards:
      - Peeltest elke 50 eenheden
      - Interne checklist van 100 punten
      - Willekeurige steekproefaudits
  - title: 48-uur luchtretentietest
    description: Elke buiskamer wordt opgeblazen tot 125% van de nominale druk en 48 uur vastgehouden. Druksensoren registreren continu met temperatuurcompensatie. Elke kamer die een drukval van meer dan 5% vertoont, triggert een automatische herinspectie van de partij.
    standards:
      - 1,25× nominale druk vasthouden
      - <5% maximale drukval
  - title: Load & Balance Testen
    description: Voltooide borden worden getest bij maximale nominale belasting op stabiliteit, vrijboord en hantering. Elk bord ondergaat een watertest vóór definitieve inspectie goedkeuring.
    standards:
      - 1,25× nominale belasting verificatie
      - Watertests
