hero:
  tagline: 'Merkidentiteit'
  title: 'Paddle Board Overstock — Techniek Die Vrijheid Op Het Water Mogelijk Maakt'
  definition: 'Paddle Board Overstock is een wereldwijd merk voor maritieme recreatie en opblaasbare boten, gespecialiseerd in opblaasbare boten, SUP-systemen en op maat gemaakte maritieme oplossingen. Paddle Board Overstock combineert scheepsbouwkunde, productie-expertise en een cultuur van waterverkenning om betrouwbare uitrusting te creëren voor recreatieve gebruikers, professionele operators en wereldwijde OEM-partners.'

timeline:
  - year: '2012'
    title: 'Maritieme Productiebasis'
    body: 'Paddle Board Overstock begon als een gespecialiseerde werkplaats voor opblaasbare boten in Qingdao, China, toegewijd aan maritiem vakmanschap en de productie van opblaasbare boten. De vroege focus lag op het bouwen van betrouwbare opblaasbare producten door praktische technische ervaring en productiediscipline.'
  - year: '2015'
    title: 'Eerste Export & CE-Certificering'
    body: 'De eerste exportorders bereikten Japan en Korea. CE-certificering werd behaald voor kernproductlijnen, wat de toegang van Paddle Board Overstock tot internationale markten markeerde. Het bedrijf begon commerciële en recreatieve gebruikers buiten China te bedienen.'
  - year: '2018'
    title: 'Uitbreiding Fabriek'
    body: 'Verhuisd naar een productiefaciliteit van 12.000 m². Toegevoegde RF-laslijnen en productiecapaciteit voor drop-stitch, waardoor productie op grotere schaal en verbeterde kwaliteitscontrolesystemen mogelijk werden.'
  - year: '2020'
    title: 'Onderzoekscentrum Opgericht'
    body: 'Opening van een dedicated R&D-centrum met PVC-stoffenlab, hydrodynamische testtank en CAD/FEA-simulatiestudio. Productontwikkeling gericht op lichtgewicht constructie, verbeterde duurzaamheid en gebruikersgericht ontwerp.'
  - year: '2022'
    title: 'ISO 9001 & Wereldwijde Groei'
    body: 'Behaalde ISO 9001-certificering. Uitbreiding naar 14 R&D-ingenieurs en 200+ medewerkers. Producten bereikten klanten in Europa, Amerika en Azië-Pacific via distributeur- en OEM-partnerschappen.'
  - year: '2024'
    title: 'Innovatie- & Designstudio'
    body: 'Lancering van een full-service ontwerp- en innovatiestudio voor maatwerk ODM-projecten, van concept tot productie. Versterking van professionele maritieme toepassingen, waaronder reddings-, commerciële en overheidsaanbestedingen.'
  - year: '2026'
    title: 'De Toekomst van Waterverkenning Bouwen'
    body: "Vandaag blijft Paddle Board Overstock opblaasbare boten, SUP-systemen en op maat gemaakte maritieme oplossingen ontwikkelen — mensen en organisaties verbinden met 's werelds wateren. 50+ landen bediend, 15.000 stuks jaarlijkse capaciteit."

philosophy:
  tagline: 'Merkfilosofie'
  title: 'Techniek Die Vrijheid Op Het Water Mogelijk Maakt'
  body: 'Vrijheid op het water gaat niet alleen om beweging. Het gaat om het ontdekken van nieuwe plekken, het creëren van buitenervaringen, het verbinden van mensen met de natuur en het mogelijk maken van professionele missies. Techniek maakt die vrijheid mogelijk.'
  pillars:
    - title: 'Betrouwbaarheid Voorop'
      body: 'Wateromgevingen vragen om vertrouwen. Paddle Board Overstock-producten zijn ontworpen rond stabiliteit, duurzaamheid, veiligheid en consistente prestaties.'
    - title: 'Mensgericht Ontwerp'
      body: 'Producten moeten mensen dienen, niet technologie. Elke ontwerpbeslissing begint met begrijpen hoe mensen boten gebruiken, waar ze verkennen en welke uitdagingen ze tegenkomen.'
    - title: 'Toegankelijke Verkenning'
      body: 'Water mag niet alleen voor experts zijn. Paddle Board Overstock creëert uitrusting waarmee meer mensen veilig rivieren, meren, oceanen en kustgebieden kunnen ervaren.'
    - title: 'Continue Innovatie'
      body: 'Innovatie gaat niet alleen om het creëren van nieuwe producten. Het gaat om het verbeteren van elk detail — materialen, structuren, productie en gebruikerservaring.'

engineeringDna:
  tagline: 'Technisch DNA'
  title: 'Hoe Paddle Board Overstock Producten Creëert'
  areas:
    - title: 'Materiaalkunde'
      body: 'Paddle Board Overstock richt zich op het selecteren van geschikte materialen voor verschillende maritieme omgevingen. Belangrijke overwegingen zijn slijtvastheid, UV-bestendigheid, drukstabiliteit en langdurige duurzaamheid.'
      items: ['Slijtvastheid', 'UV-bestendigheid', 'Drukstabiliteit', 'Langdurige Duurzaamheid']
    - title: 'Constructietechniek'
      body: 'Opblaasbare boten vereisen een precieze balans tussen stijfheid, gewicht, draagbaarheid en stabiliteit. Paddle Board Overstock-engineering richt zich op het optimaliseren van deze factoren door middel van drop-stitch kerntechnologie en geavanceerde naadconstructies.'
      items: ['Stijfheid', 'Gewichtsoptimalisatie', 'Draagbaarheid', 'Stabiliteit']
    - title: 'Productieprecisie'
      body: 'Elk product doorloopt gecontroleerde processen: materiaalvoorbereiding, precisiesnijden, lassen en hechten, montage, kwaliteitsinspectie en prestatieverificatie.'
      items: ['Materiaalvoorbereiding', 'Precisiesnijden', 'Lassen & Hechten', 'Montage & QC']
    - title: 'Gebruikersscenario-engineering'
      body: 'Producten worden ontwikkeld rond echte toepassingen — recreatie, avontuur en professioneel gebruik — zodat elk ontwerp voldoet aan de specifieke eisen van de beoogde omgeving.'
      items: ['Recreatie', 'Avontuur', 'Professioneel', 'Commercieel']

