hero:
  tagline: Gidsen
  title: Nieuw bij SUP?
  subtitle: Praktische gidsen om u te helpen bij het kiezen, gebruiken en genieten van opblaasbare watersportuitrusting.
size_guide:
  tagline: Grootte en specificaties
  title: Vind de juiste maat voor uw behoeften
  desc: 'Vergelijk productafmetingen, gewichtscapaciteiten en aanbevolen toepassingen. Of je nu een touring SUP, een compacte kajak of een commerciële RIB nodig hebt: onze maattabel helpt je bij het kiezen van de juiste pasvorm.'
  link_label: Volledige maattabel met productspecificaties →
  link: /size-guide
  cards:
    - title: SUP-borden
      desc: Kies de lengte op basis van uw gewicht en het beoogde gebruik. Bredere boards (32"+) bieden meer stabiliteit. Langere boards (11–12 ft) volgen beter voor toeren.
    - title: Kajaks
      desc: Enkele kajaks (9 ft) voor soloreizen en rivieren. Tandemkajaks (12 ft) voor twee peddelaars of één met uitrusting. Controleer altijd het draagvermogen.
    - title: Rubberboten en RIB's
      desc: Kies de lengte op basis van het aantal passagiers en gebruik. Grotere RIB's (4,5 m+) voor offshore en reddingsacties. Kleinere rubberboten (2,7 m) als tenders en visplatforms.
