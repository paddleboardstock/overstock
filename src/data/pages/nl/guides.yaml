hero:
  tagline: Gidsen
  title: Nieuw bij SUP?
  subtitle: Praktische gidsen om u te helpen bij het kiezen, gebruiken en genieten van opblaasbare watersportuitrusting.
size_guide:
  tagline: Grootte en specificaties
  title: Vind de juiste maat voor uw behoeften
  desc: Vergelijk bordafmetingen, draagvermogens en aanbevolen gebruik. Of je nu een stabiel allroundbord wilt of een sneller board voor tochten — onze maatgids helpt je de juiste keuze te maken.
  link_label: Volledige maattabel met productspecificaties →
  link: /size-guide
  cards:
    - title: Allround SUP Borden
      desc: Onze ~11 ft borden (32" breed) bieden een balans tussen stabiliteit, snelheid en capaciteit. De 6-inch drop-stitch kern bij 15 PSI houdt het dek stijf voor peddelaars van elk niveau.
    - title: Breedte & Stabiliteit
      desc: Brede borden (32"+) bieden meer stabiliteit voor beginners, yoga en vissen. 6-inch dikte voegt stijfheid en draagvermogen toe voor rijder plus uitrusting.
    - title: Pakketten & Accessoires
      desc: Elk board wordt als compleet pakket geleverd — board, reistas, handpomp, verstelbare peddel, verwijderbare vin, coil leash en reparatieset. Controleer het maximaal draaggewicht voor rijder plus uitrusting.
