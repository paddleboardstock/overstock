hero:
  tagline: Productiecapaciteit
  title: Productiecapaciteit & Jaarlijkse Output
  subtitle: 12.000 m² faciliteit die 15.000 boards per jaar produceert met ruimte om uit te breiden
intro: Paddle Board Overstock beschikt over een van de grootste gespecialiseerde inflatable SUP board productiefaciliteiten in Weihai, China. Onze fabriek van 12.000 m² is georganiseerd in zes gespecialiseerde werkplaatsen die parallel werken, waardoor we de capaciteit hebben om jaarlijks 15.000 boards te produceren in de all-around, touring en art-series SUP lijnen.
