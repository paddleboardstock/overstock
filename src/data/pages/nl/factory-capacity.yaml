workshops:
  - title: SUP Board Productie
    description: '4 parallelle assemblagelijnen voor inflatable SUP boards. Elke lijn kan 50–80 boards per shift produceren. Digitale druk- en zeefdrukstations draaien tegelijkertijd. Jaarlijkse SUP capaciteit: 8.000+ boards.'
    output: 8.000+ SUPs/jaar
  - title: Deck Art & EVA Afwerking
    description: Speciale afwerkingswerkplaats voor art-series decks. Precisie EVA snijden, met de hand aangebrachte deckpatronen, en eindafwerking. Jaarlijkse capaciteit dekt het volledige art-series assortiment.
    output: Volledig art-series assortiment
  - title: Drop-Stitch Laminering
    description: 'Warmtelamineringlijnen verbinden drop-stitch kernen met buitenste PVC laminaten. Railbands worden drievoudig gefuseerd voor luchtdichte sterkte. Jaarlijkse capaciteit: 15.000+ kernen.'
    output: 15.000+ kernen/jaar
  - title: Accessoires & Verpakking
    description: Assemblage- en verpakkingslijnen voor pompen, peddels, leashes en reparatiesets. Boards worden vacuüm verpakt, ingepakt en op pallets gezet voor wereldwijde verzending.
    output: Complete pakketten, klaar voor verzending
