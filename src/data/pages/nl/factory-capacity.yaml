workshops:
  - title: SUP-boardproductie
    description: '4 parallelle assemblagelijnen voor opblaasbare SUP-boards. Elke lijn kan 50-80 boards per ploeg produceren. Digitale print- en zeefdrukstations draaien gelijktijdig. Jaarlijkse SUP-capaciteit: 8.000+ boards.'
    output: 8.000+ boards/jaar
  - title: RIB-botenproductie
    description: 'Toegewijde werkplaats voor glasvezelrompen met 6 matrijsstations voor RIB-rompen tot 7,6 m. Het las- en montagegebied voor tubes behandelt 3-5 RIB''s tegelijk. Jaarlijkse RIB-capaciteit: 2.000+ boten.'
    output: 2.000+ boten/jaar
  - title: Opblaasbare boot & dinghy
    description: 'Meerdoelige productielijnen voor opblaasbare boten, kajaks en dinghy''s. Heetelucht-lasstations, RF-dielectrische persen en montagewerkplekken worden geherconfigureerd op basis van de ordermix. Jaarlijkse capaciteit: 5.000+ eenheden.'
    output: 5.000+ eenheden/jaar
  - title: Veiligheidsuitrusting
    description: 'Aparte cleanroom-productiezone voor zwemvesten en veiligheidsuitrusting. Toegewijd naaiwerk, schuiminbreng en teststations. Jaarlijkse zwemvestcapaciteit: 50.000+ eenheden.'
    output: '50.000+ zwemvesten/jaar'

oem_capacity:
  moq: 'SUP: 5-10 eenheden | RIB: 2-5 eenheden | Kajak/dinghy: 10-20 eenheden | Custom matrijs: 200+ eenheden'
  lead_time: 'Standaard 30-45 dagen. Monster 15-20 dagen. Spoed mogelijk.'
  payment: 'T/T 30% aanbetaling + 70% vóór verzending. L/C, Western Union geaccepteerd.'
