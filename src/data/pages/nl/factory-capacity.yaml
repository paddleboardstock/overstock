hero:
  tagline: Productiecapaciteit
  title: Productiecapaciteit en jaarproductie
  subtitle: Faciliteit van 12.000 m² die 15.000 boten per jaar produceert met ruimte om te schalen

intro: Paddle Board Overstock exploiteert een van de grootste toegewijde productiefaciliteiten voor opblaasbare boten in Qingdao, China. Onze fabriek van 12.000 m² is georganiseerd in zes gespecialiseerde werkplaatsen die parallel werken, waardoor we de capaciteit hebben om 15.000 boten per jaar te produceren in SUP-, kajak-, dinghy-, RIB- en veiligheidsuitrustingslijnen.

