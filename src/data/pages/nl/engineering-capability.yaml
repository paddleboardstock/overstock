content_capability:
  tagline: Technische capaciteiten
  title: Wat ons engineeringteam levert
  subtitle: 'De engineering van Aquafarer bestrijkt de volledige levenscyclus van een product: van marktonderzoek en conceptontwerp tot prototyping, testen en massaproductie.'
  items:
    - title: Industrieel Ontwerp
      description: Ons industriële ontwerpteam werkt vanuit klantvereisten, marktonderzoek en concurrentieanalyse om productconcepten te ontwikkelen die esthetiek, functionaliteit en maakbaarheid in evenwicht brengen. We produceren 2D-schetsen, 3D-weergaven en specificatiedocumenten ter beoordeling door de klant voordat we aan de slag gaan met de tooling.
      features:
        - Conceptontwikkeling en haalbaarheidsstudies
        - 2D-ontwerptekeningen en 3D-renderingen
        - Materiaalselectie en -specificatie
        - Ontwerp voor productie (DFM)-analyse
        - Ergonomische en veiligheidsevaluatie
    - title: Bouwtechniek
      description: 'Onze constructeurs zijn gespecialiseerd in de architectuur van opblaasbare boten: rompontwerp, buiskamerconfiguratie, drop-stitch kerntechniek en belastingverdeling. Elk ontwerp wordt geanalyseerd op structurele integriteit, gewichtsoptimalisatie en naleving van relevante normen (CE, ISO, AS).'
      features:
        - Deep-V polyester rompontwerp met berekende V-hoeken
        - Multikamer tubeconfiguratie voor veiligheid en drijfvermogen
        - Drop-stitch kernspecificatie en dichtheidsoptimalisatie
        - Eindige-elementenanalyse voor dragende componenten
        - Gewichtsverdeling en stabiliteitsberekeningen
    - title: 3D-modellering en CAD
      description: Alle productontwerpen worden ontwikkeld in 3D CAD voordat de prototype-tooling begint. Onze ingenieurs gebruiken SolidWorks en Rhino 3D voor productmodellering, waardoor klanten elk detail kunnen beoordelen – van buisprofiel tot console-indeling – voordat ze tot productie overgaan.
      features:
        - Volledige 3D-CAD-modellering in SolidWorks en Rhino 3D
        - Fotorealistische renderingen voor klantpresentaties
        - Technische tekeningenpakketten voor productie
        - Matrijs- en gereedschapsontwerp op basis van 3D-modellen
        - Directe CAD-naar-CNC-datatransfer voor precisiebewerking
    - title: Prototyping en testen
      description: 'Vóór massaproductie doorloopt elk nieuw product de prototypefase. We bouwen functionele prototypes voor klantevaluatie en onderwerpen ze vervolgens aan ons volledige testprotocol: druktesten, stabiliteitstesten, belastingstesten en waterproeven. Ontwerpiteraties in de prototypefase zijn snel en kosteneffectief.'
      features:
        - Snelle prototype-gereedschappen (doorlooptijd 15-20 dagen)
        - Functioneel prototype voor evaluatie in de praktijk
        - Volledig testprotocol voorafgaand aan productiegoedkeuring
        - Iteratieve verfijning van het ontwerp op basis van testresultaten
        - Mijlpaal van klantgoedkeuring vóór productiegereedschap
    - title: Integratie van aangepaste accessoires
      description: 'Veel OEM-projecten vereisen de integratie van door de klant geleverde accessoires of accessoires van derden: op maat gemaakte consoles, gespecialiseerde stoelen, elektronische systemen, bevestigingspunten voor duikuitrusting of merkelementen. Ons engineeringteam beheert het integratieontwerp, de structurele aanpassing en de kwaliteitsvalidatie van alle accessoires.'
      features:
        - Consoleontwerp en lay-out van het instrumentenpaneel
        - Integratie van op maat gemaakte zitplaatsen en bekleding
        - Ontwerp en bedrading van elektronische systemen
        - Bevestigingssystemen voor duik- en reddingsuitrusting
        - Specificaties voor aanbrenging van branding en graphics
content_process:
  tagline: Ontwikkelingsproces
  title: Van concept<br />tot productie
  subtitle: Ons productontwikkelingsproces volgt een gestructureerde workflow van zes fasen, ontworpen om risico's te minimaliseren, tijdlijnen te comprimeren en vanaf dag één productiegereedheid te garanderen.
  stages:
    - stage: '01'
      title: Vereisten en onderzoek
      duration: 1-2 weken
      description: We werken samen met de klant om productspecificaties, doelmarktvereisten, naleving van regelgeving en commerciële doelstellingen te definiëren. Deze fase levert een Productvereistendocument (PRD) op dat al het daaropvolgende werk begeleidt.
      deliverables: PRD, marktanalyse, concurrentiebenchmark, voorlopige kostenraming
    - stage: '02'
      title: Conceptontwerp
      duration: 2-3 weken
      description: Het industriële ontwerpteam ontwikkelt productconcepten op basis van de PRD. Er worden meerdere ontwerpopties gepresenteerd met 3D-weergaven, materiaalaanbevelingen en initiële technische beoordelingen. Klant kiest richting voor gedetailleerde ontwikkeling.
      deliverables: 3D-conceptweergaven, materiaalspecificaties, ontwerpgrondslag, voorlopige stuklijst
    - stage: '03'
      title: Gedetailleerde techniek
      duration: 2-4 weken
      description: 'Het geselecteerde concept is volledig ontwikkeld: 3D CAD-modellering, structurele analyse, buisconfiguratie, rompontwerp, integratie van accessoires en productiedocumentatie. Alle afmetingen, materialen en processen zijn gespecificeerd voor gereedschappen.'
      deliverables: Volledig 3D CAD-model, technische tekeningen, definitieve stuklijst, gereedschapsspecificaties, QC-plan
    - stage: '04'
      title: Prototype
      duration: 2-3 weken
      description: Er wordt prototypetooling geproduceerd en functionele samples gebouwd. Klant beoordeelt prototype aan de hand van PRD-specificaties. Het testen wordt uitgevoerd volgens afgesproken protocol. Ontwerpaanpassingen worden gemaakt op basis van feedback vóór productietools.
      deliverables: Functioneel prototype, testrapport, ontwerprevisielogboek, aftekeningsdocument van de klant
    - stage: '05'
      title: Productie gereedschap
      duration: 2-3 weken
      description: "Zodra het prototype is goedgekeurd, wordt de productietooling in gebruik genomen: mallen, lasmallen, snijprogramma's, montagebevestigingen. De QC-documentatie en inspectiecriteria zijn afgerond. Proefdraaien uitgevoerd voor procesvalidatie."
      deliverables: Productietools, procesdocumentatie, QC-inspectieplan, proefdraairapport
    - stage: '06'
      title: Massaproductie en kwaliteitscontrole
      duration: Lopend
      description: De volledige productie begint met in-proces QC in elke fase. De eerste artikelen worden geïnspecteerd en goedgekeurd voordat de batch wordt vrijgegeven. Voortdurende kwaliteitsbewaking, het volgen van defecten en voortdurende verbetering gedurende de gehele productielevenscyclus.
      deliverables: Productieschema, QC-rapporten, traceerbaarheidsgegevens van batches, verzenddocumentatie
content_customization:
  tagline: Aanpassingsopties
  title: Wat kan<br />aangepast worden
  subtitle: Bijna elk aspect van onze producten kan worden aangepast om aan de eisen van de klant te voldoen. Hieronder vindt u de meest voorkomende aanpassingscategorieën.
  columns: 3
  items:
    - title: Romp & Structuur
      description: Aangepaste romplengte, straalbreedte, deadrisehoek, buisdiameter, kamerconfiguratie en materiaalkwaliteit.
      icon: tabler:sailboat
    - title: Kleuren en afbeeldingen
      description: Kleur van de buis (PVC/Hypalon), kleur van de gelcoat van de romp, kleur van de console, dekafbeeldingen, plaatsing van het logo en verpakkingsontwerp.
      icon: tabler:palette
    - title: Console en bedieningselementen
      description: Middenconsole, zijconsole of stuurkolom. Aangepaste indeling van het instrumentenpaneel, plaatsing van de schakelaars en stuurstand.
      icon: tabler:steering-wheel
    - title: Zitplaatsen en bekleding
      description: Jockeystoelen, zitbanken, luxe bekleding, stiksels in bijpassende kleur, opklapbare of verwijderbare configuraties.
      icon: tabler:armchair
    - title: Accessoires en uitrusting
      description: Duikladders, tankrekken, sleeppylonen, T-tops, Bimini-tops, geluidssystemen, navigatie-elektronica en veiligheidsuitrusting.
      icon: tabler:backpack
    - title: Verpakking en branding
      description: Op maat gemaakte retailverpakkingen, private-label dozen, verzenddozen met merktekens, hang-tags en gebruikershandleidingen in de taal van de klant.
      icon: tabler:box
content_industries:
  tagline: Industriële toepassingen
  title: Technische oplossingen<br />per branche
  subtitle: Ons technische team heeft producten ontwikkeld voor een breed scala aan maritieme toepassingen, elk met verschillende vereisten en prestatiecriteria.
  columns: 3
  items:
    - title: Duikoperaties
      description: Versterkte dekken, duikladderintegratie, tankopslagsystemen en stabiele platforms voor commerciële duikcentra over de hele wereld.
      icon: tabler:lifebuoy
    - title: Redding en nood
      description: Hogesnelheidsrompontwerpen, zelflozende dekken, montagesystemen voor apparatuur en veiligheidsconfiguraties met meerdere kamers voor SAR-operaties.
      icon: tabler:alert-triangle
    - title: Maritiem toerisme
      description: Indelingen voor passagierscomfort, integratie van zonneschermen, instapsystemen en brandstofefficiënte configuraties voor eilandtransfers.
      icon: tabler:beach
    - title: Tenders voor jachten
      description: Compacte ontwerpen voor davitopslag, luxe afwerkingsopties, bijpassende moederschipkleuren en krachtige trekeigenschappen.
      icon: tabler:sailboat
    - title: Visserij en aquacultuur
      description: Configuraties met plat dek, integratie van livewells, indelingen voor hengelhouders, corrosiebestendige hardware voor continue blootstelling aan zout water.
      icon: tabler:fish
    - title: Haven & Industrieel
      description: Versterking van de romp voor zwaar gebruik, indelingen van werkboten, configuraties voor personeelstransport en integratie van apparatuur voor offshore-operaties.
      icon: tabler:ship
