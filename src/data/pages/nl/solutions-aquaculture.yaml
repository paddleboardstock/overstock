content_challenge:
  tagline: De uitdaging
  title: Eisen van de aquacultuur<br />Zoutwaterbestendige apparatuur
  subtitle: 'Viskwekerijen, parelkwekerijen en oceaanboerderijen opereren in het chemisch meest agressieve mariene milieu: langdurige blootstelling aan zout water, brandstof- en voerresten en voortdurend dagelijks gebruik.'
  paragraphs:
    - Aquacultuuractiviteiten draaien 365 dagen per jaar in blootgestelde kust- en offshore-omgevingen. De werkboten die worden gebruikt voor kooiinspectie, voertransport, onderhoud van parellijnen en apparatuuronderhoud worden blootgesteld aan constante onderdompeling in zout water, UV-straling en chemisch contact met brandstoffen, visvoer en antifoulingbehandelingen.
    - '**Corrosie is de hoofdvijand** — Standaard maritieme apparatuur slijt onder deze omstandigheden snel. Buitenboordmotoren, aanhangwagenframes en rompbeslag moeten voortdurend worden vervangen. Exploitanten hebben boten nodig die zijn gebouwd met corrosiebestendige materialen en jarenlang in deze omgeving kunnen doorstaan zonder te verslechteren.'
    - '**Dagelijkse betrouwbaarheid is cruciaal** — Een uitgevallen werkboot betekent gemiste voerschema''s, vertraagde oogsten en kostbare productieverliezen. Voor parelkwekerijen kan één gemiste inspectiedag aanzienlijke schade aan de oogst betekenen. Voor viskwekerijen heeft vertraagde voeding invloed op groeisnelheden en winstgevendheid.'
    - Paddle Board Overstock aquacultuur-RIB's zijn ontworpen met corrosiebestendig beslag, zwaar belastbare Hypalon-buizen en versterkte rompen, speciaal gebouwd voor de veeleisende omstandigheden van viskweek, parelkweek en Ocean Ranching.
content_solution:
  tagline: Onze oplossing
  title: Speciaal gebouwde RIB's<br />Voor de aquacultuursector
  subtitle: Elke aquacultuurwerkboot van Paddle Board Overstock is ontworpen om agressieve zoutwateromgevingen te weerstaan en tegelijkertijd betrouwbare dagelijkse prestaties te leveren.
  list:
    - Hypalon-buizen van marinekwaliteit — superieure bestendigheid tegen UV, zout water, brandstoffen en chemicaliën van visvoer
    - Beslag van roestvast staal 316 door de hele boot — geen roest bij langdurige blootstelling aan zout water
    - Versterkte schuurlijsten en kielbeschermer voor herhaaldelijk contact met steigers en kooien
    - Zelflenzend dek voor eenvoudig wassen en afwateren na voertransport en oogstwerkzaamheden
    - Platte dekconfiguratie voor het vervoeren van voerzakken, oogstkisten en apparatuur
    - Buitenboordconfiguraties van 15 tot 60 pk — geoptimaliseerd voor de balans tussen laadvermogen en brandstofefficiëntie
    - Buiskleuropties met hoge zichtbaarheid voor eenvoudige herkenning over grote kwekerijgebieden
content_segments:
  tagline: Aquacultuurprofielen
  title: Werkbootoplossingen<br />Per type aquacultuur
  subtitle: "Verschillende aquacultuuractiviteiten stellen verschillende vereisten voor werkboten: van kleine, wendbare RIB's voor de inspectie van viskooien tot stabiele transportplatforms voor de parelkwekerij en zware werkboten voor de oceaanboerderij."
  items:
    - title: Viskwekerijactiviteiten
      subtitle: Kooiinspectie, voertransport, oogstondersteuning
      description: 'Zeeviskwekerijen exploiteren kooien op blootgestelde kust- en offshore-locaties. Werkboten worden dagelijks gebruikt voor inspectie van kooinetten, voerwerkzaamheden, oogstondersteuning en onderhoud van apparatuur. De voornaamste uitdaging is corrosie: boten worden voortdurend blootgesteld aan zout water, visvoerresten en brandstof. Een betrouwbare werkboot is essentieel omdat gemiste voeding of vertraagde oogst rechtstreeks van invloed is op de productieopbrengst en winstgevendheid.'
      features:
        - 'Pakket voor agressieve omgevingen: beslag van roestvast staal 316, componenten van marinelegering'
        - Platte dekindeling voor het transport van voerzakken en oogstkisten
        - Zelflenzend dek voor eenvoudig afspoelen na de werkzaamheden
        - Hypalon-buizen met chemisch bestendige coating voor blootstelling aan voer en brandstoffen
        - Versterkte schuurlijsten voor frequent contact met kooien en steigers
    - title: Parelkwekerijactiviteiten
      subtitle: Stabiel transport voor parellijninspectie en oogst
      description: Parelkwekerijen hebben stabiele, betrouwbare werkboten nodig voor het dagelijkse transport tussen de parellijnen, de inspectie van oesternetten en het verzamelen van de oogst. Deze operaties vinden plaats op afgelegen kustlocaties met een beperkte onderhoudsinfrastructuur. De boot moet stabiel genoeg zijn voor de bemanning om van uit te werken tijdens het inspecteren van de parellijnen, met gemakkelijk aan boord gaan en voldoende dekruimte voor het vervoeren van geoogste oesters, netten en voorraden. Betrouwbaarheid en eenvoudig onderhoud zijn van cruciaal belang op afgelegen boerderijlocaties.
      features:
        - Stabiel rompontwerp voor staande bemanning bij de inspectie van parellijnen
        - Plat dek met antislipoppervlak voor veilige bewegingen van de bemanning
        - Laag vrijboord voor gemakkelijke toegang tot oesternetten en oogst
        - Eenvoudige buitenboordconfiguratie voor eenvoudig onderhoud ter plaatse
        - Corrosiebestendig buis- en beslagpakket voor continue blootstelling aan zout water
    - title: Ocean Ranching en maritieme verbetering
      subtitle: Transport van jonge vis, kooionderhoud, monitoringondersteuning
      description: Ocean ranching-operaties omvatten het vrijgeven van jonge dieren in beheerde mariene omgevingen, het monitoren van de groei en het onderhouden van verbeteringsstructuren. Werkboten moeten levend jongvee in beluchte containers vervoeren, monitoringapparatuur aan boord hebben en toegang krijgen tot ondiepe vrijlatingslocaties aan de kust. Het ontwerp van de romp moet een evenwicht bieden tussen draagvermogen en geringe diepgang voor toegang tot het strand en de riviermonding.
      features:
        - Dekruimte voor beluchte transportcontainers voor jonge vis en monitoringapparatuur
        - Geringe diepgang voor toegang tot uitzetlocaties op stranden en in estuaria
        - Gemakkelijk landen op het strand — versterkte kiel en boegbescherming
        - Bevestigingspunten voor apparatuur voor monitoring-elektronica en bemonsteringsuitrusting
        - Zwaar belastbare Hypalon-buizen voor duurzaamheid in gemengde zand- en zeewateromstandigheden
