content_challenge:
  tagline: De uitdaging
  title: Jachttenders vereisen<br />prestaties en presentatie
  subtitle: Een jachttender is meer dan een bijboot — het is een verlengstuk van het moederschip en een statement van kwaliteit.
  paragraphs:
    - Jachteigenaren en kapiteins hebben tenders nodig die goed presteren, compact kunnen worden opgeborgen en mooi worden gepresenteerd. De aanbesteding moet de esthetiek van het jacht aanvullen en tegelijkertijd betrouwbaar transport voor gasten en bemanning bieden.
    - "**Opslag is van cruciaal belang** — De tender moet op het dek, in een garage of op davits passen. Gewicht is van belang voor lanceer- en herstelsystemen. Paddle Board Overstock RIB's bieden uitstekende vermogen-gewichtsverhoudingen met compacte opslagprofielen."
    - '**Prestatieverwachtingen zijn hoog** — Gasten verwachten een soepele, droge rit wanneer ze naar de wal worden overgebracht. Motoropties moeten snelheid, bereik en geluidsniveaus in evenwicht brengen voor een premiumervaring. Voor chartervluchten loopt de tender dagelijks en moet bestand zijn tegen veelvuldig gebruik.'
    - '**Uiterlijk is belangrijk** — Een slecht passende of versleten tender doet afbreuk aan de algehele presentatie van het jacht. Aangepaste buiskleuren, stoffering en branding zorgen ervoor dat de tender eruit ziet alsof hij erbij hoort.'
content_solution:
  tagline: Onze oplossing
  title: Tenderconfiguraties<br />Voor elke jachttoepassing
  subtitle: Paddle Board Overstock RIB tenders kunnen worden aangepast aan uw schip, bedrijfstype en opslagvereisten — van specificaties van superjachtbouwers tot chartervlootprogramma's.
  list:
    - Aangepaste buiskleuren die passen bij of complementeren met het moederschip – elke RAL-kleur beschikbaar voor Hypalon of PVC buizen
    - Op maat gemaakte bekleding en stiksels - premium vinyl van maritieme kwaliteit met bijpassende kleuren en geborduurd logo
    - 'Console- of helmstokbesturing: kies op basis van gebruikspatroon en voorkeur van de machinist'
    - Glasvezel deep-V romp voor soepel, droog varen in wisselende zeeomstandigheden
    - Compacte opslag - leeglopen of nesten voor opslag in dekgarage, locker of davit
    - Hypalon buizen voor UV-bestendigheid en langdurig behoud van uiterlijk
    - Hefpunten en sleepringen standaard op alle modellen
    - Optionele boegafdekking, volledige afdekking en beschermende schuurbeschermers
    - 'Motorbereik: 15 HP tot 60 HP — buitenboordmotor- of helmstokconfiguraties'
    - OEM/private labeling beschikbaar voor jachtbouwers en maritieme dealers
content_segments:
  tagline: Klantprofielen
  title: Jachttenderoplossingen<br />Op klanttype
  subtitle: Verschillende segmenten van de jachtindustrie hebben unieke eisen. Paddle Board Overstock configureert offertes die bij elke toepassing passen.
  items:
    - title: Bouwers van superjachten
      subtitle: OEM aanbestedingsintegratie — aangepaste afmetingen, kleuren en materialen
      description: "Jachtbouwers worden geconfronteerd met een terugkerende uitdaging: elk nieuw schip heeft unieke afmetingen, gewichtslimieten en esthetische verwachtingen. De tender moet perfect integreren met het davitsysteem van het moederschip, binnen de precieze afmetingen van de garage passen en passen bij de ontwerptaal van een jacht van meerdere miljoenen euro's. Elke discrepantie – verkeerde buiskleur, onjuiste plaatsing van het hijspunt, incompatibel gewicht – vertraagt ​​de levering en heeft een slechte weerslag op de bouwer. Paddle Board Overstock werkt rechtstreeks samen met inkoop- en ontwerpteams van bouwers om aanbestedingen uit te voeren met aangepaste RAL-buiskleuren, bijpassende bekleding, consolepanelen met merknaam en volledige OEM documentatiepakketten."
      features:
        - Aangepaste maatspecificaties die overeenkomen met de beperkingen van garage en davit
        - Elke RAL-buiskleur en bijpassende bekleding – er worden ontwerpgoedkeuringsmonsters meegeleverd
        - OEM branding op console, buis en rugleuningen
        - Bevestiging van hijspunt en davit-passing voor elk model
        - Rompgewicht geoptimaliseerd voor gespecificeerde lanceer- en herstelsystemen
        - Planning van bulkleveringen afgestemd op productietijdlijnen
    - title: Bedrijven voor jachtbeheer
      subtitle: Op de vloot gestandaardiseerde aanbestedingen – wereldwijde ondersteuning, minimale stilstand
      description: "Beheermaatschappijen houden toezicht op meerdere jachten die actief zijn in de Middellandse Zee, het Caribisch gebied, de Stille Zuidzee en daarbuiten. Hun kernbehoefte is betrouwbaarheid: een kapotte tender in een afgelegen haven betekent overuren van de bemanning, klachten van gasten en dure vervangingen op het laatste moment. Gestandaardiseerde vlootspecificaties verminderen de trainingstijd van de bemanning op schepen en vereenvoudigen het beheer van reserveonderdelen. Paddle Board Overstock biedt vlootprijzen voor meerdere schepen, consistente specificaties voor alle bestellingen en wereldwijde ondersteuning voor reserveonderdelen voor managementbedrijven met schepen in meerdere regio's."
      features:
        - Gestandaardiseerde specificaties voor het gehele beheerde wagenpark
        - Verwisselbare reserveonderdelen voor alle vloottenders
        - Vlootprijzen en volumekortingen voor bestellingen van meerdere eenheden
        - Wereldwijde beschikbaarheid van reserveonderdelen – snelle verzending naar elke haven
        - Consistente service- en onderhoudsdocumentatie voor de bemanning
        - Coördinatie van levering van meerdere eenheden naar verschillende scheepslocaties
    - title: Exploitanten van jachtcharters
      subtitle: Hoogfrequente dagelijkse werkzaamheden – duurzaamheid zonder afbreuk te doen aan het uiterlijk
      description: 'Chartertenders hebben te maken met het zwaarste operationele schema in de jachtindustrie: dagelijkse gastentransfers, reizen aan wal, watersportondersteuning en havenaanbestedingen – vaak meer dan 200 operaties per charterseizoen. De tender moet er bij elke gastoverdracht onberispelijk uitzien en bestand zijn tegen continu instappen, blootstelling aan zout water en motoruren. Verslechtering van de uitstraling is een directe zakelijke zorg: een versleten tender heeft invloed op gastenbeoordelingen en chartertarieven. Paddle Board Overstock configureert chartertenders met verbeterde bekleding, robuuste Hypalon buizen en versterkte handlinggebieden voor duurzaamheid op de lange termijn, waarbij de presentatiekwaliteit behouden blijft.'
      features:
        - Zwaar uitgevoerde Hypalon buizen — levensduur van 5-8 jaar bij dagelijkse charterdienst
        - Versterkte opstaptreden en handgrepen voor veelvuldig gebruik
        - Premium vlekbestendige vinylbekleding - eenvoudige reiniging tussen charters door
        - Gemakkelijk schoon te maken antislipoppervlakken
        - Betrouwbare buitenboordmotoren met gemakkelijke servicetoegang voor een korte doorlooptijd
        - Materialen van cosmetische kwaliteit die hun uiterlijk gedurende charterseizoenen behouden
    - title: Jachtdealers en -makelaars
      subtitle: Betrouwbaar aanbestedingsaanbod voor de voltooiing van het schip en de verkoopwaarde
      description: Dealers en makelaars hebben behoefte aan een stabiel aanbod van hoogwaardige aanbestedingen die een aanvulling vormen op de schepen die zij verkopen – passend bij de merkpositionering en ter verbetering van de koperservaring. Een inconsistente aanbesteding of leveringsvertraging kan de overdracht van een jacht vertragen of de presentatie van een aanbieding verminderen. Dealers hebben consistente kwaliteit voor alle batches, betrouwbare doorlooptijden en concurrerende prijzen nodig om de marges op peil te houden. Paddle Board Overstock biedt dealerinventarisprogramma's met seizoensleveringsplanning, co-brandingopties voor showroomweergave en prioriteitstoewijzing tijdens het hoogseizoen.
      features:
        - Voorraadbevoorradingsprogramma's met modellen die op aanvraag beschikbaar zijn
        - Seizoensgebonden leveringsplanning afgestemd op de overdrachtskalender
        - Dealer co-branding op console en buizen voor showroomdisplay
        - Consistente kwaliteit en specificatie voor alle batchbestellingen
        - Concurrerende dealerprijzen met op volume gebaseerd niveau
