hero:
  tagline: Uitrusting
  title: Productieapparatuur & Machines
  subtitle: Industrieel apparatuur op het gebied van snijden, lassen, printen en assemblage
  back_label: Terug naar de fabriek
  back_link: /factory
categories:
  - title: Snijden en materiaalvoorbereiding
    items:
      - name: Automatische PVC snijmachine
        spec: CNC-gecontroleerd, 6,5 m × 2,5 m, 0,1 mm nauwkeurigheid
        desc: Computergestuurde automatische snijmachine PVC voor en drop-stitch stoffen. Inbouwsoftware optimaliseert het materiaalgebruik tot onder de 5% afval.
      - name: Stofspreider
        spec: 3 m maximale breedte, spanninggestuurde voeding
        desc: Legt stof in enkele of meerdere lagen met gecontroleerde spanning om vervorming te voorkomen voordat hij snijdt.
  - title: Lassen en lijmen
    items:
      - name: Warmteverzegelingsmachine
        spec: Heteluchtlassen, variabel 200–600 °C, 0,5–5 m/min
        desc: Hetelucht warmteafdichtingsmachine voor het hechten en lassen van PVC laminaten, railbanden en kamernaden. Gebruikt voor het hechten, afdichten en samensmelten drop-stitch van kernverbindingen.
      - name: Diëlektrische RF-pers
        spec: 15 kW, platen 2000 × 600 mm
        desc: Radiofrequentielaspers voor hoofd-longitudinale naaden, transom-tot-buis verbindingen en grootkamerfabricage.
      - name: CNC-Bestuurde RF-lasser
        spec: 8 kW, XY-tafel 2500 × 1200 mm
        desc: Programmeerbaar gebogen naad lassen voor complexe geometrieën, logo-embossing en precisiepatchwork.
  - title: Dek Kunst & Afwerking
    items:
      - name: EVA Dek Snijmachine
        spec: CNC mes-snijden, 2 m breed
        desc: Precisie-snijden van EVA dekschuimpanelen voor art-series deckpatronen. Elk paneel wordt in vorm gesneden voor een naadloze volledige pasvorm.
      - name: Deklamineerpers
        spec: Temperatuur- en drukregeling
        desc: Bevestigt EVA dekpanelen aan het boardoppervlak met consistente hechting over het hele dek.
  - title: SUP Drukwerk & Decoratie
    items:
      - name: Digitale printer
        spec: High-resolution inkjet, tot 2 m printbreedte
        desc: Direct-to-fabric digitale print voor full-colour SUP deck graphics. Print aangepaste patronen, verlopen en foto-kwaliteit afbeeldingen met UV-bestendige watergedragen inkten.
      - name: Zefdrukmachine
        spec: Handmatig en semi-automatisch, meerkleurige registratie
        desc: Zeefdruk voor SUP board logo's, merktekens en herhalende patronen. Biedt duurzame, ondoorzichtige prints met levendige kleurverzadiging.
  - title: Eindmontage
    items:
      - name: Klepmomentstations
        spec: Gekalibreerde functie-test van 10 cycli
        desc: Installeert en draait inflatieventielen aan, test vervolgens elke klep door 10 open/sluit-cycli.
      - name: Fin Box & D-Ring Setter
        spec: Jig-uitgelijnd, lijm uitgehard
        desc: Positioneert en hecht fin boxes, D-ringen en handvatten op exacte deck locaties volgens model specificatie.
  - title: Testen & Kwaliteitscontrole
    items:
      - name: Universele treksterketester
        spec: 50 kN capaciteit
        desc: Treksterkte, rek bij breuk en scheurvoortplantingstests voor stofpartijen.
      - name: Luchtdichtheidstestapparaat
        spec: Programmeert, 30-min druk vasthouden
        desc: Geautomatiseerde drukvasthoudtest voor elke buiskamer vóór montage.
      - name: Naadpeeltester
        spec: Gemotoriseerde 180° peel bij 100 mm/min
        desc: Las- en gelijmde naad-peelsterkte testen volgens intern protocol.
      - name: Xenon-Arc verweringskamer
        spec: 2000 h blootstelling
        desc: UV weerstandstest voor kleurverandering en sterktebehoud.
cta:
  title: Geïnteresseerd in een fabrieksrondleiding?
  desc: Wij verwelkomen bezoekers in onze Weihai faciliteit. Zie onze apparatuur en processen persoonlijk.
  label: Plan een bezoek →
  link: /contact
tldr:
  summary: Paddle Board Overstock opereert in 12.000 m² productieoppervlak uitgerust met automatische PVC snijmachines, hoogfrequente RF-lassers, EVA dek-snij- en afwerkingsstations, hittepersen en eindmontagerigs. Elke plaat ondergaat een drukproef van 1,25x de nominale waarde.
  points:
    - Automatisch PVC snijden met CNC precisie
    - Hoogfrequente RF-lassen voor naadintegriteit
    - EVA dek-snij- en handafwerkingsstations
    - Klep-aandraaimoment en fin box montagerigs
    - 1,25x nominale drukcontrole op 100% van de platen
