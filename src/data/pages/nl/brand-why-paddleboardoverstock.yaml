features3_reasons:
  tagline: Waarom voor Paddle Board Overstock kiezen
  title: 'Zeven redenen om met ons samen te werken'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Echte productie, geen handel'
      description: 'Wij zijn eigenaar en beheerder van een fabriek van 12.000 m². Als u met Paddle Board Overstock samenwerkt, werkt u rechtstreeks met de mensen die uw producten ontwerpen, ontwikkelen en bouwen — zonder tussenpersonen.'
      icon: tabler:building-factory
    - title: '2. Engineering-gedreven aanpak'
      description: 'Ons ontwerpproces begint bij het gebruiksscenario, niet bij de productcategorie. We optimaliseren rompvorm, materiaalkeuze en configuratie voor hoe de boot daadwerkelijk gebruikt zal worden.'
      icon: tabler:engine
    - title: '3. Gecertificeerde kwaliteit'
      description: 'CE-gecertificeerd, ISO-kwaliteitssysteem, BSCI-conform, REACH-conform, USCG-goedgekeurd. Onze 64 CE-gecertificeerde modellen voldoen aan internationale normen — niet slechts beloftes.'
      icon: tabler:certificate
    - title: '4. Flexibel OEM/ODM'
      description: 'Tube-kleuren, console-indeling, branding, verpakking — wij passen alles aan op uw specificaties. Geen druk voor minimale bestellingen. Begin met een prototype en schaal met vertrouwen.'
      icon: tabler:adjustments
    - title: '5. Wereldwijde logistiek'
      description: 'VS-magazijn in Californië, directe verzending vanuit Qingdao, luchtfracht voor dringende orders. Wij regelen de douanedocumentatie en papierwerk.'
      icon: tabler:truck-delivery
    - title: '6. Levenslange ondersteuning'
      description: 'Wij ondersteunen boten die we 20 jaar geleden bouwden. Originele reserveonderdelen, technisch advies, reparatiebegeleiding — ons team staat voor u klaar wanneer u ons nodig hebt.'
      icon: tabler:lifebuoy
    - title: '7. Eerlijke specificaties'
      description: 'Echte laadvermogens, echte afmetingen, echt gewicht. Geen marketinginflatie. Wat wij publiceren is wat u krijgt — geverifieerd door onafhankelijke tests.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Vertrouwd door merken wereldwijd
  title: Wat onze partners zeggen
  items:
    - content: 'We hebben met verschillende fabrikanten in China gewerkt, maar Paddle Board Overstock onderscheidt zich door technische ondersteuning en consistente kwaliteit. Ze behandelen ons merk als hun eigen.'
      name: '— OEM-partner, Europees watersportmerk'
    - content: 'Hun Hypalon RIB''s varen al meer dan 5 jaar in onze vloot. Minimaal onderhoud, uitstekende UV-bestendigheid. De 5 jaar garantie op de tubes geeft ons vertrouwen.'
      name: '— Vlootoperator, resortgroep in het Midden-Oosten'
    - content: 'Het team van Paddle Board Overstock hielp ons een custom SUP-boardontwerp te ontwikkelen van concept tot productie in 90 dagen. De kwaliteit overtrof onze verwachtingen.'
      name: '— Distributeur, Australische watersport'
cta:
  title: 'Klaar om het verschil te ervaren?'
  subtitle: 'Neem contact op met ons team om uw project te bespreken. Geen verplichtingen — gewoon eerlijk advies over productie.'
  actions:
