features3_reasons:
  tagline: Waarom kiezen voor Paddle Board Overstock
  title: Zeven redenen om met ons samen te werken
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Echte productie, geen handel
      description: We bezitten en exploiteren een fabriek van 12.000 m². Wanneer u koopt bij Paddle Board Overstock, koopt u rechtstreeks van de mensen die uw board ontwerpen, produceren en bouwen — geen tussenpersonen, geen detailhandelsopslag.
      icon: tabler:building-factory
    - title: 2. Technisch-Geleide Benadering
      description: Ons ontwerpproces begint met de use case, niet met de productcategorie. We optimaliseren de rompvorm, materiaalselectie en configuratie op basis van hoe het board daadwerkelijk gebruikt zal worden.
      icon: tabler:engine
    - title: 3. Bewezen Kwaliteit
      description: Elk bord wordt voor verzending 100% drukgetest bij 1,25x de nominale PSI. Een foutvrije snelheid van 99,3% — gemeten op elke batch, niet slechts beweerd.
      icon: tabler:shield-check
    - title: 4. Peddelaar-Eerste Ontwerp
      description: 'Dekkunst, kleurenseries, accessoirebevestigingen en complete pakketten — boards ontworpen rondom echt peddelen: toeren, yoga, vissen, fitness en plezier voor het gezin.'
      icon: tabler:swimming
    - title: 5. Wereldwijde logistiek
      description: Directe verzending van onze fabriek in Weihai naar peddelaars in 50+ landen, met volledige tracking en douaneafhandeling.
      icon: tabler:truck-delivery
    - title: 6. Levenslange ondersteuning
      description: We ondersteunen de boards die we jaren geleden hebben gebouwd. Echte reserveonderdelen, technisch advies, reparatiebegeleiding — ons team is beschikbaar wanneer u ons nodig heeft.
      icon: tabler:lifebuoy
    - title: 7. Eerlijke specificaties
      description: Echte laadcapaciteiten, echte afmetingen, echt gewicht. Geen marketinginflatie. Wat wij publiceren, is wat je krijgt — geverifieerd door onafhankelijk testen.
      icon: tabler:ruler-measure
testimonials:
  tagline: Vertrouwd door merken wereldwijd
  title: Wat Onze Partners Zeggen
  items:
    - content: Mijn board arriveerde fabrieksvers met alles in de doos. Twee seizoenen van wekelijks peddelen en het houdt nog steeds perfect lucht vast.
      name: — Sarah M., Weekendpeddelaar, Florida
    - content: Ik heb wekenlang specificaties vergeleken voordat ik kocht. Paddle Board Overstock was het enige merk dat echte gewichten en echte drukwaarden publiceerde. Wat ze vermelden is wat je krijgt.
      name: — Tomasz K., Toeristische Peddelaar, Polen
    - content: Het hele gezin peddelt nu. We begonnen met één board en eindigden met vier — de kwaliteit maakte de keuze makkelijk.
      name: — Angela R., Familie Peddelaar, Australië
cta:
  title: Klaar om het verschil te ervaren?
  subtitle: Vragen over maatvoering, specificaties of verzending? Ons peddelteam geeft eerlijke antwoorden — geen verkooppraatje.
  actions:
