content_challenge:
  tagline: De uitdaging
  title: Visseriboten hebben<br />stabiliteit, bereik en duurzaamheid nodig
  subtitle: 'Of u nu commerciële vissersvaartuigen exploiteert, een coöperatieve vloot beheert of vischarters beheert: uw boot moet elke dag betrouwbaar presteren.'
  paragraphs:
    - Visseriboten hebben stabiele platforms nodig om te werken met lijnen, vangst te hanteren en veilig over het dek te bewegen. Opblaasboten en RIB's bieden inherent stabiliteit door hun tubedesign — een belangrijk voordeel ten opzichte van stijve rompen van vergelijkbare lengte.
    - Brandstofefficiëntie is van belang voor visserijactiviteiten waarbij de bedrijfskosten rechtstreeks van invloed zijn op de winstgevendheid. RIB's en opblaasbare boten zijn lichter dan gelijkwaardige starre boten, vereisen minder vermogen en verbruiken minder brandstof - van cruciaal belang voor commerciële exploitanten die dagelijks boten exploiteren en coöperaties die de vlootbudgetten beheren.
    - 'Duurzaamheid in mariene omgevingen is essentieel. Zout water, UV-blootstelling en constant gebruik vereisen materialen die zware omstandigheden kunnen weerstaan ​​zonder degradatie. Voor commerciële en coöperatieve exploitanten heeft betrouwbaarheid een directe invloed op het inkomen: een kapotte boot betekent verloren visdagen.'
    - Paddle Board Overstock visserijconfiguraties omvatten hengelhouders, fishfinders, aasputten, livewells en oplossingen voor vrachtafhandeling die zijn ontworpen voor serieuze visserijtoepassingen bij commerciële, coöperatieve en recreatieve activiteiten.
content_solution:
  tagline: Onze oplossing
  title: Visserijklaar configuraties
  subtitle: Elke Paddle Board Overstock visseriboot kan worden geconfigureerd voor uw specifieke vissertoepassing.
  list:
    - Hengelhoudermontage — fabrieksgemonteerd of klaar voor latere installatie
    - Montageplaat voor fishfinder/GPS op de consolepositie
    - Opties voor aasput of levendput voor charter- en commerciële exploitanten
    - Koelbox/opslagconfiguraties voor vangstverwerking
    - Deep-V romp voor offshore capaciteit — stabiel in stilstand, soepel bij snelheid
    - PVC of Hypalon tube-opties — Hypalon voor langdurige UV-blootstelling
    - Buitenboordbereik van 15 PK tot 115 PK afhankelijk van model en toepassing
content_segments:
  tagline: Visserijprofielen
  title: Oplossingen voor opblaasbare vissersboten<br />Per type operator
  subtitle: 'Van sportvissen aan de kust tot commerciële beugvisserij: verschillende visserijactiviteiten vereisen verschillende rompconfiguraties, vermogensbereiken en opstellingen aan dek. Wij maken elke boot op maat, passend bij de visserij, de wateren en de werkstijl.'
  items:
    - title: Commerciële visserijbedrijven
      subtitle: Vlootwerkboten voor dagelijkse visserijactiviteiten, netbehandeling, vangsttransport
      description: Commerciële visserijbedrijven exploiteren werkboten voor het uitzetten en ophalen van netten, het onderhoud van vallen, het beugvissen en het transport van de vangst. Deze boten werken elke dag in zoutwateromgevingen en moeten bestand zijn tegen zware belastingen, constante dekbediening en lange bedrijfsuren. Brandstofefficiëntie en weinig onderhoud zijn van cruciaal belang voor de winstgevendheid van het wagenpark. Het schip moet stabiele werkplatforms bieden waar de bemanning de uitrusting en de vangst kan hanteren onder wisselende zeeomstandigheden.
      features:
        - Platte dekindeling voor het hanteren van netten, het stapelen van vallen en het opslaan van vis
        - Brandstofefficiënte 40-115 HP buitenboordmotor voor lage dagelijkse bedrijfskosten
        - Robuuste Hypalon buizen voor slijtvastheid bij dagelijks gebruik
        - Versterkte stootranden voor frequent contact met dok en schip
        - Zelflozend dek voor eenvoudig afspoelen na gebruik
        - Vlootprijzen en consistente specificaties voor exploitanten van meerdere schepen
    - title: Chartervissers
      subtitle: Comfort voor meerdere passagiers, handling van de vangst, veiligheidsgecertificeerd
      description: Exploitanten die vischarters voor een halve of hele dag aanbieden, van kustrifvissen tot offshore bodemvissen. Uw boot heeft passagierszitplaatsen nodig met veiligheidscertificeringen, voldoende dekruimte voor meerdere vissers en geïntegreerde livewells om het aas en de vangst gedurende de hele reis vers te houden. Het comfort van gasten heeft rechtstreeks invloed op reisbeoordelingen, herhaalde boekingen en online beoordelingen.
      features:
        - Consolebesturing met schokabsorberende kuipstoelen
        - In de fabriek geïnstalleerde hengelhouders (4–8 posities)
        - 60–115 HP buitenboordbereik voor kruissnelheden op zee
        - CE Categorie C- of B-certificering voor commerciële passagiersvluchten
        - Bimini of T-top zonnescherm voor comfort van de gasten tijdens langere reizen
    - title: Ambachtelijke en kleinschalige commerciële vissers
      subtitle: Betrouwbare werkboten voor het dagelijks levensonderhoud
      description: 'Onafhankelijke vissers die afhankelijk zijn van hun boot als hun voornaamste bron van inkomsten: het uitzetten van netten, het verzorgen van visfuiken of het werken aan de kust. Uw prioriteit is een laag brandstofverbruik, eenvoudig onderhoud dat u zelf kunt uitvoeren en een boot die een gemiddelde lading vangst en uitrusting aankan zonder dat dit ten koste gaat van de stabiliteit.'
      features:
        - Brandstofzuinige 15–40 HP buitenboordmotor voor lage bedrijfskosten
        - Hypalon CSM buizen voor langere UV- en slijtvastheid
        - Platte dekindeling voor nethantering en visopslag
        - Gemakkelijke strandlandingsmogelijkheden met opblaasbare kielbescherming
    - title: Visserijcoöperaties
      subtitle: Vangstinzameling, ledenvervoer, bevoorradingsdistributie
      description: Visserijcoöperaties exploiteren gemeenschapsvloten voor het verzamelen van de vangst van aangesloten vissers, het transporteren van voorraden naar afgelegen vissersgemeenschappen en het distribueren van de oogst naar markten. Deze werkboten hebben een hoog laadvermogen, een betrouwbare dagelijkse werking en eenvoudig onderhoud op afgelegen locaties nodig. Coöperaties zijn vaak actief in ontwikkelingsregio's waar de beschikbaarheid van onderdelen en de toegang tot service beperkt zijn, waardoor eenvoudige buitenboordconfiguraties en duurzame constructie essentieel zijn.
      features:
        - Hoog laadvermogen voor het vervoeren van vangst en voorraden
        - Eenvoudige buitenboordmotorconfiguratie voor eenvoudig onderhoud ter plaatse
        - Robuuste PVC of Hypalon constructie voor budgetflexibiliteit
        - Plat dek met bevestigingspunten voor het vastzetten van lading
        - Brandstofefficiënte werking die de coöperatieve bedrijfskosten minimaliseert
    - title: Sport- en spelvisliefhebbers
      subtitle: Prestaties en stijl voor serieuze vissers
      description: Ervaren vissers die op zoek zijn naar een capabel visplatform dat snelheid levert op verre terreinen, stabiele stand-up gevechtsposities en eersteklas pasvorm en afwerking. De boot moet zich thuis voelen, of hij nu twee mijl uit de kust naar een rif vaart of afgelegen estuariene binnenwateren verkent.
      features:
        - Diepe V RIB romp voor soepel varen tijdens het hakken
        - Fishfinder/GPS-montageplaat vooraf bedraad op de console
        - Baitwell en koeler geïntegreerd in de achterbankmodule
        - Aangepaste EVA dekkleuropties passend bij boot-/buisafbeeldingen
    - title: Visgids en ecotouroperators
      subtitle: Begeleide viservaringen voor bezoekende vissers
      description: Gidsen die kleine groepen bezoekende vissers meenemen naar productieve visplekken, waarbij vissen vaak wordt gecombineerd met ecotoeristische elementen zoals vogels kijken of mangroveverkenning. De boot moet droog en comfortabel varen voor gasten die niet gewend zijn aan kleine boten, met gemakkelijke instap- en schaduwmogelijkheden.
      features:
        - Bimini-top of T-top bevestigingspunten in de fabriek geïnstalleerd
        - Gladde instapladder voor gemakkelijk opstappen
        - Stille 4-takt buitenboordmotor om verstoring tot een minimum te beperken
        - Droge opbergvakken voor gastentelefoons, portemonnees, camera's
