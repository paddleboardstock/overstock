hero:
  tagline: Ons team
  title: 'De mensen achter Aquafarer<br />— engineering van vrijheid op het water'
  subtitle: 'Opgericht in 2012 in Qingdao, China, werd Aquafarer gebouwd door maritieme ingenieurs, materiaalwetenschappers en watersportliefhebbers die geloofden dat professionele opblaasbare watersportvaartuigen wereldwijd toegankelijk moesten zijn.'
  image:
    src: /images/team-all.webp
    alt: Aquafarers teamfoto — engineering, productie en leidinggevenden
founding:
  tagline: Onze oprichting
  title: 'Van een kustwerkplaats<br />naar een faciliteit van 12,000 m²'
  subtitle: 'Aquafarer werd opgericht door een team maritieme ingenieurs met decennia aan gecombineerde ervaring in het ontwerp van opblaasbare boten, PVC/Hypalon-fabricage en wereldwijde productie van maritieme apparatuur.'
  items:
    - title: "Opgericht: 2012"
      description: 'Gevestigd in Qingdao, China — een belangrijke maritieme hub met een diepe scheepsbouwtraditie.'
      icon: tabler:calendar
    - title: 200-300 medewerkers
      description: 'Inclusief 50+ R&D-ingenieurs, kwaliteitsspecialisten en productietechnici.'
      icon: tabler:users
    - title: Faciliteit van 12,000 m²
      description: 'Toegewijde fabriek met 6 productielijnen voor RIB''s, opblaasbare boten en SUP-boards.'
      icon: tabler:building-factory
    - title: 'Meer dan 50 landen'
      description: 'Export naar Europa, Amerika, het Midden-Oosten, Azië-Pacific en Afrika.'
      icon: tabler:globe
