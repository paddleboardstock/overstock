philosophy:
  tagline: Ontwerpfilosofie
  title: Engineering-Geleid Ontwerp<br />— Elk Detail Telt
  subtitle: Onze engineeringfilosofie is gebaseerd op drie principes die elk product dat we bouwen sturen.
  list:
    - 'Betrouwbaarheid Eerst: Elk product wordt getest om de echte omstandigheden te doorstaan — van koudwaterexpedities tot tropische strandverhuur. We over-engineeren waar het het meest telt.'
    - 'Precisie in Productie: Onze faciliteiten gebruiken geavanceerd snijden, hoogfrequente lastechnieken en geautomatiseerde druktstests. Elke naad, elke klep, elke fitting voldoet aan vastgelegde specificaties.'
    - 'Continue Innovatie: Ons R&D-team evalueert voortdurend nieuwe materialen, productiemethoden en ontwerpverbeteringen. We wachten niet op problemen — we anticiperen erop.'
cta:
  title: Wilt u een project bespreken met ons team?
  subtitle: Ons team staat klaar om u te helpen het juiste board, accessoires en uitrusting voor uw peddelstijl te kiezen.
  actions:
    - variant: primary
      text: Neem contact op met ons team
      href: /contact
    - text: Bekijk onze producten
      href: /products
