philosophy:
  tagline: Ontwerpfilosofie
  title: 'Engineeringgedreven ontwerp<br />— elk detail telt'
  subtitle: 'Onze engineeringfilosofie draait om drie principes die elk product dat we bouwen sturen.'
  list:
    - 'Betrouwbaarheid voorop: elk Aquafarer-product wordt getest om echte omstandigheden te doorstaan — van reddingsoperaties in koud water tot verhuur op tropische resorts. We over-engineeren waar het het meest telt.'
    - 'Productieprecisie: onze faciliteiten gebruiken CNC-snijden, hoogfrequent lassen en geautomatiseerde druktests. Elke naad, elke klep, elke fitting voldoet aan gedocumenteerde specificaties.'
    - 'Continue innovatie: ons R&D-team evalueert voortdurend nieuwe materialen, productiemethoden en ontwerpverbeteringen. We wachten niet op problemen — we anticiperen erop.'
cta:
  title: 'Wilt u een project bespreken met ons team?'
  subtitle: 'Onze ingenieurs staan klaar om advies te geven over productkeuze, maatwerk en OEM/ODM-partnerschappen.'
  actions:
    - variant: primary
      text: Neem contact op met ons team
      href: /contact
    - text: Bekijk onze producten
      href: /products
