hero:
  tagline: Ons team
  title: De Mensen Achter Paddle Board Overstock<br />— Vrijheid in Water Engineering
  subtitle: Opgericht in 2012 in Weihai, China, is Paddle Board Overstock gebouwd door maritieme ingenieurs, materiaalkundigen en watersportliefhebbers die geloofden in het wereldwijd toegankelijk maken van professionele opblaasbare paddleboards.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock volledige teamfoto — engineering, productie en leiderschap
founding:
  tagline: Onze Oprichting
  title: Van een Kustwerkplaats<br />tot een Faciliteit van 12.000 m²
  subtitle: Paddle Board Overstock is opgericht door een team van maritieme ingenieurs met tientallen jaren gecombineerde ervaring in het ontwerp van opblaasbare SUP, drop-stitch constructie en wereldwijde watersportproductie.
  items:
    - title: 'Opgericht: 2012'
      description: Opgericht in Weihai, China — een belangrijke maritieme hub met diepe scheepsbouwtraditie.
      icon: tabler:calendar
    - title: 200-300 Werknemers
      description: Inclusief 14+ R&D-ingenieurs, kwaliteitsspecialisten en productietechnici.
      icon: tabler:users
    - title: 12.000 m² Faciliteit
      description: Toegewijde productieplant met 6 productielijnen voor SUP boards en accessoires.
      icon: tabler:building-factory
    - title: 50+ Bediende Landen
      description: Export naar Europa, Amerika, Midden-Oosten, Azië-Pacific en Afrika.
      icon: tabler:globe
