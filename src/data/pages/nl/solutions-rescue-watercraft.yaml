content_challenge:
  tagline: De uitdaging
  title: Reddingsoperaties vereisen<br />oncompromisloze betrouwbaarheid
  subtitle: Zoek- en reddingsorganisaties opereren onder extreme veiligheidsverantwoordelijkheid; elke bootstoring heeft onaanvaardbare gevolgen.
  paragraphs:
    - 'Bij reddingsoperaties wordt de marge tussen succes en mislukking gemeten in minuten. De boot moet onmiddellijk klaar zijn om te water te gaan, onder zware omstandigheden te opereren en veilig met passagiers terug te keren. De verantwoordelijkheid voor de veiligheid is absoluut: een mechanisch defect tijdens een reddingsmissie brengt geen reparatiekosten met zich mee, het is een verloren leven.'
    - SAR boten hebben hoge snelheid nodig om slachtoffers snel te bereiken, gecombineerd met uitzonderlijke stabiliteit voor veilige bergingsoperaties. Ze moeten reddingsuitrusting, medische benodigdheden en communicatieapparatuur meenemen – vaak in een beperkte dekruimte. Boten die in overheidsdienst opereren, hebben ook een lange levensduur nodig (10-15+ jaar) om de budgetten voor overheidsopdrachten te rechtvaardigen.
    - Zicht, zowel voor de bestuurder als voor zoekacties, is cruciaal. Het consoleontwerp moet 360-graden zicht bieden, en de boot moet goed zichtbaar zijn voor vliegtuigen en andere vaartuigen.
    - Paddle Board Overstock reddings-RIB's zijn van kiel tot top ontworpen voor deze eisen — met zelflozende dekken, versterkte rompen, navigatiesuites en sleepostandaards standaard op patrouillemodellen.
content_solution:
  tagline: Onze oplossing
  title: Doelgebouwde reddings-RIB's
  subtitle: Elke Paddle Board Overstock reddingsboot is ontworpen om aan de SOLAS- en nationale SAR-normen te voldoen of deze te overtreffen.
  list:
    - Zelflozend dek — water loopt automatisch weg voor stabiliteit tijdens bergingsoperaties
    - Versterkte deep-V romp — ruwwatercapaciteit met voorspelbaar gedrag op snelheid
    - Volledige navigatieverlichting — dag en nacht inzetbaar onder alle weersomstandigheden
    - Sleephaak en sleeplijn — klaar voor het slepen van vaartuigen of reddingsslee-operaties
    - Montageplaten voor uitrusting — radio, zoeklicht, sirene en medische apparatuur
    - Meerdere motorconfiguraties — enkele buitenboordmotor of dubbele motorredundantie
    - Hoogzichtbare tubekleuren — oranje, geel of rood voor maximale zichtbaarheid
content_segments:
  tagline: Reddingsprofielen
  title: Zoek- en reddingsoplossingen voor waterscooters<br />Op organisatietype
  subtitle: Verschillende reddingsorganisaties opereren onder verschillende mandaten, budgetcycli en operationele omgevingen – van vrijwilligers aan de kust tot nationale kustwachtvloten. We configureren elke reddingsactie RIB zodat deze overeenkomt met het missieprofiel.
  items:
    - title: Kustwacht en overheid SAR Agentschappen
      subtitle: Absolute veiligheidsverantwoordelijkheid – bedrijfskritische vlootnormen
      description: Overheidsinstanties voor SAR (search and rescue) dragen de hoogste verantwoordelijkheid voor veiligheid in maritieme operaties. Elke boot moet vlekkeloos presteren onder extreme omstandigheden — uitval van apparatuur tijdens een reddingsmissie is geen optie. Inkoopbeslissingen worden gedreven door de totale cost of ownership over een levensduur van 10-15 jaar, niet door de aanschafprijs. Instanties hebben vaartuigen nodig die jarenlange kustpatrouilles doorstaan, voldoen aan strenge nationale normen en consistente prestaties leveren over verspreide standplaatsen. Volledige compliance-documentatie en meerjarige servicecontracten zijn verplicht.
      features:
        - SOLAS en nationaal SAR documentatiepakket voor naleving van standaarden
        - Gemeenschappelijkheid van onderdelen in de hele vloot – verminder de complexiteit van de inventaris op stationniveau
        - Twin-engine configuratie voor bedrijfskritische redundantie
        - Ontwerp met een levensduur van 10-15 jaar met geplande onderhoudsprogramma's
        - Geschikt voor alle weersomstandigheden - versterkte deep-V romp voor ruwe zeetoestanden
    - title: Badmeester- en strandreddingsdiensten
      subtitle: Snelstartoperaties in ondiep water
      description: Gemeentelijke en strandwachtdiensten hebben behoefte aan snelle responsvaartuigen die door brandingszones kunnen varen, in ondiepe kustwateren kunnen opereren en binnen enkele minuten zwemmers of noodlijdende vaartuigen kunnen bereiken. Uitrusting moet licht genoeg zijn om over het strand te worden gesleept door een klein voertuig of handmatig.
      features:
        - Ondiepe diepgang RIB romp voor surfzone en kustgebruik
        - Geschikt voor strandlancering, met handgreep voor het optillen van de boeg en kielbeschermer
        - Geïntegreerd reddingsslede- of reddingszwemmerplatform
        - Goed zichtbare oranje of gele buiskleuren standaard
    - title: Brandweerafdelingen
      subtitle: Integratie van brandpompen, montage van apparatuur, snelle reactie
      description: Marine-eenheden voor brandredding reageren op branden aan de waterkant, scheepsbranden en reddingsincidenten op het water. Deze boten moeten brandpompen, monitoren, slangenopslag en ademhalingsapparatuur aan boord hebben – allemaal geïntegreerd in een stabiel, snel reagerend platform. Afdelingen gebruiken deze schepen ook voor overstromingen en wederzijdse hulpoperaties. De console-indelingen moeten geschikt zijn voor pompbedieningen, radiosystemen en noodverlichting, zonder dat dit ten koste gaat van de dekruimte voor beweging van de bemanning.
      features:
        - Op de boeg gemonteerde brandmonitor met pompintegratiepakket
        - Speciale uitrustingsmontage voor brandpomp, slangopslag en BA-sets
        - Console-indeling configureerbaar voor pompbediening, radio en noodverlichting
        - Zelflozend dek voor bluswaterafvoer en stabiliteit
        - 'Pakket voor nachtoperaties: zoeklicht, scèneverlichting, blauw/rode lichtbalk'
    - title: Maritieme politie en havenbeveiliging
      subtitle: Verbod, patrouille, boardingoperaties
      description: Maritieme wetshandhavingseenheden hebben schepen nodig die in staat zijn tot snelle achtervolging, het aan boord gaan van verdachte schepen en havenveiligheidspatrouilles. Deze boten moeten beschikken over een veilige opslagruimte voor handhavingsuitrusting en wapens, communicatie-integratie met walcommando's en voldoende dekruimte voor operaties van het boardingteam. De capaciteit voor nachtoperaties en een onopvallende aanpak zijn essentieel voor verbodsmissies.
      features:
        - Achtervolgingsmogelijkheden op hoge snelheid - planerende romp met een topsnelheid van meer dan 40 knopen
        - Beveiligde wapenkluis en opbergvakken voor handhavingsuitrusting
        - Console-integratie voor politieradio-, MDT- en communicatiesystemen
        - 'Pakket voor nachtoperaties: IR-spot, FLIR-montage, verborgen verlichting'
        - Verstevigd opstapplatform met antislipoppervlak
        - Blauw/rood noodverlichting en sirenesysteem
    - title: Vrijwilligers SAR en non-profitorganisaties
      subtitle: Door subsidies gefinancierde, gemeenschapsgerichte kust- en meeractiviteiten
      description: 'In de gemeenschap gevestigde reddingsgroepen opereren in meren, rivieren en kustgebieden waar de SAR-dekking van de overheid beperkt is. Vaak gefinancierd door donaties of overheidssubsidies, hebben deze organisaties maximale capaciteit per dollar nodig: een betrouwbaar, onderhoudsarm schip dat vrijwilligers veilig kunnen besturen met minimale specifieke training. Subsidieaankoopcycli betekenen dat boten moeten voldoen aan de compliance-eisen en tegelijkertijd binnen vaste budgetten moeten blijven.'
      features:
        - Configuratie met één buitenboordmotor, geoptimaliseerd voor lagere aanschaf- en bedrijfskosten
        - PVC constructie voor minder onderhoud en eenvoudige reparatie ter plaatse
        - Multifunctionele console die de elektronische complexiteit voor vrijwillige operators minimaliseert
        - Documentatiepakket voor subsidienaleving voor financieringsaanvragen
        - Lichtgewicht ontwerp voor strandlancering zonder speciale aanhanger of kraan
    - title: Redding en rampenbestrijding bij overstromingen
      subtitle: Overstromingen in het binnenland, ondiep water, omgevingen vol puin
      description: "Redding bij overstromingen is een duidelijk operationeel profiel: boten opereren in overstroomde stedelijke gebieden, met puin gevulde stromingen en extreem ondiep water waar onderwater obstakels onzichtbaar zijn. Exploitanten hebben schepen nodig die door ondergelopen straten kunnen navigeren, zich door puin heen kunnen duwen en slachtoffers uit gebouwen en voertuigen kunnen halen. Het vermogen tot een geringe diepgang is van cruciaal belang, evenals het vermogen om op stroming te opereren met gevaar voor haken en ogen. Deze boten worden vaak ingezet door brandweerkorpsen, civiele bescherming en NGO's voor rampenbestrijding."
      features:
        - Romp met ultra-ondiepe diepgang - opereren in water van 30-50 cm
        - Puinafbuigende boog en versterkte buisbescherming voor obstakels onder water
        - Zelflozend dek voor afvoer van overstromingswater en herstel van slachtoffers
        - Goed zichtbare oranje of gele buizen voor zichtbaarheid bij luchtverkenning
        - Lichtgewicht ontwerp voor helikoptertransport en inzet op de weg
        - Versterkte hijspunten voor takel- en touwreddingsoperaties
