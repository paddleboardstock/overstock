reasons:
  tagline: Het Aquafarer Verschil
  title: Wat Ons Onderscheidt
  isBeforeContent: false
  columns: 3
  items:
    - title: Echte productie, geen handel
      description: We bezitten en exploiteren een fabriek van 12.000 m². Wanneer u samenwerkt met Aquafarer, werkt u rechtstreeks met de mensen die uw producten ontwerpen, ontwikkelen en bouwen — zonder tussenpersonen.
      icon: tabler:building-factory
    - title: Ingenieursgestuurde aanpak
      description: Ons ontwerpproces begint met het gebruiksscenario, niet met de productcategorie. We optimaliseren de rompvorm, materiaalkeuze en configuratie op basis van hoe de apparatuur daadwerkelijk in commerciële omgevingen zal worden gebruikt.
      icon: tabler:engine
    - title: Gecertificeerde Kwaliteit
      description: CE gecertificeerd, ISO kwaliteitssysteem, BSCI conform, REACH conform, USCG Type III/V goedgekeurde reddingsvesten; alle producten voldoen aan de toepasselijke internationale normen.
      icon: tabler:certificate
    - title: Flexibel OEM/ODM
      description: Buis kleuren, console-indeling, branding, verpakking — we passen aan volgens uw specificaties. Geen druk tot een minimumhoeveelheid. Begin met een prototype, schaal met vertrouwen.
      icon: tabler:adjustments
    - title: Mondiale logistiek
      description: VS-magazijn in Californië, directe verzending vanuit Qingdao, luchtvracht voor dringende bestellingen. Wij regelen douanepapieren en documentatie wereldwijd.
      icon: tabler:truck-delivery
    - title: Levenslange ondersteuning
      description: Wij ondersteunen boten die we 20 jaar geleden hebben gebouwd. Originele reserveonderdelen, technisch advies, reparatiebegeleiding — ons team is beschikbaar wanneer u ons nodig hebt, waar u ook bent.
      icon: tabler:lifebuoy
testimonials:
  tagline: Vertrouwd door merken wereldwijd
  title: Wat Onze Partners Zeggen
  items:
    - content: We hebben met verschillende fabrikanten in China gewerkt, maar Aquafarer valt op vanwege hun technische ondersteuning en consistente kwaliteit. Ze behandelen ons merk alsof het hun eigen merk is.
      name: — OEM Partner, Europees Watersportmerk
    - content: Hun Hypalon RIBs zijn al meer dan 5 jaar in dienst bij onze vloot. Minimale onderhoud, uitstekende UV weerstand. De 5-jarige garantie op buizen geeft ons vertrouwen.
      name: — Vlootoperator, Midden-Oosterse Resortgroep
    - content: Het Aquafarer-team hielp ons bij het ontwikkelen van een op maat gemaakt SUP-boardontwerp van concept tot productie in 90 dagen. De kwaliteit overtrof onze verwachtingen.
      name: — Distributeur, Australische Watersport
    - content: Als eigenaar van een klein bedrijf was ik bezorgd over MOQs. Aquafarer werkte met mijn budget en hielp me mijn merk te lanceren met slechts 50 borden. Nu bestel ik er 500.
      name: — Oprichter van het merk, VS SUP Verhuurbedrijf
cta:
  title: Klaar om je waterbedrijf op te bouwen?
  subtitle: Neem contact op met ons team voor een gratis consultatie. Geen verplichtingen — alleen eerlijk advies over apparatuur en productie.
  actions:
    - variant: primary
      text: Praat met ons team
      href: /contact
    - text: Productcatalogus downloaden
      href: /resources
