hero:
  tagline: Waarom Aquafarer
  title: Anders Gebouwd. Gebouwd voor Zaken.<br />De Partner Achter Wateravonturen Wereldwijd
  subtitle: Niet zomaar een fabrikant — een zakenpartner die commerciële apparatuur ontwerpt, engineert en levert voor clubs, resorts, verhuurders en opkomende watermerken.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer productiekwaliteit en deskundigheid
pillars:
  tagline: Drie pijlers van partnerschap
  title: Waarom de waterbedrijven in de wereld kiezen voor Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Ontworpen voor commercieel gebruik
      description: Onze apparatuur is ontworpen voor dagelijks verhuur, niet voor weekendrecreatie. Commerciële PVC, versterkte drop-stitch-kernen, UV-stabiele Hypalon-opties en veldgeteste hardware betekenen lagere onderhoudskosten, langere levensduur en hogere ROI voor uw operatie.
      icon: tabler:building-factory
      callToAction:
        text: Zie commerciële productlijn
        href: /products
    - title: Van idee tot markt
      description: 'Start je watersportmerk binnen 90 dagen. Wij begeleiden je bij elke stap: conceptvalidatie, productselectie, prototype, productie, verpakkingsontwerp en wereldwijde verzending. Geen druk voor minimale bestellingen — begin klein, schaal met vertrouwen.'
      icon: tabler:rocket
      callToAction:
        text: Begin je merkreis
        href: /oem-odm-blueprint
    - title: Gebouwd voor wereldwijde omstandigheden
      description: 'Producten geoptimaliseerd voor elk klimaat: koudwaterPVCformuleringen voor Europa, UV-bestendige materialen voor het Midden-Oosten en Australië, anti-vochtbehandelingen voor Zuidoost-Azië. Elke verzending is afgestemd op de omgeving van de bestemming.'
      icon: tabler:world
