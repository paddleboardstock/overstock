hero:
  tagline: Proces
  title: Productieproces
  subtitle: Van grondstof tot zeeklaar board — elke stap onder onze controle
  back_label: Terug naar de fabriek
  back_link: /factory
intro: In tegenstelling tot merken die de productie uitbesteden aan externe fabrieken, Paddle Board Overstock bezit en exploiteert deze de volledige productieketen. Deze verticale integratie stelt ons in staat om strikte kwaliteitscontrole in elke fase te handhaven en batch na batch consistente productkwaliteit te leveren. Zo wordt een board in onze faciliteit gebouwd.
steps:
  - step: '01'
    title: Materiaalontvangst & Inspectie
    description: Elke binnenkomende partij PVC stof, drop-stitch kern, EVA schuim en hardware wordt geïnspecteerd volgens de specificaties. Stofmonsters worden getest op treksterkte, dikte-uniformiteit en UV weerstand voordat ze in productie worden gebracht. Niet-conforme materialen worden in quarantaine geplaatst en teruggegeven.
    duration: 1–2 dagen
  - step: '02'
    title: Automatisch PVC snijden
    description: Goedgekeurde stoffen worden op de automatische CNC snijmachine gelegd en met submillimeternauwkeurigheid gesneden. Computergeoptimaliseerd Nesting ordent panelen om afval te minimaliseren — meestal onder de 5%. Gesneden panelen worden gelabeld per plaatmodel en kamer, en vervolgens gebundeld voor overdracht naar de laswerkplaats.
    duration: 2–4 uur per boardkit
  - step: '03'
    title: Buishittedichting en -lassen
    description: Panelen worden gedicht en verbonden met hittesealmachines met warme-luchtlassen bij gecontroleerde temperaturen van 200–600 °C. Hoofdnaden worden versterkt met RF-diëlektrisch lassen voor luchtdichte, hoogsterkte verbindingen. Voltooide kamers worden opgeblazen tot 1,25× werkdruk voor een luchtretentievalidatie van 30 minuten.
    duration: 1–2 dagen per bord
  - step: '04'
    title: Deck Art & EVA Afwerking
    description: 'Art-series decks krijgen hier vorm: precisie-gesneden EVA schuimpanelen worden in full-deck patronen gelegd, met de hand gelijmd en bijgesneden. Gripvoll, comfortabel en duurzaam — het kenmerkende uiterlijk van elk art-series board.'
    duration: 1–2 dagen
  - step: '05'
    title: SUP Drukwerk & Decoratie
    description: SUP Kartonbordgrafieken worden aangebracht met digitale druk voor fullcolour foto-kwaliteit ontwerpen, en zeefdruk voor duurzame logo's en herhalende patronen. Prints worden uitgehard en verzegeld voor UV slijtvastheid.
    duration: 1–2 dagen
  - step: '06'
    title: Eindmontage & Tuigage
    description: 'Boards krijgen hun laatste componenten: kleppen worden aangedraaid en functioneel getest, D-ringen, handgrepen en vinkasten worden gemonteerd, en de riembevestiging wordt bevestigd. Elke board volgt een checklist van 100 punten met verplichte goedkeuring bij elke fase.'
    duration: 2-3 dagen
  - step: '07'
    title: Kwaliteitstesten & Inspectie
    description: 'Elke voltooide plank ondergaat verplichte kwaliteitspoort: kamerluchtretentietest, controles van systeemfunctie, bevestigingskoppelcontrole en cosmetische inspectie. Maatwerk- en prototypebouw krijgen ook zeeproeven in het water over snelheid, handling, stabiliteit en uithoudingsvermogen.'
    duration: 1–2 dagen
  - step: '08'
    title: Inpakken & verzenden
    description: Planken worden leeggelopen, opgerold en verpakt in reisrugzakken met pomp, peddel, vin, riem en reparatieset, en vervolgens verpakt voor koerier en vrachtverzending. Elk pakket is voorzien van model, serienummer en bestemming. We verzenden naar 50+ landen wereldwijd.
    duration: 1 dag
cta:
  title: Bekijk onze apparatuur en machines
  desc: Ontdek de industriële apparatuur achter elk Paddle Board Overstock bord.
  label: Bekijk apparatuur →
  link: /factory/equipment
tldr:
  summary: Paddle Board Overstock volgt een strikt meerfasig productieproces, van de inspectie van het ruwe materiaal tot snijden, lassen, dekarts en EVA afwerking, assemblage, 1,25x genormeerde druktest, en uiteindelijke kwaliteitscontrole. 100% van de boards wordt drukgetest, 99,3% is vrij van defecten.
  points:
    - 'Inspectie van ruwe materialen: trek-, scheur- en UV testen'
    - Automatisch CNC snijden en hoogfrequent RF-lassen
    - Handmatig geassembleerde EVA dekarts met blokkering die niet vervaagt
    - 1,25x genormeerde druk vasthouden gedurende 24-48 uur voor elke eenheid
    - 100-punten eindinspectie voor elk board
