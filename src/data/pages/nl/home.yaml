content_customer_types:
  tagline: Voor wie wij produceren
  title: 'Gebouwd voor B2B-kopers<br />— niet voor consumenten'
  subtitle: 'Aquafarer produceert voor vier klanttypen. Elk heeft andere prioriteiten — en wij beantwoorden ze allemaal.'
  items:
    - title: Merkeigenaren / Private Label
      description: 'Custom productontwerp, private-label graphics, compliance-documentatie onder uw merk en toegewijde engineeringondersteuning van concept tot container.'
      icon: tabler:palette
      cta: OEM/ODM-offerte aanvragen
      cta_href: /request-quotation
    - title: Distributeurs / Groothandelaren
      description: 'Gebiedsbescherming, concurrerende groothandelsprijzen, marketingondersteuningspakketten, producttraining en volledige compliance-documentatie voor uw markt.'
      icon: tabler:world
      cta: Dealerschap aanvragen
      cta_href: /dealers-distributors
    - title: Resorts / Verhuurders
      description: 'Commerciële duurzaamheid, advies over vlootomvang, gemengde containerorders, reserveonderdelenstrategie en uitrustingspakketten met resortbranding.'
      icon: tabler:beach
      cta: Commercieel pakket aanvragen
      cta_href: /solutions/resorts
    - title: Redding / Overheid / Professioneel
      description: 'Hypalon/CSM-constructie, SOLAS-complianceopties, projectspecifieke certificering, ondersteuning bij aanbestedingsdocumentatie en engineering onder NDA.'
      icon: tabler:shield
      cta: Bespreek een project
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM-mogelijkheden
  title: 'Wat u krijgt<br />met Aquafarer'
  subtitle: 'Directe toegang tot de fabriek met volledige ondersteuning op het gebied van engineering, kwaliteit en compliance — geen handelsbedrijf.'
  columns: 2
  items:
    - title: OEM/ODM-customization
      description: 'Custom rompontwerp, buismateriaal (PVC of Hypalon/CSM), console-indeling, zitplaatsen, branding, kleuren en verpakking. Van kleine aanpassingen tot volledig custom engineering.'
      icon: tabler:adjustments
    - title: Lage MOQ, snelle samples
      description: 'RIB: 2–5 eenheden (bestaande mal). SUP: 5–10 eenheden per SKU. Eigen mallen: 200+ eenheden. Pre-productiesamples met uw branding in 7–14 dagen.'
      icon: tabler:rocket
    - title: Productieklare kwaliteit
      description: 'Elke eenheid drukgetest op 1,25× de nominale PSI gedurende 24–48 uur. 99,3% foutvrij volgens AQL 2,5 / ISO 2859. 100-punten kwaliteitschecklist per romp.'
      icon: tabler:certificate
    - title: Volledige compliance-documentatie
      description: 'CE volgens 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI-socialaudit, REACH-compliance, UKCA-markering. Modelspecifieke conformiteitserklaring en bouwersplaatgegevens inbegrepen.'
      icon: tabler:file-certificate
    - title: Levertijd van 30–45 dagen
      description: 'Standaardproductie 30–45 dagen FOB Qingdao. Prototypes in 7–14 dagen. Spoedproductie mogelijk. Containerlaadplannen en ISPM-15-verpakking inbegrepen.'
      icon: tabler:truck-delivery
    - title: After-sales & reserveonderdelen
      description: '5 jaar garantie op boten/kajaks/RIB’s, 2 jaar op SUP/accessoires. Levering van reserveonderdelen met prioriteitsverzending. Ondersteuning bij garantieafhandeling.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Productcategorieën
  title: '5 categorieën,<br />64 CE-gecertificeerde modellen'
  subtitle: 'Van 2,4 m RIB-tenders tot 15 voet SUP-boards — allemaal geproduceerd in onze ISO 9001-faciliteit in Qingdao.'
  items:
    - title: RIB-boten
      description: '2,4 m tot 7,0 m met aluminium of GRP-romp. PVC- of Hypalon/CSM-buizen. CE volgens 2013/53/EU. Patrouille-, duik-, reddings- en commerciële configuraties.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Opblaasbare boten
      description: '2,0 m tot 5,0 m met aluminiumvloer, triplexvloer of airdeck-opties. Vis-, recreatie- en tendermodellen.'
      icon: tabler:sailboat
      link: /products
    - title: SUP-boards
      description: '9 tot 15 voet in 4-inch en 6-inch Drop-Stitch. Allround-, touring-, yoga- en vismodellen. Commerciële kwaliteit beschikbaar.'
      icon: tabler:swimming
      link: /products
    - title: Kajaks
      description: 'Opblaasbare kajaks voor 1 tot 3 personen. Recreatie- en touringmodellen met Drop-Stitch-vloeropties.'
      icon: tabler:kayak
      link: /products
    - title: Veiligheidsaccessoires
      description: 'CE-gecertificeerde reddingsvesten, werptouwen, reparatiesets, pompen en navigatielichten. Door USCG goedgekeurde type III/V reddingsvesten.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Fabriekssterkte
  title: 'Audit-klare productie<br />in Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO 9001-faciliteit — echte fabrikant, geen handelsbedrijf</h3>
  items:
    - title: 6 toegewijde productielijnen
      description: 'Gescheiden lijnen voor RIB, opblaasbare boten, SUP, kajaks, veiligheidsuitrusting en OEM/ODM. Elk met eigen QC-controlepunten en productieplanning.'
    - title: 100% drukgetest
      description: 'Elke opblaasbare kamer wordt opgepompt tot 1,25× de nominale PSI en 24–48 uur vastgehouden. Testresultaten gekoppeld aan het serienummer van de romp (HIN).'
    - title: Traceerbaarheid per romp
      description: 'Productieregistraties op HIN-niveau met 21+ gegevensvelden per romp: materiaalbatch, lasser-ID, druktestresultaat, eindconfiguratie en leverbestemming.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: De 12.000 m² ISO 9001-productiefaciliteit van Aquafarer in Qingdao met RIB-productielijnen

content_compliance:
  tagline: Compliance & kwaliteitsbewijs
  title: 'Gedocumenteerd bewijs,<br />niet alleen beweringen'
  subtitle: 'Elke compliance-claim wordt ondersteund door modelspecifieke documentatie die u kunt verifiëren.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Kwaliteitsmanagementsysteem gecertificeerd door TÜV Rheinland/SGS. Jaarlijkse surveillance-audits. Gedocumenteerde QC-processen van materiaalontvangst tot verzendvrijgave.'
      icon: tabler:certificate
    - title: CE volgens 2013/53/EU (RCD)
      description: '64 modellen met modelspecifieke conformiteitserklaringen. Conformiteitsbeoordeling volgens de toepasselijke modules. HIN-registratie en bouwersplaatgegevens voor elke romp.'
      icon: tabler:file-certificate
    - title: BSCI-socialaudit
      description: 'Jaarlijkse BSCI-audit door SGS. Gecontroleerde ethische arbeidspraktijken, veiligheid op de werkplek en milieubeheer in onze hele faciliteit.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Alle PVC- en lijmmaterialen voldoen aan de EU-REACH-verordening. UKCA-markering beschikbaar voor de Britse markt. Veiligheidsinformatiebladen op aanvraag.'
      icon: tabler:shield-check

steps:
  title: Het OEM/ODM-proces — van briefing tot container
  items:
    - title: 'Stap 1: <span class="font-medium">Eisen</span>'
      description: 'Deel uw productspecificaties, doelmarkt, hoeveelheid en compliance-eisen. Ons engineeringteam beoordeelt binnen 48 uur.'
      icon: tabler:file-text
    - title: 'Stap 2: <span class="font-medium">Voorstel</span>'
      description: 'U ontvangt een gedetailleerd voorstel met specificaties, materiaalopties, MOQ, prijzen, levertijd en compliance-scope voor uw markt.'
      icon: tabler:clipboard-list
    - title: 'Stap 3: <span class="font-medium">Prototype</span>'
      description: 'Pre-productiesample met uw branding in 7–14 dagen. Volledige kwaliteittests op 1,25× de nominale druk. Samplekosten verrekend met de productie.'
      icon: tabler:settings
    - title: 'Stap 4: <span class="font-medium">Productie</span>'
      description: 'Productie van 30–45 dagen FOB Qingdao na goedkeuring van het sample. QC-controlepunten tijdens het proces, druktests en 100-punten eindinspectie van elke eenheid.'
      icon: tabler:building-factory
    - title: 'Stap 5: <span class="font-medium">Levering</span>'
      description: 'Containerlaadplan, ISPM-15 houten verpakking, compliance-documentatiepakket en FOB Qingdao-verzending met volledige exportdocumentatie.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Het OEM/ODM-productieproces van opblaasbare boten bij Aquafarer — van ontwerp tot containerverscheping

