faqs:
  title: FAQ over B2B-inkoop
  subtitle: 'Veelgestelde vragen van merken, distributeurs en commerciële exploitanten over OEM/ODM-productie met Aquafarer.'
  columns: 2
  items:
    - title: Bent u een fabrikant of handelsbedrijf?
      description: 'Wij zijn een verticaal geïntegreerde fabriek met volledige controle over kwaliteit, materialen en levertijden. Bedrijfslicentie en productiescope verifieerbaar tijdens een fabrieksaudit.'
      icon: tabler:building-factory
      category: all
    - title: Hoe verloopt uw OEM/ODM-proces?
      description: 'Van beoordeling van eisen (48 uur) naar voorstel, prototype (7–14 dagen) en productie (30–45 dagen FOB Qingdao). Volledige engineeringondersteuning, compliance-documentatie en traceerbaarheid per romp gedurende het hele traject.'
      icon: tabler:route
      category: all
    - title: Wat zijn uw MOQ-vereisten?
      description: 'RIB-boten: 2–5 eenheden per model (bestaande mal), 200+ voor eigen mallen. SUP-boards: 5–10 eenheden per SKU. Gemengde containerorders mogelijk. Sampleorders vanaf 2–5 eenheden voor evaluatie.'
      icon: tabler:sort-ascending
      category: all
    - title: Welke customization-opties zijn beschikbaar?
      description: 'Rompontwerp, buismateriaal (PVC of Hypalon/CSM), buisdiameter, console-indeling, zitplaatsen, besturing, brandstofsysteem, dekindeling, merkkleuren, logographics, EVA-pad-ontwerp, verkoopverpakking en branding van de handleiding.'
      icon: tabler:adjustments
      category: all
    - title: Welke compliance-documenten kunt u leveren voor mijn markt?
      description: 'CE-conformiteitserklaring volgens 2013/53/EU, UKCA-markering, ISO 9001-certificaat (SGS), BSCI-auditrapport, REACH-compliance, materiaaltestrapporten, druktestlogboeken en modelspecifieke bouwersplaatgegevens. Marktspecifieke documentatie op aanvraag.'
      icon: tabler:file-certificate
      category: all
    - title: Wat is de levertijd voor samples en productie?
      description: 'Pre-productiesamples: 7–14 werkdagen. Standaardproductie: 30–45 dagen FOB Qingdao. Spoedproductie mogelijk tegen meerkosten. In het hoogseizoen (maart–juni) kunnen levertijden oplopen.'
      icon: tabler:clock
      category: all
    - title: Kan ik een fabrieksaudit of live videotour regelen?
      description: 'Ja. Audits op locatie in onze faciliteit in Qingdao zijn welkom met 3–5 dagen vooraf. Live videotours via WhatsApp/Zoom direct beschikbaar. Inspecties door derden (SGS, BV, TÜV) mogelijk.'
      icon: tabler:video
      category: all
    - title: Welke kwaliteitsinspecties worden vóór verzending uitgevoerd?
      description: 'Drukholdetest op 1,25× nominale druk (24–48 uur), naadpeeltests, 100-punten eindinspectiechecklist, dimensionele verificatie, cosmetische inspectie, verificatie van compliance-documentatie en controle van de verpakkingsintegriteit. Alles volgens ISO 9001-procedures.'
      icon: tabler:clipboard-check
      category: all

