features:
  id: features
  tagline: Waarom Kopen Bij Paddle Board Overstock
  title: Echte Fabriek,<br />Reële besparingen
  subtitle: Fabrieksdirecte overstock en opruimingspakketten voor SUP's — gecertificeerde kwaliteit zonder de winkelprijsopslag.
  columns: 2
  items:
    - title: Tot 60% korting op de winkelprijs
      description: Wij verkopen rechtstreeks fabrieksoverschotten en opruimingspartijen — geen tussenpersonen, geen winkelopslag. Dezelfde borden die elders voor de volle prijs worden verkocht, hier tegen opruimingsprijzen.
      icon: tabler:rocket
    - title: Complete pakketten
      description: 'Elke SUP wordt geleverd als een compleet pakket: board, reistas, handpomp, verstelbare peddel, afneembare vin, coil-leash en reparatieset.'
      icon: tabler:clipboard-list
    - title: Gecertificeerde Kwaliteit
      description: 13 CE-gecertificeerde SUP-modellen volgens de toepasselijke EU-richtlijnen. Elk bord wordt voor verzending 100% drukgecontroleerd bij 1,25x de nominale PSI. 99,3% foutvrije rate volgens AQL 2.5.
      icon: tabler:certificate
    - title: Nee MOQ — Bestel één bord
      description: Overstockopruiming betekent dat bestellingen van één stuk welkom zijn. Voeg een bord toe aan het winkelmandje, ga afrekenen, klaar. Geen minimumorder, geen offerteproces.
      icon: tabler:adjustments
    - title: Snelle wereldwijde verzending
      description: Op voorraad bestellingen worden binnen 2-3 werkdagen vanuit Weihai verzonden. Gevolgde levering naar 50+ landen in de EU, Noord-Amerika, Azië-Pacific en daarbuiten.
      icon: tabler:truck-delivery
    - title: 2 Jaar SUP Garantie
      description: Elk SUP board en accessoire is 2 jaar gedekt — drop-stitch naden, inflatieventielen en accessoires inbegrepen. Claims worden binnen dagen afgehandeld, niet weken.
      icon: tabler:lifebuoy
