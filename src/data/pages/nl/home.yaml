faqs:
  title: SUP Bestellen & Product FAQ
  subtitle: Veelgestelde vragen over onze uitverkoop SUP borden, bestellingen, betaling, verzending en garantie.
  columns: 2
  items:
    - title: Is SUP moeilijk om te leren?
      description: Helemaal niet. De meeste beginners staan al op en peddelen tijdens hun eerste sessie. Onze allround SUP boards hebben extra brede, stabiele platforms die speciaal zijn ontworpen voor beginnende peddelaars. Begin op rustig water en je zult binnen enkele minuten varen.
      icon: tabler:swimming
      category: sup
    - title: Wat is het gewichtslimiet?
      description: Onze alles-in-één SUPs ondersteunt tot 220 lbs en de touring- en yogaplatforms ondersteunen tot 250 lbs. Elke productpagina vermeldt de exacte draagcapaciteit voor rijders, zodat je het board kunt afstemmen op jouw behoeften.
      icon: tabler:adjustments
      category: sup
    - title: Kan ik reizen met een opblaasbare SUP?
      description: Absoluut. Elk Paddle Board Overstock-board past in een rugzakformaat draagtas. Met slechts 18-22 lbs is het gemakkelijk te dragen naar het strand, het meer of door luchthaven terminals. Controleer uw bagagebeleid van de luchtvaartmaatschappij voor het reizen.
      icon: tabler:truck-delivery
      category: sup
    - title: Wat zit er in de doos?
      description: Elke Paddle Board Overstock SUP bevat het board, een re rugzak, handpomp, verstelbare peddel, verwijderbare vin, spiraal leash en reparatieset.
      icon: tabler:clipboard-list
      category: sup
    - title: Waarom zijn uw prijzen lager dan de winkelprijzen?
      description: We verkopen fabrieksoverschotten en uitverkooppartijen rechtstreeks vanuit onze eigen productiefaciliteit in Weihai, China — geen tussenpersonen, geen winkelopslag. Dat betekent complete SUP-pakketten met tot 60% korting op de gebruikelijke winkelprijzen, met dezelfde CE-gecertificeerde kwaliteit.
      icon: tabler:certificate
      category: orders
    - title: Hoe plaats ik een bestelling en betaal ik?
      description: Voeg uw SUP-pakket toe aan de winkelwagen en reken veilig af met Stripe of PayPal. We accepteren alle grote creditcards en betaalkaarten. Elke bestelling wordt per e-mail bevestigd met een volledige factuur.
      icon: tabler:file-text
      category: orders
    - title: Verzendt u wereldwijd?
      description: Ja. We verzenden naar 50+ landen in de EU, Noord-Amerika, Azië-Pacific, het Midden-Oosten en Afrika. Bestellingen op voorraad worden doorgaans binnen 2-3 werkdagen verzonden, met tracking voor elk pakket.
      icon: tabler:route
      category: orders
    - title: Welke garantie hebben SUP-borden?
      description: 'Elk SUP board en accessoire wordt gedekt door een garantie van 2 jaar — inclusief het board zelf, drop-stitch naden en inflatieventielen. Claims worden binnen dagen opgelost, niet weken: dien online in en wij repareren of vervangen.'
      icon: tabler:lifebuoy
      category: orders
