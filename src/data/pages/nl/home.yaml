content_workshop:
  isReversed: true
  tagline: Fabriekskracht
  title: Waarom onze uitverkoopprijzen<br />Echt zijn
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Echte fabriek, echte besparing — elk board wordt verzonden vanuit onze faciliteit in Weihai</h3>
  items:
    - title: Zelfde productielijnen als grote merken
      description: Onze 12.000 m² grote fabriek in Weihai produceert boards voor internationale merken en onze eigen overtollige batches op dezelfde lijnen met hetzelfde materiaal.
    - title: 100% Druk getest
      description: Elk board wordt opgepompt tot 1,25x de aangegeven PSI en vastgehouden voordat het wordt verzonden. 99,3% foutloos per AQL 2,5 / ISO 2859.
    - title: Geen tussenpersonen
      description: Boards worden rechtstreeks vanuit de fabriek bij u thuis geleverd. Geen distributeur-opslag, geen winkelopslag — zo blijven de uitverkoopprijzen tot 60% onder de adviesprijs.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² fabriek in Weihai met opblaasbare SUP productielijnen
content_compliance:
  tagline: Naleving & Kwaliteitsbewijs
  title: Gecertificeerde Kwaliteit,<br />Gedocumenteerd
  subtitle: Elke nalevingsclaim wordt ondersteund door certificaten en model-specifieke documentatie die voor verificatie beschikbaar is.
  items:
    - title: ISO9001:2015
      description: Kwaliteitsmanagementsysteem gecertificeerd door TÜV Rheinland/SGS. Jaarlijkse controle-audits. Gedocumenteerde QC-processen van inkomend materiaal tot verzending.
      icon: tabler:certificate
    - title: CE Gecertificeerd
      description: 13 CE-gecertificeerde SUP modellen conform toepasselijke EU-richtlijnen, elk met een model-specifieke Verklaring van Overeenstemming en fabrieksplaatgegevens.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Alle PVC en lijm-materialen voldoen aan EU REACH regelgeving. UKCA markering beschikbaar voor de Britse markt. Materiaalveiligheidsbladen op aanvraag.
      icon: tabler:shield-check
    - title: 2 Jaar SUP Garantie
      description: Elke SUP board en accessoire is 2 jaar gedekt — drop-stitch naden, opblaasventielen en accessoires inbegrepen. Claims worden snel afgehandeld.
      icon: tabler:lifebuoy
