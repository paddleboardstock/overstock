hero:
  tagline: Over
  title: Over ons Paddle Board Overstock
  subtitle: Sinds 2012 brengen we gloednieuwe opblaasbare SUP boards in handen van peddelaars en kleine retailers in 50+ landen — overvoorraad, eerlijke prijzen en een garantie die we daadwerkelijk nakomen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Gloednieuwe opblaasbare SUP planken
direct_answer: Paddle Board Overstock is een merk voor watersportuitrusting, opgericht in 2012 en gevestigd in Weihai, China. We verkopen gloednieuwe opblaasbare SUP boards uit overbodige voorraad — een mix van overtollige productie uit onze eigen productiebasis en zorgvuldig geselecteerde voorraad van partnerfabrieken — rechtstreeks aan eindpeddelaars en aan kleine retailers in 50+ landen. Elk board is 100% onder druk getest, wordt ondersteund door een garantie van 2 jaar SUP en wordt per express of zeevracht verzonden.
tldr_points:
  - Opgericht in 2012, gevestigd in Weihai, China — een van 's werelds belangrijkste SUP productiecentra
  - 'Overvoorraadmodel: gloednieuwe borden tegen een lagere winkelprijs, geen tussenpersonen'
  - 'De voorraad is gemengde bron: overtollige productie uit onze basis plus gecontroleerde voorraad van de partnerfabriek'
  - 50+ landen bediend, 99,3% slagingspercentage voor de eindinspectie, 2 jaar SUP garantie
story_section:
  tagline: Ons verhaal
  title: Waarom we overvoorraad verkopen
  paragraphs:
    - Paddle Board Overstock gestart in 2012 in Weihai, China — een kuststad in de provincie Shandong die is uitgegroeid tot een van 's werelds belangrijkste SUP opblaasbare productiecentra. Vanuit die basis hebben we meer dan tien jaar besteed aan het maken van opblaasbare paddleboards en deze wereldwijd verschept.
    - Along the way we noticed something that shapes everything we do today: Elk productieseizoen laat gloednieuwe, prima borden achter — overtollige oplagen, geannuleerde bestellingen, kleurvarianten van vorig seizoen. Ondertussen werden onafhankelijke retailers wereldwijd buitengesloten van groothandel omdat traditionele leveranciers bestellingen op containerformaat eisten.
    - Die kloof is ons bedrijf. Door overtollige voorraad te verkopen — overtollige productie uit onze eigen basis in Weihai, plus zorgvuldig geselecteerde voorraad van partnerfabrieken — kunnen we gloednieuwe boards aanbieden tegen prijzen die ver onder de gebruikelijke detailhandel liggen, in hoeveelheden die geschikt zijn voor een enkele peddelaar of een bestelling van vijf planken. Niets is tweedehands, niets is een tweede; het is simpelweg voorraad die een klant verdient in plaats van een magazijn.
model_section:
  tagline: Ons bedrijfsmodel
  title: Hoe het Overstock-model werkt
  items:
    - title: Gloednieuw, nooit gebruikt
      description: Elke plank die we verkopen is gloednieuw en ongebruikt. Overvoorraad betekent overschot en overtollige voorraad — geen retouren, geen refurbished, geen seconden.
    - title: Gemengde bronneninventaris
      description: Onze voorraad combineert de overtollige productie van onze eigen fabriek in Weihai met voorraad geselecteerd uit partnerfabrieken die we aan dezelfde kwaliteitsnorm houden. De bronnen zijn gemengd; de standaarden niet.
    - title: Onder-Retailprijs
      description: Overvoorraadvoorraad kost ons minder om aan te schaffen, dus het kost je minder om te kopen. Geen opgeblazen verkoopprijs, geen nepkortingen — gewoon eerlijke prijzen op echte voorraad.
    - title: Groothandel voor kleine bedrijven
      description: Groothandel begint bij 5 borden, niet met containerladingen. Kleine retailers kunnen alle op voorraad zijnde modellen in één bestelling combineren en kiezen tussen express- of zeevracht.
    - title: Direct-naar-U verzending
      description: Bestellingen worden rechtstreeks van onze logistieke basis in Weihai bij u thuis verzonden in 50+ landen — express voor monsters en kleine bestellingen, geconsolideerde zeevracht voor groothandel.
quality_section:
  tagline: Kwaliteit & Garantie
  title: De kwaliteit achter elk bord
  subtitle: Overstockprijzen betekenen nooit versoepelde normen. Elke plank — ongeacht de bron — doorloopt hetzelfde proces voordat hij verzendt.
  items:
    - title: 100% drukgetest
      description: Elk afzonderlijk board wordt opgepompt en druktesten uitgevoerd tot 15 PSI voordat het wordt verzonden. Geen enkel board wordt ongetest verzonden, ongeacht waar de voorraad vandaan komt.
    - title: Overbelast getest tot 1,25x
      description: Boards uit onze productieruns worden steekproefsgewijs getest boven de nominale druk — gedurende 24–48 uur op 1,25x werkdruk gehouden om naden, ventielen en drop-stitch constructie te verifiëren.
    - title: 99,3% doorloopslag bij de eindinspectie
      description: Ons eindinspectieproces slagen 99,3% van de boards als defectvrij — en het kleine gedeelte dat faalt komt nooit in onze overvoorraad terecht.
    - title: 2 Jaar SUP Garantie
      description: Elk SUP board wordt geleverd met een 2-Jaar SUP Garantie die fabricagefouten dekt. Dezelfde garantie geldt voor elke klant in al onze 50+ markten.
