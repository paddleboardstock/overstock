team_section:
  tagline: Het Team
  title: De mensen achter de boards
  description: Onze vestiging in Weihai huisvest een 14+ sterk onderzoek- en ontwikkelingsteam dat materialen, structureel ontwerp en productieprocessen behandelt. Daaromheen werkt het bredere team dat kwaliteitscontrole, voorraad, logistiek en de ondersteuning verzorgt die je bereikt wanneer je contact met ons opneemt — dezelfde mensen, of je nu één board of twintig koopt.
