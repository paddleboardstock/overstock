hero:
  tagline: Zuidoost-Azië
  title: SUP Groothandelsboards voor<br />Zuidoost-Aziatische bedrijven
  subtitle: Eilandresorts, strandclubs en paddleshops van de Filipijnen tot Bali en Phuket — gloednieuwe overbodige boards van 5 exemplaren, gemengde modellen, verzonden uit China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Overbodige SUP borden voor Zuidoost-Aziatische resorts en paddleshops
direct_answer: Paddle Board Overstock levert gloednieuwe overtollige opblaasbare SUP boards aan bedrijven in heel Zuidoost-Azië — eilandresorts, strandclubs, verhuurbedrijven en kleine retailers in de Filipijnen, Indonesië, Thailand, Vietnam, Maleisië en daarbuiten. De groothandel begint met 5 boards met gemengde modellen in één bestelling, verzonden vanuit Weihai, China per express air of consolidated sea freight transport. Elke board is 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Gemengd model groothandel van 5 boards — gebouwd voor resorts en kleine winkels, niet voor containerladingen
  - Korte vrachtroutes van China naar Zuidoost-Aziatische havens en luchthavens
  - Duurzame, hoge UV planken geschikt voor tropisch, het hele jaar door gebruik
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De Zuidoost-Aziatische SUP Markt
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: de activiteitenbalie van het resort, de exploitant van de strandclub en de Island Paddle School.
    - De retailscene in de regio wordt gedomineerd door door eigenaren gerunde bedrijven die zowel toeristen als een snelgroeiende lokale peddelgemeenschap bedienen. Ze bestellen in kleine batches — 5 tot 20 planken — en ze hebben planken nodig die bestand zijn tegen tropische UV, zoutwater- en dagelijkse verhuurcycli, niet prototypes van beursen.
  customer_types:
    - title: Island Resorts & Beach Clubs
      description: Resortactiviteitenprogramma's voegen SUP hun aanbod aan, bestellen gemengde vloten die zowel beginners als terugkerende gasten bedienen.
    - title: Verhuur- en touroperators
      description: Exploitanten die uurlijkse verhuur en mangrove- of lagunetochten aanbieden, waarbij versleten vlootborden seizoensgebonden worden vervangen.
    - title: Lokale Paddle Shops
      description: Kleine winkels bedienen de groeiende lokale gemeenschap van de regio SUP , van weekendpeddelaars tot SUP yogalessen.
shipping_section:
  title: Schip naar Zuidoost-Azië
  paragraphs:
    - Zuidoost-Azië is een van onze dichtstbijzijnde vrachtregio's vanuit Weihai, China — korte zeeroutes en directe snelluchtroutes houden zowel transittijd als vrachtverkeer kostenvriendelijk. Express luchtvracht neemt monsters en 1–3 boordorders in spoedorders; Consolidated Sea Freight is de economische keuze voor groothandelsbestellingen van 5–20 schepen naar grote regionale havens.
    - Wij voorzien de commerciële factuur en paklijst die uw makelaar nodig heeft, met de juiste HS-codes en opgegeven waarden. Invoerrechten en belastingen volgen de regels van uw land en worden door de importeur betaald.
  customs_note: Douaneprocedures verschillen tussen AS EAN-leden. Controleer de invoerregels van uw land voor opblaasbare sportuitrusting en vraag in uw aanvraag of u specifieke documentatie nodig heeft — wij stellen die op.
faq_section:
  title: Zuidoost-Azië FAQ
  items:
    - q: Naar welke Zuidoost-Aziatische landen verzend je?
      a: De Filipijnen, Indonesië, Thailand, Vietnam, Maleisië en verder — plus speciale landgidsen voor de Filipijnen, Indonesië en Thailand. Bevestig je exacte bestemming in je offerteaanvraag.
    - q: Zijn de boards geschikt voor tropisch, het hele jaar door gebruik?
      a: Ja. De boards zijn gebouwd met een drop-stitch PVC constructie die geschikt is voor dagelijks gebruik in warme, hoge UV omstandigheden — dezelfde boards die we leveren aan verhuurwagenparken in 50+ landen. Standaardverzorging (spoelen na zout water, schaduw opbergen) houdt ze jarenlang in gebruik.
    - q: Hoe ziet een bestelling van een klein resort eruit?
      a: 'Gewoonlijk 5–15 boards: een basis van beginnersvriendelijke allroundmodellen voor gasten, plus een paar premium kunsteditie-exemplaren voor display, foto’s en verkoop. Gemengde modellen in één verzending, geprijsd op totaal aantal.'
    - q: Hoe snel kunnen boards de regio bereiken?
      a: Zuidoost-Azië is een van de kortste vrachtlijnen vanaf onze basis in Weihai. Expressluchtvervoer is de snelste optie voor monsters en kleine bestellingen; zeevracht wordt per bestemming geoffreerd voor groothandelsaantallen. Beide staan gespecificeerd in uw offerte.
