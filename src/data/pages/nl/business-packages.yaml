faq:
  title: Veelgestelde vragen over pakketten
  questions:
    - q: Wat is de minimale bestelhoeveelheid voor pakketten?
      a: Club Starterpakket heeft een minimum van 10 eenheden. Resort- en merkpakketten worden aangepast aan uw behoeften met flexibele MOQ's.
    - q: Hoe lang duurt de levering?
      a: Standaardproductie is 30-45 dagen vanaf orderbevestiging. Versnelde productie is beschikbaar tegen een extra vergoeding.
    - q: Kan ik de kleuren en branding van de apparatuur aanpassen?
      a: 'Ja. Alle pakketten zijn inclusief volledige aanpassing: bordkleuren, logo-afdrukken en verpakkingsontwerp.'
    - q: Bieden jullie after-sales ondersteuning?
      a: Ja. Elk pakket omvat toegang tot onze online onderhoudsgidsen, videotutorials en bestelsysteem voor reserveonderdelen.
