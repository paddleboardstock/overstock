features3_brand:
  tagline: Wie wij zijn
  title: Merkfundament<br />& Erfgoed
  subtitle: Het verhaal, de expertise en het wereldwijde bereik die Paddle Board Overstock definiëren als een vertrouwde fabrikant van maritieme uitrusting.
  isBeforeContent: false
  columns: 3
  items:
    - title: Over Paddle Board Overstock
      description: 'Opgericht in 2012 in Qingdao, China. Van een kustwerkplaats tot een faciliteit van 12.000 m²: het complete Paddle Board Overstock-verhaal.'
      icon: tabler:building-factory
      link: /about
    - title: Merkverhaal
      description: Hoe een team van scheepsingenieurs professionele opblaasbare waterscooters wereldwijd toegankelijk wilde maken.
      icon: tabler:book
      link: /brand-story
    - title: Expertise in de maritieme industrie
      description: 'Diepgaande materiaalwetenschap, precisieproductie en testen in de praktijk: tientallen jaren scheepsbouwkunde in elke romp.'
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Mondiale aanwezigheid
      description: Het bedient meer dan 50 landen op elk continent. Regionale expertise voor lokale wettelijke vereisten en marktvoorkeuren.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Waarom Paddle Board Overstock
      description: 'Wat ons onderscheidt: kwaliteit, maatwerk, directe fabrieksprijzen en end-to-end ondersteuning voor commerciële operators.'
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Ons team
      description: 'Maak kennis met het leiderschap: scheepsingenieurs, materiaalwetenschappers en productie-experts die Paddle Board Overstock vooruit helpen.'
      icon: tabler:users
      link: /brand/team
    - title: Techniekteam
      description: 78+ gecombineerde R&D-jaren, 40+ platforms, 12 certificeringen, 1200+ OEM-projecten. Het technische team achter elk product.
      icon: tabler:engine
      link: /engineering-team
    - title: R&D-centrum
      description: 'Romptechniek, RF-lassen, PVC-laboratorium, prototyping, testtank en kwaliteitslaboratorium: onze volledige onderzoeks- en ontwikkelingsfaciliteit.'
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Vertrouwen & Kwaliteit
  title: Certificeringen, kwaliteit<br />en bewijs
  subtitle: Onafhankelijke certificeringen, strenge tests en echt bewijs dat onze toewijding aan kwaliteit aantoont.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certificeringen
      description: CE, ISO 9001, UKCA, BSCI, REACH – volledige certificeringsdocumentatie en naleving voor mondiale markten.
      icon: tabler:shield-check
      link: /certifications
    - title: Kwaliteit en testen
      description: 'Elk product wordt vóór verzending onder druk getest. Naadsterkte, UV-bestendigheid, drijfvermogen: in elk stadium gecontroleerd.'
      icon: tabler:clipboard-check
      link: /quality
    - title: Bewijs en bewijs
      description: Testresultaten, implementatiefoto's, inspectierapporten van derden en casestudy's die de kwaliteit van Paddle Board Overstock valideren.
      icon: tabler:file-check
      link: /evidence
    - title: Kennisgrafiek
      description: 'Verken de entiteitsgrafiek van Paddle Board Overstock: producten, technologieën, certificeringen en relaties in een verbonden kennisbank.'
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Leiderschap
  title: Maak kennis met het team<br />achter Paddle Board Overstock
  subtitle: Branche-expertise die maritieme techniek, materiaalkunde, kwaliteitsmanagement en wereldwijde B2B-handel omvat.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Oprichter en CEO
      description: 15+ jaar in de maritieme productie. Voorheen leidde hij R&D bij een grote Chinese botenfabrikant. Heeft meerdere patenten op het gebied van het ontwerp van opblaasbare boten.
      icon: tabler:crown
    - title: Zhang Wei – hoofdingenieur
      description: 20+ jaar in PVC/Hypalon-fabricage en diep-V-rompontwerp. Voormalig technisch directeur bij een Europees waterbouwkundig bedrijf.
      icon: tabler:engine
    - title: Chen Ming — Hoofd R&D
      description: PhD in materiaalkunde. Gespecialiseerd in drop-stitch technologie en hoogfrequent lassen. 10+ jaar in textielcomposieten.
      icon: tabler:flask
    - title: Liu Qiang - Productiedirecteur
      description: 18+ jaar in lean manufacturing. Six Sigma zwarte band. ISO 9001 kwaliteitssystemen geïmplementeerd op alle productielijnen.
      icon: tabler:settings
    - title: Wang Fang – Kwaliteitsmanager
      description: 12+ jaar in maritieme kwaliteitscontrole. Gecertificeerd CE- en ISO-auditor. Houdt toezicht op de tests voor elke productiebatch.
      icon: tabler:shield-check
    - title: Helen Lee – Verkoopdirecteur
      description: 15+ jaar in de internationale B2B-handel. Beheerde OEM/ODM-partnerschappen in meer dan 30 landen. Vloeiend in 4 talen.
      icon: tabler:briefcase
