features3_brand:
  tagline: Wie wij zijn
  title: Merkfundament<br />& Erfgoed
  subtitle: Het verhaal, de expertise en het wereldwijde bereik die Paddle Board Overstock definiëren als een vertrouwd SUP merk.
  isBeforeContent: false
  columns: 3
  items:
    - title: Over Paddle Board Overstock
      description: Opgericht in 2012 in Weihai, China. Van een werkplaats aan de kust tot een faciliteit van 12.000 m² — het volledige Paddle Board Overstock verhaal.
      icon: tabler:building-factory
      link: /about
    - title: Merkverhaal
      description: Hoe een team van maritieme ingenieurs eropuit trok om professionele opblaasbare paddleboards wereldwijd toegankelijk te maken.
      icon: tabler:book
      link: /brand-story
    - title: Expertise in de maritieme industrie
      description: Diepe materiaalkunde, precisieproductie en tests in de echte wereld — decennia aan maritieme techniek in elk board.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Waarom Paddle Board Overstock
      description: Wat ons onderscheidt — kwaliteit, maatwerk, directe fabrieksprijzen en end-to-end ondersteuning voor elke peddelaar.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Ons team
      description: Maak kennis met het leiderschap — maritieme ingenieurs, materiaalkundigen en productiespecialisten die Paddle Board Overstock vooruitstuwen.
      icon: tabler:users
      link: /brand/team
    - title: Techniekteam
      description: 78+ gecombineerde R&D-jaren, 40+ platforms, 1.200+ engineeringprojecten. Het technische team achter elk product.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Vertrouwen & Kwaliteit
  title: Kwaliteit, Testen<br />& Bewijs
  subtitle: Rigoureuze tests, echte testgegevens en bewijs die onze toewijding aan kwaliteit aantonen.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kwaliteit en testen
      description: 'Elk product wordt vóór verzending onder druk getest. Naadsterkte, UV-bestendigheid, drijfvermogen: in elk stadium gecontroleerd.'
      icon: tabler:clipboard-check
      link: /quality
    - title: Bewijs en bewijs
      description: Testresultaten, implementatiefoto's, inspectierapporten van derden en casestudy's die de kwaliteit van Paddle Board Overstock valideren.
      icon: tabler:file-check
      link: /evidence
    - title: Kennisgrafiek
      description: Verken de Paddle Board Overstock entiteitsgrafiek — producten, technologieën, materialen en relaties in een verbonden kennisdatabase.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Leiderschap
  title: Ontmoet het team<br />Achter Paddle Board Overstock
  subtitle: Industriële expertise die zich uitstrekt over maritieme techniek, materiaalkunde, kwaliteitsbeheer en mondiale e-commerce.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Oprichter en CEO
      description: 15+ jaar in maritieme productie. Leidde eerder R&D bij een grote Chinese maritieme fabrikant. Heeft meerdere patenten in opblaasbaar productontwerp.
      icon: tabler:crown
    - title: Zhang Wei – hoofdingenieur
      description: 20+ jaar in polymeerfabricage en opblaasbare structuurontwerpen. Voormalig technisch directeur bij een Europees maritiem engineeringbedrijf.
      icon: tabler:engine
    - title: Chen Ming — Hoofd R&D
      description: PhD in materiaalkunde. Gespecialiseerd in drop-stitch technologie en hoogfrequent lassen. 10+ jaar in textielcomposieten.
      icon: tabler:flask
    - title: Liu Qiang - Productiedirecteur
      description: 18+ jaar in lean manufacturing. Rigoureuze kwaliteitsystemen geïmplementeerd op alle productielijnen.
      icon: tabler:settings
    - title: Wang Fang – Kwaliteitsmanager
      description: 12+ jaar in maritieme kwaliteitscontrole. Leidt interne kwaliteitsaudits. Toezicht op testen voor elke productiebatch.
      icon: tabler:shield-check
    - title: Helen Lee – Verkoopdirecteur
      description: 15 jaar ervaring in internationale e-commerce en logistiek. Verzendt boards naar peddelaars in 50 landen. Vloeiend in 4 talen.
      icon: tabler:briefcase
cta:
  title: Wilt u bewijs van onze kwaliteit?
  subtitle: Neem contact met ons op voor testrapporten, inspectieverslagen of om een fabriekbezoek te plannen.
  actions:
    - variant: primary
      text: Documentatie aanvragen
      href: /contact
