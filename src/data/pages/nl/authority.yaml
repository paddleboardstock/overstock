hero:
  tagline: Autoriteit Centrum
  title: Waarom Paddle Board Overstock?<br />Vertrouwen Gebouwd Over Een Decennium
  subtitle: Elk board dat we bouwen draagt het gewicht van 10+ jaar maritieme techniek, strenge kwaliteitscontrole en duizenden peddelaars op het water wereldwijd. Dit is waarom peddelaars Paddle Board Overstock kiezen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock maritieme productievoorziening en engineeringteam
