hero:
  tagline: Partnerschappen en distributie
  title: 'Word een Aquafarer-partner<br />— wereldwijd distributienetwerk'
  subtitle: "Sluit u aan bij het wereldwijde partnernetwerk van Aquafarer. Wij werken met watersportdistributeurs, bootdealers, winkeliers in apparatuur en merkpartners in meer dan 50 landen."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarers wereldwijde partner- en distributeurnetwerk
content_programs:
  tagline: Partnerprogramma's
  title: 'Partnerprogramma''s<br />gebouwd op groei'
  subtitle: 'Of u nu distributeur, dealer of merkpartner bent, Aquafarer biedt programma''s die zijn ontworpen om uw bedrijf te ondersteunen.'
  columns: 3
  items:
    - title: Distributeurprogramma
      description: 'Exclusieve territoriale distributie met volumeprijzen, marketingondersteuning en directe toegang tot de fabriek. Minimale verplichting op basis van de omvang van het gebied.'
      icon: tabler:world
    - title: Dealerprogramma
      description: 'Directe dealerprijzen, producttraining, marketingmateriaal en garantiesupport voor fysieke winkels en online winkels.'
      icon: tabler:building-store
    - title: OEM/ODM-partnerschap
      description: 'Volledige OEM- en ODM-productie met eigen branding, verpakking en productspecificaties. Van concept tot container.'
      icon: tabler:certificate
    - title: Merkpartnerschap
      description: 'Co-branding-, private label- en exclusieve modelprogramma''s voor gevestigde merken in de watersport- en buitensportsector.'
      icon: tabler:stars
    - title: 'Overheid en instellingen'
      description: 'Preferred supplier-programma''s voor overheidsinstanties, kustenwachten, militaire organisaties en humanitaire organisaties. Tenderklare documentatie.'
      icon: tabler:building-community
    - title: 'Resort- en verhuurpartner'
      description: 'Vloedprijzen, consistente kwaliteit en eigen branding voor resorts, duikcentra en verhuurbedrijven wereldwijd.'
      icon: tabler:sun
content_benefits:
  tagline: Waarom met ons samenwerken
  title: 'Waarom partners voor Aquafarer kiezen'
  subtitle: 'Onze partners profiteren van echte productiecapaciteit, consistente kwaliteit en snel reagerende ondersteuning.'
  list:
    - 'Directe toegang tot de fabriek: werk direct met ons productieteam — zonder tussenpersonen. Krijg snellere antwoorden, betere prijzen en volledige zichtbaarheid van de productie.'
    - 'Klaar voor maatwerk: voorzie uw producten van eigen kleuren, logo''s, verpakkingen en specificaties. Minimale bestelhoeveelheden afgestemd op uw markt.'
    - 'Gegarandeerde kwaliteit: ISO 9001-gecertificeerde productie met CE-, UKCA- en BSCI-conformiteit. Elk product getest voor verzending.'
    - 'Wereldwijde logistiek: verzending vanuit Qingdao, China met FOB-, CIF- en DDP-opties. Magazijn in de VS in Montclair, CA voor distributie in Noord-Amerika.'
    - 'Marketingondersteuning: productcatalogi, fotografie, technische documentatie en digitale middelen ter ondersteuning van uw verkoop.'
    - 'Training en support: producttraining voor uw verkoopteam, technische ondersteuning voor uw klanten en coördinatie van garantieservice.'
content_process:
  tagline: Hoe wordt u partner
  title: 'Eenvoudig partnerproces'
  subtitle: 'Ons partnerproces is eenvoudig — ontworpen om u snel Aquafarer-producten te laten verkopen.'
  items:
    - title: 'Stap 1: Dien uw aanvraag in'
      description: 'Vul ons partneraanvraagformulier in met uw bedrijfsprofiel, doelmarkt en productinteresses.'
    - title: 'Stap 2: Beoordeling van kwalificatie'
      description: 'Ons partnerteam beoordeelt uw aanvraag en neemt binnen 3 werkdagen contact met u op om mogelijkheden te bespreken.'
    - title: 'Stap 3: Overeenkomst en opzet'
      description: 'Teken een partnerovereenkomst, stel uw account in en ontvang partnerprijzen, marketingmateriaal en productmonsters.'
    - title: 'Stap 4: Training en lancering'
      description: 'Producttraining, verkoopondersteuning en marketingmateriaal worden geleverd. U bent klaar om te beginnen met verkopen.'
cta:
  title: 'Klaar om een Aquafarer-partner te worden?'
  subtitle: 'Vraag een partnerschap aan en ons team reageert binnen 3 werkdagen.'
  actions:
    - variant: primary
      text: Partnerschap aanvragen
      href: /contact
    - text: Bekijk onze producten
      href: /products
