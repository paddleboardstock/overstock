hero:
  tagline: Brazilië
  title: SUP Groothandelsboards voor<br />Braziliaanse Retailers
  subtitle: Voor winkels en exploitanten van Rio en Florianópolis tot aan de noordoostkust — gloednieuwe overtollige paddleboards van 5 exemplaren, gemengde modellen, verzonden uit China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Overbodige SUP boards voor Braziliaanse strandwinkels en peddelscholen
direct_answer: Paddle Board Overstock levert gloednieuwe overtollige opblaasbare SUP planken aan Braziliaanse bedrijven — peddelscholen en winkels in Rio de Janeiro, Florianópolis en de noordoostkust, verhuurbedrijven en online verkopers. Groothandelsbestellingen beginnen bij 5 planken met gemengde modellen in één zending, verzonden vanuit Weihai, China per expresluchtvracht of geconsolideerde zeevracht. Elke plank wordt 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Groothandel vanaf 5 boards — gemengde modellen, geprijsd op totale hoeveelheid
  - Bediening van de Braziliaanse strandcultuur van Rio tot het noordoosten
  - Expresslucht of geconsolideerde zeevracht vanuit Weihai, China
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De Braziliaanse SUP markt
  paragraphs:
    - Brazilië is een van de meest natuurlijke stand-up paddle-markten ter wereld. Strandcultuur is nationale cultuur — van de Stand Up Paddle-scene op de lagunes van Rio en de surf- en vlakwatermix van Florianópolis tot de warme, kalme wateren van het noordoosten in Ceará, Pernambuco en Bahia. Peddelscholen, laguneverhuur en downwind- en SUP surfgemeenschappen komen allemaal uit een enorme, sportieve bevolking.
    - Braziliaanse kopers zijn doorgaans door de eigenaar beheerde bedrijven — verhuurstands aan lagunekant, strandscholen, surfwinkels die SUP rijen toevoegen, en groeiende binnenlandse e-commerce verkopers. Ze bestellen in kleine batches (5–20 planken) en geven om duurzaamheid voor dagelijks gebruik en prijsconcurrentie in een markt met aanzienlijke importkosten.
  customer_types:
    - title: Lagoon & Beach Scholen
      description: Scholen en verhuurbedrijven aan de lagunes van Rio en de rustige stranden van het noordoosten bieden lessen en uurverhuur aan.
    - title: Surfwinkels
      description: Gevestigde surfwinkels die vlakke wateren en toeren SUP toevoegen voor de lokale peddelgemeenschap.
    - title: Online verkopers
      description: Binnenlandse e-commerce verkopers importeren SUP voorraad om de enorme interne markt van Brazilië te bedienen.
shipping_section:
  title: Schip naar Brazilië
  paragraphs:
    - Bestellingen worden verzonden vanuit Weihai, China. Express luchtvracht vervoert monsters en 1–3 boardorders naar de belangrijkste luchthavens van Brazilië; Consolidated Sea Freight bedient 5–20 groothandelsbestellingen via havens zoals Santos en andere kustpoorten. Transitschattingen voor uw bestemming zijn opgenomen in uw offerte.
    - Wij leveren de commerciële factuur en verpakkingslijst die nodig zijn voor de afgifte, met correcte HS-codes en opgegeven waarden. Invoerrechten en belastingen zijn door de importeur verschuldigd volgens Braziliaanse regels.
  customs_note: De invoerbelastingen op sportartikelen in Brazilië zijn aanzienlijk en verschillen per productclassificatie. Controleer de huidige invoerrechten, btw en eventuele staatskosten met uw douanemakelaar (despachante) voordat u bestelt — wij leveren volledige documentatie, maar voegen geen invoerbelastingen samen in vrachtoffertes.
faq_section:
  title: Brazilië FAQ
  items:
    - q: Kunnen offertes en ondersteuning in het Portugees worden afgehandeld?
      a: Ja — wij werken met Portugeessprekende kopers. Stel uw vraag en wij behandelen uw offerte en bestelling in het Portugees.
    - q: Zijn de importbelastingen van Brazilië inbegrepen in uw prijzen?
      a: Nee. Invoerrechten, btw en belastingen op staatsniveau zijn de verantwoordelijkheid van de importeur volgens de Braziliaanse regels. Wij geven de boardprijzen en vrachtkosten duidelijk en afzonderlijk aan en leveren de papieren die uw despachante nodig heeft.
    - q: Hoe ziet een eerste bestelling voor een Braziliaanse strandschool eruit?
      a: 'Gewoonlijk 5–15 boards: duurzame modellen voor algemene lessen en verhuur per uur, plus een paar premium edities voor winkelpresentatie. Gemengde modellen in één zending, geprijsd op basis van het totale aantal.'
    - q: Verstuurt u zeevracht naar Brazilië?
      a: Ja — geconsolideerd zeevervoer bedient Braziliaanse havens voor 5–20 groothandelsbestellingen, per bestemming geprijsd. Express luchtvervoer is beschikbaar voor monsters en dringende kleine bestellingen.
