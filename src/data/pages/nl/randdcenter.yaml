capabilities:
  tagline: Mogelijkheden
  title: R&D-mogelijkheden
  subtitle: Vier kerndisciplines die ons volledige controle geven over productontwikkeling — van grondstofonderzoek tot eindcertificering.
  groups:
    - title: Materiaalwetenschap en stoftechnologie
      items:
        - Analyse en optimalisatie van PVC- en Hypalon-formuleringen
        - Ontwikkeling van UV-stabilisatie, vlamvertragers en antibacteriële additieven
        - Laminatie- en adhesie-engineering van meerlaagse stoffen
        - Versnelde verouderingstesten (UV, thermisch, vochtigheid, zoutnevel)
    - title: Romptechniek en hydrodynamica
      items:
        - Parametrisch 3D-rompontwerp en CFD-optimalisatie
        - Eindige-elementenanalyse voor structurele en schokbelastingen
        - Sleepbaktests op schaalmodellen en prestatievalidatie
        - Ontwikkeling van aangepaste rompen voor speciale missieprofielen
    - title: Las- en verbindingstechnologie
      items:
        - Ontwikkeling en optimalisatie van diëlektrisch RF-lasprocessen
        - Hetelucht-, hete wig- en ultrasone lasmethoden
        - Kwalificatie van lijm- en naadtape
        - Lassterktemodellering en levensduurvoorspelling
    - title: Testen, certificering en conformiteit
      items:
        - Conformiteitstesten volgens , en CE
        - Onafhankelijk testen door derden en certificeringsondersteuning
        - Ontwikkeling van aangepaste testprotocollen voor inkoopkwalificatie
        - Faalanalyse in het veld en oorzaakanalyse

