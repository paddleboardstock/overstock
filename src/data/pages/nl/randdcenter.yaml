hero:
  tagline: R&D-centrum
  title: R & D Centrum
  subtitle: Gericht op vooruitgang

intro:
  - Het Onderzoeks- en Ontwikkelingscentrum (R&D) van Aquafarer is de drijvende kracht achter onze missie om watersportuitrusting te revolutioneren. We versterken watersportliefhebbers wereldwijd met veiligere, comfortabelere en plezierigere producten door voortdurende innovatie in opblaasbare SUP's en boten. Ons toegewijde team van ingenieurs, ontwerpers en watersportfanaten geeft vorm aan de toekomst van de industrie door de lat voor kwaliteit, prestaties en duurzaamheid steeds hoger te leggen.
  - Onze R&D-faciliteit brengt materiaalwetenschappers, scheepsarchitecten en productie-ingenieurs onder één dak. Van stofformulering en rompsimulatie tot lasprocesontwikkeling en volwaardige vaarproeven — elke fase van productontwikkeling wordt door data gedreven en door tests gevalideerd.

