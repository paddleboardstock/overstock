  cta: Bespreek je R&D-vereisten →
  cta_link: /contact

vision:
  tagline: Onze visie
  title: Vormgeven van de toekomst van watersport
  body: Aquafarer streeft ernaar de leider te zijn in de opblaasbare boot- en SUP-industrie door continue innovatie, onwrikbare kwaliteit en een vastberaden toewijding aan veiligheid en duurzaamheid — uiteindelijk verrijken we de ervaringen van watersportliefhebbers wereldwijd. Het Aquafarer R&D-centrum is waar passie en innovatie samenkomen en nieuwe normen stellen voor de watersportindustrie.

labs_section:
  tagline: Laboratoria
  title: Onze laboratoria
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC-stoffenlaboratorium
      description: Continu onderzoek en testen van PVC- en Hypalon-buizenstoffen op treksterkte, UV-bestendigheid, slijtage en flexibiliteit bij lage temperaturen om langdurige betrouwbaarheid in maritieme omgevingen te garanderen.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Romptechniek Studio
      description: CAD-ontwerp en eindige-elementenanalyse van HDPE-, aluminium- en glasvezelrompen. Elke romp wordt digitaal gesimuleerd op spanningsverdeling en schokbestendigheid voordat het eerste prototype wordt gebouwd.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF-lascentrum
      description: Speciale RF-lasfaciliteit met nauwkeurige temperatuur- en drukregeling, die hoogsterke, luchtdichte naden produceert die de -normen voor opblaasbare vaartuigen overtreffen.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hydrodynamische testtank
      description: Testen op schaalmodellen in onze eigen testtank ter optimalisatie van rompvorm, planeerprestaties, stabiliteit en brandstofefficiëntie over een reeks belastingen en zeegang.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypewerkplaats
      description: Faciliteit voor volwaardig prototypen en uitrusten, waar nieuwe modellen worden gebouwd, gemonteerd en getest. Elk prototype ondergaat minimaal 20 uur vaartesten voordat productie wordt goedgekeurd.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Kwaliteits- en inspectielaboratorium
      description: Speciaal kwaliteitslaboratorium dat trekproeven, luchtdichtheidscycli, naadpeeltesten en materiaalcertificering uitvoert om te garanderen dat elke boot die de werkplaats verlaat aan onze gepubliceerde specificaties voldoet.
      href: /randdcenter/quality-inspection-lab
