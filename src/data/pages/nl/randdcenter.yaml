rd_services:
  tagline: Aangepaste R&D
  title: R&D-diensten voor partners
  services:
    - title: Ontwikkeling van aangepaste materialen
      desc: We ontwikkelen aangepaste stofformules, laminaatstapels en lijmsystemen afgestemd op jouw werkomgeving en prestatiedoelen.
    - title: OEM/ODM-producttechniek
      desc: Van conceptschetsen tot productierijpe engineeringpakketten — ons team kan boten ontwerpen, prototypen en testen onder jouw merk.
