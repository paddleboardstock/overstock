features3_solutions:
  tagline: Oplossingen
  title: Uw wateravontuur<br />Zakenpartner
  isBeforeContent: false
  columns: 3
  items:
    - title: Watersportclubs
      description: Complete uitrustingspakketten, aangepaste branding en onderhoudsprogramma's voor SUP clubs, kajakclubs, surfscholen en trainingscentra.
      icon: tabler:users
      link: /solutions/clubs
    - title: Watersport RIB's
      description: Speciaal gebouwde RIB's voor zeilscholen, watersportcentra en evenementenorganisaties. Coachboten, sleepboten en marshalvaartuigen voor de professionele watersport.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorts en hotels
      description: Premium watersportprogramma's met vlootuitrusting, veiligheidssystemen, personeelstraining en inkomstenbeheer voor horecagelegenheden.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Watermerkondernemers
      description: Private label OEM/ODM productie met lage MOQ's, aangepast productontwerp, verpakking en wereldwijde verzending voor nieuwe merkeigenaren.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Duikcentrumboten
      description: Stabiele RIB-platforms met gemakkelijke instap/uitstap, opslag van apparatuur en motorconfiguraties geoptimaliseerd voor duikoperaties.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Reddings- en Noodvaartuigen
      description: Hoogsnelheids-RIB's en opblaasboten ontworpen voor zoek- en reddingsacties, noodrespons en kustwachtoperaties.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Tenderoplossingen voor Jachten
      description: Compacte, stijlvolle RIB-tenders die superyachten en recreatieve vaartuigen aanvullen. Gemakkelijke opslag, krachtige prestaties.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Visseribootoplossingen
      description: Stabiele, duurzame opblaasboten en RIB's geconfigureerd voor commerciële en recreatieve visserijoperaties.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Maritiem Toerisme-uitrusting
      description: Vlootklare opblaasboten, SUP-boards en kajaks voor resorts, touroperators en verhuurbedrijven van watersport.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore energie-RIB's
      description: Zware RIB's voor ondersteuning van olie- en gasplatforms, personeelsoverdracht van windmolenparken, inspectie van onderzeese kabels en waterbouw.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Werkboten voor aquacultuur
      description: Corrosiebestendige RIB's voor de visteelt, parelteelt en oceaanboerderijen. Hypalon buizen, roestvrijstalen hardware, duurzaamheid bij dagelijks gebruik.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Marien onderzoek en onderzoek
      description: Stabiele, instrumentklare RIB's voor oceanografisch onderzoek, milieumonitoring, bemonstering van de waterkwaliteit en universitaire onderwijsprogramma's.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Commerciële Werkboten
      description: Zware RIB's voor patrouille, inspectie, transport en offshore-logistiek. Gebouwd voor de rigoureuze eisen van commerciële operaties.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Weet u niet zeker welk pad bij uw bedrijf past?
  subtitle: Vertel ons over uw operatie. Wij adviseren u het juiste uitrustingspakket, brandingprogramma of aangepaste oplossing.
  actions:
    - variant: primary
      text: Ontvang een gratis adviesgesprek
      href: /contact

