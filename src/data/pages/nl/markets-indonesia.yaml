hero:
  tagline: Indonesië
  title: SUP Groothandelsboards voor<br />Indonesische bedrijven
  subtitle: Bali watersportwinkels, eilandresorts en exploitanten verspreid over de archipel — gloednieuwe overtollige borden van 5 eenheden, gemengde modellen, verzonden uit China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Overbodige SUP borden voor Indonesische resorts en Bali watersportwinkels
direct_answer: levert Paddle Board Overstock gloednieuwe overtollige opblaasbare SUP boards aan Indonesische bedrijven — watersportwinkels op Bali, eilandresorts van Lombok tot de Gillis en verder, strandclubs en verhuurbedrijven. Groothandelsbestellingen beginnen bij 5 boards met gemengde modellen in één zending, verzonden vanuit Weihai, China per express luchttransport of geconsolideerde zeevracht. Elke board wordt 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Groothandel vanaf 5 boards — gemengde modellen, geprijsd op totale hoeveelheid
  - Ze bedienen de watersporteconomie van Bali en eilandresorts in het hele land
  - Korte China–Indonesië vrachtroutes, lucht of zee
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De Indonesische SUP markt
  paragraphs:
    - Indonesië is een van de grote watersporteconomieën van Azië, en Bali is het kloppende hart. Van de strandclubs van Seminyak en Canggu tot de rustige lagunes van Sanur en Nusa Dua, overal verschijnen paddleboards — zonsopgangpeddels over riffen, SUP yogalessen, lagunetochten en hotelgastenprogramma's. Buiten Bali volgen Lombok, de Gili-eilanden en de groeiende toeristische landschappen in de archipel hetzelfde patroon.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: duurzaamheid, UV prestaties en reparatie zijn belangrijker dan catalogusglans. De bestellingen lopen uit 5–20 borden, gemengd voor lessen, verhuur en winkeldisplay.
  customer_types:
    - title: Bali Watersportwinkels
      description: Gevestigde operators in Sanur, Seminyak en Canggu voegen toe aan SUP surf-, duik- en snorkellijnen.
    - title: Island Resorts & Beach Clubs
      description: Resorts en strandclubs in Bali, Lombok en de Gillis die gastpeddels en SUP yogaprogramma's aanbieden.
    - title: Tour- en verhuuroperators
      description: Organisatoren van lagune- en mangrovetochten en uurverhuur vernieuwen de vloten seizoensgebonden.
shipping_section:
  title: Schip naar Indonesië
  paragraphs:
    - Indonesië is een van de kortste goederenroutes vanaf onze basis in Weihai, China. Express luchtvracht vervoert monsters en 1–3 bestellingen snel naar Denpasar en Jakarta; Consolidated Sea Freight bedient 5–20 board groothandelsorders via Tanjung Priok, Tanjung Benoa en andere havens. Beide opties worden geciteerd met geraamde transittijden voor uw bestemming.
    - Wij leveren de benodigde commerciële factuur en verpakkingslijst, met de juiste HS-codes en opgegeven waarden. Invoerrechten en belastingen zijn volgens Indonesische regels door de importeur te betalen.
  customs_note: Indonesische machtiging voor sportuitrusting is documentatiegevoelig — werk samen met uw douanemakelaar (PPJK) om de huidige invoerrechten en belastingbehandeling te bevestigen. Wij leveren volledige, consistente papieren en reageren snel op verzoeken van makelaars.
faq_section:
  title: Indonesië FAQ
  items:
    - q: Hoe snel is de vracht van China naar Bali?
      a: Indonesië is een van onze dichtstbijzijnde vrachtbestemmingen vanuit Weihai. Expressvlucht naar Denpasar of Jakarta is de snelste optie voor monsters en kleine bestellingen; geconsolideerde zeevracht wordt geofferd met een transitvenster voor groothandelsbestellingen. Beide worden in uw offerte gespecificeerd.
    - q: Zijn de planken geschikt voor dagelijks huurgebruik in UV tropische gebieden?
      a: Ja — constructie die geschikt is drop-stitch PVC voor dagelijkse verhuurcycli is wat wij leveren aan wagenparken in 50+ landen. Standaardverzorging (spoelen na zout water, schaduwopslag) houdt ze in gebruik tijdens vele seizoenen van de zon op Bali.
    - q: Hoe ziet een bestelling van een watersportwinkel eruit?
      a: Typisch 5–15 boards, gemengd tussen stabiele allroundmodellen voor lessen en verhuur en enkele premium art-edities voor retailweergave — één zending, geprijsd naar totale hoeveelheid.
    - q: Kunt u onze PPJK ondersteunen met documentatie?
      a: Ja. Elke bestelling wordt verzonden met een commerciële factuur en paklijst met correcte HS-codes en opgegeven waarden, en we reageren snel wanneer uw makelaar aanvullende documenten nodig heeft.
