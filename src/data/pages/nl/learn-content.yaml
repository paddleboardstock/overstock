articles:
  sup:
    - title: SUP Basis — Gids voor Beginners
      desc: Alles wat een beginner moet weten — soorten boards, peddelmaat, houding en tips voor de eerste dag.
    - title: SUP Maattabel
      desc: Vind de juiste boardlengte, breedte en volume voor je gewicht, vaardigheid en peddelstijl.
    - title: Opblaasbare versus harde plank
      desc: Wat past bij jou? Draagbaarheid, prestaties, duurzaamheid en kosten in vergelijking.
    - title: Middelhoge Technieken
      desc: Verhoog je peddelvaardigheden met geavanceerde slagen, draaitechnieken en het omgaan met ruw water.
    - title: Hoe kies je een opblaasbare SUP
      desc: Navigeer de belangrijkste factoren — constructie, dikte, vinopstelling en inbegrepen accessoires.
    - title: Waterveiligheid
      desc: Essentiële veiligheidskennis, waaronder weersmetingen, PFD selectie, zelfredding en groepspeddelen.
  inflatable-boat:
