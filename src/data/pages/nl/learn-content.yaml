    - title: Reddingsvest & PFD Gids
      desc: Hoe kies je het juiste persoonlijke drijfmiddel voor stand-up paddleboarden — drijfvermogen, pasvorm en comfort.
    - title: SUP Veiligheidschecklist
      desc: De veiligheidschecklist vóór de lancering moet elke stand-up paddleboarder volgen voordat hij het water op gaat.
    - title: Veiligheid bij koudwaterpeddelen
      desc: Essentiële voorzorgsmaatregelen, uitrusting en technieken voor peddelen in koud water.
    - title: Beginnersfouten bij het peddelen
      desc: Veelvoorkomende fouten die beginnende peddelaars maken en hoe je ze kunt vermijden voor een veiligere, aangenamere ervaring.
    - title: PFD Lijn- en veiligheidsregels
      desc: Wanneer een riem essentieel is, welke PFD types werken voor SUP, en welke veiligheidsuitrusting elke peddelaar moet dragen.
