materials:
  intro_p1: De prestaties, duurzaamheid en veiligheid van een opblaasbaar vaartuig hangen bijna volledig af van de materialen die bij de productie worden gebruikt. Van de stof die de tubes vormt tot de draden die een SUP-board zijn stijfheid geven — elke materiaalkeuze beïnvloedt hoe het product op het water presteert en hoe lang het meegaat.
  intro_p2: 'Deze gids behandelt de vier kernmaterialen die in moderne opblaasbare vaartuigen worden gebruikt: PVC-stof, Hypalon CSM-rubber, drop-stitch-kernconstructie en EVA-schuimdekken. Als u deze materialen begrijpt, kunt u het juiste product voor uw behoeften kiezen en het onderhouden voor een maximale levensduur.'
  labels:
    advantages: Voordelen
    limitations: Beperkingen
    best_for: 'Ideaal voor:'
  items:
    - name: PVC (polyvinylchloride)
      summary: De industriestandaard voor recreatieve opblaasbare boten en SUP's. Gelamineerde meerlaagse stof biedt een uitstekende sterkte-gewichtverhouding voor een toegankelijke prijs.
      pros:
        - Betaalbaar — 30-50 % goedkoper dan Hypalon
        - Lichtgewicht en makkelijk te hanteren
        - Goede UV-bestendigheid met juiste coatings
        - Brede kleuren- en afwerkingkeuze
        - Eenvoudig te repareren met PVC-lappen en oplosmiddellijm
      cons:
        - Kortere levensduur dan Hypalon (7-10 jaar)
        - Minder flexibel bij lage temperaturen
        - Lagere chemische bestendigheid
        - Kan na verloop van tijd plasticizer-migratie ontwikkelen
      best_for: Recreatieve SUP's, betaalbare boten, verhuurvloten, seizoensgebruik, zoetwater en kustwateren.
    - name: Hypalon (CSM-rubber)
      summary: Premium synthetisch rubbermateriaal, bekend om uitzonderlijke duurzaamheid, UV-bestendigheid en lange levensduur. De gouden standaard voor commerciële en militaire opblaasbare boten.
      pros:
        - Uitzonderlijke UV- en ozonbestendigheid
        - Levensduur van 15-20 jaar met juist onderhoud
        - Uitstekende flexibiliteit bij koud weer
        - Superieure bestendigheid tegen chemicaliën en olie
        - Houdt kleur langer vast dan PVC
      cons:
        - Aanzienlijk duurder dan PVC
        - Zwaardere stof
        - Minder kleuropties
        - Reparaties vereisen gespecialiseerde lijmen
        - Minder productiefaciliteiten wereldwijd
      best_for: Commerciële RIB's, zoek- en reddingswerk, militaire toepassingen, tropische klimaten, langetermijnbezit van vloten.
    - name: Drop-stitch-kern
      summary: De technologie die opblaasbare SUP's heeft gerevolutioneerd. Duizenden polyesterdraden verbinden de boven- en onderlaag van de stof, waardoor opblazen op hoge druk mogelijk is voor prestaties van een hard board.
      pros:
        - Extreem stijf bij 12-20 PSI
        - Lichtgewicht — 18-30 lbs voor een board op volledige maat
        - Vouwt plat voor opslag en reizen
        - Uitstekende slagvastheid
        - Consistente prestaties over alle temperatuurgebieden
      cons:
        - Vereist een hogedrukpomp
        - Lekreparatie is complexer dan bij enkellaags constructie
        - Hogere productiekosten dan standaard opblaasproducten
        - Drukverlies in de tijd vereist periodiek bijvullen
      best_for: Stand-up paddle boards, kajaks, luchtdekken voor opblaasbare boten — elke toepassing die stijfheid combineert met opblaasbare draagbaarheid.
    - name: EVA-schuimdek
      summary: Geslotencel EVA-schuim (etheen-vinylacetaat) gebruikt voor gripmatten op SUP-boards en bootdekken. Biedt demping, grip en thermische isolatie.
      pros:
        - Uitstekende antislipgrip, nat of droog
        - Demping vermindert vermoeidheid bij lange peddelpartijen
        - Thermische isolatie tegen koude dekopervlakken
        - UV- en zeewaterbestendig
        - Verkrijgbaar in meerkleuren composities en lasergravure ontwerpen
      cons:
        - Kan slijten bij intensief gebruik na 2-3 jaar
        - Moet goed verlijmd zijn om delaminatie te voorkomen
        - Niet constructief — beïnvloedt de stijfheid niet
        - Voegt licht gewicht toe (200-400 g per board)
      best_for: SUP-dekgrip, bootdekbekleding, zitcomfort in kajaks — elk oppervlak dat antislip steun vereist.
  selection:
    title: Materiaalkeuzegids
    subtitle: 'Kies het juiste materiaal op basis van uw primaire gebruik:'
    headers:
      - Gebruiksscenario
      - Aanbevolen materiaal
      - Waarom
    rows:
      - - Recreatief SUP-peddelen
        - Drop-stitch PVC
        - Lichtgewicht, stijf, betaalbaar — ideale balans voor recreatieve peddelaars
      - - Familiebijboot / meerboot
        - PVC (1100 denier)
        - Kosteneffectief, eenvoudig te repareren, voldoende duurzaam voor recreatief gebruik
      - - Commerciële RIB / patrouilleboot
        - Hypalon CSM
        - Maximale UV-bestendigheid, levensduur van 15-20 jaar, bestendigheid tegen chemicaliën en olie
      - - Verhuurfleet SUP-boards
        - Drop-stitch PVC + EVA-dek
        - Duurzaam, repareerbaar, goede prijs-kwaliteitverhouding bij intensief gebruik
      - - Zoek- en reddingsoperaties
        - Hypalon CSM
        - Betrouwbaarheid onder extreme omstandigheden, flexibiliteit bij kou, chemische bestendigheid
      - - Touring- / expeditiekajak
        - Drop-stitch PVC
        - Stijve prestaties met opvouwbare draagbaarheid voor reizen
  deep_dive:
