materials:
  intro_p1: De prestaties, duurzaamheid en veiligheid van een opblaasbaar paddleboard hangen bijna volledig af van de materialen die bij de constructie worden gebruikt. Van het laminaat dat de romp vormt tot de schroefdraad die een SUP board zijn stijfheid geeft, elke materiaalkeuze beïnvloedt hoe het product presteert op het water en hoe lang het meegaat.
  intro_p2: 'Deze gids behandelt de drie kernmaterialen die worden gebruikt in moderne opblaasbare paddleboards: het PVC laminaat, de drop-stitch kern en EVA het schuimdek. Door deze materialen te begrijpen, kun je het juiste board kiezen voor jouw behoeften en het voor maximale levensduur onderhouden.'
  labels:
    advantages: Voordelen
    limitations: Beperkingen
    best_for: 'Het beste voor:'
  items:
    - name: PVC (polyvinylchloride)
      summary: De industriestandaard voor opblaasbare SUPs stoffen. Meerlaagse gelamineerde stof biedt een uitstekende sterkte-gewichtsverhouding tegen een toegankelijke prijs.
      pros:
        - Uitstekende prijs-kwaliteitverhouding
        - Lichtgewicht en gemakkelijk te hanteren
        - Goede UV weerstand met goede coatings
        - Breed scala aan kleuren en afwerkingen
        - Makkelijk te repareren met PVC patches en oplosmiddellijm
      cons:
        - Typische levensduur van 7-10 jaar met goede verzorging
        - Minder flexibel bij koude temperaturen
        - Lagere chemische weerstand
        - Kan na verloop van tijd migratie van plastificeerder ontwikkelen
      best_for: Recreatief en toerreizen SUPs, gezinspeddelen, seizoensgebonden gebruik, zoetwater- en kustomgevingen.
    - name: Drop-Stitch-kern
      summary: De technologie die opblaasbare SUPs. Duizenden polyester draden verbinden de bovenste en onderste stoflagen, waardoor hoge druk opblazen mogelijk is voor een stijve, harde schaal.
      pros:
        - Extreem stijf op 12-20 PSI
        - Lichtgewicht — 8-14 kg voor een volledig formaat board
        - Vouwt vlak voor opslag en reizen
        - Uitstekende slagvastheid
        - Consistente prestaties bij verschillende temperaturen
      cons:
        - Vereist een hogedrukpomp
        - Punctiegroepsreparatie complexer dan enkellaags
        - Hogere productiekosten dan standaard opblaasbare boards
        - Drukverlies in de loop van de tijd vereist periodiek bijvullen
      best_for: Stand-up paddleboards en alle uitrusting die stijfheid vereist maar opblaasbare draagbaarheid moet hebben.
    - name: EVA Schuimdekje
      summary: Gesloten-cel EVA (ethyleen-vinylacetaat) schuim gebruikt voor grip pads op SUP boards. Biedt demping, grip en thermische isolatie — en draagt de art-series ontwerpen.
      pros:
        - Uitstekende antislip grip nat of droog
        - Demping vermindert vermoeidheid bij lange peddeltochten
        - Thermische isolatie tegen koud dek oppervlak
        - UV en zoutwaterbestendig
        - Verkrijgbaar in multi-color blokstukken en laser-gegraveerde ontwerpen
      cons:
        - Kan door zwaar gebruik 2-3 jaar meegaan
        - Moet goed gebonden zijn om delaminatie te voorkomen
        - Niet structureel — beïnvloedt de stijfheid niet
        - Voegt een klein beetje gewicht toe (200-400 g per board)
      best_for: SUP dek trekkracht, art-series dek ontwerpen, en elk oppervlak dat slipvaste grip nodig heeft.
  selection:
    title: Materiaalkeuze Gids
    subtitle: 'Kies het juiste materiaal op basis van je primaire gebruik:'
    headers:
      - Gebruik
      - Aanbevolen Materiaal
      - Waarom
    rows:
      - - Recreatief SUP peddelen
        - Drop-stitch PVC
        - Lichtgewicht, stijf, betaalbaar — ideale balans voor casual peddelaars
      - - Familie & beginner peddelen
        - Breed drop-stitch PVC (32"+)
        - Stabiel en vergevingsgezind — vertrouwen voor beginnende peddelaars
      - - Vissen & uitrusting-intensief peddelen
        - Breed drop-stitch PVC met volledig EVA dek
        - Extra stabiliteit voor staan en werpen, groot volume voor uitrusting
      - - Verhuurvloot SUP boards
        - Drop-stitch PVC + EVA dek
        - Duurzaam, repareerbaar, goede prijs-kwaliteitverhouding voor intensief gebruik
      - - Toeren & langere peddels
        - Drop-stitch PVC (~11 ft)
        - Beter spoor- en glij-efficiëntie over afstand
      - - Yoga & fitness peddelen
        - Breed drop-stitch PVC met volledig EVA dek
        - Stabiel, comfortabel platform voor houdingen en workouts
  deep_dive:
    title: Deep Dive Gidsen
    topics:
      - title: Maritieme kwaliteit PVC
        desc: Meerlagen gelamineerde PVC stof — UV weerstand, slijtage testen, en denier beoordelingen uitgelegd.
      - title: PVC Laminaat Lagen
        desc: Hoe meerlagen gelamineerde PVC sterkte, gewicht en UV weerstand in balans houdt.
      - title: Drop-Stitch-kern
        desc: Hoe duizenden interne draden stijve, hoge-druk opblaasbare structuren creëren bij 15 PSI.
      - title: RF-las technologie
        desc: Hoge-frequentielassen creëert sterke, consistente naden — hoe het werkt en waarom het belangrijk is.
      - title: PSI & Prestaties
        desc: Waarom luchtdruk belangrijk is voor opblaasbare SUPs — stijfheid, gewichtscapaciteit, en rijkwaliteit.
      - title: Kwaliteit testen
        desc: Druktesten, drijfvermogen tests, UV veroudering, en destructieve tests — ons kwaliteitsproces.
      - title: EVA Schuimdekken
        desc: Gesloten-cel EVA schuimdek pads — grip, comfort en duurzaamheid voor SUP dekken.
      - title: Materiaalverzorging
        desc: Reinigen, UV bescherming, schimmelpreventie, en beste opslagpraktijken voor opblaasbare producten.
