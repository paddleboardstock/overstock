      - title: PVC versus Hypalon
        desc: De definitieve vergelijking van de twee dominante materialen voor opblaasbare boten — kosten, levensduur, UV-bestendigheid.
      - title: Drop-stitch-kern
        desc: Hoe duizenden interne draden stijve, hogedruk opblaasbare constructies creëren bij 12-15 PSI.
      - title: RF-lastechnologie
        desc: Hoogfrequent lassen creëert sterke, gelijkmatige naden — hoe het werkt en waarom het belangrijk is.
      - title: PSI en prestaties
        desc: Waarom luchtdruk belangrijk is voor opblaasbare SUP's en boten — stijfheid, draagkracht en vaarcomfort.
      - title: Kwaliteitstesten
        desc: Druktests, drijfvermogentests, UV-veroudering en destructieve tests — ons kwaliteitsproces.
      - title: EVA-schuimdekken
        desc: Geslotencel EVA-schuim dekmatten — grip, comfort en duurzaamheid voor SUP- en bootdekken.
      - title: Materiaalonderhoud
