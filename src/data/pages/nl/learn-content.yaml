      desc: Drop-stitch Cores, PVC laminaten, EVA dekschuim en denier-classificaties — begrijp waar je board van gemaakt is.
    - title: EVA Deckkunst Uitleg
      desc: Hoe meerkleurige EVA blokken worden gestanst en met de hand in elkaar gezet tot samengestelde deckart die nooit vervaagt of loslaat.
