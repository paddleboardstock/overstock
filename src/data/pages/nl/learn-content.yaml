    - title: Overzicht van opblaasbare technologie
      desc: Hoe opblaasbare paddleboards worden opgebouwd — van materiaallayup tot klepsystemen en naadlassen.
    - title: Rail- en naadconstructie
      desc: Hoe drievoudige railbanden en RF-gelaste naden je board luchtdicht houden bij volle druk.
    - title: Waarom 15 PSI Belangrijk Is
      desc: Hoe luchtdruk de prestaties van een opvouwbare opblaasbare hardboard-uitvoering van stijve, hardboard-achtige prestaties haalt.
  water-safety:
    - title: Waterveiligheidsgids
