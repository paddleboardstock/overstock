hero:
  tagline: Waterverkenningskennis
  title: Leren
  subtitle: |
    Gidsen, tutorials en diepgaande verkenningen — alles wat je nodig hebt om te verkennen<br />
    water met vertrouwen. Van het kiezen van je eerste SUP tot het beheersen van geavanceerde technieken.
  taglineSection: Kennis voor elke peddelaar. Van beginner tot professional.
featured:
  tagline: Uitgelichte onderwerpen
  title: Begin je leerreis
  subtitle: Of je nu nieuw bent in watersporten of je vaardigheden wilt verbeteren, onze gidsen staan voor je klaar.
  items:
    - title: SUP Basis
      description: Alles wat een beginner moet weten — soorten boards, peddelmaat, houding en tips voor de eerste dag.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Opblaasbare versus harde plank
      description: Welke is geschikt voor jou? We vergelijken draagbaarheid, prestaties, duurzaamheid en kosten naast elkaar.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Waterveiligheid
      description: Essentiële veiligheidskennis die elke peddelaar zou moeten hebben — weer, reddingsvesten, zelfredding en meer.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Materialengids
      description: Drop-stitch kernen, PVC laminaten, EVA dekfoam — begrijp waarvan je board is gemaakt.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Maattabel
      description: Vind de juiste boardlengte, breedte en volume voor je gewicht, vaardigheid en peddelstijl.
      icon: tabler:ruler
      href: /size-guide
    - title: Middelhoge Technieken
      description: Verhoog je peddelvaardigheden met geavanceerde slagen, draaitechnieken en het omgaan met ruw water.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
