hero:
  tagline: Paddle Board Overstock Academie
  title: Leercentrum
  subtitle: Gidsen en tutorials voor elk vaardigheidsniveau — van SUP basis tot geavanceerde reddingstechnieken
categories:
  - level: Beginner
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Basis
        desc: 'Leer de basisprincipes van stand-up paddleboarden: houding, slagtechniek en balans.'
        slug: beginner-sup-guide
      - title: Peddeltechnieken
        desc: 'Voorwaartse slag, sweepslag, trekslag en lage brace: beheers de essentiële peddelbewegingen.'
        slug: sup-paddle-guide
      - title: Veiligheid eerst
        desc: Essentiële veiligheidspraktijken, waaronder weercontroles, PFD-gebruik, lijnregels en zelfredding.
        slug: sup-safety-guide
  - level: Tussenliggend
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Essentiële reisbenodigdheden
        desc: Paddles van meerdere uren plannen - navigatie, hydratatie, tempo en windvoorspellingen lezen.
        slug: touring-sup-guide
      - title: Weer lezen
        desc: Interpreteer mariene voorspellingen, identificeer wolkenpatronen en begrijp windeffecten op water.
        slug: weather-planning-water-sports
      - title: Basisbeginselen van navigatie
        desc: Kaartlezen, kompasgebruik, GPS-waypoints en routeplanning voor peddelen langs de kust.
        slug: sup-navigation-guide
      - title: Getijdenbewustzijn
        desc: Inzicht in getijdencycli, stromingen en hoe deze de timing en route van lancering beïnvloeden.
        slug: understanding-tides
  - level: Geavanceerd
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Meerdaagse reisplanning
        desc: Expeditielogistiek - uitrustingskeuze, voedselplanning, veiligheidsprotocollen en contacten voor noodgevallen.
        slug: sup-travel-guide
      - title: Reddingstechnieken
        desc: Zelfredding, T-redding en sleepprotocollen voor open water.
        slug: sup-self-rescue
      - title: Nacht peddelen
        desc: 'Navigatie in het donker: verlichtingsvereisten, routegeheugen, groepscommunicatie en gevaarbewustzijn.'
        slug: sup-navigation-guide
  - level: Onderhoud
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Reiniging en onderhoud
        desc: Spoelen met zoet water, UV-bescherming, schimmelpreventie en goede droogtechnieken na elke sessie.
        slug: inflatable-sup-maintenance
      - title: Gids voor opslag
        desc: Beste praktijken voor het opslaan van opblaasbare boards — leeg laten lopen, opvouwen, temperatuurscontrole en houdbaarheid.
        slug: inflatable-sup-storage
      - title: Basisprincipes van reparatie
        desc: Repareer kleine lekke banden, naadlekken en klepproblemen met PVC reparatiesets en patchtechnieken.
        slug: inflatable-sup-repair
      - title: Ventielonderhoud
        desc: Identificeer kleptypes (Halkey-Roberts, Boston, Leafield), verwijder vuil en vervang defecte stelen.
        slug: inflatable-sup-repair
knowledge_center_tagline: Kenniscentrum
knowledge_center_title: Paddleboardgidsen & Kennis
knowledge_center_subtitle: Expertgidsen en koopadvies voor peddelboarders van elk niveau.
knowledge_sections:
  - title: Bordtechnologie & Constructie
    tagline: Binnenin je peddelboard
    desc: Hoe opblaasbare paddleboards worden gebouwd — drop-stitch kernen, laminaatlagen, EVA dekken en fabrieksdruktesten.
    guides:
      - title: Hoe paddleboards worden gemaakt
        desc: Van materiaal snijden en lamineren tot 100% druktesten — zie hoe elk bord de fabriek verlaat.
        href: /factory/process
      - title: Drop-Stitch Kerntechnologie
        desc: Hoe duizenden interne draden een stijve, hogedruk opblaasbare structuur creëren.
        href: /learn/drop-stitch-core
      - title: Materiaalreferentie
        desc: PVC denier-beoordelingen, stofgewichten, UV weerstand en dekmaterialen uitgelegd.
        href: /learn/materials
      - title: Opblaasbare Borden Technologie
        desc: Gelaste naden, railconstructie en klepsystemen die je board stijf en luchtdicht houden.
        href: /learn/inflatable-technology
  - title: Koopgidsen
    tagline: Kies het juiste bord
    desc: Alles wat je nodig hebt om je eerste — of volgende — opblaasbare SUP te kiezen, van maatvoering tot constructie.
    guides:
      - title: Hoe kies je een opblaasbare SUP
        desc: De belangrijkste factoren — constructie, dikte, vinconfiguratie en inbegrepen accessoires.
        href: /guides/how-to-choose-your-sup/
      - title: Wat is Stand-Up Paddleboarden?
        desc: Een vriendelijke introductie tot de sport, de uitrusting, en waarom opblaasbare boards het gemakkelijk maken om te beginnen.
        href: /guides/what-is-sup
      - title: Opblaasbare versus harde plank
        desc: Vergelijk iSUP's en harde epoxyboards op het gebied van draagbaarheid, duurzaamheid, prestaties en waarde.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Maattabel
        desc: Vind de juiste boardlengte, breedte en volume voor je gewicht, vaardigheid en peddelstijl.
        href: /size-guide
  - title: Vaardigheden & Veiligheid
    tagline: Peddel met Vertrouwen
    desc: Praktische kennis voor elke sessie — basis voor beginners, waterveiligheid, onderhoud en reparatie.
    guides:
      - title: SUP Basis — Gids voor Beginners
        desc: Alles wat een beginner moet weten — soorten boards, peddelmaat, houding en tips voor de eerste dag.
        href: /v2/beginner-sup-guide
      - title: Essentiële Waterveiligheid
        desc: Weerscontrole, PFD selectie, leash-regels, zelfredding en beste praktijken voor groepspeddelen.
        href: /learn/water-safety
      - title: SUP Onderhoud en verzorging
        desc: Reiniging, opslag, UV bescherming en onderhoudstips voor opblaasbare SUP boards.
        href: /v2/inflatable-sup-maintenance
      - title: Basiskennis Boardreparatie
        desc: Repareer kleine lekke banden, naadlekken en klepproblemen met PVC reparatiesets en patchtechnieken.
        href: /v2/inflatable-sup-repair
