timeline:
  - year: '2012'
    title: Stichting Maritieme Productie
    body: Aquafarer begon als een gespecialiseerde werkplaats voor opblaasbare waterscooters in Qingdao, China, die zich toelegde op maritiem vakmanschap en de productie van opblaasbare boten. De vroege focus lag op het bouwen van betrouwbare opblaasbare producten door middel van praktische technische ervaring en productiediscipline.
  - year: '2015'
    title: Eerste export- en CE-certificering
    body: De eerste exportorders bereikten Japan en Korea. Er werd een CE-certificering behaald voor de kernproductlijnen, waarmee de intrede van Aquafarer op de internationale markten werd gemarkeerd. Het bedrijf begon commerciële en recreatieve gebruikers buiten China te bedienen.
  - year: '2018'
    title: Fabrieksuitbreiding
    body: Verhuis naar een productiefaciliteit van 12.000 m². Er zijn RF-laslijnen en drop-stitch-productiecapaciteit toegevoegd, waardoor productie op grotere schaal en verbeterde kwaliteitscontrolesystemen mogelijk zijn.
  - year: '2020'
    title: R&D-centrum opgericht
    body: Een speciaal R&D-centrum geopend met een PVC stoffenlaboratorium, een hydrodynamische testtank en een CAD/FEA-simulatiestudio. De productontwikkeling werd uitgebreid om zich te concentreren op lichtgewicht constructie, verbeterde duurzaamheid en gebruikersgericht ontwerp.
  - year: '2022'
    title: Certificering en mondiale groei
    body: ISO 9001-certificering behaald. Uitgebreid tot 14 R&D-ingenieurs en meer dan 200 werknemers. Producten bereikten klanten in heel Europa, Amerika en Azië-Pacific via distributeurs en OEM-partnerschappen.
  - year: '2024'
    title: Innovatie- en ontwerpstudio
    body: Lancering van een full-service ontwerp- en innovatiestudio voor ODM projecten op maat, van concept tot productie. Versterkte professionele maritieme toepassingen, waaronder reddings-, commerciële en overheidsaanbestedingen.
  - year: '2026'
    title: Bouwen aan de toekomst van wateronderzoek
    body: Tegenwoordig blijft Aquafarer opblaasbare boten, SUP systemen en op maat gemaakte maritieme oplossingen ontwikkelen, waardoor mensen en organisaties met de wateren van de wereld worden verbonden. Bediend in meer dan 50 landen, jaarlijkse capaciteit van 15.000 eenheden.
content_founding:
  tagline: Het begin
  title: Geboren aan de waterkant
  subtitle: 'Aquafarer begon in Qingdao in een kustwerkplaats met één boot en een visie: opblaasbare waterscooters bouwen die bestand waren tegen echte maritieme omstandigheden.'
  paragraphs:
    - 'In 2012 zagen onze oprichters een gat in de markt: de meeste opblaasbare boten waren óf betaalbaar maar onbetrouwbaar, óf van hoge kwaliteit maar onbetaalbaar. Ze geloofden dat er ruimte was voor een fabrikant die zowel kwaliteit als waarde leverde.'
    - De eerste romp werd met de hand gebouwd, getest in lokale wateren en verfijnd op basis van echte feedback van vissers en kleine commerciële exploitanten. Die feedbackloop – bouwen, testen, luisteren, verbeteren – vormt nog steeds de kern van onze technische filosofie.
    - In 2015 had het woord zich verder verspreid dan Qingdao. Internationale distributeurs begonnen monsters aan te vragen. Wat begon als een lokale werkplaats, groeide uit tot een wereldwijde leverancier.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarers vroege productiewerkplaats en productie
content_growth:
  tagline: Groei & Innovatie
  title: Van werkplaats tot 12.000 m² faciliteit
  subtitle: Voortdurende investeringen in mensen, apparatuur en processen hebben Aquafarer getransformeerd in een moderne maritieme productiefaciliteit.
  paragraphs:
    - Naarmate de vraag groeide, groeide ook onze faciliteit. We breidden uit van een kleine werkplaats naar een fabriek van 12.000 m² met speciale productielijnen voor RIB boten, opblaasbare boten, SUP boards en accessoires.
    - We hebben geïnvesteerd in CNC-snijmachines, hoogfrequente lasapparatuur, drop stitch productielijnen en uitgebreide testopstellingen, waardoor we elk aspect van de productiekwaliteit kunnen controleren.
    - Tegenwoordig bestaat ons team van 200-300 uit scheepsingenieurs, materiaalwetenschappers, kwaliteitscontrolespecialisten en bekwame vakmensen, van wie velen al sinds het begin bij Aquafarer werken.
founder:
  tagline: Maak kennis met de oprichter
  title: Gebouwd door een Waterman
  subtitle: Oprichter David Chen brengt productie-expertise en een levenslange passie voor watersport samen - een combinatie die bepaalt hoe Aquafarer productontwikkeling benadert.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — oprichter van Aquafarer
  story:
    - David Chen groeide op aan de kust van Qingdao, waar de zee geen vakantiebestemming was, maar een manier van leven. Hij bracht zijn jeugd door met kajakken, zeilen en vissen in de Gele Zee; ervaringen die hem een ​​intuïtief begrip gaven van wat waterscooters moeten doorstaan.
    - Voordat hij Aquafarer oprichtte, bracht David tien jaar door in de maritieme productie, waarbij hij zich bezighield met productie, kwaliteit en internationale handel. Hij leidde OEM programma's voor Europese en Noord-Amerikaanse merken, waarbij hij uit de eerste hand de normen en verwachtingen van de mondiale markten leerde kennen.
    - 'In 2012 richtte hij Aquafarer op met een simpele missie: opblaasbare waterscooters bouwen die hij met zijn eigen gezin op het water zou toevertrouwen. Die persoonlijke standaard – zou ik deze gebruiken? – blijft de laatste test voor elk product dat de fabriek verlaat.'
    - Tegenwoordig leidt David de productstrategie en houdt hij toezicht op het R&D-team, waarbij hij persoonlijk nieuwe ontwerpen beoordeelt en prototypes test op de wateren bij Qingdao. Hij gelooft dat geweldige producten voortkomen uit het begrijpen van zowel de techniek als de ervaring.
philosophy:
  tagline: Merkfilosofie
  title: Technische vrijheid op het water
  body: Vrijheid op het water gaat niet alleen over beweging. Het staat voor het ontdekken van nieuwe plekken, het creëren van buitenervaringen, het verbinden van mensen met de natuur en het mogelijk maken van professionele missies. Engineering maakt die vrijheid mogelijk.
  pillars:
    - title: Betrouwbaarheid voorop
      body: Wateromgevingen vereisen vertrouwen. Aquafarer producten zijn ontworpen rond stabiliteit, duurzaamheid, veiligheid en consistente prestaties.
    - title: Mensgericht ontwerp
      body: Producten moeten mensen dienen, niet de technologie. Elke ontwerpbeslissing begint met inzicht in hoe mensen waterscooters gebruiken, waar ze verkennen en met welke uitdagingen ze worden geconfronteerd.
    - title: Toegankelijke verkenning
      body: Water mag niet alleen aan deskundigen toebehoren. Aquafarer creëert apparatuur waarmee meer mensen veilig rivieren, meren, oceanen en kustomgevingen kunnen ervaren.
    - title: Continue innovatie
      body: 'Innovatie betekent niet alleen het creëren van nieuwe producten. Het verbetert elk detail: materialen, structuren, productie en gebruikerservaring.'
engineeringDna:
  tagline: Engineering-DNA
  title: Hoe Aquafarer producten maakt
  areas:
    - title: Materiaalkunde
      body: Aquafarer richt zich op het selecteren van geschikte materialen voor verschillende mariene omgevingen. Belangrijke overwegingen zijn onder meer slijtvastheid, UV-bestendigheid, drukstabiliteit en duurzaamheid op lange termijn.
      items:
        - Slijtvastheid
        - UV-bestendigheid
        - Drukstabiliteit
        - Duurzaamheid op lange termijn
    - title: Bouwtechniek
      body: Opblaasbare waterscooters vereisen een nauwkeurig evenwicht tussen stijfheid, gewicht, draagbaarheid en stabiliteit. Aquafarer engineering richt zich op het optimaliseren van deze factoren door middel van drop-stitch kerntechnologie en geavanceerde naadconstructie.
      items:
        - Stijfheid
        - Gewichtsoptimalisatie
        - Draagbaarheid
        - Stabiliteit
    - title: Productieprecisie
      body: 'Elk product doorloopt gecontroleerde processen: materiaalvoorbereiding, precisiesnijden, lassen en lijmen, assemblage, kwaliteitscontrole en prestatieverificatie.'
      items:
        - Materiaal voorbereiding
        - Precisie snijden
        - Lassen en lijmen
        - Assemblage & QC
    - title: Engineering van gebruikersscenario's
      body: Producten zijn ontwikkeld rond echte toepassingen – recreatie, avontuur en professioneel gebruik – waardoor elk ontwerp voldoet aan de specifieke eisen van de beoogde omgeving.
      items:
        - Recreatie
        - Avontuur
        - Professioneel
        - Commercieel
