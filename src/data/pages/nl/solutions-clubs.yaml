testimonial:
  content: We zijn begonnen met het Club Starterpakket voor onze surfschool in Portugal. 20 boards, peddels, vesten - alles arriveerde binnen 3 weken. Na twee seizoenen hebben we geüpgraded naar het Pro-pakket. De aangepaste branding met ons logo was een gamechanger voor ons professionele imago.
  name: Ricardo Santos
  title: Eigenaar, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Clubprofielen
  title: Water Sports Club-oplossingen<br />Per Clubtype
  subtitle: 'Van universitaire paddleclubs tot exclusieve privéjachtclubs: elk type club heeft unieke uitrustingsbehoeften, gebruikspatronen en budgetstructuren. Wij stemmen elk pakket af op het clubmodel.'
  items:
    - title: Paddleclubs van universiteiten en hogescholen
      subtitle: Veelgebruikte studentenvloten
      description: Door studenten gerunde of door instellingen ondersteunde peddelclubs die SUP-programma's voor universiteitsrecreatie-afdelingen uitvoeren. Apparatuur wordt elk semester intensief gebruikt door meerdere vaardigheidsniveaus. Duurzaamheid en eenvoudige repareerbaarheid zijn cruciaal, naast budgetvriendelijke prijzen voor studentenorganisaties.
      features:
        - Extra duurzame PVC-constructie geschikt voor gebruik door studenten
        - Kleuren-gecodeerde boardreeksen per vaardigheidsniveau voor eenvoudig vlootbeheer
        - Reparatieset + met video-ondersteuning bij elke bestelling inbegrepen
        - Kortingsprijzen voor studentenorganisaties en op semesterbasis betalingen
    - title: Gemeenschappelijke paddle- en sociale clubs
      subtitle: Op lidmaatschap gebaseerde recreatieclubs
      description: Gemeenschapsclubs die SUP sociale peddelervaringen aanbieden aan leden. Apparatuur moet prestaties en comfort voor een brede leeftijdsgroep in balans brengen, met branding die clubidentiteit en trots op leden bevordert. Opslagefficiëntie is essentieel voor clubs die vanuit beperkte toegang tot het water opereren.
      features:
        - 'Gemengde vloot: allround en touring SUPs'
        - "Volledige clubbranding: aangepaste kleuren, logodruk, gebrande PFD's"
        - Compacte opslagoplossingen voor opblaasbare apparatuur
        - 'Starterkit voor ledengroei: verwijzingskaarten, branded photography'
    - title: Surfscholen & SUP Academies
      subtitle: Kustprestaties en coaching
      description: Scholen gericht op surf die SUP surf- en golfrijvaardigheden aanleren. Uitrusting moet presteren onder surfomstandigheden — wendbaar, responsief en duurzaam genoeg om herhaalde uitvallen, zandafschuring en blootstelling aan zout water te weerstaan zonder snelle degradatie.
      features:
        - Kortere, bredere SUP vormen geoptimaliseerd voor surfwendbaarheid
        - Versterkte railconstructie voor impactbestendigheid in golven
        - 'Surf-specifieke veiligheidsuitrusting: opgerolde riemen, soft-vin opties'
        - Vlootvervangingsprogramma met seizoenskortingen voor inruil
    - title: Bedrijfs- en privéjachtclubs
      subtitle: Premium ledenervaringen
      description: 'Exclusieve privéclubs die watersporten als premiumvoorziening voor leden aanbieden. De apparatuurnormen zijn hoog: esthetiek, merkuitlijning en gastklare presentatie zijn net zo belangrijk als prestaties. Serviceverwachtingen omvatten levering met witte handschoenen, op maat gemaakte opslagoplossingen en ondersteuning op conciërgeniveau.'
      features:
        - Premium afwerkingsplanken met houtnerf EVA en metalen accenten
        - Aangepaste kleurmatching volgens de richtlijnen van het clubmerk
        - 'Conciërge-bezorging: vooraf opgeblazen, georganiseerd en gelabeld voor elk seizoen'
        - Toegewijd accountbeheer met prioriteitsrespons SLA
