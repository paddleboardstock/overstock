testimonial:
  content: We zijn begonnen met het Club Starterpakket voor onze surfschool in Portugal. 20 boards, peddels, vesten - alles arriveerde binnen 3 weken. Na twee seizoenen hebben we geüpgraded naar het Pro-pakket. De aangepaste branding met ons logo was een gamechanger voor ons professionele imago.
  name: Ricardo Santos
  title: Eigenaar, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Clubprofielen
  title: Watersportcluboplossingen<br />Per clubtype
  subtitle: 'Van universitaire paddleclubs tot exclusieve privéjachtclubs: elk type club heeft unieke uitrustingsbehoeften, gebruikspatronen en budgetstructuren. Wij stemmen elk pakket af op het clubmodel.'
  items:
    - title: Paddleclubs van universiteiten en hogescholen
      subtitle: Veelgebruikte studentenvloten
      description: Door studenten gerunde of door instellingen ondersteunde paddleclubs die SUP- en kajakprogramma's uitvoeren voor universitaire recreatieafdelingen. Apparatuur wordt elk semester geconfronteerd met hoogfrequent gebruik met een hoge omzet op meerdere vaardigheidsniveaus. Duurzaamheid en gemakkelijke repareerbaarheid zijn van cruciaal belang, naast budgetvriendelijke prijzen voor studentenorganisaties.
      features:
        - 'Extra sterke PVC-constructie, geschikt voor gebruikscycli door studenten'
        - 'Kleurgecodeerde boardreeksen per niveau voor eenvoudig vlootbeheer'
        - 'Reparatiekit + videosupport op afroep bij elke bestelling inbegrepen'
        - 'Kortingsprijzen voor studentenorganisaties en betaling per semester'
    - title: Gemeenschappelijke paddle- en sociale clubs
      subtitle: Op lidmaatschap gebaseerde recreatieclubs
      description: Community-based clubs die SUP-, kajak- en sociale peddelervaringen aanbieden aan leden. Apparatuur moet een balans bieden tussen prestaties en comfort voor een brede leeftijdscategorie, met branding die de clubidentiteit en de trots van de leden bevordert. Efficiëntie van de opslag is essentieel voor clubs die opereren vanuit een beperkte toegang tot het water.
      features:
        - 'Gemengde vloot: allround-SUPs, touringboards en recreatieve kajaks'
        - 'Volledige clubbranding: kleuren op maat, logodruk, gebrande reddingsvesten'
        - 'Compacte opbergoplossingen voor opblaasbare uitrusting'
        - 'Startpakket voor ledengroei: verwijzingskaarten, fotografie in huisstijl'
    - title: Surfscholen en surfkajakacademies
      subtitle: Kustprestaties en coaching
      description: 'Surfgerichte scholen die vaardigheden op het gebied van SUP-surfen, surfkajakken en golfrijden leren. Apparatuur moet presteren onder surfomstandigheden: manoeuvreerbaar, responsief en duurzaam genoeg om herhaalde wipeouts, zandslijtage en blootstelling aan zout water aan te kunnen zonder snelle degradatie.'
      features:
        - 'Kortere, bredere SUP-shapes, geoptimaliseerd voor manoeuvreren in de surf'
        - 'Versterkte railconstructie voor stootvastheid in golven'
        - 'Surfspecifieke veiligheidsuitrusting: spiraalleashes, opties voor zachte vinnen'
        - 'Vlootvervangingsprogramma met seizoenskortingen bij inruil'
    - title: Bedrijfs- en privéjachtclubs
      subtitle: Premium ledenervaringen
      description: 'Exclusieve privéclubs die watersporten als premiumvoorziening voor leden aanbieden. De apparatuurnormen zijn hoog: esthetiek, merkuitlijning en gastklare presentatie zijn net zo belangrijk als prestaties. Serviceverwachtingen omvatten levering met witte handschoenen, op maat gemaakte opslagoplossingen en ondersteuning op conciërgeniveau.'
      features:
        - 'Boards met premium afwerking in houtnerf-EVA en metalen accenten'
        - 'Kleuren op maat volgens de merkrichtlijnen van de club'
        - 'Concierglevering: opgepompt, klaargezet en gelabeld per seizoen'
        - 'Toegewijde accountmanager met prioriteits-SLA voor reactie'
