hero:
  tagline: Watersportclubs
  title: Uitrusting en oplossingen<br />Voor paddleclubs en trainingscentra
  subtitle: Complete uitrustingspakketten, instructeursuitrusting, branding en onderhoudsondersteuning voor SUP-clubs, kajakclubs, surfscholen en watersporttrainingscentra van elke omvang.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP boards voor watersportclubs en verhuurvloten
direct_answer: Aquafarer biedt end-to-end uitrustingsoplossingen voor watersportclubs en trainingscentra wereldwijd. Onze clubpakketten omvatten SUP-boards, kajaks, peddels, pompen, reparatiesets en veiligheidsuitrusting tegen concurrerende groothandelsprijzen met lage MOQ's. Elk pakket kan worden aangepast met clublogo's, merkkleuren en gepersonaliseerde verpakkingen. We bieden ook onderhoudstraining, ondersteuning voor reserveonderdelen en rotatieprogramma's voor apparatuur om de levensduur van uw wagenpark te maximaliseren.
solution_offerings:
  - title: Clubstartpakket
    subtitle: Voor opkomende clubs met 10–30 leden
    badge: Best Seller
    features:
      - title: Kernapparatuur
        description: 10–30 SUP-boards of kajaks met bijpassende peddels, pompen en reparatiesets
      - title: Veiligheidsuitrusting
        description: Reddingsvesten, fluitjes, leashets in clubkleuren voor elk board
      - title: Instructeursuitrusting
        description: Coachspecifieke boards met antislip decks en extra stabiliteit
      - title: Brandingpakket
        description: Aangepaste logoafdrukken op boards, peddels en verpakkingen
      - title: Trainingsmateriaal
        description: Lesgidsen voor beginners, veiligheidsprotocollen en onderhoudschecklists
    cta_text: 'Stel mijn clubpakket samen'
    cta_href: /contact
  - title: Club Premium-pakket
    subtitle: Voor gevestigde clubs en exploitanten met meerdere locaties
    badge: Professional
    features:
      - title: Volledige vloot
        description: 30-100 gemengde vloot van SUP's, kajaks en accessoires
      - title: Geavanceerd veiligheidssysteem
        description: Tracking van RFID-apparatuur, app voor schaderapportage, veiligheidssignalering
      - title: Opleiding van personeel
        description: On-site instructeurcertificering en werkplaats voor onderhoud van apparatuur
      - title: Marketingondersteuning
        description: Professionele fotografie, brochures en social media-sjablonen
      - title: Vervangingsprogramma
        description: Jaarlijkse vernieuwing van apparatuur tegen gereduceerde tarieven met inruilopties
    cta_text: 'Breid mijn club uit'
    cta_href: /contact
