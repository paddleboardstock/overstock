content_material_cert:
  tagline: Materiaalcertificering
  title: Traceerbaarheid van materialen en certificeringsbewijs
  subtitle: Kwaliteitsboten van RIB beginnen met gecontroleerde materialen en gedocumenteerde processen. Hieronder ziet u hoe wij de materiaalcertificering voor elke kritische componentgroep organiseren.
  items:
    - title: Traceerbaarheid van opblaasbare buismaterialen
      description: PVC en CSM/Hypalon buismaterialen worden geselecteerd op basis van het beoogde gebruik, de klimaatomstandigheden en de doelmarkt. Technische gegevens van leveranciers (TDS), materiaalbatchinformatie, traceerbaarheid van stofbatches, UV- en verweringstestrapporten en REACH/SVHC-verklaringen zijn beschikbaar binnen de overeengekomen reikwijdte van de projectdocumentatie.
      icon: tabler:circle
    - title: Traceerbaarheid van maritiem aluminium
      description: Voor projecten met aluminium romp RIB worden de legeringskwaliteit, dikte en materiaalbatches gecontroleerd volgens goedgekeurde specificatie. Materiaaltestcertificaten (MTC/MTR), EN 10204 3.1-documentatie, rapporten over de chemische samenstelling en mechanische eigenschappen, en traceerbaarheid van warmte/partijen worden geleverd waar overeengekomen.
      icon: tabler:rectangle
    - title: GRP Rompmateriaal- en procescontrole
      description: Voor RIB's met glasvezelrompen worden gelcoat, hars, glasvezelversterking en kernmaterialen beheerd via gecontroleerde specificaties. Materiaal-TDS/SDS, batchgegevens, laminaatspecificaties en gegevens over uitharding en werkplaatscontrole zijn beschikbaar na projectovereenkomst.
      icon: tabler:layers-subtract
    - title: Ondersteuning voor componentdocumentatie
      description: Voor geselecteerde componenten – waaronder EVA dekmaterialen, stoelen, roestvrijstalen hardware, brandstofsystemen, elektrische apparatuur en maritieme accessoires – wordt de toepasselijke leveranciersdocumentatie gecoördineerd op basis van de uiteindelijke configuratie en de vereisten van de bestemmingsmarkt.
      icon: tabler:package
    - title: Kennisgeving over nalevingsbereik
      description: Certificaten, testrapporten en conformiteitsdocumenten zijn alleen van toepassing op het specifieke productmodel, materiaal, onderdeel, productiebatch of projectomvang zoals vermeld in het relevante document. Neem contact met ons op met uw doelgroep, het beoogde gebruik en de technische vereisten, zodat het toepasselijke documentatiepakket kan worden bevestigd voordat u de bestelling plaatst.
      icon: tabler:info-circle

