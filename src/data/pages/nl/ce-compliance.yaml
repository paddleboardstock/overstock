content_scope:
  tagline: Nalevingsbereik
  title: Welke producten moeten<br />RCD-conformiteit hebben?
  subtitle: De Pleziervaartuigenrichtlijn 2013/53/EU is van toepassing op pleziervaartuigen met een romplengte tussen 2,5 m en 24 m. Het begrijpen van de reikwijdte is de eerste stap naar compliance.
  items:
    - title: RIB-boten (2,5–24 m)
      description: Starre opblaasbare boten met romplengtes van 2,5 m tot 24 m vallen onder RCD. Ontwerpcategorieën A tot en met D zijn van toepassing afhankelijk van de beoogde zeecondities en maximale windkracht.
      icon: tabler:sailboat
    - title: Opblaasbare boten (minder dan 2,5 m)
      description: Kleine opblaasbare boten en rubberboten kleiner dan 2,5 m zijn mogelijk gedeeltelijk vrijgesteld van RCD, maar vereisen nog steeds een CE-markering onder andere toepasselijke richtlijnen en EN ISO 6185-constructienormen.
      icon: tabler:sailboat
    - title: SUP-boards en accessoires
      description: Stand-up paddleboards vallen buiten het bereik van de RCD. Voor bijbehorende persoonlijke drijfmiddelen (PFD's) is echter een CE-markering vereist onder de PBM-verordening (EU) 2016/425 met USCG Type III/V-goedkeuring, indien van toepassing.
      icon: tabler:swimming
    - title: Gedeeltelijk voltooide boten
      description: Boten die zonder motor of specifieke installaties worden geleverd, vereisen een bouwersverklaring voor gedeeltelijk voltooide vaartuigen, waarbij de volledige RCD-conformiteit moet worden ingevuld door de uiteindelijke bouwer of importeur.
      icon: tabler:tool
content_trust_layers:
  tagline: Drielaags vertrouwenssysteem
  title: Nalevingsinformatie<br />— Gedeeld op het juiste niveau
  subtitle: Niet alle compliancegegevens horen thuis op een publieke website. We volgen een drielaagse aanpak die IP beschermt en tegelijkertijd het vertrouwen van de koper vergroot.
  items:
    - title: Laag 1 — Openbare website
      description: Normen waarnaar wordt verwezen, conformiteitsroutes uitgelegd, documenttypen vermeld, certificeringsbereik per modelfamilie. Geen daadwerkelijke certificaten, testgegevens of eigen technische details.
      icon: tabler:world
    - title: Laag 2 – Delen na onderzoek
      description: 'Na een gekwalificeerd onderzoek: geredigeerd DoC-voorbeeld, foto van de bouwer, lijst met toepasselijke normen, controlelijst voor naleving en samenvattingen van materiaalcertificeringen - gedeeld onder voorwaarden voor redelijk gebruik.'
      icon: tabler:mail
    - title: Laag 3 — Geheimhoudingsverklaring/bestelfase
      description: Volledig technisch dossier, risicobeoordelingen, stabiliteitsberekeningen, testrapporten, materiaalbatchrecords en documentatie over de traceerbaarheid van de productie – alleen gedeeld onder geheimhoudingsverklaring met bevestigde kopers.
      icon: tabler:lock
content_standards:
  tagline: Toepasselijke normen
  title: ISO- en EN-normen<br />Wij bouwen ernaar
  subtitle: Onze producten zijn ontworpen en getest volgens de geharmoniseerde normen onder de RCD. Er wordt verwezen naar standaardnummers en -namen; volledige standaardteksten blijven ISO-auteursrecht.
  items:
    - title: EN ISO 6185-3
      description: "Opblaasbare boten — Deel 3: Boten met een maximaal motorvermogen van 15 kW of meer. Constructie, stabiliteit, drijfvermogen en man-over-boord herstelvereisten voor RIB's."
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Opblaasbare boten — Deel 4: Boten met een maximaal motorvermogen van 15 kW en groter dan of gelijk aan 4,5 kW. Aanvullende structurele en stabiliteitseisen.'
      icon: tabler:file-text
    - title: ISO 12215-serie
      description: Kleine vaartuigen — Rompconstructie en latten. Structureel ontwerp van romp, dek en schotten voor RIB-rompen van glasvezel en aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240:2004 
      description: Kleine vaartuigen — Gebruikershandleiding. Vereiste inhoud en indeling voor de gebruikershandleiding bij elke RIB-boot die in de EU wordt geleverd.
      icon: tabler:book
    - title: EN ISO 14945:2004 
      description: Kleine vaartuigen - Bouwersplaat. Informatie die moet worden vermeld op het bouwbord dat permanent op elk vaartuig is bevestigd.
      icon: tabler:badge
    - title: ISO8666
      description: Kleine vaartuigen — Belangrijkste gegevens. Gestandaardiseerde metingen en parameters voor consistente specificatie in alle productdocumentatie.
      icon: tabler:dimensions
content_process:
  tagline: Nalevingsproces
  title: CE-naleving in 6 stappen<br />Workflow
  subtitle: 'Van projectomvang tot traceerbaarheid op serieel niveau: elk RIB-model volgt een gedefinieerd compliancepad.'
  steps:
    - number: '01'
      title: Projectomvang en -classificatie
      description: Definieer het RIB-model, de ontwerpcategorie (A/B/C/D), het maximale aantal personen, het laadvermogen, het motorvermogen en de doelgroep. Bepaal of RCD van toepassing is en welke conformiteitsbeoordelingsmodule vereist is.
      timeline: 2-3 dagen
    - number: '02'
      title: Identificatie van toepasselijke vereisten
      description: Identificeer alle toepasselijke essentiële veiligheidseisen uit RCD bijlage I, relevante geharmoniseerde normen (EN ISO 6185, 12215, 10240, 14945) en eventuele aanvullende nationale vereisten voor de doelmarkt.
      timeline: 3–5 dagen
    - number: '03'
      title: Ontwerp en technische documentatie
      description: 'Maak het Master Technical File: overzichtstekeningen, stabiliteits- en drijfvermogenberekeningen, risicobeoordeling, materiaalspecificaties en systeemveiligheidsanalyse (brandstof, elektrisch, besturing).'
      timeline: 10–15 dagen
    - number: '04'
      title: Productverificatie en testen
      description: 'Voer fysieke verificatie uit: druktesten bij 1,25x de nominale druk gedurende 24-48 uur, stabiliteits- en drijfvermogentests, belastingstests en inbedrijfstelling van systemen. Registreer alle testresultaten per romp.'
      timeline: 5–7 dagen
    - number: '05'
      title: Markering en leveringsdocumentatie
      description: Breng de CE-markering, het bouwplaatje (EN ISO 14945) en HIN/CIN (rompidentificatienummer) aan. Bereid de EU-conformiteitsverklaring, de gebruikershandleiding (EN ISO 10240) en de nalevingscontrolelijst voor.
      timeline: 2-3 dagen
    - number: '06'
      title: Traceerbaarheid op serieel niveau
      description: Elke romp ontvangt een uniek romprecord dat deze koppelt aan het Master Technical File, productiebatch, materiaalcertificaten, testresultaten en uiteindelijke configuratie. Gegevens worden langer dan 10 jaar per RCD bewaard.
      timeline: Lopend
content_document_cards:
  tagline: Documenttypen
  title: Nalevingsdocument<br />kaarten
  subtitle: Dit zijn de documenttypen die wij voor elk CE-gecertificeerd RIB-model opstellen en onderhouden. Monsters zijn beschikbaar na gekwalificeerd onderzoek.
  items:
    - title: CE / RCD-conformiteitscertificaat
      description: Modelspecifiek certificaat waarin wordt bevestigd dat het vaartuig voldoet aan alle toepasselijke essentiële veiligheidseisen van RCD 2013/53/EU, afgegeven door de fabrikant, waar nodig met betrokkenheid van de aangemelde instantie.
      icon: tabler:certificate
    - title: EU-conformiteitsverklaring (DoC)
      description: Ondertekende verklaring door de fabrikant of geautoriseerde vertegenwoordiger, met een lijst van toepasselijke richtlijnen, normen, conformiteitsmodule en details van de aangemelde instantie. Vereist voor elk model dat op de EU-markt wordt gebracht.
      icon: tabler:file-check
    - title: Bouwersplaat (EN ISO 14945)
      description: Permanent aangebracht plaatje met het maximale aantal personen, het maximale motorvermogen, de ontwerpcategorie en de identificatie van de fabrikant. Moet leesbaar blijven gedurende de levensduur van het vaartuig.
      icon: tabler:badge
    - title: Gebruikershandleiding (EN ISO 10240)
      description: Uitgebreide handleiding over veilig gebruik, noodprocedures, onderhoudsschema's en veiligheidswaarschuwingen. Verplicht voor elke RIB geleverd in de EU.
      icon: tabler:book
    - title: ISO-test- en inspectierapporten
      description: Druktestgegevens (1,25x / 24–48 uur), stabiliteits- en drijfvermogentestresultaten, materiaaltestcertificaten en dimensionale verificatierapporten - allemaal gekoppeld aan specifieke rompnummers.
      icon: tabler:test-pipe
    - title: Traceerbaarheidsgegevens van materialen
      description: Traceerbaarheid op batchniveau voor buismateriaal, lijmen, glasvezel en hardware. Koppelt elke productie-eenheid aan binnenkomende materiaalcertificaten en IQC-inspectieresultaten.
      icon: tabler:link
    - title: Kwaliteitsinspectie en QC-records
      description: Kwaliteitscontrolelijst van 100 punten per eenheid, QC-records tijdens het proces, non-conformiteitsrapporten en corrigerende maatregelen. Onderdeel van de traceerbaarheidsketen van de productie.
      icon: tabler:clipboard-check
    - title: Projectdocumentatiepakket
      description: Documentatiepakket per romp, inclusief definitieve configuratiegegevens, installatiegegevens van de motor en uitrusting, checklist voor inbedrijfstelling en leveringsdocumentatie.
      icon: tabler:package
content_design_categories:
  tagline: RCD-ontwerpcategorieën
  title: Ontwerpcategorie A–D<br />— Wat ze betekenen
  subtitle: De RCD kent ontwerpcategorieën toe op basis van de maximale windkracht en de significante golfhoogte waarvoor het vaartuig is ontworpen.
  items:
    - title: Categorie A — Oceaan
      description: Ontworpen voor langere reizen waarbij de windkracht hoger kan zijn dan Beaufort 8 (>40 knopen) en de significante golfhoogte hoger kan zijn dan 4 meter. Vereist de meest rigoureuze structurele en stabiliteitsverificatie.
      icon: tabler:ripple
    - title: Categorie B — Offshore
      description: Ontworpen voor offshore reizen met windkracht tot Beaufort 8 (≤40 knopen) en significante golfhoogte tot 4 m. Geschikt voor kust- en semi-blootgestelde wateren.
      icon: tabler:anchor
    - title: Categorie C — Kust
      description: Ontworpen voor kustreizen met windkracht tot Beaufort 6 (≤27 knopen) en significante golfhoogte tot 2 m. De meeste recreatieve RIB's vallen in deze categorie.
      icon: tabler:sun
    - title: Categorie D — Beschut
      description: Ontworpen voor beschutte wateren met windkracht tot Beaufort 4 (≤16 knopen) en significante golfhoogte tot 0,3 m. Meren, rivieren en beschermde havens.
      icon: tabler:pool
content_hin:
  tagline: Ambachtelijke identificatie
  title: HIN/CIN & bouwersplaat
  subtitle: Voor elke RIB-boot is een Hull Identification Number (HIN) of Craft Identification Number (CIN) en een bouwersplaat vereist volgens EN ISO 14945 en RCD-vereisten.
  items:
    - title: Rompidentificatienummer (HIN)
      description: Een unieke code van 14 tekens, permanent gemarkeerd op de stuurboordzijde van de spiegel, die de fabrikantcode (MIC), modeljaar, productiejaar en serienummer codeert. Vereist voor toegang tot de EU-markt.
      icon: tabler:hash
    - title: Vaartuigidentificatienummer (CIN)
      description: Volgens EN ISO 10087, een verborgen secundair identificatienummer dat op een verborgen locatie is geplaatst voor antidiefstal- en traceerbaarheidsdoeleinden.
      icon: tabler:eye-off
    - title: Inhoud bouwplaat
      description: Maximaal aantal personen, maximaal motorvermogen (kW), maximale belasting (kg), ontwerpcategorie, naam van de fabrikant en CE-markering – allemaal permanent weergegeven op een corrosiebestendig plaatje.
      icon: tabler:badge
content_tech_file:
  tagline: Technische dossierstructuur
  title: Master technisch dossier<br />& romprecord
  subtitle: 'Ons documentatiesysteem volgt een tweeledige structuur: het Master Technical File voor elke modelfamilie en individuele romprecords voor elke geproduceerde boot.'
  items:
    - title: Master technisch dossier
      description: 'Bevat de volledige nalevingsdocumentatie voor een modelfamilie: algemene regeling, risicobeoordeling, stabiliteits-/drijfvermogenberekeningen, materiaalspecificaties, toepasselijke normen en conformiteitsbeoordelingsrecords. 10+ jaar bewaard.'
      icon: tabler:folder
    - title: Romprecord (traceerbaarheid per boot)
      description: 'Elke romp heeft een uniek record dat het koppelt aan het Master Technical File: HIN, productiedatum, buizenbatch, materiaalcertificaten, druktestresultaat, eindconfiguratie, motorinstallatie en leveringsbestemming.'
      icon: tabler:file-description
    - title: Klantnalevingspakket
      description: Leveringspakket per romp inclusief DoC, foto van het bouwersplaatje, gebruikershandleiding, testoverzicht en definitief configuratieblad - geleverd bij elke RIB die naar de EU wordt verzonden.
      icon: tabler:package
faq:
  title: CE-conformiteit – Veelgestelde vragen
  questions:
    - q: Zijn alle Paddle Board Overstock RIB-boten CE-gecertificeerd voor de EU-markt?
      a: RIB-boten in onze catalogus zijn ontworpen en gedocumenteerd voor RCD 2013/53/EU-conformiteit volgens de toepasselijke EU-richtlijnen. CE-markering geldt per model en per configuratie. Neem contact met ons op voor een modelspecifiek compliancescope-document.
    - q: Wat is het verschil tussen RCD-naleving en CE-markering?
      a: RCD (Richtlijn Pleziervaartuigen 2013/53/EU) is de EU-wetgeving die essentiële veiligheidseisen stelt. CE-markering is het visuele symbool dat op een product wordt geplaatst waarvan is beoordeeld en bevestigd dat het aan deze eisen voldoet. Een product moet voldoen aan de RCD voordat het de CE-markering mag dragen.
    - q: Verstrekt u bij elke boot een conformiteitsverklaring?
      a: Ja. Elke RIB-boot die op de EU-markt wordt geleverd, bevat een modelspecifieke EU-conformiteitsverklaring met de toepasselijke richtlijnen, geharmoniseerde normen, conformiteitsbeoordelingsmodule en details van de aangemelde instantie.
    - q: Welke conformiteitsbeoordelingsmodule gebruikt Paddle Board Overstock?
      a: De module is afhankelijk van de ontwerpcategorie en het boottype. De meeste RIB-modellen in ontwerpcategorie C gebruiken Module A (interne productiecontrole). Voor boten van ontwerpcategorie A/B of specifieke configuraties kan Module B+C of B+D van toepassing zijn met betrokkenheid van de aangemelde instantie. Per project adviseren wij over de juiste module.
    - q: Kunt u nalevingsdocumentatie delen voordat we een bestelling plaatsen?
      a: Na een gekwalificeerd onderzoek delen we een compliance-scopedocument met de toepasselijke normen, conformiteitsroute en documenttypen die beschikbaar zijn voor het model dat u evalueert. Volledige technische bestanden worden na orderbevestiging gedeeld onder NDA.
    - q: Wat is een Hull Identification Number (HIN) en is dit inbegrepen?
      a: De HIN is een unieke identificatiecode van 14 tekens die permanent op elke boot is gemarkeerd en die de fabrikantcode (MIC), modelaanduiding, productiejaar en serienummer codeert. Het is verplicht voor alle RIB-boten die op de EU-markt worden gebracht en is inbegrepen bij elke Paddle Board Overstock RIB.
    - q: Hoe lang worden technische bestanden bewaard?
      a: Volgens de RCD 2013/53/EU-vereisten moet de fabrikant het technische dossier gedurende ten minste 10 jaar bewaren vanaf de laatste datum waarop het product op de markt is gebracht. Paddle Board Overstock houdt de volledige technische documentatie bij voor alle geproduceerde modellen.
    - q: Helpt u met importeursverplichtingen onder de RCD?
      a: 'Ja. Wij bieden het documentatiepakket dat EU-importeurs nodig hebben om aan hun verplichtingen te voldoen: toegang tot technische bestanden, DoC, bouwersplaat, gebruikershandleiding en gegevens over de traceerbaarheid van producten. De verantwoordelijkheden van importeurs onder de RCD zijn duidelijk gedocumenteerd in onze nalevingsgids.'
