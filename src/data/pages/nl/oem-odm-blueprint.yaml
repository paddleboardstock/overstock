process_steps:
  title: 6-stappen OEM/ODM proces
  subtitle: Van ontwerpbrief tot FOB Qingdao — een gestroomlijnde workflow
  steps:
    - number: '01'
      title: Ontwerpspecificatie & 3D CAD-modellering
      description: Deel uw gewenste specificaties, referentieproduct of concept. Ons engineeringteam ontwikkelt gedetailleerde CAD-tekeningen en 3D-weergaven ter goedkeuring door u.
      timeline: 3–5 dagen
    - number: '02'
      title: Materiaalselectie & Stoffen Testen
      description: Kies uit militaire kwaliteit PVC (0,9–1,2 mm), Hypalon CSM, of drop-stitch kernstoffen. We voeren treksterkte-, coatinghechtings- en UV-stabiliteitstests uit.
      timeline: 2-3 dagen
    - number: '03'
      title: Snelle Prototyping & Monsterproductie
      description: Wij CNC-machine speciale mallen en produceren pre-productie monsters met uw merk-kleuren, logo en gespecificeerde materialen. Monsters worden verzonden ter goedkeuring.
      timeline: 7–14 dagen
    - number: '04'
      title: 24–48 Uur Hoge Druk Houdtest
      description: Elke prototype ondergaat rigoureuze drukbehoudtests bij 1,25 keer de nominale druk. Naden loslaattesten en dimensionale verificatie worden uitgevoerd.
      timeline: 1–2 dagen
    - number: '05'
      title: CE/ISO Kwaliteitsinspectie & Verpakking
      description: 100-punten kwaliteitscontrolelijst. Elke eenheid wordt geïnspecteerd voordat deze klaar is voor detailhandelsverpakking. CE verklaring van conformiteit en BSCI rapport van naleving inbegrepen.
      timeline: 2-3 dagen
    - number: '06'
      title: FOB Qingdao Verzending & Logistiek
      description: Klaar product gepalletiseerd, krimpverpakt en in containers geladen in de haven van Qingdao. Volledige exportdocumentatie, douaneafhandeling en realtime tracking.
      timeline: 7–14 dagen
