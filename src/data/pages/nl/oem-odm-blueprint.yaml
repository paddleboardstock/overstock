faq:
  title: OEM/ODM — Veelgestelde vragen
  questions:
    - q: Wat is de minimale bestelhoeveelheid (MOQ) voor aangepaste opblaasbare SUPs?
      a: Voor standaardmodellen met bestaande mallen begint MOQ bij 5–10 eenheden per ontwerp. Voor volledig aangepaste mallen en gereedschappen is MOQ meestal 200 eenheden. We werken samen met startups en opkomende merken om haalbare instappunten te vinden.
    - q: Hoe lang duurt het OEM monsterproces?
      a: Standaard prototypemonsters worden binnen 7–14 werkdagen na goedkeuring van het ontwerp voltooid. Spoedbestellingen kunnen worden voorrang gegeven en voltooid binnen 5–7 dagen tegen een extra vergoeding.
    - q: Wat is het verschil tussen PVC en Hypalon voor opblaasboten?
      a: PVC is lichter, betaalbaarder en biedt uitstekende flexibiliteit bij koud weer. Hypalon (CSM) biedt superieure UV en ozonbestendigheid met een langere levensduur (10–15 jaar versus 5–8 jaar). We raden PVC aan voor de meeste recreatieve toepassingen en Hypalon voor commercieel/professioneel gebruik.
    - q: Kun je de vorm en het ontwerp van het opblaasbare aanpassen?
      a: Ja. Ons R&D-team kan aangepaste mallen ontwikkelen voor elk rompontwerp, boardomtrek of buisconfiguratie. We gebruiken CNC-bewerkt aluminium mallen voor precisie en consistentie.
    - q: Biedt u fabriek auditdiensten aan?
      a: Wij verwelkomen audits op locatie en door derden bij onze fabriek van 12.000 m² in Qingdao. Wij behouden ISO 9001 en BSCI certificeringen en kunnen auditrapporten delen na een NDA.
    - q: Welke verzendvoorwaarden biedt u aan?
      a: Wij bieden FOB Qingdao (standaard), CIF en DDP verzendvoorwaarden. Containerbelading en volledige exportdocumentatie zijn inbegrepen bij alle OEM bestellingen.
content_profiles:
  tagline: Merkprofielen
  title: OEM / Private Label Productie<br />Per Klanttype
  subtitle: Verschillende merkprofielen hebben verschillende eisen — wij passen onze OEM/ODM-diensten aan om te passen bij uw bedrijfsmodel, schaal en go-to-marketstrategie.
  items:
    - title: Start-up watersportmerken
      subtitle: Laag MOQ, snelle opbouw
      description: Ondernemers en oprichters die hun eerste lijn van SUPs, kajaks of opblaasbare boten lanceren. Je hebt een productiepartner nodig die jouw merk behandelt alsof het hun eigen merk is — met lage toegangsdrempels, flexibele batchgroottes en praktische ontwerprichtlijnen bij elke stap.
      features:
        - MOQ zo laag als 50–100 eenheden per SKU, niet duizenden
        - Bestaande malbibliotheek om gereedschapskosten over te slaan
        - 'Volledig merkpakket: logo, buisgraphics, verpakking, hangtags'
        - Sample-first workflow — goedkeuren vóór productie
    - title: Opgerichte maritieme merken
      subtitle: OEM schaal met CE/ISO naleving
      description: Bestaande boot-, PWC- of maritieme accessoiremerken die opblaasbare vaartuigen aan hun portfolio toevoegen. U heeft consistente kwaliteit nodig over productieruns, naleving van regelgeving voor wereldwijde markten, en de mogelijkheid om samen aangepaste romp- of buisvormen te ontwerpen.
      features:
        - Maatwerk 3D-molontechniek voor eigendomsontwerpen
        - CE 2013/53/EU, UKCA, USCG conformiteitsdocumentatie
        - BSCI sociale auditrapporten voor naleving door detailhandelaren
        - Toegewijd accountbeheer + prioriteitsproductieplaatsen
    - title: DTC- en e-commercemerken
      subtitle: Verkoopklare verpakking op schaal
      description: Online-first merken die via Amazon, Shopify of hun eigen webwinkels verkopen. Verpakking, unboxing-ervaring en consistente eenheidskwaliteit zijn cruciaal. Je hebt een fabriek nodig die de snelheid en retourpercentagedynamiek van e-commerce begrijpt.
      features:
        - Klaar-voor-verkoop doosontwerp + insertkaartdruk
        - Vacumeren / palletiseren voor kosteneffectief verzenden
        - EAN / UPC-streepjescode en douaneklare documentatie
        - Consolidatie van gemengde containers om de totale kosten te optimaliseren
    - title: Lifestyle- en outdoormerken
      subtitle: White-label ontwerp categorie-extensie
      description: Kleding, outdooruitrusting of reismerken die de watersportcategorie betreden onder hun eigen label. Mogelijk hebt u geen maritieme technische expertise in huis, dus u heeft een partner nodig die u van concept tot container met minimale wrijving kan begeleiden.
      features:
        - Trendonderzoek en concept moodboards
        - Co-branded limited editions en seizoensgebonden kleurvarianten
        - Ontwerp-naar-monster cyclus binnen 10–14 werkdagen
        - 'End-to-end logistiek: fabriek → magazijn → consument'
