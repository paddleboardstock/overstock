hero:
  tagline: Internationale Scheepvaart
  title: Internationale verzending —<br />Express- en zeevracht naar 50+ landen
  subtitle: Elke bestelling wordt verzonden vanaf onze logistieke basis in Weihai, China. Kies voor express luchtvracht voor monsters en dringende bevoorradingen, of geconsolideerde zeevracht voor groothandelsbestellingen voor kleine bedrijven.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Borden die zijn ingepakt voor internationale verzending
direct_answer: Paddle Board Overstock verzendt naar meer dan 50 landen vanuit Weihai, China. Express luchtvracht vervoert 1–3 borden, voorbeeldbestellingen en dringende bevoorradingen; Consolidated Sea Freight is de economische optie voor groothandelsbestellingen van 5–20 kaarten. Elke zending bevat deur-tot-deur tracking, en elk bord wordt voor 100% onder druk getest en voorzien van volledige accessoirekit voordat het wordt verzonden.
tldr_points:
  - 'Expressluchtvracht: 1–3 borden, monsters, dringende aanvulling — snelste optie'
  - 'Zeevracht: 5–20 bulkbestellingen aan boord — laagste vrachtkosten per boord.'
  - Deur-tot-deur tracking van elke zending naar 50+ landen
  - Vracht, verzekering, douaneafhandeling en invoerrechten worden in uw offerte gespecificeerd — geen vage alles-in-beloftes
from_china:
  tagline: Scheepvaart vanuit China
  title: Waar bestellingen vandaan worden verzonden
  description: Alle bestellingen worden verzonden vanuit onze logistieke basis in Weihai, China — het hart van onze productie- en opslagoperatie. Weihai is een belangrijke kusthavenstad in de provincie Shandong met directe zee- en luchtvrachtverbindingen, waardoor doorvaarttijden en vrachtkosten concurrerend blijven naar bestemmingen in Azië, Amerika, Afrika, Europa en het Midden-Oosten.
modes_section:
  tagline: Twee opties
  title: Express Shipping of zeevracht
  subtitle: De juiste transportmethode hangt af van hoe snel je de boards nodig hebt en hoeveel je bestelt. Beide opties worden bij elke aanvraag aangeboden.
  express:
    name: Optie A — Express verzending
    best_for: Het beste voor 1–3 planken, monsters en spoedige bijbevoorradingen
    description: Air Express krijgt kleine bestellingen en proefborden binnen enkele dagen bij je thuis, niet in weken. Ideaal als je een model test vóór een grotere bestelling, of een bestseller halverwege het seizoen aanvult.
    features:
      - 1–3 kaarten, losse modellen of gemengde modelvoorbeelden
      - Snelste transit van de twee opties — geprijsd per bestemming
      - Deur-tot-deur tracking met een grote expressvervoerder
      - 'Typisch gebruik: monsters, spoedige herbevoorradingen, kleine eerste bestellingen'
  sea:
    name: Optie B — Zeevracht
    best_for: Het beste voor 5–20 karton groothandels- en retailbestellingen
    description: Geconsolideerde zeevracht is de economische keuze voor groothandelsbestellingen voor kleine bedrijven. De borden worden samen in één geconsolideerde zending uit Weihai gepakt, waardoor de kosten per boord laag blijven.
    features:
      - 5–20 planken, retailer en groothandelsbestellingen
      - De laagste vrachtkosten per boord van de twee opties
      - Geconsolideerde verpakking — één zending, één uitverkoop
      - 'Typisch gebruik: seizoensgebonden herbevoorradingen, gemengde model groothandelsorders'
