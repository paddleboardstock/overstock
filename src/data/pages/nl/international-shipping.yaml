process_section:
  tagline: Hoe Verzending Werkt
  title: Van Ons Magazijn naar Uw Deur
  steps:
    - title: Offerte met Vervoersopties
      description: Elke offerte specificeert de vervoersopties voor uw bestemming — expres en zee — met geschatte transittijden, zodat niets voor u wordt beslist.
    - title: Kwaliteitscontrole en Verpakken
      description: Boards worden 100% drukt getest en vervolgens verpakt met pomp, peddel, leash, vin, rugzak en reparatieset — hetzelfde complete pakket dat wij ook in de winkel verkopen.
    - title: Verzending vanuit Weihai
      description: Uw zending verlaat onze logistieke basis met de door u gekozen vervoersmethode en deur-tot-deur tracking wordt dezelfde dag met u gedeeld.
    - title: Douane Inklaring
      description: Wij leveren de commerciële factuur en paklijst die u nodig heeft voor import. Invoerrechten en belastingen in uw land zijn de verantwoordelijkheid van de importeur — zie de douane sectie hieronder.
    - title: Levering en Inspectie
      description: Controleer uw levering bij aankomst. Als iets beschadigd of ontbrekend is, neem contact met ons op met foto's en uw ordernummer — zie ons beleid voor verloren en beschadigde goederen hieronder.
customs_section:
  tagline: Douane & Belastingen
  title: Douanerechten en Invoerbelastingen
  subtitle: Wij houden de verantwoordelijkheden voor vracht expliciet in plaats van vage beloften te doen. Hier is precies wie waarvoor verantwoordelijk is.
  items:
    - title: Wat Wij Dekken
      description: Uw offerte omvat de vrachtkosten naar uw bestemming, en wij bereiden en leveren alle exportdocumenten — commerciële factuur, paklijst en zendingstracking.
    - title: Wat de Importeur Dekt
      description: Invoerrechten, BTW/GST en eventuele belastingen van het bestemmingsland zijn te betalen door de importeur (u of uw bedrijf) volgens de regels van uw land. Wij verwerken geen vage belastingbeloften in onze vracht offertes.
    - title: Ondersteuning bij Douane Inklaring
      description: Onze administratie is compleet en consistent — de juiste HS-codes, opgegeven waarden en boardspecificaties — wat zorgt voor een vlotte inklaring. Als uw expediteur of douanekantoor extra documentatie nodig heeft, leveren wij die.
    - title: Controleer uw lokale tarieven voordat u bestelt
      description: Invoerrechten op opblaasbare watersportuitrusting verschillen per land. Controleer de invoerregels van uw land of vraag ernaar in uw aanvraag — onze regionale marktgidsen bevatten douanenotities voor belangrijke markten.
lost_damaged:
  title: Verloren of Beschadigde Zendingen
  description: Controleer uw levering wanneer deze aankomt. In het zeldzame geval dat een bord beschadigd aankomt of een pakket ontbreekt, neem dan zo snel mogelijk contact met ons op met uw bestelnummer en duidelijke foto's van de verpakking en het bord. We beoordelen elk geval individueel — afhankelijk van het geval betekent dit een vervangend onderdeel, een vervangend bord of een terugbetaling voor het betreffende artikel. Productiefouten worden afzonderlijk gedekt door onze 2-jarige SUP garantie.
destinations_section:
  tagline: Waar we verzenden
  title: 50+ landen en nog steeds groeiende
  description: We verzenden wereldwijd, met gedetailleerde gidsen voor onze belangrijke regionale markten. Elke marktgids behandelt lokale klanttypes, verzendnotities en douanetips voor dat gebied.
  regions_label: Regionale Gidsen
  countries_label: Landengidsen
faq_section:
  title: Verzendings-FAQ
  items:
    - q: Hoe lang duurt expresverzending?
      a: De transittijd voor expreszendingen hangt af van de bestemming — we geven bij elke aanvraag de geschatte transittijd voor uw land aan, voordat u zich ergens toe verbindt.
    - q: Hoe lang duurt zeevracht?
      a: Het zeevrachtvervoer varieert per bestemmingshaven en vaarschema's. We geven een geschat tijdsbestek voor uw bestemming bij uw bestelling, en u ontvangt tracking zodra de zending vertrekt.
    - q: Welke verzendmethode moet ik kiezen?
      a: Express voor 1–3 planken, monsters of urgente bijbestellingen. Zeevracht voor 5–20 planken groothandelsbestellingen waar de kosten per plank belangrijker zijn dan snelheid. We geven beide offertes zodat je kunt vergelijken.
    - q: Zijn invoerrechten en belastingen inbegrepen in de verzendkosten?
      a: Nee. Vracht wordt afzonderlijk geoffreerd en invoerrechten, BTW/GST en bestemmingsbelastingen zijn de verantwoordelijkheid van de importeur volgens de regels van uw land. Wij leveren volledige, nauwkeurige documentatie om de inklaring soepel te laten verlopen.
    - q: Verzenden jullie naar mijn land?
      a: We verzenden naar 50+ landen. Bekijk onze regionale en landengidsen hieronder, of vraag het gewoon in uw aanvraag — we zullen de huidige service naar uw adres bevestigen.
    - q: Kan ik mijn bestelling volgen?
      a: Ja. Elke zending — expres of over zee — omvat deur-tot-deur tracking die we met u delen op de dag van verzending.
