testimonial:
  content: Ik huurde 5 boards van een lokale winkel en verloor 60% van mijn inkomsten aan hen. Paddle Board Overstock hielp me mijn eigen vloot van 15 SUPs op te bouwen. De ROI calculator die ze aanboden liet zien dat ik na 4 maanden break-even zou draaien — het duurde eigenlijk 3 maanden. Nu breid ik uit naar 30 boards.
  name: Daniël Okonkwo
  title: Eigenaar, Lakeland SUP Rentals — Ontario, Canada
content_segments:
  tagline: Verhuurprofielen
  title: Water Sports Verhuuroplossingen<br />Per Operator Type
  subtitle: 'Verschillende verhuurbedrijven hebben verschillende behoeften: van kleine SUP-verhuur aan het strand tot grootschalige watersportcentra in resorts. Wij stemmen onze uitrustingspakketten en ondersteuningsmodel daarop af.'
  items:
    - title: SUP-verhuur aan het strand en aan het meer
      subtitle: Operaties met grote volumes en weinig complexiteit
      description: Operators die stand-up paddleboards direct aan strandbezoekers en bezoekers van meren verhuren. Jouw prioriteit is het minimaliseren van de omlooptijd tussen verhuur, het in rotatie houden van de uitrusting, en het beheren van seizoensgebonden vraagpieken met een kleine opslagruimte.
      features:
        - Opblaasbare SUP vloot die plat op te bergen is — geen steiger of trailer nodig
        - Commerciële kwaliteit PVC geschikt voor 100+ verhuurcycli per seizoen
        - Sneldrogend, UV bestendig materiaal voor herverhuur op dezelfde dag
        - Kleurgecodeerde boardseries voor gemakkelijke vlootidentificatie
    - title: Resort & Hotel Watersportcentra
      subtitle: Gastervaring en merkafstemming
      description: Resorts en hotels die watersporten ter plaatse aanbieden. Apparatuur moet er eersteklas uitzien, betrouwbaar presteren bij zowel beginners als gevorderde gasten, en integreren met de bestaande workflows voor het boeken en factureren van activiteiten in het resort.
      features:
        - Op maat gemaakte SUP boards en zwemvesten in de kleur van het resort
        - 'Gemengde vloot: all-round, touring en art-series SUPs'
        - Stille, brandstofvrije elektrische pomp oplossingen voor op het strand
        - Personeelstraining en onboarding voor onderhoud inbegrepen
    - title: Boutique & Mobiele SUP Verhuur
      subtitle: Pop-up en afleveringsgebaseerde verhuurdiensten
      description: Operators brengen boards direct naar de klant — afleveringen op het strand van hotels, pop-up verhuurpunten bij evenementen en mobiele opstellingen. Apparatuur moet snel te installeren zijn, gemakkelijk te transporteren en er op het eerste gezicht representatief uitzien, met flexibele vlootgrootte voor evenementen en seizoensgebonden vraag.
      features:
        - Rugzakstijl board transport — geen trailer nodig
        - Snelle opblazing voor op aanvraag installatie in minder dan 15 minuten
        - Representatieve apparatuur die er op het eerste gezicht premium uitziet
        - Flexibele vlootgrootte voor evenementen en seizoensgebonden vraag
    - title: Tour- en avonturenoperators
      subtitle: Begeleide excursievloten
      description: Operators die begeleide watersporttours uitvoeren — SUP safari's, snorkelexcursies en kustverkenningstours. Apparatuur moet stabiel genoeg zijn voor beginnende deelnemers, snel schoon te maken tussen groepen, en duurzaam genoeg voor dagelijks begeleid gebruik in diverse wateromstandigheden.
      features:
        - Extra-stabiele SUP platforms (32" breed +) voor eerstetijdrijders
        - Extra-grote stabiele platforms voor foto's van koppels/groeps tours
        - Ingebouwde laadcapaciteit voor snorkeluitrusting, droge tassen en koelboxen
        - Veiligheidsuitrustingspakketten voor commerciële touractiviteiten
