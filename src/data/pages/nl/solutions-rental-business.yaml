testimonial:
  content: Ik huurde 5 boards bij een plaatselijke winkel en verloor 60% van mijn inkomsten aan hen. Aquafarer heeft me geholpen mijn eigen vloot van 15 SUP's te bouwen. De ROI-calculator die ze verstrekten, liet zien dat ik binnen vier maanden break-even zou draaien – in werkelijkheid duurde het drie maanden. Nu breid ik uit naar 30 boards en voeg ik kajaks toe.
  name: Daniël Okonkwo
  title: Eigenaar, Lakeland SUP Rentals — Ontario, Canada
content_segments:
  tagline: Verhuurprofielen
  title: Watersportverhuuroplossingen<br />Per type exploitant
  subtitle: 'Verschillende verhuurbedrijven hebben verschillende behoeften: van kleine SUP-verhuur aan het strand tot grootschalige watersportcentra in resorts. Wij stemmen onze uitrustingspakketten en ondersteuningsmodel daarop af.'
  items:
    - title: SUP-verhuur aan het strand en aan het meer
      subtitle: Operaties met grote volumes en weinig complexiteit
      description: Exploitanten die stand-up paddleboards en kajaks rechtstreeks verhuren aan strandgangers en bezoekers aan het meer. Uw prioriteit is het minimaliseren van de doorlooptijd tussen verhuur, het rouleren van apparatuur en het beheersen van seizoenspieken in de vraag met een kleine opslagvoetafdruk.
      features:
        - Opblaasbare SUP-vloten die plat op te bergen zijn — geen steiger of trailer nodig
        - PVC van commerciële kwaliteit, geschikt voor meer dan 100 verhuurcycli per seizoen
        - Snel drogende, UV-bestendige stof voor dezelfde dag opnieuw verhuurbaar
        - Kleurgecodeerde boardlijnen voor eenvoudige vlootidentificatie
    - title: Resort & Hotel Watersportcentra
      subtitle: Gastervaring en merkafstemming
      description: Resorts en hotels die watersporten ter plaatse aanbieden. Apparatuur moet er eersteklas uitzien, betrouwbaar presteren bij zowel beginners als gevorderde gasten, en integreren met de bestaande workflows voor het boeken en factureren van activiteiten in het resort.
      features:
        - Op maat gebrandde SUP-boards en zwemvesten in de kleuren van het resort
        - 'Gemengde vloot: SUP''s, kajaks, peddelboten en kleine RIB-tenders'
        - Stille, brandstofvrije elektrische pompoplossingen voor het opblazen op het strand
        - Personeelstraining en onderhoudsintroductie inbegrepen
    - title: Boot- en RIB-verhuurbedrijven
      subtitle: Commerciële scheepsverhuurvloten
      description: Exploitanten die gemotoriseerde vaartuigen huren – RIB-tenders, opblaasbare boten en kleine runabouts – per uur of halve dag. Uw vloot moet voldoen aan de veiligheidsvoorschriften op zee, bestand zijn tegen intensief gebruik door gasten en de mechanische stilstand tussen charters tot een minimum beperken.
      features:
        - RIB-pakketten met hekspiegels klaar voor buitenboordmotoren van 30–90 PK
        - Vloerpanelen van zeewaardig triplex voor langdurige structurele integriteit
        - Snelstart-ventielsystemen voor een snellere omzet
        - Reserveonderdelenkit + technische SLA-support op afroep
    - title: Tour- en avonturenoperators
      subtitle: Begeleide excursievloten
      description: Exploitanten die begeleide watersporttochten organiseren - SUP-safari's, grotkajakken, snorkelexcursies of RIB-tochten van eilandhoppen. Uitrusting moet stabiel genoeg zijn voor beginnende tourgasten, snel schoon te maken tussen groepen, en duurzaam genoeg voor dagelijks begeleid gebruik in diverse wateromstandigheden.
      features:
        - Extra stabiele SUP-platforms (82 cm+ breed) voor eerste keer gebruikers
        - Tandemkajakopties voor configuraties voor paars- en groepstochten
        - Ingebouwde laadcapaciteit voor snokkeluitrusting, droogtassen en koelboxen
        - CE- + USCG-conformiteitsdocumentatie voor commerciële exploitatie
