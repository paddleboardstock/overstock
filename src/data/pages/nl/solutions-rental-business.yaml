        description: '10 SUP-boards met peddels, pompen, reddingsvesten en reparatiesets: alles wat je nodig hebt om te lanceren'
      - title: Opslagoplossingen
        description: Opblaasbare uitrusting verpakt plat — geen steiger of aanhanger nodig voor opslag
      - title: Verhuurklaar Bouw
        description: Constructie van commerciële kwaliteit, gebouwd voor dagelijks verhuurgebruik
      - title: Startersmarketing
