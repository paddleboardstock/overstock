hero:
  tagline: Latijns-Amerika
  title: SUP Groothandelsboards voor<br />Latijns-Amerikaanse Retailers
  subtitle: Gloednieuwe overtollige paddleboards voor strandwinkels, verhuurvloten en online verkopers in heel Latijns-Amerika — van 5 boards, gemengde modellen, express- of zeevracht.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Overbodige SUP boards voor Latijns-Amerikaanse paddleboardwinkels
direct_answer: Paddle Board Overstock levert gloednieuwe overtollige opblaasbare SUP boards aan kleine retailers in heel Latijns-Amerika — van Mexico en Brazilië tot Colombia, Peru, Chili en Argentinië. Groothandelsbestellingen beginnen bij 5 boards met gemengde modellen welkom, en elke bestelling wordt vanuit Weihai, China verzonden per express luchtvracht of geconsolideerd zeevracht. Boards worden 100% onder druk getest en vallen onder de 2-jarige SUP garantie.
tldr_points:
  - Groothandel uit 5 boards — gemengde modellen in één bestelling, geprijsd naar totale hoeveelheid
  - Expresslucht of geconsolideerde zeevracht vanuit Weihai, China
  - Spaans- en Portugeesmarkten die in de regio worden bediend
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De Latijns-Amerikaanse SUP markt
  paragraphs:
    - Latijns-Amerika is een van de snelst groeiende stand-up paddle-markten ter wereld. Lange kustlijnen op twee oceanen, gevestigde strandtoerisme-economieën en een sterke boardsportcultuur geven onafhankelijke retailers van Tulum tot Florianópolis een groeiende klantenkring — toeristen die hun eerste les nemen, weekendpeddelaars en een groeiende lokale SUP race- en surfgemeenschap.
    - The retail landscape is dominated by small and mid-sized independent shops: strandscholen voor peddels die verkopen wat ze huren, surfwinkels die SUP lijnen toevoegen, en online verkopers die voor het eerst direct importeren. Deze bedrijven hebben zelden containerladingen van één model nodig — ze hebben 5–20 boards per bestelling nodig, gemixt tussen beginnersvriendelijke allround modellen en een paar premium edities.
  customer_types:
    - title: Winkels in Beach Town
      description: Winkels in resortplaatsen die toeristen bedienen — ze hebben duurzame beginnersboards in volume nodig, plus een paar premium modellen voor tentoon en verkoop.
    - title: Paddlescholen & Huurvloten
      description: Scholen combineren lessen met detailhandel, en verhuurvloten vernieuwen elk seizoen borden met bestellingen van verschillende modellen.
    - title: Online verkopers
      description: Spaans- en Portugeestalige e-commerceverkopers introduceren de SUP categorie op hun nationale markt zonder risico op containerschaal.
shipping_section:
  title: Schip naar Latijns-Amerika
  paragraphs:
    - Bestellingen worden verzonden vanaf onze logistieke basis in Weihai, China. Express luchtvrachtmonsters, 1–3 boardorders en dringende bevoorrading; Consolidated Sea Freight is de economische route voor 5–20 board groothandelsorders naar grote havens in de regio.
    - Wij leveren volledige, nauwkeurige exportdocumenten — commerciële factuur en verpakkingslijst — om de douaneafhandeling soepel te laten verlopen. Invoerrechten en belastingen worden door uw land vastgesteld en door de importeur betaald; wij bundelen nooit vage "inclusief belastingen" beloften in een vrachtofferte.
  customs_note: Invoerregels en invoerrechten verschillen sterk tussen Latijns-Amerikaanse landen. Controleer het huidige importregime van uw land voor opblaasbare watersportuitrusting voordat u bestelt, en vraag ons om extra documentatie die uw makelaar nodig heeft.
faq_section:
  title: Latijns-Amerika FAQ
  items:
    - q: Kan ik een offerte krijgen in het Spaans of Portugees?
      a: Ons team werkt met kopers in heel Latijns-Amerika en kan offertes en orderbevestigingen afhandelen voor Spaans- en Portugeessprekende klanten. Stel uw aanvraag.
    - q: Verzend je naar mijn land in Latijns-Amerika?
      a: Wij verzenden in de regio — Mexico, Brazilië, Colombia, Peru, Chili, Argentinië, Ecuador en verder. Bevestig uw exacte bestemming in uw offerteaanvraag en wij zullen de huidige vrachtservice verifiëren.
    - q: Wat is het minimumbedrag voor groothandel in Latijns-Amerika?
      a: In totaal vijf borden, waarbij je alle modellen op voorraad kunt mixen. Dat totaal bepaalt je prijsklasse - je kunt all-around, touring en art-edities in één zending combineren.
    - q: Wie betaalt invoerrechten in mijn land?
      a: U doet dit, als importeur, volgens de regels van uw land. Wij leveren correcte, volledige documenten (commerciële factuur, paklijst) zodat de inklaring voorspelbaar is — zie onze pagina over internationaal verzenden voor het volledige overzicht.
