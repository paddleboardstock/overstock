hero:
  tagline: Succesverhalen
  title: Echte resultaten van<br />bouwers van waterbedrijven
  subtitle: Zie hoe clubs, resorts en verhuurbedrijven over de hele wereld bloeiende watersportprogramma's hebben opgebouwd met Paddle Board Overstock-materiaal en ondersteuning.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Succesverhalen van klanten van Paddle Board Overstock
stories:
  - title: Hoe een mediterraan resort een winstgevend SUP-verhuurbedrijf opbouwde
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-sterren strandresort — Griekenland
    problem: Het resort had eersteklas wateractiviteiten voor gasten nodig om de tevredenheidsscores te verhogen en een nieuwe inkomstenstroom te creëren, maar het ontbrak aan apparatuur, veiligheidsinfrastructuur en expertise van het personeel.
    solution: Paddle Board Overstock leverde 50 op maat gemaakte SUP-boards met resortkleuren en logo, een compleet veiligheidssysteem inclusief badmeesterstation en boeienlijnen, en een driedaags trainingsprogramma voor het personeel over het omgaan met apparatuur, instructie van gasten en veiligheidsprotocollen.
    result:
      - Meer dan 300 gastactiviteiten per week geboekt binnen de eerste maand
      - 'Tevredenheidsscore van gasten voor wateractiviteiten: 4,8/5'
      - 'Nieuwe jaarlijkse neveninkomsten: $180.000'
      - Nul veiligheidsincidenten in het eerste seizoen
      - Kosten voor vervanging van apparatuur met 40% gedaald ten opzichte van de vorige leverancier
    quote:
      text: Paddle Board Overstock heeft niet alleen boards geleverd; ze hebben ons geholpen een complete gastervaring op te bouwen. Ons watersportprogramma ging in één seizoen van nul naar resorthoogtepunt.
      author: Algemeen resortmanager
    cta_text: Bouw je resortoplossing
    cta_href: /solutions/resorts
  - title: Hoe een Thaise strandclub groeide van 10 naar 80 borden
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Watersportclub — Thailand
    problem: Een kleine SUP-club aan het strand in Phuket moest groeien van een hobbybedrijf naar een professioneel verhuurbedrijf dat toeristen bedient, maar kon geen betrouwbare leverancier van apparatuur vinden met een consistente kwaliteit en prijs.
    solution: Beginnend met het Clubstartpakket van Paddle Board Overstock (10 boards, peddels, veiligheidsuitrusting, branding), groeide de club via het Premiumpakketprogramma gedurende 18 maanden.
    result:
      - Gegroeid van 10 naar 80 borden in 18 maanden, met consistente kwaliteit en prijzen
      - Toegevoegd SUP yoga- en fitnesslessen aan het wekelijkse schema
      - Gepersonaliseerde clubbranding verhoogde de merkbekendheid onder toeristen
      - Onderhoudskosten met 60% gedaald ten opzichte van de eerdere budgetuitrusting
      - Nu meer dan 150 verhuringen per dag in het hoogseizoen
    quote:
      text: 'Het Club Starterspakket was de perfecte instap. Naarmate ons bedrijf groeide, groeide Paddle Board Overstock met ons mee: dezelfde kwaliteit, dezelfde prijzen, geen verrassingen.'
      author: Clubeigenaar, Phuket
    cta_text: Start je clubpakket
    cta_href: /solutions/clubs
  - title: Hoe een Caribische resortketen watersporten standaardiseerde in 5 accommodaties
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Resortketen — Caribisch gebied
    problem: Een luxe resortketen met vijf accommodaties had behoefte aan consistente kwaliteit van watersportuitrusting en branding op alle locaties, met gecentraliseerde inkoop en seizoensgebonden vervangingsplanning.
    solution: Paddle Board Overstock heeft een multi-property vloot van 400 SUPs geleverd met uniforme branding, gedeelde reserveonderdelenvoorraad en een jaarlijks vervangingsschema met volumekortingen.
    result:
      - Gestandaardiseerde gastervaring in alle 5 accommodaties
      - 30% kostenbesparing door gebundelde inkoop en volumeprijzen
      - Gecentraliseerde onderdelenvoorraad verminderde stilstand met 80%
      - Het jaarlijkse verversingsprogramma voor apparatuur maakte einde-seizoensstress verleden tijd
      - Deelname van gasten aan watersport steeg met 45% op jaarbasis
    cta_text: Ontwerp je resortprogramma
    cta_href: /solutions/resorts
