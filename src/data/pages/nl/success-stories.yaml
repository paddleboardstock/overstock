hero:
  tagline: Succesverhalen
  title: Echte resultaten van<br />bouwers van waterbedrijven
  subtitle: Zie hoe clubs, resorts en ondernemers over de hele wereld winstgevende watersportactiviteiten hebben opgezet met de apparatuur en ondersteuning van Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Succesverhalen van klanten van Aquafarer
stories:
  - title: Hoe een mediterraan resort een winstgevend SUP-verhuurbedrijf opbouwde
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5-sterren strandresort — Griekenland
    problem: Het resort had eersteklas wateractiviteiten voor gasten nodig om de tevredenheidsscores te verhogen en een nieuwe inkomstenstroom te creëren, maar het ontbrak aan apparatuur, veiligheidsinfrastructuur en expertise van het personeel.
    solution: Aquafarer leverde 50 op maat gemaakte SUP-boards met resortkleuren en logo, een compleet veiligheidssysteem inclusief badmeesterstation en boeienlijnen, en een driedaags trainingsprogramma voor het personeel over het omgaan met apparatuur, instructie van gasten en veiligheidsprotocollen.
    result:
      - Meer dan 300 gastactiviteiten per week geboekt binnen de eerste maand
      - 'Tevredenheidsscore van gasten voor wateractiviteiten: 4,8/5'
      - 'Nieuwe jaarlijkse neveninkomsten: $180.000'
      - Nul veiligheidsincidenten in het eerste seizoen
      - Kosten voor vervanging van apparatuur met 40% gedaald ten opzichte van de vorige leverancier
    quote:
      text: Aquafarer heeft niet alleen boards geleverd; ze hebben ons geholpen een complete gastervaring op te bouwen. Ons watersportprogramma ging in één seizoen van nul naar resorthoogtepunt.
      author: Algemeen resortmanager
    cta_text: Bouw je resortoplossing
    cta_href: /solutions/resorts
  - title: Hoe een Australische startup in 90 dagen een watermerk opbouwde
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Startende ondernemer — Australië
    problem: Een outdoorliefhebber wilde zijn eigen SUP-merk lanceren voor de Australische markt, maar had geen productie-ervaring, geen relaties met leveranciers en een beperkt kapitaal.
    solution: Het merklanceringspakket van Aquafarer voorzag in advies over productselectie, een aangepast logo en kleurontwerp, merkverpakkingen voor de detailhandel met hang-tags, CE-certificeringsdocumentatie en FOB-verzending naar Sydney.
    result:
      - Eerste zending van 200 borden geleverd binnen 75 dagen na eerste contact
      - Merk gelanceerd op Shopify + Amazon AU binnen 2 weken na aankomst
      - Eerste voorraad binnen 45 dagen uitverkocht
      - 'Gemiddelde marge: 55% op de verkoopprijs'
      - 'Tweede bestelling: 500 eenheden geplaatst binnen 60 dagen na de lancering'
    quote:
      text: 'Ik had het merkidee, maar geen productiekennis. Aquafarer hield mij letterlijk bij de hand tijdens het hele proces: van het kiezen van het juiste boardontwerp tot het uitpakken van mijn eerste zending. 90 dagen van droom tot levering.'
      author: Oprichter, Australisch SUP-merk
    cta_text: Lanceer je merk
    cta_href: /solutions/entrepreneurs
  - title: Hoe een Thaise strandclub groeide van 10 naar 80 borden
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Watersportclub — Thailand
    problem: Een kleine SUP-club aan het strand in Phuket moest groeien van een hobbybedrijf naar een professioneel verhuurbedrijf dat toeristen bedient, maar kon geen betrouwbare leverancier van apparatuur vinden met een consistente kwaliteit en prijs.
    solution: Beginnend met het Clubstartpakket van Aquafarer (10 boards, peddels, veiligheidsuitrusting, branding), groeide de club via het Premiumpakketprogramma gedurende 18 maanden.
    result:
      - Gegroeid van 10 naar 80 borden in 18 maanden, met consistente kwaliteit en prijzen
      - Kajak- en pedaloverhuur toegevoegd bij dezelfde leverancier
      - Gepersonaliseerde clubbranding verhoogde de merkbekendheid onder toeristen
      - Onderhoudskosten met 60% gedaald ten opzichte van de eerdere budgetuitrusting
      - Nu meer dan 150 verhuringen per dag in het hoogseizoen
    quote:
      text: 'Het Club Starterspakket was de perfecte instap. Naarmate ons bedrijf groeide, groeide Aquafarer met ons mee: dezelfde kwaliteit, dezelfde prijzen, geen verrassingen.'
      author: Clubeigenaar, Phuket
    cta_text: Start je clubpakket
    cta_href: /solutions/clubs
  - title: Hoe een Caribische resortketen watersporten standaardiseerde in 5 accommodaties
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Resortketen — Caribisch gebied
    problem: Een luxe resortketen met vijf accommodaties had behoefte aan consistente kwaliteit van watersportuitrusting en branding op alle locaties, met gecentraliseerde inkoop en seizoensgebonden vervangingsplanning.
    solution: Aquafarer leverde een vloot met meerdere eigendommen van 300 SUP's en 100 kajaks met uniforme branding, gedeelde inventaris van reserveonderdelen en een jaarlijks vervangingsschema met volumeprijzen.
    result:
      - Gestandaardiseerde gastervaring in alle 5 accommodaties
      - 30% kostenbesparing door gebundelde inkoop en volumeprijzen
      - Gecentraliseerde onderdelenvoorraad verminderde stilstand met 80%
      - Het jaarlijkse verversingsprogramma voor apparatuur maakte einde-seizoensstress verleden tijd
      - Deelname van gasten aan watersport steeg met 45% op jaarbasis
    cta_text: Ontwerp je resortprogramma
    cta_href: /solutions/resorts
