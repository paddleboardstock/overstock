timeline:
  - year: '2012'
    title: Stichting Maritieme Productie
    body: Paddle Board Overstock begon als een gespecialiseerde werkplaats voor opblaasbare paddleboards in Weihai, China, toegewijd aan maritiem vakmanschap en boardproductie. De vroege focus lag op het bouwen van betrouwbare opblaasbare producten door praktische technische ervaring en productiediscipline.
  - year: '2015'
    title: Eerste exporten
    body: De eerste exportorders bereikten Japan en Korea, waarmee Paddle Board Overstock de toetreding van de club naar internationale markten werd gemarkeerd. Het bedrijf begon peddelaars en watersportliefhebbers buiten China te bedienen.
  - year: '2018'
    title: Fabrieksuitbreiding
    body: Verhuis naar een productiefaciliteit van 12.000 m². Er zijn RF-laslijnen en drop-stitch-productiecapaciteit toegevoegd, waardoor productie op grotere schaal en verbeterde kwaliteitscontrolesystemen mogelijk zijn.
  - year: '2020'
    title: R&D-centrum opgericht
    body: Een speciaal R&D-centrum geopend met een PVC stoffenlaboratorium, een hydrodynamische testtank en een CAD/FEA-simulatiestudio. De productontwikkeling werd uitgebreid om zich te concentreren op lichtgewicht constructie, verbeterde duurzaamheid en gebruikersgericht ontwerp.
  - year: '2022'
    title: Wereldwijde groei
    body: Uitgebreid tot 14 R&D-ingenieurs en 200+ arbeiders. De boards bereikten peddelaars in heel Europa, Amerika en Azië-Pacific, en verscheepten naar 50+ landen.
  - year: '2024'
    title: Innovatie- en ontwerpstudio
    body: We lanceerden een full-service ontwerp- en innovatiestudio voor nieuwe boardseries, van concept tot productie. We breidden onze kenmerkende art-series decks en tourplatforms uit.
  - year: '2026'
    title: Bouwen aan de toekomst van wateronderzoek
    body: Tegenwoordig blijft het Paddle Board Overstock ontwikkelen van opblaasbare SUP planken, peddeluitrusting en op maat gemaakte maritieme oplossingen — waardoor mensen en organisaties worden verbonden met de wateren van de wereld. 50+ landen bedienden het met een jaarlijkse capaciteit van 15.000 eenheden.
content_founding:
  tagline: Het begin
  title: Geboren aan de waterkant
  subtitle: 'Paddle Board Overstock begonnen in een kustwerkplaats in Weihai met één board en een visie: opblaasbare paddleboards bouwen die echte maritieme omstandigheden aankonden.'
  paragraphs:
    - In 2012 zagen onze oprichters een gat in de markt — de meeste opblaasbare boards waren ofwel betaalbaar maar onbetrouwbaar, of van hoge kwaliteit maar onbetaalbaar. Zij geloofden dat er ruimte was voor een fabrikant die zowel kwaliteit als waarde leverde.
    - De eerste romp werd met de hand gebouwd, getest in lokale wateren en verfijnd op basis van echte feedback van vissers en kleine commerciële exploitanten. Die feedbackloop – bouwen, testen, luisteren, verbeteren – vormt nog steeds de kern van onze technische filosofie.
    - In 2015 was het nieuws zich buiten Weihai verspreid. Peddelaars en watersportwinkels in heel Azië begonnen boards aan te vragen. Wat begon als een lokale workshop, werd een wereldwijd merk.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Vroege productiewerkplaats en productie
content_growth:
  tagline: Groei & Innovatie
  title: Van werkplaats tot 12.000 m² faciliteit
  subtitle: Voortdurende investeringen in mensen, apparatuur en processen zijn getransformeerd Paddle Board Overstock tot een moderne maritieme productiefaciliteit.
  paragraphs:
    - Naarmate de vraag groeide, groeide ook onze faciliteit. We breidden uit van een kleine werkplaats naar een fabriek van 12.000 m² met speciale SUP productielijnen voor planken, accessoires en veiligheidsuitrusting.
    - We hebben geïnvesteerd in CNC-snijmachines, hoogfrequente lasapparatuur, drop stitch productielijnen en uitgebreide testopstellingen, waardoor we elk aspect van de productiekwaliteit kunnen controleren.
    - Tegenwoordig bestaat ons team van 200-300 uit maritieme ingenieurs, materiaalkundigen, kwaliteitscontrolespecialisten en vakbekwame vakmensen — van wie velen Paddle Board Overstock al sinds het begin bij ons werken.
founder:
  tagline: Maak kennis met de oprichter
  title: Gebouwd door een Waterman
  subtitle: Oprichter David Chen brengt productie-expertise en een levenslange passie voor watersporten samen — een combinatie die bepaalt hoe Paddle Board Overstock productontwikkeling wordt benaderd.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Oprichter van Paddle Board Overstock
  story:
    - David Chen groeide op aan de kust van Weihai, waar de zee geen vakantiebestemming was maar een manier van leven. Hij bracht zijn jeugd door met peddelen, zeilen en vissen in de Gele Zee — ervaringen die hem een intuïtief begrip gaven van wat paddleboards moeten doorstaan.
    - Voor de oprichting Paddle Board Overstock bracht David tien jaar door in de maritieme productie, waar hij werkte op het gebied van productie, kwaliteit en internationale handel. Hij leidde productie- en kwaliteitsprogramma's voor Europese en Noord-Amerikaanse markten, waarbij hij de verwachtingen van wereldwijde paddelaars uit de eerste hand leerde.
    - 'In 2012 richtte hij hem Paddle Board Overstock op met een eenvoudige missie: opblaasbare paddleboards bouwen die hij aan zijn eigen gezin op het water zou toevertrouwen. Die persoonlijke standaard — zou ik dit gebruiken? — blijft de laatste test voor elk product dat de fabriek verlaat.'
    - Tegenwoordig leidt David de productstrategie en houdt hij toezicht op het R&D-team, waarbij hij persoonlijk nieuwe ontwerpen beoordeelt en prototypes test op de wateren bij Weihai. Hij gelooft dat geweldige producten voortkomen uit begrip van zowel de engineering als de ervaring.
philosophy:
  tagline: Merkfilosofie
  title: Technische vrijheid op het water
  body: Vrijheid op het water gaat niet alleen over beweging. Het staat voor het ontdekken van nieuwe plekken, het creëren van buitenervaringen, het verbinden van mensen met de natuur en het mogelijk maken van professionele missies. Engineering maakt die vrijheid mogelijk.
  pillars:
    - title: Betrouwbaarheid voorop
      body: Wateromgevingen vereisen vertrouwen.Paddle Board Overstock Producten zijn ontworpen rond stabiliteit, duurzaamheid, veiligheid en consistente prestaties.
    - title: Mensgericht ontwerp
      body: Producten moeten mensen dienen, niet technologie. Elke ontwerpbeslissing begint met begrijpen hoe mensen hun boards gebruiken, waar ze verkennen en welke uitdagingen ze tegenkomen.
    - title: Toegankelijke verkenning
      body: Water zou niet alleen aan experts moeten toebehoren.Paddle Board Overstock Maakt apparatuur die meer mensen in staat stelt rivieren, meren, oceanen en kustomgevingen veilig te ervaren.
    - title: Continue innovatie
      body: 'Innovatie betekent niet alleen het creëren van nieuwe producten. Het verbetert elk detail: materialen, structuren, productie en gebruikerservaring.'
engineeringDna:
  tagline: Engineering-DNA
  title: Hoe Paddle Board Overstock Producten Maakt
  areas:
    - title: Materiaalkunde
      body: Paddle Board Overstock richt zich op het selecteren van geschikte materialen voor verschillende mariene omgevingen. Belangrijke overwegingen zijn slijtvastheid, UV bestendigheid, drukstabiliteit en duurzaamheid op lange termijn.
      items:
        - Slijtvastheid
        - UV-bestendigheid
        - Drukstabiliteit
        - Duurzaamheid op lange termijn
    - title: Bouwtechniek
      body: Opblaasbare paddleboards vereisen een precieze balans tussen stijfheid, gewicht, draagbaarheid en stabiliteit. Paddle Board Overstock engineering richt zich op het optimaliseren van deze factoren door drop-stitch kerntechnologie en geavanceerde naadconstructie.
      items:
        - Stijfheid
        - Gewichtsoptimalisatie
        - Draagbaarheid
        - Stabiliteit
    - title: Productieprecisie
      body: 'Elk product doorloopt gecontroleerde processen: materiaalvoorbereiding, precisiesnijden, lassen en lijmen, assemblage, kwaliteitscontrole en prestatieverificatie.'
      items:
        - Materiaal voorbereiding
        - Precisie snijden
        - Lassen en lijmen
        - Assemblage & QC
    - title: Engineering van gebruikersscenario's
      body: Producten worden ontwikkeld rond echte peddeltoepassingen — recreatie, avontuur, gezin en touring — zodat elk ontwerp voldoet aan de specifieke eisen van de beoogde omgeving.
      items:
        - Recreatie
        - Avontuur
        - Gezin
        - Touring
