hero:
  tagline: Wereldwijde aanwezigheid
  title: 'Actief in 50+ landen<br />op elk continent'
  subtitle: 'Van Europese kustpatrouille-operators tot Australische watersportdistributeurs en reddingsteams in het Midden-Oosten — Aquafarer-boten varen wereldwijd op het water.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarers wereldwijde maritieme productie en distributie
stats:
  title: Wereldwijd bereik
  stats:
    - title: Landen
      amount: '50+'
    - title: Exportmarkten
      amount: Europa, Amerika's, Azië, Midden-Oosten, Oceanië
    - title: Productie
      amount: Qingdao, China
    - title: VS-magazijn
      amount: Montclair, CA
features3_markets:
  tagline: Kernmarkten
  title: 'Regionale expertise<br />voor lokale vereisten'
  subtitle: 'Wij begrijpen dat verschillende markten verschillende regelgevende vereisten, voorkeuren en gebruiksscenario''s hebben.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa en het VK
      description: 'CE-gecertificeerde producten die voldoen aan EN ISO 6185-normen. Sterke vraag naar RIB''s, opblaasbare boten en SUP-boards in EU-markten. Britse distributeurs waarderen onze snelle levering.'
      icon: tabler:map-pin
    - title: Noord-Amerika
      description: 'Productie goedgekeurd door de US Coast Guard. VS-magazijn in Montclair, CA voor snelle levering aan de Westkust. Groeiende vraag naar visboten, reddingsvaartuigen en recreatieve SUP''s.'
      icon: tabler:map-pin
    - title: Australië en Oceanië
      description: 'Sterke markt voor RIB-boten en opblaasbare tenders. Australische distributeurs waarderen onze Hypalon-boten vanwege de UV-bestendigheid onder felle zon. Snelle verzending vanuit onze Aziatische vestiging.'
      icon: tabler:map-pin
    - title: Midden-Oosten
      description: 'Groeiende vraag naar patrouille- en reddingsboten. Onze RIB''s met aluminium romp zijn populair bij kustwacht- en beveiligingsoperators. Maatwerkconfiguraties voor omgevingen met hoge temperaturen.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distributienetwerk
  title: 'Samenwerken met distributeurs<br />wereldwijd'
  subtitle: 'Wij werken met gerenommeerde distributeurs van maritieme apparatuur, OEM-merken en overheidsinkoopinstanties.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM-partnerschappen
      description: 'Private label-productie voor wereldwijde watersportmerken. Wij verzorgen alles van ontwerp tot productie tot dropshipping.'
      icon: tabler:building
    - title: Distributeurnetwerk
      description: 'Geautoriseerde distributeurs in 20+ landen houden voorraad aan en bieden lokale ondersteuning. Aanvragen van nieuwe distributeurs zijn welkom.'
      icon: tabler:users
    - title: Overheid en instellingen
      description: 'Directe levering aan kustwachten, zoek- en reddingsorganisaties en militaire inkoopprogramma''s. Conformiteit met institutionele inkoopvereisten.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Wereldwijde logistiek en ondersteuning'
  subtitle: 'Van fabriek naar bestemming — wij beheren de hele toeleveringsketen.'
  items:
    - title: Verzendopties
      description: 'Zeevracht (FOB Qingdao), luchtvracht voor dringende orders en expresskoerier voor monsters en reserveonderdelen.'
      icon: tabler:truck-delivery
    - title: VS-magazijn
      description: 'Voorraad in Montclair, CA voor snelle levering in heel Noord-Amerika. Westkust: 2-3 dagen, Midden: 3-4 dagen, Oostkust: 4-5 dagen.'
      icon: tabler:building-warehouse
    - title: Reserveonderdelen
      description: 'Echte Aquafarer-reserveonderdelen en verbruiksartikelen het hele jaar op voorraad. Veelvoorkomende onderdelen worden binnen 24 uur verzonden.'
      icon: tabler:package
    - title: Technische ondersteuning
      description: 'Directe lijn met ons engineeringteam voor technische vragen, reparatieadvies en refit-ondersteuning. Wij ondersteunen boten die we 20 jaar geleden bouwden.'
      icon: tabler:headset
cta:
  title: 'Wilt u distributeur worden?'
  subtitle: 'Wij breiden ons distributienetwerk actief uit. Neem contact op met ons exportteam om partnershipkansen te bespreken.'
  actions:
    - variant: primary
      text: Partnerschapsaanvraag
      href: /contact
    - text: Bekijk ons productassortiment
      href: /products
