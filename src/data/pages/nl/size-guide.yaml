hero:
  title: Maat- en specificatiegids
  subtitle: Afmetingen, capaciteiten en aanbevolen toepassingen voor elk Aquafarer-product.

categories:
  inflatable: Opblaasbare SUP's en kajaks ontworpen voor draagbaarheid zonder prestatieverlies. Vind de juiste maat voor jouw gewicht en peddelstijl.
  rib: Starre opblaasbare boten voor kustnavigatie, patrouilles en professionele maritieme operaties. Kies op lengte en motorvermogen.
  accessory: Accessoires en veiligheidsuitrusting om je watersportuitrusting compleet te maken. Universele maten met meerdere opties.

