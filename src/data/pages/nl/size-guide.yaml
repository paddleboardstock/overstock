how_to_choose:
  title: Hoe kies je de juiste maat
  cards:
    - title: Allround SUP Borden
      description: Onze ~11 ft allround-boards (32" breed, 6-inch drop-stitch) bieden een balans tussen stabiliteit, snelheid en capaciteit. Pas het boardvolume aan op uw gewicht — zwaardere peddelaars hebben meer volume nodig.
    - title: Breedte & Dikte
      description: Brede boards (32"+) bieden meer stabiliteit voor beginners, yoga en vissen. 6-inch dikte bij 15 PSI houdt het dek stijf onder de rijder en uitrusting.
    - title: Pakketten & Accessoires
      description: Elk board wordt als compleet pakket geleverd — board, reistas, handpomp, verstelbare peddel, verwijderbare vin, coil leash en reparatieset. Controleer het maximaal draaggewicht voor rijder plus uitrusting.
