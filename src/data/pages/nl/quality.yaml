tests:
  - title: Druk testen
    standard: Interne specificatie AF-PT-001
    description: De opblaasbare kamers worden onder druk gezet tot 1,25x de aanbevolen bedrijfslimiet en gedurende 30 minuten vastgehouden. Drukverval wordt gemeten om de luchtdichtheid en structurele integriteit van materialen en naden te valideren.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Impacttesten
    standard: Interne specificatie AF-IT-002
    description: Producten worden onderworpen aan gecontroleerde schokken van gestandaardiseerde valgewichten en slingerapparatuur. Dit beoordeelt lekweerstand, scheurvoortplanting en structurele veerkracht tegen botsingen met obstakels, dokken en puin.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: Testen van UV-bestendigheid
    standard: Intern testprotocol
    description: Materiaalmonsters worden gedurende meer dan 1000 uur blootgesteld aan UVA-340-lampen in versnelde verweringskamers. We meten kleurverandering (Delta E), glansbehoud en treksterkteverlies om UV-stabilisatorpakketten te valideren.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Slijtvastheidstesten
    standard: Intern testprotocol
    description: Materiaalmonsters worden onderworpen aan CS-10-schuurwielen onder een belasting van 500 g/1.000 g gedurende 1.000 cycli. Massaverlies en visuele slijtage bepalen de duurzaamheid van de coating tegen zand, grind en herhaaldelijk te water laten.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Prestatietesten bij lage temperaturen
    standard: Interne specificatie AF-LT-003
    description: Geassembleerde producten en materiaalmonsters worden gedurende 24 uur geconditioneerd bij -20°C, -10°C en 0°C en daarna buig getest. We verifiëren dat PVC flexibel blijft zonder te barsten of delaminatie.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Drijfvermogen en draagvermogen testen
    standard: Intern testprotocol
    description: Producten worden stapsgewijs geladen tot 1,25x de nominale capaciteit in een gecontroleerde pool. Vrijboord, stabiliteit en zelflozende prestaties worden geregistreerd. De nominale capaciteit van elk model wordt wiskundig en empirisch geverifieerd.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Wendbaarheid testen
    standard: Interne specificaties AF-MT-004
    description: Tests op het water meten de draaicirkel, acceleratie, planeertijd en peddel-/motorrespons onder een reeks belastingsomstandigheden. Rijeigenschappen uit de praktijk worden gevalideerd aan de hand van ontwerpdoelstellingen.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Waterdichtheid testen
    standard: Interne specificatie AF-WT-005
    description: Elk samengesteld product wordt bij 0,5 bar op alle naden, kleppen en fittingen gespoten. Een 5 minuten durende onderdompelingstest onder druk valideert de waterdichtheid van de kamer en de klep. Zero-lek standaard vóór verzending.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: Testprocedures
  title: Rigoureuze tests in elke fase
commitment:
  title: Onze inzet
  body: Door deze rigoureuze testprocedures biedt {SITE} klanten de zekerheid dat onze opblaasbare SUP-planken niet alleen hoog presteren, maar ook duurzaam zijn gebouwd — wat talloze plezierige en veilige avonturen op het water garandeert. Ons kwaliteitslaboratorium opereert onafhankelijk van de productie en rapporteert direct aan het management.
  cta: Vraag testdocumentatie aan
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock voert een kwaliteitscontroleprogramma uit met 8 protocollen die druk, impact, UV, slijtage, lage temperatuur, drijfvermogen, wendbaarheid en waterdichtheid omvatten. 99,3% foutloze index over de afgelopen 12 maanden verzendingen.
  points:
    - '8 testprotocollen: druk, impact, UV, slijtage, lage temperatuur, drijfvermogen, wendbaarheid en waterdichtheid'
    - 99,3% foutloos tarief over de afgelopen 12 maanden zendingen
    - Elk apparaat ondergaat een 24-48 uur durende test bij 1,25x de nominale druk met een maximale tolerantiedaling van 5%
    - UV versnelde verouderingstesten (1.000+ uur) en test op slijtvastheid van coating
testing_note: Elke test volgt gedocumenteerde interne protocollen. Testresultaten worden geregistreerd, zijn traceerbaar en worden beoordeeld door ons onafhankelijke kwaliteitslaboratorium.
