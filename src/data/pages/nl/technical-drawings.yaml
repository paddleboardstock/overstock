content_tiers:
  tagline: Niveaus downloaden
  title: Vier toegangsniveaus<br />— Het juiste detail voor de juiste fase
  subtitle: Wij leveren tekeningen op inkoopniveau, geen bestanden op productieniveau. Elke laag past bij een andere projectfase.
  items:
    - title: Niveau 1 — Openbare pdf
      description: Algemeen overzicht (GA), maattekening in 4 aanzichten en dekindeling in PDF-formaat. Gratis te downloaden. Voldoende voor projectplanning, ruimtetoewijzing en voorlopige specificatiebeoordeling.
      icon: tabler:file-type-pdf
    - title: Niveau 2 — Lichte vorm DXF/DWG
      description: 2D CAD-bestanden (DXF of DWG) voor lay-outintegratie op planningsniveau. Vereist een kort kwalificatieformulier (bedrijfsnaam, projecttype, beoogd gebruik). Geen structurele of productiegegevens inbegrepen.
      icon: tabler:file-code
    - title: Niveau 3 — Projectaanvraag STEP/IGES
      description: 3D-modelbestanden (STEP of IGES) voor systeemintegratie, uitrustingsontwerp of coördinatie van scheepsarchitectuur. Vereist projectaanvraag met reikwijdte, tijdlijn en aankoopintentie. Onder voorbehoud van goedkeuring.
      icon: tabler:cube
    - title: Niveau 4 — NDA-engineering
      description: Structurele tekeningen van de romp, lamineerschema's, uitbreidingen voor het snijden van buizen en matrijsgegevens. Alleen beschikbaar onder geheimhoudingsverklaring bij bevestigde bestellingen. Dit zijn bestanden op productieniveau, niet voor publieke distributie.
      icon: tabler:lock
content_included:
  tagline: Wat is inbegrepen
  title: Inhoud tekening<br />Per model
  subtitle: Elk model heeft een standaard tekenpakket met de essentiële planningsinformatie voor B2B-kopers en projectingenieurs.
  items:
    - title: Algemene regeling (GA)
      description: Zijprofiel, bovenaanzicht en dwarsdoorsnede met de rompvorm, buispositie, consolelocatie, zitplaatsen, brandstofsysteem en sleutelafmetingen (LOA, breedte, buisdiameter, deadrise-hoek). Revisiestatus en copyright vermeld op titelblok.
      icon: tabler:layout
    - title: Maattekening in 4 aanzichten
      description: Zij-, voor-, achter- en bovenaanzicht met algemene afmetingen voor transportplanning (hoogte op trailer, balk voor container, gewicht voor hijsen). Inclusief operationele en transportconfiguraties.
      icon: tabler:ruler-2
    - title: Dekindeling en uitrustingsplan
      description: Dekaanzicht van bovenaf met weergave van de consolebasis, stoelposities, D-ringlocaties, navigatieverlichtingsposities, toegang tot de lenspomp, batterij-/brandstofcompartiment en bevestigingspunten voor apparatuur. Beperkte precisie op eigen interfaces.
      icon: tabler:map
    - title: Transport- en verpakkingstekening
      description: Containerlaadplan, afmetingen van de wieg, gewichtsverdeling en hefpuntposities voor de logistieke planning. Inclusief standaard- en aangepaste verpakkingsopties.
      icon: tabler:truck
content_protection:
  tagline: IP-bescherming
  title: Wat we niet delen<br />en waarom
  subtitle: Door onze technische intellectuele eigendom te beschermen, kunnen we blijven investeren in R&D en tegelijkertijd alles bieden wat kopers nodig hebben voor projectplanning.
  items:
    - title: Kerngegevens rompvorm
      description: Plug-and-mal-geometrie, CNC-gereedschapspaden en lamineersjablonen zijn eigen productiemiddelen. Ze worden op geen enkele toegangsniveau gedeeld buiten bevestigde NDA-contracten.
      icon: tabler:ban
    - title: Uitbreidingen voor het snijden van buizen
      description: Snijbestanden met plat patroon voor buisweefsel zijn gegevens op productieniveau. Alleen beschikbaar onder geheimhoudingsverklaring bij bevestigde productieorders en alleen gedeeld met de contractpartij.
      icon: tabler:ban
    - title: Structurele berekeningen
      description: Gedetailleerde stressanalyses, FEA-resultaten en laminaatschema's zijn nalevingsgevoelige documenten die alleen worden gedeeld met aangemelde instanties en NDA-gebonden klanten tijdens het conformiteitsbeoordelingsproces.
      icon: tabler:ban
    - title: Concurrentiescreening
      description: We behouden ons het recht voor om CAD-toegangsverzoeken te weigeren die afkomstig lijken te zijn van concurrenten, studenten zonder projectcontext of partijen zonder legitieme inkoopintentie.
      icon: tabler:shield
