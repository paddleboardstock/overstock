faq:
  title: Technische tekeningen - Veelgestelde vragen
  questions:
    - q: Zijn de GA PDF's echt gratis te downloaden?
      a: Ja. PDF's met algemene kenmerken van onze belangrijkste modellen zijn gratis verkrijgbaar. Ze bevatten informatie op planningsniveau die voldoende is voor projectevaluatie, ruimtetoewijzing en voorlopige specificatiebeoordeling.
    - q: Hoe krijg ik toegang tot DXF/DWG-bestanden?
      a: Vul het korte kwalificatieformulier op de downloadpagina in met uw bedrijfsnaam, projecttype en beoogd gebruik. Goedgekeurde aanvragen ontvangen binnen 1 werkdag een downloadlink via e-mail.
    - q: Kan ik STEP/IGES 3D-modellen krijgen?
      a: STEP- of IGES 3D-modelbestanden zijn beschikbaar via ons projectaanvraagproces. Geef uw projectomvang, integratievereisten, tijdlijn en aankoopintentie op. Onder voorbehoud van goedkeuring — doorgaans binnen 3-5 werkdagen.
    - q: Waarom beperken jullie de toegang tot bestanden met meer details?
      a: Rompgeometrie, matrijsgegevens en structurele berekeningen vertegenwoordigen jaren van R&D-investeringen en vormen de kern van de productie-IP. We bieden alles wat nodig is voor inkoopplanning en projectintegratie en beschermen tegelijkertijd ons vermogen om te blijven investeren in de ontwikkeling van nieuwe producten.
    - q: Bevatten de tekeningen productiedetails?
      a: Nee. Openbare en lichte tekeningen bevatten informatie op inkoopniveau voor planning en specificatie. Details op productieniveau (lamineringsschema's, gereedschapspaden, snij-uitbreidingen) worden alleen onder geheimhoudingsverklaring gedeeld met bevestigde bestellingen.
    - q: Zijn er tekeningen beschikbaar voor aangepaste of semi-aangepaste RIB-configuraties?
      a: Aangepaste projecttekeningen worden voorbereid als onderdeel van het OEM/ODM-ontwikkelingsproces. Als u een op maat gemaakt RIB-project evalueert, neem dan contact met ons op met uw vereisten en wij zullen projectspecifieke GA-tekeningen verstrekken als onderdeel van het voorstel.
