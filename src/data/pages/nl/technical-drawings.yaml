content_version_control:
  tagline: Versiebeheer
  title: Tekeningversie<br />Beheer
  subtitle: Elke tekening volgt een gecontroleerd revisiesysteem. Controleer altijd of u over de huidige revisie beschikt voordat u tekeningen gebruikt voor projectplanning.
  items:
    - title: Revisietracering
      description: Elke tekening heeft een revisiecode (Rev-A, Rev-B, Rev-C), uitgiftedatum, datum van laatste beoordeling, toepasselijk model/configuratie, eenheden, bestandsgrootte en formaat. Alleen de "Huidige" revisie kan worden gedownload.
      icon: tabler:git-branch
    - title: Kennisgeving tekeningstatus
      description: Alle openbare tekeningen zijn gemarkeerd als "Alleen voorlopige lay-out - niet voor constructie-, certificerings- of productiegebruik. Afmetingen afhankelijk van definitieve specificatie en orderbevestiging." Dit beschermt beide partijen tegen verkeerde toepassing.
      icon: tabler:alert-circle
    - title: Meldingen bijwerken
      description: Wanneer een modelspecificatie verandert, wordt de tekeningrevisie bijgewerkt en worden eerdere versies gemarkeerd als 'Vervangen'. Geregistreerde gebruikers die DXF/DWG-pakketten hebben gedownload, worden via e-mail op de hoogte gebracht van belangrijke updates.
      icon: tabler:bell

