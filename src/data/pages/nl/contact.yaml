hero_text:
  tagline: Contact
  title: NEEM CONTACT OP
contact_form:
  id: form
  title: Stuur ons een bericht
  subtitle: Voor vragen over bestellingen, advies over maten of productondersteuning, stuur ons een bericht. We antwoorden binnen één werkdag.
  email_to: info@paddleboardoverstock.com
  submit_button: Stel een vraag → Vraag een offerte aan
  success_message: Bedankt! Je bericht is in onze inbox aangekomen. We zullen binnen één werkdag antwoorden.
  error_message: Er is iets misgegaan bij het versturen van je bericht. Probeer het opnieuw of mail ons direct.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: los het volgende op'
  fields:
    - name: eersteNaam
      label: Voornaam
      row: 1
    - name: achternaam
      label: Achternaam
      row: 1
    - name: bedrijfsnaam
      label: Bedrijfsnaam
      row: 2
    - name: address
      label: Adres
      row: 3
    - name: zip
      label: Postcode / ZIP-code
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: Bestelvolume
      label: Geschat bestelvolume
      row: 6
      type: select
      options:
        - value: ''
          label: Voor hoeveel boards ben je aan het shoppen?...
        - value: one
          label: Slechts één board
        - value: 2-4
          label: 2–4 boards
        - value: 5-plus
          label: 5+ boards (familie, club of verhuur)
    - name: customization
      label: Waarmee kunnen we helpen?
      row: 7
      type: select
      options:
        - value: ''
          label: Selecteer een onderwerp...
        - value: none
          label: Algemene productvraag
        - value: sizing
          label: Hulp bij het kiezen van het juiste board
        - value: order
          label: Bestelling, betaling of verzending
        - value: warranty
          label: Garantie of reparatieondersteuning
    - name: productInteresse
      label: Productcategorieën van interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Selecteer productcategorie...
        - value: all
          label: Alle producten / Volledige catalogus
        - value: sup
          label: SUP Boards / Paddleboards
        - value: packages
          label: Complete SUP pakketten
        - value: accessory
          label: Accessoires (pompen, peddels, tassen)
    - name: subject
      label: Onderwerp
      row: 9
    - name: message
      label: Bericht
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Andere manieren om ons te bereiken
  columns: 3
  items:
    - title: Hulp bij bestelling
      description: Productvragen, maatadvies en bestellingsondersteuning.
