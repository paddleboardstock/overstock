      icon: tabler:tool
    - title: Pers & partnerschappen
      description: Perskits, sponsoring en samenwerking in de industrie.
      icon: tabler:news
    - title: Telefoon
      description: +1 279 732 3333 (VS hoofdkantoor) · +86 13305324192 (fabriek)
      icon: tabler:headset
    - title: E-mail
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Global HQ & Facturering
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Onze locatie
