section_faq:
  title: Technische veelgestelde vragen
  questions:
    - q: Hoe verhoudt drop-stitch zich tot traditionele constructie met harde schaal?
      a: Moderne drop-stitch-kernen bij 20 PSI bereiken 85-90% van de stijfheid van vergelijkbare harde schalen van EPS-schuim / glasvezel, terwijl ze volledig leeglopend zijn voor transport. De wisselwerking is een iets hoger gewicht en een lagere uiteindelijke stijfheid, maar voor de meeste recreatieve en commerciële toepassingen is het verschil verwaarloosbaar.
    - q: Welke draaddichtheid wordt als premiumkwaliteit beschouwd?
      a: Premium drop-stitch-stoffen gebruiken 2 draden per vierkante inch (ongeveer 3.100 draden per m²), geweven van 1.680 DTEX-polyestergaren. Stoffen op instapniveau gebruiken 1 draad per vierkante inch met 1.100 DTEX-garen.
    - q: Kan Hypalon worden gelast zoals PVC?
      a: Nee. Hypalon/CSM kan niet RF-gelast worden. Het moet worden geassembleerd met behulp van met de hand aangebracht contactcement, waardoor de productie arbeidsintensiever wordt en de naden afhankelijk zijn van de vaardigheid van de operator. PVC kan RF-gelast of heteluchtgelast worden voor een consistente, geautomatiseerde naadkwaliteit.
    - q: Wat is de maximale veilige druk voor opblaasbare boten?
      a: Standaard opblaasbare bootbuizen werken op 8–12 PSI. Drop-stitch-vloeren werken bij 12–20 PSI. Hogedruk-drop-stitch-kernen (SUP's) kunnen werken bij 20-25 PSI. Elk product bevat overdrukventielen die zijn gekalibreerd om overmatig opblazen te voorkomen.
    - q: Hoe lang duurt het om een opblaasbare boot op maat te maken?
      a: De standaard OEM-productie duurt 30-45 dagen vanaf de orderbevestiging tot FOB Qingdao. De ontwikkeling van aangepaste matrijzen voegt 15 tot 20 dagen toe voor de productie en het testen van prototypes.
