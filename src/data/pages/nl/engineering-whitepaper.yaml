section_testing:
  title: Test- en veiligheidsprotocollen
  subtitle: Het kwaliteitsborgingskader van Aquafarer voor elke productiebatch
  protocols:
    - title: 1,25x nominale drukhoudtest
      description: Elk geassembleerd vat wordt opgeblazen tot 1,25x de nominale werkdruk en 24 tot 48 uur vastgehouden. Elke drukval van meer dan 2% leidt tot afkeuring en herbewerking.
      standard: ISO6185
    - title: Naadafpelsterktetest
      description: Las- en lijmnaadmonsters van elke productiebatch worden getest op afpelsterkte met behulp van gekalibreerde spanningsapparatuur. Minimaal 4 kN/m afpelweerstand vereist.
      standard: ISO2411
    - title: Trekproef van textiel
      description: Binnenkomende weefselrollen ondergaan treksterkte- en rektesten in zowel schering- als inslagrichting. Afkeurdrempel onder 3.000 N/5cm voor PVC.
      standard: ISO1421
    - title: UV-versnelde verwering
      description: Materiaalmonsters worden onderworpen aan meer dan 1000 uur versnelde UV-blootstelling in QUV-testkamers. Maximaal 15% treksterkteverlies toegestaan.
      standard: ASTM G154
    - title: Klep- en fittingintegriteit
      description: Elke klepconstructie wordt getest op de integriteit van de afdichting bij 1,25x de nominale druk. Lekterugkleppen worden getest op eenrichtingsafdichting.
      standard: ISO12402
