hero:
  tagline: Technisch witboek
  title: Drop-Stitch-technologie en materiaalkunde:<br />De techniek achter moderne opblaasbare waterscooters
  subtitle: Een gezaghebbende technische referentie over drop-stitch kernconstructie, vergelijking van PVC versus Hypalon-materiaal, testen van de stijfheid van hogedrukschepen en productienormen voor waterscooters.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer R&D-laboratorium - materiaaltesten en engineering
direct_answer: Drop-stitch-technologie maakt gebruik van duizenden interne polyesterdraden die de bovenste en onderste stoflagen van een opblaasbare kern met elkaar verbinden. Wanneer ze worden opgeblazen tot 15-20 PSI, fungeren deze draden als trekelementen, waardoor uitpuilen wordt voorkomen en een stijve structuur ontstaat die vergelijkbaar is met een constructie met een harde schaal. Gecombineerd met geavanceerde PVC- of Hypalon-stofcoatings en RF-lassen, maakt dit draagbare, hoogwaardige opblaasbare waterscooters mogelijk die geschikt zijn voor professioneel, commercieel en recreatief gebruik.
section_drop_stitch:
  title: Drop-Stitch-bouwtechniek
  subtitle: Hoe duizenden draden flexibele stof transformeren in een stijve structuur
  content: |-
    Drop-stitch (ook bekend als "drop-stitch-stof" of "drop-stitch core") vertegenwoordigt een doorbraak in de constructie van opblaasbare constructies. Het principe is bedrieglijk eenvoudig: duizenden individuele polyesterdraden worden tegelijkertijd geweven in twee afzonderlijke lagen basisstof, waardoor de boven- en onderpanelen in een hoek van 90 graden met elkaar worden verbonden.

    Wanneer de afgesloten kamer onder druk wordt gezet, oefent de interne luchtdruk een gelijke kracht uit in alle richtingen, waarbij wordt geprobeerd de boven- en onderpanelen uit elkaar te duwen in een cilindrische vorm. De duizenden drop-stitch-draden zijn bestand tegen deze scheiding, waardoor de belasting langs de draadas op spanning wordt gebracht. Het resultaat is een vlak, stijf paneel dat bestand is tegen een interne druk van 15–20 PSI.

    Bij 20 PSI ervaart een drop-stitch paneel van 1 m² een totale interne kracht van ongeveer 14.000 kg, maar de draadmatrix houdt het perfect vlak. Dit geeft drop-stitch-structuren een sterkte-gewichtsverhouding die kan wedijveren met traditionele stijve materialen.
