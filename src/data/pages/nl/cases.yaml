features3_cases:
  tagline: Uitgelichte gevallen
  title: Maatwerkoplossingen<br />Voor echte uitdagingen
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali Duikcentrum Dagelijkse operatie-upgrade
      customer: Blue Ocean-duikcentrum
      country: Indonesië
      industry: Commercieel duikcentrum
      challenge: Blue Ocean Diving Center op Bali exploiteerde een oudere duikboot van glasvezel met beperkte dekruimte, moeilijk aan boord gaan van duikers en veel onderhoud in tropische zoutwateromstandigheden. Het laden van de uitrusting was druk, de voorbereidingstijd was lang en het onstabiele platform zorgde voor veiligheidsproblemen voor internationale toeristen – inclusief beginnende duikers en oudere reizigers. Het centrum organiseert dagelijks 3-5 duiktrips, meer dan 200 dagen per jaar.
      solution: Aquafarer leverde een op maat gemaakte professionele duikuitrusting van 6,8 m RIB met uitgebreide dekindeling geoptimaliseerd voor opslag van duikuitrusting, brede roestvrijstalen duikladder, robuuste Hypalon buizen voor UV- en zoutwaterbestendigheid, antislip dekoppervlak en tankopslagoplossing. De configuratie is ontworpen rond de dagelijkse workflow van het duikcentrum en niet gebaseerd op een standaard indeling van een recreatieboot.
      product: 6,8 m professioneel duiken RIB
      results: Een groter werkgebied verbeterde de efficiëntie van de voorbereiding van de apparatuur. Duikers ervoeren veiliger en gemakkelijker aan boord gaan. De onderhoudsvereisten zijn aanzienlijk verminderd. Het centrum kreeg meer capaciteit om tijdens het hoogseizoen meer klanten met meer vertrouwen te kunnen bedienen. De RIB werd de basis van de dagelijkse duikoperaties.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Onze duikboot is niet alleen transport. Het is de basis van onze dagelijkse werking. Aquafarer RIB geeft ons team meer vertrouwen bij het dagelijks uitvoeren van meerdere duiktrips.
      icon: tabler:lifebuoy
    - title: Phuket Duikcentrum Professional RIB Upgrade
      customer: Ocean Explorer-duikcentrum
      country: Thailand
      industry: Commercieel duikcentrum
      challenge: Ocean Explorer Diving Center in Phuket, Thailand, moest upgraden van een traditionele duikboot van glasvezel die de groeiende vraag van klanten niet kon bijhouden. De beperkte dekruimte maakte de voorbereiding van de uitrusting inefficiënt. Moeilijk instappen zorgde voor veiligheidsproblemen voor internationale toeristen. Hoge onderhoudseisen in tropische zoutwateromstandigheden verhoogden de operationele kosten. Het centrum organiseert meerdere dagelijkse reizen, meer dan 200 dagen per jaar.
      solution: Aquafarer leverde een op maat gemaakte commerciële duikuitrusting van 6,8 meter RIB met een geoptimaliseerde indeling van het werkdek voor opslag van duikflessen, voorbereiding van uitrusting en verplaatsing van duikers. Kenmerken waren onder meer een brede duikladder met roestvrijstalen leuningen, een robuuste buisconstructie met UV-bestendige materialen, antislipvloeren, een oplossing voor tankopslag, een professionele console en passagiersstoelen - allemaal geconfigureerd voor commerciële duikoperaties.
      product: 6,8 m commercieel duiken RIB
      results: Een groter dekoppervlak maakte een snellere organisatie van de apparatuur en een efficiëntere dagelijkse workflow mogelijk. Het comfort en de veiligheid bij het instappen voor klanten zijn aanzienlijk verbeterd. De stilstandtijd voor onderhoud nam af dankzij constructie van maritieme kwaliteit. Het duikcentrum zou tijdens het hoogseizoen meer klanten kunnen bedienen en met vertrouwen de professionele duikdiensten kunnen uitbreiden.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Voor een duikcentrum is de boot niet alleen een transportmiddel. Het is een belangrijk onderdeel van onze dagelijkse werking. Aquafarer RIB geeft ons team het vertrouwen om elke dag meerdere duiktrips uit te voeren met betere veiligheid en efficiëntie.
      icon: tabler:lifebuoy
    - title: Europese duikcentrumvloot
      customer: BlueMed-duikcentra
      country: Griekenland
      industry: Duiken en maritiem toerisme
      challenge: Vereiste 12 duikgeconfigureerde RIB's voor een keten van duikcentra verspreid over meerdere Griekse eilanden. Elke boot had een aangepaste duikladder nodig, een tankopslag voor 8 tanks en een stabiel platform waar duikers in open water konden komen. De vloot moest binnen 60 dagen arriveren voor de start van het toeristenseizoen.
      solution: Geproduceerd 12 RIB 520 duikmodellen met geïntegreerde tankrekken, duikladders en extra brede Hypalon buizen voor stabiliteit bij het instappen. Elke boot was voorzien van de kleurstelling van de klantenvloot. Alle 12 boten zijn onder druk getest en binnen 55 dagen verzonden vanaf Qingdao.
      product: RIB 520 Duik
      results: Alle 12 boten werden op tijd afgeleverd voor het toeristenseizoen. De vloot is al meer dan 18 maanden dagelijks in bedrijf, zonder materiaalfouten. De klant bestelde in het tweede jaar zes extra eenheden.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: De RIB 520 Dive is de ruggengraat van onze dagelijkse duikactiviteiten. De stabiliteit in rust is uitstekend en de indeling van de tankopslag houdt het dek schoon en veilig voor onze gasten.
      icon: tabler:lifebuoy
    - title: Australische distributeur OEM Programma
      customer: Pacific Watersports Pty Ltd
      country: Australië
      industry: OEM/ODM Productie
      challenge: De Australische distributeur had een assortiment private-label SUP karton nodig tegen concurrerende prijzen om te kunnen concurreren met Chinese direct-to-consumer-merken. Vereiste 8 unieke modellen voor beginners tot en met gevorderden, met aangepaste afbeeldingen, aangepaste verpakking en directe verzending naar winkels.
      solution: Ontwikkelde 8 SUP-modellen (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) met exclusief Australisch grafisch pakket. Op maat gemaakte retailverpakking met QR-codes die linken naar installatievideo's. Dropshipping-logistiek geconfigureerd van Qingdao rechtstreeks naar Australische winkels.
      product: Aangepaste SUP-lijn (8 modellen)
      results: Van concept tot eerste verzending binnen 90 dagen. Retail-doorverkooppercentage van 85% in het eerste seizoen. Distributeur breidde partnerschap uit met opblaasbare botenlijn in jaar twee.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer leverde een complete SUP lijn in 90 dagen — van het eerste ontwerp tot de winkelvloer. De kwaliteit komt overeen met merken die tweemaal zo duur zijn.
      icon: tabler:arrows-exchange
    - title: Bevoorrading van reddingsboten in het Midden-Oosten
      customer: Nationale Civiele Beschermingsautoriteit
      country: Verenigde Arabische Emiraten
      industry: Zoeken en redden
      challenge: De burgerbeschermingsorganisatie had twintig RIB's nodig die klaar waren voor patrouilles voor kustzoek- en reddingsacties, havenbeveiliging en respons op overstromingen. Vereiste zelflozende dekken, volledige navigatiesuites (GPS, radar, marifoon), goed zichtbare oranje buizen en naleving van lokale maritieme regelgeving.
      solution: Geleverd met 20 RIB 450 Patrol-modellen met zelflozende dekken, Garmin-navigatiesuites, LED-zoeklichten, SOLAS reflecterende tape en goed zichtbare oranje Hypalon buizen. Elke boot was CE-gecertificeerd en getest volgens ISO 6185-normen. Het documentatiepakket bevatte conformiteitscertificaten voor lokale registratie.
      product: RIB 450 Patrouille
      results: Vloot ingezet over 5 kuststations. Boten hebben in extreme hitte (45°C+) gevaren zonder dat de buizen beschadigd raakten. Het bereik van de patrouilles en het brandstofverbruik overtroffen de specificaties met 12%.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: De RIB 450 Patrol overtrof onze operationele vereisten. Bij extreme hitte vertonen de Hypalon buizen na 24 maanden dagelijks gebruik geen tekenen van UV-degradatie.
      icon: tabler:alert-triangle
    - title: Europees OEM Merkpartnerschap
      customer: North Sea Marine Equipment B.V
      country: Nederland
      industry: OEM/ODM Productie
      challenge: Het gevestigde Europese maritieme merk wilde uitbreiden naar de RIB-markt zonder te investeren in productiefaciliteiten. Had een white-label partner nodig die in staat was om 5 RIB modellen (3,9 m tot 6,2 m) te produceren met private branding, CE certificering en exclusieve EU-distributierechten.
      solution: White-label productieovereenkomst opgesteld voor 5 RIB-modellen. Elk model is voorzien van klantlogo's en kleurenschema. CE certificeringsdocumentatie opgesteld voor elk model. Exclusieve EU-distributierechten verleend met minimale bestelverplichtingen. Technische documentatie en catalogus met reserveonderdelen beschikbaar voor lokaal servicenetwerk.
      product: Aangepaste RIB-lijn (5 modellen)
      results: Meerjarenovereenkomst getekend. Eerste productierun van 50 eenheden verzonden binnen 75 dagen. Merk gelanceerd op METSTRADE met positieve ontvangst door dealers.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Door met Aquafarer te werken, konden we de RIB-markt betreden zonder een fabriek te bouwen. Ze leverden een complete kant-en-klare oplossing met CE-certificering en ondersteuningsdocumentatie voor dealers.
      icon: tabler:building
    - title: Caribische resortvloot
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Maritiem toerisme en gastvrijheid
      challenge: 'Het luxe resort had een complete vloot watersportuitrusting nodig voor gastenactiviteiten: 40 SUP boards voor rondleidingen, 20 kajaks voor verkenning van de lagune, 10 opblaasbare boten voor gastentransfers en visexcursies, plus accessoires. Alle apparatuur had een aangepaste resortbranding nodig en moest vóór het hoogseizoen worden geleverd.'
      solution: 'Geproduceerd compleet watersportpakket: 40 SUP Voyager-boards (All-Around-model), 20 Explorer-kajaks, 10 AirDeck 360-opblaasboten, plus reddingsvesten, peddels, pompen en reparatiesets. Alle uitrusting bedrukt met resortlogo en tropisch kleurenschema. Verzending in containers met volledig inventarismanifest.'
      product: Volledig watersportpakket (70+ eenheden)
      results: De vloot arriveerde 6 weken vóór het hoogseizoen. De gasttevredenheidsscores voor watersportactiviteiten stegen jaar-op-jaar met 40%. Apparatuur heeft 3 seizoenen geduurd met alleen routineonderhoud.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: 'Door de complete pakketbenadering ontvingen we alles wat we nodig hadden in één zending: boards, kajaks, boten en accessoires, allemaal voorzien van een merk en klaar voor gebruik door de gasten. Onze gasten zijn dol op de kwaliteit van de apparatuur.'
      icon: tabler:beach
    - title: Queensland Commercieel Duikcentrum RIB Upgrade
      customer: Commercieel duikcentrum
      country: Australië
      industry: Commerciële duik- en maritieme diensten
      challenge: 'Een in Queensland gevestigd commercieel duikcentrum gespecialiseerd in inspectie van de maritieme infrastructuur, havenonderhoud en onderwaterreparatieprojecten exploiteerde een verouderde werkboot. Naarmate de vraag naar projecten groeide, werd het oude schip een probleem: veelvuldig onderhoud veroorzaakte planningsverstoringen, de indeling was niet ontworpen voor moderne duikoperaties (beperkte ruimte voor cilinders, gereedschap en uitrusting) en het comfort van de bemanning tijdens lange operaties was slecht. Het bedrijf had een schip nodig dat elke werkdag hun professionele activiteiten kon ondersteunen.'
      solution: Aquafarer voerde een gedetailleerde operationele analyse uit van de duikworkflow van de klant, de typische projectduur, de omvang van de bemanning en de uitrustingsvereisten. Op basis van deze analyse heeft Aquafarer een op maat gemaakte professional RIB geleverd met een functionele dekindeling die is geoptimaliseerd voor het voorbereiden van de uitrusting en het verplaatsen van de duiker, professionele zitplaatsen voor langere transportperiodes, verbeterde stabiliteit voor het veiliger in- en uitstappen van de duiker, en duikondersteuningsfuncties die in het ontwerp zijn geïntegreerd.
      product: Aangepaste professionele duiken RIB
      results: De nieuwe RIB werd een betrouwbaar dagelijks werkplatform. De voorbereiding van apparatuur werd sneller dankzij de geoptimaliseerde lay-out. De bemanning rapporteerde verbeterd comfort en veiligheid tijdens lange operaties. De professionele uitstraling van de boot versterkte het vertrouwen van de klant bij het werken met havenexploitanten en maritieme aannemers. Het duikcentrum kreeg een schip dat paste bij de professionaliteit van hun dienstverlening.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: We hadden een boot nodig die ons bedrijf elke dag kon ondersteunen, niet alleen een schip voor transport. Aquafarer werkte met ons samen om onze operationele vereisten te begrijpen en leverde een RIB oplossing die past bij onze commerciële duikworkflow.
      icon: tabler:lifebuoy
    - title: Contract voor Amerikaanse kustpatrouilles
      customer: Agentschap voor Atlantische Kustveiligheid
      country: Verenigde Staten
      industry: Maritieme veiligheid en rechtshandhaving
      challenge: De Amerikaanse kustveiligheidsdienst had zware patrouille-RIB's nodig voor onderscheppingsoperaties in open water. Benodigde tweemotorige configuratie voor redundantie, gepantserde console voor bescherming van de bemanning, elektronica volgens militaire specificaties (gecodeerde communicatie, FLIR, radar) en naleving van de voorschriften van de Amerikaanse kustwacht.
      solution: Engineered RIB 600 Patrol met dubbele 115 HP buitenboordmotorconfiguratie, gepantserde console met ballistische bescherming, FLIR thermische beeldvorming, gecodeerde VHF/UHF-communicatie en geïntegreerde wapenbevestigingspunten. Romp versterkt voor onderscheppingsmanoeuvres op hoge snelheid. Alle elektronica geïntegreerd en in de fabriek getest. USCG nalevingsdocumentatie verstrekt.
      product: RIB 600 Patrol (tweemotorig)
      results: Boten bereikten tijdens acceptatieproeven een topsnelheid van 52 knopen. Het Agentschap rapporteerde een missiegereedheidspercentage van 95% over de eerste twaalf maanden. Extra bestelling geplaatst voor 8 stuks.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: De tweemotorige RIB 600 geeft onze bemanningen de snelheid en redundantie die nodig zijn voor onderscheppingsoperaties in open water. De gepantserde console biedt kritische bescherming zonder dat dit ten koste gaat van de prestaties.
      icon: tabler:shield
