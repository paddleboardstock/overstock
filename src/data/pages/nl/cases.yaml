hero:
  tagline: Casestudies
  title: Echte Peddelaars, Echte Verhalen<br />— Paddle Board Overstock in actie
  subtitle: Zie hoe peddelaars, gezinnen en avonturiers over de hele wereld het water op gaan met Paddle Board Overstock opblaasbare SUP planken.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock Klantverhalen — opblaasbare SUP borden in actie
features3_cases:
  tagline: Uitgelichte verhalen
  title: Echte borden<br />Voor Echte Avonturen
  isBeforeContent: false
  columns: 3
  items:
    - title: Van de bank naar staan bij de eerste poging
      customer: Eerste keer peddelaar
      country: Duitsland
      industry: Beginnersrecreatie
      challenge: Anna had nog nooit gepeddeld en was nerveus over balans, koud water en er dom uitzien voor anderen. Omdat ze in een klein appartement in München woonde, had ze ook geen plek om een harde plank op te bergen en geen dakrek om mee te nemen.
      solution: De SUP Explorer 11 biedt een breed, stabiel platform dat wiebelige eerste slagen vergeeft. Het complete pakket — board, verstelbare peddel, pomp, riem en tas — betekende dat ze alles te voet naar het meer kon dragen. Van doos naar water in minder dan 20 minuten, zonder ervaring.
      product: SUP-verkenner 11
      results: Anna stond bij haar allereerste poging op en peddelde een uur zonder te vallen. Twee maanden later peddelt ze drie keer per week en is ze lid geworden van een lokale meet-up groep. Het board wordt in een rugzak gestopt die in haar gangkast past.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Ik verwachtte mijn eerste dag naast het board te zwemmen. In plaats daarvan gleed ik binnen enkele minuten over het meer — ik kon niet geloven hoe stabiel het voelde.
      icon: tabler:school
    - title: Eén board, twee kinderen, geen klachten
      customer: Familie van vier
      country: Italië
      industry: Gezinsrecreatie
      challenge: Marco en Giulia wilden een zomeractiviteit waar hun twee kinderen hun schermen daadwerkelijk voor zouden verlaten. Eerdere goedkope opblaasbare exemplaren kromden, lekken bij de naden en liepen leeg midden in het peddelen — de kinderen verloren het zelfvertrouwen na één slechte zwemtocht.
      solution: De Tropical Breeze Series biedt een volledig eilandvakantie-canvas — zonneschijn, kokosboomgaarden en strandscènes — waardoor de kinderen zin kregen om het water op te gaan. De drop-stitch kern loopt stijf op 15 graden PSI en elk board wordt 24-48 uur in de fabriek onder druk getest tot 1,25 keer de nominale drukdruk, voordat het wordt verzonden.
      product: Tropical Breeze-serie
      results: Het gezin peddelt nu elk weekend van juni tot september. Na een heel seizoen met kinderverkeer vertoont het board geen naadspanning of vervaging. Hun dochter is begonnen met het vragen om haar eigen board voor haar verjaardag.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: De kinderen vechten om wie er aan de beurt is om te peddelen. Na de goedkope boards die we eerder probeerden, voelt deze alsof hij precies gebouwd is om te overleven in ons gezin.
      icon: tabler:users
    - title: Een drijvende yogastudio bij zonsopgang
      customer: Yogabeoefenaar
      country: Indonesië
      industry: SUP Yoga & Meditatie
      challenge: Putu geeft yoga op Bali en wilde haar praktijk meenemen naar het water, maar haar eerste pogingen op een geleend board voelden glad en onstabiel. Een houding aannemen terwijl je op open water drijft vereist grip, stabiliteit en een rustgevend ontwerp.
      solution: De Flowing Lotus Series combineert lotus-, koi- en libellekunst met een lasergegraveerde tractiepad die handen en voeten in de neerwaartse hond verankert. De brede allround omtrek en de dikte van 15 cm creëren een stabiel zwevend platform voor flows en zittende meditatie.
      product: Flowing Lotus Serie
      results: Putu geeft nu SUP twee keer per week kleine zonsopgang-yogalessen. Haar leerlingen boeken weken van tevoren uit, en het bord is het handelsmerk van haar lessen geworden — het kunstwerk doet de helft van haar marketing.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Oefenen op het water verandert alles. Het bord is stabiel genoeg voor de kraaienhouding, en het lotusontwerp zorgt ervoor dat elke klasse als een ritueel aanvoelt.
      icon: tabler:heart
    - title: Inhoud die nooit vervaagt — letterlijk
      customer: Reiscontentmaker
      country: Portugal
      industry: Sociale Media & Contentcreatie
      challenge: Miguel filmt paddle-content voor zijn werk. Geprinte borden die hij eerder gebruikte, verloren hun kleur binnen een seizoen van zout water en zon — zijn beelden begonnen er moe uit te zien, en volgers merkten de afbladderende dekplaten op.
      solution: De Cheetah Surge Edition bouwt zijn cheeta-motief op met gestanste, meerkleurige EVA blokplakken in plaats van oppervlakteinkt. De kleuren maken deel uit van het schuim zelf, dus zoutwater, UV, en voetgangers kunnen het ontwerp niet vervagen, afbladderen of krassen.
      product: Cheetah Surge Editie
      results: Een heel jaar aan kustopnames later ziet het board er gloednieuw uit op camera. Zijn sunrise clips van de Algarve werden zijn best presterende content ooit, en het board zelf verschijnt in tientallen merksamenwerkingen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Mijn oude boards zijn sneller oud geworden dan mijn content. De Cheetah ziet er identiek uit aan dag één na een jaar in de oceaan — mijn volgers blijven vragen welk filter ik gebruik. Het is geen filter. Het is het bord.
      icon: tabler:camera
    - title: Weekend Kustexpedities
      customer: Kusttoerpaddler
      country: Australië
      industry: Touren & Verkenning
      challenge: Tom wilde de rustige baaien en kaapjes van de Gold Coast verkennen tijdens urenlange tochten, maar lichte budgetboards gaven mee in de schok en lieten hem na een uur uitgeput achter. Hij had stijfheid nodig die hij solo kon dragen naar afgeleë inzetpunten.
      solution: De Ocean Voyager-serie combineert een zeeschildpadtekening in diep teal en koraal met een stijve drop-stitch kern die zijn vorm behoudt ondanks lichte kustschok. Met ongeveer 9 kilo in zijn rugzak kan Tom het naar stranden brengen waar geen auto bij kan, het opblazen met de meegeleverde pomp en urenlang rondreizen.
      product: Ocean Voyager Serie
      results: Tom heeft nu elf kustroutes in kaart gebracht, waaronder een ochtendoversteek die hij ooit buiten zijn vaardigheden vond. Het bord blijft stijf van lancering tot lunch, en het zeeschildpaddenontwerp is zijn herkenbare handelsmerk op het water geworden.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Rigide planken voelen als hardboards, en deze draagt als een rugzak. Het opende een hele kustlijn die ik nooit met een auto en een aanhanger kon bereiken.
      icon: tabler:compass
    - title: Volledige lichaamsfitness, geen sportschoolkosten
      customer: Fitness Peddelaar
      country: Canada
      industry: Fitness & Training
      challenge: Priya wilde een low-impact fullbody workout die niet als een training voelde. Hardlopen deed haar knieën pijn en de sportschool voelde repetitief — ze stopte met elke routine binnen zes weken.
      solution: 'De Dolphin Wave Series maakte van beweging een spel: peddelen verbrandt calorieën, bouwt core- en schouderkracht op en daagt het evenwicht uit, terwijl je langs het Vancouverse landschap glijdt. Het stabiele 32-inch dek vergeeft onhandige slagen terwijl het toch constante microbalans vereist — een sportschool vermomd als een paddleboard.'
      product: Dolfijn Golf Serie
      results: Priya peddelt vijf ochtenden per week voor haar werk en heeft die routine al 14 maanden volgehouden — haar persoonlijke record voor elk trainingsschema ooit. Vrienden doen nu mee aan haar wekelijkse peddelclub, en haar knieën zijn nog nooit zo gelukkig geweest.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Ik heb mezelf nog nooit hoeven dwingen om te gaan peddelen. De training is echt — ik ben er gewoon mee gestopt omdat ik te druk ben met genieten van het water.
      icon: tabler:trophy
    - title: Een labrador van 30 kilo en één zeer stabiel dek
      customer: Peddelaar met een hond
      country: Verenigde Staten
      industry: Peddelen met huisdieren
      challenge: Jake wilde zijn Labrador, Biscuit, het water op brengen, maar zijn oude smalle plank veranderde meteen in een onderzeeër zodra de hond aan boord sprong. Klauwen verscheurden ook het goedkope dekplatform binnen enkele weken.
      solution: De Leviathan Wake Series biedt een breed, hoog volume platform dat peddelaars plus passagiers van 30 kilo vervoert zonder te zwelgen. Het EVA tractiedek overleeft klauwen die zijn vorige board vernietigden, en het blauwe walvis-totem geeft Biscuit een duidelijk zichtbare "plek" om op te zitten.
      product: Leviathan Wake-serie
      results: Biscuit springt nu op commando aan boord en rijdt als een boegbeeld op de boeg. Na twee zomers vertoont het dek geen klauwschade en zijn hun rivierpeddels de populairste content op Jake's feed.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: Ik kocht een plank en kreeg een eerste stuurman. Het dek schudde alles van zich af wat een grote natte hond erop kon gooien — letterlijk.
      icon: tabler:dog
    - title: Studentenbudget, Volledige Prijs Kwaliteit
      customer: Universiteitsstudent
      country: Polen
      industry: Studentenlevensstijl
      challenge: Kasia is een student in Gdansk met een studentenbudget en een zomerse routine bij het meer. Elke goedkope plank die ze vond was ofwel zwak, lelijk, of allebei — en kwalitatieve borden kostten meer dan haar maandelijkse voedselbudget.
      solution: De Medusa Glow Series combineert premium bouw — drop-stitch kern, 15 PSI rigiditeit, kwallenkunst in mintgroen samengesteld uit gestanste EVA blokken — met Paddle Board Overstock fabrieksrechtelijke uitverkoopprijzen die elke tussenpersoon overslaan.
      product: Medusa Glow-serie
      results: Kasia betaalde minder dan de helft van wat vergelijkbare premium boards lokaal verkopen. Haar board overleefde een volledig seizoen met dagelijkse meersessies en een week op het strand in de Baltische Zee, en drie klasgenoten bestelden er zelf een na het proberen van haar.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Ik verwachtte compromissen met het studentenbudget. In plaats daarvan kreeg ik een board dat mijn vrienden dachten dat het drie keer zoveel kostte — en het duurde langer dan twee van die van hen.
      icon: tabler:backpack
    - title: Loswerpen vanaf een stabiel platform
      customer: Weekend Hengelaar
      country: Verenigde Staten
      industry: Informeel SUP vissen
      challenge: Devon vist in rustige achterwateren die te ondiep zijn voor een motorvaartuig om te bereiken. Hij had een peddelvaartuig nodig dat stabiel genoeg was om staand van te werpen, stevig genoeg voor haken en uitrusting, en licht genoeg om bij zonsopgang een pad af te nemen.
      solution: De Jungle Mandala Series biedt hem een brede, stijve staande platform om te werpen, met een hibiscus- en kolibriedeck in Tiffany Blue dat koel blijft in de ochtendzon. Het board is op rugzakformaat voor het trail, blaast binnen enkele minuten op aan de waterkant, en de versterkte PVC huid schudt haken en vinslagen los.
      product: Jungle Mandala-serie
      results: Devon bereikt nu drie paaibaaien waar niemand anders in kan vissen. Zijn vangstsnelheid is dit seizoen verdubbeld, en het plankje — haken, stringer en alles — lijkt nog steeds klaar voor een nieuwe zomer.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Staan op een SUP vis veranderde mijn visstijl compleet. Dit board is stabiel genoeg om te werpen, de haak te zetten en een vis te landen — allemaal zonder nat te worden.
      icon: tabler:fish
