content_founding:
  tagline: Het begin
  title: 'Geboren aan het waterfront'
  subtitle: 'Aquafarer begon in een kustwerkplaats in Qingdao met één boot en een visie: opblaasbare vaartuigen bouwen die echte zeilcondities aankunnen.'
  paragraphs:
    - 'In 2012 zagen onze oprichters een gat in de markt — de meeste opblaasboten waren betaalbaar maar onbetrouwbaar, of van hoge kwaliteit maar onbetaalbaar duur. Ze geloofden dat er ruimte was voor een fabrikant die zowel kwaliteit als waarde leverde.'
    - 'De eerste romp werd met de hand gebouwd, getest in lokale wateren en verfijnd op basis van echte feedback van vissers en kleine commerciële exploitanten. Die feedbacklus — bouwen, testen, luisteren, verbeteren — staat nog steeds centraal in onze technische filosofie.'
    - 'In 2015 had het nieuws zich buiten Qingdao verspreid. Internationale distributeurs begonnen monsters aan te vragen. Wat begon als een lokale werkplaats werd een wereldwijde leverancier.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarers vroege productiewerkplaats en productie
content_growth:
  tagline: Groei & innovatie
  title: 'Van werkplaats naar een faciliteit van 12.000 m²'
  subtitle: 'Continue investering in mensen, apparatuur en processen heeft Aquafarer getransformeerd tot een moderne marineproductiefaciliteit.'
  paragraphs:
    - 'Naarmate de vraag groeide, groeide ook onze faciliteit. We breidden uit van een kleine werkplaats naar een fabriek van 12.000 m² met dedicated productielijnen voor RIB-boten, opblaasboten, SUP-boards en accessoires.'
    - 'We investeerden in CNC-snijmachines, high-frequentie lasapparatuur, drop stitch-productielijnen en uitgebreide testopstellingen — waarmee we elk aspect van de productiekwaliteit kunnen beheersen.'
    - 'Vandaag bestaat ons team van 200-300 mensen uit marine-ingenieurs, materiaalwetenschappers, kwaliteitscontrolespecialisten en vakbekwame ambachtslieden — velen van hen zijn vanaf de eerste dagen bij Aquafarer.'
content_mission:
  tagline: Onze missie
  title: 'Vrijheid Op Het Water, Gerealiseerd'
  subtitle: 'Elk Aquafarer-product is ontworpen om mensen te helpen verkennen, werken en gedijen op het water — betrouwbaar, veilig en betaalbaar.'
  list:
    - 'Vaartuigen ontwerpen die presteren in echte zeilcondities — niet alleen op papier'
    - 'Blijvende partnerschappen opbouwen met distributeurs en merken via betrouwbare OEM/ODM-service'
    - 'Onze productieprocessen continu verbeteren om betere waarde te leveren'
    - 'Elk product ondersteunen met originele onderdelen en technische expertise'
cta:
