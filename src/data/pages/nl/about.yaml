hero:
  tagline: Over ons
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddleboard Overstock fabriek en werkplaats
  title: Over <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: Gloednieuwe OPBLAASBARE SUP-boards tegen overstock- en opruimingsprijzen — ondersteund door onze eigen Weihai-productie sinds 2012, groothandel in gemengde modellen voor kleine retailers en flexibele wereldwijde verzending.
stats:
  title: De cijfers op een rij
  columns: 4
  stats:
    - title: Jaarlijkse productiecapaciteit
      amount: 15.000 eenheden
    - title: Landen verzonden
      amount: 50+
    - title: Drukgeteste platen
      amount: 100%
    - title: R&D-ingenieurs
      amount: 14+
features3_what_we_build:
  title: Wat we bouwen
  subtitle: Een gerichte productlijn die we van binnen en van buiten kennen — geen half afgewerkte experimenten, geen badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Opblaasbare SUP-planken
      description: Allround en touring SUP's van 10' tot 12 ft. Stabiel, stijf en compleet met pomp, peddel en riem.
      icon: tabler:swimming
    - title: Kunstserie decks
      description: Kenmerkende EVA-DEKKUNSTWERKEN — Cheetah Surge, Tropical Breeze, Medusa Glow en meer.
      icon: tabler:hexagons
    - title: Complete pakketten
      description: 'Elk board wordt geleverd als een volledige kit: board, rugzak, pomp, peddel, vin, leiband en reparatieset.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessoires
      description: Pompen, peddels, riemen, reparatiesets en droogzakken. Allemaal afgestemd op onze borden.
      icon: tabler:tool
    - title: Verzorging & reparatie
      description: Interne reparatieondersteuning, reserveonderdelen en onderhoudsrichtlijnen om uw board jarenlang op het water te houden.
      icon: tabler:settings
    - title: Club- en verhuurvloten
      description: Bulkuitrusting voor clubs, scholen en verhuurvloten met directe fabrieksondersteuning.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Bestuursontwerp en technische bespreking
steps2_values:
  title: Onze waarden
  subtitle: Drie principes die elk product vanaf de eerste dag hebben gevormd.
  items:
    - title: Bouw alsof het je gezin draagt
      description: Elke plank, naad en klep wordt behandeld alsof onze eigen families het zullen gebruiken.
      icon: tabler:heart
    - title: Engineer voordat we verkopen
      description: Als een specificatie verkeerd is, veranderen we de specificatie — nooit de klant.
      icon: tabler:settings
    - title: Ondersteuning die langer meegaat dan de garantie
      description: Borden die we jaren geleden hebben gebouwd, bellen ons nog steeds voor reserveonderdelen en we nemen nog steeds op.
      icon: tabler:headset
steps2_milestones:
  title: Mijlpalen;
  subtitle: Een korte versie van het Paddle Board Overstock verhaal.
  isReversed: true
  items:
    - title: Opgericht in Weihai
      description: Een workshop aan de kust gewijd aan drop-stitch OPBLAASBARE SUP-planken.
      icon: tabler:building-factory
    - title: 12.000 m² productiecampus
      description: Uitgebreid naar een speciale faciliteit met RF-lassen en drop-stitch productiecapaciteit.
      icon: tabler:circle-check
    - title: Internationaal exportprogramma
      description: Nu verzonden naar meer dan50 landen met expres- en zeevrachtopties.
      icon: tabler:world
    - title: Overstock & groothandelsfocus
      description: In september 2026 verhuisden de merkactiviteiten van de Qingdao Vatrad Group naar Weihai Dongjilian Co., Ltd.; de productiehub van Weihai zet R&D, productie en fabrieksgerichte verzending voort.
      icon: tabler:building-skyscraper
features2_locations:
  title: Onze vestigingen
  tagline: 'Vind ons '
  columns: 3
  items:
    - title: Hoofdkantoor & werkplaats
      description: Industrieel kustpark, gebouw 4 — open van ma t/m vr voor bezoeken op afspraak.
    - title: Dienstencentrum voor Bejaarden
      description: Mediterrane haven — refit, reparatie en garantieondersteuning voor Europese klanten.
    - title: partner netwerk
      description: Geautoriseerde servicepartners in Australië, Japan, Singapore en Hong Kong.
brand_hub_tagline: Merk plaat
brand_hub_title: Ontdek ons merk
brand_hub_subtitle: Duik dieper in onze expertise op het gebied van scheepsbouwkunde, wereldwijde aanwezigheid en de principes die ons drijven.
brand_hub_cards:
  - title: Mariene expertise
    desc: Tientallen jaren van materiaalwetenschap, precisieproductie en testen in de echte wereld — van druppelsteekkernen tot gelaste naden en decks uit de kunstserie.
    link: /brand-marine-expertise
    link_label: Meer weten.
  - title: Waarom Paddle Board Overstock
    desc: Directe prijzen in de fabriek, 100% drukgeteste boards en 2 jaar garantie — gebouwd voor peddelaars, gezinnen en watersportliefhebbers.
    link: /brand-why-paddleboardoverstock
    link_label: Meer weten.
