hero:
  tagline: Over het bedrijf
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock werkplaats
  title: |
    Scheepsbouwkunde <br />
    in <span class="text-accent dark:text-white">Paddle Board Overstock</span>-stijl
  subtitle: 'We begonnen in een kustwerkplaats met één boot en een onwrikbaar geloof: maritieme producten moeten ontworpen zijn alsof er levens van afhangen — want dat is zo. Vandaag leveren we aan 40+ landen, maar elke romp gaat nog steeds door dezelfde handen die het bedrijf hebben opgericht.'

stats:
  title: In cijfers
  columns: 4
  stats:
    - title: Geleverde rompen
      amount: '2,400+'
    - title: Leveringslanden
      amount: '50+'
    - title: Totale ervaring (jaren)
      amount: '60'
    - title: Gemiddelde reactietijd (uur)
      amount: '24'

features3_what_we_build:
  title: Wat we bouwen
  subtitle: Een gefocuste productlijn die we door en door kennen — geen half werk of badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB-boten
      description: Aluminium romp RIB's van 3,3 m tot 7,5 m. Ontworpen voor patrouille, duiken, vissen en gezinsgebruik.
      icon: tabler:ship
    - title: Opblaasbare boten
      description: PVC- en Hypalon opblaasbare boten van 2,4 m tot 4,2 m. Licht, duurzaam en gemakkelijk op te bergen.
      icon: tabler:speedboat
    - title: Superjacht tender
      description: Compacte RIB's met hoge specificaties, op maat gemaakt voor het moederschip.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessoires
      description: Vesten, pompen, hoezen, waterdichte tassen, brandstoftanks en elektronica. Allemaal compatibel met onze boten.
      icon: tabler:package
    - title: Aanpassingen en reparaties
      description: Reparatie van luchtkamers, elektronica-upgrades en motorvervangingen.
      icon: tabler:tool
    - title: Producten op maat
      description: Ontwerpen voor commerciële, wetenschappelijke en militaire klanten.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Boot op maat

steps2_values:
  title: Onze waarden
  subtitle: Drie principes die elk product vanaf dag één vormgeven.
  items:
    - title: Bouw alsof je eigen gezin in de boot zit
      description: Elke romp, elke las en elk onderdeel wordt behandeld alsof het door onze eigen families gebruikt gaat worden.
      icon: tabler:heart
    - title: Techniek vóór verkoop
      description: Als de specificatie fout is, passen we de specificatie aan — nooit de klant.
      icon: tabler:settings
    - title: Ondersteuning na de garantie
      description: Twintig jaar oude rompen bellen nog steeds voor onderdelen — en we nemen nog steeds op.
      icon: tabler:headset

steps2_milestones:
  title: Mijlpalen
  subtitle: Een korte versie van de geschiedenis van Paddle Board Overstock.
  isReversed: true
  items:
    - title: Opgericht in een kustwerkplaats
      description: Twee scheepsbouwkundigen met één CNC-frees en een onwrikbaar idee.
      icon: tabler:building-factory
    - title: Eerste 1.000 geleverde rompen
      description: Bereikt in het zevende jaar, vooral dankzij mond-tot-mondreclame en vaste klanten.
      icon: tabler:circle-check
    - title: Internationaal exportprogramma
      description: Leveringen aan 40+ landen met lokale servicepartners op vijf continenten.
      icon: tabler:world

features2_locations:
  title: Onze locaties
  tagline: Waar ons te vinden
  columns: 3
  items:
    - title: Hoofdkantoor en werkplaats
      description: Kustindustriepark, gebouw 4 — open ma-vr voor bezoek op afspraak.
    - title: EU-servicecentrum
      description: Middellandse Zeehaven — aanpassingen, reparaties en garantieservice voor Europese klanten.
    - title: APAC-partnernetwerk
      description: Geautoriseerde servicepartners in Australië, Japan, Singapore en Hongkong.
brand_hub_tagline: Merk
brand_hub_title: Ontdek ons merk
brand_hub_subtitle: Duik dieper in onze maritieme technische expertise, wereldwijde aanwezigheid en de principes die ons drijven.
brand_hub_cards:
  - title: Maritieme Expertise
    desc: 'Decennia van materiaalwetenschap, precisieproductie en praktijktests — van PVC/Hypalon-fabricage tot deep-V-rompontwerp en drop-stitch-technologie.'
    link: /brand-marine-expertise
    link_label: 'Meer informatie →'
  - title: Wereldwijde Aanwezigheid
    desc: 'Verzending naar meer dan 50 landen vanuit onze Qingdao-faciliteit met geautoriseerde servicepartners in Europa, Azië-Pacific en Amerika.'
    link: /brand-global-presence
    link_label: 'Meer informatie →'
  - title: Waarom Paddle Board Overstock
    desc: 'Verticale integratie, dubbele certificering (ISO 9001 + BSCI), CE-naleving en lage MOQs — gebouwd voor merken, distributeurs en overheidsinstellingen.'
    link: /brand-why-paddleboardoverstock
    link_label: 'Meer informatie →'

production_section:
  tagline: 'Productie-excellentie'
  title: 'Verfijnd vakmanschap gewaarborgd'
  description: 'De Paddle Board Overstock-productielijn is toegewijd aan het produceren van hoogwaardige, duurzame en krachtige opblaasbare producten.'
  cards:
    - title: 'Ervaren team van technici'
      items:
        - 'Professionele kennis van PVC, Hypalon en maritieme materialen'
        - 'Precies vakmanschap bij snijden, verlijmen en accessoiremontage'
        - 'Continue training om de nieuwste productietechnologieën te beheersen'
    - title: 'Geavanceerde productieapparatuur'
      items:
        - 'CNC-snijmachines voor nauwkeurig stofsnijden met minimale foutmarge'
        - 'Hoogprecieze warme/koude verlijming voor luchtdichte, duurzame naden'
        - 'Professionele apparatuur voor luchtdichtheids- en trekkertests'
    - title: 'Volwassen managementsysteem'
      items:
        - 'Gestandaardiseerde productieprocessen met heldere kwaliteitsnormen'
        - 'Lean productiefilosofie die afval vermindert en efficiëntie verbetert'
        - 'Efficiënt supplychainbeheer met betrouwbare leverancierspartnerschappen'
    - title: 'Strikte kwaliteitscontrole'
      items:
        - 'Gecertificeerd kwaliteitsmanagementsysteem'
        - 'Meerfaseninspectie: grondstof, tijdens productie, eindcontrole'
        - 'Strikte luchtdichtheids- en duurzaamheidstests voor verzending'

global_ops_section:
  tagline: 'Globale operationele architectuur'
  title_html: 'Één merk, <span class="text-white/90">twee centra</span>'
  description_html: 'Sinds september 2026 wordt Paddle Board Overstock gerund door <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (New Mexico, VS) — de wereldwijde entiteit voor distributie, commerciële B2B-verkoop, contracten, facturering en after-sales. R&D, productie en kwaliteitscontrole blijven bij de <strong class="text-white">Paddle Board Overstock-productielocatie in Qingdao</strong>, die elke bestelling fabrieksdirect verzendt, FOB Qingdao. De overgang veranderde wie uw contract ondertekent — niet wie uw boot bouwt.'
  stats:
    - value: '2,400+'
      label: 'Wereldwijd geleverde rompen'
    - value: '50+'
      label: 'Exportlanden'
    - value: '10+'
      label: 'Jaren fabricage'
