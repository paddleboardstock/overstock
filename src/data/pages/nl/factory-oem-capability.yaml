hero:
  tagline: OEM/ODM-productie
  title: OEM- en private label-productie
  subtitle: Van concept tot container — pas elk detail van uw lijn opblaasbare vaartuigen aan

intro: Aquafarer biedt complete OEM- en ODM-diensten voor merken, distributeurs en overheidsinstanties wereldwijd. Met 10+ jaar exportervaring en een fabriek van 12.000 m² met ISO 9001- en BSCI-certificering verzorgen wij alles van productontwerp en matrijsontwikkeling tot grootschalige productie, verpakking en logistiek.

