why_us:
  - title: Verticale integratie
    description: Wij bezitten onze fabriek, matrijzen en toeleveringsketen — geen tussenpersonen, geen onderaannemers. Dit geeft ons controle over kwaliteit, kosten en levering.
  - title: Dubbele certificering
    description: ISO 9001-kwaliteitsmanagement en BSCI-sociale compliance-certificering. Fabrieksauditrappen beschikbaar op verzoek.
  - title: CE-naleving
    description: Alle standaardmodellen dragen CE 2013/53/EU-certificering. Custom modellen kunnen via ons gevestigde proces CE-gecertificeerd worden.
  - title: Laag MOQ
    description: Begin met slechts 5 eenheden voor standaardmodellen. Wij helpen opkomende merken lanceren zonder te veel voorraad aan te houden.
