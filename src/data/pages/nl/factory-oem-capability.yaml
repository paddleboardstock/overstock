services:
  - title: Productontwerp en engineering
    description: Ons interne R&D-team werkt met uw concept of specificatie om CAD-tekeningen, 3D-modellen en prototypes te ontwikkelen. Wij bieden matrijsontwerp, optimalisatie van rompvormen en begeleiding bij materiaalkeuze.
  - title: Custom branding en graphics
    description: Full-color digitaal drukwerk, zeefdruk, embossing en labelopties. Wij ontwikkelen merkspecifieke dekgraphics, tube-branding en verpakking die klaar is voor de detailhandel.
  - title: Aanpassing van materialen en specificaties
    description: Kies uit PVC (standaard, milieuvriendelijk, vlamvertragend), Hypalon/CSM, drop-stitch en hybride constructies. Custom tubekleuren, doekgewichten en versterkingsopties.
  - title: Verpakking en logistiek
    description: Custom detailverpakking, private label-dozen, vacuümpakken, palletiseren en containerladen. Leveringsvoorwaarden FOB Qingdao, CIF of DDP beschikbaar.

