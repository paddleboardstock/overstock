features3_lab:
  title: Intern test- en kwaliteitslab
  subtitle: Elke materiaalbatch en elk eindproduct gaat door ons testlaboratorium ter plaatse voordat het wordt verzonden.
  columns: 3
  isBeforeContent: true
  items:
    - title: Treksterkte testen
      description: 'Elke PVC stofrol wordt getest volgens de ASTM D751-normen. Minimumvereiste: 350 N/cm schering en inslag. Afgekeurde partijen worden teruggestuurd naar de leverancier; ongeveer 3% van de binnenkomende materialen keuren wij af.'
      icon: tabler:scale
    - title: UV-versnelde veroudering
      description: Stofmonsters ondergaan een QUV-versnelde verwering van 1000 uur (ASTM G154). Het behoud van de treksterkte moet groter zijn dan 80% na blootstelling aan UV. Producten geschikt voor meer dan 3 jaar gebruik buitenshuis.
      icon: tabler:sun
    - title: Schilfestheid van naden
      description: RF-gelaste naden getest bij een minimale pelsterkte van 5 N/mm (ASTM D751). Met de hand gelijmde Hypalon naden getest op 3,5 N/mm. Elke productiebatch beschikt over naadmonsters die destructief zijn getest en gearchiveerd.
      icon: tabler:stack
    - title: 24–48 uur drukbehoud
      description: 'Elk opblaasbaar product wordt opgeblazen tot 1,25x de nominale PSI en wordt gedurende 24-48 uur gecontroleerd. Maximaal toelaatbare drukval: 5%. Producten die niet aan deze test voldoen, worden vóór verzending herwerkt en opnieuw getest.'
      icon: tabler:wind
    - title: Ventielcyclus testen
      description: Elk klepontwerp ondergaat 10.000 open-dicht-cycli in ons laboratorium. Kleppen moeten na het wisselen een luchtdichte afdichting behouden bij 1,25x de nominale druk. Alle Paddle Board Overstock kleppen zijn geschikt voor meer dan 5 jaar regelmatig gebruik.
      icon: tabler:rotate
    - title: Bestand tegen koude scheuren
      description: Materialen getest bij -30°C gedurende 4 uur volgens ISO 4646. Geen barsten of verbrossing toegestaan. Producten geschikt voor winterstalling en gebruik in koud water tot een omgevingstemperatuur van -10°C.
      icon: tabler:snowflake

