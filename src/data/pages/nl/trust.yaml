hero:
  tagline: Gebouwd volgens normen die ertoe doen
  title: Vertrouwen in Paddle Board Overstock
  subtitle: |-
    In de fabriek geteste platen — gebouwd voor veiligheid,
    duurzaamheid en prestaties. Geen snelkoppelingen. Geen uitzonderingen.
  taglineSection: Fabrieksdirect. Getest. Bewezen.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  imageAlt: Paddle Board Overstock-product dat kwaliteitstests ondergaat
stats:
  title: Paddle Board Overstock door de nummers
  stats:
    - title: Jaarlijkse productie
      description: 15.000+ opblaasbare SUP planken worden per jaar geproduceerd in onze fabriek in Weihai
    - title: Fabriek in Weihai
      description: Onze eigen productiefaciliteit van 12.000 m² — elke plaat wordt intern gebouwd
    - title: 99,3% Voldoet
      description: Slagingspercentage eindinspecties — 99,3% van de boarden worden voor het eerst verzonden
    - title: 2 Jaar SUP Garantie
      description: Elke stand-up paddle board heeft 2 jaar lang afgedekt tegen fabricagefouten. Verzonden naar 50+ landen
features3_certifications:
  title: Kwaliteit en testen
  subtitle: Elke printplaat wordt getest in ons eigen laboratorium voordat hij wordt verzonden — echte cijfers, echte gegevens, geen marketingclaims.
  columns: 3
  isBeforeContent: true
  items:
    - title: Gebouwd in onze eigen fabriek
      description: We bezitten en exploiteren een Weihai-faciliteit van 12.000 m². Elke productiebatch is traceerbaar, gedocumenteerd en geïnspecteerd — geen uitbestede mysterieuze productie.
      icon: tabler:building-factory
    - title: Materiaaltestlaboratorium
      description: Het interne materiaallab test treksterkte, UV weerstand, naadintegriteit en slijtage voor elke stofbatch vóór productie.
      icon: tabler:microscope
    - title: Materialen van maritieme kwaliteit
      description: UV-PVC gestabiliseerd drop-stitch , kernen en EVA dekschuim — gekozen en getest voor seizoenen van zon, zout en misbruik.
      icon: tabler:flask
    - title: 2 Jaar SUP Garantie
      description: Paddle Board Overstock SUP Planken zijn gedekt door een garantie van 2 jaar tegen fabricagefouten, waaronder naden, kleppen en materiaaldelaminatie. Wij staan achter wat we bouwen.
      icon: tabler:shield-check
testimonials:
  tagline: Klantvertrouwen
  title: Wat onze klanten zeggen
  subtitle: Van beginnende peddelaars tot doorgewinterde ontdekkingsreizigers — zie waarom ze vertrouwen Paddle Board Overstock hebben.
  items:
    - content: Als eerste koper was ik nerveus om uit het buitenland te bestellen. Het team beantwoordde elke vraag met echte foto's en testgegevens voordat ik het zelfs maar vroeg. Het bord arriveerde binnen 6 dagen en overtrof mijn verwachtingen.
      name: James Thornton
      title: SUP Eigenaar Explorer 11 — Vancouver, Canada
features3_lab:
  title: Intern test- en kwaliteitslab
  subtitle: Elke materiaalbatch en elk eindproduct gaat door ons testlaboratorium ter plaatse voordat het wordt verzonden.
  columns: 3
  isBeforeContent: true
  items:
    - title: Treksterkte testen
      description: 'Elke PVC textielrol wordt intern getest op treksterkte. Minimale vereiste: 350 N/cm ketting en inslag. Afgekeurde partijen worden teruggestuurd naar leverancier — we wijzen ongeveer 3% van de binnenkomende materialen af.'
      icon: tabler:scale
    - title: UV-versnelde veroudering
      description: Stofmonsters ondergaan 1.000 uur UV versnelde verwering. De treksterkte moet 80%+ behouden na blootstelling. Producten die zijn goedgekeurd voor 3+ jaar buitengebruik.
      icon: tabler:sun
    - title: Sterkte van naadafskillen
      description: Gelaste naden worden getest op een minimale aftreksterkte van 5 N/mm. Elke productiebatch heeft naadmonsters die destructief worden getest en gearchiveerd.
      icon: tabler:stack
    - title: 24–48 uur drukbehoud
      description: 'Elk opblaasbaar product wordt opgeblazen tot 1,25x de nominale PSI en wordt gedurende 24-48 uur gecontroleerd. Maximaal toelaatbare drukval: 5%. Producten die niet aan deze test voldoen, worden vóór verzending herwerkt en opnieuw getest.'
      icon: tabler:wind
    - title: Klepcyclustesten
      description: Elk klepontwerp ondergaat 10.000 open-dicht cycli in ons laboratorium. Kleppen moeten na het cyclus een luchtdichte afsluiting behouden bij 1,25x de nominale druk. Alle Paddle Board Overstock kleppen zijn geschikt voor 5+ jaar regelmatig gebruik.
      icon: tabler:rotate
    - title: Bestand tegen koude scheuren
      description: Materialen worden getest op -30°C gedurende 4 uur. Geen scheurvorming of brosheid toegestaan. Producten zijn geschikt voor winteropslag en koudwatergebruik tot -10°C omgevingstemperatuur.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Hoe we kwaliteit waarborgen
  subtitle: Van inspectie van grondstoffen tot de uiteindelijke druktest — elk product doorloopt een rigoureuze kwaliteitsketen.
  items:
    - title: Grondstofinspectie
      description: Elke rol PVC-stof wordt getest op dikte, treksterkte en UV-weerstand voordat deze in productie gaat.
      icon: tabler:search
    - title: In-proces kwaliteitscontrole
      description: Lasnaden, klepinstallaties en kamerverbindingen worden bij elk station tijdens de assemblage geïnspecteerd.
      icon: tabler:eye
    - title: Druk testen
      description: Elk opblaasbaar product wordt opgeblazen tot 1,25x de nominale PSI en 24–48 uur vastgehouden om het luchtbehoud en de stevigheid van de naden te verifiëren.
      icon: tabler:wind
    - title: Eindinspectie
      description: Elke eenheid wordt geïnspecteerd op afwerking, hardware en verpakking voordat goedkeuring voor verzending wordt gegeven. Stichproeven uit batches gaan naar ons laboratorium voor destructieve tests.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Board Veelgestelde vragen
  subtitle: Veelgestelde vragen over onze stand-up paddleboards.
  columns: 2
  items:
    - title: Welke SUP boardmaten zijn beschikbaar?
      description: We bieden SUP boards van 9 ft tot 12 ft, inclusief all-round, touring, yoga en speciale ontwerpen. Onze best verkochte modellen zijn de Tropical Breeze (10 ft) en Ocean Voyager (11 ft).
    - title: Wat is drop-stitch-constructie?
      description: Drop-stitch-constructie gebruikt duizenden polyester draden die de boven- en onderlagen van het board verbinden, waardoor het hoge luchtdruk (15–20 PSI) kan weerstaan en een stevig, stabiel platform creëert. Dit is de industriestandaard voor premium opblaasbare SUPs.
    - title: Wat is de gewichtsgrens voor SUP-boards?
      description: Onze SUP-boards dragen tot 150 kg, afhankelijk van het model en volume. Het Leviathan Wake-board is ons high-capacity model, ontworpen voor grotere rijders en yogagebruik.
    - title: Biedt u complete SUP-pakketten aan?
      description: Ja. Elk SUP-board wordt geleverd met een compleet pakket inclusief een 3-delige aluminium peddel, handpomp voor hoge druk, coil leash, reistas en reparatieset. Sommige modellen bevatten ook een afneembare vinset.
    - title: Wat is de garantie op SUP-boards?
      description: Alle Paddle Board Overstock SUP-boards hebben een garantie van 2 jaar tegen fabricagefouten, inclusief naadbreuk, klepdefecten en materiaaldelaminatie bij normaal gebruik.
    - title: Hoe lang duurt het om een SUP-board op te blazen?
      description: Met de bijgeleverde handpomp duurt het volledig oppompen tot 15 PSI ongeveer 8–12 minuten. Voor sneller oppompen raden we onze Paddle Board Overstock 12V elektrische pomp aan, die een board in minder dan 4 minuten oppompt.
