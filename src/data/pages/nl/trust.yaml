faqs_rib:
  title: RIB Boot FAQ
  subtitle: Veelgestelde vragen over onze starre opblaasbare boten.
  columns: 2
  items:
    - title: Welke maten RIB-boten biedt Paddle Board Overstock aan?
      description: We bieden 35 RIB-modellen van 2,5 m tot 7,6 m, van compacte bijboten tot zware commerciële en patrouilleboten. Elk model is beschikbaar met meerdere configuratieopties.
    - title: Wat is het verschil tussen een RIB en een traditionele opblaasbare boot?
      description: Een RIB (Rigid-Hull Inflatable Boat) combineert een stevige glasvezel of aluminium diepe V-romp met opblaasbare Hypalon- of PVC-slangen. Dit geeft de stabiliteit en laadcapaciteit van een harde boot met de schokabsorptie en het drijfvermogen van een opblaasbare boot.
    - title: Welke motoren zijn compatibel met Paddle Board Overstock RIBs?
      description: Onze RIBs ondersteunen buitenboordmotoren van 3 PK tot 250 PK, afhankelijk van het model. Elke productpagina vermeldt het maximale motorvermogen. We raden aan uw dealer te raadplegen voor de ideale match.
    - title: Zijn Paddle Board Overstock RIBs CE-gecertificeerd?
      description: Ja. Alle recreatieve RIB-modellen zijn CE-gecertificeerd volgens toepasselijke Europese normen voor recreatieve vaartuigen. Commerciële en patrouillemodellen voldoen aan extra stabiliteits- en belastingseisen.
    - title: Wat is de garantie op RIB-boten?
      description: Alle Paddle Board Overstock RIBs worden geleverd met een standaard eenjarige garantie tegen productiefouten, met dekking voor rompdelaminatie, buisnaadfalen, klepdefecten en beslagproblemen.
    - title: Hoeveel luchtkamers hebben Paddle Board Overstock RIBs?
      description: Onze RIBs hebben 3 tot 7 onafhankelijke luchtkamers, afhankelijk van de modellengte. Dit meerlamerige ontwerp zorgt ervoor dat de boot blijft drijven, zelfs als één compartiment is beschadigd.
faqs_inflatable:
  title: Opblaasbare Boot FAQ
  subtitle: Veelgestelde vragen over onze opblaasbare bijboten, kajaks en boten.
  columns: 2
  items:
    - title: Welke materialen worden gebruikt in Paddle Board Overstock opblaasbare boten?
      description: We gebruiken militaire kwaliteit PVC (1100 denier) en premium Hypalon/CSM-rubber, afhankelijk van het model. Beide materialen zijn UV-gestabiliseerd, slijtvast en voldoen aan EU REACH- en RoHS-regelgeving.
    - title: Hoe lang gaan opblaasbare boten mee?
      description: Met goed onderhoud gaat een kwalitatieve PVC-opblaasbare boot 7–10 jaar mee, terwijl Hypalon-modellen 15–20 jaar kunnen meegaan. Regelmatige reiniging, UV-bescherming en juiste opslag verlengen de levensduur aanzienlijk.
    - title: Welk onderhoud is vereist voor een opblaasbare boot?
      description: Basisonderhoud omvat spoelen met zoet water na elk gebruik (vooral in zoutwater), drogen voor opslag, jaarlijkse controle van klepafdichtingen en aanbrengen van UV-bescherming op de slangen. Vermijd langdurige blootstelling aan de zon wanneer niet in gebruik.
    - title: Kunnen opblaasbare boten in zoutwater worden gebruikt?
      description: Ja. Alle Paddle Board Overstock opblaasbare boten zijn ontworpen voor zowel zoet- als zoutwatergebruik. We raden aan te spoelen met zoet water en grondig te drogen na blootstelling aan zoutwater om corrosie van beslag en zoutkristallisatie in de stof te voorkomen.
    - title: Hoe bewaar ik een opblaasbare boot?
      description: Laat de lucht eruit, reinig en droog de boot volledig voor opslag. Rol losjes op (vermijd strakke vouwen), bewaar op een koele droge plaats uit direct zonlicht en uit de buurt van betonnen vloeren om vochtopname te voorkomen.
    - title: Wat is het draagvermogen van Paddle Board Overstock opblaasbare boten?
      description: Het draagvermogen varieert van 290 kg voor onze kleinste modellen tot meer dan 2000 kg voor grotere commerciële boten. Elke productpagina vermeldt de maximale belasting voor uw specifieke model.
faqs_sup:
  title: SUP Board FAQ
  subtitle: Veelgestelde vragen over onze stand-up paddle boards.
  columns: 2
  items:
    - title: Welke SUP board maten zijn beschikbaar?
      description: We bieden SUP boards van 9 ft tot 12 ft, inclusief all-round, touring, yoga en speciale ontwerpen. Onze bestverkochte modellen zijn de Tropical Breeze (10 ft) en Ocean Voyager (11 ft).
    - title: Wat is drop-stitch constructie?
      description: Drop-stitch constructie gebruikt duizenden polyesterdraden die de bovenste en onderste lagen van het board verbinden, waardoor het hoge luchtdruk (15–20 PSI) kan vasthouden en een stijf, stabiel platform biedt. Dit is de industrienorm voor premium opblaasbare SUPs.
    - title: Wat is de gewichtslimiet voor SUP boards?
      description: Onze SUP boards ondersteunen tot 150 kg, afhankelijk van het model en volume. De Leviathan Wake is ons model met de hoogste capaciteit, ontworpen voor grotere rijders en yogagebruik.
    - title: Bieden u complete SUP-pakketten?
      description: Ja. Elk SUP board wordt geleverd met een compleet pakket inclusief een 3-delige aluminium peddel, hogedruk handpomp, spiraallijn, reisrugzak en reparatieset. Sommige modellen bevatten ook een verwijderbare vinenset.
    - title: Wat is de garantie op SUP boards?
      description: Alle Paddle Board Overstock SUP boards hebben een eenjarige garantie tegen productiefouten, inclusief naadfalen, klepdefecten en materiaaldelaminatie onder normaal gebruik.
    - title: Hoe lang duurt het om een SUP board op te blazen?
      description: Met de meegeleverde handpomp duurt een volledige inflatie tot 15 PSI ongeveer 8–12 minuten. Voor snellere inflatie raden we onze Paddle Board Overstock 12V elektrische pomp aan, die een board in minder dan 4 minuten ophlaast.
