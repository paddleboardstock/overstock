content_benefits:
  tagline: Partnerschapsvoordelen
  title: Waarom distributeurs<br />Kiezen voor Paddle Board Overstock
  subtitle: Een partnerschap ontworpen voor maritieme distributeurs die behoefte hebben aan een betrouwbare levering, concurrerende marges en professionele ondersteuning.
  items:
    - title: Territoriumbescherming
      description: Exclusieve of semi-exclusieve gebiedsrechten voor gekwalificeerde distributeurs. Marktkartering en kanaalconflictbeheer om uw investering in het opbouwen van het merk Paddle Board Overstock in uw regio te beschermen.
      icon: tabler:map-pin
    - title: Concurrerende groothandelsprijzen
      description: Gedifferentieerde prijzen op basis van jaarlijkse volumeverplichtingen. Margebeschermende prijsstructuur met prijsgaranties vooraf en transparante kostenspecificaties (FOB Qingdao-basis).
      icon: tabler:currency-dollar
    - title: Marketingondersteuningskit
      description: Professionele productfotografie, specificatiebladen, sjablonen voor nalevingsdocumentatie, sociale media-inhoud en co-branded marketingmateriaal. Jaarlijks bijgewerkt met nieuwe productlanceringen.
      icon: tabler:photo
    - title: Technische opleiding
      description: Producttraining voor uw verkoopteam (virtueel of op locatie), onderhouds- en reparatietraining voor uw servicetechnici en klantgerichte veelgestelde vragen en handleidingen voor probleemoplossing.
      icon: tabler:school
    - title: Reserveonderdelen en after-sales
      description: Toegewijde levering van reserveonderdelen met prioriteitsverzending. Vervangende buissecties, kleppen, vinnen en reparatiesets beschikbaar voor snelle orderverwerking. Ondersteuning bij verwerking van garantieclaims.
      icon: tabler:tool
    - title: Nalevingsdocumentatie
      description: 'Volledig compliance-documentatiepakket voor uw markt: CE DoC, bouwplaatgegevens, gebruikershandleidingen en ondersteuning voor wettelijke registratie. Elimineert uw nalevingslasten.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Waar we naar op zoek zijn
  title: Distributeur<br />Vereisten
  subtitle: We zoeken partners die Paddle Board Overstock-producten op hun grondgebied professioneel kunnen vertegenwoordigen en ondersteunen.
  items:
    - title: Territorium- en marktkennis
      description: Gevestigde aanwezigheid in de maritieme, watersport- of openluchtrecreatiemarkt. Inzicht in lokale regelgeving, consumentenvoorkeuren en distributiekanalen voor waterscooterproducten.
      icon: tabler:target
    - title: Industrie ervaring
      description: Minimaal 2 jaar ervaring met het distribueren van maritieme, outdoor- of sportuitrusting. Bewezen trackrecord bij internationale merken en B2B-groothandelsactiviteiten.
      icon: tabler:briefcase
    - title: Showroom of Magazijn
      description: Fysieke faciliteit voor productweergave, voorraadopslag en klantenservice. Mogelijkheid om demo-eenheden en reserveonderdelenvoorraad voor uw gebied bij te houden.
      icon: tabler:building-store
    - title: Toewijding aan merknormen
      description: Bereidheid om de merkpresentatienormen van Paddle Board Overstock te handhaven, klantenondersteuning te bieden volgens onze serviceprotocollen en deel te nemen aan jaarlijkse producttrainingsupdates.
      icon: tabler:star
content_process:
  tagline: Aanvraagproces
  title: Dealer<br />Aanvraagproces in 4 stappen
  subtitle: 'Van de eerste aanvraag tot de eerste verzending: een eenvoudig onboardingproces.'
  steps:
    - number: '01'
      title: Initiële aanvraag en kwalificatie
      description: Dien uw distributeuraanvraag in met bedrijfsgegevens, interessegebied, huidige productlijnen en jaarlijkse volumeschattingen. Wij beoordelen binnen 5 werkdagen.
      timeline: 5 dagen
    - number: '02'
      title: Bedrijfsbeoordeling en voorwaarden
      description: Virtuele bijeenkomst om territoriumstrategie, prijsniveaus en partnerschapsvoorwaarden te bespreken. Bekijk de nalevingsdocumentatievereisten voor uw markt. NDA-ondertekening indien nodig.
      timeline: 1-2 weken
    - number: '03'
      title: Monsterbestelling en -evaluatie
      description: Plaats een eerste monsterbestelling (2-5 eenheden) tegen distributeursprijzen voor marktevaluatie en teamtraining. Volledige nalevingsdocumentatie en demo-voorbereiding inbegrepen.
      timeline: 30-45 dagen
    - number: '04'
      title: Partnerschapslancering en -ondersteuning
      description: Eerste containerbestelling waarbij territoriumbescherming geactiveerd is. Marketingkit afgeleverd, verkoopteam getraind en toegewijde accountmanager toegewezen. Doorlopende bedrijfsbeoordelingen per kwartaal.
      timeline: Lopend
content_application_docs:
  tagline: Aanvraagdocumenten
  title: Vereiste documenten<br />voor dealeraanvraag
  subtitle: Bereid voor uw aanvraag voor een Paddle Board Overstock-dealerschap de volgende documenten en informatie voor ons beoordelingsteam.
  items:
    - title: Handelsregisteruittreksel
      description: Geldig bedrijfsregistratiedocument met de juridische naam, het geregistreerde adres en de activiteiten die de distributie van watersport-, sport- of outdoorequipment omvatten.
      icon: tabler:file-text
    - title: Gebiedsdekkingsplan
      description: Gewenst geografisch gebied, bestaand retail- of distributienetwerk, doelklantsegmenten en voorgesteld jaarvolume per productcategorie (RIB, SUP, kajak).
      icon: tabler:map
    - title: Showroom- of magazijncapaciteit
      description: Fysieke vestiging voor productpresentatie, voorraadopslag en klantenservice. Foto's of plattegronden met demoruimte en opslagcapaciteit voor reserveonderdelen.
      icon: tabler:building
    - title: Verklaring van financiële capaciteit
      description: 'Bankreferentie of jaarrekening die het vermogen bevestigt om een initiële containerorder te plaatsen en voorraad aan te houden. Minimale eerste order: één 20-voetcontainer (10-20 units, gemengde modellen).'
      icon: tabler:coin
    - title: Capaciteit voor after-salesondersteuning
      description: Servicemonteurs die zijn opgeleid of opgeleid kunnen worden voor onderhoud en reparatie van opblaasbare boten. Mogelijkheid voor afhandeling van garantieclaims en toezegging van een reserveonderdelenvoorraad.
      icon: tabler:tool
    - title: Referenties van eerdere merken
      description: Lijst van watersport- of sportmerken die momenteel of eerder worden gedistribueerd. Contactreferenties beschikbaar na wederzijdse instemming. Startups zonder eerdere distributie-ervaring komen in aanmerking met een sterkere financiële toezegging.
      icon: tabler:users
faq:
  title: Dealerprogramma – Veelgestelde vragen
  questions:
    - q: Wat is de minimale bestelhoeveelheid voor distributeurs?
      a: Distributeur MOQ begint bij 10-20 eenheden per bestelling, met flexibiliteit voor gemengde modellen (RIB, opblaasbaar, SUP). Initiële monsterbestellingen van 2-5 eenheden zijn beschikbaar tegen distributeursprijzen voor marktevaluatie.
    - q: Biedt u exclusieve territoriumrechten aan?
      a: Er zijn exclusieve gebiedsrechten beschikbaar voor gekwalificeerde distributeurs die aan de jaarlijkse volumeverplichtingen voldoen en de merknormen handhaven. Er zijn ook semi-exclusieve en niet-exclusieve arrangementen beschikbaar voor opkomende markten.
    - q: Welke marketingondersteuning biedt u?
      a: We bieden een uitgebreide marketingkit inclusief professionele productfotografie, specificatiebladen, sjablonen voor nalevingsdocumentatie, bibliotheek met sociale media-inhoud en co-branded materialen. Jaarlijks bijgewerkt met nieuwe productlanceringen.
    - q: Hoe worden garantieclaims afgehandeld?
      a: 'Distributeurs fungeren als eerste aanspreekpunt voor garantieclaims. We bieden duidelijke garantiecriteria, fotodocumentatieprotocollen en snelle vervangings- of kredietverwerking. Garantievoorwaarden: 5 jaar beperkt op de stof/naden/romp van de bootbuis; 2 jaar op SUP en accessoires.'
    - q: Kan ik Paddle Board Overstock-producten private labelen onder mijn eigen merk?
      a: Ja, via ons OEM/ODM-programma. Private-labelopties omvatten aangepaste buisafbeeldingen, console-branding, retailverpakking en nalevingsdocumentatie onder uw merknaam. Zie onze OEM/ODM-servicepagina voor meer informatie.
    - q: Welke nalevingsdocumentatie is inbegrepen voor distributeurs?
      a: Elke verzending omvat modelspecifieke CE DoC, bouwplaatgegevens, gebruikershandleidingen en verzenddocumentatie. We bieden ook ondersteuning bij wettelijke registratie voor uw regio en helpen bij eventuele lokale nalevingsvereisten.
