hero:
  tagline: Certificeringen & Normen
  title: 'Kwaliteitscertificeringen<br />& Nalevingsnormen'
  subtitle: 'Paddle Board Overstock-producten worden geproduceerd in overeenstemming met internationale normen voor maritieme veiligheid, kwaliteitsmanagementsystemen en milieuvoorschriften.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock kwaliteitscertificeringen en nalevingsdocumentatie
content_certifications:
  tagline: Onze certificeringen
  title: 'Gecertificeerde kwaliteit,<br />wereldwijd erkend'
  subtitle: '64 CE-gecertificeerde modellen en fabrieksbrede certificeringen tonen onze inzet voor kwaliteit, veiligheid en milieuverantwoordelijkheid.'
  items:
    - title: 'CE-gecertificeerd'
      description: '64 CE-gecertificeerde modellen voldoen aan de Europese CE-markeringseisen voor recreatieve vaartuigen, zodat wordt gegarandeerd dat de normen voor veiligheid, gezondheid en milieubescherming worden nageleefd.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Ons kwaliteitsmanagementsysteem is gecertificeerd volgens ISO 9001:2015 en bestrijkt het ontwerp, de productie en de distributie van opblaasbare vaartuigen en marine-uitrusting.'
      icon: tabler:clipboard-check
    - title: 'UKCA-markering'
      description: 'Producten die op de Britse markt worden verkocht dragen de UKCA-markering, wat bevestigt dat ze voldoen aan de Britse voorschriften voor marine-uitrusting en recreatieve vaartuigen.'
      icon: tabler:shield
    - title: 'BSCI-conform'
      description: 'Paddle Board Overstock wordt geauditeerd volgens BSCI (Business Social Compliance Initiative), wat ethische productiepraktijken, eerlijke arbeidsomstandigheden en verantwoordelijkheid in de toeleveringsketen aantoont.'
      icon: tabler:heart-handshake
    - title: 'REACH-conform'
      description: 'Alle materialen in Paddle Board Overstock-producten voldoen aan de EU-REACH-verordening voor chemische veiligheid, zodat onze PVC, Hypalon en componenten geen beperkte stoffen bevatten.'
      icon: tabler:flask
    - title: 'Materiaaltesten'
      description: 'Stoffen worden getest op trekvastheid, scheurweerstand, UV-degradatie en prestaties bij koude-scheuring. Elke productiebatch wordt bemonsterd en geverifieerd.'
      icon: tabler:test-pipe
content_factory:
  tagline: Fabrieksstandaarden
  title: 'Productie-excellentie<br />— volgens specificatie gebouwd'
  subtitle: 'Onze faciliteit van 12,000 m² werkt volgens strikte kwaliteitscontroleprotocollen in elke fase van de productie.'
  list:
    - 'Inkomende materiaalcontrole: alle grondstoffen — PVC-doek, Hypalon, aluminium, multiplex, lijmen — worden vóór productie tegen specificaties getest.'
    - 'Kwaliteitscontrole in het proces: elke productiefase heeft gedocumenteerde QC-controlepunten. Lasssterkte, naaduitlijning, klepinstallatie en montagemoment worden inline geverifieerd.'
    - 'Druktesten: Elke opblaasbare kamer wordt gedurende 24-48 uur op druk getest bij een nominale druk van 1,25×. Het lekpercentage moet nul zijn om te slagen voor het cijfer.'
    - 'Eindinspectie: voltooide producten worden vóór verzending gecontroleerd op dimensionale nauwkeurigheid, cosmetische afwerking, volledigheid van accessoires en integriteit van de verpakking.'
    - 'Batch-traceerbaarheid: elk product draagt een serienummer dat is gekoppeld aan productiebatchgegevens, waardoor volledige traceerbaarheid van grondstof tot eindproduct mogelijk is.'
content_safety:
  tagline: Normen voor maritieme veiligheid
  title: 'Veiligheid eerst<br />— ontworpen voor betrouwbare werking'
  subtitle: 'Paddle Board Overstock-producten zijn ontworpen en getest om te voldoen aan internationale normen voor maritieme veiligheid voor commercieel en recreatief gebruik.'
  items:
    - title: 'ISO 6185'
      description: 'Opblaasbare boten voldoen aan de ISO 6185-normen voor constructie, stabiliteit, drijfvermogen en laadcapaciteit.'
      icon: tabler:sailboat
    - title: 'ABYC-normen'
      description: 'Elektrische systemen en brandstofsystemen volgen de ABYC-standaarden (American Boat & Yacht Council) voor veilige installatie en bediening.'
      icon: tabler:bolt
    - title: 'SOLAS-conformiteit'
      description: 'Veiligheidsuitrusting en reddingsmiddelen voldoen aan de SOLAS-eisen (Safety of Life at Sea) waar van toepassing.'
      icon: tabler:lifebuoy
cta:
  title: 'Gecertificeerde producten nodig voor uw project?'
  subtitle: 'Neem contact op met ons team om certificeringseisen, documentatie en nalevingsnormen voor uw markt te bespreken.'
  actions:
    - variant: primary
      text: Certificeringsdocumenten aanvragen
      href: /contact
    - text: Bekijk onze kwaliteitspagina
      href: /quality
