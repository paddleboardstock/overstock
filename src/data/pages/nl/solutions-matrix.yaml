hero:
  tagline: Matrix voor brancheoplossingen
  title: Op scenario's gebaseerde maritieme oplossingen<br />Voor professionele activiteiten
  subtitle: Speciaal ontworpen opblaasbare waterscooters en RIB's die zijn geconfigureerd voor reddings-, verhuurvloot-, jachttender- en commerciële visserijtoepassingen - elk ondersteund door technische specificaties en aanpassingsmogelijkheden.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock professionele maritieme oplossingen voor diverse industrieën
direct_answer: "Paddle Board Overstock levert op scenario's gebaseerde opblaasbare waterscooters en RIB-oplossingen voor commerciële maritieme activiteiten: reddings- en patrouilleboten met versterkte Hypalon-buizen en meerkamerveiligheid, huurvloot SUP's en kajaks met 1,2 mm PVC en heteluchtgelaste naden voor onderhoudsarme duurzaamheid, luxe jachttenders met diepe V-aluminium romp-RIB's, en heavy-duty visconfiguraties met hengelhouders en livewell-systemen."
solution_a:
  tagline: Oplossing A
  title: Zeeredding en<br />Commerciële patrouille
  subtitle: Hogesnelheids-RIB's met meerdere kamers voor professionele noodhulp en wetshandhavingsoperaties.
  badge: Heavy-Duty Series
  description: Onze reddings- en patrouille-RIB's op zee zijn gebouwd met versterkte Hypalon/PVC-luchtbuizen met hoge dichtheid en een onafhankelijk flotatieontwerp met meerdere kamers. Elk schip is uitgerust met professionele reflecterende tape, reddingslijnen en snel opblaasventielen zodat het schip gereed is voor inzet. Deep-V glasvezel rompen zorgen voor uitzonderlijke stabiliteit bij hoge snelheden en in ruwe zeeomstandigheden.
  features:
    - title: Meerkamerveiligheid
      description: 4–6 onafhankelijke luchtkamers – elke lekke band in één kamer zorgt voor een positieve flotatie
    - title: Versterkte buisstof
      description: 1,2 mm Hypalon CSM of 1.680 DTEX PVC met dubbellaagse heteluchtlasnaden
    - title: Professionele kwaliteit
      description: SOLAS reflecterende tape, reddingsgrijplijnen, sleepschoenen, snel los te maken schilderlijn
    - title: Hogesnelheidsromp
      description: Deep-V-romp van glasvezel of aluminium, geschikt voor 25-45 knopen, afhankelijk van de configuratie
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Romp materiaal
      value: Glasvezel/aluminium van maritieme kwaliteit
    - label: Buisstof
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Maximale snelheid
      value: 25-45 knopen
    - label: Capaciteit
      value: 6–12 personen
    - label: Motorbereik
      value: 40–200 pk
    - label: Certificering
      value: CE/ISO 9001
solution_b:
  tagline: Oplossing B
  title: Watersportverhuur en<br />resortvlootuitrusting
  subtitle: Uiterst duurzame, onderhoudsarme opblaasbare SUP's, kajaks en boten, gebouwd voor dagelijks verhuurgebruik in resorts, clubs en touractiviteiten.
  badge: Rental-Grade
  description: Onze verhuurvlootapparatuur is ontworpen voor de hoogste duurzaamheid en de laagste onderhoudskosten. We gebruiken 1,2 mm versterkt PVC met drielaagse heteluchtlasnaadtechnologie die bestand is tegen UV-degradatie en frequente botsingsschade. De drop-stitch-constructie zorgt ervoor dat de planken hun stijfheid behouden, zelfs na honderden verhuurcycli. Alle modellen zijn voorzien van versterkte D-ringen, slijtvaste railbanden en commerciële kleppen.
  features:
    - title: PVC van commerciële kwaliteit
      description: 1,2 mm versterkt PVC met UV-stabilisatoren - 3x dikker dan materialen van consumentenkwaliteit
    - title: Heteluchtgelaste naden
      description: 'Drielaags smeltlassen: sterker dan lijmverbindingen, bestand tegen delaminatie'
    - title: Drop-Stitch-stijfheid
      description: 1.680 DTEX-kern met 2 threads/sq in – geclassificeerd tot 20 PSI voor hardboard-achtige stijfheid
    - title: Vlootklaar ontwerp
      description: Versterkte D-ringen, commerciële Halkey-Roberts-kleppen, slijtvaste railbanden
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Buismateriaal
      value: 1,0–1,2 mm Versterkte PVC
    - label: Naadtechnologie
      value: Drielaags heteluchtlassen
    - label: Maximale druk
      value: 15–20 PSI (drop-stitch-modellen)
    - label: UV-bestendigheid
      value: Meer dan 1000 uur versneld testen
    - label: Garantie
      value: 2–5 jaar, afhankelijk van het model
    - label: Onderhoud
      value: Minimaal – afspoelen en opbergen
solution_c:
  tagline: Oplossing C
  title: Jachttenders en<br />luxe waterscooters
  subtitle: Lichtgewicht, hoogwaardige RIB-tenders ontworpen voor superjachtopslag en gastenvervoer met luxe pasvorm en afwerking.
  badge: Premium Series
  description: Onze jachttender RIB's combineren lichtgewicht constructie met luxe esthetiek. Deep-V aluminium- of glasvezelrompen zorgen voor een uitzonderlijke rijkwaliteit en eenvoudig heffen van de davit. verkrijgbaar met op kleur afgestemde buisafbeeldingen, premium bekleding en aangepaste console-indelingen. Dankzij de compacte opslagafmetingen zijn ze ideaal voor superjachtgarages en dekopslag.
  features:
    - title: Lichtgewicht constructie
      description: Rompen van aluminium van maritieme kwaliteit verminderen het gewicht met 30% vergeleken met glasvezel, zodat ze gemakkelijk kunnen worden opgetild
    - title: Deep-V-prestaties
      description: Deadrise-romp van 18–22 graden voor een soepele rit in chop en uitstekende tracking
    - title: Luxe pasvorm en afwerking
      description: Op maat gemaakte bekleding, buizen in bijpassende kleur, premium stuurconsole, roestvrijstalen verpakking
    - title: Compacte opslag
      description: Ontworpen voor superjachtgarages - leeglopende buizen voor compact opbergen
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Romptype
      value: Deep-V aluminium/glasvezel
    - label: Doodstil
      value: 18–22 graden
    - label: Maximale snelheid
      value: 30-40 knopen
    - label: Droog gewicht
      value: 120–350 kg (aluminium romp)
    - label: Davitlift gereed
      value: Ja – hijspunten standaard
    - label: Opslag
      value: Leegloopbare buizen, stapelbaar
