content_priorities:
  tagline: Wat klanten verifiëren
  title: 8 dingen die kopers verifiëren<br />bij elk fabrieksbezoek
  subtitle: Gebaseerd op feedback van kopers uit meer dan 50 landen zijn dit de acht prioriteiten die klanten beoordelen voordat ze een B2B-bestelling plaatsen.
  items:
    - title: Echte fabrikant
      description: 'Bent u de daadwerkelijke fabriek en geen handelsbedrijf? Kopers controleren: bedrijfsentiteit, echte productieapparatuur, werknemers die machines bedienen, huidige productieorders op de werkvloer en consistentie tussen website en werkplaats.'
      icon: tabler:building-factory
    - title: Product geschikt voor toepassing
      description: Komt de RIB overeen met hun specifieke gebruiksscenario? Resort-, reddings-, duik-, vis- en patrouilleoperators hebben fundamenteel verschillende eisen. Kopers beoordelen de dekindeling, het buismateriaal en de uitrustingsopties op de getoonde boot.
      icon: tabler:target
    - title: Kwaliteitsstabiliteit en reproduceerbaarheid
      description: Is de 50e eenheid net zo goed als de 1e? Inkopers onderzoeken kwaliteitscontrolesystemen, controlepunten tijdens het proces, afhandeling van non-conformiteiten en vragen om gegevens van meerdere productieruns om de consistentie te verifiëren.
      icon: tabler:repeat
    - title: Authenticiteit van nalevingsdocumenten
      description: Zijn CE-certificaten modelspecifiek? Is de DoC ondertekend door een echt persoon? Kan de naleving per rompnummer worden geverifieerd? Kopers controleren op algemene claims versus modelspecifieke documentatie.
      icon: tabler:file-certificate
    - title: Maatwerk uitvoering
      description: Kan de fabriek daadwerkelijk maatwerkconfiguraties leveren? Kopers zoeken naar bewijs van eerdere maatwerkprojecten, tentoongestelde prototypes, technische tekeningen en de mogelijkheid om technische wijzigingen ter plekke te bespreken.
      icon: tabler:adjustments
    - title: Doorlooptijd en capaciteit
      description: 'Zijn de geciteerde tijdlijnen realistisch? Kopers beoordelen: het huidige productievolume, de beschikbare capaciteit, de omvang van het personeelsbestand, de materiaalvoorraden en of de fabriek over een productieplanningssysteem beschikt.'
      icon: tabler:clock
    - title: Prijs- en handelsvoorwaarden
      description: 'Zijn prijzen transparant? Zijn de FOB-prijzen duidelijk? Kopers verifiëren: de uitsplitsing van de eenheidsprijzen, gereedschapskosten, verpakkingskosten en of de fabriek met de juiste exportdocumentatie aan de DDP- of CIF-voorwaarden kan voldoen.'
      icon: tabler:currency-dollar
    - title: Aftersales en reserveonderdelen
      description: 'Wat gebeurt er na de bevalling? Kopers beoordelen: beschikbaarheid van reserveonderdelen, garantieproces, vervangende buissecties, vervanging van kleppen en of de fabriek een gedocumenteerd after-salesprotocol heeft.'
      icon: tabler:headset
content_tour:
  tagline: Fabrieksrondleiding
  title: Auditrondleiding —<br />Wat u zult zien
  subtitle: Onze standaard fabrieksrondleiding volgt een gedefinieerde route die is ontworpen om op elk station vragen van kopers te beantwoorden.
  items:
    - title: 1. Vergaderruimte — Bedrijfsintroductie
      description: Bedrijfslicentie, ISO 9001- en BSCI-certificaten, exportlicenties en bedrijfsgeschiedenis. Snel overzicht van productiemogelijkheden en nalevingsbereik.
      icon: tabler:users
    - title: 2. Grondstoffenmagazijn – IQC-station
      description: Inkomende materiaalinspectiegegevens, partijcertificaten van stoffen, lijm- en hardwaremonsters. Bekijk hoe materialen worden getest voordat ze in productie gaan.
      icon: tabler:building-warehouse
    - title: 3. Buisfabricage – RF-lassen en handlijmen
      description: Live buislas- of lijmproces, demonstraties van naadsterktetests en klepinstallatie. Observeer de constructie en kwaliteitscontroles per kamer.
      icon: tabler:flame
    - title: 4. Lamineren van de romp — GVK-workshop
      description: Glasvezel lay-upproces, aanbrengen van gelcoat en uitharden van de romp. Bekijk het lamineerschema en structurele versterking voor verschillende RIB-modellen.
      icon: tabler:layers-subtract
    - title: 5. Assemblage & Integratie
      description: Romp-buisverbinding, console- en stoelinstallatie, integratie van elektrische systemen en brandstofsystemen, en montage van apparatuur. Observeer de lopende productielijn.
      icon: tabler:tool
    - title: 6. Drukteststation
      description: 24-48 uur drukhoudtest bij 1,25x nominale druk. Bekijk testgegevens, manometers en criteria voor slagen/mislukken. Bekijk hoe testresultaten zijn gekoppeld aan serienummers van de romp.
      icon: tabler:gauge
    - title: 7. Eindinspectie en kwaliteitscontrole
      description: Kwaliteitscontrolelijst van 100 punten per eenheid, dimensionale verificatie, cosmetische inspectie en integriteitscontrole van de verpakking. Beoordeel non-conformiteitslogboeken en records met corrigerende maatregelen.
      icon: tabler:clipboard-check
    - title: 8. Documentbeoordelingsruimte
      description: Nalevingsdocumentatie per model (DoC, bouwplaat, gebruikershandleiding), traceerbaarheidsrecords van de productie, HIN-register en demonstratie van de database voor het volgen van materiaalbatches.
      icon: tabler:folder
content_qc_chain:
  tagline: Kwaliteitsbewijs
  title: 8-fasen QC-keten<br />— Verifieerbaar bij elke stap
  subtitle: Onze kwaliteitscontroleketen loopt van binnenkomende materialen tot de uiteindelijke verzending, met gedocumenteerd bewijs in elke fase.
  items:
    - title: 'Fase 1: Inspectie van inkomend materiaal'
      description: Elke partij PVC, Hypalon, glasvezel, aluminium, lijmen en hardware wordt getest aan de hand van specificaties voordat deze in productie gaat. Treksterkte, coatinghechting en maatcontroles volgens AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Fase 2: Buislassen / lijmen QC'
      description: Testen van de sterkte van de naadafpeling per productiebatch. RF-lasparameters worden bewaakt en geregistreerd. Met de hand gelijmde naden gecontroleerd op consistente lijmdekking en uithardingstijd.
      icon: tabler:flame
    - title: 'Fase 3: QC lamineren van de romp'
      description: Meting van de dikte van de gelcoat, verificatie van de glasvezelopstelling volgens laminaatschema en monitoring van de uithardingstijd. Posities van structurele wapening geverifieerd aan de hand van technische tekeningen.
      icon: tabler:layers-subtract
    - title: 'Fase 4: QC assemblage en integratie'
      description: Integriteit van de romp-buisverbinding, bevestigingskoppel van console en stoel, elektrische continuïteit en lektest van het brandstofsysteem. Elk installatiepunt gecontroleerd aan de hand van de modelspecifieke montagechecklist.
      icon: tabler:tool
    - title: 'Fase 5: Drukhoudtest'
      description: Elke opblaasbare kamer werd onder druk gezet tot 1,25x de nominale PSI en werd 24-48 uur vastgehouden. Drukval geregistreerd per kamer. Pass/fail-drempel gedocumenteerd. Gekoppeld aan het serienummer van de romp.
      icon: tabler:gauge
    - title: 'Fase 6: Eindinspectie'
      description: 100-punts kwaliteitschecklist met betrekking tot maatnauwkeurigheid, cosmetische afwerking, volledigheid van accessoires, documentatiepakket en verpakkingsintegriteit. Onafhankelijk van productieteam.
      icon: tabler:clipboard-check
    - title: 'Fase 7: Nalevingsdocumentatie'
      description: Modelspecifieke DoC, verificatie van bouwplaat, volledigheid van de gebruikershandleiding en HIN-registratie. Alle conformiteitsdocumenten zijn opgesteld en geverifieerd voordat de verzending wordt vrijgegeven.
      icon: tabler:file-certificate
    - title: 'Fase 8: Vrijgave en traceerbaarheid van verzending'
      description: De definitieve vrijgave vereist dat alle QC-fasen zijn doorlopen, de nalevingsdocumentatie is voltooid en de verzenddocumentatie is geverifieerd. Romprecord gesloten en gearchiveerd voor bewaartermijn van meer dan 10 jaar.
      icon: tabler:truck
content_traceability:
  tagline: Traceerbaarheid van de productie
  title: HIN → Hoofdbestand →<br />Romprecord → Levering
  subtitle: Elke RIB-boot heeft een uniek rompidentificatienummer dat is gekoppeld aan een volledige productie- en nalevingsregistratieketen.
  items:
    - title: Rompidentificatienummer (HIN)
      description: Unieke identificatiecode van 14 tekens die permanent op elke boot is gemarkeerd. Codeert fabrikantcode (MIC), modelaanduiding, productiejaar en serienummer. De sleutel die de volledige traceerbaarheidsketen ontgrendelt.
      icon: tabler:hash
    - title: Master technisch dossier
      description: De compliance- en engineeringdocumentatie voor de modelfamilie. Bevat GA-tekeningen, risicobeoordeling, stabiliteitsberekeningen, materiaalspecificaties en toepasselijke normen. Gekoppeld aan alle rompen van dat model.
      icon: tabler:folder
    - title: Individueel romprecord
      description: 'Productierecord per romp: HIN, productiedatum, buisbatch, materiaalcertificaten, druktestresultaat, eindconfiguratie, motorspecificatie, resultaten van de kwaliteitschecklist en leveringsbestemming. 21+ datavelden per romp.'
      icon: tabler:file-description
    - title: Klantnalevingspakket
      description: Leveringspakket per romp inclusief DoC, foto van bouwersplaat, gebruikershandleiding, nalevingscontrolelijst en definitief configuratieblad. Wordt met de boot verzonden en meer dan 10 jaar in de fabriek gearchiveerd.
      icon: tabler:package
content_red_flags:
  tagline: Valkuilen bij audits
  title: Kopers met rode vlaggen<br />Gemakkelijk te herkennen
  subtitle: Veelvoorkomende problemen die het vertrouwen van kopers ondermijnen tijdens fabrieksaudits. We pakken ze allemaal proactief aan.
  items:
    - title: Algemene CE-claims zonder modelomvang
      description: '"Alle producten CE-gecertificeerd" zonder te specificeren welke richtlijn, welke modellen en welke conformiteitsmodule. Rode vlag: suggereert dat naleving oppervlakkig is en niet per model, per configuratie.'
      icon: tabler:alert-triangle
    - title: Geen fysiek testbewijs
      description: 'Druktestclaims zonder dat testgegevens, meters of teststation zichtbaar zijn op de fabrieksvloer. Rode vlag: kwaliteitsclaims kunnen tijdens het bezoek niet worden geverifieerd.'
      icon: tabler:alert-triangle
    - title: Ontbrekende traceerbaarheid van materiaal
      description: 'Geen batchregistratie, geen inkomende inspectie of geen koppeling tussen materiaalcertificaten en eindproducten. Rode vlag: geen manier om kwaliteitsproblemen naar de bron te herleiden.'
      icon: tabler:alert-triangle
    - title: Generieke documentatie
      description: "Eén DoC voor alle modellen, geen HIN-specifieke records of 'sjabloon'-conformiteitsdocumenten. Rode vlag: naleving is niet gebonden aan individuele productie-eenheden."
      icon: tabler:alert-triangle
content_shipping:
  tagline: Verzending en verpakking
  title: Containerladen en kisten<br />van RIB-boten
  subtitle: Onze verzendoplossingen beschermen uw investering van Qingdao tot de bestemmingshaven. Containerlaadplannen en kistspecificaties beschikbaar voor elk model.
  items:
    - title: 20-voet containerconfiguraties
      description: 'Standaard 20-voet container: 1-2 RIB-boten (4,0-5,5 m) genest met gescheiden dek en tubes, of 8-12 SUP-boards. Gemengde RIB + SUP-configuraties beschikbaar. Gedetailleerd laadplan bij elke order.'
      icon: tabler:box
    - title: 40-voet containerconfiguraties
      description: 'Standaard 40-voet container: 2-4 RIB-boten (tot 7,0 m) met geneste rompen en gestapelde tubes, of 20-30 SUP-boards. 40-voet HQ beschikbaar voor hogere RIB-modellen. Volumegoptimaliseerde verpakking verlaagt de verzendkosten per eenheid.'
      icon: tabler:container
    - title: Houten kisten voor RIB-rompen
      description: Aluminium en GRP rompen verpakt in kisten op maat met schuimvulling, vochtbarrière en staalbandering. Kistafmetingen en gewicht per model beschikbaar voor logistieke planning. ISPM-15-certificering voor thermisch behandeld hout inbegrepen.
      icon: tabler:wood
    - title: Verpakking met scheiding van tubes en dek
      description: Tubes leeggelaten en opgevouwen apart van de rompen voor ruimtebesparing. Dekplaten, consoles en zitplaatsen verpakt in beschermende folie met montagebeslagkits. Montage-instructies bij elke zending inbegrepen.
      icon: tabler:package
    - title: Bescherming tegen vocht en corrosie
      description: VCI-anticorrosiepapier voor aluminium onderdelen, silicagel-droogzakjes en vacuümverzegelde beslagzakken. Voorkomt condentieschade tijdens 30-45 dagen zeetransport.
      icon: tabler:droplet-off
    - title: FOB Qingdao-documentatie
      description: Connossement, commerciële factuur, paklijst, certificaat van oorsprong en conformiteitsdocumentatie per zending. FCL- en LCL-consolidatie beschikbaar. Ondersteuning bij douanedocumentatie voor EU-, VS- en Midden-Oostenmarkten.
      icon: tabler:file-text
faq:
  title: Fabrieksaudit — Veelgestelde vragen
  questions:
    - q: Kan ik de fabriek persoonlijk bezoeken?
      a: Ja. Wij verwelkomen fabrieksaudits ter plaatse in onze 12.000 m² grote fabriek in Qingdao. Onze standaardrondleiding omvat 8 stations, van grondstoffenmagazijn tot documentbeoordelingsruimte. Voor initiële kwalificatie zijn ook virtuele fabrieksrondleidingen via videogesprek beschikbaar.
    - q: Accepteert u audits van derden (BSCI, SMETA, SGS)?
      a: Ja. Wij beschikken over de BSCI-certificering (Intertek) en verwelkomen klantspecifieke auditprotocollen. Op verzoek kunnen wij ook SGS- of TÜV-keuringen verzorgen. Auditrapporten zijn beschikbaar onder geheimhoudingsverklaring.
    - q: Kan ik tijdens het bezoek de druktesten zien?
      a: Ons drukproefstation maakt deel uit van de standaard tourroute. Afhankelijk van het productieschema kunt u actieve druktests met meteruitlezingen en testgegevens observeren. Drukproeflogboeken per romp zijn altijd ter inzage beschikbaar.
    - q: Hoe ga je om met niet-conforme producten?
      a: Niet-conforme eenheden worden gescheiden, gedocumenteerd en beoordeeld volgens ons ISO 9001-proces voor corrigerende maatregelen. Er wordt een analyse van de hoofdoorzaak uitgevoerd, corrigerende maatregelen worden geïmplementeerd en er worden gegevens bijgehouden. Kopers kunnen ons NCR-logboek bekijken tijdens audits.
    - q: Welke nalevingsdocumentatie is ter beoordeling beschikbaar?
      a: 'Tijdens de audit kunt u het volgende bekijken: modelspecifieke DoC-monsters, bouwplaatspecificaties, HIN-register, ontwerpen van de gebruikershandleiding, toepasselijke standaardlijsten en conformiteitsbeoordelingsrecords per modelfamilie.'
    - q: Hoe boek ik een virtuele fabrieksrondleiding?
      a: Neem contact op met ons verkoopteam om een live videotour te plannen via WhatsApp, Zoom of Teams. We volgen dezelfde route van 8 stations en kunnen ons op specifieke gebieden concentreren op basis van uw interesses. Een typische virtuele tour duurt 45-60 minuten.
    - q: Is de fabriek de daadwerkelijke fabrikant of een handelsmaatschappij?
      a: Paddle Board Overstock is de feitelijke fabrikant. Wij exploiteren de fabriek in Laixi, Qingdao. Bedrijfslicentie, productieomvang en fysieke productie zijn allemaal verifieerbaar tijdens de audit.
    - q: Welke kwaliteitsrecords kan ik beoordelen?
      a: Inkomende materiaalinspectierecords, QC-controlepunten tijdens het proces, druktestlogboeken, 100-punts eindinspectiechecklists, non-conformiteitsrapporten, records met corrigerende maatregelen en traceerbaarheidsrecords per romp. Alles onderhouden volgens de ISO 9001-vereisten.
