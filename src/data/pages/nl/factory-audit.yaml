content_audit_evidence:
  tagline: Verificatie bewijs
  title: Auditbewijs<br />U kunt dit ter plaatse verifiëren
  subtitle: Tijdens fabrieksbezoeken kunnen klanten in elke productieruimte specifiek bewijsmateriaal verifiëren. Hier leest u waar u op moet letten – en wat wij voor elke audit voorbereiden.
  areas:
    - area: Grondstoffenmagazijn
      what_to_verify: Zijn materialen stabiel? Is er sprake van batchmenging?
      evidence: Inkomende inspectiegegevens, batchlabels, FIFO-opslag, goedkeuringslijst van leveranciers, materiaalcertificaten (PVC, Hypalon, glasvezel, aluminium, lijmen, hardware)
      icon: tabler:building-warehouse
    - area: Tubeproductie
      what_to_verify: Hoe wordt de naadsterkte en luchtdichtheid gegarandeerd?
      evidence: Proceskaarten, bevestiging van het eerste artikel, druktestgegevens per kamer, reparatie- en hertestlogboeken, klepinstallatiegegevens
      icon: tabler:flame
    - area: Rompproductie
      what_to_verify: Hoe wordt de structurele consistentie gecontroleerd?
      evidence: Gecontroleerde procesdocumenten, kwaliteitscontroles, nummering van halffabrikaten, metingen van de gelcoatdikte, verificatie van het lamineerschema
      icon: tabler:layers-subtract
    - area: Montagegebied
      what_to_verify: Hoe wordt voorkomen dat optionele onderdelen verkeerd worden gemonteerd?
      evidence: Stuklijst, werkorders, configuratiechecklists, werkstationinspectiekaarten, koppel- en functionele controles per model
      icon: tabler:tool
    - area: Teststation
      what_to_verify: Hoe bevestigt u dat de boot in orde is vóór aflevering?
      evidence: Testprocedures, instrumentenlijst, kalibratierecords, druktestlogboeken (1,25x / 24-48 uur), functionele testchecklists, gedocumenteerde geslaagd/mislukte criteria
      icon: tabler:gauge
    - area: Niet-conformiteitsgebied
      what_to_verify: Hoe wordt er omgegaan met gebreken?
      evidence: Isolatielabels, NCR-logboeken, analyse van de hoofdoorzaak, goedkeuringsrecords voor herbewerking, CAPA-tracking (Corrective and Preventive Action)
      icon: tabler:alert-triangle
    - area: Magazijn voor afgewerkte goederen
      what_to_verify: Hoe voorkom je misverzending en schade?
      evidence: Etiketten voor eindproducten, records voor het matchen van bestellingen, verpakkingsnormen, inspectiegegevens vóór verzending
      icon: tabler:box
    - area: Reserveonderdelen en after-sales
      what_to_verify: Kunt u after-sales op lange termijn ondersteunen?
      evidence: Gemeenschappelijke lijst met reserveonderdelen, inventarisstrategie, onderdeelnummeringssysteem, documentatie over het garantieproces, onderhoudshandleidingen
      icon: tabler:headset
content_closing_script:
  tagline: Audit op bestelling
  title: Van fabrieksbezoek<br />tot bevestigd project
  subtitle: Een succesvolle audit mag niet eindigen met foto's en een handdruk. Voordat we vertrekken, zorgen we ervoor dat drie commerciële resultaten worden gedocumenteerd.
  items:
    - title: Bevestig de technische configuratie
      description: Maak overeenstemming over het model, de toepassing, de belangrijkste opties, de doelgroep, de geschatte hoeveelheid en het leveringsschema – allemaal gedocumenteerd vóór vertrek.
      icon: tabler:checklist
    - title: Bevestig de volgende stap-documenten
      description: 'Definieer wat Paddle Board Overstock vervolgens biedt: herziene GA, configuratielijst, offerte, documentchecklist, voorbeeldplan of NDA – met specifieke tijdlijnen.'
      icon: tabler:file-plus
    - title: Bevestig de wederzijdse tijdlijn
      description: Herziene configuratie en voorlopige offerte binnen 3 werkdagen. Monster- of uiterlijkbevestiging binnen 7 dagen. Technische beoordeling of inspectie door derden binnen 14 dagen. Datum volgende vergadering en verantwoordelijke partijen vergrendeld.
      icon: tabler:calendar

