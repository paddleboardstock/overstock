hero:
  tagline: Mariene expertise
  title: Decennialange Maritieme Techniek<br />in Elk Board
  subtitle: Paddle Board Overstock combineert diepgaande materiaalkunde, precisiefabricage en testen in de praktijk om boards te produceren die presteren wanneer het ertoe doet.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock maritieme engineering- en R&D-team aan het werk
expertise_materials:
  tagline: Materiaalkunde
  title: De Juiste Materiaalkeuze<br />voor Elke Toepassing
  subtitle: We werken met drie kernmaterialen — elk geselecteerd voor specifieke gebruikstoepassingen en prestatie-eisen.
  columns: 3
  items:
    - title: Maritieme kwaliteit PVC
      description: 1100 denier PVC stof — ons meest veelzijdige materiaal. UV-gestabiliseerd, slijtvast en beproefd. Ideaal voor SUP boards waar gewicht, stijfheid en kostenefficiëntie belangrijk zijn.
      icon: tabler:droplet
    - title: Drop-Stitch-kern
      description: Duizenden polyesterdraden verbinden de boven- en onderlaag van de stof, waardoor hoge druk inflatie (15 PSI) mogelijk is voor een stijve, stabiele rit die toch opgerold in een rugzak kan worden meegenomen.
      icon: tabler:building-arch
    - title: EVA Deck Foam
      description: Gegroefde, hoogdichte EVA foam biedt grip over de volledige lengte, demping bij vallen, en een canvas voor onze kenmerkende art-series decks.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Productiemogelijkheden
  title: Precisiefabricage<br />bij Elke Stap
  subtitle: Onze faciliteit van 12.000 m² is uitgerust met gespecialiseerde machines voor elke productiefase.
  columns: 2
  items:
    - title: CNC Snijden
      description: Computer-gestuurd snijden zorgt voor precieze, herhaalbare stofpanelen met minimale verspilling. Elk stuk past exact zoals ontworpen.
      icon: tabler:cpu
    - title: Hoogfrequent Lassen
      description: Industriële HF-lassen creëren naden die sterker zijn dan het basismateriaal. Consistente temperatuur- en drukregeling zorgt voor luchtdichte afdichtingen bij elke productieronde.
      icon: tabler:bolt
    - title: Drop Stitch Kernassemblage
      description: Duizenden polyesterdraden verbinden de boven- en onderlaag van de stof, waardoor hoge druk inflatie (15-20 PSI) mogelijk is voor stijve, stabiele SUP boards en vloeren.
      icon: tabler:building-arch
    - title: Druk testen
      description: Elk board wordt drukgetest voordat het wordt verzonden, gehouden op 1,25x de nominale druk — als het daar standhoudt, zal het presteren op het water.
      icon: tabler:wind
    - title: Naadsterktetest
      description: Willekeurige monsters uit elke productiebatch ondergaan destructieve naadsterktetests. Resultaten worden vastgelegd en zijn traceerbaar naar specifieke productieruns.
      icon: tabler:files
    - title: Water testen
      description: Elk boardontwerp ondergaat proefvaarten in echt water. Peddelen in realistische kustomstandigheden bevestigt de prestaties, het stuurgedrag en de stabiliteit.
      icon: tabler:ripple
expertise_design:
  tagline: Ontwerp & Engineering
  title: Ontworpen voor echte omstandigheden
  subtitle: Onze ontwerpfilosofie begint met hoe het board gebruikt zal worden — vervolgens bouwen we de engineering rond dat gebruiksscenario.
  items:
    - title: Boardvorm & Omtrek
      description: Lengte, breedte en rocker worden afgestemd op het beoogde gebruik van elk model — langere touringomtrekken voor glijden, bredere planvormen voor stabiliteit en yoga.
    - title: Rails & Stringer-versterking
      description: Versterkte rails en centrale stringers zorgen voor stevigheid en absorberen impact — de plekken waar boards seizoen na seizoen de meeste slijtage ondervinden.
    - title: Deklay-out & Grip
      description: Standgebied, handgreepplaatsing, D-ringmontages en gripzones zijn ontworpen rond echte peddelhoudingen — of het nu gaat om cruisen, vissen of yoga beoefenen.
    - title: Kunst & Kleurseries
      description: Dekkunst, kleurenschema's en accessoire-montages — elke serie is ontworpen om te passen bij een specifieke peddelpersoonlijkheid.
cta:
  title: Heeft u een specifieke toepassing in gedachten?
  subtitle: Ons team kan u helpen het juiste board, de juiste maat en uitrusting te kiezen voor uw peddelstijl.
  actions:
    - variant: primary
      text: Vraag onze ingenieurs
      href: /contact
    - text: Bekijk het productassortiment
      href: /products
