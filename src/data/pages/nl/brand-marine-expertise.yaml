hero:
  tagline: Maritieme expertise
  title: 'Decennia aan maritieme engineering<br />in elke romp'
  subtitle: 'Paddle Board Overstock combineert diepgaande materiaalkunde, precisiefabricage en tests in de praktijk om vaartuigen te bouwen die presteren wanneer het erom gaat.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Marine engineering- en R&D-team van Paddle Board Overstock aan het werk
expertise_materials:
  tagline: Materiaalkunde
  title: 'Het juiste materiaal<br />voor elke toepassing'
  subtitle: 'Wij werken met drie kernmaterialen — elk geselecteerd voor specifieke gebruiksscenario''s en prestatie-eisen.'
  columns: 3
  items:
    - title: Marine-grade PVC
      description: '1100 denier PVC-doek — ons veelzijdigste materiaal. UV-gestabiliseerd, slijtvast en REACH-conform. Ideaal voor recreatieboten, SUP-boards en kajaks waar gewicht en kostenefficiëntie tellen.'
      icon: tabler:droplet
    - title: Hypalon/CSM van premiumkwaliteit
      description: 'Superieure chemische bestendigheid en UV-stabiliteit. Hypalon-boten gaan met de juiste zorg 15-20 jaar mee. Aanbevolen voor commerciële, reddings- en militaire toepassingen waar langetermijnduurzaamheid cruciaal is.'
      icon: tabler:shield
    - title: Polyester & aluminium
      description: 'Diepe-V polyester rompen voor RIB''s en patrouilleboten — golfkervende prestaties onder ruwe omstandigheden. Aluminium rompen voor zware commerciële werkbotsen met maximale sterkte en laadvermogen.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Productiecapaciteiten
  title: 'Precisiefabricage<br />in elke stap'
  subtitle: 'Onze faciliteit van 12.000 m² is uitgerust met gespecialiseerde machines voor elke productiefase.'
  columns: 2
  items:
    - title: CNC-snijwerk
      description: 'Computergestuurd snijden garandeert nauwkeurige, herhaalbare doekpanelen met minimaal afval. Elk onderdeel past exact zoals ontworpen.'
      icon: tabler:cpu
    - title: Hoogfrequent lassen
      description: 'Industrieel HF-lassen creëert naden die sterker zijn dan het basismateriaal. Consistente temperatuur- en drukbeheersing garandeert luchtdichte verbindingen in elke productierun.'
      icon: tabler:bolt
    - title: Drop-stitch kernassemblage
      description: 'Duizenden polyestergarens verbinden de boven- en onderlaag van het doek, waardoor opblazen onder hoge druk (15-20 PSI) mogelijk is voor stijve, stabiele SUP-boards en vloeren.'
      icon: tabler:building-arch
    - title: Druktests
      description: 'Elk opblaasbaar product wordt vóór verzending drukgetest. RIB-buizen worden getest op 1,25x de nominale druk — als het daar standhoudt, presteert het op het water.'
      icon: tabler:wind
    - title: Naadsterktetest
      description: 'Steekproeven uit elke productiebatch ondergaan destructieve naadsterktetests. Resultaten worden vastgelegd en zijn herleidbaar naar specifieke productieruns.'
      icon: tabler:files
    - title: Waterproef
      description: 'Elk RIB-model ondergaat zeeproeven vóór certificering. Praktijktests onder kustomstandigheden valideren prestaties, handling en stabiliteit.'
      icon: tabler:ripple
expertise_design:
  tagline: Ontwerp & engineering
  title: 'Ontworpen voor echte omstandigheden'
  subtitle: 'Onze ontwerpfilosofie begint bij hoe de boot gebruikt zal worden — daarna bouwen we de engineering daaromheen.'
  items:
    - title: Diepe-V rompontwerp
      description: "Onze polyester rompen hebben berekende V-hoeken, geoptimaliseerd voor de lengte en het beoogde gebruik van elk model. Scherpere V voor prestaties in ruw water, vlakkere voor stabiliteit."
    - title: Multikamer-veiligheid
      description: 'Elke boot heeft 3-7 onafhankelijke luchtkamers. Als één compartiment wordt gecompromitteerd, houden de overige kamers de boot drijvend en operationeel.'
    - title: Ergonomische indeling
      description: 'Consolepositie, buishoogte en zitplaatsing zijn ontworpen rond het comfort van de bestuurder bij langdurig gebruik — of het nu patrouillevaren, vissen of transporteren is.'
    - title: Aangepaste configuratie
      description: 'Buskleuren, consoleconfiguratie, brandstofcapaciteit, accessoirebeugels — elk model kan worden aangepast aan specifieke operationele eisen.'
cta:
  title: 'Heeft u een specifieke toepassing in gedachten?'
  subtitle: 'Ons engineeringteam adviseert over materiaalkeuze, ontwerp en productie voor uw project.'
  actions:
    - variant: primary
      text: Vraag het onze ingenieurs
      href: /contact
    - text: Bekijk het productassortiment
      href: /products
