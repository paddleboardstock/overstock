testimonial:
  content: Ik lanceerde mijn SUP-merk zonder enige ervaring in de sector. Het team van Paddle Board Overstock begeleidde mij van de productselectie tot het aangepaste logo-ontwerp en de verpakking. Mijn eerste container arriveerde binnen 11 weken en ik was binnen 3 maanden uitverkocht op Amazon. Ik bestel nu mijn derde container.
  name: Michael Park
  title: Oprichter, Shoreline Paddle Co. — Californië, VS
content_segments:
  tagline: Ondernemersprofielen
  title: Merklancering watersport<br />Per type ondernemer
  subtitle: 'Verschillende oprichters hebben verschillende sterke punten: expertise op het gebied van e-commerce, brancheverbindingen, contentbereik of distributie-infrastructuur. Wij stemmen het OEM/ODM lanceringsprogramma af op uw uitgangspositie en groeiambitie.'
  items:
    - title: Amazon FBA- en e-commerceverkopers
      subtitle: Datagedreven, snel opschalende merkbouwers
      description: Ervaren online verkopers die watersportproducten lanceren op Amazon, Walmart of hun eigen Shopify-winkels. U weet hoe u vermeldingen kunt optimaliseren, PPC kunt beheren en categoriegegevens kunt lezen, maar u hebt een productiepartner nodig die inzicht heeft in de snelheid van e-commerce, retourpercentages en seizoensschommelingen in de vraag.
      features:
        - Verpakking klaar voor de detailhandel, geoptimaliseerd voor FBA-dimensielimieten
        - EAN/UPC-streepjescodegeneratie en aan Amazon conforme documentatie
        - Laag MOQ (2–5 eenheden per SKU voor RIB, 5–10 voor SUP) om de vraag te testen voordat u opschaalt
        - Consolidatie van gemengde containers om de landed cost per eenheid te optimaliseren
    - title: Fitness- en outdoorlevensstijlbeïnvloeders
      subtitle: Publieksgerichte merkmakers
      description: Contentmakers, fitnesscoaches en outdoor-persoonlijkheden met een betrokken publiek dat klaar is om zich in een lifestylemerk te verdiepen. Jij brengt de gemeenschap en het merkverhaal mee; wij zorgen voor de productengineering, compliance, verpakking en logistiek, zodat jij je kunt concentreren op inhoud en conversie.
      features:
        - 'Snelle custom branding: 2-weken monstercyclus met logo + kleuren'
        - Co-gebrande gelimiteerde edities en seizoensgebonden colorway-drops
        - Ondersteuning bij lifestylefotografie en productie van videocontent
        - 'Direct-to-consumer-afhandeling: dropshipping van de fabriek → naar de klant'
    - title: Regionale distributeurs die rechtstreeks naar de consument gaan
      subtitle: B2B-operatoren die hun eigen merk lanceren
      description: Gevestigde distributeurs van maritieme of outdooruitrusting die hun eigen merk willen lanceren naast of in plaats van producten van derden door te verkopen. U beschikt al over een magazijninfrastructuur, logistieke relaties en een klantenbestand. U hebt een fabriekspartner nodig die op grote schaal private label-kwaliteit kan leveren.
      features:
        - Exclusieve productontwerpen voor uw marktgebied
        - Volledige OEM-matrijsontwikkeling voor eigen vormen en specificaties
        - Gelokaliseerde compliance-documentatie (CE, UKCA, USCG) voor uw regio
        - 'Co-gebrande verpakking: merk van de distributeur + Paddle Board Overstock-kwaliteitskeur'
    - title: Eerste merkoprichters
      subtitle: Begeleide end-to-end merkcreatie
      description: Gepassioneerde ondernemers zonder ervaring in de watersportbranche die vanaf nul een merk willen opbouwen. U heeft een partner nodig die u tijdens elke fase bij de hand heeft – van productselectie en naamgeving tot verpakkingsontwerp en logistiek voor de eerste container – met duidelijke tijdlijnen en transparante prijzen.
      features:
        - Consultatieve productselectie uit meer dan 50 bewezen basisontwerpen
        - 'Merkidentiteitspakket: naamgeving, logo, kleurenpalet, ontwerp van de verpakking'
        - Tijdlijn van 60–90 dagen van concept tot eerste zending
        - Toegewijde projectmanager voor first-time merkbezitters
