hero:
  tagline: Hotels, resorts en gastvrijheid
  title: Premium Ervaringen aan het Water<br />Voor Hotels, Resorts & Jachtclubs
  subtitle: Complete watersportprogramma's voor strandhotels, privé-eilandresorts, strandclubs en jachtclubs — van gastenuitrusting en veiligheidssystemen tot personeelstraining en programmaontwerp.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock SUP boards voor activiteiten aan het water bij resorts
direct_answer: Paddle Board Overstock werkt samen met hotels, resorts, privé-eilanden, strandclubs en jachtclubs wereldwijd om premium ervaringen aan het water te creëren. Onze oplossingen omvatten SUP verhuurvloten, uitrusting voor begeleide tochten, complete veiligheidssystemen en merkuitrusting voor elk pand. Elk stuk uitrusting kan worden voorzien van het logo en het kleurenschema van uw accommodatie. We bieden ook personeelstraining, advies bij programmaontwerp en planning voor vervanging van de vloot om consistente kwaliteit over de seizoenen te waarborgen.
solution_offerings:
  - title: Resort standaardpakket
    subtitle: Voor kleine tot middelgrote panden (50–150 kamers)
    badge: Popular
