testimonial:
  content: Paddle Board Overstock heeft ons gehele strandactiviteitenprogramma over drie resortlocaties ontworpen en uitgerust. 120 SUPs, veiligheidsinfrastructuur en personeelstraining — allemaal geleverd in één zending. De deelname van onze gasten aan wateractiviteiten steeg met 60% in het eerste seizoen.
  name: Sophie Laurent
  title: Directeur gastervaring, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Resortprofielen
  title: Waterfront Hospitality Solutions<br />Per Type Eigendom
  subtitle: Elk resort heeft een uniek gastenprofiel, een unieke activiteitenmix en een uniek operationeel ritme – van boetiek-eco-lodges tot uitgestrekte luxe resorts aan het strand. Wij ontwerpen watersportprogramma's die aansluiten bij de vastgoedklasse en de verwachtingen van de gasten.
  items:
    - title: Luxe resorts aan het strand
      subtitle: VIP-transfers, wateractiviteiten, premium gastervaring
      description: 'Luxe accommodaties aan het strand – Four Seasons, Aman en vergelijkbare luxegroepen – waar watersport een belangrijke voorziening is voor gasten, wat leidt tot tevredenheidsscores en bijkomende inkomsten. De vloot moet er eersteklas uitzien, variatie bieden voor alle leeftijdsgroepen en vaardigheidsniveaus, en naadloos integreren met de bestaande conciërge- en boekingssystemen van het resort. De verwachtingen voor het optreden van gasten zijn extreem hoog: de staat en presentatie van de apparatuur zijn rechtstreeks van invloed op de vijfsterrenrecensies.'
      features:
        - Premium merkgebonden vloot van SUPs in bijpassende resortkleuren
        - 'Klaar voor gasten-presentatie: bijpassende resortkleuren, logomerking, getoonde uitrusting'
        - Signatuur kunstserie boards voor premium gastenervaringen en fotomomenten
        - 'Geïntegreerde veiligheidsinfrastructuur: boeienlijnen, reddersstations, AED'
        - 'Omzetbeheer: dynamische prijsmodellen, upsell-training, pakketbundeling'
    - title: Privé-eilandresorts
      subtitle: Rustige, zelfvoorzienende watersportactiviteiten voor gasten
      description: "Privé-eilandresorts opereren op afgelegen locaties waar logistiek complex is en elke levering telt. Watersportactiviteiten voor gasten moeten zelfvoorzienend zijn: uitrusting die compact kan worden opgeborgen, op verzoek kan worden opgeblazen, minimale onderhoudsvereisten heeft en er prachtig uitziet bij aankomst van de gasten. We plannen vlotenprogramma's rond watervliegtuig- en zeevrachtvensters, en onze duurzame constructie houdt de uitrusting gasten-klaar gedurende lange seizoenen zonder ondersteuning vanaf het vasteland."
      features:
        - Compacte opblaasbare vloot — efficiënt verscheept en opgeslagen op afgelegen eilanden
        - Commerciële PVC constructie voor gebruik door gasten gedurende meerdere seizoenen
        - Gemakkelijk onderhoud ter plaatse met inbegrepen reparatiesets en videohandleiding
        - Aangepaste resortbranding die past bij de esthetiek van het eiland
    - title: Lakeside- en ecoresorts
      subtitle: In de natuur geïntegreerde gastervaringen
      description: Hotelpanden aan meren, eco-lodges en natuurretraites die rustige watersportactiviteiten met lage impact aanbieden die het natuurlijke milieu aanvullen. Uitrusting moet waar mogelijk niet-gemotoriseerd zijn, gemakkelijk op te bergen bij beperkte ruimte en stil in gebruik om de omgevingservaring voor alle gasten te behouden.
      features:
        - Niet-gemotoriseerde SUP vloot in door de natuur geïnspireerde kunstserie
        - Stille elektrische pompstations voor op verzoek gebruik door gasten
        - Milieuvriendelijke materialen en verpakking in lijn met duurzaamheidsbranding
        - Opslagrekken en organisatie van steigers inbegrepen
    - title: Strandclubs
      subtitle: Gastentertainment en sfeer aan het water
      description: Beachclubs opereren in een energieke en visueel georiënteerde omgeving waarbij uitrusting onderdeel van de sfeer is. Ze hebben stijlvolle paddleboards nodig voor gastentertainment, SUP verhuur voor strandactiviteiten, en uitrusting die er net zo goed uitziet als de locatie zelf. De vloot moet eenvoudig te bedienen zijn, dagelijks gebruik door gasten van verschillende vaardigheidsniveaus kunnen weerstaan, en snel inzetbaar zijn tijdens piekuren.
      features:
        - Signature kunst-serie SUPs die ook dienstdoet als decoratie van de locatie
        - Verhuurklare SUP vloot voor gastentertainment
        - Aangepaste kleur en branding passend bij de visuele identiteit van de beachclub
        - Snelle lanceer- en terughaalsystemen voor operaties met hoge omloopsnelheid
        - UV-bestendige constructie voor dagelijks contact met zout water
    - title: Privéledenclubs en jachtclubs
      subtitle: Watersport voor leden en exclusieve paddleprogramma's
      description: Privéclubs waarbij watersport een lidmaatschapvoordeel is in plaats van een inkomstenbron. Uitrusting moet voldoen aan hogere esthetische standaarden, op aanvraag beschikbaar zijn voor leden, en minimaal toezicht van personeel vereisen. Jachthavens gebruiken gebrande SUP vloten voor recreatie van leden rond de haven. Opslag en onderhoud moeten onzichtbaar zijn voor leden.
      features:
        - Premium gebrande SUP vloot voor watersport voor leden
        - 'Premium uitrusting: EVA decks, aangepaste kleuren voor leden, gebrande bekleding'
        - Zelfbedieningssysteem voor uitchecken voor toegang door leden zonder personeel
        - Opslag buiten seizoen en jaarlijks vernieuwingsprogramma
    - title: Op avontuur en activiteit gerichte hotels
      subtitle: Rondleidingen, SUP yoga, snorkelexcursies, groepsactiviteiten
      description: Accommodaties die zichzelf positioneren als avontuurlijke bestemmingen - bieden rondleidingen, SUP-yoga, zonsondergangpeddels, snorkelexcursies en groepsactiviteiten. De vloot moet zowel gratis verhuur als begeleide programmamodellen ondersteunen, met apparatuur die naadloos overgaat tussen zelfgebruik door gasten en rondleidingen onder leiding van een instructeur. Deze accommodaties hebben duurzame apparatuur nodig voor hoogfrequent verkeer, met eenvoudige schoonmaak tussen gastengroepen.
      features:
        - Veelzijdige gemengde vloot die huur + rondleidingmodellen ondersteunt
        - Extra-stabiele SUP platforms voor groepsactiviteiten
        - 'Gidsapparatuur: instructieborden, droge dozen, waterdichte communicatie'
        - 'Seizoensgebonden wisseling van apparatuur: zomervloot → winteropslagprogramma'
        - Duurzame constructie geschikt voor dagelijks gebruik door gasten met minimaal onderhoud
