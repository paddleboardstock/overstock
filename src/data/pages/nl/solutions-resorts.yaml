      - title: Gastervaring
        description: Incheckkiosk, uitrustingsdisplay, kleedhuisjes, opslag aan het strand
      - title: Inkomstenprogramma
        description: Dynamische prijsgids, upsell-training, pakketbundelingsstrategieën
      - title: Seizoensgebonden ondersteuning
