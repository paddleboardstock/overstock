testimonial:
  content: Paddle Board Overstock ontwierp en rustte ons volledige strandactiviteitenprogramma uit in drie resorts. 80 SUP's, 40 kajaks, veiligheidsinfrastructuur en training van het personeel - alles geleverd in één zending. Onze gastendeelname aan wateractiviteiten is in het eerste seizoen met 60% gestegen.
  name: Sophie Laurent
  title: Directeur gastervaring, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Resortprofielen
  title: Waterfront Hospitality-oplossingen<br />Op vastgoedtype
  subtitle: Elk resort heeft een uniek gastenprofiel, een unieke activiteitenmix en een uniek operationeel ritme – van boetiek-eco-lodges tot uitgestrekte luxe resorts aan het strand. Wij ontwerpen watersportprogramma's die aansluiten bij de vastgoedklasse en de verwachtingen van de gasten.
  items:
    - title: Luxe resorts aan het strand
      subtitle: VIP-transfers, wateractiviteiten, premium gastervaring
      description: 'Luxe accommodaties aan het strand – Four Seasons, Aman en vergelijkbare luxegroepen – waar watersport een belangrijke voorziening is voor gasten, wat leidt tot tevredenheidsscores en bijkomende inkomsten. De vloot moet er eersteklas uitzien, variatie bieden voor alle leeftijdsgroepen en vaardigheidsniveaus, en naadloos integreren met de bestaande conciërge- en boekingssystemen van het resort. De verwachtingen voor het optreden van gasten zijn extreem hoog: de staat en presentatie van de apparatuur zijn rechtstreeks van invloed op de vijfsterrenrecensies.'
      features:
        - 'Premium merkvloot: SUP''s, kajaks, waterfietsen en kleine tender-RIB''s'
        - 'Gastenklare presentatie: kleuren passend bij het resort, logobranding, in scene gezet uitrustingsdisplay'
        - Kleine luxe RIB voor VIP-gastenvervoer met op maat gemaakte bekleding en kleurafstemming
        - 'Geïntegreerde veiligheidsinfrastructuur: boeienlijnen, badmeesterposten, AED'
        - 'Omzetbeheer: templates voor dynamische prijzen, upsell-training, pakketbundeling'
    - title: Privé-eilandresorts
      subtitle: 'Gastenvervoer onder alle weersomstandigheden: geen stilstand, absolute betrouwbaarheid'
      description: Privé-eilandresorts opereren op afgelegen locaties waar de boot de enige verbinding met het vasteland is. Dagelijkse gastentransfers, bevoorradingsruns en medische noodevacuaties zijn afhankelijk van één enkel schip. Elke uitvaltijd heeft een directe invloed op de gastervaring en de resortactiviteiten. Deze operators hebben een boot nodig die onder alle weersomstandigheden betrouwbaar vaart, minimaal onderhoud vereist en back-upsystemen heeft voor bedrijfskritische betrouwbaarheid. De boot moet er ook prachtig uitzien als gasten op het eiland aankomen.
      features:
        - RIB-configuratie voor alle weersomstandigheden met volledige weersbescherming en extra sterke tubes
        - Tweemotorige of reservemotorvoorziening voor bedrijfsvoering zonder stilstand
        - Hypalon-constructie van commerciële kwaliteit voor 5-8 jaar levensduur in dienst op afgelegen locaties
        - Onderhoudsvriendelijk ontwerp met toegankelijke componenten voor onderhoud ter plaatse
        - Eigen resortbranding en premium bekleding passend bij de eilandesthetiek
    - title: Lakeside- en ecoresorts
      subtitle: In de natuur geïntegreerde gastervaringen
      description: Accommodaties aan het meer, eco-lodges en natuurretraites die rustige wateractiviteiten met weinig impact bieden die een aanvulling vormen op de natuurlijke omgeving. Apparatuur moet waar mogelijk niet-gemotoriseerd zijn, gemakkelijk op te bergen in botenhuizen met beperkte ruimte en stil in gebruik om de omgevingservaring voor alle gasten te behouden.
      features:
        - 'Niet-gemotoriseerde vloot: SUP''s, kajaks, kano''s en waterfietsen'
        - Stille opblaasstations met elektrische pomp voor gebruik door gasten op afroep
        - Milieuvriendelijke materialen en verpakkingen afgestemd op duurzaamheidsbranding
        - Inclusief opslagrekken en organisatiesystemen voor botenhuizen
    - title: Strandclubs
      subtitle: Gastentransfers, entertainment, kleine luxe RIB's
      description: "Strandclubs exploiteren een energieke, visueel gerichte omgeving waar apparatuur deel uitmaakt van de atmosfeer. Ze hebben kleine luxe RIB's nodig voor het vervoer van gasten van nabijgelegen hotels of havens, en waterspeelgoed voor het vermaak van de gasten: jetski-slepen, opblaasbare glijbanen en paddleboards. De vloot moet er stijlvol uitzien, eenvoudig te bedienen zijn en bestand zijn tegen dagelijks gebruik door gasten met verschillende vaardigheidsniveaus. Opslag en snelle implementatie zijn van cruciaal belang tijdens piekuren."
      features:
        - Compacte luxe RIB (3,3-4,3 m) voor gastenvervoer en tenderdienst
        - 'Waterspeelgoed: sleepbare opblaasartikelen, SUP-boards, kajaks voor het vermaak van gasten'
        - Eigen kleur en branding afgestemd op de visuele identiteit van de strandclub
        - Systemen voor snel te water laten en ophalen voor operaties met een hoog verloop
        - Duurzame Hypalon-constructie voor dagelijkse blootstelling aan zout water en UV
    - title: Privéledenclubs en jachtclubs
      subtitle: Havenvervoer, ledentenders, exclusieve watersporten
      description: Privéclubs waar watersport en bootvervoer eerder een ledenvoordeel dan een inkomstenbron zijn. Apparatuur moet aan hogere esthetische normen voldoen, op aanvraag beschikbaar zijn voor leden en minimaal toezicht van het personeel vereisen. Jachtclubs in jachthavens hebben met name aanbestedingen nodig voor havenvervoer – het verplaatsen van leden tussen kade, ligplaats en wal. Opslag en onderhoud moeten onzichtbaar zijn voor leden.
      features:
        - Hoogwaardige tender-RIB's voor havenvervoer en ledentransferservice
        - 'Premium uitrusting: EVA-decks, aangepaste ledenkleuren, bekleding in huisstijl'
        - Zelfservice-leensysteem voor ledentoegang zonder personeel
        - Opslag buiten het seizoen en jaarlijks vernieuwingsprogramma
    - title: Op avontuur en activiteit gerichte hotels
      subtitle: Rondleidingen, SUP yoga, snorkelexcursies, groepsactiviteiten
      description: Accommodaties die zichzelf positioneren als avontuurlijke bestemmingen - bieden rondleidingen, SUP-yoga, zonsondergangpeddels, snorkelexcursies en groepsactiviteiten. De vloot moet zowel gratis verhuur als begeleide programmamodellen ondersteunen, met apparatuur die naadloos overgaat tussen zelfgebruik door gasten en rondleidingen onder leiding van een instructeur. Deze accommodaties hebben duurzame apparatuur nodig voor hoogfrequent verkeer, met eenvoudige schoonmaak tussen gastengroepen.
      features:
        - Veelzijdige gemengde vloot die modellen voor verhuur + geleide tochten ondersteunt
        - Tandemkajaks en extra stabiele SUP-platforms voor groepsactiviteiten
        - 'Gidsenuitrusting: instructieboards, droogboxen, waterdichte communicatiemiddelen'
        - 'Seizoensgebonden rotatie van uitrusting: zomervloot → winteropslagprogramma'
        - Duurzame constructie geschikt voor dagelijks gebruik door gasten met minimaal onderhoud
