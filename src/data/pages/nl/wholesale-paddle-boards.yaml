hero:
  tagline: SUP Groothandelsraden
  title: Groothandel opblaasbare paddleboards<br />voor kleine bedrijven
  subtitle: Gloednieuwe overbodige SUP borden in kleine bedrijfsvriendelijke hoeveelheden. Bestel 5–20 borden, mix modellen in één zending en kies voor express lucht- of zeevracht naar 50+ landen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Groothandel opblaasbare SUP planken vanaf Paddle Board Overstock verzending
direct_answer: Paddle Board Overstock levert gloednieuwe overtollige opblaasbare SUP boards aan kleine retailers wereldwijd. Er is geen grote minimumbestelling — een groothandelsbestelling begint bij slechts 5 boards, en je kunt elk op voorraad zijnd model in één bestelling combineren. Boards worden verzonden vanaf onze basis in Weihai, China, per express luchtvracht (1–3 boards, monsters of spoedige herbevoorradingen) of geconsolideerd zeevracht (5–20 board-bestellingen van retailers). Elke board wordt voor verzending 100% onder druk getest en wordt gedekt door onze 2-jarige SUP garantie.
tldr_points:
  - 'Laag MOQ: groothandelsbestellingen beginnen bij 5 borden — bedoeld voor kleine winkels, niet voor containerladingen'
  - 'Gemengde modelorders: combineer alle op voorraad SUP bestaande modellen in één zending'
  - 'Twee verzendopties: express luchtvracht voor 1–3 borden, zeevracht voor 5–20 bordbestellingen'
  - 'Gloednieuwe voorraad: 100% onder druktest, slagingspercentage voor de eindinspectie van 99,3%, 2 jaar SUP garantie'
why_retailers:
  title: Waarom kleine retailers kiezen voor SUP overvoorraadborden
  subtitle: Je hebt geen magazijn- of containerbudget nodig om groothandelsprijzen te kopen.
  items:
    - title: Kleine bedrijfsvriendelijke hoeveelheden
      description: Traditionele groothandel vraagt honderden eenheden per bestelling. Ons overstockmodel is ontworpen voor onafhankelijke winkels — begin met 5 boards en laat je bestelling groeien naarmate je winkel groeit.
    - title: Echte groothandelsprijzen zonder de volumeverplichting
      description: Omdat we overtollige voorraad verkopen — overproductie en zorgvuldig ingekochte voorraad van geselecteerde partnerfabrieken — krijgt u volume-niveau eenheidsprijzen zonder het volumerisico.
    - title: Mix modellen om aan je klanten te voldoen
      description: Strandwinkels, meeruitrusters en stadswinkels bedienen verschillende peddelaars. Combineer allround-, touring- en surfmodellen SUP in één bestelling zodat jouw plank aansluit bij jouw lokale vraag.
    - title: Gloednieuw, nooit gebruikt
      description: Elke plank in onze overvoorraadvoorraad is gloednieuw en ongebruikt — geen tweede kaart, geen retouren. Elke plank wordt 100% onder druk getest voordat hij het magazijn verlaat.
    - title: Snelle, flexibele internationale verzending
      description: Express luchtvracht levert snel 1–3 borden of voorbeeldbestellingen bij je deur; Consolidated Sea Freight houdt de kosten per bord laag op 5–20 kaarten van retailers.
    - title: Gegarandeerd door een echte garantie
      description: Groothandel betekent niet dat je niet ondersteund bent. SUP Elke board heeft onze 2-jarige SUP garantie, dezelfde dekking die we elke klant in 50 landen bieden+.
pricing_section:
  tagline: Groothandelsprijzen
  title: Eenvoudige, transparante groothandelsprijzen
  subtitle: De prijs wordt per bestelling geofferd op basis van de modellen, hoeveelheden en verzendmethode die je kiest. Geen verborgen kosten — de offerte die je ontvangt is de prijs die je betaalt.
  points:
    - title: Gelaagd op hoeveelheid
      description: De eenhedenprijzen dalen naarmate de ordergrootte toeneemt. Een bestelling van 10 kaarten is per bord beter dan een bestelling van 5 borden; een bestelling van 20 kaarten is nog beter.
    - title: Gemengde modellen tellen mee voor één totaal
      description: Uw kortingeniveau is gebaseerd op het totale aantal borden in de bestelling — niet per model. Het mixen van 4 verschillende modellen × 3 borden elk telt als een bestelling van 12 borden.
    - title: Geciteerd met verzendopties
      description: Elke offerte bevat zowel expres- als zeevrachtopties met geschatte doorlooptijden, zodat u de snelheid- tot kostensbalans kunt kiezen die past bij uw aanvultijdlijn.
    - title: Geen account of lidmaatschap vereist
      description: Er is geen groothandelsclub om lid van te worden en geen jaarlijkse bijdrage. Vraag een offerte aan, bevestig de bestelling en wij verzenden.
inventory_section:
  tagline: Huidige voorraad
  title: Beschikbare producten en huidige voorraad
  subtitle: Alle 11 onderstaande producten zijn momenteel overtollige voorraad. De staat is gloednieuw; de voorraadniveaus veranderen wekelijks, dus bevestig de beschikbaarheid in uw offerteaanvraag.
  table_labels:
    product: Model
    condition: Voorwaarde
    price: Detailprijs
    action: Contacteer Ons
    condition_value: Nieuw
    note: De weergegeven verkoopprijs is ter referentie. De groothandelprijs per eenheid wordt per bestelling opgegeven en is lager dan de detailhandelsprijs.
who_section:
  tagline: Wie wij bevoorraden
  title: Gebouwd voor onafhankelijke watersportbedrijven
  items:
    - title: Strand- en surfwinkels
      description: Kleine kustwinkeliers die 5–15 boards per seizoen nodig hebben, gemengd tussen allround modellen voor toeristen en surfboards voor de lokale bevolking.
    - title: Online verkopers
      description: E-commerce winkels en marktplaatsverkopers testen de SUP categorie zonder zich te verbinden aan een volledige container van één model.
    - title: Verhuurfleets & Scholen
      description: Verhuuractiviteiten en SUP scholen die hun wagenpark aanvullen — duurzame borden, gemengde modellen om verschillende klantgroottes te bedienen, en garantieondersteuning.
    - title: Resorts & touroperators
      description: Hotels, eilandresorts en touroperators voegen SUP toe aan hun activiteitenaanbod met kleine initiële vloten en gemakkelijke seizoensgebonden bevoorrading.
how_to_order:
  tagline: Hoe het werkt
  title: Hoe een groothandelsbestelling te plaatsen
  steps:
    - title: Bekijk de voorraad
      description: Bekijk de 11 op voorraad zijnde modellen hierboven of gebruik de selector voor gemengde modellen om een combinatie samen te stellen die bij uw klanten past.
    - title: Vraag een offerte aan
      description: Stuur ons de modellen, geschatte hoeveelheden, uw land en de gewenste verzendsnelheid via het onderstaande aanvraagformulier. Wij antwoorden met eenheidsprijzen en verzendopties.
    - title: Bevestigen en Betalen
      description: Keer de definitieve offerte goed — modellen, aantallen, verzendmethode en totaalbedrag. Betalingsvoorwaarden worden bevestigd bij het offerteproces.
    - title: Wij Testen, Verpakken en Verzenden
      description: Elke plank wordt 100% op druk getest, verpakt met een volledige accessoire-set en vanuit Weihai verzonden. U ontvangt tracking voor de volledige reis.
