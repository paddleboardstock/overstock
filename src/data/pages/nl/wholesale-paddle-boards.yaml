faq_section:
  title: Groothandel FAQ
  items:
    - q: Wat is de minimale groothandelsbestelling?
      a: Vijf planken. Ons overstockmodel is gebouwd voor kleine detailhandelaars — u hoeft geen container te vullen om groothandelsprijzen te krijgen.
    - q: Kan ik verschillende SUP modellen combineren in één groothandelsbestelling?
      a: Ja. Bestellingen met gemengde modellen zijn een van de grootste voordelen van het kopen van overstockvoorraad — combineer alle modellen die op voorraad zijn in één zending, en het totale aantal planken bepaalt uw prijsklasse. Zie onze pagina over groothandel met gemengde modellen voor details.
    - q: Zijn de planken gloednieuw?
      a: Ja. Elk bord is gloednieuw, ongebruikt overtollig voorraad — nooit tweedehands, opgeknapt of geretourneerd door klanten. Elk bord wordt voor verzending 100% drukgetest.
    - q: Hoeveel goedkoper is groothandel dan detailhandel?
      a: Grosprijs per eenheid wordt per bestelling opgegeven op basis van modellen en hoeveelheden, en ligt aanzienlijk lager dan de hierboven vermelde detailhandelsprijzen. Vraag een offerte aan voor uw gewenste mix en wij zullen deze precies prijzen.
    - q: Welke verzendmethode moet ik kiezen?
      a: Express luchtvracht is geschikt voor 1–3 boards, monsters en dringende aanvullingen. Geconsolideerde zeevracht is de economische keuze voor retailerbestellingen van 5–20 boards. We geven bij elke aanvraag een offerte voor beide opties.
    - q: Welke garantie hebben groothandelsborden?
      a: Dezelfde 2-jarige SUP garantie die we aan elke klant geven, in elk van de 50+ landen waar we naartoe verzenden.
    - q: Verzenden jullie naar mijn land?
      a: We verzenden momenteel naar meer dan 50 landen, met regionale gidsen voor Latijns-Amerika, Zuidoost-Azië, Afrika, het Midden-Oosten en belangrijke markten zoals Mexico, Brazilië, de Filippijnen, Indonesië, Thailand, Zuid-Afrika, Kenia en de VAE. Vraag het in uw offerteaanvraag en wij zullen de huidige service naar uw adres bevestigen.
