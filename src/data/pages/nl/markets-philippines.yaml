hero:
  tagline: Filipijnen
  title: SUP Groothandelsboards voor<br />Filipijnse bedrijven
  subtitle: Island resorts, beach clubs en peddelexploitanten van El Nido en Siargao tot Boracay — gloednieuwe overbodige boards van 5 units, gemengde modellen, verzonden uit China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Overstock-borden voor Filipijnse eilandresorts en peddelexploitanten
direct_answer: Paddle Board Overstock levert gloednieuwe overtollige opblaasbare SUP boards aan Filipijnse bedrijven — eilandresorts in Palawan en Siargao, strandclubs in Boracay en Cebu, verhuur- en touroperators, en kleine retailers. Groothandelsbestellingen beginnen bij 5 boards met gemengde modellen in één zending, verzonden vanuit Weihai, China per express luchtvracht of geconsolideerde zeevracht. Elke board wordt 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Groothandel vanaf 5 boards — gemengde modellen, geprijsd op totale hoeveelheid
  - Dienst aan eilandresorts en strandclubs in de Filipijnse archipel
  - Expresslucht of geconsolideerde zeevracht vanuit Weihai, China
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De Filipijnse SUP Markt
  paragraphs:
    - Met meer dan zevenduizend eilanden is de Filipijnen gebouwd voor stand-up paddle. De lagunes van El Nido en Coron, de relaxte surf- en eilandscene van Siargao, Boracay's beach club-energie en de duik- en watersporteconomie van Cebu zorgen allemaal voor een constante vraag — van toeristen die bij zonsopgang een badje maken in een kalkstenen lagune tot lokale bewoners die SUP fitness- en yogagemeenschappen bouwen in Manilla en daarbuiten.
    - The buyers are typically resort and tour operators: Island Resorts die een gastactiviteit toevoegen die geen brandstof, motor en geen vergunning nodig heeft; island-hopping touroperators die hun aanbod uitbreiden; en kleine winkels die de binnenlandse peddelgemeenschap bedienen. De bestellingen zijn klein — 5–20 boards — en worden gemixt tussen stabiele allround boards voor beginners en enkele premium edities voor het resort-front-uiterlijk.
  customer_types:
    - title: Eilandresorts
      description: Resorts in Palawan, Siargao en Boracay voegen SUP gastprogramma's toe met compacte gemengde vloten.
    - title: Touroperators
      description: Eilandhopper- en lagunetouroperators voegen peddelstops toe aan hun reisroutes.
    - title: Lokale winkels en scholen
      description: Stedelijke scholen en winkels bedienen de groeiende Filipijnse peddel SUP - en yogagemeenschap.
shipping_section:
  title: Schip naar de Filipijnen
  paragraphs:
    - Bestellingen worden verzonden vanuit Weihai, China. Express luchtvracht vervoert monsters en 1–3 boardorders snel naar Manilla en Cebu; Consolidated Sea Freight bedient 5–20 board-groothandelsbestellingen via Manilla en andere Filipijnse havens. Transitschattingen voor uw bestemming — metro Manilla of provinciaal — zijn opgenomen in uw offerte.
    - Wij leveren de benodigde commerciële facturatie en verpakkingslijst, met de juiste HS-codes en opgegeven waarden. Invoerrechten en belastingen zijn door de importeur verschuldigd volgens de Filipijnse regels.
  customs_note: Voor provinciale bestemmingen wordt de uiteindelijke levering vanuit de haven of luchthaven vermeld als onderdeel van de deur-tot-deur schatting. Bevestig de huidige invoerheffing voor sportuitrusting bij uw makelaar; wij leveren volledige documentatie.
faq_section:
  title: Filipijnen FAQ
  items:
    - q: Hoe lang duurt het verzenden naar de Filipijnen?
      a: Het hangt af van de methode. Express luchtvracht naar Manilla of Cebu is de snelste optie voor monsters en 1–3 boardorders; Consolidated Sea Freight past bij 5–20 board groothandelsbestellingen en wordt geciteerd met een transitvenster voor uw haven. Beide schattingen worden in uw offerte gespecificeerd voordat u zich verbindt.
    - q: Kunnen besturen provinciale eilanden zoals Palawan of Siargao bereiken?
      a: Ja — levering aan huis naar provinciale bestemmingen wordt opgegeven als onderdeel van de vrachtkostenraming, met gebruik van verdere binnenlandse logistiek vanaf de aankomsthaven of luchthaven. Let op de ramingen en opties in uw aanvraag en wij zullen het specifiek prijzen.
    - q: Hoe ziet een startersvloot van een resort eruit?
      a: 'Gewoonlijk 5–10 boards: stabiele allroundmodellen voor gastlessen en vrij peddelen, plus één of twee premium kunsteditie voor het strand. Gemengde modellen, één zending, geprijsd op basis van de totale hoeveelheid.'
    - q: Passen de planken bij gebruik in lagunes en rifvlakten?
      a: Ja — rustige, ondiepe, warm-watercondities zijn precies waarvoor allround opblaasbare SUP-boards zijn ontworpen, en de flexibele vin en duurzame drop-stitch-constructie gaan goed om met rifvlakten en strandlandingen.
