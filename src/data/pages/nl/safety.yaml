testing_process_tagline: Ons Testproces
testing_process_title: Hoe Wij Veiligheid Testen
testing_stat_1_desc: Test van werkdrukinflatie — elke kamer wordt opgeblazen tot 1,25x de nominale druk voor een drukvasthouding van 24-48 uur
testing_stat_2_desc: Wateronderdompeltest — elk product wordt 24 uur ondergedompeld om de naadsterkte en de drijfprestaties te verifiëren
testing_stat_3_desc: Elke plank ondergaat verplichte controle van de naadloslating, luchtbehoud en een volledige systeemcheck voordat deze wordt verzonden
