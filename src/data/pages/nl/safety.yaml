certifications:
  - title: CE-certificering (EU 2016/425)
    standard: PBM-Verordening (EU) 2016/425 | EN ISO 12402
    description: Alle Aquafarer-veiligheidsuitrusting voldoet aan de CE-markeringseisen volgens de Europese Verordening Persoonlijke Beschermingsmiddelen. Elk product wordt onafhankelijk getest door TÜV Rheinland, een Europees Notified Body. Onze opblaasboten en RIB's voldoen aan de eisen van categorie C en D van de Richtlijn Recreatievaartuigen 2013/53/EU (RCD).
    body: CE-certificering dekt de essentiële gezondheids- en veiligheidseisen voor persoonlijke drijflichamen en opblaasbare vaartuigen. TÜV Rheinland auditeert onze productiefaciliteit jaarlijks om doorlopende naleving te verifiëren.
  - title: SOLAS — veiligheid van mensenlevens op zee
    standard: SOLAS Hoofdstuk III | LSA-code
    description: De Life Vest Pro voldoet aan de SOLAS-regelgeving voor offshore- en commerciële maritieme operaties. Getest op 24 uur drijfvermogenbehoud, automatische inflatie bij onderdompeling en prestaties bij zeegang tot windkracht 5. Voldoet aan de eisen van Hoofdstuk III voor reddingsvesten op commerciële schepen.
    body: SOLAS-goedkeuring vereist onafhankelijke tests door een notified body voor drijfvermogen, sterkte, zichtbaarheid en automatische activering. Onze Life Vest Pro heeft volledige SOLAS-typegoedkeuring met MED-certificering.
  - title: USCG Type III / Type V
    standard: 46 CFR Deel 160 | USCG-goedkeuring
    description: Geselecteerde Aquafarer-reddingsvesten voldoen aan de classificatie van de United States Coast Guard voor type III (drijfhulp) en type V (speciaal gebruik). Geschikt voor beschutte wateren, kustvaart en commerciële operaties die USCG-goedgekeurde PFD's vereisen.
    body: USCG-goedkeuring vereist tests door een door de kustwacht erkend onafhankelijk laboratorium. Type V-goedkeuring omvat hybride opblaasbare ontwerpen die handmatige of automatische activering vereisen.
  - title: BSCI-sociale naleving
    standard: amfori BSCI Gedragscode
    description: Onze fabriek wordt jaarlijks geauditeerd onder het amfori Business Social Compliance Initiative (BSCI). Dit verifieert ethische arbeidspraktijken, veiligheid op de werkplek, eerlijke werktijden en milieubeheer in onze productiefaciliteit van 12.000 m².
    body: BSCI-naleving is een voorwaarde voor Europese detailhandelaren en importeurs. Onze huidige BSCI-beoordeling is "C" (Goed), geauditeerd door SGS.
  - title: REACH- en RoHS-naleving
    standard: EU REACH-Verordening (EG) 1907/2006 | RoHS-richtlijn 2011/65/EU
    description: Alle PVC-samenstellingen, lijmen en coatings die in Aquafarer-producten worden gebruikt, voldoen aan de EU REACH-regelgeving voor chemische veiligheid en de RoHS-beperkingen voor gevaarlijke stoffen. Veiligheidsinformatiebladen (MSDS) zijn beschikbaar voor elke productlijn.
    body: REACH-naleving garandeert dat er geen beperkte SVHC-stoffen boven drempelwaarden voorkomen. Regelmatige tests door externe laboratoria verifiëren doorlopende naleving voor elke productiebatch.
  - title: ISO 9001:2015 Kwaliteitsmanagement
    standard: ISO 9001:2015 | Gecertificeerd door TÜV Rheinland
    description: Ons kwaliteitsmanagementsysteem is ISO 9001:2015-gecertificeerd door TÜV Rheinland en dekt ontwerp, productie, tests en after-saleservice. Jaarlijkse surveillantaudits zorgen voor continue verbetering en procesbeheersing.
    body: ISO 9001-certificering vereist gedocumenteerd kwaliteitsbeleid, interne audits, managementreviews, corrigerende actieprocedures en traceerbare productieregistraties.
testimonial:
  quote: We hebben veiligheidsuitrusting ingekocht bij meerdere leveranciers in Azië. Aquafarer is de enige fabrikant die vooraf volledige CE-documentatie, SOLAS-certificaten en testrapporten van derden aanleverde — zonder dat we erom vroegen.
  author: Erik Lindström
  title: Veiligheidsverantwoordelijke
  company: Baltic Marine Supply
  location: Finland
content_overpressure:
  tagline: Veiligheid bij overdruk
  title: Beheer van RIB-buizendruk<br />in hete klimaten
  subtitle: De druk in opblaasbare buizen stijgt met de temperatuur. Inzicht in en beheer van overdruk voorkomt schade en garandeert veilig gebruik in tropische en woestijnomgevingen.
  items:
    - title: Boyle overdrukventielen
      description: Aquafarer RIB-buizen zijn uitgerust met overdrukventielen die overmatige druk boven het nominale maximum automatisch afblazen. Voorkomt naadspanning en mogelijke buizenscheuren door zonneverwarming.
      icon: tabler:gauge
    - title: Drukverandering van ochtend tot middag
      description: Een buis opgepompt tot 3,5 PSI bij 20 °C kan 4,5+ PSI bereiken bij zonblootstelling van 40 °C. Pomp in hete klimaten altijd tot de onderkant van het aanbevolen bereik en laat het overdrukventiel de overmatige druk regelen.
      icon: tabler:sun
    - title: Aanbevolen bedrijfsdrukken
      description: 'PVC-buizen: 3,0-3,5 PSI bedrijf, 4,5 PSI max. Hypalon-buizen: 3,5-4,0 PSI bedrijf, 5,0 PSI max. Test altijd op 1,25x nominaal (4,4 PSI voor PVC, 5,0 PSI voor Hypalon) volgens de QC-normen van Aquafarer.'
      icon: tabler:chart-bar
    - title: Best practices bij zonblootstelling
      description: Bewaar RIB's in schaduwrijke gebieden wanneer ze niet in gebruik zijn. Gebruik UV-beschermhoezen bij langdurig aanleggen. Controleer en pas de buizendruk aan vóór en na de piekuren van de zon. Overschrijd nooit de maximale nominale druk.
      icon: tabler:umbrella
    - title: Noodontluchting
      description: Als de buis te hard aanvoelt of het overdrukventiel lucht afblaast, laat dan lucht ontsnappen via de Halkey-Roberts- of militaire ventiel tot de druk terugkeert naar het bedrijfsbereik. Neem altijd een drukmeter mee voor nauwkeurige metingen.
      icon: tabler:alert-circle
