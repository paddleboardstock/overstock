  tagline: Veiligheid
  title: Veiligheidsnormen en certificering
  subtitle: Elk Aquafarer-product ondergaat rigoureuze tests, en 64 CE-gecertificeerde modellen voldoen aan internationale veiligheidsnormen voor recreatief en professioneel gebruik. ISO 9001-gecertificeerde fabriek.
