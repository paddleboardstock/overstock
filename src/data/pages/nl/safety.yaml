testimonial:
  quote: Ik heb het druktestlogboek dat bij mijn board zat gecontroleerd en twee vragen over opblazen in de zomerhitte naar de klantenservice gemaild. Ze gaven dezelfde dag echte cijfers als antwoord. Dat is meer dan welke winkel ooit voor mij heeft gedaan.
  author: Sofia Marchetti
  title: Geverifieerde koper
  company: Kustpeddelaar
  location: Italië
content_overpressure:
  tagline: Druk veiligheid
  title: Board druk<br />Beheer in hete klimaten
  subtitle: De druk van een opblaasbaar board neemt toe met de temperatuur. Het begrijpen en beheren van overdruk beschermt je board en houdt elke sessie veilig.
  items:
    - title: Waarom druk toeneemt
      description: Lucht zet uit door warmte. Een board opgeblazen tot 15 PSI bij 20°C kan oplopen tot 1-2 PSI bij 40°C zon — dezelfde natuurkunde die een board op een koele ochtend tegen de middag steenhard doet aanvoelen.
      icon: tabler:gauge
    - title: Aanbevolen werkdruk
      description: Blazen tot 12-15 PSI, zoals bij het ventiel gedrukt. Het aangegeven bereik balanceert stijfheid, veiligheid en levensduur van de naden — meer is niet beter.
      icon: tabler:chart-bar
    - title: Beste praktijken voor warme klimaten
      description: Blaas op tot het onderste eind van het bereik op hete dagen. Laat wat lucht ontsnappen voor langdurige blootstelling aan de zon en laat een volledig opgeblazen board nooit bakken op het strand.
      icon: tabler:sun
    - title: Zon blootstelling & opslag
      description: Bewaar boards in de schaduw en gedeeltelijk leeg als ze niet gebruikt worden. Gebruik een boardtas voor UV bescherming. Spoel af en droog voordat je oprolt voor opslag.
      icon: tabler:umbrella
    - title: Als het board steenhard aanvoelt
      description: Laat lucht ontsnappen via het ventiel totdat het board weer binnen het aangegeven bereik komt. Draag de meter bij je pomp voor nauwkeurige metingen — een overgeblazen board belast de naden onnodig.
      icon: tabler:alert-circle
