stories:
  tagline: Ontdekkingsreizigers Verhalen
  title: Echte avonturen van echte mensen
  subtitle: Hoor van peddelaars, families en professionals die Paddle Board Overstock-uitrusting op het water gebruiken.
  items:
    - name: Sarah & Mike
      title: SUP Explorer 11-eigenaren, Canada
      content: We namen onze Explorer 11's mee op een weeklange reis door Algonquin Park. Ze gingen prachtig om met draagtochten en meeroversteken. De drop-stitch constructie betekende dat we ze konden oppompen tot 15 PSI en harde-bordprestaties konden krijgen van een opvouwbaar board.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonquin Park, Canada
    - name: Carlos R.
      title: Cheetah Surge-rijder, Spanje
      content: De Cheetah Surge is mijn favoriete keuze voor kustcruisen. Het levendige ontwerp trekt de aandacht op het strand, en de stabiliteit geeft me vertrouwen bij lichte golven. Het vaart prachtig, of ik nu aan het toeren ben of gewoon van de zonsondergang geniet.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Spanje
    - name: Lina & familie
      title: Flowing Lotus-peddelaars, Zweden
      content: Weekend gezinsavonturen op de archipel. De Flowing Lotus is stabiel genoeg zodat mijn dochter erop kan staan terwijl ik peddel. Blaast op in minder dan 10 minuten — geen trailer nodig, gewoon puur gezinsplezier op het water.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholms archipel, Zweden
    - name: Andres D.
      title: Ocean Voyager ontdekkingsreiziger, Filipijnen
      content: Ik gebruik mijn Ocean Voyager voor langeafstandstochtjes langs de kust van Palawan. Na maanden dagelijks gebruik in tropische omstandigheden presteert het board nog steeds als nieuw. De touringvorm snijdt door chop die mindere boards zou stoppen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipijnen
    - name: Emma T.
      title: Tropical Breeze-beginner, Australië
      content: Ik was nog nooit eerder op een SUP geweest. De Tropical Breeze is zo stabiel dat ik me bij mijn eerste poging al zelfverzekerd voelde. Nu peddel ik elk weekend. De leercurve is praktisch nul — en het board ziet er geweldig uit op het water.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australië
