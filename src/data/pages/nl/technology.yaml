  tagline: Technologie
  title: Gebouwd voor prestaties
  subtitle: Elke Paddle Board Overstock plank is ontworpen met precisie materialen en constructiemethoden die getest zijn voor maritieme omgevingen. 12.000 m² R&D-centrum met interne prototyping.
