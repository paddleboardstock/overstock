testimonial:
  quote: Wat Aquafarer onderscheidt is hun materiaalwetenschap. Ze assembleren niet alleen componenten; ze ontwikkelen de PVC verbindingen, lasparameters en structurele lay-out in eigen huis. Die verticale integratie zie je terug in het eindproduct.
  author: David Park
  title: Productontwikkelingsmanager
  company: Bluewater Sports Equipment
  location: Australië
sections:
  - title: Drop-Stitch-kern
    standard: 12-15 PSI werkdruk
    description: Duizenden interne polyesterdraden verbinden de bovenste en onderste lagen, waardoor een stijve structuur ontstaat bij 12-15 PSI. Dit is dezelfde technologie die wordt gebruikt in professionele paddleboards en opblaasbare raceboten. Onze drop-stitch-dichtheid is per model geoptimaliseerd voor de ideale balans tussen stijfheid en gewicht.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Diagram van de drop-stitch-kern
  - title: Maritieme kwaliteit PVC
    standard: Fusion-gelast | UV/zoutwater/slijtage getest
    description: Meerlaags gelamineerd PVC materiaal geschikt voor maritieme omgevingen. Elke laag is gelast in plaats van gelijmd, waardoor delaminatierisico's worden geëlimineerd. Getest op UV-bestendigheid (ASTM G154, 1.000+ uur), zoutwatercorrosie (ISO 9227) en slijtage (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC-laag
  - title: Hypalon Buizen
    standard: CSM rubber | Bestand tegen UV/chemicaliën/extreme temperaturen
    description: Gebruikt op RIB-modellen, biedt Hypalon (CSM) rubber superieure UV- en chemische weerstand vergeleken met standaard PVC. Hypalon buizen behouden hun flexibiliteit bij extreme temperaturen en zijn bestand tegen degradatie door blootstelling aan brandstof en olie. Alle naden worden met de hand gelegd door gecertificeerde technici.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Luchtdekvloer
    standard: Hogedruk opblaasbaar | Vervangt multiplex/aluminium
    description: Opblaasbaar hogedrukvloersysteem ter vervanging van traditionele multiplex- of aluminium lattenvloeren. Vermindert de insteltijd, het totale gewicht en het opslagvolume en biedt tegelijkertijd voldoende stijfheid voor staan, vissen en lopen. Getest om meer dan 200 kg verdeelde belasting te dragen.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Luchtvloer (Air Deck)
