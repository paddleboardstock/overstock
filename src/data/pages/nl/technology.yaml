testimonial:
  quote: Wat mij overtuigde was de constructie. Fusieweldnaden in plaats van lijm, een drop-stitch kern die stevig aanvoelt bij 15 PSI, en geen wiebelen wanneer ik achteruit stap om te draaien. Twee jaar later, nul problemen.
  author: Marta Keller
  title: Geverifieerde koper
  company: Lake touring-peddelaar
  location: Duitsland
sections:
  - title: Drop-Stitch-kern
    standard: 12-15 PSI werkdruk
    description: Duizenden interne polyesterdraden verbinden de boven- en onderlagen, waardoor een rigid structuur ontstaat bij 12-15 PSI. Dit is dezelfde technologie die gebruikt wordt in professionele paddleboards. Onze drop-stitch dichtheid is per model geoptimaliseerd voor de ideale balans tussen stijfheid en gewicht.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Core Diagram
  - title: Maritieme kwaliteit PVC
    standard: Fusion-gelast | UV/zoutwater/slijtage getest
    description: Meerlagig gelamineerde PVC stof, geschikt voor maritieme omgevingen. Elke laag is gefuseerd gelast in plaats van gelijmd, waardoor delaminatierisico's worden geëlimineerd. Getest op UV weerstand (1.000+ uur), zoutwatercorrosie en slijtage.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Laag
  - title: EVA Dek Systeem
    standard: Gripvast, comfortabel, art-serie patronen
    description: Volledig dek EVA schuim biedt grip, demping en het kenmerkende art-serie uiterlijk. Precisiegesneden panelen worden in naadloze patronen gelegd — geen gedrukt grafisch ontwerp dat kan krassen, geen wax nodig.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Dek
  - title: Drie-lagen Rail Systeem
    standard: Fusion gebonden | Overgebouwd op de zone met de hoogste spanning
    description: Railbanden zijn drievoudig gelaagd fusion gebonden en gewikkeld rond de rand van het board — de zone met de hoogste spanning op elk opblaasbaar board. Dit is waar goedkope boards als eerste falen; de onze zijn overgebouwd.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Rail Systeem
