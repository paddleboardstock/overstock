hero:
  tagline: Technologie
  title: Gebouwd voor prestaties
  subtitle: Elk Aquafarer-bord is ontworpen met precisiematerialen en constructiemethoden die zijn getest voor maritieme omgevingen. R&D-centrum van 12.000 m² met interne prototyping.
