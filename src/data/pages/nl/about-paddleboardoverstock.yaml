hero:
  tagline: Over ons
  title: 'Over {SITE}'
  subtitle: Verticaal geïntegreerde fabrikant van watersportuitrusting — van grondstof tot afgewerkte boot

intro:
  - "Paddle Board Overstock is opgericht in 2012 met één missie: watersportuitrusting ontwerpen en produceren die op het water net zo goed presteert als in het kwaliteitsrapport. Wat begon als een werkplaats gericht op SUP-boards, is uitgegroeid tot een 12.000 m² groot geïntegreerd productiebedrijf in de Qingdao Economic Development Zone, waar opblaasbare boten, RIB's, kajaks, SUP-boards, veiligheidsuitrusting en accessoires worden geproduceerd voor klanten in meer dan 50 landen."
  - Vandaag de dag opereert Paddle Board Overstock als een fabrieksmerk — we ontwerpen, engineeren, maken prototypes, produceren en testen alles onder één dak. Deze verticale integratie geeft ons directe controle over materiaalkeuze, afwerkingskwaliteit en levertijden. Elke boot wordt gebouwd door onze mensen, op onze apparatuur, volgens onze normen.
  - "We bedienen recreatieve gebruikers, commerciële operators, overheidsinstanties en merkpartners wereldwijd. Onze OEM- en ODM-programma's helpen bedrijven hun eigen productlijnen te lanceren zonder te investeren in fabrieksinfrastructuur. Of je nu een enkel prototype of een volledige productieserie nodig hebt, ons team begeleidt je van concept tot zeeklare levering."

