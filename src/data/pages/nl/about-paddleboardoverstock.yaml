values:
  - title: Kwaliteit voorop
    desc: Elke boot die onze fabriek verlaat, ondergaat verplichte luchtdichtheids-, naadsterkte- en systeemtests vóór verzending.
  - title: Verticale integratie
    desc: We controleren elke fase — van PVC-snijden tot eindmontage — waardoor onderaannemersinefficiëntie wordt geëlimineerd en constante kwaliteit wordt gegarandeerd.
  - title: Veiligheid als standaard
    desc: CE-certificering is de kern van wat wij bouwen. Onze 64 CE-gecertificeerde modellen voldoen aan EU-veiligheidsnormen voor recreatief en commercieel gebruik.
  - title: Partnergericht
    desc: We bouwen langdurige relaties op met OEM-, ODM- en private-labelpartners door transparantie, betrouwbaarheid en gezamenlijke ontwikkeling.

services:
  - title: OEM-productie
    desc: We produceren volgens jouw specificaties. Deel je tekeningen en ons technisch team zorgt voor prototyping, gereedschap en productie.
  - title: ODM-oplossingen
    desc: Begin met onze beproefde ontwerpplatforms. Pas maat, kleur, graphics en verpakking aan om een unieke productlijn te creëren.
  - title: Private Label
    desc: Jouw merk, jouw logo, jouw verpakking. Producten komen zeeklaar aan met volledige merkintegratie.
  - title: Op maat gemaakte branding
    desc: Dekbedrukking, rompgraphics, tubestickers en aangepaste labels — een consistente merkpresentatie op elk oppervlak.

certifications:
  - name: CE-certificaat
    desc: Onze boten en vaartuigen voldoen aan de EU-richtlijn voor recreatievaartuigen (2013/53/EU) en relevante geharmoniseerde normen.
    scope: Boten en vaartuigen
  - name:
    desc: Kwaliteitsmanagementsysteem gecertificeerd voor ontwerp, productie en distributie van opblaasbare vaartuigen.
    scope: Gehele faciliteit
  - name:
    desc: Opblaasbare boten — veiligheids- en prestatie-eisen voor versterkte en starre opblaasbare boten.
    scope: RIB- en opblaaslijnen

