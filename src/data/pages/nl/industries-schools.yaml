hero:
  tagline: Watersportscholen en trainingscentra
  title: Uitrustingsoplossingen<br />Voor SUP- en kajakscholen
  subtitle: Betrouwbare uitrusting van commerciële kwaliteit voor paddlescholen, surfinstructie, kajaktraining en watersporteducatieprogramma's op elke schaal.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP boards voor scholen en trainingscentra
direct_answer: "Paddle Board Overstock voorziet SUP- en kajakscholen over de hele wereld van boards van commerciële kwaliteit, veiligheidsuitrusting en instructeurspakketten. Onze apparatuur is gebouwd voor dagelijks instructiegebruik: dikker PVC, versterkte drop-stitch-kernen en stabiele rompontwerpen die beginners vertrouwen en instructeurs betrouwbaarheid geven. Pakketten omvatten aangepaste branding, reserveonderdelenprogramma's en trainingsbronnen."
solution_offerings:
  - title: Schoolstartpakket
