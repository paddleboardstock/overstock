        description: 10–25 allround SUP-boards of recreatieve kajaks met stabiele platforms voor beginnerslessen
      - title: Instructeursboards
        description: Bredere, langere boards met extra stabiliteit en antislip EVA-decks voor coaching
      - title: Veiligheidsuitrusting
        description: Reddingsvesten, riemen, fluitjes en werptassen in bijpassende kleuren
      - title: Opslag & Transport
        description: Stapelbare plankenrekken, gewatteerde kajakhouders en transportdollies
      - title: Curriculumondersteuning
        description: Lessjablonen, veiligheidschecklists en gidsen voor de voortgang van vaardigheden
    cta_text: Start mijn schoolpakket
    cta_href: /contact
  - title: School Premium-pakket
    subtitle: Voor gevestigde scholen en exploitanten van meerdere programma's
    badge: Best Value
