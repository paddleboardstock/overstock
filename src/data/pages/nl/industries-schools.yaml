        description: 25-50 boards of kajaks met gemengde vloot (allround, toer-, jeugdmaten)
      - title: Instructeursvloot
        description: 3–5 gespecialiseerde instructeursborden met ingebouwde montagebeugels voor het geluidssysteem
      - title: Veiligheidsstation
        description: Gecentraliseerd veiligheidsuitrustingsstation met reddingsvesten, radio's, eerste hulp en bewegwijzering
      - title: Brandingpakket
        description: Volledige logoprint op boards, peddels, PFD's en uniformen
