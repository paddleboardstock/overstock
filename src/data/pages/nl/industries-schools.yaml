    cta_text: Stel mijn Premium-pakket samen
    cta_href: /contact
  - title: Franchisepakket voor scholen
    subtitle: Voor multilocatieketens en franchiseondernemers
    badge: Enterprise
    features:
      - title: Standaardisatie van de vloot
        description: Identieke apparatuur op alle locaties voor een consistente studentenervaring
      - title: Centrale bestelling
        description: Geconsolideerde bestellingen, bulkprijzen en gecentraliseerd beheer van reserveonderdelen
      - title: Instructeur opleiding
        description: Certificering voor het hanteren en onderhouden van apparatuur voor alle instructeurs
      - title: Co-branding
        description: Gezamenlijke branding met franchise + Paddle Board Overstock co-branding-opties
      - title: Ondersteuning voor uitbreiding
        description: Schaaladvies, prognoses van apparatuur en nieuwe locatie-instelling
    cta_text: Bespreek het franchiseplan
    cta_href: /contact
benefits:
  - title: Gebouwd voor dagelijkse instructie
    description: Dikker PVC en versterkte rails zijn bestand tegen dagelijks gebruik door studenten, vallen op zand en rotsachtige landingen.
    icon: tabler:shield
  - title: Stabiele leerplatforms
    description: Bredere rompen en vlakkere rockers geven beginners vertrouwen. Instructeurs richten zich op lesgeven, niet op apparatuur.
    icon: tabler:scale
  - title: Gemakkelijk op te bergen en te transporteren
    description: Opblaasbare designwinkels in kleine ruimtes. Leeggelopen borden passen in standaard voertuigkoffers voor mobiel lesgeven.
    icon: tabler:box-seam
  - title: Aangepaste branding
    description: Schoollogo's en kleuren op elk bord. Uw merk, uw identiteit – geen generieke huuruitrusting.
    icon: tabler:brush
content_segments:
  tagline: Schoolprofielen
  title: Oplossingen voor watersportonderwijs<br />Per programmatype
  subtitle: Paddle-scholen, surfacademies, universiteitsprogramma's en franchise-exploitanten worden elk met verschillende operationele uitdagingen geconfronteerd - van curriculumintegratie tot vlootstandaardisatie op meerdere locaties. We configureren apparatuurpakketten die passen bij het onderwijsmodel.
  items:
    - title: Onafhankelijke SUP- en kajakscholen
      subtitle: Door de eigenaar beheerde trainingscentra
      description: Kleine tot middelgrote scholen gerund door eigen instructeurs die SUP-lessen, kajaktrainingen en certificeringscursussen aanbieden. Apparatuur moet duurzaam genoeg zijn voor dagelijks instructiegebruik, betaalbaar voor een klein bedrijfsbudget en veelzijdig genoeg om beginners tot en met halfgevorderde studenten in één vloot te bedienen.
      features:
        - Stabiele allround SUP-boards en recreatieve kajaks voor beginnerslessen
        - Boards specifiek voor instructeurs met extra stabiliteit voor coaching vanuit het water
        - Lesplansjablonen en vaardigheidsprogressiegidsen inbegrepen
        - Jaarlijks verversingsprogramma voor apparatuur met inruilkortingen
    - title: Recreatieprogramma's voor universiteiten en hogescholen
      subtitle: Grootschalige studentenrecreatievloten
      description: Universitaire recreatieafdelingen die paddleclubs, verhuurprogramma's en instructiecursussen exploiteren als onderdeel van het recreatieaanbod op de campus. Apparatuur wordt tijdens de semesters veel gebruikt, vereist eenvoudige in- en uitchecksystemen en moet bestand zijn tegen verschillende vaardigheidsniveaus, van beginnende studenten tot gevorderde roeiers.
      features:
        - Hoogduurzame PVC-constructie geschikt voor institutionele gebruikscycli
        - Kleurgecodeerde vloten per vaardigheidsniveau voor eenvoudig beheer
        - Compatibiliteit met op RFID of stickers gebaseerde voorraadtracksystemen
        - Groothandelsprijzen met semestergebonden bestellingen en betalingsvoorwaarden
    - title: Surfscholen en surfacademies
      subtitle: Kustsurfinstructieprogramma's
      description: 'Surfscholen leren SUP-surfen, liggende paddle- en surfkajakvaardigheden in oceaanomgevingen. Apparatuur moet bestand zijn tegen de omstandigheden in de surfzone: slagvastheid, zand- en zoutwatertolerantie en gemakkelijke spoel-en-retour-omzet tussen lessen per uur.'
      features:
        - Surfspecifieke vormen met versterkte rails en stootvaste constructie
        - Zachte vin-opties en opgerolde leashes voor de veiligheid van studenten
        - Snel af te spoelen stof die droogt tussen lesrotaties
        - Vlootvervangingsprogramma met inspectie en verversing aan het einde van het seizoen
    - title: Franchise- en multilocatieketens
      subtitle: Gestandaardiseerde apparatuur op verschillende locaties
      description: "Operators met meerdere locaties voeren gestandaardiseerde trainingsprogramma's uit in meerdere steden of regio's. De consistentie van het wagenpark op verschillende locaties is van het grootste belang: elke student moet dezelfde apparatuurervaring hebben, ongeacht welke franchiselocatie hij bezoekt. Gecentraliseerd bestellen, merkuniformiteit en schaalondersteuning zijn essentieel."
      features:
        - Identieke vlootspecificaties op alle franchiselocaties
        - Gecentraliseerde geconsolideerde bestellingen met volumeprijzen
        - 'Co-brandingopties: franchisemerk + Paddle Board Overstock co-branding'
        - 'Opstartkit voor nieuwe locatie: apparatuur, signalering en openingsvoorraad'
