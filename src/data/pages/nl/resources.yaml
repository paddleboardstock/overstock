hero_text:
  tagline: Bronnen
  title: 'Downloadcentrum & inkoopgidsen'
  subtitle: 'Krijg toegang tot productcatalogi, OEM-gidsen, inkoopchecklists en technische documentatie om weloverwogen inkoopbeslissingen te nemen.'
features3_downloads:
  tagline: Downloads
  title: 'Productdocumentatie<br />& bronnen voor kopers'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Catalogus voor maritieme producten 2026'
      description: 'Volledig productassortiment, waaronder RIB-boten, opblaasboten, SUP-boards, kajaks en accessoires. Specificaties, configuraties en opties. PDF-formaat.'
      icon: tabler:file-text
    - title: 'OEM-productiegids'
      description: 'Alles wat u moet weten over OEM/ODM-partnerschappen: overzicht van het proces, minimale bestelhoeveelheden, aanpassingsopties, kwaliteitscontrole en verzending.'
      icon: tabler:building-factory
    - title: 'Koopgids voor RIB-boten'
      description: 'Hoe kiest u de juiste RIB: rompmaterialen, tubematerialen, motorkeuze, afmetingsoverwegingen en configuratieopties voor verschillende toepassingen.'
      icon: tabler:file-description
    - title: 'Checklist voor SUP-leveranciers'
      description: 'Belangrijke overwegingen bij het kiezen van een SUP-boardfabrikant: kwaliteitsindicatoren, certificeringseisen, MOQ-overwegingen en waar u op moet letten bij een fabrieksaudit.'
      icon: tabler:clipboard-check
    - title: 'Materiaalgids voor opblaasboten'
      description: 'PVC versus Hypalon: vergelijking van duurzaamheid, UV-bestendigheid, levensduur, reparatieopties en kostenoverwegingen voor verschillende maritieme toepassingen.'
      icon: tabler:files
    - title: 'Briefsjabloon voor maatwerkproductie'
      description: 'Download ons briefsjabloon voor producten. Vul uw vereisten in en stuur het terug naar ons voor een offerte in dezelfde week en een beoordeling van de haalbaarheid.'
      icon: tabler:template
faqs:
  title: Veelgestelde vragen
  subtitle: 'Veelvoorkomende vragen over onze producten, het productieproces en ons partnerschapsmodel.'
  columns: 2
  items:
    - title: Wat is de minimale bestelhoeveelheid?
      description: 'De MOQ varieert per productcategorie. RIB-boten beginnen doorgaans bij 10 stuks per model. SUP-boards vanaf 50 stuks. Neem contact op met ons verkoopteam voor productspecifieke MOQ-informatie.'
      icon: tabler:help-circle
    - title: Kan ik monsters ontvangen voordat ik een bestelling plaats?
      description: 'Ja. Paddle Board Overstock levert monsterproductie voor evaluatie vóór massaproductie. Monsterkosten zijn onderhandelbaar en worden vaak verrekend met de eerste productieorder.'
      icon: tabler:package
    - title: Welke betalingsvoorwaarden zijn beschikbaar?
      description: 'Standaardvoorwaarden: 30% aanbetaling bij bestelling, 70% vóór verzending. LC-voorwaarden zijn beschikbaar voor kwalificerende klanten. Neem contact op met ons financiële team om de mogelijkheden te bespreken.'
      icon: tabler:currency-dollar
    - title: Hoe lang duurt de productie?
      description: 'Typische doorlooptijden: RIB-boten 30-45 dagen, SUP-boards 20-30 dagen, opblaasboten 25-35 dagen. Maatwerkontwikkeling voegt 15-30 dagen voor prototypen toe.'
      icon: tabler:calendar-clock
    - title: Welke certificeringen hebben uw producten?
      description: 'CE-certificering voor EU-markten, productie goedgekeurd door de Amerikaanse kustwacht, ISO-kwaliteitssysteem, BSCI-naleving en REACH-materiaalnaleving.'
      icon: tabler:certificate
    - title: Biedt u op maat gemaakte verpakking en branding aan?
      description: 'Ja. Wij leveren op maat gemaakte verpakking met uw logo, kleuren en merkidentiteit. De MOQ voor op maat gemaakte verpakking is afhankelijk van de productcategorie.'
      icon: tabler:color-swatch
cta:
  title: 'Hulp nodig bij het vinden van de juiste bron?'
  subtitle: 'Neem contact op met ons team voor persoonlijke begeleiding bij productselectie, OEM-partnerschappen of technische specificaties.'
  actions:
    - variant: primary
      text: Neem contact op met ons team
      href: /contact
