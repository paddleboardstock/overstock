hero_text:
  tagline: Middelen
  title: Downloadcentrum & Peddelgidsen
  subtitle: Productcatalogi, koopgidsen en onderhoudsinstructies om u te helpen bij het kiezen, gebruiken en genieten van uw opblaasbare SUP board.
features3_downloads:
  tagline: Downloads
  title: Productdocumentatie<br />& Peddelbronnen
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 SUP Productcatalogus
      description: 'Het complete Paddle Board Overstock SUP-assortiment: allround borden, kunstseries en accessoires, met volledige specificaties en inhoud van het pakket. PDF-formaat.'
      icon: tabler:file-text
    - title: Opblaasbare SUP Koopgids
      description: 'Hoe je je eerste board kiest: lengte, breedte, dikte, volume, afstemming op het gewicht van de rijder, en welke boardvorm bij je peddelstijl past.'
      icon: tabler:file-description
    - title: SUP Maat- & Pasvormgids
      description: Stem het volume en de afmetingen van het board af op je gewicht en vaardigheidsniveau, met activiteit-specifieke aanbevelingen voor recreatie, toeren, yoga en fitness.
      icon: tabler:clipboard-check
    - title: Gids voor Verzorging en Onderhoud van Bord
      description: 'Houd je board als nieuw: schoonmaken, drogen, opbergen, UV bescherming, klepzorgen en instructies voor klein onderhoud.'
      icon: tabler:tool
    - title: Gids voor materialen van opblaasbare boards
      description: PVC constructie, drop-stitch kernen, EVA deckpads, en wat 15 PSI stijfheid betekent voor prestaties en duurzaamheid.
      icon: tabler:files
    - title: Aan de slag met SUP
      description: 'Basisprincipes voor beginnende peddelaars: oppompen, dragen, te water laten, basistechnieken en essentiële veiligheidsmaatregelen om je op de eerste dag op te laten staan.'
      icon: tabler:swimming
faqs:
  title: Veelgestelde Vragen
  subtitle: Veelgestelde vragen over onze boards, bestellen en het water op gaan.
  columns: 2
  items:
    - title: Wat is inbegrepen bij mijn bord?
      description: Elke complete set bevat het board, verstelbare peddel, hogedrukpomp, leash, reparatieset en rugzak. De Oars & Pump Set is ook afzonderlijk verkrijgbaar.
      icon: tabler:package
    - title: Hoe lang duurt inflatie?
      description: Met de meegeleverde hogedrukpomp bereiken de meeste peddelaars de volledige druk in 8-12 minuten. Elektrische pompen werken ook — stop gewoon bij de nominale druk die bij het ventiel is afgedrukt.
      icon: tabler:clock
    - title: Hoe kies ik het juiste board?
      description: 'Begin met je gewicht en peddelstijl: beginners en gezinnen houden van brede, stabiele platforms zoals de SUP Explorer 11; yogapeddelaars geven de voorkeur aan volledige dekantitractie; touringpeddelaars willen stijve, gestroomlijnde vormen. Ons team geeft graag aanbevelingen.'
      icon: tabler:help-circle
    - title: Welke betaalmethoden accepteert u?
      description: Wij accepteren grote creditcards, PayPal en bankoverschrijving. Alle prijzen zijn inclusief het volledige pakket — geen verborgen extra's.
      icon: tabler:currency-dollar
    - title: Hoe lang duurt de levering?
      description: Bestellingen worden vanuit onze fabriek verzonden en komen meestal binnen 5-10 werkdagen aan, afhankelijk van uw regio. Voor elke bestelling wordt een trackingnummer verstrekt.
      icon: tabler:truck-delivery
    - title: Wordt mijn bord gedekt door de garantie?
      description: Ja — elk bord is gedekt tegen fabricagefouten en elke unit wordt onder druk getest tot 1,25 keer de nominale druk gedurende 24-48 uur voordat deze de fabriek verlaat. Ons garantieclaimpercentage ligt onder de 2%.
      icon: tabler:shield-check
cta:
  title: Hulp nodig bij het vinden van het juiste board?
  subtitle: Neem contact op met ons team voor eerlijk advies over het kiezen van een board, het bepalen van de maat of vragen over bestellingen.
  actions:
    - variant: primary
      text: Neem contact op met ons team
      href: /contact
