hero:
  tagline: Kenia
  title: SUP Groothandelsboards voor<br />Keniaanse bedrijven
  subtitle: Diani, Watamu, Mombasa en Nairobi — strandexploitanten, resorts en retailers die gloednieuwe overbodige borden op voorraad hebben van 5 eenheden, gemengde modellen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Overstockborden voor Keniaanse strandresorts en exploitanten
direct_answer: Paddle Board Overstock levert gloednieuwe overtollige opblaasbare SUP boards aan Keniaanse bedrijven — strandexploitanten en resorts op Diani, Watamu, Nyali en de kust rond Mombasa, plus retailers en scholen die de groeiende peutergemeenschap in Nairobi bereiken. Groothandelsbestellingen beginnen bij 5 boards met gemengde modellen in één zending, verzonden vanuit Weihai, China per express luchtvracht of geconsolideerde zeevracht. Elke board is 100% onder druk getest en wordt gedekt door de 2-jarige SUP garantie.
tldr_points:
  - Groothandel vanaf 5 boards — gemengde modellen, geprijsd op totale hoeveelheid
  - Voor het strandtoerisme en safari-lodge-uitbreidingen van Kenia in de Indische Oceaan
  - Expresslucht of geconsolideerde zeevracht vanuit Weihai, China
  - 100% onder druktest, 2 jaar SUP garantie op elk bord
overview_section:
  tagline: Marktoverzicht
  title: De SUP Keniaanse markt
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: Een activiteit in rustig water die werkt voor resortgasten, kitesurfscholen op windvrije dagen en zonsondergangpeddels over het rif.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: lodges en kampen die peddelsessies aan hun activiteitenmenu's toevoegen. Tussen strandexploitanten, hotels, kitesurf- en duikscholen die hun aanbod uitbreiden, en een kleine maar groeiende peutscene in Nairobi, zijn de bestellingen klein en praktisch — 5–15 boards van stabiele, duurzame allround modellen met een of twee premium exemplaren voor tentoonstelling.
  customer_types:
    - title: Strandbeheerders
      description: Operators van Diani, Watamu en Mombasa voegen SUP verhuur en lessen toe voor toeristen.
    - title: Resorts & Safari- en Strandlodges
      description: Kustresorts en lodges met SUP gastprogramma's en compacte gemengde vloten.
    - title: Kitesurf- en duikscholen
      description: Bestaande watersportscholen verbreden hun aanbod met rustig water peddelen.
shipping_section:
  title: Schip naar Kenia
  paragraphs:
    - Bestellingen worden verzonden vanuit Weihai, China. Express luchtvracht vervoert monsters en 1–3 boardorders naar de luchthaven Jomo Kenyatta in Nairobi en de kust; Consolidated Sea Freight bedient 5–20 groothandelsbestellingen aan boord via de haven van Mombasa. Transitschattingen voor uw bestemming zijn opgenomen in uw offerte.
    - Wij leveren de benodigde commerciële facturatie en verpakkingslijst, met de juiste HS-codes en aangegeven waarden. Invoerrechten en belastingen zijn door de importeur verschuldigd volgens de Keniaanse regels.
  customs_note: Bevestig de huidige belasting- en belastingbehandeling voor sportuitrusting bij uw clearingagent voordat u bestelt — de tariefstructuur van Kenia verandert periodiek. Wij leveren volledige, consistente documentatie voor een soepele clearing.
faq_section:
  title: Kenia FAQ
  items:
    - q: Kunnen boards Diani of Watamu rechtstreeks bereiken?
      a: Offertes van deur tot deur bezorging dekken kustbestemmingen, waarbij je verder logistiek gebruikt vanaf de aankomstluchthaven of de haven van Mombasa. Noteer je exacte locatie in de aanvraag en wij zullen deze specifiek prijsgeven.
    - q: Hoe ziet een startorder voor een strandoperator eruit?
      a: 'Meestal 5–10 borden: stabiele allround modellen voor toeristische lessen en verhuur, plus één of twee premium edities voor tentoonstelling. Gemengde modellen, één levering, geprijsd naar totale hoeveelheid.'
    - q: Passen de planken goed bij warme lagune en rifvlakte wateren?
      a: Ja — rustige, warme, ondiepe omstandigheden zijn precies waar allround opblaasbare SUPs voor ontworpen zijn, en de flexibele vin en drop-stitch-constructie kunnen goed omgaan met zandige en koraalvlakte-landingen.
    - q: Hoe wordt vracht naar Kenia geoffreerd?
      a: Express-luchtvracht naar Nairobi of de kust voor monsters en kleine bestellingen; gebundelde zeevracht naar Mombasa voor groothandelsvolumes. Beide worden in uw offerte gespecificeerd met geschatte doorlooptijden.
