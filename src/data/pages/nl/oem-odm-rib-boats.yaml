content_customization:
  tagline: Wat kan worden aangepast
  title: RIB-aanpassing<br />Opties
  subtitle: Elk element van een RIB-boot kan worden afgestemd op uw toepassing, markt en merkvereisten.
  items:
    - title: Romp en structureel
      description: Romplengte (2,5–8,5 m), rompmateriaal (GFK-glasvezel of aluminium van maritieme kwaliteit), rompkleur (gelcoat of geverfd), kielprofiel (diepe V, matige V, vlak), spiegeltype (gesloten spiegel met beugel of put) en structurele versterking voor commerciële belastingsvereisten.
      icon: tabler:sailboat
    - title: Buis en kraag
      description: Buismateriaal (0,9–1,2 mm PVC of 1,4–1,7 mm Hypalon/CSM), buisdiameter (40–55 cm), aantal kamers (3–7), kleptype (Halkey-Roberts, Leafield D7 of Boston), buiskleur (standaard of op maat) en kraagconus/conus configuratie.
      icon: tabler:circle
    - title: Dek- en console-indeling
      description: Middenconsole, zijconsole of stuurkolom. Zitplaatsindeling (jockeystoelen, zitbanken, steunstoelen). Dekbekleding (teak-look van EVA-schuim, antislipverf of blank GVK). Bevestigingspunten voor uitrusting, handgrepen en D-ringposities.
      icon: tabler:layout-dashboard
    - title: Elektriciteit en navigatie
      description: Navigatieverlichting (LED), lenspompsysteem, batterijbeheer, VHF-radio-installatie, GPS/kaartplotter-montage, USB-oplaadpoorten en schakelpaneelconfiguratie.
      icon: tabler:bolt
    - title: Branding en afbeeldingen
      description: Romp- en buisafbeeldingen (zeefdruk, warmteoverdracht, UV-digitaal printen), logoplaatsing, op maat gemaakte kleurenschema's, identificatiemarkeringen en aangepaste eigenaarsdocumentatie met uw merk.
      icon: tabler:palette
    - title: Veiligheid en naleving
      description: Ontwerpcategorieclassificatie (A/B/C/D per aardlekschakelaar), brandblussysteem, brandstofsysteemspecificatie (draagbare tank, vaste tank, onderdeks) en conformiteitsdocumentatiepakket voor uw doelmarkt.
      icon: tabler:shield
content_applications:
