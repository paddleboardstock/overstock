content_risk_control:
  tagline: Risico- en leveringscontrole
  title: Projectrisico en<br />Opleveringsbeheer
  subtitle: Professionele OEM/ODM kopers geven net zoveel om risicobeheersing als om productkwaliteit. Hier ziet u hoe wij het beheren.
  items:
    - title: Reikwijdte en eigendomsdefinitie
      description: 'Voordat de ontwikkeling begint, definiëren we schriftelijk: de reikwijdte van de aanpassing, de gereedschapsvereisten, de goedkeuringscriteria voor monsters, het eigendom van tekeningen en matrijzen en documentatieverantwoordelijkheden. Geen onduidelijkheid over wie wat bezit.'
      icon: tabler:file-text
    - title: Wijzigingsbeheerproces
      description: Alle specificatiewijzigingen na ontwerpbevestiging volgen een gedocumenteerd wijzigingsverzoekproces met impactbeoordeling (kosten, tijdlijn, naleving). Er komen geen niet-goedgekeurde wijzigingen in productie.
      icon: tabler:arrows-diff
    - title: Batchconsistentie gegarandeerd
      description: Het 50e exemplaar komt overeen met het eerste goedgekeurde monster. Goedgekeurde specificaties worden bevroren, materiaal- en procesparameters worden vergrendeld en controlepunten tijdens het proces verifiëren de consistentie tijdens de hele productierun.
      icon: tabler:repeat
    - title: Transparantie van levering en capaciteit
      description: Doorlooptijden worden vermeld op basis van de werkelijke productiecapaciteit, de materiaalvoorraden en de huidige orderlast, en niet op ambitieuze doelstellingen. Productieschema met mijlpaaldata per bestelling.
      icon: tabler:calendar-stats

