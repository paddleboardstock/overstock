faq:
  title: RIB OEM/ODM — Veelgestelde vragen
  questions:
    - q: Wat is het verschil tussen OEM en ODM voor RIB-boten?
      a: 'OEM (Original Equipment Manufacturing): u levert gedetailleerde specificaties en wij bouwen uw ontwerp. ODM (Original Design Manufacturing): u selecteert een beproefd Paddle Board Overstock RIB-platform en wij passen het aan met uw gewenste functies en branding. ODM is sneller en goedkoper; OEM biedt maximale ontwerpcontrole.'
    - q: Kan ik de vorm en grootte van de RIB-romp aanpassen?
      a: Ja. We bieden semi-op maat gemaakte aanpassingen aan bestaande rompmallen (verschillende dekindelingen, buisconfiguraties) en volledige aangepaste rompontwikkeling met nieuwe CNC-gefreesde mallen. Semi-op maat gemaakte projecten kunnen beginnen bij 2-5 eenheden; Volledig op maat vereist doorgaans hogere verplichtingen.
    - q: Welke buismaterialen zijn beschikbaar voor aangepaste RIB's?
      a: Wij bieden 0,9-1,2 mm PVC voor recreatief en licht commercieel gebruik, en 1,4-1,7 mm Hypalon/CSM voor professionele, reddings- en commerciële toepassingen die superieure UV- en ozonbestendigheid vereisen (levensduur van 10-15 jaar versus 5-8 jaar voor PVC).
    - q: Kunt u RIB's configureren voor specifieke toepassingen zoals reddingsacties, duiken of vissen?
      a: Ja. We onderhouden beproefde configuratiesjablonen voor reddings-/patrouille-, duikondersteuning-, toerisme-/charter-, visserij-, jachttender- en professionele werkboottoepassingen. Elke sjabloon bevat het aanbevolen romptype, buismateriaal, dekindeling en uitrusting, die we vervolgens aanpassen aan uw exacte vereisten.
    - q: Welke informatie heeft u nodig voor een RIB OEM/ODM-offerte?
      a: Doeltoepassing, gewenste romplengte, voorkeur voor buismateriaal (PVC of Hypalon), geschatte hoeveelheid en leveringsschema, nalevingsvereisten voor de doelmarkt en eventuele referentieproducten of specificaties. Hoe gedetailleerder u ons verstrekt, hoe sneller en nauwkeuriger onze offerte.
    - q: Wat is de MOQ voor aangepaste RIB-boten?
      a: Voor bestaande rompmallen met standaardaanpassingen begint de MOQ bij 2-5 eenheden per ontwerp. Voor op maat gemaakte matrijzen en volledige ontwikkeling op maat hangt de MOQ af van de complexiteit van het project - doorgaans 10-20 eenheden voor semi-op maat en 30+ voor volledig op maat met nieuwe gereedschappen.
    - q: Wie is eigenaar van de aangepaste mallen en tekeningen?
      a: Mallen ontwikkeld met behulp van Paddle Board Overstock-basisontwerpen blijven eigendom van Paddle Board Overstock. Volledig op maat gemaakte matrijzen die in opdracht van en betaald door de klant zijn gemaakt, kunnen volgens de contractvoorwaarden aan de klant worden overgedragen. Alle voorwaarden voor matrijseigendom worden gedocumenteerd voordat het project start.
    - q: Hoe worden op maat gemaakte RIB's verpakt voor export?
      a: 'Standaard: op maat gemaakte wieg + rekfolie voor containerbelading. Premium: winkelklare verpakking, vacuümverpakt of gepalletiseerd. Wij bieden FOB Qingdao-, CIF- en DDP-verzending. Volledige exportdocumentatie en inklaring inbegrepen.'
