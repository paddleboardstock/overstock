content_service_modules:
  tagline: Servicemodules
  title: OEM/ODM-service<br />modules
  subtitle: Elk project combineert de juiste servicemodules. Niet elk project heeft elke module nodig; we onderzoeken alleen wat uw project nodig heeft.
  items:
    - title: Technische beoordeling en haalbaarheid
      description: 'Beoordeling van het rompplatform, controle van de structurele haalbaarheid, verificatie van stabiliteit en drijfvermogen, identificatie van het nalevingspad en bevestiging van de beschikbaarheid van materiaal. Output: haalbaarheidsrapport met go/no-go advies.'
