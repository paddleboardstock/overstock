      icon: tabler:mask
    - title: Toerisme en commercieel
      description: Passagiersgecertificeerde indeling met zitbanken, zonnescherm/Bimini, handgrepen, droge opslag en dubbel batterijsysteem. RCD Categorie C. Ontworpen voor resort- en chartervlootactiviteiten.
      icon: tabler:beach
    - title: Vissen
      description: Open dekindeling, posities voor hengelhouders, put voor levend aas, fishfinder-montage, trollingmotormontage, versterkte spiegel en draagbaar brandstofsysteem. Opties voor middenconsole of zijconsole.
      icon: tabler:fish
    - title: Vrije tijd en jachttender
      description: Lichtgewicht romp, PVC-buizen, comfortabele stoelen, telescopische helmstok of compacte console, hijspunten voor davit en afneembare brandstoftank. RCD-categorie C of D.
      icon: tabler:sailboat
    - title: Professionele werkboot
      description: Aluminium rompoptie, robuuste versterking, hydraulische besturing, elektrische apparatuur van commerciële kwaliteit, radarboog en missiespecifieke uitrustingsintegratiepunten. Maatwerk compliance per project.
      icon: tabler:anchor
process_steps:
  title: RIB OEM/ODM-ontwikkelingsproces in 7 stappen
  subtitle: 'Van projectbeschrijving tot after-sales: een gedefinieerde workflow met duidelijke mijlpalen en resultaten'
  steps:
    - number: '01'
      title: Projectoverzicht en vereisten
      description: Definieer de doeltoepassing, rompgrootte, buismateriaal, compliance-eisen en merkbehoeften. We beoordelen de haalbaarheid en bevestigen het samenwerkingsmodel (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 dagen
    - number: '02'
      title: Technische beoordeling en haalbaarheid
      description: Het technische team beoordeelt de structurele haalbaarheid, stabiliteits- en drijfvermogenberekeningen, het nalevingstraject en de beschikbaarheid van materialen. Wij identificeren bestaande matrijzen of aangepaste matrijsvereisten.
      timeline: 5–7 dagen
    - number: '03'
      title: Voorstel & Offerte
      description: Ontvang een gedetailleerd voorstel inclusief specificaties, 3D-weergaven of GA-tekeningen, nalevingsbereik, tijdlijn en eenheidsprijzen op basis van volumeniveaus en MOQ.
      timeline: 5–7 dagen
    - number: '04'
      title: Ontwerpbevestiging en bemonstering
      description: Keur de definitieve GA, dekindeling en buisconfiguratie goed. We produceren een pre-productiemonster met uw merkkleuren, logo en gespecificeerde materialen voor uw fysieke inspectie.
      timeline: 15–20 dagen
    - number: '05'
      title: Monstergoedkeuring en QC-protocol
      description: 'Inspecteer en keur het monster goed. Definieer het QC-protocol voor de productie: druktest (1,25x / 24-48 uur), dimensionale controles en een checklist voor nalevingsdocumentatie per romp.'
      timeline: 3–5 dagen
    - number: '06'
      title: Massaproductie en kwaliteitscontrole
      description: Volledige productierun met 100-punts QC-checklist per eenheid. Inspecties tijdens het proces, druktesten en traceerbaarheid op serieel niveau. CE/ISO-documentatie parallel opgesteld.
      timeline: 30-45 dagen
    - number: '07'
      title: Verpakking, verzending en after-sales
      description: Aangepaste verpakking (standaard, winkelklaar of gepalletiseerd), exportdocumentatie, laden van containers en logistiek. Inclusief reserveonderdelensets en onderhoudsdocumentatie.
      timeline: 7–14 dagen
