    - title: Ontwerp & Configuratie
      description: 'GA-tekening, dekindeling, buisconfiguratie, console- en zitposities, montageplan voor apparatuur en kleur-/materiaalkeuze. Output: goedgekeurde GA en configuratiespecificatie.'
      icon: tabler:ruler
    - title: Sample & prototype
      description: Pre-productiemonster met goedgekeurde kleuren, logo en gespecificeerde materialen voor fysieke inspectie. Inclusief voorbeeldgoedkeuringsprotocol, inspectiechecklist en wijzigingsaanvraagproces.
      icon: tabler:3d-cube-sphere
    - title: Productie & kwaliteitscontrole
      description: Massaproductie met een QC-checklist van 100 punten per eenheid, inspecties tijdens het proces, druktesten (1,25x / 24-48 uur) en traceerbaarheid op serieel niveau. CE/ISO documentatie parallel opgesteld.
