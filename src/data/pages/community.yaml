stories:
  tagline: 'Explorer Stories'
  title: 'Real adventures from real people'
  subtitle: 'Hear from paddlers, families, and professionals who use Paddle Board Overstock gear on the water.'
  items:
    - name: 'Sarah & Mike'
      title: 'SUP Explorer 11 owners, Canada'
      content: 'We took our Explorer 11s on a week-long trip through Algonquin Park. They handled portages and lake crossings beautifully. The drop-stitch construction meant we could inflate to 15 PSI and get hard-board performance from a packable board.'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp'
      location: 'Algonquin Park, Canada'
    - name: 'Carlos R.'
      title: 'Cheetah Surge rider, Spain'
      content: 'The Cheetah Surge is my go-to for coastal cruising. The vibrant design turns heads on the beach, and the stability gives me confidence in light chop. It handles beautifully whether I am touring or just enjoying the sunset.'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp'
      location: 'Costa Brava, Spain'
    - name: 'Lina & family'
      title: 'Flowing Lotus paddlers, Sweden'
      content: 'Weekend family adventures on the archipelago. The Flowing Lotus is stable enough for my daughter to stand on while I paddle. Inflates in under 10 minutes — no trailer needed, just pure family fun on the water.'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp'
      location: 'Stockholm Archipelago, Sweden'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager explorer, Philippines'
      content: 'I use my Ocean Voyager for long-distance coastal tours around Palawan. After months of daily use in tropical conditions, the board still performs like new. The touring shape cuts through chop that would stop lesser boards.'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp'
      location: 'Palawan, Philippines'
    - name: 'Emma T.'
      title: 'Tropical Breeze first-timer, Australia'
      content: 'I had never been on a SUP before. The Tropical Breeze is so stable I felt confident on my first try. Now I paddle every weekend. The learning curve is basically zero — and the board looks amazing on the water.'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp'
      location: 'Gold Coast, Australia'

