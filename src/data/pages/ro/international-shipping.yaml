process_section:
  tagline: Cum Funcționează Expedierea
  title: De la Depozitul Nostru la Ușa Ta
  steps:
    - title: Cotație Cu Opțiuni de Transport
      description: Fiecare cotație detaliază opțiunile de transport pentru destinația ta — expres și maritim — cu timpi estimativi de tranzit, astfel încât nimic să nu fie decis în locul tău.
    - title: Verificare și Ambalare a Calității
      description: Plăcile sunt testate 100% la presiune, apoi ambalate cu pompă, vâslă, leșă, aletă, rucsac și kit de reparații — același pachet complet pe care îl vindem în retail.
    - title: Expediere Din Weihai
      description: Expediția ta pleacă din baza noastră logistică cu metoda de transport aleasă și tracking-ul de la ușă la ușă ți se împărtășește în aceeași zi.
    - title: Vamă
      description: Oferim factura comercială și lista de ambalare de care ai nevoie pentru import. Taxele vamale și impozitele în țara ta sunt responsabilitatea importatorului — vezi secțiunea vamală de mai jos.
    - title: Livrare și Inspectare
      description: Inspectează livrarea la sosire. Dacă ceva este deteriorat sau lipsește, contactează-ne cu fotografii și numărul comenzii — vezi politica noastră privind pierderile și daunele de mai jos.
customs_section:
  tagline: Vamă și Taxe
  title: Taxe Vamale și Impozite de Import
  subtitle: Menținem responsabilitățile pentru transport explicite, în loc să facem promisiuni vagi. Iată exact cine este responsabil pentru ce.
  items:
    - title: Ce Acoperim Noi
      description: Cotația ta include costul transportului către destinație și pregătim și furnizăm toate documentele de export — factura comercială, lista de ambalare și tracking-ul expedierii.
    - title: Ce Acoperă Importatorul
      description: Taxele de import, TVA/GST și orice taxe în țara de destinație sunt plătibile de importator (tu sau afacerea ta) conform regulilor țării tale. Nu includem promisiuni vagi despre taxe în cotațiile noastre de transport.
    - title: Suport pentru Vamă
      description: Documentația noastră este completă și consistentă — codurile HS corecte, valorile declarate și specificațiile plăcilor — ceea ce menține deliberarea fără probleme. Dacă brokerul sau biroul vamal are nevoie de documentație suplimentară, noi o furnizăm.
    - title: Verifică tarifele locale înainte de a comanda
      description: Tarifele vamale pentru echipamentele gonflabile pentru sporturi nautice variază de la țară la țară. Verifică regulile de import ale țării tale sau întreabă în cererea ta — ghidurile noastre regionale de piață includ note vamale pentru piețele cheie.
lost_damaged:
  title: Transporturi pierdute sau avariate
  description: Inspectați livrarea când aceasta ajunge. În cazul rar în care o placă ajunge deteriorată sau un pachet lipsește, contactați-ne cât mai curând posibil cu numărul comenzii și fotografii clare ale ambalajului și ale plăcii. Evaluăm fiecare caz individual — în funcție de carcasă, adică o piesă de schimb, o placă de schimb sau o rambursare pentru produsul afectat. Defectele de fabricație sunt acoperite separat de Garanția noastră de 2 ani SUP .
destinations_section:
  tagline: Unde expediem
  title: 50+ de țări și numărul crește
  description: Expediem în întreaga lume, cu ghiduri detaliate pentru principalele noastre piețe regionale. Fiecare ghid de piață acoperă tipuri de clienți locali, note de expediere și sfaturi vamale pentru acea regiune.
  regions_label: Ghiduri regionale
  countries_label: Ghiduri de țară
faq_section:
  title: Întrebări frecvente despre livrări
  items:
    - q: Cât durează transportul expres?
      a: Timpul de tranzit expres depinde de destinație — estimăm timpul de tranzit pentru țara dumneavoastră la fiecare solicitare, înainte să vă angajați la ceva.
    - q: Cât durează transportul maritim?
      a: Tranzitul maritim de marfă variază în funcție de portul de destinație și programul de navigație. Oferim o estimare a unei ferestre de fereastră pentru destinația ta odată cu comanda, iar tu primești urmărire odată ce expedierea pleacă.
    - q: Ce metodă de livrare ar trebui să aleg?
      a: Express pentru 1–3 scânduri, mostre sau reaprovizionări urgente. Transport maritim pentru 5–20 de comenzi en-gros pentru scânduri, unde costul pe placă contează mai mult decât viteza. Oferim o ofertă pentru ambele ca să poți compara.
    - q: Sunt taxele și taxele de import incluse în costul de transport?
      a: Nu. Transportul este cotat separat, iar taxele de import, TVA/GST și taxele de destinație sunt responsabilitatea importatorului conform regulilor țării dumneavoastră. Oferim documentație completă și precisă pentru a menține deliberarea fără probleme.
    - q: Trimiți în țara mea?
      a: Expediem în 50+ de țări. Verificați ghidurile noastre regionale și de țări de mai jos sau pur și simplu întrebați în cererea dumneavoastră — vom confirma serviciul curent la adresa dumneavoastră.
    - q: Pot să-mi urmăresc comanda?
      a: Da. Fiecare transport — expres sau pe mare — include urmărire din ușă în ușă pe care o împărtășim cu dumneavoastră în ziua expedierii.
