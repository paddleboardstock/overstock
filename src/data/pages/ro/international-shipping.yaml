hero:
  tagline: Transport maritim internațional
  title: Transport internațional —<br />Transport expres și maritim către 50+ de țări
  subtitle: Fiecare comandă este expediată de la baza noastră logistică din Weihai, China. Alegeți transport aerian expres pentru mostre și reaprovizionări urgente, sau transport maritim consolidat pentru comenzi en-gros ale afacerilor mici.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Plăci ambalate pentru transport internațional
direct_answer: Paddle Board Overstock transportă către peste 50 de țări din Weihai, China. Transportul aerian expres transportă 1–3 scânduri, comenzi de mostre și reaprovizionări urgente; Transportul maritim consolidat este opțiunea economică pentru 5–20 de comenzi en-gros pentru scânduri. Fiecare livrare include urmărire din ușă în ușă, iar fiecare placă este testată 100% la presiune și împachetată cu kitul complet de accesorii înainte de expediere.
tldr_points:
  - 'Transport aerian expres: 1–3 scânduri, mostre, reaprovizionări urgente — cea mai rapidă opțiune'
  - 'Transport maritim: 5–20 de comenzi en-gros la bord — cel mai mic cost de transport per bord'
  - Urmărire din ușă în ușă pentru fiecare expediere către 50+ de țări
  - Transportul de marfă, asigurarea, deferirea vamală și taxele de import sunt detaliate în oferta ta — fără promisiuni vagi de tip all-in
from_china:
  tagline: Transportul maritim din China
  title: De unde sunt expediate comenzile
  description: Toate comenzile sunt expediate de la baza noastră logistică din Weihai, China — inima operațiunilor noastre de producție și depozitare. Weihai este un important oraș-port de coastă în provincia Shandong, cu conexiuni directe maritime și aeriene de marfă, ceea ce menține timpii de tranzit și costurile de transport competitive față de destinații din Asia, America, Africa, Europa și Orientul Mijlociu.
modes_section:
  tagline: Două opțiuni
  title: Transport expres sau transport maritim
  subtitle: Metoda corectă de transport depinde de cât de repede ai nevoie de plăci și câte comanzi. Ambele opțiuni sunt cotate la fiecare solicitare.
  express:
    name: Opțiunea A — Expediere Express
    best_for: Ideal pentru 1–3 plăci, mostre și reaprovizionări urgente
    description: Air Express primește comenzi mici și panouri de mostre la ușa ta în câteva zile, nu în săptămâni. Ideal când testezi un model înainte de o comandă mai mare sau reaprovizionezi un bestseller la mijlocul sezonului.
    features:
      - 1–3 plăci, modele individuale sau mostre mixte de modele
      - Cel mai rapid tranzit dintre cele două opțiuni — cotat pe destinație
      - Urmărire din ușă în ușă cu un transportator expres major
      - 'Utilizare tipică: mostre, reaprovizionări urgente, comenzi mici de început'
  sea:
    name: Opțiunea B — Transport maritim
    best_for: Cel mai bun pentru 5–20 de comenzi en-gros și de la comercianți
    description: Transportul maritim consolidat este alegerea economică pentru comenzile en-gros ale întreprinderilor mici. Plăcile sunt împachetate împreună într-o singură livrare consolidată din Weihai, menținând costul pe placă scăzut.
    features:
      - 5–20 comenzi de la comercianți și en-gros
      - Cel mai mic cost de transport per placă dintre cele două opțiuni
      - Ambalare consolidată — o singură expediere, o singură liberare
      - 'Utilizare tipică: reaprovizionări sezoniere, comenzi mixte en-gros'
