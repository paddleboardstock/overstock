hero:
  tagline: Certificări și Standarde
  title: Certificări de Calitate<br />și Standardele de Conformitate
  subtitle: Produsele Paddle Board Overstock sunt fabricate în conformitate cu standardele internaționale de siguranță marină, sistemele de management al calității și reglementările de mediu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Certificările de calitate și documentația de conformitate Paddle Board Overstock
content_certifications:
  tagline: Certificările Noastre
  title: Calitate Certificată,<br />Recunoscută la Nivel Global
  subtitle: Modelele CE certificare și certificările la nivel de fabrică demonstrează angajamentul nostru pentru calitate, siguranță și responsabilitate ecologică.
  items:
    - title: Certificat CE
      description: Modelele CE certificate respectă cerințele marcajului CE european pentru ambarcațiuni de agrement, asigurând îndeplinirea standardelor de siguranță, sănătate și protecție a mediului.
      icon: tabler:certificate
    - title: 9001:2015
      description: Sistemul nostru de management al calității este certificat ISO 9001:2015, acoperind proiectarea, fabricarea și distribuția ambarcațiunilor gonflabile și echipamentelor marine.
      icon: tabler:clipboard-check
    - title: Marcă UKCA
      description: Produsele vândute pe piața din Marea Britanie poartă marcajul UKCA, confirmând conformitatea cu reglementările din Marea Britanie pentru echipamente marine și ambarcațiuni personale.
      icon: tabler:shield
    - title: Conform BSCI
      description: Paddle Board Overstock este auditat de BSCI (Business Social Compliance Initiative), demonstrând practici de fabricație etice, condiții de muncă corecte și responsabilitate în lanțul de aprovizionare.
      icon: tabler:heart-handshake
    - title: Conform REACH
      description: Toate materialele utilizate în produsele Paddle Board Overstock respectă reglementările UE REACH pentru siguranța chimică, asigurând că nu există substanțe restricționate în PVC, Hypalon sau componente.
      icon: tabler:flask
    - title: Testarea Materialelor
      description: Țesăturile sunt testate pentru rezistență la tracțiune, rezistență la rupere, degradare UV și performanța la crăpare la frig. Fiecare lot de producție este eșantionat și verificat.
      icon: tabler:test-pipe
content_factory:
  tagline: Standardele Fabricii
  title: Excelență în Producție<br />— Construită după Specificații
  subtitle: Facilitatea noastră de 12.000 m² funcționează sub protocoale stricte de control al calității la fiecare etapă a producției.
  list:
    - 'Inspecția Materialelor de Intrare: Toate materiile prime — țesătură PVC, Hypalon, aluminiu, placaj, adezivi — sunt testate conform specificațiilor înainte de a intra în producție.'
    - 'Controlul Calității în Proces: Fiecare etapă a producției are puncte de control QC documentate. Rezistența sudurilor, alinierea cusăturilor, instalarea ventilului și cuplul de fixare sunt verificate pe linie.'
    - 'Testarea Presiunii: Fiecare cameră gonflabilă este testată la presiune de 1,25× presiunea nominală pentru 24–48 ore. Rata de scurgere trebuie să fie în limite acceptabile conform ISO 6185.'
    - 'Inspecția Finală: Produsele finalizate sunt inspectate pentru acuratețea dimensiunilor, finisaj cosmetic, completitudinea accesoriilor și integritatea ambalajului înainte de expediere.'
    - 'Trasabilitatea Loturilor: Fiecare produs poartă un număr de serie legat de înregistrările lotului de producție, permițând trasabilitatea completă de la materia primă la bunurile finite.'
content_safety:
  tagline: Standarde de Siguranță Maritimă
  title: Siguranța pe primul loc<br />— Concepute pentru Operare Fiabilă
  subtitle: Produsele Paddle Board Overstock sunt concepute și testate pentru a respecta standardele internaționale de siguranță maritimă pentru utilizare comercială și recreativă.
  items:
    - title: ISO 6185
      description: Bărcile pneumatice respectă standardele ISO 6185 pentru construcție, stabilitate, flotabilitate și capacitate de încărcare.
      icon: tabler:sailboat
    - title: Standarde ABYC
      description: Sistemele electrice și sistemele de combustibil respectă standardele ABYC (American Boat & Yacht Council) pentru instalare și operare sigură.
      icon: tabler:bolt
    - title: SOLAS Conformitate
      description: Echipamentele de siguranță și dispozitivele de salvare respectă cerințele SOLAS (Safety of Life at Sea) acolo unde este cazul.
      icon: tabler:lifebuoy
cta:
  title: Aveți nevoie de produse certificate pentru proiectul dvs.?
  subtitle: Contactați echipa noastră pentru a discuta cerințele de certificare, documentația și conformitatea pentru piața dvs.
  actions:
    - variant: primary
      text: Solicitați documente de certificare
      href: /contact
    - text: Vizitați pagina noastră de calitate
      href: /quality
