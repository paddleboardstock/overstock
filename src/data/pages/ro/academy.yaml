hero:
  tagline: Aquafarer Academie
  title: Centrul de Învățare
  subtitle: Ghiduri și tutoriale pentru orice nivel de abilitate — de la SUP elemente de bază la tehnici avansate de salvare
categories:
  - level: Începător
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Elemente de bază
        desc: Învățați fundamentele paddleboarding-ului — poziția, tehnica loviturii și echilibrul.
        slug: beginner-sup-guide
      - title: Tehnici de vâslire
        desc: Lovitura înainte, lovitura de măturare, lovitura de tragere și sprijinul jos — stăpâniți mișcările esențiale de vâslire.
        slug: sup-paddle-guide
      - title: Siguranța pe primul loc
        desc: Practici esențiale de siguranță, inclusiv verificarea vremii, utilizarea PFD, regulile pentru lesa și auto-salvarea.
        slug: sup-safety-guide
  - level: Intermediar
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Elemente esențiale pentru tururi
        desc: Planificarea de vâsliri de mai multe ore — navigație, hidratare, ritm și citirea prognozelor meteo.
        slug: touring-sup-guide
      - title: Citirea vremii
        desc: Interpretarea prognozelor marine, identificarea tiparelor de nori și înțelegerea efectelor vântului asupra apei.
        slug: weather-planning-water-sports
      - title: Elemente de bază în navigație
        desc: Citirea hărților, folosirea busolei, punctelor GPS și planificarea traseului pentru vâslire de coastă.
        slug: sup-navigation-guide
      - title: Conștientizarea mareelor
        desc: Înțelegerea ciclurilor de maree, curenților și cum afectează aceștia momentul de lansare și traseul.
        slug: understanding-tides
  - level: Avansat
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planificarea unei expediții de mai multe zile
        desc: Logistica expediției — selectarea echipamentului, planificarea alimentației, protocoale de siguranță și contacte de urgență.
        slug: sup-travel-guide
      - title: Tehnici de salvare
        desc: Auto-salvare, T-salvare, salvarea eskimo pentru caiace și protocoale de tractare în ape deschise.
        slug: sup-self-rescue
      - title: Vâslire pe timp de noapte
        desc: Navigația după lăsarea întunericului — cerințe de iluminare, memorarea traseului, comunicarea în grup și conștientizarea pericolelor.
        slug: sup-navigation-guide
  - level: Întreținere
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Curățare și Îngrijire
        desc: Clătire cu apă dulce, protecția UV, prevenirea mucegaiului și tehnici corecte de uscare după fiecare sesiune.
        slug: inflatable-sup-maintenance
      - title: Ghid de depozitare
        desc: Cele mai bune practici pentru depozitarea plăcilor și bărcilor gonflabile — deflație, pliere, controlul temperaturii și durata de valabilitate.
        slug: inflatable-sup-storage
      - title: Elemente de bază ale reparației
        desc: Repară mici înțepături, scurgeri în cusături și probleme cu supapele folosind PVC kituri de reparații și tehnici de reparație.
        slug: inflatable-sup-repair
      - title: Întreținerea supapelor
        desc: Identificați tipurile de supape (Halkey-Roberts, Boston, Leafield), curățați resturile și înlocuiți tijele defecte.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centrul de Cunoaștere
knowledge_center_title: Ghiduri pentru echipamente marine și industrie
knowledge_center_subtitle: Cunoștințe de specialitate și ghiduri de achiziții pentru profesioniștii maritimi, operatorii de flote și pasionații de sporturi nautice.
knowledge_sections:
  - title: RIB Cunoașterea bărcilor
    tagline: Ghiduri rigide pentru bărci gonflabile
    desc: Totul despre RIB bărci — proiectarea carenei, materialele, alegerea motoarelor, întreținere și sfaturi de cumpărare pentru uz comercial și recreațional.
    guides:
      - title: Cum să alegi RIB barca potrivită
        desc: Ghid complet pentru alegerea RIB unei — dimensiune, putere a motorului, materialul tubului, tipul de carenă și utilizarea intenționată.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs Barcă gonflabilă
        desc: Barcă gonflabilă rigidă vs dinghy gonflabilă tradițională — designul carenei, performanțele, durabilitatea și capacitatea comparate.
        href: /compare/rib-vs-dinghy
      - title: Comercial RIB vs Recreațional RIB
        desc: RIB Bărci comerciale vs recreaționale — standarde de construcție, materiale, durata de viață, costuri și certificări.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminiu vs Carenă din fibră de sticlă
        desc: Comparați carenele din aluminiu și fibră de sticlă pentru RIB bărci în funcție de greutate, cost, durabilitate și rezistență la coroziune.
        href: /compare/aluminum-vs-fiberglass
  - title: Ghid pentru bărci gonflabile
    tagline: Cunoștințe despre ambarcațiuni gonflabile
    desc: Ghiduri cuprinzătoare despre bărcile gonflabile — PVC HypalonVS, metode de construcție, standarde de siguranță și cele mai bune practici de întreținere.
    guides:
      - title: PVC vs Hypalon Ghid de materiale
        desc: Comparație definitivă între PVC și Hypalon CSM pentru construcția bărcilor gonflabile.
        href: /compare/pvc-vs-hypalon
      - title: Cum sunt fabricate bărcile gonflabile
        desc: Procesul de fabricație — tăierea materialului, sudarea HF, construcția cusăturilor, testarea presiunii și controlul calității.
        href: /learn/inflatable-technology
      - title: Ghid de siguranță pentru bărci gonflabile
        desc: Standarde de siguranță, capacitate de încărcare, umflare corectă, controale înainte de plecare și proceduri de urgență.
        href: /learn/water-safety
      - title: Întreținerea bărcilor gonflabile
        desc: Curățarea, depozitarea, UV protecția, iarna și repararea bărcilor gonflabile RIBsși .
        href: /v2/inflatable-boat-maintenance
  - title: Cunoașterea bărcilor
    tagline: Barcă gonflabilă & RIB Hub
    desc: Ghiduri tehnice care acoperă tipuri de bărci gonflabile, materiale, metode de construcție, întreținere și siguranță — de la dinghi-uri până RIBsla.
    guides:
      - title: Tipuri de bărci gonflabile
        desc: Dinghies, RIBscaiace și tender — învață diferențele și alege-l pe cel potrivit.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Tehnologie
        desc: Cum mii de filete interne creează structuri rigide, gonflabile la presiune înaltă.
        href: /learn/drop-stitch-core
      - title: Referință pentru materiale
        desc: PVC Au fost explicate ratingurile denier, greutățile materialelor, UV rezistența și materialele de calitate marină.
        href: /learn/materials
      - title: RIB vs Dinghy
        desc: Comparați bărcile rigide gonflabile cu bărcile gonflabile tradiționale pentru diferite cazuri de utilizare.
        href: /compare/rib-vs-dinghy
  - title: SUP Cunoaștere
    tagline: Ghiduri pentru stand-up paddleboard
    desc: Totul despre SUP plăci — gonflabile versus rigide, dimensiunile plăcilor, tehnologia materialelor și sfaturi de specialitate pentru toate nivelurile de îndemânare.
    guides:
      - title: Gonflabil vs Hard SUP
        desc: Compară iSUP-urile și plăcile epoxidice dure în funcție de portabilitate, durabilitate, performanță și valoare.
        href: /learn/sup
      - title: SUP Ghidul dimensiunilor plăcii
        desc: Cum influențează lungimea, lățimea și grosimea stabilitatea, viteza și manevrabilitatea.
        href: /learn/sup
      - title: SUP Întreținere și îngrijire
        desc: Sfaturi pentru curățare, depozitare, UV protecție și reparații pentru plăcile gonflabile SUP .
        href: /v2/inflatable-sup-maintenance
      - title: Alegerea primului SUPtău
        desc: Ghid pentru începători pentru alegerea plăcii potrivite pentru greutatea, nivelul tău de abilitate și utilizarea dorită.
        href: /learn/sup
  - title: Ghid pentru echipamente de scufundare
    tagline: Cunoștințe despre bărcile comerciale de scufundare
    desc: Ghiduri specializate pentru bărci de scufundare, scufundări RIBsși echipamente pentru centre de scufundări, operatori de scufundări și echipe comerciale de scufundări.
    guides:
      - title: Cea mai bună RIB barcă pentru centre de scufundări
        desc: Cum să alegi scufundarea RIB potrivită pentru centrul tău de scufundări — capacitate, configurație și considerente de buget.
        href: /solutions-diving-center-boats
      - title: RIB Ghid de configurare a scufundărilor
        desc: Caracteristici esențiale pentru RIBs scufundare — suporturi pentru rezervoare, sisteme de scări, platformă de scufundare și depozitare a echipamentului.
        href: /solutions-diving-center-boats
  - title: Ghid pentru tenderul pentru iahturi
    tagline: Soluții pentru Superiahturi și Tender Marine
    desc: Ghiduri pentru alegerea tenderului perfect pentru iaht — tenderi gonflabili, tenderi RIB, soluții de depozitare și accesorii pentru tender.
    guides:
      - title: Cum să Alegi un Tender pentru Iaht
        desc: Factori de luat în considerare la selectarea unui tender pentru iahtul tău — dimensiune, material, motor și depozitare.
        href: /solutions-yacht-tender-solutions
      - title: Tenderi Gonflabili vs Tenderi RIB
        desc: Compară tenderii gonflabili cu tenderii rigizi gonflabili pentru performanță, durabilitate și posibilitatea de depozitare.
        href: /compare/rib-vs-dinghy
  - title: Ghid de Echipamente de Salvare
    tagline: Cunoștințe despre Ambarcațiuni de Căutare și Salvare
    desc: Ghiduri profesionale despre bărci de salvare, ambarcațiuni SAR și echipamente de intervenție pentru paza de coastă, salvamari și echipe de ajutor în caz de dezastru.
    guides:
      - title: Ghid de Selecție a Bărcii SAR
        desc: Cum să alegi barca potrivită pentru căutare și salvare — viteză, capacitate, durabilitate și cerințe de echipamente specializate.
        href: /solutions-rescue-watercraft
      - title: RIB Comerciale pentru Operațiuni de Salvare
        desc: De ce RIBs de calitate comercială sunt alegerea preferată de echipele profesionale de căutare și salvare din întreaga lume.
        href: /use-cases/search-and-rescue
