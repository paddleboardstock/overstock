hero:
  tagline: Paddle Board Overstock Academie
  title: Centrul de Învățare
  subtitle: Ghiduri și tutoriale pentru orice nivel de abilitate — de la SUP elemente de bază la tehnici avansate de salvare
categories:
  - level: Începător
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Elemente de bază
        desc: Învățați fundamentele paddleboarding-ului — poziția, tehnica loviturii și echilibrul.
        slug: beginner-sup-guide
      - title: Tehnici de vâslire
        desc: Lovitura înainte, lovitura de măturare, lovitura de tragere și sprijinul jos — stăpâniți mișcările esențiale de vâslire.
        slug: sup-paddle-guide
      - title: Siguranța pe primul loc
        desc: Practici esențiale de siguranță, inclusiv verificarea vremii, utilizarea PFD, regulile pentru lesa și auto-salvarea.
        slug: sup-safety-guide
  - level: Intermediar
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Elemente esențiale pentru tururi
        desc: Planificarea de vâsliri de mai multe ore — navigație, hidratare, ritm și citirea prognozelor meteo.
        slug: touring-sup-guide
      - title: Citirea vremii
        desc: Interpretarea prognozelor marine, identificarea tiparelor de nori și înțelegerea efectelor vântului asupra apei.
        slug: weather-planning-water-sports
      - title: Elemente de bază în navigație
        desc: Citirea hărților, folosirea busolei, punctelor GPS și planificarea traseului pentru vâslire de coastă.
        slug: sup-navigation-guide
      - title: Conștientizarea mareelor
        desc: Înțelegerea ciclurilor de maree, curenților și cum afectează aceștia momentul de lansare și traseul.
        slug: understanding-tides
  - level: Avansat
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planificarea unei expediții de mai multe zile
        desc: Logistica expediției — selectarea echipamentului, planificarea alimentației, protocoale de siguranță și contacte de urgență.
        slug: sup-travel-guide
      - title: Tehnici de salvare
        desc: Protocoale de auto-salvare, salvare în formă de T și tractare pentru ape deschise.
        slug: sup-self-rescue
      - title: Vâslire pe timp de noapte
        desc: Navigația după lăsarea întunericului — cerințe de iluminare, memorarea traseului, comunicarea în grup și conștientizarea pericolelor.
        slug: sup-navigation-guide
  - level: Întreținere
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Curățare și Îngrijire
        desc: Clătire cu apă dulce, protecția UV, prevenirea mucegaiului și tehnici corecte de uscare după fiecare sesiune.
        slug: inflatable-sup-maintenance
      - title: Ghid de depozitare
        desc: Cele mai bune practici pentru depozitarea plăcilor gonflabile — deflație, pliere, controlul temperaturii și durata de valabilitate.
        slug: inflatable-sup-storage
      - title: Elemente de bază ale reparației
        desc: Repară mici înțepături, scurgeri în cusături și probleme cu supapele folosind PVC kituri de reparații și tehnici de reparație.
        slug: inflatable-sup-repair
      - title: Întreținerea supapelor
        desc: Identificați tipurile de supape (Halkey-Roberts, Boston, Leafield), curățați resturile și înlocuiți tijele defecte.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centru de cunoștințe
knowledge_center_title: Ghiduri și cunoștințe despre Paddle Board
knowledge_center_subtitle: Ghiduri de experți și sfaturi de cumpărare pentru padboarderi de orice nivel.
knowledge_sections:
  - title: Tehnologia și construcția plăcilor
    tagline: În interiorul plăcii tale de paddle
    desc: Cum sunt construite plăcile cu palete gonflabile — drop-stitch miezuri, straturi laminate, EVA terase și testarea presiunii din fabrică.
    guides:
      - title: Cum sunt fabricate plăcile cu palete
        desc: De la tăierea și laminarea materialelor până la testarea presiunii 100% — vezi cum fiecare scândură părăsește fabrica.
        href: /factory/process
      - title: Tehnologia de bază Drop-Stitch
        desc: Cum mii de filete interne creează o structură rigidă, gonflabilă la presiune înaltă.
        href: /learn/drop-stitch-core
      - title: Referință pentru materiale
        desc: PVC Au explicat ratingurile Denier, greutățile materialelor, UV rezistența și materialele de terasă.
        href: /learn/materials
      - title: Tehnologia plăcilor gonflabile
        desc: Cusături sudate, construcție a șinei și sisteme de supape care mențin placa rigidă și etanșă.
        href: /learn/inflatable-technology
  - title: Ghiduri de cumpărare
    tagline: Alege tabla potrivită
    desc: Tot ce ai nevoie pentru a alege primul — sau următorul — gonflabil SUP, de la mărime la construcție.
    guides:
      - title: Cum să alegi un SUP gonflabil
        desc: Factorii cheie — construcția, grosimea, configurarea aripioarelor și accesoriile incluse.
        href: /guides/how-to-choose-your-sup/
      - title: Ce este stand-up paddleboarding-ul?
        desc: O introducere prietenoasă în sport, echipament și de ce plăcile gonflabile fac ușor începutul.
        href: /guides/what-is-sup
      - title: Gonflabil vs Hard Board
        desc: Compară iSUP-urile și plăcile epoxidice dure în funcție de portabilitate, durabilitate, performanță și valoare.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Ghid de mărimi
        desc: Găsește lungimea, lățimea și volumul potrivite ale plăcii în funcție de greutatea, abilitatea și stilul tău de vâslit.
        href: /size-guide
  - title: Abilități și Siguranță
    tagline: Vâslește cu Încredere
    desc: Cunoștințe practice pentru fiecare sesiune — elemente de bază pentru începători, siguranță pe apă, întreținere și reparații.
    guides:
      - title: SUP Bazele — Ghid pentru începători
        desc: Tot ce trebuie să știe un începător — tipuri de plăci, dimensiunea paletei, poziția și sfaturi pentru prima zi.
        href: /v2/beginner-sup-guide
      - title: Elemente esențiale de siguranță la apă
        desc: Verificări meteo, selectarea PFD, reguli pentru lese, auto-salvare și bune practici pentru vâslitul în grup.
        href: /learn/water-safety
      - title: SUP Întreținere și îngrijire
        desc: Curățare, depozitare, protecția UV și sfaturi de îngrijire pentru plăcile gonflabile SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Bazele Reparării Plăcilor
        desc: Repară mici înțepături, scurgeri în cusături și probleme cu supapele folosind PVC kituri de reparații și tehnici de reparație.
        href: /v2/inflatable-sup-repair
