comparison_matrix:
  title: OEM vs. ODM — Care model se potrivește proiectului dvs.?
  subtitle: Patru moduri de colaborare, fiecare cu diferite niveluri de implicare a fabricii și control al brandului
  columns:
    - header: Mod de colaborare
    - header: Rolul brandului dvs.
    - header: Rolul Aquafarer
  rows:
    - option: Fabricare OEM
      standard: Furnizați brandul, specificațiile și cerințele de conformitate
      premium: Construiți conform specificațiilor dvs. folosind matrițele și liniile noastre de producție existente
    - option: ODM Personalizare
      standard: Selectați un model de bază, personalizați funcțiile și brandingul
      premium: Adaptați platforma dovedită RIB cu modificările dorite
    - option: Semi-Personalizat RIB
      standard: Definiți lungimea carenei, materialul tubului, configurarea punții și echipamentele
      premium: Modificați carena existentă cu configurație personalizată a tubului și planul punții
    - option: Dezvoltare complet personalizată
      standard: Oferiți cerințele conceptului și ale pieței țintă
      premium: Design de la zero — carenaj personalizat, matriță și documentație completă
content_customization:
  tagline: Ce poate fi personalizat
  title: RIB Personalizare<br />Opțiuni
  subtitle: Fiecare element al unei bărci RIB poate fi adaptat aplicației, pieței și cerințelor brandului dumneavoastră.
  items:
    - title: Cocă și structural
      description: Lungimea carenei (2,5–8,5 m), materialul carenei (fibra de sticlă GRP sau aluminiu marin de calitate), culoarea carenei (gelcoat sau vopsită), profilul chila (V adânc, V moderat, plat), tipul pupa (pupă închisă cu suport sau cu șant) și consolidarea structurală pentru cerințele de încărcare comercială.
      icon: tabler:sailboat
    - title: Țeavă și guler
      description: Materialul tubului (0,9–1,2 mm PVC sau 1,4–1,7 mm Hypalon/CSM), diametrul tubului (40–55 cm), numărul de camere (3–7), tipul supapei (Halkey-Roberts, Leafield D7 sau Boston), culoarea tubului (standard sau personalizată) și configurația conului/gulerului tubului.
      icon: tabler:circle
    - title: Aranjamentul punții și al consolei
      description: Consolă centrală, consolă laterală sau direcție cu cârmă. Configurația locurilor (scaune de tip jockey, bănci, scaune cu suport lateral). Acoperirea punții (spumă cu aspect de tec EVA, vopsea antiderapantă sau GRP gol). Puncte de montare a echipamentului, bare de prindere și pozițiile inelelor D.
      icon: tabler:layout-dashboard
    - title: Electric și Navigație
      description: Luminile de navigație (LED), sistemul pompei de santină, gestionarea bateriei, instalarea radio VHF, montarea GPS/chartplotter, porturi de încărcare USB și configurarea panoului de comutare.
      icon: tabler:bolt
    - title: Branding și Grafică
      description: Grafice pentru carenă și tuburi (serigrafie, transfer termic, imprimare digitală UV), plasarea logo-ului, scheme de culori personalizate, marcaje de identificare și documentație personalizată a proprietarului cu brandul dumneavoastră.
      icon: tabler:palette
    - title: Siguranță și conformitate
      description: Evaluarea categoriei de proiectare (A/B/C/D conform RCD), sistem de stingere a incendiilor, specificația sistemului de combustibil (rezervor portabil, rezervor fix, sub punte) și pachetul de documentație pentru conformitate pentru piața țintă.
      icon: tabler:shield
content_applications:
  tagline: Configurări aplicație
  title: RIB Configurații<br />Prin aplicare
  subtitle: Misiuni diferite necesită configurații diferite. Iată configurații dovedite pentru cele mai comune aplicații RIB.
  items:
    - title: Salvare și Patrulare
      description: Carena în V adânc, tuburi Hypalon, punte auto-scurgătoare, scaune cu suport, mânere de prindere, lumini de navigație și inele D rezistente. RCD Categoria de proiectare B sau C. Sistem de combustibil rezistent la foc și electricitate de calitate comercială.
      icon: tabler:lifebuoy
    - title: Suport pentru scufundări
      description: Fază lată, scară de îmbarcare în partea din spate, poziții pentru suport de bărci, cârlige D suplimentare, suport pentru steagul de scufundări, bordaj întărit pentru motoare duble și acoperire integrală a punții cu suprafață antiderapantă.
      icon: tabler:mask
    - title: Turism și Comercial
      description: Configurație certificată pentru pasageri, cu bănci, parasolar/Bimini, bare de prindere, spațiu de depozitare uscat și sistem cu baterii duble. RCD Categoria C. Proiectată pentru operațiuni în stațiuni și flote de închiriere.
      icon: tabler:beach
    - title: Pescuit
      description: Plan deschis al punții, pozițiile suporturilor pentru lansete, rezervor pentru momeală vie, montură pentru sonar, montură pentru motor de trolling, punte întărită și sistem de combustibil portabil. Opțiuni cu consolă centrală sau consolă laterală.
      icon: tabler:fish
    - title: Petrecere & Ambarcațiune Tender
      description: Carenaj ușor, tuburi PVC, locuri confortabile, cârma telescopică sau consolă compactă, puncte de ridicare pentru davit și rezervor de combustibil detașabil. RCD Categoria C sau D.
      icon: tabler:sailboat
    - title: Barcă Profesională de Lucru
      description: Opțiune de carenaj din aluminiu, armare robustă, direcție hidraulică, electricitate de calitate comercială, arc radar și puncte de integrare echipamente specifice misiunii. Conformitate personalizată în funcție de proiect.
      icon: tabler:anchor
process_steps:
  title: Proces de Dezvoltare în 7 Pași RIB OEM/ODM
  subtitle: De la brief-ul proiectului până la servicii post-vânzare — un flux de lucru definit cu repere și livrabile clare
  steps:
    - number: '01'
      title: Brief & Cerințe Proiect
      description: Definiți aplicația țintă, dimensiunea carenajului, materialul tubului, cerințele de conformitate și nevoile de branding. Evaluăm fezabilitatea și confirmăm modelul de colaborare (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 zile
    - number: '02'
      title: Revizuire Tehnică & Fezabilitate
      description: Echipa de inginerie verifică fezabilitatea structurală, calculele de stabilitate și flotabilitate, calea de conformitate și disponibilitatea materialelor. Identificăm matrițele existente sau cerințele pentru matrițe personalizate.
      timeline: 5–7 zile
    - number: '03'
      title: Propunere & Cotare
      description: Primiți o propunere detaliată inclusiv specificații, randări 3D sau desene GA, domeniul de conformitate, calendar și preț pe unitate în funcție de volume și MOQ.
      timeline: 5–7 zile
    - number: '04'
      title: Confirmare Design & Prelevare de Mostre
      description: Aprobați GA final, layout-ul punții și configurația tuburilor. Producem o mostră pre-producție cu culorile brandului dvs., logo-ul și materialele specificate pentru inspecția fizică.
      timeline: 15–20 zile
    - number: '05'
      title: Aprobarea Mostrei & Protocol QC
      description: 'Inspectați și aprobați mostra. Definiți protocolul QC de producție: test de presiune (1,25x / 24–48h), verificări dimensionale și lista documentației de conformitate pe carenaj.'
      timeline: 3–5 zile
    - number: '06'
      title: Producție de Masă & Controlul Calității
      description: Serii complete de producție cu checklist QC de 100 de puncte pe unitate. Inspecții în curs de proces, testare de presiune și trasabilitate la nivel serial. Documentația CE/ISO pregătită în paralel.
      timeline: 30–45 zile
    - number: '07'
      title: Ambalare, Expediere & Servicii Post-Vânzare
      description: Ambalare personalizată (standard, gata pentru retail sau paletizată), documentație de export, încărcarea containerelor și logistică. Kituri de piese de schimb și documentație de întreținere incluse.
      timeline: 7–14 zile
certifications:
  title: Conformitate & Certificate pentru Bărci RIB
  subtitle: Fiecare comandă personalizată RIB este livrată cu documentația de conformitate specifică modelului.
  items:
    - name: CE 2013/53/UE
      description: Conformitate RCD pe model și categorie de design — DoC, plăcuță constructor, manual de utilizare inclus
      badge: CE
    - name: 9001:2015
      description: Sistem de management al calității certificat de SGS acoperind proiectarea, producția și distribuția
      badge: ISO
    - name: RO ISO 6185
      description: Standard de construcție a bărcilor gonflabile — stabilitate, flotabilitate și recuperarea persoanei căzute peste bord
      badge: 6185
    - name: RO ISO 14945
      description: Placă standard a constructorului — informații de identificare și capacitate marcate permanent
      badge: 14945
    - name: BSCI
      description: Audit de conformitate socială pentru producție etică — cerut de comercianții cu amănuntul din UE
      badge: BSCI
    - name: REACH
      description: Conformitatea cu siguranța chimică a UE pentru PVC, Hypalon, adezivi și vopsele
      badge: REACH
content_service_modules:
  tagline: Module de servicii
  title: OEM/ODM Serviciu<br />Module
  subtitle: Fiecare proiect combină modulele de servicii potrivite. Nu fiecare proiect are nevoie de toate modulele — noi stabilim doar ce necesită proiectul dumneavoastră.
  items:
    - title: Revizuirea inginerească și fezabilitatea
      description: 'Evaluarea platformei corpului, verificarea fezabilității structurale, verificarea stabilității și a flotabilității, identificarea căii de conformitate și confirmarea disponibilității materialelor. Rezultat: raport de fezabilitate cu recomandare de continuare/oprire.'
      icon: tabler:math-function
    - title: Proiectare și Configurare
      description: 'Desen GA, planul punții, configurația tubului, pozițiile consolei și scaunelor, planul de montare a echipamentului și selecția de culori/materiale. Rezultatul: specificație GA și de configurație aprobată.'
      icon: tabler:ruler
    - title: Eșantion & Prototip
      description: Mostră de pre-producție cu culorile, logo-ul și materialele specificate aprobate pentru inspectare fizică. Include protocolul de aprobare a mostrei, lista de verificare pentru inspectare și procesul de solicitare a modificărilor.
      icon: tabler:3d-cube-sphere
    - title: Producție și Controlul Calității
      description: Producție de masă cu listă de control QC de 100 de puncte pentru fiecare unitate, inspecții în proces, testare la presiune (1,25x / 24-48h) și trasabilitate la nivel de serie. Documentație CE/ISO pregătită în paralel.
      icon: tabler:clipboard-check
    - title: Branding și Ambalaje
      description: Aplicarea logo-ului privat, grafice personalizate pentru carcasă și tub, documentație pentru proprietar cu marcă, ambalaj gata pentru vânzare cu amănuntul sau ambalat pe paleți și pregătirea kitului de piese de schimb.
      icon: tabler:palette
    - title: Export și Documentație
      description: Împachetarea pentru export, planul de încărcare a containerului, documentația FOB/CIF/DDP, documentele de conformitate conform pieței de destinație și protocolul de comunicare post-livrare.
      icon: tabler:world
content_risk_control:
  tagline: Controlul Riscului și al Livrării
  title: Riscul proiectului &<br />Managementul livrărilor
  subtitle: Cumpărătorii profesioniști OEM/ODM se preocupă de controlul riscurilor la fel de mult ca de calitatea produsului. Iată cum îl gestionăm.
  items:
    - title: Definirea Domeniului și Proprietății
      description: 'Înainte de începerea dezvoltării, definim în scris: domeniul de personalizare, cerințele de scule, criteriile de aprobare a probelor, proprietatea asupra desenelor și matrițelor și responsabilitățile de documentare. Fără ambiguități legate de cine deține ce.'
      icon: tabler:file-text
    - title: Procesul de Control al Schimbărilor
      description: Toate modificările specificațiilor după confirmarea proiectării urmează un proces documentat de solicitare a modificărilor cu evaluare a impactului (cost, calendar, conformitate). Nicio modificare neaprobată nu intră în producție.
      icon: tabler:arrows-diff
    - title: Garanția de Consistență a Loturii
      description: A 50-a unitate corespunde cu prima probă aprobată. Specificațiile aprobate sunt congelate, parametrii materialului și procesului sunt blocați, iar punctele de control în proces verifică consistența pe parcursul producției.
      icon: tabler:repeat
    - title: Livrarea și transparența capacității
      description: Timpii de livrare sunt cotați pe baza capacității reale de producție, nivelurilor stocurilor de materiale și încărcăturii curente a comenzilor — nu a țintelor aspiraționale. Programul de producție cu date de repere oferite pentru fiecare comandă.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Întrebări frecvente
  questions:
    - q: Care este diferența dintre OEM și ODM pentru RIB bărci?
      a: 'OEM (Fabricarea Echipamentelor Originale): furnizați specificații detaliate și noi construim designul dumneavoastră.ODM (Fabricarea Designului Original): selectați o Aquafarer RIB platformă dovedită, iar noi o personalizăm în funcție de caracteristicile și brandingul dorit.ODM este mai rapidă și cu costuri mai mici;OEM oferă control maxim al designului.'
    - q: Pot personaliza RIB forma și dimensiunea carenei?
      a: Da. Oferim modificări semi-personalizate pentru matrițele de carenă existente (diferite configurații de punte, configurații de tuburi) și dezvoltare completă personalizată a carcasei cu CNCmatrițe noi prelucrate. Proiectele semi-personalizate pot începe de la 2-5 unități; cele complet personalizate necesită de obicei angajamente mai mari.
    - q: Ce materiale pentru tuburi sunt disponibile pentru RIBspersonalizare?
      a: Oferim 0,9-1,2 mm PVC pentru uz recreațional și comercial ușor, și 1,4-1,7 HypalonmmCSM / pentru aplicații profesionale, de salvare și comerciale care necesită UV rezistență superioară și la ozon (durată de viață de 10-15 ani față de 5-8 ani PVCpentru ).
    - q: Poți configura RIBs pentru aplicații specifice precum salvare, scufundări sau pescuit?
      a: Da. Menținem șabloane de configurare dovedite pentru aplicații de salvare/patrulare, suport pentru scufundări, turism/charter, pescuit, tender pentru iahturi și aplicații profesionale de bărci de lucru. Fiecare șablon include tipul recomandat de carenă, materialul tubului, configurația punții și echipamentele — pe care apoi le personalizăm exact după cerințele tale.
    - q: Ce informații ai nevoie pentru o RIB OEMODM ofertă?
      a: Aplicația țintă, lungimea dorită a carcasei, preferința materialului tuburilor (PVC Hypalonsau ), cantitatea aproximativă și programul de livrare, cerințele de conformitate pentru piața țintă și orice produse sau specificații de referință. Cu cât oferi mai multe detalii, cu atât cotația noastră este mai rapidă și mai precisă.
    - q: Ce este MOQ pentru RIB bărcile personalizate?
      a: Pentru matrițele de carenă existente cu modificări standard, MOQ începe de la 2-5 unități pe design. Pentru matrițe personalizate și dezvoltare completă personalizată, MOQ depinde de complexitatea proiectului — de obicei 10-20 de unități pentru semi-personalizate și 30+ pentru cele complet personalizate cu scule noi.
    - q: Cine deține matrițele și desenele personalizate?
      a: Matrițele dezvoltate folosind Aquafarer designuri de bază rămân Aquafarer proprietate. Matrițele complet personalizate, comandate și plătite de client, pot fi cedate proprietății clientului conform termenilor contractului. Toate termenii de proprietate pentru matriță sunt documentați înainte de începerea proiectului.
    - q: Cum sunt RIBs ambalate personalizat pentru export?
      a: 'Standard: + folie stretch-wrap personalizată pentru încărcarea containerelor. Premium: ambalare gata de vânzare cu amănuntul, cu ambalare vid sau cu palete. Oferim FOB Qingdao, CIF, și DDP livrare. Documentație completă de export și defilare vamală incluse.'
