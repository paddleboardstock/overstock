features3_cases:
  tagline: Povești de top
  title: Real Boards<br />Pentru aventuri reale
  isBeforeContent: false
  columns: 3
  items:
    - title: De la canapea la stat în picioare din prima încercare
      customer: Vâslă pentru prima dată
      country: Germania
      industry: Recreere pentru începători
      challenge: Anna nu vâslise niciodată înainte și era nervoasă din cauza echilibrului, a apei reci și a părea ridicolă în fața altora. Locuind într-un apartament mic din München, nu avea unde să depoziteze o placă rigidă și niciun portbagaj pe acoperiș pentru transport.
      solution: SUP Explorer 11 oferă o platformă largă și stabilă care iartă primele mișcări nesigure. Pachetul complet — placă, paletă reglabilă, pompă, lesă și geantă — îi permitea să transporte totul pe jos până la lac. De la cutie la apă în mai puțin de 20 de minute, fără a fi nevoie de experiență.
      product: Explorer 11
      results: Anna s-a ridicat din prima încercare și a vâslit timp de o oră fără să cadă. Două luni mai târziu, vâslește de trei ori pe săptămână și s-a alăturat unui grup local de întâlnire. Placa se împachetează într-un rucsac care încape în dulapul de pe hol.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Mă așteptam să petrec prima zi înotând lângă placă. În schimb, în câteva minute am alunecat peste lac — nu-mi venea să cred cât de stabil se simte.
      icon: tabler:school
    - title: O singură placă, doi copii, zero plângeri
      customer: Familie de patru persoane
      country: Italia
      industry: Recreere pentru familie
      challenge: Marco și Giulia își doreau o activitate de vară pentru care cei doi copii chiar să lase ecranele lor. Gonflabilele ieftine anterioare s-au deformat, au scurs la cusături și s-au dezumflat la mijlocul vâslei — copiii și-au pierdut încrederea după o singură înotare proastă.
      solution: Seria Tropical Breeze aduce o pânză completă de vacanță pe insulă — soare, livezi de nuci de cocos și scene de plajă — care i-au făcut pe copii să vrea să intre pe apă. drop-stitch Nucleul funcționează rigid la 15 PSI minute, iar fiecare placă este testată la presiune la 1,25 ori presiunea nominală timp de 24-48 de ore în fabrică înainte de expediere.
      product: Seria Briză Tropicală
      results: Familia vâslește acum în fiecare weekend, din iunie până în septembrie. După un sezon întreg de trafic cu copii, placa nu prezintă stres la cusături sau estompări. Fiica lor a început să ceară propria placă de ziua ei.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: Copiii se ceartă pentru a cui e rândul să vâslească. După plăcile ieftine pe care le-am încercat înainte, aceasta pare construită să supraviețuiască exact familiei noastre.
      icon: tabler:users
    - title: Un studio plutitor de yoga la răsărit
      customer: Practicant de yoga
      country: Indonezia
      industry: SUP Yoga și meditație
      challenge: Putu predă yoga în Bali și a vrut să-și ducă practica pe apă, dar primele încercări pe o placă împrumutată i s-au părut alunecoase și instabile. Menținerea unei poziții în timp ce plutești pe apă deschisă cere aderență, stabilitate și un design calm.
      solution: Seria Flowing Lotus combină lucrări de artă cu lotus, koi și libelulele cu o pernă de tracțiune gravată cu laser, care menține mâinile și picioarele ancorate în poziția de câine în jos. Conturul larg și complet și grosimea de 6 inch creează o platformă plutitoare constantă pentru curgeri și meditație așezată.
      product: Seria Lotus Curgătoare
      results: Putu conduce acum SUP mici cursuri de yoga la răsărit de două ori pe săptămână. Elevii ei rezervă cu săptămâni înainte, iar panoul a devenit semnătura cursurilor sale — arta face jumătate din marketingul ei pentru ea.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Exersarea pe apă schimbă totul. Tabla este suficient de stabilă pentru poziția corbului, iar designul lotusului face ca fiecare clasă să pară un ritual.
      icon: tabler:heart
    - title: Culoare Încorporată în Material — Literalmente
      customer: Creator de conținut pentru călătorii
      country: Portugalia
      industry: Social Media și Crearea de conținut
      challenge: Miguel filmează conținut cu palete pentru a-și câștiga existența. Plăcile tipărite pe care le folosea înainte și-au pierdut culoarea într-un sezon de apă sărată și soare — imaginile lui au început să pară obosite, iar urmăritorii au observat platformele de pe punte care se decojeau.
      solution: Ediția Cheetah Surge își construiește motivul de ghepard din piese tip bloc decupate și multicolore EVA, mai degrabă decât din cerneală aplicată pe suprafață. Culorile fac parte din spuma însăși, astfel încât apa sărată, UV și traficul pietonal sunt mult mai puțin susceptibile să decoloreze, să exfolieze sau să zgârie designul.
      product: Ediția Cheetah Surge
      results: După un an întreg de ședințe foto de coastă, board-ul arată complet nou pe cameră. Clipurile sale cu răsăritul soarelui din Algarve au devenit cel mai performant conținut al său, iar board-ul apare în zeci de colaborări cu branduri.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Plăcile mele vechi au îmbătrânit mai repede decât conținutul meu. Cheetah-ul arată identic cu prima zi după un an petrecut în ocean — urmăritorii mei mă întreabă mereu ce filtru folosesc. Nu este niciun filtru. Este panoul.
      icon: tabler:camera
    - title: Expediții de coastă de weekend
      customer: Vâslaș de turism de coastă
      country: Australia
      industry: Tur și Explorare
      challenge: Tom voia să vâslească golfurile și promontoriile liniștite ale Gold Coast în tururi de mai multe ore, dar plăcile ușoare de buget s-au încordat în valuri și l-au lăsat epuizat după o oră. Avea nevoie de rigiditate pe care să o poată duce singur până la locurile de aport îndepărtate.
      solution: Seria Ocean Voyager combină o lucrare de artă cu broască țestoasă marină în teal adânc și coral cu un drop-stitch miez rigid care păstrează forma prin valuri ușoare de coastă. Cu aproximativ 20 lbs în rucsac, Tom o poate duce pe jos până la plaje la care nicio mașină nu poate ajunge, o poate umfla cu pompa inclusă și poate face tururi ore întregi.
      product: Seria Ocean Voyager
      results: Tom a cartografiat acum unsprezece rute de coastă, inclusiv o traversare întreagă de dimineață pe care odată o considera dincolo de nivelul său. Placa rămâne rigidă de la lansare până la prânz, iar designul broască țestoasă de mare a devenit semnătura sa recunoscută pe apă.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Plăcile rigide se simt ca plăcile rigide, iar aceasta se poartă ca un rucsac. A deschis o întreagă linie de coastă la care nu aș fi putut ajunge niciodată cu o mașină și o remorcă.
      icon: tabler:compass
    - title: Fitness pentru tot corpul, taxe zero la sală
      customer: Vâslaș de fitness
      country: Canada
      industry: Fitness & Antrenament
      challenge: Priya își dorea un antrenament cu impact redus pentru tot corpul, care să nu se simtă ca un antrenament. Alergatul îi durea genunchii, iar sala de sport părea repetitivă — a renunțat la fiecare rutină în șase săptămâni.
      solution: 'Seria Dolphin Wave a transformat exercițiul în joacă: vâslitul arde calorii, întărește trunchiul și umerii și provoacă echilibrul, toate acestea în timp ce plutești pe lângă peisajul din Vancouver. Platforma stabilă de 32 inch iartă loviturile stângace, dar cere totuși un micro-echilibru constant — o sală de sport deghizată în placă de vâslit.'
      product: Seria Dolphin Wave
      results: Priya vâslește cinci dimineți pe săptămână înainte de muncă și a menținut rutina timp de 14 luni — recordul ei personal pentru orice plan de exerciții. Prietenii ei se alătură acum clubului ei săptămânal de vâslit, iar genunchii ei nu au fost niciodată mai fericiți.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Niciodată nu a trebuit să mă forțez să vâslesc. Antrenamentul este real — pur și simplu am încetat să-l mai observ pentru că sunt prea ocupat să mă bucur de apă.
      icon: tabler:trophy
    - title: Un labrador de 30 de kilograme și o punte foarte stabilă
      customer: Vâslaș cu un câine
      country: Statele Unite
      industry: Vâslind cu animale de companie
      challenge: Jake voia să-și aducă labradorul, Biscuit, pe apă, dar placa lui veche și îngustă s-a transformat într-un submarin în momentul în care câinele a sărit la bord. Ghearele au sfâșiat și platforma ieftină de pe punte în câteva săptămâni.
      solution: Seria Leviathan Wake oferă o platformă largă, cu volum mare, care transportă vâslașul plus un pasager de 30 de kilograme fără să se lase să se lase în jos. EVA Platforma de tracțiune supraviețuiește ghearelor care i-au distrus placa anterioară, iar totemul balenei albastre îi oferă lui Biscuit un "loc" clar vizibil pe care să stea.
      product: Seria Leviathan Wake
      results: Acum Biscuit sare la bord la comandă și călărește prova ca o figură decorativă. După două veri, puntea nu prezintă nicio daună la gheare, iar vâsselile lor de râu au devenit cel mai apreciat conținut de pe feed-ul lui Jake.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: Mi-am cumpărat o placă și am luat un secund. Puntea a ignorat tot ce putea arunca un câine mare și ud.
      icon: tabler:dog
    - title: Buget pentru studenți, calitate la preț întreg
      customer: Student universitar
      country: Polonia
      industry: Stilul de viață al studenților
      challenge: Kasia este studentă în Gdansk, cu un buget de elev și o rutină de vară la lac. Fiecare placă ieftină pe care a găsit-o era fie fragilă, fie urâtă, sau ambele — iar plăcile de calitate costă mai mult decât bugetul ei lunar de mâncare.
      solution: Seria Medusa Glow combină construcția premium — drop-stitch miez, PSI rigiditate 15, artă de meduză în verde mentă asamblată din blocuri decupate EVA — cu Paddle Board Overstock prețuri de reducere directă din fabrică, care evită orice marjă intermediară.
      product: Seria Medusa Glow
      results: Kasia a plătit mai puțin de jumătate din cât se vând plăcile premium comparabile local. Placa ei a rezistat unui sezon complet de sesiuni zilnice la lac și unei săptămâni pe plaja baltică, iar trei colegi și-au comandat propria placă după ce au încercat-o pe a ei.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Mă așteptam la compromisuri bugetare între studenți. În schimb, am luat o placă pe care prietenii mei credeau că o costă de trei ori mai mult — și a rezistat mai mult decât două dintre ale lor.
      icon: tabler:backpack
    - title: Lăsarea de pe o platformă stabilă
      customer: Pescar de weekend
      country: Statele Unite
      industry: Pescuit ocazional SUP
      challenge: Devon pescuiește în ape liniștite, prea puțin adânci pentru ca orice ambarcațiune cu motor să le poată atinge. Avea nevoie de o ambarcațiune cu vâsle suficient de stabilă pentru a arunca în picioare, suficient de rezistentă pentru cârlige și echipament și suficient de ușoară pentru a fi purtată pe o potecă la răsărit.
      solution: Seria Jungle Mandala îi oferă o platformă largă și rigidă pentru aruncare, cu o platformă pentru hibiscus și colibri în albastru Tiffany care rămâne răcoroasă sub soarele dimineții. Placa se împachetează la dimensiunea unui rucsac pentru traseu, se umflă în câteva minute la marginea apei, iar PVC pielea întărită se descurcă de agățări și lovituri de aripioare.
      product: Seria Jungle Mandala
      results: Devon ajunge acum la trei golfuri de reproducere pe care nimeni altcineva nu le poate pescui. Rata sa de captură s-a dublat pe parcursul sezonului, iar tabla — cârlige, șnurul și toate celelalte — pare încă pregătită pentru o altă vară.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Să stau în picioare SUP pe un pește mi-a schimbat complet modul în care pescuiesc. Această placă este suficient de stabilă pentru a arunca, a pune cârligul și a prinde un pește — toate fără să mă ud.
      icon: tabler:fish
