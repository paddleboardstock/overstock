features3_cases:
  tagline: Cazuri prezentate
  title: Soluții personalizate<br />Pentru provocări reale
  isBeforeContent: false
  columns: 3
  items:
    - title: Modernizarea Operațiunilor Zilnice a Centrului de Scufundări Bali
      customer: Centrul de Scufundări Blue Ocean
      country: Indonezia
      industry: Centrul Comercial de Scufundări
      challenge: Blue Ocean Diving Center din Bali opera o barcă de scufundare veche din fibră de sticlă, cu spațiu limitat pe punte, îmbarcare dificilă pentru scafandri și întreținere ridicată în condiții tropicale de apă sărată. Încărcarea echipamentului era aglomerată, timpul de pregătire lung, iar platforma instabilă crea probleme de siguranță pentru turiștii internaționali — inclusiv pentru scafandri debutanți și călători mai în vârstă. Centrul organizează 3-5 excursii de scufundări zilnic, 200 de+ zile pe an.
      solution: Paddle Board Overstock a furnizat o platformă de scufundări profesională personalizată de 6,8 RIB m, cu un layout extins al punții, optimizată pentru depozitarea echipamentului de scufundare, scară lată din oțel inoxidabil, Hypalon tuburi rezistente UV și rezistență la apă sărată, suprafață antiderapantă a puntei și soluție de depozitare a rezervorului. Configurația a fost concepută în jurul fluxului zilnic de proces al centrului de scufundări — nu bazată pe o configurație standard de bărci de recreere.
      product: Sărituri RIBîn apă profesionistă de 6,8 m
      results: O suprafață de lucru mai mare a îmbunătățit eficiența pregătirii echipamentelor. Scafandrii au experimentat abordări mai sigure și mai ușoare. Cerințele de întreținere au scăzut semnificativ. Centrul a câștigat capacitatea de a gestiona mai mulți clienți în sezonul de vârf cu mai multă încredere. RIB Aceasta a devenit baza operațiunilor zilnice de scufundări.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Barca noastră de scufundări nu este doar mijloc de transport. Este baza operațiunilor noastre zilnice.Paddle Board Overstock RIB Oferă echipei noastre mai multă încredere când organizăm mai multe excursii de scufundări în fiecare zi.
      icon: tabler:lifebuoy
    - title: Modernizarea profesională a Centrului de Scufundări Phuket RIB
      customer: Centrul de Scufundări Ocean Explorer
      country: Thailanda
      industry: Centrul Comercial de Scufundări
      challenge: Ocean Explorer Diving Center din Phuket, Thailanda, a trebuit să facă upgrade de la o barcă tradițională de scufundare din fibră de sticlă, care nu putea ține pasul cu cererea tot mai mare a clienților. Spațiul limitat pe punte a făcut ca pregătirea echipamentului să fie ineficientă. Îmbarcarea dificilă a creat provocări de siguranță pentru turiștii internaționali. Cerințele ridicate de întreținere în condiții tropicale de apă sărată au crescut costurile operaționale. Centrul operează mai multe curse zilnice, 200+ de zile pe an.
      solution: Paddle Board Overstock a livrat o scufundare comercială personalizată de 6,8 RIB m, cu o configurație optimizată a punții de lucru pentru depozitarea rezervorului de scufundări, pregătirea echipamentului și mișcarea scafandrilor. Caracteristicile au inclus scară lată de scufundare cu balustrade din oțel inoxidabil, construcție robustă din UVtuburi cu materiale rezistente, pardoseală antiderapantă, soluție de depozitare a rezervoarelor, consolă profesională și scaune pentru pasageri — toate configurate pentru operațiuni comerciale de scufundare.
      product: Sărituri comerciale RIBde 6,8 m
      results: O suprafață mai mare a punții a permis organizarea mai rapidă a echipamentelor și fluxul de lucru zilnic mai eficient. Confortul și siguranța clienților pentru îmbarcare s-au îmbunătățit semnificativ. Timpul de nefuncționare pentru întreținere a scăzut odată cu construcțiile de calitate marină. Centrul de scufundări putea deservi mai mulți clienți în sezonul de vârf și putea extinde serviciile profesionale de scufundare cu încredere.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Pentru un centru de scufundări, barca nu este doar un mijloc de transport. Este o parte importantă a operațiunilor noastre zilnice.Paddle Board Overstock RIB Oferă echipei noastre încredere să organizeze mai multe excursii de scufundări în fiecare zi cu mai multă siguranță și eficiență.
      icon: tabler:lifebuoy
    - title: Flota Centrului European de Scufundări
      customer: Centrele de scufundări BlueMed
      country: Grecia
      industry: Scufundări și turism marin
      challenge: A fost nevoie de 12 scufundări RIBs configurate pentru un lanț de centre de scufundare pe mai multe insule grecești. Fiecare barcă avea nevoie de scară de scufundare personalizată, depozitare pentru 8 rezervoare și platformă stabilă pentru intrarea scafandrilor în ape deschise. Flota trebuia să ajungă în termen de 60 de zile pentru începutul sezonului turistic.
      solution: A produs 12 RIB modele 520 Dive cu suporturi integrate pentru rezervoare, scări de scufundare și Hypalon tuburi extra late pentru stabilitatea la îmbarcare. Fiecare barcă a fost branduită cu schema de vopsire a flotei clientului. Toate cele 12 bărci au fost testate la presiune și expediate din Qingdao în decurs de 55 de zile.
      product: RIB 520 Dive
      results: Toate cele 12 bărci au fost livrate la timp pentru sezonul turistic. Flota funcționează zilnic de 18+ luni fără nicio defecțiune materială. Clientul a comandat 6 unități suplimentare în al doilea an.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive a fost coloana vertebrală a operațiunilor noastre zilnice de scufundare. Stabilitatea în repaus este excelentă, iar structura de depozitare a rezervorului menține puntea curată și sigură pentru oaspeții noștri.
      icon: tabler:lifebuoy
    - title: Programul Australian de Distribuire OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Producție
      challenge: Distribuitorul australian avea nevoie de o SUP gamă de plăci private la prețuri competitive pentru a concura cu brandurile chineze direct către consumator. Au fost necesare 8 modele unice, acoperind de la începători la avansați, cu grafică personalizată, ambalaje personalizate și livrare drop-shipping către magazinele de retail.
      solution: A dezvoltat 8 SUP modele (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) cu pachet grafic exclusiv australian. Ambalaj personalizat pentru retail cu coduri QR care leagă videoclipuri de configurare. Logistică drop-ship configurată direct din Qingdao către magazinele de retail australiene.
      product: SUP Custom Line (8 modele)
      results: Conceptul până la prima livrare în 90 de zile. Rata de vânzare cu amănuntul de 85% în primul sezon. Distribuitorul a extins parteneriatul pentru a include linia de bărci gonflabile în al doilea an.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock A livrat o SUP linie completă în 90 de zile — de la designul inițial până la nivelul de retail. Calitatea se ridică la nivelul mărcilor care vând la dublul prețului.
      icon: tabler:arrows-exchange
    - title: Aprovizionarea cu bărci de salvare din Orientul Mijlociu
      customer: Autoritatea Națională de Apărare Civilă
      country: Emiratele Arabe Unite
      industry: Căutare și Salvare
      challenge: Organizația de apărare civilă avea nevoie de 20 de aeronave pregătite pentru RIBs patrulare pentru căutare și salvare pe coastă, securitatea porturilor și răspunsul la inundații. Au necesitat punți auto-scălante, suite complete de navigație (GPS, radar, VHF), tuburi portocalii cu vizibilitate ridicată și conformitatea cu reglementările maritime locale.
      solution: A furnizat 20 RIB de modele 450 Patrol cu punți auto-scapabile, suite de navigație Garmin, reflectoare LED, SOLAS bandă reflectorizantă și Hypalon tuburi portocalii vizibile. Fiecare barcă a fost CEcertificată și testată conform ISO standardelor 6185. Pachetul de documentație includea certificate de conformitate pentru înregistrarea locală.
      product: RIB Patrula 450
      results: Flota a fost desfășurată pe 5 stații de coastă. Bărcile au operat în căldură extremă (45°C+), fără degradare a tuburilor. Autonomia de patrulare și eficiența consumului de combustibil au depășit specificațiile cu 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB Patrula 450 a depășit cerințele noastre operaționale. În condiții de căldură extremă, Hypalon tuburile nu prezintă semne de UV degradare după 24 de luni de utilizare zilnică.
      icon: tabler:alert-triangle
    - title: OEM Parteneriat European de Brand
      customer: Echipamentele Maritime ale Mării Nordului BV
      country: Țările de Jos
      industry: OEM/ODM Producție
      challenge: Brandul european european de marcă a dorit să se extindă pe RIB piață fără a investi în facilități de producție. Avea nevoie de un partener white label capabil să producă 5 RIB modele (3,9 milioane până la 6,2 milioane) cu branding privat, CE certificare și drepturi exclusive de distribuție în UE.
      solution: A stabilit un acord de producție white-label pentru 5 RIB modele. Fiecare model a fost branduit cu logo-urile clienților și schema de culori.CE Documentația de certificare a fost pregătită pentru fiecare model. Drepturile exclusive de distribuție în UE acordate cu angajamente minime de comandă. Documentația tehnică și catalogul pieselor de schimb sunt furnizate pentru rețeaua locală de service.
      product: RIB Custom Line (5 modele)
      results: Acordul pe mai mulți ani semnat. Prima producție de 50 de unități expediate în 75 de zile. Brandul a fost lansat la METSTRADE cu o primire pozitivă din partea dealerilor.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Colaborarea Paddle Board Overstock ne-a permis să intrăm pe RIB piață fără să construim o fabrică — au livrat o soluție completă la cheie, cu CE certificare și documentație de suport pentru dealeri.
      icon: tabler:building
    - title: Flota de stațiuni din Caraibe
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Turism Maritim și Ospitalitate
      challenge: 'Stațiunea de lux avea nevoie de o flotă completă de echipamente pentru sporturi nautice pentru activitățile oaspeților: 40 SUP de scânduri pentru tururi ghidate, 20 de caiace pentru explorarea lagunei, 10 bărci gonflabile pentru transferuri pentru oaspeți și excursii de pescuit, plus accesorii. Toate echipamentele necesitau branding personalizat pentru resort și trebuiau livrate înainte de sezonul de vârf al turismului.'
      solution: 'Pachet complet de sporturi nautice produse: 40 SUP de plăci Voyager (model All-Around), 20 de caiace Explorer, 10 AirDeck bărci gonflabile 360, plus PFD-uri, vâsle, pompe și kituri de reparații. Toate echipamentele sunt tipărite cu logo-ul resortului și schema de culori tropicale. Expediere containerizată cu manifest de inventar complet.'
      product: Pachet complet pentru sporturi nautice (70+ de unități)
      results: Flota a sosit cu 6 săptămâni înainte de sezonul de vârf. Scorurile de satisfacție ale oaspeților pentru activitățile acvatice au crescut cu 40% de la an la an. Echipamentul a rezistat 3 sezoane cu doar întreținere de rutină.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Abordarea completă a însemnat că am primit tot ce aveam nevoie într-o singură livrare — plăci, caiace, bărci și accesorii, toate branduite și gata pentru utilizarea oaspeților. Oaspeții noștri adoră calitatea echipamentului.
      icon: tabler:beach
    - title: Modernizarea Centrului Comercial de Scufundări Queensland RIB
      customer: Centrul Comercial de Scufundări
      country: Australia
      industry: Scufundări comerciale și servicii maritime
      challenge: Un centru comercial de scufundări din Queensland, specializat în inspecția infrastructurii maritime, întreținerea portului și proiecte de reparații subacvatice, opera o barcă de lucru îmbătrânită. Pe măsură ce cererea pentru proiecte a crescut, vechea navă a devenit o povară — întreținerea frecventă provoca perturbări de programare, amenajarea nu era proiectată pentru operațiuni moderne de scufundare (spațiu limitat pentru cilindri, unelte și echipamente), iar confortul echipajului în timpul operațiunilor lungi era slab. Compania avea nevoie de o navă care să poată susține operațiunile lor profesionale în fiecare zi lucrătoare.
      solution: Paddle Board Overstock A realizat o analiză operațională detaliată a fluxului de lucru al clientului pentru scufundări, durata tipică a proiectului, dimensiunea echipajului și cerințele de echipament. Pe baza acestei analize, Paddle Board Overstock a livrat un profesionist RIB personalizat, cu o configurație funcțională a punții optimizată pentru pregătirea echipamentului și mișcarea scafandrilor, scaune profesionale pentru perioade mai lungi de transport, stabilitate sporită pentru intrarea și ieșirea mai sigură a scafandrilor și caracteristici de suport pentru scufundări integrate în design.
      product: Scufundări RIBprofesionale personalizate
      results: Noua RIB platformă a devenit o platformă de lucru zilnică de încredere. Pregătirea echipamentului a devenit mai rapidă datorită configurației optimizate. Echipajul a raportat o îmbunătățire a confortului și siguranței în timpul operațiunilor îndelungate. Aspectul profesional al bărcii a consolidat încrederea clienților în colaborarea cu operatorii portuari și contractorii maritimi. Centrul de scufundări a obținut o navă care a egalat profesionalismul serviciului lor.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Aveam nevoie de o barcă care să poată susține afacerea noastră în fiecare zi, nu doar un vas pentru transport. Paddle Board Overstock a colaborat cu noi pentru a înțelege cerințele noastre operaționale și a livrat o soluție RIB care se potrivește fluxului nostru de lucru în scafandria comercială.
      icon: tabler:lifebuoy
    - title: Contract de patrulare a coastelor SUA
      customer: Agenția de Securitate a Coastei Atlanticului
      country: Statele Unite
      industry: Securitate Maritimă și Aplicarea Legii
      challenge: Agenția de securitate coastală a SUA a avut nevoie de o patrulă de mare tonaj RIBs pentru operațiuni de interceptare în ape deschise. Era necesară o configurație cu două motoare pentru redundanță, consolă blindată pentru protecția echipajului, electronice cu specificații militare (comunicații criptate, FLIR, radar) și conformitate cu reglementările Gărzii de Coastă a SUA.
      solution: Proiectat RIB 600 Patrol cu configurație dublă de externe de 115 HP, consolă blindată cu protecție balistică, termoviziune FLIR, comunicații VHF/UHF criptate și puncte de montare a armelor integrate. Carena întărită pentru manevre de interceptare la mare viteză. Toată electronica integrată și testată în fabrică. Documentația de conformitate USCG furnizată.
      product: RIB 600 Patrulă (Motor Twin)
      results: Bărcile au atins o viteză maximă de 52 de noduri în timpul testelor de acceptare. Agenția a raportat o rată de pregătire pentru misiuni de 95% în primele 12 luni. A fost plasată o comandă suplimentară pentru 8 unități.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Elicopterul cu două motoare RIB 600 oferă echipajelor noastre viteza și redundanța necesare pentru operațiuni de interceptare în ape deschise. Consola blindată oferă protecție crucială fără a compromite performanța.
      icon: tabler:shield
