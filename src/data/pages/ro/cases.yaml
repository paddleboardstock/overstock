hero:
  tagline: Studii de caz
  title: Proiecte reale, rezultate reale<br />— Paddle Board Overstock În acțiune
  subtitle: Vezi cum Paddle Board Overstock colaborează cu distribuitori, branduri și operatori din întreaga lume pentru a oferi soluții marine personalizate pentru fiecare aplicație.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
