features3_reasons:
  tagline: De ce să alegi Aquafarer
  title: Șapte motive pentru a colabora cu noi
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Producție reală, nu comerț
      description: Deținem și operăm o fabrică de 12.000 m². Când colaborați cu Aquafarer, lucrați direct cu persoanele care proiectează, inginerizează și construiesc produsele dumneavoastră — fără intermediari.
      icon: tabler:building-factory
    - title: 2. Abordare condusă de inginerie
      description: Procesul nostru de proiectare începe cu cazul de utilizare, nu cu categoria produsului. Optimizăm forma carenei, selecția materialului și configurația în funcție de modul în care barca va fi folosită efectiv.
      icon: tabler:engine
    - title: 3. Calitate certificată
      description: CE certificat, sistem de calitate ISO, conform, BSCI conform, REACH aprobat. Cele 64 de modele CE-certificate respectă standardele internaționale — nu doar afirmații.
      icon: tabler:certificate
    - title: 4. Flexibil OEM/ODM
      description: Culorile tuburilor, aspectul consolei, brandingul, ambalajul — le personalizăm conform specificațiilor dumneavoastră. Fără presiune de comandă minimă. Începeți cu un prototip, extindeți cu încredere.
      icon: tabler:adjustments
    - title: 5. Logistică Globală
      description: Depozit în SUA în California, expediere direct din Qingdao, transport aerian pentru comenzile urgente. Ne ocupăm de documentele vamale și de documentație.
      icon: tabler:truck-delivery
    - title: 6. Suport pe viață
      description: Susținem bărci pe care le-am construit acum 20 de ani. Piese de schimb originale, sfaturi tehnice, îndrumări pentru reparații — echipa noastră este disponibilă când aveți nevoie de noi.
      icon: tabler:lifebuoy
    - title: 7. Specificații oneste
      description: Valori reale ale încărcăturii, dimensiuni reale, greutate reală. Fără umflarea prin marketing. Ceea ce publicăm este ceea ce primiți — verificat prin testare independentă.
      icon: tabler:ruler-measure
testimonials:
  tagline: De încredere pentru branduri din întreaga lume
  title: Ce spun partenerii noștri
  items:
    - content: Am lucrat cu mai mulți producători din China, dar Aquafarer se remarcă prin suportul lor inginerești și calitatea constantă. Ei tratează brandul nostru ca pe al lor.
      name: — OEM Partener, Brand European de Sporturi Acvatice
    - content: Echipamentele lor Hypalon RIBs au fost în serviciul flotei noastre timp de peste 5 ani. Întreținere minimă, rezistență excelentă UV. Garanția de 5 ani pentru tuburi ne oferă încredere.
      name: — Operator de flotă, Grup de Stațiuni din Orientul Mijlociu
    - content: Echipa Aquafarer ne-a ajutat să dezvoltăm un design personalizat SUP de placă, de la concept până la producție, în 90 de zile. Calitatea a depășit așteptările noastre.
      name: — Distribuitor, Sporturi Acvatice din Australia
cta:
  title: Gata să experimentați diferența?
  subtitle: Contactați echipa noastră pentru a discuta proiectul dumneavoastră. Nu este necesar niciun angajament — doar sfaturi oneste despre producție.
  actions:
    - variant: primary
      text: Vorbiți cu echipa noastră
      href: /contact
    - text: Descărcați catalogul de produse
      href: /resources
