hero:
  tagline: Orientul Mijlociu
  title: Plăci en-gros SUP pentru<br />Comercianți din Orientul Mijlociu
  subtitle: Retaileri din Golf, cluburi de plajă hoteliere și operatori de la Marea Roșie — plăci cu palete noi, în plus, din 5 unități, modele mixte, livrate din China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
