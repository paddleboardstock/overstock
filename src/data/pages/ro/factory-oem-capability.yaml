services:
  - title: Proiectare și Inginerie Produs
    description: Echipa noastră internă de cercetare și dezvoltare lucrează cu conceptul sau specificațiile dvs. pentru a dezvolta desene CAD, modele 3D și prototipuri. Oferim proiectarea matrițelor, optimizarea formei carenei și ghidare pentru selecția materialelor.
  - title: Branding și Grafică Personalizată
    description: Imprimare digitală full-color, serigrafie, embossing și opțiuni de etichetare. Dezvoltăm grafice specifice mărcii pentru punte, branding pe tuburi și ambalaje pregătite pentru retail.
  - title: Personalizare Materiale și Specificații
    description: Alegeți dintre PVC (standard, ecologic, ignifugat), Hypalon/CSM, drop-stitch și construcții hibride. Culori personalizate ale tuburilor, greutăți de țesătură și opțiuni de consolidare.
  - title: Ambalare și Logistică
    description: Ambalaje personalizate pentru retail, cutii private label, ambalare sub vid, paletizare și încărcare containere. Condiții de livrare FOB Qingdao, CIF sau DDP disponibile.
