why_us:
  - title: Integrare verticală
    description: Deținem fabrica, matrițele și lanțul de aprovizionare — fără intermediari, fără subcontractori. Aceasta ne oferă control asupra calității, costurilor și livrării.
  - title: Certificare duală
    description: ISO Certificare ISO 9001 pentru managementul calității și BSCI certificare pentru conformitatea socială. Rapoartele de audit ale fabricii sunt disponibile la cerere.
  - title: Conformitate CE
    description: Toate modelele standard dețin certificare CE 2013/53/UE. Modelele personalizate pot fi CE certificate prin procesul nostru stabilit.
  - title: Cantitate redusă MOQ
    description: Începeți cu doar 5 unități pentru modelele standard. Ajutăm brandurile emergente să lanseze produse fără a supraangaja stocul.
