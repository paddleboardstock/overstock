hero:
  tagline: Paddle Board Overstock Laborator Personalizat
  title: Proiectează-ți propriul<br />Ambarcațiune
  subtitle: OEM, ODM, etichetă privată și servicii de branding personalizat pentru afaceri din întreaga lume. De la un singur prototip până la producții complete.
  cta: Începeți proiectul dvs.
  footer_link: /contact
steps_section:
  tagline: Cum funcționează
  title: De la concept la producție
  subtitle: Patru etape de la ideea ta la un produs final gata pentru mare.
  steps:
    - num: '01'
      title: Alege Placa Ta
      desc: Selectează dintre modelele noastre de bază — SUP, caiac, bărci gonflabile sau RIB. Alege dimensiunea, materialul și culoarea.
    - num: '02'
      title: Încarcă-ți Designul
      desc: Trimite-ne logo-ul, creațiile artistice sau ghidurile brandului tău. Echipa noastră de design va pregăti un proof digital.
    - num: '03'
      title: Revizuire Mockup AI
      desc: Vizualizează un mockup foto-realistic generat de AI al plăcii tale personalizate înainte de a începe producția.
    - num: '04'
      title: Producție & Livrare
      desc: Odată aprobat, comanda ta intră pe linia noastră de producție certificată ISO. Timp de execuție de la 30 de zile.
services_section:
  tagline: Servicii
  title: Servicii de fabricație pentru branduri globale
  subtitle: Modele flexibile de colaborare — de la producție la contract, până la construire completă a brandului.
  items:
    - title: Fabricare OEM
      desc: Producem designurile tale conform specificațiilor — IP-ul tău, desenele tale, standardele tale de calitate. Protecție completă NDA.
      icon: ⚙️
    - title: Soluții ODM
      desc: Alege dintre 50+ platforme dovedite și personalizează dimensiunea, culoarea, grafica și ambalajul.
      icon: 🎨
    - title: Marcă privată
      desc: Brandul tău pe produsele noastre — logo, ambalaj, etichete, manuale. Gata de vânzare imediat.
      icon: 🏷️
    - title: Branding personalizat
      desc: Printare deck pad, grafică pe carenă, decalcomanii pe tuburi și etichete personalizate — integrare completă a brandului.
      icon: ✨
capabilities_section:
  tagline: Capabilități
  title: Capabilități de producție & personalizare
  subtitle: Tot ce trebuie să știi înainte de a plasa comanda ta.
  capabilities:
    - label: Volum de comandă
      value: MOQ 5–10 unități (SUP/kajak), 2–5 unități (RIB)
    - label: Timp de livrare
      value: 30–45 zile standard; 15–20 zile pentru prototipuri
    - label: Personalizare
      value: Dimensiune, formă, culoare, grafică, ambalaj, accesorii
    - label: Materiale
      value: PVC, Hypalon, drop-stitch, fibră de sticlă, aluminiu
    - label: Imprimare
      value: Digitală (CMYK), serigrafie, transfer termic, sublimare
    - label: Certificare
      value: CE, ISO 9001, BSCI, UKCA (suport pentru conformitate globală)
why_section:
  tagline: De ce Paddle Board Overstock
  title: O fabrică. Un standard. Zero compromisuri.
  points:
    - text: Facilitate de fabricație integrată de 12.000 mp
      highlight: 12.000 mp
    - text: 200-300 de muncitori și ingineri calificați
      highlight: 200-300
    - text: 15.000 de bărci produse anual
      highlight: 15,000
    - text: Calitate gestionată ISO certificată 9001
      highlight: ISO 9001
    - text: Produse CE certificate pentru piața UE
      highlight: CE
  cta: Vezi detalii despre fabrică
  cta_link: /factory
  contact:
    title: Gata să discutăm proiectul dumneavoastră?
    desc: Echipa noastră răspunde în 24 de ore cu o ofertă preliminară.
