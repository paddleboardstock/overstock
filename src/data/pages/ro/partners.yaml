hero:
  tagline: Parteneri și Distribuție
  title: Devino un Partener Aquafarer<br />— Rețea Globală de Distribuție
  subtitle: Alăturați-vă rețelei globale de parteneri a Aquafarer. Colaborăm cu distribuitori marini, dealeri de bărci, comercianți de echipamente și parteneri de marcă în 50+ de țări.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer rețea globală de parteneri și distribuitori
content_programs:
  tagline: Programe pentru parteneri
  title: Programe pentru parteneri<br />Construit pentru creștere
  subtitle: Indiferent dacă sunteți distribuitor, comerciant sau partener de marcă, Aquafarer oferă programe concepute pentru a sprijini afacerea dumneavoastră.
  columns: 3
  items:
    - title: Program de distribuitori
      description: Distribuție exclusivă pe teritoriu cu prețuri bazate pe volum, suport de marketing și acces direct la fabrică. Se cere un angajament minim în funcție de dimensiunea teritoriului.
      icon: tabler:world
    - title: Program pentru dealeri
      description: Prețuri directe de la dealer, instruire pentru produs, materiale de marketing și suport pentru garanție pentru locațiile de vânzare cu amănuntul și magazinele online.
      icon: tabler:building-store
    - title: OEM/ODM Parteneriat
      description: Producție completă de OEM și ODM cu servicii complete, inclusiv branding personalizat, ambalare și specificații ale produsului. De la concept până la recipient.
      icon: tabler:certificate
    - title: Parteneriat de marcă
      description: Programe de co-branding, marcă privată și modele exclusive pentru branduri consacrate în domeniul marin și al recreerii în aer liber.
      icon: tabler:stars
    - title: Guvern și instituții
      description: Programe de furnizori preferați pentru agențiile guvernamentale, paze de coastă, militari și organizații umanitare. Documentație pregătită pentru licitații.
      icon: tabler:building-community
    - title: Partener de stațiune și închirieri
      description: Prețuri pentru flote, calitate constantă și personalizare a brandului pentru resorturi, centre de scufundări și operațiuni de închiriere la nivel mondial.
      icon: tabler:sun
content_benefits:
  tagline: De ce să colaborezi cu noi
  title: De ce aleg partenerii Aquafarer
  subtitle: Partenerii noștri beneficiază de o capacitate reală de producție, calitate constantă și suport receptiv.
  list:
    - 'Acces Direct la Fabrică: Lucrați direct cu echipa noastră de producție — fără intermediari. Obțineți răspunsuri mai rapide, prețuri mai bune și vizibilitate completă asupra producției.'
    - 'Gata pentru personalizare: Personalizați produsele dvs. cu culori, logo-uri, ambalaje și specificații personalizate. Cantități minime de comandă adaptate pieței dvs.'
    - 'Calitate Garantată: producție certificată ISO 9001 cu conformitate CE, UKCA și BSCI. Fiecare produs testat înainte de expediere.'
    - 'Logistică globală: Expediere din Qingdao, China cu opțiuni FOB, CIF și DDP. Depozit în SUA în Montclair, CA pentru distribuție în America de Nord.'
    - 'Suport pentru marketing: cataloage de produse, fotografie, documentație tehnică și resurse digitale pentru a sprijini eforturile dumneavoastră de vânzări.'
    - 'Instruire și Suport: Instruirea produsului pentru echipa dvs. de vânzări, suport tehnic pentru clienții dvs. și coordonarea serviciilor de garanție.'
content_process:
  tagline: Cum să devii partener
  title: Proces Simplu de Parteneriat
  subtitle: Procesul nostru de parteneriat este simplu — conceput pentru a vă permite să vindeți rapid produse Aquafarer.
  items:
    - title: 'Pasul 1: Trimiteți Cererea'
      description: Completați formularul nostru de cerere pentru parteneri cu profilul companiei dvs., piața țintă și interesele legate de produse.
    - title: 'Pasul 2: Evaluarea Calificării'
      description: Echipa noastră de parteneriat vă va evalua cererea și vă va contacta în termen de 3 zile lucrătoare pentru a discuta oportunitățile.
    - title: 'Pasul 3: Acord și Configurare'
      description: Semnați un acord de parteneriat, configurați contul dvs. și primiți prețuri pentru parteneri, materiale de marketing și mostre de produse.
    - title: 'Pasul 4: Instruire și Lansare'
      description: Se oferă instruire despre produs, suport pentru vânzări și materiale de marketing. Sunteți gata să începeți vânzările.
cta:
  title: Sunteți pregătit să deveniți partener Aquafarer?
  subtitle: Aplicați pentru parteneriat și echipa noastră vă va răspunde în termen de 3 zile lucrătoare.
  actions:
    - variant: primary
      text: Aplicați pentru parteneriat
      href: /contact
    - text: Vizualizați produsele noastre
      href: /products
