reasons:
  tagline: Diferența Paddle Board Overstock
  title: Ce Ne Deosebește
  isBeforeContent: false
  columns: 3
  items:
    - title: Producție Reală, Nu Comerț
      description: Deținem și operăm o fabrică de 12.000 m². Când colaborezi cu Paddle Board Overstock, lucrezi direct cu persoanele care proiectează, inginerizează și construiesc produsele tale — fără intermediari.
      icon: tabler:building-factory
    - title: Abordare Condusă de Inginerie
      description: Procesul nostru de proiectare începe cu cazul de utilizare, nu cu categoria produsului. Optimizăm forma carenei, selecția materialului și configurația pentru modul în care placa va fi folosită efectiv pe apă.
      icon: tabler:engine
    - title: Calitate dovedita
      description: Fiecare placă este testată la presiune la 1,25 ori presiunea nominală timp de 24-48 de ore înainte de livrare, iar 99,3% dintre livrările noastre sosesc fără defecte — susținute de garanția noastră.
      icon: tabler:award
    - title: Designul Paddler-First
      description: 'Fiecare model începe cu modul în care vâslești: platforme stabile pentru începători, forme aerodinamice pentru turism și terase de dimensiuni mari pentru yoga. Proiectăm pentru vâslaști reali, nu pentru specificații de showroom.'
      icon: tabler:adjustments
    - title: Logistică Globală
      description: Depozit în SUA, California, expediere directă din Weihai, transport aerian pentru comenzi urgente. Ne ocupăm de documentele vamale și de documentația la nivel mondial.
      icon: tabler:truck-delivery
    - title: Suport pe viață
      description: Suntem în spatele plăcilor pe care le-am construit acum 20 de ani. Piese de schimb autentice, sfaturi tehnice, îndrumare pentru reparații — echipa noastră este acolo când aveți nevoie de noi, oriunde v-ați afla.
      icon: tabler:lifebuoy
testimonials:
  tagline: De încredere pentru vâslaștii din întreaga lume
  title: Ce spun vâslașii
  items:
    - content: Ocean Voyager-ul meu a gestionat totul, de la dimineți liniștite pe lacuri până la după-amiezi agitate de coastă. După două sezoane, încă arată și merge ca nou.
      name: — Vâslaș recreațional, California
    - content: Eram nervos să cumpăr online prima mea placă gonflabilă, dar calitatea era evidentă din momentul în care am umflat-o. Rigidă, stabilă și finisată superb.
      name: — SUP Proprietar pentru prima dată, Germania
    - content: Vâslim ca o familie în fiecare weekend de vară. Trei scânduri, zero probleme, iar copiii adoră designurile luminoase.
      name: — Vâslaș de familie, Australia
    - content: Testarea presiunii nu este vorbă de marketing — placa mea este solidă la presiune maximă și nu arată nicio întindere după un an de vâslit săptămânal.
      name: — Weekly Paddler, Țările de Jos
cta:
