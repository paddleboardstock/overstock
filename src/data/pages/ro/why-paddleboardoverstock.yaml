pillars:
  tagline: Trei piloni ai calității
  title: De ce aleg vâslașii din întreaga lume Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Concepute pentru Uz Comercial
      description: Plăcile noastre sunt proiectate pentru ani de vâslit regulat. PVC drop-stitch Miezurile comerciale consolidate, UV materialele stabile și echipamentele testate pe teren înseamnă întreținere mai redusă și o durată de viață mai lungă pe apă.
      icon: tabler:building-factory
      callToAction:
        text: Vezi linia de produse comerciale
        href: /products
    - title: Testat dincolo de standarde
      description: Fiecare placă este umflată la 1,25 ori presiunea nominală timp de 24-48 de ore înainte să părăsească fabrica noastră — 100% testată la presiune, 99,3% fără defecte. Placa ta este dovedită rezistentă înainte să atingă apa.
      icon: tabler:shield-check
      callToAction:
        text: Vezi cum testăm
        href: /quality
    - title: Construit pentru Condiții Globale
      description: 'Produse optimizate pentru orice climă: formule pentru apă rece PVC pentru Europa, materiale rezistente la UV pentru Orientul Mijlociu și Australia, tratamente anti-umiditate pentru Asia de Sud-Est. Fiecare expediție este calibrată în funcție de mediul de destinație.'
      icon: tabler:world
