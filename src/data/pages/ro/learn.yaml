hero:
  tagline: Cunoștințe despre Explorarea Apei
  title: Învață
  subtitle: |
    Ghiduri, tutoriale și analize aprofundate — tot ce ai nevoie pentru a explora<br />
    apa cu încredere. De la alegerea primului tău SUP până la stăpânirea tehnicilor avansate.
  taglineSection: Cunoștințe pentru fiecare vâslitor. De la începător la profesionist.
featured:
  tagline: Subiecte recomandate
  title: Începeți călătoria de învățare
  subtitle: Fie că sunteți noi în sporturile acvatice sau căutați să vă îmbunătățiți nivelul, ghidurile noastre vă acoperă.
  items:
    - title: SUP Elemente de bază
      description: Tot ce trebuie să știe un începător — tipuri de plăci, dimensiunea paletei, poziția și sfaturi pentru prima zi.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Gonflabil vs Hard Board
      description: Care este potrivit pentru tine? Comparăm portabilitatea, performanța, durabilitatea și costul unul lângă altul.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Siguranța apei
      description: Cunoștințe esențiale de siguranță pe care fiecare vâslaș ar trebui să le aibă — vreme, veste de salvare, auto-salvare și altele.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Ghid de materiale
      description: PVC vs Hypalon, tehnologia drop-stitch, clasificările denier — înțelegeți din ce este făcut echipamentul dumneavoastră.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Ghid de mărimi
      description: Găsește lungimea, lățimea și volumul potrivite ale plăcii în funcție de greutatea, abilitatea și stilul tău de vâslit.
      icon: tabler:ruler
      href: /size-guide
    - title: Tehnici Intermediare
      description: Îmbunătățește-ți vâslitul cu lovituri avansate, tehnici de întoarcere și gestionarea apei agitate.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
