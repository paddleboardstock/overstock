content_system:
  tagline: Prezentare generală a sistemului QC
  title: Calitate integrată<br />Cadru de control
  subtitle: Sistemul nostru de control al calității funcționează independent de producție și raportează direct managementului. Niciun lot nu este expediat fără eliberarea calității semnată de laboratorul de calitate.
  items:
    - title: Laborator de Calitate Independent
      description: Laboratorul nostru de calitate funcționează ca o funcție separată de producție. Inspectorii QC raportează Managerului de Calitate, nu Directorului de Producție. Această independență organizațională asigură faptul că deciziile privind calitatea sunt luate obiectiv — termenele de producție nu prevalează niciodată asupra cerințelor de calitate.
      features:
        - Raportează direct conducerii, independent de producție
        - Autorizat să oprească producția din cauza problemelor de calitate
        - 12 inspectori QC dedicați în toate etapele
        - Toate echipamentele de testare sunt calibrate anual
    - title: Trasabilitatea lotului
      description: Fiecare lot de materie primă primește un număr de lot unic în sistemul nostru ERP. De la sosirea materialului, prin producție până la produsul finit, fișa de materiale a fiecărei plăci se leagă înapoi de loturile originale ale furnizorului. Acest lucru permite trasabilitatea completă în amonte pentru orice întrebare legată de calitate sau conformitate.
      features:
        - Urmărirea loturilor bazată pe ERP, de la material la produsul finit
        - Etichete fizice de lot pe fiecare ordin de lucru
        - Acoperire 100% a materialului — PVC, drop-stitch, spumă EVA, componente, adezivi
        - Înregistrări păstrate timp de 10 ani
    - title: Managementul Calității
      description: Procedurile noastre de control al calității urmează protocoale interne documentate. Rezultatele testelor sunt înregistrate, trasabile și revizuite de laboratorul nostru independent de calitate. Rata de defecte de 99,3% pe livrările din ultimele 12 luni.
      features:
        - Protocoale interne documentate de control al calității, revizuite anual
        - Rata de defecte de 99,3% pe livrările din ultimele 12 luni
        - Toleranță zero pentru defectele critice de siguranță
        - Înregistrări păstrate timp de 10 ani
content_inspection:
  tagline: Etapele de inspecție
  title: Șase Etape<br />Procesul de inspecție
  subtitle: Fiecare produs trece prin 6 etape de inspecție cu puncte de control QC documentate. Defectele sunt depistate devreme, acțiunile corective sunt imediate, iar fiecare lot este complet trasabil.
  stages:
    - stage: '1'
      title: Inspecția materialelor de sosire
      description: Toate materialele primite sunt înregistrate după numărul lotului și puse în carantină până la aprobarea QC. Rolele de PVC sunt testate pentru rezistența la tracțiune, rezistența la rupere și grosime. Nucleele, supapele, adezivii și componentele hardware sunt inspectate vizual și măsurate conform specificațiilor.
      checks: Rezistență la tracțiune, rezistență la rupere, calibru de grosime, vâscozitate adeziv, scanare vizuală pentru defecte
      threshold: 100% dintre loturi au fost testate. Se respinge dacă rezistența la tracțiune < 90% din specificație, ruperea < minimul specificației sau există vreun defect vizual
    - stage: '2'
      title: Controlul calității în proces — Tăiere și pregătire
      description: CNC- panourile tăiate sunt verificate dimensional față de fișierele sursă CAD la fiecare 20 de panou. Calitatea marginilor este inspectată pentru destrămare, tăieturi inegale sau derive dimensionale. Numărul panourilor este verificat în raport cu BOM pentru fiecare lot de producție înainte ca materialele să treacă la sudură.
      checks: Verificarea dimensională față de fișierele CAD DXF, inspecția calității muchiilor, verificarea numărului de panouri
      threshold: Toleranță ±0,5mm. Respinge lotul dacă >2% din toleranță
    - stage: '3'
      title: Controlul calității în proces — Sudură și lipire
      description: În timpul producției, calitatea sudurii este monitorizată continuu. Testele de decojire sunt efectuate pe eșantioane la fiecare 50 de unități. Lățimea sudurii este măsurată conform specificației. Jurnalele de temperatură a aerului cald sunt revizuite pentru consistență. Fiecare cusătură este inspectată vizual sub lumină din spate pentru canale sau goluri.
      checks: Test de decojire la fiecare 50 de unități, măsurarea lățimii sudurii, revizuirea jurnalului de temperatură a aerului cald, inspectarea cusăturii sub lumină din spate
      threshold: Rezistența la cojire minim 8 N/cm. Toleranța lățimii ±sudurii 1 mm. Orice canalizare vizibilă = respingere
    - stage: '4'
      title: Controlul calității asamblării
      description: Fiecare unitate urmează o listă de verificare a asamblării în 100 de puncte, aprobată de liderul echipei. Funcționarea supapelor este testată prin 10 cicluri de deschidere/închidere. Cuplul hardware este verificat. Inspecția vizuală acoperă finisajul suprafeței, consistența culorii, plasarea etichetei și completitudinea accesoriilor.
      checks: Listă de verificare de 100 de puncte per unitate, test de funcție al supapelor, verificare cuplu hardware, inspecție vizuală
      threshold: 'Politica zero-defect pentru articolele critice de siguranță (supape, inele D, mânere). Defecte cosmetice minore: obiectiv 99,3% fără defecte'
    - stage: '5'
      title: Testarea Presiunii
      description: Fiecare cameră este umflată la o presiune nominală de 1,25× și menținută timp de 24-48 de ore. Senzorii de presiune înregistrează continuu pe toată durata perioadei de păstrare. Citirile compensate de temperatură asigură acuratețea. Orice cameră care depășește o cădere de presiune de 5% este respinsă și trimisă la reinspecție a cusăturii cu retestare 100% a întregului lot de producție.
      checks: Jurnal de menținere a presiunii pe 24-48 de ore, calibrarea senzorului verificată zilnic, citire compensată de temperatură, retestare a cusăturii după reparație
      threshold: Scădere maximă de 5% a presiunii pe 24 de ore la temperatura stabilă. Depășire = 100% retestare a întregului lot
    - stage: '6'
      title: Inspecția finală și eliberarea expedierii
      description: Inspecția vizuală și funcțională finală înainte de ambalare. Defectele de suprafață, consistența culorii, verificarea etichetei/BIN, integritatea ambalajului și completitudinea accesoriilor sunt verificate în raport cu comanda clientului. Unitățile sunt ambalate în vid, ambalate și paletizate. Este necesară aprobarea finală a controlului calității înainte ca orice produs să părăsească fabrica.
      checks: Inspecție vizuală completă, listă de verificare a accesoriilor conform SKU, test de cădere a ambalajului (eșantion aleatoriu de 1 m), verificarea scanării etichetei/codului de bare
      threshold: Toleranță zero pentru defectele de siguranță. Obiectiv 99,3% fără defecte. 100% din unități sunt inspectate vizual
content_equipment:
  tagline: Echipament de testare
  title: Laborator QC<br />Echipamente
  subtitle: Laboratorul nostru de calitate este echipat cu echipamente de testare specializate pentru verificarea materialelor, integritatea sudurilor și validarea performanței produsului.
  columns: 3
  items:
    - title: Mașină de testare a tracțiunii
      description: Măsoară rezistența la tracțiune și alungirea țesăturii conform protocolului intern de testare. Folosit pentru controlul calității la recepție al tuturor loturilor de țesătură PVC și drop-stitch.
      icon: tabler:scale
    - title: Cameră de temperatură
      description: Cameră de mediu pentru testarea rezistenței la UV și testarea flexibilității la temperaturi scăzute. Simulează condiții extreme de funcționare.
      icon: tabler:temperature
    - title: Senzori și înregistratoare de presiune
      description: Senzori de presiune digitali cu înregistrare continuă a datelor pentru teste de retenție a aerului de 24-48 de ore. Compensați pentru temperatură pentru acuratețe.
      icon: tabler:wind
    - title: Banc de testare pentru desprindere
      description: Echipamente calibrate de testare a dezlipirii pentru verificarea rezistenței cusăturii. Mostre aleatorii din fiecare lot de producție.
      icon: tabler:files
    - title: Tanc de detectare a scurgerilor
      description: Rezervor de apă pentru testarea scurgerilor subacvatice a camerelor umflate. Detectarea vizuală a bulelor pentru verificarea integrității cusăturilor și a supapelor.
      icon: tabler:ripple
    - title: Instrumente de inspecție
      description: Instrumente de măsurare calibrate — calibre de grosime, chei dinamometrice, șublere dimensionale, teste de duritate pentru stațiile de control al calității în producție.
      icon: tabler:tools
content_metrics:
  tagline: Performanța QC
  title: Controlul calității<br />Metrice
  subtitle: Date reale de trecere/respingere de pe linia noastră de producție. Aceste metrici sunt monitorizate zilnic și revizuite lunar de conducere.
  columns: 3
  items:
    - title: 100% Unități Testate
      description: Fiecare cameră a fiecărui tablou este testată la presiune înainte de expediere. Nicio eșantionare - inspecție 100% a integrității presiunii.
      icon: tabler:check
    - title: <Scădere de presiune <5%
      description: Pierdere maximă admisă de presiune pe o perioadă de 24-48 de ore la 1,25× presiunea nominală. Orice cameră care depășește acest prag declanșează retestarea lotului.
      icon: tabler:gauge
    - title: 99,3% fără defecte
      description: Rata fără defecte pe parcursul livrărilor din ultimele 12 luni. Toleranță zero pentru defectele critice de siguranță.
      icon: tabler:clipboard-check
    - title: Reținere de 24-48 de ore
      description: Plăcile sunt menținute 24-48 de ore, în funcție de model și lot. Senzorii de presiune înregistrează continuu pe parcursul perioadei de menținere.
      icon: tabler:clock
    - title: 1,25× Presiune de test
      description: Marjă de siguranță pentru fiecare cameră — testată la 25% peste presiunea nominală pentru a asigura o marjă peste condițiile maxime de funcționare.
      icon: tabler:arrow-up
    - title: 0% Defecte de siguranță
      description: Politică de toleranță zero pentru defectele critice de siguranță — supape, inele D, cusături și camere de flotabilitate. Orice defect = 100% re-inspectare.
      icon: tabler:shield
