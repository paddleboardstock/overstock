tldr:
  summary: 'Sistem de control al calității în șase etape: inspectarea materialului, controlul calității în proces, verificarea sudurii, controlul calității la asamblare, testarea presiunii la 1,25x capacitatea nominală și inspecția finală. Testare a presiunii pentru 100% dintre unități. Rată de defecte de 99,3% conform eșantionării AQL 2,5.'
  points:
    - 'Controlul calității în șase etape: inspectarea materialului, controlul calității în proces, verificarea sudurii, controlul calității la asamblare, testarea presiunii la 1,25x și inspecția finală pe 100 de puncte'
    - Inspecție finală pe 100 de puncte pentru fiecare placă înainte de ambalare
    - 100% dintre unități sunt supuse unui test de menținere de 24-48h la presiune de 1,25x capacitatea nominală cu un prag maxim de scădere de 5%
    - Eșantionarea AQL 2,5 asigură o rată de defecte de 99,3%
    - 'Controlul calității sudurii: test de decojire, verificarea lățimii sudurii și inspectarea îmbinării din spate la fiecare sudură'
