hero:
  tagline: Expertiză Marină
  title: Decenii de Inginerie Marină<br />în Fiecare Placă
  subtitle: Paddle Board Overstock combină știința materialelor avansată, fabricația de precizie și testarea în condiții reale pentru a produce plăci care performează când contează.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock echipa de inginerie marină și cercetare-dezvoltare la lucru
expertise_materials:
  tagline: Știința Materialelor
  title: Alegerea Materialului Potrivit<br />pentru Fiecare Aplicație
  subtitle: Lucrăm cu trei materiale principale — fiecare selectat pentru cazuri de utilizare specifice și cerințe de performanță.
  columns: 3
  items:
    - title: Material Marin PVC
      description: Țesătură de 1100 denieri PVC — cel mai versatil material al nostru. UV stabilizat, rezistent la abraziune și testat în timp. Ideal pentru plăcile SUP unde greutatea, rigiditatea și eficiența costurilor contează.
      icon: tabler:droplet
    - title: Drop-Stitch Miez
      description: Mii de fire de poliester conectează straturile superioare și inferioare de țesătură, permițând umflarea la presiune înaltă (15 PSI) pentru o plimbare rigidă și stabilă, care totuși se rulează într-un rucsac.
      icon: tabler:building-arch
    - title: Spumă pentru Deck EVA
      description: Spuma EVA cu densitate mare și caneluri oferă aderență pe toată lungimea, amortizare la căderi și un suport pentru deck-urile noastre din seria de artă semnătură.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Capabilități de Producție
  title: Fabricație de Precizie<br />la Fiecare Pas
  subtitle: Facilitatea noastră de 12.000 m² este echipată cu mașini specializate pentru fiecare etapă a producției.
  columns: 2
  items:
    - title: CNC Tăiere
      description: Tăierea controlată de computer asigură panouri de material precise și repetabile, cu pierderi minime. Fiecare piesă se potrivește exact conform proiectului.
      icon: tabler:cpu
    - title: Sudare cu Frecvență Înaltă
      description: Sudura HF industrială creează cusături mai rezistente decât materialul de bază. Controlul constant al temperaturii și presiunii asigură etanșeitate completă la fiecare rulaj de producție.
      icon: tabler:bolt
    - title: Asamblare Nucleu Drop Stitch
      description: Mii de fire din poliester conectează straturile superioare și inferioare de material, permițând umflarea la presiune înaltă (15-20 PSI) pentru plăci și podele SUP rigide și stabile.
      icon: tabler:building-arch
    - title: Testarea Presiunii
      description: Fiecare placă este testată la presiune înainte de expediere, menținută la 1,25x presiunea nominală — dacă rezistă aici, va performa pe apă.
      icon: tabler:wind
    - title: Testarea Rezistenței Cusăturilor
      description: Eșantioane aleatorii din fiecare lot de producție suportă teste distructive ale rezistenței cusăturilor. Rezultatele sunt înregistrate și trasabile la rulaje de producție specifice.
      icon: tabler:files
    - title: Testare pe Apă
      description: Fiecare design de placă trece prin teste în apă reală. Vâslitul în condiții reale de coastă validează performanța, manevrabilitatea și stabilitatea.
      icon: tabler:ripple
expertise_design:
  tagline: Design și Inginerie
  title: Proiectat pentru Condiții Reale
  subtitle: Filosofia noastră de design începe cu modul în care va fi folosită placa — apoi construim ingineria în jurul acelui caz de utilizare.
  items:
    - title: Forma și conturul plăcii
      description: Lungimea, lățimea și rockerul sunt reglate pentru utilizarea intenționată a fiecărui model — contururi mai lungi pentru touring pentru alunecare, forme mai late pentru stabilitate și yoga.
    - title: Consolidarea muchiilor și a stringer-ului
      description: Muchiile și stringer-urile centrale consolidate adaugă rigiditate și absorb șocurile — locurile unde plăcile suportă cele mai mari presiuni sezon după sezon.
    - title: Configurarea punții și tracțiunea
      description: Zona de poziționare, plasarea mânerelor, montura pentru inele D și zonele de tracțiune sunt concepute în jurul posturilor reale de vâslit — fie că este vorba de plimbare, pescuit sau practicarea yoga.
    - title: Artă și serii de culori
      description: Arta de pe punte, schemele de culori și monturile pentru accesorii — fiecare serie este concepută pentru a se potrivi unei personalități distincte de vâslit.
cta:
  title: Ai o aplicație specifică în minte?
  subtitle: Echipa noastră te poate ajuta să alegi placa, dimensiunea și echipamentul potrivit pentru stilul tău de vâslit.
  actions:
    - variant: primary
      text: Întreabă inginerii noștri
      href: /contact
    - text: Vezi gama de produse
      href: /products
