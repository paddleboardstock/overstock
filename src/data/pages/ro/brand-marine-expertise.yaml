hero:
  tagline: Expertiză Marină
  title: Decenii de Inginerie Marină<br />în Fiecare Carenă
  subtitle: Aquafarer combină știința materialelor aprofundată, fabricația de precizie și testarea în condiții reale pentru a produce ambarcațiuni care performează atunci când contează.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer echipa de inginerie marină și cercetare-dezvoltare la lucru
expertise_materials:
  tagline: Știința Materialelor
  title: Alegerea Materialului Potrivit<br />pentru Fiecare Aplicație
  subtitle: Lucrăm cu trei materiale principale — fiecare selectat pentru cazuri de utilizare specifice și cerințe de performanță.
  columns: 3
  items:
    - title: Material Marin PVC
      description: Material textil de 1100 denieri PVC — cel mai versatil material al nostru. Stabilizat UV, rezistent la abraziune și conform REACH. Ideal pentru bărci recreaționale, plăci SUP și caiace, unde contează greutatea și eficiența costurilor.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Rezistență chimică superioară și stabilitate UV. Bărci Hypalon pot dura 15-20 de ani cu întreținere corespunzătoare. Recomandat pentru aplicații comerciale, de salvare și militare, unde durabilitatea pe termen lung este critică.
      icon: tabler:shield
    - title: Fibre de Sticlă & Aluminiu
      description: Carene Deep-V din fibră de sticlă pentru RIBs și bărci de patrulare — performanță tăietoare de valuri în condiții dificile. Carene din aluminiu pentru bărci comerciale grele care necesită rezistență maximă și capacitate mare de încărcare.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capabilități de Producție
  title: Fabricație de Precizie<br />la Fiecare Pas
  subtitle: Facilitatea noastră de 12.000 m² este echipată cu mașini specializate pentru fiecare etapă a producției.
  columns: 2
  items:
    - title: CNC Tăiere
      description: Tăierea controlată de computer asigură panouri de material precise și repetabile, cu pierderi minime. Fiecare piesă se potrivește exact conform proiectului.
      icon: tabler:cpu
    - title: Sudare cu Frecvență Înaltă
      description: Sudura HF industrială creează cusături mai rezistente decât materialul de bază. Controlul constant al temperaturii și presiunii asigură etanșeitate completă la fiecare rulaj de producție.
      icon: tabler:bolt
    - title: Asamblare Nucleu Drop Stitch
      description: Mii de fire din poliester conectează straturile superioare și inferioare de material, permițând umflarea la presiune înaltă (15-20 PSI) pentru plăci și podele SUP rigide și stabile.
      icon: tabler:building-arch
    - title: Testarea Presiunii
      description: Fiecare produs gonflabil este testat la presiune înainte de expediere. Tuburile RIB sunt testate la 1,25x presiunea nominală — dacă rezistă aici, va performa și pe apă.
      icon: tabler:wind
    - title: Testarea Rezistenței Cusăturilor
      description: Eșantioane aleatorii din fiecare lot de producție suportă teste distructive ale rezistenței cusăturilor. Rezultatele sunt înregistrate și trasabile la rulaje de producție specifice.
      icon: tabler:files
    - title: Testare pe Apă
      description: Fiecare model RIB trece prin teste pe mare înainte de certificare. Testarea în condiții reale în zona de coastă validează performanța, manevrabilitatea și stabilitatea.
      icon: tabler:ripple
expertise_design:
  tagline: Design și Inginerie
  title: Proiectat pentru Condiții Reale
  subtitle: Filozofia noastră de design începe cu modul în care va fi utilizată ambarcațiunea — apoi construim ingineria în jurul acestui tip de utilizare.
  items:
    - title: Design cu Chila în V Adâncă
      description: Hululele din fibră de sticlă au unghiuri de deadrise calculate, optimizate pentru lungimea și utilizarea prevăzută a fiecărui model. V mai ascuțit pentru performanță în ape agitate, mai puțin adânc pentru stabilitate.
    - title: Siguranță cu Mai Multe Camere
      description: Fiecare barcă include 3-7 camere de aer independente. Dacă unul dintre compartimente este compromis, camerele rămase mențin barca la suprafață și funcțională.
    - title: Layout Ergonomic
      description: Poziția consolei, înălțimea tubului și amplasarea scaunelor sunt proiectate pentru confortul operatorului în timpul utilizării prelungite — fie că patrulează, pescuiește sau transportă.
    - title: Configurare Personalizată
      description: Culorile tuburilor, configurația consolei, capacitatea de combustibil, suporturile pentru accesorii — fiecare model poate fi personalizat pentru a se potrivi cerințelor operaționale specifice.
cta:
  title: Ai o aplicație specifică în minte?
  subtitle: Echipa noastră de inginerie poate oferi sfaturi privind selecția materialelor, designul și fabricarea pentru proiectul tău.
  actions:
    - variant: primary
      text: Întreabă inginerii noștri
      href: /contact
    - text: Vezi gama de produse
      href: /products
