hero:
  tagline: Marine Expertise
  title: Decades of Marine Engineering<br />in Every Board
  subtitle: Paddle Board Overstock combines deep material science, precision manufacturing, and real-world testing to produce boards that perform when it matters.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: Choosing the Right Material<br />for Every Application
  subtitle: We work with three core materials — each selected for specific use cases and performance requirements.
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: 1100 denier PVC fabric — our most versatile material. UV-stabilized, abrasion-resistant, and time-tested. Ideal for SUP boards where weight, stiffness, and cost efficiency matter.
      icon: tabler:droplet
    - title: Drop-Stitch Core
      description: Thousands of polyester threads connect the top and bottom fabric layers, allowing high-pressure inflation (15 PSI) for a rigid, stable ride that still rolls up into a backpack.
      icon: tabler:building-arch
    - title: EVA Deck Foam
      description: Grooved, high-density EVA foam provides full-length grip, cushioning for falls, and a canvas for our signature art-series decks.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: Precision Manufacturing<br />at Every Step
  subtitle: Our 12,000 m² facility is equipped with specialized machinery for every stage of production.
  columns: 2
  items:
    - title: CNC Cutting
      description: Computer-controlled cutting ensures precise, repeatable fabric panels with minimal waste. Every piece fits exactly as designed.
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: Industrial HF welding creates seams stronger than the base material. Consistent temperature and pressure control ensures air-tight seals across every production run.
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: Thousands of polyester threads connect top and bottom fabric layers, allowing high-pressure inflation (15-20 PSI) for rigid, stable SUP boards and floors.
      icon: tabler:building-arch
    - title: Pressure Testing
      description: Every board is pressure-tested before shipping, held at 1.25x rated pressure — if it holds there, it will perform on the water.
      icon: tabler:wind
    - title: Seam Strength Testing
      description: Random samples from each production batch undergo destructive seam strength testing. Results are logged and traceable to specific production runs.
      icon: tabler:files
    - title: Water Testing
      description: Every board design undergoes real-water trials. Real-world paddling in coastal conditions validates performance, handling, and stability.
      icon: tabler:ripple
expertise_design:
  tagline: Design & Engineering
  title: Engineered for Real Conditions
  subtitle: Our design philosophy starts with how the board will be used — then builds the engineering around that use case.
  items:
    - title: Board Shape & Outline
      description: Length, width, and rocker are tuned for each model's intended use — longer touring outlines for glide, wider planshapes for stability and yoga.
    - title: Rail & Stringer Reinforcement
      description: Reinforced rails and center stringers add rigidity and absorb impacts — the places where boards take the most abuse season after season.
    - title: Deck Layout & Traction
      description: Stance area, handle placement, D-ring mounts, and traction zones are designed around real paddling postures — whether cruising, fishing, or practicing yoga.
    - title: Art & Color Series
      description: Deck artwork, color schemes, and accessory mounts — each series is designed to match a distinct paddling personality.
cta:
