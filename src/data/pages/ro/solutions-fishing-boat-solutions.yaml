content_challenge:
  tagline: Provocarea
  title: Nevoile bărcii de pescuit<br />Stabilitate, autonomie și durabilitate
  subtitle: Fie că operați nave de pescuit comercial, gestionați o flotă cooperativă sau conduceți chartere de pescuit — barca dvs. trebuie să funcționeze fiabil în fiecare zi.
  paragraphs:
    - Bărcile de pescuit au nevoie de platforme stabile pentru manevrarea lansetelor, manipularea capturii și deplasarea în siguranță pe punte. Gonflabilele și RIBs oferă stabilitate inerentă prin designul tuburilor lor — un avantaj semnificativ față de navele cu bord rigid de dimensiuni similare.
    - Eficiența consumului de combustibil este importantă pentru operațiunile de pescuit, unde costurile de exploatare afectează direct rentabilitatea. RIBs și bărcile gonflabile sunt mai ușoare decât echivalentele rigide, necesitând mai puțină putere și consumând mai puțin combustibil — esențial pentru operatorii comerciali care utilizează zilnic bărcile și pentru cooperativele care gestionează bugetele flotei.
    - Durabilitatea în mediile marine este esențială. Expunerea la apă sărată, UV și utilizarea constantă cer materiale care să reziste condițiilor dure fără degradare. Pentru operatorii comerciali și cooperativi, fiabilitatea afectează direct veniturile — o barcă defectă înseamnă zile pierdute de pescuit.
    - Configurațiile de pescuit Aquafarer includ suporturi pentru undițe, sonare, tancuri pentru momeală, tancuri pentru pește viu și soluții de manipulare a încărcăturii, proiectate pentru aplicații serioase de pescuit în operațiuni comerciale, cooperative și recreative.
content_solution:
  tagline: Soluția noastră
  title: Configurații gata pentru pescuit
  subtitle: Fiecare barcă de pescuit Aquafarer poate fi configurată pentru aplicația dvs. specifică de pescuit.
  list:
    - Montarea suportului pentru undițe — instalată din fabrică sau pregătită pentru instalare ulterioară
    - Placă de montaj pentru sonar/GPS la poziția consolă
    - Opțiuni de tanc pentru momeală sau pește viu pentru operatori de charter și comerciali
    - Configurații pentru răcitoare/depozitare pentru manipularea capturii
    - Carena Deep-V pentru capacitate offshore — stabilă la repaus, netedă la viteză
    - PVC sau Hypalon opțiuni pe tub — Hypalon pentru expunere prelungită UV
    - Motorul exterior variază între 15 HP și 115 HP , în funcție de model și aplicație
content_segments:
  tagline: Profiluri de pescuit
  title: Soluții pentru bărci de pescuit gonflabile<br />După tipul operatorului
  subtitle: De la pescuitul sportiv de coastă până la pescuitul comercial cu palangare — diferite operațiuni de pescuit necesită configurații diferite ale corpului, intervale de putere și configurații pe punte. Adaptăm fiecare barcă pentru a se potrivi pescuitului, apelor și stilului de lucru.
  items:
    - title: Companii de pescuit comercial
      subtitle: Bărci de lucru pentru flotă pentru operațiuni zilnice de pescuit, manipularea plaselor, transportul capturilor
      description: Companiile comerciale de pescuit operează bărci de lucru pentru montarea și recuperarea plaselor, întreținerea capcanelor, navigarea cu palangare și transportul capturilor. Aceste bărci lucrează zilnic în medii de apă sărată și trebuie să reziste la sarcini grele, la manevra constantă pe punte și la ore lungi de operare. Eficiența consumului de combustibil și întreținerea redusă sunt esențiale pentru profitabilitatea flotei. Nava trebuie să asigure platforme de lucru stabile pentru echipamentul de manipulare a echipajului și captură în condiții variate de mare.
      features:
        - Configurație a punții plate pentru manipularea plaselor, stivuirea capcanelor și depozitarea peștilor
        - Motor exterior 40-115 eficient HP din punct de vedere al consumului de combustibil pentru costuri zilnice reduse de operare
        - Hypalon Tuburi rezistente pentru rezistență la abraziune în utilizarea zilnică
        - Benzi de frecare întărite pentru contact frecvent cu docurile și navele
        - Punte auto-saliabilă pentru o spălare ușoară după operațiuni
        - Prețul flotei și specificațiile consecvente pentru operatorii cu mai multe nave
    - title: Operatori de pescuit charter
      subtitle: Confort pentru mai mulți pasageri, manevrabilitate pentru blocare, certificare de siguranță
      description: Operatorii organizează chartere de pescuit de jumătate de zi și zi întreagă — de la pescuit pe recife de coastă până la pescuit de fund. Barca ta are nevoie de locuri pentru pasageri cu certificări de siguranță, spațiu suficient pe punte pentru mai mulți pescari și puțuri integrate pentru a menține momeala și capturile proaspete pe tot parcursul călătoriei. Confortul oaspeților influențează direct recenziile călătoriilor, rezervările repetate și evaluările online.
      features:
        - Direcție pe consolă cu scaune tip bucket care absorb șocurile
        - Suporturi pentru tijă instalate din fabrică (4–8 poziții)
        - 60–115 HP autonomie outboard pentru viteze de croazieră offshore
        - CE Certificare Categoria C sau B pentru operațiuni comerciale de pasageri
        - Umbrelă Bimini sau T-top pentru confortul oaspeților în călătorii prelungite
    - title: Pescari Artizanali și Comerciali la Scară Mică
      subtitle: Bărci de lucru de încredere pentru traiul zilnic
      description: Pescarii independenți care se bazează pe barca lor ca sursă principală de venit — montează plase, îngrijesc capcanele pentru pești sau fac legături la mână aproape de țărm. Prioritatea ta este economia de combustibil, întreținerea simplă pe care o poți face singur și o barcă care gestionează încărcături moderate de captură și echipament fără a sacrifica stabilitatea.
      features:
        - Motor extern eficient în consum de combustibil 15–HP40 pentru costuri reduse de operare
        - Hypalon CSM tuburi pentru extindere UV și rezistență la abraziune
        - Amenajarea punții plate pentru manipularea plaselor și depozitarea peștelui
        - Capacitate ușoară de debarcare pe plajă cu protecție gonflabilă la chilă
    - title: Cooperative de pescuit
      subtitle: Colectarea capturilor, transportul membrilor, distribuția aprovizionării
      description: Cooperativele de pescuit operează flote comunitare pentru colectarea capturilor de la pescarii membri, transportul aprovizionării către comunități de pescari izolate și distribuirea recoltei către piețe. Aceste bărci de lucru au nevoie de capacitate mare de încărcare, operare zilnică fiabilă și întreținere ușoară în locații îndepărtate. Cooperativele operează adesea în regiuni în curs de dezvoltare, unde disponibilitatea pieselor și accesul la servicii sunt limitate, ceea ce face esențiale configurațiile simple ale motoarelor exterioare și construcția durabilă.
      features:
        - Capacitate mare de încărcare pentru transportul capturilor și aprovizionării
        - Configurație simplă exterioară pentru o întreținere ușoară la fața locului
        - Construcție robustă PVC sau Hypalon pentru flexibilitate bugetară
        - Punte plată cu puncte de ancorare pentru fixarea mărfii
        - Funcționare eficientă din punct de vedere al consumului de combustibil, minimizând costurile de operare ale cooperativei
    - title: Entuziaști ai pescuitului sportiv și de agrement
      subtitle: Performanță și stil pentru pescarii serioși
      description: Pescari experimentați în căutarea unei platforme de pescuit capabile, care să ofere viteză către locurile îndepărtate, poziții stabile pentru lupta în picioare și finisaje premium. Barca trebuie să se simtă confortabilă fie că navighează doi mile în larg către un recif, fie că explorează zonele estuariene izolate.
      features:
        - Șasiu Deep-V RIB pentru navigare lină în valuri
        - Placă de montare Fishfinder/GPS pre-șire la consolă
        - Baitwell și cooler integrate în modulul scaunului din spate
        - Opțiuni personalizate de culoare a punții EVA care se potrivesc cu grafica bărcii/tubului
    - title: Ghizi de pescuit și operatori eco-turistici
      subtitle: Experiențe de pescuit ghidate pentru pescari vizitatori
      description: Ghizi care duc grupuri mici de pescari vizitatori către locuri productive de pescuit — combinând adesea pescuitul cu elemente de eco-turism, cum ar fi observarea păsărilor sau explorarea mangrovelor. Barca trebuie să fie uscată și confortabilă pentru oaspeți neobișnuiți cu bărcile mici, cu îmbarcare ușoară și opțiuni de umbră.
      features:
        - Puncte de montare pentru bimini sau T-top instalate din fabrică
        - Scară de îmbarcare cu intrare ușoară pentru reîmbarcare facilă
        - Motor silențios în patru timpi pentru a minimiza deranjul
        - Compartimente de depozitare uscate pentru telefoanele, portofelele și camerele oaspeților
