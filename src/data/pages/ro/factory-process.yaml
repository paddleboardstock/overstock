hero:
  tagline: Proces
  title: Procesul de fabricație
  subtitle: De la materiile prime până la scândura gata de mare — fiecare pas sub controlul nostru
  back_label: Înapoi la fabrică
  back_link: /factory
intro: Spre deosebire de brandurile care externalizează producția către fabrici terțe, Paddle Board Overstock deține și operează întregul lanț de producție. Această integrare verticală ne permite să menținem un control strict al calității la fiecare etapă și să livrăm o calitate constantă a produsului, lot după lot. Iată cum este construită o placă în facilitățile noastre.
steps:
  - step: '01'
    title: Primirea și inspecția materialelor
    description: Fiecare lot primit de PVC material, drop-stitch miez, EVA spumă și materiale feroniste este inspectat conform specificațiilor. Probele de material sunt testate pentru rezistența la tracțiune, uniformitatea grosimii și UV rezistența înainte de a fi lansate în producție. Materialele neconforme sunt carantinate și returnate.
    duration: 1–2 zile
  - step: '02'
    title: PVC Tăiere automată
    description: Țesăturile aprobate sunt așezate pe CNC mașina automată de tăiere și tăiate cu o precizie submilimetrică. Nesting-ul optimizat de calculator aranjează panourile pentru a minimiza deșeurile — de obicei sub 5%. Panourile tăiate sunt etichetate după model de placă și cameră, apoi distribuite pentru transfer la atelierul de sudură.
    duration: 2–4 ore per kit de placă
  - step: '03'
    title: Etanșare termică a tuburilor și sudură
    description: Panourile sunt fixate și lipite cu ajutorul unor mașini de etanșare termică cu sudură cu aer cald la temperaturi controlate de 200–600 °C. Îmbinările principale sunt consolidate cu sudură dielectrică RF pentru îmbinări etanșe și cu rezistență ridicată. Camerele finalizate sunt umflate la o presiune de lucru de 1,25× pentru validarea retenției aerului în 30 de minute.
    duration: 1–2 zile pe consiliu
  - step: '04'
    title: Artă pe punte & EVA Finisare
    description: 'Deck-urile din seria Art-ului prind contur aici: EVA panourile de spumă tăiate cu precizie sunt așezate în modele integrale, lipite și tăiate manual. Aderente, confortabile și durabile — aspectul distinctiv al fiecărei plăci din seria Art.'
    duration: 1–2 zile
  - step: '05'
    title: Imprimare & Decorare SUP
    description: SUP Grafica deck-ului de carton este aplicată folosind imprimare digitală pentru designuri de calitate fotografică color complet și serigrafie pentru logo-uri durabile și modele repetitive. Printurile sunt întărite și sigilate pentru UV rezistență la abraziune.
    duration: 1–2 zile
  - step: '06'
    title: Montaj final & Montare catarge
    description: 'Plăcile primesc componentele finale: supapele sunt cuplate și testate funcțional, inelele în D, mânerele și cutiile cu aripioare sunt montate, iar atașarea lesei este fixată. Fiecare placă urmează o listă de verificare a asamblării de 100 de puncte, cu aprobare obligatorie la fiecare etapă.'
    duration: 2–3 zile
  - step: '07'
    title: Teste de calitate & Inspecție
    description: 'Fiecare placă finalizată trece printr-o poartă obligatorie de calitate: test de retenție a aerului în cameră, verificarea funcționării sistemelor, verificarea cuplului de fixare și inspecție cosmetică. Construcțiile personalizate și prototipurile beneficiază de teste pe mare în apă, acoperind viteza, manevrabilitatea, stabilitatea și autonomia.'
    duration: 1–2 zile
  - step: '08'
    title: Ambalare și livrare
    description: Plăcile sunt dezumflate, rulate și ambalate în rucsacuri de călătorie cu pompă, vâslă, aripioară, lesa și kitul de reparații, apoi sunt ambalate pentru curier și transport. Fiecare colet este etichetat cu modelul, numărul de serie și destinație. Expediem în 50+ de țări din întreaga lume.
    duration: 1 zi
