hero:
  tagline: Proces
  title: Procesul de fabricație
  subtitle: De la materii prime la barcă gata de navigație — fiecare pas sub controlul nostru
  back_label: Înapoi la fabrică
  back_link: /factory
intro: Spre deosebire de brandurile care externalizează producția către fabrici terțe, Paddle Board Overstock deține și operează întregul său lanț de producție. Această integrare verticală ne permite să menținem un control strict al calității la fiecare etapă, să răspundem rapid cerințelor personalizate și să livrăm o calitate constantă a produsului, lot după lot. Iată cum se construiește o barcă în facilitățile noastre.
steps:
  - step: '01'
    title: Primirea și inspecția materialelor
    description: Fiecare lot primit de PVC material textil, saltea de fibră de sticlă, rășină și accesorii este inspectat conform specificațiilor. Probele de material sunt testate pentru rezistență la tracțiune, uniformitate a grosimii și UV rezistență înainte de a fi eliberate în producție. Materialele neconforme sunt carantinate și returnate.
    duration: 1–2 zile
  - step: '02'
    title: PVC Tăiere automată
    description: Țesăturile aprobate sunt așezate pe CNC mașina automată de tăiere și tăiate cu o precizie submilimetrică. Cuibărirea optimizată de calculator aranjează panourile pentru a minimiza deșeurile — de obicei sub 5%. Panourile tăiate sunt etichetate după modelul și camera bărcii, apoi sunt grupate pentru transfer către atelierul de sudură.
    duration: 2–4 ore pentru fiecare kit de barcă
  - step: '03'
    title: Etanșare termică a tuburilor și sudură
    description: Panourile sunt fixate și lipite cu ajutorul unor mașini de etanșare termică cu sudură cu aer cald la temperaturi controlate de 200–600 °C. Îmbinările principale sunt consolidate cu sudură dielectrică RF pentru îmbinări etanșe și cu rezistență ridicată. Camerele finalizate sunt umflate la o presiune de lucru de 1,25× pentru validarea retenției aerului în 30 de minute.
    duration: 1–2 zile pe barcă
  - step: '04'
    title: Turnare a carcasei din fibră de sticlă RIB
    description: RIB Carenele bărcilor sunt produse folosind matriță manuală din fibră de sticlă. Straturile de saltea din fibră de sticlă și șuvițe țesute sunt laminate manual cu rășină de poliester sau vinilester în matrițe de precizie. Fiecare strat este pus în vid pentru o calitate consistentă a laminatului. Carena este finisată cu gelcoat pentru o UVsuprafață marină lucioasă și rezistentă.
    duration: 2–4 zile pe carenă
  - step: '05'
    title: Imprimare & Decorare SUP
    description: SUP Grafica deck-ului de carton este aplicată folosind imprimare digitală pentru designuri de calitate fotografică color complet și serigrafie pentru logo-uri durabile și modele repetitive. Printurile sunt întărite și sigilate pentru UV rezistență la abraziune.
    duration: 1–2 zile
  - step: '06'
    title: Montaj final & Montare catarge
    description: Carenele din fibră de sticlă și PVC ansamblurile tuburilor sunt cuplate pe linia de asamblare. Motorul este montat, comenzile direcției și ale accelerației sunt conectate, sistemul de alimentare este instalat, iar cablajul electric complet este conectat. Fiecare barcă urmează o listă de verificare a asamblării în 100 de puncte, cu aprobare obligatorie la fiecare etapă.
    duration: 2–3 zile
  - step: '07'
    title: Teste de calitate & Inspecție
    description: 'Fiecare ambarcațiune finalizată trece printr-o poartă obligatorie de calitate: test de retenție a aerului în cameră, verificarea funcționării sistemelor, verificarea cuplului de fixare și inspecție cosmetică. Construcțiile personalizate și prototipurile primesc, de asemenea, teste pe mare în apă, acoperind viteza, manevrabilitatea, stabilitatea și autonomia.'
    duration: 1–2 zile
  - step: '08'
    title: Ambalare și livrare
    description: Bărcile sunt dezumflate, pliate conform procedurii, ambalate în saci țesuți sau lăzi din placaj robust și încărcate pentru expediere. Fiecare colet este etichetat cu modelul, numărul de serie și destinație. Coordonăm cu expeditorii pentru transporturile de containere FCL și LCL la nivel mondial.
    duration: 1 zi
