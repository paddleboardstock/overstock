hero:
  tagline: Stil de viață
  title: Paddle Board Overstock<br />Stil de viață
  subtitle: Construit pentru cei care trăiesc pe apă — de la exploratori de weekend la operatori comerciali care se bazează pe echipamentul lor în fiecare zi.
values:
  - icon: 🌊
    title: Născut pe apă
    desc: Fiecare design începe prin înțelegerea modului în care se comportă apa. Inginerizăm de la marginea condițiilor către interior — pentru că oceanul este profesorul nostru, nu locul nostru de muncă.
  - icon: 🔧
    title: Construit pentru a rezista
    desc: Cel mai sustenabil produs este cel care nu trebuie înlocuit. Materiale de calitate marină, nuclee drop-stitch evaluate la 15 PSI și cusături care rezistă mai mult decât un sezon.
  - icon: 🏆
    title: Accesibil prin design
    desc: Sporturile acvatice nu ar trebui să fie un lux. Performanță de nivel profesional la un preț care are sens pentru familii, ghizi și operatori mici — nu doar pentru flote comerciale.
  - icon: 🌍
    title: Comunitate globală
    desc: 'De pe coasta Qingdao până la lacuri din Europa, râuri din Asia de Sud-Est și golfuri din Americi — clienții noștri împărtășesc un lucru: dragostea pentru viața pe apă.'
  - icon: ♻️
    title: Producție responsabilă
    desc: Nestinguirea optimizată pentru CNC reduce risipa de material sub 5%. Construcția durabilă reduce ciclurile de înlocuire. Construit pentru longevitate deoarece aceasta este alegerea cea mai sustenabilă.
  - icon: 🤝
    title: Suport care durează
    desc: Bărci cu douazeci de ani încă ne contactează pentru piese de schimb. Timpul mediu de răspuns pentru garanție este de 24 de ore. Nu dispar după vânzare — suntem aici pentru întreaga durată de viață a produsului.
