hero:
  tagline: Stil de viață
  title: The Paddle Board Overstock<br />Stil de viață
  subtitle: Creat pentru cei care trăiesc pe apă — de la exploratori de weekend la pasionați care numără zilele până la următoarea sesiune.
values:
  - icon: 🌊
    title: Născut pe apă
    desc: Fiecare design începe prin înțelegerea modului în care se comportă apa. Inginerizăm de la marginea condițiilor către interior — pentru că oceanul este profesorul nostru, nu locul nostru de muncă.
  - icon: 🔧
    title: Construit pentru a rezista
    desc: Cel mai sustenabil produs este cel care nu trebuie înlocuit. Materiale de calitate marină, nuclee drop-stitch evaluate la 15 PSI și cusături care rezistă mai mult decât un sezon.
  - icon: 🏆
    title: Accesibil prin design
    desc: Sporturile nautice nu ar trebui să fie un lux. Performanță de nivel profesional la un preț rezonabil pentru familii, ghizi și pasionați de zi cu zi — nu doar pentru profesioniști.
  - icon: 🌍
    title: Comunitate globală
    desc: 'De pe coasta din Weihai până la lacurile din Europa, râurile din Asia de Sud-Est și golfurile din Americi — clienții noștri împărtășesc un lucru: dragostea pentru a fi pe apă.'
  - icon: ♻️
    title: Producție responsabilă
    desc: Nestinguirea optimizată pentru CNC reduce risipa de material sub 5%. Construcția durabilă reduce ciclurile de înlocuire. Construit pentru longevitate deoarece aceasta este alegerea cea mai sustenabilă.
  - icon: 🤝
    title: Suport care durează
    desc: Plăcile pe care le-am construit acum ani încă ne solicită pentru piese de schimb. Răspunsul nostru în cadrul garanției are în medie 24 de ore. Nu dispărăm după vânzare — suntem aici pe toată durata de viață a produsului.
