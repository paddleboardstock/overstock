content_segments:
  tagline: Profiluri de Parteneri
  title: Modele de Parteneriat în Distribuție<br />După Tipul Partenerului
  subtitle: Diferitele tipuri de distribuitori oferă diferite puncte forte pe piață — infrastructură regională, acces e-commerce, retail specializat sau portofolii multi-brand. Structurăm termenii parteneriatului, nivelele de preț și nivelurile de suport pentru a corespunde fiecărui profil de partener.
  items:
    - title: Distribuitori Regionali Marini
      subtitle: Distribuție exclusivă pe teritoriu B2B
      description: Distribuitori consacrați, cu infrastructură de depozit, rețele de dealeri și capabilități logistice, care deservesc dealeri marini, comercianți cu amănuntul de sporturi nautice și operatori de închiriere în cadrul unui teritoriu geografic definit. Aveți nevoie de o linie completă de produse, prețuri protejate și abilitatea de a deservi conturile dealerilor cu stoc local și suport.
      features:
        - Protecție exclusivă a teritoriului cu termeni minimi de angajament
        - Prețuri angro pentru catalog complet cu reduceri de volum trimestriale
        - Program de consignație pentru stoc local pentru SKU-uri cu mișcare rapidă
        - Training pentru rețeaua de dealer și programe de marketing co-branded
    - title: E-commerce & Retaileri online
      subtitle: Canale de distribuție digital-first
      description: Retaileri online care vând echipamente pentru sporturi acvatice prin Amazon, eBay sau propriile platforme de e-commerce. Viteza de livrare pe piață, prețurile competitive și logistica direct către consumator sunt critice. Aveți nevoie de un partener care poate expedia direct comenzile individuale sub brandul dumneavoastră cu îndeplinire rapidă și fără risc de inventar.
      features:
        - 'Program drop-ship: îndeplinirea comenzilor direct de la fabrică cu brandingul dumneavoastră'
        - Feed API pentru inventar în timp real pentru platforma dumneavoastră de e-commerce
        - Integrare Amazon Seller Central cu suport EAN/UPC
        - Include logistică pentru retururi și procesarea cererilor de garanție
    - title: Retaileri specializați în sporturi acvatice
      subtitle: Parteneri cu showroom-uri fizice
      description: Magazine fizice specializate în echipamente pentru sporturi acvatice — servind paddleri locali, pescari și ambarcațiuni cu vânzări în persoană, demonstrații și servicii post-vânzare. Aveți nevoie de ambalaje optimizate pentru retail, programe cu unități demo și materiale pentru punctele de vânzare care să convertească clienții care intră în magazin.
      features:
        - 'Program unități demo: panouri de expunere în showroom la preț redus'
        - Ambalaje pregătite pentru retail cu design optimizat pentru raft
        - Display-uri pentru punctul de vânzare, tabele comparative și ghiduri pentru cumpărători
        - Program de training și certificare pentru personalul din magazin
    - title: Distribuitori Multi-Brand & Magazine universale
      subtitle: Distribuție largă de articole sportive
      description: Distribuitori la scară largă care deservesc magazine universale, retaileri de tip big-box și lanțuri de articole sportive cu cataloage multi-brand. Consistența, documentația de conformitate și conformitatea cu cerințele retailerilor sunt esențiale — fiecare SKU trebuie să respecte standardele specifice retailerilor pentru ambalare, etichetare și calitate.
      features:
        - 'Documentație de conformitate pentru retailer: specificații ambalaj, coduri de bare, etichetare'
        - Integrare EDI/ASN pentru sistemele majore de comandă ale retailerilor
        - Programe de inventar gestionat de furnizor și reaprovizionare automată
        - Management dedicat al contului cu SLA de răspuns în 24 de ore
