hero:
  tagline: Matricea de Soluții pentru Industrie
  title: Soluții marine bazate pe scenarii<br />Pentru operațiuni profesionale
  subtitle: Ambarcațiuni gonflabile special concepute special și RIBs configurate pentru aplicații de salvare, închiriere de flote, tender pentru iahturi și pescuit comercial — fiecare susținută de specificații tehnice și opțiuni de personalizare.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer Soluții marine profesionale pentru industrii diverse
direct_answer: 'Aquafarer Furnizează ambarcațiuni gonflabile proiectate pe scenariu și RIB soluții pentru operațiuni maritime comerciale: bărci de salvare și patrulare cu tuburi întărite Hypalon și siguranță multi-camere, SUPs flote de închiriere și caiace cu cusături sudate de 1,2 mm PVC și aer cald pentru durabilitate redusă, tendere de iahturi de lux cu carenă adâncă în V RIBsdin aluminiu și configurații de pescuit rezistente cu suporturi pentru lansete și sisteme livewell.'
solution_a:
  tagline: Soluția A
  title: Salvare Maritimă & Salvare<br />Patrula Comercială
  subtitle: Siguranță de mare viteză, cu mai multe camere RIBs , pentru intervenții profesionale de urgență și operațiuni de aplicare a legii.
  badge: Heavy-Duty Series
  description: Serviciile noastre de salvare și patrulare RIBs maritimă sunt construite cu Hypalontuburi de înaltă densitate /PVC aer întărite, având un design de plutire independentă cu mai multe camere. Fiecare navă este echipată cu bandă reflectorizantă de calitate profesională, linii de prindere pentru salvare și supape cu umflare rapidă pentru pregătirea pentru desfășurare. Carenele din fibră de sticlă deep-V oferă o stabilitate excepțională la viteze mari și în condiții de mare agitată.
  features:
    - title: Siguranță cu Mai Multe Camere
      description: 4–6 camere de aer independente — orice perforație a unei singure camere menține flotația pozitivă
    - title: Material tubular întărit
      description: 1,2 Hypalon CSM mm sau 1.680 DTEX PVC cu straturi duble sudate cu aer cald
    - title: Gradul Profesionist
      description: SOLAS bandă reflectorizantă, linii de prindere de salvare, cleme de tractare, linie de vopsitori cu eliberare rapidă
    - title: Carenă de mare viteză
      description: Carenă deep-V din fibră de sticlă sau aluminiu evaluată pentru 25–45 noduri, în funcție de configurație
  recommended_models:
    - RIB Patrula 450
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materialul carenei
      value: Fibră de sticlă / aluminiu de calitate marină
    - label: Material tubular
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Viteză maximă
      value: 25–45 noduri
    - label: Capacitate
      value: 6–12 persoane
    - label: Gama motoarelor
      value: 40–200 HP
    - label: Certificare
      value: CE / ISO 9001
solution_b:
  tagline: Soluția B
  title: Închiriere de sporturi nautice &<br />Echipamente pentru flota de stațiuni
  subtitle: Canoi și bărci gonflabile ultra-durabile, cu întreținere redusă, SUPsconstruite pentru închiriere zilnică în stațiuni, cluburi și operațiuni turistice.
  badge: Rental-Grade
  description: Echipamentele noastre de închiriere pentru flotă sunt proiectate pentru cea mai mare durabilitate și costuri de întreținere reduse. Folosim echipamente de 1,2 mm întărite PVC cu tehnologie de cusături sudate cu aer cald cu trei straturi, care rezistă UV degradării și deteriorării frecvente la coliziuni.Drop-stitch Construcția asigură rigiditatea plăcilor chiar și după sute de cicluri de închiriere. Toate modelele au inele D întărite, benzi de șină rezistente la auzură și supape de calitate comercială.
  features:
    - title: De calitate PVCcomercială
      description: 1,2 mm PVC întărit cu UV stabilizatori — de 3 ori mai gros decât materialele de consum
    - title: Cusături sudate cu aer cald
      description: Sudură prin fuziune cu trei straturi — mai rezistentă decât lipirea adezivă, rezistă delaminării
    - title: Drop-Stitch Rigiditate
      description: 1.680 DTEX nucleu cu 2 filete/inch pătrat — evaluat la 20 PSI pentru rigiditate asemănătoare plăcilor dure
    - title: Proiectare pregătită pentru flotă
      description: Inele D întărite, supape comerciale Halkey-Roberts, benzi de șină rezistente la abraziune
  recommended_models:
    - SUP Valul ghepardului
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Material tub
      value: 1,0–1,2 mm întărite PVC
    - label: Tehnologia cusăturilor
      value: Sudură cu aer cald cu trei straturi
    - label: Presiune maximă
      value: 15–20 PSI (drop-stitchmodele)
    - label: Rezistența UV
      value: Testare accelerată de 1.000+ de ore
    - label: Garanție
      value: 2–5 ani, în funcție de model
    - label: Întreținere
      value: Minimal — clătiți și depozitați
solution_c:
  tagline: Soluția C
  title: Ambarcațiuni Tender pentru Yacht &<br />Aparate de lux pe apă
  subtitle: Tender-e ușoare și performante RIB proiectate pentru depozitarea superyacht-urilor și transportul oaspeților, cu finisaje și dotări de lux.
  badge: Premium Series
  description: Tender-ele noastre pentru yacht RIBs combină construcția ușoară cu estetica de lux. Coastele din aluminiu sau fibră de sticlă Deep-V oferă o calitate excepțională a navigației și ridicare ușoară cu davit. Disponibile cu grafice pe tuburi asortate la culoare, tapițerie premium și console personalizate. Dimensiunile compacte de depozitare le fac ideale pentru garajele și depozitarea pe puntea superyacht-urilor.
  features:
    - title: Construcție ușoară
      description: Coaste marina-grade din aluminiu reduc greutatea cu 30% față de fibră de sticlă pentru ridicare facilă
    - title: Performanță Deep-V
      description: Coaste cu unghi de 18–22 grade pentru o călătorie lină în valuri și urmărire excelentă
    - title: Finisaje și dotări de lux
      description: Tapițerie personalizată, tuburi asortate la culoare, consolă premium, pachet inox
    - title: Depozitare compactă
      description: Proiectate pentru garajele superyacht-urilor — tuburi gonflabile pentru depozitare compactă
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Tipul Coastei
      value: Aluminiu / Fibra de sticlă Deep-V
    - label: Unghi de deadrise
      value: 18–22 grade
    - label: Viteză maximă
      value: 30–40 noduri
    - label: Greutate uscată
      value: 120–350 kg (coaste din aluminiu)
    - label: Pregătite pentru ridicare cu davit
      value: Da — puncte de ridicare standard
    - label: Depozitare
      value: Tuburi gonflabile, stivuibile
