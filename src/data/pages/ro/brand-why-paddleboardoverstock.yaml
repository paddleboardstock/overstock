features3_reasons:
  tagline: De ce să alegi Paddle Board Overstock
  title: Șapte motive pentru a colabora cu noi
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Producție reală, nu comerț
      description: Deținem și operăm o fabrică de 12.000 m². Când cumperi de Paddle Board Overstock la , cumperi direct de la cei care proiectează, inginerizează și construiesc placa ta — fără intermediari, fără adaosuri la retail.
      icon: tabler:building-factory
    - title: 2. Abordare condusă de inginerie
      description: Procesul nostru de proiectare începe cu cazul de utilizare, nu cu categoria produsului. Optimizăm forma carenei, selecția materialelor și configurația pentru modul în care placa va fi folosită efectiv.
      icon: tabler:engine
    - title: 3. Calitate dovedită
      description: Fiecare placă este testată 100% la presiune la 1,25x PSI înainte de expediere. O rată de 99,3% fără defecte — măsurată pe fiecare lot, nu doar pe care este declarată.
      icon: tabler:shield-check
    - title: 4. Proiectarea Paddler-First
      description: 'Artă pe terasă, serii de culori, suporturi pentru accesorii și pachete complete — plăci concepute pentru vâslit real: turism, yoga, pescuit, fitness și distracție în familie.'
      icon: tabler:swimming
    - title: 5. Logistică Globală
      description: Livrare directă de la fabrica noastră din Weihai către vâslaștii din 50+ de țări, cu urmărire completă și manipulare vamală.
      icon: tabler:truck-delivery
    - title: 6. Suport pe viață
      description: Susținem plăcile pe care le-am construit cu ani în urmă. Piese de schimb autentice, sfaturi tehnice, îndrumări pentru reparații — echipa noastră este disponibilă când aveți nevoie de noi.
      icon: tabler:lifebuoy
    - title: 7. Specificații oneste
      description: Valori reale ale încărcăturii, dimensiuni reale, greutate reală. Fără umflarea prin marketing. Ceea ce publicăm este ceea ce primiți — verificat prin testare independentă.
      icon: tabler:ruler-measure
