how_to_choose:
  title: Cum să alegi mărimea potrivită
  cards:
    - title: SUP Plăci
      description: Alege lungimea în funcție de greutatea și utilizarea intenționată. Plăcile mai late (32") +oferă mai multă stabilitate. Plăcile mai lungi (11-12 ft) sunt mai bune pentru ture. Vâslașii mai grei au nevoie de plăci cu volum mai mare.
    - title: Caiace
      description: Caiacele single (9 ft) sunt cele mai bune pentru călătorii solo și pe râuri. Caiacele tandem (12 ft) pot acomoda doi vâslași sau un adult cu echipament. Verifică capacitatea de greutate pentru încărcarea totală, inclusiv echipamentul.
    - title: Bărci cu vasle & RIBs
      description: Alege lungimea bărcii în funcție de numărul de pasageri și de utilizarea destinată. Cele mai mari RIBs (4,5 m+) sunt potrivite pentru navigație offshore și salvare. Bărcile mai mici (2,7 m) funcționează ca tendere și platforme de pescuit.
