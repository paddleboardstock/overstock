how_to_choose:
  title: Cum să alegi mărimea potrivită
  cards:
    - title: Plăci All-Around SUP
      description: Plăcile noastre ~11 ft all-around (32" lățime, 6-inch drop-stitch) echilibrează stabilitatea, viteza și capacitatea. Potrivește volumul plăcii cu greutatea ta — vâslele mai grele au nevoie de mai mult volum.
    - title: Lățime & Grosime
      description: Plăcile mai late (32"+) oferă mai multă stabilitate pentru începători, yoga și pescuit. Grosime de 6 inch la 15 PSI menține puntea rigidă sub rider și echipament.
    - title: Pachete și Accesorii
      description: Fiecare placă este livrată ca un pachet complet — placă, rucsac de călătorie, pompă manuală, paddle reglabil, aripioară detașabilă, leash spiralat și trusă de reparații. Verificați sarcina maximă pentru rider plus echipament.
