hero:
  title: Ghid de mărime și specificații
  subtitle: Dimensiuni, capacități și utilizări recomandate pentru fiecare Aquafarer produs.
categories:
  inflatable: Gonflabile SUPs și caiace concepute pentru portabilitate fără a sacrifica performanța. Potrivește mărimea potrivită cu greutatea și stilul tău de vâslit.
  rib: Bărci gonflabile cu carenă rigidă pentru navigație de coastă, patrulare și operațiuni maritime profesionale. Alegeți după lungime și capacitatea motorului.
  accessory: Accesorii și echipamente de siguranță pentru a completa ambarcația ta. Mărimi universale cu multiple opțiuni.
table:
  headers:
