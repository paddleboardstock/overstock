hero:
  title: Ghid de mărime și specificații
  subtitle: Dimensiuni, capacități și utilizări recomandate pentru fiecare produs Paddle Board Overstock.
categories:
  SUP: Plăci gonflabile SUP concepute pentru portabilitate fără a sacrifica performanța. Potrivește dimensiunea corectă greutății și stilului tău de vâslit.
  ACCESSORY: Accesorii și pachete care completează placa ta. Mărimi universale cu multiple opțiuni.
