direct_answer: Paddle Board Overstock furnizează plăci gonflabile noi SUP în stoc pentru afaceri indoneziene — magazine de sporturi nautice din Bali, stațiuni insulare de la Lombok la Gillis și mai departe, cluburi de plajă și operatori de închirieri. Comenzile en-gros încep de la 5 plăci cu modele mixte într-o singură livrare, trimise din Weihai, China, prin transport aerian expres sau transport maritim consolidat. Fiecare placă este testată 100% sub presiune și acoperită de SUP garanția de 2 ani.
tldr_points:
  - En-gros de la 5 plăci — modele mixte, prețuite după cantitatea totală
  - Deservind economia sporturilor nautice din Bali și stațiunile insulare la nivel național
  - Rute scurte de marfă China–Indonezia, aeriene sau maritime
  - 100% testată la presiune, SUP garanție de 2 ani pentru fiecare placă
overview_section:
  tagline: Prezentare generală a pieței
  title: Piața Indoneziană SUP
  paragraphs:
    - Indonezia este una dintre cele mai mari economii ale sporturilor nautice din Asia, iar Bali este inima acesteia. De la cluburile de plajă din Seminyak și Canggu până la lagunele liniștite Sanur și Nusa Dua, plăcile de paddle apar peste tot — vâslit la răsărit peste recife, SUP cursuri de yoga, tururi în lagune și programe pentru oaspeții hotelierilor. Dincolo de Bali, Lombok, Insulele Gili și peisajele turistice în creștere din arhipelag urmează același tipar.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: Durabilitatea UV , performanța și capacitatea de reparare contează mai mult decât luciul catalogului. Comenzile sunt între 5 și 20 de scânduri, amestecate pentru lecții, închirieri și expoziții comerciale.
  customer_types:
    - title: Magazinele de sporturi acvatice din Bali
      description: Operatorii consacrați din Sanur, Seminyak și Canggu au adăugat SUP la liniile de surf, scufundare și snorkel.
    - title: Stațiuni insulare și cluburi de plajă
      description: Resorturi și cluburi de plajă din Bali, Lombok și Gillis organizează programe de paddle și yoga pentru SUP oaspeți.
    - title: Operatori de turism și închirieri
      description: Operatorii de turism din lagune și mangrove și standurile de închiriere la oră reîmprospătează flotele sezonier.
shipping_section:
  title: Nava spre Indonezia
  paragraphs:
    - Indonezia este una dintre cele mai scurte rute de marfă de la baza noastră din Weihai, China. Transportul aerian expres transportă mostre și 1–3 comenzi rapide către Denpasar și Jakarta; Consolidated Sea Freight deservește 5–20 de comenzi en-gros prin Tanjung Priok, Tanjung Benoa și alte porturi. Ambele opțiuni sunt cotate cu timpi estimați de tranzit pentru destinația dumneavoastră.
    - Oferim facturile comerciale și cerințele de eliberare a listei de ambalare, cu coduri HS corecte și valori declarate. Taxele și taxele de import sunt plătite de importator conform regulilor indoneziene.
  customs_note: Autorizația indoneziană pentru echipamente sportive este sensibilă din punct de vedere documental — colaborați cu brokerul vamal (PPJK) pentru a confirma tratamentul actual al taxelor vamale și fiscale. Oferim documentație completă și consecventă și răspundem rapid la cererile brokerilor.
faq_section:
  title: Întrebări frecvente despre Indonezia
  items:
    - q: Cât de rapidă este marfa din China către Bali?
      a: Indonezia este una dintre cele mai apropiate destinații de marfă din Weihai. Aerul expres către Denpasar sau Jakarta este cea mai rapidă opțiune pentru mostre și comenzi mici; transportul maritim consolidat este cotat cu o fereastră de tranzit pentru comenzile en-gros. Ambele sunt detaliate în oferta ta.
    - q: Plăcile sunt potrivite pentru utilizarea zilnică de închiriere în zona UV tropicală?
      a: Da — drop-stitch PVC construcția evaluată pentru cicluri zilnice de închiriere este ceea ce furnizăm flotelor din 50+ de țări. Îngrijirea standard (clătire după apă sărată, depozitare la umbră) le menține în serviciu pe parcursul multor anotimpuri ale soarelui Bali.
    - q: Cum arată o comandă dintr-un magazin de sporturi nautice?
      a: De obicei 5–15 plăci amestecate între modele stabile și versatile pentru lecții și închirieri și câteva ediții premium de artă pentru expunere în magazin — o singură expediere, prețul fiind stabilit în funcție de cantitatea totală.
    - q: Puteți sprijini PPJK-ul nostru cu documentație?
      a: Da. Fiecare comandă se expediază cu o factură comercială și o listă de ambalare cu coduri HS corecte și valori declarate, iar noi răspundem rapid atunci când brokerul dumneavoastră are nevoie de documente suplimentare.
