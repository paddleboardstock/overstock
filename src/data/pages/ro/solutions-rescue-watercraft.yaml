content_challenge:
  tagline: Provocarea
  title: Cererea pentru operațiuni de salvare<br />Fiabilitate necompromisă
  subtitle: Organizațiile de căutare și salvare operează sub o responsabilitate extremă de siguranță — orice defecțiune a ambarcațiunii are consecințe inacceptabile.
  paragraphs:
    - În operațiunile de salvare, diferența dintre succes și eșec se măsoară în minute. Submarinul trebuie să fie gata de lansare imediat, să opereze în condiții dificile și să se întoarcă în siguranță cu pasageri. Responsabilitatea pentru siguranță este absolută — o defecțiune mecanică în timpul unei misiuni de salvare nu reprezintă un cost de reparație, ci o viață pierdută.
    - Bărcile SAR au nevoie de viteză mare pentru a ajunge rapid la victime, combinată cu o stabilitate excepțională pentru operațiuni de recuperare în siguranță. Ele trebuie să transporte echipamente de salvare, materiale medicale și echipamente de comunicații — adesea în spațiu limitat pe punte. Bărcile care operează în serviciul guvernamental au nevoie, de asemenea, de o durată de viață lungă (10-15+ ani) pentru a justifica bugetele de achiziții publice.
    - Vizibilitatea, atât pentru operator, cât și pentru căutare, este esențială. Designul consolei trebuie să asigure vizibilitate de 360 de grade, iar barca trebuie să fie foarte vizibilă pentru aeronave și alte nave.
    - Aquafarer Salvările RIBs sunt proiectate de la început pentru aceste cerințe — cu punți auto-scapabile, corpuri întărite, suite de navigație și stâlpi de tractare standard pe modelele de patrulare.
content_solution:
  tagline: Soluția noastră
  title: Salvare RIBsconstruită special
  subtitle: Fiecare Aquafarer barcă de salvare este proiectată să respecte sau să depășească SOLAS standardele naționale SAR.
  list:
    - Platformă auto-scăldătoare — scurgeri automate de apă pentru stabilitate în timpul operațiunilor de recuperare
    - Carenă adâncă întărită în V — capacitate în ape agitate cu manevrabilitate previzibilă la viteză
    - Sistem complet de lumini de navigație — operațional zi și noapte în orice condiții meteo
    - Post de remorcare și linie de tractare — pregătite pentru operațiuni de remorcare a navelor sau salvare cu sania
    - Plăci de montare pentru echipamente — radio, reflector, sirenă și echipamente medicale
    - Configurații multiple de motoare — redundanță cu un singur motor exterior sau cu două motoare
    - Culorile tuburilor de înaltă vizibilitate — portocaliu, galben sau roșu pentru vizibilitate maximă
content_segments:
  tagline: Profiluri de salvare
  title: Soluții pentru ambarcațiuni de căutare și salvare<br />După tipul organizației
  subtitle: Diferite organizații de salvare operează sub mandate diferite, cicluri bugetare și medii operaționale diferite — de la echipaje voluntare de coastă până la flote ale gărzii naționale de coastă. Configurăm fiecare operațiune RIB de salvare pentru a corespunde profilului misiunii.
  items:
    - title: Garda de Coastă și Agențiile SAR Guvernamentale
      subtitle: Responsabilitate absolută în siguranță — standarde esențiale pentru flotă
      description: Agențiile guvernamentale SAR poartă cea mai înaltă responsabilitate de siguranță în operațiunile maritime. Fiecare ambarcațiune trebuie să funcționeze impecabil în condiții extreme — defecțiunea echipamentului în timpul unei misiuni de salvare nu este o opțiune. Deciziile de achiziții sunt determinate de costul total de proprietate pe parcursul a 10-15 ani de viață utilă, nu de prețul inițial. Agențiile au nevoie de nave care să supraviețuiască ani de patrulare de coastă, să îndeplinească standarde naționale stricte și să asigure performanțe consecvente între stațiile distribuite. Documentația cuprinzătoare de conformitate și acordurile de servicii pe mai mulți ani sunt obligatorii.
      features:
        - SOLAS și pachetul național de documentație pentru conformitatea standardelor SAR
        - Componentele comune la nivelul întregii flote — reducerea complexității inventarului la nivel de stație
        - Configurație cu două motoare pentru redundanță critică pentru misiune
        - Proiectare de viață de serviciu de 10-15 ani cu programe de întreținere programată
        - Capacitate pentru orice vreme — carenă profundă întărită în formă de V pentru stări de mare agitată
    - title: Salvamari și Servicii de Salvare pe Plajă
      subtitle: Lansare rapidă, operațiuni în ape puțin adânci
      description: Serviciile municipale și de salvamar de pe plajă care necesită ambarcațiuni cu răspuns rapid, care pot lansa prin zonele de surf, pot opera în ape puțin adânci de coastă și pot ajunge la înotători sau ambarcațiuni aflate în dificultate în câteva minute. Echipamentul trebuie să fie suficient de ușor pentru tractarea plajei cu un vehicul mic sau manual.
      features:
        - Carenă cu pescaj mic RIB pentru zonele de surf și operațiuni la țărm
        - Lansare pe plajă, cu mâner de ridicare la prova și protecție la chilă
        - Platformă integrată de sanie de salvare sau pentru înotători de salvare
        - Culori standard ale tuburilor portocalii sau galbene de înaltă vizibilitate
    - title: Departamentele de Salvare a Pompierilor
      subtitle: Integrarea pompei de incendiu, montarea echipamentelor, răspuns rapid
      description: Unitățile marine de salvare a incendiilor răspund la incendii de structuri pe malul apei, incendii de ambarcațiuni și incidente de salvare pe apă. Aceste bărci trebuie să transporte pompe de incendiu, monitoare, depozitare a furtunurilor și aparate de respirație — toate integrate într-o platformă stabilă și cu răspuns rapid. Departamentele folosesc, de asemenea, aceste nave pentru răspuns la inundații și operațiuni de ajutor reciproc. Configurațiile consolelor trebuie să includă comenzi ale pompelor, sisteme radio și iluminat de urgență fără a compromite spațiul de pe punte pentru mișcarea echipajului.
      features:
        - Monitor de foc montat la prova cu pachet de integrare a pompei
        - Montare dedicată pentru echipamente pentru pompa de incendiu, depozitarea furtunurilor și seturi BA
        - Configurația consolei este configurabilă pentru controale pompei, radio și iluminat de urgență
        - Platformă cu auto-scurgere a apei pentru stingerea incendiilor și stabilitate
        - 'Pachet de operațiuni pe timp de noapte: reflector, iluminare a scenei, bară de lumină albastră/roșie'
    - title: Poliția Maritimă și Securitatea Portuară
      subtitle: Interdicție, patrulare, operațiuni de interceptare la bord
      description: Unitățile de aplicare a legii marine necesită vase capabile de urmărire la mare viteză, îmbarcare pe nave suspecte și patrulare pentru securitatea portului. Aceste bărci trebuie să aibă spațiu sigur pentru depozitarea echipamentului de aplicare a legii și a armelor, integrare a comunicațiilor cu comanda de pe țărm și suficient spațiu pe punte pentru operațiunile echipajului de îmbarcare. Capacitatea de operare pe timp de noapte și abordarea discreta sunt esențiale pentru misiunile de interdicție.
      features:
        - Capacitate de urmărire la viteză mare — corp planant cu viteză maximă de 40+ noduri
        - Compartimente securizate pentru depozitarea armelor și echipamentului de aplicare a legii
        - Integrare a consolei pentru radioul polițienesc, MDT și sistemele de comunicații
        - 'Pachet pentru operațiuni nocturne: proiector IR, suport FLIR, iluminare ascunsă'
        - Platformă de îmbarcare consolidată cu suprafață antiderapantă
        - Sistem de iluminare de urgență albastru/roșu și sirenă
    - title: Organizații voluntare de căutare și salvare și organizații non-profit
      subtitle: Operațiuni costiere și lacustre comunitare finanțate din granturi
      description: Grupurile de salvare bazate pe comunitate operează în lacuri, râuri și zone de coastă unde acoperirea SAR guvernamentală este limitată. Adesea finanțate prin donații sau subvenții guvernamentale, aceste organizații au nevoie de o capacitate maximă per dolar — o ambarcațiune fiabilă și cu întreținere redusă pe care voluntarii o pot opera în siguranță cu un minim de instruire dedicată. Ciclurile de obținere a finanțării prin granturi înseamnă că bărcile trebuie să respecte cerințele de conformitate, menținând în același timp bugetele fixe.
      features:
        - Configurație cu un singur motor în afara bordului optimizată pentru costuri mai mici de achiziție și operare
        - PVC construcție pentru întreținere redusă și reparații ușoare pe teren
        - Consolă multifuncțională care reduce complexitatea electronică pentru operatorii voluntari
        - Pachet de documentație pentru conformitatea cu granturile pentru cererile de finanțare
        - Design ușor pentru lansarea pe plajă fără remorcă sau macarale dedicate
    - title: Salvarea în caz de inundații și răspuns la dezastre
      subtitle: Inundații în interiorul țării, ape joase, medii încărcate cu resturi
      description: Salvarea în caz de inundații reprezintă un profil operațional distinct — bărcile operează în zone urbane inundate, curenți plini de resturi și ape extrem de puțin adânci, unde obstacolele scufundate sunt invizibile. Operatorii au nevoie de ambarcațiuni care să poată naviga pe străzile inundate, să străpungă resturile și să extragă victimele din clădiri și vehicule. Capacitatea de a opera în ape puțin adânci este critică, la fel ca și abilitatea de a acționa în curenți cu pericole de prindere. Aceste bărci sunt adesea desfășurate de departamentele de pompieri, apărarea civilă și organizațiile neguvernamentale de ajutor în caz de dezastru.
      features:
        - Elemă cu pescaj ultra-șallow — funcționează în apă de 30-50 cm
        - Arc care deviază resturile și protecție cu tub consolidat pentru obstacole scufundate
        - Punte auto-descărcătoare pentru evacuarea apelor de inundație și recuperarea victimelor
        - Tuburi portocalii sau galbene cu vizibilitate ridicată pentru vizibilitate în recunoaștere aeriană
        - Design ușor pentru transport cu elicopterul și desfășurare pe drum
        - Puncte de ridicare consolidate pentru operațiuni cu macarale și salvare cu frânghie
