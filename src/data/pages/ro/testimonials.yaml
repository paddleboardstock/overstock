testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Proprietar, Algarve Surf Academy
    location: Lagos, Portugalia
    content: Am început cu Pachetul de Start al Clubului pentru școala noastră de surf. 20 de plăci, vâsle, veste — totul a sosit în 3 săptămâni. După două sezoane, am trecut la Pachetul Pro. Brandingul personalizat cu logo-ul nostru a fost un element esențial pentru imaginea noastră profesională.
    rating: 5
    product: Pachet de pornire pentru club
    source: solutions/clubs
  - category: clubs
    name: Proprietar de Club
    title: Club de Sporturi Acvatice
    location: Phuket, Thailanda
    content: Pachetul de Start al Clubului a fost punctul de plecare perfect. Pe măsură ce afacerea noastră a crescut, Aquafarer a crescut odată cu noi — aceeași calitate, aceleași prețuri, fără surprize. Am trecut de la 10 la 80 de plăci în 18 luni.
    rating: 5
    product: Pachet Club Starter + Pachet Premium
    source: success-stories
  - category: resorts
    name: Manager General Resort
    title: Stațiune de plajă cu 5 stele
    location: Grecia
    content: Aquafarer nu ne-a livrat doar plăcile — ne-a ajutat să construim o experiență completă pentru oaspeți. Programul nostru de sporturi acvatice a crescut de la zero la atracția principală a stațiunii într-un singur sezon. 300+ rezervări săptămânale și 180.000 $ venit anual.
    rating: 5
    product: Pachet Premium la Stațiune
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Director Experiență Clienți, Azure Bay Resorts
    location: Phuket, Thailanda
    content: Aquafarer a proiectat și echipat întregul nostru program de activități pe plajă în trei proprietăți de resort. 80 SUPs, 40 de caiace, infrastructură de siguranță și instruirea personalului — toate livrate într-o singură expediție. Participarea oaspeților a crescut cu 60% în primul sezon.
    rating: 5
    product: Pachet Premium la Stațiune
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Fondator, Shoreline Paddle Co.
    location: California, SUA
    content: Am lansat brandul meu SUP fără nicio experiență în industrie. Echipa Aquafarer m-a ghidat de la selecția produsului la design-ul logo-ului personalizat și ambalare. Primul meu container a sosit în 11 săptămâni și am vândut toată cantitatea în 3 luni pe Amazon.
    rating: 5
    product: Lansare Brand Starter
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Fondator
    title: Brand Australian SUP
    location: Australia
    content: Aveam ideea brandului, dar zero cunoștințe de producție. Aquafarer m-a ghidat literalmente prin întregul proces — de la alegerea tipului de placă până la despachetarea primei livrări. 90 de zile de la vis la livrare.
    rating: 5
    product: Pachet de lansare a brandului
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Proprietar, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Închiriam 5 plăci de la un magazin local și pierdeam 60% din venituri în favoarea lor. Aquafarer m-a ajutat să construiesc propria flotă de 15 SUPs. Calculatorul ROI a arătat punctul de break-even în 4 luni — s-au necesitat 3. Acum mă extind la 30 de plăci.
    rating: 5
    product: Kit de pornire pentru flotă
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Director Operațiuni, Adriatic Adventure Tours
    location: Dubrovnik, Croația
    content: Am echipat întreaga noastră flotă de închiriere cu Aquafarer RIBs — 12 bărci în trei locații. După două sezoane, niciun defect. Documentația de certificare CE a făcut aprobatrea asigurării să fie fără probleme. Echipa lor de inginerie a personalizat chiar și culorile tuburilor.
    rating: 5
    product: Kit de extindere a flotei
    source: trust
  - category: rental
    name: Lt. Comandant Andres Reyes
    title: Ofițer Achiziții Maritime, Garda de Coastă Auxiliară a Filipinelor
    location: Manila, Filipine
    content: Operăm 24 Aquafarer RIBs în întreaga noastră flotă de patrulare costieră. Procesul lor QC este consistent pentru fiecare lot — aceeași calitate a cusăturilor, același amplasament al supapelor, aceeași presiune de fiecare dată. Această repetabilitate contează când viețile depind de echipamente.
    rating: 5
    product: RIB Flotă de patrulare
    source: trust
  - category: consumers
    name: Sarah K.
    title: Proprietar SUP pentru prima dată
    location: Lacul Tahoe, SUA
    content: Stabil chiar și pentru un începător complet. Am luat-o pe lac în prima zi și nu am căzut niciodată. Pachetul complet cu pompă și vâslă a însemnat că eram pe apă la 20 de minute după ce am deschis cutia.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Proprietar Explorer 11
    location: Vancouver, Canada
    content: Ca prim cumpărător, eram îngrijorat de calitate comandând din străinătate. Documentația ISO și rapoartele de testare de la terți pe care le-au împărtășit înainte să le cer mi-au oferit încredere completă. Placa a ajuns în 6 zile și a depășit așteptările mele.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Caiacist recreațional
    location: Florida, SUA
    content: Calitate solidă a construcției. Face față valurilor de coastă mult mai bine decât m-aș fi așteptat de la un inflatable. Am băgat-o în portbagajul mașinii pentru o excursie de weekend — s-a umflat pe rampla în mai puțin de 4 minute.
    rating: 5
    product: Kajak Gonflabil
