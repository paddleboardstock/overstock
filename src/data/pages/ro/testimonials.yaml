testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Proprietar, Algarve Surf Academy
    location: Lagos, Portugalia
    content: Am început cu Pachetul de Start al Clubului pentru școala noastră de surf. 20 de plăci, vâsle, veste — totul a sosit în 3 săptămâni. După două sezoane, am trecut la Pachetul Pro. Brandingul personalizat cu logo-ul nostru a fost un element esențial pentru imaginea noastră profesională.
    rating: 5
    product: Pachet de pornire pentru club
    source: solutions/clubs
  - category: clubs
    name: Proprietar de Club
    title: Club de Sporturi Acvatice
    location: Phuket, Thailanda
    content: Pachetul Club Starter a fost punctul de intrare perfect. Pe măsură ce afacerea noastră a crescut, Paddle Board Overstock a crescut odată cu noi — aceeași calitate, aceleași prețuri, fără surprize. Am trecut de la 10 la 80 de bărci în 18 luni.
    rating: 5
    product: Pachet Club Starter + Pachet Premium
    source: success-stories
  - category: resorts
    name: Manager General Resort
    title: Stațiune de plajă cu 5 stele
    location: Grecia
    content: Paddle Board Overstock nu doar că a livrat bărci — ne-a ajutat să construim o experiență completă pentru oaspeți. Programul nostru de sporturi nautice a trecut de la zero la principalul punct de atracție al stațiunii într-un singur sezon. 300+ rezervări săptămânale și 180.000 $ venit anual.
    rating: 5
    product: Pachet Premium la Stațiune
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Director Experiență Clienți, Azure Bay Resorts
    location: Phuket, Thailanda
    content: Paddle Board Overstock a proiectat și echipat întregul nostru program de activități pe plajă în trei proprietăți de resort. 120 SUPs, infrastructură de siguranță și instruirea personalului — toate livrate într-o singură expediere. Participarea oaspeților a crescut cu 60% în primul sezon.
    rating: 5
    product: Pachet Premium la Stațiune
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Proprietar, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Închiriam 5 plăci de la un magazin local și pierdeam 60% din venituri. Paddle Board Overstock m-a ajutat să-mi construiesc propria flotă de 15 SUPs. Calculatorul ROI arăta punctul de echilibru în 4 luni — a durat 3. Acum extind la 30 de plăci.
    rating: 5
    product: Kit de pornire pentru flotă
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Director Operațiuni, Adriatic Adventure Tours
    location: Dubrovnik, Croația
    content: Am echipat întreaga noastră flotă de închirieri SUP cu plăci Paddle Board Overstock — 30 de plăci în trei locații. După două sezoane, zero defecțiuni. Calitatea constantă în fiecare lot ne-a făcut alegerea ușoară, iar echipa lor a potrivit chiar culorile cu brandul nostru.
    rating: 5
    product: Pachet Flotă de Închirieri
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Proprietar, Închirieri SUP Lake Garda
    location: Lacul Garda, Italia
    content: Plăcile noastre de închiriat ies de cinci ori pe zi în sezonul de vârf. De când am trecut la Paddle Board Overstock, reclamațiile privind deteriorarea au scăzut aproape de zero, iar clienții continuă să întrebe unde își pot cumpăra propria placă.
    rating: 5
    product: Pachet Flotă de Închirieri
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Proprietar SUP pentru prima dată
    location: Lacul Tahoe, SUA
    content: Stabil chiar și pentru un începător complet. Am luat-o pe lac în prima zi și nu am căzut niciodată. Pachetul complet cu pompă și vâslă a însemnat că eram pe apă la 20 de minute după ce am deschis cutia.
    rating: 5
    product: Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Proprietar Explorer 11
    location: Vancouver, Canada
    content: Ca prim cumpărător, eram nervos să comand din străinătate. Calitatea construcției a vorbit de la sine în momentul în care am despachetat-o — rigidă, cusături impecabile, și a ajuns în doar 6 zile.
    rating: 5
    product: Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Paddler de Weekend
    location: Florida, SUA
    content: Calitate solidă a construcției. Face față valurilor de coastă mult mai bine decât m-aș fi așteptat de la un inflatable. Am băgat-o în portbagajul mașinii pentru o excursie de weekend — s-a umflat pe rampla în mai puțin de 4 minute.
    rating: 5
    product: SUP Briza Tropicală
