features3_certifications:
  title: Certificări și conformitate
  subtitle: Fiecare produs este testat independent; 64 de modele sunt CE certificate conform standardelor internaționale.
  columns: 3
  isBeforeContent: true
  items:
    - title: Certificare CE
      description: 64 CEde modele certificate SUPs- în distribuție, caiace, bărci mici și RIBs îndeplinesc CE standardele europene de siguranță pentru ambarcațiunile de recreere. Fiecare produs trece prin teste de presiune, flotabilitate și încărcătură înainte de a părăsi fabrica.
      icon: tabler:certificate
    - title: ''
      description: Facilitățile noastre din Qingdao, de 12.000 m², funcționează sub un ISO sistem de management al calității 9001. Fiecare lot de producție este trasabil, documentat și inspectat.
      icon: tabler:clipboard-check
    - title: BSCI Conformitatea socială
      description: Suntem BSCI-certificați, asigurând practici etice de muncă, condiții sigure de muncă și responsabilitate față de mediu pe întregul nostru lanț de aprovizionare.
      icon: tabler:users
    - title: REACH & RoHS
      description: Toate materialele — PVC, HypalonEVA , spumă, adezivi — respectă REACH RoHS reglementările UE și reglementările. Fără substanțe restricționate, fără compromisuri.
      icon: tabler:flask
    - title: Laboratorul de Testare a Materialelor
      description: Laboratorul intern de materiale testează rezistența la tracțiune, UV rezistența, integritatea cusăturii și abraziune pentru fiecare lot de țesătură înainte de producție.
      icon: tabler:microscope
    - title: Garanția de 5 ani pentru bărci
      description: Aquafarer Bărcile sunt acoperite de o garanție limitată de 5 ani pentru țesătura tubulară, cusăturile și carena.SUP Plăcile și accesoriile au o garanție de 2 ani. Susținem ceea ce construim.
      icon: tabler:shield-check
testimonials:
  tagline: Încrederea clienților
  title: Ce spun clienții noștri
  subtitle: De la începători la vâslași până la operatori profesioniști de flote — vezi de ce au Aquafarerîncredere în .
  items:
    - content: Am echipat întreaga noastră flotă de închirieri cu Aquafarer RIBs — 12 bărci în trei locații. Două sezoane după, zero defecțiuni. Documentația pentru certificarea CE a făcut aprobarea asigurării simplă. Echipa lor de inginerie a personalizat chiar și culorile tubului pentru a se potrivi cu brandul nostru.
      name: Marco Valenti
      title: Director Operațiuni, Adriatic Adventure Tours — Dubrovnik, Croația
    - content: Ca prim cumpărător, eram îngrijorat de calitate comandând din străinătate. Documentația ISO și rapoartele de testare de la terți pe care le-au împărtășit înainte să le cer mi-au oferit încredere completă. Placa a ajuns în 6 zile și a depășit așteptările mele.
      name: James Thornton
      title: Proprietar SUP Explorer 11 — Vancouver, Canada
    - content: Operăm 24 Aquafarer RIBs în întreaga noastră flotă de patrulare costieră. Procesul lor QC este consistent pentru fiecare lot — aceeași calitate a cusăturilor, același amplasament al supapelor, aceeași presiune de fiecare dată. Această repetabilitate contează când viețile depind de echipamente.
      name: Lt. Comandant Andres Reyes
      title: Ofițer Achiziții Maritime, Garda de Coastă Auxiliară Filipino — Manila, Filipine
features3_lab:
  title: Laborator de Testare și Calitate Intern
  subtitle: Fiecare lot de materiale și produs finit trece prin laboratorul nostru de testare in-house înainte de expediere.
  columns: 3
  isBeforeContent: true
  items:
    - title: Testarea Rezistenței la Tracțiune
      description: 'Fiecare rolă de material PVC este testată conform standardelor ASTM D751. Cerință minimă: 350 N/cm pe urzeală și bătaie. Loturile respinse sunt returnate furnizorului — respingem aproximativ 3% din materialele primite.'
      icon: tabler:scale
    - title: Îmbătrânire Accelerată UV
      description: Mostrele de material parcurg 1.000 de ore de expunere accelerată la intemperii QUV (ASTM G154). Păstrarea rezistenței la tracțiune trebuie să depășească 80% după expunerea UV. Produse evaluate pentru 3+ ani de utilizare în exterior.
      icon: tabler:sun
    - title: Rezistența la Dezlipirea Cusăturii
      description: Cusăturile sudate RF sunt testate pentru o rezistență la dezlipire minimă de 5 N/mm (ASTM D751). Cusăturile lipite manual Hypalon sunt testate la 3,5 N/mm. Fiecare lot de producție are mostre de cusături testate distrugător și arhivate.
      icon: tabler:stack
    - title: Menținerea Presiunii 24–48 Ore
      description: 'Fiecare produs gonflabil este umflat la 1,25x presiunea nominală PSI și monitorizat timp de 24–48 de ore. Reducerea maxim admisă a presiunii: 5%. Produsele care nu trec acest test sunt refăcute și retestate înainte de expediere.'
      icon: tabler:wind
    - title: Testarea Ciclică a Supapelor
      description: Fiecare model de supapă trece prin 10.000 de cicluri de deschidere-închidere în laboratorul nostru. Supapele trebuie să mențină etanșeitatea la 1,25x presiunea nominală după ciclare. Toate supapele Aquafarer sunt evaluate pentru 5+ ani de utilizare regulată.
      icon: tabler:rotate
    - title: Rezistența la Crapare la Frig
      description: Materialele sunt testate la -30°C timp de 4 ore conform ISO 4646. Nu sunt permise crăpături sau fragilizare. Produsele sunt evaluate pentru depozitare de iarnă și utilizare în apă rece până la temperatura ambiantă de -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Cum asigurăm calitatea
  subtitle: De la inspecția materiei prime până la testarea finală a presiunii — fiecare produs trece printr-un lanț riguros de control al calității.
  items:
    - title: Inspecția materiilor prime
      description: Fiecare rolă de material PVC este testată pentru grosime, rezistență la tracțiune și rezistența la UV înainte de intrarea în producție.
      icon: tabler:search
    - title: Controlul Calității în Proces
      description: Cusăturile sudate, instalarea supapelor și legăturile camerelor sunt inspectate la fiecare stație în timpul asamblării.
      icon: tabler:eye
    - title: Testarea Presiunii
      description: Fiecare produs gonflabil este umflat la o evaluare de 1,25x PSI și ținut între 24 și 48 de ore pentru a verifica retenția aerului și integritatea cusăturii.
      icon: tabler:wind
    - title: Inspecția finală
      description: Fiecare unitate este inspectată pentru finisare, feronerie și ambalare înainte de a fi aprobată pentru expediere. Probele din loturi sunt trimise la laboratorul nostru pentru testare distructivă.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Întrebări frecvente despre bărci
  subtitle: Întrebări frecvente despre bărcile noastre gonflabile cu corp rigid.
  columns: 2
  items:
    - title: Ce dimensiuni de RIB Aquafarer bărci oferă?
      description: Oferim 35 RIB de modele, variind de la 2,5 m până la 7,6 m, acoperind totul, de la tendere compacte până la ambarcațiuni comerciale și de patrulare grele. Fiecare model este disponibil cu multiple opțiuni de configurație.
    - title: Care este diferența dintre o RIB barcă gonflabilă tradițională și o barcă gonflabilă tradițională?
      description: A RIB (Rigid-hull Inflatable Boat) combină o carenă solidă din fibră de sticlă sau aluminiu deep-V cu o barcă Hypalon gonflabilă sau PVC tuburi. Acest lucru îți oferă stabilitatea și capacitatea de încărcare ale unei bărci rigide, cu absorbția șocurilor și flotabilitatea unui gonflabil.
    - title: Cu ce motoare sunt Aquafarer RIBscompatibile?
      description: RIBs Suportăm motoare exterioare de la 3 HP la 250 HP , în funcție de model. Fiecare pagină de produs listează puterea maximă nominală a motorului. Vă recomandăm să consultați dealerul pentru potrivirea ideală.
    - title: Ești Aquafarer RIBs CE certificat?
      description: Da. Toate RIB modelele recreative sunt CE certificate conform standardelor europene aplicabile pentru ambarcațiunile de agrement. Modelele comerciale și de patrulare îndeplinesc cerințe suplimentare de stabilitate și încărcare.
    - title: Care este garanția la RIB bărci?
      description: Toate Aquafarer RIBs vin cu o garanție limitată de 5 ani pentru țesătura țesăturii, cusăturile și carena; supapele de umflare acoperite timp de 5 ani; accesoriile instalate din fabrică acoperite pentru 1 an.
    - title: Câte camere de Aquafarer RIBs aer au?
      description: RIBs Avem 3 până la 7 camere de aer independente, în funcție de lungimea modelului. Acest design cu mai multe camere asigură că barca rămâne la suprafață chiar dacă un compartiment este compromis.
faqs_inflatable:
  title: Întrebări frecvente despre bărci gonflabile
  subtitle: Întrebări frecvente despre bărcile noastre gonflabile, caiacele și bărcile.
  columns: 2
  items:
    - title: Ce materiale sunt folosite în Aquafarer bărcile gonflabile?
      description: Folosim material militar PVC (1100 denegar) și premium Hypalon/CSM cauciuc, în funcție de model. Ambele materiale sunt UVstabilizate, rezistente la abraziune și conform REACH RoHS reglementărilor UE și reglementărilor.
    - title: Cât durează bărcile gonflabile?
      description: Cu o îngrijire adecvată, o PVC barcă gonflabilă de calitate rezistă între 7 și 10 ani, în timp ce Hypalon modelele pot rezista între 15 și 20 de ani. Curățarea regulată, UV protecția și depozitarea corespunzătoare prelungesc semnificativ durata de serviciu.
    - title: Ce întreținere este necesară pentru o barcă gonflabilă?
      description: Întreținerea de bază include clătirea cu apă proaspătă după fiecare utilizare (mai ales în apă sărată), uscarea înainte de depozitare, verificarea anuală a garniturilor supapelor și aplicarea UV unui protector pe tuburi. Evitați expunerea prelungită la soare atunci când nu este folosit.
    - title: Pot fi folosite bărcile gonflabile în apă sărată?
      description: Da. Toate Aquafarer bărcile gonflabile sunt proiectate atât pentru utilizare în apă dulce, cât și în apă sărată. Recomandăm clătirea cu apă dulce și uscarea temeinică după expunerea la apă sărată pentru a preveni coroziunea la potrivire și cristalizarea sării textile.
    - title: Cum depozitez o barcă gonflabilă?
      description: Dezumflă, curăță și usucă complet barca înainte de depozitare. Rulează ușor (evită pliurile strânse), păstrează-le într-un loc răcoros și uscat, departe de lumina directă a soarelui, și evită podelele de beton pentru a preveni abstinența umidității.
    - title: Care este capacitatea de greutate a Aquafarer bărcilor gonflabile?
      description: Capacitățile de greutate variază de la 290 kg pentru cele mai mici modele ale noastre până la peste 2000 kg pentru ambarcațiunile comerciale mai mari. Fiecare pagină de produs listează capacitatea maximă de încărcare pentru modelul dvs. specific.
faqs_sup:
  title: SUP Întrebări frecvente despre plăci
  subtitle: Întrebări comune despre plăcile noastre stand-up paddle.
  columns: 2
  items:
    - title: Ce SUP mărimi de plăci sunt disponibile?
      description: Oferim SUP plăci de la 9 ft la 12 ft, inclusiv modele all-round, de tur, yoga și designuri speciale. Modelele noastre cele mai vândute includ Tropical Breeze (10 ft) și Ocean Voyager (11 ft).
    - title: Ce este drop-stitch construcție?
      description: Construcția Drop-stitch folosește mii de fire de poliester care conectează straturile superioare și inferioare ale plăcii, permițându-i să suporte presiuni mari de aer (15–20 PSI) și să obțină o platformă rigidă și stabilă. Aceasta este standardul industriei pentru SUPs premium gonflabile.
    - title: Care este limita de greutate pentru SUP plăci?
      description: Plăcile noastre SUP suportă până la 150 kg în funcție de model și volum. Placa Leviathan Wake este modelul nostru cu cea mai mare capacitate, concepută pentru rideri mai mari și pentru utilizarea la yoga.
    - title: Oferiți pachete complete SUP?
      description: Da. Fiecare placă SUP se livrează cu un pachet complet, inclusiv o vâslă din aluminiu în 3 piese, pompă manuală de mare presiune, coardă de siguranță, rucsac de călătorie și kit de reparații. Unele modele includ, de asemenea, un set de aripioare detașabile.
    - title: Care este garanția pentru plăcile SUP?
      description: Toate plăcile Aquafarer SUP au o garanție de 2 ani împotriva defectelor de fabricație, inclusiv defecte la cusături, supape, și delaminarea materialului în condiții normale de utilizare.
    - title: Cât durează să umflați o placă SUP?
      description: Folosind pompa manuală inclusă, umflarea completă la 15 PSI durează aproximativ 8–12 minute. Pentru o umflare mai rapidă, recomandăm pompa electrică Aquafarer 12V, care umflă o placă în mai puțin de 4 minute.
