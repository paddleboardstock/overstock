features3_certifications:
  title: Calitate și testare
  subtitle: Fiecare placă este testată în propriul nostru laborator înainte de a fi expediată — numere reale, înregistrări reale, fără afirmații de marketing.
  columns: 3
  isBeforeContent: true
  items:
    - title: Construit în propria noastră fabrică
      description: Deținem și operăm o facilitate de 12.000 m² în Weihai. Fiecare lot de producție este trasabil, documentat și inspectat — fără producție misterioasă externalizată.
      icon: tabler:building-factory
    - title: Laboratorul de Testare a Materialelor
      description: Laboratorul intern de materiale testează rezistența la tracțiune, UV rezistența, integritatea cusăturii și abraziune pentru fiecare lot de țesătură înainte de producție.
      icon: tabler:microscope
    - title: Materiale de calitate marină
      description: UV-stabilizat PVC, miezuri drop-stitch, și spumă pentru punte EVA — alese și testate pentru sezoane de soare, sare și uzură.
      icon: tabler:flask
    - title: Garanție de 2 ani SUP
      description: Paddle Board Overstock Plăcile SUP sunt acoperite de o garanție de 2 ani împotriva defectelor de fabricație, inclusiv cusături, supape și delaminarea materialului. Ne asumăm ceea ce construim.
      icon: tabler:shield-check
testimonials:
  tagline: Încrederea clienților
  title: Ce spun clienții noștri
  subtitle: De la novice la exploratori experimentați — vedeți de ce au încredere în Paddle Board Overstock.
  items:
    - content: Fiind un cumpărător pentru prima dată, eram nervos să comand din străinătate. Echipa a răspuns la fiecare întrebare cu fotografii reale și înregistrări de teste înainte chiar să întreb. Placa a sosit în 6 zile și a depășit așteptările mele.
      name: James Thornton
      title: Proprietar SUP Explorer 11 — Vancouver, Canada
features3_lab:
  title: Laborator de Testare și Calitate Intern
  subtitle: Fiecare lot de materiale și produs finit trece prin laboratorul nostru de testare in-house înainte de expediere.
  columns: 3
  isBeforeContent: true
  items:
    - title: Testarea Rezistenței la Tracțiune
      description: 'Fiecare rolă de material PVC este testată intern pentru rezistența la tracțiune. Cerința minimă: 350 N/cm urzeală și bătătură. Loturile respinse sunt returnate furnizorului — respingem aproximativ 3% din materialele primite.'
      icon: tabler:scale
    - title: Îmbătrânire Accelerată UV
      description: Mostrele de material textil sunt supuse unei expuneri accelerate la intemperii de 1.000 de ore. Rezistența la tracțiune trebuie să păstreze 80% după expunere. Produsele sunt evaluate pentru 3 ani de utilizare în exterior.
      icon: tabler:sun
    - title: Rezistența la Dezlipirea Cusăturii
      description: Cusăturile sudate sunt testate la o rezistență minimă la decojire de 5 N/mm. Fiecare lot de producție are mostre de cusături testate distructiv și arhivate.
      icon: tabler:stack
    - title: Menținerea Presiunii 24–48 Ore
      description: 'Fiecare produs gonflabil este umflat la 1,25x presiunea nominală PSI și monitorizat timp de 24–48 de ore. Reducerea maxim admisă a presiunii: 5%. Produsele care nu trec acest test sunt refăcute și retestate înainte de expediere.'
      icon: tabler:wind
    - title: Testarea Ciclică a Supapelor
      description: Fiecare design de supapă trece prin 10.000 de cicluri de deschidere-închidere în laboratorul nostru. Supapele trebuie să mențină etanșeitatea la o presiune de 1,25 ori presiunea nominală după cicluri. Toate supapele Paddle Board Overstock sunt evaluate pentru 5+ ani de utilizare obișnuită.
      icon: tabler:rotate
    - title: Rezistența la Crapare la Frig
      description: Materialele sunt testate la -30°C timp de 4 ore. Nu sunt permise crăpături sau fragilizare. Produsele sunt evaluate pentru depozitare de iarnă și utilizare cu apă rece până la temperatura ambientală de -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Cum asigurăm calitatea
  subtitle: De la inspecția materiei prime până la testarea finală a presiunii — fiecare produs trece printr-un lanț riguros de control al calității.
  items:
    - title: Inspecția materiilor prime
      description: Fiecare rolă de material PVC este testată pentru grosime, rezistență la tracțiune și rezistența la UV înainte de intrarea în producție.
      icon: tabler:search
    - title: Controlul Calității în Proces
      description: Cusăturile sudate, instalarea supapelor și legăturile camerelor sunt inspectate la fiecare stație în timpul asamblării.
      icon: tabler:eye
    - title: Testarea Presiunii
      description: Fiecare produs gonflabil este umflat la o evaluare de 1,25x PSI și ținut între 24 și 48 de ore pentru a verifica retenția aerului și integritatea cusăturii.
      icon: tabler:wind
    - title: Inspecția finală
      description: Fiecare unitate este inspectată pentru finisare, feronerie și ambalare înainte de a fi aprobată pentru expediere. Probele din loturi sunt trimise la laboratorul nostru pentru testare distructivă.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Întrebări frecvente despre plăci
  subtitle: Întrebări comune despre plăcile noastre stand-up paddle.
  columns: 2
  items:
    - title: Ce SUP mărimi de plăci sunt disponibile?
      description: Oferim SUP plăci de la 9 ft la 12 ft, inclusiv modele all-round, de tur, yoga și designuri speciale. Modelele noastre cele mai vândute includ Tropical Breeze (10 ft) și Ocean Voyager (11 ft).
    - title: Ce este drop-stitch construcție?
      description: Construcția Drop-stitch folosește mii de fire de poliester care conectează straturile superioare și inferioare ale plăcii, permițându-i să suporte presiuni mari de aer (15–20 PSI) și să obțină o platformă rigidă și stabilă. Aceasta este standardul industriei pentru SUPs premium gonflabile.
    - title: Care este limita de greutate pentru SUP plăci?
      description: Plăcile noastre SUP suportă până la 150 kg în funcție de model și volum. Placa Leviathan Wake este modelul nostru cu cea mai mare capacitate, concepută pentru rideri mai mari și pentru utilizarea la yoga.
    - title: Oferiți pachete complete SUP?
      description: Da. Fiecare placă SUP se livrează cu un pachet complet, inclusiv o vâslă din aluminiu în 3 piese, pompă manuală de mare presiune, coardă de siguranță, rucsac de călătorie și kit de reparații. Unele modele includ, de asemenea, un set de aripioare detașabile.
    - title: Care este garanția pentru plăcile SUP?
      description: Toate plăcile Paddle Board Overstock SUP au o garanție de 2 ani împotriva defectelor de fabricație, inclusiv defectele cusăturilor, defectele supapei și delaminarea materialului în condiții normale de utilizare.
    - title: Cât durează să umflați o placă SUP?
      description: Folosind pompa manuală inclusă, o umflare completă până la 15 PSI durează aproximativ 8–12 minute. Pentru o umflare mai rapidă, recomandăm pompa noastră electrică Paddle Board Overstock de 12V, care umflă o placă în mai puțin de 4 minute.
cta:
  title: Vrei să vezi calitatea cu ochii tăi?
  subtitle: Solicitați înregistrările noastre de testare, fotografii ale fabricii sau specificațiile materialelor. Nu este necesar NDA.
  actions:
    - variant: primary
      text: Solicitați documente de calitate
      href: /contact
    - text: Vizitați pagina fabricii noastre
      href: /factory
