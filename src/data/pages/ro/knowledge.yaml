hero:
  tagline: Grafic de cunoștințe
  title: Cunoștințe despre Explorarea Apei
  subtitle: |
    O bază de cunoștințe structurată care acoperă tehnologia SUP gonflabilă,<br />
    siguranța pe apă, ingineria plăcilor și planificarea aventurilor.
  taglineSection: Explorează. Învață. Mergi cu încredere.
clusters:
  tagline: Clustere de cunoștințe
  title: Explorează după subiect
  subtitle: Explorări detaliate ale tehnologiei, siguranței și abilităților din spatele fiecărui produs Paddle Board Overstock.
  items:
    - title: SUP Cunoaștere
      description: De la alegerea primei tale plăci până la tehnici avansate de turism — totul despre paddleboarding-ul în picioare.
      icon: tabler:lifebuoy
      topics:
        - Cum să alegi primul tău SUP gonflabil
        - Cea mai bună dimensiune SUP pentru începători
        - Cât de dificil este să faci stand-up paddle?
        - Comparație între placă gonflabilă și placă tare
        - SUP lista de verificare a siguranței
    - title: Tehnologia plăcilor
      description: Analize tehnice aprofundate asupra nucleelor drop-stitch, laminate PVC, marginilor și supapelor — cum sunt concepute plăcile gonflabile SUPs.
      icon: tabler:anchor
      topics:
        - Cum sunt realizate plăcile gonflabile SUPs
        - Straturile laminatului PVC explicate
        - Construcția marginilor și cusăturilor
        - analiză detaliată a tehnologiei Drop-stitch
        - Arta de pe puntea plăcii explicată EVA
    - title: Cunoștințe de siguranță
      description: Cunoștințe esențiale de siguranță pentru fiecare vâslaș — de la selecția PFD, la citirea vremii și până la tehnicile de auto-salvare.
      icon: tabler:shield
      topics:
        - SUP lista de verificare a siguranței
        - Ai nevoie de o vestă de salvare?
        - Ghid de siguranță pentru vâslitul în ocean
        - Siguranța pe râuri și curenți pentru vâslași
        - Conștientizarea condițiilor meteorologice și ale apei
    - title: Tehnologie
      description: Ingineria din spatele produselor Paddle Board Overstock — materiale, metode de construcție și teste de calitate.
      icon: tabler:microscope
      topics:
        - Tehnologie de grad marin PVC
        - Drop-stitch Core explicat
        - De ce PSI contează pentru sistemul gonflabil SUPs
        - Sudură RF vs lipire adezivă
        - Testarea calității pe fiecare placă
    - title: Cunoștințe despre club și închiriere
      description: Ghiduri practice pentru administrarea unui program SUP — de la operațiuni de închiriere la flotile de stațiune și club.
      icon: tabler:briefcase
      topics:
        - Cum să începi o SUP afacere de închirieri
        - Construirea unui centru sportiv acvatic pentru stațiune
        - Mărimea flotei de paddle board pentru cluburi
        - Gonflabil vs dur SUP pentru uz comercial
        - Cele mai bune plăci SUP pentru flotele de închiriere
        - Strategii de venituri din sporturile nautice pentru stațiuni
        - Ghid de întreținere a echipamentelor comerciale
