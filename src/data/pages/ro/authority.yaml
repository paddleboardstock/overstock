      amount: 15,000+
features3_brand:
  tagline: Cine suntem
  title: Fundația brandului<br />& Patrimoniu
  subtitle: Povestea, experiența și acoperirea globală care definesc Paddle Board Overstock ca un brand de încredere SUP.
  isBeforeContent: false
  columns: 3
  items:
    - title: Despre Paddle Board Overstock
      description: Fondat în 2012 în Weihai, China. De la un atelier de coastă la o facilitate de 12.000 m² — povestea completă a Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Povestea brandului
      description: Cum o echipă de ingineri marini s-a propus să facă plăcile gonflabile de paddling de nivel profesional accesibile la nivel mondial.
      icon: tabler:book
      link: /brand-story
    - title: Expertiză în industria marină
      description: Știința profundă a materialelor, fabricația de precizie și testarea în condiții reale — decenii de inginerie marină în fiecare placă.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: De ce Paddle Board Overstock
      description: Ceea ce ne diferențiază — calitate, personalizare, prețuri directe de la fabrică și suport complet pentru fiecare paddler.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Echipa noastră
      description: Cunoaște conducerea — ingineri marini, oameni de știință în materiale și experți în fabricație care conduc Paddle Board Overstock înainte.
      icon: tabler:users
      link: /brand/team
    - title: Echipa de inginerie
      description: 78+ ani cumulați de cercetare și dezvoltare, 40+ platforme, 1.200+ proiecte inginerești. Echipa tehnică din spatele fiecărui produs.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Încredere și Calitate
  title: Calitate, Testare<br />& Demonstrație
  subtitle: Testări riguroase, date reale de test și dovezi care arată angajamentul nostru față de calitate.
  isBeforeContent: false
  columns: 3
  items:
    - title: Calitate și testare
      description: Fiecare produs a fost testat la presiune înainte de livrare. Rezistența cusăturii, UV rezistența, flotabilitatea — verificate la fiecare etapă.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dovezi și demonstrații
      description: Rezultatele testelor, fotografii ale implementării, rapoarte de inspecție de la terți și studii de caz care validează calitatea Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Grafic de cunoștințe
      description: Explorează graficul de entități Paddle Board Overstock — produse, tehnologii, materiale și relații într-o bază de cunoștințe conectată.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Conducere
  title: Fă cunoștință cu echipa<br />În spatele Paddle Board Overstock
  subtitle: Experiență în industrie care acoperă ingineria marină, știința materialelor, managementul calității și comerțul electronic la nivel global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Fondator și CEO
      description: 15+ ani în fabricația marină. Anterior a condus departamentul de cercetare și dezvoltare la un mare producător chinez de echipamente marine. Deține multiple patente în proiectarea produselor gonflabile.
      icon: tabler:crown
    - title: Zhang Wei — Inginer șef
      description: 20+ ani în fabricarea de polimeri și proiectarea structurilor gonflabile. Fost director tehnic la o firmă europeană de inginerie marină.
      icon: tabler:engine
    - title: Chen Ming — Șeful departamentului de cercetare și dezvoltare
      description: Doctorat în Știința Materialelor. Specializat în drop-stitch tehnologie și sudură de înaltă frecvență. 10+ ani în compozite textile.
      icon: tabler:flask
    - title: Liu Qiang — Director de producție
      description: 18+ ani în fabricația lean. Sistemele riguroase de calitate implementate pe toate liniile de producție.
      icon: tabler:settings
    - title: Wang Fang — Manager de Calitate
      description: 12+ ani în controlul calității marine. Conduce audituri interne de calitate. Supraveghează testarea pentru fiecare lot de producție.
      icon: tabler:shield-check
    - title: Helen Lee — Director de vânzări
      description: 15+ ani în comerțul electronic internațional și logistică. Expediază plăci către vâsli în 50+ de țări. Fluentă în 4 limbi.
      icon: tabler:briefcase
cta:
  title: Vrei dovada calității noastre?
  subtitle: Contactează-ne pentru rapoarte de test, înregistrări de inspecție sau pentru a programa o vizită la fabrică.
  actions:
    - variant: primary
      text: Solicitați documentație
      href: /contact
