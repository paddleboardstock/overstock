hero:
  tagline: Centrul de autoritate
  title: De ce Aquafarer?<br />Încredere construită de-a lungul unui deceniu
  subtitle: Fiecare barcă pe care o construim poartă greutatea a 10+ ani de inginerie marină, sisteme de calitate certificate și mii de operațiuni reușite la nivel mondial. De aceea, profesioniștii din industrie aleg Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer facilitate de producție marină și echipă de inginerie
stats:
  title: Aquafarer după numere
  stats:
    - title: Ani de funcționare
      amount: Din 2012
    - title: Ingineri de cercetare și dezvoltare
      amount: 50+
    - title: Țări deservite
      amount: 50+
    - title: Echipament livrat
      amount: 15,000+
features3_brand:
  tagline: Cine suntem
  title: Fundația brandului<br />& Patrimoniu
  subtitle: Povestea, expertiza și acoperirea globală care definesc Aquafarer ca un producător de echipamente marine de încredere.
  isBeforeContent: false
  columns: 3
  items:
    - title: Despre Aquafarer
      description: Fondată în 2012 în Qingdao, China. De la un atelier de coastă la o facilitate de 12.000 m² — întreaga poveste Aquafarer.
      icon: tabler:building-factory
      link: /about
    - title: Povestea brandului
      description: Cum o echipă de ingineri marini și-a propus să facă disponibile la nivel mondial ambarcațiunile gonflabile de calitate profesională.
      icon: tabler:book
      link: /brand-story
    - title: Expertiză în industria marină
      description: Știința profundă a materialelor, fabricarea de precizie și testarea în condiții reale — decenii de inginerie marină în fiecare carenă.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Prezență Globală
      description: Deservind 50+ de țări de pe fiecare continent. Expertiză regională pentru cerințele locale de reglementare și preferințele pieței.
      icon: tabler:globe
      link: /brand-global-presence
    - title: De ce Aquafarer
      description: Ceea ce ne diferențiază — calitatea, personalizarea, prețurile directe de la fabrică și suportul complet pentru operatorii comerciali.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Echipa noastră
      description: Cunoașteți conducerea — ingineri marini, oameni de știință în materiale și experți în producție care conduc Aquafarer înainte.
      icon: tabler:users
      link: /brand/team
    - title: Echipa de inginerie
      description: 78+ ani combinați de Cercetare și Dezvoltare, 40+ platforme, 12 certificări, 1200+ OEM proiecte. Echipa tehnică din spatele fiecărui produs.
      icon: tabler:engine
      link: /engineering-team
    - title: Centrul de Cercetare și Dezvoltare
      description: Ingineria carenei, sudură RF, PVC laborator, prototipare, rezervor de testare și laborator de calitate — facilitățile noastre complete de cercetare și dezvoltare.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Încredere și Calitate
  title: Certificări, Calitate<br />& Demonstrație
  subtitle: Certificări independente, teste riguroase și dovezi reale care demonstrează angajamentul nostru față de calitate.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certificări
      description: CE, ISO 9001, UKCABSCI, REACH , — documentație completă de certificare și conformitate pentru piețele globale.
      icon: tabler:shield-check
      link: /certifications
    - title: Calitate și testare
      description: Fiecare produs a fost testat la presiune înainte de livrare. Rezistența cusăturii, UV rezistența, flotabilitatea — verificate la fiecare etapă.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dovezi și demonstrații
      description: Rezultatele testelor, fotografiile de implementare, rapoartele de inspecție ale terților și studiile de caz care Aquafarer validează calitatea.
      icon: tabler:file-check
      link: /evidence
    - title: Grafic de cunoștințe
      description: Explorează Aquafarer graful entității — produse, tehnologii, certificări și relații într-o bază de cunoștințe conectată.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Conducere
  title: Fă cunoștință cu echipa<br />În spate Aquafarer
  subtitle: Expertiză în industrie care acoperă ingineria marină, știința materialelor, managementul calității și B2B comerțul global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Fondator și CEO
      description: 15+ ani în producția marină. Anterior a condus cercetare și dezvoltare la un important producător chinez de bărci. Deține multiple brevete în proiectarea bărcilor gonflabile.
      icon: tabler:crown
    - title: Zhang Wei — Inginer șef
      description: 20+ de ani PVCde experiență înHypalon fabricație și proiectare de carene deep-V. Fost director tehnic la o firmă europeană de inginerie marină.
      icon: tabler:engine
    - title: Chen Ming — Șeful departamentului de cercetare și dezvoltare
      description: Doctorat în Știința Materialelor. Specializat în drop-stitch tehnologie și sudură de înaltă frecvență. 10+ ani în compozite textile.
      icon: tabler:flask
    - title: Liu Qiang — Director de producție
      description: 18+ ani în producție lean. Centură neagră Six Sigma. A ISO implementat sisteme de calitate 9001 pe toate liniile de producție.
      icon: tabler:settings
    - title: Wang Fang — Manager de Calitate
      description: 12+ ani în controlul calității maritime. Certificat CE și ISO auditor. Supraveghează testarea pentru fiecare lot de producție.
      icon: tabler:shield-check
    - title: Helen Lee — Director de vânzări
      description: 15+ ani în B2B comerț internațional. A OEMgestionat /ODM a avut parteneriate în 30+ de țări. Vorbește fluent 4 limbi.
      icon: tabler:briefcase
cta:
  title: Vrei să ne verifici acreditările?
  subtitle: Contactați-ne pentru copii ale certificărilor, rapoarte de inspecție de la terți sau pentru a programa o vizită la fabrică.
  actions:
    - variant: primary
      text: Solicitați acreditări
      href: /contact
    - text: Vizualizați detaliile certificării
      href: /certifications
