hero:
  tagline: Centrul de autoritate
  title: De ce Paddle Board Overstock?<br />Încredere construită de-a lungul unui deceniu
  subtitle: Fiecare placă pe care o construim poartă greutatea a 10+ ani de inginerie marină, control riguros al calității și mii de paddleri pe apă în întreaga lume. De aceea aleg paddlerii Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Facilitate de fabricație marină Paddle Board Overstock și echipă de inginerie
stats:
  title: Paddle Board Overstock prin cifre
  stats:
    - title: Ani de funcționare
      amount: Din 2012
    - title: Ingineri de cercetare și dezvoltare
      amount: 14+
    - title: Țările deservite
      amount: 50+
