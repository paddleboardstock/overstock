testimonial:
  content: Închiriasem 5 plăci de la un magazin local și pierdeam 60% din venitul meu către ei. Paddle Board Overstock m-a ajutat să-mi construiesc propria flotă de 15 SUPs. Calculatorul ROI pe care l-au oferit a arătat că voi ajunge la punctul de echilibru în 4 luni — de fapt a durat 3. Acum mă extind la 30 de plăci și adaug caiace.
  name: Daniel Okonkwo
  title: Proprietar, Lakeland SUP Închirieri — Ontario, Canada
content_segments:
  tagline: Profile de închiriere
  title: Soluții de Închiriere pentru Sporturi Acvatice<br />După tipul operatorului
  subtitle: Diferite operațiuni de închiriere au nevoi diferite — de la închirieri mici pe plajă SUP la centre de sporturi nautice de anvergură mare. Ne adaptăm pachetele de echipamente și modelul de suport în consecință.
  items:
    - title: Închirieri la Plajă și la Lac SUP
      subtitle: Operațiuni cu volum mare și complexitate scăzută
      description: Operatori care închiriază plăci de paddle în picioare și caiace direct turiștilor de pe plajă și vizitatorilor lacului. Prioritatea ta este să minimizezi timpul de rotație între închirieri, să menții echipamentul în circulație și să gestionezi vârfurile sezoniere de cerere cu un spațiu de depozitare redus.
      features:
        - Flote gonflabile SUP care se pliază plat — nu este nevoie de doc sau remorcă
        - Grad comercial PVC evaluat pentru 100+ cicluri de închiriere pe sezon
        - Material cu uscare rapidă, rezistent la UV, pregătit pentru reutilizare în aceeași zi
        - Intervale de tablă codificate pe culori pentru identificarea ușoară a flotei
    - title: Centre de sporturi nautice la stațiuni și hoteluri
      subtitle: Experiența oaspeților și alinierea brandului
      description: Stațiuni și hoteluri care oferă sporturi nautice ca facilități la fața locului. Echipamentul trebuie să arate premium, să funcționeze fiabil pentru oaspeți de la începători la intermediari și să se integreze cu fluxurile existente de rezervare și facturare ale stațiunii.
      features:
        - Plăci și veste de salvare personalizate cu brandul SUP, în culorile stațiunii
        - 'Flotă mixtă: SUPs, caiace, bărci cu pedale și mici ambarcațiuni RIB'
        - Soluții silențioase, fără combustibil, cu pompă electrică pentru umflare pe plajă
        - Instruirea personalului și integrarea întreținere incluse
    - title: Operatori de închiriere de ambarcațiuni & RIB
      subtitle: Flote de închiriere a ambarcațiunilor de calitate comercială
      description: Operatori care închiriază ambarcațiuni motorizate — RIB ambarcațiuni de serviciu, bărci gonflabile și mici bărci rapide — pe oră sau pe jumătate de zi. Flota dvs. trebuie să respecte reglementările de siguranță marină, să reziste la utilizarea intensă de către oaspeți și să minimizeze timpul de nefuncționare mecanică între închirieri.
      features:
        - Pachete RIB cu 30–90 de talpi transom gata pentru motor HP
        - Panouri de podea din placaj marin pentru integritate structurală pe termen lung
        - Sisteme de valve cu lansare rapidă pentru schimbări mai rapide
        - Kit de piese de schimb + suport tehnic la cerere SLA
    - title: Operatori de tururi și aventuri
      subtitle: Flote pentru excursii ghidate
      description: Operatori care organizează tururi ghidate de sporturi nautice — SUP safariuri, caiace în peșteri, excursii de snorkeling sau tururi insulare RIB. Echipamentul trebuie să fie suficient de stabil pentru oaspeți începători, ușor de curățat între grupuri și durabil pentru utilizare zilnică ghidată în condiții variate de apă.
      features:
        - Platforme extra-stabile SUP (32" lățime+) pentru călători pentru prima dată
        - Opțiuni kayak tandems pentru configurații de cuplu/grup
        - Capacitate de transport încorporată pentru echipament de snorkeling, genți uscate și răcitoare
        - Documentație de conformitate CE + USCG pentru operațiuni comerciale
