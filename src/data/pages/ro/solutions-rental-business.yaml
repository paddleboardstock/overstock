testimonial:
  content: Închiriam 5 plăci de la un magazin local și pierdeam 60% din venitul meu către ei. Paddle Board Overstock m-a ajutat să-mi construiesc propria flotă de 15 SUPs. Calculatorul ROI pe care l-au furnizat a arătat că voi ajunge la punctul de echilibru în 4 luni — de fapt, a durat 3. Acum mă extind la 30 de plăci.
  name: Daniel Okonkwo
  title: Proprietar, Lakeland SUP Închirieri — Ontario, Canada
content_segments:
  tagline: Profile de închiriere
  title: Soluții de Închiriere pentru Sporturi Acvatice<br />După tipul operatorului
  subtitle: Diferite operațiuni de închiriere au nevoi diferite — de la închirieri mici pe plajă SUP la centre de sporturi nautice de anvergură mare. Ne adaptăm pachetele de echipamente și modelul de suport în consecință.
  items:
    - title: Închirieri la Plajă și la Lac SUP
      subtitle: Operațiuni cu volum mare și complexitate scăzută
      description: Operatori care închiriază plăci de paddle în picioare direct turiștilor de plajă și vizitatorilor lacului. Prioritatea dvs. este să minimizați timpul de rotație între închirieri, să mențineți echipamentul în circulație și să gestionați vârfurile sezoniere de cerere cu un spațiu de depozitare redus.
      features:
        - Flote gonflabile SUP care se pliază plat — nu este nevoie de doc sau remorcă
        - Grad comercial PVC evaluat pentru 100+ cicluri de închiriere pe sezon
        - Material cu uscare rapidă, rezistent la UV, pregătit pentru reutilizare în aceeași zi
        - Intervale de tablă codificate pe culori pentru identificarea ușoară a flotei
    - title: Centre de sporturi nautice la stațiuni și hoteluri
      subtitle: Experiența oaspeților și alinierea brandului
      description: Stațiuni și hoteluri care oferă sporturi nautice ca facilități la fața locului. Echipamentul trebuie să arate premium, să funcționeze fiabil pentru oaspeți de la începători la intermediari și să se integreze cu fluxurile existente de rezervare și facturare ale stațiunii.
      features:
        - Plăci și veste de salvare personalizate cu brandul SUP, în culorile stațiunii
        - 'Flotă mixtă: serii all-around, turnee și de artă SUPs'
        - Soluții silențioase, fără combustibil, cu pompă electrică pentru umflare pe plajă
        - Instruirea personalului și integrarea întreținere incluse
    - title: Boutique & Închirieri de telefoane mobile SUP
      subtitle: Servicii de închiriere pop-up și livrare
      description: Operatorii aduc plăcile direct către client — livrări la plajă la hoteluri, stații de închiriere pop-up la evenimente și instalații mobile. Echipamentele trebuie să fie rapide de implementat, ușor de transportat și prezentabile la prima vedere, cu dimensiuni flexibile ale flotei pentru evenimente și cererea sezonieră.
      features:
        - Transport de tip rucsac — fără remorcă necesară
        - Inflație rapidă pentru configurarea la cerere în mai puțin de 15 minute
        - Echipament prezentabil care pare premium la prima vedere
        - Dimensiuni flexibile ale flotei pentru evenimente și cerere sezonieră
    - title: Operatori de tururi și aventuri
      subtitle: Flote pentru excursii ghidate
      description: Operatorii organizează tururi ghidate de sporturi acvatice — SUP safari, excursii cu snorkeling și tururi de explorare a coastei. Echipamentul trebuie să fie suficient de stabil pentru oaspeții începători, rapid de curățat între grupuri și suficient de durabil pentru utilizare zilnică ghidată în diverse condiții acvatice.
      features:
        - Platforme extra-stabile SUP (32" lățime+) pentru călători pentru prima dată
        - Platforme de grajduri extra-mari pentru fotografii de cuplu/grup în tururi
        - Capacitate de transport încorporată pentru echipament de snorkeling, genți uscate și răcitoare
        - Pachete de echipamente de siguranță pentru operațiuni comerciale de tururi
