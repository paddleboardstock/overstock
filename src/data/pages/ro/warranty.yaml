label: Garanție
headline: Aquafarer Garanție Limitată a Producătorului
subtitle: Aquafarer susține calitatea fiecărui produs marin gonflabil pe care îl fabricăm. Această Garanție Limitată stabilește termenii și acoperirea pentru produsul dumneavoastră Aquafarer.
seo:
  headline: Aquafarer Garanția pentru Barca Gonflabilă — Garanție Limitată de 5 Ani | Aquafarer
  description: Aquafarer oferă o garanție limitată de 5 ani pentru țesătura tubului principal, cusături și integritatea structurală a carenei din fibră de sticlă. De asemenea, acoperă supapele de umflare și accesoriile instalate din fabrică. Termenii și condițiile complete pentru garanția bărcii gonflabile Aquafarer.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Această Garanție Limitată se aplică produselor marine gonflabile noi de marcă Aquafarer achiziționate direct de la Aquafarer sau de la un dealer sau comerciant autorizat Aquafarer. Data de intrare în vigoare este data verificabilă a achiziției inițiale de la retail.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Acoperirea Garanției și Durata</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ani</h3>
        <p class="text-sm text-gray-600 mt-1">Integritatea țesăturii tubului principal (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ani</h3>
        <p class="text-sm text-gray-600 mt-1">Integritatea structurală a carenei din fibră de sticlă</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ani</h3>
        <p class="text-sm text-gray-600 mt-1">Capacitatea de reținere a aerului a cusăturilor tubului gonflabil</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Ani</h3>
        <p class="text-sm text-gray-600 mt-1">Funcționalitatea supapei de umflare</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 An</h3>
        <p class="text-sm text-gray-600 mt-1">Accesorii și echipamente auxiliare instalate din fabrică</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 An*</h3>
        <p class="text-sm text-gray-600 mt-1">Utilizare comercială, închiriere sau flotă — toate componentele</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Utilizarea comercială, guvernamentală, în charter, închiriere sau pentru instruire reduce garanția la 1 an. Utilizarea în curse sau competiții anulează complet garanția.</p>
  </div>

  <h2>Ce Este Acoperit</h2>
  <h3>Țesătura Tubului Principal (5 Ani)</h3>
  <p>Aquafarer garantează țesătura principală a tubului împotriva deteriorării porozității care compromite în mod substanțial capacitatea produsului de a menține inflatia operațională. Aceasta se aplică materialului CSM (Hypalon) acoperit și tuturor celorlalte materiale ale tubului utilizate la fabricație.</p>

  <h3>Integritatea Structurală a Carenei din Fibră de Sticlă (5 Ani)</h3>
  <p>Pentru produsele cu o carenă din plastic armat cu fibră de sticlă (FRP), structura compozită fundamentală este garantată împotriva defectelor structurale cauzate de materiale sau manopera defectuoasă.</p>

  <h3>Capacitatea de reținere a aerului a cusăturilor tubului gonflabil (5 Ani)</h3>
  <p>Cusăturile tuburilor gonflabile, unde sunt îmbinate în timpul fabricației, sunt garantate împotriva defectelor de fabricație care duc la scurgeri substanțiale de aer prin cusătură. Inspecția periodică și menținerea presiunilor adecvate de umflare sunt condiții pentru acoperire.</p>

  <h3>Funcționalitatea Supapei de Umflare (5 Ani)</h3>
  <p>Supapele de umflare a aerului instalate inițial de Aquafarer sunt garantate împotriva defectelor de fabricație în materiale sau manoperă care împiedică supapa să rețină aerul conform proiectării.</p>

  <h3>Accesorii Instalate din Fabrică (1 An)</h3>
  <p>Componentele și fitingurile fabricate de Aquafarer și instalate inițial în fabrică sunt garantate împotriva defectelor de material și manoperă timp de un an. Aceasta exclude obiectele terțe, care sunt acoperite doar de garanțiile producătorilor lor respectivi.</p>

  <h2>Ce Nu Este Acoperit</h2>
  <ul>
    <li>Defecte cosmetice inclusiv decolorare, pete, estompare, efect de cretă sau orice alterare a aspectului</li>
    <li>Găuri, tăieturi, rupturi, sfâșieri sau alte deteriorări fizice</li>
    <li>Fisurare, crăpare, abraziune, zgâriere sau deteriorare din cauza frecării sau contactului</li>
    <li>Degradare din cauza expunerii la lumina UV, a intemperiilor sau a condițiilor atmosferice</li>
    <li>Deteriorare cauzată de contactul cu combustibili, solvenți, acizi, alcalii sau substanțe chimice</li>
    <li>Daune cauzate de neglijență, utilizare necorespunzătoare, abuz, accident sau uzură normală</li>
    <li>Probleme ale suprafeței gelcoat-ului sau vopselei (bule, crăpături fine, decolorare, estompare)</li>
    <li>Daune cauzate de impact, stres, suport necorespunzător sau transport pe trailer</li>
    <li>Deteriorări cauzate de umflarea/deflarea necorespunzătoare sau de utilizarea dispozitivelor de umflare neaprobate</li>
    <li>Echipamente, componente sau sisteme ale terților (acoperite de producătorii lor respectivi)</li>
  </ul>

  <h2>Obligația și Remediul Producătorului</h2>
  <p>Singura și exclusivă obligație a Aquafarer este repararea sau înlocuirea, la opțiunea Aquafarer, a oricărui component determinat a fi defect din cauza materialelor sau a manoperei și acoperit de această garanție. Reparațiile sau înlocuirile sunt efectuate de Aquafarer sau de unitatea de service autorizată desemnată de aceasta. Componentele reparate sau înlocuite sunt garantate doar pentru perioada rămasă din perioada inițială de garanție.</p>

  <h2>Condiții de garanție</h2>
  <ul>
    <li><strong>Înscriere:</strong>Produsul trebuie să fie înregistrat corespunzător, așa cum este prevăzut în termenii garanției.</li>
    <li><strong>Întreținere:</strong>Produsul trebuie întreținut în conformitate cu ghidurile publicate de Aquafarer, inclusiv inspectarea periodică și întreținerea presiunilor adecvate de umflare.</li>
    <li><strong>Cooperare:</strong>Cumpărătorul trebuie să coopereze pe deplin și prompt cu Aquafarer în toate aspectele legate de cererile de garanție.</li>
    <li><strong>Cumpărător original:</strong>Această garanție este extinsă exclusiv către cumpărătorul final inițial și nu este transferabilă.</li>
  </ul>

  <h2>Utilizare comercială</h2>
  <p>Dacă produsul este utilizat în scop comercial, guvernamental, non-profit, charter, de închiriere, instrucțional sau pentru orice alt scop decât uzul recreativ personal, perioada de garanție pentru toate componentele se reduce la un (1) an de la data inițială a achiziției de retail. Utilizarea în curse, competiții de viteză sau de rezistență anulează imediat și irevocabil garanția în întregime.</p>

  <h2>Cum să faceți o cerere de garanție</h2>
  <p>Contactați Aquafarer sau dealerul autorizat cu dovada achiziției și o descriere detaliată a problemei. Aquafarer va analiza reclamația și va oferi instrucțiuni pentru inspectare și service.</p>
  <p>Pentru întrebări privind serviciul de garanție, vă rugăm să ne contactați prin intermediul nostru<a href="/contact" class="text-sky-600 underline">pagina de contact</a>cu numărul comenzii și detaliile produsului dumneavoastră.</p>

  <h2>Articole terțe</h2>
  <p>Echipamentele, componentele sau sistemele fabricate de terți (chiar dacă sunt instalate de Aquafarer) sunt acoperite exclusiv de orice garanție oferită de producătorul lor respectiv. Aquafarer declină în mod expres orice responsabilitate de garanție pentru astfel de produse terțe.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Această declarație de garanție este un rezumat al Garanției Limitate complete a Aquafarer Producătorului. Documentul complet de garanție legală guvernează toți termenii și condițiile garanției. Specificațiile pot fi modificate fără notificare. Aquafarer este un brand de fabrică al Aquafarer Centrului de Producție Qingdao.
  </p>
