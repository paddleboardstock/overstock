label: Garanție
headline: Paddle Board Overstock Garanție Limitată a Producătorului
subtitle: Paddle Board Overstock Garantează calitatea fiecărei plăci gonflabile SUP pe care le fabricăm. Această Garanție Limitată stabilește termenii și acoperirea plăcii Paddle Board Overstock tale.
seo:
  headline: Paddle Board Overstock SUP Garanție — Garanție limitată de 2 ani | Paddle Board Overstock
  description: Paddle Board Overstock oferă o garanție limitată de 2 ani care acoperă drop-stitch cusăturile, construcția șinelor, supapele de umflare și accesoriile incluse pe fiecare SUP placă. Termeni și condiții complete.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Această garanție limitată se aplică Paddle Board Overstock plăcilor gonflabile noi SUP de marcă achiziționate direct din Paddle Board Overstock magazinul online. Data de intrare în vigoare este data verificabilă a achiziției inițiale.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Acoperirea garanției și durata</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Structura Core &amp; Deck</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Construcția șinei și a straturilor</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Funcționalitatea supapei de umflare</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 ani</h3>
          <p class="text-sm text-gray-600 mt-1">Accesorii incluse (pompă, paletă, lesă, aripioare)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 An*</h3>
          <p class="text-sm text-gray-600 mt-1">Utilizare comercială, închiriere sau flotă — toate componentele</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Utilizarea comercială, de închiriat sau de flotă reduce garanția la 1 an. Utilizarea în curse sau competiții anulează complet garanția.</p>
    </div>

    <h2>Ce Este Acoperit</h2>
    <h3>Drop-Stitch Structura Nucleului și a Deck-ului (2 ani)</h3>
    <p>drop-stitch Nucleul intern și structura exterioară a plăcii sunt garantate împotriva defectelor de fabricație care compromit capacitatea plăcii de a menține umflarea și rigiditatea operațională.</p>

    <h3>Construcții de cale ferată și naștere (2 ani)</h3>
    <p>Îmbinările și benzile de șine cu trei straturi, unde au fost unite în timpul fabricației, sunt garantate împotriva defectelor de fabricație care duc la scurgeri substanțiale de aer prin îmbinare. Inspecția periodică și menținerea presiunilor adecvate de umflare sunt condiții de acoperire.</p>

    <h3>Funcționalitatea supapei de umflare (2 ani)</h3>
    <p>Ventilele de umflare cu aer instalate inițial de Paddle Board Overstock sunt garantate împotriva defectelor de fabricație din materiale sau manoperă care împiedică păstrarea aerului conform proiectului.</p>

    <h3>Accesorii incluse (2 ani)</h3>
    <p>Pompa, paleta reglabilă, lesa, aripioara detașabilă și celelalte componente incluse în pachetul tău de placă sunt garantate împotriva defectelor de material și execuție.</p>

    <h2>Ce Nu Este Acoperit</h2>
    <ul>
      <li>Defecte cosmetice inclusiv decolorare, pete, estompare, efect de cretă sau orice alterare a aspectului</li>
      <li>Găuri, tăieturi, rupturi, sfâșieri sau alte deteriorări fizice</li>
      <li>Fisurare, crăpare, abraziune, zgâriere sau deteriorare din cauza frecării sau contactului</li>
      <li>Degradare din cauza expunerii la lumina UV, a intemperiilor sau a condițiilor atmosferice</li>
      <li>Daune cauzate de contactul cu solvenți, acizi, alcali sau substanțe chimice</li>
      <li>Daune cauzate de neglijență, utilizare necorespunzătoare, abuz, accident sau uzură normală</li>
      <li>Daune cauzate de impact, stres, suport necorespunzător sau transport</li>
      <li>Deteriorări cauzate de umflarea/deflarea necorespunzătoare sau de utilizarea dispozitivelor de umflare neaprobate</li>
      <li>Echipamente, componente sau sisteme ale terților (acoperite de producătorii lor respectivi)</li>
    </ul>

    <h2>Obligația și Remediul Producătorului</h2>
    <p>Paddle Board Overstock are obligația exclusivă de a repara sau înlocui, la alegerea Paddle Board Overstock, orice componentă care se constată a fi defectă din punct de vedere al materialelor sau al manoperei și care este acoperită de această garanție. Reparațiile sau înlocuirile sunt efectuate de Paddle Board Overstock sau de centrul său de service desemnat. Componentele reparate sau înlocuite sunt garantate doar pentru perioada rămasă din garanția inițială.</p>

    <h2>Condiții de garanție</h2>
    <ul>
      <li><strong>Întreținere:</strong>Produsul trebuie întreținut în conformitate cu ghidurile publicate de Paddle Board Overstock, inclusiv inspectarea periodică și întreținerea presiunilor de umflare corespunzătoare.</li>
      <li><strong>Cooperare:</strong>Cumpărătorul trebuie să coopereze pe deplin și prompt cu Paddle Board Overstock în toate aspectele referitoare la cererile de garanție.</li>
      <li><strong>Cumpărător original:</strong>Această garanție este extinsă exclusiv către cumpărătorul final inițial și nu este transferabilă.</li>
    </ul>

    <h2>Utilizare comercială</h2>
    <p>Dacă produsul este utilizat pentru scopuri comerciale, de închiriere sau pentru flote, perioada de garanție pentru toate componentele se reduce la un (1) an de la data achiziției originale. Utilizarea în curse, competiții de viteză sau rezistență anulează imediat și irevocabil garanția în întregime.</p>

    <h2>Cum să faceți o cerere de garanție</h2>
    <p>Contactați Paddle Board Overstock cu dovada achiziției și o descriere detaliată a problemei. Paddle Board Overstock va analiza reclamația și va oferi instrucțiuni pentru inspectare și service.</p>
    <p>Pentru întrebări privind serviciul de garanție, vă rugăm să ne contactați prin intermediul nostru<a href="/contact" class="text-sky-600 underline">pagina de contact</a>cu numărul comenzii și detaliile produsului dumneavoastră.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Această declarație de garanție reprezintă un rezumat al Garanției Limitate Complete a Producătorului Paddle Board Overstock. Documentul complet de garanție legală guvernează toți termenii și condițiile garanției. Specificațiile pot fi modificate fără notificare prealabilă. Paddle Board Overstock este un brand de fabricație al Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
