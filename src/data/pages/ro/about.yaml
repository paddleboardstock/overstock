hero:
  tagline: Despre noi
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock fabrică și atelier
  title: Despre suprasolicitarea <span class="text-accent dark:text-white">plăcii cu zbaturi</span>
  subtitle: Plăci SUP gonflabile noi, la prețuri de suprastoc și de vămuire — susținute de propria noastră producție Weihai din 2012, de modelul mixt cu ridicata pentru comercianții cu amănuntul mici și de transportul flexibil la nivel mondial.
stats:
  title: Prin cifre
  columns: 4
  stats:
    - title: Capacitatea anuală de producție
      amount: 15,000 units
    - title: Țările au expediat
      amount: 50+
    - title: Tablouri testate la presiune
      amount: 100%
    - title: Ingineri R&D
      amount: 14+
features3_what_we_build:
  title: Ceea ce construim
  subtitle: O linie de produse concentrată pe care o cunoaștem în detaliu — niciun experiment neterminat, niciun ingineriat prin schimbarea însemnelor.
  columns: 3
  isBeforeContent: true
  items:
    - title: Plăci SUP GONFLABILE
      description: SUP-uri multifuncționale și de turism de la 10' la 12 ft. Stabil, rigid și complet cu pompă, paletă și lesă.
      icon: tabler:swimming
    - title: Pachete de serii de artă
      description: Opera de artă semnată EVA — Cheetah Surge, Tropical Breeze, Medusa Glow și multe altele.
      icon: tabler:hexagons
    - title: Pachete complete
      description: 'Fiecare placă este livrată ca un kit complet: placă, rucsac, pompă, paletă, aripioară, lesă și kit de reparații.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accesorii
      description: Pompe, padele, lese, truse de reparații și saci uscați. Toate se potrivesc cu panourile noastre.
      icon: tabler:tool
    - title: Îngrijire și reparații
      description: Asistență internă pentru reparații, piese de schimb și îndrumări de întreținere pentru a menține placa pe apă ani de zile.
      icon: tabler:settings
    - title: Cluburi și flote de închiriere
      description: Echipare în vrac pentru cluburi, școli și flote de închiriere cu asistență directă din fabrică.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Discuție despre proiectarea și ingineria plăcii
steps2_values:
  title: Valorile noastre
  subtitle: Trei principii care au modelat fiecare produs încă din prima zi.
  items:
    - title: Construiește ca și cum ai purta familia ta
      description: Fiecare placă, cusătură și supapă este tratată ca și cum propriile noastre familii o vor folosi.
      icon: tabler:heart
    - title: Inginerie înainte de vânzare
      description: Dacă o specificație este greșită, o schimbăm pe specificație — niciodată pe client.
      icon: tabler:settings
    - title: Suport care depășește garanția
      description: Plăcile pe care le-am construit cu ani în urmă încă ne solicită piese de schimb și continuăm să le preluăm.
      icon: tabler:headset
steps2_milestones:
  title: Repere
  subtitle: O versiune scurtă a poveștii Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fondată în Weihai
      description: Un atelier de coastă dedicat plăcilor SUP GONFLABILE CU cusătură verticală.
      icon: tabler:building-factory
    - title: Campus de producție de 12.000 m²
      description: Extinse la o instalație dedicată cu sudură RF și capacitate de producție de cusături verticale.
      icon: tabler:circle-check
    - title: Program internațional de export
      description: Acum expediem în peste 50 de țări cu opțiuni de transport expres și maritim.
      icon: tabler:world
    - title: Concentrare asupra stocurilor excedentare și a
      description: În septembrie 2026, operațiunile mărcii s-au mutat de la Qingdao Vatrad Group la Weihai Dongjilian Co., Ltd.; centrul de producție Weihai continuă cercetarea și dezvoltarea, producția și transportul direct din fabrică.
      icon: tabler:building-skyscraper
features2_locations:
  title: Locațiile noastre
  tagline: Găsiți-ne
  columns: 3
  items:
    - title: Sediu central și atelier
      description: Parc industrial de coastă, clădirea 4 — deschis Luni–Vineri pentru vizite cu programare.
    - title: Centru de service UE
      description: Port mediteranean — refacere, reparații și suport pentru clienții europeni.
    - title: Rețea de parteneri APAC
      description: Parteneri de service autorizați în Australia, Japonia, Singapore și Hong Kong.
brand_hub_tagline: Marca
brand_hub_title: Explorați Brandul Nostru
brand_hub_subtitle: Aprofundați expertiza noastră în ingineria marină, prezența globală și principiile care ne ghidează.
brand_hub_cards:
  - title: Expertiză Marină
    desc: Zeci de ani de știință a materialelor, producție de precizie și testare în lumea reală — de la miezuri de cusătură la cusături sudate și punți din seria art.
    link: /brand-marine-expertise
    link_label: Aflați mai multe →
  - title: De ce Paddle Board Overstock
    desc: Prețuri directe din fabrică, plăci testate 100% sub presiune și o garanție de 2 ani — construite pentru vâslași, familii și iubitorii de sporturi nautice.
    link: /brand-why-paddleboardoverstock
    link_label: Aflați mai multe →
