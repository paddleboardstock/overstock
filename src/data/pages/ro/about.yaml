hero:
  tagline: Despre noi
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer fabrică și atelier
  title: |
    Inginerie marină<br />
    construit<span class="text-accent dark:text-white">Aquafarer</span>mod
  subtitle: 'Am început într-un atelier de coastă cu o singură barcă și o credință încăpățânată: produsele marine ar trebui să fie proiectate ca și cum ar conta, pentru că chiar contează. Astăzi livrăm în peste 50 de țări, dar fiecare carcasă trece încă prin aceleași mâini care au fondat compania.'
stats:
  title: Prin cifre
  columns: 4
  stats:
    - title: Cocuri livrate
      amount: 2,400+
    - title: Țările au expediat
      amount: 50+
    - title: Ani de experiență combinată
      amount: '60'
    - title: Timp mediu de răspuns pentru garanție (ore)
      amount: '24'
features3_what_we_build:
  title: Ceea ce construim
  subtitle: O linie de produse concentrată pe care o cunoaștem în detaliu — niciun experiment neterminat, niciun ingineriat prin schimbarea însemnelor.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB bărci
      description: Carenă din aluminiu RIBs de la 3,3 m la 7,5 m. Proiectată pentru patrulare, scufundări, pescuit și utilizare familială.
      icon: tabler:ship
    - title: Bărci gonflabile
      description: PVC și Hypalon bărci pneumatice gonflabile de la 2,4 m la 4,2 m. Ușoare, rezistente și ușor de depozitat.
      icon: tabler:speedboat
    - title: Ambarcațiuni auxiliare pentru superiahturi
      description: Compact, de înaltă specificație RIBs personalizat pentru a se potrivi cu aspectul navei tale mamă.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accesorii
      description: Vâsle, pompe, huse, saci impermeabili, rezervoare de combustibil și electronice. Toate potrivite pentru bărcile noastre.
      icon: tabler:package
    - title: Revizie și reparații
      description: Înlocuirea internă a tuburilor, modernizarea electronicii și upgrade-urile motorului.
      icon: tabler:tool
    - title: Construții personalizate
      description: Design proiect cu proiect pentru clienți comerciali, științifici și militari.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Discuție despre proiectarea și ingineria bărcilor
steps2_values:
  title: Valorile noastre
  subtitle: Trei principii care au modelat fiecare produs încă din prima zi.
  items:
    - title: Construiește ca și cum ai purta familia ta
      description: Fiecare carenă, sudură și element de fixare este tratat ca și cum ar fi folosit de propriii noștri membri de familie.
      icon: tabler:heart
    - title: Inginerie înainte de vânzare
      description: Dacă o specificație este greșită, o schimbăm pe specificație — niciodată pe client.
      icon: tabler:settings
    - title: Suport care depășește garanția
      description: Carene vechi de douăzeci de ani încă ne sună pentru piese de schimb, și noi răspundem încă.
      icon: tabler:headset
steps2_milestones:
  title: Repere
  subtitle: O versiune scurtă a poveștii Aquafarer.
  isReversed: true
  items:
    - title: Fondată într-un atelier de coastă
      description: Începută de doi arhitecți navali cu un CNC mil și o idee încăpățânată.
      icon: tabler:building-factory
    - title: Primele 1.000 de carene livrate
      description: Atins în al șaptelea nostru an, în mare parte prin recomandări și clienți fideli.
      icon: tabler:circle-check
    - title: Program internațional de export
      description: Acum livrăm în 50+ de țări cu parteneri locali de suport pe cinci continente.
      icon: tabler:world
    - title: O nouă structură operațională globală
      description: În septembrie 2026, operațiunile brandului s-au mutat de la Qingdao Vatrad Group la Aquafarer LLC (New Mexico, SUA); hub-ul de producție Qingdao continuă cercetarea și dezvoltarea, producția și exportul direct din fabrică.
      icon: tabler:building-skyscraper
features2_locations:
  title: Locațiile noastre
  tagline: Găsiți-ne
  columns: 3
  items:
    - title: Sediu central și atelier
      description: Parc industrial de coastă, clădirea 4 — deschis Luni–Vineri pentru vizite cu programare.
    - title: Centru de service UE
      description: Port mediteranean — refacere, reparații și suport pentru clienții europeni.
    - title: Rețea de parteneri APAC
      description: Parteneri de service autorizați în Australia, Japonia, Singapore și Hong Kong.
brand_hub_tagline: Brand
brand_hub_title: Explorați Brandul Nostru
brand_hub_subtitle: Aprofundați expertiza noastră în ingineria marină, prezența globală și principiile care ne ghidează.
brand_hub_cards:
  - title: Expertiză Marină
    desc: Decenii de știința materialelor, fabricație de precizie și testare reală — de la fabricarea PVC/Hypalon la designul carenei deep-V și tehnologia drop-stitch.
    link: /brand-marine-expertise
    link_label: Aflați mai multe →
  - title: Prezență Globală
    desc: Livrăm în 50+ de țări din facilitățile noastre din Qingdao cu parteneri de servicii autorizați în întreaga Europă, Asia-Pacific și Americi.
    link: /brand-global-presence
    link_label: Aflați mai multe →
  - title: De ce Aquafarer
    desc: Integrare verticală, dublă certificare (ISO 9001 + BSCI), CE conformitate și costuri reduse — conceput pentru branduri, distribuitori și agenții guvernamentale.
    link: /brand-why-aquafarer
    link_label: Aflați mai multe →
production_section:
  tagline: Excelența producției
  title: Asigurarea unei măiestrii deosebite
  description: Linia de producție Aquafarer este dedicată producției de bărci gonflabile de înaltă calitate, durabile și performante.
  cards:
    - title: Echipă tehnicieni experimentați
      items:
        - Cunoștințe profesionale despre PVC, Hypalon și materiale marine
        - Măiestrie precisă în tăiere, lipire și instalarea accesoriilor
        - Instruire continuă pentru a stăpâni cele mai noi tehnologii de producție
    - title: Echipamente avansate de producție
      items:
        - Echipamente de tăiere CNC pentru tăiere precisă a materialelor cu erori minime
        - Lipire termică/frece rece de înaltă precizie pentru cusături etanșe și durabile
        - Echipamente profesionale de testare a etanșeității și rezistenței la tensiune
    - title: Sistem de management matur
      items:
        - Procese de producție standardizate cu standarde clare de calitate
        - Filosofie de producție lean care reduce deșeurile și îmbunătățește eficiența
        - Management eficient al lanțului de aprovizionare cu parteneriate sigure cu furnizorii
    - title: Control strict al calității
      items:
        - Sistem de management al calității certificat
        - 'Inspectare multi-etapă: materie primă, proces intermediar, produs final'
        - Teste stricte de etanșeitate și durabilitate înainte de expediere
global_ops_section:
  tagline: Arhitectură globală de operare
  title_html: Un brand,<span class="text-white/90">două centre</span>
  description_html: Din septembrie 2026, Aquafarer este operat de<strong class="text-white">Aquafarer LLC</strong>(New Mexico, SUA) — entitatea globală pentru distribuție, vânzări comerciale B2B, contracte, facturare și servicii post-vânzare. Cercetarea și dezvoltarea, producția și controlul calității rămân la<strong class="text-white">Aquafarer Centrul de Producție Qingdao</strong>, care expediază fiecare comandă direct de la fabrică, FOB Qingdao. Tranziția a schimbat cine semnează contractul dvs. — nu cine construiește barca dvs.
  stats:
    - value: 2,400+
      label: Coci livrate la nivel global
    - value: 50+
      label: Țări exportatoare
    - value: 10+
      label: Ani de fabricație
