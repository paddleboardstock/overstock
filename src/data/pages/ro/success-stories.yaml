stories:
  - title: Cum un Resort Mediteranean a construit o afacere profitabilă de închiriere SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: Resort de plajă de 5 stele — Grecia
    problem: Resortul avea nevoie de activități nautice premium pentru oaspeți pentru a crește scorurile de satisfacție și a crea o nouă sursă de venit, dar lipseau echipamentele, infrastructura de siguranță și expertiza personalului.
    solution: Paddle Board Overstock a livrat 50 de plăci personalizate SUP cu culorile și logo-ul stațiunii, sistem complet de siguranță incluzând stație pentru salvamar și linii de plută, și un program de instruire de 3 zile pentru personal, acoperind manipularea echipamentului, instruirea oaspeților și protocoalele de siguranță.
    result:
      - 300+ activități săptămânale pentru oaspeți rezervate în prima lună
      - 'Scorurile de satisfacție ale oaspeților pentru activitățile nautice: 4,8/5'
      - 'Venit anual suplimentar: 180.000 $'
      - Zero incidente de siguranță în primul sezon de operare
      - Costul de înlocuire a echipamentului redus cu 40% comparativ cu furnizorul anterior
    quote:
      text: Paddle Board Overstock nu a livrat doar plăcile — ne-a ajutat să construim o experiență completă pentru oaspeți. Programul nostru de sporturi nautice a trecut de la zero la atracția principală a stațiunii într-un singur sezon.
      author: Manager General Resort
    cta_text: Construiți Soluția Resortului Dvs.
    cta_href: /solutions/resorts
  - title: Cum un Beach Club Thailandez a crescut de la 10 la 80 de Plăci
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Club de sporturi nautice — Thailanda
    problem: Un mic club de plajă SUP din Phuket trebuia să treacă de la o activitate de hobby la o afacere profesională de închiriere pentru turiști, dar nu a putut găsi un furnizor de echipamente de încredere cu calitate și prețuri constante.
    solution: Începând cu Pachetul de Start pentru Club Paddle Board Overstock (10 plăci, palete, echipament de siguranță, branding), clubul a crescut prin programul Pachet Premium pe parcursul a 18 luni.
    result:
      - A crescut de la 10 la 80 de plăci în 18 luni cu calitate și prețuri constante
      - S-au adăugat cursuri de yoga și fitness SUP în programul săptămânal
      - Brandingul personalizat al clubului a crescut recunoașterea brandului printre turiști
      - Costurile de întreținere au fost reduse cu 60% comparativ cu echipamentele anterioare bugetare
      - Acum servește 150+ închirieri zilnice în sezonul de vârf
    quote:
      text: Pachetul de Start pentru Club a fost punctul de intrare perfect. Pe măsură ce afacerea noastră a crescut, Paddle Board Overstock a crescut odată cu noi — aceeași calitate, același preț, fără surprize.
      author: Proprietar de club, Phuket
    cta_text: Începeți Pachetul Pentru Clubul Dvs.
    cta_href: /solutions/clubs
  - title: Cum o rețea de resorturi din Caraibe a standardizat sporturile nautice în 5 proprietăți
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Lanț de resorturi — Caraibe
    problem: O rețea de resorturi de lux cu 5 proprietăți avea nevoie de calitate constantă a echipamentelor pentru sporturi nautice și branding uniform în toate locațiile, cu achiziții centralizate și planificarea înlocuirilor sezoniere.
    solution: Paddle Board Overstock a livrat o flotă multi-proprietate de 400 SUPs cu branding unificat, inventar de piese de schimb comun și un program anual de înlocuire cu prețuri pe volum.
    result:
      - Experiență standardizată pentru oaspeți în toate cele 5 proprietăți
      - Reducere de 30% a costurilor prin achiziții consolidate și prețuri în volum
      - Inventarul centralizat de piese de schimb a redus timpul de nefuncționare cu 80%
      - Programul anual de reîmprospătare a echipamentelor a eliminat haosul de la sfârșitul sezonului
      - Participarea oaspeților la sporturi nautice a crescut cu 45% de la an la an
    cta_text: Proiectați Programul Pentru Resortul Dvs.
    cta_href: /solutions/resorts
