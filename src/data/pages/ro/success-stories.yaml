stories:
  - title: Cum un Resort Mediteranean a construit o afacere profitabilă de închiriere SUP
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: Resort de plajă de 5 stele — Grecia
    problem: Resortul avea nevoie de activități nautice premium pentru oaspeți pentru a crește scorurile de satisfacție și a crea o nouă sursă de venit, dar lipseau echipamentele, infrastructura de siguranță și expertiza personalului.
    solution: Aquafarer a livrat 50 de plăci SUP personalizate cu culorile și logo-ul resortului, un sistem complet de siguranță, inclusiv stație de salvamar și linii de plutire, și un program de instruire a personalului de 3 zile acoperind manipularea echipamentului, instruirea oaspeților și protocoalele de siguranță.
    result:
      - 300+ activități săptămânale pentru oaspeți rezervate în prima lună
      - 'Scorurile de satisfacție ale oaspeților pentru activitățile nautice: 4,8/5'
      - 'Venit anual suplimentar: 180.000 $'
      - Zero incidente de siguranță în primul sezon de operare
      - Costul de înlocuire a echipamentului redus cu 40% comparativ cu furnizorul anterior
    quote:
      text: Aquafarer nu doar a livrat plăcile — ne-au ajutat să construim o experiență completă pentru oaspeți. Programul nostru de sporturi nautice a trecut de la zero la atracția resortului într-un singur sezon.
      author: Manager General Resort
    cta_text: Construiți Soluția Resortului Dvs.
    cta_href: /solutions/resorts
  - title: Cum o Startup Australiană a construit un Brand de Apă în 90 de Zile
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Antreprenor pentru prima dată — Australia
    problem: Un pasionat de activități în aer liber dorea să lanseze propriul său brand SUP pentru piața australiană, dar nu avea experiență în producție, relații cu furnizorii și capital limitat.
    solution: Pachetul de Lansare a Brandului de la Aquafarer a oferit consultanță pentru selectarea produselor, design personalizat al logo-ului și al culorilor, ambalaje de retail branduite cu etichete, documentație de certificare CE și expediere FOB către Sydney.
    result:
      - Prima livrare de 200 de plăci a fost efectuată în 75 de zile de la primul contact
      - Brandul a fost lansat pe Shopify și + Amazon AU în 2 săptămâni de la sosire
      - Inventarul inițial s-a epuizat în 45 de zile
      - 'Marja medie: 55% din prețul de retail'
      - 'A doua comandă: 500 de unități plasate în 60 de zile de la lansare'
    quote:
      text: Aveam ideea brandului, dar zero cunoștințe de producție. Aquafarer m-a ghidat literalmente prin întregul proces — de la alegerea tipului de placă până la despachetarea primei livrări. 90 de zile de la vis la livrare.
      author: Fondator, Brand Australian SUP
    cta_text: Lansează-ți Brandul
    cta_href: /solutions/entrepreneurs
  - title: Cum un Beach Club Thailandez a crescut de la 10 la 80 de Plăci
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Club de sporturi nautice — Thailanda
    problem: Un mic club de plajă SUP din Phuket trebuia să treacă de la o activitate de hobby la o afacere profesională de închiriere pentru turiști, dar nu a putut găsi un furnizor de echipamente de încredere cu calitate și prețuri constante.
    solution: Începând cu Pachetul Club Starter Aquafarer (10 plăci, vâsle, echipamente de siguranță, branding), clubul a crescut prin programul Pachet Premium pe parcursul a 18 luni.
    result:
      - A crescut de la 10 la 80 de plăci în 18 luni cu calitate și prețuri constante
      - A adăugat închirieri de caiace și bărci cu pedale folosind același furnizor
      - Brandingul personalizat al clubului a crescut recunoașterea brandului printre turiști
      - Costurile de întreținere au fost reduse cu 60% comparativ cu echipamentele anterioare bugetare
      - Acum servește 150+ închirieri zilnice în sezonul de vârf
    quote:
      text: Pachetul Club Starter a fost punctul de intrare perfect. Pe măsură ce afacerea noastră a crescut, Aquafarer a crescut odată cu noi — aceeași calitate, aceleași prețuri, fără surprize.
      author: Proprietar de club, Phuket
    cta_text: Începeți Pachetul Pentru Clubul Dvs.
    cta_href: /solutions/clubs
  - title: Cum o rețea de resorturi din Caraibe a standardizat sporturile nautice în 5 proprietăți
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Lanț de resorturi — Caraibe
    problem: O rețea de resorturi de lux cu 5 proprietăți avea nevoie de calitate constantă a echipamentelor pentru sporturi nautice și branding uniform în toate locațiile, cu achiziții centralizate și planificarea înlocuirilor sezoniere.
    solution: Aquafarer a furnizat o flotă multi-proprietate de 300 SUPs și 100 de caiace cu branding unitar, inventar comun de piese de schimb și program anual de înlocuire cu prețuri în volum.
    result:
      - Experiență standardizată pentru oaspeți în toate cele 5 proprietăți
      - Reducere de 30% a costurilor prin achiziții consolidate și prețuri în volum
      - Inventarul centralizat de piese de schimb a redus timpul de nefuncționare cu 80%
      - Programul anual de reîmprospătare a echipamentelor a eliminat haosul de la sfârșitul sezonului
      - Participarea oaspeților la sporturi nautice a crescut cu 45% de la an la an
    cta_text: Proiectați Programul Pentru Resortul Dvs.
    cta_href: /solutions/resorts
