content_scope:
  tagline: Domeniul de aplicare al conformității
  title: Care Produse Necesită<br />RCD Conformitate?
  subtitle: Directiva privind ambarcațiunile de agrement 2013/53/UE se aplică ambarcațiunilor de agrement cu o lungime a corpului între 2,5 m și 24 m. Înțelegerea domeniului de aplicare este primul pas spre conformitate.
  items:
    - title: RIB Bărci (2,5–24 m)
      description: Bărci rigide gonflabile cu lungimi ale corpului de la 2,5 m la 24 m intră sub RCD. Categoriile de proiectare A până la D se aplică în funcție de condițiile de mare prevăzute și forța maximă a vântului.
      icon: tabler:sailboat
    - title: Bărci gonflabile (sub 2,5 m)
      description: Bărcile gonflabile mici și bărci cu vâsle sub 2,5 m pot fi parțial exceptate de la RCD, dar necesită în continuare marcaj CE conform altor directive aplicabile și standardelor de construcție EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Plăci & Accesorii
      description: Plăcile de SUP (stand-up paddle) sunt în afara domeniului RCD. Totuși, dispozitivele de plutire personale (PFD) asociate necesită marcaj CE conform Regulamentului PPE (UE) 2016/425 cu aprobare USCG Tip III/V, acolo unde este aplicabil.
      icon: tabler:swimming
    - title: Bărci parțial finalizate
      description: Bărcile livrate fără motor sau instalații specifice necesită o Declarație a Constructorului pentru ambarcațiuni parțial finalizate, cu conformitatea completă RCD realizată de constructorul final sau importator.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistem de încredere în trei straturi
  title: Informații privind conformitatea<br />— Distribuit la nivelul potrivit
  subtitle: Nu toate datele de conformitate trebuie să fie pe un site web public. Urmăm o abordare în trei straturi care protejează proprietatea intelectuală, în timp ce crește încrederea cumpărătorilor.
  items:
    - title: Stratul 1 — Website Public
      description: Standardele menționate, rutele de conformitate explicate, tipurile de documente listate, domeniul de certificare pe fiecare familie de modele. Fără certificate reale, date de testare sau detalii inginerești proprietare.
      icon: tabler:world
    - title: Nivelul 2 — Partajare după anchetă
      description: 'După o anchetă calificată: eșantion DoC redactat, fotografie a plăcuței constructorului, listă de standarde aplicabile, listă de verificare a conformității și rezumate ale certificărilor materialelor — partajate în conformitate cu termenii utilizării corecte.'
      icon: tabler:mail
    - title: Stratul 3 — NDA / Etapa comenzii
      description: Dosar tehnic complet, evaluări ale riscurilor, calcule de stabilitate, rapoarte de testare, fișe de loturi de materiale și documentație privind trasabilitatea producției — partajate numai sub NDA cu cumpărătorii confirmați.
      icon: tabler:lock
content_standards:
  tagline: Standarde aplicabile
  title: ISO & Standardele EN<br />Construim pentru
  subtitle: Produsele noastre sunt proiectate și testate conform standardelor armonizate din cadrul RCD. Numerele și denumirile standardelor sunt menționate; textele complete ale standardelor rămân protejate de drepturi de autor ISO.
  items:
    - title: RO ISO 6185-3
      description: 'Bărci gonflabile — Partea 3: Bărci cu o putere maximă a motorului de 15 kW sau mai mult. Cerințe privind construcția, stabilitatea, flotabilitatea și recuperarea persoanei căzute peste bord pentru RIBs.'
      icon: tabler:file-text
    - title: RO ISO 6185-4
      description: 'Bărci pneumatice — Partea 4: Bărci cu o putere maximă a motorului de 15 kW și mai mare sau egală cu 4,5 kW. Cerințe suplimentare de structură și stabilitate.'
      icon: tabler:file-text
    - title: ISO Seria 12215
      description: Ambarcațiuni mici — Construcția și dimensiunile carenei. Proiectarea structurală a carenei, punții și a compartimentelor pentru carene din fibră de sticlă și aluminiu RIB.
      icon: tabler:ruler-2
    - title: RO ISO 10240
      description: Ambarcațiuni mici — Manualul proprietarului. Conținutul și formatul necesar pentru manualul proprietarului care însoțește fiecare RIB barcă livrată în UE.
      icon: tabler:book
    - title: RO ISO 14945
      description: Ambarcațiune mică — Plăcuța constructorului. Informații ce trebuie înscrise pe plăcuța constructorului atașată permanent fiecărei ambarcațiuni.
      icon: tabler:badge
    - title: ISO 8666
      description: Ambarcațiuni mici — Date principale. Măsurători și parametri standardizați pentru o specificație consistentă în toate documentațiile produsului.
      icon: tabler:dimensions
content_process:
  tagline: Proces de conformitate
  title: Conformitate în 6 pași CE<br />Flux de lucru
  subtitle: De la domeniul proiectului până la trasabilitatea la nivel serial — fiecare RIB model urmează un parcurs de conformitate definit.
  steps:
    - number: '01'
      title: Domeniul și clasificarea proiectului
      description: Definiți modelul RIB, categoria de design (A/B/C/D), numărul maxim de persoane, sarcina utilă, puterea motorului și piața țintă. Determinați dacă RCD se aplică și care modul de evaluare a conformității este necesar.
      timeline: 2–3 zile
    - number: '02'
      title: Identificarea Cerințelor Aplicabile
      description: Identificați toate Cerințele Esențiale de Siguranță aplicabile din Anexa I RCD, standardele armonizate relevante (EN ISO 6185, 12215, 10240, 14945) și orice cerințe naționale suplimentare pentru piața țintă.
      timeline: 3–5 zile
    - number: '03'
      title: Documentație Tehnică și de Proiectare
      description: 'Creați Dosarul Tehnic Principal: desene de aranjament general, calculul stabilității și flotabilității, evaluarea riscurilor, specificații de materiale și analiza siguranței sistemelor (combustibil, electric, direcție).'
      timeline: 10–15 zile
    - number: '04'
      title: Verificarea și Testarea Produsului
      description: Efectuați verificarea fizică — test de presiune la 1,25x presiunea nominală timp de 24–48 de ore, teste de stabilitate și flotabilitate, teste de încărcare și punerea în funcțiune a sistemelor. Înregistrați toate rezultatele testelor pentru fiecare cadru.
      timeline: 5–7 zile
    - number: '05'
      title: Marcarea și Documentația de Livrare
      description: Aplicarea marcajului CE, a plăcii constructorului (EN ISO 14945) și a HIN/CIN (număr de identificare al cadrului). Pregătiți Declarația de Conformitate UE, manualul proprietarului (EN ISO 10240) și lista de verificare a conformității.
      timeline: 2–3 zile
    - number: '06'
      title: Trasabilitatea la Nivel Serial
      description: Fiecare cadru primește un Dosar de Cadru unic care îl leagă de Dosarul Tehnic Principal, lotul de producție, certificatele materialelor, rezultatele testelor și configurația finală. Înregistrările sunt păstrate timp de 10+ ani conform RCD.
      timeline: În Derulare
content_document_cards:
  tagline: Tipuri de Documente
  title: Document de Conformitate<br />Cartele
  subtitle: Acestea sunt tipurile de documente pe care le pregătim și le întreținem pentru fiecare model RIB certificat CE. Mostrele sunt disponibile la cerere calificată.
  items:
    - title: Certificat de Conformitate CE / RCD
      description: Certificat specific modelului care confirmă că ambarcațiunea respectă toate Cerințele Esențiale de Siguranță aplicabile din RCD 2013/53/UE, emis de producător cu implicarea Organismului Notificat acolo unde este necesar.
      icon: tabler:certificate
    - title: Declarație de Conformitate UE (DoC)
      description: Declarație semnată de producător sau de reprezentant autorizat, listând directivele aplicabile, standardele, modul de conformitate și detaliile Organismului Notificat. Este necesară pentru fiecare model pus pe piața UE.
      icon: tabler:file-check
    - title: Placa Constructorului (EN ISO 14945)
      description: Placă aplicată permanent care arată numărul maxim de persoane, puterea maximă a motorului, categoria de design și identificarea producătorului. Trebuie să rămână lizibilă pe întreaga durată de viață a ambarcațiunii.
      icon: tabler:badge
    - title: Manualul Proprietarului (EN ISO 10240)
      description: Manual cuprinzător care acoperă operarea în siguranță, procedurile de urgență, programele de întreținere și avertismentele de siguranță. Obligatoriu pentru fiecare RIB livrat în UE.
      icon: tabler:book
    - title: Rapoarte de Testare și Inspecție ISO
      description: Înregistrări ale testelor de presiune (1,25x / 24–48h), rezultate ale testelor de stabilitate și flotabilitate, certificate de testare a materialelor și rapoarte de verificare dimensională — toate legate de numerele specifice ale cadrelor.
      icon: tabler:test-pipe
    - title: Înregistrări de Trasabilitate a Materialelor
      description: Trasabilitate la nivel de loturi pentru țesături tubulare, adezive, fibră de sticlă și echipamente. Leagă fiecare unitate de producție de certificatele materiale primite și rezultatele inspecțiilor IQC.
      icon: tabler:link
    - title: Inspecția calității și evidențele QC
      description: Listă de verificare a calității de 100 de puncte pe unitate, înregistrări QC în proces, rapoarte de neconformitate și acțiuni corective. Parte a lanțului de trasabilitate al producției.
      icon: tabler:clipboard-check
    - title: Pachetul de Documente al Proiectului
      description: Pachet de documentație pentru fiecare carenă, incluzând înregistrarea finală a configurației, detalii despre instalarea motoarelor și echipamentelor, lista de verificare pentru punerea în funcțiune și documentația livrării.
      icon: tabler:package
content_design_categories:
  tagline: RCD Categorii de design
  title: Categoria de proiectare A–D<br />— Ce înseamnă ele
  subtitle: Acesta RCD atribuie categorii de proiectare bazate pe forța maximă a vântului și pe înălțimea semnificativă a valurilor pe care ambarcațiunea este proiectată să o suporte.
  items:
    - title: Categoria A — Oceanul
      description: Proiectat pentru călătorii prelungite unde forța vântului poate depăși Beaufort 8 (>40 noduri) și înălțimea semnificativă a valurilor poate depăși 4 m. Necesită cea mai riguroasă verificare structurală și de stabilitate.
      icon: tabler:ripple
    - title: Categoria B — Offshore
      description: Proiectat pentru voiaje offshore cu forță a vântului de până la Beaufort 8 (≤40 noduri) și o înălțime semnificativă a valurilor de până la 4 m. Potrivit pentru ape de coastă și semi-expuse.
      icon: tabler:anchor
    - title: Categoria C — Inshore
      description: Proiectat pentru călătorii de coastă cu o forță a vântului de până la Beaufort 6 (≤27 noduri) și o înălțime semnificativă a valurilor de până la 2 m. Majoritatea recreaționale RIBs se încadrează în această categorie.
      icon: tabler:sun
    - title: Categoria D — Protejat
      description: Proiectat pentru ape adăpostite cu forță a vântului de până la Beaufort 4 (≤16 noduri) și o înălțime semnificativă a valurilor de până la 0,3 m. Lacuri, râuri și porturi protejate.
      icon: tabler:pool
content_hin:
  tagline: Identificarea ambarcațiunilor
  title: HIN / CIN & Placă de Constructor
  subtitle: Fiecare RIB ambarcațiune necesită un Număr de Identificare a Corpului (HIN) sau Număr de Identificare a Ambarcațiunii (CIN) și o plăcuță de înmatriculare conform EN ISO 14945 și RCD cerințelor.
  items:
    - title: Numărul de identificare al corpului (HIN)
      description: Un cod unic de 14 caractere marcat permanent pe partea tribord a transomului, codificând codul producătorului (MIC), anul modelului, anul producției și numărul de serie. Necesar pentru intrarea pe piața UE.
      icon: tabler:hash
    - title: Numărul de identificare al ambarcațiunii (CIN)
      description: Conform ISO EN 10087, un număr secundar ascuns de identificare plasat într-un loc ascuns pentru scopuri antifurt și trasabilitate.
      icon: tabler:eye-off
    - title: Conținutul plăcii constructorului
      description: Numărul maxim de persoane, puterea maximă a motorului (kW), sarcina maximă (kg), categoria de proiectare, numele producătorului și CE marcajele — toate afișate permanent pe o placă rezistentă la coroziune.
      icon: tabler:badge
content_tech_file:
  tagline: Structura tehnică a fișierelor
  title: Fișierul Tehnic Master<br />& Hull Record
  subtitle: 'Sistemul nostru de documentare urmează o structură în două niveluri: Fișierul Tehnic Master pentru fiecare familie de modele și Înregistrări individuale ale Corpului pentru fiecare barcă produsă.'
  items:
    - title: Fișierul Tehnic Master
      description: 'Conține documentația completă de conformitate pentru o familie de modele: aranjament general, evaluare a riscurilor, calcule de stabilitate/flotabilitate, specificații ale materialelor, standarde aplicabile și înregistrări de evaluare a conformității. Păstrată timp de 10+ ani.'
      icon: tabler:folder
    - title: Înregistrarea carenei (Trasabilitate pe ambarcațiune)
      description: 'Fiecare carenă are o înregistrare unică care îl leagă de Fișierul Tehnic Principal: HIN, data producției, lotul de tuburi, certificatele materiale, rezultatul testului de presiune, configurația finală, instalarea motorului și destinația de livrare.'
      icon: tabler:file-description
    - title: Pachetul de Conformitate pentru Clienți
      description: Pachet de livrare per carenă care include DoC, fotografia plăcuței constructorului, manualul proprietarului, rezumatul testului și fișa finală de configurare — furnizat cu fiecare RIB expediere către UE.
      icon: tabler:package
content_material_cert:
  tagline: Certificarea materialelor
  title: Trasabilitatea materialelor &<br />Dovezi de certificare
  subtitle: RIB Bărcile de calitate încep cu materiale controlate și procese documentate. Mai jos este modul în care organizăm certificarea materialelor pentru fiecare grup critic de componente.
  items:
    - title: Trasabilitatea materialului tuburilor gonflabile
      description: PVC CSMHypalon Materialele pentru tuburi și / sunt selectate în funcție de utilizarea intenționată, condițiile climatice și piața țintă. Datele tehnice ale furnizorilor (TDS), informațiile despre loturile de materiale, trasabilitatea loturilor UV de materiale, rapoartele de testare a intemperiilor și REACHdeclarațiile /SVHC sunt disponibile în cadrul documentației proiectului agreate.
      icon: tabler:circle
    - title: Trasabilitatea aluminiului marin
      description: Pentru proiectele cu carenă din RIB aluminiu, gradul aliajului, grosimea și loturile de materiale sunt controlate conform specificațiilor aprobate. Certificatele de testare a materialelor (MTC/MTR), documentația EN 10204 3.1, rapoartele de compoziție chimică și proprietăți mecanice, precum și trasabilitatea termică/loturilor sunt furnizate acolo unde este convenit.
      icon: tabler:rectangle
    - title: Controlul materialelor și procesului în GRP
      description: Pentru carcasa din fibră RIBsde sticlă, gelcoat, rășină, armură din fibră de sticlă și materialele de bază sunt gestionate prin specificații controlate. TDS/SDS materiale, înregistrări de lot, specificații laminate și înregistrări de întărire și control al atelierului sunt disponibile în funcție de acordul proiectului.
      icon: tabler:layers-subtract
    - title: Suport pentru documentarea componentelor
      description: Pentru componente selectate — inclusiv EVA materiale de punte, scaune, feronerie din oțel inoxidabil, sisteme de combustibil, echipamente electrice și accesorii marine — documentația furnizorului aplicabilă este coordonată pe baza configurației finale și a cerințelor pieței de destinație.
      icon: tabler:package
    - title: Notificare privind domeniul de conformitate
      description: Certificatele, rapoartele de testare și documentele de conformitate se aplică doar modelului specific de produs, materialului, componentei, lotului de producție sau scopului proiectului menționat în documentul relevant. Contactați-ne cu piața țintă, utilizarea intenționată și cerințele tehnice, astfel încât pachetul de documentație aplicabil să poată fi confirmat înainte de plasarea comenzii.
      icon: tabler:info-circle
faq:
  title: CE Conformitate — Întrebări frecvente
  questions:
    - q: Sunt toate Paddle Board Overstock RIB CE bărcile certificate pentru piața UE?
      a: RIB Bărcile din catalogul nostru sunt proiectate și documentate pentru RCD conformitatea 2013/53/UE conform directivelor UE aplicabile.CE Marcarea se aplică pe bază de model și configurație. Contactați-ne pentru un document specific modelului de acoperire al competenței.
    - q: Care este diferența dintre RCD conformitate și CE marcare?
      a: RCD (Directiva privind ambarcațiunile de agrement 2013/53/UE) este legislația UE care stabilește cerințele esențiale de siguranță.CE Marcarea este simbolul vizual plasat pe un produs care a fost evaluat și confirmat că respectă aceste cerințe. Un produs trebuie să respecte RCD regulile înainte de a putea purta CE marca.
    - q: Furnizați declarații de conformitate fiecărei bărci?
      a: Da. Fiecare barcă RIB livrată pe piața UE include o Declarație de Conformitate UE specifică modelului, care listează directivele aplicabile, standardele armonizate, modulul de evaluare a conformității și detaliile Organismului Notificat.
    - q: Ce modul de evaluare a conformității folosește Paddle Board Overstock?
      a: Modulul depinde de categoria de design și tipul de ambarcațiune. Majoritatea modelelor RIB din Categoria de Design C utilizează Modulul A (control intern al producției). Pentru ambarcațiunile din Categoria de Design A/B sau pentru configurații specifice, poate fi aplicabil Modulul B+C sau B+D cu implicarea Organismului Notificat. Oferim consultanță privind modulul corespunzător fiecărui proiect.
    - q: Poți să ne furnizezi documentația de conformitate înainte să plasăm o comandă?
      a: După o investigație calificată, împărtășim un document privind domeniul de conformitate care listează standardele aplicabile, ruta de conformitate și tipurile de documente disponibile pentru modelul pe care îl evaluați. Fișierele tehnice complete sunt partajate sub NDA după confirmarea comenzii.
    - q: Ce este un Număr de Identificare a Cărămidii (HIN) și este inclus?
      a: HIN este un identificator unic de 14 caractere, marcat permanent pe fiecare barcă, care codifică codul producătorului (MIC), denumirea modelului, anul de producție și numărul de serie. Este obligatoriu pentru toate bărcile RIB puse pe piața UE și este inclus pe fiecare Paddle Board Overstock RIB.
    - q: Cât timp sunt păstrate fișierele tehnice?
      a: Conform cerințelor RCD 2013/53/UE, producătorul trebuie să păstreze dosarul tehnic timp de cel puțin 10 ani de la ultima dată la care produsul a fost pus pe piață. Paddle Board Overstock păstrează documentația tehnică completă pentru toate modelele produse.
    - q: Oferiți asistență pentru obligațiile importatorilor conform RCD?
      a: 'Da. Furnizăm pachetul de documentație de care importatorii din UE au nevoie pentru a-și îndeplini obligațiile: acces la dosarul tehnic, Declarația de Conformitate (DoC), plăcuța constructorului, manualul proprietarului și înregistrările trasabilității produsului. Responsabilitățile importatorului conform RCD sunt clar documentate în ghidul nostru de conformitate.'
