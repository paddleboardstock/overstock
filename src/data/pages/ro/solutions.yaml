features3_solutions:
  tagline: Soluții
  title: Aventura Ta Acvatică<br />Partener de Afaceri
  isBeforeContent: false
  columns: 3
  items:
    - title: Cluburi de Sporturi Acvatice
      description: Pachete complete de echipamente, branding personalizat și programe de întreținere pentru cluburi SUP, cluburi de caiac, școli de surf și centre de instruire.
      icon: tabler:users
      link: /solutions/clubs
    - title: Sporturi acvatice RIBs
      description: RIBs special concepute pentru școli de navigație, centre de sporturi acvatice și organizații de evenimente. Bărci pentru antrenori, bărci de tractare și bărci de pază pentru sporturi acvatice profesionale.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorturi și Hoteluri
      description: Programe premium de sporturi acvatice cu flote de echipamente, sisteme de siguranță, instruirea personalului și gestionarea veniturilor pentru proprietăți hoteliere.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Antreprenori de Branduri Acvatice
      description: Producție private label OEM/ODM cu MOQs redus, design personalizat al produsului, ambalare și livrare globală pentru proprietarii de noi branduri.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Bărci pentru Centre de Scufundări
      description: Platforme stabile RIB cu acces facil, spațiu de depozitare a echipamentului și configurații de motoare optimizate pentru operațiuni de scufundări.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Ambarcațiuni de Salvare și Urgență
      description: Bărci rapide RIBs și bărci gonflabile proiectate pentru căutare și salvare, intervenții de urgență și operațiuni ale gărzii de coastă.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Soluții pentru Tender pentru Yachturi
      description: Tender compacte, elegante RIB care completează superyachturile și ambarcațiunile de recreere. Ușor de depozitat, performanță puternică.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Soluții pentru Bărci de Pescuit
      description: Bărci gonflabile stabile și durabile și RIBs configurate pentru operațiuni de pescuit comerciale și recreative.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Echipamente pentru Turism Maritim
      description: Bărci gonflabile gata de flotă, plăci SUP și caiace pentru stațiuni, operatori de turism și afaceri de închiriere sporturi nautice.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Energie Offshore RIBs
      description: Echipamente grele RIBs pentru suport platforme de petrol și gaze, transfer echipe eoliene, inspectarea cablurilor submarine și construcții marine.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Bărci de Lucru pentru Acvacultură
      description: Echipamente rezistente la coroziune RIBs pentru creșterea peștilor, cultivarea perlelor și ferme oceanice. Tuburi Hypalon, accesorii din oțel inoxidabil, durabilitate pentru utilizare zilnică.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Cercetare și Studiu Marin
      description: Echipamente stabile pregătite pentru instrumente RIBs pentru cercetare oceanografică, monitorizarea mediului, prelevarea de probe de apă și programe universitare de predare.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Bărci Comerciale de Lucru
      description: Echipamente grele RIBs pentru patrulare, studiu, transport și logistică offshore. Construite pentru cerințele riguroase ale operațiunilor comerciale.
      icon: tabler:ship
      link: /commercial-workboats
cta:
