materials:
  intro_p1: Performanța, durabilitatea și siguranța unei ambarcațiuni gonflabile depind aproape în totalitate de materialele folosite la construcția sa. De la materialul care formează tuburile până la filetele care conferă rigidității SUP scândurii, fiecare alegere de material influențează modul în care produsul se comportă pe apă și cât timp rezistă.
  intro_p2: 'Acest ghid acoperă cele patru materiale de bază folosite în ambarcațiunile hidrografice gonflabile moderne: PVC material textil, Hypalon CSM cauciuc, drop-stitch construcția nucleului și EVA platforma din spumă. Înțelegerea acestor materiale te va ajuta să alegi produsul potrivit pentru nevoile tale și să-l menții pe durata maximă de viață.'
  labels:
    advantages: Avantaje
    limitations: Limitări
    best_for: 'Cel mai bun pentru:'
  items:
    - name: PVC (Clorură de Polivinil)
      summary: Standardul industriei pentru bărcile gonflabile de agrement și SUPs. Materialul laminat multistrat oferă un raport excelent rezistență-greutate la un preț accesibil.
      pros:
        - Accesibil — cu 30-50% mai ieftin decât Hypalon
        - Ușor și ușor de manevrat
        - UV Rezistență bună cu acoperiri adecvate
        - O gamă largă de culori și finisaje
        - Ușor de reparat cu PVC plasturi și adeziv cu solvenți
      cons:
        - Durată de viață mai scurtă decât Hypalon (7-10 ani)
        - Mai puțin flexibil la temperaturi scăzute
        - Rezistență chimică mai scăzută
        - Poate dezvolta migrație a plastifiantului în timp
      best_for: SUPsRecreațiune, bărci accesibile, flote de închiriere, utilizare sezonieră, medii de apă dulce și de coastă.
    - name: Hypalon (CSMCauciuc)
      summary: Material de cauciuc sintetic premium, cunoscut pentru durabilitate, UV rezistență și longevitate excepționale. Standardul de aur pentru bărcile gonflabile comerciale și militare.
      pros:
        - UV Rezistență excepțională și la ozon
        - Durata de viață de 15-20 de ani cu îngrijire adecvată
        - Flexibilitate excelentă în condiții de frig
        - Rezistență superioară la substanțe chimice și ulei
        - Păstrează culoarea mai mult decât PVC
      cons:
        - Semnificativ mai scump decât PVC
        - Greutate mai mare a materialului
        - Mai puține opțiuni de culoare
        - Reparațiile necesită adezivi specializați
        - Mai puține facilități de producție la nivel mondial
      best_for: ComercialRIBs, căutare și salvare, aplicații militare, climate tropicale, deținere pe termen lung a flotei.
    - name: Drop-Stitch Nucleu
      summary: Tehnologia care a revoluționat sistemul SUPsgonflabil. Mii de fire de poliester leagă straturile superioare și inferioare ale materialului, permițând umflarea la presiune ridicată pentru performanțe rigide, hard-shell.
      pros:
        - Extrem de rigid la 12-20 PSIde ani
        - Ușor — 18-30 lbs pentru placă full-size
        - Se pliază plat pentru depozitare și deplasare
        - Rezistență excelentă la impact
        - Performanță constantă între intervale de temperatură
      cons:
        - Necesită pompă de înaltă presiune
        - Reparația prin înțepături este mai complexă decât cea cu un singur strat
        - Costuri de fabricație mai mari decât cele gonflabile standard
        - Pierderea de presiune în timp necesită completări periodice
      best_for: Plăci de paddle în picioare, caiace, punți de aer pentru bărci gonflabile, orice aplicație care necesită performanță rigidă cu portabilitate gonflabilă.
    - name: EVA Platformă din spumă
      summary: Spumă cu celule EVA închise (acetat de etilen-vinil) folosită pentru plăcuțele de tracțiune pe SUP plăci și punțile bărcilor. Oferă amortizare, aderență și izolație termică.
      pros:
        - Priză excelentă antiderapantă pe umed sau pe uscat
        - Amortizarea reduce oboseala la vâsle lungi
        - Izolație termică de la suprafața rece a terasei
        - UV și rezistent la apă sărată
        - Disponibil în modele de blocuri multicolore și gravate cu laser
      cons:
        - Se poate purta cu utilizare intensă timp de 2-3 ani
        - Trebuie să fie lipit corespunzător pentru a preveni delaminarea
        - Nu este structural — nu afectează rigiditatea
        - Adaugă greutate ușoară (200-400 g pe placă)
      best_for: Tracțiune pe punte SUP, căptușeală pentru puntea bărcii, confortul scaunului de caiac, orice suprafață care necesită aderență antiderapantă.
  selection:
    title: Ghid de selecție a materialului
    subtitle: 'Alege materialul potrivit în funcție de cazul tău principal de utilizare:'
    headers:
      - Caz de utilizare
      - Material recomandat
      - De ce
    rows:
      - - Paddling recreativ SUP
        - Drop-stitch PVC
        - Ușor, rigid, accesibil — echilibrul ideal pentru practicanții de agrement
      - - Bărcuță de familie / barcă de lac
        - PVC (1100 denier)
        - Cost-eficient, ușor de reparat, durabilitate suficientă pentru utilizare recreativă
      - - Barcă comercială RIB / barcă de patrulare
        - Hypalon CSM
        - Rezistență maximă UV, durată de viață 15-20 ani, rezistență la substanțe chimice/ulei
      - - Plăci pentru flote de închiriere SUP
        - Drop-stitch PVC + EVA deck
        - Durabil, reparabil, valoare bună pentru utilizare cu rotație mare
      - - Operațiuni de căutare și salvare
        - Hypalon CSM
        - Fiabilitate în condiții extreme, flexibilitate la frig, rezistență la substanțe chimice
      - - Caiac de tur / expediție
        - Drop-stitch PVC
        - Performanță rigidă cu portabilitate pliabilă pentru călătorie
  deep_dive:
    title: Ghiduri aprofundate
    topics:
      - title: Material Marin PVC
        desc: Țesătură multistrat laminată PVC — rezistență UV, testarea abraziunii și ratingurile denier explicate.
      - title: PVC vs Hypalon
        desc: Compararea definitivă a celor două materiale dominante pentru bărci gonflabile — cost, durată de viață, rezistență UV.
      - title: Drop-Stitch Nucleu
        desc: Cum mii de fire interne creează structuri gonflabile rigide, de înaltă presiune la 12-15 PSI.
      - title: Tehnologia de sudare RF
        desc: Sudarea cu frecvență înaltă creează cusături puternice și constante — cum funcționează și de ce este important.
      - title: PSI & Performanță
        desc: De ce contează presiunea aerului pentru SUPs și bărci gonflabile — rigiditate, capacitate de greutate și calitatea plimbării.
      - title: Testarea calității
        desc: Testarea presiunii, teste de flotabilitate, UV îmbătrânire și teste distructive — procesul nostru de calitate.
      - title: EVA Podele din spumă
        desc: Pad-uri de podea din spumă EVA cu celule închise — tracțiune, confort și durabilitate pentru SUP și podele de bărci.
      - title: Întreținerea materialelor
        desc: Curățare, protecție UV, prevenirea mucegaiului și bune practici de depozitare pentru produsele gonflabile.
