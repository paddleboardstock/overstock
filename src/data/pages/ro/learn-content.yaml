materials:
  intro_p1: Performanța, durabilitatea și siguranța unei plăci de paddle gonflabile depind aproape în totalitate de materialele folosite în construcția sa. De la laminatele care formează corpul la firele care oferă rigiditate unei plăci SUP, fiecare alegere de material afectează modul în care produsul se comportă pe apă și cât timp rezistă.
  intro_p2: 'Acest ghid acoperă cele trei materiale de bază folosite în plăcile de paddle gonflabile moderne: laminatele PVC, miezul drop-stitch și deckingul din spumă EVA. Înțelegerea acestor materiale te va ajuta să alegi placa potrivită nevoilor tale și să o întreții pentru o durată maximă de viață.'
  labels:
    advantages: Avantaje
    limitations: Limitări
    best_for: 'Cel mai bun pentru:'
  items:
    - name: PVC (Clorură de Polivinil)
      summary: Standardul industriei pentru SUPs gonflabile. Țesătura laminată multi-strat oferă un raport excelent rezistență-greutate la un preț accesibil.
      pros:
        - Valoare excelentă pentru bani
        - Ușor și ușor de manevrat
        - UV Rezistență bună cu acoperiri adecvate
        - O gamă largă de culori și finisaje
        - Ușor de reparat cu PVC plasturi și adeziv cu solvenți
      cons:
        - Durata de viață tipică de 7-10 ani cu întreținere corespunzătoare
        - Mai puțin flexibil la temperaturi scăzute
        - Rezistență chimică mai scăzută
        - Poate dezvolta migrație a plastifiantului în timp
      best_for: SUPs recreative și de turism, paddling familial, utilizare sezonieră, în apă dulce și medii costiere.
    - name: Drop-Stitch Miez
      summary: Tehnologia care a revoluționat sistemul SUPsgonflabil. Mii de fire de poliester leagă straturile superioare și inferioare ale materialului, permițând umflarea la presiune ridicată pentru performanțe rigide, hard-shell.
      pros:
        - Extrem de rigid la 12-20 PSIde ani
        - Ușor — 18-30 lbs pentru placă full-size
        - Se pliază plat pentru depozitare și deplasare
        - Rezistență excelentă la impact
        - Performanță constantă între intervale de temperatură
      cons:
        - Necesită pompă de înaltă presiune
        - Reparația prin înțepături este mai complexă decât cea cu un singur strat
        - Costuri de fabricație mai mari decât cele gonflabile standard
        - Pierderea de presiune în timp necesită completări periodice
      best_for: Plăci de stand-up paddle și orice echipament care necesită performanță rigidă cu portabilitate pliabilă.
    - name: EVA Platformă din spumă
      summary: Spumă cu celule închise EVA (etilen-vinil-acetat) folosită pentru plăcile de tracțiune pe plăcile SUP. Oferă amortizare, aderență și izolație termică — și prezintă design-urile seriei de artă.
      pros:
        - Priză excelentă antiderapantă pe umed sau pe uscat
        - Amortizarea reduce oboseala la vâsle lungi
        - Izolație termică de la suprafața rece a terasei
        - UV și rezistent la apă sărată
        - Disponibil în modele de blocuri multicolore și gravate cu laser
      cons:
        - Se poate purta cu utilizare intensă timp de 2-3 ani
        - Trebuie să fie lipit corespunzător pentru a preveni delaminarea
        - Nu este structural — nu afectează rigiditatea
        - Adaugă greutate ușoară (200-400 g pe placă)
      best_for: Tracțiune pe punte SUP, design-uri de punte din seria de artă și orice suprafață care necesită aderență antiderapantă.
  selection:
    title: Ghid de selecție a materialului
    subtitle: 'Alege materialul potrivit în funcție de cazul tău principal de utilizare:'
    headers:
      - Caz de utilizare
      - Material recomandat
      - De ce
    rows:
      - - Paddling recreativ SUP
        - Drop-stitch PVC
        - Ușor, rigid, accesibil — echilibrul ideal pentru practicanții de agrement
      - - Paddling pentru familie și începători
        - Larg drop-stitch PVC (32"+)
        - Stabil și iertător — încredere pentru paddlerii începători
      - - Pescuit și paddling cu multe echipamente
        - Larg drop-stitch PVC cu punte completă EVA
        - Stabilitate suplimentară pentru stat în picioare și aruncare, volum mare pentru echipamente
      - - Plăci pentru flote de închiriere SUP
        - Drop-stitch PVC + EVA punte
        - Durabil, reparabil, valoare bună pentru utilizare cu rotație mare
      - - Tururi și paddling mai lung
        - Drop-stitch PVC (~3,35 m)
        - Urmărire mai bună și eficiență la alunecare pentru distanțe
      - - Yoga și paddling pentru fitness
        - Larg drop-stitch PVC cu punte completă EVA
        - Platformă stabilă și confortabilă pentru poziții și antrenamente
  deep_dive:
    title: Ghiduri aprofundate
    topics:
      - title: Material Marin PVC
        desc: Țesătură multistrat laminată PVC — rezistență UV, testarea abraziunii și ratingurile denier explicate.
      - title: PVC Straturi laminate
        desc: Cum echilibrează straturile laminate multiple PVC rezistența, greutatea și rezistența la UV.
      - title: Drop-Stitch Miez
        desc: Cum mii de fibre interne creează structuri rigide, gonflabile la presiune înaltă de 15 PSI.
      - title: Tehnologia de sudare RF
        desc: Sudarea cu frecvență înaltă creează cusături puternice și constante — cum funcționează și de ce este important.
      - title: PSI & Performanță
        desc: De ce contează presiunea aerului pentru SUPs gonflabile — rigiditate, capacitate de greutate și calitatea plimbării.
      - title: Testarea calității
        desc: Testarea presiunii, teste de flotabilitate, UV îmbătrânire și teste distructive — procesul nostru de calitate.
      - title: EVA Podele din spumă
        desc: Plăci din spumă cu celule închise EVA pentru punte — tracțiune, confort și durabilitate pentru punți SUP.
      - title: Întreținerea materialelor
        desc: Curățare, protecție UV, prevenirea mucegaiului și bune practici de depozitare pentru produsele gonflabile.
