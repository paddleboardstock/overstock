articles:
  sup:
    - title: SUP Bazele — Ghid pentru începători
      desc: Tot ce trebuie să știe un începător — tipuri de plăci, dimensiunea paletei, poziția și sfaturi pentru prima zi.
    - title: SUP Ghid de mărimi
      desc: Găsește lungimea, lățimea și volumul potrivite ale plăcii în funcție de greutatea, abilitatea și stilul tău de vâslit.
    - title: Gonflabil vs Hard Board
      desc: Care este potrivit pentru tine? Compararea portabilității, performanței, durabilității și costului.
    - title: Tehnici Intermediare
      desc: Îmbunătățește-ți vâslitul cu lovituri avansate, tehnici de întoarcere și gestionarea apei agitate.
    - title: Cum să alegi un SUP gonflabil
      desc: Navighează factorii cheie — construcție, grosime, setare a aripioarelor și accesorii incluse.
    - title: Siguranța apei
      desc: Cunoștințe esențiale de siguranță, inclusiv citirea vremii, selecția PFD, auto-salvare și paddling în grup.
  inflatable-boat:
    - title: Referință pentru materiale
      desc: Drop-stitch miezuri, PVC laminate, EVA spumă pentru deck și clasificări denier — înțelege din ce este făcută placa ta.
    - title: EVA Arta plăcilor explicată
      desc: Cum blocurile EVA multicolore sunt tăiate prin ștanțare și asamblate manual în artă pe piese pentru pachet care nu se estompează și nu se decojesc niciodată.
    - title: Drop-Stitch Nucleu Explicat
      desc: Cum mii de fire interne creează o platformă rigidă la 15 PSI pentru SUPs gonflabile de înaltă performanță.
    - title: Prezentare generală a tehnologiei gonflabile
      desc: Cum sunt construite plăcile gonflabile de stand-up paddle — de la stratificarea materialului la sistemele de valve și sudarea cusăturilor.
    - title: Construcția șinei și a cusăturii
      desc: Cum benzile de șină cu trei straturi și cusăturile sudate cu radiofrecvență mențin placa ta etanșă la presiune maximă.
    - title: De ce contează 15 PSI
      desc: Cum presiunea aerului eliberează performanța rigidă, de tip placă tare, dintr-un obiect gonflabil pliabil.
  water-safety:
    - title: Ghid de siguranță în apă
      desc: Cunoștințe esențiale de siguranță pentru fiecare canotor — vreme, PFD-uri, auto-salvare și protocoale de paddling în grup.
    - title: Ghid pentru vesta de salvare și PFD
      desc: Cum să alegi dispozitivul personal de flotabilitate potrivit pentru paddleboarding pe stand-up — evaluările de flotabilitate, potrivirea și confortul.
    - title: Lista de verificare pentru siguranța SUP
      desc: Lista de verificare a siguranței înainte de lansare pe care fiecare practicant de stand-up paddle ar trebui să o urmeze înainte de a intra pe apă.
    - title: Siguranța la vâslit în apă rece
      desc: Precauții, echipamente și tehnici esențiale pentru vâslit în condiții de apă rece.
    - title: Greșeli la vâslit pentru începători
      desc: Greșelile comune pe care le fac vâslașii pentru prima dată și cum să le eviți pentru o experiență mai sigură și mai plăcută.
    - title: Lesă și Reguli de Siguranță
      desc: Când este esențială folosirea unei lese, ce tipuri funcționează pentru SUP și echipamentul de siguranță pe care fiecare paddler ar trebui să-l aibă.
