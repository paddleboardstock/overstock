hero_text:
  tagline: Resurse
  title: Centrul de descărcare și ghidurile de vâslit
  subtitle: Cataloage de produse, ghiduri de cumpărare și instrucțiuni de îngrijire pentru a te ajuta să alegi, să folosești și să te bucuri SUP de placa ta gonflabilă.
features3_downloads:
  tagline: Descărcări
  title: Documentație de Produs<br />& Resurse pentru vâslit
  isBeforeContent: false
  columns: 2
  items:
    - title: SUP Catalogul de produse 2026
      description: 'Paddle Board Overstock SUP Gama completă: plăci all-around, serii de artă și accesorii, cu specificațiile complete și conținutul pachetului. Format PDF.'
      icon: tabler:file-text
    - title: SUP Ghid gonflabil pentru cumpărător
      description: 'Cum să-ți alegi prima placă: lungime, lățime, grosime, volum, potrivirea greutății riderului și ce formă de placă se potrivește stilului tău de vâslit.'
      icon: tabler:file-description
    - title: SUP Ghid de mărime și potrivire
      description: Potrivește volumul și dimensiunile plăcilor cu greutatea și nivelul tău de abilitate, cu recomandări specifice activităților pentru recreere, turism, yoga și fitness.
      icon: tabler:clipboard-check
    - title: Ghid de îngrijire și întreținere pentru pensiune
      description: 'Păstrează-ți placa ca nouă: curățare, uscare, depozitare, UV protecție, îngrijirea supapelor și instrucțiuni minore de reparație.'
      icon: tabler:tool
    - title: Ghid pentru materialele plăcilor gonflabile
      description: PVC Construcție, drop-stitch miezuri, EVA pad-uri pentru terasă și ce PSI înseamnă rigiditatea 15 pentru performanță și durabilitate.
      icon: tabler:files
    - title: Cum să începi cu SUP
      description: 'Elemente de bază pentru un vâslit începător: umflare, transport, lansare, lovituri de bază și elemente esențiale de siguranță pentru a te ridica în prima zi.'
      icon: tabler:swimming
faqs:
  title: Întrebări Frecvente
  subtitle: Întrebări frecvente despre plăcile noastre, comandă și cum să intrăm pe apă.
  columns: 2
  items:
    - title: Ce este inclus în placa mea?
      description: Fiecare pachet complet include placa, paleta reglabilă, pompa cu debit mare, lesa, kitul de reparații și rucsacul. Setul Vâslelor și Pompe este disponibil și separat.
      icon: tabler:package
    - title: Cât durează inflația?
      description: Cu pompa cu debit mare inclusă, majoritatea vâslașilor ating presiunea maximă în 8-12 minute. Pompele electrice funcționează de asemenea — doar se opresc la presiunea nominală afișată lângă suapă.
      icon: tabler:clock
    - title: Cum aleg tabla potrivită?
      description: 'Începe cu greutatea și stilul tău de vâslit: începătorii și familiile adoră platforme largi și stabile precum SUP Explorer 11; vâslașii de yoga preferă tracțiunea pe punte completă; vâslașii de tură doresc forme rigide și aerodinamice. Echipa noastră este bucuroasă să recomandă.'
      icon: tabler:help-circle
    - title: Ce metode de plată acceptați?
      description: Acceptăm carduri de credit majore, PayPal și transferuri bancare. Toate prețurile includ pachetul complet — fără extra-uri ascunse.
      icon: tabler:currency-dollar
    - title: Cât durează livrarea?
      description: Comenzile sunt expediate de la fabrica noastră și, de obicei, ajung în 5-10 zile lucrătoare, în funcție de regiunea dumneavoastră. Urmărirea este oferită pentru fiecare comandă.
      icon: tabler:truck-delivery
    - title: Este placa mea acoperită de garanție?
      description: Da — fiecare placă este acoperită împotriva defectelor de fabricație, iar fiecare unitate este testată la presiune de 1,25x presiunea sa nominală timp de 24-48 de ore înainte de a părăsi fabrica. Rata noastră de reclamații în cadrul garanției este sub 2%.
      icon: tabler:shield-check
cta:
  title: Aveți nevoie de ajutor pentru a găsi placa potrivită?
  subtitle: Contactați echipa noastră pentru sfaturi sincere privind selecția plăcii, dimensionarea sau întrebările legate de comandă.
  actions:
    - variant: primary
      text: Contactați echipa noastră
      href: /contact
