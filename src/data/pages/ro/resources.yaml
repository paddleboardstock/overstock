hero_text:
  tagline: Resurse
  title: Centrul de Descărcare & Ghiduri pentru Cumpărători
  subtitle: Accesați cataloagele de produse, OEM ghiduri, liste de verificare pentru cumpărători și documentație tehnică pentru a vă ajuta să luați decizii informate de achiziție.
features3_downloads:
  tagline: Descărcări
  title: Documentație de Produs<br />& Resurse pentru Cumpărători
  isBeforeContent: false
  columns: 2
  items:
    - title: Catalog de Produse Marine 2026
      description: Gama completă de produse, inclusiv RIB bărci, bărci gonflabile, SUP plăci, caiace și accesorii. Specificații, configurații și opțiuni. Format PDF.
      icon: tabler:file-text
    - title: OEM Ghid de Producție
      description: 'Tot ce trebuie să știți despre parteneriatele OEM/ODM: prezentarea procesului, cantități minime de comandă, opțiuni de personalizare, controlul calității și expedierea.'
      icon: tabler:building-factory
    - title: RIB Ghid pentru Cumpărătorii de Bărci
      description: 'Cum să alegeți RIB potrivit: materiale pentru carenă, materiale pentru tub, selecția motorului, considerente legate de dimensiune și opțiuni de configurare pentru diferite aplicații.'
      icon: tabler:file-description
    - title: SUP Lista de Verificare a Furnizorului
      description: 'Considerații cheie în alegerea unui producător de SUP plăci: indicatori de calitate, cerințe de certificare, considerații MOQ, și ce să căutați într-un audit de fabrică.'
      icon: tabler:clipboard-check
    - title: Ghid pentru Materialele Bărcii Gonflabile
      description: 'PVC vs Hypalon: comparație a durabilității, rezistenței la UV, durata de viață, opțiuni de reparare și considerente de cost pentru diferite aplicații marine.'
      icon: tabler:files
    - title: Șablon Brief pentru Producție Personalizată
      description: Descărcați șablonul nostru de brief de produs. Completați cerințele și returnați-ne pentru o ofertă și evaluare a fezabilității în aceeași săptămână.
      icon: tabler:template
faqs:
  title: Întrebări Frecvente
  subtitle: Întrebări comune despre produsele noastre, procesul de fabricație și modelul de parteneriat.
  columns: 2
  items:
    - title: Care este cantitatea minimă de comandă?
      description: MOQ variază în funcție de categoria produsului. Bărcile RIB încep, de obicei, de la 10 unități pe model. Plăcile SUP de la 50 unități. Contactați echipa noastră de vânzări pentru informații MOQ specifice produsului.
      icon: tabler:help-circle
    - title: Pot obține mostre înainte de a plasa o comandă?
      description: Da. Paddle Board Overstock oferă producție de mostre pentru evaluare înainte de producția în masă. Costurile mostrelor sunt negociabile și deseori se creditează la prima comandă de producție.
      icon: tabler:package
    - title: Ce termeni de plată sunt disponibili?
      description: Termenii standard sunt 30% avans la comandă, 70% înainte de expediere. Termeni LC disponibili pentru clienții eligibili. Contactați echipa noastră financiară pentru a discuta aranjamentele.
      icon: tabler:currency-dollar
    - title: Cât durează producția?
      description: 'Timp mediu de realizare: bărcile RIB 30-45 de zile, plăcile SUP 20-30 de zile, bărcile gonflabile 25-35 de zile. Dezvoltarea personalizată adaugă 15-30 de zile pentru prototipare.'
      icon: tabler:calendar-clock
    - title: Ce certificări au produsele dumneavoastră?
      description: Certificare CE pentru piețele UE, producție aprobată de US Coast Guard, sistem de calitate ISO, conformitate BSCI, și conformitate a materialelor REACH.
      icon: tabler:certificate
    - title: Oferiți ambalaje și branding personalizat?
      description: Da. Oferim ambalaje personalizate cu logo-ul, culorile și identitatea mărcii dvs. MOQ pentru ambalaje personalizate depinde de categoria produsului.
      icon: tabler:color-swatch
cta:
  title: Aveți nevoie de ajutor pentru a găsi resursa potrivită?
  subtitle: Contactați echipa noastră pentru ghidare personalizată privind selecția produselor, parteneriate OEM sau specificații tehnice.
  actions:
    - variant: primary
      text: Contactați echipa noastră
      href: /contact
