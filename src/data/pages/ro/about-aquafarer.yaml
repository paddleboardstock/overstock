factory_details:
  - label: Dimensiunea facilității
    value: Campus integrat de 12.000 m² (130.000 ft²) în Zona de Dezvoltare Economică Qingdao
  - label: Capacitate anuală
    value: 15.000 bărci, inclusiv SUPs, caiace, bărci mici, RIBs și echipamente de siguranță
  - label: Echipă R&D
    value: 25+ de ingineri în design de produs, știința materialelor și ingineria calității
  - label: Echipamente cheie
    value: Mese de tăiere CNC, sudori dielectrice RF, sigilatoare cu aer cald, imprimante digitale, matrițe din fibră de sticlă, echipamente de testare a retenției aerului
  - label: Linii de producție
    value: '6 linii dedicate: tăiere PVC, sudarea tuburilor, montarea carenei din fibră de sticlă, asamblare SUP, asamblare RIB, control final al calității'
  - label: Volum anual de export
    value: 8 milioane USD+ exportate în 50+ de țări din Europa, America, Asia-Pacific și Orientul Mijlociu
