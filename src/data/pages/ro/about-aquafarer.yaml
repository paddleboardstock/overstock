hero:
  tagline: Despre
  title: Despre {SITE}
  subtitle: Un producător de echipamente pentru sporturi acvatice cu integrare verticală — de la materie primă la barca finisată
intro:
  - 'Aquafarer a fost fondat în 2012 cu o singură misiune: să proiecteze și să producă echipamente pentru sporturi acvatice care să performeze la fel de bine pe apă precum în raportul de calitate. Ceea ce a început ca un atelier concentrat de plăci SUP s-a transformat într-o facilitate de producție integrată de 12.000 de metri pătrați în Zona de Dezvoltare Economică Qingdao, producând bărci gonflabile, RIBs, caiace, plăci SUP, echipamente de siguranță și accesorii pentru clienți din 50+ de țări.'
  - Astăzi, Aquafarer operează ca un brand de fabrică — proiectăm, inginerim, prototipăm, fabricăm și testăm totul sub același acoperiș. Această integrare verticală ne oferă control direct asupra selecției materialelor, calității construcției și termenelor de livrare. Fiecare barcă este construită de echipa noastră, pe echipamentele noastre, conform standardelor noastre.
  - Servim utilizatori recreativi, operatori comerciali, agenții guvernamentale și parteneri de brand la nivel mondial. Programele noastre OEM și ODM ajută companiile să își lanseze propriile linii de produse fără a investi în infrastructură de fabrică. Indiferent dacă aveți nevoie de un singur prototip sau de o producție completă, echipa noastră vă ghidează de la concept până la livrarea pregătită pentru apă.
