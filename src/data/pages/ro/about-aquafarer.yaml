values:
  - title: Calitate înainte de toate
    desc: Fiecare barcă care părăsește fabrica noastră trece testele obligatorii de retenție a aerului, de dezlipire a cusăturilor și de sisteme înainte de expediere.
  - title: Integrare verticală
    desc: Controlăm fiecare etapă — de la tăierea PVC până la asamblarea finală — eliminând ineficiențele contractanților și asigurând calitate constantă.
  - title: Siguranța ca standard
    desc: Certificarea CE este esențială pentru ceea ce construim. Cele 64 de modele CE-certificate respectă standardele de siguranță UE pentru utilizare recreativă și comercială.
  - title: Orientat către parteneri
    desc: Construim relații pe termen lung cu OEM, ODM și parteneri de marcă privată prin transparență, fiabilitate și creștere comună.
services:
  - title: Fabricare OEM
    desc: Construim conform specificațiilor dvs. Partajați desenele, iar echipa noastră de inginerie se ocupă de prototipare, scule și producție.
  - title: Soluții ODM
    desc: Începeți de la designurile noastre dovedite. Personalizați dimensiunea, culoarea, grafica și ambalajul pentru a crea linia dvs. unică de produse.
  - title: Marcă privată
    desc: Numele brandului dvs., logo-ul dvs., ambalajul dvs. Produsele ajung gata de vânzare cu integrare completă a brandului.
  - title: Branding personalizat
    desc: Imprimare pe pad de punte, grafica pe carenă, decalii pe tuburi și etichete personalizate — prezență consistentă a brandului pe fiecare suprafață.
certifications:
  - name: Certificare CE
    desc: Bărcile și ambarcațiunile noastre respectă Directiva UE pentru ambarcațiuni de agrement (2013/53/UE) și standardele armonizate relevante.
    scope: Bărci și ambarcațiuni
  - name: null
    desc: Sistem de management al calității certificat pentru proiectarea, fabricarea și distribuția ambarcațiunilor gonflabile.
    scope: Întreaga facilitate
  - name: null
    desc: Bărci gonflabile — cerințe de siguranță și performanță pentru bărcile gonflabile cu carenă rigidă și consolidată.
    scope: Linii RIB și gonflabile
