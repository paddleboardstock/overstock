trustSignals:
  tagline: Semnale de Încredere
  title: De ce Aquafarer este un partener de încredere
  manufacturing:
    title: Capacitate de Producție
    body: Facilitate de producție de 12.000 m² cu 200-300 de muncitori calificați și 14 ingineri R&D +. Sistem de management al calității certificat ISO 9001 ISO. Producție anuală de 15.000 de unități de ambarcațiuni gonflabile pentru 50 de + țări.
    stats:
      - label: Dimensiunea Facilității
        value: 12,000 m²
      - label: Forța de muncă
        value: 200-300
      - label: Ingineri de cercetare și dezvoltare
        value: 14+
      - label: Capacitate anuală
        value: 15,000
  quality:
    title: Angajamentul pentru Calitate
    body: De la inspectarea materialelor până la testarea finală, Aquafarer menține procese de calitate sistematice pentru a livra produse marine fiabile. Fiecare unitate trece prin testare la presiune, inspectarea cusăturilor și verificarea performanței înainte de expediere.
    items:
      - CE Certificat — 64 de modele respectă standardele de siguranță europene
      - ISO 9001:2015 — Sistem de management al calității certificat
      - UKCA Marcat — conformitatea pieței din UK
  global:
    title: Prezență Globală
    body: Aquafarer deservește clienți din mai multe piețe globale, susținând distribuitorii, mărcile de echipamente outdoor și utilizatorii profesioniști din domeniul marin în 50+ de țări din Europa, Asia-Pacific, Americi, Orientul Mijlociu și Africa.
comparison:
  tagline: Poziționarea brandului
  title: Aquafarer în piață
  position: Producător marin axat pe inginerie, care combină expertiza în ambarcațiuni gonflabile cu capacitate completă OEM/ODM, dezvoltare personalizată și 12+ ani de experiență în producția pentru export.
  strengths:
    - Expertiză în ingineria ambarcațiunilor gonflabile
    - Capacitate de fabricație completă OEM/ODM
    - Dezvoltarea și proiectarea produselor personalizate
    - Facilități de producție certificate ISO de 12.000 m²
  bestFor:
    - Utilizatori de activități recreative în aer liber care caută ambarcațiuni gonflabile de încredere
    - Operatorii maritimi care necesită echipamente de calitate comercială
    - Parteneri de brand care au nevoie de producție OEM/ODM
    - Organizații profesionale de salvare și patrulare
