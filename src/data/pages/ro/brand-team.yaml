  columns: 3
  items:
    - title: Fondator & CEO
      name: Toby Liu
      description: 15+ ani în producția marină. Anterior a condus cercetare și dezvoltare la un important producător chinez de bărci. Deține multiple brevete în proiectarea bărcilor gonflabile.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
