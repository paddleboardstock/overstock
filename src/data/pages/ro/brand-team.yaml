hero:
  tagline: Echipa noastră
  title: Oamenii din spatele Paddle Board Overstock<br />— Ingineria Libertății pe Apă
  subtitle: Fondată în 2012 în Qingdao, China, Paddle Board Overstock a fost creată de ingineri marini, oameni de știință în materiale și pasionați de sporturi nautice care au crezut în accesibilitatea la nivel mondial a ambarcațiunilor gonflabile de calitate profesională.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock fotografie completă a echipei — inginerie, producție și conducere
founding:
  tagline: Fondarea Noastră
  title: De la un Atelier de Coastă<br />la o Facilități de 12.000 m²
  subtitle: Paddle Board Overstock a fost fondată de o echipă de ingineri marini cu zeci de ani de experiență combinată în proiectarea bărcilor gonflabile, fabricarea de PVC/Hypalon și producția globală de echipamente marine.
  items:
    - title: 'Fondată: 2012'
      description: Înființată în Qingdao, China — un important centru maritim cu o bogată tradiție în construcția de nave.
      icon: tabler:calendar
    - title: 200-300 Angajați
      description: Incluzând 50+ ingineri R&D, specialiști în controlul calității și tehnicieni în producție.
      icon: tabler:users
    - title: Facilități de 12.000 m²
      description: Uzina de producție dedicată cu 6 linii de producție pentru RIBs, bărci gonflabile și plăci SUP.
      icon: tabler:building-factory
    - title: 50+ Țări Deservite
      description: Export către Europa, Americi, Orientul Mijlociu, Asia-Pacific și Africa.
      icon: tabler:globe
leadership:
  tagline: Conducere
  title: Conducere și Leadership în Inginerie
