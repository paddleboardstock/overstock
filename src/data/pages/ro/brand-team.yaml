hero:
  tagline: Echipa noastră
  title: Oamenii din spatele Paddle Board Overstock<br />— Ingineria Libertății pe Apă
  subtitle: Fondat în 2012 în Weihai, China, Paddle Board Overstock a fost creat de ingineri marini, oameni de știință în materiale și pasionați de sporturi acvatice care credeau în accesibilitatea la nivel mondial a plăcilor de paddle gonflabile de calitate profesională.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock fotografie completă a echipei — inginerie, producție și conducere
founding:
  tagline: Fondarea Noastră
  title: De la un Atelier de Coastă<br />la o Facilități de 12.000 m²
  subtitle: Paddle Board Overstock a fost fondat de o echipă de ingineri marini cu zeci de ani de experiență combinată în proiectarea de SUP gonflabile, construcția de drop-stitch și fabricația globală de echipamente pentru sporturi acvatice.
  items:
    - title: 'Fondată: 2012'
      description: Fondat în Weihai, China — un important hub maritim cu o moștenire profundă în construcția de nave.
      icon: tabler:calendar
    - title: 200-300 Angajați
      description: Incluzând 14+ ingineri de cercetare și dezvoltare, specialiști în controlul calității și tehnicieni de producție.
      icon: tabler:users
    - title: Facilități de 12.000 m²
      description: Fabrică dedicată cu 6 linii de producție pentru plăci și accesorii SUP.
      icon: tabler:building-factory
    - title: 50+ Țări Deservite
      description: Export către Europa, Americi, Orientul Mijlociu, Asia-Pacific și Africa.
      icon: tabler:globe
leadership:
  tagline: Conducere
  title: Conducere și Leadership în Inginerie
  subtitle: Echipa noastră de conducere reunește expertiză profundă în ingineria marină, comerț internațional și managementul calității.
  columns: 3
  items:
    - title: Fondator & CEO
      name: Toby Liu
      description: 15+ ani în fabricația marină. Anterior a condus departamentul de cercetare și dezvoltare la un mare producător chinez de echipamente marine. Deține multiple patente în proiectarea produselor gonflabile.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Inginer Șef
      name: Zhang Wei
      description: 20+ ani în fabricarea de polimeri și proiectarea structurilor gonflabile. Fost director tehnic la o firmă europeană de inginerie marină.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Șef R&D
      name: Chen Ming
      description: Doctor în Știința Materialelor. Specializat în tehnologia drop-stitch și procesele de sudură cu frecvență înaltă. 10+ ani în compozite textile.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director de Producție
      name: Liu Qiang
      description: 18+ ani în producția eficientă și optimizarea liniilor de fabricație. A construit sistemele de calitate din spatele ratei noastre de 99,3% fără defecte.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Manager de Calitate
      name: Wang Fang
      description: 12+ ani în controlul calității marine. Supraveghează testele de presiune, cusături și sarcină pentru fiecare lot de producție înainte de lansare.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director Vânzări și Operațiuni
      name: Helen Lee
      description: 15+ ani în comerțul electronic internațional și logistică. Expediază plăci către vâsli în 50+ de țări. Fluentă în 4 limbi.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filosofia de design
  title: Design Conducător de Inginerie<br />— Fiecare Detaliu Contează
  subtitle: Filosofia noastră de inginerie se bazează pe trei principii care ghidează fiecare produs pe care îl construim.
  list:
    - 'Fiabilitatea pe primul loc: Fiecare produs Paddle Board Overstock este testat pentru a rezista condițiilor din viața reală — de la expediții în apă rece la închirieri pe plaje tropicale. Supra-inginerizăm acolo unde contează cel mai mult.'
    - 'Precizie în Producție: Facilitățile noastre folosesc tăiere CNC, sudură cu frecvență înaltă și teste automate de presiune. Fiecare cusătură, fiecare supapă, fiecare fitting respectă specificațiile documentate.'
    - 'Inovație Continuă: Echipa noastră de Cercetare și Dezvoltare evaluează continuu materiale noi, metode de producție și îmbunătățiri de design. Nu așteptăm să apară probleme — le anticipăm.'
cta:
  title: Doriți să discutați un proiect cu echipa noastră?
  subtitle: Echipa noastră este pregătită să vă ajute să alegeți placa, accesoriile și echipamentul potrivit pentru stilul dumneavoastră de vâslit.
  actions:
