      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filosofia Designului
  title: Design Conducător de Inginerie<br />— Fiecare Detaliu Contează
  subtitle: Filosofia noastră de inginerie se bazează pe trei principii care ghidează fiecare produs pe care îl construim.
  list:
    - 'Fiabilitatea pe Primul Loc: Fiecare produs Paddle Board Overstock este testat pentru a rezista condițiilor reale — de la operațiuni de salvare în apă rece până la închirieri în stațiuni tropicale. Suprainginerăm acolo unde contează cel mai mult.'
    - 'Precizie în Producție: Facilitățile noastre folosesc tăiere CNC, sudură cu frecvență înaltă și teste automate de presiune. Fiecare cusătură, fiecare supapă, fiecare fitting respectă specificațiile documentate.'
    - 'Inovație Continuă: Echipa noastră de Cercetare și Dezvoltare evaluează continuu materiale noi, metode de producție și îmbunătățiri de design. Nu așteptăm să apară probleme — le anticipăm.'
cta:
  title: Doriți să discutați un proiect cu echipa noastră?
