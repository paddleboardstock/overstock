content_benefits:
  tagline: Beneficii ale parteneriatului
  title: De ce distribuitorii<br />Alege Paddle Board Overstock
  subtitle: Un parteneriat conceput pentru distribuitorii marini care au nevoie de aprovizionare fiabilă, marje competitive și suport profesional.
  items:
    - title: Protecția Teritoriului
      description: Drepturi exclusive sau semi-exclusive de teritoriu pentru distribuitori calificați. Cartografierea pieței și managementul conflictelor de canal pentru a-ți proteja investiția în construirea Paddle Board Overstock brandului în regiunea ta.
      icon: tabler:map-pin
    - title: Prețuri en-gros competitive
      description: Prețuri pe niveluri bazate pe angajamente anuale de volum. Structură de prețuri protejate de marjă cu garanții de preț anticipate și defalcare transparentă a costurilor (FOBpe baza Qingdao).
      icon: tabler:currency-dollar
    - title: Kit de suport pentru marketing
      description: Fotografie profesională de produs, fișe de specificații, șabloane de documentație pentru conformitate, conținut pentru social media și materiale de marketing co-branded. Actualizate anual odată cu lansările de produse noi.
      icon: tabler:photo
    - title: Instruire tehnică
      description: Instruire pentru produse pentru echipa ta de vânzări (virtuală sau la fața locului), instruire pentru mentenanță și reparații pentru tehnicienii de service, precum și ghiduri de întrebări frecvente și depanare pentru clienți.
      icon: tabler:school
    - title: Piese de schimb și post-vânzare
      description: Aprovizionare dedicată pentru piese de schimb cu livrare prioritară. Secțiuni de tub de înlocuire, supape, aripioare și kituri de reparații disponibile pentru procesarea rapidă a comenzilor. Suport pentru procesarea cererii de garanție.
      icon: tabler:tool
    - title: Documentația de conformitate
      description: 'Pachet complet de documentație de conformitate pentru piața dumneavoastră: CE DoC, date despre plăcuțele constructorului, manuale de utilizare și suport pentru înregistrarea reglementărilor. Eliminați povara de conformitate.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Ce Căutăm
  title: Distribuitor<br />Cerințe
  subtitle: Căutăm parteneri care să poată reprezenta și sprijini profesional produsele Paddle Board Overstock în teritoriul lor.
  items:
    - title: Cunoștințe despre Teritoriu și Piață
      description: Prezență stabilită în domeniul marin, sporturilor nautice sau recreației în aer liber. Înțelegerea reglementărilor locale, preferințelor consumatorilor și canalelor de distribuție pentru produsele de ambarcațiuni.
      icon: tabler:target
    - title: Experiență în Industrie
      description: Minimum 2 ani de experiență în distribuția echipamentelor marine, outdoor sau sportive. Cazier demonstrabil cu branduri internaționale și operațiuni en-gros B2B.
      icon: tabler:briefcase
    - title: Showroom sau Depozit
      description: Facilitate fizică pentru expunerea produselor, stocarea inventarului și serviciul clienți. Capacitatea de a menține unități demo și piese de schimb în inventar pentru teritoriul dumneavoastră.
      icon: tabler:building-store
    - title: Angajament față de Standardele Brandului
      description: Disponibilitatea de a menține standardele de prezentare ale brandului Paddle Board Overstock, de a oferi suport clienților conform protocoalelor noastre de servicii și de a participa la actualizările anuale de training pentru produse.
      icon: tabler:star
content_process:
  tagline: Procesul de Aplicare
  title: Dealer în 4 Pași<br />Procesul de Aplicare
  subtitle: De la cererea inițială până la prima livrare — un proces simplu de integrare.
  steps:
    - number: '01'
      title: Cerere Inițială & Calificare
      description: Trimiteți cererea de distribuitor cu detaliile companiei, teritoriul de interes, liniile de produse actuale și estimările volumului anual. Verificăm în termen de 5 zile lucrătoare.
      timeline: 5 zile
    - number: '02'
      title: Revizuirea Afacerii & Termeni
      description: Întâlnire virtuală pentru a discuta strategia teritoriului, nivelurile de preț și termenii parteneriatului. Revizuirea cerințelor de documentație pentru conformitate pentru piața dumneavoastră. Semnarea NDA dacă este necesar.
      timeline: 1-2 săptămâni
    - number: '03'
      title: Comandă de Mostră & Evaluare
      description: Plasați o comandă inițială de mostre (2-5 unități) la preț de distribuitor pentru evaluarea pieței și instruirea echipei. Include documentația completă de conformitate și pregătirea demo.
      timeline: 30-45 zile
    - number: '04'
      title: Lansarea Parteneriatului & Suport
      description: Prima comandă de container cu protecția teritoriului activată. Kitul de marketing livrat, echipa de vânzări instruită și manager de cont dedicat desemnat. Revizuiri continue ale afacerii la fiecare trimestru.
      timeline: În Derulare
content_application_docs:
  tagline: Documente de Aplicare
  title: Documente Necesare<br />pentru Aplicarea ca Dealer
  subtitle: Pentru a aplica pentru un dealership Paddle Board Overstock, vă rugăm să pregătiți următoarele documente și informații pentru echipa noastră de revizuire.
  items:
    - title: Certificat de înregistrare a afacerilor
      description: Document valabil de înregistrare a companiei care arată numele entității legale, adresa înregistrată și domeniul de activitate care acoperă distribuția de echipamente maritime, sportive sau în aer liber.
      icon: tabler:file-text
    - title: Planul de Acoperire a Teritoriului
      description: Teritoriul geografic de interes, rețeaua de retail sau distribuție existentă, segmentele țintă de clienți și volumul anual propus pe categorii de produs (RIB, SUP, caiac).
      icon: tabler:map
    - title: Capacitatea showroom-ului sau depozitului
      description: Facilitate fizică pentru expunerea produselor, depozitarea stocurilor și serviciul clienți. Fotografii sau planuri care arată zona demonstrativă și capacitatea de depozitare a pieselor de schimb.
      icon: tabler:building
    - title: Declarația de capacitate financiară
      description: 'Referință bancară sau situație financiară care confirmă capacitatea de a plasa comanda inițială de containere și de a menține stocurile. Comandă minimă inițială: un container de 20ft (10-20 de unități modele mixte).'
      icon: tabler:coin
    - title: Capacitatea de suport post-vânzare
      description: Tehnicieni de service, instruiți sau pregătiți pentru întreținerea și reparația bărcilor gonflabile. Capacitate de procesare a cererilor de garanție și angajament de inventar pentru piese de schimb.
      icon: tabler:tool
    - title: Referințe anterioare de marcă
      description: Listă a mărcilor actuale sau anterioare de echipamente marine/sportive distribuite. Referințe de contact disponibile pe bază de acord reciproc. Startup-urile fără experiență anterioară în distribuție pot beneficia de un angajament financiar mai puternic.
      icon: tabler:users
faq:
  title: Programul de reprezentanță — Întrebări frecvente
  questions:
    - q: Care este cantitatea minimă de comandă pentru distribuitori?
      a: Distribuitorul MOQ începe de la 10-20 de unități pe comandă, cu flexibilitate pentru modele mixte (RIB, gonflabil, SUP). Comenzile inițiale de probă de 2-5 unități sunt disponibile la prețurile distribuitorilor pentru evaluarea pieței.
    - q: Oferiți drepturi exclusive de teritoriu?
      a: Drepturile exclusive de teritoriu sunt disponibile pentru distribuitorii calificați care îndeplinesc angajamentele anuale de volum și mențin standardele de brand. Sunt disponibile și aranjamente semi-exclusive și non-exclusive pentru piețele emergente.
    - q: Ce suport de marketing oferiți?
      a: Oferim un kit de marketing cuprinzător, incluzând fotografii profesionale de produs, fișe de specificații, șabloane de documentație pentru conformitate, bibliotecă de conținut pentru rețelele sociale și materiale co-branduite. Actualizate anual cu lansări noi de produse.
    - q: Cum sunt gestionate cererile de garanție?
      a: 'Distribuitorii acționează ca primul punct de contact pentru cererile de garanție. Oferim criterii clare de garanție, protocoale de documentare foto și înlocuire rapidă sau procesare a creditului. Termeni ai garanției: limită de 5 ani pentru material/cusături/carena tuburilor de barcă; 2 ani SUP de asigurare și accesorii.'
    - q: Pot să cumpăr produse cu marcă Paddle Board Overstock privată sub propria mea marcă?
      a: Da, prin OEMprogramul nostru /ODM. Opțiunile pentru etichetă privată includ grafică personalizată pentru tuburi, branding pentru console, ambalaje retail și documentație de conformitate sub numele brandului tău. Vezi OEMpagina noastră /ODM services pentru detalii.
    - q: Ce documentație de conformitate este inclusă pentru distribuitori?
      a: Fiecare expediere include CE DoC specific modelului, date despre plăcuțele constructorului, manuale de utilizare și documentație de transport. De asemenea, oferim suport pentru înregistrarea reglementărilor pentru teritoriul dumneavoastră și vă asistăm cu orice cerințe locale de conformitate.
