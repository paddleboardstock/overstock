hero:
  tagline: Prezență Globală
  title: Servind 50+ de țări<br />Pe toate continentele
  subtitle: De la operatori de patrulă costieră din Europa la distribuitori de sporturi nautice din Australia și echipe de salvare din Orientul Mijlociu — bărcile Aquafarer sunt pe apă în întreaga lume.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer fabricare și distribuție marină globală
stats:
  title: Acoperire Globală
  stats:
    - title: Țări
      amount: 50+
    - title: Piețe de export
      amount: Europa, Americi, Asia, Orientul Mijlociu, Oceania
    - title: Producție
      amount: Qingdao, China
    - title: Depozit în SUA
      amount: Montclair, CA
features3_markets:
  tagline: Piețe Cheie
  title: Expertiză Regională<br />pentru Cerințe Locale
  subtitle: Înțelegem că diferite piețe au cerințe de reglementare, preferințe și cazuri de utilizare diferite.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa & Regatul Unit
      description: Produse certificate CE care respectă standardele EN ISO 6185. Cerere mare pentru RIBs, bărci pneumatice și plăci SUP pe piețele din UE. Distributorii din Regatul Unit apreciază timpul nostru scurt de livrare.
      icon: tabler:map-pin
    - title: America de Nord
      description: Producție aprobată de US Coast Guard. Depozit în SUA în Montclair, CA pentru livrare rapidă pe Coasta de Vest. Cerere în creștere pentru bărci de pescuit, ambarcațiuni de salvare și SUPs recreative.
      icon: tabler:map-pin
    - title: Australia și Oceania
      description: Piață puternică pentru bărci RIB și bărci pneumatice. Distribuitorii australieni apreciază bărcile noastre Hypalon pentru rezistența UV în condiții de soare intens. Expediere rapidă din facilitățile noastre din Asia.
      icon: tabler:map-pin
    - title: Orientul Mijlociu
      description: Cerere în creștere pentru bărci de patrulare și salvare. RIBs cu cârma din aluminiu sunt populare în rândul operatorilor de coastă și de securitate. Configurații personalizate pentru medii cu temperaturi ridicate.
      icon: tabler:map-pin
features3_distribution:
  tagline: Rețea de Distribuție
  title: Parteneriat cu Distribuitorii<br />La Nivel Mondial
  subtitle: Colaborăm cu distribuitori de echipamente marine consacrați, OEM branduri și agenții guvernamentale de achiziții.
  isBeforeContent: false
  columns: 3
  items:
    - title: Parteneriate OEM/ODM
      description: Producție sub marcă privată pentru branduri globale de sporturi acvatice. Ne ocupăm de tot, de la design la producție și livrare directă.
      icon: tabler:building
    - title: Rețea de distribuitori
      description: Distribuitori autorizați în 20+ de țări păstrează stocuri și oferă suport local. Cererile pentru noi distribuitori sunt binevenite.
      icon: tabler:users
    - title: Guvern și instituții
      description: Furnizare directă către paze de coastă, organizații de căutare și salvare și programe de achiziții militare. Conformitate cu cerințele de achiziții instituționale.
      icon: tabler:building-community
steps2_logistics:
  title: Logistică și suport global
  subtitle: De la fabrică la destinație — gestionăm întregul lanț de aprovizionare.
  items:
    - title: Opțiuni de transport
      description: Transport maritim (FOB Qingdao), transport aerian pentru comenzi urgente și curier expres pentru mostre și piese de schimb.
      icon: tabler:truck-delivery
    - title: Depozit în SUA
      description: 'Stoc păstrat în Montclair, CA pentru livrare rapidă în întreaga Americă de Nord. Coasta de Vest: 2-3 zile, Central: 3-4 zile, Coasta de Est: 4-5 zile.'
      icon: tabler:building-warehouse
    - title: Piese de schimb
      description: Piese de schimb și consumabile originale Aquafarer disponibile pe tot parcursul anului. Piesele comune se expediază în 24 de ore.
      icon: tabler:package
    - title: Suport tehnic
      description: Linie directă cu echipa noastră de inginerie pentru întrebări tehnice, sfaturi de reparație și suport de refit. Oferim suport pentru bărcile pe care le-am construit acum 20 de ani.
      icon: tabler:headset
cta:
  title: Doriți să deveniți distribuitor?
  subtitle: Ne extindem activ rețeaua de distribuție. Contactați echipa noastră de export pentru a discuta oportunități de parteneriat.
  actions:
    - variant: primary
      text: Cerere de parteneriat
      href: /contact
    - text: Vizualizați gama noastră de produse
      href: /products
