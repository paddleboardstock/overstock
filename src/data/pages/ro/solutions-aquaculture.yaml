content_challenge:
  tagline: Provocarea
  title: Cerinte ale acvaculturii<br />Echipamente rezistente la apă sărată
  subtitle: Fermele de pești, fermele de perle și fermele oceanice operează în cel mai chimic agresiv mediu marin — expunere prelungită la apă sărată, reziduuri de combustibil și furaje, și utilizare continuă zilnică.
  paragraphs:
    - Operațiunile de acvacultură funcționează 365 de zile pe an în medii costiere și offshore expuse. Bărciile de lucru utilizate pentru inspectarea cuștilor, transportul furajelor, întreținerea liniilor de perle și repararea echipamentelor se confruntă cu imersiune constantă în apă sărată, expunere UV și contact chimic cu combustibili, furaje pentru pești și tratamente anti-fouling.
    - '**Coroziunea este principalul inamic** — Echipamentele marine standard se deteriorează rapid în aceste condiții. Motoarele, cadrele de remorcă și accesorii ale corpului bărcii necesită înlocuire constantă. Operatorii au nevoie de bărci construite din materiale rezistente la coroziune, care să reziste ani de zile în acest mediu fără a se degrada.'
    - '**Fiabilitatea zilnică este critică** — O barcă de lucru defectă înseamnă întârzieri la hrănire, recoltări întârziate și pierderi costisitoare de producție. Pentru fermele de perle, o singură zi de inspectare ratată poate însemna pagube semnificative ale recoltei. Pentru fermele de pești, hrănirea întârziată afectează ratele de creștere și profitabilitatea.'
    - Paddle Board Overstock bărci de acvacultură RIBs sunt proiectate cu elemente rezistente la coroziune, tuburi de mare rezistență Hypalon și corpuri întărite, concepute special pentru condițiile exigente ale creșterii peștilor, cultivării perlelor și operațiunilor în ferme oceanice.
content_solution:
  tagline: Soluția noastră
  title: Conceput special RIBs<br />Pentru industria acvaculturii
  subtitle: Fiecare Paddle Board Overstock barcă de lucru pentru acvacultură este proiectată să reziste în medii saline agresive oferind în același timp performanță zilnică fiabilă.
  list:
    - Tuburi de calitate marină Hypalon — rezistență superioară la UV, apă sărată, combustibili și chimicale din furaje pentru pești
    - Elemente de fixare din oțel inoxidabil 316 pe tot parcursul — fără rugină în expunere prelungită la apă sărată
    - Straturi de protecție și protecție a chila întărite pentru contact repetat cu doc și cuști
    - Punte auto-descărcătoare pentru spălare și drenaj ușor după transportul furajelor și operațiunile de recoltare
    - Configurație plată pentru transportul sacilor de furaje, containere de recoltare și echipamente
    - Configurații exterioare de la 15 HP la 60 HP — optimizate pentru sarcină utilă versus eficiența consumului de combustibil
    - Opțiuni de culoare cu tuburi vizibile pentru a fi ușor de observat pe zone mari de fermă
content_segments:
  tagline: Profiluri de acvacultură
  title: Soluții pentru bărci de lucru<br />După tipul de acvacultură
  subtitle: Diferite operațiuni de acvacultură au cerințe diferite pentru bărci de lucru — de la mici și agile RIBs pentru inspecția cuștilor de pește, până la platforme stabile de transport pentru creșterea perlelor și bărci de lucru grele pentru creșterea animalelor oceanice.
  items:
    - title: Operațiuni de piscicultură
      subtitle: Inspecția cuștilor, transportul furajelor, suport pentru recoltare
      description: Fermele marine de pești operează cuști în locații expuse de coastă și offshore. Bărcile de lucru sunt folosite zilnic pentru inspecția plaselor de cușcă, operațiuni de hrănire, sprijin pentru recoltare și întreținerea echipamentelor. Principala provocare este coroziunea — bărcile sunt constant expuse la apă sărată, reziduuri de hrană pentru pești și combustibil. O barcă de lucru fiabilă este esențială deoarece hrănirea ratată sau recoltarea întârziată afectează direct producția și profitabilitatea.
      features:
        - 'Pachet pentru mediu agresiv: feronerie din oțel inoxidabil 316, componente din aliaj de calitate marină'
        - Amenajarea punții plate pentru transportul sacului de furaje și al containerelor de recoltă
        - Punte auto-saliabilă pentru o spălare ușoară după operațiuni
        - Hypalon tuburi cu strat rezistent la substanțe chimice pentru expunerea la alimentare și combustibil
        - Benzi de frecare întărite pentru contact frecvent în cușcă și doc
    - title: Operațiunile de cultivare a perlelor
      subtitle: Transport stabil pentru inspecția și recoltarea liniilor de perle
      description: Fermele de perle necesită bărci de lucru stabile și fiabile pentru transportul zilnic între liniile de perle, inspecția plaselor de stridii și colectarea recoltării. Aceste operațiuni se desfășoară în locații îndepărtate de coastă, cu infrastructură de întreținere limitată. Barca trebuie să fie suficient de stabilă pentru ca echipajul să poată lucra în timp ce inspectează liniile de perle, cu o abordare ușoară și spațiu generos pe punte pentru transportul stridiilor, plaselor și proviziilor. Fiabilitatea și întreținerea ușoară sunt esențiale în locațiile izolate ale fermelor.
      features:
        - Proiectarea carenei stabile pentru echipajul în picioare în timpul inspecției liniei de perle
        - Punte plată cu suprafață antiderapantă pentru deplasarea în siguranță a echipajului
        - Bordaj liber redus pentru plase de stridii și acces ușor la recoltare
        - Configurație simplă exterioară pentru o întreținere ușoară la fața locului
        - Tub rezistent la coroziune și pachet hardware pentru expunere continuă la apă sărată
    - title: Creșterea animalelor oceanice și îmbunătățirea marină
      subtitle: Transport juvenil, întreținere în cuști, suport pentru monitorizare
      description: Operațiunile de creștere a animalelor oceanice implică eliberarea animalelor juvenile în medii marine gestionate, monitorizarea creșterii și deservirea structurilor de îmbunătățire. Bărcile de lucru trebuie să transporte animale juvenile vii în containere aerate, să transporte echipamente de monitorizare și să acceseze locurile de eliberare de coastă puțin adânci. Designul carenei trebuie să echilibreze capacitatea de transport cu pescaj mic pentru accesul la plajă și estuar.
      features:
        - Spațiu pe punte pentru containere de transport aerat pentru tineri și echipamente de monitorizare
        - Pescaj mic pentru accesul la plajă și la zona de eliberare a estuarului
        - Debarcare ușoară pe plajă — protecție consolidată a chilei și a provei
        - Puncte de montare a echipamentelor pentru monitorizarea electronicelor și echipamentelor de eșantionare
        - Tuburi Hypalon rezistente pentru durabilitate în condiții de nisip amestecat și apă de mare
