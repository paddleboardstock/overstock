hero:
  tagline: Plăci en-gros SUP
  title: Plăci de paddle gonflabile en-gros<br />pentru întreprinderi mici
  subtitle: SUP Panouri noi de suprastoc în cantități prietenoase cu afacerile mici. Comandă 5–20 de plăci, amestecă orice model într-o singură livrare și alege transport expres aerian sau maritim către 50+ de țări.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Plăci gonflabile en-gros SUP Paddle Board Overstock gata de expediere
direct_answer: Paddle Board Overstock Furnizează plăci gonflabile noi SUP în stoc către retaileri mici din întreaga lume. Nu există o comandă minimă mare — o comandă en-gros începe de la doar 5 plăci și poți amesteca orice model disponibil într-o singură comandă. Plăcile sunt expediate de la baza noastră din Weihai, China, prin transport aerian expres (1–3 plăci, mostre sau reaprovizionări urgente) sau transport maritim consolidat (5–20 comenzi de la comercianți de plăci). Fiecare placă este testată 100% la presiune înainte de expediere și este acoperită de Garanția noastră de 2 ani SUP .
tldr_points:
  - 'Low MOQ: comenzile en-gros încep de la 5 scânduri — dimensiuni pentru magazine mici, nu pentru containere'
  - 'Comenzi mixte de modele: combinați orice modele aflate pe stoc SUP într-o singură livrare'
  - 'Două opțiuni de transport: transport aerian expres pentru 1–3 borduri, transport maritim pentru 5–20 de comenzi de îmbarcare'
  - 'Material nou-nouț: 100% testat la presiune, rată de promovare a inspecției finale de 99,3%, SUP garanție de 2 ani'
why_retailers:
  title: De ce retailerii mici aleg plăcile de suprastocare SUP
  subtitle: Nu ai nevoie de un depozit sau un buget pentru containere ca să cumperi la prețuri en-gros.
  items:
    - title: Cantități prietenoase cu afacerile mici
      description: En-gros tradițional cere sute de unități pe comandă. Modelul nostru de suprastoc este construit pentru magazine independente — începe cu 5 plăci și crește comanda pe măsură ce magazinul tău crește.
    - title: Prețuri reale en-gros fără angajamentul de volum
      description: Pentru că vindem stocuri excedentare — producție excedentară și stocuri atent selectate de la fabrici partenere selectate — obțineți prețuri unitare la nivel de volum fără riscul la nivel de volum.
    - title: Combină modelele pentru a se potrivi clienților tăi
      description: Magazinele de plajă, magazinele de pe lacuri și magazinele din oraș servesc diferiți vâslași. Combină modele all-around, turing și surf SUP într-o singură comandă, astfel încât raftul tău să corespundă cererii locale.
    - title: Nou-nouț, niciodată folosit
      description: Fiecare placă din stocul nostru excedentar este nouă și nefolosită — nu secunde, nu returnate. Fiecare placă este testată 100% la presiune înainte să părăsească depozitul.
    - title: Transport internațional rapid și flexibil
      description: Transportul aerian expres primește rapid 1–3 comenzi de platou sau mostre la ușa ta; Transportul maritim consolidat menține costul per bord scăzut la 5–20 de comenzi de la comercianți de la board.
    - title: Susținut de o garanție reală
      description: En-gros nu înseamnă nesuportat. Fiecare SUP placă oferă Garanția noastră de 2 ani SUP , aceeași acoperire pe care o oferim fiecărui client din 50+ de țări.
pricing_section:
  tagline: Prețuri en-gros
  title: Prețuri en-gros simple și transparente
  subtitle: Prețurile sunt oferite pe comandă în funcție de modele, cantități și metoda de livrare pe care o alegi. Fără taxe ascunse — oferta pe care o primești este prețul pe care îl plătești.
  points:
    - title: Nivelate după cantitate
      description: Prețurile unităților scade pe măsură ce dimensiunea comenzii crește. O comandă cu 10 consilii costă mai bine pe consiliu decât una cu 5 consilii; o comandă cu 20 de consilii este și mai bună.
    - title: Modelele mixte contează pentru un total
      description: Nivelul tău de reducere se bazează pe numărul total de plăci din comandă — nu pe model. Combinarea a 4 modele diferite × 3 plăci fiecare se consideră o comandă de 12 plăci.
    - title: Ofertat cu opțiuni de transport
      description: Fiecare ofertă include atât opțiuni de transport expres, cât și maritim cu timpi estimați de tranzit, astfel încât să poți alege echilibrul viteză-cost care se potrivește cu calendarul tău de reaprovizionare.
    - title: Nu este necesar cont sau membru
      description: Nu există un club en-gros la care să te înscrii și nici o taxă anuală. Solicită o ofertă, confirmă comanda și trimitem.
inventory_section:
  tagline: Inventarul actual
  title: Produse disponibile și inventar curent
  subtitle: Toate cele 11 produse de mai jos sunt stocuri excedentare actuale. Condițiile sunt complet noi; nivelurile stocului se schimbă săptămânal, așa că confirmă disponibilitatea în cererea ta de ofertă.
  table_labels:
    product: Model
    condition: Starea
    price: Prețul de vânzare cu amănuntul
    action: Contactaţi-ne
    condition_value: Nou
    note: Prețul de retail este afișat pentru referință. Prețul unitar en-gros este cotat pe comandă și este mai mic decât cel de retail.
who_section:
  tagline: Pe cine furnizăm
  title: Construit pentru afaceri independente de sporturi acvatice
  items:
    - title: Plajă și magazine de surf
      description: Retaileri mici de coastă care au nevoie de 5–15 plăci pe sezon, amestecate între modele complete pentru turiști și plăci de tip surf pentru localnici.
    - title: Vânzători online
      description: Magazinele online și vânzătorii de pe marketplace testează SUP categoria fără a se angaja la un container complet al unui singur model.
    - title: Flote și școli de închiriere
      description: Operațiunile de închiriere și SUP școlile completează flotele — plăci durabile, modele mixte pentru a deservi clienți de diferite dimensiuni și rezervă în garanție.
    - title: Resorturi și operatori de turism
      description: Hotelurile, stațiunile insulare și operatorii de turism își SUP completează activitatea cu flote inițiale mici și reaprovizionare sezonieră ușoară.
how_to_order:
  tagline: Cum Funcționează
  title: Cum să plasezi o comandă en-gros
  steps:
    - title: Răsfoiește inventarul
      description: Revizuiește cele 11 modele disponibile mai sus sau folosește selectorul de modele mixte pentru a schița o combinație care să se potrivească clienților tăi.
    - title: Solicitați o cotație
      description: Trimiteți-ne modelele, cantitățile estimate, țara dumneavoastră și viteza preferată de livrare folosind formularul de solicitare de mai jos. Răspundem cu prețuri unitare și opțiuni de livrare.
    - title: Confirmă și Plătește
      description: Aprobă cotația finală — modele, cantități, metoda de transport și totalul. Termenii de plată sunt confirmați la momentul cotației.
    - title: Testăm, Ambalăm și Expediam
      description: Fiecare placă este testată 100% la presiune, ambalată cu kitul său complet de accesorii și expediată din Weihai. Primești urmărirea pentru întregul parcurs.
