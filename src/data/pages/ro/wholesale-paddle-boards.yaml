faq_section:
  title: Întrebări Frecvente en-Gros
  items:
    - q: Care este comanda minimă en-gros?
      a: Cinci plăci. Modelul nostru de surplus este conceput pentru mici retaileri — nu trebuie să completați un container pentru a beneficia de prețuri en-gros.
    - q: Pot combina diferite modele SUP într-o singură comandă en-gros?
      a: Da. Comenzile cu modele mixte sunt unul dintre cele mai mari avantaje ale achiziționării stocului în exces — combinați orice modele disponibile într-o singură expediere, iar numărul total de plăci determină nivelul de preț. Vezi pagina noastră despre vânzarea en-gros a modelelor mixte pentru detalii.
    - q: Plăcile sunt noi-nouțe?
      a: Da. Fiecare placă este nou-nouță, stoc nefolosit — niciodată recondiționate, recondiționate sau returnări de clienți. Fiecare placă este testată 100% la presiune înainte de expediere.
    - q: Cât de ieftin este en-gros decât retailul?
      a: Prețul unitar en-gros este cotat pe comandă pe baza modelelor și cantităților și este semnificativ sub prețurile de retail enumerate mai sus. Solicitați o ofertă pentru mixul țintă și vom stabili exact prețul.
    - q: Ce metodă de livrare ar trebui să aleg?
      a: Transportul aerian expres se potrivește cu 1–3 scânduri, mostre și reaprovizionări urgente. Transportul maritim consolidat este alegerea economică pentru 5–20 de comenzi de la comercianți de board. Oferim oferte ambelor opțiuni la fiecare solicitare.
    - q: Ce garanție oferă plăcile en-gros?
      a: Aceeași SUP garanție de 2 ani pe care o oferim fiecărui client, în fiecare dintre cele 50+ de țări în care expediem.
    - q: Trimiți în țara mea?
      a: În prezent expediem în peste 50 de țări, cu ghiduri regionale pentru America Latină, Asia de Sud-Est, Africa, Orientul Mijlociu și piețe cheie precum Mexic, Brazilia, Filipine, Indonezia, Thailanda, Africa de Sud, Kenya și Emiratele Arabe Unite. Solicitați în cererea de ofertă și vom confirma serviciul curent la adresa dumneavoastră.
