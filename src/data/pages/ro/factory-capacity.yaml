hero:
  tagline: Capacitate de producție
  title: Capacitatea de producție și producția anuală
  subtitle: Facilitate de 12.000 m² care produce 15.000 de plăci pe an cu posibilitate de extindere
intro: Paddle Board Overstock operează una dintre cele mai mari facilități dedicate fabricării de plăci gonflabile SUP din Weihai, China. Fabrica noastră de 12.000 m² este organizată în șase ateliere specializate care funcționează în paralel, oferindu-ne capacitatea de a produce anual 15.000 de plăci în liniile all-around, touring și art-series SUP.
highlights:
  - value: 12,000 m²
    label: Totalul planului de producție
    detail: Pe parcursul a 6 ateliere specializate
  - value: 15,000
    label: Plăci produse anual
    detail: All-around, touring & art-series SUPs
  - value: 200-300
    label: Forță de muncă calificată
    detail: 25+ de ingineri, 2 ture pe zi
  - value: 50+
    label: Țări de export
    detail: UE, SUA, AU, Orientul Mijlociu, Asia
  - value: 2-3
    label: Zile lucrătoare pentru expediere
    detail: Comenzile din stoc părăsesc rapid Weihai
  - value: 10+
    label: Ani de experiență în export
    detail: Din 2012
workshops:
  - title: SUP Producția plăcilor
    description: '4 linii de asamblare paralele pentru plăci gonflabile SUP . Fiecare linie poate produce între 50 și 80 de plăci pe tură. Stațiile de imprimare digitală și serigrafie funcționează simultan. SUP Capacitate anuală: 8.000+ de plăci.'
    output: 8.000+ SUPs/an
  - title: Artă pe punte & EVA Finisare
    description: Atelier dedicat finisării plăcilor art-series. Tăiere de precizie EVA, modele de deck realizate manual și finisare finală. Capacitatea anuală acoperă întreaga gamă art-series.
    output: Întreaga gamă art-series
  - title: Drop-Stitch Laminare
    description: 'Liniile de laminare la cald leagă miezurile drop-stitch de laminatele exterioare PVC. Benzile laterale sunt lipite prin fuziune în trei straturi pentru o rezistență etanșă. Capacitate anuală: 15.000 miezuri+.'
    output: 15.000 miezuri+/an
  - title: Accesorii și ambalare
    description: Linii de asamblare și ambalare pentru pompe, vâsle, leashes și kituri de reparare. Plăcile sunt ambalate în vid, puse în cutii și paletizate pentru expediere mondială.
    output: Pachete complete, gata de expediere
