hero:
  tagline: Capacitate de producție
  title: Capacitatea de producție și producția anuală
  subtitle: O facilitate de 12.000 m², producând 15.000 de bărci pe an, cu spațiu de scalare
intro: Paddle Board Overstock operează una dintre cele mai mari facilități dedicate producției de bărci gonflabile din Qingdao, China. Fabrica noastră de 12.000 m² este organizată în șase ateliere specializate care funcționează în paralel, oferindu-ne capacitatea de a produce anual 15.000 de bărci pe SUPlinii de caiace, dinghy RIBși echipamente de siguranță.
highlights:
  - value: 12,000 m²
    label: Totalul planului de producție
    detail: Pe parcursul a 6 ateliere specializate
  - value: 15,000
    label: Bărci produse anual
    detail: SUPs, caiace, RIBs, dinghies, echipament de siguranță
  - value: 200-300
    label: Forță de muncă calificată
    detail: 25+ de ingineri, 2 ture pe zi
  - value: 50+
    label: Țări de export
    detail: UE, SUA, AU, Orientul Mijlociu, Asia
  - value: 30–45
    label: Timp standard de livrare (zile)
    detail: De la confirmarea oficială până la FOB
  - value: 10+
    label: Ani de experiență în export
    detail: Din 2012
workshops:
  - title: SUP Producția plăcilor
    description: '4 linii de asamblare paralele pentru plăci gonflabile SUP . Fiecare linie poate produce între 50 și 80 de plăci pe tură. Stațiile de imprimare digitală și serigrafie funcționează simultan. SUP Capacitate anuală: 8.000+ de plăci.'
    output: 8.000+ SUPs/an
  - title: RIB Producția bărcilor
    description: 'Atelier dedicat pentru carenă din fibră de sticlă cu 6 stații de matriță pentru RIB carene de până la 7,6 m. Sudarea tuburilor și zona de asamblare se ocupă simultan de 3–5 RIBs nave. RIB Capacitate anuală: 2.000+ de bărci.'
    output: 2.000+ RIBs/an
  - title: Barcă gonflabilă și dinghy
    description: 'Linii de producție multifuncționale pentru bărci gonflabile, caiace și bărci mici. Stațiile de sudură cu aer cald, presele dielectrice RF și stațiile de asamblare sunt reconfigurate în funcție de mixul comenzilor. Capacitate anuală: 5.000+ de unități.'
    output: 5.000+ de unități/an
  - title: Echipament de siguranță
    description: 'Zonă separată de producție în cameră curată pentru veste de salvare și echipamente de siguranță. Stații dedicate pentru cusut, inserție din spumă și testare. Capacitate anuală a vestelor de salvare: 50.000+ de unități.'
    output: 50.000+ de veste de salvare/an
oem_capacity:
  moq: 'SUP: 5–10 unități | RIB: 2–5 unități | Caiac/Dinghy: 10–20 unități | Matriță personalizată: 200 unități+'
  lead_time: 'Standard 30–45 de zile. Exemplu: 15–20 de zile. Rush disponibil.'
  payment: T/T avans 30% + 70% înainte de expediere. L/C, Western Union acceptate.
