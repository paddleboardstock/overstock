testimonial:
  quote: Ceea ce m-a convins a fost construcția. Cusături sudate prin fuziune în loc de lipici, un miez drop-stitch care se simte solid la 15 PSI și fără balans când fac un pas înapoi să mă întorc. Două ani mai târziu, zero probleme.
  author: Marta Keller
  title: Cumpărător verificat
  company: Călător cu caiacul pe lac
  location: Germania
sections:
  - title: Drop-Stitch Miez
    standard: Presiune de operare 12-15 PSI
    description: Mii de fire interne de poliester conectează straturile superioare și inferioare, creând o structură rigidă la 12-15 PSI. Aceasta este aceeași tehnologie folosită la plăcile de paddle profesionale. Densitatea noastră drop-stitch este optimizată pentru fiecare model pentru echilibrul ideal între rigiditate și greutate.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagramă Nucleu DS
  - title: Material Marin PVC
    standard: Sudare prin fuziune | UV / apă sărată / testat la abraziune
    description: Material laminat multi-strat PVC evaluat pentru medii marine. Fiecare strat este sudat prin fuziune în loc de lipit, eliminând riscurile de delaminare. Testat pentru rezistență la UV (1.000+ ore), coroziune la apă sărată și abraziune.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Strat PVC
  - title: Sistem de punte EVA
    standard: Modele art-series confortabile și aderente
    description: Spuma integrală de pe punte EVA oferă aderență, amortizare și aspectul caracteristic al seriei art. Panourile precis tăiate sunt așezate în modele fără cusături — nicio grafică tipărită care să se zgârie, nicio ceară necesară.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Punte EVA
  - title: Sistem de șină cu trei straturi
    standard: Lipire prin fuziune | Supraconstruite în zona cu cea mai mare tensiune
    description: Benzile de pe margine sunt lipite prin fuziune în trei straturi și înfășurate în jurul marginii plăcii — zona cu cea mai mare tensiune a oricărei plăci gonflabile. Aceasta este zona unde plăcile ieftine cedează prima; ale noastre sunt supraconstruite.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistemul de margine
