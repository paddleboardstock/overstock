testimonial:
  quote: Ceea ce diferențiază Paddle Board Overstock este știința lor a materialelor. Ei nu doar asamblează componente — ei proiectează compușii PVC, parametrii de sudură și stratificarea structurală în interior. Această integrare verticală se reflectă în produsul final.
  author: David Park
  title: Manager Dezvoltare Produse
  company: Bluewater Sports Equipment
  location: Australia
sections:
  - title: Drop-Stitch Nucleu
    standard: Presiune de operare 12-15 PSI
    description: Mii de fibre interne de poliester conectează straturile superioare și inferioare, creând o structură rigidă la 12-15 PSI. Aceasta este aceeași tehnologie folosită în plăci de paddle profesionale și bărci gonflabile de competiție. Densitatea drop-stitch este optimizată pe model pentru echilibrul ideal între rigiditate și greutate.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagramă Nucleu DS
  - title: Material Marin PVC
    standard: Sudare prin fuziune | UV / apă sărată / testat la abraziune
    description: Material textil laminat multi-strat PVC evaluat pentru medii marine. Fiecare strat este sudat prin fuziune în loc de lipit, eliminând riscurile de delaminare. Testat pentru rezistență la UV (ASTM G154, 1.000 + ore), coroziunea apei sărate (ISO 9227) și abraziune (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Strat PVC
  - title: Tuburi Hypalon
    standard: Gumă CSM | UV / rezistent la chimicale / temperaturi extreme
    description: Folosit pe modelele RIB, guma Hypalon (CSM) oferă rezistență superioară la UV și chimicale comparativ cu PVC standard. Tuburile Hypalon își mențin flexibilitatea la temperaturi extreme și rezistă degradării cauzate de expunerea la combustibil și ulei. Toate cusăturile sunt realizate manual de tehnicieni certificați.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Podea Air Deck
    standard: Inflabil cu presiune înaltă | Înlocuiește placajul/aluminiul
    description: Sistem de podea inflabil cu presiune înaltă care înlocuiește podelele tradiționale din placaj sau fâșii de aluminiu. Reduce timpul de instalare, greutatea totală și volumul de depozitare, oferind în același timp rigiditatea adecvată pentru a sta, a pescui și a merge. Testat pentru a suporta o sarcină distribuită de 200 kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Podea cu aer
