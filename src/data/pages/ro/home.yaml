content_customer_types:
  tagline: Cui Deservim
  title: Conceput pentru cumpărători B2B<br />— Nu cumpărători cu amănuntul
  subtitle: Paddle Board Overstock produce pentru patru tipuri de clienți. Fiecare are priorități diferite și le abordăm pe toate.
  items:
    - title: Proprietari de marcă / Marcă proprie
      description: Design de produs personalizat, grafice cu marcă proprie, documentație de conformitate sub brandul dumneavoastră și suport ingineresc dedicat de la concept până la container.
      icon: tabler:palette
      cta: Solicitați OEM/ODM Cotație
      cta_href: /request-quotation
    - title: Distribuitori / Angrosiști
      description: Protecție pentru teritoriu, prețuri competitive en-gros, kituri de suport pentru marketing, instruire pentru produse și documentație completă de conformitate pentru piața dumneavoastră.
      icon: tabler:world
      cta: Aplicați pentru Dealership
      cta_href: /dealers-distributors
    - title: Stațiuni / Operatorii de Închirieri
      description: Durabilitate de nivel comercial, sfaturi pentru dimensionarea flotelor, comenzi de containere cu modele mixte, strategie pentru piese de schimb și pachete de echipamente branduite de stațiune.
      icon: tabler:beach
      cta: Obțineți un Pachet Comercial
      cta_href: /solutions/resorts
    - title: Salvare / Guvernamental / Profesional
      description: Construcție Hypalon/CSM, opțiuni de conformitate SOLAS, certificare specifică proiectului, suport pentru documentația de licitație și inginerie protejată NDA.
      icon: tabler:shield
      cta: Discută un Proiect
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: Capabilități OEM/ODM
  title: Ce primiți<br />cu Paddle Board Overstock
  subtitle: Acces direct la fabrică cu suport complet de inginerie, calitate și conformitate — nu o companie de trading.
  columns: 2
  items:
    - title: Personalizare OEM/ODM
      description: Design personalizat al carenei, materialul tubului (PVC sau Hypalon/CSM), layout-ul consolei, scaune, branding, culori și ambalaj. De la modificări minore la inginerie complet personalizată.
      icon: tabler:adjustments
    - title: MOQ redus, Sampling rapid
      description: 'RIB: 2-5 unități (matriță existentă). SUP: 5-10 unități per SKU. Matrițe personalizate: 200+ unități. Eșantioane pre-producție cu brandingul dvs. în 7-14 zile.'
      icon: tabler:rocket
    - title: Calitate Pregătită pentru Producție
      description: Fiecare unitate testată la presiune de 1,25x PSI nominal pentru 24-48 de ore. Rata defectelor 99,3% conform AQL 2,5 / ISO 2859. Lista de verificare a calității în 100 de puncte per carenă.
      icon: tabler:certificate
    - title: Documentație Completă de Conformitate
      description: CE conform 2013/53/EU (RCD), ISO 9001:2015 (SGS), audit social BSCI, conformitate REACH, marcaje UKCA. DoC specific modelului și datele de pe placa constructorului incluse.
      icon: tabler:file-certificate
    - title: Timp de Livrare 30-45 Zile
      description: Producție standard 30-45 zile FOB Qingdao. Prototiupuri 7-14 zile. Producție urgentă disponibilă. Planuri de încărcare a containerelor și ambalare ISPM-15 incluse.
      icon: tabler:truck-delivery
    - title: Service Post-Vânzare & Piese de Schimb
      description: Garanție de 5 ani pentru bărci/caiace/RIBs, 2 ani pentru SUP/accesorii. Furnizare piese de schimb cu transport prioritar. Suport pentru procesarea cererilor de garanție.
      icon: tabler:lifebuoy
content_categories:
  tagline: Categorii de Produse
  title: 5 Categorii,<br />64 modele Certificate CE
  subtitle: De la bărci cu tender de 2,4m RIB până la plăci de 15ft SUP — toate fabricate în fabrica noastră Qingdao ISO 9001.
  items:
    - title: RIB Bărci
      description: 2,4 m până la 7,0 m cu carene din aluminiu sau GRP.PVC sau HypalonCSM / tuburi.CE conform 2013/53/UE. Configurații de patrulare, scufundări, salvare și comerciale.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Bărci gonflabile
      description: 2,0 m până la 5,0 m cu pardoseală din aluminiu, placaj sau platformă de aer. Modele pentru pescuit, recreere și tender.
      icon: tabler:sailboat
      link: /products
    - title: SUP Consilii
      description: 9ft până la 15ft în modelele de 4 inch și 6 Drop-Stitchinch. Modele all-around, touring, yoga și pescuit. Disponibile comerciale.
      icon: tabler:swimming
      link: /products
    - title: Caiace
      description: Caiace gonflabile pentru 1 sau 3 persoane. Modele recreative și de turism cu Drop-Stitch opțiuni de podea.
      icon: tabler:kayak
      link: /products
    - title: Accesorii de siguranță
      description: CE- veste de salvare certificate, frânghii de aruncare, kituri de reparații, pompe și lumini de navigație.USCG PFD-uri aprobate de tip III/V.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Rezistența fabricii
  title: Producție pregătită pentru audit<br />în Qingdao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Facilitate 9001 de 12.000 ISO m² — Producător real, nu companie comercială</h3>
  items:
    - title: 6 linii de producție dedicate
      description: RIBBarcă gonflabilă separată, SUPcaiac, echipament de siguranță șiOEM/ODM/ linii. Fiecare cu puncte dedicate de control QC și planificare a producției.
    - title: 100% Presiune testată
      description: Fiecare cameră gonflabilă era presurizată la 1,25x PSI nominalizată și menținută timp de 24-48 de ore. Rezultatele testelor erau legate de numărul de serie al carenei (HIN).
    - title: Trasabilitate pe carenă
      description: 'Înregistrări de producție la nivel HIN cu 21+ de câmpuri de date per carenă: lot de material, ID-ul sudorului, rezultatul testului de presiune, configurația finală și destinația de livrare.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock O facilitate de producție 9001 de 12.000 m² ISO în Qingdao cu RIB linii de producție
content_compliance:
  tagline: Conformitate și Dovada Calității
  title: Dovezi documentate,<br />Nu doar afirmații
  subtitle: Fiecare afirmație de conformitate este susținută de documentație specifică modelului, disponibilă pentru verificarea dumneavoastră.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Sistem de management al calității certificat de TÜV RheinlandSGS/. Audituri anuale de supraveghere. Procese de control al calității documentate, de la materialul primit până la eliberarea expedierii.
      icon: tabler:certificate
    - title: CE conform anului 2013/53/UE (RCD)
      description: 64 de modele cu Declarații de Conformitate specifice modelului. Evaluarea conformității pentru modulele aplicabile. Înregistrarea HIN și datele plăcilor constructorului pentru fiecare carenă.
      icon: tabler:file-certificate
    - title: BSCI Conformitatea socială
      description: Audit anual BSCI efectuat de SGS. Au fost verificate practicile etice de muncă, siguranța la locul de muncă și managementul mediului în întreaga noastră facilitate.
      icon: tabler:users
    - title: REACH & UKCA
      description: Toate materialele PVC și adezive respectă reglementarea REACH a UE. Marcaj UKCA disponibil pentru piața din Marea Britanie. Fișele de date de securitate a materialelor sunt disponibile la cerere.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proces — De la Brief la Container
  items:
    - title: Pasul 1:<span class="font-medium">Cerințe</span>
      description: Distribuiți specificațiile produsului, piața țintă, cantitatea și cerințele de conformitate. Echipa noastră de ingineri va analiza în termen de 48 de ore.
      icon: tabler:file-text
    - title: Pasul 2:<span class="font-medium">Propunere</span>
      description: Primiți o propunere detaliată cu specificații, opțiuni de materiale, MOQ, prețuri, timpul de livrare și domeniul de conformitate pentru piața dumneavoastră.
      icon: tabler:clipboard-list
    - title: Pasul 3:<span class="font-medium">Prototip</span>
      description: Prototip de pre-producție cu brandingul dumneavoastră în 7-14 zile. Testare completă a calității la o presiune de 1,25x față de cea nominală. Costul prototipului va fi dedus din producția finală.
      icon: tabler:settings
    - title: Pasul 4:<span class="font-medium">Producție</span>
      description: Producție de 30-45 de zile FOB Qingdao după aprobarea eșantionului. Puncte de control QC în proces, testare de presiune și inspecție finală de 100 de puncte pentru fiecare unitate.
      icon: tabler:building-factory
    - title: Pasul 5:<span class="font-medium">Livrare</span>
      description: Plan de încărcare a containerului, ambalare din lemn ISPM-15, pachet de documentație de conformitate și FOB expediție Qingdao cu toată documentația de export.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM procesul de fabricație al bărcii gonflabile de la proiectare până la expedierea în container
blog_latest:
  title: Perspective Industriale și Tehnice
  information: |
    RCD ghiduri de conformitate, articole de proces OEM/ODM, comparații de materiale,
    și resursele pentru inspecția fabricii de la echipa de inginerie Paddle Board Overstock.
faqs:
  title: B2B Întrebări frecvente privind achizițiile
  subtitle: Întrebări frecvente din partea mărcilor, distribuitorilor și operatorilor comerciali despre fabricarea OEM/ODM cu Paddle Board Overstock.
  columns: 2
  items:
    - title: Sunteți un producător sau o companie de comerț?
      description: Suntem o fabrică integrată vertical, cu control complet asupra calității, materialelor și termenelor de livrare. Licența de afaceri și domeniul de producție pot fi verificate în timpul auditului fabricii.
      icon: tabler:building-factory
      category: all
    - title: Care este procesul tău OEM/ODM?
      description: Revizuirea cerințelor (48h) pentru propunere până la prototip (7-14 zile) până la producție (30-45 zile FOB Qingdao). Suport complet de inginerie, documentație de conformitate și trasabilitate pe fiecare corp pe tot parcursul procesului.
      icon: tabler:route
      category: all
    - title: Care sunt cerințele tale MOQ?
      description: 'RIB bărci: 2-5 unități pe model (matriță existentă), 200+ pentru matrițe personalizate. SUP plăci: 5-10 unități pe SKU. Comenzi pentru containere cu modele mixte disponibile. Comenzi de probă la 2-5 unități pentru evaluare.'
      icon: tabler:sort-ascending
      category: all
    - title: Ce opțiuni de personalizare sunt disponibile?
      description: Designul carenei, materialul tubului (PVC sau Hypalon/CSM), diametrul tubului, aranjamentul consolei, scaunele, direcția, sistemul de combustibil, aranjamentul punții, culorile brandului, grafica logo-ului, designul pad-ului EVA, ambalajul pentru retail și brandingul manualului proprietarului.
      icon: tabler:adjustments
      category: all
    - title: Ce documente de conformitate puteți furniza pentru piața mea?
      description: CE DoC conform 2013/53/UE, marcaj UKCA, certificat 9001 (SGS), raport de audit BSCI, conformitate REACH, rapoarte de testare a materialelor, jurnale de teste de presiune și date specifice plăcii constructorului pentru model. Documentația specifică pieței la cerere.
      icon: tabler:file-certificate
      category: all
    - title: Care este timpul de realizare pentru eșantionare și producție?
      description: 'Mostre pre-producție: 7-14 zile lucrătoare. Producție standard: 30-45 de zile FOB Qingdao. Producție rapidă disponibilă contra cost suplimentar. Sezonul de vârf (martie-iunie) poate prelungi termenele de livrare.'
      icon: tabler:clock
      category: all
    - title: Pot să aranjez un audit al fabricii sau un tur video live?
      description: Da. Audituri la fața locului în fabrica noastră din Qingdao sunt binevenite cu un preaviz de 3-5 zile. Tururi video live prin WhatsApp/Zoom disponibile imediat. Inspecții de către terți (SGS, BV, TÜV) sunt acceptate.
      icon: tabler:video
      category: all
    - title: Ce inspecții de calitate sunt efectuate înainte de expediere?
      description: Test de retenție a presiunii la 1,25x presiunea nominală (24-48h), testarea dezlipirii cusăturilor, lista de verificare finală în 100 de puncte, verificarea dimensiunilor, inspectarea cosmetică, verificarea documentației de conformitate și verificarea integrității ambalajului. Totul conform procedurilor ISO 9001.
      icon: tabler:clipboard-check
      category: all
