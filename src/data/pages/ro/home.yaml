faqs:
  title: SUP Întrebări frecvente despre comenzi și produse
  subtitle: Întrebări frecvente despre plăcile noastre SUP la lichidare, despre comandare, plată, livrare și garanție.
  columns: 2
  items:
    - title: Este SUP greu de învățat?
      description: Deloc. Cei mai mulți începători se ridică și paddles în cadrul primei lor sesiuni. Plăcile noastre SUP all-around au platforme stabile extra-largi, concepute special pentru cei care practică paddling pentru prima dată. Începeți pe apă liniștită și veți naviga în câteva minute.
      icon: tabler:swimming
      category: cina
    - title: Care este limita de greutate?
      description: Suportul nostru universal SUPs poate susține până la 220 lb, iar platformele pentru touring și yoga pot susține până la 250 lb. Fiecare pagină a produsului listează capacitatea exactă de greutate a utilizatorului, astfel încât să puteți potrivi placa cu nevoile dvs.
      icon: tabler:adjustments
      category: cina
    - title: Pot călători cu un gonflabil SUP?
      description: Absolut. Fiecare placă Paddle Board Overstock se ambalează într-o geantă de transport de dimensiunea unui rucsac. La doar 18-22 lbs, este ușor de purtat la plajă, lac sau prin terminalele aeroportului. Verificați politica de bagaje a companiei aeriene înainte de călătorie.
      icon: tabler:truck-delivery
      category: cina
    - title: Ce vine în cutie?
      description: Fiecare Paddle Board Overstock SUP include placa, un rucsac de călătorie, pompă manuală, vâslă reglabilă, aripă detașabilă, lesă cu spirală și trusă de reparații.
      icon: tabler:clipboard-list
      category: cina
    - title: De ce sunt prețurile dumneavoastră mai mici decât cele din comerț?
      description: Vindem suprastoc din fabrică — plăci noi-nouțe rămase din comenzile de producție finalizate — provenite din propria noastră bază de producție Weihai și parteneri de producție selectați. Fără majorări de vânzare cu amănuntul și fără intermediari înseamnă pachete SUP complete cu până la 60% reducere la prețurile tipice de vânzare cu amănuntul, cu aceeași calitate testată la presiune.
      icon: tabler:shield-check
      category: comenzi
    - title: Cum pot să plasez o comandă și să plătesc?
      description: Adăugați pachetul SUP în coș și finalizați plata în siguranță cu Stripe sau PayPal. Acceptăm toate cardurile principale de credit și debit. Fiecare comandă este confirmată prin e-mail cu o factură completă.
      icon: tabler:file-text
      category: comenzi
    - title: Livrați la nivel mondial?
      description: Da. Livrăm în 50+ de țări din UE, America de Nord, Asia-Pacific, Orientul Mijlociu și Africa. Comenzile aflate în stoc sunt de obicei expediate în 2-3 zile lucrătoare, cu urmărire furnizată pentru fiecare colet.
      icon: tabler:route
      category: comenzi
    - title: Ce garanție includ plăcile SUP?
      description: 'Fiecare placă SUP și accesoriu beneficiază de o garanție de 2 ani — inclusiv placa în sine, cusăturile drop-stitch și valvele de umflare. Reclamațiile sunt rezolvate în câteva zile, nu săptămâni: depuneți cererea online și noi reparăm sau înlocuim.'
      icon: tabler:lifebuoy
      category: comenzi
