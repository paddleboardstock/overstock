      description: Platforme extra-late, ultra-stabile, cu platforme pe terasă pe toată lungimea pentru yoga și antrenamente pe apă.
      icon: tabler:users
      link: /supboard
    - title: Copii SUPs
      description: Plăci mai ușoare, mai scurte, de dimensiunea copiilor — aceeași drop-stitch calitate într-un pachet potrivit pentru copii.
      icon: tabler:lifebuoy
