  tagline: Cui Deservim
  title: Scânduri pentru orice<br />tip de vâsle
  subtitle: Indiferent dacă este prima ta sesiune sau a cincizecea, există o placă la reducere potrivită modului tău de paddling.
  items:
    - title: Începători
      description: Plăci extra-largi, stabile, multifuncționale, care fac ca prima ta sesiune să fie ușoară — majoritatea începătorilor se ridică în câteva minute.
      icon: tabler:swimming
