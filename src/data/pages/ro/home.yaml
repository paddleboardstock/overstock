content_compliance:
  tagline: Calitate și testare
  title: Calitate testată,<br />Documentată
  subtitle: Fiecare afirmație de calitate este susținută de numere reale din linia noastră de producție - teste de presiune, înregistrări ale loturilor și rate de defecte măsurate.
  items:
    - title: 100% testat la presiune
      description: Fiecare placă este umflată la 1,25x PSI și ținută înainte de expediere. Dacă o cusătură, o supapă sau un fir de cusătură eșuat, placa nu iese niciodată din fabrică.
      icon: tabler:shield-check
    - title: Rată de 99,3% fără defecte
      description: Măsurat în fiecare lot de producție. Numărul provine din propriile noastre înregistrări ale inspecției finale - nu din marketing.
      icon: tabler:gauge
    - title: Trasabilitatea lotului
      description: Fiecare placă are un cod de lot de producție, astfel încât revendicările de garanție și verificările de calitate se urmăresc până la materialele și rulajele exacte.
      icon: tabler:clipboard-check
    - title: Garanție de 2 ani SUP
      description: Fiecare SUP placă și accesoriu acoperit timp de 2 ani — drop-stitch cusături, supape de umflare și accesorii incluse. Cereri rezolvate rapid.
      icon: tabler:lifebuoy
