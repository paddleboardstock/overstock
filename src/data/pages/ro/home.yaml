content_customer_types:
  tagline: Cui Deservim
  title: Plăci pentru orice tip de<br />paddler
  subtitle: Indiferent dacă este prima ta sesiune sau a cincizecea, există o placă la reducere potrivită modului tău de paddling.
  items:
    - title: Începători
      description: Plăci extra-largi, stabile, multifuncționale, care fac ca prima ta sesiune să fie ușoară — majoritatea începătorilor se ridică în câteva minute.
      icon: tabler:swimming
      cta: Cumpără Plăci Prietenoase pentru Începători SUPs
      cta_href: /supboard
    - title: Familii
      description: Plăci stabile pe care întreaga familie le poate folosi, plus modele mai ușoare pentru copii — echipament care se încarcă în mașină și se umflă în câteva minute.
      icon: tabler:beach
      cta: Cumpără Pachete pentru Familie
      cta_href: /products
    - title: Paddleri de Turism și Fitness
      description: Plăci de turism mai lungi și rapide și platforme de yoga cu punte completă pentru cei care parcurg distanțe mari.
      icon: tabler:route
      cta: Cumpără Plăci de Turism și Yoga
      cta_href: /supboard
    - title: Pescarilor
      description: Platforme ultra-stabile cu suporturi pentru echipament și spațiu pentru un cooler — pescuiește de pe o punte liniștită și plată.
      icon: tabler:lifebuoy
      cta: Cumpără Plăci pentru Pescuit SUPs
      cta_href: /products
features:
  id: features
  tagline: De ce să cumperi de la Paddle Board Overstock
  title: Fabrică Reală,<br />Economii Reale
  subtitle: Produse excedent și lichidări direct de la fabrică SUP — calitate certificată fără adaosul comercial.
  columns: 2
  items:
    - title: Până la 60% Reducere față de Prețul cu Amănuntul
      description: Vânzăm loturi de suprastoc și lichidare direct din fabrică — fără intermediari, fără adaos comercial. Aceleași plăci care se vând la preț întreg în alte părți, aici la prețuri de lichidare.
      icon: tabler:rocket
    - title: Pachete Complete
      description: 'Fiecare SUP vine ca un pachet complet: placă, rucsac de transport, pompă manuală, paddel reglabil, aripă detașabilă, șnur spirală și trusă de reparații.'
      icon: tabler:clipboard-list
    - title: Calitate Certificată
      description: 13 modele SUP certificate CE conform directivelor UE aplicabile. Fiecare placă este testată 100% la presiune de 1,25x PSI înainte de expediere. Rată de defecte de 99,3% conform AQL 2.5.
      icon: tabler:certificate
    - title: Fără MOQ — Comandă o Singură Placă
      description: Lichidarea suprastocurilor permite comenzi individuale. Adaugă o placă în coș, finalizează comanda, gata. Fără comandă minimă, fără proces de ofertare.
      icon: tabler:adjustments
    - title: Livrare Rapidă în toată Lumea
      description: Comenzile din stoc se expediază din Weihai în 2-3 zile lucrătoare. Livrare cu urmărire în 50+ de țări din UE, America de Nord, Asia-Pacific și altele.
      icon: tabler:truck-delivery
    - title: Garanție de 2 ani SUP
      description: Fiecare placă și accesoriu SUP este acoperit timp de 2 ani — cusături drop-stitch, supape de umflare și accesorii incluse. Reclamațiile se rezolvă în zile, nu săptămâni.
      icon: tabler:lifebuoy
content_categories:
