      link: /accessory
content_workshop:
  isReversed: true
  tagline: Rezistența fabricii
  title: De ce prețurile noastre de lichidare<br />sunt reale
  content: <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Fabrică adevărată, economii reale — Fiecare bord este expediat de la unitatea noastră din Weihai</h3>
  items:
    - title: Aceleași linii de producție ca și mărcile mari
      description: Fabrica noastră Weihai, de 12.000 m², produce panouri pentru branduri internaționale și propriile noastre serii de stoc excedentar pe aceleași linii, cu aceleași materiale.
    - title: 100% Presiune testată
      description: Fiecare placă este presurizată la 1,25x PSI și ținută înainte de expediere. Rată fără defecte de 99,3% pentru fiecare lot.
    - title: Fără intermediari
      description: Plăcile se livrează direct din fabrică la ușa dumneavoastră. Fără intermediari, fără markup pentru vânzare cu amănuntul - așa este prețul de lichidare cu până la 60% sub cel cu amănuntul.
