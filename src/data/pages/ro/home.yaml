  title: De la Finalizarea Comenzii la Apă — Cum Se Expediază Comanda Ta
  items:
    - title: 'Pasul 1: <span class="font-medium">Alege-ți tabloul</span>'
      description: Alegeți dintre modelele all-around, touring, yoga și pentru copii. Ghidurile noastre de cumpărare vă ajută să potriviți dimensiunea și stilul plăcii cu paddling-ul dvs.
      icon: tabler:clipboard-list
    - title: 'Pasul 2: <span class="font-medium">Casi securizat</span>'
      description: Plătiți în siguranță cu Stripe sau PayPal. Toate cardurile de credit și debit importante sunt acceptate. Nu este nevoie de cont — confirmarea comenzii ajunge în inbox-ul dumneavoastră.
      icon: tabler:file-text
    - title: 'Pasul 3: <span class="font-medium">Inspecție de calitate</span>'
      description: Fiecare placă este testată integral la presiune la 1,25x din PSI nominal și verificată conform unui checklist complet de calitate înainte de a fi ambalată.
      icon: tabler:settings
    - title: 'Pasul 4: <span class="font-medium">Expediere rapidă</span>'
      description: Comenzile aflate în stoc sunt expediate din fabrica noastră din Weihai în termen de 2-3 zile lucrătoare. Manipulare rapidă disponibilă pentru comenzile urgente.
      icon: tabler:building-factory
    - title: 'Pasul 5: <span class="font-medium">Livrare urmărită</span>'
      description: Transport urmărit la nivel mondial către 50+ de țări. Garanția ta de 2 ani și suportul prompt post-vânzare încep în ziua în care placa ta ajunge.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP procesul de comandă de la finalizarea securizată a achiziției până la livrarea urmărită la nivel mondial
