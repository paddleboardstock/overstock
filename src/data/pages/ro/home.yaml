  title: O Singură Linia de Produse,<br />Făcută Corect
  subtitle: Plăci și accesorii gonflabile SUP — toate fabricate în unitatea noastră Weihai ISO 9001.
  items:
    - title: SUP Consilii
      description: Gonflabilă pentru toate SUPs zonele, între 9 și 12 ft. Stabilă, durabilă și completată cu pompă, vâslă, lesă și rucsac.
      icon: tabler:swimming
      link: /supboard
    - title: Turnee SUPs
      description: Panouri mai lungi și mai rapide cu schițe turistice pentru lacuri, râuri și explorări de coastă.
      icon: tabler:route
      link: /supboard
    - title: Yoga & Fitness SUPs
      description: Platforme extra-late, ultra-stabile, cu platforme pe terasă pe toată lungimea pentru yoga și antrenamente pe apă.
      icon: tabler:users
      link: /supboard
    - title: Copii SUPs
      description: Plăci mai ușoare, mai scurte, de dimensiunea copiilor — aceeași drop-stitch calitate într-un pachet potrivit pentru copii.
      icon: tabler:lifebuoy
      link: /products
    - title: Accesorii
      description: Pompe, palete, veste de salvare, lese, kituri de reparații și piese de schimb pentru fiecare placă pe care o vindem.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Rezistența fabricii
  title: De ce prețurile noastre de reducere<br />Sunt reali
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Fabrică reală, economii reale — Fiecare placă este expediată de la facilitățile noastre din Weihai</h3>
  items:
    - title: Aceleași linii de producție ca și mărcile mari
      description: Fabrica noastră Weihai, de 12.000 m², produce panouri pentru branduri internaționale și propriile noastre serii de stoc excedentar pe aceleași linii, cu aceleași materiale.
    - title: 100% Presiune testată
      description: Fiecare placă este presurizată la o capacitate nominală de 1,25x PSI și menținută înainte de expediere. 99,3% rată fără defecte la AQL 2,5 / ISO 2859.
    - title: Fără intermediari
      description: Plăcile sunt livrate direct din fabrică la ușa ta. Fără adaos de la distribuitor, fără adaos, fără adaos la vânzare — așa se menține prețul de reducere până la 60% sub retail.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Fabrica Weihai de 12.000 m² cu linii de producție gonflabile SUP
content_compliance:
  tagline: Conformitate și Dovada Calității
  title: Calitate Certificată,<br />Documentat
  subtitle: Fiecare afirmație de conformitate este susținută de certificate și documentație specifică modelului disponibilă pentru verificarea dumneavoastră.
  items:
    - title: ISO 9001:2015
      description: Sistem de management al calității certificat de TÜV RheinlandSGS/. Audituri anuale de supraveghere. Procese de control al calității documentate, de la materialul primit până la eliberarea expedierii.
      icon: tabler:certificate
    - title: CE Certificat
      description: 13 modele SUP certificate CE conform directivelor UE aplicabile, fiecare însoțit de o Declarație de Conformitate specifică modelului și de datele de pe placa constructorului.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Toate PVC materialele adezive respectă REACH reglementările UE.UKCA marcaje disponibile pentru piața din Marea Britanie. Fișe de date privind siguranța materialelor la cerere.
      icon: tabler:shield-check
    - title: Garanție de 2 ani SUP
      description: Fiecare SUP placă și accesoriu acoperit timp de 2 ani — drop-stitch cusături, supape de umflare și accesorii incluse. Cereri rezolvate rapid.
      icon: tabler:lifebuoy
steps:
  title: De la Finalizarea Comenzii la Apă — Cum Se Expediază Comanda Ta
  items:
    - title: Pasul 1:<span class="font-medium">Alege-ți tabla</span>
      description: Alegeți dintre modelele all-around, touring, yoga și pentru copii. Ghidurile noastre de cumpărare vă ajută să potriviți dimensiunea și stilul plăcii cu paddling-ul dvs.
      icon: tabler:clipboard-list
    - title: Pasul 2:<span class="font-medium">Finalizare sigură a comenzii</span>
      description: Plătiți în siguranță cu Stripe sau PayPal. Toate cardurile de credit și debit importante sunt acceptate. Nu este nevoie de cont — confirmarea comenzii ajunge în inbox-ul dumneavoastră.
      icon: tabler:file-text
    - title: Pasul 3:<span class="font-medium">Inspectarea calității</span>
      description: Fiecare placă este testată integral la presiune la 1,25x din PSI nominal și verificată conform unui checklist complet de calitate înainte de a fi ambalată.
      icon: tabler:settings
    - title: Pasul 4:<span class="font-medium">Expediere rapidă</span>
      description: Comenzile aflate în stoc sunt expediate din fabrica noastră din Weihai în termen de 2-3 zile lucrătoare. Manipulare rapidă disponibilă pentru comenzile urgente.
      icon: tabler:building-factory
    - title: Pasul 5:<span class="font-medium">Livrare cu urmărire</span>
      description: Transport urmărit la nivel mondial către 50+ de țări. Garanția ta de 2 ani și suportul prompt post-vânzare încep în ziua în care placa ta ajunge.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP procesul de comandă de la finalizarea securizată a achiziției până la livrarea urmărită la nivel mondial
