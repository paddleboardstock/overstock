faq:
  title: Întrebări frecvente despre pachet
  questions:
    - q: Care este cantitatea minimă comandată pentru pachete?
      a: Pachetul de început pentru club are un minim de 10 unități. Pachetele Resort și Brand sunt personalizate în funcție de nevoile dumneavoastră, cu MOQs flexibil.
    - q: Cât durează livrarea?
      a: Producția standard durează 30–45 de zile de la confirmarea comenzii. Producția rapidă este disponibilă contra unei taxe suplimentare.
    - q: Pot să personalizez culorile și brandul echipamentului?
      a: Da. Toate pachetele includ personalizare completă — culorile plăcii, imprimeurile cu logo și designul ambalajului.
    - q: Oferiți suport post-vânzare?
      a: Da. Fiecare pachet include acces la ghidurile noastre de întreținere online, tutoriale video și sistemul de comandă a pieselor de schimb.
