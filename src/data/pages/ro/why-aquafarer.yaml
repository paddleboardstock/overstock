reasons:
  tagline: Diferența Aquafarer
  title: Ce Ne Deosebește
  isBeforeContent: false
  columns: 3
  items:
    - title: Producție Reală, Nu Comerț
      description: Deținem și operăm o fabrică de 12.000 m². Când colaborați cu Aquafarer, lucrați direct cu persoanele care proiectează, inginerizează și construiesc produsele dumneavoastră — fără intermediari.
      icon: tabler:building-factory
    - title: Abordare Condusă de Inginerie
      description: Procesul nostru de design începe cu cazul de utilizare, nu cu categoria produsului. Optimizăm forma corpului, selecția materialelor și configurația în funcție de modul în care echipamentul va fi de fapt utilizat în medii comerciale.
      icon: tabler:engine
    - title: Calitate Certificată
      description: Certificat CE, sistem de calitate ISO, conform BSCI, conform REACH, veste de salvare aprobate Tip III/V USCG; toate produsele respectă standardele internaționale aplicabile.
      icon: tabler:certificate
    - title: Flexibil OEM/ODM
      description: Culorile tuburilor, aspectul consolei, brandingul, ambalajul — le personalizăm conform specificațiilor dumneavoastră. Fără presiune de comandă minimă. Începeți cu un prototip, extindeți cu încredere.
      icon: tabler:adjustments
    - title: Logistică Globală
      description: Depozit în SUA, California, expediere directă din Qingdao, transport aerian pentru comenzile urgente. Ne ocupăm de documentele și formalitățile vamale la nivel mondial.
      icon: tabler:truck-delivery
    - title: Suport pe viață
      description: Susținem bărcile pe care le-am construit acum 20 de ani. Piese de schimb originale, sfaturi tehnice, ghidare pentru reparații — echipa noastră este disponibilă atunci când aveți nevoie de noi, oriunde vă aflați.
      icon: tabler:lifebuoy
testimonials:
  tagline: De încredere pentru branduri din întreaga lume
  title: Ce spun partenerii noștri
  items:
    - content: Am lucrat cu mai mulți producători din China, dar Aquafarer se remarcă prin suportul lor inginerești și calitatea constantă. Ei tratează brandul nostru ca pe al lor.
      name: — OEM Partener, Brand European de Sporturi Acvatice
    - content: Echipamentele lor Hypalon RIBs au fost în serviciul flotei noastre timp de peste 5 ani. Întreținere minimă, rezistență excelentă UV. Garanția de 5 ani pentru tuburi ne oferă încredere.
      name: — Operator de flotă, Grup de Stațiuni din Orientul Mijlociu
    - content: Echipa Aquafarer ne-a ajutat să dezvoltăm un design personalizat SUP de placă, de la concept până la producție, în 90 de zile. Calitatea a depășit așteptările noastre.
      name: — Distribuitor, Sporturi Acvatice din Australia
    - content: Ca proprietar de mică afacere, eram îngrijorat de MOQs. Aquafarer a lucrat cu bugetul meu și m-a ajutat să lansez marca mea cu doar 50 de plăci. Acum comand 500.
      name: — Fondator de marcă, companie americană de închirieri SUP
cta:
  title: Gata să îți construiești afacerea pe apă?
  subtitle: Contactează echipa noastră pentru o consultare gratuită. Fără obligații — doar sfaturi sincere despre echipamente și producție.
  actions:
    - variant: primary
      text: Vorbiți cu echipa noastră
      href: /contact
    - text: Descărcați catalogul de produse
      href: /resources
