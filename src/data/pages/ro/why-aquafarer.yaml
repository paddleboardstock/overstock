hero:
  tagline: De ce Aquafarer
  title: Construite Diferit. Construit pentru Afaceri.<br />Partenerul Din Spatele Aventurilor Acvatice la Nivel Mondial
  subtitle: Nu doar un producător — un partener de afaceri care proiectează, inginerizează și livrează echipamente de nivel comercial pentru cluburi, stațiuni, operatori de închirieri și mărci emergente de sporturi acvatice.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer calitatea și expertiza în fabricație
pillars:
  tagline: Trei Piloni ai Parteneriatului
  title: De ce aleg Afacerile Acvatice din întreaga lume Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Concepute pentru Uz Comercial
      description: Echipamentul nostru este proiectat pentru închiriere zilnică, nu pentru recreere de weekend. PVC de nivel comercial, miezuri drop-stitch consolidate, opțiuni Hypalon stabile la UV și hardware testat în teren înseamnă întreținere mai redusă, durată de viață mai lungă și ROI mai mare pentru operațiunea ta.
      icon: tabler:building-factory
      callToAction:
        text: Vezi linia de produse comerciale
        href: /products
    - title: De la Idee la Piață
      description: 'Lansează-ți marca de sporturi acvatice în 90 de zile. Te ghidăm în fiecare pas: validarea conceptului, selecția produsului, prototip, producție, designul ambalajului și expediție globală. Fără presiune pentru comandă minimă — începe mic, scalează cu încredere.'
      icon: tabler:rocket
      callToAction:
        text: Începe călătoria brandului tău
        href: /oem-odm-blueprint
    - title: Construit pentru Condiții Globale
      description: 'Produse optimizate pentru orice climă: formule pentru apă rece PVC pentru Europa, materiale rezistente la UV pentru Orientul Mijlociu și Australia, tratamente anti-umiditate pentru Asia de Sud-Est. Fiecare expediție este calibrată în funcție de mediul de destinație.'
      icon: tabler:world
