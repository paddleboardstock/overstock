who_benefits:
  tagline: Cine Poate Beneficia
  title: Cui se Adresează Comerțul Angro cu Modele Mixte
  items:
    - title: Importatori pentru Prima Dată
      description: Testarea categoriei SUP cu o varietate de modele în loc să te angajezi într-un singur SKU en-gros.
    - title: Retaileri Sezonieri de Plajă
      description: Magazine care au nevoie de plăci pentru începători pentru turiști și ediții premium pentru localnici — în aceeași comandă de reaprovizionare.
    - title: Vânzători online
      description: Listarea mai multor modele simultan pentru a afla ce design, lungime și tip de utilizare se vinde cel mai bine.
    - title: Flote și școli de închiriere
      description: Flote care necesită dimensiuni variate de plăci pentru greutăți diferite ale riderilor și tipuri de lecții, nu o flotă cu un singur tip de placă.
faq_section:
  title: Întrebări Frecvente Despre Modele Mixte
  items:
    - q: Există o cantitate minimă per model?
      a: Nu. Minimul de 5 plăci se aplică la comanda totală, nu fiecărui model. Ai putea comanda 5 modele diferite, câte o placă din fiecare.
    - q: Amestecarea modelelor schimbă prețul?
      a: Prețul unitar en-gros este cotat pe model, dar nivelul tău de preț se îmbunătățește odată cu numărul total de plăci — amestecarea modelelor nu te penalizează.
    - q: Pot combina plăci și accesorii?
      a: Da — vâsle de rezervă, pompe și kituri de reparație pot fi adăugate într-o comandă mixtă. Întreabă în formularul de cerere.
    - q: Cum știu ce modele se potrivesc pieței mele?
      a: Trimite-ne o notă despre clienții tăi (coastal sau inland, turiști sau localnici, începători sau rideri) în formularul de cerere și îți vom recomanda un mix.
