hero:
  tagline: Modele mixte en-gros
  title: Plăci de paddle cu model mixt en-gros —<br />Amestecă SUP modele diferite într-o singură ordine
  subtitle: De ce să-ți blochezi bugetul într-un singur model? Combină orice placă disponibilă SUP — ediții all-around, touring, surf și art — într-o singură comandă en-gros, cu un total de doar 5 plăci.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: O ordine mixtă a SUP diferitelor modele de plăci gonflabile de la Paddle Board Overstock
direct_answer: Modelele mixte en-gros permit unui mic retailer să comande mai multe SUP modele diferite într-o singură livrare consolidată, în loc de o cantitate mare de la o singură placă. Paddle Board Overstock La , orice modele aflate în stoc pot fi combinate, minimul comenzii este de 5 plăci în total, iar cantitatea totală determină nivelul de preț. Comenzile mixte sunt expediate din Weihai, China, prin transport aerian expres (1–3 plăci) sau transport maritim consolidat (5–20 plăci) către 50+ de țări, iar fiecare placă este testată 100% sub presiune și acoperită de SUP Garanția de 2 Ani.
tldr_points:
  - Amestecă orice SUP modele disponibile pe stoc într-o singură ordine — fără minime pe model
  - Cantitatea totală a comenzii (nu cantitatea pe model) stabilește nivelul tău de preț
  - Începe de la 5 plăci în total — construite pentru retaileri mici, nu pentru încărcături în containere
  - 'O singură expediere consolidată: un cost de transport, o vamă, o livrare'
why_mixed:
  tagline: De ce mixt?
  title: Combină și combină. Cumpără mai multă varietate. Cheltuiește mai puțin.
  subtitle: Un raft cu plăci identice servește un singur tip de vâslă. O comandă mixtă transformă același buget într-o gamă completă de produse.
  items:
    - title: Mai multă varietate pe raftul tău
      description: Combină plăci all-around pentru începători, plăci de turism pentru aventurieri și plăci de tip surf pentru rideri — o singură comandă acoperă întreaga gamă de clienți.
    - title: Risc mai mic pe model
      description: În loc să pariezi sezonul pe un singur model, comandă 2–4 din fiecare. Dacă un model vinde mai mult decât celelalte, reaprovizionează-l la următoarea comandă cu date reale de vânzări.
    - title: Testează ce se vinde pe piața ta
      description: Fiecare plajă, lac și oraș are cerere diferită. O primă comandă mixtă este cea mai ieftină cercetare de piață — pune în stoc șase modele, vezi care se vând.
    - title: Marje mai bune la edițiile Art Edition
      description: Plăcile premium din seria artă (Leviathan Wake, Medusa Glow, Ocean Voyager) au prețuri mai mari. Amestecă câteva într-o bază de plăci complete pentru a-ți crește marja medie.
    - title: O singură livrare consolidată
      description: O comandă mixtă înseamnă o rezervare de marfă, o deliberare vamală și o livrare — în loc de cinci expedieri separate de la cinci furnizori diferiți.
how_it_works:
  tagline: Cum Funcționează
  title: Cum funcționează o ordine mixtă a modelelor
  steps:
    - title: Alege-ți mixul
      description: Alege modelele și cantitățile pentru piața ta — sau folosește selectorul de mai jos pentru a schița o combinație și a vedea în timp real actualizarea numărului de plăci și a valorii totale.
    - title: Solicitați o cotație
      description: Trimiteți-ne mixul. Confirmăm stocul curent pentru fiecare model și oferim prețuri unitare, plus opțiuni de transport expres și maritim către țara dumneavoastră.
    - title: Confirmați ordinul
      description: Aprobă oferta finală — modele, cantități, transport, total. Blocăm stocul și programăm expediția din Weihai.
    - title: Testăm fiecare placă
      description: Fiecare placă din comanda ta mixtă este testată 100% la presiune de 15 PSI înainte de ambalare — același standard pentru fiecare model, fie că este un model de bază polivalent sau o ediție de artă.
    - title: O livrare direct la ușa ta
      description: Comanda mixtă completă se expediază împreună — curier expres aerian pentru comenzi mici, transport maritim consolidat pentru 5–20 de plăci — cu urmărire de la ușă la ușă.
