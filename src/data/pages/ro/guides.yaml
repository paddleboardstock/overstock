hero:
  tagline: Ghiduri
  title: Nou la SUP?
  subtitle: Ghiduri practice pentru a te ajuta să alegi, să folosești și să te bucuri de echipamentele gonflabile pentru sporturi nautice.
size_guide:
  tagline: Dimensiuni și specificații
  title: Găsește dimensiunea potrivită pentru nevoile tale
  desc: Compară dimensiunile plăcii, capacitățile de greutate și utilizările recomandate. Fie că vrei o placă stabilă pentru toate scopurile sau o formă mai rapidă pentru tură — ghidul nostru de mărimi te ajută să alegi potrivirea corectă.
  link_label: Ghid complet de dimensiuni cu specificații de produs →
  link: /size-guide
  cards:
    - title: Plăci All-Around SUP
      desc: Plăcile noastre de ~11 ft (32" lățime) echilibrează stabilitatea, viteza și capacitatea. Nucleul de 6 inci drop-stitch la 15 PSI menține puntea rigidă pentru toți paddlerii, indiferent de nivel.
    - title: Lățime și stabilitate
      desc: Plăcile mai late (32"+) oferă mai multă stabilitate pentru începători, yoga și pescuit. Grosimea de 6 inch adaugă rigiditate și capacitate de susținere pentru rider și echipament.
    - title: Pachete și Accesorii
      desc: Fiecare placă este livrată ca un pachet complet — placă, rucsac de călătorie, pompă manuală, paddle reglabil, aripioară detașabilă, leash spiralat și trusă de reparații. Verificați sarcina maximă pentru rider plus echipament.
