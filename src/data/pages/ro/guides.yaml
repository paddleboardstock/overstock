hero:
  tagline: Ghiduri
  title: Nou la SUP?
  subtitle: Ghiduri practice pentru a te ajuta să alegi, să folosești și să te bucuri de echipamentele gonflabile pentru sporturi nautice.
size_guide:
  tagline: Dimensiuni și specificații
  title: Găsește dimensiunea potrivită pentru nevoile tale
  desc: Compară dimensiunile produselor, capacitățile de greutate și utilizările recomandate. Indiferent dacă ai nevoie de un SUP de turism, un caiac compact sau un RIB comercial — ghidul nostru de dimensiuni te ajută să alegi potrivitul.
  link_label: Ghid complet de dimensiuni cu specificații de produs →
  link: /size-guide
  cards:
    - title: SUP Plăci
      desc: Alege lungimea în funcție de greutatea și utilizarea dorită. Plăcile mai late (32"+) oferă mai multă stabilitate. Plăcile mai lungi (11–12 ft) se mențin mai bine pe drum pentru turism.
    - title: Caiace
      desc: Caiace simple (9 ft) pentru călătorii solo și râuri. Caiace tandem (12 ft) pentru doi vâslești sau unul cu echipament. Verifică întotdeauna capacitatea de greutate.
    - title: Bărci cu vasle & RIBs
      desc: Alege lungimea în funcție de numărul de pasageri și de utilizare. RIBs mai mari (4,5 m+) pentru mare deschisă și salvare. Bărci mai mici (2,7 m) ca bărci auxiliare și platforme de pescuit.
