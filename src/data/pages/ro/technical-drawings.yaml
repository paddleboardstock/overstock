hero:
  tagline: Desene Tehnice & CAD
  title: RIB & Barcă Gonflabilă<br />Descărcări Desene Tehnice & CAD
  subtitle: Desene GA la nivel de planificare, foi de dimensiuni și machete pentru evaluarea și specificațiile proiectului. Accesați desene tehnice la nivelul corect — de la PDF-uri publice până la fișiere STEP la nivel de proiect.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB descărcări desene tehnice barcă și CAD
direct_answer: Aquafarer oferă desene tehnice la nivel de achiziții pentru bărci RIB și ambarcațiuni gonflabile — inclusiv PDF-uri cu aranjamentul general (GA), foi de dimensiuni și desene ale machetei punții. Formatele de nivel detaliat superior (DXF/DWG, STEP/IGES) sunt disponibile la cerere calificată sau aplicație de proiect.
