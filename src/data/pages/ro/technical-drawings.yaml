content_version_control:
  tagline: Controlul Versiunii
  title: Versiunea desenului<br />Management
  subtitle: Fiecare desen urmează un sistem controlat de revizuire. Verificați întotdeauna că aveți revizia curentă înainte de a utiliza desenele pentru planificarea proiectului.
  items:
    - title: Urmărirea Reviziilor
      description: Fiecare desen are un cod de revizie (Rev-A, Rev-B, Rev-C), data emiterii, data ultimei revizuiri, modelul/configurația aplicabilă, unitățile, dimensiunea fișierului și formatul. Doar revizia „Curentă” este disponibilă pentru descărcare.
      icon: tabler:git-branch
    - title: Notificare privind starea desenului
      description: Toate desenele publice sunt marcate „Doar schiță preliminară — nu pentru construcție, certificare sau producție. Dimensiunile sunt supuse specificațiilor finale și confirmării comenzii.” Acest lucru protejează ambele părți de utilizarea greșită.
      icon: tabler:alert-circle
    - title: Notificări de actualizare
      description: Când se schimbă specificația unui model, revizia desenului este actualizată și versiunile anterioare sunt marcate „Înlocuite.” Utilizatorii înregistrați care au descărcat pachetele DXF/DWG primesc notificări despre actualizări semnificative prin e-mail.
      icon: tabler:bell
faq:
  title: Desene Tehnice — Întrebări Frecvente
  questions:
    - q: Sunt într-adevăr gratuite fișierele PDF GA?
      a: Da. PDF-urile de aranjament general pentru modelele noastre principale sunt disponibile fără cost — completați formularul scurt de calificare de mai jos și linkul de descărcare este trimis prin e-mail în termen de 1 zi lucrătoare. Acestea conțin informații la nivel de planificare suficiente pentru evaluarea proiectului, alocarea spațiului și revizuirea specificațiilor preliminare.
    - q: Cum pot accesa fișierele DXF/DWG?
      a: Completați formularul scurt de calificare de pe pagina de descărcare cu numele companiei, tipul proiectului și utilizarea intenționată. Cererile aprobate primesc un link de descărcare prin e-mail în termen de 1 zi lucrătoare.
    - q: Pot obține modele 3D STEP/IGES?
      a: Fișierele de model 3D STEP sau IGES sunt disponibile prin procesul nostru de aplicație de proiect. Furnizați domeniul proiectului, cerințele de integrare, calendarul și intenția de achiziție. Supuse aprobării — de obicei în termen de 3-5 zile lucrătoare.
    - q: De ce restricționați accesul la fișiere cu mai multe detalii?
      a: Geometria carenei, datele matriței și calculele structurale reprezintă ani de investiții în cercetare și dezvoltare și sunt IP esențial pentru producție. Oferim tot ce este necesar pentru planificarea achizițiilor și integrarea proiectului, protejând în același timp capacitatea noastră de a continua investițiile în dezvoltarea de produse noi.
    - q: Include desenul detalii de fabricație?
      a: Nu. Desenele publice și cele simplificate conțin informații la nivel de achiziție pentru planificare și specificații. Detaliile la nivel de fabricație (programe de laminare, trasee de unelte, extinderi de tăiere) sunt partajate doar în cadrul NDA cu comenzi confirmate.
    - q: Sunt disponibile desene pentru configurații personalizate sau semi-personalizate RIB?
      a: Desenele proiectelor personalizate sunt pregătite ca parte a procesului de dezvoltare OEM/ODM. Dacă evaluați un proiect personalizat RIB, contactați-ne cu cerințele dvs. și vă vom furniza desene GA specifice proiectului ca parte a propunerii.
