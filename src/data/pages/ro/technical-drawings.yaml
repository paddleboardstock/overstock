content_tiers:
  tagline: Niveluri de Descărcare
  title: Patru Niveluri de Acces<br />— Detaliul Potrivit pentru Etapa Potrivită
  subtitle: Oferim desene la nivel de achiziții, nu fișiere la nivel de fabricație. Fiecare nivel corespunde unei etape diferite a proiectului.
  items:
    - title: Nivel 1 — PDF Public
      description: Aranjament general (GA), desen dimensional în 4 vederi și machetă a punții în format PDF. Disponibil pentru descărcare gratuită. Suficient pentru planificarea proiectului, alocarea spațiului și revizuirea preliminară a specificațiilor.
      icon: tabler:file-type-pdf
    - title: Nivel 2 — DXF/DWG Formă Ușoară
      description: Fișiere CAD 2D (DXF sau DWG) pentru integrarea machetei la nivel de planificare. Necesită un scurt formular de calificare (nume companie, tip proiect, scop de utilizare). Nu includ date structurale sau de fabricație.
      icon: tabler:file-code
    - title: Nivel 3 — STEP/IGES Aplicație de Proiect
      description: Fișiere model 3D (STEP sau IGES) pentru integrarea sistemului, proiectarea echipării sau coordonarea arhitecturii navale. Necesită aplicație de proiect cu scop, cronologie și intenție de achiziție. Supus aprobării.
      icon: tabler:cube
    - title: Nivel 4 — NDA Inginerie
      description: Desene structurale ale carenei, programe de laminare, expansiuni pentru tăiere tuburi și date matriță. Disponibile doar sub NDA cu comenzi confirmate. Acestea sunt fișiere la nivel de fabricație — nu pentru distribuție publică.
      icon: tabler:lock
content_included:
  tagline: Ce este inclus
  title: Conținutul desenului<br />Pe model
  subtitle: Fiecare model are un pachet standard de desene care acoperă informațiile esențiale de planificare pentru cumpărătorii și inginerii de proiect B2B.
  items:
    - title: Aranjament General (GA)
      description: Profil lateral, vedere de sus și secțiune transversală arătând forma carenei, poziția tubului, locația consolei, locurile de ședere, sistemul de combustibil și dimensiunile principale (LOA, lățime, diametru tub, unghi de deadrise). Starea reviziei și drepturile de autor sunt menționate pe blocul de titlu.
      icon: tabler:layout
    - title: Desen dimensional în 4 vederi
      description: Vederi laterale, frontale, din spate și de sus cu dimensiuni generale pentru planificarea transportului (înălțimea pe remorcă, lățimea pentru container, greutatea pentru ridicare). Include configurații operaționale și de transport.
      icon: tabler:ruler-2
    - title: Planul punții și al echipamentului
      description: Vedere de sus a punții, arătând baza consolei, pozițiile scaunelor, locațiile inelelor în D, pozițiile luminilor de navigație, accesul la pompa de fund, compartimentul pentru baterie/combustibil și punctele de montare a echipamentului. Precizie limitată asupra interfețelor proprietare.
      icon: tabler:map
    - title: Desen de transport și ambalare
      description: Planul de încărcare a containerului, dimensiunile suportului, distribuția greutății și pozițiile punctelor de ridicare pentru planificarea logisticii. Include opțiuni de ambalare standard și personalizate.
      icon: tabler:truck
content_protection:
  tagline: Protecția IP
  title: Ce Nu Împărtășim<br />& De ce
  subtitle: Protejarea proprietății noastre intelectuale în inginerie asigură că putem continua să investim în cercetare și dezvoltare, oferind în același timp tot ce au nevoie cumpărătorii pentru planificarea proiectelor.
  items:
    - title: Date de bază pentru matrița carenei
      description: Geometria mufei și a matriței, CNC traiectoriile uneltelor și șabloanele de laminare sunt active de fabricație proprietare. Acestea nu sunt partajate la niciun nivel de acces în afara contractelor NDA confirmate.
      icon: tabler:ban
    - title: Extensii pentru tăierea țevilor
      description: Fișierele de tăiere a tiparului plat pentru țesăturile tubulare sunt date la nivel de producție. Disponibile doar sub NDA cu comenzi de producție confirmate și comunicate doar părții contractante.
      icon: tabler:ban
    - title: Calculații Structurale
      description: Analiza detaliată a tensiunilor, rezultatele FEA și programele de laminate sunt documente sensibile la conformitate, partajate doar cu Organismele Notificate și clienții NDA în timpul procesului de evaluare a conformității.
      icon: tabler:ban
    - title: Selectarea concurenților
      description: Ne rezervăm dreptul de a refuza cererile de acces CAD care par să provină de la concurenți, studenți fără context de proiect sau părți fără intenție legitimă de achiziție.
      icon: tabler:shield
content_models:
  tagline: Modele disponibile
  title: Desen Tehnic<br />Disponibilitate pe model
  subtitle: Descărcările PDF GA sunt disponibile pentru principalele noastre modele de RIB și bărci pneumatice. Contactați-ne pentru desenele modelelor specifice care nu sunt listate.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, cadru GRP deep-V, tuburi Hypalon sau PVC, consolă centrală. Plan general, dimensiuni, configurație punte și plan de transport disponibile. Categoria de proiectare C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, carenă GRP cu rezistență moderată-V, Hypalon sau PVC tuburi, consolă laterală sau centrală. GA și dimensiuni disponibile. Categoria de proiectare C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, carenă GRP, PVC tuburi, cârmă sau consolă. GA și dimensiuni disponibile. Categoria de proiectare C/D.
      icon: tabler:sailboat
    - title: AF380 Barcă Gonflabilă
      description: 3,8 m dinghy gonflabil, podea din aluminiu, PVC tuburi. GA și dimensiuni de împachetare disponibile. Conform EN ISO 6185.
      icon: tabler:sailboat
    - title: AF320 Barcă Gonflabilă
      description: 3,2 m barcă gonflabilă, podea tip air deck, PVC tuburi. GA și dimensiuni de împachetare disponibile. Conform EN ISO 6185.
      icon: tabler:sailboat
