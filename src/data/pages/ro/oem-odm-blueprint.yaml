faq:
  title: OEM/ODM — Întrebări frecvente
  questions:
    - q: Care este cantitatea minimă de comandă (MOQ) pentru SUPs gonflabile personalizate?
      a: Pentru modelele standard cu matrițe existente, MOQ începe de la 5–10 unități pe design. Pentru matrițe și scule complet personalizate, MOQ este de obicei 200+ de unități. Colaborăm cu startup-uri și branduri emergente pentru a găsi puncte de intrare fezabile.
    - q: Cât OEM durează procesul de probă?
      a: Prototipurile standard sunt finalizate în termen de 7–14 zile lucrătoare de la aprobarea proiectării. Comenzile de urgență pot fi prioritizate la 5–7 zile, cu o taxă suplimentară.
    - q: Care este diferența dintre PVC și Hypalon pentru bărcile gonflabile?
      a: PVC este mai ușor, mai accesibil și oferă o flexibilitate excelentă în condiții de frig.Hypalon (CSM) oferă UV o rezistență superioară la ozon și o durată de viață mai lungă (10–15 ani față de 5–8 ani). Recomandăm PVC pentru majoritatea aplicațiilor recreative și Hypalon pentru uz comercial/profesional.
    - q: Poți personaliza forma și designul gonflabilei?
      a: Da. Echipa noastră de cercetare și dezvoltare poate dezvolta matrițe personalizate pentru orice formă a carcasei, conturul plăcii sau configurația tuburilor. Folosim CNCmatrițe din aluminiu prelucrat pentru precizie și consistență.
    - q: Oferiți servicii de audit în fabrică?
      a: Primim cu deschidere auditurile fabricilor la fața locului și terțe părți la facilitățile noastre Qingdao de 12.000 m². Menținem ISO certificările 9001 BSCI și putem împărtăși rapoarte de audit NDApe .
    - q: Ce condiții de livrare oferiți?
      a: Oferim FOB Qingdao (standard), CIF, și DDP termeni de transport. Încărcarea containerelor și documentația completă de export sunt incluse în toate OEM comenzile.
content_profiles:
  tagline: Profiluri de brand
  title: OEM / Producție de marcă privată<br />După tipul de client
  subtitle: Profilurile diferite de brand vin cu cerințe distincte — adaptăm OEMserviciileODM noastre pentru a se potrivi modelului tău de afaceri, scalării și strategiei de lansare pe piață.
  items:
    - title: Branduri Startup de Watercraft
      subtitle: Creștere MOQjoasă și rapidă
      description: Antreprenori și fondatori care își lansează prima linie de SUPs, caiace sau bărci gonflabile. Aveți nevoie de un partener de fabricație care să trateze brandul dumneavoastră ca pe al său — cu praguri de intrare reduse, dimensiuni flexibile ale loturilor și ghidare practică în design la fiecare pas.
      features:
        - MOQ de la 50–100 de unități pe SKU, nu mii
        - Bibliotecă de matrițe preexistentă pentru a evita costurile de sculă
        - 'Pachet complet de branding: logo, grafică pentru tuburi, ambalaje, etichete suspendate'
        - Fluxul de lucru pe primul eșantion — aprobă înainte de producție
    - title: Branduri marine consacrate
      subtitle: OEM Scalează cu CE/ISO Conformitate
      description: Branduri existente de bărci, PWC sau accesorii marine care adaugă ambarcațiuni gonflabile în portofoliul lor. Este nevoie de calitate constantă pe toate serii de producție, conformitate cu reglementările pentru piețele globale și posibilitatea de a co-ingineria carene sau forme de tuburi personalizate.
      features:
        - Inginerie personalizată a matriței 3D pentru proiecte proprietare
        - CE 2013/53/UE, UKCA, USCG documentație de conformitate
        - BSCI Rapoarte de audit social pentru conformitatea retailerilor
        - Gestionare dedicată a conturilor + sloturi de producție prioritare
    - title: Branduri DTC și de comerț electronic
      subtitle: Ambalaje pregătite pentru retail la scară largă
      description: Branduri online care vând prin Amazon, Shopify sau propriile magazine web. Ambalajele, experiența de despachetare și calitatea constantă a unităților sunt critice. Ai nevoie de o fabrică care înțelege dinamica vitezei și a ratei de returnare în comerțul electronic.
      features:
        - Design de cutii pregătite pentru retail + imprimarea cardurilor de inserție
        - Ambalare sub vid / paletizare pentru transport eficient din punct de vedere al costurilor
        - EAN / UPC cod de bare și documentație pregătită pentru vamă
        - Consolidarea containerelelor mixte pentru optimizarea costului final
    - title: Branduri de stil de viață și outdoor
      subtitle: Design white-label + extindere de categorie
      description: Îmbrăcăminte, echipamente pentru exterior sau branduri de călătorie care intră în categoria sporturilor nautice sub propriul lor label. Este posibil să nu aveți expertiză în inginerie marină internă — așa că aveți nevoie de un partener care să vă ghideze de la concept la container cu fricțiuni minime.
      features:
        - Cercetare de trenduri și mood board-uri de concept
        - Ediții limitate co-branded și culori sezoniere
        - Ciclul de la design la prototip în 10–14 zile lucrătoare
        - 'Logistică completă: fabrică → depozit → consumator'
