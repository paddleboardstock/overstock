process_steps:
  title: Proces în 6 pași OEM/ODM
  subtitle: De la brief-ul de design la FOB Qingdao — un flux de lucru eficient
  steps:
    - number: '01'
      title: Brief de design & modelare CAD 3D
      description: Partajați specificațiile țintă, produsul de referință sau conceptul. Echipa noastră de inginerie dezvoltă desene CAD detaliate și randări 3D pentru aprobarea dumneavoastră.
      timeline: 3–5 zile
    - number: '02'
      title: Selecția materialului & testarea țesăturii
      description: Alegeți din țesături de nivel militar PVC (0,9–1,2 mm), Hypalon CSM sau drop-stitch ca materiale de bază. Efectuăm teste de rezistență la tracțiune, aderența stratului de acoperire și stabilitatea UV.
      timeline: 2–3 zile
    - number: '03'
      title: Prototipare rapidă & producția de mostre
      description: Noi facem matrițe personalizate CNC și producem mostre pre-producție cu culorile brandului dumneavoastră, logo-ul și materialele specificate. Mostrele sunt trimise pentru aprobarea dumneavoastră.
      timeline: 7–14 zile
    - number: '04'
      title: Test de reținere a presiunii ridicate 24–48 de ore
      description: Fiecare prototip este supus unui test riguroas de menținere a presiunii la 1,25x presiunea nominală. Se efectuează teste de desprindere a cusăturilor și verificarea dimensională.
      timeline: 1–2 zile
    - number: '05'
      title: CE/ISO Inspectarea Calității și Ambalarea
      description: Listă de verificare a calității cu 100 de puncte. Fiecare unitate este inspectată înainte de ambalarea pentru vânzare. Declarație de conformitate CE și raport de conformitate BSCI incluse.
      timeline: 2–3 zile
    - number: '06'
      title: FOB Transport și Logistică Qingdao
      description: Produsele finite sunt palletizate, împachetate în folie termocontractabilă și încărcate în containere la portul Qingdao. Toată documentația de export, vămuire și urmărire în timp real.
      timeline: 7–14 zile
