  title: Paddle Board Overstock — Ingineria libertății pe apă
  subtitle: 'De la un atelier de coastă la un producător marin global — călătoria noastră se bazează pe o convingere încăpățânată: plăcile cu palete ar trebui proiectate ca și cum ar conta, pentru că contează.'
  image:
