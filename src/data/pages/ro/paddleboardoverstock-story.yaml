timeline:
  - year: '2012'
    title: Fundația pentru Producție Maritimă
    body: Paddle Board Overstock a început ca un atelier specializat de ambarcațiuni gonflabile în Qingdao, China, dedicat meșteșugului marin și fabricării bărcilor gonflabile. Accentul inițial a fost construirea de produse gonflabile fiabile prin experiență practică în inginerie și disciplină în fabricație.
  - year: '2015'
    title: Primul export și CE certificare
    body: Comenzile inițiale de export au ajuns în Japonia și Coreea.CE S-a obținut certificarea pentru liniile de produse de bază, Paddle Board Overstockmarcând intrarea pe piețele internaționale. Compania a început să deservească utilizatori comerciali și recreaționali dincolo de China.
  - year: '2018'
    title: Extinderea fabricii
    body: Mutat într-o facilitate de producție de 12.000 m². A adăugat linii de sudură RF și drop-stitch capacitate de producție, permițând producția la scară largă și îmbunătățirea sistemelor de control al calității.
  - year: '2020'
    title: Înființarea Centrului de Cercetare și Dezvoltare
    body: A deschis un centru dedicat de cercetare și dezvoltare cu PVC laborator de țesături, rezervor de testare hidrodinamică și studio de simulare CAD/FEA. Dezvoltarea produsului s-a extins pentru a se concentra pe construcții ușoare, durabilitate îmbunătățită și design centrat pe utilizator.
  - year: '2022'
    title: Certificare și Creștere Globală
    body: A ISO obținut certificarea 9001. A fost extins la 14 ingineri de cercetare și dezvoltare și 200+ de angajați. Produsele au ajuns la clienți din Europa, America și Asia-Pacific prin distribuitori și OEM parteneriate.
  - year: '2024'
    title: Studio de Inovație și Design
    body: A lansat un studio complet de design și inovație pentru ODM proiecte personalizate, de la concept la producție. A consolidat aplicațiile profesionale maritime, inclusiv salvări, comerciale și guvernamentale.
  - year: '2026'
    title: Construirea viitorului explorării apei
    body: Astăzi, Paddle Board Overstock continuă să dezvolte bărci gonflabile, SUP sisteme și soluții marine personalizate — conectând oameni și organizații cu apele lumii. 50 de+ țări au fost deservite, cu o capacitate anuală de 15.000 de unități.
content_founding:
  tagline: Începutul
  title: Născut pe malul apei
  subtitle: 'Paddle Board Overstock a început într-un atelier de coastă din Qingdao cu o singură barcă și o viziune: să construiască ambarcațiuni gonflabile care să poată face față condițiilor marine reale.'
  paragraphs:
    - În 2012, fondatorii noștri au observat un gol pe piață — majoritatea bărcilor gonflabile erau fie accesibile, dar nesigure, fie de calitate superioară, dar extrem de scumpe. Ei credeau că există loc pentru un producător care să ofere atât calitate, cât și valoare.
    - Prima carenă a fost construită manual, testată în apele locale și rafinată pe baza feedback-ului real de la pescari și mici operatori comerciali. Acest ciclu de feedback — construire, testare, ascultare, îmbunătățire — rămâne astăzi în centrul filosofiei noastre inginerești.
    - Până în 2015, vestea s-a răspândit dincolo de Qingdao. Distribuitorii internaționali au început să solicite mostre. Ceea ce a început ca un atelier local devenea un furnizor global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Atelierul de producție timpuriu și producția
content_growth:
  tagline: Creștere și inovație
  title: De la atelier la facilități de 12.000 m²
  subtitle: Investițiile continue în oameni, echipamente și procese s-au transformat Paddle Board Overstock într-o facilitate modernă de producție marină.
  paragraphs:
    - Pe măsură ce cererea a crescut, la fel a crescut și facilitățile noastre. Ne-am extins de la un atelier mic la o fabrică de 12.000 m² cu linii dedicate de producție pentru RIB bărci, bărci gonflabile, SUP plăci și accesorii.
    - Am investit în CNC mașini de tăiere, echipamente de sudură de înaltă frecvență, linii de producție drop stitch și platforme de testare cuprinzătoare — ceea ce ne-a permis să controlăm fiecare aspect al calității producției.
    - Astăzi, echipa noastră de 200-300 de persoane include ingineri marini, oameni de știință în materiale, specialiști în controlul calității și meșteșugari calificați — mulți dintre aceștia fiind Paddle Board Overstock alături de încă din primele zile.
founder:
  tagline: Cunoaște-l pe Fondator
  title: Construit de un Waterman
  subtitle: Fondatorul David Chen reunește expertiza în producție și o pasiune de-o viață pentru sporturile nautice — o combinație care definește modul Paddle Board Overstock în care abordează dezvoltarea produselor.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fondatorul Paddle Board Overstock
  story:
    - David Chen a crescut pe coasta Qingdao, unde marea nu era o destinație de vacanță, ci un mod de viață. Și-a petrecut tinerețea făcând caiac, navigând și pescuind în Marea Galbenă — experiențe care i-au oferit o înțelegere intuitivă a ceea ce trebuie să suporte ambarcațiunile nautice.
    - Înainte de a înființaPaddle Board Overstock, David a petrecut un deceniu în producția marină, lucrând în producție, calitate și comerț internațional. A gestionat OEM programe pentru branduri europene și nord-americane, învățând direct standardele și așteptările piețelor globale.
    - 'În 2012, a fondat Paddle Board Overstock cu o misiune simplă: să construiască ambarcațiuni gonflabile în care să aibă încredere cu propria familie pe apă. Acest standard personal — aș folosi asta? — rămâne testul final pentru fiecare produs care iese din fabrică.'
    - Astăzi, David conduce strategia de produs și supraveghează echipa de cercetare și dezvoltare, revizuind personal noi designuri și testând prototipuri pe apele din apropierea Qingdao. El crede că produsele excelente vin din înțelegerea atât a ingineriei, cât și a experienței.
philosophy:
  tagline: Filosofia brandului
  title: Libertatea inginerească pe apă
  body: Libertatea pe apă nu înseamnă doar mișcare. Reprezintă descoperirea de locuri noi, crearea de experiențe în aer liber, conectarea oamenilor cu natura și facilitarea misiunilor profesionale. Ingineria face posibilă această libertate.
  pillars:
    - title: Fiabilitatea pe primul loc
      body: Mediile acvatice cer încredere.Paddle Board Overstock Produsele sunt concepute în jurul stabilității, durabilității, siguranței și performanței constante.
    - title: Design centrat pe om
      body: Produsele ar trebui să servească oamenilor, nu tehnologiei. Fiecare decizie de design începe cu înțelegerea modului în care oamenii folosesc ambarcațiunile, unde explorează și ce provocări întâmpină.
    - title: Explorare accesibilă
      body: Apa nu ar trebui să aparțină doar experților.Paddle Board Overstock creează echipamente care permit mai multor oameni să experimenteze în siguranță râurile, lacurile, oceanele și mediile de coastă.
    - title: Inovație continuă
      body: Inovația nu înseamnă doar crearea de produse noi. Îmbunătățește fiecare detaliu — materiale, structuri, producție și experiența utilizatorului.
engineeringDna:
  tagline: ADN ingineresc
  title: Cum Paddle Board Overstock creează produse
  areas:
    - title: Știința Materialelor
      body: Paddle Board Overstock se concentrează pe selectarea materialelor potrivite pentru diferite medii marine. Considerații cheie includ rezistența la abraziune, rezistența UV, stabilitatea la presiune și durabilitatea pe termen lung.
      items:
        - Rezistența la abraziune
        - Rezistența UV
        - Stabilitatea la presiune
        - Durabilitatea pe termen lung
    - title: Inginerie Structurală
      body: Ambarcațiunile gonflabile necesită un echilibru precis între rigiditate, greutate, portabilitate și stabilitate. Ingineria Paddle Board Overstock se concentrează pe optimizarea acestor factori prin tehnologia nucleu drop-stitch și construcția avansată a cusăturilor.
      items:
        - Rigiditate
        - Optimizarea greutății
        - Portabilitate
        - Stabilitate
    - title: Precizia Producției
      body: 'Fiecare produs trece prin procese controlate: pregătirea materialului, tăierea precisă, sudarea și lipirea, asamblarea, inspectarea calității și verificarea performanței.'
      items:
        - Pregătirea Materialului
        - Tăiere Preciză
        - Sudare & Lipire
        - Asamblare & Controlul Calității
    - title: Ingineria pentru Scenarii de Utilizare
      body: Produsele sunt dezvoltate în jurul aplicațiilor reale — recreere, aventură și utilizare profesională — asigurând că fiecare design îndeplinește cerințele specifice ale mediului pentru care este destinat.
      items:
        - Recreere
        - Aventură
        - Professional
        - Comercial
trustSignals:
  tagline: Semnale de Încredere
  title: De ce Paddle Board Overstock este un partener de încredere
  manufacturing:
    title: Capacitate de Producție
    body: Facilitate de producție de 12.000 m² cu 200-300 de muncitori calificați și 14 ingineri R&D +. Sistem de management al calității certificat ISO 9001 ISO. Producție anuală de 15.000 de unități de ambarcațiuni gonflabile pentru 50 de + țări.
    stats:
      - label: Dimensiunea Facilității
        value: 12,000 m²
      - label: Forța de muncă
        value: 200-300
      - label: Ingineri de cercetare și dezvoltare
        value: 14+
      - label: Capacitate anuală
        value: 15,000
  quality:
    title: Angajamentul pentru Calitate
    body: De la inspectarea materialelor până la testarea finală, Paddle Board Overstock menține procese de calitate sistematice pentru a livra produse marine fiabile. Fiecare unitate trece prin testare la presiune, inspectarea cusăturilor și verificarea performanței înainte de expediere.
    items:
      - CE Certificat — 64 de modele respectă standardele de siguranță europene
      - ISO 9001:2015 — Sistem de management al calității certificat
      - UKCA Marcat — conformitatea pieței din UK
  global:
    title: Prezență Globală
    body: Paddle Board Overstock deservește clienți din mai multe piețe globale, susținând distribuitorii, mărcile de echipamente outdoor și utilizatorii profesioniști din domeniul marin în 50+ de țări din Europa, Asia-Pacific, Americi, Orientul Mijlociu și Africa.
