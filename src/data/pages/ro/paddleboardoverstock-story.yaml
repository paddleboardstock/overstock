timeline:
  - year: '2012'
    title: Fundația pentru Producție Maritimă
    body: Paddle Board Overstock a început ca un atelier specializat de plăci cu palete gonflabile în Weihai, China, dedicat măiestriei marine și fabricării plăcilor. Accentul inițial a fost pe construirea de produse gonflabile fiabile prin experiență practică în inginerie și disciplină în fabricație.
  - year: '2015'
    title: Primele exporturi
    body: Comenzile inițiale de export au ajuns în Japonia și Coreea, marcând Paddle Board Overstock intrarea lui pe piețele internaționale. Compania a început să deservească vâslaștii și pasionații de sporturi nautice din afara Chinei.
  - year: '2018'
    title: Extinderea fabricii
    body: Mutat într-o facilitate de producție de 12.000 m². A adăugat linii de sudură RF și drop-stitch capacitate de producție, permițând producția la scară largă și îmbunătățirea sistemelor de control al calității.
  - year: '2020'
    title: Înființarea Centrului de Cercetare și Dezvoltare
    body: A deschis un centru dedicat de cercetare și dezvoltare cu PVC laborator de țesături, rezervor de testare hidrodinamică și studio de simulare CAD/FEA. Dezvoltarea produsului s-a extins pentru a se concentra pe construcții ușoare, durabilitate îmbunătățită și design centrat pe utilizator.
  - year: '2022'
    title: Creștere globală
    body: S-a extins la 14 ingineri R&D și 200+ de muncitori. Plăcile au ajuns la vâslaștii din Europa, Americi și Asia-Pacific, transportând către 50 de+ țări.
  - year: '2024'
    title: Studio de Inovație și Design
    body: A lansat un studio complet de design și inovație pentru noi serii de plăci, de la concept până la producție. Am extins platformele noastre emblematice pentru seria de artă și platformele turistice.
  - year: '2026'
    title: Construirea viitorului explorării apei
    body: Astăzi, Paddle Board Overstock continuă să SUP dezvolte plăci gonflabile, echipamente de vâslit și soluții marine personalizate — conectând oameni și organizații cu apele lumii. 50 de+ țări au fost deservite, cu o capacitate anuală de 15.000 de unități.
content_founding:
  tagline: Începutul
  title: Născut pe malul apei
  subtitle: 'Paddle Board Overstock a început într-un atelier de coastă din Weihai cu o singură placă și o viziune: să construiască plăci cu palete gonflabile care să poată face față condițiilor marine reale.'
  paragraphs:
    - În 2012, fondatorii noștri au observat un gol pe piață — majoritatea plăcilor gonflabile erau fie accesibile, dar nesigure, fie de înaltă calitate, dar extrem de scumpe. Ei credeau că există loc pentru un producător care să ofere atât calitate, cât și valoare.
    - Prima carenă a fost construită manual, testată în apele locale și rafinată pe baza feedback-ului real de la pescari și mici operatori comerciali. Acest ciclu de feedback — construire, testare, ascultare, îmbunătățire — rămâne astăzi în centrul filosofiei noastre inginerești.
    - Până în 2015, vestea se răspândise dincolo de Weihai. Practicanți de paddle și magazine de sporturi nautice din întreaga Asia au început să ceară plăci. Ceea ce a început ca un atelier local devenea un brand global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock atelier de producție timpurie și fabricare
content_growth:
  tagline: Creștere și inovație
  title: De la atelier la facilități de 12.000 m²
  subtitle: Investițiile continue în oameni, echipamente și proces au transformat Paddle Board Overstock într-o facilitate modernă de producție marină.
  paragraphs:
    - Pe măsură ce cererea a crescut, a crescut și facilității noastre. Ne-am extins de la un atelier mic la o fabrică de 12.000 m² cu linii de producție dedicate pentru plăci SUP, accesorii și echipamente de siguranță.
    - Am investit în CNC mașini de tăiere, echipamente de sudură de înaltă frecvență, linii de producție drop stitch și platforme de testare cuprinzătoare — ceea ce ne-a permis să controlăm fiecare aspect al calității producției.
    - Astăzi, echipa noastră de 200-300 de persoane include ingineri marini, chimiști de materiale, specialiști în controlul calității și meșteșugari calificați — mulți dintre ei fiind alături de Paddle Board Overstock încă din primele zile.
founder:
  tagline: Cunoaște-l pe Fondator
  title: Construit de un Waterman
  subtitle: Fondatorul David Chen reunește expertiza în producție și o pasiune de-o viață pentru sporturile nautice — o combinație care definește modul în care Paddle Board Overstock abordează dezvoltarea produselor.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fondator al Paddle Board Overstock
  story:
    - David Chen a crescut pe coasta din Weihai, unde marea nu era o destinație de vacanță, ci un mod de viață. Și-a petrecut tinerețea făcând paddle, navigând și pescuind în Marea Galbenă — experiențe care i-au oferit o înțelegere intuitivă a ceea ce trebuie să suporte plăcile de paddle.
    - Înainte de a fonda Paddle Board Overstock, David a petrecut un deceniu în producția marină, lucrând în producție, calitate și comerț internațional. A condus programe de producție și calitate pentru piețele europene și nord-americane, învățând direct așteptările practicanților de paddle din întreaga lume.
    - 'În 2012, a fondat Paddle Board Overstock cu o misiune simplă: să construiască plăci de paddle gonflabile în care să aibă încredere pentru propriei familii pe apă. Acest standard personal — aș folosi eu asta? — rămâne testul final pentru fiecare produs care părăsește fabrica.'
    - Astăzi, David conduce strategia de produs și supraveghează echipa de cercetare și dezvoltare, revizuind personal noile modele și testând prototipurile pe apele din apropiere de Weihai. Crede că produsele excelente provin din înțelegerea atât a ingineriei, cât și a experienței.
philosophy:
  tagline: Filosofia brandului
  title: Libertatea inginerească pe apă
  body: Libertatea pe apă nu înseamnă doar mișcare. Reprezintă descoperirea de locuri noi, crearea de experiențe în aer liber, conectarea oamenilor cu natura și facilitarea misiunilor profesionale. Ingineria face posibilă această libertate.
  pillars:
    - title: Fiabilitatea pe primul loc
      body: Mediile acvatice cer încredere. Produsele Paddle Board Overstock sunt proiectate ținând cont de stabilitate, durabilitate, siguranță și performanță constantă.
    - title: Design centrat pe om
      body: Produsele ar trebui să servească oamenilor, nu tehnologiei. Fiecare decizie de design începe cu înțelegerea modului în care oamenii își folosesc plăcile, unde explorează și ce provocări întâmpină.
    - title: Explorare accesibilă
      body: Apa nu ar trebui să aparțină doar experților. Paddle Board Overstock creează echipamente care permit mai multor persoane să experimenteze în siguranță râuri, lacuri, oceane și medii de coastă.
    - title: Inovație continuă
      body: Inovația nu înseamnă doar crearea de produse noi. Îmbunătățește fiecare detaliu — materiale, structuri, producție și experiența utilizatorului.
engineeringDna:
  tagline: ADN ingineresc
  title: Cum Paddle Board Overstock Creează Produse
  areas:
    - title: Știința Materialelor
      body: Paddle Board Overstock se concentrează pe selectarea materialelor adecvate pentru diferite medii marine. Considerațiile principale includ rezistența la abraziune, rezistența la UV, stabilitatea la presiune și durabilitatea pe termen lung.
      items:
        - Rezistența la abraziune
        - Rezistența UV
        - Stabilitatea la presiune
        - Durabilitatea pe termen lung
    - title: Inginerie Structurală
      body: Plăcile de paddle gonflabile necesită un echilibru precis între rigiditate, greutate, portabilitate și stabilitate. Ingineria Paddle Board Overstock se concentrează pe optimizarea acestor factori prin tehnologia de bază drop-stitch și construcția avansată a cusăturilor.
      items:
        - Rigiditate
        - Optimizarea greutății
        - Portabilitate
        - Stabilitate
    - title: Precizia Producției
      body: 'Fiecare produs trece prin procese controlate: pregătirea materialului, tăierea precisă, sudarea și lipirea, asamblarea, inspectarea calității și verificarea performanței.'
      items:
        - Pregătirea Materialului
        - Tăiere Preciză
        - Sudare & Lipire
        - Asamblare & Controlul Calității
    - title: Ingineria pentru Scenarii de Utilizare
      body: Produsele sunt dezvoltate în jurul aplicațiilor reale de vâslit — recreere, aventură, familie și turism — asigurând că fiecare design satisface cerințele specifice ale mediului său destinat.
      items:
        - Recreere
        - Aventură
        - Familial
        - Turism
trustSignals:
  tagline: Semnale de Încredere
  title: De ce Paddle Board Overstock este un brand în care poți avea încredere
  manufacturing:
    title: Capacitate de Producție
    body: Facilitate de producție de 12.000 m² cu 200-300 de lucrători calificați și 14 ingineri de cercetare și dezvoltare. Producție anuală de 15.000 de plăci, deservind paddleri din 50 de țări.
    stats:
      - label: Dimensiunea Facilității
        value: 12,000 m²
      - label: Forța de muncă
        value: 200-300
      - label: Ingineri de cercetare și dezvoltare
        value: 14+
      - label: Capacitate anuală
        value: 15,000
  quality:
    title: Angajamentul pentru Calitate
    body: De la inspectarea materialelor până la testarea finală, Paddle Board Overstock menține procese sistematice de calitate pentru a livra produse marine de încredere. Fiecare unitate trece prin testarea presiunii, inspecția cusăturilor și verificarea performanței înainte de expediere.
    items:
      - Rată a livrărilor fără defecte de 99,3%
      - 100% testate la presiune de 1,25 ori valoarea nominală
      - Garanție de 2 ani pentru fiecare placă
  global:
    title: Prezență Globală
    body: Se livrează direct paddlerilor din 50 de țări din Europa, Asia-Pacific, Americi, Orientul Mijlociu și Africa.
comparison:
  tagline: Poziționarea brandului
  title: Paddle Board Overstock pe piață
  position: Marcă direct de la fabrică, combinând ingineria plăcilor gonflabile cu producția internă și 12 ani de experiență în producție.
  strengths:
    - Expertiză în ingineria plăcilor gonflabile
    - Prețuri direct de la fabrică, fără adaos comercial
    - Pachete complete — placă, pompă, vâslă și echipament într-o singură cutie
    - Facilitate de producție de 12.000 m² în Weihai
  bestFor:
    - Paddleri în căutare de valoare directă de la fabrică, fără compromis la calitate
    - Familii și începători care descoperă paddleboarding-ul stand-up
    - Paddleri de tur, yoga și fitness care au nevoie de platforme specializate
    - Flote de închirieri și cluburi care au nevoie de plăci durabile și ușor de întreținut
