hero:
  tagline: Povestea noastră
  title: Paddle Board Overstock — Libertatea inginerească pe apă
  subtitle: 'De la un atelier de coastă la un producător marin global — călătoria noastră se bazează pe o convingere încăpățânată: ambarcațiunile de apă ar trebui proiectate așa cum contează, pentru că contează.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock fabrică și fabrică maritimă din Qingdao
