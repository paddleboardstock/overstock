stories:
  tagline: Povești ale exploratorilor
  title: Aventuri reale de la oameni reali
  subtitle: Ascultă de la canoiști, familii și profesioniști care folosesc echipamente Aquafarer pe apă.
  items:
    - name: Sarah și Mike
      title: Proprietarii Explorer 11, Canada
      content: Am luat Explorer 11-urile noastre într-o excursie de o săptămână prin Parcul Algonquin. Au gestionat portajele și traversările lacurilor minunat. Construcția drop-stitch a însemnat că am putut umfla până la 15 PSI și să obținem performanță de placă tare de la o placă pliabilă.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Parcul Algonquin, Canada
    - name: Carlos R.
      title: Călărețul Cheetah Surge, Spania
      content: Cheetah Surge este alegerea mea pentru plimbările pe coastă. Designul vibrant atrage priviri pe plajă, iar stabilitatea îmi oferă încredere în valuri ușoare. Se comportă minunat, fie că fac tururi, fie că doar mă bucur de apus.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Spania
    - name: Lina și familia
      title: Vâslași de Lotus curgător, Suedia
      content: Aventuri de weekend în familie în arhipelag. Flowing Lotus este suficient de stabil pentru ca fiica mea să stea în picioare în timp ce eu vâslesc. Se umflă în mai puțin de 10 minute — nu este necesar trailer, doar distracție pură în familie pe apă.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Arhipelagul Stockholm, Suedia
    - name: Locotenent-comandor Andres
      title: Exploratorul Ocean Voyager, Filipine
      content: Folosesc Ocean Voyager-ul meu pentru tururi costiere de lungă distanță în jurul Palawanului. După luni de utilizare zilnică în condiții tropicale, placa încă funcționează ca nouă. Forma pentru turism taie valurile care ar opri plăcile mai slabe.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipine
    - name: Emma T.
      title: Tropical Breeze pentru începători, Australia
      content: Nu mai fusesem niciodată pe un SUP până acum. Tropical Breeze este atât de stabil că m-am simțit încrezător încă de la prima încercare. Acum vâslesc în fiecare weekend. Curba de învățare este practic zero — și placa arată uimitor pe apă.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
