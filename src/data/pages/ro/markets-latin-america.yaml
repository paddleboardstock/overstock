direct_answer: Paddle Board Overstock furnizează plăci gonflabile noi în stoc SUP către mici retaileri din America Latină — de la Mexic și Brazilia până la Columbia, Peru, Chile și Argentina. Comenzile en-gros încep de la 5 plăci, cu modele mixte binevenite, iar fiecare comandă este expediată din Weihai, China, prin transport aerian expres sau transport maritim consolidat. Plăcile sunt 100% testate sub presiune și acoperite de SUP Garanția de 2 Ani.
tldr_points:
  - En-gros de la 5 plăci — modele mixte într-o singură comandă, prețuite după cantitatea totală
  - Marfă aeriană expresă sau marfă mare consolidată din Weihai, China
  - Piețele de limbă spaniolă și portugheză deservite în întreaga regiune
  - 100% testată la presiune, SUP garanție de 2 ani pentru fiecare placă
overview_section:
  tagline: Prezentare generală a pieței
  title: Piața latino-americană SUP
  paragraphs:
    - America Latină este una dintre cele mai rapide piețe de stand-up paddle în creștere din lume. Coaste lungi pe două oceane, economii consacrate în turism de plajă și o cultură puternică a sporturilor de bord oferă retailerilor independenți din Tulum până la Florianópolis o bază tot mai mare de clienți — turiști care iau prima lecție, vâslaști de weekend și o comunitate locală în creștere SUP de curse și surf.
    - The retail landscape is dominated by small and mid-sized independent shops: Școli de vâslit pe malul mării care vând ceea ce închiriază, magazine de surf care adaugă SUP linii și vânzători online care importă direct pentru prima dată. Aceste afaceri rareori au nevoie de containere întregi cu un singur model — au nevoie de 5–20 de plăci pe comandă, amestecate între modele all-around prietenoase pentru începători și câteva ediții premium.
  customer_types:
    - title: Comercianții Beach Town
      description: Magazinele din orașele turistice care deservesc turiști — au nevoie de plăci durabile pentru începători în volum, plus câteva modele premium pentru expunere și vânzare.
    - title: Școli de vâslă și flote de închiriere
      description: Școlile asociază lecțiile cu retailul, iar flotele de închiriere reîmprospătează panourile în fiecare sezon cu comenzi de modele mixte.
    - title: Vânzători online
      description: Vânzătorii de comerț electronic în limba spaniolă și portugheză care introduc această SUP categorie pe piața lor națională fără riscul la scară de container.
shipping_section:
  title: Nava spre America Latină
  paragraphs:
    - Comenzile sunt expediate din baza noastră logistică din Weihai, China. Mostre de costume de transport aerian expres, 1–3 comenzi de îmbarcare și reaprovizionări urgente; Transportul maritim consolidat este ruta economică pentru 5–20 de comenzi en-gros către porturile majore din regiune.
    - Oferim documente de export complete și exacte — facturi comerciale și liste de ambalare — pentru a menține depășirea vamală fără probleme. Taxele și taxele de import sunt stabilite de țara dumneavoastră și plătite de importator; nu includem niciodată promisiuni vagi de tip "taxe incluse" într-o ofertă de transport.
  customs_note: Regulile de import și tarifele vamale variază semnificativ între țările din America Latină. Verifică regimul actual de import al țării tale pentru echipamente de sporturi nautice gonflabile înainte de a comanda și cere-ne orice documentație suplimentară de care brokerul tău are nevoie.
faq_section:
  title: Întrebări frecvente despre America Latină
  items:
    - q: Pot primi o ofertă în spaniolă sau portugheză?
      a: Echipa noastră lucrează cu cumpărători din întreaga Americă Latină și poate gestiona ofertele și confirmările comenzilor pentru clienții vorbitori de spaniolă și portugheză. Întreabă în cererea ta.
    - q: Expediați în țara mea din America Latină?
      a: Expediem în toată regiunea — Mexic, Brazilia, Columbia, Peru, Chile, Argentina, Ecuador și nu numai. Confirmați destinația exactă în cererea de ofertă și vom verifica serviciul de marfă actual.
    - q: Care este minimul en-gros pentru retailerii latino-americani?
      a: În total cinci plăci, combinând orice modele disponibile în stoc. Acest total stabilește nivelul tău de preț — poți combina ediții all-around, touring și art într-o singură livrare.
    - q: Cine plătește taxele vamale în țara mea?
      a: Tu faci acest lucru, ca importator, conform regulilor țării tale. Noi furnizăm documentația corectă și completă (factura comercială, lista de ambalare) astfel încât vămuirea să fie previzibilă — vezi pagina noastră de transport internațional pentru imaginea completă.
