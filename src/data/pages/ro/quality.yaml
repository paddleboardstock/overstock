tests:
  - title: Testarea Presiunii
    standard: ISO 6185-1 | Specificații interne AF-PT-001
    description: Camerele gonflabile sunt presurizate la 1,25 ori limita recomandată de funcționare și menținute timp de 30 de minute. Dezintegrarea presiunii este măsurată pentru a valida etanșeitatea la aer și integritatea structurală a materialelor și a cusăturilor.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Testare de impact
    standard: Specificații interne AF-IT-002
    description: Produsele sunt supuse unor impacturi controlate din cauza greutăților standard de cădere și a aparatului pendul. Aceasta evaluează rezistența la perforare, propagarea rupturii și reziliența structurală împotriva coliziunilor cu obstacole, docuri și resturi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Testarea rezistenței
    standard: ASTM G154 |ISO 4892-3
    description: Probe de material sunt expuse la lămpi UVA-340 în camere de intemperie accelerată timp de 1.000+ de ore. Măsurăm schimbarea culorii (Delta E), retenția luciului și pierderea rezistenței la tracțiune pentru a UV valida pachetele stabilizatorilor.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Testarea rezistenței la abraziune
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Probele de material sunt supuse la roți abrazive CS-10 sub sarcini de 500g/1.000g timp de 1.000 de cicluri. Pierderea de masă și gradarea uzurii vizuale determină durabilitatea stratului în fața nisipului, pietrișului și lansărilor repetate.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Testarea performanței la temperaturi joase
    standard: Specificație internă AF-LT-003 | MIL-STD-810G
    description: Produsele asamblate și cupoanele de materiale sunt condiționate la -20°C, -10°C și 0°C timp de 24 de ore, apoi testate prin flex. Verificăm acest PVC lucru și Hypalon rămânem flexibile fără crăpături sau delaminări.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Testarea flotabilității și capacității de încărcare
    standard: ISO 6185-1 |ISO 12402
    description: Produsele sunt încărcate incremental până la o capacitate nominală de 1,25x într-un pool controlat. Sunt înregistrate freeboard-ul, stabilitatea și performanța auto-drenată. Capacitatea nominală a fiecărui model este verificată matematic și empiric.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Testarea manevrabilității
    standard: Specificație internă AF-MT-004
    description: Testele pe apă măsoară raza de viraj, accelerația, timpul de planare și răspunsul cu palete/motor pe o gamă largă de condiții de încărcare. Caracteristicile reale de manevrabilitate sunt validate în raport cu ținte de proiectare.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Testarea etanșeității la apă
    standard: ISO 6185-1 §7.3 | Specificație internă AF-WT-005
    description: Fiecare produs asamblat este testat prin pulverizare la 0,5 bar pe toate îmbinările, supapele și fitingurile. Un test de scufundare presurizată de 5 minute validează etanșeitatea camerei și a valvelor. Standardul fără scurgeri înainte de livrare.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
