commitment:
  title: Angajamentul nostru
  body: Prin aceste proceduri riguroase de testare, {SITE} le oferă clienților siguranța că plăcile noastre gonflabile SUP nu sunt doar performante, ci și construite pentru a rezista — asigurând numeroase aventuri plăcute și sigure pe apă. Laboratorul nostru de calitate operează independent de producție și raportează direct managementului.
  cta: Solicită documentația testării
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock operează un program de testare a calității cu 8 protocoale care acoperă presiunea, impactul, UV, abraziunea, temperaturile scăzute, flotabilitatea, manevrabilitatea și etanșeitatea. Rata de defecte 99,3% în livrările din ultimele 12 luni.
  points:
    - '8 protocoale de testare: presiune, impact, UV, abraziune, temperaturi scăzute, flotabilitate, manevrabilitate și etanșeitate.'
    - Rata de defecte de 99,3% pe livrările din ultimele 12 luni
    - Fiecare unitate trece printr-un timp de reținere de 24-48h la 1,25x presiunea nominală cu toleranță maximă de cădere de 5%.
    - UV testare accelerată a intemperiilor (1.000+ ore) și testarea rezistenței la abraziunea stratului de acoperire.
testing_note: Fiecare test urmează protocoale interne documentate. Rezultatele testelor sunt înregistrate, trasabile și revizuite de laboratorul nostru de calitate independent.
