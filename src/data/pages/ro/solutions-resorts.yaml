testimonial:
  content: Aquafarer și-a proiectat și echipat întregul nostru program de activități pe plajă la trei proprietăți de resort. 80 SUPs, 40 caiace, infrastructură de siguranță și instruirea personalului — totul livrat într-o singură expediere. Participarea oaspeților la activitățile acvatice a crescut cu 60% în primul sezon.
  name: Sophie Laurent
  title: Director al Experienței Oaspeților, Azure Bay Resorts — Phuket, Thailanda
content_segments:
  tagline: Profiluri Resort
  title: Soluții de ospitalitate pe malul apei<br />După tipul proprietății
  subtitle: Fiecare resort are un profil unic al oaspeților, un mix de activități și un ritm operațional — de la lodge-uri eco boutique până la resorturi luxoase întinse pe plajă. Proiectăm programe de sporturi acvatice care se potrivesc clasei proprietății și așteptărilor oaspeților.
  items:
    - title: Resorturi de lux pe plajă
      subtitle: Transferuri VIP, activități acvatice, experiență premium pentru oaspeți
      description: Proprietăți de lux pe plajă — Four Seasons, Aman și grupuri similare de lux — unde sporturile acvatice sunt o atracție principală pentru oaspeți, crescând scorurile de satisfacție și veniturile suplimentare. Flota trebuie să arate premium, să ofere varietate pentru toate vârstele și nivelurile de abilități și să se integreze perfect cu sistemele de concierge și rezervare existente ale resortului. Așteptările privind aspectul oaspeților sunt extrem de ridicate — condiția și prezentarea echipamentului influențează direct recenziile de 5 stele.
      features:
        - 'Flotă premium de marcă: SUPs, caiace, bărci cu pedale și tender-uri mici RIB'
        - 'Prezentare pregătită pentru oaspeți: culorile resortului, branding cu logo, expunere echipamente aranjată'
        - Mic luxury RIB pentru transferuri VIP cu tapițerie personalizată și potrivire de culori
        - 'Infrastructură de siguranță integrată: linii de plutire, posturi de salvamar, AED'
        - 'Managementul veniturilor: șabloane de prețuri dinamice, instruire pentru vânzări suplimentare, pachete combinate'
    - title: Resorturi pe insule private
      subtitle: Transport pentru oaspeți indiferent de vreme — zero timp de nefuncționare, fiabilitate absolută
      description: Stațiunile private de pe insulă operează în locații izolate, unde barca este singura legătură cu continentul. Transferurile zilnice de oaspeți, transporturile de aprovizionare și evacuările medicale de urgență depind de o singură navă — orice perioadă de nefuncționare afectează direct experiența oaspeților și operațiunile resortului. Acești operatori au nevoie de o barcă care să funcționeze fiabil în toate condițiile meteo, să necesite întreținere minimă și să aibă sisteme de rezervă pentru fiabilitate critică pentru misiune. Barca trebuie, de asemenea, să se prezinte frumos când oaspeții ajung pe insulă.
      features:
        - Configurație pentru orice RIB vreme, cu carcasă completă și tuburi rezistente
        - Asigurare pentru două motoare sau motoare de rezervă pentru operațiuni fără perioade de nefuncționare
        - Hypalon Construcție de calitate comercială pentru o durată de viață de 5-8 ani în servicii la distanță
        - Design ușor de întreținut, cu componente accesibile pentru întreținere la fața locului
        - Branding personalizat pentru stațiuni și tapițerie premium care se potrivesc cu estetica insulei
    - title: Resorturi Lacului și Eco-Resorturi
      subtitle: Experiențe integrate în natură pentru oaspeți
      description: Proprietăți pe malul lacului, eco-lodge-uri și refugii în natură care oferă activități acvatice liniștite, cu impact redus, care completează mediul natural. Echipamentele trebuie să fie nemotorizate acolo unde este posibil, ușor de depozitat în hangare cu spațiu limitat și silențioase în utilizare pentru a păstra experiența ambientală pentru toți oaspeții.
      features:
        - 'Flotă nemotorizată: SUPs, caiace, canoe și bărci cu vâsle'
        - Stații de umflare a pompelor electrice silențioase pentru utilizarea la cerere a oaspeților
        - Materiale și ambalaje ecologice, aliniate cu brandingul sustenabil
        - Rafturile de depozitare și sistemele de organizare a hangarelor pentru bărci includeau
    - title: Cluburi de plajă
      subtitle: Transferuri pentru oaspeți, divertisment, mici lux RIBs
      description: Cluburile de plajă funcționează într-un mediu plin de energie și vizual, unde echipamentele fac parte din atmosferă. Au nevoie de mici lucruri RIBs de lux pentru transferurile oaspeților de la hoteluri sau docuri din apropiere, precum și de jucării acvatice pentru divertismentul oaspeților — tractarea jet ski-urilor, tobogane gonflabile și plăci cu vâsle. Flota trebuie să arate elegant, să fie ușor de operat și să reziste utilizării zilnice de către oaspeți cu niveluri diferite de competență. Depozitarea și desfășurarea rapidă sunt esențiale în orele de vârf.
      features:
        - Compact luxury RIB (3,3-4,3m) pentru transferuri pentru oaspeți și servicii la licitație
        - 'Jucării acvatice: remorcabile gonflabile, SUP scânduri, caiace pentru divertisment pentru oaspeți'
        - Culoare personalizată și branding care se potrivesc cu identitatea vizuală a clubului de plajă
        - Sisteme de lansare și recuperare rapidă pentru operațiuni cu rotație ridicată
        - Hypalon Construcție durabilă pentru expunerea zilnică la apă sărată și UV
    - title: Cluburi Private pentru Membri și Cluburi de Iahturi
      subtitle: Transport portuar, tendere pentru membri, sporturi acvatice exclusive
      description: Cluburi private unde sporturile nautice și transportul cu barca sunt un beneficiu pentru membri, nu un factor de venituri. Echipamentele trebuie să respecte standarde estetice mai ridicate, să fie disponibile la cerere pentru membri și să necesite o supraveghere minimă a personalului. Cluburile de iahturi din marină au nevoie în mod specific de tendere pentru transportul portuar — mutând membrii între doc, acostare și țărm. Depozitarea și întreținerea trebuie să fie invizibile pentru membri.
      features:
        - Tendere de top RIB pentru transportul portuar și serviciul de transfer al membrilor
        - 'Echipamente premium: EVA deck-uri, culori personalizate pentru membri, tapițerie cu brand'
        - Sistem de check-out self-service pentru accesul membrilor fără personal
        - Depozitare în afara sezonului și program anual de reîmprospătare
    - title: Hoteluri axate pe aventură și activitate
      subtitle: Tururi ghidate, SUP yoga, excursii de snorkeling, activități de grup
      description: Proprietăți care se poziționează ca destinații de aventură — oferind tururi ghidate, SUP yoga, plimbări cu paddle-ul la apus, excursii de snorkeling și activități de grup. Flota trebuie să susțină atât modelele de închiriere liberă, cât și pe cele de programe ghidate, cu echipamente care să treacă fără probleme între utilizarea independentă a oaspeților și tururile conduse de instructori. Aceste proprietăți au nevoie de echipamente durabile pentru un trafic intens, cu curățare ușoară între grupurile de oaspeți.
      features:
        - Flotă mixtă versatilă care susține modele de închiriere și tururi ghidate +
        - Caiace tandem și platforme extra-stabile SUP pentru activități de grup
        - 'Echipament pentru ghizi: plăci pentru instructori, cutii etanșe, comunicații impermeabile'
        - 'Rotire sezonieră a echipamentului: flotă de vară → program de depozitare de iarnă'
        - Construcție durabilă, evaluată pentru utilizarea zilnică de către oaspeți cu întreținere minimă
