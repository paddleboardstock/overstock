testimonial:
  content: Paddle Board Overstock a proiectat și echipat întregul nostru program de activități pe plajă în trei proprietăți de resort. 120 SUPs, infrastructură de siguranță și instruire a personalului — toate livrate într-o singură expediere. Participarea oaspeților noștri la activitățile acvatice a crescut cu 60% în primul sezon.
  name: Sophie Laurent
  title: Director al Experienței Oaspeților, Azure Bay Resorts — Phuket, Thailanda
content_segments:
  tagline: Profiluri Resort
  title: Soluții de ospitalitate pe malul apei<br />După tipul proprietății
  subtitle: Fiecare resort are un profil unic al oaspeților, un mix de activități și un ritm operațional — de la lodge-uri eco boutique până la resorturi luxoase întinse pe plajă. Proiectăm programe de sporturi acvatice care se potrivesc clasei proprietății și așteptărilor oaspeților.
  items:
    - title: Resorturi de lux pe plajă
      subtitle: Transferuri VIP, activități acvatice, experiență premium pentru oaspeți
      description: Proprietăți de lux pe plajă — Four Seasons, Aman și grupuri similare de lux — unde sporturile acvatice sunt o atracție principală pentru oaspeți, crescând scorurile de satisfacție și veniturile suplimentare. Flota trebuie să arate premium, să ofere varietate pentru toate vârstele și nivelurile de abilități și să se integreze perfect cu sistemele de concierge și rezervare existente ale resortului. Așteptările privind aspectul oaspeților sunt extrem de ridicate — condiția și prezentarea echipamentului influențează direct recenziile de 5 stele.
      features:
        - Flotă premium de SUPs în culori asortate ale resortului
        - 'Prezentare pregătită pentru oaspeți: culorile resortului, branding cu logo, expunere echipamente aranjată'
        - Plăci din seria de artă semnată pentru experiențe premium ale oaspeților și momente pentru fotografii
        - 'Infrastructură de siguranță integrată: linii de plutire, posturi de salvamar, AED'
        - 'Managementul veniturilor: șabloane de prețuri dinamice, instruire pentru vânzări suplimentare, pachete combinate'
    - title: Resorturi pe insule private
      subtitle: Activități acvatice liniștite, autosuficiente pentru oaspeți
      description: 'Stațiunile private de pe insule operează în locații izolate, unde logistica este complexă și fiecare livrare contează. Activitățile de apă pentru oaspeți trebuie să fie autosuficiente: echipamente care se depozitează compact, se umflă la cerere, necesită întreținere minimă și se prezintă frumos la sosirea oaspeților. Planificăm programe de flotă în jurul ferestrelor pentru hidroavioane și marfă, iar construcțiile noastre durabile mențin echipamentele pregătite pentru oaspeți pe parcursul sezoanelor lungi, fără sprijin din partea continentului.'
      features:
        - Flotă compactă gonflabilă — nave și provizii eficiente pe insule izolate
        - PVC Construcții de calitate comercială pentru oaspeți pe mai multe sezoane
        - Întreținere ușoară la fața locului, cu kituri de reparații incluse și ghidaj video
        - Branding personalizat pentru stațiuni care se potrivește cu estetica insulei
    - title: Resorturi Lacului și Eco-Resorturi
      subtitle: Experiențe integrate în natură pentru oaspeți
      description: Proprietăți pe malul lacului, eco-lodge-uri și refugii în natură care oferă activități acvatice liniștite, cu impact redus, care completează mediul natural. Echipamentele trebuie să fie nemotorizate acolo unde este posibil, ușor de depozitat acolo unde spațiul este limitat și silențioase în utilizare pentru a păstra experiența ambientală pentru toți oaspeții.
      features:
        - SUP Flotă nemotorizată în seria de artă inspirată de natură
        - Stații de umflare a pompelor electrice silențioase pentru utilizarea la cerere a oaspeților
        - Materiale și ambalaje ecologice, aliniate cu brandingul sustenabil
        - Rafturile de depozitare și sistemele de organizare la docuri includeau
    - title: Cluburi de plajă
      subtitle: Divertisment pentru oaspeți și atmosferă pe malul apei
      description: Cluburile de plajă funcționează într-un mediu plin de energie și vizual, unde echipamentele fac parte din atmosferă. Au nevoie de plăci de vâslit elegante pentru divertismentul oaspeților, SUP închirieri pentru activități de pe plajă și echipamente care să arate la fel de bine ca locația în sine. Flota trebuie să fie ușor de operat, să reziste utilizării zilnice de către oaspeți cu niveluri diferite de abilități și să fie desfășurată rapid în orele de vârf.
      features:
        - Serii de artă SUPs emblematice care servesc și ca decor pentru locație
        - Flotă gata de SUP închiriere pentru divertisment pentru oaspeți
        - Culoare personalizată și branding care se potrivesc cu identitatea vizuală a clubului de plajă
        - Sisteme de lansare și recuperare rapidă pentru operațiuni cu rotație ridicată
        - UV- construcție rezistentă pentru expunerea zilnică la apă sărată
    - title: Cluburi Private pentru Membri și Cluburi de Iahturi
      subtitle: Sporturi nautice membre și programe exclusive de canotaj
      description: Cluburi private unde sporturile nautice sunt un beneficiu pentru membri, nu un factor de venituri. Echipamentele trebuie să respecte standarde estetice mai ridicate, să fie disponibile la cerere pentru membri și să necesite o supraveghere minimă a personalului. Cluburile de iahturi din marină folosesc flote de marcă SUP pentru recreerea membrilor în jurul portului. Depozitarea și întreținerea trebuie să fie invizibile pentru membri.
      features:
        - SUP Flote premium de marcă pentru sporturile nautice membre
        - 'Echipamente premium: EVA deck-uri, culori personalizate pentru membri, tapițerie cu brand'
        - Sistem de check-out self-service pentru accesul membrilor fără personal
        - Depozitare în afara sezonului și program anual de reîmprospătare
    - title: Hoteluri axate pe aventură și activitate
      subtitle: Tururi ghidate, SUP yoga, excursii de snorkeling, activități de grup
      description: Proprietăți care se poziționează ca destinații de aventură — oferind tururi ghidate, SUP yoga, plimbări cu paddle-ul la apus, excursii de snorkeling și activități de grup. Flota trebuie să susțină atât modelele de închiriere liberă, cât și pe cele de programe ghidate, cu echipamente care să treacă fără probleme între utilizarea independentă a oaspeților și tururile conduse de instructori. Aceste proprietăți au nevoie de echipamente durabile pentru un trafic intens, cu curățare ușoară între grupurile de oaspeți.
      features:
        - Flotă mixtă versatilă care susține modele de închiriere și tururi ghidate +
        - Platforme extra-stabile SUP pentru activități de grup
        - 'Echipament pentru ghizi: plăci pentru instructori, cutii etanșe, comunicații impermeabile'
        - 'Rotire sezonieră a echipamentului: flotă de vară → program de depozitare de iarnă'
        - Construcție durabilă, evaluată pentru utilizarea zilnică de către oaspeți cu întreținere minimă
