section_faq:
  title: Întrebări Tehnice Frecvente
  questions:
    - q: Cum se compară drop-stitch cu construcția tradițională din coajă dură?
      a: Modelele moderne drop-stitch cu miez la 20 PSI ating 85–90% din rigiditatea comparabilă a coajelor dure din spumă EPS/fibra de sticlă, fiind totuși complet deflabil pentru transport. Compromisul este o greutate puțin mai mare și o rigiditate finală mai mică — dar pentru majoritatea aplicațiilor recreative și comerciale, diferența este nesemnificativă.
    - q: Ce densitate a firelor este considerată calitate premium?
      a: Țesăturile premium drop-stitch utilizează 2 fire per inch pătrat (aproximativ 3,100 fire pe m²) țesute din 1,680 DTEX fire de poliester. Țesăturile entry-level utilizează 1 fir per inch pătrat cu 1,100 DTEX fire.
    - q: Poate Hypalon fi sudata ca PVC?
      a: Nu. Hypalon/CSM nu pot fi sudate RF. Trebuie asamblate folosind ciment de contact aplicat manual, ceea ce face producția mai laborioasă și cusăturile dependente de abilitatea operatorului. PVC poate fi sudată RF sau cu aer cald pentru calitate constantă și automată a cusăturilor.
    - q: Care este presiunea maximă sigură pentru bărci pneumatice?
      a: Tuburile standard de bărci pneumatice funcționează la 8–12 PSI. Podelele Drop-stitch funcționează la 12–20 PSI. Modelele cu miez de înaltă presiune drop-stitch (SUPs) pot funcționa la 20–25 PSI. Fiecare produs include supape de deconectare a presiunii calibrate pentru a preveni supraumflarea.
    - q: Cât timp durează fabricarea unei bărci pneumatice personalizate?
      a: Producția standard OEM durează 30–45 de zile de la confirmarea comenzii până la FOB Qingdao. Dezvoltarea matrițelor personalizate adaugă 15–20 de zile pentru producția și testarea prototipurilor.
