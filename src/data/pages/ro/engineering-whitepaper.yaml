hero:
  tagline: Document Tehnic de Inginerie
  title: Drop-Stitch Tehnologie și Știința Materialelor:<br />Ingineria din spatele ambarcațiunilor gonflabile moderne
  subtitle: o referință tehnică autoritară care acoperă drop-stitch construcția de bază, PVC vs Hypalon comparația materialelor, testarea rigidității vaselor la presiune înaltă și standardele de fabricație pentru ambarcațiuni.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer Laborator R&D — testarea materialelor și inginerie
direct_answer: Drop-stitch tehnologia utilizează mii de fire interne din poliester care conectează straturile de țesătură superioare și inferioare ale unui miez gonflabil. Când este umflat la 15–20 PSI, aceste fire acționează ca elemente de tensiune, prevenind umflarea și creând o structură rigidă comparabilă cu construcția cu coajă tare. Combinat cu acoperiri avansate de țesătură PVC sau Hypalon și sudură RF, acest lucru permite realizarea de ambarcațiuni gonflabile portabile, performante, potrivite pentru utilizare profesională, comercială și recreativă.
section_drop_stitch:
  title: Drop-Stitch Inginerie Structurală
  subtitle: Cum transformă mii de fire o țesătură flexibilă într-o structură rigidă
  content: |
    Drop-stitch (cunoscută și sub numele de „drop-stitch fabrică” sau „drop-stitch miez”) reprezintă o descoperire în ingineria structurilor gonflabile. Principiul este deceptiv de simplu: mii de fire individuale de poliester sunt țesute simultan în două straturi separate de țesătură de bază, conectând panourile superioare și inferioare la un unghi de 90 de grade.

    Când camera sigilată este supusă presiunii, presiunea internă a aerului exercită forță egal în toate direcțiile — încercând să împingă panourile superioare și inferioare într-o formă cilindrică. Miile de fire drop-stitch împiedică această separare, transferând sarcina în tensiune de-a lungul axei firului. Rezultatul este un panou plat, rigid, care poate rezista la 15–20 PSI de presiune internă.

    La 20 PSI, un panou drop-stitch de 1 m² experimentează aproximativ 14.000 kg de forță internă totală — totuși matricea de fire îl menține perfect plat. Aceasta oferă structurilor drop-stitch un raport rezistență-greutate care rivalizează cu materialele rigide tradiționale.
section_materials:
  title: PVC vs Hypalon — Comparație Tehnică a Materialelor
  subtitle: date obiective pentru selectarea informatizată a materialelor în fabricarea ambarcațiunilor gonflabile
  table:
    columns:
      - header: Proprietate
      - header: PVC (Clorură de Polivinil)
      - header: Hypalon (CSM)
    rows:
      - property: Rezistența UV
        pvc: Bun (cu stabilizatori UV)
        hypalon: Excelent (inherent)
      - property: Rezistența la abraziune
        pvc: Bun
        hypalon: Foarte Bun
      - property: Rezistență la tracțiune
        pvc: 3.000–5.000 N/5cm
        hypalon: 2.500–4.000 N/5cm
      - property: Greutate pe m²
        pvc: 850–1,200 g
        hypalon: 1,100–1,500 g
      - property: Flexibilitate la rece
        pvc: -30°C
        hypalon: -20°C
      - property: Metoda de îmbinare
        pvc: Sudură RF / Sudură cu aer cald
        hypalon: Lipire manuală (adeziv de contact)
      - property: Reparabilitate
        pvc: Ușor (sudură la cald sau adeziv)
        hypalon: Necesită adeziv CSM
      - property: Costul materialului
        pvc: $8–15 / m²
        hypalon: $20–40 / m²
      - property: Durata de viață (soare tropical)
        pvc: 5–8 ani
        hypalon: 10–15 ani
      - property: Gama de culori
        pvc: Largă (spectru complet de culori)
        hypalon: Limitată (culori de bază)
      - property: Rezistență chimică
        pvc: Bună (grade rezistente la combustibil/ulei)
        hypalon: Excelentă (gamă largă de substanțe chimice)
section_testing:
  title: Protocoale de testare și siguranță
  subtitle: Cadrul de asigurare a calității Aquafarer pentru fiecare lot de producție
  protocols:
    - title: Test de menținere a presiunii de 1,25x
      description: Fiecare vas asamblat este umflat la 1,25x presiunea sa nominală de operare și menținut timp de 24–48 de ore. Orice scădere a presiunii care depășește 2% declanșează respingerea și refacerea.
      standard: ISO 6185
    - title: Test de rezistență la dezlipire a cusăturii
      description: Mostrele de cusături sudate și lipite din fiecare lot de producție sunt testate pentru rezistența la dezlipire folosind echipamente de tracțiune calibrate. Se cere o rezistență minimă la dezlipire de 4 kN/m.
      standard: ISO 2411
    - title: Test de tracțiune a țesăturii
      description: Rolele de țesătură primite sunt testate pentru rezistența la tracțiune și alungire în ambele direcții, urzeală și bătătură. Pragul de respingere este sub 3.000 N/5cm pentru PVC.
      standard: ISO 1421
    - title: Îmbătrânire accelerată UV
      description: Mostrele de material sunt supuse la 1.000+ ore de expunere accelerată UV în camerele de testare QUV. Pierderea maximă permisă a rezistenței la tracțiune este de 15%.
      standard: ASTM G154
    - title: Integritatea supapelor și fitingurilor
      description: Fiecare ansamblu de supapă este testat pentru integritatea etanșării la presiunea de 1,25x. Supapele cu retur sunt testate pentru performanța etanșării într-o singură direcție.
      standard: ISO 12402
