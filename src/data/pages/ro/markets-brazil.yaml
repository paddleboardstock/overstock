direct_answer: Paddle Board Overstock furnizează plăci gonflabile noi în stoc SUP pentru afaceri braziliene — școli și magazine de vâslit din Rio de Janeiro, Florianópolis și coasta de nord-est, operatori de închirieri și vânzători online. Comenzile en-gros încep de la 5 plăci cu modele mixte într-o singură livrare, trimise din Weihai, China, prin transport aerian expres sau marfă maritimă consolidată. Fiecare placă este testată 100% sub presiune și acoperită de SUP Garanția de 2 Ani.
tldr_points:
  - En-gros de la 5 plăci — modele mixte, prețuite după cantitatea totală
  - Deservind cultura plajelor din Brazilia de la Rio până în Nord-Est
  - Marfă aeriană expresă sau marfă mare consolidată din Weihai, China
  - 100% testată la presiune, SUP garanție de 2 ani pentru fiecare placă
overview_section:
  tagline: Prezentare generală a pieței
  title: Piața braziliană SUP
  paragraphs:
    - Brazilia este una dintre cele mai naturale piețe de stand-up paddle de pe Pământ. Cultura de plajă este cultură națională — de la scena Stand Up Paddle de pe lagunele din Rio și amestecul de valuri și apă plată din Florianópolis, până la apele calde și liniștite din nord-est din Ceará, Pernambuco și Bahia. Școlile de canotaj, închirierile de lagune și comunitățile de vânt din spate și SUP surf provin toate dintr-o populație uriașă, pasionată de sport.
    - Cumpărătorii brazilieni sunt, de obicei, afaceri operate de proprietari — standuri de închiriere pe marginea lagunei, școli de plajă, magazine de surf SUP care adaugă cozi și vânzători de comerț electronic interni în creștere. Ei comandă în cantități mici (5–20 de scânduri) și țin cont de durabilitatea pentru utilizarea zilnică și de competitivitatea prețurilor într-o piață cu costuri semnificative de import.
  customer_types:
    - title: Școlile Lagoon & Beach
      description: Școli și operatori de închirieri pe lagunele din Rio și pe plajele cu ape liniștite din nord-est, oferind lecții și închirieri pe oră.
    - title: Magazine de surf
      description: Comercianți consacrați de surf care adaugă ape liniștite și excursii SUP pentru comunitatea locală de vâslit.
    - title: Vânzători online
      description: Vânzătorii interni de comerț electronic importă SUP stocuri pentru a deservi piața internă uriașă a Braziliei.
shipping_section:
  title: Nava spre Brazilia
  paragraphs:
    - Comenzile sunt expediate din Weihai, China. Transportul aerian expres transportă mostre și 1–3 comenzi de îmbarcare către principalele aeroporturi ale Braziliei; Transportul maritim consolidat deservește 5–20 de comenzi en-gros prin porturi precum Santos și alte porți de coastă. Estimările de tranzit pentru destinația dumneavoastră sunt incluse în ofertă.
    - Furnizăm factura comercială și lista de împachetare necesare pentru eliberare, cu coduri HS corecte și valorile declarate. Taxele și taxele de import sunt plătite de importator conform regulilor braziliene.
  customs_note: Taxele de import din Brazilia pentru articole sportive sunt semnificative și variază în funcție de clasificarea produselor. Confirmați taxa actuală, TVA-ul și orice taxe la nivel de stat cu brokerul vamal (despachante) înainte de a comanda — oferim documentație completă, dar nu includem taxele de import în cotațiile de transport.
faq_section:
  title: Întrebări frecvente despre Brazilia
  items:
    - q: Se pot gestiona ofertele și suportul în portugheză?
      a: Da — lucrăm cu cumpărători vorbitori de portugheză. Întreabă în solicitarea ta și noi ne vom ocupa de ofertă și comandă în portugheză.
    - q: Sunt incluse taxele de import din Brazilia în prețurile voastre?
      a: Nu. Taxele de import, TVA-ul și taxele la nivel de stat sunt responsabilitatea importatorului conform regulilor braziliene. Facem o estimare clară și separată a prețurilor de tip board și transportului și furnizăm documentele de care despachante-ul tău are nevoie.
    - q: Cum arată o primă comandă pentru o școală de plajă braziliană?
      a: 'De obicei 5–15 placi: modele durabile pentru lecții și închiriere pe oră, plus câteva ediții premium pentru expunere în retail. Modele mixte într-o singură livrare, prețuri în funcție de cantitatea totală.'
    - q: Expediați pe cale maritimă în Brazilia?
      a: Da — transportul maritim consolidat deserveste porturile braziliene pentru comenzi en-gros de 5–20 de plăci, cu prețuri în funcție de destinație. Expedierea rapidă pe aer este disponibilă pentru mostre și comenzi mici urgente.
