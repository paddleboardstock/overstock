content_capability:
  tagline: Capacitate inginerească
  title: Ce Ingineria Noastră<br />Echipa livrează
  subtitle: Ingineria Paddle Board Overstock acoperă întreg ciclul de viață al produsului — de la cercetarea pieței și proiectarea conceptului până la prototipare, testare și producție în masă.
  items:
    - title: Design industrial
      description: Echipa noastră de design industrial lucrează pornind de la cerințele clienților, cercetarea pieței și analiza competitivă pentru a dezvolta concepte de produse care echilibrează estetica, funcționalitatea și posibilitatea de fabricație. ProduSEM schițe 2D, randări 3D și documente de specificații pentru revizuirea clientului înainte de a trece la executarea matrițelor.
      features:
        - Dezvoltarea conceptului și studiile de fezabilitate
        - Desene de proiectare 2D și randări 3D
        - Selecția și specificația materialelor
        - Analiza designului pentru fabricație (DFM)
        - Evaluare ergonomică și de siguranță
    - title: Inginerie Structurală
      description: Inginerii noștri structurali sunt specializați în arhitectura bărcii pneumatice — proiectarea șasiului, configurarea camerelor tubulare, ingineria nucleului drop-stitch și distribuția încărcăturii. Fiecare proiect este analizat pentru integritatea structurală, optimizarea greutății și conformitatea cu standardele relevante (CE, ISO, AS).
      features:
        - Designul unui hull din fibră de sticlă Deep-V cu unghiuri de deadrise calculate
        - Configurație de tub cu mai multe camere pentru siguranță și plutire
        - Specificația miezului Drop-stitch și optimizarea densității
        - Analiza prin elemente finite pentru componentele care suportă sarcină
        - Calculul distribuției greutății și al stabilității
    - title: Modelare 3D și CAD
      description: Toate designurile produselor sunt dezvoltate în CAD 3D înainte de începerea uneltelor prototipului. Inginerii noștri folosesc SolidWorks și Rhino 3D pentru modelarea produselor, permițând clienților să revizuiască fiecare detaliu — de la profilul tuburilor până la configurația consolei — înainte de a se angaja în producție.
      features:
        - Modelare CAD 3D completă în SolidWorks și Rhino 3D
        - Redare foto-realistă pentru prezentări pentru clienți
        - Pachete tehnice de desen pentru producție
        - Designul matriței și al uneltelor pornind de la modele 3D
        - Transfer CAD cătreCNC transfer direct de date pentru tăiere de precizie
    - title: Prototipare și testare
      description: Înainte de producția în masă, fiecare produs nou trece prin etapa de prototip. Construim prototipuri funcționale pentru evaluarea clienților, apoi le supunem protocolului nostru complet de testare — testare sub presiune, testare de stabilitate, testare de încărcare și teste cu apă. Iterațiile de proiectare în stadiul de prototip sunt rapide și rentabile.
      features:
        - Unelte rapide prototip (timp de 15-20 de zile)
        - Prototip funcțional pentru evaluarea în lumea reală
        - Protocol complet de testare înainte de închiderea producției
        - Rafinarea iterativă a designului bazată pe rezultatele testelor
        - Pragul de aprobare al clientului înainte de sculele de producție
    - title: Integrarea Accesoriilor Personalizate
      description: Multe OEM proiecte necesită integrarea accesoriilor furnizate de clienți sau terțe părți — console personalizate, scaune specializate, sisteme electronice, suporturi pentru echipamente de scufundare sau elemente de branding. Echipa noastră de inginerie gestionează proiectarea integrării, adaptarea structurală și validarea calității tuturor accesoriilor.
      features:
        - Proiectarea consolei și configurația panoului de instrumente
        - Integrarea scaunelor personalizate și a tapițeriei
        - Proiectarea și cablarea sistemelor electronice
        - Sisteme de montare pentru echipamente de scufundare și salvare
        - Specificații de branding și aplicații grafice
content_process:
  tagline: Procesul de dezvoltare
  title: De la concept<br />până la producție
  subtitle: Procesul nostru de dezvoltare a produsului urmează un flux de lucru structurat în 6 etape, conceput pentru a minimiza riscurile, a comprima termenele și a asigura pregătirea producției încă din prima zi.
  stages:
    - stage: '01'
      title: Cerințe și cercetare
      duration: 1-2 săptămâni
      description: Colaborăm cu clientul pentru a defini specificațiile produsului, cerințele pieței țintă, cerințele de conformitate cu reglementările și obiectivele comerciale. Această etapă produce un Document de Cerințe de Produs (PRD) care ghidează toate lucrările ulterioare.
      deliverables: PRD, analiză de piață, repere competitiv, estimare preliminară a costurilor
    - stage: '02'
      title: Design conceptual
      duration: 2-3 săptămâni
      description: Echipa de design industrial dezvoltă concepte de produs pe baza PRD. Sunt prezentate mai multe opțiuni de design cu randări 3D, recomandări de materiale și evaluări inițiale de inginerie. Clientul selectează direcția pentru dezvoltarea detaliată.
      deliverables: Randări conceptuale 3D, specificații de materiale, raționament de proiectare, BOM preliminar
    - stage: '03'
      title: Inginerie Detaliată
      duration: 2-4 săptămâni
      description: Conceptul selectat este complet proiectat — modelare CAD 3D, analiză structurală, configurare a tuburilor, design al carenei, integrare accesorii și documentație de producție. Toate dimensiunile, materialele și procesele sunt specificate pentru scule.
      deliverables: Model CAD 3D complet, desene inginerești, BOM final, specificații pentru scule, plan QC
    - stage: '04'
      title: Prototipare
      duration: 2-3 săptămâni
      description: Unealta prototipului este produsă și sunt construite mostre funcționale. Clientul revizuiește prototipul în raport cu specificațiile PRD. Testarea este efectuată conform protocolului agreat. Ajustările de design sunt realizate pe baza feedback-ului înainte de unealta de producție.
      deliverables: Prototip funcțional, raport de testare, jurnal de revizuire a designului, document de aprobare de către client
    - stage: '05'
      title: Unelte de producție
      duration: 2-3 săptămâni
      description: Odată ce prototipul este aprobat, se comandă uneltele de producție — matrițe, dispozitive de sudură, programe de tăiere, dispozitive de asamblare. Documentația QC și criteriile de inspecție sunt finalizate. Se realizează o serie de încercare pentru validarea procesului.
      deliverables: Instrumente de producție, documentația procesului, plan de inspecție QC, raport de testare pilot
    - stage: '06'
      title: Producție în masă și controlul calității
      duration: În Derulare
      description: Producția completă începe cu controlul calității în proces la fiecare etapă. Primele articole sunt inspectate și aprobate înainte de eliberarea lotului. Monitorizarea continuă a calității, urmărirea defectelor și îmbunătățirea continuă pe tot parcursul ciclului de viață al producției.
      deliverables: Program de producție, rapoarte de control al calității, înregistrări de trasabilitate a loturilor, documentație de expediere
content_customization:
  tagline: Opțiuni de personalizare
  title: Ce poate fi<br />Personalizat
  subtitle: Aproape fiecare aspect al produselor noastre poate fi personalizat pentru a îndeplini cerințele clienților. Mai jos sunt cele mai comune categorii de personalizare.
  columns: 3
  items:
    - title: Cocă și structură
      description: Lungime custom a carenei, lățime a bătului, unghi de deadrise, diametru al tubului, configurație a camerei și grad de material.
      icon: tabler:sailboat
    - title: Culori și Grafică
      description: Culoarea tubului (PVC/Hypalon), culoarea gelcoat-ului carenei, culoarea consolei, grafica punții, plasarea logo-ului și designul ambalajului.
      icon: tabler:palette
    - title: Consolă și controale
      description: Consolă centrală, consolă laterală sau manevrare cu cârma. Layout personalizat al panoului de instrumente, amplasarea comutatoarelor și poziția timoneriei.
      icon: tabler:steering-wheel
    - title: Scaune și Tapițerie
      description: Locuri pentru jochei, bănci, tapițerie de lux, cusături de culoare asortată, configurații pliante sau detașabile.
      icon: tabler:armchair
    - title: Accesorii și Echipamente
      description: Scări de scufundări, suporturi pentru rezervoare, piloni de remorcare, T-topuri, acoperișuri Bimini, sisteme audio, electronice de navigație și echipamente de siguranță.
      icon: tabler:backpack
    - title: Ambalare și Branding
      description: Ambalaje personalizate pentru retail, cutii cu marcă proprie, carton de expediere cu marcaje de brand, etichete și manuale de utilizare în limba clientului.
      icon: tabler:box
content_industries:
  tagline: Aplicații Industriale
  title: Soluții inginerești<br />după Industrie
  subtitle: Echipa noastră de inginerie a dezvoltat produse pentru o gamă largă de aplicații marine — fiecare cu cerințe și criterii de performanță distincte.
  columns: 3
  items:
    - title: Operațiuni de scufundare
      description: Podele consolidate, integrare scări de scufundare, sisteme de depozitare pentru rezervoare și platforme stabile pentru centre de scufundări comerciale din întreaga lume.
      icon: tabler:lifebuoy
    - title: Salvare & Urgență
      description: Designuri de carenă cu viteză mare, podele autoepuratoare, sisteme de montare a echipamentului și configurații de siguranță cu mai multe camere pentru operațiuni SAR.
      icon: tabler:alert-triangle
    - title: Turism Maritim
      description: Configurații pentru confortul pasagerilor, integrare parasolar, sisteme de îmbarcare și configurații eficiente din punct de vedere al consumului de combustibil pentru operațiuni de transfer între insule.
      icon: tabler:beach
    - title: Tender pentru iahturi
      description: Designuri compacte pentru depozitare pe davit, opțiuni de finisaje de lux, culori asortate cu nava mamă și caracteristici de tractare de înaltă performanță.
      icon: tabler:sailboat
    - title: Pescuit & Acvacultură
      description: Configurații de punte plană, integrare livewell, layout pentru suporturi de lansete și echipamente rezistente la coroziune pentru expunere continuă la apă sărată.
      icon: tabler:fish
    - title: Port și Industrial
      description: Consolidare puternică a carenei, layout-uri pentru bărci de lucru, configurații de transport al personalului și integrarea echipamentelor pentru operațiuni offshore.
      icon: tabler:ship
