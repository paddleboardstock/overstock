team_section:
  tagline: Echipa
  title: Oamenii din spatele consiliilor
  description: Baza noastră din Weihai găzduiește o echipă de cercetare și dezvoltare de 14+ persoane, care acoperă materiale, proiectarea structurală și procesele de producție. În jurul lor operează echipa mai largă care se ocupă de controlul calității, inventar, logistică și suportul pe care îl contactați atunci când ne contactați — aceleași persoane, fie că cumpărați o placă sau douăzeci.
