hero:
  tagline: Despre
  title: Despre Paddle Board Overstock
  subtitle: Din 2012, punem plăci gonflabile noi SUP în mâinile vâslaștilor și retailerilor mici din 50+ de țări — stoc în exces, prețuri corecte și o garanție pe care chiar o respectăm.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Plăci gonflabile noi-nouțe SUP
direct_answer: Paddle Board Overstock este un brand de echipamente pentru sporturi nautice fondat în 2012 și cu sediul în Weihai, China. Vindem plăci gonflabile SUP noi-nouțe din stocul excedentar — un amestec de producție excedentară din propria noastră bază de producție și stocuri atent selectate din fabricile partenere — direct către vâslașii de la final și către retaileri mici din 50+ de țări. Fiecare placă este testată 100% la presiune, susținută de o SUP garanție de 2 ani și livrată prin transport expres sau maritim.
tldr_points:
  - Fondată în 2012, cu sediul în Weihai, China — unul dintre SUP principalele centre de producție din lume
  - 'Model suprastoc: plăci noi la prețuri sub prețul de retail, fără intermediari'
  - 'Stocurile sunt mixte: producție excedentară din baza noastră plus stocuri de fabrici partenere verificate'
  - 50+ de țări deservite, rată de trecere de 99,3% la inspecția finală, SUP garanție de 2 ani
story_section:
  tagline: Povestea noastră
  title: De ce vindem stocuri suplimentare
  paragraphs:
    - Paddle Board Overstock începută în 2012 în Weihai, China — un oraș de coastă din provincia Shandong care a crescut într-unul dintre cele mai importante centre de producție de modele gonflabile din lume SUP . Pornind de la această bază, am petrecut mai bine de un deceniu fabricând plăci cu palete gonflabile și transportându-le în întreaga lume.
    - Along the way we noticed something that shapes everything we do today: Fiecare sezon de producție lasă în urmă panouri noi, perfect bune — ediții în surplus, comenzi anulate, culori ale sezonului trecut. Între timp, retailerii independenți din întreaga lume au fost excluși de la comerțul en-gros pentru că furnizorii tradiționali cereau comenzi de dimensiunea containerelor.
    - Această lacună este afacerea noastră. Prin vânzarea stocului excedentar — producție excedentară din propria noastră bază Weihai, plus stocuri atent selectate de la fabricile partenere — putem oferi plăci noi la prețuri mult sub standardul de retail, în cantități care se potrivesc pentru un singur vâslănit sau pentru o comandă de magazin cu cinci plăci. Nimic nu este second-hand, nimic nu este al doilea; este pur și simplu inventar care merită un client, nu un depozit.
model_section:
  tagline: Modelul nostru de afaceri
  title: Cum funcționează modelul Overstock
  items:
    - title: Nou-nouț, niciodată folosit
      description: Fiecare placă pe care o vindem este nou-nouță și nefolosită. Stocul în exces înseamnă surplus și stoc în exces — nu retururi, nu recondiționate, nici secunde.
    - title: Inventar cu surse mixte
      description: Stocul nostru combină producția excedentară din propria noastră bază de producție Weihai cu stocul selectat din fabricile partenere pe care le respectăm la aceeași standardă de calitate. Sursele sunt mixte; standardele nu.
    - title: Prețuri sub amănuntul
      description: Stocul în exces ne costă mai puțin de achiziționat, deci te costă mai puțin să cumpări. Fără preț de listă umflat, fără reduceri false — doar prețuri corecte pe stocuri reale.
    - title: En-gros prietenos cu afacerile mici
      description: Vânzarea en-gros începe de la 5 scânduri, nu de la containere. Retailerii mici pot amesteca orice model disponibil într-o singură comandă și pot alege transport expres sau maritim.
    - title: Livrare direct-la-dumneavoastră
      description: Comenzile sunt expediate direct de la baza noastră logistică din Weihai la ușa dumneavoastră în 50+ de țări — expres pentru mostre și comenzi mici, transport maritim consolidat pentru vânzare en-gros.
quality_section:
  tagline: Calitate și garanție
  title: Calitatea din spatele fiecărei plăci
  subtitle: Prețul peste stocuri nu înseamnă niciodată standarde relaxate. Fiecare consiliu — indiferent de sursă — trece prin același proces înainte de expediere.
  items:
    - title: 100% testat la presiune
      description: Fiecare placă este umflată și testată la presiune până la 15 PSI înainte de expediere. Nicio placă nu pleacă netestată, indiferent de unde provine stocul său.
    - title: Testat pentru supraîncărcare până la 1,25x
      description: Plăcile din seriile noastre de producție sunt testate prin eșantionare dincolo de presiunea nominală — menținute la 1,25x presiunea de lucru timp de 24–48 de ore pentru a verifica cusăturile, supapele și construcția drop-stitch.
    - title: Rată de trecere la inspecția finală de 99,3%
      description: Procesul nostru final de inspectare trece 99,3% din plăci ca fiind fără defecte — iar mica fracțiune care eșuează nu intră niciodată în inventarul nostru excedentar.
    - title: Garanție de 2 ani SUP
      description: Fiecare placă SUP beneficiază de o garanție de 2 ani SUP care acoperă defectele de fabricație. Aceeași garanție se aplică fiecărui client în fiecare dintre cele 50 de piețe + ale noastre.
