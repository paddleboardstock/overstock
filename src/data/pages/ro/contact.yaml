hero_text:
  tagline: Contact
  title: IA LEGĂTURA
contact_form:
  id: form
  title: Trimite-ne un mesaj
  subtitle: Pentru cotații, întrebări tehnice sau solicitări de parteneriat, scrieți-ne un mesaj. Răspundem în termen de o zi lucrătoare.
  email_to: info@aquafarer.com
  submit_button: Trimite Cerere de Informații → Obțineți o Cotație
  success_message: Mulțumim! Mesajul dumneavoastră a ajuns în inboxul nostru. Vom răspunde în termen de o zi lucrătoare.
  error_message: Ceva a mers prost la trimiterea mesajului dumneavoastră. Vă rugăm să încercați din nou sau să ne trimiteți un e-mail direct.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: vă rugăm să rezolvați următorul'
  fields:
    - name: prenume
      label: Prenume
      row: 1
    - name: nume de familie
      label: Nume de familie
      row: 1
    - name: numeCompanie
      label: Numele Companiei
      row: 2
    - name: address
      label: Adresă
      row: 3
    - name: zip
      label: Cod poștal
      row: 4
    - name: country
      label: Țară
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: volumComandă
      label: Volum estimat al comenzii
      row: 6
      type: select
      options:
        - value: ''
          label: Selectați volumul estimat...
        - value: sample
          label: Doar mostre / prototipuri
        - value: 5-10
          label: 5–10 unități (Standard MOQ)
        - value: 100-500
          label: 100–500 unități
        - value: 500-plus
          label: 500+ unități (Preț pe volum)
    - name: customization
      label: Este necesară personalizarea?
      row: 7
      type: select
      options:
        - value: ''
          label: Selectați tipul de personalizare...
        - value: none
          label: Produs standard (fără personalizare)
        - value: logo
          label: Logo / Branding personalizat doar
        - value: full
          label: Complet OEM (dimensiune, culoare, grafică, ambalaj)
        - value: consultation
          label: Nu sunt sigur — am nevoie de consultanță
    - name: interesProdus
      label: Categorii de produse de interes
      row: 8
      type: select
      options:
        - value: ''
          label: Selectați categoria de produs...
        - value: all
          label: Toate produsele / Catalog complet
        - value: sup
          label: SUP Plăci / Paddleboards
        - value: kayak
          label: Caiace gonflabile
        - value: rib
          label: RIB Bărci
        - value: dinghy
          label: Bărcuțe / Tenderuri
        - value: safety
          label: Echipamente de siguranță / Veste de salvare
        - value: accessory
          label: Accesorii (pompe, vâsle, genți)
    - name: subject
      label: Subiect
      row: 9
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
