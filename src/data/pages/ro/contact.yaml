      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (HQ SUA) · +86 13305324192 (fabrică)
      icon: tabler:headset
    - title: Email
      description: info@aquafarer.com
      icon: tabler:mail
    - title: Sediu global & Facturare
      description: Aquafarer LLC, New Mexico, Statele Unite
      icon: tabler:map-pin
