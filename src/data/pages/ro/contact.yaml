hero_text:
  tagline: Contact
  title: IA LEGĂTURA
contact_form:
  id: form
  title: Trimite-ne un mesaj
  subtitle: Pentru întrebări legate de comenzi, sfaturi privind mărimea sau suport pentru produse, trimiteți-ne un mesaj. Răspundem în termen de o zi lucrătoare.
  email_to: info@paddleboardoverstock.com
  submit_button: Trimite Cerere de Informații → Obțineți o Cotație
  success_message: Mulțumim! Mesajul dumneavoastră a ajuns în inboxul nostru. Vom răspunde în termen de o zi lucrătoare.
  error_message: Ceva a mers prost la trimiterea mesajului dumneavoastră. Vă rugăm să încercați din nou sau să ne trimiteți un e-mail direct.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: vă rugăm să rezolvați următorul'
  fields:
    - name: prenume
      label: Prenume
      row: 1
    - name: nume de familie
      label: Nume de familie
      row: 1
    - name: numeCompanie
      label: Numele Companiei
      row: 2
    - name: address
      label: Adresă
      row: 3
    - name: zip
      label: Cod poștal
      row: 4
    - name: country
      label: Țară
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: volumComandă
      label: Volum estimat al comenzii
      row: 6
      type: select
      options:
        - value: ''
          label: Câte plăci doriți să achiziționați?...
        - value: one
          label: Doar o placă
        - value: 2-4
          label: 2–4 plăci
        - value: 5-plus
          label: 5+ plăci (pentru familie, club sau închirieri)
    - name: customization
      label: Cu ce vă putem ajuta?
      row: 7
      type: select
      options:
        - value: ''
          label: Selectați un subiect...
        - value: none
          label: Întrebare generală despre produs
        - value: sizing
          label: Ajutor pentru alegerea plăcii potrivite
        - value: order
          label: Comandă, plată sau livrare
        - value: warranty
          label: Garanție sau suport pentru reparații
    - name: interesProdus
      label: Categorii de produse de interes
      row: 8
      type: select
      options:
        - value: ''
          label: Selectați categoria de produs...
        - value: all
          label: Toate produsele / Catalog complet
        - value: sup
          label: SUP Plăci / Paddleboards
        - value: packages
          label: Pachete complete SUP
        - value: accessory
          label: Accesorii (pompe, vâsle, genți)
    - name: subject
      label: Subiect
      row: 9
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Alte modalități de a ne contacta
  columns: 3
  items:
    - title: Ajutor pentru comandă
      description: Întrebări despre produse, sfaturi privind mărimile și suport pentru comandă.
      icon: tabler:shopping-bag
    - title: Suport tehnic
      description: Garanție, reparații, piese de schimb și întrebări de operare.
      icon: tabler:tool
    - title: Presă & parteneriate
      description: Kit-uri media, sponsorizări și colaborări în industrie.
      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (HQ SUA) · +86 13305324192 (fabrică)
      icon: tabler:headset
    - title: E-mail
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Sediu global & Facturare
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Locația noastră
  subtitle: Vizitați centrul nostru de producție din Weihai
  address: Weihai, Shandong, China
  zoom: 15
