hero:
  tagline: Echipamente
  title: Echipamente și utilaje de producție
  subtitle: Echipamente de calitate industrială pentru tăiere, sudură, imprimare și asamblare
  back_label: Înapoi la fabrică
  back_link: /factory
categories:
  - title: Tăiere și pregătirea materialului
    items:
      - name: Mașină automată de tăiere PVC
        spec: CNC-controlat, 6,5 m × 2,5 m, precizie de 0,1 mm
        desc: Mașină de tăiere automată controlată de computer pentru țesături PVC și drop-stitch. Software-ul de așezare optimizează utilizarea materialului la mai puțin de 5% pierdere.
      - name: Întinzător de materiale textile
        spec: Lățime maximă de 3 m, alimentare cu control de tensiune
        desc: Aplică țesătura în straturi simple sau multiple, cu tensiune controlată pentru a preveni deformarea înainte de tăiere.
  - title: Sudare & Lipire
    items:
      - name: Mașină de sigilare termică
        spec: Sudură cu aer cald, variabil 200–600 °C, 0,5–5 m/min
        desc: Mașină de sigilare prin căldură cu aer cald pentru lipirea și sudarea laminatelor PVC, benzilor de șină și cusăturilor camerelor. Folosită pentru fixare, sigilare și fuziune a îmbinărilor miezului drop-stitch.
      - name: Presă RF dielectrică
        spec: 15 kW, placă 2000 × 600 mm
        desc: Presă de sudură cu frecvență radio pentru cusăturile longitudinale principale, îmbinări transom-tub și fabricarea cu camere mari.
      - name: CNC-Sudor RF controlat
        spec: 8 kW, tabelul XY 2500 × 1200 mm
        desc: Sudură programabilă cu cusături curbate pentru geometrii complexe, embosare a logo-ului și patchwork de precizie.
  - title: Artă și finisare a punții
    items:
      - name: Mașină de tăiat punți EVA
        spec: Tăiere cu cuțit CNC, lățime 2 m
        desc: Tăiere de precizie a panourilor de spumă pentru punte EVA pentru modelele de punte din seria de artă. Fiecare panou este tăiat după forma sa pentru o potrivire perfectă pe întreaga punte.
      - name: Presă pentru laminarea punții
        spec: Temperatură și presiune controlate
        desc: Lișarea panourilor de punte EVA pe suprafața placii cu adeziune constantă pe întreaga suprafață a punții.
  - title: Imprimare & Decorare SUP
    items:
      - name: Imprimantă digitală
        spec: Imprimare inkjet de înaltă rezoluție, lățime de imprimare de până la 2 m
        desc: Imprimare digitală direct pe material pentru grafici complete de punte SUP în culori complete. Imprimă modele personalizate, degradări și imagini de calitate foto cu cerneală pe bază de apă rezistentă la UV.
      - name: Mașină de serigrafie
        spec: Reglare manuală și semi-automată, înregistrare pe mai multe culori
        desc: Serigrafie pentru logo-uri pe placă SUP, mărci de brand și modele repetitive. Oferă imprimeuri durabile, opace, cu saturație vibrantă a culorii.
  - title: Asamblare finală
    items:
      - name: Stație de cuplu pentru supape
        spec: Test funcțional calibrat, 10 cicluri
        desc: Instalează și strânge cuplurile supapelor de umflare, apoi testează funcțional fiecare supapă prin 10 cicluri de deschidere/închidere.
      - name: Setator cutie aripă și inel D
        spec: Aliniat pe jig, adezivul a fost întărit
        desc: Poziționează și lipește cutiile aripii, inelele D și mânerele în locațiile exacte de pe punte conform specificațiilor modelului.
  - title: Testare și controlul calității
    items:
      - name: Tester universal de tracțiune
        spec: Capacitate 50 kN
        desc: Testarea forței de rupere, a alungirii la rupere și a propagării rupturii pentru loturile de materiale.
      - name: Banc de testare a păstrării aerului
        spec: Programabil, menținere presiune de 30 de minute
        desc: Test automat de menținere presiune pentru fiecare cameră a tubului înainte de asamblare.
      - name: Tester de decojire a cusăturilor
        spec: Decojire motorizată 180° la 100 mm/min
        desc: Testarea rezistenței la sudură și a celor etanșate prin lipire conform protocolului intern.
      - name: Cameră de îmbătrânire la Xenon-Arc
        spec: Expunere de 2000 h
        desc: Testarea rezistenței UV pentru schimbarea culorii și păstrarea rezistenței.
