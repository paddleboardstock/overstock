content_overpressure:
  tagline: Siguranța sub presiune
  title: Presiunea plăcii<br />Management în Clime Calde
  subtitle: Presiunea plăcilor gonflabile crește odată cu temperatura. Înțelegerea și gestionarea suprapresiunii protejează placa și menține fiecare sesiune în siguranță.
  items:
    - title: De ce crește presiunea
      description: Aerul se extinde odată cu căldura. O placă umflată la 15 PSI °C la 20°C poate urca la PSI 1-2 din 40°C la soare — aceeași fizică care face ca o placă de dimineață răcoroasă să pară tare ca piatra la prânz.
      icon: tabler:gauge
    - title: Presiunea recomandată de funcționare
      description: Umflă la 12-15 PSI, așa cum este imprimat lângă supapă. Gama nominală echilibrează rigiditatea, siguranța și durata de viață a cusăturii — mai mult nu înseamnă mai bine.
      icon: tabler:chart-bar
    - title: Cele mai bune practici pentru climat cald
      description: Umflă până la capătul inferior al intervalului în zilele călduroase. Eliberează puțin aer înainte de expunerea prelungită la soare și nu lasă niciodată o placă complet umflată pe plajă.
      icon: tabler:sun
    - title: Expunerea la soare și depozitarea
      description: Păstrează scândurile umbrite și parțial dezumflate când nu sunt folosite. Folosește o pungă pentru UV scânduri pentru protecție. Clătește și usucă înainte de a rula pentru depozitare.
      icon: tabler:umbrella
    - title: Dacă placa pare tare ca piatra
      description: Eliberează aerul prin supapă până când placa revine la intervalul nominal. Poartă manometrul pe pompă pentru citiri precise — o placă supraumflată suprasolicită inutil îmbinările.
      icon: tabler:alert-circle
