certifications:
  - title: CE Certificare (UE 2016/425)
    standard: Regulamentul EPI (UE) 2016/425 | EN ISO 12402
    description: Toate echipamentele de siguranță Aquafarer respectă cerințele de marcaj CE conform Regulamentului European privind Echipamentele de Protecție Individuală. Fiecare produs este testat independent de TÜV Rheinland, un organism notificat european. Bărcile noastre gonflabile și RIBs respectă cerințele Directivei privind Ambarcațiunile pentru Recreere 2013/53/UE (RCD) categorii C și D.
    body: Certificarea CE acoperă cerințele esențiale de sănătate și siguranță pentru dispozitivele de flotabilitate personală și ambarcațiunile gonflabile. TÜV Rheinland auditează anual facilitatea noastră de producție pentru a verifica conformitatea continuă.
  - title: SOLAS — Siguranța vieții pe mare
    standard: SOLAS Capitolul III | Codul LSA
    description: Vesta de salvare Life Vest Pro respectă reglementările SOLAS pentru operațiuni marine offshore și comerciale. Testată pentru flotabilitate de 24 de ore, umflare automată la scufundare și performanță în stări de mare de până la forța 5. Respectă cerințele Capitolului III pentru veste de salvare pe nave comerciale.
    body: Aprobarea SOLAS necesită testare independentă de către un organism notificat pentru flotabilitate, rezistență, vizibilitate și activare automată. Life Vest Pro are aprobarea de tip complet SOLAS cu certificare MED.
  - title: USCG Tip III / Tip V
    standard: 46 CFR Partea 160 | USCG Aprobat
    description: Vestele de salvare selectate Aquafarer respectă clasificarea Gardelor de Coastă din Statele Unite pentru dispozitivele Tip III (ajutor de flotabilitate) și Tip V (utilizare specială). Potrivite pentru ape adăpostite, croaziere de coastă și operațiuni comerciale care necesită veste PFD aprobate USCG.
    body: Aprobarea USCG necesită testare de către un laborator independent recunoscut de CG. Aprobarea Tip V include modele hibride gonflabile care necesită activare manuală sau automată.
  - title: BSCI Conformitatea socială
    standard: Codul de conduită amfori BSCI
    description: Fabrica noastră este auditata anual conform Inițiativei amfori pentru Conformitate Socială în Afaceri (BSCI). Aceasta verifică practicile de muncă etice, siguranța la locul de muncă, orele de lucru echitabile și managementul mediului în întreaga noastră facilitate de producție de 12.000 m².
    body: Conformitatea BSCI este o cerință prealabilă pentru comercianții și importatorii europeni. Ratingul nostru curent BSCI este „C” (Bun), auditat de SGS.
  - title: REACH & RoHS Conformitate
    standard: Regulamentul UE REACH (CE) 1907/2006 | RoHS Directiva 2011/65/UE
    description: Toate PVC compușii, adezivii și vopselele utilizate în produsele Aquafarer respectă reglementările UE privind siguranța chimică REACH și restricțiile RoHS privind substanțele periculoase. Fișele cu date de securitate a materialului (MSDS) sunt disponibile pentru fiecare linie de produse.
    body: Conformitatea REACH asigură că nu există substanțe SVHC restricționate peste limitele prag. Testele regulate ale laboratoarelor terțe verifică conformitatea continuă pentru fiecare lot de producție.
  - title: ISO 9001:2015 Managementul Calității
    standard: ISO 9001:2015 | TÜV Certificat Rheinland
    description: Sistemul nostru de management al calității este certificat ISO 9001:2015 de TÜV Rheinland, acoperind proiectarea, producția, testarea și serviciul post-vânzare. Audituri anuale de supraveghere asigură îmbunătățirea continuă și controlul proceselor.
    body: Certificarea ISO 9001 necesită politici documentate de calitate, audituri interne, revizuiri manageriale, proceduri de acțiuni corective și înregistrări de producție trasabile.
testimonial:
  quote: Am achiziționat echipamente de siguranță de la mai mulți furnizori din Asia. Aquafarer este singurul producător care a furnizat documentația completă CE, certificatele SOLAS și rapoartele de testare terță parte, fără a fi solicitat.
  author: Erik Lindström
  title: Ofițer de Siguranță
  company: Baltic Marine Supply
  location: Finlanda
content_overpressure:
  tagline: Siguranța la Suprapresiune
  title: RIB Presiunea Tubului<br />Management în Clime Calde
  subtitle: Presiunea tubului umflat crește odată cu temperatura. Înțelegerea și gestionarea suprapresiunii previne deteriorarea și asigură funcționarea sigură în medii tropicale și deșertice.
  items:
    - title: Supape de Descărcare a Presiunii Boyle
      description: Tuburile Aquafarer RIB sunt echipate cu supape de descărcare a suprapresiunii care elimină automat excesul de presiune peste maximul nominal. Previne stresul cusăturilor și eventuale explozări ale tubului cauzate de încălzirea solară.
      icon: tabler:gauge
    - title: Schimbarea Presiunii de la Dimineață la Amiază
      description: Un tub umflat la 3,5 PSI la 20°C poate ajunge la 4,5 + PSI la expunerea la soare de 40°C. Întotdeauna umflați la capătul inferior al intervalului recomandat în clime calde și lăsați supapa să gestioneze presiunea excesivă.
      icon: tabler:sun
    - title: Presiuni de Operare Recomandate
      description: 'Tuburi PVC: operare 3,0-3,5 PSI, maxim 4,5 PSI. Tuburi Hypalon: operare 3,5-4,0 PSI, maxim 5,0 PSI. Testați întotdeauna la 1,25x valoarea nominală (4,4 PSI pentru PVC, 5,0 PSI pentru Hypalon) conform standardelor QC Aquafarer.'
      icon: tabler:chart-bar
    - title: Bune Practici la Expunerea la Soare
      description: Depozitați RIBs în zone umbrite când nu sunt utilizate. Folosiți huse de protecție UV pentru ancoraje prelungite. Verificați și ajustați presiunea tubului înainte și după orele de vârf de soare. Nu depășiți niciodată presiunea maximă nominală.
      icon: tabler:umbrella
    - title: Depresurizare de Urgență
      description: Dacă tubul se simte prea rigid sau supapa descarcă presiune, eliberați aerul prin supapa Halkey-Roberts sau militară până când presiunea revine la intervalul de operare. Purtați un manometru pentru citiri precise.
      icon: tabler:alert-circle
