process_section:
  eyebrow: Procesul nostru
  title: De la un capăt la OEMaltul /ODM Flux de lucru
  subtitle: De la brief-ul de proiectare până la încărcarea containerelor — șase pași pentru ambarcațiunile dumneavoastră gonflabile private label.
  steps:
    - step: '01'
      title: Specificații & Brief de proiectare
      desc: Împărtășiți specificațiile țintă, desenele CAD sau produsul de referință. Echipa noastră de inginerie revizuiește materialele, dimensiunile și cerințele de conformitate CEBSCI(, ) înainte de a oferi o ofertă.
    - step: '02'
      title: Prototiparea matriței 3D
      desc: Proiectăm și CNCprelucrăm matrițe personalizate pentru SUP plăci, carene de caiac și RIB componente. Mostre prototip produse în 15–20 de zile lucrătoare pentru aprobarea dumneavoastră.
    - step: '03'
      title: Selecția materialelor și producția probelor
      desc: PVC Alege dintre materiale de calitate militară (0,9mm–1,2mm), Hypalon CSMsau drop-stitch de bază. Producem mostre pre-producție cu culorile brandului, logo-ul și ambalajul pentru aprobare.
    - step: '04'
      title: CE Audit și Conformitate în Fabrică
      desc: Fiecare OEM comandă include documentație de conformitate — CE declarație de conformitate, ISO înregistrări 9001 de trasabilitate, BSCI raport de conformitate socială și REACH declarații de materiale.
    - step: '05'
      title: Producție în vrac și control al calității în linie
      desc: Serialele de producție urmează lista noastră de verificare a calității în 100 de puncte. Fiecare unitate trece prin testare de retenție a presiunii de 24 de ore, testarea cojirii cusăturii și inspecție vizuală înainte de ambalare.
    - step: '06'
      title: FOB Qingdao Logistică & Transport
      desc: Produsele finite sunt paletizate, ambalate în plastic și încărcate în containere în portul Qingdao. Ne ocupăm de toată documentația de export, de defecționarea vamală și oferim urmărire în timp real a expedierii.
capabilities_section:
  eyebrow: Capabilități de Producție
  title: Ce construim
  subtitle: Șase capacități de producție de bază pentru B2B partenerii globali.
  items:
    - title: Drop-Stitch SUP Fabricarea plăcilor
      desc: drop-stitch Laminare a miezului pe toată lungimea pentru plăci rigide, cu presiune înaltă (15–20PSI). Lungime, lățime, grosime, profil de balansoare și design grafic personalizat.
    - title: PVC Producția de bărci gonflabile
      desc: PVC Bărcile sudate de înaltă frecvență, tendere și bărci sport. Configurații multiple de camere, opțiuni de podea (slat, punte de aer, roll-up) și integrare accesoriilor.
    - title: Hypalon RIB Fabricarea bărcilor
      desc: Hypalon CSM Tuburi de calitate comercială lipite de carene adânci în V din fibră de sticlă sau aluminiu. Lungimi de 3,3 m până la 6,0 m pentru operațiuni de patrulare, salvare, tururi și scufundări.
    - title: Marcă privată și branding personalizat
      desc: 'Serviciu complet de etichetă privată: transfer termic personalizat al logo-ului sau serigrafie, ambalaje de marcă (cutii de retail, pungi de transport), manuale de utilizare în limba ta și cod de bare/UPCînregistrare.'
    - title: Proiectarea matrițelor și uneltelor personalizate
      desc: Echipa internă de inginerie 3D CAD/CAM. Proiectăm și fabricăm matrițe personalizate din aluminiu și compozit pentru forme unice ale carcasei, configurații de punte și puncte de montare pentru accesorii.
    - title: OEM Accesorii și kitting
      desc: Veste de salvare (CE12402), pompe cu acțiune dublă, palete din carbon/nylon, kituri de reparații, genți de transport și ansambluri de lesă. Echipare completă și ambalare în pachet pentru prezentare gata de vânzare.
experience_section:
  eyebrow: Experiență în lumea reală
  title: Parteneriate care au construit branduri
  subtitle: Povești reale de la branduri și organizații care au colaborat cu Aquafarer OEMfor/ODMmanufacturing.
  stories:
    - quote: Ne-am trezit Aquafarer cu o schiță pe un șervețel și o listă de cerințe. Opt luni mai târziu, am avut o certificare de produs gata de producție care a trecut CE din prima.
      narrative: Un startup european cu un SUP design inovator a abordat Aquafarer ODM producția. Aquafarer Echipa de cercetare și dezvoltare a dus conceptul prin proiectare CAD, analiză structurală FEA, simulare hidrodinamică, crearea matrițelor, fabricarea prototipurilor și unelte de producție. Fondatorul startup-ului a vizitat Qingdao de trei ori în timpul procesului. Produsul final a trecut CE certificarea fără nicio modificare — un rezultat pe care fondatorul îl atribuie echipei Aquafarerde ingineri a lui , care a înțeles cerințele de reglementare europene încă de la început.
      context: SUP Lansarea brandului european, 2023-2024
      source: Brand Founder
    - quote: Nivelul de NDA protecție și Aquafarer securitatea PI ne oferă încredere să împărtășim designurile noastre proprietari. Ei tratează proprietatea noastră intelectuală ca și cum ar fi a lor.
      narrative: O companie americană de echipamente marine cu tehnologie proprietară a supapelor avea nevoie de un partener de producție care să le poată proteja proprietatea intelectuală în timp ce producea la scară largă. După auditarea a cinci producători chinezi, aceștia au Aquafarer selectat pe baza protocoalelor de protecție a proprietății intelectuale ale fabricii, gestionarea securizată a fișierelor de proiectare și disponibilitatea de a semna acorduri stricte de confianță. Parteneriatul a produs trei linii de produse pe parcursul a patru ani, fără incidente de proprietate intelectuală.
      context: Companie americană de echipamente OEM marine, parteneriat din 2021
      source: Vicepreședinte al Operațiunilor
