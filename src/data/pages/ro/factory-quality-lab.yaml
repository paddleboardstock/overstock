hero:
  tagline: Laborator de Control al Calității
  title: Laborator de Testare & Asigurarea Calității
  subtitle: Laborator de calitate independent — fiecare unitate testată înainte de expediere
intro: Paddle Board Overstock operează un laborator dedicat de control al calității care funcționează independent de producție. Fiecare lot de materii prime și fiecare placă finalizată trece prin protocoale de inspecție documentate înainte de eliberare. Echipa noastră de control al calității raportează direct conducerii, asigurând decizii imparțiale privind calitatea.
highlights:
  - value: 100%
    label: Unități testate la presiune
    detail: Fiecare cameră, fiecare placă
  - value: 48 h
    label: Durata testului de reținere a aerului
    detail: La 1,25× presiunea nominală
  - value: '&lt;5%'
    label: Pierdere maximă permisă de presiune
    detail: Pe durata de 24 de ore de menținere
  - value: 99.3%
    label: Rata produselor fără defecte
    detail: Expediții în ultimele 12 luni
test_procedures:
  - title: Inspecția materiilor prime
    description: Fiecare lot de intrare de PVC, țesătură drop-stitch, spumă EVA și accesorii este testat înainte de acceptare. Se verifică rezistența la tracțiune, rezistența la rupere și rezistența UV. Materialele care nu sunt conforme sunt puse în carantină și returnate.
    standards:
      - Rezistența la tracțiune (minim 350 N/cm)
      - Rezistența la rupere
      - Rezistența UV (1.000 h)
  - title: Puncte de Control QC În Proces
    description: Operatorii de producție efectuează auto-inspecția la fiecare etapă. Auditorii QC realizează prelevări aleatorii pe durata turei. Testele de decojire a sudurii se efectuează la fiecare 50 de unități. Verificările dimensionale au loc la fiecare 20-lea panou.
    standards:
      - Test de decojire la fiecare 50 de unități
      - Listă de verificare internă de 100 de puncte
      - Audituri prin eșantionare aleatorie
  - title: Testul de retenție a aerului de 48 de ore
    description: Fiecare cameră a tubului este umflată la 125% din presiunea nominală și menținută timp de 48 de ore. Senzorii de presiune înregistrează continuu cu compensare de temperatură. Orice cameră care depășește o scădere de presiune de 5% declanșează re-inspecția automată a lotului.
    standards:
      - Verificarea presiunii de 1,25x față de cea nominală
      - Scădere maximă de presiune <5%
  - title: Testarea încărcării și echilibrului
    description: Plăcile terminate sunt testate la capacitatea maximă nominală pentru stabilitate, margine liberă și manipulare. Fiecare placă trece prin test de apă înainte de aprobarea inspecției finale.
    standards:
      - Verificarea sarcinii la 1,25x valoarea nominală
      - Testarea apei
equipment:
  - name: Mașină de testare universală (tragere)
    spec: Capacitate 5 kN
  - name: Tester de scădere a presiunii
    spec: Multi-canal, 0–50 psi, înregistrare a datelor
  - name: UV Cameră de intemperii
    spec: UVA-340, 1.000 de cicluri h
  - name: Grosimetru (digital)
    spec: Rezoluție 0,01 mm
  - name: Tester de descoperire (sudură)
    spec: Motorizat, capacitate 50 N
  - name: Cameră de temperatură
    spec: -40 °C până la +100 °C
  - name: Tanc de detectare a scurgerilor
    spec: 6 m × 2 m, iluminat
