testimonial:
  content: Am început cu Pachetul de Pornire pentru Cluburile noastre de școală de surf din Portugalia. 20 de plăci, vâsle, veste — totul a sosit în 3 săptămâni. După două sezoane, am făcut upgrade la Pachetul Pro. Branduirea personalizată cu logo-ul nostru a fost un factor decisiv pentru imaginea noastră profesională.
  name: Ricardo Santos
  title: Proprietar, Algarve Surf Academy — Lagos, Portugalia
content_segments:
  tagline: Profiluri ale clubului
  title: Soluții pentru Cluburi de Sporturi Acvatice<br />După tipul clubului
  subtitle: De la cluburi universitare de caiac până la cluburi private exclusiviste de iahturi — fiecare tip de club are nevoi unice de echipament, modele de utilizare și structuri bugetare. Adaptăm fiecare pachet pentru a se potrivi modelului clubului.
  items:
    - title: Cluburi de Paddle Universitare și de Colegiu
      subtitle: Flote de studenți cu utilizare ridicată
      description: Cluburi de paddling conduse de studenți sau susținute de instituții care desfășoară programe SUP pentru departamentele de recreere universitară. Echipamentul este utilizat intensiv și cu rotație rapidă la diferite niveluri de abilități în fiecare semestru. Durabilitatea și ușurința de reparare sunt critice, împreună cu prețuri prietenoase cu bugetul pentru organizațiile studențești.
      features:
        - Construcție extra-durabilă PVC evaluată pentru cicluri de utilizare de către studenți
        - Plăci codificate prin culoare în funcție de nivelul de competență pentru gestionarea ușoară a flotei
        - Kit de reparare + suport video la cerere inclus cu fiecare comandă
        - Prețuri reduse pentru organizații studențești și condiții de plată pe semestru
    - title: Cluburi Comunitare de Paddle și Sociale
      subtitle: Cluburi recreative bazate pe membri
      description: Cluburi bazate pe comunitate care oferă SUP și experiențe sociale de vâslit membrilor. Echipamentul trebuie să echilibreze performanța și confortul pentru o gamă largă de vârste, cu marcaje care să promoveze identitatea clubului și mândria membrilor. Eficiența de depozitare este esențială pentru cluburile care operează cu acces limitat la mal.
      features:
        - 'Flotă mixtă: tip all-around și touring SUPs'
        - 'Branding complet al clubului: culori personalizate, imprimare logo, veste PFD branduite'
        - Soluții compacte de depozitare pentru echipamente gonflabile
        - 'Kit de start pentru creșterea membrilor: carduri de recomandare, fotografii branduite'
    - title: Școli de surf & Academii SUP
      subtitle: Performanță și coaching de coastă
      description: Școli axate pe surf care predau SUP surfing și abilități de călcat pe valuri. Echipamentul trebuie să fie performant în condiții de surf — manevrabil, receptiv și suficient de durabil pentru a rezista la prăbușiri repetate, abraziune de nisip și expunere la apă sărată fără degradare rapidă.
      features:
        - Forme SUP mai scurte și mai late, optimizate pentru manevrabilitate în surf
        - Construcție întărită a muchiilor pentru rezistență la impact în valuri
        - 'Echipament de siguranță specific surf-ului: lese spirale, opțiuni cu aripioare moi'
        - Program de înlocuire a flotei cu reduceri sezoniere la schimb
    - title: Cluburi Corporative și Private de Yacht
      subtitle: Experiențe premium pentru membri
      description: Cluburi private exclusive care oferă sporturi acvatice ca dotare premium pentru membri. Standardele pentru echipament sunt ridicate — estetica, alinierea la brand și prezentarea pentru oaspeți sunt la fel de importante ca performanța. Așteptările de serviciu includ livrare white-glove, soluții personalizate de depozitare și suport la nivel de concierge.
      features:
        - Plăci cu finisaj premium cu EVA cu aspect de lemn și accente metalice
        - Potrivire personalizată a culorilor conform ghidului brandului clubului
        - 'Livrare concierge: pre-gonflate, pregătite și etichetate pentru fiecare sezon'
        - Management dedicat al contului cu nivel SLA de răspuns prioritar
