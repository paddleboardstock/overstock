packages_section:
  title: Pachete de echipamente pentru club
  subtitle: Alegeți pachetul potrivit pentru dimensiunea clubului dumneavoastră. Toate pachetele includ prețuri directe de la fabrică, opțiuni de branding personalizat și livrare globală.
  featured_label: Cel mai popular
  packages:
    - name: Încălțăminte pentru club
      description: Pentru cluburi în creștere cu 10-30 de membri
      audience: Cluburi mici și școli de surf
      items:
        - 10-20 SUP plăci sau caiace
        - Vâsle, pompe și kituri de reparații
        - Veste de salvare și echipament de siguranță (certificat CE)
        - Branding de bază al logo-ului pe panouri
        - Garanție de 1 an și suport tehnic
      cta: Obțineți cotația de început
      ctaHref: /request-quotation
    - name: Club Pro
      description: Pentru cluburi consacrate cu 30-100 de membri
      audience: Cluburi și centre de formare de dimensiuni medii
      featured: true
      items:
        - 30-60 flotă mixtă (SUP + caiac)
        - Vâsle premium, pompe de înaltă performanță
        - Pachet complet de siguranță cu rafturi de depozitare
        - Branding complet personalizat (panouri + ambalaje)
        - Sistem de urmărire a închirierilor RFID
        - Materiale de instruire pentru personal și marketing
        - Garanție de 2 ani și suport prioritar
        - Program anual de reînnoire a flotei
      cta: Obțineți cotația Pro
      ctaHref: /request-quotation
    - name: Club Enterprise
      description: Pentru cluburi mari cu peste 100 de membri
      audience: Cluburi mari și operatori cu mai multe locații
      items:
        - 60-100+ flotă mixtă cu RIB tenderi
        - Pompe, scule și piese de schimb de calitate comercială
        - Sistem complet de siguranță cu echipament de salvare
        - Producție personalizată completă OEM/ODM
        - Integrare RFID + POS
        - Instruire la fața locului și manual de operațiuni
        - Garanție de 3 ani și manager de cont dedicat
        - Rotirea flotei sezoniere și program de schimb
      cta: Obțineți o cotație Enterprise
      ctaHref: /request-quotation
