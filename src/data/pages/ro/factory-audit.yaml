content_priorities:
  tagline: Ce Verifică Clienții
  title: 8 Lucruri pe care le Verifică Cumpărătorii<br />la Fiecare Vizită la Fabrică
  subtitle: Pe baza feedback-ului de la cumpărători din 50+ de țări, acestea sunt opt priorități pe care clienții le evaluează înainte de a plasa o comandă B2B.
  items:
    - title: Producător Real
      description: 'Sunteți fabrica reală, nu o companie de trading? Cumpărătorii verifică: entitatea juridică, echipamentele reale de producție, angajații care operează mașinile, comenzile de producție curente pe linie și consistența între site-ul web și atelier.'
      icon: tabler:building-factory
    - title: Produs Potrivit pentru Aplicație
      description: RIB corespunde cazului lor specific de utilizare? Operatorii de resort, salvare, scufundare, pescuit și patrulare au cerințe fundamental diferite. Cumpărătorii evaluează dispunerea punții, materialul tubului și opțiunile de echipamente pe barca expusă.
      icon: tabler:target
    - title: Stabilitatea și Reproductibilitatea Calității
      description: A 50-a unitate este la fel de bună ca prima? Cumpărătorii examinează sistemele QC, punctele de control în proces, gestionarea neconformităților și solicită să vadă înregistrări din mai multe serii de producție pentru a verifica consistența.
      icon: tabler:repeat
    - title: Autenticitatea Documentelor de Conformitate
      description: Sunt certificatele CE specifice modelului? Este DoC semnat de o persoană reală? Poate fi verificată conformitatea pe număr de șasiu? Cumpărătorii verifică revendicările generale vs. documentația specifică modelului.
      icon: tabler:file-certificate
    - title: Executarea Personalizării
      description: Poate fabrica să livreze efectiv configurații personalizate? Cumpărătorii caută dovezi ale proiectelor personalizate anterioare, mostre de prototip expuse, desene inginerești și capacitatea de a discuta modificări tehnice pe loc.
      icon: tabler:adjustments
    - title: Timp de Livrare și Capacitate
      description: 'Sunt realiste termenele ofertate? Cumpărătorii evaluează: volumul actual de producție, capacitatea disponibilă, dimensiunea forței de muncă, nivelurile stocurilor de materiale și dacă fabrica are un sistem de planificare a producției.'
      icon: tabler:clock
    - title: Preț & Termeni de Comerț
      description: 'Prețurile sunt transparente? Este FOB clar stabilirea prețurilor? Cumpărătorii verifică: defalcarea prețului unitar, costurile de scule, costurile de ambalare și dacă fabrica poate DDP gestiona sau CIF respecta documentația corespunzătoare pentru export.'
      icon: tabler:currency-dollar
    - title: Post-vânzare și piese de schimb
      description: 'Ce se întâmplă după livrare? Cumpărătorii evaluează: disponibilitatea pieselor de schimb, procesul de garanție, secțiunile tuburilor de înlocuire, înlocuirea supapelor și dacă fabrica are un protocol post-vânzare documentat.'
      icon: tabler:headset
content_tour:
  tagline: Traseul Turului Fabricii
  title: Tur de audit —<br />Ce vei vedea
  subtitle: Turul nostru standard al fabricii urmează un traseu definit, conceput pentru a răspunde întrebărilor cumpărătorilor la fiecare stație.
  items:
    - title: 1. Sală de ședințe — Introducere în companie
      description: Licență de afaceri, ISO 9001 și BSCI certificate, licențe de export și istoricul companiei. Prezentare rapidă a capacităților de producție și a domeniului de conformitate.
      icon: tabler:users
    - title: 2. Depozitul de materii prime — Stația IQC
      description: Înregistrări de inspecție a materialelor primite, certificate de loturi textile, adezivi și mostre de hardware. Vezi cum sunt testate materialele înainte de a intra în producție.
      icon: tabler:building-warehouse
    - title: 3. Fabricarea tuburilor — Sudură RF & Lipire manuală
      description: Procesul de sudare sau lipire a tuburilor sub tensiune, demonstrații de testare a rezistenței îmbinării și instalarea supapelor. Observați construcția cameră cu cameră și punctele de control al calității.
      icon: tabler:flame
    - title: 4. Laminarea carenei — Atelier GRP
      description: Procesul de depunere a fibrei de sticlă, aplicarea gelcoat și întărirea carenei. Consultați programul de laminare și armarea structurală pentru diferite RIB modele.
      icon: tabler:layers-subtract
    - title: 5. Asamblare și integrare
      description: Îmbinarea tuburilor corpului, instalarea consolei și scaunului, integrarea sistemului electric și de combustibil, precum și montarea echipamentelor. Observați linia de producție în funcțiune.
      icon: tabler:tool
    - title: 6. Stația de testare a presiunii
      description: Testul de menținere a presiunii pe 24-48 de ore la presiunea nominală de 1,25 ori. Vezi înregistrările testelor, manometrele și criteriile de promovare/respingere. Vezi cum rezultatele testelor sunt legate de numerele de serie ale carenei.
      icon: tabler:gauge
    - title: 7. Inspecție finală și control al calității
      description: Listă de verificare a calității de 100 de puncte pe unitate, verificare dimensională, inspecție cosmetică și verificare a integrității ambalajului. Revizuiți jurnalele de neconformitate și înregistrările acțiunilor corective.
      icon: tabler:clipboard-check
    - title: 8. Camera de revizuire a documentelor
      description: Documentație de conformitate pe model (DoC, plăcuță de constructor, manual al proprietarului), înregistrări de trasabilitate a producției, registrul HIN și demonstrația bazei de date de urmărire a loturilor de materiale.
      icon: tabler:folder
content_qc_chain:
  tagline: Dovezi de calitate
  title: Lanț QC în 8 trepte<br />— Verificabil la fiecare pas
  subtitle: Lanțul nostru de control al calității se întinde de la materialele primite până la expedierea finală, cu dovezi documentate la fiecare etapă.
  items:
    - title: 'Etapa 1: Inspecția materialelor de sosire'
      description: Fiecare lot de PVC, Hypalon, fibră de sticlă, aluminiu, adezivi și accesorii este testat conform specificațiilor înainte de a intra în producție. Rezistența la tracțiune, aderența acoperirii și verificările dimensionale pentru AQL 2.5/ISO2859.
      icon: tabler:package
    - title: 'Etapa 2: Sudură / Lipire a tuburilor QC'
      description: Testarea rezistenței la cojire a cusăturii pe lot de producție. Parametrii sudurii RF monitorizați și înregistrați. Cusăturile lipite manual verificate pentru acoperirea adezivului constantă și timpul de întărire.
      icon: tabler:flame
    - title: 'Etapa 3: Controlul calității laminării carenei'
      description: Măsurarea grosimii Gelcoat, verificarea depunerii din fibră de sticlă conform programului laminatului și monitorizarea timpului de întărire. Pozițiile armăturilor structurale verificate în raport cu desenele inginerești.
      icon: tabler:layers-subtract
    - title: 'Etapa 4: Controlul calității asamblării și integrării'
      description: Integritatea articulației tubului corpului, cuplul de montare a consolei și scaunului, continuitatea electrică și testul de scurgere al sistemului de alimentare. Fiecare punct de instalare a fost verificat în raport cu lista de verificare specifică modelului pentru asamblare.
      icon: tabler:tool
    - title: 'Etapa 5: Testul de menținere a presiunii'
      description: Fiecare cameră gonflabilă presurizată la 1,25x PSI nominalizată și menținută timp de 24-48 de ore. Scăderea presiunii înregistrată pe cameră. Pragul de promovare/respingere documentat. Legat de numărul de serie al carenei.
      icon: tabler:gauge
    - title: 'Etapa 6: Inspecția finală'
      description: Listă de verificare a calității de 100 de puncte care acoperă acuratețea dimensională, finisajul cosmetic, completitudinea accesoriilor, pachetul de documentare și integritatea ambalajului. Independent de echipa de producție.
      icon: tabler:clipboard-check
    - title: 'Etapa 7: Documentația de conformitate'
      description: DoC specific modelului, verificarea plăcuțelor constructorului, completitudinea manualului de utilizare și înregistrarea registrului HIN. Toate documentele de conformitate pregătite și verificate înainte de lansarea expedierii.
      icon: tabler:file-certificate
    - title: 'Etapa 8: Eliberarea expedierii și trasabilitatea'
      description: Lansarea finală necesită trecerea tuturor etapelor QC, completarea documentației de conformitate și verificarea documentației de expediere. Înregistrarea carenei este închisă și arhivată pentru păstrare pe 10+ ani.
      icon: tabler:truck
content_traceability:
  tagline: Trasabilitatea producției
  title: → Fișierul →principal HIN<br />Livrarea recordurilor în carenă →
  subtitle: Fiecare RIB barcă poartă un număr unic de identificare a corpului legat de un lanț complet de evidență de producție și conformitate.
  items:
    - title: Numărul de identificare al corpului (HIN)
      description: Identificator unic de 14 caractere marcat permanent pe fiecare barcă. Codifică codul producătorului (MIC), desemnarea modelului, anul de producție și numărul de serie. Cheia care deblochează întregul lanț de trasabilitate.
      icon: tabler:hash
    - title: Fișierul Tehnic Master
      description: Documentația de conformitate și inginerie pentru familia de modele. Conține desene GA, evaluări de risc, calcule de stabilitate, specificații ale materialelor și standarde aplicabile. Legate de toate carenele acelui model.
      icon: tabler:folder
    - title: Recordul individual al carenei
      description: 'Înregistrare de producție pe carenă: HIN, data producției, lotul de tuburi, certificatele materiale, rezultatul testului de presiune, configurația finală, specificația motorului, rezultatele listei de verificare a calității și destinația livrării. 21+ de câmpuri de date pe carenă.'
      icon: tabler:file-description
    - title: Pachetul de Conformitate pentru Clienți
      description: Pachet de livrare per carenă, inclusiv DoC, fotografie cu plăcuța constructorului, manualul proprietarului, lista de verificare a conformității și fișa finală de configurare. Expediat cu barca și arhivat la fabrică timp de 10+ ani.
      icon: tabler:package
content_red_flags:
  tagline: Capcanele auditului
  title: Semnale de alarmă pentru cumpărători<br />Ușor de recunoscut
  subtitle: Probleme comune care subminează încrederea cumpărătorilor în timpul auditurilor de fabrică. Le abordăm proactiv pe fiecare.
  items:
    - title: Cereri generale CE fără sferă de model
      description: '"Toate produsele CE certificate" fără a specifica ce directivă, ce modele și ce modul de conformitate. Semnal de alarmă: sugerează că conformitatea este superficială, nu pe model, pe configurație.'
      icon: tabler:alert-triangle
    - title: Fără dovezi de testare fizică
      description: 'Afirmațiile de test de presiune fără înregistrări de testare, manometre sau stație de testare vizibile pe podeaua fabricii. Semnal de alarmă: afirmațiile privind calitatea nu pot fi verificate în timpul vizitei.'
      icon: tabler:alert-triangle
    - title: Trasabilitatea materialelor lipsă
      description: 'Fără înregistrări de lot, fără inspecții primite sau fără legătură între certificatele de materiale și produsele finite. Semnal de alarmă: nu există nicio modalitate de a urmări problemele de calitate până la sursă.'
      icon: tabler:alert-triangle
    - title: Documentație generică
      description: 'Un singur DoC care acoperă toate modelele, fără înregistrări specifice HIN sau documente de conformitate "șablon". Semnal de alarmă: conformitatea nu este legată de unitățile individuale de producție.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Transport și ambalare
  title: RIB Container pentru barcă<br />Încărcare și încasare
  subtitle: Soluțiile noastre de transport vă protejează investiția de la Qingdao până în portul de destinație. Planuri de încărcare pentru containere și specificații de cușcă sunt disponibile pentru fiecare model.
  items:
    - title: Configurații de containere de 20ft
      description: 'Container standard de 20 ft: 1-2 RIB bărci (4,0-5,5 m) îmbarcate cu punte și tuburi separate, sau 8-12 SUP scânduri. RIB + SUP Configurații mixte disponibile. Plan detaliat de încărcare oferit pentru fiecare comandă.'
      icon: tabler:box
    - title: Configurații de containere de 40ft
      description: 'Container standard de 40 ft: 2-4 RIB bărci (până la 7,0 m) cu carene încasate și tuburi stivuite, sau 20-30 SUP de scânduri. Sediul de 40 ft disponibil pentru RIB modelele mai înalte. Ambalaj optimizat pentru volum reduce costul de transport pe unitate.'
      icon: tabler:container
    - title: Cușcă din lemn pentru RIB carene
      description: Carcase din aluminiu și GRP sunt ambalate în lăzi din lemn personalizate, cu umplutură din spumă, barieră de umiditate și benzi din oțel. Dimensiunile și greutatea lăzii pe model sunt disponibile pentru planificarea logistică. Certificarea ISPM-15 pentru lemn tratat termic inclusă.
      icon: tabler:wood
    - title: Împachetarea separării tuburilor și a platformei
      description: Tuburile se dezumflau și se pliau separat de carene pentru eficiență în spațiu. Plăcile de pe punte, consolele și scaunele erau ambalate în protecție cu kituri de montare. Instrucțiuni de reasamblare incluse la fiecare transport.
      icon: tabler:package
    - title: Protecție împotriva umidității și coroziunii
      description: Hârtie anticorozivă VCI pentru componente din aluminiu, pachete de gel de silice desicantă și pungi de hardware etanșate în vid. Previne deteriorarea condensului în timpul tranzitului oceanic de 30-45 de zile.
      icon: tabler:droplet-off
    - title: FOB Documentația Qingdao
      description: Bill of lading, factură comercială, lista de ambalare, certificatul de origine și documentația de conformitate per expediere. Consolidarea FCL și LCL disponibilă. Suport pentru documentația vamală pentru piețele din UE, SUA și Orientul Mijlociu.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Dovezi de verificare
  title: Probe de audit<br />Poți verifica la fața locului
  subtitle: În timpul vizitelor la fabrică, clienții pot verifica dovezi specifice în fiecare zonă de producție. Iată ce trebuie să urmărești — și ce pregătim pentru fiecare audit.
  areas:
    - area: Depozit de materii prime
      what_to_verify: Sunt materialele stabile? Există amestec de loturi?
      evidence: Înregistrări de inspecție la recepție, etichete de lot, depozitare FIFO, lista de furnizori aprobați, certificate de materiale (PVC, Hypalon, fibră de sticlă, aluminiu, adezivi, accesorii)
      icon: tabler:building-warehouse
    - area: Producția Tuburilor
      what_to_verify: Cum se garantează rezistența cusăturii și etanșeitatea?
      evidence: Fișe de proces, confirmare prim-articol, înregistrări teste de presiune pe cameră, jurnale de reparare și retestare, înregistrări de instalare a robinetelor
      icon: tabler:flame
    - area: Producția Corpului
      what_to_verify: Cum se controlează consistența structurală?
      evidence: Documente de proces controlate, puncte de control al calității, numerotarea produselor semifinite, măsurători ale grosimii gelcoat-ului, verificarea programului de laminare
      icon: tabler:layers-subtract
    - area: Zona de Asamblare
      what_to_verify: Cum se previn asamblările greșite ale pieselor opționale?
      evidence: BOM, ordine de lucru, liste de verificare a configurației, cartele de inspecție a stației de lucru, verificări de cuplu și funcționale pe model
      icon: tabler:tool
    - area: Stația de Testare
      what_to_verify: Cum confirmați că barca este bună înainte de livrare?
      evidence: Proceduri de testare, listă de instrumente, înregistrări de calibrare, jurnale de test de presiune (1,25x / 24-48h), liste de verificare pentru test funcțional, criterii documentate de trecere/eșec
      icon: tabler:gauge
    - area: Zona Non-Conformități
      what_to_verify: Cum se gestionează defectele?
      evidence: Etichete de izolare, jurnale NCR, analiză a cauzei rădăcină, înregistrări de aprobare a reparațiilor, urmărire CAPA (Acțiune Corectivă și Preventivă)
      icon: tabler:alert-triangle
    - area: Depozitul Produselor Finite
      what_to_verify: Cum preveniți livrările greșite și deteriorarea?
      evidence: Etichete pentru produse finite, înregistrări de potrivire a comenzilor, standarde de ambalare, înregistrări de inspecție pre-livrare
      icon: tabler:box
    - area: Piese de schimb și post-vânzare
      what_to_verify: Puteți susține service-ul pe termen lung?
      evidence: Listă de piese de schimb comune, strategie de inventar, sistem de numerotare a pieselor, documentație a procesului de garanție, tutoriale de întreținere
      icon: tabler:headset
content_closing_script:
  tagline: Audit la Comandă
  title: De la Vizita Fabricii<br />la Proiect Confirmat
  subtitle: Un audit de succes nu ar trebui să se încheie cu fotografii și o strângere de mână. Înainte de plecare, ne asigurăm că trei rezultate comerciale sunt documentate.
  items:
    - title: Confirmarea Configurației Tehnice
      description: Se convine asupra modelului, aplicației, opțiunilor cheie, pieței țintă, cantității estimate și programului de livrare — toate documentate înainte de plecare.
      icon: tabler:checklist
    - title: Confirmarea Documentelor pentru Pasul Următor
      description: 'Definește ceea ce oferă Aquafarer în continuare: GA revizuit, listă de configurații, ofertă, listă de verificare a documentelor, plan de probă sau NDA — cu termene specifice.'
      icon: tabler:file-plus
    - title: Confirmă Timeline-ul Mutual
      description: Configurația revizuită și oferta preliminară în termen de 3 zile lucrătoare. Confirmarea probei sau a aspectului în termen de 7 zile. Revizuirea de inginerie sau inspecția terților în termen de 14 zile. Data următoarei întâlniri și părțile responsabile sunt stabilite.
      icon: tabler:calendar
faq:
  title: Auditul Fabricii — Întrebări Frecvente
  questions:
    - q: Pot să vizitez fabrica personal?
      a: Da. Primim cu plăcere auditurile la fața locului în facilitățile noastre de 12.000 m² din Qingdao. Turul nostru standard acoperă 8 stații, de la depozitul de materii prime până la camera de revizuire a documentelor. Sunt disponibile și tururi virtuale ale fabricii prin apel video pentru calificarea inițială.
    - q: Acceptați audituri efectuate de terți (BSCI, SMETA, SGS)?
      a: Da. Menținem certificarea BSCI (Intertek) și acceptăm protocoale de audit specifice clienților. De asemenea, putem aranja inspecții SGS sau TÜV la cerere. Rapoartele de audit sunt disponibile în conformitate cu NDA.
    - q: Pot vedea testarea la presiune în timpul vizitei?
      a: Stația noastră de testare la presiune face parte din traseul standard al turului. În funcție de programul de producție, puteți observa teste de presiune active cu citiri de manometru și înregistrări ale testelor. Jurnalul testelor de presiune pentru fiecare carcasă este întotdeauna disponibil pentru revizuire.
    - q: Cum gestionați produsele neconforme?
      a: Unitățile neconforme sunt separate, documentate și revizuite conform procesului nostru de acțiune corectivă ISO 9001. Se efectuează analiza cauzelor rădăcină, se implementează acțiuni corective și se mențin înregistrările. Cumpărătorii pot revizui jurnalul nostru NCR în timpul auditurilor.
    - q: Ce documentație de conformitate este disponibilă pentru revizuire?
      a: 'În timpul auditului, puteți revizui: mostre DoC specifice modelului, specificațiile plăcii constructorului, registrul HIN, proiectele manualului de utilizare, listele standardelor aplicabile și înregistrările evaluării conformității pe familia de modele.'
    - q: Cum rezerv un tur virtual al fabricii?
      a: Contactați echipa noastră de vânzări pentru a programa un tur video live prin WhatsApp, Zoom sau Teams. Urmăm aceeași rută de 8 stații și ne putem concentra pe zone specifice în funcție de interesele dumneavoastră. Turul virtual tipic durează 45-60 de minute.
    - q: Este fabrica producătorul efectiv sau o companie de trading?
      a: Aquafarer este producătorul efectiv. Operăm fabrica din Laixi, Qingdao. Licența comercială, domeniul de fabricație și producția fizică pot fi verificate toate în timpul auditului.
    - q: Ce înregistrări de calitate pot examina?
      a: Înregistrările inspecției materialelor pentru intrare, punctele de control QC în proces, jurnalele testelor de presiune, listele de verificare a inspecției finale de 100 de puncte, rapoartele de neconformitate, înregistrările acțiunilor corective și înregistrările de trasabilitate pentru fiecare carcasă. Toate sunt menținute conform cerințelor ISO 9001.
