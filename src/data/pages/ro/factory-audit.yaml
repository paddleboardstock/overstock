hero:
  tagline: Audit de Fabrica și Dovezi
  title: Pregătirea Auditului de Fabrica<br />& Dovezi de Calitate
  subtitle: Tot ce verifică cumpărătorii în timpul unei vizite la fabrică — de la autenticitatea producției și documentația de conformitate până la trasabilitatea producției și sistemele de control al calității. Pregătit pentru audit, în fiecare zi.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer pregătirea auditului de fabrica și dovezi de calitate
direct_answer: Aquafarer menține o facilitate de 12.000 m² în Qingdao pregătită pentru audit, cu procese QC documentate, trasabilitatea materialelor, înregistrări de producție la nivel HIN și documentație de conformitate pentru fiecare șasiu. Tururi de fabrică disponibile fizic și virtual pentru cumpărătorii calificați.
