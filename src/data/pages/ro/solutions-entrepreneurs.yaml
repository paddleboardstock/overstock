hero:
  tagline: Antreprenori de Branduri Acvatice
  title: Lansează-ți Propria Marcă de Sporturi Acvatice<br />Cu Aquafarer OEM/ODM
  subtitle: Producție la etichetă privată completă pentru vânzători Amazon, influenceri de exterior, distribuitori regionali și proprietari de brand pentru prima dată — de la designul produsului până la prima expediere.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer fabrică — producție la etichetă privată pentru mărcile de sporturi acvatice
direct_answer: Aquafarer face ușoară lansarea propriei mărci de sporturi acvatice. Programul nostru de etichetă privată se ocupă de tot, de la selecția produsului și designul matriței personalizate până la imprimarea logo-ului, ambalarea și livrarea directă la clienții tăi. Cu MOQs de 2–5 unități per RIB SKU și 5–10 pentru SUP, și timpi de livrare de 30–45 de zile, antreprenorii la prima încercare trec de obicei de la idee la prima expediere în 60–90 de zile. Alege din catalogul nostru de 50+ modele de inflatable SUP, caiace, RIB și accesorii dovedite, sau dezvoltă un produs complet personalizat cu echipa noastră de inginerie internă.
solution_offerings:
  - title: Lansare Brand Starter
    subtitle: Pentru antreprenori la prima încercare care testează piața
    badge: Popular
    features:
      - title: Selecția Produsului
        description: Alege din 50+ modele de vehicule acvatice gonflabile dovedite, cu preț direct de la fabrică
      - title: Branding personalizat
        description: Imprimarea logo-ului pe plăci, potrivire de culoare personalizată, ambalaje branduite
      - title: Cantitate redusă MOQ
        description: Începe cu doar 2–5 unități per RIB SKU (5–10 pentru SUP) — testează piața înainte de a scala
      - title: Conformitate Garantată
        description: 64 modele certificate CE — vinde global cu încredere
      - title: Suport Logistic
        description: Livrare FOB Qingdao sau CIF la portul tău de destinație
    cta_text: Lansează Brandul Meu
    cta_href: /contact
  - title: Lansare Brand Premium
    subtitle: Pentru branduri serioase care necesită design și ambalaje personalizate
    badge: Premium
    features:
      - title: Design Personalizat de Produs
        description: Dezvoltare matriță la comandă, optimizare formă și ajustare performanță
      - title: Design Complet al Ambalajului
        description: Ambalaj gata de retail, etichete, manuale de instrucțiuni și experiența de unboxing
      - title: Resurse Digitale
        description: Fotografie profesională a produsului, imagini lifestyle și conținut video
      - title: Asigurarea Calității
        description: Inspecție de la terți, rapoarte de audit ale fabricii și eșantioane de producție
      - title: Producție Scalabilă
        description: De la 200 de unități inițiale la 10.000+ cu calitate și prețuri constante
    cta_text: Construiți-vă Brandul
    cta_href: /contact
