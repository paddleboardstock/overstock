testimonial:
  content: Am lansat brandul meu SUP fără experiență în industrie. Echipa Aquafarer m-a ghidat de la selecția produsului la designul logo-ului personalizat și ambalare. Primul meu container a sosit în 11 săptămâni, și am vândut tot în 3 luni pe Amazon. Acum comand al treilea container.
  name: Michael Park
  title: Fondator, Shoreline Paddle Co. — California, SUA
content_segments:
  tagline: Profiluri de Antreprenori
  title: Lansarea Brandului de Sporturi Nautice<br />După Tipul Antreprenorului
  subtitle: Diferiți fondatori aduc puncte forte diferite — expertiză în e-commerce, conexiuni în industrie, acces la conținut sau infrastructură de distribuție. Personalizăm programul de lansare OEM/ODM pentru a se potrivi poziției initiale și ambiției de creștere.
  items:
    - title: Vânzători Amazon FBA & E-Commerce
      subtitle: Constructori de branduri rapizi, orientați pe date
      description: Vânzători online experimentați care lansează produse pentru sporturi nautice pe Amazon, Walmart sau propriile magazine Shopify. Știți cum să optimizați listing-urile, să gestionați PPC și să interpretați datele din categorii — dar aveți nevoie de un partener de producție care înțelege viteza comerțului online, ratele de retur și variațiile sezoniere ale cererii.
      features:
        - Ambalaje pregătite pentru retail, optimizate pentru limitele dimensiunilor FBA
        - EAN/UPC generarea de coduri de bare și documentație conformă Amazon
        - MOQ scăzut (2–5 unități per RIB SKU, 5–10 per SUP) pentru testarea cererii înainte de scalare
        - Consolidarea containerelor mixte pentru optimizarea costului pe unitate livrată
    - title: Influențatori de Fitness & Stil de Viață în Outdoor
      subtitle: Creatori de brand orientați către public
      description: Creatori de conținut, antrenori de fitness și personalități din mediul outdoor cu un public implicat, gata să investiți într-un brand de lifestyle. Tu aduci comunitatea și povestea brandului — noi ne ocupăm de ingineria produsului, conformitate, ambalare și logistică astfel încât tu să te poți concentra pe conținut și conversie.
      features:
        - 'Transformare rapidă cu branding personalizat: ciclu de probă de 2 săptămâni cu culorile + ale logo-ului'
        - Ediții limitate co-branded și lansări sezoniere de culori
        - Suport pentru producția de fotografie și video lifestyle
        - 'Livrare directă către consumator: fabrica → expediere directă către client'
    - title: Distribuitori regionali mergând direct către consumator
      subtitle: Operatori B2B care își lansează propriul brand
      description: Distribuitori consacrați de echipamente marine sau outdoor care doresc să lanseze propriul brand alături de sau în locul revânzării produselor terților. Ai deja infrastructură de depozit, relații logistice și o bază de clienți — ai nevoie de un partener de fabrică care să ofere calitate private-label la scară.
      features:
        - Design-uri exclusive de produse pentru teritoriul tău de piață
        - Dezvoltare completă OEM a matriței pentru forme și specificații proprietare
        - Documentație de conformitate localizată (CE, UKCA, USCG) pentru regiunea ta
        - 'Ambalaje co-branded: marcă distribuție + Aquafarer calitate'
    - title: Fondatori de brand pentru prima dată
      subtitle: Crearea ghidată a brandului pas cu pas
      description: Antreprenori pasionați fără experiență în industria sporturilor nautice, care doresc să construiască un brand de la zero. Ai nevoie de un partener care să te ghideze în fiecare etapă — de la selecția produsului și denumire, la design-ul ambalajului și logistica primului container — cu termene clare și prețuri transparente.
      features:
        - Selecție consultativă a produselor din 50+ modele de bază dovedite
        - 'Pachet de identitate a brandului: denumire, logo, paletă de culori, design ambalaj'
        - Termen de 60–90 de zile de la concept la prima livrare
        - Manager de proiect dedicat pentru proprietarii de brand pentru prima dată
