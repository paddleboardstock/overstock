hero:
  tagline: Școli și Centre de Instruire pentru Sporturi Acvatice
  title: Soluții de Echipamente<br />Pentru SUP & Școli de Caiac
  subtitle: Echipamente comerciale fiabile pentru școli de caiac, instruire de surf, antrenamente de caiac și programe de educație pentru sporturi acvatice, la orice scară.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP plăci pentru școli și centre de instruire
direct_answer: Aquafarer furnizează SUP și școlilor de caiac din întreaga lume plăci comerciale, echipamente de siguranță și pachete pentru instructori. Echipamentele noastre sunt realizate pentru utilizare zilnică în instruire — PVC mai groase, miezuri drop-stitch ranforsate și designuri de carene stabile care oferă încredere începătorilor și fiabilitate instructorilor. Pachetele includ branding personalizat, programe de piese de schimb și resurse de instruire.
solution_offerings:
  - title: Pachet de Pornire pentru Școală
    subtitle: Pentru programe noi și centre de instruire mici
    badge: Popular
    features:
      - title: Plăci pentru Studenți
        description: 10–25 plăci SUP all-around sau caiace recreative cu platforme stabile pentru lecții pentru începători
      - title: Plăci pentru Intructor
        description: Plăci mai late și mai lungi cu stabilitate suplimentară și punți EVA antiderapante pentru instruire
      - title: Echipament de siguranță
        description: Veste de salvare, curele de siguranță, vuvuzele și saci de aruncat în culori asortate
      - title: Depozitare și Transport
        description: Suporturi pentru plăci stivuibile, suporturi căptușite pentru caiace și carucioare de transport
      - title: Suport Curricular
        description: Șabloane de lecții, liste de verificare a siguranței și ghiduri de progresie a abilităților
    cta_text: Pachetul Meu de Pornire a Școlii
    cta_href: /contact
  - title: Pachetul Premium pentru Școală
    subtitle: Pentru școli stabilite și operatori multi-program
    badge: Best Value
    features:
      - title: Flotă Completă
        description: 25–50 de plăci sau caiace cu flotă mixtă (all-around, touring, mărimi pentru tineret)
      - title: Flotă Instructori
        description: 3–5 plăci specializate pentru instructori cu suporturi pentru sistem audio integrate
      - title: Stație de Siguranță
        description: Stație centralizată pentru echipamente de siguranță cu veste de salvare, radiouri, trusă de prim ajutor și semnalizare
      - title: Pachet de Branding
        description: Imprimare completă a logo-ului pe plăci, vâsle, veste de salvare și uniforme
      - title: Program de Mentenanță
        description: Kituri de întreținere trimestriale, pachete de piese de schimb și instruire pentru reparații
    cta_text: Construiți Pachet Premium
    cta_href: /contact
  - title: Pachet de Franciză Școlară
    subtitle: Pentru lanțuri cu mai multe locații și operatori de franciză
    badge: Enterprise
    features:
      - title: Standardizarea Flotei
        description: Echipamente identice în toate locațiile pentru o experiență constantă a elevilor
      - title: Comandă Centralizată
        description: Comandă consolidată, prețuri în vrac și gestionare centralizată a pieselor de schimb
      - title: Instruire Instructori
        description: Certificare în manipularea și întreținerea echipamentului pentru toți instructorii
      - title: Co-Branding
        description: Branding comun cu opțiuni de co-branding + Aquafarer
      - title: Suport pentru Extindere
        description: Consultanță pentru scalare, prognoza echipamentelor și configurarea noilor locații
    cta_text: Discută Planul de Franciză
    cta_href: /contact
benefits:
  - title: Conceput pentru Instrucție Zilnică
    description: PVC mai groase și șine armate rezistă utilizării zilnice de către elevi, căderilor pe nisip și aterizărilor pe teren stâncos.
    icon: tabler:shield
  - title: Platforme de Învățare Stabile
    description: Șaluge mai late și rockere mai plate oferă încredere începătorilor. Instructorii se concentrează pe predare, nu pe echipament.
    icon: tabler:scale
  - title: Ușor de Depozitat și Transportat
    description: Designul gonflabil poate fi depozitat în spații mici. Plăcile dezumflate se potrivesc în portbagajele standard ale vehiculelor pentru predare mobilă.
    icon: tabler:box-seam
  - title: Branding personalizat
    description: Logo-urile și culorile școlii pe fiecare placă. Brandul tău, identitatea ta — nu echipament generic de închiriere.
    icon: tabler:brush
content_segments:
  tagline: Profiluri Școlare
  title: Soluții de Educație pentru Sporturi Acvatice<br />După Tip de Program
  subtitle: Școli de paddle, academii de surf, programe universitare și operatori de franciză se confruntă cu diferite provocări operaționale — de la integrarea curriculumului până la standardizarea flotei în mai multe locații. Configurăm pachete de echipamente pentru a se potrivi modelului educațional.
  items:
    - title: Școli Independente de SUP & Caiace
      subtitle: Centre de instruire administrate de proprietari
      description: Școli mici și medii operate de instructori-proprietari oferind lecții SUP, instruire de caiac și cursuri de certificare. Echipamentul trebuie să fie suficient de durabil pentru utilizare zilnică în instruire, accesibil pentru bugetul unei afaceri mici și suficient de versatil pentru a deservi elevi de la începători până la intermediari într-o singură flotă.
      features:
        - Plăci stabile pentru toate SUP regulile și caiaci recreaționale pentru lecții de începători
        - Consilii specifice instructorilor, cu stabilitate suplimentară pentru antrenament din apă
        - Au inclus șabloane de planuri de lecție și ghiduri de progresie a abilităților
        - Program anual de reîmprospătare a echipamentelor cu reduceri la schimb
    - title: Programe de recreere universitară și colegială
      subtitle: Flote de recreere studențești la scară largă
      description: Departamentele universitare de recreere operează cluburi de vâslă, programe de închiriere și cursuri de instruire ca parte a ofertei de recreere pe campus. Echipamentul se confruntă cu o utilizare maximă în semestre, necesită sisteme ușoare de check-in/check-out și trebuie să reziste nivelurilor variate de abilități, de la studenți la începători până la vâslași avansați.
      features:
        - PVC Construcții cu durabilitate ridicată, clasificate pentru cicluri de utilizare instituțională
        - Flote codificate pe culori după nivelul de abilități pentru o gestionare ușoară
        - Compatibilitatea sistemului RFID sau al sistemului de monitorizare a inventarului bazat pe abțibilduri
        - Prețuri în gros cu termeni de comandă și plată pe semestru
    - title: Școli și Academii de Surf
      subtitle: Programe de instruire pentru surf de coastă
      description: Școli de surf care predau SUP abilități de surfing, vâslit culcat și caiac de surf în medii oceanice. Echipamentul trebuie să facă față condițiilor zonei de surf — rezistență la impact, toleranță la nisip și apă sărată și reluare ușoară între lecțiile la fiecare oră.
      features:
        - Forme specifice valurilor, cu șine întărite și construcție rezistentă la impacturi
        - Opțiuni soft-fin și lese spiralate pentru siguranța elevilor
        - Material cu clătire rapidă care se usucă între rotațiile lecției
        - Program de înlocuire a flotei cu inspecție și reîmprospătare la sfârșitul sezonului
    - title: Lanțuri de francize și cu mai multe locații
      subtitle: Echipamente standardizate între locații
      description: Operatorii cu mai multe locații derulează programe standardizate de instruire în mai multe orașe sau regiuni. Consistența flotelor între locații este esențială — fiecare student ar trebui să aibă aceeași experiență cu echipamentul, indiferent de locația de franciză pe care o vizitează. Comanda centralizată, uniformitatea brandului și suportul pentru scalare sunt esențiale.
      features:
        - Specificații identice ale flotei în toate locațiile francizei
        - Comenzi centralizate și consolidate cu preț de volum
        - 'Opțiuni de co-branding: brand + Aquafarer franciză co-brand'
        - 'Kit de configurare a noii locații: echipamente, semnalizare și inventar de deschidere'
