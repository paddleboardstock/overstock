qc_section:
  tagline: Controlul calității
  title: Procesul de testare și asigurare a calității
  subtitle: Fiecare navă trece prin teste obligatorii înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct conducerii.
  steps:
    - step: '1'
      title: Inspecția materiilor prime
      desc: PVC, Hypalon, iar drop-stitch țesăturile trec prin testarea la tracțiune (ASTM D751), propagarea rupturii și UV verificarea rezistenței înainte ca orice lot să intre în producție.
    - step: '2'
      title: Testul de retenție a aerului de 48 de ore
      desc: Fiecare cameră de tub este umflată la 125% din presiunea nominală și menținută timp de 48 de ore. O cădere de presiune care depășește 5% declanșează respingerea automată și reinspecția îmbinării.
    - step: '3'
      title: Testarea încărcării și echilibrului
      desc: Bărcile finalizate sunt încărcate la capacitatea maximă nominală și testate pentru stabilitate, francbord și manevrabilitate. Fiecare navă este testată în apă înainte de inspecția finală.
oem_section:
  tagline: OEM Proiecte
  title: OEM Studii de caz de brand și parteneriate
  subtitle: De la concept la container — cum ajutăm brandurile globale să lanseze și să extindă liniile lor de ambarcațiuni gonflabile.
  cases:
    - challenge: Retailerii europeni de outdoor aveau nevoie de o linie de marcă SUP proprie, cu grafică unică pentru terase, PVCambalaje ecologice și gata de vânzare — toate livrate în 60 de zile.
      solution: Am dezvoltat fișiere digitale personalizate, REACHconform cu sursaPVC, și am comprimat eșantionarea de la 3 la 1 runde, prin co-localizarea echipei de design la fabrica noastră din Qingdao.
      result: 55 de zile de la semnarea poștalului până FOBla . 2.400 de unități pe 4 SKU-uri. Comanda repetată a fost plasată înainte de sosirea primului container.
    - challenge: Startup-ul american de sporturi nautice avea nevoie de un drop-stitch caiac de înaltă performanță, cu formă personalizată a carcasei, ambalaje co-branduite și BSCI certificare pentru plasare în retail.
      solution: A adaptat drop-stitch matrița existentă a caiacului cu profil modificat al balansoarelor, a dezvoltat o grafică de ambalaje co-branduită și a furnizat BSCI documentație completă de audit.
      result: Listată cu succes în 3 mari lanțuri de produse outdoor din SUA. 5.000+ de unități în primul an cu o rată de vânzare de 98%.
    - challenge: Distribuitorul australian a necesitat o CERIB gamă certificată cu culori personalizate pentru tuburi, Hypalon opțiune de upgrade și conformitate cu standardul australian AS 1799.
      solution: A produs mostre pre-producție cu 4 variante de culoare din tuburi, provenite CSM Hypalon de la furnizorul japonez, și a coordonat testarea de conformitate AS 1799 de către terți.
      result: Gama de 3 RIB modele lansată pe piața AU/NZ. A urmat o licitație guvernamentală câștigată pentru 12 patruleRIBs.
faq_section:
  tagline: Întrebări frecvente
  title: B2B & OEM Întrebări frecvente
  questions:
    - q: Care este cantitatea minimă de comandă (MOQ) pentru OEM plăcile gonflabile SUP ?
      a: MOQ începe de la 5–10 unități pentru OEM modelele standard. Matrițele personalizate și proiectele cu marcă privată necesită minimum 200 de unități, în funcție de complexitate. Comenzi de testare și serii de probă sunt disponibile pentru lansările de branduri noi.
    - q: Aquafarer Deține BSCI certificare?
      a: Da. Fabrica noastră menține BSCI certificare valabilă de conformitate socială (raportul de audit disponibil la cerere). Deținem, ISO de asemenea, 9001:2015 pentru managementul calității, iar 64 dintre modelele noastre de produse au CE certificare (TÜVRheinland).REACH și RoHS documentație de conformitate furnizată la fiecare OEM expediere.
    - q: Care este timpul tipic de livrare pentru o OEM comandă?
      a: Timpul standard de livrare este de 30–45 de zile de la confirmarea comenzii și efectuarea avansului. Dezvoltarea matriței personalizate adaugă 15–20 de zile pentru scule. Oferim producție accelerată pentru comenzile urgente și vârfurile sezoniere în perioada pre-vară (ianuarie–martie).
    - q: Puteți să expediați FOB Qingdao sau CIF către portul nostru?
      a: Da. Expediem către FOB Qingdao, CIF porturi globale majore și DDP pentru parteneri calificați. Echipa noastră de logistică se ocupă de rezervarea containerelor, documentația pentru export și procedurile vamale. Expediem către 50+ de țări din piețele UE, SUA, AU și Asia.
b2b_moq: 'Standard MOQ: 5–10 unități pe model (SUP/kayak/drop-stitch). RIB MOQ: 2–5 unități. Comenzile de probă sunt binevenite pentru noi parteneriate.'
production_flow:
  tagline: Flux de producție
  title: De la material la barca finisată
  subtitle: Fiecare barcă trece prin 6 etape de producție, cu puncte de control al calității la fiecare pas. Fără scurtături, fără inspecții sărite.
  stages:
    - stage: '01'
      title: Recepția Materialelor și Controlul Calității la Primire
      description: Toate materialele primite sunt înregistrate după numărul de lot/serie în sistemul nostru ERP. Rolele de țesătură PVC, miezurile drop-stitch, valvele, adezivii și componentele hardware sunt puse în carantină până la aprobarea QC.
      qc_check: Rezistență la tracțiune (ASTM D751), rezistență la rupere (ISO 4674), calibru de grosime, vâscozitate adeziv, scanare vizuală pentru defecte
      qc_threshold: 100% dintre loturi au fost testate. Se respinge dacă rezistența la tracțiune < 90% din specificație, ruperea < minimul specificației sau există vreun defect vizual
      responsibility: Echipa QC care sosește (3 inspectori)
    - stage: '02'
      title: CNC Tăiere și Pregătirea Materialelor
      description: Nesting-ul optimizat de calculator plasează panourile pe PVC material pentru a minimiza risipa. CNC Mașinile automate de tăiat mențin o precizie pozițională de 0,1 mm.
      qc_check: Verificarea dimensională față de fișierele CAD DXF, inspecția calității muchiilor, verificarea numărului de panouri
      qc_threshold: Fiecare al 20-lea panou măsurat. Toleranța ±0,5 mm. Respingerea lotului dacă >2% depășesc toleranța
      responsibility: Șef atelier de tăiere
    - stage: '03'
      title: Sudură și Drop-Stitch Lipire
      description: Miezurile Drop-stitch sunt legate de laminatele exterioare PVC prin laminare la cald. Camerele tubulare sunt sudate RF sau sudate cu aer cald. Benzile de șină sunt lipite prin fuziune în strat triplu.
      qc_check: Test de decojire la fiecare 50 de unități (ASTM D751), măsurarea lățimii sudurii, revizuirea jurnalului temperaturii aerului cald, inspectarea vizuală a cusăturii sub iluminare din spate
      qc_threshold: Rezistența la decojire min 8 N/cm. Toleranța lățimii sudurii ±1 mm. Orice canalizare vizibilă = respins
      responsibility: Controlul calității sudurii (2 inspectori pe schimb)
    - stage: '04'
      title: Asamblare și Echipare
      description: 'Bărcile se deplasează la asamblarea finală, unde toate componentele sunt montate: tuburile carenei +, supapele instalate, inelele în D, mânerele, cutiile pentru flotoare și montarea sacului de transport. Fiecare unitate urmează o listă de verificare a asamblării de 100 de puncte.'
      qc_check: Aprobarea listei de verificare de 100 de puncte pe unitate, testarea funcției valvei (10 cicluri deschidere/închidere), verificarea cuplului hardware-ului, inspecție vizuală
      qc_threshold: 'Politică zero-defect pentru articole critice pentru siguranță (supape, inele D, mânere). Cosmetic minor: AQL 2,5 (ISO 2859)'
      responsibility: Șef echipă asamblare + controlul calității pe linie
    - stage: '05'
      title: Testarea presiunii și reținerea calității
      description: Fiecare cameră este umflată la 1,25× presiunea nominală (de obicei 20–25 PSI) și menținută timp de 24–48 de ore. Senzorii de presiune înregistrează continuu. Camerele care depășesc o scădere a presiunii de 5% sunt respinse și trimise pentru re-inspecția cusăturilor.
      qc_check: Jurnal de menținere a presiunii timp de 24 de ore, calibrarea senzorului verificată zilnic, citire a presiunii compensată pentru temperatură, retestarea cusăturii după reparare
      qc_threshold: Scădere maximă a presiunii de 5% pe 24h la temperatură stabilă. Oricărei camere care depășește acest lucru = retestare 100% a întregului lot de producție
      responsibility: Laborator de calitate (independent de producție, raportează managementului)
    - stage: '06'
      title: Inspecție finală și ambalare
      description: Inspecție vizuală și funcțională finală. Defecte de suprafață, consistența culorii, verificarea etichetei/BIN-ului, integritatea ambalajului și completitudinea accesoriilor. Unitățile sunt ambalate în vid, în cutii și paletizate pentru încărcarea containerului.
      qc_check: Inspecție vizuală completă, lista de verificare a accesoriilor conform SKU, test de cădere a ambalajului (1 m, eșantion aleatoriu), verificare scanare etichetă/cod de bare
      qc_threshold: AQL 2,5 pentru defecte majore, AQL 4,0 pentru defecte minore. Toleranță zero pentru defecte de siguranță. 100% din unități inspectate vizual
      responsibility: Echipa finală QC (4 inspectori) + Șef echipă ambalare
workforce:
