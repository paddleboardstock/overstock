hero:
  tagline: Fabrică
  title: Fabrică & Producție
  subtitle: 12.000 m² de producție integrată — de la materii prime la barca finalizată
intro:
  - Ca brand de fabrică al **Aquafarer Qingdao Manufacturing Hub**, Aquafarer controlează fiecare etapă a producției — de la sosirea materiilor prime PVC și a materialelor din fibră de sticlă până la inspectarea finală pre-livrare a bărcii finite. Facilitățile noastre de producție din Zona de Dezvoltare Economică Qingdao se întind pe 12.000 de metri pătrați și găzduiesc ateliere dedicate pentru tăierea PVC, etanșarea tuburilor la cald, producția de carene din fibră de sticlă RIB, imprimare digitală SUP, asamblare finală și testarea calității.
  - Prin integrarea designului, ingineriei, prototipării, producției și testării sub același acoperiș, eliminăm ineficiențele producției pe contract și menținem controlul direct asupra calității construcției, selecției materialelor și termenelor de livrare. Fiecare barcă care părăsește atelierul nostru este construită de oamenii noștri, cu echipamentele noastre, conform standardelor noastre.
