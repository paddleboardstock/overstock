      detail: În funcție de categoria produsului
    - value: 1.25×
      label: Presiunea de test comparativ cu cea nominală
      detail: Mărja de siguranță pe fiecare cameră
    - value: 0%
      label: Toleranță la defecte de siguranță
      detail: Supape, D-ineluri, cusături, flotabilitate
