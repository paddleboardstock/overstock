qc_section:
  tagline: Controlul calității
  title: Procesul de testare și asigurare a calității
  subtitle: Fiecare placă trece prin teste obligatorii înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct managementului.
  steps:
    - step: '1'
      title: Inspecția materiilor prime
      desc: Țesăturile PVC și drop-stitch trec prin teste de tracțiune, propagare a rupurilor și verificarea rezistenței UV înainte ca orice lot să intre în producție.
    - step: '2'
      title: Testul de retenție a aerului de 48 de ore
      desc: Fiecare cameră a plăcii este umflată până la 125% din presiunea nominală și menținută timp de 48 de ore. O scădere a presiunii care depășește 5% declanșează respingerea automată și re-inspecția cusăturii.
    - step: '3'
      title: Testarea încărcării și echilibrului
      desc: Plăcile finalizate sunt încărcate la capacitatea maximă specificată și testate pentru stabilitate, freboard și manipulare. Fiecare placă este testată cu apă înainte de inspecția finală.
faq_section:
  tagline: Întrebări frecvente
  title: Întrebări Frecvente
  questions:
    - q: Unde sunt fabricate plăcile dumneavoastră de paddle?
      a: Fiecare placă este construită în propria noastră fabrică de 12.000 m² din Weihai, China. Nu subcontractăm — designul, materialele, sudura, asamblarea și testarea se desfășoară toate sub același acoperiș, astfel încât calitatea nu depinde niciodată de o terță parte.
    - q: De ce sunt prețurile dumneavoastră atât de mult mai mici decât cele de retail?
      a: Vindem stoc excedentar de fabrică și loturi de lichidare direct din propria noastră unitate de producție — fără intermediari, fără adaos comercial. Aceasta înseamnă pachete complete SUP cu reduceri de până la 60% față de prețurile obișnuite de retail, cu aceeași calitate testată la presiune.
    - q: Ce este inclus cu o placă?
      a: 'Fiecare SUP este expediat ca pachet complet: placă, rucsac de călătorie, pompă manuală, pagaj reglabil, pinion detașabil, coardă în spirală și kit de reparații.'
    - q: Cât de repede pleacă comenzile?
      a: Comenzile aflate în stoc părăsesc fabrica noastră din Weihai în 2-3 zile lucrătoare cu livrare cu urmărire către 50+ țări din UE, America de Nord, Asia-Pacific și alte regiuni.
production_flow:
  tagline: Flux de producție
  title: De la material la placă finisată
  subtitle: Fiecare placă trece prin 6 etape de producție cu puncte de control QC la fiecare pas. Fără scurtături, fără inspecții sărite.
  stages:
    - stage: '01'
      title: Recepția Materialelor și Controlul Calității la Primire
      description: Toate materialele primite sunt înregistrate după numărul de lot/serie în sistemul nostru ERP. Rolele de țesătură PVC, miezurile drop-stitch, valvele, adezivii și componentele hardware sunt puse în carantină până la aprobarea QC.
      qc_check: Rezistență la tracțiune, rezistență la rupere, calibru de grosime, vâscozitate adeziv, scanare vizuală pentru defecte
      qc_threshold: 100% dintre loturi au fost testate. Se respinge dacă rezistența la tracțiune < 90% din specificație, ruperea < minimul specificației sau există vreun defect vizual
      responsibility: Echipa QC care sosește (3 inspectori)
    - stage: '02'
      title: CNC Tăiere și Pregătirea Materialelor
      description: Nesting-ul optimizat de calculator plasează panourile pe PVC material pentru a minimiza risipa. CNC Mașinile automate de tăiat mențin o precizie pozițională de 0,1 mm.
      qc_check: Verificarea dimensională față de fișierele CAD DXF, inspecția calității muchiilor, verificarea numărului de panouri
      qc_threshold: Fiecare al 20-lea panou măsurat. Toleranța ±0,5 mm. Respingerea lotului dacă >2% depășesc toleranța
      responsibility: Șef atelier de tăiere
    - stage: '03'
      title: Sudură și Drop-Stitch Lipire
      description: Miezurile Drop-stitch sunt legate de laminatele exterioare PVC prin laminare la cald. Camerele tubulare sunt sudate RF sau sudate cu aer cald. Benzile de șină sunt lipite prin fuziune în strat triplu.
      qc_check: Test de dezlipire la fiecare 50 de unități, măsurarea lățimii sudurii, revizuirea jurnalului temperaturii aerului cald, inspecția vizuală a cusăturii sub lumină din spate
      qc_threshold: Rezistența la decojire min 8 N/cm. Toleranța lățimii sudurii ±1 mm. Orice canalizare vizibilă = respins
      responsibility: Controlul calității sudurii (2 inspectori pe schimb)
    - stage: '04'
      title: Asamblare și Echipare
      description: 'Plăcile se mută la asamblarea finală, unde toate componentele sunt montate: ventiluri instalate, inele-D, mânere, casete pentru aripioare și montarea genții de transport. Fiecare unitate urmează o listă de verificare de asamblare de 100 de puncte.'
      qc_check: Aprobarea listei de verificare de 100 de puncte pe unitate, testarea funcției valvei (10 cicluri deschidere/închidere), verificarea cuplului hardware-ului, inspecție vizuală
      qc_threshold: Politică de zero defecte pentru componentele critice pentru siguranță (ventile, inele-D, mânere). Defecte cosmetice minore în limite cosmetice stricte.
      responsibility: Șef echipă asamblare + controlul calității pe linie
    - stage: '05'
      title: Testarea presiunii și reținerea calității
      description: Fiecare cameră este umflată la 1,25× presiunea nominală (de obicei 20–25 PSI) și menținută timp de 24–48 de ore. Senzorii de presiune înregistrează continuu. Camerele care depășesc o scădere a presiunii de 5% sunt respinse și trimise pentru re-inspecția cusăturilor.
      qc_check: Jurnal de menținere a presiunii timp de 24 de ore, calibrarea senzorului verificată zilnic, citire a presiunii compensată pentru temperatură, retestarea cusăturii după reparare
      qc_threshold: Scădere maximă a presiunii de 5% pe 24h la temperatură stabilă. Oricărei camere care depășește acest lucru = retestare 100% a întregului lot de producție
      responsibility: Laborator de calitate (independent de producție, raportează managementului)
    - stage: '06'
      title: Inspecție finală și ambalare
      description: Inspecție vizuală și funcțională finală. Defecte de suprafață, consistența culorii, verificarea etichetei/BIN-ului, integritatea ambalajului și completitudinea accesoriilor. Unitățile sunt ambalate în vid, în cutii și paletizate pentru încărcarea containerului.
      qc_check: Inspecție vizuală completă, lista de verificare a accesoriilor conform SKU, test de cădere a ambalajului (1 m, eșantion aleatoriu), verificare scanare etichetă/cod de bare
      qc_threshold: Toleranță zero pentru defecte de siguranță. Defectele cosmetice în limite stricte. 100% din unități inspectate vizual.
      responsibility: Echipa finală QC (4 inspectori) + Șef echipă ambalare
workforce:
  tagline: Oamenii noștri
  title: Forța de muncă și expertiză
  engineers: 25+
  engineers_detail: Ingineri în R&D, design matrițe, laborator materiale și inginerie de producție. În medie 7+ ani în producția de obiecte gonflabile.
  shift_pattern: 2 schimburi/zi (07:00–15:30, 15:30–00:00). Schimb de noapte opțional pentru comenzi urgente.
  training: Instruire lunară QC, exerciții trimestriale de securitate, evaluare anuală a competențelor. Noii angajați finalizează 40 de ore de instruire înainte de a lucra pe linia de producție.
  departments:
    - name: R&D & Inginerie
      count: 25+
      role: Design produs, inginerie matriță, laborator materiale
    - name: Tăiere și pregătire materiale
      count: 15
      role: CNC tăiere, pregătirea panourilor, manipularea materialelor
    - name: Sudură și laminare
      count: 40
      role: Sudură RF, sudură cu aer cald, drop-stitch lipire
    - name: Artă și finisare a punții
      count: '25'
      role: EVA montare punte, finisare serie-artă
    - name: Asamblare și Echipare
      count: 35
      role: Asamblare finală, instalare hardware, verificare sisteme
    - name: Controlul calității
      count: 12
      role: QC la primire, QC în proces, inspecție finală, testare în laborator
    - name: Logistică și ambalare
      count: 20
