hero:
  tagline: Fabrica
  title: Fabrică & Producție
  subtitle: 12.000 m² de producție integrată — de la materie primă la placă finisată
intro:
  - Ca marcă a fabricii **Paddle Board Overstock Centrul de Producție Weihai**, Paddle Board Overstock controlează fiecare etapă a producției — de la sosirea materialelor brute PVC și drop-stitch până la inspecția finală pre-livrare a plăcii finite. Facilitățile noastre de producție din Zona de Dezvoltare Economică Weihai se întind pe 12.000 de metri pătrați și includ ateliere dedicate pentru tăierea PVC, sigilarea termică și sudură, finisarea artă deck, asamblarea finală și testarea calității.
  - Prin integrarea designului, ingineriei, prototipurilor, producției și testării sub același acoperiș, eliminăm ineficiențele producției prin contract și menținem controlul direct asupra calității construcției, selectării materialelor și termenelor de livrare. Fiecare placă care părăsește atelierul nostru este construită de oamenii noștri, pe echipamentele noastre, conform standardelor noastre.
