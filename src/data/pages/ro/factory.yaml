  stats:
    - value: 100%
      label: Unități testate la presiune
      detail: Fiecare placă, fiecare cameră, fiecare lot
    - value: <5%
      label: Căderea maxim permisă a presiunii
      detail: Pe parcursul a 24 de ore la 1,25× presiunea nominală
    - value: 99.3%
      label: Rata produselor fără defecte
      detail: Conform eșantionării QC interne
    - value: 24–48h
