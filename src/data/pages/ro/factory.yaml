material_traceability:
  tagline: Trasabilitate
  title: Urmărirea materialelor și controlul lotului
  description: Fiecărui lot de materie primă i se atribuie un număr de lot unic în sistemul nostru ERP. De la primire, prin producție, până la produsul finit, fișa de materiale a fiecărei bărci se leagă înapoi de lotul furnizorului original. Acest lucru permite trasabilitate completă în upstream pentru orice cerere de calitate sau conformitate.
  system: Sistem personalizat ERP (sistem intern) + etichete fizice de lot pe fiecare ordine de lucru
  coverage: 100% din materialele de producție — PVC, Hypalon, drop-stitch țesătură, adezivi, supape, accesorii, ambalaje
  records_retained: 10 ani (conform cerinței CE 2013/53/UE)
  suppliers:
    - material: Material de calitate marină PVC
      source: Furnizori chinezi și coreeni
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Țesătură Drop-stitch
      source: Țesut intern + partener extern
      certified: Control intern al calității + furnizor ISO 9001
    - material: Supape & accesorii
      source: Chinese OEM suppliers
      certified: ISO 9001, certificate de materiale pe lot
