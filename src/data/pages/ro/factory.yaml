  shift_pattern: 2 schimburi/zi (07:00–15:30, 15:30–00:00). Schimb de noapte opțional pentru comenzi urgente.
  training: Instruire lunară QC, exerciții trimestriale de securitate, evaluare anuală a competențelor. Noii angajați finalizează 40 de ore de instruire înainte de a lucra pe linia de producție.
