material_traceability:
  tagline: Trasabilitate
  title: Urmărirea materialelor și controlul lotului
  description: Fiecare lot de materie primă primește un număr de lot unic în sistemul nostru ERP. De la sosire și până la producție și produsul finit, lista materialelor fiecărui panou se leagă înapoi de lotul original al furnizorului. Acest lucru permite trasabilitate completă în amonte pentru orice întrebare legată de calitate.
  system: Sistem personalizat ERP (sistem intern) + etichete fizice de lot pe fiecare ordine de lucru
  coverage: 100% din materialele de producție — PVC, țesătură drop-stitch, spumă EVA, adezivi, supape, feronerie, ambalaje
  records_retained: 10 ani
