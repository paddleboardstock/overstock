workshops_section:
  tagline: Ateliere
  title: Ateliere de producție
  workshops:
    - title: PVC Tăiere & Pregătirea materialelor
      description: Mașinile automate de tăiere CNC procesează materialele PVC și drop-stitch cu precizie submilimetrică. Plasarea optimizată de computer minimizează deșeurile de materiale și asigură că fiecare panou respectă specificațiile dimensionale înainte de sudură.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Sudură și sigilare termică
      description: Atelier de sudură dedicat cu mașini de sigilare termică și prese dielectrice RF. Sudorii cu aer cald leagă și fuzează laminatele nucleului drop-stitch și benzile de șină, în timp ce sudurile RF produc cusături etanșe și de înaltă rezistență.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Artă pe punte & EVA Finisare
      description: 'Punțile din seria Art iau formă aici: panourile de spumă EVA tăiate cu precizie sunt așezate în modele complete de punte, lipite și tăiate manual pentru un finisaj aderent, confortabil și durabil — aspectul distinctiv al fiecărei plăci din seria art.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: Imprimare & Decorare SUP
      description: Plăcile SUP sunt decorate folosind imprimarea digitală pentru grafice color complete și serigrafie pentru logo-uri și modele repetitive. Imprimantele digitale produc designuri foto-realiste pentru punte, în timp ce serigrafia oferă mărci de brand durabile și vii.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montaj final & Montare catarge
      description: Linia de asamblare unde plăcile primesc valvele, inelele D, mânerele, aripioarele și atașamentele pentru lesă. Fiecare placă urmează o listă de verificare de 100 de puncte semnată de liderul echipei.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Teste de calitate & Inspecție
      description: Fiecare placă completă trece prin teste obligatorii de retenție a aerului, verificarea dezlipirii cusăturilor și control complet al sistemelor înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct managementului.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
