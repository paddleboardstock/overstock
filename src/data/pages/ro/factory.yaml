workshops_section:
  tagline: Ateliere
  title: Ateliere de producție
  workshops:
    - title: PVC Tăiere & Pregătirea materialelor
      description: Mașinile automate de tăiere CNC procesează țesături PVC, Hypalon și drop-stitch cu precizie sub-milimetrică. Optimizarea cu ajutorul calculatorului reduce pierderile de material și asigură că fiecare panou respectă specificațiile dimensionale înainte de sudare.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Sudarea tuburilor & Sigilarea termică
      description: Atelier de sudură dedicat, cu mașini de sigilare termică și prese dielectrice RF. Sigilatoarele cu aer cald leagă și fuzionează camerele tubulare PVC, în timp ce sudurile RF produc cusături etanșe și rezistente, care depășesc cerințele ISO 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: Producția carenelor RIB — Fibra de sticlă
      description: Carenele de bărci RIB sunt produse prin matrițare manuală cu fibra de sticlă, folosind sisteme de rășini poliesterice și vinilester. Fiecare strat este rulat manual și ambalat în vid pentru calitate constantă. Cabina de pulverizare Gelcoat oferă un finisaj marin lucios și rezistent la UV.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: Imprimare & Decorare SUP
      description: Plăcile SUP sunt decorate folosind imprimarea digitală pentru grafice color complete și serigrafie pentru logo-uri și modele repetitive. Imprimantele digitale produc designuri foto-realiste pentru punte, în timp ce serigrafia oferă mărci de brand durabile și vii.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Montaj final & Montare catarge
      description: Linie de asamblare unde carenele din fibră de sticlă și tuburile PVC sunt unite, motoarele sunt montate, comenzile și sistemele de direcție sunt legate, iar sistemele electrice sunt conectate. Fiecare barcă urmează lista de verificare de 100 de puncte, semnată de șeful echipei.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Teste de calitate & Inspecție
      description: Fiecare barcă finalizată trece prin teste obligatorii de retenție a aerului, verificarea dezlipirii cusăturilor și o verificare completă a sistemelor înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct managementului.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
