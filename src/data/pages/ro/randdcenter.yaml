rd_services:
  tagline: Cercetare și Dezvoltare personalizată
  title: Servicii de Cercetare și Dezvoltare pentru Parteneri
  services:
    - title: Dezvoltarea Materialelor Personalizate
      desc: Dezvoltăm formulări de țesături personalizate, straturi laminate și sisteme adezive adaptate mediului dumneavoastră de operare și obiectivelor de performanță.
    - title: OEM / ODM Inginerie de Produs
      desc: De la schițe conceptuale la pachete de inginerie gata pentru producție — echipa noastră poate proiecta, prototipa și valida ambarcațiuni sub brandul dumneavoastră.
    - title: Testare și Certificare de către Terți
      desc: Folosiți facilitățile noastre de testare conforme ISO pentru testarea independentă a materialelor, validarea produselor și sprijin în certificare.
  cta: Discută cerințele tale de Cercetare și Dezvoltare →
  cta_link: /contact
vision:
  tagline: Viziunea Noastră
  title: Modelarea viitorului sporturilor nautice
  body: Aquafarer se străduiește să conducă industria bărcilor gonflabile și SUP prin inovație continuă, calitate neabătută și un angajament ferm față de siguranță și durabilitate — îmbogățind, în cele din urmă, experiențele pasionaților de sporturi acvatice la nivel mondial. Centrul de Cercetare și Dezvoltare Aquafarer este locul unde pasiunea întâlnește inovația, stabilind noi standarde pentru industria sporturilor acvatice.
labs_section:
  tagline: Laboratoare
  title: Laboratoarele noastre
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Laborator de Textile
      description: Cercetare și testare continuă a țesăturilor pentru tuburi PVC și Hypalon pentru rezistența la tracțiune, rezistența la UV, abraziune și flexibilitate la temperaturi scăzute pentru a asigura fiabilitatea pe termen lung în medii marine.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studioul de Inginerie Hull
      description: Proiectarea asistată de CAD și analiza elementelor finite a carenelor din HDPE, aluminiu și fibră de sticlă. Fiecare carenă este simulată digital pentru distribuția stresului și rezistența la impact înainte de construirea primului prototip.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Centrul de Sudură RF
      description: Facilitate dedicată sudurii cu frecvență radio, cu control precis al temperaturii și presiunii, producând cusături etanșe și de înaltă rezistență care respectă standardele industriei maritime pentru ambarcațiuni gonflabile.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Bazin de testare hidrodinamică
      description: Testarea modelelor la scară într-un bazin de teste propriu pentru a optimiza forma carenei, performanța la planare, stabilitatea și eficiența consumului de combustibil în diverse condiții de încărcare și de mare.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Atelier de prototipuri
      description: Facilitate de prototipare și echipare la scară completă, unde sunt construite, echipate și testate pe mare noile modele. Fiecare prototip trece printr-un program de testare în apă de minimum 20 de ore înainte de aprobarea producției.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laborator de Calitate și Inspecție
      description: Laborator de asigurare a calității dedicat, care efectuează teste de tracțiune, cicluri de reținere a aerului, teste de desprindere a cusăturilor și certificarea materialelor pentru a asigura că fiecare barcă care părăsește atelierul respectă specificațiile noastre publicate.
      href: /randdcenter/quality-inspection-lab
