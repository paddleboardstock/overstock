hero:
  tagline: Centrul de Cercetare și Dezvoltare
  title: Centru de Cercetare și Dezvoltare
  subtitle: Concentrat pe Progres
intro:
  - Centrul de Cercetare și Dezvoltare (R&D) al Aquafarer este forța motrice din spatele misiunii noastre de a revoluționa echipamentele pentru sporturi nautice. Oferim pasionaților de sporturi acvatice din întreaga lume produse mai sigure, mai confortabile și mai plăcute prin inovație continuă în stand-up paddle boards gonflabile (SUPs) și bărci. Echipa noastră dedicată de ingineri, designeri și experți pasionați din domeniul sporturilor acvatice modelează viitorul industriei, ridicând constant standardele de calitate, performanță și durabilitate.
  - Facilitatea noastră de R&D reunește oameni de știință materială, arhitecți navali și ingineri de producție sub același acoperiș. De la formularea materialelor și simularea carenelor până la dezvoltarea proceselor de sudură și testele complete pe mare, fiecare etapă a dezvoltării produselor este ghidată de date și validată prin testare.
mission:
  tagline: Misiunea noastră
  title: Inovând viitorul sporturilor acvatice
  pillars:
    - icon: lightning
      title: Progres Tehnologic
      desc: Pionierat în materiale noi, designuri și manufactură pentru performanță superioară și durabilitate a produsului.
    - icon: design
      title: Design Centrat pe Utilizator
      desc: Înțelegerea profundă și depășirea nevoilor utilizatorilor prin design ergonomic și intuitiv al produsului.
    - icon: globe
      title: Practici Durabile
      desc: Minimizarea amprentei noastre de mediu prin utilizarea materialelor și proceselor ecologice.
    - icon: shield
      title: Siguranță Fără Compromis
      desc: Asigurarea celor mai înalte standarde de siguranță prin teste riguroase și certificare.
pillars:
  - title: Progres Tehnologic
    desc: Pionierat în materiale noi, designuri și procese de manufactură pentru a oferi performanță superioară a produsului și durabilitate.
    icon: tech
  - title: Materiale Avansate
    desc: Investigarea PVC, Hypalon, compozitelor și alternativelor durabile de ultimă generație pentru caracteristici îmbunătățite ale produsului.
    icon: materials
  - title: Durabilitate
    desc: 'Angajament Central: Suntem dedicați protejării mediului prin producție durabilă și materiale reciclabile.'
    icon: sustainability
capabilities:
  tagline: Capabilități
  title: Capabilități R&D
  subtitle: Patru discipline de bază care ne oferă control complet asupra dezvoltării produselor — de la cercetarea materialelor brute până la certificarea finală.
  groups:
    - title: Știința Materialelor & Tehnologia Țesăturilor
      items:
        - Analiza și optimizarea formulărilor PVC și Hypalon
        - Dezvoltarea stabilizării UV, a retardării la foc și a aditivilor antimicrobieni
        - Laminarea multi-strat a țesăturilor și ingineria aderenței
        - Testarea accelerată a îmbătrânirii (UV, termică, umiditate, ceață de sare)
    - title: Ingineria Carenei & Hidrodinamica
      items:
        - Design parametric 3D al carenei și optimizare CFD
        - Analiza prin elemente finite pentru sarcini structurale și de impact
        - Testarea și validarea performanțelor în bazine de probă la scară redusă
        - Dezvoltarea de carene personalizate pentru profiluri de misiuni speciale
    - title: Tehnologie de sudare și îmbinare
      items:
        - Dezvoltarea și optimizarea procesului de sudare dielectrică RF
        - Metode de sudare cu aer cald, cu pană fierbinte și cu ultrasunete
        - Calificarea lipirii adezive și a benzii de etanșare
        - Modelarea rezistenței sudurilor și prezicerea duratei de viață
    - title: Testare, Certificare și Conformitate
      items:
        - Managementul calității și testarea conformității CE
        - Sprijin pentru testarea și certificarea independentă de către terți
        - Dezvoltarea protocoalelor de testare personalizate pentru calificarea achizițiilor
        - Analiza defectelor în serviciu și investigarea cauzei rădăcină
