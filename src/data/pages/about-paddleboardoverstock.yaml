hero:
  tagline: About
  title: About {SITE}
  subtitle: A vertically integrated water sports manufacturer — from raw material to finished boat

intro:
  - 'Paddle Board Overstock was founded in 2012 with a single mission: design and manufacture water sports equipment that performs as well on the water as it does in the quality report. What began as a focused SUP board workshop has grown into a 12,000-square-metre integrated manufacturing facility in the Qingdao Economic Development Zone, producing inflatable boats, RIBs, kayaks, SUP boards, safety equipment, and accessories for customers in 50+ countries.'
  - Today, Paddle Board Overstock operates as a factory brand — we design, engineer, prototype, manufacture, and test everything under one roof. This vertical integration gives us direct control over material selection, build quality, and delivery timelines. Every boat is built by our people, on our equipment, to our standards.
  - We serve recreational users, commercial operators, government agencies, and brand partners worldwide. Our OEM and ODM programmes help businesses launch their own product lines without investing in factory infrastructure. Whether you need a single prototype or a full production run, our team guides you from concept to sea-ready delivery.

