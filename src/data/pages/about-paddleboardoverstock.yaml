values:
  - title: Quality First
    desc: Every boat that leaves our factory passes mandatory air-retention, seam peel, and systems testing before shipping.
  - title: Vertical Integration
    desc: We control every stage — from PVC cutting to final assembly — eliminating contractor inefficiencies and ensuring consistent quality.
  - title: Safety as Standard
    desc: CE certification is core to what we build. Our 64 CE-certified models meet EU safety standards for recreational and commercial use.
  - title: Partner-Centric
    desc: We build long-term relationships with OEM, ODM, and private-label partners through transparency, reliability, and shared growth.

services:
  - title: OEM Manufacturing
    desc: We build to your specifications. Share your drawings, and our engineering team handles prototyping, tooling, and production.
  - title: ODM Solutions
    desc: Start from our proven platform designs. Customise size, colour, graphics, and packaging to create your unique product line.
  - title: Private Label
    desc: Your brand name, your logo, your packaging. Products arrive retail-ready with full brand integration.
  - title: Custom Branding
    desc: Deck pad printing, hull graphics, tube decals, and custom labels — consistent brand presence across every surface.

certifications:
  - name: CE Certification
    desc: Our boats and watercraft comply with the EU Recreational Craft Directive (2013/53/EU) and relevant harmonised standards.
    scope: Boats & watercraft
