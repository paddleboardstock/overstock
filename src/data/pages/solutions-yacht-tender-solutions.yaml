content_challenge:
  tagline: The Challenge
  title: 'Yacht Tenders Require<br />Performance & Presentation'
  subtitle: 'A yacht tender is more than a dinghy — it is an extension of the mother vessel and a statement of quality.'
  paragraphs:
    - 'Yacht owners and captains need tenders that perform well, store compactly, and present beautifully. The tender should complement the yacht aesthetics while providing reliable transportation for guests and crew.'
    - '**Storage is critical** — The tender must fit on deck, in a garage, or on davits. Weight matters for launch and recovery systems. Aquafarer RIBs offer excellent power-to-weight ratios with compact storage profiles.'
    - '**Performance expectations are high** — Guests expect a smooth, dry ride when being transferred to shore. Engine options must balance speed, range, and noise levels for a premium experience. For charter operations, the tender runs daily and must withstand frequent use.'
    - '**Appearance matters** — A mismatched or worn tender detracts from the overall yacht presentation. Custom tube colors, upholstery, and branding ensure the tender looks like it belongs.'
content_solution:
  tagline: Our Solution
  title: 'Tender Configurations<br />For Every Yacht Application'
  subtitle: 'Aquafarer RIB tenders can be customized to match your vessel, operation type, and storage requirements — from superyacht builder specs to charter fleet programs.'
  list:
    - 'Custom tube colors to match or complement mother vessel — any RAL color available for Hypalon or PVC tubes'
    - 'Custom upholstery and stitching — premium marine-grade vinyl with color matching and logo embroidery'
    - 'Console or tiller steering — choose based on usage pattern and operator preference'
    - 'Fiberglass deep-V hull for smooth, dry ride in varying sea conditions'
    - 'Compact storage — deflates or nests for deck garage, locker, or davit storage'
    - 'Hypalon tubes for UV resistance and long-term appearance preservation'
    - 'Lifting points and tow rings standard on all models'
    - 'Optional bow cover, full cover, and protective chafe guards'
    - 'Engine range: 15 HP to 60 HP — outboard or tiller configurations'
    - 'OEM/private labeling available for yacht builders and marine dealers'
content_segments:
  tagline: Customer Profiles
  title: 'Yacht Tender Solutions<br />By Customer Type'
  subtitle: 'Different yacht industry segments have unique requirements. Aquafarer configures tenders to match each application.'
  items:
    - title: Superyacht Builders
      subtitle: OEM tender integration — custom dimensions, colors, and materials
      description: 'Yacht builders face a recurring challenge: every new vessel has unique dimensional constraints, weight limits, and aesthetic expectations. The tender must integrate perfectly with the mother vessel davit system, fit within precise garage dimensions, and match the design language of a multi-million-euro yacht. Any mismatch — wrong tube color, incorrect lifting point placement, incompatible weight — delays delivery and reflects poorly on the builder. Aquafarer works directly with builder procurement and design teams to deliver tenders with custom RAL tube colors, matching upholstery, branded console panels, and full OEM documentation packages.'
      features:
        - 'Custom dimensional specifications matching garage and davit constraints'
        - 'Any RAL tube color and matching upholstery — design approval samples provided'
        - 'OEM branding on console, tube, and seat backs'
        - 'Lifting point and davit fit validation for each model'
        - 'Hull weight optimized for specified launch and recovery systems'
        - 'Bulk delivery scheduling aligned with production timelines'
    - title: Yacht Management Companies
      subtitle: Fleet-standardized tenders — global support, minimal downtime
      description: 'Management companies oversee multiple yachts operating across the Mediterranean, Caribbean, South Pacific, and beyond. Their core need is reliability — a broken tender in a remote port means crew overtime, guest complaints, and expensive last-minute replacements. Standardized fleet specifications reduce crew training time across vessels and simplify spare parts management. Aquafarer offers multi-vessel fleet pricing, consistent specifications across orders, and global spares support for management companies with vessels in multiple regions.'
      features:
        - 'Standardized specifications across entire managed fleet'
        - 'Interchangeable spare parts across all fleet tenders'
        - 'Fleet pricing and volume discounts for multi-unit orders'
        - 'Global spare parts availability — quick ship to any port'
        - 'Consistent service and maintenance documentation for crew'
        - 'Multi-unit delivery coordination to different vessel locations'
    - title: Yacht Charter Operators
      subtitle: High-frequency daily operations — durability without compromising appearance
      description: 'Charter tenders face the most punishing operational schedule in the yacht industry: daily guest transfers, shore trips, water sports support, and port tendering — often 200+ operations per charter season. The tender must look pristine for every guest handover while withstanding continuous boarding, saltwater exposure, and engine hours. Appearance degradation is a direct business concern — a worn tender affects guest reviews and charter rates. Aquafarer configures charter tenders with upgraded upholstery, heavy-duty Hypalon tubes, and reinforced handling areas for long-term durability that maintains presentation quality.'
      features:
        - 'Heavy-duty Hypalon tubes — 5-8 year lifespan in daily charter service'
        - 'Reinforced boarding steps and handling grab lines for frequent use'
        - 'Premium stain-resistant vinyl upholstery — easy cleaning between charters'
        - 'Easy-clean non-slip deck surfaces'
        - 'Reliable outboard packages with easy service access for tight turnaround'
        - 'Cosmetic-grade materials that maintain appearance across charter seasons'
    - title: Yacht Dealers & Brokers
      subtitle: Reliable tender supply for vessel completion and resale value
      description: 'Dealers and brokers need a stable supply of quality tenders that complement the vessels they sell — matching brand positioning and enhancing the buyer experience. An inconsistent tender or supply delay can delay a yacht handover or diminish a listing presentation. Dealers require consistent quality across batches, reliable lead times, and competitive pricing to maintain margins. Aquafarer offers dealer inventory programs with seasonal delivery scheduling, co-branding options for showroom display, and priority allocation during peak season.'
      features:
        - 'Inventory stocking programs with available-on-demand models'
        - 'Seasonal delivery scheduling aligned with handover calendar'
        - 'Dealer co-branding on console and tubes for showroom display'
        - 'Consistent quality and specification across all batch orders'
        - 'Competitive dealer pricing with volume-based tier'
