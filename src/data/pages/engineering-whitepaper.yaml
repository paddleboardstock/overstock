section_faq:
  title: Technical FAQ
  questions:
    - q: How does drop-stitch compare to traditional hard-shell construction?
      a: Modern drop-stitch cores at 20 PSI achieve 85–90% of the rigidity of comparable EPS foam/fiberglass hard shells, while being fully deflatable for transport. The trade-off is slightly higher weight and lower ultimate stiffness — but for most recreational and commercial applications, the difference is negligible.
    - q: What thread density is considered premium quality?
      a: Premium drop-stitch fabrics use 2 threads per square inch (approximately 3,100 threads per m²) woven from 1,680 DTEX polyester yarn. Entry-level fabrics use 1 thread per sq in with 1,100 DTEX yarn.
    - q: Can Hypalon be welded like PVC?
      a: No. Hypalon/CSM cannot be RF welded. It must be assembled using hand-applied contact cement, which makes production more labor-intensive and seams dependent on operator skill. PVC can be RF welded or hot-air welded for consistent, automated seam quality.
    - q: What is the maximum safe pressure for inflatable boats?
      a: Standard inflatable boat tubes operate at 8–12 PSI. Drop-stitch floors operate at 12–20 PSI. High-pressure drop-stitch cores (SUPs) can operate at 20–25 PSI. Each product includes pressure relief valves calibrated to prevent over-inflation.
    - q: How long does it take to manufacture a custom inflatable boat?
      a: Standard OEM production runs 30–45 days from order confirmation to FOB Qingdao. Custom mold development adds 15–20 days for prototype production and testing.

