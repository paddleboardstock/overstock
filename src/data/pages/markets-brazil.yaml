overview_section:
  tagline: Market Overview
  title: The Brazilian SUP Market
  paragraphs:
    - Brazil is one of the most natural stand-up paddle markets on Earth. Beach culture is national culture — from the Stand Up Paddle scene on Rio's lagoons and the surf-and-flat-water mix of Florianópolis to the warm, calm waters of the Northeast in Ceará, Pernambuco, and Bahia. Paddle schools, lagoon rentals, and downwind and SUP surf communities all draw from a huge, sports-mad population.
    - Brazilian buyers are typically owner-operated businesses — lagoon-side rental stands, beach schools, surf shops adding SUP lines, and growing domestic e-commerce sellers. They order in small batches (5–20 boards), and they care about durability for daily use and price competitiveness in a market with meaningful import costs.
  customer_types:
    - title: Lagoon & Beach Schools
      description: Schools and rental operators on Rio's lagoons and the Northeast's calm-water beaches serving lessons and hourly rentals.
    - title: Surf Shops
      description: Established surf retailers adding flat-water and touring SUP for the local paddling community.
    - title: Online Sellers
      description: Domestic e-commerce sellers importing SUP stock to serve Brazil's enormous internal market.
shipping_section:
  title: Ship to Brazil
  paragraphs:
    - Orders ship from Weihai, China. Express air freight carries samples and 1–3 board orders into Brazil's major airports; consolidated sea freight serves 5–20 board wholesale orders through ports like Santos and other coastal gateways. Transit estimates for your destination are included in your quote.
    - We provide the commercial invoice and packing list required for clearance, with correct HS codes and declared values. Import duties and taxes are payable by the importer under Brazilian rules.
  customs_note: Brazil's import taxes on sporting goods are significant and vary by product classification. Confirm the current duty, VAT, and any state-level charges with your customs broker (despachante) before ordering — we provide complete documentation but do not bundle import taxes into freight quotes.
faq_section:
  title: Brazil FAQ
  items:
    - q: Can quotes and support be handled in Portuguese?
      a: Yes — we work with Portuguese-speaking buyers. Ask in your inquiry and we will handle your quote and order in Portuguese.
    - q: Are Brazil's import taxes included in your prices?
      a: No. Import duties, VAT, and state-level taxes are the importer's responsibility under Brazilian rules. We quote board pricing and freight clearly and separately, and provide the paperwork your despachante needs.
    - q: What does a first order for a Brazilian beach school look like?
      a: "Typically 5–15 boards: durable all-around models for lessons and hourly rental, plus a couple of premium editions for retail display. Mixed models in one shipment, priced by total quantity."
    - q: Do you ship sea freight to Brazil?
      a: Yes — consolidated sea freight serves Brazilian ports for 5–20 board wholesale orders, quoted per destination. Express air is available for samples and urgent small orders.
