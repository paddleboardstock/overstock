overview_section:
  tagline: Market Overview
  title: The Middle East SUP Market
  paragraphs:
    - The Middle East has built some of the world's most impressive waterfronts — Dubai's beach clubs, Abu Dhabi's mangrove tours, the Red Sea projects transforming Saudi Arabia's west coast, and the established resort scenes of Egypt's Sinai and Hurghada. Across them, stand-up paddle has become a signature activity: accessible, photogenic, and suited to calm, warm water almost all year.
    - The buyers here are professional and quality-conscious. Hotel beach clubs refresh fleets regularly, watersports operators need boards that look premium in photos, and the region's retailers serve both expat paddlers and a fast-growing local community. They order in small, deliberate batches and expect exact documentation and on-time delivery.
  customer_types:
    - title: Hotel Beach Clubs & Resorts
      description: Gulf hotel operators running guest SUP programs, ordering small mixed fleets with premium art editions for the waterfront look.
    - title: Watersports Operators
      description: Mangrove and lagoon tour operators, dive centers, and beach rental stands along Gulf and Red Sea coasts.
    - title: Retailers
      description: Shops and online sellers serving expat and local paddling communities in the UAE, Saudi Arabia, Qatar, and Kuwait.
shipping_section:
  title: Ship to the Middle East
  paragraphs:
    - Orders ship from Weihai, China. Express air freight moves samples and 1–3 board orders fast into the region's major hubs; consolidated sea freight serves 5–20 board wholesale orders through Gulf and Red Sea ports. Transit estimates for your destination are included in every quote.
    - We provide the commercial invoice and packing list clearance requires, with consistent declared values and correct HS codes — the paperwork discipline Gulf customs processes expect.
  customs_note: Import procedures in the region are generally efficient but document-sensitive. Confirm current duty and tax treatment for sports equipment in your emirate or country with your clearing agent; we supply all standard documentation promptly.
faq_section:
  title: Middle East FAQ
  items:
    - q: Which Middle East destinations do you ship to?
      a: The UAE, Saudi Arabia, Qatar, Kuwait, Bahrain, Oman, Egypt, and beyond — see our dedicated UAE guide for the Gulf's largest retail market. Confirm your destination in your quote request.
    - q: Do the boards handle the region's summer heat?
      a: "The boards tolerate the heat well with basic care: store them deflated and shaded through peak summer, avoid leaving boards inflated on hot surfaces, and rinse after use in sea water. These are the same guidelines we give rental fleets in 50+ countries."
    - q: Can we order premium art editions for a hotel waterfront?
      a: Yes — art editions like Leviathan Wake, Medusa Glow, and Ocean Voyager are popular with hotel beach clubs precisely because they photograph beautifully. Mix them with all-around guest boards in one order.
    - q: Is documentation available for Gulf customs?
      a: Yes. Every order ships with a commercial invoice and packing list with correct HS codes and declared values, and we respond quickly when brokers request extra documentation.
