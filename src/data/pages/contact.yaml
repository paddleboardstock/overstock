hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Send us a message
  subtitle: For order questions, sizing advice or product support, drop us a line. We reply within one business day.
  email_to: info@paddleboardoverstock.com
  submit_button: Send Inquiry → Get a Quote
  success_message: Thanks! Your message has landed in our inbox. We will reply within one business day.
  error_message: Something went wrong sending your message. Please try again or email us directly.
  default_country_code: "+1"
  captcha:
    label: "Anti-spam: please solve the following"
  fields:
    - name: firstName
      label: First Name
      row: 1
    - name: lastName
      label: Last Name
      row: 1
    - name: companyName
      label: Company Name
      row: 2
    - name: address
      label: Address
      row: 3
    - name: zip
      label: Zip / Postal Code
      row: 4
    - name: country
      label: Country
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Estimated Order Volume
      row: 6
      type: select
      options:
        - value: ""
          label: How many boards are you shopping for?...
        - value: one
          label: Just one board
        - value: 2-4
          label: 2–4 boards
        - value: 5-plus
          label: 5+ boards (family, club, or rental)
    - name: customization
      label: What can we help with?
      row: 7
      type: select
      options:
        - value: ""
          label: Select a topic...
        - value: none
          label: General product question
        - value: sizing
          label: Help choosing the right board
        - value: order
          label: Order, payment or shipping
        - value: warranty
          label: Warranty or repair support
    - name: productInterest
      label: Product Categories of Interest
      row: 8
      type: select
      options:
        - value: ""
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: packages
          label: Complete SUP packages
        - value: accessory
          label: Accessories (pumps, oars, bags)
    - name: subject
      label: Subject
      row: 9
    - name: message
      label: Message
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Other ways to reach us
  columns: 3
  items:
    - title: Order help
      description: Product questions, sizing advice, and order support.
      icon: tabler:shopping-bag
    - title: Technical support
      description: Warranty, repairs, spare parts and operating questions.
      icon: tabler:tool
    - title: Press & partnerships
      description: Media kits, sponsorship and industry collaboration.
      icon: tabler:news
    - title: Phone
      description: +1 279 732 3333 (US HQ) · +86 13305324192 (factory)
      icon: tabler:headset
    - title: Email
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Global HQ & Billing
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Our Location
  subtitle: Visit our Weihai manufacturing hub
  address: Weihai, Shandong, China
  zoom: 15
