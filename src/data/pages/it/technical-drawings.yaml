hero:
  tagline: Disegni Tecnici e CAD
  title: RIB e gommoni<br />Disegni tecnici e download CAD
  subtitle: 'Disegni GA a livello di pianificazione, fogli dimensionali e layout di coperta per la valutazione e le specifiche del progetto. Accedi ai disegni tecnici al livello giusto: dai PDF pubblici ai file STEP a livello di progetto.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Disegni tecnici delle barche RIB e download CAD
direct_answer: Paddle Board Overstock fornisce disegni tecnici a livello di approvvigionamento per imbarcazioni RIB e moto d'acqua gonfiabili, inclusi PDF di disposizioni generali (GA), fogli dimensionali e disegni di layout del ponte. Formati più dettagliati (DXF/DWG, STEP/IGES) sono disponibili previa richiesta qualificata o domanda di progetto.
