content_tiers:
  tagline: Scarica Livelli
  title: Quattro livelli di accesso<br />— Il dettaglio giusto per il palco giusto
  subtitle: Forniamo disegni a livello di approvvigionamento, non file a livello di produzione. Ogni livello corrisponde a una fase diversa del progetto.
  items:
    - title: 'Livello 1: PDF pubblico'
      description: Disposizione generale (GA), disegno quotato a 4 viste e layout della coperta in formato PDF. Disponibile per il download gratuito. Sufficiente per la pianificazione del progetto, l'assegnazione dello spazio e la revisione preliminare delle specifiche.
      icon: tabler:file-type-pdf
    - title: 'Livello 2: forma leggera DXF/DWG'
      description: File CAD 2D (DXF o DWG) per l'integrazione del layout a livello di pianificazione. Richiede un breve modulo di qualificazione (ragione sociale, tipologia progetto, destinazione d'uso). Nessun dato strutturale o di produzione incluso.
      icon: tabler:file-code
    - title: 'Livello 3: applicazione del progetto STEP/IGES'
      description: File di modelli 3D (STEP o IGES) per l'integrazione di sistemi, la progettazione di allestimenti o il coordinamento dell'architettura navale. Richiede l'applicazione del progetto con ambito, sequenza temporale e intenzione di acquisto. Soggetto ad approvazione.
      icon: tabler:cube
    - title: 'Livello 4: ingegneria NDA'
      description: Disegni strutturali dello scafo, programmi di laminazione, espansioni di taglio dei tubi e dati dello stampo. Disponibile solo sotto NDA con ordini confermati. Si tratta di file a livello di produzione, non destinati alla distribuzione pubblica.
      icon: tabler:lock
content_included:
  tagline: Cosa è incluso
  title: Contenuto del disegno<br />Per modello
  subtitle: Ogni modello dispone di un pacchetto di disegni standard che copre le informazioni di pianificazione essenziali per acquirenti B2B e ingegneri di progetto.
  items:
    - title: Disposizione Generale (GA)
      description: Profilo laterale, vista dall'alto e sezione trasversale che mostra la forma dello scafo, la posizione dei tubi, la posizione della console, i sedili, l'impianto di alimentazione e le dimensioni chiave (LOA, trave, diametro dei tubi, angolo di deadrise). Stato di revisione e copyright annotati sul cartiglio.
      icon: tabler:layout
    - title: Disegno quotato a 4 viste
      description: Viste laterali, anteriori, posteriori e dall'alto con dimensioni complessive per la pianificazione del trasporto (altezza sul rimorchio, trave per container, peso per il sollevamento). Include configurazioni operative e di trasporto.
      icon: tabler:ruler-2
    - title: Layout del ponte e piano delle attrezzature
      description: Vista dall'alto del ponte che mostra la base della console, le posizioni dei sedili, le posizioni degli anelli a D, le posizioni delle luci di navigazione, l'accesso alla pompa di sentina, il vano batteria/carburante e i punti di montaggio delle attrezzature. Precisione limitata sulle interfacce proprietarie.
      icon: tabler:map
    - title: Disegno di trasporto e imballaggio
      description: Piano di carico del container, dimensioni della culla, distribuzione del peso e posizioni dei punti di sollevamento per la pianificazione logistica. Include opzioni di imballaggio standard e personalizzate.
      icon: tabler:truck
content_protection:
  tagline: Protezione IP
  title: Cosa non condividiamo<br />e perché
  subtitle: La protezione della nostra proprietà intellettuale ci permette di continuare a investire in ricerca e sviluppo fornendo allo stesso tempo tutto ciò di cui gli acquirenti hanno bisogno per la pianificazione del progetto.
  items:
    - title: Dati fondamentali sullo stampo dello scafo
      description: La geometria del tassello e dello stampo, i percorsi utensile CNC e i modelli di laminazione sono risorse di produzione proprietarie. Non sono condivisi a nessun livello di accesso al di fuori dei contratti NDA confermati.
      icon: tabler:ban
    - title: Espansioni taglio tubi
      description: I file di taglio del modello piatto per il tessuto tubolare sono dati a livello di produzione. Disponibile solo sotto NDA con ordini di produzione confermati e condivisi solo con la parte contraente.
      icon: tabler:ban
    - title: Calcoli strutturali
      description: Analisi dettagliate delle sollecitazioni, risultati FEA e programmi laminati sono documenti sensibili alla conformità condivisi solo con organismi notificati e clienti vincolati alla NDA durante il processo di valutazione della conformità.
      icon: tabler:ban
    - title: Selezione della concorrenza
      description: Ci riserviamo il diritto di rifiutare le richieste di accesso CAD che sembrano provenire da concorrenti, studenti senza contesto di progetto o soggetti senza legittimi intenti di approvvigionamento.
      icon: tabler:shield
