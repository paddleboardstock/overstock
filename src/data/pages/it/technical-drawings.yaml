content_version_control:
  tagline: Gestione delle versioni
  title: Gestione delle versioni<br />dei disegni
  subtitle: Ogni disegno segue un sistema di revisione controllato. Verificate sempre di disporre della revisione corrente prima di utilizzare i disegni per la pianificazione del progetto.
  items:
    - title: Tracciamento delle revisioni
      description: Ogni disegno riporta un codice di revisione (Rev-A, Rev-B, Rev-C), la data di emissione, la data dell'ultima verifica, il modello o la configurazione applicabili, le unità, la dimensione del file e il formato. Solo la revisione "corrente" è disponibile per il download.
      icon: tabler:git-branch
    - title: Avviso sullo stato dei disegni
      description: Tutti i disegni pubblici sono contrassegnati da "Solo layout preliminare — non utilizzare per costruzione, certificazione o produzione. Dimensioni subordinate alla specifica finale e alla conferma d'ordine." Questo protegge entrambe le parti da un uso improprio.
      icon: tabler:alert-circle
    - title: Notifiche di aggiornamento
      description: Quando cambia la specifica di un modello, la revisione del disegno viene aggiornata e le versioni precedenti sono contrassegnate come "sostituite". Gli utenti registrati che hanno scaricato pacchetti DXF/DWG ricevono via e-mail avviso degli aggiornamenti significativi.
      icon: tabler:bell

faq:
  title: 'Disegni tecnici: domande frequenti'
  questions:
    - q: I PDF GA sono davvero scaricabili gratuitamente?
      a: SÌ. I PDF delle disposizioni generali per i nostri modelli principali sono disponibili gratuitamente. Contengono informazioni a livello di pianificazione sufficienti per la valutazione del progetto, l'allocazione dello spazio e la revisione preliminare delle specifiche.
    - q: Come posso accedere ai file DXF/DWG?
      a: Completa il breve modulo di qualifica nella pagina di download con il nome della tua azienda, il tipo di progetto e l'uso previsto. Le richieste approvate ricevono un collegamento per il download via e-mail entro 1 giorno lavorativo.
    - q: Posso ottenere modelli 3D STEP/IGES?
      a: I file del modello 3D STEP o IGES sono disponibili tramite il nostro processo di richiesta del progetto. Fornisci l'ambito del progetto, i requisiti di integrazione, la tempistica e l'intento di acquisto. Soggetto ad approvazione, in genere entro 3-5 giorni lavorativi.
    - q: Perché limiti l'accesso ai file con dettagli più elevati?
      a: La geometria dello scafo, i dati dello stampo e i calcoli strutturali rappresentano anni di investimenti in ricerca e sviluppo e costituiscono la proprietà intellettuale di produzione fondamentale. Forniamo tutto il necessario per la pianificazione degli approvvigionamenti e l'integrazione dei progetti, tutelando al contempo la nostra capacità di continuare a investire nello sviluppo di nuovi prodotti.
    - q: I disegni includono dettagli di produzione?
      a: No. I disegni pubblici e in formato leggero contengono informazioni a livello di approvvigionamento per la pianificazione e le specifiche. I dettagli a livello di produzione (programmi di laminazione, percorsi utensile, espansioni di taglio) sono condivisi solo tramite NDA con ordini confermati.
    - q: Sono disponibili disegni per configurazioni RIB personalizzate o semi-personalizzate?
      a: I disegni di progetto personalizzati vengono preparati come parte del processo di sviluppo OEM/ODM. Se stai valutando un progetto RIB personalizzato, contattaci con le tue esigenze e forniremo disegni GA specifici del progetto come parte della proposta.
