hero:
  tagline: Presenza Globale
  title: 'Al Servizio di 50+ Paesi<br />in Ogni Continente'
  subtitle: "Dagli operatori europei di pattugliamento costiero ai distributori australiani di sport acquatici, fino ai team di soccorso del Medio Oriente — le imbarcazioni Aquafarer navigano nelle acque di tutto il mondo."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Produzione e distribuzione marina globale Aquafarer
stats:
  title: Portata Globale
  stats:
    - title: Paesi
      amount: '50+'
    - title: Mercati di Esportazione
      amount: Europa, Americhe, Asia, Medio Oriente, Oceania
    - title: Produzione
      amount: Qingdao, Cina
    - title: Magazzino USA
      amount: Montclair, CA
features3_markets:
  tagline: Mercati Chiave
  title: 'Competenza Regionale<br />per Requisiti Locali'
  subtitle: "Sappiamo che mercati diversi hanno requisiti normativi, preferenze e casi d'uso differenti."
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa e Regno Unito
      description: "Prodotti certificati CE conformi alle norme EN ISO 6185. Forte domanda di RIB, gommoni e tavole SUP nei mercati dell'UE. I distributori britannici apprezzano i nostri tempi di consegna rapidi."
      icon: tabler:map-pin
    - title: Nord America
      description: "Produzione approvata dalla Guardia Costiera USA. Magazzino USA a Montclair, CA per consegne rapide sulla costa occidentale. Domanda crescente di barche da pesca, imbarcazioni di soccorso e SUP ricreativi."
      icon: tabler:map-pin
    - title: Australia e Oceania
      description: "Forte mercato per RIB e tender gonfiabili. I distributori australiani apprezzano le nostre barche in Hypalon per la resistenza ai raggi UV sotto il sole intenso. Spedizione rapida dal nostro stabilimento in Asia."
      icon: tabler:map-pin
    - title: Medio Oriente
      description: "Domanda crescente di imbarcazioni di pattuglia e soccorso. I nostri RIB con scafo in alluminio sono popolari tra guardie costiere e operatori di sicurezza. Configurazioni personalizzate per ambienti ad alta temperatura."
      icon: tabler:map-pin
features3_distribution:
  tagline: Rete di Distribuzione
  title: 'Collaborazione con Distributori<br />in Tutto il Mondo'
  subtitle: "Lavoriamo con distributori affermati di attrezzature marine, marchi OEM e agenzie di approvvigionamento governative."
  isBeforeContent: false
  columns: 3
  items:
    - title: Collaborazioni OEM/ODM
      description: "Produzione a marchio privato per marchi globali di sport acquatici. Ci occupiamo di tutto, dalla progettazione alla produzione fino alla spedizione diretta."
      icon: tabler:building
    - title: Rete di Distributori
      description: "Distributori autorizzati in oltre 20 paesi detengono stock e offrono supporto locale. Benvenute le richieste di nuovi distributori."
      icon: tabler:users
    - title: Governo e Istituzioni
      description: "Fornitura diretta a guardie costiere, organizzazioni di ricerca e soccorso e programmi di approvvigionamento militare. Conformità ai requisiti di acquisto istituzionali."
      icon: tabler:building-community
steps2_logistics:
  title: 'Logistica e Supporto Globali'
  subtitle: "Dalla fabbrica alla destinazione — gestiamo l'intera catena di fornitura."
  items:
    - title: Opzioni di Spedizione
      description: "Trasporto marittimo (FOB Qingdao), trasporto aereo per ordini urgenti e corriere espresso per campioni e ricambi."
      icon: tabler:truck-delivery
    - title: Magazzino USA
      description: "Stock a Montclair, CA per consegne rapide in tutto il Nord America. Costa occidentale: 2-3 giorni, Centro: 3-4 giorni, Costa orientale: 4-5 giorni."
      icon: tabler:building-warehouse
    - title: Ricambi
      description: "Ricambi originali Aquafarer e materiali di consumo in stock tutto l'anno. I componenti comuni vengono spediti entro 24 ore."
      icon: tabler:package
    - title: Supporto Tecnico
      description: "Linea diretta con il nostro team di ingegneria per domande tecniche, consulenza sulle riparazioni e supporto al refit. Supportiamo barche costruite 20 anni fa."
      icon: tabler:headset
cta:
  title: 'Vuoi diventare un distributore?'
  subtitle: "Stiamo espandendo attivamente la nostra rete di distribuzione. Contatta il nostro team export per discutere le opportunità di partnership."
  actions:
    - variant: primary
      text: Richiesta di partnership
      href: /contact
    - text: Vedi la nostra gamma di prodotti
      href: /products
