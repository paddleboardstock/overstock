label: Garanzia
headline: Paddle Board Overstock Garanzia limitata del produttore
subtitle: Paddle Board Overstock Sostiene la qualità di ogni SUP tavola gonfiabile che produciamo. Questa Garanzia Limitata stabilisce i termini e la copertura per la tua Paddle Board Overstock tavola.
seo:
  headline: Paddle Board Overstock SUP Garanzia — Garanzia Limitata di 2 Anni | Paddle Board Overstock
  description: Paddle Board Overstock offre una garanzia limitata di 2 anni che copre drop-stitch giunzioni, costruzione delle rotaie, valvole di gonfiaggio e accessori inclusi su ogni SUP tavola. Termini e condizioni completi.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Questa Garanzia Limitata si applica alle Paddle Board Overstock SUP nuove tavole gonfiabili di marca acquistate direttamente dal Paddle Board Overstock negozio online. La data di validità è la data verificabile dell'acquisto originale.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Copertura e durata della garanzia</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anni</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Struttura del nucleo e del mazzo</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anni</h3>
          <p class="text-sm text-gray-600 mt-1">Costruzione di rotaie e giunture</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anni</h3>
          <p class="text-sm text-gray-600 mt-1">Funzionalità della valvola di gonfiaggio</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 anni</h3>
          <p class="text-sm text-gray-600 mt-1">Accessori inclusi (pompa, pagaia, guinzaglio, pinna)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Anno*</h3>
          <p class="text-sm text-gray-600 mt-1">Uso commerciale, a noleggio o per flotte — tutti i componenti</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*L'uso commerciale, a noleggio o in flotta riduce la garanzia a 1 anno. L'uso in corsa o in competizione annulla completamente la garanzia.</p>
    </div>

    <h2>Cosa è coperto</h2>
    <h3>Drop-Stitch Struttura del Core e del Mazzo (2 Anni)</h3>
    <p>Il drop-stitch nucleo interno e la struttura esterna della scheda sono garantiti contro difetti di fabbricazione che compromettono la capacità della scheda di mantenere il gonfiaggio e la rigidità operative.</p>

    <h3>Costruzione di ferrovie e giunture (2 anni)</h3>
    <p>Le giunture e le bande a triplo strato, se unite durante la produzione, sono garantite contro difetti di fabbricazione che causano notevoli perdite d'aria attraverso la giunzione. L'ispezione periodica e il mantenimento delle pressioni di gonfiaggio appropriate sono condizioni di copertura.</p>

    <h3>Funzionalità della valvola di gonfiaggio (2 anni)</h3>
    <p>Le valvole di soffiaggio dell'aria originariamente Paddle Board Overstock installate da sono garantite contro difetti di fabbricazione nei materiali o nella lavorazione che impediscono alla valvola di trattenere l'aria come progettato.</p>

    <h3>Accessori inclusi (2 anni)</h3>
    <p>La pompa, la palette regolabile, il guinzaglio, la pinna rimovibile e gli altri componenti inclusi nel pacchetto della tavola sono garantiti contro difetti di materiale e lavorazione.</p>

    <h2>Cosa non è coperto</h2>
    <ul>
      <li>Difetti estetici tra cui scolorimento, macchie, sbiadimento, gesso o qualsiasi alterazione dell'aspetto</li>
      <li>Forature, tagli, strappi, strappi o altri danni fisici</li>
      <li>Screpolamento, crepe, abrasione, graffiamento o deterioramento dovuto all'attrito o al contatto</li>
      <li>Degrado dovuto UV all'esposizione alla luce, agli agenti atmosferici o alle condizioni atmosferiche</li>
      <li>Danni dovuti al contatto con solventi, acidi, alcali o sostanze chimiche</li>
      <li>Danni causati da negligenza, uso improprio, abuso, incidente o normale usura</li>
      <li>Danni causati da urto, stress, supporto improprio o trasporto</li>
      <li>Danni causati da gonfiaggio/sgonfiaggio improprio o uso di dispositivi di gonfiaggio non approvati</li>
      <li>Attrezzature, componenti o sistemi di terzi (coperti dai rispettivi produttori)</li>
    </ul>

    <h2>Obbligo e Rimedi del Produttore</h2>
    <p>L'unico ed esclusivo obbligo di Paddle Board Overstock è la riparazione o sostituzione, a scelta di Paddle Board Overstock, di qualsiasi componente ritenuto difettoso nei materiali o nella lavorazione e coperto da questa garanzia. Le riparazioni o sostituzioni sono effettuate da Paddle Board Overstock o dalla sua struttura di servizio designata. I componenti riparati o sostituiti sono garantiti solo per la parte residua del periodo di garanzia originale.</p>

    <h2>Condizioni della Garanzia</h2>
    <ul>
      <li><strong>Manutenzione:</strong>Il prodotto deve essere mantenuto in conformità alle linee guida pubblicate da Paddle Board Overstock, inclusa l'ispezione periodica e la manutenzione delle pressioni di gonfiaggio appropriate.</li>
      <li><strong>Cooperazione:</strong>L'acquirente deve collaborare pienamente e tempestivamente con Paddle Board Overstock in tutte le questioni riguardanti le richieste di garanzia.</li>
      <li><strong>Acquirente Originale:</strong>Questa garanzia è estesa esclusivamente all'acquirente finale originale e non è trasferibile.</li>
    </ul>

    <h2>Uso Commerciale</h2>
    <p>Se il prodotto viene utilizzato per scopi commerciali, noleggio o flotte, il periodo di garanzia per tutti i componenti è ridotto a un (1) anno dalla data di acquisto originale. L'uso in gare, competizioni di velocità o di resistenza annulla immediatamente e irrevocabilmente l'intera garanzia.</p>

    <h2>Come Presentare una Richiesta di Garanzia</h2>
    <p>Contattare Paddle Board Overstock con prova di acquisto e una descrizione dettagliata del problema. Paddle Board Overstock esaminerà la richiesta e fornirà istruzioni per l'ispezione e il servizio.</p>
    <p>Per richieste di servizio in garanzia, contattateci tramite la nostra<a href="/contact" class="text-sky-600 underline">pagina di contatto</a>indicando il numero d'ordine e i dettagli del prodotto.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Questa dichiarazione di garanzia è un riepilogo della completa Garanzia Limitata del Produttore Paddle Board Overstock. Il documento legale completo di garanzia regola tutti i termini e le condizioni della garanzia. Le specifiche sono soggette a modifiche senza preavviso. Paddle Board Overstock è un marchio di fabbrica del Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
