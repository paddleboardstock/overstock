content_benefits:
  tagline: Vantaggi della partnership
  title: Perchè i Distributori<br />Scegliere Paddle Board Overstock
  subtitle: Una partnership pensata per i distributori marini che necessitano di fornitura affidabile, margini competitivi e supporto professionale.
  items:
    - title: Tutela del territorio
      description: Diritti territoriali esclusivi o semiesclusivi per distributori qualificati. Mappatura del mercato e gestione dei conflitti di canale per proteggere il tuo investimento nella costruzione del marchio Paddle Board Overstock nella tua regione.
      icon: tabler:map-pin
    - title: Prezzi all'ingrosso competitivi
      description: Prezzi scaglionati in base agli impegni di volume annuali. Struttura dei prezzi a protezione del margine con garanzie anticipate sui prezzi e ripartizione trasparente dei costi (base FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Kit di supporto al marketing
      description: Fotografie professionali di prodotti, schede tecniche, modelli di documentazione di conformità, contenuti per social media e materiali di marketing in co-branding. Aggiornato ogni anno con il lancio di nuovi prodotti.
      icon: tabler:photo
    - title: Formazione Tecnica
      description: Formazione sui prodotti per il team di vendita (virtuale o in loco), formazione sulla manutenzione e riparazione per i tecnici dell'assistenza, domande frequenti rivolte ai clienti e guide per la risoluzione dei problemi.
      icon: tabler:school
    - title: Pezzi di ricambio e post-vendita
      description: Fornitura ricambi dedicata con spedizione prioritaria. Sezioni di tubi di ricambio, valvole, alette e kit di riparazione disponibili per una rapida evasione degli ordini. Supporto per l'elaborazione delle richieste di garanzia.
      icon: tabler:tool
    - title: Documentazione di conformità
      description: 'Pacchetto completo di documentazione di conformità per il tuo mercato: dichiarazione CE, dati sulla targa del costruttore, manuali del proprietario e supporto per la registrazione normativa. Elimina il carico di conformità.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Cosa Cerchiamo
  title: Distributore<br />Requisiti
  subtitle: Cerchiamo partner che possano rappresentare e supportare professionalmente i prodotti Paddle Board Overstock nel loro territorio.
  items:
    - title: Conoscenza del territorio e del mercato
      description: Presenza consolidata nel mercato della nautica, degli sport acquatici o delle attività ricreative all'aperto. Comprensione delle normative locali, delle preferenze dei consumatori e dei canali di distribuzione per i prodotti delle imbarcazioni.
      icon: tabler:target
    - title: Esperienza nel settore
      description: Minimo 2 anni di esperienza nella distribuzione di attrezzature marine, outdoor o sportive. Comprovata esperienza con marchi internazionali e operazioni di vendita all'ingrosso B2B.
      icon: tabler:briefcase
    - title: Showroom o magazzino
      description: Struttura fisica per l'esposizione dei prodotti, lo stoccaggio dell'inventario e il servizio clienti. Possibilità di mantenere unità demo e inventario di pezzi di ricambio per il tuo territorio.
      icon: tabler:building-store
    - title: Impegno verso gli standard del marchio
      description: Disponibilità a mantenere gli standard di presentazione del marchio Paddle Board Overstock, fornire assistenza ai clienti secondo i nostri protocolli di servizio e partecipare ad aggiornamenti annuali di formazione sui prodotti.
      icon: tabler:star
content_process:
  tagline: Processo di candidatura
  title: Rivenditore in 4 fasi<br />Processo di richiesta
  subtitle: 'Dalla richiesta iniziale alla prima spedizione: un processo di onboarding semplice.'
  steps:
    - number: '01'
      title: Richiesta iniziale e qualificazione
      description: Invia la tua richiesta di distributore con i dettagli dell'azienda, il territorio di interesse, le linee di prodotti attuali e le stime del volume annuale. Esaminiamo entro 5 giorni lavorativi.
      timeline: 5 giorni
    - number: '02'
      title: Revisione e termini aziendali
      description: Incontro virtuale per discutere la strategia del territorio, i livelli di prezzo e i termini della partnership. Esamina i requisiti di documentazione di conformità per il tuo mercato. Firma NDA se necessario.
      timeline: 1-2 settimane
    - number: '03'
      title: Ordine e valutazione dei campioni
      description: Effettua un ordine campione iniziale (2-5 unità) al prezzo del distributore per la valutazione del mercato e la formazione del team. Documentazione di conformità completa e preparazione demo incluse.
      timeline: 30-45 giorni
    - number: '04'
      title: Lancio e supporto della partnership
      description: Primo ordine di container con tutela del territorio attivata. Kit di marketing consegnato, formazione del team di vendita e assegnazione di un account manager dedicato. Revisioni aziendali trimestrali continue.
      timeline: In corso
content_application_docs:
  tagline: Documenti di candidatura
  title: Documenti richiesti<br />per la candidatura da concessionario
  subtitle: Per candidarti come concessionario Paddle Board Overstock, prepara i seguenti documenti e informazioni per il nostro team di revisione.
  items:
    - title: Certificato di registrazione dell'azienda
      description: Documento di registrazione aziendale valido che indichi la denominazione sociale, la sede registrata e l'oggetto sociale che comprenda la distribuzione di attrezzature marine, sportive o outdoor.
      icon: tabler:file-text
    - title: Piano di copertura territoriale
      description: Territorio geografico di interesse, rete di vendita o distribuzione esistente, segmenti di clientela target e volume annuale proposto per categoria di prodotto (RIB, SUP, kayak).
      icon: tabler:map
    - title: Capacità di showroom o magazzino
      description: Sede fisica per l'esposizione dei prodotti, lo stoccaggio e l'assistenza ai clienti. Foto o planimetrie che mostrino l'area dimostrativa e la capacità di stoccaggio dei ricambi.
      icon: tabler:building
    - title: Dichiarazione di capacità finanziaria
      description: 'Riferimento bancario o bilancio che confermi la capacità di effettuare un ordine container iniziale e mantenere le scorte. Ordine iniziale minimo: un container da 20 piedi (10-20 unità, modelli misti).'
      icon: tabler:coin
    - title: Capacità di assistenza post-vendita
      description: Tecnici di assistenza formati o formabili per la manutenzione e riparazione di imbarcazioni gonfiabili. Capacità di gestione delle richieste in garanzia e impegno sulle scorte di ricambi.
      icon: tabler:tool
    - title: Referenze di marchi precedenti
      description: Elenco dei marchi di attrezzature marine o sportive distribuiti attualmente o in passato. Referenze contattabili previo accordo reciproco. Le startup senza esperienza di distribuzione possono qualificarsi con un impegno finanziario più solido.
      icon: tabler:users
faq:
  title: 'Programma concessionari: domande frequenti'
  questions:
    - q: Qual è la quantità minima d'ordine per i distributori?
      a: Il MOQ del distributore parte da 10-20 unità per ordine, con flessibilità per modelli misti (RIB, gonfiabili, SUP). Gli ordini campione iniziali di 2-5 unità sono disponibili al prezzo del distributore per la valutazione di mercato.
    - q: Offrite diritti territoriali esclusivi?
      a: Sono disponibili diritti territoriali esclusivi per i distributori qualificati che soddisfano gli impegni di volume annuali e mantengono gli standard del marchio. Per i mercati emergenti sono disponibili anche accordi semi-esclusivi e non esclusivi.
    - q: Quale supporto di marketing fornite?
      a: Forniamo un kit di marketing completo che comprende fotografie professionali dei prodotti, schede tecniche, modelli di documentazione di conformità, libreria di contenuti per social media e materiali in co-branding. Aggiornato ogni anno con il lancio di nuovi prodotti.
    - q: Come vengono gestite le richieste di garanzia?
      a: 'I distributori fungono da primo punto di contatto per le richieste di garanzia. Forniamo criteri di garanzia chiari, protocolli di documentazione fotografica e sostituzione rapida o elaborazione del credito. Termini di garanzia: 5 anni limitati su tessuto/cuciture/scafo dei tubi della barca; 2 anni su SUP e accessori.'
    - q: Posso commercializzare i prodotti Paddle Board Overstock con il mio marchio?
      a: Sì, attraverso il nostro programma OEM/ODM. Le opzioni con marchio privato includono grafica personalizzata dei tubi, marchio della console, imballaggio per la vendita al dettaglio e documentazione di conformità con il nome del tuo marchio. Consulta la nostra pagina dei servizi OEM/ODM per i dettagli.
    - q: Quale documentazione di conformità è inclusa per i distributori?
      a: Ogni spedizione include la documentazione CE specifica del modello, i dati della targa del costruttore, i manuali del proprietario e la documentazione di spedizione. Forniamo inoltre supporto per la registrazione normativa per il vostro territorio e assistiamo con eventuali requisiti di conformità locali.
