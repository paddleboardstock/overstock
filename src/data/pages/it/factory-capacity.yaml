workshops:
  - title: Produzione Tavole SUP
    description: '4 linee di assemblaggio parallele per tavole SUP gonfiabili. Ogni linea può produrre 50–80 tavole per turno. Le postazioni di stampa digitale e serigrafia operano in parallelo. Capacità SUP annuale: oltre 8,000 tavole.'
    output: '8,000+ SUP/anno'
  - title: Produzione Gommoni RIB
    description: 'Officina dedicata per scafi in fibra di vetro con 6 postazioni stampo per scafi RIB fino a 7.6 m. L''area di saldatura e assemblaggio dei tubolari gestisce 3–5 RIB contemporaneamente. Capacità RIB annuale: oltre 2,000 imbarcazioni.'
    output: '2,000+ RIB/anno'
  - title: Natanti Gonfiabili & Dinghy
    description: 'Linee di produzione polivalenti per natanti gonfiabili, kayak e dinghy. Le postazioni di termosaldatura ad aria calda, le presse dielettriche RF e i banchi di assemblaggio vengono riconfigurati in base al mix di ordini. Capacità annuale: oltre 5,000 unità.'
    output: '5,000+ unità/anno'
  - title: Attrezzature di Sicurezza
    description: 'Area di produzione in camera pulita separata per giubbotti salvagente e attrezzature di sicurezza. Postazioni dedicate per cucitura, inserimento della schiuma e test. Capacità annuale giubbotti salvagente: oltre 50,000 unità.'
    output: '50,000+ giubbotti salvagente/anno'

oem_capacity:
  moq: 'SUP: 5–10 unità | RIB: 2–5 unità | Kayak/Dinghy: 10–20 unità | Stampo personalizzato: 200+ unità'
  lead_time: 'Standard 30–45 giorni. Campioni 15–20 giorni. Consegna accelerata disponibile.'
  payment: 'T/T 30% caparra + 70% prima della spedizione. Accettati L/C e Western Union.'