hero:
  tagline: Capacità Produttiva
  title: Capacità di Produzione & Produzione Annuale
  subtitle: Impianto di 12,000 m² che produce 15,000 imbarcazioni all'anno con margine di espansione

intro: Aquafarer gestisce uno dei più grandi stabilimenti dedicati alla produzione di natanti gonfiabili a Qingdao, in Cina. Il nostro impianto di 12,000 m² è organizzato in sei officine specializzate che operano in parallelo, dandoci la capacità di produrre 15,000 imbarcazioni all'anno tra le linee SUP, kayak, dinghy, RIB e attrezzature di sicurezza.

