hero:
  tagline: Capacità produttiva
  title: Capacità produttiva e produzione annuale
  subtitle: Impianto di 12.000 m² che produce 15.000 tavole all'anno con spazio di scalabilità
intro: Paddle Board Overstock gestisce uno dei SUP più grandi impianti dedicati alla produzione di tavole gonfiabili a Weihai, Cina. La nostra fabbrica di 12.000 m² è organizzata in sei officine specializzate che operano in parallelo, permettendoci di produrre 15.000 tavole all'anno per linee all'ambiente, turismo e serie SUP artistiche.
highlights:
  - value: 12,000 m²
    label: Totale del pavimento produttivo
    detail: Distribuiti in 6 laboratori specializzati
  - value: 15,000
    label: Tavole prodotte annualmente
    detail: Serie SUPs a tutto tondo, tour e d'arte
  - value: 200-300
    label: Forza lavoro qualificata
    detail: 25+ ingegneri, 2 turni al giorno
  - value: 50+
    label: Paesi di esportazione
    detail: UE, US, AU, Medio Oriente, Asia
  - value: 2-3
    label: Giorni lavorativi fino alla spedizione
    detail: Gli ordini in magazzino lasciano Weihai in fretta
  - value: 10+
    label: Anni di esperienza nell'esportazione
    detail: Dal 2012
workshops:
  - title: SUP Produzione di tavole
    description: '4 linee di assemblaggio parallele per pannelli gonfiabili SUP . Ogni linea può produrre 50–80 tavole per turno. Le stazioni di stampa digitale e SUP serigrafia operano contemporaneamente. Capacità annua: 8.000+ schede.'
    output: 8.000+ SUPs all'anno
  - title: Arte del mazzo e EVA finitura
    description: Laboratorio dedicato alla finitura per deck della serie artistica. Taglio di EVA precisione, motivi di deck posati a mano e rifiniture finali. La capacità annuale copre l'intera gamma della serie art.
    output: Gamma completa di serie artistiche
  - title: Drop-Stitch Laminazione
    description: 'Le linee di laminazione termica drop-stitch legano i nuclei ai PVC laminati esterni. Le bande di rotaie sono a fusione a triplo strato per garantire una resistenza ermetica. Capacità annua: 15.000+ carote.'
    output: 15.000+ nuclei all'anno
  - title: Accessori e confezioni
    description: Linee di assemblaggio e imballaggio di accessori per pompe, palette, guinzaglio e kit di riparazione. Le tavole vengono confezionate sottovuoto, confezionate e pallettate per la spedizione in tutto il mondo.
    output: Pacchetti completi, pronti per la spedizione
tldr:
  summary: Paddle Board Overstock produce 15.000 tavole da paddle all'anno nel proprio stabilimento di 12.000 m² a Weihai, Cina. 200-300 lavoratori specializzati su 2 turni, vendendo direttamente ai paddle boarder in 50+ paesi.
  points:
    - Campus produttivo di 12.000 m² a Weihai
    - 15.000 tavole costruite annualmente
    - 200-300 lavoratori specializzati, 2 turni/giorno
    - Gli ordini disponibili in magazzino vengono spediti in 2-3 giorni lavorativi
    - Garanzia di 2 anni su ogni scheda
cta:
  title: Scopri cosa è disponibile in magazzino
  desc: Sfoglia l'attuale eccedenza di magazzino e le tavole in liquidazione — pacchetti completi con sconti fino al 60% sul prezzo al dettaglio.
  label: Acquista tavole →
