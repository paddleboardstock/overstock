content_overpressure:
  tagline: Sicurezza della pressione
  title: Pressione della tavola<br />Gestione nei climi caldi
  subtitle: La pressione della tavola gonfiabile aumenta con la temperatura. Comprendere e gestire la sovrapressione protegge la tua tavola e mantiene ogni sessione sicura.
  items:
    - title: Perché la pressione aumenta
      description: L'aria si espande con il calore. Una tavola gonfiata a PSI 15 gradi a 20°C può salire di 1-2 PSI su 40°C di sole — la stessa fisica che rende una tavola fresca del mattino durissima a mezzogiorno.
      icon: tabler:gauge
    - title: Pressione operativa raccomandata
      description: Gonfia a 12-15 PSI, come stampato vicino alla valvola. La gamma nominale bilancia rigidità, sicurezza e durata delle giunzioni — più non è meglio.
      icon: tabler:chart-bar
    - title: Migliori pratiche per climati caldi
      description: Gonfia fino alla parte bassa della temperatura nelle giornate calde. Rilascia un po' d'aria prima di una prolungata esposizione al sole e non lasciare mai una tavola completamente gonfiata sulla spiaggia.
      icon: tabler:sun
    - title: Esposizione al sole e conservazione
      description: Conserva le tavole ombreggiate e parzialmente sgonfiate quando non le usi. Usa una borsa per UV tavole per protezione. Risciacquo e asciuga prima di arrotolare per la conservazione.
      icon: tabler:umbrella
    - title: Se la tavola sembra dura come una roccia
      description: Rilascia aria attraverso la valvola finché la tavola non torna al range nominale. Porta con sé il manometro sulla pompa per letture accurate — una tavola sovragonfiata mette sotto stress inutilmente le giunzioni.
      icon: tabler:alert-circle
