certifications:
  - title: Certificazione CE (UE 2016/425)
    standard: Regolamento DPI (UE) 2016/425 | EN ISO 12402
    description: Tutte le attrezzature di sicurezza Paddle Board Overstock rispettano i requisiti di marcatura CE ai sensi del regolamento europeo sui dispositivi di protezione individuale. Ogni prodotto è testato in modo indipendente da TÜV Rheinland, organismo notificato europeo. Le nostre imbarcazioni gommone e RIB soddisfano i requisiti delle categorie C e D della Direttiva Imbarcazioni da Diporto 2013/53/UE (RCD).
    body: La certificazione CE copre i requisiti essenziali di salute e sicurezza per i dispositivi di galleggiamento personali e le imbarcazioni gonfiabili. TÜV Rheinland audita annualmente il nostro stabilimento di produzione per verificare la conformità continua.
  - title: SOLAS — Salvaguardia della vita in mare
    standard: SOLAS Capitolo III | Codice LSA
    description: Il giubbotto di salvataggio Pro è conforme ai regolamenti SOLAS per le operazioni marine offshore e commerciali. Testato per la ritenzione di galleggiabilità di 24 ore, il gonfiaggio automatico all’immersione e le prestazioni con mare fino a forza 5. Soddisfa i requisiti del Capitolo III per i giubbotti di salvataggio sulle navi commerciali.
    body: L’approvazione SOLAS richiede test indipendenti da parte di un organismo notificato su galleggiabilità, resistenza, visibilità e attivazione automatica. Il nostro giubbotto di salvataggio Pro dispone della completa omologazione di tipo SOLAS con certificazione MED.
  - title: USCG Tipo III / Tipo V
    standard: 46 CFR Parte 160 | Approvazione USCG
    description: Selezionati giubbotti di salvataggio Paddle Board Overstock rispettano la classificazione della Guardia Costiera degli Stati Uniti per dispositivi di Tipo III (ausilio al galleggiamento) e Tipo V (uso speciale). Adatti ad acque riparate, alla navigazione costiera e alle operazioni commerciali che richiedono giubbotti approvati USCG.
    body: L’approvazione USCG richiede test presso un laboratorio indipendente riconosciuto dalla Guardia Costiera. L’approvazione di Tipo V include progetti gonfiabili ibridi con attivazione manuale o automatica.
  - title: Conformità sociale BSCI
    standard: Codice di condotta amfori BSCI
    description: Il nostro stabilimento è auditato annualmente nell’ambito dell’iniziativa amfori Business Social Compliance Initiative (BSCI). Questo verifica pratiche lavorative etiche, sicurezza sul luogo di lavoro, orari equi e gestione ambientale nel nostro stabilimento di produzione di 12.000 m².
    body: La conformità BSCI è un prerequisito per i rivenditori e gli importatori europei. La nostra attuale valutazione BSCI è «C» (Buono), auditata da SGS.
  - title: Conformità REACH e RoHS
    standard: Regolamento REACH (CE) 1907/2006 | Direttiva RoHS 2011/65/UE
    description: Tutti i composti in PVC, gli adesivi e i rivestimenti utilizzati nei prodotti Paddle Board Overstock rispettano il regolamento europeo REACH sulla sicurezza chimica e le restrizioni RoHS sulle sostanze pericolose. Le schede di sicurezza (MSDS) sono disponibili per ogni linea di prodotto.
    body: La conformità REACH garantisce l’assenza di sostanze SVHC limitate oltre le soglie. Test di laboratorio regolari di terze parti verificano la conformità continua per ogni lotto di produzione.
  - title: Gestione della qualità ISO 9001:2015
    standard: ISO 9001:2015 | Certificato da TÜV Rheinland
    description: Il nostro sistema di gestione della qualità è certificato ISO 9001:2015 da TÜV Rheinland e copre progettazione, produzione, collaudo e assistenza post-vendita. Audit di sorveglianza annuali garantiscono il miglioramento continuo e il controllo dei processi.
    body: La certificazione ISO 9001 richiede politiche di qualità documentate, audit interni, riesami della direzione, procedure di azione correttiva e registrazioni di produzione tracciabili.

testimonial:
  quote: Abbiamo acquistato attrezzature di sicurezza da diversi fornitori in Asia. Paddle Board Overstock è l’unico produttore che ha fornito fin dall’inizio la documentazione CE completa, i certificati SOLAS e i rapporti di prova di terze parti, senza che dovessimo chiederli.
  author: Erik Lindström
  title: Addetto alla sicurezza
  company: Baltic Marine Supply
  location: Finlandia

content_overpressure:
  tagline: Sicurezza da sovrappressione
  title: 'Gestione della pressione dei tubi RIB<br />nei climi caldi'
  subtitle: 'La pressione dei tubi gonfiabili aumenta con la temperatura. Comprendere e gestire la sovrappressione previene i danni e garantisce un utilizzo sicuro in ambienti tropicali e desertici.'
  items:
    - title: 'Valvole di sfiato Boyle'
      description: 'I tubi RIB Paddle Board Overstock sono dotati di valvole di sfiato della sovrappressione che rilasciano automaticamente la pressione in eccesso oltre il massimo nominale. Questo evita sollecitazioni alle cuciture e la possibile rottura del tubo causata dal riscaldamento solare.'
      icon: tabler:gauge
    - title: 'Variazione di pressione dal mattino a mezzogiorno'
      description: 'Un tubo gonfiato a 3,5 PSI a 20 °C può superare i 4,5 PSI con sole a 40 °C. Gonfia sempre al limite inferiore dell’intervallo consigliato nei climi caldi e lascia che la valvola di sfiato gestisca la pressione in eccesso.'
      icon: tabler:sun
    - title: 'Pressioni di esercizio consigliate'
      description: 'Tubi in PVC: 3,0–3,5 PSI di esercizio, 4,5 PSI massimo. Tubi in Hypalon: 3,5–4,0 PSI di esercizio, 5,0 PSI massimo. Verifica sempre a 1,25 volte la pressione nominale (4,4 PSI per il PVC, 5,0 PSI per l’Hypalon) secondo gli standard QC Paddle Board Overstock.'
      icon: tabler:chart-bar
    - title: 'Buone pratiche sotto il sole'
      description: 'Conserva i RIB in zone ombreggiate quando non vengono utilizzati. Usa coperture protettive UV per ormeggi prolungati. Controlla e regola la pressione dei tubi prima e dopo le ore di massimo sole. Non superare mai la pressione nominale massima.'
      icon: tabler:umbrella
    - title: 'Depressurizzazione di emergenza'
      description: 'Se il tubo risulta eccessivamente rigido o la valvola di sfiato sta sfiatando, rilascia aria tramite la valvola Halkey-Roberts o militare fino a riportare la pressione nell’intervallo di esercizio. Porta sempre con te un manometro per letture accurate.'
      icon: tabler:alert-circle

