hero:
  tagline: Sicurezza
  title: Standard di sicurezza e certificazione
  subtitle: Ogni prodotto Paddle Board Overstock affronta test rigorosi, e 64 modelli certificati CE rispettano gli standard internazionali di sicurezza per uso ricreativo e professionale. Fabbrica certificata ISO 9001.

