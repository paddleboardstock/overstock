hero:
  tagline: "Conoscenza per l'Esplorazione Acquatica"
  title: 'Impara'
  subtitle: |
    Guide, tutorial e approfondimenti — tutto ciò che ti serve per esplorare<br />
    l'acqua con fiducia. Dalla scelta del tuo primo SUP alle tecniche avanzate.
  taglineSection: 'Conoscenza per ogni pagaiatore. Dal principiante al professionista.'

featured:
  tagline: 'Argomenti in Evidenza'
  title: 'Inizia il tuo percorso di apprendimento'
  subtitle: 'Che tu sia nuovo negli sport acquatici o desideri migliorare, le nostre guide ti coprono.'
  items:
    - title: 'Basi del SUP'
      description: 'Tutto ciò che un principiante deve sapere — tipi di tavole, dimensioni della pagaia, postura e consigli per il primo giorno.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'Gonfiabile vs Tavola Rigida'
      description: 'Qual è quella giusta per te? Confrontiamo portabilità, prestazioni, durata e costo.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Sicurezza in Acqua'
      description: 'Conoscenze essenziali di sicurezza per ogni pagaiatore — meteo, giubbotti, autorescue e altro.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Guida ai Materiali'
      description: 'PVC vs Hypalon, tecnologia drop-stitch, valori denier — capisci di cosa è fatta la tua attrezzatura.'
      icon: 'tabler:hexagons'
      href: '/learn/materials'
    - title: 'Guida alle Misure SUP'
      description: 'Trova la lunghezza, larghezza e volume giusti per il tuo peso, abilità e stile di pagaiata.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'Tecniche Intermedie'
      description: 'Migliora la tua pagaiata con colpi avanzati, tecniche di virata e gestione delle acque agitate.'
      icon: 'tabler:ripple'
      href: '/learn/intermediate-techniques'

