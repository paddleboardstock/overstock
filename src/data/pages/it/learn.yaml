hero:
  tagline: Conoscenza dell'esplorazione dell'acqua
  title: Imparare
  subtitle: |
    Guide, tutorial e approfondimenti — tutto ciò di cui hai bisogno per esplorare<br />
    Acqua con fiducia. Dalla scelta del tuo primo SUP alla padronanza delle tecniche avanzate.
  taglineSection: Conoscenza per ogni canoista. Da principiante a professionista.
featured:
  tagline: Argomenti in evidenza
  title: Inizia il tuo percorso di apprendimento
  subtitle: Che tu sia nuovo agli sport acquatici o desideri migliorare le tue abilità, le nostre guide ti coprono.
  items:
    - title: SUP Basi
      description: Tutto ciò che un principiante deve sapere — tipi di tavole, dimensioni della pagaia, postura e consigli per il primo giorno.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Gonfiabile vs Tavola rigida
      description: Qual è giusto per te? Confrontiamo portabilità, prestazioni, durata e costo fianco a fianco.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Sicurezza in acqua
      description: Conoscenze di sicurezza essenziali che ogni canoista dovrebbe avere — meteo, giubbotti di salvataggio, auto-salvataggio e altro.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Guida ai materiali
      description: Drop-stitch nuclei, PVC laminati, EVA schiuma del ponte — capisci di cosa è fatta la tua tavola.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Guida alle dimensioni
      description: Trova la lunghezza, larghezza e volume della tavola giuste per il tuo peso, abilità e stile di pagai.
      icon: tabler:ruler
      href: /size-guide
    - title: Tecniche Intermedie
      description: Migliora la tua pagaia con colpi avanzati, tecniche di virata e gestione delle acque mosse.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
