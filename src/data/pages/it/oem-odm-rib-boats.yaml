comparison_matrix:
  title: 'OEM e ODM: quale modello si adatta al tuo progetto?'
  subtitle: Quattro modalità di collaborazione, ciascuna con diversi livelli di coinvolgimento della fabbrica e controllo del marchio
  columns:
    - header: Modalità di collaborazione
    - header: Il ruolo del tuo marchio
    - header: Ruolo dell'Paddle Board Overstock
  rows:
    - option: Produzione OEM
      standard: Fornire marchio, specifiche e requisiti di conformità
      premium: Costruisci secondo le tue specifiche utilizzando i nostri stampi e linee di produzione esistenti
    - option: Personalizzazione ODM
      standard: Seleziona un modello base, personalizza funzionalità e marchio
      premium: Adatta la comprovata piattaforma RIB con le modifiche desiderate
    - option: RIB semi-personalizzato
      standard: Definire la lunghezza dello scafo, il materiale dei tubi, la disposizione della coperta e l'attrezzatura
      premium: Modifica lo scafo esistente con la configurazione personalizzata dei tubi e il piano di coperta
    - option: Sviluppo completamente personalizzato
      standard: Fornire il concetto e i requisiti del mercato di riferimento
      premium: 'Progetta da zero: scafo personalizzato, stampo e documentazione completa'
content_customization:
  tagline: Cosa può essere personalizzato
  title: Personalizzazione del RIB<br />Opzioni
  subtitle: Ogni elemento di un RIB può essere personalizzato in base alle vostre esigenze di applicazione, mercato e marchio.
  items:
    - title: Scafo e struttura
      description: Lunghezza dello scafo (2,5–8,5 m), materiale dello scafo (fibra di vetro GRP o alluminio marino), colore dello scafo (gelcoat o verniciato), profilo della chiglia (V profonda, V moderata, piatto), tipo di poppa (traversa chiusa con staffa o pozzetto) e rinforzo strutturale per i requisiti di carico commerciale.
      icon: tabler:sailboat
    - title: Tubo e collare
      description: Materiale del tubo (PVC da 0,9–1,2 mm o Hypalon/CSM da 1,4–1,7 mm), diametro del tubo (40–55 cm), numero di camere (3–7), tipo di valvola (Halkey-Roberts, Leafield D7 o Boston), colore del tubo (standard o personalizzato) e configurazione cono/rastremata del collare.
      icon: tabler:circle
    - title: Disposizione del ponte e della console
      description: Console centrale, console laterale o timoneria. Disposizione dei posti a sedere (sedili da fantino, panche, sedili rinforzati). Rivestimento della coperta (schiuma EVA effetto teak, vernice antiscivolo o vetroresina nuda). Punti di montaggio dell'attrezzatura, maniglioni e posizioni degli anelli a D.
      icon: tabler:layout-dashboard
    - title: Elettrico e navigazione
      description: Luci di navigazione (LED), sistema di pompa di sentina, gestione della batteria, installazione radio VHF, montaggio GPS/plotter cartografico, porte di ricarica USB e configurazione del pannello degli interruttori.
      icon: tabler:bolt
    - title: Marchio e grafica
      description: Grafica per scafo e tubi (serigrafia, trasferimento termico, stampa digitale UV), posizionamento del logo, combinazioni di colori su misura, contrassegni identificativi e documentazione del proprietario personalizzata con il tuo marchio.
      icon: tabler:palette
    - title: Sicurezza e conformità
      description: Classificazione della categoria di progettazione (A/B/C/D per RCD), sistema antincendio, specifiche del sistema di alimentazione (serbatoio portatile, serbatoio fisso, sottocoperta) e pacchetto di documentazione di conformità per il mercato di riferimento.
      icon: tabler:shield
content_applications:
  tagline: Configurazioni dell'applicazione
  title: Configurazioni RIB<br />Per applicazione
  subtitle: Missioni diverse richiedono configurazioni diverse. Ecco le configurazioni comprovate per le applicazioni RIB più comuni.
  items:
    - title: Salvataggio e pattuglia
      description: Scafo a V profonda, tubi Hypalon, ponte autosvuotante, sedili rinforzati, maniglie di sostegno, luci di navigazione e anelli a D per carichi pesanti. Categoria di progettazione RCD B o C. Impianto di alimentazione resistente al fuoco ed impianto elettrico di livello commerciale.
      icon: tabler:lifebuoy
    - title: Supporto per le immersioni
      description: Trave larga, scaletta d'imbarco posteriore, posizioni per portabottiglie, anelli a D extra, supporto per bandiera da immersione, specchio di poppa rinforzato per fuoribordo gemelli e rivestimento antiscivolo in EVA su tutto il ponte.
      icon: tabler:mask
    - title: Turismo e commerciale
      description: Disposizione certificata per i passeggeri con panche, parasole/bimini, maniglioni, deposito a secco e sistema a doppia batteria. DMC di categoria C. Progettato per operazioni di resort e flotte charter.
      icon: tabler:beach
    - title: Pesca
      description: Disposizione del ponte aperto, posizioni dei portacanne, vasca per esche vive, supporto per fishfinder, supporto per motore da pesca alla traina, poppa rinforzata e sistema di alimentazione portatile. Opzioni console centrale o console laterale.
      icon: tabler:fish
    - title: Tender per il tempo libero e lo yacht
      description: Scafo leggero, tubi in PVC, sedili comodi, barra telescopica o console compatta, punti di sollevamento per gru e serbatoio del carburante rimovibile. Categoria DMC C o D.
      icon: tabler:sailboat
    - title: Barca da lavoro professionale
      description: Opzione scafo in alluminio, rinforzo per carichi pesanti, timoneria idraulica, impianto elettrico di livello commerciale, arco radar e punti di integrazione di attrezzature specifiche per la missione. Conformità personalizzata per progetto.
      icon: tabler:anchor
process_steps:
  title: Processo di sviluppo OEM/ODM RIB in 7 fasi
  subtitle: 'Dal brief del progetto al post-vendita: un flusso di lavoro definito con tappe fondamentali e risultati finali chiari'
  steps:
    - number: '01'
      title: Brief e requisiti del progetto
      description: Definisci l'applicazione target, le dimensioni dello scafo, il materiale dei tubi, i requisiti di conformità e le esigenze di branding. Valutiamo la fattibilità e confermiamo il modello di collaborazione (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 giorni
    - number: '02'
      title: Revisione tecnica e fattibilità
      description: Il team di ingegneri esamina la fattibilità strutturale, i calcoli di stabilità e galleggiabilità, il percorso di conformità e la disponibilità dei materiali. Identifichiamo stampi esistenti o requisiti di stampi personalizzati.
      timeline: 5–7 giorni
    - number: '03'
      title: Proposta e preventivo
      description: Ricevi una proposta dettagliata che include specifiche, rendering 3D o disegni GA, ambito di conformità, tempistica e prezzo unitario in base a livelli di volume e MOQ.
      timeline: 5–7 giorni
    - number: '04'
      title: Conferma del progetto e campionamento
      description: Approvare il GA finale, il layout del ponte e la configurazione dei tubi. Produciamo un campione di pre-produzione con i colori del marchio, il logo e i materiali specificati per l'ispezione fisica.
      timeline: 15-20 giorni
    - number: '05'
      title: Approvazione del campione e protocollo QC
      description: 'Ispezionare e approvare il campione. Definire il protocollo di controllo qualità della produzione: test di pressione (1,25x / 24–48 ore), controlli dimensionali e lista di controllo della documentazione di conformità per scafo.'
      timeline: 3–5 giorni
    - number: '06'
      title: Produzione di massa e controllo qualità
      description: Ciclo di produzione completo con lista di controllo QC da 100 punti per unità. Ispezioni durante il processo, prove di pressione e tracciabilità a livello di serie. Documentazione CE/ISO preparata in parallelo.
      timeline: 30–45 giorni
    - number: '07'
      title: Imballaggio, spedizione e post-vendita
      description: Imballaggio personalizzato (standard, pronto per la vendita al dettaglio o pallettizzato), documentazione di esportazione, caricamento di container e logistica. Kit di parti di ricambio e documentazione di manutenzione inclusi.
      timeline: 7–14 giorni
certifications:
  title: Conformità e certificazioni per imbarcazioni RIB
  subtitle: Ogni ordine RIB personalizzato viene fornito con la documentazione di conformità specifica del modello
  items:
    - name: CE 2013/53/UE
      description: 'Conformità RCD per modello e categoria di progettazione: dichiarazione di conformità, targhetta del costruttore, manuale del proprietario inclusi'
      badge: CE
    - name: ISO9001:2015
      description: Sistema di gestione della qualità certificato da SGS che copre progettazione, produzione e distribuzione
      badge: ISO
    - name: EN ISO 6185
      description: "Standard di costruzione di gommoni: stabilità, galleggiabilità e recupero dell'uomo in mare"
      badge: 6185
    - name: ISO 14945
      description: 'Standard della targa del costruttore: identificazione contrassegnata in modo permanente e informazioni sulla capacità'
      badge: 14945
    - name: BSCI
      description: 'Audit di conformità sociale per una produzione etica: richiesto dai rivenditori dell’UE'
      badge: BSCI
    - name: PORTATA
      description: Conformità UE in materia di sicurezza chimica per PVC, Hypalon, adesivi e rivestimenti
      badge: REACH
content_service_modules:
  tagline: Moduli di servizio
  title: Moduli di servizio<br />OEM/ODM
  subtitle: Ogni progetto combina i moduli di servizio giusti. Non tutti i progetti richiedono ogni modulo — perimetriamo solo ciò che il vostro progetto richiede.
  items:
    - title: Revisione tecnica e fattibilità
      description: 'Valutazione della piattaforma di scafo, verifica di fattibilità strutturale, verifica di stabilità e galleggiabilità, identificazione del percorso di conformità e conferma della disponibilità dei materiali. Output: rapporto di fattibilità con raccomandazione go/no-go.'
      icon: tabler:math-function
    - title: Design e configurazione
      description: 'Disegno GA, layout del ponte, configurazione dei tubolari, posizioni di consolle e sedute, piano di installazione delle attrezzature e scelta di colori e materiali. Output: GA approvato e specifica di configurazione.'
      icon: tabler:ruler
    - title: Campione e prototipo
      description: Campione di pre-produzione con colori e logo approvati e materiali specificati, per l'ispezione fisica. Include protocollo di approvazione del campione, checklist di ispezione e processo di change request.
      icon: tabler:3d-cube-sphere
    - title: Produzione e controllo qualità
      description: Produzione in serie con checklist di controllo qualità a 100 punti per unità, ispezioni in corso di lavorazione, prova di pressione (1,25x / 24-48h) e tracciabilità a livello di numero di serie. Documentazione CE/ISO predisposta in parallelo.
      icon: tabler:clipboard-check
    - title: Branding e imballaggio
      description: Applicazione del logo a marchio proprio, grafiche personalizzate di scafo e tubolari, documentazione del proprietario a marca, imballaggio pronto per la vendita o pallettizzato e preparazione dei kit di ricambi.
      icon: tabler:palette
    - title: Esportazione e documentazione
      description: Imballaggio di esportazione, piano di carico del container, documentazione FOB/CIF/DDP, documenti di conformità per mercato di destinazione e protocollo di comunicazione dopo la consegna.
      icon: tabler:world

content_risk_control:
  tagline: Gestione di rischi e consegne
  title: Gestione dei rischi<br />e delle consegne di progetto
  subtitle: Gli acquirenti OEM/ODM professionali attribuiscono al controllo dei rischi la stessa importanza della qualità del prodotto. Ecco come lo gestiamo.
  items:
    - title: Definizione di perimetro e proprietà
      description: 'Prima dell''inizio dello sviluppo, definiamo per iscritto: perimetro di personalizzazione, requisiti di attrezzatura, criteri di approvazione dei campioni, proprietà di disegni e stampi e responsabilità documentali. Nessuna ambiguità su chi possiede cosa.'
      icon: tabler:file-text
    - title: Processo di controllo delle modifiche
      description: Tutte le modifiche di specifica dopo la conferma del progetto seguono un processo documentato di change request con valutazione d'impatto (costi, tempi, conformità). Nessuna modifica non approvata entra in produzione.
      icon: tabler:arrows-diff
    - title: Garanzia di coerenza dei lotti
      description: La 50ª unità corrisponde al 1° campione approvato. Le specifiche approvate sono congelate, i parametri di materiale e processo bloccati, e i punti di controllo in linea verificano la coerenza lungo l'intera serie di produzione.
      icon: tabler:repeat
    - title: Trasparenza su tempi e capacità
      description: I tempi di consegna sono calcolati sulla capacità produttiva reale, sui livelli di scorte di materiale e sul carico ordini attuale — non su obiettivi auspicabili. Per ogni ordine forniamo un piano di produzione con milestone datate.
      icon: tabler:calendar-stats

faq:
  title: 'RIB OEM/ODM: domande frequenti'
  questions:
    - q: Qual è la differenza tra OEM e ODM per le imbarcazioni RIB?
      a: "OEM (Original Equipment Manufacturing): tu fornisci specifiche dettagliate e noi realizziamo il tuo progetto. ODM (Original Design Manufacturing): selezioni una comprovata piattaforma RIB Paddle Board Overstock e noi la personalizziamo con le caratteristiche e il marchio desiderati. L'ODM è più veloce e costa meno; L'OEM offre il massimo controllo sulla progettazione."
    - q: Posso personalizzare la forma e le dimensioni dello scafo del RIB?
      a: SÌ. Offriamo modifiche semi-personalizzate agli stampi dello scafo esistenti (diversi layout di coperta, configurazioni dei tubi) e sviluppo di scafi completamente personalizzati con nuovi stampi lavorati a CNC. I progetti semi-personalizzati possono iniziare con 2-5 unità; la personalizzazione completa richiede in genere impegni più elevati.
    - q: Quali materiali dei tubi sono disponibili per i RIB personalizzati?
      a: Offriamo PVC da 0,9-1,2 mm per uso ricreativo e commerciale leggero e Hypalon/CSM da 1,4-1,7 mm per applicazioni professionali, di soccorso e commerciali che richiedono una resistenza superiore ai raggi UV e all'ozono (durata di vita di 10-15 anni rispetto a 5-8 anni per il PVC).
    - q: Puoi configurare i RIB per applicazioni specifiche come salvataggio, immersioni o pesca?
      a: SÌ. Manteniamo modelli di configurazione comprovati per applicazioni di salvataggio/pattugliamento, supporto subacqueo, turismo/charter, pesca, tender per yacht e imbarcazioni da lavoro professionali. Ogni modello include il tipo di scafo, il materiale dei tubi, la disposizione del ponte e l'attrezzatura consigliati, che poi personalizziamo in base alle tue precise esigenze.
    - q: Di quali informazioni hai bisogno per un preventivo RIB OEM/ODM?
      a: Applicazione target, lunghezza dello scafo desiderata, preferenza del materiale dei tubi (PVC o Hypalon), quantità approssimativa e programma di consegna, requisiti di conformità del mercato di riferimento ed eventuali prodotti o specifiche di riferimento. Più dettagli fornirai, più veloce e accurato sarà il nostro preventivo.
    - q: Qual è il MOQ per le barche RIB personalizzate?
      a: 'Per gli stampi dello scafo esistenti con modifiche standard, il MOQ inizia da 2-5 unità per progetto. Per gli stampi personalizzati e lo sviluppo completamente personalizzato, la quantità minima richiesta dipende dalla complessità del progetto: in genere 10-20 unità per semi-personalizzati e più di 30 per completamente personalizzati con nuovi strumenti.'
    - q: Chi possiede gli stampi e i disegni personalizzati?
      a: Gli stampi sviluppati utilizzando i progetti base Paddle Board Overstock rimangono di proprietà di Paddle Board Overstock. Gli stampi completamente personalizzati commissionati e pagati dal cliente possono essere assegnati alla proprietà del cliente in base ai termini contrattuali. Tutti i termini di proprietà dello stampo sono documentati prima dell'inizio del progetto.
    - q: Come vengono confezionati i RIB personalizzati per l'esportazione?
      a: 'Standard: culla personalizzata + avvolgimento estensibile per caricamento container. Premium: confezionamento pronto per la vendita al dettaglio, sottovuoto o pallettizzato. Offriamo spedizioni FOB Qingdao, CIF e DDP. Documentazione di esportazione completa e sdoganamento inclusi.'
