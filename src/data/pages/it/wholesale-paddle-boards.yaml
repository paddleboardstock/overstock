hero:
  tagline: Tavole all'ingrosso SUP
  title: Tavole gonfiabili all'ingrosso<br />per le piccole imprese
  subtitle: Tavole di scorta nuova SUP di zecca in quantità adatte alle piccole imprese. Ordina 5–20 tavole, mescola qualsiasi modello in un'unica spedizione e scegli trasporto espresso aereo o marittimo verso 50+ paesi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tavole gonfiabili all'ingrosso SUP Paddle Board Overstock pronte per la spedizione
direct_answer: Paddle Board Overstock Fornisce tavole gonfiabili nuove di SUP zecca a piccoli rivenditori in tutto il mondo. Non esiste un grande ordine minimo — un ordine all'ingrosso parte da soli 5 tavole e puoi miscelare qualsiasi modello disponibile in un unico ordine. Le tavole vengono spedite dalla nostra base di Weihai, in Cina, tramite trasporto aereo espresso (1–3 tavole, campioni o rifornimenti urgenti) o trasporto marittimo consolidato (5–20 ordini da rivenditori di tavole). Ogni tavola è sottoposta al 100% a pressione prima della spedizione e coperta dalla nostra garanzia di 2 anni SUP .
tldr_points:
  - "MOQ Basso: gli ordini all'ingrosso partono da 5 tavole — dimensionate per piccoli negozi, non per carichi in container"
  - "Ordini di modelli misti: combinare SUP eventuali modelli disponibili in un'unica spedizione"
  - 'Due opzioni di spedizione: trasporto aereo espresso per 1–3 imbarcazioni, trasporto marittimo per 5–20 ordini di imbarcazione'
  - 'Stock nuovo di zecca: 100% testato a pressione, tasso di superamento delle ispezioni finali del 99,3%, garanzia di 2 anni SUP'
why_retailers:
  title: Perché i piccoli rivenditori scelgono SUP le tavole di sovrastock
  subtitle: Non serve un magazzino o un budget per container per acquistare a prezzi all'ingrosso.
  items:
    - title: Quantità Adatte alle Piccole Imprese
      description: Il tradizionale all'ingrosso richiede centinaia di unità per ordine. Il nostro modello di sovrastock è pensato per negozi indipendenti — inizia con 5 board e fai crescere il tuo ordine man mano che il negozio cresce.
    - title: Prezzi all'ingrosso reali senza l'impegno di volume
      description: Poiché vendiamo scorte in eccesso — produzione in eccesso e stock accuratamente approvvigionato da fabbriche partner selezionate — ottieni prezzi unitari a livello di volume senza il rischio a livello di volume.
    - title: Mescola i modelli per adattarli ai tuoi clienti
      description: Negozi di spiaggia, lake outfitter e negozi cittadini servono diversi canoisti. Mescola modelli all-around, da turismo e surf SUP in un unico ordine così il tuo scaffale soddisfa la domanda locale.
    - title: Nuovo di zecca, mai usato
      description: Ogni scheda nel nostro inventario in eccesso è nuova di zecca e inutilizzata — non seconde, non rese. Ogni scheda è testata al 100% prima di uscire dal magazzino.
    - title: Spedizione internazionale veloce e flessibile
      description: Il trasporto aereo espresso riceve rapidamente 1–3 schede o ordini campione alla tua porta; il trasporto marittimo consolidato mantiene basso il costo per scacchiera su 5–20 ordini da rivenditori di tavole.
    - title: Garantito da una garanzia reale
      description: All'ingrosso non significa non supportato. Ogni SUP scheda offre la nostra garanzia di 2 SUP anni, la stessa copertura che offriamo a ogni cliente in 50+ paesi.
pricing_section:
  tagline: Prezzi all'ingrosso
  title: Prezzi all'ingrosso semplici e trasparenti
  subtitle: Il prezzo viene preventivato per ordine in base ai modelli, alle quantità e al metodo di spedizione scelto. Nessuna spesa nascosta — il preventivo che ricevi è il prezzo che paghi.
  points:
    - title: Classificato per quantità
      description: I prezzi delle unità diminuiscono man mano che la dimensione dell'ordine aumenta. Un ordine con 10 consigli costa meglio per consiglio rispetto a uno con 5 consigli; un ordine con 20 consigli ancora meglio.
    - title: I modelli misti contano per un totale
      description: Il tuo livello di sconto si basa sul numero totale di schede nell'ordine, non per modello. Combinare 4 modelli diversi × 3 schede ciascuno conta come un ordine di 12 schede.
    - title: Preventivo con opzioni di spedizione
      description: Ogni preventivo include sia opzioni di spedizione espressa che via mare con tempi di transito stimati, così puoi scegliere l'equilibrio tra velocità e costo che si adatta alla tua tempistica di rifornimento.
    - title: Nessun account o iscrizione richiesta
      description: Non c'è alcun club all'ingrosso a cui aderire e nessuna quota annuale. Richiedi un preventivo, conferma l'ordine e noi spediamo.
