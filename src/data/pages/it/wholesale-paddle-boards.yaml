who_section:
  tagline: Chi forniamo
  title: Costruito per attività commerciali indipendenti di sport acquatici
  items:
    - title: Negozi di Spiaggia e Surf
      description: Piccoli rivenditori costieri che hanno bisogno di 5-15 tavole per stagione, miste tra modelli polivalenti per turisti e tavole da surf per i locali.
    - title: Venditori online
      description: Negozi di e-commerce e venditori sui marketplace che testano la categoria SUP senza impegnarsi a un intero container di un unico modello.
    - title: Flotte a Noleggio e Scuole
      description: Operazioni di noleggio e scuole SUP che integrano le flotte — tavole durevoli, modelli misti per servire diverse dimensioni di clientela e supporto in garanzia.
    - title: Resort e Tour Operator
      description: Hotel, resort sull'isola e tour operator che aggiungono SUP al loro programma di attività con piccole flotte iniziali e facile rifornimento stagionale.
how_to_order:
  tagline: Come funziona
  title: Come effettuare un ordine all'ingrosso
  steps:
    - title: Sfoglia l'inventario
      description: Esamina gli 11 modelli disponibili sopra o utilizza il selezionatore di modelli misti per creare una combinazione che si adatti ai tuoi clienti.
    - title: Richiedi un preventivo
      description: Inviaci i modelli, le quantità stimate, il tuo paese e la velocità di spedizione preferita utilizzando il modulo di richiesta qui sotto. Ti risponderemo con i prezzi unitari e le opzioni di spedizione.
    - title: Conferma e Paga
      description: Approva il preventivo finale — modelli, quantità, metodo di spedizione e totale. Le condizioni di pagamento sono confermate al momento del preventivo.
    - title: Testiamo, Imballiamo e Spediamo
      description: Ogni scheda è testata al 100% sotto pressione, imballata con tutto il kit di accessori e spedita da Weihai. Riceverai il tracciamento per l'intero percorso.
