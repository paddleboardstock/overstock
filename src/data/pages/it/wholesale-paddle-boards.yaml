faq_section:
  title: FAQ all’Ingrosso
  items:
    - q: Qual è l'ordine minimo all'ingrosso?
      a: Cinque schede. Il nostro modello overstock è pensato per piccoli rivenditori — non è necessario riempire un container per ottenere prezzi all’ingrosso.
    - q: Posso mescolare diversi modelli SUP in un unico ordine all'ingrosso?
      a: Sì. Gli ordini con modelli misti sono uno dei maggiori vantaggi dell'acquisto di stock overstock — combina qualsiasi modello disponibile in un’unica spedizione e il numero totale di schede determina la tua fascia di prezzo. Consulta la nostra pagina sull’ingrosso di modelli misti per i dettagli.
    - q: Le schede sono completamente nuove?
      a: Sì. Ogni scheda è completamente nuova, inventario in eccesso mai usato — mai rigenerate, ricondizionate o restituzioni dei clienti. Ogni scheda è testata al 100% sotto pressione prima della spedizione.
    - q: Quanto sono più economici i prezzi all'ingrosso rispetto a quelli al dettaglio?
      a: Il prezzo unitario all'ingrosso viene quotato per ordine in base ai modelli e alle quantità, ed è significativamente inferiore ai prezzi al dettaglio indicati sopra. Richiedi un preventivo per la tua combinazione desiderata e ti forniremo il prezzo esatto.
    - q: Quale metodo di spedizione dovrei scegliere?
      a: Il trasporto aereo espresso è adatto per 1–3 schede, campioni e rifornimenti urgenti. Il trasporto marittimo consolidato è la scelta economica per ordini da rivenditori di 5–20 schede. Forniamo il preventivo per entrambe le opzioni ad ogni richiesta.
    - q: Che garanzia hanno le schede all'ingrosso?
      a: La stessa Garanzia di 2 anni SUP che offriamo a tutti i clienti in ciascuno dei 50 + paesi in cui spediamo.
    - q: Spedite nel mio paese?
      a: Attualmente spediamo in più di 50 paesi, con guide regionali per America Latina, Sud-est asiatico, Africa, Medio Oriente e mercati chiave tra cui Messico, Brasile, Filippine, Indonesia, Thailandia, Sud Africa, Kenya e UAE. Chiedi nella tua richiesta di preventivo e confermeremo il servizio attuale al tuo indirizzo.
