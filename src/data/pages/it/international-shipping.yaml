process_section:
  tagline: Come Funziona la Spedizione
  title: Dal Nostro Magazzino alla Tua Porta
  steps:
    - title: Preventivo con Opzioni di Trasporto
      description: Ogni preventivo specifica le opzioni di trasporto per la tua destinazione — espresso e mare — con tempi di transito stimati, quindi nulla è deciso per te.
    - title: Controllo Qualità e Imballaggio
      description: Le tavole sono testate al 100% a pressione e poi confezionate con pompa, pagaia, leash, pinna, zaino e kit di riparazione — lo stesso pacchetto completo che vendiamo al dettaglio.
    - title: Spedizione da Weihai
      description: La tua spedizione lascia la nostra base logistica con il metodo di trasporto scelto e il tracciamento porta a porta ti viene comunicato lo stesso giorno.
    - title: Sdoganamento
      description: Forniremo la fattura commerciale e la lista di imballaggio necessarie per l'importazione. Dazi doganali e tasse nel tuo paese sono responsabilità dell'importatore — vedi la sezione doganale qui sotto.
    - title: Consegna e Ispezione
      description: Ispeziona la tua consegna al momento dell'arrivo. Se qualcosa è danneggiato o mancante, contattaci con foto e il numero dell'ordine — vedi la nostra politica per smarrimenti e danni qui sotto.
customs_section:
  tagline: Dogana e Dazi
  title: Dazi Doganali e Tasse d'Importazione
  subtitle: Manteniamo le responsabilità sul trasporto chiare piuttosto che fare promesse vaghe. Ecco esattamente chi è responsabile di cosa.
  items:
    - title: Cosa Copriamo
      description: Il tuo preventivo include il costo del trasporto verso la tua destinazione, e prepariamo e forniamo tutti i documenti di esportazione — fattura commerciale, lista di imballaggio e tracciamento della spedizione.
    - title: Cosa Copre l'Importatore
      description: Dazi d'importazione, IVA/GST e qualsiasi tassa del paese di destinazione sono a carico dell'importatore (tu o la tua azienda) secondo le regole del tuo paese. Non includiamo promesse fiscali vaghe nei nostri preventivi di trasporto.
    - title: Supporto per lo Sdoganamento
      description: La nostra documentazione è completa e coerente — codici HS corretti, valori dichiarati e specifiche del board — ed è questo che mantiene lo sgombero fluido. Se il tuo broker o ufficio doganale ha bisogno di documentazione aggiuntiva, la forniamo.
    - title: Controlla le tariffe locali prima di ordinare
      description: Le tariffe sui dispositivi gonfiabili per sport acquatici variano a seconda del paese. Controlla le regole di importazione del tuo paese o chiedi nella tua richiesta — le nostre guide regionali includono note doganali per i mercati chiave.
lost_damaged:
  title: Spedizioni perse o danneggiate
  description: Ispeziona la consegna quando arriva. Nel raro caso in cui una scheda arrivi danneggiata o manca un pacco, contattaci il prima possibile con il numero d'ordine e foto chiare del packaging e della scheda. Valutiamo ogni caso individualmente — a seconda della custodia, significa un pezzo di ricambio, una scheda di ricambio o un rimborso per l'articolo interessato. I difetti di fabbricazione sono coperti separatamente dalla nostra Garanzia di 2 anni SUP .
destinations_section:
  tagline: Dove Spediamo
  title: 50+ paesi e in aumento
  description: Spediamo in tutto il mondo, con guide dettagliate per i nostri principali mercati regionali. Ogni guida di mercato copre tipi di clienti locali, note di spedizione e consigli doganali per quella regione.
  regions_label: Guide regionali
  countries_label: Guide-Paese
faq_section:
  title: FAQ sulla spedizione
  items:
    - q: Quanto tempo richiede la spedizione espressa?
      a: Il tempo di transito espresso dipende dalla destinazione — a ogni richiesta ci richiamiamo il tempo stimato di transito per il tuo paese, prima che tu ti impegni in qualsiasi cosa.
    - q: Quanto tempo impiega il trasporto marittimo?
      a: Il trasporto merci via mare varia a seconda del porto di destinazione e degli orari di navigazione. Prevediamo una finestra stimata per la destinazione con il tuo ordine, e ricevi il tracciamento una volta che la spedizione parte.
    - q: Quale metodo di spedizione dovrei scegliere?
      a: Espresso per 1–3 tavole, campioni o rifornimenti urgenti. Trasporto marittimo per 5–20 ordini all'ingrosso di tavola dove il costo per tavola conta più della velocità. Facciamo un preventivo per entrambi così puoi confrontare.
    - q: I dazi e le tasse di importazione sono inclusi nel costo di spedizione?
      a: No. Il trasporto è preventivato separatamente e dazi di importazione, IVA/GST e tasse di destinazione sono responsabilità dell'importatore secondo le regole del tuo paese. Forniamo una documentazione completa e accurata per garantire una regola di sgombero.
    - q: Spedite nel mio paese?
      a: Spediamo in 50+ paesi. Consulta le nostre guide regionali e per i paesi qui sotto, oppure chiedi semplicemente nella tua richiesta — confermeremo il servizio attuale al tuo indirizzo.
    - q: Posso tracciare il mio ordine?
      a: Sì. Ogni spedizione — espressa o via mare — include il tracciamento porta a porta che condividiamo con voi il giorno della spedizione.
