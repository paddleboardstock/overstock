hero:
  tagline: Navigazione internazionale
  title: Spedizione internazionale —<br />Trasporto espresso e marittimo verso 50+ paesi
  subtitle: Ogni ordine viene spedito dalla nostra base logistica di Weihai, in Cina. Scegli il trasporto aereo espresso per campioni e rifornimenti urgenti, oppure il trasporto marittimo consolidato per ordini all'ingrosso per piccole imprese.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Tavole imballate per la spedizione internazionale
direct_answer: Paddle Board Overstock spedisce in più di 50 paesi da Weihai, Cina. Il trasporto aereo espresso trasporta 1–3 bord, ordini di campione e rifornimenti urgenti; il trasporto marittimo consolidato è l'opzione economica per 5–20 ordini all'ingrosso da 5–20 bordo. Ogni spedizione include il tracciamento porta a porta, e ogni schede è testata al 100% a pressione e caricata con il suo kit completo di accessori prima della spedizione.
tldr_points:
  - 'Trasporto aereo espresso: 1–3 tavole, campioni, rifornimenti urgenti — opzione più veloce'
  - "Trasporto marittimo: 5–20 ordini all'ingrosso a bordo — costo di trasporto per scacchiera più basso"
  - Tracciamento porta a porta su ogni spedizione verso 50+ paesi
  - Trasporto, assicurazione, sdoganamento e dazi di importazione sono dettagliati nel tuo preventivo — nessuna promessa vaga di all-in
from_china:
  tagline: Navigazione dalla Cina
  title: Da dove vengono spediti gli ordini
  description: Tutti gli ordini vengono inviati dalla nostra base logistica a Weihai, in Cina — il cuore della nostra produzione e attività di stoccaggio. Weihai è una importante città portuale costiera nella provincia di Shandong con collegamenti diretti via mare e aerea, che mantiene tempi di transito e costi di trasporto competitivi rispetto alle destinazioni in Asia, Americhe, Africa, Europa e Medio Oriente.
modes_section:
  tagline: Due opzioni
  title: Spedizione Espressa o Trasporto Marittimo
  subtitle: Il metodo di trasporto corretto dipende da quanto velocemente hai bisogno delle tavole e da quante ordini. Entrambe le opzioni vengono preventivate a ogni richiesta.
  express:
    name: Opzione A — Spedizione Espressa
    best_for: Ideale per 1–3 tavole, campioni e rifornimenti urgenti
    description: Air Express riceve piccoli ordini e cartelloni campioni alla tua porta in giorni, non in settimane. Ideale quando stai testando un modello prima di un ordine più grande, o quando rifornisci un best-seller a metà stagione.
    features:
      - 1–3 schede, modelli singoli o campioni di modelli misti
      - Il transito più veloce delle due opzioni — preventivato per destinazione
      - Tracciamento porta a porta con un grande vettore espresso
      - 'Uso tipico: campioni, rifornimenti urgenti, piccoli primi ordini'
  sea:
    name: Opzione B — Trasporto marittimo
    best_for: Ideale per 5–20 ordini all'ingrosso e al dettaglio
    description: Il trasporto marittimo consolidato è la scelta economica per gli ordini all'ingrosso per piccole imprese. Le scacche sono impazzite insieme in un'unica spedizione consolidata da Weihai, mantenendo basso il costo per ogni scheda.
    features:
      - 5–20 ordini board retailer e all'ingrosso
      - Il costo di trasporto per scacchiera più basso tra le due opzioni
      - Imballaggio consolidato — una spedizione, una libera
      - "Uso tipico: rifornimenti stagionali, ordini all'ingrosso di modelli misti"
