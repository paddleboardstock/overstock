features3_reasons:
  tagline: Perché scegliere Paddle Board Overstock
  title: Sette motivi per collaborare con noi
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Produzione reale, non commercio
      description: Possediamo e gestiamo una fabbrica di 12.000 m². Quando acquisti da Paddle Board Overstock, acquisti direttamente dalle persone che progettano, ingegnerizzano e costruiscono la tua scheda — nessun intermediario, nessun ricarico al dettaglio.
      icon: tabler:building-factory
    - title: 2. Approccio guidato dall'ingegneria
      description: Il nostro processo di progettazione inizia dal caso d'uso, non dalla categoria di prodotto. Ottimizziamo la forma dello scafo, la selezione dei materiali e la configurazione per come la scheda verrà effettivamente utilizzata.
      icon: tabler:engine
    - title: 3. Qualità comprovata
      description: Ogni scheda è testata al 100% con una valutazione 1,25x PSI prima della spedizione. Un tasso senza difetti del 99,3% — misurato su ogni lotto, non solo dichiarato.
      icon: tabler:shield-check
    - title: 4. Progettazione Davanti al Pagaio
      description: 'Copertine di coperta, serie a colori, supporti per accessori e pacchetti completi — tavole progettate per il vero canoaio: turismo, yoga, pesca, fitness e divertimento in famiglia.'
      icon: tabler:swimming
    - title: 5. Logistica Globale
      description: Spedizione diretta dalla nostra fabbrica di Weihai ai pagaiatori in 50+ paesi, con tracciamento completo e gestione doganale.
      icon: tabler:truck-delivery
    - title: 6. Supporto a vita
      description: Supportiamo schede che abbiamo costruito anni fa. Pezzi di ricambio autentici, consigli tecnici, consigli per la riparazione — il nostro team è disponibile quando hai bisogno di noi.
      icon: tabler:lifebuoy
    - title: 7. Specifiche oneste
      description: Valutazioni reali di carico, dimensioni reali, peso reale. Nessuna inflazione di marketing. Quello che pubblichiamo è ciò che ottenete — verificato da test indipendenti.
      icon: tabler:ruler-measure
testimonials:
  tagline: Fidati dai marchi di tutto il mondo
  title: Cosa dicono i nostri partner
  items:
    - content: La mia tavola è arrivata fresca di fabbrica con tutto nella scatola. Due stagioni di pagaiate settimanali e ancora trattiene perfettamente l'aria.
      name: — Sarah M., Canottiera del weekend, Florida
    - content: Ho confrontato le specifiche per settimane prima di acquistare. Paddle Board Overstock era l'unico marchio a pubblicare pesi reali e pressioni reali. Quello che elencano è ciò che si ottiene.
      name: — Tomasz K., Canottiere da turismo, Polonia
    - content: Ora tutta la famiglia va in kayak. Abbiamo iniziato con una tavola e siamo finiti con quattro — la qualità ha reso la decisione facile.
      name: — Angela R., Canottiera di famiglia, Australia
