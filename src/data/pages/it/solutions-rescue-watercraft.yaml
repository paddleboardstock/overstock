content_challenge:
  tagline: La sfida
  title: 'Le operazioni di soccorso richiedono<br />un''affidabilità senza compromessi'
  subtitle: 'Le organizzazioni di ricerca e soccorso operano sotto una responsabilità di sicurezza estrema — ogni guasto di un''imbarcazione ha conseguenze inaccettabili.'
  paragraphs:
    - 'Nelle operazioni di soccorso, il margine tra successo e fallimento si misura in minuti. L''imbarcazione deve essere pronta a partire immediatamente, operare in condizioni difficili e rientrare in sicurezza con i passeggeri. La responsabilità di sicurezza è assoluta — un guasto meccanico durante una missione di soccorso non è un costo di riparazione, è una vita persa.'
    - 'Le imbarcazioni SAR devono coniugare l''alta velocità per raggiungere rapidamente le vittime con una stabilità eccezionale per operazioni di recupero in sicurezza. Devono trasportare attrezzature di soccorso, forniture mediche e sistemi di comunicazione — spesso in uno spazio di coperta limitato. Le imbarcazioni al servizio delle istituzioni richiedono inoltre una lunga vita operativa (10-15+ anni) per giustificare i budget di acquisto pubblici.'
    - 'La visibilità — sia per l''operatore sia per la ricerca — è fondamentale. Il design della consolle deve garantire una visibilità a 360 gradi, e l''imbarcazione deve essere ben visibile da aerei e altre unità.'
    - 'I RIB di soccorso Aquafarer sono progettati dalla chiglia per soddisfare questi requisiti — con ponti autosvuotanti, carene rinforzate, suite di navigazione e colonnine di traino di serie sui modelli da pattuglia.'
content_solution:
  tagline: La nostra soluzione
  title: 'RIB di soccorso progettati su misura'
  subtitle: 'Ogni imbarcazione di soccorso Aquafarer è progettata per soddisfare o superare gli standard SOLAS e SAR nazionali.'
  list:
    - 'Ponte autosvuotante — l''acqua defluisce automaticamente per garantire la stabilità durante le operazioni di recupero'
    - 'Carena a V profonda rinforzata — tenuta in mare mosso con comportamento prevedibile alle alte velocità'
    - 'Suite completa di luci di navigazione — operativa giorno e notte in tutte le condizioni meteorologiche'
    - 'Colonnina e cima di traino — pronte per il rimorchio di natanti o per le operazioni con slitta di salvataggio'
    - 'Piastre di montaggio attrezzature — radio, riflettore, sirena e dispositivi medici'
    - 'Molteplici configurazioni motore — singolo fuoribordo o ridondanza bimotore'
    - 'Colori dei tubolari ad alta visibilità — arancione, giallo o rosso per la massima visibilità'
content_segments:
  tagline: Profili di soccorso
  title: 'Soluzioni di natanti SAR<br />Per tipo di organizzazione'
  subtitle: 'Organizzazioni di soccorso diverse operano con mandati, cicli di budget e ambienti operativi diversi — dalle squadre volontarie costiere alle flotte nazionali di guardia costiera. Configuriamo ogni RIB di soccorso in base al profilo di missione.'
  items:
    - title: 'Guardia Costiera e Agenzie SAR Governative'
      subtitle: 'Responsabilità di sicurezza assoluta — standard di flotta critici per la missione'
      description: 'Le agenzie SAR governative portano la più alta responsabilità di sicurezza nelle operazioni marittime. Ogni imbarcazione deve funzionare in modo impeccabile in condizioni estreme — un guasto alle attrezzature durante una missione di soccorso non è un''opzione. Le decisioni di acquisto sono guidate dal costo totale di possesso su una vita operativa di 10-15 anni, non dal prezzo iniziale. Le agenzie necessitano di unità che resistano ad anni di pattugliamento costiero, rispettino rigorosi standard nazionali e offrano prestazioni costanti tra stazioni distribuite. Un dossier di conformità completo e contratti di assistenza pluriennali sono obbligatori.'
      features:
        - 'Dossier documentale di conformità agli standard SOLAS e SAR nazionali'
        - 'Intercambiabilità dei ricambi su tutta la flotta — riduce la complessità di magazzino a livello di stazione'
        - 'Configurazione bimotore per una ridondanza critica in missione'
        - 'Progettazione per 10-15 anni di vita operativa con programmi di manutenzione pianificata'
        - 'Capacità tutto tempo — carena a V profonda rinforzata per stati di mare difficili'
    - title: 'Servizi di Salvataggio e Soccorso Balneare'
      subtitle: 'Operazioni a lancio rapido in acque basse'
      description: 'I servizi di salvataggio comunali e balneari hanno bisogno di unità a risposta rapida capaci di uscire attraverso la zona dei frangenti, operare nelle acque costiere basse e raggiungere nuotatori o natanti in difficoltà in pochi minuti. L''attrezzatura deve essere abbastanza leggera da essere trainata sulla spiaggia da un piccolo veicolo o a mano.'
      features:
        - 'Carena RIB a basso pescaggio per l''operazione nella zona dei frangenti e in acque costiere'
        - 'Lancio da spiaggia possibile grazie alla maniglia di sollevamento a prua e alla protezione di chiglia'
        - 'Slitta di salvataggio integrata o piattaforma per il soccorritore acquatico'
        - 'Tubolari arancioni o gialli ad alta visibilità di serie'
    - title: 'Reparti di Soccorso dei Vigili del Fuoco'
      subtitle: 'Integrazione di pompa antincendio, montaggio attrezzature, risposta rapida'
      description: 'Le unità nautiche dei vigili del fuoco rispondono a incendi di strutture in riva, incendi di natanti e incidenti di soccorso acquatico. Queste imbarcazioni devono trasportare pompe antincendio, lancia monitore, manichette e apparecchi respiratori — il tutto integrato in una piattaforma stabile a risposta rapida. I reparti le utilizzano anche per la risposta alle alluvioni e le operazioni di mutuo soccorso. Il layout della consolle deve ospitare i comandi della pompa, i sistemi radio e l''illuminazione di emergenza senza sacrificare lo spazio di coperta per i movimenti dell''equipaggio.'
      features:
        - 'Lancia monitore montata a prua con pacchetto di integrazione pompa'
        - 'Montaggio dedicato per pompa antincendio, stivaggio manichette e apparecchi respiratori'
        - 'Consolle configurabile per comandi pompa, radio e illuminazione di emergenza'
        - 'Ponte autosvuotante per il deflusso dell''acqua di spegnimento e la stabilità'
        - 'Pacchetto operazioni notturne: riflettore, illuminazione dell''area, barra luci blu/rossa'
    - title: 'Polizia Marittima e Sicurezza Portuale'
      subtitle: 'Operazioni di interdizione, pattugliamento e abbordaggio'
      description: 'Le unità di polizia marittima richiedono imbarcazioni capaci di inseguimenti ad alta velocità, abbordaggio di natanti sospetti e pattugliamento per la sicurezza portuale. Questi natanti devono avere uno stivaggio sicuro per attrezzature di intervento e armi, l''integrazione delle comunicazioni con il comando a terra e uno spazio di coperta sufficiente per le operazioni della squadra di abbordaggio. La capacità di operare di notte e l''avvicinamento discreto sono essenziali per le missioni di interdizione.'
      features:
        - 'Capacità di inseguimento ad alta velocità — carena planante con velocità massima superiore a 40 nodi'
        - 'Armadietto per armi sicuro e compartimenti di stivaggio per l''attrezzatura di intervento'
        - 'Integrazione in consolle per radio di polizia, MDT e sistemi di comunicazione'
        - 'Pacchetto operazioni notturne: riflettore IR, supporto FLIR, illuminazione coperta'
        - 'Piattaforma di abbordaggio rinforzata con superficie antiscivolo'
        - 'Sistema di illuminazione di emergenza blu/rossa e sirena'
    - title: 'Organizzazioni SAR Volontarie e Non Profit'
      subtitle: 'Operazioni costiere e lacustri di comunità, finanziate da sovvenzioni'
      description: 'I gruppi di soccorso di comunità operano su laghi, fiumi e aree costiere dove la copertura SAR pubblica è limitata. Spesso finanziate da donazioni o sovvenzioni pubbliche, queste organizzazioni hanno bisogno della massima capacità per ogni euro — un''imbarcazione affidabile e a bassa manutenzione che i volontari possano usare in sicurezza con una formazione minima. I cicli di sovvenzione impongono che le imbarcazioni rispettino i requisiti normativi restando entro budget fissi.'
      features:
        - 'Configurazione a singolo fuoribordo ottimizzata per minori costi di acquisto e gestione'
        - 'Costruzione in PVC per minore manutenzione e facili riparazioni sul campo'
        - 'Consolle multifunzione che riduce al minimo la complessità elettronica per gli operatori volontari'
        - 'Dossier documentale di conformità alle sovvenzioni per le richieste di finanziamento'
        - 'Design leggero per il lancio da spiaggia senza rimorchio o gru dedicati'
    - title: 'Soccorso in caso di Alluvioni e Risposta ai Disastri'
      subtitle: 'Alluvioni interne, acque basse, ambienti con detriti'
      description: 'Il soccorso in caso di alluvione è un profilo operativo distinto — le imbarcazioni operano in aree urbane allagate, correnti cariche di detriti e acque estremamente basse dove gli ostacoli sommersi sono invisibili. Gli operatori hanno bisogno di unità capaci di navigare tra le strade allagate, farsi largo tra i detriti ed estrarre le vittime da edifici e veicoli. Il basso pescaggio è fondamentale, così come la capacità di operare in corrente con rischi di impigliamento. Queste imbarcazioni sono spesso schierate da vigili del fuoco, protezione civile e ONG di soccorso in caso di disastri.'
      features:
        - 'Carena a pescaggio ultra basso — operativa in 30-50 cm d''acqua'
        - 'Prua devia-detriti e protezione rinforzata dei tubolari per gli ostacoli sommersi'
        - 'Ponte autosvuotante per il deflusso dell''acqua di alluvione e il recupero delle vittime'
        - 'Tubolari arancioni o gialli ad alta visibilità per il riconoscimento aereo'
        - 'Design leggero per il trasporto in elicottero e lo schieramento su strada'
        - 'Punti di sollevamento rinforzati per operazioni di recupero con verricello e corde'
