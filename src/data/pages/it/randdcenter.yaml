rd_services:
  tagline: R&S personalizzata
  title: Servizi R&S per partner
  services:
    - title: Sviluppo materiali personalizzati
      desc: Sviluppiamo formulazioni di tessuti, impilamenti di laminati e sistemi adesivi su misura per il vostro ambiente operativo e obiettivi di prestazione.
    - title: Ingegneria prodotto OEM / ODM
      desc: Dagli schizzi concettuali ai pacchetti tecnici pronti per la produzione — il nostro team può progettare, prototipare e validare imbarcazioni sotto il vostro marchio.
    - title: Test & certificazione di terze parti
      desc: Utilizzate le nostre strutture di test conformi ISO per test sui materiali indipendenti, validazione prodotto e supporto alla certificazione.
  cta: Discutete le vostre esigenze R&S →
  cta_link: /contact

vision:
  tagline: La nostra visione
  title: Plasmare il futuro degli sport acquatici
  body: Aquafarer si impegna a guidare il settore delle imbarcazioni gonfiabili e dei SUP attraverso l'innovazione continua, la qualità incrollabile e un impegno costante verso la sicurezza e la sostenibilità — arricchendo in definitiva le esperienze degli appassionati di sport acquatici in tutto il mondo. Il centro R&S Aquafarer è dove la passione incontra l'innovazione, stabilendo nuovi standard per il settore degli sport acquatici.

labs_section:
  tagline: Laboratori
  title: I nostri laboratori
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: Laboratorio tessuti PVC
      description: Ricerca e test continui dei tessuti per tubi PVC e Hypalon per resistenza a trazione, resistenza ai UV, abrasione e flessibilità a bassa temperatura per garantire affidabilità a lungo termine in ambienti marini.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studio ingegneria scafo
      description: Progettazione CAD e analisi agli elementi finiti di scafi in HDPE, alluminio e fibra di vetro. Ogni scafo viene simulato digitalmente per distribuzione delle sollecitazioni e resistenza all'impatto prima della costruzione del primo prototipo.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Centro saldatura RF
      description: Struttura di saldatura a radiofrequenza dedicata con controllo preciso di temperatura e pressione, che produce giunti ermetici ad alta resistenza che superano gli standard ISO 6185 per imbarcazioni gonfiabili.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Vasca prove idrodinamiche
      description: Test su modello nella nostra vasca prove interna per ottimizzare la forma dello scafo, le prestazioni di planata, la stabilità e l'efficienza del carburante in una gamma di condizioni di carico e mare.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Officina prototipi
      description: Struttura di prototipazione e rigging a grandezza naturale dove i nuovi modelli vengono costruiti, allestiti e provati in mare. Ogni prototipo viene sottoposto a un programma minimo di 20 ore di test in acqua prima dell'approvazione alla produzione.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratorio qualità & ispezione
      description: Laboratorio di garanzia qualità dedicato che esegue test di trazione, cicli di ritenzione d'aria, test di pelatura delle giunture e certificazione dei materiali per garantire che ogni imbarcazione che lascia l'officina soddisfi le nostre specifiche pubblicate.
      href: /randdcenter/quality-inspection-lab
