pillars:
  - title: Progresso tecnologico
    desc: Pionieri di nuovi materiali, design e processi di produzione per prestazioni e longevità superiori del prodotto.
    icon: tech
  - title: Materiali avanzati
    desc: Ricerca di PVC, Hypalon, compositi e alternative sostenibili all'avanguardia per caratteristiche prodotto migliorate.
    icon: materials
  - title: Sostenibilità
    desc: 'Un impegno fondamentale: Siamo dedicati alla tutela ambientale attraverso una produzione sostenibile e materiali riciclabili.'
