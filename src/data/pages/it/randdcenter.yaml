capabilities:
  tagline: Capacità
  title: Capacità R&S
  subtitle: Quattro discipline chiave che ci danno il controllo end-to-end sullo sviluppo prodotto — dalla ricerca sulle materie prime alla certificazione finale.
  groups:
    - title: Scienza dei materiali & tecnologia dei tessuti
      items:
        - Analisi e ottimizzazione delle formulazioni PVC e Hypalon
        - Sviluppo di stabilizzazione UV, ritardanti di fiamma e additivi antimicrobici
        - Laminazione multistrato e ingegneria dell'adesione
        - Test di invecchiamento accelerato (UV, termico, umidità, nebbia salina)
    - title: Ingegneria dello scafo & idrodinamica
      items:
        - Progettazione parametrica 3D dello scafo e ottimizzazione CFD
        - Analisi agli elementi finiti per carichi strutturali e d'impatto
        - Prove in vasca di rimorchio su modello e validazione delle prestazioni
        - Sviluppo scafi personalizzati per profili di missione speciali
    - title: Tecnologia di saldatura & giunzione
      items:
        - Sviluppo e ottimizzazione dei processi di saldatura dielettrica RF
        - Metodi di saldatura ad aria calda, a cuneo caldo e a ultrasuoni
        - Qualificazione di giunti incollati e nastri per giunzioni
        - Modellazione della resistenza della saldatura e previsione della durata
    - title: Test, certificazione & conformità
      items:
        - Test di conformità , e CE
        - Test e certificazione di terze parti indipendenti
        - Sviluppo di protocolli di test personalizzati per qualificazione approvvigionamento
        - Analisi dei guasti in servizio e ricerca delle cause profonde

