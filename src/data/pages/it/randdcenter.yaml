hero:
  tagline: Centro R&S
  title: Centro di R & S
  subtitle: Concentrati sul progresso

intro:
  - Il centro di ricerca e sviluppo (R&S) di Aquafarer è la forza trainante della nostra missione di rivoluzionare le attrezzature per sport acquatici. Diamo potere agli appassionati di sport acquatici in tutto il mondo con prodotti più sicuri, più confortevoli e più piacevoli attraverso un'innovazione incessante nelle tavole stand-up paddle (SUP) e nelle imbarcazioni gonfiabili. Il nostro team dedicato di ingegneri, designer ed esperti appassionati di sport acquatici sta plasmando il futuro del settore, alzando costantemente l'asticella per qualità, prestazioni e sostenibilità.
  - La nostra struttura R&S riunisce scienziati dei materiali, architetti navali e ingegneri di produzione sotto lo stesso tetto. Dalla formulazione dei tessuti e la simulazione degli scafi allo sviluppo dei processi di saldatura e alle prove in mare a grandezza naturale, ogni fase dello sviluppo prodotto è guidata dai dati e validata dai test.

