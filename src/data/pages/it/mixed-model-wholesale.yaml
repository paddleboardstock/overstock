who_benefits:
  tagline: Chi Può Beneficiare
  title: A Chi È Rivolto il Modello Misto all'Ingrosso
  items:
    - title: Importatori Alle Prime Esperienze
      description: Testare la categoria SUP con una varietà di modelli invece di impegnarsi su un singolo SKU all'ingrosso.
    - title: Rivenditori Stagionali di Spiaggia
      description: Negozi che necessitano di tavole per principianti per i turisti e edizioni premium per i locali — nello stesso ordine di rifornimento.
    - title: Venditori online
      description: Elencare diversi modelli contemporaneamente per capire quale grafica, lunghezza e utilizzo converte meglio.
    - title: Flotte a Noleggio e Scuole
      description: Fleet che necessitano di diverse dimensioni di tavole per vari pesi dei rider e tipi di lezione, non una flotta a specifiche uniche.
faq_section:
  title: FAQ Modello Misto
  items:
    - q: Esiste una quantità minima per modello?
      a: No. Il minimo di 5 tavole si applica all'ordine totale, non a ciascun modello. Potresti ordinare 5 modelli diversi, una tavola per ciascuno.
    - q: Mescolare modelli cambia il prezzo?
      a: I prezzi all'ingrosso sono quotati per modello, ma la tua fascia di prezzo migliora con il numero totale di tavole — mescolare modelli non comporta penalità.
    - q: Posso mescolare tavole e accessori?
      a: Sì — pagaie di riserva, pompe e kit di riparazione possono essere aggiunti a un ordine misto. Chiedi nella tua richiesta.
    - q: Come faccio a sapere quali modelli adattano al mio mercato?
      a: Inviaci una nota sui tuoi clienti (costieri o dell'entroterra, turisti o locali, principianti o rider) nel modulo di richiesta e ti consiglieremo un mix.
