hero:
  tagline: Modello misto all'ingrosso
  title: Paddle tavole a modello misto all'ingrosso —<br />Mescola modelli SUP diversi in un unico ordine
  subtitle: Perché limitare il budget a un solo modello? Combina qualsiasi SUP tavola disponibile — edizioni all-around, touring, surf e art — in un unico ordine all'ingrosso, per un totale di appena 5 tavole.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Un ordine misto di SUP diversi modelli di tavole gonfiabili da Paddle Board Overstock
direct_answer: Il modello misto all'ingrosso permette a un piccolo rivenditore di ordinare diversi SUP modelli in un'unica spedizione consolidata invece di una quantità all'ingrosso di una singola tavola. Paddle Board OverstockA , qualsiasi modello in stock può essere combinato, il minimo d'ordine è di 5 tavole in totale e la quantità totale determina il livello di prezzo. Gli ordini misti vengono spediti da Weihai, Cina, tramite trasporto aereo espresso (1–3 tavole) o trasporto marittimo consolidato (5–20 tavole) verso 50+ paesi, e ogni tavola è testata al 100% a pressione e coperta dalla garanzia di 2 anni SUP .
tldr_points:
  - Mescola tutti SUP i modelli disponibili in un unico ordine — senza minimi per modello
  - La quantità totale dell'ordine (non la quantità per modello) determina il tuo livello di prezzo
  - Inizia con 5 tavole in totale — costruite per piccoli rivenditori, non per carichi in container
  - 'Una spedizione consolidata: un costo di spedizione, uno sdoganamento doganale, una consegna'
why_mixed:
  tagline: Perché mista?
  title: Mescola e abbina. Compra più varietà. Spendi meno.
  subtitle: Una mensola di tavole identiche serve un solo tipo di pagaiatore. Un ordine misto trasforma lo stesso budget in una linea di prodotti completa.
  items:
    - title: Più varietà sulla tua mensola
      description: Unisci tavole all-around per principianti, tavole da turismo per avventurieri e tavole da surf per rider — un unico ordine copre tutta la tua gamma di clienti.
    - title: Rischio minore per modello
      description: Invece di scommettere la stagione su un solo modello, ordina 2–4 di ciascuno. Se un modello vende più degli altri, riforniscilo al prosimo ordine con dati reali sulle vendite.
    - title: Prova cosa si vende nel tuo mercato
      description: Ogni spiaggia, lago e città ha una domanda diversa. Un primo ordine misto è la ricerca di mercato più economica — fai scorta sei modelli, vedi quali si muovono.
    - title: Margini migliori sulle edizioni Art
      description: Le tavole di serie art premium (Leviathan Wake, Medusa Glow, Ocean Voyager) offrono prezzi più alti. Mescolane alcune in una base di tavole complete per aumentare il margine medio.
    - title: Una spedizione consolidata
      description: Un ordine misto significa una prenotazione di merci, uno sdoganario e una consegna — invece di cinque spedizioni separate da cinque fornitori differenti.
how_it_works:
  tagline: Come funziona
  title: Come funziona un ordine misto di modelli
  steps:
    - title: Scegli il tuo mix
      description: Scegli i modelli e le quantità per il tuo mercato — oppure usa il selezionatore qui sotto per disegnare una combinazione e vedere in tempo reale il numero di tavole e l'aggiornamento del valore totale.
    - title: Richiedi un preventivo
      description: Inviaci il mix di informazioni. Confermiamo le scorte attuali per ogni modello e ci offriamo prezzi unitari, oltre alle opzioni di trasporto espresso e marittimo verso il tuo paese.
    - title: Conferma l'ordine
      description: Approva il preventivo finale — modelli, quantità, spedizione, totale. Blocchiamo il magazzino e programmiamo la spedizione da Weihai.
    - title: Testiamo Ogni Tavola
      description: Ogni tavola nel tuo ordine misto viene testata al 100% a 15 PSI prima dell'imballaggio — lo stesso standard per ogni modello, sia che si tratti di un modello tuttofare per principianti sia di un'edizione artistica.
    - title: Una Consegna alla Tua Porta
      description: L'intero ordine misto viene spedito insieme — spedizione aerea espressa per ordini piccoli, spedizione consolidata via mare per 5–20 tavole — con tracciamento dalla porta alla porta.
