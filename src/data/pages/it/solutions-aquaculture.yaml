content_challenge:
  tagline: La sfida
  title: L'acquacoltura richiede<br />attrezzature robuste per l'acqua salata
  subtitle: "Gli allevamenti ittici, gli allevamenti di perle e gli allevamenti oceanici operano nell'ambiente marino chimicamente più aggressivo: esposizione prolungata all'acqua salata, residui di carburante e mangime e uso quotidiano continuo."
  paragraphs:
    - Le operazioni di acquacoltura funzionano 365 giorni all'anno in ambienti costieri esposti e in mare aperto. Le barche da lavoro utilizzate per l'ispezione delle gabbie, il trasporto del mangime, la manutenzione delle linee di perle e l'assistenza alle attrezzature affrontano l'immersione costante in acqua salata, l'esposizione ai UV e il contatto chimico con carburanti, mangime per pesci e trattamenti antivegetativi.
    - '**La corrosione è il nemico principale** — Le attrezzature marine standard si deteriorano rapidamente in queste condizioni. Motori fuoribordo, telai dei rimorchi e ferramenta dello scafo richiedono una sostituzione continua. Gli operatori hanno bisogno di barche costruite con materiali resistenti alla corrosione, in grado di resistere per anni in questo ambiente senza degradarsi.'
    - '**L''affidabilità quotidiana è fondamentale** — Una barca da lavoro guasta significa piani di alimentazione saltati, raccolti ritardati e costose perdite di produzione. Per le perliculture, un solo giorno di ispezione mancata può significare danni significativi al raccolto. Per gli allevamenti di pesci, un''alimentazione ritardata incide sui tassi di crescita e sulla redditività.'
    - I RIB per l'acquacoltura Paddle Board Overstock sono progettati con ferramenta resistente alla corrosione, tubi in Hypalon ad alta resistenza e scafi rinforzati pensati specificamente per le condizioni impegnative della piscicoltura, della coltivazione delle perle e dell'allevamento oceanico.
content_solution:
  tagline: La nostra soluzione
  title: RIB appositamente costruiti<br />Per il settore dell'acquacoltura
  subtitle: Ogni imbarcazione da lavoro per acquacoltura Paddle Board Overstock è progettata per resistere ad ambienti aggressivi di acqua salata offrendo allo stesso tempo prestazioni quotidiane affidabili.
  list:
    - Tubi in Hypalon di qualità marina — resistenza superiore a UV, acqua salata, carburanti e sostanze chimiche del mangime per pesci
    - Ferramenta in acciaio inox 316 su tutta l'imbarcazione — nessuna ruggine in caso di esposizione prolungata all'acqua salata
    - Parabordi striscianti rinforzati e protezione della chiglia per il contatto ripetuto con banchine e gabbie
    - Ponte autodrenante per lavaggio e drenaggio facili dopo il trasporto del mangime e le operazioni di raccolta
    - Configurazione con ponte piatto per il trasporto di sacchi di mangime, cassette di raccolta e attrezzature
    - Configurazioni fuoribordo da 15 a 60 CV — ottimizzate per il rapporto tra carico utile ed efficienza del carburante
    - Opzioni di colore dei tubi ad alta visibilità per un avvistamento agevole su ampie aree di allevamento
content_segments:
  tagline: Profili di acquacoltura
  title: Soluzioni per imbarcazioni da lavoro<br />Per tipo di acquacoltura
  subtitle: "Le diverse operazioni di acquacoltura hanno requisiti diversi per le imbarcazioni da lavoro: dai piccoli e agili gommoni per l'ispezione delle gabbie dei pesci alle stabili piattaforme di trasporto per la coltivazione delle perle e alle imbarcazioni da lavoro pesanti per l'allevamento oceanico."
  items:
    - title: Operazioni di piscicoltura
      subtitle: Ispezione delle gabbie, trasporto del mangime, supporto alla raccolta
      description: "Gli allevamenti ittici marini utilizzano gabbie in luoghi costieri e offshore esposti. Le barche da lavoro vengono utilizzate quotidianamente per l'ispezione delle reti delle gabbie, le operazioni di alimentazione, il supporto alla raccolta e la manutenzione delle attrezzature. La sfida principale è la corrosione: le barche sono costantemente esposte all’acqua salata, ai residui di mangime per pesci e al carburante. Una barca da lavoro affidabile è essenziale perché la mancata alimentazione o il raccolto ritardato influiscono direttamente sulla produzione e sulla redditività."
      features:
        - 'Pacchetto per ambienti aggressivi: ferramenta in acciaio inox 316, componenti in lega di qualità marina'
        - Layout con ponte piatto per il trasporto di sacchi di mangime e cassette di raccolta
        - Ponte autodrenante per un risciacquo facile dopo le operazioni
        - Tubi in Hypalon con rivestimento resistente alle sostanze chimiche per l'esposizione a mangime e carburanti
        - Parabordi striscianti rinforzati per il contatto frequente con gabbie e banchine
    - title: Operazioni di allevamento delle perle
      subtitle: Trasporto stabile per l'ispezione e la raccolta della linea di perle
      description: Gli allevamenti di perle necessitano di imbarcazioni da lavoro stabili e affidabili per il trasporto quotidiano tra le linee di perle, l’ispezione delle reti per le ostriche e la raccolta del raccolto. Queste operazioni si svolgono in località costiere remote con infrastrutture di manutenzione limitate. La barca deve essere sufficientemente stabile da consentire all'equipaggio di lavorare durante l'ispezione delle linee di perle, con un facile imbarco e un ampio spazio sul ponte per trasportare ostriche, reti e provviste raccolte. Affidabilità e facilità di manutenzione sono fondamentali nelle aziende agricole remote.
      features:
        - Progetto di scafo stabile per l'equipaggio in piedi durante l'ispezione delle linee di perle
        - Ponte piatto con superficie antiscivolo per movimenti sicuri dell'equipaggio
        - Murata bassa per un facile accesso alle reti delle ostriche e alla raccolta
        - Configurazione fuoribordo semplice per una manutenzione facile in loco
        - Pacchetto di tubi e ferramenta resistente alla corrosione per esposizione continua all'acqua salata
    - title: Allevamento oceanico e miglioramento marino
      subtitle: Trasporto di novellame, manutenzione gabbie, supporto monitoraggio
      description: Le operazioni di allevamento oceanico comportano il rilascio di stock giovani in ambienti marini gestiti, il monitoraggio della crescita e la manutenzione delle strutture di miglioramento. Le imbarcazioni da lavoro devono trasportare il novellame vivo in contenitori aerati, trasportare apparecchiature di monitoraggio e accedere a siti di rilascio costieri poco profondi. La progettazione dello scafo deve bilanciare la capacità di carico con un pescaggio ridotto per l'accesso alla spiaggia e all'estuario.
      features:
        - Spazio sul ponte per contenitori areati di trasporto del novellame e strumentazione di monitoraggio
        - Pescaggio ridotto per l'accesso ai siti di rilascio su spiagge ed estuari
        - Approdo facile sulla spiaggia — chiglia rinforzata e protezione della prua
        - Punti di fissaggio per l'elettronica di monitoraggio e le attrezzature di campionamento
        - Tubi in Hypalon ad alta resistenza per la durabilità in condizioni miste di sabbia e acqua di mare
