hero:
  tagline: Processo
  title: Processo di produzione
  subtitle: Dalla materia prima alla tavola pronta per il mare — ogni passaggio sotto il nostro controllo
  back_label: Torna alla Fabbrica
  back_link: /factory
intro: A differenza dei brand che esternalizzano la produzione a fabbriche terze, Paddle Board Overstock possiede e gestisce l'intera catena di produzione. Questa integrazione verticale ci permette di mantenere un rigoroso controllo qualità in ogni fase e garantire una qualità del prodotto costante lotto dopo lotto. Ecco come viene costruita una tavola nel nostro stabilimento.
steps:
  - step: '01'
    title: Ricezione e Ispezione del Materiale
    description: Ogni lotto in ingresso di tessuto PVC, nucleo drop-stitch, schiuma EVA e componenti hardware è ispezionato rispetto alle specifiche. I campioni di tessuto vengono testati per resistenza alla trazione, uniformità dello spessore e resistenza UV prima di essere rilasciati per la produzione. I materiali non conformi vengono messi in quarantena e restituiti.
    duration: 1–2 giorni
  - step: '02'
    title: Taglio Automatico PVC
    description: I tessuti approvati vengono posati sulla macchina da taglio automatica CNC e tagliati con precisione sub-millimetrica. Il nesting ottimizzato dal computer dispone i pannelli per ridurre al minimo gli sprechi — tipicamente sotto il 5%. I pannelli tagliati sono etichettati per modello di tavola e camera, quindi raggruppati per il trasferimento al reparto di saldatura.
    duration: 2–4 ore per kit tavola
  - step: '03'
    title: Saldatura e Sigillatura a Calore dei Tubolari
    description: I pannelli vengono fissati e uniti usando macchine di sigillatura a calore con saldatura ad aria calda a temperature controllate di 200–600 °C. Le cuciture principali sono rinforzate con saldatura dielettrica RF per giunti ermetici e ad alta resistenza. Le camere completate vengono gonfiate a 1,25× pressione di lavoro per una validazione della tenuta dell’aria di 30 minuti.
    duration: 1–2 giorni per tavola
  - step: '04'
    title: Arte del mazzo e EVA finitura
    description: 'Qui prendono forma le tavole della serie Art: pannelli di schiuma EVA tagliati con precisione vengono posati in modelli di deck completi, incollati e rifiniti a mano. Grip, comfort e durabilità — il look distintivo di ogni tavola serie Art.'
    duration: 1–2 giorni
  - step: '05'
    title: SUP Stampa e decorazioni
    description: Le grafiche del deck delle tavole SUP vengono applicate tramite stampa digitale per design a colori pieno di qualità fotografica, e serigrafia per loghi durevoli e pattern ripetitivi. Le stampe vengono essiccate e sigillate per resistenza a UV e all’abrasione.
    duration: 1–2 giorni
  - step: '06'
    title: Montaggio finale e montaggio
    description: 'Le tavole ricevono i componenti finali: le valvole vengono serrate e testate nel funzionamento, anelli a D, maniglie e scatole per pinne vengono montati, e l’attacco del leash viene fissato. Ogni tavola segue una checklist di assemblaggio a 100 punti con approvazione obbligatoria a ogni fase.'
    duration: 2–3 giorni
  - step: '07'
    title: Test e ispezioni di qualità
    description: 'Ogni tavola completata passa un controllo qualità obbligatorio: test di tenuta all’aria della camera, controllo di funzionamento dei sistemi, verifica della coppia di serraggio dei fissaggi e ispezione estetica. Le costruzioni personalizzate e i prototipi ricevono anche prove in acqua in mare per velocità, manovrabilità, stabilità e resistenza.'
    duration: 1–2 giorni
  - step: '08'
    title: Imballaggio e Spedizione
    description: Le tavole vengono sgonfiate, arrotolate e imballate in zaini da viaggio con pompa, pagaia, pinna, leash e kit di riparazione, quindi confezionate per spedizione corriere e freight. Ogni pacco è etichettato con modello, numero di serie e destinazione. Spediamo in 50+ paesi in tutto il mondo.
    duration: 1 giorno
