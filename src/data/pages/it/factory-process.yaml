  title: Scopri le nostre attrezzature e macchinari
  desc: Esplora l’equipaggiamento industriale dietro ogni tavola Paddle Board Overstock.
  label: Visualizza attrezzature →
  link: /factory/equipment
tldr:
  summary: Paddle Board Overstock segue un rigoroso processo di produzione a più fasi, dalla ispezione delle materie prime, al taglio, saldatura, decorazione del ponte e finitura EVA, assemblaggio, test di pressione a 1,25 volte la pressione nominale e controllo qualità finale. Il 100% delle tavole viene testato alla pressione, il 99,3% è privo di difetti.
  points:
    - 'Ispezione delle materie prime: test di trazione, lacerazione, UV'
    - Taglio automatico CNC e saldatura RF ad alta frequenza
    - Assemblaggio manuale della decorazione del ponte EVA con blocchi che non scoloriscono
    - Sostenimento della pressione di 1,25 volte la nominale per 24-48h su ogni unità
    - Ispezione finale a 100 punti su ogni tavola
