hero:
  tagline: Storie di successo
  title: Risultati concreti da<br />costruttori di business dell'acqua
  subtitle: Scopri come club, resort e imprenditori in tutto il mondo hanno creato attività redditizie per gli sport acquatici con l'attrezzatura e il supporto Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Storie di successo dei clienti Paddle Board Overstock
stories:
  - title: Come un resort mediterraneo ha costruito un'attività redditizia di noleggio SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: Resort sulla spiaggia a 5 stelle — Grecia
    problem: Il resort aveva bisogno di attività acquatiche premium per gli ospiti per aumentare i punteggi di soddisfazione e creare un nuovo flusso di entrate, ma mancavano attrezzature, infrastrutture di sicurezza e competenze del personale.
    solution: Paddle Board Overstock ha consegnato 50 tavole SUP personalizzate con i colori e il logo del resort, un sistema di sicurezza completo che comprende postazione di salvataggio e linee di boa, e un programma di formazione del personale di 3 giorni che copre la gestione delle attrezzature, l'istruzione degli ospiti e i protocolli di sicurezza.
    result:
      - Oltre 300 attività per ospiti prenotate a settimana già dal primo mese
      - 'Punteggi di soddisfazione degli ospiti per le attività acquatiche: 4,8/5'
      - 'Nuovi ricavi accessori annuali: 180.000 $'
      - Zero incidenti di sicurezza nella prima stagione operativa
      - Costo di sostituzione delle attrezzature ridotto del 40% rispetto al fornitore precedente
    quote:
      text: "Paddle Board Overstock non si è limitato a fornire tavole: ci ha aiutato a costruire un'esperienza completa per gli ospiti. Il nostro programma di sport acquatici è passato da zero a diventare il momento clou del resort in una sola stagione."
      author: Direttore Generale del Resort
    cta_text: Costruisci la tua soluzione resort
    cta_href: /solutions/resorts
  - title: Come una startup australiana ha costruito un marchio di acqua in 90 giorni
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Imprenditore per la prima volta — Australia
    problem: Un appassionato di outdoor voleva lanciare il proprio marchio di SUP per il mercato australiano ma non aveva esperienza nella produzione, nessun rapporto con i fornitori e un capitale limitato.
    solution: Il pacchetto di lancio del marchio Paddle Board Overstock prevedeva consulenza sulla selezione del prodotto, logo personalizzato e design dei colori, confezione per la vendita al dettaglio con marchio con cartellini, documentazione di certificazione CE e spedizione FOB a Sydney.
    result:
      - Prima spedizione di 200 tavole consegnata in 75 giorni dal primo contatto
      - Marchio lanciato su Shopify + Amazon AU entro 2 settimane dall'arrivo
      - Scorte iniziali esaurite in 45 giorni
      - 'Margine medio: 55% sul prezzo al dettaglio'
      - 'Secondo ordine: 500 unità piazzate entro 60 giorni dal lancio'
    quote:
      text: Avevo l’idea del marchio ma nessuna conoscenza della produzione. Paddle Board Overstock mi ha letteralmente tenuto per mano durante l'intero processo, dalla scelta del design giusto della tavola all'unboxing della mia prima spedizione. 90 giorni dal sogno alla consegna.
      author: Fondatore del marchio SUP australiano
    cta_text: Lancia il tuo marchio
    cta_href: /solutions/entrepreneurs
  - title: Come un beach club tailandese è passato da 10 a 80 tavole
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Club di sport acquatici — Tailandia
    problem: Un piccolo club di SUP sulla spiaggia a Phuket doveva passare da un'attività di hobby a un'attività di noleggio professionale al servizio dei turisti, ma non riusciva a trovare un fornitore di attrezzature affidabile con qualità e prezzi costanti.
    solution: A partire dal pacchetto Club Starter di Paddle Board Overstock (10 tavole, pagaie, equipaggiamento di sicurezza, branding), il club è cresciuto attraverso il programma Pacchetto Premium in 18 mesi.
    result:
      - Cresciuti da 10 a 80 tavole in 18 mesi con qualità e prezzi costanti
      - Aggiunti noleggi di kayak e pedalò dallo stesso fornitore
      - La branding personalizzata del club ha aumentato la notorietà del marchio tra i turisti
      - Costi di manutenzione ridotti del 60% rispetto alle attrezzature economiche precedenti
      - Oggi oltre 150 noleggi al giorno in alta stagione
    quote:
      text: 'Il pacchetto Club Starter è stato il punto di ingresso perfetto. Man mano che la nostra attività cresceva, Paddle Board Overstock cresceva con noi: stessa qualità, stessi prezzi, nessuna sorpresa.'
      author: Proprietario del club, Phuket
    cta_text: Avvia il tuo pacchetto club
    cta_href: /solutions/clubs
  - title: Come una catena di resort caraibici ha standardizzato gli sport acquatici in 5 proprietà
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Catena di resort – Caraibi
    problem: Una catena di resort di lusso con 5 proprietà necessitava di qualità e branding costanti delle attrezzature per sport acquatici in tutte le sedi, con approvvigionamento centralizzato e pianificazione della sostituzione stagionale.
    solution: Paddle Board Overstock ha consegnato una flotta multi-proprietà di 300 SUP e 100 kayak con marchio unificato, inventario condiviso di pezzi di ricambio e programma di sostituzione annuale con prezzi a volume.
    result:
      - Esperienza degli ospiti standardizzata in tutte le 5 strutture
      - Riduzione dei costi del 30% grazie a acquisti consolidati e prezzi per volume
      - Un magazzino centralizzato di ricambi ha ridotto i fermi dell'80%
      - Il programma annuale di rinnovo delle attrezzature ha eliminato la corsa di fine stagione
      - La partecipazione degli ospiti agli sport acquatici è aumentata del 45% su base annua
    cta_text: Progetta il tuo programma resort
    cta_href: /solutions/resorts
