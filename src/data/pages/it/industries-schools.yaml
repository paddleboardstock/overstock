        description: Ordini consolidati, prezzi all'ingrosso e gestione centralizzata dei pezzi di ricambio
      - title: Corso di Formazione per Istruttori
        description: Certificazione di movimentazione e manutenzione dell'attrezzatura per tutti gli istruttori
      - title: Co-branding
        description: Branding congiunto con franchising + opzioni di co-branding Paddle Board Overstock
      - title: Supporto all'espansione
        description: Consulenza sull'ampliamento, previsione delle apparecchiature e configurazione di nuove sedi
    cta_text: Discuti del piano di franchising
    cta_href: /contact
benefits:
  - title: Costruito per l'istruzione quotidiana
    description: Il PVC più spesso e le guide rinforzate resistono all'uso quotidiano da parte degli studenti, alle cadute sulla sabbia e agli atterraggi rocciosi.
    icon: tabler:shield
  - title: Piattaforme di apprendimento stabili
    description: Gli scafi più ampi e i rocker più piatti danno sicurezza ai principianti. Gli istruttori si concentrano sull'insegnamento, non sull'attrezzatura.
    icon: tabler:scale
  - title: Facile stoccaggio e trasporto
    description: Negozi di design gonfiabili in piccoli spazi. Le tavole sgonfie si adattano ai bagagliai standard dei veicoli per l'insegnamento mobile.
    icon: tabler:box-seam
  - title: Marchio personalizzato
    description: Loghi e colori della scuola su ogni tavola. Il tuo marchio, la tua identità, non attrezzatura generica a noleggio.
    icon: tabler:brush
content_segments:
  tagline: Profili scolastici
  title: Soluzioni per l'educazione agli sport acquatici<br />Per tipo di programma
  subtitle: "Le scuole di paddle, le accademie di surf, i programmi universitari e gli operatori in franchising affrontano ciascuno sfide operative diverse: dall'integrazione dei programmi di studio alla standardizzazione della flotta multi-sede. Configuriamo i pacchetti di attrezzature per adattarli al modello educativo."
  items:
    - title: Scuole indipendenti di SUP e Kayak
      subtitle: Centri di formazione gestiti dai proprietari
      description: Scuole di piccole e medie dimensioni gestite da istruttori proprietari che offrono lezioni di SUP, formazione in kayak e corsi di certificazione. Le attrezzature devono essere sufficientemente resistenti per l'uso didattico quotidiano, accessibili per il budget di una piccola impresa e sufficientemente versatili per servire gli studenti dai principianti agli intermedi in un'unica flotta.
      features:
        - Tavole SUP polivalenti stabili e kayak ricreativi per le lezioni per principianti
        - Tavole specifiche per istruttori con stabilità extra per l'insegnamento dall'acqua
        - Modelli di piani di lezione e guide di progressione delle competenze inclusi
        - Programma annuale di rinnovo delle attrezzature con sconti per il permutamento
    - title: Programmi ricreativi universitari e universitari
      subtitle: Flotte ricreative studentesche su larga scala
      description: I dipartimenti ricreativi dell'università gestiscono club di paddle, programmi di noleggio e corsi didattici come parte delle offerte ricreative del campus. Le attrezzature sono soggette a picchi di utilizzo durante i semestri, richiedono sistemi di check-in/check-out semplici e devono resistere a diversi livelli di abilità, dagli studenti alle prime armi ai canoisti avanzati.
      features:
        - Costruzione in PVC ad alta durabilità classificata per cicli d'uso istituzionali
        - Flotte codificate per colore in base al livello per una gestione semplice
        - Compatibilità con sistemi di tracciamento dell'inventario tramite RFID o adesivi
        - Prezzi all'ingrosso con ordini e termini di pagamento semestrali
    - title: Scuole e accademie di surf
      subtitle: Programmi di insegnamento del surf costiero
      description: "Scuole di surf che insegnano abilità di SUP surf, pagaia inclinata e surf kayak in ambienti oceanici. L'attrezzatura deve gestire le condizioni della zona di surf: resistenza agli urti, tolleranza alla sabbia e all'acqua salata e facile ricambio di risciacquo e restituzione tra le lezioni orarie."
      features:
        - Forme specifiche per il surf con bordi rinforzati e costruzione resistente agli urti
        - Opzioni con pinne morbide e leash arrotolate per la sicurezza degli studenti
        - Tessuto a risciacquo rapido che si asciuga tra le rotazioni delle lezioni
        - Programma di sostituzione della flotta con ispezione e rinnovo a fine stagione
    - title: Franchising e catene multisede
      subtitle: Attrezzature standardizzate in tutte le sedi
      description: "Operatori multisede che eseguono programmi di formazione standardizzati in più città o regioni. La coerenza della flotta tra le sedi è fondamentale: ogni studente dovrebbe avere la stessa esperienza con le attrezzature indipendentemente dalla sede in franchising che visita. L'ordinamento centralizzato, l'uniformità del marchio e il supporto alla scalabilità sono essenziali."
      features:
        - Specifiche di flotta identiche in tutte le sedi del franchising
        - Ordini centralizzati e consolidati con prezzi a volume
        - 'Opzioni di co-branding: marchio del franchising + co-branding Paddle Board Overstock'
        - 'Kit di apertura per la nuova sede: attrezzatura, segnaletica e inventario iniziale'
