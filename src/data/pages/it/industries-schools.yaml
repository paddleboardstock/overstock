        description: Tavole più larghe e lunghe con stabilità extra e deck in EVA antiscivolo per l'allenamento
      - title: Attrezzatura di sicurezza
        description: Giubbotti di salvataggio, guinzagli, fischietti e borse da lancio in colori coordinati
      - title: Stoccaggio e trasporto
        description: Rastrelliere impilabili per tavole, supporti imbottiti per kayak e carrelli per il trasporto
      - title: Supporto al curriculum
        description: Modelli di lezioni, liste di controllo sulla sicurezza e guide per il progresso delle competenze
    cta_text: Avvia il mio pacchetto scolastico
    cta_href: /contact
  - title: Pacchetto Scuola Premium
    subtitle: Per scuole consolidate e operatori multiprogramma
    badge: Best Value
