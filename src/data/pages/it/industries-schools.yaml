      - title: Flotta completa
        description: 25-50 tavole o kayak con flotta mista (all-around, touring, taglie giovanili)
      - title: Flotta istruttori
        description: 3-5 tavole istruttori specializzate con supporti per sistema audio integrati
      - title: Stazione di sicurezza
        description: Stazione centralizzata di dispositivi di sicurezza con giubbotti di salvataggio, radio, pronto soccorso e segnaletica
