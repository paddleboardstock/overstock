    body: 'Impianto di produzione di 12.000 m² con 200-300 lavoratori qualificati e oltre 14 ingegneri R&S. Sistema di gestione qualità certificato ISO 9001. Produzione annuale di 15.000 imbarcazioni gonfiabili che servono oltre 50 paesi.'
