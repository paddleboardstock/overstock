timeline:
  - year: '2012'
    title: Fondazione per la Produzione Marittima
    body: Paddle Board Overstock iniziò come officina specializzata di paddle board gonfiabili a Weihai, in Cina, dedicata all'artigianato marittimo e alla produzione di tavole. L'obiettivo iniziale era la costruzione di prodotti gonfiabili affidabili grazie all'esperienza pratica ingegneristica e alla disciplina manifatturiera.
  - year: '2015'
    title: Prime esportazioni
    body: Gli ordini iniziali di esportazione raggiunsero Giappone e Corea, segnando Paddle Board Overstock l'ingresso di 'N nei mercati internazionali. L'azienda iniziò a servire canoisti e appassionati di sport acquatici oltre la Cina.
  - year: '2018'
    title: Espansione della fabbrica
    body: Trasferito in uno stabilimento di produzione di 12.000 m². Aggiunta di linee di saldatura RF e drop-stitch capacità produttiva, permettendo una produzione su larga scala e sistemi di controllo qualità migliorati.
  - year: '2020'
    title: Centro R&S Istituito
    body: Aperto un centro dedicato di R&D con PVC laboratorio tessuto, serbatoio di test idrodinamico e studio di simulazione CAD/FEA. Lo sviluppo prodotto si è ampliato concentrandosi su costruzione leggera, maggiore durabilità e progettazione orientata all'utente.
  - year: '2022'
    title: Crescita globale
    body: Ampliata a 14 ingegneri R&S e 200+ operai. Le tavole raggiunsero pagaie in Europa, Americhe e Asia-Pacifico, spedendo in 50+ paesi.
  - year: '2024'
    title: Studio di Innovazione e Design
    body: Abbiamo lanciato uno studio completo di design e innovazione per nuove serie di tavole, dal concept alla produzione. Ampliato i nostri deck signature art-series e le piattaforme da touring.
  - year: '2026'
    title: Costruire il futuro dell'esplorazione idrica
    body: Oggi Paddle Board Overstock continua a SUP sviluppare tavole gonfiabili, attrezzature da pagaiata e soluzioni marine personalizzate — collegando persone e organizzazioni con le acque del mondo. 50+ paesi serviti, con una capacità annua di 15.000 unità.
content_founding:
  tagline: L'inizio
  title: Nato sul lungomare
  subtitle: "Paddle Board Overstock iniziò in un'officina costiera a Weihai con una sola tavola e una visione: costruire tavole gonfiabili per paddle in grado di affrontare reali condizioni marine."
  paragraphs:
    - Nel 2012, i nostri fondatori hanno notato un vuoto nel mercato — la maggior parte delle tavole gonfiabili era o economica ma inaffidabile, oppure di alta qualità ma proibitivamente costose. Credevano che ci fosse spazio per un produttore che offrisse sia qualità che valore.
    - Il primo scafo è stato costruito a mano, testato in acque locali e raffinato sulla base di veri feedback da pescatori e piccoli operatori commerciali. Quel ciclo di feedback — costruire, testare, ascoltare, migliorare — rimane al centro della nostra filosofia ingegneristica oggi.
    - Nel 2015, la voce si era diffusa oltre Weihai. Pagaiatori e negozi di sport acquatici in tutta l'Asia hanno iniziato a richiedere tavole. Quello che era iniziato come un laboratorio locale stava diventando un marchio globale.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Prima officina di produzione e produzione
content_growth:
  tagline: Crescita e innovazione
  title: Da officina a struttura da 12.000 m²
  subtitle: L'investimento continuo in persone, attrezzature e processi si è trasformato Paddle Board Overstock in un moderno stabilimento di produzione marina.
  paragraphs:
    - Con l'aumentare della domanda, è cresciuta anche la nostra struttura. Siamo passati da un piccolo laboratorio a uno stabilimento di 12.000 m² con linee di produzione dedicate a SUP tavole, accessori e dispositivi di sicurezza.
    - Abbiamo investito in CNC macchine da taglio, attrezzature per saldatura ad alta frequenza, linee di produzione a punto a caduta e impianti di collaudo completi — permettendoci di controllare ogni aspetto della qualità produttiva.
    - Oggi, il nostro team di 200-300 persone comprende ingegneri navali, scienziati dei materiali, specialisti del controllo qualità e artigiani qualificati — molti dei quali sono con Paddle Board Overstock loro fin dai primi tempi.
founder:
  tagline: Incontra il Fondatore
  title: Costruita da un uomo d'acqua
  subtitle: Il fondatore David Chen unisce competenze manifatturiere e una passione di una vita per gli sport acquatici — una combinazione che definisce il Paddle Board Overstock modo in cui si approccia lo sviluppo dei prodotti.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fondatore di Paddle Board Overstock
  story:
    - David Chen è cresciuto sulla costa di Weihai, dove il mare non era una meta di vacanza ma uno stile di vita. Ha trascorso la sua giovinezza remando, navigando e pescando nel Mar Giallo — esperienze che gli hanno dato una comprensione intuitiva di ciò che le tavole da pagaia devono resistere.
    - Prima di Paddle Board Overstock fondare, David ha trascorso un decennio nella produzione marittima, lavorando in produzione, qualità e commercio internazionale. Ha guidato programmi di produzione e qualità per i mercati europeo e nordamericano, apprendendo in prima persona le aspettative dei pagaiatori di tutto il mondo.
    - "Nel 2012 ha fondato Paddle Board Overstock con una missione semplice: costruire tavole gonfiabili per paddle board che avrebbe confidato con la propria famiglia sull'acqua. Quello standard personale — userei questo? — rimane il test finale per ogni prodotto che esce dalla fabbrica."
    - Oggi, David guida la strategia di prodotto e supervisiona il team R&S, esaminando personalmente nuovi progetti e testando prototipi nelle acque al largo di Weihai. Crede che i grandi prodotti derivino dalla comprensione sia dell'ingegneria che dell'esperienza.
philosophy:
  tagline: Filosofia del marchio
  title: Libertà ingegneristica sull'acqua
  body: La libertà sull'acqua non riguarda solo il movimento. Rappresenta la scoperta di nuovi luoghi, la creazione di esperienze all'aperto, il collegamento delle persone con la natura e il favore di missioni professionali. L'ingegneria rende possibile questa libertà.
  pillars:
    - title: Prima l'affidabilità
      body: Gli ambienti acquatici richiedono fiducia.Paddle Board Overstock I prodotti sono progettati attorno alla stabilità, durata, sicurezza e prestazioni costanti.
    - title: Progettazione Centrata sull'Uomo
      body: I prodotti dovrebbero servire le persone, non la tecnologia. Ogni decisione di design inizia con la comprensione di come le persone usano i loro tavoli, dove esplorano e quali sfide affrontano.
    - title: Esplorazione Accessibile
      body: L'acqua non dovrebbe appartenere solo agli esperti.Paddle Board Overstock Crea attrezzature che permettono a più persone di vivere in sicurezza fiumi, laghi, oceani e ambienti costieri.
    - title: Innovazione continua
      body: L'innovazione non significa solo creare nuovi prodotti. Significa migliorare ogni dettaglio — materiali, strutture, produzione ed esperienza dell'utente.
engineeringDna:
  tagline: DNA Ingegneristico
  title: Come Paddle Board Overstock Crea Prodotti
  areas:
    - title: Scienza dei materiali
      body: Paddle Board Overstock si concentra sulla selezione dei materiali appropriati per diversi ambienti marini. Le considerazioni principali includono resistenza all'abrasione, resistenza a UV, stabilità alla pressione e durata a lungo termine.
      items:
        - Resistenza all'abrasione
        - Resistenza ai raggi UV
        - Stabilità alla Pressione
        - Durata a Lungo Termine
    - title: Ingegneria strutturale
      body: Le tavole da paddle gonfiabili richiedono un equilibrio preciso tra rigidità, peso, portabilità e stabilità. L'ingegneria di Paddle Board Overstock si concentra sull'ottimizzazione di questi fattori attraverso la tecnologia di base drop-stitch e la costruzione avanzata delle cuciture.
      items:
        - Rigidità
        - Ottimizzazione del Peso
        - Portabilità
        - Stabilità
    - title: Precisione nella Produzione
      body: 'Ogni prodotto attraversa processi controllati: preparazione dei materiali, taglio di precisione, saldatura e incollaggio, assemblaggio, controllo qualità e verifica delle prestazioni.'
      items:
        - Preparazione dei Materiali
        - Taglio di Precisione
        - Saldatura e Bonding
        - Assemblaggio e Controllo Qualità
    - title: Ingegneria per Scenari d'Uso
      body: I prodotti sono sviluppati attorno a reali applicazioni di paddle — ricreazione, avventura, famiglia e turismo — garantendo che ogni design soddisfi le specifiche esigenze dell'ambiente previsto.
      items:
        - Ricreazione
        - Avventura
        - Famiglia
        - Turismo
