  title: Paddle Board Overstock — Ingegneria della libertà sull'acqua
  subtitle: "Da un'officina costiera a un produttore marino globale — il nostro percorso si basa su una convinzione ostinata: le tavole da paddle dovrebbero essere progettate come se contassero, perché è così."
