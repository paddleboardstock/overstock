  quality:
    title: Impegno di Qualità
    body: Dall'ispezione dei materiali ai test finali, Paddle Board Overstock mantiene processi di qualità sistematici per fornire prodotti marini affidabili. Ogni unità viene sottoposta a test di pressione, ispezione delle giunture e verifica delle prestazioni prima della spedizione.
    items:
      - Tasso di spedizione privo di difetti del 99,3%
      - 100% testato a pressione con una valutazione PSI1,25x
      - Garanzia di 2 anni su ogni scheda
  global:
    title: Presenza globale
    body: Paddle Board Overstock spiacciono direttamente ai pagaiatori in 50+ paesi in Europa, Asia-Pacifico, Americhe, Medio Oriente e Africa.
