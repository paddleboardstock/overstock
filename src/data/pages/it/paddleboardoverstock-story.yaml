hero:
  tagline: La Nostra Storia
  title: "Paddle Board Overstock — Ingegneria della Libertà sull'Acqua"
  subtitle: "Da un'officina costiera a un produttore marino globale — il nostro viaggio si basa sulla ferma convinzione che le imbarcazioni dovrebbero essere progettate come se contassero, perché contano."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabbrica Paddle Board Overstock e impianto di produzione marina a Qingdao

