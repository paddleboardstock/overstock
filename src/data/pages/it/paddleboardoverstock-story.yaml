  quality:
    title: 'Impegno per la qualità'
    body: "Dall'ispezione dei materiali ai test finali, Paddle Board Overstock mantiene processi di qualità sistematici per fornire prodotti marini affidabili. Ogni unità viene sottoposta a test di pressione, ispezione delle giunture e verifica delle prestazioni prima della spedizione."
    items:
      - 'CE Certified — 64 modelli soddisfano gli standard di sicurezza europei'
      - 'ISO 9001:2015 — Sistema di gestione qualità certificato'
      - 'UKCA Marked — Conformità per il mercato britannico'
  global:
    title: 'Presenza globale'
    body: 'Paddle Board Overstock serve clienti in molteplici mercati globali, supportando distributori, marchi outdoor e utenti marini professionali in oltre 50 paesi in Europa, Asia-Pacifico, Americhe, Medio Oriente e Africa.'

