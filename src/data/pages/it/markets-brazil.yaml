hero:
  tagline: Brasile
  title: SUP Schede all'ingrosso per<br />Rivenditori brasiliani
  subtitle: Per negozi e operatori da Rio e Florianópolis fino alla costa nord-est — nuove tavole paddle in eccesso da 5 unità, modelli misti, spedite dalla Cina.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tavole di scambio SUP per rivenditori di spiaggia brasiliani e scuole di paddle
direct_answer: Paddle Board Overstock fornisce tavole gonfiabili nuove di zecca a scorte di scorta SUP alle aziende brasiliane — scuole di paddle e negozi a Rio de Janeiro, Florianópolis e sulla costa nord-est, operatori di noleggio e venditori online. Gli ordini all'ingrosso partono da 5 tavole con modelli misti in un'unica spedizione, inviate da Weihai, Cina, tramite trasporto aereo espresso o trasporto marittimo consolidato. Ogni tavola è testata al 100% a pressione e coperta dalla garanzia di 2 anni SUP .
tldr_points:
  - All'ingrosso da 5 schede — modelli misti, prezzati in base alla quantità totale
  - Al servizio della cultura balneare brasiliana da Rio al Nordest
  - Trasporto aereo espresso o maritimo consolidato da Weihai, Cina
  - 100% testata a pressione, garanzia di 2 SUP anni su ogni scheda
overview_section:
  tagline: Panoramica del mercato
  title: Il mercato brasiliano SUP
  paragraphs:
    - Il Brasile è uno dei mercati di stand-up paddle più naturali al mondo. La cultura della spiaggia è cultura nazionale — dalla scena dello stand up paddle sulle lagune di Rio e il mix di surf e acque piatte di Florianópolis fino alle acque calde e calme del Nordest in Ceará, Pernambuco e Bahia. Le scuole di pagaia, i noleggio di lagune e le comunità di surf e a valle SUP attirano tutti da una popolazione enorme e appassionata di sport.
    - Gli acquirenti brasiliani sono tipicamente aziende gestite da proprietari — stand di noleggio lungo la laguna, scuole sulla spiaggia, negozi di surf SUP che aggiungono file e venditori e-commerce nazionali in crescita. Ordinano in piccoli lotti (5–20 tavole) e si preoccupano della durata per l'uso quotidiano e della competitività dei prezzi in un mercato con costi di importazione significativi.
  customer_types:
    - title: Scuole Lagoon e Beach
      description: Scuole e gestori di affitti sulle lagune di Rio e sulle spiagge di acque calme del Nordest offrono lezioni e affitti a ore.
    - title: Negozi di surf
      description: Rivenditori di surf affermati aggiungono acqua calma e visite SUP turistiche per la comunità locale di pagaiatori.
    - title: Venditori online
      description: Venditori di e-commerce nazionali che importano SUP stock per servire l'enorme mercato interno brasiliano.
shipping_section:
  title: Nave per il Brasile
  paragraphs:
    - Gli ordini vengono spediti da Weihai, Cina. Il trasporto aereo espresso trasporta campioni e 1–3 ordini di imbarcatura nei principali aeroporti del Brasile; il trasporto marittimo consolidato serve da 5 a 20 ordini all'ingrosso tramite porti come Santos e altri porti costieri. Le stime di transito per la destinazione sono incluse nel preventivo.
    - Forniamo la fattura commerciale e la lista di imballaggio necessarie per la sdogana, con codici HS corretti e valori dichiarati. Dazi e tasse all'importazione sono dovuti secondo le norme brasiliane.
  customs_note: Le tasse d'importazione brasiliane sugli articoli sportivi sono significative e variano in base alla classificazione dei prodotti. Conferma il dazio attuale, l'IVA e eventuali oneri a livello statale con il tuo agente doganale (despachante) prima di ordinare — forniamo documentazione completa ma non includiamo le tasse di importazione nei preventivi di trasporto.
faq_section:
  title: FAQ sul Brasile
  items:
    - q: Preventivi e supporto possono essere gestiti in portoghese?
      a: Sì — lavoriamo con acquirenti di lingua portoghese. Chiedi nella tua richiesta e ci occuperemo del preventivo e dell'ordine in portoghese.
    - q: Le tasse di importazione del Brasile sono incluse nei vostri prezzi?
      a: No. Dazi d'importazione, IVA e tasse a livello statale sono responsabilità dell'importatore secondo le norme brasiliane. Facciamo un preventivo a bordo e il trasporto in modo chiaro e separato, e forniamo la documentazione di cui il tuo despachante ha bisogno.
    - q: Com'è un primo ordine per una scuola di spiaggia brasiliana?
      a: 'Tipicamente 5–15 tavole: modelli resistenti e versatili per lezioni e noleggio orario, più un paio di edizioni premium per esposizione al dettaglio. Modelli misti in una spedizione, prezzo calcolato in base alla quantità totale.'
    - q: Spedite via mare in Brasile?
      a: Sì — il trasporto marittimo consolidato serve i porti brasiliani per ordini all'ingrosso di 5–20 tavole, quotato per destinazione. L'aereo espresso è disponibile per campioni e piccoli ordini urgenti.
