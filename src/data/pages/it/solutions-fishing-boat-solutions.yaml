content_challenge:
  tagline: La sfida
  title: 'I Gommoni da Pesca Hanno Bisogno<br />di Stabilità, Autonomia e Durata'
  subtitle: 'Che gestiate pescherecci commerciali, una flotta cooperativa o charter di pesca, la vostra imbarcazione deve garantire prestazioni affidabili ogni giorno.'
  paragraphs:
    - 'Le barche da pesca necessitano di piattaforme stabili per lavorare le lenze, gestire il pescato e muoversi in sicurezza sul ponte. I gommoni e i RIB offrono stabilità intrinseca grazie al design dei tubolari, un vantaggio significativo rispetto agli scafi rigidi di lunghezza simile.'
    - "L'efficienza nei consumi è fondamentale per le attività di pesca in cui i costi operativi incidono direttamente sulla redditività. I RIB e i gommoni sono più leggeri delle barche rigide equivalenti, richiedono meno potenza e consumano meno carburante, un fattore decisivo per gli operatori commerciali che navigano ogni giorno e per le cooperative che gestiscono i budget di flotta."
    - "La durata in ambiente marino è essenziale. Acqua salata, esposizione ai raggi UV e uso costante richiedono materiali in grado di resistere a condizioni difficili senza deteriorarsi. Per operatori commerciali e cooperative, l'affidabilità incide direttamente sul reddito: un'imbarcazione guasta significa giornate di pesca perse."
    - 'Le configurazioni da pesca Paddle Board Overstock includono portacanne, ecoscandagli, vaschette per esche, vasi per il pesce vivo e soluzioni per la movimentazione del carico, progettate per applicazioni di pesca serie in ambito commerciale, cooperativo e ricreativo.'
content_solution:
  tagline: La nostra soluzione
  title: 'Configurazioni Pronte per la Pesca'
  subtitle: 'Ogni gommone da pesca Paddle Board Overstock può essere configurato per la vostra applicazione di pesca specifica.'
  list:
    - "Montaggio portacanne: installato in fabbrica o pronto per l'installazione aftermarket"
    - 'Piatto di montaggio per ecoscandaglio/GPS in posizione console'
    - 'Opzioni vaschetta per esche o vaso per il pesce vivo per operatori charter e commerciali'
    - 'Configurazioni frigo/stoccaggio per la gestione del pescato'
    - "Scafo a V profondo per capacità offshore: stabile all'ormeggio, confortevole in velocità"
    - 'Opzioni tubolari in PVC o Hypalon: Hypalon per esposizione prolungata ai raggi UV'
    - "Fuoribordo da 15 CV a 115 CV a seconda del modello e dell'applicazione"
content_segments:
  tagline: Profili di pesca
  title: 'Soluzioni di Gommoni da Pesca<br />Per Tipo di Operatore'
  subtitle: 'Dalla pesca sportiva costiera alla pesca commerciale con palangari: attività di pesca diverse richiedono configurazioni di scafo, gamme di potenza e allestimenti di coperta diversi. Adattiamo ogni imbarcazione alla pesca, alle acque e allo stile di lavoro.'
  items:
    - title: Aziende di Pesca Commerciale
      subtitle: 'Imbarcazioni da lavoro per operazioni quotidiane, gestione delle reti, trasporto del pescato'
      description: "Le aziende di pesca commerciale impiegano imbarcazioni da lavoro per calare e ritirare le reti, la gestione delle nasse, la pesca con palangari e il trasporto del pescato. Queste barche lavorano ogni giorno in acqua salata e devono resistere a carichi pesanti, lavoro costante in coperta e lunghe ore di navigazione. L'efficienza nei consumi e la bassa manutenzione sono fondamentali per la redditività della flotta. L'imbarcazione deve offrire piattaforme di lavoro stabili all'equipaggio per gestire attrezzature e pescato in condizioni di mare variabili."
      features:
        - "Coperta piatta per la gestione delle reti, l'impilamento delle nasse e lo stoccaggio del pesce"
        - 'Fuoribordo 40-115 CV efficiente per bassi costi operativi giornalieri'
        - "Tubolari Hypalon rinforzati per resistenza all'abrasione nell'uso quotidiano"
        - 'Listelli paraurti rinforzati per i frequenti contatti con pontili e imbarcazioni'
        - 'Coperta autosvuotante per un facile lavaggio dopo le operazioni'
        - 'Prezzi flotta e specifiche uniformi per operatori con più imbarcazioni'
    - title: Operatori Charter di Pesca
      subtitle: 'Comfort per più passeggeri, gestione del pescato, certificazione di sicurezza'
      description: "Operatori che gestiscono charter di pesca a mezza giornata e giornata intera, dalla pesca sui reef costieri alla pesca a fondo in acque profonde. La vostra barca ha bisogno di posti passeggeri con certificazioni di sicurezza, ampio spazio in coperta per più pescatori e vasi integrati per mantenere fresche esche e pescato per tutta l'uscita. Il comfort degli ospiti influisce direttamente sulle recensioni, sulle prenotazioni ripetute e sulle valutazioni online."
      features:
        - 'Guida da console con sedili a secchiello ammortizzati'
        - 'Portacanne installati in fabbrica (da 4 a 8 posizioni)'
        - 'Fuoribordo 60-115 CV per velocità di crociera offshore'
        - 'Certificazione CE categoria C o B per operazioni commerciali con passeggeri'
        - 'Bimini o T-top come protezione solare per il comfort degli ospiti nelle uscite prolungate'
    - title: Pescatori Artigianali e Commerciali su Piccola Scala
      subtitle: Imbarcazioni da lavoro affidabili per il sostentamento quotidiano
      description: 'Pescatori indipendenti che contano sulla propria barca come principale fonte di reddito: calano reti, controllano le nasse o pescano con lenza a mano vicino alla costa. La priorità è il risparmio di carburante, la manutenzione semplice da eseguire da soli e una barca che regga carichi moderati di pescato e attrezzature senza sacrificare la stabilità.'
      features:
        - 'Fuoribordo 15-40 CV efficiente per bassi costi operativi'
        - "Tubolari Hypalon CSM per maggiore resistenza ai raggi UV e all'abrasione"
        - 'Coperta piatta per la gestione delle reti e lo stoccaggio del pesce'
        - 'Facile arenaggio in spiaggia con protezione di chiglia gonfiabile'
    - title: Cooperative di Pesca
      subtitle: 'Raccolta del pescato, trasporto dei soci, distribuzione delle forniture'
      description: "Le cooperative di pesca gestiscono flotte comunitarie per raccogliere il pescato dai pescatori soci, trasportare forniture alle comunità di pesca remote e distribuire il raccolto ai mercati. Queste imbarcazioni da lavoro richiedono un'elevata capacità di carico utile, un funzionamento quotidiano affidabile e una manutenzione semplice in località remote. Le cooperative operano spesso in regioni in via di sviluppo dove la disponibilità di ricambi e l'accesso all'assistenza sono limitati, rendendo essenziali configurazioni fuoribordo semplici e una costruzione robusta."
      features:
        - 'Elevata capacità di carico utile per il trasporto di pescato e forniture'
        - "Configurazione fuoribordo semplice per un'assistenza facile sul posto"
        - 'Costruzione robusta in PVC o Hypalon per flessibilità di budget'
        - 'Coperta piatta con punti di ancoraggio per fissare il carico'
        - 'Funzionamento efficiente che minimizza i costi operativi della cooperativa'
    - title: Appassionati di Pesca Sportiva d'Altura
      subtitle: Prestazioni e stile per pescatori esigenti
      description: 'Pescatori esperti che cercano una piattaforma di pesca capace: velocità verso fondali lontani, posizioni stabili per il combattimento in piedi e finiture premium. La barca deve sentirsi a casa sia percorrendo due miglia fino a un reef sia esplorando remote acque interne di estuario.'
      features:
        - 'Scafo RIB a V profondo per una navigazione confortevole con mare mosso'
        - 'Piatto di montaggio ecoscandaglio/GPS precablato in console'
        - 'Vaschetta per esche e frigo integrati nel modulo del sedile posteriore'
        - 'Opzioni colore EVA personalizzate in abbinamento alla grafica di barca e tubolari'
    - title: Guide di Pesca e Operatori di Ecoturismo
      subtitle: Esperienze di pesca guidata per pescatori in visita
      description: "Guide che portano piccoli gruppi di pescatori visitatori verso spot di pesca produttivi, spesso combinando la pesca con elementi di ecoturismo come l'osservazione degli uccelli o l'esplorazione delle mangrovie. La barca deve navigare asciutta e confortevole per ospiti non abituati alle piccole imbarcazioni, con facile imbarco e opzioni di ombreggiamento."
      features:
        - 'Punti di montaggio per Bimini o T-top installati in fabbrica'
        - 'Scaletta di poppa a entrata morbida per un facile reimbarco'
        - 'Fuoribordo 4 tempi silenzioso per ridurre al minimo i disturbi'
        - 'Scomparti di stivaggio asciutti per telefoni, portafogli e fotocamere degli ospiti'

