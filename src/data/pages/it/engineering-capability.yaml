content_capability:
  tagline: Capacità ingegneristica
  title: Cosa offre il nostro<br />team tecnico
  subtitle: "L'ingegneria Paddle Board Overstock copre l'intero ciclo di vita del prodotto: dalla ricerca di mercato e progettazione concettuale fino alla prototipazione, ai test e alla produzione di massa."
  items:
    - title: Progettazione industriale
      description: Il nostro team di progettazione industriale lavora sulla base delle esigenze dei clienti, delle ricerche di mercato e dell'analisi della concorrenza per sviluppare concetti di prodotto che bilanciano estetica, funzionalità e producibilità. Produciamo schizzi 2D, rendering 3D e documenti di specifiche per la revisione del cliente prima di impegnarci nella realizzazione degli strumenti.
      features:
        - Sviluppo di concept e studi di fattibilità
        - Disegni di progettazione 2D e render 3D
        - Selezione e specificazione dei materiali
        - Analisi del design orientato alla produzione (DFM)
        - Valutazione ergonomica e della sicurezza
    - title: Ingegneria strutturale
      description: "I nostri ingegneri strutturali sono specializzati nell'architettura dei gommoni: progettazione dello scafo, configurazione della camera dei tubi, ingegneria del nucleo con punto a goccia e distribuzione del carico. Ogni progetto viene analizzato per quanto riguarda l'integrità strutturale, l'ottimizzazione del peso e la conformità agli standard pertinenti (CE, ISO, AS)."
      features:
        - Progettazione di scafi in vetroresina deep-V con angoli di deadrise calcolati
        - Configurazione multicomparto dei tubi per sicurezza e galleggiabilità
        - Specifica dell'anima drop-stitch e ottimizzazione della densità
        - Analisi agli elementi finiti per componenti portanti
        - Calcoli di distribuzione dei pesi e stabilità
    - title: Modellazione 3D e CAD
      description: Tutti i progetti dei prodotti vengono sviluppati in CAD 3D prima che inizi la realizzazione del prototipo. I nostri ingegneri utilizzano SolidWorks e Rhino 3D per la modellazione dei prodotti, consentendo ai clienti di rivedere ogni dettaglio, dal profilo dei tubi al layout della console, prima di impegnarsi nella produzione.
      features:
        - Modellazione CAD 3D completa in SolidWorks e Rhino 3D
        - Render fotorealistici per presentazioni ai clienti
        - Pacchetti di disegni tecnici per la produzione
        - Progettazione di stampi e attrezzature dai modelli 3D
        - Trasferimento diretto dei dati da CAD a CNC per tagli di precisione
    - title: Prototipazione e test
      description: 'Prima della produzione in serie, ogni nuovo prodotto passa attraverso la fase di prototipo. Costruiamo prototipi funzionali per la valutazione del cliente, quindi li sottoponiamo al nostro protocollo di test completo: test di pressione, test di stabilità, test di carico e prove in acqua. Le iterazioni di progettazione nella fase di prototipo sono rapide ed economiche.'
      features:
        - Attrezzature rapide per prototipi (tempo di consegna 15-20 giorni)
        - Prototipo funzionale per la valutazione in condizioni reali
        - Protocollo di collaudo completo prima dell'approvazione della produzione
        - Raffinamento iterativo del progetto in base ai risultati dei test
        - Milestone di approvazione del cliente prima degli stampi di produzione
    - title: Integrazione di accessori personalizzati
      description: "Molti progetti OEM richiedono l'integrazione di accessori forniti dal cliente o da terze parti: console personalizzate, sedili specializzati, sistemi elettronici, supporti per attrezzatura subacquea o elementi di branding. Il nostro team di ingegneri gestisce la progettazione dell'integrazione, l'adattamento strutturale e la convalida della qualità di tutti gli accessori."
      features:
        - Progettazione di consolle e layout del cruscotto
        - Integrazione di sedute e tappezzeria personalizzate
        - Progettazione e cablaggio dei sistemi elettronici
        - Sistemi di ancoraggio per attrezzature da sub e salvataggio
        - Specifiche di applicazione di branding e grafica
content_process:
  tagline: Processo di sviluppo
  title: Dal concetto<br />alla produzione
  subtitle: Il nostro processo di sviluppo prodotto segue un flusso di lavoro strutturato in 6 fasi progettato per ridurre al minimo i rischi, comprimere le tempistiche e garantire la preparazione alla produzione fin dal primo giorno.
  stages:
    - stage: '01'
      title: Requisiti e ricerca
      duration: 1-2 settimane
      description: Collaboriamo con il cliente per definire le specifiche del prodotto, i requisiti del mercato di riferimento, le esigenze di conformità normativa e gli obiettivi commerciali. Questa fase produce un documento sui requisiti del prodotto (PRD) che guida tutto il lavoro successivo.
      deliverables: PRD, analisi di mercato, benchmark competitivo, stima preliminare dei costi
    - stage: '02'
      title: Progettazione concettuale
      duration: 2-3 settimane
      description: Il team di progettazione industriale sviluppa concetti di prodotto basati sul PRD. Vengono presentate molteplici opzioni di progettazione con rendering 3D, consigli sui materiali e valutazioni ingegneristiche iniziali. Il cliente seleziona la direzione per lo sviluppo dettagliato.
      deliverables: Rendering concettuali 3D, specifiche dei materiali, logica di progettazione, distinta base preliminare
    - stage: '03'
      title: Ingegneria dettagliata
      duration: 2-4 settimane
      description: 'Il concetto selezionato è completamente ingegnerizzato: modellazione CAD 3D, analisi strutturale, configurazione dei tubi, progettazione dello scafo, integrazione degli accessori e documentazione di produzione. Tutte le dimensioni, i materiali e i processi sono specificati per gli utensili.'
      deliverables: Modello CAD 3D completo, disegni tecnici, distinta base finale, specifiche degli utensili, piano di controllo qualità
    - stage: '04'
      title: Prototipazione
      duration: 2-3 settimane
      description: Vengono prodotti gli strumenti prototipo e costruiti campioni funzionali. Il cliente esamina il prototipo rispetto alle specifiche PRD. I test vengono condotti secondo il protocollo concordato. Le modifiche alla progettazione vengono apportate in base al feedback prima dell'attrezzatura di produzione.
      deliverables: Prototipo funzionale, rapporto di prova, registro di revisione del progetto, documento di approvazione del cliente
    - stage: '05'
      title: Attrezzature di produzione
      duration: 2-3 settimane
      description: 'Una volta approvato il prototipo, vengono commissionate le attrezzature di produzione: stampi, maschere di saldatura, programmi di taglio, attrezzature di assemblaggio. La documentazione QC e i criteri di ispezione sono finalizzati. Esecuzione di prova condotta per la convalida del processo.'
      deliverables: Strumenti di produzione, documentazione del processo, piano di ispezione QC, rapporto di prova
    - stage: '06'
      title: Produzione di massa e controllo qualità
      duration: In corso
      description: La produzione completa inizia con il controllo di qualità in-process in ogni fase. I primi articoli vengono ispezionati e approvati prima del rilascio del lotto. Monitoraggio continuo della qualità, tracciamento dei difetti e miglioramento continuo durante tutto il ciclo di vita della produzione.
      deliverables: Programma di produzione, report QC, record di tracciabilità dei lotti, documentazione di spedizione
content_customization:
  tagline: Opzioni di personalizzazione
  title: Cosa può essere<br />personalizzato
  subtitle: Quasi ogni aspetto dei nostri prodotti può essere personalizzato per soddisfare le esigenze del cliente. Di seguito sono riportate le categorie di personalizzazione più comuni.
  columns: 3
  items:
    - title: Scafo e struttura
      description: Lunghezza dello scafo, larghezza della trave, angolo di deadrise, diametro del tubo, configurazione della camera e qualità del materiale personalizzati.
      icon: tabler:sailboat
    - title: Colori e grafica
      description: Colore del tubo (PVC/Hypalon), colore del gelcoat dello scafo, colore della console, grafica del ponte, posizionamento del logo e design della confezione.
      icon: tabler:palette
    - title: Console e controlli
      description: Console centrale, console laterale o timoneria. Disposizione personalizzata del quadro strumenti, posizionamento degli interruttori e posizione del timone.
      icon: tabler:steering-wheel
    - title: Sedute e tappezzeria
      description: Sedili da fantino, panche, rivestimenti di lusso, cuciture in tinta, configurazioni pieghevoli o rimovibili.
      icon: tabler:armchair
    - title: Accessori e attrezzature
      description: Scale per immersioni, portabottiglie, piloni di traino, T-top, bimini top, sistemi audio, elettronica di navigazione e dotazioni di sicurezza.
      icon: tabler:backpack
    - title: Imballaggio e marchio
      description: Imballaggi per la vendita al dettaglio personalizzati, scatole con etichetta privata, cartoni di spedizione con marchi, cartellini e manuali utente nella lingua del cliente.
      icon: tabler:box
content_industries:
  tagline: Applicazioni industriali
  title: Soluzioni ingegneristiche<br />per settore
  subtitle: Il nostro team di ingegneri ha sviluppato prodotti per un'ampia gamma di applicazioni marine, ciascuna con requisiti e criteri di prestazione distinti.
  columns: 3
  items:
    - title: Operazioni subacquee
      description: Ponti rinforzati, integrazione di scale per immersione, sistemi di stoccaggio di bombole e piattaforme stabili per centri di immersione commerciali in tutto il mondo.
      icon: tabler:lifebuoy
    - title: Salvataggio ed emergenza
      description: Progettazioni di scafi ad alta velocità, ponti autosvuotanti, sistemi di montaggio di apparecchiature e configurazioni di sicurezza multicamera per operazioni SAR.
      icon: tabler:alert-triangle
    - title: Turismo marino
      description: Disposizioni per il comfort dei passeggeri, integrazione di parasole, sistemi di imbarco e configurazioni a basso consumo di carburante per le operazioni di trasferimento sull'isola.
      icon: tabler:beach
    - title: Tender per yacht
      description: Design compatti per lo stoccaggio della gru, opzioni di finitura di lusso, colori coordinati della nave madre e caratteristiche di traino ad alte prestazioni.
      icon: tabler:sailboat
    - title: Pesca e acquacoltura
      description: Configurazioni a ponte piatto, integrazione della vasca del vivo, disposizioni dei portacanne, hardware resistente alla corrosione per l'esposizione continua all'acqua salata.
      icon: tabler:fish
    - title: Portuale e industriale
      description: Rinforzo dello scafo per carichi pesanti, layout di imbarcazioni da lavoro, configurazioni di trasporto del personale e integrazione di attrezzature per operazioni offshore.
      icon: tabler:ship
