features3_cases:
  tagline: Casi in evidenza
  title: Soluzioni personalizzate<br />Per sfide reali
  isBeforeContent: false
  columns: 3
  items:
    - title: Aggiornamento delle operazioni giornaliere del Bali Diving Center
      customer: Centro immersioni Blue Ocean
      country: Indonesia
      industry: Centro immersioni commerciale
      challenge: Il Blue Ocean Diving Center di Bali gestiva una vecchia barca per immersioni in fibra di vetro con spazio limitato sul ponte, difficile imbarco per sub e manutenzione elevata in condizioni di acqua salata tropicale. Il carico dell'attrezzatura era affollato, i tempi di preparazione erano lunghi e la piattaforma instabile creava problemi di sicurezza per i turisti internazionali, compresi i subacquei alle prime armi e i viaggiatori più anziani. Il centro organizza 3-5 immersioni al giorno, più di 200 giorni all'anno.
      solution: Paddle Board Overstock ha fornito un Professional Diving personalizzato da 6,8 m RIB con layout del ponte ampliato ottimizzato per lo stoccaggio dell'attrezzatura subacquea, ampia scala per immersione in acciaio inossidabile, tubi Hypalon per carichi pesanti resistenti ai raggi UV e all'acqua salata, superficie del ponte antiscivolo e soluzione per lo stoccaggio del serbatoio. La configurazione è stata progettata in base al flusso di lavoro quotidiano del diving center, non sulla base del layout standard di un'imbarcazione da diporto.
      product: 6,8 m Immersioni professionali RIB
      results: L'area di lavoro più ampia ha migliorato l'efficienza della preparazione dell'attrezzatura. I subacquei hanno sperimentato un imbarco più sicuro e più facile. I requisiti di manutenzione si sono ridotti in modo significativo. Il centro ha acquisito la capacità di gestire con maggiore sicurezza un numero maggiore di clienti durante l'alta stagione. Lo RIB divenne il fondamento delle operazioni subacquee quotidiane.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: La nostra barca per le immersioni non è solo un mezzo di trasporto. È il fondamento della nostra attività quotidiana. Paddle Board Overstock RIB dà al nostro team maggiore sicurezza durante l'esecuzione di più immersioni ogni giorno.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professional RIB Aggiornamento
      customer: Centro immersioni Ocean Explorer
      country: Tailandia
      industry: Centro immersioni commerciale
      challenge: L'Ocean Explorer Diving Center di Phuket, in Tailandia, aveva bisogno di aggiornare una tradizionale imbarcazione per immersioni in fibra di vetro che non riusciva a tenere il passo con la crescente domanda dei clienti. Lo spazio limitato sul ponte rendeva inefficiente la preparazione dell'attrezzatura. L'imbarco difficile ha creato sfide alla sicurezza per i turisti internazionali. Gli elevati requisiti di manutenzione in condizioni di acqua salata tropicale hanno aumentato i costi operativi. Il centro effettua più viaggi giornalieri, oltre 200 giorni all'anno.
      solution: Paddle Board Overstock ha consegnato un'immersione commerciale personalizzata da 6,8 m RIB con layout del ponte di lavoro ottimizzato per lo stoccaggio delle bombole, la preparazione dell'attrezzatura e il movimento del subacqueo. Le caratteristiche includevano un'ampia scala per immersioni con corrimano in acciaio inossidabile, struttura tubolare per carichi pesanti con materiali resistenti ai raggi UV, pavimento antiscivolo, soluzione per riporre il serbatoio, console professionale e sedili per passeggeri, il tutto configurato per operazioni di immersione commerciale.
      product: 6,8 m Immersioni commerciali RIB
      results: L'area del ponte più ampia ha consentito un'organizzazione più rapida delle attrezzature e un flusso di lavoro quotidiano più efficiente. Il comfort e la sicurezza di imbarco dei clienti sono migliorati in modo significativo. I tempi di inattività per la manutenzione sono diminuiti grazie alla costruzione di tipo marino. Il centro immersioni potrebbe servire più clienti durante l'alta stagione ed espandere con sicurezza i servizi subacquei professionali.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Per un diving la barca non è solo un mezzo di trasporto. È una parte importante della nostra attività quotidiana. Paddle Board Overstock RIB dà al nostro team la sicurezza necessaria per eseguire più immersioni ogni giorno con maggiore sicurezza ed efficienza.
      icon: tabler:lifebuoy
    - title: Flotta del Centro Subacqueo Europeo
      customer: Centri Diving BlueMed
      country: Grecia
      industry: Immersioni e turismo marino
      challenge: Richiesti 12 gommoni configurati per le immersioni per una catena di centri immersioni in più isole greche. Ogni barca necessitava di una scala per le immersioni personalizzata, di un deposito per 8 bombole e di una piattaforma stabile per l'ingresso dei subacquei in acque libere. La flotta doveva arrivare entro 60 giorni per l'inizio della stagione turistica.
      solution: Prodotto 12 modelli RIB 520 Dive con portabombole integrati, scale da immersione e tubi extra larghi Hypalon per la stabilità all'imbarco. Ogni imbarcazione è stata marchiata con la livrea della flotta del cliente. Tutte le 12 barche sono state sottoposte a test di pressione e spedite da Qingdao entro 55 giorni.
      product: RIB 520 Immersione
      results: Tutte le 12 barche sono state consegnate in tempo per la stagione turistica. La flotta è operativa quotidianamente da oltre 18 mesi senza guasti ai materiali. Il cliente ha ordinato 6 unità aggiuntive nel secondo anno.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Il RIB 520 Dive è stato la spina dorsale delle nostre operazioni subacquee quotidiane. La stabilità a riposo è eccellente e la disposizione dei serbatoi mantiene il ponte pulito e sicuro per i nostri ospiti.
      icon: tabler:lifebuoy
    - title: Programma Distributore Australiano OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Produzione
      challenge: Il distributore australiano aveva bisogno di una gamma di cartoni SUP a marchio del distributore a prezzi competitivi per competere con i marchi cinesi diretti al consumatore. Sono richiesti 8 modelli unici dal livello principiante all'avanzato, con grafica personalizzata, imballaggio personalizzato e consegna diretta ai punti vendita.
      solution: Sviluppati 8 modelli SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) con esclusivo pacchetto grafico australiano. Confezione di vendita personalizzata con codici QR che collegano ai video di installazione. Logistica drop-ship configurata da Qingdao direttamente ai negozi al dettaglio australiani.
      product: Linea SUP personalizzata (8 modelli)
      results: Dal concept alla prima spedizione in 90 giorni. Tasso di vendita al dettaglio dell'85% nella prima stagione. Il distributore ha ampliato la partnership per includere la linea di gommoni nel secondo anno.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock ha consegnato una linea SUP completa in 90 giorni, dalla progettazione iniziale al punto vendita. La qualità corrisponde ai marchi che vendono al doppio del prezzo.
      icon: tabler:arrows-exchange
    - title: Fornitura di navi di salvataggio in Medio Oriente
      customer: Autorità nazionale di protezione civile
      country: Emirati Arabi Uniti
      industry: Ricerca e salvataggio
      challenge: L'organizzazione della protezione civile aveva bisogno di 20 RIB pronti per il pattugliamento per la ricerca e il salvataggio costieri, la sicurezza dei porti e la risposta alle inondazioni. Sono richiesti ponti autosvuotanti, suite di navigazione complete (GPS, radar, VHF), tubi arancioni ad alta visibilità e conformità con le normative marittime locali.
      solution: Forniti 20 modelli RIB 450 Patrol con ponti autosvuotanti, suite di navigazione Garmin, proiettori a LED, nastro riflettente SOLAS e tubi arancioni Hypalon ad alta visibilità. Ogni barca era certificata CE e testata secondo gli standard ISO 6185. Il pacchetto di documentazione includeva certificati di conformità per la registrazione locale.
      product: RIB 450 Pattuglia
      results: Flotta schierata in 5 stazioni costiere. Le barche hanno funzionato in condizioni di calore estremo (45°C+) senza deterioramento dei tubi. L'autonomia del pattugliamento e l'efficienza del carburante hanno superato le specifiche del 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: Il RIB 450 Patrol ha superato le nostre esigenze operative. In condizioni di calore estremo, i tubi Hypalon non mostrano segni di degradazione UV dopo 24 mesi di utilizzo quotidiano.
      icon: tabler:alert-triangle
    - title: OEM Brand Partnership europea
      customer: North Sea Marine Equipment BV
      country: Paesi Bassi
      industry: OEM/ODM Produzione
      challenge: L'affermato marchio nautico europeo desiderava espandersi nel mercato RIB senza investire in impianti di produzione. Avevamo bisogno di un partner white label in grado di produrre 5 modelli RIB (da 3,9 milioni a 6,2 milioni) con marchio privato, certificazione CE e diritti di distribuzione esclusivi nell'UE.
      solution: Stabilito accordo di produzione in white label per 5 modelli RIB. Ogni modello è marchiato con i loghi dei clienti e la combinazione di colori. CE documentazione di certificazione predisposta per ciascun modello. Diritti di distribuzione esclusivi nell'UE concessi con impegni di ordine minimo. Documentazione tecnica e catalogo ricambi forniti alla rete di assistenza locale.
      product: Linea RIB personalizzata (5 modelli)
      results: Siglato accordo pluriennale. Prima produzione di 50 unità spedite entro 75 giorni. Marchio lanciato al METSTRADE con accoglienza positiva da parte dei rivenditori.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: 'Lavorare con Paddle Board Overstock ci ha permesso di entrare nel mercato RIB senza costruire una fabbrica: ci hanno fornito una soluzione completa chiavi in ​​mano con certificazione CE e documentazione di supporto del rivenditore.'
      icon: tabler:building
    - title: Flotta dei resort caraibici
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Turismo marittimo e ospitalità
      challenge: "Il resort di lusso necessitava di una flotta completa di attrezzature per sport acquatici per le attività degli ospiti: 40 SUP tavole per visite guidate, 20 kayak per l'esplorazione della laguna, 10 gommoni per i trasferimenti degli ospiti e le escursioni di pesca, oltre agli accessori. Tutte le attrezzature necessitavano di un marchio personalizzato per il resort e dovevano essere consegnate prima dell'alta stagione turistica."
      solution: 'Pacchetto completo per sport acquatici prodotto: 40 tavole SUP Voyager (modello All-Around), 20 kayak Explorer, 10 gommoni AirDeck 360, oltre a PFD, pagaie, pompe e kit di riparazione. Tutte le attrezzature sono stampate con il logo del resort e una combinazione di colori tropicali. Spedizione in container con manifest di inventario completo.'
      product: Pacchetto completo di sport acquatici (oltre 70 unità)
      results: La flotta è arrivata 6 settimane prima dell'alta stagione. I punteggi di soddisfazione degli ospiti per le attività di sport acquatici sono aumentati del 40% su base annua. L'attrezzatura è durata 3 stagioni con la sola manutenzione ordinaria.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: "L'approccio del pacchetto completo ci ha permesso di ricevere tutto ciò di cui avevamo bisogno in un'unica spedizione: tavole, kayak, barche e accessori, tutti marchiati e pronti per l'uso da parte degli ospiti. I nostri ospiti apprezzano la qualità delle attrezzature."
      icon: tabler:beach
    - title: Queensland Commercial Diving Center RIB Aggiornamento
      customer: Centro immersioni commerciale
      country: Australia
      industry: Immersioni commerciali e servizi marittimi
      challenge: "Un centro immersioni commerciale con sede nel Queensland, specializzato in ispezioni di infrastrutture marine, manutenzione portuale e progetti di riparazione subacquea, gestiva una vecchia imbarcazione da lavoro. Con l’aumento della domanda del progetto, la vecchia nave divenne un ostacolo: la manutenzione frequente causava interruzioni della programmazione, il layout non era progettato per le moderne operazioni di immersione (spazio limitato per bombole, strumenti e attrezzature) e il comfort dell’equipaggio durante le lunghe operazioni era scarso. L'azienda aveva bisogno di una nave che potesse supportare le loro operazioni professionali ogni giorno lavorativo."
      solution: Paddle Board Overstock ha condotto un'analisi operativa dettagliata del flusso di lavoro subacqueo del cliente, della durata tipica del progetto, delle dimensioni dell'equipaggio e dei requisiti dell'attrezzatura. Sulla base di questa analisi, Paddle Board Overstock ha fornito un RIB professionale personalizzato con un layout funzionale del ponte ottimizzato per la preparazione dell'attrezzatura e il movimento del subacqueo, sedili professionali per periodi di trasporto più lunghi, maggiore stabilità per un'entrata e un'uscita più sicura del subacqueo e funzionalità di supporto per l'immersione integrate nel design.
      product: Immersioni professionali personalizzate RIB
      results: Il nuovo RIB è diventato un'affidabile piattaforma di lavoro quotidiano. La preparazione dell'attrezzatura è diventata più rapida grazie al layout ottimizzato. L'equipaggio ha riferito un miglioramento del comfort e della sicurezza durante le operazioni lunghe. L'aspetto professionale della barca ha rafforzato la fiducia dei clienti quando lavorano con operatori portuali e appaltatori marittimi. Il centro immersioni ha acquisito una nave che corrispondeva alla professionalità del loro servizio.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Avevamo bisogno di una barca che potesse supportare la nostra attività quotidiana, non solo una nave per il trasporto. Paddle Board Overstock ha collaborato con noi per comprendere le nostre esigenze operative e ha fornito una soluzione RIB adatta al nostro flusso di lavoro per le immersioni commerciali.
      icon: tabler:lifebuoy
    - title: Contratto di pattuglia costiera degli Stati Uniti
      customer: Agenzia per la sicurezza costiera atlantica
      country: Stati Uniti
      industry: Sicurezza marittima e applicazione della legge
      challenge: L'agenzia di sicurezza costiera statunitense aveva bisogno di gommoni da pattugliamento pesanti per le operazioni di intercettazione in mare aperto. Necessaria configurazione bimotore per ridondanza, console corazzata per la protezione dell'equipaggio, elettronica con specifiche militari (comunicazioni crittografate, FLIR, radar) e conformità con le normative della Guardia Costiera degli Stati Uniti.
      solution: Patrol RIB 600 progettato con doppia configurazione fuoribordo 115 HP, console corazzata con protezione balistica, imaging termico FLIR, comunicazioni VHF/UHF crittografate e punti di montaggio per armi integrati. Scafo rinforzato per manovre di intercettazione ad alta velocità. Tutta l'elettronica integrata e testata in fabbrica. USCG documentazione di conformità fornita.
      product: RIB 600 Patrol (bimotore)
      results: Le barche hanno raggiunto una velocità massima di 52 nodi durante le prove di accettazione. L'Agenzia ha riportato un tasso di preparazione alla missione del 95% nei primi 12 mesi. Ordine aggiuntivo effettuato per 8 unità.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Il bimotore RIB 600 offre ai nostri equipaggi la velocità e la ridondanza necessarie per le operazioni di intercettazione in mare aperto. La console corazzata fornisce una protezione critica senza compromettere le prestazioni.
      icon: tabler:shield
