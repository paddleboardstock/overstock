features3_cases:
  tagline: Storie in evidenza
  title: Tavole reali<br />Per Avventure Vere
  isBeforeContent: false
  columns: 3
  items:
    - title: Dal divano al primo tentativo
      customer: Principiante come pagaiatore
      country: Germania
      industry: Ricreazione per principianti
      challenge: Anna non aveva mai pagaiato prima ed era nervosa per l'equilibrio, l'acqua fredda e il fatto di sembrare ridicola davanti agli altri. Vivendo in un piccolo appartamento a Monaco, non aveva nemmeno un posto dove riporre una tavola rigida e nessun portapacchi per il trasporto.
      solution: SUP L'Explorer 11 offre una piattaforma ampia e stabile che perdona i primi colpi traballanti. Il pacchetto completo — tavola, pagaia regolabile, pompa, guinzaglio e borsa — le permetteva di portare tutto a piedi fino al lago. Dalla scatola all'acqua in meno di 20 minuti, senza bisogno di esperienza.
      product: SUP Explorer 11
      results: Anna si è alzata al primo tentativo e ha pagaiato per un'ora senza cadere. Due mesi dopo rema tre volte a settimana ed è si è unita a un gruppo locale di incontro. La tavola viene messa in uno zaino che sta nel suo armadio del corridoio.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Mi aspettavo di passare il mio primo giorno a nuotare accanto alla tavola. Invece stavo scivolando sul lago in pochi minuti — non riuscivo a credere a quanto fosse stabile.
      icon: tabler:school
    - title: Un consiglio, due bambini, zero lamentele
      customer: Famiglia di quattro
      country: Italia
      industry: Ricreazione familiare
      challenge: Marco e Giulia volevano un'attività estiva per cui i loro due figli avrebbero davvero lasciato i loro schermi. I gonfiabili economici precedenti si sono deformati, hanno perso le cuciture e si sono sgonfiati a metà pagaia — i bambini hanno perso fiducia dopo una brutta nuotata.
      solution: La serie Tropical Breeze offre una tela completa di vacanza sull'isola — sole, palmeti di cocco e scene sulla spiaggia — che ha fatto venire voglia ai bambini di salire in acqua. Il drop-stitch nucleo funziona rigido a 15 PSI anni, e ogni tavola è sottoposta a pressione testata a 1,25 volte la sua pressione nominale per 24-48 ore in fabbrica prima della spedizione.
      product: Serie Breezza Tropicale
      results: La famiglia ora rema ogni fine settimana da giugno a settembre. Dopo una stagione piena di traffico di bambini, la tavola non mostra stress nelle cuciture né sbiadimenti. La loro figlia ha iniziato a chiedere una tavola tutta sua per il compleanno.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: I ragazzi litigano su chi tocca pagaiare. Dopo le tavole economiche che abbiamo provato prima, questa sembra fatta per sopravvivere esattamente alla nostra famiglia.
      icon: tabler:users
    - title: Uno Studio di Yoga Galleggiante all'Alba
      customer: Praticante di yoga
      country: Indonesia
      industry: SUP Yoga e Meditazione
      challenge: Putu insegna yoga a Bali e voleva portare la sua pratica in acqua, ma i suoi primi tentativi su una tavola presa in prestito sembravano scivolosi e instabili. Mantenere una posizione mentre si lascia alla deriva in acqua aperta richiede presa, stabilità e un design calmante.
      solution: La serie Flowing Lotus abbina opere di loto, koi e libellule a un pad di trazione inciso al laser che mantiene mani e piedi ancorati verso il basso verso il cane. Il contorno ampio e tutto circostante e lo spessore di 6 pollici creano una piattaforma galleggiante stabile per flussi e meditazione seduti.
      product: Serie Lotus Fluente
      results: Putu ora conduce piccole SUP lezioni di yoga all'alba due volte a settimana. I suoi studenti prenotano settimane prima, e la bacheca è diventata la firma delle sue classi — le opere d'arte fanno metà del suo marketing.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Esercitarsi sull'acqua cambia tutto. La tavola è abbastanza stabile per la posa del corvo, e il design a loto fa sembrare ogni lezione un rituale.
      icon: tabler:heart
    - title: Contenuti che non svaniscono mai — letteralmente
      customer: Creatore di Contenuti per Viaggi
      country: Portogallo
      industry: Social Media e Creazione di Contenuti
      challenge: Miguel gira contenuti con le pagaie per lavoro. Le tavole stampate che usava prima hanno perso colore in una stagione di acqua salata e sole — le sue riprese hanno iniziato a sembrare stanche e i follower hanno notato le piastre del ponte che si staccavano.
      solution: La Edizione Cheetah Surge costruisce il motivo del ghepardo con pezzi a blocchi tagliati e multicolore EVA invece che con inchiostro superficiale. I colori fanno parte della schiuma stessa, quindi acqua salata, UV, e il traffico pedonale non possono sbiadire, scrostar o graffiare il design.
      product: Edizione Cheetah Surge
      results: Dopo un anno intero di riprese costiere, la plancia appare nuova davanti alla telecamera. Le sue clip dell'alba dall'Algarve sono diventate i suoi contenuti più performanti di sempre, e la plancia stessa appare in decine di collaborazioni con i brand.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Le mie vecchie tavole sono invecchiate più velocemente dei miei contenuti. Il Cheetah sembra identico al primo giorno dopo un anno in mare — i miei follower continuano a chiedermi quale filtro uso. Non è un filtro. È la lavagna.
      icon: tabler:camera
    - title: Spedizioni costiere del fine settimana
      customer: Canottatore da turismo costiero
      country: Australia
      industry: Touring e Esplorazione
      challenge: Tom voleva remare nelle baie e nei promontori tranquilli della Gold Coast in tour di più ore, ma le tavole leggere economiche si piegavano nel moto e lo lasciavano esausto dopo un'ora. Aveva bisogno di una rigidità che potesse portare da solo fino ai posti di ritrovo remoto.
      solution: La serie Ocean Voyager combina un'opera d'arte di tartaruga marina in teal profondo e corallo con un drop-stitch nucleo rigido che mantiene la forma attraverso una leggera ondata costiera. Con circa 20 libbre nello zaino, Tom può portarla a piedi fino a spiagge che nessuna auto può raggiungere, gonfiarla con la pompa inclusa e fare giri per ore.
      product: Serie Ocean Voyager
      results: Tom ha ora mappato undici rotte costiere, inclusa una traversata di intera mattina che un tempo considerava oltre le sue capacità. La tavola rimane rigida dal lancio fino a pranzo, e il design della tartaruga marina è diventato la sua firma riconoscibile sull'acqua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Le tavole rigide sembrano tavole rigide, e questa si porta come uno zaino. Ha aperto un'intera costa che non avrei mai potuto raggiungere con un'auto e un rimorchio.
      icon: tabler:compass
    - title: Fitness per tutto il corpo, zero tariffe per la palestra
      customer: Fitness Paddler
      country: Canada
      industry: Fitness & Training
      challenge: Priya voleva un allenamento a basso impatto per tutto il corpo che non sembrasse un allenamento. Correre le faceva male alle ginocchia e la palestra le sembrava ripetitiva — aveva abbandonato ogni routine entro sei settimane.
      solution: "La Dolphin Wave Series ha trasformato l'esercizio fisico in un gioco: pagaiare brucia calorie, rafforza il core e le spalle e mette alla prova l'equilibrio, il tutto mentre si sfiora il paesaggio di Vancouver. Il solido ponte da 32 pollici perdona i colpi goffi pur richiedendo un micro-bilanciamento costante — una palestra mascherata da tavola da paddle."
      product: Serie Dolphin Wave
      results: Priya paddles five mornings a week before work and has kept the routine for 14 months — her personal record for any exercise plan ever. Friends now join her weekly paddle club, and her knees have never been happier.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: I have never once had to force myself to go paddling. The workout is real — I just stopped noticing it because I am too busy enjoying the water.
      icon: tabler:trophy
    - title: A 30-Kilo Labrador and One Very Stable Deck
      customer: Paddler with a Dog
      country: Stati Uniti
      industry: Paddling with Pets
      challenge: Jake wanted to bring his Labrador, Biscuit, onto the water, but his old narrow board turned into a submarine the moment the dog jumped aboard. Claws also shredded the cheap deck pad within weeks.
      solution: The Leviathan Wake Series offers a wide, high-volume platform that carries paddler plus 30-kilo passenger without wallowing. The EVA traction deck survives claws that destroyed his previous board, and the blue whale totem gives Biscuit a clearly visible "spot" to sit on.
      product: Leviathan Wake Series
      results: Biscuit now leaps aboard on command and rides the bow like a figurehead. Two summers in, the deck shows zero claw damage, and their river paddles have become the most-liked content on Jake’s feed.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: I bought a board and got a first mate. The deck shrugged off everything a large wet dog could throw at it — literally.
      icon: tabler:dog
    - title: Student Budget, Full-Price Quality
      customer: University Student
      country: Poland
      industry: Student Lifestyle
      challenge: Kasia is a student in Gdansk with a student budget and a summer lake routine. Every cheap board she found was either flimsy, ugly, or both — and quality boards cost more than her monthly food budget.
      solution: The Medusa Glow Series pairs premium build — drop-stitch core, 15 PSI rigidity, jellyfish artwork in mint green assembled from die-cut EVA blocks — with Paddle Board Overstock factory-direct clearance pricing that skips every middleman margin.
      product: Medusa Glow Series
      results: Kasia paid less than half of what comparable premium boards sell for locally. Her board survived a full season of daily lake sessions and a Baltic beach week, and three classmates ordered their own after trying hers.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: I expected student-budget compromises. Instead I got a board my friends thought cost three times as much — and it outlasted two of theirs.
      icon: tabler:backpack
    - title: Casting Off from a Stable Platform
      customer: Weekend Angler
      country: Stati Uniti
      industry: Casual SUP Fishing
      challenge: Devon fishes quiet backwaters too shallow for any motor craft to reach. He needed a paddle craft stable enough to cast from while standing, tough enough for hooks and gear, and light enough to carry down a trail at dawn.
      solution: The Jungle Mandala Series gives him a wide, rigid standing platform for casting, with a hibiscus-and-hummingbird deck in Tiffany Blue that stays cool under the morning sun. The board packs to backpack size for the trail in, inflates in minutes at the water’s edge, and the reinforced PVC skin shrugs off hook snags and fin strikes.
      product: Jungle Mandala Series
      results: Devon now reaches three spawning coves no one else can fish. His catch rate doubled over the season, and the board — hooks, stringer, and all — still looks ready for another summer.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Standing up on a SUP completely changed how I fish. This board is stable enough to cast, set the hook, and land a fish — all without getting wet.
      icon: tabler:fish
