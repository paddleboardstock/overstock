testimonial:
  content: 'Abbiamo iniziato con il pacchetto Club Starter per la nostra scuola di surf in Portogallo. 20 tavole, pagaie, giubbotti: tutto è arrivato entro 3 settimane. Dopo due stagioni siamo passati al pacchetto Pro. Il marchio personalizzato con il nostro logo è stato un punto di svolta per la nostra immagine professionale.'
  name: Ricardo Santos
  title: Proprietario, Algarve Surf Academy — Lagos, Portogallo
content_segments:
  tagline: Profili dei club
  title: Soluzioni per Club di Sport Acquatici<br />Per Tipo di Club
  subtitle: 'Dai club di paddle universitari agli esclusivi yacht club privati: ogni tipo di club ha esigenze di attrezzature, modelli di utilizzo e strutture di budget uniche. Personalizziamo ogni pacchetto per adattarlo al modello del club.'
  items:
    - title: Club di paddle universitari e universitari
      subtitle: Flotte studentesche ad alto utilizzo
      description: Club di pagaia gestiti da studenti o supportati da istituzioni che operano programmi SUP per i dipartimenti ricreativi universitari. Le attrezzature subiscono un utilizzo ad alta frequenza e alto ricambio su più livelli di abilità ogni semestre. La durata e la facilità di riparazione sono fondamentali, oltre a prezzi convenienti per le organizzazioni studentesche.
      features:
        - Costruzione extra-durevole PVC valutata per cicli di utilizzo da parte degli studenti
        - Gamma di tavole codificate per colore in base al livello di abilità per una gestione facile della flotta
        - Kit di riparazione + e supporto video su richiesta inclusi con ogni ordine
        - Prezzi scontati per organizzazioni studentesche e termini di pagamento basati sul semestre
    - title: Paddle comunitario e club sociali
      subtitle: Club ricreativi guidati dagli iscritti
      description: Club comunitari che offrono SUP esperienze di pagaiata sociale ai membri. Le attrezzature devono bilanciare prestazioni e comfort per un'ampia fascia d'età, con un marchio che favorisca l'identità del club e l'orgoglio dei soci. L'efficienza dello stoccaggio è fondamentale per i club che operano da un accesso limitato sul lungomare.
      features:
        - 'Flotta mista: all-around e in SUPs tour'
        - 'Brand completo del club: colori personalizzati, stampa del logo, PFD marchiati'
        - Soluzioni compatte di stoccaggio per attrezzature gonfiabili
        - 'Kit di partenza per la crescita dei membri: carte di referenza, fotografia di marca'
    - title: Scuole e Accademie di Surf SUP
      subtitle: Prestazioni costiere e coaching
      description: Scuole focalizzate sul surf che insegnano SUP tecniche di surf e surf sulle onde. L'attrezzatura deve funzionare in condizioni di surf — manovrabile, reattiva e abbastanza resistente da sopportare ripetuti wapeout, abrasioni da sabbia ed esposizione all'acqua salata senza un rapido degrado.
      features:
        - Forme più corte e SUP larghe ottimizzate per la manovrabilità in surf
        - Costruzione di rotaie rinforzate per la resistenza agli urti nelle onde
        - 'Equipaggiamento di sicurezza specifico per le onde: guinzagli arrotolati, opzioni a pinna morbida'
        - Programma di sostituzione della flotta con sconti stagionali per permuta
    - title: Yacht club aziendali e privati
      subtitle: Esperienze per i membri Premium
      description: "Club privati ​​esclusivi che offrono sport acquatici come servizio premium per i membri. Gli standard delle attrezzature sono elevati: l'estetica, l'allineamento del marchio e la presentazione pronta per gli ospiti sono importanti quanto le prestazioni. Le aspettative del servizio includono consegna in guanti bianchi, soluzioni di archiviazione personalizzate e supporto a livello di concierge."
      features:
        - Tavole di finitura premium con finiture in legno EVA e accenti metallici
        - Abbinamento personalizzato dei colori secondo le linee guida del marchio del club
        - 'Consegna concierge: pre-gonfiata, preparata e etichettata per ogni stagione'
        - Gestione dedicata degli account con SLA di risposta prioritaria
