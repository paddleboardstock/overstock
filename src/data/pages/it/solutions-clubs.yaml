hero:
  tagline: Club di sport acquatici
  title: Attrezzature e Soluzioni<br />Per Club di Paddle e Centri di Addestramento
  subtitle: Pacchetti completi di attrezzature, equipaggiamento per istruttori, branding e supporto alla manutenzione per club SUP, scuole di surf e centri di addestramento agli sport acquatici di qualsiasi dimensione.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP tavole per club di sport acquatici e flotte a noleggio
direct_answer: Paddle Board Overstock fornisce soluzioni complete di attrezzature per club e centri di addestramento agli sport acquatici in tutto il mondo. I nostri pacchetti per club includono tavole SUP, pagaie, pompe, kit di riparazione e dispositivi di sicurezza a prezzo diretto di fabbrica per i club. Ogni pacchetto può essere personalizzato con loghi del club, colori brandizzati e confezioni personalizzate. Offriamo anche formazione alla manutenzione, supporto per pezzi di ricambio e programmi di rotazione dell'attrezzatura per massimizzare la durata della tua flotta.
solution_offerings:
  - title: Pacchetto iniziale del club
    subtitle: Per i club emergenti con 10–30 soci
    badge: Best Seller
    features:
      - title: Attrezzatura principale
        description: 10–30 tavole SUP con pagaie, pompe e kit di riparazione abbinati
      - title: Equipaggiamento di sicurezza
        description: Giubbotti di salvataggio, fischietto, set di guinzagli nei colori del club per ogni tavola
      - title: Attrezzatura dell'istruttore
        description: Tavole specifiche per pullman con tavole antiscivolo e stabilità extra
      - title: Pacchetto di marchio
        description: Stampa del logo personalizzato su tavole, palette e imballaggi
      - title: Materiali di formazione
        description: Guide alle lezioni per principianti, protocolli di sicurezza e liste di controllo per la manutenzione
    cta_text: Crea il mio pacchetto per il club
    cta_href: /contact
  - title: Pacchetto Club Premium
    subtitle: Per club affermati e operatori multisede
    badge: Professional
    features:
      - title: Flotta completa
        description: 30–100 flotte miste di SUPs e accessori
      - title: Sistema di sicurezza avanzato
        description: Tracciamento apparecchiature RFID, app segnalazione danni, segnaletica di sicurezza
      - title: Formazione del personale
        description: Formazione in loco per istruttori e laboratorio di manutenzione dell'attrezzatura
      - title: Supporto al marketing
        description: Fotografia professionale, brochure e modelli per social media
      - title: Programma di sostituzione
        description: Aggiornamento annuale dell'attrezzatura a tariffe scontate con opzioni di permuta
    cta_text: Scala il Mio Club
    cta_href: /contact
