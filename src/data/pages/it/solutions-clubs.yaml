testimonial:
  content: 'Abbiamo iniziato con il pacchetto Club Starter per la nostra scuola di surf in Portogallo. 20 tavole, pagaie, giubbotti: tutto è arrivato entro 3 settimane. Dopo due stagioni siamo passati al pacchetto Pro. Il marchio personalizzato con il nostro logo è stato un punto di svolta per la nostra immagine professionale.'
  name: Ricardo Santos
  title: Proprietario, Algarve Surf Academy — Lagos, Portogallo
content_segments:
  tagline: Profili dei club
  title: Soluzioni per club di sport acquatici<br />Per tipo di club
  subtitle: 'Dai club di paddle universitari agli esclusivi yacht club privati: ogni tipo di club ha esigenze di attrezzature, modelli di utilizzo e strutture di budget uniche. Personalizziamo ogni pacchetto per adattarlo al modello del club.'
  items:
    - title: Club di paddle universitari e universitari
      subtitle: Flotte studentesche ad alto utilizzo
      description: Club di paddle gestiti da studenti o supportati da istituzioni che gestiscono programmi di SUP e kayak per i dipartimenti ricreativi universitari. Ogni semestre le attrezzature sono soggette a un utilizzo ad alta frequenza e ad alto turnover a più livelli di competenza. La durabilità e la facile riparabilità sono fondamentali, insieme a prezzi convenienti per le organizzazioni studentesche.
      features:
        - 'Costruzione in PVC ultra-resistente valutata per cicli di uso studentesco'
        - 'Serie di tavole con codice colore per livello per una gestione facile della flotta'
        - 'Kit di riparazione + supporto video on-demand incluso in ogni ordine'
        - 'Prezzi scontati per le organizzazioni studentesche e pagamento rateizzato per semestre'
    - title: Paddle comunitario e club sociali
      subtitle: Club ricreativi guidati dagli iscritti
      description: Club con sede nella comunità che offrono ai membri esperienze di SUP, kayak e canoa sociale. Le attrezzature devono bilanciare prestazioni e comfort per un'ampia fascia di età, con un marchio che promuova l'identità del club e l'orgoglio dei soci. L’efficienza dello stoccaggio è fondamentale per i club che operano con accesso limitato al litorale.
      features:
        - 'Flotta mista: SUP polivalenti, tavole da touring e kayak da diporto'
        - 'Branding completo del club: colori personalizzati, stampa del logo, giubbini salvagita personalizzati'
        - 'Soluzioni di stoccaggio compatte per attrezzature gonfiabili'
        - 'Kit iniziale per la crescita degli iscritti: tessere referral, fotografia brandizzata'
    - title: Scuole di surf e accademie di surf kayak
      subtitle: Prestazioni costiere e coaching
      description: "Scuole focalizzate sul surf che insegnano surf SUP, surf kayak e abilità di wave riding. L'attrezzatura deve funzionare in condizioni di surf: manovrabile, reattiva e sufficientemente resistente da sopportare ripetuti spazzamenti, abrasione della sabbia ed esposizione all'acqua salata senza un rapido degrado."
      features:
        - 'Shape SUP più corte e larghe ottimizzate per la manovrabilità nel surf'
        - 'Costruzione con bordi rinforzati per resistenza agli impatti tra le onde'
        - 'Attrezzatura di sicurezza specifica per surf: leash a spirale, opzioni pinne morbide'
        - 'Programma di sostituzione della flotta con sconti stagionali sul permutamento'
    - title: Yacht club aziendali e privati
      subtitle: Esperienze per i membri Premium
      description: "Club privati esclusivi che offrono sport acquatici come servizio premium per i membri. Gli standard delle attrezzature sono elevati: l'estetica, l'allineamento del marchio e la presentazione pronta per gli ospiti sono importanti quanto le prestazioni. Le aspettative del servizio includono consegna in guanti bianchi, soluzioni di archiviazione personalizzate e supporto a livello di concierge."
      features:
        - 'Tavole con finitura premium in EVA effetto legno e accenti metallici'
        - 'Corrispondenza colori personalizzata secondo le linee guida del brand del club'
        - 'Consegna concierge: pre-gonfiate, predisposte ed etichettate per ogni stagione'
        - 'Gestione dell’account dedicata con SLA di risposta prioritaria'
