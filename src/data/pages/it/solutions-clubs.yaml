hero:
  tagline: Club di sport acquatici
  title: Attrezzature e soluzioni<br />Per club di paddle e centri di formazione
  subtitle: Pacchetti completi di attrezzatura, attrezzatura per istruttori, branding e supporto per la manutenzione di club SUP, club di kayak, scuole di surf e centri di formazione per sport acquatici di qualsiasi dimensione.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Tavole SUP Aquafarer per club di sport acquatici e flotte a noleggio
direct_answer: Aquafarer fornisce soluzioni di attrezzature end-to-end per club di sport acquatici e centri di formazione in tutto il mondo. I nostri pacchetti club includono tavole SUP, kayak, pagaie, pompe, kit di riparazione e attrezzature di sicurezza a prezzi all'ingrosso competitivi con MOQ bassi. Ogni confezione può essere personalizzata con loghi del club, colori del marchio e packaging personalizzato. Forniamo inoltre corsi di formazione sulla manutenzione, supporto per i pezzi di ricambio e programmi di rotazione delle attrezzature per massimizzare la durata della vostra flotta.
solution_offerings:
  - title: Pacchetto iniziale del club
    subtitle: Per i club emergenti con 10–30 soci
    badge: Best Seller
    features:
      - title: Attrezzatura principale
        description: 10-30 tavole SUP o kayak con pagaie, pompe e kit di riparazione abbinati
      - title: Equipaggiamento di sicurezza
        description: Giubbotti di salvataggio, fischietto, set di guinzagli nei colori del club per ogni tavola
      - title: Attrezzatura dell'istruttore
        description: Tavole specifiche per pullman con tavole antiscivolo e stabilità extra
      - title: Pacchetto di marchio
        description: Stampa del logo personalizzato su tavole, palette e imballaggi
      - title: Materiali di formazione
        description: Guide alle lezioni per principianti, protocolli di sicurezza e liste di controllo per la manutenzione
    cta_text: 'Crea il mio pacchetto club'
    cta_href: /contact
  - title: Pacchetto Club Premium
    subtitle: Per club affermati e operatori multisede
    badge: Professional
    features:
      - title: Flotta completa
        description: 30-100 flotte miste di SUP, kayak e accessori
      - title: Sistema di sicurezza avanzato
        description: Tracciamento apparecchiature RFID, app segnalazione danni, segnaletica di sicurezza
      - title: Formazione del personale
        description: Laboratorio di certificazione degli istruttori e manutenzione delle attrezzature in loco
      - title: Supporto al marketing
        description: Fotografia professionale, brochure e modelli per social media
      - title: Programma di sostituzione
        description: Aggiornamento annuale dell'attrezzatura a tariffe scontate con opzioni di permuta
    cta_text: 'Fai crescere il mio club'
    cta_href: /contact
benefits:
  - icon: gear
