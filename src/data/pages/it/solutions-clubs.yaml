        - Pagaie premium, pompe ad alta capacità
        - Pacchetto completo di sicurezza con scaffali di stoccaggio
        - Branding personalizzato completo (tavole + imballaggio)
        - Sistema di noleggio tracciato RFID
        - Formazione del personale e materiali di marketing
        - Garanzia di 2 anni e supporto prioritario
        - Programma annuale di aggiornamento della flotta
      cta: Richiedi Preventivo Pro
      ctaHref: /contact
    - name: Club Enterprise
      description: Per grandi club con più di 100 membri +
      audience: Grandi club e operatori con più sedi
      items:
        - Flotta di 60-100 + SUP con accessori
        - Pompe, strumenti e ricambi di livello commerciale
        - Sistema di sicurezza completo con attrezzature di soccorso
        - Branding personalizzato completo e configurazione delle tavole
        - Integrazione POS RFID +
        - Manuale operativo e di formazione in loco
