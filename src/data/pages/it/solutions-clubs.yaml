packages_section:
  title: Pacchetti di Attrezzatura del Club
  subtitle: Scegli il pacchetto giusto per la dimensione del tuo club. Tutti i pacchetti includono prezzi diretti alla fabbrica, opzioni di branding personalizzate e spedizione globale.
