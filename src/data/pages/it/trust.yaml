features3_certifications:
  title: Qualità e test
  subtitle: Ogni scheda viene testata nel nostro laboratorio prima della spedizione — numeri reali, registri reali, nessuna affermazione di marketing.
  columns: 3
  isBeforeContent: true
  items:
    - title: Costruiti nella nostra fabbrica
      description: Possediamo e gestiamo uno stabilimento Weihai di 12.000 m². Ogni lotto di produzione è tracciabile, documentato e ispezionato — senza produzione misteriosa esternalizzata.
      icon: tabler:building-factory
    - title: Laboratorio di Test dei Materiali
      description: Il laboratorio interno dei materiali testa la resistenza alla trazione, UV la resistenza, l'integrità delle giunture e l'abrasione per ogni lotto di tessuto prima della produzione.
      icon: tabler:microscope
    - title: Materiali di Grado Marino
      description: UV- PVC Stabilizzato, drop-stitch nuclei e EVA schiuma per il ponte — scelti e testati per stagioni di sole, sale e abuso.
      icon: tabler:flask
    - title: Garanzia di 2 anni SUP
      description: Paddle Board Overstock SUP Le tavole sono coperte da una garanzia di 2 anni contro difetti di fabbricazione, inclusi giunti, valvole e delaminazione dei materiali. Sosteniamo ciò che costruiamo.
      icon: tabler:shield-check
testimonials:
  tagline: Fiducia del Cliente
  title: Cosa dicono i nostri clienti
  subtitle: Dai pagaiatori alle prime armi agli esploratori esperti — scopri perché si Paddle Board Overstock fidano.
  items:
    - content: Come acquirente alla prima esperienza, ero nervoso all'idea di ordinare dall'estero. Il team ha risposto a ogni domanda con foto vere e registri di test prima ancora che chiedessi. Il consiglio è arrivato in 6 giorni e ha superato le mie aspettative.
      name: James Thornton
      title: SUP Proprietario di Explorer 11 — Vancouver, Canada
features3_lab:
  title: Laboratorio interno di test e qualità
  subtitle: Ogni lotto di materiale e prodotto finito passa attraverso il nostro laboratorio di test in loco prima della spedizione.
  columns: 3
  isBeforeContent: true
  items:
    - title: Test della resistenza alla trazione
      description: 'Ogni PVC rotolo di tessuto viene testato internamente per la resistenza alla trazione. Requisito minimo: 350 N/cm ordito e trama. I lotti scartati vengono restituiti al fornitore — noi rifiutiamo circa il 3% dei materiali in arrivo.'
      icon: tabler:scale
    - title: UV Invecchiamento accelerato
      description: I campioni di tessuto subiscono un intemperimento accelerato di 1.000 ore UV . La resistenza alla trazione deve mantenere l'80%+ dopo l'esposizione. Prodotti valutati per 3+ anni di utilizzo all'aperto.
      icon: tabler:sun
    - title: Resistenza al peeling delle cuciture
      description: Le giunture saldate vengono testate fino a una resistenza minima al decollamento di 5 N/mm. Ogni lotto di produzione ha i campioni di giuntura testati e archiviati in modo distruttivo.
      icon: tabler:stack
    - title: Mantenimento della pressione di 24–48 ore
      description: 'Ogni prodotto gonfiabile gonfiato a 1,25x e PSI monitorato per 24–48 ore. Caduta massima di pressione consentita: 5%. I prodotti che non superano questo test vengono rielaborati e ritestati prima della spedizione.'
      icon: tabler:wind
    - title: Test del ciclo valvolare
      description: Ogni progetto di valvola subisce 10.000 cicli di apertura e chiusura nel nostro laboratorio. Le valvole devono mantenere una tenuta ermetica a 1,25 volte la pressione nominale dopo il ciclo. Tutte Paddle Board Overstock le valvole sono previste per 5+ anni di uso regolare.
      icon: tabler:rotate
    - title: Resistenza alle crepe fredde
      description: I materiali vengono testati a -30°C per 4 ore. Nessuna crepa o fragilità consentita. Prodotti valutati per conservazione invernale e uso in acqua fredda fino a -10°C a temperatura ambiente.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Come garantiamo la qualità
  subtitle: Dall'ispezione delle materie prime al test finale di pressione — ogni prodotto attraversa una rigorosa catena di qualità.
  items:
    - title: Ispezione delle materie prime
      description: Ogni rotolo di PVC tessuto viene testato per spessore, resistenza alla trazione UV e resistenza prima di entrare in produzione.
      icon: tabler:search
    - title: Controllo qualità in processo
      description: Le giunzioni di saldatura, le installazioni delle valvole e i legami della camera vengono ispezionati in ogni stazione durante l'assemblaggio.
      icon: tabler:eye
    - title: Test di Pressione
      description: Ogni prodotto gonfiabile viene gonfiato a 1,25x PSI e mantenuto per 24–48 ore per verificare la ritenzione dell'aria e l'integrità delle giunzioni.
      icon: tabler:wind
    - title: Ispezione finale
      description: Ogni unità viene ispezionata per finitura, ferramenta e imballaggio prima di essere approvata per la spedizione. I campioni in lotto vengono inviati al nostro laboratorio per test distruttivi.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP FAQ sul consiglio
  subtitle: Domande comuni sulle nostre tavole da paddle stand-up.
  columns: 2
  items:
    - title: Quali SUP dimensioni sono disponibili per le schede?
      description: Offriamo SUP tavole da 9 a 12 piedi, inclusi design all-round, touring, yoga e speciali. I nostri modelli più venduti includono la Tropical Breeze (10 piedi) e l'Ocean Voyager (11 piedi).
    - title: Cos'è drop-stitch l'edilizia?
      description: Drop-stitch La costruzione utilizza migliaia di filetti di poliestere che collegano gli strati superiore e inferiore della tavola, permettendole di sostenere un'elevata pressione d'aria (15–20 PSI) e ottenere una piattaforma rigida e stabile. Questo è lo standard industriale per i gonfiabili premium SUPs.
    - title: Qual è il limite di peso per SUP le tavole?
      description: Le nostre SUP tavole supportano fino a 150 kg a seconda del modello e del volume. La Leviathan Wake è il nostro modello con la massima capacità, progettata per rider più grandi e per l'uso dello yoga.
    - title: Offrite SUP pacchetti completi?
      description: Sì. Ogni SUP tavola viene fornita con un pacchetto completo che include una pagaia in alluminio in 3 pezzi, una pompa manuale ad alta pressione, un guinzaglio a spirale, uno zaino da viaggio e un kit di riparazione. Alcuni modelli includono anche un set di alne rimovibile.
    - title: Qual è la garanzia sulle SUP schede?
      description: Tutte Paddle Board Overstock SUP le schede hanno una garanzia di 2 anni contro difetti di fabbricazione, inclusi guasti di giunzione, difetti di valvola e delaminazione del materiale durante l'uso normale.
    - title: Quanto tempo ci vuole per gonfiare una SUP tavola?
      description: Utilizzando la pompa manuale inclusa, un gonfiaggio completo a 15 PSI richiede circa 8–12 minuti. Per un gonfiaggio più rapido, consigliamo la Paddle Board Overstock nostra pompa elettrica 12V, che gonfia una tavola in meno di 4 minuti.
