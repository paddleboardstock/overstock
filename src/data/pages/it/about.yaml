hero:
  tagline: Chi siamo
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Officina Aquafarer
  title: |
    Ingegneria navale, <br />
    alla <span class="text-accent dark:text-white">Aquafarer</span>
  subtitle: "Siamo nati in un'officina costiera con una barca e una convinzione incrollabile: i prodotti nautici dovrebbero essere costruiti come se la vita dipendesse da loro – perché è così. Oggi spediamo in oltre 50 paesi, ma ogni scafo passa ancora attraverso le stesse mani che hanno fondato l'azienda."

stats:
  title: In numeri
  columns: 4
  stats:
    - title: Scafi consegnati
      amount: '2,400+'
    - title: Paesi serviti
      amount: '50+'
    - title: Anni di esperienza combinata
      amount: '60'
    - title: Tempo medio di risposta (ore)
      amount: '24'

features3_what_we_build:
  title: Cosa costruiamo
  subtitle: Una linea di prodotti mirata che conosciamo a fondo – niente esperimenti a metà, niente badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB
      description: RIB con scafo in alluminio da 3,3 m a 7,5 m. Progettati per pattugliamento, immersione, pesca e uso familiare.
      icon: tabler:ship
    - title: Gommoni
      description: Gommoni in PVC e Hypalon da 2,4 m a 4,2 m. Leggeri, robusti e facili da riporre.
      icon: tabler:speedboat
    - title: Tender per superyacht
      description: RIB compatti e altamente specificati, su misura per il design della vostra nave madre.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessori
      description: Cinghie, pompe, coperture, borse stagne, serbatoi carburante ed elettronica. Tutti compatibili con le nostre barche.
      icon: tabler:package
    - title: Refit e riparazioni
      description: Riparazione tubolari interna, retrofit elettronico e upgrade motore.
      icon: tabler:tool
    - title: Costruzioni su misura
      description: Progettazione su progetto per clienti commerciali, scientifici e militari.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Costruzione personalizzata

steps2_values:
  title: I nostri valori
  subtitle: Tre principi che hanno plasmato ogni prodotto fin dal primo giorno.
  items:
    - title: Costruisci come se la tua famiglia ci salisse sopra
      description: Ogni scafo, ogni saldatura e ogni componente è trattato come se fosse per le nostre stesse famiglie.
      icon: tabler:heart
    - title: Ingegneria prima della vendita
      description: Se una specifica è sbagliata, modifichiamo la specifica – mai il cliente.
      icon: tabler:settings
    - title: Supporto oltre la garanzia
      description: Scafi di vent'anni ci chiamano ancora per ricambi – e rispondiamo ancora.
      icon: tabler:headset

steps2_milestones:
  title: Tappe fondamentali
  subtitle: Una versione breve della storia Aquafarer.
  isReversed: true
  items:
    - title: Fondata in un'officina costiera
      description: Iniziata da due architetti navali con una CNC e un'idea incrollabile.
      icon: tabler:building-factory
    - title: Primi 1.000 scafi consegnati
      description: Raggiunto al settimo anno, principalmente tramite passaparola e clienti abituali.
      icon: tabler:circle-check
    - title: Programma di esportazione internazionale
      description: Consegna in oltre 50 paesi con partner di supporto locali in cinque continenti.
      icon: tabler:world
    - title: Una nuova struttura operativa globale
      description: 'A settembre 2026 la gestione del marchio è passata da Qingdao Vatrad Group ad Aquafarer LLC (Nuovo Messico, USA); l’hub produttivo di Qingdao continua a occuparsi di R&S, produzione ed esportazione diretta dallo stabilimento.'
      icon: tabler:building-skyscraper

features2_locations:
  title: Le nostre sedi
  tagline: Trovaci
  columns: 3
  items:
    - title: Sede centrale e officina
      description: Parco industriale costiero, Edificio 4 – aperto lun–ven per visite su appuntamento.
    - title: Centro assistenza UE
      description: Porto mediterraneo – refit, riparazione e supporto garanzia per clienti europei.
    - title: Rete partner APAC
      description: Partner di assistenza autorizzati in Australia, Giappone, Singapore e Hong Kong.
brand_hub_tagline: Marchio
brand_hub_title: Scopri il nostro marchio
brand_hub_subtitle: Approfondisci la nostra competenza in ingegneria navale, presenza globale e i principi che ci guidano.
brand_hub_cards:
  - title: Competenza Navale
    desc: 'Decenni di scienza dei materiali, produzione di precisione e test reali — dalla fabbricazione di PVC/Hypalon al design di scafi a V profondo e tecnologia drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'Scopri di più →'
  - title: Presenza Globale
    desc: 'Spedizione in oltre 50 paesi dal nostro stabilimento di Qingdao con partner di servizio autorizzati in Europa, Asia-Pacifico e Americhe.'
    link: /brand-global-presence
    link_label: 'Scopri di più →'
  - title: Perché Aquafarer
    desc: 'Integrazione verticale, doppia certificazione (ISO 9001 + BSCI), conformità CE e MOQ bassi — costruito per marchi, distributori e agenzie governative.'
    link: /brand-why-aquafarer
    link_label: 'Scopri di più →'

production_section:
  tagline: 'Eccellenza produttiva'
  title: 'Artigianato raffinato garantito'
  description: 'La linea di produzione Aquafarer è dedicata alla realizzazione di prodotti gonfiabili di alta qualità, durevoli e ad alte prestazioni.'
  cards:
    - title: 'Team di tecnici esperti'
      items:
        - 'Conoscenza professionale di PVC, Hypalon e materiali marini'
        - 'Artigianalità precisa nel taglio, nella saldatura e nell’installazione degli accessori'
        - 'Formazione continua sulle più recenti tecnologie di produzione'
    - title: 'Attrezzature di produzione avanzate'
      items:
        - 'Macchine da taglio CNC per un taglio preciso dei tessuti con errori minimi'
        - 'Saldatura termica/a freddo di alta precisione per cuciture ermetiche e durevoli'
        - 'Attrezzature professionali per prove di tenuta e resistenza a trazione'
    - title: 'Sistema di gestione consolidato'
      items:
        - 'Processi produttivi standardizzati con standard di qualità chiari'
        - 'Filosofia di produzione lean che riduce gli sprechi e migliora l’efficienza'
        - 'Gestione efficiente della catena di fornitura con partnership affidabili'
    - title: 'Controllo qualità rigoroso'
      items:
        - 'Sistema di gestione della qualità certificato'
        - 'Ispezione in più fasi: materie prime, in produzione, controllo finale'
        - 'Rigide prove di tenuta e durabilità prima della spedizione'

global_ops_section:
  tagline: 'Architettura operativa globale'
  title_html: 'Un marchio, <span class="text-white/90">due poli</span>'
  description_html: 'Da settembre 2026 Aquafarer è gestito da <strong class="text-white">Aquafarer LLC</strong> (Nuovo Messico, USA) — l’entità globale per distribuzione, vendite B2B commerciali, contratti, fatturazione e assistenza post-vendita. R&S, produzione e controllo qualità restano allo <strong class="text-white">Hub di Produzione Aquafarer Qingdao</strong>, che spedisce ogni ordine direttamente dallo stabilimento, FOB Qingdao. La transizione ha cambiato chi firma il vostro contratto — non chi costruisce la vostra imbarcazione.'
  stats:
    - value: '2,400+'
      label: 'Scafi consegnati in tutto il mondo'
    - value: '50+'
      label: 'Paesi di esportazione'
    - value: '10+'
      label: 'Anni di produzione'
