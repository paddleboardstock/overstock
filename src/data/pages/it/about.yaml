hero:
  tagline: Chi siamo
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabbrica e officina di Paddle Board Overstock
  title: Informazioni su <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: Tavole SUP gonfiabili nuovissime a prezzi in eccesso e di liquidazione, supportate dalla nostra produzione Weihai dal 2012, vendita all'ingrosso di modelli misti per piccoli rivenditori e spedizione flessibile in tutto il mondo.
stats:
  title: Dai numeri
  columns: 4
  stats:
    - title: Capacità di produzione annuale
      amount: 15.000 unità
    - title: Paesi spediti
      amount: 50+
    - title: Tavole testate a pressione
      amount: 100%
    - title: Ingegneri di ricerca e sviluppo
      amount: 14+
features3_what_we_build:
  title: Cosa costruiamo
  subtitle: 'Una linea di prodotti mirata che conosciamo a fondo: nessun esperimento finito a metà, nessuna progettazione di badge.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Tavole SUP gonfiabili
      description: SUP all-around e touring da 10' a 12 piedi. Stabili, rigidi e completi di pompa, pagaia e leash.
      icon: tabler:swimming
    - title: Mazzi della serie Art
      description: 'Grafica esclusiva del mazzo EVA: Cheetah Surge, Tropical Breeze, Medusa Glow e altro ancora.'
      icon: tabler:hexagons
    - title: Pacchetti completi
      description: 'Ogni tavola viene spedita come kit completo: tavola, zaino, pompa, pagaia, pinna, leash e kit di riparazione.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessori
      description: Pompe, pagaie, guinzagli, kit di riparazione e borse impermeabili. Il tutto abbinato alle nostre tavole.
      icon: tabler:tool
    - title: Cura e riparazione
      description: Supporto interno per riparazioni, pezzi di ricambio e guida alla manutenzione per mantenere la tua tavola in acqua per anni.
      icon: tabler:settings
    - title: Club e flotte a noleggio
      description: Allestimento in serie per club, scuole e flotte a noleggio con supporto diretto in fabbrica.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Discussione sulla progettazione della scheda e sull'ingegneria
steps2_values:
  title: I nostri valori
  subtitle: Tre principi che fin dal primo giorno plasmano ogni prodotto.
  items:
    - title: Costruisci come se trasportasse la tua famiglia
      description: Ogni tavola, cucitura e valvola viene trattata come se fosse utilizzata dalle nostre stesse famiglie.
      icon: tabler:heart
    - title: Ingegnere prima di vendere
      description: Se una specifica è sbagliata, cambiamo la specifica, mai il cliente.
      icon: tabler:settings
    - title: Supporto che dura oltre la garanzia
      description: Le schede che abbiamo costruito anni fa ci chiamano ancora per i pezzi di ricambio e noi continuiamo a ritirarle.
      icon: tabler:headset
steps2_milestones:
  title: Pietre miliari
  subtitle: Una versione breve della storia del Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fondata a Weihai
      description: Un workshop costiero dedicato alle tavole SUP gonfiabili drop-stitch.
      icon: tabler:building-factory
    - title: Polo produttivo di 12.000 m²
      description: Ampliamento a una struttura dedicata con capacità di produzione di saldatura RF e punto goccia.
      icon: tabler:circle-check
    - title: Programma di esportazione internazionale
      description: Ora spediamo in oltre 50 paesi con opzioni di trasporto espresso e marittimo.
      icon: tabler:world
    - title: Focus su overstock e vendita all'ingrosso
      description: Nel settembre 2026, le operazioni del marchio sono state trasferite da Qingdao Vatrad Group a Weihai Dongjilian Co., Ltd.; il polo produttivo di Weihai continua la ricerca e sviluppo, la produzione e la spedizione diretta in fabbrica.
      icon: tabler:building-skyscraper
features2_locations:
  title: Le nostre sedi
  tagline: Trovaci
  columns: 3
  items:
    - title: Sede e officina
      description: Parco industriale costiero, edificio 4 - aperto dal lunedì al venerdì per visite su appuntamento.
    - title: Centro servizi UE
      description: 'Porto del Mediterraneo: refitting, riparazione e supporto in garanzia per i clienti europei.'
    - title: Rete di partner APAC
      description: Partner di assistenza autorizzati in Australia, Giappone, Singapore e Hong Kong.
brand_hub_tagline: Marca
brand_hub_title: Esplora il nostro marchio
brand_hub_subtitle: Approfondisci la nostra esperienza nell'ingegneria navale, la nostra presenza globale e i principi che ci guidano.
brand_hub_cards:
  - title: Competenza marina
    desc: 'Decenni di scienza dei materiali, produzione di precisione e test nel mondo reale: dalle anime drop-stitch alle giunture saldate e alle tavole della serie artistica.'
    link: /brand-marine-expertise
    link_label: Scopri di più →
  - title: Perché il paddle board è in stock
    desc: 'Prezzi diretti dalla fabbrica, tavole testate al 100% sotto pressione e una garanzia di 2 anni: pensata per canoisti, famiglie e amanti degli sport acquatici.'
    link: /brand-why-paddleboardoverstock
    link_label: Scopri di più →
