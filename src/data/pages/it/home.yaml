features:
  id: features
  tagline: Perché acquistare da Paddle Board Overstock
  title: Vera Fabbrica,<br />Vero Risparmio
  subtitle: 'Pacchetti SUP in eccesso e in liquidazione diretti in fabbrica: qualità comprovata senza sovrapprezzo al dettaglio.'
  columns: 2
  items:
    - title: Fino al 60% di sconto sul prezzo al dettaglio
      description: Vendiamo eccedenze di fabbrica e lotti in liquidazione direttamente — senza intermediari, senza ricarico al dettaglio. Gli stessi pannelli che altrove vengono venduti a prezzo pieno, qui a prezzi di liquidazione.
      icon: tabler:rocket
    - title: Pacchetti completi
      description: 'Ogni SUP viene fornito come un pacchetto completo: tavola, zaino da viaggio, pompa manuale, pagaia regolabile, pinna rimovibile, leash a spirale e kit di riparazione.'
      icon: tabler:clipboard-list
    - title: Qualità comprovata
      description: Ogni tavola è testata al 100% a pressione nominale di 1,25x PSI prima della spedizione. Tasso di assenza di difetti del 99,3% per ogni lotto.
      icon: tabler:shield-check
    - title: Nessun ordine minimo
      description: 'Acquista esattamente ciò di cui hai bisogno. Aggiungi una tavola al carrello, fai il check-out, fatto: nessun minimo, nessun processo di preventivo, nessuna attesa.'
      icon: tabler:adjustments
    - title: Spedizione veloce in tutto il mondo
      description: Gli ordini in stock vengono spediti da Weihai entro 2-3 giorni lavorativi. Consegna tracciata in 50+ paesi in tutta l'UE, Nord America, Asia-Pacifico e oltre.
      icon: tabler:truck-delivery
    - title: Garanzia di 2 anni SUP
      description: Ogni tavola SUP e accessorio è coperto per 2 anni — drop-stitch cuciture, valvole di gonfiaggio e accessori inclusi. Le richieste vengono risolte in giorni, non in settimane.
      icon: tabler:lifebuoy
