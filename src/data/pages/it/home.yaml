faqs:
  title: SUP FAQ su ordini e prodotti
  subtitle: Domande comuni sulle nostre tavole di salto SUP , ordini, pagamento, spedizione e garanzia.
  columns: 2
  items:
    - title: È SUP difficile imparare?
      description: Per niente. La maggior parte dei principianti si alza in piedi e rema già nella prima sessione. Le nostre tavole all-around SUP dispongono di piattaforme stabili extra larghe progettate appositamente per chi è alle prime armi. Se inizi su acque calme, sarai in crociera in pochi minuti.
      icon: tabler:swimming
      category: ---
    - title: Qual è il limite di peso?
      description: La nostra struttura SUPs completa supporta fino a 220 libbre e le piattaforme da turismo e yoga supportano fino a 250 libbre. Ogni pagina prodotto indica la capacità di peso esatta del rider così puoi adattare la tavola alle tue esigenze.
      icon: tabler:adjustments
      category: ---
    - title: Posso viaggiare con un gonfiabile SUP?
      description: Assolutamente. Ogni Paddle Board Overstock tavola viene caricata in una custodia grande quanto uno zaino. Con soli 18-22 libbre, è facile da portare in spiaggia, lago o attraverso i terminal aeroportuali. Controlla la politica sui bagagli della tua compagnia aerea prima di viaggiare.
      icon: tabler:truck-delivery
      category: ---
    - title: Cosa c'è nella scatola?
      description: Paddle Board Overstock SUP Ognuna include la tavola, uno zaino da viaggio, una pompa manuale, una pagaia regolabile, una pinna rimovibile, un guinzaglio a molle e un kit di riparazione.
      icon: tabler:clipboard-list
      category: ---
    - title: Perché i vostri prezzi sono più bassi rispetto al dettaglio?
      description: Vendiamo eccedenze di fabbrica, ovvero tavole nuove di zecca rimaste da ordini di produzione completati, provenienti dalla nostra base di produzione di Weihai e da partner di produzione selezionati. Nessun margine di vendita al dettaglio e nessun intermediario significa pacchetti SUP completi con uno sconto fino al 60% sui prezzi al dettaglio tipici, con la stessa qualità testata sotto pressione.
      icon: tabler:shield-check
      category: ordini
    - title: Come faccio a effettuare un ordine e pagare?
      description: Aggiungi il tuo pacchetto SUP al carrello e procedi al pagamento in sicurezza con Stripe o PayPal. Accettiamo tutte le principali carte di credito e di debito. Ogni ordine viene confermato via email con una fattura completa.
      icon: tabler:file-text
      category: ordini
    - title: Spedite in tutto il mondo?
      description: Sì. Spediamo in 50+ paesi in tutta l'UE, Nord America, Asia-Pacifico, Medio Oriente e Africa. Gli ordini in magazzino vengono generalmente spediti entro 2-3 giorni lavorativi con tracciamento fornito per ogni pacco.
      icon: tabler:route
      category: ordini
    - title: Quale garanzia includono le schede SUP?
      description: 'Ogni scheda SUP e accessorio è coperto da una garanzia di 2 anni — inclusi la scheda stessa, le cuciture drop-stitch e le valvole di gonfiaggio. Le richieste vengono risolte in pochi giorni, non settimane: invia la richiesta online e noi ripariamo o sostituiamo.'
      icon: tabler:lifebuoy
      category: ordini
