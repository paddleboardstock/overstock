content_workshop:
  isReversed: true
  tagline: Forza di fabbrica
  title: Perché i nostri prezzi di liquidazione<br />Sono veri
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Fabbrica Reale, Risparmi Reali — Ogni Tavola Spedita dalla Nostra Struttura di Weihai</h3>
  items:
    - title: Stesse linee di produzione dei grandi marchi
      description: La nostra fabbrica di Weihai di 12.000 m² produce schede per marchi internazionali e per i nostri lotti in eccesso sulle stesse linee con gli stessi materiali.
    - title: Testato al 100% di pressione
      description: Ogni scheda è pressurizzata a 1,25x il valore nominale PSI e mantenuta prima della spedizione. Tasso di difetti del 99,3% per AQL 2,5 / ISO 2859.
    - title: Senza intermediari
      description: 'Le tavole vengono spedite direttamente dalla fabbrica alla tua porta. Nessun aumento da parte del distributore, nessun aumento da parte del dettagliante: è così che i prezzi di liquidazione restano fino al 60% inferiori al prezzo al dettaglio.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock fabbrica di Weihai di 12.000 m² con linee di produzione di SUP gonfiabili
content_compliance:
  tagline: Conformità e Verifica della Qualità
  title: Qualità certificata,<br />Documentato
  subtitle: Ogni dichiarazione di conformità è supportata da certificati e documentazione specifica per il modello disponibili per la tua verifica.
  items:
    - title: ISO9001:2015
      description: Sistema di gestione della qualità certificato da TÜV Rheinland/SGS. Audit di sorveglianza annuali. Processi QC documentati dal materiale in ingresso al rilascio della spedizione.
      icon: tabler:certificate
    - title: CE Certificato
      description: 13 modelli CE certificati SUP secondo le direttive UE applicabili, ciascuno con una Dichiarazione di Conformità specifica del modello e dati della targhetta del costruttore.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Tutti i PVC e i materiali adesivi sono conformi al regolamento UE REACH. Marcatura UKCA disponibile per il mercato del Regno Unito. Schede di sicurezza dei materiali su richiesta.
      icon: tabler:shield-check
    - title: Garanzia di 2 anni SUP
      description: Ogni tavola SUP e accessorio coperti per 2 anni — cuciture drop-stitch, valvole di gonfiaggio e accessori inclusi. Reclami risolti rapidamente.
      icon: tabler:lifebuoy
