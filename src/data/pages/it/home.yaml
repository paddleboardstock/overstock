content_customer_types:
  tagline: Per chi produciamo
  title: 'Pensato per i buyer B2B<br />— non per il consumatore finale'
  subtitle: 'Aquafarer produce per quattro profili di cliente. Ognuno ha priorità diverse — e le copriamo tutte.'
  items:
    - title: Titolari di marchio / Private Label
      description: 'Progettazione su misura, grafiche a marchio proprio, documentazione di conformità con il vostro brand e supporto tecnico dedicato, dal concept al container.'
      icon: tabler:palette
      cta: Richiedi un preventivo OEM/ODM
      cta_href: /request-quotation
    - title: Distributori / Grossisti
      description: "Protezione territoriale, prezzi all'ingrosso competitivi, kit di supporto marketing, formazione sul prodotto e documentazione di conformità completa per il vostro mercato."
      icon: tabler:world
      cta: Diventa rivenditore
      cta_href: /dealers-distributors
    - title: Resort / Noleggiatori
      description: 'Robustezza di livello commerciale, consulenza sulla dimensione della flotta, ordini container multimodello, strategia ricambi e dotazioni personalizzate con il marchio del resort.'
      icon: tabler:beach
      cta: Richiedi un pacchetto commerciale
      cta_href: /solutions/resorts
    - title: Soccorso / Istituzioni / Professionali
      description: "Costruzioni in Hypalon/CSM, opzioni di conformità SOLAS, certificazioni specifiche di progetto, supporto documentale per gare d'appalto e ingegneria sotto NDA."
      icon: tabler:shield
      cta: Parliamo del vostro progetto
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Capacità OEM/ODM
  title: 'Cosa ottenete<br />con Aquafarer'
  subtitle: 'Accesso diretto alla fabbrica con ingegneria, qualità e conformità integrate — non un intermediario.'
  columns: 2
  items:
    - title: Personalizzazione OEM/ODM
      description: "Progetto dello scafo, materiale dei tubi (PVC o Hypalon/CSM), layout consolle, sedute, branding, colori e imballaggio. Da piccole modifiche all'ingegneria totalmente su misura."
      icon: tabler:adjustments
    - title: MOQ bassi, campionatura rapida
      description: 'RIB: 2-5 unità (stampo esistente). SUP: 5-10 unità per SKU. Stampi dedicati: 200+ unità. Campioni di pre-produzione con il vostro marchio in 7-14 giorni.'
      icon: tabler:rocket
    - title: Qualità pronta per la produzione
      description: 'Ogni unità testata a 1,25× la pressione nominale per 24-48 ore. 99,3 % senza difetti secondo AQL 2,5 / ISO 2859. Checklist di 100 punti per ogni scafo.'
      icon: tabler:certificate
    - title: Documentazione di conformità completa
      description: 'CE secondo 2013/53/EU (RCD), ISO 9001:2015 (SGS), audit sociale BSCI, conformità REACH, marcatura UKCA. DoC e targa costruttore specifiche di ogni modello.'
      icon: tabler:file-certificate
    - title: Consegna in 30-45 giorni
      description: 'Produzione standard 30-45 giorni FOB Qingdao. Prototipi in 7-14 giorni. Produzione urgente disponibile. Piani di carico container e imballaggio ISPM-15 inclusi.'
      icon: tabler:truck-delivery
    - title: Assistenza e ricambi
      description: 'Garanzia 5 anni su barche, kayak e RIB, 2 anni su SUP e accessori. Fornitura ricambi con spedizione prioritaria. Supporto nella gestione delle garanzie.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Categorie di prodotti
  title: '5 categorie,<br />64 modelli certificati CE'
  subtitle: 'Dai tender RIB da 2,4 m ai SUP da 15 piedi — tutto prodotto nel nostro stabilimento ISO 9001 a Qingdao.'
  items:
    - title: Gommoni RIB
      description: 'Da 2,4 m a 7,0 m con scafi in alluminio o vetroresina. Tubi in PVC o Hypalon/CSM. CE secondo 2013/53/EU. Configurazioni pattugliamento, subacquee, soccorso e commerciali.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Barche gonfiabili
      description: 'Da 2,0 m a 5,0 m con pagliolato in alluminio, in multistrato marino o ad aria. Modelli pesca, diporto e tender.'
      icon: tabler:sailboat
      link: /products
    - title: SUP
      description: 'Da 9 a 15 piedi in Drop-Stitch da 4 e 6 pollici. Modelli all-round, touring, yoga e pesca. Disponibili in versione commerciale.'
      icon: tabler:swimming
      link: /products
    - title: Kayak
      description: 'Kayak gonfiabili da 1 a 3 posti. Modelli ricreativi e touring con opzione fondo Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Accessori di sicurezza
      description: 'Giubbotti salvagente certificati CE, sagole di salvataggio, kit di riparazione, pompe e luci di navigazione. Giubbotti approvati USCG Tipo III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Forza produttiva
  title: 'Produzione pronta<br />per gli audit'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² certificati ISO 9001 — produttore reale, non intermediario</h3>
  items:
    - title: 6 linee di produzione dedicate
      description: 'Linee separate per RIB, gommoni, SUP, kayak, dotazioni di sicurezza e OEM/ODM. Ognuna con punti di controllo qualità e pianificazione dedicati.'
    - title: 100 % testati in pressione
      description: 'Ogni camera gonfiata a 1,25× la pressione nominale e mantenuta 24-48 ore. Risultati collegati al numero di scafo (HIN).'
    - title: Tracciabilità per scafo
      description: 'Registri di produzione a livello HIN con oltre 21 campi per scafo: lotto materiale, identificativo del saldatore, esito del test di pressione, configurazione finale e destinazione.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Stabilimento Aquafarer di 12.000 m² certificato ISO 9001 a Qingdao, con linee di produzione RIB

content_compliance:
  tagline: Conformità e prove di qualità
  title: 'Documenti verificabili,<br />non solo parole'
  subtitle: 'Ogni dichiarazione di conformità è supportata da documentazione specifica di modello, disponibile per la vostra verifica.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: "Sistema di gestione per la qualità certificato da TÜV Rheinland/SGS. Audit di sorveglianza annuali. Processi QC documentati dall'ingresso dei materiali al rilascio della spedizione."
      icon: tabler:certificate
    - title: CE secondo 2013/53/EU (RCD)
      description: '64 modelli con Dichiarazioni di Conformità specifiche. Valutazione di conformità secondo i moduli applicabili. Registrazione HIN e targa costruttore per ogni scafo.'
      icon: tabler:file-certificate
    - title: Audit sociale BSCI
      description: 'Audit BSCI annuale condotto da SGS. Pratiche lavorative etiche, sicurezza sul lavoro e gestione ambientale verificate su tutto lo stabilimento.'
      icon: tabler:users
    - title: REACH e UKCA
      description: 'Tutti i materiali in PVC e gli adesivi sono conformi al regolamento REACH dell’UE. Marcatura UKCA disponibile per il mercato britannico. Schede di sicurezza disponibili su richiesta.'
      icon: tabler:shield-check

steps:
  title: Il processo OEM/ODM — dal brief al container
  items:
    - title: 'Fase 1: <span class="font-medium">Requisiti</span>'
      description: 'Condividete specifiche di prodotto, mercato di riferimento, quantità e requisiti di conformità. Il nostro team di ingegneria analizza tutto entro 48 ore.'
      icon: tabler:file-text
    - title: 'Fase 2: <span class="font-medium">Proposta</span>'
      description: 'Ricevete una proposta dettagliata con specifiche, opzioni materiali, MOQ, prezzi, tempi di consegna e perimetro di conformità per il vostro mercato.'
      icon: tabler:clipboard-list
    - title: 'Fase 3: <span class="font-medium">Prototipo</span>'
      description: 'Campione di pre-produzione con il vostro marchio in 7-14 giorni. Test qualità completi a 1,25× la pressione nominale. Costo del campione accreditato sulla produzione.'
      icon: tabler:settings
    - title: 'Fase 4: <span class="font-medium">Produzione</span>'
      description: "Produzione di 30-45 giorni FOB Qingdao dopo l'approvazione del campione. Punti di controllo in linea, test di pressione e ispezione finale di 100 punti su ogni unità."
      icon: tabler:building-factory
    - title: 'Fase 5: <span class="font-medium">Consegna</span>'
      description: 'Piano di carico container, imballaggio in legno ISPM-15, dossier di conformità e spedizione FOB Qingdao con documenti di export completi.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Processo produttivo OEM/ODM di Aquafarer, dalla progettazione al container

blog_latest:
  title: Approfondimenti di settore e tecnici
  information: |
    Guide alla conformità RCD, articoli sul processo OEM/ODM, confronti tra
    materiali e risorse per audit di fabbrica — dal team di ingegneria Aquafarer.

faqs:
  title: FAQ per gli acquisti B2B
  subtitle: 'Le domande più frequenti di brand, distributori e operatori commerciali sulla produzione OEM/ODM con Aquafarer.'
  columns: 2
  items:
    - title: Siete produttori o intermediari?
      description: 'Siamo uno stabilimento verticalmente integrato con controllo totale su qualità, materiali e tempi. Licenza commerciale e ambito produttivo verificabili durante un audit in fabbrica.'
      icon: tabler:building-factory
      category: all
    - title: Come funziona il vostro processo OEM/ODM?
      description: "Dall'analisi dei requisiti (48 h) alla proposta, poi prototipo (7-14 giorni) e produzione (30-45 giorni FOB Qingdao). Con supporto di ingegneria completo, documentazione di conformità e tracciabilità per scafo in ogni fase."
      icon: tabler:route
      category: all
    - title: Quali sono i vostri MOQ?
      description: 'RIB: 2-5 unità per modello (stampo esistente), 200+ per stampi dedicati. SUP: 5-10 unità per SKU. Ordini container multimodello disponibili. Ordini campione da 2-5 unità per la valutazione.'
      icon: tabler:sort-ascending
      category: all
    - title: Quali opzioni di personalizzazione offrite?
      description: "Progetto dello scafo, materiale dei tubi (PVC o Hypalon/CSM), diametro dei tubi, layout consolle, sedute, governo, impianto carburante, disposizione del ponte, colori del marchio, grafiche logo, design dei pad EVA, imballaggio retail e manuale d'uso a marchio."
      icon: tabler:adjustments
      category: all
    - title: Quali documenti di conformità fornite per il mio mercato?
      description: 'DoC CE secondo 2013/53/EU, marcatura UKCA, certificato ISO 9001 (SGS), rapporto di audit BSCI, conformità REACH, rapporti di prova dei materiali, registri dei test di pressione e targa costruttore specifica per modello. Documentazione specifica per mercato su richiesta.'
      icon: tabler:file-certificate
      category: all
    - title: Quali sono i tempi di campionatura e produzione?
      description: 'Campioni di pre-produzione: 7-14 giorni lavorativi. Produzione standard: 30-45 giorni FOB Qingdao. Produzione urgente disponibile con costo aggiuntivo. In alta stagione (marzo-giugno) i tempi possono allungarsi.'
      icon: tabler:clock
      category: all
    - title: Possiamo organizzare un audit in fabbrica o un video-tour in diretta?
      description: 'Sì. Gli audit in loco a Qingdao sono benvenuti con 3-5 giorni di preavviso. Video-tour in diretta via WhatsApp o Zoom disponibili subito. Ispezioni di terze parti (SGS, BV, TÜV) supportate.'
      icon: tabler:video
      category: all
    - title: Quali ispezioni qualità completate prima della spedizione?
      description: "Test di tenuta in pressione a 1,25× la nominale (24-48 h), prova di scollamento delle saldature, checklist di ispezione finale di 100 punti, verifica dimensionale, ispezione estetica, verifica della documentazione di conformità e test di integrità dell'imballaggio. Il tutto secondo procedure ISO 9001."
      icon: tabler:clipboard-check
      category: all

