content_workshop:
  isReversed: true
  tagline: Forza di fabbrica
  title: Perché i nostri prezzi di liquidazione<br />sono reali
  content: '<h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Reale fabbrica, risparmi reali: ogni tavola viene spedita dalla nostra struttura di Weihai</h3>'
  items:
    - title: Stesse linee di produzione dei grandi marchi
      description: La nostra fabbrica di Weihai di 12.000 m² produce schede per marchi internazionali e per i nostri lotti in eccesso sulle stesse linee con gli stessi materiali.
    - title: Testato al 100% di pressione
      description: Ogni tavola è pressurizzata a 1,25x PSI nominale e mantenuta prima della spedizione. Tasso di assenza di difetti del 99,3% per ogni lotto.
    - title: Senza intermediari
      description: 'Le schede vengono spedite in fabbrica direttamente a casa tua. Nessun intermediario, nessun ricarico al dettaglio: ecco perché i prezzi di liquidazione rimangono fino al 60% inferiori al prezzo di vendita al dettaglio.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock fabbrica di Weihai di 12.000 m² con linee di produzione di SUP gonfiabili
content_compliance:
  tagline: Qualità e test
  title: Qualità testata,<br />documentata
  subtitle: 'Ogni dichiarazione di qualità è supportata da numeri reali della nostra linea di produzione: test di pressione, registri dei lotti e tassi di difetti misurati.'
  items:
    - title: Testato a pressione al 100%.
      description: Ogni tavola viene gonfiata a 1,25x PSI nominale e trattenuta prima della spedizione. Se una cucitura, una valvola o un filo per punto goccia falliscono, la tavola non lascia mai la fabbrica.
      icon: tabler:shield-check
    - title: Tasso senza difetti del 99,3%.
      description: Misurato su ogni lotto di produzione. Il numero deriva dai nostri registri di ispezione finale, non dal marketing.
      icon: tabler:gauge
    - title: Tracciabilità dei lotti
      description: Ogni scheda riporta un codice del lotto di produzione, quindi le richieste di garanzia e i controlli di qualità risalgono ai materiali e alle serie esatte.
      icon: tabler:clipboard-check
    - title: Garanzia di 2 anni SUP
      description: Ogni tavola SUP e accessorio coperti per 2 anni — cuciture drop-stitch, valvole di gonfiaggio e accessori inclusi. Reclami risolti rapidamente.
      icon: tabler:lifebuoy
steps:
  title: Dal checkout all'acqua — come spedi il tuo ordine
  items:
    - title: 'Passaggio 1: <span class="font-medium">scegli la tua tavola</span>'
      description: Scegli tra modelli all-around, touring, yoga e bambini. Le nostre guide all'acquisto ti aiutano ad abbinare la dimensione e lo stile delle tavole al tuo cano.
      icon: tabler:clipboard-list
    - title: 'Passaggio 2: <span class="font-medium">Pagamento sicuro</span>'
      description: Paga in modo sicuro con Stripe o PayPal. Tutte le principali carte di credito e debito accettate. Nessun account necessario — la conferma dell'ordine arriva nella tua casella di posta.
      icon: tabler:file-text
    - title: 'Passaggio 3: <span class="font-medium">controllo qualità</span>'
      description: Ogni scheda è testata al 100% con una valutazione 1,25x PSI e confrontata con una lista di controllo qualità completa prima di essere imballata.
      icon: tabler:settings
    - title: 'Passaggio 4: <span class="font-medium">Invio rapido</span>'
      description: Gli ordini in magazzino vengono spediti dalla nostra fabbrica Weihai entro 2-3 giorni lavorativi. Gestione urgente disponibile per ordini urgenti.
      icon: tabler:building-factory
    - title: 'Passaggio 5: <span class="font-medium">consegna monitorata</span>'
      description: Spedizioni in tutto il mondo in 50+ paesi. La tua garanzia di 2 anni e il supporto post-vendita reattivo iniziano il giorno in cui arriva la tua scheda.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Processo d'ordine, dal checkout sicuro alla consegna tracciata a livello mondiale
