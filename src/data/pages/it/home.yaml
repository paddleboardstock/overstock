      description: Scegli tra modelli all-around, touring, yoga e bambini. Le nostre guide all'acquisto ti aiutano ad abbinare la dimensione e lo stile delle tavole al tuo cano.
      icon: tabler:clipboard-list
    - title: Passo 2:<span class="font-medium">Checkout sicuro</span>
      description: Paga in modo sicuro con Stripe o PayPal. Tutte le principali carte di credito e debito accettate. Nessun account necessario — la conferma dell'ordine arriva nella tua casella di posta.
      icon: tabler:file-text
    - title: Passo 3:<span class="font-medium">Ispezione di Qualità</span>
      description: Ogni scheda è testata al 100% con una valutazione 1,25x PSI e confrontata con una lista di controllo qualità completa prima di essere imballata.
      icon: tabler:settings
    - title: Passo 4:<span class="font-medium">Fast Dispatch</span>
      description: Gli ordini in magazzino vengono spediti dalla nostra fabbrica Weihai entro 2-3 giorni lavorativi. Gestione urgente disponibile per ordini urgenti.
      icon: tabler:building-factory
    - title: Passo 5:<span class="font-medium">Consegna su cingoli</span>
      description: Spedizioni in tutto il mondo in 50+ paesi. La tua garanzia di 2 anni e il supporto post-vendita reattivo iniziano il giorno in cui arriva la tua scheda.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Processo d'ordine, dal checkout sicuro alla consegna tracciata a livello mondiale
