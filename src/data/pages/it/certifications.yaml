hero:
  tagline: Certificazioni e Norme
  title: 'Certificazioni di Qualità<br />e Norme di Conformità'
  subtitle: "I prodotti Paddle Board Overstock sono fabbricati in conformità con le norme internazionali di sicurezza nautica, i sistemi di gestione della qualità e le normative ambientali."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Certificazioni di qualità Paddle Board Overstock e documentazione di conformità
content_certifications:
  tagline: Le Nostre Certificazioni
  title: 'Qualità Certificata,<br />Riconosciuta a Livello Globale'
  subtitle: "64 modelli certificati CE e certificazioni a livello di fabbrica dimostrano il nostro impegno per la qualità, la sicurezza e la responsabilità ambientale."
  items:
    - title: 'Certificato CE'
      description: "64 modelli certificati CE sono conformi ai requisiti di marcatura CE europea per le imbarcazioni da diporto, garantendo il rispetto degli standard di sicurezza, salute e protezione ambientale."
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: "Il nostro sistema di gestione della qualità è certificato ISO 9001:2015 e copre progettazione, produzione e distribuzione di imbarcazioni gonfiabili e attrezzature marine."
      icon: tabler:clipboard-check
    - title: 'Marcatura UKCA'
      description: "I prodotti venduti nel mercato britannico riportano la marcatura UKCA, che conferma la conformità alle normative del Regno Unito per attrezzature marine e moto d'acqua."
      icon: tabler:shield
    - title: 'Conforme BSCI'
      description: "Paddle Board Overstock è sottoposta ad audit BSCI (Business Social Compliance Initiative), a dimostrazione di pratiche produttive etiche, condizioni di lavoro eque e responsabilità nella catena di fornitura."
      icon: tabler:heart-handshake
    - title: 'Conforme REACH'
      description: "Tutti i materiali utilizzati nei prodotti Paddle Board Overstock rispettano il regolamento UE REACH sulla sicurezza chimica, garantendo l'assenza di sostanze soggette a restrizione nel nostro PVC, Hypalon o nei componenti."
      icon: tabler:flask
    - title: 'Test dei Materiali'
      description: "I tessuti vengono testati per resistenza alla trazione, resistenza allo strappo, degrado da UV e comportamento alle basse temperature. Ogni lotto di produzione viene campionato e verificato."
      icon: tabler:test-pipe
content_factory:
  tagline: Standard di Fabbrica
  title: 'Eccellenza Produttiva<br />— Realizzato secondo Specifica'
  subtitle: "Il nostro stabilimento di 12.000 m² opera con rigorosi protocolli di controllo qualità in ogni fase della produzione."
  list:
    - 'Ispezione dei Materiali in Entrata: Tutte le materie prime — tessuto PVC, Hypalon, alluminio, compensato, adesivi — vengono testate secondo le specifiche prima di entrare in produzione.'
    - 'Controllo Qualità in Lavorazione: Ogni fase produttiva ha punti di controllo qualità documentati. Resistenza delle saldature, allineamento delle cuciture, installazione delle valvole e coppia di serraggio vengono verificati in linea.'
    - 'Prove di Pressione: Ogni camera gonfiabile viene sottoposta a prova di pressione a 1,25× la pressione nominale per 24-48 ore. Il tasso di perdita deve essere pari a zero per superare la prova.'
    - "Ispezione Finale: I prodotti finiti vengono ispezionati per precisione dimensionale, finitura estetica, completezza degli accessori e integrità dell'imballaggio prima della spedizione."
    - 'Tracciabilità dei Lotti: Ogni prodotto porta un numero di serie collegato ai registri del lotto di produzione, consentendo la piena tracciabilità dalla materia prima al prodotto finito.'
content_safety:
  tagline: Norme di Sicurezza Nautica
  title: 'La Sicurezza Prima di Tutto<br />— Progettata per un Funzionamento Affidabile'
  subtitle: "I prodotti Paddle Board Overstock sono progettati e testati per soddisfare le norme internazionali di sicurezza nautica per uso commerciale e ricreativo."
  items:
    - title: 'ISO 6185'
      description: "Le imbarcazioni gonfiabili sono conformi alle norme ISO 6185 per costruzione, stabilità, galleggiabilità e capacità di carico."
      icon: tabler:sailboat
    - title: 'Norme ABYC'
      description: "I sistemi elettrici e di alimentazione seguono le norme ABYC (American Boat & Yacht Council) per un'installazione e un funzionamento sicuri."
      icon: tabler:bolt
    - title: 'Conformità SOLAS'
      description: "Le attrezzature di sicurezza e i dispositivi di salvataggio soddisfano i requisiti SOLAS (Safety of Life at Sea) ove applicabile."
      icon: tabler:lifebuoy
cta:
  title: "Hai bisogno di prodotti certificati per il tuo progetto?"
  subtitle: "Contatta il nostro team per discutere i requisiti di certificazione, la documentazione e la conformità per il tuo mercato."
  actions:
    - variant: primary
      text: Richiedi i documenti di certificazione
      href: /contact
    - text: Vedi la nostra pagina qualità
      href: /quality
