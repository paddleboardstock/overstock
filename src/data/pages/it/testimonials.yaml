testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Proprietario, Algarve Surf Academy
    location: Lagos, Portogallo
    content: 'Abbiamo iniziato con il pacchetto Club Starter per la nostra scuola di surf. 20 tavole, pagaie, giubbotti: tutto è arrivato entro 3 settimane. Dopo due stagioni siamo passati al pacchetto Pro. Il marchio personalizzato con il nostro logo è stato un punto di svolta per la nostra immagine professionale.'
    rating: 5
    product: Pacchetto iniziale del club
    source: solutions/clubs
  - category: clubs
    name: Proprietario del club
    title: Club di sport acquatici
    location: Phuket, Tailandia
    content: Il Pacchetto Iniziale per Club è stato il punto di partenza perfetto. Con la crescita del nostro business, Paddle Board Overstock è cresciuto con noi — stessa qualità, stessi prezzi, nessuna sorpresa. Siamo passati da 10 a 80 tavole in 18 mesi.
    rating: 5
    product: Pacchetto Club Starter + Pacchetto Premium
    source: success-stories
  - category: resorts
    name: Direttore Generale del Resort
    title: Resort sulla spiaggia a 5 stelle
    location: Grecia
    content: Paddle Board Overstock non ha solo consegnato tavole — ci ha aiutato a costruire un'esperienza completa per gli ospiti. Il nostro programma di sport acquatici è passato da zero a punto forte del resort in una stagione. 300+ prenotazioni settimanali e 180.000$ di fatturato annuale.
    rating: 5
    product: Pacchetto Resort Premium
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direttore dell'esperienza degli ospiti, Azure Bay Resorts
    location: Phuket, Tailandia
    content: Paddle Board Overstock ha progettato e attrezzato il nostro intero programma di attività sulla spiaggia in tre proprietà del resort. 120 SUPs, infrastrutture per la sicurezza e formazione del personale — tutto consegnato in un'unica spedizione. La partecipazione degli ospiti è aumentata del 60% nella prima stagione.
    rating: 5
    product: Pacchetto Resort Premium
    source: solutions/resorts
  - category: rental
    name: Daniele Okonkwo
    title: Proprietario, noleggio SUP Lakeland
    location: Ontario, Canada
    content: Stavo noleggiando 5 tavole da un negozio locale e perdevo il 60% delle mie entrate con loro. Paddle Board Overstock mi ha aiutato a costruire la mia flotta di 15 SUPs. Il calcolatore ROI mostrava il pareggio in 4 mesi — ne sono bastati 3. Ora sto espandendo a 30 tavole.
    rating: 5
    product: Kit di avvio della flotta
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direttore delle operazioni, Adriatic Adventure Tours
    location: Dubrovnik, Croazia
    content: Abbiamo equipaggiato l'intera flotta a noleggio SUP con tavole Paddle Board Overstock — 30 tavole in tre location. Dopo due stagioni, zero guasti. La qualità costante in ogni lotto ha reso la nostra scelta facile, e il loro team ha persino abbinato i colori al nostro marchio.
    rating: 5
    product: Pacchetto Flotta Noleggio
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Proprietaria, Noleggio SUP Lago di Garda
    location: Lago di Garda, Italia
    content: Le nostre tavole a noleggio escono cinque volte al giorno in alta stagione. Da quando siamo passati a Paddle Board Overstock, le lamentele per danni sono quasi scomparse, e i clienti continuano a chiedere dove possono comprare la loro tavola.
    rating: 5
    product: Pacchetto Flotta Noleggio
    source: solutions/rental-business
  - category: consumers
    name: Sara K.
    title: Proprietario di SUP per la prima volta
    location: Lago Tahoe, Stati Uniti
    content: Stabile anche per un principiante assoluto. L'ho preso sul lago il primo giorno e non è mai caduto. Il pacchetto completo con pompa e pagaia significava che ero in acqua 20 minuti dopo l'apertura della scatola.
    rating: 5
    product: SUP Esploratore 11
  - category: consumers
    name: James Thornton
    title: Proprietario SUP Explorer 11
    location: Vancouver, Canada
    content: Come acquirente per la prima volta, ero nervoso per l'ordine dall'estero. La qualità della costruzione parlava da sé nel momento in cui l'ho aperta — rigida, cuciture perfette, ed è arrivata in soli 6 giorni.
    rating: 5
    product: SUP Esploratore 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Paddler del weekend
    location: Florida, Stati Uniti
    content: "Qualità costruttiva solida. Gestisce il taglio costiero molto meglio di quanto mi aspettassi da un gommone. L'ho messo nel bagagliaio della macchina per un viaggio di fine settimana: si è gonfiato sulla rampa in meno di 4 minuti."
    rating: 5
    product: SUP Brezza Tropicale
