testimonials:
  - category: club
    name: Ricardo Santos
    title: Proprietario, Algarve Surf Academy
    location: Lagos, Portogallo
    content: 'Abbiamo iniziato con il pacchetto Club Starter per la nostra scuola di surf. 20 tavole, pagaie, giubbotti: tutto è arrivato entro 3 settimane. Dopo due stagioni siamo passati al pacchetto Pro. Il marchio personalizzato con il nostro logo è stato un punto di svolta per la nostra immagine professionale.'
    rating: 5
    product: Pacchetto iniziale del club
    source: solutions/clubs
  - category: club
    name: Proprietario del club
    title: Club di sport acquatici
    location: Phuket, Tailandia
    content: 'Il pacchetto Club Starter è stato il punto di ingresso perfetto. Man mano che la nostra attività cresceva, Aquafarer cresceva con noi: stessa qualità, stessi prezzi, nessuna sorpresa. Siamo passati da 10 a 80 schede in 18 mesi.'
    rating: 5
    product: Pacchetto Club Starter + Pacchetto Premium
    source: success-stories
  - category: resort
    name: Direttore Generale del Resort
    title: Resort sulla spiaggia a 5 stelle
    location: Grecia
    content: "Aquafarer non si è limitato a fornire tavole: ci ha aiutato a costruire un'esperienza completa per gli ospiti. Il nostro programma di sport acquatici è passato da zero a diventare il momento clou del resort in una sola stagione. Oltre 300 prenotazioni settimanali e $ 180.000 di entrate annuali."
    rating: 5
    product: Pacchetto Resort Premium
    source: success-stories
  - category: resort
    name: Sophie Laurent
    title: Direttore dell'esperienza degli ospiti, Azure Bay Resorts
    location: Phuket, Tailandia
    content: Aquafarer ha progettato e attrezzato il nostro intero programma di attività in spiaggia in tre resort. 80 SUP, 40 kayak, infrastrutture di sicurezza e formazione del personale, tutto consegnato in un'unica spedizione. La partecipazione degli ospiti è aumentata del 60% nella prima stagione.
    rating: 5
    product: Pacchetto Resort Premium
    source: solutions/resorts
  - category: imprenditori
    name: Michele Parco
    title: Fondatore, Shoreline Paddle Co.
    location: California, Stati Uniti
    content: Ho lanciato il mio marchio SUP con zero esperienza nel settore. Il team di Aquafarer mi ha guidato dalla selezione del prodotto alla progettazione e al confezionamento del logo personalizzato. Il mio primo contenitore è arrivato in 11 settimane e l'ho esaurito in 3 mesi su Amazon.
    rating: 5
    product: Lancio del marchio iniziale
    source: solutions/entrepreneurs
  - category: imprenditori
    name: Fondatore
    title: Marchio SUP australiano
    location: Australia
    content: Avevo l’idea del marchio ma nessuna conoscenza della produzione. Aquafarer mi ha letteralmente tenuto per mano durante l'intero processo, dalla scelta del design giusto della tavola all'unboxing della mia prima spedizione. 90 giorni dal sogno alla consegna.
    rating: 5
    product: Pacchetto lancio marchio
    source: success-stories
  - category: noleggio
    name: Daniele Okonkwo
    title: Proprietario, noleggio SUP Lakeland
    location: Ontario, Canada
    content: 'Stavo noleggiando 5 tavole da un negozio locale e perdevo il 60% delle mie entrate a causa loro. Aquafarer mi ha aiutato a costruire la mia flotta di 15 SUP. Il calcolatore del ROI ha mostrato il pareggio in 4 mesi: ce ne sono voluti 3. Ora mi sto espandendo a 30 schede.'
    rating: 5
    product: Kit di avvio della flotta
    source: solutions/rental-business
  - category: noleggio
    name: Marco Valenti
    title: Direttore delle operazioni, Adriatic Adventure Tours
    location: Dubrovnik, Croazia
    content: "Abbiamo attrezzato la nostra intera flotta a noleggio con gommoni Aquafarer: 12 barche in tre località. Due stagioni dopo, zero fallimenti. La documentazione di certificazione CE ha reso l'approvazione dell'assicurazione senza intoppi. Il loro team di ingegneri ha persino personalizzato i colori dei tubi."
    rating: 5
    product: Kit di espansione della flotta
    source: trust
  - category: noleggio
    name: Il tenente comandante Andres Reyes
    title: Ufficiale degli appalti marittimi, ausiliario della guardia costiera filippina
    location: Manila, Filippine
    content: 'Gestiamo 24 RIB Aquafarer nella nostra flotta di pattugliamento costiero. Il loro processo di controllo qualità è coerente in ogni lotto: stessa qualità di cucitura, stesso posizionamento della valvola, stessa pressione nominale ogni volta. Questa ripetibilità è importante quando la vita dipende dalle apparecchiature.'
    rating: 5
    product: Flotta di pattuglia RIB
    source: trust
  - category: consumatori
    name: Sara K.
    title: Proprietario di SUP per la prima volta
    location: Lago Tahoe, Stati Uniti
    content: Stabile anche per un principiante assoluto. L'ho preso sul lago il primo giorno e non è mai caduto. Il pacchetto completo con pompa e pagaia significava che ero in acqua 20 minuti dopo l'apertura della scatola.
    rating: 5
    product: SUP Explorer 11
  - category: consumatori
    name: James Thornton
    title: Proprietario SUP Explorer 11
    location: Vancouver, Canada
    content: Come acquirente per la prima volta, ero nervoso per gli ordini di qualità dall'estero. La documentazione ISO e i rapporti dei test di terze parti che hanno condiviso prima ancora che lo chiedessi mi hanno dato completa fiducia. La tavola è arrivata in 6 giorni e ha superato le mie aspettative.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumatori
    name: Mike R.
    title: Canoista ricreativo
    location: Florida, Stati Uniti
    content: "Qualità costruttiva solida. Gestisce il taglio costiero molto meglio di quanto mi aspettassi da un gommone. L'ho messo nel bagagliaio della macchina per un viaggio di fine settimana: si è gonfiato sulla rampa in meno di 4 minuti."
    rating: 5
    product: Kayak gonfiabile
