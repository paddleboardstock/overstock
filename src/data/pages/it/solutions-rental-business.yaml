testimonial:
  content: Stavo prendendo in affitto 5 tavole da un negozio locale e perdevo il 60% dei miei guadagni con loro. Paddle Board Overstock mi ha aiutato a costruire la mia flotta di 15 SUPs. Il calcolatore ROI che mi hanno fornito mostrava che sarei arrivato al pareggio in 4 mesi — ci sono voluti in realtà 3. Ora sto espandendo a 30 tavole.
  name: Daniele Okonkwo
  title: Proprietario, Lakeland SUP Rentals - Ontario, Canada
content_segments:
  tagline: Profili di noleggio
  title: Soluzioni per il Noleggio di Sport Acquatici<br />Per tipo di operatore
  subtitle: 'Diverse operazioni di noleggio hanno esigenze diverse: dai piccoli noleggi di SUP sulla spiaggia ai centri di sport acquatici resort su larga scala. Personalizziamo di conseguenza i nostri pacchetti di attrezzature e il modello di supporto.'
  items:
    - title: Noleggio SUP sulla spiaggia e sul lago
      subtitle: Operazioni ad alto volume e a bassa complessità
      description: Operatori che noleggiano tavole da paddle in piedi direttamente ai bagnanti e ai visitatori dei laghi. La tua priorità è minimizzare i tempi di rotazione tra i noleggi, mantenere l'attrezzatura in uso e gestire i picchi di domanda stagionali con un ingombro di deposito ridotto.
      features:
        - Flotte gonfiabili SUP che si ripiegano — nessun molo o rimorchio necessario
        - Di qualità commerciale PVC valutato per 100+ cicli di noleggio per stagione
        - Tessuto ad asciugatura rapida e resistente a UV per essere pronto al noleggio lo stesso giorno
        - Intervalli della scheda codificati a colori per una facile identificazione della flotta
    - title: Resort e hotel Centri di sport acquatici
      subtitle: Esperienza degli ospiti e allineamento del marchio
      description: Resort e hotel che offrono sport acquatici come servizi in loco. Le attrezzature devono avere un aspetto premium, funzionare in modo affidabile per gli ospiti da principianti a intermedi e integrarsi con i flussi di lavoro di prenotazione e fatturazione delle attività esistenti del resort.
      features:
        - Tavole e giubbotti di salvataggio personalizzati con il marchio SUP e coordinati con i colori del resort
        - 'Flotta mista: all-around, touring e serie artistica SUPs'
        - Soluzioni silenziose e senza carburante per il gonfiaggio elettrico sulla spiaggia
        - Inclusi formazione del personale e onboarding per la manutenzione
    - title: Noleggi Boutique e Mobile SUP
      subtitle: Servizi di noleggio pop-up e basati sulla consegna
      description: Operatori che portano le tavole direttamente al cliente — consegne sulla spiaggia dell'hotel, stazioni di noleggio pop-up durante eventi e configurazioni mobili. L'attrezzatura deve essere rapida da distribuire, facile da trasportare e presentabile a prima vista, con dimensioni della flotta flessibili per eventi e domanda stagionale.
      features:
        - Trasporto delle tavole tipo zaino — nessun rimorchio necessario
        - Gonfiaggio rapido per allestimenti su richiesta in meno di 15 minuti
        - Attrezzatura presentabile che appare di alta qualità a prima vista
        - Dimensioni della flotta flessibili per eventi e domanda stagionale
    - title: Operatori di tour e avventure
      subtitle: Flotte di escursioni guidate
      description: Operatori che conducono tour guidati di sport acquatici — safari SUP, escursioni snorkeling e esplorazioni costiere. L'attrezzatura deve essere abbastanza stabile per ospiti principianti, facile da pulire rapidamente tra un gruppo e l'altro, e abbastanza resistente per l'uso quotidiano guidato in diverse condizioni dell'acqua.
      features:
        - Piattaforme SUP extra-stabili (32" di larghezza+) per principianti
        - Piattaforme extra-large e stabili per foto di coppie/gruppi durante il tour
        - Capacità integrata per attrezzatura da snorkeling, dry bag e cooler
        - Pacchetti di attrezzatura di sicurezza per operazioni turistiche commerciali
