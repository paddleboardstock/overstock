        description: Mix di all-around, touring e serie artistiche SUPs per soddisfare le diverse preferenze degli ospiti
      - title: Prezzi per flotte
        description: Prezzi a livelli per flotte per ordini di 20+ unità con tariffe logistiche preferenziali
      - title: Marchio personalizzato
        description: Stampa del logo su attrezzature, giubbotti di salvataggio firmati e opzioni di colore personalizzate per la tua flotta a noleggio
      - title: Programma di manutenzione
