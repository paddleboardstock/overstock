testimonial:
  content: 'Stavo noleggiando 5 tavole da un negozio locale e perdevo il 60% delle mie entrate a causa loro. Paddle Board Overstock mi ha aiutato a costruire la mia flotta di 15 SUP. Il calcolatore del ROI che mi hanno fornito mostrava che avrei raggiunto il pareggio in 4 mesi: in realtà ce ne sono voluti 3. Ora mi sto espandendo a 30 tavole e aggiungendo kayak.'
  name: Daniele Okonkwo
  title: Proprietario, Lakeland SUP Rentals - Ontario, Canada
content_segments:
  tagline: Profili di noleggio
  title: Soluzioni di noleggio di sport acquatici<br />Per tipo di operatore
  subtitle: 'Diverse operazioni di noleggio hanno esigenze diverse: dai piccoli noleggi di SUP sulla spiaggia ai centri di sport acquatici resort su larga scala. Personalizziamo di conseguenza i nostri pacchetti di attrezzature e il modello di supporto.'
  items:
    - title: Noleggio SUP sulla spiaggia e sul lago
      subtitle: Operazioni ad alto volume e a bassa complessità
      description: Operatori che noleggiano stand up paddle e kayak direttamente ai bagnanti e ai visitatori del lago. La tua priorità è ridurre al minimo i tempi di consegna tra i noleggi, mantenere le attrezzature in rotazione e gestire i picchi di domanda stagionale con un ingombro di stoccaggio ridotto.
      features:
        - Flotte di SUP gonfiabili che si ripiegano in piano — senza bisogno di molo o rimorchio
        - PVC di grado commerciale certificato per oltre 100 cicli di noleggio a stagione
        - Tessuto a rapida asciugatura e resistente ai raggi UV per la ridisponibilità nello stesso giorno
        - Linee di tavole con codice colore per un'identificazione facile della flotta
    - title: Resort e hotel Centri di sport acquatici
      subtitle: Esperienza degli ospiti e allineamento del marchio
      description: Resort e hotel che offrono sport acquatici come servizi in loco. Le attrezzature devono avere un aspetto premium, funzionare in modo affidabile per gli ospiti da principianti a intermedi e integrarsi con i flussi di lavoro di prenotazione e fatturazione delle attività esistenti del resort.
      features:
        - Tavole SUP e giubbotti salvagita personalizzati con i colori della struttura
        - 'Flotta mista: SUP, kayak, pedalò e piccoli tender RIB'
        - Soluzioni di pompe elettriche silenziose e senza carburante per il gonfiaggio in spiaggia
        - Formazione del personale e avvio alla manutenzione inclusi
    - title: Operatori di noleggio barche e gommoni
      subtitle: Flotte di noleggio di navi di livello commerciale
      description: Operatori che noleggiano imbarcazioni a motore - tender RIB, gommoni e piccoli runabout - a ore o mezza giornata. La tua flotta deve soddisfare le normative sulla sicurezza marittima, resistere all'uso intenso da parte degli ospiti e ridurre al minimo i tempi di inattività meccanica tra i charter.
      features:
        - Pacchetti RIB con specchi di poppa pronti per fuoribordo da 30–90 CV
        - Pannelli di pavimento in compensato di grado marino per un'integrità strutturale a lungo termine
        - Sistemi di valvole a lancio rapido per un ricambio più veloce
        - Kit di ricambi + supporto tecnico SLA su chiamata
    - title: Operatori di tour e avventure
      subtitle: Flotte di escursioni guidate
      description: "Operatori che organizzano tour guidati di sport acquatici: safari in SUP, kayak in grotta, escursioni di snorkeling o tour in RIB da un'isola all'altra. L'attrezzatura deve essere sufficientemente stabile per gli ospiti alle prime armi del tour, veloce da pulire tra i gruppi e sufficientemente resistente per l'uso guidato quotidiano in diverse condizioni dell'acqua."
      features:
        - Piattaforme SUP extra-stabili (larghezza di 82 cm e oltre) per chi inizia
        - Opzioni kayak tandem per configurazioni di tour di coppia o di gruppo
        - Capacità di carico integrata per attrezzatura da snorkeling, borse stagne e borse frigo
        - Documentazione di conformità CE + USCG per le operazioni commerciali
