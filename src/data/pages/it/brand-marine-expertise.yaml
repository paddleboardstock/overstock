hero:
  tagline: Competenza marina
  title: Decenni di ingegneria navale<br />in ogni tavola
  subtitle: Paddle Board Overstock Combina deep matter science, produzione di precisione e test reali per produrre schede che funzionano quando è importante.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Team di ingegneria marittima e R&S al lavoro
expertise_materials:
  tagline: Scienza dei materiali
  title: Scegliere il materiale giusto<br />per ogni applicazione
  subtitle: Lavoriamo con tre materiali fondamentali — ciascuno selezionato per casi d'uso specifici e requisiti di prestazioni.
  columns: 3
  items:
    - title: Grado PVC Marine
      description: Tessuto da 1100 PVC denieri — il nostro materiale più versatile. UV- Stabilizzato, resistente all'abrasione e collaudato nel tempo. Ideale per SUP tavole dove peso, rigidità ed efficienza dei costi sono importanti.
      icon: tabler:droplet
    - title: Drop-Stitch Nucleo
      description: Migliaia di fili di poliestere collegano gli strati di tessuto superiore e inferiore, permettendo un gonfiaggio ad alta pressione (15 PSI) per una guida rigida e stabile che si arrotola comunque nello zaino.
      icon: tabler:building-arch
    - title: EVA Schiuma per terrazze
      description: La schiuma scanalata ad alta EVA densità offre una presa a tutta lunghezza, ammortizzazione per le cadute e una tela per i nostri mazzi artistici distintivi.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Capacità produttive
  title: Produzione di Precisione<br />a ogni passo
  subtitle: Il nostro impianto di 12.000 m² è dotato di macchinari specializzati per ogni fase della produzione.
  columns: 2
  items:
    - title: CNC Taglio
      description: Il taglio controllato da computer garantisce pannelli di tessuto precisi e ripetibili con il minimo spreco. Ogni pezzo si adatta esattamente come progettato.
      icon: tabler:cpu
    - title: Saldatura ad alta frequenza
      description: La saldatura HF industriale crea giunture più resistenti rispetto al materiale di base. Un controllo costante di temperatura e pressione garantisce guarnizioni ermetiche in ogni produzione di produzione.
      icon: tabler:bolt
    - title: Assemblaggio del nucleo a punto cadente
      description: Migliaia di fili di poliestere collegano gli strati di tessuto superiore e inferiore, permettendo un gonfiaggio ad alta pressione (15-20 PSI) per SUP assi e pavimenti rigidi e stabili.
      icon: tabler:building-arch
    - title: Test di Pressione
      description: Ogni tavola viene testata a pressione prima della spedizione, mantenuta a 1,25 volte la pressione nominale — se la mantengono, funzionerà sull'acqua.
      icon: tabler:wind
    - title: Test di resistenza delle cuciture
      description: I campioni casuali di ogni lotto di produzione sono sottoposti a test distruttivi sulla resistenza delle giunzioni. I risultati vengono registrati e tracciabili a specifiche serie di produzione.
      icon: tabler:files
    - title: Test dell'acqua
      description: Ogni design di tavola viene sottoposto a prove in acqua reale. La pagaia nel mondo reale in condizioni costiere convalida prestazioni, maneggevolezza e stabilità.
      icon: tabler:ripple
expertise_design:
  tagline: Design e Ingegneria
  title: Progettato per Condizioni Reali
  subtitle: La nostra filosofia di design inizia da come verrà utilizzata la tavola — poi costruisce l'ingegneria intorno a quel caso d'uso.
  items:
    - title: Forma e Contorno della Tavola
      description: Lunghezza, larghezza e rocker sono ottimizzati per l'uso previsto di ogni modello — contorni più lunghi per il touring per la scorrevolezza, piani più ampi per stabilità e yoga.
    - title: Rinforzo dei Bordo e dello Stringer
      description: Bordi rinforzati e stringer centrali aggiungono rigidità e assorbono gli urti — i punti dove le tavole subiscono più sollecitazioni stagione dopo stagione.
    - title: Configurazione del Ponte e Traction
      description: Area di posizione, posizionamento delle maniglie, supporti a D-ring e zone di trazione sono progettate intorno alle posture reali della pagaia — sia durante crociere, pesca o yoga.
    - title: Serie Arte e Colore
      description: Grafica del ponte, schemi di colore e supporti per accessori — ogni serie è progettata per abbinarsi a una personalità di paddle distinta.
cta:
  title: Hai un'applicazione specifica in mente?
  subtitle: Il nostro team può aiutarti a scegliere la tavola, la dimensione e l'attrezzatura giuste per il tuo stile di pagaia.
  actions:
    - variant: primary
      text: Chiedi ai nostri ingegneri
      href: /contact
    - text: Visualizza gamma di prodotti
      href: /products
