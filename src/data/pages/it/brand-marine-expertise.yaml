hero:
  tagline: Competenza marina
  title: 'Decenni di ingegneria nautica<br />in ogni scafo'
  subtitle: 'Aquafarer unisce scienza dei materiali avanzata, produzione di precisione e test sul campo per realizzare imbarcazioni che rendono al meglio quando conta.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Il team di ingegneria nautica e R&S di Aquafarer al lavoro
expertise_materials:
  tagline: Scienza dei materiali
  title: 'La scelta del materiale giusto<br />per ogni applicazione'
  subtitle: 'Lavoriamo con tre materiali principali — ciascuno selezionato per casi d''uso specifici e requisiti di prestazione.'
  columns: 3
  items:
    - title: PVC di grado marino
      description: "Tessuto in PVC da 1100 denari — il nostro materiale più versatile. Stabilizzato ai raggi UV, resistente all'abrasione e conforme REACH. Ideale per imbarcazioni da diporto, tavole SUP e kayak dove peso ed efficienza dei costi contano."
      icon: tabler:droplet
    - title: Hypalon/CSM premium
      description: 'Resistenza chimica superiore e stabilità ai raggi UV. Le imbarcazioni in Hypalon possono durare 15-20 anni con una cura adeguata. Consigliato per applicazioni commerciali, di soccorso e militari dove la durata a lungo termine è fondamentale.'
      icon: tabler:shield
    - title: Vetroresina e alluminio
      description: "Scafi in vetroresina a V profondo per RIB e motovedette — prestazioni che tagliano le onde in condizioni difficili. Scafi in alluminio per imbarcazioni da lavoro commerciali pesanti che richiedono resistenza e capacità di carico massime."
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Capacità produttive
  title: 'Produzione di precisione<br />in ogni fase'
  subtitle: "Il nostro impianto di 12.000 m² è dotato di macchinari specializzati per ogni fase della produzione."
  columns: 2
  items:
    - title: Taglio CNC
      description: "Il taglio controllato da computer garantisce pannelli di tessuto precisi e ripetibili con sprechi minimi. Ogni pezzo combacia esattamente come progettato."
      icon: tabler:cpu
    - title: Saldatura ad alta frequenza
      description: "La saldatura HF industriale crea cuciture più resistenti del materiale base. Il controllo costante di temperatura e pressione garantisce tenute stagne all'aria su ogni ciclo produttivo."
      icon: tabler:bolt
    - title: Assemblaggio del nucleo drop-stitch
      description: 'Migliaia di fili in poliestere collegano gli strati superiore e inferiore del tessuto, consentendo il gonfiaggio ad alta pressione (15-20 PSI) per tavole SUP e pavimenti rigidi e stabili.'
      icon: tabler:building-arch
    - title: Prove di pressione
      description: "Ogni prodotto gonfiabile viene testato a pressione prima della spedizione. I tubolari RIB vengono collaudati a 1,25x la pressione nominale: se reggono lì, daranno il massimo sull'acqua."
      icon: tabler:wind
    - title: Test di resistenza delle cuciture
      description: "Campioni casuali di ogni lotto di produzione vengono sottoposti a test distruttivi di resistenza delle cuciture. I risultati sono registrati e riconducibili a specifici cicli produttivi."
      icon: tabler:files
    - title: Test in acqua
      description: "Ogni modello RIB viene sottoposto a prove in mare prima della certificazione. I test in condizioni costiere reali validano prestazioni, manovrabilità e stabilità."
      icon: tabler:ripple
expertise_design:
  tagline: Design e ingegneria
  title: 'Progettato per condizioni reali'
  subtitle: "La nostra filosofia di progettazione parte da come verrà utilizzata l'imbarcazione — e costruisce l'ingegneria attorno a quel caso d'uso."
  items:
    - title: Progettazione dello scafo a V profondo
      description: "I nostri scafi in vetroresina presentano angoli di deadrise calcolati e ottimizzati per la lunghezza e l'uso previsto di ogni modello. V più accentuato per acque mosse, più piatto per la stabilità."
    - title: Sicurezza multi-camera
      description: "Ogni imbarcazione dispone di 3-7 camere d'aria indipendenti. Se un compartimento viene compromesso, le camere rimanenti mantengono l'imbarcazione a galla e operativa."
    - title: Layout ergonomico
      description: "Posizione della consolle, altezza dei tubolari e sistemazione dei sedili sono progettati per il comfort dell'operatore durante l'uso prolungato — che si tratti di pattugliamento, pesca o trasporto."
    - title: Configurazione personalizzata
      description: "Colori dei tubolari, configurazione della consolle, capacità del serbatoio, supporti per accessori — ogni modello può essere personalizzato per soddisfare specifici requisiti operativi."
cta:
  title: "Hai in mente un'applicazione specifica?"
  subtitle: 'Il nostro team di ingegneri può consigliarti su selezione dei materiali, design e produzione per il tuo progetto.'
  actions:
    - variant: primary
      text: Chiedi ai nostri ingegneri
      href: /contact
    - text: Vedi la gamma di prodotti
      href: /products