reasons:
  tagline: La differenza Aquafarer
  title: Cosa ci distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Produzione reale, non intermediazione
      description: "Possediamo e gestiamo una fabbrica di 12.000 m². Quando collabori con Aquafarer, lavori direttamente con le persone che progettano, sviluppano e costruiscono i tuoi prodotti — senza intermediari."
      icon: tabler:building-factory
    - title: "Approccio guidato dall'ingegneria"
      description: "Il nostro processo di progettazione parte dal caso d'uso, non dalla categoria di prodotto. Ottimizziamo forma dello scafo, selezione dei materiali e configurazione in base a come l'attrezzatura verrà realmente utilizzata in contesti commerciali."
      icon: tabler:engine
    - title: Qualità certificata
      description: 'Certificato CE, sistema di qualità ISO, conforme BSCI, conforme REACH, approvato USCG. Ogni prodotto rispetta gli standard internazionali — non solo a parole.'
      icon: tabler:certificate
    - title: OEM/ODM flessibile
      description: 'Colori dei tubolari, layout della consolle, branding, imballaggio: personalizziamo secondo le tue specifiche. Nessuna pressione di quantità minime. Inizia con un prototipo, scala con fiducia.'
      icon: tabler:adjustments
    - title: Logistica globale
      description: 'Magazzino negli Stati Uniti in California, spedizione diretta da Qingdao, trasporto aereo per ordini urgenti. Gestiamo pratiche doganali e documentazione in tutto il mondo.'
      icon: tabler:truck-delivery
    - title: Supporto a vita
      description: "Supportiamo imbarcazioni costruite 20 anni fa. Ricambi originali, consulenza tecnica, guida alla riparazione: il nostro team è disponibile quando serve, ovunque tu sia."
      icon: tabler:lifebuoy

testimonials:
  tagline: La fiducia dei marchi di tutto il mondo
  title: Cosa dicono i nostri partner
  items:
    - content: "Abbiamo lavorato con diversi produttori in Cina, ma Aquafarer si distingue per il supporto tecnico e la qualità costante. Trattano il nostro marchio come fosse il loro."
      name: '— Partner OEM, marchio europeo di sport acquatici'
    - content: "I loro RIB in Hypalon sono in servizio nella nostra flotta da oltre 5 anni. Manutenzione minima, eccellente resistenza ai raggi UV. La garanzia di 5 anni sui tubolari ci dà sicurezza."
      name: '— Operatore di flotta, gruppo resort del Medio Oriente'
    - content: "Il team Aquafarer ci ha aiutato a sviluppare un design personalizzato di tavole SUP dal concept alla produzione in 90 giorni. La qualità ha superato le nostre aspettative."
      name: '— Distributore, Watersports australiano'
    - content: "Da piccolo imprenditore, temevo le quantità minime d'ordine. Aquafarer ha lavorato con il mio budget e mi ha aiutato a lanciare il mio marchio con solo 50 tavole. Ora ne ordino 500."
      name: '— Fondatore di marchio, società di noleggio SUP negli Stati Uniti'

cta:
  title: 'Pronto a costruire il tuo business acquatico?'
  subtitle: 'Contatta il nostro team per una consulenza gratuita. Nessun impegno: solo consigli onesti su attrezzature e produzione.'
  actions:
    - variant: primary
      text: Parla con il nostro team
      href: /contact
    - text: Scarica il catalogo prodotti
      href: /resources