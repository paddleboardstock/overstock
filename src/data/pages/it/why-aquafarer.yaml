hero:
  tagline: Perché Aquafarer
  title: 'Costruito diversamente. Costruito per il business.<br />Il partner delle avventure acquatiche in tutto il mondo'
  subtitle: 'Non solo un produttore: un partner commerciale che progetta, sviluppa e consegna attrezzature di livello professionale per club, resort, operatori di noleggio e marchi acquatici emergenti.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Qualità produttiva ed esperienza Aquafarer

pillars:
  tagline: I tre pilastri della partnership
  title: Perché le aziende acquatiche di tutto il mondo scelgono Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Progettato per uso commerciale
      description: 'La nostra attrezzatura è progettata per il noleggio quotidiano, non per il divertimento del weekend. PVC di livello commerciale, anime drop-stitch rinforzate, opzioni Hypalon resistenti ai raggi UV e componenti testati sul campo significano meno manutenzione, maggiore durata e un ROI più alto per la tua attività.'
      icon: tabler:building-factory
      callToAction:
        text: Vedi la linea di prodotti commerciali
        href: /products
    - title: "Dall'idea al mercato"
      description: "Lancia il tuo marchio di sport acquatici in 90 giorni. Ti guidiamo in ogni fase: validazione del concept, selezione del prodotto, prototipo, produzione, design della confezione e spedizione globale. Nessuna pressione di quantità minime: inizia in piccolo, scala con fiducia."
      icon: tabler:rocket
      callToAction:
        text: Inizia il viaggio del tuo marchio
        href: /oem-odm-blueprint
    - title: Progettato per condizioni globali
      description: "Prodotti ottimizzati per ogni clima: formulazioni PVC per acque fredde per l'Europa, materiali resistenti ai raggi UV per Medio Oriente e Australia, trattamenti anti-umidità per il Sud-est asiatico. Ogni spedizione è calibrata sull'ambiente di destinazione."
      icon: tabler:world

