hero:
  tagline: Stile di vita
  title: Il Paddle Board Overstock<br />Stile di vita
  subtitle: Costruito per chi vive sull'acqua — dagli esploratori del fine settimana ai pagaiatori quotidiani che contano i giorni tra una sessione e l'altra.
values:
  - icon: 🌊
    title: Nato sull'acqua
    desc: Ogni progetto inizia comprendendo come si comporta l'acqua. Progettiamo partendo dall'estremità delle condizioni verso l'interno — perché l'oceano è il nostro insegnante, non il nostro posto di lavoro.
  - icon: 🔧
    title: Costruito per durare
    desc: Il prodotto più sostenibile è quello che non ha bisogno di essere sostituito. Materiali marini di alta qualità, drop-stitch nuclei certificati fino a 15 PSI e cuciture che durano più della stagione.
  - icon: 🏆
    title: Accessibile per design
    desc: Gli sport acquatici non dovrebbero essere un lusso. Prestazioni professionali a un prezzo ragionevole per famiglie, guide e pagaiatori quotidiani — non solo per i professionisti.
  - icon: 🌍
    title: Comunità globale
    desc: "Dalla costa di Weihai ai laghi in Europa, ai fiumi del Sud-est asiatico e alle baie delle Americhe — i nostri clienti condividono una cosa: l'amore per stare sull'acqua."
  - icon: ♻️
    title: Produzione responsabile
    desc: Taglio ottimizzato CNC riduce gli sprechi di materiale sotto il 5%. La costruzione durevole riduce i cicli di sostituzione. Costruiamo per la longevità perché questa è la scelta più sostenibile.
  - icon: 🤝
    title: Assistenza che dura
    desc: Le tavole che abbiamo costruito anni fa ci chiamano ancora per pezzi di ricambio. La risposta alla garanzia in media è di 24 ore. Non spariamo dopo la vendita — siamo qui per tutta la vita del prodotto.
