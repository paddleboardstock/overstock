content_challenge:
  tagline: La sfida
  title: 'I tender per yacht richiedono<br />prestazioni e presentazione'
  subtitle: "Un tender per yacht è più di un semplice gommone — è un'estensione dell'imbarcazione madre e una dichiarazione di qualità."
  paragraphs:
    - "Proprietari di yacht e capitani hanno bisogno di tender performanti, compatti nello stivaggio e dall'aspetto curato. Il tender deve completare l'estetica dello yacht garantendo al contempo un trasporto affidabile per ospiti ed equipaggio."
    - '**Lo stivaggio è fondamentale** — Il tender deve trovare posto in coperta, in un garage o sui davit. Il peso è determinante per i sistemi di messa a mare e recupero. I RIB Paddle Board Overstock offrono un eccellente rapporto potenza/peso con profili di stivaggio compatti.'
    - "**Le aspettative di prestazione sono elevate** — Gli ospiti si aspettano una navigazione confortevole e asciutta durante il trasferimento a terra. Le opzioni di motore devono bilanciare velocità, autonomia e rumorosità per un'esperienza premium. Nelle operazioni charter, il tender è utilizzato ogni giorno e deve sopportare un uso intenso."
    - "**L'aspetto conta** — Un tender non abbinato o usurato sminuisce la presentazione complessiva dello yacht. Colori dei tubolari personalizzati, selleria e branding assicurano che il tender appaia parte integrante dell'insieme."
content_solution:
  tagline: La nostra soluzione
  title: 'Configurazioni di tender<br />Per ogni applicazione nautica'
  subtitle: 'I tender RIB Paddle Board Overstock possono essere personalizzati in base alla vostra imbarcazione, al tipo di operazione e alle esigenze di stivaggio — dalle specifiche per cantieri di superyacht ai programmi di flotta charter.'
  list:
    - "Colori dei tubolari personalizzati, abbinati o complementari all'imbarcazione madre — disponibili tutti i colori RAL per tubolari Hypalon o PVC"
    - 'Selleria e cuciture personalizzate — vinile marino premium con abbinamento colori e ricamo del logo'
    - "Comando a console o a timone — scegliete in base al modello di utilizzo e alla preferenza dell'operatore"
    - 'Scafo a V profondo in vetroresina per una navigazione confortevole e asciutta in diverse condizioni di mare'
    - 'Stivaggio compatto — si sgonfia o si impila per garage di poppa, gavone o davit'
    - "Tubolari Hypalon per resistenza ai raggi UV e conservazione dell'aspetto nel tempo"
    - 'Punti di sollevamento e anelli di traino di serie su tutti i modelli'
    - 'Copertura di prua, copertura completa e protezioni antiabrasione opzionali'
    - 'Gamma motori: da 15 HP a 60 HP — configurazioni fuoribordo o a timone'
    - 'Personalizzazione OEM/privata disponibile per cantieri navali e dealer marini'
content_segments:
  tagline: Profili cliente
  title: 'Soluzioni di tender per yacht<br />Per tipologia di cliente'
  subtitle: 'I diversi segmenti del settore nautico hanno esigenze uniche. Paddle Board Overstock configura i tender in base a ogni applicazione.'
  items:
    - title: Cantieri di superyacht
      subtitle: Integrazione OEM del tender — dimensioni, colori e materiali personalizzati
      description: "I cantieri navali affrontano una sfida ricorrente: ogni nuova imbarcazione presenta vincoli dimensionali, limiti di peso e aspettative estetiche unici. Il tender deve integrarsi perfettamente con il sistema di davit dell'imbarcazione madre, rientrare in dimensioni di garage precise e rispettare il linguaggio di design di uno yacht da milioni di euro. Qualsiasi discrepanza — colore dei tubolari errato, posizionamento sbagliato dei punti di sollevamento, peso incompatibile — ritarda la consegna e si ripercuote negativamente sul cantiere. Paddle Board Overstock lavora direttamente con i team acquisti e design dei cantieri per fornire tender con colori RAL personalizzati, selleria abbinata, pannelli console brandizzati e pacchetti completi di documentazione OEM."
      features:
        - 'Specifiche dimensionali personalizzate conformi ai vincoli di garage e davit'
        - 'Qualsiasi colore RAL dei tubolari e selleria abbinata — campioni di approvazione design forniti'
        - 'Branding OEM su console, tubolari e schienali dei sedili'
        - 'Validazione di punti di sollevamento e adattamento ai davit per ogni modello'
        - 'Peso dello scafo ottimizzato per i sistemi di messa a mare e recupero specificati'
        - 'Programmazione consegne in lotti allineata ai tempi di produzione'
    - title: Società di gestione yacht
      subtitle: Tender di flotta standardizzati — supporto globale, tempi di fermo minimi
      description: "Le società di gestione supervisionano più yacht operanti nel Mediterraneo, nei Caraibi, nel Pacifico del Sud e oltre. La loro esigenza centrale è l'affidabilità — un tender guasto in un porto remoto significa straordinari per l'equipaggio, lamentele degli ospiti e costose sostituzioni dell'ultimo minuto. Specifiche di flotta standardizzate riducono i tempi di formazione dell'equipaggio tra le imbarcazioni e semplificano la gestione dei ricambi. Paddle Board Overstock offre prezzi di flotta plurimobile, specifiche coerenti tra gli ordini e supporto globale di ricambi per le società di gestione con imbarcazioni in più regioni."
      features:
        - 'Specifiche standardizzate su tutta la flotta gestita'
        - 'Ricambi intercambiabili su tutti i tender della flotta'
        - 'Prezzi di flotta e sconti sul volume per ordini multi-unità'
        - 'Disponibilità globale dei ricambi — spedizione rapida verso qualsiasi porto'
        - "Documentazione di servizio e manutenzione uniforme per l'equipaggio"
        - 'Coordinamento delle consegne multi-unità verso diverse sedi delle imbarcazioni'
    - title: Operatori charter
      subtitle: Operazioni quotidiane ad alta frequenza — durata senza compromettere l'aspetto
      description: "I tender charter affrontano il programma operativo più impegnativo del settore nautico: trasferimenti giornalieri degli ospiti, escursioni a terra, supporto agli sport acquatici e navetta portuale — spesso oltre 200 operazioni per stagione di charter. Il tender deve apparire impeccabile a ogni consegna agli ospiti, resistendo al contempo a imbarchi continui, esposizione all'acqua salata e ore motore. Il degrado estetico è una diretta preoccupazione commerciale — un tender usurato influisce sulle recensioni degli ospiti e sulle tariffe charter. Paddle Board Overstock configura i tender charter con selleria potenziata, tubolari Hypalon rinforzati e aree di movimentazione irrobustite per una durata a lungo termine che mantiene la qualità di presentazione."
      features:
        - 'Tubolari Hypalon rinforzati — durata di 5-8 anni nel servizio charter quotidiano'
        - 'Gradini di imbarco e cime di appiglio rinforzati per un uso frequente'
        - "Selleria vinile premium antimacchia — pulizia facile tra un charter e l'altro"
        - 'Superfici del ponte antiscivolo di facile pulizia'
        - 'Pacchetti fuoribordo affidabili con facile accesso alla manutenzione per turni rapidi'
        - "Materiali di qualità estetica che mantengono l'aspetto attraverso le stagioni di charter"
    - title: Dealer e broker di yacht
      subtitle: Fornitura affidabile di tender per il completamento delle imbarcazioni e il valore di rivendita
      description: "Dealer e broker hanno bisogno di una fornitura stabile di tender di qualità che completino le imbarcazioni che vendono — in linea con il posizionamento del marchio e migliorando l'esperienza dell'acquirente. Un tender non coerente o una fornitura in ritardo possono ritardare la consegna di uno yacht o danneggiare la presentazione di un annuncio. I dealer richiedono qualità costante tra i lotti, tempi di consegna affidabili e prezzi competitivi per mantenere i margini. Paddle Board Overstock offre programmi di inventario per dealer con programmazione stagionale delle consegne, opzioni di co-branding per l'esposizione in showroom e allocazione prioritaria durante l'alta stagione."
      features:
        - 'Programmi di magazzino con modelli disponibili su richiesta'
        - 'Programmazione stagionale delle consegne allineata al calendario di consegna delle imbarcazioni'
        - "Co-branding del dealer su console e tubolari per l'esposizione in showroom"
        - 'Qualità e specifiche costanti su tutti gli ordini per lotti'
        - 'Prezzi dealer competitivi con livelli basati sul volume'
