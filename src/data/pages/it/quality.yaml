tests:
  - title: Test di Pressione
    standard: Specifica interna AF-PT-001
    description: Le camere gonfiabili vengono pressurizzate a 1,25 volte il limite operativo consigliato e mantenute per 30 minuti. Si misura la perdita di pressione per convalidare l'impermeabilità e l'integrità strutturale dei materiali e delle cuciture.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Prova d'impatto
    standard: Specifiche interne AF-IT-002
    description: I prodotti sono sottoposti a impatti controllati da pesi cadenti standardizzati e da apparati a pendolo. Questo valuta la resistenza alla perforazione, la propagazione delle lacerazioni e la resilienza strutturale contro collisioni con ostacoli, banchine e detriti.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Test di resistenza
    standard: Protocollo di Test Interno
    description: I campioni di materiale sono esposti a lampade UVA-340 in camere di invecchiamento accelerato per 1.000+ ore. Misuriamo il cambiamento del colore (Delta E), la conservazione della lucentezza e la perdita di resistenza alla trazione per convalidare i pacchetti stabilizzatori UV.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Test di resistenza all'abrasione
    standard: Protocollo di Test Interno
    description: I campioni di materiale sono sottoposti a ruote abrasive CS-10 con carichi di 500g/1.000g per 1.000 cicli. La perdita di massa e la classificazione visiva dell'usura determinano la durabilità del rivestimento contro sabbia, ghiaia e lanci ripetuti.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Test delle prestazioni a bassa temperatura
    standard: Specifica interna AF-LT-003
    description: I prodotti assemblati e i coupon di materiale vengono condizionati a -20°C, -10°C e 0°C per 24 ore, quindi sottoposti a test di flessione. Verifichiamo che PVC rimanga flessibile senza crepe o delaminazioni.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Test di galleggiamento e capacità di carico
    standard: Protocollo di Test Interno
    description: I prodotti vengono caricati progressivamente fino a 1,25 volte la capacità nominale in una vasca controllata. Vengono registrati lo spazio libero, la stabilità e le prestazioni di auto-scarico. La capacità nominale di ogni modello è verificata sia matematicamente che empiricamente.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Test di manovrabilità
    standard: Specifiche interne AF-MT-004
    description: Le prove in acqua misurano il raggio di sterzata, l'accelerazione, il tempo di planata e la risposta a pagaia/motore su una gamma di condizioni di carico. Le caratteristiche di manovrabilità nel mondo reale vengono convalidate rispetto agli obiettivi di progetto.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Verifica dell'impermeabilità
    standard: Specifica interna AF-WT-005
    description: Ogni prodotto assemblato viene testato a spruzzo a 0,5 bar su tutte le cuciture, valvole e raccordi. Un test di immersione pressurizzata della durata di 5 minuti verifica la tenuta stagna della camera e delle valvole. Standard di assenza di perdite prima della spedizione.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
