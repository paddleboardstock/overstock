  tagline: Procedure di prova
  title: Test rigorosi in ogni fase
commitment:
  title: Il nostro impegno
  body: Attraverso questi rigorosi procedimenti di test, {SITE} offre ai clienti la certezza che le nostre tavole gonfiabili SUP non siano solo ad alte prestazioni, ma anche costruite per durare — garantendo innumerevoli avventure piacevoli e sicure sull'acqua. Il nostro laboratorio di qualità opera in modo indipendente dalla produzione e riferisce direttamente alla direzione.
  cta: Richiedere la documentazione per i test
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock gestisce un programma di collaudo qualità con 8 protocolli che copre pressione, impatto, UV, abrasione, bassa temperatura, galleggiabilità, manovrabilità e tenuta stagna. Tasso di difetti dello 0,7% sulle spedizioni degli ultimi 12 mesi.
  points:
    - '8 protocolli di test: pressione, impatto, UV, abrasione, bassa temperatura, galleggiabilità, manovrabilità e tenuta stagna'
    - Tasso di assenza difetti del 99,3% sulle spedizioni successive a 12 mesi
    - Ogni unità subisce una prova di mantenimento di 24-48 ore a 1,25 volte la pressione nominale con tolleranza massima di calo del 5%
    - UV test accelerato di invecchiamento atmosferico (1.000+ ore) e test di resistenza all’abrasione del rivestimento
testing_note: Ogni test segue protocolli interni documentati. I risultati dei test vengono registrati, tracciabili e revisionati dal nostro laboratorio di qualità indipendente.
