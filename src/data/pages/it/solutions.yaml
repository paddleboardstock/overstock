features3_solutions:
  tagline: Soluzioni
  title: 'Il Vostro Partner<br />D''Avventure Acquatiche'
  isBeforeContent: false
  columns: 3
  items:
    - title: Club di sport acquatici
      description: 'Pacchetti completi di attrezzatura, branding personalizzato e programmi di manutenzione per club SUP, club di kayak, scuole di surf e centri di formazione.'
      icon: tabler:users
      link: /solutions/clubs
    - title: RIB per sport acquatici
      description: 'RIB progettati su misura per scuole di vela, centri di sport acquatici e organizzatori di eventi. Barche per allenatori, rimorchio e sicurezza per sport acquatici professionali.'
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resort e hotel
      description: 'Programmi premium di sport acquatici con attrezzatura di flotta, sistemi di sicurezza, formazione del personale e gestione dei ricavi per strutture ricettive.'
      icon: tabler:beach
      link: /solutions/resorts
    - title: Imprenditori di marchi acquatici
      description: 'Produzione OEM/ODM a marchio privato con quantità minime di ordine basse, design personalizzato del prodotto, confezionamento e spedizione globale per nuovi proprietari di marchio.'
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Barche per centri subacquei
      description: 'Piattaforme RIB stabili con ingresso e uscita facili, spazio per le attrezzature e configurazioni di motore ottimizzate per le operazioni subacquee.'
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Imbarcazioni di soccorso e emergenza
      description: 'RIB ad alta velocità e gommoni progettati per ricerca e salvataggio, risposta alle emergenze e operazioni della guardia costiera.'
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Soluzioni tender per yacht
      description: 'Tender RIB compatti ed eleganti che completano superyacht e imbarcazioni da diporto. Facile stivaggio, prestazioni potenti.'
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Soluzioni per barche da pesca
      description: 'Gommoni e RIB stabili e durevoli configurati per operazioni di pesca commerciale e ricreativa.'
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Attrezzature per turismo marino
      description: 'Gommoni, SUP e kayak pronti per le flotte per resort, tour operator e aziende di noleggio di sport acquatici.'
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIB per energia offshore
      description: 'RIB pesanti per il supporto delle piattaforme petrolifere e del gas, trasferimento di equipaggi nei parchi eolici, ispezione di cavi sottomarini e costruzioni marine.'
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Workboat per acquacoltura
      description: 'RIB resistenti alla corrosione per allevamento ittico, coltivazione di perle e ranching oceanico. Tubolari Hypalon, ferramenta in acciaio inossidabile, durata per uso quotidiano.'
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Ricerca e rilevamento marino
      description: 'RIB stabili pronti per strumentazione per ricerca oceanografica, monitoraggio ambientale, campionamento della qualità dell''acqua e programmi di insegnamento universitari.'
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Imbarcazioni da lavoro commerciali
      description: 'RIB pesanti per pattugliamento, rilevamento, trasporto e logistica offshore. Costruiti per le esigenze rigorose delle operazioni commerciali.'
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: 'Non sapete quale percorso si adatta alla vostra attività?'
  subtitle: 'Raccontateci la vostra attività: vi raccomanderemo il pacchetto di attrezzatura, il programma di branding o la soluzione su misura più adatta.'
  actions:
    - variant: primary
      text: Richiedi una consulenza gratuita
      href: /contact