content_challenge:
  tagline: La sfida
  title: Perché i centri sub<br />hanno bisogno di barche dedicate
  subtitle: Le operazioni subacquee impongono esigenze uniche alle imbarcazioni — requisiti che le barche polivalenti spesso non soddisfano.
  paragraphs:
    - Le barche da immersione necessitano di stabilità a riposo per entrata e uscita sicure, specialmente quando i sub sono equipaggiati con attrezzatura pesante. Una piattaforma stretta o instabile crea rischi per la sicurezza e limita la capacità operativa.
    - Lo stivaggio dell'attrezzatura è un altro fattore critico. Bombole, zavorre, attrezzatura sub e dispositivi di sicurezza necessitano di spazio dedicato che mantenga il ponte libero e accessibile.
    - L'affidabilità del motore è non negoziabile. Quando ci sono sub in acqua, l'imbarcazione deve essere pronta a muoversi. Le configurazioni bimotore sono spesso preferite per la ridondanza.
    - Aquafarer soddisfa questi requisiti con configurazioni RIB progettate appositamente — scafi stabili a V profondo, tubolari larghi per l'imbarco, stivaggio integrato delle bombole e opzioni motore ottimizzate per operazioni subacquee.
    - "**Stabilità a riposo** — I subacquei necessitano di una piattaforma stabile quando si preparano, entrano in acqua e risalgono a bordo. Una stabilità insufficiente crea rischi per la sicurezza e influisce negativamente sull'esperienza del cliente."
    - "**Costi operativi elevati** — L'efficienza del carburante è importante quando si effettuano più viaggi ogni giorno. Una barca che consuma più carburante riduce direttamente i margini di profitto. Gli operatori subacquei commerciali si preoccupano più dei costi operativi giornalieri che della velocità massima."
content_solution:
  tagline: La nostra soluzione
  title: Configurato per immersioni
  subtitle: Ogni RIB da immersione Aquafarer è costruito attorno alle esigenze specifiche delle operazioni subacquee commerciali e ricreative.
  list:
    - Tubolari larghi in Hypalon o PVC per piattaforma d'imbarco stabile — i sub entrano ed escono in sicurezza
    - Rastrelliere integrate per bombole — mantengono il peso basso e il ponte libero
    - Console posizionata per visibilità chiara dei sub in acqua
    - Scaletta sub opzionale per facile reimbarco
    - Opzioni motore da 40 HP a 115 HP — configurazione singola o bimotore
    - Piastre di montaggio per sonar, GPS e apparecchiature di comunicazione
    - Capacità carburante adattata ai requisiti di autonomia operativa
    - "Costruzione di grado marino: materiali dei tubi per carichi pesanti con resistenza ai raggi UV e all'acqua salata, struttura rinforzata per l'uso commerciale quotidiano"
    - Configurazioni personalizzate di scala e piattaforma per immersione, adattate alla profondità dell'acqua operativa e al profilo del subacqueo
    - Piastre di montaggio per apparecchiature per sonar, GPS e dispositivi di comunicazione
content_models:
