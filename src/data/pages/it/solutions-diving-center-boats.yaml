  title: Configurazioni RIB sub
  subtitle: I nostri modelli RIB da immersione più popolari — ciascuno disponibile con configurazione personalizzata.
  items:
    - title: RIB 500 Sub
      description: 'RIB 5,0m in vetroresina con scaletta sub, rastrelliere bombole e motore fuoribordo 60 HP. Ideale per piccoli gruppi e acque riparate. Capacità: 8 persone.'
    - title: RIB 520 Sub
      description: 'RIB 5,2m con stabilità migliorata, serbatoio carburante esteso e motore 90 HP. Adatto per centri sub costieri. Capacità: 10 persone.'
    - title: RIB 550 Sub
      description: 'RIB 5,5m con ampio layout di coperta, scaletta sub professionale, rastrelliere per bombole e tubolari rinforzati. Progettato per operazioni di immersione in resort con gruppi misti di passeggeri. Capacità: 10 persone.'
    - title: RIB 580 Diver Pro
