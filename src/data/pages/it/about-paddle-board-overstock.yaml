hero:
  tagline: Informazioni
  title: Informazioni Paddle Board Overstock
  subtitle: Dal 2012, mettiamo tavole gonfiabili nuove di zecca SUP nelle mani di pagaiatori e piccoli rivenditori in 50+ paesi — scorte in eccesso, prezzi onesti e una garanzia che rispettamo davvero.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock tavole gonfiabili nuove di zecca SUP
direct_answer: Paddle Board Overstock è un marchio di attrezzature per sport acquatici fondato nel 2012 e con sede a Weihai, in Cina. Vendiamo tavole gonfiabili nuove SUP di zecca provenienti da scorte in eccesso — un mix di produzione in eccesso dalla nostra base produttiva e scorte accuratamente selezionate da fabbriche partner — direttamente ai pagaiatori di punta e a piccoli rivenditori in 50+ paesi. Ogni tavola è testata al 100% sotto pressione, garantita da una garanzia di 2 SUP anni e spedita tramite trasporto espresso o marittimo.
tldr_points:
  - Fondata nel 2012, con sede a Weihai, Cina — uno dei SUP principali poli manifatturieri mondiali
  - 'Modello in sovrastoccaggio: schede nuove di zecca a prezzi inferiori a quelli al dettaglio, nessun intermediario'
  - "L'inventario è a fonte mista: produzione in eccesso dalla nostra base più scorte di fabbriche partner verificate"
  - 50+ paesi serviti, tasso di superamento delle ispezioni finali del 99,3%, garanzia di 2 anni SUP
story_section:
  tagline: La nostra storia
  title: Perché vendiamo scorte in eccesso
  paragraphs:
    - Paddle Board Overstock iniziata nel 2012 a Weihai, in Cina — una città costiera nella provincia dello Shandong che è cresciuta fino a diventare uno dei SUP più importanti centri mondiali per la produzione di pneumatici. Da questa base, abbiamo trascorso più di un decennio a costruire paddle board gonfiabili e a spedirle in tutto il mondo.
    - Along the way we noticed something that shapes everything we do today: Ogni stagione di produzione lascia dietro di sé tavole nuove di zecca, perfettamente buone — tirature in surplus, ordini cancellati, colori della scorsa stagione. Nel frattempo, i rivenditori indipendenti in tutto il mondo sono stati esclusi dall'ingrosso perché i fornitori tradizionali richiedevano ordini grandi come contenitori.
    - Quel divario è il nostro business. Vendendo scorte in eccesso — produzione in eccesso dalla nostra base Weihai, più scorte accuratamente selezionate da fabbriche partner — possiamo offrire tavole nuove a prezzi ben al di sotto del commercio al dettaglio normale, in quantità adatte a un singolo pagaio o a un ordine di cinque tavole. Niente è di seconda mano, niente è un secondo; è semplicemente inventario che merita un cliente invece di un magazzino.
model_section:
  tagline: Il nostro modello di business
  title: Come funziona il modello di sovrapposizione
  items:
    - title: Nuovo di zecca, mai usato
      description: Ogni tavola che vendiamo è nuova di zecca e inutilizzata. Scorte in eccesso significa surplus e inventario in eccesso — non resi, non ricondizionati, non secondi.
    - title: Inventario a fonti miste
      description: Il nostro stock combina la produzione in eccesso della nostra base produttiva di Weihai con l'inventario selezionato dalle fabbriche partner che teniamo allo stesso livello di qualità. Le fonti sono miste; gli standard no.
    - title: Prezzi al di sotto del prezzo al dettaglio
      description: L'inventario in eccesso ci costa meno da acquisire, quindi ti costa meno acquistare. Niente prezzo di listino gonfiato, niente sconti finti — solo prezzi onesti sull'inventario reale.
    - title: Grosso Adatto alle Piccole Imprese
      description: L'all'ingrosso parte da 5 tavole, non con carichi container. I piccoli rivenditori possono miscelare qualsiasi modello in magazzino in un unico ordine e scegliere trasporto espresso o marittimo.
    - title: Spedizione diretta a te
      description: Gli ordini vengono spediti direttamente dalla nostra base logistica di Weihai a casa tua in 50+ paesi — express per campioni e piccoli ordini, trasporto marittimo consolidato per la vendita all'ingrosso.
quality_section:
  tagline: Qualità e garanzia
  title: La qualità dietro ogni tavola
  subtitle: Prezzi in eccesso non significano mai standard rilassati. Ogni scheda — qualunque sia la sua fonte — passa lo stesso processo prima di essere spedita.
  items:
    - title: Testato a pressione al 100%.
      description: Ogni singola tavola viene gonfiata e sottoposta a test di pressione a 15 PSI prima della spedizione. Nessuna tavola viene spedita senza essere stata testata, indipendentemente da dove provenga il suo inventario.
    - title: Test di sovraccarico fino a 1,25x
      description: Le tavole delle nostre produzioni vengono testate a campione oltre la pressione nominale — mantenute a 1,25x la pressione di lavoro per 24–48 ore per verificare cuciture, valvole e la costruzione drop-stitch.
    - title: Tasso di superamento dell'ispezione finale del 99,3%
      description: Il nostro processo di ispezione finale passa il 99,3% delle tavole come prive di difetti — e la piccola frazione che non supera il test non entra mai nel nostro inventario in eccesso.
    - title: Garanzia di 2 anni SUP
      description: Ogni tavola SUP dispone di una garanzia di 2 anni SUP che copre i difetti di fabbricazione. La stessa garanzia si applica a ogni cliente in ciascuno dei nostri 50+ mercati.
