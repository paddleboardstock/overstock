team_section:
  tagline: Il Team
  title: Le persone dietro le tavole
  description: La nostra sede di Weihai ospita un team di ricerca e sviluppo di 14+ persone che copre materiali, design strutturale e processi produttivi. Attorno a loro opera il team più ampio che si occupa di controllo qualità, inventario, logistica e del supporto che ricevi quando ci contatti — le stesse persone, sia che tu stia acquistando una tavola o venti.
