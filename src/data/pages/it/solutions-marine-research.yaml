content_challenge:
  tagline: La sfida
  title: La ricerca marina richiede<br />piattaforme stabili e pronte per gli strumenti
  subtitle: Le imbarcazioni da lavoro scientifiche devono fornire una piattaforma stabile per la strumentazione sensibile, un funzionamento silenzioso per evitare di disturbare la fauna selvatica e layout flessibili per diverse apparecchiature di ricerca.
  paragraphs:
    - La ricerca marina e il monitoraggio ambientale richiedono imbarcazioni da lavoro che fungano da laboratori mobili. A differenza delle imbarcazioni commerciali o da diporto, i RIB per la ricerca devono ospitare strumentazione elettronica sensibile, attrezzature per il campionamento di acqua e sedimenti e talvolta il trasporto di esemplari viventi — mantenendo al contempo una piattaforma stabile per una raccolta dati accurata.
    - '**La stabilità della piattaforma è fondamentale** — Sonar, ecoscandagli e profiler CTD (conduttività, temperatura, profondità) richiedono uno scafo stabile a fermo e a bassa velocità. Una scia eccessiva o i movimenti dello scafo introducono rumore nei dati scientifici. Uno scafo a V profonda con buone caratteristiche di stabilità è indispensabile.'
    - '**Integrazione degli strumenti** — Le navi da ricerca necessitano di punti di fissaggio per antenne GPS, trasduttori sonar, bracci di campionamento e apparecchiature di registrazione dati. Lo spazio della consolle deve ospitare più display, la distribuzione di energia per gli strumenti e un deposito sicuro per l''elettronica sensibile.'
    - '**Funzionamento silenzioso** — Per le indagini di biologia marina e il monitoraggio ambientale, il rumore del motore e le vibrazioni dello scafo possono spaventare la vita marina e compromettere le osservazioni comportamentali. Configurazioni fuoribordo silenziose e progetti di scafo a vibrazioni ridotte sono importanti per le applicazioni di ricerca.'
    - I RIB per la ricerca Paddle Board Overstock sono progettati con piattaforme di scafo stabili, sistemi integrati di fissaggio delle attrezzature e configurazioni fuoribordo silenziose per applicazioni scientifiche e di monitoraggio ambientale.
content_solution:
  tagline: La nostra soluzione
  title: RIB di ricerca appositamente costruiti<br />Per lavori scientifici e ambientali
  subtitle: Ogni RIB di ricerca Paddle Board Overstock è configurato come una piattaforma stabile e personalizzabile per strumentazione scientifica e apparecchiature di campionamento sul campo.
  list:
    - Scafo in fibra di vetro a V profonda con eccellente stabilità a fermo e alle basse velocità di indagine
    - Ponte piatto con piastre di fissaggio per sonar, GPS e attrezzature di campionamento
    - Consolle configurata per più display — cartografo, ecoscandaglio, registratore di dati
    - Distribuzione di alimentazione accessori a 12 V e 24 V per gli strumenti scientifici
    - Fuoribordo a 4 tempi silenzioso — vibrazioni e rumore minimi per i censimenti della fauna
    - Progetto di scafo a bassa scia opzionale per disturbo minimo durante la raccolta dati
    - Colori dei tubi personalizzati per il branding degli istituti di ricerca e l'identificazione della flotta
content_segments:
  tagline: Profili di ricerca
  title: Soluzioni per le scienze marine<br />Per tipo di applicazione
  subtitle: "Diverse applicazioni di ricerca hanno requisiti di imbarcazioni unici: dalle piattaforme didattiche universitarie alle navi per indagini ambientali ai RIB per il monitoraggio della qualità dell'acqua."
  items:
    - title: Programmi universitari di scienze marine
      subtitle: Piattaforme didattiche, gite studentesche, ricerca costiera
      description: Le università di scienze marine e i dipartimenti di oceanografia necessitano di imbarcazioni da lavoro affidabili e versatili per l'insegnamento di corsi sul campo, progetti di ricerca degli studenti e indagini costiere guidate dai docenti. La barca deve essere facile da usare per gli studenti sotto supervisione, sufficientemente stabile per l'utilizzo pratico degli strumenti e sufficientemente resistente per un uso frequente da parte di più utenti in tutti i termini accademici. I vincoli di budget negli ambienti accademici rendono importanti considerazioni il rapporto costo-efficacia e la bassa manutenzione.
      features:
        - Piattaforma stabile per l'esercitazione degli studenti al dispiegamento e al recupero degli strumenti
        - Utilizzo semplice — configurazione a barra o a consolle singola per l'uso studentesco supervisionato
        - Tubi in Hypalon resistenti per approdi frequenti sulla spiaggia e la manipolazione da parte degli studenti
        - Fissaggio di attrezzature per sonar didattico, disco di Secchi e strumentazione di campionamento
        - Opzione in PVC conveniente per i programmi accademici con budget limitato
    - title: Istituti di ricerca marina
      subtitle: Rilievo RIB con integrazione strumentale, GPS, attrezzatura per campionamento
      description: Le organizzazioni dedicate alla ricerca marina che conducono indagini costiere e offshore necessitano di gommoni per indagini configurati professionalmente con strumentazione integrata. Queste navi trasportano sistemi sonar per la mappatura batimetrica, profilatori CTD per l'analisi della colonna d'acqua, campionatori di sedimenti e apparecchiature per la raccolta biologica. L'imbarcazione deve fornire una piattaforma stabile a velocità di rilevamento lente, disporre di ampio spazio sul ponte per l'installazione delle apparecchiature e offrire alimentazione pulita a 12 V/24 V per i componenti elettronici.
      features:
        - Fissaggio integrato del trasduttore sonar — configurazione passascafo o a specchio di popa
        - Fissaggio dell'antenna GPS e integrazione nella consolle per una navigazione di livello professionale
        - Area di dispiegamento di CTD e campionatore d'acqua con punti di fissaggio sicuri
        - Distribuzione di alimentazione ausiliaria a 12 V/24 V per strumenti e registratori di dati
        - Stabile a bassa velocità (3-6 nodi) per la precisione delle linee di indagine
        - Portale a A o gruetta opzionale per dispiegare attrezzature di campionamento più pesanti
    - title: Monitoraggio e conservazione ambientale
      subtitle: Indagini ecologiche, osservazione della fauna selvatica, valutazione dell'habitat
      description: Le ONG ambientali, le agenzie governative e le organizzazioni ambientaliste conducono indagini ecologiche marine, monitoraggio della popolazione selvatica e valutazioni degli habitat. Queste operazioni richiedono navi silenziose e a basso impatto che possano avvicinarsi ad habitat sensibili senza disturbare la fauna selvatica. Le barche devono trasportare attrezzatura fotografica, GPS per la mappatura dei transetti e attrezzature per il campionamento per la raccolta di acqua e sedimenti. Una scia bassa e un rumore minimo del motore sono fondamentali per gli studi di osservazione comportamentale.
      features:
        - Fuoribordo a 4 tempi silenzioso — disturbo minimo alla fauna marina
        - Piattaforma di osservazione stabile per la documentazione fotografica e video
        - Fissaggio di attrezzature per supporti fotografici, localizzatori GPS e computer da campo
        - Pescaggio ridotto per accedere a zone umide costiere, mangrovie ed estuari
        - Superfici di ponte e tubi facili da pulire per la decontaminazione tra i siti
    - title: Monitoraggio e analisi della qualità dell'acqua
      subtitle: Campionamenti regolari, monitoraggio degli inquinanti, monitoraggio della conformità
      description: Le organizzazioni di monitoraggio della qualità dell'acqua eseguono campionamenti regolari nelle zone costiere, nei porti e nei corsi d'acqua interni per monitorare i livelli di inquinamento, la proliferazione di alghe e il rispetto delle normative ambientali. Queste operazioni necessitano di imbarcazioni efficienti e affidabili per visite ripetute alle stazioni di campionamento fisse. La nave deve trasportare apparecchiature di campionamento, refrigeratori per la conservazione dei campioni e attrezzature per i test sul campo, con un facile lavaggio del ponte tra i siti di campionamento per prevenire la contaminazione incrociata.
      features:
        - Area dedicata alla stazione di campionamento con contenitore refrigerante e deposito attrezzature
        - Ponte e superfici dei tubi facili da pulire per la decontaminazione tra i siti
        - Integrazione GPS per il ritorno preciso a coordinate di campionamento fisse
        - Dimensioni compatte per l'accesso a vie d'acqua riservate e canali stretti
        - Fuoribordo a basso consumo per campagne di campionamento regolari ed economiche
