hero:
  tagline: Perché Paddle Board Overstock
  title: Costruito diversamente. Costruito per durare.<br />Le tavole dietro Water Adventures Worldwide
  subtitle: Non solo una fabbrica — un team di canoisti e ingegneri che progettano, testano e costruiscono tavole gonfiabili SUP premium per famiglie, avventurieri e club in tutto il mondo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Qualità produttiva ed esperienza Paddle Board Overstock
pillars:
  tagline: Tre pilastri della qualità
  title: Perché i pagaiatori di tutto il mondo scelgono Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Progettato per uso commerciale
      description: Le nostre tavole sono progettate per anni di pagaiate regolari. PVC drop-stitch Nuclei commerciali rinforzati, UV materiali stabili e hardware collaudato sul campo significano una manutenzione inferiore e una durata più lunga in acqua.
      icon: tabler:building-factory
      callToAction:
        text: Vedi la linea di prodotti commerciali
        href: /products
    - title: Testati oltre gli standard
      description: Ogni tavola viene gonfiata a 1,25 volte la sua pressione nominale per 24-48 ore prima di uscire dalla nostra fabbrica — 100% testata a pressione, 99,3% senza difetti. La tua tavola è dimostrata resistente prima ancora di toccare l'acqua.
      icon: tabler:shield-check
      callToAction:
        text: Vediamo come testiamo
        href: /quality
    - title: Progettato per condizioni globali
      description: "Prodotti ottimizzati per ogni clima: formulazioni PVC per acque fredde per l'Europa, materiali resistenti ai raggi UV per Medio Oriente e Australia, trattamenti anti-umidità per il Sud-est asiatico. Ogni spedizione è calibrata sull'ambiente di destinazione."
      icon: tabler:world
