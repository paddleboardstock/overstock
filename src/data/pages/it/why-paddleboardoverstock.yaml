reasons:
  tagline: La differenza Paddle Board Overstock
  title: Cosa ci distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Produzione reale, non intermediazione
      description: Possediamo e gestiamo una fabbrica di 12.000 m². Quando collabori con Paddle Board Overstock, lavori direttamente con le persone che progettano, sviluppano e costruiscono i tuoi prodotti — senza intermediari.
      icon: tabler:building-factory
    - title: Approccio guidato dall'ingegneria
      description: Il nostro processo di progettazione inizia dal caso d'uso, non dalla categoria di prodotto. Ottimizziamo la forma dello scafo, la selezione dei materiali e la configurazione per come la tavola verrà effettivamente utilizzata sull'acqua.
      icon: tabler:engine
    - title: Qualità comprovata
      description: Ogni scheda viene sottoposta a pressione testata a 1,25 volte la sua pressione nominale per 24-48 ore prima della spedizione, e il 99,3% delle nostre spedizioni arriva senza difetti — garantito dalla garanzia.
      icon: tabler:award
    - title: Progettazione Rower-First
      description: 'Ogni modello inizia da come pagai: piattaforme stabili per principianti, forme aerodinamiche per il touring e terrazze a grandezza naturale per lo yoga. Noi progettiamo per veri pagaiatori, non per specifiche da showroom.'
      icon: tabler:adjustments
    - title: Logistica globale
      description: Magazzino negli Stati Uniti in California, spedizione diretta da Weihai, trasporto aereo per ordini urgenti. Gestiamo pratiche doganali e documentazione in tutto il mondo.
      icon: tabler:truck-delivery
    - title: Supporto a vita
      description: Siamo in piedi dietro le tavole che abbiamo costruito 20 anni fa. Pezzi di ricambio autentici, consulenza tecnica, consigli per la riparazione — il nostro team è lì quando hai bisogno, ovunque tu sia.
      icon: tabler:lifebuoy
testimonials:
  tagline: Fidati da Paddlers di tutto il mondo
  title: Cosa dicono i pagaiatori
  items:
    - content: La mia Ocean Voyager ha gestito di tutto, dalle mattine tranquille sul lago ai pomeriggi costieri agitati. Dopo due stagioni, sembra ancora nuova.
      name: — Canoista ricreativo, California
    - content: Ero nervoso all'idea di comprare la mia prima tavola gonfiabile online, ma la qualità era evidente nel momento in cui l'ho gonfiata. Rigida, stabile e splendidamente finita.
      name: — SUP Proprietario alla prima volta, Germania
    - content: Reiamo in famiglia ogni fine settimana estivo. Tre tavole, nessun problema, e i bambini adorano i design vivaci.
      name: — Famiglia canoista, Australia
    - content: Il test di pressione non è un discorso di marketing — la mia tavola è solidissima a piena pressione e non mostra alcuna tensione dopo un anno di pagaiate settimanali.
      name: — Weekly Paddler, Paesi Bassi
cta:
  title: Pronto a trovare la tua tavola perfetta?
  subtitle: Parla con i nostri esperti di pagaia per consigli sinceri su come scegliere la tavola giusta — senza pressioni, solo un vero aiuto.
  actions:
    - variant: primary
      text: Parla con il nostro team
      href: /contact
    - text: Scarica il catalogo prodotti
      href: /resources
