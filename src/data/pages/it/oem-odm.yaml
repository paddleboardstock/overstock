faq:
  title: OEM/ODM — Domande Frequenti
  questions:
    - q: Qual è la quantità minima d'ordine (MOQ) per i SUP gonfiabili personalizzati?
      a: Per i modelli standard con stampi esistenti, la MOQ parte da 5–10 unità per design. Per stampi e attrezzature completamente personalizzati, la MOQ è generalmente di 200+ unità. Collaboriamo con startup e marchi emergenti per individuare punti di ingresso sostenibili.
    - q: Qual è la MOQ per i gommoni RIB personalizzati?
      a: I modelli RIB partono da 2–5 unità per design con stampi esistenti, mentre gli stampi RIB completamente personalizzati richiedono impegni maggiori. Collaboriamo con startup e marchi affermati per individuare punti di ingresso sostenibili.
    - q: Quanto dura il processo dei campioni OEM?
      a: I campioni di prototipo standard vengono completati entro 7–14 giorni lavorativi dall'approvazione del design. Gli ordini urgenti possono essere prioritizzati a 5–7 giorni dietro pagamento di un supplemento.
    - q: Qual è la differenza tra PVC e Hypalon per le imbarcazioni gonfiabili?
      a: Il PVC è più leggero, più economico e offre un'eccellente flessibilità alle basse temperature. L'Hypalon (CSM) offre una resistenza superiore ai raggi UV e all'ozono con una durata maggiore (10–15 anni contro 5–8 anni). Consigliamo il PVC per la maggior parte degli usi ricreativi e l'Hypalon per l'uso commerciale/professionale.
    - q: Potete personalizzare forma e design del gonfiabile?
      a: Sì. Il nostro team R&S può sviluppare stampi personalizzati per qualsiasi forma di scafo, profilo di tavola o configurazione del tubolare. Utilizziamo stampi in alluminio fresati a CNC per precisione e costanza.
    - q: Offrite servizi di audit in fabbrica?
      a: Accogliamo con favore audit in loco e di terze parti nel nostro impianto di 12 000 m² a Qingdao. Manteniamo le certificazioni ISO 9001 e BSCI e possiamo condividere i rapporti di audit dietro NDA.
    - q: Quali termini di spedizione offrite?
      a: Offriamo i termini di spedizione FOB Qingdao (standard), CIF e DDP. Il caricamento del container e la documentazione di esportazione completa sono inclusi in tutti gli ordini OEM.

