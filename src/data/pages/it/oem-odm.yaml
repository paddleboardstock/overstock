process_steps:
  title: Processo OEM/ODM in 6 Fasi
  subtitle: Dal brief di progettazione al FOB Qingdao — un flusso di lavoro semplificato
  steps:
    - number: '01'
      title: Brief di Progettazione e Modellazione CAD 3D
      description: Condividete le specifiche target, il prodotto di riferimento o il concept. Il nostro team di ingegneria sviluppa disegni CAD dettagliati e rendering 3D per la vostra approvazione.
      timeline: 3–5 giorni
    - number: '02'
      title: Selezione dei Materiali e Test dei Tessuti
      description: Scegliete tra PVC di livello militare (0,9–1,2 mm), Hypalon CSM o tessuti a nucleo drop-stitch. Eseguiamo test di resistenza alla trazione, adesione del rivestimento e stabilità ai raggi UV.
      timeline: 2–3 giorni
    - number: '03'
      title: Prototipazione Rapida e Produzione di Campioni
      description: Fresiamo stampi personalizzati con CNC e produciamo campioni di pre-produzione con i colori del vostro brand, il vostro logo e i materiali specificati. I campioni vengono spediti per la vostra approvazione.
      timeline: 7–14 giorni
    - number: '04'
      title: Test di Tenuta a Pressione di 24–48 Ore
      description: Ogni prototipo viene sottoposto a rigorosi test di ritenzione della pressione a 1,25x la pressione nominale. Vengono eseguiti test di scollamento delle cuciture e verifica dimensionale.
      timeline: 1–2 giorni
    - number: '05'
      title: Ispezione Qualità CE/ISO e Imballaggio
      description: Checklist di qualità a 100 punti. Ogni unità viene ispezionata prima dell'imballaggio pronto per il retail. Incluse dichiarazione di conformità CE e rapporto di conformità BSCI.
      timeline: 2–3 giorni
    - number: '06'
      title: Spedizione FOB Qingdao e Logistica
      description: I prodotti finiti vengono pallettizzati, avvolti in film termoretraibile e caricati in container al porto di Qingdao. Documentazione di esportazione completa, sdoganamento e tracciamento in tempo reale.
      timeline: 7–14 giorni

