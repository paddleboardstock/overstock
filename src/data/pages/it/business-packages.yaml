faq:
  title: Domande frequenti sul pacchetto
  questions:
    - q: Qual è la quantità minima d'ordine per i pacchetti?
      a: Il pacchetto Club Starter prevede un minimo di 10 unità. I pacchetti Resort e Brand sono personalizzati in base alle tue esigenze con MOQ flessibili.
    - q: Quanto tempo richiede la consegna?
      a: La produzione standard è di 30–45 giorni dalla conferma dell'ordine. La produzione accelerata è disponibile a un costo aggiuntivo.
    - q: Posso personalizzare i colori e il marchio dell'attrezzatura?
      a: 'SÌ. Tutti i pacchetti includono la personalizzazione completa: colori del cartone, stampe del logo e design della confezione.'
    - q: Fornite supporto post-vendita?
      a: SÌ. Ogni pacchetto include l'accesso alle nostre guide di manutenzione online, tutorial video e sistema di ordinazione dei pezzi di ricambio.
