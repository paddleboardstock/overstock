hero:
  tagline: Equipaggiamento
  title: Attrezzature e Macchinari per la Produzione
  subtitle: Apparecchiature di livello industriale per taglio, saldatura, stampa e assemblaggio
  back_label: Torna alla Fabbrica
  back_link: /factory
categories:
  - title: Taglio e Preparazione del Materiale
    items:
      - name: PVC Macchina da taglio automatica
        spec: CNC controllato, 6,5 m × 2,5 m, precisione 0,1 mm
        desc: Macchina da taglio automatica controllata da computer per tessuti PVC e drop-stitch. Il software di nesting ottimizza l'utilizzo dei materiali riducendo gli scarti sotto il 5%.
      - name: Stenditore di Tessuti
        spec: Larghezza massima 3 m, alimentazione a tensione controllata
        desc: Stende il tessuto in singoli o multipli strati con tensione controllata per prevenire distorsioni prima del taglio.
  - title: Saldatura e Bonding
    items:
      - name: Macchina per sigillatura termica
        spec: Saldatura ad aria calda, variabile 200–600 °C, 0,5–5 m/min
        desc: Macchina per saldatura termica ad aria calda per il bonding e la saldatura di laminati PVC, bande dei binari e giunture delle camere. Utilizzata per fissaggio temporaneo, sigillatura e fusione dei giunti del nucleo drop-stitch.
      - name: Pressa Dielettrica RF
        spec: 15 kW, piastra 2000 × 600 mm
        desc: Pressa a radiofrequenza per saldatura delle principali cuciture longitudinali, giunti traverse-tubi e fabbricazione di grandi camere.
      - name: Saldatrice RF Controllata CNC
        spec: 8 kW, tavolo XY 2500 × 1200 mm
        desc: Saldatura programmabile di cuciture curve per geometrie complesse, rilievo logo e patchwork di precisione.
  - title: Arte del mazzo e finitura
    items:
      - name: EVA Macchina per tagliare i ponti
        spec: Taglio con coltello CNC, larghezza 2 m
        desc: Taglio di precisione dei pannelli in schiuma del ponte EVA per i modelli della serie artistica. Ogni pannello è tagliato su misura per un adattamento senza cuciture dell'intero ponte.
      - name: Pressa per Laminazione del Ponte
        spec: Temperatura e pressione controllate
        desc: Fissa i pannelli del ponte EVA alla superficie della tavola con adesione costante su tutta l'area del ponte.
  - title: SUP Stampa e decorazioni
    items:
      - name: Stampante digitale
        spec: Getto d'inchiostro ad alta risoluzione, larghezza di stampa fino a 2 m
        desc: Stampa digitale direct-to-fabric per SUP grafica a colori per deck. Stampa su carta, sfumature personalizzate, sfumature e immagini di qualità fotografica con UV inchiostri a base d'acqua resistenti.
      - name: Macchina per la serigrafia
        spec: Registrazione manuale e semiautomatica, multicolore
        desc: SUP Serigrafia per loghi a tavola, marchi e motivi ripetuti. Fornisce stampe durevoli e opache con saturazione dei colori vivaci.
  - title: Assemblea finale
    items:
      - name: Stazione di Coppia delle Valvole
        spec: Test di funzione calibrato a 10 cicli
        desc: Installa e copre le valvole di gonfiaggio, poi testa la funzione di ogni valvola attraverso 10 cicli di apertura/chiusura.
      - name: Setter a pinne e a d-ring
        spec: Allineato con jig, polimerizzato con adesivo
        desc: Posiziona e lega le cassette delle alette, gli anelli a D e le manette nelle posizioni esatte del ponte secondo la specifica del modello.
  - title: Test e controllo qualità
    items:
      - name: Tester di trazione universale
        spec: Capacità di 50 kN
        desc: Test di forza di rottura, allungamento alla rottura e propagazione delle strappi per lotti di tessuto.
      - name: Impianto di prova per la ritenzione dell'aria
        spec: Programmabile, mantenimento di pressione in 30 minuti
        desc: Test automatico di mantenimento della pressione per ogni camera a tubo prima dell'assemblaggio.
      - name: Tester di peeling di cucitura
        spec: Fuga motorizzata di 180° a 100 mm/min
        desc: Test di resistenza per saldatura e stacco di giunture incollate secondo il protocollo interno.
      - name: Camera di Intemperie ad Arco Xenonico
        spec: Esposizione 2000 h
        desc: UV test di resistenza per il cambiamento del colore e la ritenzione della resistenza.
cta:
  title: Sei interessato a un giro della fabbrica?
  desc: Accogliamo i visitatori nella nostra struttura di Weihai. Vedete di persona le nostre attrezzature e i nostri processi.
  label: Prenota una visita →
  link: /contact
tldr:
  summary: Paddle Board Overstock gestisce 12.000 m² di spazio produttivo dotato di macchine automatiche per il taglio PVC, saldatrici RF ad alta frequenza, stazioni di taglio e finitura EVA del ponte, presse per sigillatura a caldo e impianti di assemblaggio finale. Ogni tavola supera il test di tenuta alla pressione pari a 1,25 volte quella nominale.
  points:
    - Taglio automatico PVC con precisione CNC
    - Saldatura RF ad alta frequenza per l'integrità delle cuciture
    - Stazioni di taglio e rifinitura a mano del ponte EVA
    - Impianti per torsione delle valvole e assemblaggio delle box delle pinne
    - Test di tenuta alla pressione pari a 1,25 volte quella nominale sul 100% delle tavole
