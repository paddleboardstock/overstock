hero:
  tagline: Hotel, resort e ospitalità
  title: Esperienze premium sul lungomare<br />Per hotel, resort e yacht club
  subtitle: "Programmi chiavi in mano per sport acquatici per hotel sulla spiaggia, resort su isole private, beach club e yacht club: dall'attrezzatura per gli ospiti e i tender per gommoni ai sistemi di sicurezza e alla formazione del personale."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Gommoni Aquafarer per attività sul lungomare dei resort
direct_answer: Aquafarer collabora con hotel, resort, isole private, beach club e yacht club in tutto il mondo per creare esperienze premium sul lungomare. Le nostre soluzioni includono flotte di noleggio SUP, kayak per tour guidati, tender RIB per il trasporto degli ospiti, piccoli RIB di lusso per trasferimenti nei beach club e sistemi di sicurezza completi. Ogni attrezzatura può essere personalizzata con il logo e la combinazione di colori della tua proprietà. Forniamo inoltre formazione del personale, consulenza sulla progettazione dei programmi e pianificazione della sostituzione della flotta per garantire una qualità costante durante le stagioni.
solution_offerings:
  - title: Pacchetto standard del resort
    subtitle: Per strutture di piccole e medie dimensioni (50-150 camere)
    badge: Popular
    features:
      - title: Flotta ospiti
        description: 20-50 SUP e kayak con colori e loghi del marchio del resort
      - title: Infrastruttura di sicurezza
        description: Postazioni di salvataggio, linee di boa, segnaletica di sicurezza e postazioni di pronto soccorso
      - title: Conservazione e manutenzione
        description: Sistemi di rack, stazioni di gonfiaggio e liste di controllo per l'ispezione giornaliera
      - title: Formazione del personale
        description: Orientamento in loco per il personale addetto alle attività sulla movimentazione delle attrezzature e sulla sicurezza degli ospiti
      - title: Avvia il supporto
        description: Playbook del programma con modelli di prezzi, moduli di esenzione e programmi di attività
    cta_text: Progetta la tua soluzione resort
    cta_href: /contact
  - title: Pacchetto Resort Premium
    subtitle: Per immobili di lusso e operazioni su larga scala
    badge: Premium
    features:
      - title: Flotta Premium
        description: Oltre 50-100 SUP, kayak, pedalò e tender RIB con personalizzazione completa
      - title: Sicurezza avanzata
        description: Torri di salvataggio, sistema radio, scheda di salvataggio, DAE e piano d'azione di emergenza
      - title: Esperienza dell'ospite
        description: Chiosco per il check-in, esposizione delle attrezzature, cabine per spogliatoi, deposito sulla spiaggia
      - title: Programma delle entrate
        description: Guida ai prezzi dinamici, formazione sull'upsell, strategie di raggruppamento dei pacchetti
      - title: Supporto stagionale
        description: Stoccaggio fuori stagione, ispezione di fine stagione, aggiornamento degli ordini
    cta_text: Migliora l'esperienza del resort
    cta_href: /contact
