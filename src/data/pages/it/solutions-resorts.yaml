    description: Sistemi di sicurezza completi riducono la responsabilità e garantiscono la conformità normativa
  - icon: refresh
    title: Flessibilità stagionale
    description: Attrezzature durevoli progettate per il noleggio giornaliero con soluzioni di rimessaggio stagionale
