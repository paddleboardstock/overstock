testimonial:
  content: Paddle Board Overstock ha progettato e attrezzato l'intero programma di attività sulla spiaggia su tre proprietà del resort. 120 SUPs, infrastrutture di sicurezza e formazione del personale — tutto consegnato in un'unica spedizione. La partecipazione degli ospiti alle attività acquatiche è aumentata del 60% nella prima stagione.
  name: Sophie Laurent
  title: Direttore dell'esperienza degli ospiti, Azure Bay Resorts - Phuket, Tailandia
content_segments:
  tagline: Profili dei resort
  title: Waterfront Hospitality Solutions<br />Per Tipo di Proprietà
  subtitle: Ogni struttura resort ha un profilo di ospite, un mix di attività e un ritmo operativo unici, dai boutique eco-lodge ai tentacolari resort di lusso sulla spiaggia. Progettiamo programmi di sport acquatici che corrispondono alla classe della struttura e alle aspettative degli ospiti.
  items:
    - title: Resort di lusso sulla spiaggia
      subtitle: Trasferimenti VIP, attività acquatiche, esperienza premium per gli ospiti
      description: "Proprietà di fascia alta sulla spiaggia - Four Seasons, Aman e gruppi di lusso simili - dove gli sport acquatici sono un servizio principale per gli ospiti che determinano punteggi di soddisfazione e entrate accessorie. La flotta deve apparire premium, offrire varietà per gruppi di età e livelli di abilità e integrarsi perfettamente con i sistemi di portineria e prenotazione esistenti del resort. Le aspettative sull'aspetto degli ospiti sono estremamente elevate: le condizioni dell'attrezzatura e la presentazione influiscono direttamente sulle recensioni a 5 stelle."
      features:
        - Flotta di fascia premium di SUPs nei colori coordinati del resort
        - "Presentazione pronta per gli ospiti: colori coordinati del resort, marchio del logo, esposizione dell'attrezzatura allestita"
        - Tavole della serie artistica firmata per esperienze premium degli ospiti e momenti fotografici
        - 'Infrastruttura di sicurezza integrata: linee con boe, postazioni di bagnino, defibrillatore'
        - 'Gestione dei ricavi: modelli di prezzo dinamici, formazione per vendite aggiuntive, pacchetti combinati'
    - title: Resort su Isole Private
      subtitle: Attività acquatiche tranquille e autosufficienti per ospiti
      description: "I resort privati sull'isola operano in luoghi remoti dove la logistica è complessa e ogni consegna conta. Le attività acquatiche per gli ospiti devono essere autosufficienti: attrezzature che si conservano in modo compatto, si gonfiano su richiesta, richiedono manutenzione minima e si presentano perfettamente all'arrivo degli ospiti. Pianifichiamo i programmi di flotta attorno alle finestre per idrovolanti e merci marittime, e la nostra costruzione resistente mantiene le attrezzature pronte agli ospiti per lunghe stagioni senza supporto della terraferma."
      features:
        - Flotta compatta gonfiabile — navi e materiali in modo efficiente su isole remote
        - Costruzione di livello commerciale PVC per uso ospite in più stagioni
        - Manutenzione in loco facile con kit di riparazione inclusi e guida video
        - Branding personalizzato per resort che si abbina all'estetica dell'isola
    - title: Resort sul lago ed ecologici
      subtitle: Esperienze per gli ospiti integrate nella natura
      description: Proprietà sul lago, eco-lodge e ritiri naturalistici che offrono attività acquatiche tranquille e a basso impatto che si integrano con l'ambiente naturale. Le attrezzature dovrebbero essere non motorizzate dove possibile, facili da conservare dove lo spazio è limitato e silenziose durante l'uso per preservare l'esperienza ambientale di tutti gli ospiti.
      features:
        - SUP Flotta non motorizzata in una serie artistica ispirata alla natura
        - Stazioni di inflazione silenziose della pompa elettrica per l'uso on-demand da parte degli ospiti
        - Materiali e imballaggi ecologici in linea con il marchio sostenibile
        - Rack di stoccaggio e sistemi di organizzazione in moli includevano
    - title: Club sulla spiaggia
      subtitle: Intrattenimento per gli ospiti e atmosfera sul lungomare
      description: I beach club operano in un ambiente ad alta energia e visivo dove l'attrezzatura fa parte dell'atmosfera. Hanno bisogno di paddle board eleganti per l'intrattenimento degli ospiti, SUP noleggio per le attività sulla spiaggia e attrezzature che siano belliche quanto la location stessa. La flotta deve essere facile da gestire, resistere all'uso quotidiano da parte di ospiti con diversi livelli di abilità e schierarsi rapidamente durante le ore di punta.
      features:
        - Serie artistiche di punta SUPs che fungono anche da decorazione per location
        - Flotta pronta per l'affitto SUP per l'intrattenimento degli ospiti
        - Colori personalizzati e branding che corrispondono all'identità visiva del beach club
        - Sistemi di lancio e recupero rapido per operazioni ad alto turnover
        - UV- costruzione resistente all'esposizione quotidiana all'acqua salata
    - title: Club di membri privati ​​e yacht club
      subtitle: Sport acquatici membri e programmi esclusivi di canoa
      description: Club privati dove gli sport acquatici sono un vantaggio per i membri piuttosto che un fattore di entrate. Le attrezzature devono rispettare standard estetici più elevati, essere disponibili su richiesta per i membri e richiedere una supervisione minima del personale. I club nautici della marina utilizzano SUP flotte a marchio per il tempo libero dei membri intorno al porto. Lo stoccaggio e la manutenzione dovrebbero essere invisibili ai membri.
      features:
        - SUP Flotte premium per sport acquatici membri
        - 'Equipaggiamento premium: EVA deck, colori personalizzati dei membri, rivestimenti di marca'
        - Sistema di self-service per l'accesso dei membri senza personale
        - Stoccaggio fuori stagione e programma annuale di aggiornamento
    - title: Hotel incentrati sull'avventura e sulle attività
      subtitle: Visite guidate, SUP yoga, escursioni snorkeling, attività di gruppo
      description: Le proprietà si posizionano come destinazioni avventurose, offrendo visite guidate, SUP yoga, paddle al tramonto, escursioni di snorkeling e attività di gruppo. La flotta deve supportare sia modelli di noleggio gratuito che di programmi guidati, con attrezzature che possano passare senza soluzione di continuità tra i tour per uso autonomo degli ospiti e quelli guidati da istruttore. Queste proprietà necessitano di attrezzature durevoli per un turnover ad alta frequenza, con una facile pulizia tra i gruppi di ospiti.
      features:
        - Flotta mista versatile a supporto di modelli di tour guidati in noleggio +
        - Piattaforme extra-stabili SUP per attività di gruppo
        - 'Attrezzatura per guide: tavole per istruttori, cassette impermeabili, sistemi di comunicazione waterproof'
        - 'Rotazione stagionale delle attrezzature: flotta estiva → programma di stoccaggio invernale'
        - Costruzione durevole progettata per l'uso quotidiano degli ospiti con manutenzione minima
