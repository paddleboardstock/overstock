hero:
  tagline: Hotel, resort e ospitalità
  title: Esperienze Premium sul Lungomare<br />Per Hotel, Resort e Yacht Club
  subtitle: Programmi chiavi in mano di sport acquatici per hotel fronte mare, resort su isole private, beach club e yacht club — dall'attrezzatura per ospiti e sistemi di sicurezza alla formazione del personale e progettazione dei programmi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock SUP tavole per attività sul lungomare del resort
direct_answer: Paddle Board Overstock collabora con hotel, resort, isole private, beach club e yacht club in tutto il mondo per creare esperienze premium sul lungomare. Le nostre soluzioni includono flotte a noleggio SUP, attrezzatura per tour guidati, sistemi di sicurezza completi e equipaggiamento brandizzato per ogni struttura. Ogni pezzo di attrezzatura può essere personalizzato con il logo e lo schema colori della tua struttura. Offriamo inoltre formazione del personale, consulenza per la progettazione dei programmi e pianificazione della sostituzione delle flotte per garantire qualità costante durante le stagioni.
solution_offerings:
  - title: Pacchetto standard del resort
    subtitle: Per strutture di piccole e medie dimensioni (50-150 camere)
    badge: Popular
    features:
      - title: Flotta ospiti
        description: 20–50 SUPs con colori e loghi brandizzati del resort
      - title: Infrastruttura di sicurezza
        description: Postazioni di salvataggio, linee di boa, segnaletica di sicurezza e postazioni di pronto soccorso
      - title: Conservazione e manutenzione
        description: Sistemi di rack, stazioni di gonfiaggio e liste di controllo per l'ispezione giornaliera
      - title: Formazione del personale
        description: Orientamento in loco per il personale addetto alle attività sulla movimentazione delle attrezzature e sulla sicurezza degli ospiti
      - title: Avvia il supporto
        description: Playbook del programma con modelli di prezzi, moduli di esenzione e programmi di attività
    cta_text: Progetta la mia soluzione per il resort
    cta_href: /contact
  - title: Pacchetto Resort Premium
    subtitle: Per immobili di lusso e operazioni su larga scala
    badge: Premium
    features:
      - title: Flotta Premium
        description: 50–100+ SUPs con completa personalizzazione
      - title: Sicurezza avanzata
        description: Torri di salvataggio, sistema radio, scheda di salvataggio, DAE e piano d'azione di emergenza
      - title: Esperienza dell'ospite
        description: Chiosco per il check-in, esposizione delle attrezzature, cabine per spogliatoi, deposito sulla spiaggia
      - title: Programma delle entrate
        description: Guida ai prezzi dinamici, formazione sull'upsell, strategie di raggruppamento dei pacchetti
      - title: Supporto stagionale
        description: Stoccaggio fuori stagione, ispezione di fine stagione, aggiornamento degli ordini
    cta_text: Aggiorna l'Esperienza del Resort
    cta_href: /contact
benefits:
  - icon: star
    title: Soddisfazione dell'ospite
    description: Attrezzature premium che migliorano l'esperienza degli ospiti e ottengono recensioni a 5 stelle
  - icon: chart
