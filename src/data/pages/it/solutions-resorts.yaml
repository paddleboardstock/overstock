testimonial:
  content: Aquafarer ha progettato e attrezzato il nostro intero programma di attività in spiaggia in tre resort. 80 SUP, 40 kayak, infrastrutture di sicurezza e formazione del personale, tutto consegnato in un'unica spedizione. La partecipazione dei nostri ospiti alle attività acquatiche è aumentata del 60% nella prima stagione.
  name: Sophie Laurent
  title: Direttore dell'esperienza degli ospiti, Azure Bay Resorts - Phuket, Tailandia
content_segments:
  tagline: Profili dei resort
  title: Soluzioni per l'ospitalità sul lungomare<br />Per tipo di proprietà
  subtitle: Ogni struttura resort ha un profilo di ospite, un mix di attività e un ritmo operativo unici, dai boutique eco-lodge ai tentacolari resort di lusso sulla spiaggia. Progettiamo programmi di sport acquatici che corrispondono alla classe della struttura e alle aspettative degli ospiti.
  items:
    - title: Resort di lusso sulla spiaggia
      subtitle: Trasferimenti VIP, attività acquatiche, esperienza premium per gli ospiti
      description: "Proprietà di fascia alta sulla spiaggia - Four Seasons, Aman e gruppi di lusso simili - dove gli sport acquatici sono un servizio principale per gli ospiti che determinano punteggi di soddisfazione e entrate accessorie. La flotta deve apparire premium, offrire varietà per gruppi di età e livelli di abilità e integrarsi perfettamente con i sistemi di portineria e prenotazione esistenti del resort. Le aspettative sull'aspetto degli ospiti sono estremamente elevate: le condizioni dell'attrezzatura e la presentazione influiscono direttamente sulle recensioni a 5 stelle."
      features:
        - 'Flotta premium a marchio: SUP, kayak, pedalò e piccoli tender RIB'
        - 'Presentazione pronta per gli ospiti: colori in tinta con il resort, branding con logo, esposizione scenografica delle attrezzature'
        - Piccolo RIB di lusso per i trasferimenti di ospiti VIP con tappezzeria personalizzata e colori abbinati
        - 'Infrastruttura di sicurezza integrata: linee di boa, postazioni di salvataggio, DAE'
        - 'Gestione dei ricavi: modelli di prezzi dinamici, formazione sull''upsell, raggruppamento dei pacchetti'
    - title: Resort su isole private
      subtitle: 'Trasporto ospiti in qualsiasi condizione atmosferica: zero tempi di fermo, affidabilità assoluta'
      description: "I resort su isole private operano in località remote dove la barca è l'unico collegamento con la terraferma. I trasferimenti giornalieri degli ospiti, i rifornimenti e le evacuazioni mediche di emergenza dipendono da una singola nave: qualsiasi tempo di inattività ha un impatto diretto sull'esperienza degli ospiti e sulle operazioni del resort. Questi operatori necessitano di un'imbarcazione che funzioni in modo affidabile in tutte le condizioni atmosferiche, richieda una manutenzione minima e disponga di sistemi di backup per un'affidabilità mission-critical. La barca deve anche presentarsi magnificamente quando gli ospiti arrivano sull'isola."
      features:
        - Configurazione RIB per tutte le condizioni meteorologiche con copertura climatica completa e tubolari rinforzati
        - Previsione di motore doppio o di motore di riserva per operazioni senza tempi di fermo
        - Costruzione in Hypalon di grado commerciale per una durata di 5-8 anni in servizio in località remote
        - Design di facile manutenzione con componenti accessibili per l'assistenza in loco
        - Branding del resort personalizzato e tappezzeria premium in armonia con l'estetica dell'isola
    - title: Resort sul lago ed ecologici
      subtitle: Esperienze per gli ospiti integrate nella natura
      description: Proprietà in riva al lago, eco-lodge e rifugi nella natura che offrono attività acquatiche tranquille e a basso impatto che completano l'ambiente naturale. Ove possibile, le attrezzature non devono essere motorizzate, facili da riporre in rimesse per barche con spazio limitato e silenziose da utilizzare per preservare l'esperienza ambientale per tutti gli ospiti.
      features:
        - 'Flotta non motorizzata: SUP, kayak, canoe e pedalò'
        - Stazioni di gonfiaggio con pompe elettriche silenziose per l'uso su richiesta degli ospiti
        - Materiali e imballaggi ecologici in linea con il branding di sostenibilità
        - Inclusi rack di stoccaggio e sistemi di organizzazione per rimesse per barche
    - title: Club sulla spiaggia
      subtitle: Trasferimenti ospiti, animazione, piccoli gommoni di lusso
      description: "I beach club gestiscono un ambiente ad alta energia e focalizzato sulla vista, dove l'attrezzatura fa parte dell'atmosfera. Hanno bisogno di piccoli gommoni di lusso per i trasferimenti degli ospiti dagli hotel o dai moli vicini e di giochi acquatici per l'intrattenimento degli ospiti: traino di moto d'acqua, scivoli gonfiabili e paddle board. La flotta deve avere un aspetto elegante, essere facile da usare e resistere all'uso quotidiano da parte di ospiti con diversi livelli di abilità. Lo storage e la distribuzione rapida sono fondamentali durante le ore di punta."
      features:
        - RIB di lusso compatto (3,3-4,3 m) per i trasferimenti degli ospiti e il servizio di tender
        - 'Giochi acquatici: gonfiabili trainabili, tavole SUP, kayak per l''intrattenimento degli ospiti'
        - Colore e branding personalizzati in linea con l'identità visiva del beach club
        - Sistemi di varo e recupero rapidi per operazioni ad alto ricambio
        - Costruzione in Hypalon durevole per l'esposizione quotidiana ad acqua salata e UV
    - title: Club di membri privati e yacht club
      subtitle: Trasporti portuali, gare d'appalto per i membri, sport acquatici esclusivi
      description: Club privati in cui gli sport acquatici e il trasporto in barca rappresentano un vantaggio per i membri piuttosto che un fattore di entrate. Le attrezzature devono soddisfare standard estetici più elevati, essere disponibili su richiesta per i membri e richiedere una supervisione minima da parte del personale. Gli yacht club della marina necessitano specificamente di tender per il trasporto portuale, ovvero lo spostamento dei membri tra il molo, l'ormeggio e la riva. Lo stoccaggio e la manutenzione dovrebbero essere invisibili ai membri.
      features:
        - Tender RIB di alta gamma per il trasporto portuale e il servizio di trasferimento dei membri
        - 'Attrezzatura premium: ponti in EVA, colori personalizzati per i membri, tappezzeria a marchio'
        - Sistema di ritiro self-service per l'accesso dei membri senza personale
        - Stoccaggio fuori stagione e programma di aggiornamento annuale
    - title: Hotel incentrati sull'avventura e sulle attività
      subtitle: Visite guidate, SUP yoga, escursioni snorkeling, attività di gruppo
      description: Le proprietà si posizionano come destinazioni avventurose, offrendo visite guidate, SUP yoga, paddle al tramonto, escursioni di snorkeling e attività di gruppo. La flotta deve supportare sia modelli di noleggio gratuito che di programmi guidati, con attrezzature che possano passare senza soluzione di continuità tra i tour per uso autonomo degli ospiti e quelli guidati da istruttore. Queste proprietà necessitano di attrezzature durevoli per un turnover ad alta frequenza, con una facile pulizia tra i gruppi di ospiti.
      features:
        - Flotta mista versatile adatta ai modelli di noleggio + tour guidati
        - Kayak tandem e piattaforme SUP extra stabili per le attività di gruppo
        - 'Attrezzatura per guide: tavole da istruttore, casse stagne, comunicazioni impermeabili'
        - 'Rotazione stagionale delle attrezzature: flotta estiva → programma di stoccaggio invernale'
        - Costruzione durevole certificata per l'uso quotidiano da parte degli ospiti con manutenzione minima
