stories:
  tagline: Storie di Esploratori
  title: Veri avventure da persone vere
  subtitle: Ascolta gli appassionati di canottaggio, le famiglie e i professionisti che usano l'attrezzatura Paddle Board Overstock sull'acqua.
  items:
    - name: Sarah & Mike
      title: Proprietari di SUP Explorer 11, Canada
      content: Abbiamo portato i nostri Explorer 11 in un viaggio di una settimana attraverso il Parco Algonquin. Hanno gestito i trasbordi e l'attraversamento dei laghi in modo eccellente. La costruzione drop-stitch ci ha permesso di gonfiare fino a 15 PSI e ottenere le prestazioni di una tavola rigida da una tavola pieghevole.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Parco Algonquin, Canada
    - name: Carlos R.
      title: Cavaliere del Cheetah Surge, Spagna
      content: Il Cheetah Surge è la mia scelta per le crociere costiere. Il design vivace attira l'attenzione sulla spiaggia e la stabilità mi dà sicurezza anche con mare mosso. Si comporta magnificamente sia quando faccio il tour sia quando mi godo semplicemente il tramonto.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Spagna
    - name: Lina & famiglia
      title: Paddlers del Loto Fluttuante, Svezia
      content: Avventure familiari nel fine settimana sull'arcipelago. The Flowing Lotus è abbastanza stabile perché mia figlia possa stare in piedi mentre io remo. Si gonfia in meno di 10 minuti — nessun rimorchio necessario, solo puro divertimento in famiglia sull'acqua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Arcipelago di Stoccolma, Svezia
    - name: Andres D.
      title: Esploratore Ocean Voyager, Filippine
      content: Uso il mio Ocean Voyager per tour costieri a lunga distanza intorno a Palawan. Dopo mesi di utilizzo quotidiano in condizioni tropicali, la tavola funziona ancora come nuova. La forma da touring taglia l'acqua agitata che fermerebbe tavole di qualità inferiore.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filippine
    - name: Emma T.
      title: Tropical Breeze, prima volta, Australia
      content: Non avevo mai provato un SUP prima d’ora. Il Tropical Breeze è così stabile che mi sono sentito sicuro al primo tentativo. Ora vado in paddle tutti i fine settimana. La curva di apprendimento è praticamente zero — e la tavola sembra incredibile sull’acqua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
