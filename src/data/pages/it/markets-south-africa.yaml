hero:
  tagline: Sud Africa
  title: SUP Schede all'ingrosso per<br />Rivenditori sudafricani
  subtitle: Negozi e operatori di Cape Town, Durban e Garden Route — nuove tavole da paddle stock di 5 unità, modelli misti, spedite dalla Cina.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Pannelli di sovrascorte SUP per rivenditori e operatori sudafricani
direct_answer: Paddle Board Overstock fornisce nuove tavole gonfiabili di eccesso SUP a aziende sudafricane — negozi e scuole a Città del Capo, Durban e lungo la Garden Route, operatori di noleggio e venditori online. Gli ordini all'ingrosso partono da 5 tavole con modelli misti in un'unica spedizione, inviate da Weihai, Cina, tramite trasporto aereo espresso o trasporto marittimo consolidato. Ogni tavola è testata al 100% a pressione e coperta dalla garanzia di 2 anni SUP .
tldr_points:
  - All'ingrosso da 5 schede — modelli misti, prezzati in base alla quantità totale
  - Al servizio del mercato retail di sport da tavola più affermato dell'Africa
  - Trasporto aereo espresso o maritimo consolidato da Weihai, Cina
  - 100% testata a pressione, garanzia di 2 SUP anni su ogni scheda
overview_section:
  tagline: Panoramica del mercato
  title: Il SUP mercato sudafricano
  paragraphs:
    - Il Sudafrica ha il mercato degli sport da tavolo più maturo del continente. Città del Capo abbina piste di surf di livello mondiale e lagune di acque calme con una profonda cultura del surf; Durban gestisce spiagge di acque calde tutto l'anno; le lagune knysna e la baia di Plettenberg della Garden Route sono pensate per il canoato ricreativo. Un'infrastruttura commerciale ben consolidata e una vera comunità locale di canoatori — dai SUP surfisti ai pagaiatori di acque calme — distinguono questo mercato.
    - Buyers here are seasoned: negozi di surf con veri piani al dettaglio, scuole di pagaia con flotte e operatori di avventura che si SUP combinano con tour in kayak e ciclismo. Valutano l'attrezzatura come professionisti — costruzione, garanzia e riparabilità — e ordinano in piccoli lotti di 5–20 tavole, mescolando all-around di noleggio con edizioni premium per il negozio.
  customer_types:
    - title: Negozi di surf e pagaia
      description: Rivenditori consolidati a Città del Capo e Durban aggiungendo o ampliando SUP le file per la comunità locale di pagaiatori.
    - title: Scuole di Canoa e Affitti
      description: Scuole e flotte di noleggio su lagune e spiagge di acque calme che rinfrescano le tavole in un vero ciclo di sostituzione.
    - title: Operatori di avventura
      description: Gli operatori di Garden Route e Western Cape SUP aggiungono all'offerta di avventure multi-attività.
shipping_section:
  title: Nave per il Sudafrica
  paragraphs:
    - Gli ordini spediscono da Weihai, Cina. Il trasporto aereo espresso trasporta campioni e 1–3 ordini da bordo a Johannesburg e Città del Capo; il trasporto marittimo consolidato serve da 5 a 20 ordini all'ingrosso a bordo attraverso Durban, Città del Capo e altri porti. Le stime di transito per la destinazione sono incluse nel preventivo.
    - Forniamo le fatture commerciali e i requisiti di sgombero della lista di imballaggio, con codici HS corretti e valori dichiarati. Dazi di importazione e IVA sono dovuti all'importatore secondo le norme sudafricane.
  customs_note: La clearance SARS è basata sulla documentazione — verifica il trattamento attuale dei dazi e IVA per le attrezzature sportive gonfiabili con il tuo agente di compensazione prima di ordinare. Forniamo documenti completi e coerenti e rispondiamo rapidamente alle richieste dei broker.
faq_section:
  title: FAQ Sudafrica
  items:
    - q: Le tavole si adattano alle condizioni miste di Città del Capo?
      a: Sì. I modelli completi affrontano acque piatte da laguna e giornate costiere tranquille, e la gamma include tavole orientate al turismo per pagaie più lunghe. Per le discenze in mare aperto sottovento, i pagaiatori esperti dovrebbero discutere con noi il loro caso d'uso specifico prima di ordinare.
    - q: Com'è un ordine in negozio?
      a: 'Tipicamente 5–20 tavole: una base di modelli completi per lezioni e noleggio più edizioni artistiche premium per la parete commerciale — modelli misti, una spedizione, prezzata in quantità totale.'
    - q: Come viene cottato il trasporto merci verso il Sudafrica?
      a: Spedizione aerea espressa verso Johannesburg o Città del Capo per campioni e ordini piccoli; trasporto marittimo consolidato verso Durban o Città del Capo per quantità all'ingrosso. Entrambi sono dettagliati nel vostro preventivo con tempi di transito stimati.
    - q: Chi gestisce dazi doganali e IVA?
      a: Voi, come importatore, tramite il vostro agente doganale secondo le regole SARS. Forniamo la fattura commerciale e la lista di imballaggio con codici HS corretti e valori dichiarati.
