features3_reasons:
  tagline: Perché scegliere Aquafarer
  title: 'Sette motivi per collaborare con noi'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Produzione reale, non semplice trading'
      description: 'Possediamo e gestiamo una fabbrica di 12.000 m². Collaborando con Aquafarer, lavori direttamente con le persone che progettano, ingegnerizzano e costruiscono i tuoi prodotti, senza intermediari.'
      icon: tabler:building-factory
    - title: '2. Approccio guidato dall''ingegneria'
      description: 'Il nostro processo di progettazione parte dall''uso reale, non dalla categoria di prodotto. Ottimizziamo forma dello scafo, scelta dei materiali e configurazione in base a come l''imbarcazione verrà effettivamente utilizzata.'
      icon: tabler:engine
    - title: '3. Qualità certificata'
      description: 'Certificazione CE, sistema di qualità ISO, conformità BSCI, conformità REACH, approvazione USCG. I nostri 64 modelli certificati CE rispettano gli standard internazionali, non solo sulla carta.'
      icon: tabler:certificate
    - title: '4. OEM/ODM flessibile'
      description: 'Colori dei tubolari, layout della consolle, branding, imballaggio: personalizziamo tutto secondo le tue specifiche. Nessuna pressione sulle quantità minime. Inizia con un prototipo e scala con fiducia.'
      icon: tabler:adjustments
    - title: '5. Logistica globale'
      description: 'Magazzino negli Stati Uniti (California), spedizione diretta da Qingdao, trasporto aereo per ordini urgenti. Gestiamo noi le formalità doganali e la documentazione.'
      icon: tabler:truck-delivery
    - title: '6. Assistenza a vita'
      description: 'Supportiamo imbarcazioni costruite 20 anni fa. Ricambi originali, consulenza tecnica, guide alla riparazione: il nostro team è disponibile quando ne hai bisogno.'
      icon: tabler:lifebuoy
    - title: '7. Specifiche oneste'
      description: 'Portate reali, dimensioni reali, peso reale. Nessuna esagerazione di marketing. Ciò che pubblichiamo è ciò che ricevi, verificato con test indipendenti.'
      icon: tabler:ruler-measure
testimonials:
  tagline: La fiducia dei marchi di tutto il mondo
  title: Cosa dicono i nostri partner
  items:
    - content: 'Abbiamo lavorato con diversi produttori in Cina, ma Aquafarer si distingue per il supporto ingegneristico e la qualità costante. Trattano il nostro marchio come se fosse il loro.'
      name: '— Partner OEM, marchio europeo di sport acquatici'
    - content: 'I loro RIB in Hypalon sono in servizio nella nostra flotta da oltre 5 anni. Manutenzione minima, eccellente resistenza ai raggi UV. La garanzia di 5 anni sui tubolari ci dà fiducia.'
      name: '— Operatore di flotta, gruppo resort del Medio Oriente'
    - content: 'Il team di Aquafarer ci ha aiutato a sviluppare una tavola SUP personalizzata, dal concept alla produzione, in 90 giorni. La qualità ha superato le nostre aspettative.'
      name: '— Distributore, sport acquatici australiani'
