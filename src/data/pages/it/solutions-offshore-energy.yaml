content_challenge:
  tagline: La sfida
  title: Richiesta di energia offshore<br />Affidabilità in ambienti estremi
  subtitle: 'Le operazioni energetiche offshore spingono le apparecchiature al limite: condizioni meteorologiche estreme, località remote, cicli di lavoro continui e tolleranza zero per i guasti.'
  paragraphs:
    - "L'industria dell'energia offshore opera negli ambienti marittimi più impegnativi del pianeta. Le imbarcazioni da lavoro supportano piattaforme petrolifere e gasiere, installazioni di turbine eoliche offshore, operazioni di cavi sottomarini e progetti di costruzione marina — spesso in alto mare con finestre meteorologiche limitate. Un guasto alle attrezzature non è solo costoso: è pericoloso."
    - '**La sicurezza è la priorità assoluta** — I crew transfer vessel devono operare in sicurezza in stati di mare che fermerebbero qualsiasi altra operazione. La stabilità nel punto di trasferimento, l''affidabilità dei motori con qualsiasi tempo e una costruzione robusta per l''ormeggio ripetuto contro strutture offshore sono requisiti imprescindibili.'
    - '**La capacità per ogni condizione meteo è essenziale** — I parchi eolici offshore e le piattaforme petrolifere operano tutto l''anno. Le imbarcazioni da lavoro devono performare con mare mosso, venti forti e visibilità ridotta. Le operazioni diurne e notturne richiedono dotazioni di navigazione complete e sistemi di illuminazione affidabili.'
    - '**Il settore eolico offshore cresce rapidamente** — Migliaia di nuove turbine vengono installate a livello globale, ciascuna delle quali richiede trasferimenti regolari di personale, trasporto di attrezzature e supporto alla manutenzione. Ciò crea una domanda sostenuta di crew transfer vessel (CTV) e RIB di supporto progettati ad hoc.'
    - I RIB per l'energia offshore di Paddle Board Overstock sono progettati con scafi deep-V rinforzati, tubi Hypalon di alta resistenza, dotazioni di navigazione complete e sistemi di sicurezza pensati per le condizioni estreme delle operazioni di energia offshore.
content_solution:
  tagline: La nostra soluzione
  title: RIB offshore appositamente costruiti<br />Per il settore energetico
  subtitle: Ogni RIB per l'energia offshore Paddle Board Overstock è progettato per un funzionamento sicuro e affidabile in condizioni marine estreme, dal Mare del Nord al Sud-Est asiatico.
  list:
    - Scafo deep-V rinforzato per prestazioni in acque mosse e manegevolezza prevedibile
    - Tubi Hypalon di alta resistenza con resistenza a UV e agenti chimici per un servizio offshore prolungato
    - Ferramenta in acciaio inox 316 — nessuna corrosione in esposizione continua all'acqua salata
    - 'Dotazione di navigazione completa: GPS, radar, VHF, luci di navigazione notturna — di serie sui modelli offshore'
    - Ponte autosvuotante per operare in sicurezza quando il mare imbarca acqua
    - Configurazioni motore multiple — fuoribordo singolo o doppio per ridondanza di missione
    - Albero di traino e bitte di alta resistenza per la movimentazione di piattaforme e boe
    - Colori dei tubi ad alta visibilità per l'identificazione nei cantieri offshore
content_segments:
  tagline: Profili energetici
  title: Soluzioni energetiche offshore<br />Per tipo di applicazione
  subtitle: "Diversi settori dell'energia offshore hanno requisiti specifici per le imbarcazioni da lavoro: dai RIB di supporto delle piattaforme ai CTV dei parchi eolici alle navi per l'ispezione sottomarina."
  items:
    - title: Supporto per piattaforme offshore di petrolio e gas
      subtitle: Trasferimento equipaggio, fornitura attrezzature, messa in sicurezza della piattaforma
      description: Le piattaforme petrolifere e del gas richiedono il cambio giornaliero dell’equipaggio, il trasporto di attrezzature e forniture e una copertura di standby di sicurezza. Le imbarcazioni da lavoro devono operare in sicurezza attorno alle strutture delle piattaforme, in forti correnti e stati del mare variabili, e mantenere una posizione precisa durante il trasferimento del personale tramite scala o passerella. L'ambiente estremo (idrocarburi, sostanze chimiche, costante nebbia salina) richiede una struttura resistente alla corrosione e prestazioni affidabili.
      features:
        - Configurazione per il trasferimento dell'equipaggio con accesso di imbarco sicuro e corrimano
        - Tubi Hypalon anticorrosione e ferramenta in acciaio inox 316
        - Parabordi striscianti rinforzati per il contatto frequente con le difese della piattaforma
        - Ponte autosvuotante per acque oleose e lavaggi chimici
        - Serbatoio carburante di alta capacità per un'autonomia operativa offshore estesa
        - Opzione bimotore per ridondanza critica di missione
    - title: Operazioni di parchi eolici offshore
      subtitle: Trasferimento equipaggio, manutenzione turbine, trasporto attrezzature
      description: "L’energia eolica offshore è il settore in più rapida crescita nell’energia marina. Gli operatori necessitano di navi per il trasferimento dell’equipaggio (CTV) in grado di trasferire in sicurezza i tecnici alle piattaforme di accesso alle turbine in condizioni di mare fino a 1,5 m di altezza significativa delle onde. La stabilità durante il trasferimento, la capacità in qualsiasi condizione atmosferica e l'affidabilità del funzionamento quotidiano sono fondamentali. Le navi di servizio dei parchi eolici operano con tempistiche serrate: eventuali tempi di inattività ritardano la messa in servizio o la manutenzione delle turbine, incidendo direttamente sui ricavi della produzione di energia."
      features:
        - Forma dello scafo ottimizzata per un trasferimento stabile del personale alla base della turbina
        - Ingresso deep-V per una navigazione confortevole nel moto ondoso e nel swell offshore
        - Protezione meteo completa — console chiusa o tuga per il comfort dell'equipaggio
        - Spazio sul ponte per attrezzature, ricambi e apparecchiature di servizio
        - Pacchetto operazioni notturne per i turni invernali limitati dalla luce diurna
        - Funzionamento fuoribordo silenzioso per un impatto acustico minimo sull'ambiente marino
    - title: Supporto per cavi e condotte sottomarine
      subtitle: Ispezione, manutenzione, supporto ROV, rilievo
      description: Gli operatori di cavi e condutture sottomarine necessitano di imbarcazioni da lavoro per l'ispezione del percorso, il supporto alla manutenzione, le operazioni ROV e le attività di rilevamento. Queste navi richiedono piattaforme stabili per il dispiegamento e il recupero dell'attrezzatura subacquea, manovre precise per il tracciamento dei cavi e un funzionamento affidabile in ambienti costieri e offshore. La stabilità dell'imbarcazione è fondamentale per la precisione del sonar e delle apparecchiature di rilevamento.
      features:
        - Piattaforma stabile a bassa velocità per il tracciamento dei cavi e le operazioni di rilievo
        - Layout ponte aperto per l'impiego di ROV, rocchetti per cavi e strumentazione di rilievo
        - Piastre di montaggio per sonar, GPS e strumentazione di rilievo
        - Scafo a bassa scia per una perturbazione minima del fondale durante l'ispezione
        - Manovre precise a bassa velocità con sterzo fuoribordo reattivo
    - title: Supporto all'ingegneria navale e alla costruzione
      subtitle: Trasporto personale, fornitura materiali, supporto subacqueo
      description: Gli appaltatori di ingegneria navale che lavorano su progetti di costruzione di porti, protezione costiera e installazione offshore necessitano di imbarcazioni da lavoro versatili per il trasporto del personale tra le navi da costruzione e la costa, la fornitura di materiali e strumenti, il supporto alle immersioni e le indagini sul sito. Queste imbarcazioni operano in zone di costruzione attive con più imbarcazioni, spazi di manovra ristretti e condizioni del mare variabili. Durata e versatilità sono fondamentali.
      features:
        - Layout ponte multiuso per personale, materiali e attrezzature da immersione
        - Scala di immersione e supporti per attrezzature per le operazioni di supporto alle immersioni
        - Bitte di alta resistenza e albero di traino per le manovre nei cantieri
        - Costruzione Hypalon robusta resistente ai detriti da cantiere e all'abrasione
        - Configurazioni di seduta flessibili — modalità trasporto equipaggio o carico
