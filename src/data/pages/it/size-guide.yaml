how_to_choose:
  title: Come scegliere la misura giusta
  cards:
    - title: Tavole SUP Polivalenti
      description: Le nostre tavole all-around da ~11 piedi (larghezza 32", spessore 6 pollici drop-stitch) bilanciano stabilità, velocità e capacità. Abbina il volume della tavola al tuo peso — i pagaiatori più pesanti necessitano di più volume.
    - title: Larghezza e spessore
      description: Le tavole più larghe (32"+) offrono maggiore stabilità per principianti, yoga e pesca. Spessore di 6 pollici a 15 PSI mantiene il ponte rigido sotto il pagaiatore e l’attrezzatura.
    - title: Pacchetti e Accessori
      description: Ogni tavola viene spedita come pacchetto completo — tavola, zaino da viaggio, pompa a mano, pagaia regolabile, pinna removibile, leash a molla e kit di riparazione. Controlla il carico massimo per il rider più l’attrezzatura.
