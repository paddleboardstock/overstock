features3_brand:
  tagline: Chi siamo
  title: Fondazione del marchio<br />e patrimonio
  subtitle: La storia, l'esperienza e la portata globale che definiscono Paddle Board Overstock un SUP marchio affidabile.
  isBeforeContent: false
  columns: 3
  items:
    - title: Informazioni Paddle Board Overstock
      description: Fondata nel 2012 a Weihai, Cina. Da un'officina costiera a una struttura di 12.000 m² — la Paddle Board Overstock storia completa.
      icon: tabler:building-factory
      link: /about
    - title: Storia del marchio
      description: Come un team di ingegneri navali si è proposto di rendere accessibili a livello mondiale le tavole gonfiabili di livello professionale.
      icon: tabler:book
      link: /brand-story
    - title: Competenza nel settore marittimo
      description: Scienza profonda dei materiali, produzione di precisione e test reali — decenni di ingegneria navale in ogni consiglio.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Perché il paddle board è in stock
      description: Ciò che ci distingue — qualità, personalizzazione, prezzi diretti di fabbrica e supporto end-to-end per ogni canoista.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: La nostra squadra
      description: Incontra la leadership — ingegneri navali, scienziati dei materiali ed esperti di produzione che Paddle Board Overstock stanno andando avanti.
      icon: tabler:users
      link: /brand/team
    - title: Gruppo di ingegneri
      description: 78+ anni combinati di R&S, 40+ piattaforme, 1.200+ progetti ingegneristici. Il team tecnico dietro ogni prodotto.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Fiducia e qualità
  title: Qualità, Test<br />& Dimostrazione
  subtitle: Test rigorosi, dati reali e prove che dimostrino il nostro impegno per la qualità.
  isBeforeContent: false
  columns: 3
  items:
    - title: Qualità e test
      description: 'Ogni prodotto viene testato a pressione prima della spedizione. Resistenza delle cuciture, resistenza ai raggi UV, galleggiabilità: verificate in ogni fase.'
      icon: tabler:clipboard-check
      link: /quality
    - title: Prove e prove
      description: Risultati dei test, foto di implementazione, rapporti di ispezione di terze parti e casi di studio che Paddle Board Overstock validano la qualità.
      icon: tabler:file-check
      link: /evidence
    - title: Grafico della conoscenza
      description: Esplora il Paddle Board Overstock grafo di entità — prodotti, tecnologie, materiali e relazioni in una base di conoscenza connessa.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Direzione
  title: Incontra la squadra<br />Dietro Paddle Board Overstock
  subtitle: Competenze nel settore che spaziano dall'ingegneria marina, scienza dei materiali, gestione della qualità e e-commerce globale.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Fondatore e CEO
      description: 15+ anni nella produzione marina. In precedenza ha diretto R&D presso un importante produttore marino cinese. Detiene numerosi brevetti nella progettazione di prodotti gonfiabili.
      icon: tabler:crown
    - title: 'Zhang Wei: ingegnere capo'
      description: 20+ anni nella fabbricazione di polimeri e progettazione di strutture gonfiabili. Ex direttore tecnico presso una società europea di ingegneria marina.
      icon: tabler:engine
    - title: 'Chen Ming: responsabile della ricerca e sviluppo'
      description: Dottorato di ricerca in Scienza dei Materiali. Specializzato nella tecnologia drop-stitch e nella saldatura ad alta frequenza. Oltre 10 anni nel campo dei compositi tessili.
      icon: tabler:flask
    - title: 'Liu Qiang: direttore di produzione'
      description: 18+ anni di produzione snella. Ha implementato rigorosi sistemi di qualità su tutte le linee di produzione.
      icon: tabler:settings
    - title: 'Wang Fang: responsabile della qualità'
      description: 12+ anni di esperienza nel controllo qualità marittimo. Guida audit interni di qualità. Supervisiona i test per ogni lotto di produzione.
      icon: tabler:shield-check
    - title: Helen Lee – Direttore delle vendite
      description: 15 anni di esperienza nell'e-commerce internazionale e nella logistica. Spedisce tavole a rematori in 50 paesi. Fluente in 4 lingue.
      icon: tabler:briefcase
cta:
  title: Vuoi una prova della nostra qualità?
  subtitle: Contattaci per rapporti di test, registri di ispezione o per fissare una visita in fabbrica.
  actions:
    - variant: primary
      text: Richiedi documentazione
      href: /contact
