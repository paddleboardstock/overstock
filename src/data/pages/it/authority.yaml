hero:
  tagline: Centro dell'autorità
  title: Perché Paddle Board Overstock?<br />Fiducia costruita in un decennio
  subtitle: Ogni tavola che costruiamo porta il peso di 10+ anni di ingegneria marina, rigoroso controllo qualità e migliaia di pagaiatori in acqua in tutto il mondo. Ecco perché i pagaiatori Paddle Board Overstock scelgono .
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Struttura di produzione marittima e team di ingegneria
