features3_brand:
  tagline: Chi siamo
  title: Fondazione del marchio<br />e patrimonio
  subtitle: La storia, l'esperienza e la portata globale che definiscono Paddle Board Overstock come un produttore affidabile di attrezzature marine.
  isBeforeContent: false
  columns: 3
  items:
    - title: A proposito di Paddle Board Overstock
      description: 'Fondata nel 2012 a Qingdao, Cina. Da un laboratorio costiero a una struttura di 12.000 m²: la storia completa di Paddle Board Overstock.'
      icon: tabler:building-factory
      link: /about
    - title: Storia del marchio
      description: Come un team di ingegneri marini ha deciso di rendere accessibili in tutto il mondo moto d'acqua gonfiabili di livello professionale.
      icon: tabler:book
      link: /brand-story
    - title: Competenza nel settore marittimo
      description: 'Approfondita scienza dei materiali, produzione di precisione e test sul campo: decenni di ingegneria navale in ogni scafo.'
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Presenza globale
      description: Serve oltre 50 paesi in ogni continente. Competenza regionale per i requisiti normativi locali e le preferenze del mercato.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Perchè Paddle Board Overstock
      description: 'Ciò che ci distingue: qualità, personalizzazione, prezzi di fabbrica diretti e supporto end-to-end per gli operatori commerciali.'
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: La nostra squadra
      description: 'Incontra la leadership: ingegneri marini, scienziati dei materiali ed esperti di produzione che guidano Paddle Board Overstock nel progresso.'
      icon: tabler:users
      link: /brand/team
    - title: Gruppo di ingegneri
      description: Oltre 78 anni di ricerca e sviluppo combinati, oltre 40 piattaforme, 12 certificazioni, oltre 1200 progetti OEM. Il team tecnico dietro ogni prodotto.
      icon: tabler:engine
      link: /engineering-team
    - title: Centro di ricerca e sviluppo
      description: 'Ingegneria dello scafo, saldatura RF, laboratorio PVC, prototipazione, vasca di prova e laboratorio qualità: la nostra struttura completa di ricerca e sviluppo.'
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Fiducia e qualità
  title: Certificazioni, qualità<br />e prove
  subtitle: Certificazioni indipendenti, test rigorosi e prove reali che dimostrano il nostro impegno per la qualità.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certificazioni
      description: 'CE, ISO 9001, UKCA, BSCI, REACH: documentazione completa di certificazione e conformità per i mercati globali.'
      icon: tabler:shield-check
      link: /certifications
    - title: Qualità e test
      description: 'Ogni prodotto viene testato a pressione prima della spedizione. Resistenza delle cuciture, resistenza ai raggi UV, galleggiabilità: verificate in ogni fase.'
      icon: tabler:clipboard-check
      link: /quality
    - title: Prove e prove
      description: Risultati dei test, foto di implementazione, rapporti di ispezione di terze parti e casi di studio che convalidano la qualità di Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Grafico della conoscenza
      description: 'Esplora il grafico delle entità Paddle Board Overstock: prodotti, tecnologie, certificazioni e relazioni in una knowledge base connessa.'
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Direzione
  title: Incontra il team<br />dietro Paddle Board Overstock
  subtitle: Competenza nel settore che spazia dall'ingegneria navale, alla scienza dei materiali, alla gestione della qualità e al commercio B2B globale.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Fondatore e CEO
      description: Oltre 15 anni nella produzione navale. In precedenza ha guidato la ricerca e sviluppo presso un importante produttore di barche cinese. Detiene numerosi brevetti nella progettazione di gommoni.
      icon: tabler:crown
    - title: 'Zhang Wei: ingegnere capo'
      description: Oltre 20 anni di produzione in PVC/Hypalon e progettazione di scafi a V profonda. Ex direttore tecnico presso una società europea di ingegneria navale.
      icon: tabler:engine
    - title: 'Chen Ming: responsabile della ricerca e sviluppo'
      description: Dottorato di ricerca in Scienza dei Materiali. Specializzato nella tecnologia drop-stitch e nella saldatura ad alta frequenza. Oltre 10 anni nel campo dei compositi tessili.
      icon: tabler:flask
    - title: 'Liu Qiang: direttore di produzione'
      description: Oltre 18 anni di produzione snella. Cintura nera Six Sigma. Implementazione del sistema di qualità ISO 9001 su tutte le linee di produzione.
      icon: tabler:settings
    - title: 'Wang Fang: responsabile della qualità'
      description: Oltre 12 anni nel controllo di qualità nel settore marittimo. Revisore certificato CE e ISO. Supervisiona i test per ogni lotto di produzione.
      icon: tabler:shield-check
    - title: Helen Lee – Direttore delle vendite
      description: Oltre 15 anni nel commercio internazionale B2B. Ho gestito partnership OEM/ODM in oltre 30 paesi. Fluente in 4 lingue.
      icon: tabler:briefcase
cta:
  title: Vuoi verificare le nostre credenziali?
