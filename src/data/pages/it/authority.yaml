hero:
  tagline: Centro dell'autorità
  title: Perché Paddle Board Overstock?<br />Fiducia costruita in un decennio
  subtitle: Ogni barca che costruiamo porta il peso di oltre 10 anni di ingegneria navale, sistemi di qualità certificati e migliaia di operazioni di successo in tutto il mondo. Ecco perché i professionisti del settore scelgono Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Stabilimento di produzione navale e team di ingegneri Paddle Board Overstock
