hero:
  tagline: Guide
  title: Nuovo nel SUP?
  subtitle: Guide pratiche per aiutarti a scegliere, utilizzare e goderti l'attrezzatura gonfiabile per sport acquatici.
size_guide:
  tagline: Dimensioni e specifiche
  title: Trova la taglia giusta per le tue esigenze
  desc: Confronta le dimensioni del prodotto, la capacità di peso e gli usi consigliati. Che tu abbia bisogno di un SUP da touring, di un kayak compatto o di un RIB commerciale, la nostra guida alle taglie ti aiuta a scegliere la vestibilità giusta.
  link_label: Guida completa con specifiche del prodotto →
  link: /size-guide
  cards:
    - title: Tavole SUP
      desc: Scegli la lunghezza in base al peso e all'uso previsto. Le tavole più larghe (32"+) offrono maggiore stabilità. Le tavole più lunghe (11-12 piedi) tracciano meglio per i tour.
    - title: Kayak
      desc: Kayak singoli (9 piedi) per viaggi in solitaria e fiumi. Kayak tandem (12 piedi) per due canoisti o uno con attrezzatura. Controllare sempre la capacità di peso.
    - title: Gommoni e gommoni
      desc: Scegli la lunghezza in base al numero di passeggeri e all'utilizzo. RIB più grandi (4,5 m+) per offshore e salvataggio. Gommoni più piccoli (2,7 m) come tender e piattaforme da pesca.
