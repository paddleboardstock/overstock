hero:
  tagline: Guide
  title: Nuovo nel SUP?
  subtitle: Guide pratiche per aiutarti a scegliere, utilizzare e goderti l'attrezzatura gonfiabile per sport acquatici.
size_guide:
  tagline: Dimensioni e specifiche
  title: Trova la taglia giusta per le tue esigenze
  desc: Confronta le dimensioni della tavola, le capacità di peso e gli usi consigliati. Che tu voglia una tavola stabile per tutti gli usi o una forma più veloce per il touring, la nostra guida alle taglie ti aiuta a scegliere la misura giusta.
  link_label: Guida completa con specifiche del prodotto →
  link: /size-guide
  cards:
    - title: Tavole SUP Polivalenti
      desc: Le nostre tavole di circa 3,35 m (82 cm di larghezza) bilanciano stabilità, velocità e capacità. Il core da 15 cm a 38 cm mantiene il ponte rigido per i pagaiatori di ogni livello.
    - title: Larghezza e Stabilità
      desc: Le tavole più larghe (32") offrono maggiore stabilità per principianti, yoga e pesca. Lo spessore di 6 pollici aggiunge rigidità e capacità di carico per il rider e l'attrezzatura.
    - title: Pacchetti e Accessori
      desc: Ogni tavola viene spedita come pacchetto completo — tavola, zaino da viaggio, pompa a mano, pagaia regolabile, pinna removibile, leash a molla e kit di riparazione. Controlla il carico massimo per il rider più l’attrezzatura.
