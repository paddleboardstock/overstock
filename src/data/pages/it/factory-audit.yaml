hero:
  tagline: Audit di fabbrica e prove
  title: Preparazione all'audit di fabbrica<br />e prove di qualità
  subtitle: "Tutto ciò che gli acquirenti B2B verificano durante una visita in fabbrica: dall'autenticità della produzione e la documentazione di conformità alla tracciabilità della produzione e ai sistemi di controllo della qualità. Pronto per l'audit, ogni giorno."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Preparazione all'audit di fabbrica Aquafarer e prove di qualità
direct_answer: Aquafarer dispone di una struttura di Qingdao di 12.000 m² pronta per l'audit, con processi di controllo qualità documentati, tracciabilità dei materiali, registri di produzione a livello HIN e documentazione di conformità per ogni scafo. Visite in loco e virtuali alla fabbrica disponibili per acquirenti qualificati.
