content_priorities:
  tagline: Cosa verificano i clienti
  title: 8 cose che gli acquirenti verificano<br />ad ogni visita in fabbrica
  subtitle: Sulla base del feedback degli acquirenti di oltre 50 paesi, queste sono le otto priorità che i clienti valutano prima di effettuare un ordine B2B.
  items:
    - title: Vero produttore
      description: "Sei la fabbrica vera e propria, non una società commerciale? Gli acquirenti controllano: l'entità aziendale, le reali attrezzature di produzione, i dipendenti che utilizzano le macchine, gli attuali ordini di produzione sul posto e la coerenza del sito web con l'officina."
      icon: tabler:building-factory
    - title: Prodotto adatto all'applicazione
      description: Il RIB corrisponde al loro caso d'uso specifico? Gli operatori di resort, salvataggio, immersioni, pesca e pattugliamento hanno requisiti fondamentalmente diversi. Gli acquirenti valutano la disposizione del ponte, il materiale dei tubi e le opzioni di equipaggiamento sulla barca esposta.
      icon: tabler:target
    - title: Stabilità e riproducibilità della qualità
      description: La cinquantesima unità è buona quanto la prima? Gli acquirenti esaminano i sistemi di controllo qualità, i punti di controllo in corso, la gestione delle non conformità e chiedono di vedere i record di più cicli di produzione per verificarne la coerenza.
      icon: tabler:repeat
    - title: Autenticità del documento di conformità
      description: I certificati CE sono specifici del modello? La dichiarazione di conformità è firmata da una persona reale? È possibile verificare la conformità per numero di scafo? Gli acquirenti verificano la presenza di reclami generali rispetto alla documentazione specifica del modello.
      icon: tabler:file-certificate
    - title: Esecuzione della personalizzazione
      description: La fabbrica può effettivamente fornire configurazioni personalizzate? Gli acquirenti cercano prove di progetti personalizzati passati, campioni di prototipi in mostra, disegni tecnici e la possibilità di discutere modifiche tecniche sul posto.
      icon: tabler:adjustments
    - title: Tempi di consegna e capacità
      description: 'Le tempistiche indicate sono realistiche? Gli acquirenti valutano: volume di produzione attuale, capacità disponibile, dimensioni della forza lavoro, livelli di scorte di materiali e se la fabbrica dispone di un sistema di pianificazione della produzione.'
      icon: tabler:clock
    - title: Prezzi e termini commerciali
      description: "I prezzi sono trasparenti? Il prezzo FOB è chiaro? Gli acquirenti verificano: la ripartizione del prezzo unitario, i costi delle attrezzature, i costi di imballaggio e se la fabbrica è in grado di gestire i termini DDP o CIF con un'adeguata documentazione di esportazione."
      icon: tabler:currency-dollar
    - title: Post-vendita e pezzi di ricambio
      description: 'Cosa succede dopo la consegna? Gli acquirenti valutano: disponibilità dei pezzi di ricambio, procedura di garanzia, sostituzione delle sezioni dei tubi, sostituzione delle valvole e se la fabbrica dispone di un protocollo post-vendita documentato.'
      icon: tabler:headset
content_tour:
  tagline: Itinerario della visita alla fabbrica
  title: Tour di controllo:<br />Cosa vedrai
  subtitle: Il nostro tour standard della fabbrica segue un percorso definito progettato per rispondere alle domande degli acquirenti in ogni stazione.
  items:
    - title: "1. Sala riunioni: presentazione dell'azienda"
      description: Licenza commerciale, certificati ISO 9001 e BSCI, licenze di esportazione e storia aziendale. Panoramica rapida delle capacità di produzione e dell'ambito di conformità.
      icon: tabler:users
    - title: 2. Magazzino materie prime - Stazione IQC
      description: Registri di ispezione dei materiali in entrata, certificati di lotto di tessuti, adesivi e campioni di hardware. Guarda come vengono testati i materiali prima di entrare in produzione.
      icon: tabler:building-warehouse
    - title: '3. Fabbricazione di tubi: saldatura RF e incollaggio manuale'
      description: Processo di saldatura o incollaggio di tubi sotto tensione, dimostrazioni di test di resistenza delle giunture e installazione di valvole. Osservare la costruzione camera per camera e i controlli di qualità.
      icon: tabler:flame
    - title: 4. Laminazione dello scafo - Workshop GRP
      description: Processo di stratificazione della vetroresina, applicazione del gelcoat e polimerizzazione dello scafo. Vedi il programma di laminazione e il rinforzo strutturale per i diversi modelli RIB.
      icon: tabler:layers-subtract
    - title: 5. Assemblaggio e integrazione
      description: Giunzione dei tubi dello scafo, installazione della console e del sedile, integrazione del sistema elettrico e di carburante e montaggio dell'attrezzatura. Osservare la linea di produzione in funzione.
      icon: tabler:tool
    - title: 6. Stazione di prova della pressione
      description: Test di mantenimento della pressione di 24-48 ore a 1,25 volte la pressione nominale. Visualizza i record dei test, i manometri e i criteri di superamento/fallimento. Scopri come i risultati dei test sono collegati ai numeri di serie dello scafo.
      icon: tabler:gauge
    - title: 7. Ispezione finale e controllo di qualità
      description: Lista di controllo qualità a 100 punti per unità, verifica dimensionale, ispezione estetica e controllo dell'integrità dell'imballaggio. Esaminare i registri di non conformità e i registri delle azioni correttive.
      icon: tabler:clipboard-check
    - title: 8. Sala revisione documenti
      description: Documentazione di conformità per modello (DoC, targa del costruttore, manuale del proprietario), record di tracciabilità della produzione, registro HIN e dimostrazione del database di tracciabilità dei lotti di materiale.
      icon: tabler:folder
content_qc_chain:
  tagline: Prova di qualità
  title: Catena di controllo qualità a 8 fasi<br />— Verificabile in ogni fase
  subtitle: La nostra catena di controllo qualità va dall'ingresso dei materiali alla spedizione finale, con prove documentate in ogni fase.
  items:
    - title: 'Fase 1: ispezione del materiale in entrata'
      description: Ogni lotto di PVC, Hypalon, fibra di vetro, alluminio, adesivi e hardware viene testato rispetto alle specifiche prima di entrare in produzione. Resistenza alla trazione, adesione del rivestimento e controlli dimensionali secondo AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Fase 2: QC di saldatura/incollaggio dei tubi'
      description: Test di resistenza alla pelatura delle cuciture per lotto di produzione. Parametri di saldatura RF monitorati e registrati. Cuciture incollate a mano controllate per una copertura adesiva costante e tempi di polimerizzazione.
      icon: tabler:flame
    - title: 'Fase 3: Controllo qualità della laminazione dello scafo'
      description: Misurazione dello spessore del gelcoat, verifica della stratificazione della fibra di vetro in base al programma del laminato e monitoraggio del tempo di polimerizzazione. Posizioni dei rinforzi strutturali verificate rispetto ai disegni tecnici.
      icon: tabler:layers-subtract
    - title: 'Fase 4: QC di assemblaggio e integrazione'
      description: Integrità dei giunti scafo-tubi, coppia di montaggio della console e del sedile, continuità elettrica e test di tenuta del sistema di alimentazione. Ogni punto di installazione è stato verificato rispetto alla checklist di assemblaggio specifica del modello.
      icon: tabler:tool
    - title: 'Fase 5: test di mantenimento della pressione'
      description: Ogni camera gonfiabile è pressurizzata a 1,25x PSI nominale e mantenuta per 24-48 ore. Caduta di pressione registrata per camera. Soglia superata/fallita documentata. Collegato al numero di serie dello scafo.
      icon: tabler:gauge
    - title: 'Fase 6: ispezione finale'
      description: Elenco di controllo della qualità in 100 punti che copre l'accuratezza dimensionale, la finitura estetica, la completezza degli accessori, il pacchetto di documentazione e l'integrità dell'imballaggio. Indipendente dal team di produzione.
      icon: tabler:clipboard-check
    - title: 'Fase 7: documentazione di conformità'
      description: Documentazione di conformità specifica per il modello, verifica della targa del costruttore, completezza del manuale del proprietario e voce di registro HIN. Tutti i documenti di conformità preparati e verificati prima del rilascio della spedizione.
      icon: tabler:file-certificate
    - title: 'Fase 8: Rilascio e tracciabilità della spedizione'
      description: Il rilascio finale richiede il superamento di tutte le fasi del controllo qualità, il completamento della documentazione di conformità e la verifica della documentazione di spedizione. Il registro dello scafo è stato chiuso e archiviato per oltre 10 anni.
      icon: tabler:truck
content_traceability:
  tagline: Tracciabilità della produzione
  title: HIN → Master File →<br />Registrazione scafo → Consegna
  subtitle: Ogni imbarcazione RIB è dotata di un numero identificativo dello scafo univoco collegato a una catena completa di record di produzione e conformità.
  items:
    - title: Numero di identificazione dello scafo (HIN)
      description: Identificativo univoco di 14 caratteri impresso in modo permanente su ogni imbarcazione. Codifica il codice del produttore (MIC), la designazione del modello, l'anno di produzione e il numero di serie. La chiave che sblocca l’intera catena della tracciabilità.
      icon: tabler:hash
    - title: Fascicolo tecnico principale
      description: La documentazione di conformità e di progettazione per la famiglia di modelli. Contiene disegni GA, valutazione del rischio, calcoli di stabilità, specifiche dei materiali e standard applicabili. Collegato a tutti gli scafi di quel modello.
      icon: tabler:folder
    - title: Record individuale dello scafo
      description: 'Registro di produzione per scafo: HIN, data di produzione, lotto di tubi, certificati dei materiali, risultato del test di pressione, configurazione finale, specifiche del motore, risultati della lista di controllo della qualità e destinazione di consegna. Oltre 21 campi dati per scafo.'
      icon: tabler:file-description
    - title: Pacchetto conformità cliente
      description: Pacchetto di consegna per scafo che include dichiarazione di conformità, foto della targa del costruttore, manuale del proprietario, lista di controllo di conformità e foglio di configurazione finale. Spedito con la barca e archiviato in fabbrica per oltre 10 anni.
      icon: tabler:package
content_red_flags:
  tagline: Insidie dell’audit
  title: Acquirenti con bandiere rosse<br />Individuabili facilmente
  subtitle: Problemi comuni che minano la fiducia degli acquirenti durante gli audit di fabbrica. Affrontiamo ciascuno di essi in modo proattivo.
  items:
    - title: Dichiarazioni CE generali senza ambito di applicazione del modello
      description: '“Tutti i prodotti certificati CE” senza specificare quale direttiva, quali modelli e quale modulo di conformità. Bandiera rossa: suggerisce che la conformità è superficiale piuttosto che per modello, per configurazione.'
      icon: tabler:alert-triangle
    - title: Nessuna prova di test fisici
      description: 'Dichiarazioni di test di pressione senza registrazioni di test, manometri o stazione di prova visibili in fabbrica. Bandiera rossa: le dichiarazioni di qualità non possono essere verificate durante la visita.'
      icon: tabler:alert-triangle
    - title: Tracciabilità dei materiali mancanti
      description: "Nessun registro dei lotti, nessuna ispezione in entrata o nessun collegamento tra certificati dei materiali e prodotti finiti. Bandiera rossa: non c'è modo di risalire ai problemi di qualità fino alla fonte."
      icon: tabler:alert-triangle
    - title: Documentazione generica
      description: 'Una dichiarazione di conformità che copre tutti i modelli, nessun record specifico HIN o documenti di conformità "modello". Bandiera rossa: la conformità non è legata alle singole unità produttive.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Spedizione e imballaggio
  title: Caricamento e imballaggio<br />in container di imbarcazioni RIB
  subtitle: Le nostre soluzioni di spedizione proteggono il tuo investimento da Qingdao al porto di destinazione. Piani di caricamento container e specifiche di imballaggio disponibili per ogni modello.
  items:
    - title: Configurazioni container 20 piedi
      description: 'Container standard da 20 piedi: 1-2 imbarcazioni RIB (4,0-5,5 m) incastrate con ponte e tubi separati, oppure 8-12 tavole SUP. Configurazioni miste RIB + SUP disponibili. Piano di caricamento dettagliato fornito per ogni ordine.'
      icon: tabler:box
    - title: Configurazioni container 40 piedi
      description: 'Container standard da 40 piedi: 2-4 imbarcazioni RIB (fino a 7,0 m) con scafi incastrati e tubi impilati, oppure 20-30 tavole SUP. Container 40 piedi HQ disponibile per modelli RIB più alti. Imballaggio ottimizzato per volume che riduce il costo di spedizione per unità.'
      icon: tabler:container
    - title: Casse in legno per scafi RIB
      description: Scafi in alluminio e GRP imballati in casse di legno su misura con imbottitura in schiuma, barriera antiumidità e fasciature in acciaio. Dimensioni e peso delle casse per modello disponibili per la pianificazione logistica. Certificazione ISPM-15 del legno trattato termicamente inclusa.
      icon: tabler:wood
    - title: Imballaggio con separazione tubi e ponte
      description: Tubi sgonfiati e piegati separatamente dagli scafi per ottimizzare lo spazio. Piastre del ponte, consolle e sedili imballati in involucro protettivo con kit di ferramenta di montaggio. Istruzioni di rimontaggio incluse in ogni spedizione.
      icon: tabler:package
    - title: Protezione da umidità e corrosione
      description: Carta anticorrosiva VCI per i componenti in alluminio, sacchetti essiccanti di gel di silice e buste di ferramenta sigillate sottovuoto. Previene danni da condensa durante il transito marittimo di 30-45 giorni.
      icon: tabler:droplet-off
    - title: Documentazione FOB Qingdao
      description: Polizza di carico, fattura commerciale, lista di imballaggio, certificato di origine e documentazione di conformità per ogni spedizione. Consolidamento FCL e LCL disponibile. Supporto per la documentazione doganale per i mercati UE, USA e Medio Oriente.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Evidenze verificabili in fabbrica
  title: Evidenze di audit<br />verificabili in fabbrica
  subtitle: Durante le visite in fabbrica, i clienti possono verificare evidenze specifiche in ogni area di produzione. Ecco cosa controllare — e cosa prepariamo per ogni audit.
  areas:
    - area: Magazzino materie prime
      what_to_verify: I materiali sono conservati correttamente? C'è rischio di mescolanza tra lotti?
      evidence: Registri di collaudo in entrata, etichette di lotto, stoccaggio FIFO, lista di approvazione dei fornitori, certificati dei materiali (PVC, Hypalon, fibra di vetro, alluminio, adesivi, ferramenta)
      icon: tabler:building-warehouse
    - area: Produzione dei tubolari
      what_to_verify: Come vengono garantiti la resistenza delle cuciture e la tenuta stagna?
      evidence: Schede di processo, approvazione del primo articolo, registrazioni delle prove di pressione per ogni camera, registri di riparazione e ricollaudo, registrazioni di installazione delle valvole
      icon: tabler:flame
    - area: Produzione dello scafo
      what_to_verify: Come viene controllata la coerenza strutturale?
      evidence: Documenti di processo controllati, punti di controllo qualità, numerazione dei semilavorati, misurazioni dello spessore del gelcoat, verifica del piano di laminazione
      icon: tabler:layers-subtract
    - area: Area di montaggio
      what_to_verify: Come si prevengono gli errori di montaggio degli optional?
      evidence: Distinte base (BOM), ordini di lavoro, checklist di configurazione, schede di ispezione per postazione, verifiche di coppia e funzionali per modello
      icon: tabler:tool
    - area: Stazione di collaudo
      what_to_verify: Come si conferma che l'imbarcazione è a norma prima della consegna?
      evidence: Procedure di prova, lista degli strumenti, registri di taratura, registrazioni delle prove di pressione (1,25x / 24-48h), checklist delle prove funzionali, criteri di esito positivo/negativo documentati
      icon: tabler:gauge
    - area: Area delle non conformità
      what_to_verify: Come vengono gestiti i difetti?
      evidence: Etichette di segregazione, registri NCR, analisi delle cause radice, registrazioni di approvazione della rilavorazione, tracciamento CAPA (azioni correttive e preventive)
      icon: tabler:alert-triangle
    - area: Magazzino prodotti finiti
      what_to_verify: Come si prevengono spedizioni errate e danneggiamenti?
      evidence: Etichette dei prodotti finiti, registrazioni di abbinamento degli ordini, standard di imballaggio, registrazioni di ispezione pre-spedizione
      icon: tabler:box
    - area: Ricambi e assistenza post-vendita
      what_to_verify: Potete garantire un'assistenza post-vendita a lungo termine?
      evidence: Lista dei ricambi più richiesti, strategia di magazzino, sistema di numerazione dei pezzi, documentazione del processo di garanzia, tutorial di manutenzione
      icon: tabler:headset

content_closing_script:
  tagline: Dall'audit all'ordine
  title: Dalla visita in fabbrica<br />al progetto confermato
  subtitle: Un audit di successo non dovrebbe concludersi con qualche foto e una stretta di mano. Prima della partenza, ci assicuriamo che tre risultati commerciali siano documentati.
  items:
    - title: Confermare la configurazione tecnica
      description: Accordo su modello, applicazione, opzioni chiave, mercato di riferimento, quantità stimata e calendario di consegna — tutto documentato prima della partenza.
      icon: tabler:checklist
    - title: Confermare i documenti dei passi successivi
      description: 'Definizione di ciò che Aquafarer fornirà a seguire: GA revisionato, lista di configurazione, preventivo, checklist documentale, piano campioni o NDA — con tempistiche precise.'
      icon: tabler:file-plus
    - title: Confermare la timeline condivisa
      description: Configurazione revisionata e preventivo preliminare entro 3 giorni lavorativi. Conferma del campione o dell'estetica entro 7 giorni. Revisione tecnica o ispezione di terze parti entro 14 giorni. Data del prossimo incontro e responsabili definiti.
      icon: tabler:calendar

faq:
  title: 'Audit di fabbrica: domande frequenti'
  questions:
    - q: Posso visitare la fabbrica di persona?
      a: SÌ. Diamo il benvenuto agli audit di fabbrica in loco presso il nostro stabilimento di Qingdao di 12.000 m². Il nostro tour standard copre 8 stazioni, dal magazzino delle materie prime alla sala di revisione dei documenti. Per la qualificazione iniziale sono disponibili anche visite guidate virtuali della fabbrica tramite videochiamata.
    - q: Accettate audit di terze parti (BSCI, SMETA, SGS)?
      a: SÌ. Manteniamo la certificazione BSCI (Intertek) e accogliamo con favore i protocolli di audit specifici del cliente. Su richiesta possiamo anche organizzare ispezioni SGS o TÜV. I rapporti di audit sono disponibili ai sensi della NDA.
    - q: Posso vedere la prova di pressione durante la visita?
      a: La nostra stazione di prova della pressione fa parte del percorso di visita standard. A seconda del programma di produzione, è possibile osservare test di pressione attivi con letture del manometro e registrazioni dei test. I registri dei test di pressione per scafo sono sempre disponibili per la revisione.
    - q: Come gestite i prodotti non conformi?
      a: Le unità non conformi vengono separate, documentate e riviste secondo il nostro processo di azione correttiva ISO 9001. Viene eseguita l'analisi della causa principale, vengono implementate le azioni correttive e vengono conservati i record. Gli acquirenti possono rivedere il nostro registro NCR durante gli audit.
    - q: Quale documentazione di conformità è disponibile per la revisione?
      a: "Durante l'audit, è possibile esaminare: campioni di DoC specifici del modello, specifiche delle targhe del costruttore, registro HIN, bozze del manuale del proprietario, elenchi di standard applicabili e record di valutazione della conformità per famiglia di modelli."
    - q: Come posso prenotare un tour virtuale della fabbrica?
      a: Contatta il nostro team di vendita per programmare un video tour dal vivo tramite WhatsApp, Zoom o Teams. Seguiamo lo stesso percorso di 8 stazioni e possiamo concentrarci su aree specifiche in base ai tuoi interessi. Il tour virtuale tipico dura 45-60 minuti.
    - q: La fabbrica è il vero produttore o una società commerciale?
      a: Aquafarer è l'attuale produttore. Gestiamo la fabbrica a Laixi, Qingdao. La licenza commerciale, l'ambito di produzione e la produzione fisica sono tutti verificabili durante l'audit.
    - q: Quali record di qualità posso esaminare?
      a: Registri di ispezione dei materiali in entrata, punti di controllo QC in corso, registri di test di pressione, liste di controllo di ispezione finale di 100 punti, rapporti di non conformità, registri di azioni correttive e registri di tracciabilità per scafo. Tutto mantenuto secondo i requisiti ISO 9001.
