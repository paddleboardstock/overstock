breadcrumb: Produttore OEM/ODM
tldr:
  summary: Paddle Board Overstock è un produttore OEM/ODM diretto dalla fabbrica. Stabilimento di 12.000 m² certificato ISO 9001:2015, produzione annua di 15.000 unità, conformità CE/BSCI/REACH/UKCA, MOQ ridotti a partire da 2-10 unità.
  points:
    - Stabilimento di Qingdao di 12.000 m² certificato ISO 9001:2015
    - Capacità annua di 15.000 unità con 200-300 operai qualificati
    - Conformità CE 2013/53/EU, UKCA, BSCI, REACH
    - 'MOQ ridotti: 2-5 unità (RIB), 5-10 unità (SUP) per i modelli standard'
    - Esportazione in oltre 50 paesi con spedizione FOB Qingdao
trust_badges:
  badges:
    - icon: ⭐
