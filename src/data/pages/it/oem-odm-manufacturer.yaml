      desc: 'Modelli RIB standard da 2-5 unità, SUP da 5-10 unità. Stampi su misura: 200+.'
      variant: standard
process_section:
  eyebrow: Il nostro processo
  title: Flusso di lavoro OEM/ODM completo
  subtitle: Dal brief di progettazione al caricamento del container — sei passaggi verso il vostro natante gonfiabile a marchio proprio.
  steps:
    - step: '01'
      title: Specifiche e brief di progettazione
      desc: Condividete le specifiche target, i disegni CAD o un prodotto di riferimento. Il nostro team di ingegneria esamina materiali, dimensioni e requisiti di conformità (CE, BSCI) prima di emettere il preventivo.
    - step: '02'
      title: Prototipazione di stampi 3D
      desc: Progettiamo e lavoriamo con CNC stampi su misura per tavole SUP, scafi di kayak e componenti RIB. I campioni prototipo vengono prodotti entro 15-20 giorni lavorativi per la vostra approvazione.
    - step: '03'
      title: Selezione dei materiali e produzione di campioni
      desc: Scegliete tra PVC di grado militare (0,9 mm-1,2 mm), Hypalon CSM o tessuti a nucleo drop-stitch. Produciamo campioni di pre-produzione con i colori del vostro marchio, logo e packaging per l’approvazione finale.
    - step: '04'
      title: Audit di fabbrica CE e conformità
      desc: Ogni ordine OEM include la documentazione di conformità — dichiarazione CE di conformità, registri di tracciabilità ISO 9001, report di conformità sociale BSCI e dichiarazioni dei materiali REACH.
    - step: '05'
      title: Produzione in serie e controllo in linea
      desc: Le produzioni seguono la nostra checklist di qualità a 100 punti. Ogni unità è sottoposta a test di ritenzione della pressione per 24 ore, test di pelatura delle cuciture e ispezione visiva prima dell’imballaggio.
    - step: '06'
      title: Logistica FOB Qingdao e spedizione
      desc: I prodotti finiti vengono pallettizzati, imballati in film termoretraibile e caricati nei container al porto di Qingdao. Gestiamo tutta la documentazione di esportazione, lo sdoganamento e offriamo tracciamento delle spedizioni in tempo reale.
capabilities_section:
  eyebrow: Capacità produttive
  title: Cosa produciamo
  subtitle: Sei capacità di produzione fondamentali per i partner B2B globali.
  items:
    - title: Produzione di tavole SUP drop-stitch
      desc: Laminazione del nucleo drop-stitch su tutta la lunghezza per tavole da stand-up paddle rigide ad alta pressione (15-20 PSI). Lunghezza, larghezza, spessore, profilo rocker e grafica personalizzati.
    - title: Produzione di gommoni PVC
      desc: Gommoni, tender e barche sportive in PVC saldati ad alta frequenza. Configurazioni multi-camera, opzioni di pavimento (doghe, ponte gonfiabile, arrotolabile) e integrazione di accessori.
    - title: Fabbricazione di RIB in Hypalon
      desc: Tubi CSM Hypalon di grado commerciale incollati a scafi in vetroresina o alluminio con V profondo. Lunghezze da 3,3 m a 6,0 m per operazioni di pattugliamento, soccorso, turismo e immersioni.
    - title: Private label e branding personalizzato
      desc: 'Servizio private label completo: logo personalizzato a trasferimento termico o serigrafia, packaging a marchio (scatole retail, borse da trasporto), manuali utente nella vostra lingua e registrazione di codici a barre/UPC.'
    - title: Progettazione di stampi e attrezzature su misura
      desc: Team interno di ingegneria 3D CAD/CAM. Progettiamo e fabbrichiamo stampi in alluminio e materiali compositi su misura per forme di scafo uniche, configurazioni del ponte e punti di fissaggio degli accessori.
    - title: Accessori OEM e kitting
      desc: Giubbotti di salvataggio (CE 12402), pompe a doppia azione, pagaie in carbonio/nylon, kit di riparazione, borse da trasporto e leash. Kitting completo e packaging in bundle per una presentazione pronta per la vendita.
experience_section:
  eyebrow: Esperienza sul campo
  title: Partnership che hanno costruito marchi
  subtitle: Storie reali di marchi e organizzazioni che hanno scelto Paddle Board Overstock per la produzione OEM/ODM.
  stories:
    - quote: Ci siamo rivolti ad Paddle Board Overstock con uno schizzo su un tovagliolo e una lista di requisiti. Otto mesi dopo, avevamo un prodotto pronto per la produzione che ha superato la certificazione CE al primo tentativo.
      narrative: Una startup europea con un design SUP innovativo si è affidata ad Paddle Board Overstock per la produzione ODM. Il team R&D di Paddle Board Overstock ha seguito il concept attraverso progettazione CAD, analisi strutturale FEA, simulazione idrodinamica, creazione dello stampo, fabbricazione del prototipo e attrezzature di produzione. Il fondatore della startup si è recato tre volte a Qingdao durante il processo. Il prodotto finale ha ottenuto la certificazione CE senza alcuna modifica — un risultato che il fondatore attribuisce alla comprensione da parte del team di ingegneria di Paddle Board Overstock dei requisiti normativi europei fin dall’inizio.
      context: Lancio di un marchio europeo di SUP, 2023-2024
      source: Fondatore del marchio
    - quote: Il livello di protezione NDA e sicurezza della PI offerto da Paddle Board Overstock ci dà la fiducia necessaria per condividere i nostri progetti proprietari. Trattano la nostra PI come se fosse loro.
      narrative: Un’azienda statunitense di attrezzature marine con una tecnologia di valvole proprietaria cercava un partner di produzione in grado di proteggere la propria PI producendo su larga scala. Dopo aver auditato cinque produttori cinesi, ha scelto Paddle Board Overstock per i protocolli di protezione della PI dello stabilimento, la gestione sicura dei file di progettazione e la disponibilità a firmare NDA rigorosi. La partnership ha dato vita a tre linee di prodotti in quattro anni senza alcun incidente relativo alla PI.
      context: Azienda statunitense di attrezzature marine, partnership OEM dal 2021
      source: Vicepresidente delle operazioni
