hero:
  tagline: Partner e Distribuzione
  title: 'Diventa Partner di Paddle Board Overstock<br />— Rete di Distribuzione Globale'
  subtitle: "Entra a far parte della rete globale di partner di Paddle Board Overstock. Lavoriamo con distributori marini, concessionari di imbarcazioni, rivenditori di attrezzature e partner di marca in oltre 50 paesi."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Rete globale di partner e distributori Paddle Board Overstock
content_programs:
  tagline: Programmi per Partner
  title: 'Programmi per Partner<br />Progettati per Crescere'
  subtitle: 'Che tu sia un distributore, un concessionario o un partner di marca, Paddle Board Overstock offre programmi progettati per supportare la tua attività.'
  columns: 3
  items:
    - title: 'Programma Distributore'
      description: "Distribuzione esclusiva per territorio con prezzi di volume, supporto marketing e accesso diretto alla fabbrica. Impegno minimo richiesto in base alla dimensione del territorio."
      icon: tabler:world
    - title: 'Programma Concessionario'
      description: "Prezzi diretti da concessionario, formazione sul prodotto, materiale di marketing e supporto in garanzia per negozi fisici e negozi online."
      icon: tabler:building-store
    - title: 'Collaborazione OEM/ODM'
      description: "Produzione OEM e ODM a servizio completo con branding, imballaggio e specifiche di prodotto personalizzati. Dal concept al container."
      icon: tabler:certificate
    - title: 'Collaborazione di Marca'
      description: "Co-branding, private label e programmi di modelli esclusivi per marchi affermati nel settore marino e delle attività ricreative all'aperto."
      icon: tabler:stars
    - title: 'Governo e Istituzioni'
      description: "Programmi di fornitura preferenziali per agenzie governative, guardie costiere, forze armate e organizzazioni umanitarie. Documentazione pronta per le gare."
      icon: tabler:building-community
    - title: 'Partner Resort e Noleggio'
      description: "Prezzi flotta, qualità costante e branding personalizzato per resort, centri subacquei e attività di noleggio in tutto il mondo."
      icon: tabler:sun
content_benefits:
  tagline: Perché Collaborare con Noi
  title: 'Perché i Partner Scelgono Paddle Board Overstock'
  subtitle: 'I nostri partner beneficiano di una reale capacità produttiva, di una qualità costante e di un supporto reattivo.'
  list:
    - 'Accesso Diretto alla Fabbrica: Lavora direttamente con il nostro team di produzione — senza intermediari. Risposte più rapide, prezzi migliori e piena visibilità sulla produzione.'
    - 'Personalizzazione Pronta: Personalizza i tuoi prodotti con colori, loghi, imballaggi e specifiche su misura. Quantità minime di ordine adattate al tuo mercato.'
    - 'Qualità Garantita: Produzione certificata ISO 9001 con conformità CE, UKCA e BSCI. Ogni prodotto viene testato prima della spedizione.'
    - 'Logistica Globale: Spedizione da Qingdao, Cina, con opzioni FOB, CIF e DDP. Magazzino USA a Montclair, CA per la distribuzione in Nord America.'
    - 'Supporto Marketing: Cataloghi prodotto, fotografia, documentazione tecnica e risorse digitali per supportare i tuoi sforzi di vendita.'
    - "Formazione e Supporto: Formazione sul prodotto per il tuo team di vendita, supporto tecnico per i tuoi clienti e coordinamento del servizio di garanzia."
content_process:
  tagline: Come Diventare Partner
  title: 'Processo di Collaborazione Semplice'
  subtitle: "Il nostro processo di collaborazione è semplice — progettato per farti iniziare a vendere i prodotti Paddle Board Overstock rapidamente."
  items:
    - title: 'Passo 1: Inviare la Domanda'
      description: "Compila il nostro modulo di domanda di collaborazione con il profilo della tua azienda, il mercato di riferimento e i tuoi interessi di prodotto."
    - title: 'Passo 2: Revisione di Qualifica'
      description: "Il nostro team partnership esamina la tua domanda e ti contatta entro 3 giorni lavorativi per discutere le opportunità."
    - title: 'Passo 3: Accordo e Configurazione'
      description: "Firma un accordo di collaborazione, configura il tuo account e ricevi prezzi partner, materiale di marketing e campioni di prodotto."
    - title: 'Passo 4: Formazione e Lancio'
      description: 'Vengono forniti formazione sul prodotto, supporto alle vendite e materiale di marketing. Sei pronto a iniziare a vendere.'
cta:
  title: 'Pronto a diventare un partner Paddle Board Overstock?'
  subtitle: 'Invia la tua domanda di collaborazione e il nostro team risponderà entro 3 giorni lavorativi.'
  actions:
    - variant: primary
      text: Richiedi la collaborazione
      href: /contact
    - text: Vedi i nostri prodotti
      href: /products
