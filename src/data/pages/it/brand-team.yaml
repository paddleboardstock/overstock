hero:
  tagline: La nostra squadra
  title: Le Persone Dietro Paddle Board Overstock<br />— Ingegnerizzare la Libertà sull'Acqua
  subtitle: Fondata nel 2012 a Weihai, Cina, Paddle Board Overstock è stata costruita da ingegneri marini, scienziati dei materiali e appassionati di sport acquatici che credevano nel rendere accessibili a livello mondiale i paddle board gonfiabili di qualità professionale.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock foto completa del team — ingegneria, produzione e leadership
founding:
  tagline: La Nostra Fondazione
  title: Da un Laboratorio Costiero<br />a una Struttura di 12.000 m²
  subtitle: Paddle Board Overstock è stata fondata da un team di ingegneri marini con decenni di esperienza combinata nella progettazione di SUP gonfiabili, nella costruzione di drop-stitch e nella produzione globale di sport acquatici.
  items:
    - title: 'Fondata: 2012'
      description: Stabilita a Weihai, Cina — un importante centro marittimo con una profonda tradizione cantieristica.
      icon: tabler:calendar
    - title: 200-300 Dipendenti
      description: Inclusi 14+ ingegneri R&D, specialisti del controllo qualità e tecnici di produzione.
      icon: tabler:users
    - title: Struttura di 12.000 m²
      description: Stabilimento produttivo dedicato con 6 linee di produzione per tavole e accessori SUP.
      icon: tabler:building-factory
    - title: 50+ Paesi Serviti
      description: Esportazione verso Europa, Americhe, Medio Oriente, Asia-Pacifico e Africa.
      icon: tabler:globe
leadership:
