hero:
  tagline: Il nostro team
  title: 'Le persone dietro Paddle Board Overstock<br />— L''ingegneria della libertà sull''acqua'
  subtitle: 'Fondata nel 2012 a Qingdao, in Cina, Paddle Board Overstock è stata creata da ingegneri navali, scienziati dei materiali e appassionati di sport acquatici che credevano nel rendere accessibili in tutto il mondo le imbarcazioni gonfiabili di livello professionale.'
  image:
    src: /images/team-all.webp
    alt: Foto dell'intero team Paddle Board Overstock — ingegneria, produzione e leadership
founding:
  tagline: La nostra fondazione
  title: 'Da un''officina costiera<br />a una struttura di 12.000 m²'
  subtitle: 'Paddle Board Overstock è stata fondata da un team di ingegneri navali con decenni di esperienza combinata nella progettazione di imbarcazioni gonfiabili, nella produzione di PVC/Hypalon e nella produzione globale di attrezzature marine.'
  items:
    - title: 'Fondata: 2012'
      description: 'Fondata a Qingdao, in Cina — un importante polo marittimo con una profonda tradizione cantieristica.'
      icon: tabler:calendar
    - title: '200-300 dipendenti'
      description: 'Inclusi oltre 50 ingegneri R&S, specialisti del controllo qualità e tecnici di produzione.'
      icon: tabler:users
    - title: 'Struttura di 12.000 m²'
      description: 'Stabilimento di produzione dedicato con 6 linee di produzione per RIB, imbarcazioni gonfiabili e tavole SUP.'
      icon: tabler:building-factory
    - title: '50+ paesi serviti'
      description: 'Esportazioni in Europa, Americhe, Medio Oriente, Asia-Pacifico e Africa.'
      icon: tabler:globe
leadership:
  tagline: Leadership
  title: 'Leadership gestionale e ingegneristica'
  subtitle: 'Il nostro team dirigenziale riunisce una profonda competenza in ingegneria navale, commercio internazionale e gestione della qualità.'
  columns: 3
  items:
    - title: 'Fondatore e CEO'
      name: 'Toby Liu'
      description: 'Oltre 15 anni nella produzione nautica. In precedenza responsabile R&S presso un importante produttore cinese di imbarcazioni. Detiene diversi brevetti nella progettazione di gommoni gonfiabili.'
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: 'Capo ingegnere'
      name: 'Zhang Wei'
      description: 'Oltre 20 anni nella lavorazione di PVC/Hypalon e nella progettazione di scafi a V profondo. Ex direttore tecnico di uno studio di ingegneria nautica europeo.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Responsabile R&S'
      name: 'Chen Ming'
      description: 'Dottorato in scienza dei materiali. Specialista della tecnologia drop-stitch e della saldatura ad alta frequenza. Oltre 10 anni nei compositi tessili.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Direttore produzione'
      name: 'Liu Qiang'
      description: 'Oltre 18 anni nel lean manufacturing e nell''ottimizzazione delle linee di produzione. Six Sigma Black Belt. Ha implementato sistemi di qualità ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Responsabile qualità'
      name: 'Wang Fang'
      description: 'Oltre 12 anni nel controllo qualità nautico. Auditor certificata CE e ISO. Supervisiona i test di ogni lotto di produzione.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Direttore vendite e operazioni'
      name: 'Helen Lee'
      description: 'Oltre 15 anni nel commercio internazionale B2B. Ha gestito partnership OEM/ODM in oltre 30 paesi. Parla 4 lingue.'
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filosofia di progettazione
  title: 'Progettazione guidata dall''ingegneria<br />— Ogni dettaglio conta'
  subtitle: 'La nostra filosofia ingegneristica si basa su tre principi che guidano ogni prodotto che realizziamo.'
  list:
    - 'Affidabilità prima di tutto: ogni prodotto Paddle Board Overstock è testato per resistere alle condizioni reali — dalle operazioni di soccorso in acque fredde ai noleggi nei resort tropicali. Over-engineering dove conta di più.'
    - 'Precisione produttiva: i nostri impianti utilizzano taglio CNC, saldatura ad alta frequenza e test di pressione automatizzati. Ogni cucitura, ogni valvola, ogni raccordo rispetta specifiche documentate.'
    - 'Innovazione continua: il nostro team R&S valuta costantemente nuovi materiali, nuovi metodi di produzione e miglioramenti progettuali. Non aspettiamo i problemi — li anticipiamo.'
cta:
  title: 'Vuoi discutere un progetto con il nostro team?'
  subtitle: 'I nostri ingegneri sono pronti a consigliarti su selezione dei prodotti, personalizzazione e partnership OEM/ODM.'
  actions:
    - variant: primary
      text: Contatta il nostro team
      href: /contact
    - text: Vedi i nostri prodotti
      href: /products
