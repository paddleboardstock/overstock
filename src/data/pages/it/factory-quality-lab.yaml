  - value: AQL 2.5
    label: Soglia difetti maggiori
    detail: Secondo il campionamento ISO 2859

test_procedures:
  - title: Ispezione Materie Prime
    description: Ogni lotto in ingresso di PVC, Hypalon, tessuto drop-stitch e componentistica viene testato prima dell'accettazione. Vengono verificate la resistenza alla trazione (ASTM D751), la resistenza allo strappo (ISO 4674) e la resistenza ai raggi UV. I materiali non conformi vengono messi in quarantena e restituiti.
    standards:
      - ASTM D751 (trazione)
      - ISO 4674 (strappo)
      - ISO 4892 (UV)
  - title: Punti di Controllo Qualità Durante la Produzione
    description: Gli operatori di produzione eseguono l'autoispezione in ogni fase. Gli auditor di controllo qualità effettuano campionamenti casuali durante tutto il turno. I test di pelatura delle saldature vengono eseguiti ogni 50 unità. I controlli dimensionali avvengono su ogni 20° pannello.
    standards:
      - ASTM D751 (pelatura)
      - Checklist interna a 100 punti
      - Campionamento ISO 2859
  - title: Test di Ritenzione Aria di 48 Ore
    description: Ogni camera del tubolare viene gonfiata al 125% della pressione nominale e mantenuta per 48 ore. I sensori di pressione registrano in continuo con compensazione della temperatura. Qualsiasi camera che superi un calo di pressione del 5% attiva una reispezione automatica del lotto.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Test di Carico & Bilanciamento
    description: Le imbarcazioni finite vengono testate alla massima capacità nominale per stabilità, bordo libero e manovrabilità. Ogni natante viene sottoposto a test in acqua prima dell'approvazione dell'ispezione finale.
    standards:
      - ISO 12217
      - CE 2013/53/EU

