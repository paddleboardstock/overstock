hero:
  tagline: Laboratorio di Controllo Qualità
  title: Laboratorio di Test & Garanzia Qualità
  subtitle: Laboratorio qualità indipendente con processi ISO 9001 — ogni unità testata prima della spedizione

intro: Aquafarer gestisce un laboratorio di controllo qualità dedicato che opera indipendentemente dalla produzione. Ogni lotto di materia prima e ogni imbarcazione finita passa attraverso protocolli di ispezione documentati prima del rilascio. Il nostro team di controllo qualità riporta direttamente alla direzione, garantendo decisioni di qualità imparziali.

highlights:
  - value: 100%
    label: Unità testate in pressione
    detail: Ogni camera, ogni imbarcazione
  - value: 48 h
    label: Durata del test di ritenzione aria
    detail: A 1.25× della pressione nominale
  - value: '&lt;5%'
    label: Calo di pressione massimo consentito
