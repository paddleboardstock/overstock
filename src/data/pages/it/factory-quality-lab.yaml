hero:
  tagline: Laboratorio di Controllo della Qualità
  title: Laboratorio di Prova e Assicurazione della Qualità
  subtitle: Laboratorio di qualità indipendente — ogni unità testata prima della spedizione
  back_label: Torna alla Fabbrica
intro: Paddle Board Overstock gestisce un laboratorio dedicato al controllo qualità che opera indipendentemente dalla produzione. Ogni lotto di materia prima e ogni tavola finita passa attraverso protocolli di ispezione documentati prima del rilascio. Il nostro team QC riferisce direttamente alla direzione, garantendo decisioni imparziali sulla qualità.
highlights:
  - value: 100%
    label: Unità sottoposte a test di pressione
    detail: Ogni camera, ogni tavola
  - value: 48 h
    label: Durata del test di ritenzione dell'aria
    detail: A 1,25× pressione nominale
  - value: <5%
    label: Max ha permesso una caduta di pressione
    detail: Periodo di sospensione di oltre 24 ore
  - value: 99.3%
    label: Tasso senza difetti
    detail: Spedizioni a 12 mesi
test_procedures:
  - title: Ispezione delle materie prime
    description: Ogni lotto in arrivo di PVC drop-stitch tessuto, EVA schiuma e ferramenta viene testato prima dell'accettazione. Vengono verificate la resistenza alla trazione, la resistenza allo strappo e UV la resistenza. I materiali non conformi vengono messi in quarantena e restituiti.
    standards:
      - Resistenza alla trazione (350 N/cm min)
      - Resistenza alle lacrime
      - UV Resistenza (1.000 h)
  - title: Checkpoint QC in corso
    description: Gli operatori di produzione effettuano autoispezione in ogni fase. I revisori QC effettuano campionamenti casuali durante tutto il turno. I test di decollo della saldatura vengono eseguiti ogni 50 unità. I controlli dimensionali avvengono ogni 20° pannello.
    standards:
      - Test di peeling ogni 50 unità
      - Checklist interna da 100 punti
      - Audit a campionamento casuale
  - title: Test di Ritenzione dell'Aria di 48 Ore
    description: Ogni camera a tubo viene gonfiata al 125% della pressione nominale e mantenuta per 48 ore. I sensori di pressione registrano continuamente la compensazione della temperatura. Qualsiasi camera che superi il 5% di caduta di pressione attiva la riispezione automatica batch.
    standards:
      - 1,25 volte la pressione nominale di mantenimento
      - <5% di caduta massima di pressione
  - title: Test di carico e bilanciamento
    description: Le tavole completate vengono testate alla massima capacità nominale per stabilità, bordo libero e maneggevolezza. Ogni tavola viene sottoposta a test sull'acqua prima dell'approvazione finale.
    standards:
      - Verifica del carico classificato 1,25x
      - Test dell'acqua
equipment:
  - name: Macchina di prova universale (tensile)
    spec: Capacità 5 kN
  - name: Tester della perdita di pressione
    spec: Multicanale, 0–50 psi, registrazione dati
  - name: Camera per invecchiamento
    spec: UVA-340, cicli di 1.000 h
  - name: Calibro per spessore (digitale)
    spec: Risoluzione 0,01 mm
  - name: Tester di pelatura (saldatura)
    spec: Motorizzato, capacità 50 N
  - name: Camera di temperatura
    spec: -40 °C a 100 °C
  - name: Vasca per rilevamento perdite
    spec: 6 m × 2 m, illuminata
tldr:
  summary: 'Il laboratorio di qualità Paddle Board Overstock opera indipendentemente dalla produzione, eseguendo test di trazione, sfilamento, UV e pressione secondo protocolli interni documentati. Il 100% delle unità viene sottoposto a test di mantenimento della pressione a 1,25 volte la pressione nominale. Tasso di assenza difetti: 99,3% sulle spedizioni degli ultimi 12 mesi.'
  points:
    - Laboratorio indipendente separato dalla produzione per una verifica della qualità imparziale
    - Test di pressione al 100% a 1,25 volte la pressione nominale con durata di 24-48 ore per unità
    - Protocolli interni documentati che regolano ogni test
    - Tasso di assenza difetti del 99,3% sulle spedizioni successive a 12 mesi
    - Ogni unità ispezionata attraverso un controllo qualità in 6 fasi prima della spedizione
protocols_label: Protocolli
