  tagline: Tecnologia
  title: Progettato per le prestazioni
  subtitle: Ogni tavola Paddle Board Overstock è ingegnerizzata con materiali di precisione e metodi di costruzione testati per ambienti marini. Centro R&S di 12.000 m² con prototipazione interna.
