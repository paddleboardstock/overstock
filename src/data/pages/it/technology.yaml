testimonial:
  quote: Ciò che mi ha convinto è stata la costruzione. Giunzioni saldate a fusione invece di colla, un nucleo drop-stitch che si sente solido a 15 PSI, e nessun tremolio quando faccio un passo indietro per girare. Due anni dopo, zero problemi.
  author: Marta Keller
  title: Acquirente verificato
  company: Paddleista per tour sul lago
  location: Germania
sections:
  - title: Drop-Stitch Nucleo
    standard: Pressione operativa 12-15 PSI
    description: Migliaia di fili interni in poliestere collegano gli strati superiore e inferiore, creando una struttura rigida a 12-15 PSI. Questa è la stessa tecnologia utilizzata nelle tavole da paddle professionali. La nostra densità drop-stitch è ottimizzata per modello per l'equilibrio ideale tra rigidità e peso.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagramma del nucleo DS
  - title: Grado PVC Marine
    standard: Saldato a fusione | UV / acqua salata / testato per abrasione
    description: Tessuto a più strati lamellare PVC valutato per ambienti marini. Ogni strato è saldato a fusione invece che incollato, eliminando i rischi di delaminazione. Testato per resistenza UV (1.000+ ore), corrosione da acqua salata e abrasione.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Strato PVC
  - title: Sistema ponte EVA
    standard: Motivi art-series antiscivolo e confortevoli
    description: Schiuma full-deck EVA offre grip, ammortizzazione e l'aspetto distintivo art-series. Pannelli tagliati con precisione sono inseriti in motivi senza cuciture — nessuna grafica stampata da rovinare, nessuna cera necessaria.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Ponte EVA
  - title: Sistema a tre strati per i bordi
    standard: Fusione legata | Sovracostruito nella zona di massima sollecitazione
    description: Le fasce del bordo sono a triplo strato con fusione legata e avvolte attorno al bordo della tavola — la zona di massima sollecitazione su qualsiasi gonfiabile. Qui le tavole economiche si rompono per prime; le nostre sono sovracostruite.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistema del bordo
