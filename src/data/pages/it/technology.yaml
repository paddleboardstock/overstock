testimonial:
  quote: Ciò che distingue Paddle Board Overstock è la loro scienza dei materiali. Non si limitano ad assemblare componenti — i compound PVC, i parametri di saldatura e la stratificazione strutturale sono sviluppati internamente. Questa integrazione verticale si vede nel prodotto finale.
  author: David Park
  title: Direttore sviluppo prodotto
  company: Bluewater Sports Equipment
  location: Australia

sections:
  - title: Nucleo drop-stitch
    standard: Pressione di esercizio 12-15 PSI
    description: Migliaia di fili interni in poliestere collegano lo strato superiore e quello inferiore, creando una struttura rigida a 12-15 PSI. È la stessa tecnologia usata nelle tavole da paddle professionali e nelle imbarcazioni da regata gonfiabili. La densità drop-stitch è ottimizzata per ogni modello per l'equilibrio ideale tra rigidità e peso.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagramma del nucleo drop-stitch
  - title: PVC di grado marino
    standard: Saldato per fusione | Testato contro UV / acqua salata / abrasione
    description: Tessuto in PVC laminato multistrato certificato per ambienti marini. Ogni strato è saldato per fusione anziché incollato, eliminando i rischi di delaminazione. Testato per resistenza UV (ASTM G154, 1.000+ ore), corrosione in acqua salata (ISO 9227) e abrasione (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Strato di PVC
  - title: Tubolari in Hypalon
    standard: Gomma CSM | Resistente a UV / agenti chimici / temperature estreme
    description: Utilizzato sui modelli RIB, la gomma Hypalon (CSM) offre una resistenza superiore a UV e agenti chimici rispetto al PVC standard. I tubolari in Hypalon mantengono la flessibilità a temperature estreme e resistono alla degradazione da esposizione a carburante e olio. Tutte le cuciture sono realizzate a mano da tecnici certificati.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Pavimento Air Deck
    standard: Gonfiabile ad alta pressione | Sostituisce multistrato/alluminio
    description: Sistema di pavimento gonfiabile ad alta pressione che sostituisce i tradizionali pavimenti in multistrato o listelli di alluminio. Riduce i tempi di allestimento, il peso complessivo e il volume di stoccaggio, garantendo al contempo una rigidità adeguata per stare in piedi, pescare e camminare. Testato per reggere un carico distribuito di 200+ kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Pavimento gonfiabile

