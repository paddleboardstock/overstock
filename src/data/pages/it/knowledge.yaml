hero:
  tagline: Grafico della conoscenza
  title: Conoscenza dell'esplorazione dell'acqua
  subtitle: |
    Una base di conoscenza strutturata che copre la tecnologia dei SUP gonfiabili,<br />
    sicurezza in acqua, ingegneria delle tavole e pianificazione dell'avventura.
  taglineSection: Esplora. Impara. Vai con fiducia.
clusters:
  tagline: Cluster di conoscenza
  title: Esplora per argomento
  subtitle: Approfondimenti sulla tecnologia, sicurezza e competenze dietro ogni prodotto Paddle Board Overstock.
  items:
    - title: SUP Conoscenza
      description: Dalla scelta della tua prima tavola alle tecniche avanzate di touring — tutto sul stand-up paddleboarding.
      icon: tabler:lifebuoy
      topics:
        - Come scegliere il tuo primo gonfiabile SUP
        - La migliore SUP taglia per principianti
        - Quanto è difficile fare paddle boarding?
        - Confronto tra tavola gonfiabile e tavola rigida
        - SUP lista di controllo della sicurezza
    - title: Tecnologia della scheda
      description: Approfondimenti tecnici sui core drop-stitch, laminati PVC, binari e valvole — come sono progettati gli SUPs gonfiabili.
      icon: tabler:anchor
      topics:
        - Come vengono realizzati i gonfiabili SUPs
        - PVC strati di laminato spiegati
        - Costruzione di rotaie e cuciture
        - approfondimento tecnologico Drop-stitch
        - Arte del mazzo EVA spiegata
    - title: Conoscenza della sicurezza
      description: Conoscenze essenziali sulla sicurezza per ogni canoista — dalla selezione di PFD alla lettura del meteo fino alle tecniche di auto-salvataggio.
      icon: tabler:shield
      topics:
        - SUP lista di controllo della sicurezza
        - Hai bisogno di un giubbotto di salvataggio?
        - Guida alla sicurezza per la pagaia in mare
        - Sicurezza sul fiume e nelle correnti per i canoisti
        - Consapevolezza delle condizioni meteorologiche e dell'acqua
    - title: Tecnologia
      description: L'ingegneria dietro i prodotti Paddle Board Overstock — materiali, metodi di costruzione e test di qualità.
      icon: tabler:microscope
      topics:
        - Tecnologia PVC di qualità marina
        - Spiegazione del nucleo Drop-stitch
        - Perché PSI è importante per SUPs gonfiabili
        - Saldatura RF vs incollaggio
        - Test di qualità su ogni tavola
    - title: Conoscenze per Club e Noleggio
      description: Guide pratiche per gestire un programma SUP — dalle operazioni di noleggio alle flotte di resort e club.
      icon: tabler:briefcase
      topics:
        - Come avviare un'attività di noleggio SUP
        - Costruire un centro per sport acquatici in un resort
        - Dimensionamento della flotta di paddle board per i club
        - Gonfiabile vs rigido SUP per uso commerciale
        - Le migliori tavole SUP per flotte a noleggio
        - Strategie di guadagno per gli sport acquatici nei resort
        - Guida alla manutenzione delle attrezzature commerciali
