hero:
  tagline: Aquafarer Academy
  title: Centro di apprendimento
  subtitle: Guide e tutorial per ogni livello di abilità — dalle basi del SUP alle tecniche di salvataggio avanzate

categories:
  - level: Principiante
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: Basi del SUP
        desc: Impara i fondamentali dello stand-up paddleboarding — postura, tecnica di pagaiata ed equilibrio.
        slug: beginner-sup-guide
      - title: Tecniche di pagaiata
        desc: Pagaiata in avanti, circolare, di trazione e appoggio basso — padroneggia i movimenti essenziali.
        slug: sup-paddle-guide
      - title: Sicurezza prima di tutto
        desc: Pratiche di sicurezza essenziali tra cui controllo meteo, uso del giubbotto, regole del leash e autorescat.
        slug: sup-safety-guide
  - level: Intermedio
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Essenziali per il touring
        desc: Pianificazione di pagaiate di più ore — navigazione, idratazione, ritmo e lettura delle previsioni del vento.
        slug: touring-sup-guide
      - title: Lettura del meteo
        desc: Interpretare le previsioni marine, identificare i modelli nuvolosi e comprendere gli effetti del vento sull'acqua.
        slug: weather-planning-water-sports
      - title: Basi di navigazione
        desc: Lettura delle carte, uso della bussola, waypoint GPS e pianificazione del percorso per la pagaiata costiera.
        slug: sup-navigation-guide
      - title: Consapevolezza delle maree
        desc: Comprendere i cicli di marea, le correnti e come influenzano i tempi di partenza e la rotta.
        slug: understanding-tides
  - level: Avanzato
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Pianificazione viaggi multi-giorno
        desc: Logistica di spedizione — selezione attrezzatura, pianificazione pasti, protocolli di sicurezza e contatti di emergenza.
        slug: sup-travel-guide
      - title: Tecniche di salvataggio
        desc: Autorescat, salvataggio a T, salvataggio eschimese per kayak e protocolli di rimorchio in acque libere.
        slug: sup-self-rescue
      - title: Pagaiata notturna
        desc: Navigazione dopo il buio — requisiti di illuminazione, memoria del percorso, comunicazione di gruppo e consapevolezza dei pericoli.
        slug: sup-navigation-guide
  - level: Manutenzione
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Pulizia & cura
        desc: Risciacquo con acqua dolce, protezione UV, prevenzione della muffa e tecniche di asciugatura corrette dopo ogni sessione.
        slug: inflatable-sup-maintenance
      - title: Guida allo stoccaggio
        desc: Migliori pratiche per la conservazione di tavole e imbarcazioni gonfiabili — sgonfiaggio, piegatura, controllo temperatura e durata.
        slug: inflatable-sup-storage
      - title: Basi di riparazione
        desc: Riparare piccole forature, perdite alle giunture e problemi alle valvole con kit di riparazione PVC e tecniche di toppa.
        slug: inflatable-sup-repair
      - title: Manutenzione valvole
        desc: Identificare i tipi di valvola (Halkey-Roberts, Boston, Leafield), pulire i detriti e sostituire gli steli difettosi.
        slug: inflatable-sup-repair

knowledge_center_tagline: Centro conoscenze

knowledge_center_title: Guide su equipaggiamento nautico e settore marino

knowledge_center_subtitle: Competenze specialistiche e guide all'acquisto per professionisti del settore nautico, gestori di flotte e appassionati di sport acquatici.

knowledge_sections:
  - title: Conoscenza dei RIB
    tagline: Guide ai gommoni rigidi
    desc: Tutto sui RIB — progetto dello scafo, materiali, scelta del motore, manutenzione e consigli d'acquisto per uso commerciale e diportistico.
    guides:
      - title: Come scegliere il RIB giusto
        desc: Guida completa alla scelta di un RIB — dimensioni, potenza del motore, materiale dei tubolari, tipo di scafo e utilizzo previsto.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB o gommone
        desc: Gommone rigido contro gommone tradizionale — confronto di progetto dello scafo, prestazioni, durabilità e capienza.
        href: /compare/rib-vs-dinghy
      - title: RIB commerciale o diportistico
        desc: RIB di livello professionale contro RIB diportistico — standard costruttivi, materiali, durata, costi e certificazioni.
        href: /compare/commercial-vs-recreational-rib
      - title: Scafo in alluminio o in vetroresina
        desc: Confronto tra scafi in alluminio e in fibra di vetro per RIB — peso, costo, durabilità e resistenza alla corrosione.
        href: /compare/aluminum-vs-fiberglass
  - title: Guida ai gommoni
    tagline: Conoscenza delle imbarcazioni gonfiabili
    desc: Guide complete sui gommoni — PVC o Hypalon, metodi di costruzione, norme di sicurezza e migliori pratiche di manutenzione.
    guides:
      - title: 'Guida ai materiali: PVC o Hypalon'
        desc: Confronto definitivo tra PVC e Hypalon CSM per la costruzione di gommoni.
        href: /compare/pvc-vs-hypalon
      - title: Come sono prodotti i gommoni
        desc: Processo produttivo — taglio del materiale, saldatura HF, costruzione delle cuciture, prova di pressione e controllo qualità.
        href: /learn/inflatable-technology
      - title: Guida alla sicurezza dei gommoni
        desc: Norme di sicurezza, capacità di carico, gonfiaggio corretto, controlli prima della partenza e procedure di emergenza.
        href: /learn/water-safety
      - title: Manutenzione dei gommoni
        desc: Pulizia, stoccaggio, protezione UV, svernamento e riparazione di gommoni e RIB.
        href: /v2/inflatable-boat-maintenance
  - title: Conoscenza nautica
    tagline: Gommoni e RIB
    desc: Guide tecniche su tipologie di imbarcazioni gonfiabili, materiali, metodi di costruzione, manutenzione e sicurezza — dai tender ai RIB.
    guides:
      - title: Tipi di imbarcazioni gonfiabili
        desc: Tender, RIB, kayak e gommoni — scoprite le differenze e scegliete quello giusto.
        href: /v2/inflatable-boat-buying-guide
      - title: Tecnologia drop-stitch
        desc: Come migliaia di fili interni creano strutture gonfiabili rigide ad alta pressione.
        href: /learn/drop-stitch-core
      - title: Riferimento materiali
        desc: Indici denier del PVC, pesi dei tessuti, resistenza UV e materiali di grado marino spiegati.
        href: /learn/materials
      - title: RIB o tender
        desc: Confronto tra gommoni rigidi e tender gonfiabili tradizionali per diversi utilizzi.
        href: /compare/rib-vs-dinghy
  - title: Conoscenza del SUP
    tagline: Guide allo stand-up paddle
    desc: Tutto sulle tavole da SUP — gonfiabile o rigida, dimensioni, tecnologia dei materiali e consigli esperti per tutti i livelli.
    guides:
      - title: SUP gonfiabile o rigido
        desc: Confronto tra iSUP e tavole rigide in epossidica — trasportabilità, durabilità, prestazioni e rapporto qualità-prezzo.
        href: /learn/sup
      - title: Guida alle dimensioni del SUP
        desc: Come lunghezza, larghezza e spessore influenzano stabilità, velocità e maneggevolezza.
        href: /learn/sup
      - title: Manutenzione e cura del SUP
        desc: Consigli su pulizia, stoccaggio, protezione UV e riparazione per tavole SUP gonfiabili.
        href: /v2/inflatable-sup-maintenance
      - title: Scegliere il primo SUP
        desc: Guida per principianti alla scelta della tavola da stand-up paddle giusta in base a peso, livello e utilizzo previsto.
        href: /learn/sup
  - title: Guida alle attrezzature subacquee
    tagline: Conoscenza delle barche da immersione professionali
    desc: Guide specialistiche su barche da immersione, RIB subacquei e attrezzature per centri immersioni, operatori e team di subacquei professionisti.
    guides:
      - title: Il miglior RIB per i centri immersioni
        desc: Come scegliere il RIB subacqueo giusto per il vostro centro — capienza, configurazione e budget.
        href: /solutions-diving-center-boats
      - title: Guida alla configurazione dei RIB subacquei
        desc: Dotazioni essenziali per i RIB da immersione — portabombole, scalette, piattaforma di immersione e stiva attrezzatura.
        href: /solutions-diving-center-boats
  - title: Guida ai tender da yacht
    tagline: Soluzioni tender per superyacht e settore nautico
    desc: Guide per scegliere il tender perfetto — tender gonfiabili, tender RIB, soluzioni di stoccaggio e accessori.
    guides:
      - title: Come scegliere un tender per yacht
        desc: Fattori da considerare nella scelta di un tender per il vostro yacht — dimensioni, materiale, motore e stoccaggio.
        href: /solutions-yacht-tender-solutions
      - title: Tender gonfiabili o RIB
        desc: Confronto tra tender gonfiabili e tender RIB per prestazioni, durabilità e ingombro di stivaggio.
        href: /compare/rib-vs-dinghy
  - title: Guida alle attrezzature di salvataggio
    tagline: Conoscenza delle imbarcazioni di ricerca e soccorso
    desc: Guide professionali su barche di salvataggio, imbarcazioni SAR e attrezzature di risposta alle emergenze per guardia costiera, bagnini e team di soccorso in caso di calamità.
    guides:
      - title: Guida alla scelta di imbarcazioni SAR
        desc: Come scegliere la giusta imbarcazione di ricerca e soccorso — velocità, capienza, durabilità e requisiti di attrezzatura specializzata.
        href: /solutions-rescue-watercraft
      - title: RIB commerciali per operazioni di soccorso
        desc: Perché i RIB di livello commerciale sono la scelta preferita dai team professionali di ricerca e soccorso in tutto il mondo.
        href: /use-cases/search-and-rescue

