hero:
  tagline: Paddle Board Overstock Accademia
  title: Centro di Apprendimento
  subtitle: Guide e tutorial per ogni livello di abilità — dalle basi di SUP alle tecniche avanzate di soccorso
categories:
  - level: Principiante
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Basi
        desc: Impara le basi del stand-up paddleboarding — postura, tecnica della pagaia e equilibrio.
        slug: beginner-sup-guide
      - title: Tecniche di Pagaiata
        desc: Pagaia avanti, pagaia sweep, pagaia draw e low brace — padroneggia i movimenti essenziali della pagaia.
        slug: sup-paddle-guide
      - title: Sicurezza Prima di Tutto
        desc: Pratiche di sicurezza essenziali, inclusi controlli meteo, uso di PFD, regole del leash e auto-soccorso.
        slug: sup-safety-guide
  - level: Intermedio
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Essenziali del Touring
        desc: Pianificazione di pagaiate di più ore — navigazione, idratazione, ritmo e interpretazione delle previsioni del vento.
        slug: touring-sup-guide
      - title: Lettura del Meteo
        desc: Interpretare le previsioni marine, identificare i modelli nuvolosi e comprendere gli effetti del vento sull’acqua.
        slug: weather-planning-water-sports
      - title: Basi di Navigazione
        desc: Lettura delle carte, uso della bussola, punti GPS e pianificazione del percorso per la pagaia costiera.
        slug: sup-navigation-guide
      - title: Consapevolezza delle Maree
        desc: Comprendere i cicli delle maree, le correnti e come influenzano i tempi di partenza e i percorsi.
        slug: understanding-tides
  - level: Avanzato
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Pianificazione di Viaggi di Più Giorni
        desc: Logistica dell’expedition — selezione dell’attrezzatura, pianificazione del cibo, protocolli di sicurezza e contatti d’emergenza.
        slug: sup-travel-guide
      - title: Tecniche di Soccorso
        desc: Auto-soccorso, T-rescue e protocolli di traino in acque aperte.
        slug: sup-self-rescue
      - title: Pagaiata Notturna
        desc: Navigazione dopo il tramonto — requisiti di illuminazione, memorizzazione del percorso, comunicazione nel gruppo e consapevolezza dei rischi.
        slug: sup-navigation-guide
  - level: Manutenzione
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Pulizia e Cura
        desc: Risciacquo in acqua dolce, protezione UV, prevenzione della muffa e corrette tecniche di asciugatura dopo ogni sessione.
        slug: inflatable-sup-maintenance
      - title: Guida allo Stoccaggio
        desc: Migliori pratiche per conservare le tavole gonfiabili — deflazione, piegatura, controllo della temperatura e durata di conservazione.
        slug: inflatable-sup-storage
      - title: Nozioni di base sulla riparazione
        desc: Ripara piccole forature, perdite di giuntura e problemi di valvole con PVC kit di riparazione e tecniche di patch.
        slug: inflatable-sup-repair
      - title: Manutenzione delle valvole
        desc: Identificare i tipi di valvole (Halkey-Roberts, Boston, Leafield), pulire i detriti e sostituire gli steli difettosi.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centro della Conoscenza
knowledge_center_title: Guide e conoscenze sulle tavole di paddle
knowledge_center_subtitle: Guide esperte e consigli sull'acquisto per i paddleboarder di ogni livello.
knowledge_sections:
  - title: Tecnologia e Costruzione per Consigli
    tagline: Dentro la tua tavola da paddle
    desc: Come vengono costruite le tavole gonfiabili — drop-stitch nuclei, strati laminati, EVA terrazze e test di pressione in fabbrica.
    guides:
      - title: Come vengono realizzate le tavole da paddle
        desc: Dal taglio e laminazione dei materiali al test di pressione al 100% — vedi come ogni tavola esce dalla fabbrica.
        href: /factory/process
      - title: Drop-Stitch Tecnologia Core
        desc: Come migliaia di filettature interne creino una struttura rigida e gonfiabile ad alta pressione.
        href: /learn/drop-stitch-core
      - title: Riferimento dei materiali
        desc: PVC Spiegate di denier, pesi di tessuto, UV resistenza e materiali del deck.
        href: /learn/materials
      - title: Tecnologia delle tavole gonfiabili
        desc: Giunture saldate, costruzione di rotaie e sistemi di valvole che mantengono la tavola rigida e ermetica.
        href: /learn/inflatable-technology
  - title: Guide all'acquisto
    tagline: Scegli la tavola giusta
    desc: Tutto ciò di cui hai bisogno per scegliere il tuo primo — o il prossimo — gonfiabile SUP, dalla taglia alla costruzione.
    guides:
      - title: Come scegliere un gonfiabile SUP
        desc: I fattori chiave — costruzione, spessore, configurazione delle alne e accessori inclusi.
        href: /guides/how-to-choose-your-sup/
      - title: Cos'è il paddleboarding in piedi?
        desc: Un'introduzione amichevole allo sport, all'attrezzatura e al motivo per cui le tavole gonfiabili rendono facile avviare.
        href: /guides/what-is-sup
      - title: Gonfiabile vs Tavola rigida
        desc: Confronta i SUP e schede epossidiche rigide in termini di portabilità, durata, prestazioni e valore.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Guida alle dimensioni
        desc: Trova la lunghezza, larghezza e volume della tavola giuste per il tuo peso, abilità e stile di pagai.
        href: /size-guide
  - title: Competenze e Sicurezza
    tagline: Pagaia con Fiducia
    desc: Conoscenze pratiche per ogni sessione — basi per principianti, sicurezza in acqua, cura e riparazione.
    guides:
      - title: SUP Basi — Guida per Principianti
        desc: Tutto ciò che un principiante deve sapere — tipi di tavole, dimensioni della pagaia, postura e consigli per il primo giorno.
        href: /v2/beginner-sup-guide
      - title: Nozioni Essenziali di Sicurezza in Acqua
        desc: Controllo del meteo, selezione PFD, regole del guinzaglio, auto-salvataggio e buone pratiche per la pagaia di gruppo.
        href: /learn/water-safety
      - title: SUP Manutenzione e Cura
        desc: Pulizia, stoccaggio, protezione UV e consigli di cura per tavole gonfiabili SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Basi della Riparazione delle Tavole
        desc: Ripara piccole forature, perdite di giuntura e problemi di valvole con PVC kit di riparazione e tecniche di patch.
        href: /v2/inflatable-sup-repair
