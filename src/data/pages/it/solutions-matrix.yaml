hero:
  tagline: Matrice delle soluzioni di settore
  title: Soluzioni marine basate su scenari<br />Per operazioni professionali
  subtitle: Moto d'acqua gonfiabili e RIB appositamente progettati configurati per applicazioni di salvataggio, noleggio di flotte, tender per yacht e pesca commerciale, ciascuno supportato da specifiche tecniche e opzioni di personalizzazione.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Soluzioni marine professionali Paddle Board Overstock per diversi settori
direct_answer: "Paddle Board Overstock offre moto d'acqua gonfiabili e soluzioni RIB progettate per operazioni marine commerciali: imbarcazioni di salvataggio e pattuglia con tubi Hypalon rinforzati e sicurezza multicamera, SUP e kayak per flotte a noleggio con PVC da 1,2 mm e cuciture saldate ad aria calda per una durata che richiede poca manutenzione, tender per yacht di lusso con scafo in alluminio a V profonda RIB e configurazioni per la pesca pesante con portacanne e sistemi di vasca del vivo."
solution_a:
  tagline: Soluzione A
  title: Soccorso marittimo e<br />pattuglia commerciale
  subtitle: RIB di sicurezza multicamera ad alta velocità per interventi professionali di risposta alle emergenze e operazioni di polizia.
  badge: Heavy-Duty Series
  description: I nostri RIB di salvataggio e pattugliamento marino sono costruiti con tubi d'aria rinforzati in Hypalon/PVC ad alta densità con design di galleggiamento indipendente multicamera. Ogni imbarcazione è dotata di nastro riflettente di livello professionale, cime di salvataggio e valvole di gonfiaggio rapido per essere pronta all'impiego. Gli scafi in vetroresina a V profonda garantiscono un'eccezionale stabilità alle alte velocità e in condizioni di mare mosso.
  features:
    - title: Sicurezza multicamera
      description: "4-6 camere d'aria indipendenti: qualsiasi foratura a camera singola mantiene una flottazione positiva"
    - title: Tessuto tubolare rinforzato
      description: PVC Hypalon CSM da 1,2 mm o PVC 1.680 DTEX con cuciture saldate ad aria calda a doppio strato
    - title: Grado professionale
      description: Nastro riflettente SOLAS, cime di salvataggio, bitte da traino, linea di verniciatura a sgancio rapido
    - title: Scafo ad alta velocità
      description: Scafo a V profondo in fibra di vetro o alluminio valutato per 25-45 nodi a seconda della configurazione
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materiale dello scafo
      value: Fibra di vetro/alluminio marino
    - label: Tessuto tubolare
      value: PVC Hypalon CSM da 1,2 mm / 1.680 DTEX
    - label: Velocità massima
      value: 25–45 nodi
    - label: Capacità
      value: 6–12 persone
    - label: Gamma motori
      value: 40–200 CV
    - label: Certificazione
      value: CE/ISO 9001
solution_b:
  tagline: Soluzione B
  title: Noleggio di sport acquatici e<br />attrezzatura della flotta del resort
  subtitle: SUP, kayak e barche gonfiabili ultra resistenti e a bassa manutenzione costruiti per il noleggio quotidiano in resort, club e tour operator.
  badge: Rental-Grade
  description: Le attrezzature della nostra flotta a noleggio sono progettate per la massima durata e i minori costi di manutenzione. Utilizziamo PVC rinforzato da 1,2 mm con tecnologia di giuntura saldata ad aria calda a triplo strato che resiste alla degradazione UV e ai frequenti danni da collisione. La struttura Drop-Stitch garantisce che le tavole mantengano la rigidità anche dopo centinaia di cicli di noleggio. Tutti i modelli sono dotati di anelli a D rinforzati, fasce ferroviarie resistenti all'abrasione e valvole di tipo commerciale.
  features:
    - title: PVC di livello commerciale
      description: 'PVC rinforzato da 1,2 mm con stabilizzatori UV: 3 volte più spesso dei materiali di consumo'
    - title: Cuciture saldate ad aria calda
      description: 'Saldatura per fusione a triplo strato: più forte del fissaggio adesivo, resiste alla delaminazione'
    - title: Rigidità del punto goccia
      description: Nucleo da 1.680 DTEX con 2 fili/pollice quadrato - nominale a 20 PSI per rigidità simile a quella di un pannello rigido
    - title: Design pronto per la flotta
      description: Anelli a D rinforzati, valvole commerciali Halkey-Roberts, fasce ferroviarie resistenti all'abrasione
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materiale del tubo
      value: PVC rinforzato da 1,0–1,2 mm
    - label: Tecnologia di cucitura
      value: Saldatura ad aria calda triplo strato
    - label: Pressione massima
      value: 15–20 PSI (modelli con punto basso)
    - label: Resistenza ai raggi UV
      value: Oltre 1.000 ore di test accelerati
    - label: Garanzia
      value: 2–5 anni a seconda del modello
    - label: Manutenzione
      value: 'Minimo: sciacquare e conservare'
solution_c:
  tagline: Soluzione C
  title: Tender per yacht e<br />moto d'acqua di lusso
  subtitle: Tender RIB leggeri e ad alte prestazioni progettati per lo stoccaggio di superyacht e il trasporto degli ospiti con finiture e finiture di lusso.
  badge: Premium Series
  description: I nostri gommoni per tender per yacht combinano una struttura leggera con un'estetica di lusso. Gli scafi a V profonda in alluminio o fibra di vetro offrono una qualità di guida eccezionale e un facile sollevamento della gru. disponibile con grafica dei tubi in tinta, rivestimento premium e layout della console personalizzati. Le dimensioni di stoccaggio compatte li rendono ideali per i garage dei superyacht e per lo stoccaggio sul ponte.
  features:
    - title: Costruzione leggera
      description: Gli scafi in alluminio di tipo marino riducono il peso del 30% rispetto alla fibra di vetro per un facile sollevamento
    - title: Prestazioni a V profonda
      description: Scafo con deadrise di 18-22 gradi per una guida fluida in condizioni di taglio e un tracciamento eccellente
    - title: Vestibilità e finiture di lusso
      description: Tappezzeria personalizzata, tubi in tinta, console del timone premium, pacchetto inossidabile
    - title: Archiviazione compatta
      description: 'Progettato per i garage dei superyacht: tubi sgonfiabili per uno stivaggio compatto'
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Tipo di scafo
      value: Alluminio/fibra di vetro a V profonda
    - label: Deadrise
      value: 18-22 gradi
    - label: Velocità massima
      value: 30–40 nodi
    - label: Peso a secco
      value: 120–350 kg (scafo in alluminio)
    - label: Gru per sollevamento pronta
      value: Sì, punti di sollevamento standard
    - label: Magazzinaggio
      value: Tubi sgonfiabili, impilabili
