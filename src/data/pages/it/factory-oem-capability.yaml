services:
  - title: Progettazione Prodotto & Ingegneria
    description: Il nostro team interno di R&S lavora sul tuo concept o sulle tue specifiche per sviluppare disegni CAD, modelli 3D e prototipi. Offriamo progettazione degli stampi, ottimizzazione della forma dello scafo e assistenza nella selezione dei materiali.
  - title: Branding & Grafica Personalizzati
    description: Stampa digitale a colori, serigrafia, goffratura e opzioni di etichette. Sviluppiamo grafiche del ponte specifiche per il brand, branding del tubolare e imballaggi pronti per il retail.
  - title: Personalizzazione Materiali & Specifiche
    description: Scegli tra PVC (standard, ecologico, ignifugo), Hypalon/CSM, drop-stitch e costruzioni ibride. Colori del tubolare personalizzati, pesi del tessuto e opzioni di rinforzo.
  - title: Imballaggio & Logistica
    description: Imballaggio retail personalizzato, scatole private label, confezione sottovuoto, pallettizzazione e caricamento del container. Termini di spedizione FOB Qingdao, CIF o DDP disponibili.

