why_us:
  - title: Integrazione Verticale
    description: Possediamo la nostra fabbrica, gli stampi e la supply chain — niente intermediari, niente subappaltatori. Questo ci dà il controllo su qualità, costi e consegna.
  - title: Doppia Certificazione
    description: Sistema di gestione della qualità ISO 9001 e certificazione di conformità sociale BSCI. Rapporti di audit di fabbrica disponibili su richiesta.
  - title: Conformità CE
    description: Tutti i modelli standard sono certificati CE 2013/53/EU. I modelli personalizzati possono essere certificati CE tramite il nostro processo consolidato.
  - title: MOQ Basso
    description: Inizia con appena 5 unità per i modelli standard. Aiutiamo i marchi emergenti a lanciarsi senza impegnare eccessivamente il magazzino.