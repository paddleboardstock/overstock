  title: "Aquafarer — Ingegneria della libertà sull'acqua"
  subtitle: "Da un'officina costiera a un produttore marittimo globale — il nostro viaggio si fonda su una convinzione ostinata: le imbarcazioni devono essere progettate come se contassero, perché contano."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
