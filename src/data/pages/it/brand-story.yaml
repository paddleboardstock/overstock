content_founding:
  tagline: L'Inizio
  title: 'Nati sul Lungomare'
  subtitle: "Aquafarer è nata in un'officina costiera a Qingdao con una barca e una visione: costruire imbarcazioni gonfiabili in grado di affrontare condizioni marine reali."
  paragraphs:
    - 'Nel 2012, i nostri fondatori hanno visto un vuoto nel mercato — la maggior parte delle barche gonfiabili era economica ma inaffidabile, oppure di alta qualità ma proibitivamente costosa. Hanno creduto che ci fosse spazio per un produttore capace di offrire sia qualità sia valore.'
    - 'Il primo scafo è stato costruito a mano, testato nelle acque locali e perfezionato grazie al feedback reale di pescatori e piccoli operatori commerciali. Questo ciclo — costruire, testare, ascoltare, migliorare — rimane al centro della nostra filosofia ingegneristica ancora oggi.'
    - "Entro il 2015, la reputazione si era diffusa oltre Qingdao. I distributori internazionali iniziarono a richiedere campioni. Ciò che era iniziato come un'officina locale stava diventando un fornitore globale."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Prima officina di produzione Aquafarer e manifattura
content_growth:
  tagline: Crescita e Innovazione
  title: "Dall'officina a un impianto di 12,000 m²"
  subtitle: "L'investimento continuo in persone, attrezzature e processi ha trasformato Aquafarer in un moderno impianto di produzione marittima."
  paragraphs:
    - 'Con la crescita della domanda, è cresciuto anche il nostro impianto. Ci siamo espansi da una piccola officina a una fabbrica di 12,000 m² con linee di produzione dedicate a barche RIB, barche gonfiabili, SUP e accessori.'
    - 'Abbiamo investito in macchine di taglio CNC, attrezzature di saldatura ad alta frequenza, linee di produzione drop stitch e banchi di prova completi — permettendoci di controllare ogni aspetto della qualità di produzione.'
    - 'Oggi il nostro team di 200-300 persone comprende ingegneri navali, scienziati dei materiali, specialisti del controllo qualità e artigiani qualificati — molti dei quali sono con Aquafarer fin dai primi giorni.'
content_mission:
  tagline: La Nostra Missione
  title: "Ingegneria della libertà sull'acqua"
  subtitle: "Ogni prodotto Aquafarer è progettato per aiutare le persone a esplorare, lavorare e prosperare sull'acqua — in modo affidabile, sicuro e accessibile."
  list:
    - 'Progettare imbarcazioni che funzionano in condizioni marine reali — non solo sulla carta'
    - 'Costruire partnership durature con distributori e brand attraverso un servizio OEM/ODM affidabile'
    - 'Migliorare continuamente i nostri processi produttivi per offrire maggiore valore'
    - 'Supportare ogni prodotto con ricambi originali e competenza tecnica'
cta:
  title: 'Pronto a collaborare con un produttore<br />che tiene alla qualità?'
  subtitle: "Contatta il nostro team per discutere il tuo progetto OEM/ODM — nessuna pressione sull'ordine minimo, solo consigli onesti."
  actions:
    - variant: primary
      text: Inizia una conversazione
      href: /contact
    - text: Esplora i nostri prodotti
      href: /products
