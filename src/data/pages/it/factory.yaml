      label: Unità sottoposte a test di pressione
      detail: Ogni tavola, ogni camera, ogni lotto
    - value: <5%
      label: Massima caduta di pressione consentita
      detail: Oltre 24h a 1,25× pressione nominale
    - value: 99.3%
      label: Tasso senza difetti
      detail: Secondo il campionamento interno QC
    - value: 24–48h
      label: Durata della tenuta della pressione
      detail: A seconda della categoria di prodotto
    - value: 1.25×
