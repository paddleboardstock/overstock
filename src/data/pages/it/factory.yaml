testing_section:
  tagline: Controllo qualità
  title: Processo di collaudo e assicurazione qualità
  description: Ogni imbarcazione viene sottoposta a collaudi obbligatori prima della spedizione. Il nostro laboratorio qualità opera in modo indipendente dalla produzione e riferisce direttamente alla direzione.
  steps:
    - title: Ispezione delle materie prime
      desc: I tessuti in PVC, Hypalon e drop-stitch vengono sottoposti a prove di trazione, di propagazione dello strappo e a verifica della resistenza ai raggi UV prima che qualsiasi lotto entri in produzione.
    - title: Test di ritenzione d’aria di 48 ore
      desc: Ogni camera del tubolare viene gonfiata al 125 % della pressione nominale e mantenuta per 48 ore. Un calo di pressione superiore al 5 % comporta lo scarto automatico e la revisione delle saldature.
    - title: Prove di carico e bilanciamento
      desc: Le imbarcazioni finite vengono caricate alla capacità nominale massima e testate per stabilità, franco bordo e manovrabilità. Ogni imbarcazione viene testata in acqua prima dell’ispezione finale.
case_studies:
  tagline: Progetti OEM
  title: Casi di successo di partnership con brand e OEM
  description: Dal concept al container — come aiutiamo i brand globali a lanciare e far crescere le loro linee di imbarcazioni gonfiabili.
  labels:
    challenge: Sfida
    solution: Soluzione
    result: Risultato
  cards:
    - challenge: Un rivenditore europeo di articoli outdoor aveva bisogno di una linea SUP a marchio privato con grafiche del ponte uniche, PVC ecologico e confezionamento pronto per la vendita, il tutto consegnato in 60 giorni.
      solution: Abbiamo sviluppato file di stampa digitale personalizzati, selezionato PVC conforme REACH e ridotto il campionamento da 3 a 1 ciclo collocando il team di design presso la nostra fabbrica di Qingdao.
      result: 55 giorni dall’ordine firmato all’FOB. 2.400 unità su 4 SKU. Ordine di riordino piazzato prima dell’arrivo del primo container.
    - challenge: Una startup americana di sport acquatici aveva bisogno di un kayak drop-stitch ad alte prestazioni con forma dello scafo personalizzata, confezionamento co-brandizzato e certificazione BSCI per la vendita al dettaglio.
      solution: Abbiamo adattato lo stampo esistente del kayak drop-stitch con profilo rocker modificato, sviluppato la grafica del confezionamento co-brandizzato e fornito la documentazione completa di audit BSCI.
      result: Inserito con successo in 3 grandi catene outdoor statunitensi. Oltre 5.000 unità nel primo anno con un tasso di vendita del 98 %.
    - challenge: Un distributore australiano richiedeva una gamma di RIB certificata CE con colori dei tubolari personalizzati, opzione di upgrade all’Hypalon e conformità alla norma australiana AS 1799.
      solution: Abbiamo prodotto campioni di pre-produzione con 4 varianti di colore dei tubolari, selezionato CSM Hypalon da un fornitore giapponese e coordinato test di conformità AS 1799 di terze parti.
      result: Gamma di 3 modelli di RIB lanciata sul mercato AU/NZ. Seguita dalla vittoria di una gara d’appalto governativa per 12 RIB di pattuglia.

