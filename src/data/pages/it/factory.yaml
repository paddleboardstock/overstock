workshops_section:
  tagline: Laboratori
  title: Officine di produzione
  workshops:
    - title: PVC Taglio e preparazione dei materiali
      description: Le CNC macchine da taglio PVC drop-stitch automatiche lavorano e usano tessuti con precisione sub-millimetrica. La nesting ottimizzata dal computer minimizza gli sprechi di materiali e garantisce che ogni pannello rispetti le specifiche dimensionali prima della saldatura.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Saldatura e sigillatura termica
      description: Officina di saldatura dedicata con macchine per la sigillatura termica e presse dielettriche RF. Le saldatrici ad aria drop-stitch calda legano e fondono i noccioli e le bande delle rotaie, mentre le saldature RF producono giunture ermetiche ad alta resistenza.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Arte del mazzo e EVA finitura
      description: "Qui prendono forma i deck della serie Art: EVA i pannelli di schiuma tagliati con precisione vengono posati in motivi per tutto il deck, incollati e rifiniti a mano per una finitura aderente, comoda e resistente — l'aspetto distintivo di ogni tavola della serie Art."
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Stampa e decorazioni
      description: SUP Le tavole vengono decorate utilizzando la stampa digitale per grafica a colori e la serigrafia per loghi e motivi ripetuti. Le stampanti digitali producono design di deck di qualità fotografica, mentre la serigrafia produce segni di marca durevoli e vividi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montaggio finale e montaggio
      description: Linea di montaggio dove le tavole ricevono valvole, anelli a D, maniglie, pinne e attacchi per guinzaglio. Ogni tavola segue una checklist di assemblaggio di 100 punti firmata dal team leader.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Test e ispezioni di qualità
      description: Ogni scheda completata è sottoposta a test obbligatori di ritenzione dell'aria, verifica del peeling delle giunture e un controllo completo dei sistemi prima della spedizione. Il nostro laboratorio di qualità opera indipendentemente dalla produzione e riporta direttamente alla direzione.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
