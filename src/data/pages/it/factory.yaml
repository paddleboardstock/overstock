material_traceability:
  tagline: Tracciabilità
  title: Tracciamento dei materiali e controllo dei lotti
  description: A ogni lotto di materia prima viene assegnato un numero di lotto unico nel nostro sistema ERP. Dall'arrivo alla produzione fino al prodotto finito, il bill of materials di ogni scheda è collegato al lotto originale del fornitore. Questo consente la completa tracciabilità a monte per qualsiasi richiesta di qualità.
  system: Tag di lotto fisici personalizzati ERP (sistema interno) + su ogni ordine di lavoro
  coverage: Il 100% dei materiali di produzione — PVC, tessuto drop-stitch, schiuma EVA, adesivi, valvole, componenti hardware, imballaggi
  records_retained: 10 anni
