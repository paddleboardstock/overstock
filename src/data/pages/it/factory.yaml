qc_section:
  tagline: Controllo Qualità
  title: Processo di Test e Garanzia Qualità
  subtitle: Ogni imbarcazione subisce test obbligatori prima della spedizione. Il nostro laboratorio qualità opera indipendentemente dalla produzione e riporta direttamente alla direzione.
  steps:
    - step: '1'
      title: Ispezione Materie Prime
      desc: I tessuti PVC, Hypalon e drop-stitch subiscono test di trazione (ASTM D751), propagazione strappo e verifica resistenza UV prima che qualsiasi lotto entri in produzione.
    - step: '2'
      title: Test Ritenzione Aria 48 Ore
      desc: Ogni camera tubolare è gonfiata al 125% della pressione nominale e mantenuta per 48 ore. Un calo di pressione superiore al 5% attiva il rigetto automatico e la reispezione delle giunture.
    - step: '3'
      title: Test Carico e Bilanciamento
      desc: Le imbarcazioni finite sono caricate alla massima capacità nominale e testate per stabilità, bordo libero e manovrabilità. Ogni imbarcazione è testata in acqua prima dell'ispezione finale.
oem_section:
  tagline: Progetti OEM
  title: Casi Studio Partnership Marchio e OEM
  subtitle: Dal concept al container — come aiutiamo i marchi globali a lanciare e scalare le loro linee di imbarcazioni gonfiabili.
  cases:
    - challenge: Un rivenditore europeo di outdoor necessitava di una linea SUP a marchio private label con grafica ponte unica, PVC ecologico e imballaggio pronto per la vendita al dettaglio — tutto consegnato in 60 giorni.
      solution: Sviluppo di file stampa digitale personalizzati, approvvigionamento PVC conforme REACH e compressione della campionatura da 3 turni a 1 co-localizzando il team di design nella nostra fabbrica di Qingdao.
      result: 55 giorni dall'ordine firmato al FOB. 2.400 unità su 4 SKU. Ordine ripetuto prima dell'arrivo del primo container.
    - challenge: Una startup americana di sport acquatici necessitava di un kayak drop-stitch ad alte prestazioni con forma scafo personalizzata, imballaggio co-branded e certificazione BSCI per il posizionamento al dettaglio.
      solution: Adattamento dello stampo kayak drop-stitch esistente con profilo rocker modificato, sviluppo grafica imballaggio co-branded e fornitura documentazione completa audit BSCI.
      result: Elencato con successo in 3 grandi catene outdoor USA. 5.000+ unità nel primo anno con 98% tasso di sell-through.
    - challenge: Un distributore australiano richiedeva una gamma RIB certificata CE con colori tubolari personalizzati, opzione upgrade Hypalon e conformità allo standard australiano AS 1799.
      solution: Produzione campioni pre-produzione con 4 varianti colore tubolari, approvvigionamento Hypalon CSM da fornitore giapponese e coordinamento test conformità AS 1799 di terze parti.
      result: Gamma RIB di 3 modelli lanciata sul mercato AU/NZ. Seguita da vincita gara d'appalto governativa per 12 RIB da pattuglia.
faq_section:
  tagline: FAQ
  title: Domande Frequenti B2B e OEM
  questions:
    - q: Qual è la quantità minima d'ordine (MOQ) per tavole SUP gonfiabili OEM?
      a: La MOQ inizia a 5–10 unità per modelli OEM standard. Stampi personalizzati e progetti private label richiedono un minimo di 200 unità a seconda della complessità. Ordini di prova e campionature sono disponibili per lanci di nuovi marchi.
    - q: Paddle Board Overstock possiede la certificazione BSCI?
      a: Sì. La nostra fabbrica mantiene una certificazione conformità sociale BSCI valida (rapporto audit disponibile su richiesta). Deteniamo anche ISO 9001:2015 per la gestione qualità, e 64 dei nostri modelli portano la certificazione CE (TÜV Rheinland). La documentazione conformità REACH e RoHS è fornita con ogni spedizione OEM.
    - q: Qual è il tempo di consegna tipico per un ordine OEM?
      a: Il tempo di consegna standard è di 30–45 giorni dall'ordine confermato e dal deposito. Lo sviluppo stampo personalizzato aggiunge 15–20 giorni per l'attrezzatura. Offriamo produzione accelerata per ordini urgenti e rush stagionali durante la finestra pre-estiva (gen–mar).
    - q: Potete spedire FOB Qingdao o CIF al nostro porto?
      a: Sì. Spediamo FOB Qingdao, CIF verso i principali porti globali e DDP per partner qualificati. Il nostro team logistico gestisce prenotazione container, documentazione export e sdoganamento. Spediamo in 50+ paesi nei mercati UE, USA, AU e Asia.
b2b_moq: 'MOQ standard: 5–10 unità per modello (SUP/kayak/drop-stitch). MOQ RIB: 2–5 unità. Ordini di prova benvenuti per nuove partnership.'
production_flow:
  tagline: Flusso di produzione
  title: Dal materiale alla barca finita
  subtitle: Ogni barca attraversa 6 fasi di produzione con punti di controllo QC a ogni passaggio. Nessuna scorciatoia, nessuna ispezione saltata.
  stages:
    - stage: '01'
      title: Ricezione materiali e QC in ingresso
      description: Tutti i materiali in arrivo vengono registrati per numero di lotto nel nostro sistema ERP. Rotoli di tessuto PVC, nuclei drop-stitch, valvole, adesivi e ferramenta vengono messi in quarantena fino all'approvazione del QC.
      qc_check: Resistenza a trazione (ASTM D751), resistenza allo strappo (ISO 4674), misuratore di spessore, viscosità dell'adesivo, scansione visiva dei difetti
      qc_threshold: 100 % dei lotti testato. Scarto se trazione < 90 % della specifica, strappo < minimo di specifica o qualsiasi difetto visivo
      responsibility: Team QC in ingresso (3 ispettori)
    - stage: '02'
      title: Taglio CNC e preparazione materiali
      description: La nesting ottimizzata al computer dispone i pannelli sul materiale PVC per ridurre al minimo gli scarti. Le macchine da taglio CNC automatiche mantengono una precisione posizionale di 0,1 mm.
      qc_check: Controllo dimensionale contro i file CAD DXF, ispezione della qualità dei bordi, verifica del numero di pannelli
      qc_threshold: Ogni 20° pannello misurato. Tolleranza ±0,5 mm. Scarto del lotto se >2 % fuori tolleranza
      responsibility: Responsabile officina taglio
    - stage: '03'
      title: Saldatura e unioni drop-stitch
      description: I nuclei drop-stitch vengono uniti ai laminati esterni in PVC tramite laminazione a caldo. Le camere dei tubolari vengono saldate a RF o ad aria calda. Le bande di rotaia vengono unite per fusione a tre strati.
      qc_check: Prova di pelatura ogni 50 unità (ASTM D751), misurazione della larghezza della saldatura, revisione dei registri di temperatura dell'aria calda, ispezione visiva delle cuciture a luce radente
      qc_threshold: Resistenza alla pelatura min. 8 N/cm. Tolleranza della larghezza di saldatura ±1 mm. Qualsiasi canalizzazione visibile = scarto
      responsibility: QC saldatura (2 ispettori per turno)
    - stage: '04'
      title: Assemblaggio e allestimento
      description: "Le barche passano all'assemblaggio finale, dove vengono uniti tutti i componenti: scafo + tubolari, valvole installate, anelli a D, maniglie, alloggiamenti pinne e alloggiamento della borsa da trasporto. Ogni unità segue una lista di assemblaggio di 100 punti."
      qc_check: Firma della checklist di 100 punti per unità, test funzionale delle valvole (10 cicli di apertura/chiusura), verifica della coppia della ferramenta, ispezione visiva
      qc_threshold: 'Politica a difetti zero sugli elementi critici per la sicurezza (valvole, anelli a D, maniglie). Estetica minore: AQL 2,5 (ISO 2859)'
      responsibility: Responsabile assemblaggio + QC di linea
    - stage: '05'
      title: Prova di pressione e blocco qualità
      description: Ogni camera viene gonfiata a 1,25× la pressione nominale (in genere 20–25 PSI) e mantenuta per 24–48 ore. I sensori di pressione registrano in continuo. Le camere con una caduta di pressione superiore al 5 % vengono scartate e inviate alla ri-ispezione delle cuciture.
      qc_check: Registro del mantenimento in pressione di 24 h, taratura dei sensori verificata quotidianamente, lettura della pressione compensata in temperatura, re-test delle cuciture dopo la riparazione
      qc_threshold: Max 5 % di caduta di pressione in 24 h a temperatura stabile. Qualsiasi camera oltre questo limite = re-test al 100 % dell'intero lotto di produzione
      responsibility: Laboratorio qualità (indipendente dalla produzione, riferisce direttamente alla direzione)
    - stage: '06'
      title: Ispezione finale e imballaggio
      description: Ispezione visiva e funzionale finale. Difetti superficiali, uniformità del colore, verifica di etichetta/BIN, integrità dell'imballaggio e completezza degli accessori. Le unità vengono confezionate sottovuoto, inscatolate e pallettizzate per il caricamento in container.
      qc_check: Ispezione visiva completa, lista accessori per SKU, test di caduta dell'imballaggio (1 m, campione casuale), verifica tramite scansione di etichetta/codice a barre
      qc_threshold: AQL 2,5 per difetti maggiori, AQL 4,0 per minori. Tolleranza zero sui difetti di sicurezza. 100 % delle unità ispezionate visivamente
      responsibility: Team QC finale (4 ispettori) + responsabile imballaggio
