material_traceability:
  tagline: Tracciabilità
  title: Tracciabilità dei materiali e controllo dei lotti
  description: Ogni lotto di materia prima riceve un numero di lotto univoco nel nostro sistema ERP. Dall'arrivo, attraverso la produzione fino al prodotto finito, la distinta base di ogni barca rimanda al lotto originale del fornitore. Ciò consente una tracciabilità a monte completa per qualsiasi richiesta di qualità o conformità.
  system: ERP proprietario (sistema interno) + tag fisici di lotto su ogni ordine di produzione
  coverage: 100 % dei materiali di produzione — PVC, Hypalon, tessuto drop-stitch, adesivi, valvole, ferramenta, imballaggio
  records_retained: 10 anni (secondo il requisito CE 2013/53/EU)
  suppliers:
    - material: PVC di grado marino
      source: Fornitori cinesi e coreani
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Fornitore giapponese
      certified: ISO 9001, REACH
    - material: Tessuto drop-stitch
      source: Tessitura interna + partner esterno
      certified: QC interno + ISO 9001 del fornitore
    - material: Valvole e ferramenta
      source: Fornitori OEM cinesi
      certified: ISO 9001, certificati materiali per lotto
