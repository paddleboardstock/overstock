hero:
  tagline: Fabbrica
  title: Fabbrica e Produzione
  subtitle: 12.000 m2 di produzione integrata — dalla materia prima al pannello finito
intro:
  - In quanto marchio di fabbrica del **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock controlla ogni fase della produzione — dall'arrivo delle materie prime PVC drop-stitch e delle materie prime fino all'ispezione finale pre-consegna del pannello finito. Il nostro stabilimento produttivo nella Zona di Sviluppo Economico di Weihai si estende su 12.000 metri quadrati e ospita laboratori dedicati per PVC il taglio, la sigillatura termica e la saldatura, la finitura dell'arte del deck, l'assemblaggio finale e i test di qualità.
  - Integrando progettazione, ingegneria, prototipazione, produzione e test sotto un unico tetto, eliminiamo le inefficienze della produzione su contratto e manteniamo il controllo diretto sulla qualità costruttiva, la selezione dei materiali e i tempi di consegna. Ogni tavola che lascia la nostra officina è costruita dal nostro personale, sulle nostre attrezzature, secondo i nostri standard.
