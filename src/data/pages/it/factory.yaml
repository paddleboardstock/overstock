qc_section:
  tagline: Controllo Qualità
  title: Test e processo di assicurazione qualità
  subtitle: Ogni consiglio è sottoposto a test obbligatori prima della spedizione. Il nostro laboratorio di qualità opera in modo indipendente dalla produzione e riferisce direttamente alla direzione.
  steps:
    - step: '1'
      title: Ispezione delle materie prime
      desc: PVC e drop-stitch i tessuti sono sottoposti a test di trazione, propagazione delle strappi e UV verifica della resistenza prima che qualsiasi lotto entri in produzione.
    - step: '2'
      title: Test di Ritenzione dell'Aria di 48 Ore
      desc: Ogni camera della tavola viene gonfiata al 125% della pressione nominale e mantenuta per 48 ore. Una caduta di pressione superiore al 5% provoca il rifiuto automatico e la reinspezione della cucitura.
    - step: '3'
      title: Test di carico e bilanciamento
      desc: Le tavole completate vengono caricate alla massima capacità nominale e testate per stabilità, bordo libero e manovrabilità. Ogni tavola viene testata in acqua prima dell'ispezione finale.
faq_section:
  tagline: Domande Frequenti
  title: Domande Frequenti
  questions:
    - q: Dove vengono prodotti i vostri paddle board?
      a: 'Ogni tavola è costruita nella nostra fabbrica di 12.000 m² a Weihai, in Cina. Non esternalizziamo nulla: progettazione, materiali, saldatura, assemblaggio e collaudo avvengono tutti sotto lo stesso tetto, quindi la qualità non dipende mai da terzi.'
    - q: Come fanno i vostri prezzi a essere così tanto più bassi rispetto a quelli al dettaglio?
      a: Vendiamo l'eccedenza di magazzino e i lotti in liquidazione direttamente dal nostro stabilimento di produzione — senza intermediari, senza sovrapprezzo al dettaglio. Ciò significa pacchetti completi SUP con sconti fino al 60% rispetto ai prezzi al dettaglio abituali, con la stessa qualità testata sotto pressione.
    - q: Cosa è incluso con una scheda?
      a: 'Ogni SUP viene spedito come pacchetto completo: tavola, zaino da viaggio, pompa manuale, pagaia regolabile, pinna removibile, leash a spirale e kit di riparazione.'
    - q: Quanto velocemente vengono spediti gli ordini?
      a: Gli ordini in stock lasciano la nostra fabbrica di Weihai entro 2-3 giorni lavorativi con consegna tracciata in 50+ paesi in tutta l'UE, Nord America, Asia-Pacifico e oltre.
production_flow:
  tagline: Flusso di produzione
  title: Dal materiale alla scheda finita
  subtitle: Ogni scheda passa attraverso 6 fasi di produzione con punti di controllo qualità ad ogni passaggio. Nessuna scorciatoia, nessuna ispezione saltata.
  stages:
    - stage: '01'
      title: Ricezione Materiale e Controllo Qualità in Entrata
      description: Tutti i materiali in arrivo vengono registrati con numero di lotto/lotto nel nostro sistema ERP. Rotoli di tessuto PVC, nuclei drop-stitch, valvole, adesivi e componenti hardware sono messi in quarantena fino all'approvazione del controllo qualità.
      qc_check: Resistenza alla trazione, resistenza allo strappo, spessore, viscosità dell'adesivo, scansione dei difetti visivi
      qc_threshold: 100% dei lotti testati. Rifiutare se la resistenza alla trazione < 90% della specifica, lo strappo < minimo della specifica, o qualsiasi difetto visivo
      responsibility: Squadra QC in arrivo (3 ispettori)
    - stage: '02'
      title: CNC Taglio e Preparazione dei Materiali
      description: Il nesting ottimizzato dal computer dispone i pannelli sullo stock PVC per minimizzare gli sprechi. Le macchine da taglio CNC automatiche mantengono una precisione posizionale di 0,1 mm.
      qc_check: Controllo dimensionale rispetto ai file CAD DXF, ispezione della qualità dei bordi, verifica del conteggio dei pannelli
      qc_threshold: Ogni 20° pannello viene misurato. Tolleranza ±0,5 mm. Rifiutare il lotto se >2% fuori tolleranza
      responsibility: Responsabile del laboratorio di taglio
    - stage: '03'
      title: Saldatura e Drop-Stitch Incollaggio
      description: Drop-stitch i nuclei sono legati agli strati esterni PVC tramite laminazione a caldo. Le camere del tubo sono saldate a RF o saldate ad aria calda. Le fasce della rotaia sono unite a fusione a triplo strato.
      qc_check: Test di adesione ogni 50 unità, misurazione della larghezza di saldatura, revisione del registro della temperatura ad aria calda, ispezione visiva della cucitura sotto retroilluminazione
      qc_threshold: Forza di distacco min 8 N/cm. Tolleranza larghezza saldatura ±1 mm. Qualsiasi canalizzazione visibile = respingere
      responsibility: Controllo qualità della saldatura (2 ispettori per turno)
    - stage: '04'
      title: Montaggio e montaggio
      description: "Le schede passano all'assemblaggio finale dove tutti i componenti sono montati: valvole installate, anelli a D, maniglie, cassette a deriva e montaggio della borsa da trasporto. Ogni unità segue una checklist di assemblaggio di 100 punti."
      qc_check: Checklist di 100 punti per unità, test di funzione valvola (10 cicli di apertura/chiusura), verifica della coppia hardware, ispezione visiva
      qc_threshold: Politica senza difetti su elementi critici per la sicurezza (valvole, anelli in D, maniglie). Difetti cosmetici minori entro limiti estetici rigorosi
      responsibility: Controllo qualità della linea guida del team di assemblaggio +
    - stage: '05'
      title: Test di pressione e mantenimento della qualità
      description: Ogni camera viene gonfiata a una pressione nominale di 1,25× (tipicamente 20–25 PSI) e mantenuta per 24–48 ore. I sensori di pressione registrano continuamente. Le camere che superano il 5% di perdita di pressione vengono rifiutate e inviate per la riispezione delle giunzioni.
      qc_check: Registro di mantenimento della pressione 24h, calibrazione del sensore verificata quotidianamente, lettura della pressione compensata in temperatura, ritest della giuntura dopo la riparazione
      qc_threshold: Perdita massima di pressione del 5% su 24 ore a temperatura stabile. Qualsiasi camera che superi questo valore = 100% di ritest dell'intero lotto di produzione
      responsibility: Laboratorio di qualità (indipendente dalla produzione, riferimenti alla direzione)
    - stage: '06'
      title: Ispezione finale e imballaggio
      description: Ispezione visiva e funzionale finale. Difetti superficiali, coerenza del colore, verifica etichette/BIN, integrità dell'imballaggio e completezza degli accessori. Le unità sono confezionate sottovuoto, confezionate e palletizzate per il carico dei contenitori.
      qc_check: Ispezione visiva completa, checklist degli accessori per SKU ciascuno, test di caduta dell'imballaggio (1 m, campione casuale), verifica della scansione di etichette/codici a barre
      qc_threshold: Tolleranza zero per difetti di sicurezza. Difetti estetici entro limiti rigorosi. 100% delle unità ispezionate visivamente
      responsibility: Squadra finale QC (4 ispettori) + Capo squadra di imballaggio
workforce:
