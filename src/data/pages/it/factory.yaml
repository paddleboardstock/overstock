hero:
  tagline: Fabbrica
  title: Fabbrica & Produzione
  subtitle: 12.000 m² di produzione integrata — dalla materia prima all'imbarcazione finita
intro:
  - Come marchio di fabbrica dell'**Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock controlla ogni fase della produzione — dall'arrivo delle materie prime PVC e fibra di vetro all'ispezione finale pre-spedizione dell'imbarcazione finita. Il nostro impianto produttivo nella Zona di Sviluppo Economico di Qingdao si estende per 12.000 metri quadrati e ospita officine dedicate per taglio PVC, termosaldatura tubolari, produzione scafi RIB in fibra di vetro, stampa digitale SUP, assemblaggio finale e test qualità.
  - Integrando design, ingegneria, prototipazione, produzione e test sotto lo stesso tetto, eliminiamo le inefficienze della produzione conto terzi e manteniamo il controllo diretto sulla qualità costruttiva, la selezione dei materiali e i tempi di consegna. Ogni imbarcazione che lascia la nostra officina è costruita dalla nostra gente, sulle nostre attrezzature, secondo i nostri standard.
