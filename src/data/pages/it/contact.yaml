      icon: tabler:news
    - title: Telefono
      description: +1 279 732 3333 (HQ USA) · +86 13305324192 (fabbrica)
      icon: tabler:headset
    - title: Email
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: HQ globale e fatturazione
