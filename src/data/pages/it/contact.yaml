      description: Garanzia, riparazioni, ricambi e domande operative.
      icon: tabler:tool
    - title: Stampa e partnership
      description: Kit media, sponsorizzazioni e collaborazioni di settore.
      icon: tabler:news
    - title: Telefono
      description: '+1 279 732 3333 (sede USA) · +86 13305324192 (fabbrica)'
      icon: tabler:headset
    - title: Email
      description: info@aquafarer.com
      icon: tabler:mail
    - title: Sede globale e fatturazione
      description: Aquafarer LLC, Nuovo Messico, Stati Uniti
      icon: tabler:map-pin
