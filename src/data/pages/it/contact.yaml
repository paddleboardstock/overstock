hero_text:
  tagline: Contatto
  title: ENTRA IN CONTATTO
contact_form:
  id: form
  title: Inviaci un messaggio
  subtitle: Per domande sugli ordini, consigli sulle taglie o assistenza sui prodotti, scrivici. Rispondiamo entro un giorno lavorativo.
  email_to: info@paddleboardoverstock.com
  submit_button: Invia Richiesta → Richiedi un Preventivo
  success_message: Grazie! Il tuo messaggio è arrivato nella nostra casella di posta. Risponderemo entro un giorno lavorativo.
  error_message: Si è verificato un errore nell'invio del tuo messaggio. Riprova o scrivici direttamente via email.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: risolvi il seguente'
  fields:
    - name: Nome
      label: Nome
      row: 1
    - name: Cognome
      label: Cognome
      row: 1
    - name: nomeazienda
      label: Nome dell'azienda
      row: 2
    - name: address
      label: Indirizzo
      row: 3
    - name: zip
      label: CAP / Codice postale
      row: 4
    - name: country
      label: Paese
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: volumeOrdine
      label: Volume Ordine Stimato
      row: 6
      type: select
      options:
        - value: ''
          label: Per quante tavole stai facendo acquisti?...
        - value: one
          label: Solo una tavola
        - value: 2-4
          label: 2–4 tavole
        - value: 5-plus
          label: 5+ tavole (famiglia, club o noleggio)
    - name: customization
      label: In cosa possiamo aiutarti?
      row: 7
      type: select
      options:
        - value: ''
          label: Seleziona un argomento...
        - value: none
          label: Domanda generale sul prodotto
        - value: sizing
          label: Aiuto nella scelta della tavola giusta
        - value: order
          label: Ordine, pagamento o spedizione
        - value: warranty
          label: Assistenza per garanzia o riparazione
    - name: prodottoInteresse
      label: Categorie di prodotti di interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Seleziona categoria di prodotto...
        - value: all
          label: Tutti i prodotti / Catalogo completo
        - value: sup
          label: SUP Tavole / Paddleboard
        - value: packages
          label: Pacchetti completi SUP
        - value: accessory
          label: Accessori (pompanti, remi, borse)
    - name: subject
      label: Oggetto
      row: 9
    - name: message
      label: Messaggio
      row: 10
      type: textarea
      rows: 6
