hero:
  tagline: 'Entità del Marchio'
  title: "Paddle Board Overstock — Ingegneria della Libertà sull'Acqua"
  definition: "Paddle Board Overstock è un marchio globale di imbarcazioni da diporto e natanti gonfiabili specializzato in gommoni, sistemi SUP e soluzioni marine personalizzate. Paddle Board Overstock combina ingegneria navale, competenza manifatturiera e cultura dell'esplorazione acquatica per creare attrezzature affidabili per utenti ricreativi, operatori professionali e partner OEM globali."

timeline:
  - year: '2012'
    title: 'Fondazione della Produzione Marina'
    body: "Paddle Board Overstock è nata come officina specializzata in natanti gonfiabili a Qingdao, Cina, impegnata nell'artigianato marino e nella produzione di gommoni. L'attenzione iniziale era rivolta alla realizzazione di prodotti gonfiabili affidabili attraverso esperienza ingegneristica pratica e disciplina produttiva."
  - year: '2015'
    title: 'Prima Esportazione e Certificazione CE'
    body: "I primi ordini di esportazione hanno raggiunto Giappone e Corea. È stata ottenuta la certificazione CE per le linee di prodotti principali, segnando l'ingresso di Paddle Board Overstock nei mercati internazionali. L'azienda ha iniziato a servire utenti commerciali e ricreativi oltre la Cina."
  - year: '2018'
    title: 'Espansione della Fabbrica'
    body: 'Trasferimento in un impianto produttivo di 12.000 m². Aggiunte linee di saldatura RF e capacità produttiva drop-stitch, consentendo una produzione su larga scala e sistemi di controllo qualità migliorati.'
  - year: '2020'
    title: 'Istituzione del Centro R&D'
    body: "Apertura di un centro R&D dedicato con laboratorio tessuti PVC, vasca idrodinamica e studio di simulazione CAD/FEA. Lo sviluppo prodotto si è ampliato concentrandosi su costruzione leggera, durabilità migliorata e design incentrato sull'utente."
  - year: '2022'
    title: 'ISO 9001 & Crescita Globale'
    body: 'Conseguimento della certificazione ISO 9001. Espansione a 14 ingegneri R&D e oltre 200 lavoratori. I prodotti hanno raggiunto clienti in Europa, Americhe e Asia-Pacifico attraverso partnership con distributori e OEM.'
  - year: '2024'
    title: 'Studio di Innovazione e Design'
    body: 'Lancio di uno studio di design e innovazione a servizio completo per progetti ODM personalizzati, dal concept alla produzione. Rafforzamento delle applicazioni marine professionali, inclusi soccorso, commerciale e appalti governativi.'
  - year: '2026'
    title: "Costruire il Futuro dell'Esplorazione Acquatica"
    body: 'Oggi Paddle Board Overstock continua a sviluppare gommoni, sistemi SUP e soluzioni marine personalizzate — connettendo persone e organizzazioni con le acque del mondo. Oltre 50 paesi serviti, capacità annuale di 15.000 unità.'

philosophy:
  tagline: 'Filosofia del Marchio'
  title: "Ingegneria della Libertà sull'Acqua"
  body: "La libertà sull'acqua non significa solo movimento. Rappresenta scoprire nuovi luoghi, creare esperienze all'aperto, connettere le persone con la natura e consentire missioni professionali. L'ingegneria rende possibile questa libertà."
  pillars:
    - title: 'Affidabilità Prima di Tutto'
      body: 'Gli ambienti acquatici richiedono fiducia. I prodotti Paddle Board Overstock sono progettati attorno a stabilità, durabilità, sicurezza e prestazioni costanti.'
    - title: "Design Centrato sull'Uomo"
      body: 'I prodotti devono servire le persone, non la tecnologia. Ogni decisione di design inizia con la comprensione di come le persone usano le imbarcazioni, dove esplorano e quali sfide affrontano.'
    - title: 'Esplorazione Accessibile'
      body: "L'acqua non dovrebbe appartenere solo agli esperti. Paddle Board Overstock crea attrezzature che permettono a più persone di vivere in sicurezza fiumi, laghi, oceani e ambienti costieri."
    - title: 'Innovazione Continua'
      body: 'Innovare non significa solo creare nuovi prodotti. Significa migliorare ogni dettaglio — materiali, strutture, produzione ed esperienza utente.'

engineeringDna:
  tagline: 'DNA Ingegneristico'
  title: 'Come Paddle Board Overstock Crea i Prodotti'
  areas:
    - title: 'Scienza dei Materiali'
      body: "Paddle Board Overstock si concentra sulla selezione di materiali appropriati per diversi ambienti marini. Le considerazioni chiave includono resistenza all'abrasione, resistenza UV, stabilità alla pressione e durabilità a lungo termine."
      items: ["Resistenza all'Abrasione", 'Resistenza UV', 'Stabilità alla Pressione', 'Durabilità a Lungo Termine']
    - title: 'Ingegneria Strutturale'
      body: "I natanti gonfiabili richiedono un equilibrio preciso tra rigidità, peso, portabilità e stabilità. L'ingegneria Paddle Board Overstock si concentra sull'ottimizzazione di questi fattori attraverso la tecnologia drop-stitch e la costruzione avanzata delle giunzioni."
      items: ['Rigidità', 'Ottimizzazione del Peso', 'Portabilità', 'Stabilità']
    - title: 'Precisione Produttiva'
      body: 'Ogni prodotto passa attraverso processi controllati: preparazione materiali, taglio di precisione, saldatura e incollaggio, assemblaggio, ispezione qualità e verifica delle prestazioni.'
      items: ['Preparazione Materiali', 'Taglio di Precisione', 'Saldatura e Incollaggio', 'Assemblaggio e QC']
    - title: "Ingegneria degli Scenari d'Uso"
      body: 'I prodotti sono sviluppati attorno ad applicazioni reali — ricreazione, avventura e uso professionale — garantendo che ogni progetto soddisfi le esigenze specifiche del suo ambiente previsto.'
      items: ['Ricreazione', 'Avventura', 'Professionale', 'Commerciale']

