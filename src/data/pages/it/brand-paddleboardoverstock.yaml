trustSignals:
  tagline: 'Segnali di Fiducia'
  title: 'Perché Paddle Board Overstock è un Partner Affidabile'
  manufacturing:
    title: 'Capacità Produttiva'
    body: 'Impianto produttivo di 12.000 m² con 200-300 lavoratori qualificati e più di 14 ingegneri R&D. Sistema di gestione qualità certificato ISO 9001. Produzione annuale di 15.000 natanti gonfiabili che servono oltre 50 paesi.'
    stats:
      - label: 'Dimensione Impianto'
        value: '12.000 m²'
      - label: 'Forza Lavoro'
        value: '200-300'
      - label: 'Ingegneri R&D'
        value: '14+'
      - label: 'Capacità Annuale'
        value: '15.000'
  quality:
    title: 'Impegno per la Qualità'
    body: "Dall'ispezione dei materiali ai test finali, Paddle Board Overstock mantiene processi di qualità sistematici per fornire prodotti marini affidabili. Ogni unità viene sottoposta a test di pressione, ispezione delle giunzioni e verifica delle prestazioni prima della spedizione."
    items:
      - 'Certificato CE — 64 modelli rispettano gli standard di sicurezza europei'
      - ' — Sistema di gestione qualità certificato'
      - 'Certificato UKCA — Conformità al mercato del Regno Unito'
  global:
    title: 'Presenza Globale'
    body: 'Paddle Board Overstock serve clienti in molteplici mercati globali, supportando distributori, marchi outdoor e utenti marini professionali in oltre 50 paesi in Europa, Asia-Pacifico, Americhe, Medio Oriente e Africa.'

comparison:
  tagline: 'Posizionamento del Marchio'
  title: 'Paddle Board Overstock nel Mercato'
  position: 'Marchio di attrezzature marine ricreative ad orientamento ingegneristico che combina competenza nella produzione di gonfiabili con capacità OEM/ODM, soluzioni personalizzate e profonda esperienza manifatturiera.'
  strengths:
    - 'Competenza ingegneristica nei natanti gonfiabili'
    - 'Piena capacità produttiva OEM/ODM'
    - 'Sviluppo e design personalizzato dei prodotti'
    - 'Impianto produttivo ISO 9001 di 12.000 m²'
  bestFor:
    - 'Utenti ricreativi outdoor che cercano natanti gonfiabili affidabili'
    - 'Operatori marini che necessitano di attrezzature di grado commerciale'
    - 'Partner di marca che necessitano di produzione OEM/ODM'
    - 'Organizzazioni professionali di soccorso e pattugliamento'
