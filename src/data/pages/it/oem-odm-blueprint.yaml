faq:
  title: OEM/ODM — Domande Frequenti
  questions:
    - q: Qual è la quantità minima d'ordine (MOQ) per SUPs gonfiabili personalizzati?
      a: Per i modelli standard con stampi esistenti, MOQ inizia da 5–10 unità per design. Per stampi e utensili completamente personalizzati, MOQ è tipicamente di 200 unità. Lavoriamo con startup e marchi emergenti per trovare punti di ingresso fattibili.
    - q: Quanto tempo richiede il processo del campione OEM?
      a: I campioni prototipo standard vengono completati entro 7–14 giorni lavorativi dopo l'approvazione del progetto. Gli ordini urgenti possono essere prioritizzati a 5–7 giorni con un costo aggiuntivo.
    - q: Qual è la differenza tra PVC e Hypalon per le barche gonfiabili?
      a: PVC è più leggero, più economico e offre un'ottima flessibilità a freddo. Hypalon (CSM) fornisce una superiore resistenza a UV e all'ozono con una vita utile più lunga (10–15 anni contro 5–8 anni). Raccomandiamo PVC per la maggior parte delle applicazioni ricreative e Hypalon per uso commerciale/professionale.
    - q: Puoi personalizzare la forma e il design del gonfiabile?
      a: Sì. Il nostro team di R&S può sviluppare stampi personalizzati per qualsiasi forma dello scafo, profilo della tavola o configurazione del tubo. Utilizziamo stampi in alluminio lavorati a macchina CNC per precisione e costanza.
    - q: Fornite servizi di audit aziendale?
      a: Accogliamo audit di fabbrica in loco e da terze parti presso la nostra struttura di 12.000 m² a Qingdao. Manteniamo le certificazioni ISO 9001 e BSCI e possiamo condividere i rapporti di audit previa NDA.
    - q: Quali condizioni di spedizione offrite?
      a: Offriamo termini di spedizione FOB Qingdao (standard), CIF e DDP. Il carico dei container e tutta la documentazione di esportazione sono inclusi in tutti gli ordini OEM.
content_profiles:
  tagline: Profili del marchio
  title: OEM / Produzione a Marchio Privato<br />Per Tipo di Cliente
  subtitle: 'I diversi profili di marca hanno requisiti distinti: adattiamo i nostri servizi OEM/ODM per corrispondere al modello di business, alla scala e alla strategia di go-to-market della tua azienda.'
  items:
    - title: Marchi di Imbarcazioni Startup
      subtitle: Basso MOQ, aumento rapido
      description: Imprenditori e fondatori che lanciano la loro prima linea di SUPs, kayak o barche gonfiabili. Avete bisogno di un partner di produzione che tratti il vostro marchio come il proprio — con basse soglie di ingresso, dimensioni dei lotti flessibili e guida pratica al design in ogni fase del processo.
      features:
        - MOQ solo 50–100 unità per SKU, non migliaia
        - Libreria di stampi preesistente per evitare i costi di attrezzatura
        - 'Pacchetto completo di branding: logo, grafiche per tubi, confezioni, etichette appendibili'
        - Workflow di esempio-primo — approvare prima della produzione
    - title: Marchi Marine Consolidati
      subtitle: OEM scala con conformità CE/ISO
      description: Marchi esistenti di barche, PWC o accessori marini che aggiungono mezzi d'acqua gonfiabili al loro portfolio. Avete bisogno di una qualità costante tra i cicli di produzione, conformità normativa per i mercati globali e la capacità di co-progettare scafi o forme di tubi personalizzati.
      features:
        - Progettazione di stampi 3D su misura per design proprietari
        - CE 2013/53/UE, UKCA, documentazione di conformità USCG
        - Rapporti di audit sociale BSCI per la conformità dei rivenditori
        - Gestione account dedicata + slot di produzione prioritari
    - title: Marchi DTC e di E-Commerce
      subtitle: Packaging pronto per il commercio al dettaglio su larga scala
      description: Marchi online-first che vendono tramite Amazon, Shopify o i propri negozi online. Il packaging, l'esperienza di unboxing e la qualità costante delle unità sono fondamentali. Hai bisogno di una fabbrica che comprenda le dinamiche di velocità e tasso di reso dell'e-commerce.
      features:
        - Design della scatola pronto per la vendita al dettaglio + stampa della scheda inserita
        - Confezionamento sottovuoto / pallettizzazione per una spedizione conveniente
        - Codice a barre EAN / UPC e documentazione pronta per la dogana
        - Consolidamento di contenitori misti per ottimizzare il costo all'arrivo
    - title: Marchi di Stile di Vita e Outdoor
      subtitle: Design white-label + estensione della categoria
      description: Abbigliamento, attrezzatura per esterni o marchi di viaggio che entrano nella categoria degli sport acquatici sotto il proprio marchio. Potresti non avere competenze di ingegneria marina internamente — quindi hai bisogno di un partner che possa guidarti dal concetto al container con il minimo attrito.
      features:
        - Ricerca di tendenze e mood board concettuali
        - Edizioni limitate co-branded e varianti di colore stagionali
        - Ciclo da progetto a campione in 10–14 giorni lavorativi
        - 'Logistica end-to-end: fabbrica → magazzino → consumatore'
