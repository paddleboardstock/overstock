process_steps:
  title: Processo a 6 fasi OEM/ODM
  subtitle: Dal brief di progettazione al FOB Qingdao — un flusso di lavoro snello
  steps:
    - number: '01'
      title: Brief di progettazione e modellazione CAD 3D
      description: Condividi le tue specifiche di riferimento, il prodotto di riferimento o il concetto. Il nostro team di ingegneri sviluppa disegni CAD dettagliati e rendering 3D per la tua approvazione.
      timeline: 3–5 giorni
    - number: '02'
      title: Selezione dei materiali e prova dei tessuti
      description: Scegli tra tessuti di grado militare PVC (0,9–1,2 mm), Hypalon CSM, o drop-stitch core. Eseguiamo test di resistenza alla trazione, adesione del rivestimento e stabilità UV.
      timeline: 2–3 giorni
    - number: '03'
      title: Prototipazione Rapida e Produzione di Campioni
      description: Realizziamo stampi su misura tramite macchina CNC e produciamo campioni pre-produzione con i colori del tuo brand, il logo e i materiali specificati. I campioni vengono spediti per la tua approvazione.
      timeline: 7–14 giorni
    - number: '04'
      title: Test di tenuta ad alta pressione 24–48 ore
      description: Ogni prototipo viene sottoposto a rigorosi test di mantenimento della pressione a 1,25 volte la pressione nominale. Vengono eseguiti test di sbucciamento delle cuciture e verifiche dimensionali.
      timeline: 1–2 giorni
    - number: '05'
      title: Controllo di qualità e confezionamento CE/ISO
      description: Checklist di qualità a 100 punti. Ogni unità viene ispezionata prima dell'imballaggio pronto per la vendita. Dichiarazione di conformità CE e rapporto di conformità BSCI inclusi.
      timeline: 2–3 giorni
    - number: '06'
      title: Spedizione e Logistica FOB Qingdao
      description: Prodotti finiti palletizzati, avvolti in film retrattile e caricati in container al porto di Qingdao. Documentazione completa per l'esportazione, sdoganamento e tracciamento in tempo reale.
      timeline: 7–14 giorni
