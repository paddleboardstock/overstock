materials:
  intro_p1: Le prestazioni, la durata e la sicurezza di un'imbarcazione gonfiabile dipendono quasi interamente dai materiali utilizzati nella sua costruzione. Dal tessuto che forma i tubolari ai fili che danno rigidità a una tavola SUP, ogni scelta dei materiali influisce sulle prestazioni del prodotto in acqua e sulla sua durata.
  intro_p2: 'Questa guida analizza i quattro materiali principali utilizzati nelle imbarcazioni gonfiabili moderne: il tessuto in PVC, la gomma Hypalon CSM, la costruzione con nucleo drop-stitch e i ponti in schiuma EVA. Comprendere questi materiali vi aiuterà a scegliere il prodotto giusto per le vostre esigenze e a mantenerlo per massimizzarne la durata.'
  labels:
    advantages: Vantaggi
    limitations: Limitazioni
    best_for: 'Ideale per:'
  items:
    - name: PVC (cloruro di polivinile)
      summary: Lo standard di settore per gommoni e SUP ricreativi. Il tessuto laminato multistrato offre un eccellente rapporto resistenza-peso a un prezzo accessibile.
      pros:
        - Economico — 30-50 % più economico dell'Hypalon
        - Leggero e facile da maneggiare
        - Buona resistenza ai raggi UV con i rivestimenti adeguati
        - Ampia gamma di colori e finiture
        - Facile da riparare con toppe in PVC e adesivo a solvente
      cons:
        - Durata più breve dell'Hypalon (7-10 anni)
        - Meno flessibile a basse temperature
        - Minore resistenza chimica
        - Può sviluppare migrazione dei plastificanti nel tempo
      best_for: SUP ricreativi, gommoni economici, flotte a noleggio, uso stagionale, acque dolci e ambienti costieri.
    - name: Hypalon (gomma CSM)
      summary: Materiale in gomma sintetica premium noto per la durata eccezionale, la resistenza ai raggi UV e la longevità. Il punto di riferimento per i gommoni commerciali e di grado militare.
      pros:
        - Resistenza eccezionale a raggi UV e ozono
        - Durata di 15-20 anni con le cure adeguate
        - Eccellente flessibilità a basse temperature
        - Superiore resistenza a sostanze chimiche e oli
        - Mantiene il colore più a lungo del PVC
      cons:
        - Sensibilmente più costoso del PVC
        - Tessuto più pesante
        - Meno opzioni di colore
        - Le riparazioni richiedono adesivi specializzati
        - Meno stabilimenti produttivi nel mondo
      best_for: RIB commerciali, ricerca e soccorso, applicazioni militari, climi tropicali, proprietà di flotta a lungo termine.
    - name: Nucleo drop-stitch
      summary: La tecnologia che ha rivoluzionato i SUP gonfiabili. Migliaia di fili di poliestere collegano gli strati superiore e inferiore del tessuto, consentendo il gonfiaggio ad alta pressione per prestazioni degne di una tavola rigida.
      pros:
        - Estremamente rigido a 12-20 PSI
        - Leggero — 18-30 lbs per una tavola di grandi dimensioni
        - Si piega piatto per lo stoccaggio e i viaggi
        - Eccellente resistenza agli urti
        - Prestazioni costanti in tutti gli intervalli di temperatura
      cons:
        - Richiede una pompa ad alta pressione
        - Riparazione delle forature più complessa rispetto al singolo strato
        - Costo di produzione più elevato rispetto ai gonfiabili standard
        - La perdita di pressione nel tempo richiede ricariche periodiche
      best_for: Tavole di stand-up paddle, kayak, ponti ad aria per gommoni, qualsiasi applicazione che richieda prestazioni rigide con portabilità gonfiabile.
    - name: Ponte in schiuma EVA
      summary: Schiuma EVA a celle chiuse (etilene-vinil acetato) utilizzata per i pad di trazione su tavole SUP e ponti di imbarcazioni. Fornisce ammortizzazione, aderenza e isolamento termico.
      pros:
        - Eccellente aderenza antiscivolo, bagnata o asciutta
        - L'ammortizzazione riduce l'affaticamento nelle pagaiate lunghe
        - Isolamento termico dalla superficie fredda del ponte
        - Resistente a raggi UV e acqua salata
        - Disponibile in composizioni multicolore e design incisi al laser
      cons:
        - Può usurarsi con un uso intensivo dopo 2-3 anni
        - Deve essere incollata correttamente per evitare la delaminazione
        - Non strutturale — non influisce sulla rigidità
        - Aggiunge un leggero peso (200-400 g per tavola)
      best_for: Trazione del ponte SUP, rivestimento del ponte dell'imbarcazione, comfort del sedile del kayak, qualsiasi superficie che richieda un appoggio antiscivolo.
  selection:
    title: Guida alla scelta dei materiali
    subtitle: 'Scegliete il materiale giusto in base all''uso principale:'
    headers:
      - Uso
      - Materiale consigliato
      - Perché
    rows:
      - - SUP ricreativo
        - PVC drop-stitch
        - Leggero, rigido ed economico — l'equilibrio ideale per i pagaiatori occasionali
      - - Gommone familiare / barca da lago
        - PVC (1100 denier)
        - Conveniente, facile da riparare e con durabilità sufficiente per l'uso ricreativo
      - - RIB commerciale / pattugliatore
        - Hypalon CSM
        - Massima resistenza ai raggi UV, durata di 15-20 anni, resistenza a sostanze chimiche e oli
      - - Flotta di tavole SUP a noleggio
        - PVC drop-stitch + ponte EVA
        - Duraturo, riparabile e con buon rapporto qualità-prezzo per un uso intensivo
      - - Operazioni di ricerca e soccorso
        - Hypalon CSM
        - Affidabilità in condizioni estreme, flessibilità a freddo, resistenza chimica
      - - Kayak da touring / spedizione
        - PVC drop-stitch
        - Prestazioni rigide con portabilità pieghevole per i viaggi
  deep_dive:
    title: Guide approfondite
    topics:
      - title: PVC di grado marino
        desc: Tessuto PVC laminato multistrato — resistenza ai raggi UV, test di abrasione e valori denier spiegati.
      - title: PVC vs Hypalon
        desc: Il confronto definitivo tra i due materiali dominanti dei gommoni — costi, durata e resistenza ai raggi UV.
      - title: Nucleo drop-stitch
        desc: Come migliaia di fili interni creano strutture gonfiabili rigide ad alta pressione a 12-15 PSI.
      - title: Tecnologia di saldatura RF
        desc: La saldatura ad alta frequenza crea cuciture forti e uniformi — come funziona e perché è importante.
      - title: PSI e prestazioni
        desc: Perché la pressione dell'aria conta per SUP e gommoni — rigidità, capacità di carico e qualità di navigazione.
      - title: Test di qualità
        desc: Test di pressione, test di galleggiabilità, invecchiamento UV e test distruttivi — il nostro processo di qualità.
      - title: Ponti in schiuma EVA
        desc: Pad in schiuma EVA a celle chiuse — trazione, comfort e durata per i ponti di SUP e imbarcazioni.
      - title: Cura dei materiali
        desc: Pulizia, protezione UV, prevenzione della muffa e buone pratiche di conservazione dei prodotti gonfiabili.
