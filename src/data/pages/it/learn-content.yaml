articles:
  sup:
    - title: SUP Basi — Guida per Principianti
      desc: Tutto ciò che un principiante deve sapere — tipi di tavole, dimensioni della pagaia, postura e consigli per il primo giorno.
    - title: SUP Guida alle dimensioni
      desc: Trova la lunghezza, larghezza e volume della tavola giuste per il tuo peso, abilità e stile di pagai.
    - title: Gonfiabile vs Tavola rigida
      desc: Quale è il più adatto a te? Portabilità, prestazioni, durata e costo confrontati.
    - title: Tecniche Intermedie
      desc: Migliora la tua pagaia con colpi avanzati, tecniche di virata e gestione delle acque mosse.
    - title: Come scegliere un gonfiabile SUP
      desc: Affronta i fattori chiave — costruzione, spessore, configurazione delle alne e accessori inclusi.
    - title: Sicurezza in acqua
      desc: Conoscenze essenziali sulla sicurezza, tra cui lettura del meteo, PFD selezione, auto-salvataggio e pagaiate di gruppo.
  inflatable-boat:
    - title: Riferimento dei materiali
      desc: Drop-stitch Nuclei, PVC laminati, EVA schiuma per deck e classificazioni denier — capisci di cosa è fatta la tua tavola.
    - title: EVA Arte del Deck Spiegata
      desc: Come i blocchi multi-colore EVA vengono fustellati e assemblati a mano in opere d'arte per mazzi con prestazioni cromatiche durature.
    - title: Drop-Stitch Core Spiegato
      desc: Come migliaia di filettature interne creino una piattaforma rigida a 15 PSI per un gonfiabile ad alte SUPs prestazioni.
    - title: Panoramica della tecnologia gonfiabile
      desc: Come vengono costruite le paddle board gonfiabili — dal deposito di materiali ai sistemi di valvole e alla saldatura delle cuciture.
    - title: Costruzione di rotaie e giunture
      desc: Come le fasce a triplo strato e le giunture saldate RF mantengono la tavola ermetica a piena pressione.
    - title: Perché 15 PSI Conta
      desc: Come la pressione dell'aria sblocca le prestazioni rigide e rigide di un gonfiabile ripiegabile.
  water-safety:
    - title: Guida alla sicurezza sull'acqua
      desc: Conoscenze essenziali sulla sicurezza per ogni pagaiatore — meteo, PFD, auto-soccorso e protocolli di pagaiata di gruppo.
    - title: Gilet di salvataggio e PFD guida
      desc: Come scegliere il dispositivo personale giusto per il paddle board in piedi — valutazioni di galleggiamento, adattamento e comfort.
    - title: SUP Lista di controllo per la sicurezza
      desc: Checklist di sicurezza pre-lancio che ogni praticante di paddle board in piedi dovrebbe seguire prima di entrare in acqua.
    - title: Sicurezza nella pagaiata in acqua fredda
      desc: Precauzioni, attrezzature e tecniche essenziali per remare in condizioni di acqua fredda.
    - title: Errori di pagaiata da principiante
      desc: Errori comuni che commettono i pagaiatori alle prime armi e come evitarli per un'esperienza più sicura e piacevole.
    - title: Guinzaglio e PFD Regole di Sicurezza
      desc: Quando il guinzaglio è essenziale, quali PFD tipi funzionano per SUP, e l'equipaggiamento di sicurezza che ogni pagaiatore dovrebbe portare con sé.
