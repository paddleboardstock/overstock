articles:
  sup:
    - title: Basi del SUP — Guida per principianti
      desc: 'Tutto quello che un principiante deve sapere: tipi di tavole, misura della pagaia, posizione e consigli per il primo giorno.'
    - title: Guida alle misure SUP
      desc: Trova la lunghezza, la larghezza e il volume giusti in base al tuo peso, al tuo livello e al tuo stile di pagaiata.
    - title: SUP gonfiabile vs tavola rigida
      desc: Quale fa per te? Portabilità, prestazioni, durata e costi a confronto.
    - title: Tecniche intermedie
      desc: Migliora la tua pagaiata con colpi avanzati, tecniche di virata e gestione di acque mosse.
    - title: Come scegliere un SUP gonfiabile
      desc: 'I fattori chiave: costruzione, spessore, configurazione delle derive e accessori inclusi.'
    - title: Sicurezza in acqua
      desc: 'Conoscenze essenziali di sicurezza: lettura del meteo, scelta del giubbotto salvagente (PFD), autorescat e pagaiata di gruppo.'
  inflatable-boat:
    - title: Riferimento materiali
      desc: 'PVC, Hypalon, drop-stitch, denier: capisci di cosa è fatto il tuo gommone.'
    - title: PVC vs Hypalon
      desc: 'Il confronto definitivo tra tessuti in PVC e Hypalon per gommoni: durata, resistenza ai raggi UV e costi.'
    - title: Nucleo drop-stitch spiegato
      desc: Come migliaia di fili interni creano una piattaforma rigida a 12-15 PSI per SUP gonfiabili ad alte prestazioni.
    - title: Panoramica della tecnologia gonfiabile
      desc: 'Come vengono costruiti gommoni e SUP gonfiabili: dalla stratificazione dei materiali ai sistemi di valvole e alla saldatura delle cuciture.'
    - title: Guida ai gommoni a scafo rigido (RIB)
      desc: Tutto sulla costruzione dei RIB, i tipi di scafo, i materiali dei tubolari e la scelta del RIB giusto per le tue esigenze.
    - title: Gommone vs RIB
      desc: Le differenze chiave tra i gommoni tradizionali e i gommoni a scafo rigido per i diversi usi.
  water-safety:
    - title: Guida alla sicurezza in acqua
      desc: 'Conoscenze essenziali di sicurezza per ogni pagaiatore: meteo, giubbotti salvagente (PFD), autorescat e protocolli di pagaiata di gruppo.'
    - title: Guida a giubbotti salvagente e PFD
      desc: Come scegliere il dispositivo di galleggiamento giusto per SUP, kayak, imbarcazioni e uso professionale.
    - title: Checklist di sicurezza SUP
      desc: La checklist pre-varco che ogni praticante di paddle boarding dovrebbe seguire.
    - title: Sicurezza della pagaiata in acque fredde
      desc: Precauzioni, attrezzatura e tecniche essenziali per pagaiare in acque fredde.
    - title: Errori dei principianti nella pagaiata
      desc: Gli errori comuni di chi pagai per la prima volta e come evitarli per un'esperienza più sicura e piacevole.
    - title: Certificazione CE spiegata
      desc: 'Cosa significa la certificazione CE per le imbarcazioni gonfiabili: standard, test e perché è importante per la sicurezza.'
