materials:
  intro_p1: Le prestazioni, la durata e la sicurezza di una tavola gonfiabile dipendono quasi interamente dai materiali utilizzati nella sua costruzione. Dal laminato che forma lo scafo alle filettature che conferiscono rigidità alla SUP tavola, ogni scelta di materiale influenza le prestazioni del prodotto sull'acqua e quanto dura.
  intro_p2: 'Questa guida copre i tre materiali principali utilizzati nelle moderne tavole gonfiabili da paddle: il PVC laminato, drop-stitch il nucleo e EVA il supporto in schiuma. Comprendere questi materiali ti aiuterà a scegliere la tavola giusta per le tue esigenze e a mantenerla per la massima durata di vita.'
  labels:
    advantages: Vantaggi
    limitations: Limitazioni
    best_for: 'Meglio per:'
  items:
    - name: PVC (cloruro di polivinile)
      summary: Lo standard del settore per il tessuto SUPs gonfiabile . Il tessuto laminato multistrato offre un eccellente rapporto resistenza/peso a un prezzo accessibile.
      pros:
        - Ottimo rapporto qualità-prezzo
        - Leggero e facile da maneggiare
        - Buona UV resistenza con i rivestimenti adeguati
        - Ampia gamma di colori e finiture
        - Facile da riparare con PVC cerotti e adesivo solvente
      cons:
        - Durata di vita tipica di 7-10 anni con cure adeguate
        - Meno flessibili a temperature fredde
        - Minore resistenza chimica
        - Può sviluppare la migrazione del plastificante nel tempo
      best_for: Attività ricreative e SUPs turistiche, pagaiate in famiglia, uso stagionale, ambienti d'acqua dolce e costiera.
    - name: Drop-Stitch Nucleo
      summary: La tecnologia che ha rivoluzionato SUPs il gonfiabile . Migliaia di fili di poliestere collegano gli strati superiori e inferiori del tessuto, permettendo un gonfiaggio ad alta pressione per prestazioni rigide e rigide.
      pros:
        - Estremamente rigido a 12-20 PSI anni
        - Leggero — 18-30 libbre per tavola a grandezza naturale
        - Si piega completamente per il trasporto e lo stoccaggio
        - Eccellente resistenza agli urti
        - Prestazioni costanti in tutte le gamme di temperatura
      cons:
        - Richiede pompa ad alta pressione
        - La riparazione delle forature è più complessa rispetto a un singolo strato
        - Costo di produzione superiore rispetto agli gonfiabili standard
        - La perdita di pressione nel tempo richiede rabbocco periodico
      best_for: Tavole da stand-up paddle e qualsiasi attrezzatura che necessita di prestazioni rigide con portabilità gonfiabile.
    - name: EVA Coperta in schiuma
      summary: Schiuma a cellule chiuse EVA (etilene-vinil acetato) utilizzata per i tappetini antiscivolo sulle tavole SUP. Fornisce ammortizzazione, presa e isolamento termico — e ospita i design della serie artistica.
      pros:
        - Eccellente presa antiscivolo sia bagnata che a secco
        - L'ammortizzazione riduce l'affaticamento durante le lunghe pagaie
        - Isolamento termico dalla superficie fredda della tavola
        - UV e resistente all'acqua salata
        - Disponibile con blocchi di colore multiplo e design incisi al laser
      cons:
        - Può usurarsi con uso intenso in 2-3 anni
        - Deve essere correttamente incollata per prevenire la delaminazione
        - Non strutturale — non influisce sulla rigidità
        - Aggiunge leggero peso (200-400 g per tavola)
      best_for: SUP trazione sulla coperta, design della coperta della serie artistica e qualsiasi superficie che necessita di calpestio antiscivolo.
  selection:
    title: Guida alla selezione dei materiali
    subtitle: 'Scegli il materiale giusto in base al tuo uso principale:'
    headers:
      - Caso d'uso
      - Materiale raccomandato
      - Perché
    rows:
      - - Pagaia ricreativa SUP
        - Drop-stitch PVC
        - Leggero, rigido, conveniente — equilibrio ideale per i pagaiatori occasionali
      - - Pagaia per famiglie e principianti
        - Largo drop-stitch PVC (32")+
        - Stabile e indulgente — fiducia per i pagaiatori alle prime armi
      - - Pesca e pagaiate con pesante attrezzatura
        - Ampia drop-stitch PVC con EVA copertura completa
        - Stabilità extra per stare in piedi e per lanciare, alto volume per l'attrezzatura
      - - Tavole di flotte a noleggio SUP
        - Drop-stitch PVC + EVA Ponte
        - Durevole, riparabile, buon rapporto qualità-prezzo per un uso ad alto turnover
      - - Turismo e pagaie più lunghe
        - Drop-stitch PVC (~11 piedi)
        - Migliore tracciamento e efficienza di planata per la distanza
      - - Yoga e canoa fitness
        - Ampia drop-stitch PVC con EVA copertura completa
        - Piattaforma stabile e confortevole per posizioni ed allenamenti
  deep_dive:
    title: Guide per immersioni approfondite
    topics:
      - title: Grado PVC Marine
        desc: Tessuto laminato PVC multistrato — UV spiegazione di resistenza, test di abrasione e classificazioni denier.
      - title: PVC Strati di laminato
        desc: Come il laminato PVC multistrato bilancia resistenza, peso e UV resistenza.
      - title: Drop-Stitch Nucleo
        desc: Come migliaia di filettature interne creino strutture rigide e gonfiabili ad alta pressione a 15 PSI.
      - title: Tecnologia di saldatura RF
        desc: La saldatura ad alta frequenza crea giunture forti e coerenti — come funziona e perché è importante.
      - title: PSI & Prestazioni
        desc: "Perché la pressione dell'aria è importante per il SUPs gonfiabile: rigidità, capacità di peso e qualità della guida."
      - title: Controllo di qualità
        desc: Test di pressione, test di galleggiamento, UV invecchiamento e test distruttivi — il nostro processo di qualità.
      - title: EVA Ponti in schiuma
        desc: EVA Supporti per terrazze in schiuma a celle chiuse — trazione, comfort e durabilità per SUP i deck.
      - title: Cura dei materiali
        desc: Pulizia, UV protezione, prevenzione della muffa e migliori pratiche di conservazione per prodotti gonfiabili.
