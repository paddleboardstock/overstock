hero:
  tagline: Indonesia
  title: SUP Schede all'ingrosso per<br />Imprese indonesiane
  subtitle: Negozi di sport acquatici a Bali, resort insulari e operatori in tutto l'arcipelago — nuove tavole di scorta da 5 unità, modelli misti, spedite dalla Cina.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Pannelli di scorte per resort indonesiani e negozi di sport acquatici di Bali
direct_answer: Paddle Board Overstock fornisce tavole gonfiabili nuove di SUP zecca a negozi indonesiani — negozi di sport acquatici a Bali, resort insulari da Lombok a Gillis e oltre, beach club e operatori di noleggio. Gli ordini all'ingrosso partono da 5 tavole con modelli misti in un'unica spedizione, inviate da Weihai, Cina, tramite trasporto aereo espresso o trasporto marittimo consolidato. Ogni tavola è testata al 100% a pressione e coperta dalla garanzia di 2 anni SUP .
tldr_points:
  - All'ingrosso da 5 schede — modelli misti, prezzati in base alla quantità totale
  - Al servizio dell'economia degli sport acquatici e dei resort insulari di Bali in tutto il paese
  - Brevi rotte merci Cina–Indonesia, aeree o marittime
  - 100% testata a pressione, garanzia di 2 SUP anni su ogni scheda
overview_section:
  tagline: Panoramica del mercato
  title: Il mercato indonesiano SUP
  paragraphs:
    - L'Indonesia è una delle grandi economie degli sport acquatici asiatici, e Bali ne è il cuore battente. Dai beach club di Seminyak e Canggu alle tranquille lagune di Sanur e Nusa Dua, le tavole di paddle appaiono ovunque — pagaie all'alba sopra le barriere coralline, SUP lezioni di yoga, tour alle lagune e programmi per gli ospiti degli hotel. Oltre Bali, Lombok, le isole Gili e le scene turistiche in crescita nell'arcipelago seguono lo stesso schema.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: Durabilità UV , prestazioni e riparabilità contano più della lucentezza del catalogo. Gli ordini sono da 5 a 20 tavole, miscelati per lezioni, noleggio e esposizione al dettaglio.
  customer_types:
    - title: Negozi di sport acquatici di Bali
      description: Operatori di Sanur, Seminyak e Canggu hanno contribuito SUP a linee di surf, immersione e snorkeling.
    - title: Resort sull'Isola e Località Beach-Club
      description: Resort e beach club a Bali, Lombok e Gillis organizzano programmi di paddle e yoga per gli SUP ospiti.
    - title: Tour & Rental Operator
      description: Operatori turistici di lagune e mangrovie e stand di noleggio orario rinfrescano le flotte stagionalmente.
shipping_section:
  title: Nave per l'Indonesia
  paragraphs:
    - L'Indonesia è una delle rotte merci più brevi dalla nostra base di Weihai, in Cina. Il trasporto aereo espresso trasporta campioni e 1–3 ordini di imbarco velocemente verso Denpasar e Jakarta; Consolidated Sea Freight serve da 5 a 20 ordini all'ingrosso tramite Tanjung Priok, Tanjung Benoa e altri porti. Entrambe le opzioni sono indicate con tempi di transito stimati per la destinazione.
    - Forniamo le fatture commerciali e i requisiti di sgombero della lista di imballaggio, con codici HS corretti e valori dichiarati. Dazi e tasse d'importazione sono dovuti dall'importatore secondo le regole indonesiane.
  customs_note: La autorizzazione indonesiana, per le attrezzature sportive, è sensibile alla documentazione — collabora con il tuo broker doganale (PPJK) per confermare il trattamento attuale dei dazi e delle tasse. Forniamo documenti completi e coerenti e rispondiamo rapidamente alle richieste dei broker.
faq_section:
  title: FAQ sull'Indonesia
  items:
    - q: Quanto è veloce il trasporto merci dalla Cina a Bali?
      a: L'Indonesia è una delle nostre destinazioni di trasporto più vicine da Weihai. L'aereo espresso verso Denpasar o Jakarta è l'opzione più veloce per campioni e piccoli ordini; il trasporto marittimo consolidato è preventivato con una finestra di transito per gli ordini all'ingrosso. Entrambi sono dettagliati nel tuo preventivo.
    - q: Le tavole sono adatte all'uso quotidiano a noleggio in UV tropicali?
      a: Sì — drop-stitch PVC la costruzione è quella che forniamo alle flotte in 50 paesi con licenza per i cicli di noleggio+ giornaliero. La cura standard (risciacquo dopo acqua salata, conservazione all'ombra) li mantiene in servizio durante molte stagioni del sole di Bali.
    - q: Com'è un ordine di un negozio di sport acquatici?
      a: Tipicamente 5–15 tavole miste tra modelli stabili e versatili per lezioni e noleggi e alcune edizioni artistiche premium per esposizione al dettaglio — una spedizione, prezzo basato sulla quantità totale.
    - q: Potete supportare il nostro PPJK con la documentazione?
      a: Sì. Ogni ordine viene spedito con fattura commerciale e lista di imballaggio con codici HS corretti e valori dichiarati, e rispondiamo rapidamente quando il vostro broker necessita di documenti aggiuntivi.
