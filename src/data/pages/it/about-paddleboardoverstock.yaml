hero:
  tagline: Chi siamo
  title: Chi è {SITE}
  subtitle: Un produttore di articoli sportivi acquatici verticalmente integrato — dalla materia prima all'imbarcazione finita
intro:
  - "Paddle Board Overstock è stata fondata nel 2012 con una missione: progettare e produrre attrezzature per sport acquatici che funzionano tanto bene sull'acqua quanto nel rapporto di qualità. Quello che è iniziato come un laboratorio specializzato di tavole SUP è cresciuto fino a diventare un impianto di produzione integrato di 12.000 metri quadrati nella zona di sviluppo economico di Qingdao, producendo gommoni, RIB, kayak, tavole SUP, attrezzature di sicurezza e accessori per clienti in oltre 50 paesi."
  - Oggi Paddle Board Overstock opera come marchio di fabbrica — progettiamo, sviluppiamo, prototipiamo, produciamo e testiamo tutto sotto lo stesso tetto. Questa integrazione verticale ci dà il controllo diretto sulla selezione dei materiali, sulla qualità costruttiva e sui tempi di consegna. Ogni imbarcazione è costruita dalla nostra gente, sulle nostre attrezzature, secondo i nostri standard.
  - Serviamo utenti ricreativi, operatori commerciali, agenzie governative e partner di marca in tutto il mondo. I nostri programmi OEM e ODM aiutano le aziende a lanciare le proprie linee di prodotti senza investire in infrastrutture di fabbrica. Che tu abbia bisogno di un singolo prototipo o di una serie di produzione completa, il nostro team ti guida dal concept alla consegna pronta per il mare.
