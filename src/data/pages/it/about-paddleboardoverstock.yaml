values:
  - title: Qualità prima di tutto
    desc: Ogni imbarcazione che lascia la nostra fabbrica supera test obbligatori di ritenzione d'aria, pelatura delle giunture e verifica dei sistemi prima della spedizione.
  - title: Integrazione verticale
    desc: Controlliamo ogni fase — dal taglio del PVC all'assemblaggio finale — eliminando le inefficienze dei subappaltatori e garantendo una qualità costante.
  - title: Sicurezza come standard
    desc: La certificazione CE è al centro di ciò che costruiamo. I nostri 64 modelli certificati CE soddisfano gli standard di sicurezza UE per uso ricreativo e commerciale.
  - title: Centrato sul partner
    desc: Costruiamo relazioni a lungo termine con partner OEM, ODM e private label attraverso trasparenza, affidabilità e crescita condivisa.
services:
  - title: Produzione OEM
    desc: Produciamo secondo le vostre specifiche. Condividete i vostri disegni e il nostro team di ingegneria si occupa di prototipazione, attrezzaggio e produzione.
  - title: Soluzioni ODM
    desc: Partite dalle nostre piattaforme di design collaudate. Personalizzate dimensioni, colore, grafica e imballaggio per creare la vostra linea di prodotti unica.
  - title: Private Label
    desc: Il vostro marchio, il vostro logo, il vostro imballaggio. I prodotti arrivano pronti per la vendita con piena integrazione del marchio.
  - title: Branding personalizzato
    desc: Stampa del deck, grafica dello scafo, decalcomanie per tubi ed etichette personalizzate — presenza coerente del marchio su ogni superficie.
certifications:
  - name: Certificazione CE
    desc: Le nostre barche e imbarcazioni sono conformi alla Direttiva UE per le imbarcazioni da diporto (2013/53/EU) e alle norme armonizzate pertinenti.
    scope: Barche e imbarcazioni
  - name: null
    desc: Sistema di gestione della qualità certificato per progettazione, produzione e distribuzione di imbarcazioni gonfiabili.
