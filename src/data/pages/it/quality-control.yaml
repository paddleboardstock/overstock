content_system:
  tagline: Panoramica del sistema QC
  title: Qualità Integrata<br />Quadro di Controllo
  subtitle: Il nostro sistema QC opera indipendentemente dalla produzione e riporta direttamente alla direzione. Nessun lotto viene spedito senza autorizzazione qualità firmata dal laboratorio di qualità.
  items:
    - title: Laboratorio Indipendente di Qualità
      description: 'Il nostro laboratorio di qualità opera come funzione separata dalla produzione. Gli ispettori QC riferiscono al Responsabile della Qualità, non al Direttore della Produzione. Questa indipendenza organizzativa garantisce che le decisioni sulla qualità vengano prese in modo oggettivo: le scadenze di produzione non prevalgono mai sui requisiti di qualità.'
      features:
        - Riporta direttamente alla direzione, indipendentemente dalla produzione
        - Autorizzato a sospendere la produzione per problemi di qualità
        - 12 ispettori QC dedicati in tutte le fasi
        - Tutte le apparecchiature di prova calibrate annualmente
    - title: Tracciabilità dei lotti
      description: A ogni lotto di materia prima viene assegnato un numero di lotto unico nel nostro ERP sistema. Dall'arrivo del materiale fino alla produzione fino al prodotto finito, la lista dei materiali di ogni consiglio si collega ai lotti originali del fornitore. Questo consente la piena tracciabilità a monte per qualsiasi richiesta di qualità o conformità.
      features:
        - ERP- tracciamento dei lotti basato sul materiale al prodotto finito
        - Tag fisici per batch su ogni ordine di lavoro
        - Copertura 100% dei materiali — PVC, drop-stitch EVA , schiuma, ferramenta, adesivi
        - Record conservati per 10 anni
    - title: Gestione della Qualità
      description: Le nostre procedure QC seguono protocolli interni documentati. I risultati dei test vengono registrati, tracciabili e revisionati dal nostro laboratorio di qualità indipendente. Tasso di assenza di difetti del 99,3% nelle spedizioni successive a 12 mesi.
      features:
        - Protocolli interni di controllo qualità documentati, revisionati annualmente
        - Tasso di assenza difetti del 99,3% sulle spedizioni successive a 12 mesi
        - Tolleranza zero per difetti critici per la sicurezza
        - Record conservati per 10 anni
content_inspection:
  tagline: Fasi di ispezione
  title: Sei stadi<br />Processo di ispezione
  subtitle: Ogni prodotto attraversa 6 fasi di ispezione con checkpoint di controllo qualità documentati. I difetti vengono individuati precocemente, le azioni correttive sono immediate e ogni lotto è completamente tracciabile.
  stages:
    - stage: '1'
      title: Ispezione dei materiali in arrivo
      description: Tutti i materiali in arrivo vengono registrati per lotto/numero di lotto e messi in quarantena fino alla clausura del controllo qualità.PVC I rotoli di tessuto vengono testati per resistenza alla trazione, resistenza allo strappo e spessore.Drop-stitch Nuclei, valvole, adesivi e ferramenta vengono ispezionati visivamente e misurati secondo le specifiche.
      checks: Resistenza alla trazione, resistenza allo strappo, spessore, viscosità dell'adesivo, scansione dei difetti visivi
      threshold: 100% dei lotti testati. Rifiutare se la resistenza alla trazione < 90% della specifica, lo strappo < minimo della specifica, o qualsiasi difetto visivo
    - stage: '2'
      title: Controllo qualità in processo — Taglio e preparazione
      description: CNC-i pannelli tagliati vengono controllati dimensionalmente rispetto ai file sorgente CAD ogni ventesimo pannello. La qualità dei bordi viene ispezionata per eventuali sfilacciamenti, tagli irregolari o deriva dimensionale. Il numero dei pannelli viene verificato rispetto alla BOM per ogni lotto di produzione prima che i materiali passino alla saldatura.
      checks: Controllo dimensionale rispetto ai file CAD DXF, ispezione della qualità dei bordi, verifica del conteggio dei pannelli
      threshold: Tolleranza ±0,5mm. Rifiuta il lotto se >2% fuori tolleranza
    - stage: '3'
      title: QC in processo — Saldatura e incollaggio
      description: Durante la produzione, la qualità della saldatura viene monitorata continuamente. I test di decollatura vengono effettuati su campioni ogni 50 unità. La larghezza della saldatura viene misurata rispetto alle specifiche. I registri della temperatura dell'aria calda vengono esaminati per la coerenza. Ogni giunzione viene ispezionata visivamente sotto retroilluminazione per eventuali canali o vuoti.
      checks: Test di decollo ogni 50 unità, misurazione della larghezza di saldatura, revisione del registro della temperatura dell'aria calda, ispezione delle giunture di retroilluminazione
      threshold: Resistenza al decollamento minima 8 N/cm. Tolleranza di larghezza di ±saldatura 1 mm. Qualsiasi canalizzazione visibile = scarto
    - stage: '4'
      title: Controllo qualità dell'assemblaggio
      description: Ogni unità segue una checklist di assemblaggio di 100 punti firmata dal team leader. La funzione delle valvole viene testata attraverso 10 cicli di apertura/chiusura. La coppia hardware viene verificata. L'ispezione visiva copre la finitura superficiale, la consistenza del colore, la posizione dell'etichetta e la completezza degli accessori.
      checks: Checklist a 100 punti per unità, test di funzione valvola, verifica della coppia hardware, ispezione visiva
      threshold: 'Politica zero difetti su elementi critici per la sicurezza (valvole, anelli a D, maniglie). Cosmetica minore: obiettivo al 99,3% senza difetti'
    - stage: '5'
      title: Test di Pressione
      description: Ogni camera viene gonfiata a 1,25× pressione nominale e mantenuta per 24-48 ore. I sensori di pressione registrano continuamente durante tutto il periodo di mantenimento. Le letture compensate dalla temperatura garantiscono accuratezza. Qualsiasi camera che superi il 5% di caduta di pressione viene rifiutata e inviata a una nuova ispezione della giuntura con un nuovo test al 100% dell'intero lotto di produzione.
      checks: Registro di mantenimento della pressione 24-48 ore, calibrazione del sensore verificata quotidianamente, lettura compensata in temperatura, test di riproduzione delle giunzioni dopo la riparazione
      threshold: Calo di pressione massimo del 5% in 24 ore a temperatura stabile. Oltre = 100% di ritest dell'intero lotto
    - stage: '6'
      title: Ispezione finale e rilascio della spedizione
      description: Ispezione visiva e funzionale finale prima dell'imballaggio. Difetti superficiali, coerenza del colore, verifica dell'etichetta/BIN, integrità del packaging e completezza degli accessori vengono verificati rispetto all'ordine del cliente. Le unità vengono confezionate sottovuoto, confezionate e palletizzate. È richiesta la certificazione finale del controllo qualità prima che qualsiasi prodotto lasci la fabbrica.
      checks: Ispezione visiva completa, checklist degli accessori per SKU ciascuno, test di caduta dell'imballaggio (campione casuale di 1 m), verifica della scansione di etichette/codici a barre
      threshold: Difetti di sicurezza a tolleranza zero. Bersaglio privo di difetti al 99,3%. 100% delle unità ispezionate visivamente
content_equipment:
  tagline: Apparecchiature di prova
  title: Laboratorio QC<br />Equipaggiamento
  subtitle: Il nostro laboratorio di qualità è dotato di attrezzature specializzate per la verifica dei materiali, l'integrità della saldatura e la validazione delle prestazioni del prodotto.
  columns: 3
  items:
    - title: Macchina per la prova di trazione
      description: Misura la resistenza alla trazione e l'allungamento del tessuto secondo il protocollo di test interno. Utilizzato per il controllo qualità in ingresso di tutti PVC drop-stitch i lotti di tessuto.
      icon: tabler:scale
    - title: Camera di temperatura
      description: Camera ambientale per UV test di resistenza e flessibilità a bassa temperatura. Simula condizioni operative estreme.
      icon: tabler:temperature
    - title: Sensori di pressione e logger
      description: Sensori di pressione digitali con registrazione continua dei dati per test di ritenzione dell'aria di 24-48 ore. Temperatura compensata per la precisione.
      icon: tabler:wind
    - title: Banco di prova per il peeling
      description: Apparecchiature calibrate per il test del peeling per la verifica della resistenza delle giunzioni di saldatura. Campioni casuali da ogni lotto di produzione.
      icon: tabler:files
    - title: Vasca per rilevamento perdite
      description: Serbatoio d'acqua per test di perdite immerse in camere gonfiate. Rilevamento visivo delle bolle per la verifica dell'integrità delle giunzioni e delle valvole.
      icon: tabler:ripple
    - title: Strumenti di ispezione
      description: Strumenti di misura calibrati — spessorimetri, chiavi dinamometriche, pinze dimensionali, tester di durezza per stazioni QC di produzione.
      icon: tabler:tools
content_metrics:
  tagline: Prestazioni QC
  title: Controllo Qualità<br />Metriche
  subtitle: Dati reali di pass/fail dalla nostra linea di produzione. Queste metriche vengono monitorate quotidianamente e revisionate mensilmente dalla direzione.
  columns: 3
  items:
    - title: Unità testate al 100%
      description: Ogni camera di ogni scheda viene testata prima della spedizione. Nessun campionamento — ispezione al 100% sull'integrità della pressione.
      icon: tabler:check
    - title: <5% di caduta di pressione
      description: Perdita massima ammissibile di pressione in 24-48 ore a 1,25× pressione nominale. Qualsiasi camera che superi questa soglia attiva il test a lotti.
      icon: tabler:gauge
    - title: 99,3% Privo di Difetti
      description: Tasso senza difetti sulle spedizioni a 12 mesi in ritardo. Tolleranza zero per difetti critici per la sicurezza.
      icon: tabler:clipboard-check
    - title: Attesa 24-48 Ore
      description: Le tavole vengono tenute 24-48 ore a seconda del modello e del lotto. I sensori di pressione registrano continuamente durante il periodo di attesa.
      icon: tabler:clock
    - title: 1,25× Pressione di prova
      description: Margine di sicurezza su ogni camera — testato al 25% sopra la pressione nominale per garantire un margine superiore alle condizioni operative massime.
      icon: tabler:arrow-up
    - title: 0% difetti di sicurezza
      description: Politica di tolleranza zero per difetti critici per la sicurezza — valvole, anelli a D, giunture e camere di galleggiamento. Qualsiasi difetto = 100% di riispezione.
      icon: tabler:shield
cta:
  title: Richiedi documentazione sulla qualità
  subtitle: Forniamo pacchetti completi di documentazione sulla qualità, inclusi rapporti di test e registrazioni di ispezione con ogni spedizione. Contattaci per campioni.
  actions:
    - variant: primary
      text: Richiedi documentazione QC
      href: /contact
    - text: Visualizza protocolli di test
      href: /quality
tldr:
  summary: 'Sistema di controllo qualità a sei fasi: ispezione dei materiali, QC in corso di lavorazione, verifica della saldatura, QC di assemblaggio, test di pressione a 1,25x del valore nominale e ispezione finale. Test di pressione al 100% delle unità. Tasso di difetti 0,7% secondo AQL campionamento 2,5.'
  points:
    - 'QC a sei fasi: ispezione dei materiali, QC in corso di lavorazione, verifica della saldatura, QC di assemblaggio, test di pressione a 1,25x e ispezione finale a 100 punti'
    - Ispezione finale a 100 punti su ogni scheda prima dell'imballaggio
    - Il 100% delle unità viene sottoposto a 24-48 ore di mantenimento a pressione 1,25x del valore nominale con tolleranza massima di calo del 5%
    - AQL campionamento 2,5 garantendo un tasso di difetti dello 0,7%
    - 'QC della saldatura: test di scollamento, verifica della larghezza della saldatura e ispezione della giunzione retroilluminata su ogni giunto saldato'
