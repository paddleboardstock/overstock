hero_text:
  tagline: Risorse
  title: Centro Download e Guide al Pagaiamento
  subtitle: Cataloghi di prodotti, guide all'acquisto e istruzioni di cura per aiutarti a scegliere, usare e goderti la tua SUP tavola gonfiabile.
features3_downloads:
  tagline: Download
  title: Documentazione del prodotto<br />& Risorse per il canoato
  isBeforeContent: false
  columns: 2
  items:
    - title: Catalogo Prodotti 2026 SUP
      description: "La gamma completa Paddle Board Overstock SUP : tavole completi, serie d'arte e accessori, con specifiche complete e contenuti del pacchetto. Formato PDF."
      icon: tabler:file-text
    - title: SUP Guida gonfiabile all'acquisto
      description: 'Come scegliere la tua prima tavola: lunghezza, larghezza, spessore, volume, abbinamento del peso del rider e quale forma di tavola si adatta al tuo stile di remozione.'
      icon: tabler:file-description
    - title: SUP Guida a taglie e vestibilità
      description: Abbina il volume e le dimensioni della tavola al tuo peso e livello di abilità, con raccomandazioni specifiche per attività ricreative, touring, yoga e fitness.
      icon: tabler:clipboard-check
    - title: Guida alla Cura e Manutenzione delle Pensioni
      description: 'Mantieni la tua tavola come nuova: pulizia, asciugatura, conservazione, UV protezione, cura delle valvole e piccole istruzioni di riparazione.'
      icon: tabler:tool
    - title: Guida ai materiali per tavole gonfiabili
      description: PVC Costruzione, drop-stitch core, EVA pad per il ponte e cosa PSI significa rigidità 15 per prestazioni e durata.
      icon: tabler:files
    - title: Come iniziare con SUP
      description: 'Base per un principiante: gonfia, trasporto, lancio, bracci di base e essenziali di sicurezza per farti stare in piedi il primo giorno.'
      icon: tabler:swimming
faqs:
  title: Domande Frequenti
  subtitle: Domande comuni sulle nostre tavole, l'ordine e il fatto di salire in acqua.
  columns: 2
  items:
    - title: Cosa è incluso con la mia scheda?
      description: Ogni pacchetto completo include la tavola, la pagaia regolabile, la pompa ad alto flusso, il guinzaglio, il kit di riparazione e lo zaino. Anche il set Oars & Pump è disponibile separatamente.
      icon: tabler:package
    - title: Quanto tempo impiega l'inflazione?
      description: Con la pompa ad alto flusso inclusa, la maggior parte dei pagaiatori raggiunge la pressione piena in 8-12 minuti. Anche le pompe elettriche funzionano — basta fermarsi alla pressione nominale stampata vicino alla valvola.
      icon: tabler:clock
    - title: Come posso scegliere la tavola giusta?
      description: "Inizia dal peso e dal stile di remaggio: principianti e famiglie amano piattaforme larghe e stabili come SUP l'Explorer 11; i canoatori di yoga preferiscono la trazione su tutto il ponte; i pagaiatori da turismo desiderano forme rigide e aerodinamiche. Il nostro team è felice di consigliarlo."
      icon: tabler:help-circle
    - title: Quali metodi di pagamento accettate?
      description: Accettiamo carte di credito principali, PayPal e bonifici bancari. Tutti i prezzi includono il pacchetto completo — nessun extra nascosto.
      icon: tabler:currency-dollar
    - title: Quanto tempo richiede la consegna?
      description: Gli ordini vengono spediti dalla nostra fabbrica e di solito arrivano entro 5-10 giorni lavorativi a seconda della regione. Il tracciamento viene fornito per ogni ordine.
      icon: tabler:truck-delivery
    - title: La mia tavola è coperta da garanzia?
      description: Sì — ogni tavola è coperta contro i difetti di fabbricazione, e ogni unità viene sottoposta a collaudo di pressione a 1,25 volte la sua pressione nominale per 24-48 ore prima di lasciare la fabbrica. Il nostro tasso di reclami di garanzia è inferiore al 2%.
      icon: tabler:shield-check
cta:
  title: Hai bisogno di aiuto per trovare la tavola giusta?
  subtitle: Contatta il nostro team per consigli onesti sulla selezione della tavola, sulle dimensioni o su domande relative all'ordine.
  actions:
    - variant: primary
      text: Contatta il nostro team
      href: /contact
