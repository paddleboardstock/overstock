hero_text:
  tagline: Risorse
  title: 'Centro di download e guide all''acquisto'
  subtitle: 'Acceda a cataloghi di prodotti, guide OEM, checklist per gli acquirenti e documentazione tecnica per prendere decisioni di approvvigionamento informate.'
features3_downloads:
  tagline: Download
  title: 'Documentazione di prodotto<br />e risorse per gli acquirenti'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Catalogo prodotti marini 2026'
      description: 'Gamma completa di prodotti, tra cui gommoni RIB, imbarcazioni gonfiabili, tavole SUP, kayak e accessori. Specifiche, configurazioni e opzioni. Formato PDF.'
      icon: tabler:file-text
    - title: 'Guida alla produzione OEM'
      description: 'Tutto ciò che serve sapere sulle partnership OEM/ODM: panoramica del processo, quantità minime di ordine, opzioni di personalizzazione, controllo qualità e spedizione.'
      icon: tabler:building-factory
    - title: 'Guida all''acquisto dei gommoni RIB'
      description: 'Come scegliere il RIB giusto: materiali dello scafo, materiali dei tubolari, scelta del motore, valutazione delle dimensioni e opzioni di configurazione per diverse applicazioni.'
      icon: tabler:file-description
    - title: 'Checklist per i fornitori di SUP'
      description: 'Aspetti fondamentali nella scelta di un produttore di tavole SUP: indicatori di qualità, requisiti di certificazione, considerazioni sul MOQ e cosa verificare in un audit di fabbrica.'
      icon: tabler:clipboard-check
    - title: 'Guida ai materiali per imbarcazioni gonfiabili'
      description: 'PVC vs Hypalon: confronto tra durata, resistenza ai raggi UV, vita utile, opzioni di riparazione e considerazioni sui costi per diverse applicazioni marine.'
      icon: tabler:files
    - title: 'Modello di brief per la produzione personalizzata'
      description: 'Scarichi il nostro modello di brief di prodotto. Compili i suoi requisiti e ce lo restituisca: riceverà un preventivo e una valutazione di fattibilità entro la stessa settimana.'
      icon: tabler:template
faqs:
  title: Domande frequenti
  subtitle: 'Domande comuni sui nostri prodotti, sul processo di produzione e sul nostro modello di partnership.'
  columns: 2
  items:
    - title: Qual è la quantità minima di ordine?
      description: 'Il MOQ varia in base alla categoria di prodotto. I gommoni RIB partono in genere da 10 unità per modello, le tavole SUP da 50 unità. Contatti il nostro team commerciale per informazioni sul MOQ specifico di ogni prodotto.'
      icon: tabler:help-circle
    - title: Posso ricevere campioni prima di effettuare un ordine?
      description: 'Sì. Paddle Board Overstock produce campioni per la valutazione prima della produzione in serie. I costi dei campioni sono negoziabili e vengono spesso accreditati sul primo ordine di produzione.'
      icon: tabler:package
    - title: Quali condizioni di pagamento sono disponibili?
      description: 'Condizioni standard: acconto del 30 % con l''ordine, saldo del 70 % prima della spedizione. Condizioni LC disponibili per i clienti qualificati. Contatti il nostro team finanziario per concordare le modalità.'
      icon: tabler:currency-dollar
    - title: Quanto tempo richiede la produzione?
      description: 'Tempi di consegna tipici: gommoni RIB 30–45 giorni, tavole SUP 20–30 giorni, imbarcazioni gonfiabili 25–35 giorni. Lo sviluppo personalizzato aggiunge 15–30 giorni per la prototipazione.'
      icon: tabler:calendar-clock
    - title: Quali certificazioni hanno i vostri prodotti?
      description: 'Certificazione CE per i mercati UE, produzione approvata dalla Guardia Costiera statunitense, sistema di qualità ISO, conformità BSCI e conformità dei materiali REACH.'
      icon: tabler:certificate
    - title: Offrite imballaggi e branding personalizzati?
      description: 'Sì. Forniamo imballaggi personalizzati con il vostro logo, i vostri colori e la vostra identità di marca. Il MOQ per gli imballaggi personalizzati dipende dalla categoria di prodotto.'
      icon: tabler:color-swatch
cta:
  title: 'Ha bisogno di aiuto per trovare la risorsa giusta?'
  subtitle: 'Contatti il nostro team per una consulenza personalizzata su selezione dei prodotti, partnership OEM o specifiche tecniche.'
  actions:
    - variant: primary
      text: Contatti il nostro team
      href: /contact