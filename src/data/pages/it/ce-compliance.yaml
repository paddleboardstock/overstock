hero:
  tagline: Conformità CE e RCD
  title: Conformità CE per imbarcazioni RIB<br />e documentazione tecnica
  subtitle: Le imbarcazioni RIB e le moto d'acqua gonfiabili Aquafarer sono progettate e documentate per la conformità del mercato UE ai sensi della Direttiva sulle imbarcazioni da diporto 2013/53/UE. Dalla valutazione del rischio alla Dichiarazione di conformità, forniamo la documentazione di conformità specifica del modello per ogni scafo.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Documentazione e certificazione di conformità CE del gommone RIB
direct_answer: Aquafarer fornisce documentazione di conformità RCD 2013/53/UE specifica per modello per imbarcazioni RIB e moto d'acqua gonfiabili, inclusi documenti tecnici, dichiarazioni di conformità, targhette del costruttore e manuali del proprietario, il tutto in linea con EN ISO 6185, ISO 12217 e gli standard armonizzati applicabili.
