content_scope:
  tagline: Ambito di conformità
  title: Quali prodotti necessitano<br />di conformità alla normativa RCD?
  subtitle: La Direttiva sulle imbarcazioni da diporto 2013/53/UE si applica alle imbarcazioni da diporto con una lunghezza dello scafo compresa tra 2,5 me 24 m. Comprendere l’ambito è il primo passo verso la conformità.
  items:
    - title: Gommoni RIB (2,5–24 m)
      description: I gommoni rigidi con scafo di lunghezza compresa tra 2,5 ma 24 m rientrano nella RCD. Le categorie di progettazione da A a D si applicano in base alle condizioni del mare previste e alla forza massima del vento.
      icon: tabler:sailboat
    - title: Gommoni (sotto i 2,5 m)
      description: I piccoli gommoni e i gommoni di lunghezza inferiore a 2,5 m possono essere parzialmente esenti dall'RCD ma richiedono comunque la marcatura CE ai sensi di altre direttive applicabili e degli standard di costruzione EN ISO 6185.
      icon: tabler:sailboat
    - title: Tavole SUP e accessori
      description: Le tavole da stand up paddle non rientrano nel campo di applicazione del DMC. Tuttavia, i dispositivi di galleggiamento personali (PFD) associati richiedono la marcatura CE ai sensi del regolamento DPI (UE) 2016/425 con approvazione USCG Tipo III/V ove applicabile.
      icon: tabler:swimming
    - title: Barche parzialmente completate
      description: Le imbarcazioni consegnate senza motore o installazioni specifiche richiedono una dichiarazione del costruttore per imbarcazioni parzialmente completate, con la piena conformità RCD completata dal costruttore o importatore finale.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistema di fiducia a tre livelli
  title: Informazioni sulla conformità<br />— Condivise al giusto livello
  subtitle: Non tutti i dati sulla conformità appartengono a un sito Web pubblico. Seguiamo un approccio a tre livelli che protegge la proprietà intellettuale rafforzando al tempo stesso la fiducia degli acquirenti.
  items:
    - title: 'Livello 1: sito Web pubblico'
      description: Standard di riferimento, percorsi di conformità spiegati, tipi di documenti elencati, ambito di certificazione per famiglia di modelli. Nessun certificato effettivo, dati di test o dettagli tecnici proprietari.
      icon: tabler:world
    - title: 'Livello 2: condivisione post-indagine'
      description: "Dopo un'indagine qualificata: campione della dichiarazione di conformità redatta, foto della targa del costruttore, elenco degli standard applicabili, lista di controllo della conformità e riepiloghi della certificazione dei materiali, condivisi in termini di utilizzo corretto."
      icon: tabler:mail
    - title: "Livello 3: NDA/Fase dell'ordine"
      description: Fascicolo tecnico completo, valutazioni dei rischi, calcoli di stabilità, rapporti di prova, registri dei lotti di materiali e documentazione di tracciabilità della produzione, condivisi solo con NDA con acquirenti confermati.
      icon: tabler:lock
content_standards:
  tagline: Standard applicabili
  title: Standard ISO ed EN<br />Costruiamo secondo le nostre norme
  subtitle: I nostri prodotti sono progettati e testati rispetto agli standard armonizzati della RCD. Si fa riferimento a numeri e nomi standard; i testi standard completi rimangono copyright ISO.
  items:
    - title: EN ISO 6185-3
      description: 'Gommoni - Parte 3: imbarcazioni con una potenza motore massima pari o superiore a 15 kW. Requisiti di costruzione, stabilità, galleggiabilità e recupero uomo in mare per i RIB.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Gommoni - Parte 4: imbarcazioni con una potenza motore massima di 15 kW e superiore o uguale a 4,5 kW. Ulteriori requisiti strutturali e di stabilità.'
      icon: tabler:file-text
    - title: Serie ISO 12215
      description: 'Piccole imbarcazioni: costruzione dello scafo e dimensioni. Progettazione strutturale di scafo, coperta e paratie per scafi RIB in vetroresina e alluminio.'
      icon: tabler:ruler-2
    - title: UNE-EN ISO 10240
      description: "Piccola imbarcazione: manuale del proprietario. Contenuto e formato richiesti per il manuale del proprietario che accompagna ogni imbarcazione RIB consegnata nell'UE."
      icon: tabler:book
    - title: ISO 14945
      description: 'Piccola imbarcazione: targa del costruttore. Informazioni da riportare sulla targhetta del costruttore fissata permanentemente su ciascuna imbarcazione.'
      icon: tabler:badge
    - title: ISO8666
      description: Piccole imbarcazioni — Dati principali. Misurazioni e parametri standardizzati per specifiche coerenti in tutta la documentazione del prodotto.
      icon: tabler:dimensions
content_process:
  tagline: Processo di conformità
  title: Conformità CE in 6 fasi<br />Flusso di lavoro
  subtitle: "Dall'ambito del progetto alla tracciabilità a livello di serie: ogni modello RIB segue un percorso di conformità definito."
  steps:
    - number: '01'
      title: Ambito e classificazione del progetto
      description: Definire il modello del RIB, la categoria di progettazione (A/B/C/D), il numero massimo di persone, il carico utile, la potenza del motore e il mercato di riferimento. Determinare se si applica la RCD e quale modulo di valutazione della conformità è richiesto.
      timeline: 2–3 giorni
    - number: '02'
      title: Identificazione dei requisiti applicabili
      description: Identificare tutti i requisiti essenziali di sicurezza applicabili dall'allegato I della RCD, le norme armonizzate pertinenti (EN ISO 6185, 12215, 10240, 14945) e qualsiasi requisito nazionale aggiuntivo per il mercato di riferimento.
      timeline: 3–5 giorni
    - number: '03'
      title: Progettazione e documentazione tecnica
      description: 'Creare il fascicolo tecnico principale: disegni di disposizione generale, calcoli di stabilità e galleggiabilità, valutazione del rischio, specifiche dei materiali e analisi di sicurezza dei sistemi (carburante, elettrico, sterzo).'
      timeline: 10-15 giorni
    - number: '04'
      title: Verifica e test del prodotto
      description: 'Condurre verifiche fisiche: test di pressione a 1,25 volte la pressione nominale per 24-48 ore, test di stabilità e galleggiabilità, test di carico e messa in servizio dei sistemi. Registrare tutti i risultati dei test per scafo.'
      timeline: 5–7 giorni
    - number: '05'
      title: Documentazione di marcatura e consegna
      description: Apporre la marcatura CE, la targhetta del costruttore (EN ISO 14945) e HIN/CIN (numero di identificazione dello scafo). Preparare la dichiarazione di conformità UE, il manuale del proprietario (EN ISO 10240) e la lista di controllo di conformità.
      timeline: 2–3 giorni
    - number: '06'
      title: Tracciabilità a livello di serie
      description: Ogni scafo riceve un record unico dello scafo che lo collega al file tecnico principale, al lotto di produzione, ai certificati dei materiali, ai risultati dei test e alla configurazione finale. Documenti conservati per oltre 10 anni per DMC.
      timeline: In corso
content_document_cards:
  tagline: Tipi di documenti
  title: Documento di conformità<br />Carte
  subtitle: Questi sono i tipi di documenti che prepariamo e manteniamo per ciascun modello RIB certificato CE. I campioni sono disponibili previa richiesta qualificata.
  items:
    - title: Certificato di conformità CE/RCD
      description: Certificato specifico del modello che conferma che l'imbarcazione soddisfa tutti i requisiti essenziali di sicurezza applicabili del RCD 2013/53/UE, rilasciato dal produttore con il coinvolgimento dell'organismo notificato ove richiesto.
      icon: tabler:certificate
    - title: Dichiarazione di conformità UE (DoC)
      description: Dichiarazione firmata dal produttore o dal rappresentante autorizzato, che elenca le direttive applicabili, gli standard, il modulo di conformità e i dettagli dell'organismo notificato. Obbligatorio per ogni modello immesso sul mercato UE.
      icon: tabler:file-check
    - title: Targa del costruttore (EN ISO 14945)
      description: Targa fissata in modo permanente che indica il numero massimo di persone, la potenza massima del motore, la categoria di progettazione e l'identificazione del produttore. Deve rimanere leggibile per tutta la vita dell'imbarcazione.
      icon: tabler:badge
    - title: Manuale dell'utente (EN ISO 10240)
      description: Manuale completo che copre il funzionamento sicuro, le procedure di emergenza, i programmi di manutenzione e gli avvisi di sicurezza. Obbligatorio per ogni RIB consegnato nell'UE.
      icon: tabler:book
    - title: Rapporti di test e ispezione ISO
      description: Registrazioni dei test di pressione (1,25x / 24–48 ore), risultati dei test di stabilità e galleggiabilità, certificati di test sui materiali e rapporti di verifica dimensionale, tutti collegati a numeri di scafo specifici.
      icon: tabler:test-pipe
    - title: Documenti di tracciabilità dei materiali
      description: Tracciabilità a livello di lotto per tessuto tubolare, adesivi, fibra di vetro e hardware. Collega ciascuna unità di produzione ai certificati dei materiali in entrata e ai risultati delle ispezioni IQC.
      icon: tabler:link
    - title: Ispezione di qualità e registrazioni di controllo qualità
      description: Lista di controllo qualità da 100 punti per unità, registrazioni QC in corso, rapporti di non conformità e azioni correttive. Parte della filiera della tracciabilità della produzione.
      icon: tabler:clipboard-check
    - title: Pacchetto documenti di progetto
      description: Pacchetto di documentazione per scafo che include il registro della configurazione finale, i dettagli di installazione del motore e dell'attrezzatura, la lista di controllo per la messa in servizio e la documentazione di consegna.
      icon: tabler:package
content_design_categories:
  tagline: Categorie di progettazione dei DMC
  title: Categoria di progettazione A–D<br />— Cosa significano
  subtitle: L'RCD assegna categorie di progettazione in base alla forza massima del vento e all'altezza significativa delle onde che l'imbarcazione è progettata per resistere.
  items:
    - title: 'Categoria A: Oceano'
      description: Progettato per viaggi prolungati in cui la forza del vento può superare Beaufort 8 (>40 nodi) e l'altezza significativa delle onde può superare i 4 m. Richiede la più rigorosa verifica strutturale e di stabilità.
      icon: tabler:ripple
    - title: 'Categoria B: offshore'
      description: Progettato per viaggi d'altura con forza del vento fino a Beaufort 8 (≤40 nodi) e altezza d'onda significativa fino a 4 m. Adatto per acque costiere e semiesposte.
      icon: tabler:anchor
    - title: Categoria C — Costiera
      description: Progettato per viaggi costieri con forza del vento fino a Beaufort 6 (≤27 nodi) e altezza significativa delle onde fino a 2 m. La maggior parte dei RIB da diporto rientrano in questa categoria.
      icon: tabler:sun
    - title: Categoria D — Protetta
      description: Progettato per acque riparate con forza del vento fino a Beaufort 4 (≤16 nodi) e altezza d'onda significativa fino a 0,3 m. Laghi, fiumi e porti protetti.
      icon: tabler:pool
content_hin:
  tagline: Identificazione dell'artigianato
  title: HIN / CIN e targa del costruttore
  subtitle: Ogni imbarcazione RIB richiede un numero di identificazione dello scafo (HIN) o un numero di identificazione dell'imbarcazione (CIN) e una targa del costruttore secondo i requisiti EN ISO 14945 e RCD.
  items:
    - title: Numero di identificazione dello scafo (HIN)
      description: Un codice univoco di 14 caratteri impresso in modo permanente sul lato di tribordo dello specchio di poppa, che codifica il codice del produttore (MIC), l'anno del modello, l'anno di produzione e il numero di serie. Necessario per l'ingresso nel mercato UE.
      icon: tabler:hash
    - title: Numero Identificativo dell'Imbarcazione (CIN)
      description: Secondo EN ISO 10087, un numero di identificazione secondario nascosto collocato in una posizione nascosta a fini antifurto e di tracciabilità.
      icon: tabler:eye-off
    - title: Contenuto della piastra del costruttore
      description: 'Numero massimo di persone, potenza massima del motore (kW), carico massimo (kg), categoria di progettazione, nome del produttore e marcatura CE: tutti visualizzati in modo permanente su una targhetta resistente alla corrosione.'
      icon: tabler:badge
content_tech_file:
  tagline: Struttura del fascicolo tecnico
  title: Documento tecnico principale<br />e documentazione dello scafo
  subtitle: 'Il nostro sistema di documentazione segue una struttura a due livelli: il Master Technical File per ogni famiglia di modelli e i singoli Hull Records per ogni barca prodotta.'
  items:
    - title: Fascicolo tecnico principale
      description: 'Contiene la documentazione di conformità completa per una famiglia di modelli: disposizione generale, valutazione del rischio, calcoli di stabilità/galleggiabilità, specifiche dei materiali, standard applicabili e record di valutazione della conformità. Conservato per più di 10 anni.'
      icon: tabler:folder
    - title: Registro dello scafo (tracciabilità per imbarcazione)
      description: 'Ogni scafo ha un record univoco che lo collega al file tecnico principale: HIN, data di produzione, lotto di tubi, certificati dei materiali, risultato del test di pressione, configurazione finale, installazione del motore e destinazione di consegna.'
      icon: tabler:file-description
    - title: Pacchetto conformità cliente
      description: Pacchetto di consegna per scafo che comprende dichiarazione di conformità, foto della targa del costruttore, manuale del proprietario, riepilogo del test e foglio di configurazione finale, fornito con ogni RIB spedito nell'UE.
      icon: tabler:package
content_material_cert:
  tagline: Certificazione dei materiali
  title: Tracciabilità dei materiali e<br />prove di certificazione
  subtitle: >-
    Le imbarcazioni RIB di qualità nascono da materiali controllati e processi documentati. Di
    seguito come organizziamo la certificazione dei materiali per ciascun gruppo di componenti
    critici.
  items:
    - title: Tracciabilità del materiale dei tubolari
      description: >-
        I materiali dei tubolari in PVC e CSM/Hypalon vengono selezionati in base all'uso previsto,
        alle condizioni climatiche e al mercato di destinazione. Le schede tecniche del fornitore
        (TDS), le informazioni sul lotto di materiale, la tracciabilità del tessuto, i rapporti di
        prove UV e invecchiamento e le dichiarazioni REACH/SVHC sono disponibili nell'ambito
        documentale concordato per il progetto.
      icon: tabler:circle
    - title: Tracciabilità dell'alluminio marino
      description: >-
        Per i progetti di RIB con scafo in alluminio, classe di lega, spessore e lotti di materiale
        sono controllati secondo la specifica approvata. Certificati di prova del materiale
        (MTC/MTR), documentazione EN 10204 3.1, rapporti di composizione chimica e proprietà
        meccaniche e tracciabilità colata/lotto vengono forniti secondo gli accordi.
      icon: tabler:rectangle
    - title: Scafo GRP — controllo di materiali e processo
      description: >-
        Per i RIB con scafo in vetroresina, gelcoat, resina, rinforzi in fibra di vetro e materiali
        dell'anima sono gestiti tramite specifiche controllate. TDS/SDS dei materiali, registrazioni
        dei lotti, specifiche di laminazione e registri di cura e di controllo officina disponibili
        previo accordo di progetto.
      icon: tabler:layers-subtract
    - title: Supporto documentale dei componenti
      description: >-
        Per i componenti selezionati — materiali del ponte EVA, sedute, ferramenta in acciaio inox,
        sistemi carburante, apparecchiature elettriche e accessori nautici — la documentazione del
        fornitore applicabile è coordinata in base alla configurazione finale e ai requisiti del
        mercato di destinazione.
      icon: tabler:package
    - title: Nota sull'ambito di conformità
      description: >-
        Certificati, rapporti di prova e documenti di conformità si applicano esclusivamente al
        modello di prodotto, materiale, componente, lotto di produzione o ambito di progetto indicato
        nel documento corrispondente. Contattateci con mercato di destinazione, uso previsto e
        requisiti tecnici per confermare il pacchetto documentale applicabile prima dell'ordine.
      icon: tabler:info-circle

faq:
  title: 'Conformità CE: domande frequenti'
  questions:
    - q: Tutte le imbarcazioni Aquafarer RIB sono certificate CE per il mercato UE?
      a: Le barche RIB nel nostro catalogo sono progettate e documentate per la conformità RCD 2013/53/UE secondo le direttive UE applicabili. La marcatura CE si applica in base al modello e alla configurazione. Contattaci per un documento sull'ambito di conformità specifico del modello.
    - q: Qual è la differenza tra conformità RCD e marcatura CE?
      a: La RCD (Direttiva sulle imbarcazioni da diporto 2013/53/UE) è la legislazione dell'UE che stabilisce i requisiti essenziali di sicurezza. La marcatura CE è il simbolo visivo posto su un prodotto che è stato valutato e confermato conforme a tali requisiti. Un prodotto deve essere conforme alla normativa RCD prima di poter portare il marchio CE.
    - q: Fornite dichiarazioni di conformità con ogni barca?
      a: SÌ. Ogni barca RIB consegnata al mercato UE include una Dichiarazione di conformità UE specifica per il modello che elenca le direttive applicabili, gli standard armonizzati, il modulo di valutazione della conformità e i dettagli dell'organismo notificato.
    - q: Quale modulo di valutazione della conformità utilizza Aquafarer?
      a: Il modulo dipende dalla categoria di progettazione e dal tipo di imbarcazione. La maggior parte dei modelli RIB nella categoria di progettazione C utilizzano il modulo A (controllo interno della produzione). Per le imbarcazioni di categoria di progettazione A/B o configurazioni specifiche, è possibile applicare il modulo B+C o B+D con il coinvolgimento dell'organismo notificato. Consigliamo il modulo appropriato per ogni progetto.
    - q: Potete condividere la documentazione di conformità prima di effettuare un ordine?
      a: Dopo una richiesta qualificata, condividiamo un documento sull'ambito di conformità che elenca gli standard applicabili, il percorso di conformità e i tipi di documenti disponibili per il modello che stai valutando. I file tecnici completi vengono condivisi sotto NDA dopo la conferma dell'ordine.
    - q: Cos'è un numero di identificazione dello scafo (HIN) ed è incluso?
      a: L'HIN è un identificatore univoco di 14 caratteri impresso in modo permanente su ciascuna imbarcazione, che codifica il codice del produttore (MIC), la designazione del modello, l'anno di produzione e il numero di serie. È obbligatorio per tutte le imbarcazioni RIB immesse sul mercato dell'UE ed è incluso su ogni RIB Aquafarer.
    - q: Per quanto tempo vengono conservati i file tecnici?
      a: Secondo i requisiti RCD 2013/53/UE, il produttore deve conservare la documentazione tecnica per almeno 10 anni dall'ultima data in cui il prodotto è stato immesso sul mercato. Aquafarer conserva la documentazione tecnica completa per tutti i modelli prodotti.
    - q: Assistete con gli obblighi dell'importatore ai sensi della RCD?
      a: "SÌ. Forniamo il pacchetto di documentazione di cui gli importatori dell'UE hanno bisogno per adempiere ai propri obblighi: accesso alla documentazione tecnica, dichiarazione di conformità, targa del costruttore, manuale del proprietario e registri di tracciabilità del prodotto. Le responsabilità dell'importatore ai sensi della RCD sono chiaramente documentate nella nostra guida alla conformità."
