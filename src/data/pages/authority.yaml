features3_leadership:
  tagline: Leadership
  title: 'Meet the Team<br />Behind Paddle Board Overstock'
  subtitle: 'Industry expertise that spans marine engineering, material science, quality management, and global B2B trade.'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Toby Liu — Founder & CEO'
      description: '15+ years in marine manufacturing. Previously led R&D at a major Chinese boat manufacturer. Holds multiple patents in inflatable boat design.'
      icon: tabler:crown
    - title: 'Zhang Wei — Chief Engineer'
      description: '20+ years in PVC/Hypalon fabrication and deep-V hull design. Former technical director at a European marine engineering firm.'
      icon: tabler:engine
    - title: 'Chen Ming — Head of R&D'
      description: 'PhD in Materials Science. Specializes in drop-stitch technology and high-frequency welding. 10+ years in textile composites.'
      icon: tabler:flask
    - title: 'Liu Qiang — Production Director'
      description: '18+ years in lean manufacturing. Six Sigma Black Belt. Implemented ISO 9001 quality systems across all production lines.'
      icon: tabler:settings
    - title: 'Wang Fang — Quality Manager'
      description: '12+ years in marine quality control. Certified CE and ISO auditor. Oversees testing for every production batch.'
      icon: tabler:shield-check
    - title: 'Helen Lee — Sales Director'
      description: '15+ years in international B2B trade. Managed OEM/ODM partnerships across 30+ countries. Fluent in 4 languages.'
      icon: tabler:briefcase
