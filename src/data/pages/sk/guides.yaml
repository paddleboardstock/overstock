hero:
  tagline: Príručky
  title: Nový v SUP?
  subtitle: Praktické príručky, ktoré vám pomôžu vybrať, používať a užívať si nafukovateľné vybavenie na vodné športy.
size_guide:
  tagline: Veľkosť a špecifikácie
  title: Nájdite správnu veľkosť pre vaše potreby
  desc: Porovnajte rozmery produktov, nosnosti a odporúčané použitie. Či už potrebujete turistický SUP, kompaktný kajak alebo komerčný RIB — náš sprievodca veľkosťami vám pomôže vybrať správnu veľkosť.
  link_label: Úplná príručka veľkostí so špecifikáciami produktov →
  link: /size-guide
  cards:
    - title: SUP Dosky
      desc: Vyberte dĺžku podľa váhy a zamýšľaného použitia. Širšie dosky (32"+) ponúkajú väčšiu stabilitu. Dlhšie dosky (11–12 stôp) lepšie sledujú trasu pri turistike.
    - title: Kajaky
      desc: Jednomiestne kajaky (9 stôp) pre solo cestovanie a rieky. Tandemové kajaky (12 stôp) pre dvoch kajakárov alebo jedného s vybavením. Vždy skontrolujte nosnosť.
    - title: Člny a RIBs
      desc: Vyberte dĺžku podľa počtu pasažierov a použitia. Väčšie RIBs (4,5 m+) pre otvorené moria a záchranu. Menšie člny (2,7 m) ako pomocné lode a rybárske platformy.
