hero:
  tagline: Centrum výskumu a vývoja
  title: Centrum výskumu a vývoja
  subtitle: Zamerané na pokrok
intro:
  - Paddle Board OverstockVýskumné a vývojové (R&D) centrum je hnacou silou našej misie revolučne zmeniť vybavenie na vodné športy. Posilňujeme nadšencov vodných športov po celom svete bezpečnejšími, pohodlnejšími a príjemnejšími produktmi prostredníctvom neúnavných inovácií v oblasti nafukovacích paddleboardov (SUPs) a lodí. Náš oddaný tím inžinierov, dizajnérov a zanietených odborníkov na vodné športy formuje budúcnosť odvetvia, neustále zvyšujúc latku kvality, výkonu a udržateľnosti.
  - Naše výskumné a vývojové centrum spája materiálových vedcov, lodných architektov a výrobných inžinierov pod jednou strechou. Od formulácie textílií a simulácie trupu až po vývoj zváracích procesov až po plnohodnotné námorné skúšky – každá fáza vývoja produktu je riadená dátami a overovaná testovaním.
mission:
  tagline: Naša misia
  title: Inovácia budúcnosti vodných športov
  pillars:
    - icon: lightning
      title: Technologický pokrok
      desc: Priekopnícky vývoj nových materiálov, dizajnov a výroby pre vynikajúci výkon produktov a dlhú životnosť.
    - icon: design
      title: Dizajn orientovaný na používateľa
      desc: Hlboké pochopenie a prekonávanie potrieb používateľov prostredníctvom ergonomického a intuitívneho dizajnu produktov.
    - icon: globe
      title: Udržateľné postupy
      desc: Minimalizujeme našu environmentálnu stopu využívaním ekologických materiálov a procesov.
    - icon: shield
      title: Nekompromisná bezpečnosť
      desc: Zabezpečenie najvyšších bezpečnostných štandardov prostredníctvom prísneho testovania a certifikácie.
pillars:
  - title: Technologický pokrok
    desc: Priekopnícky vývoj nových materiálov, dizajnov a výrobných procesov, aby sme priniesli vynikajúci výkon produktu a jeho životnosť.
    icon: tech
  - title: Pokročilé materiály
    desc: Skúmanie PVCnajmodernejších, Hypalonkompozitov a udržateľných alternatív pre lepšie vlastnosti produktu.
    icon: materials
  - title: Udržateľnosť
    desc: 'Základný záväzok: Sme oddaní environmentálnej starostlivosti prostredníctvom udržateľnej výroby a recyklovateľných materiálov.'
    icon: sustainability
capabilities:
  tagline: Možnosti
  title: Možnosti výskumu a vývoja
  subtitle: Štyri základné disciplíny, ktoré nám dávajú komplexnú kontrolu nad vývojom produktov — od výskumu surovín až po finálnu certifikáciu.
  groups:
    - title: Materiálová veda a technológia tkaní
      items:
        - PVC a Hypalon analýzu formulácie a optimalizáciu
        - UV Stabilizácia, retardancia plameňa a vývoj antimikrobiálnych prísad
        - Viacvrstvová laminácia a inžinierstvo priľnavosti textílií
        - Testovanie zrýchleného starnutia (UVtepelné, vlhké, slané striekanie)
    - title: Trupové inžinierstvo a hydrodynamika
      items:
        - Parametrický 3D dizajn trupu a optimalizácia CFD
        - Analýza konečných prvkov pre konštrukčné a nárazové zaťaženie
        - Testovanie modelov v ťahovej nádrži a overovanie výkonu
        - Vývoj vlastných trupov pre špeciálne misijné profily
    - title: Technológia zvárania a spájania
      items:
        - Vývoj a optimalizácia RF dielektrického zváracieho procesu
        - Metódy zvárania horúcim vzduchom, horúcim klinom a ultrazvukom
        - Kvalifikácia lepeného spojenia a pásky na švy
        - Modelovanie pevnosti zvárania a predikcia životnosti
    - title: Testovanie, certifikácia a súlad
      items:
        - Riadenie kvality a testovanie súladu s CE
        - Podpora nezávislého testovania a certifikácie tretích strán
        - Vývoj vlastných testovacích protokolov pre kvalifikáciu obstarávania
        - Analýza zlyhania v prevádzke a vyšetrenie príčiny
