  tagline: Vlastný výskum a vývoj
  title: Služby výskumu a vývoja pre partnerov
  services:
    - title: Vývoj vlastných materiálov
      desc: Vyvíjame formulácie látok, vrstvenie laminátov a lepiace systémy prispôsobené vašemu prostrediu a výkonnostným cieľom.
    - title: OEM / ODM Produktové inžinierstvo
      desc: Od konceptových skíc po výrobu pripravené inžinierske balíky — náš tím dokáže navrhnúť, vyrobiť prototyp a overiť lode pod vašou značkou.
    - title: Testovanie a certifikácia tretích strán
      desc: Využite naše testovacie zariadenia v súlade s ISO pre nezávislé testovanie materiálov, overenie produktu a podporu certifikácie.
  cta: Prediskutujte vaše požiadavky na výskum a vývoj →
  cta_link: /contact
vision:
  tagline: Naša vízia
  title: Formovanie budúcnosti vodných športov
  body: Paddle Board Overstock sa usiluje viesť priemysel nafukovacích lodí a SUP prostredníctvom neustálych inovácií, neochvejnej kvality a pevného záväzku k bezpečnosti a udržateľnosti — nakoniec obohacujúc zážitky nadšencov vodných športov po celom svete. Vývojové centrum Paddle Board Overstock je miestom, kde sa vášeň stretáva s inováciou, stanovujúc nové štandardy pre priemysel vodných športov.
labs_section:
  tagline: Laboratóriá
  title: Naše laboratóriá
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC Tkaninové laboratórium
      description: Kontinuálny výskum a testovanie tkanín trubíc PVC a Hypalon na ťahovú pevnosť, odolnosť UV, odieranie a ohybnosť pri nízkych teplotách s cieľom zabezpečiť dlhodobú spoľahlivosť v námornom prostredí.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Hull Inžinierske Štúdio
      description: CAD-riadený dizajn a analýza konečných prvkov trupov z HDPE, hliníka a sklolaminátu. Každý trup je digitálne simulovaný pre rozloženie napätia a odolnosť proti nárazu ešte predtým, než je vyrobený prvý prototyp.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF zváracie centrum
      description: Špecializované zariadenie na rádiofrekvenčné zváranie s presnou reguláciou teploty a tlaku, vyrábajúce vysokopevné, vzduchotesné švy, ktoré spĺňajú štandardy lodného priemyslu pre nafukovacie plavidlá.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Hydrodynamická testovacia nádrž
      description: Testovanie mierkového modelu v našom vnútornom testovacom tanku na optimalizáciu tvaru trupu, výkonnosti pri plánovaní, stability a efektívnosti paliva v rôznych zaťaženiach a morských podmienkach.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypová dielňa
      description: Plnohodnotné prototypovanie a zariadenie na prípravu, kde sa vyrábajú, montujú a skúšajú nové modely na mori. Každý prototyp prechádza minimálne 20-hodinovým testovacím programom vo vode pred schválením výroby.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Laboratórium kvality a kontroly
      description: Špecializovaná laboratórium kontroly kvality vykonávajúce ťahové testy, testy cyklovania vzduchotesnosti, testy oddeľovania švov a certifikáciu materiálov, aby sa zabezpečilo, že každá loď opúšťajúca dielňu spĺňa naše zverejnené špecifikácie.
      href: /randdcenter/quality-inspection-lab
