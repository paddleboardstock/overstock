content_challenge:
  tagline: Výzva
  title: Rybárske lode potrebujú<br />Stabilitu, dosah a odolnosť
  subtitle: Či už prevádzkujete komerčné rybárske plavidlá, riadite družstevnú flotilu alebo organizujete rybárske charterové služby — vaša loď musí každý deň pracovať spoľahlivo.
  paragraphs:
    - Rybárske lode potrebujú stabilné platformy na manipuláciu so sieťami, lovom rýb a bezpečné pohybovanie sa po palube. Nafukovacie lode a RIBs ponúkajú inherentnú stabilitu vďaka dizajnu trubíc — významná výhoda oproti pevným trupom podobnej dĺžky.
    - Úspora paliva je dôležitá pre rybárske prevádzky, kde prevádzkové náklady priamo ovplyvňujú ziskovosť. RIBs a nafukovacie lode sú ľahšie ako ekvivalentné pevné lode, vyžadujú menej výkonu a spaľujú menej paliva — kľúčové pre komerčných prevádzkovateľov, ktorí lode prevádzkujú denne, a družstvá, ktoré manažujú rozpočty flotily.
    - Odolnosť v morských podmienkach je základná. Slaná voda, UV vystavenie a neustále používanie vyžadujú materiály, ktoré zvládnu drsné podmienky bez degradácie. Pre komerčných a družstevných prevádzkovateľov spoľahlivosť priamo ovplyvňuje príjem — pokazená loď znamená stratené rybárske dni.
    - Paddle Board Overstock rybárske konfigurácie zahŕňajú držiaky prútov, sonary, návnadové boxy, živé nádrže a riešenia pre manipuláciu s nákladom, navrhnuté pre seriózne rybárske aplikácie v rámci komerčných, družstevných a rekreačných prevádzok.
content_solution:
  tagline: Riešenie
  title: Rybársky pripravené konfigurácie
  subtitle: Každá Paddle Board Overstock rybárska loď môže byť nakonfigurovaná pre vašu špecifickú rybársku aplikáciu.
  list:
    - Montáž držiaka prúta — továrensky nainštalovaný alebo pripravený na dodatočnú inštaláciu
    - Montážna doska pre sonar/GPS na konzole
    - Možnosti návnadového boxu alebo živej nádrže pre charterových a komerčných prevádzkovateľov
    - Chladiace/skladovacie konfigurácie pre manipuláciu s úlovkom
    - Trup Deep-V pre schopnosť offshore — stabilný v pokoji, hladký pri rýchlosti
    - alebo PVC Hypalon možnosti trubice — Hypalon pre UV dlhšiu expozíciu
    - Vonkajšie motory sa pohybujú od 15 HP do 115 v HP závislosti od modelu a použitia
content_segments:
  tagline: Rybárske profily
  title: Riešenia pre nafukovacie rybárske lode<br />Podľa typu operátora
  subtitle: Od pobrežného športového rybolovu až po komerčné longlinovanie — rôzne rybárske operácie vyžadujú rôzne konfigurácie trupu, dosahy výkonu a nastavenia na palube. Každú loď prispôsobujeme tak, aby zodpovedala rybolovu, vodám a štýlu práce.
  items:
    - title: Komerčné rybárske spoločnosti
      subtitle: Flotilové pracovné lode určené na každodenné rybárske operácie, manipuláciu so sieťami, prepravu úlovkov
      description: Komerčné rybárske spoločnosti prevádzkujú pracovné lode na kladenie a vyťahovanie sietí, servis pascí, dlhé linky a prepravu úlovkov. Tieto lode pracujú každý deň v morských vodách a musia odolávať ťažkým nákladom, neustálemu manipulovaniu na palube a dlhým prevádzkovým hodinám. Úspornosť paliva a nízka údržba sú kľúčové pre ziskovosť flotily. Plavidlo musí poskytovať stabilné pracovné platformy pre manipuláciu s vybavením posádky a úlovky v rôznych morských podmienkach.
      features:
        - Rozloženie plochej paluby na manipuláciu so sieťami, skladanie pascí a skladovanie rýb
        - Úsporný motor 40-115 HP pre nízke denné prevádzkové náklady
        - Hypalon Ťažké trubice pre odolnosť proti oderu pri každodennom používaní
        - Zosilnené trecie lamely pre častý kontakt s mólom a plavidlom
        - Samo-vysávacia paluba pre jednoduché umývanie po operáciách
        - Ceny flotily a konzistentné špecifikácie pre prevádzkovateľov viacerých plavidiel
    - title: Prevádzkovatelia charterového rybolovu
      subtitle: Pohodlie pre viacerých pasažierov, ovládanie záchytu, bezpečnostná certifikácia
      description: Prevádzkovatelia prevádzkujú poldňové a celodenné rybárske chartery — od rybolovu na pobrežných útesoch až po rybolov na dne pri mori. Vaša loď potrebuje miesta pre pasažierov s bezpečnostnými certifikátmi, dostatok priestoru na palube pre viacerých rybárov a integrované živé priestory na udržanie návnady a úlovku čerstvého počas celej plavby. Pohodlie hostí priamo ovplyvňuje recenzie výletov, opakované rezervácie a online hodnotenia.
      features:
        - Riadenie na konzole s tlmiacimi športovými sedadlami
        - Z výroby inštalované držiaky na tyče (4–8 pozícií)
        - 60–115 HP dosah pre offshore cestovné rýchlosti
        - CE Certifikácia kategórie C alebo B pre komerčnú osobnú dopravu
        - Bimini alebo T-top slnečná clona pre pohodlie hostí na dlhších cestách
    - title: Remeselní a malí komerční rybári
      subtitle: Spoľahlivé pracovné lode na každodenné živobytie
      description: Nezávislí rybári, ktorí sa spoliehajú na svoju loď ako na svoj hlavný zdroj príjmu — kladie siete, starajú sa o pasce na ryby alebo ručne napájajú pri brehu. Vašou prioritou je úspora paliva, jednoduchá údržba, ktorú zvládnete sami, a loď, ktorá zvládne stredné zaťaženie úlovku a vybavenia bez obetovania stability.
      features:
        - Úsporný motor 15–40 HP pre nízke prevádzkové náklady
        - Hypalon CSM Trubice na predĺženie UV a odolnosť voči oderu
        - Rozloženie plochej paluby na manipuláciu so sieťami a skladovanie rýb
        - Jednoduchá schopnosť pristátia na pláži s nafukovateľnou ochranou kýlu
    - title: Rybárske družstvá
      subtitle: Zber úlovkov, preprava členov, distribúcia zásob
      description: Rybárske družstvá prevádzkujú komunitné flotily na zber úlovkov od členských rybárov, prepravu zásob do odľahlých rybárskych komunít a distribúciu úlovku na trhy. Tieto pracovné lode potrebujú vysokú nosnosť, spoľahlivú každodennú prevádzku a jednoduchú údržbu na odľahlých miestach. Družstvá často pôsobia v rozvíjajúcich sa regiónoch, kde je dostupnosť dielov a prístup k službám obmedzený, preto sú jednoduché prívodné konfigurácie a odolná konštrukcia nevyhnutné.
      features:
        - Vysoká nosnosť na prepravu úlovkov a zásob
        - Jednoduchá vonkajšia konfigurácia pre jednoduchý servis priamo na mieste
        - Ťažké vozidlá PVC alebo Hypalon stavebníctvo pre flexibilitu rozpočtu
        - Plochá paluba s upevňovacími bodmi na zabezpečenie nákladu
        - Úsporná prevádzka minimalizujúca prevádzkové náklady na spoluprácu
    - title: Nadšenci športového a športového rybolovu
      subtitle: Výkon a štýl pre vážnych rybárov
      description: Skúsení rybári hľadajú schopnú rybársku platformu, ktorá dodá rýchlosť na vzdialené miesta, stabilné bojové pozície a prémiovú fit-and-finish kvalitu. Loď sa musí cítiť ako doma, či už plavíte dve míle od pobrežia k útesu alebo skúmate odľahlé ústia riek.
      features:
        - RIB Hlboký V trup pre hladkú jazdu v rozberaní
        - Fishfinder/GPS montážna platňa predzapojená na konzole
        - Baitwell a chladič integrované do zadného sedadlového modulu
        - EVA Vlastné farebné možnosti paluby zodpovedajúce grafike lodí/trubiek
    - title: Rybársky sprievodca a prevádzkovatelia ekologických výletov
      subtitle: Skúsenosti s riadeným rybolovom pre návštevníkov
      description: Sprievodcovia, ktorí berú malé skupiny návštevníkov rybárov na produktívne rybárske miesta — často kombinujú rybolov s ekoturistickými prvkami, ako je pozorovanie vtákov alebo objavovanie mangrovov. Loď musí byť suchá a pohodlná pre hostí, ktorí nie sú zvyknutí na malé lode, s jednoduchým nastupovaním a tienistými možnosťami.
      features:
        - Bimini vrchné alebo T-vrchné montážne body z výroby
        - Hladký vstupný rebrík na nástup pre jednoduché opätovné nastupovanie
        - Tichý štvortaktný vonkajší motor na minimalizáciu rušenia
        - Suché úložné priestory na hosťovské telefóny, peňaženky, fotoaparáty
