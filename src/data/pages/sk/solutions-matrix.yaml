hero:
  tagline: Matica priemyselných riešení
  title: Riešenia založené na scenároch<br />Pre profesionálne operácie
  subtitle: Účelovo navrhnuté nafukovacie vodné plavidlá, konfigurované RIBs na záchranu, prenájom flotily, jachtárske tendery a komerčné rybárske aplikácie — každé podporované technickými špecifikáciami a možnosťami prispôsobenia.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock Profesionálne námorné riešenia pre rôzne odvetvia
direct_answer: 'Paddle Board Overstock Dodáva scenárovo navrhnuté nafukovacie plavidlá a RIB riešenia pre komerčné námorné operácie: záchranné a hliadkové člny s Hypalon vystuženými rúrami a viackomorovou poistkou, prenájom flotily SUPs a kajakov s 1,2 mm a PVC horúcim vzduchom zváranými švami pre nízku údržbovú odolnosť, luxusné jachtárske tendery s hlbokým V hliníkovým trupom RIBsa ťažké rybárske konfigurácie s držiakmi na prúty a Livewell systémami.'
solution_a:
  tagline: Riešenie A
  title: Námorná záchrana a<br />Obchodná hliadka
  subtitle: Vysokorýchlostná, viackomorová bezpečnosť RIBs pre profesionálnu záchranu a policajné operácie.
  badge: Heavy-Duty Series
  description: Naše námorné záchranné a hliadkové jednotky RIBs sú postavené z HypalonvystuženýchPVC vysokohustotných / vzduchových trubíc s viackomorovým nezávislým plávacím dizajnom. Každé plavidlo je vybavené profesionálnou reflexnou páskou, záchrannými uchopovacími lanami a rýchlo nafukovateľnými ventilmi pre pripravenosť na nasadenie. Deep-V laminátové trupy poskytujú výnimočnú stabilitu pri vysokých rýchlostiach a v rozbúrených morských podmienkach.
  features:
    - title: Viackomorová bezpečnosť
      description: 4–6 nezávislých vzduchových komôr — akákoľvek prepichnutá jedna komora udržiava pozitívnu plávaciu
    - title: Vystužená rúrková tkanina
      description: 1,2 mm Hypalon CSM alebo 1 680 DTEX PVC s dvojvrstvovými zváranými horúcim vzduchom
    - title: Profesionálna kategória
      description: SOLAS Reflexná páska, záchranné laná, ťahacie lana, rýchlo-uvoľňujúca lana maliara
    - title: Vysokorýchlostný trup
      description: Deep-V trup z laminátu alebo hliníka hodnotený na 25–45 uzlov v závislosti od konfigurácie
  recommended_models:
    - RIB 450. hliadka
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materiál trupu
      value: Laminát / hliník námornej kvality
    - label: Rúrková tkanina
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Maximálna rýchlosť
      value: 25–45 uzlov
    - label: Kapacita
      value: 6–12 osôb
    - label: Rozsah motora
      value: 40–200 HP
    - label: Certifikácia
      value: CE / ISO 9001
solution_b:
  tagline: Riešenie B
  title: Prenájom vodných športov &<br />Zariadenie flotily rezortu
  subtitle: Ultra-odolné, nenáročné na údržbu nafukovacie SUPs, kajaky a lode určené na každodenný prenájom v rezortoch, kluboch a turistických prevádzkach.
  badge: Rental-Grade
  description: Naše zariadenia z prenajímanej flotily sú navrhnuté pre najvyššiu odolnosť a najnižšie náklady na údržbu. Používame 1,2 mm vystužený PVC s technológiou trojvrstvového zvárania horúcim vzduchom, ktorá odoláva degradácii UV a častému poškodeniu pri náraze. Konštrukcia Drop-stitch zabezpečuje, že dosky si zachovávajú tuhosť aj po stovkách prenájomných cyklov. Všetky modely majú vystužené D-krúžky, odolné proti oderu koľajnicové pásy a ventily komerčnej kvality.
  features:
    - title: Komerčná kvalita PVC
      description: 1,2 mm zosilnený PVC s UV stabilizátormi — 3× hrubší ako materiály spotrebiteľskej kvality
    - title: Horúcim vzduchom zvárané švy
      description: Trojvrstvové fúzne zváranie — silnejšie než lepené spojenie, odoláva delaminácii
    - title: Drop-Stitch Tuhosť
      description: 1 680 DTEX jadro s 2 vláknami/palec² — hodnotené na 20 PSI pre tvrdosť podobnú tvrdému drevovláknu
    - title: Dizajn pripravený na flotilu
      description: Spevnené D-krúžky, komerčné ventily Halkey-Roberts, pásy odolné voči oderu
  recommended_models:
    - SUP Výpad geparda
    - SUP Oceánsky cestovateľ
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materiál trubice
      value: 1,0–1,2 mm vystužené PVC
    - label: Švová technológia
      value: Trojnásobné zváranie horúcim vzduchom
    - label: Maximálny tlak
      value: 15–20 PSI (drop-stitch modely)
    - label: Odolnosť UV
      value: 1 000+ hodín zrýchleného testovania
    - label: Záruka
      value: 2–5 rokov v závislosti od modelu
    - label: Údržba
      value: Minimálne — opláchnite a uskladnite
solution_c:
  tagline: Riešenie C
  title: Jachtné člny &<br />Luxusné plavidlo
  subtitle: Ľahké, výkonné člny RIB navrhnuté na uskladnenie na superjachtech a prepravu hostí s luxusným vybavením a spracovaním.
  badge: Premium Series
  description: Náš jachtový člun RIBs kombinuje ľahkú konštrukciu s luxusnou estetikou. Trup z hliníka alebo sklolaminátu s hlbokým V poskytuje vynikajúcu kvalitu jazdy a ľahké zdvíhanie pomocou davitu. K dispozícii s farebne zladenou grafikou na trubkách, prémiovým čalúnením a vlastným usporiadaním konzoly. Kompaktné rozmery na skladovanie ich robia ideálnymi pre garáže superjacht a skladovanie na palube.
  features:
    - title: Ľahká konštrukcia
      description: Trup z oceľou odolného hliníka znižuje hmotnosť o 30 % v porovnaní so sklolaminátom pre jednoduché zdvíhanie
    - title: Výkon Deep-V
      description: Trup s deadrise 18–22 stupňov pre plynulú jazdu v rozbúrenej vode a vynikajúce sleovanie
    - title: Luxusné spracovanie a vzhľad
      description: Vlastné čalúnenie, trubky farebne zladené, prémiová konzola kormidla, balík z nehrdzavejúcej ocele
    - title: Kompaktné úložisko
      description: Navrhnuté pre garáže superjacht — nafukovacie trubice na kompaktné uloženie
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Typ trupu
      value: Hlboké-V hliník / sklolaminát
    - label: Štípanie trupu
      value: 18–22 stupňov
    - label: Maximálna rýchlosť
      value: 30–40 uzlov
    - label: Suchá hmotnosť
      value: 120–350 kg (hliníkový trup)
    - label: Davit pripravený na zdvih
      value: Áno — štandardné zdvíhacie body
    - label: Úložisko
      value: Dúchateľné trubice, stohovateľné
