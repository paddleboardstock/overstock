hero:
  tagline: Paddle Board Overstock Vlastné laboratórium
  title: Navrhnite si vlastnú<br />vodnú dopravu
  subtitle: OEM, ODM, súkromný štítok a služby vlastnej značky pre podniky po celom svete. Od jediného prototypu až po úplné výrobné série.
  cta: Začnite svoj projekt
  footer_link: /contact
steps_section:
  tagline: Ako to funguje
  title: Od konceptu po výrobu
  subtitle: Štyri kroky od vašej myšlienky po hotový produkt pripravený na vodu.
  steps:
    - num: '01'
      title: Vyberte si svoju dosku
      desc: Vyberte z našich základných modelov — SUP, kajak, čln alebo RIB. Zvoľte veľkosť, materiál a farbu.
    - num: '02'
      title: Nahrajte svoj dizajn
      desc: Pošlite nám svoje logo, umelecké dielo alebo smernice značky. Náš dizajnérsky tím pripraví digitálny náhľad.
    - num: '03'
      title: Kontrola AI mockupu
      desc: Zobraziť fotorealistický AI generovaný mockup vašej vlastnej dosky pred začatím výroby.
    - num: '04'
      title: Výroba a dodanie
      desc: Po schválení vaša objednávka vstúpi do našej výrobnej linky certifikovanej ISO. Dodacie lehoty od 30 dní.
services_section:
  tagline: Služby
  title: Výrobné služby pre svetové značky
  subtitle: Flexibilné modely spolupráce — od zmluvnej výroby po budovanie značky na kľúč.
  items:
    - title: OEM Výroba
      desc: Vyrobíme vaše návrhy podľa špecifikácií — vaše duševné vlastníctvo, vaše výkresy, vaše štandardy kvality. Úplná ochrana NDA.
      icon: ⚙️
    - title: ODM Riešenia
      desc: Vyberte si z 50+ overených platforiem a upravte veľkosť, farbu, grafiku a balenie.
      icon: 🎨
    - title: Privátna značka
      desc: Vaša značka na našich produktoch — logo, balenie, visačky, návody. Na predaj pripravené hneď po vybalení.
      icon: 🏷️
    - title: Vlastné branding
      desc: Tlač podložiek na palubu, grafika trupu, nálepky na rúrky a vlastné štítky — úplná integrácia značky.
      icon: ✨
capabilities_section:
  tagline: Možnosti
  title: Výrobné a prispôsobovacie možnosti
  subtitle: Všetko, čo potrebujete vedieť pred zadaním objednávky.
  capabilities:
    - label: Objem objednávky
      value: MOQ 5–10 kusov (SUP/kajak), 2–5 kusov (RIB)
    - label: Dodacia lehota
      value: 30–45 dní štandard; 15–20 dní pre prototypy
    - label: Prispôsobenie
      value: Veľkosť, tvar, farba, grafika, balenie, hardvér
    - label: Materiály
      value: PVC, Hypalon, drop-stitch, sklolaminát, hliník
    - label: Tlač
      value: Digitálna (CMYK), sieťotlač, tepelný prenos, sublimačná tlač
    - label: Certifikácia
      value: CE, ISO 9001, BSCI, UKCA (podpora pre globálnu súladnosť)
why_section:
  tagline: Prečo Paddle Board Overstock
  title: Jedna továreň. Jeden štandard. Žiadne kompromisy.
  points:
    - text: Integrované výrobná prevádzka 12 000 m²
      highlight: 12 000 m²
    - text: 200–300 kvalifikovaných pracovníkov a inžinierov
      highlight: 200-300
    - text: 15 000 lodí vyrobených ročne
      highlight: 15,000
    - text: ISO 9001 certifikované riadenie kvality
      highlight: ISO 9001
    - text: CE certifikované produkty pre trh EÚ
      highlight: CE
  cta: Zobraziť podrobnosti o továrni
  cta_link: /factory
  contact:
    title: Pripravení prediskutovať váš projekt?
    desc: Náš tím odpovie do 24 hodín s predbežnou cenovou ponukou.
