content_challenge:
  tagline: Výzva
  title: Požiadavky akvakultúry<br />Odolné vybavenie proti slanej vode
  subtitle: Rybárske farmy, perlové farmy a morské ranče fungujú v najchemicky agresívnom morském prostredí — dlhodobé vystavenie slanej vode, zvyšky paliva a krmiva a každodenné nepretržité používanie.
  paragraphs:
    - Prevádzky akvakultúry prebiehajú 365 dní v roku v otvorenom pobrežnom a offshore prostredí. Pracovné lode používané na kontrolu klietok, prepravu krmiva, údržbu perlových lán a servis vybavenia sú neustále vystavené ponoreniu do slanej vody, UV vystaveniu a chemickému kontaktu s palivom, krmivom pre ryby a prostriedkami proti biofoulingu.
    - '**Korózia je hlavným nepriateľom** — Štandardné morské vybavenie sa v týchto podmienkach rýchlo kazí. Prívesné motory, rámy prívesov a príslušenstvo trupu je potrebné neustále vymieňať. Prevádzkovatelia potrebujú lode vyrobené z materiálov odolných proti korózii, ktoré dokážu vydržať roky v tomto prostredí bez degradácie.'
    - '**Denná spoľahlivosť je kritická** — Nefunkčná pracovná loď znamená vynechané plány kŕmenia, oneskorené žatvy a drahé straty v produkcii. Pre perlové farmy môže jediný deň vynechanej kontroly znamenať značné poškodenie úrody. Pre rybie farmy oneskorené kŕmenie ovplyvňuje rýchlosť rastu a ziskovosť.'
    - Paddle Board Overstock akvakultúra RIBs je navrhnutá s odolným proti korózii hardvérom, ťažkými Hypalon trubicami a zosilneným trupom určeným špeciálne pre náročné podmienky chovu rýb, pestovania perál a prevádzky morských rančov.
content_solution:
  tagline: Riešenie
  title: Účelovo vytvorené RIBs<br />Pre priemysel akvakultúry
  subtitle: Každá Paddle Board Overstock pracovná loď pre akvakultúru je navrhnutá tak, aby odolala agresívnemu prostrediu slanej vody a zároveň poskytovala spoľahlivú každodennú prevádzku.
  list:
    - Trubice triedy pre námorné použitie — vynikajúca odolnosť voči UV, slanej vode, palivám a chemikáliám krmiva pre ryby
    - Hardvér z nehrdzavejúcej ocele 316 — žiadna hrdza pri dlhodobom vystavení slanej vode
    - Zosilnené ochranné lišty a chránič kýlu pre opakovaný kontakt s dokmi a klietkami
    - Samovypúšťacia paluba pre jednoduché umývanie a odvod po preprave krmiva a žatve
    - Konfigurácia plochej paluby na prepravu vrecia krmiva, zberných nádob a vybavenia
    - Vonkajšie konfigurácie od 15 HP do 60 HP — optimalizované pre nosnosť vs. úspornosť paliva
    - Vysoko viditeľné farebné varianty trubiek pre ľahké rozpoznanie na veľkých farmárskych plochách
content_segments:
  tagline: Profily akvakultúry
  title: Workboat Solutions<br />Podľa typu akvakultúry
  subtitle: Rôzne akvakultúrne prevádzky majú rôzne požiadavky na pracovné lode — od malých agilných RIBs na kontrolu v rybích klietkach až po stabilné transportné platformy pre pestovanie perál a ťažké pracovné lode pre morský chov.
  items:
    - title: Rybárske prevádzky
      subtitle: Kontrola klietok, preprava krmiva, podpora zberu
      description: Morské rybie farmy prevádzkujú klietky v exponovaných pobrežných a pobrežných oblastiach. Pracovné lode sa denne používajú na kontrolu klietkových sietí, kŕmenie, podporu zberu a údržbu vybavenia. Hlavnou výzvou je korózia — lode sú neustále vystavené slanej vode, zvyškom krmiva pre ryby a palivu. Spoľahlivá pracovná loď je nevyhnutná, pretože zmeškané kŕmenie alebo oneskorený zber priamo ovplyvňujú produkciu a ziskovosť.
      features:
        - 'Balík pre agresívne prostredie: 316 nerezových prvkov, komponenty z námornej zliatiny'
        - Rozloženie plochej paluby pre prepravu vrecia krmiva a zberných nádob
        - Samo-vysávacia paluba pre jednoduché umývanie po operáciách
        - Hypalon trubice s chemicky odolným povlakom pre podávanie a palivo
        - Zosilnené trecie pásy pre častý kontakt klietky a móla
    - title: Perlové farmárske operácie
      subtitle: Stabilná preprava na kontrolu a zber perlových línií
      description: Perlové farmy vyžadujú stabilné, spoľahlivé pracovné lode na každodennú prepravu medzi perlovými lanami, kontrolu ustricových sietí a zber úrody. Tieto operácie prebiehajú v odľahlých pobrežných oblastiach s obmedzenou údržbovou infraštruktúrou. Loď musí byť dostatočne stabilná, aby posádka mohla pracovať pri kontrole perlových lan, s jednoduchým nastupovaním a dostatočným priestorom na palube na prepravu ulovených ustríc, sietí a zásob. Spoľahlivosť a jednoduchá údržba sú kľúčové na odľahlých farmách.
      features:
        - Dizajn stabilného trupu pre stálu posádku počas inšpekcie perleťových línií
        - Plochá paluba s protišmykovým povrchom pre bezpečný pohyb posádky
        - Nízky bok na palube pre jednoduchý prístup k ústricovým sieťam a zberu
        - Jednoduchá vonkajšia konfigurácia pre jednoduchý servis priamo na mieste
        - Rúrka odolná voči korózii a hardvérový balík pre nepretržité vystavenie slanej vode
    - title: Oceánske rančovanie a zlepšovanie námorníctva
      subtitle: Preprava mladistvých, servis klietok, podpora monitorovania
      description: Oceánske farmárske operácie zahŕňajú vypúšťanie mladých zvierat do spravovaných morských prostredí, monitorovanie rastu a údržbu budov na vylepšenie. Pracovné lode musia prepravovať živé mladé zvieratá v prevzdušnených kontajneroch, prepravovať monitorovacie zariadenia a pristupovať k plytkým pobrežným miestam vypúšťania. Dizajn trupu musí vyvážiť nosnosť s plytkým ponorom pre prístup k plážam a ústiam riek.
      features:
        - Palubný priestor pre prevzdušnené kontajnery na prepravu mladistvých a monitorovacie zariadenia
        - Plytký ponor pre prístup na pláž a miesta vypúšťania ústí riek
        - Jednoduché pristátie na pláži — zosilnená ochrana kýlu a prídi
        - Montážne body zariadení na monitorovanie elektroniky a vzorkovacích zariadení
        - Ťažké Hypalon rúrky pre odolnosť v zmesných podmienkach piesku a morskej vody
