certifications:
  - title: CE Certifikácia (EÚ 2016/425)
    standard: Nariadenie o OOP (EÚ) 2016/425 | EN ISO 12402
    description: Paddle Board Overstock Všetko bezpečnostné CE vybavenie spĺňa požiadavky na označovanie podľa Európskeho nariadenia o osobných ochranných pomôckach. Každý produkt je nezávisle testovaný TÜV Rheinlandom, európskym oznámeným orgánom. Naše nafukovacie člny RIBs spĺňajú požiadavky smernice o rekreačných plavidlách 2013/53/EÚ (RCD) kategórie C a D.
    body: CE Certifikácia pokrýva základné požiadavky na zdravie a bezpečnosť pre osobné plávacie zariadenia a nafukovacie plavidlá.TÜV Rheinland každoročne audituje naše výrobné zariadenie, aby overil priebežné dodržiavanie predpisov.
  - title: SOLAS — Bezpečnosť života na mori
    standard: SOLAS Kapitola III | Kód LSA
    description: Life Vest Pro spĺňa SOLAS predpisy pre offshore a komerčné námorné operácie. Testovaná na 24-hodinovú vztlakovú stabilitu, automatické nafukovanie pri ponorení a výkon v morských stavoch až do sily 5. Spĺňa požiadavky kapitoly III pre záchranné vesty na komerčných plavidlách.
    body: SOLAS Schválenie vyžaduje nezávislé testovanie notifikovaným orgánom na vztlak, pevnosť, viditeľnosť a automatickú aktiváciu. Naša Life Vest Pro má SOLAS plné typové schválenie s certifikáciou MED.
  - title: USCG Typ III / Typ V
    standard: 46 CFR Časť 160 |USCG Schválenie
    description: Vybrané Paddle Board Overstock záchranné vesty spĺňajú klasifikáciu pobrežnej stráže Spojených štátov pre zariadenia typu III (plávacia pomôcka) a typu V (špeciálne použitie). Vhodné pre chránené vody, pobrežné plavby a komerčné operácie vyžadujúce USCGschválené PFD.
    body: USCG Schválenie vyžaduje testovanie nezávislým laboratóriom uznaným CG. Schválenie typu V zahŕňa hybridné nafukovacie konštrukcie, ktoré vyžadujú manuálnu alebo automatickú aktiváciu.
  - title: BSCI Sociálna súladnosť
    standard: BSCI Kódex správania amfori
    description: Naša továreň je každoročne auditovaná v rámci iniciatívy amfori Business Social Compliance Initiative (BSCI). Táto certifikácia overuje etické pracovné praktiky, bezpečnosť na pracovisku, spravodlivý pracovný čas a environmentálne riadenie v našom výrobnom zariadení s rozlohou 12 000 m².
    body: BSCI súlad je predpokladom pre európskych maloobchodníkov a dovozcov. Naše BSCI aktuálne hodnotenie je "C" (Dobré), auditované SGS.
  - title: '& REACH RoHS Dodržiavanie predpisov'
    standard: Nariadenie EÚ REACH (ES) 1907/2006 |RoHS Smernica 2011/65/EÚ
    description: Všetky PVC zlúčeniny, lepidlá a povlaky používané v Paddle Board Overstock produktoch spĺňajú REACH predpisy EÚ o chemickej bezpečnosti a RoHS obmedzenia týkajúce sa nebezpečných látok. Pre každú produktovú radu sú dostupné bezpečnostné listy materiálov (MSDS).
    body: REACH dodržiavanie predpisov zabezpečuje, že žiadne obmedzené látky SVHC neprekročia prahové limity. Pravidelné testovanie v laboratóriách tretích strán overuje priebežnú súladnosť pre každú výrobnú dávku.
  - title: ISO 9001:2015 Manažment kvality
    standard: ISO 9001:2015 |TÜV Certified Rheinland
    description: Náš systém riadenia kvality je certifikovaný ISO 9001:2015 spoločnosťou TÜV Rheinland a pokrýva dizajn, výrobu, testovanie a popredajné služby. Ročné kontrolné audity zabezpečujú neustále zlepšovanie a kontrolu procesov.
    body: ISO Certifikácia 9001 vyžaduje zdokumentované politiky kvality, interné audity, manažérske kontroly, postupy nápravných opatrení a sledovateľné výrobné záznamy.
testimonial:
  quote: Zabezpečili sme bezpečnostné vybavenie od viacerých dodávateľov po celej Ázii.Paddle Board Overstock je jediným výrobcom, ktorý poskytol CE kompletnú dokumentáciu SOLAS , certifikáty a testovacie správy od tretích strán vopred — bez toho, aby o to bol požiadaný.
  author: Erik Lindström
  title: Bezpečnostný dôstojník
  company: Baltské námorné zásobovanie
  location: Fínsko
content_overpressure:
  tagline: Bezpečnosť proti nadtlaku
  title: RIB Tlak v trubici<br />Manažment v horúcom podnebí
  subtitle: Tlak nafukovacích trubiek rastie s teplotou. Pochopenie a riadenie nadtlaku zabraňuje poškodeniu a zabezpečuje bezpečnú prevádzku v tropických a púštnych prostrediach.
  items:
    - title: Boyleove poistné ventily
      description: Paddle Board Overstock RIB Trubice sú vybavené ventilmi na uvoľnenie pretlaku, ktoré automaticky odvádzajú nadtlak nad menovité maximum. Zabraňuje namáhaniu spoja a možnému prasknutiu rúrky pri solárnom ohrevi.
      icon: tabler:gauge
    - title: Zmena tlaku od rána do poludnia
      description: Trubica nafúknutá na 3,5 pri PSI 20 °C môže dosiahnuť 4,5 pri+ PSI 40 °C vystavení slnku. V horúcom podnebí vždy nafukujte na spodný koniec odporúčaného rozsahu a nechajte poistný ventil zvládnuť nadtlak.
      icon: tabler:sun
    - title: Odporúčané prevádzkové tlaky
      description: 'PVC Elektrónky: 3,0-3,5 PSI Prevádzka, PSI 4,5 Max. Hypalon Elektrónky: 3,5-4,0 PSI Prevádzka, PSI 5,0 Max. Vždy testujte na hodnotení 1,25x (4,4 PSI pre PVC, 5,0 PSI pre Hypalon) podľa Paddle Board Overstock štandardov kontroly kvality.'
      icon: tabler:chart-bar
    - title: Najlepšie postupy pri vystavení slnku
      description: Skladujte RIBs v tienistých oblastiach, keď sa nepoužívajú. Používajte UVochranné kryty na dlhšie kotvenie. Skontrolujte a upravujte tlak v trubici pred a po vrchole slnečných hodín. Nikdy neprekračujte maximálny nominovaný tlak.
      icon: tabler:umbrella
    - title: Núdzová dekompresia
      description: Ak sa trubica zdá príliš tvrdá alebo ventil odvádza, uvoľňujte vzduch cez Halkey-Roberts alebo vojenský ventil, kým sa tlak nevráti do prevádzkového rozsahu. Majte so sebou tlakomer pre presné merania.
      icon: tabler:alert-circle
