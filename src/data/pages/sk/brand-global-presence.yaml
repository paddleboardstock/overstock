hero:
  tagline: Globálna prítomnosť
  title: Poskytovanie služieb 50+ krajinám<br />Na každom kontinente
  subtitle: Od európskych operátorov pobrežnej hliadky po austrálskych distribútorov vodných športov a po záchranné tímy na Blízkom východe – Paddle Board Overstock lode sú na vode po celom svete.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock globálna výroba a distribúcia lodí
stats:
