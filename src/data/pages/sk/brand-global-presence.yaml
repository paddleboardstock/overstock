features3_markets:
  tagline: Kľúčové trhy
  title: Regionálne odbornosti<br />pre miestne požiadavky
  subtitle: Chápeme, že rôzne trhy majú rôzne regulačné požiadavky, preferencie a spôsoby využitia.
  isBeforeContent: false
  columns: 4
  items:
    - title: Európa a UK
      description: Produkty certifikované podľa CE, ktoré spĺňajú normy EN ISO 6185. Silná dopyt po RIBs, nafukovacích lodiach a SUP doskách na trhoch EÚ. Distribútori v UK oceňujú naše rýchle dodanie.
      icon: tabler:map-pin
    - title: Severná Amerika
      description: Výroba schválená pobrežnou gardou USA. Sklad v Montclair, CA pre rýchle dodanie na západnom pobreží. Rastúci dopyt po rybárskych lodiach, záchranných plavidlách a rekreačných SUPs.
      icon: tabler:map-pin
    - title: Austrália a Oceánia
      description: Silný trh pre RIB lode a nafukovacie tenderové lode. Austrálske distribútori si cenia naše Hypalon lode pre UV odolnosť voči ostrému slnku. Rýchle doručenie z našej ázijskej prevádzky.
      icon: tabler:map-pin
    - title: Blízky východ
      description: Rastúci dopyt po hliadkových a záchranných lodiach. Naše hliníkové trupové RIBs sú populárne medzi operátormi pobrežnej stráže a bezpečnostnými zložkami. Individuálne konfigurácie pre prostredia s vysokými teplotami.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribučná sieť
  title: Spolupráca s distribútormi<br />Celosvetovo
  subtitle: Spolupracujeme s etablovanými distribútormi námorného vybavenia, značkami OEM a vládnymi nákupnými agentúrami.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerstvá
      description: Výroba pod vlastnou značkou pre globálne značky vodných športov. Zabezpečujeme všetko od návrhu cez výrobu až po drop-shipping.
      icon: tabler:building
    - title: Sieť distribútorov
      description: Autorizovaní distribútori v 20+ krajinách majú skladové zásoby a poskytujú miestnu podporu. Nové žiadosti o distribúciu sú vítané.
      icon: tabler:users
    - title: Vládne a inštitucionálne
      description: Priame dodávky pobrežnej stráži, organizáciám záchrany a pátrania a vojenským nákupným programom. Súlad s požiadavkami inštitucionálneho obstarávania.
      icon: tabler:building-community
steps2_logistics:
  title: Globálna logistika a podpora
  subtitle: Od továrne po miesto určenia — spravujeme celý dodávateľský reťazec.
  items:
    - title: Možnosti dopravy
      description: Námorná doprava (FOB Qingdao), letecká pre urgentné objednávky a expresný kuriér pre vzorky a náhradné diely.
      icon: tabler:truck-delivery
    - title: Sklad v USA
      description: 'Skladové zásoby v Montclair, CA pre rýchle dodanie po celej Severnej Amerike. Západné pobrežie: 2-3 dni, Stred: 3-4 dni, Východné pobrežie: 4-5 dní.'
      icon: tabler:building-warehouse
    - title: Náhradné diely
      description: Originálne Paddle Board Overstock náhradné diely a spotrebný materiál sú skladom počas celého roka. Bežné diely odosielame do 24 hodín.
      icon: tabler:package
    - title: Technická podpora
      description: Priama linka na náš inžiniersky tím pre technické otázky, rady pri oprave a podporu pri rekonštrukcii. Podporujeme člny, ktoré sme postavili pred 20 rokmi.
      icon: tabler:headset
cta:
  title: Chcete sa stať distribútorom?
  subtitle: Aktívne rozširujeme našu distribučnú sieť. Kontaktujte náš exportný tím a diskutujte o možnostiach partnerstva.
  actions:
    - variant: primary
      text: Dopyt po partnerstve
      href: /contact
    - text: Prezrite si náš sortiment produktov
      href: /products
