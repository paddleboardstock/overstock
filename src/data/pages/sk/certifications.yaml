hero:
  tagline: Certifikácie a normy
  title: Kvalitné certifikácie<br />a normy zhody
  subtitle: Paddle Board Overstock produkty sú vyrobené v súlade s medzinárodnými normami pre námornú bezpečnosť, systémami riadenia kvality a environmentálnymi predpismi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock certifikáty kvality a dokumentácia o zhode
content_certifications:
  tagline: Naše certifikácie
  title: Certifikovaná kvalita,<br />Celosvetovo uznávaná
  subtitle: 64 CE certifikovaných modelov a certifikácie celého výrobného závodu dokazujú našu oddanosť kvalite, bezpečnosti a environmentálnej zodpovednosti.
  items:
    - title: CE Certifikované
      description: 64 CE certifikovaných modelov spĺňa európske požiadavky označenia CE pre rekreačné vodné plavidlá, čo zabezpečuje splnenie noriem bezpečnosti, ochrany zdravia a životného prostredia.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Náš systém riadenia kvality je certifikovaný podľa ISO 9001:2015 a pokrýva návrh, výrobu a distribúciu nafukovacích plavidiel a námorného vybavenia.
      icon: tabler:clipboard-check
    - title: UKCA Označené
      description: Produkty predávané na britskom trhu nesú označenie UKCA, ktoré potvrdzuje súlad s britskými predpismi pre námorné vybavenie a osobné vodné plavidlá.
      icon: tabler:shield
    - title: BSCI V zhode
      description: Paddle Board Overstock je auditovaný podľa BSCI (Iniciatíva obchodnej sociálnej zhody), čo demonštruje etické výrobné postupy, férové pracovné podmienky a zodpovednosť v dodávateľskom reťazci.
      icon: tabler:heart-handshake
    - title: REACH V zhode
      description: Všetky materiály používané v Paddle Board Overstock produktoch spĺňajú EU REACH predpisy o chemickej bezpečnosti, čím sa zabezpečuje, že žiadne obmedzené látky nie sú prítomné v našich PVC, Hypalon alebo komponentoch.
      icon: tabler:flask
    - title: Testovanie materiálov
      description: Textílie sú testované na ťahovú pevnosť, odolnosť proti trhaniu, UV degradáciu a odolnosť voči praskaniu pri nízkych teplotách. Každá výrobná dávka je odberaná a overená.
      icon: tabler:test-pipe
content_factory:
  tagline: Normy vo výrobnej továrni
  title: Výrobné majstrovstvo<br />— Vyrobené podľa špecifikácie
  subtitle: Naše zariadenie o rozlohe 12 000 m² funguje podľa prísnych protokolov kontroly kvality v každej fáze výroby.
  list:
    - 'Kontrola vstupných materiálov: Všetky suroviny — PVC textília, Hypalon, hliník, preglejka, lepidlá — sú testované podľa špecifikácií pred vstupom do výroby.'
    - 'Kontrola kvality počas výroby: Každá výrobná etapa má dokumentované QC kontrolné body. Pevnosť zvarov, zarovnanie švov, inštalácia ventilov a prítlak spojov sú overované priebežne.'
    - 'Tlakové testovanie: Každá nafukovacia komora je tlakovane testovaná na 1,25× menovitého tlaku po dobu 24–48 hodín. Miera úniku musí byť v prijateľných medziach podľa ISO 6185.'
    - 'Konečná kontrola: Dokončené produkty sú kontrolované z hľadiska rozmerovej presnosti, povrchovej úpravy, kompletnosti príslušenstva a integrity balenia pred odoslaním.'
    - 'Sledovateľnosť dávok: Každý produkt má sériové číslo spojené s výrobnými záznamami, čo umožňuje úplnú sledovateľnosť od suroviny až po hotový výrobok.'
content_safety:
  tagline: Normy bezpečnosti na mori
  title: Bezpečnosť na prvom mieste<br />— Navrhnuté pre spoľahlivú prevádzku
  subtitle: Paddle Board Overstock produkty sú navrhnuté a testované tak, aby spĺňali medzinárodné normy bezpečnosti na mori pre komerčné a rekreačné použitie.
  items:
    - title: ISO 6185
      description: Nafukovacie čluny spĺňajú normy ISO 6185 pre konštrukciu, stabilitu, vztlak a nosnosť.
      icon: tabler:sailboat
    - title: Normy ABYC
      description: Elektrické systémy a palivové systémy vyhovujú normám ABYC (American Boat & Yacht Council) pre bezpečnú inštaláciu a prevádzku.
      icon: tabler:bolt
    - title: SOLAS Súlad
      description: Bezpečnostné vybavenie a prostriedky záchrany života spĺňajú požiadavky SOLAS (Safety of Life at Sea), kde je to relevantné.
      icon: tabler:lifebuoy
