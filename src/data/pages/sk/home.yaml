faqs:
  title: SUP Často kladené otázky o objednávaní a produktoch
  subtitle: Bežné otázky ohľadom našich SUP výpredajových dosiek, objednávok, platby, dopravy a záruky.
  columns: 2
  items:
    - title: Je ťažké sa naučiť SUP?
      description: Vôbec nie. Väčšina začiatočníkov sa postaví a začne pádlovať už pri prvom tréningu. Naše SUP univerzálne dosky majú extra široké stabilné plošiny navrhnuté špeciálne pre nováčikov. Začnite na pokojnej vode a za pár minút budete plaviť.
      icon: tabler:swimming
      category: sup
    - title: Aký je hmotnostný limit?
      description: Naša SUPs všestranná podpora do 220 libier a platformy na túrovanie a jogu až do 250 libier. Každá produktová stránka uvádza presnú hmotnosť jazdca, takže si môžete dosku prispôsobiť svojim potrebám.
      icon: tabler:adjustments
      category: sup
    - title: Môžem cestovať s nafukovačkou SUP?
      description: Určite áno. Každá Paddle Board Overstock doska sa zmestí do batohového puzdra. S hmotnosťou len 18-22 libier sa ľahko prenáša na pláž, k jazeru alebo cez letiskové terminály. Pred cestou si skontrolujte pravidlá vašej leteckej batožiny.
      icon: tabler:truck-delivery
      category: sup
    - title: Čo je súčasťou balenia?
      description: Každý Paddle Board Overstock SUP obsahuje dosku, cestovný batoh, ručnú pumpu, nastaviteľné pádlo, odnímateľnú plutvu, vodítko na špirálu a opravárenskú súpravu.
      icon: tabler:clipboard-list
      category: sup
    - title: Prečo sú vaše ceny nižšie než maloobchodné?
      description: Predávame prebytky z výroby a výpredajové šarže priamo z nášho výrobného závodu v Weihai v Číne — žiadni sprostredkovatelia, žiadne maloobchodné prirážky. To znamená kompletné SUP balíčky až s 60 % zľavou z bežných maloobchodných cien, s rovnakou kvalitou certifikovanou CE.
      icon: tabler:certificate
      category: orders
    - title: Ako môžem objednať a zaplatiť?
      description: Pridajte svoj SUP balíček do košíka a bezpečne zaplaťte cez Stripe alebo PayPal. Akceptujeme všetky hlavné kreditné a debetné karty. Každá objednávka je potvrdená e-mailom s kompletnou faktúrou.
      icon: tabler:file-text
      category: orders
    - title: Expedujete do celého sveta?
      description: Áno. Expedujeme do 50+ krajín v rámci EÚ, Severnej Ameriky, Ázie a Pacifiku, na Blízky východ a do Afriky. Objednávky na sklade sa zvyčajne odosielajú do 2-3 pracovných dní a ku každému balíku je poskytnuté sledovanie.
      icon: tabler:route
      category: orders
    - title: Akú záruku majú SUP dosky?
      description: 'Každá SUP doska a príslušenstvo sú kryté 2-ročnou zárukou — vrátane samotnej dosky, drop-stitch švov a inflančných ventilov. Reklamácie sú vybavené za dni, nie týždne: podajte ich online a my opravíme alebo vymeníme.'
      icon: tabler:lifebuoy
      category: orders
