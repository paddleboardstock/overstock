features:
  id: features
  tagline: Prečo nakupovať Paddle Board Overstock
  title: Real Factory,<br />Skutočné úspory
  subtitle: Balíky prebytočných zásob a SUP výpredajových balíkov priamo z výroby — certifikovaná kvalita bez maloobchodnej prirážky.
  columns: 2
  items:
    - title: Až 60 % zľava v maloobchode
      description: Predávame továrenské zásoby a výpredajové dávky priamo — bez sprostredkovateľov, bez maloobchodnej prirážky. Tie isté dosky, ktoré sa predávajú za plnú cenu inde, za výpredajové ceny tu.
      icon: tabler:rocket
    - title: Kompletné balíky
      description: 'Každý SUP je kompletný balík: doska, cestovný batoh, ručná pumpa, nastaviteľné pádlo, odnímateľná plutva, vodítko na špirálu a opravná sada.'
      icon: tabler:clipboard-list
    - title: Certifikovaná kvalita
      description: 13 CE-certifikované SUP modely podľa príslušných smerníc EÚ. Každá doska je pred odoslaním 100 % testovaná pri tlaku 1,25× menovanej hodnoty PSI. Miera bezchybnosti 99,3 % podľa AQL 2,5.
      icon: tabler:certificate
    - title: Nie MOQ — Prvá tabuľa
      description: Výpredaj nadbytočných zásob znamená, že objednávky jednotlivých kusov sú vítané. Pridáte dosku do košíka, zaplatíte, hotovo. Žiadna minimálna objednávka, žiadny proces cenovej ponuky.
      icon: tabler:adjustments
    - title: Rýchla celosvetová preprava
      description: Objednávky na sklade z Weihai sú odoslané do 2-3 pracovných dní. Sledovanie doručenia do 50+ krajín v EÚ, Severnej Amerike, Ázii a Pacifiku a ďalej.
      icon: tabler:truck-delivery
    - title: 2-ročná SUP záruka
      description: SUP Každá doska a príslušenstvo sú kryté na 2 roky — drop-stitch vrátane švov, nafukovacích ventilov a príslušenstva. Nároky sa riešia za dni, nie za týždne.
      icon: tabler:lifebuoy
