content_customer_types:
  tagline: Komu slúžime
  title: Dosky pre každý<br />typ paddlera
  subtitle: Či už je to vaša prvá alebo päťdesiata jazda, existuje výpredajová doska vhodná podľa vášho štýlu pádlovania.
  items:
    - title: Začiatočníci
      description: Extra široké, stabilné všestranné dosky, ktoré uľahčujú vašu prvú jazdu — väčšina začiatočníkov stojí na doske už za pár minút.
      icon: tabler:swimming
      cta: Nakupujte pre začiatočníkov SUPs
      cta_href: /supboard
    - title: Rodiny
      description: Stajne, ktoré môže zdieľať celá rodina, plus ľahšie detské modely — vybavenie, ktoré sa zmestí do auta a nafúkne za pár minút.
      icon: tabler:beach
      cta: Nakupujte rodinné balíčky
      cta_href: /products
    - title: Turistickí a fitness kajakári
      description: Dlhšie, rýchlejšie turistické dosky a plná paluba jogových platforiem pre kajakárov, ktorí vydržia celú vzdialenosť.
      icon: tabler:route
      cta: Nakupujte turistické a jogové dosky
      cta_href: /supboard
    - title: Rybári
      description: Ultra-stabilné plošiny s držiakmi na podvozky a priestorom pre chladič — hádzané z tichej, plochej paluby.
