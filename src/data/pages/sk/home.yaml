content_customer_types:
  tagline: Komu slúžime
  title: Vyrobené pre B2B kupujúcich<br />— Neregálni zákazníci
  subtitle: Paddle Board Overstock vyrába pre štyri typy zákazníkov. Každý má iné priority a my sa nimi všetkými zaoberáme.
  items:
    - title: Majitelia značiek / Súkromná značka
      description: Dizajn vlastného produktu, grafika s privátnou značkou, dokumentácia súladu pod vašou značkou a dedikovaná inžinierska podpora od konceptu po kontajner.
      icon: tabler:palette
      cta: Požiadať o OEM/ODM cenovú ponuku
      cta_href: /request-quotation
    - title: Distribútori / veľkoobchodníci
      description: Ochrana územia, konkurenčné veľkoobchodné ceny, marketingové podporné sady, školenia produktov a kompletná dokumentácia o súlade pre váš trh.
      icon: tabler:world
      cta: Požiadať o distribúciu
      cta_href: /dealers-distributors
    - title: Rezorty / prevádzkovatelia prenájmu
      description: Komerčná odolnosť, poradenstvo pri veľkosti flotily, objednávky kontajnerov s rôznymi modelmi, stratégia náhradných dielov a vybavenie s brandingom rezortu.
      icon: tabler:beach
      cta: Získať komerčný balík
      cta_href: /solutions/resorts
    - title: Záchrana / štát / profesionáli
      description: Hypalon/CSM konštrukcia, možnosti SOLAS súladu, certifikácia špecifická pre projekt, podpora dokumentácie tendrov a NDA-chránené inžinierstvo.
      icon: tabler:shield
      cta: Prediskutovať projekt
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Schopnosť
  title: Čo získate<br />s Paddle Board Overstock
  subtitle: Priamy prístup do továrne s plnou inžinierskou, kvalitatívnou a súladovou podporou — nie obchodná spoločnosť.
  columns: 2
  items:
    - title: OEM/ODM Prispôsobenie
      description: Vlastný dizajn trupu, materiál trubíc (PVC alebo Hypalon/CSM), rozloženie konzoly, sedenie, branding, farby a balenie. Od drobných úprav po kompletné vlastné inžinierstvo.
      icon: tabler:adjustments
    - title: Nízke MOQ, rýchle vzorkovanie
      description: 'RIB: 2-5 jednotiek (existujúca forma). SUP: 5-10 jednotiek za SKU. Vlastné formy: 200+ jednotiek. Predvýrobné vzorky s vaším brandingom do 7-14 dní.'
      icon: tabler:rocket
    - title: Kvalita pripravená na výrobu
      description: Každá jednotka testovaná tlakom 1,25x nominálneho PSI po dobu 24-48 hodín. Miera bezchybných kusov 99,3 % podľa AQL 2,5 / ISO 2859. Kontrolný zoznam kvality na 100 bodov na trup.
      icon: tabler:certificate
    - title: Kompletná dokumentácia o súlade
      description: CE podľa 2013/53/EÚ (RCD), ISO 9001:2015 (SGS), BSCI sociálny audit, REACH súlad, UKCA označenie. Obsahuje DoC a údaje o staviteľskom štítku pre konkrétny model.
      icon: tabler:file-certificate
    - title: Doba dodania 30-45 dní
      description: Štandardná výroba 30-45 dní FOB Čching-tao. Prototypy 7-14 dní. K dispozícii aj expresná výroba. Plány nakládky kontajnerov a baliace schémy ISPM-15 zahrnuté.
      icon: tabler:truck-delivery
    - title: Servis a náhradné diely
      description: Záruka 5 rokov na lode/kayaky/RIBs, 2 roky na SUP/príslušenstvo. Dodávka náhradných dielov s prioritným doručením. Podpora pri vybavení reklamácií.
      icon: tabler:lifebuoy
content_categories:
  tagline: Kategórie produktov
  title: 5 kategórií,<br />64 modelov certifikovaných CE
  subtitle: Od 2,4 m tendrov RIB po 15-ft dosky SUP — všetko vyrobené v našom závode Čching-tao ISO 9001.
  items:
    - title: RIB Lode
      description: 2,4 m až 7,0 m s hliníkovými alebo GRP trupmi.PVC alebo HypalonCSM / rúry.CE podľa rokov 2013/53/EÚ. Hliadkové, potápačské, záchranné a komerčné konfigurácie.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Nafukovacie člny
      description: 2,0 m až 5,0 m s možnosťami hliníkovej podlahy, preglejky alebo vzduchovej paluby. Modely na rybolov, rekreáciu a tendr.
      icon: tabler:sailboat
      link: /products
    - title: SUP Dosky
      description: 9 až 15 stôp v 4-palcových a 6-palcových Drop-Stitchmodeloch. Univerzálne, turistické, jogové a rybárske modely. Dostupné aj komerčné.
      icon: tabler:swimming
      link: /products
    - title: Kajaky
      description: Nafukovacie kajaky pre 1 až 3 osoby. Rekreačné a turistické modely s Drop-Stitch možnosťou podlahy.
      icon: tabler:kayak
      link: /products
    - title: Bezpečnostné doplnky
      description: CE-certifikované záchranné vesty, vrhacie laná, opravárenské sady, čerpadlá a navigačné svetlá.USCG Typ III/V schválené PFD.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Továrenská sila
  title: Výroba pripravená na audit<br />v Qingdao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001 zariadenie — skutočný výrobca, nie obchodná spoločnosť</h3>
  items:
    - title: 6 Špecializované výrobné linky
      description: RIBSamostatná, nafukovacia loď, SUPkajak, bezpečnostné vybavenie a OEMODM / linky. Každá má vyhradené kontrolné body kontroly kvality a plánovanie výroby.
    - title: 100% tlakové testovanie
      description: Každá nafukovacia komora bola natlakovaná na 1,25x a PSI vydržala 24-48 hodín. Výsledky testov sú viazané na sériové číslo trupu (HIN).
    - title: Sledovateľnosť na každom trupe
      description: 'Výrobné záznamy na úrovni HIN s 21+ dátovými poľami na trup: šarža materiálu, ID zvárača, výsledok tlakovej skúšky, konečná konfigurácia a cieľ doručenia.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² ISO 9001 výrobný závod v Qingdao s RIB výrobnými linkami
content_compliance:
  tagline: Súlad a dôkaz kvality
  title: Zdokumentované dôkazy,<br />Nie len tvrdenia
  subtitle: Každý nárok na súlad je podložený dokumentáciou špecifickou pre model, ktorá je k dispozícii na overenie.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Systém riadenia kvality certifikovaný TÜV spoločnosťou Rheinland/SGS. Ročné kontrolné audity. Zdokumentované procesy kontroly kvality od príchodu materiálu až po uvoľnenie zásielky.
      icon: tabler:certificate
    - title: CE podľa 2013/53/EÚ (RCD)
      description: 64 modelov s modelovo špecifickými vyhláseniami o zhode. Posudzovanie zhody podľa príslušných modulov. Registrácia HIN a údaje o staviteľských tabuľkách pre každý trup.
      icon: tabler:file-certificate
    - title: BSCI Sociálna súladnosť
      description: Ročná BSCI audit spoločnosťou SGS. Overené etické pracovné postupy, bezpečnosť na pracovisku a riadenie životného prostredia naprieč naším zariadením.
      icon: tabler:users
    - title: REACH & UKCA
      description: Všetky PVC a lepiace materiály spĺňajú predpisy EÚ REACH. Označenie UKCA dostupné pre britský trh. Karty bezpečnostných údajov o materiáloch sú k dispozícii na vyžiadanie.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proces — Od briefu po kontajner
  items:
    - title: Krok 1:<span class="font-medium">Požiadavky</span>
      description: Zdieľajte špecifikácie svojho produktu, cieľový trh, množstvo a požiadavky na súlad. Náš inžiniersky tím ich skontroluje do 48 hodín.
      icon: tabler:file-text
    - title: Krok 2:<span class="font-medium">Návrh</span>
      description: Získajte podrobný návrh so špecifikáciami, možnosťami materiálov, MOQ, cenami, dodacou lehotou a rozsahom súladu pre váš trh.
      icon: tabler:clipboard-list
    - title: Krok 3:<span class="font-medium">Prototyp</span>
      description: Predprodukčný vzor s vašou značkou do 7-14 dní. Plné testovanie kvality pri 1,25-násobnom menovitom tlaku. Cena vzorky bude pripísaná na výrobu.
      icon: tabler:settings
    - title: Krok 4:<span class="font-medium">Výroba</span>
      description: 30-45 dní výroba v Qingdaou po schválení vzorku. Kontrolné body QC počas procesu, tlakové testovanie a 100-bodová finálna kontrola každého kusu.
      icon: tabler:building-factory
    - title: Krok 5:<span class="font-medium">Doručenie</span>
      description: Plán nakládky kontajnera, drevené debnenie podľa ISPM-15, balík dokladov o súlade a FOB zásielka z Qingdao s kompletnými vývoznými dokladmi.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM výrobný proces nafukovacej lode od návrhu až po prepravu v kontajneri
blog_latest:
  title: Priemyselné a technické poznatky
  information: |
    RCD príručky súladu, OEM/ODM články o procesoch, porovnania materiálov,
    a zdroje na kontrolu tovární od inžinierskeho tímu Paddle Board Overstock.
faqs:
  title: B2B Často kladené otázky o obstarávaní
  subtitle: Bežné otázky od značiek, distribútorov a komerčných operátorov o výrobe OEM/ODM s Paddle Board Overstock.
  columns: 2
  items:
    - title: Ste výrobca alebo obchodná spoločnosť?
      description: Sme vertikálne integrovaná továreň s úplnou kontrolou nad kvalitou, materiálmi a dodacími lehotami. Obchodná licencia a rozsah výroby sú overiteľné počas auditu továrne.
      icon: tabler:building-factory
      category: all
    - title: Aký je váš OEM/ODM proces?
      description: Preskúmanie požiadaviek (48 h) až po návrh prototypu (7-14 dní) až po výrobu (30-45 dní FOB Qingdao). Plná inžinierska podpora, dokumentácia zhody a stopovateľnosť podľa každého trupu počas celého procesu.
      icon: tabler:route
      category: all
    - title: Aké sú vaše MOQ požiadavky?
      description: 'RIB lode: 2-5 kusov na model (existujúca forma), 200+ pre vlastné formy. SUP dosky: 5-10 kusov na SKU. K dispozícii sú objednávky kontajnerov s miešanými modelmi. Vzorkové objednávky 2-5 kusov na hodnotenie.'
      icon: tabler:sort-ascending
      category: all
    - title: Aké možnosti prispôsobenia sú dostupné?
      description: Dizajn trupu, materiál trubice (PVC alebo Hypalon/CSM), priemer trubice, usporiadanie konzoly, sedenie, riadenie, palivový systém, usporiadanie paluby, farby značky, grafika loga, dizajn EVA podložky, maloobalové balenie a značka v manuáli pre vlastníka.
      icon: tabler:adjustments
      category: all
    - title: Aké dokumenty o zhode môžete poskytnúť pre môj trh?
      description: CE DoC podľa 2013/53/EU, UKCA označenie, ISO certifikát 9001 (SGS), BSCI auditová správa, REACH zhoda, správy o testovaní materiálu, záznamy o tlakových skúškach a údaje o výrobnej doske špecifickej pre model. Dokumentácia špecifická pre trh na požiadanie.
      icon: tabler:file-certificate
      category: all
    - title: Aká je doba pre vzorkovanie a výrobu?
      description: 'Vzorky pred výrobou: 7-14 pracovných dní. Štandardná výroba: 30-45 dní FOB Qingdao. Urýchlená výroba je k dispozícii za ďalší poplatok. Vrchol sezóny (marec-jún) môže predĺžiť dodaciu lehotu.'
      icon: tabler:clock
      category: all
    - title: Môžem si dohodnúť audit továrne alebo živú prehliadku videom?
      description: Áno. Audit priamo v továrni v našom závode v Qingdao je možný pri 3-5 dňovej predbežnej výzve. Živé videoprehliadky cez WhatsApp/Zoom sú k dispozícii okamžite. Tretie strany kontroly (SGS, BV, TÜV) sú umožnené.
      icon: tabler:video
      category: all
    - title: Aké kontrolné prehliadky kvality sú vykonávané pred odoslaním?
      description: 1,25x test držania tlaku (24-48h), test odlupovania švov, 100-bodový kontrolný zoznam konečnej kontroly, overenie rozmerov, kontrola vzhľadu, overenie dokumentácie zhody a kontrola integrity balenia. Všetko podľa postupov ISO 9001.
      icon: tabler:clipboard-check
      category: all
