      link: /accessory
content_workshop:
  isReversed: true
  tagline: Továrenská sila
  title: Prečo sú naše výpredajové ceny<br />Sú skutočné
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Skutočná továreň, skutočné úspory — Každá doska sa odosiela z našej prevádzky Weihai</h3>
  items:
    - title: Rovnaké výrobné linky ako u hlavných značiek
      description: Naša továreň Weihai s rozlohou 12 000 m² vyrába dosky pre medzinárodné značky a naše vlastné nadbytkové dávky na rovnakých linkách z rovnakých materiálov.
    - title: 100% tlakové testovanie
      description: Každá doska je pod tlakom 1,25x a PSI držaná pred odoslaním. 99,3% bezchybná miera na AQL 2,5 / ISO 2859.
    - title: Žiadni sprostredkovatelia
      description: Boardy sa doručujú priamo z továrne k vašim dverám. Žiadna prirážka distribútora, žiadna maloobchodná prirážka — takto zostáva cenová ponuka až o 60 % nižšia ako maloobchodné.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Továreň Weihai s rozlohou 12 000 m² s výrobnými linkami nafukovacích zariadení SUP
content_compliance:
  tagline: Súlad a dôkaz kvality
  title: Certifikovaná kvalita,<br />Zdokumentované
  subtitle: Každý nárok na súlad je podložený certifikátmi a dokumentáciou špecifickou pre model, ktorá je k dispozícii na overenie.
  items:
    - title: ISO 9001:2015
      description: Systém riadenia kvality certifikovaný TÜV spoločnosťou Rheinland/SGS. Ročné kontrolné audity. Zdokumentované procesy kontroly kvality od príchodu materiálu až po uvoľnenie zásielky.
      icon: tabler:certificate
    - title: CE Certifikované
      description: 13 CE-certifikované SUP modely podľa príslušných smerníc EÚ, každý s modelovo špecifickým Vyhlásením o zhode a údajmi na výrobnej štítke.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Všetky PVC lepiace materiály spĺňajú REACH predpisy EÚ.UKCA Označenie dostupné pre britský trh. Bezpečnostné listy materiálov na požiadanie.
      icon: tabler:shield-check
    - title: 2-ročná SUP záruka
      description: SUP Každá doska a príslušenstvo kryté na 2 roky — drop-stitch švy, nafukovacie ventily a príslušenstvo zahrnuté. Nároky vyriešené rýchlo.
      icon: tabler:lifebuoy
steps:
  title: Od pokladne po vodu — Ako sa vaša objednávka doručuje
  items:
    - title: Krok 1:<span class="font-medium">Vyberte si svoju dosku</span>
      description: Vyberte si z univerzálnych, turistických, jogových a detských modelov. Naše nákupné príručky vám pomôžu prispôsobiť veľkosť a štýl dosky vášmu pádlaniu.
      icon: tabler:clipboard-list
    - title: Krok 2:<span class="font-medium">Zabezpečená pokladňa</span>
      description: Plaťte bezpečne cez Stripe alebo PayPal. Všetky hlavné kreditné a debetné karty sú akceptované. Účet nie je potrebný — potvrdenie objednávky vám príde do schránky.
      icon: tabler:file-text
    - title: Krok 3:<span class="font-medium">Kontrola kvality</span>
      description: Každá doska je 100% tlakovo testovaná s hodnotením 1,25x PSI a pred zabalením je overená podľa kompletného kontrolného zoznamu kvality.
      icon: tabler:settings
    - title: Krok 4:<span class="font-medium">Rýchle vysielanie</span>
      description: Objednávky na sklade sú odoslané z našej továrne Weihai do 2-3 pracovných dní. Rýchle vybavenie je k dispozícii pri naliehavých objednávkach.
      icon: tabler:building-factory
    - title: Krok 5:<span class="font-medium">Sledované doručenie</span>
      description: Sledoval som celosvetové doručenie do 50+ krajín. Vaša dvojročná záruka a rýchla popredajná podpora začínajú v deň, keď doska dorazí.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Proces objednávky od zabezpečenej pokladne až po sledované doručenie po celom svete
