hero:
  tagline: Poznatky o prieskume vody
  title: Učiť sa
  subtitle: |
    Príručky, tutoriály a hlboké ponory — všetko, čo potrebujete na objavovanie<br />
    plávať s dôverou. Od výberu vášho prvého SUP po zvládnutie pokročilých techník.
  taglineSection: Vedomosti pre každého kanoistu. Od začiatočníka po profesionála.
featured:
  tagline: Odporúčané témy
  title: Začnite svoju cestu učenia
  subtitle: Či už ste nováčikom vo vodných športoch alebo sa chcete zdokonaliť, naši sprievodcovia vám pomôžu.
  items:
    - title: SUP Základy
      description: Všetko, čo začínajúci potrebuje vedieť — typy dosiek, veľkosti pádiel, postoj a tipy na prvý deň.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Nafukovacia vs tvrdá doska
      description: Ktorý je pre vás ten pravý? Porovnávame prenosnosť, výkon, odolnosť a cenu vedľa seba.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Bezpečnosť vo vode
      description: Základné bezpečnostné znalosti, ktoré by mal mať každý kanoista — počasie, záchranné vesty, vlastné záchrany a ďalšie.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Sprievodca materiálmi
      description: PVC vs Hypalon, drop-stitch technológia, hodnotenia denier — pochopte, z čoho je vaše vybavenie vyrobené.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Veľkostný sprievodca
      description: Nájdite správnu dĺžku, šírku a objem dosky podľa svojej váhy, zručnosti a štýlu pádlovania.
      icon: tabler:ruler
      href: /size-guide
    - title: Stredne pokročilé techniky
      description: Zlepšite svoje pádlovanie pomocou pokročilých ťahov, techník otáčania a zvládania drsnej vody.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
