hero:
  title: Príručka veľkostí a špecifikácií
  subtitle: Rozmery, kapacity a odporúčané použitie pre každý produkt Aquafarer.
categories:
  inflatable: Nafukovacie SUPs a kajaky navrhnuté pre prenosnosť bez obetovania výkonu. Zvoľte správnu veľkosť podľa svojej hmotnosti a štýlu paddlovania.
  rib: Pevné nafukovacie lode vhodné pre pobrežnú navigáciu, hliadkovanie a profesionálne námorné operácie. Vyberajte podľa dĺžky a výkonu motora.
  accessory: Doplnky a bezpečnostné vybavenie na doplnenie vašej plavidla. Univerzálne veľkosti s viacerými možnosťami.
