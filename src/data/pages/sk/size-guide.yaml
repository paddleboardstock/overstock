how_to_choose:
  title: Ako vybrať správnu veľkosť
  cards:
    - title: SUP Dosky
      description: Vyberte dĺžku podľa svojej hmotnosti a zamýšľaného použitia. Širšie dosky (32"+) ponúkajú väčšiu stabilitu. Dlhšie dosky (11-12 ft) lepšie kĺžu pri turistike. Ťažší paddleri potrebujú dosky s vyšším objemom.
    - title: Kajaky
      description: Jednotlivé kajaky (9 ft) sú najlepšie na solo cestovanie a rieky. Tandemové kajaky (12 ft) pojmú dvoch paddlerov alebo jedného dospelého s výbavou. Skontrolujte nosnosť pre celkové zaťaženie vrátane výbavy.
    - title: Člny a RIBs
      description: Vyberte dĺžku člnu podľa počtu pasažierov a zamýšľaného použitia. Väčšie RIBs (4,5 m+) sú vhodné pre otvorené more a záchranu. Menšie člny (2,7 m) fungujú ako pomocné lode a rybárske platformy.
