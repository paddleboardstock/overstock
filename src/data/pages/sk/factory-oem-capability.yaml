services:
  - title: Návrh a inžinierstvo produktov
    description: Náš interný tím výskumu a vývoja pracuje s vaším konceptom alebo špecifikáciou na vytvorenie CAD výkresov, 3D modelov a prototypov. Ponúkame návrh foriem, optimalizáciu tvaru trupu a poradenstvo pri výbere materiálov.
  - title: Súkromné značenie a grafika
    description: Plnofarebná digitálna tlač, sieťotlač, embosovanie a možnosti etikiet. Vyvíjame grafiku paluby špecifickú pre značku, značenie trubíc a balenie pripravené na predaj.
  - title: Prispôsobenie materiálov a špecifikácií
    description: Vyberte si z PVC (štandardné, ekologické, nehorľavé), Hypalon/CSM, drop-stitch a hybridných konštrukcií. Prispôsobené farby trubíc, hmotnosť textílií a možnosti zosilnenia.
  - title: Balenie a logistika
    description: Balenie pripravené na predaj, krabice so súkromnou značkou, vákuové balenie, paletizácia a nakladanie do kontajnera. K dispozícii sú dodacie podmienky FOB Qingdao, CIF alebo DDP.
