why_us:
  - title: Vertikálna integrácia
    description: Vlastníme našu továreň, formy a dodávateľský reťazec — žiadni sprostredkovatelia, žiadni subdodávatelia. To nám poskytuje kontrolu nad kvalitou, nákladmi a dodaním.
  - title: Dvojitá certifikácia
    description: ISO 9001 certifikácia riadenia kvality a BSCI certifikácia sociálnej súladu. Správy z auditu továrne sú k dispozícii na požiadanie.
  - title: CE Súlad
    description: Všetky štandardné modely nesú CE certifikáciu 2013/53/EÚ. Vlastné modely môžu byť CE certifikované prostredníctvom nášho zavedeného procesu.
  - title: Nízke MOQ
    description: Začnite s minimálne 5 kusmi pre štandardné modely. Pomáhame novým značkám s uvedením na trh bez nadmerného záväzku inventára.
