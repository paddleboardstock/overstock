hero:
  tagline: OEM/ODM Výroba
  title: OEM a výroba súkromnej značky
  subtitle: Od konceptu po kontajner — prispôsobte každý detail svojej línie nafukovacích plavidiel
intro: Aquafarer ponúka komplexné OEM a ODM služby pre značky, distribútorov a vládne agentúry po celom svete. S 10+ rokmi skúseností s exportom a 12 000 m² ISO továreň s certifikátom 9001 a BSCI zabezpečujeme všetko od návrhu produktu a vývoja foriem až po výrobu v plnom rozsahu, balenie a logistiku.
