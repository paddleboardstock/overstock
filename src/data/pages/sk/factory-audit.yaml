content_priorities:
  tagline: Čo klienti overujú
  title: 8 vecí, ktoré kupujúci overujú<br />pri každej návšteve továrne
  subtitle: Na základe spätnej väzby od+ 50 kupujúcich z krajín je toto osem priorít, ktoré klienti hodnotia pred zadaním B2B objednávky.
  items:
    - title: Skutočný výrobca
      description: 'Ste skutočná továreň, nie obchodná spoločnosť? Kontrola kupujúcich: obchodný subjekt, skutočné výrobné zariadenia, zamestnanci obsluhujúci stroje, aktuálne výrobné objednávky na prevádzke a konzistencia medzi webovou stránkou a dielňou.'
      icon: tabler:building-factory
    - title: Vhodnosť produktu na použitie
      description: RIB Zodpovedá ich konkrétnemu použitiu? Prevádzkovatelia rezortov, záchranných, potápačských, rybárskych a hliadkových služieb majú zásadne odlišné požiadavky. Kupujúci hodnotia rozloženie paluby, materiál trubiek a možnosti vybavenia na vystavenej lodi.
      icon: tabler:target
    - title: Kvalita, stabilita a reprodukovateľnosť
      description: Je 50. jednotka rovnako dobrá ako prvá? Kupujúci kontrolujú QC systémy, kontrolné body v procese, riešenie nesúladov a žiadajú o záznamy z viacerých výrobných sérií, aby overili konzistenciu.
      icon: tabler:repeat
    - title: Autenticita dokumentov o súlade
      description: CE Sú certifikáty špecifické pre model? Je DoC podpísaný skutočnou osobou? Dá sa zhoda overiť podľa čísla trupu? Kupujúci kontrolujú všeobecné nároky oproti dokumentácii špecifickej pre model.
      icon: tabler:file-certificate
    - title: Vykonávanie prispôsobenia
      description: Môže továreň skutočne dodať vlastné konfigurácie? Kupujúci hľadajú dôkazy o minulých zákazkových projektoch, vystavené prototypové vzorky, technické výkresy a možnosť diskutovať o technických úpravách priamo na mieste.
      icon: tabler:adjustments
    - title: Dodacia doba a kapacita
      description: 'Sú uvedené časové plány realistické? Kupujúci posudzujú: aktuálny objem výroby, dostupnú kapacitu, veľkosť pracovnej sily, stav zásob materiálu a či má továreň systém plánovania výroby.'
      icon: tabler:clock
    - title: Cena a obchodné podmienky
      description: 'Sú ceny transparentné? Je cena FOB jasná? Kupujúci overujú: rozpis jednotkovej ceny, náklady na nástroje, náklady na balenie a či továreň dokáže zvládnuť podmienky DDP alebo CIF s riadnou exportnou dokumentáciou.'
      icon: tabler:currency-dollar
    - title: Popredajný servis a náhradné diely
      description: 'Čo sa deje po dodaní? Kupujúci hodnotia: dostupnosť náhradných dielov, proces záruky, výmenu sekcií potrubia, výmenu ventilov a či má továreň zdokumentovaný popredajný protokol.'
      icon: tabler:headset
content_tour:
  tagline: Trasa prehliadky továrne
  title: Auditná prehliadka —<br />Čo uvidíte
  subtitle: Naša štandardná prehliadka továrne nasleduje definovanú trasu navrhnutú tak, aby odpovedala na otázky kupujúcich na každej stanici.
  items:
    - title: 1. Konferenčná miestnosť — Predstavenie spoločnosti
      description: Obchodná licencia, ISO 9001 a BSCI certifikáty, exportné licencie a história spoločnosti. Rýchly prehľad výrobných kapacít a rozsahu súladu.
      icon: tabler:users
    - title: 2. Sklad surovín — stanica IQC
      description: Záznamy o kontrole prichádzajúcich materiálov, certifikáty šarží látok, vzorky lepidiel a hardvéru. Pozrite sa, ako sa materiály testujú pred vstupom do výroby.
      icon: tabler:building-warehouse
    - title: 3. Výroba trubíc — RF zváranie a ručné lepenie
      description: Proces živého zvárania alebo lepenia rúr, ukážky testovania pevnosti švov a inštalácia ventilov. Sledujte konštrukciu po jednotlivých komorách a kontrolné body kvality.
      icon: tabler:flame
    - title: 4. Laminácia trupu — dielňa GRP
      description: Proces laminovania zo sklolaminátu, aplikácia gelcoatu a vytvrdzovanie trupu. Pozrite si harmonogram laminovania a štrukturálne zosilnenie pre rôzne modely RIB.
      icon: tabler:layers-subtract
    - title: 5. Montáž a integrácia
      description: Spojenie trupu a trubice, inštalácia konzoly a sedadla, integrácia elektrického a palivového systému a montáž vybavenia. Sledujte výrobnú linku v prevádzke.
      icon: tabler:tool
    - title: 6. Stanica na tlakové skúšky
      description: 24–48-hodinový tlakový skúšobný test pri 1,25-násobku menovitého tlaku. Prezrite si záznamy testov, tlakomer a kritériá úspechu/neúspechu. Pozrite sa, ako sú výsledky testov prepojené s číslicami sérií trupov.
      icon: tabler:gauge
    - title: 7. Konečná kontrola a QC
      description: Kontrolný zoznam kvality s 100 bodmi na jednotku, overenie rozmerov, kontrola vzhľadu a kontrola integrity balenia. Preskúmajte záznamy o nezrovnalostiach a záznamy o nápravných opatreniach.
      icon: tabler:clipboard-check
    - title: 8. Sála na preskúmanie dokumentov
      description: Dokumentácia zhody pre každý model (DoC, výrobné štítky, príručka vlastníka), záznamy o sledovateľnosti výroby, registr HIN a demonštrácia databázy sledovania dávok materiálu.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvalitné dôkazy
  title: 8-stupňový reťazec kontroly kvality<br />— Overiteľné na každom kroku
  subtitle: Naše kontroly kvality prebiehajú od príchodu materiálov až po konečnú expedíciu, s dokumentovanými dôkazmi v každom štádiu.
  items:
    - title: 'Krok 1: Inšpekcia prichádzajúceho materiálu'
      description: Každá várka PVC, , Hypalonsklolaminátu, hliníka, lepidiel a hardvéru je pred začiatkom výroby testovaná podľa špecifikácií. Kontrola pevnosti v ťahu, priľnavosti povlaku a rozmerov podľa AQL 2,5/ISO2859.
      icon: tabler:package
    - title: 'Fáza 2: Zváranie rúrok / Lepenie QC'
      description: Testovanie pevnosti švu pri každej výrobnej dávke. RF parametre zvárania monitorované a zaznamenávané. Ručne lepené švy kontrolovali konzistentné pokrytie lepidlom a čas vytvrdzovania.
      icon: tabler:flame
    - title: 'Fáza 3: Kontrola kvality laminácie trupu'
      description: Meranie hrúbky gelcoatu, overenie vrstvenia laminátu podľa harmonogramu laminátu a monitorovanie doby vytvrdzovania. Pozície konštrukčných výstuží overené podľa technických výkresov.
      icon: tabler:layers-subtract
    - title: 'Fáza 4: Montáž a integrácia QC'
      description: Integrita spojov trupových trubiek, krútiaci moment montáže konzoly a sedadla, elektrická kontinuita a test úniku palivového systému. Každý inštalačný bod overený podľa kontrolného zoznamu špecifického pre model.
      icon: tabler:tool
    - title: 'Fáza 5: Test udržania tlaku'
      description: Každá nafukovacia komora je natlakovaná na 1,25x a PSI držaná 24-48 hodín. Pokles tlaku zaznamenaný v každej komore. Zdokumentovaný prah prechodu/neúspechu. Prepojené so sériovým číslom trupu.
      icon: tabler:gauge
    - title: 'Fáza 6: Záverečná inšpekcia'
      description: 100-bodový kontrolný zoznam kvality pokrývajúci rozmerovú presnosť, kozmetický povrch, kompletnosť príslušenstva, dokumentáciu a integritu balenia. Nezávislé od výrobného tímu.
      icon: tabler:clipboard-check
    - title: 'Fáza 7: Dokumentácia súladu'
      description: Modelovo špecifické DoC, overenie výrobnej tabuľky, úplnosť v návode majiteľa a záznam v HIN registri. Všetky dokumenty o súlade pripravené a overené pred uvedením na odoslanie.
      icon: tabler:file-certificate
    - title: 'Fáza 8: Uvoľnenie zásielky a sledovateľnosť'
      description: Konečné vydanie vyžaduje absolvovanie všetkých fáz kontroly kvality, dokončenie dokumentácie o súlade a overenie prepravnej dokumentácie. Záznam o trupe je uzavretý a archivovaný na 10 rokov uchovávania+.
      icon: tabler:truck
content_traceability:
  tagline: Sledovateľnosť výroby
  title: → HIN Master File →<br />Doručenie záznamov v trupe →
  subtitle: Každá RIB loď nesie jedinečné identifikačné číslo trupu, ktoré je prepojené s kompletným reťazcom záznamov o výrobe a dodržiavaní predpisov.
  items:
    - title: Číslo identifikácie trupu (HIN)
      description: 14-znakový jedinečný identifikátor je trvalo vyznačený na každej lodi. Kóduje výrobný kód (MIC), označenie modelu, rok výroby a sériové číslo. Kľúč, ktorý odomyká celý reťazec sledovateľnosti.
      icon: tabler:hash
    - title: Hlavný technický súbor
      description: Dokumentácia o súlade a inžinierstve pre modelovú rodinu. Obsahuje výkresy GA, hodnotenie rizík, výpočty stability, špecifikácie materiálov a platné normy. Prepojené so všetkými trupmi tohto modelu.
      icon: tabler:folder
    - title: Individuálny rekord trupu
      description: 'Výrobný záznam na každý trup: HIN, dátum výroby, šarža rúr, materiálové certifikáty, výsledok tlakovej skúšky, konečná konfigurácia, špecifikácia motora, výsledky kontrolného zoznamu kvality a cieľ dodávky. 21+ dátových polí na trup.'
      icon: tabler:file-description
    - title: Balík pre dodržiavanie predpisov pre zákazníka
      description: Balík doručenia na trup vrátane DoC, fotografie výrobcu, návodu na použitie, kontrolného zoznamu súladu a finálneho konfiguračného listu. Odoslané spolu s loďou a archivované vo fabrike 10+ rokov.
      icon: tabler:package
content_red_flags:
  tagline: Úskalia auditu
  title: Kupujúci s červenými vlajkami<br />Ľahko spozorovateľné
  subtitle: Bežné problémy, ktoré podkopávajú dôveru kupujúcich počas auditov tovární. Každý z nich riešime proaktívne.
  items:
    - title: CE Všeobecné nároky bez modelového rozsahu
      description: '"Všetky produkty CE certifikované" bez špecifikácie, ktorá smernica, ktoré modely a ktorý modul zhody. Varovný signál: naznačuje, že súlad je povrchný, nie podľa modelu alebo konfigurácie.'
      icon: tabler:alert-triangle
    - title: Žiadne dôkazy z fyzického testovania
      description: 'Nároky na tlakové skúšky bez viditeľných záznamov o testoch, manometrov alebo testovacej stanice na výrobnej linke. Varovný signál: tvrdenia o kvalite nie je možné overiť počas návštevy.'
      icon: tabler:alert-triangle
    - title: Sledovateľnosť chýbajúcich materiálov
      description: 'Žiadne záznamy o dávkach, žiadna kontrola alebo žiadna spojitosť medzi certifikátmi o materiáli a hotovými výrobkami. Varovný signál: neexistuje spôsob, ako vystopovať problémy s kvalitou k zdroju.'
      icon: tabler:alert-triangle
    - title: Všeobecná dokumentácia
      description: 'Jeden DoC pokrývajúci všetky modely, žiadne záznamy špecifické pre HIN alebo "šablónové" dokumenty o súlade. Varovný signál: súlad nie je viazaný na jednotlivé výrobné jednotky.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Preprava a balenie
  title: RIB Lodný kontajner<br />Nakladanie a prepravky
  subtitle: Naše prepravné riešenia chránia vašu investíciu od Qingdao až po cieľový prístav. Plány nakladania kontajnerov a špecifikácie prepraviek sú dostupné pre každý model.
  items:
    - title: Konfigurácie kontajnerov s dĺžkou 20 stôp
      description: 'Štandardný kontajner s dĺžkou 20 stôp: 1-2 RIB lode (4,0-5,5 m) umiestnené s oddelenou palubou a rúrami, alebo 8-12 SUP dosiek. RIB + SUP K dispozícii sú zmiešané konfigurácie. Podrobný plán nakladania je k dispozícii na objednávku.'
      icon: tabler:box
    - title: Konfigurácie kontajnerov s dĺžkou 40 stôp
      description: 'Štandardný 40-stopový kontajner: 2-4 RIB lode (do 7,0 m) s trupmi zanorenými a rúrami naskladanými na seba, alebo 20-30 SUP dosiek. K dispozícii je 40ft HQ pre RIB vyššie modely. Balenie optimalizované na objem znižuje náklady na dopravu za jednotku.'
      icon: tabler:container
    - title: Drevené debny pre RIB trupy
      description: Hliníkové a GRP trupy sú zabalené v na mieru šitých drevených debnách s penovou výplňou, protivlhkostnou bariérou a oceľovým pásovaním. Rozmery a hmotnosť prepraviek na model sú dostupné pre logistické plánovanie. Zahrnutá certifikácia tepelne spracovaného dreva ISPM-15.
      icon: tabler:wood
    - title: Balenie na oddelenie trubiek a paluby
      description: Rúry sa vyfukovali a skladali oddelene od trupu pre úsporu priestoru. Palubné dosky, konzoly a sedadlá zabalené v ochrannom obale s montážnymi hardvérovými sadami. Pokyny na opätovné zloženie boli priložené ku každej zásielke.
      icon: tabler:package
    - title: Ochrana proti vlhkosti a korózii
      description: VCI antikorózny papier pre hliníkové komponenty, silikagélové vysušovacie balíčky a vákuovo uzavreté hardvérové vrecká. Zabraňuje poškodeniu kondenzáciou počas 30-45-dňovej plavby po oceáne.
      icon: tabler:droplet-off
    - title: FOB Dokumentácia Qingdao
      description: Nákladný list, obchodná faktúra, zoznam balenia, certifikát pôvodu a dokumentácia o súlade pri každej zásielke. Konsolidácia FCL a LCL dostupná. Podpora colnej dokumentácie pre trhy EÚ, USA a Blízkeho východu.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Overovacie dôkazy
  title: Auditné dôkazy<br />Môžete si overiť priamo na mieste
  subtitle: Počas návštev tovární môžu klienti overiť konkrétne dôkazy v každej výrobnej oblasti. Tu je, na čo si dať pozor — a čo pripravujeme pri každom audite.
  areas:
    - area: Sklad surovín
      what_to_verify: Sú materiály stabilné? Dochádza k miešaniu šarží?
      evidence: Záznamy o príchodnej kontrole, označenia šarží, skladovanie FIFO, zoznam schválených dodávateľov, certifikáty materiálov (PVC, Hypalon, sklolaminát, hliník, lepidlá, kovové súčiastky)
      icon: tabler:building-warehouse
    - area: Výroba trubiek
      what_to_verify: Ako je zaručená pevnosť švov a vzduchotesnosť?
      evidence: Karty procesov, potvrdenie prvého kusu, záznamy tlakového testu pre každú komoru, protokoly opráv a opätovného testovania, záznamy o montáži ventilov
      icon: tabler:flame
    - area: Výroba trupu
      what_to_verify: Ako sa kontroluje konzistencia konštrukcie?
      evidence: Kontrolované procesné dokumenty, kontrolné body kvality, číslovanie polotovarov, meranie hrúbky gelcoatu, overenie harmonogramu laminácie
      icon: tabler:layers-subtract
    - area: Montážna plocha
      what_to_verify: Ako sa zabraňuje nesprávnej montáži voliteľných dielov?
      evidence: BOM, pracovné príkazy, kontrolné zoznamy konfigurácie, inšpekčné karty pracovného miesta, kontroly utiahnutia a funkčnosti pre každý model
      icon: tabler:tool
    - area: Testovacia stanica
      what_to_verify: Ako potvrdíte, že loď je pred dodaním v poriadku?
      evidence: Testovacie postupy, zoznam prístrojov, záznamy kalibrácie, záznamy tlakového testu (1,25x / 24-48h), kontrolné zoznamy funkčných testov, dokumentované kritériá úspešnosti/neúspešnosti
      icon: tabler:gauge
    - area: Oblasť nekonformity
      what_to_verify: Ako sa riešia vady?
      evidence: Izolačné štítky, záznamy NCR, analýza príčiny, záznamy o schválení opráv, sledovanie CAPA (korekčné a preventívne opatrenia)
      icon: tabler:alert-triangle
    - area: Sklad hotových výrobkov
      what_to_verify: Ako predchádzate nesprávnemu odosielaniu a poškodeniu?
      evidence: Označenia hotových výrobkov, záznamy zhody s objednávkou, štandardy balenia, záznamy predodberovej kontroly
      icon: tabler:box
    - area: Náhradné diely a popredajná podpora
      what_to_verify: Dokážete zabezpečiť dlhodobý popredajný servis?
      evidence: Zoznam bežných náhradných dielov, stratégia zásob, systém číslovania dielov, dokumentácia záruk, návody na údržbu
      icon: tabler:headset
content_closing_script:
  tagline: Audit podľa objednávky
  title: Od návštevy fabriky<br />do potvrdeného projektu
  subtitle: Úspešný audit by nemal končiť fotografiami a podaním rúk. Pred odchodom zabezpečujeme, že sú zdokumentované tri obchodné výsledky.
  items:
    - title: Potvrdiť technickú konfiguráciu
      description: Dohodnúť sa na modeli, aplikácii, kľúčových možnostiach, cieľovom trhu, odhadovanom množstve a pláne dodania — všetko zdokumentované pred odchodom.
      icon: tabler:checklist
    - title: Potvrdiť dokumenty ďalšieho kroku
      description: 'Definujte Paddle Board Overstock , čo bude ďalej: upravený GA, zoznam konfigurácie, cenová ponuka, kontrolný zoznam dokumentov, vzorový plán alebo NDA — s konkrétnymi časovými rámcami.'
      icon: tabler:file-plus
    - title: Potvrďte vzájomnú časovú os
      description: Upravená konfigurácia a predbežná cenová ponuka do 3 pracovných dní. Vzorka alebo potvrdenie vzhľadu do 7 dní. Inžinierska kontrola alebo kontrola treťou stranou do 14 dní. Dátum ďalšieho stretnutia a zodpovedné osoby uzamknuté.
      icon: tabler:calendar
faq:
  title: Audit továrne — Často kladené otázky
  questions:
    - q: Môžem navštíviť továreň osobne?
      a: Áno. Vítame audity tovární priamo na mieste v našom 12 000 m² zariadení v Qingdao. Naša štandardná prehliadka zahŕňa 8 staníc od skladu surovín až po miestnosť na kontrolu dokumentov. Virtuálne prehliadky továrne cez videohovor sú tiež k dispozícii pre počiatočnú kvalifikáciu.
    - q: Prijímate audity tretích strán (BSCI, SMETA, SGS)?
      a: Áno. Udržiavame BSCI certifikáciu (Intertek) a vítame auditné protokoly špecifické pre zákazníka. Môžeme tiež na SGS TÜV požiadanie dohodnúť kontroly. Auditné správy sú dostupné pod NDA.
    - q: Môžem vidieť tlakové testovanie počas návštevy?
      a: Naša tlaková skúšobná stanica je súčasťou štandardnej trasy prehliadky. V závislosti od výrobného harmonogramu môžete pozorovať aktívne tlakové testy s meraniami a testovými záznamami. Záznamy tlakových skúšok pre každý trup sú vždy k dispozícii na prehliadku.
    - q: Ako riešite nekonformné produkty?
      a: Nekonformné jednotky sú oddelené, zdokumentované a kontrolované podľa ISO nášho procesu nápravných opatrení 9001. Vykonáva sa analýza príčiny, vykonávajú sa nápravné opatrenia a vedú sa záznamy. Kupujúci môžu počas auditov kontrolovať náš NCR záznam.
    - q: Aká dokumentácia k dodržiavaniu predpisov je dostupná na preskúmanie?
      a: 'Počas auditu si môžete prezrieť: vzory DoC špecifické pre model, špecifikácie výrobných dosiek, register HIN, návrhy príručiek pre majiteľa, zoznamy platných noriem a záznamy o hodnotení zhody podľa modelových rodín.'
    - q: Ako si môžem rezervovať virtuálnu prehliadku továrne?
      a: Kontaktujte náš predajný tím a dohodnite si živú video prehliadku cez WhatsApp, Zoom alebo Teams. Sledujeme rovnakú trasu s 8 stanicami a môžeme sa zamerať na konkrétne oblasti podľa vašich záujmov. Typická virtuálna prehliadka trvá 45-60 minút.
    - q: Je továreň skutočným výrobcom alebo obchodnou spoločnosťou?
      a: Paddle Board Overstock je skutočný výrobca. Prevádzkujeme továreň v Laixi, Qingdao. Počas auditu je overiteľná licencia na podnikanie, rozsah výroby a fyzická výroba.
    - q: Aké kvalitné záznamy môžem skontrolovať?
      a: Záznamy o inšpekciách prichádzajúceho materiálu, kontrolné body kontroly kvality počas procesu, denníky tlakových skúšok, 100-bodové konečné kontrolné zoznamy, správy o nezhode, záznamy o nápravných opatreniach a záznamy o sledovateľnosti jednotlivých trupov. Všetko sa udržiava podľa ISO požiadaviek 9001.
