content_customization:
  tagline: Čo je možné prispôsobiť
  title: RIB Prispôsobenie<br />Možnosti
  subtitle: Každý prvok RIB lode je možné prispôsobiť vašej aplikácii, trhu a požiadavkám na značku.
  items:
    - title: Trup a konštrukcie
      description: Dĺžka trupu (2,5–8,5 m), materiál trupu (GRP sklené vlákno alebo námorný hliník), farba trupu (gelcoat alebo maľovaný), profil kýlu (hlboké V, stredné V, ploché), typ záďa (uzavretý záď s držiakom alebo studňou) a konštrukčné spevnenie pre komerčné zaťaženie.
      icon: tabler:sailboat
    - title: Rúrka a golier
      description: Materiál trubice (0,9–1,2 mm PVC alebo 1,4–1,7 mm Hypalon/CSM), priemer trubice (40–55 cm), počet komôr (3–7), typ ventilu (Halkey-Roberts, Leafield D7 alebo Boston), farba trubice (štandardná alebo na mieru) a konfigurácia kužeľa/kužeľa obojku.
      icon: tabler:circle
    - title: Rozloženie paluby a konzoly
      description: Stredová konzola, bočná konzola alebo riadenie s kormidlom. Rozloženie sedadiel (sedadlá pre žokejov, lavice, sedadlá s bočnými sedadlami). Krytie paluby (EVApenový teakový vzhľad, protišmyková farba alebo holý GRP). Montážne body na vybavenie, madlá a polohy D-krúžkov.
      icon: tabler:layout-dashboard
    - title: Elektrotechnika a navigácia
      description: Navigačné svetlá (LED), systém čerpadla na vodu, správa batérie, inštalácia VHF rádia, montáž GPS/chartplotteru, USB nabíjacie porty a konfigurácia prepínačov.
      icon: tabler:bolt
    - title: Branding a grafika
      description: Grafika trupu a trubiek (sieťotlač, prenos teplom, UV digitálna tlač), umiestnenie log, špeciálne farebné schémy, identifikačné značky a dokumentácia majiteľa na mieru s vašou značkou.
      icon: tabler:palette
    - title: Bezpečnosť a súlad
      description: Hodnotenie podľa kategórie dizajnu (A/B/C/D na kusRCD), systém hasenia požiaru, špecifikácia palivového systému (prenosná nádrž, pevná nádrž, podpalubie) a balík dokumentácie o súlade pre váš cieľový trh.
      icon: tabler:shield
content_applications:
  tagline: Konfigurácie aplikácií
  title: RIB Konfigurácie<br />Podľa použitia
  subtitle: Rôzne misie vyžadujú rôzne konfigurácie. Tu sú overené nastavenia pre RIB najbežnejšie aplikácie.
  items:
    - title: Záchrana a hliadka
      description: Hlboký V trup, Hypalon rúry, samovysávacia paluba, sedadlá na podvale, rukoväte, navigačné svetlá a robustné D-krúžky.RCD Kategória B alebo C. Ohňovzdorný palivový systém a komerčná elektrika.
      icon: tabler:lifebuoy
    - title: Podpora v potápaní
      description: Široký nosník, zadný nástupný rebrík, pozície nosiča tankov, extra D-krúžky, montáž potápačskej vlajky, zosilnený záď pre dvojité vonkajšie lode a protišmykové pokrytie celej paluby EVA .
      icon: tabler:mask
    - title: Cestovný ruch a obchod
      description: Usporiadanie certifikované pre cestujúcich s lavicami, slnečným tienilom/Bimini, madlami, suchým úložným priestorom a systémom dvoch batérií.RCD Kategória C. Navrhnuté pre prevádzku rekreačných a charterových flotíl.
      icon: tabler:beach
    - title: Rybolov
      description: Otvorené rozloženie paluby, pozície držiakov prútov, živá návnada, držiak na hľadanie ryby, držiak na trolling motor, zosilnený záď a prenosný palivový systém. Možnosti stredovej alebo bočnej konzoly.
      icon: tabler:fish
    - title: Voľný čas & Jachtový tender
      description: Ľahká trupová konštrukcia, PVC rúry, pohodlné sedenie, teleskopické kormidlo alebo kompaktná konzola, zdvíhacie body pre davit a odnímateľná palivová nádrž. RCD Kategória C alebo D.
      icon: tabler:sailboat
    - title: Profesionálna pracovná loď
      description: Možnosť hliníkového trupu, zosilnená robustná konštrukcia, hydraulické riadenie, elektrina komerčnej kvality, radarový oblúk a body pre integráciu vybavenia pre konkrétnu misiu. Prispôsobenie súladu podľa projektu.
      icon: tabler:anchor
process_steps:
  title: 7-krokový RIB OEM/ODM vývojový proces
  subtitle: Od projektového brífu po popredajný servis — definovaný pracovný tok s jasnými míľnikmi a výstupmi
  steps:
    - number: '01'
      title: Projektový bríf & Požiadavky
      description: Definujte cieľovú aplikáciu, veľkosť trupu, materiál rúry, požiadavky na súlad a potreby značky. Posúdime uskutočniteľnosť a potvrdíme model spolupráce (OEM/ODM/Polopriahly/Plne prispôsobený).
      timeline: 3–5 dni
    - number: '02'
      title: Technické hodnotenie & Uskutočniteľnosť
      description: Inžiniersky tím preskúma štrukturálnu uskutočniteľnosť, stabilitu a výpočty vztlaku, cestu súladu a dostupnosť materiálov. Identifikujeme existujúce formy alebo požiadavky na vlastnú formu.
      timeline: 5–7 dni
    - number: '03'
      title: Návrh & Cenová ponuka
      description: Obdržte podrobný návrh vrátane špecifikácií, 3D vizualizácií alebo GA výkresov, rozsah súladu, časový harmonogram a jednotkovú cenu založenú na objemových úrovniach a MOQ.
      timeline: 5–7 dni
    - number: '04'
      title: Potvrdenie návrhu & Vzorkovanie
      description: Schváľte konečný GA, usporiadanie paluby a konfiguráciu rúry. Vyrobíme predprodukčnú vzorku vo farbách vašej značky, s logom a špecifikovanými materiálmi na vašu fyzickú kontrolu.
      timeline: 15–20 dní
    - number: '05'
      title: Schválenie vzorky & QC protokol
      description: 'Skontrolujte a schváľte vzorku. Definujte výrobný QC protokol: tlaková skúška (1,25x / 24–48h), kontrola rozmerov a kontrolný zoznam dokumentácie súladu pre každý trup.'
      timeline: 3–5 dni
    - number: '06'
      title: Hromadná výroba & Kontrola kvality
      description: Plná výrobná séria s 100-bodovým QC kontrolným zoznamom pre každú jednotku. V priebehu výroby kontroly, tlakové testy a vyhľadateľnosť na úrovni sériových čísel. CE/ISO dokumentácia pripravená paralelne.
      timeline: 30–45 dní
    - number: '07'
      title: Balenie, doprava & Popredajný servis
      description: Prispôsobené balenie (štandardné, pripravené na predaj alebo na palete), exportná dokumentácia, nakládka kontajnera a logistika. Súčasťou sú aj sady náhradných dielov a dokumentácia údržby.
      timeline: 7–14 dní
certifications:
  title: Súlad & Certifikáty pre RIB lode
  subtitle: Každá individuálna objednávka RIB odchádza s dokumentáciou súladu špecifickou pre model
  items:
    - name: CE 2013/53/EÚ
      description: RCD súlad podľa modelu a kategórie dizajnu — DoC, štítok výrobcu, príručka majiteľa zahrnuté
      badge: CE
    - name: ISO 9001:2015
      description: Systém riadenia kvality certifikovaný SGS, ktorý pokrýva návrh, výrobu a distribúciu
      badge: ISO
    - name: SK ISO 6185
      description: Norma konštrukcie nafukovacej lode — stabilita, vztlak a záchrana človeka cez palubu
      badge: 6185
    - name: SK ISO 14945
      description: Štandardná tabuľka staviteľa — trvalo označené identifikačné a kapacitné informácie
      badge: 14945
    - name: BSCI
      description: Audit sociálnej zhody pre etickú výrobu — vyžadovaný maloobchodníkmi EÚ
      badge: BSCI
    - name: REACH
      description: Súlad s chemickou bezpečnosťou EÚ pre PVC, Hypalon, lepidlá a povlaky
      badge: REACH
content_service_modules:
  tagline: Servisné moduly
  title: OEM/ODM Služba<br />Moduly
  subtitle: Každý projekt kombinuje správne servisné moduly. Každý projekt nepotrebuje každý modul — definujeme rozsah len toho, čo váš projekt vyžaduje.
  items:
    - title: Inžinierska kontrola a uskutočniteľnosť
      description: 'Hodnotenie plavidlovej platformy, kontrola konštrukčnej uskutočniteľnosti, overenie stability a vztlaku, identifikácia cesty súladu a potvrdenie dostupnosti materiálov. Výstup: správa o uskutočniteľnosti s odporúčaním pokračovať/nekontinuovať.'
      icon: tabler:math-function
    - title: Dizajn a konfigurácia
      description: 'Výkres GA, usporiadanie paluby, konfigurácia rúrok, polohy konzoly a sedadiel, plán montáže vybavenia a výber farieb/materiálov. Výstup: schválená špecifikácia GA a konfigurácie.'
      icon: tabler:ruler
    - title: Vzorka & Prototyp
      description: Predvýrobný vzor s odsúhlasenými farbami, logom a určenými materiálmi na fyzickú kontrolu. Obsahuje protokol schválenia vzoru, kontrolný zoznam a proces žiadosti o zmenu.
      icon: tabler:3d-cube-sphere
    - title: Výroba a kontrola kvality
      description: Hromadná výroba s kontrolným zoznamom QC s 100 bodmi na jednotku, priebežnými kontrolami, tlakovými skúškami (1,25x / 24-48 h) a sledovateľnosťou na úrovni sérií. Dokumentácia CE/ISO pripravená paralelne.
      icon: tabler:clipboard-check
    - title: Branding a balenie
      description: Aplikácia loga súkromnej značky, vlastná grafika trupu a tubusov, dokumentácia pre majiteľa s logom, balenie pripravené na predaj alebo na paletu a príprava súpravy náhradných dielov.
      icon: tabler:palette
    - title: Export a dokumentácia
      description: Exportné balenie, plán nakládky kontajnera, dokumentácia FOB/CIF/DDP, súlad s predpismi pre cieľový trh a protokol komunikácie po dodaní.
      icon: tabler:world
content_risk_control:
  tagline: Riadenie rizík a dodania
  title: Riziko projektu &<br />Správa doručenia
  subtitle: Profesionálni OEM/ODM kupujúci sa starajú o kontrolu rizík rovnako ako o kvalitu produktu. Tu je spôsob, ako to riadime.
  items:
    - title: Definícia rozsahu a vlastníctva
      description: 'Pred začiatkom vývoja písomne definujeme: rozsah prispôsobenia, požiadavky na nástroje, kritériá schvaľovania vzoriek, vlastníctvo výkresov a foriem a povinnosti v dokumentácii. Nie je žiadna nejasnosť ohľadom toho, kto čo vlastní.'
      icon: tabler:file-text
    - title: Proces riadenia zmien
      description: Všetky zmeny špecifikácií po potvrdení návrhu nasledujú zdokumentovaný proces žiadosti o zmenu s hodnotením dopadu (náklady, časový harmonogram, súlad). Žiadne neschválené úpravy nevstupujú do výroby.
      icon: tabler:arrows-diff
    - title: Záruka konzistencie šarže
      description: 50. jednotka zodpovedá prvej schválenej vzorke. Schválené špecifikácie sú zmrazené, parametre materiálu a procesu sú uzamknuté a kontrolné body počas procesu overujú konzistenciu počas celej výrobnej série.
      icon: tabler:repeat
    - title: Dodávka a transparentnosť kapacít
      description: Dodacie lehoty sú uvádzané na základe skutočnej výrobnej kapacity, zásob materiálu a aktuálneho nákladu objednávok — nie na základe ambicióznych cieľov. Výrobný harmonogram s dátumami míľnikov uvádzanými na objednávku.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Často kladené otázky
  questions:
    - q: Aký je rozdiel medzi OEM ODM loďami a pre RIB lode?
      a: 'OEM (Výroba originálneho vybavenia): poskytujete podrobné špecifikácie a my vytvárame váš návrh.ODM (Originálny dizajn výroby): vyberiete overenú Paddle Board Overstock RIB platformu a my ju prispôsobíme požadovaným funkciám a značke.ODM je rýchlejšia a lacnejšia;OEM ponúka maximálnu kontrolu nad dizajnom.'
    - q: Môžem RIB si prispôsobiť tvar a veľkosť trupu?
      a: Áno. Ponúkame polo-custom úpravy existujúcich foriem trupu (iné usporiadanie paluby, konfigurácie trubiek) a kompletný vlastný vývoj trupu s novými CNCobrábanými formami. Polo-custom projekty môžu začať na 2-5 jednotkách; plne custom zvyčajne vyžaduje vyššie záväzky.
    - q: Aké materiály trubiek sú dostupné na zákazkuRIBs?
      a: Ponúkame 0,9-1,2 mm PVC pre rekreačné a ľahké komerčné použitie a 1,4-1,7 mm HypalonCSM / pre profesionálne, záchranné a komerčné aplikácie vyžadujúce UV vynikajúcu odolnosť voči ozónu (životnosť 10-15 rokov vs. 5-8 rokov pre PVC).
    - q: Dá sa nastaviť RIBs na konkrétne aplikácie ako záchrana, potápanie alebo rybolov?
      a: Áno. Udržiavame overené konfiguračné šablóny pre záchranu/hliadku, potápačskú podporu, cestovný ruch/charter, rybolov, jachtárske tendery a profesionálne pracovné lode. Každá šablóna obsahuje odporúčaný typ trupu, materiál rúr, rozloženie paluby a vybavenie — ktoré potom prispôsobujeme vašim presným požiadavkám.
    - q: Aké informácie potrebujete pre RIB OEMODM / cenovú ponuku?
      a: Cieľová aplikácia, požadovaná dĺžka trupu, preferencia materiálu trubiek (PVCalebo ), Hypalonpribližné množstvo a harmonogram dodania, požiadavky na súlad cieľového trhu a akékoľvek referenčné produkty alebo špecifikácie. Čím viac detailov poskytnete, tým rýchlejšie a presnejšie je naša cenová ponuka.
    - q: Čo MOQ je to pre RIB vlastné lode?
      a: Pre existujúce formy trupu so štandardnými úpravami začína MOQ to na 2-5 kusoch na dizajn. Pre vlastné formy a kompletný vlastný vývoj MOQ závisí od zložitosti projektu — typicky 10-20 kusov pre polozákazkové formy a 30 pre plne prispôsobené+ s novými nástrojmi.
    - q: Kto vlastní vlastné formy a výkresy?
      a: Formy vytvorené pomocou Paddle Board Overstock základných návrhov zostávajú Paddle Board Overstock majetkom. Plne na mieru vyrobené formy objednané a zaplatené klientom môžu byť podľa zmluvných podmienok prevedené na vlastníctvo klienta. Všetky podmienky vlastníctva formy sú zdokumentované pred začiatkom projektu.
    - q: Ako sa RIBs vlastne balia na export?
      a: 'Štandard: na mieru vyrobená + stretch-fólia na nakladanie kontajnerov. Prémiové: balenie pripravené na predaj, vákuové balenie alebo paletizované. Ponúkame FOB Qingdao, CIF, DDP a dopravu. Kompletná exportná dokumentácia a colná kontrola sú zahrnuté.'
