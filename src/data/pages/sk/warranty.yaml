label: Záruka
headline: Aquafarer Obmedzená záruka výrobcu
subtitle: Aquafarer stojí za kvalitou každého nafukovacieho námorného produktu, ktorý vyrábame. Táto obmedzená záruka stanovuje podmienky a krytie Aquafarer vášho produktu.
seo:
  headline: Aquafarer Záruka na nafukovacie člny — 5-ročná obmedzená záruka | Aquafarer
  description: Aquafarer Ponúka 5-ročnú obmedzenú záruku na primárnu látku, švy a štrukturálnu integritu trupu z laminátu. Zahŕňa tiež nafukovacie ventily a továrensky inštalované príslušenstvo. Plné podmienky Aquafarer záruky na nafukovacie člny.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Táto obmedzená záruka sa vzťahuje na nové Aquafarer značkové nafukovacie námorné produkty zakúpené priamo od Aquafarer Aquafarer autorizovaného predajcu či predajcu. Dátum účinnosti je overiteľný dátum pôvodného maloobchodného nákupu.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Krytie záruky a trvanie</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Integrita primárnej rúry (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Štrukturálna integrita trupu zo sklených vlákien</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Schopnosť zadržiavať vzduch v nafukovacích spojoch trubiek</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 rokov</h3>
        <p class="text-sm text-gray-600 mt-1">Funkčnosť nafukovacieho ventilu</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 rok</h3>
        <p class="text-sm text-gray-600 mt-1">Továrensky inštalované príslušenstvo a pomocné príslušenstvo</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 rok*</h3>
        <p class="text-sm text-gray-600 mt-1">Komerčné, prenájmové alebo flotilové použitie — všetky komponenty</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komerčné, vládne, charterové, prenajaté alebo inštruktážne použitie skracuje záruku na 1 rok. Pretekárske alebo súťažné použitie úplne ruší záruku.</p>
  </div>

  <h2>Čo je zahrnuté</h2>
  <h3>Primárna tubová tkanina (5 rokov)</h3>
  <p>Aquafarer zaručuje hlavnú rúrkovú tkaninu proti poškodeniu pórovitosti, ktoré výrazne ohrozuje schopnosť produktu udržať prevádzkovú infláciu. Toto platí pre CSM Hypalon() potiahnutú látku a všetky ostatné materiály rúrok používané pri výrobe.</p>

  <h3>Štrukturálna integrita trupu zo sklolaminátu (5 rokov)</h3>
  <p>Pri výrobkoch s trupom vystuženým skleným vláknom (FRP) je základná kompozitná konštrukcia opodstatnená proti zlyhaniu konštrukcie spôsobeným chybami v materiáloch alebo spracovaní.</p>

  <h3>Schopnosť zadržiavať vzduch v nafukovacom potrubí (5 rokov)</h3>
  <p>Švy nafukovacích trubiek, ak boli spojené počas výroby, sú zabezpečené proti výrobným chybám, ktoré spôsobujú výrazné úniky vzduchu cez šv. Pravidelná kontrola a udržiavanie vhodného nafukovacieho tlaku sú podmienky krytia.</p>

  <h3>Funkčnosť nafukovacieho ventilu (5 rokov)</h3>
  <p>Nafukovacie ventily pôvodne inštalované sú Aquafarer zaručené proti výrobným chybám v materiáloch alebo spracovaní, ktoré bránia ventilu zadržiavať vzduch podľa návrhu.</p>

  <h3>Továrensky inštalované príslušenstvo (1 rok)</h3>
  <p>Komponenty a príslušenstvo Aquafarer vyrobené a pôvodne inštalované vo fabrike sú zaručené proti chybám v materiáli a remeselnej práci po dobu jedného roka. To vylučuje položky tretích strán, ktoré sú kryté iba príslušnou zárukou výrobcu.</p>

  <h2>Čo nie je pokryté</h2>
  <ul>
    <li>Kozmetické chyby vrátane zafarbenia, škvrny, blednutia, kriedy alebo akejkoľvek zmeny vzhľadu</li>
    <li>Prepichnutia, rezy, trhliny, trhliny alebo iné fyzické poškodenia</li>
    <li>Praskanie, praskanie, opotrebovanie, odieranie alebo zhoršovanie spôsobené trením či kontaktom</li>
    <li>Degradácia v dôsledku UV vystavenia svetlu, zvetrávania alebo atmosférických podmienok</li>
    <li>Poškodenie v dôsledku kontaktu s palivami, rozpúšťadlami, kyselinami, zásadami alebo chemikáliami</li>
    <li>Škody spôsobené nedbanlivosťou, nesprávnym používaním, zneužitím, nehodou alebo bežným opotrebovaním</li>
    <li>Problémy s povrchom gelcoatu alebo laku (pľuzgiere, praskanie, zmena farby, blednutie)</li>
    <li>Poškodenie spôsobené nárazom, napätím, nesprávnou oporou alebo prepravou prívesu</li>
    <li>Škody spôsobené nesprávnou infláciou/defláciou alebo použitím neschválených nafukovacích zariadení</li>
    <li>Zariadenia, komponenty alebo systémy tretích strán (kryté ich výrobcami)</li>
  </ul>

  <h2>Zodpovednosť výrobcu a náprava</h2>
  <p>AquafarerJedinou a výlučnou povinnosťou je oprava alebo výmena akéhokoľvek komponentu, ktorý je určený Aquafarerako chybný materiálovo alebo remeselne a krytý touto zárukou. Opravy alebo výmeny vykonáva Aquafarer alebo jeho určené autorizované servisné zariadenie. Opravené alebo vymenené komponenty sú garantované len na nevypršanú časť pôvodnej záručnej doby.</p>

  <h2>Podmienky záruky</h2>
  <ul>
    <li><strong>Registrácia:</strong>Produkt musí byť riadne registrovaný podľa podmienok záruky.</li>
    <li><strong>Údržba:</strong>Produkt musí byť udržiavaný v súlade s Aquafarerpublikovanými smernicami, vrátane pravidelných kontrol a udržiavania vhodných inflačných tlakov.</li>
    <li><strong>Spolupráca:</strong>Kupujúci musí plne a promptne spolupracovať Aquafarer vo všetkých záležitostiach týkajúcich sa nárokov na záruku.</li>
    <li><strong>Pôvodný kupujúci:</strong>Táto záruka sa vzťahuje výhradne na pôvodného koncového kupujúceho a nie je prenosná.</li>
  </ul>

  <h2>Komerčné využitie</h2>
  <p>Ak je produkt použitý na komerčné, vládne, neziskové, charterové, požičovné, inštruktážne alebo na akýkoľvek iný účel než súkromné rekreačné použitie, záruková doba na všetky komponenty sa skracuje na jeden (1) rok od pôvodného dátumu maloobchodného nákupu. Použitie v pretekoch, rýchlostných alebo vytrvalostných súťažiach okamžite a neodvolateľne úplne ruší záruku.</p>

  <h2>Ako podať reklamáciu na záruku</h2>
  <p>Kontaktujte Aquafarer alebo svojho autorizovaného predajcu s dokladom o kúpe a podrobným popisom problému.Aquafarer Reklamáciu preskúmam a poskytne pokyny na kontrolu a servis.</p>
  <p>Pre otázky týkajúce sa záručného servisu nás prosím kontaktujte prostredníctvom nášho<a href="/contact" class="text-sky-600 underline">Kontaktná stránka</a>s číslom objednávky a detailmi produktu.</p>

  <h2>Predmety tretích strán</h2>
  <p>Zariadenia, komponenty alebo systémy vyrobené tretími stranami (aj keď sú inštalované Aquafarer) sú výhradne kryté akoukoľvek zárukou poskytovanou ich príslušným výrobcom.Aquafarer Výslovne sa vzdáva akejkoľvek zárukovej povinnosti voči takýmto predmetom tretích strán.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Toto vyhlásenie o záruke je zhrnutím kompletnej Aquafarer obmedzenej záruky výrobcu. Kompletný právny záručný dokument upravuje všetky podmienky záruky. Špecifikácie môžu byť zmenené bez predchádzajúceho upozornenia.Aquafarer je továrenská značka Aquafarer výrobného centra Qingdao.
  </p>
