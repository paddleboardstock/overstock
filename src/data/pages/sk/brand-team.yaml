      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Filozofia dizajnu
  title: Dizajn vedený inžinierstvom<br />— Každý detail záleží
  subtitle: Naša inžinierska filozofia sa zakladá na troch princípoch, ktoré riadia každý produkt, ktorý vyrábame.
  list:
    - 'Spoľahlivosť na prvom mieste: Každý produkt Aquafarer je testovaný tak, aby odolal podmienkam skutočného sveta — od záchranných operácií v studenej vode po prenájmy v tropických rezortoch. Prekračujeme inžinierske nároky tam, kde to najviac záleží.'
    - 'Presnosť výroby: Naše zariadenia používajú CNC rezanie, vysokofrekvenčné zváranie a automatizované tlakové testovanie. Každý šev, každé ventily, každý fitting spĺňa zdokumentované špecifikácie.'
    - 'Neustále inovácie: Náš tím výskumu a vývoja neustále hodnotí nové materiály, výrobné metódy a vylepšenia dizajnu. Nepočkáme, kým problémy vzniknú — predvídame ich.'
