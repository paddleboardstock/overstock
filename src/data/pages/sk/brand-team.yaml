hero:
  tagline: Náš tím
  title: Ľudia za Aquafarer<br />— Inžinierstvo slobody na vode
  subtitle: Spoločnosť Aquafarer bola založená v roku 2012 v Qingdaou v Číne a vybudovaná námornými inžiniermi, materiálovými vedcami a nadšencami vodných športov, ktorí verili, že profesionálne nafukovacie vodné plavidlá by mali byť dostupné celosvetovo.
  image:
    src: /images/team-all.webp
    alt: Aquafarer úplná fotografia tímu — inžinierstvo, výroba a vedenie
founding:
  tagline: Naše založenie
  title: Od pobrežnej dielne<br />k závodu s rozlohou 12 000 m²
  subtitle: Aquafarer bola založená tímom námorných inžinierov s desaťročiami kombinovaných skúseností v dizajne nafukovacích lodí, výrobe PVC/Hypalon a globálnej výrobe námorného vybavenia.
  items:
    - title: 'Založené: 2012'
      description: Založené v Qingdaou v Číne — významnom námornom centre s hlbokou tradíciou stavby lodí.
      icon: tabler:calendar
    - title: 200–300 zamestnancov
      description: Vrátane 50+ výskumných a vývojových inžinierov, špecialistov na kontrolu kvality a výrobných technikov.
      icon: tabler:users
    - title: Závod s rozlohou 12 000 m²
      description: Dedikovaná výrobná hala so 6 výrobními linkami pre RIBs, nafukovacie lode a SUP dosky.
      icon: tabler:building-factory
    - title: 50+ obsluhovaných krajín
      description: Exportujeme do Európy, Amerík, Blízkeho východu, Ázie a Tichomoria a Afriky.
      icon: tabler:globe
leadership:
  tagline: Vedenie
  title: Vedenie a technické vedenie
  subtitle: Náš vedúci tím spája hlbokú odbornosť v námornom inžinierstve, medzinárodnom obchode a riadení kvality.
