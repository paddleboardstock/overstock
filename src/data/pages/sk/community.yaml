stories:
  tagline: Príbehy prieskumníkov
  title: Skutočné dobrodružstvá od skutočných ľudí
  subtitle: Počúvajte od kanoistov, rodín a odborníkov, ktorí používajú výstroj Aquafarer na vode.
  items:
    - name: Sarah a Mike
      title: Majitelia Explorer 11, Kanada
      content: Naše Explorer 11 sme vzali na týždňový výlet cez Algonquin Park. Skvele zvládli prenášky a prechody jazier. Konštrukcia drop-stitch znamenala, že sme ich mohli nafúknuť na 15 PSI a dosiahnuť výkon dosky s tvrdým jadrom z prenosnej dosky.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Jazdec Cheetah Surge, Španielsko
      content: Cheetah Surge je moja voľba na pobrežné plachtenie. Živý dizajn priťahuje pohľady na pláži a stabilita mi dodáva istotu pri miernych vlnách. Skvele sa ovláda, či už cestujem alebo si len vychutnávam západ slnka.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Španielsko
    - name: Lina a rodina
      title: Pádleri tečúcej lotosovej kvety, Švédsko
      content: Víkendové rodinné dobrodružstvá na súostroví. Flowing Lotus je dostatočne stabilný, aby na ňom moja dcéra mohla stáť, kým ja pádlím. Nafúkne sa za menej ako 10 minút — nepotrebujete žiadny príves, iba čistá rodinná zábava na vode.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Štokholmské súostrovie, Švédsko
    - name: por. Cmdr. Andres
      title: Prieskumník Ocean Voyager, Filipíny
      content: Môj Ocean Voyager používam na dlhé pobrežné výlety okolo Palawanu. Po mesiacoch každodenného používania v tropických podmienkach doska stále funguje ako nová. Tvar určený na touring presekáva vlny, ktoré by zastavili slabšie dosky.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipíny
    - name: Emma T.
      title: Tropical Breeze prvýkrát, Austrália
      content: Nikdy predtým som nebol na SUP. Tropical Breeze je tak stabilná, že som sa cítil sebavedome už pri prvom pokuse. Teraz veslujem každý víkend. Krivka učenia je prakticky nulová — a doska vyzerá úžasne na vode.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Austrália
