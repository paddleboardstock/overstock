content_challenge:
  tagline: Výzva
  title: Jachtárske člny vyžadujú<br />Výkon a prezentáciu
  subtitle: Jachtársky čln je viac než len dinghy — je to predĺženie materskej lode a vyjadrenie kvality.
  paragraphs:
    - Majitelia jácht a kapitáni potrebujú člny, ktoré dobre plávajú, skladujú sa kompaktne a vyzerajú krásne. Čln by mal dopĺňať estetiku jachty a zároveň poskytovať spoľahlivú prepravu pre hostí a posádku.
    - '**Skladovanie je kritické** — Čln musí pasovať na palube, do garáže alebo na davity. Hmotnosť je dôležitá pre spúšťacie a zdvíhacie systémy. Aquafarer RIBs poskytujú vynikajúce pomery výkonu k hmotnosti s kompaktnými skladovacími profilmi.'
    - '**Očakávania výkonu sú vysoké** — Hostia očakávajú hladkú, suchú jazdu pri presune na breh. Možnosti motora musia vyvážiť rýchlosť, dojazd a úroveň hluku pre prémiový zážitok. Pre charterové prevádzky čln prevádzkuje denne a musí odolávať častému používaniu.'
    - '**Vzhľad je dôležitý** — Nesúladný alebo opotrebovaný čln znižuje celkovú prezentáciu jachty. Vlastné farby trubiek, čalúnenie a branding zabezpečia, že čln vyzerá, akoby tam patril.'
content_solution:
  tagline: Riešenie
  title: Konfigurácie člnov<br />Pre každé použitie jachty
  subtitle: Aquafarer RIB člny je možné prispôsobiť podľa vašej lode, typu prevádzky a požiadaviek na skladovanie — od špecifikácií staviteľov superjacht až po flotilové programy charterov.
  list:
    - Vlastné farby trubiek, ktoré ladia alebo dopĺňajú materskú loď — k dispozícii akákoľvek farba RAL pre Hypalon alebo PVC trubky
    - Vlastné čalúnenie a prešívanie — prémiový vinyl triedy marine s farebným zladením a výšivkou loga
    - Riadenie cez konzolu alebo kormidlo — výber podľa spôsobu používania a preferencií prevádzkovateľa
    - Hlboké V-fiberglassové trupy pre hladkú, suchú jazdu za rôznych morských podmienok
    - Kompaktné skladovanie — vyfukovacie alebo hniezdené pre terasu, garáž, skrinku alebo úložisko na žeriave
    - Hypalon Elektrónky na UV odpor a dlhodobé zachovanie vzhľadu
    - Zdvíhacie body a ťažné krúžky sú štandardom na všetkých modeloch
    - Voliteľný kryt na príď, plný kryt a ochranné chrániče proti odieraniu
    - 'Rozsah motora: 15 HP až 60 HP — vonkajšie alebo kormidlové konfigurácie'
    - OEM/súkromné označenie dostupné pre staviteľov jácht a námorných predajcov
content_segments:
  tagline: Profily zákazníkov
  title: Riešenia pre jachtové tenderové lode<br />Podľa typu zákazníka
  subtitle: Rôzne segmenty jachtárskeho priemyslu majú jedinečné požiadavky.Aquafarer Konfiguruje tendery tak, aby zodpovedali každej aplikácii.
  items:
    - title: Stavitelia superjácht
      subtitle: OEM Integrácia tendra — vlastné rozmery, farby a materiály
      description: 'Stavitelia jácht čelia opakujúcej sa výzve: každé nové plavidlo má jedinečné rozmerové obmedzenia, hmotnostné limity a estetické očakávania. Tender musí dokonale integrovať so systémom žeriavov materskej lode, zapadnúť do presných rozmerov garáže a zodpovedať dizajnovému jazyku viacmiliónovej jachty. Akýkoľvek nesúlad — nesprávna farba rúry, nesprávne umiestnenie zdvíhacieho bodu, nekompatibilná hmotnosť — oneskoruje dodávku a negatívne odráža na staviteľovi.Aquafarer Spolupracuje priamo s tímami pre obstarávanie a dizajn staviteľov na dodaní tendrov s vlastnými farbami RAL rúr, zladeným čalúnením, značkovými konzolovými panelmi a OEM kompletnými dokumentačnými balíkmi.'
      features:
        - Vlastné dimenzionálne špecifikácie zodpovedajúce garážovým a davitovým obmedzeniam
        - Akákoľvek RAL farba trubice a ladiace čalúnenie — poskytnuté vzorky schválenia dizajnu
        - OEM Značka na konzolách, trubkách a operadlách sedadiel
        - Validácia zdvíhacieho bodu a usadenia davitu pre každý model
        - Hmotnosť trupu optimalizovaná pre špecifikované štartovacie a záchranné systémy
        - Plánovanie hromadných dodávok v súlade s výrobnými harmonogramami
    - title: Spoločnosti na správu jácht
      subtitle: Flotilové štandardizované tendrá — globálna podpora, minimálne prestoje
      description: Správcovské spoločnosti dohliadajú na viaceré jachty operujúce v Stredozemnom mori, Karibiku, južnom Pacifiku a ďalej. Ich základnou potrebou je spoľahlivosť — pokazená zásobovacia loď v odľahlom prístave znamená nadčasy posádky, sťažnosti hostí a drahé náhrady na poslednú chvíľu. Štandardizované špecifikácie flotily skracujú čas školenia posádky naprieč plavidlami a zjednodušujú správu náhradných dielov.Aquafarer Ponúka cenové schémy pre viac plavidiel, konzistentné špecifikácie naprieč objednávkami a globálnu podporu náhradných dielov pre manažérske spoločnosti s plavidlami v rôznych regiónoch.
      features:
        - Štandardizované špecifikácie pre celú spravovanú flotilu
        - Vymeniteľné náhradné diely vo všetkých tendrových vozidlách
        - Ceny vozového parku a zľavy na objem pri objednávkach viacerých jednotiek
        - Globálna dostupnosť náhradných dielov — rýchla doprava do akéhokoľvek prístavu
        - Konzistentná servisná a údržbová dokumentácia pre posádku
        - Koordinácia doručenia viacerých jednotiek na rôzne miesta plavidiel
    - title: Prevádzkovatelia prenájmu jácht
      subtitle: Vysokofrekvenčné denné prevádzky — odolnosť bez kompromisov na vzhľade
      description: 'Charterové tendery čelia najnáročnejšiemu prevádzkovému harmonogramu v jachtárskom priemysle: denné presuny hostí, výlety na pevninu, podpora vodných športov a prístavné tendery — často 200+ operácií za sezónu prenájmu. Tender musí vyzerať bezchybne pri každom odovzdaní hostí, pričom musí odolávať neustálemu nastupovaniu, vystaveniu slanej vode a prevádzke motorov. Zhoršovanie vzhľadu je priamym obchodným problémom — opotrebovaný tender ovplyvňuje hodnotenia hostí a ceny prenájmu.Aquafarer Konfiguruje charterové tendery s vylepšeným čalúnením, Hypalon ťažkými rúrami a zosilnenými manipulovacími plochami pre dlhodobú odolnosť, ktorá zachováva kvalitu prezentácie.'
      features:
        - Hypalon Ťažké rúry — životnosť 5-8 rokov v dennej charterovej doprave
        - Zosilnené schody na nástup a laná na manipuláciu pre časté použitie
        - Prémiové vinylové čalúnenie odolné voči škvrnám — jednoduché čistenie medzi chartermi
        - Ľahko čistiteľné protišmykové povrchy mostovky
        - Spoľahlivé externé balíky s jednoduchým prístupom k servisu pre krátku objednávku
        - Kozmetické materiály, ktoré si zachovávajú vzhľad počas celých sezón
    - title: Predajcovia a sprostredkovatelia jácht
      subtitle: Spoľahlivé zásobovanie tendrom pre dokončenie plavidla a hodnotu pri predaji
      description: Predajcovia a makléri potrebujú stabilnú zásobu kvalitných tendrových lodí, ktoré dopĺňajú plavidlá, ktoré predávajú – zodpovedajú pozícii značky a zlepšujú zážitok kupujúceho. Nekonzistentné oneskorenie tenderu alebo dodávok môže oneskoriť odovzdanie jachty alebo znížiť prezentáciu v ponuke. Predajcovia požadujú konzistentnú kvalitu naprieč šaržami, spoľahlivé dodacie lehoty a konkurencieschopné ceny, aby si udržali marže.Aquafarer Ponúka programy zásob predajcov so sezónnym plánovaním doručenia, možnosťami spolubrandingu pre vystavenie v showroome a prideľovaním priorit počas vrcholnej sezóny.
      features:
        - Programy zásobovania s modelmi dostupnými na požiadanie
        - Sezónne plánovanie doručenia v súlade s kalendárom odovzdávania
        - Spoločné brandovanie predajcov na konzolách a trubičkách pre vystavenie v predajni
        - Konzistentná kvalita a špecifikácie naprieč všetkými objednávkami šarží
        - Konkurencieschopné ceny predajcov s úrovňou založenou na objeme
