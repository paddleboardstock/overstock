hero:
  tagline: Distribútori a veľkoobchod vodných športov
  title: Veľkoobchodné partnerstvo<br />Pre distribútorov vodných športov
  subtitle: Staňte sa distribučným partnerom Aquafarer. Získajte prístup k nášmu plnému produktovému katalógu, exkluzívnym veľkoobchodným cenám, podpore drop-ship a správe účtov.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer výroba a veľkoobchodná distribúcia
direct_answer: Aquafarer ponúka komplexné veľkoobchodné partnerstvá pre distribútorov vodných športov po celom svete. Partneri získavajú veľkoobchodné ceny na celý produktový katalóg, dedikovanú správu účtov, marketingové materiály a logistickú podporu. Ponúkame možnosti drop-ship, privátne značenie a flexibilné minimálne objednávky, aby vyhovovali vášmu obchodnému modelu.
solution_offerings:
  - title: Distribútor Začiatočník
    subtitle: Pre nové partnerstvá a regionálnych distribútorov
    badge: Popular
    features:
      - title: Plný prístup ku katalógu
        description: Veľkoobchodné ceny na všetky SUP dosky, kajaky, RIBs a doplnky
      - title: Dedikovaný správca účtu
        description: Jednotný kontaktný bod pre objednávky, podporu a informácie o produktoch
      - title: Marketingové materiály
        description: Fotografie produktov, technické listy, brožúry a digitálne zdroje vo vašom jazyku
      - title: Logistická podpora
        description: Koordinácia dopravy, colná dokumentácia a doručenie z skladu
      - title: Program vzoriek
        description: Zľavnené vzorkové objednávky pre výstavné priestory a predvádzanie obchodníkom
    cta_text: Podajte žiadosť o partnerstvo
    cta_href: /contact
  - title: Distribútor Premium
    subtitle: Pre etablovaných distribútorov s pokrytím viacerých krajín
    badge: Best Value
    features:
      - title: Stupňované ceny
        description: Cenové úrovne podľa objemu s kvartálnymi rebate programami
      - title: Výhradné územie
        description: Chránené distribuční práva pre váš región alebo krajinu
      - title: Drop-Ship program
        description: Priama doprava k vašim zákazníkom z našich skladov s vašou značkou
      - title: Privátne označenie
        description: Plná podpora OEM/ODM pre vašu vlastnú značku — dosky, lode a doplnky
      - title: Prioritná podpora
        description: 48-hodinová záruka odpovede, vyhradený koordinátor logistiky a urýchlené objednávky
    cta_text: Vylepšiť partnerstvo
    cta_href: /contact
  - title: Hlavný distribútor
    subtitle: Pre veľkoobjemových regionálnych a národných distribútorov
    badge: Enterprise
    features:
      - title: Strategické partnerstvo
        description: Spoločné obchodné plánovanie, fondy pre rozvoj trhu a programy spolumarketingu
      - title: Vývoj vlastných produktov
        description: Exkluzívne návrhy a špecifikácie produktov pre váš trh
      - title: Podpora miestneho skladu
        description: Konsignačný sklad, miestne zásoby náhradných dielov a nastavenie regionálneho servisného centra
      - title: Podpora siete predajcov
        description: Školenia, certifikačné kurzy a integrácia lokalizácie predajcov
      - title: Ročný summit partnerov
        description: Strategické stretnutia, náhľady produktov a budovanie siete s globálnymi partnermi
    cta_text: Preskúmať Hlavné partnerstvo
    cta_href: /contact
benefits:
  - title: Priamy prístup k výrobcom
    description: Žiadni sprostredkovatelia. Pracujete priamo s továrňou, ktorá navrhuje, vyvíja a vyrába každý produkt.
    icon: tabler:building-factory
  - title: Konkurenčné marže
    description: Veľkoobchodné ceny s množstevnými zľavami, programy odmien a chránené územia.
    icon: tabler:coin
  - title: Podpora marketingu
    description: Profesionálne produktové materiály, lokalizované brožúry a kampane s ko-značkou.
    icon: tabler:chart-bar
  - title: Partnerstvo v logistike
    description: Koordinovaná doprava, podpora colného konania a možnosti miestneho skladu na zníženie vašich logistických nákladov.
    icon: tabler:truck-delivery
content_segments:
  tagline: Profily partnerov
  title: Modely distribučného partnerstva<br />Podľa typu partnera
  subtitle: Rôzni distribútori prinášajú rôzne silné stránky na trhu — regionálnu infraštruktúru, dosah e-commerce, špecializovaný retail alebo portfóliá viacerých značiek. Struktúrujeme podmienky partnerstva, cenové úrovne a úroveň podpory tak, aby zodpovedali profilu každého partnera.
  items:
    - title: Regionálni marine distribútori
      subtitle: Distribúcia výlučná pre územie B2B
      description: Zabehnutí distribútori so skladovou infraštruktúrou, sieťami predajcov a logistickými kapacitami, ktorí obsluhujú predajcov marine vybavenia, predajcov vodných športov a prenajímateľov v rámci definovaného geografického územia. Potrebujete kompletnú produktovú radu, chránené ceny a schopnosť obsluhovať účty predajcov s miestnym skladom a podporou.
      features:
        - Ochrana výlučného územia s minimálnymi podmienkami záväzku
        - Kompletné katalógové veľkoobchodné ceny s štvrťročnými objemovými zľavami
        - Miestny konsignačný program pre rýchlo sa pohybujúce SKU
        - Školenia v sieti predajcov a spoločné marketingové programy
    - title: E-commerce a online predajcovia
      subtitle: Distribučné kanály zamerané na digitálne technológie
      description: Online predajcovia predávajú vybavenie na vodné športy cez Amazon, eBay alebo vlastné e-commerce platformy. Rýchlosť uvedenia na trh, konkurencieschopné ceny a logistika priameho predaja spotrebiteľom sú kľúčové. Potrebujete partnera, ktorý dokáže jednotlivé objednávky pod vašou značkou doručiť bez rýchleho vybavenia a bez rizika zásob.
      features:
        - 'Drop-ship program: priame plnenie z továrne s vašou značkou'
        - API feed pre inventár v reálnom čase pre vašu e-commerce platformu
        - Integrácia Amazon Seller Central s EAN/UPC podporou
        - Vrátane logistiky vrátenia a spracovania reklamácií
    - title: Špecializovaní predajcovia vodných športov
      subtitle: Partneri v kamenných predajniach
      description: Fyzické maloobchodné predajne špecializované na vybavenie na vodné športy — slúžia miestnym vodákarom, rybárom a vodákom s osobným predajom, ukážkami a popredajnými službami. Potrebujete obaly optimalizované pre maloobchod, programy ukážok a materiály na predajné miesta, ktoré presvedčia zákazníkov, ktorí prichádzajú bez objednania.
      features:
        - 'Program ukážkových jednotiek: zľavnené výstavné tabule v showroome'
        - Balenie pripravené na predaj s dizajnom krabice optimalizovaným pre regály
        - Predajné displeje, porovnávacie tabuľky a sprievodcovia pre kupujúcich
        - Program školenia a certifikácie personálu priamo v predajni
    - title: Distribútori viacerých značiek a obchodných domov
      subtitle: Široká distribúcia športových potrieb
      description: Veľkí distribútori obsluhujúci obchodné domy, veľké maloobchodné reťazce a športové reťazce s viacznačkovými katalógmi. Konzistentnosť, dokumentácia súladu a súlad dodávateľov sú kľúčové — každý SKU musí spĺňať špecifické štandardy balenia, označovania a kvality pre predajcu.
      features:
        - 'Dokumentácia o súlade maloobchodníkov: špecifikácia obalu, čiarový kód, označenie'
        - Integrácia EDI/ASN pre systémy objednávok veľkých maloobchodníkov
        - Zásoby spravované dodávateľom a programy automatického dopĺňania
        - Dedikovaná správa účtov s 24-hodinovým SLA
