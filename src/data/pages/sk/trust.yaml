features3_certifications:
  title: Certifikácie a súlad
  subtitle: Každý produkt je nezávisle testovaný; 64 modelov je CE certifikovaných podľa medzinárodných noriem.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Certifikácia
      description: 64 modelov certifikovaných podľa CE v kategóriách SUPs, kajaky, člny a RIBs spĺňajú európsku bezpečnostnú normu CE pre rekreačné plavidlá. Každý produkt prechádza testovaním tlaku, vztlaku a zaťaženia pred opustením továrne.
      icon: tabler:certificate
    - title: ''
      description: Naše zariadenie v Qingdao o rozlohe 12 000 m² pracuje pod systémom riadenia kvality ISO 9001. Každá výrobná šarža je sledovateľná, dokumentovaná a kontrolovaná.
      icon: tabler:clipboard-check
    - title: BSCI Sociálna súladnosť
      description: Sme certifikovaní BSCI, čo zaručuje etické pracovné praktiky, bezpečné pracovné podmienky a environmentálnu zodpovednosť v celom našom dodávateľskom reťazci.
      icon: tabler:users
    - title: REACH & RoHS
      description: Všetky materiály — PVC, Hypalon, EVA pena, lepidlá — spĺňajú predpisy EÚ REACH a RoHS. Žiadne obmedzené látky, žiadne kompromisy.
      icon: tabler:flask
    - title: Laboratórium testovania materiálov
      description: Vnútorná laboratórium materiálov testuje pevnosť v ťahu, odolnosť voči UV, integritu švov a odolnosť voči oderu každého šarže látky pred výrobou.
      icon: tabler:microscope
    - title: 5-ročná záruka na loď
      description: Paddle Board Overstock lode sú kryté 5-ročnou obmedzenou zárukou na tkaninu trubice, švy a trup. SUP dosky a príslušenstvo majú 2-ročnú záruku. Stojíme si za tým, čo vyrábame.
      icon: tabler:shield-check
testimonials:
  tagline: Dôvera zákazníka
  title: Čo hovoria naši zákazníci
  subtitle: Od tých, ktorí veslujú prvýkrát, až po profesionálnych prevádzkovateľov flotíl — zistite, prečo dôverujú Paddle Board Overstock.
  items:
    - content: Vyposażili sme celý náš flotilový prenájom Paddle Board Overstock RIBs — 12 lodí na troch lokalitách. Dve sezóny, žiadne poruchy. Certifikačná dokumentácia CE umožnila bezproblémové schválenie poistenia. Ich inžiniersky tím dokonca prispôsobil farby trubíc, aby zodpovedali našej značke.
      name: Marco Valenti
      title: Riaditeľ prevádzky, Adriatic Adventure Tours — Dubrovník, Chorvátsko
    - content: Ako prvý kupujúci som bol nervózny ohľadom kvality pri objednávaní zo zahraničia. Dokumentácia ISO a testovacie správy tretích strán, ktoré zdieľali skôr, než som sa pýtal, mi dali úplnú dôveru. Doska dorazila za 6 dní a predčila moje očakávania.
      name: James Thornton
      title: SUP Majiteľ Explorer 11 — Vancouver, Kanada
    - content: Prevádzkujeme 24 Paddle Board Overstock RIBs naprieč našou pobrežnou hliadkovou flotilou. Ich proces kontroly kvality je konzistentný v každej sérii — rovnaká kvalita švov, rovnaké umiestnenie ventilov, rovnaké hodnotenie tlaku zakaždým. Táto opakovateľnosť je dôležitá, keď životy závisia od vybavenia.
      name: Poručík veliteľ Andres Reyes
      title: Námorný nákupný úradník, Filipínska pobrežná strážná záložná služba — Manila, Filipíny
features3_lab:
  title: Vlastná testovacia a kvalitatívna laboratórium
  subtitle: Každá dávka materiálu a hotový produkt prechádza našou laboratóriou testovania pred odoslaním.
  columns: 3
  isBeforeContent: true
  items:
    - title: Testovanie ťažnej pevnosti
      description: 'Každá rolka PVC látky je testovaná podľa štandardov ASTM D751. Minimálny požiadavok: 350 N/cm v osnovnej aj útkovej osi. Odmietnuté dávky sa vracajú dodávateľovi — odmietame približne 3 % prijatých materiálov.'
      icon: tabler:scale
    - title: UV Urýchlený stárnutie
      description: Vzorky látky podstupujú 1 000-hodinové urýchlené poveternostné skúšky QUV (ASTM G154). Zachovanie ťažnej pevnosti musí presiahnuť 80 % po UV expozícii. Produkty sú hodnotené na 3+ rokov používania vonku.
      icon: tabler:sun
    - title: Odtrhová pevnosť švov
      description: RF zvárané švy testované s minimálnou odtrhovou pevnosťou 5 N/mm (ASTM D751). Ručne lepené Hypalon švy testované na 3,5 N/mm. Každá výrobná dávka má švové vzorky destruktívne testované a archivované.
      icon: tabler:stack
    - title: Udržiavanie tlaku 24–48 hodín
      description: 'Každý nafukovací produkt je nafúknutý na 1,25x hodnotený PSI a monitorovaný 24–48 hodín. Maximálny prípustný pokles tlaku: 5 %. Produkty, ktoré test neprejdú, sú prerobené a opäť testované pred odoslaním.'
      icon: tabler:wind
    - title: Testovanie cyklu ventilov
      description: Každý dizajn ventilu prechádza 10 000 otváracích a zatváracích cyklov v našej laboratóriu. Ventily musia po cykloch udržiavať úplnú tesnosť pri 1,25x hodnotenom tlaku. Všetky Paddle Board Overstock ventily sú hodnotené na 5+ rokov bežného používania.
      icon: tabler:rotate
    - title: Odolnosť proti praskaniu v chlade
      description: Materiály sú testované pri -30 °C po dobu 4 hodín podľa ISO 4646. Nie je povolené žiadne praskanie alebo krehkosť. Produkty sú hodnotené pre zimné skladovanie a používanie v studenej vode až do -10 °C okolitej teploty.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Ako zabezpečujeme kvalitu
  subtitle: Od kontroly surovín až po konečné testovanie tlaku — každý produkt prechádza prísnym reťazcom kvality.
  items:
    - title: Inšpekcia surovín
      description: Každá rolka PVC látky je testovaná na hrúbku, ťažnú pevnosť a UV odolnosť pred vstupom do výroby.
      icon: tabler:search
    - title: Kontrola kvality vo výrobe
      description: Zvárané švy, inštalácie ventilov a spojenie komôr sú kontrolované na každej stanici počas montáže.
      icon: tabler:eye
    - title: Tlakové testovanie
      description: Každý nafukovací produkt sa nafúkne na hodnotu 1,25x PSI a uchováva sa 24–48 hodín na overenie zadržiavania vzduchu a integrity švu.
      icon: tabler:wind
    - title: Záverečná inšpekcia
      description: Každá jednotka je pred schválením na odoslanie skontrolovaná na povrchovú úpravu, hardvér a balenie. Vzorky šarží idú do nášho laboratória na deštruktívne testovanie.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Často kladené otázky o lodiach
  subtitle: Bežné otázky ohľadom našich nafukovacích člnov s pevným trupom.
  columns: 2
  items:
    - title: Aké veľkosti RIB lodí Paddle Board Overstock ponúka?
      description: Ponúkame 35 modelov s dĺžkou RIB od 2,5 m do 7,6 m, pokrývajúcich všetko od kompaktných tendrov až po ťažké komerčné a hliadkové plavidlá. Každý model je dostupný s viacerými konfiguračnými možnosťami.
    - title: Aký je rozdiel medzi RIB nafukovacou loďou a tradičnou nafukovacou loďou?
      description: (RIBRigid-Hull Inflatable Boat) kombinuje pevný laminátový alebo hliníkový hlboký V trup s nafukovacími Hypalon alebo PVC rúrkovými člnmi. To vám poskytuje stabilitu a nosnosť tvrdej lode s tlmením nárazov a vztlakom nafukovacieho člna.
    - title: S akými motormi sú kompatibilné Paddle Board Overstock RIBs?
      description: RIBs Podporujeme vonkajšie motory od 3 HP do 250 HP v závislosti od modelu. Každá produktová stránka uvádza maximálny menovitý výkon motora. Odporúčame poradiť sa s vaším predajcom pre ideálnu kombináciu.
    - title: Sú Paddle Board Overstock RIBs CE certifikovaní?
      description: Áno. Všetky RIB rekreačné modely sú certifikované CE podľa platných európskych noriem pre rekreačné plavidlá. Komerčné a hliadkové modely spĺňajú dodatočné požiadavky na stabilitu a zaťaženie.
    - title: Aká je záruka na RIB lode?
      description: Všetky Paddle Board Overstock RIBs majú 5-ročnú obmedzenú záruku na látku trubiek, švy a trup; nafukovacie ventily kryté na 5 rokov; továrensky inštalované príslušenstvo kryté na 1 rok.
    - title: Koľko vzduchových komôr Paddle Board Overstock RIBs vlastne máte?
      description: RIBs Máme 3 až 7 nezávislých vzduchových komôr v závislosti od dĺžky modelu. Tento viackomorový dizajn zabezpečuje, že loď zostane na hladine aj v prípade poškodenia jednej komory.
faqs_inflatable:
  title: Často kladené otázky ohľadom nafukovacích člnov
  subtitle: Bežné otázky o našich nafukovacích člnoch, kajakoch a člnoch.
  columns: 2
  items:
    - title: Aké materiály sa používajú v Paddle Board Overstock nafukovacích člnoch?
      description: Používame vojenskú kvalitu PVC (1100 denierov) a prémiovú Hypalon/CSM gumu, v závislosti od modelu. Oba materiály sú UVstabilizované, odolné voči opotrebovaniu a v súlade s REACH RoHS predpismi EÚ a predpismi.
    - title: Ako dlho vydržia nafukovacie člny?
      description: Pri správnej starostlivosti vydrží PVC kvalitná nafukovací čln 7–10 rokov, zatiaľ čo Hypalon modely môžu vydržať 15–20 rokov. Pravidelné čistenie UV , ochrana a správne skladovanie výrazne predlžujú životnosť.
    - title: Aká údržba je potrebná pre nafukovací čln?
      description: Základná údržba zahŕňa oplachovanie čerstvou vodou po každom použití (najmä v slanej vode), sušenie pred skladovaním, každoročnú kontrolu tesnení ventilov a aplikáciu UV ochranného prostriedku na hadičky. Vyhnite sa dlhodobému slnečnému žiareniu, keď sa nepoužívajú.
    - title: Môžu sa nafukovacie člny používať v slanej vode?
      description: Áno. Všetky Paddle Board Overstock nafukovacie člny sú navrhnuté na použitie vo sladkej aj slanej vode. Odporúčame opláchnuť čerstvou vodou a dôkladne vysušiť po vystavení slanej vode, aby sa zabránilo korózii a kryštalizácii textilnej soli.
    - title: Ako uskladniť nafukovací čln?
      description: Vyfúknite, vyčistite a úplne vysušte loď pred uskladnením. Voľne rolujte (vyhnite sa tesným záhybom), skladujte na chladnom a suchom mieste mimo priameho slnečného žiarenia a vyhýbajte sa betónovým podlahám, aby ste zabránili odvádzaniu vlhkosti.
    - title: Aká je nosnosť Paddle Board Overstock nafukovacích člnov?
      description: Nosnosť sa pohybuje od 290 kg u našich najmenších modelov až po viac ako 2000 kg u väčších komerčných plavidiel. Každá stránka produktu uvádza maximálnu nosnosť pre váš konkrétny model.
faqs_sup:
  title: SUP Často kladené otázky o doskách
  subtitle: Bežné otázky o našich stand-up paddle boardoch.
  columns: 2
  items:
    - title: Aké SUP veľkosti dosiek sú k dispozícii?
      description: Ponúkame SUP dosky od 9 ft do 12 ft, vrátane univerzálnych, touring, joga a špecializovaných dizajnov. Naše najpredávanejšie modely zahŕňajú Tropical Breeze (10 ft) a Ocean Voyager (11 ft).
    - title: Čo je drop-stitch konštrukcia?
      description: Drop-stitch konštrukcia využíva tisíce polyesterových vlákien spájajúcich hornú a spodnú vrstvu dosky, čo umožňuje držať vysoký tlak vzduchu (15–20 PSI) a dosiahnuť pevnú, stabilnú platformu. Toto je priemyselný štandard pre prémiové nafukovacie SUPs.
    - title: Aký je limit hmotnosti pre SUP dosky?
      description: Naše SUP dosky podporujú až 150 kg podľa modelu a objemu. Doska Leviathan Wake je náš model s najvyššou kapacitou, navrhnutý pre väčších jazdcov a využitie pri joge.
    - title: Ponúkate kompletné SUP balíky?
      description: Áno. Každá SUP doska je dodávaná s kompletným balíkom vrátane 3-dielneho hliníkového pádla, ručnej pumpy s vysokým tlakom, bezpečnostného šnúrového leasha, cestovného batohu a opravného setu. Niektoré modely taktiež obsahujú odnímateľný set plutvy.
    - title: Aká je záruka na SUP dosky?
      description: Všetky Paddle Board Overstock SUP dosky nesú 2-ročnú záruku proti výrobným chybám, vrátane poruchy švov, závad ventilov a delaminácie materiálu pri bežnom používaní.
    - title: Ako dlho trvá nafúknutie SUP dosky?
      description: Pomocou priloženej ručnej pumpy trvá úplné nafúknutie na 15 PSI približne 8–12 minút. Pre rýchlejšie nafúknutie odporúčame našu Paddle Board Overstock 12V elektrickú pumpu, ktorá nafúkne dosku za menej ako 4 minúty.
