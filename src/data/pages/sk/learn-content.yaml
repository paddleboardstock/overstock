articles:
  sup:
    - title: SUP Základy — Príručka pre začiatočníkov
      desc: Všetko, čo začínajúci potrebuje vedieť — typy dosiek, veľkosti pádiel, postoj a tipy na prvý deň.
    - title: SUP Veľkostný sprievodca
      desc: Nájdite správnu dĺžku, šírku a objem dosky podľa svojej váhy, zručnosti a štýlu pádlovania.
    - title: Nafukovacia vs tvrdá doska
      desc: Ktoré je pre vás správne? Porovnanie prenosnosti, výkonu, odolnosti a ceny.
    - title: Stredne pokročilé techniky
      desc: Zlepšite svoje pádlovanie pomocou pokročilých ťahov, techník otáčania a zvládania drsnej vody.
    - title: Ako vybrať nafukovací SUP
      desc: Navigujte kľúčové faktory — konštrukcia, hrúbka, nastavenie plutiev a súčasti príslušenstva.
    - title: Bezpečnosť vo vode
      desc: Základné bezpečnostné znalosti vrátane čítania počasia, výberu PFD, sebazáchrany a skupinového pádlovania.
  inflatable-boat:
    - title: Referencie materiálov
      desc: PVC, Hypalon, drop-stitch, denier hodnotenia — pochopte, z čoho je vaše nafukovacie vybavenie vyrobené.
    - title: PVC vs Hypalon
      desc: Definitívne porovnanie PVC a Hypalon tkanín pre nafukovacie člny — odolnosť, UV odolnosť a cena.
    - title: Drop-Stitch Vysvetlenie jadra
      desc: Ako tisíce vnútorných vlákien vytvára pevnú platformu pri 12-15 PSI pre vysokovýkonný nafukovací SUPs.
    - title: Prehľad nafukovacej technológie
      desc: Ako sú konštruované nafukovacie člny a SUPs — od vrstvenia materiálu po ventilové systémy a zváranie švov.
    - title: Príručka k pevným nafukovacím člnom (RIB)
      desc: Všetko o konštrukcii RIB, typoch trupu, materiáloch trubíc a výbere správneho RIB pre vaše potreby.
    - title: Nafukovací čln vs RIB
      desc: Kľúčové rozdiely medzi tradičnými nafukovacími člnmi a pevnými nafukovacími člami pre rôzne použitie.
  water-safety:
    - title: Príručka bezpečnosti na vode
      desc: Základné bezpečnostné znalosti pre každého veslára — počasie, PFD, sebazáchrana a protokoly skupinového pádlovania.
    - title: Príručka o záchranných vestách a PFD
      desc: Ako vybrať správne osobné plávacie zariadenie pre SUP, kajakovanie, člnkovanie a profesionálne použitie.
    - title: Bezpečnostný kontrolný zoznam SUP
      desc: Pred spustením do vody by mal každý stojaci paddleboardista nasledovať bezpečnostný kontrolný zoznam.
    - title: Bezpečnosť pri pádlovaní v studenej vode
      desc: Základné opatrenia, vybavenie a techniky pádlovania v studených vodách.
    - title: Začiatočnícke chyby pri pádlovaní
      desc: Bežné chyby, ktoré robia začiatočníci, a ako sa im vyhnúť pre bezpečnejší a príjemnejší zážitok.
    - title: CE Vysvetlenie certifikácie
      desc: Čo CE znamená certifikácia pre nafukovacie vodné plavidlá — štandardy, testovanie a prečo je to dôležité pre bezpečnosť.
