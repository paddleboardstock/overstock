        description: Vývoj zákazkovej formy, optimalizácia tvaru a ladenie výkonu
      - title: Kompletný dizajn balenia
        description: Balenie pripravené na predaj, závesné štítky, návody na použitie a skúsenosť s rozbaľovaním
      - title: Digitálne aktíva
