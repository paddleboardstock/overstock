hero:
  tagline: Graf znalostí
  title: Poznatky o prieskume vody
  subtitle: |
    Štruktúrovaná databáza znalostí pokrývajúca technológiu nafukovacích SUP<br />
    bezpečnosť na vode, lodné inžinierstvo a plánovanie dobrodružstva.
  taglineSection: Objavujte. Učte sa. Choďte s dôverou.
clusters:
  tagline: Klastre poznatkov
  title: Preskúmajte podľa témy
  subtitle: Hlboké ponory do technológie, bezpečnosti a zručností za každým produktom Paddle Board Overstock.
  items:
    - title: Poznanie SUP
      description: Od výberu vašej prvej dosky po pokročilé techniky turistiky — všetko o paddleboardingu v stoji.
      icon: tabler:lifebuoy
      topics:
        - Ako si vybrať svoju prvú nafukovaciu SUP
        - Najlepšia veľkosť SUP pre začiatočníkov
        - Aké ťažké je paddleboarding?
        - Porovnanie nafukovacej a tvrdej dosky
        - SUP bezpečnostný kontrolný zoznam
    - title: Poznanie o lodiach
      description: Technické príručky o nafukovacích člnoch, RIBs, súrodených lodiach a kajakoch — konštrukcia, materiály a prevádzka.
      icon: tabler:sailboat
      topics:
        - Vysvetlenie typov nafukovacích člnov
        - Porovnanie PVC vs Hypalon
        - RIB vs Dinghy porovnanie
        - hlboký ponor do technológie
        - Príručka námorného materiálového inžinierstva
    - title: Bezpečnostné znalosti
      description: Základné bezpečnostné znalosti pre každého kajakára — od výberu PFD až po čítanie počasia a techniky sebazáchrany.
      icon: tabler:shield
      topics:
        - SUP bezpečnostný kontrolný zoznam
        - Potrebujete záchrannú vestu?
        - Sprievodca bezpečnosťou pri pádlovaní v oceáne
        - Bezpečnosť na rieke pre nafukovacie kajaky
        - Povedomie o počasí a vodných podmienkach
    - title: Technológia
      description: Inžinierstvo za produktmi Paddle Board Overstock — materiály, metódy výstavby a testovanie kvality.
      icon: tabler:microscope
      topics:
        - Technológia námornej úrovne PVC
        - Drop-stitch Core vysvetlené
        - Prečo PSI je dôležité pre nafukovacie zariadenia SUPs
        - RF zváranie vs lepidlo
        - Testovanie kvality a certifikácia
    - title: Obchodné znalosti
      description: Komerční sprievodcovia budovaním a rozširovaním vášho podnikania v oblasti vodných športov — od prenájmu až po značku privátnej značky.
      icon: tabler:briefcase
      topics:
        - Ako začať SUP podnikanie na prenájom
        - Výstavba rekreačného vodného športového centra
        - Veľkosti vozového parku paddleboardov pre palice
        - Nafukovacie verzus tvrdé SUP na komerčné použitie
        - Najlepší materiál na kajaky pre prenájom flotíl
        - Založenie súkromnej značky vody
        - Stratégie príjmov z vodných športov v rezortoch
        - Sprievodca údržbou komerčného vybavenia
