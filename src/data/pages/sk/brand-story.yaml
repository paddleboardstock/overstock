content_founding:
  tagline: Začiatky
  title: Narodený na nábreží
  subtitle: 'Aquafarer začal v pobrežnej dielni v Qingdao s jednou loďou a víziou: postaviť nafukovacie plavidlá, ktoré zvládnu skutočné morské podmienky.'
  paragraphs:
    - V roku 2012 naši zakladatelia videli medzeru na trhu — väčšina nafukovacích člnov bola buď cenovo dostupná, ale nespoľahlivá, alebo kvalitná, ale neúnosne drahá. Verili, že je priestor pre výrobcu, ktorý dodáva kvalitu aj hodnotu.
    - Prvý trup bol postavený ručne, testovaný v miestnych vodách a zdokonaľovaný na základe skutočnej spätnej väzby od rybárov a malých komerčných prevádzkovateľov. Táto spätná väzba — stavať, testovať, počúvať, zlepšovať — zostáva jadrom našej inžinierskej filozofie dodnes.
    - Do roku 2015 sa správa rozšírila aj mimo Qingdao. Medzinárodní distribútori začali žiadať vzorky. To, čo začalo ako miestna dielňa, sa stalo globálnym dodávateľom.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Raná výrobná dielňa a výroba
content_growth:
  tagline: Rast a inovácie
  title: Z dielne na 12 000 m² Zariadenie
  subtitle: Neustále investovanie do ľudí, zariadení a procesov sa premenilo Aquafarer na moderné námorné výrobné zariadenie.
  paragraphs:
    - S rastúcim dopytom rástla aj naša prevádzka. Rozšírili sme sa z malej dielne na továreň s rozlohou 12 000 m² s vyhradenými výrobnými linkami pre RIB lode, nafukovacie člny, SUP dosky a príslušenstvo.
    - Investovali sme do CNC rezných strojov, zariadení na vysokofrekvenčné zváranie, výrobných liniek drop stitch a komplexných testovacích zariadení — čo nám umožňuje kontrolovať každý aspekt kvality výroby.
    - Dnes náš tím 200-300 ľudí zahŕňa námorných inžinierov, materiálových vedcov, špecialistov na kontrolu kvality a zručných remeselníkov — mnohí z nich sú tu Aquafarer už od začiatkov.
content_mission:
  tagline: Naša misia
  title: Inžinierska sloboda na vode
  subtitle: Každý Aquafarer produkt je navrhnutý tak, aby ľuďom pomáhal objavovať, pracovať a prosperovať na vode — spoľahlivo, bezpečne a cenovo dostupne.
  list:
    - Navrhnúť vodné plavidlo, ktoré funguje v reálnych morských podmienkach — nielen na papieri
    - Budujte trvalé partnerstvá s distribútormi a značkami prostredníctvom spoľahlivej služby OEM/ODM
    - Nepretržite zlepšujte naše výrobné procesy, aby sme poskytovali lepšiu hodnotu
    - Podporte každý produkt originálnymi náhradnými dielmi a technickými znalosťami
