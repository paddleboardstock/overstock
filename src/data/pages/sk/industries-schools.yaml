hero:
  tagline: Školy a tréningové centrá vodných športov
  title: Riešenia vybavenia<br />Pre SUP a školy kajakov
  subtitle: Spoľahlivé vybavenie komerčnej kvality pre školy pádlovania, surfovania, tréning kajakov a vzdelávacie programy vo vodných športoch v akomkoľvek rozsahu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP dosky pre školy a tréningové centrá
direct_answer: Paddle Board Overstock zásobuje SUP a školy kajakov po celom svete doskami komerčnej kvality, bezpečnostným vybavením a balíčkami pre inštruktorov. Naše vybavenie je vytvorené na každodenné výučbové použitie — hrubšie PVC, spevnené drop-stitch jadro a stabilné trupy, ktoré dávajú začiatočníkom dôveru a inštruktorom spoľahlivosť. Balíčky zahŕňajú vlastné značky, programy náhradných dielov a tréningové zdroje.
solution_offerings:
  - title: Balíček pre začínajúcu školu
    subtitle: Pre nové programy a malé tréningové centrá
    badge: Popular
    features:
      - title: Študentské dosky
        description: 10–25 univerzálnych SUP dosiek alebo rekreačných kajakov so stabilnou platformou pre začiatočnícke lekcie
      - title: Inštruktorské dosky
        description: Širšie, dlhšie dosky s extra stabilitou a protišmykovými EVA palubami pre koučovanie
      - title: Bezpečnostné vybavenie
        description: Záchranné vesty, bezpečnostné šňúrky, píšťalky a hádzacie vaky v zladených farbách
      - title: Skladovanie a preprava
        description: Stohovateľné stojany na dosky, polstrované nosiče kajakov a vozíky na prepravu
      - title: Podpora kurikula
        description: Šablóny lekcií, bezpečnostné kontrolné zoznamy a návody na zlepšovanie zručností
    cta_text: Balíček „Začni moju školu“
    cta_href: /contact
  - title: Balíček školského prémiového vybavenia
    subtitle: Pre zavedené školy a prevádzkovateľov viacerých programov
    badge: Best Value
    features:
      - title: Celá flotila
        description: 25–50 dosiek alebo kajakov s rôznorodou flotilou (univerzálne, turistické, mladšie veľkosti)
      - title: Inštruktorská flotila
        description: 3–5 špecializovaných inštruktorských dosiek s montážou pre reprodukčný systém
      - title: Bezpečnostná stanica
        description: Centralizovaná stanica bezpečnostného vybavenia s PFD, rádiami, prvou pomocou a značením
      - title: Balíček značky
        description: Celoplošná tlač loga na doskách, pádlech, PFD a uniformách
      - title: Program údržby
        description: Štvrťročné údržbové sady, balíky náhradných dielov a školenia na opravy
    cta_text: Vytvoriť prémiový balík
    cta_href: /contact
  - title: Balík pre školskú franšízu
    subtitle: Pre siete s viacerými prevádzkami a prevádzkovateľov franšíz
    badge: Enterprise
    features:
      - title: Štandardizácia flotily
        description: Identické vybavenie vo všetkých prevádzkach pre konzistentný zážitok študentov
      - title: Centrálne objednávanie
        description: Konsolidované objednávky, hromadné ceny a centralizované riadenie náhradných dielov
      - title: Školenie inštruktorov
        description: Certifikácia manipulácie s vybavením a údržby pre všetkých inštruktorov
      - title: Spoločné značkovanie
        description: Spoločné značkovanie s franšízou + Paddle Board Overstock možnosti spoločného značkovania
      - title: Podpora rozšírenia
        description: Konzultácie pre škálovanie, predpovedanie vybavenia a zriaďovanie nových prevádzok
    cta_text: Diskutovať o franšíznom pláne
    cta_href: /contact
benefits:
  - title: Vytvorené pre každodenné vyučovanie
    description: Hrubšie PVC a zosilnené lišty odolajú každodennému používaniu študentmi, pádom na piesok a skalnatému pristávaniu.
    icon: tabler:shield
  - title: Stabilné výučbové platformy
    description: Širšie trupy a plochejšie rockerové časti dodávajú začiatočníkom istotu. Inštruktori sa môžu sústrediť na vyučovanie, nie na vybavenie.
    icon: tabler:scale
  - title: Jednoduché skladovanie a preprava
    description: Nafukovací dizajn umožňuje skladovanie na malom priestore. Vyfúknuté dosky sa vojdú do štandardných batožinových priestorov vozidiel pre mobilné vyučovanie.
    icon: tabler:box-seam
  - title: Vlastné branding
    description: Školské logá a farby na každej doske. Vaša značka, vaša identita — nie generické prenajímané vybavenie.
    icon: tabler:brush
content_segments:
  tagline: Profil školy
  title: Riešenia pre vzdelávanie vo vodných športoch<br />Podľa typu programu
  subtitle: Školy pádlovania, surffingové akadémie, univerzitné programy a prevádzkovatelia franšíz čelia rôznym prevádzkovým výzvam — od integrácie učebného plánu po štandardizáciu flotily viacerých prevádzok. Konfigurujeme balíky vybavenia, aby zodpovedali edukačnému modelu.
  items:
    - title: Nezávislé SUP & školy kajakov
      subtitle: Vlastnícke tréningové centrá
      description: Malé až stredné školy prevádzkované majiteľmi-inštruktormi ponúkajúce SUP lekcie, tréning kajakov a certifikačné kurzy. Vybavenie musí byť dostatočne odolné pre každodenné vyučovanie, cenovo dostupné pre rozpočet malého podniku a dostatočne univerzálne, aby poslúžilo začiatočníkom aj stredne pokročilým študentom v jednej flotile.
      features:
        - SUP Stabilné univerzálne dosky a rekreačné kajaky pre začiatočnícke lekcie
        - Dosky špecifické pre inštruktora s dodatočnou stabilitou pri tréningu z vody
        - Zahrnuté sú šablóny plánov lekcií a návody na rozvoj zručností
        - Ročný program obnovy vybavenia so zľavami pri výmene
    - title: Univerzitné a vysokoškolské rekreačné programy
      subtitle: Veľkorozmerné rekreačné flotily študentov
      description: Univerzitné rekreačné oddelenia prevádzkujú pádlovacie kluby, programy prenájmu a inštruktážne kurzy ako súčasť rekreačných ponúk na kampuse. Vybavenie je vystavené maximálnemu využitiu počas semestrov, vyžaduje jednoduché systémy registrácie a odchodu a musí odolávať rôznym úrovniam zručností od prvákov až po pokročilých pádlovačov.
      features:
        - PVC Vysoko odolná konštrukcia hodnotená pre inštitucionálne cykly
        - Farebne rozlíšte flotily podľa úrovne zručností pre jednoduché riadenie
        - Kompatibilita systémov na sledovanie zásob založených na RFID alebo nálepkách
        - Hromadné cenotvorby s podmienkami objednávania a platieb podľa semestra
    - title: Surfové školy a surfové akadémie
      subtitle: Programy výučby pobrežného surfovania
      description: Surfové školy učia SUP surfovanie, pádlovanie v ľahu a surfovanie na kajaku v oceánskych prostrediach. Vybavenie musí zvládnuť podmienky v surfovej zóne — odolnosť voči nárazom, toleranciu piesku a slanej vody a ľahkú výmenu medzi hodinovými lekciami.
      features:
        - Tvary špecifické pre surf s vystuženými koľajnicami a nárazovou konštrukciou
        - Možnosti s mäkkými plutvami a stočené vodítka pre bezpečnosť študentov
        - Rýchlo oplachujúca látka, ktorá schne medzi rotáciami hodín
        - Program výmeny vozového parku s kontrolou a obnovou na konci sezóny
    - title: Franšízové a viacpobočkové reťazce
      subtitle: Štandardizované zariadenia naprieč lokalitami
      description: Prevádzkovatelia na viacerých miestach, ktorí prevádzkujú štandardizované školiace programy vo viacerých mestách alebo regiónoch. Konzistentnosť vozového parku naprieč lokalitami je kľúčová — každý študent by mal mať rovnaké skúsenosti s vybavením bez ohľadu na to, ktorú franchisingovú lokalitu navštívi. Centralizované objednávanie, jednotnosť značky a podpora škálovania sú nevyhnutné.
      features:
        - Identické špecifikácie flotily vo všetkých franšízových lokalitách
        - Centralizované konsolidované objednávanie s objemovým oceňovaním
        - 'Možnosti spolubrandingu: franšízová + Paddle Board Overstock značka spoluznačka'
        - 'Sada na nastavenie novej lokality: vybavenie, značenie a inventár na otvorenie'
