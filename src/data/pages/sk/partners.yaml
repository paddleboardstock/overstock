hero:
  tagline: Partneri a distribúcia
  title: Staňte Aquafarer sa partnerom<br />— Globálna distribučná sieť
  subtitle: Pridajte sa Aquafarerk globálnej partnerskej sieti. Spolupracujeme s námornými distribútormi, predajcami lodí, predajcami vybavenia a partnermi značiek v 50+ krajinách.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer Globálna sieť partnerov a distribútorov
content_programs:
  tagline: Partnerské programy
  title: Partnerské programy<br />Postavené pre rast
  subtitle: Či už ste distribútor, predajca alebo partner značky, Aquafarer ponúka programy navrhnuté na podporu vášho podnikania.
  columns: 3
  items:
    - title: Program distribútorov
      description: Exkluzívna distribúcia územia s množstvom cien, marketingovou podporou a priamym prístupom do továrne. Minimálny záväzok vyžadovaný podľa veľkosti územia.
      icon: tabler:world
    - title: Program predajcov
      description: Priame stanovovanie cien predajcov, školenia produktov, marketingové materiály a podpora záruky pre maloobchodné predajne a online obchody.
      icon: tabler:building-store
    - title: OEM/ODM Partnerstvo
      description: Kompletné služby OEM a ODM výroba s vlastným brandingom, balením a špecifikáciami produktu. Od konceptu až po kontajner.
      icon: tabler:certificate
    - title: Partnerstvo so značkou
      description: Co-branding, privátne značky a exkluzívne modelové programy pre etablované značky v oblasti námornej a vonkajšej rekreácie.
      icon: tabler:stars
    - title: Vládne a inštitucionálne
      description: Preferované dodávateľské programy pre vládne agentúry, pobrežnú stráž, armádu a humanitárne organizácie. Dokumentácia pripravená na tender.
      icon: tabler:building-community
    - title: Partner pre rezort a prenájom
      description: Ceny pre flotilu, konzistentná kvalita a vlastné branding pre rezorty, potápačské centrá a prevádzky prenájmu po celom svete.
      icon: tabler:sun
content_benefits:
  tagline: Prečo spolupracovať s nami
  title: Prečo si partneri vyberajú Aquafarer
  subtitle: Naši partneri profitujú z reálnych výrobných schopností, konzistentnej kvality a pohotovej podpory.
  list:
    - 'Priamy prístup do továrne: Spolupracujte priamo s naším výrobným tímom — bez sprostredkovateľov. Získajte rýchlejšie odpovede, lepšie ceny a úplný prehľad o výrobe.'
    - 'Pripravení na prispôsobenie: Značkujte svoje produkty vlastnými farbami, logami, balením a špecifikáciami. Minimálne množstvá objednávok prispôsobené vášmu trhu.'
    - 'Garantovaná kvalita: ISO 9001 certifikovaná výroba s CE, UKCA, a BSCI súladom. Každý produkt testovaný pred odoslaním.'
    - 'Globálna logistika: Zásielka z Qingdao, Čína s FOB, CIF, a DDP opciami. Americký sklad v Montclair, CA pre distribúciu v Severnej Amerike.'
    - 'Marketingová podpora: Katalógy produktov, fotografie, technická dokumentácia a digitálne aktíva na podporu vašich predajných aktivít.'
    - 'Školenia a podpora: Školenia o produktoch pre váš predajný tím, technická podpora pre vašich zákazníkov a koordinácia záručných služieb.'
content_process:
  tagline: Ako sa stať partnerom
  title: Jednoduchý proces partnerstva
  subtitle: Náš proces partnerstva je jednoduchý — navrhnutý tak, aby ste mohli rýchlo predávať Aquafarer produkty.
  items:
    - title: 'Krok 1: Odoslanie žiadosti'
      description: Vyplňte náš formulár žiadosti o partnerstvo s profilom vašej spoločnosti, cieľovým trhom a záujmom o produkty.
    - title: 'Krok 2: Prehľad kvalifikácie'
      description: Náš tím pre partnerstvá skontroluje vašu žiadosť a do 3 pracovných dní vás kontaktuje, aby prediskutoval možnosti.
    - title: 'Krok 3: Dohoda a nastavenie'
      description: Podpíšte dohodu o partnerstve, nastavte svoj účet a získajte partnerské ceny, marketingové materiály a ukážky produktov.
    - title: 'Krok 4: Školenie a spustenie'
      description: Poskytnuté školenie o produktoch, podpora predaja a marketingové materiály. Ste pripravení začať predávať.
cta:
  title: Pripravení stať sa Aquafarer partnerom?
  subtitle: Požiadajte o partnerstvo a náš tím vám odpovie do 3 pracovných dní.
  actions:
    - variant: primary
      text: Požiadajte o partnerstvo
      href: /contact
    - text: Prezrite si naše produkty
      href: /products
