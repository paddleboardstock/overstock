material_traceability:
  tagline: Sledovateľnosť
  title: Sledovanie materiálov a kontrola šarží
  description: Každej šarži surového materiálu je priradené jedinečné číslo šarže v našom systéme ERP. Od príchodu cez výrobu až po hotový výrobok, každý výrobok má kusovník linkovaný späť na pôvodnú šaržu dodávateľa. To umožňuje úplnú stopovateľnosť hore pre akúkoľvek otázku kvality alebo súladu.
  system: Vlastný ERP (interný systém) + fyzické štítky šarží na každom pracovnom príkaze
  coverage: 100 % výrobných materiálov — PVC, Hypalon, drop-stitch tkanina, lepidlá, ventily, hardvér, obaly
  records_retained: 10 rokov (podľa požiadavky CE 2013/53/EU)
  suppliers:
    - material: Marine-grade PVC
      source: Čínski a kórejskí dodávatelia
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch tkanina
      source: Interné tkanie + externý partner
      certified: Interná QC + dodávateľ ISO 9001
    - material: Ventily a hardvér
      source: Chinese OEM suppliers
      certified: ISO 9001, certifikáty materiálu podľa šarže
