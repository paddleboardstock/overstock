workshops_section:
  tagline: Workshopy
  title: Výrobné workshopy
  workshops:
    - title: PVC Rezanie a príprava materiálu
      description: Automatické CNC rezacie stroje spracovávajú látky PVC, Hypalon a drop-stitch s presnosťou na submilimetre. Počítačom optimalizované rozloženie minimalizuje odpad materiálu a zaisťuje, že každý panel spĺňa svoje rozmerové špecifikácie pred zváraním.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Zváranie trubíc a tepelná tesnosť
      description: Špecializovaný zváračský workshop s tepelne uzatváracími strojmi a RF dielektrickými lisami. Tepelné uzatvárače spájajú a zlepujú PVC trubičkové komory, zatiaľ čo RF zvary vytvárajú vysoko pevné vzduchotesné švy, ktoré presahujú požiadavky ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: RIB Výroba trupu — Sklolaminát
      description: RIB lode sú vyrábané ručným nanášaním sklolaminátu s polyesterovými a vinylesterovými živicovými systémami. Každá vrstva je ručne valcovaná a vákuovo baliaca pre konzistentnú kvalitu. Kabína na striekanie gelcoatu poskytuje vysokolesklý, UV-odolný morský povrch.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: SUP Tlač a dekorácia
      description: SUP dosky sú zdobené digitálnou tlačou pre plnofarebné grafiky a sitotlačou pre logá a opakujúce sa vzory. Digitálne tlačiarne vytvárajú fotografickú kvalitu palubných dizajnov, zatiaľ čo sitotlač poskytuje odolné a výrazné značkové označenia.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Konečná montáž a strojovňa
      description: Montážna linka, kde sa sklolaminátové trupy a PVC trubice spájajú, montujú sa motory, pripájajú riadenie a ovládanie a zapájajú elektrické systémy. Každá loď prechádza 100-bodovým montážnym kontrolným zoznamom schváleným vedúcim tímu.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Kontrola kvality a inšpekcia
      description: Každá dokončená loď prechádza povinným testom zadržania vzduchu, overovaním odlupovania švov a kompletnou kontrolou systémov pred expedíciou. Naša kvalitatívna laboratórium funguje nezávisle od výroby a podáva správy priamo manažmentu.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
