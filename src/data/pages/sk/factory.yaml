qc_section:
  tagline: Kontrola kvality
  title: Proces testovania a zabezpečovania kvality
  subtitle: Každá loď prechádza povinným testovaním pred odoslaním. Naše laboratórium kvality funguje nezávisle od výroby a podáva správy priamo manažmentu.
  steps:
    - step: '1'
      title: Inšpekcia surovín
      desc: PVC, Hypalon, a drop-stitch textílie prechádzajú ťahovým testovaním (ASTM D751), šírením trhlín a UV overovaním odolnosti pred vstupom akejkoľvek dávky do výroby.
    - step: '2'
      title: 48-hodinový test zadržiavania vzduchu
      desc: Každá komora trubice sa nafúkne na 125 % menovitého tlaku a drží sa 48 hodín. Pokles tlaku presahujúci 5 % spustí automatické odmietnutie a opätovnú kontrolu spoja.
    - step: '3'
      title: Testovanie zaťaženia a vyváženia
      desc: Hotové lode sú naložené na maximálnu nominálnu kapacitu a testované na stabilitu, voľný bok a ovládateľnosť. Každé plavidlo je pred záverečnou kontrolou testované vo vode.
oem_section:
  tagline: OEM Projekty
  title: OEM Prípadové štúdie značiek a partnerstiev
  subtitle: Od konceptu po kontajner — ako pomáhame globálnym značkám spustiť a rozšíriť ich rady nafukovacích vodných skútrov.
  cases:
    - challenge: Európsky outdoorový predajca potreboval kolekciu pod privátnou značkou SUP s jedinečnou grafikou na terase, ekologickým a PVCobalom pripraveným na predaj — všetko doručené do 60 dní.
      solution: Vyvinuli sme vlastné digitálne tlačové súbory, získali som REACHpožiadavky v súlade s požiadavkami PVCa skomprimovali vzorkovanie z 3 kôl na 1 tým, že sme spoločne umiestnili dizajnérsky tím do našej továrne v Qingdao.
      result: 55 dní od podpísaného PO do FOB. 2 400 kusov v 4 SKU. Opakovaná objednávka pred príchodom prvého kontajnera.
    - challenge: Americký startup v oblasti vodných športov potreboval drop-stitch výkonný kajak s vlastným tvarom trupu, spoločným balením a BSCI certifikáciou na maloobchodné umiestnenie.
      solution: Upravil drop-stitch existujúcu formu kajaku s upraveným profilom rockera, vytvoril spoločné balenie a poskytol BSCI kompletnú auditnú dokumentáciu.
      result: Úspešne zaradené do 3 hlavných amerických outdoorových reťazcov. 5 000+ kusov v prvom roku s 98% mierou predaja.
    - challenge: Austrálsky distribútor požadoval CERIB -certifikovaný sporák s vlastnými farbami trubiek, Hypalon možnosťou vylepšenia a súladom s austrálskou normou AS 1799.
      solution: Vyrobili predprodukčné vzorky so 4 farebnými variantmi trubiek, získanými CSM Hypalon od japonského dodávateľa, a koordinovali testovanie súladu s AS 1799 treťou stranou.
      result: RIB Na trhu AU/NZ bola uvedená 3-modelová rada. Nasledovalo víťazstvo vládnej súťaže na 12 hliadokRIBs.
faq_section:
  tagline: FAQ
  title: '& B2B OEM Často kladené otázky'
  questions:
    - q: Aká je minimálna objednávka (MOQ) na OEM nafukovacie SUP dosky?
      a: MOQ Štandardné modely začínajú na 5–10 kusoch OEM . Vlastné formy a projekty pod privátnou značkou vyžadujú minimálne 200 kusov v závislosti od zložitosti. Skúšobné objednávky a vzorkové série sú dostupné pre uvedenie nových značiek.
    - q: Má Paddle Board Overstock BSCI certifikát?
      a: Áno. Naša továreň udržiava BSCI platnú certifikáciu sociálnej súladu (auditná správa je dostupná na požiadanie). Máme tiež ISO 9001:2015 pre riadenie kvality a 64 našich modelov produktov má CE certifikáciu (TÜVRheinland).REACH a RoHS dokumentáciu o súlade s každou OEM zásielkou poskytujú.
    - q: Aká je typická dodacia lehota OEM na objednávku?
      a: Štandardná dodacia lehota je 30–45 dní od potvrdenej objednávky a zálohy. Vývoj vlastnej formy pridáva 15–20 dní na nástroje. Ponúkame expresnú výrobu pre urgentné objednávky a sezónne návaly počas pred-letného obdobia (január–marec).
    - q: Môžete prepraviť FOB Qingdao alebo CIF do nášho prístavu?
      a: Áno. Zasielame do FOB Qingdao, CIF hlavných svetových prístavov a DDP pre kvalifikovaných partnerov. Náš logistický tím riadi rezerváciu kontajnerov, exportnú dokumentáciu a colné odbavenie. Zasielame do 50+ krajín v rámci trhov EÚ, USA, AU a Ázie.
b2b_moq: 'Štandard MOQ: 5–10 jednotiek na model (SUP/kajak/drop-stitch). RIB MOQ: 2–5 jednotiek. Skúšobné objednávky sú vítané pre nové partnerstvá.'
production_flow:
  tagline: Výrobný tok
  title: Od materiálu po hotovú loď
  subtitle: Každá loď prechádza 6 výrobnými etapami s kontrolnými bodmi kvality v každom kroku. Žiadne skratky, žiadne vynechané kontroly.
  stages:
    - stage: '01'
      title: Prijímanie materiálu a vstupná kontrola kvality
      description: Všetky prichádzajúce materiály sú zaznamenané podľa čísla šarže/lotu v našom systéme ERP. Role látok PVC, jadra drop-stitch, ventily, lepidlá a hardvér sú umiestnené do karantény až do schválenia QC.
      qc_check: Pevnosť v ťahu (ASTM D751), odolnosť proti roztrhnutiu (ISO 4674), hrúbka meradla, viskozita lepidla, vizuálne skenovanie defektov
      qc_threshold: 100 % testovaných batérií. Zamietnuť, ak ťažnosť < 90 % špecifikácie, roztrhnutie < minimálna špecifikácia alebo akýkoľvek vizuálny defekt
      responsibility: Prichádzajúci tím kontroly kvality (3 inšpektori)
    - stage: '02'
      title: CNC Rezanie a príprava materiálu
      description: Počítačom optimalizované rozloženie uklada všetky panely na PVC materiál tak, aby sa minimalizoval odpad. Automatické rezačky CNC udržiavajú polohovú presnosť 0,1 mm.
      qc_check: Kontrola rozmerov voči CAD DXF súborom, kontrola kvality hrán, overenie počtu panelov
      qc_threshold: Každý 20. panel je meraný. Tolerancia ±0,5 mm. Zlikvidujte šaržu, ak je viac ako 2 % mimo tolerancie
      responsibility: Vedúci rezačky dielne
    - stage: '03'
      title: Zváranie a Drop-Stitch lepenie
      description: Drop-stitch jadrá sú spojené s vonkajšími PVC laminátmi pomocou tepelnej laminácie. Komory trubice sú RF zvárané alebo horúcim vzduchom zvárané. Pásy koľajníc sú trojvrstvovo fúzne spojené.
      qc_check: Peel test každých 50 jednotiek (ASTM D751), meranie šírky zvárania, kontrola záznamu teploty horúceho vzduchu, vizuálna kontrola švíka pod spätným svetlom
      qc_threshold: Minimálna pevnosť v odlupovaní 8 N/cm. Tolerancia šírky zvárania ±1 mm. Akékoľvek viditeľné drážkovanie = zamietnuť
      responsibility: Kontrola kvality zvárania (2 inšpektori na zmenu)
    - stage: '04'
      title: Montáž a zdvíhanie
      description: 'Lode sa presúvajú na finálnu montáž, kde sú všetky komponenty spojené: trup, rúry, nainštalované ventily, D-krúžky, rukoväte, šachty pre plutvy a upevnenie prepravnej tašky. Každá jednotka prechádza kontrolným zoznamom montáže s 100 bodmi.'
      qc_check: Schválenie kontrolného zoznamu s 100 bodmi na jednotku, test funkcie ventilu (10 cyklov otvorenia/zatvorenia), overenie momentu skrutiek hardvéru, vizuálna kontrola
      qc_threshold: 'Politika nulových chýb pri bezpečnostne kritických položkách (ventily, D-krúžky, rukoväte). Menšie kozmetické: AQL 2,5 (ISO 2859)'
      responsibility: Vedúci montážneho tímu + kontrola kvality linky
    - stage: '05'
      title: Tlakové testovanie a kontrola kvality
      description: Každá komora je nafúknutá na 1,25× nominálny tlak (typicky 20–25 PSI) a udržiavaná po dobu 24–48 hodín. Senzory tlaku zaznamenávajú nepretržite. Komory s poklesom tlaku nad 5 % sú odmietnuté a odoslané na prekontrolovanie švov.
      qc_check: 24-hodinový záznam držania tlaku, kalibrácia snímača overovaná denne, tlakový odpočet kompenzovaný podľa teploty, opätovné testovanie švu po oprave
      qc_threshold: Maximálny pokles tlaku 5 % počas 24 hodín pri stabilnej teplote. Akákoľvek komora prekračuje túto hodnotu = 100 % opakované testovanie celej výrobnej série
      responsibility: Laboratórium kvality (nezávislé od výroby, reportuje manažmentu)
    - stage: '06'
      title: Záverečná kontrola a balenie
      description: Záverečná vizuálna a funkčná kontrola. Povrchové chyby, konzistencia farby, kontrola etikiet/BIN, integrita balenia a kompletnosť príslušenstva. Jednotky sú vákuovo zabalené, zabalené do krabíc a paletizované na nakládku do kontajnera.
      qc_check: Úplná vizuálna kontrola, kontrolný zoznam príslušenstva podľa SKU, test pádu balenia (1 m, náhodný výber), kontrola skenovania etikiet/bar kódu
      qc_threshold: AQL 2,5 pre hlavné chyby, AQL 4,0 pre menšie chyby. Nulová tolerancia na bezpečnostné chyby. 100 % jednotiek je vizuálne kontrolovaných
      responsibility: Záverečný tím kontroly kvality (4 inšpektori) + Vedúci balenia
