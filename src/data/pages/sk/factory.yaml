hero:
  tagline: Fabrika
  title: Fabrika a výroba
  subtitle: 12 000 m² integrovaného výrobného priestoru — od surovín po hotovú loď
intro:
  - Ako továreň značky **Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock kontroluje každý stupeň výroby — od príchodu surových PVC a sklolaminátových materiálov až po konečnú preddodaciu kontrolu hotovej lode. Naše výrobné zariadenie v Qingdao Economic Development Zone má rozlohu 12 000 štvorcových metrov a obsahuje samostatné dielne pre PVC rezanie, tepelnú zmršťovaciu úpravu trubíc, výrobu sklolaminátových trupi RIB, SUP digitálnu tlač, finálnu montáž a kontrolu kvality.
  - Integráciou dizajnu, inžinierstva, prototypovania, výroby a testovania pod jednou strechou odstraňujeme neefektívnosť zmluvnej výroby a udržiavame priamu kontrolu nad kvalitou výroby, výberom materiálov a termínmi dodania. Každá loď, ktorá opustí našu dielňu, je postavená našimi ľuďmi, na našom vybavení, podľa našich štandardov.
