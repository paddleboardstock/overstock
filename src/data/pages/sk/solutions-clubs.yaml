testimonial:
  content: Začali sme s Club Starter Package pre našu surfovú školu v Portugalsku. 20 dosiek, pádla, vesty — všetko dorazilo do 3 týždňov. Po dvoch sezónach sme prešli na Pro Package. Prispôsobené označenie s našim logom bolo pre náš profesionálny imidž prelomové.
  name: Ricardo Santos
  title: Majiteľ, Algarve Surf Academy — Lagos, Portugalsko
content_segments:
  tagline: Profily klubov
  title: Riešenia pre kluby vodných športov<br />Podľa typu klubu
  subtitle: Od univerzitných paddle klubov až po exkluzívne súkromné jachtové kluby — každý typ klubu má jedinečné potreby vybavenia, vzory používania a štruktúru rozpočtu. Každý balík prispôsobujeme podľa modelu klubu.
  items:
    - title: Univerzitné a vysokoškolské paddle kluby
      subtitle: Vysoko používané študentské flotily
      description: Študentské alebo inštitúciami podporované paddle kluby prevádzkujúce SUP a kajakovacie programy pre univerzitné rekreačné oddelenia. Vybavenie čelí častému a rýchlemu používaniu medzi rôznymi úrovňami zručností každý semester. Trvanlivosť a ľahká opraviteľnosť sú kľúčové, spolu s cenovo dostupnými možnosťami pre študentské organizácie.
      features:
        - Extra odolná PVC konštrukcia hodnotená pre cykly študentského používania
        - Farby dosiek podľa úrovne zručností pre jednoduchú správu flotily
        - Opravný set + a video podpora sú zahrnuté pri každej objednávke
        - Zľavnené ceny pre študentské organizácie a platobné podmienky podľa semestra
    - title: Komunitné kluby pre pádlovanie a spoločenské kluby
      subtitle: Rekreačné kluby založené na členstve
      description: Kluby založené na komunite ponúkajúce členom zážitky z SUP, kajakovania a spoločenského pádlovania. Potreby vybavenia musia vyvážiť výkon a pohodlie pre široký vekový rozsah, s brandingom, ktorý podporuje identitu klubu a hrdosť členov. Efektívne uskladnenie je kľúčové pre kluby, ktoré fungujú s obmedzeným prístupom k vodnej ploche.
      features:
        - 'Mix floty: univerzálne SUPs, touringové dosky a rekreačné kajaky'
        - 'Plný branding klubu: vlastné farby, tlač loga, značkové PFD'
        - Kompaktné riešenia skladovania pre nafukovacie vybavenie
        - 'Štartovací balíček pre rast členstva: referral karty, značkové fotografie'
    - title: Školy surfovania a akademie surfového kajakovania
      subtitle: Výkonnosť pri pobreží a koučing
      description: Školy zamerané na surfovanie učia SUP surfovanie, surfové kajakovanie a zručnosti jazdy na vlnách. Vybavenie musí fungovať v podmienkach surfovania — ovládateľné, citlivé a dostatočne odolné, aby zvládlo opakované pády, abráziu pieskom a pôsobenie slanej vody bez rýchlej degradácie.
      features:
        - Kratšie, širšie tvary SUP optimalizované pre manévrovateľnosť na vlnách
        - Reinforced konštrukcia okrajov pre odolnosť pri nárazoch vo vlnách
        - 'Bezpečnostné vybavenie špecifické pre surfovanie: skrútené vodidlá, možnosti mäkkých plutiev'
        - Program výmeny flotily s sezónnymi zľavami pri odkúpení
    - title: Korporátne a súkromné jachtové kluby
      subtitle: Prémiové zážitky pre členov
      description: Exkluzívne súkromné kluby ponúkajúce vodné športy ako prémiové vybavenie pre členov. Štandardy vybavenia sú vysoké — estetika, súlad s brandom a prezentácia pripravená pre hostí sú rovnako dôležité ako výkon. Očakávania služby zahŕňajú dodanie s bielymi rukavicami, vlastné riešenia skladovania a podporu na úrovni concierge.
      features:
        - Prémiové dosky s drevenou textúrou EVA a kovovými detailmi
        - Vlastné farebné ladenie podľa smerníc značky klubu
        - 'Kuriérske dodanie: prednafúkané, pripravené a označené pre každú sezónu'
        - Dedikovaná správa účtu s prioritnou odozvou SLA
