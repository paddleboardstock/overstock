hero:
  tagline: O nás
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer továreň a dielňa
  title: |
    Lodené inžinierstvo<br />
    postavil<span class="text-accent dark:text-white">Aquafarer</span>spôsob
  subtitle: 'Začali sme v pobrežnej dielni s jednou loďou a tvrdohlavou vierou: morské produkty by mali byť navrhnuté tak, ako keby na nich záležalo, pretože naozaj záleží. Dnes dodávame do viac ako 50 krajín, ale každé trupy stále prechádzajú tými istými rukami, ktoré založili spoločnosť.'
stats:
