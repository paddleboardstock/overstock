  stats:
    - title: Doručené trupy
      amount: 2,400+
    - title: Krajiny expedovali
      amount: 50+
    - title: Roky kombinovaných skúseností
      amount: '60'
    - title: Priemerná doba odozvy záruky (hodiny)
