features3_what_we_build:
  title: Čo budujeme
  subtitle: Zameraná produktová rada, ktorú dôkladne poznáme — žiadne nedokončené experimenty, žiadne jednoduché premenovanie produktov.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB lode
      description: Hliníkový trup RIBs od 3,3 m do 7,5 m. Navrhnuté na hliadkovanie, potápanie, rybolov a rodinné použitie.
      icon: tabler:ship
    - title: Nafukovacie člny
      description: PVC a Hypalon nafukovacie člny od 2,4 m do 4,2 m. Ľahké, odolné a ľahko skladovateľné.
      icon: tabler:speedboat
    - title: Motorové člny pre superjachty
      description: Kompaktný, špičkovo vybavený RIBs na mieru, aby zodpovedal vzhľadu vášho materského plavidla.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Doplnky
      description: Veslá, pumpy, kryty, suché vaky, palivové nádrže a elektronika. Všetko prispôsobené našim člnom.
      icon: tabler:package
    - title: Oprava a renovácia
      description: Vnútorná výmena trubiek, modernizácia elektroniky a vylepšenia motora.
      icon: tabler:tool
    - title: Vlastné zostavy
      description: Dizajn na základe projektov pre komerčných, vedeckých a vojenských zákazníkov.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Diskusia o dizajne a inžinierstve lodí
steps2_values:
  title: Naše hodnoty
  subtitle: Tri princípy, ktoré formovali každý produkt od prvého dňa.
  items:
    - title: Stavaj tak, akoby to nieslo tvoju rodinu
      description: Každý trup, zváranie a spojovací materiál sa spracúva tak, akoby ho používali naše vlastné rodiny.
      icon: tabler:heart
    - title: Inžinier pred tým, než predávame
      description: Ak je špecifikácia nesprávna, zmeníme špecifikáciu — nikdy zákazníka.
      icon: tabler:settings
    - title: Podpora, ktorá pretrváva za hranicou záruky
      description: Dvadsaťročné trupy nás stále kontaktujú kvôli náhradným dielom a my stále odpovedáme.
      icon: tabler:headset
steps2_milestones:
  title: Medzníky
  subtitle: Krátka verzia príbehu Aquafarer.
  isReversed: true
  items:
    - title: Založené v pobrežnej dielni
      description: Založené dvoma námornými architektmi s CNC mlýnom a tvrdohlavou myšlienkou.
      icon: tabler:building-factory
    - title: Prvých 1 000 dodaných trupov
      description: Dosiahnuté v našom siedmom roku, väčšinou prostredníctvom ústneho odporúčania a opakovaných zákazníkov.
      icon: tabler:circle-check
    - title: Medzinárodný exportný program
      description: Teraz zasielané do 50+ krajín s lokalizovanými partnermi pre podporu na piatich kontinentoch.
      icon: tabler:world
    - title: Nová globálna prevádzková štruktúra
      description: V septembri 2026 sa prevádzka značky presunula z Qingdao Vatrad Group do Aquafarer LLC (Nové Mexiko, USA); výrobné centrum v Qingdao pokračuje vo vývoji, výrobe a exporte priamo z fabriky.
      icon: tabler:building-skyscraper
features2_locations:
  title: Naše lokality
  tagline: Nájdite nás
  columns: 3
  items:
    - title: Sídlo a dielňa
      description: Pobrežný priemyselný park, budova 4 — otvorené pondelok–piatok pre návštevy po dohode.
    - title: Servisné centrum EÚ
      description: Stredomorský prístav — úpravy, opravy a záručná podpora pre európskych zákazníkov.
    - title: Sieť partnerov v ÁPAC
      description: Autorizovaní servisní partneri v Austrálii, Japonsku, Singapure a Hongkongu.
brand_hub_tagline: Značka
brand_hub_title: Objavte našu značku
brand_hub_subtitle: Ponorte sa hlbšie do našich skúseností s námorným inžinierstvom, globálnej prítomnosti a princípov, ktoré nás vedú.
brand_hub_cards:
  - title: Námorné odborné znalosti
    desc: Desaťročia materiálových vied, presnej výroby a testovania v reálnom svete — od PVC/Hypalon výroby po dizajn trupu typu deep-V a technológiu drop-stitch.
    link: /brand-marine-expertise
    link_label: Zistite viac →
  - title: Globálna prítomnosť
    desc: Doručovanie do 50+ krajín z našeho zariadenia v Qingdao s autorizovanými servisnými partnermi po celej Európe, Ázii a Tichomorí a Amerike.
    link: /brand-global-presence
    link_label: Zistite viac →
  - title: Prečo Aquafarer
    desc: Vertikálna integrácia, dvojitá certifikácia (ISO 9001 + BSCI), CE súlad a nízke MOQs — vytvorené pre značky, distribútorov a vládne agentúry.
    link: /brand-why-aquafarer
    link_label: Zistite viac →
production_section:
  tagline: Excelentnosť vo výrobe
  title: Zabezpečenie vynikajúceho remeselného spracovania
  description: Výrobná linka Aquafarer je venovaná výrobe vysoko kvalitných, odolných a výkonných nafukovacích člnov.
  cards:
    - title: Skúsený technický tím
      items:
        - Profesionálne znalosti PVC, Hypalon a námorných materiálov
        - Presná remeselná práca pri rezaní, lepení a inštalácii príslušenstva
        - Neustále školenia na zvládnutie najnovších výrobných technológií
    - title: Pokročilé výrobné zariadenia
      items:
        - CNC rezacie zariadenie pre presné rezanie tkanín s minimálnou chybovosťou
        - Vysokopresné tepelné/studené lepenie pre vzduchotesné, odolné švy
        - Profesionálne zariadenie na testovanie vzduchotesnosti a pevnosti
    - title: Zrelý manažérsky systém
      items:
        - Štandardizované výrobné procesy s jasnými štandardmi kvality
        - Filozofia štíhlej výroby znižujúca odpad a zvyšujúca efektivitu
        - Efektívne riadenie dodávateľského reťazca so spoľahlivými partnerskými dodávateľmi
    - title: Prísna kontrola kvality
      items:
        - certifikovaný systém riadenia kvality
        - 'Viacstupňová kontrola: surový materiál, priebežná kontrola, finálna kontrola pred expedíciou'
        - Prísne testovanie vzduchotesnosti a odolnosti pred expedíciou
global_ops_section:
  tagline: Globálna operačná architektúra
  title_html: Jedna značka,<span class="text-white/90">dve centrá</span>
  description_html: Od septembra 2026 Aquafarer prevádzkuje<strong class="text-white">Aquafarer LLC</strong>(New Mexico, USA) — globálna entita pre distribúciu, komerčný B2B predaj, zmluvy, fakturáciu a popredajný servis. Výskum a vývoj, výroba a kontrola kvality zostávajú v<strong class="text-white">Aquafarer výrobnom centre Qingdao</strong>, ktoré expeduje každú objednávku priamo z továrne, FOB Qingdao. Táto zmena ovplyvnila, kto podpisuje vašu zmluvu — nie, kto váš čln vyrobí.
  stats:
    - value: 2,400+
      label: Trupy dodávané po celom svete
    - value: 50+
      label: Krajiny vyvážili
    - value: 10+
      label: Roky výroby
