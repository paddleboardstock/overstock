faq:
  title: Často kladené otázky o balíkoch
  questions:
    - q: Aké je minimálne množstvo objednávky pre balíky?
      a: Klubový štartovací balík má minimum 10 jednotiek. Balíky Resort a Brand sú prispôsobené vašim potrebám s flexibilným MOQs.
    - q: Ako dlho trvá dodanie?
      a: Štandardná výroba trvá 30–45 dní od potvrdenia objednávky. Urýchlená výroba je k dispozícii za príplatok.
    - q: Môžem prispôsobiť farby a branding vybavenia?
      a: Áno. Všetky balíky zahŕňajú úplnú prispôsobiteľnosť — farby dosiek, tlač loga a dizajn balenia.
    - q: Poskytujete popredajnú podporu?
      a: Áno. Každý balík zahŕňa prístup k našim online návodom na údržbu, video tutoriálom a systému objednávania náhradných dielov.
