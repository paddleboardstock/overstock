tests:
  - title: Tlakové testovanie
    standard: ISO 6185-1 | Interná špecifikácia AF-PT-001
    description: Nafukovacie komory sa natlakujú na 1,25-násobok odporúčaného prevádzkového limitu a držia sa 30 minút. Na overenie vzduchotesnosti a štrukturálnej integrity materiálov a švov sa meria pokles tlaku.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Nárazové testovanie
    standard: Interná špecifikácia AF-IT-002
    description: Produkty sú vystavené kontrolovaným nárazom štandardizovaných závaží na pád a kyvadlového zariadenia. To hodnotí odolnosť proti prepichnutiu, šírenie trhlín a štrukturálnu odolnosť voči kolíziám s prekážkami, dokami a troskami.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Testovanie odporu
    standard: ASTM G154 |ISO 4892-3
    description: Vzorky materiálov sú vystavené lampám UVA-340 v zrýchlených komorách na zvetrávanie počas 1 000+ hodín. Meráme zmenu farby (Delta E), zadržiavanie lesku a stratu pevnosti v ťahu, aby sme overili UV balenia stabilizátorov.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Testovanie odolnosti voči oderu
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Vzorky materiálu sú vystavené abrazívnym kotúčom CS-10 pri zaťažení 500g/1 000g počas 1 000 cyklov. Strata hmoty a hodnotenie vizuálneho opotrebenia určujú odolnosť povlaku proti piesku, štrku a opakovanému vypúšťaniu.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Testovanie výkonu pri nízkych teplotách
    standard: Interná špecifikácia AF-LT-003 | MIL-STD-810G
    description: Zostavené produkty a materiály sa kondicionujú na -20 °C, -10 °C a 0 °C po dobu 24 hodín, potom sa ohybne testujú. Overujeme to PVC a Hypalon zostávame flexibilní bez praskania alebo delaminácie.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Testovanie vztlaku a nosnosti
    standard: ISO 6185-1 |ISO 12402
    description: Produkty sa postupne nakladajú na 1,25-násobok hodnotnej kapacity v kontrolovanom bazéne. Zaznamenávajú sa voľný bok, stabilita a výkon samoodvodňovania. Hodnotená kapacita každého modelu je matematicky a empiricky overená.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Testovanie manévrovateľnosti
    standard: Interná špecifikácia AF-MT-004
    description: Skúšky na vode merajú polomer otáčania, zrýchlenie, čas plánovania a odozvu pádla/motora v rôznych podmienkach zaťaženia. Reálne vlastnosti ovládania sa overujú voči konštrukčným cieľom.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Testovanie vodotesnosti
    standard: ISO 6185-1 §7.3 | Interná špecifikácia AF-WT-005
    description: Každý zostavený produkt je testovaný sprejom na 0,5 baru na všetkých švoch, ventiloch a spojkách. 5-minútový tlakový ponorný test overuje vodotesnosť komory a ventilu. Pred odoslaním je štandard nulového úniku.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
testing_section:
  tagline: Testovacie postupy
  title: Prísne testovanie v každej fáze
commitment:
  title: Náš záväzok
  body: Vďaka týmto prísnym testovacím postupom poskytuje {SITE} zákazníkom istotu, že naše nafukovacie a SUPs lode sú nielen výkonné, ale aj vyrobené tak, aby vydržali — čím zabezpečuje nespočetné množstvo príjemných a bezpečných dobrodružstiev na vode. Naše laboratórium kvality funguje nezávisle od výroby a priamo podáva správy manažmentu.
  cta: Dokumentácia k testovaniu požiadaviek
  cta_link: /contact
