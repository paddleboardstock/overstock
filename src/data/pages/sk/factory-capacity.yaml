hero:
  tagline: Výrobná kapacita
  title: Výrobná kapacita a ročný objem produkcie
  subtitle: 12 000 m² zariadenie vyrábajúce 15 000 lodí ročne s možnosťou zväčšenia kapacity
intro: Paddle Board Overstock prevádzkuje jedno z najväčších špecializovaných výrobných zariadení na nafukovacie lode v Qingdao, Čína. Naša továreň o rozlohe 12 000 m² je rozdelená do šiestich špecializovaných dielní, ktoré pracujú paralelne, čo nám umožňuje vyrábať ročne 15 000 lodí v kategóriách SUP, kajaky, dinghy, RIB a bezpečnostné vybavenie.
highlights:
  - value: 12,000 m²
    label: Celková výrobné plocha
    detail: V šiestich špecializovaných dielňach
  - value: 15,000
    label: Výroba lodí ročne
    detail: SUPs, kajaky, RIBs, dinghy, bezpečnostná výbava
  - value: 200-300
    label: Kvalifikovaná pracovná sila
    detail: 25+ inžinierov, 2 smeny/deň
  - value: 50+
    label: Exportné krajiny
    detail: EÚ, USA, AU, Blízky východ, Ázia
  - value: 30–45
    label: Štandardná doba dodania (dni)
    detail: Od potvrdenia objednávky po FOB
  - value: 10+
    label: Roky skúseností s exportom
    detail: Od roku 2012
workshops:
  - title: SUP Výroba dosiek
    description: '4 paralelné montážne linky pre nafukovacie SUP dosky. Každá linka dokáže vyrobiť 50–80 dosiek za smenu. Stanice digitálnej a sieťotlačovej tlače pracujú súbežne. Ročná kapacita SUP: 8 000+ dosiek.'
    output: 8 000+ SUPs/rok
  - title: RIB Výroba lodí
    description: 'Špecializovaná dielňa pre sklolaminátové trupy s 6 formovacími stanicami pre RIB trupy do 7,6 m. Oblasť zvárania trubiek a montáže zvláda 3–5 RIBs súčasne. Ročná kapacita RIB: 2 000+ lodí.'
    output: 2 000+ RIBs/rok
  - title: Nafukovacie lode a dinghy
    description: 'Viacfukčné výrobné linky pre nafukovacie lode, kajaky a dinghy. Stanice na horúce zváranie, dielektrické RF lisy a montážne pracoviská sa prispôsobujú podľa objednávky. Ročná kapacita: 5 000+ jednotiek.'
    output: 5 000+ jednotiek/rok
  - title: Bezpečnostné vybavenie
    description: 'Samostatná čistá výrobná oblasť pre záchranné vesty a bezpečnostné vybavenie. Samostatné šijacie, napĺňacie a testovacie stanice. Ročná kapacita záchranných viest: 50 000+ jednotiek.'
    output: 50 000+ záchranných viest/rok
oem_capacity:
  moq: 'SUP: 5–10 jednotiek | RIB: 2–5 jednotiek | Kajak/Dinghy: 10–20 jednotiek | Vlastná forma: 200+ jednotiek'
  lead_time: Štandardne 30–45 dní. Vzorky 15–20 dní. Možnosť express výroby.
  payment: T/T 30% záloha + 70% pred odoslaním. Akceptované L/C, Western Union.
