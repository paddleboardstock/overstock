hero:
  tagline: Životný štýl
  title: Aquafarer<br />Životný štýl
  subtitle: Vyrobené pre tých, ktorí žijú na vode — od víkendových prieskumníkov po komerčných prevádzkovateľov, ktorí každodenne závisia od svojho vybavenia.
values:
  - icon: 🌊
    title: Narodené na vode
    desc: Každý dizajn začína porozumením toho, ako sa voda správa. Navrhujeme od okraja podmienok dovnútra — pretože oceán je naším učiteľom, nie naším pracoviskom.
  - icon: 🔧
    title: Vyrobené, aby vydržalo
    desc: Najudržateľnejší produkt je ten, ktorý nemusí byť nahradený. Materiály triedy marine, drop-stitch jadrá hodnotené na 15 PSI a švy, ktoré pretrvajú sezónu.
  - icon: 🏆
    title: Prístupné dizajnom
    desc: Vodné športy by nemali byť luxusom. Profesionálny výkon za cenu, ktorá dáva zmysel pre rodiny, inštruktorov a malých prevádzkovateľov — nie len pre komerčné flotily.
  - icon: 🌍
    title: Globálna komunita
    desc: 'Od pobrežia Qingdao po jazerá v Európe, rieky v juhovýchodnej Ázii a zálivy v Amerike — naši zákazníci zdieľajú jedno: lásku k pobytu na vode.'
  - icon: ♻️
    title: Zodpovedná výroba
    desc: CNC-optimalizované skladačky znižujú odpad materiálu pod 5 %. Odolná konštrukcia skracuje cykly výmeny. Stavíme na dlhú životnosť, pretože to je najudržateľnejšia voľba.
  - icon: 🤝
    title: Podpora, ktorá vydrží
    desc: Dvadsaťročné trupy nás stále kontaktujú pre náhradné diely. Naša priemerná reakcia na záruku je 24 hodín. Nezmizneme po predaji — sme tu počas celej životnosti produktu.
