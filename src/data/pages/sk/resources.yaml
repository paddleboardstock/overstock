hero_text:
  tagline: Zdroje
  title: Stiahnutie centra a sprievodcov pre kupujúcich
  subtitle: Prístup k katalógom produktov, OEM sprievodcom, kontrolným zoznamom pre kupujúcich a technickej dokumentácii, ktorá vám pomôže pri informovanom rozhodovaní o nákupe.
features3_downloads:
  tagline: Stiahnutia
  title: Produktová dokumentácia<br />& Zdroje pre kupujúcich
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalóg morských produktov 2026
      description: Kompletný sortiment produktov vrátane RIB lodí, nafukovacích lodí, SUP dosiek, kajakov a príslušenstva. Špecifikácie, konfigurácie a možnosti. Formát PDF.
      icon: tabler:file-text
    - title: OEM Sprievodca výrobou
      description: 'Všetko, čo potrebujete vedieť o OEM/ODM partnerstvách: prehľad procesu, minimálne množstvá objednávok, možnosti prispôsobenia, kontrola kvality a doprava.'
      icon: tabler:building-factory
    - title: RIB Sprievodca kupujúcim lodí
      description: 'Ako si vybrať správnu RIB: materiály trupu, materiály trubíc, výber motora, úvahy o veľkosti a možnosti konfigurácie pre rôzne aplikácie.'
      icon: tabler:file-description
    - title: SUP Kontrolný zoznam dodávateľa
      description: 'Kľúčové úvahy pri výbere výrobcu SUP dosiek: ukazovatele kvality, požiadavky na certifikáciu, MOQ úvahy a na čo sa zamerať pri audite továrne.'
      icon: tabler:clipboard-check
    - title: Sprievodca materiálom nafukovacích lodí
      description: 'PVC vs Hypalon: porovnanie odolnosti, odolnosti voči UV, životnosti, možností opráv a nákladových úvah pre rôzne morské aplikácie.'
      icon: tabler:files
    - title: Šablóna stručného prehľadu pre zákazkovú výrobu
      description: Stiahnite si našu šablónu produktového prehľadu. Vyplňte svoje požiadavky a pošlite nám ju späť na cenovú ponuku a posúdenie uskutočniteľnosti v rovnakom týždni.
      icon: tabler:template
faqs:
  title: Často kladené otázky
  subtitle: Bežné otázky o našich produktoch, výrobnom procese a modeli partnerstva.
  columns: 2
  items:
    - title: Aké je minimálne množstvo objednávky?
      description: MOQ sa líši podľa kategórie produktu. RIB lode zvyčajne začínajú od 10 kusov na model. SUP dosky od 50 kusov. Kontaktujte náš predajný tím pre informácie o konkrétnom produkte MOQ.
      icon: tabler:help-circle
    - title: Môžem dostať vzorky pred zadaním objednávky?
      description: Áno. Aquafarer poskytuje výrobu vzoriek na hodnotenie pred sériovou výrobou. Náklady na vzorky sú dohodou a často sa pripíšu k prvej výrobnej objednávke.
      icon: tabler:package
    - title: Aké sú dostupné platobné podmienky?
      description: Bežné podmienky sú 30 % záloha pri objednávke, 70 % pred odoslaním. Pre kvalifikovaných zákazníkov sú k dispozícii podmienky LC. Kontaktujte náš finančný tím a dohodnite si podrobnosti.
      icon: tabler:currency-dollar
    - title: Ako dlho trvá výroba?
      description: 'Typické dodacie lehoty: RIB lode 30-45 dní, SUP dosky 20-30 dní, nafukovacie lode 25-35 dní. Zákazkový vývoj pridáva 15-30 dní na prototypovanie.'
      icon: tabler:calendar-clock
    - title: Aké certifikácie majú vaše produkty?
      description: Certifikácia CE pre trhy EÚ, výroba schválená americkou pobrežnou strážou, kvalitatívny systém ISO, súlad s BSCI a súlad s materiálmi REACH.
      icon: tabler:certificate
    - title: Ponúkate vlastné balenie a branding?
      description: Áno. Poskytujeme vlastné balenie s vaším logom, farbami a identitou značky. MOQ pre vlastné balenie závisí od kategórie produktu.
      icon: tabler:color-swatch
cta:
  title: Potrebujete pomoc pri hľadaní správneho zdroja?
  subtitle: Kontaktujte náš tím pre osobné poradenstvo pri výbere produktu, OEM partnerstvách alebo technických špecifikáciách.
  actions:
    - variant: primary
      text: Kontaktujte náš tím
      href: /contact
