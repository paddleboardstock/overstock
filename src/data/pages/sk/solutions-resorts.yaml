testimonial:
  content: Paddle Board Overstock navrhol a vybavil celý náš program plážových aktivít na troch rezortných nehnuteľnostiach. 80 SUPs, 40 kajakov, bezpečnostná infraštruktúra a školenie personálu — všetko dodané v jednej zásielke. Účasť našich hostí na vodných aktivitách sa v prvej sezóne zvýšila o 60 %.
  name: Sophie Laurent
  title: Riaditeľka zážitkov hostí, Azure Bay Resorts — Phuket, Thajsko
content_segments:
  tagline: Profil rezortov
  title: Riešenia pohostinnosti na pobreží<br />Podľa typu nehnuteľnosti
  subtitle: Každá rezortná nehnuteľnosť má jedinečný profil hostí, mix aktivít a prevádzkový rytmus — od butikových ekologických chatiek po rozľahlé luxusné rezorty pri pláži. Navrhujeme programy vodných športov, ktoré zodpovedajú triede nehnuteľnosti a očakávaniam hostí.
  items:
    - title: Luxusné rezorty pri pláži
      subtitle: VIP transfery, vodné aktivity, prémiový zážitok hostí
      description: Vysokokvalitné nehnuteľnosti pri pláži — Four Seasons, Aman a podobné luxusné skupiny — kde sú vodné športy hlavným benefitem pre hostí, ktorý ovplyvňuje skóre spokojnosti a doplnkové príjmy. Flotila musí vyzerať luxusne, ponúkať rozmanitosť pre rôzne vekové skupiny a úrovne schopností a bezproblémovo sa integrovať do existujúceho rezortného concierge a rezervačných systémov. Očakávania hostí ohľadom vzhľadu sú veľmi vysoké — stav a prezentácia vybavenia priamo ovplyvňuje 5-hviezdičkové recenzie.
      features:
        - 'Prémiovo označená flotila: SUPs, kajaky, pedálové člny a malé RIB člny'
        - 'Prezentácia pripravená pre hostí: farebné ladenie s rezortom, branding loga, vystavené vybavenie'
        - Malé luxusné RIB pre VIP transfery hostí s vlastným čalúnením a farebným prispôsobením
        - 'Integrovaná bezpečnostná infraštruktúra: bójkové línie, stanice plavčíkov, AED'
        - 'Správa príjmov: šablóny dynamického oceňovania, školenie predaja, balíkované ponuky'
    - title: Rezorty na súkromných ostrovoch
      subtitle: Preprava hostí za každého počasia — žiadne prestoje, absolútna spoľahlivosť
      description: Súkromné ostrovné rezorty pôsobia na odľahlých miestach, kde je loď jediným spojením s pevninou. Denné presuny hostí, zásobovacie plavby a núdzové lekárske evakuácie závisia od jednej lode — akékoľvek prestoje priamo ovplyvňujú zážitok hostí a prevádzku rezortu. Títo prevádzkovatelia potrebujú loď, ktorá spoľahlivo funguje za každého počasia, vyžaduje minimálnu údržbu a má záložné systémy pre kritickú spoľahlivosť. Loď musí tiež krásne prezentovať pri príchode hostí na ostrov.
      features:
        - Konfigurácia pre všetky poveternostné podmienky RIB s plným uzavretím a ťažkými trubicami
        - Dvojmotorové alebo záložné motory pre prevádzku bez prestojov
        - Hypalon Komerčná výstavba s životnosťou 5-8 rokov v diaľkovej službe
        - Jednoduchý údržbový dizajn s prístupnými komponentmi pre servis priamo na mieste
        - Vlastná značka rezortu a prémiové čalúnenie ladia s estetikou ostrova
    - title: Jazerné a ekologické rezorty
      subtitle: Príroda integrované zážitky pre hostí
      description: Nehnuteľnosti pri jazere, eko-lodge a prírodné útočiská ponúkajú tiché, nízko náročné vodné aktivity, ktoré dopĺňajú prírodné prostredie. Vybavenie by malo byť nemotorové, kde je to možné, ľahko skladovateľné v lodeniciach s obmedzeným priestorom a tiché, aby sa zachoval atmosférový zážitok pre všetkých hostí.
      features:
        - 'Nemotorová flotila: SUPs, kajaky, kanoe a šlapadlá'
        - Tiché elektrické čerpacie stanice na nafukovanie pre hostí na požiadanie
        - Ekologické materiály a obaly sú v súlade s udržateľným brandingom
        - Skladovacie regály a systémy organizácie lodných búd zahŕňali
    - title: Plážové kluby
      subtitle: Presuny hostí, zábava, malý luxus RIBs
      description: Plážové kluby prevádzkujú energické, vizuálne zamerané prostredie, kde je vybavenie súčasťou atmosféry. Potrebujú malý luxus RIBs na presun hostí z blízkych hotelov alebo prístavov a vodné hračky na zábavu hostí — ťahanie vodných skútrov, nafukovacie šmýkačky a paddleboardy. Flotila musí vyzerať štýlovo, byť ľahko ovládateľná a odolávať každodennému používaniu hosťami s rôznou úrovňou zručností. Skladovanie a rýchle nasadenie sú kľúčové počas špičky.
      features:
        - Kompaktný luxus RIB (3,3-4,3 m) pre presuny hostí a obsluhu
        - 'Vodné hračky: ťahateľné nafukovacie plošiny, SUP dosky, kajaky na zábavu hostí'
        - Vlastná vizuálna identita plážového klubu zodpovedajúca farbám a značkám
        - Systémy rýchleho spustenia a vyzdvihnutia pre operácie s vysokou rotáciou
        - Hypalon Odolná konštrukcia pre každodenné vystavenie slanej vode a UV
    - title: Súkromné členské kluby a jachtárske kluby
      subtitle: Prístavná doprava, členské tendery, exkluzívne vodné športy
      description: Súkromné kluby, kde vodné športy a lodná doprava sú pre členov výhodou, nie zdrojom príjmov. Zariadenia musia spĺňať vyššie estetické štandardy, byť dostupné na požiadanie členov a vyžadovať minimálny dohľad personálu. Jachtárske kluby v prístave špeciálne potrebujú tendrové člny na prepravu do prístavu — presun členov medzi mólom, kotviacim miestom a brehom. Skladovanie a údržba by mali byť pre členov neviditeľné.
      features:
        - RIB Luxusné tendrá na prístavnú dopravu a prepravu členov
        - 'Prémiové vybavenie: EVA paluby, vlastné farby členov, značkové čalúnenie'
        - Samoobslužný systém pokladne pre prístup členov bez personálu
        - Mimosezónne skladovanie a každoročný obnovovací program
    - title: Hotely zamerané na dobrodružstvo a aktivity
      subtitle: Sprievodcované prehliadky, SUP joga, potápačské výlety so šnorchlovaním, skupinové aktivity
      description: Nehnuteľnosti sa prezentujú ako dobrodružné destinácie — ponúkajú sprievodcované prehliadky, SUP jogu, západ slnka na pádlach, potápačské výlety so šnorchlovaním a skupinové aktivity. Flotila musí podporovať modely voľnej prenájmu aj sprievodcovaných programov, s vybavením, ktoré sa hladko prechodí medzi vlastným používaním hosťami a prehliadkami vedenými inštruktormi. Tieto nehnuteľnosti potrebujú odolné vybavenie pre časté vystriedanie hostí s jednoduchým čistením medzi skupinami.
      features:
        - Všestranná zmiešaná flotila podporujúca modely prenájmu + sprievodcov
        - Tandemové kajaky a extra stabilné SUP platformy pre skupinové aktivity
        - 'Vybavenie pre sprievodcov: inštruktorské dosky, suché boxy, vodotesná komunikácia'
        - 'Sezónna rotácia vybavenia: letná flotila → zimný skladovací program'
        - Odolná konštrukcia určená na denné použitie hosťami s minimálnou údržbou
