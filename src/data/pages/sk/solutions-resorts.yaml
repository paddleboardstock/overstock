      - title: Skladovanie a údržba
        description: Regálové systémy, stanice na nafúkanie a denné kontrolné zoznamy
      - title: Školenie personálu
        description: Odborná orientácia personálu na mieste o manipulácii s vybavením a bezpečnosti hostí
      - title: Podpora štartu
        description: Programová príručka s cenovými šablónami, formulármi výnimiek a harmonogramami aktivít
    cta_text: Navrhnite riešenie pre môj rezort
    cta_href: /contact
