        description: 50–100 + SUPs, kajakov, pedalín a tender RIBs s plnou možnosťou prispôsobenia
      - title: Pokročilá bezpečnosť
        description: Veže pre plavčíkov, rádiový systém, záchranné dosky, AED a plán akcií v núdzových situáciách
