testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Majiteľ, Algarve Surf Academy
    location: Lagos, Portugalsko
    content: Začali sme so Starter balíčkom klubu pre našu školu surfovania. 20 dosiek, pádla, vesty — všetko dorazilo do 3 týždňov. Po dvoch sezónach sme prešli na Pro balíček. Vlastná značka s naším logom bola pre našu profesionálnu image prelomová.
    rating: 5
    product: Balík klubových štartérov
    source: solutions/clubs
  - category: clubs
    name: Majiteľ klubu
    title: Klub vodných športov
    location: Phuket, Thajsko
    content: Starter balíček klubu bol dokonalým vstupom. Ako naše podnikanie rástlo, Paddle Board Overstock rástlo s nami — rovnaká kvalita, rovnaké ceny, žiadne prekvapenia. Rozšírili sme sa z 10 na 80 dosiek za 18 mesiacov.
    rating: 5
    product: Starter balíček klubu + Premium balíček
    source: success-stories
  - category: resorts
    name: Generálny riaditeľ rezortu
    title: 5-hviezdičkový plážový rezort
    location: Grécko
    content: Paddle Board Overstock nedodávali len dosky — pomohli nám vytvoriť kompletný zážitok pre hostí. Náš program vodných športov šiel od nuly k hlavnému bodu rezortu za jednu sezónu. 300+ týždenných rezervácií a 180 000 $ ročného príjmu.
    rating: 5
    product: Resort Premium balík
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Riaditeľ pre skúsenosti hostí, Azure Bay Resorts
    location: Phuket, Thajsko
    content: Paddle Board Overstock navrhol a vybavil celý náš program plážových aktivít naprieč tromi rezortmi. 80 SUPs, 40 kajakov, bezpečnostná infraštruktúra a školenie personálu — všetko doručené v jednej zásielke. Účasť hostí vzrástla o 60 % v prvej sezóne.
    rating: 5
    product: Resort Premium balík
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Zakladateľ, Shoreline Paddle Co.
    location: Kalifornia, USA
    content: Spustil som svoju značku SUP bez akýchkoľvek skúseností v odbore. Tím Paddle Board Overstock ma viedol od výberu produktu až po návrh vlastného loga a balenia. Môj prvý kontajner dorazil za 11 týždňov a za 3 mesiace som všetko predal na Amazone.
    rating: 5
    product: Spustenie značky Starter
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Zakladateľ
    title: Austrálska značka SUP
    location: Austrália
    content: Mal som nápad na značku, ale žiadne výrobné znalosti. Paddle Board Overstock ma doslova držal za ruku počas celého procesu — od výberu správneho dizajnu dosky až po rozbalenie prvej zásielky. 90 dní od sna po doručenie.
    rating: 5
    product: Balík pre spustenie značky
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Majiteľ, Lakeland SUP Prenájmy
    location: Ontario, Kanada
    content: Požičiaval som si 5 dosiek z miestneho obchodu a strácal som na tom 60 % svojho príjmu. Paddle Board Overstock mi pomohol vybudovať si vlastnú flotilu 15 SUPs. Kalkulačka ROI ukázala bod zvratu za 4 mesiace — trvalo to 3. Teraz rozširujem na 30 dosiek.
    rating: 5
    product: Štartovací balík pre flotilu
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Riaditeľ operácií, Adriatic Adventure Tours
    location: Dubrovník, Chorvátsko
    content: Vybavili sme celý náš prenajatý vozový park Paddle Board Overstock RIBs — 12 člnoch na troch miestach. Po dvoch sezónach žiadne poruchy. Certifikačná dokumentácia CE umožnila bezproblémové schválenie poistenia. Ich tím inžinierov dokonca prispôsobil farby trubíc.
    rating: 5
    product: Sada na rozšírenie flotily
    source: trust
  - category: rental
    name: Poručík veliteľ Andres Reyes
    title: Námorný nákupný dôstojník, Filipínska pobrežná stráž - pomocná jednotka
    location: Manila, Filipíny
    content: Prevádzkujeme 24 Paddle Board Overstock RIBs naprieč našou pobrežnou hliadkovou flotilou. Ich proces kontroly kvality je konzistentný v každej sérii — rovnaká kvalita švov, rovnaké umiestnenie ventilov, rovnaké hodnotenie tlaku zakaždým. Táto opakovateľnosť je dôležitá, keď životy závisia od vybavenia.
    rating: 5
    product: RIB Hliadková flotila
    source: trust
  - category: consumers
    name: Sarah K.
    title: Prvotný SUP majiteľ
    location: Jazero Tahoe, USA
    content: Stabilná aj pre úplného začiatočníka. Prvý deň som ju vzal na jazero a nikdy som nespadol. Kompletný balík s pumpou a pádlom znamenal, že som bol na vode 20 minút po otvorení krabice.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Majiteľ Explorer 11
    location: Vancouver, Kanada
    content: Ako prvý kupujúci som bol nervózny ohľadom kvality pri objednávaní zo zahraničia. Dokumentácia ISO a testovacie správy tretích strán, ktoré zdieľali skôr, než som sa pýtal, mi dali úplnú dôveru. Doska dorazila za 6 dní a predčila moje očakávania.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Rekreačný kajakár
    location: Florida, USA
    content: Pevná kvalita spracovania. Lepšie zvláda pobrežný štrk, než som očakával od nafukovacej dosky. Zbalil som ju do kufra auta na víkendový výlet — nafúkal som ju na rampách za menej ako 4 minúty.
    rating: 5
    product: Nafukovací kajak
