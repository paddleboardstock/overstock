content_capability:
  tagline: Inžinierska schopnosť
  title: Čo naše inžinierstvo<br />Tím dodáva
  subtitle: Aquafarer inžinierstvo pokrýva celý životný cyklus produktu — od prieskumu trhu a návrhu konceptu cez prototypovanie, testovanie až po hromadnú výrobu.
  items:
    - title: Priemyselný dizajn
      description: Náš tím priemyselného dizajnu pracuje na základe požiadaviek zákazníka, prieskumu trhu a analýzy konkurencie na vývoji konceptov produktov, ktoré vyvažujú estetiku, funkčnosť a možnost výroby. Vytvárame 2D náčrty, 3D vizualizácie a špecifikačné dokumenty na kontrolu klientom pred záväzným schválením náradia.
      features:
        - Rozvoj konceptu a štúdie uskutočniteľnosti
        - 2D návrhové výkresy a 3D vizualizácie
        - Výber a špecifikácia materiálu
        - Analýza návrhu pre výrobu (DFM)
        - Ergonomické a bezpečnostné hodnotenie
    - title: Konštrukčné inžinierstvo
      description: Naši konštrukční inžinieri sa špecializujú na architektúru nafukovacích lodí — návrh trupu, konfiguráciu komôr trubíc, drop-stitch základný inžiniering a rozloženie zaťaženia. Každý návrh je analyzovaný z hľadiska konštrukčnej integrity, optimalizácie hmotnosti a súladu s príslušnými normami (CE, ISO, AS).
      features:
        - Návrh trupu z laminátu s hlbokým V a vypočítanými uhlami sklopenia
        - Konfigurácia viacnásobnej komory trubice pre bezpečnosť a plávavosť
        - Drop-stitch jadrová špecifikácia a optimalizácia hustoty
        - Analýza konečných prvkov pre nosné súčiastky
        - Výpočty rozloženia hmotnosti a stability
    - title: 3D modelovanie a CAD
      description: Všetky návrhy produktov sa vyvíjajú v 3D CAD ešte pred začiatkom prototypových nástrojov. Naši inžinieri používajú SolidWorks a Rhino 3D na modelovanie produktov, čo klientom umožňuje skontrolovať každý detail — od profilu rúry až po rozloženie konzoly — pred zaviazaním sa k výrobe.
      features:
        - Úplné 3D CAD modelovanie v SolidWorks a Rhino 3D
        - Fotorealistické renderovanie pre prezentácie pre klientov
        - Technické výkresové balíky pre výrobu
        - Návrh foriem a nástrojov z 3D modelov
        - CNC Priamy prenos dát z CAD na presné rezanie
    - title: Prototypovanie a testovanie
      description: Pred hromadnou výrobou každý nový produkt prechádza fázou prototypu. Vytvárame funkčné prototypy na hodnotenie klientom a potom ich podrobujeme nášmu kompletnému testovaciemu protokolu — tlakové testovanie, testovanie stability, zaťaženie a vodné skúšky. Návrhové iterácie v štádiu prototypu sú rýchle a nákladovo efektívne.
      features:
        - Rýchle prototypové nástroje (15-20 dní na spracovanie)
        - Funkčný prototyp pre hodnotenie v reálnom svete
        - Kompletný testovací protokol pred ukončením výroby
        - Iteratívne zdokonaľovanie návrhu na základe výsledkov testov
        - Míľnik schválenia klientom pred výrobnými nástrojmi
    - title: Integrácia vlastného príslušenstva
      description: Mnohé OEM projekty vyžadujú integráciu príslušenstva dodávaného klientom alebo tretích strán — vlastných konzol, špecializovaných sedadiel, elektronických systémov, držiakov potápačského vybavenia alebo prvkov značky. Náš inžiniersky tím riadi návrh integrácie, konštrukturálnu adaptáciu a overovanie kvality všetkých doplnkov.
      features:
        - Dizajn konzoly a rozloženie prístrojovej dosky
        - Integrácia vlastného sedenia a čalúnenia
        - Návrh a zapojenie elektronických systémov
        - Systémy montáže potápačského a záchranného vybavenia
        - Špecifikácie značky a grafických aplikácií
content_process:
  tagline: Proces vývoja
  title: Od konceptu<br />Do produkcie
  subtitle: Náš proces vývoja produktu prebieha podľa štruktúrovaného 6-stupňového pracovného postupu navrhnutého tak, aby minimalizoval riziko, skrátil časové harmonogramy a zabezpečil pripravenosť výroby už od prvého dňa.
  stages:
    - stage: '01'
      title: Požiadavky a výskum
      duration: 1-2 týždne
      description: Spolupracujeme s klientom na definovaní špecifikácií produktu, požiadaviek cieľového trhu, požiadaviek na dodržiavanie regulácií a obchodných cieľov. Táto fáza vytvára dokument o produktových požiadavkách (PRD), ktorý usmerňuje všetku následnú prácu.
      deliverables: PRD, analýza trhu, konkurenčný benchmark, predbežný odhad nákladov
    - stage: '02'
      title: Konceptuálny dizajn
      duration: 2-3 týždne
      description: Tím priemyselného dizajnu vyvíja koncepty produktov na základe PRD. Predstavuje sa niekoľko dizajnových možností s 3D vizualizáciami, odporúčaniami materiálov a počiatočnými inžinierskymi hodnoteniami. Klient vyberá smer pre detailný vývoj.
      deliverables: 3D koncepčné vizualizácie, špecifikácie materiálov, odôvodnenie návrhu, predbežný zoznam materiálov (BOM)
    - stage: '03'
      title: Podrobná technická dokumentácia
      duration: 2-4 týždne
      description: Vybraný koncept je plne navrhnutý — 3D CAD modelovanie, štrukturálna analýza, konfigurácia trubiek, návrh trupu, integrácia doplnkov a výrobné dokumentácie. Všetky rozmery, materiály a procesy sú špecifikované pre nástroje.
      deliverables: Úplný 3D CAD model, technické výkresy, konečný BOM, špecifikácie nástrojov, plán kontroly kvality
    - stage: '04'
      title: Prototypovanie
      duration: 2-3 týždne
      description: Vyrábajú sa prototypové nástroje a zostavujú funkčné vzorky. Klient preskúma prototyp podľa špecifikácií PRD. Testovanie sa vykonáva podľa dohodnutého protokolu. Úpravy dizajnu sa robia na základe spätnej väzby pred výrobou nástroja.
      deliverables: Funkčný prototyp, testovacia správa, záznam o revízii návrhu, dokument o schválení klientom
    - stage: '05'
      title: Výrobné náradie
      duration: 2-3 týždne
      description: Akonáhle je prototyp schválený, sú spustené výrobná nástroje — formy, zváracie prípravky, programy rezania, montážne prípravky. Dokumentácia kontroly kvality a kritériá inšpekcie sú finalizované. Vykonáva sa skúšobná prevádzka na overenie procesu.
      deliverables: Výrobné nástroje, dokumentácia procesu, plán kontroly kvality, správa z skúšobnej prevádzky
    - stage: '06'
      title: Hromadná výroba a kontrola kvality
      duration: Prebiehajúce
      description: Plná výroba začína kontrolou kvality počas všetkých fáz procesu. Prvé kusy sú kontrolované a schválené pred uvoľnením šarže. Prebieha priebežné monitorovanie kvality, sledovanie defektov a neustále zlepšovanie počas celého životného cyklu výroby.
      deliverables: Plán výroby, správy kontroly kvality, záznamy o sledovateľnosti dávok, dokumentácia k odosielaniu
content_customization:
  tagline: Možnosti prispôsobenia
  title: Čo môže byť<br />Prispôsobené
  subtitle: Takmer každý aspekt našich produktov je možné prispôsobiť podľa požiadaviek klienta. Nižšie sú uvedené najbežnejšie kategórie prispôsobenia.
  columns: 3
  items:
    - title: Trup a konštrukcia
      description: Vlastná dĺžka trupu, šírka lúča, uhol odhryznutia, priemer tuby, konfigurácia komory a trieda materiálu.
      icon: tabler:sailboat
    - title: Farby a grafika
      description: Farba trubice (PVC/Hypalon), farba gélu trupu, farba konzoly, grafika paluby, umiestnenie loga a dizajn balenia.
      icon: tabler:palette
    - title: Konzola a ovládanie
      description: Stredová konzola, bočná konzola alebo kormidlo. Vlastné usporiadanie prístrojového panelu, umiestnenie prepínačov a poloha kormidla.
      icon: tabler:steering-wheel
    - title: Sedenie a čalúnenie
      description: Sedadlá pre jazdcov, lavicové sedenie, luxusné čalúnenie, prešívanie v rovnakej farbe, skladacie alebo odnímateľné konfigurácie.
      icon: tabler:armchair
    - title: Doplnky a vybavenie
      description: Potápačské rebríky, stojany na nádrže, ťažné pylóny, T-strechy, Bimini strechy, zvukové systémy, navigačná elektronika a bezpečnostné vybavenie.
      icon: tabler:backpack
    - title: Balenie a branding
      description: Vlastné maloobchodné balenie, krabice s privátnou značkou, prepravné kartóny s logom značky, závesné visačky a používateľské príručky v jazyku klienta.
      icon: tabler:box
content_industries:
  tagline: Aplikácie v priemysle
  title: Inžinierske riešenia<br />podľa odvetvia
  subtitle: Náš inžiniersky tím vyvinul produkty pre širokú škálu námorných aplikácií — každú s odlišnými požiadavkami a výkonnostnými kritériami.
  columns: 3
  items:
    - title: Potápačské operácie
      description: Spevnené paluby, integrácia potápačského rebríka, systémy uchovania nádrží a stabilné platformy pre komerčné potápačské centrá po celom svete.
      icon: tabler:lifebuoy
    - title: Záchrana a pohotovosť
      description: Dizajn trupu pre vysokú rýchlosť, paluby s automatickým vypúšťaním vody, systémy montáže vybavenia a viackomorové bezpečnostné konfigurácie pre SAR operácie.
      icon: tabler:alert-triangle
    - title: Morský turizmus
      description: Rozloženie pre komfort pasažierov, integrácia tienidiel, nástupné systémy a palivovo efektívne konfigurácie pre prevádzku transferu medzi ostrovmi.
      icon: tabler:beach
    - title: Jachtové tendera
      description: Kompaktné dizajny pre úschovu na výsuvných ramenách, možnosti luxusného dokončenia, zladenie farieb s materskou loďou a vysokovýkonné ťažné charakteristiky.
      icon: tabler:sailboat
    - title: Rybárstvo a akvakultúra
      description: Konfigurácie plochej paluby, integrácia živej nádrže, rozloženie držiakov prútov a korózii odolné príslušenstvo pre nepretržitú expozíciu slanej vode.
      icon: tabler:fish
    - title: Prístavy a priemysel
      description: Spevnenie trupu pre ťažké zaťaženie, rozloženie pracovných lodí, konfigurácie pre prepravu personálu a integrácia vybavenia pre offshore operácie.
      icon: tabler:ship
