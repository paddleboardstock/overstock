content_challenge:
  tagline: Výzva
  title: Požiadavky morského výskumu<br />Stabilné, pripravené platformy pre prístroje
  subtitle: Vedecké pracovné lode musia poskytovať stabilnú platformu pre citlivé prístroje, tichú prevádzku, aby nevyrušovali divú prírodu, a flexibilné rozloženie pre rôzne výskumné vybavenie.
  paragraphs:
    - Morský výskum a monitorovanie životného prostredia vyžadujú pracovné lode, ktoré slúžia ako mobilné laboratóriá. Na rozdiel od komerčných alebo rekreačných plavidiel musia výskumné RIBs umožniť umiestnenie citlivých elektronických prístrojov, vybavenia na odber vzoriek vody a sedimentov a niekedy aj transport živých vzoriek — a to všetko pri zachovaní stabilnej platformy pre presný zber dát.
    - '**Stabilita platformy je kritická** — Sonary, echoloty a CTD (vodivosť, teplota, hĺbka) profily vyžadujú stabilný trup v pokoji aj pri pomalej rýchlosti. Nadmerné vlny alebo pohyb trupu zavádzajú šum do vedeckých dát. Hlboký V-trup s dobrou stabilitou je nevyhnutný.'
    - '**Integrácia prístrojov** — Výskumné plavidlá potrebujú montážne body pre GPS antény, sonarové snímače, ramená na odber vzoriek a zariadenia na záznam dát. Priestor pre konzol musí zvládnuť viacero obrazoviek, rozvod energie pre prístroje a bezpečné ukladanie citlivej elektroniky.'
    - '**Tichá prevádzka** — Pri morskobiologických prieskumoch a monitorovaní životného prostredia môže hluk motora a vibrácie trupu vystrašiť morskú faunu a ovplyvniť pozorovanie správania. Tiché motory a trupy s redukovanými vibráciami sú dôležité pre výskumné aplikácie.'
    - Paddle Board Overstock výskumné RIBs sú navrhnuté so stabilnými trupmi, integrovanými systémami montáže vybavenia a tichými vonkajšími motormi pre vedecké a environmentálne monitorovacie účely.
content_solution:
  tagline: Riešenie
  title: Účelovo vyrobené výskumné RIBs<br />Pre vedeckú a environmentálnu prácu
  subtitle: Každé Paddle Board Overstock výskumné RIB je konfigurované ako stabilná, prispôsobiteľná platforma pre vedecké prístroje a vybavenie na odber vzoriek v teréne.
  list:
    - Hlboký V trupu z vláknitého skla s vynikajúcou stabilitou v pokoji a pri pomalých prieskumných rýchlostiach
    - Ploché usporiadanie paluby s montážnymi platňami pre sonar, GPS a odberové zariadenia
    - Konzola nakonfigurovaná pre viacero obrazoviek — plotter, sonar, dátový záznamník
    - 12V a 24V prídavné rozdelenie napájania pre vedecké prístroje
    - Tichý štvortaktný motor — minimálne vibrácie a hluk pri prieskumoch voľne žijúcich živočíchov
    - Voliteľný dizajn trupu s nízkou vlnou pre minimálne rušenie počas zberu údajov
    - Vlastné farby trubiek pre branding výskumných inštitúcií a identifikáciu vozového parku
content_segments:
  tagline: Výskumné profily
  title: Riešenia morských vied<br />Podľa typu aplikácie
  subtitle: Rôzne výskumné aplikácie majú jedinečné požiadavky na plavidlá — od univerzitných výučbových platforiem cez plavidlá na environmentálne prieskumy až po monitorovanie kvality vodyRIBs.
  items:
    - title: Univerzitné programy morských vied
      subtitle: Vzdelávacie platformy, študentské exkurzie, pobrežný výskum
      description: Univerzity morských vied a katedry oceánografie potrebujú spoľahlivé, všestranné pracovné lode na výučbu terénnych kurzov, študentských výskumných projektov a pobrežných prieskumov vedených fakultou. Loď musí byť jednoduchá na obsluhu pre študentov pod dohľadom, dostatočne stabilná na praktické nasadenie prístrojov a dostatočne odolná na časté používanie viacerými používateľmi počas akademických období. Rozpočtové obmedzenia v akademickom prostredí robia z nákladovej efektívnosti a nízkej údržby dôležité faktory.
      features:
        - Stabilná platforma pre rozmiestňovanie a obnovu študentov
        - Jednoduché ovládanie — konfigurácia s tillerom alebo jednou konzolou pre študentské použitie pod dohľadom
        - Hypalon Odolné rúry na časté vylodenia na pláži a manipuláciu so študentmi
        - Montáž zariadení pre výučbový sonar, secchi disk a vzorkovacie zariadenia
        - PVC Nákladovo efektívna možnosť pre akademické programy s obmedzeným rozpočtom
    - title: Morské výskumné ústavy
      subtitle: Prieskum RIBs s integráciou prístrojov, GPS, vzorkovacie zariadenia
      description: Špecializované morské výskumné organizácie vykonávajúce pobrežné a pobrežné prieskumy potrebujú profesionálne RIBs konfigurované prieskumy s integrovanou prístrojovou výbavou. Tieto plavidlá nesú sonarové systémy na batymetrické mapovanie, CTD profilátory na analýzu vodného stĺpca, vzorkovače sedimentov a zariadenia na biologický zber. Loď musí poskytovať stabilnú platformu pri nízkych rýchlostiach prieskumu, dostatok priestoru na palube na rozloženie zariadení a poskytovať čisté 12V/24V napájanie elektroniky.
      features:
        - Integrovaná montáž sonarového snímača — konfigurácia cez trup alebo záď
        - Montáž GPS antény a integrácia konzoly pre navigáciu na úrovni geodetov
        - Oblasť nasadenia CTD a vodných vzorkovačov s bezpečnými upevňovacími bodmi
        - 12V/24V pomocná distribúcia napájania pre prístroje a dátové zapisovače
        - Stabilný pri nízkej rýchlosti (3-6 uzlov) pre presnosť prieskumných čiar
        - Voliteľný A-rám alebo žeriav na nasadenie ťažšieho vzorkovacieho zariadenia
    - title: Environmentálne monitorovanie a ochrana prírody
      subtitle: Ekologické prieskumy, pozorovanie voľne žijúcich živočíchov, hodnotenie biotopov
      description: Environmentálne mimovládne organizácie, vládne agentúry a ochranárske organizácie vykonávajú prieskumy morského ekosystému, monitorovanie populácií voľne žijúcich živočíchov a hodnotenia biotopov. Tieto operácie vyžadujú tiché, nízkodopadné plavidlá, ktoré sa dokážu priblížiť k citlivým biotopom bez rušenia divokej zveri. Lode musia niesť kamerové vybavenie, GPS na mapovanie transektov a vzorkovacie zariadenia na zber vody a sedimentov. Nízka vlna a minimálny hluk motora sú kľúčové pre štúdie behaviorálneho pozorovania.
      features:
        - Tichý štvortaktný motorový motor — minimálne rušenie morskej fauny
        - Stabilná pozorovacia platforma pre fotografickú a video dokumentáciu
        - Montáž vybavenia pre kamerové súpravy, GPS sledovače a terénne počítače
        - Plytký ponor pre prístup do pobrežných mokradí, mangrovov a ústí riek
        - Ľahko čistiteľné povrchy paluby a trubíc pre dekontamináciu medzi lokalitami
    - title: Monitorovanie a testovanie kvality vody
      subtitle: Pravidelné odberové jazdy, sledovanie znečisťujúcich látok, monitorovanie dodržiavania predpisov
      description: Organizácie na monitorovanie kvality vody vykonávajú pravidelné odbery vzoriek po pobrežných zónach, prístavoch a vnútrozemských vodných cestách, aby sledovali úroveň znečistenia, výskyt riasových kvetov a dodržiavanie environmentálnych predpisov. Tieto operácie potrebujú efektívne, spoľahlivé lode pre opakované návštevy pevných odberových staníc. Plavidlo musí niesť odberové vybavenie, chladiace boxy na uchovanie vzoriek a vybavenie na terénne testovanie — s ľahkým umývaním paluby medzi lokalitami, aby sa zabránilo kontaminácii.
      features:
        - Vyhradená oblasť odberovej stanice s chladiacim boxom a úložiskom vybavenia
        - Ľahko čistiteľná paluba a povrchy trubíc pre dekontamináciu medzi lokalitami
        - Integrácia GPS pre presný návrat k pevným súradniciam odberu
        - Kompaktná veľkosť pre prístup k obmedzeným vodným cestám a úzkym kanálom
        - Úsporný prídavný motor pre nákladovo efektívne pravidelné odbery
