process_steps:
  title: 6-krokový OEM/ODM proces
  subtitle: Od návrhu až po FOB Qingdao — zjednodušený pracovný tok
  steps:
    - number: '01'
      title: Návrhový dokument a 3D CAD modelovanie
      description: Zdieľajte svoje cieľové špecifikácie, referenčný produkt alebo koncept. Náš inžiniersky tím vypracuje podrobné CAD výkresy a 3D vizualizácie na vaše schválenie.
      timeline: 3–5 dni
    - number: '02'
      title: Výber materiálov a testovanie látok
      description: Vyberte si z vojenského štandardu PVC (0.9–1.2 mm), Hypalon CSM, alebo drop-stitch jadrových látok. Vykonávame testy pevnosti v ťahu, priľnavosti povlaku a UV stability.
      timeline: 2–3 dni
    - number: '03'
      title: Rýchle prototypovanie a výroba vzoriek
      description: My CNC opracujeme vlastné formy a vyrobíme predprodukčné vzorky s vašimi firemnými farbami, logom a špecifikovanými materiálmi. Vzorky sú odoslané na vaše schválenie.
      timeline: 7–14 dní
    - number: '04'
      title: 24–48 hodinový test vysokotlakového udržania
      description: Každý prototyp prechádza prísnym testovaním udržania tlaku pri 1.25x menovanom tlaku. Vykonávajú sa testy odlupovania švov a overovanie rozmerov.
      timeline: 1–2 dni
    - number: '05'
      title: CE/ISO Kontrola kvality a balenie
      description: 100-bodový kontrolný zoznam kvality. Každá jednotka je kontrolovaná pred zabalením pripraveným na predaj. CE vyhlásenie o zhode a BSCI správa o súlade sú priložené.
      timeline: 2–3 dni
    - number: '06'
      title: FOB Qingdao doprava a logistika
      description: Hotové výrobky paletizované, balené do strečovej fólie a nakladané do kontajnera v prístave Qingdao. Plná exportná dokumentácia, colné vybavenie a sledovanie v reálnom čase.
      timeline: 7–14 dní
