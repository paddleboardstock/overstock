faq:
  title: OEM/ODM — Často kladené otázky
  questions:
    - q: Aké je minimálne množstvo objednávky (MOQ) pre vlastné nafukovacie SUPs?
      a: Pre štandardné modely s existujúcimi formami začína MOQ sa na 5–10 kusoch na dizajn. Pre plne prispôsobené formy a nástroje MOQ je to typicky 200+ kusov. Spolupracujeme so startupmi a začínajúcimi značkami, aby sme našli uskutočniteľné vstupné body.
    - q: Ako dlho trvá proces odberu OEM vzorky?
      a: Štandardné prototypové vzorky sú dokončené do 7–14 pracovných dní po schválení návrhu. Rýchle objednávky môžu byť prioritizované na 5–7 dní za dodatočný poplatok.
    - q: Aký je rozdiel medzi PVC Hypalon a pre nafukovacie člny?
      a: PVC je ľahší, cenovo dostupnejší a ponúka vynikajúcu flexibilitu v chladnom počasí.Hypalon (CSM) poskytuje UV vynikajúcu odolnosť voči ozónu a dlhšiu životnosť (10–15 rokov oproti 5–8 rokom). Odporúčame PVC pre väčšinu rekreačných využití a Hypalon komerčné/profesionálne použitie.
    - q: Môžete si prispôsobiť tvar a dizajn nafukovacieho zariadenia?
      a: Áno. Náš výskumný a vývojový tím dokáže vyvinúť vlastné formy pre akýkoľvek tvar trupu, obrys dosiek alebo konfiguráciu trubiek. Používame CNCobrábané hliníkové formy pre presnosť a konzistenciu.
    - q: Poskytujete audítorské služby vo fabrikách?
      a: Vítame audity tovární priamo na mieste aj od tretích strán v našom 12 000 m² zariadení v Qingdao. Udržiavame ISO 9001 a BSCI certifikácie a môžeme zdieľať auditné správy na NDA.
    - q: Aké podmienky dopravy ponúkate?
      a: Ponúkame FOB Qingdao ( CIFDDP štandardné), , a podmienky prepravy. Nakladanie kontajnerov a kompletná exportná dokumentácia sú zahrnuté vo všetkých OEM objednávkach.
content_profiles:
  tagline: Profily značiek
  title: OEM / Výroba pod privátnou značkou<br />Podľa typu zákazníka
  subtitle: Rôzne profily značiek majú špecifické požiadavky — prispôsobujeme OEMODM naše služby tak, aby zodpovedali vášmu obchodnému modelu, rozsahu a stratégii uvedenia na trh.
  items:
    - title: Začínajúce značky vodných skútrov
      subtitle: MOQNízky, rýchly nájazd
      description: Podnikatelia a zakladatelia, ktorí uvádzajú na trh svoju prvú radu SUPs, kajakov alebo nafukovacích člnov. Potrebujete výrobný partner, ktorý sa k vašej značke správa ako k vlastnej — s nízkymi vstupnými prahmi, flexibilnými veľkosťami dávok a praktickým dizajnovým poradenstvom na každom kroku.
      features:
        - MOQ už od 50–100 kusov na SKU, nie tisíce
        - Existujúca knižnica foriem na vynechanie nákladov na náradie
        - 'Kompletný balík značky: logo, grafika na tubách, balenie, visačky na zavesenie'
        - Workflow so vzorkou na prvom mieste — schváliť pred produkciou
    - title: Zavedené námorné značky
      subtitle: OEM škálovať s CE/ISO súladom
      description: Existujúce značky člnov, PWC alebo námorných doplnkov pridávajú do svojho portfólia nafukovacie vodné plavidlá. Potrebujete konzistentnú kvalitu naprieč výrobnými sériami, regulačnú súladnosť pre globálne trhy a schopnosť spoluinžinierovať vlastné trupy alebo tvary trubiek.
      features:
        - Vlastné 3D inžinierstvo foriem pre proprietárne návrhy
        - CE 2013/53/EÚ, UKCAUSCG , dokumentácia o súlade
        - BSCI Sociálne auditné správy pre súlad maloobchodníkov
        - Dedikované riadenie účtov + prioritné výrobné sloty
    - title: Značky DTC a E-commerce
      subtitle: Obaly pripravené na predaj v maloobchode vo veľkom množstve
      description: Značky predávajúce online, cez Amazon, Shopify alebo svoje vlastné webové obchody. Obal, skúsenosť s rozbalením a konzistentná kvalita jednotiek sú kritické. Potrebujete továreň, ktorá rozumie dynamike rýchlosti predaja a miery vrátenia tovaru v e-commerce.
      features:
        - Dizajn krabice pripravený na predaj + tlač vložených kariet
        - Vákuové balenie / paletizácia pre nákladovo efektívnu dopravu
        - EAN / UPC čiarový kód a dokumentácia pripravená pre colnicu
        - Konsolidácia zmiešaných kontajnerov na optimalizáciu konečných nákladov
    - title: Životný štýl a značky pre vonkajšie aktivity
      subtitle: White-label dizajn + rozšírenie kategórie
      description: Odevy, vybavenie na vonkajšie aktivity alebo cestovné značky vstupujúce do kategórie vodných športov pod vlastnou značkou. Nemusíte mať interné odborné znalosti v oblasti námorného inžinierstva — preto potrebujete partnera, ktorý vás prevedie od konceptu po kontajner s minimálnymi prekážkami.
      features:
        - Výskum trendov a konceptuálne moodboardy
        - Spolu-s podpisované limitované edície a sezónne farebné varianty
        - Cykly od dizajnu po vzorku za 10–14 pracovných dní
        - 'Kompletná logistika: továreň → sklad → spotrebiteľ'
