stories:
  - title: Ako stredomorský rezort vybudoval ziskový prenájom SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-hviezdičkový plážový rezort — Grécko
    problem: Rezort potreboval prémiové vodné aktivity pre hostí, aby zvýšil hodnotenia spokojnosti a vytvoril nový tok príjmov, ale chýbalo mu vybavenie, bezpečnostná infraštruktúra a odborné znalosti personálu.
    solution: Paddle Board Overstock dodal 50 dosiek SUP s vlastnou značkou, farebne a logom ladenej s rezortom, kompletný bezpečnostný systém vrátane stanice pre záchranárov a bójkových línií, a 3-dňový tréningový program pre personál zameraný na manipuláciu s vybavením, inštruktáž hostí a bezpečnostné protokoly.
    result:
      - 300+ rezervovaných týždenných aktivít pre hostí už v prvom mesiaci
      - 'Hodnotenie spokojnosti hostí s vodnými aktivitami: 4,8/5'
      - 'Nový ročný dodatočný príjem: 180 000 $'
      - Žiadne bezpečnostné incidenty v prvej prevádzkovej sezóne
      - Náklady na výmenu vybavenia znížené o 40% oproti predchádzajúcemu dodávateľovi
    quote:
      text: Paddle Board Overstock nám nedodal len dosky — pomohol nám vytvoriť kompletný zážitok pre hostí. Náš program vodných športov sa z nuly stal hlavným lákadlom rezortu za jednu sezónu.
      author: Generálny riaditeľ rezortu
    cta_text: Vybudujte svoje riešenie pre rezort
    cta_href: /solutions/resorts
  - title: Ako austrálska startup spoločnosť vybudovala vodnú značku za 90 dní
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Začiatočnícky podnikateľ — Austrália
    problem: Milovník outdooru chcel spustiť vlastnú značku SUP pre austrálsky trh, ale nemal žiadne skúsenosti s výrobou, žiadne vzťahy s dodávateľmi a obmedzený kapitál.
    solution: Balík Brand Launch Paddle Board Overstock poskytol konzultácie pri výbere produktu, návrh vlastného loga a farieb, značkové maloobchodné balenie s visačkami, dokumentáciu o certifikácii CE a FOB dopravu do Sydney.
    result:
      - Prvá zásielka 200 dosiek doručená do 75 dní od prvého kontaktu
      - Značka spustená na Shopify + Amazon AU do 2 týždňov od doručenia
      - Počiatočný inventár vypredaný za 45 dní
      - 'Priemerná marža: 55% pri maloobchodnej cene'
      - Druhú objednávku 500 kusov zrealizovaných do 60 dní od spustenia
    quote:
      text: Mal som nápad na značku, ale žiadne výrobné znalosti. Paddle Board Overstock ma doslova držal za ruku počas celého procesu — od výberu správneho dizajnu dosky až po rozbalenie prvej zásielky. 90 dní od sna po doručenie.
      author: Zakladateľ, austrálska značka SUP
    cta_text: Spustite svoju značku
    cta_href: /solutions/entrepreneurs
  - title: Ako thajský plážový klub rozšíril flotilu z 10 na 80 dosiek
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Klub vodných športov — Thajsko
    problem: Malý klub pri pláži v Phukete potreboval rozšíriť svoju činnosť z hobby na profesionálny prenájom pre turistov, ale nedokázal nájsť spoľahlivého dodávateľa vybavenia s konzistentnou kvalitou a cenami.
    solution: Začínajúc s Paddle Board Overstock Club Starter Package (10 dosiek, pádlá, bezpečnostné vybavenie, branding) klub rástol cez program Premium Package počas 18 mesiacov.
    result:
      - Rozšíril sa z 10 na 80 dosiek za 18 mesiacov s konzistentnou kvalitou a cenami
      - Pridal prenájom kajakov a šlapacích člnov s rovnakým dodávateľom
      - Vlastný branding klubu zvýšil rozpoznateľnosť značky medzi turistami
      - Náklady na údržbu sa znížili o 60 % oproti predchádzajúcemu vybaveniu na rozpočet
      - Teraz poskytuje 150+ denných prenájmov počas sezóny
    quote:
      text: Club Starter Package bol ideálnym vstupným bodom. Keď rástol náš biznis, Paddle Board Overstock rástol s nami — rovnaká kvalita, rovnaké ceny, žiadne prekvapenia.
      author: Majiteľ klubu, Phuket
    cta_text: Spustite svoj Club Package
    cta_href: /solutions/clubs
  - title: Ako karibský rezortný reťazec štandardizoval vodné športy v piatich objektoch
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Rezortný reťazec — Karibik
    problem: Luxusný rezortný reťazec s piatimi objektmi potreboval konzistentnú kvalitu vybavenia a branding vodných športov vo všetkých lokalitách, s centralizovaným obstarávaním a plánovaním sezónnej výmeny.
    solution: Paddle Board Overstock dodal flotilu 300 SUPs a 100 kajakov s jednotným brandingom, zdieľaným inventárom náhradných dielov a ročným plánom výmeny za objemové ceny.
    result:
      - Štandardizovaná skúsenosť hostí vo všetkých 5 objektoch
      - 30% zníženie nákladov prostredníctvom konsolidovaného nákupu a objemových cien
      - Centralizovaný inventár náhradných dielov znížil prestoje o 80 %
      - Ročný program obnovy vybavenia eliminoval chaos na konci sezóny
      - Účasť hostí na vodných športoch medziročne vzrástla o 45 %
    cta_text: Navrhnite svoj Resort Program
    cta_href: /solutions/resorts
