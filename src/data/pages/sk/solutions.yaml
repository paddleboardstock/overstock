features3_solutions:
  tagline: Riešenia
  title: Vaše vodné dobrodružstvo<br />Obchodný partner
  isBeforeContent: false
  columns: 3
  items:
    - title: Kluby vodných športov
      description: Kompletné balíky vybavenia, vlastné značkovanie a programy údržby pre SUP kluby, kajakové kluby, surfovacie školy a tréningové centrá.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vodné športy RIBs
      description: Špeciálne navrhnuté RIBs pre plavebné školy, centrá vodných športov a organizačné podujatia. Lode pre trénerov, vlečné čluny a dohliadacie plavidlá pre profesionálne vodné športy.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Rezorty a hotely
      description: Prémiové programy vodných športov s flottou vybavenia, bezpečnostnými systémami, školením personálu a správou príjmov pre pohostinské objekty.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Podnikatelia vo vodnom segmente značiek
      description: Výroba produktov pod privátnou značkou OEM/ODM s nízkym MOQs, vlastným dizajnom produktu, balením a celosvetovou dopravou pre majiteľov nových značiek.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Lode pre potápačské centrá
      description: Stabilné RIB platformy s jednoduchým vstupom a výstupom, skladovaním vybavenia a konfiguráciami motora optimalizovanými pre potápačské operácie.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Záchranné a pohotovostné vodné plavidlá
      description: Vysokorýchlostné RIBs a nafukovacie lode navrhnuté pre hľadanie a záchranu, pohotovostné zásahy a operácie pobrežnej stráže.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Riešenia pre jachtové tenderové lode
      description: Kompaktné, štýlové RIB tendrové lode, ktoré dopĺňajú superjachty a rekreačné plavidlá. Ľahké uskladnenie, výkonný výkon.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Riešenia pre rybárske lode
      description: Stabilné, odolné nafukovacie lode a RIBs nakonfigurované pre komerčný a rekreačný rybolov.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Vybavenie pre námorný cestovný ruch
      description: Nafukovacie lode pripravené na flotilu, SUP dosky a kajaky pre rezorty, cestovné kancelárie a požičovne vodných športových pomôcok.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Energia na mori RIBs
      description: Ťažké RIBs pre podporu ropných a plynových platforiem, prepravu posádok veterných elektrární, inšpekciu podmorských káblov a námornú výstavbu.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Pracovné lode pre akvakultúru
      description: Korózii odolné RIBs pre rybné farmy, pestovanie perál a oceánske farmy. Hypalon trubice, nerezové kovania, odolnosť pri každodennom používaní.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Výskum a prieskum mora
      description: Stabilné, prístrojmi pripravené RIBs pre oceánografický výskum, monitorovanie životného prostredia, odbieranie vzoriek vody a univerzitné vzdelávacie programy.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komerčné pracovné lode
      description: Ťažké RIBs pre hliadku, prieskum, prepravu a logistiku na mori. Navrhnuté pre náročné podmienky komerčných operácií.
      icon: tabler:ship
      link: /commercial-workboats
