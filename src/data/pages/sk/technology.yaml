testimonial:
  quote: Čo odlišuje Aquafarer je ich materiálová veda. Nezostavujú len komponenty – navrhujú zloženie PVC, zváracie parametre a konštrukčné vrstvenie interne. Táto vertikálna integrácia sa prejavuje vo finálnom produkte.
  author: David Park
  title: Manažér vývoja produktov
  company: Bluewater Sports Equipment
  location: Austrália
sections:
  - title: Drop-Stitch Jadro
    standard: Prevádzkový tlak 12-15 PSI
    description: Tisíce vnútorných polyesterových vlákien spájajú hornú a spodnú vrstvu, vytvárajúce pevnú konštrukciu pri 12-15 PSI. Ide o rovnakú technológiu, ktorá sa používa v profesionálnych paddle boardoch a nafukovacích pretekárskych lodiach. Naša hustota drop-stitch je optimalizovaná podľa modelu pre ideálnu rovnováhu tuhosti a hmotnosti.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Diagram jadra DS
  - title: Námorná trieda PVC
    standard: Spojené fúznym zváraním | UV / soľná voda / odolnosť proti oderu
    description: Viacvrstvová laminovaná tkanina PVC hodnotená pre morské prostredie. Každá vrstva je spojená fúznym zváraním, namiesto lepenia, čím sa eliminuje riziko delaminácie. Testované na odolnosť proti UV (ASTM G154, 1 000+ hodín), koróziu slanou vodou (ISO 9227) a odolnosť proti oderu (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: Vrstva PVC
  - title: Trubice Hypalon
    standard: Guma CSM | UV / odolná voči chemikáliám / extrémnym teplotám
    description: Používané na modeloch RIB, guma Hypalon (CSM) poskytuje vynikajúcu odolnosť proti UV a chemikáliám v porovnaní so štandardnou PVC. Trubice Hypalon zachovávajú flexibilitu pri extrémnych teplotách a odolávajú degradácii pri kontakte s palivom a olejom. Všetky švy sú ručne ukladané certifikovanými technikmi.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Podlahová vzduchová doska
    standard: Vysokotlakový nafukovací | Nahrádza preglejku/hliník
    description: Vysokotlakový nafukovací podlahový systém nahrádzajúci tradičné podlahy z preglejky alebo hliníkových latiek. Znižuje čas zostavenia, celkovú hmotnosť a objem skladovania pri zachovaní primeranej tuhosti pre státie, rybárčenie a chôdzu. Testované na podporu rozloženej záťaže 200 kg.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Vzdušná paluba
