content_version_control:
  tagline: Správa verzií
  title: Kresba verzie<br />Manažment
  subtitle: Každý výkres nasleduje kontrolovaný systém revízií. Vždy si overte, že máte aktuálnu revíziu predtým, než použijete výkresy na plánovanie projektu.
  items:
    - title: Sledovanie revízií
      description: Každý výkres nesie kód revízie (Rev-A, Rev-B, Rev-C), dátum vydania, dátum poslednej recenzie, príslušný model/konfiguráciu, jednotky, veľkosť súboru a formát. Na stiahnutie je dostupná iba "Aktuálna" revízia.
      icon: tabler:git-branch
    - title: Oznámenie o stave žrebovania
      description: Všetky verejné výkresy sú označené ako "Len predbežné rozloženie — nie na stavebné, certifikačné alebo výrobné použitie. Rozmery podliehajú konečnej špecifikácii a potvrdeniu objednávky." To chráni obe strany pred nesprávnou aplikáciou.
      icon: tabler:alert-circle
    - title: Upozornenia na aktualizácie
      description: Keď sa zmení špecifikácia modelu, revízia výkresu sa aktualizuje a predchádzajúce verzie sú označené ako "Nahradené". Registrovaní používatelia, ktorí si stiahli balíky DXF/DWG, sú o významných aktualizáciách informovaní e-mailom.
      icon: tabler:bell
faq:
  title: Technické výkresy — často kladené otázky
  questions:
    - q: Sú GA PDF naozaj zadarmo?
      a: Áno. PDF s všeobecným usporiadaním našich hlavných modelov sú dostupné bezplatne — vyplňte krátky kvalifikačný formulár nižšie a odkaz na stiahnutie vám bude doručený e-mailom do 1 pracovného dňa. Obsahujú informácie na úrovni plánovania, ktoré sú dostatočné na hodnotenie projektu, prideľovanie priestoru a predbežnú kontrolu špecifikácií.
    - q: Ako sa dostanem k DXF/DWG súborom?
      a: Vyplňte krátky kvalifikačný formulár na stránke na stiahnutie s názvom vašej spoločnosti, typom projektu a zamýšľaným použitím. Schválené žiadosti dostanú odkaz na stiahnutie e-mailom do 1 pracovného dňa.
    - q: Môžem získať STEP/IGES 3D modely?
      a: Súbory 3D modelov STEP alebo IGES sú dostupné prostredníctvom nášho procesu podávania žiadosti o projekt. Uveďte rozsah projektu, požiadavky na integráciu, časový harmonogram a zámer nákupu. Podlieha schváleniu — zvyčajne do 3-5 pracovných dní.
    - q: Prečo obmedzujete prístup k podrobnejším súborom?
      a: Geometria trupu, údaje o formách a štrukturálne výpočty predstavujú roky investícií do výskumu a vývoja a sú jadrom výrobného duševného vlastníctva. Poskytujeme všetko potrebné na plánovanie obstarávania a integráciu projektov, pričom chránime našu schopnosť pokračovať v investovaní do vývoja nových produktov.
    - q: Obsahujú výkresy výrobné detaily?
      a: Nie. Verejné a ľahké výkresy obsahujú informácie na úrovni obstarávania pre plánovanie a špecifikáciu. Detaily na úrovni výroby (harmonogramy laminácie, dráhy nástrojov, rozšírenia rezu) sú zdieľané len NDA v rámci potvrdených objednávok.
    - q: Sú k dispozícii výkresy pre RIB vlastné alebo polovlastné konfigurácie?
      a: Individuálne projektové výkresy sa pripravujú ako súčasť OEMODM procesu / vývoja. Ak hodnotíte RIB vlastný projekt, kontaktujte nás so svojimi požiadavkami a my vám poskytneme projektovo špecifické výkresy GA ako súčasť návrhu.
