content_tiers:
  tagline: Úrovne stiahnutia
  title: Štyri úrovne prístupu<br />— Správna podrobnosť pre správnu fázu
  subtitle: Poskytujeme technické výkresy na úrovni obstarávania, nie výrobné súbory. Každá úroveň zodpovedá inej fáze projektu.
  items:
    - title: Úroveň 1 — Verejné PDF
      description: Všeobecné usporiadanie (GA), 4-pohľadový rozmerový výkres a rozloženie paluby vo formáte PDF. K dispozícii na bezplatné stiahnutie. Dostatočné pre plánovanie projektu, rozdelenie priestoru a predbežné preskúmanie špecifikácií.
      icon: tabler:file-type-pdf
    - title: Úroveň 2 — Ľahká forma DXF/DWG
      description: 2D CAD súbory (DXF alebo DWG) pre integráciu plánovacieho rozloženia. Vyžaduje krátky kvalifikačný formulár (názov spoločnosti, typ projektu, zamýšľané použitie). Neobsahuje konštrukčné ani výrobné údaje.
      icon: tabler:file-code
    - title: Úroveň 3 — Projektová žiadosť STEP/IGES
      description: 3D modelové súbory (STEP alebo IGES) pre integráciu systému, dizajn vybavenia alebo koordináciu námorného inžinierstva. Vyžaduje projektovú žiadosť s rozsahom, časovým harmonogramom a zámerom nákupu. Podlieha schváleniu.
      icon: tabler:cube
    - title: Úroveň 4 — NDA Inžinierstvo
      description: Konštrukčné výkresy trupu, harmonogramy laminácie, rozloženie rezov trubíc a údaje o forme. K dispozícii iba pod NDA s potvrdenými objednávkami. Toto sú výrobné súbory — nie pre verejné šírenie.
      icon: tabler:lock
content_included:
  tagline: Čo je zahrnuté
  title: Obsah výkresov<br />Podľa modelu
  subtitle: Každý model má štandardný balík výkresov pokrývajúci základné plánovacie informácie pre kupujúcich B2B a projektových inžinierov.
  items:
    - title: Všeobecné usporiadanie (GA)
      description: Bočný profil, horný pohľad a priečny rez zobrazujúci tvar trupu, polohu trubíc, miesto konzoly, sedenie, palivový systém a kľúčové rozmery (LOA, šírka, priemer trubice, uhol deadrise). Stav revízie a autorské práva sú uvedené v titulnom bloku.
      icon: tabler:layout
    - title: Výkres rozmerov 4 pohľady
      description: Bočný, predný, zadný a horný pohľad s celkovými rozmermi pre plánovanie prepravy (výška na prívesnom vozíku, šírka pre kontajner, hmotnosť na zdvíhanie). Zahrnuté sú prevádzkové a prepravné konfigurácie.
      icon: tabler:ruler-2
    - title: Rozloženie paluby a plán vybavenia
      description: Pohľad zhora na palubu zobrazujúci základňu konzoly, polohy sedadiel, umiestnenie D-krúžkov, polohy navigačných svetiel, prístup k ponornému čerpadlu, priestor na batérie/palivo a body montáže vybavenia. Obmedzená presnosť na proprietárnych rozhraniach.
      icon: tabler:map
    - title: Výkres prepravy a balenia
      description: Plán nakladania do kontajnera, rozmery kolísky, rozloženie hmotnosti a polohy zdvíhacích bodov pre logistické plánovanie. Zahrnuté sú štandardné a vlastné možnosti balenia.
      icon: tabler:truck
content_protection:
  tagline: Ochrana duševného vlastníctva (IP)
  title: Čo nezdieľame<br />& Prečo
  subtitle: Ochrana našej inžinierskej IP zabezpečuje, že môžeme pokračovať v investovaní do výskumu a vývoja, pričom stále poskytujeme všetko, čo kupujúci potrebujú na projektové plánovanie.
  items:
    - title: Dáta jadra formy trupu
      description: Geometria plug a formy, CNC cesty nástrojov a šablóny laminácie sú proprietárne výrobné aktíva. Nie sú zdieľané na žiadnej úrovni prístupu mimo potvrdené NDA zmluvy.
      icon: tabler:ban
    - title: Rozšírenia rezania trubíc
      description: Súbory pre rezanie plochého vzoru trubice sú výrobné dáta. Dostupné len podľa NDA s potvrdenými výrobnými objednávkami a zdieľané iba so zmluvnou stranou.
      icon: tabler:ban
    - title: Štrukturálne výpočty
      description: Podrobné analýzy napätia, výsledky FEA a plány laminácie sú dokumenty citlivé na súlad s predpismi, zdieľané len s Notifikovanými orgánmi a klientmi viazanými NDA počas procesu posudzovania zhody.
      icon: tabler:ban
    - title: Preverovanie konkurencie
      description: Vyhradzujeme si právo odmietnuť požiadavky na prístup k CAD, ktoré sa zdajú byť od konkurentov, študentov bez projektového kontextu alebo strán bez oprávneného zámeru obstarávania.
      icon: tabler:shield
content_models:
  tagline: Dostupné modely
  title: Technický výkres<br />Dostupnosť podľa modelu
  subtitle: Stiahnutie GA PDF je možné pre naše hlavné RIB a nafukovacie modely lodí. Kontaktujte nás pre konkrétne výkresy modelov, ktoré nie sú uvedené.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, GRP trup deep-V, Hypalon alebo PVC trubice, stredová konzola. K dispozícii GA, rozmery, rozloženie paluby a plán prepravy. Kategória dizajnu C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, trup GRP strednej veľkosti, Hypalon alebo PVC rúry, bočný alebo stredový konzol. GA a rozmery k dispozícii. Kategória dizajnu C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, trup GRP, PVC rúry, kormidlová páka alebo konzola. GA a rozmery k dispozícii. Kategória dizajnu C/D.
      icon: tabler:sailboat
    - title: AF380 Nafukovací čln
      description: 3,8 m nafukovacia člnka, hliníková podlaha, PVC rúry. GA a rozmery balenia k dispozícii. EN ISO 6185 v súlade.
      icon: tabler:sailboat
    - title: AF320 Nafukovací čln
      description: 3,2 m nafukovací čln, podlaha z nafukovacích panelov, PVC rúry. GA a rozmery balenia k dispozícii. EN ISO 6185 v súlade.
      icon: tabler:sailboat
