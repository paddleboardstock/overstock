hero:
  tagline: Technické výkresy a CAD
  title: RIB a nafukovací čln<br />Stiahnuť technické výkresy a CAD
  subtitle: Plánovacie GA výkresy, rozmerové listy a rozloženie paluby pre hodnotenie projektu a špecifikácie. Prístup k technickým výkresom na správnej úrovni — od verejných PDF po projektové súbory STEP.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB technické výkresy člnov a stiahnutie CAD
direct_answer: Aquafarer poskytuje technické výkresy pre obstarávanie RIB člnov a nafukovacích plavidiel — vrátane všeobecných usporiadacích (GA) PDF, rozmerových listov a výkresov rozloženia paluby. Podrobnejšie formáty (DXF/DWG, STEP/IGES) sú k dispozícii po kvalifikovanom dopyte alebo projektovej žiadosti.
stats:
  - value: GA PDF
    label: Bezplatné stiahnutie
