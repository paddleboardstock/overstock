features3_brand:
  tagline: Kto sme
  title: Základy značky<br />& Dedičstvo
  subtitle: Príbeh, odborné znalosti a globálny dosah, ktoré definujú Aquafarer ako dôveryhodného výrobcu námornej techniky.
  isBeforeContent: false
  columns: 3
  items:
    - title: O Aquafarer
      description: Založená v roku 2012 v Qingdao, Čína. Od pobrežnej dielne po zariadenie o rozlohe 12 000 m² — kompletný príbeh Aquafarer.
      icon: tabler:building-factory
      link: /about
    - title: Príbeh značky
      description: Ako tím námorných inžinierov sa rozhodol sprístupniť profesionálne nafukovacie plavidlá celosvetovo.
      icon: tabler:book
      link: /brand-story
    - title: Odbornosť v námornom priemysle
      description: Hlboké znalosti materiálov, presná výroba a testovanie v reálnom svete — desaťročia námorného inžinierstva v každom trupe.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globálna prítomnosť
      description: Poskytujeme služby v 50+ krajinách na všetkých kontinentoch. Regionálna odbornosť pre miestne regulačné požiadavky a preferencie trhu.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Prečo Aquafarer
      description: Čo nás odlišuje — kvalita, prispôsobenie, priame ceny z továrne a komplexná podpora pre komerčných prevádzkovateľov.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Náš tím
      description: Spoznajte vedenie — námorných inžinierov, materiálových vedcov a výrobných expertov, ktorí posúvajú Aquafarer vpred.
      icon: tabler:users
      link: /brand/team
    - title: Tím inžinierov
      description: 78+ rokov kombinovaných skúseností s výskumom a vývojom, 40+ platforiem, 12 certifikácií, 1200+ projektov OEM. Technický tím za každým produktom.
      icon: tabler:engine
      link: /engineering-team
    - title: Centrum výskumu a vývoja
      description: Konštrukcia trupu, RF zváranie, PVC laboratórium, prototypovanie, testovacia nádrž a kontrolné laboratórium — naše kompletné výskumné a vývojové zariadenie.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Dôvera a kvalita
  title: Certifikáty, Kvalita<br />& Dôkaz
  subtitle: Nezávislé certifikácie, dôkladné testovanie a skutočné dôkazy, ktoré preukazujú náš záväzok k kvalite.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifikácie
      description: CE, ISO 9001, UKCA, BSCI, REACH — kompletná certifikačná dokumentácia a súlad s predpismi pre globálne trhy.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalita a testovanie
      description: Každý produkt je pred odoslaním testovaný na tlak. Pevnosť švov, odolnosť UV, plavnosť — overované v každom štádiu.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dôkazy a potvrdenie
      description: Výsledky testov, fotografie z nasadenia, správy o inšpekcii od tretích strán a prípadové štúdie potvrdzujúce kvalitu Aquafarer.
      icon: tabler:file-check
      link: /evidence
    - title: Graf znalostí
      description: Preskúmajte graf entít Aquafarer — produkty, technológie, certifikácie a vzťahy v prepojenej znalostnej databáze.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vedenie
  title: Spoznajte tím<br />Za Aquafarer
  subtitle: Odbornosť v priemysle, ktorá zahŕňa námorné inžinierstvo, materiálové vedy, riadenie kvality a globálny B2B obchod.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Zakladateľ a generálny riaditeľ
      description: 15+ rokov v námornej výrobe. Predtým viedol výskum a vývoj v hlavnej čínskej lodiarenskej spoločnosti. Vlastní niekoľko patentov na dizajn nafukovacích člnov.
      icon: tabler:crown
    - title: Zhang Wei — Hlavný inžinier
      description: 20+ rokov v PVC/Hypalon výrobe a navrhovaní trupu typu deep-V. Bývalý technický riaditeľ v európskej spoločnosti pre námorné inžinierstvo.
      icon: tabler:engine
    - title: Chen Ming — vedúci výskumu a vývoja
      description: PhD v materiálovej vede. Špecializuje sa na technológiu drop-stitch a vysokofrekvenčné zváranie. 10+ rokov v textilných kompozitoch.
      icon: tabler:flask
    - title: Liu Qiang — riaditeľ výroby
      description: 18+ rokov v štíhlej výrobe. Six Sigma Black Belt. Implementoval ISO systémy kvality 9001 vo všetkých výrobných linkách.
      icon: tabler:settings
    - title: Wang Fang — Manažér kvality
      description: 12+ rokov v kontrole kvality v oblasti mora. Certifikovaný CE a ISO audítor. Dohliada na testovanie každej výrobnej šarže.
      icon: tabler:shield-check
    - title: Helen Lee — riaditeľka predaja
      description: 15+ rokov v medzinárodnom B2B obchode. Riadené OEM/ODM partnerstvá v 30+ krajinách. Plynule hovoriaci 4 jazykmi.
      icon: tabler:briefcase
cta:
  title: Chcete overiť naše referencie?
  subtitle: Kontaktujte nás pre kópie certifikátov, správy o inšpekcii tretích strán alebo na dohodnutie návštevy továrne.
  actions:
    - variant: primary
      text: Požiadať o poverenia
      href: /contact
    - text: Zobraziť podrobnosti certifikácie
      href: /certifications
