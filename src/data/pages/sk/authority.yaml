hero:
  tagline: Centrum autority
  title: Prečo Aquafarer?<br />Dôvera budovaná viac ako desaťročie
  subtitle: Každá loď, ktorú postavíme, nesie váhu 10+ rokov námorného inžinierstva, certifikovaných systémov kvality a tisícov úspešných operácií po celom svete. Preto profesionáli v priemysle volia Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
