reasons:
  tagline: Ten Paddle Board Overstock rozdiel
  title: Čo nás odlišuje
  isBeforeContent: false
  columns: 3
  items:
    - title: Skutočná výroba, nie obchodovanie
      description: Vlastníme a prevádzkujeme fabriku s rozlohou 12 000 m². Keď spolupracujete s Paddle Board Overstock, pracujete priamo s ľuďmi, ktorí navrhujú, konštruujú a vyrábajú vaše produkty — bez prostredníkov.
      icon: tabler:building-factory
    - title: Prístup vedený inžinierstvom
      description: Náš proces navrhovania začína pri použití prípadu, nie pri kategórii produktu. Optimalizujeme tvar trupu, výber materiálu a konfiguráciu podľa toho, ako bude zariadenie skutočne používané v komerčných prostrediach.
      icon: tabler:engine
    - title: Certifikovaná kvalita
      description: CE certifikované, ISO systém kvality, BSCI v súlade, REACH v súlade, USCG typ III/V schválené záchranné vesty; všetky produkty spĺňajú príslušné medzinárodné normy.
      icon: tabler:certificate
    - title: Flexibilný OEM/ODM
      description: Farby tuby, rozloženie konzoly, branding, balenie — prispôsobujeme podľa vašich špecifikácií. Žiadny tlak na minimálnu objednávku. Začnite s prototypom, zvyšujte s istotou.
      icon: tabler:adjustments
    - title: Globálna logistika
      description: Sklad v USA v Kalifornii, priame dodanie z Qingdao, letecká doprava pre urgentné objednávky. Zabezpečujeme colné papiere a dokumentáciu po celom svete.
      icon: tabler:truck-delivery
    - title: Doživotná podpora
      description: Podporujeme lode, ktoré sme postavili pred 20 rokmi. Originálne náhradné diely, technické rady, pokyny na opravy — náš tím je k dispozícii, keď nás potrebujete, kdekoľvek ste.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dôveryhodné pre značky po celom svete
  title: Čo hovoria naši partneri
  items:
    - content: Spolupracovali sme s niekoľkými výrobcom v Číne, ale Paddle Board Overstock vyniká svojou technickou podporou a konzistentnou kvalitou. S našou značkou zaobchádzajú ako s vlastnou.
      name: — OEM Partner, európska značka vodných športov
    - content: Ich Hypalon RIBs sú súčasťou našej flotily už viac ako 5 rokov. Minimálna údržba, vynikajúca UV odolnosť. Päťročná záruka na trubice nám dáva istotu.
      name: — Prevádzkovateľ flotily, stredovýchodná sieť rezortov
    - content: Tím Paddle Board Overstock nám pomohol vyvinúť vlastný dizajn dosky SUP od konceptu po výrobu za 90 dní. Kvalita presiahla naše očakávania.
      name: — Distribútor, austrálske vodné športy
    - content: Ako majiteľ malej firmy som mal obavy o MOQs. Paddle Board Overstock pracoval s mojím rozpočtom a pomohol mi spustiť moju značku s len 50 doskami. Teraz objednávam 500.
      name: — Zakladateľ značky, US SUP požičovňa
