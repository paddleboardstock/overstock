hero:
  tagline: Prečo Paddle Board Overstock
  title: Postavené inak. Postavené pre obchod.<br />Partner za vodné dobrodružstvá po celom svete
  subtitle: Nie len výrobca — obchodný partner, ktorý navrhuje, vyvíja a dodáva zariadenia komerčnej kvality pre kluby, rezorty, prevádzky na prenájom a vznikajúce vodné značky.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock výrobná kvalita a odbornosť
pillars:
  tagline: Tri piliere partnerstva
  title: Prečo si svetové vodárenské firmy vyberajú Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Navrhnuté pre komerčné použitie
      description: Naše vybavenie je navrhnuté na každodenný prenájom, nie na víkendovú rekreáciu. Komerčná trieda PVC, spevnené drop-stitch jadra, UV-stabilné Hypalon možnosti a testovaný hardvér znamenajú nižšiu údržbu, dlhšiu životnosť a vyššiu ROI pre vašu prevádzku.
      icon: tabler:building-factory
      callToAction:
        text: Pozrite si komerčnú produktovú radu
        href: /products
    - title: Od nápadu po trh
      description: 'Spustite svoju značku vodných športov za 90 dní. Prevedieme vás každým krokom: overenie konceptu, výber produktu, prototyp, výroba, dizajn balenia a globálna doprava. Bez tlaku na minimálnu objednávku — začnite malí, rozrastajte sa s dôverou.'
      icon: tabler:rocket
      callToAction:
        text: Začnite svoju cestu značky
        href: /oem-odm-blueprint
    - title: Postavené pre globálne podmienky
      description: 'Produkty optimalizované pre každé podnebie: formulácie PVC do studenej vody pre Európu, materiály odolné proti UV pre Blízky východ a Austráliu, protipriesne úpravy pre juhovýchodnú Áziu. Každá zásielka je kalibrovaná podľa cieľového prostredia.'
      icon: tabler:world
