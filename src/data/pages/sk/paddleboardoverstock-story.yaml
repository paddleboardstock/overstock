timeline:
  - year: '2012'
    title: Nadácia pre námornú výrobu
    body: Paddle Board Overstock Začala ako špecializovaná dielňa na nafukovacie vodné plavidlá v Qingdao v Číne, zameraná na námorné remeslo a výrobu nafukovacích člnov. Spočiatku sa zameriavali na vývoj spoľahlivých nafukovacích produktov prostredníctvom praktických inžinierskych skúseností a výrobnej disciplíny.
  - year: '2015'
    title: Prvý export a CE certifikácia
    body: Počiatočné exportné objednávky dorazili do Japonska a Kórey.CE Bola dosiahnutá certifikácia pre kľúčové produktové rady, čo znamenalo Paddle Board Overstockvstup spoločnosti na medzinárodné trhy. Spoločnosť začala poskytovať služby komerčným a rekreačným používateľom mimo Číny.
  - year: '2018'
    title: Rozšírenie továrne
    body: Presťahovali sa do výrobného závodu s rozlohou 12 000 m². Pridali RF zváracie linky a drop-stitch výrobné kapacity, čo umožnilo väčšiu výrobu a zlepšené systémy kontroly kvality.
  - year: '2020'
    title: Založenie výskumného a vývojového centra
    body: Otvorili špecializované výskumné a vývojové centrum s PVC laboratóriom na textil, hydrodynamickou testovacou nádržou a CAD/FEA simulačným štúdiom. Vývoj produktov sa rozšíril o zameranie na ľahkú konštrukciu, lepšiu odolnosť a dizajn zameraný na používateľa.
  - year: '2022'
    title: Certifikácia a globálny rast
    body: Získali ISO certifikáciu 9001. Rozšírili sa na 14 výskumných a vývojových inžinierov a 200+ pracovníkov. Produkty sa dostali k zákazníkom po celej Európe, Amerike a Ázii a Pacifiku prostredníctvom distribútorov a OEM partnerstiev.
  - year: '2024'
    title: Inovačné a dizajnérske štúdio
    body: Spustili kompletné štúdio dizajnu a inovácií pre ODM vlastné projekty, od konceptu až po výrobu. Posilnili profesionálne námorné aplikácie vrátane záchrany, komerčných a vládnych tendrov.
  - year: '2026'
    title: Budovanie budúcnosti prieskumu vody
    body: Dnes Paddle Board Overstock pokračuje vo vývoji nafukovacích člnov SUP , systémov a prispôsobených námorných riešení — spájajúcich ľudí a organizácie s vodami sveta.+ Obsluhovalo 50 krajín, kapacita 15 000 jednotiek ročne.
content_founding:
  tagline: Začiatky
  title: Narodený na nábreží
  subtitle: 'Paddle Board Overstock začal v pobrežnej dielni v Qingdao s jednou loďou a víziou: postaviť nafukovacie plavidlá, ktoré zvládnu skutočné morské podmienky.'
  paragraphs:
    - V roku 2012 naši zakladatelia videli medzeru na trhu — väčšina nafukovacích člnov bola buď cenovo dostupná, ale nespoľahlivá, alebo kvalitná, ale neúnosne drahá. Verili, že je priestor pre výrobcu, ktorý dodáva kvalitu aj hodnotu.
    - Prvý trup bol postavený ručne, testovaný v miestnych vodách a zdokonaľovaný na základe skutočnej spätnej väzby od rybárov a malých komerčných prevádzkovateľov. Táto spätná väzba — stavať, testovať, počúvať, zlepšovať — zostáva jadrom našej inžinierskej filozofie dodnes.
    - Do roku 2015 sa správa rozšírila aj mimo Qingdao. Medzinárodní distribútori začali žiadať vzorky. To, čo začalo ako miestna dielňa, sa stalo globálnym dodávateľom.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Raná výrobná dielňa a výroba
content_growth:
  tagline: Rast a inovácie
  title: Z dielne na 12 000 m² Zariadenie
  subtitle: Neustále investovanie do ľudí, zariadení a procesov sa premenilo Paddle Board Overstock na moderné námorné výrobné zariadenie.
  paragraphs:
    - S rastúcim dopytom rástla aj naša prevádzka. Rozšírili sme sa z malej dielne na továreň s rozlohou 12 000 m² s vyhradenými výrobnými linkami pre RIB lode, nafukovacie člny, SUP dosky a príslušenstvo.
    - Investovali sme do CNC rezných strojov, zariadení na vysokofrekvenčné zváranie, výrobných liniek drop stitch a komplexných testovacích zariadení — čo nám umožňuje kontrolovať každý aspekt kvality výroby.
    - Dnes náš tím 200-300 ľudí zahŕňa námorných inžinierov, materiálových vedcov, špecialistov na kontrolu kvality a zručných remeselníkov — mnohí z nich sú tu Paddle Board Overstock už od začiatkov.
founder:
  tagline: Zoznámte sa so zakladateľom
  title: Postavené vodníkom
  subtitle: Zakladateľ David Chen spája odborné znalosti výroby a celoživotnú vášeň pre vodné športy — kombináciu, ktorá definuje Paddle Board Overstock prístup k vývoju produktov.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Zakladateľ Paddle Board Overstock
  story:
    - David Chen vyrastal na pobreží Qingdao, kde more nebolo dovolenkovou destináciou, ale spôsobom života. Mladosť strávil kajakovaním, plachtením a rybolovom v Žltom mori — skúsenosti, ktoré mu dali intuitívne pochopenie toho, čo musia vodné plavidlá vydržať.
    - Pred založením Paddle Board OverstockDavid strávil desať rokov v námornej výrobe, kde pracoval v oblasti výroby, kvality a medzinárodného obchodu. Riadil OEM programy pre európske a severoamerické značky, pričom sa na vlastnej koži učil štandardy a očakávania globálnych trhov.
    - 'V roku 2012 založil Paddle Board Overstock s jednoduchou misiou: postaviť nafukovacie vodné plavidlá, ktorým by dôveroval svojej vlastnej rodine na vode. Tento osobný štandard — použil by som to? — zostáva posledným testom pre každý produkt, ktorý opustí továreň.'
    - Dnes David vedie produktovú stratégiu a dohliada na tím výskumu a vývoja, osobne hodnotí nové návrhy a testuje prototypy na vodách pri Qingdao. Verí, že skvelé produkty vznikajú z pochopenia inžinierstva aj skúseností.
philosophy:
  tagline: Filozofia značky
  title: Inžinierska sloboda na vode
  body: Sloboda na vode nie je len o pohybe. Predstavuje objavovanie nových miest, vytváranie vonkajších zážitkov, spájanie ľudí s prírodou a umožňovanie profesionálnych misií. Inžinierstvo túto slobodu umožňuje.
  pillars:
    - title: Spoľahlivosť na prvom mieste
      body: Vodné prostredia si vyžadujú dôveru.Paddle Board Overstock Produkty sú navrhnuté s cieľom stability, odolnosti, bezpečnosti a konzistentného výkonu.
    - title: Dizajn zameraný na človeka
      body: Produkty by mali slúžiť ľuďom, nie technológiám. Každé rozhodnutie v dizajne začína pochopením, ako ľudia používajú vodné plavidlá, kde skúmajú a aké výzvy čelia.
    - title: Prístupný prieskum
      body: Voda by nemala patriť len odborníkom.Paddle Board Overstock Vytvára zariadenia, ktoré umožňujú väčšiemu počtu ľudí bezpečne zažiť rieky, jazerá, oceány a pobrežné prostredie.
    - title: Neustála inovácia
      body: Inovácia nie je len vytváranie nových produktov. Zlepšuje každý detail — materiály, konštrukcie, výrobu a používateľský zážitok.
engineeringDna:
  tagline: Inžinierska DNA
  title: Ako Paddle Board Overstock vytvára produkty
  areas:
    - title: Materiálová veda
      body: Paddle Board Overstock sa zameriava na výber vhodných materiálov pre rôzne morské prostredia. Kľúčové faktory zahŕňajú odolnosť voči oderu, UV odolnosť, stabilitu pri tlaku a dlhodobú trvácnosť.
      items:
        - Odolnosť voči oderu
        - Odolnosť UV
        - Stabilita pri tlaku
        - Dlhodobá trvácnosť
    - title: Konštrukčné inžinierstvo
      body: Nafukovacie vodné plavidlá vyžadujú presnú rovnováhu medzi tuhosťou, hmotnosťou, prenosnosťou a stabilitou. Paddle Board Overstock inžinierstvo sa zameriava na optimalizáciu týchto faktorov prostredníctvom drop-stitch jadrovej technológie a pokročilej konštrukcie švov.
      items:
        - Tuhosť
        - Optimalizácia hmotnosti
        - Prenosnosť
        - Stabilita
    - title: Presnosť výroby
      body: 'Každý produkt prechádza kontrolovanými procesmi: príprava materiálu, presné rezanie, zváranie a lepenie, montáž, kontrola kvality a overenie výkonu.'
      items:
        - Príprava materiálu
        - Presné rezanie
        - Zváranie a lepenie
        - Montáž a kontrola kvality
    - title: Inžinierstvo používateľských scenárov
      body: Produkty sú vyvíjané s ohľadom na reálne použitie — rekreácia, dobrodružstvo a profesionálne použitie — čo zabezpečuje, že každý dizajn spĺňa konkrétne požiadavky svojho zamýšľaného prostredia.
      items:
        - Rekreácia
        - Dobrodružstvo
        - Professional
        - Komerčné použitie
trustSignals:
  tagline: Signály dôvery
  title: Prečo je Paddle Board Overstock spoľahlivým partnerom
  manufacturing:
    title: Výrobné kapacity
    body: Výrobné zariadenie o rozlohe 12 000 m² so 200-300 kvalifikovanými pracovníkmi a 14+ vývojovými inžiniermi. ISO 9001 certifikovaný systém riadenia kvality. Ročná produkcia 15 000 nafukovacích vodných plavidiel, ktoré slúžia 50+ krajinám.
    stats:
      - label: Veľkosť zariadenia
        value: 12,000 m²
      - label: Pracovná sila
        value: 200-300
      - label: Inžinieri výskumu a vývoja
        value: 14+
      - label: Ročná kapacita
        value: 15,000
  quality:
    title: Záväzok ku kvalite
    body: Od kontroly materiálu až po záverečné testovanie, Paddle Board Overstock udržiava systematické procesy kvality, aby dodával spoľahlivé námorné produkty. Každá jednotka prechádza tlakovým testovaním, kontrolou švov a overením výkonu pred odoslaním.
    items:
      - CE Certifikované — 64 modelov spĺňa európske bezpečnostné normy
      - ISO 9001:2015 — Certifikovaný systém manažérstva kvality
      - UKCA Označené — súlad s trhom VK
  global:
    title: Globálna prítomnosť
    body: Paddle Board Overstock slúži zákazníkom na viacerých svetových trhoch, podporuje distribútorov, značky pre outdoor a profesionálnych používateľov v námornom sektore v 50+ krajinách v Európe, Ázii a Pacifiku, Amerike, na Blízkom východe a v Afrike.
