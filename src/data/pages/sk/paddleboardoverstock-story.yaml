hero:
  tagline: Náš príbeh
  title: Paddle Board Overstock — Inžinierska sloboda vo vode
  subtitle: 'Od pobrežnej dielne po globálneho výrobcu lodí — naša cesta je postavená na tvrdohlavom presvedčení: plavidlá by mali byť navrhnuté tak, aby mali záležať, pretože naozaj záleží.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock továreň a námorný výrobný závod v Qingdao
