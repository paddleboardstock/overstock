breadcrumb: OEM/ODM Výrobca
tldr:
  summary: Aquafarer je priamy výrobca OEM/ODM z továrne. 12 000 m² ISO zariadenie certifikované podľa ISO 9001:2015, ročná produkcia 15 000 jednotiek, zhoda s CE/BSCI/REACH/UKCA, nízky MOQs od 2-10 jednotiek.
  points:
    - 12 000 m² ISO zariadenie certifikované podľa ISO 9001:2015 v Qingdaou
    - Ročná kapacita 15 000 jednotiek s 200–300 kvalifikovanými pracovníkmi
    - CE zhoda s 2013/53/EU, UKCA, BSCI, REACH
    - 'Nízky MOQs: 2-5 jednotiek (RIB), 5-10 jednotiek (SUP) pre štandardné modely'
    - 50+ krajín exportu s FOB prepravou z Qingdao
trust_badges:
  badges:
    - icon: ⭐
      title: ISO Certifikované podľa ISO 9001:2015
      desc: Kvalitný manažérsky systém audítovaný SGS vo všetkých výrobných linkách.
      variant: cert
    - icon: ⭐
      title: Zhodné s CE a UKCA
      desc: Úplná zhoda s požiadavkami EÚ 2013/53/EU a označením Spojeného kráľovstva.
      variant: cert
    - icon: ⭐
      title: BSCI Sociálny audit
      desc: Overené etické pracovné postupy a štandardy na pracovisku.
      variant: standard
    - icon: ⭐
      title: Nízky MOQ od 2 jednotiek
      desc: 'Štandardné RIB modely od 2-5 jednotiek, SUP od 5-10 jednotiek. Vlastná forma: 200+.'
      variant: standard
process_section:
  eyebrow: Náš proces
  title: Kompletný OEM/ODM pracovný postup
  subtitle: Od návrhu až po nakládku kontajnera – šesť krokov k vašim nafukovacím vodným plavidlám s vlastnou značkou.
  steps:
    - step: '01'
      title: Špecifikácia a návrhový bríf
      desc: Zdieľajte svoje cieľové špecifikácie, CAD výkresy alebo referenčný výrobok. Náš tím inžinierov skontroluje materiály, rozmery a požiadavky na súlad (CE, BSCI) pred ponukou.
    - step: '02'
      title: 3D prototypovanie formy
      desc: Navrhujeme a CNC opracovávame vlastné formy pre SUP dosky, kajakové trupy a RIB komponenty. Prototypové vzorky vyrobené do 15–20 pracovných dní pre vaše schválenie.
    - step: '03'
      title: Výber materiálu a výroba vzoriek
      desc: Vyberte si z vojenského materiálu PVC (0,9 mm–1,2 mm), Hypalon CSM alebo drop-stitch jadrových tkanín. Vyrobíme predvýrobné vzorky s vašimi farbami značky, logom a obalom na schválenie.
    - step: '04'
      title: CE Audit továrne a zhoda
      desc: Každá objednávka OEM obsahuje dokumentáciu o zhode — CE vyhlásenie o zhode, ISO záznamy o sledovateľnosti podľa ISO 9001, BSCI správa o sociálnej zhode a REACH vyhlásenia o materiáloch.
    - step: '05'
      title: Hromadná výroba a online kontrola kvality
      desc: Výroba prebieha podľa nášho 100-bodového kontrolného zoznamu kvality. Každá jednotka prechádza 24-hodinovým testom udržania tlaku, testom odtrhnutia švov a vizuálnou kontrolou pred balením.
    - step: '06'
      title: FOB Logistika a preprava z Qingdao
      desc: Hotové výrobky sú paletizované, zmršťované fóliou a nakladané do kontajnera v prístave Qingdao. Zaobchádzame so všetkou exportnou dokumentáciou, colným odbavením a poskytujeme sledovanie zásielky v reálnom čase.
capabilities_section:
  eyebrow: Výrobné kapacity
  title: Čo budujeme
  subtitle: Šesť kľúčových výrobných schopností pre B2B globálnych partnerov.
  items:
    - title: Drop-Stitch SUP Výroba dosiek
      desc: Laminácia jadra po celej dĺžke drop-stitch pre pevné, vysokotlakové (15–20PSI) stojace paddle boardy. Vlastná dĺžka, šírka, hrúbka, profil rockera a grafický dizajn.
    - title: PVC Výroba nafukovacích člnov
      desc: PVC Vysokofrekvenčné zvárané člny, zásobovacie člny a športové člny. Viackomorové konfigurácie, možnosti podlahy (lamelové, vzdušné paluby, roll-up) a integrácia príslušenstva.
    - title: Hypalon RIB Výroba lodí
      desc: Hypalon CSM Komerčné rúry pripevnené na laminátové alebo hliníkové hlboké V trupy. Dĺžky 3,3 m až 6,0 m pre hliadkovanie, záchranu, turné a potápačské operácie.
    - title: Privátna značka a vlastná značka
      desc: 'Plná služba privátnej značky: vlastný prenos loga alebo sieťotlač, značkové balenie (maloobchodné krabice, tašky), používateľské príručky vo vašom jazyku a čiarový kód/UPCregistrácia.'
    - title: Návrh vlastných foriem a nástrojov
      desc: Interný 3D CAD/CAM inžiniersky tím. Navrhujeme a vyrábame vlastné hliníkové a kompozitné formy pre jedinečné tvary trupu, konfigurácie paluby a montážne body príslušenstva.
    - title: OEM Doplnky a vybavenie
      desc: Záchranné vesty (CE12402), dvojčinné pumpy, karbónovo/nylonové páčky, opravárenské sady, tašky na prenášanie a zostavy vodítka. Kompletné vybavenie a balenie pre prezentáciu pripravenú na predaj.
experience_section:
  eyebrow: Skúsenosti z reálneho sveta
  title: Partnerstvá, ktoré budovali značky
  subtitle: Skutočné príbehy od značiek a organizácií, ktoré spolupracovali Aquafarer s OEMODM výrobou.
  stories:
    - quote: Prebrali Aquafarer sme sa s náčrtom na servítke a zoznamom požiadaviek. Osem mesiacov neskôr sme mali produkt pripravený na produkciu, ktorý na CE prvý pokus prešiel certifikáciou.
      narrative: Európsky startup s SUP novým dizajnom pristúpil Aquafarer k ODM výrobe. Aquafarer Tím výskumu a vývoja previedol koncept cez CAD dizajn, FEA štrukturálnu analýzu, hydrodynamickú simuláciu, tvorbu foriem, výrobu prototypov a výrobné nástroje. Zakladateľ startupu navštívil Qingdao trikrát počas procesu. Finálny produkt prešiel CE certifikáciou bez akýchkoľvek úprav — výsledok, ktorý zakladateľ pripisuje tomu, že Aquafarerinžiniersky tím od začiatku rozumie európskym regulačným požiadavkám.
      context: SUP Európske uvedenie značky, 2023-2024
      source: Brand Founder
    - quote: Úroveň NDA ochrany a bezpečnosti duševného vlastníctva Aquafarer nám dáva istotu zdieľať naše proprietárne návrhy. Zaobchádzajú s naším duševným vlastníctvom, akoby bolo ich vlastné.
      narrative: Americká spoločnosť vyrábajúca námorné vybavenie s proprietárnou technológiou ventilov potrebovala výrobného partnera, ktorý by dokázal chrániť ich duševné vlastníctvo pri výrobe vo veľkom rozsahu. Po audite piatich čínskych výrobcov vybrali Aquafarer na základe protokolov na ochranu duševného vlastníctva továrne, bezpečného spracovania návrhových súborov a ochoty podpísať prísne NDA. Partnerstvo vyrobilo tri produktové rady za štyri roky bez akýchkoľvek incidentov s duševným vlastníctvom.
      context: Americká spoločnosť s námorným vybavením, OEM partnerstvo od roku 2021
      source: Viceprezident pre operácie
