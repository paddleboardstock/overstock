testimonial:
  content: Požičiaval som si 5 dosiek z miestneho obchodu a 60 % svojho príjmu som im odovzdával. Paddle Board Overstock mi pomohol vybudovať vlastnú flotilu 15 SUPs. Kalkulačka ROI, ktorú poskytli, ukázala, že sa mi investícia vráti za 4 mesiace — skutočne to trvalo 3. Teraz rozširujem na 30 dosiek a pridávam kajaky.
  name: Daniel Okonkwo
  title: Majiteľ, Lakeland SUP Prenájmy — Ontario, Kanada
content_segments:
  tagline: Prenájom profily
  title: Riešenia prenájmu vodných športov<br />Podľa typu operátora
  subtitle: Rôzne prenájmy majú rôzne potreby — od malých plážových SUP prenájmov po veľké strediská s vodnými športami. Naše balíčky vybavenia a model podpory prispôsobujeme podľa toho.
  items:
    - title: Prenájmy pri pláži a pri jazere SUP
      subtitle: Operácie s vysokým objemom a nízkou komplexnosťou
      description: Prevádzkovatelia prenajímajúce paddleboardy a kajaky priamo návštevníkom pláží a jazier. Vašou prioritou je minimalizovať čas medzi prenájmami, udržiavať vybavenie v obehu a zvládať sezónne nárasty dopytu pri malom priestore na uskladnenie.
      features:
        - Nafukovacie flotily SUP, ktoré sa dajú zložiť — nie je potrebný prístav ani príves
        - Komerčne kvalitný PVC s hodnotením pre 100+ prenájomných cyklov za sezónu
        - Rýchloschnúca, UV odolná tkanina pripravená na opätovné prenajatie v ten istý deň
        - Farebne označené rozsahy tabúľ pre ľahkú identifikáciu flotily
    - title: Centrá vodných športov v rezortoch a hoteloch
      subtitle: Skúsenosť hostí a zosúladenie s značkou
      description: Ostrovné rezorty a hotely ponúkajúce vodné športy ako vybavenie priamo na mieste. Zariadenie musí pôsobiť prémiovo, spoľahlivo slúžiť pre hostí od začiatočníkov po stredne pokročilých a integrovať sa do existujúcich procesov rezortu pre rezerváciu a účtovanie aktivít.
      features:
        - Výrobky na mieru s logom SUP a záchranné vesty v farbách rezortu
        - 'Miešaná flotila: SUPs, kajaky, šliapacie člny a malé prístavné člny RIB'
        - Tiché riešenia nafukovania bez paliva pre použitie na pláži
        - Školenie personálu a zaškolenie ohľadom údržby zahrnuté
    - title: Prevádzkovatelia požičovní lodí a RIB
      subtitle: Flotily lodí komerčnej kvality
      description: Prevádzkovatelia požičovní motorových plavidiel — RIB prístavné člny, nafukovacie čluny a malé motorové člny — na hodinu alebo pol dňa. Vaša flotila musí spĺňať predpisy pre bezpečnosť na mori, odolávať intenzívnemu používaniu hosťami a minimalizovať prestoje medzi prenájmami.
      features:
        - Balíčky RIB s 30–90 HP pripravenými pre vonkajší motor
        - Podlahové panely z námornej preglejky pre dlhodobú konštrukčnú integritu
        - Rýchlosystémy ventilov pre rýchlejšie prepínanie
        - Sada náhradných dielov + technická podpora podľa SLA
    - title: Prevádzkovatelia zážitkov a dobrodružných túr
      subtitle: Flotily pre vedené exkurzie
      description: Prevádzkovatelia vedúcich vodných športových túr — SUP safari, kajakovanie v jaskyniach, šnorchlovacie výlety alebo ostrovné túry RIB. Zariadenie musí byť dostatočne stabilné pre hostí začiatočníkov, rýchlo sa čistiť medzi skupinami a byť odolné pre každodenné použitie v rôznych vodných podmienkach.
      features:
        - Extra stabilné platformy SUP (široké 32" +) pre prvých jazdcov
        - Možnosti tandemových kajakov pre párové/skupinové túry
        - Vstavaná kapacita pre šnorchlovacie vybavenie, vodotesné tašky a chladiace boxy
        - CE + USCG dokumentácia o súlade s predpismi pre komerčnú prevádzku
