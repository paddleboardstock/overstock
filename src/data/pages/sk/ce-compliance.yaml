content_scope:
  tagline: Rozsah súladu
  title: Ktoré produkty potrebujú<br />RCD súlad?
  subtitle: Smernica o rekreačných plavidlách 2013/53/EÚ sa vzťahuje na rekreačné plavidlá s dĺžkou trupu medzi 2,5 m a 24 m. Pochopenie rozsahu je prvým krokom k súladu.
  items:
    - title: RIB Lode (2,5–24 m)
      description: Pevné nafukovacie lode s dĺžkou trupu od 2,5 m do 24 m podliehajú RCD. Platí kategórie návrhu A až D v závislosti od predpokladaných podmienok na mori a maximálnej sily vetra.
      icon: tabler:sailboat
    - title: Nafukovacie lode (pod 2,5 m)
      description: Malé nafukovacie lode a člny pod 2,5 m môžu byť čiastočne oslobodené od RCD, ale stále vyžadujú CE označenie podľa iných platných smerníc a konštrukčných noriem EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Dosky a príslušenstvo
      description: Stand-up paddle boardy sú mimo rozsahu RCD. Avšak príslušné osobné plávacie prostriedky (PFD) vyžadujú CE označenie podľa Nariadenia o OOP (EÚ) 2016/425 s typovým schválením III/V, ak je to relevantné.
      icon: tabler:swimming
    - title: Čiastočne dokončené lode
      description: Lode dodané bez motora alebo špecifických inštalácií vyžadujú Vyhlásenie staviteľa pre čiastočne dokončené plavidlá, pričom úplný RCD súlad je zabezpečený konečným staviteľom alebo dovozcom.
      icon: tabler:tool
content_trust_layers:
  tagline: Trojnásobný systém dôvery
  title: Informácie o súlade<br />— Zdieľané na správnej úrovni
  subtitle: Nie všetky údaje o súlade patria na verejnú webovú stránku. Dodržiavame trojvrstvový prístup, ktorý chráni duševné vlastníctvo a zároveň buduje dôveru kupujúcich.
  items:
    - title: Vrstva 1 — Verejná webová stránka
      description: Odkazované štandardy, vysvetlené spôsoby zhody, uvedené typy dokumentov, rozsah certifikácie podľa rodiny modelov. Žiadne skutočné certifikáty, testovacie údaje ani proprietárne inžinierske údaje.
      icon: tabler:world
    - title: Vrstva 2 — Zdieľanie po dotaze
      description: 'Po kvalifikovanom prieskume: redigovaná vzorka DoC, fotografia štítku výrobcu, zoznam platných noriem, kontrolný zoznam súladu a súhrny certifikátov materiálov — zdieľané za podmienok spravodlivého použitia.'
      icon: tabler:mail
    - title: Vrstva 3 — NDA / Fáza objednávky
      description: Úplný technický súbor, hodnotenia rizík, výpočty stability, testovacie správy, záznamy o šaržiach materiálov a dokumentácia sledovateľnosti výroby — zdieľané iba pod NDA s potvrdenými kupujúcimi.
      icon: tabler:lock
content_standards:
  tagline: Použiteľné normy
  title: ISO & EN normy<br />Staviame Na
  subtitle: Naše produkty sú navrhnuté a testované podľa harmonizovaných noriem podľa RCD. Čísla a názvy noriem sú uvedené; úplné texty noriem zostávajú ISO chránené autorskými právami.
  items:
    - title: EN ISO 6185-3
      description: 'Nafukovacie lode — Časť 3: Lode s maximálnym výkonom motora 15 kW alebo viac. Požiadavky na konštrukciu, stabilitu, vztlak a záchranu osoby za palubu pre RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Nafukovacie člny — Časť 4: Člny s maximálnym výkonom motora 15 kW a väčším alebo rovnajúcim sa 4,5 kW. Dodatočné konštrukčné a stabilitné požiadavky.'
      icon: tabler:file-text
    - title: ISO 12215 Séria
      description: Malé plavidlo — Konštrukcia trupu a rozmery. Konštrukčné riešenie trupu, paluby a priečok pre sklolaminátové a hliníkové RIB trupové časti.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Malé plavidlá — Návod pre majiteľa. Povinný obsah a formát návodu pre majiteľa, ktorý sa dodáva s každou RIB loďou dodanou v EÚ.
      icon: tabler:book
    - title: SK ISO 14945
      description: Malá plavidlo — Štítok výrobcu. Informácie, ktoré majú byť trvalo označené na štítku výrobcu pripevnenom na každé plavidlo.
      icon: tabler:badge
    - title: ISO 8666
      description: Malé plavidlo — Hlavné údaje. Štandardizované merania a parametre pre konzistentné špecifikovanie vo všetkej produktovej dokumentácii.
      icon: tabler:dimensions
content_process:
  tagline: Proces súladu
  title: 6-kroková CE zhoda<br />Pracovný tok
  subtitle: Od rozsahu projektu po sledovateľnosť na úrovni sériovej výroby — každý RIB model nasleduje definovanú cestu zhody.
  steps:
    - number: '01'
      title: Rozsah a klasifikácia projektu
      description: Definujte model RIB, kategóriu návrhu (A/B/C/D), maximálny počet osôb, nosnosť, výkon motora a cieľový trh. Určte, či sa uplatňuje RCD a ktorý modul overovania zhody je potrebný.
      timeline: 2–3 dni
    - number: '02'
      title: Identifikácia platných požiadaviek
      description: Identifikujte všetky príslušné základné bezpečnostné požiadavky z prílohy I RCD, relevantné harmonizované normy (EN ISO 6185, 12215, 10240, 14945) a akékoľvek ďalšie národné požiadavky pre cieľový trh.
      timeline: 3–5 dni
    - number: '03'
      title: Dizajn a technická dokumentácia
      description: 'Vytvorte Hlavný technický súbor: výkresy všeobecného usporiadania, výpočty stability a vztlaku, hodnotenie rizík, špecifikácie materiálov a analýzu bezpečnosti systémov (palivo, elektrika, riadenie).'
      timeline: 10–15 dni
    - number: '04'
      title: Overovanie a testovanie produktu
      description: Vykonajte fyzické overovanie — tlakové testy pri 1,25x menovitom tlaku počas 24–48 hodín, testy stability a vztlaku, zaťažovacie skúšky a uvádzanie systémov do prevádzky. Zaznamenajte všetky výsledky testov pre jednotlivé trupy.
      timeline: 5–7 dni
    - number: '05'
      title: Označovanie a dokumentácia dodania
      description: Priložte označenie CE, výrobné tabuľky (EN ISO 14945) a HIN/CIN (identifikačné číslo trupu). Pripravte EU deklaráciu zhody, manuál pre majiteľa (EN ISO 10240) a kontrolný zoznam zhody.
      timeline: 2–3 dni
    - number: '06'
      title: Sledovateľnosť na úrovni sérií
      description: Každý trup bude mať jedinečný Hull Record, ktorý ho viaže s Hlavným technickým súborom, výrobnou sériou, certifikátmi materiálov, výsledkami testov a konečnou konfiguráciou. Záznamy sa uchovávajú po dobu 10+ rokov podľa RCD.
      timeline: Prebiehajúce
content_document_cards:
  tagline: Typy dokumentov
  title: Dokument vyhovujúci požiadavkám<br />Karty
  subtitle: Toto sú typy dokumentov, ktoré pripravujeme a udržiavame pre každý model RIB certifikovaný CE. Vzorky sú k dispozícii na kvalifikovanú žiadosť.
  items:
    - title: CE / RCD Certifikát zhody
      description: Certifikát špecifický pre model, potvrdzujúci, že plavidlo spĺňa všetky platné základné bezpečnostné požiadavky RCD 2013/53/EÚ, vydaný výrobcom s participáciou Notifikovaného orgánu, kde je to potrebné.
      icon: tabler:certificate
    - title: EU deklarácia zhody (DoC)
      description: Podpísaná deklarácia výrobcu alebo autorizovaného zástupcu, uvádzajúca príslušné smernice, normy, modul zhody a údaje o Notifikovanom orgáne. Vyžaduje sa pre každý model uvádzaný na trh EÚ.
      icon: tabler:file-check
    - title: Výrobné tabuľky (EN ISO 14945)
      description: Trvalo pripevnená tabuľka zobrazujúca maximálny počet osôb, maximálny výkon motora, kategóriu návrhu a identifikáciu výrobcu. Musí zostať čitateľná počas celej životnosti plavidla.
      icon: tabler:badge
    - title: Manuál pre majiteľa (EN ISO 10240)
      description: Komplexný manuál pokrývajúci bezpečnú prevádzku, núdzové postupy, harmonogramy údržby a bezpečnostné upozornenia. Povinný pre každý RIB dodaný do EÚ.
      icon: tabler:book
    - title: ISO Testovacie a kontrolné správy
      description: Záznamy tlakových testov (1,25x / 24–48 h), výsledky testov stability a vztlaku, certifikáty skúšok materiálov a správy o rozmerovej verifikácii — všetko prepojené s konkrétnymi číslami trupov.
      icon: tabler:test-pipe
    - title: Záznamy o sledovateľnosti materiálu
      description: Sledovateľnosť na úrovni šarže pre tkaninu trubiek, lepidlá, sklolaminát a hardvér. Prepojuje každú výrobnu jednotku s certifikátmi vstupného materiálu a výsledkami kontroly IQC.
      icon: tabler:link
    - title: Záznamy o kontrole kvality a QC
      description: Kontrolný zoznam kvality s 100 bodmi na jednotku, priebežné záznamy QC, správy o nezrovnalostiach a nápravné opatrenia. Súčasť výrobného reťazca sledovateľnosti.
      icon: tabler:clipboard-check
    - title: Dokumentačný balík projektu
      description: Dokumentačný balík na každú konštrukciu vrátane konečného záznamu o konfigurácii, podrobností o inštalácii motora a vybavenia, kontrolného zoznamu uvádzania do prevádzky a dokumentácie o dodaní.
      icon: tabler:package
content_design_categories:
  tagline: RCD Kategórie návrhu
  title: Kategória návrhu A–D<br />— Čo znamenajú
  subtitle: RCD prideľuje kategórie návrhu na základe maximálnej sily vetra a významnej výšky vĺn, ktorej má plavidlo odolávať.
  items:
    - title: Kategória A — Oceán
      description: Navrhnuté pre dlhé plavby, kde môže sila vetra presiahnuť Beaufort 8 (>40 uzlov) a významná výška vĺn môže presiahnuť 4 m. Vyžaduje najprísnejšie overenie konštrukcie a stability.
      icon: tabler:ripple
    - title: Kategória B — Offshore
      description: Navrhnuté pre offshore plavby so silou vetra do Beaufort 8 (≤40 uzlov) a významnou výškou vĺn do 4 m. Vhodné pre pobrežné a polootvorená vody.
      icon: tabler:anchor
    - title: Kategória C — Pri pobreží
      description: Navrhnuté pre pobrežné plavby so silou vetra do Beaufort 6 (≤27 uzlov) a významnou výškou vĺn do 2 m. Väčšina rekreačných RIBs patrí do tejto kategórie.
      icon: tabler:sun
    - title: Kategória D — Chránené
      description: Navrhnuté pre chránené vody so silou vetra do Beaufort 4 (≤16 uzlov) a významnou výškou vĺn do 0,3 m. Jazerá, rieky a chránene prístavy.
      icon: tabler:pool
content_hin:
  tagline: Identifikácia plavidla
  title: HIN / CIN a výrobná značka
  subtitle: Každá RIB loď vyžaduje číslo identifikácie trupu (HIN) alebo číslo identifikácie plavidla (CIN) a výrobnú značku podľa EN ISO 14945 a požiadaviek RCD.
  items:
    - title: Číslo identifikácie trupu (HIN)
      description: Jedinečný 14-znakový kód trvalo označený na pravoboku trupu, ktorý kóduje výrobcu (MIC), rok modelu, rok výroby a sériové číslo. Povinné pre vstup na trh EÚ.
      icon: tabler:hash
    - title: Číslo identifikácie plavidla (CIN)
      description: Podľa EN ISO 10087, skryté sekundárne identifikačné číslo umiestnené na skrytom mieste z dôvodu protikradskej ochrany a sledovateľnosti.
      icon: tabler:eye-off
    - title: Obsah výrobnej značky
      description: Maximálny počet osôb, maximálny výkon motora (kW), maximálna hmotnosť nákladu (kg), kategória návrhu, meno výrobcu a označenie CE — všetko trvalo zobrazené na doske odolnej proti korózii.
      icon: tabler:badge
content_tech_file:
  tagline: Štruktúra technického súboru
  title: Hlavný technický súbor<br />& Záznam o trupe
  subtitle: 'Náš dokumentačný systém má dvojúrovňovú štruktúru: hlavný technický súbor pre každú modelovú rodinu a individuálne trupové záznamy pre každú vyrobenú loď.'
  items:
    - title: Hlavný technický súbor
      description: 'Obsahuje kompletnú dokumentáciu o súlade pre modelovú rodinu: všeobecné usporiadanie, hodnotenie rizík, výpočty stability/vztlaku, materiálové špecifikácie, platné normy a záznamy o hodnotení zhody. Uchovávané 10+ rokov.'
      icon: tabler:folder
    - title: Záznam trupu (sledovateľnosť na každej lodi)
      description: 'Každý trup má jedinečný záznam, ktorý ho spája s hlavným technickým súborom: HIN, dátum výroby, šarža rúry, materiálové certifikáty, výsledok tlakovej skúšky, konečná konfigurácia, inštalácia motora a miesto dodania.'
      icon: tabler:file-description
    - title: Balík pre dodržiavanie predpisov pre zákazníka
      description: Balík pre každý trup vrátane DoC, fotografie výrobcu, príručky majiteľa, súhrnu testu a finálneho konfiguračného listu — dodávaný ku každému RIB zaslanému do EÚ.
      icon: tabler:package
content_material_cert:
  tagline: Certifikácia materiálov
  title: Sledovateľnosť materiálu &<br />Dôkazy o certifikácii
  subtitle: RIB Kvalitné lode začínajú kontrolovanými materiálmi a zdokumentovanými procesmi. Nižšie je uvedené, ako organizujeme certifikáciu materiálov pre každú skupinu kritických komponentov.
  items:
    - title: Sledovateľnosť materiálu nafukovacích trubiek
      description: PVC CSMHypalon a/materiály trubiek sú vyberané podľa zamýšľaného použitia, klimatických podmienok a cieľového trhu. Technické údaje dodávateľa (TDS), informácie o šarži materiálu, sledovateľnosť šarží UV a správy z testov zvetrania, ako aj REACH/SVHC deklarácie sú dostupné v rámci dohodnutého rozsahu dokumentácie projektu.
      icon: tabler:circle
    - title: Sledovateľnosť námorného hliníka
      description: Pri projektoch s hliníkovým trupom RIB sa podľa schválenej špecifikácie kontrolujú kvalita zliatiny, hrúbka a dávkové dávky materiálov. Certifikáty o testovaní materiálov (MTC/MTR), EN 10204 3.1 dokumentácia, správy o chemickom zložení a mechanických vlastnostiach a sledovateľnosť tepla/šarže sú poskytované tam, kde je dohodnuté.
      icon: tabler:rectangle
    - title: Riadenie materiálu a procesu GRP trupu
      description: Pre trup zo sklených RIBsvlákien sa gelcoat, živica, sklené výstuže a jadrové materiály spravujú podľa kontrolovaných špecifikácií. Materiály TDS/SDS, záznamy o šaržiach, špecifikáciách laminátov a záznamy o vytvrdzovaní a kontrole dielní sú dostupné na základe dohody o projekte.
      icon: tabler:layers-subtract
    - title: Podpora dokumentácie komponentov
      description: Pre vybrané komponenty — vrátane EVA materiálov na palubu, sedadiel, nerezového hardvéru, palivových systémov, elektrického vybavenia a námorných doplnkov — sa koordinuje relevantná dokumentácia dodávateľa na základe konečnej konfigurácie a požiadaviek cieľového trhu.
      icon: tabler:package
    - title: Oznámenie o rozsahu súladu
      description: Certifikáty, testovacie správy a dokumenty o súlade sa vzťahujú iba na konkrétny produktový model, materiál, komponent, výrobnú dávku alebo rozsah projektu uvedený v príslušnom dokumente. Kontaktujte nás so svojím cieľovým trhom, zamýšľaným použitím a technickými požiadavkami, aby bolo možné overiť príslušný balík dokumentácie pred zadaním objednávky.
      icon: tabler:info-circle
faq:
  title: CE Súlad — Často kladené otázky
  questions:
    - q: Sú všetky Aquafarer RIB lode CE certifikované pre trh EÚ?
      a: RIB lode v našom katalógu sú navrhnuté a zdokumentované pre RCD súlad v rokoch 2013/53/EÚ podľa príslušných smerníc EÚ.CE Označovanie sa uplatňuje podľa modelu a konfigurácie. Kontaktujte nás pre dokument o rozsahu súladu špecifický pre model.
    - q: Aký je rozdiel medzi RCD dodržiavaním predpisov a CE označovaním?
      a: RCD (Smernica o rekreačných plavidlách 2013/53/EÚ) je legislatíva EÚ, ktorá stanovuje základné bezpečnostné požiadavky.CE Označenie je vizuálny symbol umiestnený na produkte, ktorý bol posúdený a potvrdený ako spĺňajúci tieto požiadavky. Produkt musí spĺňať tieto požiadavky RCD , aby mohol CE niesť značku.
    - q: Poskytujete Deklarácie o zhode s každou loďou?
      a: Áno. Každá RIB loď dodaná na trh EÚ obsahuje modelovo špecifickú Deklaráciu o zhode EÚ, ktorá uvádza príslušné smernice, harmonizované normy, modul posudzovania zhody a podrobnosti o oznámenom orgáne.
    - q: Aký modul na posudzovanie zhody Aquafarer sa používa?
      a: Modul závisí od kategórie návrhu a typu lode. Väčšina RIB modelov v kategórii C používa modul A (interná kontrola výroby). Pre lode kategórie A/B alebo špecifické konfigurácie sa môže+uplatniť modul B C alebo B+D za účasti oznámeného orgánu. Odporúčame určiť vhodný modul pre každý projekt.
    - q: Môžete nám poskytnúť dokumentáciu o súlade pred zadaním objednávky?
      a: Po kvalifikovanom dotaze zdieľame dokument o rozsahu súladu, ktorý uvádza platné normy, cestu zhody a typy dokumentov dostupné pre model, ktorý hodnotíte. Kompletné technické súbory sú zdieľané v sekcii NDA po potvrdení objednávky.
    - q: Čo je to identifikačné číslo trupu (HIN) a je zahrnuté?
      a: HIN je 14-znakový jedinečný identifikátor trvalo označený na každej lodi, kódujúci výrobný kód (MIC), označenie modelu, rok výroby a sériové číslo. Je povinný pre všetky RIB lode uvedené na trh EÚ a je zahrnutý na každom .Aquafarer RIB
    - q: Ako dlho sa uchovávajú technické súbory?
      a: Podľa RCD požiadaviek 2013/53/EÚ musí výrobca uchovávať technickú dokumentáciu aspoň 10 rokov od posledného dátumu uvedenia produktu na trh.Aquafarer Vedie kompletnú technickú dokumentáciu pre všetky vyrobené modely.
    - q: Pomáhate s povinnosťami dovozcu podľa RCD?
      a: 'Áno. Poskytujeme balík dokumentácie, ktorý dovozcovia v EÚ potrebujú na splnenie svojich povinností: prístup k technickým súborom, DoC, výrobná značka, príručka majiteľa a záznamy o sledovateľnosti produktov. Povinnosti dovozcov RCD podľa nich sú jasne zdokumentované v našom sprievodcovi súladom.'
cta:
  title: Potrebujete modelovo špecifický rozsah dodržiavania EÚ?
  subtitle: Požiadajte o podrobný kontrolný zoznam súladu pre RIB model a konfiguráciu, ktorú hodnotíte — vrátane príslušných noriem, trasy zhody a dostupnej dokumentácie.
