features3_reasons:
  tagline: Prečo si vybrať Aquafarer
  title: Sedem dôvodov, prečo s nami spolupracovať
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Skutočná výroba, nie obchodovanie
      description: Vlastníme a prevádzkujeme fabriku s rozlohou 12 000 m². Keď spolupracujete s Aquafarer, pracujete priamo s ľuďmi, ktorí navrhujú, konštruujú a vyrábajú vaše produkty — bez prostredníkov.
      icon: tabler:building-factory
    - title: 2. Prístup vedený inžinierstvom
      description: Náš dizajnový proces začína prípadom použitia, nie kategóriou produktu. Optimalizujeme tvar trupu, výber materiálu a konfiguráciu podľa toho, ako bude loď skutočne používaná.
      icon: tabler:engine
    - title: 3. Certifikovaná kvalita
      description: CE certifikovaný, ISO systém kvality, BSCI v súlade, REACH v súlade, USCG schválený. Naše 64 modelov s certifikátom CE spĺňa medzinárodné štandardy — nie len tvrdenia.
      icon: tabler:certificate
    - title: 4. Flexibilný OEM/ODM
      description: Farby tuby, rozloženie konzoly, branding, balenie — prispôsobujeme podľa vašich špecifikácií. Žiadny tlak na minimálnu objednávku. Začnite s prototypom, zvyšujte s istotou.
      icon: tabler:adjustments
    - title: 5. Globálna logistika
      description: Sklad v USA v Kalifornii, priame doručenie z Qingdao, letecká doprava pre naliehavé objednávky. Zabezpečujeme colné formuláre a dokumentáciu.
      icon: tabler:truck-delivery
    - title: 6. Doživotná podpora
      description: Podporujeme lode, ktoré sme postavili pred 20 rokmi. Originálne náhradné diely, technické rady, pokyny na opravu — náš tím je k dispozícii, keď nás potrebujete.
      icon: tabler:lifebuoy
    - title: 7. Čestné špecifikácie
      description: Skutočné zaťaženia, skutočné rozmery, skutočná hmotnosť. Žiadne marketingové nafukovanie. To, čo zverejníme, je to, čo dostanete — overené nezávislým testovaním.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dôveryhodné pre značky po celom svete
  title: Čo hovoria naši partneri
  items:
    - content: Spolupracovali sme s niekoľkými výrobcom v Číne, ale Aquafarer vyniká svojou technickou podporou a konzistentnou kvalitou. S našou značkou zaobchádzajú ako s vlastnou.
      name: — OEM Partner, európska značka vodných športov
    - content: Ich Hypalon RIBs sú súčasťou našej flotily už viac ako 5 rokov. Minimálna údržba, vynikajúca UV odolnosť. Päťročná záruka na trubice nám dáva istotu.
      name: — Prevádzkovateľ flotily, stredovýchodná sieť rezortov
    - content: Tím Aquafarer nám pomohol vyvinúť vlastný dizajn dosky SUP od konceptu po výrobu za 90 dní. Kvalita presiahla naše očakávania.
      name: — Distribútor, austrálske vodné športy
