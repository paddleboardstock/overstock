features3_cases:
  tagline: Vybrané prípady
  title: Vlastné riešenia<br />Pre skutočné výzvy
  isBeforeContent: false
  columns: 3
  items:
    - title: Denná modernizácia prevádzky Bali Diving Center
      customer: Potápačské centrum Blue Ocean
      country: Indonézia
      industry: Komerčné potápačské centrum
      challenge: Blue Ocean Diving Center na Bali prevádzkovalo staršiu potápačskú loď z laminátu s obmedzeným priestorom na palube, náročným nastupovaním na palubu a náročnou údržbou v tropických slaných podmienkach. Nakládka vybavenia bola preplnená, príprava dlhá a nestabilná plošina spôsobovala bezpečnostné obavy pre medzinárodných turistov — vrátane nováčikov a starších cestovateľov. Centrum denne organizuje 3-5 potápačských výletov, 200+ dní v roku.
      solution: Paddle Board Overstock dodal na mieru 6,8 m profesionálny potápačský stroj RIB s rozšíreným rozložením paluby optimalizovaným na skladovanie potápačského vybavenia, široký nerezový potápačský rebrík, Hypalon robustné rúry pre UV odolnosť voči slanej vode, protišmykovú plochu paluby a riešenie na skladovanie nádrží. Konfigurácia bola navrhnutá podľa každodenného pracovného postupu potápačského centra — nie podľa štandardného usporiadania rekreačnej lode.
      product: 6,8 m profesionálne skoky RIBdo vody
      results: Väčšia pracovná plocha zlepšila efektivitu prípravy vybavenia. Potápači zažili bezpečnejšie a jednoduchšie nastupovanie. Požiadavky na údržbu sa výrazne znížili. Centrum získalo kapacitu na obsluhu väčšieho počtu zákazníkov počas hlavnej sezóny s väčšou dôverou. RIB Stali sa základom každodenných potápačských operácií.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Naša potápačská loď nie je len dopravným prostriedkom. Je základom našej každodennej prevádzky.Paddle Board Overstock RIB Dodáva nášmu tímu väčšiu istotu, keď denne organizujeme viacero potápačských výprav.
      icon: tabler:lifebuoy
    - title: Profesionálny upgrade potápačského centra Phuket RIB
      customer: Potápačské centrum Ocean Explorer
      country: Thajsko
      industry: Komerčné potápačské centrum
      challenge: Potápačské centrum Ocean Explorer v Phukete v Thajsku muselo prejsť na modernizáciu z tradičnej potápačskej lode zo sklených vlákien, ktorá nedokázala stačiť rastúcemu dopytu zákazníkov. Obmedzený priestor na palube robil prípravu vybavenia neefektívnou. Náročné nalodenie spôsobovalo bezpečnostné výzvy pre medzinárodných turistov. Vysoké nároky na údržbu v tropických slaných vodách zvyšovali prevádzkové náklady. Centrum prevádzkuje niekoľko denných plavieb, 200+ dní v roku.
      solution: Paddle Board Overstock dodali prispôsobený 6,8-metrový komerčný potápačský stroj RIB s optimalizovaným rozložením paluby pre skladovanie potápačských fliaš, prípravu vybavenia a pohyb potápačov. Medzi vlastnosti patrili široký potápačský rebrík s nerezovými madlami, robustná trubková konštrukcia s UVodolnými materiálmi, protišmyková podlaha, riešenie na skladovanie nádrží, profesionálna konzola a sedadlá pre pasažierov — všetko konfigurované pre komerčné potápačské operácie.
      product: 6,8 m Komerčné skoky RIBdo vody
      results: Väčšia plocha na palube umožnila rýchlejšiu organizáciu vybavenia a efektívnejší každodenný pracovný tok. Komfort a bezpečnosť zákazníkov pri nastupovaní sa výrazne zlepšili. Výpadky údržby sa znížili vďaka výstavbe námornej kvality. Potápačské centrum mohlo počas hlavnej sezóny obsluhovať viac zákazníkov a s istotou rozšíriť profesionálne potápačské služby.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Pre potápačské centrum nie je loď len dopravným prostriedkom. Je to dôležitá súčasť našej každodennej prevádzky.Paddle Board Overstock RIB Dáva nášmu tímu istotu absolvovať viacero potápačských výprav denne s vyššou bezpečnosťou a efektivitou.
      icon: tabler:lifebuoy
    - title: Flotila európskych potápačských centier
      customer: Potápačské centrá BlueMed
      country: Grécko
      industry: Potápanie a námorný turizmus
      challenge: Vyžadovalo to 12 potápačských centier pre RIBs reťazec potápačských centier na viacerých gréckych ostrovoch. Každá loď potrebovala vlastný potápačský rebrík, zásobník na 8 nádrží a stabilnú platformu pre vstup potápačov na otvorenej vode. Flotila musela doraziť do 60 dní na začiatok turistickej sezóny.
      solution: Vyrobila 12 RIB 520 potápačských modelov s integrovanými stojanmi na nádrže, potápačskými rebríkmi a extra Hypalon širokými rúrami pre stabilitu pri nastupovaní. Každá loď bola označená zákazníckym flotilovým náterom. Všetkých 12 lodí bolo tlakovo testovaných a odoslaných z Qingdao do 55 dní.
      product: RIB 520 Dive
      results: Všetkých 12 lodí bolo dodaných načas na turistickú sezónu. Flotila je v dennej prevádzke už 18+ mesiacov bez akýchkoľvek porúch materiálu. Zákazník si objednal ďalších 6 kusov v druhom roku.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive je základom našich každodenných potápačských operácií. Stabilita v pokoji je vynikajúca a usporiadanie nádrží udržiava palubu čistú a bezpečnú pre našich hostí.
      icon: tabler:lifebuoy
    - title: OEM Austrálsky distribučný program
      customer: Pacific Watersports Pty Ltd
      country: Austrália
      industry: OEM/ODM Výroba
      challenge: Austrálsky distribútor potreboval SUP rad dosiek súkromnej značky za konkurencieschopné ceny, aby mohol konkurovať čínskym značkám priamo pre spotrebiteľov. Vyžadovalo sa 8 unikátnych modelov od začiatočníkov až po pokročilých, s vlastnou grafikou, vlastným balením a drop-shipping objednávkou do maloobchodných predajní.
      solution: Vyvinul som 8 SUP modelov (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) s exkluzívnym austrálskym grafickým balíkom. Vlastné maloobchodné balenie s QR kódmi odkazujúcimi na videá o nastavení. Logistika dropshippingu konfigurovaná z Qingdao priamo do austrálskych maloobchodných predajní.
      product: SUP Custom Line (8 modelov)
      results: Koncept po prvú dodávku za 90 dní. Maloobchodná predajná miera 85 % v prvej sezóne. Distribútor rozšíril partnerstvo o radu nafukovacích člnov v druhom roku.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock SUP Kompletnú sériu dodali za 90 dní — od počiatočného návrhu až po maloobchodnú predajňu. Kvalita zodpovedá značkám, ktoré sa predávali za dvojnásobnú cenu.
      icon: tabler:arrows-exchange
    - title: Zásobovanie záchrannými člnmi na Blízkom východe
      customer: Národný úrad civilnej obrany
      country: Spojené arabské emiráty
      industry: Pátranie a záchrana
      challenge: Organizácia civilnej obrany potrebovala 20 hliadok pripravených RIBs na pobrežné pátranie a záchranu, bezpečnosť prístavov a reakciu na povodne. Vyžadovali samovyskakovacie paluby, kompletné navigačné systémy (GPS, radar, VHF), oranžové trubice s vysokou viditeľnosťou a súlad s miestnymi námornými predpismi.
      solution: Dodali 20 RIB modelov 450 Patrol s samovypúšťacími palubami, navigačnými súpravami Garmin, LED reflektormi, SOLAS reflexnou páskou a Hypalon vysoko viditeľnými oranžovými trubicami. Každá loď bola CEcertifikovaná a testovaná podľa ISO štandardov 6185. Balík dokumentácie obsahoval certifikáty o súlade pre miestnu registráciu.
      product: RIB 450. hliadka
      results: Flotila bola nasadená na 5 pobrežných staniciach. Lode operovali v extrémnych horúčavách (45°+C) bez degradácie trubiek. Dojazd hliadky a spotreba paliva prekročili špecifikácie o 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450 Patrol prekročila naše operačné požiadavky. V extrémnych horúčavách Hypalon trubice UV po 24 mesiacoch denného používania nevykazujú známky opotrebovania.
      icon: tabler:alert-triangle
    - title: OEM Európske partnerstvo značky
      customer: Námorné vybavenie Severného mora BV
      country: Holandsko
      industry: OEM/ODM Výroba
      challenge: Etablovaná európska námorná značka chcela expandovať na RIB trh bez investícií do výrobných zariadení. Potrebovala partnera s bielou značkou, schopného vyrobiť 5 RIB modelov (3,9 až 6,2 milióna) s privátnou značkou, CE certifikáciou a exkluzívnymi právami na distribúciu v EÚ.
      solution: Uzatvorená biela značka výrobná dohoda pre 5 RIB modelov. Každý model bol označený logami zákazníkov a farebnou schémou.CE Pre každý model bola pripravená certifikačná dokumentácia. Udelené exkluzívne práva na distribúciu v EÚ s minimálnymi objednávkovými záväzkami. Technická dokumentácia a katalóg náhradných dielov boli poskytnuté pre miestnu servisnú sieť.
      product: RIB Custom Line (5 modelov)
      results: Podpísaná viacročná zmluva. Prvá výrobná séria 50 kusov bola dodaná do 75 dní. Značka bola uvedená na METSTRADE s pozitívnym prijatím u predajcov.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Spolupráca Paddle Board Overstock nám umožnila vstúpiť na RIB trh bez výstavby továrne — dodali kompletné riešenie na kľúč s CE certifikáciou a podporou predajcov.
      icon: tabler:building
    - title: Karibská rekreačná flotila
      customer: Paradise Island Resorts Ltd
      country: Bahamy
      industry: Morský turizmus a pohostinstvo
      challenge: 'Luxusný rezort potreboval kompletnú flotilu vodných športov pre aktivity hostí: 40 SUP dosiek na sprievodcovské výlety, 20 kajakov na prieskum lagúny, 10 nafukovacích člnov na prevoz hostí a rybárske výlety, plus príslušenstvo. Všetko vybavenie vyžadovalo vlastné rezortočné značky a muselo byť dodané pred hlavnou turistickou sezónou.'
      solution: 'Vyrobil kompletný balík vodných športov: 40 SUP dosiek Voyager (model All-Around), 20 kajakov Explorer, 10 AirDeck nafukovacích člnov 360, plus PFD, veslá, čerpadlá a opravárenské sady. Všetko vybavenie je vytlačené logom rezortu a tropickou farebnou schémou. Kontajnerová zásielka s kompletným inventárnym manifestom.'
      product: Kompletný balík vodných športov (70+ kusov)
      results: Flotila dorazila 6 týždňov pred hlavnou sezónou. Skóre spokojnosti hostí pri vodných športoch vzrástlo medziročne o 40 %. Vybavenie vydržalo 3 sezóny s iba rutinnou údržbou.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Prístup k kompletnému balíku znamenal, že sme dostali všetko potrebné v jednej zásle — dosky, kajaky, lode a doplnky, všetko s značkou a pripravené na použitie hosťami. Naši hostia milujú kvalitu vybavenia.
      icon: tabler:beach
    - title: Modernizácia komerčného potápačského centra v Queenslande RIB
      customer: Komerčné potápačské centrum
      country: Austrália
      industry: Komerčné potápanie a námorné služby
      challenge: Komerčné potápačské centrum so sídlom v Queenslande, špecializujúce sa na inšpekciu námornej infraštruktúry, údržbu prístavov a podvodné opravy, prevádzkovalo starú pracovnú loď. Ako rástol dopyt po projekte, staré plavidlo sa stalo rizikom — častá údržba spôsobovala narušenie harmonogramu, usporiadanie nebolo navrhnuté pre moderné potápačské operácie (obmedzený priestor na fľaše, náradie a vybavenie) a pohodlie posádky počas dlhých operácií bolo slabé. Spoločnosť potrebovala plavidlo, ktoré by zvládlo ich profesionálne operácie každý pracovný deň.
      solution: Paddle Board Overstock vykonal podrobnú operačnú analýzu potápačského pracovného postupu zákazníka, typickej dĺžky projektu, veľkosti posádky a požiadaviek na vybavenie. Na základe tejto analýzy Paddle Board Overstock bol dodaný prispôsobený profesionál RIB s funkčným usporiadaním paluby optimalizovaným na prípravu vybavenia a pohyb potápačov, profesionálnym sedením na dlhšie obdobia prepravy, zvýšenou stabilitou pre bezpečnejší vstup a výstup potápačov a integrovanými podpornými prvkami potápačov v dizajne.
      product: Profesionálne potápanie RIBna mieru
      results: Nová RIB sa stala spoľahlivou dennou pracovnou platformou. Príprava vybavenia bola rýchlejšia vďaka optimalizovanému usporiadaniu. Posádka hlásila zlepšený komfort a bezpečnosť počas dlhých operácií. Profesionálny vzhľad lode posilnil dôveru zákazníkov pri spolupráci s prevádzkovateľmi prístavov a námornými dodávateľmi. Potápačské centrum získalo plavidlo, ktoré zodpovedalo profesionalite ich služieb.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Potrebovali sme loď, ktorá by každý deň podporovala naše podnikanie, nie len prostriedok na prepravu. Paddle Board Overstock s nami spolupracoval, aby pochopil naše prevádzkové požiadavky, a poskytol riešenie RIB, ktoré vyhovuje nášmu pracovnému postupu v komerčnom potápaní.
      icon: tabler:lifebuoy
    - title: Zmluva o pobrežnej hliadke USA
      customer: Atlantská agentúra pre pobrežnú bezpečnosť
      country: Spojené štáty
      industry: Námorná bezpečnosť a presadzovanie práva
      challenge: Americká pobrežná bezpečnostná agentúra požadovala ťažkú hliadkovú loď RIBs pre operácie zachytávania na otvorenej vode. Bola potrebná konfigurácia s dvoma motormi pre zálohovanie, pancierovaná konzola pre ochranu posádky, elektronika vojenských špecifikácií (šifrovaná komunikácia, FLIR, radar) a súlad s predpismi Americkej pobrežnej stráže.
      solution: Navrhnuté RIB 600 Patrol s dvojitým vonkajším motorom 115 HP, pancierovaná konzola s balistickou ochranou, termovízia FLIR, šifrovaná VHF/UHF komunikácia a integrované montážne body pre zbrane. Trup zosilnený pre manévre vysokorýchlostného prenasledovania. Všetka elektronika integrovaná a testovaná vo fabrike. Poskytnutá dokumentácia o zhode USCG.
      product: RIB 600 Patrol (dvojmotorový)
      results: Lode dosiahli maximálnu rýchlosť 52 uzlov počas skúšok prijatia. Agentúra uviedla 95% mieru pripravenosti na misiu počas prvých 12 mesiacov. Bola zadaná dodatočná objednávka na 8 jednotiek.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Dvojmotorový RIB 600 poskytuje našim posádkam rýchlosť a záložnosť potrebnú pre operácie na otvorenej vode. Opevnená konzola poskytuje kritickú ochranu bez kompromisov vo výkone.
      icon: tabler:shield
