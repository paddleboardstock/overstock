content_benefits:
  tagline: Výhody partnerstva
  title: Prečo distribútori<br />Vyberte Paddle Board Overstock
  subtitle: Partnerstvo navrhnuté pre námorných distribútorov, ktorí potrebujú spoľahlivú zásobu, konkurencieschopné marže a profesionálnu podporu.
  items:
    - title: Ochrana územia
      description: Exkluzívne alebo semi-exkluzívne územné práva pre kvalifikovaných distribútorov. Mapovanie trhu a riadenie konfliktov kanálov na ochranu vašej investície do budovania značky Paddle Board Overstock vo vašom regióne.
      icon: tabler:map-pin
    - title: Konkurencieschopné veľkoobchodné ceny
      description: Cenová štruktúra podľa úrovne na základe ročných záväzkov množstva. Cenová štruktúra chrániaca maržu s predbežnými cenovými zárukami a transparentným rozpisom nákladov (FOB báza Qingdao).
      icon: tabler:currency-dollar
    - title: Marketingový podporný balík
      description: Profesionálna produktová fotografia, špecifikačné listy, šablóny dokumentácie o zhode, obsah pre sociálne médiá a spoluznačkové marketingové materiály. Aktualizované ročne s novými produktovými spusteniami.
      icon: tabler:photo
    - title: Technické školenie
      description: Školenie produktov pre váš predajný tím (virtuálne alebo na mieste), školenie údržby a opráv pre vašich servisných technikov a návody FAQ a riešenia problémov pre zákazníkov.
      icon: tabler:school
    - title: Náhradné diely a popredajná podpora
      description: Dedikovaná zásoba náhradných dielov s prioritným odoslaním. Dostupné náhradné sekcie trubíc, ventily, plutvy a opravárenské súpravy pre rýchle vybavenie objednávky. Podpora spracovania reklamácií.
      icon: tabler:tool
    - title: Dokumentácia o zhode
      description: 'Kompletný balík dokumentácie o zhode pre váš trh: CE DoC, údaje staviteľa, návody pre vlastníka a podpora pre regulačnú registráciu. Odstraňuje vašu povinnosť ohľadom súladu.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Čo hľadáme
  title: Distribútorom<br />Požiadavky
  subtitle: Hľadáme partnerov, ktorí môžu profesionálne reprezentovať a podporovať produkty Paddle Board Overstock vo svojom území.
  items:
    - title: Poznanie územia a trhu
      description: Usporiadaná prítomnosť na trhu s námornými, vodnými športmi alebo vonkajšou rekreáciou. Pochopenie miestnych predpisov, preferencií spotrebiteľov a distribučných kanálov pre produkty vodných plavidiel.
      icon: tabler:target
    - title: Skúsenosti v priemysle
      description: Minimálne 2 roky skúseností s distribúciou marine, outdoorového alebo športového vybavenia. Preukázateľná úspešnosť s medzinárodnými značkami a B2B veľkoobchodnými operáciami.
      icon: tabler:briefcase
    - title: Showroom alebo Sklad
      description: Fyzické zariadenie na prezentáciu produktov, skladovanie zásob a poskytovanie zákazníckeho servisu. Schopnosť udržiavať ukážkové jednotky a zásoby náhradných dielov pre vaše územie.
      icon: tabler:building-store
    - title: Záväzok k štandardom značky
      description: Ochota dodržiavať štandardy prezentácie značky Paddle Board Overstock, poskytovať zákaznícku podporu podľa našich servisných protokolov a zúčastňovať sa ročných aktualizácií školení o produktoch.
      icon: tabler:star
content_process:
  tagline: Proces podania žiadosti
  title: 4-krokový predajca<br />Proces podania žiadosti
  subtitle: Od počiatočného dopytu po prvú zásielku — jednoduchý proces onboardingu.
  steps:
    - number: '01'
      title: Počiatočná dopyt a kvalifikácia
      description: Predložte svoju žiadosť o distribútora s údajmi o spoločnosti, záujmovom území, súčasnými produktovými radmi a odhadovaným ročným objemom. Skontrolujeme ju do 5 pracovných dní.
      timeline: 5 dní
    - number: '02'
      title: Obchodná recenzia a podmienky
      description: Virtuálne stretnutie na diskusiu o stratégii územia, cenových úrovniach a podmienkach partnerstva. Preskúmať požiadavky na dokumentáciu súladu pre váš trh. NDA podpisovanie, ak je potrebné.
      timeline: 1-2 týždne
    - number: '03'
      title: Vzorka objednávky a hodnotenie
      description: Zadajte počiatočnú skúšobnú objednávku (2-5 kusov) za cenu distribútora na účely hodnotenia trhu a školenia tímu. Súčasťou sú kompletné dokumenty o súlade a príprava ukážky.
      timeline: 30-45 dní
    - number: '04'
      title: Spustenie a podpora partnerstva
      description: Prvá objednávka kontajnera s aktivovanou ochranou územia. Marketingový balík doručený, obchodný tím vyškolený a pridelený osobný správca účtu. Prebiehajúce štvrťročné obchodné prehľady.
      timeline: Prebiehajúce
content_application_docs:
  tagline: Dokumenty žiadosti
  title: Požadované dokumenty<br />pre prihlášku predajcu
  subtitle: Aby ste mohli požiadať o Paddle Board Overstock predajcu, pripravte prosím nasledujúce dokumenty a informácie pre náš hodnotiaci tím.
  items:
    - title: Osvedčenie o registrácii podnikania
      description: Platný registračný dokument spoločnosti uvádzajúci názov právnej osoby, registrovanú adresu a rozsah podnikania pokrývajúci distribúciu námorného, športového alebo outdoorového vybavenia.
      icon: tabler:file-text
    - title: Plán pokrytia územia
      description: Geografické územie záujmu, existujúca maloobchodná alebo distribučná sieť, cieľové segmenty zákazníkov a navrhovaný ročný objem podľa produktovej kategórie (RIB, SUP, kajak).
      icon: tabler:map
    - title: Kapacita v showroome alebo sklade
      description: Fyzické priestory na vystavenie produktov, skladovanie zásob a zákaznícky servis. Fotografie alebo pôdorysy zobrazujúce demografickú plochu a kapacitu skladovania náhradných dielov.
      icon: tabler:building
    - title: Vyhlásenie o finančnej schopnosti
      description: 'Banková referencia alebo finančné výkazy potvrdzujúce schopnosť zadať počiatočnú objednávku kontajnera a udržiavať zásoby. Minimálna počiatočná objednávka: jeden 20-stopový kontajner (10-20 jednotiek zmiešaných modelov).'
      icon: tabler:coin
    - title: Kapacita popredajnej podpory
      description: Servisní technici vyškolení alebo schopní vyškoliť na údržbu a opravu nafukovacích člnov. Schopnosť vybavovať reklamácie v záruke a záväzok na zásoby náhradných dielov.
      icon: tabler:tool
    - title: Predchádzajúce odkazy na značky
      description: Zoznam súčasných alebo predchádzajúcich značiek námorného/športového vybavenia distribuovaných. Kontaktné referencie sú dostupné po vzájomnej dohode. Startupy bez predchádzajúcich skúseností s distribúciou môžu spĺňať podmienky s väčším finančným záväzkom.
      icon: tabler:users
faq:
  title: Program predajcov — Často kladené otázky
  questions:
    - q: Aké je minimálne množstvo objednávky pre distribútorov?
      a: Distribútor MOQ začína na 10-20 kusoch na objednávku, s flexibilitou pre zmiešané modely (RIB, nafukovateľné, SUP). Počiatočné vzorkové objednávky 2-5 kusov sú dostupné za distribučné ceny na trhové hodnotenie.
    - q: Ponúkate exkluzívne územné práva?
      a: Exkluzívne územné práva sú dostupné pre kvalifikovaných distribútorov, ktorí plnia ročné objemové záväzky a udržiavajú štandardy značky. Poloexkluzívne a neexkluzívne dohody sú dostupné aj pre rozvíjajúce sa trhy.
    - q: Akú marketingovú podporu poskytujete?
      a: Poskytujeme komplexnú marketingovú súpravu vrátane profesionálnej produktovej fotografie, špecifikácií, šablón dokumentácie súladu, knižnice obsahu zo sociálnych médií a spoločných materiálov. Každoročne aktualizované s uvedeniami nových produktov.
    - q: Ako sa riešia reklamácie na záruku?
      a: 'Distribútori slúžia ako prvý kontaktný bod pre reklamácie záruky. Poskytujeme jasné kritériá záruky, protokoly fotografickej dokumentácie a rýchlu výmenu alebo spracovanie kreditu. Podmienky záruky: 5-ročné obmedzenie na látku/švy/trup lodných trubiek; 2 roky a SUP príslušenstvo.'
    - q: Môžem mať produkty pod privátnou značkou Paddle Board Overstock pod vlastnou značkou?
      a: Áno, prostredníctvom OEMODM nášho / programu. Možnosti súkromnej značky zahŕňajú vlastnú grafiku trubíc, značku konzoly, maloobchodné balenie a dokumentáciu o súlade pod vaším názvom. OEMODM Podrobnosti nájdete na našej / stránke služieb.
    - q: Aká dokumentácia k dodržiavaniu predpisov je súčasťou distribútorov?
      a: Každá zásielka obsahuje CE modelovo špecifické DoC, údaje o staviteľských tabuľkách, návody na použitie a prepravnú dokumentáciu. Poskytujeme tiež regulačnú podporu registrácie pre vaše územie a pomáhame s miestnymi požiadavkami na dodržiavanie predpisov.
