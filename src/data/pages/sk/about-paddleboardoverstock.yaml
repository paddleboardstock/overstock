  title: O {SITE}
  subtitle: Vertikálne integrovaný výrobca vodných športov — od suroviny po hotovú loď
intro:
  - 'Paddle Board Overstock bol založený v roku 2012 s jediným cieľom: navrhovať a vyrábať vybavenie pre vodné športy, ktoré podáva rovnako dobrý výkon na vode, ako aj vo správe o kvalite. To, čo začalo ako zameraná SUP dielňa na dosky, sa rozrástlo na 12 000 metrov štvorcových integrované výrobné zariadenie v Ekonomickej rozvojovej zóne Qingdao, ktoré produkuje nafukovacie lode, RIBs, kajaky, SUP dosky, bezpečnostné vybavenie a doplnky pre zákazníkov v 50+ krajinách.'
  - Dnes Paddle Board Overstock pôsobí ako továreň s vlastnou značkou — navrhujeme, konštruujeme, prototypujeme, vyrábame a testujeme všetko pod jednou strechou. Táto vertikálna integrácia nám dáva priamu kontrolu nad výberom materiálov, kvalitou výroby a dodacími termínmi. Každá loď je postavená našimi ľuďmi, na našom vybavení, podľa našich štandardov.
  - Slúžime rekreačným používateľom, komerčným prevádzkovateľom, vládnym agentúram a partnerským značkám po celom svete. Naše programy OEM a ODM pomáhajú firmám spustiť vlastné produktové rady bez investícií do továrenskej infraštruktúry. Či už potrebujete jediný prototyp alebo celú výrobnú sériu, náš tím vás prevedie od konceptu po pripravené doručenie na mori.
