  - label: Veľkosť zariadenia
    value: 12 000 m² (130 000 ft²) integrovaný areál v Ekonomickej rozvojovej zóne Qingdao
  - label: Ročná kapacita
    value: 15 000 lodí vrátane SUPs, kajakov, člnov, RIBs a bezpečnostného vybavenia
  - label: Tím R&D
    value: 25+ inžinierov v oblasti dizajnu produktov, materiálovej vedy a inžinierstva kvality
  - label: Kľúčové zariadenia
    value: CNC rezačky, RF dielektrické zváračky, teplovzdušné tesniace prístroje, digitálne tlačiarne, formy zo sklenených vlákien, zariadenia na testovanie tesnosti vzduchu
