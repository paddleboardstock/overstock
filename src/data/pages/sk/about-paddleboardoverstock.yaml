values:
  - title: Kvalita na prvom mieste
    desc: Každá loď, ktorá opúšťa našu továreň, prechádza povinnou kontrolou zadržiavania vzduchu, odlepovaním švov a testovaním systémov pred odoslaním.
  - title: Vertikálna integrácia
    desc: Kontrolujeme každý stupeň — od PVC rezania až po finálnu montáž — eliminujeme neefektívnosť dodávateľov a zabezpečujeme konzistentnú kvalitu.
  - title: Bezpečnosť ako štandard
    desc: CE Certifikácia je základom toho, čo vyrábame. Naše CEmodely s certifikáciou 64 spĺňajú bezpečnostné normy EÚ pre rekreačné a komerčné použitie.
  - title: Partner-centrické
    desc: Budujeme dlhodobé vzťahy s OEMODM, , a partnermi privátnych značiek prostredníctvom transparentnosti, spoľahlivosti a spoločného rastu.
services:
  - title: OEM Výroba
    desc: Staviame podľa vašich špecifikácií. Zdieľajte svoje výkresy a náš inžiniersky tím sa postará o prototypovanie, nástroje a výrobu.
  - title: ODM Riešenia
    desc: Začnite s našimi overenými dizajnmi platforiem. Prispôsobte veľkosť, farbu, grafiku a balenie, aby ste vytvorili svoju jedinečnú produktovú líniu.
  - title: Privátna značka
    desc: Vaša značka, logo, balenie. Produkty prichádzajú pripravené na predaj s plnou integráciou značky.
  - title: Vlastné branding
    desc: Tlač na palube, grafika trupu, tubusové nálepky a vlastné etikety — konzistentná prítomnosť značky na každom povrchu.
certifications:
  - name: CE Certifikácia
    desc: Naše lode a vodné plavidlá spĺňajú smernicu EÚ o rekreačných plavidlách (2013/53/EÚ) a príslušné harmonizované normy.
    scope: Lode a vodné plavidlá
  - name: null
    desc: Systém riadenia kvality certifikovaný na návrh, výrobu a distribúciu nafukovacích vodných člnov.
    scope: Celé zariadenie
  - name: null
    desc: Nafukovacie člny — bezpečnostné a výkonnostné požiadavky pre vystužené a pevné nafukovacie člny.
    scope: RIB & nafukovacie laná
