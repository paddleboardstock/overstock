hero:
  tagline: Zariadenia
  title: Výrobné zariadenia a stroje
  subtitle: Priemyselné zariadenia na rezanie, zváranie, tlač a montáž
  back_label: Späť do továrne
  back_link: /factory
categories:
  - title: Rezanie a príprava materiálu
    items:
      - name: Automatický PVC rezací stroj
        spec: CNC-riadené, 6,5 m × 2,5 m, presnosť 0,1 mm
        desc: Počítačom riadený automatický rezací stroj pre látky PVC, Hypalon a drop-stitch. Softvér na umiestňovanie dielov optimalizuje využitie materiálu pod 5 % odpadu.
      - name: Rozprestierač látok
        spec: Maximálna šírka 3 m, podávanie s kontrolou napätia
        desc: Rozkladá látku v jednom alebo viacerých vrstvách s kontrolovaným napätím, aby sa predišlo deformácii pred rezaním.
  - title: Zváranie a lepenie rúrok
    items:
      - name: Tepelne uzatvárací stroj
        spec: Zváranie horúcim vzduchom, variabilné 200–600 °C, 0,5–5 m/min
        desc: Stroj na tepelné zváranie horúcim vzduchom na spájanie a zváranie švov rúrok PVC a Hypalon. Používa sa na spájanie, utesňovanie a zlievanie komôr rúrok a plavákových spojov.
      - name: Dielektrická RF lis
        spec: 15 kW, platňa 2000 × 600 mm
        desc: Rádiovo-frekvenčný zvárací lis pre hlavné pozdĺžne švy, spoje prechodov na rúry a výrobu veľkých komôr.
      - name: CNC-riadený RF zvárač
        spec: 8 kW, XY stôl 2500 × 1200 mm
        desc: Programovateľné zváranie zakrivených švov pre zložité geometrie, reliéfne razenie loga a presné záplaty.
  - title: Výroba trupu RIB
    items:
      - name: Sklolaminátové formy s ručným nanášaním
        spec: Viacero foriem pre trup RIB až do dĺžky 6 m
        desc: Tradičné ručné skladanie sklolaminátu s polyesterovými a vinylesterovými živicami. Každá vrstva sa ručne valcuje a vakuovo zabaluje pre konzistentnú kvalitu a pevnosť laminátu.
      - name: Striekacia kabína na gelcoat
        spec: Teplotne riadená, filtrovaná ventilácia vzduchu
        desc: Aplikácia gelcoatu na trup RIB. Zabezpečuje vysokolesklý, UV-odolný povrch s presnou kontrolou hrúbky.
      - name: CNC frézka (5-osá)
        spec: Obal 3 m × 2 m × 1 m, vodou chladený vreteno
        desc: Obrábanie vložiek trupu, foriem konzol, podstáv sedadiel a vlastných držiakov.
  - title: SUP Tlač a dekorácia
    items:
      - name: Digitálna tlačiareň
        spec: Vysokorozlišovacia atramentová tlač, šírka tlače až 2 m
        desc: Priama tlač na textil pre plnofarebnú grafiku paluby SUP. Tlačí vlastné vzory, prechody a fotograficky kvalitné obrázky s UV-odolnými vodou riediteľnými atramentmi.
      - name: Sieťotlačný stroj
        spec: Ručné a poloautomatické, viacfarebné registrovanie
        desc: Sítotlač pre logá paddleboardov SUP, značky a opakujúce sa vzory. Poskytuje odolné, nepriehľadné výtlačky s živou farebnou saturáciou.
  - title: Montáž a zdvíhanie
    items:
      - name: Žeriav na motory
        spec: Nosnosť 500 kg, nastaviteľná rozpieracia tyč
        desc: Bezpečné upevnenie prídavných motorov od 2,5 do 60 hp.
      - name: Rám makety konzoly
        spec: Nastaviteľná výška a uhol
        desc: Predmontáž riadenia, plynu a prístrojových panelov pred inštaláciou.
      - name: Lis na hydraulické hadice
        spec: Max. vnútorný priemer 1", digitálny tlakomer
        desc: Sestavy hydraulických riadiacich hadíc na mieru s lisovanými konektormi.
      - name: Doska elektrického zväzku
        spec: 3 m × 1,5 m, predtlačené schémy zapojenia
        desc: Montáž a testovanie kompletných elektrických zväzkov mimo lode.
  - title: Testovanie a kontrola kvality
    items:
      - name: Univerzálny ťahový tester
        spec: 50 kN, podľa ASTM D751
        desc: Testovanie sily pri pretrhnutí, predĺženia pri pretrhnutí a šírenia trhlín pre šarže textílií.
      - name: Testovacia jednotka retencie vzduchu
        spec: Programovateľná, 30-minútové udržanie tlaku
        desc: Automatizovaný test udržania tlaku pre každú komoru trubice pred montážou.
      - name: Tester olupovania švov
        spec: Motorický 180° odlupovanie pri 100 mm/min
        desc: Testovanie odtrhovej pevnosti zváraných a lepených švov podľa ISO 6185.
      - name: Komora na starnutie pri xenónovom oblúku
        spec: Expozícia 2000 h
        desc: Testovanie odolnosti UV na zmenu farby a zachovanie pevnosti.
