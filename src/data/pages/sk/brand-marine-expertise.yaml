hero:
  tagline: Námorná odbornosť
  title: Desaťročia námorného inžinierstva<br />v Every Hull
  subtitle: Aquafarer Kombinuje hlbokú materiálovú vedu, presnú výrobu a testovanie v reálnom svete, aby vytvoril plavidlá, ktoré fungujú práve vtedy, keď je to dôležité.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Tím námorného inžinierstva a výskumu a vývoja v práci
expertise_materials:
  tagline: Materiálová veda
  title: Výber správneho materiálu<br />pre každú aplikáciu
  subtitle: Pracujeme s tromi základnými materiálmi — každý vybraný pre konkrétne prípady použitia a požiadavky na výkon.
  columns: 3
  items:
    - title: Námorná trieda PVC
      description: Tkanina 1100 denier PVC — náš najvšestrannejší materiál. UV-Stabilizovaný, odolný voči opotrebeniu a REACH vyhovujúci. Ideálny pre rekreačné lode SUP , dosky a kajaky, kde záleží na hmotnosti a nákladovej efektívnosti.
      icon: tabler:droplet
    - title: Prémiový Hypalon/CSM
      description: Vynikajúca chemická odolnosť a UV stabilita.Hypalon Lode môžu vydržať 15-20 rokov pri správnej starostlivosti. Odporúča sa pre komerčné, záchranné a vojenské aplikácie, kde je dlhodobá odolnosť kritická.
      icon: tabler:shield
    - title: Sklené vlákno a hliník
      description: Hlboko-V laminátové trupy pre RIBs hliadkové lode a hliadkové lode — výkon pri rezaní vĺn v drsných podmienkach. Hliníkové trupy pre ťažké komerčné pracovné lode vyžadujúce maximálnu pevnosť a nosnosť.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Výrobné kapacity
  title: Presná výroba<br />na každom kroku
  subtitle: Naše zariadenie s rozlohou 12 000 m² je vybavené špecializovanými strojmi pre každú fázu výroby.
  columns: 2
  items:
    - title: CNC Rezanie
      description: Počítačom riadené rezanie zabezpečuje presné, opakovateľné textilné panely s minimálnym odpadom. Každý kus presne sedí podľa návrhu.
      icon: tabler:cpu
    - title: Vysokofrekvenčné zváranie
      description: Priemyselné HF zváranie vytvára spoje pevnejšie ako základný materiál. Konzistentná regulácia teploty a tlaku zabezpečuje vzduchotesné tesnenia v každej výrobnej sérii.
      icon: tabler:bolt
    - title: Zostava jadra drop stitch
      description: Tisíce polyesterových nití spájajú hornú a spodnú vrstvu látky, čo umožňuje vysokotlakové nafukovanie (15-20PSI) pre pevné, stabilné SUP dosky a podlahy.
      icon: tabler:building-arch
    - title: Tlakové testovanie
      description: Každý nafukovací produkt je pred prepravou testovaný tlakom.RIB Trubice sa testujú pri 1,25-násobnom menovitom tlaku — ak tam vydrží, bude fungovať na vode.
      icon: tabler:wind
    - title: Testovanie pevnosti švu
      description: Náhodné vzorky z každej výrobnej série prechádzajú deštruktívnym testovaním pevnosti spojov. Výsledky sa zaznamenávajú a dajú sa sledovať na konkrétne výrobné série.
      icon: tabler:files
    - title: Testovanie vody
      description: Každý RIB model prechádza námornými skúškami pred certifikáciou. Testovanie v reálnych podmienkach pri pobreží overuje výkon, ovládateľnosť a stabilitu.
      icon: tabler:ripple
expertise_design:
  tagline: Dizajn a inžinierstvo
  title: Navrhnuté pre reálne podmienky
  subtitle: Naša filozofia dizajnu začína tým, ako bude loď používaná — a potom sa okolo toho buduje inžinierstvo.
  items:
    - title: Dizajn trupu Deep-V
      description: Naše sklolaminátové trupy majú vypočítané uhly výšky V optimalizované pre dĺžku a zamýšľané použitie každého modelu. Strmšia V pre výkon na rozbúrenej vode, plytšia pre stabilitu.
    - title: Viackomorová bezpečnosť
      description: Každá loď má 3-7 nezávislých vzduchových komôr. Ak je jedna komora poškodená, zostávajúce komory udržiavajú loď nad vodou a funkčnú.
    - title: Ergonomické usporiadanie
      description: Poloha konzoly, výška trubice a umiestnenie sedadla sú navrhnuté s ohľadom na pohodlie operátora počas dlhodobého používania — či už pri patrolovaní, rybolove alebo preprave.
    - title: Vlastné nastavenie
      description: Farby rúr, konfigurácia konzoly, kapacita paliva, úchyty na príslušenstvo — každý model môže byť prispôsobený tak, aby vyhovoval špecifickým prevádzkovým požiadavkám.
