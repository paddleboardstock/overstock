content_challenge:
  tagline: Výzva
  title: Potreby záchranných operácií<br />Bezkompromisná spoľahlivosť
  subtitle: Organizácie pre vyhľadávanie a záchranu fungujú pod extrémnou bezpečnostnou zodpovednosťou — každá porucha lode nesie neprijateľné dôsledky.
  paragraphs:
    - Pri záchranných operáciách sa hranica medzi úspechom a neúspechom meria v minútach. Loď musí byť pripravená na okamžité spustenie, schopná pôsobiť v drsných podmienkach a bezpečne sa vrátiť s pasažiermi. Zodpovednosť za bezpečnosť je absolútna — mechanická porucha počas záchrannej misie nie je náklad na opravu, je to stratou života.
    - Záchranné lode potrebujú vysokú rýchlosť, aby sa k obetiam dostali rýchlo, v kombinácii s výnimočnou stabilitou pre bezpečné záchranné operácie. Musia niesť záchranné vybavenie, lekárske zásoby a komunikačné zariadenia — často na obmedzenej ploche paluby. Lode v prevádzke vo vládnej službe tiež potrebujú dlhú životnosť (10-15 rokov), aby sa ospravedlnili verejné rozpočty na obstarávanie.
    - Viditeľnosť, ako pre operátora, tak aj pri hľadaní, je kritická. Dizajn konzoly musí zabezpečiť 360-stupňovú viditeľnosť a loď by mala byť vysoko viditeľná pre lietadlá a iné plavidlá.
    - Aquafarer záchranné RIBs sú konštruované od kormidla až po splnenie týchto požiadaviek — s automaticky odvádzajúcimi palubami, zosilnenými trupmi, navigačnými súpravami a ťahacími stĺpmi štandardne na hliadkových modeloch.
content_solution:
  tagline: Riešenie
  title: Na účel postavený záchranný RIBs
  subtitle: Každá Aquafarer záchranná loď je navrhnutá tak, aby spĺňala alebo prekonávala SOLAS a národné normy SAR.
  list:
    - Samovypúšťacia paluba — voda sa automaticky odvádza pre stabilitu počas záchranných operácií
    - Vyztužený trup s hlbokým V — schopnosť v drsnej vode s predvídateľným ovládaním pri rýchlosti
    - Kompletná súprava navigačných svetiel – prevádzková cez deň aj noc za všetkých poveternostných podmienok
    - Ťahový stĺp a ťahová lano — pripravené na ťahanie plavidla alebo záchranné saní operácie
    - Montážne dosky zariadení — rádio, reflektor, siréna a lekárske vybavenie
    - Viaceré konfigurácie motorov — redundancia jedného vonkajšieho alebo dvojmotorového
    - Farby vysoko viditeľných trubiek — oranžová, žltá alebo červená pre maximálnu viditeľnosť
content_segments:
  tagline: Profily záchrany
  title: Riešenia pre pátracie a záchranné plavidlá<br />Podľa typu organizácie
  subtitle: Rôzne záchranné organizácie pôsobia podľa rôznych mandátov, rozpočtových cyklov a prevádzkových prostredí — od pobrežných dobrovoľníckych posádok až po národné flotily pobrežnej stráže. Každú záchranu konfigurujeme RIB tak, aby zodpovedala profilu misie.
  items:
    - title: Pobrežná stráž a vládne SAR agentúry
      subtitle: Absolútna zodpovednosť za bezpečnosť — kritické štandardy pre flotilu
      description: Vládne SAR agentúry nesú najvyššiu zodpovednosť za bezpečnosť v námorných operáciách. Každá loď musí v extrémnych podmienkach fungovať bezchybne — porucha vybavenia počas záchrannej misie nie je možnosťou. Rozhodnutia o obstarávaní sú riadené celkovými nákladmi na vlastníctvo počas 10-15 rokov životnosti, nie počiatočnou cenou. Agentúry potrebujú plavidlá, ktoré prežijú roky pobrežných hliadok, spĺňajú prísne národné normy a poskytujú konzistentný výkon naprieč rozptýlenými stanicami. Komplexná dokumentácia dodržiavania predpisov a viacročné servisné zmluvy sú povinné.
      features:
        - SOLAS a balík dokumentácie k dodržiavaniu národných SAR noriem
        - Spoločné diely v celej flotile — znížiť zložitosť zásob na úrovni stanice
        - Dvojmotorová konfigurácia pre kritickú redundanciu pre misiu
        - Dizajn životnosti 10-15 rokov s plánovanými údržbovými programami
        - Schopnosť pre všetky poveternostné podmienky — spevnený hlboký V trup pre rozbúrené morské podmienky
    - title: Záchranné služby plavčíkov a plážových záchranných služieb
      subtitle: Rýchle štarty v plytkej vode
      description: Mestské a pobrežné záchranné služby potrebujú rýchle záchranné plavidlá, ktoré dokážu spustiť vodu cez vlnové zóny, operovať v plytkých pobrežných vodách a dosiahnuť plavcov alebo núdzové plavidlá v priebehu niekoľkých minút. Vybavenie musí byť dostatočne ľahké na ťahanie malým vozidlom alebo ručne.
      features:
        - Trup s plytkým ponorom RIB pre surfovú zónu a pobrežnú prevádzku
        - Loď s možnosťou spustenia na pláž s rukoväťou zdvihu príďovej časti a krytom kýlu
        - Integrovaná záchranná sane alebo platforma pre záchranných plavcov
        - Štandardné vysoko viditeľné oranžové alebo žlté farby trubiek
    - title: Hasičské záchranné zbory
      subtitle: Integrácia požiarnych čerpadiel, montáž zariadení, rýchla reakcia
      description: Požiarne záchranné námorné jednotky reagujú pri požiaroch na nábreží, požiaroch plavidiel a záchranných incidentoch na vode. Tieto lode musia niesť požiarne čerpadlá, monitory, zásobník na hadice a dýchacie prístroje — všetko integrované do stabilnej, rýchlej reakčnej platformy. Oddelenia tieto plavidlá používajú aj na reakciu na povodne a vzájomnú pomoc. Usporiadanie konzol musí umožňovať ovládanie čerpadiel, rádiové systémy a núdzové osvetlenie bez ohrozenia priestoru na palube pre pohyb posádky.
      features:
        - Predný monitor požiaru s integrovaným balíkom čerpadiel
        - Špeciálne montáže zariadení pre hasičské čerpadlo, skladovanie hadíc a súpravy BA
        - Konfigurácia konzoly nastaviteľná pre ovládanie čerpadiel, rádia a núdzového osvetlenia
        - Samo-vypúšťacia paluba na hasenie odtoku vody a stabilitu
        - 'Balík nočných operácií: reflektor, osvetlenie scény, modro-červený svetelný pruh'
    - title: Námorná polícia a prístavná bezpečnosť
      subtitle: Zadržiavanie, hliadky, nástupné operácie
      description: Námorné policajné jednotky potrebujú plavidlá schopné rýchleho prenasledovania, vylodenia podozrivých a hliadkovania prístavnej bezpečnosti. Tieto lode musia mať bezpečné skladovanie pre výcvikové vybavenie a zbrane, komunikačnú integráciu s pozemným velením a dostatočný priestor na palube pre operácie tímu na vylodenie. Nočné operačné schopnosti a nenápadné priblíženie sú nevyhnutné pre misie prerušovania.
      features:
        - Schopnosť vysokorýchlostného prenasledovania — plánovací trup s+ maximálnou rýchlosťou 40 uzlov
        - Zabezpečte skrinky na zbrane a úložné priestory na výbavu
        - Integrácia konzoly pre policajné rádio, MDT a komunikačné systémy
        - 'Balík nočných operácií: IR reflektor, FLIR montáž, tajné osvetlenie'
        - Spevnená nástupná plošina s protišmykovým povrchom
        - Modro/červené núdzové osvetlenie a sirénový systém
    - title: Dobrovoľnícke SAR a neziskové organizácie
      subtitle: Grantom financované, komunitné pobrežné a jazerné operácie
      description: Komunitné záchranné skupiny pôsobia v jazerách, riekach a pobrežných oblastiach, kde je vládne SAR pokrytie obmedzené. Tieto organizácie, často financované darmi alebo vládnymi grantmi, potrebujú maximálnu kapacitu na jeden dolár — spoľahlivé, nenáročné plavidlo, ktoré dobrovoľníci môžu bezpečne obsluhovať s minimálnym špecializovaným výcvikom. Cykly získavania grantov znamenajú, že lode musia spĺňať požiadavky na súlad a zároveň dodržiavať pevné rozpočty.
      features:
        - Konfigurácia s jedným vonkajším motorom optimalizovaná pre nižšie obstarávacie a prevádzkové náklady
        - PVC Konštrukcia pre nižšiu údržbu a jednoduchšiu opravu v teréne
        - Multifunkčná konzola minimalizujúca elektronickú zložitosť pre dobrovoľných operátorov
        - Balík dokumentácie o dodržiavaní grantov pre žiadosti o financovanie
        - Ľahký dizajn pre spúšťanie na pláž bez samostatného prívesu alebo žeriavu
    - title: Záchrana pri povodniach a reakcia na katastrofy
      subtitle: Vnútrozemské záplavy, plytká voda, prostredia plné trosiek
      description: Záchrana pri povodniach je samostatný operačný profil — lode operujú v zaplavených mestských oblastiach, prúdoch plných trosiek a v extrémne plytkej vode, kde sú ponorené prekážky neviditeľné. Prevádzkovatelia potrebujú plavidlá, ktoré dokážu prechádzať zaplavenými ulicami, tlačiť sa cez trosky a vyťahovať obete z budov a vozidiel. Schopnosť plytkého ponoru je kľúčová, rovnako ako schopnosť operovať v prúde s nebezpečenstvom zachytení. Tieto člny často nasadzujú hasičské zbory, civilná obrana a mimovládne organizácie na pomoc pri katastrofách.
      features:
        - Trup s ultra-plytkým ponorom — operuje v hĺbke 30-50 cm
        - Predná časť odkláňajúca úlomky a zosilnená rúrková ochrana pred ponorenými prekážkami
        - Samo-vypúšťacia paluba pre odtok povodňovej vody a vyzdvihovanie obetí
        - Vysoko viditeľné oranžové alebo žlté trubice pre letecký prieskum
        - Ľahký dizajn pre prepravu vrtuľníkov a nasadenie na cestách
        - Zosilnené zdvíhacie body pre záchranné operácie s výťahmi a lanom
