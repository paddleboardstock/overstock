content_benefits:
  tagline: Mga Benepisyo ng Pakikipagsosyo
  title: Bakit Mga Distributor<br />Piliin Paddle Board Overstock
  subtitle: Isang pakikipagsosyo na dinisenyo para sa mga tagapamahagi ng dagat na nangangailangan ng maaasahang suplay, mapagkumpitensyang kita, at propesyonal na suporta.
  items:
    - title: Proteksyon ng Teritoryo
      description: Eksklusibo o semi-eksklusibong karapatan sa teritoryo para sa mga kwalipikadong distributor. Pagsusuri ng merkado at pamamahala ng salungatan sa channel upang maprotektahan ang iyong pamumuhunan sa pagbuo ng tatak na Paddle Board Overstock sa iyong rehiyon.
      icon: tabler:map-pin
    - title: Mapagkumpitensyang Presyo ng Maramihang Bili
      description: Pagpepresyo na may iba't ibang antas batay sa taunang dami ng pangako. Istruktura ng pagpepresyo na nagpoprotekta sa margin na may paunang garantiya sa presyo at malinaw na paghahati-hati ng gastos (FOB batay sa Qingdao).
      icon: tabler:currency-dollar
    - title: Kumpletong Gabay sa Suporta sa Marketing
      description: Propesyonal na potograpiya ng produkto, mga sheet ng espesipikasyon, mga template ng dokumentasyon ng pagsunod, nilalaman para sa social media, at mga co-branded na materyales sa marketing. Ina-update taun-taon kasama ang mga bagong paglulunsad ng produkto.
      icon: tabler:photo
    - title: Pagsasanay sa Teknikal
      description: Pagsasanay sa produkto para sa iyong sales team (virtual o on-site), pagsasanay sa pagpapanatili at pag-aayos para sa iyong mga service technicians, at mga FAQ at gabay sa pag-troubleshoot para sa mga customer.
      icon: tabler:school
    - title: Mga Bahagi at Pagkatapos ng Pagbenta
      description: Itinalagang suplay ng mga ekstrang piyesa na may prayoridad na pagpapadala. Magagamit ang mga kapalit na bahagi ng tubo, balbula, palikpik, at mga kit sa pagkukumpuni para sa mabilis na pagtupad ng order. Suporta sa pagproseso ng pag-angkin ng warranty.
      icon: tabler:tool
    - title: Dokumentasyon ng Pagsunod
      description: 'Kumpletong pakete ng dokumentasyon para sa pagsunod sa regulasyon para sa inyong merkado: CE DoC, datos ng builder plate, mga manual ng may-ari, at suporta sa pagrerehistro sa regulasyon. Pinawi ang inyong pasanin sa pagsunod.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Kung Ano ang Hinahanap Namin
  title: Distributor<br />Mga Kinakailangan
  subtitle: Naghahanap kami ng mga kasosyo na makakapag-representa at makakatulong sa Paddle Board Overstock na mga produkto nang propesyonal sa kanilang teritoryo.
  items:
    - title: Kaalaman sa Teritoryo at Merkado
      description: Itinatag na presensya sa merkado ng dagat, palakasan sa tubig, o panlabas na libangan. Pag-unawa sa lokal na regulasyon, kagustuhan ng mga mamimili, at mga daluyan ng pamamahagi para sa mga produktong sasakyang-pampalakasan sa tubig.
      icon: tabler:target
    - title: Karanasan sa Industriya
      description: Minimum na 2 taon ng karanasan sa pamamahagi ng kagamitan sa dagat, panlabas, o pampalakasan. Napatunayang karanasan sa pagtatrabaho sa mga internasyonal na tatak at B2B operasyon ng pakyawan.
      icon: tabler:briefcase
    - title: Showroom o Bodega
      description: Pisikal na pasilidad para sa pagpapakita ng produkto, imbakan ng imbentaryo, at serbisyo sa customer. Kakayahang mapanatili ang mga demo unit at imbentaryo ng mga ekstrang bahagi para sa iyong teritoryo.
      icon: tabler:building-store
    - title: Pangako sa Mga Pamantayan ng Tatak
      description: Kahandaang panatilihin ang mga pamantayan sa presentasyon ng tatak na Paddle Board Overstock, magbigay ng suporta sa customer ayon sa aming mga protocol sa serbisyo, at lumahok sa taunang pagsasanay sa produkto.
      icon: tabler:star
content_process:
  tagline: Proseso ng Aplikasyon
  title: 4-Hakbang na Dealer<br />Proseso ng Aplikasyon
  subtitle: Mula sa paunang pagtatanong hanggang sa unang pagpapadala — isang tuwirang proseso ng pagsisimula.
  steps:
    - number: '01'
      title: Paunang Pagtatanong at Kwalipikasyon
      description: Isumite ang iyong aplikasyon bilang distributor kasama ang mga detalye ng kumpanya, lugar na nais sakupin, kasalukuyang mga linya ng produkto, at tinatayang taunang dami. Susuriin namin ito sa loob ng 5 araw ng trabaho.
      timeline: 5 araw
    - number: '02'
      title: Pagsusuri ng Negosyo at Mga Tuntunin
      description: Virtual na pulong upang talakayin ang estratehiya sa teritoryo, mga antas ng presyo, at mga tuntunin ng pakikipagsosyo. Suriin ang mga kinakailangan sa dokumentasyon ng pagsunod para sa iyong merkado. NDA pirma kung kinakailangan.
      timeline: 1-2 linggo
    - number: '03'
      title: Halimbawa ng Order at Pagsusuri
      description: Maglagay ng paunang sample na order (2-5 yunit) sa presyo ng distributor para sa pagsusuri ng merkado at pagsasanay ng koponan. Kasama ang kompletong dokumentasyon ng pagsunod at paghahanda para sa demo.
      timeline: 30-45 na araw
    - number: '04'
      title: Pagsisimula at Suporta ng Pakikipagsosyo
      description: Unang order ng lalagyan na may aktibong proteksyon sa teritoryo. Naipadala na ang marketing kit, na-train ang sales team, at naitalaga na ang dedikadong account manager. Patuloy na pagrepaso ng negosyo tuwing quarter.
      timeline: Patuloy
content_application_docs:
  tagline: Mga Dokumento ng Aplikasyon
  title: Mga Kinakailangang Dokumento<br />para sa Aplikasyon ng Dealer
  subtitle: Upang mag-apply para sa isang Paddle Board Overstock dealership, mangyaring ihanda ang mga sumusunod na dokumento at impormasyon para sa aming review team.
  items:
    - title: Sertipiko ng Pagpaparehistro ng Negosyo
      description: Wastong dokumento ng pagpaparehistro ng kumpanya na nagpapakita ng legal na pangalan ng entidad, rehistradong address, at saklaw ng negosyo na sumasaklaw sa pamamahagi ng kagamitan para sa dagat, sports, o panlabas na aktibidad.
      icon: tabler:file-text
    - title: Plano ng Saklaw ng Teritoryo
      description: Heograpikong teritoryo ng interes, umiiral na retail o distribusyon na network, target na mga segment ng customer, at iminungkahing taunang dami ayon sa kategorya ng produkto (RIB, SUP, kayak).
      icon: tabler:map
    - title: Kakayahan ng Showroom o Bodega
      description: Pisikal na pasilidad para sa pagpapakita ng produkto, imbakan ng imbentaryo, at serbisyo sa customer. Mga larawan o plano ng sahig na nagpapakita ng lugar para sa demo at kapasidad ng imbakan ng mga ekstrang bahagi.
      icon: tabler:building
    - title: Pahayag ng Kakayahang Pinansyal
      description: 'Sanggunian sa bangko o pahayag na pinansyal na nagpapatunay ng kakayahang maglagay ng unang order ng container at mapanatili ang imbentaryo. Pinakamaliit na paunang order: isang 20ft na container (10-20 yunit na halo-halong modelo).'
      icon: tabler:coin
    - title: Kakayahan sa Suporta Pagkatapos ng Pagbenta
      description: Mga tekniko sa serbisyo na sinanay o maaaring sanayin para sa pagpapanatili at pagkukumpuni ng inflatable na bangka. Kakayahan sa pagproseso ng warranty claim at pagtatalaga ng imbentaryo ng mga piyesa.
      icon: tabler:tool
    - title: Mga Nakaraang Sanggunian ng Tatak
      description: Listahan ng kasalukuyan o dating marine/sports equipment brands na naipamahagi. Magagamit ang mga contact reference kapag may mutual na kasunduan. Maaaring kwalipikado ang mga startup na walang karanasang pamamahagi kung may mas malakas na pangakong pinansyal.
      icon: tabler:users
faq:
  title: Programa ng Tindahan ng Sasakyan — Madalas Itanong na Mga Tanong
  questions:
    - q: Ano ang pinakamababang dami ng order para sa mga distributor?
      a: Nagsisimula ang distributor MOQ sa 10-20 yunit bawat order, na may kakayahang pagsamahin ang iba't ibang modelo (RIB, inflatable, SUP). Ang mga paunang sample na order na 2-5 yunit ay available sa presyo ng distributor para sa pagsusuri ng merkado.
    - q: Nag-aalok ba kayo ng eksklusibong karapatan sa teritoryo?
      a: Magagamit ang eksklusibong karapatan sa teritoryo para sa mga kwalipikadong distributor na nakakatugon sa taunang volume na kinakailangan at nagpapanatili ng pamantayan ng tatak. Magagamit din ang semi-eksklusibo at hindi eksklusibong mga kaayusan para sa mga umuusbong na merkado.
    - q: Anong suporta sa marketing ang inyong ibinibigay?
      a: Nagbibigay kami ng komprehensibong marketing kit kabilang ang propesyonal na potograpiya ng produkto, mga sheet ng espesipikasyon, mga template ng dokumentasyon ng pagsunod, aklatan ng nilalaman para sa social media, at mga materyales na may co-brand. Ina-update taun-taon kasama ng mga bagong paglulunsad ng produkto.
    - q: Paano hinahandle ang mga warranty claim?
      a: 'Ang mga distributor ang nagsisilbing unang punto ng pakikipag-ugnayan para sa mga pag-aangkin ng warranty. Nagbibigay kami ng malinaw na pamantayan sa warranty, mga protocol para sa dokumentasyon ng larawan, at mabilis na proseso ng pagpapalit o kredito. Mga termino ng warranty: 5-taong limitadong warranty sa tela/seams/hull ng bangka; 2-taon sa SUP at mga accessories.'
    - q: Maaari ko bang ilagay ang pribadong tatak sa mga produktong Paddle Board Overstock sa ilalim ng aking sariling brand?
      a: Oo, sa pamamagitan ng aming OEM/ODM na programa. Kasama sa mga opsyon para sa private-label ang pasadyang graphics ng tubo, branding ng console, packaging sa tingi, at dokumentasyon ng pagsunod sa ilalim ng iyong pangalan ng tatak. Tingnan ang aming OEM/ODM na pahina ng serbisyo para sa mga detalye.
    - q: Anong dokumentasyon ng pagsunod ang kasama para sa mga distributor?
      a: Kasama sa bawat pagpapadala ang DoC na tiyak sa modelo na CE, data ng builder plate, mga manwal ng may-ari, at dokumentasyon sa pagpapadala. Nagbibigay din kami ng suporta para sa pagpaparehistro sa regulasyon para sa iyong teritoryo at tumutulong sa anumang lokal na pangangailangan sa pagsunod.
