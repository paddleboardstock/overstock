        description: Pagsamahin ang matatag na all-around boards para sa mga baguhan at mga surf-style na modelo para sa mga lokal sa isang pagkakasunod-sunod
      - title: Kumpletong Mga Pakete
        description: Bawat board ay may dalang kumpletong accessory kit — paddle, pump, leash, at bag na handang ilagay sa estante
      - title: Mabilis na Opsyon sa Restock
        description: Ang express air freight ay mabilis na nakakakuha ng 1–3 board top-up sa iyong pintuan kapag naubos na ang isang modelo
      - title: Stock na Handa na para sa Display
