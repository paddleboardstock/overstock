hero:
  tagline: Mga Paaralan at Sentro ng Pagsasanay sa Water Sports
  title: Mga Solusyon sa Kagamitan<br />Para sa SUP at Mga Paaralan ng Kayak
  subtitle: Mapagkakatiwalaang kagamitan na pang-komersyal para sa mga paaralan ng paddle, pagtuturo ng surf, pagsasanay sa kayak, at mga programa sa edukasyon sa water sports sa anumang sukat.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP mga board para sa mga paaralan at sentro ng pagsasanay
direct_answer: Paddle Board Overstock nagbibigay ng suplay sa SUP at mga paaralan ng kayak sa buong mundo ng mga board na pang-komersyal, kagamitan pangkaligtasan, at mga package para sa instruktor. Ang aming kagamitan ay ginawa para sa pang-araw-araw na paggamit sa pagtuturo — mas makakapal na PVC, pinatibay na drop-stitch na mga core, at matatag na disenyo ng hull na nagbibigay ng kumpiyansa sa mga nagsisimula at pagiging maaasahan sa mga instruktor. Kasama sa mga package ang pasadyang branding, programa sa ekstrang piyesa, at mga materyales sa pagsasanay.
solution_offerings:
  - title: Package para sa Panimulang Paaralan
    subtitle: Para sa mga bagong programa at maliliit na sentro ng pagsasanay
    badge: Popular
    features:
      - title: Mga Board ng Mag-aaral
        description: 10–25 all-around SUP na board o mga recreational kayak na may matatag na plataporma para sa mga panimulang aralin
      - title: Mga Board ng Instruktor
        description: Mas malapad, mas mahahabang board na may dagdag na katatagan at mga non-slip EVA deck para sa coaching
      - title: Kagamitan sa Kaligtasan
        description: Mga life vest, leash, pito, at throw bag sa magkakatugmang kulay
      - title: Imbakan at Transportasyon
        description: Mga stackable na rack ng board, padded na cradle ng kayak, at transport dollies
      - title: Suporta sa Kurikulum
        description: Mga template ng aralin, checklist sa kaligtasan, at gabay sa pag-unlad ng kasanayan
    cta_text: Start My School Package
    cta_href: /contact
  - title: Premium na Package ng Paaralan
    subtitle: Para sa mga itinatag na paaralan at multi-program na operator
    badge: Best Value
    features:
      - title: Buong Fleet
        description: 25–50 board o kayak na may mixed fleet (all-around, touring, sukat ng youth)
      - title: Fleet ng Instruktor
        description: 3–5 na espesyal na board ng instruktor na may built-in mount para sa sound system
      - title: Istasyon ng Kaligtasan
        description: Naka-centralize na istasyon ng kagamitan pangkaligtasan na may PFD, radyo, first aid, at signage
      - title: Package ng Branding
        description: Buong pag-print ng logo sa mga board, paddle, PFD, at uniporme
      - title: Programa sa Pagpapanatili
        description: Quarterly maintenance kits, spare parts bundles, at pagsasanay sa pagkukumpuni
    cta_text: Gumawa ng Premium na Pakete
    cta_href: /contact
  - title: Pakete ng Prangkisa ng Paaralan
    subtitle: Para sa mga multi-location chain at mga franchise operator
    badge: Enterprise
    features:
      - title: Standardisasyon ng Fleet
        description: Magkaparehong kagamitan sa lahat ng lokasyon para sa pare-parehong karanasan ng estudyante
      - title: sentral na pag-aayos
        description: Pinagsamang pag-order, bulk pricing, at sentralisadong pamamahala ng spare parts
      - title: Pagsasanay ng Instruktor
        description: Sertipikasyon sa paghawak at pagpapanatili ng kagamitan para sa lahat ng instruktor
      - title: Co-Branding
        description: Pinagsamang branding kasama ang + Paddle Board Overstock mga opsyon sa co-branding ng prangkisa
      - title: Suporta sa Pagpapalawak
        description: Konsultasyon sa scaling, forecasting ng kagamitan, at pag-setup ng bagong lokasyon
    cta_text: Talakayin ang Plano ng Prangkisa
    cta_href: /contact
benefits:
  - title: Ginawa para sa Pang-araw-araw na Pagtuturo
    description: Ang mas makapal PVC at pinatibay na riles ay kayang tiisin ang pang-araw-araw na paggamit ng mga estudyante, mga patak sa buhangin, at mga batong landing.
    icon: tabler:shield
  - title: Matatag na mga Plataporma sa Pagkatuto
    description: Ang mas malapad na hull at mas patag na rocker ay nagbibigay ng kumpiyansa sa mga baguhan. Ang mga instruktor ay nakatuon sa pagtuturo, hindi sa kagamitan.
    icon: tabler:scale
  - title: Madaling Imbakan at Transportasyon
    description: Mga inflatable na disenyo ng imbakan sa maliliit na espasyo. Ang mga deflated na tabla ay kasya sa mga karaniwang trunk ng sasakyan para sa mobile na pagtuturo.
    icon: tabler:box-seam
  - title: Pasadyang Pagba-brand
    description: Mga logo at kulay ng paaralan sa bawat board. Ang iyong brand, ang iyong pagkakakilanlan — hindi ang karaniwang paupahang gamit.
    icon: tabler:brush
content_segments:
  tagline: Mga Profile ng Paaralan
  title: Mga Solusyon sa Edukasyon sa Palakasan sa Tubig<br />Ayon sa Uri ng Programa
  subtitle: Ang mga paddle school, surf academies, university programs, at franchise operators ay may kanya-kanyang operational challenges — mula sa curriculum integration hanggang sa multi-location fleet standardization. Inaayos namin ang mga equipment package upang tumugma sa educational model.
  items:
    - title: Mga Independiyenteng SUP Paaralan at Kayak
      subtitle: Mga sentro ng pagsasanay na pinapatakbo ng may-ari
      description: Maliliit hanggang katamtamang laki ng mga paaralan na pinapatakbo ng mga may-ari at instruktor na nag-aalok SUP ng mga leksyon, pagsasanay sa kayak, at mga kurso sa sertipikasyon. Dapat matibay ang kagamitan para sa pang-araw-araw na paggamit sa pagtuturo, abot-kaya para sa badyet ng maliit na negosyo, at sapat na maraming gamit upang pagsilbihan ang mga baguhan hanggang intermediate na estudyante sa isang fleet.
      features:
        - Matatag na pangkalahatang SUP boards at pampalipas-oras na kayaks para sa mga panimulang aralin
        - Mga board na nakaakma sa instruktor na may dagdag na katatagan para sa pagtuturo mula sa tubig
        - Kasama ang mga template ng plano ng aralin at gabay sa progresyon ng kasanayan
        - Taunang programa sa pagpapalit ng kagamitan na may diskwento sa trade-in
    - title: Mga Programa sa Recreational ng Unibersidad at Kolehiyo
      subtitle: Malakihang fleet ng estudyante para sa palipat-lipat na libangan
      description: Mga departamento ng recreational sa unibersidad na nagpapatakbo ng paddle clubs, programa sa pagrenta, at mga kursong pangturo bilang bahagi ng mga alok sa campus recreation. Ang kagamitan ay nakakaranas ng pinakamataas na paggamit tuwing semestre, nangangailangan ng madaling sistema ng check-in/check-out, at dapat kayanin ang iba't ibang antas ng kasanayan mula sa mga estudyanteng unang beses hanggang sa mga advanced na paddler.
      features:
        - Mataas na tibay na PVC konstruksyon na angkop para sa mga cycle ng institusyon
        - Fleet na may kulay ayon sa antas ng kasanayan para sa madaling pamamahala
        - Kompatibilidad sa RFID o sticker-based na sistema ng pagbabantay sa imbentaryo
        - Presyo para sa maramihang pagbili na may semester-based na pag-order at termino ng pagbabayad
    - title: Mga Paaralan sa Surf at Surf Academies
      subtitle: Mga programang pagtuturo ng surf sa baybayin
      description: Mga surf school na nagtuturo ng SUP surfing, prone paddle, at kasanayan sa surf kayak sa mga kapaligiran sa dagat. Ang kagamitan ay dapat kayanin ang kondisyon sa surf zone — pagtitiis sa impact, katatagan sa buhangin at maalat na tubig, at madaling paghuhugas at pagbabalik sa pagitan ng mga aralin kada oras.
      features:
        - Mga surf-specific na hugis na may pinalakas na rails at konstruksyon na matibay sa impact
        - Opsyon sa soft-fin at coiled leashes para sa kaligtasan ng estudyante
        - Fabric na madaling banlaw at matuyo sa pagitan ng mga aralin
        - Programa sa pagpapalit ng fleet na may inspeksyon sa katapusan ng season at refresh
    - title: Franchise at Multi-Location Chains
      subtitle: Pamantayang kagamitan sa lahat ng lokasyon
      description: Mga multi-location operator na nagpapatakbo ng pamantayan na programa sa pagsasanay sa maraming lungsod o rehiyon. Ang consistency ng fleet sa lahat ng lokasyon ay napakahalaga — bawat estudyante ay dapat magkaroon ng parehong karanasan sa kagamitan kahit saan na lokasyon ng franchise sila bumisita. Sentralisadong pag-order, branded na pagkakaisa, at suporta sa scaling ay mahalaga.
      features:
        - Magkakaparehong detalye ng fleet sa lahat ng lokasyon ng franchise
        - Sentralisadong pinagsama-samang pag-order na may volume pricing
        - 'Opsyon sa co-branding: franchise brand + Paddle Board Overstock co-brand'
        - 'Kit para sa bagong lokasyon: kagamitan, signage, at panimulang imbentaryo'
