hero:
  tagline: Kaalamang Pangmarino
  title: Mga Dekadang Karanasan sa Marine Engineering<br />sa Bawat Katawan ng Barko
  subtitle: Paddle Board Overstock pinagsasama ang malalim na kaalaman sa agham ng materyal, tumpak na paggawa, at totoong pagsusuri upang makagawa ng mga sasakyang pandagat na gumaganap kapag mahalaga.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock koponan ng marine engineering at R&D sa trabaho
expertise_materials:
  tagline: Agham ng Materyales
  title: Pagpili ng Tamang Materyal<br />para sa Bawat Aplikasyon
  subtitle: Nakikipagtulungan kami sa tatlong pangunahing materyales — bawat isa ay pinili para sa tiyak na gamit at mga kinakailangan sa pagganap.
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: 1100 denier PVC na tela — ang aming pinaka-multifunctional na materyal. UV-nakatatag, lumalaban sa gasgas, at REACH na sumusunod sa pamantayan. Ideal para sa mga recreational na bangka, SUP boards, at mga kayak kung saan mahalaga ang timbang at kahusayan sa gastos.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Nangingibabaw na resistensya sa kemikal at UV na katatagan. Ang Hypalon bangka ay maaaring tumagal ng 15-20 taon kung maayos ang pangangalaga. Inirerekomenda para sa commercial, rescue, at military na aplikasyon kung saan kritikal ang pangmatagalang tibay.
      icon: tabler:shield
    - title: Fiberglass at Aluminum
      description: Deep-V fiberglass hulls para sa RIBs at patrol na mga bangka — wave-slicing na pagganap sa magaspang na kundisyon. Aluminum hulls para sa heavy-duty commercial workboats na nangangailangan ng pinakamataas na lakas at kapasidad ng karga.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Kakayahan sa Paggawa
  title: Tumpak na Paggawa<br />sa Bawat Hakbang
  subtitle: Ang aming 12,000 m² na pasilidad ay may kagamitan na espesyal para sa bawat yugto ng produksyon.
  columns: 2
  items:
    - title: CNC Pagputol
      description: Ang computer-controlled na pagputol ay nagsisiguro ng tumpak, paulit-ulit na mga panel ng tela na may minimal na basura. Ang bawat piraso ay bumabagay eksakto ayon sa disenyo.
      icon: tabler:cpu
    - title: High-Frequency na Pagsasali
      description: Ang industrial HF welding ay lumilikha ng seams na mas malakas kaysa sa base material. Ang tuloy-tuloy na kontrol sa temperatura at presyon ay nagsisiguro ng airtight seals sa bawat batch ng produksyon.
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: Libu-libong polyester threads ang nag-uugnay sa itaas at ibabang layer ng tela, na nagpapahintulot ng mataas na pressure inflation (15-20 PSI) para sa matibay at matatag na SUP boards at floors.
      icon: tabler:building-arch
    - title: Pagsusuri ng Presyon
      description: Bawat inflatable na produkto ay sinusuri sa pressure bago ipadala. Ang RIB tubes ay sinusuri sa 1.25x na rated pressure — kung mananatili ito, gagana ito sa tubig.
      icon: tabler:wind
    - title: Pagsusuri ng Lakas ng Tahi
      description: Random na mga sample mula sa bawat batch ng produksyon ay sumasailalim sa destructive seam strength testing. Ang mga resulta ay itinatala at maaring masubaybayan sa tiyak na batch ng produksyon.
      icon: tabler:files
    - title: Pagsusuri sa Tubig
      description: Bawat RIB na modelo ay sumasailalim sa pagsubok sa dagat bago makakuha ng sertipikasyon. Ang pagsubok sa totoong mundo sa mga kondisyon sa baybayin ay nagpapatunay sa pagganap, paghawak, at katatagan.
      icon: tabler:ripple
expertise_design:
  tagline: Disenyo at Inhinyeriya
  title: Idinisenyo para sa Totoong Kondisyon
  subtitle: Ang aming pilosopiya sa disenyo ay nagsisimula sa kung paano gagamitin ang bangka — pagkatapos ay itinatayo ang inhinyeriya batay sa paggamit na iyon.
  items:
    - title: Disenyo ng Kalupaan na Deep-V
      description: Ang aming mga fiberglass na hull ay mayroong tinantiyang mga anggulo ng deadrise na na-optimize para sa haba at layunin ng bawat modelo. Mas matarik na V para sa pagganap sa magulong tubig, mas mababaw para sa katatagan.
    - title: Maramihang Silid na Kaligtasan
      description: Bawat bangka ay may 3-7 independenteng silid na puno ng hangin. Kung ang isang compartment ay masisira, ang natitirang mga silid ay nagpapanatiling lumulutang at gumagana ang bangka.
    - title: Ergonomikong Layout
      description: Ang posisyon ng console, taas ng tubo, at pagkakalagay ng upuan ay idinisenyo para sa kaginhawaan ng operator sa matagal na paggamit — maging sa pagbabantay, pangingisda, o pagbibiyahe.
    - title: Pasadyang Pagkakaayos
      description: Mga kulay ng tubo, configuration ng console, kapasidad ng gasolina, mga mount ng accessory — ang bawat modelo ay maaaring i-customize upang tumugma sa mga tiyak na pangangailangan sa operasyon.
