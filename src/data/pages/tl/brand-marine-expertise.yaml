hero:
  tagline: Kadalubhasaan sa Dagat
  title: Mga Dekadang Karanasan sa Marine Engineering<br />sa Bawat Board
  subtitle: Paddle Board Overstock pinagsasama ang malalim na agham sa materyal, tumpak na paggawa, at pagsubok sa totoong mundo upang makagawa ng mga board na gumagana kapag mahalaga.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock pangkat ng marine engineering at R&D sa trabaho
expertise_materials:
  tagline: Agham ng Materyales
  title: Pagpili ng Tamang Materyal<br />para sa Bawat Aplikasyon
  subtitle: Nakikipagtulungan kami sa tatlong pangunahing materyales — bawat isa ay pinili para sa tiyak na gamit at mga kinakailangan sa pagganap.
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: 1100 denier PVC na tela — ang aming pinaka-multipurpose na materyal. UV -stabilized, lumalaban sa pagkasira, at nasubok na sa panahon. Ideal para sa SUP boards kung saan mahalaga ang bigat, tigas, at kahusayan sa gastos.
      icon: tabler:droplet
    - title: Drop-Stitch Puso
      description: Libu-libong hibla ng polyester ang nag-uugnay sa ibabaw at ilalim na mga layer ng tela, na nagpapahintulot ng mataas na presyon ng inflation (15 PSI) para sa matibay at matatag na biyahe na maaari pa ring i-roll up sa isang backpack.
      icon: tabler:building-arch
    - title: EVA Deck Foam
      description: Grooved, high-density EVA foam nagbibigay ng buo-habang grip, cushioning para sa pagkahulog, at isang canvas para sa aming signature art-series decks.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Kakayahan sa Paggawa
  title: Tumpak na Paggawa<br />sa Bawat Hakbang
  subtitle: Ang aming 12,000 m² na pasilidad ay may kagamitan na espesyal para sa bawat yugto ng produksyon.
  columns: 2
  items:
    - title: CNC Pagputol
      description: Ang computer-controlled na pagputol ay nagsisiguro ng tumpak, paulit-ulit na mga panel ng tela na may minimal na basura. Ang bawat piraso ay bumabagay eksakto ayon sa disenyo.
      icon: tabler:cpu
    - title: High-Frequency na Pagsasali
      description: Ang industrial HF welding ay lumilikha ng seams na mas malakas kaysa sa base material. Ang tuloy-tuloy na kontrol sa temperatura at presyon ay nagsisiguro ng airtight seals sa bawat batch ng produksyon.
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: Libu-libong polyester threads ang nag-uugnay sa itaas at ibabang layer ng tela, na nagpapahintulot ng mataas na pressure inflation (15-20 PSI) para sa matibay at matatag na SUP boards at floors.
      icon: tabler:building-arch
    - title: Pagsusuri ng Presyon
      description: Bawat board ay sinusubok sa presyon bago ipadala, hinahawakan sa 1.25x rated pressure — kung tatagal ito, gagana ito sa tubig.
      icon: tabler:wind
    - title: Pagsusuri ng Lakas ng Tahi
      description: Random na mga sample mula sa bawat batch ng produksyon ay sumasailalim sa destructive seam strength testing. Ang mga resulta ay itinatala at maaring masubaybayan sa tiyak na batch ng produksyon.
      icon: tabler:files
    - title: Pagsusuri sa Tubig
      description: Bawat disenyo ng board ay sumasailalim sa mga pagsubok sa totoong tubig. Ang totoong panlalangoy sa baybaying katubigan ay nagpapatunay ng pagganap, kontrol, at katatagan.
      icon: tabler:ripple
expertise_design:
  tagline: Disenyo at Inhinyeriya
  title: Idinisenyo para sa Totoong Kondisyon
  subtitle: Ang aming pilosopiya sa disenyo ay nagsisimula sa kung paano gagamitin ang board — pagkatapos ay binubuo ang engineering batay sa paggamit na iyon.
  items:
    - title: Hugis at Balangkas ng Lupon
      description: Ang haba, lapad, at rocker ay iniangkop para sa layunin ng bawat modelo — mas mahahabang disenyo para sa touring para sa pagdulas, mas malalapad na hugis para sa katatagan at yoga.
    - title: Pagtibay ng Riles at Stringer
      description: Ang mga pinalakas na riles at gitnang stringers ay nagdaragdag ng katatagan at sumisipsip ng mga impactos — sa mga lugar kung saan madalas tamaan ang mga board taon-taon.
    - title: Ayos ng Deck at Hatak
      description: Ang lugar ng pagtayo, pagkakalagay ng hawakan, mga D-ring mount, at mga sona ng traksyon ay idinisenyo ayon sa totoong mga postura sa paddle — maging ito man ay pag-cruise, pangingisda, o pag-practice ng yoga.
    - title: Serye ng Sining at Kulay
      description: Ang sining sa deck, mga scheme ng kulay, at mga mount para sa aksesorya — ang bawat serye ay idinisenyo upang tumugma sa isang natatanging personalidad sa pag-paddle.
cta:
  title: Mayroon ka bang partikular na aplikasyon sa isip?
  subtitle: Makakatulong ang aming koponan sa pagpili ng tamang board, sukat, at kagamitan para sa iyong estilo ng pagpala.
  actions:
