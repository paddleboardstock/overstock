hero:
  tagline: Proseso
  title: Proseso ng Paggawa
  subtitle: Mula sa hilaw na materyales hanggang sa bangkang handa sa dagat — bawat hakbang ay nasa aming kontrol
  back_label: Bumalik sa Pabrika
  back_link: /factory
intro: Hindi tulad ng mga brand na nag-o-outsource ng produksyon sa mga third-party na pabrika, Paddle Board Overstock sila ang nagmamay-ari at nagpapatakbo ng buong manufacturing chain nito. Ang vertical integration na ito ay nagbibigay-daan sa amin na mapanatili ang mahigpit na quality control sa bawat yugto, mabilis na tumugon sa mga custom na pangangailangan, at maghatid ng pare-parehong kalidad ng produkto batch pagkatapos ng batch. Ganito ginagawa ang isang bangka sa aming pasilidad.
steps:
  - step: '01'
    title: Pagtanggap at Inspeksyon ng Materyales
    description: Bawat papasok na batch ng PVC tela, fiberglass mat, resin, at hardware ay iniinspeksyon ayon sa mga espesipikasyon. Sinusuri ang mga sample ng tela para sa tensile strength, kapal, pagkakapare-pareho, at UV resistensya bago ilabas sa produksyon. Ang mga hindi sumusunod na materyales ay ini-quarantine at ibinabalik.
    duration: 1–2 araw
  - step: '02'
    title: Awtomatikong PVC Pagputol
    description: Ang mga aprubadong tela ay inilalagay sa awtomatikong CNC cutting machine at pinuputol nang may sub-millimetre na katumpakan. Ang computer-optimised nesting ay nag-aayos ng mga panel upang mabawasan ang basura — karaniwang mas mababa sa 5%. Ang mga pinutol na panel ay nilalagyan ng label ayon sa modelo ng bangka at chamber, pagkatapos ay pinagsama-sama para ilipat sa welding workshop.
    duration: 2–4 na oras bawat boat kit
  - step: '03'
    title: Tube Heat Sealing at Welding
    description: Ang mga panel ay tinatack at pinagdikit gamit ang mga heat sealing machine na may hot-air welding sa kontroladong temperatura na 200–600 °C. Ang mga pangunahing tahi ay pinalakas ng RF dielectric welding para sa airtight, high-strength joints. Ang mga natapos na chamber ay pinapalaking sa 1.25× working pressure para sa 30-minutong air-retention validation.
    duration: 1–2 araw bawat bangka
  - step: '04'
    title: Fiberglass RIB Hul Moulding
    description: RIB Ang mga hull ng bangka ay ginagawa gamit ang hand-lay-up fibreglass moulding. Ang mga layer ng fiberglass mat at hinabing roving ay mano-manong pinaparolyo gamit ang polyester o vinylester resin sa precision moulds. Bawat layer ay vacuum-bagged para sa pare-parehong kalidad ng laminate. Ang hull ay tinatapos gamit ang gelcoat para sa mataas na makintab at UVmatibay na marine surface.
    duration: 2–4 na araw bawat hull
  - step: '05'
    title: Pagpi-print at Dekorasyon ng SUP
    description: Ang SUP board deck graphics ay inilalapat gamit ang digital printing para sa full-colour na disenyo na may kalidad ng larawan, at screen printing para sa matitibay na logo at paulit-ulit na pattern. Ang mga print ay pinatuyo at tinatakan para sa UV resistensya sa abrasion.
    duration: 1–2 araw
  - step: '06'
    title: Pangwakas na Assembly at Rigging
    description: Ang fiberglass hulls at PVC tube assemblies ay nakakabit sa assembly line. Nakakabit ang makina, nakakabit ang steering at throttle controls, naka-install ang fuel system, at naka-wire ang buong electrical harness. Bawat bangka ay sumusunod sa 100-point assembly checklist na may obligadong sign-off sa bawat yugto.
    duration: 2–3 araw
  - step: '07'
    title: Pagsusuri at Pag-inspeksyon ng Kalidad
    description: 'Bawat natapos na bangka ay dumadaan sa mandatory quality gate: chamber air-retention test, systems function check, fastener torque verification, at cosmetic inspection. Ang custom at prototype builds ay sumasailalim din sa in-water sea trials na sumasaklaw sa bilis, handling, stability, at endurance.'
    duration: 1–2 araw
  - step: '08'
    title: Pag-iimpake at Pagpapadala
    description: Ang mga bangka ay dini-deflat, tinutupi ayon sa proseso, iniiimpake sa mabibigat na hinabing bag o plywood crates, at niloload para sa pagpapadala. Bawat pakete ay may label na modelo, serial number, at destinasyon. Nakikipag-ugnayan kami sa mga freight forwarder para sa FCL at LCL container shipments sa buong mundo.
    duration: 1 araw
