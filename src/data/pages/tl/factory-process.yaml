hero:
  tagline: Proseso
  title: Proseso ng Paggawa
  subtitle: Mula sa hilaw na materyal hanggang sa board na handa na para sa dagat — bawat hakbang ay nasa aming kontrol
  back_label: Bumalik sa Pabrika
  back_link: /factory
intro: Hindi katulad ng mga tatak na nag-o-outsource ng produksyon sa mga third-party na pabrika, ang Paddle Board Overstock ay pag-aari at pinapatakbo ang buong manufacturing chain nito. Ang vertical integration na ito ay nagpapahintulot sa amin na mapanatili ang mahigpit na kontrol sa kalidad sa bawat yugto at maibigay ang pare-parehong kalidad ng produkto batch matapos ang batch. Ganito ginagawa ang paggawa ng board sa aming pasilidad.
steps:
  - step: '01'
    title: Pagtanggap at Inspeksyon ng Materyales
    description: Bawat bagong batch ng PVC tela, drop-stitch core, EVA foam, at hardware ay iniinspeksyon ayon sa espesipikasyon. Ang mga sample ng tela ay sinusuri para sa lakas ng paghila, pagkakapare-pareho ng kapal, at UV na paglaban bago ilabas sa produksyon. Ang mga materyales na hindi naaayon sa pamantayan ay ikinakulong at ibinabalik.
    duration: 1–2 araw
  - step: '02'
    title: Awtomatikong PVC Pagputol
    description: Ang mga inaprubahang tela ay inilalatag sa awtomatikong CNC cutting machine at pinuputol nang may sub-milimetrong katumpakan. Ang computer-optimised na pag-aayos ng nesting ay naglalagay ng mga panel upang mabawasan ang basura — karaniwang mas mababa sa 5%. Ang mga pinutol na panel ay nilalagyan ng label ayon sa modelo ng board at kamara, pagkatapos ay binubuo para ilipat sa welding workshop.
    duration: 2–4 na oras bawat kit ng board
  - step: '03'
    title: Tube Heat Sealing at Welding
    description: Ang mga panel ay tinatack at pinagdikit gamit ang mga heat sealing machine na may hot-air welding sa kontroladong temperatura na 200–600 °C. Ang mga pangunahing tahi ay pinalakas ng RF dielectric welding para sa airtight, high-strength joints. Ang mga natapos na chamber ay pinapalaking sa 1.25× working pressure para sa 30-minutong air-retention validation.
    duration: 1–2 araw bawat lupon
  - step: '04'
    title: Deck Art at EVA Pagpapaayos
    description: 'Humuhubog dito ang mga art-series na deck: ang mga precision-cut na EVA foam panel ay inilalagay sa buong pattern ng deck, pinagdudugtong, at pinapapino sa pamamagitan ng kamay. Madikit, komportable, at matibay — ang natatanging anyo ng bawat art-series na board.'
    duration: 1–2 araw
  - step: '05'
    title: Pagpi-print at Dekorasyon ng SUP
    description: Ang SUP board deck graphics ay inilalapat gamit ang digital printing para sa full-colour na disenyo na may kalidad ng larawan, at screen printing para sa matitibay na logo at paulit-ulit na pattern. Ang mga print ay pinatuyo at tinatakan para sa UV resistensya sa abrasion.
    duration: 1–2 araw
  - step: '06'
    title: Pangwakas na Assembly at Rigging
    description: 'Natanggap ng mga board ang kanilang mga huling bahagi: ang mga balbula ay tinutuwid at tinetest ang kanilang paggana, ang mga D-ring, hawakan, at fin box ay nakakabit, at ang attachment ng leash ay nakaseguro. Ang bawat board ay sumusunod sa isang 100-point na checklist ng pag-assemble na may obligadong paglagda sa bawat yugto.'
    duration: 2–3 araw
  - step: '07'
    title: Pagsusuri at Pag-inspeksyon ng Kalidad
    description: 'Ang bawat tapos na board ay dumadaan sa obligadong quality gate: pagsusuri ng pagpapanatili ng hangin sa chamber, pag-check ng function ng mga sistema, pagberipika ng torque ng mga fastener, at inspeksyon ng kosmetiko. Ang mga custom at prototype na build ay sumasailalim din sa in-water sea trials na sumasaklaw sa bilis, paghawak, katatagan, at tibay.'
    duration: 1–2 araw
  - step: '08'
    title: Pag-iimpake at Pagpapadala
    description: Ang mga board ay pinapalambot, iniikot, at inilalagay sa mga backpack para sa paglalakbay kasama ang pump, paddle, fin, leash, at repair kit, pagkatapos ay inilalagay sa kahon para sa courier at kargamento. Bawat pakete ay may label ng modelo, serial number, at destinasyon. Nagpapadala kami sa 50+ bansa sa buong mundo.
    duration: 1 araw
cta:
  title: Tingnan ang aming kagamitan at makinarya
  desc: Siyasatin ang kagamitan na pang-industriya sa likod ng bawat Paddle Board Overstock board.
  label: Tingnan ang kagamitan →
  link: /factory/equipment
tldr:
  summary: Paddle Board Overstock ay dumadaan sa mahigpit na multi-stage na proseso ng pagmamanupaktura mula sa inspeksyon ng hilaw na materyal hanggang sa pagputol, pag-welding, sining sa deck at EVA pagtatapos, pag-assemble, 1.25x rated na pagsubok sa presyon, at panghuling QC. 100% ng mga board ay nasubukan sa presyon, 99.3% walang depekto.
  points:
    - 'Inspeksyon ng hilaw na materyal: tensile, tear, UV testing'
    - Awtomatikong CNC pagputol at high-frequency RF welding
    - Manu-manong inassemble na EVA sining sa deck na may zero-fade blocks
    - 1.25x rated na pagpigil sa presyon sa loob ng 24-48h sa bawat yunit
    - 100-point na panghuling inspeksyon sa bawat board
