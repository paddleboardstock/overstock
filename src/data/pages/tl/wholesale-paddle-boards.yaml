hero:
  tagline: Wholesale SUP Boards
  title: Maramihang Inflatable Paddle Boards<br />para sa Maliliit na Negosyo
  subtitle: Bagong-bagong SUP overstock boards sa dami na angkop sa maliliit na negosyo. Mag-order ng 5–20 boards, pagsamahin ang anumang modelo sa isang shipment, at pumili ng express air o sea freight papuntang 50+ bansa.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Maramihang inflatable SUP boards mula sa Paddle Board Overstock handang ipadala
direct_answer: Paddle Board Overstock Nagbibigay ng mga bagong overstock inflatable SUP boards sa maliliit na retailer sa buong mundo. Walang malaking minimum order — nagsisimula ang wholesale order sa 5 boards lamang, at maaari mong pagsamahin ang anumang in-stock na modelo sa isang order. Ang mga board ay ipinapadala mula sa aming base sa Weihai, China sa pamamagitan ng express air freight (1–3 boards, samples, o urgent restocks) o consolidated sea freight (5–20 board retailer orders). Bawat board ay 100% pressure-tested bago ipadala at sakop ng aming 2-Taong SUP Warranty.
tldr_points:
  - 'Mababa MOQ: nagsisimula ang mga wholesale order sa 5 boards — sukat para sa maliliit na tindahan, hindi para sa container loads'
  - 'Mixed model orders: pagsamahin SUP ang anumang in-stock na modelo sa isang shipment'
  - 'Dalawang opsyon sa pagpapadala: express air freight para sa 1–3 boards, sea freight para sa 5–20 board orders'
  - 'Bagong stock: 100% pressure-tested, 99.3% final-inspection pass rate, 2-Taong SUP Warranty'
why_retailers:
  title: Bakit Pinipili ng Maliliit na Retailer SUP ang Overstock Boards
  subtitle: Hindi mo kailangan ng warehouse o container budget para bumili sa wholesale na presyo.
  items:
    - title: Mga Dami na Pabor sa Maliliit na Negosyo
      description: Ang tradisyunal na wholesale ay nangangailangan ng daan-daang yunit kada order. Ang aming overstock model ay ginawa para sa mga independent na tindahan — magsimula sa 5 boards at palakihin ang iyong order habang lumalaki ang iyong tindahan.
    - title: Tunay na Wholesale Pricing nang Walang Volume Commitment
      description: Dahil nagbebenta kami ng overstock inventory — sobrang produksyon at maingat na nakuha mula sa piling partner factories — makakakuha ka ng volume-level unit pricing nang walang panganib sa volume-level.
    - title: Paghaluin ang mga modelo para tumugma sa iyong mga customer
      description: Ang mga beach shop, lake outfitter, at city store ay naglilingkod sa iba't ibang paddlers. Pagsamahin ang all-around, touring, at surf-style SUP na mga modelo sa isang order para umangkop ang iyong shelf sa lokal na pangangailangan.
    - title: Bagong-Bago, Hindi Kailanman Ginamit
      description: Lahat ng board sa aming overstock inventory ay bago at hindi nagagamit — hindi segundo, hindi return. Bawat board ay 100% pressure-tested bago umalis sa warehouse.
    - title: Mabilis, Flexible na Internasyonal na Pagpapadala
      description: Ang express air freight ay mabilis na nakakatanggap ng 1–3 boards o sample orders sa iyong pintuan; Pinananatili ng consolidated sea freight ang mababang gastos kada board sa 5–20 board retailer orders.
    - title: Suportado ng Tunay na Warranty
      description: Ang wholesale ay hindi nangangahulugang walang suporta. Bawat SUP board ay may 2-Taong SUP Warranty, parehong coverage na ibinibigay namin sa bawat customer sa 50+ bansa.
pricing_section:
  tagline: Presyong Wholesale
  title: Simple at Transparent na Wholesale Pricing
  subtitle: Ang presyo ay ibinibigay kada order base sa mga modelo, dami, at paraan ng pagpapadala na pinili mo. Walang nakatagong bayad — ang quote na matatanggap mo ay ang presyo na binabayaran mo.
  points:
    - title: Naka-tier ayon sa dami
      description: Bumababa ang presyo ng yunit habang tumataas ang bilang ng order. Mas maganda ang presyo ng 10-board order kada board kaysa sa 5-board order; mas maganda pa ang 20-board order.
    - title: Ang mga halo-halong modelo ay binibilang sa isang kabuuan
      description: Ang iyong discount tier ay nakabase sa kabuuang bilang ng boards sa order — hindi kada modelo. Ang paghahalo ng 4 na iba't ibang modelo × tig-3 boards ay binibilang bilang 12-board order.
    - title: Binigyan ng Quote Kasama ang Mga Opsyon sa Pagpapadala
      description: Bawat quote ay may kasamang express at sea freight options na may tinatayang transit times, kaya maaari mong piliin ang speed-to-cost balance na akma sa iyong restock timeline.
    - title: Walang Kinakailangang Account o Membership
      description: Walang wholesale club na pwedeng salihan at walang taunang bayad. Humiling ng quote, kumpirmahin ang order, at magpapadala kami.
inventory_section:
  tagline: Kasalukuyang Imbentaryo
  title: Mga Available na Produkto at Kasalukuyang Imbentaryo
  subtitle: Lahat ng 11 produkto sa ibaba ay kasalukuyang overstock inventory. Bagong-bago ang mga kondisyon; nagbabago ang stock levels lingguhan, kaya kumpirmahin ang availability sa iyong quote request.
  table_labels:
    product: Modelo
    condition: Kondisyon
    price: presyo sa tingi
    action: Makipag-ugnayan sa Amin
    condition_value: Bago
    note: Ipinapakita ang retail price bilang sanggunian. Ang wholesale unit pricing ay naka-quote kada order at mas mababa kaysa sa retail.
who_section:
  tagline: Sino ang Aming Suplay
  title: Ginawa para sa mga Independent na Negosyo sa Water Sports
  items:
    - title: Mga Tindahan sa Tabing-dagat at Surf
      description: Maliit na coastal retailer na nangangailangan ng 5–15 boards kada season, na pinaghalong all-around models para sa turista at surf-style boards para sa mga lokal.
    - title: Mga Online na Nagbebenta
      description: Ang mga e-commerce store at nagbebenta sa marketplace ay sinusubukan ang SUP kategorya nang hindi nagko-commit sa isang buong container ng isang modelo.
    - title: Mga Paupahang Fleet at Paaralan
      description: Ang mga operasyon ng paupahan at SUP mga paaralan ay nag-aayos ng mga fleet — matitibay na board, halo-halong modelo para sa iba't ibang laki ng customer, at warranty backup.
    - title: Mga Resort at Tour Operator
      description: Mga hotel, island resort, at tour operator na nagdadagdag SUP sa kanilang mga aktibidad sa pamamagitan ng maliit na paunang fleet at madaling seasonal restocking.
how_to_order:
  tagline: Paano Ito Gumagana
  title: Paano Maglagay ng Wholesale Order
  steps:
    - title: Mag-browse sa Inventory
      description: Suriin ang 11 in-stock na modelo sa itaas o gamitin ang mixed-model selector upang bumuo ng kombinasyon na akma sa iyong mga customer.
    - title: Humiling ng Quote
      description: Ipadala sa amin ang mga modelo, tinatayang dami, iyong bansa, at nais na bilis ng pagpapadala gamit ang inquiry form sa ibaba. Sumasagot kami gamit ang unit pricing at mga opsyon sa pagpapadala.
    - title: Kumpirmahin at Magbayad
      description: Aprubahan ang huling quote — mga modelo, dami, paraan ng kargamento, at kabuuan. Ang mga termino ng pagbabayad ay nakumpirma sa pag-quote.
    - title: Sinusuri, Pinapack, at Ipinapadala Namin
      description: Bawat board ay 100% pressure-tested, pinapack kasama ang kumpletong kit ng accessories, at ipinapadala mula sa Weihai. Makakatanggap ka ng tracking para sa buong biyahe.
