faq_section:
  title: Wholesale FAQ
  items:
    - q: Ano ang minimum na order para sa wholesale?
      a: Limang board. Ang aming overstock model ay ginawa para sa maliliit na retailer — hindi mo kailangang punuin ang isang container upang makuha ang presyo ng wholesale.
    - q: Maaari ko bang pagsamahin ang iba't ibang SUP na modelo sa isang wholesale order?
      a: Oo. Ang mga mixed model order ay isa sa pinakamalaking benepisyo ng pagbili ng overstock — pagsamahin ang anumang mga modelong nasa stock sa isang shipment, at ang kabuuang bilang ng board ang magtatakda ng iyong pricing tier. Tingnan ang aming mixed model wholesale page para sa detalye.
    - q: Bago ba ang mga tabla?
      a: Oo. Bawat board ay bago, hindi nagamit na labis na imbentaryo — hindi kailanman pangalawa, ni refurbished, o naibalik ng customer. Bawat board ay 100% sinusuri sa presyon bago ipadala.
    - q: Gaano kalaki ang pagkakaiba ng presyo ng maramihan kumpara sa tingi?
      a: Ang presyo ng pangmaramihang yunit ay ibinibigay kada order batay sa mga modelo at dami, at ito ay malinaw na mas mababa kaysa sa mga presyo sa tingi na nakalista sa itaas. Humiling ng isang presyo para sa iyong target na kumbinasyon at aming itataya ang presyo nito nang eksakto.
    - q: Alin na paraan ng pagpapadala ang dapat kong piliin?
      a: Ang express air freight ay angkop para sa 1–3 board, mga sample, at agarang restock. Ang consolidated sea freight ay ang matipid na pagpipilian para sa 5–20 board na mga order ng retailer. Nagbibigay kami ng parehong pagpipilian sa bawat pagtatanong.
    - q: Anong warranty ang kasama ng mga board na binibili nang maramihan?
      a: Ang parehong 2-Taong SUP Warranty na ibinibigay namin sa bawat customer, sa bawat isa sa 50+ bansa na aming pinapadalhan.
    - q: Nagpapadala ba kayo sa aking bansa?
      a: Sa kasalukuyan, naghahatid kami sa higit sa 50 bansa, na may mga gabay para sa rehiyon ng Latin America, Timog-Silangang Asya, Africa, Gitnang Silangan, at mga pangunahing pamilihan kabilang ang Mexico, Brazil, Pilipinas, Indonesia, Thailand, South Africa, Kenya, at ang UAE. Magtanong sa iyong kahilingan para sa sipi at aming kokumpirmahin ang kasalukuyang serbisyo sa iyong address.
