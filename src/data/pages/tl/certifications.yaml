hero:
  tagline: Mga Sertipikasyon at Pamantayan
  title: Mga Sertipikasyon sa Kalidad<br />& Mga Pamantayan sa Pagsunod
  subtitle: Aquafarer Ang mga produkto ay ginagawa alinsunod sa mga internasyonal na pamantayan sa kaligtasan sa dagat, mga sistema ng pamamahala ng kalidad, at mga regulasyon sa kapaligiran.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarer Mga sertipikasyon sa kalidad at dokumentasyon ng pagsunod
content_certifications:
  tagline: Ang Aming mga Sertipikasyon
  title: Sertipikadong Kalidad,<br />Kinikilala sa buong mundo
  subtitle: Ang CE64-certified na mga modelo at factory-wide certifications ay nagpapakita ng aming dedikasyon sa kalidad, kaligtasan, at responsibilidad sa kapaligiran.
  items:
    - title: CE Sertipikado
      description: Ang mga CEmodelong may sertipikasyon 64 ay sumusunod sa CE mga kinakailangan ng European marking para sa mga recreational watercraft, na tinitiyak na natutugunan ang mga pamantayan sa kaligtasan, kalusugan, at pangangalaga sa kapaligiran.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Ang aming quality management system ay ISO 9001:2015 certified, na sumasaklaw sa disenyo, paggawa, at distribusyon ng inflatable watercraft at marine equipment.
      icon: tabler:clipboard-check
    - title: UKCA minarkahan
      description: Ang mga produktong ibinebenta sa merkado ng UK ay may UKCA marka, na nagpapatunay ng pagsunod sa mga regulasyon ng UK para sa marine equipment at personal watercraft.
      icon: tabler:shield
    - title: BSCI sumusunod
      description: Aquafarer ay BSCI (Business Social Compliance Initiative) na na-audit, na nagpapakita ng etikal na mga pamamaraan sa paggawa, patas na kondisyon sa paggawa, at responsibilidad sa supply chain.
      icon: tabler:heart-handshake
    - title: REACH sumusunod
      description: Lahat ng materyales na ginagamit sa Aquafarer mga produkto ay sumusunod sa REACH mga regulasyon ng EU para sa kaligtasan ng kemikal, na tinitiyak na walang mga ipinagbabawal na sangkap sa aming PVC, Hypalon, o mga bahagi.
      icon: tabler:flask
    - title: pagsusuri ng materyal
      description: Sinusuri ang mga tela para sa tensile strength, tear resistance, UV degradation, at cold-crack performance. Bawat batch ng produksyon ay sinusuri at sinusuri.
      icon: tabler:test-pipe
content_factory:
  tagline: Mga Pamantayan sa Pabrika
  title: Kahusayan sa Paggawa<br />— Itinayo ayon sa Espesipikasyon
  subtitle: Ang aming 12,000 m² na pasilidad ay nagpapatakbo sa ilalim ng mahigpit na mga protocol sa kontrol ng kalidad sa bawat yugto ng produksyon.
  list:
    - 'Inspeksyon ng Papasok na Materyales: Lahat ng hilaw na materyales — PVC tela, Hypalonaluminyo, plywood, pandikit — ay sinusuri ayon sa mga espesipikasyon bago pumasok sa produksyon.'
    - 'In-Process Quality Control: Bawat yugto ng produksyon ay may dokumentadong QC checkpoints. Ang lakas ng weld, seam alignment, valve installation, at fitting torque ay sinusuri inline.'
    - 'Pagsusuri ng Presyon: Bawat inflatable chamber ay sinusuri sa 1.25× rated pressure sa loob ng 24–48 oras. Ang rate ng tagas ay dapat nasa loob ng katanggap-tanggap na limitasyon ayon sa ISO 6185.'
    - 'Pangwakas na Inspeksyon: Ang mga natapos na produkto ay sinusuri para sa dimensional accuracy, cosmetic finish, kumpletong accessory, at integridad ng packaging bago ipadala.'
    - 'Batch Traceability: Bawat produkto ay may serial number na naka-link sa production batch records, na nagbibigay-daan sa ganap na traceability mula raw material hanggang sa finished goods.'
content_safety:
  tagline: Mga Pamantayan sa Kaligtasan sa Dagat
  title: Kaligtasan Muna<br />— Dinisenyo para sa Maaasahang Operasyon
  subtitle: Aquafarer mga produkto ay idinisenyo at sinubok upang matugunan ang pandaigdigang pamantayan sa kaligtasan sa dagat para sa pangkomersyo at panlibang na paggamit.
  items:
    - title: ISO 6185
      description: Ang mga inflatable na bangka ay sumusunod sa ISO 6185 pamantayan para sa konstruksiyon, katatagan, buoyancy, at kapasidad ng karga.
      icon: tabler:sailboat
    - title: Pamantayan ng ABYC
      description: Ang mga sistemang elektrikal at sistema ng gasolina ay sumusunod sa pamantayan ng ABYC (American Boat & Yacht Council) para sa ligtas na pag-install at operasyon.
      icon: tabler:bolt
    - title: SOLAS Pagsunod
      description: Ang kagamitang panligtas at mga kagamitan sa pangkaligtasan sa buhay ay sumusunod sa mga kinakailangan ng SOLAS (Safety of Life at Sea) kung saan naaangkop.
      icon: tabler:lifebuoy
