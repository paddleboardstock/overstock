hero:
  tagline: Ang Aming Kwento
  title: Paddle Board Overstock — Pagbuo ng Kalayaan sa Tubig
  subtitle: 'Mula sa isang coastal workshop hanggang sa isang pandaigdigang tagagawa ng dagat — ang aming paglalakbay ay nakabatay sa matibay na paniniwala: ang mga paddle board ay dapat idisenyo na parang mahalaga sila, dahil mahalaga ito.'
