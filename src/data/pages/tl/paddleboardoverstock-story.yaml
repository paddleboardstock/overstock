    title: Pangako sa Kalidad
    body: Mula sa pagsisiyasat ng materyal hanggang sa pangwakas na pagsubok, pinapanatili ng Paddle Board Overstock ang sistematikong mga proseso ng kalidad upang maghatid ng maaasahang mga produktong pandagat. Bawat yunit ay sumasailalim sa pagsubok sa presyon, inspeksyon ng tahi, at beripikasyon ng pagganap bago ipadala.
    items:
      - 99.3% rate ng padalang walang depekto
      - 100% nasubok sa presyon sa 1.25x ng rated PSI
      - 2-taong garantiya sa bawat board
