    - Mga pamilya at baguhan na natutuklasan ang stand-up paddling
    - Mga touring, yoga, at fitness paddler na nangangailangan ng espesyal na mga platform
    - Mga fleet ng renta at club na nangangailangan ng matibay, madaling alagaan na mga board
