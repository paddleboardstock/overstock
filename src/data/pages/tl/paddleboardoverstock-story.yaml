timeline:
  - year: '2012'
    title: Pundasyon ng Paggawa ng Marine
    body: Paddle Board Overstock nagsimula bilang isang espesyal na workshop para sa inflatable paddle board sa Weihai, China, na nakatuon sa marine craftsmanship at paggawa ng board. Ang unang pokus ay ang paggawa ng maaasahang inflatable na produkto sa pamamagitan ng praktikal na karanasan sa engineering at disiplina sa paggawa.
  - year: '2015'
    title: Unang Pag-export
    body: Dumating ang mga paunang order sa pag-export sa Japan at Korea, na nagmarka Paddle Board Overstock ng pagpasok nito sa mga internasyonal na merkado. Nagsimulang magsilbi ang kumpanya sa mga paddler at mga mahilig sa water sports sa labas ng China.
  - year: '2018'
    title: Paglawak ng Pabrika
    body: Lumipat sa isang 12,000 m² na pasilidad ng produksyon. Nagdagdag ng mga linya ng RF welding at drop-stitch kapasidad ng produksyon, na nagpapahintulot ng mas malaking sukat ng paggawa at pinahusay na mga sistema ng kontrol sa kalidad.
  - year: '2020'
    title: Pagtatatag ng R&D Center
    body: Bumukas ng dedikadong R&D center na may PVC lab ng tela, tangke ng pagsusuri ng hydrodynamics, at CAD/FEA simulation studio. Pinalawak ang pag-develop ng produkto upang tumuon sa magaan na konstruksyon, pinahusay na tibay, at disenyo na nakasentro sa gumagamit.
  - year: '2022'
    title: Pandaigdigang Paglago
    body: Pinalawak ito sa 14 na R&D engineers at 200+ manggagawa. Naabot ng mga board ang mga paddler sa buong Europa, Amerika, at Asia-Pacific, na nagpapadala sa 50+ bansa.
  - year: '2024'
    title: Inobasyon at Design Studio
    body: Naglunsad ng full-service design at innovation studio para sa mga bagong board series, mula konsepto hanggang produksyon. Pinalawak ang aming signature art-series decks at touring platforms.
  - year: '2026'
    title: Pagtatayo ng Hinaharap ng Paggalugad sa Tubig
    body: Sa kasalukuyan, Paddle Board Overstock patuloy na nagde-develop ng inflatable SUP boards, paddling gear, at mga customized na solusyon sa dagat — na nag-uugnay sa mga tao at organisasyon sa mga tubig ng mundo. 50+ bansa ang pinagsilbihan, 15,000 yunit na may taunang kapasidad.
content_founding:
  tagline: Ang Simula
  title: Ipinanganak sa Baybayin
  subtitle: 'Paddle Board Overstock nagsimula sa isang coastal workshop sa Weihai na may isang board at isang bisyon: gumawa ng inflatable paddle boards na kayang harapin ang tunay na kondisyon ng dagat.'
  paragraphs:
    - Noong 2012, nakita ng aming mga tagapagtatag ang kakulangan sa merkado — karamihan sa mga inflatable board ay abot-kaya ngunit hindi maaasahan, o mataas ang kalidad ngunit sobrang mahal. Naniniwala sila na may puwang para sa isang tagagawa na naghahatid ng parehong kalidad at halaga.
    - Ang unang hull ay ginawa nang mano-mano, sinubukan sa lokal na tubig, at pinino batay sa totoong feedback mula sa mga mangingisda at maliliit na komersyal na operator. Ang feedback loop na iyon — build, test, listen, improve — ay nananatiling sentro ng ating pilosopiya sa engineering hanggang ngayon.
    - Noong 2015, kumalat na ang balita lampas pa sa Weihai. Nagsimulang humingi ng mga board ang mga paddler at mga tindahan ng water sports sa buong Asya. Ang nagsimula bilang isang lokal na workshop ay nagiging isang pandaigdigang tatak.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock maagang gawaang tabing-dagat at paggawa
content_growth:
  tagline: Paglago at Inobasyon
  title: Mula sa Pagawaan hanggang sa 12,000 m² na Pasilidad
  subtitle: Ang patuloy na pamumuhunan sa mga tao, kagamitan, at proseso ay nagbago sa Paddle Board Overstock sa isang modernong pasilidad sa paggawa ng marine.
  paragraphs:
    - Habang lumalaki ang demand, ganoon din ang aming pasilidad. Pinalawak namin mula sa isang maliit na workshop tungo sa isang 12,000 m² na pabrika na may nakalaang mga linya ng produksyon para sa SUP board, mga aksesorya, at kagamitang pangkaligtasan.
    - Nag-invest kami sa CNC mga cutting machine, high-frequency welding equipment, drop stitch production lines, at komprehensibong testing rigs — na nagpapahintulot sa amin na kontrolin ang bawat aspeto ng kalidad ng produksyon.
    - Ngayon, ang aming koponan na may 200-300 miyembro ay binubuo ng mga marine engineer, siyentipiko sa materyales, espesyalista sa kontrol ng kalidad, at bihasang manggagawa — marami sa kanila ay kasama na sa Paddle Board Overstock mula pa noong mga unang araw.
founder:
  tagline: Kilalanin ang Tagapagtatag
  title: Itinayo ng isang Waterman
  subtitle: Itinatag ni David Chen ang pagsasama ng kaalaman sa pagmamanupaktura at isang panghabang-buhay na hilig sa mga palakasan sa tubig — isang kombinasyon na naglalarawan kung paano nilalapitan ng Paddle Board Overstock ang pagbuo ng produkto.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Tagapagtatag ng Paddle Board Overstock
  story:
    - Lumaki si David Chen sa baybayin ng Weihai, kung saan ang dagat ay hindi destinasyon para sa bakasyon kundi isang paraan ng pamumuhay. Ginugol niya ang kanyang kabataan sa pagpaddle, paglalayag, at pangingisda sa Yellow Sea — mga karanasang nagbigay sa kanya ng likas na pang-unawa kung ano ang kailangan tiisin ng mga paddle board.
    - Bago itinatag ang Paddle Board Overstock, nagtrabaho si David ng isang dekada sa paggawa ng mga bagay pang-dagat, sa larangan ng produksyon, kalidad, at kalakalan sa internasyonal. Pinamunuan niya ang mga programa ng produksyon at kalidad para sa mga pamilihan sa Europa at Hilagang Amerika, natutunan niya ang mga inaasahan ng mga pandaigdigang paddler nang personal.
    - 'Noong 2012, itinatag niya ang Paddle Board Overstock na may simpleng misyon: gumawa ng inflatable paddle boards na kanyang pagkakatiwalaan sa sarili niyang pamilya sa tubig. Ang personal na pamantayang ito — gagamitin ko ba ito? — ay nananatiling huling pagsubok para sa bawat produktong umaalis sa pabrika.'
    - Ngayon, pinamumunuan ni David ang estratehiya sa produkto at binabantayan ang koponan ng R&D, personal na nire-review ang mga bagong disenyo at sinusubukan ang mga prototype sa tubig sa paligid ng Weihai. Naniniwala siya na ang magagandang produkto ay nagmumula sa pag-unawa sa parehong inhinyeriya at karanasan.
philosophy:
  tagline: Pilosopiya ng Tatak
  title: Kalayaan sa Inhinyeriya sa Tubig
  body: Ang kalayaan sa tubig ay hindi lamang tungkol sa paggalaw. Ito ay kumakatawan sa pagtuklas ng mga bagong lugar, paglikha ng mga karanasan sa labas, pag-uugnay ng mga tao sa kalikasan, at pagpapahintulot ng mga propesyonal na misyon. Ginagawang posible ng engineering ang kalayaang iyon.
  pillars:
    - title: Unahin ang pagiging maaasahan
      body: Ang mga kapaligiran na may tubig ay nangangailangan ng tiwala. Ang mga produkto ng Paddle Board Overstock ay idinisenyo batay sa katatagan, tibay, kaligtasan, at tuloy-tuloy na pagganap.
    - title: Disenyo na Nakasentro sa Tao
      body: Dapat pagsilbihan ng mga produkto ang tao, hindi ang teknolohiya. Bawat desisyon sa disenyo ay nagsisimula sa pag-unawa kung paano ginagamit ng mga tao ang kanilang mga board, saan sila nagpupunta, at ano ang mga hamon na kanilang hinaharap.
    - title: Madaling Tuklasin
      body: Hindi dapat para lamang sa mga eksperto ang tubig. Paddle Board Overstock ay lumilikha ng kagamitan na nagpapahintulot sa mas maraming tao na ligtas na maranasan ang mga ilog, lawa, karagatan, at mga baybaying kapaligiran.
    - title: Tuloy-tuloy na Inobasyon
      body: Ang inobasyon ay hindi lamang paglikha ng mga bagong produkto. Ito ay pagpapabuti ng bawat detalye — mga materyales, estruktura, paggawa, at karanasan ng gumagamit.
engineeringDna:
  tagline: DNA ng Inhinyeriya
  title: Paano Gumagawa ng Mga Produkto ang Paddle Board Overstock
  areas:
    - title: Agham ng Materyales
      body: Paddle Board Overstock ay nakatuon sa pagpili ng angkop na materyales para sa iba't ibang kapaligirang pandagat. Kabilang sa mga pangunahing konsiderasyon ang paglaban sa pagkagasgas, paglaban sa UV, katatagan sa presyon, at pangmatagalang tibay.
      items:
        - Tibay sa Pagsusuot
        - UV Tibay
        - Katatagan sa Presyon
        - Pangmatagalang Tibay
    - title: Inhinyeriyang Pangstruktura
      body: Ang mga inflatable na paddle board ay nangangailangan ng tumpak na balanse sa pagitan ng tigas, timbang, kakayahang dalhin, at katatagan. Ang engineering ng Paddle Board Overstock ay nakatuon sa pag-optimize ng mga faktor na ito sa pamamagitan ng drop-stitch core technology at advanced seam construction.
      items:
        - Katigasan
        - Pag-optimize ng Bigat
        - Kakayahang dalhin
        - Katatagan
    - title: Tumpak na Paggawa
      body: 'Bawat produkto ay dumadaan sa kontroladong mga proseso: paghahanda ng materyales, tumpak na pagputol, welding at bonding, pagsasama, inspeksyon ng kalidad, at pag-verify ng pagganap.'
      items:
        - Paghahanda ng Materyales
        - Tumpak na Pagputol
        - Welding at Bonding
        - Pagsasama at QC
    - title: Inhinyeriyang Sitwasyon ng Gumagamit
      body: Ang mga produkto ay binubuo batay sa mga totoong aplikasyon ng pagpala — libangan, pakikipagsapalaran, pamilya, at paglalakbay — na tinitiyak na ang bawat disenyo ay nakakatugon sa partikular na pangangailangan ng inaasahang kapaligiran nito.
      items:
        - Libangan
        - Pakikipagsapalaran
        - Pamilya
        - Paglilibot
