testimonial:
  content: Nangungupahan ako ng 5 board mula sa isang lokal na tindahan at nawawala sa akin ang 60% ng aking kita sa kanila. Tinulungan ako ni Paddle Board Overstock na buuin ang aking sariling fleet ng 15 SUPs. Ipinakita ng ROI calculator na ibinigay nila na makakabawi ako sa loob ng 4 na buwan — sa katunayan, 3 lang ang kinailangan. Ngayon, pinalalawak ko na sa 30 board at nagdadagdag ng mga kayak.
  name: Daniel Okonkwo
  title: May-ari, Lakeland SUP Rentals — Ontario, Canada
content_segments:
  tagline: Mga Profile ng Upa
  title: Mga Solusyon sa Pag-upa ng Pampalipas Oras na Tubig<br />Ayon sa Uri ng Operator
  subtitle: Iba't ibang operasyon ng paupahan ay may iba't ibang pangangailangan — mula sa maliliit na paupahan sa tabi ng dagat na SUP hanggang sa malalaking sentro ng water sports sa resort. Inaangkop namin ang aming mga package ng kagamitan at modelo ng suporta nang naaayon.
  items:
    - title: Paupahan sa Tabing-Dagat at Tabing-Lawa SUP
      subtitle: Mataas na bolyum, mababang kumplikadong operasyon
      description: Mga operator na nangungupahan ng stand-up paddle boards at kayaks direkta sa mga pumupunta sa dalampasigan at mga bisita sa lawa. Ang iyong prayoridad ay ang pagbawas ng oras ng palitan sa pagitan ng mga renta, pagpapanatili ng gamit sa sirkulasyon, at pamamahala ng mga biglaang pagtaas ng demand sa panahon gamit ang maliit na lugar ng imbakan.
      features:
        - Mga inflatable na SUP na flotilya na pwedeng patagin — hindi kailangan ng pantalan o trailer
        - Pang-komersyal na grado PVC na batay sa 100+ na cycle ng pagrenta bawat season
        - Mabilis matuyo, tela na UV-resistente para sa kahandaan sa parehong araw ng muling pagrenta
        - Mga hanay ng board na may kulay para sa madaling pagkakakilanlan ng fleet
    - title: Mga Sentro ng Pampalakasan sa Tubig ng Resort at Hotel
      subtitle: Karanasan ng Bisita at Pagkakatugma ng Tatak
      description: Mga resort at hotel na nag-aalok ng water sports bilang on-site na amenity. Ang kagamitan ay kailangang mukhang de-kalidad, maasahang gumana mula sa mga baguhan hanggang sa mga intermediate na bisita, at maipaloob sa umiiral na workflow ng resort sa pag-book at pagsingil ng aktibidad.
      features:
        - Custom-branded SUP boards at life vests na tumutugma sa kulay ng resort
        - 'Halo-halong fleet: SUPs, kayaks, pedal boats, at maliliit na RIB tenders'
        - Tahimik, fuel-free na electric pump solutions para sa inflation sa tabi ng beach
        - Kasama ang pagsasanay ng staff at onboarding para sa maintenance
    - title: Mga Operator ng Boat & RIB Rental
      subtitle: Commercial-grade na fleet ng vessel rental
      description: Mga operator na nangungupahan ng powered vessels — RIB tenders, inflatable boats, at maliliit na runabouts — kada oras o kalahating araw. Kailangang matugunan ng inyong fleet ang regulasyon sa marine safety, kayanin ang mabigat na paggamit ng bisita, at mabawasan ang mechanical downtime sa pagitan ng mga charter.
      features:
        - RIB packages na may 30–90 HP outboard-ready transoms
        - Marine-grade plywood floor panels para sa pangmatagalang integridad ng istruktura
        - Quick-launch valve systems para sa mas mabilis na turnover
        - Kit ng ekstrang bahagi + on-call na teknikal na suporta SLA
    - title: Mga Operator sa Tour & Adventure
      subtitle: Mga guided excursion fleet
      description: Mga operator na nagpapatakbo ng guided water sports tours — SUP safaris, cave kayaking, snorkeling excursions, o island-hopping RIB tours. Kailangang matatag ang kagamitan para sa mga baguhang bisita sa tour, madaling malinis sa pagitan ng mga grupo, at matibay para sa araw-araw na guided use sa iba't ibang kondisyon ng tubig.
      features:
        - Extra-stable SUP platforms (32" wide+) para sa mga unang beses na sumasakay
        - Tandem kayak options para sa couple/group tour configurations
        - Built-in cargo capacity para sa snorkel gear, dry bags, at mga cooler
        - CE + USCG compliance documentation para sa komersyal na operasyon
