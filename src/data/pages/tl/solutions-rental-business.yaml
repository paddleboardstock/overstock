        description: 10 SUP na mga tabla na may mga paddles, bomba, life vest, at mga kit para sa pagkumpuni — lahat ng kailangan mo para magsimula
      - title: Mga Solusyon sa Imbakan
        description: Ang mga pambusyong kagamitan ay pinapabilang nang patag — hindi kailangan ng pantalan ng bangka o trailer para sa imbakan
      - title: Pagsunod sa Kaligtasan
        description: Lahat ng kagamitan CE sertipikado na may konstruksiyong pang-komersyal para sa araw-araw na paggamit sa pagrenta
      - title: Panimulang Pagmemerkado
        description: Mga branded na larawan at mga template ng menu ng renta upang tulungan kang ilunsad ang iyong serbisyo
    cta_text: Simulan ang Paupahang Fleet
    cta_href: /contact
  - title: Kagamitan para sa Pagpapalawak ng Flota
    subtitle: Para sa mga operasyon ng pagtatanim na nagdadagdag ng kapasidad at pagkakaiba-iba
    badge: Premium
    features:
      - title: Halo-halong Disenyo ng Flota
        description: Kombinasyon ng SUPs, mga kayak, mga inflatable na bangka, at RIBs upang matugunan ang iba't ibang kagustuhan ng mga bisita
      - title: Presyo Batay sa Dami
        description: Nakahating presyo sa maramihang pagbili para sa mga fleet na may 20+ yunit na may paborableng presyo sa logistika
      - title: Pasadyang Pagba-brand
        description: Pagpi-print ng logo sa kagamitan, naka-brand na mga life vest, at pasadyang pagpipilian ng kulay para sa iyong fleet na inuupahan
      - title: Programa sa Pagpapanatili
        description: Kumpletong kit ng ekstrang bahagi, pagsasanay sa pagkukumpuni para sa mga tauhan, at direktang akses sa teknikal na suporta
      - title: Pag-optimize ng Kita
        description: Mga mungkahing batay sa datos tungkol sa pagpepresyo, pag-ikot ng kagamitan, at mga panahong pagsasaayos ng fleet
    cta_text: Palakihin ang Aking Fleet
    cta_href: /contact
