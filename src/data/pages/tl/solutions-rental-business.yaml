testimonial:
  content: Nangungupahan ako ng 5 board mula sa isang lokal na tindahan at nawawala ako ng 60% ng aking kita sa kanila. Paddle Board Overstock ang tumulong sa akin na bumuo ng aking sariling fleet ng 15 SUPs. Ipinakita ng ROI calculator na ibinigay nila na magba-break even ako sa loob ng 4 na buwan — sa katunayan, sa loob ng 3 buwan lang. Ngayon ay pinalalawak ko na sa 30 board.
  name: Daniel Okonkwo
  title: May-ari, Lakeland SUP Rentals — Ontario, Canada
content_segments:
  tagline: Mga Profile ng Upa
  title: Mga Solusyon sa Pag-upa ng Pampalipas Oras na Tubig<br />Ayon sa Uri ng Operator
  subtitle: Iba't ibang operasyon ng paupahan ay may iba't ibang pangangailangan — mula sa maliliit na paupahan sa tabi ng dagat na SUP hanggang sa malalaking sentro ng water sports sa resort. Inaangkop namin ang aming mga package ng kagamitan at modelo ng suporta nang naaayon.
  items:
    - title: Paupahan sa Tabing-Dagat at Tabing-Lawa SUP
      subtitle: Mataas na bolyum, mababang kumplikadong operasyon
      description: Mga operator na nangungupahan ng stand-up paddle boards direkta sa mga nagbabakasyon sa tabing-dagat at mga bumibisita sa lawa. Ang iyong prayoridad ay mabawasan ang turnaround time sa pagitan ng mga paupahang board, panatilihing umiikot ang kagamitan, at pamahalaan ang mga rurok ng demand tuwing panahon gamit ang maliit na storage footprint.
      features:
        - Mga inflatable na SUP na flotilya na pwedeng patagin — hindi kailangan ng pantalan o trailer
        - Pang-komersyal na grado PVC na batay sa 100+ na cycle ng pagrenta bawat season
        - Mabilis matuyo, tela na UV-resistente para sa kahandaan sa parehong araw ng muling pagrenta
        - Mga hanay ng board na may kulay para sa madaling pagkakakilanlan ng fleet
    - title: Mga Sentro ng Pampalakasan sa Tubig ng Resort at Hotel
      subtitle: Karanasan ng Bisita at Pagkakatugma ng Tatak
      description: Mga resort at hotel na nag-aalok ng water sports bilang on-site na amenity. Ang kagamitan ay kailangang mukhang de-kalidad, maasahang gumana mula sa mga baguhan hanggang sa mga intermediate na bisita, at maipaloob sa umiiral na workflow ng resort sa pag-book at pagsingil ng aktibidad.
      features:
        - Custom-branded SUP boards at life vests na tumutugma sa kulay ng resort
        - 'Halo-halong fleet: all-around, touring, at art-series SUPs'
        - Tahimik, fuel-free na electric pump solutions para sa inflation sa tabi ng beach
        - Kasama ang pagsasanay ng staff at onboarding para sa maintenance
    - title: Boutique at Mobile SUP Rentals
      subtitle: Pop-up at delivery-based na serbisyo sa pagrenta
      description: Mga operator na nagdadala ng mga board diretso sa customer — paghahatid sa beach ng hotel, pop-up na mga istasyon ng renta sa mga event, at mobile na setup. Kailangang mabilis i-deploy ang kagamitan, madaling dalhin, at presentable sa unang tingin, na may flexible na laki ng fleet para sa mga event at seasonal na pangangailangan.
      features:
        - Backpack-style na transportasyon ng board — hindi kailangan ng trailer
        - Mabilis na inflation para sa on-demand setup sa loob ng 15 minuto
        - Presentable na kagamitan na mukhang premium sa unang silip
        - Flexible na laki ng fleet para sa mga event at seasonal na pangangailangan
    - title: Mga Operator sa Tour & Adventure
      subtitle: Mga guided excursion fleet
      description: Mga operator na nagpapatakbo ng guided water sports tours — SUP safaris, snorkeling excursions, at coastal exploration tours. Kailangang sapat na matibay ang kagamitan para sa mga baguhang turista, madaling linisin sa pagitan ng mga grupo, at matibay para sa pang-araw-araw na guided na paggamit sa iba't ibang kondisyon ng tubig.
      features:
        - Extra-stable SUP platforms (32" wide+) para sa mga unang beses na sumasakay
        - Extra-large na matatag na mga plataporma para sa mga litrato ng couple/group tours
        - Built-in cargo capacity para sa snorkel gear, dry bags, at mga cooler
        - Mga package ng safety equipment para sa komersyal na operasyon ng tour
