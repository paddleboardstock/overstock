hero:
  tagline: Paddle Board Overstock Akademya
  title: Sentro ng Pagkatuto
  subtitle: Mga gabay at tutorial para sa bawat antas ng kasanayan — mula sa SUP mga pangunahing kaalaman hanggang sa advanced na mga teknika sa pagsagip
categories:
  - level: Nagsisimula
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Mga Pangunahing Kaalaman
        desc: Matutunan ang mga pundasyon ng stand-up paddleboarding — tindig, teknik sa paga, at balanse.
        slug: beginner-sup-guide
      - title: Mga Teknik sa Paga
        desc: Forward stroke, sweep stroke, draw stroke, at low brace — masterin ang mahahalagang galaw sa paga.
        slug: sup-paddle-guide
      - title: Kaligtasan Muna
        desc: Mahahalagang kasanayan sa kaligtasan kabilang ang pagsuri ng panahon, PFD paggamit, mga patakaran sa leash, at self-rescue.
        slug: sup-safety-guide
  - level: Gitnang Antas
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Mga Mahahalagang Bagay sa Touring
        desc: Pagpaplano ng multi-hour na paga — nabigasyon, pag-inom ng tubig, pacing, at pagbasa ng mga forecast ng hangin.
        slug: touring-sup-guide
      - title: Pagbasa ng Panahon
        desc: Interpretasyon ng mga marine forecast, pagtukoy sa pattern ng ulap, at pag-unawa sa epekto ng hangin sa tubig.
        slug: weather-planning-water-sports
      - title: Mga Pangunahing Kaalaman sa Nabigasyon
        desc: Pagbabasa ng chart, paggamit ng compass, GPS waypoints, at pagpaplano ng ruta para sa paddling sa baybayin.
        slug: sup-navigation-guide
      - title: Kamalayan sa Tidal
        desc: Pag-unawa sa mga cycle ng tide, agos, at kung paano ito nakakaapekto sa oras ng paglulunsad at ruta.
        slug: understanding-tides
  - level: Pinaunlad
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Pagpaplano ng Multi-Araw na Paglalakbay
        desc: Logistics ng ekspedisyon — pagpili ng kagamitan, pagpaplano ng pagkain, mga protocol sa kaligtasan, at emergency contacts.
        slug: sup-travel-guide
      - title: Mga Teknik sa Pagsagip
        desc: Mga protokol sa sariling pagliligtas, T-ligtas, at pagtutulak para sa bukas na tubig.
        slug: sup-self-rescue
      - title: Paggawa ng Paga sa Gabi
        desc: Nabigasyon pagkatapos ng dilim — mga kinakailangang ilaw, memorya ng ruta, komunikasyon sa grupo, at kamalayan sa panganib.
        slug: sup-navigation-guide
  - level: Pagpapanatili
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Paglilinis at Pangangalaga
        desc: Banlawan sa sariwang tubig, UV proteksyon, pag-iwas sa amag, at tamang paraan ng pagpapatuyo pagkatapos ng bawat session.
        slug: inflatable-sup-maintenance
      - title: Gabay sa Pag-iimbak
        desc: Pinakamahusay na mga kasanayan sa pag-iimbak ng mga inflatable board — pagbaklas, pagtupi, kontrol sa temperatura, at haba ng buhay sa istante.
        slug: inflatable-sup-storage
      - title: Mga Pangunahing Kaalaman sa Pagkukumpuni
        desc: Ayusin ang maliliit na butas, tagas sa tahi, at mga isyu sa balbula gamit ang PVC repair kits at mga teknik sa pagbibitay patch.
        slug: inflatable-sup-repair
      - title: Pagpapanatili ng Balbula
        desc: Tukuyin ang mga uri ng balbula (Halkey-Roberts, Boston, Leafield), linisin ang mga dumi, at palitan ang mga sira na stems.
        slug: inflatable-sup-repair
knowledge_center_tagline: Sentro ng Kaalaman
knowledge_center_title: Gabay at Kaalaman sa Paddle Board
knowledge_center_subtitle: Ekspertong gabay at payo sa pagbili para sa mga paddle boarder sa anumang antas.
knowledge_sections:
  - title: Teknolohiya at Konstruksyon ng Board
    tagline: Sa Loob ng Iyong Paddle Board
    desc: Paano binubuo ang mga inflatable paddle board — drop-stitch cores, laminate layers, EVA decks, at pagsusuri sa presyon ng pabrika.
    guides:
      - title: Paano Ginagawa ang mga Paddle Board
        desc: Mula sa pagputol ng materyal at lamination hanggang sa 100% na pagsusuri sa presyon — tingnan kung paano umaalis sa pabrika ang bawat board.
        href: /factory/process
      - title: Drop-stitch core na teknolohiya
        desc: Paano ang libu-libong panloob na mga thread ay lumilikha ng matibay, mataas na presyon na inflatable na istruktura.
        href: /learn/drop-stitch-core
      - title: Sanggunian ng Materyales
        desc: Ipinaliwanag ang PVC denier ratings, bigat ng tela, UV resistance, at mga materyales ng deck.
        href: /learn/materials
      - title: Teknolohiya ng Inflatable Board
        desc: Mga welded seam, konstruksyon ng rail, at mga sistema ng balbula na nagpapanatiling matigas at airtight ang iyong board.
        href: /learn/inflatable-technology
  - title: Mga Gabay sa Pagbili
    tagline: Pumili ng Tamang Board
    desc: Lahat ng kailangan mo upang pumili ng iyong una — o susunod — inflatable SUP, mula sa sukat hanggang sa konstruksyon.
    guides:
      - title: Paano Pumili ng Inflatable SUP
        desc: Ang mga pangunahing salik — konstruksyon, kapal, setup ng palikpik, at mga kasamang aksesorya.
        href: /guides/how-to-choose-your-sup/
      - title: Ano ang Stand-Up Paddleboarding?
        desc: Isang magiliw na pagpapakilala sa isport, sa kagamitan, at kung bakit pinapadali ng mga inflatable board ang pagsisimula.
        href: /guides/what-is-sup
      - title: Inflatable laban sa Matigas na Tabla
        desc: Ihambing ang iSUP at matigas na epoxy boards sa pagiging portable, tibay, pagganap, at halaga.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Gabay sa Sukat
        desc: Hanapin ang tamang haba, lapad, at dami ng board para sa iyong timbang, kasanayan, at istilo ng pagbibisikleta.
        href: /size-guide
  - title: Kasanayan at Kaligtasan
    tagline: Maglayag nang may Kumpiyansa
    desc: Pangunahing kaalaman para sa bawat sesyon — mga batayang kaalaman para sa mga baguhan, kaligtasan sa tubig, pangangalaga, at pagkukumpuni.
    guides:
      - title: SUP Pangunahing Kaalaman — Gabay para sa Nagsisimula
        desc: Lahat ng kailangang malaman ng isang baguhan — mga uri ng board, sukat ng paddle, postura, at mga tip sa unang araw.
        href: /v2/beginner-sup-guide
      - title: Mahahalagang Kaalaman sa Kaligtasan sa Tubig
        desc: Pagsusuri ng panahon, pagpili ng PFD, alituntunin sa leash, sariling pagliligtas, at pinakamahusay na kasanayan sa pangkatang paglalayag.
        href: /learn/water-safety
      - title: SUP Pagpapanatili at Pangangalaga
        desc: Paglilinis, pag-iimbak, proteksyon ng UV, at mga tip sa pangangalaga para sa mga inflatable na SUP board.
        href: /v2/inflatable-sup-maintenance
      - title: Mga Pangunahing Kaalaman sa Pagkukumpuni ng Board
        desc: Ayusin ang maliliit na butas, tagas sa tahi, at mga isyu sa balbula gamit ang PVC repair kits at mga teknik sa pagbibitay patch.
        href: /v2/inflatable-sup-repair
