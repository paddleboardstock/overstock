hero:
  tagline: Paddle Board Overstock Akademya
  title: Sentro ng Pagkatuto
  subtitle: Mga gabay at tutorial para sa bawat antas ng kasanayan — mula sa SUP mga pangunahing kaalaman hanggang sa advanced na mga teknika sa pagsagip
categories:
  - level: Nagsisimula
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Mga Pangunahing Kaalaman
        desc: Matutunan ang mga pundasyon ng stand-up paddleboarding — tindig, teknik sa paga, at balanse.
        slug: beginner-sup-guide
      - title: Mga Teknik sa Paga
        desc: Forward stroke, sweep stroke, draw stroke, at low brace — masterin ang mahahalagang galaw sa paga.
        slug: sup-paddle-guide
      - title: Kaligtasan Muna
        desc: Mahahalagang kasanayan sa kaligtasan kabilang ang pagsuri ng panahon, PFD paggamit, mga patakaran sa leash, at self-rescue.
        slug: sup-safety-guide
  - level: Intermediate
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Mga Mahahalagang Bagay sa Touring
        desc: Pagpaplano ng multi-hour na paga — nabigasyon, pag-inom ng tubig, pacing, at pagbasa ng mga forecast ng hangin.
        slug: touring-sup-guide
      - title: Pagbasa ng Panahon
        desc: Interpretasyon ng mga marine forecast, pagtukoy sa pattern ng ulap, at pag-unawa sa epekto ng hangin sa tubig.
        slug: weather-planning-water-sports
      - title: Mga Pangunahing Kaalaman sa Nabigasyon
        desc: Pagbabasa ng chart, paggamit ng compass, GPS waypoints, at pagpaplano ng ruta para sa paddling sa baybayin.
        slug: sup-navigation-guide
      - title: Kamalayan sa Tidal
        desc: Pag-unawa sa mga cycle ng tide, agos, at kung paano ito nakakaapekto sa oras ng paglulunsad at ruta.
        slug: understanding-tides
  - level: Advanced
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Pagpaplano ng Multi-Araw na Paglalakbay
        desc: Logistics ng ekspedisyon — pagpili ng kagamitan, pagpaplano ng pagkain, mga protocol sa kaligtasan, at emergency contacts.
        slug: sup-travel-guide
      - title: Mga Teknik sa Pagsagip
        desc: Self-rescue, T-rescue, eskimo rescue para sa mga kayak, at mga protocol sa paghatak sa bukas na tubig.
        slug: sup-self-rescue
      - title: Paggawa ng Paga sa Gabi
        desc: Nabigasyon pagkatapos ng dilim — mga kinakailangang ilaw, memorya ng ruta, komunikasyon sa grupo, at kamalayan sa panganib.
        slug: sup-navigation-guide
  - level: Pagpapanatili
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Paglilinis at Pangangalaga
        desc: Banlawan sa sariwang tubig, UV proteksyon, pag-iwas sa amag, at tamang paraan ng pagpapatuyo pagkatapos ng bawat session.
        slug: inflatable-sup-maintenance
      - title: Gabay sa Pag-iimbak
        desc: Pinakamahusay na mga pamamaraan sa pag-iimbak ng inflatable na mga board at bangka — pagpapalabas ng hangin, pagtupi, kontrol ng temperatura, at tagal ng buhay sa istante.
        slug: inflatable-sup-storage
      - title: Mga Pangunahing Kaalaman sa Pagkukumpuni
        desc: Ayusin ang maliliit na butas, tagas sa tahi, at mga isyu sa balbula gamit ang PVC repair kits at mga teknik sa pagbibitay patch.
        slug: inflatable-sup-repair
      - title: Pagpapanatili ng Balbula
        desc: Tukuyin ang mga uri ng balbula (Halkey-Roberts, Boston, Leafield), linisin ang mga dumi, at palitan ang mga sira na stems.
        slug: inflatable-sup-repair
knowledge_center_tagline: Sentro ng Kaalaman
knowledge_center_title: Mga Gabay sa Kagamitang Pangdagat at Industriya
knowledge_center_subtitle: Ekspertong kaalaman at mga gabay sa pagbili para sa mga propesyonal sa dagat, mga operator ng fleet, at mahilig sa water sports.
knowledge_sections:
  - title: RIB Kaalaman sa Bangka
    tagline: Mga Gabay sa Rigid Inflatable Boat
    desc: Lahat tungkol sa RIB bangka — disenyo ng hull, materyales, pagpili ng makina, pagpapanatili, at mga payo sa pagbili para sa komersyal at rekreasyonal na gamit.
    guides:
      - title: Paano Pumili ng Tamang RIB Bangka
        desc: Kompletong gabay sa pagpili ng RIB — sukat, lakas ng makina, materyal ng tubo, uri ng hull, at layunin ng paggamit.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB laban sa Inflatable na Bangka
        desc: Rigid inflatable boat laban sa tradisyunal na inflatable dinghy — paghahambing ng disenyo ng hull, performance, tibay, at kapasidad.
        href: /compare/rib-vs-dinghy
      - title: Komersyal na RIB laban sa Rekreasyonal na RIB
        desc: Komersyal na uri laban sa rekreasyonal na RIB bangka — pamantayan sa konstruksyon, materyales, haba ng buhay, gastos, at mga sertipikasyon.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminyo laban sa Fiberglass na Hull
        desc: Paghahambing ng aluminyo at fiberglass na hulls para sa RIB bangka ayon sa timbang, gastos, tibay, at resistensya sa kaagnasan.
        href: /compare/aluminum-vs-fiberglass
  - title: Gabay sa Inflatable na Bangka
    tagline: Kaalaman sa Inflatable na Sasakyang Pandagat
    desc: Komprehensibong mga gabay sa inflatable na bangka — PVC laban sa Hypalon, mga paraan ng konstruksyon, pamantayan sa kaligtasan, at pinakamahusay na pamamaraan sa pagpapanatili.
    guides:
      - title: PVC laban sa Hypalon Gabay sa Materyal
        desc: Tiyak na paghahambing sa pagitan ng PVC at Hypalon CSM para sa konstruksyon ng inflatable na bangka.
        href: /compare/pvc-vs-hypalon
      - title: Paano Ginagawa ang Inflatable na Bangka
        desc: Proseso ng paggawa — paggupit ng materyal, HF welding, konstruksyon ng tahi, pagsubok ng presyon, at kontrol sa kalidad.
        href: /learn/inflatable-technology
      - title: Gabay sa Kaligtasan ng Inflatable na Bangka
        desc: Pamantayan sa kaligtasan, kapasidad ng karga, tamang pagpapalobo, tsek bago umalis, at mga pamamaraan sa emerhensya.
        href: /learn/water-safety
      - title: Pagpapanatili ng Inflatable na Bangka
        desc: Paglilinis, pag-iimbak, proteksyon ng UV, pagpapanatili sa taglamig, at pagkukumpuni ng inflatable na bangka at RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Kaalaman sa Bangka
    tagline: Pumutok na Bangka at RIB Hub
    desc: Mga teknikal na gabay na sumasaklaw sa mga uri ng pumutok na bangka, materyales, paraan ng paggawa, pagpapanatili, at kaligtasan — mula sa mga dinghy hanggang sa RIBs.
    guides:
      - title: Mga Uri ng Pumutok na Bangka
        desc: Dinghy, RIBs, kayak, at tender — alamin ang pagkakaiba at pumili ng tama.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Teknolohiya
        desc: Paano ang libu-libong panloob na sinulid ay lumilikha ng matibay, mataas na presyur na pumutok na estruktura.
        href: /learn/drop-stitch-core
      - title: Sanggunian ng Materyales
        desc: PVC denier ratings, bigat ng tela, UV resistensya, at mga materyales na pang-dagat na ipinaliwanag.
        href: /learn/materials
      - title: RIB kumpara sa Dinghy
        desc: Ihambing ang rigid inflatable boats sa tradisyonal na pumutok na dinghy para sa iba't ibang gamit.
        href: /compare/rib-vs-dinghy
  - title: SUP Kaalaman
    tagline: Gabay sa Stand-Up Paddleboard
    desc: Lahat tungkol sa SUP boards — pumutok vs matigas, sukat ng board, teknolohiya ng materyales, at gabay ng eksperto para sa lahat ng antas ng kasanayan.
    guides:
      - title: Pumutok vs Matigas na SUP
        desc: Ihambing ang iSUP at matigas na epoxy boards sa pagiging portable, tibay, pagganap, at halaga.
        href: /learn/sup
      - title: Gabay sa Sukat ng SUP Board
        desc: Paano nakakaapekto ang haba, lapad, at kapal sa katatagan, bilis, at kakayahang manikyur.
        href: /learn/sup
      - title: SUP Pagpapanatili at Pangangalaga
        desc: Paglilinis, imbakan, UV proteksyon, at mga tip sa pag-aayos para sa pumutok na SUP boards.
        href: /v2/inflatable-sup-maintenance
      - title: Pagpili ng Iyong Unang SUP
        desc: Gabay para sa mga nagsisimula sa pagpili ng tamang stand-up paddleboard para sa iyong timbang, antas ng kasanayan, at layunin ng paggamit.
        href: /learn/sup
  - title: Gabay sa Kagamitan sa Pagdaive
    tagline: Kaalaman sa Komersyal na Dive Boat
    desc: Espesyal na gabay sa dive boats, dive RIBs, at kagamitan para sa mga diving center, dive operator, at mga komersyal na dive team.
    guides:
      - title: Pinakamahusay na RIB Bangka para sa Mga Diving Center
        desc: Paano pumili ng tamang dive RIB para sa iyong diving center — kapasidad, konfigurasyon, at konsiderasyon sa budget.
        href: /solutions-diving-center-boats
      - title: Gabay sa Konfigurasyon ng Dive RIB
        desc: Mahahalagang tampok para sa dive RIBs — mga tank rack, sistema ng hagdan, dive platform, at imbakan ng kagamitan.
        href: /solutions-diving-center-boats
  - title: Gabay sa Yacht Tender
    tagline: Mga Solusyon para sa Superyacht at Marine Tender
    desc: Mga gabay sa pagpili ng perpektong yacht tender — inflatable na tender, RIB tender, mga solusyon sa imbakan, at mga accessories ng tender.
    guides:
      - title: Paano Pumili ng Tender ng Yate
        desc: Mga salik na dapat isaalang-alang kapag pumipili ng tender para sa iyong yate — laki, materyal, makina, at imbakan.
        href: /solutions-yacht-tender-solutions
      - title: Pampalobo laban sa RIB Mga Tender
        desc: Ihambing ang mga inflatable na bangka tender sa mga rigid inflatable boat tender sa pagganap, tibay, at kakayahang maiimbak.
        href: /compare/rib-vs-dinghy
  - title: Gabay sa Kagamitang Pangligtas
    tagline: Kaalaman sa Mga Sasakyang Tubig para sa Paghahanap at Pagsagip
    desc: Propesyonal na mga gabay sa mga bangka ng pagliligtas, sasakyang panlaban sa tubig ng SAR, at kagamitan sa agarang pagtugon para sa guwardiya sa baybayin, mga tagapangalaga ng baybayin, at mga koponang panggawaing pangkalamidad.
    guides:
      - title: Gabay sa Pagpili ng Bangka ng SAR
        desc: Paano pumili ng tamang bangka para sa paghahanap at pagsagip — bilis, kapasidad, tibay, at mga kinakailangan sa espesyal na kagamitan.
        href: /solutions-rescue-watercraft
      - title: Pangkalakal RIB para sa Mga Operasyon ng Pagsagip
        desc: Bakit ang commercial-grade RIBs ang pinipiling opsyon ng mga propesyonal na pangkat sa paghahanap at pagliligtas sa buong mundo.
        href: /use-cases/search-and-rescue
