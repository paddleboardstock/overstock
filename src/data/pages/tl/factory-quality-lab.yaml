hero:
  tagline: Laboratoryo para sa Kontrol ng Kalidad
  title: Laboratoryo sa Pagsusuri at Pagtiyak ng Kalidad
  subtitle: Independiyenteng kalidad na laboratoryo — bawat yunit sinusuri bago ipadala
intro: Paddle Board Overstock nagpapatakbo ng nakalaang laboratoryo para sa kontrol ng kalidad na hiwalay sa produksyon. Bawat batch ng hilaw na materyal at bawat natapos na board ay dumadaan sa dokumentadong mga protocol ng inspeksyon bago ilabas. Ang aming koponan sa QC ay direktang nag-uulat sa pamunuan, na tinitiyak ang walang kinikilingang desisyon sa kalidad.
highlights:
  - value: 100%
    label: Mga yunit na sinubok sa presyon
    detail: Bawat silid, bawat board
  - value: 48 h
    label: Tagal ng pagsubok ng pagpapanatili ng hangin
    detail: Sa 1.25× na rated na presyon
  - value: <5%
    label: Maximum na pinapayagang pagbaba ng presyon
    detail: Sa loob ng 24-oras na panahon ng pagtigil
  - value: 99.3%
    label: Rate na walang depekto
    detail: Mga pagpapadala sa nakaraang 12 buwan
test_procedures:
  - title: Pagsusuri ng Hilaw na Materyal
    description: Bawat papasok na batch ng PVC, drop-stitch na tela, EVA na foam, at hardware ay sinusuri bago tanggapin. Masusuri ang tensile strength, tear resistance, at UV resistance. Ang mga materyal na hindi pumasa sa pamantayan ay ikino-kwarantina at ibinabalik.
    standards:
      - Tensile strength (min 350 N/cm)
      - Tear resistance
      - UV resistance (1,000 h)
  - title: Pagpapatupad ng QC sa Proseso
    description: Ang mga production operator ay nagsasagawa ng sariling inspeksyon sa bawat yugto. Ang mga QC auditor ay gumagawa ng random sampling sa buong shift. Ang weld peel test ay isinasagawa bawat 50 yunit. Ang pagsuri sa sukat ay ginagawa sa bawat ika-20 panel.
    standards:
      - Peel test bawat 50 yunit
      - Internal na 100-point checklist
      - Random sampling audits
  - title: 48-Oras na Pagsusuri ng Pagpapanatili ng Hangin
    description: Bawat tube chamber ay pinapalobo sa 125% ng rated na presyon at pinananatili ng 48 oras. Ang mga pressure sensor ay nagre-record nang tuloy-tuloy na may compensation sa temperatura. Ang anumang chamber na lumalagpas sa 5% pagbaba ng presyon ay awtomatikong nagti-trigger ng muling inspeksyon ng batch.
    standards:
      - 1.25x rated pressure hold
      - <5% max pressure drop
  - title: Pagsusuri ng Load at Balanseng
    description: Ang mga natapos na board ay sinusuri sa maximum na rated na kapasidad para sa katatagan, freeboard, at paghawak. Bawat board ay sumasailalim sa pagsusuri sa tubig bago ang huling aprubal sa inspeksyon.
    standards:
      - 1.25x rated load verification
      - Pagsusuri ng tubig
