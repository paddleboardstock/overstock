features3_solutions:
  tagline: Mga Solusyon
  title: Ang Iyong Pakikipagsapalaran sa Tubig<br />Kasosyo sa Negosyo
  isBeforeContent: false
  columns: 3
  items:
    - title: Mga Club sa Water Sports
      description: Kumpletong pakete ng kagamitan, custom branding, at mga programa sa pagpapanatili para sa SUP club, kayak club, surf school, at mga sentro ng pagsasanay.
      icon: tabler:users
      link: /solutions/clubs
    - title: Water sports RIBs
      description: Espesyal na ginawa ang RIBs para sa mga paaralan ng paglalayag, sentro ng water sports, at mga organisasyon ng kaganapan. Mga bangka para sa coach, tow boats, at marshal craft para sa propesyonal na water sports.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Mga Resort at Hotel
      description: Mga premium na programa sa water sports na may fleet equipment, safety system, pagsasanay ng tauhan, at pamamahala ng kita para sa mga property ng hospitality.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Mga Entrepreneur ng Water Brand
      description: Private label na OEM/ODM na pagmamanupaktura na may mababang MOQs, custom na disenyo ng produkto, packaging, at pandaigdigang pagpapadala para sa mga bagong may-ari ng brand.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Mga Bangka ng Diving Center
      description: Matatag na RIB platform na may madaling pasukan/paglabas, imbakan ng kagamitan, at mga configuration ng makina na na-optimize para sa operasyon ng diving.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Mga Rescue at Emergency Watercraft
      description: Mataas na bilis na RIBs at inflatable na mga bangka na idinisenyo para sa search and rescue, emergency response, at operasyon ng coast guard.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Mga Solusyon sa Yacht Tender
      description: Compact, stylish na RIB tenders na bumabagay sa superyachts at mga recreational vessels. Madaling imbakan, malakas na performance.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Mga Solusyon sa Bangka para sa Pangingisda
      description: Matatag, matibay na inflatable na mga bangka at RIBs na naka-configure para sa komersyal at recreational na pangingisda.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Kagamitan sa Turismo sa Dagat
      description: Mga bangkang inflatable na handa sa fleet, mga SUP na board, at mga kayak para sa mga resort, tour operator, at negosyo sa pagrenta ng water sports.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Enerhiya sa Malalayong Lugar RIBs
      description: Matibay na RIBs para sa suporta sa plataporma ng langis at gas, paglilipat ng crew sa wind farm, inspeksyon ng subsea cable, at konstruksyon sa dagat.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Mga Bangkang Pang-Aquaculture
      description: Resistenteng panlaban sa kalawang na RIBs para sa pagpapalahi ng isda, pagtatanim ng perlas, at pangangalaga sa karagatan. Mga Hypalon na tubo, hardware na gawa sa stainless steel, tibay sa araw-araw na paggamit.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Pananaliksik at Survey sa Dagat
      description: Matatag at handa para sa instrumento na RIBs para sa oceanographic research, pagmamanman ng kapaligiran, sampling ng kalidad ng tubig, at mga programa sa pagtuturo sa unibersidad.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Mga Komersyal na Bangka
      description: Matibay na RIBs para sa patrol, survey, transportasyon, at offshore logistics. Ginawa para sa mabigat na pangangailangan ng komersyal na operasyon.
      icon: tabler:ship
      link: /commercial-workboats
cta:
