        pvc: Maganda
        hypalon: Napakahusay
      - property: Tensile Strength
        pvc: 3,000–5,000 N/5cm
        hypalon: 2,500–4,000 N/5cm
      - property: Timbang bawat m²
        pvc: 850–1,200 g
        hypalon: 1,100–1,500 g
      - property: Cold Flex
        pvc: -30°C
        hypalon: -20°C
      - property: Paraan ng Pagdikit
        pvc: RF welding / Hot air welding
        hypalon: Pagdidikit sa kamay (contact cement)
      - property: Kakayahang maayos
        pvc: Madali (init na hinang o pandikit)
