        hypalon: Mahusay (malawak na saklaw ng kemikal)
section_testing:
  title: Mga Protoko para sa Pagsusuri at Kaligtasan
  subtitle: Ang balangkas ng pagtiyak sa kalidad ng Paddle Board Overstock para sa bawat batch ng produksyon
  protocols:
    - title: 1.25x Pagsubok sa Paghawak ng Presyur na Iniranggo
      description: Bawat pinagsama-samang sisidlan ay pinapalobo hanggang 1.25x ng nakasaad nitong karaniwang presyon sa operasyon at pinananatili sa loob ng 24–48 oras. Anumang pagbaba ng presyon na lampas sa 2% ay nagdudulot ng pagtanggi at muling paggawa.
      standard: ISO 6185
    - title: Pagsusuri ng Lakas ng Pagbabalat ng Tahi
      description: Ang mga halimbawa ng weld at glue seam mula sa bawat batch ng produksyon ay sinusuri para sa lakas ng pagtanggal gamit ang na-calibrate na kagamitan sa tensyon. Kinakailangan ang minimum na 4 kN/m na paglaban sa pagtanggal.
      standard: ISO 2411
    - title: Pagsubok sa Tensional ng Tela
      description: Ang mga papasok na rolyo ng tela ay sumasailalim sa pagsubok ng lakas sa hilab at pag-uunat sa parehong direksyon ng warp at weft. Ang antas ng pagtanggi ay mas mababa sa 3,000 N/5cm para sa PVC.
      standard: ISO 1421
    - title: UV Pinabilis na Pagguho ng Panahon
      description: Ang mga sample ng materyal ay isinasailalim sa 1,000+ na oras ng pinabilis na UV na eksposisyon sa mga QUV test chamber. Pinapayagan ang maximum na 15% na pagkawala ng tensile strength.
      standard: ASTM G154
    - title: Integridad ng Balbula at Pagkakabit
      description: Ang bawat assembleng balbula ay sinusubok para sa integridad ng selyo sa 1.25x ng tinukoy na presyon. Ang mga leak-back na balbula ay sinusubok para sa pagganap ng one-way seal.
      standard: ISO 12402
section_manufacturing:
  title: Mga Pamantayan sa Paggawa at Sertipikasyon ng Kalidad
  subtitle: Pagsunod sa pamantayan ng industriya para sa pag-access sa pandaigdigang merkado
  standards:
    - name: ISO 9001:2015
      body: SGS Sertipikado
      scope: Sistema ng pamamahala ng kalidad sa disenyo, produksyon, at paghahatid
    - name: CE 2013/53/EU
      body: EU Notified Body
      scope: Direktiba sa mga Sasakyang Panglibangan — disenyo ng hull, katatagan, pampalutang, emissions
    - name: BSCI
      body: Amfori
      scope: Pagsunod sa sosyal — kaligtasan ng manggagawa, makatarungang paggawa, pamamahala sa kapaligiran
    - name: ISO 6185
      body: Internasyonal na Pamantayan
      scope: Mga inflatable na bangka — konstruksyon, katatagan, pampalutang, pagsubok sa presyon
    - name: REACH
      body: Regulasyon ng EU
      scope: Kaligtasan sa kemikal — mga bawal na substansya sa materyales at coatings
section_faq:
  title: Teknikal na FAQ
  questions:
    - q: Paano ikinumpara ang drop-stitch sa tradisyonal na konstruksiyong hard-shell?
      a: Ang modernong drop-stitch cores sa 20 PSI ay nakakamit ng 85–90% ng katigasan ng katumbas na EPS foam/fiberglass hard shells, habang ganap na nadidideflate para sa transportasyon. Ang kapalit nito ay bahagyang mas mataas na timbang at mas mababang ultimate stiffness — ngunit para sa karamihan ng mga recreational at komersyal na aplikasyon, ang diperensya ay maliit.
    - q: Anong thread density ang itinuturing na premium na kalidad?
      a: Ang premium na drop-stitch na tela ay gumagamit ng 2 threads bawat square inch (humigit-kumulang 3,100 threads per m²) na hinabi mula sa 1,680 DTEX polyester yarn. Ang panimulang antas ng tela ay gumagamit ng 1 thread bawat sq in na may 1,100 DTEX yarn.
    - q: Maaari bang i-weld ang Hypalon tulad ng PVC?
      a: Hindi. Ang Hypalon/CSM ay hindi maaaring RF welded. Dapat itong buuin gamit ang manwal na inilapat na contact cement, na ginagawang mas labor-intensive ang produksyon at ang mga seams ay nakadepende sa kasanayan ng operator. Ang PVC ay maaaring RF welded o hot-air welded para sa pare-parehong, automated na kalidad ng seam.
    - q: Ano ang maximum na ligtas na presyon para sa mga inflatable na bangka?
      a: Ang standard na inflatable na bangka tubes ay gumagana sa 8–12 PSI. Ang Drop-stitch floors ay gumagana sa 12–20 PSI. Ang high-pressure na drop-stitch cores (SUPs) ay maaaring gumana sa 20–25 PSI. Bawat produkto ay may mga pressure relief valve na naka-calibrate upang maiwasan ang labis na inflasyon.
    - q: Gaano katagal bago makagawa ng custom na inflatable na bangka?
      a: Ang standard na OEM na produksyon ay tumatagal ng 30–45 araw mula sa kumpirmasyon ng order hanggang FOB Qingdao. Ang pagbuo ng custom mold ay nagdadagdag ng 15–20 araw para sa prototype production at testing.
