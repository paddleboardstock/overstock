hero:
  tagline: Pampanitikang Papel ng Inhinyeriya
  title: Drop-Stitch Teknolohiya at Agham ng Materyales:<br />Ang Inhinyeriya sa Likod ng Modernong Inflatable na Sasakyang Pantubig
  subtitle: Isang awtoritatibong teknikal na sanggunian na sumasaklaw sa drop-stitch pangunahing konstruksyon, PVC kumpara sa Hypalon paghahambing ng materyal, pagsubok sa tigas ng high-pressure na sisidlan, at pamantayan sa paggawa ng sasakyang pantubig.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-design-discussion-lab.webp
    alt: Paddle Board Overstock R&D laboratory — pagsubok ng materyales at inhinyeriya
direct_answer: Drop-stitch teknolohiya ay gumagamit ng libu-libong panloob na hibla ng polyester na nag-uugnay sa itaas at ibabang mga patong ng tela ng inflatable na core. Kapag pinatakbo sa 15–20 PSI, ang mga hibla na ito ay gumaganap bilang mga kasapi ng tensyon, pinipigilan ang paglobo at lumilikha ng matibay na istrukturang maihahambing sa konstruksiyong may matigas na balat. Pinagsasama sa advanced na PVC o Hypalon na coatings ng tela at RF welding, nagbibigay ito ng portable, mataas na pagganap na inflatable na sasakyang pantubig na angkop para sa propesyonal, komersyal, at libangan na paggamit.
section_drop_stitch:
  title: Drop-Stitch Inhinyeriyang Estruktural
  subtitle: Paano binabago ng libu-libong hibla ang nababaluktot na tela sa matibay na istruktura
  content: |
    Drop-stitch (kilala rin bilang "drop-stitch tela" o "drop-stitch core") ay kumakatawan sa isang makabagong tagumpay sa inhinyeriya ng inflatable na istruktura. Ang prinsipyo ay madaling maunawaan: libu-libong indibidwal na hibla ng polyester ang sabay-sabay hinahabi sa dalawang hiwalay na patong ng base na tela, na nag-uugnay sa itaas at ibabang panel sa 90-degree na anggulo.

    Kapag pinuno ng hangin ang selyadong silid, ang panloob na presyon ng hangin ay gumagawa ng puwersa nang pantay sa lahat ng direksyon — sinusubukan nitong itulak ang itaas at ibabang panel palayo sa isa’t isa patungo sa hugis silindro. Ang libu-libong drop-stitch hibla ay tumutol sa paghihiwalay na ito, inilipat ang load sa tensyon sa kahabaan ng hibla. Ang resulta ay isang patag, matibay na panel na makakayanan ang 15–20 PSI ng panloob na presyon.

    Sa 20 PSI, ang 1 m² drop-stitch panel ay nakakaranas ng humigit-kumulang 14,000 kg ng kabuuang panloob na puwersa — ngunit ang matrix ng hibla ay pinapanatili itong patag. Ito ay nagbibigay sa drop-stitch na istruktura ng ratio ng lakas-sa-bigat na katumbas ng tradisyonal na matitigas na materyales.
section_materials:
  title: PVC kumpara sa Hypalon — Teknikal na Paghahambing ng Materyales
  subtitle: Obhetibong datos para sa may kaalamang pagpili ng materyales sa paggawa ng inflatable na sasakyang pantubig
  table:
    columns:
      - header: Ari-arian
      - header: PVC (Polyvinyl Chloride)
      - header: Hypalon (CSM)
    rows:
      - property: UV Tibay
        pvc: Maganda (kasama ang UV stabilizers)
        hypalon: Napakahusay (inherent)
