timeline:
  - year: '2012'
    title: Pundasyon ng Paggawa ng Marine
    body: Aquafarer nagsimula bilang isang espesyal na workshop para sa inflatable na sasakyang pantubig sa Qingdao, China, na nakatuon sa husay sa paggawa ng marine at paggawa ng inflatable na bangka. Ang unang pokus ay ang paggawa ng maaasahang inflatable na produkto sa pamamagitan ng praktikal na karanasan sa inhinyeriya at disiplina sa paggawa.
  - year: '2015'
    title: Unang Eksport at CE Sertipikasyon
    body: Ang mga unang order ng eksport ay umabot sa Japan at Korea. Nakamit ang CE sertipikasyon para sa pangunahing linya ng produkto, na nagmamarka ng pagpasok ng Aquafarer sa pandaigdigang merkado. Nagsimulang magsilbi ang kumpanya sa mga komersyal at rekreasyonal na gumagamit lampas sa China.
  - year: '2018'
    title: Paglawak ng Pabrika
    body: Lumipat sa isang 12,000 m² na pasilidad ng produksyon. Nagdagdag ng mga linya ng RF welding at drop-stitch kapasidad ng produksyon, na nagpapahintulot ng mas malaking sukat ng paggawa at pinahusay na mga sistema ng kontrol sa kalidad.
  - year: '2020'
    title: Pagtatatag ng R&D Center
    body: Bumukas ng dedikadong R&D center na may PVC lab ng tela, tangke ng pagsusuri ng hydrodynamics, at CAD/FEA simulation studio. Pinalawak ang pag-develop ng produkto upang tumuon sa magaan na konstruksyon, pinahusay na tibay, at disenyo na nakasentro sa gumagamit.
  - year: '2022'
    title: Sertipikasyon at Pandaigdigang Paglago
    body: Nakamit ang ISO 9001 sertipikasyon. Pinalawak sa 14 R&D engineer at 200+ manggagawa. Ang mga produkto ay umabot sa mga customer sa buong Europe, Americas, at Asia-Pacific sa pamamagitan ng distributor at OEM pakikipagtulungan.
  - year: '2024'
    title: Inobasyon at Design Studio
    body: Inilunsad ang full-service design at innovation studio para sa custom ODM proyekto, mula konsepto hanggang produksyon. Pinatibay ang propesyonal na aplikasyon sa marine kabilang ang rescue, komersyal, at government tenders.
  - year: '2026'
    title: Pagtatayo ng Hinaharap ng Paggalugad sa Tubig
    body: Sa ngayon, patuloy na nagde-develop ang Aquafarer ng inflatable na bangka, SUP mga sistema, at pasadyang solusyon sa marine — na nag-uugnay sa mga tao at organisasyon sa mga tubig ng mundo. 50+ bansang sinerbisyuhan, 15,000 yunit taunang kapasidad.
content_founding:
  tagline: Ang Simula
  title: Ipinanganak sa Baybayin
  subtitle: 'Nagsimula ang Aquafarer sa isang coastal workshop sa Qingdao na may isang bangka at isang bisyon: gumawa ng inflatable na sasakyang pantubig na kayang harapin ang totoong kundisyon ng dagat.'
  paragraphs:
    - Noong 2012, nakita ng aming mga tagapagtatag ang isang puwang sa merkado — karamihan sa inflatable na bangka ay alinman sa abot-kaya ngunit hindi maaasahan, o mataas ang kalidad ngunit sobrang mahal. Naniniwala sila na may puwang para sa isang tagagawa na naghahatid ng parehong kalidad at halaga.
    - Ang unang hull ay ginawa nang mano-mano, sinubukan sa lokal na tubig, at pinino batay sa totoong feedback mula sa mga mangingisda at maliliit na komersyal na operator. Ang feedback loop na iyon — build, test, listen, improve — ay nananatiling sentro ng ating pilosopiya sa engineering hanggang ngayon.
    - Pagsapit ng 2015, kumalat na ang balita lampas sa Qingdao. Nagsimulang humingi ng sample ang mga internasyonal na distributor. Ang nagsimula bilang lokal na workshop ay naging pandaigdigang supplier.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer maagang pagawaan ng produksyon at paggawa
content_growth:
  tagline: Paglago at Inobasyon
  title: Mula sa Pagawaan hanggang sa 12,000 m² na Pasilidad
  subtitle: Ang tuloy-tuloy na pamumuhunan sa tao, kagamitan, at proseso Aquafarer ay naging isang modernong pasilidad ng paggawa sa dagat.
  paragraphs:
    - Habang lumalaki ang demand, lumaki rin ang aming pasilidad. Pinalawak namin mula sa maliit na workshop patungo sa 12,000 m² na pabrika na may dedikadong linya ng produksyon para sa RIB mga bangka, inflatable boats, SUP boards, at accessories.
    - Nag-invest kami sa CNC mga cutting machine, high-frequency welding equipment, drop stitch production lines, at komprehensibong testing rigs — na nagpapahintulot sa amin na kontrolin ang bawat aspeto ng kalidad ng produksyon.
    - Sa kasalukuyan, ang aming koponan na binubuo ng 200-300 ay binubuo ng mga marine engineer, material scientist, mga espesyalista sa quality control, at mga bihasang manggagawa — marami sa kanila ay kasama Aquafarer na mula pa noong mga unang panahon.
founder:
  tagline: Kilalanin ang Tagapagtatag
  title: Itinayo ng isang Waterman
  subtitle: Pinagsasama ng tagapagtatag na si David Chen ang kadalubhasaan sa paggawa at panghabambuhay na pagmamahal sa water sports — isang kombinasyon na nagtatakda kung paano Aquafarer nilalapitan ang pagbuo ng produkto.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Tagapagtatag ng Aquafarer
  story:
    - Lumaki si David Chen sa baybayin ng Qingdao, kung saan ang dagat ay hindi isang destinasyon ng bakasyon kundi isang paraan ng pamumuhay. Ginugol niya ang kanyang kabataan sa kayaking, paglalayag, at pangingisda sa Yellow Sea — mga karanasang nagbigay sa kanya ng likas na pag-unawa kung ano ang kailangang tiisin ng mga sasakyang pandagat.
    - Bago itatag, Aquafarerginugol ni David ang isang dekada sa marine manufacturing, na nagtatrabaho sa produksyon, kalidad, at internasyonal na kalakalan. Pinamahalaan niya OEM ang mga programa para sa mga brand sa Europa at Hilagang Amerika, at natutunan ang mga pamantayan at inaasahan ng mga pandaigdigang merkado nang personal.
    - 'Noong 2012, itinatag niya Aquafarer ito na may simpleng misyon: gumawa ng inflatable watercraft na pinagkakatiwalaan niya kasama ang kanyang pamilya sa tubig. Ang personal na pamantayan na iyon — gagamitin ko ba ito? — ay nananatiling huling pagsubok para sa bawat produktong lumalabas sa pabrika.'
    - Ngayon, pinamumunuan ni David ang estratehiya ng produkto at pinangangasiwaan ang R&D team, personal na nire-review ang mga bagong disenyo at sinusubukan ang mga prototype sa tubig malapit sa Qingdao. Naniniwala siya na ang magagandang produkto ay nagmumula sa pag-unawa sa engineering at karanasan.
philosophy:
  tagline: Pilosopiya ng Tatak
  title: Kalayaan sa Inhinyeriya sa Tubig
  body: Ang kalayaan sa tubig ay hindi lamang tungkol sa paggalaw. Ito ay kumakatawan sa pagtuklas ng mga bagong lugar, paglikha ng mga karanasan sa labas, pag-uugnay ng mga tao sa kalikasan, at pagpapahintulot ng mga propesyonal na misyon. Ginagawang posible ng engineering ang kalayaang iyon.
  pillars:
    - title: Unahin ang pagiging maaasahan
      body: Ang mga kapaligiran sa tubig ay nangangailangan ng tiwala.Aquafarer Ang mga produkto ay dinisenyo batay sa katatagan, tibay, kaligtasan, at tuloy-tuloy na pagganap.
    - title: Disenyo na Nakasentro sa Tao
      body: Dapat magsilbi ang mga produkto sa tao, hindi teknolohiya. Bawat desisyon sa disenyo ay nagsisimula sa pag-unawa kung paano ginagamit ng mga tao ang watercraft, saan sila nag-eexplore, at anong mga hamon ang kanilang kinakaharap.
    - title: Madaling Tuklasin
      body: Ang tubig ay hindi dapat pag-aari lamang ng mga eksperto.Aquafarer lumilikha ng kagamitan na nagpapahintulot sa mas maraming tao na ligtas na maranasan ang mga ilog, lawa, karagatan, at baybaying-dagat.
    - title: Tuloy-tuloy na Inobasyon
      body: Ang inobasyon ay hindi lamang paglikha ng mga bagong produkto. Ito ay pagpapabuti ng bawat detalye — mga materyales, estruktura, paggawa, at karanasan ng gumagamit.
engineeringDna:
  tagline: DNA ng Inhinyeriya
  title: Paano Aquafarer Lumilikha ng Mga Produkto
  areas:
    - title: Agham ng Materyales
      body: Aquafarer ay nakatuon sa pagpili ng angkop na materyales para sa iba't ibang kapaligirang-dagat. Ang mga pangunahing konsiderasyon ay kinabibilangan ng tibay sa pagsusuot, UV tibay, katatagan sa presyon, at pangmatagalang tibay.
      items:
        - Tibay sa Pagsusuot
        - UV Tibay
        - Katatagan sa Presyon
        - Pangmatagalang Tibay
    - title: Inhinyeriyang Pangstruktura
      body: Ang mga inflatable na sasakyang-tubig ay nangangailangan ng tumpak na balanse sa pagitan ng katigasan, bigat, portability, at katatagan. Ang Aquafarer na inhinyeriya ay nakatuon sa pag-optimize ng mga salik na ito sa pamamagitan ng drop-stitch pangunahing teknolohiya at advanced na konstruksiyon ng tahi.
      items:
        - Katigasan
        - Pag-optimize ng Bigat
        - Portability
        - Katatagan
    - title: Tumpak na Paggawa
      body: 'Bawat produkto ay dumadaan sa kontroladong mga proseso: paghahanda ng materyales, tumpak na pagputol, welding at bonding, pagsasama, inspeksyon ng kalidad, at pag-verify ng pagganap.'
      items:
        - Paghahanda ng Materyales
        - Tumpak na Pagputol
        - Welding at Bonding
        - Pagsasama at QC
    - title: Inhinyeriyang Sitwasyon ng Gumagamit
      body: Ang mga produkto ay binuo batay sa tunay na aplikasyon — libangan, pakikipagsapalaran, at propesyunal na paggamit — tinitiyak na bawat disenyo ay tumutugon sa tiyak na pangangailangan ng kanyang layuning kapaligiran.
      items:
        - Libangan
        - Pakikipagsapalaran
        - Professional
        - Komersyal
trustSignals:
  tagline: Mga Palatandaan ng Tiwala
  title: Bakit Aquafarer Ay Mapagkakatiwalaang Kasosyo
  manufacturing:
    title: Kakayahan sa Paggawa
    body: 12,000 m² na pasilidad ng produksyon na may 200-300 bihasang manggagawa at 14+ inhinyero sa R&D. ISO 9001 sertipikadong sistema ng pamamahala ng kalidad. Taunang output ng 15,000 yunit ng inflatable na sasakyang-tubig na naglilingkod sa 50+ bansa.
    stats:
      - label: Laki ng Pasilidad
        value: 12,000 m²
      - label: Lakas-Paggawa
        value: 200-300
      - label: Mga Inhinyerong R&D
        value: 14+
      - label: Taunang Kakayahan
        value: 15,000
  quality:
    title: Pangako sa Kalidad
    body: Mula sa inspeksyon ng materyal hanggang sa huling pagsusuri, pinapanatili ng Aquafarer ang sistematikong proseso ng kalidad upang makapaghatid ng maaasahang produktong pang-dagat. Ang bawat yunit ay sumasailalim sa pagsusuri ng presyon, inspeksyon ng tahi, at pagpapatunay ng pagganap bago ipadala.
    items:
      - CE Sertipikado — 64 na modelo ang nakakatugon sa pamantayan ng kaligtasan sa Europa
      - ISO 9001:2015 — Sertipikado ang sistema ng pamamahala ng kalidad
      - UKCA Markado — Pagsunod sa pamilihan sa UK
  global:
    title: Pandaigdigang Presensya
    body: Aquafarer nagseserbisyo sa mga kustomer sa maraming pandaigdigang pamilihan, sumusuporta sa mga distributor, outdoor brands, at mga propesyonal na gumagamit ng pang-dagat sa 50+ bansa sa Europa, Asia-Pacific, Americas, Middle East, at Africa.
comparison:
  tagline: Pagpo-posisyon ng Brand
  title: Aquafarer sa Pamilihan
  position: Isang tagagawa ng pang-dagat na nakatuon sa engineering na pinagsasama ang kadalubhasaan sa inflatable watercraft sa buong OEM/ODM kakayahan, mga custom na solusyon, at malalim na karanasan sa pagmamanupaktura.
  strengths:
    - Kadalubhasaan sa engineering ng inflatable watercraft
    - Buong kakayahan sa paggawa ng OEM/ODM
    - Pagbuo at disenyo ng custom na produkto
    - 12,000 m² ISO na pasilidad ng produksyon na sertipikado sa 9001
  bestFor:
    - Mga gumagamit ng outdoor recreation na naghahanap ng maaasahang inflatable watercraft
    - Mga operator sa dagat na nangangailangan ng kagamitan na pang-komersyo
    - Mga kasosyo sa brand na nangangailangan ng paggawa ng OEM/ODM
    - Mga propesyonal na organisasyon sa rescue at patrol
