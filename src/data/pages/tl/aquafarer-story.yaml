hero:
  tagline: Ang Aming Kwento
  title: Aquafarer — Ininhinyero ang Kalayaan sa Tubig
  subtitle: 'Mula sa isang coastal workshop hanggang sa isang pandaigdigang tagagawa ng marine — ang aming paglalakbay ay nakabatay sa matagal nang paniniwala: ang mga sasakyang pantubig ay dapat ininhinyero na parang mahalaga sila, dahil talagang mahalaga sila.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer pabrika at pasilidad sa paggawa ng marine sa Qingdao
