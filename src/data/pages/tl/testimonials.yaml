testimonials:
  - category: clubs
    name: Ricardo Santos
    title: May-ari, Algarve Surf Academy
    location: Lagos, Portugal
    content: Nagsimula kami sa Club Starter Package para sa aming surf school. 20 boards, paddles, vests — dumating ang lahat sa loob ng 3 linggo. Pagkatapos ng dalawang season, nag-upgrade kami sa Pro Package. Ang custom branding na may aming logo ay nagbago ng imahe namin bilang propesyonal.
    rating: 5
    product: Pangunahin na Pakete ng Klab
    source: solutions/clubs
  - category: clubs
    name: May-ari ng Club
    title: Klub ng Palakasan sa Tubig
    location: Phuket, Thailand
    content: Ang Club Starter Package ay perpektong panimulang punto. Habang lumago ang aming negosyo, lumago rin ang Paddle Board Overstock kasama namin — parehong kalidad, parehong presyo, walang sorpresa. Pinalawak namin mula 10 hanggang 80 boards sa loob ng 18 buwan.
    rating: 5
    product: Club Starter + Premium Package
    source: success-stories
  - category: resorts
    name: Pangkalahatang Manager ng Resort
    title: 5-Bituing Beach Resort
    location: Gresya
    content: Hindi lamang naghatid ng mga boards ang Paddle Board Overstock — tinulungan din nila kaming bumuo ng kompletong karanasan para sa mga bisita. Ang aming programa sa water sports ay mula sa wala hanggang sa pangunahing tampok ng resort sa isang season. 300+ na lingguhang booking at $180K sa taunang kita.
    rating: 5
    product: Premium na Pakete ng Resort
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktor ng Karanasan ng Panauhin, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock ang nagdisenyo at nagpuno ng kagamitan para sa aming buong programa ng aktibidad sa dalampasigan sa tatlong ari-arian ng resort. 80 SUPs, 40 kayak, mga safety infrastructure, at pagsasanay sa staff — lahat ay naihatid sa isang pagpapadala. Tumaas ng 60% ang pakikilahok ng mga bisita sa unang season.
    rating: 5
    product: Premium na Pakete ng Resort
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Tagapagtatag, Shoreline Paddle Co.
    location: California, USA
    content: Inilunsad ko ang aking SUP na tatak nang walang karanasan sa industriya. Ang koponan ng Paddle Board Overstock ay gumabay sa akin mula sa pagpili ng produkto hanggang sa disenyo ng custom logo at packaging. Dumating ang aking unang lalagyan sa loob ng 11 linggo, at naubos ko ito sa loob ng 3 buwan sa Amazon.
    rating: 5
    product: Paglunsad ng Brand ng Starter
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Tagapagtatag
    title: Brand ng Australyano SUP
    location: Australia
    content: May ideya ako para sa brand pero wala akong kaalaman sa paggawa. Literal na ginabayan ako ng Paddle Board Overstock sa buong proseso — mula sa pagpili ng tamang disenyo ng board hanggang sa pagbukas ng kauna-unahang shipment ko. 90 araw mula sa pangarap hanggang sa paghahatid.
    rating: 5
    product: Paketeng Paglulunsad ng Tatak
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: May-ari, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Nangungupahan ako ng 5 board mula sa lokal na tindahan at nawawala ang 60% ng aking kita sa kanila. Tinulungan ako ng Paddle Board Overstock na bumuo ng sarili kong fleet ng 15 SUPs. Ipinakita ng ROI calculator na makakabawi sa loob ng 4 na buwan — ngunit nangyari sa 3 buwan lang. Ngayon, pinalalaki ko na ito sa 30 board.
    rating: 5
    product: Pangunahing Kit ng Flota
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktor ng Operasyon, Adriatic Adventure Tours
    location: Dubrovnik, Croatia
    content: Pinagkakalooban namin ng Paddle Board Overstock RIBs ang buong fleet ng paupahang kagamitan — 12 na bangka sa tatlong lokasyon. Dalawang season ang lumipas, wala ni isang pagkabigo. Ang dokumento ng CE certification ay nagpadali ng pag-apruba ng insurance. Ang kanilang engineering team ay naka-customize pa ng kulay ng tubo.
    rating: 5
    product: Kagamitan para sa Pagpapalawak ng Flota
    source: trust
  - category: rental
    name: Lt. Commander Andres Reyes
    title: Opisyal sa Pagkuha, Philippine Coast Guard Auxiliary
    location: Manila, Philippines
    content: Nag-ooperate kami ng 24 Paddle Board Overstock RIBs sa buong coastal patrol fleet namin. Ang kanilang QC process ay pare-pareho sa bawat batch — parehong kalidad ng tahi, parehong posisyon ng valve, parehong rating ng presyon bawat oras. Mahalaga ang paulit-ulit na katumpakan kapag buhay ang nakasalalay sa kagamitan.
    rating: 5
    product: RIB Patrol Fleet
    source: trust
  - category: consumers
    name: Sarah K.
    title: Bagong May-ari SUP
    location: Lake Tahoe, USA
    content: Matatag kahit para sa isang ganap na baguhan. Dinala ko ito sa lawa sa aking unang araw at hindi ako nahulog. Ang kumpletong pakete kasama ang bomba at paga ay nangangahulugang nasa tubig na ako 20 minuto matapos buksan ang kahon.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP May-ari ng Explorer 11
    location: Vancouver, Canada
    content: Bilang isang unang beses na mamimili, kinakabahan ako sa kalidad ng pag-order mula sa ibang bansa. Ang ISO dokumentasyon at mga ulat ng pagsubok mula sa ikatlong partido na ibinahagi nila bago ko pa man hingin ay nagbigay sa akin ng ganap na kumpiyansa. Dumating ang board sa loob ng 6 na araw at lumabis pa sa aking mga inaasahan.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Pampalipas na Kayaker
    location: Florida, USA
    content: Matibay ang kalidad ng pagkakagawa. Mas mahusay na humawak sa mga alon sa baybayin kaysa sa inaasahan ko mula sa inflatable. Inilagay ko ito sa baul ng kotse para sa isang weekend trip — na-inflate sa rampa sa loob ng 4 na minuto.
    rating: 5
    product: Inflatable na Kayak
