testimonials:
  - category: clubs
    name: Ricardo Santos
    title: May-ari, Algarve Surf Academy
    location: Lagos, Portugal
    content: Nagsimula kami sa Club Starter Package para sa aming surf school. 20 boards, paddles, vests — dumating ang lahat sa loob ng 3 linggo. Pagkatapos ng dalawang season, nag-upgrade kami sa Pro Package. Ang custom branding na may aming logo ay nagbago ng imahe namin bilang propesyonal.
    rating: 5
    product: Pangunahin na Pakete ng Klab
    source: solutions/clubs
  - category: clubs
    name: May-ari ng Club
    title: Klub ng Palakasan sa Tubig
    location: Phuket, Thailand
    content: Ang Club Starter Package ang perpektong panimulang punto. Habang lumago ang aming negosyo, Paddle Board Overstock lumago kasama namin — parehong kalidad, parehong presyo, walang sorpresa. Lumaki kami mula 10 hanggang 80 boards sa loob ng 18 buwan.
    rating: 5
    product: Club Starter + Premium Package
    source: success-stories
  - category: resorts
    name: Pangkalahatang Manager ng Resort
    title: 5-Bituing Beach Resort
    location: Gresya
    content: Hindi lamang nagbigay ng boards ang Paddle Board Overstock — tinulungan din nila kaming bumuo ng kompletong karanasan para sa mga bisita. Ang aming water sports program ay umakyat mula zero hanggang sa maging tampok ng resort sa isang season. 300+ lingguhang bookings at $180K sa taunang kita.
    rating: 5
    product: Premium na Pakete ng Resort
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktor ng Karanasan ng Panauhin, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock Dinisenyo at nilagyan ng kagamitan ang buong beach activity program sa tatlong resort properties. 120 SUPs, safety infrastructure, at staff training — lahat ay naihatid sa isang shipment. Tumaas ng 60% ang partisipasyon ng mga bisita sa unang season.
    rating: 5
    product: Premium na Pakete ng Resort
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: May-ari, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Nangungupahan ako ng 5 boards mula sa isang lokal na tindahan at nawawalan ng 60% ng aking kita sa kanila. Tinulungan ako ng Paddle Board Overstock na bumuo ng sarili kong fleet ng 15 SUPs. Ipinakita ng ROI calculator ang break-even sa loob ng 4 na buwan — kinailangan lamang ng 3. Ngayon pinalalawak ko na ito sa 30 boards.
    rating: 5
    product: Pangunahing Kit ng Flota
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktor ng Operasyon, Adriatic Adventure Tours
    location: Dubrovnik, Croatia
    content: Nilagyan namin ng mga SUP board ang buong rental fleet Paddle Board Overstock namin — 30 boards sa tatlong lokasyon. Dalawang season na ang lumipas, walang aberya. Ang pare-parehong kalidad sa bawat batch ay nagpadali sa aming pagpili, at ang kanilang team ay nagtugma pa ng mga kulay sa aming brand.
    rating: 5
    product: Package ng Paupahang Fleet
    source: trust
  - category: rental
    name: Elena Marchetti
    title: May-ari, Lake SUP Garda Rentals
    location: Lawa ng Garda, Italya
    content: Limang beses sa isang araw tuwing peak season ang aming mga rental board. Mula nang lumipat sa Paddle Board Overstock, halos wala nang reklamo sa pinsala, at patuloy na nagtatanong ang mga customer kung saan sila makakabili ng sarili nilang board.
    rating: 5
    product: Package ng Paupahang Fleet
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Bagong May-ari SUP
    location: Lawa ng Tahoe, USA
    content: Matatag kahit para sa isang ganap na baguhan. Dinala ko ito sa lawa sa aking unang araw at hindi ako nahulog. Ang kumpletong pakete kasama ang bomba at paga ay nangangahulugang nasa tubig na ako 20 minuto matapos buksan ang kahon.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP May-ari ng Explorer 11
    location: Vancouver, Canada
    content: Bilang isang unang beses na bumili, kinakabahan ako sa pag-order mula sa ibang bansa. Ang kalidad ng pagkakagawa ay nagsalita nang buksan ko ito — matitigas at walang kapintasan na mga tahi, at dumating ito sa loob lamang ng 6 na araw.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Weekend Paddler
    location: Florida, USA
    content: Matibay ang kalidad ng pagkakagawa. Mas mahusay na humawak sa mga alon sa baybayin kaysa sa inaasahan ko mula sa inflatable. Inilagay ko ito sa baul ng kotse para sa isang weekend trip — na-inflate sa rampa sa loob ng 4 na minuto.
    rating: 5
    product: SUP tropikal na simoy ng hangin
