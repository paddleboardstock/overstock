hero:
  tagline: Talang-kaalaman
  title: Kaalaman sa Pagsaliksik ng Tubig
  subtitle: |
    Isang nakaayos na kaalaman tungkol sa teknolohiya ng inflatable SUP,<br />
    kaligtasan sa tubig, inhinyeriya ng board, at pagpaplano ng pakikipagsapalaran.
  taglineSection: Mag-explore. Matuto. Lumakad nang may kumpiyansa.
clusters:
  tagline: Mga Pangkat ng Kaalaman
  title: Mag-explore ayon sa paksa
  subtitle: Malalalim na pagsusuri sa teknolohiya, kaligtasan, at kasanayan sa likod ng bawat Paddle Board Overstock na produkto.
  items:
    - title: SUP Kaalaman
      description: Mula sa pagpili ng iyong unang board hanggang sa mga advanced na teknik sa paglalakbay — lahat tungkol sa stand-up paddle boarding.
      icon: tabler:lifebuoy
      topics:
        - Paano pumili ng iyong unang inflatable SUP
        - Pinakamahusay na SUP laki para sa mga baguhan
        - Gaano kahirap ang paddle boarding?
        - Paghahambing ng inflatable at matigas na board
        - checklist ng kaligtasan
    - title: Teknolohiya ng Board
      description: Teknikal na malalalim na pagsusuri sa drop-stitch cores, PVC laminates, rails, at valves — kung paano ini-ingenyo ang inflatable SUPs.
      icon: tabler:anchor
      topics:
        - Paano ginagawa ang inflatable SUPs
        - Paliwanag ng mga layer ng PVC laminate
        - Konstruksyon ng rail at tahi
        - Malalim na pagsisid sa teknolohiya ng Drop-stitch
        - Paliwanag ng deck art ng EVA
    - title: Kaalaman sa Kaligtasan
      description: Mahalagang kaalaman sa kaligtasan para sa bawat mananakay ng bangka — mula sa pagpili ng PFD, pagbasa ng panahon, hanggang sa mga teknik sa sariling pagliligtas.
      icon: tabler:shield
      topics:
        - checklist ng kaligtasan
        - Kailangan mo ba ng life jacket?
        - Gabay sa kaligtasan sa paglayag sa karagatan
        - Kaligtasan sa ilog at agos para sa mga paddler
        - Kamulatang pang-meteorolohiya at kondisyon ng tubig
    - title: Teknolohiya
      description: Ang inhinyeriya sa likod ng mga produkto ng Paddle Board Overstock — mga materyales, paraan ng konstruksyon, at pagsusuri ng kalidad.
      icon: tabler:microscope
      topics:
        - Teknolohiyang pang-marino PVC
        - Drop-stitch Ipinaliwanag ang core
        - Bakit PSI mahalaga ang inflatable SUPs
        - RF welding kumpara sa adhesive bonding
        - Pagsusuri ng kalidad sa bawat board
    - title: Kaalaman sa Club at Pag-upa
      description: Mga praktikal na gabay para sa pagpapatakbo ng isang SUP na programa — mula sa operasyon ng pag-upa hanggang sa mga fleet ng resort at club.
      icon: tabler:briefcase
      topics:
        - Paano magsimula ng SUP negosyo sa paupahan
        - Pagtatayo ng resort na sentro para sa water sports
        - Pagsukat ng paddle board fleet para sa mga club
        - Inflatable kumpara sa mahirap SUP para sa komersyal na gamit
        - Pinakamahusay na SUP na mga board para sa mga fleet ng pag-upa
        - Mga estratehiya sa kita mula sa resort water sports
        - Gabay sa pagpapanatili ng komersyal na kagamitan
