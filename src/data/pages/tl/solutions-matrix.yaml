hero:
  tagline: Matriks ng Mga Solusyon sa Industriya
  title: Scenario-Based na Mga Solusyon sa Dagat<br />Para sa Mga Propesyonal na Operasyon
  subtitle: Mga layunin-engineered na inflatable na sasakyang-dagat at RIBs na naka-configure para sa rescue, fleet ng paupahan, tender ng yate, at mga aplikasyon sa commercial na pangingisda — bawat isa ay suportado ng teknikal na espesipikasyon at mga opsyon sa pagkakustomisa.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock propesyonal na solusyon sa dagat para sa iba't ibang industriya
direct_answer: 'Paddle Board Overstock naghahatid ng scenario-engineered na inflatable na sasakyang-dagat at RIB na solusyon para sa mga komersyal na operasyon sa dagat: rescue at patrol na mga bangka na may reinforced Hypalon tubes at multi-chamber na kaligtasan, rental fleet SUPs at kayaks na may 1.2 mm PVC at hot-air welded seams para sa mababang-maintenance na tibay, luxury yacht tenders na may deep-V aluminum hull RIBs, at heavy-duty na mga konfigurasyon sa pangingisda na may mga rod holder at livewell systems.'
solution_a:
  tagline: Solusyon A
  title: Pangangalaga at Pagligtas sa Dagat<br />Komersyal na Pagtrolya
  subtitle: High-speed, multi-chamber safety RIBs para sa propesyonal na emergency response at mga operasyon ng pagpapatupad ng batas.
  badge: Heavy-Duty Series
  description: Ang aming marine rescue at patrol RIBs ay gawa sa reinforced high-density Hypalon/PVC air tubes na may multi-chamber independent flotation design. Bawat sasakyan ay may kagamitan ng propesyonal na-grade reflective tape, rescue grab lines, at rapid-inflate valves para sa kahandaan sa deployment. Ang deep-V fiberglass hulls ay nagbibigay ng pambihirang katatagan sa mataas na bilis at sa magaspang na kondisyon ng dagat.
  features:
    - title: Maramihang Silid na Kaligtasan
      description: 4–6 na independent air chambers — anumang isang bunganga ng chamber ay nagpapanatili ng positibong flotation
    - title: Pinalakas na Tela ng Tubo
      description: 1.2 mm Hypalon CSM o 1,680 DTEX PVC na may double-layer hot-air welded seams
    - title: Propesyonal na Antas
      description: SOLAS reflective tape, rescue grab lines, towing cleats, quick-release painter line
    - title: Mabilis na Bapor
      description: Deep-V fiberglass o aluminum hull na may rating na 25–45 knots depende sa konfigurasyon
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materyal ng Bapor
      value: Fiberglass / Marine-grade Aluminum
    - label: Tubo na Tela
      value: 1.2 mm Hypalon CSM / 1,680 DTEX PVC
    - label: Pinakamataas na Bilis
      value: 25–45 knots
    - label: Kapasidad
      value: 6–12 na tao
    - label: Saklaw ng Makina
      value: 40–200 HP
    - label: Sertipikasyon
      value: CE / ISO 9001
solution_b:
  tagline: Solusyon B
  title: Pangungupahan ng Pampalakas na Tubig &<br />Kagamitan ng Flota ng Resort
  subtitle: Ultra-matibay, madaling alagaan na inflatable SUPs, mga kayak, at mga bangka na ginawa para sa pang-araw-araw na pagrenta sa mga resort, club, at operasyon ng tour.
  badge: Rental-Grade
  description: Ang aming kagamitan sa fleet na paupahan ay dinisenyo para sa pinakamataas na tibay at pinakamababang gastos sa pagpapanatili. Gumagamit kami ng 1.2 mm na pinatibay na PVC na may triple-layer na hot-air welded seam technology na lumalaban sa UV na pagkasira at madalas na pinsala mula sa banggaan. Tinitiyak ng Drop-stitch na konstruksyon na nananatiling matibay ang mga board kahit na matapos ang daan-daang cycle ng pagpapaupa. Lahat ng modelo ay may tampok na pinatibay na D-rings, abrasion-resistant na rail bands, at commercial-grade na mga balbula.
  features:
    - title: Pangkalakal na Antas PVC
      description: 1.2 mm na pinatibay na PVC na may UV mga pampatatag — 3x na mas makapal kaysa sa mga materyales na pang-consumer
    - title: Mga Hinabi na Pinagsama sa Mainit na Hangin
      description: Triple-layer fusion welding — mas matibay kaysa sa pandikit na pagdikit, lumalaban sa paghihiwalay ng mga patong
    - title: Kakakuan
      description: 1,680 DTEX na core na may 2 hinihiwa/pulgada kuwadrado — na-rated hanggang 20 PSI para sa tigas na parang hardboard
    - title: Disenyong Handa Para sa Flota
      description: Pinatibay na D-ring, pangkomersyal na Halkey-Roberts na balbula, kordon sa riles na panlaban sa pagkasira
  recommended_models:
    - SUP Pagsabog ng Cheetah
    - SUP Mandaragat ng Karagatan
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materyal ng Tubo
      value: 1.0–1.2 mm Pinalakas PVC
    - label: Teknolohiya ng Tahi
      value: Triple-layer na mainit na hangin na pagwelding
    - label: Pinakamataas na Presyon
      value: 15–20 PSI (drop-stitch mga modelo)
    - label: UV Tibay
      value: 1,000+ na oras na pinabilis na pagsubok
    - label: Garantiya
      value: 2–5 taon depende sa modelo
    - label: Pagpapanatili
      value: Minimal — banlawan at itabi
solution_c:
  tagline: Solusyon C
  title: Mga Yacht Tender at<br />Mga Mararangyang Sasakyang Tubig
  subtitle: Magaan, mataas na pagganap na RIB tender na idinisenyo para sa imbakan ng superyacht at transportasyon ng mga bisita na may marangyang tapos at disenyo.
  badge: Premium Series
  description: Ang aming yacht tender na RIBs ay pinagsasama ang magaan na konstruksyon at marangyang estetika. Ang mga hull na Deep-V na gawa sa aluminum o fiberglass ay nagbibigay ng pambihirang kalidad ng biyahe at madaling pag-angat gamit ang davit. Available na may mga graphics sa tubo na tugma sa kulay, premium na upholstery, at custom na layout ng console. Ang compact na sukat para sa imbakan ay ginagawang perpekto para sa mga garahe ng superyacht at imbakan sa deck.
  features:
    - title: Magaan na Konstruksyon
      description: Ang mga hull na gawa sa marine-grade aluminum ay nagpapababa ng timbang ng 30% kumpara sa fiberglass para sa madaling pag-angat
    - title: Deep-V na Pagganap
      description: 18–22 degree na deadrise hull para sa maayos na biyahe kahit sa magaspang na tubig at mahusay na tracking
    - title: Marangyang Tapusin at Disenyo
      description: Custom na upholstery, color-matched na tubo, premium na helm console, stainless package
    - title: Compact na Imbakan
      description: Dinisenyo para sa mga garahe ng superyacht — maaaring i-deflate ang mga tubo para sa compact na pagtago
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Uri ng Hull
      value: Deep-V Aluminum / Fiberglass
    - label: Deadrise
      value: 18–22 degrees
    - label: Pinakamataas na Bilis
      value: 30–40 knot
    - label: Timbang na Tuyong
      value: 120–350 kg (aluminum hull)
    - label: Handa para sa Davit Lift
      value: Oo — standard ang mga lifting point
    - label: Imbakan
      value: Maaaring i-deflate na mga tubo, maaaring i-stack
cta:
  title: Hindi Sigurado Kung Aling Solusyon ang Akma sa Iyong Operasyon?
  subtitle: Ilarawan ang iyong aplikasyon, kapaligiran ng operasyon, at mga kinakailangan sa dami. Inirerekomenda ng aming koponan ang pinakamainam na configuration sa loob ng 48 oras.
