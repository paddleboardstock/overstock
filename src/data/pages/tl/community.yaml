stories:
  tagline: Mga Kwento ng Manlalakbay
  title: Tunay na pakikipagsapalaran mula sa tunay na mga tao
  subtitle: Makinig mula sa mga nagkakayak, pamilya, at mga propesyonal na gumagamit ng Paddle Board Overstock kagamitan sa tubig.
  items:
    - name: Sarah at Mike
      title: Mga may-ari ng SUP Explorer 11, Canada
      content: Dinala namin ang aming Explorer 11s sa isang linggong biyahe sa pamamagitan ng Algonquin Park. Napakahusay nilang humawak sa mga portages at pagtawid sa lawa. Ang drop-stitch na konstruksyon ay nangangahulugan na maaari naming palawakin hanggang 15 PSI at makuha ang performance ng hard-board mula sa isang foldable na board.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Pambansang Parke ng Algonquin, Canada
    - name: Carlos R.
      title: Sakay ng Cheetah Surge, Espanya
      content: Ang Cheetah Surge ang lagi kong pinipili para sa paglalayag sa tabing-dagat. Ang buhay na disenyo nito ay nakakaakit ng pansin sa dalampasigan, at ang katatagan nito ay nagbibigay sa akin ng kumpiyansa sa magagaan na alon. Maganda ang pagkakahawak nito, maging ako man ay naglilibot o simpleng nag-eenjoy sa paglubog ng araw.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Espanya
    - name: Lina at pamilya
      title: Mga manlalangoy ng Flowing Lotus, Sweden
      content: Mga pakikipagsapalaran ng pamilya tuwing katapusan ng linggo sa arkipelago. Ang Flowing Lotus ay sapat na matatag para makatayo ang aking anak habang ako ay nagpapadaloy. Napupuno ng hangin sa loob ng wala pang 10 minuto — hindi kailangan ng trailer, purong kasiyahan ng pamilya sa tubig.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Arkipelagong Stockholm, Sweden
    - name: Lt. Cmdr. Andres
      title: Ocean Voyager explorer, Pilipinas
      content: Ginagamit ko ang aking Ocean Voyager para sa mga pangmatagalang coastal na paglilibot sa Palawan. Pagkatapos ng mga buwan ng araw-araw na paggamit sa tropikal na kondisyon, nananatiling mahusay ang performance ng board na parang bago. Ang hugis nito para sa touring ay dumadaan sa alon na kayang pigilan ang mas mabababang klase ng board.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Pilipinas
    - name: Emma T.
      title: Tropical Breeze, unang subok, Australia
      content: Hindi pa ako nakasakay sa SUP dati. Napakastable ng Tropical Breeze kaya natutunan kong maging kumpiyansa sa aking unang subok. Ngayon, nagpe-paddle ako tuwing weekend. Halos wala ang learning curve — at ang board ay napakaganda sa tubig.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
