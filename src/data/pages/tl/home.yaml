content_customer_types:
  tagline: Sino ang Aming Pinaglilingkuran
  title: Gawa para sa B2B Mamimili<br />— Hindi Mga Mamimiling Pang-tingian
  subtitle: Aquafarer gumagawa para sa apat na uri ng customer. Bawat isa ay may iba't ibang prayoridad, at tinutugunan natin ang lahat nito.
  items:
    - title: Mga May-ari ng Brand / Pribadong Tatak
      description: Disenyong pasadyang produkto, graphics na may pribadong tatak, dokumentasyon ng pagsunod sa ilalim ng iyong tatak, at dedikadong suporta sa engineering mula konsepto hanggang lagayan.
      icon: tabler:palette
      cta: Kahilingan OEM/ODM Quote
      cta_href: /request-quotation
    - title: Mga Distributor / Wholesaler
      description: Proteksyon ng teritoryo, kompetitibong wholesale pricing, marketing support kits, product training, at kumpletong compliance documentation para sa iyong merkado.
      icon: tabler:world
      cta: Mag-apply para sa Dealership
      cta_href: /dealers-distributors
    - title: Mga Resort / Rental Operator
      description: Commercial-grade na tibay, payo sa laki ng fleet, mixed-model na order ng container, estratehiya sa spare parts, at resort-branded na mga package ng kagamitan.
      icon: tabler:beach
      cta: Kumuha ng Komersyal na Pakete
      cta_href: /solutions/resorts
    - title: Pagsagip / Pamahalaan / Propesyonal
      description: Hypalon/CSM konstruksyon, SOLAS mga opsyon sa pagsunod, sertipikasyon na partikular sa proyekto, suporta sa dokumentasyon ng tender, at NDA-protected engineering.
      icon: tabler:shield
      cta: Talakayin ang isang Proyekto
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Kakayahan
  title: Ano ang Makukuha Mo<br />kasama Aquafarer
  subtitle: Direktang access sa pabrika na may kumpletong suporta sa engineering, kalidad, at pagsunod — hindi isang trading company.
  columns: 2
  items:
    - title: OEM/ODM Pagpapasadya
      description: Custom na disenyo ng hull, materyal ng tubo (PVCo Hypalon/CSM), layout ng console, upuan, branding, kulay, at packaging. Mula sa maliliit na pagbabago hanggang sa ganap na custom engineering.
      icon: tabler:adjustments
    - title: MababaMOQ, mabilis na sampling
      description: 'RIB: 2-5 yunit (umiiral na hulma). SUP: 5-10 yunit bawat SKU. Custom na hulma: 200+ yunit. Pre-production na mga sample na may iyong branding sa loob ng 7-14 na araw.'
      icon: tabler:rocket
    - title: Kalidad na Handa na sa Produksyon
      description: Bawat unit ay sinusuri sa 1.25x na rated PSI sa loob ng 24-48 oras. 99.3% na rate na walang depekto kada AQL 2.5 / ISO 2859. 100-point na checklist ng kalidad kada hull.
      icon: tabler:certificate
    - title: Kumpletong Dokumentasyon ng Pagsunod
      description: CE ayon sa 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI social audit, REACH pagsunod, UKCA pagmamarka. Kasama ang model-specific DoC at builder plate data.
      icon: tabler:file-certificate
    - title: 30-45 Araw na Lead Time
      description: Standard na produksyon 30-45 araw FOB sa Qingdao. Prototypes 7-14 na araw. May available na rush production. Kasama ang mga plano sa paglo-load ng container at ISPM-15 crating.
      icon: tabler:truck-delivery
    - title: After-Sales at Spare Parts
      description: 5-taong warranty sa mga bangka/kayakRIBs/, 2-taon sa SUP/accessories. Supply ng spare parts na may prayoridad sa pagpapadala. Suporta sa pagproseso ng warranty claim.
      icon: tabler:lifebuoy
content_categories:
  tagline: Mga Kategorya ng Produkto
  title: 5 Kategorya,<br />64 CE-Sertipikadong Mga Modelo
  subtitle: Mula 2.4m RIB tenders hanggang 15ft SUP boards — lahat ay ginawa sa aming Qingdao ISO 9001 facility.
  items:
    - title: RIB Mga Bangka
      description: 2.4m hanggang 7.0m na may aluminum o GRP na mga katawan ng barko. PVC o Hypalon/CSM na mga tubo. CE ayon sa 2013/53/EU. Mga pagpapadala para sa patrol, diving, rescue, at komersyal na mga pagsasaayos.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Inflatable na mga Bangka
      description: 2.0m hanggang 5.0m na may aluminum na sahig, plywood na sahig, o air-deck na mga opsyon. Mga modelong pang-pangingisda, pang-libangan, at tender.
      icon: tabler:sailboat
      link: /products
    - title: SUP Mga Lupon
      description: 9ft hanggang 15ft sa 4-inch at 6-inch Drop-Stitch. Mga modelong all-round, touring, yoga, at pangingisda. Available ang komersyal na kalidad.
      icon: tabler:swimming
      link: /products
    - title: Kayaks
      description: 1-person hanggang 3-person na inflatable na kayaks. Mga modelong pang-libangan at touring na may Drop-Stitch na opsyon sa sahig.
      icon: tabler:kayak
      link: /products
    - title: Mga Kagamitang Pangkaligtasan
      description: CE-sertipikadong life vests, throw ropes, repair kits, pumps, at navigation lights. USCG Type III/V na aprubadong PFDs.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Lakas ng Pabrika
  title: Audit-Ready Manufacturing<br />sa Qingdao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12,000 m² ISO 9001 na Pasilidad — Tunay na Tagagawa, Hindi Trading Company</h3>
  items:
    - title: 6 Nakalaang Linya ng Produksyon
      description: Hiwalay na RIB, inflatable na bangka, SUP, kayak, safety equipment, at OEM/ODM na mga linya. Bawat isa ay may nakalaang QC checkpoints at production planning.
    - title: 100% Sinubok sa Presyon
      description: Bawat inflatable chamber ay pinipresyur sa 1.25x ng rated PSI at pinananatili ng 24-48 oras. Ang mga resulta ng pagsusuri ay naka-link sa serial number ng katawan ng barko (HIN).
    - title: Maaring Subaybayan Bawat Katawan ng Barko
      description: 'Mga rekord ng produksyon sa antas ng HIN na may 21+ na mga data field sa bawat katawan ng barko: material batch, welder ID, resulta ng pressure test, panghuling pagsasaayos, at destinasyon ng paghahatid.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12,000 m² ISO 9001 na pasilidad ng pagmamanupaktura sa Qingdao na may RIB linya ng produksyon
content_compliance:
  tagline: Pagsunod at Patunay ng Kalidad
  title: Dokumentadong Patunay,<br />Hindi Lang Mga Pahayag
  subtitle: Bawat pahayag ng pagsunod ay suportado ng model-specific na dokumentasyon na magagamit para sa iyong beripikasyon.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Quality management system na sertipikado ng TÜV Rheinland/SGS. Taunang surveillance audits. Dokumentadong QC processes mula sa dumarating na materyal hanggang sa pagpapalabas ng shipment.
      icon: tabler:certificate
    - title: CE ayon sa 2013/53/EU (RCD)
      description: 64 na mga modelo na may model-specific na Declarations of Conformity. Conformity assessment ayon sa naaangkop na mga module. HIN registration at builder plate data para sa bawat katawan ng barko.
      icon: tabler:file-certificate
    - title: BSCI Pagsunod sa Panlipunang Pamantayan
      description: Taunang BSCI audit ng SGS. Napatunayan ang etikal na mga gawi sa paggawa, kaligtasan sa lugar ng trabaho, at pamamahala sa kapaligiran sa buong aming pasilidad.
      icon: tabler:users
    - title: REACH & UKCA
      description: Lahat PVC ng materyales na pandikit ay sumusunod sa REACH regulasyon ng EU.UKCA Maaaring markahan para sa merkado ng UK. Mga sheet ng datos para sa kaligtasan ng materyal kapag hiniling.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proseso — Mula sa Brief hanggang Lalagyan
  items:
    - title: Hakbang 1:<span class="font-medium">Mga Kinakailangan</span>
      description: Ibahagi ang iyong product specs, target market, dami, at mga kinakailangan sa pagsunod. Ang aming engineering team ay nagre-review sa loob ng 48 oras.
      icon: tabler:file-text
    - title: Hakbang 2:<span class="font-medium">Panukala</span>
      description: Tumanggap ng detalyadong panukala na may mga espesipikasyon, mga opsyon sa materyales, MOQ, presyo, lead time, at saklaw ng pagsunod para sa iyong merkado.
      icon: tabler:clipboard-list
    - title: Hakbang 3:<span class="font-medium">Prototype</span>
      description: Pre-production sample na may iyong branding sa loob ng 7-14 na araw. Kumpletong quality testing sa 1.25x rated pressure. Sample cost na na-credit para sa produksyon.
      icon: tabler:settings
    - title: Hakbang 4:<span class="font-medium">Produksyon</span>
      description: 30-45 araw na produksyon FOB sa Qingdao pagkatapos ng pag-apruba ng sample. In-process QC checkpoints, pressure testing, at 100-point final inspection sa bawat unit.
      icon: tabler:building-factory
    - title: Hakbang 5:<span class="font-medium">Paghahatid</span>
      description: Plano ng paglo-load ng container, ISPM-15 wooden crating, compliance documentation package, at FOB Qingdao shipment na may kumpletong export paperwork.
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer OEM/ODM Proseso ng paggawa ng inflatable boat mula sa disenyo hanggang sa pagpapadala ng container
blog_latest:
  title: Mga Pananaw sa Industriya at Teknikal
  information: |
    RCD mga gabay sa pagsunod, OEM/ODM mga artikulo sa proseso, paghahambing ng materyal,
    at mga yaman para sa inspeksyon ng pabrika mula sa Aquafarer engineering team.
faqs:
  title: B2B FAQ tungkol sa Procurement
  subtitle: Mga karaniwang tanong mula sa mga brand, distributor, at mga komersyal na operator tungkol sa OEM/ODM paggawa gamit ang Aquafarer.
  columns: 2
  items:
    - title: Ikaw ba ay isang manufacturer o trading company?
      description: Kami ay isang vertically integrated na pabrika na may ganap na kontrol sa kalidad, materyales, at lead times. Ang lisensya ng negosyo at saklaw ng produksyon ay maaaring beripikahin sa panahon ng factory audit.
      icon: tabler:building-factory
      category: all
    - title: Ano ang proseso mo OEMODM ?
      description: Pagsusuri ng mga kinakailangan (48 oras) mula sa panukala para sa prototype (7-14 na araw) hanggang produksyon (30-45 araw FOB sa Qingdao). Kumpletong suporta sa engineering, dokumentasyon ng pagsunod, at pagsubaybay sa bawat hull sa buong proseso.
      icon: tabler:route
      category: all
    - title: Ano ang MOQ mga requirements mo?
      description: 'RIB mga bangka: 2-5 yunit bawat modelo (umiiral na hulma), 200+ para sa pasadyang mga hulma. SUP mga tabla: 5-10 yunit bawat SKU. Magagamit ang mga order ng lalagyan na may halo-halong modelo. Mga sample na order sa 2-5 yunit para sa pagsusuri.'
      icon: tabler:sort-ascending
      category: all
    - title: Anong mga pagpipilian sa pagpapasadya ang magagamit?
      description: Disenyo ng katawan ng barko, materyal ng tubo (PVC o Hypalon/CSM), diyametro ng tubo, ayos ng console, upuan, manibela, sistema ng gasolina, ayos ng deck, kulay ng tatak, grapiko ng logo, disenyo ng pad ng EVA, pakete para sa retail, at branding ng manwal ng may-ari.
      icon: tabler:adjustments
      category: all
    - title: Anong mga dokumento ng pagsunod ang maaari mong ibigay para sa aking merkado?
      description: CE DoC ayon sa 2013/53/EU, UKCA marking, ISO 9001 sertipiko (SGS), BSCI ulat ng audit, REACH pagsunod, ulat ng pagsusuri ng materyales, tala ng pagsusuri ng presyon, at data ng plate ng tagagawa na tukoy sa modelo. Dokumentasyon na tukoy sa merkado ay available kapag hiniling.
      icon: tabler:file-certificate
      category: all
    - title: Ano ang oras ng pamumuno para sa sampling at produksyon?
      description: 'Mga sample bago produksyon: 7-14 na araw ng trabaho. Karaniwang produksyon: 30-45 araw FOB Qingdao. Maaaring magmadali ng produksyon sa karagdagang gastos. Maaaring pahabain ng peak season (Marso-Hunyo) ang oras ng produksiyon.'
      icon: tabler:clock
      category: all
    - title: Maaari ba akong mag-ayos ng inspeksyon sa pabrika o live na video tour?
      description: Oo. Ang mga on-site na pag-audit sa pabrika sa aming pasilidad sa Qingdao ay tinatanggap sa abiso na 3-5 araw. Ang mga live video tour sa pamamagitan ng WhatsApp/Zoom ay magagamit kaagad. Tinatanggap ang mga inspeksyon ng third-party (SGS, BV, TÜV).
      icon: tabler:video
      category: all
    - title: Anong mga pagsusuri sa kalidad ang ginagawa bago ipadala?
      description: 1.25x na rated pressure hold test (24-48h), seam peel testing, 100-point final inspection checklist, dimensional verification, cosmetic inspection, verification ng compliance documentation, at packaging integrity check. Lahat ayon sa ISO 9001 procedures.
      icon: tabler:clipboard-check
      category: all
