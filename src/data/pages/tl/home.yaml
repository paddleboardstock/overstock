faqs:
  title: SUP Mga Madalas Itanong tungkol sa Pag-order at Produkto
  subtitle: Karaniwang mga tanong tungkol sa aming clearance SUP na mga board, pag-order, pagbabayad, pagpapadala, at warranty.
  columns: 2
  items:
    - title: Mahirap bang matutunan ang SUP?
      description: Hindi naman. Karamihan sa mga nagsisimula ay nakakatayo at nakakapagbasa na sa kanilang unang session. Ang aming all-around SUP boards ay may karagdagang lapad at matatag na plataporma na dinisenyo partikular para sa mga unang beses na mag-paddle. Magsimula sa tahimik na tubig at makakapagbyahe ka na sa loob ng ilang minuto.
      icon: tabler:swimming
      category: sup
    - title: Ano ang limitasyon ng timbang?
      description: Ang aming all-around SUPs ay sumusuporta hanggang 220 lbs at ang touring at yoga platforms ay sumusuporta hanggang 250 lbs. Bawat pahina ng produkto ay naglilista ng eksaktong kapasidad ng timbang ng rider upang maipares mo ang board sa iyong pangangailangan.
      icon: tabler:adjustments
      category: sup
    - title: Maaari ba akong maglakbay gamit ang isang inflatable SUP?
      description: Tiyak. Bawat Paddle Board Overstock na board ay kasya sa isang kaso na kasing-laki ng likod na bag. Sa bigat na 18-22 lbs lamang, madali itong dalhin sa tabing-dagat, lawa, o sa mga terminal ng paliparan. Suriin ang patakaran ng iyong airline tungkol sa bagahe bago bumiyahe.
      icon: tabler:truck-delivery
      category: sup
    - title: Ano ang nasa kahon?
      description: Kasama sa bawat Paddle Board Overstock SUP ang board, isang travel backpack, hand pump, adjustable paddle, removable fin, coil leash, at repair kit.
      icon: tabler:clipboard-list
      category: sup
    - title: Bakit mas mababa ang inyong mga presyo kaysa sa tingi?
      description: Ibinebenta namin ang sobra na produkto mula sa pabrika at mga batch ng clearance direkta mula sa aming sariling pasilidad ng produksyon sa Weihai, China — walang mga tagapamagitan, walang dagdag na presyo sa tingi. Nangangahulugan ito ng kumpletong SUP na mga pakete na may hanggang 60% diskwento mula sa karaniwang presyo sa tingi, na may parehong CE-sertipikadong kalidad.
      icon: tabler:certificate
      category: orders
    - title: Paano ako maglalagay ng order at magbabayad?
      description: Idagdag ang iyong SUP package sa cart at mag-check out nang ligtas gamit ang Stripe o PayPal. Tinatanggap namin ang lahat ng pangunahing credit at debit card. Bawat order ay kinukumpirma sa pamamagitan ng email na may buong invoice.
      icon: tabler:file-text
      category: orders
    - title: Nagpapadala ba kayo sa buong mundo?
      description: Oo. Nagpapadala kami sa 50+ bansa sa buong EU, Hilagang Amerika, Asia-Pasipiko, Gitnang Silangan, at Africa. Ang mga order na nasa stock ay karaniwang ipinapadala sa loob ng 2-3 araw ng negosyo na may kasamang tracking para sa bawat parsela.
      icon: tabler:route
      category: orders
    - title: Anong warranty ang kasama sa mga SUP board?
      description: 'Ang bawat SUP board at kagamitan ay saklaw ng 2-taong warranty — kasama ang mismong board, drop-stitch tahi, at mga inflation valve. Ang mga claim ay naayos sa loob ng ilang araw, hindi linggo: mag-file online at aming aayusin o papalitan.'
      icon: tabler:lifebuoy
      category: orders
