features:
  id: features
  tagline: Bakit Bibili Mula sa Paddle Board Overstock
  title: Tunay na Pabrika,<br />Tunay na Tipid
  subtitle: Direktang labis na stock at clearance ng pabrika SUP mga pakete — sertipikadong kalidad nang walang dagdag sa presyo ng tingi.
  columns: 2
  items:
    - title: Hanggang 60% Diskwento sa Presyo ng Tingi
      description: Nagbebenta kami ng sobra sa factory at mga batch na clearance nang direkta — walang gitnang tao, walang dagdag presyo sa tingi. Ang parehong mga board na ibinebenta sa buong presyo sa ibang lugar, dito ay sa presyo ng clearance.
      icon: tabler:rocket
    - title: Kumpletong Mga Pakete
      description: 'Bawat SUP ay dumarating bilang kumpletong pakete: board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, at repair kit.'
      icon: tabler:clipboard-list
    - title: Sertipikadong Kalidad
      description: 13 CE-na sertipikadong SUP na modelo ayon sa naaangkop na mga direktiba ng EU. Ang bawat board ay 100% na nasubok sa presyon sa 1.25x ng takdang PSI bago ito ipadala. 99.3% rate ng walang depekto ayon sa AQL 2.5.
      icon: tabler:certificate
    - title: Bilang MOQ — Umunang Lupon ng Order
      description: Ang overstock clearance ay nangangahulugang tinatanggap ang mga order na isang yunit lamang. Magdagdag ng board sa cart, mag-check out, tapos na. Walang minimum na order, walang proseso ng pagbibigay ng presyo.
      icon: tabler:adjustments
    - title: Mabilis na Pandaigdigang Pagpapadala
      description: Ang mga order na nasa stock ay ipinapadala mula sa Weihai sa loob ng 2-3 araw ng negosyo. Sinusubaybayang paghahatid sa 50+ bansa sa buong EU, Hilagang Amerika, Asia-Pasipiko, at iba pa.
      icon: tabler:truck-delivery
    - title: 2-Taong SUP Warranty
      description: Bawat SUP board at accessory ay sakop sa loob ng 2 taon — kasama ang drop-stitch seams, inflation valves, at mga accessory. Ang mga claim ay natutugunan sa loob ng ilang araw, hindi linggo.
      icon: tabler:lifebuoy
