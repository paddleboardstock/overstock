content_workshop:
  isReversed: true
  tagline: Lakas ng Pabrika
  title: Bakit Ang Aming Mga Presyo ng Clearance<br />Totoo
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Tunay na Pabrika, Tunay na Tipid — Bawat Board ay Ipinapadala Mula sa Aming Pasilidad sa Weihai</h3>
  items:
    - title: Parehong Linya ng Produksyon tulad ng mga Malalaking Brand
      description: Ang aming 12,000 m² na pabrika sa Weihai ay gumagawa ng mga board para sa mga pandaigdigang tatak at sa aming sariling mga sobra na batch sa parehong linya gamit ang parehong mga materyales.
    - title: 100% Sinubok sa Presyon
      description: Bawat board ay pinapairal sa presyon na 1.25x na may rated na PSI at hinahawakan bago ipadala. 99.3% na walang depekto sa bawat AQL 2.5 / ISO 2859.
    - title: Walang Tagapamagitan
      description: Ipinapadala ng mga board mula sa pabrika diretso sa iyong pintuan. Walang dagdag na presyo mula sa distributor, walang dagdag sa tingi — ganoon nananatiling hanggang 60% na mas mababa sa presyo ng tingi ang clearance pricing.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12,000 m² na pabrika sa Weihai na may mga produksiyong linya ng SUP na inflatable
content_compliance:
  tagline: Pagsunod at Patunay ng Kalidad
  title: Sertipikadong Kalidad,<br />Naitala
  subtitle: Bawat paghahabol sa pagsunod ay sinusuportahan ng mga sertipiko at dokumentasyon na tiyak sa modelo na available para sa iyong beripikasyon.
  items:
    - title: ISO 9001:2015
      description: Quality management system na sertipikado ng TÜV Rheinland/SGS. Taunang surveillance audits. Dokumentadong QC processes mula sa dumarating na materyal hanggang sa pagpapalabas ng shipment.
      icon: tabler:certificate
    - title: CE Sertipikado
      description: 13 CE-certified SUP na mga modelo alinsunod sa naaangkop na direktiba ng EU, bawat isa ay may modelong-espesipikong Pahayag ng Pagsunod at datos ng plato ng gumawa.
      icon: tabler:file-certificate
    - title: REACH at UKCA
      description: Ang lahat ng PVC at mga materyales na pandikit ay sumusunod sa regulasyon ng EU na REACH. UKCA na marka ay available para sa merkado ng UK. Maaaring hingin ang mga listahan ng kaligtasang datos ng materyal.
      icon: tabler:shield-check
    - title: 2-Taong SUP Warranty
      description: Bawat SUP board at accessory ay sakop ng 2 taon — kasama ang drop-stitch seams, inflation valves, at accessories. Mabilis na naayos ang mga claim.
      icon: tabler:lifebuoy
