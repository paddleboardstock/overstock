hero:
  tagline: Mga Kagamitan
  title: Kagamitan at Makinarya sa Paggawa
  subtitle: Industriyal na kagamitan para sa paggupit, pag-welding, pag-imprenta, at pagpupulong
  back_label: Bumalik sa Pabrika
  back_link: /factory
categories:
  - title: Paggupit at Paghahanda ng Materyal
    items:
      - name: Awtomatikong PVC na Makinang Pangputol
        spec: Kontroladong CNC, 6.5 m × 2.5 m, 0.1 mm na katumpakan
        desc: Computer-controlled na awtomatikong makina sa paggupit para sa PVC, Hypalon, at drop-stitch na tela. Ang software para sa nesting ay nag-o-optimize ng paggamit ng materyal upang mas mababa sa 5% ang basura.
      - name: Tagapamahagi ng Tela
        spec: 3 m maximum na lapad, feed na kinokontrol ang tensiyon
        desc: Ipinapantay ang tela sa isang patong o maraming patong na may kontroladong tensiyon upang maiwasan ang deformasyon bago gupitin.
  - title: Welding at Bonding ng Tubo
    items:
      - name: Makina sa Heat Sealing
        spec: Hot-air welding, nababago 200–600 °C, 0.5–5 m/min
        desc: Hot-air heat sealing machine para sa bonding at welding ng PVC at Hypalon na tahi ng tubo. Ginagamit para sa tacking, sealing, at fusing ng mga tube chamber at float joint.
      - name: Dielectric RF Press
        spec: 15 kW, platen 2000 × 600 mm
        desc: Radio-frequency welding press para sa pangunahing longitudinal seams, transom-to-tube joints, at paggawa ng malalaking chamber.
      - name: Kontroladong CNC RF Welder
        spec: 8 kW, XY table 2500 × 1200 mm
        desc: Programmable na curved-seam welding para sa kumplikadong hugis, embossing ng logo, at eksaktong patchwork.
  - title: Gumagawa ng RIB na Lukso
    items:
      - name: Fiberglass Hand-Lay-Up Moulds
        spec: Maraming molde para sa RIB na lukso hanggang 6 m LOA
        desc: Tradisyunal na hand-lay-up fiberglass moulding gamit ang polyester at vinylester resin system. Bawat patong ay manwal na ini-roll at vacuum-bagged para sa pare-parehong kalidad at lakas ng laminate.
      - name: Gelcoat Spray Booth
        spec: Kina-kontrol na temperatura, may filtered air ventilation
        desc: Paglalagay ng gelcoat para sa RIB na lukso. Nagbibigay ng high-gloss, UV-resistant na finish na may eksaktong kontrol sa kapal.
      - name: CNC Router (5-axis)
        spec: 3 m × 2 m × 1 m na saklaw, water-cooled spindle
        desc: Pagmamachina ng hull inserts, console moulds, seat bases, at custom brackets.
  - title: Pagpi-print at Dekorasyon ng SUP
    items:
      - name: Digital Printer
        spec: High-resolution inkjet, hanggang 2 m na lapad ng print
        desc: Direct-to-fabric digital printing para sa full-colour SUP deck graphics. Nagpi-print ng custom patterns, gradients, at photo-quality na imahe gamit ang UV-resistant na water-based inks.
      - name: Makina sa Screen Printing
        spec: Manwal at semi-automatic, multi-colour registration
        desc: Screen printing para sa SUP board logos, brand marks, at paulit-ulit na patterns. Nagbibigay ng matibay, opaque na print na may maliwanag na saturation ng kulay.
  - title: Pagpupulong at Pagkakabit
    items:
      - name: Engine Hoist
        spec: 500 kg kapasidad, adjustable na spreader bar
        desc: Ligtas na pag-mount ng outboard engines mula 2.5 hanggang 60 hp.
      - name: Console Mock-Up Frame
        spec: Adjustable na taas at anggulo
        desc: Pre-rigging ng steering, throttle, at instrument panels bago ang installation.
      - name: Hydraulic Hose Crimper
        spec: Hanggang 1" ID, digital na pressure gauge
        desc: Custom-length na hydraulic steering hose assemblies na may swaged fittings.
      - name: Electrical Harness Board
        spec: 3 m × 1.5 m, pre-printed wiring diagrams
        desc: Off-boat assembly at testing ng kumpletong electrical harnesses.
  - title: Pagsubok at Kontrol sa Kalidad
    items:
      - name: Universal Tensile Tester
        spec: 50 kN, / ASTM D751
        desc: Pagsusuri ng breaking force, elongation sa pagkaputol, at tear propagation para sa fabric batches.
      - name: Air Retention Test Rig
        spec: Programmable, 30-min pressure-hold
        desc: Automated na pressure-hold test para sa bawat tube chamber bago ang assembly.
      - name: Seam Peel Tester
        spec: Motorised 180° peel sa 100 mm/min
        desc: Pagsusuri ng lakas ng pagtanggal ng hinang at ginawa-sa-pampid na tahi ayon sa ISO 6185.
      - name: Xenon-Arc Weathering Chamber
        spec: 2000 h na pagkakalantad
        desc: Pagsusuri ng UV para sa pagbabago ng kulay at pagpapanatili ng lakas.
