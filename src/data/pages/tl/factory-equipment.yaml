hero:
  tagline: Mga Kagamitan
  title: Kagamitan at Makinarya sa Paggawa
  subtitle: Industriyal na kagamitan para sa paggupit, pag-welding, pag-imprenta, at pagpupulong
  back_label: Bumalik sa Pabrika
  back_link: /factory
categories:
  - title: Paggupit at Paghahanda ng Materyal
    items:
      - name: Awtomatikong PVC na Makinang Pangputol
        spec: Kontroladong CNC, 6.5 m × 2.5 m, 0.1 mm na katumpakan
        desc: Computer-controlled na awtomatikong makina sa paggupit para sa PVC at drop-stitch na mga tela. Ang nesting software ay nag-ooptimize ng paggamit ng materyal hanggang sa mas mababa sa 5% na basura.
      - name: Tagapamahagi ng Tela
        spec: 3 m maximum na lapad, feed na kinokontrol ang tensiyon
        desc: Ipinapantay ang tela sa isang patong o maraming patong na may kontroladong tensiyon upang maiwasan ang deformasyon bago gupitin.
  - title: Welding at Bonding
    items:
      - name: Makina sa Heat Sealing
        spec: Hot-air welding, nababago 200–600 °C, 0.5–5 m/min
        desc: Makina sa hot-air heat sealing para sa pagbibigay-bond at pag-welding ng PVC laminates, rail bands, at chamber seams. Ginagamit para sa tacking, sealing, at fusing ng drop-stitch core joints.
      - name: Dielectric RF Press
        spec: 15 kW, platen 2000 × 600 mm
        desc: Radio-frequency welding press para sa pangunahing longitudinal seams, transom-to-tube joints, at paggawa ng malalaking chamber.
      - name: Kontroladong CNC RF Welder
        spec: 8 kW, XY table 2500 × 1200 mm
        desc: Programmable na curved-seam welding para sa kumplikadong hugis, embossing ng logo, at eksaktong patchwork.
  - title: Deck Art at Pagpapaganda
    items:
      - name: EVA Makina sa Pagputol ng Deck
        spec: CNC knife cutting, 2 m na lapad
        desc: Tiyak na paggupit ng EVA deck foam panels para sa art-series na pattern ng deck. Ang bawat panel ay gupitin sa hugis para sa seamless na full-deck fit.
      - name: Deck Lamination Press
        spec: Kontrolado ang temperatura at presyon
        desc: Pinagbibigkis ang EVA deck panels sa ibabaw ng board na may pare-parehong pagkakadikit sa buong lugar ng deck.
  - title: Pagpi-print at Dekorasyon ng SUP
    items:
      - name: Digital Printer
        spec: High-resolution inkjet, hanggang 2 m na lapad ng print
        desc: Direct-to-fabric digital printing para sa full-colour SUP deck graphics. Nagpi-print ng custom patterns, gradients, at photo-quality na imahe gamit ang UV-resistant na water-based inks.
      - name: Makina sa Screen Printing
        spec: Manwal at semi-automatic, multi-colour registration
        desc: Screen printing para sa SUP board logos, brand marks, at paulit-ulit na patterns. Nagbibigay ng matibay, opaque na print na may maliwanag na saturation ng kulay.
  - title: Panghuling Assembly
    items:
      - name: Istasyon ng Torque ng Balbula
        spec: Kalibrado, 10-cycle na pagsubok ng function
        desc: Nag-i-install at nagto-torque ng mga inflation valve, pagkatapos ay sinusubok ang function ng bawat balbula sa pamamagitan ng 10 open/close na cycle.
      - name: Fin Box at D-Ring Setter
        spec: Inaayos gamit ang jig, pinatigas ang pandikit
        desc: Nagpo-posisyon at nagbubuklod ng mga fin box, D-ring, at mga hawakan sa eksaktong lokasyon ng deck ayon sa espesipikasyon ng modelo.
  - title: Pagsubok at Kontrol sa Kalidad
    items:
      - name: Universal Tensile Tester
        spec: Kapasidad na 50 kN
        desc: Pagsusuri ng breaking force, elongation sa pagkaputol, at tear propagation para sa fabric batches.
      - name: Air Retention Test Rig
        spec: Programmable, 30-min na pagpapanatili ng presyon
        desc: Automated na pressure-hold test para sa bawat tube chamber bago ang assembly.
      - name: Seam Peel Tester
        spec: Motorised 180° peel sa 100 mm/min
        desc: Pagsusuri ng lakas ng pagpupulot ng weld at bonded seam alinsunod sa internal na protocol.
      - name: Xenon-Arc Weathering Chamber
        spec: 2000 h na pagkakalantad
        desc: Pagsusuri ng UV para sa pagbabago ng kulay at pagpapanatili ng lakas.
cta:
  title: Interesado ka ba sa isang paglilibot sa pabrika?
  desc: Malugod naming tinatanggap ang mga bisita sa aming pasilidad sa Weihai. Tingnan ang aming kagamitan at mga proseso nang personal.
  label: Mag-iskedyul ng isang pagbisita →
  link: /contact
tldr:
  summary: Paddle Board Overstock nagpapatakbo ng 12,000 m² na espasyo ng produksyon na may kagamitan ng awtomatikong PVC cutting machines, high-frequency RF welders, EVA deck cutting at finishing stations, heat sealing presses, at mga rig para sa panghuling assembly. Bawat board ay pumapasa sa 1.25x rated pressure hold testing.
  points:
    - Awtomatikong PVC cutting na may CNC precision
    - High-frequency RF welding para sa integridad ng seam
    - EVA deck cutting at hand-finishing stations
    - Valve torque at fin box assembly rigs
    - 1.25x rated pressure hold testing sa 100% ng mga board
