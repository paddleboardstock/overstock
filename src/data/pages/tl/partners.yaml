hero:
  tagline: Mga Kasosyo at Pamamahagi
  title: Maging Aquafarer Partner<br />— Pandaigdigang Network ng Pamamahagi
  subtitle: Sumali Aquafarersa pandaigdigang network ng mga kasosyo. Nakikipagtulungan kami sa mga marine distributor, boat dealer, equipment retailer, at brand partner sa 50+ bansa.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer Pandaigdigang network ng mga kasosyo at distributor
content_programs:
  tagline: Mga Partner Program
  title: Mga Partner Program<br />Ginawa para sa Paglago
  subtitle: Kung ikaw man ay distributor, dealer, o brand partner, Aquafarer nag-aalok sila ng mga programang idinisenyo upang suportahan ang iyong negosyo.
  columns: 3
  items:
    - title: Programa ng Distributor
      description: Eksklusibong pamamahagi ng teritoryo na may dami ng presyo, suporta sa marketing, at direktang access sa pabrika. Minimum na pangako batay sa laki ng teritoryo.
      icon: tabler:world
    - title: Programa ng Dealer
      description: Direktang pagpepresyo ng dealer, pagsasanay sa produkto, mga materyales sa marketing, at suporta sa warranty para sa mga retail na lokasyon at online na tindahan.
      icon: tabler:building-store
    - title: OEM/ODM Pakikipagsosyo
      description: Buong serbisyo OEM at ODM paggawa na may custom na branding, packaging, at mga espesipikasyon ng produkto. Mula konsepto hanggang lalagyan.
      icon: tabler:certificate
    - title: Pakikipagsosyo sa Tatak
      description: Co-branding, private label, at eksklusibong mga programa ng modelo para sa mga kilalang brand sa larangan ng marine at outdoor recreation.
      icon: tabler:stars
    - title: Pampamahalaan at Institusyonal
      description: Mga paboritong programa para sa supplier para sa mga ahensya ng gobyerno, coast guard, militar, at mga organisasyong makatao. Dokumentasyon na handa para sa tender.
      icon: tabler:building-community
    - title: Kasosyo sa Resort at Pag-upa
      description: Presyo ng fleet, pare-parehong kalidad, at custom branding para sa mga resort, diving center, at rental operations sa buong mundo.
      icon: tabler:sun
content_benefits:
  tagline: Bakit Makipagtulungan sa Amin
  title: Bakit Pumipili Aquafarerang mga Kasosyo
  subtitle: Nakikinabang ang aming mga kasosyo mula sa tunay na kakayahan sa paggawa, pare-parehong kalidad, at mabilis na suporta.
  list:
    - 'Direktang Pag-access sa Pabrika: Makipagtulungan nang direkta sa aming manufacturing team — walang mga tagapamagitan. Makakuha ng mas mabilis na tugon, mas magandang presyo, at ganap na visibility sa produksyon.'
    - 'Handa na sa Pag-customize: I-brand ang iyong mga produkto gamit ang custom na kulay, logo, packaging, at mga espesipikasyon. Minimum na dami ng order na iniangkop sa iyong merkado.'
    - 'Garantisado ang Kalidad: ISO 9001 sertipikadong produksyon na may CE, UKCA, at BSCI pagsunod. Bawat produkto ay sinusuri bago ipadala.'
    - 'Global Logistics: Pagpapadala mula Qingdao, China na may FOB, CIF, at DDP mga opsyon. US warehouse sa Montclair, CA para sa distribusyon sa North America.'
    - 'Suporta sa Marketing: Mga katalogo ng produkto, potograpiya, teknikal na dokumentasyon, at mga digital na asset upang suportahan ang iyong mga pagsisikap sa pagbebenta.'
    - 'Pagsasanay at Suporta: Pagsasanay sa produkto para sa iyong sales team, teknikal na suporta para sa iyong mga customer, at koordinasyon ng warranty service.'
content_process:
  tagline: Paano Maging Partner
  title: Simpleng Proseso ng Pakikipagsosyo
  subtitle: Ang aming proseso ng pakikipagsosyo ay diretso — dinisenyo upang mabilis kang makapagbenta ng Aquafarer na mga produkto.
  items:
    - title: 'Hakbang 1: Isumite ang Aplikasyon'
      description: Kumpletuhin ang aming form ng aplikasyon para sa partner kasama ang profile ng iyong kumpanya, target na merkado, at interes sa produkto.
    - title: 'Hakbang 2: Pagsusuri ng Kwalipikasyon'
      description: Susinuri ng aming partnership team ang iyong aplikasyon at makikipag-ugnayan sa loob ng 3 araw ng negosyo upang talakayin ang mga oportunidad.
    - title: 'Hakbang 3: Kasunduan at Setup'
      description: Pumirma sa kasunduan ng pakikipagsosyo, isaayos ang iyong account, at tanggapin ang presyo para sa partner, materyales sa marketing, at sample ng produkto.
    - title: 'Hakbang 4: Pagsasanay at Pagsisimula'
      description: Ibibigay ang pagsasanay sa produkto, suporta sa benta, at materyales sa marketing. Handa ka nang magsimulang magbenta.
cta:
  title: Handa ka na bang maging isang Aquafarer na partner?
  subtitle: Mag-apply para sa pakikipagsosyo at ang aming team ay tutugon sa loob ng 3 araw ng negosyo.
  actions:
    - variant: primary
      text: Mag-apply para sa pakikipagsosyo
      href: /contact
    - text: Tingnan ang aming mga produkto
      href: /products
