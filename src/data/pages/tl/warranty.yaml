label: Garantiya
headline: Aquafarer Limitadong Warranty ng Tagagawa
subtitle: Aquafarer ay sumusuporta sa kalidad ng bawat inflatable na produktong pang-dagat na aming ginagawa. Itinatakda ng Limitadong Warranty na ito ang mga tuntunin at saklaw para sa iyong Aquafarer na produkto.
seo:
  headline: Aquafarer Warranty ng Inflatable Boat — 5-Taong Limitadong Warranty | Aquafarer
  description: Aquafarer ay nagbibigay ng 5-taong limitadong warranty sa pangunahing tela ng tubo, tahi, at integridad ng istrukturang fiberglass hull. Sinasaklaw din ang mga inflation valve at pabrika-instaladong mga aksesorya. Buong mga tuntunin at kundisyon para sa Aquafarer inflatable boat warranty.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ang Limitadong Warranty na ito ay naaangkop sa mga bagong Aquafarer tatak ng inflatable marine products na binili nang direkta mula sa Aquafarer o mula sa awtorisadong Aquafarer dealer o retailer. Ang petsa ng bisa ay ang masusuring petsa ng orihinal na pagbili sa tingi.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Saklaw ng Warranty at Tagal</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Integridad ng pangunahing tela ng tubo (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Integridad ng istrukturang fiberglass hull</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Kakayahang hawakan ng hangin ng tahi ng inflatable tube</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Pag-andar ng inflation valve</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Taon</h3>
        <p class="text-sm text-gray-600 mt-1">Pabrika-instaladong mga aksesorya at auxiliary fittings</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Taon*</h3>
        <p class="text-sm text-gray-600 mt-1">Komersyal, pangrenta, o fleet use — lahat ng bahagi</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Ang komersyal, pamahalaan, charter, renta, o gamit pang-instruksyon ay nagpapababa ng warranty sa 1 taon. Ang paggamit sa karera o kompetisyon ay ganap na nagpapawalang-bisa ng warranty.</p>
  </div>

  <h2>Ano ang Saklaw</h2>
  <h3>Pangunahing Tela ng Tubo (5 Taon)</h3>
  <p>Aquafarer ay nagwarranty ng pangunahing tela ng tubo laban sa pagkabulok ng porosity na lubhang nagpapahina sa kakayahan ng produkto na mapanatili ang operasyon ng inflation. Ito ay naaangkop sa CSM (Hypalon) na may patong na tela at sa lahat ng iba pang materyales ng tela ng tubo na ginamit sa paggawa.</p>

  <h3>Integridad ng Istrukturang Fiberglass Hull (5 Taon)</h3>
  <p>Para sa mga produkto na may fiberglass-reinforced plastic (FRP) hull, ang pangunahing composite structure ay may warranty laban sa pagkabigo ng istruktura dahil sa depekto sa materyales o pagkakagawa.</p>

  <h3>Kakayahang Hawakan ng Hangin ng Tahi ng Inflatable Tube (5 Taon)</h3>
  <p>Ang mga tahi ng inflatable tubes, kung saan pinagsama sa paggawa, ay may warranty laban sa depekto ng pagmamanupaktura na nagreresulta sa malaking pagtagas ng hangin sa tahi. Ang pana-panahong inspeksyon at pagpapanatili ng tamang inflation pressures ay mga kundisyon ng saklaw.</p>

  <h3>Pag-andar ng Inflation Valve (5 Taon)</h3>
  <p>Ang mga air inflation valve na orihinal na ini-install ng Aquafarer ay may warranty laban sa depekto sa materyales o pagkakagawa na pumipigil sa valve na hawakan ang hangin ayon sa disenyo.</p>

  <h3>Pabrika-Instaladong Aksesorya (1 Taon)</h3>
  <p>Ang mga bahagi at fittings na ginawa ng Aquafarer at orihinal na ini-install sa pabrika ay may warranty laban sa depekto ng materyal at pagkakagawa sa loob ng isang taon. Hindi kasama ang mga item ng ikatlong partido, na saklaw lamang ng kani-kanilang warranty ng gumawa.</p>

  <h2>Ano ang Hindi Saklaw</h2>
  <ul>
    <li>Mga kosmetikong depekto kasama ang pagbabago ng kulay, mantsa, pagkupas, pagputi, o anumang pagbabago sa hitsura</li>
    <li>Pagbutas, hiwa, punit, sira, o iba pang pisikal na pinsala</li>
    <li>Pag-crack, pag-asim, pagkasira, gasgas, o pagkabulok mula sa alitan o pagkakadikit</li>
    <li>Pagkasira mula sa pagkakalantad sa liwanag, panahon, o kondisyon sa atmospera</li>
    <li>Pinsala mula sa pakikipag-ugnayan sa mga gasolina, solvent, asido, alkali, o kemikal</li>
    <li>Pinsala mula sa kapabayaan, maling paggamit, pang-aabuso, aksidente, o normal na pagkasuot at pagkasira</li>
    <li>Mga isyu sa ibabaw ng gelcoat o pintura (pagbubula, pag-crack, pagbabago ng kulay, pangungupas)</li>
    <li>Pinsala mula sa impact, stress, maling suporta, o trailer</li>
    <li>Pinsala mula sa maling inflation/deflation o paggamit ng hindi aprubadong kagamitan sa inflation</li>
    <li>Mga kagamitan, bahagi, o sistema mula sa ikatlong partido (saklaw ng kani-kanilang mga tagagawa)</li>
  </ul>

  <h2>Obligasyon at Remedyo ng Tagagawa</h2>
  <p>Ang tanging at eksklusibong obligasyon ng Aquafarer ay ang pagkukumpuni o pagpapalit, sa opsyon ng Aquafarer, ng anumang bahagi na natukoy na may depekto sa materyales o paggawa at sakop ng warranty na ito. Ang pagkukumpuni o pagpapalit ay isinasagawa ng Aquafarer o ng itinalagang awtorisadong service facility nito. Ang mga bahagi na kinumpuni o pinalitan ay may warranty lamang para sa natitirang bahagi ng orihinal na panahon ng warranty.</p>

  <h2>Mga Kondisyon ng Warranty</h2>
  <ul>
    <li><strong>Pagpaparehistro:</strong>Dapat maayos na mairehistro ang produkto alinsunod sa itinakdang kondisyon ng warranty.</li>
    <li><strong>Pagpapanatili:</strong>Dapat mapanatili ang produkto ayon sa inilathalang gabay ng Aquafarer, kabilang ang pana-panahong inspeksyon at pagpapanatili ng angkop na presyon sa inflation.</li>
    <li><strong>Pakikipagtulungan:</strong>Dapat ganap at agad na makipagtulungan ang mamimili sa Aquafarer sa lahat ng bagay tungkol sa warranty claims.</li>
    <li><strong>Orihinal na Mamimili:</strong>Ang warranty na ito ay eksklusibong ibinibigay sa orihinal na end-user na mamimili at hindi naipapasa.</li>
  </ul>

  <h2>Pampinansyal na Paggamit</h2>
  <p>Kung ang produkto ay gagamitin para sa pang-komersyal, pamahalaan, non-profit, charter, rental, instruksyunal, o anumang layunin maliban sa pribadong libangan, ang panahon ng warranty para sa lahat ng bahagi ay babawasan sa isa (1) taon mula sa orihinal na petsa ng pagbili sa retail. Ang paggamit sa karera, bilis o paligsahan sa tibay ay agad at hindi maibabalik na nagpapawalang-bisa sa warranty ng buo.</p>

  <h2>Paano Gumawa ng Warranty Claim</h2>
  <p>Makipag-ugnayan sa Aquafarer o sa awtorisadong dealer kasama ang patunay ng pagbili at detalyadong paglalarawan ng isyu. Susuriin ng Aquafarer ang claim at magbigay ng mga tagubilin para sa inspeksyon at serbisyo.</p>
  <p>Para sa mga katanungan tungkol sa warranty service, mangyaring makipag-ugnayan sa amin sa pamamagitan ng aming<a href="/contact" class="text-sky-600 underline">contact page</a>kasama ang iyong order number at detalye ng produkto.</p>

  <h2>Mga Item mula sa Ikatlong Partido</h2>
  <p>Ang kagamitan, bahagi, o sistema na ginawa ng ikatlong partido (kahit na ini-install ng Aquafarer) ay sakop lamang ng anumang warranty na inaalok ng kani-kanilang tagagawa. Eksklusibong itinatangi ng Aquafarer ang anumang responsibilidad sa warranty para sa mga item mula sa ikatlong partido.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Ang pahayag ng warranty na ito ay isang buod ng kumpletong Aquafarer Manufacturer's Limited Warranty. Ang buong legal na dokumento ng warranty ang namamahala sa lahat ng termino at kondisyon ng warranty. Maaaring magbago ang mga espesipikasyon nang walang abiso. Ang Aquafarer ay isang factory brand ng Aquafarer Qingdao Manufacturing Hub.
  </p>
