label: Garantiya
headline: Paddle Board Overstock Limitadong Warranty ng Tagagawa
subtitle: Paddle Board Overstock ay naninindigan sa kalidad ng bawat inflatable SUP board na aming ginagawa. Itinatakda ng Limitadong Warranty na ito ang mga tuntunin at saklaw para sa iyong Paddle Board Overstock board.
seo:
  headline: Paddle Board Overstock SUP Warranty — 2-Taong Limitadong Warranty | Paddle Board Overstock
  description: Paddle Board Overstock ay nag-aalok ng 2-taong limitadong warranty na sumasaklaw sa drop-stitch seams, rail construction, inflation valves, at kasamang accessories sa bawat SUP board. Buong mga tuntunin at kondisyon.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ang Limitadong Warranty na ito ay naaangkop sa mga bagong Paddle Board Overstock branded inflatable SUP boards na binili nang direkta mula sa Paddle Board Overstock online store. Ang petsa ng bisa ay ang maverify na petsa ng orihinal na pagbili.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Warranty Coverage & Tagal</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Taon</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch core & deck structure</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Taon</h3>
          <p class="text-sm text-gray-600 mt-1">Rail & seam construction</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Taon</h3>
          <p class="text-sm text-gray-600 mt-1">Pag-andar ng inflation valve</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Taon</h3>
          <p class="text-sm text-gray-600 mt-1">Kasalukuyang kasama na accessories (pump, paddle, leash, fin)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Taon*</h3>
          <p class="text-sm text-gray-600 mt-1">Komersyal, pangrenta, o fleet use — lahat ng bahagi</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Ang komersyal, paupahan, o pang-fleet na paggamit ay nagpapababa sa warranty sa 1 taon. Ang paggamit sa karera o kompetisyon ay ganap na walang bisa sa warranty.</p>
    </div>

    <h2>Ano ang Saklaw</h2>
    <h3>Drop-Stitch Core & Deck Structure (2 Taon)</h3>
    <p>Ang panloob na drop-stitch core at panlabas na istruktura ng board ay may warranty laban sa depekto sa paggawa na makakaapekto sa kakayahan ng board na mapanatili ang tamang inflation at rigidity.</p>

    <h3>Rail & Seam Construction (2 Taon)</h3>
    <p>Ang mga seams at triple-layer rail bands, kung saan pinagsama sa paggawa, ay may warranty laban sa depekto sa paggawa na nagreresulta sa talamak na pagtakas ng hangin sa seam. Ang pana-panahong inspeksyon at pagpapanatili ng tamang presyon ng inflation ay kundisyon ng saklaw.</p>

    <h3>Inflation Valve Functionality (2 Taon)</h3>
    <p>Ang mga air inflation valve na orihinal na ini-install ng Paddle Board Overstock ay naka-warranty laban sa mga depekto sa paggawa o materyales na pumipigil sa valve na maghawak ng hangin ayon sa disenyo.</p>

    <h3>Kasalukuyang Kasama na Accessories (2 Taon)</h3>
    <p>Ang pump, adjustable paddle, leash, removable fin, at iba pang bahagi na kasama sa iyong board package ay may warranty laban sa depekto sa materyal at paggawa.</p>

    <h2>Ano ang Hindi Saklaw</h2>
    <ul>
      <li>Mga kosmetikong depekto kasama ang pagbabago ng kulay, mantsa, pagkupas, pagputi, o anumang pagbabago sa hitsura</li>
      <li>Pagbutas, hiwa, punit, sira, o iba pang pisikal na pinsala</li>
      <li>Pag-crack, pag-asim, pagkasira, gasgas, o pagkabulok mula sa alitan o pagkakadikit</li>
      <li>Pagkasira mula sa pagkakalantad sa liwanag, panahon, o kondisyon sa atmospera</li>
      <li>Pinsala mula sa pakikipag-ugnayan sa solvents, acids, alkalis, o chemicals</li>
      <li>Pinsala mula sa kapabayaan, maling paggamit, pang-aabuso, aksidente, o normal na pagkasuot at pagkasira</li>
      <li>Pinsala mula sa epekto, stress, maling suporta, o transportasyon</li>
      <li>Pinsala mula sa maling inflation/deflation o paggamit ng hindi aprubadong kagamitan sa inflation</li>
      <li>Mga kagamitan, bahagi, o sistema mula sa ikatlong partido (saklaw ng kani-kanilang mga tagagawa)</li>
    </ul>

    <h2>Obligasyon at Remedyo ng Tagagawa</h2>
    <p>Ang tanging at eksklusibong obligasyon ng Paddle Board Overstock ay ang pagkumpuni o pagpapalit, ayon sa pagpipilian ng Paddle Board Overstock, ng anumang bahagi na natukoy na may depekto sa materyales o paggawa at saklaw ng warranty na ito. Ang mga pagkukumpuni o pagpapalit ay isinasagawa ng Paddle Board Overstock o ng itinalagang serbisyo nitong pasilidad. Ang mga bahaging naayos o pinalitan ay may warranty lamang sa natitirang bahagi ng orihinal na panahon ng warranty.</p>

    <h2>Mga Kondisyon ng Warranty</h2>
    <ul>
      <li><strong>Pagpapanatili:</strong>Ang produkto ay dapat mapanatili alinsunod sa mga inilathalang gabay ng Paddle Board Overstock, kabilang ang pana-panahong inspeksyon at pagpapanatili ng wastong presyon ng hangin.</li>
      <li><strong>Pakikipagtulungan:</strong>Ang mamimili ay dapat buong pusong makipagtulungan sa Paddle Board Overstock sa lahat ng bagay na may kinalaman sa mga claim ng warranty.</li>
      <li><strong>Orihinal na Mamimili:</strong>Ang warranty na ito ay eksklusibong ibinibigay sa orihinal na end-user na mamimili at hindi naipapasa.</li>
    </ul>

    <h2>Pampinansyal na Paggamit</h2>
    <p>Kung ang produkto ay ginagamit para sa komersyal, paupahang, o fleet na layunin, ang panahon ng warranty para sa lahat ng bahagi ay pinapaikli sa isa (1) taon mula sa orihinal na petsa ng pagbili. Ang paggamit sa karera, bilis o pagtitiis na kompetisyon ay agad at tuluyang pumapawalang bisa sa warranty.</p>

    <h2>Paano Gumawa ng Warranty Claim</h2>
    <p>Makipag-ugnayan sa Paddle Board Overstock na may katunayan ng pagbili at detalyadong paglalarawan ng isyu. Susuriin ng Paddle Board Overstock ang claim at magbibigay ng mga tagubilin para sa inspeksyon at serbisyo.</p>
    <p>Para sa mga katanungan tungkol sa warranty service, mangyaring makipag-ugnayan sa amin sa pamamagitan ng aming<a href="/contact" class="text-sky-600 underline">pahina ng kontak</a>kasama ang iyong order number at detalye ng produkto.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Ang pahayag tungkol sa warranty na ito ay isang buod ng kumpletong Limitadong Warranty ng Tagagawa ng Paddle Board Overstock. Ang buong dokumento ng legal na warranty ang namamahala sa lahat ng tuntunin at kundisyon ng warranty. Ang mga espesipikasyon ay maaaring baguhin nang walang abiso. Ang Paddle Board Overstock ay isang pabrika ng tatak ng Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
