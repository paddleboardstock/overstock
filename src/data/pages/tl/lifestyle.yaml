hero:
  tagline: Pamumuhay
  title: Ang Paddle Board Overstock<br />Pamumuhay
  subtitle: Ginawa para sa mga nakatira sa tubig — mula sa mga nag-eexplore tuwing weekend hanggang sa mga komersyal na operator na umaasa sa kanilang kagamitan araw-araw.
values:
  - icon: 🌊
    title: Ipinanganak sa Tubig
    desc: Nagsisimula ang bawat disenyo sa pag-unawa kung paano kumikilos ang tubig. Nag-iinhenyero kami mula sa gilid ng mga kondisyon papasok — dahil ang karagatan ang aming guro, hindi ang aming lugar ng trabaho.
  - icon: 🔧
    title: Ginawa Upang Magtagal
    desc: Ang pinaka-napapanatiling produkto ay ang hindi kailangang palitan. Mga materyales na pang-dagat, drop-stitch na mga core na may rating na 15 PSI, at mga tahi na tumatagal lampas sa isang season.
  - icon: 🏆
    title: Maaaring Ma-access sa Disenyo
    desc: Hindi dapat maging luho ang mga palakasan sa tubig. Propesyonal na antas ng pagganap sa presyong makatuwiran para sa mga pamilya, mga gabay, at maliliit na operator — hindi lamang para sa mga komersyal na flotilla.
  - icon: 🌍
    title: Pandaigdigang Komunidad
    desc: 'Mula sa baybayin ng Qingdao hanggang sa mga lawa sa Europa, mga ilog sa Timog-silangang Asya, at mga look sa Amerika — iisa ang pinagsasaluhan ng aming mga customer: ang pagmamahal sa pagiging nasa tubig.'
  - icon: ♻️
    title: Responsableng Paggawa
    desc: CNC-na-optimize na pagtutupi ay nagpapababa ng nasasayang na materyal sa ilalim ng 5%. Matibay na konstruksyon ang nagpapababa ng pangangailangan ng pagpapalit. Nagtatayo kami para sa pangmatagalan dahil ito ang pinaka-sustenableng pagpipilian.
  - icon: 🤝
    title: Suportang Matagal
    desc: Dalawampung taong gulang na katawan ay patuloy na tumatawag sa amin para sa mga piyesa. Ang karaniwang tugon namin sa warranty ay 24 na oras. Hindi kami nawawala pagkatapos ng bentahan — nandito kami para sa buong buhay ng produkto.
