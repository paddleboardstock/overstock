hero:
  tagline: Pamumuhay
  title: Ang Paddle Board Overstock<br />Pamumuhay
  subtitle: Ginawa para sa mga taong namumuhay sa tubig — mula sa mga nag-eeksplora tuwing katapusan ng linggo hanggang sa mga araw-araw na nagpa-paddle na binibilang ang mga araw sa pagitan ng mga sesyon.
values:
  - icon: 🌊
    title: Ipinanganak sa Tubig
    desc: Nagsisimula ang bawat disenyo sa pag-unawa kung paano kumikilos ang tubig. Nag-iinhenyero kami mula sa gilid ng mga kondisyon papasok — dahil ang karagatan ang aming guro, hindi ang aming lugar ng trabaho.
  - icon: 🔧
    title: Ginawa Upang Magtagal
    desc: Ang pinaka-napapanatiling produkto ay ang hindi kailangang palitan. Mga materyales na pang-dagat, drop-stitch na mga core na may rating na 15 PSI, at mga tahi na tumatagal lampas sa isang season.
  - icon: 🏆
    title: Maaaring Maabot sa Disenyo
    desc: Hindi dapat luho ang mga water sports. Propesyonal na kalidad ng performance sa presyong makatuwiran para sa mga pamilya, gabay, at pang-araw-araw na paddlers — hindi lamang para sa mga propesyonal.
  - icon: 🌍
    title: Pandaigdigang Komunidad
    desc: 'Mula sa baybayin ng Weihai hanggang sa mga lawa sa Europa, mga ilog sa Timog-silangang Asya, at mga look sa Amerika — iisa ang pinagsasaluhan ng aming mga customer: ang pagmamahal sa pagkakaroon sa tubig.'
  - icon: ♻️
    title: Responsableng Paggawa
    desc: CNC-na-optimize na pagtutupi ay nagpapababa ng nasasayang na materyal sa ilalim ng 5%. Matibay na konstruksyon ang nagpapababa ng pangangailangan ng pagpapalit. Nagtatayo kami para sa pangmatagalan dahil ito ang pinaka-sustenableng pagpipilian.
  - icon: 🤝
    title: Suportang Matagal
    desc: Ang mga board na ginawa namin taon na ang nakalilipas ay patuloy pa ring tumatawag sa amin para sa mga spare parts. Ang aming tugon sa warranty ay karaniwang 24 na oras. Hindi kami nawawala matapos ang benta — narito kami para sa buong buhay ng produkto.
