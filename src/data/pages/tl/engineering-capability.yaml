content_capability:
  tagline: Kakayahan sa Inhinyeriya
  title: Ano Ang Aming Inhinyeriya<br />Nagbibigay ang Koponan
  subtitle: Saklaw ng Paddle Board Overstock engineering ang buong lifecycle ng produkto — mula sa pananaliksik sa merkado at disenyo ng konsepto hanggang sa paggawa ng prototype, pagsubok, at mass production.
  items:
    - title: Disenyong Pangkabuhayan
      description: Ang aming pangkat ng disenyo sa industriya ay gumagana mula sa mga kinakailangan ng kustomer, pananaliksik sa merkado, at pagsusuri ng kompetisyon upang makabuo ng mga konsepto ng produkto na nagbabalansi sa estetika, functionality, at manufacturability. Gumagawa kami ng 2D na sketches, 3D na renderings, at mga dokumento ng espesipikasyon para sa pagsusuri ng kliyente bago magpatuloy sa paggawa ng tooling.
      features:
        - Pagbuo ng konsepto at mga pag-aaral ng pagiging posible
        - Mga guhit ng disenyo sa 2D at mga render ng 3D
        - Pagpili at pagtukoy ng materyal
        - Pagsusuri ng disenyo para sa pagmamanupaktura (DFM)
        - Pagsusuri ng ergonomiko at kaligtasan
    - title: Inhinyeriyang Pangstruktura
      description: Ang aming mga inhinyero sa istruktura ay dalubhasa sa arkitektura ng inflatable na bangka — disenyo ng hull, pagsasaayos ng tube chamber, drop-stitch pangunahing inhinyeriya, at pamamahagi ng load. Bawat disenyo ay sinusuri para sa integridad ng istruktura, pag-optimize ng timbang, at pagsunod sa mga kaugnay na pamantayan (CE, ISO, AS).
      features:
        - Disenyong hull na Deep-V na gawa sa fiberglass na may kalkuladong mga anggulo ng deadrise
        - Kakayahang multi-chamber ng tubo para sa kaligtasan at panaligtas sa tubig
        - specipikasyon ng Drop-stitch na core at pag-optimize ng densidad
        - Pagsusuring finite element para sa mga bahagi na may dinadala na bigat
        - Mga kalkulasyon ng pamamahagi ng timbang at katatagan
    - title: 3D Pagmomodelo at CAD
      description: Lahat ng disenyo ng produkto ay dine-develop sa 3D CAD bago simulan ang prototype tooling. Ginagamit ng aming mga engineer ang SolidWorks at Rhino 3D para sa product modeling, na nagpapahintulot sa mga kliyente na suriin ang bawat detalye — mula tube profile hanggang console layout — bago mag-commit sa produksyon.
      features:
        - Buong 3D CAD modeling sa SolidWorks at Rhino 3D
        - Photo-realistic na rendering para sa mga presentasyon ng kliyente
        - Mga pakete ng teknikal na guhit para sa produksyon
        - Disenyo ng hulma at tooling mula sa mga 3D na modelo
        - CAD-to-CNC direktang paglilipat ng datos para sa eksaktong pagputol
    - title: Prototyping at Pagsusuri
      description: Bago ang mass production, bawat bagong produkto ay dumadaan sa yugto ng prototype. Gumagawa kami ng mga functional prototype para sa pagsusuri ng kliyente, pagkatapos ay sumasailalim sa aming buong testing protocol — pressure testing, stability testing, load testing, at water trials. Ang mga design iterations sa prototype stage ay mabilis at cost-effective.
      features:
        - Mabilis na prototype tooling (15-20 araw na turnaround)
        - Functional prototype para sa totoong pagsusuri
        - Kumpletong protokol sa pagsubok bago ang produksyon na pumirma
        - Paulit-ulit na pagpapabuti ng disenyo batay sa resulta ng pagsusuri
        - Milestone ng pag-apruba ng kliyente bago ang production tooling
    - title: Custom na Integrasyon ng Accessory
      description: Maraming OEM proyekto ang nangangailangan ng integrasyon ng mga accessory na ibinibigay ng kliyente o third-party — custom consoles, espesyal na upuan, electronic systems, dive equipment mounts, o branding elements. Pinamamahalaan ng aming engineering team ang integration design, structural adaptation, at quality validation ng lahat ng accessories.
      features:
        - Disenyo ng console at layout ng instrument panel
        - Custom na pagsasama ng upuan at upholstery
        - Disenyo ng elektronikong sistema at wiring
        - Mga sistema ng pag-mount ng dive at rescue equipment
        - Mga espesipikasyon ng branding at graphic application
content_process:
  tagline: Proseso ng Pag-unlad
  title: Mula sa Konsepto<br />sa Produksyon
  subtitle: Ang aming proseso ng pagbuo ng produkto ay sumusunod sa isang organisadong 6-yugtong workflow na idinisenyo upang mabawasan ang panganib, paikliin ang mga takdang panahon, at matiyak ang kahandaan ng paggawa mula sa unang araw.
  stages:
    - stage: '01'
      title: Mga Kinakailangan at Pananaliksik
      duration: 1-2 linggo
      description: Nakikipagtulungan kami sa kliyente upang tukuyin ang mga espesipikasyon ng produkto, mga kinakailangan sa target na merkado, mga pangangailangan sa pagsunod sa regulasyon, at mga komersyal na layunin. Ang yugtong ito ay nagbubunga ng Product Requirements Document (PRD) na gumagabay sa lahat ng susunod na gawain.
      deliverables: PRD, pagsusuri ng merkado, kompetitibong benchmark, paunang pagtataya ng gastos
    - stage: '02'
      title: Disenyo ng Konsepto
      duration: 2-3 linggo
      description: Ang pangkat ng industrial design ay bumubuo ng mga konsepto ng produkto batay sa PRD. Ipinapakita ang maramihang opsyon sa disenyo kasama ang 3D na renderings, rekomendasyon sa materyales, at paunang pagsusuri sa engineering. Pinipili ng kliyente ang direksyon para sa detalyadong pagpapaunlad.
      deliverables: 3D na konsepto ng renderings, espesipikasyon ng materyales, rasyonal ng disenyo, paunang BOM
    - stage: '03'
      title: Detalyadong Engineering
      duration: 2-4 na linggo
      description: Ang napiling konsepto ay ganap na ine-engineer — 3D CAD modeling, pagsusuri sa estruktura, konfigurasyon ng tubo, disenyo ng hull, integrasyon ng aksesorya, at dokumentasyon para sa produksyon. Lahat ng sukat, materyales, at proseso ay tinutukoy para sa tooling.
      deliverables: Buong 3D CAD model, engineering drawings, panghuling BOM, espesipikasyon ng tooling, QC plan
    - stage: '04'
      title: Prototyping
      duration: 2-3 linggo
      description: Gumagawa ng prototype tooling at binubuo ang mga functional sample. Sinusuri ng kliyente ang prototype laban sa PRD na espesipikasyon. Isinasagawa ang pagsubok ayon sa napagkasunduang protocol. Ginagawa ang mga pagbabago sa disenyo batay sa feedback bago ang production tooling.
      deliverables: Functional prototype, test report, design revision log, dokumento ng pag-apruba ng kliyente
    - stage: '05'
      title: Kasangkapang Pang-produksyon
      duration: 2-3 linggo
      description: Kapag aprubado na ang prototype, nirerekomisyon ang production tooling — molds, welding jigs, cutting programs, assembly fixtures. Pinapinalize ang QC documentation at inspection criteria. Isinasagawa ang trial run para sa beripikasyon ng proseso.
      deliverables: Production tooling, dokumentasyon ng proseso, QC inspection plan, trial run report
    - stage: '06'
      title: Mass Production at QC
      duration: Patuloy
      description: Nagsisimula ang full production na may in-process QC sa bawat yugto. Sininisya ang first articles at inaaprubahan bago pakawalan ang batch. Patuloy ang pagmamanman ng kalidad, pagsubaybay ng depekto, at tuloy-tuloy na pagpapabuti sa buong lifecycle ng produksyon.
      deliverables: Production schedule, QC reports, talaan ng batch traceability, dokumentasyon sa pagpapadala
content_customization:
  tagline: Opsyon sa Pag-customize
  title: Ano ang Maaaring<br />I-customize
  subtitle: Halos lahat ng aspeto ng aming mga produkto ay maaaring i-customize upang matugunan ang mga kahilingan ng kliyente. Narito ang mga pinakakaraniwang kategorya ng customization.
  columns: 3
  items:
    - title: Hull at Estruktura
      description: Custom na haba ng hull, lapad ng beam, anggulo ng deadrise, diameter ng tubo, konfigurasyon ng chamber, at grado ng materyales.
      icon: tabler:sailboat
    - title: Mga Kulay at Graphics
      description: Kulay ng tubo (PVC/Hypalon), kulay ng gelcoat ng hull, kulay ng console, graphics sa deck, posisyon ng logo, at disenyo ng packaging.
      icon: tabler:palette
    - title: Console at Controls
      description: Center console, side console, o tiller steering. Custom na layout ng instrument panel, posisyon ng switch, at posisyon ng helm.
      icon: tabler:steering-wheel
    - title: Seating at Upholstery
      description: Jockey seats, bench seating, luxury upholstery, pagtatahi na magkatugma ang kulay, pagpipilit o maaring alisin na konfigurasyon.
      icon: tabler:armchair
    - title: Aksesorya at Kagamitan
      description: Dive ladders, tank racks, tow pylons, T-tops, Bimini tops, sound systems, navigation electronics, at safety equipment.
      icon: tabler:backpack
    - title: Pag-iimpake at Pagba-brand
      description: Pasadyang retail na packaging, mga kahon na may pribadong tatak, mga karton sa pagpapadala na may marka ng tatak, mga hang tag, at mga manwal ng gumagamit sa wika ng kliyente.
      icon: tabler:box
content_industries:
  tagline: Mga Aplikasyon sa Industriya
  title: Mga Solusyon sa Inhinyeriya<br />ayon sa Industriya
  subtitle: Ang aming koponang pang-inhenyeriya ay nakabuo ng mga produkto para sa malawak na saklaw ng mga aplikasyon sa dagat — ang bawat isa ay may natatanging kinakailangan at pamantayan sa pagganap.
  columns: 3
  items:
    - title: Mga Operasyon sa Paglalangoy sa Ilalim ng Tubig
      description: Pinalakas na mga deck, pagsasama ng hagdang panakabilang, mga sistema ng imbakan ng tangke, at matatag na mga plataporma para sa mga komersyal na sentro ng pagsisid sa buong mundo.
      icon: tabler:lifebuoy
    - title: Pagsagip at Pang-emergency
      description: Mga disenyo ng katawan na may mataas na bilis, mga deck na may self-bailing, mga sistema ng pag-mount ng kagamitan, at mga multi-chamber na konfigurasyon ng kaligtasan para sa mga operasyon ng SAR.
      icon: tabler:alert-triangle
    - title: Turismong Pangkaragatan
      description: Mga ayos para sa kaginhawahan ng pasahero, integrasyon ng pang-salabsab ng araw, mga sistema sa pagsakay, at mga fuel-efficient na kaayusan para sa operasyon ng paglilipat sa isla.
      icon: tabler:beach
    - title: Mga Tender ng Yate
      description: Compact na disenyo para sa imbakan ng davit, mga opsyon sa marangyang pagtatapos, nagmamatch na kulay ng mothership, at mataas na performance na katangian sa paghihila.
      icon: tabler:sailboat
    - title: Pangingisda at Aquaculture
      description: Mga patag na konfigurasyon ng deck, integrasyon ng livewell, mga layout ng hawakan ng pamingwit, hardware na panlaban sa kalawang para sa tuloy-tuloy na pagkakalantad sa asin na tubig.
      icon: tabler:fish
    - title: Pantalan at Industriyal
      description: Matibay na pagpapalakas ng katawan ng barko, mga layout ng workboat, mga kaayusan sa transportasyon ng tauhan, at integrasyon ng kagamitan para sa mga operasyon sa dagat.
      icon: tabler:ship
