  subtitle: Ibahagi ang iyong mga kinakailangan sa produkto, target na merkado, at timeline — ang aming engineering team ay tutugon sa isang panukalang pagpapaunlad at tinatayang gastos sa loob ng 48 na oras.
  actions:
    - variant: primary
      text: Simulan ang iyong proyekto
      href: /contact
    - text: Tingnan ang OEM/ODM plano
