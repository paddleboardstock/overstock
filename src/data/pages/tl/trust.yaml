features3_certifications:
  title: Kalidad at Pagsubok
  subtitle: Bawat board ay sinusuri sa aming sariling laboratoryo bago ito ipadala — totoong mga numero, totoong mga rekord, walang mga pahayag sa marketing.
  columns: 3
  isBeforeContent: true
  items:
    - title: Itinayo sa Aming Sariling Pabrika
      description: Pag-aari at pinapatakbo namin ang isang 12,000 m² na pasilidad sa Weihai. Bawat batch ng produksyon ay maaaring masubaybayan, idokumento, at inspeksyunin — walang outsourced na misteryosong paggawa.
      icon: tabler:building-factory
    - title: Laboratoryo sa Pagsusuri ng Materyal
      description: Sinusuri ng batayang laboratoryo ng mga materyales ang lakas ng hinihila, UV na resistensya, integridad ng tahi, at pagkasira para sa bawat batch ng tela bago ang produksyon.
      icon: tabler:microscope
    - title: Mga Materyales na Pang-Marino
      description: UV-Stabilized PVC, drop-stitch cores, at EVA deck foam — pinili at sinubukan para sa mga panahon ng araw, asin, at abuso.
      icon: tabler:flask
    - title: 2-Taong SUP Warranty
      description: Paddle Board Overstock SUP mga board ay may 2-taong warranty laban sa depektong mula sa paggawa, kabilang ang tahi, balbula, at paghiwalay ng materyal. Tinatayuan namin ang aming ginawa.
      icon: tabler:shield-check
testimonials:
  tagline: Tiwala ng Customer
  title: Ano ang sinasabi ng aming mga customer
  subtitle: Mula sa mga unang beses na maninaga hanggang sa mga bihasang manlalakbay — tingnan kung bakit sila nagtitiwala sa Paddle Board Overstock.
  items:
    - content: Bilang isang first-time buyer, kinakabahan ako sa pag-order mula sa ibang bansa. Sinagot ng team ang bawat tanong gamit ang totoong mga larawan at test records bago pa man ako magtanong. Dumating ang board sa loob ng 6 na araw at nalampasan nito ang aking inaasahan.
      name: James Thornton
      title: SUP Explorer 11 may-ari — Vancouver, Canada
features3_lab:
  title: Pagsusuri at Kalidad sa Loob ng Lab
  subtitle: Bawat batch ng materyales at natapos na produkto ay dumadaan sa aming on-site testing laboratory bago ipadala.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pagsusuri ng Lakas ng Tensil
      description: 'Bawat PVC roll ng tela ay sinusuri para sa tensile strength sa loob ng kumpanya. Minimum na kinakailangan: 350 N/cm warp at weft. Ang mga tinanggihan na batch ay ibinabalik sa supplier — tinatanggihan namin ang humigit-kumulang 3% ng mga papasok na materyales.'
      icon: tabler:scale
    - title: UV Pinaagang Pagtanda
      description: Ang mga sample ng tela ay dumadaan sa 1,000-oras na pinabilis UV na weathering. Dapat mapanatili ang tensile strength ng 80%+ pagkatapos ng exposure. Mga produktong may rating para sa 3+ taon ng paggamit sa labas.
      icon: tabler:sun
    - title: Lakas ng Paghiwalay ng Tahi
      description: Ang welded seams ay sinusuri hanggang sa 5 N/mm minimum peel strength. Bawat batch ng produksyon ay may mga seam sample na mapanira na sinusuri at na-archive.
      icon: tabler:stack
    - title: Paghawak ng Presyon sa loob ng 24–48 Oras
      description: 'Bawat inflatable na produkto ay ini-inflate sa 1.25x rated PSI at minomonitor ng 24–48 oras. Maximum na pinapayagang pagbaba ng pressure: 5%. Ang mga produkto na bumagsak sa test na ito ay nire-rework at tinitest muli bago ipadala.'
      icon: tabler:wind
    - title: Pagsusuri ng Siklo ng Balbula
      description: Ang bawat disenyo ng balbula ay sumasailalim sa 10,000 na siklo ng pagbukas-sara sa aming laboratoryo. Ang mga balbula ay dapat mapanatili ang selyo na hindi tinatablan ng hangin sa 1.25x na tinukoy na presyon pagkatapos ng pag-ikot. Lahat ng Paddle Board Overstock balbula ay may rating na 5+ taon ng regular na paggamit.
      icon: tabler:rotate
    - title: Pagtutol sa Malamig na Bitak
      description: Ang mga materyales ay sinusuri sa -30°C sa loob ng 4 na oras. Hindi pinapayagan ang pagbitak o pagkabaliw. Mga produktong may rating para sa winter storage at paggamit ng malamig na tubig hanggang -10°C ambient temperature.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Paano namin tiniyak ang kalidad
  subtitle: Mula sa inspeksyon ng raw material hanggang sa final pressure testing — bawat produkto ay dumadaan sa masusing quality chain.
  items:
    - title: Pagsusuri ng Hilaw na Materyal
      description: Bawat roll ng PVC tela ay sinusuri para sa kapal, tensile strength, at UV resistance bago pumasok sa produksyon.
      icon: tabler:search
    - title: QC Habang Proseso
      description: Ang mga weld seam, instalasyon ng valve, at chamber bonds ay iniinspeksyon sa bawat istasyon habang nasa assembly.
      icon: tabler:eye
    - title: Pagsusuri ng Presyon
      description: Bawat inflatable na produkto ay pinapataas sa 1.25x rated PSI at hinahawakan ng 24–48 oras upang matiyak ang air retention at seam integrity.
      icon: tabler:wind
    - title: Pangwakas na Inspeksyon
      description: Bawat yunit ay sinusuri para sa finish, hardware, at packaging bago aprubahan para sa pagpapadala. Ang mga batch sample ay dinadala sa aming laboratoryo para sa destructive testing.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Mga FAQ sa Board
  subtitle: Mga karaniwang tanong tungkol sa aming stand-up paddle boards.
  columns: 2
  items:
    - title: Anong SUP mga sukat ng board ang available?
      description: Nag-aalok kami SUP ng mga board mula 9 ft hanggang 12 ft, kabilang ang all-round, touring, yoga, at mga espesyal na disenyo. Kabilang sa aming mga pinakabentang modelo ang Tropical Breeze (10 ft) at Ocean Voyager (11 ft).
    - title: Ano ang drop-stitch konstruksyon?
      description: Drop-stitch Ang konstruksyon ay gumagamit ng libu-libong polyester threads na nag-uugnay sa itaas at ibabang mga layer ng board, na nagpapahintulot dito na hawakan ang mataas na presyon ng hangin (15–20PSI) at makamit ang matibay at matatag na plataporma. Ito ang pamantayan sa industriya para sa premium inflatableSUPs.
    - title: Ano ang limitasyon ng timbang para sa SUP mga board?
      description: SUP Sinusuportahan ng aming mga board ang hanggang 150 kg depende sa modelo at dami. Ang Leviathan Wake board ang aming pinakamataas na kapasidad na modelo, idinisenyo para sa mas malalaking rider at paggamit ng yoga.
    - title: Nag-aalok ba kayo ng kumpletong SUP mga package?
      description: Oo. Bawat SUP board ay may kumpletong package kabilang ang 3-pirasong aluminum paddle, high-pressure hand pump, coil leash, travel backpack, at repair kit. May ilang modelo rin na may kasamang natatanggal na fin set.
    - title: Ano ang warranty sa SUP mga board?
      description: Lahat ng Paddle Board Overstock SUP boards ay may 2-taong garantiya laban sa mga depekto sa paggawa, kabilang ang pagkasira ng tahi, depekto sa balbula, at pagkakahiwa-hiwalay ng materyal sa normal na paggamit.
    - title: Gaano katagal bago ma-inflate ang SUP isang board?
      description: Gamit ang kasama na hand pump, ang buong pagbomba hanggang 15 PSI ay tumatagal ng humigit-kumulang 8–12 minuto. Para sa mas mabilis na pagbomba, inirerekomenda namin ang aming Paddle Board Overstock 12V electric pump, na nagpapabomba ng board sa loob ng mas mababa sa 4 minuto.
