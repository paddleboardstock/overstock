hero:
  tagline: Gawa ayon sa mga pamantayang mahalaga
  title: Tiwala Aquafarer
  subtitle: |
    64 na CE-sertipikadong mga modelo — sinubok para sa kaligtasan,<br />
    tibay, at pagganap. Walang dayanan. Walang eksepsyon.
  taglineSection: Sertipikado. Nasubok. Napatunayan.
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  imageAlt: produkto na sumasailalim sa pagsubok ng kalidad
stats:
  title: Aquafarer sa pamamagitan ng mga numero
  stats:
    - title: CE 6185
      description: 64 na CE-certified na batayang recreational na modelo ang nakakatugon sa pamantayan sa kaligtasan ng EU — sertipikado ng TÜV Rheinland
    - title: ISO 9001:2015
      description: Sistemang pamamahala ng kalidad na sertipikado ng SGS mula pa noong 2022
    - title: BSCI at REACH
      description: Etikal na paggawa at pagsunod sa materyales ng EU — pinatunayan ng Intertek
    - title: 5-Taong Warranty ng Bangka
      description: Sa tela ng tubo, tahi, at katawan — 2 taon sa SUP at mga aksesorya. 99.3% rate ng walang depekto (AQL 2.5 sa ISO 2859)
features3_certifications:
  title: Mga Sertipikasyon at Pagsunod
  subtitle: Ang bawat produkto ay independiyenteng sinusuri; 64 na modelo ay CE sertipikado ayon sa mga pandaigdigang pamantayan.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Sertipikasyon
      description: 64 na mga modelong sertipikado ng CE sa SUPs, mga kayak, dinghy, at RIBs ang nakakatugon sa pamantayan sa kaligtasan ng European CE para sa mga pampalibang sasakyang pandagat. Bawat produkto ay sumasailalim sa pagsubok sa presyon, buoyancy, at karga bago iwanan ang pabrika.
      icon: tabler:certificate
    - title: ''
      description: Ang aming pasilidad sa Qingdao na may sukat na 12,000 m² ay nagpapatakbo sa ilalim ng isang ISO 9001 sistema ng pamamahala ng kalidad. Bawat batch ng produksyon ay masusubaybayan, naidodokumento, at nasusuri.
      icon: tabler:clipboard-check
    - title: BSCI panlipunang pagsunod
      description: Kami ay BSCI-certified, na tinitiyak ang etikal na mga gawain sa paggawa, ligtas na kondisyon sa trabaho, at responsibilidad sa kapaligiran sa buong aming supply chain.
      icon: tabler:users
    - title: REACH at RoHS
      description: Lahat ng materyales — PVC, Hypalon, EVA na foam, pandikit — ay sumusunod sa mga regulasyon ng EU na REACH at RoHS. Walang mga ipinagbabawal na sangkap, walang kompromiso.
      icon: tabler:flask
    - title: Laboratoryo sa Pagsusuri ng Materyal
      description: Sinusuri ng batayang laboratoryo ng mga materyales ang lakas ng hinihila, UV na resistensya, integridad ng tahi, at pagkasira para sa bawat batch ng tela bago ang produksyon.
      icon: tabler:microscope
    - title: 5-Taong Warranty ng Bangka
      description: Aquafarer ang mga bangka ay sakop ng 5-taong limitadong warranty sa tela ng tubo, tahi, at katawan. SUP ang mga board at aksesorya ay may 2-taong warranty. Tinatampok namin ang aming ginawa.
      icon: tabler:shield-check
testimonials:
  tagline: Tiwala ng Customer
  title: Ano ang sinasabi ng aming mga customer
  subtitle: Mula sa mga first-time paddlers hanggang sa mga propesyonal na operator ng fleet — tingnan kung bakit nila pinagkakatiwalaan ang Aquafarer.
  items:
    - content: Pinagkakabit namin ang buong fleet ng aming paupahang kagamitan ng Aquafarer RIBs — 12 bangka sa tatlong lokasyon. Dalawang season na, walang pumalya. Ang CE certification documentation ay nagpadali sa pag-apruba ng seguro. Ang kanilang engineering team ay nag-customize pa ng kulay ng tubo upang tumugma sa aming brand.
      name: Marco Valenti
      title: Direktor ng Operasyon, Adriatic Adventure Tours — Dubrovnik, Croatia
    - content: Bilang isang unang beses na mamimili, kinakabahan ako sa kalidad ng pag-order mula sa ibang bansa. Ang ISO dokumentasyon at mga ulat ng pagsubok mula sa ikatlong partido na ibinahagi nila bago ko pa man hingin ay nagbigay sa akin ng ganap na kumpiyansa. Dumating ang board sa loob ng 6 na araw at lumabis pa sa aking mga inaasahan.
      name: James Thornton
      title: SUP Explorer 11 may-ari — Vancouver, Canada
    - content: Nag-ooperate kami ng 24 Aquafarer RIBs sa buong coastal patrol fleet namin. Ang kanilang QC process ay pare-pareho sa bawat batch — parehong kalidad ng tahi, parehong posisyon ng valve, parehong rating ng presyon bawat oras. Mahalaga ang paulit-ulit na katumpakan kapag buhay ang nakasalalay sa kagamitan.
      name: Lt. Commander Andres Reyes
      title: Opisyal sa Pagbili sa Dagat, Philippine Coast Guard Auxiliary — Maynila, Pilipinas
features3_lab:
  title: Pagsusuri at Kalidad sa Loob ng Lab
  subtitle: Bawat batch ng materyales at natapos na produkto ay dumadaan sa aming on-site testing laboratory bago ipadala.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pagsusuri ng Lakas ng Tensil
      description: 'Bawat PVC roll ng tela ay sinusubok ayon sa ASTM D751 standards. Minimum na requirement: 350 N/cm warp at weft. Ang mga batch na hindi pumasa ay ibinabalik sa supplier — tinatanggihan namin ang humigit-kumulang 3% ng papasok na materyales.'
      icon: tabler:scale
    - title: UV Pinaagang Pagtanda
      description: Ang mga sample ng tela ay sumasailalim sa 1,000 na oras ng QUV accelerated weathering (ASTM G154). Ang retention ng tensile strength ay dapat lumampas sa 80% pagkatapos ng UV exposure. Ang mga produkto ay may rating para sa 3+ taon ng paggamit sa labas.
      icon: tabler:sun
    - title: Lakas ng Paghiwalay ng Tahi
      description: RF welded seams sinusubok sa 5 N/mm minimum peel strength (ASTM D751). Hand-glued Hypalon seams sinusubok sa 3.5 N/mm. Bawat batch ng produksyon ay may seam samples na sinusuri nang destructively at ini-archive.
      icon: tabler:stack
    - title: Paghawak ng Presyon sa loob ng 24–48 Oras
      description: 'Bawat inflatable na produkto ay ini-inflate sa 1.25x rated PSI at minomonitor ng 24–48 oras. Maximum na pinapayagang pagbaba ng pressure: 5%. Ang mga produkto na bumagsak sa test na ito ay nire-rework at tinitest muli bago ipadala.'
      icon: tabler:wind
    - title: Pagsusuri ng Siklo ng Balbula
      description: Bawat disenyo ng valve ay sumasailalim sa 10,000 open-close cycle sa aming lab. Ang mga valve ay dapat mapanatili ang airtight seal sa 1.25x rated pressure pagkatapos ng cycling. Lahat ng Aquafarer valve ay may rating para sa 5+ taon ng regular na paggamit.
      icon: tabler:rotate
    - title: Pagtutol sa Malamig na Bitak
      description: Ang mga materyales ay sinusubok sa -30°C sa loob ng 4 na oras ayon sa ISO 4646. Walang cracking o embrittlement ang pinapayagan. Ang mga produkto ay may rating para sa winter storage at paggamit sa malamig na tubig hanggang -10°C ambient temperature.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Paano namin tiniyak ang kalidad
  subtitle: Mula sa inspeksyon ng raw material hanggang sa final pressure testing — bawat produkto ay dumadaan sa masusing quality chain.
  items:
    - title: Pagsusuri ng Hilaw na Materyal
      description: Bawat roll ng PVC tela ay sinusuri para sa kapal, tensile strength, at UV resistance bago pumasok sa produksyon.
      icon: tabler:search
    - title: QC Habang Proseso
      description: Ang mga weld seam, instalasyon ng valve, at chamber bonds ay iniinspeksyon sa bawat istasyon habang nasa assembly.
      icon: tabler:eye
    - title: Pagsusuri sa Presyon
      description: Bawat inflatable na produkto ay pinapataas sa 1.25x rated PSI at hinahawakan ng 24–48 oras upang matiyak ang air retention at seam integrity.
      icon: tabler:wind
    - title: Pangwakas na Inspeksyon
      description: Bawat yunit ay sinusuri para sa finish, hardware, at packaging bago aprubahan para sa pagpapadala. Ang mga batch sample ay dinadala sa aming laboratoryo para sa destructive testing.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Mga FAQ tungkol sa Bangka
  subtitle: Mga karaniwang tanong tungkol sa aming mga rigid-hull inflatable na bangka.
  columns: 2
  items:
    - title: Anong mga sukat ng RIB bangka ang Aquafarer inaalok?
      description: Nag-aalok kami ng 35 RIB modelo mula 2.5 m hanggang 7.6 m, mula sa compact tenders hanggang heavy-duty commercial at patrol craft. Bawat modelo ay may iba't ibang configuration options.
    - title: Ano ang pagkakaiba ng isang RIB at isang tradisyunal na inflatable na bangka?
      description: Ang RIB A (Rigid-Hull Inflatable Boat) ay pinagsasama ang solid fiberglass o aluminum deep-V hull sa inflatable Hypalon o PVC tubes. Nagbibigay ito ng katatagan at kapasidad ng karga ng isang hard boat na may shock absorption at buoyancy ng inflatable.
    - title: Anong mga engine ang compatible Aquafarer RIBs?
      description: RIBs Sinusuportahan ng aming mga outboard engine mula 3 HP hanggang 250 HP depende sa modelo. Bawat pahina ng produkto ay naglilista ng pinakamataas na rated engine power. Inirerekomenda naming kumonsulta sa iyong dealer para sa perpektong tugma.
    - title: Sertipikado ba kayo Aquafarer RIBs CE ?
      description: Oo. Lahat RIB ng recreational models ay CE sertipikado sa ilalim ng naaangkop na European standards para sa recreational watercraft. Ang commercial at patrol models ay tumutugon sa karagdagang stability at load requirements.
    - title: Ano ang warranty sa RIB mga bangka?
      description: Lahat ay Aquafarer RIBs may 5-taong limitadong warranty sa tube fabric, seams, at hull; mga inflation valve na sakop ng 5 taon; mga aksesorya na naka-install sa pabrika para sa 1 taon.
    - title: Ilan ang mga air chamber Aquafarer RIBs na meron ito?
      description: Mayroon kaming RIBs 3 hanggang 7 independiyenteng air chambers depende sa haba ng modelo. Tinitiyak ng multi-chamber na disenyo na ito na mananatiling lumulutang ang bangka kahit na may isang compartment na nasisira.
faqs_inflatable:
  title: Mga Madalas Itanong tungkol sa Inflatable Boat
  subtitle: Mga karaniwang tanong tungkol sa aming inflatable dinghies, kayaks, at mga bangka.
  columns: 2
  items:
    - title: Anong mga materyales ang ginagamit sa mga Aquafarer inflatable na bangka?
      description: Gumagamit kami ng military-grade PVC (1100 denier) at premium Hypalon/CSM rubber, depende sa modelo. Parehong UVmatatag, lumalaban sa abrasion, at sumusunod sa EU REACH at RoHS mga regulasyon.
    - title: Gaano katagal tumatagal ang mga inflatable na bangka?
      description: Sa tamang pag-aalaga, ang de-kalidad na PVC inflatable na bangka ay tumatagal ng 7–10 taon, habang Hypalon ang mga modelo ay maaaring tumagal ng 15–20 taon. Ang regular na paglilinis, UV proteksyon, at tamang pag-iimbak ay malaki ang naitutulong sa pagpapahaba ng buhay ng serbisyo.
    - title: Anong maintenance ang kailangan para sa inflatable boat?
      description: Kasama sa pangunahing maintenance ang pagbanlaw gamit ang sariwang tubig pagkatapos ng bawat paggamit (lalo na sa alat na tubig), pagpapatuyo bago imbak, pagsusuri ng valve seals taun-taon, at paglalagay UV ng protectant sa mga tubo. Iwasan ang matagal na pagkakalantad sa araw kapag hindi ginagamit.
    - title: Pwede bang gamitin ang inflatable na bangka sa maalat na tubig?
      description: Oo. Lahat ng Aquafarer inflatable na bangka ay dinisenyo para sa parehong paggamit sa sariwang tubig at alat na tubig. Inirerekomenda naming banlawan gamit ang sariwang tubig at patuyuin nang mabuti pagkatapos ng pagkakalantad sa alat upang maiwasan ang kalawang at kristalisasyon ng asin ng tela.
    - title: Paano ko itatago ang inflatable na bangka?
      description: I-deflate, linisin, at patuyuin nang buo ang bangka bago itago. I-roll nang maluwag (iwasan ang masikip na tiklop), itago sa malamig at tuyong lugar na malayo sa direktang sikat ng araw, at iwasan ang sahig na may kongkreto upang maiwasan ang pag-absorb ng moisture.
    - title: Ano ang kapasidad ng bigat ng mga Aquafarer inflatable na bangka?
      description: Ang kapasidad ng timbang ay mula 290 kg para sa aming pinakamaliit na modelo hanggang higit sa 2000 kg para sa mas malalaking komersyal na sasakyan. Bawat pahina ng produkto ay naglilista ng maximum load rating para sa iyong partikular na modelo.
faqs_sup:
  title: SUP Mga FAQ sa Board
  subtitle: Mga karaniwang tanong tungkol sa aming stand-up paddle boards.
  columns: 2
  items:
    - title: Anong SUP mga sukat ng board ang available?
      description: Nag-aalok kami SUP ng mga board mula 9 ft hanggang 12 ft, kabilang ang all-round, touring, yoga, at mga espesyal na disenyo. Kabilang sa aming mga pinakabentang modelo ang Tropical Breeze (10 ft) at Ocean Voyager (11 ft).
    - title: Ano ang drop-stitch konstruksyon?
      description: Drop-stitch Ang konstruksyon ay gumagamit ng libu-libong polyester threads na nag-uugnay sa itaas at ibabang mga layer ng board, na nagpapahintulot dito na hawakan ang mataas na presyon ng hangin (15–20PSI) at makamit ang matibay at matatag na plataporma. Ito ang pamantayan sa industriya para sa premium inflatableSUPs.
    - title: Ano ang limitasyon ng timbang para sa SUP mga board?
      description: SUP Sinusuportahan ng aming mga board ang hanggang 150 kg depende sa modelo at dami. Ang Leviathan Wake board ang aming pinakamataas na kapasidad na modelo, idinisenyo para sa mas malalaking rider at paggamit ng yoga.
    - title: Nag-aalok ba kayo ng kumpletong SUP mga package?
      description: Oo. Bawat SUP board ay may kumpletong package kabilang ang 3-pirasong aluminum paddle, high-pressure hand pump, coil leash, travel backpack, at repair kit. May ilang modelo rin na may kasamang natatanggal na fin set.
    - title: Ano ang warranty sa SUP mga board?
      description: Lahat Aquafarer SUP ng board ay may 2-taong warranty laban sa mga depekto sa paggawa, kabilang ang pagkasira ng tahi, depekto sa balbula, at delamination ng materyal sa normal na paggamit.
    - title: Gaano katagal bago ma-inflate ang SUP isang board?
      description: Gamit ang kasamang hand pump, ang buong inflation sa 15 PSI ay tumatagal ng humigit-kumulang 8–12 minuto. Para sa mas mabilis na inflation, inirerekomenda namin ang Aquafarer aming 12V electric pump, na nagpapa-inflate ng board sa loob ng mas mababa sa 4 na minuto.
