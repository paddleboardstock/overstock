features3_reasons:
  tagline: Bakit Pumili ng Paddle Board Overstock
  title: Pito na Dahilan para Makipagsosyo sa Amin
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Totoong Paggawa, Hindi Pangangalakal
      description: Pag-aari at pinapatakbo namin ang isang pabrika na may sukat na 12,000 m². Kapag bumili ka mula sa Paddle Board Overstock, direktang bumibili ka mula sa mga taong nagdidisenyo, nagdi-engineer, at gumagawa ng iyong board — walang middlemen, walang retail markup.
      icon: tabler:building-factory
    - title: 2. Pamamaraan na Pinangunahan ng Inhinyeriya
      description: Nagsisimula ang aming proseso ng disenyo sa use case, hindi sa kategorya ng produkto. Ina-optimize namin ang hugis ng hull, pagpili ng materyales, at konfigurasyon kung paano aktwal na gagamitin ang board.
      icon: tabler:engine
    - title: 3. Napatunayang Kalidad
      description: Bawat board ay 100% pressure-tested sa 1.25x rated PSI bago ipadala. 99.3% na rate ng depekto — sinusukat sa bawat batch, hindi lang basta inaangkin.
      icon: tabler:shield-check
    - title: 4. Disenyo para sa Paddler
      description: 'Deck art, color series, accessory mounts, at kumpletong package — mga board na dinisenyo para sa totoong pagpaddle: touring, yoga, pangingisda, fitness, at libangan ng pamilya.'
      icon: tabler:swimming
    - title: 5. Pandaigdigang Logistik
      description: Direktang pagpapadala mula sa aming pabrika sa Weihai papunta sa mga paddler sa 50+ bansa, na may kumpletong pagsubaybay at paghawak sa customs.
      icon: tabler:truck-delivery
    - title: 6. Suporta Habambuhay
      description: Sinusuportahan namin ang mga board na ginawa namin noon pa man. Tunay na mga piyesa, teknikal na payo, gabay sa pagkukumpuni — ang aming koponan ay handang gamitin kapag kailangan mo kami.
      icon: tabler:lifebuoy
    - title: 7. Tapat na Mga Espesipikasyon
      description: Tunay na load ratings, tunay na sukat, tunay na timbang. Walang pinalaking marketing. Ang aming inilathala ay iyon ang makukuha mo — pinatunayan ng independiyenteng pagsubok.
      icon: tabler:ruler-measure
testimonials:
  tagline: Pinagkakatiwalaan ng mga Tatak sa Buong Mundo
  title: Ano ang Sinasabi ng Aming mga Kasosyo
  items:
    - content: Dumating ang board ko mula sa pabrika na may lahat ng laman ng kahon. Dalawang season ng lingguhang pag-paddle at perpekto pa rin ang paghawak ng hangin.
      name: — Sarah M., Pambansang Paddler tuwing Katapusan ng Linggo, Florida
    - content: Ikinumpara ko ang specs ng ilang linggo bago bumili.Paddle Board Overstock Ako lang ang brand na naglalathala ng totoong timbang at totoong pressure. Ang nakalista nila ay kung ano ang lumalabas.
      name: — Tomasz K., Paddler sa Paglilibot, Poland
    - content: Buong pamilya na ang nag-paddle ngayon. Nagsimula kami sa isang board at nagtapos sa apat — dahil sa kalidad, madali ang desisyon.
      name: — Angela R., Paddler ng Pamilya, Australia
cta:
  title: Handa ka na bang maranasan ang kaibahan?
  subtitle: Mga tanong tungkol sa sukat, specs, o shipping? Ang aming paddling team ay nagbibigay ng tapat na sagot — walang pressure sa pagbebenta.
  actions:
    - variant: primary
      text: Makipag-usap sa aming team
      href: /contact
    - text: I-download ang kategorya ng produkto
      href: /resources
