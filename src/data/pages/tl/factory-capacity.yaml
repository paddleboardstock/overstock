hero:
  tagline: Kapasidad sa Produksyon
  title: Kapasidad sa Paggawa at Taunang Produksyon
  subtitle: 12,000 m² na pasilidad na gumagawa ng 15,000 bangka bawat taon na may kakayahang magpalawak
intro: Paddle Board Overstock ay nagpapatakbo ng isa sa pinakamalalaking dedikadong pasilidad sa paggawa ng inflatable na bangka sa Qingdao, China. Ang aming 12,000 m² na pabrika ay nakaayos sa anim na espesyal na mga workshop na nagpapatakbo nang sabay-sabay, na nagbibigay sa amin ng kakayahang gumawa ng 15,000 bangka taun-taon sa SUP, kayak, dinghy, RIB, at linya ng kagamitan sa kaligtasan.
highlights:
  - value: 12,000 m²
    label: Kabuuang sahig ng paggawa
    detail: Sa 6 na espesyal na workshop
  - value: 15,000
    label: Mga bangkang nalilikha taun-taon
    detail: SUPs, kayaks, RIBs, dinghies, kagamitan sa kaligtasan
  - value: 200-300
    label: Sanay na manggagawa
    detail: 25+ engineers, 2 shifts/ araw
  - value: 50+
    label: Mga bansang ina-exportan
    detail: EU, US, AU, Gitnang Silangan, Asya
  - value: 30–45
    label: Karaniwang oras sa paggawa (araw)
    detail: Mula sa kumpirmasyon ng PO hanggang sa FOB
  - value: 10+
    label: Taon ng karanasan sa pag-export
    detail: Mula noong 2012
workshops:
  - title: SUP Produksyon ng Board
    description: '4 na parallel na linya ng pagpupulong para sa inflatable na SUP boards. Bawat linya ay kayang gumawa ng 50–80 na boards kada shift. Ang mga istasyon ng digital printing at screen printing ay sabay-sabay na nagpapatakbo. Taunang kapasidad ng SUP: 8,000+ boards.'
    output: 8,000+ SUPs/taon
  - title: RIB Produksyon ng Bangka
    description: 'Dedikadong fiberglass hull workshop na may 6 na istasyon ng hulma para sa RIB hulls hanggang 7.6 m. Ang lugar para sa pagtunaw ng tubo at pagpupulong ay humahawak ng 3–5 RIBs nang sabay. Taunang kapasidad ng RIB: 2,000+ bangka.'
    output: 2,000+ RIBs/taon
  - title: Inflatable na Bangka at Dinghy
    description: 'Multi-purpose na mga linya ng produksyon para sa inflatable na bangka, kayaks, at dinghies. Ang mga istasyon ng hot-air welding, RF dielectric presses, at mga workstations ng pagpupulong ay nire-reconfigure ayon sa kombinasyon ng order. Taunang kapasidad: 5,000+ yunit.'
    output: 5,000+ yunit/taon
  - title: Kagamitan sa Kaligtasan
    description: 'Hiwalay na clean-room na lugar ng produksyon para sa life vests at kagamitan sa kaligtasan. Dedikadong pagtahi, paglagay ng foam, at mga istasyon ng pagsubok. Taunang kapasidad ng life vest: 50,000+ yunit.'
    output: 50,000+ life vests/taon
oem_capacity:
  moq: 'SUP: 5–10 yunit | RIB: 2–5 yunit | Kayak/Dinghy: 10–20 yunit | Custom na hulma: 200+ yunit'
  lead_time: Karaniwang 30–45 araw. Sample 15–20 araw. Available ang rush.
  payment: T/T 30% deposito + 70% bago ipadala. Tinanggap ang L/C, Western Union.
