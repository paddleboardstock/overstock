hero:
  tagline: Kapasidad sa Produksyon
  title: Kapasidad sa Paggawa at Taunang Produksyon
  subtitle: 12,000 m² na pasilidad na gumagawa ng 15,000 tabla kada taon na may espasyo hanggang sa sukat
intro: Paddle Board Overstock nagpapatakbo ng isa sa pinakamalalaking SUP dedikadong pasilidad sa paggawa ng inflatable board sa Weihai, China. Ang aming 12,000 m² na pabrika ay nakaayos sa anim na espesyal na workshop na sabay-sabay na gumagana, na nagbibigay sa amin ng kapasidad na gumawa ng 15,000 board taun-taon sa all-around, touring, at art-series SUP na mga linya.
highlights:
  - value: 12,000 m²
    label: Kabuuang sahig ng paggawa
    detail: Sa 6 na espesyal na workshop
  - value: 15,000
    label: Mga board na ginagawa taun-taon
    detail: Pangkalahatan, touring at serye SUPs ng sining
  - value: 200-300
    label: Sanay na manggagawa
    detail: 25+ engineers, 2 shifts/ araw
  - value: 50+
    label: Mga bansang ina-exportan
    detail: EU, US, AU, Gitnang Silangan, Asya
  - value: 2-3
    label: Mga araw ng trabaho bago ipadala
    detail: Mabilis na umaalis sa Weihai ang mga order na nasa stock
  - value: 10+
    label: Taon ng karanasan sa pag-export
    detail: Mula noong 2012
workshops:
  - title: SUP Produksyon ng Board
    description: '4 na parallel na linya ng pagpupulong para sa inflatable na SUP boards. Bawat linya ay kayang gumawa ng 50–80 na boards kada shift. Ang mga istasyon ng digital printing at screen printing ay sabay-sabay na nagpapatakbo. Taunang kapasidad ng SUP: 8,000+ boards.'
    output: 8,000+ SUPs/taon
  - title: Deck Art at EVA Pagpapaayos
    description: Dedikadong workshop sa pagtatapos para sa art-series decks. Precision EVA cutting, hand-laid deck patterns, at final trim. Saklaw ng taunang kapasidad ang buong hanay ng art-series.
    output: Buong hanay ng art-series
  - title: Drop-Stitch laminasyon
    description: 'Ang heat-lamination lines ay nag-udyok drop-stitch ng core sa outer PVC laminates. Ang rail bands ay triple-layer fusion bonded para sa airtight strength. Taunang kapasidad: 15,000+ cores.'
    output: 15,000+ cores/taon
  - title: Mga Aksesorya at Pag-iimpake
    description: Mga linya ng accessory assembly at packing para sa mga pump, paddle, leash, at repair kit. Ang mga board ay vacuum-packed, boxed, at palletized para sa pandaigdigang pagpapadala.
    output: Kumpletong mga pakete, handa nang ipadala
