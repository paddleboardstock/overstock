who_benefits:
  tagline: Sino ang Maaaring Makinabang
  title: Sino ang Para sa Mixed Model Wholesale
  items:
    - title: Mga Bagong Importer
      description: Sinusubukan ang kategoryang SUP sa pamamagitan ng iba't ibang modelo sa halip na mag-commit sa isang bulk na SKU.
    - title: Mga Seasonal Beach Retailer
      description: Mga tindahan na nangangailangan ng mga beginner board para sa mga turista at premium edition para sa mga lokal — sa parehong restock na order.
    - title: Mga Online na Nagbebenta
      description: Paglilista ng ilang modelo nang sabay-sabay upang malaman kung aling artwork, haba, at kaso ng paggamit ang pinakaepektibo.
    - title: Mga Paupahang Fleet at Paaralan
      description: Mga fleet na nangangailangan ng iba't ibang sukat ng board para sa iba't ibang timbang ng rider at uri ng leksyon, hindi iisang-spec na fleet.
faq_section:
  title: Mga Madalas Itanong tungkol sa Pinagsamang Modelo
  items:
    - q: May minimum ba na dami bawat modelo?
      a: Wala. Ang 5-board minimum ay naaangkop sa kabuuang order, hindi sa bawat modelo. Maaari kang mag-order ng 5 magkakaibang modelo, isang board bawat isa.
    - q: Nagbabago ba ang presyo kapag pinaghahalo ang mga modelo?
      a: Ang presyo ng wholesale unit ay ibinibigay bawat modelo, ngunit ang iyong pricing tier ay bumubuti batay sa kabuuang bilang ng board — ang paghahalo ng mga modelo ay hindi pinaparusahan ka.
    - q: Maaari ko bang paghaluin ang mga board at accessories?
      a: Oo — maaari mong idagdag ang mga extra paddles, pumps, at repair kits sa mixed order. Magtanong sa iyong inquiry.
    - q: Paano ko malalaman kung aling mga modelo ang angkop sa aking merkado?
      a: Magpadala sa amin ng tala tungkol sa iyong mga customer (baybaying-dagat o inland, turista o lokal, baguhan o rider) sa inquiry form at irerekomenda namin ang mix.
