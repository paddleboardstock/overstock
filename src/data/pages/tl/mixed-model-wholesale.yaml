hero:
  tagline: Halo-halong Modelo Wholesale
  title: Halo-halong Modelo ng Wholesale Paddle Boards —<br />Ihalo ang iba't ibang SUP modelo sa isang pagkakasunod-sunod
  subtitle: Bakit i-lock ang budget mo sa isang modelo? Pagsamahin ang anumang SUP in-stock boards — all-around, touring, surf, at art editions — sa isang wholesale order, na may kabuuang 5 boards.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Isang halo-halong order ng iba't ibang SUP inflatable board models mula sa Paddle Board Overstock
direct_answer: Pinapayagan ng mixed model wholesale ang isang maliit na retailer na mag-order ng ilang iba't ibang SUP modelo sa isang pinagsamang padala sa halip na isang bulk na dami ng isang board. Sa Paddle Board Overstock, maaaring pagsamahin ang anumang in-stock na modelo, ang minimum na order ay 5 board sa kabuuan, at ang kabuuang dami ang nagtatakda ng antas ng presyo. Ang mga mixed order ay ipinapadala mula Weihai, China sa pamamagitan ng express air freight (1–3 boards) o consolidated sea freight (5–20 boards) papunta sa 50+ bansa, at bawat board ay 100% pressure-tested at sakop ng 2-Taong SUP Warranty.
tldr_points:
  - Ihalo ang anumang SUP in-stock na modelo sa isang order — walang minimum kada modelo
  - Ang kabuuang dami ng order (hindi per-model na dami) ang nagtatakda ng iyong pricing tier
  - Magsimula sa kabuuang 5 board — ginawa para sa maliliit na retailer, hindi para sa mga container load
  - 'Isang pinagsamang padala: isang gastos sa kargamento, isang customs clearance, isang paghahatid'
why_mixed:
  tagline: Bakit Halo-halo?
  title: Ihalo at i-match. Bumili ng Mas Maraming Variety. Gumastos ng Mas Kaunti.
  subtitle: Ang isang estante ng magkaparehong mga tabla ay nagsisilbi sa isang uri ng paddler. Ang halo-halong order ay nagiging isang buong linya ng produkto ang parehong budget.
  items:
    - title: Mas maraming uri sa iyong estante
      description: Pagsamahin ang all-around boards para sa mga baguhan, touring boards para sa mga adventurer, at surf-style boards para sa mga rider — isang order lang ang sumasaklaw sa buong hanay ng iyong mga customer.
    - title: Mas mababang panganib kada modelo
      description: Sa halip na ipusta ang iyong season sa isang modelo, umorder ng 2–4 bawat isa. Kung ang isang modelo ay mas mabenta kaysa sa iba, i-restock ito sa susunod na order gamit ang totoong sales data.
    - title: Subukan kung ano ang mabebenta sa iyong merkado
      description: Bawat beach, lawa, at lungsod ay may iba't ibang demand. Ang mixed first order ang pinakamurang market research — stock six models, tingnan kung alin ang gagalaw.
    - title: Mas Magandang Margin sa Art Editions
      description: Ang mga premium art-series boards (Leviathan Wake, Medusa Glow, Ocean Voyager) ay may mas mataas na benta. Ihalo ang ilan sa isang base ng all-around boards para mapataas ang iyong karaniwang kita.
    - title: Isang pinagsamang padala
      description: Ang isang mixed order ay nangangahulugang isang freight booking, isang customs clearance, at isang delivery — sa halip na limang hiwalay na padala mula sa limang magkahiwalay na supplier.
how_it_works:
  tagline: Paano Ito Gumagana
  title: Paano Gumagana ang Mixed Model Order
  steps:
    - title: Piliin ang Iyong Halo
      description: Piliin ang mga modelo at dami para sa iyong merkado — o gamitin ang selector sa ibaba upang gumawa ng kombinasyon at makita nang live ang board count at total value update.
    - title: Humiling ng Quote
      description: Ipadala sa amin ang halo-halo. Kinukumpirma namin ang kasalukuyang stock para sa bawat modelo at presyo ng quote unit pati na rin ang express at sea freight options papunta sa iyong bansa.
    - title: Kumpirmahin ang Order
      description: Aprubahan ang huling quote — mga modelo, dami, kargamento, kabuuan. I-lock namin ang stock at isaayos ang pagpapadala mula sa Weihai.
    - title: Sinusuri Namin ang Bawat Board
      description: Bawat board sa iyong pinaghalong order ay 100% na nasusubok sa presyon hanggang 15 PSI bago i-pack — parehas na pamantayan para sa bawat modelo, maging ito man ay entry-level all-arounder o art edition.
    - title: Isang Paghahatid sa Iyong Pinto
      description: Ang buong pinaghalong order ay ipinapadala nang sabay — express air para sa maliliit na order, pinagsamang sea freight para sa 5–20 board — na may door-to-door tracking.
