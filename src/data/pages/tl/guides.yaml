hero:
  tagline: Mga Gabay
  title: Bago sa SUP?
  subtitle: Mga praktikal na gabay para tulungan kang pumili, gumamit, at masiyahan sa inflatable na kagamitan sa water sports.
size_guide:
  tagline: Sukat at Mga Tiyak
  title: Hanapin ang Tamang Sukat para sa Iyong Pangangailangan
  desc: Ihambing ang mga dimensyon ng produkto, kapasidad ng timbang, at mga inirerekomendang paggamit. Kahit kailangan mo man ng touring SUP, isang compact na kayak, o isang commercial RIB — tinutulungan ka ng aming size guide na pumili ng tamang sukat.
  link_label: Buong gabay sa sukat na may mga detalye ng produkto →
  link: /size-guide
  cards:
    - title: SUP Mga Board
      desc: Pumili ng haba base sa iyong timbang at nakalaang paggamit. Mas malapad na boards (32"+) ay nagbibigay ng mas higit na katatagan. Mas mahahabang boards (11–12 ft) ay mas mahusay sa tracking para sa touring.
    - title: Mga Kayak
      desc: Single kayaks (9 ft) para sa solo na paglalakbay at mga ilog. Tandem kayaks (12 ft) para sa dalawang paddler o isa na may kagamitan. Laging suriin ang kapasidad ng timbang.
    - title: Mga Dinghy at RIBs
      desc: Pumili ng haba ayon sa bilang ng pasahero at paggamit. Mas malalaking RIBs (4.5 m+) para sa offshore at rescue. Mas maliliit na dinghy (2.7 m) bilang tenders at plataporma sa pangingisda.
