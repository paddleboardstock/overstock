hero:
  tagline: Mga Gabay
  title: Bago sa SUP?
  subtitle: Mga praktikal na gabay para tulungan kang pumili, gumamit, at masiyahan sa inflatable na kagamitan sa water sports.
size_guide:
  tagline: Sukat at Mga Tiyak
  title: Hanapin ang Tamang Sukat para sa Iyong Pangangailangan
  desc: Ihambing ang mga sukat ng board, kapasidad ng timbang, at inirekomendang gamit. Kung gusto mo man ng matatag na all-around board o mas mabilis na touring na hugis — tutulong sa iyo ang aming gabay sa sukat na piliin ang tamang akma.
  link_label: Buong gabay sa sukat na may mga detalye ng produkto →
  link: /size-guide
  cards:
    - title: All-Around SUP Mga Board
      desc: Ang aming ~11 ft boards (32" ang lapad) ay nagbabalanse ng stability, bilis, at kapasidad. Ang 6-inch drop-stitch core sa 15 ay PSI nagpapanatiling matibay ang deck para sa mga paddler sa lahat ng antas.
    - title: Lapad at Katatagan
      desc: Mas malapad na mga board (32"+) ay nagbibigay ng mas maraming katatagan para sa mga nagsisimula, yoga, at pangingisda. Ang 6-inch na kapal ay nagbibigay ng tigas at kapasidad sa timbang para sa mananakay pati na rin sa kagamitan.
    - title: Mga Pakete at Kagamitan
      desc: Bawat board ay ipinapadala bilang kumpletong pakete — board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, at repair kit. Suriin ang maximum na load para sa rider kasama ang kagamitan.
