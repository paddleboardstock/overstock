testimonial:
  quote: Tiningnan ko ang pressure-test log na kasama ng board ko at nag-email ako sa support ng dalawang tanong tungkol sa inflation sa init ng tag-init. Sumagot sila gamit ang totoong numero sa parehong araw. Mas marami pa iyon kaysa sa anumang shop na nagawa para sa akin.
  author: Sofia Marchetti
  title: Berypikadong mamimili
  company: Pangpang na nagpa-paddle
  location: Italya
content_overpressure:
  tagline: Kaligtasan sa Presyon
  title: presyon ng board<br />Pamamahala sa Mainit na Klima
  subtitle: Tumataas ang presyon ng inflatable board kasabay ng temperatura. Ang pag-unawa at pamamahala ng overpressure ay nagpoprotekta sa iyong board at pinananatiling ligtas ang bawat session.
  items:
    - title: Bakit Tumataas ang Presyon
      description: Lumalaki ang hangin kapag init. Ang board na pinalobo sa 15 PSI sa 20°C ay kayang umakyat ng 1-2 PSI sa 40°C na sikat ng araw — ang parehong pisika na nagpapatibay sa malamig na morning board pagsapit ng tanghali.
      icon: tabler:gauge
    - title: Inirerekomendang Presyon sa Operasyon
      description: I-inflate sa 12-15, PSI ayon sa naka-print malapit sa balbula. Ang rated range ay nagbabalanse ng tigas, kaligtasan, at seam life — mas marami ay hindi mas maganda.
      icon: tabler:chart-bar
    - title: Pinakamahusay na Mga Kasanayan sa Mainit na Klima
      description: I-inflate hanggang sa pinakamababang bahagi ng range kapag mainit ang araw. Maglabas ng kaunting hangin bago ang matagal na sikat ng araw at huwag iwanan ang fully inflated board na nagba-luto sa tabing-dagat.
      icon: tabler:sun
    - title: Pagkakalantad at Imbakan sa Araw
      description: Itago ang mga tabla na may lilim at bahagyang na-deflate kapag hindi ginagamit. Gumamit ng board bag para sa UV proteksyon. Banlawan at patuyuin bago i-roll para sa imbakan.
      icon: tabler:umbrella
    - title: Kung ang board ay parang matigas na bato
      description: Pakawalan ang hangin sa pamamagitan ng balbula hanggang bumalik ang board sa rated range. Dalhin ang gauge sa iyong pump para sa tumpak na readings — kapag sobra ang pag-inflate ng board, hindi kailangan ang mga seam.
      icon: tabler:alert-circle
