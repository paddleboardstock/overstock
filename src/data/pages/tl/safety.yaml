certifications:
  - title: CE Sertipikasyon (EU 2016/425)
    standard: PPE Regulation (EU) 2016/425 | EN ISO 12402
    description: Lahat ng Aquafarer kagamitan sa kaligtasan ay sumusunod sa CE mga kinakailangan sa pagmamarka sa ilalim ng European Personal Protective Equipment Regulation. Bawat produkto ay independiyenteng sinusuri ng TÜV Rheinland, isang European Notified Body. Ang aming mga inflatable na bangka ay RIBs sumusunod sa mga kinakailangan ng Recreational Craft Directive 2013/53/EU (RCD) Category C at D.
    body: CE Saklaw ng sertipikasyon ang mahahalagang pangangailangan sa kalusugan at kaligtasan para sa personal flotation devices at inflatable watercraft.TÜV Taun-taon na ina-audit ng Rheinland ang aming pasilidad ng produksyon upang tiyakin ang patuloy na pagsunod.
  - title: SOLAS — Kaligtasan ng Buhay sa Dagat
    standard: SOLAS Kabanata III | LSA Code
    description: Ang Life Vest Pro ay sumusunod SOLAS sa mga regulasyon para sa offshore at komersyal na operasyon sa dagat. Sinubukan para sa 24-oras na pagpapanatili ng buoyancy, awtomatikong pag-inflate sa paglubog, at pagganap sa mga estado ng dagat hanggang Force 5. Tumutugon sa mga kinakailangan ng Kabanata III para sa mga lifejacket sa mga komersyal na sasakyang-dagat.
    body: Ang SOLAS pag-apruba ay nangangailangan ng independiyenteng pagsusuri mula sa notified body para sa buoyancy, lakas, visibility, at awtomatikong activation. Ang aming Life Vest Pro ay may buong SOLAS type approval na may MED certification.
  - title: USCG Uri III / Uri V
    standard: 46 CFR Bahagi 160 |USCG Pag-apruba
    description: Ang mga piling Aquafarer life vest ay sumusunod sa klasipikasyon ng United States Coast Guard para sa Type III (flotation aid) at Type V (espesyal na gamit) na mga aparato. Angkop para sa mga ligtas na tubig, coastal cruising, at mga komersyal na operasyon na nangangailangan USCGng -aprubadong PFDs.
    body: USCG ang pag-apruba ay nangangailangan ng pagsusuri mula sa isang independiyenteng laboratoryo na kinikilala ng CG. Kasama sa Type V approval ang mga hybrid inflatable na disenyo na nangangailangan ng manual o awtomatikong activation.
  - title: BSCI panlipunang pagsunod
    standard: BSCI Amfori Kodigo ng Pag-uugali
    description: Ang aming pabrika ay ina-audit taun-taon sa ilalim ng amfori Business Social Compliance Initiative (BSCI). Ito ay nagpapatunay ng etikal na mga gawi sa paggawa, kaligtasan sa lugar ng trabaho, patas na oras ng trabaho, at pamamahala sa kapaligiran sa aming 12,000 m² na pasilidad ng produksyon.
    body: ang BSCI pagsunod ay isang kinakailangan para sa mga retailer at importer sa Europa. Ang aming kasalukuyang BSCI rating ay "C" (Mabuti), na inaudit ng SGS.
  - title: REACH & RoHS Pagsunod
    standard: REACH Regulasyon ng EU (EC) 1907/2006 |RoHS Direktiba 2011/65/EU
    description: Lahat PVC ng compound, pandikit, at coating na ginagamit sa Aquafarer mga produkto ay sumusunod sa REACH mga regulasyon ng EU sa kaligtasan ng kemikal at RoHS mga restriksyon sa mapanganib na sangkap. May mga material safety data sheet (MSDS) para sa bawat linya ng produkto.
    body: REACH Tinitiyak ng pagsunod na walang restricted SVHC substances na lampas sa threshold limit. Regular na third-party lab testing ang nagbe-verify ng tuloy-tuloy na compliance para sa bawat batch ng produksyon.
  - title: ISO 9001:2015 Pamamahala ng Kalidad
    standard: ISO 9001:2015 |TÜV Rheinland Certified
    description: Ang aming quality management system ay ISO 9001:2015 certified ng TÜV Rheinland, na sumasaklaw sa disenyo, produksyon, testing, at after-sales service. Tinitiyak ng taunang surveillance audit ang tuloy-tuloy na pagpapabuti at kontrol sa proseso.
    body: Ang ISO sertipikasyon ng 9001 ay nangangailangan ng dokumentadong mga patakaran sa kalidad, panloob na audit, pagsusuri sa pamamahala, mga pamamaraan ng pagwawasto, at mga talaan ng produksyon na masubaybayan.
testimonial:
  quote: Kumuha kami ng safety equipment mula sa iba't ibang supplier sa buong Asia.Aquafarer ay ang tanging manufacturer na nagbigay ng kumpletong CE dokumentasyon, SOLAS sertipiko, at third-party test reports nang maaga — nang hindi hinihingi.
  author: Erik Lindström
  title: Opisyal ng Kaligtasan
  company: Suplay ng Baltic Marine
  location: Finland
content_overpressure:
  tagline: Kaligtasan sa Sobrang Presyon
  title: RIB presyon ng tubo<br />Pamamahala sa Mainit na Klima
  subtitle: Ang inflatable tube pressure ay tumataas kasabay ng temperatura. Ang pag-unawa at pamamahala ng overpressure ay nakakaiwas sa pinsala at nagsisiguro ng ligtas na operasyon sa tropikal at disyertong kapaligiran.
  items:
    - title: Mga Balbula ng Pagpapalabas ng Presyon ng Boyle
      description: Aquafarer RIB Ang mga tubo ay nilagyan ng overpressure relief valves na awtomatikong naglalabas ng sobrang presyon lampas sa rated maximum. Pinipigilan ang seam stress at posibleng pagputok ng tubo mula sa solar heating.
      icon: tabler:gauge
    - title: Pagbabago ng Presyon mula umaga hanggang tanghali
      description: Ang tubo na pinalaki sa 3.5 PSI sa 20C ay maaaring umabot ng 4.5+ PSI sa 40C na exposure sa araw. Laging i-inflate hanggang sa mababang bahagi ng inirerekomendang saklaw sa mainit na klima at hayaang kontrolin ng relief valve ang sobrang presyon.
      icon: tabler:sun
    - title: Inirerekomendang Presyon sa Operasyon
      description: 'mga PVC tubo: 3.0-3.5 PSI operasyon, 4.5 PSI max. Hypalon tubo: 3.5-4.0 PSI operasyon, 5.0 PSI max. Laging subukan sa 1.25x rated (4.4 PSI para saPVC, 5.0 PSI para sa Hypalon) ayon sa Aquafarer QC standards.'
      icon: tabler:chart-bar
    - title: Pinakamahusay na Mga Kasanayan sa Pagkakalantad sa Araw
      description: Itago RIBs sa mga lilim na lugar kapag hindi ginagamit. Gumamit UVng mga proteksiyon na takip para sa mahabang pag-angkla. Suriin at ayusin ang presyon ng tubo bago at pagkatapos ng mga oras ng araw na pinakamataas ang araw. Huwag kailanman lumampas sa pinakamataas na rated pressure.
      icon: tabler:umbrella
    - title: emerhensiyang depressurization
      description: Kung masyadong matigas ang tubo o nag-vent ang relief valve, maglabas ng hangin sa pamamagitan ng Halkey-Roberts o military valve hanggang bumalik ang pressure sa operating range. Magdala ng pressure gauge para sa tumpak na readings.
      icon: tabler:alert-circle
