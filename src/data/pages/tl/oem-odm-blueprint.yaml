process_steps:
  title: 6-Hakbang OEM/ODM Proseso
  subtitle: Mula sa design brief hanggang sa FOB Qingdao — isang streamline na workflow
  steps:
    - number: '01'
      title: Design Brief at 3D CAD Modeling
      description: Ibahagi ang iyong target specs, reference na produkto, o konsepto. Ang aming engineering team ay gumagawa ng detalyadong CAD drawings at 3D renderings para sa iyong pag-apruba.
      timeline: 3–5 araw
    - number: '02'
      title: Pagpili ng Materyal at Pagsusuri ng Tela
      description: Pumili mula sa military-grade PVC (0.9–1.2 mm), Hypalon CSM, o drop-stitch core fabrics. Ginagawa namin ang tensile strength, coating adhesion, at UV stability tests.
      timeline: 2–3 araw
    - number: '03'
      title: Mabilis na Prototyping at Produksyon ng Sample
      description: Kami ay gumagamit ng CNC-machine para sa custom molds at gumagawa ng pre-production samples gamit ang kulay ng iyong brand, logo, at tinukoy na materyales. Ipinapadala ang mga sample para sa iyong pag-apruba.
      timeline: 7–14 na araw
    - number: '04'
      title: 24–48 Oras na High-Pressure Hold Test
      description: Bawat prototype ay sumasailalim sa masusing pressure retention testing sa 1.25x rated pressure. Ginagawa rin ang seam peel tests at dimensional verification.
      timeline: 1–2 araw
    - number: '05'
      title: CE/ISO Pagsusuri ng Kalidad at Pag-iimpake
      description: 100-point na checklist ng kalidad. Ang bawat yunit ay sinusuri bago ilagay sa retail-ready na packaging. Kasama ang CE deklarasyon ng pagsunod at BSCI ulat ng pagsunod.
      timeline: 2–3 araw
    - number: '06'
      title: FOB Qingdao Pagpapadala at Logistika
      description: Ang natapos na mga produkto ay inilalagay sa pallet, binabalot ng shrink wrap, at inilalagay sa container sa Qingdao port. Kumpleto ang dokumentasyon para sa export, customs clearance, at real-time tracking.
      timeline: 7–14 na araw
