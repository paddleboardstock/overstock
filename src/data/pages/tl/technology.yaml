  title: Gawa para sa Pagganap
  subtitle: Bawat Paddle Board Overstock board ay ginawa gamit ang eksaktong materyales at pamamaraan sa konstruksyon na sinubok para sa marine na kapaligiran. 12,000 m² R&D center na may sariling prototyping sa loob ng kumpanya.
