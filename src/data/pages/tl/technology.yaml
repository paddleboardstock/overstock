testimonial:
  quote: Ang nagpapakilala sa Paddle Board Overstock ay ang kanilang agham sa materyal. Hindi lang sila nagtitipon ng mga bahagi — dinidisenyo nila ang PVC compounds, weld parameters, at structural layup sa loob mismo ng kumpanya. Ang vertical integration na ito ay makikita sa huling produkto.
  author: David Park
  title: Tagapangasiwa ng Pag-unlad ng Produkto
  company: Bluewater Sports Equipment
  location: Australia
sections:
  - title: Drop-Stitch Core
    standard: 12-15 PSI operating pressure
    description: Libu-libong internal polyester threads ang nag-uugnay sa itaas at ilalim na mga layer, lumilikha ng matibay na estruktura sa 12-15 PSI. Ito rin ang teknolohiyang ginagamit sa propesyonal na paddle boards at inflatable racing boats. Ang aming drop-stitch density ay iniaayon sa bawat modelo para sa perpektong balanse ng rigidity at timbang.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Diagram ng Core
  - title: Marine-Grade PVC
    standard: Fusion-welded | UV / saltwater / abrasion tested
    description: Multi-layer laminated PVC na tela na angkop para sa marine na kapaligiran. Bawat layer ay fusion-welded at hindi pinapapaste, inaalis ang panganib ng delamination. Sinubok para sa UV resistance (ASTM G154, 1,000+ oras), kaagnasan sa saltwater (ISO 9227), at abrasion (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Patong
  - title: Hypalon Mga Tubo
    standard: CSM rubber | UV / chemical / extreme-temp resistant
    description: Ginagamit sa mga RIB na modelo, ang Hypalon (CSM) rubber ay nagbibigay ng higit na UV at chemical resistance kumpara sa karaniwang PVC. Ang Hypalon tubes ay nananatiling flexible sa matinding temperatura at lumalaban sa pagkasira mula sa exposure sa fuel at langis. Lahat ng tahi ay kamay na inilalagay ng mga sertipikadong tekniko.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Air Deck Floor
    standard: Mataas na presyon na inflatable | Pumapalit sa playwud/aluminum
    description: Mataas na presyon na inflatable na sistema ng sahig na pumapalit sa tradisyonal na playwud o aluminum na slat na sahig. Binabawasan ang oras ng pag-set up, kabuuang bigat, at dami ng imbakan habang nagbibigay ng sapat na katigasan para sa pagtayo, pangingisda, at paglalakad. Sinubok upang suportahan ang 200+ kg na pantay-pantay na karga.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Air Deck
