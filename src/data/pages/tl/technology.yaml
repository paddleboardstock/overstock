testimonial:
  quote: Ang nag-convince sa akin ay ang konstruksyon. Fusion-welded seams imbes na glue, drop-stitch core na matibay sa 15, PSI at walang wobble kapag umatras ako para mag-turn. Dalawang taon na, walang problema.
  author: Marta Keller
  title: Berypikadong mamimili
  company: Tagapag-paddle ng paglalakbay sa lawa
  location: Alemanya
sections:
  - title: Drop-Stitch Puso
    standard: 12-15 PSI na presyon sa operasyon
    description: Libu-libong internal polyester threads ang nag-uugnay sa itaas at ibabang mga layer, na lumilikha ng matibay na estruktura sa 12-15. PSI Ito ang parehong teknolohiya na ginagamit sa mga propesyonal na paddle board. Ang drop-stitch aming densidad ay na-optimize kada modelo para sa perpektong balanse ng tigas at bigat.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Diagram ng Core
  - title: antas PVC ng marino
    standard: Fusion-welded |UV / saltwater / abrasion tested
    description: Multi-layer laminated PVC na tela na rated para sa marine environments. Bawat layer ay fusion-welded imbes na idikit, na nag-aalis ng panganib sa delamination. Sinuri para sa UV resistensya (1,000+ oras), kalawang sa alat ng tubig, at abrasion.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Patong
  - title: EVA Sistema ng Deck
    standard: Mahigpit, komportable, mga disenyo ng art-series
    description: Ang full-deck EVA foam ay nagbibigay ng kapit, cushioning, at ang signature art-series na itsura. Ang mga panel na may precision cut ay nakalagay sa seamless na pattern — walang printed graphics na kailangang tanggalin, hindi na kailangan ng wax.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Deck
  - title: Triple-Layer na Sistema ng Riles
    standard: Pinagsamang natali | Sobra ang tibay sa pinakamaraming stress na bahagi
    description: Ang mga rail bands ay triple-layer na pinagsamang natali at binalot sa gilid ng board — ang pinakamaraming stress na bahagi sa anumang inflatable. Dito unang pumapalya ang mga murang board; ang sa amin ay sobra ang tibay.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistema ng Rail
