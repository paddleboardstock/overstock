  subtitle: Bawat Paddle Board Overstock na board ay dinisenyo gamit ang eksaktong materyales at mga paraan ng konstruksyon na nasubok para sa marine na kapaligiran. 12,000 m² sentro ng R&D na may in-house na prototyping.
