rd_services:
  tagline: Custom na R&D
  title: Serbisyo ng R&D para sa Mga Kasosyo
  services:
    - title: Custom na Pag-develop ng Materyal
      desc: Nag-develop kami ng custom na mga pormulasyon ng tela, laminate stacks, at mga sistema ng adhesive na naaangkop sa iyong kapaligiran sa operasyon at mga target na pagganap.
    - title: OEM / ODM Pag-engineer ng Produkto
      desc: Mula sa mga sketch ng konsepto hanggang sa mga production-ready na package ng engineering — ang aming koponan ay maaaring magdisenyo, gumawa ng prototype, at magpatingin ng mga bangka sa ilalim ng iyong tatak.
    - title: Third-Party Testing at Sertipikasyon
      desc: Gamitin ang aming mga pasilidad na sumusunod sa ISO para sa independenteng pagsusuri ng materyal, pagpapatunay ng produkto, at suporta sa sertipikasyon.
  cta: Talakayin ang iyong mga pangangailangan sa R&D →
  cta_link: /contact
vision:
  tagline: Ang aming Bisyon
  title: Hinuhubog ang Kinabukasan ng mga Palakasan sa Tubig
  body: Paddle Board Overstock ay nagsusumikap na manguna sa industriya ng inflatable boat at SUP sa pamamagitan ng patuloy na inobasyon, matatag na kalidad, at matibay na pangako sa kaligtasan at pagpapanatili — sa huli ay pinayayaman ang karanasan ng mga mahilig sa water sports sa buong mundo. Ang Paddle Board Overstock R&D Center ay kung saan nagtatagpo ang passion at inobasyon, nagtatakda ng mga bagong pamantayan para sa industriya ng water sports.
labs_section:
  tagline: Mga laboratoryo
  title: Aming Mga Laboratoryo
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC Pabrika ng Tela
      description: Patuloy na pagsasaliksik at pagsusuri ng mga tela ng tubo na PVC at Hypalon para sa lakas ng hinihila, UV na paglaban, pagsusuot, at kakayahang yumuko sa mababang temperatura upang matiyak ang pangmatagalang pagiging maaasahan sa mga pangkalikasang-dagat na kapaligiran.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Hull Engineering Studio
      description: Disenyong pinapagana ng CAD at pagsusuri gamit ang finite element ng mga katawan ng HDPE, aluminyo, at fiberglass. Bawat katawan ay digitál na sinasaisip para sa pamamahagi ng stress at pagtutol sa epekto bago ginawa ang unang prototype.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF Welding Center
      description: Nakatuong pasilidad para sa radio-frequency welding na may tumpak na kontrol sa temperatura at presyon, na gumagawa ng mataas na lakas, selyadong tahi na tumutugon sa pamantayan ng industriya ng dagat para sa mga inflatable na sasakyan.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Tangke ng Pagsubok ng Hydrodynamic
      description: Pagsubok ng sukat-na-modelo sa aming sariling tangke ng pagsubok upang i-optimize ang anyo ng katawan ng barko, pagganap sa pagplaning, katatagan, at kahusayan sa fuel sa iba't ibang saklaw ng karga at kondisyon ng dagat.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Pagawaan ng Prototype
      description: Pasilidad para sa buong-scale na prototyping at rigging kung saan binubuo, tinatambalan, at sinusubok sa dagat ang mga bagong modelo. Bawat prototype ay sumasailalim sa minimum na 20-oras na pagsusuri sa tubig bago aprubahan para sa produksyon.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Laboratoryo ng Kalidad at Inspeksyon
      description: Nakatuon na laboratoryo ng pagsusuri ng kalidad na nagsasagawa ng tensile testing, air-retention cycling, seam peel tests, at sertipikasyon ng materyal upang matiyak na bawat bangka na umaalis sa workshop ay nakakatugon sa aming inilathalang mga espesipikasyon.
      href: /randdcenter/quality-inspection-lab
