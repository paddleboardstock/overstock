hero:
  tagline: Sentro ng Pananaliksik at Pagpapaunlad
  title: Sentro ng R & D
  subtitle: Nakatuon sa Pag-unlad
intro:
  - Ang Research and Development (R&D) Center ng Paddle Board Overstock ay ang puwersang nagtutulak sa aming misyon na baguhin ang kagamitan sa sports sa tubig. Pinapalakas namin ang mga mahihilig sa sports sa tubig sa buong mundo sa pamamagitan ng ligtas, mas kumportable, at mas kasiya-siyang mga produkto sa pamamagitan ng walang tigil na inobasyon sa mga inflatable stand-up paddle board (SUPs) at mga bangka. Ang aming dedikadong koponan ng mga inhinyero, designer, at mga masugid na eksperto sa sports sa tubig ay humuhubog sa hinaharap ng industriya, na patuloy na nagtataas ng pamantayan para sa kalidad, pagganap, at pagpapanatili.
  - Pinag-iisa ng aming pasilidad sa R&D ang mga siyentipiko sa materyales, arkitekto ng barko, at mga inhinyero sa produksyon sa iisang bubong. Mula sa pagbuo ng pormulasyon ng tela at simulasyon ng hull hanggang sa pagpapaunlad ng proseso ng welding at buong-scale na mga pagsubok sa dagat, bawat yugto ng pag-unlad ng produkto ay pinatatakbo ng datos at pinapatunayan sa pamamagitan ng pagsusuri.
mission:
  tagline: Ang Aming Misyon
  title: Nagpapakabago ng Kinabukasan ng mga Palakasan sa Tubig
  pillars:
    - icon: lightning
      title: Pag-unlad ng Teknolohiya
      desc: Nangunguna sa mga bagong materyales, disenyo, at pagmamanupaktura para sa mas mahusay na pagganap at tibay ng produkto.
    - icon: design
      title: Disenyong Nakatuon sa Gumagamit
      desc: Malalim na nauunawaan at nalalampasan ang mga pangangailangan ng gumagamit sa pamamagitan ng ergonomiko at madaling gamitin na disenyo ng produkto.
    - icon: globe
      title: Napapanatiling Mga Gawi
      desc: Pagpapaliit ng aming bakas sa kapaligiran sa pamamagitan ng paggamit ng mga materyales at proseso na eco-friendly.
    - icon: shield
      title: Hindi Matitinag na Kaligtasan
      desc: Tinitiyak ang pinakamataas na pamantayan ng kaligtasan sa pamamagitan ng masusing pagsubok at sertipikasyon.
pillars:
  - title: Pag-unlad ng Teknolohiya
    desc: Pangunahin ang mga bagong materyales, disenyo, at proseso ng paggawa upang maghatid ng mas mahusay na pagganap at tibay ng produkto.
    icon: tech
  - title: Mga Advanced na Materyales
    desc: Nagsusuri ng makabagong PVC, Hypalon, mga komposit, at mga napapanatiling alternatibo para sa pinahusay na katangian ng produkto.
    icon: materials
  - title: Pagpapanatili
    desc: 'Isang Pangunahing Paninindigan: Kami ay nakatuon sa pangangalaga sa kapaligiran sa pamamagitan ng napapanatiling pagmamanupaktura at mga materyales na maaaring i-recycle.'
    icon: sustainability
capabilities:
  tagline: Mga Kakayahan
  title: Kakayahan sa R&D
  subtitle: Apat na pangunahing disiplina na nagbibigay sa atin ng ganap na kontrol sa pagpapaunlad ng produkto — mula sa pananaliksik ng hilaw na materyales hanggang sa huling sertipikasyon.
  groups:
    - title: Agham ng Materyal at Teknolohiya ng Tela
      items:
        - Pagsusuri at optimal na pagbuo ng PVC at Hypalon
        - UV pagpapatatag, flame retardancy, at pag-unlad ng anti-microbial na additive
        - Multi-layer na tela lamination at inhenyeriyang pandikit
        - Pagsubok sa pinabilis na pagtanda (UV, thermal, halumigmig, spray ng asin)
    - title: Inhinyeriyang Pantuklap at Hidrodyinamika
      items:
        - Parametrikong 3D na disenyo ng katawan at optimisasyon ng CFD
        - Pagsusuri ng finite element para sa mga istruktural at impact na karga
        - Pagsusuri ng scale-model sa towing tank at pagpapatunay ng pagganap
        - Pag-develop ng custom na hull para sa mga espesyal na profayl ng misyon
    - title: Teknolohiya sa Pagsasama at Paghihinang
      items:
        - Pag-develop at pag-optimize ng proseso ng RF dielectric welding
        - Pamamaraan ng hot-air, hot-wedge, at ultrasonic welding
        - Pagkilala sa adhesive bonding at seam tape
        - Pagmomodelo ng lakas ng hinang at prediksyon ng haba ng buhay
    - title: Pagsusuri, Sertipikasyon at Pagsunod
      items:
        - Pamamahala ng kalidad at pagsubok sa pagsunod sa CE
        - Independenteng pagsusuri at suporta ng sertipikasyon
        - Pag-develop ng espesyal na protocol sa pagsusuri para sa kwalipikasyon ng pagbili
        - Pagsusuri ng pagkabigo sa serbisyo at imbestigasyon ng ugat na sanhi
