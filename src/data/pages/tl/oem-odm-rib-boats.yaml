comparison_matrix:
  title: OEM vs. ODM — Aling Modelo ang Akma sa Iyong Proyekto?
  subtitle: Apat na paraan ng pakikipagtulungan, bawat isa ay may iba't ibang antas ng pakikilahok ng pabrika at kontrol ng tatak
  columns:
    - header: Paraan ng Pakikipagtulungan
    - header: Tungkulin Mo sa Brand
    - header: Paddle Board Overstock Papel
  rows:
    - option: OEM Paggawa
      standard: Magbigay ng tatak, mga espesipikasyon, at mga kinakailangan sa pagsunod
      premium: Ipatayo ayon sa iyong espesipikasyon gamit ang aming umiiral na mga hulma at linya ng produksyon
    - option: ODM Pag-aangkop
      standard: Pumili ng base na modelo, i-customize ang mga tampok at branding
      premium: Iangkop ang napatunayang RIB platforma sa iyong nais na mga pagbabago
    - option: Semi-Custom RIB
      standard: Tukuyin ang haba ng katawan ng barko, materyal ng tubo, disenyo ng deck, at kagamitan
      premium: Baguhin ang umiiral na katawan ng barko gamit ang pasadyang konfigurasyon ng tubo at plano ng deck
    - option: Ganap na Pasadyang Pag-unlad
      standard: Magbigay ng konsepto at mga kinakailangan sa target na merkado
      premium: Disenyo mula sa simula — pasadyang hull, amag, at kumpletong dokumentasyon
content_customization:
  tagline: Ano ang Maaaring Ipasadya
  title: RIB Pagpapasadya<br />Mga Opsyon
  subtitle: Bawat elemento ng RIB bangka ay maaaring iangkop sa iyong aplikasyon, merkado, at mga kinakailangan sa brand.
  items:
    - title: Hull at Estruktural
      description: Haba ng hull (2.5–8.5 m), materyal ng hull (GRP fiberglass o marine-grade aluminum), kulay ng hull (gelcoat o pininturahan), profile ng kilikili (deep-V, moderate-V, flat), uri ng transom (closed transom na may bracket o well), at estrukturang pagpapalakas para sa mga komersyal na pangangailangan sa karga.
      icon: tabler:sailboat
    - title: Tubo at Kwelyo
      description: Materyal ng tubo (0.9–1.2 mm PVC o 1.4–1.7 mm Hypalon/CSM), diameter ng tubo (40–55 cm), bilang ng mga chamber (3–7), uri ng balbula (Halkey-Roberts, Leafield D7, o Boston), kulay ng tubo (standard o pasadya), at konfigurasyon ng tatak/kono ng kwelyo.
      icon: tabler:circle
    - title: Layout ng Deck at Console
      description: Center console, side console, o tiller steering. Layout ng upuan (jockey seats, bench seats, bolster seats). Takip ng deck (EVA foam teak-look, non-slip paint, o kaluwagang GRP). Mga puntos ng pagkabit ng kagamitan, grab rails, at mga posisyon ng D-ring.
      icon: tabler:layout-dashboard
    - title: Elektrikal at Nabigasyon
      description: Mga ilaw sa nabigasyon (LED), sistema ng bilge pump, pamamahala ng baterya, pag-install ng VHF radio, GPS/chartplotter mounting, USB charging ports, at konfigurasyon ng switch panel.
      icon: tabler:bolt
    - title: Branding at Graphics
      description: Hull at tube graphics (screen printing, heat transfer, UV digital printing), posisyon ng logo, pasadyang scheme ng kulay, mga marka ng pagkakakilanlan, at pasadyang dokumentasyon para sa may-ari na may iyong brand.
      icon: tabler:palette
    - title: Kaligtasan at Pagsunod
      description: Rating ng kategorya ng disenyo (A/B/C/D ayon sa RCD), sistema ng pagsugpo ng sunog, espesipikasyon ng sistema ng gasolina (portable tank, fixed tank, ilalim-deck), at pakete ng dokumentasyon ng pagsunod para sa iyong target na merkado.
      icon: tabler:shield
content_applications:
  tagline: Mga Config ng Aplikasyon
  title: RIB Configurations<br />Ayon sa Aplikasyon
  subtitle: Iba't ibang misyon ay nangangailangan ng iba't ibang konfigurasyon. Narito ang mga napatunayang setup para sa mga pinakakaraniwang RIB aplikasyon.
  items:
    - title: Rescue at Patrol
      description: Deep-V hull, Hypalon tubes, self-bailing deck, bolster seats, grab handles, navigation lights, at heavy-duty D-rings. RCD Design Category B o C. Fire-resistant fuel system at commercial-grade na elektrikal.
      icon: tabler:lifebuoy
    - title: Suporta sa Pagsisid
      description: Malawak na kaliwang bahagi, hagdan sa likod, posisyon ng tank rack, karagdagang D-rings, dive flag mount, pinatibay na transom para sa twin outboards, at non-slip full-deck EVA covering.
      icon: tabler:mask
    - title: Turismo at Komersyal
      description: Layout na sertipikado para sa pasahero na may bench seating, sunshade/Bimini, grab rails, dry storage, at dual battery system. RCD Category C. Dinisenyo para sa operasyon ng resort at charter fleet.
      icon: tabler:beach
    - title: Pangingisda
      description: Bukas na layout ng deck, posisyon ng rod holder, live bait well, fish finder mount, trolling motor mount, pinatibay na transom, at portable fuel system. Mga opsyon para sa center console o side console.
      icon: tabler:fish
    - title: Libangan at Yacht Tender
      description: Magaan ang katawan ng katawan, PVC na tubo, komportableng upuan, teleskopikong tiller o compact console, mga lifting point para sa davit, at naaalis na tangke ng gasolina. RCD Kategoryang C o D.
      icon: tabler:sailboat
    - title: Propesyonal na Workboat
      description: Opsyon sa hull na aluminyo, heavy-duty reinforcement, hydraulic steering, electrical na pang-komersyal, radar arch, at mission-specific equipment integration points. Custom compliance ayon sa proyekto.
      icon: tabler:anchor
process_steps:
  title: 7-Hakbang na RIB OEM/ODM Proseso ng Pag-develop
  subtitle: Mula sa project brief hanggang after-sales — isang tiyak na workflow na may malinaw na milestones at deliverables
  steps:
    - number: '01'
      title: Project Brief at Mga Kinakailangan
      description: Tukuyin ang target na aplikasyon, sukat ng hull, materyal ng tubo, mga kinakailangan sa pagsunod, at pangangailangan sa branding. Sinusuri namin ang kakayahang maisakatuparan at kinukumpirma ang modelo ng kolaborasyon (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 araw
    - number: '02'
      title: Teknikal na Pagsusuri at Kakayahang Maisakatuparan
      description: Sinusuri ng engineering team ang structural feasibility, stability at buoyancy calculations, compliance path, at availability ng materyales. Tinutukoy namin ang umiiral na molds o kinakailangan ng custom mold.
      timeline: 5–7 araw
    - number: '03'
      title: Panukala at Alok
      description: Tumanggap ng detalyadong panukala kabilang ang mga specifications, 3D renderings o GA drawings, saklaw ng pagsunod, timeline, at presyo bawat unit batay sa volume tiers at MOQ.
      timeline: 5–7 araw
    - number: '04'
      title: Pagkumpirma ng Disenyo at Pagsusuri ng Sample
      description: Kumpirmahin ang final GA, deck layout, at configuration ng tubo. Gumagawa kami ng pre-production sample na may kulay ng iyong brand, logo, at tinukoy na materyales para sa iyong pisikal na inspeksyon.
      timeline: 15–20 araw
    - number: '05'
      title: Pag-apruba ng Sample at QC Protocol
      description: 'Suriin at aprubahan ang sample. Tukuyin ang production QC protocol: pressure test (1.25x / 24–48h), dimensional checks, at checklist ng compliance documentation bawat hull.'
      timeline: 3–5 araw
    - number: '06'
      title: Mass Production at Quality Control
      description: Buong produksyon na may 100-point QC checklist bawat unit. In-process inspections, pressure testing, at serial-level traceability. CE/ISO na dokumentasyon inihanda nang sabay.
      timeline: 30–45 na araw
    - number: '07'
      title: Pag-pack, Pagpapadala at After-Sales
      description: Custom packaging (standard, retail-ready, o palletized), export documentation, paglo-load ng container, at logistics. Kasama ang spare parts kits at maintenance documentation.
      timeline: 7–14 na araw
certifications:
  title: Pagsunod at Sertipikasyon para sa RIB Boats
  subtitle: Bawat custom RIB order ay ipinapadala kasama ang model-specific compliance documentation
  items:
    - name: CE 2013/53/EU
      description: RCD pagsunod sa bawat modelo at design category — kasama ang DoC, builder plate, owner manual
      badge: CE
    - name: ISO 9001:2015
      description: Sistema ng pamamahala ng kalidad na sertipikado ng SGS na sumasaklaw sa disenyo, produksyon, at pamamahagi
      badge: ISO
    - name: EN ISO 6185
      description: Pamantayan sa paggawa ng bangkang may hangin — katatagan, pagkakakalutang, at pagliligtas sa nahulog sa tubig
      badge: 6185
    - name: EN ISO 14945
      description: Pamantayan ng plate ng tagabuo — permanenteng nakatatak na impormasyon ng pagkakakilanlan at kapasidad
      badge: 14945
    - name: BSCI
      description: Audit ng pagsunod sa panlipunan para sa etikal na paggawa — kinakailangan ng mga retailer sa EU
      badge: BSCI
    - name: REACH
      description: Pagsunod sa kaligtasan ng kemikal ng EU para sa PVC, Hypalon, pandikit, at mga patong
      badge: REACH
content_service_modules:
  tagline: Mga Module ng Serbisyo
  title: OEM/ODM Serbisyo<br />Mga Modulo
  subtitle: Pinagsasama ng bawat proyekto ang tamang mga module ng serbisyo. Hindi lahat ng proyekto ay nangangailangan ng bawat module — tinutukoy lamang namin ang kailangan ng iyong proyekto.
  items:
    - title: Pagsusuri sa Inhinyeriya at Kakayahang Maisakatuparan
      description: 'Pagsusuri ng plataporma ng hull, tsek ng istruktural na posibilidad, beripikasyon ng katatagan at buoyancy, pagtukoy ng landas ng pagsunod, at kumpirmasyon ng magagamit na materyal. Output: ulat ng posibilidad na may rekomendasyong go/no-go.'
      icon: tabler:math-function
    - title: Disenyo at Pag-aayos
      description: 'GA na guhit, layout ng deck, konfigurasyon ng tubo, posisyon ng konsol at upuan, plano ng pag-mount ng kagamitan, at pagpili ng kulay/materyal. Output: aprubadong GA at espesipikasyon ng konfigurasyon.'
      icon: tabler:ruler
    - title: Halimbawa at Protótipo
      description: Sample ng pre-produksyon na may aprubadong mga kulay, logo, at tinukoy na mga materyales para sa pisikal na inspeksyon. Kasama ang protocol ng pag-apruba ng sample, checklist ng inspeksyon, at proseso ng request ng pagbabago.
      icon: tabler:3d-cube-sphere
    - title: Produksyon at QC
      description: Masa-produksyon na may 100-puntong QC checklist sa bawat yunit, inspeksyon habang proseso, pagsubok sa presyon (1.25x / 24-48h), at pagsubaybay sa antas ng serye. CE/ISO na dokumentasyon na inihanda nang sabay.
      icon: tabler:clipboard-check
    - title: Pagba-brand at Pag-iimpake
      description: Paglalapat ng logo ng pribadong tatak, pasadyang grapiko ng katawan at tubo, dokumentasyon ng may-ari na may tatak, packaging na handa na para sa tingi o nakapallet, at paghahanda ng kit ng ekstrang bahagi.
      icon: tabler:palette
    - title: Pag-export at Dokumentasyon
      description: Pag-iimpake para sa export, plano sa pagkakarga ng kontainer, dokumentasyon ng FOB/CIF/DDP, mga papeles na sumusunod sa bawat pamilihang destinasyon, at protokol ng komunikasyon pagkatapos ng paghahatid.
      icon: tabler:world
content_risk_control:
  tagline: Kontrol sa Panganib at Paghahatid
  title: Panganib sa Proyekto &<br />Pamamahala ng Paghahatid
  subtitle: Ang mga propesyonal na mamimili ng OEM/ODM ay parehong pinahahalagahan ang pagkontrol sa panganib at kalidad ng produkto. Ganito namin ito pinamamahalaan.
  items:
    - title: Saklaw at Kahulugan ng Pagmamay-ari
      description: 'Bago magsimula ang development, tinutukoy namin nang nakasulat: saklaw ng customization, mga kinakailangan sa tooling, sample approval criteria, pagmamay-ari ng mga guhit at molde, at mga responsibilidad sa dokumentasyon. Walang kalabuan kung sino ang may-ari ng ano.'
      icon: tabler:file-text
    - title: Proseso ng Kontrol sa Pagbabago
      description: Lahat ng pagbabago sa espesipikasyon pagkatapos ng kumpirmasyon ng disenyo ay sumusunod sa dokumentadong proseso ng kahilingan ng pagbabago na may impact assessment (gastos, timeline, pagsunod). Walang hindi aprubadong pagbabago ang pumapasok sa produksyon.
      icon: tabler:arrows-diff
    - title: Garantiya ng Consistency ng Batch
      description: Ang ika-50 yunit ay tumutugma sa unang aprubadong sample. Ang mga aprubadong espesipikasyon ay naka-freeze, ang mga parameter ng materyal at proseso ay naka-lock, at ang mga checkpoint sa proseso ay nagpapatunay ng konsistensi sa buong takbo ng produksyon.
      icon: tabler:repeat
    - title: Transparinsya sa Paghahatid at Kapasidad
      description: Ang lead times ay nakasaad base sa aktwal na kapasidad ng produksyon, antas ng stock ng materyales, at kasalukuyang load ng order — hindi aspirational targets. Production schedule na may milestone dates na ibinibigay kada order.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Mga Madalas Itanong
  questions:
    - q: Ano ang pagkakaiba ng OEM at ODM para sa RIB mga bangka?
      a: 'OEM (Paggawa ng Orihinal na Kagamitan): nagbibigay ka ng detalyadong espesipikasyon at kami ang bumubuo ng iyong disenyo.ODM (Orihinal na Disenyo ng Paggawa): pipili ka ng subok na Paddle Board Overstock RIB platform at i-customize namin ito ayon sa nais mong mga tampok at branding.ODM mas mabilis at mas muraOEM; nag-aalok ng pinakamataas na kontrol sa disenyo.'
    - q: Pwede ko bang i-customize ang RIB hugis at laki ng hull?
      a: Oo. Nag-aalok kami ng semi-custom na mga pagbabago sa mga umiiral na hulma ng hull (iba't ibang layout ng deck, mga konfigurasyon ng tubo) at buong custom na pagbuo ng hull gamit ang mga bagong CNC-machined na hulma. Ang mga semi-custom na proyekto ay maaaring magsimula sa 2-5 yunit; karaniwang nangangailangan ng mas mataas na mga commitment ang full custom.
    - q: Anong mga materyales sa tubo ang available para sa customRIBs?
      a: Nag-aalok kami ng 0.9-1.2 mm PVC para sa rekreasyonal at magaan na komersyal na gamit, at 1.4-1.7 mm HypalonCSM / para sa propesyonal, rescue, at komersyal na aplikasyon na nangangailangan ng superior UV at ozone resistance (10-15 taon na buhay kumpara sa 5-8 taon para sa PVC).
    - q: Maaari mo bang i-configure RIBs para sa mga partikular na aplikasyon tulad ng rescue, diving, o pangingisda?
      a: Oo. Pinapanatili namin ang mga subok na configuration template para sa rescue/patrol, diving support, turismo/charter, pangingisda, yacht tender, at propesyonal na workboat applications. Bawat template ay may inirerekomendang uri ng hull, materyal ng tubo, layout ng deck, at kagamitan — na aming inaangkop ayon sa iyong eksaktong pangangailangan.
    - q: Anong impormasyon ang kailangan mo para sa RIB OEMODM / quotation?
      a: Target na aplikasyon, nais na haba ng hull, kagustuhan sa materyal ng tubo (PVCoHypalon), tinatayang dami at iskedyul ng paghahatid, mga kinakailangan sa pagsunod sa target na merkado, at anumang mga produktong sanggunian o espesipikasyon. Mas maraming detalye ang iyong ibibigay, mas mabilis at mas tumpak ang aming quotation.
    - q: Ano ang MOQ para sa mga custom RIB na bangka?
      a: Para sa umiiral na hull molds na may standard modifications, MOQ nagsisimula sa 2-5 units bawat disenyo. Para sa custom molds at full custom development, MOQ depende ito sa komplikasyon ng proyekto — karaniwang 10-20 units para sa semi-custom at 30+ para sa full custom na may bagong tooling.
    - q: Sino ang may-ari ng mga custom na molde at guhit?
      a: Ang mga mold na ginawa gamit ang Paddle Board Overstock base designs ay nananatiling Paddle Board Overstock pag-aari. Ang mga fully custom na mold na kinomisyon at binabayaran ng kliyente ay maaaring italaga sa pagmamay-ari ng kliyente ayon sa mga termino ng kontrata. Lahat ng termino ng pagmamay-ari ng hulma ay dokumentado bago magsimula ang proyekto.
    - q: Paano RIBs ini-customize ang package para sa export?
      a: 'Standard: custom cradle + stretch-wrap para sa paglo-load ng container. Premium: retail-ready packaging, vacuum pack, o palletized. Nag-aalok kami ng FOB Qingdao, CIF, at DDP shipping. Kumpletong dokumentasyon sa export at customs clearance ang kasama.'
