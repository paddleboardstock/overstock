faq:
  title: Mga Madalas Itanong tungkol sa Package
  questions:
    - q: Ano ang minimum na order para sa mga package?
      a: Ang Club Starter Package ay may minimum na 10 units. Ang Resort at Brand packages ay ini-customize ayon sa iyong pangangailangan na may flexible na MOQs.
    - q: Gaano katagal ang delivery?
      a: Ang karaniwang produksyon ay 30–45 araw mula sa kumpirmasyon ng order. Ang pinabilis na produksyon ay available sa karagdagang bayad.
    - q: Maaari ko bang i-customize ang kulay at branding ng kagamitan?
      a: Oo. Lahat ng package ay may buong customization — kulay ng board, logo prints, at disenyo ng packaging.
    - q: Nagbibigay ba kayo ng after-sales support?
      a: Oo. Bawat package ay may access sa aming online maintenance guides, video tutorials, at spare parts ordering system.
