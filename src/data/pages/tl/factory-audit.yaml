content_priorities:
  tagline: Ano ang Sinisiyasat ng mga Kliyente
  title: 8 Bagay na Sinisiyasat ng mga Bumibili<br />sa Bawat Pagbisita sa Pabrika
  subtitle: Batay sa puna mula sa 50+ bansa na mga mamimili, ito ang walong prayoridad na sinusuri ng mga kliyente bago maglagay ng B2B na order.
  items:
    - title: Tunay na Tagagawa
      description: 'Ikaw ba ang totoong pabrika, hindi isang trading company? Sinusuri ng mga mamimili: uri ng negosyo, totoong kagamitan sa produksyon, mga empleyadong nagpapatakbo ng mga makina, kasalukuyang mga order sa produksyon sa floor, at pagkakatugma ng website at workshop.'
      icon: tabler:building-factory
    - title: Angkop na Produkto para sa Aplikasyon
      description: Tugma ba ang RIB sa kanilang tiyak na gamit? Ang mga operator ng resort, rescue, diving, pangingisda, at pagpatrolya ay may ganap na magkakaibang pangangailangan. Sinusuri ng mga mamimili ang pagkakaayos ng deck, materyal ng tubo, at mga opsyon sa kagamitan sa ipinakitang bangka.
      icon: tabler:target
    - title: Katatagan ng Kalidad at Maaaring Ulitin
      description: Kasing ganda ba ng unang yunit ang ika-50 yunit? Sinusuri ng mga mamimili ang mga QC system, mga checkpoint habang proseso, pamamahala ng hindi pagsunod, at humihiling na makita ang mga rekord mula sa maraming produksyon upang tiyakin ang pagkakapare-pareho.
      icon: tabler:repeat
    - title: Orihinalidad ng Dokumento ng Pagsunod
      description: Ang mga sertipiko ba ng CE ay tiyak sa modelo? Ang DoC ba ay nilagdaan ng totoong tao? Puwedeng ma-verify ang pagsunod bawat numero ng hull? Sini-siyasat ng mga mamimili ang mga pangkalahatang pahayag kumpara sa dokumentasyon na tiyak sa modelo.
      icon: tabler:file-certificate
    - title: Pagpapatupad ng Pag-aangkop
      description: Kaya ba ng pabrika na maghatid ng mga custom na configuration? Naghahanap ang mga mamimili ng ebidensya ng mga nagdaang custom na proyekto, ipinamamalas na mga prototype sample, mga guhit na pang-inhinyeriya, at ang kakayahang talakayin ang teknikal na pagbabago kaagad.
      icon: tabler:adjustments
    - title: Oras ng Pangunguna at Kakayahan
      description: 'Makatotohanan ba ang mga quoted timeline? Sinusuri ng mga mamimili: kasalukuyang dami ng produksyon, available na kapasidad, laki ng workforce, antas ng stock ng materyales, at kung may production planning system ang pabrika.'
      icon: tabler:clock
    - title: Mga Tuntunin sa Presyo at Kalakalan
      description: 'Transparent ba ang mga FOB presyo? Malinaw ba ang presyo? Sinusuri ng mga mamimili: paghahati ng unit price, gastos sa tooling, gastos sa packaging, at kung kaya ng pabrika ang mga DDP CIF kondisyon sa tamang export documentation.'
      icon: tabler:currency-dollar
    - title: After-Sales at Spare Parts
      description: 'Ano ang nangyayari pagkatapos ng delivery? Sinusuri ng mga mamimili: availability ng spare parts, warranty process, replacement tube sections, valve replacement, at kung may dokumentadong after-sales protocol ang pabrika.'
      icon: tabler:headset
content_tour:
  tagline: Ruta ng Paglilibot sa Pabrika
  title: Audit Tour —<br />Ano ang Makikita Mo
  subtitle: Ang aming karaniwang factory tour ay sumusunod sa isang tinukoy na ruta na idinisenyo upang sagutin ang mga tanong ng mamimili sa bawat istasyon.
  items:
    - title: 1. Silid-pulong — Panimula ng Kumpanya
      description: Lisensya sa negosyo, ISO 9001 at BSCI mga sertipiko, mga lisensya sa pag-export, at kasaysayan ng kumpanya. Mabilisang pangkalahatang-ideya ng kakayahan sa produksyon at saklaw ng pagsunod.
      icon: tabler:users
    - title: 2. Bodega ng Hilaw na Materyales — IQC Station
      description: Mga tala ng inspeksyon ng papasok na materyales, mga sertipiko ng batch ng tela, mga pandikit at mga sample ng hardware. Tingnan kung paano sinusuri ang mga materyales bago pumasok sa produksyon.
      icon: tabler:building-warehouse
    - title: 3. Paggawa ng Tubo — RF Welding at Hand Gluing
      description: Proseso ng live tube welding o pagdikit, demonstrasyon ng seam strength test, at pag-install ng balbula. Obserbahan ang bawat chamber na konstruksyon at mga quality checkpoint.
      icon: tabler:flame
    - title: 4. Laminasyon ng Hull — GRP Workshop
      description: Proseso ng fiberglass layup, aplikasyon ng gelcoat, at hull curing. Tingnan ang lamination schedule at structural reinforcement para sa iba't ibang RIB modelo.
      icon: tabler:layers-subtract
    - title: 5. Pag-assemble at Integrasyon
      description: Pagsasama ng hull-tube, pag-install ng console at upuan, integrasyon ng elektrikal at fuel system, at pag-mount ng kagamitan. Panoorin ang kasalukuyang linya ng produksyon.
      icon: tabler:tool
    - title: 6. Istasyon ng Pagsusuri ng Presyon
      description: 24-48h pressure hold test sa 1.25x rated pressure. Tingnan ang test records, pressure gauge, at pass/fail criteria. Tingnan kung paano naka-link ang test results sa hull serial numbers.
      icon: tabler:gauge
    - title: 7. Pangwakas na Inspeksyon at QC
      description: 100-point quality checklist bawat unit, dimensional verification, cosmetic inspection, at packaging integrity check. Suriin ang non-conformance logs at corrective action records.
      icon: tabler:clipboard-check
    - title: 8. Silid ng Pagsusuri ng Dokumento
      description: Dokumentasyon ng pagsunod kada modelo (DoC, builder plate, owner manual), production traceability records, HIN registry, at demonstration ng material batch tracking database.
      icon: tabler:folder
content_qc_chain:
  tagline: Ebidensya ng Kalidad
  title: 8-Stage QC Chain<br />— Maaaring beripikahin sa bawat hakbang
  subtitle: Ang aming quality control chain ay mula sa mga papasok na materyales hanggang sa huling pagpapadala, na may dokumentadong ebidensya sa bawat yugto.
  items:
    - title: 'Yugto 1: Inspeksyon ng Papasok na Materyal'
      description: Bawat batch ng PVC, Hypalon, fiberglass, aluminyo, pandikit, at hardware ay sinusuri laban sa mga espesipikasyon bago pumasok sa produksyon. Ang lakas sa pagtutulak, pagdikit ng patong, at pagsusuri ng sukat ay ayon sa AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Yugto 2: QC ng Pagsasama / Pandikit ng Tubo'
      description: Pagsusuri ng lakas ng pagkapilas ng tahi bawat batch ng produksyon. Ang mga parameter ng RF weld ay minomonitor at itinatala. Ang mga tautang idinikit sa kamay ay sinisiyasat para sa pare-parehong saklaw ng pandikit at oras ng pagpapatigas.
      icon: tabler:flame
    - title: 'Yugto 3: QC ng Hull Lamination'
      description: Pagsukat ng kapal ng gelcoat, beripikasyon ng fiberglass layup ayon sa iskedyul ng laminate, at pagmamanman ng oras ng pagpapagaling. Ang mga posisyon ng struktural na pagpapalakas ay beripikado laban sa mga guhit ng inhinyeriya.
      icon: tabler:layers-subtract
    - title: 'Yugto 4: Pagsusuri ng Kalidad sa Pagpupulong at Pagsasama'
      description: Kalidad ng pagkakabit ng hull-tube joint, torque ng konsol at upuan, tuloy-tuloy na daloy ng kuryente, at pagsubok sa tagas ng sistema ng gasolina. Bawat punto ng pag-install ay sinuri laban sa assembly checklist na tiyak sa modelo.
      icon: tabler:tool
    - title: 'Yugto 5: Pagsusulit sa Paghawak ng Presyon'
      description: Bawat inflatable na silid ay pinapa-pressurize sa 1.25x ng itinakdang PSI at hiniwalay sa loob ng 24-48 na oras. Ang pagbaba ng presyon ay itinatala para sa bawat silid. Ang threshold ng pumasa/bagsak ay idodokumento. Nakakabit sa serial number ng hull.
      icon: tabler:gauge
    - title: 'Hakbang 6: Panghuling Inspeksyon'
      description: 100-point na checklist ng kalidad na sumasaklaw sa tamang sukat, hitsura ng kosmetiko, kumpletong accessories, pakete ng dokumentasyon, at integridad ng packaging. Malaya mula sa koponan ng produksyon.
      icon: tabler:clipboard-check
    - title: 'Yugto 7: Dokumentasyon ng Pagsunod'
      description: Dalubhasa sa modelo na DoC, beripikasyon ng plato ng gumawa, kabuuan ng manwal ng may-ari, at pagpasok sa HIN na rehistro. Lahat ng dokumento ng pagsunod ay inihanda at beripikado bago ilabas ang pagpapadala.
      icon: tabler:file-certificate
    - title: 'Yugto 8: Pagpapalabas ng Padala at Pagsubaybay'
      description: Ang pinal na pagpapalabas ay nangangailangan na lahat ng yugto ng QC ay mapasa, ang dokumentasyon ng pagsunod ay kumpleto, at ang dokumentasyon ng pagpapadala ay beripikado. Ang rekord ng barko ay isinara at in-archive para sa 10 taong pagpapanatili.
      icon: tabler:truck
content_traceability:
  tagline: Masubaybay na Produksyon
  title: HIN → Master File →<br />Talaan ng Balangkas → Paghahatid
  subtitle: Bawat RIB na bangka ay may dalang natatanging Hull Identification Number na konektado sa kumpletong talaan ng produksiyon at pagsunod.
  items:
    - title: Numero ng Pagkakakilanlan ng Hull (HIN)
      description: 14-character na natatanging identifier na permanente na markado sa bawat bangka. Nagtatala ng manufacturer code (MIC), model designation, taon ng produksyon, at serial number. Ang susi na nagbubukas sa buong traceability chain.
      icon: tabler:hash
    - title: Pangunahing Teknikal na File
      description: Ang dokumentasyon ng pagsunod at engineering para sa pamilya ng modelo. Naglalaman ng mga GA na guhit, pagtataya ng panganib, kalkulasyon ng katatagan, mga espesipikasyon ng materyal, at mga naaangkop na pamantayan. Nakaugnay sa lahat ng mga hull ng modelong iyon.
      icon: tabler:folder
    - title: Indibidwal na Talaan ng Balangkas
      description: 'Tala ng produksyon kada hull: HIN, petsa ng produksyon, batch ng tubo, mga sertipiko ng materyal, resulta ng pressure test, panghuling konfigurasyon, espesipikasyon ng makina, resulta ng quality checklist, at destinasyon ng paghahatid. 21+ na mga data field kada hull.'
      icon: tabler:file-description
    - title: Pakete ng Pagsunod ng Kostumer
      description: Pang-hull na package ng paghahatid kabilang ang DoC, larawan ng builder plate, manual ng may-ari, checklist ng pagsunod, at pinal na sheet ng konfigurasyon. Ipinapadala kasama ng bangka at itinatago sa pabrika sa loob ng 10+ taon.
      icon: tabler:package
content_red_flags:
  tagline: Mga Bituing Pag-audit
  title: Pulang Bandila ng mga Mamimili<br />Madaling Spot
  subtitle: Karaniwang mga isyu na nagpapahina sa kumpiyansa ng mga mamimili sa mga audit ng pabrika. Proactive naming tinutugunan ang bawat isa.
  items:
    - title: Blanket CE Claims na Walang Saklaw ng Modelo
      description: '"Lahat ng produkto CE ay sertipikado" nang hindi tinutukoy kung aling direktiba, anong mga modelo, at aling conformity module. Pulang bandila: nagpapahiwatig na ang pagsunod ay panlabas lamang kaysa sa bawat modelo, bawat konfigurasyon.'
      icon: tabler:alert-triangle
    - title: Walang Ebidensya ng Pisikal na Pagsusuri
      description: 'Mga claim sa pressure test nang walang test records, gauge, o test station na makikita sa factory floor. Red flag: hindi mapatunayan ang quality claims sa pagbisita.'
      icon: tabler:alert-triangle
    - title: Nawawalang Pagsubaybay sa Materyal
      description: 'Walang batch records, walang papasok na inspeksyon, o walang koneksyon sa pagitan ng mga sertipiko ng materyales at mga tapos na produkto. Pulang bandila: walang paraan para matunton ang mga isyu sa kalidad hanggang sa pinagmulan.'
      icon: tabler:alert-triangle
    - title: Pangkalahatang Dokumentasyon
      description: 'Isang DoC na sumasaklaw sa lahat ng modelo, walang HIN-specific records, o "template" compliance documents. Red flag: ang compliance ay hindi nakatali sa indibidwal na production units.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Pagpapadala at Pag-iimpake
  title: RIB lalagyan ng bangka<br />Paglo-load at Pag-crate
  subtitle: Pinoprotektahan ng aming mga solusyon sa pagpapadala ang iyong investment mula Qingdao papunta sa destinasyong pantalan. Available ang mga plano sa paglo-load ng container at mga espesipikasyon sa crating para sa bawat modelo.
  items:
    - title: 20ft na Konfigurasyon ng Container
      description: 'Standard na 20ft container: 1-2 RIB bangka (4.0-5.5m) na naka-nest na may hiwalay na deck at tubo, o 8-12 SUP boards. Halo-halong RIB + SUP configuration ang available. Detalyadong plano ng paglo-load ay ibinibigay kada order.'
      icon: tabler:box
    - title: 40ft na Konfigurasyon ng Container
      description: 'Standard na 40ft container: 2-4 RIB na bangka (hanggang 7.0m) na may mga hull na naka-nest at mga tubo na naka-stack, o 20-30 SUP boards. 40ft HQ na available para sa mas matataas RIB na modelo. Ang volume-optimized na packaging ay nagpapababa ng gastos sa pagpapadala kada yunit.'
      icon: tabler:container
    - title: Kahoy na kahon para sa RIB mga hull
      description: Aluminum at GRP hulls na naka-crate sa custom-fit na kahoy na kahon na may foam padding, moisture barrier, at steel banding. Mga sukat at bigat ng kahon bawat modelo para sa pagpaplano ng logistics. Kasama ang ISPM-15 heat-treated wood certification.
      icon: tabler:wood
    - title: Pag-iimpake ng Paghihiwalay ng Tubo at Deck
      description: Ang mga tubo ay na-deinflate at nakatupi nang hiwalay mula sa mga hull para sa episyenteng espasyo. Mga deck plate, console, at upuan na nakapack sa protective wrapping na may mounting hardware kits. Kasama ang mga tagubilin sa muling pag-assemble sa bawat padala.
      icon: tabler:package
    - title: Proteksyon laban sa Kahalumigmigan at Kalawang
      description: VCI anti-corrosion paper para sa aluminum components, silica gel desiccant packs, at vacuum-sealed hardware bags. Pinipigilan ang kondensasyon sa 30-45 araw na paglalakbay sa dagat.
      icon: tabler:droplet-off
    - title: FOB Dokumentasyon ng Qingdao
      description: Bill of Lading, Commercial Invoice, Packing List, Certificate of Origin, at compliance documentation kada shipment. Magagamit ang FCL at LCL consolidation. Suporta sa customs documentation para sa EU, US, at Middle East markets.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Ebidensya ng Beripikasyon
  title: Ebidensya ng Audit<br />Maaari Mong I-verify On-Site
  subtitle: Sa mga pagbisita sa pabrika, maaaring beripikahin ng mga kliyente ang partikular na ebidensya sa bawat lugar ng produksyon. Narito ang mga dapat hanapin — at ang aming inihahanda para sa bawat audit.
  areas:
    - area: bodega ng hilaw na materyales
      what_to_verify: Matatag ba ang mga materyales? Mayroong bang paghahalo ng batch?
      evidence: Mga tala ng inspeksyon na dumarating, mga label ng batch, FIFO na imbakan, listahan ng aprubal ng supplier, mga sertipiko ng materyal (PVC, Hypalon, fiberglass, aluminyo, pandikit, hardware)
      icon: tabler:building-warehouse
    - area: Produksyon ng Tube
      what_to_verify: Paano ginagarantiya ang tibay ng tahi at pagiging air-tight?
      evidence: Mga kard ng proseso, kumpirmasyon ng unang artikulo, mga tala ng pressure test bawat silid, mga tala ng pagkumpuni at muling pagsusuri, mga tala ng pag-install ng balbula
      icon: tabler:flame
    - area: Produksyon ng Balangkas
      what_to_verify: Paano kinokontrol ang estruktural na pagkakapare-pareho?
      evidence: Mga dokumento ng kontroladong proseso, mga tseke sa kalidad, pagbibigay ng numero sa semi-tapos na produkto, pagsukat ng kapal ng gelcoat, beripikasyon ng iskedyul ng lamination
      icon: tabler:layers-subtract
    - area: Lugar ng Pagpupulong
      what_to_verify: Paano pinipigilan ang mga opsyonal na bahagi na maling buuin?
      evidence: BOM, mga order sa trabaho, mga checklist ng pagsasaayos, mga kard ng inspeksyon sa istasyon ng trabaho, torque at mga tseke ng functionality ayon sa modelo
      icon: tabler:tool
    - area: Istasyon ng Pagsusuri
      what_to_verify: Paano mo kinakumpirma na maayos ang bangka bago ito ihatid?
      evidence: Mga pamamaraan sa pagsubok, listahan ng mga instrumento, mga tala ng kalibrasyon, mga tala ng pagsubok sa presyon (1.25x / 24-48h), mga checklist ng functional na pagsubok, dokumentadong pamantayan ng pumasa/bagsak
      icon: tabler:gauge
    - area: Lugar ng Hindi Pagsunod
      what_to_verify: Paano hinahandle ang mga depekto?
      evidence: Mga label ng paghihiwalay, mga tala ng NCR, pagsusuri ng ugat na sanhi, mga tala ng pag-apruba sa muling paggawa, pagsubaybay ng CAPA (Pagwawasto at Pag-iwas na Aksyon)
      icon: tabler:alert-triangle
    - area: Bodega ng Natapos na Produkto
      what_to_verify: Paano mo maiiwasan ang maling pagpapadala at pinsala?
      evidence: Mga etiketa ng tapos na produkto, mga rekord ng pagtutugma ng order, mga pamantayan sa pag-iimpake, mga rekord ng inspeksyon bago ipadala
      icon: tabler:box
    - area: Mga Bahagi at Pagkatapos ng Pagbenta
      what_to_verify: Maaari mo bang suportahan ang pangmatagalang after-sales?
      evidence: Karaniwang listahan ng piyesang pamalit, estratehiya sa imbentaryo, sistema ng pag-numerong ng bahagi, dokumentasyon ng proseso ng warranty, mga tutorial sa pagpapanatili
      icon: tabler:headset
content_closing_script:
  tagline: Audit para sa Order
  title: Mula sa Pagbisita sa Pabrika<br />sa Nakumpirmang Proyekto
  subtitle: Ang matagumpay na audit ay hindi dapat magtapos sa mga larawan at pakikipagkamay. Bago umalis, tinitiyak namin na naidokumento ang tatlong komersyal na kinalabasan.
  items:
    - title: Kumpirmahin ang Teknikal na Konfigurasyon
      description: Magkasundo sa modelo, aplikasyon, mga pangunahing pagpipilian, target na merkado, tinatayang dami, at iskedyul ng paghahatid — lahat ay idodokumento bago umalis.
      icon: tabler:checklist
    - title: Kumpirmahin ang Mga Dokumento para sa Susunod na Hakbang
      description: 'Tukuyin kung ano ang ibinibigay ng Paddle Board Overstock sa susunod: binagong GA, listahan ng configuration, quotation, checklist ng dokumento, sample plan, o NDA — na may tiyak na timeline.'
      icon: tabler:file-plus
    - title: Kumpirmahin ang Mutual Timeline
      description: Binagong configuration at paunang quotation sa loob ng 3 araw ng trabaho. Pagpapatunay ng sample o appearance sa loob ng 7 araw. Pagsusuri ng engineering o third-party inspection sa loob ng 14 na araw. Itakda ang petsa ng susunod na pagpupulong at mga responsable.
      icon: tabler:calendar
faq:
  title: Factory Audit — Madalas na Itanong na Mga Tanong
  questions:
    - q: Maaari ko bang bisitahin ang pabrika nang personal?
      a: Oo. Malugod naming tinatanggap ang on-site factory audits sa aming 12,000 m² na pasilidad sa Qingdao. Saklaw ng aming karaniwang tour ang 8 istasyon mula sa raw material warehouse hanggang sa document review room. Available din ang virtual factory tours sa pamamagitan ng video call para sa paunang kwalipikasyon.
    - q: Tinatanggap ba ninyo ang third-party audits (BSCI, SMETA, SGS)?
      a: Oo. Mayroon kaming BSCI certification (Intertek) at malugod naming tinatanggap ang customer-specific audit protocols. Maaari rin naming ayusin ang SGS o TÜV inspections kapag hinihiling. Available ang audit reports sa ilalim ng NDA.
    - q: Maaari ba akong makakita ng pressure testing sa panahon ng pagbisita?
      a: Ang pressure testing station ay bahagi ng karaniwang route ng tour. Depende sa iskedyul ng produksyon, maaari mong obserbahan ang aktibong pressure tests kasama ang gauge readings at test records. Available palagi ang pressure test logs kada hull para sa pagsusuri.
    - q: Paano ninyo hinaharap ang non-conforming products?
      a: Ang mga non-conforming units ay pinaghiwalay, idokumento, at sinusuri ayon sa aming ISO 9001 corrective action process. Isinasagawa ang root cause analysis, ipinapatupad ang corrective actions, at pinananatili ang mga rekord. Maaaring suriin ng mga mamimili ang aming NCR log sa panahon ng mga audit.
    - q: Anong compliance documentation ang available para sa pagsusuri?
      a: 'Sa panahon ng audit, maaari mong suriin ang: model-specific DoC samples, builder plate specifications, HIN registry, owner manual drafts, listahan ng mga naaangkop na pamantayan, at conformity assessment records ayon sa bawat model family.'
    - q: Paano ako mag-book ng virtual factory tour?
      a: Makipag-ugnayan sa aming sales team upang mag-iskedyul ng live video tour sa pamamagitan ng WhatsApp, Zoom, o Teams. Sinusunod namin ang parehong 8-istasyon na ruta at maaari naming pagtuunan ng pansin ang mga partikular na area batay sa iyong interes. Karaniwang virtual tour ay 45-60 minuto.
    - q: Ang pabrika ba ang tunay na gumawa o isang trading company?
      a: Ang Paddle Board Overstock ang tunay na gumawa. Pinapatakbo namin ang pabrika sa Laixi, Qingdao. Ang business license, saklaw ng produksiyon, at pisikal na produksyon ay lahat mapapatunayan sa panahon ng audit.
    - q: Anong quality records ang maaari kong suriin?
      a: Incoming material inspection records, in-process QC checkpoints, pressure test logs, 100-point final inspection checklists, non-conformance reports, corrective action records, at per-hull traceability records. Lahat ay pinananatili ayon sa ISO 9001 requirements.
