hero_text:
  tagline: Mga Mapagkukunan
  title: I-download ang Center & Paddling Guides
  subtitle: Mga katalogo ng produkto, mga gabay sa pagbili, at mga tagubilin sa pag-aalaga upang matulungan kang pumili, gamitin, at tamasahin ang iyong inflatable SUP board.
features3_downloads:
  tagline: Mga Pag-download
  title: Dokumentasyon ng Produkto<br />& Mga Mapagkukunan sa Paglalayag
  isBeforeContent: false
  columns: 2
  items:
    - title: SUP 2026 Katalogo ng Produkto
      description: 'Ang kumpletong Paddle Board Overstock SUP hanay: all-around na mga board, serye ng sining, at mga aksesorya, na may kumpletong espesipikasyon at nilalaman ng pakete. PDF na format.'
      icon: tabler:file-text
    - title: SUP Gabay sa Inflatable na Mamimili
      description: 'Paano pumili ng iyong unang board: haba, lapad, kapal, volume, tugma ng timbang ng sakay, at kung anong hugis ng board ang babagay sa iyong istilo ng pagpaddle.'
      icon: tabler:file-description
    - title: SUP Gabay sa Sukat at Sukat
      description: I-match ang volume at sukat ng board sa iyong timbang at antas ng kasanayan, gamit ang mga rekomendasyon na partikular sa aktibidad para sa libangan, touring, yoga, at fitness.
      icon: tabler:clipboard-check
    - title: Gabay sa Pangangalaga at Pagpapanatili ng Board
      description: 'Panatilihing bago ang iyong board: paglilinis, pagpapatuyo, pag-iimbak, UV proteksyon, pag-aalaga ng balbula, at mga minor na tagubilin sa pagkukumpuni.'
      icon: tabler:tool
    - title: Gabay sa mga Materyales ng Inflatable Board
      description: PVC Konstruksyon, drop-stitch cores, EVA deck pads, at kung ano ang ibig sabihin ng 15 PSI rigidity para sa performance at tibay.
      icon: tabler:files
    - title: Pagsisimula sa SUP
      description: 'Mga pangunahing kaalaman sa unang beses na paddler: pag-inflate, carrying, paglulunsad, mga pangunahing stroke, at mga safety essentials para makatayo ka sa unang araw.'
      icon: tabler:swimming
faqs:
  title: Mga Madalas Itanong
  subtitle: Mga karaniwang tanong tungkol sa aming mga board, pag-order, at pagpasok sa tubig.
  columns: 2
  items:
    - title: Ano ang kasama sa aking board?
      description: Bawat kumpletong pakete ay may kasamang board, adjustable paddle, high-flow pump, leash, repair kit, at backpack. Ang Oars & Pump Set ay available din nang hiwalay.
      icon: tabler:package
    - title: Gaano katagal ang inflation?
      description: Sa kasamang high-flow pump, karamihan sa mga paddler ay umaabot sa full pressure sa loob ng 8-12 minuto. Gumagana rin ang electric pumps — huminto lang sa rated pressure na naka-print malapit sa valve.
      icon: tabler:clock
    - title: Paano ko pipiliin ang tamang board?
      description: 'Magsimula sa iyong timbang at istilo ng pagpaddle: gustong-gusto ng mga baguhan at pamilya ang malalapad at matatag na platform tulad ng SUP Explorer 11; mas gusto ng mga yoga paddler ang full-deck traction; gusto ng mga touring paddler ng matibay at streamlined na hugis. Masaya kaming irekomenda ng aming team.'
      icon: tabler:help-circle
    - title: Anong mga paraan ng pagbabayad ang tinatanggap ninyo?
      description: Tumatanggap kami ng mga pangunahing credit card, PayPal, at bank transfer. Kasama sa lahat ng presyo ang kumpletong package — walang nakatagong dagdag.
      icon: tabler:currency-dollar
    - title: Gaano katagal ang delivery?
      description: Ang mga order ay ipinapadala mula sa aming pabrika at karaniwang dumarating sa loob ng 5-10 araw ng trabaho depende sa iyong rehiyon. May tracking para sa bawat order.
      icon: tabler:truck-delivery
    - title: Saklaw ba ng warranty ang aking board?
      description: Oo — bawat board ay sakop laban sa mga depekto sa paggawa, at bawat yunit ay sinusubok sa presyon na 1.25x ng nakasaad na presyon nito sa loob ng 24-48 oras bago umalis sa pabrika. Ang aming rate ng pag-angkin sa warranty ay mas mababa sa 2%.
      icon: tabler:shield-check
cta:
  title: Kailangan ng tulong sa paghahanap ng tamang board?
  subtitle: Makipag-ugnayan sa aming koponan para sa tapat na payo tungkol sa pagpili ng board, laki, o mga tanong sa order.
  actions:
    - variant: primary
      text: Makipag-ugnayan sa aming team
      href: /contact
