hero_text:
  tagline: Mga Mapagkukunan
  title: Download Center at Gabay para sa Bumibili
  subtitle: Mag-access ng mga katalogo ng produkto, OEM na gabay, checklist para sa bumibili, at teknikal na dokumentasyon upang matulungan kang gumawa ng may kaalamang desisyon sa pagbili.
features3_downloads:
  tagline: Downloads
  title: Dokumentasyon ng Produkto<br />at Mga Mapagkukunan para sa Bumibili
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 Katalogo ng Produktong Pandagat
      description: Kumpletong hanay ng produkto kabilang ang RIB na mga bangka, inflatable na bangka, SUP na boards, kayaks, at mga accessories. Mga espesipikasyon, konfigurasyon, at mga opsyon. PDF format.
      icon: tabler:file-text
    - title: OEM Gabay sa Paggawa
      description: 'Lahat ng kailangan mong malaman tungkol sa OEM/ODM na mga pakikipagtulungan: pangkalahatang proseso, minimum na dami ng order, opsyon sa pagpapasadya, kontrol sa kalidad, at pagpapadala.'
      icon: tabler:building-factory
    - title: RIB Gabay para sa Bumibili ng Bangka
      description: "Paano pumili ng tamang RIB: materyal ng hull, materyal ng tubo, pagpili ng makina, konsiderasyon sa laki, at mga opsyon sa konfigurasyon para sa iba't ibang aplikasyon."
      icon: tabler:file-description
    - title: SUP Tseklist ng Supplier
      description: 'Mga pangunahing konsiderasyon sa pagpili ng SUP na gumagawa ng board: mga indikasyon ng kalidad, mga kinakailangan sa sertipikasyon, MOQ na konsiderasyon, at kung ano ang hahanapin sa isang audit ng pabrika.'
      icon: tabler:clipboard-check
    - title: Gabay sa Materyales ng Inflatable na Bangka
      description: "PVC vs Hypalon: paghahambing sa tibay, UV resistance, haba ng buhay, opsyon sa pag-aayos, at mga konsiderasyon sa gastos para sa iba't ibang aplikasyon sa dagat."
      icon: tabler:files
    - title: Template para sa Custom Manufacturing Brief
      description: I-download ang aming template ng product brief. Punan ang iyong mga kinakailangan at ibalik ito sa amin para sa pagsusuri ng quotation at feasibility sa parehong linggo.
      icon: tabler:template
faqs:
  title: Mga Madalas Itanong
  subtitle: Karaniwang mga tanong tungkol sa aming mga produkto, proseso ng paggawa, at modelo ng pakikipagsosyo.
  columns: 2
  items:
    - title: Ano ang minimum na dami ng order?
      description: MOQ ay nag-iiba depende sa kategorya ng produkto. Ang RIB na mga bangka ay kadalasang nagsisimula sa 10 yunit bawat modelo. SUP na mga boards mula sa 50 yunit. Makipag-ugnayan sa aming sales team para sa produktong espisipikong MOQ na impormasyon.
      icon: tabler:help-circle
    - title: Maaari ba akong makakuha ng sample bago maglagay ng order?
      description: Oo. Nagbibigay ang Aquafarer ng sample production para sa pagsusuri bago ang mass production. Ang mga gastos sa sample ay maaaring pag-usapan at madalas na ikakredit sa unang production order.
      icon: tabler:package
    - title: Ano ang mga available na term ng pagbabayad?
      description: Karaniwang term ay 30% deposito sa order, 70% bago ipadala. Ang LC term ay available para sa kwalipikadong mga customer. Makipag-ugnayan sa aming finance team upang talakayin ang mga kaayusan.
      icon: tabler:currency-dollar
    - title: Gaano katagal ang produksyon?
      description: 'Karaniwang lead time: RIB na mga bangka 30-45 araw, SUP na mga boards 20-30 araw, inflatable na mga bangka 25-35 araw. Ang custom development ay nagdadagdag ng 15-30 araw para sa prototyping.'
      icon: tabler:calendar-clock
    - title: Ano ang mga sertipikasyon na taglay ng inyong mga produkto?
      description: CE sertipikasyon para sa merkado ng EU, US Coast Guard na aprubadong paggawa, ISO quality system, BSCI compliance, at REACH material compliance.
      icon: tabler:certificate
    - title: Nag-aalok ba kayo ng pasadyang packaging at pagbibigay ng tatak?
      description: Oo. Nagbibigay kami ng pasadyang packaging na may iyong logo, kulay, at pagkakakilanlan ng tatak. MOQ para sa pasadyang packaging ay nakadepende sa kategorya ng produkto.
      icon: tabler:color-swatch
cta:
  title: Kailangan ng tulong sa paghahanap ng tamang mapagkukunan?
  subtitle: Makipag-ugnayan sa aming koponan para sa personalisadong gabay sa pagpili ng produkto, OEM pakikipagtulungan, o teknikal na detalye.
  actions:
    - variant: primary
      text: Makipag-ugnayan sa aming team
      href: /contact
