tests:
  - title: Pagsusuri sa Presyon
    standard: ISO 6185-1 | Internal na Spec AF-PT-001
    description: Ang mga inflatable na silid ay pinapainit sa presyon na 1.25x ng inirerekomendang limitasyon sa operasyon at pinananatili sa loob ng 30 minuto. Sinusukat ang pagbaba ng presyon upang mapatunayan ang pagiging airtight at integridad ng istruktura ng mga materyal at tahi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Pagsusuri sa Epekto
    standard: Internal na Spec AF-IT-002
    description: Ang mga produkto ay sinasalubong ng kontroladong mga epekto mula sa standardized na mga drop weight at pendulum apparatus. Sinusuri nito ang resistensya sa tusok, paglaganap ng punit, at katatagan ng istruktura laban sa banggaan sa mga hadlang, pantalan, at debris.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Pagsusuri sa Resistensya
    standard: ASTM G154 | ISO 4892-3
    description: Ang mga sample ng materyal ay inilalantad sa mga UVA-340 na lamp sa pinabilis na weathering chambers sa loob ng 1,000+ na oras. Sinusukat namin ang pagbabago ng kulay (Delta E), pagpapanatili ng gloss, at pagkawala ng tensile strength upang mapatunayan ang UV stabilizer packages.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Pagsusuri sa Abrasiyon
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Ang mga sample ng materyal ay pinapailalim sa mga CS-10 abrasive wheel sa ilalim ng 500g/1,000g na load sa loob ng 1,000 cycles. Sinusuri ang pagkawala ng masa at visual na grading ng pagkasira upang matukoy ang tibay ng coating laban sa buhangin, graba, at paulit-ulit na paglulunsad.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Pagsusuri sa Pagganap sa Mababang Temperatura
    standard: Internal na Spec AF-LT-003 | MIL-STD-810G
    description: Ang mga buo na produkto at material coupons ay tinitiyak sa -20°C, -10°C, at 0°C sa loob ng 24 na oras at pagkatapos ay sinusuri ang flex. Tinitiyakin namin na ang PVC at Hypalon ay nananatiling flexible nang walang bitak o delaminasyon.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Pagsusuri sa Pag-aanod at Kakayahan sa Load
    standard: ISO 6185-1 | ISO 12402
    description: Ang mga produkto ay pinapalitanang load hanggang 1.25x ng rated capacity sa kontroladong pool. Tinatala ang freeboard, katatagan, at performance ng self-draining. Ang rated capacity ng bawat modelo ay matematikal at empirikal na pinapatunayan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Pagsusuri sa Maneuverability
    standard: Internal na Spec AF-MT-004
    description: Sa on-water trials sinusukat ang turning radius, acceleration, planing time, at paddle/motor response sa iba't ibang load conditions. Ang mga katangian ng totoong mundo sa paghawak ay pinatutunayan laban sa mga target ng disenyo.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Pagsusuri sa Watertightness
    standard: ISO 6185-1 §7.3 | Internal na Spec AF-WT-005
    description: Ang bawat buo na produkto ay tinutesting sa spray sa 0.5 bar sa lahat ng tahi, valve, at fittings. Isang 5-minutong pressurized submersion test ang nagpapatunay sa watertightness ng chamber at valve. Zero-leak na pamantayan bago ipadala.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: Mga Proseso ng Pagsusuri
  title: Mahigpit na Pagsusuri sa Bawat Yugto
commitment:
  title: Ang Aming Pangako
  body: Sa pamamagitan ng mga mahigpit na proseso ng pagsusuri na ito, nagbibigay ang {SITE} sa mga customer ng kasiguruhan na ang aming inflatable SUPs at mga bangka ay hindi lamang mataas ang performance kundi pati na rin matibay — tinitiyak ang walang katapusang masaya at ligtas na mga pakikipagsapalaran sa tubig. Ang aming quality lab ay independiyente sa produksyon at direktang nag-uulat sa pamunuan.
  cta: Humiling ng dokumentasyon ng pagsusuri
  cta_link: /contact
