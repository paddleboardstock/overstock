content_version_control:
  tagline: kontrol sa bersyon
  title: Bersyon ng Pagguhit<br />Pamamahala
  subtitle: Bawat guhit ay sumusunod sa kontroladong sistema ng rebisyon. Laging tiyakin na mayroon kang kasalukuyang rebisyon bago gamitin ang mga guhit para sa pagpaplano ng proyekto.
  items:
    - title: Pagsubaybay sa Rebisyon
      description: Bawat guhit ay may rebisyon na code (Rev-A, Rev-B, Rev-C), petsa ng isyu, huling petsa ng pagsusuri, angkop na modelo/konfigurasyon, mga yunit, laki ng file, at format. Tanging ang "Kasalukuyang" rebisyon lamang ang maaaring i-download.
      icon: tabler:git-branch
    - title: Paunawa sa Status ng Pagguhit
      description: Lahat ng pampublikong guhit ay may markang "Preliminary layout only — hindi para sa konstruksyon, sertipikasyon, o paggamit sa produksyon. Ang mga sukat ay nakadepende sa pinal na espesipikasyon at kumpirmasyon ng order." Pinoprotektahan nito ang parehong panig mula sa maling paggamit.
      icon: tabler:alert-circle
    - title: I-update ang mga Notipikasyon
      description: Kapag nagbago ang model specification, ina-update ang drawing revision at ang mga naunang bersyon ay minamarkahan na "Superseded." Ang mga rehistradong user na nag-download ng DXF/DWG packs ay inaabisuhan ng mahahalagang update sa pamamagitan ng email.
      icon: tabler:bell
faq:
  title: Teknikal na Guhit — Mga Madalas Itanong
  questions:
    - q: Talaga bang libre ang mga GA PDFs?
      a: Oo. Ang mga general arrangement PDF para sa aming mga pangunahing modelo ay available nang libre — kumpletuhin ang maikling form ng kwalipikasyon sa ibaba at ang link para sa pag-download ay ipapadala sa pamamagitan ng email sa loob ng 1 araw ng negosyo. Naglalaman ito ng impormasyon sa antas ng pagpaplano na sapat para sa pagsusuri ng proyekto, alokasyon ng espasyo, at paunang pagsusuri ng espesipikasyon.
    - q: Paano ko maa-access ang DXF/DWG files?
      a: Kumpletuhin ang maikling form ng kwalipikasyon sa pahina ng pag-download kasama ang pangalan ng iyong kumpanya, uri ng proyekto, at nilalayong gamit. Ang mga aprubadong kahilingan ay makakatanggap ng link sa pag-download sa pamamagitan ng email sa loob ng 1 araw ng trabaho.
    - q: Pwede ba akong makakuha ng STEP/IGES 3D models?
      a: Ang STEP o IGES 3D model files ay available sa pamamagitan ng aming proseso ng aplikasyon ng proyekto. Ibigay ang saklaw ng iyong proyekto, mga kinakailangan sa integrasyon, timeline, at intensyon ng pagbili. Maaaring maaprubahan — karaniwan sa loob ng 3-5 araw ng trabaho.
    - q: Bakit nililimitahan ang access sa mas detalyadong mga file?
      a: Ang hull geometry, mold data, at structural calculations ay kumakatawan sa mga taon ng R&D investment at core manufacturing IP. Nagbibigay kami ng lahat ng kailangan para sa procurement planning at project integration habang pinoprotektahan ang kakayahan naming magpatuloy sa pag-invest sa pag-develop ng bagong produkto.
    - q: Kasama ba sa mga guhit ang mga detalye ng paggawa?
      a: Hindi. Ang mga pampubliko at magaan na guhit ay naglalaman ng impormasyon sa antas ng procurement para sa pagpaplano at espesipikasyon. Ang mga detalye sa antas ng paggawa (mga iskedyul ng laminasyon, mga landas ng kagamitan, pagpapalawak ng pagputol) ay ibinabahagi lamang NDA sa ilalim ng kumpirmadong mga order.
    - q: Available ba ang mga guhit para sa custom o semi-custom RIB na mga konfigurasyon?
      a: Ang mga custom na guhit ng proyekto ay inihahanda bilang bahagi ng OEMODM proseso / pag-develop. Kung sinusuri mo ang isang custom RIB na proyekto, makipag-ugnayan sa amin para sa iyong mga pangangailangan at magbibigay kami ng mga GA drawing na partikular sa proyekto bilang bahagi ng panukala.
