hero:
  tagline: Mga Teknikal na Guhit at CAD
  title: RIB at Inflatable na Bangka<br />Mga Download ng Teknikal na Guhit at CAD
  subtitle: Mga guhit ng pang-plano na antas ng GA, mga sheet ng dimensyon, at layout ng deck para sa pagsusuri ng proyekto at espesipikasyon. Maaaring ma-access ang mga teknikal na guhit sa tamang antas — mula sa mga pampublikong PDF hanggang sa mga file ng STEP na antas ng proyekto.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB mga teknikal na guhit at CAD na download ng bangka
direct_answer: Aquafarer nagbibigay ng mga teknikal na guhit sa antas ng pagkuha para sa RIB mga bangka at inflatable na sasakyang pantubig — kabilang ang mga PDF ng pangkalahatang ayos (GA), mga sheet ng dimensyon, at mga layout ng deck. Ang mga format na may mas detalyado (DXF/DWG, STEP/IGES) ay magagamit sa pamamagitan ng kwalipikadong pagtatanong o aplikasyon ng proyekto.
stats:
  - value: GA PDF
    label: Libre ang Pag-download
    detail: Pangkalahatang ayos ayon sa modelo
  - value: DXF/DWG
    label: Access ng Light Form
    detail: 2D CAD sa antas ng plano
  - value: STEP/IGES
    label: Aplikasyon ng Proyekto
    detail: 3D na modelo para sa integrasyon
  - value: NDA Lamang
    label: Mga Guhit ng Estruktura
    detail: Hull lamination, data ng hulma
content_tiers:
  tagline: Mga Antas ng Pag-download
  title: Apat na Antas ng Access<br />— Ang Tamang Detalye para sa Tamang Yugto
  subtitle: Nagbibigay kami ng mga guhit sa antas ng pagkuha, hindi mga file sa antas ng paggawa. Ang bawat tier ay tumutugma sa ibang yugto ng proyekto.
  items:
    - title: Tier 1 — Pampublikong PDF
      description: Pangkalahatang ayos (GA), 4-na-view na guhit ng dimensyon, at layout ng deck sa PDF na format. Magagamit nang libre sa pag-download. Sapat para sa pagpaplano ng proyekto, alokasyon ng espasyo, at paunang pagsusuri ng espesipikasyon.
      icon: tabler:file-type-pdf
    - title: Tier 2 — Light Form DXF/DWG
      description: 2D CAD na mga file (DXF o DWG) para sa integrasyon ng layout sa antas ng plano. Nangangailangan ng maikling form ng kwalipikasyon (pangalan ng kumpanya, uri ng proyekto, layunin ng paggamit). Walang kasama na datos ng estruktura o paggawa.
      icon: tabler:file-code
    - title: Tier 3 — Aplikasyon ng Proyekto STEP/IGES
      description: 3D na mga file ng modelo (STEP o IGES) para sa integrasyon ng sistema, disenyo ng outfitting, o koordinasyon sa arkitekturang pandagat. Nangangailangan ng aplikasyon ng proyekto na may saklaw, timeline, at intensyon ng pagbili. Sumailalim sa pag-apruba.
      icon: tabler:cube
    - title: Tier 4 — NDA Engineering
      description: Mga guhit ng estruktura ng bangka, mga iskedyul ng lamination, pagpapalawak ng paggupit ng tubo, at data ng hulma. Magagamit lamang sa ilalim ng NDA na may nakumpirmang mga order. Ito ay mga file sa antas ng paggawa — hindi para sa pampublikong distribusyon.
      icon: tabler:lock
content_included:
  tagline: Ano ang Kasama
  title: Nilalaman ng Drawing<br />Bawat Modelo
  subtitle: Bawat modelo ay may standard na drawing package na sumasaklaw sa mahahalagang impormasyon sa pagpaplano para sa B2B mga buyer at project engineer.
  items:
    - title: Pangkalahatang Ayos (GA)
      description: Side profile, top view, at cross-section na nagpapakita ng hull form, posisyon ng tube, lokasyon ng console, upuan, fuel system, at mga pangunahing sukat (LOA, beam, tube diameter, deadrise angle). Status ng rebisyon at copyright ay nakasaad sa title block.
      icon: tabler:layout
    - title: 4-View na Pagguhit ng Dimensyon
      description: Tanaw sa gilid, harap, likod, at itaas na may kabuuang sukat para sa pagpaplano ng transportasyon (taas sa trailer, beam para sa container, bigat para sa pag-angat). Kasama ang mga operational at transport configuration.
      icon: tabler:ruler-2
    - title: Layout ng Deck at Plano ng Kagamitan
      description: Top-down deck view na nagpapakita ng base ng console, posisyon ng upuan, lokasyon ng D-ring, posisyon ng navigation light, access sa bilge pump, battery/fuel compartment, at mga mounting point ng kagamitan. Limitadong katumpakan sa proprietary interfaces.
      icon: tabler:map
    - title: Pagguhit ng Transportasyon at Pag-iimpake
      description: Plano ng paglo-load ng lalagyan, sukat ng cradle, pamamahagi ng timbang, at mga posisyon ng lifting point para sa pagpaplano ng logistics. Kasama ang mga standard at custom na opsyon sa packaging.
      icon: tabler:truck
content_protection:
  tagline: Proteksyon ng IP
  title: Ano ang Hindi Namin Ibinabahagi<br />& Bakit
  subtitle: Ang pagprotekta sa aming engineering IP ay nagsisiguro na maaari kaming magpatuloy sa pag-invest sa R&D habang naibibigay pa rin ang lahat ng kailangan ng mga mamimili para sa pagpaplano ng proyekto.
  items:
    - title: Datos ng Core ng Hull Mold
      description: Ang plug and mold geometry, CNC tool paths, at lamination templates ay proprietary manufacturing assets. Hindi ito pinagsasaluhan sa anumang access tier maliban sa NDA kumpirmadong kontrata.
      icon: tabler:ban
    - title: Pagpapalawak ng Pagputol ng Tubo
      description: Ang flat-pattern cutting files para sa tube fabric ay datos sa antas ng paggawa. Available lamang NDA sa ilalim ng kumpirmadong production orders at ibinabahagi lamang sa kontratista.
      icon: tabler:ban
    - title: Mga Kalkulasyon sa Estruktura
      description: Ang detalyadong pagsusuri ng stress, mga resulta ng FEA, at mga iskedyul ng laminate ay mga dokumentong sensitibo sa pagsunod na ibinabahagi lamang sa mga Notified Bodies at NDAmga kliyenteng nakatali sa panahon ng proseso ng pagsusuri ng pagsunod.
      icon: tabler:ban
    - title: Pagsusuri ng mga Kalahok
      description: Nananatili sa amin ang karapatang tanggihan ang mga kahilingan para sa CAD access na tila mula sa mga kakumpitensya, mga estudyanteng walang konteksto ng proyekto, o mga partido na walang lehitimong intensyon sa pagkuha.
      icon: tabler:shield
