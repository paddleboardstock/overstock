hero:
  tagline: Pandaigdigang Pagpapadala
  title: Pandaigdigang Pagpapadala —<br />Express & Sea Freight sa 50+ Bansa
  subtitle: Bawat order ay ipinapadala mula sa aming logistics base sa Weihai, China. Pumili ng express air freight para sa mga sample at agarang restock, o pinagsamang sea freight para sa mga wholesale order ng maliliit na negosyo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP mga board na nakapack para sa internasyonal na pagpapadala
direct_answer: Paddle Board Overstock nagpapadala sa mahigit 50 bansa mula Weihai, China. Ang express air freight ay nagdadala ng 1–3 boards, sample orders, at agarang restocks; ang consolidated sea freight ay ang matipid na opsyon para sa 5–20 board wholesale orders. Bawat shipment ay may door-to-door tracking, at bawat board ay 100% pressure-tested at nakapack ng kumpletong accessory kit bago ipadala.
tldr_points:
  - 'Express air freight: 1–3 boards, samples, agarang restock — pinakamabilis na opsyon'
  - 'Sea freight: 5–20 board wholesale orders — pinakamababang gastos sa kargamento kada board'
  - Pagsubaybay mula pintuan hanggang pintuan sa bawat padala sa 50+ bansa
  - Ang freight, insurance, customs clearance, at import duties ay nakalista sa iyong quote — walang malabong pangakong all-in
from_china:
  tagline: Pagpapadala mula sa China
  title: Saan Nagpapadala ang mga Order
  description: Lahat ng order ay ipinapadala mula sa aming logistics base sa Weihai, China — ang puso ng aming operasyon sa produksyon at warehousing. Ang Weihai ay isang pangunahing baybaying pantalan sa lalawigan ng Shandong na may direktang koneksyon sa dagat at himpapawid na kargamento, na nagpapanatili ng kompetitibong oras ng transit at gastos sa kargamento sa mga destinasyon sa Asia, Americas, Africa, Europe, at Middle East.
modes_section:
  tagline: Dalawang Opsyon
  title: Express Shipping o Sea Freight
  subtitle: Ang tamang paraan ng pagpapadala ay nakadepende sa bilis ng iyong pangangailangan sa mga board at kung ilan ang i-order mo. Parehong mga opsyon ay naka-quote sa bawat pagtatanong.
  express:
    name: Opsyon A — Express Shipping
    best_for: Pinakamainam para sa 1–3 boards, samples, at agarang restock
    description: Ang Air Express ay nakakatanggap ng maliliit na order at sample board sa iyong pintuan sa loob ng ilang araw, hindi linggo. Ideal ito kapag sinusubukan mo ang isang modelo bago ang mas malaking order, o nagre-restock ng best-seller sa kalagitnaan ng season.
    features:
      - 1–3 boards, single models, o mixed model samples
      - Pinakamabilis na transit sa dalawang opsyon — naka-quote kada destinasyon
      - Pagsubaybay mula door-to-door gamit ang isang malaking express carrier
      - 'Karaniwang gamit: mga sample, agarang restock, maliliit na unang order'
  sea:
    name: Opsyon B — Sea Freight
    best_for: Pinakamainam para sa 5–20 board wholesale at retailer orders
    description: Ang pinagsama-samang sea freight ang matipid na pagpipilian para sa mga wholesale order ng maliliit na negosyo. Pinagsasama-sama ang mga board sa isang pinagsamang padala mula sa Weihai, kaya mababa ang gastos sa kargamento kada board.
    features:
      - 5–20 board retailer at wholesale na order
      - Pinakamababang gastos sa kargamento kada board sa dalawang opsyon
      - Pinagsamang pag-iimpake — isang padala, isang clearance
      - 'Karaniwang gamit: seasonal restocks, mixed model wholesale orders'
