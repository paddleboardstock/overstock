process_section:
  tagline: Paano Gumagana ang Pagpapadala
  title: Mula sa Aming Bodega Patungo sa Iyong Pintuan
  steps:
    - title: Quote Kasama ang Mga Opsyon sa Kargamento
      description: Bawat quote ay naglalaman ng detalyadong opsyon sa kargamento para sa iyong destinasyon — express at dagat — kasama ang tinatayang oras ng pagbiyahe, kaya walang desisyon na ginagawa para sa iyo.
    - title: Pagsusuri sa Kalidad at Pag-iimpake
      description: Lahat ng board ay 100% nasusubok sa presyon, pagkatapos ay naipapack kasama ang pump, paddle, leash, fin, backpack, at repair kit — ang parehong kumpletong pakete na binebenta namin.
    - title: Pagpapadala Mula sa Weihai
      description: Ang iyong padala ay aalis mula sa aming logistics base gamit ang piniling paraan ng pagpapadala at ibinabahagi sa iyo ang door-to-door tracking sa parehong araw.
    - title: Paglilinaw sa Customs
      description: Nagbibigay kami ng commercial invoice at packing list na kailangan mo para sa import. Ang import duties at buwis sa iyong bansa ay responsibilidad ng importer — tingnan ang seksyon ng customs sa ibaba.
    - title: Paghahatid at Inspeksyon
      description: Suriin ang iyong padala pagdating. Kung may nasira o nawawala, makipag-ugnayan sa amin gamit ang mga larawan at numero ng iyong order — tingnan ang aming polisiya sa nawawala at nasirang produkto sa ibaba.
customs_section:
  tagline: Customs at Duties
  title: Customs Duties at Import Taxes
  subtitle: Pinananatili naming malinaw ang mga responsibilidad sa kargamento sa halip na magbigay ng malabo na pangako. Narito ang eksaktong sino ang responsable sa anong bagay.
  items:
    - title: Ano ang Sinasaklaw Namin
      description: Kasama sa iyong quote ang gastos sa kargamento patungo sa iyong destinasyon, at inihahanda at ibinibigay namin ang lahat ng dokumento para sa export — commercial invoice, packing list, at pagsubaybay ng padala.
    - title: Ano ang Saklaw ng Importer
      description: Ang import duties, VAT/GST, at anumang buwis sa bansa ng destinasyon ay babayaran ng importer (ikaw o ang iyong negosyo) alinsunod sa patakaran ng iyong bansa. Hindi namin pinagsasama ang malabong pangako ng buwis sa aming mga quote sa kargamento.
    - title: Suporta sa Paglilinaw sa Customs
      description: Kumpleto at pare-pareho ang aming mga papeles — tama ang HS codes, declared values, at board specifications — na siyang dahilan kung bakit maayos ang clearance. Kung kailangan ng iyong broker o customs office ng karagdagang dokumentasyon, kami ang nagbibigay nito.
    - title: Suriin ang iyong lokal na presyo bago mag-order
      description: Nagkakaiba-iba ang mga rate ng duty sa inflatable water sports equipment depende sa bansa. Suriin ang mga patakaran sa import ng iyong bansa o magtanong sa iyong inquiry — kasama sa aming regional market guides ang customs notes para sa mga pangunahing merkado.
lost_damaged:
  title: Nawala o Nasirang Padala
  description: Suriin ang iyong delivery pagdating nito. Kung sakaling may dumating na board na sira o may nawawalang package, makipag-ugnayan agad sa amin gamit ang iyong order number at malinaw na larawan ng packaging at board. Sinusuri namin ang bawat case nang paisa-isa — depende sa case, ibig sabihin ay replacement part, replacement board, o refund para sa apektadong item. Ang mga depekto sa paggawa ay hiwalay na sakop ng aming 2-Year SUP Warranty.
destinations_section:
  tagline: Saan Kami Nagpapadala
  title: 50+ Bansa at Patuloy
  description: Nagpapadala kami sa buong mundo, na may detalyadong mga gabay para sa aming mga pangunahing rehiyonal na merkado. Bawat market guide ay sumasaklaw sa mga lokal na uri ng customer, shipping notes, at mga tip sa customs para sa rehiyong iyon.
  regions_label: Mga Rehiyonal na Gabay
  countries_label: Mga Gabay sa Bansa
faq_section:
  title: Mga FAQ sa Pagpapadala
  items:
    - q: Gaano katagal ang express shipping?
      a: Ang express transit time ay nakadepende sa destinasyon — binabanggit namin ang tinatayang transit time para sa iyong bansa sa bawat inquiry, bago ka magdesisyon sa anumang bagay.
    - q: Gaano katagal ang kargamento sa dagat?
      a: Nagkakaiba-iba ang transit sa dagat depende sa destinasyon ng pantalan at iskedyul ng paglalayag. Nagbibigay kami ng tinatayang window para sa iyong destinasyon sa iyong order, at makakatanggap ka ng tracking kapag umalis na ang padala.
    - q: Alin na paraan ng pagpapadala ang dapat kong piliin?
      a: Express para sa 1–3 boards, samples, o agarang restocks. Sea freight para sa 5–20 board wholesale orders kung saan mas mahalaga ang gastos kada board kaysa bilis. Siniquote namin pareho para maikumpara mo.
    - q: Kasama ba ang import duties at buwis sa gastos sa pagpapadala?
      a: Wala. Ang kargamento ay hiwalay na binibigyang-quote at ang import duties, VAT/GST, at destination taxes ay responsibilidad ng importer ayon sa mga patakaran ng inyong bansa. Nagbibigay kami ng kumpleto at tumpak na mga dokumento upang mapanatiling maayos ang clearance.
    - q: Nagpapadala ba kayo sa aking bansa?
      a: Nagpapadala kami sa 50+ bansa. Tingnan ang aming mga regional at country guides sa ibaba, o magtanong lang sa iyong inquiry — kukumpirmahin namin ang kasalukuyang serbisyo sa iyong address.
    - q: Maaari ko bang subaybayan ang aking order?
      a: Oo. Bawat padala — express man o dagat — ay may kasamang door-to-door tracking na ibinabahagi namin sa iyo sa araw ng pagpapadala.
