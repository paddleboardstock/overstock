content_founding:
  tagline: Ang Simula
  title: Ipinanganak sa Baybayin
  subtitle: 'Nagsimula ang Aquafarer sa isang coastal workshop sa Qingdao na may isang bangka at isang bisyon: gumawa ng inflatable na sasakyang pantubig na kayang harapin ang totoong kundisyon ng dagat.'
  paragraphs:
    - Noong 2012, nakita ng aming mga tagapagtatag ang isang puwang sa merkado — karamihan sa inflatable na bangka ay alinman sa abot-kaya ngunit hindi maaasahan, o mataas ang kalidad ngunit sobrang mahal. Naniniwala sila na may puwang para sa isang tagagawa na naghahatid ng parehong kalidad at halaga.
    - Ang unang hull ay ginawa nang mano-mano, sinubukan sa lokal na tubig, at pinino batay sa totoong feedback mula sa mga mangingisda at maliliit na komersyal na operator. Ang feedback loop na iyon — build, test, listen, improve — ay nananatiling sentro ng ating pilosopiya sa engineering hanggang ngayon.
    - Pagsapit ng 2015, kumalat na ang balita lampas sa Qingdao. Nagsimulang humingi ng sample ang mga internasyonal na distributor. Ang nagsimula bilang lokal na workshop ay naging pandaigdigang supplier.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer maagang pagawaan ng produksyon at paggawa
content_growth:
  tagline: Paglago at Inobasyon
  title: Mula sa Pagawaan hanggang sa 12,000 m² na Pasilidad
  subtitle: Ang tuloy-tuloy na pamumuhunan sa tao, kagamitan, at proseso Aquafarer ay naging isang modernong pasilidad ng paggawa sa dagat.
  paragraphs:
    - Habang lumalaki ang demand, lumaki rin ang aming pasilidad. Pinalawak namin mula sa maliit na workshop patungo sa 12,000 m² na pabrika na may dedikadong linya ng produksyon para sa RIB mga bangka, inflatable boats, SUP boards, at accessories.
    - Nag-invest kami sa CNC mga cutting machine, high-frequency welding equipment, drop stitch production lines, at komprehensibong testing rigs — na nagpapahintulot sa amin na kontrolin ang bawat aspeto ng kalidad ng produksyon.
    - Sa kasalukuyan, ang aming koponan na binubuo ng 200-300 ay binubuo ng mga marine engineer, material scientist, mga espesyalista sa quality control, at mga bihasang manggagawa — marami sa kanila ay kasama Aquafarer na mula pa noong mga unang panahon.
content_mission:
  tagline: Ang Aming Misyon
  title: Kalayaan sa Inhinyeriya sa Tubig
  subtitle: Ang bawat produktong Aquafarer ay idinisenyo upang tulungan ang mga tao na mag-explore, magtrabaho, at umunlad sa tubig — nang maaasahan, ligtas, at abot-kaya.
  list:
    - Disenyo ng mga sasakyang pantubig na gumagana sa totoong kundisyon sa dagat — hindi lamang sa papel
    - Bumuo ng pangmatagalang pakikipagtulungan sa mga distributor at tatak sa pamamagitan ng maaasahang OEM/ODM serbisyo
    - Patuloy na pagbutihin ang aming mga proseso sa paggawa upang makapaghatid ng mas mahusay na halaga
    - Suportahan ang bawat produkto gamit ang tunay na mga piyesang pangkapalit at teknikal na kadalubhasaan
cta:
