content_scope:
  tagline: Saklaw ng Pagsunod
  title: Aling Mga Produkto ang Kailangan<br />RCD Pagsunod?
  subtitle: Ang Direktiba sa Pampalipas-oras na Sasakyang-Dagat 2013/53/EU ay nalalapat sa mga pampalipas-oras na sasakyang-dagat na may haba ng hull na nasa pagitan ng 2.5 m at 24 m. Ang pag-unawa sa saklaw ay ang unang hakbang patungo sa pagsunod.
  items:
    - title: RIB Mga Bangka (2.5–24 m)
      description: Ang mga rigid inflatable boat na may haba ng katawan mula 2.5 m hanggang 24 m ay kabilang sa RCD. Ang mga kategorya ng disenyo A hanggang D ay naaangkop depende sa mga inaasahang kondisyon sa dagat at maximum na lakas ng hangin.
      icon: tabler:sailboat
    - title: Mga Ligid na Bangka (mas mababa sa 2.5 m)
      description: Ang maliliit na inflatable na bangka at dinghy na mas mababa sa 2.5 m ay maaaring bahagyang mabawasan sa RCD ngunit kailangan pa rin ng pagmamarka ng CE alinsunod sa iba pang naaangkop na direktiba at pamantayan sa konstruksyon ng EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Mga Lupon at Kagamitan
      description: Ang mga stand-up paddle board ay nasa labas ng saklaw ng RCD. Gayunpaman, ang mga kaugnay na personal flotation device (PFD) ay nangangailangan ng CE na marka alinsunod sa Regulasyon ng PPE (EU) 2016/425 na may USCG Type III/V na pag-apruba kung naaangkop.
      icon: tabler:swimming
    - title: Bahagyang Natapos na mga Bangka
      description: Ang mga bangkang naipadala nang walang makina o tiyak na mga kagamitan ay nangangailangan ng Pahayag ng Tagagawa para sa bahagyang tapos na sasakyan, na ang buong pagsunod sa RCD ay tatapusin ng huling tagagawa o importer.
      icon: tabler:tool
content_trust_layers:
  tagline: Tatlong-Patulad na Sistema ng Tiwala
  title: Impormasyon sa Pagsunod<br />— Ibinahagi sa Tamang Antas
  subtitle: Hindi lahat ng data ng pagsunod ay dapat ilagay sa pampublikong website. Sinusunod namin ang tatlong-hakbang na pamamaraan na nagpoprotekta sa IP habang pinapalakas ang tiwala ng mga bumibili.
  items:
    - title: Layer 1 — Pampublikong Website
      description: Mga sangguniang pamantayan, ipinaliwanag ang mga ruta ng pagsunod, inilista ang mga uri ng dokumento, saklaw ng sertipikasyon bawat pamilya ng modelo. Walang aktwal na sertipiko, datos ng pagsubok, o mga detalyeng teknikal na pagmamay-ari.
      icon: tabler:world
    - title: Antas 2 — Pagbabahagi Pagkatapos ng Pagsisiyasat
      description: 'Matapos ang karampatang imbestigasyon: redacted DoC sample, larawan ng plate ng tagagawa, listahan ng naaangkop na pamantayan, checklist ng pagsunod, at mga buod ng sertipikasyon ng materyal — ibinahagi sa ilalim ng mga tuntunin ng patas na paggamit.'
      icon: tabler:mail
    - title: Layer 3 — NDA / Yugto ng Order
      description: Buong teknikal na file, pagsusuri ng panganib, kalkulasyon ng katatagan, mga ulat ng pagsusuri, tala ng batch ng materyales, at dokumentasyon ng pagsubaybay sa produksyon — ibinabahagi lamang sa ilalim ng NDA sa mga kumpirmadong mamimili.
      icon: tabler:lock
content_standards:
  tagline: Mga Naaangkop na Pamantayan
  title: ISO at Pamantayan ng EN<br />Kami Ay Nagtatayo Para
  subtitle: Ang aming mga produkto ay dinisenyo at sinuri ayon sa mga pinagsamang pamantayan sa ilalim ng RCD. Ang mga numero at pangalan ng pamantayan ay tinutukoy; ang buong teksto ng pamantayan ay nananatiling ISO copyright.
  items:
    - title: EN ISO 6185-3
      description: 'Mga lantsang napapalawak — Bahagi 3: Mga bangka na may pinakamataas na kapangyarihan ng motor na 15 kW o higit pa. Mga kinakailangan sa konstruksyon, katatagan, paglutang, at pagbawi ng tao sa tubig para sa RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Mga bangkang inflatable — Bahagi 4: Mga bangka na may pinakamataas na kapangyarihan ng motor na 15 kW at higit sa o katumbas ng 4.5 kW. Karagdagang mga kinakailangan sa istruktura at katatagan.'
      icon: tabler:file-text
    - title: ISO 12215 Series
      description: Maliit na sasakyan — Konstruksyon ng katawan at sukat ng bahagi. Disenyong pang-istruktura ng katawan, deck, at mga bulkhead para sa fiberglass at aluminyo RIB na katawan.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Maliit na sasakyan — Manwal ng may-ari. Kinakailangang nilalaman at format para sa manwal ng may-ari na kalakip ng bawat RIB na bangka na ihahatid sa EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Maliit na sasakyan — Plaka ng tagagawa. Impormasyon na dapat nakatakda sa plaka ng tagagawa na permanenteng nakakabit sa bawat sasakyan.
      icon: tabler:badge
    - title: ISO 8666
      description: Maliit na sasakyan — Pangunahing datos. Isinapormal na mga sukat at parametro para sa pare-parehong espesipikasyon sa lahat ng dokumentasyon ng produkto.
      icon: tabler:dimensions
content_process:
  tagline: Proseso ng Pagsunod
  title: 6-Hakbang na CE Pagsunod<br />Daloy ng Trabaho
  subtitle: Mula sa saklaw ng proyekto hanggang sa traceability sa antas ng serye — ang bawat RIB na modelo ay sumusunod sa isang tinukoy na landas ng pagsunod.
  steps:
    - number: '01'
      title: Saklaw at Pag-uuri ng Proyekto
      description: Tukuyin ang RIB model, kategorya ng disenyo (A/B/C/D), pinakamataas na bilang ng tao, payload, lakas ng makina, at target na merkado. Tukuyin kung naaangkop ang RCD at kung aling module ng pagsusuri ng pagsunod ang kinakailangan.
      timeline: 2–3 araw
    - number: '02'
      title: Pagkilala sa Mga Naaangkop na Kinakailangan
      description: Tukuyin lahat ng naaangkop na Mahahalagang Kinakailangan sa Kaligtasan mula sa RCD Annex I, mga kaugnay na hàrmonisadong pamantayan (EN ISO 6185, 12215, 10240, 14945), at anumang karagdagang pambansang kinakailangan para sa target na merkado.
      timeline: 3–5 araw
    - number: '03'
      title: Disenyo at Teknikal na Dokumentasyon
      description: 'Gumawa ng Master Technical File: mga general arrangement drawing, pagkalkula ng katatagan at buoyancy, pagsusuri ng panganib, pagtukoy ng materyal, at pagsusuri ng kaligtasan ng mga sistema (fuel, elektrikal, manibela).'
      timeline: 10–15 araw
    - number: '04'
      title: Pagpapatotoo at Pagsubok ng Produkto
      description: Isagawa ang pisikal na pagpapatotoo — pressure testing sa 1.25x halaga ng presyon sa loob ng 24–48 oras, stability at buoyancy test, load test, at commissioning ng mga sistema. Itala ang lahat ng resulta ng pagsubok para sa bawat hull.
      timeline: 5–7 araw
    - number: '05'
      title: Marka at Dokumentasyon ng Paghahatid
      description: Ikabit ang CE na marka, builder's plate (EN ISO 14945), at HIN/CIN (hull identification number). Ihanda ang EU Declaration of Conformity, owner's manual (EN ISO 10240), at compliance checklist.
      timeline: 2–3 araw
    - number: '06'
      title: Traceability sa Antas ng Serial
      description: Bawat hull ay tumatanggap ng natatanging Hull Record na nag-uugnay dito sa Master Technical File, batch ng produksyon, sertipiko ng materyales, resulta ng pagsubok, at panghuling configuration. Ang mga rekord ay itinatago ng 10+ taon alinsunod sa RCD.
      timeline: Patuloy
content_document_cards:
  tagline: Mga Uri ng Dokumento
  title: Compliance Document<br />Mga Card
  subtitle: Ito ang mga uri ng dokumento na inihahanda at pinananatili namin para sa bawat CE-certified na RIB model. Ang mga halimbawa ay makukuha sa kwalipikadong pagtatanong.
  items:
    - title: CE / RCD Sertipiko ng Pagsunod
      description: Model-specific na sertipiko na nagkukumpirma na ang sasakyang-dagat ay nakakasunod sa lahat ng naaangkop na Mahahalagang Kinakailangan sa Kaligtasan ng RCD 2013/53/EU, inisyu ng tagagawa na may partisipasyon ng Notified Body kung kinakailangan.
      icon: tabler:certificate
    - title: Pagpapahayag ng Pagsunod ng EU (DoC)
      description: Pinirmahang deklarasyon ng tagagawa o awtorisadong kinatawan, na naglilista ng naaangkop na direktiba, pamantayan, conformity module, at detalye ng Notified Body. Kinakailangan para sa bawat model na inilalagay sa EU market.
      icon: tabler:file-check
    - title: Plaka ng Tagagawa (EN ISO 14945)
      description: Permanenteng ikinakabit na plate na nagpapakita ng pinakamataas na bilang ng tao, pinakamataas na lakas ng makina, kategorya ng disenyo, at pagkakakilanlan ng tagagawa. Dapat manatiling nababasa sa buong buhay ng sasakyan.
      icon: tabler:badge
    - title: Manwal ng May-ari (EN ISO 10240)
      description: Komprehensibong manwal na sumasaklaw sa ligtas na operasyon, emergency procedures, iskedyul ng maintenance, at mga babala sa kaligtasan. Kinakailangan para sa bawat RIB na ihahatid sa EU.
      icon: tabler:book
    - title: ISO Mga Ulat sa Pagsusuri at Inspeksyon
      description: Mga tala ng pressure test (1.25x / 24–48h), resulta ng stability at buoyancy test, sertipiko ng pagsubok ng materyal, at mga ulat ng dimensional na pagpapatotoo — lahat ay naka-link sa partikular na numero ng hull.
      icon: tabler:test-pipe
    - title: Mga Rekord ng Pagsubaybay sa Materyal
      description: Batch-level traceability para sa tube fabric, adhesives, fiberglass, at hardware. Iniuugnay ang bawat production unit sa mga papasok na sertipiko ng materyal at mga resulta ng IQC inspection.
      icon: tabler:link
    - title: Inspeksyon ng Kalidad at Mga Rekord ng QC
      description: 100-point quality checklist kada unit, in-process QC records, non-conformance reports, at corrective actions. Bahagi ng production traceability chain.
      icon: tabler:clipboard-check
    - title: Paketeng Dokumento ng Proyekto
      description: Per-hull documentation package kabilang ang final configuration record, detalye ng engine at equipment installation, commissioning checklist, at delivery documentation.
      icon: tabler:package
content_design_categories:
  tagline: RCD Mga Kategorya ng Disenyo
  title: Kategorya ng Disenyo A–D<br />— Ano ang Ibig Sabihin Nila
  subtitle: RCD Itinalaga nito ang mga kategorya ng disenyo batay sa pinakamataas na lakas ng hangin at makabuluhang taas ng alon na dinisenyo ng sasakyan upang tiisin.
  items:
    - title: Kategorya A — Karagatan
      description: Dinisenyo para sa mahahabang paglalakbay kung saan ang lakas ng hangin ay maaaring lumampas sa Beaufort 8 (>40 knots) at ang makabuluhang taas ng alon ay maaaring lumampas sa 4 m. Nangangailangan ng pinaka-masusing beripikasyon ng estruktura at katatagan.
      icon: tabler:ripple
    - title: Kategorya B — Offshore
      description: Dinisenyo para sa mga paglalakbay sa dagat na may lakas ng hangin hanggang Beaufort 8 (≤40 knots) at makabuluhang taas ng alon hanggang 4 m. Angkop para sa mga baybayin at semi-exposed na tubig.
      icon: tabler:anchor
    - title: Kategorya C — Inshore
      description: Dinisenyo para sa mga paglalakbay sa baybayin na may lakas ng hangin hanggang Beaufort 6 (≤27 knots) at makabuluhang taas ng alon hanggang 2 m. Karamihan sa mga recreational ay RIBs kabilang sa kategoryang ito.
      icon: tabler:sun
    - title: Kategorya D — Sheltered
      description: Dinisenyo para sa mga protektadong tubig na may lakas ng hangin hanggang Beaufort 4 (≤16 knots) at mataas na alon hanggang 0.3 m. Mga lawa, ilog, at protektadong daungan.
      icon: tabler:pool
content_hin:
  tagline: Pagkakakilanlan ng Sasakyan
  title: HIN / CIN at Builder's Plate
  subtitle: RIB Bawat bangka ay nangangailangan ng Hull Identification Number (HIN) o Craft Identification Number (CIN) at builder's plate ayon sa EN ISO 14945 at RCD mga kinakailangan.
  items:
    - title: Numero ng Pagkakakilanlan ng Hull (HIN)
      description: Isang natatanging 14-character code na permanenteng nakamarka sa starboard side ng transom, encoding manufacturer code (MIC), model year, production year, at serial number. Kinakailangan para sa pagpasok sa EU market.
      icon: tabler:hash
    - title: Numero ng Pagkilala sa Gawa (CIN)
      description: Ayon sa EN ISO 10087, isang nakatagong pangalawang numero ng pagkakakilanlan ang inilalagay sa isang nakatagong lugar para sa anti-theft at pagsubaybay.
      icon: tabler:eye-off
    - title: Nilalaman ng Builder's Plate
      description: Pinakamataas na bilang ng tao, pinakamataas na lakas ng makina (kW), pinakamataas na karga (kg), kategorya ng disenyo, pangalan ng tagagawa, at CE marka — lahat ay permanenteng ipinapakita sa isang plato na lumalaban sa kalawang.
      icon: tabler:badge
content_tech_file:
  tagline: Estruktura ng Teknikal na File
  title: Pangunahing Teknikal na File<br />at Talaan ng Hull
  subtitle: 'Ang aming sistema ng dokumentasyon ay sumusunod sa dalawang antas na estruktura: ang Master Technical File para sa bawat pamilya ng modelo, at indibidwal na Hull Records para sa bawat bangkang ginawa.'
  items:
    - title: Pangunahing Teknikal na File
      description: 'Naglalaman ng kumpletong dokumentasyon ng pagsunod para sa isang modelo ng pamilya: pangkalahatang ayos, pagtatasa ng panganib, kalkulasyon ng katatagan/buoyancy, mga espesipikasyon ng materyal, mga naaangkop na pamantayan, at mga tala ng pagsusuri ng pagsunod. Pinananatili sa loob ng 10+ taon.'
      icon: tabler:folder
    - title: Rekord ng Hull (Pagsubaybay sa Bawat Bangka)
      description: 'Bawat hull ay may natatanging rekord na nag-uugnay dito sa Master Technical File: HIN, petsa ng produksyon, batch ng tubo, mga sertipiko ng materyales, resulta ng pressure test, panghuling konfigurasyon, pag-install ng makina, at destinasyon ng paghahatid.'
      icon: tabler:file-description
    - title: Paketeng Pagsunod ng Customer
      description: Per-hull delivery package kabilang ang DoC, builder's plate photo, owner's manual, test summary, at final configuration sheet — kasama ng bawat RIB ipinadala sa EU.
      icon: tabler:package
content_material_cert:
  tagline: Sertipikasyon ng Materyales
  title: Pagsubaybay ng Materyal &<br />Ebidensya ng Sertipikasyon
  subtitle: Nagsisimula ang mga de-kalidad RIB na bangka sa kontroladong mga materyales at dokumentadong mga proseso. Narito kung paano namin inaayos ang sertipikasyon ng materyales para sa bawat kritikal na grupo ng mga bahagi.
  items:
    - title: Pagsubaybay sa Materyal ng Inflatable Tube
      description: PVC ang CSMHypalon mga materyales ng / tubo ay pinipili ayon sa inaasahang paggamit, kondisyon ng klima, at target na merkado. Ang teknikal na datos ng supplier (TDS), impormasyon sa batch ng materyales, traceability ng batch ng tela, UV at mga ulat ng pagsubok sa weathering, at REACHmga deklarasyon ng /SVHC ay makukuha sa loob ng napagkasunduang saklaw ng dokumentasyon ng proyekto.
      icon: tabler:circle
    - title: Pagsubaybay sa Marine Aluminum
      description: Para sa RIB mga proyekto ng aluminum-hull, ang alloy grade, kapal at mga batch ng materyales ay kinokontrol ayon sa aprubadong espesipikasyon. Ang mga sertipiko ng pagsusuri ng materyal (MTC/MTR), EN 10204 3.1 dokumentasyon, mga ulat ng komposisyon ng kemikal at mekanikal na katangian, at pagsubaybay sa heat/lot ay ibinibigay kung napagkasunduan.
      icon: tabler:rectangle
    - title: GRP Hull Material at Kontrol sa Proseso
      description: Para sa fiberglass-hullRIBs, ang gelcoat, resin, fiberglass reinforcement at core materials ay pinamamahalaan sa pamamagitan ng kontroladong specifications. Ang material TDS/SDS, batch records, laminate specifications, at curing at workshop control records ay available kapag napagkasunduan ang proyekto.
      icon: tabler:layers-subtract
    - title: Suporta sa Dokumentasyon ng Komponent
      description: Para sa mga piling bahagi — kabilang ang EVA deck materials, upuan, stainless-steel hardware, fuel systems, electrical equipment, at marine accessories — ang naaangkop na dokumentasyon ng supplier ay kinokoordina batay sa panghuling configuration at mga pangangailangan ng destinasyon-merkado.
      icon: tabler:package
    - title: Paunawa sa Saklaw ng Pagsunod
      description: Ang mga sertipiko, ulat ng pagsubok, at mga dokumento ng pagsunod ay nalalapat lamang sa partikular na modelo ng produkto, materyal, bahagi, batch ng produksyon o saklaw ng proyekto na nakasaad sa kaukulang dokumento. Makipag-ugnayan sa amin kasama ang iyong target na merkado, nilalayong gamit, at mga teknikal na kinakailangan upang makumpirma ang naaangkop na pakete ng dokumentasyon bago maglagay ng order.
      icon: tabler:info-circle
faq:
  title: CE Pagsunod — Mga Madalas Itanong
  questions:
    - q: Lahat ba ng Paddle Board Overstock RIB bangka ay CE sertipikado para sa EU market?
      a: Ang RIB mga bangka sa aming katalogo ay dinisenyo at naidokumento para sa RCD pagsunod ng 2013/53/EU ayon sa mga naaangkop na direktiba ng EU.CE Ang pagmamarka ay naaangkop sa bawat modelo, bawat konfigurasyon. Makipag-ugnayan sa amin para sa isang dokumento ng saklaw ng pagsunod na partikular sa modelo.
    - q: Ano ang pagkakaiba ng RCD compliance at CE pagmamarka?
      a: RCD (Recreational Craft Directive 2013/53/EU) ay ang batas ng EU na nagtatakda ng Mahahalagang Kinakailangan sa Kaligtasan.CE Ang pagmamarka ay ang biswal na simbolo na inilalagay sa isang produkto na nasuri at nakumpirma na tumutugon sa mga kinakailangang iyon. Dapat sumunod ang isang produkto sa mga patakaran RCD bago ito maaaring magdala ng CE marka.
    - q: Nagbibigay ba kayo ng Declarations of Conformity sa bawat bangka?
      a: Oo. Bawat RIB bangka na ihahatid sa merkado ng EU ay may kasamang model-specific na EU Declaration of Conformity na naglilista ng mga naaangkop na direktiba, harmonised standards, conformity assessment module, at mga detalye ng Notified Body.
    - q: Anong conformity assessment module Paddle Board Overstock ang ginagamit?
      a: Ang module ay nakadepende sa kategorya ng disenyo at uri ng bangka. Karamihan RIB sa mga modelo sa Design Category C ay gumagamit ng Module A (internal production control). Para sa mga Design Category A/B na bangka o mga partikular na konfigurasyon, maaaring gamitin ang Module B+C o B+D na may partisipasyon ng Notified Body. Nagbibigay kami ng payo sa angkop na module para sa bawat proyekto.
    - q: Maaari mo bang ibahagi ang dokumentasyon ng pagsunod bago kami maglagay ng order?
      a: Pagkatapos ng kwalipikadong pagtatanong, ibinabahagi namin ang isang dokumento ng saklaw ng pagsunod na naglilista ng mga naaangkop na pamantayan, ruta ng pagsunod, at mga uri ng dokumento na magagamit para sa modelong iyong sinusuri. Ang buong teknikal na mga file ay ibinabahagi sa NDA ilalim ng kumpirmasyon pagkatapos ng order.
    - q: Ano ang Hull Identification Number (HIN) at kasama ba ito?
      a: Ang HIN ay isang 14-character na natatanging identifier na permanenteng nakamarka sa bawat bangka, na nag-eencode ng manufacturer code (MIC), model designation, production year, at serial number. Ito ay mandatory para sa lahat ng RIB bangka na inilalagay sa EU market at kasama sa bawat Paddle Board Overstock RIB.
    - q: Gaano katagal itinatago ang mga teknikal na file?
      a: Ayon sa RCD mga kinakailangan ng 2013/53/EU, kailangang panatilihin ng tagagawa ang teknikal na file nang hindi bababa sa 10 taon mula sa huling petsa ng paglalagay ng produkto sa merkado.Paddle Board Overstock Pinananatili ang kumpletong teknikal na dokumentasyon para sa lahat ng modelong ginawa.
    - q: Tumutulong ka ba sa mga obligasyon ng importer sa ilalim ng RCD?
      a: "Oo. Nagbibigay kami ng dokumentasyon na kailangan ng mga EU importer upang matupad ang kanilang mga obligasyon: technical file access, DoC, builder's plate, owner's manual, at product traceability records. Ang mga responsibilidad ng importer ay RCD malinaw na nakadokumento sa aming compliance guide."
