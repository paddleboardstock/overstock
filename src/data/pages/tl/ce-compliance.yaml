hero:
  tagline: CE at RCD Pagsunod
  title: RIB Bangka CE Pagsunod<br />& Teknikal na Dokumentasyon
  subtitle: Paddle Board Overstock RIB ang mga bangka at inflatable na sasakyang pandagat ay idinisenyo at idokumento para sa pagsunod sa merkado ng EU sa ilalim ng Recreational Craft Directive 2013/53/EU. Mula sa pagtatasa ng panganib hanggang sa Pahayag ng Pagsunod, nagbibigay kami ng dokumentasyon ng pagsunod na tiyak sa modelo para sa bawat hull.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB bangka CE dokumentasyon ng pagsunod at sertipikasyon
direct_answer: Paddle Board Overstock nagbibigay ng model-specific na RCD 2013/53/EU compliance documentation para sa RIB na mga bangka at inflatable na sasakyang-pampasigla sa tubig, kabilang ang technical files, Declarations of Conformity, builder plates, at owner manuals — lahat ay naaayon sa EN ISO 6185, ISO 12217, at mga naaangkop na harmonised standards.
