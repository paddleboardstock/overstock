hero:
  tagline: Aming Koponan
  title: Ang Mga Taong Nasa Likod ng Paddle Board Overstock<br />— Pagbibigay ng Kalayaan sa Tubig sa pamamagitan ng Inhinyeriya
  subtitle: Itinatag noong 2012 sa Qingdao, China, ang Paddle Board Overstock ay itinatag ng mga inhinyero sa dagat, siyentipiko sa materyales, at mga mahilig sa palarong pang-tubig na naniniwala sa paggawa ng mga inflatable watercraft na pang-propesyonal na maaabot ng bawat isa sa buong mundo.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock larawan ng buong koponan — inhinyeriya, produksyon, at pamumuno
founding:
  tagline: Aming Pagtatatag
  title: Mula sa Isang Coastal Workshop<br />Hanggang sa 12,000 m² na Pasilidad
  subtitle: Itinatag ang Paddle Board Overstock ng isang koponan ng mga inhinyero sa dagat na may dekada ng pinagsamang karanasan sa disenyo ng inflatable na bangka, paggawa ng PVC/Hypalon, at pandaigdigang paggawa ng kagamitan sa dagat.
  items:
    - title: 'Itinatag: 2012'
      description: Itinatag sa Qingdao, China — isang pangunahing sentro ng maritime na may mayamang kasaysayan sa paggawa ng barko.
      icon: tabler:calendar
    - title: 200-300 Mga Empleyado
      description: Kabilang ang 50+ mga inhinyero sa R&D, mga espesyalista sa kontrol ng kalidad, at mga tekniko sa produksyon.
      icon: tabler:users
    - title: 12,000 m² na Pasilidad
      description: Nakatuong planta ng paggawa na may 6 na linya ng produksyon para sa RIBs, inflatable na mga bangka, at SUP na mga board.
      icon: tabler:building-factory
    - title: 50+ Mga Bansang Napaglingkuran
      description: Nag-e-export sa Europa, Americas, Middle East, Asia-Pacific, at Africa.
      icon: tabler:globe
leadership:
  tagline: Pamumuno
  title: Pamumuno at Pamumuno sa Inhinyeriya
  subtitle: Ang aming koponan sa pamumuno ay pinagsasama ang malalim na kadalubhasaan sa marine engineering, pandaigdigang kalakalan, at pamamahala ng kalidad.
  columns: 3
  items:
    - title: Tagapagtatag at CEO
      name: Toby Liu
      description: 15+ taon sa paggawa ng marine. Dati nang pinamunuan ang R&D sa isang pangunahing Chinese na tagagawa ng bangka. May hawak na maraming patent sa disenyo ng inflatable na bangka.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Punong Inhinyero
      name: Zhang Wei
      description: 20+ taon sa PVC/Hypalon na paggawa at disenyo ng deep-V na hull. Dating teknikal na direktor sa isang European marine engineering firm.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ulo ng R&D
      name: Chen Ming
      description: PhD sa Material Science. Espesyalisado sa teknolohiyang drop-stitch at mga proseso ng high-frequency welding. 10+ taon sa textile composites.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direktor ng Produksyon
      name: Liu Qiang
      description: 18 taon sa lean manufacturing at pag-optimize ng production line. Six Sigma Black Belt. Nagpatupad ng ISO 9001 quality systems.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Tagapamahala ng Kalidad
      name: Wang Fang
      description: 12+ taon sa kontrol ng kalidad sa marine. Sertipikadong CE at ISO auditor. Nangangasiwa sa pagsubok para sa bawat batch ng produksyon.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direktor ng Benta at Operasyon
      name: Helen Lee
      description: 15+ taon sa pandaigdigang B2B trade. Pinamahalaan ang OEM/ODM partnerships sa 30+ bansa. Marunong sa 4 na wika.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Pilosopiya sa Disenyo
  title: Engineering-Led Design<br />— Mahalaga ang Bawat Detalye
  subtitle: Ang aming pilosopiya sa engineering ay nakasentro sa tatlong prinsipyong gumagabay sa bawat produktong aming ginagawa.
  list:
    - 'Mauna ang Kalidad: Bawat Paddle Board Overstock produkto ay sinusubok upang tiisin ang mga kondisyon sa totoong mundo — mula sa cold-water rescue operations hanggang sa mga tropical resort rentals. Sobrang namin ang engineering kung saan ito pinaka-kailangan.'
    - 'Katumpakan sa Paggawa: Ang aming mga pasilidad ay gumagamit ng CNC cutting, high-frequency welding, at automated pressure testing. Bawat tahi, bawat balbula, bawat fitting ay sumusunod sa dokumentadong pagtutukoy.'
    - 'Tuloy-tuloy na Inobasyon: Ang aming R&D team ay patuloy na sinusuri ang mga bagong materyales, pamamaraan ng produksyon, at pagpapahusay sa disenyo. Hindi kami naghihintay ng mga problema — inaasahan namin ang mga ito.'
cta:
  title: Nais mo bang talakayin ang isang proyekto kasama ang aming team?
