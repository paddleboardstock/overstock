hero:
  tagline: Aming Koponan
  title: Ang Mga Tao Sa Likod ng Paddle Board Overstock<br />— Pagbibigay ng Kalayaan sa Tubig sa pamamagitan ng Inhinyeriya
  subtitle: Itinatag noong 2012 sa Weihai, China, ang Paddle Board Overstock ay itinatag ng mga inhinyerong pandagat, siyentipiko sa materyales, at mga mahilig sa water sports na naniniwala sa paggawa ng mga inflatable paddle board na pang-profesyonal at maaabot sa buong mundo.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock buong larawan ng koponan — engineering, produksyon, at pamumuno
founding:
  tagline: Aming Pagtatatag
  title: Mula sa Isang Coastal Workshop<br />Hanggang sa 12,000 m² na Pasilidad
  subtitle: Ang Paddle Board Overstock ay itinatag ng isang koponan ng mga inhinyerong pandagat na may pinaghalong dekadang karanasan sa disenyo ng inflatable SUP, konstruksyon ng drop-stitch, at paggawa ng water sports sa buong mundo.
  items:
    - title: 'Itinatag: 2012'
      description: Itinatag sa Weihai, China — isang pangunahing sentro ng pandagat na may malalim na pamana sa paggawa ng barko.
      icon: tabler:calendar
    - title: 200-300 Mga Empleyado
      description: Kabilang ang 14+ R&D engineers, mga espesyalista sa kontrol ng kalidad, at mga tekniko sa produksiyon.
      icon: tabler:users
    - title: 12,000 m² na Pasilidad
      description: Nakatuong planta ng paggawa na may 6 linya ng produksiyon para sa SUP boards at mga aksesorya.
      icon: tabler:building-factory
    - title: 50+ Mga Bansang Napaglingkuran
      description: Nag-e-export sa Europa, Americas, Middle East, Asia-Pacific, at Africa.
      icon: tabler:globe
leadership:
  tagline: Pamumuno
  title: Pamumuno at Pamumuno sa Inhinyeriya
  subtitle: Ang aming koponan sa pamumuno ay pinagsasama ang malalim na kadalubhasaan sa marine engineering, pandaigdigang kalakalan, at pamamahala ng kalidad.
  columns: 3
  items:
    - title: Tagapagtatag at CEO
      name: Toby Liu
      description: 15+ taon sa paggawa ng pandagat. Dati ay namuno sa R&D sa isang malaking Chinese marine manufacturer. May hawak ng maraming patente sa disenyo ng inflatable na produkto.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Punong Inhinyero
      name: Zhang Wei
      description: 20+ taon sa paggawa ng polymer at disenyo ng inflatable na istruktura. Dating tagapamahala teknikal sa isang European marine engineering firm.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ulo ng R&D
      name: Chen Ming
      description: PhD sa Material Science. Espesyalisado sa teknolohiyang drop-stitch at mga proseso ng high-frequency welding. 10+ taon sa textile composites.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direktor ng Produksyon
      name: Liu Qiang
      description: 18+ na taon sa lean manufacturing at optimisasyon ng linya ng produksyon. Naitayo ang mga sistema ng kalidad sa likod ng aming 99.3% na defect-free na rate.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Tagapamahala ng Kalidad
      name: Wang Fang
      description: 12+ na taon sa marine quality control. Namamahala sa pressure, seam, at load testing para sa bawat batch ng produksyon bago ilabas.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direktor ng Benta at Operasyon
      name: Helen Lee
      description: 15+ na taon sa international e-commerce at logistics. Nagpapadala ng mga board sa mga paddler sa 50+ na bansa. Mahusay sa 4 na wika.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Pilosopiya sa Disenyo
  title: Inhinyeriyang Pinangunahan na Disenyo<br />— Mahalaga ang Bawat Detalye
  subtitle: Ang aming pilosopiya sa engineering ay nakasentro sa tatlong prinsipyong gumagabay sa bawat produktong aming ginagawa.
  list:
    - 'Reliability First: Bawat Paddle Board Overstock na produkto ay sinusubok upang tiisin ang totoong kondisyon — mula sa cold-water expeditions hanggang sa mga tropical beach rentals. Pinapalakas namin ng higit ang disenyo kung saan ito pinakakailangan.'
    - 'Katumpakan sa Paggawa: Ang aming mga pasilidad ay gumagamit ng CNC cutting, high-frequency welding, at automated pressure testing. Bawat tahi, bawat balbula, bawat fitting ay sumusunod sa dokumentadong pagtutukoy.'
    - 'Tuloy-tuloy na Inobasyon: Ang aming R&D team ay patuloy na sinusuri ang mga bagong materyales, pamamaraan ng produksyon, at pagpapahusay sa disenyo. Hindi kami naghihintay ng mga problema — inaasahan namin ang mga ito.'
cta:
  title: Nais mo bang talakayin ang isang proyekto kasama ang aming team?
  subtitle: Ang aming koponan ay handang tulungan ka sa pagpili ng tamang board, accessories, at gear para sa iyong paddling style.
  actions:
