hero:
  tagline: OEM/ODM Paggawa
  title: OEM at Pribadong Label na Paggawa
  subtitle: Mula sa konsepto hanggang sa lalagyan — ipasadya ang bawat detalye ng iyong linya ng inflatable na sasakyang-tubig
intro: Aquafarer ay nag-aalok ng komprehensibong OEM at ODM mga serbisyo para sa mga brand, distributor, at ahensya ng gobyerno sa buong mundo. Sa 10+ taon ng karanasan sa pag-export at 12,000 m² ISO 9001 & BSCI sertipikadong pabrika, kami ang humahawak ng lahat mula sa disenyo ng produkto at pagbuo ng hulma hanggang sa full-scale na produksyon, pag-iimpake, at lohistika.
highlight:
  - value: 10+
    label: Taon ng OEM karanasan
    detail: Mula noong 2012
  - value: 50+
    label: Mga bansang ina-exportan
    detail: Pandaigdigang abot
  - value: 200+
    label: Mga pasadyang proyekto na naihatid
    detail: Sa lahat ng linya ng produkto
  - value: 30–45
    label: Karaniwang oras sa paggawa (araw)
    detail: Mula PO hanggang FOB
services:
  - title: Disenyo ng Produkto at Inhenyeriya
    description: Ang aming in-house R&D team ay nakikipagtulungan sa iyong konsepto o spec para bumuo ng CAD drawings, 3D models, at prototypes. Nag-aalok kami ng disenyo ng hulma, optimisasyon ng hugis ng hull, at gabay sa pagpili ng materyal.
  - title: Pasadyang Branding at Graphics
    description: Full-color digital printing, screen printing, embossing, at label options. Bumubuo kami ng brand-specific na deck graphics, tube branding, at retail-ready packaging.
  - title: Pasadyang Materyal at Espisipikasyon
    description: Pumili mula sa PVC (standard, eco-friendly, fire-retardant), Hypalon/CSM, drop-stitch, at hybrid na konstruksyon. Pasadyang kulay ng tubo, bigat ng tela, at mga opsyon sa pagpapalakas.
  - title: Pag-iimpake at Lohistika
    description: Pasadyang retail packaging, private-label boxes, vacuum packing, palletizing, at pag-load sa container. FOB Qingdao, CIF, o DDP mga term sa pagpapadala ay available.
