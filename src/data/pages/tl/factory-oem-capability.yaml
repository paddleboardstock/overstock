why_us:
  - title: Pahalang na Pagsasama
    description: Pag-aari namin ang aming pabrika, mga molde, at supply chain — walang mga middleman, walang subcontractor. Ito ay nagbibigay sa amin ng kontrol sa kalidad, gastos, at paghahatid.
  - title: Dual na Sertipikasyon
    description: ISO 9001 pamamahala sa kalidad at BSCI sertipikasyon sa pagsunod sa panlipunan. Mga ulat sa pag-audit ng pabrika ay magagamit kapag hiniling.
  - title: CE Pagsunod
    description: Lahat ng pamantayang modelo ay may CE 2013/53/EU sertipikasyon. Ang mga pasadyang modelo ay maaaring CE sertipikado sa pamamagitan ng aming establisadong proseso.
  - title: Mababang MOQ
    description: Magsimula sa kasing baba ng 5 yunit para sa pamantayang mga modelo. Tinutulungan namin ang mga umuusbong na tatak na magsimula nang hindi sobra sa imbentaryo.
