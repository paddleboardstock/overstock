articles:
  sup:
    - title: SUP Pangunahing Kaalaman — Gabay para sa Nagsisimula
      desc: Lahat ng kailangang malaman ng isang baguhan — mga uri ng board, sukat ng paddle, postura, at mga tip sa unang araw.
    - title: SUP Gabay sa Sukat
      desc: Hanapin ang tamang haba, lapad, at dami ng board para sa iyong timbang, kasanayan, at istilo ng pagbibisikleta.
    - title: Inflatable laban sa Matigas na Tabla
      desc: Alin ang tama para sa iyo? Pagsusuri sa dalhin, performance, tibay, at gastos.
    - title: Gitnang Antas na Mga Teknik
      desc: Pahusayin ang iyong pagpipadyak gamit ang mga advanced na hagod, pamamaraan sa pagliko, at paghawak ng magulong tubig.
    - title: Paano Pumili ng Inflatable SUP
      desc: Gabayan ang mga pangunahing salik — konstruksyon, kapal, setup ng palikpik, at kasamang mga aksesorya.
    - title: Kaligtasan sa Tubig
      desc: Mahalagang kaalaman sa kaligtasan kasama ang pagbabasa ng panahon, pagpili ng PFD, sariling pagliligtas, at pangkat na pagpaddling.
  inflatable-boat:
    - title: Sanggunian ng Materyales
      desc: Drop-stitch mga core, PVC mga laminate, EVA deck foam, at mga denier na rating — unawain kung saan gawa ang iyong board.
    - title: EVA Ipinaliwanag ang Sining ng Deck
      desc: Paano ang multi-color EVA na mga bloke ay pinutol sa hugis gamit ang die-cut at pinagsama-sama sa kamay upang maging pieced deck art na hindi kumupas o nasisipas.
    - title: Drop-Stitch Paliwanag ng Core
      desc: Paano ang libu-libong panloob na sinulid ay lumilikha ng matibay na plataporma sa 15 PSI para sa mataas na pagganap na inflatable SUPs.
    - title: Pangkalahatang Ideya ng Inflatable Technology
      desc: Paano ginagawa ang mga inflatable paddle board — mula sa pagtatalup ng materyal hanggang sa mga sistema ng balbula at pagwelding ng tahi.
    - title: Konstruksyon ng Riles at Tahi
      desc: Paano pinananatiling airtight ang iyong board sa buong presyon ng triple-layer na rail bands at RF-welded seams.
    - title: Bakit Mahalaga ang 15 PSI
      desc: Paano binubuksan ng presyon ng hangin ang matigas at matibay na performance mula sa isang maaaring ipacking na inflatable.
  water-safety:
    - title: Gabay sa Kaligtasan sa Tubig
      desc: Mahalagang kaalaman sa kaligtasan para sa bawat mananakay — panahon, PFDs, sariling pagliligtas, at mga protocol sa pangkat na pagpaddling.
    - title: Gabay sa Life Jacket & PFD
      desc: Paano pumili ng tamang personal flotation device para sa stand-up paddle boarding — mga rating ng buoyancy, akma, at kaginhawaan.
    - title: SUP Checklist ng Kaligtasan
      desc: Checklist para sa kaligtasan bago maglunsad na dapat sundin ng bawat stand-up paddle boarder bago pumasok sa tubig.
    - title: Kaligtasan sa Paddling sa Malamig na Tubig
      desc: Mahalagang pag-iingat, kagamitan, at mga teknik para sa paddling sa malamig na tubig.
    - title: Mga Karaniwang Pagkakamali ng Baguhang Paddler
      desc: Karaniwang pagkakamali ng mga unang beses na paddler at kung paano ito iwasan para sa mas ligtas at mas kasiya-siyang karanasan.
    - title: Mga Alituntunin sa Leash at PFD Kaligtasan
      desc: Kapag mahalaga ang leash, alin ang PFD uri na epektibo para sa SUP, at ang mga kagamitan sa kaligtasan na dapat dalhin ng bawat nagpa-paddle.
ui:
  read_guide: Basahin ang gabay →
  card_tech: Inhinyeriya sa kaligtasan at pagsubok ng materyales
  card_products: Galugarin ang buong Paddle Board Overstock katalogo ng produkto
  card_trust: Kalidad na nasubok sa pabrika na may 2-taong warranty
materials:
  intro_p1: Ang pagganap, tibay, at kaligtasan ng inflatable paddle board ay halos ganap na nakasalalay sa mga materyales na ginamit sa paggawa nito. Mula sa laminate na bumubuo sa hull hanggang sa mga sinulid na nagbibigay ng SUP board ng katigasan, bawat pagpili ng materyal ay nakakaapekto sa kung paano gumaganap ang produkto sa tubig at gaano ito katagal titibay.
  intro_p2: 'Saklaw ng gabay na ito ang tatlong pangunahing materyales na ginagamit sa modernong inflatable paddle boards: ang PVC laminate, ang drop-stitch core, at EVA foam decking. Ang pag-unawa sa mga materyales na ito ay makakatulong sa iyo na pumili ng tamang board para sa iyong pangangailangan at mapanatili ito sa pinakamahabang buhay ng produkto.'
  labels:
    advantages: Mga Bentahe
    limitations: Mga Limitasyon
    best_for: 'Pinakamainam para sa:'
  items:
    - name: PVC (Polyvinyl Chloride)
      summary: Ang pamantayan sa industriya para sa inflatable SUPs. Ang multi-layer laminated na tela ay nag-aalok ng mahusay na ratio ng lakas-sa-timbang sa naa-access na presyo.
      pros:
        - Napakahusay na halaga para sa pera
        - Magaan at madaling i-handle
        - Magandang UV resistensya sa tamang coatings
        - Malawak na saklaw ng kulay at finish
        - Madaling ayusin gamit ang PVC patches at solvent adhesive
      cons:
        - Karaniwang buhay ng 7-10 taon sa tamang pangangalaga
        - Mas mababa ang flexibility sa malamig na temperatura
        - Mas mababa ang chemical resistance
        - Maaaring magkaroon ng migration ng plasticizer sa paglipas ng panahon
      best_for: Pampalipas-oras at pampaglakbay na SUPs, paddling ng pamilya, panandaliang paggamit, sariwang tubig at mangrove o baybayin na kapaligiran.
    - name: Drop-Stitch Puso
      summary: Ang teknolohiyang nag-rebolusyonal sa inflatable SUPs. Libu-libong polyester threads ang nag-uugnay sa itaas at ibabang mga layer ng tela, na nagpapahintulot ng high-pressure inflation para sa rigid, hard-shell na performance.
      pros:
        - Napakahigpit sa 12-20 PSI
        - Magaan — 18-30 lbs para sa full-size na board
        - Nai-fold nang patag para sa imbakan at paglalakbay
        - Mahusay na pagtutol sa epekto
        - Pare-parehong performance sa iba't ibang saklaw ng temperatura
      cons:
        - Kinakailangan ang high-pressure pump
        - Mas kumplikado ang pagkukumpuni sa butas kaysa sa single-layer
        - Mas mataas ang gastusin sa pagmamanupaktura kaysa sa karaniwang inflatable
        - Kinakailangan ang pana-panahong pagdagdag ng presyon dahil sa pagkawala nito sa paglipas ng panahon
      best_for: Mga stand-up paddle board at anumang kagamitan na nangangailangan ng matibay na pagganap na may portable na inflatable.
    - name: EVA Palapag na Espongha
      summary: Closed-cell EVA (ethylene-vinyl acetate) foam na ginagamit para sa mga traction pad sa SUP board. Nagbibigay ng cushioning, pagkakahawak, at thermal insulation — at may dalang art-series na mga disenyo.
      pros:
        - Mahusay na hindi dumulas kahit basa o tuyo
        - Ang cushioning ay nagpapabawas ng pagod sa mahabang paddling
        - Thermal na insulasyon mula sa malamig na ibabaw ng deck
        - UV at resistensya sa tubig-alat
        - Available sa multi-color block piecing at laser-engraved na disenyo
      cons:
        - Maaaring magsuot sa matinding paggamit sa loob ng 2-3 taon
        - Dapat maayos na maisama upang maiwasan ang paghiwalay ng mga layer
        - Hindi istruktural — hindi nakakaapekto sa tigas
        - Nagdaragdag ng bahagyang bigat (200-400 g bawat board)
      best_for: SUP deck traction, art-series na mga disenyo ng deck, at anumang ibabaw na nangangailangan ng hindi madulas na pagtapak.
  selection:
    title: Gabay sa Pagpili ng Material
    subtitle: 'Piliin ang tamang materyal batay sa pangunahing gamit mo:'
    headers:
      - Kaso ng Paggamit
      - Inirekomendang Materyal
      - Bakit
    rows:
      - - Pang-rekreasyonal na SUP paddling
        - Drop-stitch PVC
        - Magaan, matatag, abot-kaya — perpektong balanse para sa mga kaswal na paddler
      - - Pagsagwan ng pamilya at panimula
        - Malapad drop-stitch PVC (32"+)
        - Matatag at mapagpatawad — kumpiyansa para sa mga unang beses na mag-paddle
      - - Pangingisda at pagbubuhat ng mabibigat na gamit habang nagpa-paddle
        - Malapad drop-stitch PVC na may buong EVA deck
        - Karagdagang katatagan para sa pagtayo at pagbagsak ng lambat, mataas na dami para sa kagamitan
      - - Mga board para sa paupahang fleet SUP
        - Drop-stitch PVC + EVA dek
        - Matibay, maaaring ayusin, magandang halaga para sa paggamit na mabilis ang turnover
      - - Pagbabaktas at mas mahabang paddle
        - Drop-stitch PVC (~11 ft)
        - Mas mahusay na pagsubaybay at kahusayan sa pag-glyde para sa distansya
      - - Yoga at fitness na pagpa-paddle
        - Malapad drop-stitch PVC na may buong EVA deck
        - Matatag, komportableng plataporma para sa mga posisyon at ehersisyo
  deep_dive:
    title: Mga Gabay sa Malalim na Paglangoy
    topics:
      - title: antas PVC ng marino
        desc: Multi-layer laminated PVC tela — ipinaliliwanag ang UV resistensya, pagsusulit sa abrasion, at mga denier rating.
      - title: PVC Laminate Layers
        desc: Paano binabalanse ng multi-layer laminated PVC ang lakas, timbang, at resistensya sa UV.
      - title: Drop-Stitch Puso
        desc: Paano lumikha ng libu-libong internal threads ang matitigas, high-pressure inflatable na estruktura sa 15 PSI.
      - title: Teknolohiya ng RF Welding
        desc: Ang high-frequency welding ay lumilikha ng matibay at pare-parehong tahi — paano ito gumagana at bakit ito mahalaga.
      - title: PSI at Pagganap
        desc: Bakit mahalaga ang presyon ng hangin para sa inflatable SUPs — tigas, kapasidad ng timbang, at kalidad ng pagtalon.
      - title: Pagsusuri ng Kalidad
        desc: Pagsusuri sa presyon, mga pagsubok sa buoyancy, UV pagtanda, at mapanirang pagsusuri — ang aming proseso ng kalidad.
      - title: EVA Mga Foam Deck
        desc: Closed-cell EVA foam deck pads — traksyon, ginhawa, at tibay para sa SUP decks.
      - title: Pangangalaga sa Materyal
        desc: Paglilinis, UV proteksyon, pagpigil sa amag, at pinakamainam na kasanayan sa pag-iimbak para sa mga inflatable na produkto.
