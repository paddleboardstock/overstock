articles:
  sup:
    - title: SUP Pangunahing Kaalaman — Gabay para sa Nagsisimula
      desc: Lahat ng kailangang malaman ng isang baguhan — mga uri ng board, sukat ng paddle, postura, at mga tip sa unang araw.
    - title: SUP Gabay sa Sukat
      desc: Hanapin ang tamang haba, lapad, at dami ng board para sa iyong timbang, kasanayan, at istilo ng pagbibisikleta.
    - title: Pampalutang na Tabla laban sa Matigas na Tabla
      desc: Alin ang tama para sa iyo? Pagsusuri sa dalhin, performance, tibay, at gastos.
    - title: Gitnang Antas na Mga Teknik
      desc: Pahusayin ang iyong pagpipadyak gamit ang mga advanced na hagod, pamamaraan sa pagliko, at paghawak ng magulong tubig.
    - title: Paano Pumili ng Inflatable SUP
      desc: Gabayan ang mga pangunahing salik — konstruksyon, kapal, setup ng palikpik, at kasamang mga aksesorya.
    - title: Kaligtasan sa Tubig
      desc: Mahalagang kaalaman sa kaligtasan kasama ang pagbabasa ng panahon, pagpili ng PFD, sariling pagliligtas, at pangkat na pagpaddling.
  inflatable-boat:
    - title: Sanggunian ng Materyales
      desc: PVC, Hypalon, drop-stitch, denier ratings — unawain kung ano ang materyal ng iyong inflatable na kagamitan.
    - title: PVC laban sa Hypalon
      desc: Ang tiyak na paghahambing ng PVC at Hypalon na tela para sa inflatable na mga bangka — tibay, UV na resistensya, at gastos.
    - title: Drop-Stitch Paliwanag ng Core
      desc: Paano ang libu-libong panloob na sinulid ay lumilikha ng matibay na platform sa 12-15 PSI para sa high-performance na inflatable SUPs.
    - title: Pangkalahatang Ideya ng Inflatable Technology
      desc: Paano ginagawa ang mga inflatable na bangka at SUPs — mula sa pagkakalatag ng materyal hanggang sa mga sistema ng balbula at welding ng tahi.
    - title: Gabay sa Rigid Inflatable Boat (RIB)
      desc: Lahat tungkol sa konstruksyon ng RIB, uri ng hull, materyales ng tubo, at pagpili ng tamang RIB para sa iyong mga pangangailangan.
    - title: Pambalot na Bangka laban sa RIB
      desc: Pangunahing pagkakaiba sa pagitan ng tradisyonal na inflatable dinghies at rigid-hull inflatable boats para sa iba't ibang gamit.
  water-safety:
    - title: Gabay sa Kaligtasan sa Tubig
      desc: Mahalagang kaalaman sa kaligtasan para sa bawat mananakay — panahon, PFDs, sariling pagliligtas, at mga protocol sa pangkat na pagpaddling.
    - title: Gabay sa Life Jacket & PFD
      desc: Paano pumili ng tamang personal flotation device para sa SUP, kayaking, boating, at propesyonal na paggamit.
    - title: SUP Checklist ng Kaligtasan
      desc: Checklist para sa kaligtasan bago maglunsad na dapat sundin ng bawat stand-up paddle boarder bago pumasok sa tubig.
    - title: Kaligtasan sa Paddling sa Malamig na Tubig
      desc: Mahalagang pag-iingat, kagamitan, at mga teknik para sa paddling sa malamig na tubig.
    - title: Mga Karaniwang Pagkakamali ng Baguhang Paddler
      desc: Karaniwang pagkakamali ng mga unang beses na paddler at kung paano ito iwasan para sa mas ligtas at mas kasiya-siyang karanasan.
    - title: CE Paliwanag ng Sertipikasyon
      desc: Ano ang ibig sabihin ng CE sertipikasyon para sa inflatable na sasakyang pang-tubig — ang mga pamantayan, pagsubok, at kung bakit ito mahalaga para sa kaligtasan.
ui:
  read_guide: Basahin ang gabay →
  card_tech: Inhinyeriya sa kaligtasan sa dagat at pagsubok sa materyales
  card_products: Tuklasin ang buong katalogo ng Paddle Board Overstock produkto
  card_trust: Pagsunod sa CE, ISO at BSCI
materials:
  intro_p1: Ang pagganap, tibay, at kaligtasan ng isang inflatable na sasakyan sa tubig ay nakadepende halos lubos sa mga materyales na ginamit sa paggawa nito. Mula sa tela na bumubuo sa mga tubo hanggang sa mga sinulid na nagbibigay ng SUP board ng katatagan, bawat pagpili ng materyal ay nakakaapekto sa kung paano gumaganap ang produkto sa tubig at kung gaano ito kahaba katagal.
  intro_p2: 'Tinatalakay ng gabay na ito ang apat na pangunahing materyales na ginagamit sa modernong inflatable na sasakyan sa tubig: PVC na tela, Hypalon CSM goma, drop-stitch pangunahing konstruksyon, at EVA foam decking. Ang pag-unawa sa mga materyales na ito ay makakatulong sa pagpili ng tamang produkto para sa iyong pangangailangan at panatilihin ito para sa pinakamahabang buhay ng produkto.'
  labels:
    advantages: Mga Bentahe
    limitations: Mga Limitasyon
    best_for: 'Pinakamainam para sa:'
  items:
    - name: PVC (Polyvinyl Chloride)
      summary: Ang pamantayan sa industriya para sa mga recreational inflatable na bangka at SUPs. Ang multi-layer na laminated na tela ay nag-aalok ng mahusay na lakas-sa-timbang na ratio sa abot-kayang presyo.
      pros:
        - Abot-kaya — 30-50% mas mura kaysa sa Hypalon
        - Magaan at madaling i-handle
        - Magandang UV resistensya sa tamang coatings
        - Malawak na saklaw ng kulay at finish
        - Madaling ayusin gamit ang PVC patches at solvent adhesive
      cons:
        - Maikling lifespan kaysa sa Hypalon (7-10 taon)
        - Mas mababa ang flexibility sa malamig na temperatura
        - Mas mababa ang chemical resistance
        - Maaaring magkaroon ng migration ng plasticizer sa paglipas ng panahon
      best_for: Recreational SUPs, murang bangka, paupahang fleet, seasonal na paggamit, freshwater at coastal na kapaligiran.
    - name: Hypalon (CSM Goma)
      summary: Premium synthetic na materyal na goma na kilala sa pambihirang tibay, UV resistensya, at longevity. Ang gold standard para sa commercial at military-grade na inflatable na bangka.
      pros:
        - Pambihirang UV at ozone resistensya
        - Haba ng buhay na 15-20 taon sa tamang pangangalaga
        - Mahusay na kakayahang umangkop sa malamig na panahon
        - Nangungunang resistensya laban sa kemikal at langis
        - Pinapanatili ang kulay nang mas matagal kaysa sa PVC
      cons:
        - Mas mahal ng malaki kaysa sa PVC
        - Mas mabigat na timbang ng tela
        - Mas kaunting pagpipilian ng kulay
        - Kinakailangan ang espesyal na pandikit sa mga pagkukumpuni
        - Mas kaunting pasilidad ng pagmamanupaktura sa buong mundo
      best_for: Pangkomersyal na RIBs, paghahanap at pagsagip, aplikasyon sa militar, tropikal na klima, pangmatagalang pagmamay-ari ng fleet.
    - name: Drop-Stitch Core
      summary: Ang teknolohiyang nag-rebolusyonal sa inflatable SUPs. Libu-libong polyester threads ang nag-uugnay sa itaas at ibabang mga layer ng tela, na nagpapahintulot ng high-pressure inflation para sa rigid, hard-shell na performance.
      pros:
        - Napakahigpit sa 12-20 PSI
        - Magaan — 18-30 lbs para sa full-size na board
        - Nai-fold nang patag para sa imbakan at paglalakbay
        - Mahusay na pagtutol sa epekto
        - Pare-parehong performance sa iba't ibang saklaw ng temperatura
      cons:
        - Kinakailangan ang high-pressure pump
        - Mas kumplikado ang pagkukumpuni sa butas kaysa sa single-layer
        - Mas mataas ang gastusin sa pagmamanupaktura kaysa sa karaniwang inflatable
        - Kinakailangan ang pana-panahong pagdagdag ng presyon dahil sa pagkawala nito sa paglipas ng panahon
      best_for: Stand-up paddle boards, kayaks, air decks para sa inflatable na bangka, anumang aplikasyon na nangangailangan ng rigid na performance na may inflatable na portability.
    - name: EVA Foam Deck
      summary: Closed-cell EVA (ethylene-vinyl acetate) foam na ginagamit para sa traction pads sa SUP boards at boat decks. Nagbibigay ng cushioning, grip, at thermal na insulasyon.
      pros:
        - Mahusay na hindi dumulas kahit basa o tuyo
        - Ang cushioning ay nagpapabawas ng pagod sa mahabang paddling
        - Thermal na insulasyon mula sa malamig na ibabaw ng deck
        - UV at resistensya sa tubig-alat
        - Available sa multi-color block piecing at laser-engraved na disenyo
      cons:
        - Maaaring magsuot sa matinding paggamit sa loob ng 2-3 taon
        - Dapat maayos na maisama upang maiwasan ang paghiwalay ng mga layer
        - Hindi istruktural — hindi nakakaapekto sa tigas
        - Nagdaragdag ng bahagyang bigat (200-400 g bawat board)
      best_for: SUP traksyon sa deck, padding ng deck ng bangka, kaginhawaan sa upuan ng kayak, anumang ibabaw na nangangailangan ng hindi madulas na pagkapitan.
  selection:
    title: Gabay sa Pagpili ng Material
    subtitle: 'Piliin ang tamang materyal batay sa pangunahing gamit mo:'
    headers:
      - Kaso ng Paggamit
      - Inirekomendang Materyal
      - Bakit
    rows:
      - - Pang-rekreasyonal na SUP paddling
        - Drop-stitch PVC
        - Magaan, matatag, abot-kaya — perpektong balanse para sa mga kaswal na paddler
      - - Pamilyang dinghy / bangkang lawa
        - PVC (1100 denier)
        - Makatipid sa gastos, madaling ayusin, sapat ang tibay para sa pang-rekreasyonal na paggamit
      - - Komersyal na RIB / barko ng patrol
        - Hypalon CSM
        - Pinakamataas na UV resistensya, 15-20 taong buhay, resistensya sa kemikal/olyo
      - - Mga board para sa paupahang fleet SUP
        - Drop-stitch PVC + EVA deck
        - Matibay, maaaring ayusin, magandang halaga para sa paggamit na mabilis ang turnover
      - - Mga operasyon ng paghahanap at pagsagip
        - Hypalon CSM
        - Maasahan sa matinding kondisyon, flexibility sa lamig, resistensya sa kemikal
      - - Touring / expedition kayak
        - Drop-stitch PVC
        - Matatag na performance na may portable na kakayahang mai-pack para sa paglalakbay
  deep_dive:
    title: Mga Gabay sa Malalim na Paglangoy
    topics:
      - title: Grade ng Dagat na PVC
        desc: Multi-layer laminated PVC tela — ipinaliliwanag ang UV resistensya, pagsusulit sa abrasion, at mga denier rating.
      - title: PVC laban sa Hypalon
        desc: Ang ganap na paghahambing ng dalawang nangingibabaw na materyales sa inflatable boat — gastos, buhay ng materyal, UV resistensya.
      - title: Drop-Stitch Core
        desc: Kung paano gumagawa ang libu-libong panloob na thread ng matibay, high-pressure inflatable na istruktura sa 12-15 PSI.
      - title: Teknolohiya ng RF Welding
        desc: Ang high-frequency welding ay lumilikha ng matibay at pare-parehong tahi — paano ito gumagana at bakit ito mahalaga.
      - title: PSI at Pagganap
        desc: Bakit mahalaga ang presyon ng hangin para sa inflatable SUPs at mga bangka — tigas, kapasidad ng timbang, at kalidad ng biyahe.
      - title: Pagsusuri ng Kalidad
        desc: Pagsusuri sa presyon, mga pagsubok sa buoyancy, UV pagtanda, at mapanirang pagsusuri — ang aming proseso ng kalidad.
      - title: EVA Foam Decks
        desc: Closed-cell EVA foam deck pads — traksyon, kaginhawahan, at tibay para sa SUP at mga deck ng bangka.
      - title: Pangangalaga sa Materyal
        desc: Paglilinis, UV proteksyon, pagpigil sa amag, at pinakamainam na kasanayan sa pag-iimbak para sa mga inflatable na produkto.
