breadcrumb: OEM/ODM Tagagawa
tldr:
  summary: Paddle Board Overstock ay isang direktang mula sa pabrika OEM/ODM tagagawa. 12,000 m² ISO 9001:2015 na pasilidad, 15,000 yunit taunang produksyon, CE/BSCI/REACH/UKCA pagsunod, mababa MOQs mula 2-10 yunit.
  points:
    - 12,000 m² ISO 9001:2015 sertipikadong pasilidad sa Qingdao
    - 15,000 yunit taunang kapasidad na may 200-300 bihasang manggagawa
    - CE 2013/53/EU, UKCA, BSCI, REACH pagsunod
    - 'Mababa: MOQs2-5 yunit (RIB), 5-10 yunit (SUP) para sa mga standard na modelo'
    - 50+ bansa sa export na may FOB Qingdao shipping
