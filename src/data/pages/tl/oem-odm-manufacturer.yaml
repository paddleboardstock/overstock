process_section:
  eyebrow: Ang Aming Proseso
  title: End-to-End OEM/ODM Daloy ng Trabaho
  subtitle: Mula sa design brief hanggang sa paglo-load ng container — anim na hakbang patungo sa iyong private-label inflatable watercraft.
  steps:
    - step: '01'
      title: Maikling Espesipikasyon at Disenyo
      desc: Ibahagi ang iyong target specs, CAD drawings, o reference product. Sinusuri ng aming engineering team ang mga materyales, sukat, at mga kinakailangan sa pagsunod (CE, BSCI) bago magbigay ng quote.
    - step: '02'
      title: 3D Prototyping ng Mold
      desc: Nagdidisenyo at CNCnagma-machine kami ng custom molds para sa SUP boards, kayak hulls, at RIB mga bahagi. Prototype samples na ginagawa sa loob ng 15–20 working days para sa iyong pag-apruba.
    - step: '03'
      title: Pagpili ng Materyal at Paggawa ng Sample
      desc: Pumili mula sa military-grade PVC (0.9mm–1.2mm), Hypalon CSMo drop-stitch core fabrics. Gumagawa kami ng mga pre-production sample na may kulay ng brand, logo, at packaging para sa sign-off.
    - step: '04'
      title: CE Audit at Pagsunod sa Pabrika
      desc: OEM Bawat order ay may kasamang dokumentasyon ng pagsunod — CE deklarasyon ng pagsunod, ISO 9001 traceability records, BSCI social compliance report, at REACH mga materyal na deklarasyon.
    - step: '05'
      title: Maramihang Produksyon at Inline QC
      desc: Ang mga produksyon ay sumusunod sa aming 100-point quality checklist. Bawat yunit ay dumadaan sa 24-oras na pagsusuri sa pressure retention, seam peel testing, at visual inspection bago i-pack.
    - step: '06'
      title: FOB Qingdao Logistika at Pagpapadala
      desc: Ang mga tapos na kalakal ay pinapa-palletize, binabalot, at nilalagay sa container sa Qingdao port. Kami ang humahawak ng lahat ng dokumentasyon sa export, customs clearance, at nagbibigay ng real-time na pagsubaybay sa pagpapadala.
capabilities_section:
  eyebrow: Kakayahan sa Paggawa
  title: Ang Aming Binubuo
  subtitle: Anim na pangunahing kakayahan sa produksyon para sa mga pandaigdigang B2B kasosyo.
  items:
    - title: Drop-Stitch SUP paggawa ng board
      desc: Full-length drop-stitch core lamination para sa matitig, high-pressure (15–20PSI) stand-up paddle boards. Custom na haba, lapad, kapal, rocker profile, at graphic design.
    - title: PVC Produksyon ng Inflatable na Bangka
      desc: Mga high-frequency welded PVC dinghies, tenders, at sport boats. Maraming chamber configurations, floor options (slat, air deck, roll-up), at accessory integration.
    - title: Hypalon RIB Paggawa ng Bangka
      desc: Commercial-grade Hypalon CSM tubes na nakakabit sa fiberglass o aluminum deep-V hulls. 3.3 m hanggang 6.0 m ang haba para sa patrol, rescue, tour, at diving operations.
    - title: Pribadong Label at Custom na Branding
      desc: 'Buong private label service: custom na logo heat-transfer o screen printing, branded packaging (retail boxes, carry bags), user manuals sa iyong wika, at barcode/UPCregistration.'
    - title: Custom na Disenyo ng Molde at Tooling
      desc: In-house na 3D CAD/CAM engineering team. Nagdidisenyo at gumagawa kami ng custom na aluminum at composite molds para sa natatanging hugis ng hull, deck configurations, at accessory mounting points.
    - title: OEM Mga Aksesorya at Kitting
      desc: Life vests (CE12402), dual-action pumps, carbon/nylon paddles, repair kits, carry bags, at leash assemblies. Kumpletong kitting at bundle packaging para sa retail-ready na presentasyon.
experience_section:
  eyebrow: Karanasan sa Totoong Mundo
  title: Mga Pakikipagtulungan na Bumuo ng Mga Brand
  subtitle: Mga totoong kwento mula sa mga brand at organisasyon na nakipag-partner sa Paddle Board Overstock for OEM/ODM manufacturing.
  stories:
    - quote: Dumating kami Paddle Board Overstock na may sketch sa napkin at listahan ng mga requirements. Walong buwan ang lumipas, may production-ready product na pumasa CE sa certification sa unang subok.
      narrative: Isang European startup na may bagong SUP disenyo na nilapitan Paddle Board Overstock para sa ODM paggawa. Paddle Board Overstock Dinala ng R&D team ang konsepto sa pamamagitan ng CAD design, FEA structural analysis, hydrodynamic simulation, paggawa ng mold, paggawa ng prototype, at production tooling. Tatlong beses bumisita ang tagapagtatag ng startup sa Qingdao sa proseso. Ang huling produkto ay pumasa CE sa sertipikasyon nang walang anumang pagbabago — isang resulta na iniuugnay ng tagapagtatag Paddle Board Overstocksa engineering team na nauunawaan ang mga regulasyong Europeo mula pa sa simula.
      context: SUP Paglulunsad ng tatak sa Europa, 2023-2024
      source: Brand Founder
    - quote: Ang antas ng NDA proteksyon at seguridad sa IP ay Paddle Board Overstock nagbibigay sa amin ng kumpiyansa na ibahagi ang aming mga proprietary na disenyo. Tinatrato nila ang aming IP na parang kanila ito.
      narrative: Isang kumpanya ng marine equipment na nakabase sa US na may proprietary valve technology ang nangangailangan ng manufacturing partner na kayang protektahan ang kanilang IP habang gumagawa ng malawakang produksyon. Matapos mag-audit ng limang Chinese manufacturers, pumili sila Paddle Board Overstock base sa IP protection protocols ng pabrika, secure na paghawak ng design file, at kahandaang pumirma ng mahigpit na NDA. Ang partnership ay nakagawa ng tatlong linya ng produkto sa loob ng apat na taon na walang insidente sa IP.
      context: Kumpanya ng US marine equipment, OEM pakikipagtulungan mula pa noong 2021
      source: Pangalawang Pangulo ng Operasyon
