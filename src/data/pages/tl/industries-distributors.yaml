content_segments:
  tagline: Profile ng Partner
  title: Mga Modelo ng Pakikipagsosyo sa Distribusyon<br />Ayon sa Uri ng Partner
  subtitle: Iba't ibang distributor ay nagdadala ng iba't ibang lakas sa pagpunta sa merkado — pang-rehiyong imprastruktura, abot sa e-commerce, specialty retail, o multi-brand portfolios. I-struktura namin ang mga termino ng pakikipagsosyo, tier ng presyo, at antas ng suporta upang umayon sa bawat profile ng partner.
  items:
    - title: Rehiyonal na Tagapamahagi ng Pangisdaan
      subtitle: Eksklusibong distribusyon sa teritoryo B2B
      description: Naitatag na mga distributor na may imprastruktura ng bodega, network ng dealer, at kakayahan sa logistics na nagseserbisyo sa mga marine dealer, water sports retailers, at mga operator ng rental sa loob ng itinakdang heograpikong teritoryo. Kailangan mo ng kumpletong linya ng produkto, protektadong presyo, at kakayahan na maglingkod sa mga account ng dealer gamit ang lokal na stock at suporta.
      features:
        - Eksklusibong proteksyon sa teritoryo na may minimum na mga tuntunin ng pangako
        - Buong katalogo ng presyo para sa wholesale na may quarterly volume rebate
        - Programa ng konsinyasyong lokal na stock para sa mabilis na nagbebentang SKU
        - Pagsasanay sa network ng dealer at programa ng co-branded marketing
    - title: E-Commerce at Mga Online Retailer
      subtitle: Digital-first na mga channel ng pamamahagi
      description: Mga online retailer na nagbebenta ng kagamitan sa water sports sa pamamagitan ng Amazon, eBay, o kanilang sariling e-commerce platform. Ang bilis ng pagpunta sa merkado, kumpetitibong presyo, at direktang logistics sa consumer ay mahalaga. Kailangan mo ng partner na maaaring magsagawa ng drop-ship ng mga indibidwal na order sa ilalim ng iyong brand na may mabilis na pagtupad at walang panganib sa imbentaryo.
      features:
        - 'Programa ng Drop-Ship: direktang pagtupad mula sa pabrika sa ilalim ng iyong brand'
        - Real-time inventory API feed para sa iyong e-commerce platform
        - Integrasyon sa Amazon Seller Central na may EAN/UPC support
        - Kasama ang logistics ng return at pagproseso ng warranty claim
    - title: Espesyalidad na Retailer ng Water Sports
      subtitle: Mga kasosyo sa showroom na brick-and-mortar
      description: Pisikal na tindahan na nagdadalubhasa sa kagamitan sa water sports — nagseserbisyo sa mga lokal na paddler, isda, at mga nagmamaneho ng bangka sa pamamagitan ng personal na pagbebenta, demonstrasyon, at serbisyo pagkatapos ng benta. Kailangan mo ng retail-optimized na packaging, programa ng demo unit, at point-of-sale na materyales na nagko-convert ng walk-in na mga customer.
      features:
        - 'Programa ng demo unit: discounted na mostrang display boards'
        - Retail-ready na packaging na may shelf-optimized na disenyo ng kahon
        - Point-of-sale displays, comparison charts, at buyer guides
        - Pagsasanay at certification program para sa mga tauhan sa tindahan
    - title: Multi-Brand at Mga Distributor ng Department Store
      subtitle: Malawak na linya ng pamamahagi ng sporting goods
      description: Malalaking distributor na nagseserbisyo sa mga department store, big-box retailers, at sporting goods chains na may multi-brand catalogs. Mahalaga ang konsistensya, dokumentasyon ng pagsunod, at vendor compliance — bawat SKU ay dapat tumugon sa partikular na packaging, labeling, at quality standards ng retailer.
      features:
        - 'Dokumentasyon ng pagsunod sa retailer: packaging spec, barcode, labeling'
        - EDI/ASN integrasyon para sa pangunahing mga ordering system ng retailer
        - Vendor-managed na imbentaryo at awtomatikong programa ng replenishment
        - Nakatuong account management na may 24 na oras na response SLA
