workshops_section:
  tagline: Mga Workshop
  title: Mga Workshop sa Paggawa
  workshops:
    - title: PVC Pagputol at Paghahanda ng Materyales
      description: Ang mga CNC awtomatikong makina sa pagputol PVC ay nagpoproseso at gumagawa ng drop-stitch mga tela nang may sub-millimetre na katumpakan. Ang computer-optimised nesting ay nagpapababa ng basura ng materyal at tinitiyak na bawat panel ay tumutugon sa sukat na espesipikasyon bago i-welding.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Welding at Heat Sealing
      description: Nakatuong welding workshop na may heat sealing machines at RF dielectric presses. Ang mga hot-air welders ay nagbubuklod at nagtitipon ng drop-stitch core laminates at rail bands, habang ang RF welds ay gumagawa ng matibay at airtight na mga tahi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Deck Art at EVA Pagpapaayos
      description: 'Dito nabubuo ang mga art-series decks: ang mga precision-cut na EVA foam panels ay inilalagay sa buong-deck na pattern, binubuklod, at tinatapyas nang mano-mano para sa isang grippy, komportable, at matibay na finish — ang natatanging anyo ng bawat art-series board.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: Pagpi-print at Dekorasyon ng SUP
      description: Ang mga SUP board ay dinidekorasyon gamit ang digital printing para sa buong-kulay na mga graphics at screen printing para sa mga logo at paulit-ulit na pattern. Ang digital printers ay gumagawa ng photo-quality na disenyo sa deck, habang ang screen printing ay nagbibigay ng matibay at matingkad na brand marks.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Pangwakas na Assembly at Rigging
      description: Assembly line kung saan nakakabit ang mga board ng kanilang mga valve, D-rings, handles, fins, at leash attachments. Bawat board ay sumusunod sa 100-point assembly checklist na pinapirmahan ng team lead.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Pagsusuri at Pag-inspeksyon ng Kalidad
      description: Bawat kumpletong board ay dumadaan sa mandatoryong pagsusuri sa air-retention, beripikasyon ng seam peel, at kumpletong tseke ng sistema bago ipadala. Ang aming quality lab ay gumagana nang independente sa produksyon at nag-uulat nang direkta sa pamunuan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
