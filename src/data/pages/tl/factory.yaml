workshops_section:
  tagline: Mga Workshop
  title: Mga Workshop sa Paggawa
  workshops:
    - title: PVC Pagputol at Paghahanda ng Materyales
      description: Ang mga awtomatikong CNC na makinang pambura ay nagpoproseso ng PVC, Hypalon, at drop-stitch na mga tela na may sub-milimetrong katumpakan. Ang computer-optimised na pag-aayos ay nagpapaliit sa basura ng materyal at tinitiyak na bawat panel ay tumutugma sa sukat bago pagtahiin.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Pagtatahi ng Tubo at Pag-seal ng Init
      description: Nakatuon na workshop sa pagtatahi na may makinang pang-heat seal at RF dielectric press. Ang mga hot-air heat sealer ay ginagamit sa pagsanib at pagdikit ng mga PVC tube chambers, habang ang RF welds ay gumagawa ng matibay na airtight seams na lumalagpas sa ISO 9001 na mga pamantayan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Produksyon ng Hull ng RIB — Fiberglass
      description: Ang RIB na hull ng bangka ay ginagawa gamit ang hand-lay-up fiberglass molding na may polyester at vinylester resin systems. Bawat layer ay mano-manong iniikot at vacuum-bagged para sa pare-parehong kalidad. Ang gelcoat spray booth ay nagbibigay ng mataas na gloss, UV-resistant na finish sa dagat.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: Pagpi-print at Dekorasyon ng SUP
      description: Ang mga SUP board ay dinidekorasyon gamit ang digital printing para sa buong-kulay na mga graphics at screen printing para sa mga logo at paulit-ulit na pattern. Ang digital printers ay gumagawa ng photo-quality na disenyo sa deck, habang ang screen printing ay nagbibigay ng matibay at matingkad na brand marks.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Pangwakas na Assembly at Rigging
      description: Assembly line kung saan ang fiberglass hulls at PVC na tubo ay pinagsasama, nakalagay ang mga makina, konektado ang manibela at kontrol, at isinasaayos ang mga electrical system. Bawat bangka ay sumusunod sa 100-point assembly checklist na pinipirmahan ng team lead.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Pagsusuri at Pag-inspeksyon ng Kalidad
      description: Bawat natapos na bangka ay sumasailalim sa mandatory air-retention testing, pagsusuri ng seam peel, at buong systems check bago ipadala. Ang aming quality lab ay umuugnay nang hiwalay sa produksyon at direkta nag-uulat sa pamunuan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
