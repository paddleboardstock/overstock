qc_section:
  tagline: Kontrol ng Kalidad
  title: Proseso ng Pagsusuri at Pagtiyak ng Kalidad
  subtitle: Bawat bangka ay sumasailalim sa obligadong pagsusuri bago ipadala. Ang aming laboratoryo sa kalidad ay gumagana nang independent sa produksyon at direktang nag-uulat sa pamunuan.
  steps:
    - step: '1'
      title: Pagsusuri ng Hilaw na Materyal
      desc: Ang mga tela na PVC, Hypalon, at drop-stitch ay sumasailalim sa tensile testing (ASTM D751), tear propagation, at UV na verificasyon ng resistensya bago pumasok sa produksyon ang anumang batch.
    - step: '2'
      title: 48-Oras na Pagsusuri ng Pagpapanatili ng Hangin
      desc: Bawat tube chamber ay pinapalaki sa 125% ng nakasaad na presyon at hinahawakan ng 48 oras. Ang pagbaba ng presyon na higit sa 5% ay nagti-trigger ng awtomatikong pagtanggi at re-inspeksyon ng seam.
    - step: '3'
      title: Pagsusuri ng Load at Balanseng
      desc: Ang kumpletong bangka ay iniloload hanggang sa maximum na nakasaad na kapasidad at sinusuri para sa katatagan, freeboard, at paghawak. Bawat sasakyan ay sinusubukan sa tubig bago ang huling inspeksyon.
oem_section:
  tagline: Mga Proyekto ng OEM
  title: Kaso ng Brand at OEM Partnership
  subtitle: Mula konsepto hanggang container — kung paano namin tinutulungan ang mga global brand na ilunsad at palawakin ang kanilang mga inflatable watercraft lines.
  cases:
    - challenge: Kailangan ng European outdoor retailer ng private-label SUP line na may natatanging deck graphics, eco-friendly na PVC, at retail-ready packaging — lahat ay ipinadala sa loob ng 60 araw.
      solution: Nadevelop ang custom digital print files, nag-source ng REACH-compliant na PVC, at pinabilis ang sampling mula sa 3 rounds hanggang 1 sa pamamagitan ng paglagay ng design team sa aming pabrika sa Qingdao.
      result: 55 araw mula sa napirmahang PO hanggang FOB. 2,400 units sa loob ng 4 SKU. Inilagay ang repeat order bago dumating ang unang container.
    - challenge: Kailangan ng US watersports startup ng high-performance na drop-stitch kayak na may custom hull shape, co-branded packaging, at BSCI certification para sa retail placement.
      solution: Inangkop ang umiiral na drop-stitch kayak mould na may binagong rocker profile, nadevelop ang co-branded packaging artwork, at ibinigay ang full BSCI audit documentation.
      result: Matagumpay na nailista sa 3 pangunahing US outdoor chains. 5,000+ units sa unang taon na may 98% sell-through rate.
    - challenge: Kailangan ng distributor sa Australia ng CE-certified RIB range na may custom tube colours, Hypalon upgrade option, at pagsunod sa Australian Standard AS 1799.
      solution: Nilikha ang pre-production samples na may 4 tube colour variants, nag-source ng CSM Hypalon mula sa Japanese supplier, at naka-coordinate ng third-party AS 1799 compliance testing.
      result: 3-model RIB range inilunsad sa AU/NZ market. Sinundan ng panalo sa government tender para sa 12 patrol RIBs.
faq_section:
  tagline: FAQ
  title: B2B at OEM na Madalas Itanong
  questions:
    - q: Ano ang minimum na bilang ng order (MOQ) para sa OEM inflatable SUP boards?
      a: Nagsisimula ang MOQ sa 5–10 units para sa standard na OEM models. Ang mga custom moulds at private-label projects ay nangangailangan ng minimum na 200 units depende sa pagiging kumplikado. Ang trial orders at sample runs ay available para sa bagong paglulunsad ng brand.
    - q: May hawak ba ang Paddle Board Overstock ng BSCI certification?
      a: Oo. Ang aming pabrika ay may balidong BSCI social compliance certification (available ang audit report sa request). Hawak din namin ang ISO 9001:2015 para sa quality management, at 64 sa aming mga produkto ay may CE certification (TÜV Rheinland). Ang REACH at RoHS compliance documentation ay ibinibigay sa bawat OEM shipment.
    - q: Ano ang karaniwang lead time para sa isang OEM order?
      a: Ang karaniwang lead time ay 30–45 araw mula sa nakumpirmang PO at deposito. Ang paggawa ng custom na hulma ay nagdadagdag ng 15–20 araw para sa tooling. Nag-aalok kami ng pinabilis na produksyon para sa mga agarang order at mga rush na pana-panahon sa panahon bago ang tag-init (Ene–Mar).
    - q: Maaari mo bang ipadala ang FOB Qingdao o CIF sa aming pantalan?
      a: Oo. Nagpapadala kami sa FOB Qingdao, CIF pangunahing mga pandaigdigang pantalan, at DDP para sa mga kwalipikadong kasosyo. Pinamamahalaan ng aming logistics team ang pag-book ng container, dokumentasyon sa pag-export, at clearance sa customs. Nagpapadala kami sa 50+ bansa sa buong EU, US, AU, at mga merkado sa Asya.
b2b_moq: 'Pamantayan MOQ: 5–10 yunit bawat modelo (SUP/kayak/drop-stitch). RIB MOQ: 2–5 yunit. Malugod na tinatanggap ang pagsubok na mga order para sa mga bagong pakikipagtulungan.'
production_flow:
  tagline: Daloy ng Produksyon
  title: Mula sa Materyal hanggang sa Natapos na Bangka
  subtitle: Ang bawat bangka ay dumadaan sa 6 na yugto ng produksyon na may mga QC checkpoint sa bawat hakbang. Walang palusot, walang nilaktawang inspeksyon.
  stages:
    - stage: '01'
      title: Pagtanggap ng Materyal at Papasok na QC
      description: Lahat ng dumarating na materyales ay itinatala ayon sa batch/lot number sa aming ERP system. PVC mga rolyo ng tela, drop-stitch na mga core, balbula, pandikit, at hardware ay inilalagay sa kuwarentena hanggang sa pirma ng QC.
      qc_check: Lakas sa pagkakabuhol (ASTM D751), pagtutol sa punit (ISO 4674), sukat ng kapal, lagkit ng pandikit, pagsusuri ng biswal na depekto
      qc_threshold: 100% ng mga batch ay sinubok. Tanggihan kung ang tensile ay < 90% ng spec, tear < pinakamababa ng spec, o may anumang visual na depekto
      responsibility: Papapasok na QC team (3 tagasuri)
    - stage: '02'
      title: CNC Pagputol at Paghahanda ng Materyal
      description: Ang computer-optimized na pag-aayos ay naglalagay ng mga panel sa PVC stock upang mabawasan ang basura. Ang awtomatikong CNC cutting machines ay nagpapanatili ng 0.1 mm na katumpakan sa posisyon.
      qc_check: Pagsusuri ng sukat laban sa mga CAD DXF na file, inspeksyon ng kalidad ng gilid, beripikasyon ng bilang ng panel
      qc_threshold: Bawat ika-20 panel ay sinusukat. Tolerance ±0.5 mm. I-reject ang batch kung >2% ang lampas sa tolerance
      responsibility: Pinuno ng workshop sa paggupit
    - stage: '03'
      title: Pagsasama sa pamamagitan ng Welding at Drop-Stitch
      description: Ang mga Drop-stitch cores ay ikinabit sa panlabas na mga PVC laminates gamit ang heat lamination. Ang mga tube chambers ay RF-welded o hot-air welded. Ang mga rail bands ay triple-layer fusion bonded.
      qc_check: Pagsubok sa paghihiwalay bawat 50 yunit (ASTM D751), pagsukat ng lapad ng hinang, pagsusuri ng tala ng temperatura ng mainit na hangin, inspeksyon ng biswal ng tahi sa ilalim ng backlight
      qc_threshold: Pinakamababang lakas ng pagkakabukod 8 N/cm. Tolerance sa lapad ng panitikan ±1 mm. Anumang nakikitang channeling = tanggihan
      responsibility: QC ng Welding (2 inspektor bawat shift)
    - stage: '04'
      title: Pagpupulong at Pagkakabit
      description: 'Ang mga bangka ay inililipat sa huling pagpupulong kung saan lahat ng bahagi ay pinagsasama: katawan ng bangka + mga tubo, naka-install na balbula, D-rings, mga hawakan, kahon ng palikpik, at pag-aayos ng bag pangdala. Bawat yunit ay sumusunod sa isang 100-puntong checklist ng pagpupulong.'
      qc_check: 100-puntong checklist na pag-apruba bawat yunit, pagsubok sa function ng balbula (10 beses pagbukas/pagsara), beripikasyon ng torque ng hardware, visual na inspeksyon
      qc_threshold: 'Patakarang zero-depekto sa mga item na kritikal sa kaligtasan (mga balbula, D-ring, hawakan). Maliit na kosmetiko: AQL 2.5 (ISO 2859)'
      responsibility: Pangunahing tagapanguna ng koponan sa pagpupulong + QC ng linya
    - stage: '05'
      title: Pagsusuri ng Presyon at Paghawak ng Kalidad
      description: Ang bawat silid ay pinapalaki hanggang 1.25× ng naitalagang presyon (karaniwang 20–25 PSI) at pinananatili sa loob ng 24–48 oras. Ang mga sensor ng presyon ay tuloy-tuloy na nagtatala. Ang mga silid na lumalagpas sa 5% pagbaba ng presyon ay tinatanggihan at ipinapadala para muling inspeksyon ng tahi.
      qc_check: 24h tala ng pagpigil sa presyon, araw-araw na beripikadong kalibrasyon ng sensor, pagbasa ng presyon na may kompensasyon sa temperatura, muling pagsubok ng tahi pagkatapos ng pagkumpuni
      qc_threshold: Max 5% na pagbaba ng presyon sa loob ng 24h sa matatag na temperatura. Anumang kamara na lumampas dito = 100% muling pagsubok ng buong batch ng produksyon
      responsibility: Laboratoryo ng Kalidad (hiwalay sa produksyon, nag-uulat sa pamunuan)
    - stage: '06'
      title: Panghuling Inspeksyon at Pag-iimpake
      description: Panghuling visual at functional inspection. Mga depekto sa ibabaw, pagkakapantay-pantay ng kulay, beripikasyon ng label/BIN, integridad ng packaging, at kabuuan ng aksesorya. Ang mga yunit ay vacuum-packed, naka-box, at naka-pallet para sa paglo-load sa container.
      qc_check: Buong visual inspection, checklist ng aksesorya bawat SKU, packaging drop test (1 m, random sample), beripikasyon ng label/bar code scan
      qc_threshold: AQL 2.5 para sa mga pangunahing depekto, AQL 4.0 para sa minor. Zero tolerance sa mga safety defect. 100% ng mga yunit ay visual na iniinspeksyon
      responsibility: Panghuling QC team (4 na inspektor) + Pinuno ng Packing team
workforce:
  tagline: Ang Aming Mga Tao
  title: Workforce at Eksperto
  engineers: 25+
  engineers_detail: Mga inhinyero sa R&D, disenyo ng mold, laboratorium ng materyales, at production engineering. Karaniwang 7+ taon sa paggawa ng inflatable.
  shift_pattern: 2 shift/ araw (07:00–15:30, 15:30–00:00). Opsyonal na night shift para sa agarang mga order.
  training: Buwanang QC training, quarterly safety drills, taunang skills assessment. Ang mga bagong hire ay kumukumpleto ng 40-oras na induction bago magtrabaho sa production line.
  departments:
    - name: R&D at Engineering
      count: 25+
      role: Disenyo ng produkto, engineering ng molde, laboratorium ng materyales
    - name: Pagputol at Paghahanda ng Materyales
      count: 15
      role: CNC pagputol, paghahanda ng panel, paghawak ng materyales
    - name: Pagsasama at Lamination
      count: 40
      role: RF welding, hot-air welding, drop-stitch bonding
    - name: RIB Hull (FRP)
      count: 30
      role: Paglalagay ng fiberglass, gelcoat, vacuum bagging
    - name: Pagpupulong at Pagkakabit
      count: 35
      role: Panghuling assembly, pag-install ng hardware, check ng sistema
    - name: Kontrol ng Kalidad
      count: 12
      role: Incoming QC, in-process QC, panghuling inspeksyon, laboratory testing
    - name: Logistics at Pag-iimpake
      count: 20
      role: Packaging, paglo-load sa container, dokumentasyon para sa export
    - name: Pamamahala at Admin
      count: 15
      role: Sales, procurement, HR, finance, compliance
material_traceability:
  tagline: Traceability
  title: Pagsubaybay ng Materyales at Kontrol ng Batch
  description: Bawat batch ng raw material ay binibigyan ng natatanging lot number sa aming ERP system. Mula pagdating hanggang produksyon hanggang sa natapos na produkto, ang bill of materials ng bawat bangka ay naka-link pabalik sa orihinal na batch ng supplier. Ito ay nagpapahintulot ng buong upstream traceability para sa anumang kalidad o compliance inquiry.
  system: Custom ERP (internal system) + pisikal na batch tags sa bawat work order
  coverage: 100% ng mga materyales sa produksyon — PVC, Hypalon, drop-stitch tela, pandikit, balbula, hardware, packaging
  records_retained: 10 taon (ayon sa CE 2013/53/EU na kinakailangan)
  suppliers:
    - material: Marine-grade PVC
      source: Mga supplier na Tsino at Koreano
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch tela
      source: Panloob na paghahabi + panlabas na kasosyo
      certified: Internal QC + supplier ISO 9001
    - material: Valves & Hardware
      source: Chinese OEM suppliers
      certified: ISO 9001, mga sertipiko ng materyal bawat batch
qc_dashboard:
  tagline: QC ayon sa Numero
  title: Mga Sukatan sa Pagkontrol ng Kalidad
  subtitle: Tunay na datos ng pass/fail mula sa aming linya ng produksyon. Ang aming quality lab ay gumagana nang independiyente mula sa produksyon at direktang nag-uulat sa pamunuan.
  stats:
    - value: 100%
      label: Mga yunit na sinubok sa presyon
      detail: Bawat bangka, bawat chamber, bawat batch
    - value: <5%
      label: Pinapayagang pinakamataas na pagbagsak ng presyon
      detail: Sa loob ng 24h sa 1.25× rated pressure
    - value: AQL 2.5
      label: Threshold ng pangunahing depekto
      detail: Ayon sa ISO 2859 sampling standard
    - value: 24–48h
      label: Tagal ng pagpigil sa presyon
      detail: Depende sa kategorya ng produkto
    - value: 1.25×
      label: Test pressure kumpara sa rated
      detail: Safety margin sa bawat chamber
    - value: 0%
      label: Tolerance sa mga depekto sa kaligtasan
      detail: Valves, D-rings, seams, buoyancy
