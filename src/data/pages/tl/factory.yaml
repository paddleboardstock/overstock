hero:
  tagline: Pabrika
  title: Pabrika at Paggawa
  subtitle: 12,000 m2 ng integrated manufacturing — mula raw material hanggang sa finished board
intro:
  - Bilang factory brand ng **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock kinokontrol nito ang bawat yugto ng produksyon — mula sa pagdating ng raw PVC at drop-stitch materials hanggang sa huling pre-delivery inspection ng finished board. Ang aming manufacturing facility sa Weihai Economic Development Zone ay sumasaklaw sa 12,000 square metres at may mga dedikadong workshop para sa PVC cutting, heat sealing at welding, deck art finishing, final assembly, at quality testing.
  - Sa pamamagitan ng pagsasama ng disenyo, engineering, prototyping, pagmamanupaktura, at pagsubok sa ilalim ng isang bubong, tinatanggal namin ang mga hindi episyenteng gawain sa kontrata at pinananatili ang direktang kontrol sa kalidad ng paggawa, pagpili ng materyales, at mga timeline ng paghahatid. Bawat board na umaalis sa aming workshop ay ginagawa ng aming mga tao, gamit ang aming kagamitan, ayon sa aming mga pamantayan.
