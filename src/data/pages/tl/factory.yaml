hero:
  tagline: Pabrika
  title: Pabrika at Paggawa
  subtitle: 12,000 m2 na pinagsamang paggawa — mula sa hilaw na materyal hanggang sa natapos na bangka
intro:
  - Bilang tatak ng pabrika ng **Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock kinokontrol ang bawat yugto ng produksyon — mula sa pagdating ng hilaw na PVC at fiberglass na materyales hanggang sa huling inspeksyon bago ihatid ang natapos na bangka. Ang aming pasilidad sa paggawa sa Qingdao Economic Development Zone ay sumasaklaw ng 12,000 na metro kwadrado at naglalaman ng mga dedikadong workshop para sa pagputol ng PVC, pagtitistis ng tubo sa init, paggawa ng fiberglass RIB hull, SUP digital printing, huling pagpupulong, at pagsusuri ng kalidad.
  - Sa pamamagitan ng pagsasama ng disenyo, engineering, prototyping, paggawa, at pagsusuri sa ilalim ng isang bubong, inaalis namin ang mga hindi epektibong bahagi ng kontratang paggawa at pinapanatili ang direktang kontrol sa kalidad ng paggawa, pagpili ng materyal, at mga iskedyul ng paghahatid. Bawat bangka na lumalabas sa aming workshop ay ginawa ng aming mga tao, gamit ang aming kagamitan, ayon sa aming mga pamantayan.
