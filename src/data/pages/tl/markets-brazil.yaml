hero:
  tagline: Brazil
  title: SUP Wholesale Boards para sa<br />Mga Retailer sa Brazil
  subtitle: Para sa mga tindahan at operator mula Rio at Florianópolis hanggang sa baybayin ng Hilagang-Silangan — bagong overstock paddle boards mula sa 5 yunit, halo-halong modelo, na ipinapadala mula sa China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Mga SUP overstock board para sa mga retailer ng baybayin sa Brazil at mga paaralan ng paddle
direct_answer: Paddle Board Overstock nagbibigay ng bagong overstock inflatable SUP boards sa mga negosyo sa Brazil — paddle schools at shops sa Rio de Janeiro, Florianópolis, at Northeast coast, rental operators, at online sellers. Nagsisimula ang wholesale orders sa 5 boards na may mixed models sa isang shipment, ipinapadala mula Weihai, China sa pamamagitan ng express air freight o consolidated sea freight. Bawat board ay 100% pressure-tested at sakop ng 2-Year SUP Warranty.
tldr_points:
  - Wholesale mula sa 5 board — halo-halong modelo, presyo ayon sa kabuuang dami
  - Pagsisilbi sa kultura ng baybayin ng Brazil mula Rio hanggang Hilagang-Silangan
  - Express air o pinagsamang sea freight mula Weihai, China
  - 100% pressure-tested, 2-Taong SUP Warranty sa bawat board
overview_section:
  tagline: Pangkalahatang-ideya ng Merkado
  title: Ang SUP Pamilihan ng Brazil
  paragraphs:
    - Ang Brazil ay isa sa mga pinaka-natural na stand-up paddle market sa mundo. Ang kultura sa tabing-dagat ay pambansang kultura — mula sa Stand Up Paddle scene sa mga lagoon ng Rio at ang halo ng surf-at-flat-water ng Florianópolis hanggang sa mainit at kalmadong tubig ng Hilagang-Silangan sa Ceará, Pernambuco, at Bahia. Ang mga paddle school, paupahan sa lagoon, at mga komunidad sa downwind at SUP surf ay lahat ay umaakit mula sa isang napakalaking populasyon na mahilig sa sports.
    - Karaniwan, ang mga mamimili sa Brazil ay mga negosyong pinapatakbo ng mga may-ari — mga paupahang tindahan sa tabi ng lagoon, mga paaralan sa tabing-dagat, mga surf shop na nagdadagdag ng SUP pila, at lumalaking mga lokal na nagbebenta ng e-commerce. Nag-oorder sila sa maliliit na batch (5–20 boards), at pinahahalagahan nila ang tibay para sa araw-araw na paggamit at kompetisyon sa presyo sa isang merkado na may makabuluhang gastos sa pag-import.
  customer_types:
    - title: Mga Paaralan ng Lagoon at Beach
      description: Mga paaralan at mga operator ng paupahang bahay sa mga lagoon ng Rio at sa mga kalmadong dalampasigan ng Hilagang-Silangan ang nagbibigay ng mga leksyon at oras-oras na paupahan.
    - title: Mga Tindahan ng Surf
      description: Mga kilalang surf retailer na nagdadagdag ng flat-water at touring SUP para sa lokal na komunidad ng mga paddle.
    - title: Mga Online na Nagbebenta
      description: Mga lokal na nagbebenta ng e-commerce na nag-aangkat SUP ng stock upang pagsilbihan ang napakalaking panloob na merkado ng Brazil.
shipping_section:
  title: Pagpapadala sa Brazil
  paragraphs:
    - Ang mga order ay ipinapadala mula Weihai, China. Ang express air freight ay nagdadala ng mga sample at 1–3 board orders papunta sa mga pangunahing paliparan ng Brazil; Ang consolidated sea freight ay nagsisilbi ng 5–20 board wholesale orders sa mga pantalan tulad ng Santos at iba pang coastal gateways. Kasama sa iyong quote ang mga estima ng transit para sa iyong destinasyon.
    - Nagbibigay kami ng commercial invoice at packing list na kinakailangan para sa clearance, na may tamang HS codes at deklaradong halaga. Ang import duties at buwis ay babayaran ng importer ayon sa mga patakaran ng Brazil.
  customs_note: Malaki ang import tax ng Brazil sa mga sporting goods at nagkakaiba-iba depende sa klasipikasyon ng produkto. Kumpirmahin ang kasalukuyang duty, VAT, at anumang singil sa antas ng estado sa iyong customs broker (despachante) bago mag-order — nagbibigay kami ng kumpletong dokumentasyon ngunit hindi namin pinagsasama ang import taxes sa freight quotes.
faq_section:
  title: Brazil FAQ
  items:
    - q: Maaari bang hawakan ang mga quote at suporta sa Portuges?
      a: Oo — nakikipagtulungan kami sa mga mamimili na nagsasalita ng Portuges. Magtanong sa iyong inquiry at kami ang bahala sa iyong quote at order sa Portuguese.
    - q: Kasama ba sa iyong mga presyo ang mga buwis sa pag-aangkat ng Brazil?
      a: Wala. Ang import duties, VAT, at mga buwis sa antas ng estado ay responsibilidad ng importer ayon sa mga patakaran ng Brazil. Malinaw at hiwalay naming tinatanggap ang presyo ng board at kargamento, at nagbibigay kami ng mga papeles na kailangan ng iyong despacantie.
    - q: Ano ang itsura ng unang order para sa isang Brazilian beach school?
      a: 'Karaniwan 5–15 board: matitibay na pangkalahatang modelo para sa mga leksyon at pana-panahong renta, kasama ang ilang premium na edisyon para sa retail display. Halo-halong modelo sa isang padala, naka-presyo batay sa kabuuang dami.'
    - q: Nagpapadala ba kayo sa Brazil gamit ang kargang pandagat?
      a: Oo — ang pinagsamang kargang pandagat ay nagseserbisyo sa mga daungan ng Brazil para sa 5–20 wholesale na board order, naka-quote batay sa destinasyon. Available ang express na panghimpapawid para sa mga sample at agarang maliliit na order.
