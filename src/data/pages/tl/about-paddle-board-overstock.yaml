hero:
  tagline: Tungkol Sa
  title: Tungkol sa Paddle Board Overstock
  subtitle: Mula pa noong 2012, naglalagay kami ng mga bagong inflatable SUP board sa mga paddler at maliliit na retailer sa 50+ bansa — overstock inventory, tapat na presyo, at warranty na talagang iginagalang namin.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock mga bagong SUP inflatable board
direct_answer: Paddle Board Overstock ay isang tatak ng kagamitan para sa water sports na itinatag noong 2012 at nakabase sa Weihai, China. Nagbebenta kami ng mga bagong inflatable SUP board mula sa overstock inventory — isang halo ng sobrang produksyon mula sa aming sariling base ng paggawa at maingat na piniling stock mula sa mga partner na pabrika — direkta sa mga end paddler at sa maliliit na retailer sa 50+ bansa. Bawat board ay 100% pressure-tested, sinusuportahan ng 2-Taong SUP Warranty, at ipinapadala sa pamamagitan ng express o sea freight.
tldr_points:
  - Itinatag noong 2012, nakabase sa Weihai, China — isa sa mga pangunahing SUP sentro ng pagmamanupaktura sa mundo
  - 'Modelo ng overstock: mga bagong board sa presyo na mas mababa sa retail, walang middlemen'
  - 'Ang imbentaryo ay halo-halong pinagmulan: sobrang produksyon mula sa aming base kasama ang nasuri na stock ng partner-factory'
  - 50+ bansa ang pinaglilingkuran, 99.3% final-inspection pass rate, 2-Taong SUP Warranty
story_section:
  tagline: Ang Aming Kwento
  title: Bakit Kami Nagbebenta ng Overstock
  paragraphs:
    - Paddle Board Overstock nagsimula noong 2012 sa Weihai, China — isang baybaying lungsod sa lalawigan ng Shandong na lumago bilang isa sa pinakamahalagang SUP inflatable manufacturing hub sa mundo. Mula sa base na iyon, mahigit isang dekada na kaming gumagawa ng inflatable paddle boards at ipinapadala ito sa buong mundo.
    - Along the way we noticed something that shapes everything we do today: Bawat production season ay nag-iiwan ng mga bagong, maayos na board — sobrang mga produksyon, mga kinanselang order, mga kulay ng nakaraang season. Samantala, ang mga independent retailer sa buong mundo ay hindi nakapasok sa wholesale dahil ang mga tradisyunal na supplier ay humihingi ng mga order na kasing laki ng lalagyan.
    - Ang agwat na iyon ang aming negosyo. Sa pamamagitan ng pagbebenta ng overstock inventory — sobrang produksyon mula sa aming sariling base sa Weihai, kasama ang maingat na piniling stock mula sa mga partner factories — maaari kaming mag-alok ng mga bagong board sa presyong mas mababa sa karaniwang retail, sa dami na kayang gawin ng isang paddler o limang board na order sa tindahan. Walang second-hand, walang pangalawa; ito ay imbentaryo lamang na karapat-dapat sa isang customer imbes na isang bodega.
model_section:
  tagline: Ang Aming Modelo ng Negosyo
  title: Paano Gumagana ang Overstock Model
  items:
    - title: Bagong-Bago, Hindi Kailanman Ginamit
      description: Bawat board na binebenta namin ay bago at hindi pa nagagamit. Ang overstock ay nangangahulugang sobra at sobra na imbentaryo — hindi returns, hindi refurbishs, hindi seconds.
    - title: Mixed-Source na Imbentaryo
      description: Pinagsasama ng aming stock ang sobrang produksyon mula sa aming sariling base ng pagmamanupaktura sa Weihai at ang imbentaryo na pinili mula sa mga partner na pabrika na pareho naming pinananatili sa parehong pamantayan ng kalidad. Halo-halo ang mga pinagkukunan; ang mga pamantayan ay hindi.
    - title: Presyo sa Ibaba ng Retail
      description: Mas mura ang overstock inventory para makuha ito, kaya mas mura ang pagbili. Walang pinalaking listahan ng presyo, walang pekeng diskwento — tapat lang ang presyo sa totoong imbentaryo.
    - title: Pakyawan para sa maliliit na negosyo
      description: Nagsisimula ang wholesale sa 5 boards, hindi container loads. Maaaring pagsamahin ng maliliit na retailer ang anumang in-stock na modelo sa isang order at pumili ng express o sea freight.
    - title: Direktang Pagpapadala sa Iyo
      description: Ang mga order ay direktang ipinapadala mula sa aming logistics base sa Weihai papunta sa iyong pintuan sa 50+ bansa — express para sa mga sample at maliliit na order, pinagsamang sea freight para sa wholesale.
quality_section:
  tagline: Kalidad at Warranty
  title: Ang Kalidad sa Likod ng Bawat Board
  subtitle: Ang overstock pricing ay hindi nangangahulugang maluwag ang mga pamantayan. Bawat board — anuman ang pinagmulan nito — ay dumadaan sa parehong proseso bago ito ipadala.
  items:
    - title: 100% nasubok sa presyon
      description: Bawat isa sa mga board ay pinupuno ng hangin at sinusuri sa presyon na 15 PSI bago ipadala. Walang board na ipinapadala nang hindi nasusuri, kahit saan man nanggaling ang imbentaryo nito.
    - title: Nasubok sa Overload na 1.25x
      description: Ang mga board mula sa aming produksyon ay sinusuri bilang sample ng lampas sa itinalagang presyon — pinananatili sa 1.25x na working pressure ng 24–48 na oras upang mapatunayan ang mga seams, valves, at drop-stitch konstruksyon.
    - title: 99.3% Taunang Pagsusuri sa Pagsusuri (Final-Inspection) na Rate ng Pagpasa
      description: Ang aming proseso ng pangwakas na inspeksyon ay pumapasa sa 99.3% ng mga board bilang walang depekto — at ang maliit na bahaging pumapalta ay hindi kailanman pumapasok sa aming imbentaryo.
    - title: 2-Taong SUP Warranty
      description: Bawat SUP board ay may 2-Taong SUP Warranty na sumasaklaw sa mga depekto sa paggawa. Ang parehong warranty ay nalalapat sa bawat customer sa bawat isa sa aming 50+ na merkado.
