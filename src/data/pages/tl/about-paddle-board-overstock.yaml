team_section:
  tagline: Ang Koponan
  title: Ang Mga Tao sa Likod ng Mga Board
  description: Ang aming base sa Weihai ay tahanan ng 14+ malakas na koponan sa pananaliksik at pagpapaunlad na sumasaklaw sa mga materyales, disenyo ng istruktura, at proseso ng produksyon. Sa paligid nila ay umiikot ang mas malawak na koponan na nagpapatakbo ng kontrol sa kalidad, imbentaryo, logistika, at suporta na makukuha mo kapag nakipag-ugnayan sa amin — ang parehong mga tao, kahit na bumili ka ng isang board o dalawampu.
