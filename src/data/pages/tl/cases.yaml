hero:
  tagline: Mga Pag-aaral ng Kaso
  title: Tunay na mga Proyekto, Tunay na Resulta<br />— Aquafarer sa Aksyon
  subtitle: Tingnan kung paano Aquafarer nakikipagtulungan sa mga distributor, brand, at operator sa buong mundo upang maghatid ng custom na marine solutions para sa bawat aplikasyon.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer Mga pag-aaral ng kaso — mga custom na proyekto sa paggawa ng dagat
features3_cases:
  tagline: Mga Tampok na Kaso
  title: Mga Pasadyang Solusyon<br />Para sa Tunay na Mga Hamon
  isBeforeContent: false
  columns: 3
  items:
    - title: Araw-araw na Pag-upgrade ng Operasyon ng Bali Diving Center
      customer: Blue Ocean Diving Center
      country: Indonesia
      industry: Komersyal na Sentro ng Pagsisid
      challenge: Ang Blue Ocean Diving Center sa Bali ay nagpapatakbo ng lumang fiberglass dive boat na may limitadong deck space, mahirap mag-diver boarding, at mataas ang maintenance sa tropical saltwater conditions. Masikip ang paglo-load ng kagamitan, mahaba ang oras ng paghahanda, at ang hindi matatag na platform ay nagdulot ng mga alalahanin sa kaligtasan para sa mga internasyonal na turista — kabilang ang mga unang beses na divers at mga mas matatandang manlalakbay. Nagpapatakbo ang center ng 3-5 diving trips araw-araw, 200+ araw kada taon.
      solution: Aquafarer nagbigay ng custom na 6.8m Professional Diving RIB na may pinalawak na deck layout na inangkop para sa scuba equipment storage, malapad na stainless steel dive ladder, heavy-duty Hypalon tubes UV para sa at saltwater resistance, non-slip deck surface, at tank storage solution. Ang configuration ay dinisenyo batay sa daily workflow ng diving center — hindi batay sa standard na layout ng recreational boat.
      product: 6.8m Propesyonal na Pagsisid RIB
      results: Mas malawak na lugar ng trabaho ang nagpabuti sa kahusayan ng paghahanda ng kagamitan. Naranasan ng mga divers ang mas ligtas at mas madaling pagsakay. Malaki ang nabawas sa mga pangangailangan sa maintenance. Nagkaroon ang sentro ng kapasidad na humawak ng mas maraming customer sa peak season nang may mas mataas na kumpiyansa. Ito RIB ang naging pundasyon ng araw-araw na operasyon ng diving.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Ang aming diving boat ay hindi lamang transportasyon. Ito ang pundasyon ng aming araw-araw na operasyon.Aquafarer RIB Nagbibigay ito ng mas malaking kumpiyansa sa aming koponan kapag nagsasagawa ng maraming diving trips araw-araw.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center RIB Propesyonal na Pag-upgrade
      customer: Ocean Explorer Diving Center
      country: Thailand
      industry: Komersyal na Sentro ng Pagsisid
      challenge: Kinailangan ng Ocean Explorer Diving Center sa Phuket, Thailand na mag-upgrade mula sa tradisyunal na fiberglass dive boat na hindi makasabay sa lumalaking demand ng mga customer. Ang limitadong espasyo sa deck ay naging dahilan upang hindi epektibo ang paghahanda ng kagamitan. Ang mahirap na pagsakay ay nagdulot ng mga hamon sa kaligtasan para sa mga internasyonal na turista. Ang mataas na pangangailangan sa maintenance sa tropikal na maalat na kondisyon ay nagdulot ng pagtaas ng gastos sa operasyon. Ang sentro ay nagpapatakbo ng maraming araw-araw na biyahe, 200+ araw kada taon.
      solution: Aquafarer naghatid ng customized na 6.8m Commercial Diving RIB na may optimized na working deck layout para sa scuba tank storage, paghahanda ng kagamitan, at galaw ng diver. Kabilang sa mga tampok ang malapad na diving ladder na may stainless steel handrails, heavy-duty tube construction na may UV-resistant materials, non-slip flooring, tank storage solution, professional console, at passenger seating — lahat ay naka-configure para sa commercial diving operations.
      product: 6.8m Komersyal na Pagsisid RIB
      results: Ang mas malaking deck area ay nagbigay-daan sa mas mabilis na organisasyon ng kagamitan at mas episyenteng pang-araw-araw na daloy ng trabaho. Malaki ang pagbuti ng kaginhawaan at kaligtasan ng customer boarding. Nabawasan ang downtime ng maintenance dahil sa marine-grade na konstruksyon. Maaaring pagsilbihan ng diving center ang mas maraming customer sa peak season at palawakin ang propesyonal na diving services nang may kumpiyansa.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Para sa isang diving center, ang bangka ay hindi lamang transportasyon. Ito ay mahalagang bahagi ng aming araw-araw na operasyon.Aquafarer RIB Nagbibigay ito ng kumpiyansa sa aming koponan na magpatakbo ng maraming diving trips araw-araw nang mas ligtas at episyente.
      icon: tabler:lifebuoy
    - title: Pangkalahatang European Diving Center
      customer: BlueMed Diving Centers
      country: Gresya
      industry: Diving at Marine Tourism
      challenge: Kinailangan ng 12 dive-configured RIBs para sa isang kadena ng diving centers sa iba't ibang isla ng Greece. Bawat bangka ay nangangailangan ng custom dive ladder, tank storage para sa 8 tangke, at matatag na platform para sa open-water diver entry. Kailangang dumating ang fleet sa loob ng 60 araw para sa pagsisimula ng tourist season.
      solution: Nakagawa ng 12 RIB 520 Dive models na may integrated tank racks, dive ladders, at extra-wide Hypalon tubes para sa boarding stability. Bawat bangka ay may brand ng customer fleet livery. Lahat ng 12 bangka ay na-pressure test at naipadala mula Qingdao sa loob ng 55 araw.
      product: RIB 520 Dive
      results: Lahat ng 12 bangka ay naihatid sa tamang oras para sa panahon ng turismo. Ang fleet ay araw-araw na nag-ooperate sa loob ng 18+ buwan nang walang anumang pagkasira ng materyales. Nag-order ang customer ng 6 pang karagdagang yunit sa ikalawang taon.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Ang RIB 520 Dive ang naging gulugod ng aming araw-araw na operasyon sa diving. Napakahusay ng katatagan habang nagpapahinga, at ang layout ng tank storage ay nagpapanatiling malinis at ligtas ang deck para sa aming mga bisita.
      icon: tabler:lifebuoy
    - title: Programa ng Distributor ng Australia OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Paggawa
      challenge: Kailangan ng distributor sa Australia ng private-label SUP board range sa kompetitibong presyo upang makipagsabayan sa mga Chinese direct-to-consumer brands. Kinakailangan ang 8 natatanging modelo mula baguhan hanggang advanced, na may custom graphics, custom packaging, at drop-ship fulfillment sa mga retail outlet.
      solution: Nakabuo ng 8 SUP modelo (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) na may eksklusibong Australian graphics package. Custom retail packaging na may QR code na nagli-link sa setup videos. Drop-ship logistics na naka-configure mula Qingdao direkta sa Australian retail stores.
      product: Custom SUP Line (8 modelo)
      results: Konsepto hanggang unang pagpapadala sa loob ng 90 araw. Retail sell-through rate na 85% sa unang season. Pinalawak ng distributor ang partnership upang isama ang inflatable boat line sa ikalawang taon.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer Naghatid ng kumpletong SUP linya sa loob ng 90 araw — mula sa unang disenyo hanggang sa retail floor. Ang kalidad ay tumutugma sa mga brand na binebenta sa doble ng presyo.
      icon: tabler:arrows-exchange
    - title: Suplay ng Bangkang Pangligtas sa Gitnang Silangan
      customer: Pambansang Awtoridad sa Depensa Sibil
      country: United Arab Emirates
      industry: Paghahanap at Pagsagip
      challenge: Kailangan ng civil defense organization ng 20 patrol-ready RIBs para sa coastal search and rescue, port security, at flood response. Kinakailangang self-bailing decks, kumpletong navigation suites (GPS, radar, VHF), high-visibility orange tubes, at pagsunod sa lokal na maritime regulations.
      solution: Nag-supply ng 20 RIB 450 Patrol models na may self-bailing decks, Garmin navigation suites, LED searchlights, SOLAS reflective tape, at high-visibility orange Hypalon tubes. Bawat bangka ay CE-certified at sinubukan ayon sa ISO 6185 standards. Kasama sa documentation package ang compliance certificates para sa lokal na rehistrasyon.
      product: RIB 450 Patrol
      results: Ang fleet ay naka-deploy sa 5 coastal stations. Ang mga bangka ay nag-ooperate sa matinding init (45°C+) na walang tube degradation. Ang patrol range at fuel efficiency ay lumampas sa mga espesipikasyon ng 12%.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB Lumampas ang 450 Patrol sa aming operational requirements. Sa matinding init, Hypalon walang palatandaan ng UV pagkasira ang mga tubo matapos ang 24 na buwan ng araw-araw na paggamit.
      icon: tabler:alert-triangle
    - title: Pakikipag-partner sa Brand ng European OEM
      customer: North Sea Marine Equipment BV
      country: Netherlands
      industry: OEM/ODM Paggawa
      challenge: Nais ng matatag na European marine brand na palawakin ang RIB merkado nang hindi namumuhunan sa mga pasilidad ng paggawa. Kailangan ng isang white-label na kasosyo na kayang gumawa ng 5 RIB modelo (3.9m hanggang 6.2m) na may pribadong branding, CE sertipikasyon, at eksklusibong karapatan sa distribusyon ng EU.
      solution: Itinatag ang white-label manufacturing agreement para sa 5 RIB modelo. Bawat modelo ay may brand ng customer logo at color scheme.CE Dokumentasyon ng sertipikasyon na inihanda para sa bawat modelo. Eksklusibong karapatan sa distribusyon ng EU na ibinibigay na may minimum na order commitments. Teknikal na dokumentasyon at katalogo ng spare parts para sa lokal na service network.
      product: Custom RIB Line (5 modelo)
      results: Nilagdaan ang multi-taong kasunduan. Unang produksyon na 50 yunit naipadala sa loob ng 75 araw. Inilunsad ang brand sa METSTRADE na may positibong pagtanggap sa mga dealer.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Ang pakikipagtulungan Aquafarer sa amin ay nagbigay-daan upang makapasok sa RIB merkado nang hindi nagtatayo ng pabrika — naghatid sila ng kumpletong turnkey na solusyon na may CE sertipikasyon at dokumentasyon ng suporta sa dealer.
      icon: tabler:building
    - title: Pangkalahatang Caribbean Resort
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Turismo sa Dagat at Pagkamapagpatuloy
      challenge: 'Kailangan ng luxury resort ng kumpletong fleet ng kagamitan sa water sports para sa mga aktibidad ng bisita: 40 SUP board para sa guided tours, 20 kayak para sa lagoon exploration, 10 inflatable boats para sa guest transfers at fishing excursions, pati na rin mga aksesorya. Lahat ng kagamitan ay nangangailangan ng custom resort branding at kailangang maihatid bago ang peak tourist season.'
      solution: 'Gumawa ng kumpletong water sports package: 40 SUP Voyager boards (All-Around model), 20 Explorer kayaks, 10 AirDeck 360 inflatable boats, pati na rin PFDs, paddles, pumps, at repair kits. Lahat ng kagamitan ay naka-print na may resort logo at tropical color scheme. Containerized shipment na may kumpletong inventory manifest.'
      product: Kumpletong Pakete para sa Water Sports (70+ yunit)
      results: Dumating ang fleet 6 na linggo bago ang peak season. Tumaas ng 40% ang guest satisfaction scores para sa mga aktibidad sa water sports taon-taon. Ang kagamitan ay tumagal ng 3 season na may routine maintenance lamang.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Ang buong package na pamamaraan ay nangangahulugang natanggap namin ang lahat ng kailangan namin sa isang shipment — mga board, kayak, bangka, at mga aksesorya na lahat ay may brand at handa nang gamitin ng mga bisita. Gustong-gusto ng aming mga bisita ang kalidad ng kagamitan.
      icon: tabler:beach
    - title: Pag-upgrade ng Queensland Commercial Diving Center RIB
      customer: Komersyal na Sentro ng Pagsisid
      country: Australia
      industry: Komersyal na Diving at Serbisyo sa Dagat
      challenge: Isang commercial diving center na nakabase sa Queensland na dalubhasa sa marine infrastructure inspection, port maintenance, at underwater repair projects ang nagpapatakbo ng isang lumang workboat. Habang lumalaki ang demand sa proyekto, naging pabigat ang lumang barko — ang madalas na maintenance ay nagdudulot ng abala sa iskedyul, ang layout ay hindi dinisenyo para sa modernong diving operations (limitado ang espasyo para sa cylinders, tools, at equipment), at mahina ang kaginhawaan ng crew sa mahabang operasyon. Kailangan ng kumpanya ng barko na kayang suportahan ang kanilang propesyonal na operasyon araw-araw.
      solution: Aquafarer Nagsagawa ng detalyadong operational analysis ng workflow ng customer diving, karaniwang tagal ng proyekto, laki ng crew, at mga pangangailangan sa kagamitan. Batay sa pagsusuring ito, Aquafarer naghatid ng customized na propesyonal RIB na may functional deck layout na optimized para sa paghahanda ng kagamitan at galaw ng diver, propesyonal na upuan para sa mas mahabang panahon ng transportasyon, pinahusay na katatagan para sa mas ligtas na pagpasok at paglabas ng diver, at mga tampok ng diving support na isinama sa disenyo.
      product: Pasadyang Propesyonal na Pagsisid RIB
      results: Ang bago RIB ay naging maaasahang pang-araw-araw na plataporma ng trabaho. Mas mabilis ang paghahanda ng kagamitan dahil sa na-optimize na layout. Iniulat ng crew ang pinahusay na ginhawa at kaligtasan sa mahabang operasyon. Ang propesyonal na itsura ng bangka ay nagpatibay ng kumpiyansa ng mga customer kapag nakikipagtrabaho sa mga operator ng pantalan at mga marine contractor. Nakakuha ang diving center ng barkong tumutugma sa propesyonalismo ng kanilang serbisyo.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Kailangan namin ng bangka na kayang suportahan ang aming negosyo araw-araw, hindi lamang isang sasakyan para sa transportasyon. Aquafarer ay nakipagtulungan sa amin upang maunawaan ang aming mga pangangailangang operasyonal at naghatid ng RIB na solusyon na angkop sa aming daloy ng trabaho sa komersyal na diving.
      icon: tabler:lifebuoy
    - title: Kontrata para sa US Coastal Patrol
      customer: Atlantic Coastal Security Agency
      country: Estados Unidos
      industry: Seguridad at Pagpapatupad ng Batas sa Dagat
      challenge: Kinailangan ng ahensya sa seguridad sa baybayin ng US ng matibay na RIBs para sa operasyon ng intercept sa bukas na dagat. Kailangan ng twin-engine na konfigurasyon para sa redundancy, armored console para sa proteksyon ng crew, military-spec na electronics (encrypted communications, FLIR, radar), at pagsunod sa regulasyon ng US Coast Guard.
      solution: Inengginyero ang RIB 600 Patrol na may twin 115 HP outboard configuration, armored console na may ballistic protection, FLIR thermal imaging, encrypted VHF/UHF communications, at integrated weapons mounting points. Ang hull ay pinalakas para sa high-speed intercept maneuvers. Lahat ng electronics ay integrated at sinubok sa pabrika. Ibinigay ang USCG compliance documentation.
      product: RIB 600 Patrol (Twin Engine)
      results: Naabot ng mga bangka ang 52 knot na pinakamataas na bilis sa panahon ng acceptance trials. Iniulat ng ahensya ang 95% mission readiness rate sa unang 12 buwan. Naglagay ng karagdagang order para sa 8 yunit.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Ang twin-engine RIB 600 ay nagbibigay sa aming mga crew ng bilis at redundancy na kailangan para sa open-water intercept operations. Ang armored console ay nagbibigay ng kritikal na proteksyon nang hindi isinasakripisyo ang performance.
      icon: tabler:shield
cta:
  title: May proyekto ka bang nais talakayin?
  subtitle: Bawat Aquafarer partnership ay nagsisimula sa isang talakayan. Ipaalam sa amin ang iyong mga pangangailangan at kami ay magde-develop ng solusyon.
  actions:
    - variant: primary
      text: Simulan ang iyong proyekto
      href: /contact
    - text: Tingnan ang aming mga kakayahan
