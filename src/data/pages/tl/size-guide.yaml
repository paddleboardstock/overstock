how_to_choose:
  title: Paano Pumili ng Tamang Sukat
  cards:
    - title: All-Around SUP Mga Board
      description: Ang aming ~11 ft na all-around boards (32" ang lapad, 6-inch drop-stitch) ay balanseng katatagan, bilis, at kapasidad. Ihambing ang dami ng board sa iyong timbang — ang mas mabibigat na manlalaro ay nangangailangan ng mas malaking dami.
    - title: Lapad at Lapot
      description: Ang mas malapad na boards (32"+) ay nagbibigay ng mas malaking katatagan para sa mga baguhan, yoga, at pangingisda. 6-inch na lapot sa 15 PSI ay pinananatiling matibay ang deck sa ilalim ng manlalaro at kagamitan.
    - title: Mga Pakete at Kagamitan
      description: Bawat board ay ipinapadala bilang kumpletong pakete — board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, at repair kit. Suriin ang maximum na load para sa rider kasama ang kagamitan.
