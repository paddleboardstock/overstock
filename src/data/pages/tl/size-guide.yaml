hero:
  title: Gabinete sa Sukat at Espesipikasyon
  subtitle: Mga sukat, kapasidad, at inirerekomendang gamit para sa bawat Aquafarer produkto.
categories:
  inflatable: Inflatable SUPs at mga kayak na idinisenyo para sa madaling dalhin nang hindi isinasakripisyo ang performance. Ipares ang tamang sukat sa iyong timbang at istilo ng paglalangoy.
  rib: Matitigas na hull na inflatable na mga bangka para sa pag-navigate sa baybayin, pag-patrol, at propesyonal na operasyon sa dagat. Pumili ayon sa haba at kapasidad ng makina.
  accessory: Mga aksesorya at kagamitang pangkaligtasan na nagko-komplemento sa iyong sasakyang-dagat. Universal na sukat na may maraming opsyon.
