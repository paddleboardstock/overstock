how_to_choose:
  title: Paano Pumili ng Tamang Sukat
  cards:
    - title: SUP Mga Board
      description: Piliin ang haba batay sa iyong timbang at nakatakdang gamit. Mas malalapad na boards (32"+) ay nagbibigay ng mas mataas na katatagan. Mas mahahabang boards (11-12 ft) ay mas mahusay sa pag-turya. Ang mas mabibigat na paddlers ay nangangailangan ng boards na may mas mataas na volume.
    - title: Mga Kayak
      description: Ang mga single kayak (9 ft) ay pinakamainam para sa solo na paglalakbay at ilog. Ang tandem kayaks (12 ft) ay may kakayahang maglaman ng dalawang paddlers o isang adulto kasama ang kagamitan. Suriin ang kapasidad ng timbang para sa kabuuang load kabilang ang kagamitan.
    - title: Mga Dinghy at RIBs
      description: Piliin ang haba ng dinghy ayon sa bilang ng pasahero at nakatakdang gamit. Mas malalaking RIBs (4.5 m+) ay angkop para sa offshore at rescue. Mas maliliit na dinghies (2.7 m) ay gumagana bilang tenders at plataporma sa pangingisda.
