hero_text:
  tagline: Kontak
  title: MAKIPAG-UGNAYAN
contact_form:
  id: form
  title: Magpadala sa amin ng mensahe
  subtitle: Para sa mga tanong tungkol sa order, payo sa sukat o suporta sa produkto, magpadala sa amin ng mensahe. Sumasagot kami sa loob ng isang araw ng negosyo.
  email_to: info@paddleboardoverstock.com
  submit_button: Magpadala ng Pagtatanong → Kumuha ng Quote
  success_message: Salamat! Ang iyong mensahe ay natanggap na sa aming inbox. Sasagutin namin ito sa loob ng isang araw ng negosyo.
  error_message: May nagkamali sa pagpapadala ng iyong mensahe. Pakisubukang muli o mag-email sa amin nang direkta.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: pakisolve ang sumusunod'
  fields:
    - name: unangPangalan
      label: Pangalan
      row: 1
    - name: hulingPangalan
      label: Apelyido
      row: 1
    - name: pangalanKompanya
      label: Pangalan ng Kumpanya
      row: 2
    - name: address
      label: Address
      row: 3
    - name: zip
      label: Zip / Postal Code
      row: 4
    - name: country
      label: Bansa
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Tinatayang Dami ng Order
      row: 6
      type: select
      options:
        - value: ''
          label: Ilan ang mga board na bibilhin mo?...
        - value: one
          label: Isa lamang na board
        - value: 2-4
          label: 2–4 na board
        - value: 5-plus
          label: 5+ board (para sa pamilya, club, o renta)
    - name: customization
      label: Ano ang maaari naming maitulong?
      row: 7
      type: select
      options:
        - value: ''
          label: Pumili ng paksa...
        - value: none
          label: Pangkalahatang tanong sa produkto
        - value: sizing
          label: Tulong sa pagpili ng tamang board
        - value: order
          label: Pag-order, pagbabayad o pagpapadala
        - value: warranty
          label: Suporta sa warranty o pagkukumpuni
    - name: interesSaProdukto
      label: Mga Kategorya ng Produkto na Interesado
      row: 8
      type: select
      options:
        - value: ''
          label: Pumili ng kategorya ng produkto...
        - value: all
          label: Lahat ng produkto / Buong katalogo
        - value: sup
          label: SUP Mga Board / Paddleboards
        - value: packages
          label: Kumpletong SUP na mga pakete
        - value: accessory
          label: Mga Aksesorya (pampump, sagwan, bag)
    - name: subject
      label: Paksa
      row: 9
    - name: message
      label: Mensahe
      row: 10
      type: textarea
      rows: 6
