testimonial:
  content: Paddle Board Overstock dinisenyo at nilagyan ng kagamitan ang aming buong programa sa aktibidad sa tabing-dagat sa tatlong ari-arian ng resort. 120 SUPs, imprastraktura sa kaligtasan, at pagsasanay ng tauhan — lahat ay naipadala sa isang padala. Tumaas ng 60% ang partisipasyon ng aming mga bisita sa mga aktibidad sa tubig sa unang season.
  name: Sophie Laurent
  title: Direktor ng Guest Experience, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Mga Profile ng Resort
  title: Mga Solusyon sa Hospitality sa Waterfront<br />Ayon sa Uri ng Katangian
  subtitle: Bawat resort property ay may natatanging guest profile, halo ng mga aktibidad, at ritmo ng operasyon — mula sa boutique eco-lodges hanggang sa malalawak na luxury beachfront resorts. Dinisenyo namin ang mga water sports program na tumutugma sa klase ng ari-arian at inaasahan ng mga bisita.
  items:
    - title: Mga Luxury Resort sa tabing-dagat
      subtitle: VIP transfers, mga aktibidad sa tubig, premium na karanasan ng bisita
      description: Mga high-end na beachfront properties — Four Seasons, Aman, at mga katulad na luxury groups — kung saan ang water sports ay pangunahing amenidad ng bisita na nagdudulot ng satisfaction scores at karagdagang kita. Dapat magmukhang premium ang fleet, mag-alok ng iba't ibang edad at antas ng kakayahan, at seamless na makisama sa umiiral na concierge at booking systems ng resort. Napakataas ng inaasahan sa itsura ng bisita — direktang nakakaapekto sa kondisyon at presentasyon ng kagamitan ang 5-star reviews.
      features:
        - Premium na branded na fleet ng SUPs sa magkakatugmang kulay ng resort
        - 'Presentasyon na handa para sa mga bisita: magkatugmang kulay ng resort, logo branding, at ipinakitang kagamitan sa entablado'
        - Mga signature art-series na board para sa premium na karanasan ng bisita at mga sandali sa litrato
        - 'Pinagsamang imprastruktura ng kaligtasan: mga linya ng buoy, mga istasyon ng lifeguard, AED'
        - 'Pamamahala ng kita: dynamic na mga template ng presyo, pagsasanay sa upsell, package bundling'
    - title: Mga Pribadong Resort sa Isla
      subtitle: Tahimik at self-sufficient na mga aktibidad sa tubig para sa mga bisita
      description: 'Ang mga pribadong resort sa isla ay nag-ooperate sa mga liblib na lugar kung saan komplikado ang logistics at mahalaga ang bawat delivery. Ang mga aktibidad sa tubig para sa bisita ay kailangang maging self-sufficient: mga kagamitan na compact ang pag-iimbak, nagpapalobo kapag kinakailangan, nangangailangan ng minimal na maintenance, at maganda ang presentasyon kapag dumarating ang mga bisita. Nagpaplano kami ng mga fleet program sa paligid ng mga bintana ng seaplane at sea freight, at ang matibay naming konstruksyon ay nagpapanatiling handa ang mga kagamitan para sa mga bisita sa mahabang panahon nang walang suporta mula sa mainland.'
      features:
        - Compact inflatable fleet — epektibong nagpapadala at nag-iimbak sa mga liblib na isla
        - Commercial-grade na PVC konstruksyon para sa multi-season na paggamit ng bisita
        - Madaling maintenance sa lugar na may kasamang repair kits at video guidance
        - Custom na resort branding na tumutugma sa estetika ng isla
    - title: Lakeside at Eco Resorts
      subtitle: Karanasan ng mga bisita na isinama sa kalikasan
      description: Mga property sa tabi ng lawa, eco-lodges, at nature retreats na nag-aalok ng tahimik at mababang impact na mga aktibidad sa tubig na bumabagay sa natural na kapaligiran. Ang mga kagamitan ay dapat hindi motorized kung maaari, madaling itago kung limitado ang espasyo, at tahimik gamitin upang mapanatili ang karanasan sa paligid para sa lahat ng bisita.
      features:
        - Hindi motorisadong SUP fleet sa seryeng sining na inspirasyon ng kalikasan
        - Tahimik na electric pump inflation stations para sa paggamit ng mga panauhin kapag kinakailangan
        - Mga materyales at pambalot na eco-friendly na akma sa branding ng pagpapanatili
        - Kasama sa mga storage rack at dockside organization system
    - title: Mga Klab sa Tabing-Dagat
      subtitle: Libangan para sa mga bisita at atmospera sa tabing-dagat
      description: Ang mga beach club ay nagpapatakbo ng isang mataas na enerhiya at visually-focused na kapaligiran kung saan bahagi ng atmospera ang kagamitan. Kailangan nila ng mga stylish paddle board para sa libangan ng mga bisita, SUP mga paupahan para sa mga aktibidad sa tabing-dagat, at mga kagamitan na kasing ganda ng mismong lugar. Dapat madaling patakbuhin ang fleet, tiisin ang araw-araw na paggamit ng mga bisita na may iba't ibang antas ng kasanayan, at mabilis na ma-deploy tuwing peak hours.
      features:
        - Signature art-series SUPs na nagsisilbing dekorasyon ng venue
        - Fleet na handa SUP na paupahan para sa libangan ng mga bisita
        - Pasadyang kulay at pagbibigay tatak na tumutugma sa biswal na pagkakakilanlan ng beach club
        - Mabilis na paglunsad at mga sistema ng pagkuha para sa mabilis na operasyon
        - UV-matibay na konstruksyon para sa araw-araw na pagkakalantad sa maalat na tubig
    - title: Mga Pribadong Club ng Miyembro at Mga Yacht Club
      subtitle: Mga miyembrong water sports at eksklusibong programa sa paddling
      description: Ang mga pribadong club kung saan ang mga water sports ay benepisyo ng mga miyembro sa halip na tagapagpaandar ng kita. Dapat matugunan ng kagamitan ang mas mataas na pamantayan sa estetika, maging available kapag hinihingi ng mga miyembro, at nangangailangan ng minimal na superbisyon ng mga tauhan. Gumagamit ang mga marina yacht club ng mga branded SUP fleet para sa libangan ng mga miyembro sa paligid ng daungan. Ang imbakan at pagpapanatili ay dapat hindi makita ng mga miyembro.
      features:
        - Premium branded SUP na mga fleet para sa mga kasaping water sports
        - 'Premium na kagamitan: EVA decks, pasadyang kulay ng miyembro, may tatak na tapisan'
        - Sistema ng self-service check-out para sa pag-access ng miyembro nang walang tauhan
        - Pag-iimbak sa labas ng panahon at taunang programa sa pag-refresh
    - title: Mga Hotel na Nakatuon sa Pakikipagsapalaran at Aktibidad
      subtitle: Mga guided tour, SUP yoga, mga snorkeling excursion, mga aktibidad ng grupo
      description: Mga ari-arian na nagpo-posisyon bilang mga destinasyon ng pakikipagsapalaran — nag-aalok ng mga guided tour, SUP yoga, pag-paddle sa paglubog ng araw, mga snorkeling excursion, at mga aktibidad ng grupo. Kailangan ng fleet na suportahan ang parehong free rental at guided program models, na may kagamitan na madaling mailipat sa pagitan ng paggamit ng bisita at mga tour na pinamumunuan ng instruktor. Kailangan ng mga ari-ariang ito ng matibay na kagamitan para sa mataas na daloy ng turnover, na madaling linisin sa pagitan ng mga grupo ng bisita.
      features:
        - Versatile na mixed fleet na sumusuporta sa rental + guided tour models
        - Higit na matatag na SUP plataporma para sa mga pangkatang aktibidad
        - 'Kagamitan ng guide: boards ng instruktor, dry boxes, waterproof comms'
        - 'Panandaliang pagpapalit ng kagamitan: programa ng fleet sa tag-init → imbakan sa taglamig'
        - Matibay na konstruksyon na kayang gamitin araw-araw ng mga bisita nang minimal na maintenance
