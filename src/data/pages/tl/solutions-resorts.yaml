testimonial:
  content: Paddle Board Overstock Dinisenyo at nilagyan ang buong beach activity program namin sa tatlong resort properties. 80SUPs, 40 kayak, safety infrastructure, at staff training — lahat ay naihatid sa isang shipment. Ang partisipasyon ng mga bisita sa water activities ay tumaas ng 60% sa unang season.
  name: Sophie Laurent
  title: Direktor ng Guest Experience, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Mga Profile ng Resort
  title: Mga Solusyon sa Hospitality sa Waterfront<br />Ayon sa Uri ng Katangian
  subtitle: Bawat resort property ay may natatanging guest profile, halo ng mga aktibidad, at ritmo ng operasyon — mula sa boutique eco-lodges hanggang sa malalawak na luxury beachfront resorts. Dinisenyo namin ang mga water sports program na tumutugma sa klase ng ari-arian at inaasahan ng mga bisita.
  items:
    - title: Mga Luxury Resort sa tabing-dagat
      subtitle: VIP transfers, mga aktibidad sa tubig, premium na karanasan ng bisita
      description: Mga high-end na beachfront properties — Four Seasons, Aman, at mga katulad na luxury groups — kung saan ang water sports ay pangunahing amenidad ng bisita na nagdudulot ng satisfaction scores at karagdagang kita. Dapat magmukhang premium ang fleet, mag-alok ng iba't ibang edad at antas ng kakayahan, at seamless na makisama sa umiiral na concierge at booking systems ng resort. Napakataas ng inaasahan sa itsura ng bisita — direktang nakakaapekto sa kondisyon at presentasyon ng kagamitan ang 5-star reviews.
      features:
        - 'Premium branded fleet: SUPs, kayak, pedal boat, at maliliit RIB na tender'
        - 'Presentasyon na handa para sa mga bisita: magkatugmang kulay ng resort, logo branding, at ipinakitang kagamitan sa entablado'
        - Maliit na luho RIB para sa VIP guest transfers na may custom na upholstery at kulay matching
        - 'Pinagsamang imprastruktura ng kaligtasan: mga linya ng buoy, mga istasyon ng lifeguard, AED'
        - 'Pamamahala ng kita: dynamic na mga template ng presyo, pagsasanay sa upsell, package bundling'
    - title: Mga Pribadong Resort sa Isla
      subtitle: Transportasyon ng bisita sa lahat ng panahon — walang oras na hindi gumagana, ganap na maaasahan
      description: Ang mga pribadong isla na resort ay nagpapatakbo sa mga malalayong lugar kung saan ang bangka lamang ang koneksyon sa pangunahing pulo. Ang araw-araw na paglipat ng mga bisita, pagdadala ng suplay, at mga emergency na medikal na paglilipat ay nakadepende sa isang bangka lamang — ang anumang pagkaantala ay direktang nakakaapekto sa karanasan ng bisita at operasyon ng resort. Kailangan ng mga operator na ito ng bangka na maaasahan sa lahat ng kondisyon ng panahon, nangangailangan ng kaunting maintenance, at may mga backup system para sa kritikal na dependability. Dapat ding maganda ang itsura ng bangka sa pagdating ng mga bisita sa isla.
      features:
        - Lahat-ng-panahon na RIB na pagkakaayos na may kumpletong takip sa panahon at matitibay na tubo
        - Pagsasaayos ng dalawang makina o pangalawang makina para sa operasyon na walang pagtigil
        - Pangkalahatang pang-komersyal na Hypalon konstruksyon para sa 5-8 taong habang-buhay sa malalayong serbisyo
        - Disenyong madaling panatilihin na may mga bahagi na madaling maabot para sa serbisyo sa lugar
        - Pasadyang tatak ng resort at premium na pantakip sa upuan na tumutugma sa estetika ng isla
    - title: Lakeside at Eco Resorts
      subtitle: Karanasan ng mga bisita na isinama sa kalikasan
      description: Mga ari-arian sa tabi ng lawa, mga eco-lodge, at mga natitirang lugar sa kalikasan na nag-aalok ng tahimik, mababang-impak na mga aktibidad sa tubig na akma sa natural na kapaligiran. Ang mga kagamitan ay dapat walang makina kung maaari, madaling itago sa mga boathouse na may limitadong espasyo, at tahimik gamitin upang mapanatili ang ambient na karanasan para sa lahat ng mga panauhin.
      features:
        - 'Hindi-motorisadong fleet: SUPs, kayaks, kano, at mga paddle boat'
        - Tahimik na electric pump inflation stations para sa paggamit ng mga panauhin kapag kinakailangan
        - Mga materyales at pambalot na eco-friendly na akma sa branding ng pagpapanatili
        - Kasama ang mga istante para sa imbakan at mga sistema ng organisasyon ng bahay-bangka
    - title: Mga Klab sa Tabing-Dagat
      subtitle: Paglilipat ng bisita, libangan, maliit na luho RIBs
      description: Ang mga beach club ay nagpapatakbo ng isang high-energy, visually-focused na kapaligiran kung saan ang kagamitan ay bahagi ng atmospera. Kailangan nila ng maliit na luho RIBs para sa paglipat ng mga bisita mula sa malapit na hotel o pantalan, at mga laruan sa tubig para sa aliw ng mga bisita — pagtutulak sa jet ski, inflatable na slide, at paddle board. Ang fleet ay dapat mukhang stylish, madaling patakbuhin, at kayang tiisin ang araw-araw na paggamit ng mga bisita na may iba't ibang antas ng kasanayan. Ang imbakan at mabilis na deployment ay kritikal sa peak hours.
      features:
        - Kompaktong luho RIB (3.3-4.3m) para sa paglilipat ng panauhin at serbisyo ng tender
        - 'Mga laruan sa tubig: mga inflatable na hilahin, SUP na mga board, mga kayak para sa aliw ng mga bisita'
        - Pasadyang kulay at pagbibigay tatak na tumutugma sa biswal na pagkakakilanlan ng beach club
        - Mabilis na paglunsad at mga sistema ng pagkuha para sa mabilis na operasyon
        - Matibay na Hypalon konstruksyon para sa araw-araw na pagkakalantad sa maalat na tubig at UV
    - title: Mga Pribadong Club ng Miyembro at Mga Yacht Club
      subtitle: Transport ng pantalan, mga tender ng miyembro, eksklusibong pampalutang na sports
      description: Mga pribadong klub kung saan ang mga water sports at transportasyon ng bangka ay benepisyo para sa miyembro sa halip na pinagkukunan ng kita. Ang kagamitan ay dapat tumugon sa mas mataas na pamantayan ng estetika, maging available sa demand para sa mga miyembro, at mangailangan ng minimal na superbisyon ng staff. Ang mga marina yacht club ay partikular na nangangailangan ng mga tenders para sa transportasyon sa harbor — paglilipat ng mga miyembro sa pagitan ng dock, mooring, at pampang. Ang imbakan at maintenance ay dapat hindi nakikita ng mga miyembro.
      features:
        - Mataas na uri ng RIB na mga lumulubog para sa transportasyon sa pantalan at serbisyo ng paglilipat ng miyembro
        - 'Premium na kagamitan: EVA decks, pasadyang kulay ng miyembro, may tatak na tapisan'
        - Sistema ng self-service check-out para sa pag-access ng miyembro nang walang tauhan
        - Pag-iimbak sa labas ng panahon at taunang programa sa pag-refresh
    - title: Mga Hotel na Nakatuon sa Pakikipagsapalaran at Aktibidad
      subtitle: Mga guided tour, SUP yoga, mga snorkeling excursion, mga aktibidad ng grupo
      description: Mga ari-arian na nagpo-posisyon bilang mga destinasyon ng pakikipagsapalaran — nag-aalok ng mga guided tour, SUP yoga, pag-paddle sa paglubog ng araw, mga snorkeling excursion, at mga aktibidad ng grupo. Kailangan ng fleet na suportahan ang parehong free rental at guided program models, na may kagamitan na madaling mailipat sa pagitan ng paggamit ng bisita at mga tour na pinamumunuan ng instruktor. Kailangan ng mga ari-ariang ito ng matibay na kagamitan para sa mataas na daloy ng turnover, na madaling linisin sa pagitan ng mga grupo ng bisita.
      features:
        - Versatile na mixed fleet na sumusuporta sa rental + guided tour models
        - Tandem kayaks at sobrang matatag na SUP platform para sa mga aktibidad ng grupo
        - 'Kagamitan ng guide: boards ng instruktor, dry boxes, waterproof comms'
        - 'Seasonal equipment rotation: summer fleet → winter storage program'
        - Matibay na konstruksyon na kayang gamitin araw-araw ng mga bisita nang minimal na maintenance
