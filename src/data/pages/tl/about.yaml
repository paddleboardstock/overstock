features3_what_we_build:
  title: Ang aming ginagawa
  subtitle: Isang nakatuon na linya ng produkto na alam namin nang lubos — walang kalahating tapos na eksperimento, walang badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: WhatsApp Online Chat!
      description: Lahat - ng - paligid at touring SUPs mula sa 10' sa 12 ft. Matatag, matibay, at kumpleto sa pump, paddle, at tali.
      icon: tabler:swimming
    - title: Mga deck ng serye ng sining
      description: Signature EVA deck likhang sining — Cheetah Surge, Tropical Breeze, Medusa Glow, at higit pa.
      icon: tabler:hexagons
    - title: Kumpletuhin ang mga pakete
      description: 'Ang bawat board ships bilang isang buong kit: board, backpack, pump, paddle, palikpik, tali, at pagkumpuni kit.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Mga aksesorya
      description: Mga pump, paddle, leash, repair kit, at dry - bag. Lahat ay tumutugma sa aming mga board.
      icon: tabler:tool
    - title: Pangangalaga at pagkumpuni
      description: Suporta sa pag - aayos ng in - house, ekstrang bahagi, at patnubay sa pagpapanatili upang mapanatili ang iyong board sa tubig sa loob ng maraming taon.
      icon: tabler:settings
    - title: Username or email address *
      description: Bulk outfitting para sa mga club, paaralan, at rental fleets na may direktang suporta sa pabrika.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Talakayan sa disenyo at engineering ng board
steps2_values:
  title: Aming mga halaga
  subtitle: Tatlong prinsipyo na humubog sa bawat produkto mula sa unang araw.
  items:
    - title: Bumuo na parang kasama ang iyong pamilya
      description: Ang bawat board, seam, at balbula ay itinuturing na parang gagamitin ito ng ating sariling mga pamilya.
      icon: tabler:heart
    - title: Inhinyero bago tayo magbenta
      description: Kung mali ang isang espesipikasyon, binabago namin ang espesipikasyon — hindi kailanman ang customer.
      icon: tabler:settings
    - title: Suporta na tumatagal lampas sa warranty
      description: Ang mga board na binuo namin taon na ang nakakaraan ay tumatawag pa rin sa amin para sa mga ekstrang bahagi, at nakukuha pa rin namin.
      icon: tabler:headset
steps2_milestones:
  title: Mga Milestone
  subtitle: Isang maikling bersyon ng kwento ng Paddle Board Overstock.
  isReversed: true
  items:
    - title: Itinatag sa Weihai
      description: Ang isang coastal workshop na nakatuon sa drop - stitch inflatable SUP boards.
      icon: tabler:building-factory
    - title: 'Kapital: 9147€_'
      description: Pinalawak sa isang dedikadong pasilidad na may RF hinang at drop - stitch produksyon kapasidad.
      icon: tabler:circle-check
    - title: Pandaigdigang programa ng pag-export
      description: Ngayon pagpapadala sa 50+ mga bansa na may express at dagat kargamento pagpipilian.
      icon: tabler:world
    - title: Overstock & pakyawan focus
      description: Noong Setyembre 2026, ang mga operasyon ng tatak ay lumipat mula sa Qingdao Vatrad Group sa Weihai Dongjilian Co., Ltd.; ang Weihai manufacturing hub ay patuloy na R & D, produksyon, at factory - direct shipping.
      icon: tabler:building-skyscraper
features2_locations:
  title: Aming mga lokasyon
  tagline: Hanapin kami
  columns: 3
  items:
    - title: Punong-tanggapan at pagawaan
      description: Pang-industriyang parke sa baybayin, gusali 4 — bukas Lunes–Biyernes para sa mga pagbisita sa pamamagitan ng appointment.
    - title: Sentro ng serbisyo ng EU
      description: Pantalan sa Mediterranean — pagpapaayos, pagkukumpuni at suporta sa warranty para sa mga kustomer sa Europa.
    - title: network ng kasosyo sa APAC
      description: Mga awtorisadong kasosyo sa serbisyo sa Australia, Japan, Singapore, at Hong Kong.
brand_hub_tagline: Tatak
brand_hub_title: Tuklasin ang Aming Tatak
brand_hub_subtitle: Siyasatin nang mas malalim ang aming kasanayan sa inhinyeriyang pang-dagat, pandaigdigang presensya, at ang mga prinsipyong nagtutulak sa amin.
brand_hub_cards:
  - title: Kadalubhasaan sa Dagat
    desc: Mga dekada ng materyal na agham, katumpakan manufacturing, at real - world testing — mula sa drop - stitch core sa welded seams at art - series deck.
    link: /brand-marine-expertise
    link_label: Matuto nang higit pa →
  - title: Bakit Paddle Board Overstock
    desc: Pabrika - direktang pagpepresyo, 100% presyon - nasubukan boards, at isang 2 - taon na warranty — na binuo para sa paddlers, pamilya, at mga mahilig sa tubig sports.
