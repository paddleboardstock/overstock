hero:
  tagline: Tungkol sa amin
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer pabrika at pagawaan
  title: |
    Inhinyeriyang pandagat,<br />
    itinayo ang<span class="text-accent dark:text-white">Aquafarer</span>paraan
  subtitle: 'Nagsimula kami sa isang pagawaan sa baybayin na may isang bangka at may matibay na paniniwala: ang mga produktong pandagat ay dapat na inhinyeriyado na parang mahalaga, dahil mahalaga nga. Sa ngayon, nagpapadala kami sa mahigit 50 bansa, ngunit bawat bagong bangka ay dumadaan pa rin sa parehong mga kamay na nagpasimula ng kumpanya.'
stats:
  title: Ayon sa numero
  columns: 4
  stats:
    - title: Mga naideliver na hull
      amount: 2,400+
    - title: Mga bansang pinadalhan
      amount: 50+
    - title: Taon ng pinagsamang karanasan
      amount: '60'
    - title: Karaniwan ng oras ng pagtugon sa warranty (oras)
      amount: '24'
features3_what_we_build:
  title: Ang aming ginagawa
  subtitle: Isang nakatuon na linya ng produkto na alam namin nang lubos — walang kalahating tapos na eksperimento, walang badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB mga bangka
      description: Aluminyum-hull na RIBs mula 3.3 m hanggang 7.5 m. Dinisenyo para sa patrol, pagsisid, pangingisda at gamit ng pamilya.
      icon: tabler:ship
    - title: Mga inflatable na bangka
      description: PVC at Hypalon inflatable dinghies mula 2.4 m hanggang 4.2 m. Magaang, matibay at madaling itago.
      icon: tabler:speedboat
    - title: Mga superyacht tenders
      description: Kompak, may mataas na espesipikasyon RIBs custom-built upang tumugma sa hitsura ng iyong mothership.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Mga aksesorya
      description: Mga sagwan, bomba, takip, dry-bags, fuel tanks at elektroniks. Lahat ay tugma sa aming mga bangka.
      icon: tabler:package
    - title: Pag-refit at pagkukumpuni
      description: In-house na pagpapalit ng tubo, retrofit ng elektroniks at upgrade ng makina.
      icon: tabler:tool
    - title: Pasadyang paggawa
      description: Disenyo proyekto-sa-proyekto para sa komersyal, siyentipiko at militar na customer.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Talakayan sa disenyo at inhinyeriya ng bangka
steps2_values:
  title: Aming mga halaga
  subtitle: Tatlong prinsipyo na humubog sa bawat produkto mula sa unang araw.
  items:
    - title: Bumuo na parang kasama ang iyong pamilya
      description: Bawat katawan ng barko, hinang at turnilyo ay tinatrato na parang gagamitin ito ng aming sariling pamilya.
      icon: tabler:heart
    - title: Inhinyero bago tayo magbenta
      description: Kung mali ang isang espesipikasyon, binabago namin ang espesipikasyon — hindi kailanman ang customer.
      icon: tabler:settings
    - title: Suporta na tumatagal lampas sa warranty
      description: Dalawampung taong gulang na mga katawan ng barko ay patuloy pa ring tumatawag sa amin para sa mga piyesa, at patuloy pa rin naming sinasagot.
      icon: tabler:headset
steps2_milestones:
  title: Mga Milestone
  subtitle: Isang maikling bersyon ng kwento ng Aquafarer.
  isReversed: true
  items:
    - title: Itinatag sa isang pagawaan sa baybayin
      description: Nagsimula ng dalawang arkitektong pandagat na may CNC mill at isang matigas na ideya.
      icon: tabler:building-factory
    - title: Naihatid ang unang 1,000 na katawan
      description: Naabot sa aming ikapitong taon, karamihan sa pamamagitan ng salita-salita at mga bumabalik na kustomer.
      icon: tabler:circle-check
    - title: Pandaigdigang programa ng pag-export
      description: Ngayon ay nagpapadala na sa 50+ bansa na may mga lokal na kasamang suporta sa limang kontinente.
      icon: tabler:world
    - title: Isang bagong pandaigdigang estruktura ng operasyon
      description: Noong Setyembre 2026, ang operasyon ng tatak ay lumipat mula sa Qingdao Vatrad Group patungo sa Aquafarer LLC (New Mexico, USA); ang hub ng paggawa sa Qingdao ay patuloy na nagsasagawa ng R&D, produksyon, at direktang pag-export mula sa pabrika.
      icon: tabler:building-skyscraper
features2_locations:
  title: Aming mga lokasyon
  tagline: Hanapin kami
  columns: 3
  items:
    - title: Punong-tanggapan at pagawaan
      description: Pang-industriyang parke sa baybayin, gusali 4 — bukas Lunes–Biyernes para sa mga pagbisita sa pamamagitan ng appointment.
    - title: Sentro ng serbisyo ng EU
      description: Pantalan sa Mediterranean — pagpapaayos, pagkukumpuni at suporta sa warranty para sa mga kustomer sa Europa.
    - title: network ng kasosyo sa APAC
      description: Mga awtorisadong kasosyo sa serbisyo sa Australia, Japan, Singapore, at Hong Kong.
brand_hub_tagline: Tatak
brand_hub_title: Tuklasin ang Aming Tatak
brand_hub_subtitle: Siyasatin nang mas malalim ang aming kasanayan sa inhinyeriyang pang-dagat, pandaigdigang presensya, at ang mga prinsipyong nagtutulak sa amin.
brand_hub_cards:
  - title: Kadalubhasaan sa Dagat
    desc: Daang taon ng agham pang-materyal, tumpak na pagmamanupaktura, at tunay na pagsubok — mula sa PVC/Hypalon paggawa hanggang sa disenyo ng deep-V hull at teknolohiya ng drop-stitch.
    link: /brand-marine-expertise
    link_label: Matuto nang higit pa →
  - title: Pandaigdigang Presensya
    desc: Nagpapadala sa 50+ bansa mula sa aming pasilidad sa Qingdao kasama ang mga awtorisadong kasosyo sa serbisyo sa buong Europa, Asia-Pasipiko, at Amerika.
    link: /brand-global-presence
    link_label: Matuto nang higit pa →
  - title: Bakit Aquafarer
    desc: Patayong integrasyon, dobleng sertipikasyon (ISO 9001 + BSCI), pagsunod sa CE, at mababang MOQs — ginawa para sa mga tatak, distributor, at ahensya ng gobyerno.
    link: /brand-why-aquafarer
    link_label: Matuto nang higit pa →
production_section:
  tagline: Kahusayan sa Produksyon
  title: Pagtitiyak ng Napakagandang Kasanayan sa Paggawa
  description: Ang Aquafarer na linya ng produksyon ay nakatuon sa paggawa ng mataas na kalidad, matibay, at mataas na pagganap na mga produktong inflatableng bangka.
  cards:
    - title: Bihasang Koponan ng Teknikal
      items:
        - Propesyonal na kaalaman sa PVC, Hypalon, at mga materyales sa dagat
        - Tumpak na kasanayan sa pagputol, pagbibigay-bond, at pag-install ng mga aksesorya
        - Patuloy na pagsasanay upang mapag-aralan ang pinakabagong mga teknolohiya sa produksyon
    - title: Makabagong Kagamitan sa Produksyon
      items:
        - CNC kagamitan sa paggupit para sa eksaktong paggupit ng tela na may kaunting pagkakamali
        - Mataas na tumpak na pag-init/paglamig na pagbonding para sa hangin-hindi tinatagos, matibay na mga tahi
        - Propesyonal na kagamitan para sa pagsubok ng selyo at tigas
    - title: Mature na Sistema ng Pamamahala
      items:
        - Pamantayan na proseso ng produksyon na may malinaw na pamantayan sa kalidad
        - Pilosopiya ng lean production na nagpapababa ng basura at nagpapahusay ng kahusayan
        - Mabisang pamamahala ng supply chain na may maaasahang pakikipagtulungan sa mga supplier
    - title: Mahigpit na Kontrol sa Kalidad
      items:
        - sertipikadong sistemang pamamahala ng kalidad
        - 'Pagsusuri sa maraming yugto: hilaw na materyal, kasalukuyang proseso, panghuling palabas'
        - Mahigpit na pagsusuri ng hermetiko at tibay bago ipadala
global_ops_section:
  tagline: Pandaigdigang Arkitektura ng Operasyon
  title_html: Isang tatak,<span class="text-white/90">dalawang sentro</span>
  description_html: Mula Setyembre 2026, ang Aquafarer ay pinatatakbo ng<strong class="text-white">Aquafarer LLC</strong>(New Mexico, USA) — ang pandaigdigang entidad para sa distribusyon, komersyal na B2B benta, kontrata, pagsingil, at pagkatapos ng benta. Ang R&D, produksyon, at kontrol sa kalidad ay nananatili sa<strong class="text-white">Aquafarer Sentro ng Paggawa ng Qingdao</strong>, na nagpapadala ng bawat order direkta mula sa pabrika, FOB Qingdao. Binago ng paglipat kung sino ang lumalagda sa iyong kontrata — hindi kung sino ang gumagawa ng iyong bangka.
  stats:
    - value: 2,400+
      label: Mga hull na naihatid sa buong mundo
    - value: 50+
      label: Mga bansang nag-eksport
    - value: 10+
      label: Mga taon ng paggawa
