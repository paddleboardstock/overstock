hero:
  tagline: Pandaigdigang Presensya
  title: Naglilingkod sa 50+ Bansa<br />Sa Bawat Kontinente
  subtitle: Mula sa mga operator ng coastal patrol sa Europa hanggang sa mga distributor ng water sports sa Australia at mga rescue team sa Gitnang Silangan — ang Paddle Board Overstock mga bangka ay nasa tubig sa buong mundo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock pandaigdigang pagmamanupaktura at pamamahagi ng maritime
stats:
  title: Pandaigdigang Abot
  stats:
    - title: Mga Bansa
      amount: 50+
    - title: Mga Pamilihang Ipinag-e-export
      amount: Europa, Amerika, Asya, Gitnang Silangan, Oseaniya
    - title: Produksyon
      amount: Qingdao, Tsina
    - title: Bodega sa US
      amount: Montclair, CA
features3_markets:
  tagline: Pangunahing Pamilihan
  title: Ekspertong Pang-rehiyon<br />para sa Mga Lokal na Kailangan
  subtitle: Nauunawaan namin na ang iba't ibang pamilihan ay may iba't ibang regulasyon, kagustuhan, at gamit.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa at UK
      description: Mga produktong CE-certified na tumutugon sa EN ISO 6185 na pamantayan. Malakas ang demand para sa RIBs, inflatableng bangka, at SUP na mga board sa mga pamilihan ng EU. Pinahahalagahan ng mga distributor sa UK ang aming mabilis na turnaround.
      icon: tabler:map-pin
    - title: Hilagang Amerika
      description: Aprobado ng US Coast Guard ang pagmamanupaktura. Bodega sa US sa Montclair, CA para sa mabilis na paghahatid sa West Coast. Lumalago ang demand para sa mga fishing boat, rescue craft, at recreational SUPs.
      icon: tabler:map-pin
    - title: Australia at Oseaniya
      description: Malakas ang pamilihan para sa RIB na mga bangka at inflatable tender. Pinahahalagahan ng mga distributor sa Australia ang aming Hypalon na mga bangka para sa UV na resistensya sa matinding araw. Mabilis ang pagpapadala mula sa aming pasilidad sa Asya.
      icon: tabler:map-pin
    - title: Gitnang Silangan
      description: Lumalago ang demand para sa patrol at rescue na mga bangka. Ang aming aluminum-hull na RIBs ay popular sa mga operator ng coast guard at seguridad. Mga custom configuration para sa mataas na temperatura na mga kapaligiran.
      icon: tabler:map-pin
features3_distribution:
  tagline: Network ng Pamamahagi
  title: Pakikipagtulungan sa Mga Distributor<br />Sa buong Mundo
  subtitle: Nakikipagtulungan kami sa mga kilalang distributor ng kagamitan sa dagat, OEM na mga brand, at mga ahensya ng pamahalaan para sa procurement.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Mga Pakikipagsosyo
      description: Paggawa ng pribadong tatak para sa mga pandaigdigang tatak ng water sports. Kami ang humahawak sa lahat mula sa disenyo hanggang sa produksyon hanggang sa drop-shipping.
      icon: tabler:building
    - title: Network ng Distributor
      description: Ang mga awtorisadong distributor sa 20+ bansa ay nagdadala ng stock at nagbibigay ng lokal na suporta. Malugod na tinatanggap ang mga katanungan mula sa mga bagong distributor.
      icon: tabler:users
    - title: Pampamahalaan at Institusyonal
      description: Direktang suplay sa mga coast guard, mga organisasyon ng paghahanap at pagsagip, at mga programang pangmilitar na procurement. Pagsunod sa mga kinakailangan sa institutional procurement.
      icon: tabler:building-community
steps2_logistics:
  title: Pandaigdigang Logistika at Suporta
  subtitle: Mula sa pabrika hanggang sa destinasyon — pinamamahalaan namin ang buong supply chain.
  items:
    - title: Mga Pagpipilian sa Pagpapadala
      description: Kargamentong dagat (FOB Qingdao), kargamentong panghimpapawid para sa mga agarang order, at express courier para sa mga sample at piyesang pangkapalit.
      icon: tabler:truck-delivery
    - title: Bodega sa US
      description: 'Stock na hini hold sa Montclair, CA para sa mabilis na paghahatid sa buong Hilagang Amerika. West Coast: 2-3 araw, Sentral: 3-4 araw, East Coast: 4-5 araw.'
      icon: tabler:building-warehouse
    - title: Mga Purnong Bahagi
      description: Tunay na Paddle Board Overstock na mga piyesa at consumables na laging nasa stock buong taon. Karaniwang mga piyesa ay ipinapadala sa loob ng 24 na oras.
      icon: tabler:package
    - title: Suporta sa Teknikal
      description: Direktang linya sa aming engineering team para sa mga teknikal na tanong, payo sa pagkumpuni, at suporta sa refit. Sinusuportahan namin ang mga bangkang ginawa namin 20 taon na ang nakalipas.
      icon: tabler:headset
cta:
  title: Gusto mo bang maging distributor?
  subtitle: Aktibo naming pinalalawak ang aming distribusyon na network. Makipag-ugnayan sa aming export team upang talakayin ang mga oportunidad sa pakikipagsosyo.
  actions:
    - variant: primary
      text: Pagtatanong tungkol sa pakikipagsosyo
      href: /contact
    - text: Tingnan ang aming hanay ng mga produkto
      href: /products
