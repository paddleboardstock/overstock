  title: Kontrol ng Kalidad<br />Sistema
  subtitle: Proseso ng multi-stage na inspeksyon na sumasaklaw sa mga dumarating na materyales, produksiyong nasa proseso, pagsusuri ng presyon, huling pagpupulong, at pag-verify bago ipadala. Ang bawat batch ay nasusubaybayan, bawat pagsusuri ay naitatala.
