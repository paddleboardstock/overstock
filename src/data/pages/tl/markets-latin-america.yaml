hero:
  tagline: Latin America
  title: SUP Wholesale Boards para sa<br />Mga Retailer sa Latin America
  subtitle: Mga bagong overstock paddle boards para sa mga beach shop, rental fleets, at online sellers sa buong Latin America — mula sa 5 boards, mixed models, express o sea freight.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Mga SUP overstock board para sa mga nagtitinda ng paddle board sa Latin America
direct_answer: Paddle Board Overstock nagbibigay ng mga bagong overstock inflatable SUP boards sa maliliit na retailer sa buong Latin America — mula Mexico at Brazil hanggang Colombia, Peru, Chile, at Argentina. Nagsisimula ang wholesale orders sa 5 boards na may mixed models na welcome, at bawat order ay ipinapadala mula Weihai, China sa pamamagitan ng express air freight o consolidated sea freight. Ang mga board ay 100% pressure-tested at sakop ng 2-Taong SUP Warranty.
tldr_points:
  - Wholesale mula sa 5 board — halo-halong modelo sa isang order, presyo ayon sa kabuuang dami
  - Express air o pinagsamang sea freight mula Weihai, China
  - Ang mga pamilihang may wikang Espanyol at Portuges na pinaglilingkuran sa buong rehiyon
  - 100% pressure-tested, 2-Taong SUP Warranty sa bawat board
overview_section:
  tagline: Pangkalahatang-ideya ng Merkado
  title: Ang SUP Pamilihan ng Latin Amerika
  paragraphs:
    - Ang Latin America ay isa sa pinakamabilis lumalaking stand-up paddle markets sa mundo. Ang mahahabang baybayin sa dalawang karagatan, matatag na ekonomiya ng beach tourism, at matibay na kultura ng board-sports ay nagbibigay sa mga independent retailer mula Tulum hanggang Florianópolis ng lumalaking bilang ng mga customer — mga turista na unang nag-aral, mga weekend paddler, at isang lumalaking SUP lokal na komunidad ng karera at surf.
    - The retail landscape is dominated by small and mid-sized independent shops: mga paaralan ng paddle sa tabing-dagat na nagbebenta ng kanilang inuupahan, mga surf shop na nagdadagdag ng SUP linya, at mga online seller na direktang nag-iimport sa unang pagkakataon. Bihira ang mga negosyong ito na mangailangan ng container-loads ng isang modelo — kailangan nila ng 5–20 boards kada order, na pinaghalong beginner-friendly all-around models at ilang premium editions.
  customer_types:
    - title: Mga Retailer sa Beach Town
      description: Mga tindahan sa mga resort town na naglilingkod sa mga turista — kailangan nila ng matibay na beginner boards sa dami at ilang premium na modelo para sa display at bentahan.
    - title: Mga Paaralan ng Paddle at Mga Fleet ng Pag-upa
      description: Ang mga paaralan na nagsasama ng mga aralin sa retail, at mga fleet ng paupahan ay nagre-refresh ng mga board bawat season gamit ang mga order na may halo-halong modelo.
    - title: Mga Online na Nagbebenta
      description: Ipinakilala ng mga nagbebenta ng e-commerce sa wikang Espanyol at Portuges ang SUP kategoryang ito sa kanilang pambansang merkado nang walang panganib sa laki ng lalagyan.
shipping_section:
  title: Pagpapadala sa Latin America
  paragraphs:
    - Ang mga order ay ipinapadala mula sa aming logistics base sa Weihai, China. Mga sample ng express air freight suits, 1–3 board orders, at agarang restocks; ang consolidated sea freight ang matipid na ruta para sa 5–20 board wholesale orders papunta sa mga pangunahing pantalan sa rehiyon.
    - Nagbibigay kami ng kumpleto at tumpak na export paperwork — commercial invoice at packing list — upang mapanatiling maayos ang customs clearance. Ang import duties at buwis ay itinakda ng iyong bansa at babayaran ng importer; hindi namin kailanman pinagsasama ang malabong "tax included" na pangako sa isang freight quote.
  customs_note: Malaki ang pagkakaiba-iba ng mga patakaran sa import at mga rate ng duty sa mga bansa sa Latin America. Suriin ang kasalukuyang sistema ng import ng iyong bansa para sa inflatable water sports equipment bago umorder, at humingi ng karagdagang dokumentasyon na kailangan ng iyong broker.
faq_section:
  title: Latin America FAQ
  items:
    - q: Maaari ba akong humingi ng quote sa Spanish o Portuguese?
      a: Ang aming koponan ay nakikipagtulungan sa mga mamimili sa buong Latin America at kayang humawak ng mga quote at kumpirmasyon ng order para sa mga customer na nagsasalita ng Espanyol at Portuges. Magtanong sa iyong inquiry.
    - q: Nagpapadala ba kayo sa aking bansa sa Latin America?
      a: Nagpapadala kami sa buong rehiyon — Mexico, Brazil, Colombia, Peru, Chile, Argentina, Ecuador, at iba pa. Kumpirmahin ang eksaktong destinasyon mo sa iyong quote request at susuriin namin ang kasalukuyang serbisyo ng kargamento.
    - q: Ano ang wholesale minimum para sa mga Latin American retailers?
      a: Limang board sa kabuuan, maaaring paghaluin ang anumang nasa-stock na modelo. Ang kabuuang bilang na iyon ang nagtatakda ng iyong antas ng presyo — maaari mong pagsamahin ang all-around, touring, at art editions sa isang pagpapadala.
    - q: Sino ang nagbabayad ng import duties sa aking bansa?
      a: Ikaw, bilang importer, ayon sa mga patakaran ng iyong bansa. Nagbibigay kami ng tamang, kumpletong dokumento (commercial invoice, packing list) upang maging predictable ang clearance — tingnan ang aming pahina sa international shipping para sa buong detalye.
