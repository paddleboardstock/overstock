hero:
  tagline: Kaalaman sa Pagsaliksik ng Tubig
  title: Matuto
  subtitle: |
    Mga gabay, tutorial, at malalim na pagsisid — lahat ng kailangan mo para mag-explore<br />
    tubig nang may kumpiyansa. Mula sa pagpili ng iyong unang SUP hanggang sa pag-master ng mga advanced na teknik.
  taglineSection: Kaalaman para sa bawat mananakay ng sakayan. Mula sa baguhan hanggang sa propesyonal.
featured:
  tagline: Itinatampok na Mga Paksa
  title: Simulan ang iyong paglalakbay sa pag-aaral
  subtitle: Kung ikaw man ay bago sa mga water sports o naghahanap upang umangat ang iyong kakayahan, sakop ka ng aming mga gabay.
  items:
    - title: SUP Mga Pangunahing Kaalaman
      description: Lahat ng kailangang malaman ng isang baguhan — mga uri ng board, sukat ng paddle, postura, at mga tip sa unang araw.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Pampalutang na Tabla laban sa Matigas na Tabla
      description: Alin ang tama para sa iyo? Inihahambing namin ang portability, performance, tibay, at presyo nang magkatabi.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Kaligtasan sa Tubig
      description: Mahahalagang kaalaman sa kaligtasan na dapat malaman ng bawat nagpa-paddle — panahon, PFD, sariling pagliligtas, at iba pa.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Gabay sa Mga Materyales
      description: PVC laban sa Hypalon, teknolohiya ng drop-stitch, mga rating ng denier — alamin kung saan gawa ang iyong kagamitan.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Gabay sa Sukat
      description: Hanapin ang tamang haba, lapad, at dami ng board para sa iyong timbang, kasanayan, at istilo ng pagbibisikleta.
      icon: tabler:ruler
      href: /size-guide
    - title: Gitnang Antas na Mga Teknik
      description: Pahusayin ang iyong pagpipadyak gamit ang mga advanced na hagod, pamamaraan sa pagliko, at paghawak ng magulong tubig.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
categories:
