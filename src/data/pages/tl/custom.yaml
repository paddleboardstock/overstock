hero:
  tagline: Aquafarer Pasadyang Lab
  title: Disenyo ng Iyong Sariling<br />Watercraft
  subtitle: OEM, ODM, pribadong label, at serbisyong custom branding para sa mga negosyo sa buong mundo. Mula sa isang prototype hanggang sa buong produksyon.
  cta: Simulan ang iyong proyekto
  footer_link: /contact
steps_section:
  tagline: Paano ito gumagana
  title: Mula konsepto hanggang produksyon
  subtitle: Apat na hakbang mula sa iyong ideya hanggang sa tapos na, handang gamitin sa dagat na produkto.
  steps:
    - num: '01'
      title: Pumili ng Iyong Board
      desc: Pumili mula sa aming pangunahing mga modelo — SUP, kayak, dinghy, o RIB. Piliin ang sukat, materyal, at kulay.
    - num: '02'
      title: I-upload ang Iyong Disenyo
      desc: Ipadala sa amin ang iyong logo, artwork, o gabay sa brand. Inihahanda ng aming design team ang digital na proof.
    - num: '03'
      title: Pagsusuri ng AI Mockup
      desc: Tingnan ang photorealistic na AI-generated na mockup ng iyong custom board bago magsimula ang produksyon.
    - num: '04'
      title: Produksyon at Paghahatid
      desc: Kapag naaprubahan, ang iyong order ay pumapasok sa aming ISO-certified production line. Lead times mula sa 30 araw.
services_section:
  tagline: Mga Serbisyo
  title: Serbisyo sa paggawa para sa mga global na brand
  subtitle: Flexible na mga modelo ng pakikipag-ugnayan — mula sa contract manufacturing hanggang sa full-service brand building.
  items:
    - title: OEM Paggawa
      desc: Ginagawa namin ang iyong mga disenyo ayon sa spec — iyong IP, iyong mga guhit, iyong mga pamantayan sa kalidad. Buong NDA na proteksyon.
      icon: ⚙️
    - title: ODM Mga Solusyon
      desc: Pumili mula sa 50+ na subok na plataporma at i-customise ang sukat, kulay, graphics, at packaging.
      icon: 🎨
    - title: Pribadong Tatak
      desc: Ang iyong brand sa aming mga produkto — logo, packaging, hang tags, manual. Ready na sa retail mula sa kahon.
      icon: 🏷️
    - title: Pasadyang Pagba-brand
      desc: Deck pad printing, hull graphics, tube decals, at custom labels — buong integrasyon ng brand.
      icon: ✨
capabilities_section:
  tagline: Mga Kakayahan
  title: Produksyon at mga kakayahan sa customisation
  subtitle: Lahat ng kailangan mong malaman bago maglagay ng iyong order.
  capabilities:
    - label: Dami ng order
      value: MOQ 5–10 unit (SUP/kayak), 2–5 unit (RIB)
    - label: Oras ng produksyon
      value: 30–45 araw karaniwan; 15–20 araw para sa mga prototype
    - label: Pasadya
      value: Sukat, hugis, kulay, grapiko, pakete, hardware
    - label: Mga materyales
      value: PVC, Hypalon, drop-stitch, fiberglass, aluminium
    - label: Pagpi-print
      value: Digital (CMYK), screen printing, heat transfer, sublimation
    - label: Sertipikasyon
      value: CE, ISO 9001, BSCI, UKCA (suporta para sa pandaigdigang pagsunod)
why_section:
  tagline: Bakit Aquafarer
  title: Isang pabrika. Isang pamantayan. Walang kompromiso.
  points:
    - text: 12,000 sqm integrated manufacturing facility
      highlight: 12,000 sqm
    - text: 200–300 bihasang manggagawa at inhinyero
      highlight: 200-300
    - text: 15,000 bangka ang ginagawa taun-taon
      highlight: 15,000
    - text: ISO 9001 sertipikadong pamamahala ng kalidad
      highlight: ISO 9001
    - text: CE sertipikadong produkto para sa pamilihang EU
      highlight: CE
  cta: Tingnan ang detalye ng pabrika
  cta_link: /factory
  contact:
    title: Handa ka na bang talakayin ang iyong proyekto?
    desc: Ang aming koponan ay tumutugon sa loob ng 24 oras na may panimulang sipi.
