  tagline: Tungkol Sa
  title: Tungkol sa {SITE}
  subtitle: Isang vertically integrated na gumagawa ng water sports — mula sa hilaw na materyal hanggang sa tapos na bangka
intro:
  - 'Itinatag ang Paddle Board Overstock noong 2012 na may isang misyon: magdisenyo at gumawa ng kagamitan sa water sports na kasing galing sa tubig gaya ng sa ulat ng kalidad. Ang nagsimula bilang isang pokus na workshop ng SUP board ay lumago hanggang sa isang 12,000-square-metre na integrated manufacturing facility sa Qingdao Economic Development Zone, na gumagawa ng inflatable boats, RIBs, kayaks, SUP boards, safety equipment, at accessories para sa mga customer sa 50+ bansa.'
  - Ngayon, gumagana ang Paddle Board Overstock bilang isang factory brand — nagdidisenyo, nag-e-engineer, gumagawa ng prototype, nagmanupaktura, at nagte-test kami ng lahat sa ilalim ng iisang bubong. Ang vertical integration na ito ay nagbibigay sa amin ng direktang kontrol sa pagpili ng materyal, kalidad ng paggawa, at timeline ng paghahatid. Bawat bangka ay ginawa sa aming mga tao, gamit ang aming kagamitan, ayon sa aming pamantayan.
  - Inililingkod namin ang mga recreational users, commercial operators, ahensiyang pang-gobyerno, at mga brand partner sa buong mundo. Ang aming OEM at ODM na mga programa ay tumutulong sa mga negosyo na ilunsad ang kanilang sariling linya ng produkto nang hindi kailangan ng investment sa factory infrastructure. Kung kailangan mo man ng isang prototype o buong production run, ginagabayan ka ng aming team mula sa konsepto hanggang sa paghahatid na handa sa dagat.
