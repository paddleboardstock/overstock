values:
  - title: Kalidad Unang
    desc: Bawat bangka na lumalabas sa aming pabrika ay dumadaan sa sapilitang pagsubok sa pagpapanatili ng hangin, paghihiwalay ng tahi, at pagsusuri ng mga sistema bago ipadala.
  - title: Pahalang na Pagsasama
    desc: Kinokontrol namin ang bawat yugto — mula sa PVC pagputol hanggang sa huling pagpupulong — na inaalis ang mga kakulangan sa kontrata at tinitiyak ang pare-parehong kalidad.
  - title: Kaligtasan bilang Pamantayan
    desc: Ang sertipikasyon ng CE ay pangunahing bahagi ng aming itinatayo. Ang aming 64 na mga modelong sertipikado ng CE ay nakakatugon sa mga pamantayan sa kaligtasan ng EU para sa libangan at komersyal na paggamit.
  - title: Nakatuon sa Kasosyo
    desc: Nagtatayo kami ng pangmatagalang relasyon sa OEM, ODM, at mga kasosyo sa pribadong tatak sa pamamagitan ng pagiging bukas, maaasahan, at magkasanib na paglago.
services:
  - title: OEM Paggawa
    desc: Ginagawa namin ayon sa iyong mga espesipikasyon. Ibahagi ang iyong mga guhit, at ang aming pangkat ng inhinyero ang hahawak sa prototyping, tooling, at produksyon.
  - title: ODM Mga Solusyon
    desc: Magsimula mula sa aming napatunayang mga disenyo ng plataporma. Ipasadya ang laki, kulay, grapiko, at packaging upang likhain ang iyong natatanging linya ng produkto.
  - title: Pribadong Tatak
    desc: Ang pangalan ng iyong tatak, ang iyong logo, ang iyong packaging. Dumadating ang mga produkto na handa na para sa retail na may buong integrasyon ng tatak.
  - title: Pasadyang Pagba-brand
    desc: Pagpi-print ng deck pad, graphics ng batya, decal ng tubo, at pasadyang mga label — pare-parehong presensya ng tatak sa bawat ibabaw.
certifications:
  - name: CE Sertipikasyon
    desc: Ang aming mga bangka at sasakyang pantubig ay sumusunod sa EU Recreational Craft Directive (2013/53/EU) at mga kaugnay na pinagsamang pamantayan.
    scope: Mga Bangka at Sasakyang Pantubig
  - name: null
    desc: Sistema ng pamamahala ng kalidad na sertipikado para sa disenyo, paggawa, at pamamahagi ng mga inflatable na sasakyang pantubig.
    scope: Kabuuang pasilidad
  - name: null
    desc: Mga inflatable na bangka — mga kinakailangan sa kaligtasan at pagganap para sa mga pinalakas at matitibay na bangkang may inflatable na katawan.
    scope: RIB at inflatable na mga linya
