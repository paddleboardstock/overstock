hero:
  tagline: Bakit Paddle Board Overstock
  title: Iba ang pagkakagawa. Ginawa para sa negosyo.<br />Ang Kasosyo sa Likod ng Water Adventures sa Buong Mundo
  subtitle: Hindi lang isang tagagawa — isang kasosyo sa negosyo na nagdidisenyo, nag-iengineer, at naghahatid ng mga komersyal na kagamitan para sa mga club, resort, rental operator, at mga umuusbong na tatak ng tubig.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: kalidad at kadalubhasaan sa paggawa ng Paddle Board Overstock
pillars:
  tagline: Tatlong Haligi ng Pakikipagtulungan
  title: Bakit Pumipili Paddle Board Overstockang mga Negosyo sa Tubig sa Mundo
  subtitle: ''
  columns: 3
  items:
    - title: Dinisenyo para sa Komersyal na Paggamit
      description: Ang aming kagamitan ay dinisenyo para sa araw-araw na renta, hindi para sa libangan tuwing weekend. Ang commercial-gradePVC, reinforced drop-stitch cores, UV-stable Hypalon options, at field-tested hardware ay nangangahulugan ng mas mababang maintenance, mas mahabang buhay, at mas mataas ROI para sa iyong operasyon.
      icon: tabler:building-factory
      callToAction:
        text: Tingnan ang komersyal na linya ng produkto
        href: /products
    - title: Mula sa Ideya Hanggang sa Pamilihan
      description: 'Ilunsad ang iyong water sports brand sa loob ng 90 araw. Ginagabayan ka namin sa bawat hakbang: pagpapatunay ng konsepto, pagpili ng produkto, prototype, produksyon, disenyo ng packaging, at pandaigdigang pagpapadala. Walang minimum na presyon ng order — magsimula sa maliit, mag-scale nang may kumpiyansa.'
      icon: tabler:rocket
      callToAction:
        text: Simulan ang iyong paglalakbay sa brand
        href: /oem-odm-blueprint
    - title: Ginawa Para sa Pandaigdigang Kalagayan
      description: 'Mga produktong inangkop para sa bawat klima: mga pormulasyon para sa malamig na tubig PVC para sa Europa, UVmga materyales na lumalaban sa Gitnang Silangan at Australia, mga paggamot laban sa halumigmig para sa Timog-silangang Asya. Bawat padala ay naka-calibrate ayon sa destinasyon nito.'
      icon: tabler:world
