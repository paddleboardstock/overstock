hero:
  tagline: Bakit Paddle Board Overstock
  title: Buo sa Pagkakaiba. Binuo Para Magtagal.<br />Ang Mga Board sa Likod ng Water Adventures sa Buong Mundo
  subtitle: Hindi lamang isang pabrika — isang koponan ng mga paddler at inhinyero na nagdidisenyo, sumusubok, at gumagawa ng premium na inflatable SUP boards para sa mga pamilya, adventurer, at club sa buong mundo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock kalidad at kadalubhasaan sa paggawa
pillars:
  tagline: Tatlong Haligi ng Kalidad
  title: Bakit Pinipili ng Mga Paddler sa Buong Mundo ang Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Dinisenyo para sa Komersyal na Paggamit
      description: Ang aming mga board ay dinisenyo para sa taon ng regular na paddling. Komersyal na kalidad PVC, pinatibay na drop-stitch cores, UV-matatag na materyales, at field-tested na hardware ay nangangahulugang mas mababang maintenance at mas mahabang buhay sa tubig.
      icon: tabler:building-factory
      callToAction:
        text: Tingnan ang komersyal na linya ng produkto
        href: /products
    - title: Nasubok Lampas sa Pamantayan
      description: Bawat board ay pinapagala hanggang 1.25x ng kanyang rated pressure sa loob ng 24-48 oras bago ito umalis sa aming pabrika — 100% pressure-tested, 99.3% defect-free. Ang iyong board ay napatunayang matibay bago pa man ito pumasok sa tubig.
      icon: tabler:shield-check
      callToAction:
        text: Tingnan kung paano kami sumusubok
        href: /quality
    - title: Ginawa Para sa Pandaigdigang Kalagayan
      description: 'Mga produktong inangkop para sa bawat klima: mga pormulasyon para sa malamig na tubig PVC para sa Europa, UVmga materyales na lumalaban sa Gitnang Silangan at Australia, mga paggamot laban sa halumigmig para sa Timog-silangang Asya. Bawat padala ay naka-calibrate ayon sa destinasyon nito.'
      icon: tabler:world
