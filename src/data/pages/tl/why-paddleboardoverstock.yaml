reasons:
  tagline: Paddle Board Overstock Ang Pagkakaiba
  title: Ano ang Nagtatangi sa Amin
  isBeforeContent: false
  columns: 3
  items:
    - title: Tunay na Pagmamanupaktura, Hindi Kalakalan
      description: Kami ay nagmamay-ari at nagpapatakbo ng isang pabrika na may sukat na 12,000 m². Kapag nakipagtulungan ka sa Paddle Board Overstock, direktang makikipagtrabaho ka sa mga taong nagdidisenyo, nag-iinhenyero, at gumagawa ng iyong mga produkto — walang mga tagapamagitan.
      icon: tabler:building-factory
    - title: Pamamaraan na Pinangungunahan ng Inhinyeriya
      description: Nagsisimula ang aming proseso ng disenyo sa use case, hindi sa kategorya ng produkto. Ina-optimize namin ang hugis ng hull, pagpili ng materyales, at konfigurasyon kung paano aktwal na gagamitin ang kagamitan sa mga komersyal na kapaligiran.
      icon: tabler:engine
    - title: Sertipikadong Kalidad
      description: CE sertipikado, ISO sistema ng kalidad, BSCI sumusunod REACH , sumusunod, USCG Type III/V na aprubadong life vest; lahat ng produkto ay sumusunod sa mga naaangkop na internasyonal na pamantayan.
      icon: tabler:certificate
    - title: Flexible OEM/ODM
      description: Mga kulay ng tubo, ayos ng console, branding, packaging — iniakma namin ayon sa iyong mga espesipikasyon. Walang pressure sa minimum na order. Magsimula sa prototype, palawakin nang may kapanatagan.
      icon: tabler:adjustments
    - title: Pandaigdigang Logistika
      description: US warehouse sa California, direktang pagpapadala mula Qingdao, air freight para sa mga agarang order. Kami ang humahawak ng mga papeles at dokumentasyon sa customs sa buong mundo.
      icon: tabler:truck-delivery
    - title: Suporta Habambuhay
      description: Sinusuportahan namin ang mga bangkang aming ginawa 20 taon na ang nakalipas. Totoong piyesa, teknikal na payo, gabay sa pagkukumpuni — available ang aming team kapag kailangan mo kami, kahit nasaan ka man.
      icon: tabler:lifebuoy
testimonials:
  tagline: Pinagkakatiwalaan ng mga Tatak sa Buong Mundo
  title: Ano ang Sinasabi ng Aming mga Kasosyo
  items:
    - content: Nakipagtulungan kami sa ilang mga tagagawa sa Tsina, ngunit Paddle Board Overstock ang namumukod-tangi sa kanilang suporta sa engineering at tuloy-tuloy na kalidad. Tinuturing nila ang aming tatak na parang sa kanila mismo.
      name: — OEM Kasosyo, European Water Sports Brand
    - content: Ang kanilang Hypalon RIBs ay ginagamit na sa aming fleet nang higit sa 5 taon. Minimal na maintenance, mahusay ang UV resistance. Ang 5-taong warranty sa mga tubo ay nagbibigay sa amin ng kumpiyansa.
      name: — Operator ng Fleet, Middle East Resort Group
    - content: Tinulungan kami ng Paddle Board Overstock team na bumuo ng custom na disenyo ng SUP board mula konsepto hanggang produksyon sa loob ng 90 araw. Nalampasan ng kalidad ang aming mga inaasahan.
      name: — Distributor, Australian Watersports
    - content: Bilang maliit na may-ari ng negosyo, nag-aalala ako tungkol sa MOQs. Nakipagtrabaho si Paddle Board Overstock sa aking badyet at tinulungan akong ilunsad ang aking brand sa pamamagitan lamang ng 50 boards. Ngayon, umuorder na ako ng 500.
      name: — Tagapagtatag ng Brand, US SUP Rental Company
cta:
  title: Handa ka na bang itayo ang iyong water business?
  subtitle: Makipag-ugnayan sa aming team para sa libreng konsultasyon. Walang obligasyon — tapat na payo lang tungkol sa kagamitan at paggawa.
  actions:
    - variant: primary
      text: Makipag-usap sa aming team
      href: /contact
    - text: I-download ang kategorya ng produkto
      href: /resources
