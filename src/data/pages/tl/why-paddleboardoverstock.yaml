reasons:
  tagline: Ang Paddle Board Overstock Pagkakaiba
  title: Ano ang Nagtatangi sa Amin
  isBeforeContent: false
  columns: 3
  items:
    - title: Tunay na Pagmamanupaktura, Hindi Kalakalan
      description: Kami ay nagmamay-ari at nagpapatakbo ng isang 12,000 m² na pabrika. Kapag nakipagsosyo ka sa Paddle Board Overstock, direktang nakikipagtrabaho ka sa mga taong nagdidisenyo, nag-iinhenyero, at gumagawa ng iyong mga produkto — walang mga tagapamagitan.
      icon: tabler:building-factory
    - title: Pamamaraan na Pinangungunahan ng Inhinyeriya
      description: Ang aming proseso ng disenyo ay nagsisimula sa gamit, hindi sa kategorya ng produkto. Ino-optimize namin ang hugis ng hull, pagpili ng materyal, at konfigurasiyon para sa aktwal na paggamit ng board sa tubig.
      icon: tabler:engine
    - title: Subok na Kalidad
      description: Bawat board ay sinusubok sa pressure na 1.25x ng rated pressure nito sa loob ng 24-48 oras bago ipadala, at 99.3% ng aming mga padala ay dumating nang walang depekto — sinusuportahan ng aming warranty.
      icon: tabler:award
    - title: Disenyong Nakatuon sa Paddler
      description: 'Bawat modelo ay nagsisimula sa kung paano ka magpaddle: matatag na platform para sa mga nagsisimula, pinadaling hugis para sa touring, at full-size na deck para sa yoga. Dinisenyo namin para sa tunay na paddler, hindi para sa specs ng showroom.'
      icon: tabler:adjustments
    - title: Pandaigdigang Logistika
      description: Bodega sa US sa California, direktang pagpapadala mula sa Weihai, kargamento sa pamamagitan ng eroplano para sa mga agarang order. Kami ang humahandle ng mga dokumento at papeles para sa customs sa buong mundo.
      icon: tabler:truck-delivery
    - title: Suporta Habambuhay
      description: Nakatayo kami sa likod ng mga board na ginawa namin 20 taon na ang nakalipas. Totoong spare parts, teknikal na payo, gabay sa pag-aayos — naroroon ang aming koponan kapag kailangan mo kami, saan ka man naroroon.
      icon: tabler:lifebuoy
testimonials:
  tagline: Pinagkakatiwalaan ng Mga Paddler sa Buong Mundo
  title: Ano ang Sinasabi ng Mga Paddler
  items:
    - content: Ang aking Ocean Voyager ay humawak ng lahat mula sa mahinahong umaga sa lawa hanggang sa magaspang na hapon sa baybayin. Dalawang season na, mukhang bago pa rin at maayos ang pagkakayukbo.
      name: — Paddler para sa Libangan, California
    - content: Nanganganib ako noong binili ko ang aking unang inflatable board online, pero halata ang kalidad sa sandaling pinapagal ko ito. Matibay, matatag, at maganda ang pagkakagawa.
      name: — Baguhang SUP May-ari, Germany
    - content: Paddle kami bilang pamilya tuwing weekend ng tag-init. Tatlong board, walang problema, at gustong-gusto ng mga bata ang maliwanag na disenyo.
      name: — Paddler ng Pamilya, Australia
    - content: Ang pressure testing ay hindi reklamo lang sa marketing — matibay bilang bato ang aking board sa full pressure at walang stretch pagkatapos ng isang taon ng lingguhang paddling.
      name: — Lingguhang Paddler, Netherlands
cta:
  title: Handa Ka Na Bang Hanapin ang Iyong Perpektong Board?
  subtitle: Kausapin ang aming mga eksperto sa paddling para sa tapat na payo sa pagpili ng tamang board — walang puwersa, tanging tunay na tulong.
  actions:
