hero:
  tagline: Mga Kwento ng Tagumpay
  title: Tunay na Resulta Mula sa<br />Water Business Builders
  subtitle: Tingnan kung paano nakabuo ng kumikitang operasyon sa water sports ang mga club, resort, at negosyante sa buong mundo gamit ang Paddle Board Overstock kagamitan at suporta.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock mga kwento ng tagumpay ng customer
stories:
  - title: Paano Nakabuo ng Kumikitang Negosyo sa Paupahang SUP ang Isang Mediterranean Resort
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-star beach resort — Greece
    problem: Kinakailangan ng resort ang premium na water activities para sa mga bisita upang mapataas ang satisfaction scores at lumikha ng bagong kita, ngunit kulang sa kagamitan, safety infrastructure, at kaalaman ng mga tauhan.
    solution: Paddle Board Overstock nagbigay ng 50 custom-branded SUP boards na may kulay at logo ng resort, kumpletong safety system kabilang ang lifeguard station at buoy lines, at 3-araw na training program para sa staff na sumasaklaw sa pamamahala ng kagamitan, pagtuturo sa mga bisita, at safety protocols.
    result:
      - 300+ weekly guest activities ang na-book sa unang buwan
      - 'Guest satisfaction scores para sa water activities: 4.8/5'
      - 'Bagong taunang karagdagang kita: $180K'
      - Walang insidente sa kaligtasan sa unang operating season
      - Nabawasan ng 40% ang gastos sa pagpapalit ng kagamitan kumpara sa nakaraang supplier
    quote:
      text: Hindi lang nagbigay ng boards ang Paddle Board Overstock — tinulungan nila kaming bumuo ng kompletong karanasan ng bisita. Ang aming water sports program ay mula zero hanggang maging highlight ng resort sa isang season.
      author: Pangkalahatang Manager ng Resort
    cta_text: Buuin ang Iyong Solusyon sa Resort
    cta_href: /solutions/resorts
  - title: Paano Nakabuo ng Water Brand ang Isang Australian Startup sa 90 Araw
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Baguhang negosyante — Australia
    problem: Isang outdoor enthusiast ang nais ilunsad ang sarili niyang SUP brand para sa merkado sa Australia ngunit walang karanasan sa paggawa, walang relasyon sa supplier, at limitadong kapital.
    solution: Nagbigay ang Paddle Board Overstock's Brand Launch Package ng konsultasyon sa pagpili ng produkto, custom logo at disenyo ng kulay, branded retail packaging na may hang tags, CE certification documentation, at FOB shipping sa Sydney.
    result:
      - Unang shipment ng 200 boards na naihatid sa loob ng 75 araw mula unang pakikipag-ugnayan
      - Na-lunsad ang brand sa Shopify + Amazon AU sa loob ng 2 linggo mula sa pagdating
      - Naubos ang initial inventory sa loob ng 45 araw
      - 'Average margin: 55% sa retail pricing'
      - 'Ikalawang order: 500 units na inilagay sa loob ng 60 araw mula sa paglulunsad'
    quote:
      text: May ideya ako para sa brand pero wala akong kaalaman sa paggawa. Literal na ginabayan ako ng Paddle Board Overstock sa buong proseso — mula sa pagpili ng tamang disenyo ng board hanggang sa pagbukas ng kauna-unahang shipment ko. 90 araw mula sa pangarap hanggang sa paghahatid.
      author: Founder, Australian SUP Brand
    cta_text: Ilunsad ang Iyong Brand
    cta_href: /solutions/entrepreneurs
  - title: Paano Nakapag-scale ang Isang Thai Beach Club Mula 10 Hanggang 80 Boards
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Water sports club — Thailand
    problem: Isang maliit na SUP beachside club sa Phuket ang kailangang mag-scale mula sa isang hobby operation tungo sa isang propesyonal na rental business na naglilingkod sa mga turista, ngunit hindi makahanap ng maaasahang supplier ng kagamitan na may pare-parehong kalidad at presyo.
    solution: Nagsimula sa Paddle Board OverstockClub Starter Package (10 boards, paddles, safety gear, branding), lumago ang club sa Premium Package program sa loob ng 18 buwan.
    result:
      - Na-scale mula 10 hanggang 80 boards sa loob ng 18 buwan na may pare-parehong kalidad at presyo
      - Nagdagdag ng pagrenta ng kayak at pedal boat gamit ang parehong supplier
      - Ang custom club branding ay nagpataas ng pagkilala sa tatak sa mga turista
      - Ang gastos sa maintenance ay nabawasan ng 60% kumpara sa dating budget na kagamitan
      - Ngayon ay nagsisilbi na sa 150+ araw-araw na renta tuwing peak season
    quote:
      text: Ang Club Starter Package ang perpektong panimulang punto. Habang lumalago ang aming negosyo, Paddle Board Overstock lumalago kasama namin — parehong kalidad, parehong presyo, walang sorpresa.
      author: May-ari ng Club, Phuket
    cta_text: Simulan ang Iyong Club Package
    cta_href: /solutions/clubs
  - title: Paano Standardized ng Isang Caribbean Resort Chain ang Water Sports sa Limang Ari-arian
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Kadena ng resort — Caribbean
    problem: Ang isang luxury resort chain na may 5 ari-arian ay nangangailangan ng pare-parehong kalidad ng water sports equipment at branding sa lahat ng lokasyon, na may sentralisadong procurement at seasonal replacement planning.
    solution: Paddle Board Overstock Naghatid ng multi-property fleet na binubuo ng 300 SUPs at 100 kayak na may pinag-isang branding, shared spare parts inventory, at taunang iskedyul ng pagpapalit na may volume pricing.
    result:
      - Standardized na karanasan ng bisita sa lahat ng 5 property
      - 30% pagbawas sa gastos sa pamamagitan ng pinagsamang pagbili at dami ng presyo
      - Ang sentralisadong imbentaryo ng spare parts ay nagbawas ng downtime ng 80%
      - Tinanggal ng taunang programa ng pag-refresh ng kagamitan ang gulo sa pagtatapos ng season
      - Tumaas ng 45% ang partisipasyon ng guest water sports taon-taon
    cta_text: Idisenyo ang Iyong Programa sa Resort
    cta_href: /solutions/resorts
