hero:
  tagline: Sentro ng Awtoridad
  title: Bakit Paddle Board Overstock?<br />Tiwala na Naitayo sa Loob ng Isang Dekada
  subtitle: Bawat board na aming ginagawa ay may dala ng bigat ng 10+ taon ng marine engineering, masusing kontrol sa kalidad, at libu-libong paddler sa tubig sa buong mundo. Ito ang dahilan kung bakit pinipili ng mga paddler ang Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock pasilidad sa paggawa ng marine at koponang pang-inhinyeriya
stats:
  title: Paddle Board Overstock sa mga Numero
  stats:
    - title: Taon ng Operasyon
      amount: Mula noong 2012
    - title: Mga Inhinyerong R&D
      amount: 14+
    - title: Mga Bansang Nasasakupan
      amount: 50+
    - title: Mga Yunit na Ginawa Bawat Taon
      amount: 15,000+
features3_brand:
  tagline: Kung Sino Kami
  title: Pundasyon ng Tatak<br />& Pamana
  subtitle: Ang kuwento, eksperto, at pandaigdigang abot na nagtatakda sa Paddle Board Overstock bilang isang mapagkakatiwalaang SUP na tatak.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tungkol sa Paddle Board Overstock
      description: Itinatag noong 2012 sa Weihai, China. Mula sa isang panlabas na pagawaan sa baybayin hanggang sa 12,000 m² na pasilidad — ang kumpletong kwento ng Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Kuwento ng Tatak
      description: Paano nagsimula ang isang koponan ng mga marine engineer upang gawing accessible sa buong mundo ang mga professional-grade inflatable paddle board.
      icon: tabler:book
      link: /brand-story
    - title: Kadalubhasaan sa Industriya ng Marino
      description: Malalim na agham ng materyales, tumpak na paggawa, at aktwal na pagsusuri sa totoong mundo — dekada ng marine engineering sa bawat board.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Bakit Paddle Board Overstock
      description: Ang nagtatangi sa amin — kalidad, custom na gawin ayon sa gusto, direktang presyo mula sa pabrika, at end-to-end na suporta para sa bawat paddler.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Aming Koponan
      description: Kilalanin ang pamumuno — mga marine engineer, dalubhasa sa materyales, at eksperto sa paggawa na nagtutulak sa Paddle Board Overstock pasulong.
      icon: tabler:users
      link: /brand/team
    - title: Koponan ng Inhinyero
      description: 78+ pinagsamang taon ng R&D, 40+ plataporma, 1,200+ proyekto sa engineering. Ang teknikal na koponan sa likod ng bawat produkto.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Tiwala at Kalidad
  title: Kalidad, Pagsusuri<br />at Patunay
  subtitle: Masusing pagsusuri, totoong datos ng pagsusuri, at ebidensya na nagpapakita ng aming pangako sa kalidad.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kalidad at Pagsubok
      description: Bawat produkto ay nasusubok sa ilalim ng presyon bago ipadala. Tatag ng tahi, UV resistensya, buoyancy — sinisiguro sa bawat yugto.
      icon: tabler:clipboard-check
      link: /quality
    - title: Ebidensya at Patunay
      description: Mga resulta ng pagsusuri, mga larawan ng deployment, mga ulat ng inspeksyon ng third-party, at mga case study na nagpapatunay sa kalidad ng Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Talang-kaalaman
      description: Tuklasin ang Paddle Board Overstock entity graph — mga produkto, teknolohiya, materyales, at relasyon sa isang konektadong knowledge base.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Pamumuno
  title: Kilalanin ang Koponan<br />Sa likod ng Paddle Board Overstock
  subtitle: Eksperto sa industriya na sumasaklaw sa marine engineering, agham ng materyales, pamamahala ng kalidad, at pandaigdigang e-commerce.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Tagapagtatag at CEO
      description: 15+ taon sa paggawa ng pandagat. Dati ay namuno sa R&D sa isang malaking Chinese marine manufacturer. May hawak ng maraming patente sa disenyo ng inflatable na produkto.
      icon: tabler:crown
    - title: Zhang Wei — Punong Inhinyero
      description: 20+ taon sa paggawa ng polymer at disenyo ng inflatable na istruktura. Dating tagapamahala teknikal sa isang European marine engineering firm.
      icon: tabler:engine
    - title: Chen Ming — Pinuno ng R&D
      description: PhD sa Agham ng Materyales. Espesyalisado sa drop-stitch teknolohiya at high-frequency welding. 10+ taon sa textile composites.
      icon: tabler:flask
    - title: Liu Qiang — Direktor ng Produksyon
      description: 18+ taon sa lean manufacturing. Ipinalaganap ang masusing mga sistema ng kalidad sa lahat ng linya ng produksyon.
      icon: tabler:settings
    - title: Wang Fang — Manager ng Kalidad
      description: 12+ taon sa marine quality control. Pinamumunuan ang internal quality audit. Pinangangasiwaan ang pagsusuri sa bawat batch ng produksyon.
      icon: tabler:shield-check
    - title: Helen Lee — Direktor ng Sales
      description: 15+ na taon sa international e-commerce at logistics. Nagpapadala ng mga board sa mga paddler sa 50+ na bansa. Mahusay sa 4 na wika.
      icon: tabler:briefcase
cta:
  title: Gusto mo ba ng patunay ng aming kalidad?
  subtitle: Makipag-ugnayan sa amin para sa mga ulat ng pagsusuri, tala ng inspeksyon, o upang mag-iskedyul ng pagbisita sa pabrika.
  actions:
    - variant: primary
      text: Humiling ng dokumentasyon
      href: /contact
