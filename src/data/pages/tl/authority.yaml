features3_brand:
  tagline: Kung Sino Kami
  title: Brand Foundation<br />& Heritage
  subtitle: The story, expertise, and global reach that define Paddle Board Overstock as a trusted SUP brand.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tungkol sa Paddle Board Overstock
      description: Itinatag noong 2012 sa Weihai, China. Mula sa isang panlabas na pagawaan sa baybayin hanggang sa 12,000 m² na pasilidad — ang kumpletong kwento ng Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Kuwento ng Tatak
      description: How a team of marine engineers set out to make professional-grade inflatable paddle boards accessible worldwide.
      icon: tabler:book
      link: /brand-story
    - title: Kadalubhasaan sa Industriya ng Marino
      description: Deep material science, precision manufacturing, and real-world testing — decades of marine engineering in every board.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Bakit Paddle Board Overstock
      description: What sets us apart — quality, customization, direct factory pricing, and end-to-end support for every paddler.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Aming Koponan
      description: Kilalanin ang pamumuno — mga marine engineer, dalubhasa sa materyales, at eksperto sa paggawa na nagtutulak sa Paddle Board Overstock pasulong.
      icon: tabler:users
      link: /brand/team
    - title: Koponan ng Inhinyero
      description: 78+ combined R&D years, 40+ platforms, 1,200+ engineering projects. The technical team behind every product.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Tiwala at Kalidad
  title: Quality, Testing<br />& Proof
  subtitle: Rigorous testing, real test data, and evidence that demonstrate our commitment to quality.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kalidad at Pagsubok
      description: Bawat produkto ay nasusubok sa ilalim ng presyon bago ipadala. Tatag ng tahi, UV resistensya, buoyancy — sinisiguro sa bawat yugto.
      icon: tabler:clipboard-check
      link: /quality
    - title: Ebidensya at Patunay
      description: Mga resulta ng pagsusuri, mga larawan ng deployment, mga ulat ng inspeksyon ng third-party, at mga case study na nagpapatunay sa kalidad ng Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Talang-kaalaman
      description: Explore the Paddle Board Overstock entity graph — products, technologies, materials, and relationships in a connected knowledge base.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Pamumuno
  title: Meet the Team<br />Behind Paddle Board Overstock
  subtitle: Industry expertise that spans marine engineering, material science, quality management, and global e-commerce.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Tagapagtatag at CEO
      description: 15+ years in marine manufacturing. Previously led R&D at a major Chinese marine manufacturer. Holds multiple patents in inflatable product design.
      icon: tabler:crown
    - title: Zhang Wei — Punong Inhinyero
      description: 20+ years in polymer fabrication and inflatable structure design. Former technical director at a European marine engineering firm.
      icon: tabler:engine
    - title: Chen Ming — Pinuno ng R&D
      description: PhD sa Agham ng Materyales. Espesyalisado sa drop-stitch teknolohiya at high-frequency welding. 10+ taon sa textile composites.
      icon: tabler:flask
    - title: Liu Qiang — Direktor ng Produksyon
      description: 18+ years in lean manufacturing. Implemented rigorous quality systems across all production lines.
      icon: tabler:settings
    - title: Wang Fang — Manager ng Kalidad
      description: 12+ years in marine quality control. Leads internal quality audits. Oversees testing for every production batch.
      icon: tabler:shield-check
    - title: Helen Lee — Direktor ng Sales
      description: 15+ years in international e-commerce and logistics. Ships boards to paddlers in 50+ countries. Fluent in 4 languages.
      icon: tabler:briefcase
cta:
  title: Want proof of our quality?
  subtitle: Contact us for test reports, inspection records, or to schedule a factory visit.
  actions:
    - variant: primary
      text: Humiling ng dokumentasyon
      href: /contact
