hero:
  tagline: Sentro ng Awtoridad
  title: Bakit Paddle Board Overstock?<br />Tiwala na Naitayo sa Loob ng Isang Dekada
  subtitle: Bawat bangkang aming binubuo ay nagdadala ng bigat ng 10+ taon ng inhinyeriyang pandagat, sertipikadong sistema ng kalidad, at libu-libong matagumpay na operasyon sa buong mundo. Ito ang dahilan kung bakit pinipili ng mga propesyonal sa industriya ang Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock pasilidad ng paggawa ng pantubig at pangkat ng inhinyeriya
stats:
  title: Paddle Board Overstock sa pamamagitan ng mga Numero
  stats:
    - title: Taon ng Operasyon
      amount: Mula noong 2012
    - title: Mga Inhinyerong R&D
      amount: 50+
    - title: Mga Bansang Sinaserbisyuhan
