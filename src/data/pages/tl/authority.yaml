features3_brand:
  tagline: Kung Sino Kami
  title: Pundasyon ng Tatak<br />& Pamana
  subtitle: Ang kwento, kadalubhasaan, at pandaigdigang abot na tumutukoy sa Paddle Board Overstock bilang isang pinagkakatiwalaang tagagawa ng kagamitan sa dagat.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tungkol sa Paddle Board Overstock
      description: Itinatag noong 2012 sa Qingdao, Tsina. Mula sa isang pabrika sa tabing-dagat hanggang sa isang pasilidad na 12,000 m² — ang kumpletong Paddle Board Overstock na kuwento.
      icon: tabler:building-factory
      link: /about
    - title: Kuwento ng Tatak
      description: Paano sinimulan ng isang koponan ng mga marine engineer ang paggawa ng mga inflatable na sasakyang-tubig na pang-propesyonal na maging accessible sa buong mundo.
      icon: tabler:book
      link: /brand-story
    - title: Kadalubhasaan sa Industriya ng Marino
      description: Malalim na agham ng materyal, tumpak na paggawa, at pagsubok sa totoong mundo — dekada ng inhinyeriyang pang-dagat sa bawat hull.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Pandaigdigang Presensya
      description: Naglilingkod sa 50+ bansa sa bawat kontinente. Dalubhasa sa rehiyon para sa lokal na mga kinakailangan sa regulasyon at mga kagustuhan sa merkado.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Bakit Paddle Board Overstock
      description: Ang nagtatangi sa amin — kalidad, pagpapasadya, direktang presyo mula sa pabrika, at buong suporta mula simula hanggang katapusan para sa mga komersyal na operator.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Aming Koponan
      description: Kilalanin ang pamunuan — mga marine engineer, siyentipiko sa materyales, at mga eksperto sa paggawa na nagtutulak sa Paddle Board Overstock pasulong.
      icon: tabler:users
      link: /brand/team
    - title: Koponan ng Inhinyero
      description: 78+ pinagsamang taon ng R&D, 40+ plataporma, 12 sertipikasyon, 1200+ OEM proyekto. Ang teknikal na koponan sa likod ng bawat produkto.
      icon: tabler:engine
      link: /engineering-team
    - title: Sentro ng Pananaliksik at Pagpapaunlad
      description: Inhinyeriyang Hull, RF welding, PVC lab, paggawa ng prototipo, test tank, at kalidad na lab — ang aming kumpletong pasilidad para sa pananaliksik at pag-unlad.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Tiwala at Kalidad
  title: Mga Sertipikasyon, Kalidad<br />at Patunay
  subtitle: Independenteng sertipikasyon, mahigpit na pagsubok, at totoong ebidensya na nagpapakita ng aming pangako sa kalidad.
  isBeforeContent: false
  columns: 3
  items:
    - title: Mga Sertipikasyon
      description: CE, ISO 9001, UKCA, BSCI, REACH — kumpletong dokumentasyon ng sertipikasyon at pagsunod para sa pandaigdigang merkado.
      icon: tabler:shield-check
      link: /certifications
    - title: Kalidad at Pagsubok
      description: Bawat produkto ay nasusubok sa ilalim ng presyon bago ipadala. Tatag ng tahi, UV resistensya, buoyancy — sinisiguro sa bawat yugto.
      icon: tabler:clipboard-check
      link: /quality
    - title: Ebidensya at Patunay
      description: Mga resulta ng pagsubok, mga larawan ng deployment, ulat ng inspeksyon mula sa third-party, at mga case study na nagpapatunay sa kalidad ng Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Talang-kaalaman
      description: Galugarin ang Paddle Board Overstock entity graph — mga produkto, teknolohiya, sertipikasyon, at mga relasyon sa isang konektadong knowledge base.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Pamumuno
  title: Kilalanin ang Koponan<br />Sa likod ng Paddle Board Overstock
  subtitle: Kaalaman sa industriya na sumasaklaw sa inhinyeriyang pang-dagat, agham ng materyales, pamamahala ng kalidad, at pandaigdigang B2B trade.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Tagapagtatag at CEO
      description: 15+ taon sa paggawa ng marine. Dati nang pinamunuan ang R&D sa isang pangunahing Chinese na tagagawa ng bangka. May hawak na maraming patent sa disenyo ng inflatable na bangka.
      icon: tabler:crown
    - title: Zhang Wei — Punong Inhinyero
      description: 20+ taon sa PVC/Hypalon na paggawa at disenyo ng deep-V na hull. Dating teknikal na direktor sa isang European marine engineering firm.
      icon: tabler:engine
    - title: Chen Ming — Pinuno ng R&D
      description: PhD sa Agham ng Materyales. Espesyalisado sa drop-stitch teknolohiya at high-frequency welding. 10+ taon sa textile composites.
      icon: tabler:flask
    - title: Liu Qiang — Direktor ng Produksyon
      description: 18+ taon sa lean manufacturing. Six Sigma Black Belt. Ipinatupad ang ISO 9001 quality systems sa lahat ng production lines.
      icon: tabler:settings
    - title: Wang Fang — Manager ng Kalidad
      description: 12+ taon sa kontrol ng kalidad sa marine. Sertipikadong CE at ISO auditor. Nangangasiwa sa pagsubok para sa bawat batch ng produksyon.
      icon: tabler:shield-check
    - title: Helen Lee — Direktor ng Sales
      description: 15+ taon sa pandaigdigang B2B trade. Pinamahalaan ang OEM/ODM partnerships sa 30+ bansa. Marunong sa 4 na wika.
      icon: tabler:briefcase
cta:
  title: Nais mo bang beripikahin ang aming mga kredensyal?
  subtitle: Makipag-ugnayan sa amin para sa mga kopya ng sertipikasyon, ulat ng inspeksyon mula sa ikatlong partido, o upang mag-iskedyul ng pagbisita sa pabrika.
  actions:
    - variant: primary
      text: Humiling ng mga kredensyal
      href: /contact
    - text: Tingnan ang mga detalye ng sertipikasyon
      href: /certifications
