tldr_points:
  - 'Club Starter Package: 10–30 SUPs/kayak na may mga sagwan, bomba, kit sa pagkumpuni, kagamitang pangkaligtasan'
  - 'Club Premium Package: 30–100 halo-halong fleet na may RFID tracking, pagsasanay ng staff, suporta sa marketing'
  - 'Buong pasadyang pagba-brand: pag-imprenta ng logo sa mga board, may tatak na kulay, pasadyang packaging'
  - 'Presyo sa pakyawan: direkta mula sa pabrika na may diskwento sa dami at taunang programa ng pag-update'
packages_section:
  title: Mga Pakete ng Kagamitan para sa Club
  subtitle: Pumili ng tamang pakete para sa laki ng iyong club. Lahat ng pakete ay may kasamang presyong diretso mula sa pabrika, mga opsyon sa pasadyang branding, at pandaigdigang pagpapadala.
  featured_label: Pinakapopular
  packages:
    - name: Club Starter
      description: Para sa lumalaking mga club na may 10-30 miyembro
      audience: Maliit na club at paaralan ng surfing
      items:
        - 10-20 SUP na boards o kayak
        - Mga paga, pump, at repair kit
        - Mga life vest at kagamitan pangkaligtasan (CE sertipikado)
        - Pangunahing logo branding sa mga board
        - 1-taong warranty at teknikal na suporta
      cta: Kumuha ng Starter Quote
      ctaHref: /request-quotation
    - name: Club Pro
      description: Para sa mga itinatag na club na may 30-100 miyembro
      audience: Medium na club at mga training center
      featured: true
      items:
        - 30-60 na halo-halong fleet (SUP + kayak)
        - Premium na paga, high-output na pump
        - Kompletong safety package na may storage racks
        - Buong custom branding (boards + packaging)
        - RFID system para sa pagsubaybay ng pagpaparenta
        - Pagsasanay sa staff at materyales sa marketing
        - 2-taong warranty at priority support
        - Taunang programa ng pag-refresh ng fleet
      cta: Kumuha ng Pro Quote
      ctaHref: /request-quotation
    - name: Club Enterprise
      description: Para sa malalaking club na may 100+ miyembro
      audience: Malalaking club at multi-lokasyon na operator
      items:
        - 60-100+ na halo-halong fleet na may RIB tenders
        - Commercial-grade na pump, tools, at spare parts
        - Kumpletong sistema ng kaligtasan na may rescue equipment
        - Buong OEM/ODM pasadyang paggawa
        - RFID + POS integrasyon
        - Pagsanay sa site at manwal ng operasyon
        - 3-taong warranty at nakalaang tagapamahala ng account
        - Panpanahong pag-ikot ng flota at programa ng trade-in
      cta: Kumuha ng Enterprise Quote
      ctaHref: /request-quotation
