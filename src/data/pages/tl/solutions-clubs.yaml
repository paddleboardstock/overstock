testimonial:
  content: Nagsimula kami sa Club Starter Package para sa aming surf school sa Portugal. 20 board, paddles, vest — dumating ang lahat sa loob ng 3 linggo. Pagkalipas ng dalawang season, nag-upgrade kami sa Pro Package. Ang espesyal na pag-ba-brand ng aming logo ay malaking tulong sa aming propesyunal na imahe.
  name: Ricardo Santos
  title: May-ari, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Profile ng Club
  title: Mga Solusyon para sa Water Sports Club<br />Ayon sa Uri ng Club
  subtitle: Mula sa university paddle clubs hanggang sa eksklusibong private yacht clubs — bawat uri ng club ay may natatanging pangangailangan sa kagamitan, pattern ng paggamit, at istruktura ng budget. Iniangkop namin ang bawat package upang tumugma sa modelo ng club.
  items:
    - title: Mga Paddle Club ng Unibersidad at Kolehiyo
      subtitle: Mataas na paggamit ng student fleet
      description: Student-run o institusyonal na sinusuportahang paddle clubs na nagpapatakbo ng SUP at kayak programs para sa departamento ng libangan ng unibersidad. Ang kagamitan ay dumadaan sa mataas na dalas, mataas na turnover na paggamit sa iba't ibang antas ng kasanayan bawat semestre. Ang tibay at madaling pagkukumpuni ay kritikal, kasabay ng budget-friendly na presyo para sa mga organisasyon ng estudyante.
      features:
        - Karagdagang matibay na PVC konstruksyon na angkop sa siklong paggamit ng estudyante
        - Mga kulay-katutubong board ayon sa antas ng kasanayan para sa madaling pamamahala ng fleet
        - Kasama sa bawat order ang repair kit + at video support on-call
        - Diskwento sa presyo para sa organisasyon ng estudyante at semester-based na bayad
    - title: Mga Klub ng Komunidad para sa Pagpapalaot at Panlipunan
      subtitle: Mga pampalakasan na klub na pinapagana ng pagiging miyembro
      description: Mga club na nakabatay sa komunidad na nag-aalok ng SUP, kayak, at mga karanasang panlipunang paddling sa mga miyembro. Kailangang balansehin ng kagamitan ang performance at kaginhawahan para sa malawak na saklaw ng edad, na may branding na nagpapalakas ng pagkakakilanlan ng club at pagmamalaki ng miyembro. Mahalagang epektibo ang imbakan para sa mga club na nagpapatakbo mula sa limitadong access sa tabing-dagat.
      features:
        - 'Halo-halong flotilla: pangkalahatang SUPs, touring boards, at mga rekreasyonal na kayak'
        - 'Buong brand ng club: pasadyang mga kulay, pag-imprenta ng logo, may tatak na PFDs'
        - Compact na solusyon sa pag-iimbak para sa mga inflatable na kagamitan
        - 'Starter kit para sa paglago ng pagiging kasapi: mga referral card, branded na potograpiya'
    - title: Mga Paaralan ng Surf at Mga Akademya ng Surf Kayak
      subtitle: Pagtanghal at pagtuturo sa baybayin
      description: Mga paaralang nakatuon sa surfing na nagtuturo ng SUP surfing, surf kayaking, at kasanayan sa paglangoy sa alon. Dapat gumana ang kagamitan sa mga kondisyon ng alon — madaling galawin, mabilis tumugon, at matibay na sapat upang kayanin ang paulit-ulit na pagkahulog, pagkasira ng buhangin, at pagkakalantad sa maalat na tubig nang hindi mabilis nasisira.
      features:
        - Mas maiikli, mas malapad na SUP na hugis na inihanda para sa kakayahang mag-manobra sa alon
        - Pinatibay na konstruksyon ng riles para sa pagtutol sa epekto ng mga alon
        - 'Kagamitan sa kaligtasan na partikular para sa surfing: mga nakapulupot na tali, mga opsyon na malambot na palikpik'
        - Programa ng pagpapalit ng fleet na may mga diskwento sa trade-in kada panahon
    - title: Mga Klab ng Kumpanya at Pribadong Yate
      subtitle: Karanasan ng miyembrong premium
      description: Eksklusibong pribadong mga club na nag-aalok ng mga water sports bilang premium na pasilidad para sa mga miyembro. Mataas ang pamantayan ng kagamitan — mahalaga ang estetika, pagkakatugma sa tatak, at presentasyon na handa para sa mga bisita gaya ng kahalagahan ng pagganap. Kasama sa mga inaasahang serbisyo ang serbisyong may puting guwantes, pasadyang solusyon sa imbakan, at suporta sa antas ng concierge.
      features:
        - Mga premium finish na board na may wood-grain EVA at mga batik na metaliko
        - Pasadyang pagtutugma ng kulay sa mga alituntunin ng tatak ng club
        - 'Serbisyong concierge sa paghahatid: pre-inflated, inayos, at may label para sa bawat season'
        - Nakatuon na pamamahala ng account na may prayoridad na tugon sa SLA
