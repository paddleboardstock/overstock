features3_reasons:
  tagline: Bakit Piliin ang Aquafarer
  title: Pito na Dahilan para Makipagsosyo sa Amin
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Totoong Paggawa, Hindi Pangangalakal
      description: Kami ay nagmamay-ari at nagpapatakbo ng isang pabrika na may sukat na 12,000 m². Kapag nakipagtulungan ka sa Aquafarer, direktang makikipagtrabaho ka sa mga taong nagdidisenyo, nag-iinhenyero, at gumagawa ng iyong mga produkto — walang mga tagapamagitan.
      icon: tabler:building-factory
    - title: 2. Pamamaraan na Pinangunahan ng Inhinyeriya
      description: Nagsisimula ang aming proseso ng disenyo sa paggamit ng kaso, hindi sa kategorya ng produkto. Ini-optimize namin ang hugis ng katawan ng bangka, pagpili ng materyal, at pagkakaayos ayon sa aktwal na paggamit ng bangka.
      icon: tabler:engine
    - title: 3. Sertipikadong Kalidad
      description: CE sertipikado, ISO sistema ng kalidad, BSCI sumusunod, REACH sumusunod, USCG aprubado. Ang aming 64 na CE-sertipikadong mga modelo ay tumutugon sa mga pamantayan ng internasyonal — hindi lamang mga pahayag.
      icon: tabler:certificate
    - title: 4. Flexible OEM/ODM
      description: Mga kulay ng tubo, ayos ng console, branding, packaging — iniakma namin ayon sa iyong mga espesipikasyon. Walang pressure sa minimum na order. Magsimula sa prototype, palawakin nang may kapanatagan.
      icon: tabler:adjustments
    - title: 5. Pandaigdigang Logistik
      description: Bodega sa US sa California, direktang pagpapadala mula sa Qingdao, kargamentong panghimpapawid para sa mga agarang order. Kami ang humahandle ng mga papeles at dokumentasyon para sa customs.
      icon: tabler:truck-delivery
    - title: 6. Suporta Habambuhay
      description: Sinusuportahan namin ang mga bangkang aming ginawa 20 taon na ang nakalipas. Tunay na piyesa, teknikal na payo, gabay sa pagkukumpuni — available ang aming koponan kapag kailangan mo kami.
      icon: tabler:lifebuoy
    - title: 7. Tapat na Mga Espesipikasyon
      description: Tunay na load ratings, tunay na sukat, tunay na timbang. Walang pinalaking marketing. Ang aming inilathala ay iyon ang makukuha mo — pinatunayan ng independiyenteng pagsubok.
      icon: tabler:ruler-measure
testimonials:
  tagline: Pinagkakatiwalaan ng mga Tatak sa Buong Mundo
  title: Ano ang Sinasabi ng Aming mga Kasosyo
  items:
    - content: Nakipagtulungan kami sa ilang mga tagagawa sa Tsina, ngunit Aquafarer ang namumukod-tangi sa kanilang suporta sa engineering at tuloy-tuloy na kalidad. Tinuturing nila ang aming tatak na parang sa kanila mismo.
      name: — OEM Kasosyo, European Water Sports Brand
    - content: Ang kanilang Hypalon RIBs ay ginagamit na sa aming fleet nang higit sa 5 taon. Minimal na maintenance, mahusay ang UV resistance. Ang 5-taong warranty sa mga tubo ay nagbibigay sa amin ng kumpiyansa.
      name: — Fleet Operator, Middle East Resort Group
    - content: Tinulungan kami ng Aquafarer team na bumuo ng custom na disenyo ng SUP board mula konsepto hanggang produksyon sa loob ng 90 araw. Nalampasan ng kalidad ang aming mga inaasahan.
      name: — Distributor, Australian Watersports
cta:
  title: Handa ka na bang maranasan ang kaibahan?
  subtitle: Makipag-ugnayan sa aming team upang talakayin ang iyong proyekto. Walang kinakailangang commitment — tapat na payo lamang tungkol sa paggawa.
  actions:
    - variant: primary
      text: Makipag-usap sa aming team
      href: /contact
    - text: I-download ang kategorya ng produkto
      href: /resources
