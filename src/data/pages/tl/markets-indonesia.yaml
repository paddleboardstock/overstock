hero:
  tagline: Indonesya
  title: SUP Wholesale Boards para sa<br />Mga Negosyo sa Indonesia
  subtitle: Mga tindahan ng water sports, mga resort sa isla, at mga operator sa buong arkipelago — mga bagong overstock board mula sa 5 yunit, halo-halong modelo, na ipinapadala mula sa China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Mga overstock board para sa mga resort sa Indonesia at mga tindahan ng water sports sa Bali
direct_answer: Paddle Board Overstock nagbibigay ng mga bagong overstock inflatable SUP board sa mga negosyo sa Indonesia — mga tindahan ng water sports sa Bali, mga isla mula Lombok hanggang Gillis at iba pa, mga beach club, at mga rental operator. Nagsisimula ang mga wholesale order sa 5 board na may halo-halong modelo sa isang padala, ipinapadala mula Weihai, China sa pamamagitan ng express air freight o pinagsamang sea freight. Bawat board ay 100% pressure-tested at sakop ng 2-Taong SUP Warranty.
tldr_points:
  - Wholesale mula sa 5 board — halo-halong modelo, presyo ayon sa kabuuang dami
  - Nagsisilbi sa ekonomiya ng water sports ng Bali at mga resort sa isla sa buong bansa
  - Maikling ruta ng kargamento mula China–Indonesia, himpapawid o dagat
  - 100% pressure-tested, 2-Taong SUP Warranty sa bawat board
overview_section:
  tagline: Pangkalahatang-ideya ng Merkado
  title: Ang SUP Pamilihan ng Indonesia
  paragraphs:
    - Ang Indonesia ay isa sa mga dakilang ekonomiya ng water sports sa Asya, at ang Bali ang tumitibok na puso nito. Mula sa mga beach club ng Seminyak at Canggu hanggang sa mga tahimik na lagoon ng Sanur at Nusa Dua, makikita ang paddle boards saanman — pag-paddle sa pagsikat ng araw sa ibabaw ng mga bahura, SUP mga klase sa yoga, mga tour sa lagoon, at mga programa ng mga bisita sa hotel. Lampas sa Bali, ang Lombok, ang mga Isla ng Gili, at ang lumalaking mga eksena ng turismo sa buong kapuluan ay sumusunod sa parehong pattern.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: Mas mahalaga ang tibay, UV performance, at kakayahang ayusin kaysa sa gloss ng katalogo. Ang mga order ay may 5–20 boards, pinaghalo para sa mga aralin, paupahan, at retail display.
  customer_types:
    - title: Mga Tindahan ng Water Sports sa Bali
      description: Mga itinatag na operator ng Sanur, Seminyak, at Canggu SUP na nagdagdag sa surf, dive, at snorkel lines.
    - title: Mga Resort sa Isla at Beach Club
      description: May mga resort at beach club sa Bali, Lombok, at ang Gillis na nagpapatakbo ng mga guest paddle at SUP yoga program.
    - title: Mga Tour & Rental Operator
      description: Ang mga tour operator sa lagoon at bakawan at mga hourly rental stand ay nagre-refresh ng mga fleet ayon sa panahon.
shipping_section:
  title: Pagpapadala sa Indonesia
  paragraphs:
    - Ang Indonesia ay isa sa pinakamaikling freight lane mula sa aming base sa Weihai, China. Ang express air freight ay mabilis na nagdadala ng mga sample at 1–3 board orders papuntang Denpasar at Jakarta; Ang consolidated sea freight ay nagsisilbi sa 5–20 board wholesale orders sa pamamagitan ng Tanjung Priok, Tanjung Benoa, at iba pang mga pantalan. Parehong mga opsyon ay nakasaad sa tinatayang oras ng transit para sa iyong destinasyon.
    - Nagbibigay kami ng commercial invoice at packing list na kinakailangan ng clearance, na may tamang HS codes at deklaradong halaga. Ang import duties at buwis ay babayaran ng importer ayon sa mga patakaran ng Indonesia.
  customs_note: Ang Indonesian clearance para sa sports equipment ay sensitibo sa dokumentasyon — makipag-ugnayan sa iyong customs broker (PPJK) upang kumpirmahin ang kasalukuyang duty at tax treatment. Nagbibigay kami ng kumpleto at pare-parehong papeles at mabilis kaming tumutugon sa mga kahilingan ng broker.
faq_section:
  title: Mga Madalas Itanong tungkol sa Indoneya
  items:
    - q: Gaano kabilis ang kargamento mula China papuntang Bali?
      a: Ang Indonesia ay isa sa pinakamalapit naming destinasyon ng kargamento mula Weihai. Ang express air papuntang Denpasar o Jakarta ang pinakamabilis na opsyon para sa mga sample at maliliit na order; Ang consolidated sea freight ay may quot na may transit window para sa wholesale orders. Pareho itong nakalista sa iyong quote.
    - q: Angkop ba ang mga board para sa pang-araw-araw na paupahang gamit sa tropikal na lugar UV?
      a: Oo — ang drop-stitch PVC construction rated para sa daily rental cycles ang aming ibinibigay sa mga fleet sa 50+ bansa. Ang standard care (banlawan pagkatapos ng maalat na tubig, may lilim na imbakan) ay nagpapanatili sa kanila sa serbisyo sa maraming panahon ng sikat ng araw sa Bali.
    - q: Ano ang itsura ng order sa isang water sports shop?
      a: Karaniwan 5–15 na tabla na pinaghalong mga matatag na all-around na modelo para sa mga aralin at upa at ilang premium na art edition para sa retail display — isang padala, na ipinapresyo batay sa kabuuang dami.
    - q: Maaari mo bang suportahan ang aming PPJK sa pamamagitan ng dokumentasyon?
      a: Oo. Bawat order ay ipinapadala kasama ang isang commercial invoice at packing list na may tamang HS codes at declared values, at mabilis kaming tumutugon kapag kailangan ng iyong broker ng karagdagang dokumento.
