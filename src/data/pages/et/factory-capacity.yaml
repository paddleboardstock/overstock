hero:
  tagline: Tootmisvõimsus
  title: Tootmisvõimsus ja aastane tootmine
  subtitle: 12 000 m² tehas, mis toodab aastas 15 000 paati ja millel on võimalus kasvatada tootmist
intro: Aquafarer haldab ühte suurimaid spetsiaalselt täispuhutavate paatide tootmiseks mõeldud tootmisvõimalusi Qingdaos, Hiinas. Meie 12 000 m² suurune tehas on jagatud kuueks spetsialiseerunud töötuppa, mis töötavad paralleelselt, andes meile võime toota SUP paate, kajakke, kaatreid, RIB ja turvavarustuse liinide tootmisega aastas 15 000 paati.
highlights:
  - value: 12,000 m²
    label: Kogu tootmispind
    detail: Kuues spetsialiseeritud töötubades
  - value: 15,000
    label: Paadid toodetakse igal aastal
    detail: SUPs, kajakk, RIBs, kaater, turvavarustus
  - value: 200-300
    label: Kvalifitseeritud tööjõud
    detail: 25+ inseneri, 2 vahetust päevas
  - value: 50+
    label: Eksportriigid
    detail: EL, USA, AU, Lähis-Ida, Aasia
  - value: 30–45
    label: Standardne tarneaeg (päevades)
    detail: Tellimuse kinnitamisest kuni FOB
  - value: 10+
    label: Aastatepikkune ekspordikogemus
    detail: Alates 2012. aastast
workshops:
  - title: SUP lauatootmine
    description: '4 paralleelset kokkupandavat liini täispuhutavate SUP laudade tootmiseks. Iga liin suudab toota 50–80 lauda ühe vahetuse jooksul. Digiprindi ja siiditrüki jaamad töötavad samaaegselt. Aastane SUP võimsus: 8 000+ lauda.'
    output: 8 000+ SUPs/aastas
  - title: RIB paaditootmine
    description: 'Pühendatud klaaskiust kere töötuba kuue vormijaamaga RIB kerele kuni 7,6 m. Toru keevitus ja koostamisala käsitleb samaaegselt 3–5 RIBs. Aastane RIB võimsus: 2 000+ paati.'
    output: 2 000+ RIBs/aastas
  - title: Täispuhutavad paadid ja kaatrid
    description: 'Mitmeotstarbelised tootmisliinid täispuhutavate paatide, kajakkide ja kaatrite jaoks. Kuumaõhukeetmise jaamad, RF dielektrilised pressid ja kokkupanekulauad konfigureeritakse ümber vastavalt tellimuste segule. Aastane võimsus: 5 000+ ühikut.'
    output: 5 000+ ühikut/aastas
  - title: Ohutusvarustus
    description: 'Eraldi puhastustoa tootmisala päästevestide ja turvavarustuse jaoks. Pühendatud õmblus-, vahtpaigutus- ja testimisjaamad. Aastane päästevestide võimsus: 50 000+ ühikut.'
    output: 50 000+ päästevesti/aastas
oem_capacity:
  moq: 'SUP: 5–10 ühikut | RIB: 2–5 ühikut | Kajakk/Kaatrid: 10–20 ühikut | Kohandatud vorm: 200+ ühikut'
  lead_time: 'Standard 30–45 päeva. Proov: 15–20 päeva. Kiirtootmine saadaval.'
  payment: T/T 30% sissemakse + 70% enne saatmist. Aktiõigus, Western Union aktsepteeritud.
