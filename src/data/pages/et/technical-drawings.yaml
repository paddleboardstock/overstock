hero:
  tagline: Tehnilised joonised ja CAD
  title: RIB & Täispuhutav paat<br />Tehnilised joonised ja CAD allalaadimised
  subtitle: Planeerimistaseme GA joonised, mõõtmelehed ja tekikavad projekti hindamiseks ja spetsifikatsiooni koostamiseks. Juurdepääs tehnilistele joonistele sobival tasemel — avalikest PDF-failidest kuni projektitaseme STEP-failideni.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB paadi tehnilised joonised ja CAD allalaadimised
direct_answer: Aquafarer pakub hanget taseme tehnilisi jooniseid RIB paatidele ja täispuhutavatele veesõidukitele — sealhulgas üldised paigutus (GA) PDF-id, mõõtmelehed ja tekikavade joonised. Kõrgema detailsusega vormingud (DXF/DWG, STEP/IGES) on saadaval kvalifitseeritud päringu või projektitaotluse alusel.
stats:
  - value: GA PDF
    label: Tasuta allalaadimine
    detail: Üldine paigutus mudeli kaupa
  - value: DXF/DWG
    label: Kerge vormi juurdepääs
    detail: Planeerimistaseme 2D CAD
  - value: STEP/IGES
    label: Projektitaotlus
    detail: 3D mudel integreerimiseks
  - value: NDA Ainult
    label: Struktuurijoonised
    detail: Kere lamineerimine, vormiandmed
content_tiers:
  tagline: Allalaadimise tasemed
  title: Neli juurdepääsutaset<br />— Õige detail õigel etapil
  subtitle: Pakume hanget taseme jooniseid, mitte tootmistaseme faile. Iga tase vastab erinevale projekti etapile.
  items:
    - title: Tase 1 — Avalik PDF
      description: Üldine paigutus (GA), 4-vaatel mõõtmed ja tekikava PDF-formaadis. Saadaval tasuta allalaadimiseks. Piisav projektiplaneerimiseks, ruumijaotuseks ja esmaseks spetsifikatsiooni ülevaatamiseks.
      icon: tabler:file-type-pdf
    - title: Tase 2 — Kerge vorm DXF/DWG
      description: 2D CAD failid (DXF või DWG) planeerimistaseme paigutuse integreerimiseks. Nõuab lühikest kvalifikatsioonivormi (ettevõtte nimi, projekti tüüp, kavandatav kasutus). Ei sisalda struktuuri- ega tootmisteavet.
      icon: tabler:file-code
    - title: Tase 3 — Projektitaotlus STEP/IGES
      description: 3D mudelifailid (STEP või IGES) süsteemide integreerimiseks, sisustuse disainiks või laevade arhitektuuri koordineerimiseks. Nõuab projektitaotlust koos ulatuse, ajakava ja ostusooviga. Allub kinnitamisele.
      icon: tabler:cube
    - title: Tase 4 — NDA Inseneritehniline
      description: Kere struktuurijoonised, lamineerimise ajakavade, torude lõikamise laiendused ja vormiandmed. Saadaval ainult NDA kinnitatud tellimuste alusel. Need on tootmistaseme failid — mitte avalikuks jagamiseks.
      icon: tabler:lock
content_included:
  tagline: Mis on kaasatud
  title: Joonistamise sisu<br />Mudeli kohta
  subtitle: Igal mudelil on standardne jooniste pakett, mis sisaldab olulist planeerimisteavet B2B ostjate ja projektinseneride jaoks.
  items:
    - title: Üldpaigutus (GA)
      description: Külgvaade, ülaltvaade ja ristlõige, mis näitavad kere kuju, toru asukohta, konsooli paigutust, istekohti, kütusesüsteemi ja peamisi mõõtmeid (pikkus, laius, toru diameeter, kere nurk). Muudatuste staatus ja autoriõigus on märgitud pealkirja jaotises.
      icon: tabler:layout
    - title: 4-vaate mõõtmete joonis
      description: Külg-, ees-, taga- ja pealevaated koos üldmõõtudega transpordiplaanimiseks (kõrgus haagisel, laius konteineri jaoks, kaal tõstmiseks). Sisaldab töö- ja transpordikonfiguratsioone.
      icon: tabler:ruler-2
    - title: Tekiplaan ja seadmete plaan
      description: Ülaltvaade tekile, näidates konsooli alust, istmete asukohti, D-rõnga asukohti, navigatsioonituled, pumpa pääsukohta, aku/kütuse sektsiooni ja seadmete kinnituskohad. Piiratud täpsus patenteeritud liideste osas.
      icon: tabler:map
    - title: Transpordi ja pakendi joonis
      description: Konteineri laadimisplaan, aluse mõõtmed, kaalujagunemine ja tõstevõtme positsioonid logistika planeerimiseks. Hõlmab standard- ja eritellimuspakendite valikuid.
      icon: tabler:truck
content_protection:
  tagline: IP kaitse
  title: Mida me ei jaga<br />& Miks
  subtitle: Meie insenertehniliste intellektuaalomandi kaitsmine tagab, et saame jätkata teadus- ja arendustegevusse investeerimist, samal ajal pakkudes ostjatele kõike, mida nad projektide planeerimiseks vajavad.
  items:
    - title: Hulli hallituse südamiku andmed
      description: Pistik- ja vormigeomeetria, CNC tööriistaradade ja laminaadimallide kasutamine on omandiõigusega tootmisressursid. Neid ei jagata ühegi juurdepääsutsooni jaoks väljaspool kinnitatud NDA lepinguid.
      icon: tabler:ban
    - title: Torude lõikamise laiendused
      description: Torukanga tasapinna lõikamise failid on tootmistasemel andmed. Saadaval ainult NDA alusel kinnitatud tootmistellimustega ja jagatakse ainult lepingupoolega.
      icon: tabler:ban
    - title: Struktuuriarvutused
      description: Üksikasjalik pingete analüüs, FEA tulemused ja laminaadi ajakavad on vastavust mõjutavad dokumendid, mida jagatakse ainult Teatatud Organitega ja NDA-piiratud klientidega vastavushindamise protsessi käigus.
      icon: tabler:ban
    - title: Konkurentide sõelumine
      description: Me jätame endale õiguse keelduda CAD-i juurdepääsutaotlustest, mis tunduvad tulevat konkurentidelt, projektitaustata tudengitelt või osapooltelt, kellel puudub seaduslik hankimise eesmärk.
      icon: tabler:shield
content_models:
