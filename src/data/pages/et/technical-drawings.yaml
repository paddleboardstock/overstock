  title: Tehniline joonis<br />Saadavus mudeli järgi
  subtitle: GA PDF-i allalaadimised on saadaval meie peamiste RIB ja kummipaadimudelite jaoks. Võtke meiega ühendust konkreetsete mudelijooniste saamiseks, mida loetelus ei ole.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, GRP sügav-V kere, Hypalon või PVC torud, keskkonsool. GA, mõõtmed, tekikava ja transportimisplaan on saadaval. Disainikategooria C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP mõõdukas-V kere, Hypalon või PVC torud, külg- või keskkonsool. GA ja mõõtmed saadaval. Disaini kategooria C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP kere, PVC torud, roolivardaga või konsooliga. GA ja mõõtmed saadaval. Disaini kategooria C/D.
      icon: tabler:sailboat
    - title: AF380 Täispuhutav Paat
      description: 3,8 m täispuhutav kiik, alumiiniumist põrand, PVC torud. GA ja pakendamismõõtmed saadaval. EN ISO 6185 nõuetele vastav.
      icon: tabler:sailboat
    - title: AF320 Täispuhutav Paat
      description: 3,2 m täispuhutav paat, õhupõrandal, PVC torud. GA ja pakendamismõõtmed saadaval. EN ISO 6185 nõuetele vastav.
      icon: tabler:sailboat
