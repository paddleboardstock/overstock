content_version_control:
  tagline: Versioonihaldus
  title: Joonistusversioon<br />Juhtimine
  subtitle: Iga joonis järgib kontrollitud parandussüsteemi. Alati kontrolli, et sul on praegune versioon olemas, enne kui kasutad jooniseid projekti planeerimiseks.
  items:
    - title: Revisjoni jälgimine
      description: Iga joonis sisaldab paranduskoodi (Rev-A, Rev-B, Rev-C), väljastamise kuupäeva, viimast ülevaatamise kuupäeva, kohaldatavat mudelit/konfiguratsiooni, ühikuid, faili suurust ja vormingut. Allalaadimiseks on saadaval ainult "Current" versioon.
      icon: tabler:git-branch
    - title: Joonise staatuse teade
      description: Kõik avalikud joonised on märgitud "Ainult esialgne paigutus — mitte ehituseks, sertifitseerimiseks ega tootmiseks. Mõõtmed alluvad lõplikule spetsifikatsioonile ja tellimuse kinnitamisele." See kaitseb mõlemat poolt valesti rakendamise eest.
      icon: tabler:alert-circle
    - title: Uuenduste teavitused
      description: Kui mudeli spetsifikatsioon muutub, uuendatakse joonise versiooni ja varasemad versioonid märgitakse "Asendatud". Registreeritud kasutajad, kes laadisid alla DXF/DWG pakid, saavad olulistest uuendustest e-posti teel teate.
      icon: tabler:bell
faq:
  title: Tehnilised joonised — korduma kippuvad küsimused
  questions:
    - q: Kas GA PDF-id on tõesti tasuta?
      a: Jah. Meie peamiste mudelite üldised PDF-failid on tasuta saadaval — täida allolev lühike kvalifikatsioonivorm ja allalaadimislink toimetatakse e-posti teel ühe tööpäeva jooksul. Need sisaldavad planeerimistasandi infot, mis on piisav projekti hindamiseks, ruumide eraldamiseks ja esialgseks spetsifikatsioonide ülevaatamiseks.
    - q: Kuidas ma pääsen ligi DXF/DWG failidele?
      a: Täida allalaadimise lehel lühike kvalifitseerimisvorm oma ettevõtte nime, projektitüübi ja kavandatud kasutusega. Heakskiidetud taotlused saavad allalaadimislingi e-posti teel ühe tööpäeva jooksul.
    - q: Kas ma saan STEP/IGES 3D mudeleid?
      a: STEP või IGES 3D mudelifailid on kättesaadavad meie projekti taotlusprotsessi kaudu. Esitage oma projekti ulatus, integratsiooninõuded, ajakava ja ostukavatsus. Heakskiidu korral — tavaliselt 3–5 tööpäeva jooksul.
    - q: Miks piirate juurdepääsu detailsematele failidele?
      a: Kere geomeetria, vormi andmed ja konstruktsiooniarvutused esindavad aastaid investeeringuid teadus- ja arendustegevusse ning on tootmise põhiintellektuaalomand. Pakume kõike, mis on vajalik hankeplaneerimiseks ja projektide integreerimiseks, kaitstes samal ajal oma võimet jätkata investeerimist uute toodete arendusse.
    - q: Kas joonistel on tootmise detailid?
      a: Ei. Avalikud ja kergekujulised joonised sisaldavad hanketasandi infot planeerimiseks ja spetsifikatsiooniks. Tootmistasandi detailid (lamineerimisgraafikud, tööriistarajad, lõikelaiendused) jagatakse ainult NDA kinnitatud tellimuste all.
    - q: Kas joonised on saadaval kohandatud või poolkohandatud RIB konfiguratsioonide jaoks?
      a: Kohandatud projektijoonised koostatakse OEMODM arendusprotsessi osana. Kui hindate kohandatud RIB projekti, võtke meiega ühendust oma nõuetega ning pakume projektispetsiifilisi üldjooniseid ettepaneku osana.
