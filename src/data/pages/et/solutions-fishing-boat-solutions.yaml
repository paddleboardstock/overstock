content_challenge:
  tagline: Väljakutse
  title: Kalapaadid vajavad<br />Stabiilsust, Ulatust & Vastupidavust
  subtitle: Kas opereerite kaubanduslikke kalapaate, haldate koopeeratiivi laevastikku või juhite kalastusretki — teie paadi peab iga päev usaldusväärselt toimima.
  paragraphs:
    - Kalapaadid vajavad stabiilseid platvorme tööriistade kasutamiseks, saagi käsitlemiseks ja ohutuks liikumiseks tekil. Täispuhutavad paadid ja RIBs pakuvad oma torukujunduse tõttu loomulikku stabiilsust — märkimisväärne eelis võrreldes samu pikkusi omavate jäikade kiiludega.
    - Kütusesääst on oluline kalapüügi operatsioonides, kus tegevuskulud mõjutavad otseselt kasumlikkust. RIBs ja täispuhutavad paadid on kergemad kui sama suurusega jäigad paadid, vajavad vähem jõudu ja tarbivad vähem kütust — oluline kaubanduslike operaatorite jaoks, kes töötavad paatidega iga päev ja koopeeratiivi eelarvet haldavad.
    - Vastupidavus merekeskkonnas on hädavajalik. Merevesi, UV kokkupuude ja pidev kasutamine nõuavad materjale, mis taluvad rasketes tingimustes kahjustusteta. Kaubandus- ja koopeeratiivioperaatorite jaoks mõjutab usaldusväärsus otseselt tulu — katkine paat tähendab kaotatud kalapüügipäevi.
    - Paddle Board Overstock kalapüügikonfiguratsioonid hõlmavad õngenugade hoidjaid, kalatsükleid, putukatega lahtiladumist, elava vee kaevusid ja kaubakäsitluslahendusi, mis on loodud tõsisteks kalapüügirakendusteks kaubanduslikes, koopeeratiivsetes ja vaba aja tegevuse operatsioonides.
content_solution:
  tagline: Meie lahendus
  title: Kalapüügiks valmis konfiguratsioonid
  subtitle: Iga Paddle Board Overstock kalapaat saab olla konfigureeritud teie konkreetse kalapüügi rakenduse jaoks.
  list:
    - Õngenugade hoidja paigaldus — tehasest paigaldatud või valmis järelpaigaldamiseks
    - Kalatsükli/GPS-i paigaldusplaat konsooli positsioonile
    - Putukate või elava vee kaevu valikud rentijatele ja kaubandusoperaatoritele
    - Jahuti/salvestus konfiguratsioonid saagi käsitlemiseks
    - Deep-V hull avamerevõimekuse jaoks — stabiilne paigal olles, sujuv sõidul
    - PVC või Hypalon toruvalikud — Hypalon UV pikemaajaline säritus
    - Välimootorid jäävad mudelist ja rakendusest vahemikku 15 HP kuni 115 HP
content_segments:
  tagline: Kalapüügiprofiilid
  title: Täispuhutava kalapaadi lahendused<br />Operaatori tüübi järgi
  subtitle: Alates rannikuäärsest spordikalapüügist kuni kommertsliku longline'ini — erinevad kalapüügitegevused nõuavad erinevaid kerekonfiguratsioone, võimsusvahemikke ja tekil olevaid lahendusi. Kohandame iga paadi vastavalt kalapüügile, vetele ja tööstiilile.
  items:
    - title: Kaubanduslikud kalapüügiettevõtted
      subtitle: Laevastiku tööpaadid igapäevaseks kalapüügiks, võrkude käsitlemiseks, saagitranspordiks
      description: Kaubanduslikud kalapüügiettevõtted opereerivad tööpaate võrkude paigaldamiseks ja kättesaamiseks, lõksude hoolduseks, pikaliini vedamiseks ja saagitranspordiks. Need paadid töötavad iga päev soolases veekeskkonnas ning peavad taluma suuri koormusi, pidevat tekkide käsitlemist ja pikki tööaegu. Kütusesäästlikkus ja madal hooldusvajadus on laevastiku kasumlikkuse seisukohalt kriitilise tähtsusega. Laev peab tagama stabiilsed tööplatvormid meeskonna varustuse ja saagi jaoks erinevates mereoludes.
      features:
        - Lame terrassi paigutus võrkude käsitlemiseks, lõksude virnastamiseks ja kalade hoiustamiseks
        - Kütusesäästlik 40-115 HP välimootor madalate päevakasutuskuludega
        - Tugevad Hypalon torud, mis tagavad igapäevases kasutuses hõõrdumiskindluse
        - Tugevdatud hõõrumisstrake'id sagedasteks dokkide ja laevade kontaktiks
        - Isepaduv tekk, mis tagab lihtsa pesu pärast operatsiooni
        - Laevastiku hinnad ja järjepidevad spetsifikatsioonid mitme laevaga operaatoritele
    - title: Charter-kalapüügi operaatorid
      subtitle: Mitme reisija mugavus, püügijuhitavus, ohutussertifikaat
      description: Operaatorid korraldavad poolpäevaseid ja täispäevaseid kalapüügireise — alates rannikuäärse korallrahu kalapüügist kuni avamerepõhja kalapüügini. Teie paat vajab reisijate istekohti koos ohutussertifikaatidega, rohkelt terrassiruumi mitmele kalamehele ning integreeritud elukaevu, et hoida sööda ja saagi värskena kogu reisi vältel. Külaliste mugavus mõjutab otseselt reiside arvustusi, korduvbroneeringuid ja veebipõhiseid hinnanguid.
      features:
        - Konsooliroolimine koos šoki neelavate korvistmetega
        - Tehases paigaldatud vardahoidjad (4–8 asendit)
        - 60–115 HP välimine ulatus avamere kruiisikiiruste jaoks
        - CE Kategooria C või B sertifitseerimine kommertsreisirongide jaoks
        - Bimini või T-top päikesevarju külaliste mugavuseks pikematel reisidel
    - title: Käsitöö- ja väikesemahulised kommertskalastajad
      subtitle: Usaldusväärsed tööpaadid igapäevaseks elatusvahendiks
      description: Iseseisvad kalamehed, kes sõltuvad oma paadist kui peamisest sissetulekuallikast — võrkude seadmine, kalapüüniste hooldamine või kaldale lähedal sõitmine. Sinu prioriteet on kütusesääst, lihtne hooldus, mida saad ise teha, ning paat, mis suudab toime tulla mõõduka koguse saagi ja varustusega, ilma stabiilsust ohverdamata.
      features:
        - Kütusesäästlik 15–40 HP välimootor madalate kasutuskuludega
        - Hypalon CSM torud UV pikendatud ja kulumiskindluse jaoks
        - Lameda terrassi paigutus võrkude käsitlemiseks ja kalade hoiustamiseks
        - Lihtne randa maandumine koos täispuhutava kiilukaitsega
    - title: Kalurikooperatiivid
      subtitle: Saagi kogumine, liikmete transport, tarnejaotus
      description: Kalurikooperatiivid haldavad kogukonnapõhiseid laevastikke, et koguda saaki liikmetelt kaluritelt, transportida tarneid kaugematesse kaluripäravatesse ja jaotada saak turgudele. Need tööpaatidel peab olema suur kandevõime, usaldusväärne igapäevane töö ja lihtne hooldamine kaugetes paikades. Kooperatiivid tegutsevad sageli arengumaades, kus varuosade kättesaadavus ja teenindus on piiratud, mistõttu on lihtne välismootori konfiguratsioon ja vastupidav ehitus hädavajalik.
      features:
        - Suur kandevõime saagi ja tarne veoks
        - Lihtne välismootori konfiguratsioon mugavaks kohapealseks hoolduseks
        - Tugev PVC või Hypalon konstruktsioon eelarve paindlikkuse jaoks
        - Tasane tekiga, kinnituspunkte kauba turvamiseks
        - Kütusesäästlik töö vähendamaks kooperatiivi tegevuskulusid
    - title: Spordi- ja harrastuskalurid
      subtitle: Jõudlus ja stiil tõsistele kaluritele
      description: Kogenud kalurid otsivad võimekat kalapaat, mis tagab kiiruse kaugetele jahipindadele, stabiilsed püsti püsingu võitluskohad ja esmaklassilise viimistluse. Paadil peab olema kodune tunne, olgu see siis kaks miili kaldast kaugusel riffile sõites või kaugete jõesuudmete tagavetes uurides.
      features:
        - Sügav-V RIB kere sujuvaks sõiduks lainetes
        - Kalaotsija/GPS kinnitusplaat konsoolil eeljuhtmedega
        - Söötja ja jahtluskast integreeritud tagaistme moodulisse
        - Kohandatud EVA tekivärviga, mis sobib paadi/toru graafikaga
    - title: Kalapakku ja ökoturismi operaatorid
      subtitle: Giiditud kalapüügi kogemused külastavatele kaluritele
      description: Giidid viivad väikeseid gruppe külastavatest kaluritest produktiivsetele kalapüügikohtadele — sageli kombineerides kalapüüki ökoturismi elementidega, nagu linnuvaatlus või mangroovide uurimine. Paadil peab olijatele tunduma kuiv ja mugav, kes ei ole harjunud väikeste paatidega, hõlpsa pardale tulemise ja vari valikuga.
      features:
        - Bimini katus või T-top kinnituspunktid tehases paigaldatud
        - Sujuv pardalemineku trepp hõlpsaks uuesti pardaleminekuks
        - Vaikne 4-taktiline välimootor häirimise vähendamiseks
        - Kuiv hoiustamisruum külaliste telefonide, rahakottide, kaamerate jaoks
