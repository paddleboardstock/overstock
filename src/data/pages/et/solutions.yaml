features3_solutions:
  tagline: Lahendused
  title: Teie veeseiklus<br />Äripartner
  isBeforeContent: false
  columns: 3
  items:
    - title: Veespordiklubid
      description: Täiskomplektseadmete paketid, kohandatud bränding ja hooldusprogrammid SUP klubidele, kanuutamis-, surfikoolidele ja treeningkeskustele.
      icon: tabler:users
      link: /solutions/clubs
    - title: Veespordid RIBs
      description: Eesmärgipäraselt loodud RIBs purjetamiskoolidele, veespordikeskustele ja sündmuste korraldajaile. Treenerpaadid, pukseerimispaadid ja järelevaatmispaadid professionaalseks veespordiks.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Kuurordid ja hotellid
      description: Premium-veespordiprogrammid koos laevastiku seadmete, turvasüsteemide, personali koolituse ja tulu haldamisega majutusasutustele.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Veebrändi ettevõtjad
      description: Era- või privaatmärgisega OEM/ODM tootmine madala MOQs kuluga, kohandatud toodete kujundus, pakendamine ja globaalne saatmine uutele brändiomanikele.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Sukeldumiskeskuse paadid
      description: Stabiilsed RIB platvormid lihtsa sisenemise/väljumise, seadmete hoiustamise ja sukeldumistoimingute jaoks optimeeritud mootoriseadistustega.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Pääste- ja hädaolukorra veesõidukid
      description: Kõrge kiirusega RIBs ja kummipaadid otsinguks ja päästmiseks, hädaolukorras reageerimiseks ja rannavalve teenistusse kuuluvad operatsioonid.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Jahtide neetrite lahendused
      description: Kompaktsed, stiilsed RIB neetrid, mis sobivad suurjahtide ja vaba aja paatidega. Lihtne hoiustamine, võimas jõudlus.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Kalapaatide lahendused
      description: Stabiilsed, vastupidavad kummipaadid ja RIBs, mis on kohandatud nii kutseliseks kui ka harrastuskalapüügiks.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Mereturismi seadmed
      description: Laevastikuks valmis täispuhutavad paadid, SUP lauad ja kajakid kuurortidele, turismiettevõtjatele ja veespordi rendiettevõtetele.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Avamere energia RIBs
      description: Tööstuslik RIBs nafta- ja gaasiplatvormide toetuseks, tuulepargi meeskonna transportimiseks, allveekaablite kontrolliks ja merelahenduste ehituseks.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Vesiviljeluse tööpaadid
      description: Korroosionikindel RIBs kalakasvatusseks, pärliviljeluseks ja ookeani farmide tarbeks. Hypalon torud, roostevabast terasest tarvikud, igapäevaseks kasutuseks vastupidav.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Mereteadus ja uuringud
      description: Stabiilne instrumendivalmis RIBs ookeanograafiliseks uurimiseks, keskkonna jälgimiseks, vee kvaliteedi proovivõtuks ja ülikoolide õpetusprogrammides.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kaubanduslikud tööpaadid
      description: Tööstuslik RIBs patrulliks, uuringuteks, transpordiks ja avamere logistikaks. Üles ehitatud kaubandusoperatsioonide karmide nõudmiste jaoks.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Ei ole kindel, milline tee sobib teie ärile?
  subtitle: Rääkige meile oma tegevusest — me soovitame õiget varustuse paketti, brändingu programmi või kohandatud lahendust.
  actions:
    - variant: primary
      text: Saage tasuta konsultatsioon
      href: /contact
