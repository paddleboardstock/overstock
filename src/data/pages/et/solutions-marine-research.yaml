content_challenge:
  tagline: Väljakutse
  title: Mereuuringute nõuded<br />Stabiilsed, instrumendiks valmis platvormid
  subtitle: Teaduslikel tööpaatidel peab olema stabiilne platvorm tundlike instrumentide jaoks, vaikne töö, et mitte häirida loodust, ja paindlik paigutus erinevate uurimisseadmete jaoks.
  paragraphs:
    - Mereuuringud ja keskkonnaseire nõuavad tööpaate, mis toimivad liikuvate laboritena. Erinevalt kaubanduslikest või vabaaja laevadest peab uurimisRIBs mahutama tundlikke elektroonilisi instrumente, vee- ja setteproovide võtu seadmeid, ning mõnikord ka elus proovide transporti — kõik see stabiilse platvormi säilitamise juures, et tagada täpsed andmed.
    - '**Platvormi stabiilsus on kriitiline** — Sonarid, kaikuvaadid ja CTD (juhtivus, temperatuur, sügavus) prohjektorid vajavad stabiilset kere nii paigal kui aeglasel kiirusel. Liigne laine või kere liikumine tekitab teadusandmetesse müra. Sügav-V kere hea stabiilsusega on hädavajalik.'
    - '**Instrumentide integreerimine** — Uurimislaevad vajavad kinnituskohad GPS-antennidele, sonar-transduceritele, proovivõtuvartele ja andmeregistreerimise seadmetele. Konsool peab mahutama mitmeid ekraane, instrumendi tarbeks elektrijaotust ja turvalist salvestust tundlikele elektroonikaseadmetele.'
    - '**Vaikne töö** — Merebioloogia uuringute ja keskkonnaseire jaoks võivad mootori müra ja kere vibratsioon hirmutada mereelustikku ning kahjustada käitumusvaatlusi. Uurimisrakendustele on olulised vaiksed välimootorite seadistused ja vähendatud vibratsiooniga kerekujundused.'
    - Paddle Board Overstock uurimisRIBs on loodud stabiilse kereplatvormi, integreeritud seadmete kinnitussüsteemide ja vaiksete välimootorite seadistusega teaduslikuks ja keskkonnaseire rakenduseks.
content_solution:
  tagline: Meie lahendus
  title: Eesmärgipõhised uurimisRIBs<br />Teaduse ja keskkonnatöö jaoks
  subtitle: Iga Paddle Board Overstock uurimisRIB on konfigureeritud stabiilseks, kohandatavaks platvormiks teaduslike instrumentide ja väljalabori seadmete jaoks.
  list:
    - Sügav-V klaaskiust kere, suurepärase stabiilsusega paigal ja aeglasel uuringukiirusel
    - Lame tekipaigutus seadmete kinnitusaladega sonarile, GPS-ile ja proovivõtuseadmetele
    - Konsool, mis on kohandatud mitme ekraani jaoks — plotter, kaikuvaade, andmeregistraator
    - 12V ja 24V lisavõimsuse jaotus teadusinstrumentidele
    - Vaikne neljataktiline välimootor — minimaalne vibratsioon ja müra loodusuuringuteks
    - Valikuline madala lainega kere disain, et andmekogumisel oleks võimalikult vähe häiritud
    - Kohandatud toruvärvid uurimisasutuste brändinguks ja pargi identifitseerimiseks
content_segments:
  tagline: Uurimisprofiilid
  title: Mereteaduse lahendused<br />Rakenduse tüübi järgi
  subtitle: Erinevatel uurimisrakendustel on unikaalsed laevanõuded — alates ülikooli õppeplatvormidest kuni keskkonnauuringute laevadeni ja veekvaliteedi RIBsjälgimiseni.
  items:
    - title: Ülikooli mereteaduste programmid
      subtitle: Õppeplatvormid, tudengite väljasõidud, rannikualade uurimistöö
      description: Mereteaduste ülikoolid ja okeanograafia osakonnad vajavad usaldusväärseid ja mitmekülgseid tööpaate välitööde õpetamiseks, tudengite uurimisprojektideks ja õppejõudude juhitud rannikualade uuringuteks. Paat peab olema lihtne juhtida tudengitele, piisavalt stabiilne praktiliste instrumentide kasutuselevõtuks ning piisavalt vastupidav, et kasutada sagedast kasutust mitme kasutaja poolt akadeemiliste semestrite jooksul. Eelarvepiirangud akadeemilistes tingimustes muudavad kulutõhususe ja madala hoolduskoormuse oluliseks kaalutluseks.
      features:
        - Stabiilne platvorm õpilaste instrumentide paigaldamiseks ja taastamiseks
        - Lihtne juhtimine — kuller- või ühe konsooli konfiguratsioon juhendatud õpilaste kasutamiseks
        - Hypalon Vastupidavad torud sagedasteks rannamaandumiseks ja õpilaste käsitlemiseks
        - Seadmete paigaldus õpetamistasemel sonari, secchi ketta ja proovivõtuseadmete jaoks
        - Kulutõhus PVC valik eelarvepiirangutega akadeemilistele programmidele
    - title: Mereuuringute instituudid
      subtitle: RIBs Mõõdistus koos instrumentide integreerimise, GPS-i, proovivõtuseadmetega
      description: Pühendunud mereuuringute organisatsioonid, mis viivad läbi rannikualade ja avamere uuringuid, vajavad professionaalselt seadistatud RIBs uuringuid integreeritud instrumentidega. Need laevad kannavad sonarisüsteeme batümeetriliseks kaardistamiseks, CTD-profileerijaid veesambade analüüsiks, setteproovivõtteid ja bioloogilist kogumisseadmeid. Paat peab pakkuma stabiilset platvormi aeglase mõõdistuskiirusega, omama piisavalt tekipaika seadmete paigaldamiseks ning pakkuma puhast 12V/24V voolutugevust elektroonikale.
      features:
        - Integreeritud sonar-anduri paigaldus — läbi kere või ahtri konfiguratsioon
        - GPS-antenni paigaldus ja konsooli integreerimine mõõdistustasemel navigeerimiseks
        - CTD ja veeproovivõtja paigaldusala koos turvaliste kinnituskohtadega
        - 12V/24V abivõimsuse jaotus instrumentidele ja andmelogijatele
        - Stabiilne aeglasel kiirusel (3–6 sõlme) mõõdistujoone täpsuse tagamiseks
        - Valikuline A-raam või davit raskemate proovivõtuseadmete paigaldamiseks
    - title: Keskkonnaseire ja looduskaitse
      subtitle: Ökoloogilised uuringud, loomade vaatlus, elupaikade hindamine
      description: Keskkonnavabaühendused, valitsusasutused ja looduskaitseorganisatsioonid viivad läbi mereökoloogilisi uuringuid, metsloomade populatsiooni jälgimist ja elupaikade hindamisi. Need operatsioonid nõuavad vaikseid ja madala mõjuga laevu, mis suudavad läheneda tundlikele elupaikadele ilma metsloomi häirimata. Paadidel tuleb kaasas kanda kaameraseadmeid, GPS-i transektide kaardistamiseks ning proovivõtuseadmeid vee ja setete kogumiseks. Madal lainetus- ja minimaalne mootorimüra on käitumuslike vaatlusuuringute jaoks kriitilise tähtsusega.
      features:
        - Vaikne neljataktiline välimootor — minimaalne häirimine mereelustikule
        - Stabiilne vaatlusplatvorm fotograafia ja videodokumentatsiooni jaoks
        - Kaamerarigide, GPS-jälgijate ja välisarvutite seadmete monteerimine
        - Madal süvis rannikuliste märgalade, mangroovide ja jõesuudmete juurde ligipääsuks
        - Kergesti puhastatavad tekid ja torupinnad, et desinfitseerida erinevate asukohtade vahel
    - title: Veekvaliteedi jälgimine ja testimine
      subtitle: Regulaarsed proovivõtud, saasteainete jälgimine, nõuetele vastavuse kontroll
      description: Veekvaliteeti jälgivad organisatsioonid teevad rannikualadel, sadamates ja siseveekogudel regulaarselt proovivõtukäike, et jälgida saastet, vetikate vohamist ja keskkonnaregulatsioonide täitmist. Need tegevused vajavad tõhusaid ja usaldusväärseid paate korduvateks külaskäikudeks fikseeritud proovivõtukohtadesse. Alusel peab olema proovivõtuseadmete, proovide säilituskülmikute ja välitestimiseks vajaliku varustuse mahutamise võimalus — tekke ja torupindade lihtne puhastamine asukohtade vahel, et vältida ristkontaminatsiooni.
      features:
        - Pühendatud proovivõtukoha ala koos külmkapi ja seadmete hoiustamise võimalusega
        - Kergesti puhastatav tekk ja torupinnad asukohtadevaheliseks desinfitseerimiseks
        - GPS-integreerimine täpseks tagasipöördumiseks fikseeritud koordinaatidele
        - Kompaktne suurus ligipääsuks piiratud veeteedele ja kitsastele kanalitele
        - Kütusesäästlik väände paat kulutõhusateks regulaarsed proovivõtukäikudeks
