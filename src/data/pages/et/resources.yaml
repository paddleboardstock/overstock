hero_text:
  tagline: Vahendid
  title: Allalaadimiskeskus ja ostjajuhtid
  subtitle: Juurdepääs tootekataloogidele, OEM juhenditele, ostja kontrollnimekirjadele ja tehnilisele dokumentatsioonile, mis aitavad teha teadlikke hangetega seotud otsuseid.
features3_downloads:
  tagline: Allalaadimisfailid
  title: Tootedokumentatsioon<br />ja ostjaressursid
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026. aasta meretoote kataloog
      description: Terve toodete valik, sealhulgas RIB paadid, kummipaadid, SUP lauad, kajakid ja lisaseadmed. Tehnilised andmed, konfiguratsioonid ja valikud. PDF-formaadis.
      icon: tabler:file-text
    - title: OEM tootmise juhend
      description: 'Kõik, mida peate teadma OEM/ODM partnerlussuhete kohta: protsessi ülevaade, minimaalsed tellimuse kogused, kohandamisvõimalused, kvaliteedikontroll ja saatmine.'
      icon: tabler:building-factory
    - title: RIB paadi ostja juhend
      description: 'Kuidas valida õiget RIB: kere materjalid, toru materjalid, mootori valik, suuruse kaalutlused ja konfiguratsioonivalikud erinevate rakenduste jaoks.'
      icon: tabler:file-description
    - title: SUP tarnija kontrollnimekiri
      description: 'Olulised kaalutlused SUP lauade tootja valimisel: kvaliteedi näitajad, sertifitseerimisnõuded, MOQ kaalutlused ja millele tähelepanu pöörata tehase auditi jooksul.'
      icon: tabler:clipboard-check
    - title: Kummipaadi materjali juhend
      description: 'PVC vs Hypalon: vastupidavuse, UV vastupanu, eluea, remondivõimaluste ja hinnakujunduse võrdlus erinevate mererakenduste jaoks.'
      icon: tabler:files
    - title: Kohandatud tootmise lühikirjelduse mall
      description: Laadige alla meie toodete lühikirjelduse mall. Täitke oma nõuded ja saatke see meile tagastamiseks sama nädala hinnapakkumise ja teostatavuse hindamise saamiseks.
      icon: tabler:template
faqs:
  title: Korduma kippuvad küsimused
  subtitle: Levinud küsimused meie toodete, tootmisprotsessi ja partnerlusmudeli kohta.
  columns: 2
  items:
    - title: Mis on minimaalne tellimuse kogus?
      description: MOQ sõltub tootekategooriast. RIB paadid algavad tavaliselt 10 ühikust ühiku kohta. SUP lauad 50 ühikust. Toote-spetsiifilise MOQ teabe saamiseks võtke ühendust meie müügimeeskonnaga.
      icon: tabler:help-circle
    - title: Kas ma saan enne tellimist proovitükke?
      description: Jah. Aquafarer pakub proovide tootmist hindamiseks enne masstootmist. Proovi maksumus on läbiräägitav ja sageli krediteeritakse see esimeses tootmistellimuses.
      icon: tabler:package
    - title: Millised maksetingimused on saadaval?
      description: Tavalised tingimused on 30% ettemaks tellimuse esitamisel, 70% enne saatmist. LC tingimused on saadaval kvalifitseeritud klientidele. Arregemendi arutamiseks võtke ühendust meie finantstiimiga.
      icon: tabler:currency-dollar
    - title: Kui kaua tootmine kestab?
      description: 'Tüüpilised tarneajad: RIB paadid 30-45 päeva, SUP lauad 20-30 päeva, kummipaadid 25-35 päeva. Kohandatud arendus lisab prototüüpimise jaoks 15-30 päeva.'
      icon: tabler:calendar-clock
    - title: Milliseid sertifikaate teie tooted omavad?
      description: CE sertifikaat EL-i turgude jaoks, USA rannavalve poolt heaks kiidetud tootmine, ISO kvaliteedisüsteem, BSCI nõuetele vastavus ja REACH materjalide vastavus.
      icon: tabler:certificate
    - title: Kas te pakute kohandatud pakendamist ja brändingut?
      description: Jah. Pakume kohandatud pakendamist teie logoga, värvidega ja brändi identiteediga. MOQ kohandatud pakendamise jaoks sõltub tootekategooriast.
      icon: tabler:color-swatch
cta:
  title: Kas vajate abi õige ressursi leidmisel?
  subtitle: Võtke meie meeskonnaga ühendust, et saada isikupärastatud juhiseid tootevaliku, OEM partnerluste või tehniliste spetsifikatsioonide kohta.
  actions:
    - variant: primary
      text: Võtke ühendust meie meeskonnaga
      href: /contact
