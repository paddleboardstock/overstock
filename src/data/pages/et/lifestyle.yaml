hero:
  tagline: Elustiil
  title: See Aquafarer<br />Elustiil
  subtitle: Loodud neile, kes elavad vee ääres — nädalavahetuse avastajatest kuni kommertsoperatsioonide tegijateni, kes sõltuvad oma varustusest iga päev.
values:
  - icon: 🌊
    title: Veest sündinud
    desc: Iga disain algab arusaamisest, kuidas vesi käitub. Me insenerime tingimuste piirist sissepoole — sest ookean on meie õpetaja, mitte meie töökohaks.
  - icon: 🔧
    title: Ehitatud kestma
    desc: Kõige jätkusuutlikum toode on see, mida ei ole vaja välja vahetada. Meretasemel materjalid, drop-stitch tuumad, mille hinnang on 15 PSI, ja õmblused, mis kestavad hooaja üle.
  - icon: 🏆
    title: Ligipääsetav disain
    desc: Veespordi ei tohiks olla luksus. Professionaalne jõudlus hinnaga, mis on mõistlik peredele, giididele ja väikestele operaatoritele — mitte ainult ärilisele laevastikule.
  - icon: 🌍
    title: Globaalne kogukond
    desc: 'Qingdao rannikutest kuni Euroopa järvedeni, Kagu-Aasia jõgedeni ja Ameerika lahtedeni – meie kliendid jagavad üht asja: armastust vee peal olemise vastu.'
  - icon: ♻️
    title: Vastutustundlik tootmine
    desc: CNC-optimeeritud paigutus vähendab materjalijääki alla 5%. Vastupidav konstruktsioon vähendab asendusperioode. Me ehitame pikaealisuseks, sest see on kõige jätkusuutlikum valik.
  - icon: 🤝
    title: Tugi, mis kestab
    desc: Kakskümmend aastat tagasi valmistatud hullud helistavad meile endiselt varuosade pärast. Meie garantiivastuse keskmine aeg on 24 tundi. Me ei kao pärast müüki — me oleme siin kogu toote eluaja jooksul.
