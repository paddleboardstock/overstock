hero:
  tagline: Veeuurimise teadmised
  title: Õppige
  subtitle: |
    Juhendid, õpetused ja põhjalikud ülevaated — kõik, mida vajad uurimiseks<br />
    Vesi enesekindlalt. Alates esimese SUP valimisest kuni täiustatud tehnikate omandamiseni.
  taglineSection: Teadmised iga sõudja jaoks. Algajast professionaalini.
featured:
  tagline: Esiletõstetud teemad
  title: Alusta oma õppe teekonda
  subtitle: Ükskõik, kas olete veesporti uus või soovite oma oskusi arendada, meie juhendid katavad teid.
  items:
    - title: SUP Põhitõed
      description: Kõik, mida algaja peab teadma — lauade tüübid, reketi suurused, asend ja esimesse päeva nõuanded.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Täispuhutav vs kõva laud
      description: Milline sobib teile? Me võrdleme kaasaskantavust, jõudlust, vastupidavust ja hinda kõrvuti.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Veeohutus
      description: Oluline ohutusalane teadmine, mis peaks olema igal aerutajal — ilm, päästevestid, enesepääste ja palju muud.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Materjalide juhend
      description: PVC vs Hypalon, drop-stitch tehnoloogia, eitaja hinnangud — saa aru, millest su varustus koosneb.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Suuruse juhend
      description: Leia õige lauapikkus, -laius ja -maht vastavalt oma kehakaalule, oskustele ja sõudmisstiilile.
      icon: tabler:ruler
      href: /size-guide
    - title: Vahepealsed tehnikad
      description: Tõsta oma sõudmist kõrgemale tasemele arenenud tõmmete, pööramistehnikate ja karevee käitlemise abil.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
