features3_what_we_build:
  title: Mida me ehitame
  subtitle: Fookustatud tootesari, mida me tunneme põhjalikult — ei mingit poolikut katset, ei mingit logode ümbermängimist.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB paadid
      description: Alumiinium-hull RIBs pikkusega 3,3 m kuni 7,5 m. Mõeldud patrulliks, sukeldumiseks, kalapüügiks ja perekasutuseks.
      icon: tabler:ship
    - title: Täispuhutavad paadid
      description: PVC ja Hypalon kerged kummipaatide paadid vahemikus 2,4 m kuni 4,2 m. Kerged, tugevad ja lihtsasti hoiustatavad.
      icon: tabler:speedboat
    - title: Superjahi tenderid
      description: Kompaktne, kõrgtehnoloogiline RIBs, eritellimusel valmistatud, et sobituda teie emalaeva välimusega.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksessuaarid
      description: Aerad, pumbad, katted, kuivikukotid, kütusepaagid ja elektroonika. Kõik sobitatud meie paatidega.
      icon: tabler:package
    - title: Paranda ja remondi
      description: Kohapealne toru asendamine, elektroonika uuendamine ja mootori täiendamine.
      icon: tabler:tool
    - title: Kohandatud ehitised
      description: Projektipõhine disain äriklientidele, teaduslikele ja sõjalistele klientidele.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Paadidisaini ja inseneritehnika arutelu
steps2_values:
  title: Meie väärtused
  subtitle: Kolm põhimõtet, mis on mõjutanud iga toodet alates esimesest päevast.
  items:
    - title: Ehita nagu kannaks see sinu perekonda
      description: Iga kere, keevitus ja kinniti koheldakse nagu kasutaksid seda meie enda pered.
      icon: tabler:heart
    - title: Enne müüki inseneerime
      description: Kui spetsifikatsioon on vale, muudame spetsifikatsiooni — mitte kunagi klienti.
      icon: tabler:settings
    - title: Toetus, mis ületab garantiiperioodi
      description: Kakskümmend aastat vanad katted helistavad meile endiselt varuosade järele ja me vastame ikka.
      icon: tabler:headset
steps2_milestones:
  title: Sündmused
  subtitle: Lühiversioon Aquafarer loost.
  isReversed: true
  items:
    - title: Asutatud ranniku töötubades
      description: Algatatud kahe laevaehitusinseneri poolt CNC saagimismasinaga ja kangekaelse ideega.
      icon: tabler:building-factory
    - title: Esimesed 1 000 kere tarnitud
      description: Saavutati seitsmendal aastal, peamiselt suusõnalise reklaami ja korduvate klientide kaudu.
      icon: tabler:circle-check
    - title: Rahvusvaheline ekspordiprogramm
      description: Saadetud nüüd 50+ riiki, kohalike toetuspartneritega viiel kontinendil.
      icon: tabler:world
    - title: Uus globaalne tegevusstruktuur
      description: 2026. aasta septembris kolis brändi tegevus Qingdao Vatrad Grupi juurest Aquafarer LLC-sse (New Mexico, USA); Qingdao tootmiskeskus jätkab teadus- ja arendustegevust, tootmist ja tehase otsest eksporti.
      icon: tabler:building-skyscraper
features2_locations:
  title: Meie asukohad
  tagline: Leia meid
  columns: 3
  items:
    - title: Peakorter ja töötuba
      description: Ranniku tööstuspark, hoone 4 — avatud E–R, külastusteks ainult eelneva kokkuleppe alusel.
    - title: EL teeninduskeskus
      description: Vahemere sadam — renoveerimine, remont ja garantiiteenindus Euroopa klientidele.
    - title: APAC partnerlusvõrk
      description: Volitatud teeninduspartnerid Austraalias, Jaapanis, Singapuris ja Hongkongis.
brand_hub_tagline: Bränd
brand_hub_title: Avasta meie bränd
brand_hub_subtitle: Uuri põhjalikumalt meie mereinseneri oskusi, globaalse kohalolu ja põhimõtteid, mis meid juhivad.
brand_hub_cards:
  - title: Mereekspertiis
    desc: Kümneid aastaid materjaliteadust, täppistoiminguid ja reaalse maailma teste — alates PVC/Hypalon töötlemisest kuni sügava V kere ja drop-stitch tehnoloogiani.
    link: /brand-marine-expertise
    link_label: Loe rohkem →
  - title: Globaalne kohalolu
    desc: Saadame kaupa meie Qingdao keskuse kaudu 50+ riiki koos volitatud teenusepartneritega üle Euroopa, Aasia-Vaikse ookeani piirkonna ja Ameerikate.
    link: /brand-global-presence
    link_label: Loe rohkem →
  - title: Miks Aquafarer
    desc: Vertikaalne integratsioon, topeltsertifitseerimine (ISO 9001 + BSCI), CE vastavus ja madal MOQs — loodud brändidele, distributooridele ja valitsusasutustele.
    link: /brand-why-aquafarer
    link_label: Loe rohkem →
production_section:
  tagline: Tootmise Tipptase
  title: Tagades suurepärase käsitööoskuse
  description: Aquafarer tootmisliin on pühendatud kvaliteetsete, vastupidavate ja kõrge jõudlusega kummipaadi toodete valmistamisele.
  cards:
    - title: Kogenud tehnikute meeskond
      items:
        - Professionaalne teadmine PVC, Hypalon ja merematerjalide alal
        - Täpset käsitööd lõikamisel, liimimisel ja lisade paigaldamisel
        - Jätkuv koolitus uusimate tootmistehnoloogiate valdamiseks
    - title: Arenenud tootmisseadmed
      items:
        - CNC lõikeseadmed täpseks kangalõikamiseks minimaalsete vigadega
        - Kõrgtäpne kuuma/külma liimimine õhukindlate ja vastupidavate õmbluste jaoks
        - Professionaalne õhutiheduse ja tõmbetugevuse testimise seadmed
    - title: Täiustatud juhtimissüsteem
      items:
        - Standardiseeritud tootmisprotsessid selgete kvaliteedistandarditega
        - Lean-tootmise filosoofia, mis vähendab jäätmeid ja parandab tõhusust
        - Tõhus tarneahela juhtimine usaldusväärsete tarnijasuhetega
    - title: Range kvaliteedikontroll
      items:
        - sertifitseeritud kvaliteedijuhtimissüsteem
        - 'Mitmeastmeline kontroll: tooraine, protsessi käigus, lõplik väljaminev'
        - Range õhukindluse ja vastupidavuse testimine enne saatmist
global_ops_section:
  tagline: Globaalne operatsioonide arhitektuur
  title_html: Üks bränd,<span class="text-white/90">kaks sõlmpunkti</span>
  description_html: Alates 2026. aasta septembrist on Aquafarer opereerinud<strong class="text-white">Aquafarer OÜ</strong>(New Mexico, USA) — globaalne üksus jaotuse, kaubandusliku B2B müügi, lepingute, arvelduse ja järelturu teeninduse jaoks. Teadus- ja arendustegevus, tootmine ja kvaliteedikontroll jäävad<strong class="text-white">Aquafarer Qingdao tootmiskeskus</strong>, mis tarnib iga tellimuse otse tehases, FOB Qingdao. Üleminek muutis seda, kes teie lepingule alla kirjutab — mitte seda, kes teie paadi ehitab.
  stats:
    - value: 2,400+
      label: Hulls tarniti üle kogu maailma
    - value: 50+
      label: Riigid eksportisid
    - value: 10+
      label: Tootmisaastad
