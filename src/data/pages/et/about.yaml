    alt: Aquafarer tehas ja töökojad
  title: |
    Meretehnika<br />
    ehitas<span class="text-accent dark:text-white">Aquafarer</span>tee
  subtitle: 'Me alustasime ranniku töötuppa ühe paadiga ja kõva veendumusega: mereprodukte tuleks valmistada nii, nagu need oleksid olulised, sest need on tõesti olulised. Täna saadame tooteid üle 50 riiki, kuid iga kere läbib endiselt samu käsi, mis ettevõtte alustasid.'
