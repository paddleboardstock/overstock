hero:
  tagline: Juhendid
  title: Kas uus SUP kasutaja?
  subtitle: Praktilised juhendid, mis aitavad teil täispuhutavaid veespordivahendeid valida, kasutada ja nautida.
size_guide:
  tagline: Suurus ja spetsifikatsioonid
  title: Leia oma vajadustele sobiv suurus
  desc: Võrdle toote mõõtmeid, kandevõimet ja soovitatud kasutusviise. Olenemata sellest, kas vajad tuurimist SUP, kompaktset kajakki või kommertstoote RIB — meie suuruse juhend aitab valida õige suuruse.
  link_label: Täielik suuruse juhend koos toodete spetsifikatsioonidega →
  link: /size-guide
  cards:
    - title: SUP Tahvlid
      desc: Vali pikkus oma kaalu ja kavandatud kasutuse põhjal. Laiemad lauad (32"+) pakuvad rohkem stabiilsust. Pikemad lauad (11–12 ft) kulgevad paremini tuurimiseks.
    - title: Kajakid
      desc: Üksikkajakid (9 ft) üksi reisimiseks ja jõgedele. Kahekohalised kajakid (12 ft) kahe sõudja jaoks või ühega koos varustusega. Kontrolli alati kandevõimet.
    - title: Paadid & RIBs
      desc: Vali pikkus reisijate arvu ja kasutuse järgi. Suuremad RIBs (4,5 m+) avameres ja päästetöödeks. Väiksemad paadid (2,7 m) abipaadina ja kalaplatvormidena.
