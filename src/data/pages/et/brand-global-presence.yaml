hero:
  tagline: Globaalne kohalolek
  title: Teenindame 50+ riiki<br />Üle kogu mandri
  subtitle: Alates Euroopa rannikupatrullide operaatoritest kuni Austraalia veespordi jaemüüjateni ning Lähis-Ida päästemeeskondadeni — Aquafarer paadid on vee peal kogu maailmas.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer globaalse merevarustuse tootmine ja jaotamine
stats:
  title: Globaalne ulatus
  stats:
    - title: Riigid
      amount: 50+
    - title: Eksportturud
      amount: Euroopa, Ameerikad, Aasia, Lähis-Ida, Okeaania
    - title: Tootmine
      amount: Qingdao, Hiina
    - title: USA laoplats
      amount: Montclair, CA
features3_markets:
  tagline: Peamised turud
  title: Regionaalne ekspertteadmised<br />kohalike nõudmiste jaoks
  subtitle: Mõistame, et erinevatel turgudel on erinevad regulatiivsed nõuded, eelistused ja kasutusjuhud.
  isBeforeContent: false
  columns: 4
  items:
    - title: Euroopa & Suurbritannia
      description: CE-sertifikaadiga tooted, mis vastavad EN ISO 6185 standarditele. Euroopa Liidu turgudel on tugev nõudlus RIBs, kummipaadid ja SUP lauad. Suurbritannia jaemüüjad hindavad meie kiiret tarneaega.
      icon: tabler:map-pin
    - title: Põhja-Ameerika
      description: USA rannavalve poolt heaks kiidetud tootmine. USA laoplats Montclair, CA-l kiireks Lääneranniku tarneks. Kasvav nõudlus kalapaatide, päästepaadide ja vabaaja SUPs järele.
      icon: tabler:map-pin
    - title: Austraalia & Okeaania
      description: Tugev turg RIB paatidele ja kummitenderitele. Austraalia jaemüüjad hindavad meie Hypalon paate UV vastupidavuse tõttu karmides päikese tingimustes. Kiire saatmine meie Aasia tootmisüksusest.
      icon: tabler:map-pin
    - title: Lähis-Ida
      description: Kasvav nõudlus patrulli- ja päästepaatide järele. Meie alumiiniumkerega RIBs on populaarsed rannavalve ja turvaooperatsioonide operaatorite seas. Kohandatud konfiguratsioonid kõrge temperatuuri keskkondades.
      icon: tabler:map-pin
features3_distribution:
  tagline: Jaotusvõrk
  title: Koostöö jaemüüjatega<br />Üle kogu maailma
  subtitle: Töötame koos tunnustatud merevarustuse jaemüüjate, OEM kaubamärkide ja valitsuse hanketeenistustega.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerlused
      description: Privaatmärgi tootmine ülemaailmsetele veespordi kaubamärkidele. Meie hoolitseme kõige eest alates disainist kuni tootmise ja otsetarneeni.
      icon: tabler:building
    - title: Jaemüüjate võrgustik
      description: Volitatud jaemüüjad 20+ riigis hoiavad laoseisu ja pakuvad kohalikku tuge. Uued jaemüüjate päringud on teretulnud.
      icon: tabler:users
    - title: Valitsus ja institutsionaalne
      description: Otsetarne rannavalvele, otsingu- ja päästeteenistustele ning sõjaväe hangete programmidele. Kooskõla institutsionaalsete hangete nõuetega.
      icon: tabler:building-community
steps2_logistics:
  title: Globaalne logistika ja tugi
  subtitle: Tööstusest sihtkohta — me haldame kogu tarneahelat.
  items:
    - title: Saatmisvõimalused
      description: Meretransport (FOB Qingdao), õhutransport kiirete tellimuste jaoks ja kiirkuller proovide ja varuosade jaoks.
      icon: tabler:truck-delivery
    - title: USA laoplats
      description: 'Varud hoitakse Montclairis, Californias kiireks kohaletoimetamiseks kogu Põhja-Ameerikas. Läänerannik: 2-3 päeva, Keskosa: 3-4 päeva, Idarannik: 4-5 päeva.'
      icon: tabler:building-warehouse
    - title: Varuosad
      description: Aastaringi laos olevad ehtsad Aquafarer varuosad ja tarvikud. Levinud varuosad saadetakse 24 tunni jooksul.
      icon: tabler:package
    - title: Tehniline tugi
      description: Otseühendus meie inseneritiimiga tehniliste küsimuste, remondinõu ja ümberseadistamise toe jaoks. Toetame paate, mille ehitasime 20 aastat tagasi.
      icon: tabler:headset
cta:
  title: Kas soovite saada turustajaks?
  subtitle: Me laiendame aktiivselt oma jaotuskogumit. Võtke ühendust meie ekspordimeeskonnaga, et arutada partnerlusvõimalusi.
  actions:
    - variant: primary
      text: Partnerluspäring
      href: /contact
    - text: Vaadake meie tootevalikut
      href: /products
