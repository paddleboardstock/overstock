hero:
  tagline: Tehase audit ja tõendid
  title: Tehase auditi ettevalmistus<br />& Kvaliteetsed tõendid
  subtitle: Kõike B2B , mida ostjad kontrollivad tehasekülastuse ajal — alates tootmise autentsusest ja vastavusdokumentatsioonist kuni tootmise jälgitavuse ja kvaliteedikontrolli süsteemideni. Auditivalmis, iga päev.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer Tehase auditi ettevalmistus ja kvaliteeditõendid
direct_answer: Aquafarer haldab auditiks valmis 12 000 m² suurust Qingdao rajatist, kus on dokumenteeritud kvaliteedikontrolli protsessid, materjalide jälgitavus, HIN-taseme tootmisandmed ja vastavusdokumentatsioon iga kere kohta. Kohapealsed ja virtuaalsed tehaseekskursioonid on saadaval kvalifitseeritud ostjatele.
stats:
  - value: 12,000 m²
