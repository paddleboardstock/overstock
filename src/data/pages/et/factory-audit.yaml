  - value: 6
    label: Tootmisliinid
    detail: Pühendatud RIB, SIB, SUP liinid
  - value: 100%
    label: Rõhutestimine
    detail: Iga ühik, 1,25x / 24-48h
  - value: HIN
    label: Kere järgi jälgitavus
    detail: Täielikud partiist tarnimiseni kirjed
content_priorities:
  tagline: Mida kliendid kontrollivad
  title: 8 asja, mida ostjad kontrollivad<br />igal tehasekülastusel
  subtitle: 50+ riigi ostja tagasiside põhjal on need kaheksa prioriteeti, mida kliendid hindavad enne B2B tellimuse esitamist.
  items:
    - title: Tõeline tootja
      description: 'Kas sa oled tegelik tehas, mitte kaubandusettevõte? Ostjad kontrollivad: äriüksus, päris tootmisseadmed, töötajad, kes kasutavad masinaid, praegused tootmistellimused põrandal ja veebilehe ja töökoja järjepidevus.'
      icon: tabler:building-factory
    - title: Toote sobivus rakenduseks
      description: Kas need RIB sobivad nende konkreetse kasutusjuhtumiga? Kuurordi-, pääste-, sukeldumis-, kalapüügi- ja patrulloperaatoritel on põhimõtteliselt erinevad nõuded. Ostjad hindavad eksponeeritud paadi tekipaigutust, toru materjali ja varustuse valikuid.
      icon: tabler:target
    - title: Kvaliteedi stabiilsus ja korduvus
      description: Kas 50. üksus on sama hea kui esimene? Ostjad kontrollivad kvaliteedikontrolli süsteeme, protsessis olevaid kontrollpunkte, mittevastavuse käsitlemist ja paluvad näha mitme tootmise kirjeid, et kontrollida järjepidevust.
      icon: tabler:repeat
    - title: Vastavusdokumendi autentsus
      description: Kas CE sertifikaadid on mudelispetsiifilised? Kas DoC on allkirjastatud päris inimese poolt? Kas vastavust saab kontrollida kere numbri alusel? Ostjad kontrollivad üldist nõudeid võrreldes mudelispetsiifilise dokumentatsiooniga.
      icon: tabler:file-certificate
    - title: Kohandamise täitmine
      description: Kas tehas suudab tegelikult tarnida kohandatud konfiguratsioone? Ostjad otsivad tõendeid varasemate eritellimusprojektide kohta, prototüüpide näidiseid, insenerijooniseid ja võimalust kohapeal tehnilisi muudatusi arutada.
      icon: tabler:adjustments
    - title: Tarneaeg ja mahutavus
      description: 'Kas tsiteeritud ajakavad on realistlikud? Ostjad hindavad: praegust tootmismahtu, saadaolevat võimsust, tööjõu suurust, materjalide varusid ning kas tehases on tootmisplaneerimise süsteem.'
      icon: tabler:clock
    - title: Hind ja kaubandustingimused
      description: 'Kas hinnad on läbipaistvad? Kas FOB hinnad on selged? Ostjad kontrollivad: ühikuhinna jaotust, tööriistade kulusid, pakendamiskulusid ning seda, kas tehas suudab DDP käsitleda või CIF tingimusi õige ekspordidokumentatsiooniga.'
      icon: tabler:currency-dollar
    - title: Järelmüük ja varuosad
      description: 'Mis juhtub pärast kohaletoimetamist? Ostjad hindavad: varuosade saadavust, garantiiprotsessi, toruosade vahetust, ventiilide vahetust ning kas tehasel on dokumenteeritud järelmüügi protokoll.'
      icon: tabler:headset
content_tour:
  tagline: Tehase ekskursiooni marsruut
  title: Auditituur —<br />Mida sa näed
  subtitle: Meie tavapärane tehase ekskursioon järgib kindlat marsruuti, mis vastab ostjate küsimustele igas jaamas.
  items:
    - title: 1. Koosolekuruum — ettevõtte tutvustus
      description: Ärilitsents, ISO 9001 ja BSCI sertifikaadid, ekspordiload ning ettevõtte ajalugu. Kiire ülevaade tootmisvõimekusest ja vastavuse ulatusest.
      icon: tabler:users
    - title: 2. Tooraine ladu — IQC jaam
      description: Sissetulevate materjalide kontrolli andmed, kangapartii sertifikaadid, liimid ja riistvaraproovid. Vaata, kuidas materjale enne tootmisse minekut testitakse.
      icon: tabler:building-warehouse
    - title: 3. Torude valmistamine — RF-keevitus ja käsitsi liimimine
      description: Elava toru keevitus- või liimimisprotsessi, õmblustugevuse testide demonstratsioonid ja ventiilide paigaldus. Jälgi kambri kaupa ehitust ja kvaliteedikontrollpunkte.
      icon: tabler:flame
    - title: 4. Kere lamineerimine — GRP töökoda
      description: Klaaskiust ladestumise protsess, geelikate pealekandmine ja kere kõvenemine. Vaata erinevate mudelite lamineerimisgraafikut ja konstruktsiooni RIB tugevdamist.
      icon: tabler:layers-subtract
    - title: 5. Kokkupanek ja integreerimine
      description: Kere-toru ühendamine, konsooli ja istme paigaldus, elektri- ja kütusesüsteemi integreerimine ning seadmete paigaldamine. Jälgi tootmisliini töös.
      icon: tabler:tool
    - title: 6. Rõhutestimisjaam
      description: 24–48h rõhu hoidmise test 1,25x nimirõhuga. Vaata testi andmeid, rõhunäidikuid ja läbipääsu/ebaõnnestumise kriteeriume. Vaata, kuidas testitulemused on seotud kere seerianumbritega.
      icon: tabler:gauge
    - title: 7. Lõplik kontroll ja kvaliteedikontroll
      description: 100-punktiline kvaliteedikontrollnimekiri ühiku kohta, mõõtmete kontrolli, kosmeetiline kontroll ja pakendi terviklikkuse kontroll. Vaata üle mittevastavuse logid ja parandustegevuste kirjed.
      icon: tabler:clipboard-check
    - title: 8. Dokumentide ülevaatusruum
      description: Vastavusdokumentatsioon mudeli kohta (DoC, ehitaja plaat, kasutusjuhend), tootmise jälgitavuse kirjed, HIN register ja materjalipartiide jälgimise andmebaasi demonstratsioon.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvaliteetsed tõendid
  title: 8-astmeline kvaliteedikontrolli kett<br />— Kontrollitav igal sammul
  subtitle: Meie kvaliteedikontrolli ahel ulatub saabuvatest materjalidest kuni lõpliku saadetiseni ning igas etapis on dokumenteeritud tõendid.
  items:
    - title: '1. etapp: Sissetulevate materjalide kontroll'
      description: Iga PVC, Hypalon, klaaskiud, alumiinium, liimid ja tarvikute partii testitakse spetsifikatsioonide järgi enne tootmisse sisenemist. Tõmbetugevus, katte kleepumine ja mõõtude kontroll AQL 2.5/ISO 2859 kohaselt.
      icon: tabler:package
    - title: '2. etapp: Toru keevitamise / liimimise QC'
      description: Õmbluse koorumise tugevuse testimine tootmispalgi kohta. RF-keevitusparameetreid jälgitakse ja dokumenteeritakse. Käsitsi liimitud õmblusi kontrollitakse liimi ühtlase katvuse ja kõvenemisaja osas.
      icon: tabler:flame
    - title: '3. etapp: Kere lamineerimise QC'
      description: Geelkatte paksuse mõõtmine, klaaskiudude paigaldamise kontroll vastavalt laminaadi ajakavale ja kõvenemisaja jälgimine. Struktuurilise tugevduse positsioonid kontrollitakse insenerijooniste järgi.
      icon: tabler:layers-subtract
    - title: '4. etapp: Komplekteerimise ja integratsiooni QC'
      description: Kere-toru ühenduse terviklikkus, konsooli ja istekoha kinnitusmomendi kontroll, elektriline pidevus ja kütusesüsteemi lekke test. Iga paigalduspunkt kontrollitakse mudelispetsiifilise komplekteerimisnimekirja järgi.
      icon: tabler:tool
    - title: '5. etapp: Rõhukindluse test'
      description: Iga täispuhutav kamber pressuriseeritakse 1,25x nominaalrõhuni PSI ja hoitakse 24–48 tundi. Rõhukaotus registreeritakse iga kamber kohta. Lävi dokumenteeritud. Lingitud kere seerianumbriga.
      icon: tabler:gauge
    - title: '6. etapp: Lõplik kontroll'
      description: 100-punktine kvaliteedikontroll, mis hõlmab mõõtmete täpsust, välimuse kvaliteeti, lisavarustuse komplektsust, dokumentatsioonipaketti ja pakendi terviklikkust. Sõltumatu tootmismeeskonnast.
      icon: tabler:clipboard-check
    - title: '7. etapp: Vastavusdokumentatsioon'
      description: Mudeli-spetsiifiline DoC, tootjaplaadi kontroll, kasutusjuhendi täiuslikkus ja HIN registrisse kande kontroll. Kõik vastavusdokumendid valmistatakse ette ja kontrollitakse enne saatmise vabastamist.
      icon: tabler:file-certificate
    - title: '8. etapp: Saatmise vabastamine ja jälgitavus'
      description: Lõplik vabastamine nõuab kõigi QC-etappide läbimist, vastavusdokumentatsiooni täielikkust ja saatmisdokumentide kontrollimist. Kere aruanne suletakse ja arhiveeritakse 10+ aastaks.
      icon: tabler:truck
content_traceability:
  tagline: Tootmise jälgitavus
  title: HIN → peafail →<br />Kere aruanne → kohaletoimetamine
  subtitle: Igal RIB paadil on ainulaadne kere identifitseerimisnumber, mis on seotud täieliku tootmise ja vastavusrekordite ahelaga.
  items:
    - title: Kere identifitseerimisnumber (HIN)
      description: 14-kohaline ainulaadne identifikaator, mis on püsivalt märgitud iga paadi külge. Koodistatakse tootja kood (MIC), mudeli tähis, tootmisaasta ja seerianumber. Võti, mis avab kogu jälgitavusahela.
      icon: tabler:hash
    - title: Peamine tehniline fail
      description: Mudelifamilie vastavus- ja inseneridokumentatsioon. Sisaldab GA jooniseid, riskihindamist, stabiilsuse arvutusi, materjalispetsifikatsioone ja kehtivaid standardeid. Lingitud kõigi selle mudeli keredega.
      icon: tabler:folder
    - title: Individuaalne kere aruanne
      description: 'Kere-põhine tootmisaruanne: HIN, tootmiskuupäev, toru partii, materjalitunnistused, rõhu testi tulemus, lõplik konfiguratsioon, mootori spetsifikatsioon, kvaliteedikontrolli tulemused ja kohaletoimetamise sihtkoht. 21+ andmevälja kere kohta.'
      icon: tabler:file-description
    - title: Kliendivastavuse pakett
      description: Kere-põhine kohaletoimetamise pakett, mis sisaldab DoC, tootjaplaadi fotot, kasutusjuhendit, vastavuskontrolli nimekirja ja lõplikku konfiguratsioonilehte. Saadetakse paadiga ja arhiveeritakse tehases 10+ aastaks.
      icon: tabler:package
content_red_flags:
  tagline: Auditimise ohud
  title: Hoiatusmärgid ostjatele<br />Lihtne märgata
  subtitle: Tavalised probleemid, mis vähendavad ostjate usaldust tehase auditi ajal. Me tegeleme iga probleemiga proaktiivselt.
  items:
    - title: Üldised CE nõuded ilma mudeli ulatuseta
      description: '"Kõik tooted CE sertifitseeritud" ilma, et täpsustataks, millise direktiivi, milliste mudelite ja millise vastavusmooduliga. Punane lipp: viitab sellele, et vastavus on pinnapealne, mitte mudeli või konfiguratsiooni järgi.'
      icon: tabler:alert-triangle
    - title: Füüsilise testimise tõendite puudumine
      description: 'Survetesti nõuded ilma testikirjete, mõõteriistade või tehasepinnal nähtava testijaamaga. Punane lipp: kvaliteedisoodused ei ole auditi ajal kontrollitavad.'
      icon: tabler:alert-triangle
    - title: Materjalide jälgitavuse puudumine
      description: 'Puuduvad partiiarvestused, saabumise kontroll või link materjalide sertifikaatide ja lõpptoodete vahel. Punane lipp: kvaliteediprobleeme ei saa jälitada allikani.'
      icon: tabler:alert-triangle
    - title: Üldised dokumentatsioonid
      description: 'Üks DoC kõigi mudelite kohta, puuduvad HIN-spetsiifilised kirjed või "mall" vastavusdokumentatsioon. Punane lipp: vastavus ei ole seotud üksikute tootmisüksustega.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Saatmine ja pakendamine
  title: RIB Paadi konteiner<br />Laadimine ja kastimine
  subtitle: Meie saatmislahendused kaitsevad teie investeeringut Qingdaost sihtsadamani. Iga mudeli jaoks on saadaval konteineri laadimisplaanid ja kastimise spetsifikatsioonid.
  items:
    - title: 20 jala konteineri konfiguratsioonid
      description: 'Standardne 20 jala konteiner: 1-2 RIB paati (4,0-5,5 m), deck ja torud eraldi, või 8-12 SUP lauda. Segatud RIB + SUP konfiguratsioonid saadaval. Üksikasjalik laadimisplaan antakse iga tellimuse kohta.'
      icon: tabler:box
    - title: 40 jala konteineri konfiguratsioonid
      description: 'Standardne 40 jala konteiner: 2-4 RIB paati (kuni 7,0 m) koos kerepesade ja torude kuhjamisega, või 20-30 SUP lauda. 40 jala HQ saadaval kõrgemate RIB mudelite jaoks. Mahuefektiivne pakkimine vähendab ühiku saatmiskulu.'
      icon: tabler:container
    - title: Puidust kastid RIB kestadele
      description: Alumiinium- ja GRP-kestad pandud spetsiaalselt sobitatud puidust kastidesse vahtpolstri, niiskustõkke ja terastihendusega. Kasti mõõtmed ja kaal mudeli kohta saadaval logistika planeerimiseks. ISPM-15 kuumtöödeldud puidu sertifikaat on kaasas.
      icon: tabler:wood
    - title: Torude ja deki eraldi pakkimine
      description: Torud tühjendatud ja volditud eraldi kestadest ruumisäästlikkuse tõttu. Dekikatted, kontsoolid ja istmed pakitud kaitsvasse pakkimisse koos paigaldustarvikute komplektiga. Kokkusobitamise juhised kaasas iga saadetisega.
      icon: tabler:package
    - title: Niiskuse ja korrosioonikaitse
      description: VCI anti-korrosioonipaber alumiiniumkomponentidele, ränidioksiid-pikkuskotid ja vaakumiga suletud tarvikupakid. Takistab kondensatsioonikahjustusi 30-45-päevase mereveo ajal.
      icon: tabler:droplet-off
    - title: FOB Qingdao dokumentatsioon
      description: Koormusleht, kaubaarve, pakendamisnimekiri, päritolutunnistus ja vastavusdokumentatsioon iga saadetise kohta. FCL ja LCL konsolideerimine saadaval. Tollidokumentide tugi ELi, USA ja Lähis-Ida turgude jaoks.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Kontrollitõendid
  title: Audiititõendid<br />Saate kohapeal kontrollida
  subtitle: Tehasekülastuste ajal saavad kliendid kontrollida konkreetseid tõendeid igas tootmisalas. Siin on, mida otsida — ja mida me iga auditi jaoks ette valmistame.
  areas:
    - area: Toorainete ladu
      what_to_verify: Kas materjalid on stabiilsed? Kas toimub partii segamine?
      evidence: Sissetuleku kontrolli andmed, partii sildid, FIFO ladustamine, tarnija heakskiidunimekiri, materjali sertifikaadid (PVC, Hypalon, klaaskiud, alumiinium, liimid, riistvara)
      icon: tabler:building-warehouse
    - area: Torutootmine
      what_to_verify: Kuidas tagatakse õmbluse tugevus ja õhutihedus?
      evidence: Protsessikaardid, esimese toote kinnitamine, survetestide andmed per kamber, paranduste ja uuesti testimise logid, ventiili paigaldamise andmed
      icon: tabler:flame
    - area: Kere tootmine
      what_to_verify: Kuidas kontrollitakse struktuuri järjepidevust?
      evidence: Juhtprotsessidokumentatsioon, kvaliteedikontrollpunktid, pooltoodangu numbrite määramine, geelkihi paksuse mõõtmised, laminaadi ajakava kinnitamine
      icon: tabler:layers-subtract
    - area: Koostimisala
      what_to_verify: Kuidas tagatakse, et valikulisi osi ei monteerita valesti?
      evidence: BOM, töökorraldused, konfiguratsioonikontrollnimekirjad, tööjaama kontrollkaardid, pöördemomendi ja funktsionaalsuse kontrollid per mudel
      icon: tabler:tool
    - area: Testimise jaam
      what_to_verify: Kuidas kinnitada enne tarnimist, et paat on korras?
      evidence: Testimenetlused, instrumendiloend, kalibreerimise andmed, survetestide logid (1,25x / 24-48h), funktsionaalse testimise kontrollnimekirjad, dokumenteeritud läbitud/ebaõnnestunud kriteeriumid
      icon: tabler:gauge
    - area: Mittesobivuse ala
      what_to_verify: Kuidas käsitletakse defekte?
      evidence: Isolatsiooni sildid, NCR logid, algpõhjuse analüüs, uuesti töötluse heakskiidudokumendid, CAPA (korrektiiv- ja ennetusmeetmete) jälgimine
      icon: tabler:alert-triangle
    - area: Valmistoodete ladu
      what_to_verify: Kuidas vältida vale saatmist ja kahjustusi?
      evidence: Valmistoodete sildid, tellimuste kokkuvõtmise andmed, pakendamiskriteeriumid, enne saatmist tehtud kontrolli andmed
      icon: tabler:box
    - area: Varuosad ja järelmüük
      what_to_verify: Kas saate toetada pikaajalist järelmüüki?
      evidence: Tavaliste varuosade nimekiri, inventuuri strateegia, osade nummerdamise süsteem, garantiiprotsessi dokumentatsioon, hooldusjuhendid
      icon: tabler:headset
content_closing_script:
  tagline: Auditi tellimine
  title: Tehase külastusest<br />Kinnitatud projektini
  subtitle: Edukas audit ei tohiks lõppeda ainult fotode ja käepigistusega. Enne lahkumist tagame, et kolm kaubanduslikku tulemust on dokumenteeritud.
  items:
    - title: Kinnitage tehniline konfiguratsioon
      description: Leppige kokku mudel, rakendus, võtmevalikud, sihtturg, hinnanguline kogus ja tarneaeg — kõik dokumenteeritud enne lahkumist.
      icon: tabler:checklist
    - title: Kinnitage järgmise sammu dokumendid
      description: 'Määratle, mis Aquafarer järgmisena pakub: muudetud GA, konfiguratsiooniloend, hinnapakkumine, dokumendikontrollnimekiri, näidisplaan või NDA — konkreetsete ajakavadega.'
      icon: tabler:file-plus
    - title: Kinnita vastastikuse ajajoone
      description: Muudetud konfiguratsioon ja esialgne hinnapakkumine 3 tööpäeva jooksul. Proovi või välimuse kinnitus 7 päeva jooksul. Inseneriülevaatus või kolmanda osapoole kontroll 14 päeva jooksul. Järgmise kohtumise kuupäev ja vastutavad osapooled lukustatud.
      icon: tabler:calendar
faq:
  title: Tehase audit — korduma kippuvad küsimused
  questions:
    - q: Kas ma võin tehast isiklikult külastada?
      a: Jah. Tervitame kohapealseid tehase auditeid meie 12 000 m² suuruses Qingdao rajatises. Meie tavapärane ekskursioon hõlmab 8 jaama tooraine laost dokumentide ülevaatusruumini. Virtuaalsed tehaseekskursioonid videokõne kaudu on samuti saadaval esialgseks kvalifikatsiooniks.
    - q: Kas aktsepteerite kolmandate osapoolte auditeid (BSCI, SMETA, SGS)?
      a: Jah. Me säilitame BSCI sertifitseerimise (Intertek) ja tervitame kliendipõhiseid auditiprotokolle. Samuti saame tellida SGS või TÜV kontrolli soovi korral. Auditiaruanded on saadaval NDAjaotises .
    - q: Kas ma saan visiidi ajal rõhutesti teha?
      a: Meie rõhutestimisjaam kuulub tavapärase ekskursiooni marsruudile. Sõltuvalt tootmisgraafikust võite jälgida aktiivseid rõhuteste koos näidikute ja testikirjetega. Rõhutestide logid kere kohta on alati ülevaatamiseks saadaval.
    - q: Kuidas te käsitlete mittekonformseid tooteid?
      a: Mittevastavad üksused on eraldatud, dokumenteeritud ja üle vaadatud vastavalt ISO meie 9001 parandusmeetmete protsessile. Tehakse juurpõhjuse analüüs, rakendatakse parandusmeetmeid ja hoitakse arvestust. Ostjad saavad auditite ajal meie NCR logi üle vaadata.
    - q: Millised vastavusdokumendid on ülevaatamiseks saadaval?
      a: 'Auditi käigus saate üle vaadata: mudelispetsiifilisi DoC proove, ehitaja plaadi spetsifikatsioone, HIN registrit, kasutusjuhendi mustandeid, kehtivaid standardite nimekirju ja vastavushindamise kirjeid mudelipere kaupa.'
    - q: Kuidas broneerida virtuaalne tehase ekskursioon?
      a: Võta ühendust meie müügimeeskonnaga, et leppida kokku otsevideotuur WhatsAppi, Zoomi või Teamsi kaudu. Järgime sama 8-jaamalist marsruuti ja saame keskenduda konkreetsetele piirkondadele vastavalt sinu huvidele. Tüüpiline virtuaaltuur kestab 45–60 minutit.
    - q: Kas tehas on tegelik tootja või kaubandusettevõte?
      a: Aquafarer on tegelik tootja. Me haldame tehast Laixis, Qingdaos. Äriluba, tootmismaht ja füüsiline tootmine on auditi käigus kontrollitavad.
    - q: Milliseid kvaliteediga dokumente saan üle vaadata?
      a: Sissetulevate materjalide inspekteerimise andmed, protsessis olevad kvaliteedikontrolli kontrollpunktid, rõhutestide logid, 100-punktilised lõpliku kontrolli kontrollnimekirjad, mittevastavuse aruanded, parandusmeetmete andmed ja kere jälgitavuse kirjed. Kõik hoitakse vastavalt ISO 9001 nõuetele.
cta:
  title: Broneeri tehase ekskursioon
  subtitle: Broneerige otseülekandes videotehase ekskursioon või planeerige kohapealne külastus meie Qingdao tehasesse. Vaadake meie tootmis-, kvaliteedikontrolli- ja vastavusdokumentatsiooni esmakäeliselt.
