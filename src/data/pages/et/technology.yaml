testimonial:
  quote: Mida Aquafarer eristab, on nende materjaliteadus. Nad ei kogu lihtsalt komponente kokku – nad konstrueerivad PVC ühendid, keevitusparameetrid ja struktuurilise kihistuse ise. See vertikaalne integratsioon paistab lõpptoodangus.
  author: David Park
  title: Toote arendusjuht
  company: Bluewater Sports Equipment
  location: Austraalia
sections:
  - title: Drop-stitch Core
    standard: 12-15 PSI tööpinge
    description: Tuhanded sisemised polüestri niidid ühendavad ülemised ja alumised kihid, luues 12-15 PSI jäiga struktuuri. See on sama tehnoloogia, mida kasutatakse professionaalsetes aerulaudades ja täispuhutavates võidusõudepaatides. Meie drop-stitch tihedus on mudeli kohta optimeeritud ideaalse tasakaalu saavutamiseks jäikuse ja kaalu vahel.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS Core Diagramm
  - title: Meretööstuse klassi PVC
    standard: Fusioon-keevitatud | UV / merevesi / kulumiskindlust testitud
    description: Mitmekihiline lamineeritud PVC kangas, mis on hinnatud merekeskkonna jaoks. Iga kiht on fusioon-keevitatud, mitte liimitud, elimineerides kihistumise riski. Testitud UV vastupidavuse osas (ASTM G154, 1 000 + tundi), merevee korrosiooni (ISO 9227) ja kulumise suhtes (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC Kiht
  - title: Hypalon Torud
    standard: CSM kumm | UV / keemiline / ekstreemtemperatuuri vastupidav
    description: Kasutatakse RIB mudelitel, Hypalon (CSM) kumm pakub paremat UV ja keemilist vastupidavust võrreldes tavalise PVC -ga. Hypalon torud säilitavad paindlikkuse ekstreemtemperatuuridel ning taluvad kütuse ja õli mõju. Kõik õmblused on sertifitseeritud tehnikute poolt käsitsi paigaldatud.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Õhualuse põrand
    standard: Kõrgsurvega täispuhutav | Asendab vineeri/alumiiniumi
    description: Kõrgsurvega täispuhutav põrandasüsteem, mis asendab traditsioonilisi vineeri- või alumiiniumlatistest põrandaid. Vähendab ülesseadmisaja, üldkaalu ja hoiuruumi mahtu, pakkudes samal ajal piisavat jäikust seismiseks, kalastamiseks ja kõndimiseks. Testitud 200 kg jaotatud koormuse talumiseks.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Õhuplatvorm
