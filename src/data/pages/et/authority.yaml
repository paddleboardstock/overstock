features3_brand:
  tagline: Kes me oleme
  title: Brändi sihtasutus<br />& Pärand
  subtitle: Lugu, asjatundlikkus ja globaalne haare, mis Paddle Board Overstock määratlevad usaldusväärse merevarustuse tootja.
  isBeforeContent: false
  columns: 3
  items:
    - title: Umbes Paddle Board Overstock
      description: Asutatud 2012. aastal Qingdaos, Hiinas. Rannikutöökojast kuni 12 000 m² suuruse rajatiseni — kogu Paddle Board Overstock lugu.
      icon: tabler:building-factory
      link: /about
    - title: Brändi lugu
      description: Kuidas mereinseneride meeskond otsustas muuta professionaalse tasemega täispuhutavad veesõidukid üle maailma kättesaadavaks.
      icon: tabler:book
      link: /brand-story
    - title: Merendustööstuse ekspertteadmised
      description: Sügav materjaliteadus, täppistootmine ja reaalse maailma testimine — aastakümnete pikkune meretehnika igas keres.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globaalne kohalolek
      description: Teenindades 50+ riiki igal mandril. Piirkondlik ekspertiis kohalike regulatiivsete nõuete ja turueelistuste osas.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Miks Paddle Board Overstock
      description: Mis meid eristab — kvaliteet, kohandamine, otsene tehase hind ja terviklik tugi kommertsoperaatoritele.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Meie meeskond
      description: Tutvu juhtkonnaga — mereinsenerid, materjaliteadlased ja tootmiseksperdid, kes Paddle Board Overstock liiguvad edasi.
      icon: tabler:users
      link: /brand/team
    - title: Insenerimeeskond
      description: 78+ kombineeritud teadus- ja arendusaastat, 40+ platvormi, 12 sertifikaati, 1200+ OEM projekti. Iga toote taga on tehniline meeskond.
      icon: tabler:engine
      link: /engineering-team
    - title: Teadus- ja arenduskeskus
      description: Kere inseneritöö, RF-keevitus, PVC labor, prototüüpimine, testpaak ja kvaliteedilabor — meie täielik teadus- ja arenduskeskus.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Usaldus ja kvaliteet
  title: Sertifikaadid, kvaliteet<br />& Tõestus
  subtitle: Sõltumatud sertifikaadid, põhjalikud testimised ja tõelised tõendid, mis näitavad meie pühendumust kvaliteedile.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifikaadid
      description: CE, ISO 9001, UKCA, BSCIREACH , — täielik sertifitseerimisdokumentatsioon ja vastavus globaalsetele turgudele.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvaliteet ja testimine
      description: Iga toode on enne saatmist survetestitud. Õmbluse tugevus, UV vastupidavus, ujuvus — kontrollitud igas etapis.
      icon: tabler:clipboard-check
      link: /quality
    - title: Tõendid ja tõendid
      description: Testitulemused, paigaldusfotod, kolmanda osapoole inspekteerimisaruanded ja juhtumiuuringud, mis Paddle Board Overstock kinnitavad kvaliteeti.
      icon: tabler:file-check
      link: /evidence
    - title: Teadmiste graafik
      description: Uuri Paddle Board Overstock üksuste graafikut — tooteid, tehnoloogiaid, sertifikaate ja suhteid ühendatud teadmistebaasis.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Juhtimine
  title: Tutvu meeskonnaga<br />Tagapool Paddle Board Overstock
  subtitle: Tööstuse ekspertteadmised, mis hõlmavad meretehnikat, materjaliteadust, kvaliteedijuhtimist ja B2B ülemaailmset kaubandust.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — asutaja ja tegevjuht
      description: 15+ aastat meretööstuses. Varem juhtis teadus- ja arendustegevust suures Hiina paaditootjas. Omab mitmeid patente täispuhutavate paadidisaini valdkonnas.
      icon: tabler:crown
    - title: Zhang Wei — peainsener
      description: 20+ aastat PVCHypalon tootmises ja sügava V kere disainis. Endine tehniline direktor Euroopa mereinsenerifirmas.
      icon: tabler:engine
    - title: Chen Ming — teadus- ja arendustegevuse juht
      description: Materjaliteaduse doktorikraad. Spetsialiseerunud drop-stitch tehnoloogiale ja kõrgsageduslikule keevitusele. 10+ aastat tekstiilikomposiitide valdkonnas.
      icon: tabler:flask
    - title: Liu Qiang — produktsioonijuht
      description: 18+ aastat lean-tootmises. Six Sigma must vöö. Rakendas ISO 9001 kvaliteedisüsteeme kõigil tootmisliinidel.
      icon: tabler:settings
    - title: Wang Fang — kvaliteedijuht
      description: 12+ aastat merekvaliteedi kontrollis. CE Sertifitseeritud ja ISO audiitor. Jälgib iga tootmispartii testimist.
      icon: tabler:shield-check
    - title: Helen Lee — müügidirektor
      description: 15+ aastat B2B rahvusvahelises kaubanduses. OEMJuhtinud /ODM partnerlusi 30+ riigis. Valdab vabalt 4 keelt.
      icon: tabler:briefcase
