workshops_section:
  tagline: Töötoad
  title: Tootmistöökojad
  workshops:
    - title: PVC Lõikamine ja materjalide ettevalmistamine
      description: Automaatsed CNC lõikemasinad PVCtöötlevad , Hypalon, ja drop-stitch kangaid alla millimeetri täpsusega. Arvutiga optimeeritud pesandussüsteem vähendab materjalide raiskamist ja tagab, et iga paneel vastab enne keevitamist oma mõõtmete spetsifikatsioonile.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Torukeevitus ja kuumtihendamine
      description: Spetsiaalne keevitustöökoda, kus on kuumatihendamismasinad ja RF-dielektrilised pressid. Kuumaõhu kuumtihendajad liimivad ja PVC kaitsetorude kambrid, samas kui RF-keevitused tekitavad kõrge tugevusega õhukindlad õmblused, mis ületavad ISO 9001 nõudeid.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Kere tootmine — klaaskiust
      description: RIB paadikere valmistatakse käsitsi paigaldatavast klaaskiust vormist polüester- ja vinüülestervaigusüsteemidega. Iga kiht rullitakse käsitsi ja vaakumpaktiga ühtlase kvaliteedi tagamiseks. Gelkattega pihustuskabiin tagab kõrge läikega ja UVvastupidava merepinnalise viimistluse.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Trükkimine ja kaunistamine
      description: SUP Lauad kaunistatakse täisvärviliste graafikate jaoks digitaalse trükiga ning logode ja korduvate mustrite jaoks siiditrükiga. Digiprinterid toodavad fotokvaliteediga tekkide kujundusi, samas kui siiditrükk annab vastupidavaid ja erksaid brändimärke.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Lõplik kokkupanek ja rigging
      description: Kokkupanekuliin, kus klaaskiust kered ja PVC torud on ühendatud, mootorid paigaldatud, roolimine ja juhtimisseadmed ühendatud ning elektrisüsteemid on ühendatud. Iga paat järgib 100-punktilist kokkupaneku kontrollnimekirja, mille meeskonna juht on allkirjastanud.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Kvaliteeditestimine ja kontroll
      description: Iga valmis paat läbib kohustusliku õhupeetuse testimise, õmbluse koorimise kontrolli ja täieliku süsteemide kontrolli enne saatmist. Meie kvaliteedilabor tegutseb tootmisest sõltumatult ja annab otse juhtkonnale aru.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
