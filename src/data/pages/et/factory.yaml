material_traceability:
  tagline: Jälgitavus
  title: Materjali jälgimine ja partiide kontroll
  description: Iga toorainepartii saab meie ERP süsteemis unikaalse partiinumbri. Saabumisest tootmiseni ja lõpptoote valmimiseni seob iga paadi materjalide arve algse tarnija partiiga. See võimaldab täielikku ülesvoolu jälgitavust igaks kvaliteedi- või nõuetele vastavuse päringuks.
  system: Kohandatud ERP (sisemine süsteem) + füüsilised partiitariifid igal töökorraldusel
  coverage: 100% tootmismaterjalidest — PVC, Hypalon, drop-stitch kangas, liimid, ventiilid, tarvikud, pakend
  records_retained: 10 aastat (CE 2013/53/EU nõude järgi)
  suppliers:
    - material: Meretasemega PVC
      source: Hiina ja Korea tarnijad
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch kangas
      source: Sisemine kudumine + väline partner
      certified: Sisene KQ + tarnija ISO 9001
    - material: Ventiilid ja tarvikud
      source: Chinese OEM suppliers
      certified: ISO 9001, materjalitunnistused partii kohta
