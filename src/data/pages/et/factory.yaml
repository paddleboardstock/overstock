hero:
  tagline: Tehas
  title: Tehas ja tootmine
  subtitle: 12 000 m2 integreeritud tootmist — toorainest kuni valmis paadini
intro:
  - '**Aquafarer Qingdao Manufacturing Hub** tehase kaubamärgina Aquafarer kontrollib ta iga tootmisetappi — alates PVC toormaterjalide ja klaaskiudude saabumisest kuni valmis paadi lõpliku eelkontrollini. Meie tootmisüksus Qingdao majandusarengu tsoonis hõlmab 12 000 ruutmeetrit ja seal asuvad spetsiaalsed töökojad PVC lõikamiseks, torude kuumtihendamiseks, klaaskiust RIB kere tootmiseks, SUP digitaalseks trükkimiseks, lõplikuks kokkupanekuks ja kvaliteeditestimiseks.'
  - Integreerides disaini, inseneritöö, prototüüpimise, tootmise ja testimise ühe katuse alla, kõrvaldame lepingulise tootmise ebaefektiivsuse ning säilitame otsese kontrolli ehituskvaliteedi, materjalivaliku ja tarneajade üle. Iga paat, mis meie töökojast lahkub, ehitatakse meie inimeste poolt, meie seadmetele, vastavalt meie standarditele.
