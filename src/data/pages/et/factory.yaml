qc_section:
  tagline: Kvaliteedikontroll
  title: Testimise ja kvaliteedi tagamise protsess
  subtitle: Iga paat läbib kohustusliku testimise enne saatmist. Meie kvaliteedilabor tegutseb tootmisest sõltumatult ja annab aru otse juhtkonnale.
  steps:
    - step: '1'
      title: Tooraine kontroll
      desc: PVC, , ning kangad Hypalondrop-stitch läbivad tõmbetesti (ASTM D751), rebenemise leviku ja UV takistuse kontrolli enne partii tootmisse minekut.
    - step: '2'
      title: 48-tunnine õhuhoidmise test
      desc: Iga torukamber täidetakse 125% nimirõhust ja hoitakse 48 tundi. Rõhulangus üle 5% käivitab automaatse tõuke ja õmbluse uuesti kontrolli.
    - step: '3'
      title: Koormuse ja tasakaalu testimine
      desc: Valmis paadid laaditakse maksimaalse nimivõimsuseni ja testitakse stabiilsuse, vaba pardasõidu ja juhitavuse osas. Iga laev testitakse enne lõplikku kontrolli vees.
oem_section:
  tagline: OEM Projektid
  title: Brändi ja OEM partnerluse juhtumiuuringud
  subtitle: Kontseptsioonist konteinerini — kuidas aitame globaalsetel brändidel käivitada ja laiendada oma täispuhutavaid veesõidukite liine.
  cases:
    - challenge: Euroopa välijaemüüja vajas privaatbrändi SUP sarja, millel oleks unikaalsed terrassigraafikad, PVCkeskkonnasõbralik ja jaemüügiks valmis pakend — kõik tarnitud 60 päevaga.
      solution: Arendasin kohandatud digitaalseid trükifaile, hankisime REACH-nõuetele PVCvastavaid ja tihendasime proovivõtte 3 voorust kuni 1, paigutades disainimeeskonna koos meie Qingdao tehasesse.
      result: 55 päeva alates allkirjastatud PO-st FOBkuni . 2400 ühikut 4 SKU-s. Kordustellimus esitati enne esimese konteineri saabumist.
    - challenge: USA veespordi idufirma vajas kõrge jõudlusega drop-stitch kajakki, millel on eritellimusel kerekuju, ühisbränditud pakend ja BSCI sertifitseerimine jaemüügi jaoks.
      solution: Kohandasin olemasolevat drop-stitch kajakivormi muudetud kiikprofiiliga, töötasime välja ühisbränditud pakendikunsti ja esitasime täieliku BSCI auditidokumentatsiooni.
      result: Edukalt noteeritud kolmes suuremas USA väliskettis. 5 000+ ühikut esimesel aastal 98% müügimääraga.
    - challenge: Austraalia hulgimüüja nõudis CEsertifitseeritud RIB valikut eritellimusel toruvärvidega, Hypalon uuendusvõimalust ja vastavust Austraalia standardile AS 1799.
      solution: Toodeti eeltootmise näidised nelja toruvärvivariandiga, CSM Hypalon hangitud Jaapani tarnijalt, ning koordineeriti kolmanda osapoole AS 1799 vastavustesti.
      result: 3-mudelite RIB seeria käivitati AU/NZ turul. Järgnes valitsuse hankevõit 12 RIBspatrulli jaoks.
faq_section:
  tagline: KKK
  title: B2B & OEM Korduma kippuvad küsimused
  questions:
    - q: Mis onMOQOEM SUP täispuhutavate laudade minimaalne tellimuste kogus ()?
      a: MOQ algab standardmudelite puhul 5–10 OEM ühikust. Eritellimusel vormid ja privaatmärgiga projektid nõuavad vähemalt 200 ühikut, sõltuvalt keerukusest. Uute brändide turuletoomiseks on saadaval proovitellimused ja proovide seeriad.
    - q: Kas Aquafarer omab BSCI sertifikaati?
      a: Jah. Meie tehas omab kehtivat BSCI sotsiaalse vastavuse sertifikaati (auditite aruanne on saadaval nõudmisel). Meie valduses on ka ISO 9001:2015 kvaliteedijuhtimise sertifikaat ning 64 meie tootemudelist omavad CE sertifikaati (TÜV Rheinland). REACH ja RoHS vastavusdokumentatsioon esitatakse iga OEM saadetisega.
    - q: Milline on tüüpiline tarneaeg OEM tellimuse puhul?
      a: Standardne tootmisaeg on 30–45 päeva alates kinnitatud ostutellimusest ja ettemaksust. Kohandatud vormide arendamine lisab tööriistade valmistamiseks 15–20 päeva. Pakume kiirendatud tootmist kiireloomuliste tellimuste ja hooajaliste tippude jaoks eelsuve perioodil (jaan–märts).
    - q: Kas saate saata FOB Qingdaost või CIF meie sadamasse?
      a: Jah. Me saadame FOB Qingdaosse, CIF peamistesse globaall sadamatesse ja DDP kvalifitseeritud partneritele. Meie logistika meeskond haldab konteinerite broneerimist, ekspordidokumentatsiooni ja tollivormistust. Me saadame kaupu 50+ riiki kogu ELis, USAs, Austraalias ja Aasia turgudel.
b2b_moq: 'Standard MOQ: 5–10 ühikut mudeli kohta (SUP/kajak/drop-stitch). RIB MOQ: 2–5 ühikut. Uued partnerlussuhted võivad esitada proovitarneid.'
production_flow:
  tagline: Tootmisvoog
  title: Materjalist valminud paadini
  subtitle: Iga paat läbib 6 tootmisetappi koos kvaliteedikontrolli punktidega igas etapis. Kui teed ei ole, inspekteerimisi ei vahele jäeta.
  stages:
    - stage: '01'
      title: Materjali vastuvõtt ja sissetulev kvaliteedikontroll
      description: Kõik saabuvad materjalid registreeritakse partiide/seeriatena meie ERP süsteemis. PVC kangarullid, drop-stitch tuumad, klapid, liimid ja riistvara jäetakse karantiini kuni QC heakskiiduni.
      qc_check: Tõmbetugevus (ASTM D751), rebimisresistentsus (ISO 4674), paksusemõõtja, liimi viskoossus, visuaalne defektide skaneerimine
      qc_threshold: 100% testitud partiidest. Tagasi lükata, kui tõmbetugevus < 90% spetsifikatsioonist, rebimiskindlus < spetsifikatsiooni miinimumist või esineb visuaalne defekt
      responsibility: Sissetulev QC meeskond (3 inspektorit)
    - stage: '02'
      title: CNC Lõikamine ja materjali ettevalmistus
      description: Arvutioptimeeritud paigutus asetab plaadid PVC materjalile, et vähendada jäätmeid. Automaatilised CNC lõikeseadmed säilitavad 0,1 mm positsioonitäpsuse.
      qc_check: Mõõtmete kontroll CAD DXF failide vastu, serva kvaliteedi kontroll, paneeli arvu kontroll
      qc_threshold: Iga 20. paneeli mõõdetud. Tolerants ±0,5 mm. Tagasi lükata partii, kui >2% väljaspool tolerantsi
      responsibility: Lõikamisvõtme juht
    - stage: '03'
      title: Keevitamine ja Drop-Stitch liimimine
      description: Drop-stitch tuumad on ühendatud väliste PVC laminaatidega kuumlamineerimise teel. Toru kambrid on RF-keevitatud või kuumaõhu keevitatud. Raudtee ribad on kolmekihiliselt sulamisühendusega liidetud.
      qc_check: Kooretesti iga 50 ühiku järel (ASTM D751), keevituslaiuse mõõtmine, kuumaõhu temperatuuri logide ülevaatus, visuaalne õmbluse kontroll tagantvalgel
      qc_threshold: Koorimisjõud vähemalt 8 N/cm. Keevitatud laius tolerants ±1 mm. Kõik nähtavad kanalid = tagasilükkamine
      responsibility: Keevituse kvaliteedikontroll (2 inspektorit vahetuse kohta)
    - stage: '04'
      title: Kokkuühendamine ja seadistamine
      description: 'Paadid liiguvad lõppkokkupaneku juurde, kus kõik komponendid on ühendatud: kere + torud, paigaldatud ventiilid, D-rõngad, käepidemed, uimerumahutid ja kandekoti kinnitamine. Igaüks järgib 100-punktilist kokkupaneku kontrollnimekirja.'
      qc_check: 100-punktilise kontrollnimekirja allkirjastamine iga ühiku kohta, klapi funktsiooni test (10 avamis/sulgemise tsüklit), riistvara pöördemomendi kontroll, visuaalne ülevaatus
      qc_threshold: 'Nullvigu poliitika ohutuskriitiliste esemete (ventiilid, D-rõngad, käepidemed) osas. Väikesed kosmeetilised: AQL 2,5 (ISO 2859)'
      responsibility: Koostemeeskonna juht + liini QC
    - stage: '05'
      title: Rõhutestimine ja kvaliteedi hoidmine
      description: Iga kamber täidetakse 1,25× nimirõhuni (tavaliselt 20–25 PSI) ja hoitakse 24–48 tundi. Rõhusensorid logivad pidevalt. Kambrid, millel rõhk langeb üle 5% võrra, lükatakse tagasi ja saadetakse õmbluste uuesti kontrollimiseks.
      qc_check: 24-tunnine rõhu hoidmise logi, senso-rkalibreerimine kontrollitakse iga päev, temperatuuri kompenseeritud rõhu näidik, õmbluse uuesti testimine pärast remonti
      qc_threshold: Maksimaalne 5% rõhulangus 24 tunni jooksul stabiilse temperatuuri juures. Iga kamber, mis seda ületab = kogu tootmiseraldise 100% uuesti testimine
      responsibility: Kvaliteedilabor (sõltumatu tootmisest, raportib juhtkonnale)
    - stage: '06'
      title: Lõplik kontroll ja pakkimine
      description: Lõplik visuaalne ja funktsionaalne kontroll. Pinnavigade, värvikonsistentsi, sildi/BIN-i kontrolli, pakendi terviklikkuse ja lisatarvikute täielikkuse kontroll. Üksused pakitakse vaakumpakenditesse, kastidesse ja pallitakse konteinerlaadimiseks.
      qc_check: Täielik visuaalne kontroll, lisatarvikute kontrollnimekiri vastavalt SKU, pakendi kukkumistest (1 m, juhuslik valim), sildi/baarkoodi skannimise kontroll
      qc_threshold: AQL 2,5 suuremate defektide puhul, AQL 4,0 väiksemate puhul. Ohutusdefektidele nulltolerants. 100% üksustest visuaalselt kontrollitud
      responsibility: Lõplik QC meeskond (4 inspektorit) + Pakkimismeeskonna juht
