    - challenge: USA veespordi idufirma vajas kõrge jõudlusega drop-stitch kajakki, millel on eritellimusel kerekuju, ühisbränditud pakend ja BSCI sertifitseerimine jaemüügi jaoks.
      solution: Kohandasin olemasolevat drop-stitch kajakivormi muudetud kiikprofiiliga, töötasime välja ühisbränditud pakendikunsti ja esitasime täieliku BSCI auditidokumentatsiooni.
      result: Edukalt noteeritud kolmes suuremas USA väliskettis. 5 000+ ühikut esimesel aastal 98% müügimääraga.
    - challenge: Austraalia hulgimüüja nõudis CEsertifitseeritud RIB valikut eritellimusel toruvärvidega, Hypalon uuendusvõimalust ja vastavust Austraalia standardile AS 1799.
      solution: Toodeti eeltootmise näidised nelja toruvärvivariandiga, CSM Hypalon hangitud Jaapani tarnijalt, ning koordineeriti kolmanda osapoole AS 1799 vastavustesti.
      result: 3-mudelite RIB seeria käivitati AU/NZ turul. Järgnes valitsuse hankevõit 12 RIBspatrulli jaoks.
