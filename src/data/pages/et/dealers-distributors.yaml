    - title: Territooriumi katvusplaan
      description: Geograafiline huvipakkuv territoorium, olemasolev jaemüügi- või jaotusvõrk, sihtkliendisegmendid ja kavandatav aastane maht tootekategooriate (RIB, SUP, kajakki) kaupa.
      icon: tabler:map
    - title: Näituse- või laovõimekus
      description: Füüsiline ruum toodete väljapanekuks, laoseisuks ja klienditeeninduseks. Fotod või põrandaplaanid, mis näitavad lammutusala ja varuosade hoiustamise mahtu.
      icon: tabler:building
    - title: Finantsvõimekuse aruanne
