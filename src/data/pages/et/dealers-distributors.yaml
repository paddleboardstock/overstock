content_benefits:
  tagline: Partnerluse eelised
  title: Miks levitajad<br />Vali Paddle Board Overstock
  subtitle: Partnerlus, mis on loodud merendusturustajatele, kes vajavad usaldusväärset tarnet, konkurentsivõimelisi marginaale ja professionaalset tuge.
  items:
    - title: Territooriumi kaitse
      description: Eksklusiivsed või pooleksklusiivsed territooriumiõigused kvalifitseeritud levitajatele. Turukaardistamine ja kanalite konfliktide juhtimine, et kaitsta sinu investeeringut Paddle Board Overstock brändi ülesehitamisse oma piirkonnas.
      icon: tabler:map-pin
    - title: Konkurentsivõimeline hulgihinnastamine
      description: Astmeline hinnastamine aastaste mahukohustuste alusel. Marginaalikaitsega hinnastruktuur koos ettemaksugarantiide ja läbipaistvate kulude jaotustega (FOBQingdao baasil).
      icon: tabler:currency-dollar
    - title: Turundustoe komplekt
      description: Professionaalne tootefotograafia, spetsifikatsioonilehed, vastavusdokumentatsiooni mallid, sotsiaalmeedia sisu ja ühisbränditud turundusmaterjalid. Uuendatakse igal aastal uute toodete lansseerimistega.
      icon: tabler:photo
    - title: Tehniline väljaõpe
      description: Tootekoolitus müügimeeskonnale (virtuaalne või kohapeal), hooldus- ja remondikoolitus teenindustehnikutele ning kliendile suunatud KKK ja tõrkejuhendid.
      icon: tabler:school
    - title: Varuosad ja järelmüük
      description: Pühendatud varuosade tarnimine koos prioriteetse saatmisega. Kiireks tellimuse täitmiseks on saadaval varuosad, ventiilid, tiivad ja remondikomplektid. Garantiinõuete töötlemise tugi.
      icon: tabler:tool
    - title: Vastavusdokumentatsioon
      description: 'Täielik vastavusdokumentatsiooni pakett teie turule: CE DoC, ehitaja plaadi andmed, kasutusjuhendid ja regulatiivne registreerimistugi. Eemaldab teie vastavuskoormuse.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Mida Me Otsime
  title: Levitaja<br />Nõuded
  subtitle: Otsime partnereid, kes suudavad oma territooriumil professionaalselt esindada ja toetada Paddle Board Overstock tooteid.
  items:
    - title: Territooriumi ja turu teadmised
      description: Tugev kohalolek mere-, veespordi- või vaba aja turul. Arusaamine kohalike regulatsioonide, tarbijate eelistuste ja veealuste sõidukite jaotuskanalite kohta.
      icon: tabler:target
    - title: Tööstuse kogemus
      description: Vähemalt 2-aastane kogemus mere-, vaba aja- või spordivarustuse jaotuses. Tõestatud kogemus rahvusvaheliste kaubamärkide ja B2B hulgimüügi operatsioonidega.
      icon: tabler:briefcase
    - title: Showroom või ladu
      description: Füüsiline ruum toodete eksponeerimiseks, inventari hoiustamiseks ja klienditeeninduseks. Võimekus hoida demoühikuid ja varuosi oma territooriumi jaoks.
      icon: tabler:building-store
    - title: Brändistandardite järgimine
      description: Valmisolek järgida Paddle Board Overstock kaubamärgi esitlusstandardeid, pakkuda kliendituge meie teenuseprotokollide järgi ja osaleda aastakoolituste tooteuuendustes.
      icon: tabler:star
content_process:
  tagline: Taotlusprotsess
  title: 4-astmeline edasimüüja<br />Taotlusprotsess
  subtitle: Esmasest päringust esimese saadetiseni – lihtne sissejuhatav protsess.
  steps:
    - number: '01'
      title: Esialgne päring ja kvalifitseerimine
      description: Esitage oma hulgimüüja taotlus koos ettevõtteandmete, huvitatud territooriumi, olemasolevate toodete ja aastaste mahu hinnangutega. Me vaatame taotluse üle 5 tööpäeva jooksul.
      timeline: 5 päeva
    - number: '02'
      title: Ärialane ülevaade ja tingimused
      description: Virtuaalne kohtumine territooriumi strateegia, hinnatasemete ja partnerluse tingimuste arutamiseks. Vaadake üle vastavusdokumentide nõuded teie turu jaoks. Vajaduse korral NDA allkiri.
      timeline: 1-2 nädalat
    - number: '03'
      title: Näidistellimus ja hindamine
      description: Esitage esialgne näidistellimus (2-5 ühikut) hulgimüügi hinnaga turuhinnangu ja meeskonna koolituse jaoks. Täielik vastavusdokumentide ja demo ettevalmistus on kaasas.
      timeline: 30-45 päeva
    - number: '04'
      title: Partnerluse käivitamine ja tugi
      description: Esimene konteineritellimus koos territooriumi kaitsega. Turunduskomplekt tarnitud, müügimeeskond koolitatud ja määratud pühendatud kontojuht. Jätkuvad kvartalikontrollid.
      timeline: Jätkub
