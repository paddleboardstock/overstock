      icon: tabler:users
faq:
  title: Edasimüüjate programm — korduma kippuvad küsimused
  questions:
    - q: Mis on levitajate minimaalne tellimuste kogus?
      a: Edasimüüja MOQ algab 10–20 ühikust tellimuse kohta, võimaldades segamudelite (RIB, täispuhutavad, SUP). Esialgsed proovitellimused 2–5 ühikut on saadaval levitaja hinnaga turu hindamiseks.
    - q: Kas pakute eksklusiivseid territooriumiõigusi?
      a: Eksklusiivsed territooriumiõigused on saadaval kvalifitseeritud levitajatele, kes täidavad aastased mahukohustused ja järgivad brändistandardeid. Arenevatele turgudele on saadaval ka pooleksklusiivsed ja mitteeksklusiivsed kokkulepped.
    - q: Millist turundustuge te pakute?
      a: Pakume põhjalikku turunduskomplekti, mis sisaldab professionaalset tootefotograafiat, spetsifikatsioonilehti, vastavusdokumentatsiooni malle, sotsiaalmeedia sisukogu ja kaasbränditud materjale. Uuendatakse igal aastal uute toodete turuletoomisega.
    - q: Kuidas garantiinõudeid käsitletakse?
      a: 'Edasimüüjad on garantiinõuete puhul esimene kontaktpunkt. Pakume selgeid garantiitingimusi, fotodokumentatsiooni protokolle ning kiiret asendamist või krediidimenetlust. Garantiitingimused: 5 aastat piiratud paaditoru kangale/õmblustele/kerele; 2 aastat SUP ja lisatarvikutele.'
    - q: Kas ma saan Paddle Board Overstock tooteid oma kaubamärgi all privaatmärgistada?
      a: Jah, meie OEM/ODM programmi kaudu. Privaatmärgi valikud hõlmavad eritellimusel torugraafikat, konsooli brändingut, jaemüügipakendust ja vastavusdokumentatsiooni teie kaubamärgi all. OEMVaata meie /ODM teenuste lehte täpsemate andmete saamiseks.
    - q: Millist vastavusdokumentatsiooni on hulgimüüjatele kaasas?
      a: Iga saadetis sisaldab mudelispetsiifilist CE DoC-d, ehitaja plaadi andmeid, omaniku juhendeid ja saatmisdokumente. Pakume ka regulatiivset registreerimise tuge teie territooriumil ning aitame kohalike vastavusnõuete täitmisel.
