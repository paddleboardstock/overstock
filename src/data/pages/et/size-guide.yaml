how_to_choose:
  title: Kuidas valida õige suurus
  cards:
    - title: SUP Tahvlid
      description: Valige pikkus oma kaalu ja kavandatud kasutuse põhjal. Laiemad lauad (32"+) pakuvad rohkem stabiilsust. Pikemad lauad (11-12 jalga) liiguvad paremini tuuril. Raskemad aerutajad vajavad suurema mahutavusega laudu.
    - title: Kajakid
      description: Ühe inimese kajakid (9 jalga) on parimad üksikisiku reiside ja jõgede jaoks. Kahe inimese kajakid (12 jalga) mahutavad kaks aerutajat või ühe täiskasvanu koos varustusega. Kontrollige kogukaalu, sealhulgas varustust.
    - title: Paadid & RIBs
      description: Valige paadi pikkus reisijate arvu ja kavandatud kasutuse järgi. Suuremad RIBs (4,5 m+) sobivad meresõiduks ja päästetöödeks. Väiksemad paadid (2,7 m) sobivad lisapaatidena ja kalastusplatvormidena.
