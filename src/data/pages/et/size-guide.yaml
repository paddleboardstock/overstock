hero:
  title: Suuruse ja spetsifikatsioonide juhend
  subtitle: Mõõtmed, mahud ja soovitatavad kasutusviisid iga Aquafarer toote jaoks.
categories:
  inflatable: Täispuhutavad SUPs ja kajakid, mis on loodud kaasaskantavuseks, ilma et ohustataks jõudlust. Sobitage õige suurus oma kaalu ja aerutamisstiiliga.
  rib: Terasest põhja ja täispuhutava kerega paadid rannikul navigeerimiseks, patrullimiseks ja professionaalseks meretööks. Valige pikkuse ja mootori mahutavuse järgi.
  accessory: Aksessuaarid ja ohutusseadmed, mis täiendavad teie veesõidukit. Universaalne suurus koos mitmete valikutega.
table:
  headers:
    product: Toode
