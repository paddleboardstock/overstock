content_challenge:
  tagline: Väljakutse
  title: Päästeoperatsioonide nõudmised<br />Loomulikult töökindel
  subtitle: Otsingu- ja päästeorganisatsioonid tegutsevad äärmise turvalisuse vastutuse all — iga paadi rike toob kaasa lubamatud tagajärjed.
  paragraphs:
    - Päästeoperatsioonides mõõdetakse edu ja ebaedu vahe minutites. Paat peab olema valmis kohe vette lastud, töötama rasketes tingimustes ja tooma reisijad tagasi ohutult. Turvalisuse vastutus on absoluutne — mehaaniline rike päästemissiooni ajal ei ole remondikulu, see on kaotatud elu.
    - SAR-paatidel peab olema kõrge kiirus, et ohvrini kiiresti jõuda, kombineeritult erakordse stabiilsusega ohutute päästeoperatsioonide jaoks. Need peavad mahutama päästeseadmed, meditsiinivarustuse ja sidevahendid — tihti piiratud tekiruumi juures. Valitsuse teenistuses töötavad paadid vajavad ka pikka tööiga (10–15 + aastat), et õigustada riigihanke eelarveid.
    - Nähtavus, nii operaatorile kui otsingu jaoks, on kriitiline. Paneelikujundus peab tagama 360-kraadise nähtavuse ning paat peab olema hästi nähtav lennukitele ja teistele sõidukitele.
    - Aquafarer päästmisRIBs on projekteeritud kiilest peale nende nõuete täitmiseks — isevadestatud tekid, tugevdunud kere, navigatsioonikomplektid ja tõmbe postid on patrullmudelites standardsed.
content_solution:
  tagline: Meie lahendus
  title: Eesmärgipäraselt ehitatud päästmisRIBs
  subtitle: Iga Aquafarer päästepaat on loodud vastama või ületama SOLAS ja riiklikke SAR-standardeid.
  list:
    - Isevallav tekst — vesi voolab automaatselt stabiilsuse tagamiseks päästeoperatsiooni ajal
    - Tugevdunud sügav-V kallas — võimekus rasketes vetes, et sõita kiirusel kontrollitult
    - Täielik navigatsioonituled komplekt — töötab ööpäevaringselt igas ilmastikus
    - Tõmbepost ja tõmbenöör — valmis paadi veoks või päästerakendi toiminguteks
    - Seadmete kinnituskettad — raadio, otsingutuled, sireen ja meditsiinivarustus
    - Mitme mootori konfiguratsioonid — üks välimine või kahemootoriline varukoopia
    - Kõrge nähtavusega toruvärvid — oranž, kollane või punane maksimaalse nähtavuse saavutamiseks
content_segments:
  tagline: Päästeprofiilid
  title: Otsingu- ja päästesõidukite lahendused<br />Organisatsioonitüübi järgi
  subtitle: Erinevad päästeorganisatsioonid tegutsevad erinevate mandaatide, eelarvetsüklite ja töökeskkondade alusel — alates rannikuvabatahtlikest meeskondadest kuni riiklike rannavalve laevastikeni. Me seadistame iga RIB päästeoperatsiooni vastavalt missiooni profiilile.
  items:
    - title: Rannavalve ja valitsuse SAR-agentuurid
      subtitle: Absoluutne ohutusvastutus — missioonikriitilised pargistandardid
      description: Valitsuse SAR-agentuurid kannavad kõrgeimat ohutusvastutust mereoperatsioonides. Iga paat peab töötama veatult ekstreemsetes tingimustes — seadmete rike päästemissiooni ajal ei ole valik. Hankeotsuseid mõjutab kogu omamiskulu 10–15 aasta pikkuse kasutusaja jooksul, mitte algne hind. Agentuurid vajavad laevu, mis suudavad üle elada aastaid rannikupatrulli, vastavad rangetele riiklikele standarditele ja tagavad järjepideva jõudluse hajutatud jaamades. Põhjalik vastavusdokumentatsioon ja mitmeaastased teenuselepingud on kohustuslikud.
      features:
        - SOLAS ning riiklik SAR standardite vastavuse dokumentatsioonipakett
        - Varuosade ühisosa kogu pargis — vähenda jaama tasandi inventari keerukust
        - Kahemootoriline konfiguratsioon missioonikriitilise redundantsuse tagamiseks
        - 10–15-aastane kasutusea disain koos planeeritud hooldusprogrammidega
        - Kõikide ilmastikutingimuste võimekus — tugevdatud sügav-V kere tormistel mereoludel
    - title: Pääste- ja rannapäästeteenused
      subtitle: Kiire käivitamine, madala vee operatsioonid
      description: Linna- ja rannaäärsed päästeteenused vajavad kiire reageerimisega laevu, mis suudavad surfitsoonide kaudu vette lasta, tegutseda madalates rannikuvetes ning jõuda ujujate või hädas olevate alusteni mõne minutiga. Varustus peab olema piisavalt kerge, et seda saaks väikese sõidukiga või käsitsi randa pukseerida.
      features:
        - Madala RIB süvisega kere surfitsooni ja rannikuäärse tegevuse jaoks
        - Rannapaadiga võimeline vööri tõstekäepidemega ja kiilukaitsega
        - Integreeritud päästekelk või päästeujumisplatvorm
        - Kõrge nähtavusega oranžid või kollased toruvärvid on standardvarustuses
    - title: Tuletõrje päästeosakonnad
      subtitle: Tulepumba integreerimine, seadmete paigaldamine, kiire reageerimine
      description: Tulekahju päästeüksused reageerivad veepiiri hoonete tulekahjudele, laevapõlengutele ja veepõhistele päästejuhtumitele. Need paadid peavad kandma tulepumpasid, monitore, voolikute hoiustamist ja hingamisseadmeid — kõik integreeritud stabiilseks, kiireks reageerimiseks mõeldud platvormiks. Osakonnad kasutavad neid laevu ka üleujutustele reageerimiseks ja vastastikuse abi operatsioonideks. Konsoolipaigutused peavad võimaldama pumpade juhtimist, raadiosüsteeme ja hädavalgustust, kahjustamata meeskonna liikumise jaoks tekipaika.
      features:
        - Vöörile paigaldatud tulemonitor koos pumba integreerimispaketiga
        - Pühendatud seadmete paigaldus tulepumba, voolikute hoiustamise ja BA komplektide jaoks
        - Konsooli paigutus on seadistatav pumpade juhtimise, raadio ja hädavalgustuse jaoks
        - Isevoolav terrass tulekustutusvee äravooluks ja stabiilsuseks
        - 'Ööoperatsioonide pakett: otsingutuli, stseenivalgustus, sinine/punane valgusriba'
    - title: Merepolitsei ja sadamaturvalisus
      subtitle: Takistamine, patrull, pardale tungimisoperatsioonid
      description: Mereõiguskaitseüksused vajavad laevu, mis suudaksid kiirelt jälitada, kahtlase laeva pardale minekut ja sadamaturvapatrulli. Nendel paatidel peab olema turvaline hoiukoht jõustamisvarustuse ja relvade jaoks, sideühendus kaldaväejuhatusega ning piisav tekipaika pardale tungimise meeskondade operatsioonideks. Ööoperatsioonide võimekus ja madala profiiliga lähenemine on takistusmissioonide jaoks hädavajalikud.
      features:
        - Kõrge kiirusega jälitusvõime — kere tasasuunaline 40+ sõlme tippkiirusega
        - Turvata relvakapi ja jõustamisvarustuse hoiuruumid
        - Konsooliintegratsioon politseiraadio, MDT ja sidesüsteemide jaoks
        - 'Ööoperatsioonide pakett: IR prožektor, FLIR-kinnitus, varjatud valgustus'
        - Tugevdatud pardaplatvorm libisemiskindla pinnaga
        - Sinine/punane hädaolukorra valgustus ja sireenisüsteem
    - title: Vabatahtlikud SAR ja mittetulundusühingud
      subtitle: Toetustega rahastatud, kogukonnapõhised ranniku- ja järveoperatsioonid
      description: Kogukonnapõhised päästerühmad tegutsevad järvedes, jõgedes ja rannikualadel, kus valitsuse otsingu- ja otsingu- ning otsingu- ja päästeteenuste katvus on piiratud. Sageli rahastatud annetuste või valitsuse toetuste abil vajavad need organisatsioonid maksimumi võimekust dollari kohta — usaldusväärset, vähehooldust nõudvat laeva, mida vabatahtlikud saavad ohutult juhtida minimaalse pühendunud väljaõppega. Toetuste hankimise tsüklid tähendavad, et paadid peavad täitma vastavusnõudeid, jäädes samal ajal fikseeritud eelarvetesse.
      features:
        - Ühe välismootoriga konfiguratsioon, optimeeritud madalamateks soetus- ja kasutuskuludeks
        - PVC Ehitus madalama hooldusvajaduse ja lihtsa välitöö parandamiseks
        - Mitmefunktsionaalne konsool, mis minimeerib elektroonilist keerukust vabatahtlike operaatorite jaoks
        - Toetuste vastavuse dokumentatsiooni pakett rahastamistaotluste jaoks
        - Kerge disain rannavette laskmiseks ilma spetsiaalse haagise või kraanata
    - title: Üleujutuste päästmine ja katastroofidele reageerimine
      subtitle: Sisevee üleujutused, madal vesi, prahiga täidetud keskkonnad
      description: Üleujutuste pääste on eriline operatiivne profiil — paadid töötavad üleujutatud linnapiirkondades, prügirohketes hoovuses ja äärmiselt madalas vees, kus veealused takistused on nähtamatud. Operaatorid vajavad laevu, mis suudavad navigeerida üleujutatud tänavatel, suruda läbi prahi ning päästa ohvreid hoonetest ja sõidukitest. Madala süvisega võimekus on kriitilise tähtsusega, samuti võime töötada voolus koos takistuste ohtudega. Neid paate kasutavad sageli tuletõrje, tsiviilkaitse ja katastroofiabi MTÜd.
      features:
        - Ülimadala süvisega kere — töötab 30–50 cm sügavusel vees
        - Rusude tõrjuv vöör ja tugevdatud torukaitse veealustele takistustele
        - Isepurjetatav terrass üleujutusvee äravooluks ja ohvrite päästmiseks
        - Kõrge nähtavusega oranžid või kollased torud õhuluure jaoks
        - Kerge disain helikopterite transpordiks ja maanteekasutuseks
        - Tugevdatud tõstepunktid tõste- ja köiepäästeoperatsioonideks
