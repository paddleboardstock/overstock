reasons:
  tagline: Aquafarer Erinevus
  title: Mis meid eristab
  isBeforeContent: false
  columns: 3
  items:
    - title: Tõeline tootmine, mitte kaubandus
      description: Me omame ja haldame 12 000 m² suurust tehast. Kui teete koostööd Aquafarer, töötate otse inimestega, kes teie tooteid projekteerivad, inseneerivad ja ehitavad — ilma vahendajateta.
      icon: tabler:building-factory
    - title: Inseneripõhine lähenemine
      description: Meie disainiprotsess algab kasutusjuhtumist, mitte tootekategooriast. Optimeerime kere kuju, materjalide valikut ja konfiguratsiooni vastavalt sellele, kuidas seadmeid tegelikult ärikeskkonnas kasutatakse.
      icon: tabler:engine
    - title: Sertifitseeritud kvaliteet
      description: CE Sertifitseeritud, ISO kvaliteedisüsteemiga, BSCI nõuetele vastavad, REACH USCG III ja V tüüpi heakskiidetud päästevestid; kõik tooted vastavad kehtivatele rahvusvahelistele standarditele.
      icon: tabler:certificate
    - title: Paindlik OEM/ODM
      description: Toruvärvid, konsooli paigutus, bränding, pakend — me kohandame vastavalt teie nõudmistele. Ei mingit minimaalset tellimuse survet. Alusta prototüübist, skaleeri kindlalt.
      icon: tabler:adjustments
    - title: Globaalsed logistikalahendused
      description: USA laopunkt Californias, otsesaadetised Qingdaost, õhutransport kiirete tellimuste jaoks. Me tegeleme tollipaberimajanduse ja dokumentatsiooniga kogu maailmas.
      icon: tabler:truck-delivery
    - title: Eluaegne tugi
      description: Me toetame laevu, mida ehitasime 20 aastat tagasi. Originaalvaruosad, tehniline nõustamine, remondijuhised — meie meeskond on saadaval, kui sind on vaja, ükskõik kus sa oled.
      icon: tabler:lifebuoy
testimonials:
  tagline: Brändide usaldusväärne üle maailma
  title: Mida meie partnerid ütlevad
  items:
    - content: Oleme teinud koostööd mitme Hiina tootjaga, kuid Aquafarer paistame silma oma inseneritoe ja järjepideva kvaliteediga. Nad kohtlevad meie brändi nagu oma brändi.
      name: — OEM Partner, Euroopa veespordi bränd
    - content: Nende Hypalon RIBs on olnud meie laevastikus rohkem kui 5 aastat. Minimaalne hooldus, suurepärane UV vastupidavus. Torude 5-aastane garantii annab meile kindluse.
      name: — Laevastiku operaator, Lähis-Ida puhkekeskuste grupp
    - content: Aquafarer meeskond aitas meil arendada kohandatud SUP plaadi disaini kontseptsioonist tootmiseni 90 päevaga. Kvaliteet ületas meie ootusi.
      name: — Hulgimüüja, Austraalia veespordi ettevõte
    - content: Väikeettevõtte omanikuna muretsesin MOQs pärast. Aquafarer arvestas mu eelarvega ja aitas mul oma brändi käivitada vaid 50 lauaga. Nüüd tellin 500.
      name: — Brändi asutaja, USA SUP rendiettevõte
cta:
  title: Valmis oma veemajanduse ülesehitamiseks?
  subtitle: Võta meie meeskonnaga ühendust tasuta konsultatsiooni saamiseks. Ei kohustusi — lihtsalt aus nõu seadmete ja tootmise kohta.
  actions:
    - variant: primary
      text: Rääkige meie meeskonnaga
      href: /contact
    - text: Laadige alla toodete kataloog
      href: /resources
