hero:
  tagline: Miks Aquafarer
  title: Ehitatud teistmoodi. Ehitatud äriks.<br />Water Adventures'i partner üle maailma
  subtitle: Mitte ainult tootja – äripartner, kes disainib, inseneerib ja tarnib kommertskvaliteediga seadmeid klubidele, kuurortidele, rendiettevõtetele ja uutele veebrändidele.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Tootmise kvaliteet ja asjatundlikkus
pillars:
  tagline: Partnerluse kolm sammast
  title: Miks maailma veeettevõtted valivad Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Mõeldud äriliseks kasutamiseks
      description: Meie seadmed on loodud igapäevaseks rentimiseks, mitte nädalavahetuse vaba aja veetmiseks. PVCKaubanduslikud, drop-stitch tugevdatud tuumad, UVstabiilsed Hypalon valikud ja välitingimustes testitud riistvara tähendavad väiksemat hooldust, pikemat eluiga ja ROI suuremat teie tegevust.
      icon: tabler:building-factory
      callToAction:
        text: Vaata kommertstootevalikut
        href: /products
    - title: Ideest turule
      description: 'Käivita oma veespordibränd 90 päevaga. Juhendame sind igas sammus: kontseptsiooni valideerimine, tootevalik, prototüüp, tootmine, pakendidisain ja globaalne saatmine. Pole minimaalset tellimuse survet – alusta väikestest, skaleeri enesekindlalt.'
      icon: tabler:rocket
      callToAction:
        text: Alusta oma bränditeekonda
        href: /oem-odm-blueprint
    - title: Ehitatud globaalsetele tingimustele
      description: 'Tooted, mis on optimeeritud igale kliimale: külma vee PVC koostised Euroopasse, UVvastupidavad materjalid Lähis-Idasse ja Austraaliasse, niiskusevastased töötlused Kagu-Aasias. Iga saadetis on kalibreeritud sihtkeskkonna järgi.'
      icon: tabler:world
