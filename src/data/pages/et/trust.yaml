  title: Usaldus Paddle Board Overstock
  subtitle: |
    64 CE-sertifitseeritud mudelit — ohutuse testitud,<br />
    vastupidavus ja jõudlus. Mingeid lühiteid. Mingeid erandeid.
  taglineSection: Sertifitseeritud. Testitud. Tõestatud.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  imageAlt: Paddle Board Overstock toode läbib kvaliteeditesti
stats:
  title: Paddle Board Overstock numbrite järgi
  stats:
    - title: CE 6185
      description: 64 CE-sertifitseeritud vabaajamudeleid vastavad ELi ohutusstandarditele — sertifitseeritud TÜV Rheinlandi poolt
    - title: ISO 9001:2015
      description: Kvaliteedihaldussüsteem sertifitseeritud SGS poolt alates 2022. aastast
    - title: BSCI & REACH
      description: Eetiline tootmine ja EL-i materjalidele vastavus — kinnitatud Interteki poolt
    - title: 5-aastane paadi garantii
      description: Torukangas, õmblused ja kere — 2 aastat SUP ja tarvikutele. 99,3% veavaba tase (AQL 2,5 igast ISO 2859).
features3_certifications:
  title: Sertifikaadid ja vastavus
  subtitle: Iga toode on sõltumatult testitud; 64 mudelit on rahvusvahelistele standarditele CE sertifitseeritud.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Sertifitseerimine
      description: 64 CE sertifitseeritud mudelit SUPs, kajakite, paatide ja RIBs seas vastavad Euroopa CE vabaaja veesõidukite ohutusstandardile. Iga toode läbib enne tehast survetesti, ujuvustesti ja koormustesti.
      icon: tabler:certificate
    - title: ''
      description: Meie 12 000 m² suurune Qingdao tehas töötab ISO 9001 kvaliteedihaldussüsteemi alusel. Iga tootmispartii on jälgitav, dokumenteeritud ja kontrollitud.
      icon: tabler:clipboard-check
    - title: BSCI Sotsiaalne vastavus
      description: Me oleme BSCI-sertifitseeritud, tagades eetilised tööpraktikad, ohutud töötingimused ja keskkonnakohustuse kogu meie tarneahelas.
      icon: tabler:users
    - title: REACH & RoHS
      description: Kõik materjalid — PVC, Hypalon, EVA vaht, liimid — vastavad ELi REACH ja RoHS määrustele. Piiratud aineid ei ole, kompromisse ei ole.
      icon: tabler:flask
    - title: Materjalitestimise labor
      description: Siseosakonna materjalilabor testib iga kangapartii puhul enne tootmist tõmbetugevust, UV vastupidavust, õmbluse terviklikkust ja kulumiskindlust.
      icon: tabler:microscope
    - title: 5-aastane paadi garantii
      description: Paddle Board Overstock paadid on kaetud 5-aastase piiratud garantiiga torukangas, õmblused ja kere osas. SUP lauad ja tarvikud on kaetud 2-aastase garantiiga. Me seisame selle taga, mida me ehitame.
      icon: tabler:shield-check
testimonials:
  tagline: Kliendi usaldus
  title: Mida meie kliendid ütlevad
  subtitle: Esimestest aerutajatest kuni professionaalsete laevastiku operaatoriteni — vaata, miks nad usaldavad Paddle Board Overstock.
  items:
    - content: Me varustasime kogu oma rendilaeva pargi Paddle Board Overstock RIBs — 12 paati kolme asukoha vahel. Kaks hooaega, null rikkeid. CE sertifikaadid tegid kindlustuse heakskiidu sujuvaks. Nende insenerimeeskond kohandas isegi torude värvid, et need sobiksid meie brändiga.
      name: Marco Valenti
      title: Operatsioonide direktor, Adriatic Adventure Tours — Dubrovnik, Horvaatia
    - content: Esmakordse ostjana olin mures kvaliteedi pärast, tellides välismaalt. ISO dokumentatsioon ja kolmanda osapoole testiaruanded, mida nad jagasid enne minu küsimust, andsid mulle täieliku kindluse. Laud saabus 6 päevaga ja ületas mu ootusi.
      name: James Thornton
      title: SUP Explorer 11 omanik — Vancouver, Kanada
    - content: Me opereerime 24 Paddle Board Overstock RIBs oma rannikupatrulli varus. Nende kvaliteedikontrolli protsess on kõigis partii toodetes järjepidev — sama õmbluste kvaliteet, sama ventiili asukoht, sama rõhu tase iga kord. See kordusväärtus on oluline, kui elud sõltuvad varustusest.
      name: Ltn. Andres Reyes
      title: Meri hankespetsialist, Filipiinide rannavalve abiüksus — Manila, Filipiinid
features3_lab:
  title: Siselabori testimine ja kvaliteedikontroll
  subtitle: Iga materjalisari ja valmis toode läbib meie kohaliku testlabori enne saatmist.
  columns: 3
  isBeforeContent: true
  items:
    - title: Suurjõudluse tõmbetestid
      description: 'Iga PVC kangarull testitakse ASTM D751 standardite järgi. Minimaalne nõue: 350 N/cm lõim ja põimik. Tagasilükatud partii tagastatakse tarnijale — me tagastame umbes 3% saabuvatest materjalidest.'
      icon: tabler:scale
    - title: UV Kiirvananemine
      description: Kangaste mustrid läbivad 1 000-tunnise QUV kiirvananemise (ASTM G154). Tõmbetugevuse säilimine peab ületama 80% pärast UV kokkupuudet. Toode on hinnatud 3+ aastaks õues kasutamiseks.
      icon: tabler:sun
    - title: Õmbluste rebenemiskindlus
      description: RF-keevitatud õmblused testitakse minimaalse rebenemistugevusega 5 N/mm (ASTM D751). Käsitsi liimitud Hypalon õmblused testitakse 3,5 N/mm. Iga tootmispartii õmblusproovid testitakse hävitavalt ja arhiveeritakse.
      icon: tabler:stack
    - title: 24–48-tunnine rõhutesti
      description: 'Iga täispuhutav toode täidetakse 1,25x nimiväärtusest PSI ja jälgitakse 24–48 tundi. Maksimaalne lubatud rõhumõõdu langus: 5%. Toote ebaõnnestumise korral töödeldakse see uuesti ja testitakse enne saatmist.'
      icon: tabler:wind
    - title: Klapi tsükli testimine
      description: Iga klapi disain läbib meie laboris 10 000 avamis-sulgemise tsüklit. Klapid peavad säilitama õhutiheduse 1,25x nimirõhul pärast tsüklit. Kõik Paddle Board Overstock klapid on hinnatud 5+ aastaseks regulaarseks kasutamiseks.
      icon: tabler:rotate
    - title: Külma pragude vastupidavus
      description: Materjale testitakse -30°C juures 4 tundi vastavalt ISO 4646. Lõhesid ega rabedust ei tohi esineda. Toode on hinnatud talveks ladustamiseks ja külmas vees kasutamiseks kuni -10°C ambienttemperatuurini.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kuidas me tagame kvaliteedi
  subtitle: Alates toorainete kontrollist kuni lõpliku rõhutestimiseni — iga toode läbib range kvaliteediketta.
  items:
    - title: Tooraine kontroll
      description: Iga PVC kangarulli testitakse paksuse, tõmbetugevuse ja UV vastupidavuse osas enne tootmisse sisenemist.
      icon: tabler:search
    - title: Protsessi käigus QC
      description: Keemised õmblused, klapitehised ja kamberühendused kontrollitakse igas koostamisjaamas.
      icon: tabler:eye
    - title: Rõhutestimine
      description: Iga täispuhutav toode täidetakse 1,25x niitletud PSI ja hoitakse 24–48 tundi, et kontrollida õhu säilivust ja õmbluste terviklikkust.
      icon: tabler:wind
    - title: Lõplik kontroll
      description: Iga üksus kontrollitakse viimistluse, riistvara ja pakendamise osas enne saatmiseks heakskiitmist. Partiiproovid lähevad meie laborisse hävitustestimiseks.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Paadi KKK küsimused
  subtitle: Levinumad küsimused meie jäiga kerega täispuhutavate paatide kohta.
  columns: 2
  items:
    - title: Milliseid RIB paadi suurusi Paddle Board Overstock pakutakse?
      description: Pakume 35 RIB mudelit pikkusega 2,5 m kuni 7,6 m, hõlmates kõike alates kompaktsetest tenderitest kuni raskeveokite kommerts- ja patrulllaevadeni. Iga mudel on saadaval mitme konfiguratsioonivalikuga.
    - title: Mis vahe on RIB a-l ja traditsioonilisel täispuhutaval paadil?
      description: RIB A (Rigid-Hull Inflatable Boat) ühendab täisklaaskiust või alumiiniumist sügav-V kere Hypalon täispuhutavate või PVC torudega. See annab tugeva paadi stabiilsuse ja kandevõime koos täispuhutava paadiga löökide neeldumise ja ujuvusega.
    - title: Milliste mootoritega on Paddle Board Overstock RIBsühilduv?
      description: Meie RIBs tugimootorid on mudelist sõltuvalt 3 HP kuni 250 HP mootorit. Iga tooteleht näitab maksimaalset mootori võimsust. Soovitame konsulteerida oma edasimüüjaga, et leida ideaalne sobivus.
    - title: Kas Paddle Board Overstock RIBs CE oled sertifitseeritud?
      description: Jah. Kõik vabaaja RIB mudelid on CE sertifitseeritud vastavalt Euroopa standarditele vaba aja veesõidukitele. Kaubanduslikud ja patrullmudelid vastavad täiendavatele stabiilsus- ja koormusnõuetele.
    - title: Mis on RIB paatide garantii?
      description: Kõik Paddle Board Overstock RIBs on varustatud 5-aastase piiratud garantiiga torukangale, õmblustele ja kerele; täisõhuventiile 5 aastaks; tehases paigaldatud tarvikud kaetud 1 aastaks.
    - title: Kui palju Paddle Board Overstock RIBs õhukambreid üldse on?
      description: Meie RIBs mudelil on 3 kuni 7 sõltumatut õhukambrit, sõltuvalt mudeli pikkusest. See mitmekambriline disain tagab, et paat püsib pinnal isegi siis, kui üks sektsioon on kahjustatud.
faqs_inflatable:
  title: Täispuhutava paadi KKK küsimused
  subtitle: Levinumad küsimused meie täispuhutavate paatide, kajakkide ja paatide kohta.
  columns: 2
  items:
    - title: Milliseid materjale kasutatakse Paddle Board Overstock täispuhutavates paatides?
      description: Kasutame sõjaväeklassi PVC (1100 denier) ja Hypalonpremium-klassi /CSM kummi, sõltuvalt mudelist. Mõlemad materjalid on UVstabiliseeritud, kulumiskindlad ja vastavad REACH EL-ile ning RoHS regulatsioonidele.
    - title: Kui kaua kummipaadid kestavad?
      description: Õige hoolduse korral kestab kvaliteetne PVC täispuhutav paat 7–10 aastat, Hypalon mudelid aga 15–20 aastat. Regulaarne puhastamine, UV kaitse ja korralik hoiustamine pikendavad oluliselt kasutusiga.
    - title: Millist hooldust on täispuhutava paadi puhul vaja?
      description: Põhiline hooldus hõlmab iga kasutuskorra järel värske veega loputamist (eriti soolases vees), kuivatamist enne hoiustamist, klapi tihendite kontrollimist igal aastal ja kaitsevahendi UV kasutamist torudele. Väldi pikaajalist päikese käes viibimist, kui seda ei kasutata.
    - title: Kas täispuhutavaid paate saab kasutada soolases vees?
      description: Jah. Kõik Paddle Board Overstock täispuhutavad paadid on mõeldud nii magevee- kui soolavee kasutamiseks. Soovitame loputada värske veega ja kuivatada põhjalikult pärast soolase vee kokkupuutet, et vältida sobivuse korrosiooni ja kangasoola kristalliseerumist.
    - title: Kuidas ma hoian täispuhutavat paati?
      description: Tühjenda, puhasta ja kuivata paat täielikult enne hoiustamist. Rulli lahtiselt (väldi tihedaid volte), hoia jahedas ja kuivas kohas, eemal otsesest päikesevalgusest, ning hoia betoonpõrandad eemal, et niiskust ei ima.
    - title: Milline on Paddle Board Overstock täispuhutavate paatide kandevõime?
      description: Kaalukandmisvõimed ulatuvad meie väikseimate mudelite puhul 290 kg-st kuni üle 2000 kg suuremate kaubanduslike seadmete puhul. Igal tootelehel on kirjas teie konkreetse mudeli maksimaalne kandevõime.
faqs_sup:
  title: SUP Juhatuse korduma kippuvad küsimused
  subtitle: Tavalised küsimused meie stand-up aerulaudade kohta.
  columns: 2
  items:
    - title: Millised SUP tahvli suurused on saadaval?
      description: Pakume SUP laudu pikkusega 9 jalga kuni 12 jalga, sealhulgas kõik-ühes, tuurimis-, jooga- ja spetsiaaldisainid. Meie kõige paremini müüvad mudelid on Tropical Breeze (10 jalga) ja Ocean Voyager (11 jalga).
    - title: Mis on drop-stitch konstruktsioon?
      description: Drop-stitch konstruktsioon kasutab tuhandeid polüestri niite, mis ühendavad plaadi ülemise ja alumise kihi, võimaldades sellel taluda kõrget õhurõhku (15–20 PSI) ja saavutada jäik, stabiilne platvorm. See on tööstuse standard premium-klassi täispuhutavate SUPs jaoks.
    - title: Mis on SUP laudade kandevõime piir?
      description: Meie SUP lauad kannatavad mudelist ja mahust sõltuvalt kuni 150 kg. Leviathan Wake laud on meie kõige suurema kandevõimega mudel, loodud suurematele sõitjatele ja jooga kasutamiseks.
    - title: Kas te pakute täielikke SUP pakette?
      description: Jah. Iga SUP laud tuleb komplektiga, mis sisaldab 3-osalist alumiiniumist aeru, kõrgsurvelist käsipumpa, spiraallukuga rihma, reisikotti ja remondikomplekti. Mõned mudelid sisaldavad ka eemaldatavat rooli komplekti.
    - title: Milline on SUP plaatide garantii?
      description: Kõik Paddle Board Overstock SUP lauad on kaetud 2-aastase garantiiga tootmisdefektide, sealhulgas õmbluste purunemise, ventiilide defektide ja materjali kihistumise eest normaalsel kasutamisel.
    - title: Kui kaua võtab aega SUP laua täispuhumine?
      description: Kaasasoleva käsipumba abil võtab täis-15 PSI pumpamine umbes 8–12 minutit. Kiirema pumpamise jaoks soovitame meie Paddle Board Overstock 12V elektripumpa, mis täidab lauapinna vähem kui 4 minutiga.
cta:
  title: Tahad ise sertifikaate näha?
  subtitle: Taotlege meie sertifitseerimise portfelli, tehase auditi aruandeid või materjalide vastavusdokumentatsiooni. NDA ei ole vajalik.
  actions:
    - variant: primary
      text: Küsige sertifikaadi dokumente
      href: /contact
    - text: Külastage meie tehaste lehte
      href: /factory
