direct_answer: Aquafarer pakub kolme eelkonfigureeritud äripaketti, mis on mõeldud veespordioperaatoritele igal arenguetapil. Club Starter Package sisaldab 10 SUPs koos aerude, pumpade, remondikomplektide ja turvavarustusega algavatele klubidele ja koolidele. Resort Premium Package varustab 50–100 ühikut koos hoiustamissüsteemide, brändingu ja koolitusjuhenditega hotellidele ja majutusasutustele. Brand Launch Package pakub toodete valikut, kohandatud logodisaini, pakendamist, tootmist ja saatmist ettevõtjatele, kes alustavad oma veespordibrändi. Kõik paketid sisaldavad tehtasest otse hindamist, CE sertifitseerimist ja ülemaailmset logistilist tuge.
