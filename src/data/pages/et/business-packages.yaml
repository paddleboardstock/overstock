faq:
  title: Paketi KKK
  questions:
    - q: Mis on pakettide minimaalne tellimuse kogus?
      a: Klubi alustuspaketil on minimaalne kogus 10 ühikut. Resort ja Brändi paketid on kohandatud vastavalt teie vajadustele paindlike MOQs tingimustega.
    - q: Kui kaua tarne kestab?
      a: Tavapärane tootmine on 30–45 päeva alates tellimuse kinnitamisest. Kiirtellimus on saadaval lisatasu eest.
    - q: Kas saan seadmete värve ja brändingut kohandada?
      a: Jah. Kõik paketid sisaldavad täielikku kohandamist — laua värvid, logo trükised ja pakendi kujundus.
    - q: Kas te pakute müügijärgset tuge?
      a: Jah. Iga pakett sisaldab ligipääsu meie veebipõhistele hooldusjuhenditele, videokursustele ja varuosade tellimissüsteemile.
