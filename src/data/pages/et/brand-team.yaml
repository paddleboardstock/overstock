hero:
  tagline: Meie meeskond
  title: Inimesed tagapool Paddle Board Overstock<br />— Vee peal vabaduse insenerimine
  subtitle: Asutatud 2012. aastal Qingdaos, Hiinas, ehitas Paddle Board Overstock koos mereinseneride, materjaliteadlaste ja veespordi entusiastidega, kes uskusid professionaalse tasemega täispuhutavate veesõidukite kättesaadavusse kogu maailmas.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock kogu meeskonna foto — insenerid, tootmine ja juhtkond
founding:
  tagline: Meie asutamine
  title: Rannikutöökojast<br />12 000 m² rajatiseni
  subtitle: Paddle Board Overstock asutas meeskond mereinsenere, kellel olid aastakümnete kogemused täispuhutavate paatide disainis, PVC/Hypalon tootmises ja globaalsete merevarustuse tootmises.
  items:
    - title: 'Asutatud: 2012'
      description: Asutatud Qingdaos, Hiinas — suurel merenduskeskusel, millel on sügav laevade ehitamise pärand.
      icon: tabler:calendar
    - title: 200–300 töötajat
      description: Sealhulgas 50+ teadus- ja arendustinseneri, kvaliteedikontrolli spetsialisti ja tootmistehniku arv.
      icon: tabler:users
    - title: 12 000 m² rajatis
      description: Pühendatud tootmishooned, kus on 6 tootmisliini RIBs, täispuhutavate paatide ja SUP laudade jaoks.
      icon: tabler:building-factory
    - title: 50+ teenindatud riiki
      description: Eksport Euroopasse, Ameerikasse, Lähis-Itta, Aasia-Vaikse ookeani piirkonda ja Aafrikasse.
      icon: tabler:globe
leadership:
  tagline: Juhtimine
  title: Juhtimine ja insenertehniline juhtkond
  subtitle: Meie juhtkond koondab sügava mereinseneri, rahvusvahelise kaubanduse ja kvaliteedijuhtimise teadmised.
  columns: 3
  items:
    - title: Asutaja ja tegevjuht
      name: Toby Liu
      description: 15+ aastat meretööstuses. Varem juhtis teadus- ja arendustegevust suures Hiina paaditootjas. Omab mitmeid patente täispuhutavate paadidisaini valdkonnas.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Peainsener
      name: Zhang Wei
      description: 20+ aastat PVCHypalon tootmises ja sügava V kere disainis. Endine tehniline direktor Euroopa mereinsenerifirmas.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Teadus- ja arendusjuht
      name: Chen Ming
      description: Materjaliteaduse doktorikraad. Spetsialiseerunud drop-stitch tehnoloogiale ja kõrgsageduslikule keevitusprotsessile. 10+ aastat tekstiilist komposiitide kogemust.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Tootmisdirektor
      name: Liu Qiang
      description: 18 aastat lean-tootmise ja tootmisliinide optimeerimise kogemust. Six Sigma Must Vöö. Rakendanud ISO 9001 kvaliteedisüsteeme.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Kvaliteedijuht
      name: Wang Fang
      description: 12+ aastat merekvaliteedi kontrollis. CE Sertifitseeritud ja ISO audiitor. Jälgib iga tootmispartii testimist.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Müük ja operatsioonide direktor
      name: Helen Lee
      description: 15+ aastat B2B rahvusvahelises kaubanduses. OEMJuhtinud /ODM partnerlusi 30+ riigis. Valdab vabalt 4 keelt.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Disaini filosoofia
  title: Inseneriplatvormil põhinev disain<br />— Iga detail loeb
  subtitle: Meie insenerifilosoofia keskendub kolmele põhimõttele, mis juhivad iga meie toodet.
  list:
    - 'Usaldusväärsus Esiteks: Iga toode testitakse, et taluda reaalse maailma tingimusi — alates külma vee päästeoperatsioonidest kuni troopiliste kuurortide rentimisteni. Me liigsefarmeerime seal, kus see kõige rohkem loeb.'
    - 'Tootmise täpsus: Meie tehased kasutavad lõikamist, kõrgsageduskeevitamist ja automaatset survetestimist. Iga õmblus, iga klapp, iga ühendus vastab dokumenteeritud spetsifikatsioonidele.'
    - 'Jätkuv innovatsioon: Meie R&D meeskond hindab pidevalt uusi materjale, tootmismeetodeid ja disaini täiustusi. Me ei oota probleeme — me ennustame neid.'
