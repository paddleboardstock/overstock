hero:
  tagline: Aquafarer Kohandatud Labor
  title: Disaini Oma<br />Veeseade
  subtitle: OEM, ODM, eramärgi ja kohandatud brändingu teenused üle kogu maailma ettevõtetele. Ühest prototüübist kuni täielike tootmistsükliteni.
  cta: Alusta oma projekti
  footer_link: /contact
steps_section:
  tagline: Kuidas see toimib
  title: Kontseptsioonist tootmiseni
  subtitle: Neli sammu sinu ideest valmis, meresõidukiks valmis tootenideni.
  steps:
    - num: '01'
      title: Vali oma lauad
      desc: Vali meie põhimudelite hulgast — SUP, kajak, paatk või RIB. Vali suurus, materjal ja värv.
    - num: '02'
      title: Laadi üles oma disain
      desc: Saada meile oma logo, kunstiteos või brändijuhised. Meie disainimeeskond valmistab digitaalproovi.
    - num: '03'
      title: AI-maketi ülevaatus
      desc: Vaata fotorealistlikku AI-genereritud maketti oma kohandatud lauast enne tootmise algust.
    - num: '04'
      title: Tootmine ja kohaletoimetamine
      desc: Kui tellimus on kinnitatud, läheb see meie ISO-sertifitseeritud tootmisliinile. Tarneaeg alates 30 päevast.
services_section:
  tagline: Teenused
  title: Tootmisteenused globaalsele brändile
  subtitle: Paindlikud kaasamise mudelid — lepingulise tootmise ja täisteenust brändi loomise vahel.
  items:
    - title: OEM Tootmine
      desc: Me valmistaeme sinu disainid vastavalt spetsifikatsioonile — sinu IP, sinu joonised, sinu kvaliteedistandardid. Täielik NDA kaitse.
      icon: ⚙️
    - title: ODM Lahendused
      desc: Vali 50+ tõestatud platvormi hulgast ja kohanda suurust, värvi, graafikat ja pakendit.
      icon: 🎨
    - title: Erabränd
      desc: Sinu bränd meie toodetel — logo, pakend, riputuskaardid, juhendid. Poeriiulile valmis karbist välja.
      icon: 🏷️
    - title: Kohandatud brändimine
      desc: Laeka mattide trükk, kere graafika, toru kleebised ja kohandatud sildid — täielik brändi integreerimine.
      icon: ✨
capabilities_section:
  tagline: Võimalused
  title: Tootmise ja kohandamise võimekus
  subtitle: Kõik, mida pead teadma enne tellimuse esitamist.
  capabilities:
    - label: Tellimuse maht
      value: MOQ 5–10 ühikut (SUP/kajakk), 2–5 ühikut (RIB)
    - label: Tarneaeg
      value: 30–45 päeva tavaliselt; 15–20 päeva prototüüpide jaoks
    - label: Kohandamine
      value: Suurus, kuju, värv, graafika, pakend, riistvara
    - label: Materjalid
      value: PVC, Hypalon, drop-stitch, klaaskiud, alumiinium
    - label: Trükkimine
      value: Digitaalne (CMYK), siiditrükk, termotransfer, sublimatsioon
    - label: Sertifitseerimine
      value: CE, ISO 9001, BSCI, UKCA (toetab ülemaailmset vastavust)
why_section:
  tagline: Miks Aquafarer
  title: Üks tehas. Üks standard. Null kompromisse.
  points:
    - text: 12 000 m² integreeritud tootmisüksus
      highlight: 12 000 m²
    - text: 200–300 oskustöölised ja insenerid
      highlight: 200-300
    - text: 15 000 paati toodetakse aastas
      highlight: 15,000
    - text: ISO 9001 sertifitseeritud kvaliteedijuhtimine
      highlight: ISO 9001
    - text: CE sertifitseeritud tooted EL turule
      highlight: CE
  cta: Vaata tehase üksikasju
  cta_link: /factory
  contact:
    title: Valmis arutama oma projekti?
    desc: Meie meeskond vastab 24 tunni jooksul esialgse hinnapakkumisega.
