stories:
  tagline: Explorer-lood
  title: Tõelised seiklused päris inimestelt
  subtitle: Kuula aerutajaid, peresid ja spetsialiste, kes kasutavad Paddle Board Overstock varustust vees.
  items:
    - name: Sarah ja Mike
      title: SUP Explorer 11 omanikud, Kanada
      content: Võtsime oma Explorer 11-d nädalasele reisile läbi Algonquin Parki. Nad said suurepäraselt hakkama portaaže ja järveületusi. drop-stitch Ehitus võimaldas meil täituda PSI 15-ni ja saada kõva laua jõudlust pakitava lauaga.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Cheetah Surge ratsanik, Hispaania
      content: Cheetah Surge on minu lemmik rannikukruiisideks. Elav disain tõmbab rannas pilke ja stabiilsus annab mulle enesekindlust kerge lõikega. See juhitavus on imeilus nii reisil kui lihtsalt päikeseloojangut nautimas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Hispaania
    - name: Lina ja perekond
      title: Voolavad lootose aerutajad, Rootsi
      content: Nädalavahetuse pere seiklused saarestikul. Voolav Lootos on piisavalt stabiilne, et mu tütar saaks sellel seista, kuni mina aerutan. Täitub alla 10 minuti — haagist pole vaja, lihtsalt puhas perelõbu vees.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholmi saarestik, Rootsi
    - name: Leitnant-komandör Andres
      title: Ocean Voyager uurija, Filipiinid
      content: Kasutan oma Ocean Voyagerit pikkadel rannikureisidel Palawani ümbruses. Pärast kuid kestnud igapäevast kasutamist troopilistes tingimustes töötab laud endiselt nagu uus. Matka kuju lõikab läbi lõike, mis peataks nõrgemad lauad.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipiinid
    - name: Emma T.
      title: Tropical Breeze esimene kord, Austraalia
      content: Ma polnud kunagi varem SUP-ga sõitnud. Tropical Breeze on nii stabiilne, et tundsin ennast esimesel korral kindlalt. Nüüd sõuan igal nädalavahetusel. Õppimiskõver on praktiliselt null — ja laud näeb vees hämmastav välja.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Austraalia
