content_customer_types:
  tagline: Keda me teenindame
  title: Ehitatud B2B ostjatele<br />— Mitte jaemüügikülastajad
  subtitle: Aquafarer toodab neljale klienditüübile. Igalühel on erinevad prioriteedid, ja me tegeleme kõigiga.
  items:
    - title: Brändiomanikud / Eranimi
      description: Kohandatud tootedisain, privaatmärgisega graafika, teie brändi all vastavusdokumentatsioon ning pühendunud inseneritugi alates kontseptsioonist kuni konteinerini.
      icon: tabler:palette
      cta: Taotlus OEM/ODM Tsitaat
      cta_href: /request-quotation
    - title: Edasimüüjad / hulgimüüjad
      description: Territooriumi kaitse, konkurentsivõimeline hulgihinnastamine, turundustoe komplektid, tootekoolitus ja täielik vastavusdokumentatsioon teie turule.
      icon: tabler:world
      cta: Kandideeri edasimüüjaks
      cta_href: /dealers-distributors
    - title: Kuurordid / rendioperaatorid
      description: Kaubandusliku taseme vastupidavus, autopargi suuruse nõuanded, segamudelite konteineritellimused, varuosade strateegia ja kuurordi kaubamärgiga varustuspaketid.
      icon: tabler:beach
      cta: Hangi kommertspakett
      cta_href: /solutions/resorts
    - title: Pääste / Valitsus / Professionaalne
      description: Hypalon/CSM ehitus, SOLAS vastavusvõimalused, projektipõhine sertifitseerimine, hankedokumentatsiooni tugi ja NDA-kaitstud inseneritöö.
      icon: tabler:shield
      cta: Arutle projekti üle
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Võimekus
  title: Mida sa saad<br />kus Aquafarer
  subtitle: Otsene juurdepääs tehasele koos täieliku inseneri-, kvaliteedi- ja vastavustoega — mitte kaubandusettevõte.
  columns: 2
  items:
    - title: OEM/ODM Kohandamine
      description: Eritellimusel kere disain, torumaterjal (PVCvõi Hypalon/CSM), konsooli paigutus, istmed, bränding, värvid ja pakendamine. Alates väikestest muudatustest kuni täieliku eritellimusel inseneritööni.
      icon: tabler:adjustments
    - title: MadalMOQ, kiire proovivõtt
      description: 'RIB: 2-5 ühikut (olemasolev vorm). SUP: 5-10 ühikut SKUiga kohta. Eritellimusel vormid: 200+ ühikut. Eeltootmise näidised koos brändinguga 7-14 päevaga.'
      icon: tabler:rocket
    - title: Tootmisvalmis kvaliteet
      description: Iga ühik on rõhutestitud 1,25x-ga, PSI hinnatud 24–48 tunniks. 99,3% defektivaba määr AQL 2,5 / ISO 2859 kohta. 100-punktiline kvaliteedikontrollnimekiri kere kohta.
      icon: tabler:certificate
    - title: Täielik vastavusdokumentatsioon
      description: CE Vastavalt 2013/53/EU (RCD), ISO 9001:2015 SGS(), BSCI sotsiaalaudit, REACH vastavus, UKCA märgistus. Mudelispetsiifilised DoC ja ehitajaplaadi andmed.
      icon: tabler:file-certificate
    - title: 30–45-päevane ettevalmistusaeg
      description: Standardtootmine 30–45 FOB päeva Qingdao. Prototüübid 7–14 päeva. Kiirtootmine on saadaval. Konteinerite laadimisplaanid ja ISPM-15 kastimine kaasas.
      icon: tabler:truck-delivery
    - title: Järelmüük ja varuosad
      description: 5-aastane garantii paatidele/RIBskajakkidele/, 2-aastane SUP/tarvikutele. Varuosade tarnimine koos prioriteetse saatmisega. Garantiinõuete töötlemise tugi.
      icon: tabler:lifebuoy
content_categories:
  tagline: Tootekategooriad
  title: 5 kategooriat,<br />64 CE- Sertifitseeritud mudelid
  subtitle: Alates 2,4 m RIB tenderitest kuni 15 SUP jalga laudadeni — kõik toodetud meie Qingdao ISO 9001 tehases.
  items:
    - title: RIB Paadid
      description: 2,4 m kuni 7,0 m alumiinium- või GRP-kerega. PVC või Hypalon/CSM torud. CE vastavalt 2013/53/EL. Patruuli-, sukeldumis-, pääste- ja kaubanduslikud konfiguratsioonid.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Täispuhutavad paadid
      description: 2,0 m kuni 5,0 m alumiiniumpõranda, vineerpõranda või õhupõhjaga valikutega. Kalastamis-, vaba aja veetmise ja abipaadi mudelid.
      icon: tabler:sailboat
      link: /products
    - title: SUP Lauad
      description: 9 jalga kuni 15 jalga 4-tolliste ja 6-tolliste Drop-Stitch juures. Ümara, turismi-, jooga- ja kalapüügimudelid. Saadaval kaubanduslikus kvaliteedis.
      icon: tabler:swimming
      link: /products
    - title: Kajakid
      description: 1-kohaline kuni 3-kohaline täispuhutav kajakk. Vaba aja veetmise ja ringreiside mudelid koos Drop-Stitch põrandavalikutega.
      icon: tabler:kayak
      link: /products
    - title: Ohutustarvikud
      description: CE-sertifitseeritud päästevestid, viskeraamid, remondikomplektid, pumbad ja navigatsioonituled. USCG Tüüp III/V heakskiidetud PFD-d.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Tehase tugevus
  title: Auditi-valmis tootmine<br />Qingdaos
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001 rajatis — tõeline tootja, mitte kaubandusettevõte</h3>
  items:
    - title: 6 pühendatud tootmisliini
      description: Eralda RIB, kummipaat, SUP, kajak, ohutusseadmed ja OEM/ODM liinid. Igalühel on oma pühendatud QC kontrollpunktid ja tootmise planeerimine.
    - title: 100% rõhukontrollitud
      description: Iga täispuhutav kamber on surve all 1,25 korda nimiväärtusest PSI ja hoitakse 24–48 tundi. Katsetulemused on seotud kere seerianumbriga (HIN).
    - title: Hull-i jälgitavus
      description: 'HIN-taseme tootmisandmed, millel on 21+ andmevälja iga kere kohta: materjalier, keevitaja ID, rõhu katsetulemus, lõplik konfiguratsioon ja tarnekoht.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12 000 m² ISO 9001 tootmisüksus Qingdaos koos RIB tootmisliinidega
content_compliance:
  tagline: Vastavus ja kvaliteedi tõend
  title: Dokumenteeritud tõendid<br />Mitte ainult nõuded
  subtitle: Iga vastavusnõue on toetatud mudelispetsiifilise dokumentatsiooniga, mis on teie kontrollimiseks kättesaadav.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Kvaliteedijuhtimissüsteem sertifitseeritud TÜV Rheinland/SGS. Aastased järelevalveaudid. Dokumenteeritud kvaliteedikontrolli protsessid alates saabuvast materjalist kuni saadetise vabastamiseni.
      icon: tabler:certificate
    - title: CE vastavalt 2013/53/EL (RCD)
      description: 64 mudelit mudelispetsiifiliste vastavusdeklaratsioonidega. Vastavushindamine vastavate moodulite alusel. HIN-i registreerimine ja ehitaja plaadi andmed iga kere kohta.
      icon: tabler:file-certificate
    - title: BSCI Sotsiaalne vastavus
      description: Aastane BSCI audit SGS poolt. Kontrolliti eetilisi tööpraktikaid, töökohaturvalisust ja keskkonnajuhtimist kogu meie rajatises.
      icon: tabler:users
    - title: REACH & UKCA
      description: Kõik PVC ja liimimaterjalid vastavad ELi REACH määrusele. UKCA märgistamine saadaval Ühendkuningriigi turule. Materjalide ohutuskaardid on saadaval päringu alusel.
      icon: tabler:shield-check
steps:
  title: OEM/ODM protsess — lühikirjeldusest konteinerini
  items:
    - title: Samm 1:<span class="font-medium">Nõuded</span>
      description: Jagage oma toote spetsifikatsioone, sihtturgu, kogust ja nõuetele vastavust. Meie insenerimeeskond vaatab selle üle 48 tunni jooksul.
      icon: tabler:file-text
    - title: Samm 2:<span class="font-medium">Ettepanek</span>
      description: Saage üksikasjalik ettepanek spetsifikatsioonide, materjalivalikute, MOQ, hindade, tarneaja ja teie turu nõuetele vastavuse ulatuse kohta.
      icon: tabler:clipboard-list
    - title: 3. samm:<span class="font-medium">Prototüüp</span>
      description: Eeltöötluse proov teie brändiga 7–14 päeva jooksul. Täielik kvaliteeditestimine 1,25-kordse nimirõhu juures. Proovi maksumus krediteeritakse tootmise arvelt.
      icon: tabler:settings
    - title: Samm 4:<span class="font-medium">Tootmine</span>
      description: 30–45 päeva tootmine FOB Qingdaos pärast proovi kinnitamist. Tootmisprotsessi kvaliteedikontrolli kontrollpunktid, rõhukatsed ja iga üksuse 100-punkti lõplik kontroll.
      icon: tabler:building-factory
    - title: Samm 5:<span class="font-medium">Kohaletoimetamine</span>
      description: Konteineri laadimisplaan, ISPM-15 puidust kastimine, vastavusdokumentide pakett ja FOB Qingdao saatmine koos kõigi ekspordipaberitega.
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer OEM/ODM kummipaadi tootmisprotsess disainist konteinerisaatmiseni
blog_latest:
  title: Tööstuse ja tehnilised teadmised
  information: |
    RCD vastavusjuhendid, OEM/ODM protsessiartiklid, materjalide võrdlused,
    ja tehase kontrolli ressursid Aquafarer insenerimeeskonnast.
faqs:
  title: B2B Hangete KKK
  subtitle: Tavapärased küsimused brändidelt, distributsitelt ja kommertsettevõtetelt seoses Aquafarer abil OEM/ODM tootmisega.
  columns: 2
  items:
    - title: Kas te olete tootja või kaubandusettevõte?
      description: Me oleme vertikaalselt integreeritud tehas, millel on täielik kontroll kvaliteedi, materjalide ja tarneaegade üle. Ärilitsents ja tootmismaht on tehaste auditi käigus kontrollitavad.
      icon: tabler:building-factory
      category: all
    - title: Mis on teie OEM/ODM protsess?
      description: Nõuete ülevaade (48h) pakkumisest prototüübini (7-14 päeva) tootmiseni (30-45 päeva FOB Qingdao). Täielik inseneritugi, vastavusdokumentatsioon ja jälgitavus iga kere kohta kogu protsessi vältel.
      icon: tabler:route
      category: all
    - title: Millised on teie MOQ nõuded?
      description: 'RIB paadid: 2-5 ühikut mudeli kohta (olemasolev vorm), 200+ kohandatud vormide puhul. SUP lauad: 5-10 ühikut SKU kohta. Segamudelite konteiner tellimused saadaval. Proovitellimused 2-5 ühikut hindamiseks.'
      icon: tabler:sort-ascending
      category: all
    - title: Millised kohandamisvõimalused on saadaval?
      description: Hull disain, toru materjal (PVC või Hypalon/CSM), toru diameeter, konsooli paigutus, istmed, roolimine, kütusesüsteem, teki paigutus, brändi värvid, logo graafika, EVA padja disain, jaemüügi pakend, ja omaniku käsiraamatu bränding.
      icon: tabler:adjustments
      category: all
    - title: Milliseid vastavusdokumente saate minu turule esitada?
      description: CE DoC vastavalt 2013/53/EL, UKCA märgis, ISO 9001 sertifikaat (SGS), BSCI auditiaruanne, REACH vastavus, materjalide testiaruanded, survekatsete logid ja mudelispetsiifilised tootja plaadi andmed. Turuspetsiifiline dokumentatsioon on saadaval päringu alusel.
      icon: tabler:file-certificate
      category: all
    - title: Mis on proovi ja tootmise tarneaeg?
      description: 'Eeltoodangu proovide valmistamine: 7-14 tööpäeva. Standardtööstus: 30-45 päeva FOB Qingdao. Kiirtöötlus saadaval lisatasu eest. Tipphooaeg (märts-juuni) võib pikendada tarneaegu.'
      icon: tabler:clock
      category: all
    - title: Kas ma saan korraldada tehaseauditi või reaalajas videotuuri?
      description: Jah. Kohapealsed tehaseauditid meie Qingdao rajatises on teretulnud 3–5 päeva ette teatamisega. Otsevideo tuurid WhatsAppi/Zoomi kaudu on kohe saadaval. Kolmandate osapoolte inspekteerimised (SGS, BV, TÜV) on võimalik korraldada.
      icon: tabler:video
      category: all
    - title: Milliseid kvaliteedikontrolle tehakse enne saatmist?
      description: 1,25-kordse nimirõhu vastupidavustest (24–48 tundi), õmbluse koorumise testimine, 100-punkti lõplik kontrollnimekiri, mõõtmete kontroll, kosmeetiline kontroll, vastavusdokumentide kontroll ja pakendi terviklikkuse kontroll. Kõik vastavalt ISO 9001 protseduuridele.
      icon: tabler:clipboard-check
      category: all
