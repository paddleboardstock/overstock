content_customer_types:
  tagline: Keda me teenindame
  title: Lauad kõigile<br />Sooline aerutaja
  subtitle: Kas see on teie esimene seanss või viiekümnes, on olemas kergituslaud, mis sobib teie aerutamisstiiliga.
  items:
    - title: Algajad
      description: Ekstra-laiad, stabiilsed kõik-ühes lauad, mis teevad teie esimese sessiooni lihtsaks — enamik esmakordseid seisab üles mõne minuti jooksul.
      icon: tabler:swimming
      cta: Osta algajasõbralik SUPs
      cta_href: /supboard
    - title: Pered
      description: Stabiilsed lauad, mida kogu pere saab jagada, pluss kergemad laste mudelid — varustus, mis mahub autosse ja täitub vähem kui minutiga.
      icon: tabler:beach
      cta: Osta perepaketid
      cta_href: /products
    - title: Tuuri- ja fitness-sõudjad
      description: Pikemad, kiiremad tuurilaudade ja täislaagiga jooga platvormid sõudjatele, kes lähevad kaugemale.
      icon: tabler:route
      cta: Osta tuuri- ja joogalauad
      cta_href: /supboard
    - title: Kalamehed
      description: Ülimalt stabiilsed platvormid varustuse kinnituste ja piisava jahediku ruumiga — heida õnge vaiksel, tasasel laual.
      icon: tabler:lifebuoy
      cta: Osta kalapüügiks SUPs
      cta_href: /products
features:
  id: features
  tagline: 'Miks osta Paddle Board Overstock K:'
  title: Tõeline tehas,<br />Tõelised säästud
  subtitle: Tehase otse ülejäägi- ja sooduspakkumised SUP — sertifitseeritud kvaliteet ilma jaemüügi juurdehindluseta.
  columns: 2
  items:
    - title: Kuni 60% soodsam jaemüügist
      description: Müüme tehase ülejääki ja sooduspartisid otse — ilma vahendajate ja jaemüügi juurdehindluseta. Samad lauad, mis mujal täishinnaga müüakse, siin soodushinnaga.
      icon: tabler:rocket
    - title: Täispaketid
      description: 'Iga SUP tuleb koos täispaketiga: laud, reisikott, käsipump, reguleeritav aer, eemaldatav uime, rullikukaelarihm ja remondikomplekt.'
      icon: tabler:clipboard-list
    - title: Sertifitseeritud kvaliteet
      description: 13 CE-sertifitseeritud SUP mudelit vastavalt kehtivatele EL-i direktiividele. Iga laud on enne saatmist 100% survekatsetatud 1,25x nimiväärtusest PSI. 99,3% defektivaba määr vastavalt AQL 2.5.
      icon: tabler:certificate
    - title: Pole MOQ — telli üks laud
      description: Ülejäägi soodusmüük tähendab, et ühe ühiku tellimused on teretulnud. Lisa laud ostukorvi, vormista tellimus, valmis. Pole minimaalset tellimusmahtu, pole hinnapakkumise protsessi.
      icon: tabler:adjustments
    - title: Kiire ülemaailmne saatmine
      description: Lao tellimused saadetakse Weihai'st 2-3 tööpäeva jooksul. Jälgitav kohaletoimetamine 50+ riiki üle EL-i, Põhja-Ameerika, Aasia-Vaikse ookeani piirkonna ja kaugemale.
      icon: tabler:truck-delivery
    - title: 2-aastane SUP garantii
      description: Iga SUP laud ja tarvik on kaetud 2 aastat — drop-stitch õmblused, täiteventiilid ja tarvikud kaasatud. Nõuded lahendatakse päevade jooksul, mitte nädalate jooksul.
      icon: tabler:lifebuoy
content_categories:
  tagline: Tootekategooriad
  title: Üks tootesari,<br />tehtud õigesti
  subtitle: Täispuhutavad SUP lauad ja tarvikud — kõik ehitatud meie Weihai ISO 9001 tehases.
  items:
    - title: SUP Lauad
      description: Kõik-ühes täispuhutav SUPs 9 kuni 12 jalga. Stabiilne, vastupidav ja komplekteeritud pumba, aeru, rihma ja seljakotiga.
      icon: tabler:swimming
      link: /supboard
    - title: Ringreis SUPs
      description: Pikemad, kiiremad lauad turismikujundusega järvede, jõgede ja ranniku avastamiseks.
      icon: tabler:route
      link: /supboard
    - title: Jooga ja fitness SUPs
      description: Eriti laiad, ülestabiilsed platvormid täispikkade tekipadjadega jooga ja treeningute jaoks vees.
      icon: tabler:users
      link: /supboard
    - title: Lapsed SUPs
      description: Kergemad, lühemad lauad, mis on mõeldud lastele — sama drop-stitch kvaliteet lapsele sobivas pakendis.
      icon: tabler:lifebuoy
      link: /products
    - title: Aksessuaarid
      description: Pumbad, aerud, päästevestid, rihmad, remondikomplektid ja varuosad iga meie müüdava lauaga.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Tehase tugevus
  title: Miks meie allahindluse hinnad<br />On tõelised
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Tõeline tehas, tõelised säästud — iga plaat saadetakse meie Weihai tehases</h3>
  items:
    - title: Sama tootmisliinid nagu suurbrändidel
      description: Meie 12 000 m² suurune Weihai tehas valmistab samadel liinidel ja samade materjalidega plaate rahvusvahelistele kaubamärkidele ning meie enda ülejäägihulgadele.
    - title: 100% rõhukontrollitud
      description: Iga plaati rõhutatakse 1,25-kordselt nimiväärtusele PSI ja hoitakse enne saatmist. 99,3% defektivaba määr iga AQL 2,5 / ISO 2859.
    - title: Ilma vahendajateta
      description: Laudade tehase otsene tarnimine teie ukse taha. Ei mingeid jaotajate lisahindu, ei jaemüügi lisahindu — sellepärast jäävad soodusmüügihinnad kuni 60% alla jaehinna.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² Weihai tehas koos õhutatavate SUP tootmisliinidega
content_compliance:
  tagline: Vastavus ja kvaliteedi tõend
  title: Sertifitseeritud kvaliteet,<br />Dokumenteeritud
  subtitle: Iga vastavusnõude väide on toetatud sertifikaatide ja mudelispetsiifilise dokumentatsiooniga, mis on teie kontrolliks saadaval.
  items:
    - title: ISO 9001:2015
      description: Kvaliteedijuhtimissüsteem sertifitseeritud TÜV Rheinland/SGS. Aastased järelevalveaudid. Dokumenteeritud kvaliteedikontrolli protsessid alates saabuvast materjalist kuni saadetise vabastamiseni.
      icon: tabler:certificate
    - title: CE Sertifitseeritud
      description: 13 CE-sertifitseeritud SUP mudelit vastavalt kohaldatavatele ELi direktiividele, igaühel mudelispetsiifiline vastavusdeklaratsioon ja tootmisplaadi andmed.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Kõik PVC ja liimimaterjalid vastavad ELi REACH määrusele. UKCA märgistus saadaval Suurbritannia turule. Materjalide ohutuskaardid on saadaval päringu alusel.
      icon: tabler:shield-check
    - title: 2-aastane SUP garantii
      description: Iga SUP laud ja lisatarvik on kaetud 2 aastaks — drop-stitch õmblused, inflatsiooniklappide ja lisatarvikud kaasatud. Nõuded lahendatakse kiiresti.
      icon: tabler:lifebuoy
steps:
  title: Alates kassast kuni veeni — kuidas sinu tellimus saadetakse
  items:
    - title: Samm 1:<span class="font-medium">Vali oma laud</span>
      description: Vali mitmekülgse, matka-, jooga- ja laste mudelite vahel. Meie ostujuhendid aitavad sul sobitada laua suuruse ja stiili oma aerutamisega.
      icon: tabler:clipboard-list
    - title: Samm 2:<span class="font-medium">Turvaline väljamakse</span>
      description: Maksa turvaliselt Stripe'i või PayPal'iga. Kõik suuremad krediit- ja deebetkaardid on aktsepteeritud. Konto pole vaja — tellimuse kinnitus jõuab sinu postkasti.
      icon: tabler:file-text
    - title: 3. samm:<span class="font-medium">Kvaliteedikontroll</span>
      description: Iga plaat on 100% survetestitud 1,25x PSI väärtusega ja kontrollitud täieliku kvaliteedikontrollnimekirjaga enne pakkimist.
      icon: tabler:settings
    - title: Samm 4:<span class="font-medium">Kiirdispetšer</span>
      description: Laos olevad tellimused saadetakse meie Weihai tehasest 2–3 tööpäeva jooksul. Kiireloomuliste tellimuste puhul on võimalik kiire käitlemine.
      icon: tabler:building-factory
    - title: Samm 5:<span class="font-medium">Roomikuga kohaletoimetamine</span>
      description: Jälgitud ülemaailmset saatmist 50+ riiki. Teie 2-aastane garantii ja kiire järelteenindus algavad kohe, kui teie laud kohale jõuab.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Tellimisprotsess alates turvalisest kassast kuni jälgitava ülemaailmse kohaletoimetamiseni
blog_latest:
  title: SUP Juhendid ja tehnilised teadmised
  information: |
    Ostujuhised, aerutamistehnika, ohutuse põhitõed ja ehitus
    Paddle Board Overstock Meeskonna uurimistöö.
faqs:
  title: SUP Tellimine ja toodete KKK
  subtitle: Levinumad küsimused meie SUP allahindlustahvlite, tellimuste, maksete, saatmise ja garantii kohta.
  columns: 2
  items:
    - title: Kas SUP on raske õppida?
      description: Sugugi mitte. Enamik algajaid tõuseb püsti ja sõuab juba esimesel treeningul. Meie SUP mitmekülgsed lauad on varustatud eriti laia stabiilse platvormiga, mis on spetsiaalselt mõeldud esmakordsetele aerutajatele. Alusta rahulikust veest ja oled juba mõne minutiga juba sõitmas.
      icon: tabler:swimming
      category: sup
    - title: Mis on kaalupiirang?
      description: Meie SUPs üldine tugi kuni 220 naela ning turismi ja jooga platvormid toetavad kuni 250 naela. Iga tooteleht näitab täpset sõitja kaalu, et saaksid lauda oma vajadustele sobitada.
      icon: tabler:adjustments
      category: sup
    - title: Kas ma saan reisida täispuhutava SUP-ga?
      description: Täpselt nii. Iga Paddle Board Overstock laud mahub seljakoti suurusesse kandekotti. Kaaludes vaid 18–22 naela, on seda lihtne kaasa võtta randa, järvele või lennujaama terminali. Kontrolli enne reisi oma lennufirma pagasipoliitikat.
      icon: tabler:truck-delivery
      category: sup
    - title: Mis karpi tuleb?
      description: Kõik Paddle Board Overstock SUP sisaldab lauda, reisiseljakotti, käsipumpa, reguleeritavat aeru, eemaldatavat finaali, spiraalrihma ja remondikomplekti.
      icon: tabler:clipboard-list
      category: sup
    - title: Miks on teie hinnad jaemüügist madalamad?
      description: Me müüme tehase ülejääke ja kampaaniaeripakkumisi otse oma tootmistehasest Weihais, Hiinas — ilma vahendajateta, ilma jaemüügi hinnalisata. See tähendab täielikke SUP pakette kuni 60% soodsamalt tüüpilistest jaehindadest, samas CE-sertifitseeritud kvaliteediga.
      icon: tabler:certificate
      category: orders
    - title: Kuidas ma tellin ja maksan?
      description: Lisa oma SUP pakk ostukorvi ja tasu turvaliselt Stripe'i või PayPali kaudu. Me aktsepteerime kõiki suuremaid krediit- ja deebetkaarte. Iga tellimus kinnitatakse e-kirjaga koos täieliku arvega.
      icon: tabler:file-text
      category: orders
    - title: Kas te tarnite üle kogu maailma?
      description: Jah. Me tarnime 50+ riiki üle ELi, Põhja-Ameerika, Aasia-Vaikse ookeani piirkonna, Lähis-Ida ja Aafrika. Laos olevad tellimused saadetakse tavaliselt 2-3 tööpäeva jooksul ja iga pakile antakse jälgimiskood.
      icon: tabler:route
      category: orders
    - title: Millise garantiiga SUP plaadid kaasnevad?
      description: 'Iga SUP plaat ja tarvik on kaetud 2-aastase garantiiga — sealhulgas ise plaat, drop-stitch õmblused ja inflatsiooniklappid. Vaidlused lahendatakse päevade, mitte nädalatega: esitage taotlus veebis ja me parandame või asendame.'
      icon: tabler:lifebuoy
      category: orders
