articles:
  sup:
    - title: SUP Alused — Algaja juhend
      desc: Kõik, mida algaja peab teadma — lauade tüübid, reketi suurused, asend ja esimesse päeva nõuanded.
    - title: SUP Suuruse juhend
      desc: Leia õige lauapikkus, -laius ja -maht vastavalt oma kehakaalule, oskustele ja sõudmisstiilile.
    - title: Täispuhutav vs kõva laud
      desc: Milline sobib teile? Kergekantavus, jõudlus, vastupidavus ja hind võrreldud.
    - title: Vahepealsed tehnikad
      desc: Tõsta oma sõudmist kõrgemale tasemele arenenud tõmmete, pööramistehnikate ja karevee käitlemise abil.
    - title: Kuidas valida täispuhutavat SUP
      desc: Liigu läbi peamiste tegurite — konstruktsioon, paksus, tiibade seadistus ja kaasatud tarvikud.
    - title: Veeohutus
      desc: Oluline ohutusalane teadmine, sealhulgas ilma lugemine, PFD valik, enesepäästmine ja grupis aerutamine.
  inflatable-boat:
    - title: Materjalide Viide
      desc: PVC, Hypalon, drop-stitch, denieri hinnangud — saa aru, millest sinu täispuhutav varustus on tehtud.
    - title: PVC vs Hypalon
      desc: Lõplik võrdlus PVC ja Hypalon kangaste vahel täispuhutavate paatide jaoks — vastupidavus, UV vastupidavus ja hind.
    - title: Drop-Stitch Tuum selgitatud
      desc: Kuidas tuhanded sisemised niidid loovad 12–15 PSI juures jäiga platvormi kõrgetasemelise õhkutäitmise SUPs jaoks.
    - title: Täispuhutavate tehnoloogiate ülevaade
      desc: Kuidas on valmistatud kummipaate ja SUPs — alates materjali kihi paigaldusest kuni ventiilisüsteemide ja õmbluste keevitamiseni.
    - title: Jäik-põhja-hõljukpaadi (RIB) juhend
      desc: Kõik, mis puudutab RIB ehitamist, kere tüüpe, torumaterjale ja õige RIB valimist vastavalt teie vajadustele.
    - title: Painduvpaat vs RIB
      desc: Peamised erinevused traditsiooniliste õhkpatjadega paatide ja kõvakere õhkpatjadega paatide vahel erinevates kasutusvaldkondades.
  water-safety:
    - title: Veeohutuse juhend
      desc: Oluline ohutusalane teadmine iga aerutaja jaoks — ilm, PFD-d, eneseräävimine ja rühma aerutamise protokollid.
    - title: Eluvest ja PFD juhend
      desc: Kuidas valida õige isikliku päästevahendi SUP jaoks, kajakisõiduks, paadisõiduks ja professionaalseks kasutamiseks.
    - title: SUP Ohutuskontrollnimekiri
      desc: Eelkäivituse ohutuschecklist, mida iga stand-up lauaga sõitja peaks enne vee peale minekut järgima.
    - title: Külma vee sõudmise ohutus
      desc: Olulised ettevaatusabinõud, varustus ja tehnikad külmas vees sõudmiseks.
    - title: Algaja sõudmisvead
      desc: Levinumad vead, mida esmakordsed sõudjad teevad, ja kuidas neid vältida ohutuma ja nauditavama kogemuse jaoks.
    - title: CE Sertifitseerimine selgitatud
      desc: Mida CE sertifitseerimine tähendab täispuhutavate veesõidukite puhul — standardid, testimine ja miks see ohutuse jaoks oluline on.
