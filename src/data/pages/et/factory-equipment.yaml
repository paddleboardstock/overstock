hero:
  tagline: Varustus
  title: Tootmisvahendid ja masinad
  subtitle: Tööstuslikud seadmed lõikamiseks, keevitamiseks, trükkimiseks ja kokkupanekuks
  back_label: Tagasi tehasesse
  back_link: /factory
categories:
  - title: Lõikamine ja materjali ettevalmistus
    items:
      - name: PVC Automaatne lõikemasin
        spec: CNC-juhtimine, 6,5 m × 2,5 m, 0,1 mm täpsus
        desc: Arvuti juhitav automaatne lõikamismasin PVC, Hypalon ja drop-stitch kangaste jaoks. Paigutustarkvara optimeerib materjali kasutuse alla 5% jäätmeteks.
      - name: Kangasloter
        spec: Maksimaalne laius 3 m, pinget kontrolliv edastus
        desc: Paigutab kangast ühes või mitmes kihis kontrollitud pingega, et vältida lõikamise eelset deformatsiooni.
  - title: Torude keevitamine ja liimimine
    items:
      - name: Kuumatihendamise masin
        spec: Kuumaõhu keevitus, muutuva temperatuuriga 200–600 °C, 0,5–5 m/min
        desc: Kuumaõhu kuumsuletav masin PVC ja Hypalon toruõmbluste liimimiseks ja keevitamiseks. Kasutatakse toru kambrite ja ujuvliidete fikseerimiseks, tihendamiseks ja sulatamiseks.
      - name: Dielektriline RF press
        spec: 15 kW, plaadi suurus 2000 × 600 mm
        desc: Raadiolaine keevituspress pealaagsete ühenduste, üleminekute ja suurte kambri valmistamise jaoks.
      - name: CNC-juhtimisega RF keevitusmasin
        spec: 8 kW, XY-laud 2500 × 1200 mm
        desc: Programmeeritav kõverõmbluse keevitus keerukate geomeetrite, logode pressimise ja täppistööde jaoks.
  - title: RIB kere tootmine
    items:
      - name: Klaaskiust käsitsi paigaldatavad vormid
        spec: Mitmed vormid RIB keerte jaoks kuni 6 m LOA
        desc: Traditsiooniline käsitsi kihtide kerimine klaaskiudvormides polüester ja vinüülester vaigu süsteemidega. Iga kiht rullitakse käsitsi ja vaakumpakendatakse ühtlase laminaadi kvaliteedi ja tugevuse tagamiseks.
      - name: Gelcoat pihustusboksi
        spec: Temperatuurikontrolli, filtreeritud õhu ventilatsioon
        desc: Gelcoat kandmine RIB keredele. Tagab kõrgläike ja UV-kindla pinna koos täpse paksuse kontrolliga.
      - name: CNC freespink (5-teljeline)
        spec: 3 m × 2 m × 1 m tööpiirkond, vesijahutusega spindel
        desc: Kere sisendite, konsoolimallide, istmepõhjade ja eritellimusel kinnituste töötlemine.
  - title: SUP Trükkimine ja kaunistamine
    items:
      - name: Digitaalne printer
        spec: Kõrglahutusega tindiprinter, kuni 2 m printimislaius
        desc: Otse tekstiilile digiprintimine täisvärviliste SUP tekide graafikute jaoks. Trükib kohandatud mustreid, üleminekuid ja fotokvaliteediga pilte UV-kaitstud veepõhiste tintidega.
      - name: Siiditrükimasin
        spec: Manuaalne ja poolautomaatselt mitmevärvilise registeeringuga
        desc: Screeprintimine SUP laudade logode, brändimärkide ja korduvate mustrite jaoks. Tagab vastupidavad, vähem läbipaistvad trükid erksate värvide küllastusega.
  - title: Kokkuühendamine ja seadistamine
    items:
      - name: Mootori tõstuk
        spec: 500 kg kandevõime, reguleeritav tõstekang
        desc: Välismootorite turvaline paigaldamine 2.5–60 hj.
      - name: Konsooli prototüüpraam
        spec: Reguleeritav kõrgus ja nurk
        desc: Rooli, gaasi ja instrumentide paneelide eelpaigaldus enne paigaldamist.
      - name: Hüdraulikavooliku press
        spec: Kuni 1" siseläbimõõt, digitaalse rõhu mõõdikuga
        desc: Kohandatud pikkusega hüdraulilise roolivooliku komplektid tihvtrõngastega.
      - name: Elektriline juhtmestikulaud
        spec: 3 m × 1,5 m, eeltrükitud skeemidega
        desc: Täielike elektrijuhtmestike kokkupanek ja testimine väljaspool paati.
  - title: Testimine ja kvaliteedikontroll
    items:
      - name: Universaalne tõmbetester
        spec: 50 kN, / ASTM D751
        desc: Kangaste partiide katkemisjõu, murdumisel venimise ja rebenemise progresseerumise testimine.
      - name: Õhutiheduse testseade
        spec: Programmeeritav, 30-minutiline rõhu hoidmine
        desc: Automatiseeritud rõhuhoiu test iga torukambri jaoks enne kokkupanekut.
      - name: Õmbluse koorijatester
        spec: Motoriseeritud 180° koorimine 100 mm/min
        desc: Keevituse ja liimitud õmbluste koorumisjõu testimine vastavalt ISO 6185.
      - name: Ksenoon-kaare ilmastikuandmekamber
        spec: 2000-tunnine kokkupuude
        desc: UV vastupidavuse testimine värvimuutuse ja tugevuse säilimise osas.
