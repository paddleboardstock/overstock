content_customization:
  tagline: Mida saab kohandada
  title: RIB Kohandamine<br />Valikud
  subtitle: Iga RIB paadi osa saab kohandada vastavalt sinu rakendusele, turule ja brändinõuetele.
  items:
    - title: Kere ja konstruktsioon
      description: Kere pikkus (2,5–8,5 m), kere materjal (GRP klaaskiust või merendusklassi alumiinium), kere värv (geelikott või värvitud), kiiluprofiil (sügav V, mõõdukas V, lame), tagumise osa tüüp (suletud tagumine konsteini või kaevuga) ning konstruktsiooniline tugevdus kommertskoormuse nõuete jaoks.
      icon: tabler:sailboat
    - title: Toru ja krae
      description: Toru materjal (0,9–1,2 PVC mm või 1,4–1,7 Hypalonmm /CSM), toru läbimõõt (40–55 cm), kambrite arv (3–7), klapitüüp (Halkey-Roberts, Leafield D7 või Boston), toru värv (standardne või eritellimusel) ning krae koonuse/koonuse konfiguratsioon.
      icon: tabler:circle
    - title: Decki ja konsooli paigutus
      description: Keskkonsool, külgkonsool või roolijuhtimine. Istmete paigutus (jockey istmed, pingiistmed, tugiistmed). Terrassikate (EVAvahttikk, libisemiskindel värv või paljas GRP). Seadmete paigalduspunktid, haaramisrööpad ja D-rõnga asendid.
      icon: tabler:layout-dashboard
    - title: Elektri- ja navigatsioon
      description: Navigatsioonituled (LED), pilsipumpade süsteem, aku haldus, VHF-raadio paigaldus, GPS/kaardiplotteri paigaldus, USB laadimispordid ja lülitipaneeli konfiguratsioon.
      icon: tabler:bolt
    - title: Bränding ja graafika
      description: Kere- ja torugraafika (siiditrükk, soojusülekanne, UV digitaaltrükk), logo paigutus, eritellimusel värviskeemid, identifitseerimismärgised ja isiku eritellimusel dokumentatsioon sinu brändiga.
      icon: tabler:palette
    - title: Ohutus ja vastavus
      description: Disainikategooria hinnang (A/B/C/D per RCD), tulekustutussüsteem, kütusesüsteemi spetsifikatsioon (kaasaskantav paak, fikseeritud paak, alltek) ja vastavusdokumentatsiooni pakett teie sihtturule.
      icon: tabler:shield
content_applications:
  tagline: Rakenduse konfiguratsioonid
  title: RIB Konfiguratsioonid<br />Rakenduse järgi
  subtitle: Erinevad missioonid nõuavad erinevaid konfiguratsioone. Siin on tõestatud seadistused kõige levinumate RIB rakenduste jaoks.
  items:
    - title: Pääste ja patrull
      description: Deep-V kere, Hypalon torud, iseliikuv tekk, tugiistmed, haaramiskäepidemed, navigatsioonituled ja raskeveokite D-rõngad.RCD Disainikategooria B või C. Tulekindel kütusesüsteem ja kommertsklassi elektrisüsteem.
      icon: tabler:lifebuoy
    - title: Sukeldumistoetus
      description: Lai tala, tagumine redel, tankiraami asend, lisarõngad D-rõngad, sukeldumislipu kinnitus, tugevdatud ahtri kahe välimootori jaoks ja libisemiskindel täisteki EVA kate.
      icon: tabler:mask
    - title: Turism ja kaubandus
      description: Reisijatele sertifitseeritud paigutus, kus on pingiistmed, päikesevarju/Bimini, haarderaamid, kuivladustamine ja kahekordne akusüsteem.RCD Kategooria C. Mõeldud kuurordi- ja tšarterlennukiparkide jaoks.
      icon: tabler:beach
    - title: Kalapüük
      description: Avatud teki paigutus, õngahoidjate asend, elussöödakaev, kalaotsija kinnitus, trollimootori kinnitus, tugevdatud ahter ja kaasaskantav kütusesüsteem. Keskkonsooli või külgkonsooli valikud.
      icon: tabler:fish
    - title: Vaba aeg ja jahtide tender
      description: Kerge kere, PVC torud, mugavad istmed, teleskoop-harkväär või kompaktne konsool, tõstevõtmed daviti jaoks ja eemaldatav kütusepaak. RCD Kategooria C või D.
      icon: tabler:sailboat
    - title: Professionaalne tööpaat
      description: Alumiiniumkere valik, tugevdatud konstruktsioon, hüdrauliline rool, tööstuskvaliteediga elektribaasil, radariarh, ja missioonispetsiifiliste seadmete integreerimisvõimalused. Projekti järgi kohandatud nõuetele vastavus.
      icon: tabler:anchor
process_steps:
  title: 7-sammuline RIB OEM/ODM arendusprotsess
  subtitle: Projektikirjeldusest järelteeninduseni — määratletud töövoog selgete verstapostide ja tulemusega
  steps:
    - number: '01'
      title: Projektikirjeldus ja nõuded
      description: Määratle sihtotstarve, kere suurus, toru materjal, nõuetele vastavuse nõuded ja brändimisvajadused. Hinnatakse teostatavust ja kinnitatakse koostöö mudel (OEM/ODM/Poolkohandatud/Täiskohandatud).
      timeline: 3–5 päeva
    - number: '02'
      title: Tehniline ülevaade ja teostatavus
      description: Insenerimeeskond hindab konstruktsioonilist teostatavust, stabiilsust ja ujuvuse arvutusi, nõuetele vastavuse teed ja materjalide saadavust. Tuletame esile olemasolevad vormid või custom-vormi vajadused.
      timeline: 5–7 päeva
    - number: '03'
      title: Pakkumine ja hinnapakkumine
      description: Võta vastu detailne pakkumine, mis sisaldab spetsifikatsioone, 3D kujutisi või GA jooniseid, vastavuse ulatust, ajakava ja ühiku hinda mahtude ja MOQ alusel.
      timeline: 5–7 päeva
    - number: '04'
      title: Disaini kinnitamine ja proovide valmistamine
      description: Kinnita lõplik GA, tekikujundus ja torukonfiguratsioon. Valmistame tootmiseelsed proovi sinu brändi värvides, logoga ja määratud materjalidest sinu füüsiliseks kontrolliks.
      timeline: 15–20 päeva
    - number: '05'
      title: Proovi kinnitamine ja QC protokoll
      description: 'Kontrolli ja kinnita proov. Määra tootmise QC protokoll: survetest (1,25x / 24–48h), mõõtmete kontroll ja vastavusdokumentide kontrollnimekiri kere lõikes.'
      timeline: 3–5 päeva
    - number: '06'
      title: Sari- ja kvaliteedikontroll
      description: Täistoote seeria 100-punktilise QC kontrollnimekirjaga iga ühiku kohta. Käigusolevad kontrollid, survetestsed ja seerianumbril jälgitavus. CE/ISO dokumentatsioon valmib paralleelselt.
      timeline: 30–45 päeva
    - number: '07'
      title: Pakendamine, saatmine ja järelteenindus
      description: Kohandatud pakend (standard, jaemüügivalmis või alusel), ekspordidokumendid, konteineri laadimine ja logistika. Varuosakogud ja hooldusjuhised kaasas.
      timeline: 7–14 päeva
certifications:
  title: Nõuetele vastavus ja sertifikaadid RIB paatidele
  subtitle: Iga kohandatud RIB tellimus tarnitakse mudelispetsiifilise vastavusdokumentatsiooniga
  items:
    - name: CE 2013/53/EL
      description: RCD vastavus mudeli ja disainikategooria järgi — DoC, ehitaja plaat, omaniku käsiraamat kaasas
      badge: CE
    - name: ISO 9001:2015
      description: Kvaliteedijuhtimissüsteem, mille on sertifitseerinud SGS, hõlmates disaini, tootmist ja levitamist
      badge: ISO
    - name: ET ISO 6185
      description: Täispuhutava paadi konstruktsiooni standard — stabiilsus, ujuvus ja üle parda kukkunud inimese päästmine
      badge: 6185
    - name: ET ISO 14945
      description: Ehitusmasina plaatide standard — püsivalt märgitud identifitseerimis- ja mahutavusteave
      badge: 14945
    - name: BSCI
      description: Sotsiaalse vastavuse audit eetilise tootmise jaoks — nõutud ELi kauplejate poolt
      badge: BSCI
    - name: REACH
      description: ELi kemikaaliohutuse nõuetele vastavus PVC, Hypalon, liimide ja katete jaoks
      badge: REACH
content_service_modules:
  tagline: Teenuse moodulid
  title: OEM/ODM teenus<br />Moodulid
  subtitle: Iga projekt ühendab õiged teenuse moodulid. Iga projekt ei vaja kõiki mooduleid — me määratleme vaid selle, mida teie projekt vajab.
  items:
    - title: Tehniline ülevaade ja teostatavus
      description: 'Halli platvormi hindamine, struktuuri teostatavuse kontroll, stabiilsuse ja ujuvuse kinnitamine, vastavustee tuvastamine ning materjali kättesaadavuse kinnitamine. Väljund: teostatavusaruanne koos jätkamise/mittejätkamise soovitusega.'
      icon: tabler:math-function
    - title: Disain ja konfiguratsioon
      description: 'GA joonis, tekipaigutus, torustiku konfiguratsioon, konsooli ja istmete positsioonid, seadmete paigaldusplaan ning värvi/materjali valik. Tulem: kinnitatud GA ja konfiguratsiooni spetsifikatsioon.'
      icon: tabler:ruler
    - title: Proovinumber & prototüüp
      description: Eeltootmise proov näidatud heaks kiidetud värvide, logo ja määratud materjalidega füüsiliseks kontrolliks. Sisaldab proovi heakskiidu protokolli, kontroll-lehte ja muudatusettepaneku protsessi.
      icon: tabler:3d-cube-sphere
    - title: Tootmine ja kvaliteedikontroll
      description: Tööstuslik tootmine 100-punktilise kvaliteedikontrolli kontrollnimekirjaga ühe ühiku kohta, protsessisisene kontroll, survekatse (1,25x / 24-48 h) ja seerianumbripõhine jälgitavus. CE/ISO dokumentatsioon valmistatud paralleelselt.
      icon: tabler:clipboard-check
    - title: Bränding ja pakendamine
      description: Eraldi kaubamärgi logo kasutamine, kohandatud kere- ja torugraafika, bränditud omaniku dokumentatsioon, jaemüügivalmis või alusel pakendamine ning varuosasarja ettevalmistamine.
      icon: tabler:palette
    - title: Eksport ja dokumentatsioon
      description: Eksportpakend, konteineri laadimisplaan, FOB/CIF/DDP dokumendid, sihtturule vastavuse paberimajandus ja järelvedu suhtlusprotokoll.
      icon: tabler:world
content_risk_control:
  tagline: Riskide ja kohaletoimetamise juhtimine
  title: Projekti risk &<br />Tarnehaldus
  subtitle: Professionaalsed OEM/ODM ostjad hoolivad riskikontrollist sama palju kui tootekvaliteedist. Siin on, kuidas me seda hallame.
  items:
    - title: Ulatus ja omandi määratlus
      description: 'Enne arenduse algust määratleme kirjalikult: kohandamise ulatuse, tööriistade nõuded, näidiste heakskiitmise kriteeriumid, jooniste ja vormide omandiõigus ning dokumentatsiooni kohustused. Pole mingit kahtlust, kes mida omab.'
      icon: tabler:file-text
    - title: Muudatuste juhtimise protsess
      description: Kõik spetsifikatsioonimuudatused pärast disaini kinnitamist järgivad dokumenteeritud muudatuste taotlusprotsessi koos mõjuhinnanguga (kulu, ajajoon, vastavus). Tootmisse ei lähe heakskiitmata muudatused.
      icon: tabler:arrows-diff
    - title: Partii järjepidevuse garantii
      description: 50. ühik vastab esimese heakskiidetud proovile. Heakskiidetud spetsifikatsioonid on külmutatud, materjali ja protsessi parameetrid lukustatakse ning protsessisisesed kontrollpunktid kontrollivad järjepidevust kogu tootmisperioodi vältel.
      icon: tabler:repeat
    - title: Kohaletoimetamise ja mahutavuse läbipaistvus
      description: Tarneajad on hinnatud tegeliku tootmisvõimsuse, materjalivarude taseme ja praeguse tellimuskoormuse põhjal — mitte ambitsioonikate eesmärkide põhjal. Tootmisgraafik koos verstapostide kuupäevadega iga tellimuse kohta.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Korduma kippuvad küsimused
  questions:
    - q: Mis vahe on OEM ODM RIB paatide vahel ja nende jaoks?
      a: 'OEM (Originaalseadmete tootmine): te esitate üksikasjalikud spetsifikatsioonid ja meie ehitame teie disaini.ODM (Originaaldisaini tootmine): te valite tõestatud Aquafarer RIB platvormi ja me kohandame selle teie soovitud omaduste ja brändinguga.ODM on kiirem ja odavam;OEM pakub maksimaalset disainikontrolli.'
    - q: Kas ma saan kere RIB kuju ja suurust kohandada?
      a: Jah. Pakume poolkohandatud muudatusi olemasolevatele kere vormidele (erinevad tekipaigutused, torukonfiguratsioonid) ja täielikku eritellimusel kere arendust uute CNCtöödeldud vormidega. Poolkohandatud projektid võivad alata 2–5 ühikust; täiskohandatud projektid nõuavad tavaliselt suuremaid kohustusi.
    - q: Millised torumaterjalid on eritellimusel RIBssaadaval?
      a: Pakume 0,9–1,2 mm PVC vaba aja ja kerge ärikasutuse jaoks ning 1,4–1,7 mm HypalonCSM / professionaalseks, pääste- ja ärikasutuseks, mis nõuavad UV paremat ja osoonikindlust (10–15 aastat eluiga võrreldes 5–8 PVCaastaga).
    - q: Kas saad RIBs seadistada spetsiifilisi rakendusi nagu pääste, sukeldumine või kalapüük?
      a: Jah. Meil on tõestatud konfiguratsioonimallid pääste-/patrulli-, sukeldumis-, turismi/trent-, kalapüügi-, jahtide tender- ja professionaalsete tööpaadirakenduste jaoks. Iga mall sisaldab soovitatud keretüüpi, toru materjali, tekipaigutust ja varustust — mida me seejärel kohandame vastavalt teie vajadustele.
    - q: Millist infot vajad RIB OEMODM hinnapakkumise jaoks?
      a: Sihtrakendus, soovitud kere pikkus, torumaterjali eelistus (PVCvõi Hypalon), ligikaudne kogus ja tarnegraafik, sihtturu nõuetele vastavus ning kõik viitetooted või spetsifikatsioonid. Mida rohkem detaile esitate, seda kiirem ja täpsem on meie hinnapakkumine.
    - q: Mis on MOQ RIB eritellimusel paatide jaoks?
      a: Olemasolevate kerevormide puhul standardsete muudatustega MOQ algab 2–5 ühikust disaini kohta. Eritellimusvormide ja täieliku eritellimusel arenduse MOQ puhul sõltub see projekti keerukusest — tavaliselt 10–20 ühikut pooleritellimusel ja 30+ ühikut täiseritellimusel uute tööriistadega.
    - q: Kellele kuuluvad eritellimusel vormid ja joonised?
      a: Aquafarer Alusdisainidega arendatud vormid Aquafarer jäävad omandiks. Täielikult eritellimusel tellitud ja kliendi poolt tasutud vormid saab lepingu tingimuste kohaselt kliendi omandile määrata. Kõik vormi omanditingimused dokumenteeritakse enne projekti algust.
    - q: Kuidas pakendatakse ekspordiks RIBs eritellimusel?
      a: 'Standard: eritellimusel veniv + kile konteinerite laadimiseks. Premium: jaemüügiks valmis pakendamine, vaakumpakend või alustega pakend. Pakume FOB CIFQingdaot ja DDP saatmist. Täielik ekspordidokumentatsioon ja tollikontroll kaasas.'
