testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Omanik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Alustasime oma surfikooli jaoks Club Starter paketiga. 20 lauda, aerud, vestid — kõik saabus 3 nädalaga. Pärast kahte hooaega uuendasime Pro paketiks. Kohandatud bränding meie logoga muutis meie professionaalset mainet oluliselt.
    rating: 5
    product: Klubi algpakett
    source: solutions/clubs
  - category: clubs
    name: Klubi omanik
    title: Veemajanduse klubi
    location: Phuket, Tai
    content: Club Starter paket oli ideaalne alguspunkt. Kui meie äri kasvas, Aquafarer kasvas meiega — sama kvaliteet, sama hinnad, ilma üllatusteta. Me kasvasime 10-laudalt 80-le 18 kuuga.
    rating: 5
    product: Club Starter + Premium pakett
    source: success-stories
  - category: resorts
    name: Kuurordi Peakorraldaja
    title: 5-tärni rannakuurort
    location: Kreeka
    content: Aquafarer ei tarninud ainult laudu — nad aitasid meil luua täieliku külastajakogemuse. Meie veespordiprogramm tõusis nullist kuurordi tipphetkeni ühe hooajaga. 300+ iganädalast broneeringut ja 180 000 $ aastas tulu.
    rating: 5
    product: Resorti premium-pakett
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Külaliskogemuse direktor, Azure Bay Resorts
    location: Phuket, Tai
    content: Aquafarer kujundas ja varustas kogu meie rannategevuste programmi kolmes resorti kinnistul. 80 SUPs, 40 kajakki, ohutussüsteemid ja töötajate koolitus — kõik tarniti ühes saadetises. Külastajate osalus suurenes esimesel hooajal 60%.
    rating: 5
    product: Resorti premium-pakett
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Asutaja, Shoreline Paddle Co.
    location: Kalifornia, usa
    content: Ma alustasin oma SUP brändiga ilma mingisuguse kogemuseta tööstuses. Aquafarer meeskond juhendas mind tootevalikust kuni kohandatud logo disaini ja pakendamiseni. Minu esimene konteiner saabus 11 nädalaga ja ma müüsin kõik Amazonis 3 kuuga.
    rating: 5
    product: Algajabrändi käivitamine
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Asutaja
    title: Austraalia SUP bränd
    location: Austraalia
    content: Mul oli brändi idee, kuid null tootmisteadmisi. Aquafarer hoidis mind sõna otseses mõttes kogu protsessi jooksul käest kinni — alates õige laua valimisest kuni esimese saadetise lahtipakkimiseni. 90 päeva unistusest kätte toimetamiseni.
    rating: 5
    product: Brändi käivitamise pakett
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Omnik, Lakeland SUP rent
    location: Ontario, Kanada
    content: Ma rentisin 5 lauda kohalikust poest ja kaotasin neile 60% oma tulust. Aquafarer aitas mul ehitada oma 15 SUPs laua varustuse. ROI kalkulaator näitas nullpunkti 4 kuuga — tegelikult kulus 3 kuud. Nüüd laiendan seda 30 lauani.
    rating: 5
    product: Laevastiku algkomplekt
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Operatsioonidirektor, Adriatic Adventure Tours
    location: Dubrovnik, Horvaatia
    content: Me varustasime kogu oma rendivaru Aquafarer RIBs — 12 paati kolmes asukohas. Kaks hooaega hiljem, null rikkeid. CE sertifitseerimise dokumentatsioon tegi kindlustuse heakskiidu sujuvaks. Nende insenerimeeskond kohandas isegi torude värve.
    rating: 5
    product: Laevastu laiendamise komplekt
    source: trust
  - category: rental
    name: Ltn. Andres Reyes
    title: Merehanketeenistuse ametnik, Filipiini rannikuvalve abiteenistus
    location: Manila, Filipiinid
    content: Me opereerime 24 Aquafarer RIBs oma rannikupatrulli varus. Nende kvaliteedikontrolli protsess on kõigis partii toodetes järjepidev — sama õmbluste kvaliteet, sama ventiili asukoht, sama rõhu tase iga kord. See kordusväärtus on oluline, kui elud sõltuvad varustusest.
    rating: 5
    product: RIB patrulllaevastik
    source: trust
  - category: consumers
    name: Sarah K.
    title: Esmakordne SUP omanik
    location: Lake Tahoe, USA
    content: Stabiilne isegi täiesti algajale. Võtsin selle esimesel päeval järvele ja ei kukkunud kordagi. Täispakett koos pumpa ja aeruga tähendas, et olin vee peal 20 minutit pärast kasti avamist.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 omanik
    location: Vancouver, Kanada
    content: Esmakordse ostjana olin mures kvaliteedi pärast, tellides välismaalt. ISO dokumentatsioon ja kolmanda osapoole testiaruanded, mida nad jagasid enne minu küsimust, andsid mulle täieliku kindluse. Laud saabus 6 päevaga ja ületas mu ootusi.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Harrastuskajakikasutaja
    location: Florida, USA
    content: Kindel ehituskvaliteet. Talub rannikumõminat palju paremini, kui ma inflatiseeritavalt ootasin. Pakkisin selle oma auto pagasnikusse nädalavahetuse reisiks — pumpasin rampal täis alla 4 minutiga.
    rating: 5
    product: Täispuhutav süst
