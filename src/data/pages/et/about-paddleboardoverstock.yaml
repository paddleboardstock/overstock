values:
  - title: Kvaliteet esikohale
    desc: Iga paat, mis meie tehasest lahkub, läbib enne saatmist kohustuslikud õhu säilitamise, õmbluste kudemise ja süsteemide testid.
  - title: Vertikaalne integratsioon
    desc: Me kontrollime igat etappi — alates PVC lõikamisest kuni lõppkokkupandud tooteni — elimineerides alltöövõtjate ebatõhususe ja tagades ühtlase kvaliteedi.
  - title: Ohutus standardina
    desc: CE sertifitseerimine on meie ehitise tuum. Meie 64 CE-sertifitseeritud mudelit vastavad EL ohutusstandarditele vabaaja- ja äriliseks kasutuseks.
  - title: Partnerikeskne
    desc: Loome pikaajalisi suhteid OEM, ODM ja erabrändi partneritega läbi läbipaistvuse, usaldusväärsuse ja ühise kasvu.
services:
  - title: OEM Tootmine
    desc: Me ehitame vastavalt teie spetsifikatsioonidele. Jagage oma jooniseid ja meie insenerimeeskond tegeleb prototüüpimise, tööriistade ja tootmisega.
  - title: ODM Lahendused
    desc: Alustage meie tõestatud platvormi disainidest. Kohandage suurust, värvi, graafikat ja pakendit, et luua oma unikaalne tootesari.
  - title: Erabränd
    desc: Teie kaubamärk, teie logo, teie pakend. Tooted jõuavad jaemüüki valmiskujul koos täieliku brändi integreerimisega.
  - title: Kohandatud brändimine
    desc: Tekitiibade trükk, keregraafika, toru kleebised ja kohandatud märgised — ühtne brändi esindatus kõikjal.
certifications:
  - name: CE Sertifitseerimine
    desc: Meie paadid ja veesõidukid vastavad EL vabaaja veesõidukite direktiivile (2013/53/EU) ja asjakohastele harmoneeritud standarditele.
    scope: Paadid ja veesõidukid
  - name: null
    desc: Kvaliteedijuhtimissüsteem sertifitseeritud täispuhutavate veesõidukite projekteerimiseks, tootmiseks ja turustamiseks.
    scope: Kogu rajatis
  - name: null
    desc: Täispuhutavad paadid — turvalisuse ja jõudluse nõuded tugevdatud ja jäikade lõhedega täispuhutavatele paatidele.
    scope: RIB & täispuhutavad liinid
