hero:
  tagline: Sertifikaadid ja standardid
  title: Kvaliteedisertifikaadid<br />& Vastavusstandardid
  subtitle: Paddle Board Overstock Tooted toodetakse vastavalt rahvusvahelistele mereohutusstandarditele, kvaliteedijuhtimissüsteemidele ja keskkonnanõuetele.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock Kvaliteedisertifikaadid ja vastavusdokumentatsioon
content_certifications:
  tagline: Meie sertifikaadid
  title: Sertifitseeritud kvaliteet,<br />Ülemaailmselt tunnustatud
  subtitle: CE64-sertifitseeritud mudelid ja tehaseülesed sertifikaadid näitavad meie pühendumust kvaliteedile, ohutusele ja keskkonnavastutusele.
  items:
    - title: CE Sertifitseeritud
      description: CE64-sertifitseeritud mudelid vastavad Euroopa CE märgistusnõuetele harrastusveesõidukitele, tagades ohutus-, tervise- ja keskkonnakaitse standardite täitmise.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Meie kvaliteedijuhtimissüsteem on ISO sertifitseeritud 9001:2015, hõlmates täispuhutavate veesõidukite ja merevarustuse projekteerimist, tootmist ja jaotust.
      icon: tabler:clipboard-check
    - title: UKCA märgitud
      description: Ühendkuningriigi turul müüdavatel toodetel on UKCA märgistus, mis kinnitab vastavust Ühendkuningriigi merevarustuse ja isiklike veesõidukite regulatsioonidele.
      icon: tabler:shield
    - title: BSCI Vastavus
      description: Paddle Board Overstock on BSCI auditeeritud (Business Social Compliance Initiative), mis demonstreerib eetilisi tootmistavasid, õiglast töötingimust ja tarneahela vastutust.
      icon: tabler:heart-handshake
    - title: REACH Vastab
      description: Kõik toodetes kasutatavad Paddle Board Overstock materjalid vastavad ELi REACH keemilise ohutuse nõuetele, tagades, et meie PVC, , või komponentides ei ole piiratud Hypalonaineid.
      icon: tabler:flask
    - title: Materjalide testimine
      description: Kangaid testitakse tõmbetugevuse, rebenemiskindluse, UV lagunemise ja külma pragude võime osas. Iga tootmispartii proovitakse ja kontrollitakse.
      icon: tabler:test-pipe
content_factory:
  tagline: Tehase standardid
  title: Tootmise tipptase<br />— Ehitatud vastavalt spetsifikatsioonidele
  subtitle: Meie 12 000 m² suurune tehas tegutseb igas tootmisetapis rangete kvaliteedikontrolli protokollide alusel.
  list:
    - 'Sissetulevate materjalide kontroll: Kõik toorained — PVC kangas, Hypalonalumiinium, vineer, liimid — testitakse enne tootmisse minekut vastavalt spetsifikatsioonidele.'
    - 'Protsessisisene kvaliteedikontroll: Igas tootmisetapis on dokumenteeritud kvaliteedikontrollpunktid. Keevituse tugevus, õmbluste joondamine, klapi paigaldus ja kinnitusmomenti kinnitatakse reas.'
    - 'Rõhu test: Iga täispuhutav kamber testitakse rõhuga 1,25× nimirõhul 24–48 tundi. Lekkemäär peab olema lubatud piirides ISO vastavalt 6185.'
    - 'Lõplik kontroll: Valminud tooted kontrollitakse enne saatmist mõõtmete täpsuse, kosmeetilise viimistluse, tarvikute terviklikkuse ja pakendi terviklikkuse osas.'
    - 'Partii jälgitavus: Iga toode kannab seerianumbrit, mis on seotud tootmispartii kirjetega, võimaldades täielikku jälgitavust toorainest valmistoodeteni.'
content_safety:
  tagline: Meresõidu ohutusstandardid
  title: Ohutus Esimesena<br />— Mõeldud usaldusväärseks toimimiseks
  subtitle: Paddle Board Overstock tooted on loodud ja testitud vastavalt rahvusvahelistele meresõidu ohutusstandarditele nii kaubanduslikuks kui ka vabaajakasutuseks.
  items:
    - title: ISO 6185
      description: Täispuhutavad paadid vastavad ISO 6185 standarditele konstruktsiooni, stabiilsuse, ujuvuse ja kandevõime osas.
      icon: tabler:sailboat
    - title: ABYC standardid
      description: Elektri- ja kütusesüsteemid järgivad ABYC (American Boat & Yacht Council) standardeid ohutuks paigaldamiseks ja kasutamiseks.
      icon: tabler:bolt
    - title: SOLAS Vastavus
      description: Ohutusseadmed ja elupäästevahendid vastavad vajadusel SOLAS (Safety of Life at Sea) nõuetele.
      icon: tabler:lifebuoy
cta:
  title: Kas vajate oma projektile sertifitseeritud tooteid?
  subtitle: Võtke meie meeskonnaga ühendust, et arutada sertifitseerimisnõudeid, dokumentatsiooni ja turu nõuetele vastavust.
  actions:
    - variant: primary
      text: Küsige sertifikaadi dokumente
      href: /contact
    - text: Vaadake meie kvaliteedilehte
      href: /quality
