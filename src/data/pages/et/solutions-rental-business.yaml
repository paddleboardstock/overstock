        description: SUPs, kajakkide, kummipaatide ja RIBs kombinatsioon, et teenindada mitmekesiseid külaliste eelistusi
      - title: Koguse hindamine
        description: Sammuline hulgimüügihindade süsteem 20+ ühiku suurustele parkidele koos soodustingimustel logistika määradega
      - title: Kohandatud brändimine
        description: Logo trükkimine seadmetele, bränditud päästevestid ja kohandatud värvivõimalused teie rendipargi jaoks
