      - title: Ohutuse järgimine
        description: Kõik seadmed CE on sertifitseeritud ärikvaliteediga ehitusega igapäevaseks rendiks
      - title: Starditurundus
        description: Bränditud fotograafia varad ja rendimenüü mallid, mis aitavad teil oma teenust käivitada
    cta_text: Alusta rendisüsteemi
