testimonial:
  content: Ma rentisin kohalikust poest 5 lauad ja kaotasin neile 60% oma tulust. Aquafarer aitas mul ehitada omaenda 15 SUPs laeva pargi. Neilt saadud ROI kalkulaator näitas, et ma jõuan kasumisse 4 kuuga — tegelikult võttis see 3 kuud. Nüüd laiendan ma oma laevastikku 30 laua peale ja lisan kajakid.
  name: Daniel Okonkwo
  title: Omnik, Lakeland SUP Rentimine — Ontario, Kanada
content_segments:
  tagline: Üüriprofiilid
  title: Veemängude varustuse rentimise lahendused<br />Operaatori tüübi järgi
  subtitle: Erinevatel üüritegevustel on erinevad vajadused — alates väikestest rannikuäärsetest SUP üüridest kuni suuremahuliste kuurordi veespordikeskusteni. Kohandame oma varustuse paketid ja tugimudeli vastavalt sellele.
  items:
    - title: Ranna- ja järveäärsed SUP rendid
      subtitle: Suurmaht, madala keerukusega toimingud
      description: Operaatorid, kes rendivad lauaga sõudeplaate ja kajakke otse rannakülastajatele ja järvekülastajatele. Teie prioriteet on rendiaegade vahe vähendamine, seadmete pidev kasutuses hoidmine ning hooajaliste nõudluse tõusude haldamine väikese ladustamisruumiga.
      features:
        - Täispuhutavad SUP laevastikud, mis pakitakse lamedaks — ei ole vaja sadamat ega haagist
        - Kaubanduslik PVC, hinnatud 100+ renditsükli jaoks hooaja jooksul
        - Kiiresti kuivav, UV-kindel kangas samal päeval uuesti üürimiseks valmisolekuks
        - Värvikoodiga tahvli vahemikud lihtsaks laevastiku tuvastamiseks
    - title: Kuurorti ja hotelli veespordi keskused
      subtitle: Külaliste kogemus ja brändi joondamine
      description: Kuurordid ja hotellid pakuvad veespordialasid kohapealse mugavusena. Varustus peab välja nägema premium, töötama usaldusväärselt algajalistest kuni kesktaseme külaliste seas ning integreeruma kuurordi olemasolevate tegevuste broneerimise ja arveldamise töövoogudega.
      features:
        - Eritellimusel bränditud SUP lauad ja päästevestid, mis sobivad kuurordi värvidega
        - 'Segalaevastik: SUPs, kajakid, pedaalpaadid ja väikesed RIB tenderid'
        - Vaiksed, kütusevabad elektripumba lahendused ranna inflatsiooniks
        - Personali koolitus ja hooldus hõlmasid sisseelamist
    - title: Paadi- ja RIB rendioperaatorid
      subtitle: Kaubandusliku klassi laevade rendilaevastikud
      description: Operaatorid rendivad mootoriga laevu — RIB tendereid, täispuhutavaid paate ja väikeseid runaboute — tunniks või poole päeva kaupa. Teie laevastik peab vastama mereohutuse nõuetele, taluma tugevat külaliste kasutust ja minimeerima mehaanilisi seisakuid rendireiside vahel.
      features:
        - RIB Paketid, millel on 30–90 HP välimist valmis ahtrit
        - Mereväeklassi vineerist põrandapaneelid pikaajalise konstruktsioonilise terviklikkuse tagamiseks
        - Kiire käivitusklapi süsteemid kiiremaks pöördeks
        - Varuosade komplekt + valveajal tehniline tugi SLA
    - title: Ekskursiooni- ja seiklusoperaatorid
      subtitle: Giidiga ekskursioonilaevastikud
      description: Operaatorid korraldavad giidiga veespordituure — SUP safarid, koopakajakisõit, snorgeldamisretked või saarte vahel RIB hüppamise ekskursioonid. Varustus peab olema piisavalt stabiilne algajatele ekskursioonidele, kiire koristamine gruppide vahel ning vastupidav igapäevaseks juhendatud kasutamiseks erinevates veetingimustes.
      features:
        - Eriti stabiilsed SUP platvormid (32" +laiad) esmakordsetele sõitjatele
        - Tandemkajaki võimalused paari- ja grupituuride jaoks
        - Sisseehitatud pagasimaht snorgeldamisvarustusele, kuivadele kottidele ja jahutitele
        - CE + USCG Vastavusdokumentatsioon äriliste tegevuste jaoks
