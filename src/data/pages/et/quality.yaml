tests:
  - title: Rõhutestimine
    standard: ISO 6185-1 | Sisemine spetsifikatsioon AF-PT-001
    description: Täispuhutavad kambrid pressuriseeritakse 1,25-kordse soovitatud töölävega ja hoitakse 30 minutit. Õhurõhu vähenemist mõõdetakse, et kinnitada materjalide ja õmbluste õhutihedust ja struktuurset terviklikkust.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Mõjutustestimine
    standard: Sisemine spetsifikatsioon AF-IT-002
    description: Tooteid koheldakse standardiseeritud langetussalvede ja pendel-aparaadi abil kontrollitud mõjude all. See hindab torkekindlust, rebimislevikut ja struktuurset vastupidavust kokkupõrgete, dokkide ja prahi vastu.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Vastupidavuse testimine
    standard: ASTM G154 | ISO 4892-3
    description: Materjaliproovid on paigutatud UVA-340 lampide alla kiirendatud ilmastikukindluse kambrisse 1 000+ tunniks. Me mõõdame värvimuutust (Delta E), läike säilimist ja tõmbetugevuse kadu, et kinnitada UV stabilisaatorite pakette.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Abrasiivse kulumise testimine
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Materjaliproove koheldakse CS-10 abrasiivratastega 500g/1 000g koormusel 1 000 tsükli jooksul. Massikadu ja visuaalne kulumise hindamine määravad katte vastupidavuse liiva, kruusa ja korduva lansseerimise vastu.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Madalate temperatuuride jõudluse testimine
    standard: Sisemine spetsifikatsioon AF-LT-003 | MIL-STD-810G
    description: Kokku pandud tooted ja materjalitükid konditsioneeritakse -20°C, -10°C ja 0°C juures 24 tundi ning seejärel painutustestitakse. Me kontrollime, et PVC ja Hypalon jäävad painduvaks ilma pragunemise või delaminatsioonita.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Ujuvuse ja kandevõime testimine
    standard: ISO 6185-1 | ISO 12402
    description: Tooteid koormatakse järk-järgult kuni 1,25-kordse nimiväärtuseni kontrollitud basseinis. Salve kõrgus, stabiilsus ja isetühjenduvuse jõudlus registreeritakse. Iga mudeli nimiväärtust kontrollitakse matemaatiliselt ja empiiriliselt.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Manööverdusvõime testimine
    standard: Sisemine spetsifikatsioon AF-MT-004
    description: Veekatsed mõõdavad pöördenurga raadiust, kiirendust, planeerimisaega ja aeru/mootori reageerimist erinevate koormustingimuste all. Reaalsete juhtimisomaduste kooskõla disainieesmärkidega kinnitatakse.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Veekindluse testimine
    standard: ISO 6185-1 §7.3 | Sisemine spetsifikatsioon AF-WT-005
    description: Iga kokku pandud toodet pritsitakse 0,5 baarini kõigil õmblustel, ventiilidel ja ühendustel. 5-minutiline pressuriseeritud sukeldumistest kinnitab kambrite ja ventiilide veekindlust. Null-lekke standard enne saatmist.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
testing_section:
  tagline: Testimisprotseduurid
  title: Range testimine igas etapis
commitment:
  title: Meie kohustus
  body: Nende range testimisprotseduuride kaudu pakub {SITE} klientidele kindlust, et meie täispuhutavad SUPs ja paadid ei ole mitte ainult kõrge jõudlusega, vaid ka vastupidavalt ehitatud — tagades lugematuid nauditavaid ja turvalisi veeavastusi. Meie kvaliteedilabor töötab sõltumatult tootmisest ja raportib otse juhtkonnale.
  cta: Taotlege testimisdokumentatsiooni
  cta_link: /contact
