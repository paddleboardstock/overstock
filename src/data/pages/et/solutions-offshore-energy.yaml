content_challenge:
  tagline: Väljakutse
  title: Mereenergia nõudmised<br />Ekstreemsete keskkondade töökindlus
  subtitle: Mereenergia operatsioonid panevad seadmed maksimaalsele proovile — ekstreemne ilm, kauged asukohad, pidev töötsükkel ja nulltolerants riketele.
  paragraphs:
    - Mereenergia tööstus tegutseb maailma kõige nõudlikumatel merelistel aladel. Tööpaadid toetavad nafta- ja gaasiplatvorme, tuuleturbiinide paigaldust, allveekaablite operatsioone ja meremajanduse ehitusprojekte — sageli avamerel piiratud ilmastikuakendega. Seadmete rike ei ole mitte ainult kulukas, vaid ka ohtlik.
    - '**Ohutus on kõrgeim prioriteet** — meeskonna ülekandelaevad peavad töötama ohutult merioludes, mis takistaksid teisi operatsioone. Ülekande hetkel stabiilsus, mootori töökindlus igas ilmastikus ja robustne konstruktsioon korduvaks dokkimiseks mere-ehitiste vastu on kohustuslikud nõuded.'
    - '**Kõikidel ilmastikutingimustel töötamise võime on hädavajalik** — mere-tuulepargid ja naftaplatvormid töötavad aastaringselt. Tööpaadid peavad toime tulema kõrge lainetuse, tugeva tuule ja piiratud nähtavuse korral. Päeva- ja ööoperatsioonid nõuavad täis navigatsioonikomplekti ja töökindlat valgustussüsteemi.'
    - '**Mere-tuuleenergia sektor kasvab kiiresti** — kogu maailmas paigaldatakse tuhandeid uusi turbiine, mis kõik vajavad regulaarset meeskondade ülekannet, tööriistade transporti ja hooldustuge. See loob püsiva nõudluse spetsiaalselt loodud meeskonna ülekandelaevade (CTV) ja tugiteenuste RIBs järele.'
    - Aquafarer mereenergia RIBs on loodud tugevdatud sügav-V kere, raskekujuliste Hypalon torude, täis navigatsioonikomplekti ja ohutussüsteemidega, mis on mõeldud mereenergia operatsioonide ekstreemseteks tingimusteks.
content_solution:
  tagline: Meie lahendus
  title: Eesmärgipäraselt loodud mereenergia RIBs<br />Energeetikatööstuse jaoks
  subtitle: Iga Aquafarer mereenergia RIB on loodud ohutuks ja töökindlaks toimimiseks ekstreemsetes meretingimustes — alates Põhjamerest kuni Kagu-Aasiani.
  list:
    - Tugevdatud sügav-V kere rasketes vetes esineva jõudluse ja etteaimatava juhitavuse jaoks
    - Raskekujulised Hypalon torud koos UV ja keemilise vastupidavusega pikendatud mereoperaatorite teenistuse jaoks
    - 316 roostevabast terasest tarvikud — korrosioon puudub pideval soolaveekokkupuutel
    - 'Täis navigatsioonikomplekt: GPS, radar, VHF, ööne navigatsioonituled — standard mere mudelitel'
    - Isesopeeriv tek ohutuks tööks pardaleminekute korral
    - Mitme mootori konfiguratsioonid — üks või kaks välismootorit missiooni varukoopiaks
    - Puksiirpost ja tugevad klambrid platvormide ja poide käsitlemiseks
    - Kõrge nähtavusega toruvärvid tuvastamiseks avamere töökohtadel
content_segments:
  tagline: Energiaprofiilid
  title: Offshore Energy lahendused<br />Rakenduse tüübi järgi
  subtitle: Erinevatel avamereenergia sektoritel on unikaalsed tööpaadinõuded — alates platvormitoest RIBs kuni tuulepargi CTV-de ja allveeinspektsioonilaevadeni.
  items:
    - title: Avamere nafta- ja gaasiplatvormide tugi
      subtitle: Meeskonna üleviimine, varustuse varustamine, platvormi ohutusrežiim
      description: Nafta- ja gaasiplatvormid vajavad igapäevast meeskonnavahetust, varustuse ja varustuse transporti ning ohutusvalvet. Töölaevad peavad ohutult liikuma platvormistruktuuride ümber, tugevates vooludes ja muutuvates mereoludes ning hoidma täpset positsiooni personali üleviimisel redeli või käigutee kaudu. Ekstreemne keskkond — süsivesinikud, kemikaalid, pidev soolapritsimine — nõuab korrosioonikindlat ehitust ja usaldusväärset töövõimet.
      features:
        - Meeskonna ülekande konfiguratsioon koos ohutu pardale mineku ja käsipuudega
        - Korrosioonikindlad Hypalon torud ja 316 roostevabast terasest riistvara
        - Tugevdatud hõõrumisstraadid sagedaseks platvormiporia kokkupuuteks
        - Isepaduv terrass õlise vee ja keemilise pesu jaoks
        - Suure mahutavusega kütusepaak pikendatud avamere tööulatuse jaoks
        - Kahemootoriline variant missioonikriitilise redundantsuse jaoks
    - title: Avamere tuulepargi tegevus
      subtitle: Meeskonna üleviimine, turbiini hooldus, tööriistade transport
      description: Avamere tuuleenergia on mereenergia kiiremini kasvav sektor. Operaatorid vajavad meeskonna ülekandelaevu (CTV), mis suudavad tehnikuid ohutult üle viia turbiiniplatvormidele mereriikides, mis on kuni 1,5 m märkimisväärse lainekõrgusega. Stabiilsus ülekande ajal, igasuguse ilmastiku võimekus ja usaldusväärne igapäevane töö on kriitilise tähtsusega. Tuulepargi teeninduslaevad töötavad tiheda ajakava järgi — iga seisak viivitab turbiinide kasutuselevõttu või hooldust, mõjutades otseselt energiatootmise tulu.
      features:
        - Optimeeritud kere kuju stabiilseks meeskonna üleviimiseks turbiinibaasis
        - Deep-V sisenemine mugavaks sõiduks avamere lainete ja lainete vahel
        - Täielik ilmastikukaitse — suletud konsool või roolikabiin meeskonna mugavuse tagamiseks
        - Terrassiruum tööriistade, varuosade ja hooldusseadmete jaoks
        - Öiste operatsioonide pakett pikemate päevavalgusega talvevahetuste jaoks
        - Vaikne välimine mootor minimaalseks müra mõjutamiseks merekeskkonnale
    - title: Veealuse kaabli ja torujuhtme tugi
      subtitle: Inspekteerimine, hooldus, ROV-tugi, ülevaatus
      description: Veealused kaablite ja torujuhtmete operaatorid vajavad tööpaate marsruudi kontrolliks, hooldustoeks, ROV-operatsioonideks ja mõõdistustöödeks. Need laevad vajavad stabiilseid platvorme veealuse varustuse paigaldamiseks ja taastamiseks, täpset madala kiirusega manöövreid kaablijälgimiseks ning usaldusväärset tööd ranniku- ja avamere keskkondades. Paadi stabiilsus on kriitilise tähtsusega sonari ja mõõdistusseadmete täpsuse jaoks.
      features:
        - Stabiilne platvorm aeglase kiirusega kaablijälgimiseks ja mõõdistamiseks
        - Avatud teki paigutus ROV-ide paigaldamiseks, kaablirullide ja mõõdistusvarustuse jaoks
        - Seadmete paigaldusplaadid sonarile, GPS-ile ja geodeesia-instrumentidele
        - Madala lainetusega kere disain minimaalsete mereloo põhja häirete jaoks inspekteerimisel
        - Täpsed madala kiirusega manöövrid reageeriva välimootori roolimisega
    - title: Mereinseneritehnika ja ehitustoetuse teenused
      subtitle: Töötajate transport, materjalide tarnimine, sukeldumistoetus
      description: Mereinseneri alltöövõtjad, kes töötavad sadamaehitusel, rannikukaitsel ja avamerel paigaldusprojektides, vajavad mitmekülgseid tööpaate töötajate transpordiks ehitusaluste ja kaldalade vahel, materjali- ja tööriistade tarnimiseks, sukeldumistoetuseks ja ehitusplatside uuringuteks. Need paadid töötavad aktiivsetes ehituspiirkondades, kus on mitu paati, piiratud manööverdamisruum ja muutuvad mereolud. Vastupidavus ja mitmekülgsus on üliolulised.
      features:
        - Mitmeotstarbeline tekipaigutus töötajate, materjalide ja sukeldumisvarustuse jaoks
        - Sukeldumisredel ja seadmete paigaldus sukeldumistoetuse operatsioonide jaoks
        - Tugevad kinnitusklambrid ja pukid ehitusplatsil manööverdamiseks
        - Tugev Hypalon konstruktsioon ehitusprügi ja abratsioonikindluse jaoks
        - Paindlikud istekohtade konfiguratsioonid — meeskonna transport või kaubarežiim
