process_steps:
  title: 6-astmeline OEM/ODM protsess
  subtitle: Alates disainijuhendist kuni FOB Qingdao — sujuv töövoog
  steps:
    - number: '01'
      title: Disainijuhend ja 3D CAD modelleerimine
      description: Jagage oma sihtspetsifikatsioone, viite tooteid või kontseptsiooni. Meie insenerimeeskond koostab detailse CAD joonised ja 3D arvutuskujutised teie kinnituseks.
      timeline: 3–5 päeva
    - number: '02'
      title: Materjali valik ja kangakatsetused
      description: Valige militaarklassi PVC (0,9–1,2 mm), Hypalon CSM või drop-stitch tuumakanga hulgast. Me teeme tõmbetugevuse, katte adhesiooni ja UV stabiilsustestid.
      timeline: 2–3 päeva
    - number: '03'
      title: Kiirprototüüpimine ja näidiste tootmine
      description: Me CNC-masinaga toodame kohandatud vormid ja eeltöötluse näidised teie brändivärvide, logo ja määratud materjalidega. Näidised saadetakse teie kinnituseks.
      timeline: 7–14 päeva
    - number: '04'
      title: 24–48-tunnine kõrgsurve hoidmise test
      description: Iga prototüüp läbib range surve säilitamise testi 1,25x nimisurve juures. Teostatakse õmbluse kihistamise testid ja mõõtmete kontroll.
      timeline: 1–2 päeva
    - number: '05'
      title: CE/ISO Kvaliteedi kontroll ja pakendamine
      description: 100-punktiline kvaliteedikontrolli nimekiri. Iga üksus kontrollitakse enne jaemüügiks valmis pakendamist. CE nõuetelevastavuse deklaratsioon ja BSCI vastavusaruanne lisatud.
      timeline: 2–3 päeva
    - number: '06'
      title: FOB Qingdao saatmine ja logistika
      description: Valmistooted kaetakse aluspallettidele, kahanemiskilesse ja konteinerisse Qingdao sadamas. Täielik ekspordidokumentatsioon, tollivormistus ja reaalajas jälgimine.
      timeline: 7–14 päeva
