hero:
  tagline: Tööstuslike Lahenduste Maatriks
  title: Stsenaariumipõhised Mere Lahendused<br />Professionaalsete Operatsioonide jaoks
  subtitle: Eesmärgipäraselt konstrueeritud täispuhutavad veesõidukid ja RIBs, mis on kohandatud päästetöödeks, rendilaevastikuks, jahtide abilaevadeks ja kommertskalapüügi rakendusteks — kõik toetatud tehniliste spetsifikatsioonide ja kohandamisvõimalustega.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer professionaalsed merelahendused erinevatele tööstusharudele
direct_answer: 'Aquafarer pakub stsenaariumipõhiseid täispuhutavaid veesõidukeid ja RIB lahendusi kommertspõhiste mereoperatsioonide jaoks: pääste- ja patrullpaadid tugevdatud Hypalon torude ja mitmekambrilise turvasüsteemiga, rendilaevastiku SUPs ja kajakid 1,2 mm PVC materjaliga ja kuumaõhuga keevitatud õmblustega, et tagada vähene hooldusvajadus, luksusjahtide abipaadid sügav-V alumiiniumkerega RIBs ning raskeveolise kalapüügi konfiguratsioonid õngalaudade ja elutu jaamadega.'
solution_a:
  tagline: Lahendus A
  title: Mererettimine &<br />Kommertspatrull
  subtitle: Kõrgsagedusega, mitmekambriline turvasüsteem RIBs professionaalseks hädaabiks ja õiguskaitseoperatsioonideks.
  badge: Heavy-Duty Series
  description: Meie mererettimise ja patrullpaadid RIBs on konstrueeritud tugevdatud kõrge tiheduse Hypalon/PVC õhutorudega, mis kasutavad mitmekambrilist sõltumatut ujuvdisaini. Iga veesõiduk on varustatud professionaalsel tasemel helkuri ribade, päästehaakide ja kiiret täitmist võimaldavate ventiilidega. Sügav-V klaaskiust kerekonstruktsioon tagab suurepärase stabiilsuse suurtes kiirustes ja rasketes mereoludes.
  features:
    - title: Mitme kambriga turvalisus
      description: 4–6 sõltumatut õhkambrikut — ükski üksik kambripunktsioon ei riku positiivset ujuvust
    - title: Tugevdatud torukiudude materjal
      description: 1,2 mm Hypalon CSM või 1 680 DTEX PVC topeltkihilised kuumaõhuga keevitatud õmblused
    - title: Professionaalses Klasis
      description: SOLAS helkurrihmad, päästeliinid, veohävitajad, kiirelt vabanev tõmbeliin
    - title: Kõrgsageduse Kere
      description: Sügav-V klaaskiust või alumiiniumkere, kiirus 25–45 sõlme sõltuvalt konfiguratsioonist
  recommended_models:
    - RIB 450. patrull
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Kere materjal
      value: Klaaskiust / Merealumiinium
    - label: Torukiudude materjal
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Maksimaalne kiirus
      value: 25–45 sõlme
    - label: Mahutavus
      value: 6–12 inimest
    - label: Mootori ulatus
      value: 40–200 HP
    - label: Sertifitseerimine
      value: CE / ISO 9001
solution_b:
  tagline: Lahendus B
  title: Veespordi varustuse rent &<br />Resordi laevastiku varustus
  subtitle: Ülikindlad, madala hooldusvajadusega täispuhutavad SUPs, kajakid ja paadid, mis on mõeldud igapäevaseks rendiks kuurortides, klubides ja ekskursioonide korralduses.
  badge: Rental-Grade
  description: Meie rendivarustuse masinad on kavandatud kõrgeimaks vastupidavuseks ja madalaimaks hoolduskuluks. Kasutame 1,2 mm tugevdatud PVC koos kolmekihilise kuumaõhuliite õmblustehnoloogiaga, mis talub UV lagunemist ja sagedast kokkupõrkekahjustust. Drop-stitch konstruktsioon tagab, et lauad säilitavad jäikuse isegi pärast sadu renditsükleid. Kõik mudelid on varustatud tugevdatud D-rõngaste, kulumiskindlate liisturihmade ja tööstuslike ventiilidega.
  features:
    - title: Kaubanduslik tase PVC
      description: 1,2 mm tugevdatud PVC UV stabilisaatoritega — 3 korda paksem kui tarbeklassi materjalid
    - title: Kuumaõhuga keevitatud õmblused
      description: Kolmekihiline sulamkeevitus — tugevam kui liimühendus, talub kihistumist
    - title: Drop-Stitch Jäikus
      description: 1,680 DTEX südamikku 2 lõime/tolmu ruut—hinnatud 20 PSI jaoks tahvli-sarnase jäikuse korral
    - title: Laevastikuks Valmis Disain
      description: Tugevdatud D-rõngad, kaubanduslikud Halkey-Robertsi klapid, kulumiskindlad rööpapaelad
  recommended_models:
    - SUP Gepardi Purustus
    - SUP Ookeani Rändur
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Torumaterjal
      value: 1,0–1,2 mm tugevdatud PVC
    - label: Õmblustehnoloogia
      value: Kolmekihiline kuumaõhuliimimine
    - label: Maksimaalne rõhk
      value: 15–20 PSI (drop-stitch mudelit)
    - label: UV-vastupidavus
      value: 1 000+ tunni kiirtestimine
    - label: Garantii
      value: 2–5 aastat, sõltuvalt mudelist
    - label: Hooldus
      value: Minimaalne — loputada ja ladustada
solution_c:
  tagline: Lahendus C
  title: Jahtide tenderid &<br />Luksusveesõidukid
  subtitle: Kerged, kõrge jõudlusega RIB tenderid, mis on mõeldud superjahtide ladustamiseks ja külaliste transportimiseks, pakkudes luksuslikku viimistlust.
  badge: Premium Series
  description: Meie jahtide tenderid RIBs ühendavad kerge konstruktsiooni luksusliku esteetikaga. Deep-V alumiinium- või klaaskiust kere tagab erakordse sõidukvaliteedi ja lihtsa davit-tõstmise. Saadaval värvitud toru graafikute, premium-polstrite ja kohandatud konsoolipaigutustega. Kompaktseid ladustamismõõtmeid arvestades on need ideaalsed superjahtide garaažides ja tekil hoiustamiseks.
  features:
    - title: Kerge konstruktsioon
      description: Meretasemel alumiiniumkere vähendab kaalu 30% võrra võrreldes klaaskiuga, hõlpsaks tõstmiseks
    - title: Deep-V jõudlus
      description: 18–22 kraadi deadrise-kere sujuvaks sõiduks lainetuses ja suurepäraseks jälgitavuseks
    - title: Luksuslik viimistlus
      description: Kohandatud polster, värvitud torud, premium juhtimiskonsool, roostevabast terasest pakett
    - title: Kompaktne ladustamine
      description: Mõeldud superjahtide garaažidele — kokkupakitavad torud kompaktselt hoiustamiseks
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Kere tüüp
      value: Deep-V alumiinium / klaaskiud
    - label: Deadrise
      value: 18–22 kraadi
    - label: Maksimaalne kiirus
      value: 30–40 sõlme
    - label: Kuivkaal
      value: 120–350 kg (alumiiniumkere)
    - label: Davit-tõstmiseks valmis
      value: Jah — tõste punktid standardsed
    - label: Säilitamine
      value: Kokkupakitavad torud, ladustamiseks virnastatavad
