label: Garantii
headline: Aquafarer Tootja piiratud garantii
subtitle: Aquafarer seisab iga meie valmistatud õhutatava meretoote kvaliteedi taga. See piiratud garantii sätestab tingimused ja katvuse teie Aquafarer toote jaoks.
seo:
  headline: Aquafarer Täispuhutava paadi garantii — 5-aastane piiratud garantii | Aquafarer
  description: Aquafarer pakub 5-aastast piiratud garantiid peamise torukanga, õmbluste ja klaaskiust kere konstruktsioonilise terviklikkuse kohta. Katab ka täiteklapid ja tehases paigaldatud lisaseadmed. Täielikud tingimused ja sätted Aquafarer paadi garantiile.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  See piiratud garantii kehtib uutele Aquafarer kaubamärgi all olevatele uppumiskindlatele merekappide toodetele, mis on ostetud otse Aquafarer või volitatud Aquafarer edasimüüja või jaemüüja käest. Jõustumiskuupäev on originaalse jaemüügi ostukuupäev, mida saab kinnitada.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantii ulatus ja kestus</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Peamise toru kangakindlus (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Fiibervinüülkesta konstruktsiooniline terviklikkus</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Painduva toruõmbluse õhutihe võime</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 aastat</h3>
        <p class="text-sm text-gray-600 mt-1">Inflatsiooni klapi funktsionaalsus</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 aasta</h3>
        <p class="text-sm text-gray-600 mt-1">Tehases paigaldatud lisaseadmed ja abivarustus</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 aasta*</h3>
        <p class="text-sm text-gray-600 mt-1">Kommertskasutus, rendikasutus või autopargi kasutus — kõik komponendid</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Kaubanduslik, valitsuslik, liinilaevade, rendi- või õppekasutus vähendab garantiid 1 aastani. Võidusõit või võistluskasutus tühistab garantii täielikult.</p>
  </div>

  <h2>Mis on kaetud</h2>
  <h3>Peamine torukangas (5 aastat)</h3>
  <p>Aquafarer garanteerib põhitoru katte kanga suhtes, et see ei kaotaks pooride tihedust, mis oluliselt kahjustaks toote suutlikkust säilitada töös olekut täiskeeramisel. See kehtib CSM (Hypalon) kaetud kanga ja kõikide teiste torukanga materjalide kohta, mida kasutatakse tootmisel.</p>

  <h3>Klaaskiust kere konstruktsiooniline tugevus (5 aastat)</h3>
  <p>Fiberglasstugevdusega plast (FRP) kestaga toodete puhul on põhiline komposiitstruktuur garantiiga kaitstud struktuuriliste rikete eest, mis on põhjustatud materjalide või töötluse defektidest.</p>

  <h3>Täispuhutava toru õmbluse õhuhoidmisvõime (5 aastat)</h3>
  <p>Õhupumpade õmblused, kus need on tootmise käigus ühendatud, on garantiiga kaitstud tootmisdefektide eest, mis põhjustavad õhu märkimisväärset lekkimist õmbluse kaudu. Regelaarne kontroll ja sobiva õhurõhu hooldus on katvuse tingimused.</p>

  <h3>Täiteventiili funktsionaalsus (5 aastat)</h3>
  <p>Õhu täiteventiilid, mille paigaldas algselt Aquafarer, on garantiiga kaetud tootmisdefektide suhtes materjalides või töötluses, mis takistavad ventiilil õhku hoidmast vastavalt kavandatule.</p>

  <h3>Tehases paigaldatud tarvikud (1 aasta)</h3>
  <p>Komponendid ja tarvikud, mida valmistab Aquafarer ning mis algselt paigaldati tehasest, on materiaalide ja töötluse puuduste osas ühe aasta garantiiga. See ei hõlma kolmanda osapoole esemeid, mida katavad ainult nende vastavad tootja garantiid.</p>

  <h2>Mis ei ole kaetud</h2>
  <ul>
    <li>Kosmeetilised vead, sealhulgas värvimuutused, plekid, tuhmumine, tolmustumine või mis tahes välimuse muutumine</li>
    <li>Torked, lõiked, rebendid, rebenemised või muu füüsiline kahjustus</li>
    <li>Pragu, murdumine, kulumine, kriimustused või hõõrdumise ja kontakti põhjustatud halvenemine</li>
    <li>Kahjustus UV valguse, ilmastiku või atmosfäärikonditsioonide tõttu</li>
    <li>Kahjustus kütuste, lahustite, hapete, aluste või kemikaalidega kokkupuutel</li>
    <li>Kahjustus hooletuse, ebaõige kasutamise, väärkasutuse, õnnetuse või normaalsete kulumisnähtuste tõttu</li>
    <li>Geelkatte või värvi pindade probleemid (pinnapaisumine, pragunemine, värvuse muutumine, tuhmumine)</li>
    <li>Kahjustus löögi, pingutuse, ebaõige toe või veol põhjustatud</li>
    <li>Kahjustus ebaõige täitmise/tühjendamise või mitteheakskiidetud täite-seadmete kasutamise tõttu</li>
    <li>Kolmandate osapoolte seadmed, komponendid või süsteemid (kaetavad nende vastavate tootjate poolt)</li>
  </ul>

  <h2>Tootja kohustus ja lahendus</h2>
  <p>Aquafarer ainus ja eksklusiivne kohustus on parandada või asendada, vastavalt Aquafarer valikule, mis tahes komponent, mis on määratud defektseks materjalide või teostuse osas ja mis on kaetud selle garantiiga. Parandusi või asendusi teostab Aquafarer või tema määratud volitatud teeninduskoht. Parandatud või asendatud komponente garanteeritakse ainult originaalse garantii kehtiva osa jooksul.</p>

  <h2>Garantiitingimused</h2>
  <ul>
    <li><strong>Registreerimine:</strong>Toode peab olema korralikult registreeritud vastavalt garantiitingimustele.</li>
    <li><strong>Hooldus:</strong>Toode peab olema hooldatud kooskõlas Aquafarer avaldatud juhistega, sealhulgas perioodiline kontroll ja sobivate täite rõhkude hooldus.</li>
    <li><strong>Koostöö:</strong>Ostja peab täielikult ja viivitamata tegema koostööd Aquafarer kõigil garantiinõuetega seotud juhtudel.</li>
    <li><strong>Originaalne ostja:</strong>See garantii kehtib ainult algsele lõppkasutajale ostjale ja pole ülekantav.</li>
  </ul>

  <h2>Kaubanduslik kasutus</h2>
  <p>Kui toodet kasutatakse kaubanduslikuks, valitsuslikuks, mittetulunduslikuks, charter-, rendi-, õppe- või muuks otstarbeks peale era-vabaaja kasutuse, on garantiiperiood kõigi komponentide puhul vähendatud üheks (1) aastaks alates originaalsest jaemüügist ostukuupäevast. Võistlustel, kiirus- või vastupidavusvõistlustel kasutamine tühistab kohe ja jäädavalt kogu garantiid.</p>

  <h2>Kuidas esitada garantiinõue</h2>
  <p>Võtke ühendust Aquafarer või oma volitatud edasimüüjaga koos ostutõendi ja probleemi üksikasjaliku kirjeldusega. Aquafarer vaatab nõude läbi ja annab juhised kontrolli ja teeninduse kohta.</p>
  <p>Garantiiteeninduse päringute puhul, palun võtke meiega ühendust läbi meie<a href="/contact" class="text-sky-600 underline">kontaktlehe</a>koos tellimuse numbri ja tooteandmetega.</p>

  <h2>Kolmandate osapoolte esemed</h2>
  <p>Kolmandate osapoolte poolt valmistatud seadmed, komponendid või süsteemid (isegi kui paigaldas Aquafarer) on kaetud ainult vastava tootja pakutava garantiiga. Aquafarer keelab selgesõnaliselt igasuguse garantiikohustuse selliste kolmandate osapoolte esemete eest.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  See garantiiväljend on kokkuvõte täielikust Aquafarer tootja piiratud garantiist. Kogu seaduslik garantiidokument reguleerib kõiki garantiitingimusi ja -tingimusi. Tehnilised andmed võivad muutuda ilma ette teatamata. Aquafarer on Aquafarer Qingdao tootmiskeskuse tehasebränd.
  </p>
