content_capability:
  tagline: Insenerivõimekus
  title: Meie inseneriteadus<br />Meeskond toimetab
  subtitle: Aquafarer inseneriteadus katab kogu toote elutsükli — alates turu-uuringust ja kontseptsiooni kujundamisest kuni prototüüpimise, testimise ja masstootmiseni.
  items:
    - title: Tööstusdisain
      description: Meie tööstusdisaini meeskond töötab klientide nõudmiste, turu-uuringute ja konkurentsianalüüsi alusel, et arendada tootekontseptsioone, mis tasakaalustavad esteetikat, funktsionaalsust ja valmistatavust. Me loome 2D visandeid, 3D renderdusi ja spetsifikatsioonidokumente kliendi ülevaatuseks enne tööriistadega alustamist.
      features:
        - Kontseptsiooni arendamine ja teostatavusuuringud
        - 2D disainijoonised ja 3D visualiseeringud
        - Materjali valik ja spetsifikatsioon
        - Tootmiseks mõeldud disaini (DFM) analüüs
        - Ergonoomika ja ohutuse hindamine
    - title: Struktuuriettevõtlus
      description: Meie struktuuriinsenerid on spetsialiseerunud kummipaatide arhitektuurile — kere disain, torukambrite konfiguratsioon, drop-stitch tuuminsenerlus ja koormuse jaotumine. Iga disain analüüsitakse struktuurse terviklikkuse, kaalu optimeerimise ja asjaomaste standardite (CE, ISO, AS) järgimise osas.
      features:
        - Sügava V-kujulise klaaskiust kere disain arvutatud deadrise-nurkadega
        - Mitmekambri toru konfiguratsioon ohutuse ja ujuvuse jaoks
        - Drop-stitch tuuma spetsifikatsioon ja tiheduse optimeerimine
        - Lõplike elementide analüüs koormust kandevate komponentide jaoks
        - Kaalujakuse ja stabiilsuse arvutused
    - title: 3D modelleerimine ja CAD
      description: Kõikide tootemustrite kujundused arendatakse enne prototüüpide tööriistade valmistamist 3D CAD-is. Meie insenerid kasutavad tootemudelite loomiseks SolidWorks-i ja Rhino 3D-d, võimaldades klientidel enne tootmisele pühendumist üle vaadata iga detaili — alates toruprofiilist kuni konsooli paigutuseni.
      features:
        - Täielik 3D CAD modelleerimine SolidWorksis ja Rhino 3D-s
        - Fotorealistlik renderdamine kliendi esitlusteks
        - Tehniline joonestus tootmiseks
        - Vormi ja tööriista disain 3D mudelitest
        - CAD-ist CNC otseandmete ülekandmine täppislõikamiseks
    - title: Prototüüpide valmistamine ja testimine
      description: Enne masstootmist läbib iga uus toode prototüübi staadiumi. Me viime läbi funktsionaalsed prototüübid kliendi hindamiseks, seejärel allutame need oma täielikule testimisprotokollile — survekatse, stabiilsuse test, koormustesti ja veetestid. Disaini iteratsioonid prototüübi staadiumis on kiired ja kuluefektiivsed.
      features:
        - Kiire prototüübi tööriistade valmistamine (15-20 päeva täitmisaeg)
        - Funktsionaalne prototüüp reaalmaailma hindamiseks
        - Täielik testimisprotokoll enne tootmise kinnitamist
        - Iteratiivne disaini täiustamine testitulemuste põhjal
        - Kliendi heakskiidu verstapost enne tootmisriistade tegemist
    - title: Kohandatud tarvikute integreerimine
      description: Paljud OEM projektid nõuavad kliendi või kolmanda osapoole tarvikute integreerimist — kohandatud konsoolid, spetsiaalsed istmed, elektroonikasüsteemid, sukeldumisvarustuse kinnitused või brändielemendid. Meie insenerimeeskond haldab kõigi tarvikute integreerimisdisaini, struktuurset kohandamist ja kvaliteedi valideerimist.
      features:
        - Konsooli disain ja instrumentide paneeli paigutus
        - Kohandatud istmete ja polsterduse integreerimine
        - Elektroonikasüsteemide disain ja juhtmestik
        - Sukeldumis- ja päästevarustuse paigaldussüsteemid
        - Brändingu ja graafika rakendamise spetsifikatsioonid
content_process:
  tagline: Arendusprotsess
  title: Kontseptsioonist<br />Tootmiseni
  subtitle: Meie tootearendusprotsess järgib struktureeritud 6-etapilist töövoogu, mis on kavandatud riski minimeerimiseks, ajakava lühendamiseks ja tootmisvalmiduse tagamiseks esimesest päevast alates.
  stages:
    - stage: '01'
      title: Nõuded ja uurimistöö
      duration: 1-2 nädalat
      description: Me töötame koos kliendiga toote spetsifikatsioonide, sihtturu nõuete, regulatiivsete nõuete ja ärieesmärkide määratlemiseks. See etapp loob Toote Nõuete Dokumendi (PRD), mis juhib kõiki järgnevaid töid.
      deliverables: PRD, turuanalüüs, konkurentsianalüüs, esialgne maksumuse hinnang
    - stage: '02'
      title: Kontseptsiooni disain
      duration: 2-3 nädalat
      description: Tööstusdisaini meeskond arendab tootekontseptsioone PRD alusel. Esitatakse mitu disainivalikut koos 3D renderdustega, materjalisoovituste ja algsete insenerihinnangutega. Klient valib detailse arenduse suuna.
      deliverables: 3D kontseptsioonirenderdused, materjalispetsifikatsioonid, disaini põhjendused, esialgne materjalide nimekiri
    - stage: '03'
      title: Detailne insenertehnika
      duration: 2–4 nädalat
      description: Valitud kontseptsioon on täielikult kujundatud — 3D CAD modelleerimine, struktuurianalüüs, torude konfiguratsioon, kere disain, lisaseadmete integreerimine ja tootmisdokumentatsioon. Kõik mõõtmed, materjalid ja protsessid on tööriistade jaoks täpsustatud.
      deliverables: Täielik 3D CAD mudel, insenerijoonised, lõplik BOM, tööriistade spetsifikatsioonid, QC plaan
    - stage: '04'
      title: Prototüüpimine
      duration: 2-3 nädalat
      description: Prototüübi tööriistad on toodetud ja funktsionaalsed proovid ehitatud. Klient hindab prototüüpi vastavalt PRD spetsifikatsioonidele. Testimine viiakse läbi vastavalt kokkulepitud protokollile. Kujunduskorrektuurid tehakse tagasiside põhjal enne tootmistööriistade ettevalmistamist.
      deliverables: Funktsionaalne prototüüp, testiaruanne, disainimuudatuste logi, kliendi kinnituse dokument
    - stage: '05'
      title: Tootmisriistvara
      duration: 2-3 nädalat
      description: Kui prototüüp on heaks kiidetud, tellitakse tootmisvahendid — vormid, keevitusjigid, lõikamisprogrammid, kokkupanemisseadmed. Kvaliteedikontrolli dokumentatsioon ja kontrollikriteeriumid viime lõpule. Protsessi valideerimiseks tehakse proovikäik.
      deliverables: Tootmisvahendid, protsessi dokumentatsioon, QC kontrollplaani, katsetamisaruanne
    - stage: '06'
      title: Masstootmine ja kvaliteedikontroll
      duration: Jätkub
      description: Täismahus tootmine algab protsessi käigus toimuvast kvaliteedikontrollist igas etapis. Esimesed artiklid kontrollitakse ja kinnitatakse enne partiide vabastamist. Tootmise elutsükli jooksul toimub pidev kvaliteedi jälgimine, defektide jälgimine ja pidev parendamine.
      deliverables: Tootmisgraafik, kvaliteedikontrolli aruanded, partii jälgitavuse dokumendid, saatmisdokumentatsioon
content_customization:
  tagline: Kohandamise valikud
  title: Mis saab olla<br />Kohandatud
  subtitle: Peaaegu kõiki meie toodete aspekte saab kohandada vastavalt kliendi nõudmistele. Allpool on kõige tavalisemad kohandamiskategooriad.
  columns: 3
  items:
    - title: Hull & struktuur
      description: Kohandatud kere pikkus, laeva laius, kere kalle, toru läbimõõt, kambri konfiguratsioon ja materjali klass.
      icon: tabler:sailboat
    - title: Värvid ja graafika
      description: Torukate värv (PVC/Hypalon), kere gelcoati värv, konsooli värv, tekigraafika, logo paigutus ja pakendi kujundus.
      icon: tabler:palette
    - title: Konsool ja juhtnupud
      description: Keskkonsool, külgkonsool või roolipulkrool. Kohandatud instrumentide paneeli paigutus, lülitite asetus ja rooli asukoht.
      icon: tabler:steering-wheel
    - title: Istmed ja polsterdus
      description: Jokiistmed, pink-istmed, luksuslik polsterdus, värviga sobivad õmblused, kokkupandavad või eemaldatavad konfiguratsioonid.
      icon: tabler:armchair
    - title: Aksessuaarid ja seadmed
      description: Sukkelredelid, paagide riiulid, pealeveopüloonid, T-katuse konstruktsioonid, Bimini-katuse konstruktsioonid, heliinstalleeringud, navigatsiooni elektroonika ja turvavarustus.
      icon: tabler:backpack
    - title: Pakendamine ja brändimine
      description: Kohandatud jaemüügipakendid, privaatmärgisega kastid, kaubakastid brändimärkidega, riputustahvlid ja kasutusjuhendid kliendi keeles.
      icon: tabler:box
content_industries:
  tagline: Tööstusrakendused
  title: Insenerilahendused<br />valdkonna järgi
  subtitle: Meie insenerimeeskond on arendanud tooteid laiale valikule merendustarvetest — igaühel on oma nõuded ja jõudlusnäitajad.
  columns: 3
  items:
    - title: Sukeldumise operatsioonid
      description: Tugevdatud tekid, sukeldumistrepi integreerimine, tankide hoiustamissüsteemid ja stabiilsed platvormid kaubanduslike sukeldumiskeskuste jaoks üle maailma.
      icon: tabler:lifebuoy
    - title: Pääste- ja hädaolukorrad
      description: Kõrge kiirusega kerekujundus, iseäralised vee äravoolutekid, seadmete paigaldussüsteemid ja mitmekambrilised turvakonfiguratsioonid SAR-operatsioonide jaoks.
      icon: tabler:alert-triangle
    - title: Merenduslik turism
      description: Reisijate mugavuse paigutused, päikesesirmi integreerimine, pardalemineku süsteemid ja kütusesäästlikud konfiguratsioonid saaretranspordi operatsioonide jaoks.
      icon: tabler:beach
    - title: Jahtide tugivahendid
      description: Kompaktsed kujundused davit-ladustamiseks, luksuslikud viimistlusvalikud, sobivad emalaeva värvid ja kõrge jõudlusega pukseerimise omadused.
      icon: tabler:sailboat
    - title: Kalapüük ja vesiviljelus
      description: Lamedate tekide konfiguratsioonid, livewell'i integreerimine, õngenogi paigutused, korrosioonikindlad tarvikud pideva soolase vee kokkupuute jaoks.
      icon: tabler:fish
    - title: Sadam ja tööstus
      description: Tugevdatud kere, töölaevade paigutused, personali transpordi konfiguratsioonid ja seadmete integreerimine avamere operatsioonide jaoks.
      icon: tabler:ship
