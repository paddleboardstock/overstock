hero:
  tagline: Partnerid ja levitamine
  title: Saage Aquafarer partneriks<br />— Globaalne jaotusvõrk
  subtitle: Liituge Aquafarer globaalse partnerivõrgustikuga. Teeme koostööd meredistribuutorite, paadikauplejate, seadmetemüügipunktide ja brändipartneritega 50+ riigis.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer globaalne partneri- ja distributsioonivõrk
content_programs:
  tagline: Partnerlusprogrammid
  title: Partnerlusprogrammid<br />Kasvuks loodud
  subtitle: Olgu te olete distributsioonipartner, kaupleja või brändipartner, Aquafarer pakub programme, mis on mõeldud teie äri toetamiseks.
  columns: 3
  items:
    - title: Distributsiooniprogramm
      description: Eksklusiivne territooriumi jaotus mahupõhise hinnastamise, turundustoe ja otsepöördumisega tehase poole. Minimaalne kohustus põhineb territooriumi suurusel.
      icon: tabler:world
    - title: Kauplejaprogramm
      description: Otsejuurdepääs kauplejatele hindadele, tootetäiendused, turundusmaterjalid ja garantiitugi jaemüügipunktide ja veebipoodide jaoks.
      icon: tabler:building-store
    - title: OEM/ODM partnerlus
      description: Täisteenuse OEM ja ODM tootmine koos kohandatud brändingu, pakendamise ja tootemõõtmetega. Kontseptsioonist konteinerini.
      icon: tabler:certificate
    - title: Brändipartnerlus
      description: Koosbrändimine, lähtekoha toodang ja eksklusiivsed mudeliprogrammid väljakujunenud brändidele mere- ja vabaõhutegevuse valdkonnas.
      icon: tabler:stars
    - title: Valitsus ja institutsionaalne
      description: Eelistatud tarnijaprogrammid valitsusasutuste, mereväe, sõjaväe ja humanitaarorganisatsioonide jaoks. Hankedokumentatsioon valmis pakkumiseks.
      icon: tabler:building-community
    - title: Resort & rentimispartner
      description: Laohinnad, järjepidev kvaliteet ja kohandatud bränding kuurortidele, sukeldumiskeskustele ja renditeenuste tegevustele üle maailma.
      icon: tabler:sun
content_benefits:
  tagline: Miks meiega partneriks saada
  title: Miks partnerid valivad Aquafarer
  subtitle: Meie partnerid saavad reaalse tootmisvõimekuse, järjepideva kvaliteedi ja kiire reageerimisega toe.
  list:
    - 'Otseühendus tehasega: töötage otse meie tootmismeeskonnaga — ilma vahendajateta. Saate kiiremaid vastuseid, paremaid hindu ja täielikku ülevaadet tootmisest.'
    - 'Kohandamiseks valmis: brändige oma tooted kohandatud värvide, logode, pakendite ja spetsifikatsioonidega. Minimaalne tellimuse kogus kohandatud teie turule.'
    - 'Kvaliteet garantii: ISO 9001 sertifitseeritud tootmine koostöös CE, UKCA ja BSCI nõuetele vastavusega. Iga toode testitakse enne saatmist.'
    - 'Globaalne logistika: saadetised Qingdost, Hiinast koos FOB, CIF ja DDP valikutega. USA ladu Montclairis, CA Põhja-Ameerika jaotuseks.'
    - 'Turundustugi: tootekataloogid, fotograafia, tehniline dokumentatsioon ja digitaalne materjal, et toetada teie müügitegevusi.'
    - 'Koolitus ja tugi: tootetäiendused teie müügimeeskonnale, tehniline tugi teie klientidele ja garantiiteenuste koordineerimine.'
content_process:
  tagline: Kuidas saada partneriks
  title: Lihtne koostööprotsess
  subtitle: Meie koostööprotsess on lihtne — loodud selleks, et saaksite hakata Aquafarer tooteid kiiresti müüma.
  items:
    - title: 'Samm 1: Esitage taotlus'
      description: Täitke meie partneri taotlusvorm koos oma ettevõtte profiili, sihtturu ja tootepüüdlustega.
    - title: 'Samm 2: Kvalifikatsiooni läbivaatamine'
      description: Meie partnerlussuhtluse meeskond vaatab teie taotluse läbi ja võtab teiega ühendust 3 tööpäeva jooksul, et arutada võimalusi.
    - title: 'Samm 3: Lepingu sõlmimine & seadistamine'
      description: Allkirjastage partnerlusleping, seadistage oma konto ja saage partnerihinnad, turundusmaterjalid ja tootenäidised.
    - title: 'Samm 4: Koolitus & käivitamine'
      description: Pakutakse tootekoolitust, müügitoetust ja turunduse materjale. Olete valmis müüma.
cta:
  title: Kas olete valmis saama Aquafarer partneriks?
  subtitle: Esitage partnerluse taotlus ja meie meeskond vastab 3 tööpäeva jooksul.
  actions:
    - variant: primary
      text: Esita partnerluse taotlus
      href: /contact
    - text: Vaata meie tooteid
      href: /products
