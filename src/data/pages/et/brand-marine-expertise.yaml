hero:
  tagline: Merenduse ekspertteadmised
  title: Mitukümmend aastat meretehnikat<br />igas kestas
  subtitle: Aquafarer ühendab sügava materjaliteaduse, täppistööstuse ja reaalse maailma testimise, et toota veesõidukeid, mis toimivad siis, kui see oluline on.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer mereinseneride ja teadus- ja arendustöö meeskond tööl
expertise_materials:
  tagline: Materjaliteadus
  title: Õige materjali valimine<br />iga rakenduse jaoks
  subtitle: Me töötame kolme põhimaterjaliga — igaüks valitud kindlate kasutusjuhtude ja jõudlusnõuete jaoks.
  columns: 3
  items:
    - title: Meretööstuse klassi PVC
      description: 1100 denjööri PVC kangas — meie mitmekülgseim materjal. UV-stabiliseeritud, kulumiskindel ja REACH nõuetele vastav. Ideaalne vaba aja paatidele, SUP laudadele ja jahtidele, kus on oluline kaal ja kuluefektiivsus.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Ülitugev keemiline vastupidavus ja UV stabiilsus. Hypalon paadid võivad korraliku hoolduse korral kesta 15–20 aastat. Soovitatav kaubanduslikuks, pääste- ja sõjaväeliseks kasutamiseks, kus pikaajaline vastupidavus on kriitilise tähtsusega.
      icon: tabler:shield
    - title: Klaaskiud ja alumiinium
      description: Sügava-V klaaskiust kere RIBs ja patrullpaatide jaoks — lainet lõikav jõudlus rasketes tingimustes. Alumiiniumkere raskete kaubanduslike tööpaatide jaoks, mis vajavad maksimaalset tugevust ja kandevõimet.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Tootmisvõimalused
  title: Täppistootmine<br />igal sammul
  subtitle: Meie 12 000 m² suurune rajatis on varustatud spetsialiseeritud masinatega iga tootmisetapi jaoks.
  columns: 2
  items:
    - title: CNC Lõikamine
      description: Arvutiga juhitav lõikamine tagab täpsed, korduvad kangapaneelid minimaalsete jäätmetega. Iga tükk sobib täpselt nii, nagu on kavandatud.
      icon: tabler:cpu
    - title: Kõrgsageduskeevitus
      description: Tööstuslik HF-keevitus tekitab õmblusi, mis on tugevamad kui alusmaterjal. Ühtlane temperatuuri ja rõhu kontroll tagab kõigil tootmispartiidel õhutihedad tihendid.
      icon: tabler:bolt
    - title: Drop Stitch tuumakokkusattumine
      description: Tuhanded polüestri niidid ühendavad ülemist ja alumist kangakihti, võimaldades kõrgsurve täitmist (15–20 PSI) jäikade, stabiilsete SUP laudade ja põrandate jaoks.
      icon: tabler:building-arch
    - title: Rõhutestimine
      description: Iga täispuhutav toode läbib enne saatmist survekatsetuse. RIB torusid testitakse 1,25-kordse nimisurvega — kui see seal peab vastu, toimib see ka vees.
      icon: tabler:wind
    - title: Õmbluse tugevuse testimine
      description: Iga tootmiserandi juhuslikud proovid läbivad purustava õmbluse tugevuse testi. Tulemused registreeritakse ja need on jälgitavad konkreetsete tootmispartiideni.
      icon: tabler:files
    - title: Vee testimine
      description: Iga RIB mudel läbib enne sertifitseerimist merkatsetused. Reaalse maailma testimine rannikutingimustes tõestab jõudlust, juhtimist ja stabiilsust.
      icon: tabler:ripple
expertise_design:
  tagline: Disain ja inseneriteadus
  title: Mõeldud tegelikeks tingimusteks
  subtitle: Meie disainifilosoofia algab sellest, kuidas paati kasutatakse — seejärel ehitatakse insenerilahendused selle kasutusjuhtumi ümber.
  items:
    - title: Deep-V kere disain
      description: Meie klaaskiu korpused sisaldavad arvutatud deadrise-nurki, mis on optimeeritud iga mudeli pikkuse ja kavandatud otstarbe jaoks. Järsem V-lahendus avamerelise tegevuse jaoks, madalam stabiilsuse tagamiseks.
    - title: Mitme kambriga turvalisus
      description: Igal paadil on 3–7 sõltumatut õhkamba. Kui üks kamber kahjustub, hoiavad ülejäänud kambrid paadi ujuvana ja töökorras.
    - title: Ergonoomiline paigutus
      description: Konsooli asend, toru kõrgus ja istekohtade paigutus on disainitud operaatori mugavust silmas pidades pikaajalisel kasutamisel — olgu see patrullimine, kalapüük või transport.
    - title: Kohandatud konfiguratsioon
      description: Toru värvid, konsooli paigutus, kütuse mahutavus, tarvikute kinnitused — iga mudelit saab kohandada konkreetsete kasutusnõuete järgi.
cta:
  title: Kas teil on konkreetne rakendus meeles?
  subtitle: Meie insenerimeeskond saab nõu anda materjalide valiku, disaini ja tootmise osas teie projekti jaoks.
  actions:
    - variant: primary
      text: Küsige meie inseneridelt
      href: /contact
    - text: Tootevaliku vaatamine
      href: /products
