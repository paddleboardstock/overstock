certifications:
  - title: CE Sertifitseerimine (EL 2016/425)
    standard: Isikukaitsevahendite määrus (EL) 2016/425 | EN ISO 12402
    description: Kõik Aquafarer ohutusseadmed vastavad CE märgistamise nõuetele Euroopa Isikukaitsevahendite määruse alusel. Iga toode testitakse sõltumatult TÜV Rheinlandi, Euroopa Teatatud Organisatsiooni, poolt. Meie täispuhutavad paadid ja RIBs vastavad meelelahutuslike seadmete direktiivi 2013/53/EL (RCD) C ja D kategooria nõuetele.
    body: CE sertifitseerimine hõlmab olulisi tervise- ja ohutusnõudeid isiklikele ujuvuskinnitustele ja täispuhutavatele veesõidukitele. TÜV Rheinland auditeerib meie tootmisüksust igal aastal, et kinnitada pidevat vastavust.
  - title: SOLAS — Mereohutuse tagamine
    standard: SOLAS III peatükk | LSA kood
    description: Life Vest Pro vastab SOLAS eeskirjadele avamere- ja kaubandusliku meretöö jaoks. Testitud 24-tunnise ujuvuse säilitamise, vee alla sattumisel automaatse täitumise ja võimekuse osas mereseisudes kuni jõud 5. Vastab III peatüki nõuetele päästevestidele kaubalaevadel.
    body: SOLAS heakskiit nõuab sõltumatut testimist teatatud organi poolt ujuvuse, tugevuse, nähtavuse ja automaatse aktiveerimise osas. Meie Life Vest Pro kannab täielikku SOLAS tüübi heakskiitu MED sertifikaadiga.
  - title: USCG Tüüp III / Tüüp V
    standard: 46 CFR osa 160 | USCG heakskiit
    description: Valitud Aquafarer päästevestid vastavad USA rannavalve klassifikatsioonile Tüüp III (ujuvusabi) ja Tüüp V (erikasutus) seadmete jaoks. Sobivad kaitstud vetes, rannikul sõitmiseks ja kaubanduslikeks tegevusteks, mis nõuavad USCG-heakskiidetud PFD-sid.
    body: USCG heakskiit nõuab CG tunnustatud sõltumatu labori testimist. Tüüp V heakskiit hõlmab hübriidtüüpi täispuhutavaid mudeleid, mis vajavad käsitsi või automaatset aktiveerimist.
  - title: BSCI Sotsiaalne vastavus
    standard: amfori BSCI käitumisjuhend
    description: Meie tehas auditeeritakse igal aastal amfori ärilise sotsiaalse vastavuse algatuse (BSCI) raames. See kinnitab eetilisi tööjõutavasid, tööohutust, õiglast tööaega ja keskkonnahaldust kogu meie 12 000 m² tootmisüksuses.
    body: BSCI vastavus on eeltingimus Euroopa jaemüüjatele ja importijatele. Meie praegune BSCI hinne on "C" (Hea), auditeeritud SGS poolt.
  - title: REACH & RoHS Vastavus
    standard: ELi REACH määrus (EÜ) 1907/2006 |RoHS Direktiiv 2011/65/EL
    description: Kõik PVC toodetes kasutatavad ühendid, liimid ja kattekihid Aquafarer vastavad ELi REACH keemiaohutuse nõuetele ja RoHS ohtlike ainete piirangutele. Iga tootesarja kohta on saadaval materjalide ohutusandmed (MSDS).
    body: REACH vastavus tagab, et piiratud SVHC ained ei ületaks lävipiiri. Regulaarsed kolmanda osapoole laboritestid kontrollivad iga tootmispartii jätkuvat vastavust.
  - title: ISO 9001:2015 Kvaliteedijuhtimine
    standard: ISO 9001:2015 |TÜV Rheinlandi sertifitseeritud
    description: Meie kvaliteedijuhtimissüsteem on ISO Rheinlandi poolt sertifitseeritud 9001:TÜV2015, hõlmates disaini, tootmist, testimist ja järelteenindust. Aastased järelevalveauditid tagavad pideva täiustamise ja protsesside kontrolli.
    body: ISO 9001 sertifitseerimine nõuab dokumenteeritud kvaliteedipoliitikaid, siseauditeid, juhtimise ülevaatusi, parandusmeetmeid ja jälgitavaid tootmisandmeid.
testimonial:
  quote: Oleme hankinud ohutusvarustuse mitmetelt tarnijatelt üle Aasia.Aquafarer on ainus tootja, kes esitas täieliku CE dokumentatsiooni, SOLAS sertifikaadid ja kolmanda osapoole testiaruanded kohe — ilma et oleks küsitud.
  author: Erik Lindström
  title: Ohutusametnik
  company: Balti merevarustus
  location: Soome
content_overpressure:
  tagline: Ülerõhu ohutus
  title: RIB Toru rõhk<br />Juhtimine kuumas kliimas
  subtitle: Täispuhutava toru rõhk suureneb temperatuuriga. Ülerõhu mõistmine ja juhtimine ennetab kahjustusi ning tagab ohutu töö troopilises ja kõrbekeskkonnas.
  items:
    - title: Boyle'i rõhuleevendusventiilid
      description: Aquafarer RIB Torud on varustatud ülerõhu leevendusventiilidega, mis automaatselt juhivad liigset rõhku üle lubatud maksimumi. Takistab õmbluspinget ja võimalikku toru purunemist päikesekuumuse tõttu.
      icon: tabler:gauge
    - title: Hommikust keskpäevani rõhu muutus
      description: Toru, mis on 20°C juures täispuhutud 3,5 kraadini PSI , võib+ PSI päikese käes 40°C juures tõusta 4,5 kraadini. Kuumas kliimas täida alati soovitatud vahemiku alumisse otsa ja lase leevendusventiilil üleliigset rõhku hallata.
      icon: tabler:sun
    - title: Soovitatavad töörõhud
      description: 'PVC torud: 3,0-3,5 PSI töökorras, 4,5 PSI maksimaalselt. Hypalon torud: 3,5-4,0 PSI töötavad, maksimaalselt 5,0 PSI . Testi alati 1,25x (4,4 PSI PVCfor , 5,0 PSI Hypalonfor ) vastavalt Aquafarer QC standarditele.'
      icon: tabler:chart-bar
    - title: Päikese käes viibimise parimad tavad
      description: Hoia RIBs varjulistes kohtades, kui neid ei kasutata. Kasuta UV-kaitsekatteid pikema ankru jaoks. Kontrolli ja reguleeri toru rõhku enne ja pärast päikese tipptundi. Ära kunagi ületa maksimaalset nimirõhku.
      icon: tabler:umbrella
    - title: Hädaolukorra depressuriseerimine
      description: Kui toru tundub liiga kõva või leevendusklapp väljub, laske õhku Halkey-Robertsi või sõjaväeklapi kaudu, kuni rõhk taastub tööulatusele. Kandke kaasas rõhumõõtjat täpsete lugemiste jaoks.
      icon: tabler:alert-circle
