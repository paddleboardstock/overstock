breadcrumb: OEM/ODM Tootja
tldr:
  summary: Paddle Board Overstock on otseselt tehasest OEM/ODM tootja. 12 000 m² ISO 9001:2015 rajatis, 15 000 ühikut aastane toodang, CE/BSCI/REACH/UKCA vastavus, madal MOQs alates 2–10 ühikust.
  points:
    - 12 000 m² ISO 9001:2015 sertifikaadiga Qingdao rajatis
    - 15 000 ühiku aastane tootmisvõimsus koos 200–300 oskusliku töötajaga
    - CE 2013/53/EU, UKCA, BSCI, REACH vastavus
    - 'Madal MOQs: 2–5 ühikut (RIB), 5–10 ühikut (SUP) standardmudelite puhul'
    - 50+ ekspordiriiki koos FOB Qingdao saatmisega
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 sertifitseeritud
      desc: SGS-audititud kvaliteedijuhtimissüsteem kõigil tootmisliinidel.
      variant: cert
    - icon: ⭐
      title: CE & UKCA Vastav
      desc: Täielik vastavus EL 2013/53/EU ja Ühendkuningriigi märgistusnõuetele.
      variant: cert
    - icon: ⭐
      title: BSCI Sotsiaalne audit
      desc: Kontrollitud eetilised tööpraktikad ja töökeskkonna standardid.
      variant: standard
    - icon: ⭐
      title: Madal MOQ alates 2 ühikust
      desc: 'Standard RIB mudelid alates 2–5 ühikust, SUP alates 5–10 ühikust. Kohandatud vorm: 200+.'
      variant: standard
process_section:
  eyebrow: Meie protsess
  title: Lõpp-lõpuni OEM/ODM töövoog
  subtitle: Alates disaini kirjelduse koostamisest kuni konteineri laadimiseni — kuus sammu teie privaatmärgisega täispuhutatava veesõidukini.
  steps:
    - step: '01'
      title: Spetsifikatsioon ja disaini kirjeldus
      desc: Jagage oma sihtspetsifikatsioone, CAD-jooniseid või võrreldavat toodet. Meie insenerimeeskond kontrollib materjale, mõõtmeid ja nõuetele vastavust (CE, BSCI) enne hinnapakkumise tegemist.
    - step: '02'
      title: 3D-vormi prototüüpimine
      desc: Me kujundame ja CNC-masinaga valmistame kohandatud vormid SUP laudadele, kajakkide korpustele ja RIB komponentidele. Prototüübivõtted valmistatakse 15–20 tööpäeva jooksul kinnitamiseks.
    - step: '03'
      title: Materjali valik ja proovide tootmine
      desc: Valige sõjaväe klassi PVC (0,9 mm–1,2 mm), Hypalon CSM või drop-stitch tuumakangaste hulgast. Toodame tootmiseelsed proovid teie brändi värvide, logo ja pakendiga kinnitamiseks.
    - step: '04'
      title: CE Tehase audit ja vastavus
      desc: Iga OEM tellimus sisaldab vastavusdokumente — CE vastavusdeklaratsioon, ISO 9001 jälgitavuse andmed, BSCI sotsiaalse vastavuse aruanne ja REACH materjalide deklaratsioonid.
    - step: '05'
      title: Masstootmine ja jooksva kvaliteedikontroll
      desc: Tootmisprotsessid järgivad meie 100-punktilist kvaliteedikontrolli nimekirja. Iga ühik läbib 24-tunnise rõhku säilitamise testi, õmbluste eraldumistesti ja visuaalse kontrolli enne pakendamist.
    - step: '06'
      title: FOB Qingdao logistika ja saatmine
      desc: Valmistooted paigutatakse palettidele, kiletatakse ja laaditakse konteineritesse Qingdao sadamas. Me hoolitseme kõigi ekspordidokumentide, tollivormistuse eest ja pakume reaalajas saadetise jälgimise võimalust.
capabilities_section:
  eyebrow: Tootmisvõimalused
  title: Mida me ehitame
  subtitle: Kuus tuumiktootmisvõimekust B2B globaalsetele partneritele.
  items:
    - title: Drop-Stitch SUP Plaaditootmine
      desc: Täispikk drop-stitch südamiklamineerimine jäikadele, kõrgsurve (15–20PSI) püstiste aerulaudadele. Eritellimusel pikkus, laius, paksus, kiikprofiil ja graafiline disain.
    - title: PVC Täispuhutavate paatide tootmine
      desc: Kõrgsageduslikud keevitatud PVC paadid, tenderid ja sportpaadid. Mitme kambriga konfiguratsioonid, põrandavalikud (liistu, õhutekk, rullimis) ja lisaseadmete integreerimine.
    - title: Hypalon RIB Paaditootmine
      desc: Kaubandusliku Hypalon CSM kvaliteediga torud, mis on kinnitatud klaaskiust või alumiiniumist sügav-V kere külge. 3,3 m kuni 6,0 m pikkused patrullideks, pääste-, ekskursioonideks ja sukeldumiseks.
    - title: Privaatbränd ja kohandatud bränding
      desc: 'Täielik privaatmärgi teenus: eritellimusel logo soojusülekanne või siiditrükk, bränditud pakend (jaemüügikastid, kandekotid), kasutusjuhendid sinu keeles ning vöötkood/UPCregistreerimine.'
    - title: Kohandatud vormi ja tööriistade disain
      desc: Sisemine 3D CAD/CAM insenerimeeskond. Me projekteerime ja valmistame eritellimusel alumiiniumist ja komposiitvormidest unikaalsete kerekujude, tekikonfiguratsioonide ja lisaseadmete paigalduspunktide jaoks.
    - title: OEM Tarvikud ja varustus
      desc: Päästevestid (CE12402), kahetoimelised pumbad, süsinik/nailonlabad, remondikomplektid, kandekotid ja rihma komplektid. Täielik komplekt ja komplektpakend jaemüügiks valmis.
experience_section:
  eyebrow: Pärismaailma kogemus
  title: Partnerlused, mis ehitasid brände
  subtitle: Tõelised lood brändidelt ja organisatsioonidelt, kes tegid koostööd Paddle Board Overstock OEMtootmise võiODM tootmise jaoks.
  stories:
    - quote: Me tulime Paddle Board Overstock teadvusele salvrätikul oleva visandiga ja nõuete nimekirjaga. Kaheksa kuud hiljem oli meil tootmisvalmis toode, mis läbis CE sertifitseerimise juba esimesel katsel.
      narrative: Euroopa idufirma uue SUP disainiga Paddle Board Overstock ODM lähenemisega tootmiseks. Paddle Board Overstock Teadus- ja arendusmeeskond viis kontseptsiooni läbi CAD-disaini, FEA struktuurianalüüsi, hüdrodünaamilise simulatsiooni, vormide loomise, prototüüpide valmistamise ja tootmistööriistade loomise. Idufirma asutaja külastas Qingdaot protsessi jooksul kolm korda. Lõpptoode läbis CE sertifitseerimise ilma muudatusteta — mille tulemuseks asutaja Paddle Board Overstockseob inseneride meeskonnale, kes mõistis Euroopa regulatiivseid nõudeid algusest peale.
      context: Euroopa SUP brändi lansseerimine, 2023–2024
      source: Brand Founder
    - quote: NDA Kaitse ja intellektuaalomandi turvalisuse Paddle Board Overstock tase annab meile kindlustunde jagada oma patenteeritud disaine. Nad kohtlevad meie IP-d nagu oma oma.
      narrative: USA-s asuv merevarustuse ettevõte, millel oli patenteeritud klapitehnoloogia, vajas tootmispartnerit, kes suudaks kaitsta nende intellektuaalomandit ja toota suuremas mahus. Pärast viie Hiina tootja auditeerimist valisid nad Paddle Board Overstock tehase intellektuaalomandi kaitseprotokollide, turvalise disainifailide käsitlemise ja rangete konfidentsiaalsuslepingute allkirjastamise valmisoleku alusel. Partnerlus on nelja aasta jooksul tootnud kolm tootesarja ilma ühegi intellektuaalomandi intsidentideta.
      context: USA merevarustuse ettevõte, OEM partnerlus alates 2021. aastast
      source: Operatsioonide asepresident
