hero:
  tagline: Teadmiste graafik
  title: Veeuurimise teadmised
  subtitle: |
    Struktureeritud teadmistebaas, mis hõlmab täispuhutava SUP tehnoloogiat,<br />
    veekindlus, paadiehitustehnika ja seiklusplaneerimine.
  taglineSection: Avasta. Õpi. Liigu enesekindlalt.
clusters:
  tagline: Teadmiste klastrid
  title: Uurige teemade kaupa
  subtitle: Sügav sukeldumine iga Aquafarer toote tehnoloogia, ohutuse ja oskuste maailma.
  items:
    - title: SUP Teadmised
      description: Alates oma esimesest laua valimisest kuni edasijõudnute tuurimise tehnikateni — kõik, mis puudutab laua peal seismist ja sõudmist.
      icon: tabler:lifebuoy
      topics:
        - Kuidas valida oma esimest täispuhutavat SUP
        - Parim SUP suurus algajatele
        - Kui raske on aerulauaga sõitmine?
        - Täispuhutav vs kõva laud võrdlus
        - SUP ohutuskontrollnimekiri
    - title: Paadi Teadmised
      description: Tehnilised juhendid täispuhutavate paatide, RIBs, peale- ja kajakite kohta — inseneritehnika, materjalid ja kasutamine.
      icon: tabler:sailboat
      topics:
        - Täispuhutavate paatide tüübid selgitatud
        - PVC vs Hypalon võrdlus
        - RIB vs Dinghy võrdlus
        - Drop-stitch tehnoloogia süvaülevaade
        - Merematerjalide teaduse juhend
    - title: Ohutusalane teadmine
      description: Oluline ohutusalane teadmine iga aerutaja jaoks — alates PFD valimisest kuni ilma lugemiseni ja enesepäästetehnikateni.
      icon: tabler:shield
      topics:
        - SUP ohutuskontrollnimekiri
        - Kas sul on vaja päästevesti?
        - Ookeani aerutamise ohutusjuhend
        - Jõeturve täispuhutavate kajakite jaoks
        - Ilma- ja veeolude teadlikkus
    - title: Tehnoloogia
      description: Aquafarer toodete inseneritehnika — materjalid, konstruktsioonimeetodid ja kvaliteeditestimine.
      icon: tabler:microscope
      topics:
        - Mereväe PVC tasemel tehnoloogia
        - Drop-stitch Core selgitas
        - Miks on PSI täispuhutava SUPsjaoks oluline
        - RF-keevitus vs liimimine
        - Kvaliteeditestimine ja sertifitseerimine
    - title: Äriteadmised
      description: Ärilised juhendid veespordiäri ülesehitamiseks ja laiendamiseks — alates renditegevusest kuni privaatbrändinguni.
      icon: tabler:briefcase
      topics:
        - Kuidas alustada SUP rendiettevõtet
        - Kuurordi veespordikeskuse ehitamine
        - Aerulaudade laevastiku suurus klubidele
        - Täispuhutav vs kõva SUP kommertskasutuseks
        - Parim kajakimaterjal rendilaevastikule
        - Isikliku kaubamärgiga veebrändi loomine
        - Kuurordi veespordi tulustrateegiad
        - Kommertsseadmete hooldusjuhend
