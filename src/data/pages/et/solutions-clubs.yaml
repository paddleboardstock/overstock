testimonial:
  content: Alustasime Club Starter paketi tellimisest meie surfikoolis Portugalis. 20 lauda, aerud, vestid — kõik saabus kolme nädala jooksul. Pärast kahte hooaega uuendasime Pro paketile. Kohandatud bränding meie logoga muutis meie professionaalse kuvandi täielikult.
  name: Ricardo Santos
  title: Omanik, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Klubiprofiilid
  title: Veespordi klubi lahendused<br />Klubi tüübi järgi
  subtitle: Ülikooli aerutamisklubidest eksklusiivsete privaatsete jahtklubideni — iga klubi tüüp vajab erinevat varustust, kasutamismustreid ja eelarvelisi lahendusi. Kohandame iga paketi vastavalt klubi mudelile.
  items:
    - title: Ülikooli ja kolledži aerutamisklubid
      subtitle: Suure kasutusega tudengiparved
      description: Tudengite juhitud või asutuse toetusega aerutamisklubid, mis tegutsevad SUP ja kajakis programmide raames ülikooli vabaajaosakondade jaoks. Varustus on suure sagedusega ja kiire kulumisega, eri oskuste tasemel igal semestril. Vastupidavus ja lihtne parandatavus on kriitilised, lisaks eelarvesõbralikud hinnad tudengiorganisatsioonidele.
      features:
        - Erk- ja vastupidav PVC konstruktsioon, hinnatud tudengikasutuse tsükliteks
        - Värvikoodiga laudade valik oskuste taseme järgi lihtsaks parvehaldamiseks
        - Parandamisvahend + videotoega igal tellimusel
        - Tudengiorganisatsioonidele allahindlused ja semesteripõhised maksetingimused
    - title: Kogukonna aerutamis- ja sotsiaalsed klubid
      subtitle: Liikmeskonnale suunatud vaba aja klubid
      description: Kogukonnapõhised klubid, pakkudes SUP, kajaki- ja sotsiaalseid aerutamiskogemusi liikmetele. Varustuse peab tasakaalustama jõudlus ja mugavus laiale vanusevahemikule, bränding edendab klubi identiteeti ja liikmete uhkust. Ladustamise efektiivsus on oluline klubidele, mis tegutsevad piiratud veepiirdelt.
      features:
        - 'Segatud parv: universaalsed SUPs, tuurilaudade ja vaba aja kajakid'
        - 'Täielik klubi bränding: eritellimusel värvid, logo trükkimine, bränditud päästevestid'
        - Kompaktsed hoiulahendused täispuhutavale varustusele
        - 'Liikmeskonna kasvatamise algkomplekt: soovituskaardid, bränditud fotograafia'
    - title: Surfikoolid ja surfikajakate akadeemiad
      subtitle: Rannapiirkonna esitusvõime ja treening
      description: Surfile keskendunud koolid õpetavad SUP surfamist, surfikajakaga sõitmist ja lainete läbisõidu oskusi. Varustus peab töötama surfitingimustes — manööverdusvõime, reageerimisvõime ja piisav vastupidavus korduvatele kukkumistele, liiva kulumisele ja merevee mõjule ilma kiire degradeerumiseta.
      features:
        - Lühemad, laiemad SUP kujundid, mis on optimeeritud surfimisel manööverdamiseks
        - Vastupidava lainetele mõju kindlustamiseks tugevdatud ääre konstruktsioon
        - 'Surfile spetsiaalne turvavarustus: keeratud rihmad, pehmed uimed'
        - Laevastiku asendusprogramm hooajaliste soodustustega vahetamisel
    - title: Korporatiivsed ja privaatjahiklubi
      subtitle: Premium-liikmete kogemused
      description: Eksklusiivsed privaatklubid pakuvad veespordi võimalusi premium-mugavusena liikmetele. Varustuse standardid on kõrged — esteetika, brändi järgimine ja külalistele valmis esitamine on sama olulised kui sooritus. Teenuse ootused hõlmavad tippkvaliteediga kohaletoimetamist, eritellimusel hoiulahendusi ja kontsernitaseme tuge.
      features:
        - Premium viimistlusega lauad, puidukujundusega EVA ja metallilised aktsendid
        - Eritellimusel värvimine vastavalt klubi brändijuhistele
        - 'Teeninduskontsern: eelnevalt täispuhutud, lavastatud ja iga hooaja jaoks tähistatud'
        - Pühendatud kontohaldus esmatähtsa reageerimise tasemega (SLA)
