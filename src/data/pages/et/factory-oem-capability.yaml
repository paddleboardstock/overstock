services:
  - title: Toote disain ja inseneriteadus
    description: Meie sise-R&D meeskond töötab teie kontseptsiooni või spetsifikatsiooniga, et arendada CAD-jooniseid, 3D-mudeleid ja prototüüpe. Pakume halli disainimist, kere kuju optimeerimist ja materjalivaliku juhiseid.
  - title: Kohandatud bränding ja graafika
    description: Täisvärviline digitrükk, siiditrükk, reljeeftrükk ja siltide valikud. Arendame brändispetsiifilisi tekigraafikaid, toru brändingut ja jaemüügivalmis pakendamist.
  - title: Materjali ja spetsifikatsiooni kohandamine
    description: Valige PVC (standard, ökoloogiline, tulekindel), Hypalon/CSM, drop-stitch ja hübriidkonstruktsioonide vahel. Kohandatud toru värvid, kangaste kaalud ja tugevdamisvõimalused.
  - title: Pakendamine ja logistika
    description: Kohandatud jaemüügipakendid, eramärgiga karbid, vaakumpakend, palkimine ja konteinerisse laadimine. Saadaval FOB Qingdao, CIF või DDP saatetingimused.
