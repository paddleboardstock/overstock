why_us:
  - title: Vertikaalne integratsioon
    description: Meie omame oma tehast, vorme ja tarneahelaid — puuduvad vahendajad ja alltöövõtjad. See annab meile kontrolli kvaliteedi, kulude ja kohaletoimetamise üle.
  - title: Kahepoolne sertifitseerimine
    description: ISO 9001 kvaliteedijuhtimise ja BSCI sotsiaalse vastavuse sertifikaat. Tehase auditi raportid on saadaval taotluse alusel.
  - title: CE Vastavus
    description: Kõik standardmudelid omavad CE 2013/53/EU sertifikaati. Kohandatud mudeleid saab CE sertifitseerida meie väljatöötatud protsessi kaudu.
  - title: Madal MOQ
    description: Alusta vaid 5 ühikuga standardmudelite puhul. Me aitame uutel brändidel turule tulla ilma, et peaks liialt ladustama.
