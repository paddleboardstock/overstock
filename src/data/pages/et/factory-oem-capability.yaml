hero:
  tagline: OEM/ODM Tootmine
  title: OEM & Eramärgiga tootmine
  subtitle: Alates kontseptsioonist kuni konteinerini — kohandage iga detail oma täispuhutavate veesõidukite seerial
intro: Aquafarer pakub terviklikke OEM ja ODM teenuseid brändidele, turustajatele ja valitsusasutustele üle kogu maailma. 10+ aasta ekspordikogemuse ja 12 000 m² ISO 9001 & BSCI sertifitseeritud tehasega tegeleme kõigega alates toote disainist ja halli arendamisest kuni täieliku tootmise, pakendamise ja logistika korraldamiseni.
