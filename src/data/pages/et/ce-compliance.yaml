content_scope:
  tagline: Vastavuse ulatus
  title: Millised tooted vajavad<br />RCD vastavust?
  subtitle: Vaba aja veesõidukite direktiiv 2013/53/EL kehtib vaba aja veesõidukitele, mille kere pikkus on 2,5 m kuni 24 m. Ulatuse mõistmine on esimene samm vastavuseks.
  items:
    - title: RIB Paadid (2,5–24 m)
      description: Kitsad täispuhutavad paadid, mille kere pikkus on 2,5 m kuni 24 m, kuuluvad RCD alla. Disainikategooriad A kuni D kehtivad sõltuvalt kavandatud mereoludest ja maksimaalsest tuulekiirusest.
      icon: tabler:sailboat
    - title: Täispuhutavad paadid (alla 2,5 m)
      description: Väikesed täispuhutavad paadid ja paadid alla 2,5 m võivad olla osaliselt vabastatud RCD, kuid vajavad siiski CE märgistust teiste kohaldatavate direktiivide ja EN ISO 6185 konstruktsioonistandardite alusel.
      icon: tabler:sailboat
    - title: SUP Lauad ja tarvikud
      description: Lauatamine laudadel (stand-up paddle) jääb väljaspool RCD ulatust. Siiski vajavad seotud isikukandmisvahendid (PFD-d) CE märgistust isikukaitsevahendite määruse (EL) 2016/425 alusel, kui kohaldatav, koos III/V tüübi kinnitusega.
      icon: tabler:swimming
    - title: Osaliselt valmis paadid
      description: Paadid, mis tarnitakse ilma mootori või teatud paigaldusteta, vajavad osaliselt valminud veesõiduki tootja deklaratsiooni, täielik RCD vastavus viiakse lõpuks ellu lõplikult tootja või importija poolt.
      icon: tabler:tool
content_trust_layers:
  tagline: Kolmekihiline usaldussüsteem
  title: Vastavusteave<br />— Jagatud Õigel Tasemel
  subtitle: Kõik vastavuseandmed ei kuulu avalikule veebisaidile. Me järgime kolmekihilist lähenemisviisi, mis kaitseb IP-d ja samal ajal suurendab ostjate usaldust.
  items:
    - title: Kiht 1 — Avalik veebisait
      description: Viidatud standardid, selgitatud vastavusrajad, loetletud dokumenditüübid, sertifitseerimisala iga mudeliperekonna kohta. Pole tegelikke sertifikaate, katseandmeid ega patenteeritud insenertehnilisi detaile.
      icon: tabler:world
    - title: Kiht 2 — Pärast päringu esitamist jagamine
      description: 'Pärast kvalifitseeritud päringut: redigeeritud DoC näidised, ehitaja plaadi foto, kohaldatavate standardite loend, vastavuskontrollnimekiri ja materjalide sertifitseerimise kokkuvõtted — jagatud õiglasel kasutustingimusel.'
      icon: tabler:mail
    - title: Kiht 3 — NDA / Tellimusfaas
      description: Täielik tehniline fail, riskihinnangud, stabiilsusarvutused, katsereportid, materjalide partiiarvestus ja tootmise jälgitavuse dokumentatsioon — jagatakse ainult NDA kinnitatud ostjatele.
      icon: tabler:lock
content_standards:
  tagline: Kohaldatavad standardid
  title: ISO & EN standardid<br />Meie ehitame vastavalt
  subtitle: Meie tooteid on projekteeritud ja testitud RCD all ühtlustatud standardite järgi. Viidatud on standardi numbrid ja nimed; kogu standardtekstid jäävad ISO autoriõiguse alla.
  items:
    - title: EN ISO 6185-3
      description: 'Painduvad paadid — Osa 3: Paadid, mille maksimaalne mootorivõimsus on 15 kW või rohkem. Ehitus, stabiilsus, ujuvus ja meeskonnaliikme üle parda taastamise nõuded RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Painduvad paadid — Osa 4: Paadid, mille maksimaalne mootorivõimsus on 15 kW ja võrdne või suurem kui 4,5 kW. Täiendavad konstruktsioonilised ja stabiilsusnõuded.'
      icon: tabler:file-text
    - title: ISO 12215 seeria
      description: Väikesed alused — Kere konstruktsioon ja mõõtmed. Kere, teki ja vaheseinte konstruktsiooniline projekteerimine klaaskiust ja alumiiniumist RIB kerega aluste jaoks.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Väikesed alused — Kasutusjuhend. Nõutav sisu ja vorm iga RIB paadi puhul, mida tarnitakse EL-is.
      icon: tabler:book
    - title: ET ISO 14945
      description: Väikesed alused — Ehitaja plaat. Teave, mis tuleb igale alusele jäädavalt kinnitatud ehitaja plaadile märkida.
      icon: tabler:badge
    - title: ISO 8666
      description: Väikesed alused — Põhiandmed. Standardiseeritud mõõtmed ja parameetrid ühtlase spetsifikatsiooni tagamiseks kogu tootmistokumentatsioonis.
      icon: tabler:dimensions
content_process:
  tagline: Vastavuse protsess
  title: 6-astmeline CE vastavus<br />Töövoog
  subtitle: Alates projekti ulatusest kuni seerianivoo jälgitavuseni — iga RIB mudel järgib määratletud vastavusteed.
  steps:
    - number: '01'
      title: Projekti ulatus ja klassifikatsioon
      description: Määratle RIB mudel, disainikategooria (A/B/C/D), maksimaalne inimkond, kandevõime, mootori võimsus ja sihtturg. Määra, kas RCD see kehtib ja millist vastavushindamise moodulit on vaja.
      timeline: 2–3 päeva
    - number: '02'
      title: Kohaldatavad nõuded Tuvastamine
      description: Tuvastada kõik asjakohased olulised ohutusnõuded RCD lisast I, asjakohased ühtlustatud standardid (EN ISO 6185, 12215, 10240, 14945) ja kõik täiendavad riiklikud nõuded sihtturule.
      timeline: 3–5 päeva
    - number: '03'
      title: Disain ja tehniline dokumentatsioon
      description: 'Loo põhiline tehniline fail: üldised paigutusjoonised, stabiilsuse ja ujuvuse arvutused, riskihindamine, materjalide spetsifikatsioonid ning süsteemide ohutusanalüüs (kütus, elektri, roolimine).'
      timeline: 10–15 päeva
    - number: '04'
      title: Toote kontrollimine ja testimine
      description: Läbi viia füüsiline kontroll — rõhutestimine 1,25x nimirõhul 24–48 tundi, stabiilsus- ja ujuvustestid, koormustestid ning süsteemide kasutuselevõtt. Registreeri kõik testitulemused kere kohta.
      timeline: 5–7 päeva
    - number: '05'
      title: Märgistamise ja kohaletoimetamise dokumentatsioon
      description: CE Kinnitusmärgistus, ehitaja plaat (EN ISO 14945) ja HIN/CIN (kere identifitseerimisnumber). Koosta ELi vastavusdeklaratsioon, kasutusjuhend (EN ISO 10240) ja vastavuskontrollnimekiri.
      timeline: 2–3 päeva
    - number: '06'
      title: Seeriatasandi jälgitavus
      description: Iga kere saab unikaalse kere kirje, mis seob selle tehnilise faili, tootmispartii, materjalisertifikaatide, testitulemuste ja lõpliku konfiguratsiooniga. Dokumendid säilitatakse 10+ aastat RCDvastavalt .
      timeline: Jätkub
content_document_cards:
  tagline: Dokumenditüübid
  title: Vastavusdokument<br />Kaardid
  subtitle: Need on dokumenditüübid, mida me iga CEsertifitseeritud mudeli jaoks koostame ja RIB hooldame. Näidised on saadaval kvalifitseeritud päringu alusel.
  items:
    - title: CE / RCD Vastavussertifikaat
      description: Mudelispetsiifiline sertifikaat, mis kinnitab, et alus vastab kõigile RCD 2013/53/EU olulistele ohutusnõuetele, mille tootja väljastab vajadusel teavitatud asutuse kaasamisel.
      icon: tabler:certificate
    - title: ELi vastavusdeklaratsioon (DoC)
      description: Tootja või volitatud esindaja allkirjastatud deklaratsioon, kus on loetletud kehtivad juhised, standardid, vastavusmoodul ja teavitatud asutuse andmed. Nõutav iga mudeli puhul, mis on ELi turule viidud.
      icon: tabler:file-check
    - title: Ehitaja plaat (EN ISO 14945)
      description: Püsivalt kinnitatud plaat, mis näitab maksimaalseid inimesi, maksimaalset mootori võimsust, disainikategooriat ja tootja identiteeti. Peab olema loetav kogu sõiduki eluea vältel.
      icon: tabler:badge
    - title: Kasutusjuhend (EN ISO 10240)
      description: Põhjalik käsiraamat, mis käsitleb ohutut töökorda, hädaolukorra protseduure, hooldusgraafikuid ja ohutushoiatusi. Kohustuslik kõigile RIB EL-is tarnitud seadmetele.
      icon: tabler:book
    - title: ISO Testi- ja inspekteerimisaruanded
      description: Rõhutestide andmed (1,25x / 24–48h), stabiilsuse ja ujuvuse testide tulemused, materjalide testi sertifikaadid ja mõõtmete kontrolli aruanded — kõik seotud konkreetsete kerenumbritega.
      icon: tabler:test-pipe
    - title: Materjali jälgitavuse andmed
      description: Toru kangaste, liimide, klaaskiudude ja tarvikute partiipõhine jälgitavus. Seob iga tootmisühiku sisseostetud materjalide sertifikaatide ja IQC-inspektsiooni tulemustega.
      icon: tabler:link
    - title: Kvaliteedi kontrolli ja QC andmed
      description: 100-punktiline kvaliteedikontrolli nimekiri iga ühiku kohta, protsessi käigus QC andmed, mittekvaliteediaruanded ja parandusmeetmed. Osa tootmise jälgitavusahelast.
      icon: tabler:clipboard-check
    - title: Projekti dokumendipakett
      description: Iga kere kohta dokumentide pakett, mis sisaldab lõpliku konfiguratsiooni kirjet, mootori ja seadmete paigaldamise üksikasju, seadistamise kontrollnimekirja ja üleandmisdokumentatsiooni.
      icon: tabler:package
content_design_categories:
  tagline: RCD disainikategooriad
  title: Disaini kategooriad A–D<br />— Mida need tähendavad
  subtitle: RCD määrab disaini kategooriad maksimaalse tuulejõu ja olulise lainetekõrguse põhjal, mida alus on kavandatud taluma.
  items:
    - title: A kategooria — Ookean
      description: Kavandatud pikemateks reisideks, kus tuulejõud võib ületada Beauforti 8 (>40 sõlme) ja oluline lainetekõrgus võib ületada 4 m. Nõuab kõige rangemat struktuuri ja stabiilsuse kontrolli.
      icon: tabler:ripple
    - title: B kategooria — Avamere
      description: Kavandatud avamere sõitudeks tuulejõuga kuni Beauforti 8 (≤40 sõlme) ja olulise lainetekõrgusega kuni 4 m. Sobib ranniku- ja osaliselt kaitstud vetesse.
      icon: tabler:anchor
    - title: C kategooria — Ranniku
      description: Kavandatud ranniku sõitudeks tuulejõuga kuni Beauforti 6 (≤27 sõlme) ja olulise lainetekõrgusega kuni 2 m. Enamik vaba aja RIBs kuuluvad sellesse kategooriasse.
      icon: tabler:sun
    - title: D kategooria — Kaitstud
      description: Kavandatud kaitstud vetes sõitudeks tuulejõuga kuni Beauforti 4 (≤16 sõlme) ja olulise lainetekõrgusega kuni 0,3 m. Järved, jõed ja kaitstud sadamad.
      icon: tabler:pool
content_hin:
  tagline: Aluse identifitseerimine
  title: HIN / CIN & Ehitaja plaat
  subtitle: Igal RIB paadil on vaja kere identifitseerimisnumbrit (HIN) või aluse identifitseerimisnumbrit (CIN) ja ehitaja plaati vastavalt EN ISO 14945 ja RCD nõuetele.
  items:
    - title: Kere identifitseerimisnumber (HIN)
      description: Unikaalne 14-kohaline kood, mis on püsivalt märgitud praami paremale küljele, kodeerides tootja koodi (MIC), mudeliaasta, tootmisaasta ja seerianumbri. Nõutud EL turule sisenemiseks.
      icon: tabler:hash
    - title: Aluse identifitseerimisnumber (CIN)
      description: Vastavalt EN ISO 10087, peidetud sekundaarne identifitseerimisnumber, mis asetatakse varjatud kohta varguse ja jälgitavuse eesmärgil.
      icon: tabler:eye-off
    - title: Ehitaja plaadi sisu
      description: Maksimaalne inimeste arv, maksimaalne mootorivõimsus (kW), maksimaalne koormus (kg), disaini kategooria, tootja nimi ja CE tähistus — kõik püsivalt kuvatud korrosioonikindlal plaadil.
      icon: tabler:badge
content_tech_file:
  tagline: Tehnilise faili struktuur
  title: Peamine tehniline fail<br />& Kere kirje
  subtitle: 'Meie dokumentatsioonisüsteem järgib kahetasandilist struktuuri: iga mudelipere jaoks on tehniline põhifail ja iga toodetud paadi jaoks eraldi kere andmed.'
  items:
    - title: Peamine tehniline fail
      description: 'Sisaldab täielikku vastavusdokumentatsiooni mudelipere kohta: üldine korraldus, riskihindamine, stabiilsuse/ujuvuse arvutused, materjalispetsifikatsioonid, kehtivad standardid ja vastavushindamise kirjed. Säilitatakse 10+ aastat.'
      icon: tabler:folder
    - title: Kere rekord (iga paadi jälgitavus)
      description: 'Igal kerel on unikaalne kirje, mis seob selle tehnilise põhifailiga: HIN, tootmiskuupäev, torupartii, materjalisertifikaadid, rõhutesti tulemus, lõplik konfiguratsioon, mootori paigaldus ja tarnesihtkoht.'
      icon: tabler:file-description
    - title: Kliendivastavuse pakett
      description: Kere kohta tarnepakett, mis sisaldab DoC-d, ehitaja plaadi fotot, kasutusjuhendit, testi kokkuvõtet ja lõplikku konfiguratsioonilehte — mis on kaasas iga RIB EL-i saadetud paketiga.
      icon: tabler:package
content_material_cert:
  tagline: Materjali sertifitseerimine
  title: Materjali jälgitavus &<br />Sertifitseerimise tõendid
  subtitle: RIB Kvaliteetsed paadid algavad kontrollitud materjalidest ja dokumenteeritud protsessidest. Allpool on toodud viisid, kuidas me korraldame materjalide sertifitseerimise iga kriitilise komponendigrupi jaoks.
  items:
    - title: Täispuhutava toru materjali jälgitavus
      description: PVC ja CSM/Hypalon toru materjalid valitakse vastavalt kavandatud kasutusele, kliimatingimustele ja sihtturule. Tarnija tehnilised andmed (TDS), materjalipartii info, kangapartiide UV jälgitavus ja ilmastikutestide aruanded ning REACH/SVHC deklaratsioonid on saadaval kokkulepitud projekti dokumentatsiooni raames.
      icon: tabler:circle
    - title: Merealumiiniumi jälgitavus
      description: Alumiiniumkere RIB projektide puhul kontrollitakse sulami kvaliteeti, paksust ja materjalipartiid vastavalt heakskiidetud spetsifikatsioonidele. Kokkulepitud kohta esitatakse materjalide testimise sertifikaadid (MTC/MTR), EN 10204 3.1 dokumentatsioon, keemilise koostise ja mehaaniliste omaduste aruanded ning soojus/partii jälgitavus.
      icon: tabler:rectangle
    - title: GRP kere materjal ja protsessikontroll
      description: Klaaskiust kereRIBs, gelkate, vaigu, klaaskiust tugevdus ja südamikumaterjalid haldatakse kontrollitud spetsifikatsioonide alusel. Materjali TDS/SDS, partiikirjed, laminaadi spetsifikatsioonid ning kõvenemise ja töökoja juhtimiskirjed on saadaval projekti kokkuleppel.
      icon: tabler:layers-subtract
    - title: Komponentide dokumentatsiooni tugi
      description: Valitud komponentide — sealhulgas EVA tekimaterjalide, istmete, roostevabast terasest riistvara, kütusesüsteemide, elektriseadmete ja merevarustuse — puhul koordineeritakse tarnijate dokumentatsioone lõpliku konfiguratsiooni ja sihtkoha turu nõuete alusel.
      icon: tabler:package
    - title: Vastavuse ulatuse teade
      description: Sertifikaadid, testaruanded ja vastavusdokumendid kehtivad ainult konkreetse tootemudeli, materjali, komponendi, tootmispartii või projekti ulatuse kohta, mis on toodud vastavas dokumendis. Võtke meiega ühendust oma sihtturu, kavandatud kasutuse ja tehniliste nõuete osas, et vastav dokumentatsioonipakett saaks enne tellimuse esitamist kinnitatud.
      icon: tabler:info-circle
faq:
  title: CE Vastavus — korduma kippuvad küsimused
  questions:
    - q: Kas kõik Paddle Board Overstock RIB paadid on CE sertifitseeritud EL-i turule?
      a: RIB Meie kataloogis olevad paadid on projekteeritud ja dokumenteeritud RCD vastavalt kehtivatele EL-i direktiividele vastavalt 2013/53/EL nõuetele.CE Märgistus kehtib mudeli ja konfiguratsiooni alusel. Võta meiega ühendust, et saada mudelipõhine vastavusulatuse dokument.
    - q: Mis vahe RCD on vastavusel ja CE hindamisel?
      a: RCD (Vabaaja sõidukite direktiiv 2013/53/EU) on ELi õigusakt, mis sätestab olulised ohutusnõuded.CE Märgistus on visuaalne sümbol, mis asetatakse tootele, mis on hinnatud ja kinnitatud nende nõuete täitmiseks. Toode peab vastama RCD nõuetele, enne kui see CE võib märgi kanda.
    - q: Kas annad igale paadile vastavusdeklaratsioonid?
      a: Jah. Iga RIB paat, mis tarnitakse ELi turule, sisaldab mudelispetsiifilist ELi vastavusdeklaratsiooni, mis loetleb kohaldatavad direktiivid, ühtlustatud standardid, vastavushindamise mooduli ja teavitamisele kuuluva asutuse andmed.
    - q: Millist vastavushindamise moodulit kasutab Paddle Board Overstock?
      a: Moodul sõltub disainikategooriast ja paadi tüübist. Enamik RIB mudeleid disainikategoorias C kasutab moodulit A (siseprodukti kontroll). Disainikategooria A/B paatide või konkreetsete konfiguratsioonide puhul võib kehtida moodul B+C või B+D koos teavitatud asutuse kaasamisega. Anname nõu vastava mooduli kohta igas projektis.
    - q: Kas saate enne tellimuse esitamist jagada vastavusdokumentatsiooni?
      a: Pärast kvalifitseeritud päringu esitamist jagame vastavusulatuses dokumenti, mis loetleb kehtivad standardid, vastavuse teekonna ja teie poolt hinnatava mudeli jaoks saadaval olevad dokumenditüübid. Täielikud tehnilised failid jagatakse pärast tellimuse kinnitust aadressil NDA.
    - q: Mis on kere identifitseerimisnumber (HIN) ja kas see on kaasas?
      a: HIN on 14-tähemärgiline unikaalne identifikaator, mis on püsivalt märgitud igale paadile, kodeerides tootja koodi (MIC), mudeli tähistuse, tootmisaasta ja seerianumbri. See on kohustuslik kõigile RIB paatidele, mis pannakse ELi turule, ja see on lisatud igale Paddle Board Overstock RIB.
    - q: Kui kaua hoitakse tehnilisi faile?
      a: Kooskõlas RCD 2013/53/EL nõuetega peab tootja säilitama tehnilise faili vähemalt 10 aastat alates kuupäevast, mil viimane toode turule toodi. Paddle Board Overstock hoiab kõigi toodetud mudelite täielikku tehnilist dokumentatsiooni.
    - q: Kas aitate importija kohustustega vastavalt RCD?
      a: 'Jah. Me pakume dokumentide paketti, mida EL-i importijad vajavad oma kohustuste täitmiseks: tehniline fail, vastavusdeklaratsioon (DoC), ehitaja märgis, kasutusjuhend ja toote jälgimise kirjed. Importija kohustused vastavalt RCD-le on meie vastavusjuhendis selgelt dokumenteeritud.'
