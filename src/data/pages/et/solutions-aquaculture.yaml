content_challenge:
  tagline: Väljakutse
  title: Vesiviljeluse nõudmised<br />Soolase vee vastupidav varustus
  subtitle: Kalafarmid, pärlipõllud ja ookeanifarmid tegutsevad kõige keemilisemalt agressiivsemas merekeskkonnas — pikaajaline soolase vee kokkupuude, kütuse- ja söödajäägid ning pidev igapäevane kasutus.
  paragraphs:
    - Vesiviljeluse tegevused toimuvad 365 päeva aastas avatud rannikualadel ja avamere keskkondades. Tööpaadid, mida kasutatakse puuride kontrolliks, sööda transportimiseks, pärliliini hoolduseks ja seadmete hoolduseks, seisavad silmitsi pideva soolase vee sukeldumise, UV kokkupuute ja keemilise kontaktiga kütuste, kalasööda ja saastumisvastaste vahenditega.
    - '**Korrosioon on peamine vaenlane** — Standardne meresõiduvarustus laguneb sellistes tingimustes kiiresti. Välimootorid, haagise raamid ja kere kinnitused vajavad pidevat vahetust. Operaatorid vajavad laevu, mis on ehitatud korrosioonikindlatest materjalidest, mis suudavad selles keskkonnas aastaid üle elada ilma lagunemata.'
    - '**Igapäevane töökindlus on kriitilise tähtsusega** — Katkine tööpaat tähendab söötmisgraafikute vahelejäämist, hilinenud saagi ja kulukaid tootmiskaotusi. Pärlifarmide puhul võib ühe päeva vahelejäänud kontroll tähendada märkimisväärset saagikahju. Kalafarmide puhul mõjutab hilinenud söötmine kasvukiirust ja kasumlikkust.'
    - Paddle Board Overstock RIBs Vesiviljelus on konstrueeritud korrovikindla riistvara, tugevate Hypalon torude ja tugevdatud keredega, mis on spetsiaalselt loodud nõudlikeks kalakasvatuseks, pärlikasvatuseks ja ookeanikasvatuseks.
content_solution:
  tagline: Meie lahendus
  title: Spetsiaalselt ehitatud RIBs<br />Vesiviljeluse tööstusele
  subtitle: Iga Paddle Board Overstock vesiviljeluse tööpaat on loodud taluma agressiivseid soolase vee tingimusi, pakkudes samal ajal usaldusväärset igapäevast töövõimet.
  list:
    - Hypalon Meresõidukõlblikud torud — parem UVvastupidavus soolase vee, kütuste ja kalasööda kemikaalide suhtes
    - 316 roostevabast terasest riistvara kogu ulatuses — pikaajalise soolase vee korral pole roosteta
    - Tugevdatud hõõrumisstrake'id ja kiilukaitse korduvaks doki ja puuri kokkupuuteks
    - Isepaduv terrass võimaldab lihtsat pesemist ja drenaaži pärast sööda transporti ja koristustöid
    - Lameda terrassi konfiguratsioon söödakottide, koristuskastide ja varustuse kandmiseks
    - Välimootori konfiguratsioonid vahemikus 15 HP kuni 60 HP — optimeeritud kandevõime ja kütusesäästlikkuse suhtes
    - Kõrge nähtavusega toruvärvivalikud, mis võimaldavad lihtsat märkamist suurte põllude vahel
content_segments:
  tagline: Vesiviljeluse profiilid
  title: Tööpaadilahendused<br />Vesiviljeluse tüübi järgi
  subtitle: Erinevatel vesiviljelusettevõtetel on erinevad tööpaadinõuded — alates väikesest RIBs agiilsest kalapuuri kontrolliks kuni stabiilsete transpordiplatvormideni pärlikasvatuseks ja raskeveokite tööpaatideni ookeanikarjakasvatuseks.
  items:
    - title: Kalakasvatuse tegevus
      subtitle: Puurikontroll, sööda transport, saagikoristuse toetamine
      description: Merekalafarmid kasutavad puure avatud rannikualadel ja avamere aladel. Tööpaate kasutatakse igapäevaselt puurivõrkude kontrolliks, söötmiseks, saagitoetuseks ja seadmete hoolduseks. Peamine väljakutse on korrosioon — paadid puutuvad pidevalt kokku soolase vee, kalasööda jääkide ja kütusega. Usaldusväärne tööpaat on hädavajalik, sest söötmata jäänud või hilinenud saagi saamine mõjutab otseselt tootmistoodangut ja kasumlikkust.
      features:
        - 'Agressiivse keskkonna pakett: 316 roostevabast terasest riistvarat, merendusklassi sulamist komponendid'
        - Lame terrassi paigutus söödakoti ja saagikasti transportimiseks
        - Isepaduv tekk, mis tagab lihtsa pesu pärast operatsiooni
        - Hypalon torud keemilise vastupidava kattega sööda ja kütuse kokkupuuteks
        - Tugevdatud hõõrdumisstraadid sagedasteks puuri ja kai kontaktiks
    - title: Pärlikasvatuse tegevus
      subtitle: Stabiilne transport pärliliinide kontrolliks ja koristuseks
      description: Pärlifarmid vajavad stabiilseid ja usaldusväärseid tööpaate igapäevaseks transpordiks pärliliinide vahel, austrivõrkude kontrolliks ja saagi kogumiseks. Need operatsioonid toimuvad kaugetes rannikualades, kus hooldustaristu on piiratud. Paat peab olema piisavalt stabiilne, et meeskond saaks pärliliine kontrollides sealt töötada, võimaldades hõlpsalt pardale minna ja tekil oleks piisavalt ruumi korjatud austrite, võrkude ja varustuse kandmiseks. Töökindlus ja lihtne hooldus on kaugetes farmides kriitilise tähtsusega.
      features:
        - Stabiilse kere disain seisvale meeskonnale pärliliini kontrolli ajal
        - Lame tekk libisemiskindla pinnaga turvaliseks meeskonna liikumiseks
        - Madal freeboard, et oleks lihtne austrivõrku ja saagikoristusi
        - Lihtne välismootori konfiguratsioon mugavaks kohapealseks hoolduseks
        - Korrosioonikindel toru ja riistvarapakett pidevaks soolase vee kokkupuuteks
    - title: Ookeanikasvatus ja merenduse arendamine
      subtitle: Noorukite transport, puuri hooldus, jälgimistugi
      description: Ookeanikarjakasvatus hõlmab noorte loomade vabastamist hallatud merekeskkondadesse, kasvu jälgimist ja täiustatud struktuuride hooldamist. Tööpaadid peavad transportima elusaid noorloomi õhutatud konteinerites, kandma jälgimisseadmeid ning pääsema madalatele rannikualadele vabastamiskohtadele. Kere disain peab tasakaalustama kandevõimet madala süvisega ranna ja suudme ligipääsu jaoks.
      features:
        - Tekipind õhustatud noorte transpordikonteineritele ja jälgimisseadmetele
        - Madal süvis ranna ja suudme vabastamise koha ligipääsuks
        - Lihtne randa maandumine — tugevdatud kiilu- ja vöörkaitse
        - Seadmete paigalduspunktid elektroonika ja proovivõtuseadmete jälgimiseks
        - Hypalon Vastupidavad torud vastupidavuseks segaliiva- ja mereveetingimustes
