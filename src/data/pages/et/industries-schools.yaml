hero:
  tagline: Veespordikoolid ja Treeningkeskused
  title: Varustuse lahendused<br />SUP ja Kajakikoolide jaoks
  subtitle: Usaldusväärne, tööstuslik kvaliteediga varustus aerukoolidele, surfamise õpetuseks, kajakisõidu treeninguteks ja veespordialastele haridusprogrammidele igas mastaabis.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP lauad koolidele ja treeningkeskustele
direct_answer: Aquafarer varustab SUP ja kajakikoole kogu maailmas tööstuslikule kvaliteedile vastavate laudade, ohutusvarustuse ja instruktoripakettidega. Meie varustus on loodud igapäevaseks õppetööks — paksemad PVC, tugevdatud drop-stitch tuumad ja stabiilsed kerekujundused, mis annavad algajatele kindlustunde ja instruktoritele usaldusväärsuse. Pakettidesse kuuluvad kohandatud bränding, varuosaprogrammid ja treeningmaterjalid.
solution_offerings:
  - title: Kooli algpakett
    subtitle: Uute programmide ja väikeste treeningkeskuste jaoks
    badge: Popular
    features:
      - title: Õpilaste lauad
        description: 10–25 universaallauad või vabaaja kajakid stabiilsete platvormidega algajate tundide jaoks
      - title: Instruktori lauad
        description: Laiemad, pikemad lauad suurema stabiilsusega ja libisemiskindlate EVA dekidega juhendamiseks
      - title: Ohutusvarustus
        description: Eluvestid, rihmad, vile ja viskekotid sobivates värvides
      - title: Ladustamine ja transport
        description: Virnastatavad laudade riiulid, pehmendatud kajakialused ja transpordisisud
      - title: Õppekava tugi
        description: Tundide mallid, ohutuskontrollnimekirjad ja oskuste järkjärgulise arengu juhendid
    cta_text: Alusta minu koolipaketti
    cta_href: /contact
  - title: Kooli premium-pakett
    subtitle: Väljakujunenud koolide ja mitmeprogrammiliste operaatorite jaoks
    badge: Best Value
    features:
      - title: Täisvarustus
        description: 25–50 lauda või kajakit segavaru (universaalne, tuuri- ja noorte suurused)
      - title: Instruktori varustus
        description: 3–5 spetsiaalset instruktori lauda sisseehitatud helisüsteemi kinnitusega
      - title: Ohutusseade
        description: Keskne ohutusvarustuse punkt PFD-de, raadiote, esmaabivahendite ja märkidega
      - title: Brändingupakett
        description: Täielik logo trükk laudadele, aerudele, PFD-dele ja vormidele
      - title: Hooldusprogramm
        description: Kvartali hoolduskohver, varuosade komplektid ja remonditreening
    cta_text: Koosta Premium-pakett
    cta_href: /contact
  - title: Kooli frantsiisipakett
