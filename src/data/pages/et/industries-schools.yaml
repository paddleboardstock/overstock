    badge: Enterprise
    features:
      - title: Sõidukite standardiseerimine
        description: Identsed seadmed kõikides asukohtades ühtlase õpikogemuse tagamiseks
      - title: Keskne tellimine
        description: Konsolideeritud tellimine, hulgitellimuste hinnad ja varuosade tsentraliseeritud haldus
      - title: Instruktori väljaõpe
        description: Kõikide instruktorite seadmete käsitsemise ja hoolduse sertifitseerimine
      - title: Kaubamärgi kooskasutamine
        description: Ühiskaubamärk frantsiisiga + Aquafarer kaubamärgi kooskasutamise võimalused
      - title: Laiendamise tugi
        description: Skaalumise konsultatsioon, seadmete prognoosimine ja uute asukohtade seadistamine
    cta_text: Arutle frantsiisiplaani üle
    cta_href: /contact
benefits:
  - title: Igapäevaseks õpetamiseks loodud
    description: Paksem PVC ja tugevdatud rööpad taluvad igapäevast õpilaste kasutust, kukkumisi liival ja kividel maandumisi.
    icon: tabler:shield
  - title: Stabiilsed õppimisplatvormid
    description: Laiemad põhjad ja lamedamad kõverdused annavad algajatele enesekindlust. Instruktorid keskenduvad õpetamisele, mitte seadmetele.
    icon: tabler:scale
  - title: Lihtne hoiustamine ja transport
    description: Täispuhutav disain mahub väikestesse ruumidesse. Tühjendatud lauad mahuvad tavapärase sõiduki pagasiruumi, võimaldades mobiilset õpetamist.
    icon: tabler:box-seam
  - title: Kohandatud brändimine
    description: Kooli logod ja värvid igal laual. Teie bränd, teie identiteet — mitte tavalised rendiseadmed.
    icon: tabler:brush
content_segments:
  tagline: Kooli profiilid
  title: Veespordi hariduse lahendused<br />Programmi tüübi järgi
  subtitle: Sõudekoolid, surfikoolid, ülikooliprogrammid ja frantsiisioperaatorid seisavad silmitsi erinevate tegevusväljakutsetega — alates õppekava integreerimisest kuni mitme asukoha sõidukite standardiseerimiseni. Seadmete paketid kujundatakse sobima haridusmudeliga.
  items:
    - title: Iseseisvad SUP ja kajakis koolid
      subtitle: Omaniku juhitud treeningkeskused
      description: Väikesed kuni keskmise suurusega koolid, mida juhivad omaniku-instruktorid, pakkudes SUP tunde, kajakiõpet ja sertifikaadikursusi. Seadmed peavad olema piisavalt vastupidavad igapäevaseks õpetamiseks, taskukohased väikese äri eelarve jaoks ja mitmekülgsed, et teenida algajaid kuni kesktaseme õpilasi ühesflotis.
      features:
        - Stabiilsed kõik-ühes SUP lauad ja vabaaja kajakid algaja tundide jaoks
        - Instruktori-spetsiifilised lauad lisastabiilsusega vee pealt juhendamiseks
        - Tundideplaanide mallid ja oskuste arengu juhendid kaasas
        - Aastane varustuse uuendamise programm koos vanade seadmete tagastamise soodustustega
    - title: Ülikooli ja kolledži vaba aja programmid
      subtitle: Suuremahulised tudengite vaba aja varud
      description: Ülikoolide vaba aja osakonnad, mis haldavad aeruklubisid, rendiprogramme ja õppekursuseid kui osa ülikooli vaba aja pakkumistest. Seadmed puutuvad kokku tipptasemel kasutamisega semestrite jooksul, nõuavad lihtsat laenutus-/tagastussüsteemi ning peavad taluma erinevaid oskustasemeid alates esmakordsest tudengist kuni edasijõudnud aerutajateni.
      features:
        - Kõrge vastupidavusega PVC konstruktsioon, mis on hinnatud institutsionaalse kasutuse tsüklite jaoks
        - Värvikoodiga varud oskustaseme järgi lihtsaks haldamiseks
        - RFID- või kleebispõhise inventarise jälgimissüsteemi ühilduvus
        - Hulgihinnad semestripõhise tellimise ja maksetingimustega
    - title: Surfikoolid ja surfikademiid
      subtitle: Kaldaäärsed surfikoolitusprogrammid
      description: Surfikoolid, mis õpetavad SUP surfingut, kõhuli aerutamist ja surfikajakki ookeani tingimustes. Seadmed peavad taluma surfitsooni tingimusi — löögikindlus, liiva- ja soolaveekindlus ning lihtne loputamine ja tagastamine tunnipõhiste vahetuste vahel.
      features:
        - Surfispetsiifilised kujud, tugevdatud servade ja löögikindla konstruktsiooniga
        - Pehmed uimed ja keeratud turvapaelad tudengite ohutuse tagamiseks
        - Kiirloputatav kangas, mis kuivab õppetundide vahepeal
        - Varude uuendamise programm koos hooaja lõpu kontrolli ja värskendamisega
    - title: Frantsiisid ja mitme asukohaga kettid
      subtitle: Standardiseeritud seadmed kõikides asukohtades
      description: Mitme asukohaga operaatorid, kes viivad läbi standardiseeritud koolitusprogramme mitmes linnas või piirkonnas. Varude järjepidevus asukohtade vahel on ülioluline — iga tudeng peaks saama sama varustuskogemuse, sõltumata sellest, millist frantsiisi asukohta külastab. Keskne tellimine, bränditud ühtsus ja skaleerimise tugi on hädavajalik.
      features:
        - Identsed varude spetsifikatsioonid kõigis frantsiisi asukohtades
        - Keskne koondtellimine koos hulgihinnaga
        - 'Koostööbrändimise võimalused: frantsiisi bränd + Aquafarer ko-bränd'
        - 'Uue asukoha seadistamise komplekt: varustus, sildid ja avamise inventar'
