hero:
  tagline: Protsess
  title: Tootmisprotsess
  subtitle: Toorainest kuni meresõidukõlbliku paadini — iga samm meie kontrolli all
  back_label: Tagasi tehasesse
  back_link: /factory
intro: Erinevalt brändidest, mis allhangivad tootmise kolmandate osapoolte tehastele, Paddle Board Overstock omavad ja haldavad kogu tootmisahelat. See vertikaalne integratsioon võimaldab meil igal etapil ranget kvaliteedikontrolli hoida, kiiresti reageerida eritellimustele ning pakkuda ühtlast tootekvaliteeti partii kaupa. Siin on, kuidas meie tehases paat ehitatakse.
steps:
  - step: '01'
    title: Materjalide vastuvõtt ja ülevaatus
    description: Iga saabuv PVC partii kanga-, klaasvilla-matti, vaiku ja riistvara kontrollitakse vastavalt spetsifikatsioonidele. Kangaproovid testitakse enne tootmisse laskmist tõmbetugevuse, paksuse ühtluse ja UV vastupidavuse osas. Mittekonformsed materjalid pannakse karantiini ja tagastatakse.
    duration: 1–2 päeva
  - step: '02'
    title: PVC Automaatne lõikamine
    description: Heakskiidetud kangad paigaldatakse automaatsele CNC lõikemasinale ja lõigatakse alla millimeetri täpsusega. Arvutiga optimeeritud pesandussüsteem paigutab paneelid nii, et jäätmeid minimeeritakse — tavaliselt alla 5%. Lõigatud paneelid märgistatakse paadimudeli ja kambri järgi ning seejärel komplekteeritakse keevitustöökotta üleviimiseks.
    duration: 2–4 tundi paadikomplekti kohta
  - step: '03'
    title: Toru kuumtihendamine ja keevitamine
    description: Paneelid kinnitatakse ja liimitakse kuumõhukeevitusega kuumaõhu keevitusega kontrollitud temperatuuridel 200–600 °C. Peamised õmblused tugevdatakse RF-dielektrilise keevitusega õhukindlate, kõrge tugevusega liitekohtade jaoks. Valmis kambrid täidetakse 1,25× töörõhuni 30-minutiliseks õhu kinnipidamise valideerimiseks.
    duration: 1–2 päeva paadi kohta
  - step: '04'
    title: Klaaskiust RIB kere vormimine
    description: RIB paadikere valmistatakse käsitsi paigaldatava klaaskiust vormimisega. Klaaskiust mati ja kootud rovingu kihid rullitakse käsitsi polüester- või vinüülestervaiguga täppisvormides. Iga kiht on vaakumkotiga täidetud, et tagada ühtlane laminaadi kvaliteet. Kere on viimistletud geelikastmega, mis tagab kõrge läikiva ja UVvastupidava merepinna.
    duration: 2–4 päeva kere kohta
  - step: '05'
    title: SUP Trükkimine ja kaunistamine
    description: SUP Laudplaadi graafika kasutatakse täisvärviliste fotokvaliteediga kujunduste jaoks digitaalse trükiga ning vastupidavate logode ja korduvate mustrite jaoks siiditrükiga. Trükiseid kõvendatakse ja suletakse UV kulumiskindluse tagamiseks.
    duration: 1–2 päeva
  - step: '06'
    title: Lõplik kokkupanek ja rigging
    description: Klaaskiust kered ja PVC torude komplektid on ühendatud liinil. Mootor on paigaldatud, rooli- ja gaasipedaali juhtimisseadmed on ühendatud, kütusesüsteem paigaldatud ning kogu elektriline juhtmestik on ühendatud. Iga paat järgib 100-punktilist kokkupaneku kontrollnimekirja, kus igal etapil on kohustuslik kinnitamine.
    duration: 2–3 päeva
  - step: '07'
    title: Kvaliteeditestimine ja kontroll
    description: 'Iga valmis paat läbib kohustusliku kvaliteedikontrolli: kambri õhu kinnipidamise testi, süsteemide funktsiooni kontrolli, kinnituse pöördemomendi kontrolli ja kosmeetilise kontrolli. Eritellimusel ja prototüübina ehitatud laevad läbivad ka vee sees toimuvad merekatsed, mis hõlmavad kiirust, juhitavust, stabiilsust ja vastupidavust.'
    duration: 1–2 päeva
  - step: '08'
    title: Pakendamine ja saatmine
    description: Paadid tühjendatakse, volditakse protseduuri järgi, pakitakse raskeveokite kootud kottidesse või vineerikastidesse ja laaditakse saatmiseks. Iga pakk on märgistatud mudeli, seerianumbri ja sihtkohaga. Koordineerime FCL ja LCL konteinerisaadetisi üle kogu maailma kaubaveoettevõtetega.
    duration: 1 päev
