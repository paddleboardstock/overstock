timeline:
  - year: '2012'
    title: Meretööstuse Sihtasutus
    body: Aquafarer alustas spetsialiseerunud täispuhutavate veesõidukite töökojana Qingdaos, Hiinas, pühendudes merekäsitööle ja täispuhutavate paatide tootmisele. Varajane fookus oli usaldusväärsete täispuhutavate toodete ehitamisel praktilise insenerikogemuse ja tootmisdistsipliini kaudu.
  - year: '2015'
    title: Esimene eksport ja CE sertifitseerimine
    body: Esialgsed eksporditellimused jõudsid Jaapanisse ja Koreasse.CE Saavutati sertifitseerimine põhitootesarjadele, mis Aquafarertähistas sisenemist rahvusvahelistele turgudele. Ettevõte hakkas teenindama ärilisi ja vaba aja kasutajaid väljaspool Hiinat.
  - year: '2018'
    title: Tehase laiendamine
    body: Koliti 12 000 m² suurusesse tootmistehasesse. Lisati RF-keevitusliinid ja drop-stitch tootmisvõimsus, mis võimaldas suuremahulist tootmist ja parandati kvaliteedikontrollisüsteeme.
  - year: '2020'
    title: Asutatud teadus- ja arenduskeskus
    body: Avati spetsiaalne teadus- ja arenduskeskus koos PVC kangalabori, hüdrodünaamilise testipaagi ja CAD/FEA simulatsioonistuudioga. Tootearendus laienes, keskendudes kergele konstruktsioonile, paremale vastupidavusele ja kasutajakesksele disainile.
  - year: '2022'
    title: Sertifitseerimine ja globaalne kasv
    body: Saavutati ISO 9001 sertifikaat. Laiendati 14 teadus- ja arendusinsenerini ning 200+ töötajani. Tooted jõudsid klientideni üle Euroopa, Ameerika ja Aasia-Vaikse ookeani piirkonnas läbi edasimüüjate ja OEM partnerluste.
  - year: '2024'
    title: Innovatsiooni ja Disainistuudio
    body: Käivitas täisteenust pakkuva disaini- ja innovatsioonistuudio ODM eritellimusel projektide jaoks alates kontseptsioonist kuni tootmiseni. Tugevdas professionaalseid merendusrakendusi, sealhulgas pääste-, kommerts- ja valitsushankeid.
  - year: '2026'
    title: Vee uurimise tuleviku ülesehitamine
    body: Täna Aquafarer arendatakse jätkuvalt täispuhutavaid paatide, SUP süsteemide ja kohandatud merelahendusi — ühendades inimesi ja organisatsioone maailma vetega. 50+ riiki teenindas, 15 000 ühikut aastas.
content_founding:
  tagline: Algus
  title: Sündinud veepiiril
  subtitle: 'Aquafarer alustas Qingdao rannikutöökojas ühe paadiga ja visiooniga: ehitada täispuhutavaid veesõidukeid, mis suudaksid toime tulla päris mereoludega.'
  paragraphs:
    - 2012. aastal nägid meie asutajad turul tühimikku — enamik täispuhutavaid paate olid kas taskukohased, kuid ebausaldusväärsed, või kvaliteetsed, kuid liiga kallid. Nad uskusid, et on ruumi tootjale, kes pakub nii kvaliteeti kui ka väärtust.
    - Esimene kere ehitati käsitsi, testiti kohalikes vetes ja viimistleti kalurite ja väikeste äriettevõtete tegeliku tagasiside põhjal. See tagasiside ahel — ehita, testi, kuula, parandamine — on tänaseni meie insenerifilosoofia tuum.
    - 2015. aastaks oli sõna levinud kaugemale Qingdaost. Rahvusvahelised levitajad hakkasid proove küsima. See, mis algas kohaliku töökojana, muutus ülemaailmseks tarnijaks.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Varajane tootmistöökoda ja tootmine
content_growth:
  tagline: Kasv ja innovatsioon
  title: Töökojast kuni 12 000 m² suuruse rajatiseni
  subtitle: Pidevad investeeringud inimestesse, seadmetesse ja protsessidesse on Aquafarer muutunud kaasaegseks meretootmise rajatiseks.
  paragraphs:
    - Nõudluse kasvades kasvas ka meie rajatis. Laienesime väikesest töökojast 12 000 m² suuruseks tehaseks, millel olid spetsiaalsed tootmisliinid RIB paatidele, täispuhutavatele paatidele, SUP laudadele ja tarvikutele.
    - Investeerisime CNC lõikemasinatesse, kõrgsageduslikku keevitusseadmesse, droppiste tootmisliinidesse ja põhjalikesse testimisseadmetesse — mis võimaldas meil kontrollida tootmiskvaliteedi kõiki aspekte.
    - Täna koosneb meie 200–300-liikmeline meeskond mereinsenere, materjaliteadlastest, kvaliteedikontrolli spetsialistidest ja osavatest käsitöölistest — kellest paljud on töötanud Aquafarer juba algusaegadest.
founder:
  tagline: Tutvu asutajaga
  title: Ehitatud veemehe poolt
  subtitle: Asutaja David Chen ühendab tootmisalased teadmised ja eluaegse kirglikkuse veespordi vastu — kombinatsioon, mis määratleb, kuidas Aquafarer tootearendusele läheneda.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Asutaja Aquafarer
  story:
    - David Chen kasvas üles Qingdao rannikul, kus meri polnud puhkusekoht, vaid elustiil. Ta veetis oma nooruse kajakisõitu, purjetades ja kalastades Kollases meres — kogemused, mis andsid talle intuitiivse arusaama sellest, mida veesõidukid peavad taluma.
    - Enne asutamist Aquafarertöötas David kümme aastat meretööstuses, töötades tootmise, kvaliteedi ja rahvusvahelise kaubanduse valdkonnas. Ta OEM juhtis programme Euroopa ja Põhja-Ameerika brändidele, õppides esmakäeliselt globaalsete turgude standardeid ja ootusi.
    - '2012. aastal asutas ta Aquafarer lihtsa eesmärgiga: ehitada täispuhutavad veesõidukid, mida usaldaks koos oma perega vees. See isiklik standard — kas ma kasutaksin seda? — jääb iga tehasest väljuva toote lõplikuks testiks.'
    - Täna juhib David tootestrateegiat ja juhib teadus- ja arendusmeeskonda, vaadates isiklikult üle uusi disaine ja testides prototüüpe Qingdao vetes. Ta usub, et suurepärased tooted tulevad nii inseneritöö kui ka kogemuse mõistmisest.
philosophy:
  tagline: Brändifilosoofia
  title: Insenerivabadus vee peal
  body: Vabadus vees ei seisne ainult liikumises. See tähendab uute paikade avastamist, looduskogemuste loomist, inimeste ühendamist loodusega ja professionaalsete missioonide võimaldamist. Inseneriteadus teeb selle vabaduse võimalikuks.
  pillars:
    - title: Esmalt töökindlus
      body: Veekeskkonnad nõuavad usaldust.Aquafarer Tooted on loodud stabiilsuse, vastupidavuse, ohutuse ja ühtlase jõudluse ümber.
    - title: Inimkeskne disain
      body: Tooted peaksid teenima inimesi, mitte tehnoloogiat. Iga disainiotsus algab arusaamisest, kuidas inimesed veesõidukeid kasutavad, kus nad uurivad ja milliste väljakutsetega nad silmitsi seisavad.
    - title: Ligipääsetav avastus
      body: Vesi ei tohiks kuuluda ainult ekspertidele.Aquafarer Loob seadmeid, mis võimaldavad rohkematel inimestel ohutult kogeda jõgesid, järvi, ookeane ja rannikualasid.
    - title: Pidev innovatsioon
      body: Innovatsioon ei tähenda ainult uute toodete loomist. See parandab iga detaili — materjale, struktuure, tootmist ja kasutajakogemust.
engineeringDna:
  tagline: Inseneride DNA
  title: Kuidas Aquafarer loob tooteid
  areas:
    - title: Materjaliteadus
      body: Aquafarer keskendub sobivate materjalide valimisele erinevateks merkeskkondadeks. Peamised kaalutlused hõlmavad kulumiskindlust, UV vastupidavust, survestabiilsust ja pikaajalist vastupidavust.
      items:
        - Kulumiskindlus
        - UV-vastupidavus
        - Survestabiilsus
        - Pikaajaline vastupidavus
    - title: Struktuuriettevõtlus
      body: Täispuhutavad veesõidukid vajavad täpset tasakaalu jäikuse, kaalu, kaasaskantavuse ja stabiilsuse vahel. Aquafarer inseneeria keskendub nende tegurite optimeerimisele läbi drop-stitch südamiku tehnoloogia ja täiustatud õmblustehnoloogia.
      items:
        - Jäikus
        - Kaalu optimeerimine
        - Kaasaskantavus
        - Stabiilsus
    - title: Tootmise täpsus
      body: 'Iga toode läbib kontrollitud protsesse: materjali ettevalmistus, täppislõikus, keevitamine ja liimimine, kokkupanek, kvaliteedikontroll ja jõudluse kinnitamine.'
      items:
        - Materjali ettevalmistus
        - Täppislõikus
        - Keevitamine ja liimimine
        - Kokkupanek ja kvaliteedikontroll
    - title: Kasutaja stsenaariumide inseneeria
      body: Tooteid arendatakse tõeliste rakenduste jaoks — puhkus, seiklus ja professionaalne kasutus — tagades, et iga disain vastab oma keskkonna konkreetsetele nõudmistele.
      items:
        - Puhkus
        - Seiklus
        - Professional
        - Kaubanduslik
trustSignals:
  tagline: Usaldussignaalid
  title: Miks Aquafarer on usaldusväärne partner
  manufacturing:
    title: Tootmisvõimekus
    body: 12 000 m² suurune tootmisüksus 200–300 kvalifitseeritud töötaja ja 14+ teadus- ja arendustöötajaga. ISO 9001 sertifitseeritud kvaliteedijuhtimissüsteem. Aastane toodang on 15 000 täispuhutatavat veesõidukit, mis teenindavad 50+ riiki.
    stats:
      - label: Tööstuse suurus
        value: 12,000 m²
      - label: Tööjõud
        value: 200-300
      - label: Teadus- ja arendusinsenerid
        value: 14+
      - label: Aastane mahutavus
        value: 15,000
  quality:
    title: Kvaliteedile pühendumine
    body: Alates materjali kontrollist kuni lõpliku testimiseni järgib Aquafarer süstemaatilisi kvaliteediprotsesse, et tarnida usaldusväärseid meretooteid. Iga ühikut testitakse surveproovi, õmbluste kontrolli ja jõudluse kinnitamisega enne saatmist.
    items:
      - CE Sertifitseeritud — 64 mudelit vastab Euroopa ohutusstandarditele
      - ISO 9001:2015 — Kvaliteedijuhtimissüsteem sertifitseeritud
      - UKCA Märgistatud — Ühendkuningriigi turu nõuetele vastav
  global:
    title: Globaalne kohalolek
    body: Aquafarer teenindab kliente paljudes ülemaailmsetes turgudes, toetades jaemüüjaid, välistingimuste kaubamärke ja professionaalseid merenduskasutajaid 50+ riigis Euroopas, Aasias ja Vaikse ookeani piirkonnas, Ameerikates, Lähis-Idas ja Aafrikas.
comparison:
  tagline: Brändi positsioneerimine
  title: Aquafarer turul
  position: Insenerikeskne meresõidukite tootja, mis ühendab kokkupandavate veesõidukite ekspertiisi täieliku OEM/ODM võimekuse, kohandatud lahenduste ja põhjaliku tootmiskogemusega.
  strengths:
    - Täispuhutavate veesõidukite inseneritehniline ekspertteadmised
    - Täielik OEM/ODM tootmisvõimekus
    - Kohandatud toodete arendamine ja disain
    - 12 000 m² ISO 9001 sertifitseeritud tootmistehas
  bestFor:
    - Välitegevuse harrastajad, kes otsivad usaldusväärseid täispuhutavaid veesõidukeid
    - Merenduse operaatorid, kes vajavad äriklassi varustust
    - Brändipartnerid, kes vajavad OEM/ODM tootmist
    - Professionaalsed pääste- ja patrulliorganisatsioonid
