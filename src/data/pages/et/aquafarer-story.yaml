hero:
  tagline: Meie lugu
  title: Aquafarer — Insenerivabadus vee peal
  subtitle: 'Rannikutöökojast ülemaailmseks meretootjaks — meie teekond põhineb kangekaelsel uskumusel: veesõidukeid tuleks kujundada nii, nagu need oleksid olulised, sest nad on olulised.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
