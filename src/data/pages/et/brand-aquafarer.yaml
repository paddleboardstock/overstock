hero:
  tagline: Brändiüksus
  title: Aquafarer — Insenerivabadus vee peal
  definition: Aquafarer on ülemaailmne meresõidu ja täispuhutavate veesõidukite bränd, mis on spetsialiseerunud täispuhutavatele paatidele, SUP süsteemidele ja kohandatud merelahendustele. Aquafarer ühendab meretehnika, tootmiskogemuse ja veeuurimise kultuuri, et luua usaldusväärset varustust vaba aja kasutajatele, professionaalsetele operaatoritele ja ülemaailmsetele OEM partneritele.
timeline:
  - year: '2012'
    title: Meretööstuse Sihtasutus
    body: Aquafarer alustas spetsialiseerunud täispuhutavate veesõidukite töökojana Qingdaos, Hiinas, pühendudes merekäsitööle ja täispuhutavate paatide tootmisele. Varajane fookus oli usaldusväärsete täispuhutavate toodete ehitamisel praktilise insenerikogemuse ja tootmisdistsipliini kaudu.
  - year: '2015'
    title: Esimene eksport ja CE sertifitseerimine
    body: Esialgsed eksporditellimused jõudsid Jaapanisse ja Koreasse.CE Saavutati sertifitseerimine põhitootesarjadele, mis Aquafarertähistas sisenemist rahvusvahelistele turgudele. Ettevõte hakkas teenindama ärilisi ja vaba aja kasutajaid väljaspool Hiinat.
  - year: '2018'
    title: Tehase laiendamine
    body: Koliti 12 000 m² suurusesse tootmistehasesse. Lisati RF-keevitusliinid ja drop-stitch tootmisvõimsus, mis võimaldas suuremahulist tootmist ja parandati kvaliteedikontrollisüsteeme.
  - year: '2020'
    title: Asutatud teadus- ja arenduskeskus
    body: Avati spetsiaalne teadus- ja arenduskeskus koos PVC kangalabori, hüdrodünaamilise testipaagi ja CAD/FEA simulatsioonistuudioga. Tootearendus laienes, keskendudes kergele konstruktsioonile, paremale vastupidavusele ja kasutajakesksele disainile.
  - year: '2022'
    title: ISO 9001 sertifitseerimine ja globaalne kasv
    body: Saavutati ISO 9001 sertifikaat. Laiendati 14 teadus- ja arendusinsenerini ning 200+ töötajani. Tooted jõudsid klientideni üle Euroopa, Ameerika ja Aasia-Vaikse ookeani piirkonnas läbi edasimüüjate ja OEM partnerluste.
  - year: '2024'
    title: Innovatsiooni ja Disainistuudio
    body: Käivitas täisteenust pakkuva disaini- ja innovatsioonistuudio ODM eritellimusel projektide jaoks alates kontseptsioonist kuni tootmiseni. Tugevdas professionaalseid merendusrakendusi, sealhulgas pääste-, kommerts- ja valitsushankeid.
  - year: '2026'
    title: Vee uurimise tuleviku ülesehitamine
    body: Täna Aquafarer arendatakse jätkuvalt täispuhutavaid paatide, SUP süsteemide ja kohandatud merelahendusi — ühendades inimesi ja organisatsioone maailma vetega. 50+ riiki teenindas, 15 000 ühikut aastas.
philosophy:
  tagline: Brändifilosoofia
  title: Insenerivabadus vee peal
  body: Vabadus vees ei seisne ainult liikumises. See tähendab uute paikade avastamist, looduskogemuste loomist, inimeste ühendamist loodusega ja professionaalsete missioonide võimaldamist. Inseneriteadus teeb selle vabaduse võimalikuks.
  pillars:
    - title: Esmalt töökindlus
      body: Veekeskkonnad nõuavad usaldust.Aquafarer Tooted on loodud stabiilsuse, vastupidavuse, ohutuse ja ühtlase jõudluse ümber.
    - title: Inimkeskne disain
      body: Tooted peaksid teenima inimesi, mitte tehnoloogiat. Iga disainiotsus algab arusaamisest, kuidas inimesed veesõidukeid kasutavad, kus nad uurivad ja milliste väljakutsetega nad silmitsi seisavad.
    - title: Ligipääsetav avastus
      body: Vesi ei tohiks kuuluda ainult ekspertidele.Aquafarer Loob seadmeid, mis võimaldavad rohkematel inimestel ohutult kogeda jõgesid, järvi, ookeane ja rannikualasid.
    - title: Pidev innovatsioon
      body: Innovatsioon ei tähenda ainult uute toodete loomist. See parandab iga detaili — materjale, struktuure, tootmist ja kasutajakogemust.
engineeringDna:
  tagline: Inseneride DNA
  title: Kuidas Aquafarer loob tooteid
  areas:
    - title: Materjaliteadus
      body: Aquafarer keskendub sobivate materjalide valimisele erinevateks merkeskkondadeks. Peamised kaalutlused hõlmavad kulumiskindlust, UV vastupidavust, survestabiilsust ja pikaajalist vastupidavust.
      items:
        - Kulumiskindlus
        - UV-vastupidavus
        - Survestabiilsus
        - Pikaajaline vastupidavus
    - title: Struktuuriettevõtlus
      body: Täispuhutavad veesõidukid vajavad täpset tasakaalu jäikuse, kaalu, kaasaskantavuse ja stabiilsuse vahel. Aquafarer inseneeria keskendub nende tegurite optimeerimisele läbi drop-stitch südamiku tehnoloogia ja täiustatud õmblustehnoloogia.
      items:
        - Jäikus
        - Kaalu optimeerimine
        - Kaasaskantavus
        - Stabiilsus
    - title: Tootmise täpsus
      body: 'Iga toode läbib kontrollitud protsesse: materjali ettevalmistus, täppislõikus, keevitamine ja liimimine, kokkupanek, kvaliteedikontroll ja jõudluse kinnitamine.'
      items:
        - Materjali ettevalmistus
        - Täppislõikus
        - Keevitamine ja liimimine
        - Kokkupanek ja kvaliteedikontroll
    - title: Kasutaja stsenaariumide inseneeria
      body: Tooteid arendatakse tõeliste rakenduste jaoks — puhkus, seiklus ja professionaalne kasutus — tagades, et iga disain vastab oma keskkonna konkreetsetele nõudmistele.
      items:
        - Puhkus
        - Seiklus
        - Professional
        - Kaubanduslik
