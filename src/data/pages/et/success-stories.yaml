stories:
  - title: Kuidas Vahemere Kuurort Lõi Kasumliku SUP Renditegevuse
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-tärni rannakuurort — Kreeka
    problem: Kuurort vajas premium-klassi külalisveetegevusi, et tõsta rahulolu hinnanguid ja luua uus tuluvoog, kuid neil puudusid varustus, ohutussüsteem ja töötajate oskusteave.
    solution: Paddle Board Overstock tarnis 50 kohandatud bränditud SUP lauad kuurordi värvide ja logoga, täieliku ohutussüsteemi, sealhulgas päästjate ja buoide jooned, ning 3-päevase töötajate koolitusprogrammi, mis hõlmas varustuse käsitlemist, külaliste juhendamist ja ohutusprotokolle.
    result:
      - 300+ nädalaseid külalistetegevusi broneeritud esimesel kuul
      - 'Külaliste rahulolu veetegevuste osas: 4,8/5'
      - 'Uus aastane täiendav tulu: $180K'
      - Esimesel hooajal ei olnud ühtegi ohutusalast intsidenti
      - Varustuse asenduskulu vähenes 40% võrreldes eelmise tarnijaga
    quote:
      text: Paddle Board Overstock ei tarninud ainult laudu — nad aitasid meil luua tervikliku külaliskogemuse. Meie veespordiprogramm läks nullist kuurordi esiletõstuks ühe hooaja jooksul.
      author: Kuurordi Peakorraldaja
    cta_text: Loo oma kuurordi lahendus
    cta_href: /solutions/resorts
  - title: Kuidas Austraalia idufirma lõi 90 päevaga veebrändi
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Esmakordne ettevõtja — Austraalia
    problem: Välisaktiivne entusiast soovis käivitada oma SUP brändi Austraalia turule, kuid tal puudus tootmiskogemus, tarnijate suhted ja piiratud kapital.
    solution: Paddle Board Overstock Brändi Käivitamise Paketis pakuti tooteselektsiooni konsultatsiooni, kohandatud logo ja värvi disaini, bränditud jaemüügipakendit sildiga, CE sertifitseerimise dokumentatsiooni ning FOB saatmist Sydneysse.
    result:
      - Esimene saadetis 200 lauaga tarniti 75 päeva jooksul alates esimesest kontaktist
      - Bränd käivitati Shopify + Amazon AU platvormil kahe nädala jooksul pärast saabumist
      - Esialgne inventar müüdi välja 45 päevaga
      - 'Keskmine marginaal: 55% jaehinnast'
      - 'Teine tellimus: 500 ühikut tellitud 60 päeva jooksul pärast käivitamist'
    quote:
      text: Mul oli brändi idee, kuid null tootmisteadmisi. Paddle Board Overstock hoidis mind sõna otseses mõttes kogu protsessi jooksul käest kinni — alates õige laua valimisest kuni esimese saadetise lahtipakkimiseni. 90 päeva unistusest kätte toimetamiseni.
      author: Asutaja, Austraalia SUP bränd
    cta_text: Käivita oma bränd
    cta_href: /solutions/entrepreneurs
  - title: Kuidas Tai rannaklubi kasvatas 10 lauast 80-ni
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Veespordiklubi — Tai
    problem: Väike SUP rannaklubi Phuketis pidi kasvama hobitegevusest professionaalseks rendiettevõtteks, mis teenindab turiste, kuid ei leidnud usaldusväärset varustuse tarnijat, kellel oleks stabiilne kvaliteet ja hinnad.
    solution: Alustades Paddle Board OverstockClub Starter Package'ist (10 lauda, aeru, ohutusvarustus, bränding) kasvas klubi Premium Package programmi kaudu 18 kuu jooksul.
    result:
      - Skaleeritud 10-lt 80-le plaadile 18 kuuga, kvaliteet ja hinnad on stabiilsed
      - Lisatud kajaki- ja pedaalpaadi rent, kasutades sama tarnijat
      - Eritellimusel klubi bränding suurendas turistide seas brändi tuntust
      - Hoolduskulud vähenesid 60% võrreldes varasema eelarveseadmega
      - Nüüd teenindab+ tipphooajal 150 päevast renti
    quote:
      text: Club Starter Package oli ideaalne sissejuhatus. Kui meie ettevõte kasvas, Paddle Board Overstock kasvas koos meiega — sama kvaliteet, sama hind, üllatusi pole.
      author: Klubi omanik, Phuket
    cta_text: Alusta oma klubipaketti
    cta_href: /solutions/clubs
  - title: Kuidas Kariibi kuurortkett standardiseeris veespordialad viies kinnistul
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Kuurortkett — Kariibi mere
    problem: Luksuskuurordikett viie kinnistuga vajas järjepidevat veespordivarustuse kvaliteeti ja brändingut kõigis asukohtades, tsentraliseeritud hangete ja hooajalise asendusplaaniga.
    solution: Paddle Board Overstock tarniti mitme kinnistuga pargi 300 SUPs ja 100 kajakki, millel oli ühtne bränding, jagatud varuosade laoseisu ja aastane vahetusgraafik koos mahuhindadega.
    result:
      - Standardiseeritud külaliskogemus kõigis viies kinnisvaras
      - 30% kulude vähenemine konsolideeritud ostude ja mahu hinnastamise kaudu
      - Tsentraliseeritud varuosade varu vähendas seisakuid 80% võrra
      - Iga-aastane varustuse uuendamise programm kõrvaldas hooaja lõpu segaduse
      - Külaliste veespordialade osavõtt kasvas aastaga 45%
    cta_text: Kujunda oma kuurordiprogramm
    cta_href: /solutions/resorts
