rd_services:
  tagline: Kohandatud teadusuuringud ja arendus
  title: Teadusuuringute ja arenduse teenused partneritele
  services:
    - title: Kohandatud materjali arendamine
      desc: Arendame kohandatud kangasegusid, lamineeritud konstruktsioone ja liimühendusüsteeme, mis on kohandatud teie töökeskkonna ja jõudlusnõuetega.
    - title: OEM / ODM tootearendus
      desc: Kontseptsioonijoonistustest tootmisvalmis inseneripakettideni — meie meeskond saab teie brändi all paate projekteerida, prototüüpida ja valideerida.
    - title: Kolmanda osapoole testimine ja sertifitseerimine
      desc: Kasutage meie ISO-vastavaid katse- ja testimisvõimalusi iseseisvaks materjalide testimiseks, toote valideerimiseks ja sertifitseerimistugeks.
  cta: Arutage meiega oma teadusuuringute ja arenduse nõudeid →
  cta_link: /contact
vision:
  tagline: Meie visioon
  title: Veespordi tuleviku kujundamine
  body: Paddle Board Overstock püüab juhtida täispuhutava paati ja SUP tööstust pideva innovatsiooni, vankumatu kvaliteedi ning vankumatu pühendumuse kaudu ohutusele ja jätkusuutlikkusele — rikastades lõpuks veespordihuviliste kogemusi üle maailma. Paddle Board Overstock Teadus- ja arenduskeskus on koht, kus kirg kohtub innovatsiooniga, seades veesporditööstusele uued standardid.
labs_section:
  tagline: Laborid
  title: Meie laborid
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC Kangalabor
      description: Pidev uurimistöö ja PVC Hypalon testimine torukangaste tõmbetugevuse, UV takistuse, abrasiooni ja madala temperatuuri paindlikkuse osas, et tagada pikaajaline töökindlus merekeskkonnas.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Hulli Inseneristuudio
      description: CAD-põhine disain ja lõplike elementide analüüs HDPE, alumiiniumi ja klaaskiust kerede puhul. Iga kere simuleeritakse digitaalselt pingete jaotuse ja löögikindluse tagamiseks enne esimese prototüübi ehitamist.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF-keevituskeskus
      description: Pühendatud raadiosageduskeevitusrajatis täpse temperatuuri ja rõhu kontrolliga, mis toodab kõrge tugevusega, õhukindlaid õmblusi, mis vastavad täispuhutavate laevade meretööstuse standarditele.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Hüdrodünaamiline katsepaak
      description: Mõõtkavamudeli testimine meie sisemises testpaagis, et optimeerida kere kuju, planeerimisvõimet, stabiilsust ja kütusesäästlikkust erinevates koormus- ja mereoludes.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototüübi töökoda
      description: Täismahus prototüüpimise ja purgistamise rajatis, kus ehitatakse, paigaldatakse ja meresõidul katsetatakse. Iga prototüüp läbib vähemalt 20-tunnise veesisese testimise enne tootmise heakskiitu.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Kvaliteedi- ja inspekteerimislabor
      description: Pühendatud kvaliteedikontrolli labor, mis viib läbi tõmbetesti, õhu hoidmise tsükli, õmbluse koorimise teste ja materjalide sertifitseerimist, et tagada iga töökojast lahkuv paat meie avaldatud spetsifikatsioonidele.
      href: /randdcenter/quality-inspection-lab
