hero:
  tagline: Teadus- ja arenduskeskus
  title: Teadus- ja arenduskeskus
  subtitle: Fookuses edusammudele
intro:
  - Paddle Board OverstockUurimis- ja arenduskeskus (R&D) on meie missiooni peamine jõud veespordivarustuse revolutsiooniliseks muutmiseks. Me anname veespordihuvilistele üle maailma võimaluse ohutumate, mugavamate ja nauditavamate toodetega läbi väsimatu innovatsiooni täispuhutavate aerulauade SUPs() ja paatide vallas. Meie pühendunud inseneride, disainerite ja kirglike veespordiekspertide meeskond kujundab tööstuse tulevikku, tõstes järjepidevalt kvaliteedi, jõudluse ja jätkusuutlikkuse latti.
  - Meie teadus- ja arenduskeskus toob kokku materjaliteadlased, laevaehituse arhitektid ja tootmisinsenerid ühe katuse alla. Alates kangaste koostamisest ja kere simulatsioonist kuni keevitusprotsesside arendamise ja täismahus merekatsetusteni – iga tootearenduse etapp põhineb andmetel ja valideeritakse testimisega.
mission:
  tagline: Meie missioon
  title: Veespordi tuleviku uuendamine
  pillars:
    - icon: lightning
      title: Tehnoloogiline areng
      desc: Uute materjalide, disainide ja tootmise pioneer, et saavutada parem tootejõudlus ja vastupidavus.
    - icon: design
      title: Kasutajakeskne disain
      desc: Kasutajate vajaduste sügav mõistmine ja ületamine ergonoomilise ja intuitiivse tootedisaini kaudu.
    - icon: globe
      title: Jätkusuutlikud praktikad
      desc: Keskkonnajalajälje minimeerimine, kasutades keskkonnasõbralikke materjale ja protsesse.
    - icon: shield
      title: Kompromissitu ohutus
      desc: Kõrgeimate ohutusstandardite tagamine rangete testide ja sertifitseerimisega.
pillars:
  - title: Tehnoloogiline areng
    desc: Uute materjalide, disainide ja tootmisprotsesside pioneer, et tagada parem tootejõudlus ja pikaealisus.
    icon: tech
  - title: Täiustatud materjalid
    desc: Uurides PVCtipptasemel , Hypalon, komposiit- ja jätkusuutlikke alternatiive tooteomaduste parandamiseks.
    icon: materials
  - title: Jätkusuutlikkus
    desc: 'Põhikohustus: Oleme pühendunud keskkonnahoidmisele jätkusuutliku tootmise ja taaskasutatavate materjalide kaudu.'
    icon: sustainability
capabilities:
  tagline: Võimalused
  title: Teadus- ja arendusvõimekused
  subtitle: Neli põhivaldkonda, mis annavad meile täieliku kontrolli tootearenduse üle — alates tooraineuuringutest kuni lõpliku sertifitseerimiseni.
  groups:
    - title: Materjaliteadus ja Kangastehnoloogia
      items:
        - PVC ning Hypalon formuleerimise analüüs ja optimeerimine
        - UV stabiliseerimine, leegikindlus ja antimikroobsete lisandite arendamine
        - Mitmekihiline kangaste lamineerimine ja adhesioonitehnika
        - Kiirendatud vananemistestimine (UVtermiline, niiskus, soolapritsi)
    - title: Kere inseneriteadus ja hüdrodünaamika
      items:
        - Parameetriline 3D kere disain ja CFD optimeerimine
        - Lõpp-elementide analüüs struktuuri- ja löögikoormuste jaoks
        - Skaalamudeli tõukekatsetamise ja jõudluse valideerimine
        - Kohandatud kere arendamine erimissioonide profiilide jaoks
    - title: Keevitus- ja liitmis-tehnoloogia
      items:
        - RF-dielektrilise keevitusprotsessi arendamine ja optimeerimine
        - Kuuma õhu, kuuma vahele ja ultraheli keevitusmeetodid
        - Liimühenduse ja õmbluse teibi kvalifikatsioon
        - Keevituse tugevuse modelleerimine ja eluea prognoosimine
    - title: Katsetamine, sertifitseerimine ja nõuetele vastavus
      items:
        - Kvaliteedijuhtimine ja CE vastavuse katsetamine
        - Iseseisev kolmanda osapoole testimine ja sertifitseerimise tugi
        - Kohandatud testiprotokollide väljatöötamine hangete kvalifikatsiooni jaoks
        - Kasutuses esinenud rikete analüüs ja juurpõhjuste uurimine
