features3_reasons:
  tagline: Miks valida Aquafarer
  title: Seitse põhjust, miks meiega koostööd teha
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Päris tootmine, mitte kauplemine
      description: Me omame ja haldame 12 000 m² suurust tehast. Kui teete koostööd Aquafarer, töötate otse inimestega, kes teie tooteid projekteerivad, inseneerivad ja ehitavad — ilma vahendajateta.
      icon: tabler:building-factory
    - title: 2. Inseneripõhine lähenemine
      description: Meie disainiprotsess algab kasutusjuhtumist, mitte tootekategooriast. Optimeerime kere kuju, materjalide valiku ja konfiguratsiooni vastavalt sellele, kuidas paati tegelikult kasutatakse.
      icon: tabler:engine
    - title: 3. Sertifitseeritud kvaliteet
      description: CE Sertifitseeritud, ISO kvaliteedisüsteem, BSCI nõuetele vastav, nõuetele REACH vastav, USCG heaks kiidetud. Meie CE64-sertifitseeritud mudelid vastavad rahvusvahelistele standarditele — mitte ainult nõuetele.
      icon: tabler:certificate
    - title: 4. Paindlik OEM/ODM
      description: Toruvärvid, konsooli paigutus, bränding, pakend — me kohandame vastavalt teie nõudmistele. Ei mingit minimaalset tellimuse survet. Alusta prototüübist, skaleeri kindlalt.
      icon: tabler:adjustments
    - title: 5. Globaalne logistika
      description: USA ladu Californias, otsesaatmine Qingdaost, õhutransport kiirete tellimuste jaoks. Me tegeleme tollipaberite ja dokumentatsiooniga.
      icon: tabler:truck-delivery
    - title: 6. Eluaegne toetus
      description: Toetame paate, mille ehitasime 20 aastat tagasi. Ehtsad varuosad, tehniline nõuanne, remondijuhendamine — meie meeskond on alati olemas, kui meid vajate.
      icon: tabler:lifebuoy
    - title: 7. Ausad spetsifikatsioonid
      description: Tegelikud koormushinnangud, tõelised mõõtmed, tõeline kaal. Ei mingit turundusinflatsiooni. Meie avaldame seda, mida saate — sõltumatute testidega kinnitatud.
      icon: tabler:ruler-measure
testimonials:
  tagline: Brändide usaldusväärne üle maailma
  title: Mida meie partnerid ütlevad
  items:
    - content: Oleme teinud koostööd mitme Hiina tootjaga, kuid Aquafarer paistame silma oma inseneritoe ja järjepideva kvaliteediga. Nad kohtlevad meie brändi nagu oma brändi.
      name: — OEM Partner, Euroopa veespordi bränd
    - content: Nende Hypalon RIBs on olnud meie laevastikus rohkem kui 5 aastat. Minimaalne hooldus, suurepärane UV vastupidavus. Torude 5-aastane garantii annab meile kindluse.
      name: — Laevastiku operaator, Lähis-Ida puhkekeskuste grupp
    - content: Aquafarer meeskond aitas meil arendada kohandatud SUP plaadi disaini kontseptsioonist tootmiseni 90 päevaga. Kvaliteet ületas meie ootusi.
      name: — Hulgimüüja, Austraalia veespordi ettevõte
cta:
  title: Valmis kogema erinevust?
  subtitle: Võtke meie meeskonnaga ühendust, et arutada oma projekti. Kohustust ei ole — ainult ausad nõuanded tootmise kohta.
  actions:
    - variant: primary
      text: Rääkige meie meeskonnaga
      href: /contact
    - text: Laadige alla toodete kataloog
      href: /resources
