tests:
  - title: Pressure Testing
    standard: ISO 6185-1 | Internal Spec AF-PT-001
    description: Inflatable chambers are pressurized to 1.25x the recommended operating limit and held for 30 minutes. Pressure decay is measured to validate airtightness and structural integrity of materials and seams.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Impact Testing
    standard: Internal Spec AF-IT-002
    description: Products are subjected to controlled impacts from standardized drop weights and pendulum apparatus. This assesses puncture resistance, tear propagation, and structural resilience against collisions with obstacles, docks, and debris.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Resistance Testing
    standard: 'ASTM G154 | ISO 4892-3'
    description: Material samples are exposed to UVA-340 lamps in accelerated weathering chambers for 1,000+ hours. We measure color change (Delta E), gloss retention, and tensile strength loss to validate UV stabilizer packages.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Abrasion Resistance Testing
    standard: 'ASTM D751 (Taber) | ISO 5470-1'
    description: Material samples are subjected to CS-10 abrasive wheels under 500g/1,000g loads for 1,000 cycles. Mass loss and visual wear grading determine coating durability against sand, gravel, and repeated launching.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Low-Temperature Performance Testing
    standard: Internal Spec AF-LT-003 | MIL-STD-810G
    description: Assembled products and material coupons are conditioned at -20°C, -10°C, and 0°C for 24 hours then flex-tested. We verify that PVC and Hypalon remain flexible without cracking or delamination.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Buoyancy & Load Capacity Testing
    standard: 'ISO 6185-1 | ISO 12402'
    description: Products are incrementally loaded to 1.25x rated capacity in a controlled pool. Freeboard, stability, and self-draining performance are recorded. Every model's rated capacity is mathematically and empirically verified.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Maneuverability Testing
    standard: Internal Spec AF-MT-004
    description: On-water trials measure turning radius, acceleration, planing time, and paddle/motor response across a range of load conditions. Real-world handling characteristics are validated against design targets.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Watertightness Testing
    standard: 'ISO 6185-1 §7.3 | Internal Spec AF-WT-005'
    description: Every assembled product is spray-tested at 0.5 bar on all seams, valves, and fittings. A 5-minute pressurized submersion test validates chamber and valve watertightness. Zero-leak standard before shipping.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp

