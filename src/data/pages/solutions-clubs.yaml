testimonial:
  content: 'We started with the Club Starter Package for our surf school in Portugal. 20 boards, paddles, vests — everything arrived within 3 weeks. After two seasons, we upgraded to the Pro Package. The custom branding with our logo was a game-changer for our professional image.'
  name: 'Ricardo Santos'
  title: 'Owner, Algarve Surf Academy — Lagos, Portugal'

content_segments:
  tagline: Club Profiles
  title: 'Water Sports Club Solutions<br />By Club Type'
  subtitle: 'From university paddle clubs to exclusive private yacht clubs — each type of club has unique equipment needs, usage patterns, and budget structures. We tailor every package to match the club model.'
  items:
    - title: University & College Paddle Clubs
      subtitle: High-usage student fleets
      description: 'Student-run or institution-supported paddle clubs operating SUP and kayak programs for university recreation departments. Equipment faces high-frequency, high-turnover usage across multiple skill levels each semester. Durability and easy repairability are critical, alongside budget-friendly pricing for student organizations.'
      features:
        - 'Extra-durable PVC construction rated for student-use cycles'
        - 'Color-coded board ranges by skill level for easy fleet management'
        - 'Repair kit + on-call video support included with every order'
        - 'Student organization discount pricing and semester-based payment terms'
    - title: Community Paddle & Social Clubs
      subtitle: Membership-driven recreational clubs
      description: 'Community-based clubs offering SUP, kayak, and social paddling experiences to members. Equipment needs to balance performance and comfort for a wide age range, with branding that fosters club identity and member pride. Storage efficiency is key for clubs operating from limited waterfront access.'
      features:
        - 'Mixed fleet: all-around SUPs, touring boards, and recreational kayaks'
        - 'Full club branding: custom colors, logo printing, branded PFDs'
        - 'Compact storage solutions for inflatable equipment'
        - 'Membership growth starter kit: referral cards, branded photography'
    - title: Surf Schools & Surf Kayak Academies
      subtitle: Coastal performance and coaching
      description: 'Surf-focused schools teaching SUP surfing, surf kayaking, and wave riding skills. Equipment must perform in surf conditions — maneuverable, responsive, and durable enough to handle repeated wipeouts, sand abrasion, and saltwater exposure without rapid degradation.'
      features:
        - 'Shorter, wider SUP shapes optimized for surf maneuverability'
        - 'Reinforced rail construction for impact resistance in waves'
        - 'Surf-specific safety gear: coiled leashes, soft-fin options'
        - 'Fleet replacement program with seasonal trade-in discounts'
    - title: Corporate & Private Yacht Clubs
      subtitle: Premium member experiences
      description: 'Exclusive private clubs offering water sports as a premium amenity for members. Equipment standards are high — aesthetics, brand alignment, and guest-ready presentation are as important as performance. Service expectations include white-glove delivery, custom storage solutions, and concierge-level support.'
      features:
        - 'Premium finish boards with wood-grain EVA and metallic accents'
        - 'Custom color matching to club brand guidelines'
        - 'Concierge delivery: pre-inflated, staged, and labeled for each season'
        - 'Dedicated account management with priority response SLA'

