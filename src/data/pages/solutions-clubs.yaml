hero:
  tagline: Water Sports Clubs
  title: 'Equipment & Solutions<br />For Paddle Clubs & Training Centers'
  subtitle: 'Complete gear packages, instructor equipment, branding, and maintenance support for SUP clubs, kayak clubs, surf schools, and water sports training centers of any size.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP boards for water sports clubs and rental fleets

direct_answer: 'Paddle Board Overstock provides end-to-end equipment solutions for water sports clubs and training centers worldwide. Our club packages include SUP boards, kayaks, paddles, pumps, repair kits, and safety gear at competitive wholesale pricing with low MOQs. Each package can be customized with club logos, branded colors, and personalized packaging. We also provide maintenance training, spare parts support, and equipment rotation programs to maximize the lifespan of your fleet.'

solution_offerings:
  - title: Club Starter Package
    subtitle: For emerging clubs with 10–30 members
    badge: Best Seller
    features:
