        description: 10–30 SUP boards or kayaks with matching paddles, pumps, and repair kits
      - title: Safety Gear
        description: Life vests, whistle, leash sets in club colors for every board
      - title: Instructor Equipment
        description: Coach-specific boards with non-slip decks and extra stability
      - title: Branding Package
        description: Custom logo printing on boards, paddles, and packaging
      - title: Training Materials
        description: Beginner lesson guides, safety protocols, and maintenance checklists
    cta_text: Build My Club Package
    cta_href: '/contact'

  - title: Club Premium Package
    subtitle: For established clubs and multi-location operators
    badge: Professional
    features:
      - title: Full Fleet
        description: 30–100 mixed fleet of SUPs, kayaks, and accessories
      - title: Advanced Safety System
        description: RFID equipment tracking, damage reporting app, safety signage
      - title: Staff Training
        description: On-site instructor certification and equipment maintenance workshop
      - title: Marketing Support
        description: Professional photography, brochures, and social media templates
      - title: Replacement Program
        description: Annual equipment refresh at discounted rates with trade-in options
    cta_text: Scale My Club
    cta_href: '/contact'

