hero_text:
  tagline: Dobijte Ponudu
  title: Zatražite Ponudu<br />za Vaš Projekt
  subtitle: Recite nam o svojim zahtjevima i naš tim će odgovoriti s detaljnom ponudom u roku od 2 radna dana.
steps2_process:
  title: Kako To Funkcionira
  subtitle: Četiri jednostavna koraka od upita do ponude.
  items:
    - title: 'Korak 1: Pošaljite Svoje Zahtjeve'
      description: Ispunite donji obrazac s vrstom vašeg proizvoda, količinom i specifikacijama. Što više detalja pružite, to će vaša ponuda biti točnija.
      icon: tabler:file-text
    - title: 'Korak 2: Pregled i Savjetovanje'
      description: Naš inženjerski tim pregledava vaše zahtjeve i može vas kontaktirati radi pojašnjenja. Pružamo preporuke o konfiguraciji proizvoda i opcijama.
      icon: tabler:users
    - title: 'Korak 3: Primite Svoju Ponudu'
      description: Primite detaljnu ponudu uključujući cijenu po jedinici, MOQ, rok isporuke, uvjete plaćanja i opcije dostave. Obično u roku od 48 sati.
      icon: tabler:currency-dollar
    - title: 'Korak 4: Uzorak i Proizvodnja'
      description: Nakon prihvaćanja ponude, nastavljamo s proizvodnjom uzorka (ako je primjenjivo) ili izravno s masovnom proizvodnjom. Redovite ažuriranja tijekom procesa.
      icon: tabler:building-factory
content_form:
  tagline: Obrazac Za Ponudu
  title: Recite Nam o Vašem Projektu
  subtitle: Sva polja označena sa * su obavezna.
  fields:
    - name: Kategorija proizvoda
      type: select
      options:
        - RIB Brod
        - Naduvani Čamac
        - SUP Dasaka
        - Kajak na napuhavanje
        - Prsluk za Spašavanje
        - Marine Dodatak
        - Prilagođeno OEM/ODM
    - name: Primjena
      type: select
      options:
        - Centar za Ronjenje
        - Ribarstvo
        - Morski Turizam / Resort
        - Potraga i spašavanje
        - Tender za jahtu
        - Komercijalni radni brod
        - Vlada / Vojska
        - OEM / Privatna oznaka
        - Osobno / Rekreativno
        - Ostalo
    - name: Količina
      type: text
      placeholder: e.g. 50 jedinica
    - name: Ciljno tržište
      type: text
      placeholder: e.g. Europa, Sjeverna Amerika, Bliski Istok
    - name: Zemlja isporuke
      type: text
      placeholder: e.g. Italija, UAE, SAD, Australija
    - name: Preferirani materijal
      type: select
      options:
        - Bez preferencija
        - Marine-grade PVC (1100 dtex)
        - Premium Hypalon / CSM
        - Trup od stakloplastike
        - Aluminijski trup
    - name: Zahtjev za motor
      type: text
      placeholder: e.g. 60 HP vanbrodski, bez motora, dvostruki 115 HP
    - name: Potrebna prilagodba
      type: text
      placeholder: e.g. prilagođene boje, brendiranje/logo, pakiranje, posebne armature
    - name: Rok
      type: text
      placeholder: e.g. isporuka unutar 90 dana
    - name: Dodatni zahtjevi
      type: textarea
      placeholder: Opisajte svoju primjenu, tehničke specifikacije ili posebne zahtjeve — uključite referentne crteže, specifikacije ili linkove ako su dostupni
    - name: Prenesite specifikacije
      type: file
      placeholder: Prenesite svoj dokument sa specifikacijama, crtež ili referentni dokument (PDF, DWG, DXF)
    - name: Prenesite logo / umjetnički rad
      type: file
      placeholder: Prenesite svoj logo ili umjetnički rad za prilagođeno brendiranje (AI, EPS, PNG)
content_rfq_types:
  tagline: 3-slojni RFQ sustav
  title: Odaberite pravu<br />Razinu upita
  subtitle: Različiti projekti zahtijevaju različite razine detalja. Odaberite obrazac koji odgovara vašoj fazi kupnje.
  items:
    - title: Brzi upit
      description: 5-6 polja, 30 sekundi. Za inicijalni kontakt, opća pitanja ili praćenje preuzimanja resursa. Odgovaramo u roku od 24 sata s osnovnim informacijama i sljedećim koracima.
      icon: tabler:bolt
    - title: Standardni RFQ
      description: 8-10 polja, 2 minute. Za konkretne ponude proizvoda s odabirom modela, količine i zahtjeva za isporuku. Dobijte detaljnu ponudu u roku od 48 sati.
      icon: tabler:file-text
    - title: Projektni RFQ
      description: 10-14 polja, 5 minuta. Za RIB, odmaralištne flote, spasilačke ili vladine projekte koji zahtijevaju prilagođenu konfiguraciju, dokumentaciju o usklađenosti i višegodišnje planiranje opskrbe. Dodijeljen je posvećeni voditelj projekta.
      icon: tabler:clipboard-list
form_quick:
  title: Brzi upit
  subtitle: Brzi kontakt za opća pitanja i inicijalne zahtjeve za informacijama.
  fields:
    - name: punoIme
      label: Puno ime
      type: text
      required: true
      placeholder: Vaše puno ime
    - name: poslovniEmail
      label: Poslovni Email
      type: email
      required: true
      placeholder: you@company.com
    - name: nazivTvrtke
      label: Naziv tvrtke
      type: text
      required: true
      placeholder: Vaša tvrtka
    - name: vrstaKupca
      label: Ja sam...
      type: select
      required: true
      options:
        - Distributer / Uvoznik
        - Vlasnik brenda / Privatna marka
        - Odmaralište / Vodeni centar
        - Operator najma
        - Vladina / Spasilačka agencija
        - Ronioci / Ribolovni operator
        - Pomorski inženjer / Preuređivač
        - Ostalo
    - name: interesZaProizvod
      label: Zanimanje za proizvod
      type: multiselect
      required: true
      options:
        - RIB Čamci
        - Čamci na napuhavanje
        - SUP Ploče
        - Sigurnosna oprema
        - Pribor
        - OEM/ODM Prilagođeno
    - name: message
      label: Što vam je potrebno?
      type: textarea
      required: false
      placeholder: Kratki opis vaših zahtjeva...
form_standard:
  title: Standardni RFQ
  subtitle: Detaljan zahtjev za ponudu za određene proizvode i količine.
  fields:
    - name: punoIme
      label: Puno ime
      type: text
      required: true
    - name: poslovniEmail
      label: Poslovni Email
      type: email
      required: true
    - name: nazivTvrtke
      label: Naziv tvrtke
      type: text
      required: true
    - name: vrstaKupca
      label: Vrsta kupca
      type: select
      required: true
    - name: modelProizvoda
      label: Model / Tip proizvoda
      type: text
      required: true
      placeholder: e.g., AF580 RIB, AF380 Napuhavajući
    - name: quantity
      label: Procijenjena količina
      type: text
      required: true
      placeholder: e.g., 10-20 jedinica
    - name: targetMarket
      label: Ciljno tržište / regija
      type: text
      required: true
      placeholder: e.g., EU, Sjeverna Amerika, Bliski istok
    - name: deliveryTimeline
      label: Željena isporuka
      type: select
      required: true
      options:
        - Unutar 30 dana
        - 30-60 dana
        - 60-90 dana
        - Planiranje unaprijed (90+ dana)
        - Samo istražujem
    - name: complianceRequired
      label: Zahtjevi za usklađenost
      type: multiselect
      required: false
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - Nema / Nisam siguran
    - name: message
      label: Dodatni detalji
      type: textarea
      required: false
form_project:
  title: Projektni RFQ
  subtitle: Sveobuhvatni upit projekta za flotu, prilagođenu ili državnu nabavu.
  fields:
    - name: punoIme
      label: Puno ime
      type: text
      required: true
    - name: poslovniEmail
      label: Poslovni Email
      type: email
      required: true
    - name: nazivTvrtke
      label: Naziv tvrtke
      type: text
      required: true
    - name: vrstaKupca
      label: Vrsta kupca
      type: select
      required: true
    - name: tipProjekta
      label: Tip projekta
      type: select
      required: true
      options:
        - Flota odmarališta / hotela
        - Flota za najam
        - Flota za spasilačke / patrolne aktivnosti
        - Flota ronilačkog centra
        - Državna nabava
        - Private Label / OEM
        - Narudžba dilerovog skladišta
        - Ostalo
    - name: vrsteBrodova
      label: Potrebne vrste brodova
      type: multiselect
      required: true
      options:
        - RIB Čamci
        - Gumenjaci / čamci
        - SUP Ploče
        - Kajaci
        - Sigurnosna oprema
    - name: velicinaFlote
      label: Veličina flote / Raspon količine
      type: text
      required: true
      placeholder: npr., 20-50 jedinica u razdoblju od 12 mjeseci
    - name: prilagodjeneZahtjeve
      label: Potrebne prilagođene konfiguracije
      type: textarea
      required: false
      placeholder: Veličina trupa, materijal tube, raspored palube, zahtjevi za brendiranjem...
    - name: complianceRequired
      label: Zahtjevi za usklađenost i certifikate
      type: multiselect
      required: true
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG Tip III/V
        - ISO 9001
        - BSCI
        - REACH / RoHS
        - Certifikacija za lokalno tržište
    - name: targetMarket
      label: Ciljno tržište
      type: text
      required: true
    - name: rasponProračuna
      label: Raspon proračuna
      type: select
      required: false
      options:
        - Ispod 10.000 $
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - Radije ne bih rekao
    - name: deliveryTimeline
      label: Rok projekta
      type: select
      required: true
      options:
        - Hitno (unutar 30 dana)
        - Standardno (30-60 dana)
        - Planirano (60-90 dana)
        - Planiranje za budućnost (više od 90 dana)
    - name: message
      label: Detalji i zahtjevi projekta
      type: textarea
      required: false
      placeholder: Opišite svoj projekt, aplikaciju i sve posebne zahtjeve...
cta:
  title: Radije biste razgovarali putem e-pošte?
  subtitle: Pošaljite svoj upit izravno našem prodajnom timu i odgovoriti ćemo u roku od 24 sata.
  actions:
    - variant: primary
      text: Pošaljite nam e-poštu izravno
      href: /contact
