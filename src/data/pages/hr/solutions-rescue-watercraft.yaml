content_challenge:
  tagline: Izazov
  title: Zahtjevi operacija spašavanja<br />Nepokolebljiva pouzdanost
  subtitle: Organizacije za pretragu i spašavanje djeluju pod ekstremnom odgovornošću za sigurnost — svaki kvar broda nosi neprihvatljive posljedice.
  paragraphs:
    - U operacijama spašavanja, razlika između uspjeha i neuspjeha mjeri se u minutama. Brod mora biti spreman za odmah lansiranje, raditi u teškim uvjetima i sigurno se vratiti s putnicima. Odgovornost za sigurnost je apsolutna — mehanički kvar tijekom misije spašavanja nije trošak popravka, već izgubljeni život.
    - SAR brodovi trebaju visoku brzinu za brzo dolazak do žrtava, u kombinaciji s iznimnom stabilnošću za sigurne operacije spašavanja. Mora nositi opremu za spašavanje, medicinske potrepštine i komunikacijsku opremu — često u ograničenom prostoru palube. Brodovi koji rade u državnim službama također trebaju dug vijek trajanja (10-15 + godina) kako bi opravdali javne nabavne budžete.
    - Vidljivost, kako za operatera tako i za pretraživanje, ključna je. Dizajn konzole mora pružiti vidljivost od 360 stupnjeva, a brod bi trebao biti vrlo vidljiv zrakoplovima i drugim plovilima.
    - Aquafarer spašavanje RIBs su dizajnirani od kobilice prema gore za ove zahtjeve — s samopraznećim palubama, ojačanim trupovima, navigacijskim sustavima i standardiziranim kuku za vuču na patrolnim modelima.
content_solution:
  tagline: Naše rješenje
  title: Specijalno dizajnirano spašavanje RIBs
  subtitle: Svaki Aquafarer spašavanje brod je dizajniran da zadovolji ili premaši SOLAS i nacionalne standarde SAR-a.
  list:
    - Samoprazneća paluba — voda se automatski isprazni za stabilnost tijekom operacija spašavanja
    - Ojačan duboki V trup — sposobnost u grubljim vodama s predvidljivim rukovanjem pri brzini
    - Potpuni navigacijski svjetlosni sustav — operativno danju i noću u svim vremenskim uvjetima
    - Kuk za vuču i vučna vrpca — spremno za vuču plovila ili operacije s sanjkama za spašavanje
    - Ploče za montažu opreme — radio, reflektor, sirena i medicinska oprema
    - Više konfiguracija motora — pojedinačni izvanbrodski ili dvomotorna redundancija
    - Boje tubusa visoke vidljivosti — narančasta, žuta ili crvena za maksimalnu vidljivost
content_segments:
  tagline: Profili spašavanja
  title: Rješenja za vodena vozila za traženje i spašavanje<br />Po tipu organizacije
  subtitle: Različite spasilačke organizacije djeluju pod različitim mandatima, ciklusima proračuna i operativnim uvjetima — od obalnih volonterskih posada do nacionalnih flota obalne straže. Svako RIB spašavanje konfiguriramo prema profilu misije.
  items:
    - title: Obalna straža i državne SAR agencije
      subtitle: Apsolutna odgovornost za sigurnost — standardi flote od presudne važnosti
      description: Državne SAR agencije nose najveću odgovornost za sigurnost u pomorskim operacijama. Svaka brodica mora besprijekorno funkcionirati u ekstremnim uvjetima — kvar opreme tijekom misije spašavanja nije opcija. Odluke o nabavi pokreće ukupni trošak vlasništva tijekom 10-15 godina službenog vijeka, a ne početna cijena. Agencije trebaju plovila koja izdrže godine obalne patroličke službe, ispunjavaju stroge nacionalne standarde i pružaju dosljedne performanse na raspoređenim stanicama. Obavezna je sveobuhvatna dokumentacija o usklađenosti i višegodišnji ugovori o održavanju.
      features:
        - SOLAS i paket dokumentacije o usklađenosti s nacionalnim SAR standardima
        - Zajednička uporaba dijelova unutar flote — smanjenje složenosti inventara na razini stanica
        - Dvomotorna konfiguracija za misije od kritične važnosti
        - Dizajn za 10-15 godina životnog vijeka s programima planiranog održavanja
        - Sposobnost rada u svim vremenskim uvjetima — ojačano duboko-V trup za valovita stanja mora
    - title: Službe spasilaca i spašavanja na plaži
      subtitle: Brzo lansiranje, operacije u plitkim vodama
      description: Komunalne i plažne službe spasilaca kojima je potrebno brzo reagirajuće plovilo koje može lansirati kroz valovite zone, raditi u plitkim priobalnim vodama i dosegnuti kupače ili ugrožena plovila u nekoliko minuta. Oprema mora biti dovoljno lagana za vuču po plaži malim vozilom ili ručno.
      features:
        - Trup RIB plitkog gaza za rad u surferskoj zoni i priobalnim vodama
        - Mogućnost lansiranja s plaže s ručkom za podizanje pramca i zaštitom kila
        - Integrirana platforma za spašavanje ili za spašavatelja plank
        - Standardne boje tubusa narančaste ili žute za visoku vidljivost
    - title: Vatrogasne službe
      subtitle: Integracija vatrogasne pumpe, montaža opreme, brzo reagiranje
      description: Morske jedinice vatrogasaca reagiraju na požare objekata uz obalu, požare plovila i incidente u vodi. Ove brodice moraju nositi vatrogasne pumpe, monitore, spremnike za cijevi i dišni aparat — sve integrirano u stabilnu platformu za brzo reagiranje. Službe također koriste ova plovila za reagiranje na poplave i operacije međusobne pomoći. Raspored konzole mora omogućiti kontrolu pumpi, rad radio sustava i hitne rasvjete bez kompromitiranja prostora na palubi za kretanje posade.
      features:
        - Vatrogasni monitor na pramcu s paketom integracije pumpi
        - Namjenska montaža opreme za vatrogasnu pumpu, spremnike za cijevi i dišne aparate
        - Raspored konzole prilagodljiv za kontrolu pumpi, radio i hitnu rasvjetu
        - Samopražnjavajuća paluba za otjecanje vode i stabilnost
        - 'Paket za noćne operacije: svjetiljka, rasvjeta scene, plavo/crvena svjetlosna traka'
    - title: Pomorska policija i lučka sigurnost
      subtitle: Zabrana, patroliiranje, ukrcajne operacije
      description: Mornaričke jedinice za provedbu zakona zahtijevaju plovila sposobna za visokobrzinsko praćenje, ukrcavanje na sumnjiva plovila i patroliranje sigurnosti luka. Ovi brodovi moraju imati sigurno spremište za opremu i oružje za provedbu zakona, integraciju komunikacije s kopnenom zapovjesti te dovoljno prostora na palubi za operacije ukrcajne ekipe. Sposobnost noćnih operacija i pristup s niskim profilom bitni su za misije zadržavanja.
      features:
        - Sposobnost visokobrzinskog potjerivanja — trup za planarno kretanje s najvećom brzinom od 40 čvorova
        - Sigurnosni ormar za oružje i spremišta za opremu za provođenje zakona
        - Integracija konzole za policijsku radio stanicu, MDT i komunikacijske sustave
        - 'Paket za noćne operacije: IR reflektor, nosač FLIR-a, prikriveno osvjetljenje'
        - Ojačana platforma za ukrcaj s površinom koja ne klizi
        - Plavo/crveno hitno osvjetljenje i sustav sirene
    - title: Dobrovoljne organizacije za potragu i spašavanje (SAR) i neprofitne organizacije
      subtitle: Zajmovima financirane, zajednički vođene obalne i jezerske operacije
      description: Oružja spašavanja utemeljena na zajednici djeluju na jezerima, rijekama i obalnim područjima gdje je pokrivenost vladinim SAR-om ograničena. Često financirane donacijama ili državnim potporama, ove organizacije trebaju maksimalne sposobnosti po uloženom dolaru — pouzdan, za održavanje jednostavan brod kojim volonteri mogu sigurno upravljati uz minimalnu specijaliziranu obuku. Ciklus pribavljanja potpora znači da brodovi moraju udovoljavati propisnim zahtjevima, a istovremeno ostati unutar fiksnih proračuna.
      features:
        - Konfiguracija s jednim izvanbrodskim motorom optimizirana za niže troškove nabave i rada
        - PVC konstrukcija za manji održavanje i jednostavnu popravku na terenu
        - Višenamjenska konzola koja minimizira elektroničku složenost za volonterske operatore
        - Paket dokumentacije o usklađenosti s grantom za prijave za financiranje
        - Lagana konstrukcija za lansiranje na plaži bez posebnog prikolice ili dizalice
    - title: Spašavanje od poplava i odgovor na katastrofe
      subtitle: Poplave u unutrašnjosti, plitka voda, okruženja puna krhotina
      description: Spašavanje tijekom poplava poseban je operativni profil — čamci djeluju u poplavljenim urbanim područjima, strujama ispunjenim otpadom i izuzetno plitkoj vodi gdje su potopljene prepreke nevidljive. Operatori trebaju plovila koja mogu navigirati poplavljenim ulicama, probijati se kroz otpad i izvlačiti žrtve iz zgrada i vozila. Sposobnost plitkog gazanja je ključna, kao i sposobnost rada u struji s opasnostima od zapinjanja. Ovi čamci često se koriste od strane vatrogasnih postrojbi, civilne zaštite i nevladinih organizacija za pomoć u katastrofama.
      features:
        - Trup izrazito plitkog gazu — može ploviti u vodi dubine 30-50 cm
        - Luk koji odbija krhotine i pojačana zaštita cijevi za potopljene prepreke
        - Paluba s automatskim ispustom za otjecanje poplavnih voda i spašavanje žrtava
        - Cijevi jarko narančaste ili žute boje za vidljivost u zračnom izviđanju
        - Lagana konstrukcija za transport helikopterom i cestovno iskrcavanje
        - Ojačane točke za dizanje za radove dizalicom i spašavanje užetom
