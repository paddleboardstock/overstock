how_to_choose:
  title: Kako odabrati pravu veličinu
  cards:
    - title: SUP Ploče
      description: Odaberite duljinu prema svojoj težini i namjeni. Šire daske (32"+) nude veću stabilnost. Duže daske (11-12 ft) bolje prate putanju kod ture. Teži veslači trebaju daske većeg volumena.
    - title: Kajaci
      description: Jednokai kajaci (9 ft) najbolji su za solo putovanja i rijeke. Tandem kajaci (12 ft) primaju dva veslača ili jednog odraslog s opremom. Provjerite kapacitet težine za ukupno opterećenje uključujući opremu.
    - title: Čamci i RIBs
      description: Odaberite duljinu čamca prema broju putnika i namjeni. Veći RIBs (4,5 m+) prikladni su za otvoreno more i spašavanje. Manji čamci (2,7 m) funkcioniraju kao privezni čamci i platforme za ribolov.
