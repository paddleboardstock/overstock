hero:
  title: Vodič za veličinu i specifikacije
  subtitle: Dimenzije, kapaciteti i preporučene namjene za svaki Paddle Board Overstock proizvod.
categories:
  inflatable: Napuhavajući SUPs i kajaci dizajnirani za prenosivost bez žrtvovanja performansi. Odaberite pravu veličinu prema svojoj težini i stilu veslanja.
  rib: Čamci s krutim trupom i napuhavajući za obalnu navigaciju, patrolu i profesionalne pomorske operacije. Odaberite po dužini i kapacitetu motora.
  accessory: Dodaci i sigurnosna oprema za dopunu vašeg plovila. Univerzalne veličine s više opcija.
