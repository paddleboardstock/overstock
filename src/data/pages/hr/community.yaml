stories:
  tagline: Priče istraživača
  title: Prava avantura od pravih ljudi
  subtitle: Slušajte kajakaše, obitelji i profesionalce koji koriste Paddle Board Overstock opremu na vodi.
  items:
    - name: Sara i Mike
      title: Vlasnici Explorer 11, Kanada
      content: Ponijeli smo naše Explorer 11 na tjedno putovanje kroz Algonquin Park. Savršeno su podnijeli prijenose i prelazak jezera. drop-stitch konstrukcija značila je da ih možemo napumpati do 15 PSI i dobiti performanse tvrdih dasaka od prenosive daske.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Park Algonkin, Kanada
    - name: Carlos R.
      title: Jahač Cheetah Surga, Španjolska
      content: Cheetah Surge mi je prvi izbor za krstarenje uz obalu. Živopisni dizajn privlači poglede na plaži, a stabilnost mi daje samopouzdanje u laganim valovima. Odlično se ponaša bilo da krstarim ili samo uživam u zalasku sunca.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Španjolska
    - name: Lina i obitelj
      title: Veslači Flowing Lotus, Švedska
      content: Vikend obiteljske avanture na arhipelagu. Flowing Lotus dovoljno je stabilan da moja kćer može stajati na njemu dok ja veslam. Napuhava se za manje od 10 minuta — nije potreban prikolica, samo čista obiteljska zabava na vodi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholmski arhipelag, Švedska
    - name: Poručnik komandant Andres
      title: Istraživač Ocean Voyager, Filipini
      content: Koristim svoj Ocean Voyager za dugotrajne obalne ture oko Palawana. Nakon mjeseci svakodnevne upotrebe u tropskim uvjetima, daska još uvijek radi kao nova. Oblik za ture probija valove koji bi zaustavili slabije daske.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipini
    - name: Emma T.
      title: Tropical Breeze prvi put, Australija
      content: Nikada prije nisam bio na SUP. Tropical Breeze je toliko stabilan da sam se osjećao samopouzdano pri prvom pokušaju. Sada veslam svaki vikend. Krivulja učenja je praktički nula — a daska izgleda nevjerojatno na vodi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australija
