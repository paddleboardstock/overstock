rd_services:
  tagline: Prilagođeni R&D
  title: R&D usluge za partnere
  services:
    - title: Razvoj prilagođenih materijala
      desc: Razvijamo prilagođene formulacije tkanina, slojeve laminata i sustave ljepila prilagođene vašem operativnom okruženju i ciljevima performansi.
    - title: OEM / ODM Inženjering proizvoda
      desc: Od konceptualnih skica do inženjerskih paketa spremnih za proizvodnju — naš tim može dizajnirati, izraditi prototip i validirati brodove pod vašom markom.
    - title: Testiranje i certifikacija treće strane
      desc: Koristite naše ISO-usklađene testne objekte za neovisno testiranje materijala, validaciju proizvoda i podršku pri certifikaciji.
  cta: Razgovarajte o svojim R&D zahtjevima →
  cta_link: /contact
vision:
  tagline: Naša vizija
  title: Oblikovanje budućnosti vodenih sportova
  body: Aquafarer nastoji voditi industriju napuhanih čamaca i SUP kroz kontinuirane inovacije, nepokolebljivu kvalitetu i čvrstu predanost sigurnosti i održivosti — u konačnici obogaćujući iskustva ljubitelja vodenih sportova diljem svijeta. Aquafarer R&D Centar je mjesto gdje se strast susreće s inovacijom, postavljajući nove standarde za industriju vodenih sportova.
labs_section:
  tagline: Laboratoriji
  title: Naši laboratoriji
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Laboratorij za tkanine
      description: Kontinuirano istraživanje i testiranje tkanina cijevi PVC i Hypalon na čvrstoću na zatezanje, otpornost UV, habanje i fleksibilnost na niskim temperaturama kako bi se osigurala dugoročna pouzdanost u pomorskim okruženjima.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Hull Inženjerski Studio
      description: CAD-pokretan dizajn i analiza konačnih elemenata trupova od HDPE-a, aluminija i stakloplastike. Svaki trup je digitalno simuliran za raspodjelu naprezanja i otpornost na udar prije nego što se izgradi prvi prototip.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF centar za zavarivanje
      description: Specijalizirani pogon za zavarivanje radio-frekvencijom s preciznom kontrolom temperature i tlaka, koji proizvodi visoko čvrste, zračno-impregnirane šavove koji zadovoljavaju standarde pomorske industrije za napuhljive plovila.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hidrodinamički testni rezervoar
      description: Testiranje modela u mjerilu u našem internom testnom bazenu kako bismo optimizirali oblik trupa, performanse planiranja, stabilnost i učinkovitost goriva u različitim uvjetima opterećenja i mora.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Radionica prototipa
      description: Puna skala prototipiranja i opreme gdje se izrađuju, opremaju i isprobavaju novi modeli na moru. Svaki prototip prolazi najmanje 20-satni program testiranja na vodi prije odobrenja za proizvodnju.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratorij za kvalitetu i inspekciju
      description: Namjenski laboratorij za osiguranje kvalitete provodi ispitivanja na vlačnu čvrstoću, testove zadržavanja zraka, testove odvajanja šavova i certifikaciju materijala kako bi se osiguralo da svaki brod koji napusti radionicu zadovoljava naše objavljene specifikacije.
      href: /randdcenter/quality-inspection-lab
