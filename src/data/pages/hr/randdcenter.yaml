hero:
  tagline: Centar za istraživanje i razvoj
  title: Centar za istraživanje i razvoj
  subtitle: Usmjeren na napredak
intro:
  - Istraživački i razvojni (R&D) centar Aquafarer pokretačka je snaga iza naše misije da revolucioniramo opremu za vodene sportove. Omogućujemo ljubiteljima vodenih sportova širom svijeta sigurnije, udobnije i ugodnije proizvode kroz neprestanu inovaciju u napuhavim stand-up daske za veslanje (SUPs) i čamcima. Naš posvećeni tim inženjera, dizajnera i strastvenih stručnjaka za vodene sportove oblikuje budućnost industrije, stalno podižući ljestvicu kvalitete, performansi i održivosti.
  - Naš R&D laboratorij okuplja znanstvenike za materijale, brodograditelje i inženjere proizvodnje pod jednim krovom. Od formulacije tkanina i simulacije trupa do razvoja postupaka zavarivanja i ispitivanja na punoj skali na moru, svaka faza razvoja proizvoda vođena je podacima i potvrđena testiranjem.
mission:
  tagline: Naša misija
  title: Inoviranje budućnosti vodenih sportova
  pillars:
    - icon: lightning
      title: Tehnološki napredak
      desc: Inovativni novi materijali, dizajni i proizvodnja za vrhunsku izvedbu proizvoda i dugovječnost.
    - icon: design
      title: Dizajn usmjeren na korisnika
      desc: Duboko razumijevanje i nadmašivanje korisničkih potreba kroz ergonomski i intuitivan dizajn proizvoda.
    - icon: globe
      title: Održivе prakse
      desc: Smanjivanje našeg utjecaja na okoliš korištenjem ekološki prihvatljivih materijala i procesa.
    - icon: shield
      title: Nepokolebljiva sigurnost
      desc: Osiguravanje najviših sigurnosnih standarda kroz rigorozna testiranja i certifikaciju.
pillars:
  - title: Tehnološki napredak
    desc: Istraživanje novih materijala, dizajna i proizvodnih procesa radi postizanja vrhunske izvedbe proizvoda i dugovječnosti.
    icon: tech
  - title: Napredni materijali
    desc: Istraživanje vrhunskih PVC, Hypalon, kompozita i održivih alternativa za poboljšane karakteristike proizvoda.
    icon: materials
  - title: Održivost
    desc: 'Temeljna obveza: Posvećeni smo zaštiti okoliša kroz održivu proizvodnju i reciklabilne materijale.'
    icon: sustainability
capabilities:
  tagline: Mogućnosti
  title: Sposobnosti istraživanja i razvoja
  subtitle: Četiri temeljne discipline koje nam pružaju potpunu kontrolu nad razvojem proizvoda — od istraživanja sirovina do konačne certifikacije.
  groups:
    - title: Znanost o materijalima i tehnologija tkanina
      items:
        - analiza i optimizacija formulacije PVC i Hypalon
        - UV stabilizacija, otpornost na plamen i razvoj antimikrobnih dodataka
        - Inženjering laminacije i adhezije višeslojnog tkanina
        - Testiranje ubrzanog starenja (UV, toplinski, vlaga, slani sprej)
    - title: Inženjering trupa i hidrodinamika
      items:
        - Parametrijski 3D dizajn trupa i CFD optimizacija
        - Analiza konačnih elemenata za strukturna i udarna opterećenja
        - Testiranje u vučnom bazenu skaliranih modela i validacija performansi
        - Razvoj prilagođenog trupa za specijalne misijske profile
    - title: Tehnologija zavarivanja i spajanja
      items:
        - Razvoj i optimizacija RF dielektričnog procesa zavarivanja
        - Metode zavarivanja toplim zrakom, vrućim klinom i ultrazvukom
        - Kvalifikacija ljepljenja i traka za šavove
        - Modeliranje čvrstoće zavarivanja i predviđanje vijeka trajanja
    - title: Testiranje, certifikacija i usklađenost
      items:
        - Upravljanje kvalitetom i CE testiranje usklađenosti
        - Podrška za neovisno testiranje i certifikaciju treće strane
        - Razvoj prilagođenih test protokola za kvalifikaciju nabave
        - Analiza kvarova u radu i ispitivanje uzroka
