content_benefits:
  tagline: Prednosti partnerstva
  title: Zašto distributeri<br />Odaberite Paddle Board Overstock
  subtitle: Partnerstvo osmišljeno za pomorske distributere kojima je potrebna pouzdana opskrba, konkurentske marže i profesionalna podrška.
  items:
    - title: Zaštita teritorija
      description: Ekskluzivna ili poluekskluzivna teritorijalna prava za kvalificirane distributere. Mapiranje tržišta i upravljanje sukobima kanala kako biste zaštitili svoje ulaganje u izgradnju Paddle Board Overstock brenda u svojoj regiji.
      icon: tabler:map-pin
    - title: Konkurentne veleprodajne cijene
      description: Višeslojno određivanje cijena temeljeno na godišnjim obvezama za volumen. Struktura određivanja cijena s zaštitom marže s unaprijed jamstvenim cijenama i transparentnim razvrstavanjem troškova (FOBna osnovi Qingdao).
      icon: tabler:currency-dollar
    - title: Komplet za marketinšku podršku
      description: Profesionalna fotografija proizvoda, specifikacijski listovi, predlošci dokumentacije o usklađenosti, sadržaj na društvenim mrežama i promotivni materijali s zajedničkim brendom. Ažurirano svake godine s novim lansiranjem proizvoda.
      icon: tabler:photo
    - title: Tehnička obuka
      description: Obuka o proizvodima za vaš prodajni tim (virtualna ili na licu mjesta), obuka o održavanju i popravcima za servisne tehničare te često postavljana pitanja i vodiči za rješavanje problema usmjerene na korisnike.
      icon: tabler:school
    - title: Rezervni dijelovi i postprodaja
      description: Posvećena opskrba rezervnim dijelovima s prioritetnom dostavou. Zamjenski dijelovi cijevi, ventili, rebra i kompleti za popravak dostupni su za brzu realizaciju narudžbi. Podrška za obradu jamstvenih zahtjeva.
      icon: tabler:tool
    - title: Dokumentacija o usklađenosti
      description: 'Potpuni paket dokumentacije usklađenosti za vaše tržište: CE DoC, podaci o pločama graditelja, priručnici za vlasnike i podrška za regulatornu registraciju. Uklanja opterećenje usklađenosti.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Što tražimo
  title: Distributer<br />Zahtjevi
  subtitle: Tražimo partnere koji mogu profesionalno zastupati i podržavati Paddle Board Overstock proizvode na svom teritoriju.
  items:
    - title: Poznavanje teritorija i tržišta
      description: Uspostavljena prisutnost na tržištu marine, vodenih sportova ili vanjskih rekreacijskih aktivnosti. Razumijevanje lokalnih propisa, preferencija potrošača i distribucijskih kanala za proizvode za plovila.
      icon: tabler:target
    - title: Iskustvo u industriji
      description: Minimalno 2 godine iskustva u distribuciji opreme za marine, vanjske ili sportske aktivnosti. Dokazane rezultate s međunarodnim brendovima i B2B veleprodajnim operacijama.
      icon: tabler:briefcase
    - title: Izložbeni prostor ili skladište
      description: Fizički prostor za prikaz proizvoda, skladištenje zaliha i korisničku službu. Sposobnost održavanja demo jedinica i zaliha rezervnih dijelova za vaš teritorij.
      icon: tabler:building-store
    - title: Posvećenost standardima brenda
      description: Spremnost za održavanje standarda prezentacije brenda Paddle Board Overstock, pružanje korisničke podrške prema našim servisnim protokolima i sudjelovanje u godišnjim ažuriranjima obuke o proizvodima.
      icon: tabler:star
content_process:
  tagline: Proces prijave
  title: Dealer u 4 koraka<br />Proces prijave
  subtitle: Od početnog upita do prve pošiljke — jednostavan proces uključivanja.
  steps:
    - number: '01'
      title: Početni upit i kvalifikacija
      description: Podnesite svoju prijavu za distributera s podacima o tvrtki, teritoriju od interesa, trenutnim linijama proizvoda i procjenama godišnjeg volumena. Pregled traje 5 radnih dana.
      timeline: 5 dana
    - number: '02'
      title: Poslovni pregled i uvjeti
      description: Virtualni sastanak za raspravu o strategiji teritorija, cjenovnim razinama i uvjetima partnerstva. Pregledajte zahtjeve za dokumentaciju o usklađenosti za vaše tržište. Potpis NDA ako je potrebno.
      timeline: 1-2 tjedna
    - number: '03'
      title: Naručivanje uzoraka i evaluacija
      description: Naručite početnu narudžbu uzoraka (2-5 jedinica) po cijenama za distributere za procjenu tržišta i obuku tima. Uključena je puna dokumentacija o usklađenosti i priprema demo proizvoda.
      timeline: 30-45 dana
    - number: '04'
      title: Pokretanje partnerstva i podrška
      description: Prva narudžba kontejnera s aktiviranom zaštitom teritorija. Marketinški paket isporučen, prodajni tim obučen i dodijeljen posvećeni voditelj računa. Redoviti kvartalni poslovni pregledi.
      timeline: U tijeku
content_application_docs:
  tagline: Dokumenti za prijavu
  title: Potrebni dokumenti<br />za prijavu distributera
  subtitle: Za prijavu za Paddle Board Overstock distributersko partnerstvo, pripremite sljedeće dokumente i informacije za naš tim za pregled.
  items:
    - title: Potvrda o registraciji poduzeća
      description: Valjani dokument o registraciji tvrtke koji prikazuje naziv pravne osobe, registriranu adresu i poslovni opseg koji pokriva distribuciju pomorske, sportske ili opreme za boravak.
      icon: tabler:file-text
    - title: Plan pokrivanja teritorija
      description: Geografsko područje od interesa, postojeća maloprodajna ili distributivna mreža, ciljni segmenti kupaca i predloženi godišnji volumen po kategorijama proizvoda (RIB, SUP, kayak).
      icon: tabler:map
    - title: Kapacitet izložbenog prostora ili skladišta
      description: Fizički prostor za izlaganje proizvoda, skladištenje zaliha i korisničku podršku. Fotografije ili tlocrti koji prikazuju prostor za demonstraciju i kapacitet za skladištenje rezervnih dijelova.
      icon: tabler:building
    - title: Izjava o financijskim sposobnostima
      description: 'Bankovna referenca ili financijski izvještaj koji potvrđuje mogućnost naručivanja početnog kontejnera i održavanja zaliha. Minimalna početna narudžba: jedan kontejner od 20 stopa (10-20 jedinica mješovitih modela).'
      icon: tabler:coin
    - title: Kapacitet podrške nakon prodaje
      description: Servisni tehničari obučeni ili sposobni za održavanje i popravak napuhavajućih čamaca. Mogućnost obrade jamstvenih zahtjeva i obveza zaliha rezervnih dijelova.
      icon: tabler:tool
    - title: Prethodne reference na brendove
      description: Popis trenutnih ili prethodnih brendova pomorske/sportske opreme koji se distribuiraju. Kontakt reference dostupne uz međusobni dogovor. Startupi bez prethodnog iskustva u distribuciji mogu se kvalificirati uz jaču financijsku obvezu.
      icon: tabler:users
faq:
  title: Program salona — Često postavljana pitanja
  questions:
    - q: Koja je minimalna količina narudžbe za distributere?
      a: Distributer MOQ počinje s 10-20 jedinica po narudžbi, s fleksibilnošću za mješovite modele (RIB, napuhivački, SUP). Početne uzorke narudžbi od 2-5 jedinica dostupne su po cijenama distributera za tržišnu analizu.
    - q: Nudite li ekskluzivna teritorijalna prava?
      a: Ekskluzivna teritorijalna prava dostupna su kvalificiranim distributerima koji ispunjavaju godišnje obveze o volumenu i održavaju standarde brenda. Poluekskluzivni i neekskluzivni aranžmani također su dostupni za tržišta u razvoju.
    - q: Koju marketinšku podršku pružate?
      a: Nudimo sveobuhvatan marketinški paket koji uključuje profesionalnu fotografiju proizvoda, specifikacijske listove, predloške dokumentacije o usklađenosti, biblioteku sadržaja za društvene mreže i materijale s zajedničkim brendom. Ažuriramo se godišnje s lansiranjem novih proizvoda.
    - q: Kako se rješavaju zahtjevi za jamstvom?
      a: 'Distributeri su prva kontakt točka za zahtjeve jamstva. Pružamo jasne kriterije jamstva, protokole fotografske dokumentacije te brzu zamjenu ili obradu kredita. Uvjeti jamstva: 5 godina ograničeno na tkaninu/šavove/trup cijevi za čamce; 2 godine trajanja SUP i dodatke.'
    - q: Mogu li proizvoditi proizvode pod privatnom markom Paddle Board Overstock pod svojom markom?
      a: Da, putem OEMODM našeg / programa. Opcije privatne marke uključuju prilagođene tube grafike, brendiranje konzola, maloprodajno pakiranje i dokumentaciju o usklađenosti pod imenom vaše marke. Pogledajte OEMODM našu / stranicu za usluge za detalje.
    - q: Koja je dokumentacija o usklađenosti uključena za distributere?
      a: Svaka pošiljka uključuje CE model-specifične DoC, podatke o građevinskim pločama, priručnike za vlasnike i otpremnu dokumentaciju. Također pružamo regulatornu podršku registraciji za vaše područje i pomažemo u lokalnim zahtjevima usklađenosti.
