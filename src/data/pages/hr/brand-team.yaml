hero:
  tagline: Naš tim
  title: Ljudi iza Paddle Board Overstock<br />— Inženjering slobode na vodi
  subtitle: Osnovan 2012. godine u Qingdaou, Kina, Paddle Board Overstock su izgradili pomorski inženjeri, znanstvenici za materijale i ljubitelji vodenih sportova koji su vjerovali u pristupačnost profesionalnih napuhljivih plovila diljem svijeta.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock cjelokupna fotografija tima — inženjering, proizvodnja i rukovodstvo
founding:
  tagline: Naše osnivanje
  title: Od primorske radionice<br />do pogona od 12.000 m²
  subtitle: Paddle Board Overstock su osnovali tim pomorskih inženjera s desetljećima zajedničkog iskustva u dizajnu napuhljivih brodova, PVC/Hypalon obradi i globalnoj proizvodnji pomorske opreme.
  items:
    - title: 'Osnovano: 2012.'
      description: Osnovano u Qingdaou, Kina — značajan pomorski centar s dubokom tradicijom brodogradnje.
      icon: tabler:calendar
    - title: 200-300 zaposlenika
      description: Uključujući 50+ inženjera R&D, stručnjaka za kontrolu kvalitete i proizvodne tehničare.
      icon: tabler:users
    - title: Pogon od 12.000 m²
      description: Namjenski proizvodni pogon s 6 proizvodnih linija za RIBs, napuhljive brodove i SUP daske.
      icon: tabler:building-factory
    - title: 50+ zemalja u kojima poslujemo
      description: Izvozimo u Europu, Ameriku, Bliski Istok, Azijsko-pacifičku regiju i Afriku.
      icon: tabler:globe
