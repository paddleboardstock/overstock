philosophy:
  tagline: Filozofija dizajna
  title: Dizajn vođen inženjeringom<br />— Svaki detalj je važan
  subtitle: Naša inženjerska filozofija temelji se na tri principa koja usmjeravaju svaki proizvod koji izrađujemo.
  list:
    - 'Pouzdanost na prvom mjestu: Svaki Paddle Board Overstock proizvod testiran je za izdržavanje stvarnih uvjeta — od operacija spašavanja u hladnoj vodi do najma u tropskim odmaralištima. Prenadalažujemo gdje je najvažnije.'
    - 'Preciznost u proizvodnji: Naši pogoni koriste CNC rezanje, visokofrekventno zavarivanje i automatizirano testiranje tlaka. Svaki šav, svaki ventil, svaka spojnica zadovoljava dokumentirane specifikacije.'
    - 'Kontinuirana inovacija: Naš R&D tim kontinuirano evaluira nove materijale, metode proizvodnje i poboljšanja dizajna. Ne čekamo probleme — predviđamo ih.'
