testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Vlasnik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Počeli smo s Paketom za početnike za našu školu surfanja. 20 dasaka, vesla, prsluci — sve je stiglo u roku od 3 tjedna. Nakon dvije sezone, nadogradili smo na Pro Paket. Prilagođeni brending s našim logom bio je ključan za naš profesionalni imidž.
    rating: 5
    product: Paket Club Starter
    source: solutions/clubs
  - category: clubs
    name: Vlasnik kluba
    title: Klub vodenih sportova
    location: Phuket, Tajland
    content: Paket za početnike kluba bio je savršen početak. Kako je naše poslovanje raslo, Paddle Board Overstock je rasla s nama — ista kvaliteta, iste cijene, bez iznenađenja. Povećali smo broj dasaka s 10 na 80 u 18 mjeseci.
    rating: 5
    product: Paket za početnike kluba + Premium paket
    source: success-stories
  - category: resorts
    name: Generalni direktor odmarališta
    title: Odmaralište s pet zvjezdica na plaži
    location: Grčka
    content: Paddle Board Overstock nije samo dostavio daske — pomogli su nam izgraditi kompletno iskustvo za goste. Naš program vodenih sportova išao je od nule do glavne atrakcije odmarališta u jednoj sezoni. 300+ tjednih rezervacija i 180.000 $ godišnjeg prihoda.
    rating: 5
    product: Paket Resort Premium
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktorica iskustva gostiju, Azure Bay Resorts
    location: Phuket, Tajland
    content: Paddle Board Overstock je dizajnirao i opremio cijeli naš program aktivnosti na plaži u tri resortske lokacije. 80 SUPs, 40 kajaka, sigurnosna infrastruktura i obuka osoblja — sve isporučeno u jednoj pošiljci. Sudjelovanje gostiju povećalo se za 60% u prvoj sezoni.
    rating: 5
    product: Paket Resort Premium
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Osnivač, Shoreline Paddle Co.
    location: Kalifornija, SAD
    content: Pokrenuo sam svoj SUP brand bez ikakvog iskustva u industriji. Tim Paddle Board Overstock vodio me od odabira proizvoda do dizajna prilagođenog logotipa i pakiranja. Moj prvi kontejner stigao je za 11 tjedana, a rasprodao sam ga za 3 mjeseca na Amazonu.
    rating: 5
    product: Početno Lansiranje Brenda
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Osnivač
    title: Australski SUP brand
    location: Australija
    content: Imao sam ideju za brend, ali nula znanja o proizvodnji. Paddle Board Overstock me doslovno vodio kroz cijeli proces — od odabira pravilnog dizajna ploče do otvaranja prve pošiljke. 90 dana od sna do isporuke.
    rating: 5
    product: Paket za lansiranje brenda
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Vlasnik, Lakeland SUP Rental
    location: Ontario, Kanada
    content: Iznajmljivao sam 5 dasaka iz lokalne trgovine i gubio 60% prihoda. Paddle Board Overstock mi je pomogao izgraditi vlastatu flotu od 15 SUPs. ROI kalkulator je pokazao povrat ulaganja za 4 mjeseca — trebalo je 3. Sada širimo flotu na 30 dasaka.
    rating: 5
    product: Početni komplet za flotu
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktor operacija, Adriatic Adventure Tours
    location: Dubrovnik, Hrvatska
    content: Opremljeni smo cijelu flotu za najam s Paddle Board Overstock RIBs — 12 brodova na tri lokacije. Dvije sezone, bez kvarova. Dokumentacija CE certifikata učinila je odobrenje osiguranja jednostavnim. Njihov inženjerski tim čak je prilagodio boje gumenih cijevi.
    rating: 5
    product: Komplet za proširenje flote
    source: trust
  - category: rental
    name: Lt. Commander Andres Reyes
    title: Službenik za pomorsku nabavu, Filipska obalna straža
    location: Manila, Filipini
    content: Upravljamo s 24 Paddle Board Overstock RIBs unutar naše pokretne patrolne flote. Njihov QC proces je dosljedan za svaku seriju — ista kvaliteta šava, isto postavljanje ventila, isti tlak svaki put. Ta ponovljivost je bitna kad životi ovise o opremi.
    rating: 5
    product: RIB Patrolna flota
    source: trust
  - category: consumers
    name: Sarah K.
    title: Vlasnica SUP po prvi put
    location: Lake Tahoe, SAD
    content: Stabilan čak i za potpunog početnika. Izveo sam ga na jezero prvog dana i nikada nisam pao. Komplet s pumpom i veslom značio je da sam bio na vodi 20 minuta nakon otvaranja kutije.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Vlasnik Explorer 11
    location: Vancouver, Kanada
    content: Kao kupac po prvi put, bio sam nervozan zbog kvalitete narudžbe iz inozemstva. Dokumentacija ISO i izvještaji trećih strana koje su podijelili prije nego što sam uopće pitao dali su mi potpunu sigurnost. Daska je stigla za 6 dana i nadmašila moja očekivanja.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Rekreacijski kajakaš
    location: Florida, SAD
    content: Čvrsta kvaliteta izrade. Nosila se s obalnim valovima mnogo bolje nego što sam očekivao od napuhanog broda. Spakirao sam je u prtljažnik automobila za vikend putovanje — napuhana na rampi za manje od 4 minute.
    rating: 5
    product: Kajak na napuhavanje
