features3_solutions:
  tagline: Rješenja
  title: Vaša vodena avantura<br />Poslovni partner
  isBeforeContent: false
  columns: 3
  items:
    - title: Vodenih sportskih klubova
      description: Cjeloviti paketi opreme, prilagođeni brending i programi održavanja za SUP klubove, kajakaške klubove, škole surfanja i trening centre.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vodeni sportovi RIBs
      description: Specijalizirani RIBs za škole jedrenja, centre vodenih sportova i organizacije događanja. Trenerski brodovi, brodovi za vuču i brodovi za nadzor za profesionalne vodene sportove.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorti i hoteli
      description: Premium programi vodenih sportova s flotom opreme, sigurnosnim sustavima, obukom osoblja i upravljanjem prihodom za ugostiteljske objekte.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Poduzetnici s vodom kao brendom
      description: Privatna proizvodnja OEM/ODM s niskim MOQs, prilagođenim dizajnom proizvoda, pakiranjem i globalnom dostavom za vlasnike novih brendova.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Brodovi za ronilačke centre
      description: Stabilne RIB platforme s lakim ulazom/izlazom, spremištem za opremu i konfiguracijama motora optimiziranim za ronilačke operacije.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Spasilački i hitni plovni objekti
      description: Brzi RIBs i napuhavajući brodovi dizajnirani za potragu i spašavanje, hitne intervencije i obalnu stražu.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Rješenja za brodove superjacht
      description: Kompaktni, elegantni RIB tenderi koji nadopunjuju superjahte i rekreativne plovila. Jednostavno skladištenje, snažne performanse.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Rješenja za ribarske brodove
      description: Stabilni, izdržljivi napuhavajući brodovi i RIBs konfigurirani za komercijalni i rekreativni ribolov.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Oprema za pomorski turizam
      description: Flotom spremni napuhavajući čamci, SUP daske i kajaci za odmarališta, turističke operatore i tvrtke za najam vodenih sportova.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore energija RIBs
      description: Teški RIBs za podršku platformama za naftu i plin, prijenos posade za vjetroparkove, inspekciju podmorskih kabela i pomorsku konstrukciju.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Radni brodovi za akvakulturu
      description: Otpornost na koroziju RIBs za uzgoj ribe, uzgoj bisera i ocean ranching. Hypalon cijevi, oprema od nehrđajućeg čelika, trajnost za svakodnevnu uporabu.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Pomorsko istraživanje i snimanje
      description: Stabilni instrumentima spremni RIBs za oceanografska istraživanja, monitoriranje okoliša, uzorkovanje kvalitete vode i nastavne programe na sveučilištima.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komercijalni radni čamci
      description: Teški RIBs za patrolu, snimanje, transport i offshore logistiku. Izgrađeni za rigorozne zahtjeve komercijalnog poslovanja.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Niste sigurni koji put odgovara vašem poslovanju?
  subtitle: Recite nam o svojoj operaciji — preporučit ćemo pravi paket opreme, program brendiranja ili prilagođeno rješenje.
  actions:
    - variant: primary
      text: Zatražite besplatnu konzultaciju
      href: /contact
