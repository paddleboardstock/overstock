trustSignals:
  tagline: Signali povjerenja
  title: Zašto je Paddle Board Overstock pouzdan partner
  manufacturing:
    title: Proizvodni kapacitet
    body: Proizvodni pogon od 12.000 m² s 200-300 kvalificiranih radnika i 14+ R&D inženjera. ISO 9001 certificirani sustav upravljanja kvalitetom. Godišnja proizvodnja od 15.000 jedinica napuhljivih plovila koja služe 50+ zemalja.
    stats:
      - label: Veličina pogona
        value: 12,000 m²
      - label: Radna snaga
        value: 200-300
      - label: R&D Inženjeri
        value: 14+
      - label: Godišnji kapacitet
        value: 15,000
  quality:
    title: Obveza prema kvaliteti
    body: Od pregleda materijala do završnog testiranja, Paddle Board Overstock održava sustavne procese kontrole kvalitete kako bi isporučio pouzdane pomorske proizvode. Svaka jedinica prolazi testiranje tlaka, pregled šavova i provjeru performansi prije otpreme.
    items:
      - CE Certificirano — 64 modela udovoljava europskim sigurnosnim standardima
      - ISO 9001:2015 — Certificiran sustav upravljanja kvalitetom
      - UKCA Označeno — sukladnost za tržište Ujedinjenog Kraljevstva
  global:
    title: Globalna prisutnost
    body: Paddle Board Overstock opslužuje kupce na više globalnih tržišta, podržavajući distributere, outdoor brendove i profesionalne korisnike u 50+ zemalja u Europi, Azijsko-pacifičkom području, Americi, Bliskom istoku i Africi.
comparison:
  tagline: Pozicioniranje brenda
  title: Paddle Board Overstock na tržištu
  position: Inženjerski orijentiran proizvođač pomorskih uređaja koji kombinira stručnost u napuhavajućim plovilima s potpunom OEM/ODM sposobnošću, prilagođenim razvojem i 12+ godina iskustva u izvođenju proizvodnje za izvoz.
  strengths:
    - Stručnost u inženjeringu napuhanih plovila
    - Puna OEM/ODM proizvodna sposobnost
    - Razvoj i dizajn prilagođenih proizvoda
    - Proizvodni pogon površine 12.000 m² s certifikatom ISO
  bestFor:
    - Korisnici na otvorenom koji traže pouzdana napuhana plovila
    - Pomorski operateri kojima je potrebna oprema komercijalne kvalitete
    - Partneri brenda koji trebaju OEM/ODM proizvodnju
    - Profesionalne spasilačke i patrolne organizacije
