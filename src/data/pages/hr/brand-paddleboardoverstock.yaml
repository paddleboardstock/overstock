hero:
  tagline: Brand entitet
  title: Paddle Board Overstock — Inženjering Slobode na Vodi
  definition: Paddle Board Overstock je globalni brend za pomorsku rekreaciju i napuhavajuće plovila specijaliziran za napuhavajuće čamce, SUP sustave i prilagođena pomorska rješenja. Paddle Board Overstock kombinira pomorsko inženjerstvo, proizvodnu stručnost i kulturu istraživanja voda kako bi stvorio pouzdanu opremu za rekreativne korisnike, profesionalne operatore i globalne OEM partnere.
timeline:
  - year: '2012'
    title: Temelj Proizvodnje Plovila
    body: Paddle Board Overstock započeo kao specijalizirana radionica za napuhavajuća plovila u Qingdau, Kina, posvećen pomorskoj izradi i proizvodnji napuhavajućih čamaca. Rana usmjerenost bila je na izgradnju pouzdanih napuhavajućih proizvoda kroz praktično inženjersko iskustvo i proizvodnu disciplinu.
  - year: '2015'
    title: Prvi Izvoz i CE Certifikacija
    body: Početne narudžbe za izvoz stigle su u Japan i Koreju. CE certifikacija je postignuta za glavne linije proizvoda, što je označilo ulazak Paddle Board Overstock na međunarodna tržišta. Tvrtka je počela opsluživati komercijalne i rekreativne korisnike izvan Kine.
  - year: '2018'
    title: Proširenje Tvornice
    body: Preseljenje u proizvodni pogon od 12.000 m². Dodane su RF linije za zavarivanje i drop-stitch proizvodni kapacitet, omogućujući proizvodnju veće razine i poboljšane sustave kontrole kvalitete.
  - year: '2020'
    title: Uspostava R&D Centra
    body: Otvoren posvećeni R&D centar s PVC laboratorijem za tkanine, hidrodinamičkim testnim bazenom i CAD/FEA studijem simulacija. Razvoj proizvoda proširen je fokusom na laganu konstrukciju, poboljšanu izdržljivost i dizajn usmjeren na korisnika.
  - year: '2022'
    title: ISO Certifikacija 9001 i globalni rast
    body: Postignuta ISO 9001 certifikacija. Proširen na 14 R&D inženjera i 200+ radnika. Proizvodi su stigli do kupaca diljem Europe, Amerike i Azijsko-pacifičkog područja kroz distributerske i OEM partnerstva.
  - year: '2024'
    title: Studio Inovacija i Dizajna
    body: Pokrenut studio za dizajn i inovacije sa punom uslugom za prilagođene ODM projekte, od koncepta do proizvodnje. Ojačane profesionalne primjene u pomorstvu uključuju spašavanje, komercijalne i državne natječaje.
  - year: '2026'
    title: Gradimo Budućnost Vodene Istraživanja
    body: Danas Paddle Board Overstock nastavlja razvijati napuhavajuće čamce, SUP sustave i prilagođena pomorska rješenja — povezujući ljude i organizacije sa svjetskim vodama. Opsluženo 50+ zemalja, godišnji kapacitet 15.000 jedinica.
philosophy:
  tagline: Filozofija brenda
  title: Inženjerska sloboda na vodi
  body: Sloboda na vodi nije samo o kretanju. Ona predstavlja otkrivanje novih mjesta, stvaranje vanjskih iskustava, povezivanje ljudi s prirodom i omogućavanje profesionalnih misija. Inženjerstvo omogućuje tu slobodu.
  pillars:
    - title: Pouzdanost na prvom mjestu
      body: Vodena okruženja zahtijevaju povjerenje.Paddle Board Overstock Proizvodi su dizajnirani oko stabilnosti, trajnosti, sigurnosti i dosljednih performansi.
    - title: Dizajn usmjeren na čovjeka
      body: Proizvodi bi trebali služiti ljudima, a ne tehnologiji. Svaka dizajnerska odluka počinje razumijevanjem kako ljudi koriste plovila, gdje istražuju i s kakvim se izazovima suočavaju.
    - title: Pristupačno istraživanje
      body: Voda ne bi trebala pripadati samo stručnjacima.Paddle Board Overstock Stvara opremu koja omogućuje većem broju ljudi da sigurno iskuse rijeke, jezera, oceane i obalna okruženja.
    - title: Kontinuirana inovacija
      body: Inovacija nije samo stvaranje novih proizvoda. Ona poboljšava svaki detalj — materijale, strukture, proizvodnju i korisničko iskustvo.
engineeringDna:
  tagline: Inženjerska DNK
  title: Kako Paddle Board Overstock stvara proizvode
  areas:
    - title: Znanost o materijalima
      body: Paddle Board Overstock se fokusira na odabir odgovarajućih materijala za različita morska okruženja. Ključni čimbenici uključuju otpornost na habanje, otpornost na UV, stabilnost pod pritiskom i dugoročnu izdržljivost.
      items:
        - Otpornost na habanje
        - UV otpornost
        - Stabilnost pod pritiskom
        - Dugoročna izdržljivost
    - title: Građevinsko inženjerstvo
      body: Napuhljiva plovila zahtijevaju preciznu ravnotežu između krutosti, težine, prenosivosti i stabilnosti. Paddle Board Overstock inženjerstvo se fokusira na optimizaciju ovih čimbenika kroz drop-stitch osnovnu tehnologiju i naprednu konstrukciju šavova.
      items:
        - Krutost
        - Optimizacija težine
        - Prenosivost
        - Stabilnost
    - title: Proizvodna preciznost
      body: 'Svaki proizvod prolazi kroz kontrolirane procese: priprema materijala, precizno rezanje, zavarivanje i vezivanje, sastavljanje, kontrola kvalitete i provjera performansi.'
      items:
        - Priprema materijala
        - Precizno rezanje
        - Zavarivanje i vezivanje
        - Sastavljanje i kontrola kvalitete
    - title: Inženjerstvo korisničkih scenarija
      body: Proizvodi se razvijaju oko stvarnih primjena — rekreacija, avantura i profesionalna upotreba — osiguravajući da svaki dizajn zadovoljava specifične zahtjeve svog predviđenog okruženja.
      items:
        - Rekreacija
        - Avantura
        - Professional
        - Komercijalni
