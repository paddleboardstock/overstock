hero:
  tagline: Proces
  title: Proizvodni proces
  subtitle: Od sirovine do broda spremnog za plovidbu — svaki korak pod našom kontrolom
  back_label: Natrag u tvornicu
  back_link: /factory
intro: Za razliku od brendova koji proizvodnju prepuštaju tvornicama trećih strana, Aquafarer posjeduju i upravljaju cijelim proizvodnim lancem. Ova vertikalna integracija omogućuje nam održavanje stroge kontrole kvalitete u svakoj fazi, brz odgovor na prilagođene zahtjeve i isporuku dosljedne kvalitete proizvoda iz serije u seriju. Evo kako se čamac gradi u našem pogonu.
steps:
  - step: '01'
    title: Primitak materijala i inspekcija
    description: Svaka pristigla serija PVC tkanine, staklenih vlakana, smole i opreme pregledava se prema specifikacijama. Uzorci tkanine testiraju se na vlačnu čvrstoću, ujednačenost debljine i UV otpornost prije puštanja u proizvodnju. Materijali koji nisu u skladu s pravilima stavljaju se u karantenu i vraćaju.
    duration: 1–2 dana
  - step: '02'
    title: PVC Automatsko rezanje
    description: Odobrene tkanine polažu se na CNC automatski stroj za rezanje i režu s preciznošću ispod milimetra. Računalno optimizirano gniježđenje slaže panele kako bi se smanjio otpad — obično ispod 5%. Izrezani paneli označavaju se prema modelu broda i komori, a zatim se pakiraju za prijenos u zavarivačku radionicu.
    duration: 2–4 sata po kompletu broda
  - step: '03'
    title: Toplinsko brtvljenje i zavarivanje cijevi
    description: Paneli se pričvršćuju i lijepe pomoću strojeva za toplinsko brtvljenje s vrućim zrakom na kontroliranim temperaturama od 200–600 °C. Glavni spojevi ojačani su RF dielektričnim zavarivanjem za nepropusne, visokootporne spojeve. Gotove komore napuhuju se na radni tlak od 1,25× za 30-minutnu validaciju zadržavanja zraka.
    duration: 1–2 dana po brodu
  - step: '04'
    title: RIB Oblikovanje trupa od stakloplastike
    description: RIB Trupovi brodova izrađuju se ručno polaganim stakloplastičnim kalupima. Slojevi staklenih vlakana i tkanih rovova ručno se valjaju poliesterskom ili vinilesterskom smolom u preciznim kalupima. Svaki sloj se vakuumski pakira radi dosljedne kvalitete laminata. Trup je završen gelcoatom za UVvisokosjajnu, otpornu morsku površinu.
    duration: 2–4 dana po trupu
  - step: '05'
    title: SUP Tisak i dekoracija
    description: SUP Grafike na pločama nanose se digitalnim tiskom za dizajne pune kolor fotografije i sitotiskom za trajne logotipe i ponavljajuće uzorke. Otisci se očvrsavaju i brtve radi UV otpornosti na habanje.
    duration: 1–2 dana
  - step: '06'
    title: Završno sastavljanje i opremanje
    description: Trupovi i sklopovi cijevi od stakloplastike PVC spajaju se na proizvodnoj liniji. Motor je montiran, upravljačke i upravljačke kontrole su povezane, sustav goriva je ugrađen, a cijeli električni snop je ožičen. Svaki brod slijedi kontrolni popis od 100 točaka sklapanja s obaveznim potpisivanjem u svakoj fazi.
    duration: 2–3 dana
  - step: '07'
    title: Kontrola kvalitete i inspekcija
    description: 'Svaki dovršeni brod prolazi obaveznu kontrolu kvalitete: test zadržavanja zraka u komori, provjeru funkcionalnosti sustava, provjeru momenta pričvršćivača i kozmetički pregled. Prilagođene i prototipne konstrukcije također prolaze pomorske testove koji pokrivaju brzinu, upravljivost, stabilnost i izdržljivost.'
    duration: 1–2 dana
  - step: '08'
    title: Pakiranje i otprema
    description: Brodovi se ispušuju, presavijaju prema postupku, pakiraju u čvrste tkaninske vreće ili sanduke od šperploče i utovaraju za otpremu. Svaki paket označen je modelom, serijskim brojem i odredištem. Koordiniramo s špediterima za FCL i LCL kontejnerske pošiljke širom svijeta.
    duration: 1 dan
