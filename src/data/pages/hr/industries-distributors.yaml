content_segments:
  tagline: Profili partnera
  title: Modeli partnerske distribucije<br />Prema vrsti partnera
  subtitle: Različiti distributeri donose različite prednosti za plasman na tržište — regionalnu infrastrukturu, doseg e-trgovine, specijaliziranu maloprodaju ili portfelj više marki. Strukturiramo uvjete partnerstva, nivoe cijena i razinu podrške kako bi odgovarali svakom profilu partnera.
  items:
    - title: Regionalni distributeri za pomorsku opremu
      subtitle: Distribucija ekskluzivna za teritorij B2B
      description: Uspostavljeni distributeri s infrastrukturom skladišta, mrežom distributera i logističkim sposobnostima koji opslužuju pomorske distributere, maloprodaje sportova na vodi i operatore najma unutar određenog geografskog područja. Potrebna vam je cjelokupna linija proizvoda, zaštićene cijene i sposobnost servisiranja računa distributera s lokalnim zalihama i podrškom.
      features:
        - Zaštita ekskluzivnog teritorija uz minimalne uvjete obveze
        - Veleprodajne cijene u punom katalogu s tromjesečnim povratima volumena
        - Lokalni program konsignacije zaliha za brze SKU-ove
        - Obuka za mrežu prodavača i programi zajedničkog brendiranja
    - title: E-trgovina i online trgovci
      subtitle: Distribucijski kanali usmjereni na digitalno
      description: Online trgovci koji prodaju opremu za vodene sportove putem Amazona, eBaya ili vlastitih e-commerce platformi. Brzina izlaska na tržište, konkurentne cijene i logistika izravno potrošačima su ključni. Trebate partnera koji može isporučiti pojedinačne narudžbe pod vašim brendom uz brzu isporuku i bez rizika od zaliha.
      features:
        - 'Drop-ship program: ispunjavanje izravno u tvornici s vašim brendiranjem'
        - API feed za inventar u stvarnom vremenu za vašu e-commerce platformu
        - Integracija s Amazon Seller Centralom EANs /UPC podrškom
        - Logistika povrata i obrada jamstvenih zahtjeva uključuju
    - title: Specijalizirani prodavači vodenih sportova
      subtitle: Partneri u fizičkim salonima
      description: Fizičke maloprodajne trgovine specijalizirane za opremu za vodene sportove — koje služe lokalnim veslačima, ribolovcima i nautičarima prodajom uživo, demonstracijama i postprodajnom uslugom. Potrebna vam je ambalaža optimizirana za maloprodaju, programi demonstracijskih jedinica i materijali za prodajna mjesta koji privlače kupce bez najave.
      features:
        - 'Program demo jedinica: snižene izložbene ploče u salonu'
        - Pakiranje spremno za maloprodaju s dizajnom kutije optimiziranim za policu
        - Izlošci na prodajnim mjestima, usporedne tablice i vodiči za kupce
        - Program obuke i certifikacije osoblja u trgovini
    - title: Distributeri s više brendova i robnih kuća
      subtitle: Široka distribucija sportske opreme
      description: Veliki distributeri koji opslužuju robne kuće, velike maloprodajne lance i lance sportske opreme s katalogima s više marki. Dosljednost, dokumentacija usklađenosti i usklađenost dobavljača su od presudne važnosti — svaki SKU mora zadovoljiti specifične standarde pakiranja, označavanja i kvalitete za trgovca.
      features:
        - 'Dokumentacija usklađenosti trgovaca: specifikacija pakiranja, barkod, označavanje'
        - EDI/ASN integracija za sustave naručivanja kod velikih trgovaca
        - Inventar i programi automatskog obnavljanja zaliha kojima upravljaju dobavljači
        - Posvećeno upravljanje računima s 24-satnim SLA-om za odgovor
