testimonial:
  quote: Ono što Aquafarer izdvaja je njihova znanost o materijalima. Oni ne sastavljaju samo komponente — oni sami inženjerski razvijaju PVC spojeve, parametre zavarivanja i strukturni sloj. Ta vertikalna integracija vidi se u konačnom proizvodu.
  author: David Park
  title: Voditelj razvoja proizvoda
  company: Bluewater Sports Equipment
  location: Australija
sections:
  - title: Drop-stitch jezgra
    standard: 12-15 PSI radni tlak
    description: Tisuće unutarnjih poliesterskih niti povezuju gornje i donje slojeve, stvarajući krutu strukturu pri 12-15 PSI. To je ista tehnologija koja se koristi u profesionalnim paddle boardovima i napuhavajućim natjecateljskim čamcima. Naša drop-stitch gustoća optimizirana je po modelu za idealnu ravnotežu između krutosti i težine.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS Shema jezgre
  - title: Pomorski razred PVC
    standard: Spajano zavarivanjem | UV / slana voda / testirana otpornost na habanje
    description: Višeslojna laminirana PVC tkanina ocijenjena za pomorska okruženja. Svaki sloj je spajan zavarivanjem umjesto ljepilom, eliminirajući rizik od delaminacije. Testirano na otpornost UV (ASTM G154, 1.000+ sati), koroziju od slane vode (ISO 9227) i habanje (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC sloj
  - title: Hypalon cijevi
    standard: CSM guma | UV / kemijska / otpornost na ekstremne temperature
    description: Koristi se na RIB modelima, Hypalon (CSM) guma pruža superiornu UV i kemijsku otpornost u usporedbi sa standardnom PVC. Hypalon cijevi zadržavaju fleksibilnost u ekstremnim temperaturama i odolijevaju degradaciji od izlaganja gorivu i ulju. Svi spojevi ručno postavljaju certificirani tehničari.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Podni zračni pokrov
    standard: Visokotlačni napuhavajući | Zamjenjuje šperploču/aluminij
    description: Visokotlačni napuhavajući sustav poda koji zamjenjuje tradicionalne podove od šperploče ili aluminijskih letvica. Smanjuje vrijeme postavljanja, ukupnu težinu i volumen skladištenja, pružajući odgovarajuću krutost za stajanje, ribolov i hodanje. Testirano da podržava raspoređeno opterećenje od 200 kg.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Zračni pod
