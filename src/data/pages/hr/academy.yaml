hero:
  tagline: Aquafarer Akademija
  title: Centar za učenje
  subtitle: Vodiči i tutorijali za svaku razinu vještine — od SUP osnova do naprednih tehnika spašavanja
categories:
  - level: Početnik
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Osnove
        desc: Naučite osnove stand-up paddleboardinga — stav, tehniku zaveslaja i ravnotežu.
        slug: beginner-sup-guide
      - title: Tehnike veslanja
        desc: Zaveslaj naprijed, zaveslaj u zavoju, zaveslaj za povlačenje i niski oslonac — savladajte osnovne pokrete veslom.
        slug: sup-paddle-guide
      - title: Sigurnost na prvom mjestu
        desc: Osnovne sigurnosne prakse uključuju provjeru vremena, PFD upotrebu, pravila za povodac i samopomoć.
        slug: sup-safety-guide
  - level: Srednji
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Osnove turinga
        desc: Planiranje višesatnog veslanja — navigacija, hidratacija, tempo i čitanje vremenske prognoze vjetra.
        slug: touring-sup-guide
      - title: Čitanje vremena
        desc: Tumačenje pomorskih prognoza, prepoznavanje oblaka i razumijevanje utjecaja vjetra na vodu.
        slug: weather-planning-water-sports
      - title: Osnove navigacije
        desc: Čitanje karata, upotreba kompasa, GPS prijelaznih točaka i planiranje ruta za obalno veslanje.
        slug: sup-navigation-guide
      - title: Svijest o plimi i oseci
        desc: Razumijevanje ciklusa plime, struja i kako utječu na vrijeme lansiranja i planiranje rute.
        slug: understanding-tides
  - level: Napredno
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planiranje višednevnih izleta
        desc: Logistika ekspedicije — odabir opreme, planiranje hrane, sigurnosni protokoli i kontakti u hitnim slučajevima.
        slug: sup-travel-guide
      - title: Tehnike spašavanja
        desc: Samopomoć, T-spašavanje, Eskimsko spašavanje za kajake i protokoli vuče na otvorenoj vodi.
        slug: sup-self-rescue
      - title: Noćno veslanje
        desc: Navigacija nakon mraka — zahtjevi za osvjetljenjem, pamćenje rute, komunikacija u grupi i svijest o opasnostima.
        slug: sup-navigation-guide
  - level: Održavanje
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Čišćenje i održavanje
        desc: Ispiranje slatkom vodom, UV zaštita, prevencija plijesni i pravilne tehnike sušenja nakon svake sesije.
        slug: inflatable-sup-maintenance
      - title: Vodič za pohranu
        desc: Najbolje prakse za pohranu napuhanih dasaka i čamaca — ispuhivanje, savijanje, kontrola temperature i vijek trajanja.
        slug: inflatable-sup-storage
      - title: Osnove popravka
        desc: Popravite male probušene dijelove, curenje šavova i probleme s ventilom pomoću PVC kompleta za popravak i tehnika ljepljenja.
        slug: inflatable-sup-repair
      - title: Održavanje ventila
        desc: Prepoznajte vrste ventila (Halkey-Roberts, Boston, Leafield), očistite nečistoće i zamijenite oštećene stabljike.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centar znanja
knowledge_center_title: Vodiči za pomorsku opremu i industriju
knowledge_center_subtitle: Stručno znanje i vodiči za kupnju za pomorske profesionalce, operatore flote i ljubitelje vodenih sportova.
knowledge_sections:
  - title: RIB Znanje o čamcu
    tagline: Vodiči za krute napuhavajuće čamce
    desc: Sve o RIB čamcima — dizajn trupa, materijali, izbor motora, održavanje i savjeti za kupnju za komercijalnu i rekreativnu upotrebu.
    guides:
      - title: Kako odabrati pravi RIB čamac
        desc: Potpuni vodič za odabir RIB — veličina, snaga motora, materijal cijevi, tip trupa i namjena.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs napuhavajući čamac
        desc: Kruti napuhavajući čamac vs tradicionalni napuhavajući čamac — usporedba dizajna trupa, performansi, trajnosti i kapaciteta.
        href: /compare/rib-vs-dinghy
      - title: Komercijalno RIB nasuprot rekreativnom RIB
        desc: Komercijalni vs rekreativni RIB čamci — standardi izrade, materijali, životni vijek, cijena i certifikati.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminijski vs stakloplastični trup
        desc: Usporedba aluminijskih i stakloplastičnih trupova za RIB čamce po težini, cijeni, trajnosti i otpornosti na koroziju.
        href: /compare/aluminum-vs-fiberglass
  - title: Vodič za napuhavajuće čamce
    tagline: Znanje o napuhavajućim plovilima
    desc: Sveobuhvatni vodiči o napuhavajućim čamcima — PVC vs Hypalon, metode izrade, sigurnosni standardi i najbolje prakse održavanja.
    guides:
      - title: Vodič za materijale PVC vs Hypalon
        desc: Definitivna usporedba između PVC i Hypalon CSM za izradu napuhavajućih čamaca.
        href: /compare/pvc-vs-hypalon
      - title: Kako se izrađuju napuhavajući čamci
        desc: Proces proizvodnje — rezanje materijala, HF zavarivanje, izrada šavova, testiranje tlaka i kontrola kvalitete.
        href: /learn/inflatable-technology
      - title: Vodič za sigurnost napuhavajućih čamaca
        desc: Sigurnosni standardi, nosivost, pravilno napuhivanje, provjera prije polaska i hitne procedure.
        href: /learn/water-safety
      - title: Održavanje napuhavajućih čamaca
        desc: Čišćenje, pohrana, UV zaštita, zimovanje i popravak napuhavajućih čamaca i RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Znanje o čamcima
    tagline: Naduvani čamac i RIB Hub
    desc: Tehnički vodiči koji pokrivaju vrste napuhanih čamaca, materijale, metode izrade, održavanje i sigurnost — od čamaca do RIBs.
    guides:
      - title: Vrste napuhanih čamaca
        desc: Čamci, RIBs, kajaci i pomoćni čamci — naučite razlike i odaberite pravi.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Tehnologija
        desc: Kako tisuće unutarnjih niti stvaraju krute, visokotlačne napuhane strukture.
        href: /learn/drop-stitch-core
      - title: Referenca materijala
        desc: PVC denier ocjene, težine tkanina, UV otpornost i materijali morske kvalitete objašnjeni.
        href: /learn/materials
      - title: RIB protiv gumenjaka
        desc: Usporedite krute napuhane čamce s tradicionalnim napuhanima za različite slučajeve upotrebe.
        href: /compare/rib-vs-dinghy
  - title: SUP Znanje
    tagline: Vodiči za Stand-Up Paddleboard
    desc: Sve o SUP daskama — napuhane vs krute, dimenzije daske, tehnologija materijala i stručni savjeti za sve razine vještine.
    guides:
      - title: Napuhano vs Kruto SUP
        desc: Usporedite iSUP-ove i krute epoksidne daske po prenosivosti, izdržljivosti, performansama i vrijednosti.
        href: /learn/sup
      - title: Vodič za dimenzije SUP daske
        desc: Kako duljina, širina i debljina utječu na stabilnost, brzinu i upravljivost.
        href: /learn/sup
      - title: Održavanje & briga SUP
        desc: Čišćenje, skladištenje, zaštita UV i savjeti za popravak napuhanih SUP dasaka.
        href: /v2/inflatable-sup-maintenance
      - title: Odabir prve SUP
        desc: Vodič za početnike u odabiru prave stand-up paddleboard daske prema vašoj težini, razini vještine i predviđenoj upotrebi.
        href: /learn/sup
  - title: Vodič za ronilačku opremu
    tagline: Znanje o komercijalnim ronilačkim čamcima
    desc: Specijalizirani vodiči o ronilačkim čamcima, ronilačkim RIBs i opremi za ronilačke centre, operatore i komercijalne ronilačke timove.
    guides:
      - title: Najbolji RIB čamac za ronilačke centre
        desc: Kako odabrati pravi ronilački RIB za vaš ronilački centar — kapacitet, konfiguracija i budžet.
        href: /solutions-diving-center-boats
      - title: Vodič za konfiguraciju ronilačkog RIB
        desc: Osnovne značajke za ronilački RIBs — nosači boca, ljestve, ronilačka platforma i skladištenje opreme.
        href: /solutions-diving-center-boats
  - title: Vodič za pomoćni čamac za jahte
    tagline: Superjahte i Rješenja za Pomoćne Brodice
    desc: Vodiči za odabir savršene pomoćne jahte — gumene pomoćne brodice, RIB pomoćne brodice, rješenja za pohranu i dodaci za pomoćne brodice.
    guides:
      - title: Kako odabrati pomoćnu jahte
        desc: Čimbenici koje treba uzeti u obzir pri odabiru pomoćne brodice za vašu jahtu — veličina, materijal, motor i pohrana.
        href: /solutions-yacht-tender-solutions
      - title: Gumene nasuprot RIB pomoćne brodice
        desc: Usporedba gumenih pomoćnih čamaca s rigidnim napuhavajućim brodicama po pitanju performansi, izdržljivosti i mogućnosti pohrane.
        href: /compare/rib-vs-dinghy
  - title: Vodič za spasilačku opremu
    tagline: Znanje o plovilima za potragu i spašavanje
    desc: Profesionalni vodiči o spašavačkim brodicama, SAR plovilima i opremi za hitne intervencije za Obalnu stražu, spasioca i timove za pomoć u katastrofama.
    guides:
      - title: Vodič za odabir SAR broda
        desc: Kako odabrati pravi brod za potragu i spašavanje — brzina, kapacitet, izdržljivost i posebni zahtjevi opreme.
        href: /solutions-rescue-watercraft
      - title: Komercijalni RIB za spasilačke operacije
        desc: Zašto su komercijalnog razreda RIBs preferirani izbor profesionalnih timova za potragu i spašavanje širom svijeta.
        href: /use-cases/search-and-rescue
