tests:
  - title: Testiranje tlaka
    standard: ISO 6185-1 | Interna specifikacija AF-PT-001
    description: Napuhavajuće komore su pod tlakom od 1,25 puta od preporučene radne granice i držane 30 minuta. Smanjenje tlaka mjeri se radi provjere nepropusnosti i strukturne čvrstoće materijala i spojeva.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Ispitivanje udarcem
    standard: Interna specifikacija AF-IT-002
    description: Proizvodi su izloženi kontroliranim udarcima standardiziranih padajućih utega i njihala. Ovo procjenjuje otpornost na probijanje, širenje kidanja i strukturnu otpornost na prepreke, pristaništa i otpad.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Testiranje otpornosti
    standard: ASTM G154 |ISO 4892-3
    description: Uzorci materijala izlagani su UVA-340 lampama u komorama za ubrzano vremensko djelovanje tijekom 1.000+ sati. Mjerimo promjenu boje (Delta E), zadržavanje sjaja i gubitak vlačne čvrstoće kako bismo potvrdili UV pakete stabilizatora.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Testiranje otpornosti na habanje
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Uzorci materijala podvrgavaju se CS-10 abrazivnim kotačima pod opterećenjem od 500g/1.000g tijekom 1.000 ciklusa. Gubitak mase i vizualno trošenje određuju izdržljivost premaza protiv pijeska, šljunka i ponovljenog lansiranja.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Testiranje performansi na niskim temperaturama
    standard: Interna specifikacija AF-LT-003 | MIL-STD-810G
    description: Sastavljeni proizvodi i materijali se kondicioniraju na -20°C, -10°C i 0°C tijekom 24 sata, a zatim se testiraju fleksibilno. To provjeravamo PVC i Hypalon ostajemo fleksibilni bez pucanja ili delaminacije.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Ispitivanje uzgona i nosivosti
    standard: ISO 6185-1 |ISO 12402
    description: Proizvodi se postupno pune do 1,25x nazivnog kapaciteta u kontroliranom bazenu. Bilježe se performanse slobodnog boka, stabilnosti i samoispuštanja. Kapacitet svakog modela matematički i empirijski se provjerava.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Testiranje manevarskih sposobnosti
    standard: Interna specifikacija AF-MT-004
    description: Ispitivanja na vodi mjere radijus okretanja, ubrzanje, vrijeme planiranja i odziv vesla/motora u različitim uvjetima opterećenja. Karakteristike upravljanja u stvarnom svijetu potvrđuju se prema projektiranim ciljevima.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Ispitivanje vodonepropusnosti
    standard: ISO 6185-1 §7.3 | Interna specifikacija AF-WT-005
    description: Svaki sastavljeni proizvod testira se prskanjem na 0,5 bara na svim spojevima, ventilima i spojnicama. 5-minutni test pod tlakom potvrđuje vodonepropusnost komore i ventila. Standard bez curenja prije transporta.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
