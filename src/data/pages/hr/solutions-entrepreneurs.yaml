testimonial:
  content: Pokrenuo sam svoj SUP brand bez ikakvog iskustva u industriji. Tim Paddle Board Overstock me vodio od odabira proizvoda do dizajna prilagođenog logotipa i pakiranja. Moj prvi kontejner stigao je za 11 tjedana, a sve sam prodao za 3 mjeseca na Amazonu. Sada naručujem svoj treći kontejner.
  name: Michael Park
  title: Osnivač, Shoreline Paddle Co. — Kalifornija, SAD
content_segments:
  tagline: Profili Poduzetnika
  title: Pokretanje Branda Sportske Opreme za Vodene Sportove<br />Prema Vrsti Poduzetnika
  subtitle: Različiti osnivači dolaze s različitim snagama — stručnost u e-trgovini, industrijske veze, doseg sadržaja ili distribucijska infrastruktura. Program pokretanja OEM/ODM prilagođavamo vašoj početnoj poziciji i ambicijama rasta.
  items:
    - title: Amazon FBA & Prodavači E-Trgovine
      subtitle: Brand builderi vođeni podacima, brzi u skaliranju
      description: Iskusni online prodavači koji pokreću proizvode za vodene sportove na Amazonu, Walmartu ili vlastitim Shopify trgovinama. Znate kako optimizirati oglase, upravljati PPC-om i čitati podatke kategorije — ali trebate proizvodnog partnera koji razumije brzinu e-trgovine, stope povratka i sezonske promjene potražnje.
      features:
        - Pakiranje spremno za maloprodaju optimizirano za FBA ograničenja dimenzija
        - EAN/UPC generiranje barkoda i dokumentacija u skladu s Amazonom
        - Niska MOQ (2–5 jedinica po RIB SKU, 5–10 po SUP) za testiranje potražnje prije skaliranja
        - Konsolidacija mješovitog kontejnera za optimizaciju po jedinici troška na odredištu
    - title: Influenceri za fitness i vanjski životni stil
      subtitle: Kreatori brendova usmjereni na publiku
      description: Kreatori sadržaja, fitness treneri i outdoor osobe s angažiranom publikom spremnom za prihvaćanje lifestyle brenda. Vi donosite zajednicu i priču brenda — mi se brinemo o proizvodnom inženjeringu, usklađenosti, pakiranju i logistici kako biste se vi mogli fokusirati na sadržaj i konverziju.
      features:
        - 'Brzo prilagođeno brendiranje: 2-tjedni ciklus uzorka s logom + bojama'
        - Ko-brendirane limitirane serije i sezonska lansiranja boja
        - Podrška za lifestyle fotografiju i video produkciju
        - 'Isporuka izravno potrošaču: tvornica → isporuka kupcu'
    - title: Regionalni distributeri koji idu izravno potrošaču
      subtitle: B2B operateri koji pokreću vlastiti brend
      description: Uspješni distributeri pomorske ili outdoor opreme koji žele lansirati vlastiti brend uz ili umjesto preprodaje proizvoda trećih strana. Već imate skladišnu infrastrukturu, logističke veze i bazu kupaca — trebate partnera u tvornici koji može isporučiti privatnu kvalitetu na velikoj skali.
      features:
        - Ekskluzivni dizajni proizvoda za vaše tržišno područje
        - Kompletan OEM razvoj kalupa za vlasite oblike i specifikacije
        - Lokalizirana dokumentacija za usklađenost (CE, UKCA, USCG) za vašu regiju
        - 'Ko-brendirano pakiranje: distributerski brend + Paddle Board Overstock mark kvalitete'
    - title: Osnivači brenda po prvi put
      subtitle: Vođeno kreiranje brenda od početka do kraja
      description: Strastveni poduzetnici bez ikakvog iskustva u industriji vodenih sportova koji žele izgraditi brend od nule. Trebate partnera koji će vas voditi kroz svaki korak — od odabira proizvoda i imenovanja do dizajna pakiranja i logistike prve pošiljke — s jasnim vremenskim okvirima i transparentnim cijenama.
      features:
        - Konzultativni odabir proizvoda iz 50 + provjerenih osnovnih dizajna
        - 'Paket identiteta brenda: imenovanje, logo, paleta boja, dizajn pakiranja'
        - Rok od 60–90 dana od koncepta do prve pošiljke
        - Posvećeni voditelj projekta za vlasnike brenda po prvi put
