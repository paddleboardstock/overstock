timeline:
  - year: '2012'
    title: Temelj Proizvodnje Plovila
    body: Aquafarer započeo kao specijalizirana radionica za napuhavajuća plovila u Qingdau, Kina, posvećen pomorskoj izradi i proizvodnji napuhavajućih čamaca. Rana usmjerenost bila je na izgradnju pouzdanih napuhavajućih proizvoda kroz praktično inženjersko iskustvo i proizvodnu disciplinu.
  - year: '2015'
    title: Prvi Izvoz i CE Certifikacija
    body: Početne narudžbe za izvoz stigle su u Japan i Koreju. CE certifikacija je postignuta za glavne linije proizvoda, što je označilo ulazak Aquafarer na međunarodna tržišta. Tvrtka je počela opsluživati komercijalne i rekreativne korisnike izvan Kine.
  - year: '2018'
    title: Proširenje Tvornice
    body: Preseljenje u proizvodni pogon od 12.000 m². Dodane su RF linije za zavarivanje i drop-stitch proizvodni kapacitet, omogućujući proizvodnju veće razine i poboljšane sustave kontrole kvalitete.
  - year: '2020'
    title: Uspostava R&D Centra
    body: Otvoren posvećeni R&D centar s PVC laboratorijem za tkanine, hidrodinamičkim testnim bazenom i CAD/FEA studijem simulacija. Razvoj proizvoda proširen je fokusom na laganu konstrukciju, poboljšanu izdržljivost i dizajn usmjeren na korisnika.
  - year: '2022'
    title: Certifikacija i Globalni Rast
    body: Postignuta ISO 9001 certifikacija. Proširen na 14 R&D inženjera i 200+ radnika. Proizvodi su stigli do kupaca diljem Europe, Amerike i Azijsko-pacifičkog područja kroz distributerske i OEM partnerstva.
  - year: '2024'
    title: Studio Inovacija i Dizajna
    body: Pokrenut studio za dizajn i inovacije sa punom uslugom za prilagođene ODM projekte, od koncepta do proizvodnje. Ojačane profesionalne primjene u pomorstvu uključuju spašavanje, komercijalne i državne natječaje.
  - year: '2026'
    title: Gradimo Budućnost Vodene Istraživanja
    body: Danas Aquafarer nastavlja razvijati napuhavajuće čamce, SUP sustave i prilagođena pomorska rješenja — povezujući ljude i organizacije sa svjetskim vodama. Opsluženo 50+ zemalja, godišnji kapacitet 15.000 jedinica.
content_founding:
  tagline: Početak
  title: Rođeni na Obali
  subtitle: 'Aquafarer započeo je u radionici na obali u Qingdau s jednim čamcem i vizijom: graditi napuhavajuća plovila koja mogu izdržati stvarne pomorske uvjete.'
  paragraphs:
    - Godine 2012. naši osnivači vidjeli su prazninu na tržištu — većina napuhavajućih čamaca bila je ili pristupačna, ali nepouzdana, ili vrhunske kvalitete, ali izuzetno skupa. Vjerovali su da postoji prostor za proizvođača koji isporučuje i kvalitetu i vrijednost.
    - Prvi trup izrađen je ručno, testiran u lokalnim vodama i usavršen na temelju stvarnih povratnih informacija ribara i malih komercijalnih operatera. Ta povratna sprega — graditi, testirati, slušati, poboljšavati — i dalje je u središtu naše inženjerske filozofije danas.
    - Do 2015. vijest se proširila izvan Qingdaoa. Međunarodni distributeri počeli su tražiti uzorke. Ono što je započelo kao lokalna radionica postajalo je globalni dobavljač.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Rana proizvodna radionica i proizvodnja
content_growth:
  tagline: Rast i inovacije
  title: Od radionice do objekta od 12.000 m²
  subtitle: Kontinuirana ulaganja u ljude, opremu i procese pretvorila su se Aquafarer u moderan brodski proizvodni pogon.
  paragraphs:
    - Kako je potražnja rasla, rasla je i naša tvornica. Proširili smo se s male radionice na tvornicu od 12.000 m² s namjenskim proizvodnim linijama za RIB brodove, napuhivačke, SUP daske i dodatke.
    - Uložili smo CNC u strojeve za rezanje, opremu za visokofrekventno zavarivanje, proizvodne linije za drop stitch i sveobuhvatne testne uređaje — što nam omogućuje kontrolu nad svakim aspektom kvalitete proizvodnje.
    - Danas naš tim od 200-300 ljudi uključuje pomorske inženjere, znanstvenike za materijale, stručnjake za kontrolu kvalitete i vješte majstore — od kojih su mnogi s nama Aquafarer od samih početaka.
founder:
  tagline: Upoznajte osnivača
  title: Izgrađen od strane Watermana
  subtitle: Osnivač David Chen spaja stručnost u proizvodnji i doživotnu strast prema vodenim sportovima — kombinacija koja definira Aquafarer pristup razvoju proizvoda.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Osnivač Aquafarer
  story:
    - David Chen odrastao je na obali Qingdaoa, gdje more nije bilo odredište za odmor, već način života. Mladost je proveo kajakaš, jedrivši i pecajući u Žutom moru — iskustva koja su mu dala intuitivno razumijevanje što plovila moraju izdržati.
    - Prije osnivanjaAquafarer, David je proveo desetljeće u pomorskoj proizvodnji, radeći u proizvodnji, kvaliteti i međunarodnoj trgovini. Upravljao OEM je programima za europske i sjevernoameričke brendove, učeći standarde i očekivanja globalnih tržišta iz prve ruke.
    - 'Godine 2012. osnovao je Aquafarer s jednostavnom misijom: izgraditi napuhavajuće plovilo koje bi povjerio svojoj obitelji na vodi. Taj osobni standard — bih li ga koristio? — ostaje konačni test za svaki proizvod koji napusti tvornicu.'
    - Danas David vodi strategiju proizvoda i nadzire R&D tim, osobno pregledavajući nove dizajne i testirajući prototipove na vodama Qingdaoa. Vjeruje da izvrsni proizvodi nastaju razumijevanjem i inženjerstva i iskustva.
philosophy:
  tagline: Filozofija brenda
  title: Inženjerska sloboda na vodi
  body: Sloboda na vodi nije samo o kretanju. Ona predstavlja otkrivanje novih mjesta, stvaranje vanjskih iskustava, povezivanje ljudi s prirodom i omogućavanje profesionalnih misija. Inženjerstvo omogućuje tu slobodu.
  pillars:
    - title: Pouzdanost na prvom mjestu
      body: Vodena okruženja zahtijevaju povjerenje.Aquafarer Proizvodi su dizajnirani oko stabilnosti, trajnosti, sigurnosti i dosljednih performansi.
    - title: Dizajn usmjeren na čovjeka
      body: Proizvodi bi trebali služiti ljudima, a ne tehnologiji. Svaka dizajnerska odluka počinje razumijevanjem kako ljudi koriste plovila, gdje istražuju i s kakvim se izazovima suočavaju.
    - title: Pristupačno istraživanje
      body: Voda ne bi trebala pripadati samo stručnjacima.Aquafarer Stvara opremu koja omogućuje većem broju ljudi da sigurno iskuse rijeke, jezera, oceane i obalna okruženja.
    - title: Kontinuirana inovacija
      body: Inovacija nije samo stvaranje novih proizvoda. Ona poboljšava svaki detalj — materijale, strukture, proizvodnju i korisničko iskustvo.
engineeringDna:
  tagline: Inženjerska DNK
  title: Kako Aquafarer stvara proizvode
  areas:
    - title: Znanost o materijalima
      body: Aquafarer se fokusira na odabir odgovarajućih materijala za različita morska okruženja. Ključni čimbenici uključuju otpornost na habanje, otpornost na UV, stabilnost pod pritiskom i dugoročnu izdržljivost.
      items:
        - Otpornost na habanje
        - UV otpornost
        - Stabilnost pod pritiskom
        - Dugoročna izdržljivost
    - title: Građevinsko inženjerstvo
      body: Napuhljiva plovila zahtijevaju preciznu ravnotežu između krutosti, težine, prenosivosti i stabilnosti. Aquafarer inženjerstvo se fokusira na optimizaciju ovih čimbenika kroz drop-stitch osnovnu tehnologiju i naprednu konstrukciju šavova.
      items:
        - Krutost
        - Optimizacija težine
        - Prenosivost
        - Stabilnost
    - title: Proizvodna preciznost
      body: 'Svaki proizvod prolazi kroz kontrolirane procese: priprema materijala, precizno rezanje, zavarivanje i vezivanje, sastavljanje, kontrola kvalitete i provjera performansi.'
      items:
        - Priprema materijala
        - Precizno rezanje
        - Zavarivanje i vezivanje
        - Sastavljanje i kontrola kvalitete
    - title: Inženjerstvo korisničkih scenarija
      body: Proizvodi se razvijaju oko stvarnih primjena — rekreacija, avantura i profesionalna upotreba — osiguravajući da svaki dizajn zadovoljava specifične zahtjeve svog predviđenog okruženja.
      items:
        - Rekreacija
        - Avantura
        - Professional
        - Komercijalni
