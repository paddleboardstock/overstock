    title: Obveza prema kvaliteti
    body: Od pregleda materijala do završnog testiranja, Aquafarer održava sustavne procese kontrole kvalitete kako bi isporučio pouzdane pomorske proizvode. Svaka jedinica prolazi testiranje tlaka, pregled šavova i provjeru performansi prije otpreme.
