hero:
  tagline: Naša Priča
  title: Aquafarer — Inženjering Slobode na Vodi
  subtitle: 'Od obradbenog radionice na obali do globalnog proizvođača plovila — naše putovanje temelji se na tvrdoglavom uvjerenju: plovila trebaju biti konstruirana kao da su važna, jer jesu.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer tvornica i pogon za proizvodnju plovila u Qingdau
