  - label: Veličina pogona
    value: 12.000 m² (130.000 ft²) integrirani kampus u Zoni gospodarskog razvoja Qingdao
  - label: Godišnji kapacitet
    value: 15.000 čamaca uključujući SUPs, kajake, dingije, RIBs i sigurnosnu opremu
  - label: R&D tim
    value: 25+ inženjera u području dizajna proizvoda, znanosti o materijalima i inženjerstva kvalitete
  - label: Ključna oprema
    value: CNC rezaći stolovi, RF dielektrični uređaji za zavarivanje, toplovodni zapečatmaji, digitalni pisači, kalupi od stakloplastike, uređaji za testiranje zračnog zadržavanja
  - label: Proizvodne linije
    value: '6 namjenskih linija: PVC rezanje, zavarivanje cijevi, postavljanje trupa od stakloplastike, SUP montaža, RIB montaža, konačna kontrola kvalitete'
  - label: Godišnji volumen izvoza
    value: 8 milijuna USD+ izvezeno u 50+ zemalja diljem Europe, Amerike, Azijsko-pacifičkog područja i Bliskog Istoka
