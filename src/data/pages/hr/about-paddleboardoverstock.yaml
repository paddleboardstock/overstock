  subtitle: Vertikalno integrirani proizvođač vodene sportske opreme — od sirovine do gotovog čamca
intro:
  - 'Paddle Board Overstock je osnovan 2012. godine s jednom misijom: dizajnirati i proizvesti opremu za vodene sportove koja jednako dobro funkcionira na vodi kao i u izvještaju o kvaliteti. Ono što je započelo kao usmjerena SUP radionica za daske preraslo je u integrirani proizvodni pogon od 12.000 kvadratnih metara u Zoni gospodarskog razvoja Qingdao, proizvodnje napuhavajućih čamaca, RIBs, kajaka, SUP dasaka, sigurnosne opreme i dodataka za kupce u 50+ zemalja.'
  - Danas, Paddle Board Overstock djeluje kao tvornička marka — dizajniramo, inženjerski oblikujemo, izrađujemo prototipe, proizvodimo i testiramo sve pod jednim krovom. Ova vertikalna integracija omogućuje nam izravnu kontrolu nad izborom materijala, kvalitetom izrade i rokovima isporuke. Svaki čamac izrađuju naši djelatnici, na našoj opremi, prema našim standardima.
  - Opslužujemo rekreativne korisnike, komercijalne operatore, državne agencije i partnerske brendove širom svijeta. Naši OEM i ODM programi pomažu tvrtkama da pokrenu vlastite linije proizvoda bez ulaganja u tvorničku infrastrukturu. Bilo da trebate jedan prototip ili cjelokupnu proizvodnu seriju, naš tim vas vodi od koncepta do isporuke spremne za more.
