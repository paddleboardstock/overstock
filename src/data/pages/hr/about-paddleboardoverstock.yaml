values:
  - title: Kvaliteta na prvom mjestu
    desc: Svaka čamac koji napusti našu tvornicu prolazi obvezna ispitivanja zadržavanja zraka, odvajanja šavova i sustava prije isporuke.
  - title: Vertikalna integracija
    desc: Kontroliramo svaki korak — od rezanja PVC do konačne montaže — eliminirajući neefikasnost izvođača i osiguravajući dosljednu kvalitetu.
  - title: Sigurnost kao standard
    desc: CE certifikacija je temelj svega što gradimo. Naših 64 modela s CE-certifikatom zadovoljavaju sigurnosne standarde EU za rekreativnu i komercijalnu upotrebu.
  - title: Partner usmjeren
    desc: Gradimo dugoročne odnose s OEM, ODM i partnerima s privatnom markom kroz transparentnost, pouzdanost i zajednički rast.
services:
  - title: OEM Proizvodnja
    desc: Proizvodimo prema vašim specifikacijama. Podijelite svoje crteže, a naš inženjerski tim se pobrine za prototipiranje, alatnicu i proizvodnju.
  - title: ODM Rješenja
    desc: Počnite od naših dokazanih dizajna platformi. Prilagodite veličinu, boju, grafiku i pakiranje kako biste stvorili svoju jedinstvenu liniju proizvoda.
  - title: Privatna marka
    desc: Vaše ime brenda, vaš logo, vaše pakiranje. Proizvodi dolaze spremni za maloprodaju s potpunom integracijom brenda.
  - title: Prilagođeno brendiranje
    desc: Tisak na palubi, grafika trupa, naljepnice na cijevima i prilagođene oznake — dosljedna prisutnost brenda na svakom površinskom dijelu.
certifications:
  - name: CE Certifikacija
    desc: Naši čamci i plovila su u skladu s Direktivom EU o rekreativnim plovilima (2013/53/EU) i relevantnim usklađenim standardima.
    scope: Čamci i plovila
  - name: null
    desc: Sustav upravljanja kvalitetom certificiran za dizajn, proizvodnju i distribuciju napuhanih plovila.
    scope: Cijeli pogon
  - name: null
    desc: Napuhani čamci — zahtjevi za sigurnost i performanse za ojačane i čvrste napuhane čamce.
    scope: RIB & napuhane linije
