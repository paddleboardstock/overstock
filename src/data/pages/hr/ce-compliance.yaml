content_scope:
  tagline: Opseg usklađenosti
  title: Koji proizvodi trebaju<br />RCD usklađenost?
  subtitle: Direktiva o rekreativnim plovilima 2013/53/EU odnosi se na rekreativna plovila s duljinom trupa između 2,5 m i 24 m. Razumijevanje opsega prvi je korak ka usklađenosti.
  items:
    - title: RIB Brodovi (2,5–24 m)
      description: Kruti napuhavajući čamci s duljinom trupa od 2,5 m do 24 m podliježu RCD. Kategorije dizajna A do D primjenjuju se ovisno o predviđenim uvjetima mora i maksimalnoj sili vjetra.
      icon: tabler:sailboat
    - title: Napuhavajući čamci (ispod 2,5 m)
      description: Mali napuhavajući čamci i čamci ispod 2,5 m mogu biti djelomično izuzeti iz RCD, ali još uvijek zahtijevaju CE označavanje prema drugim primjenjivim direktivama i EN ISO 6185 standardima konstrukcije.
      icon: tabler:sailboat
    - title: SUP Daske i pribor
      description: Daske za stajanje i veslanje nisu u opsegu RCD. Međutim, pripadajuća osobna zaštitna sredstva za plutanje (PFD) zahtijevaju CE označavanje prema Uredbi o osobnim zaštitnim sredstvima (EU) 2016/425 s USCG odobrenjem Tip III/V gdje je primjenjivo.
      icon: tabler:swimming
    - title: Djelomično dovršeni brodovi
      description: Brodovi isporučeni bez motora ili specifičnih instalacija zahtijevaju Izjavu proizvođača za djelomično dovršena plovila, a potpuna RCD usklađenost se dovršava od strane konačnog proizvođača ili uvoznika.
      icon: tabler:tool
content_trust_layers:
  tagline: Sustav povjerenja u tri sloja
  title: Informacije o usklađenosti<br />— Podijeljeno na odgovarajućoj razini
  subtitle: Nisu svi podaci o usklađenosti prikladni za javnu web stranicu. Slijedimo pristup u tri sloja koji štiti intelektualno vlasništvo dok istovremeno gradi povjerenje kupaca.
  items:
    - title: Sloj 1 — Javni web mjesto
      description: Standardi navedeni, objašnjeni načini usklađenosti, navedene vrste dokumenata, opseg certifikacije po obitelji modela. Nema stvarnih certifikata, testnih podataka ili vlasničkih inženjerskih detalja.
      icon: tabler:world
    - title: Sloj 2 — Dijeljenje nakon upita
      description: 'Nakon kvalificiranog upita: cenzurirani uzorak DoC-a, fotografija tvorničke pločice, popis primjenjivih standarda, popis usklađenosti i sažeci certifikata materijala — podijeljeno prema uvjetima pravične uporabe.'
      icon: tabler:mail
    - title: Sloj 3 — NDA / Faza narudžbe
      description: Puna tehnička dokumentacija, procjene rizika, izračuni stabilnosti, izvještaji o testiranju, zapisi o serijama materijala i dokumentacija o praćenju proizvodnje — dijele se samo pod NDA s potvrđenim kupcima.
      icon: tabler:lock
content_standards:
  tagline: Primjenjivi standardi
  title: ISO & EN standardi<br />Mi gradimo da
  subtitle: Naši su proizvodi dizajnirani i testirani prema harmoniziranim standardima prema RCD. Brojevi i nazivi standarda su navedeni; cjelokupni tekstovi standarda ostaju zaštićeni autorskim pravima ISO.
  items:
    - title: HR ISO 6185-3
      description: 'Gumeni čamci — Dio 3: Čamci s maksimalnom snagom motora od 15 kW ili više. Zahtjevi za konstrukciju, stabilnost, uzgonsku sposobnost i spašavanje čovjeka koji je pao u more za RIBs.'
      icon: tabler:file-text
    - title: HR ISO 6185-4
      description: 'Napuhavajući čamci — Dio 4: Čamci s maksimalnom snagom motora od 15 kW i većom ili jednako 4,5 kW. Dodatni zahtjevi za konstrukciju i stabilnost.'
      icon: tabler:file-text
    - title: ISO Serija 12215
      description: Mali brod — Konstrukcija trupa i letvarski dijelovi. Strukturni dizajn trupa, palube i pregrada za trupove od stakloplastike i aluminija.
      icon: tabler:ruler-2
    - title: HR ISO 10240
      description: Mala plovila — Upute za vlasnika. Potreban sadržaj i format uputa za vlasnika koje prate svako RIB plovilo isporučeno u EU.
      icon: tabler:book
    - title: HR ISO 14945
      description: Mali brodovi — pločica graditelja. Informacije koje se moraju trajno označiti na pločici graditelja pričvršćenoj na svaki brod.
      icon: tabler:badge
    - title: ISO 8666
      description: Mali brod — Glavni podaci. Standardizirana mjerenja i parametri za dosljednu specifikaciju u cijeloj dokumentaciji proizvoda.
      icon: tabler:dimensions
content_process:
  tagline: Postupak usklađenosti
  title: 6-korak CE usklađenost<br />Radni tijek
  subtitle: Od opsega projekta do sljedivosti razine serije — svaki RIB model slijedi definirani put usklađenosti.
  steps:
    - number: '01'
      title: Opseg i klasifikacija projekta
      description: Definirajte RIB model, kategoriju dizajna (A/B/C/D), maksimalni broj osoba, nosivost, snagu motora i ciljno tržište. Utvrdite RCD primjenjuje li se i koji je modul za ocjenjivanje sukladnosti potreban.
      timeline: 2–3 dana
    - number: '02'
      title: Identifikacija primjenjivih zahtjeva
      description: Identificirajte sve primjenjive Osnovne sigurnosne zahtjeve iz RCD Priloga I, relevantne usklađene standarde (EN ISO 6185, 12215, 10240, 14945) i sve dodatne nacionalne zahtjeve za ciljano tržište.
      timeline: 3–5 dana
    - number: '03'
      title: Dizajn i tehnička dokumentacija
      description: 'Izradite Glavnu tehničku datoteku: nacrte općeg rasporeda, izračune stabilnosti i uzgona, procjenu rizika, specifikacije materijala i analizu sigurnosti sustava (gorivo, elektrika, upravljanje).'
      timeline: 10–15 dana
    - number: '04'
      title: Verifikacija i testiranje proizvoda
      description: Provedite fizičku verifikaciju — testiranje tlaka na 1,25x nazivnom tlaku tijekom 24–48 sati, testove stabilnosti i plovnosti, testove opterećenja i puštanje sustava u rad. Zabilježite sve rezultate ispitivanja po trupu.
      timeline: 5–7 dana
    - number: '05'
      title: Dokumentacija za označavanje i isporuku
      description: Oznake s dodatkom CE , građevinska ISO pločica (EN 14945) i HIN/CIN (identifikacijski broj trupa). Pripremite EU Deklaraciju o usklađenosti, priručnik za vlasnika (EN ISO 10240) i kontrolni popis usklađenosti.
      timeline: 2–3 dana
    - number: '06'
      title: Serijska sljedivost
      description: Svaki trup dobiva jedinstveni zapis trupa koji ga povezuje s glavnim tehničkim dosjeom, proizvodnim serijama, certifikatima materijala, rezultatima testiranja i konačnom konfiguracijom. Zapisi se čuvaju 10+ godina po RCD.
      timeline: U tijeku
content_document_cards:
  tagline: Vrste dokumenata
  title: Dokument o usklađenosti<br />Karte
  subtitle: Ovo su vrste dokumenata koje pripremamo i održavamo za CERIB svaki -certificirani model. Primjeri su dostupni na kvalificirani upit.
  items:
    - title: CE / RCD Potvrda o usklađenosti
      description: Certifikat specifičan za model koji potvrđuje da plovilo ispunjava sve važeće Osnovne sigurnosne zahtjeve RCD iz 2013./53./EU, izdan od strane proizvođača uz sudjelovanje Obaviještenog tijela gdje je potrebno.
      icon: tabler:certificate
    - title: EU Deklaracija o sukladnosti (DoC)
      description: Potpisana izjava proizvođača ili ovlaštenog predstavnika, s popisom važećih direktiva, standarda, modula za usklađenost i detalja o Notificiranom tijelu. Obavezno za svaki model plasiran na tržište EU.
      icon: tabler:file-check
    - title: Ploča graditelja (EN ISO 14945)
      description: Trajno pričvršćena pločica s maksimalnim brojem osoba, maksimalnom snagom motora, kategorijom dizajna i identifikacijom proizvođača. Mora ostati čitljiva tijekom cijelog vijeka trajanja plovila.
      icon: tabler:badge
    - title: Priručnik za vlasnika (EN ISO 10240)
      description: Sveobuhvatan priručnik koji pokriva sigurno upravljanje, hitne procedure, rasporede održavanja i sigurnosna upozorenja. Obavezno za svaku RIB isporučenu u EU.
      icon: tabler:book
    - title: ISO Izvještaji o ispitivanju i inspekciji
      description: Zapisi o ispitivanju tlaka (1,25x / 24–48h), rezultati testova stabilnosti i plovnosti, certifikati o materijalnim ispitivanjima i izvještaji o dimenzionalnoj verifikaciji — sve povezano s točnim brojevima trupa.
      icon: tabler:test-pipe
    - title: Evidencija praćenja materijala
      description: Praćenje po serijama za tkaninu cijevi, ljepila, stakloplastiku i hardver. Povezuje svaku proizvodnu jedinicu s certifikatima ulaznog materijala i rezultatima IQC inspekcija.
      icon: tabler:link
    - title: Evidencija kontrole kvalitete i QC
      description: Kontrolni popis kvalitete od 100 točaka po jedinici, Evidencija QC u procesu, izvještaji o nesukladnostima i korektivne akcije. Dio lanca praćenja proizvodnje.
      icon: tabler:clipboard-check
    - title: Paketa dokumenata projekta
      description: Dokumentacija po trupu uključujući zapis o konačnoj konfiguraciji, detalje ugradnje motora i opreme, kontrolni popis puštanja u pogon i dokumentaciju za isporuku.
      icon: tabler:package
content_design_categories:
  tagline: RCD dizajn kategorije
  title: Kategorija dizajna A–D<br />— Što znače
  subtitle: RCD dodjeljuje kategorije dizajna temeljem maksimalne sile vjetra i značajne visine valova koje plovilo može izdržati.
  items:
    - title: Kategorija A — Ocean
      description: Namijenjeno za duža putovanja gdje sila vjetra može premašiti Beaufortovu ljestvicu 8 (>40 čvorova) i značajna visina valova može premašiti 4 m. Zahtijeva najrigorozniju provjeru strukture i stabilnosti.
      icon: tabler:ripple
    - title: Kategorija B — Offshore
      description: Namijenjeno za offshore plovidbu uz silu vjetra do Beaufort 8 (≤40 čvorova) i značajnu visinu valova do 4 m. Pogodno za obalne i poluotvorene vode.
      icon: tabler:anchor
    - title: Kategorija C — Inshore
      description: Namijenjeno za obalne plovidbe uz silu vjetra do Beaufort 6 (≤27 čvorova) i značajnu visinu valova do 2 m. Većina rekreativnih RIBs spada u ovu kategoriju.
      icon: tabler:sun
    - title: Kategorija D — Zaštićeno
      description: Namijenjeno za zaštićene vode uz silu vjetra do Beaufort 4 (≤16 čvorova) i značajnu visinu valova do 0,3 m. Jezera, rijeke i zaštićene luke.
      icon: tabler:pool
content_hin:
  tagline: Identifikacija plovila
  title: HIN / CIN i pločica proizvođača
  subtitle: Svako RIB plovilo zahtijeva Hull Identification Number (HIN) ili Craft Identification Number (CIN) i pločicu proizvođača u skladu s EN ISO 14945 i zahtjevima RCD.
  items:
    - title: Identifikacijski broj trupa (HIN)
      description: Jedinstveni 14-znamenkasti kod trajno označen na desnoj strani krme, koji kodira proizvođački kod (MIC), godinu modela, godinu proizvodnje i serijski broj. Potrebno za ulazak na tržište EU.
      icon: tabler:hash
    - title: Identifikacijski broj plovila (CIN)
      description: Prema EN ISO 10087, skriveni sekundarni identifikacijski broj smješten na skrivenom mjestu za potrebe protiv krađe i praćenja.
      icon: tabler:eye-off
    - title: Sadržaj pločice proizvođača
      description: Maksimalan broj osoba, maksimalna snaga motora (kW), maksimalno opterećenje (kg), kategorija dizajna, naziv proizvođača i CE oznaka — sve trajno prikazano na pločici otpornog na koroziju.
      icon: tabler:badge
content_tech_file:
  tagline: Struktura tehničkog dosjea
  title: Glavni tehnički dosje<br />& Zapis o trupu
  subtitle: 'Naš sustav dokumentacije slijedi dvoslojnu strukturu: Glavni tehnički dosje za svaku obitelj modela i pojedinačne zapise trupa za svaki proizvedeni brod.'
  items:
    - title: Glavni tehnički dosje
      description: 'Sadrži kompletnu dokumentaciju o usklađenosti za obitelj modela: opći raspored, procjenu rizika, izračune stabilnosti/uzgona, specifikacije materijala, primjenjive standarde i zapise o procjeni sukladnosti. Čuva se 10+ godina.'
      icon: tabler:folder
    - title: Zapis trupa (prativost po brodu)
      description: 'Svaki trup ima jedinstveni zapis koji ga povezuje s glavnom tehničkom datotekom: HIN, datum proizvodnje, serija cijevi, certifikati materijala, rezultat ispitivanja tlaka, konačna konfiguracija, ugradnja motora i odredište isporuke.'
      icon: tabler:file-description
    - title: Paket za usklađenost korisnika
      description: Paket dostave po trupu uključujući DoC, fotografiju ploče graditelja, priručnik za vlasnika, sažetak testa i konačni konfiguracijski list — uz svaki paket RIB poslan u EU.
      icon: tabler:package
content_material_cert:
  tagline: Certifikacija materijala
  title: Sljedivost materijala &<br />Dokazi o certifikaciji
  subtitle: RIB Kvalitetni brodovi započinju s kontroliranim materijalima i dokumentiranim procesima. U nastavku je objašnjeno kako organiziramo certifikaciju materijala za svaku kritičnu skupinu komponenti.
  items:
    - title: Sljedivost materijala za napuhavajuće cijevi
      description: PVC CSMHypalon i/materijali cijevi biraju se prema namjeni, klimatskim uvjetima i ciljnom tržištu. Tehnički podaci dobavljača (TDS), informacije o serijama materijala, sljedivost serija UV tkanina i izvještaji o testovima na vremenske uvjete te REACH/SVHC deklaracije dostupni su unutar dogovorenog opsega projektne dokumentacije.
      icon: tabler:circle
    - title: Sljedivost pomorskog aluminija
      description: Za projekte s aluminijskim trupom RIB , klasifikacija legura, debljina i serije materijala kontroliraju se prema odobrenoj specifikaciji. Certifikati za ispitivanje materijala (MTC/MTR), EN 10204 3.1 dokumentacija, izvještaji o kemijskom sastavu i mehaničkim svojstvima te sljedivost topline/serije dostavljaju se gdje je dogovoreno.
      icon: tabler:rectangle
    - title: GRP kontrola materijala trupa i procesa
      description: Za trup od stakloplastikeRIBs, gelcoat, smola, armatura od staklenih vlakana i materijali za jezgru upravljaju se prema kontroliranim specifikacijama. TDS/SDS materijala, zapisi o serijama, specifikacije laminata te zapisi o očvršćavanju i kontroli radionice dostupni su uz dogovor o projektu.
      icon: tabler:layers-subtract
    - title: Podrška dokumentaciji komponenti
      description: Za odabrane komponente — uključujući EVA materijale palube, sjedala, hardver od nehrđajućeg čelika, sustave goriva, električnu opremu i pomorske dodatke — odgovarajuća dokumentacija dobavljača koordinira se prema konačnoj konfiguraciji i zahtjevima odredišnog tržišta.
      icon: tabler:package
    - title: Obavijest o opsegu usklađenosti
      description: Certifikati, izvješća o testiranju i dokumenti o usklađenosti odnose se samo na određeni model proizvoda, materijal, komponentu, proizvodnu seriju ili opseg projekta naveden u relevantnom dokumentu. Kontaktirajte nas s vašim ciljnim tržištem, namjenom i tehničkim zahtjevima kako bi se odgovarajući paket dokumentacije mogao potvrditi prije narudžbe.
      icon: tabler:info-circle
faq:
  title: CE Usklađenost — Često postavljana pitanja
  questions:
    - q: Jesu li svi Paddle Board Overstock RIB brodovi CE certificirani za tržište EU?
      a: RIB brodovi u našem katalogu dizajnirani su i dokumentirani za RCD usklađenost 2013/53/EU prema važećim EU direktivama.CE Označavanje se primjenjuje po modelu i konfiguraciji. Kontaktirajte nas za dokument o usklađenosti specifičan za model.
    - q: Koja je razlika između RCD usklađenosti i CE označavanja?
      a: RCD (Direktiva o rekreacijskim plovilima 2013/53/EU) je zakonodavstvo EU-a koje postavlja Osnovne sigurnosne zahtjeve.CE Označavanje je vizualni simbol koji se stavlja na proizvod koji je procijenjen i potvrđen da zadovoljava te zahtjeve. Proizvod mora biti u skladu s ovim uvjetima RCD prije nego što može nositi CE oznaku.
    - q: Priložite li Izjave o sukladnosti uz svaki brod?
      a: Da. Svaka RIB jahta isporučena na tržište EU uključuje model-specifičnu EU Deklaraciju o sukladnosti koja navodi primjenjive direktive, harmonizirane standarde, modul ocjenjivanja sukladnosti i podatke o Obaviještenom tijelu.
    - q: Koji modul ocjenjivanja sukladnosti koristi Paddle Board Overstock?
      a: Modul ovisi o kategoriji dizajna i vrsti jahte. Većina RIB modela u Kategoriji dizajna C koristi Modul A (internu kontrolu proizvodnje). Za jahte Kategorije dizajna A/B ili specifične konfiguracije, može se primijeniti Modul B+C ili B+D uz sudjelovanje Obaviještenog tijela. Savjetujemo o prikladnom modulu za svaki projekt.
    - q: Možete li podijeliti dokumentaciju o sukladnosti prije nego što izvršimo narudžbu?
      a: Nakon kvalificiranog upita, dijelimo dokument o opsegu sukladnosti koji navodi primjenjive standarde, postupak sukladnosti i vrste dokumenata dostupnih za model koji procjenjujete. Potpuni tehnički dosjei se dijele prema NDA nakon potvrde narudžbe.
    - q: Što je identifikacijski broj trupa (HIN) i je li uključen?
      a: HIN je 14-znamenkasti jedinstveni identifikator trajno označen na svakoj jahti, koji kodira proizvođački kod (MIC), oznaku modela, godinu proizvodnje i serijski broj. Obvezan je za sve RIB jahte na tržištu EU i uključen je na svakoj Paddle Board Overstock RIB.
    - q: Koliko dugo se čuvaju tehnički dosjei?
      a: Prema zahtjevima RCD 2013/53/EU, proizvođač mora čuvati tehnički dosje najmanje 10 godina od posljednjeg datuma stavljanja proizvoda na tržište. Paddle Board Overstock održava kompletnu tehničku dokumentaciju za sve proizvedene modele.
    - q: Pomažete li u obvezama uvoznika prema RCD?
      a: 'Da. Pružamo paket dokumentacije koji EU uvoznici trebaju za ispunjavanje svojih obveza: pristup tehničkom dosjeu, DoC, tablicu brodograditelja, priručnik za vlasnika i evidenciju sljedivosti proizvoda. Obveze uvoznika prema RCD jasno su dokumentirane u našem vodiču za sukladnost.'
