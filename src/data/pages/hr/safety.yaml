certifications:
  - title: CE Certifikacija (EU 2016/425)
    standard: Uredba o osobnoj zaštitnoj opremi (EU) 2016/425 | EN ISO 12402
    description: Sva Paddle Board Overstock sigurnosna oprema udovoljava zahtjevima oznake CE prema Europskoj uredbi o osobnoj zaštitnoj opremi. Svaki proizvod je neovisno testiran od strane TÜV Rheinlanda, europskog obaviještenog tijela. Naši napuhavajući čamci i RIBs udovoljavaju zahtjevima Direktive o rekreativnim plovilima 2013/53/EU (RCD) kategorija C i D.
    body: CE certifikacija pokriva osnovne zahtjeve za zdravlje i sigurnost za osobne plutajuće uređaje i napuhavajuća plovila. TÜV Rheinland godišnje provodi reviziju naše proizvodne ustanove kako bi provjerio kontinuiranu usklađenost.
  - title: SOLAS — Sigurnost života na moru
    standard: SOLAS Poglavlje III | LSA kod
    description: Life Vest Pro udovoljava SOLAS propisima za offshore i komercijalne pomorske operacije. Testirano za zadržavanje plovnosti 24 sata, automatsko napuhavanje pri uranjanju i učinkovitost u morskim uvjetima do Snage 5. Udovoljava zahtjevima Poglavlja III za prsluke za spašavanje na komercijalnim brodovima.
    body: SOLAS odobrenje zahtijeva neovisno testiranje od strane obaviještenog tijela za plovnost, čvrstoću, vidljivost i automatsko aktiviranje. Naš Life Vest Pro nosi potpuno SOLAS odobrenje tipa s MED certifikacijom.
  - title: USCG Tip III / Tip V
    standard: 46 CFR Part 160 | USCG Odobrenje
    description: Odabrani Paddle Board Overstock prsluci za spašavanje udovoljavaju klasifikaciji Obalne straže Sjedinjenih Država za Tip III (pomagala za plutanje) i Tip V (uređaji za posebnu upotrebu). Pogodni za zaštićene vode, obalna krstarenja i komercijalne operacije koje zahtijevaju USCG odobrene PFD-ove.
    body: USCG odobrenje zahtijeva testiranje u neovisnom laboratoriju priznatom od strane CG. Odobrenje Tip V uključuje hibridne napuhavajuće dizajne koji zahtijevaju ručno ili automatsko aktiviranje.
  - title: BSCI Društvena usklađenost
    standard: amfori BSCI Kodeks ponašanja
    description: Naša tvornica se godišnje revizira prema amfori Inicijativi za poslovnu društvenu usklađenost (BSCI). Ovo potvrđuje etičke radne prakse, sigurnost na radu, poštene radne sate i upravljanje okolišem u našoj proizvodnoj jedinici od 12.000 m².
    body: BSCI usklađenost je preduvjet za europske trgovce i uvoznike. Naša trenutna BSCI ocjena je "C" (Dobar), prema reviziji SGS.
  - title: REACH & RoHS Usklađenost
    standard: EU REACH uredba (EZ) 1907/2006 |RoHS Direktiva 2011/65/EU
    description: Svi PVC spojevi, ljepila i premazi koji se koriste u Paddle Board Overstock proizvodima usklađeni su REACH s EU propisima o kemijskoj sigurnosti i RoHS ograničenjima za opasne tvari. Sigurnosni listovi materijala (MSDS) dostupni su za svaku liniju proizvoda.
    body: REACH usklađenost osigurava da nema ograničenih SVHC tvari iznad praga. Redovito testiranje u laboratoriju treće strane potvrđuje kontinuiranu usklađenost za svaku proizvodnu seriju.
  - title: ISO 9001:2015 Upravljanje kvalitetom
    standard: ISO 9001:2015 |TÜV Rheinland certificiran
    description: Naš sustav upravljanja kvalitetom certificiran je ISO 9001:2015 od TÜV strane Rheinlanda, pokrivajući dizajn, proizvodnju, testiranje i postprodajne usluge. Godišnje nadzorne revizije osiguravaju kontinuirano poboljšanje i kontrolu procesa.
    body: ISO Certifikacija 9001 zahtijeva dokumentirane politike kvalitete, interne revizije, preglede uprave, procedure korektivnih mjera i evidenciju proizvodnje koja se može pratiti.
testimonial:
  quote: Nabavljali smo sigurnosnu opremu od više dobavljača diljem Azije.Paddle Board Overstock Jedini je proizvođač koji je unaprijed dostavio CE potpunu dokumentaciju SOLAS , certifikate i izvještaje trećih strana o testiranju — bez da su ga to tražili.
  author: Erik Lindström
  title: Službenik za sigurnost
  company: Baltička pomorska opskrba
  location: Finska
content_overpressure:
  tagline: Sigurnost od pretlaka
  title: RIB Tlak u cijevi<br />Upravljanje u toplim klimama
  subtitle: Tlak u napuhavajućoj cijevi raste s temperaturom. Razumijevanje i upravljanje prekomjernim tlakom sprječava oštećenja i osigurava siguran rad u tropskim i pustinjskim područjima.
  items:
    - title: Boyleovi ventili za rasterećenje tlaka
      description: Paddle Board Overstock RIB Cijevi su opremljene ventilima za rasterećenje pretlaka koji automatski ispuštaju višak tlaka iznad nominalnog maksimuma. Sprječava naprezanje spoja i potencijalno pucanje cijevi zbog solarnog zagrijavanja.
      icon: tabler:gauge
    - title: Promjena tlaka od jutra do podneva
      description: Cijev napuhana na 3,5 stupnjeva PSI na 20°C može doseći 4,5+ PSI pri 40°C izloženosti suncu. Uvijek napuhujte do donje granice preporučenog raspona u toplim klimama i dopustite ventilu da kontrolira višak tlaka.
      icon: tabler:sun
    - title: Preporučeni radni tlakovi
      description: 'PVC Cijevi: 3,0-3,5 u PSI pogonu, PSI 4,5 maksimalno. Hypalon Cijevi: 3,5-4,0 u PSI radu, PSI 5,0 maksimalno. Uvijek testirajte na 1,25x vrijednosti (4,4 PSI za PVC, 5,0 PSI za Hypalon) prema Paddle Board Overstock QC standardima.'
      icon: tabler:chart-bar
    - title: Najbolje prakse izlaganja suncu
      description: Čuvajte RIBs ih na sjenovitim mjestima kada se ne koriste. Koristite UVzaštitne poklopce za dulje privezivanje. Provjerite i prilagodite tlak u cijevi prije i nakon vršnih sunčanih sati. Nikada ne prelazite maksimalni nazivni tlak.
      icon: tabler:umbrella
    - title: Hitna dekompresija
      description: Ako je cijev previše čvrsta ili se ventil za oslobađanje ispušta, ispuštajte zrak kroz Halkey-Roberts ili vojni ventil dok se tlak ne vrati u radni raspon. Nosite manometar za točna očitanja.
      icon: tabler:alert-circle
