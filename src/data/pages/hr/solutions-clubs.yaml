testimonial:
  content: Počeli smo s Paketom za početnike kluba za našu školu surfanja u Portugalu. 20 dasaka, vesla, prsluci — sve je stiglo unutar 3 tjedna. Nakon dvije sezone nadogradili smo na Pro paket. Prilagođeni branding s našim logom bio je prekretnica za naš profesionalni imidž.
  name: Ricardo Santos
  title: Vlasnik, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Profili klubova
  title: Rješenja za klubove vodnih sportova<br />Prema vrsti kluba
  subtitle: Od sveučilišnih veslačkih klubova do ekskluzivnih privatnih jahting klubova — svaki tip kluba ima jedinstvene potrebe za opremom, obrasce korištenja i strukture proračuna. Svaki paket prilagođavamo kako bi odgovarao modelu kluba.
  items:
    - title: Sveučilišni i fakultetski paddle klubovi
      subtitle: Flote studenata s visokim korištenjem
      description: Klubovi za veslanje koje vode studenti ili podržavaju institucije, koji organiziraju programe kanua i kajaka za odjele univerzitetske rekreacije. Oprema je izložena čestoj i intenzivnoj upotrebi različitih razina vještina svaki semestar. Trajnost i jednostavnost popravka su ključni, uz pristupačne cijene za studentske organizacije.
      features:
        - Iznimno izdrživa PVC konstrukcija ocijenjena za cikluse korištenja od strane studenata
        - Odbor kodiran bojama prema razini vještine za jednostavno upravljanje flotom
        - Komplet za popravak + podrška putem videa uključena u svaku narudžbu
        - Cijene s popustom za studentske organizacije i uvjeti plaćanja po semestru
    - title: Zajednički klubovi za veslanje i društvene aktivnosti
      subtitle: Rekreativni klubovi s članstvom
      description: Klubovi utemeljeni u zajednici koji članovima nude SUP, kajak i društvena veslačka iskustva. Potrebe za opremom trebaju uravnotežiti performanse i udobnost za širok raspon dobnih skupina, s brendiranjem koje potiče identitet kluba i ponos članova. Učinkovitost skladištenja ključna je za klubove koji rade s ograničenim pristupom obali.
      features:
        - 'Mješovita flota: all-around SUPs, touring daske i rekreativni kajaci'
        - 'Potpuno brendiranje kluba: prilagođene boje, tiskanje logotipa, brendirani PFD-ovi'
        - Kompaktna rješenja za skladištenje napuhive opreme
        - 'Starter kit za rast članstva: kartice za preporuke, brendirana fotografija'
    - title: Škole surfanja i akademije surf kajaka
      subtitle: Obalna izvedba i trening
      description: Škole fokusirane na surfanje koje podučavaju SUP surfing, surf kajak i vještine jahanja valova. Oprema mora biti funkcionalna u uvjetima surfanja — upravljiva, responzivna i dovoljno izdržljiva da podnese ponovljene padove, abraziju pijeska i izlaganje slanoj vodi bez brzog propadanja.
      features:
        - Kraći, širi SUP oblici optimizirani za manevriranje u surfanju
        - Ojačana konstrukcija ruba za otpornost na udarce u valovima
        - 'Sigurnosna oprema za surfanje: uvijeni sigurnosni konopi, opcije s mekim perajama'
        - Program zamjene flote s godišnjim popustima prilikom vraćanja stare opreme
    - title: Privatni i korporativni jaht klubovi
      subtitle: Premium iskustva za članove
      description: Ekskluzivni privatni klubovi koji nude vodene sportove kao premium pogodnost za članove. Standardi opreme su visoki — estetika, usklađenost s brendom i prezentacija spremna za goste jednako su važni kao i performanse. Očekivanja usluge uključuju dostavu poput bijelih rukavica, prilagođena rješenja za skladištenje i podršku na razini concierge-a.
      features:
        - Daske s premium završnom obradom s uzorkom drveta EVA i metalik detaljima
        - Prilagođeno usklađivanje boja s priručnikom brenda kluba
        - 'Concierge dostava: unaprijed napuhano, postavljeno i označeno za svaku sezonu'
        - Posvećeno upravljanje računom s prioritetnim SLA odgovorom
