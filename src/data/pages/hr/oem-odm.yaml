faq:
  title: OEM/ODM — Često postavljana pitanja
  questions:
    - q: Koja je minimalna količina narudžbe (MOQ) za prilagođene napuhavajuće SUPs?
      a: Za standardne modele s postojećim kalupima, počinje MOQ od 5–10 jedinica po dizajnu. Za potpuno prilagođene kalupe i alate, MOQ obično je to 200+ jedinica. Surađujemo sa startupima i novim brendovima kako bismo pronašli izvedive ulazne točke.
    - q: Što MOQ je za RIB prilagođene brodove?
      a: RIB Modeli počinju s 2–5 jedinica po dizajnu s postojećim kalupima, dok RIB potpuno prilagođeni kalupi zahtijevaju veće obveze. Surađujemo sa startupima i etabliranim brendovima kako bismo pronašli izvedive ulazne točke.
    - q: Koliko traje OEM proces uzimanja uzoraka?
      a: Standardni uzorci prototipova dovršeni su u roku od 7–14 radnih dana nakon odobrenja dizajna. Hitne narudžbe mogu se prioritetno ograničiti na 5–7 dana uz dodatnu naknadu.
    - q: Koja je razlika između i PVC Hypalon za napuhavajuće čamce?
      a: PVC lakši je, pristupačniji i nudi izvrsnu fleksibilnost u hladnom vremenu.Hypalon (CSM) pruža UV superiornu otpornost na ozon s duljim vijekom trajanja (10–15 godina naspram 5–8 godina). Preporučujemo PVC za većinu rekreativnih primjena i Hypalon za komercijalnu/profesionalnu upotrebu.
    - q: Možete li prilagoditi oblik i dizajn napuhavajućeg uređaja?
      a: Da. Naš R&D tim može razviti prilagođene kalupe za bilo koji oblik trupa, konture daske ili konfiguraciju cijevi. Koristimo CNCaluminijske kalupe izrađene za preciznost i dosljednost.
    - q: Pružate li usluge revizije tvornica?
      a: Rado provodimo inspekcije tvornica na licu mjesta i od strane trećih strana u našem objektu od 12.000 m² u Qingdaou. Održavamo ISO 9001 i BSCI certifikate te možemo dijeliti izvještaje o reviziji NDAna .
    - q: Koje uvjete dostave nudite?
      a: Nudimo FOB Qingdao ( CIFDDP standardne), , i uvjete dostave. Utovar kontejnera i potpuna izvozna dokumentacija uključeni su u OEM sve narudžbe.
content_profiles:
  tagline: Profili brendova
  title: OEM / Proizvodnja pod privatnom robnom markom<br />Prema tipu kupca
  subtitle: Različiti profili brendova dolaze s posebnim zahtjevima — prilagođavamo OEMODM naše / usluge vašem poslovnom modelu, skalabilnosti i strategiji izlaska na tržište.
  items:
    - title: Startup brendovi plovila
      subtitle: NiskiMOQ, brzi nastup
      description: Poduzetnici i osnivači koji pokreću svoju prvu liniju RIB brodova, SUPsodnosno napuhavajućih čamaca. Trebate proizvodnog partnera koji vaš brend tretira kao svoj — s niskim pragovima za ulazak, fleksibilnim veličinama serija i praktičnim vođenjem dizajna na svakom koraku.
      features:
        - MOQ čak i od 2–5 jedinica (RIB) / 5–10 jedinica (SUP) po SKU
        - Postojeća biblioteka kalupa za izbjegavanje troškova alata
        - 'Kompletan paket brendiranja: logo, grafika na cijevima, pakiranje, etikete za vješanje'
        - Tijek rada s uzorkom — odobri prije proizvodnje
    - title: Uspostavljeni pomorski brendovi
      subtitle: OEM skalirati s CE/ISO usklađenošću
      description: Postojeći brendovi brodova, PWC-a ili pomorskih dodataka dodaju napuhavajuće plovila u svoj portfelj. Potrebna vam je dosljedna kvaliteta kroz proizvodne serije, usklađenost s propisima za globalna tržišta i mogućnost zajedničkog inženjeringa prilagođenih trupova ili oblika cijevi.
      features:
        - Prilagođeno 3D inženjerstvo kalupa za vlasničke dizajne
        - CE 2013/53/EU, UKCAUSCG , dokumentacija o usklađenosti
        - BSCI Izvještaji o društvenoj reviziji za usklađenost maloprodajnih dobavljača
        - Posvećeno upravljanje računom + prioritetne proizvodne smjene
    - title: DTC i E-Commerce brendovi
      subtitle: Pakiranje spremno za maloprodaju u velikim količinama
      description: Brendovi koji prvo prodaju online putem Amazona, Shopifyja ili svojih web trgovina. Pakiranje, iskustvo otvaranja i dosljedna kvaliteta jedinica su ključni. Potrebna vam je tvornica koja razumije dinamiku brzine i stopu povrata u e-trgovini.
      features:
        - Dizajn kutije spremne za maloprodaju + tiskanje kartica umetaka
        - Vakumsko pakiranje / paletizacija za ekonomično slanje
        - EAN / UPC barkod i dokumentacija spremna za carinu
        - Konsolidacija mješovitih kontejnera za optimizaciju ukupnih troškova
    - title: Izvođači usluga najma i ugostiteljstva
      subtitle: Izgradnja vozila za flotu za odmarališta i poslovanje s najmom
      description: Odmarališta, centri za vodene sportove i operateri najma trebaju izdržljive, servisne flote s dosljednim brendiranjem. Pružamo cijene za flote, mješovite modele kontejnera i podršku za zamjenske dijelove tijekom godina rada.
      features:
        - Cijene za flote kod narudžbi mješovitih modela kontejnera
        - Izdržljive cijevi i opcije paluba komercijalne kvalitete
        - Kompleti rezervnih dijelova i obuka za održavanje
        - Dosljedno brendiranje kroz SUP, RIB i flote kajaka
