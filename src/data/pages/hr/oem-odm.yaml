process_steps:
  title: 6-stupanjski OEM/ODM proces
  subtitle: Od dizajnerskog brifa do FOB Qingdao — pojednostavljen tijek rada
  steps:
    - number: '01'
      title: Dizajnerski brief i 3D CAD modeliranje
      description: Podijelite ciljne specifikacije, referentni proizvod ili koncept. Naš inženjerski tim razvija detaljne CAD crteže i 3D prikaze za vaše odobrenje.
      timeline: 3–5 dana
    - number: '02'
      title: Odabir materijala i testiranje tkanina
      description: Odaberite između vojne kvalitete PVC (0,9–1,2 mm), Hypalon CSM ili drop-stitch osnovnih tkanina. Izvodimo testove tlačne čvrstoće, prianjanja premaza i stabilnosti UV.
      timeline: 2–3 dana
    - number: '03'
      title: Brzo prototipiranje i proizvodnja uzoraka
      description: Mi CNC-strojno izrađujemo prilagođene kalupe i proizvodimo predproizvodne uzorke s vašim bojama brenda, logotipom i specificiranim materijalima. Uzorci se šalju na vaše odobrenje.
      timeline: 7–14 dana
    - number: '04'
      title: 24–48 satni test zadržavanja visokog tlaka
      description: Svaki prototip prolazi rigorozno testiranje održavanja tlaka pri 1,25x nazivne vrijednosti. Izvode se testovi odvajanja šava i provjera dimenzija.
      timeline: 1–2 dana
    - number: '05'
      title: CE/ISO Kontrola Kvalitete & Pakiranje
      description: 100-točkovni kontrolni popis kvalitete. Svaka jedinica se pregledava prije pakiranja spremnog za maloprodaju. CE izjava o sukladnosti i BSCI izvještaj o usklađenosti uključeni.
      timeline: 2–3 dana
    - number: '06'
      title: FOB Qingdao Otprema & Logistika
      description: Gotovi proizvodi paletizirani, omotani u foliju i utovareni u kontejner u luci Qingdao. Cjelokupna dokumentacija za izvoz, carinjenje i praćenje u stvarnom vremenu.
      timeline: 7–14 dana
