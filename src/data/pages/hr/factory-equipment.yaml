hero:
  tagline: Oprema
  title: Proizvodna oprema i strojevi
  subtitle: Industrijska oprema za rezanje, zavarivanje, tisak i sastavljanje
  back_label: Natrag u tvornicu
  back_link: /factory
categories:
  - title: Rezanje i priprema materijala
    items:
      - name: Automatska PVC rezačka mašina
        spec: CNC-kontrolirano, 6,5 m × 2,5 m, preciznost 0,1 mm
        desc: Računalno upravljani automatski stroj za rezanje za PVC, Hypalon i drop-stitch tkanine. Softver za optimizaciju skladištenja materijala smanjuje otpad na ispod 5%.
      - name: Raspršivač tkanina
        spec: Maksimalna širina 3 m, napajanje kontrolirano napetošću
        desc: Raspoređuje tkaninu u jednom ili više slojeva uz kontroliranu napetost kako bi se spriječilo deformiranje prije rezanja.
  - title: Zavarivanje i spajanje cijevi
    items:
      - name: Mašina za toplinsko brtvljenje
        spec: Vrući zrak, promjenjiva temperatura 200–600 °C, 0,5–5 m/min
        desc: Stroj za toplinsko brtvljenje vrućim zrakom za spajanje i zavarivanje šavova PVC i Hypalon cijevi. Koristi se za spajanje, brtvljenje i spajanje komora cijevi i spojeva na plutajućim elementima.
      - name: Dielektrični RF preš
        spec: 15 kW, plato 2000 × 600 mm
        desc: Radiofrekventni zavarivački preš za glavne uzdužne šavove, spojeve od poprečnog do cijevnog dijela i izradu velikih komora.
      - name: CNC-kontrolirani RF zavarivač
        spec: 8 kW, XY stol 2500 × 1200 mm
        desc: Programabilno zavarivanje zakrivljenih šavova za složene geometrije, utiskivanje logotipa i precizno komponiranje.
  - title: RIB proizvodnja trupa
    items:
      - name: Kalupi za ručno oblikovanje stakloplastike
        spec: Više kalupa za RIB trupe do 6 m LOA
        desc: Tradicionalno ručno oblikovanje stakloplastike s poliester i vinil ester smolama. Svaki sloj se ručno valja i vakumski upakira kako bi se osigurala konzistentna kvaliteta laminata i čvrstoća.
      - name: Kabina za prskanje gelcoata
        spec: Temperatura kontrolirano, filtriran zračni protok
        desc: Nanošenje gelcoata za RIB trupe. Omogućuje visokosjajan, UV-otporan završetak s preciznom kontrolom debljine.
      - name: CNC glodalica (5-osna)
        spec: Tijelo 3 m × 2 m × 1 m, vreteno hlađeno vodom
        desc: Obrada umetaka trupa, kalupa za konzolu, baza sjedala i prilagođenih nosača.
  - title: SUP Tisak i dekoracija
    items:
      - name: Digitalni pisač
        spec: Visokorezolucijski inkjet, širina ispisa do 2 m
        desc: Digitalni tisak direktno na tkaninu za grafike palube u punoj boji SUP. Ispisuje prilagođene uzorke, gradijente i slike kvalitete fotografije s vodootpornim mastilima otpornim na UV.
      - name: Stroj za sitotisak
        spec: Ručna i poluautomatska registracija višebojnog ispisa
        desc: Sitotisak za logotipe SUP dasaka, marke i ponavljajuće uzorke. Pruža izdržljive, neprozirne ispise s živopisnom saturacijom boja.
  - title: Sastavljanje i montiranje
    items:
      - name: Dizalica motora
        spec: Kapacitet 500 kg, podesiva greda
        desc: Sigurno postavljanje vanbrodskih motora od 2,5 do 60 KS.
      - name: Okvir za maketu konzole
        spec: Podesiva visina i kut
        desc: Prepriprema upravljača, poluge i instrumentnih ploča prije ugradnje.
      - name: Hvataljka za hidraulične crijeva
        spec: Do 1" ID, digitalni manometar
        desc: Skupovi hidrauličnih crijeva za upravljanje po mjeri s prešanim spojnicama.
      - name: Ploča za električni kabel
        spec: 3 m × 1,5 m, prethodno tiskani dijagrami ožičenja
        desc: Montaža i testiranje kompletnih električnih kabelskih sklopova izvan broda.
  - title: Testiranje i kontrola kvalitete
    items:
      - name: Univerzalni ispitivač vlačne čvrstoće
        spec: 50 kN, / ASTM D751
        desc: Testiranje sile pucanja, izduženja pri lomu i širenja suza za serije tkanina.
      - name: Stroj za test zadržavanja zraka
        spec: Programabilno, 30-minutno održavanje tlaka
        desc: Automatizirani test održavanja tlaka za svaku komoru cijevi prije montaže.
      - name: Ispitivač odvajanja šava
        spec: Motorni 180° odvajanje pri 100 mm/min
        desc: Testiranje čvrstoće zavara i ljepila po šavu prema ISO 6185.
      - name: Ksenonska lampa za ispitivanje vremenskih uvjeta
        spec: 2000 sati izlaganja
        desc: UV ispitivanje otpornosti na promjenu boje i očuvanje čvrstoće.
