hero:
  tagline: Globalna prisutnost
  title: Opslužujemo 50+ zemalja<br />Na svakom kontinentu
  subtitle: Od europskih operatera obalne straže do australijskih distributera vodenih sportova i timova za spašavanje na Bliskom istoku — Aquafarer brodovi prisutni su na vodama širom svijeta.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer globalna proizvodnja i distribucija za nautiku
stats:
  title: Globalni doseg
  stats:
    - title: Zemlje
      amount: 50+
    - title: Izvozni tržišta
      amount: Europa, Amerike, Azija, Bliski istok, Oceanija
    - title: Proizvodnja
      amount: Qingdao, Kina
    - title: Skladište u SAD-u
      amount: Montclair, CA
features3_markets:
  tagline: Ključna tržišta
  title: Regionalna stručnost<br />za lokalne zahtjeve
  subtitle: Razumijemo da različita tržišta imaju različite zakonske zahtjeve, preferencije i načine upotrebe.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa i UK
      description: CE-certificirani proizvodi koji zadovoljavaju EN ISO 6185 standarde. Velika potražnja za RIBs, napuhavajućim čamcima i SUP daskama na tržištima EU. Distributeri u UK cijene našu brzu isporuku.
      icon: tabler:map-pin
    - title: Sjeverna Amerika
      description: Proizvodnja odobrena od strane američke Obalne straže. Skladište u SAD-u u Montclairu, CA za brzu isporuku na zapadnoj obali. Rastuća potražnja za ribarskim brodovima, spašavateljskim plovilima i rekreativnim SUPs.
      icon: tabler:map-pin
    - title: Australija i Oceanija
      description: Snažno tržište za RIB brodove i napuhavajuće gumenjake. Australijski distributeri cijene naše Hypalon brodove zbog otpornosti na UV u teškim sunčevim uvjetima. Brza dostava iz naše azijske tvornice.
      icon: tabler:map-pin
    - title: Bliski istok
      description: Rastuća potražnja za patrolnim i spašavateljskim brodovima. Naši aluminijski RIBs popularni su među operaterima obalne straže i sigurnosnim službama. Prilagođene konfiguracije za visoke temperature.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribucijska mreža
  title: Partnerstvo s distributerima<br />Širom svijeta
  subtitle: Surađujemo s etabliranim distributerima opreme za nautiku, OEM markama i državnim nabavnim agencijama.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM partnerstva
      description: Proizvodnja privatne robne marke za globalne brendove vodnih sportova. Mi se brinemo o svemu, od dizajna do proizvodnje i direktne dostave.
      icon: tabler:building
    - title: Distribucijska mreža
      description: Ovlašteni distributeri u 20+ zemalja drže zalihe i pružaju lokalnu podršku. Novi upiti distributera su dobrodošli.
      icon: tabler:users
    - title: Vlada i institucije
      description: Direktna opskrba obalnim stražama, organizacijama za potragu i spašavanje te programima vojne nabave. Usklađenost s institucionalnim zahtjevima nabave.
      icon: tabler:building-community
steps2_logistics:
  title: Globalna logistika i podrška
  subtitle: Od fabrike do odredišta — upravljamo cijelim opskrbnim lancem.
  items:
    - title: Opcije dostave
      description: Pomorski prijevoz (FOB Qingdao), zračni prijevoz za hitne narudžbe i brza kurirska dostava za uzorke i rezervne dijelove.
      icon: tabler:truck-delivery
    - title: Skladište u SAD-u
      description: 'Zalihe se drže u Montclairu, CA za brzu dostavu diljem Sjeverne Amerike. Zapadna obala: 2-3 dana, Srednja: 3-4 dana, Istočna obala: 4-5 dana.'
      icon: tabler:building-warehouse
    - title: Rezervni dijelovi
      description: Originalni Aquafarer rezervni dijelovi i potrošni materijal dostupni tijekom cijele godine. Uobičajeni dijelovi šalju se unutar 24 sata.
      icon: tabler:package
    - title: Tehnička podrška
      description: Direktna linija prema našem inženjerskom timu za tehnička pitanja, savjete za popravak i podršku pri preuređenju. Podržavamo brodove koje smo izgradili prije 20 godina.
      icon: tabler:headset
cta:
  title: Želite postati distributer?
  subtitle: Aktivno širimo našu distributivnu mrežu. Kontaktirajte naš izvozni tim kako biste razgovarali o mogućnostima partnerstva.
  actions:
    - variant: primary
      text: Upit za partnerstvo
      href: /contact
    - text: Pogledajte naš asortiman proizvoda
      href: /products
