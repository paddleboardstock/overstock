content_challenge:
  tagline: Izazov
  title: Zahtjevi akvakulture<br />Oprema otporna na slanu vodu
  subtitle: Ribnjaci, farme bisera i oceanske farme rade u najagresivnijem kemijskom morskom okruženju — dugotrajna izloženost slanoj vodi, ostaci goriva i hrane te svakodnevna kontinuirana upotreba.
  paragraphs:
    - Operacije akvakulture provode se 365 dana u godini na izloženim obalnim i off-shore lokacijama. Radni čamci koji se koriste za inspekciju kaveza, transport hrane, održavanje linija bisera i servisiranje opreme stalno su izloženi uranjanju u slanu vodu, UV izloženosti i kemijskom kontaktu s gorivom, ribljom hranom i tretmanima protiv rasta algi.
    - '**Korozija je glavni neprijatelj** — Standardna morska oprema brzo propada u ovim uvjetima. Izvanbrodski motori, okviri prikolica i oprema na trupu trebaju stalnu zamjenu. Operateri trebaju čamce izrađene od materijala otpornih na koroziju koji mogu izdržati godine u ovom okruženju bez propadanja.'
    - '**Dnevna pouzdanost je ključna** — Pokvaren radni čamac znači propuštene rasporede hranjenja, odgođene berbe i skupe gubitke u proizvodnji. Za farme bisera, jedan dan propuštene inspekcije može značiti značajnu štetu usjeva. Za ribnjake, odgođeno hranjenje utječe na stopu rasta i profitabilnost.'
    - Paddle Board Overstock akvakultura RIBs su dizajnirani s hardverom otpornim na koroziju, teškim Hypalon cijevima i ojačanim trupom dizajniranim posebno za zahtjevne uvjete uzgoja ribe, uzgoja bisera i oceanskih farmi.
content_solution:
  tagline: Naše rješenje
  title: Namjenski dizajn RIBs<br />Za industriju akvakulture
  subtitle: Svaki Paddle Board Overstock radni čamac za akvakulturu dizajniran je da izdrži agresivne uvjete slane vode dok pruža pouzdane svakodnevne performanse.
  list:
    - Marine-grade Hypalon cijevi — superiorna otpornost na UV, slanu vodu, goriva i kemikalije iz riblje hrane
    - 316 nehrđajući čelik kroz cijeli hardver — nema hrđe kod dugotrajne izloženosti slanoj vodi
    - Ojačane zaštite trupa i kobilice za ponovljene kontakte s dokom i kavezom
    - Paluba s automatskim odvodom za jednostavno pranje i isušivanje nakon transporta hrane i berbe
    - Konfiguracija ravne palube za prijevoz vreća hrane, spremnika za žetvu i opreme
    - Vanbrodske konfiguracije od 15 HP do 60 HP — optimizirane za nosivost u odnosu na učinkovitost goriva
    - Opcije boja cijevi visoke vidljivosti za jednostavno uočavanje na velikim poljoprivrednim površinama
content_segments:
  tagline: Profili akvakulture
  title: Rješenja za radne brodove<br />Prema vrsti akvakulture
  subtitle: Različite akvakulturne operacije zahtijevaju različite radne brodove — od malih agilnih RIBs za inspekciju ribljih kaveza do stabilnih transportnih platformi za uzgoj bisera i radne brodove za teški rad na oceanima.
  items:
    - title: Operacije uzgoja ribe
      subtitle: Inspekcija kaveza, transport hrane, podrška u žetvi
      description: Morske ribarske farme koriste kaveze na izloženim obalnim i offshore lokacijama. Radni brodovi se svakodnevno koriste za inspekciju mreža kaveza, hranidbene operacije, podršku u žetvi i održavanje opreme. Glavni izazov je korozija — brodovi su stalno izloženi slanoj vodi, ostacima hrane za ribe i gorivu. Pouzdan radni brod je ključan jer propušteno hranjenje ili odgođena žetva izravno utječu na proizvodnju i profitabilnost.
      features:
        - 'Paket za agresivno okruženje: okovi od nehrđajućeg čelika 316, komponente od legura pomorskog razreda'
        - Raspored ravne palube za transport vreća hrane i spremnika za žetvu
        - Paluba s automatskim odvodom za jednostavno pranje nakon operacija
        - Hypalon cijevi s kemijski otpornim premazom za izlaganje hrani i gorivu
        - Ojačani rubovi za čestu kontakt s kavezima i lukama
    - title: Operacije uzgoja bisera
      subtitle: Stabilan transport za inspekciju bisernih linija i žetvu
      description: Bisarne farme zahtijevaju stabilne i pouzdane radne brodove za svakodnevni transport između bisernih linija, inspekciju mreža kamenica i prikupljanje žetve. Ove operacije se odvijaju u udaljenim obalnim područjima s ograničenom infrastrukturom za održavanje. Brod mora biti dovoljno stabilan da posada može raditi dok inspektira biserne linije, s jednostavnim ukrcajem i dovoljno prostora na palubi za prijevoz ubrane kamenice, mreža i zaliha. Pouzdanost i jednostavno održavanje su ključni u udaljenim farmama.
      features:
        - Stabilan dizajn trupa za stajanje posade tijekom inspekcije bisernih linija
        - Ravna paluba s protivkliznom površinom za sigurno kretanje posade
        - Nizak bok za lak pristup mrežama i žetvi kamenica
        - Jednostavna vanbrodska konfiguracija za lak servis na licu mjesta
        - Paket cijevi i okova otpornih na koroziju za kontinuirano izlaganje slanoj vodi
    - title: Uzgoj na otvorenom moru i pomorska poboljšanja
      subtitle: Transport mladih jedinki, servisiranje kaveza, podrška u nadzoru
      description: Operacije uzgoja na otvorenom moru uključuju oslobađanje mladih jedinki u upravljane morske ekosustave, praćenje rasta i servisiranje poboljšanih struktura. Radni brodovi moraju transportirati žive mlade jedinke u aeriranim spremnicima, nositi opremu za nadzor i pristupiti plitkim obalnim lokacijama za otpuštanje. Dizajn trupa mora balansirati nosivost s plitkim gazom za pristup plažama i estuarijima.
      features:
        - Prostor na palubi za aerirane spremnike mladih jedinki i opremu za nadzor
        - Plitak gaz za pristup lokacijama za otpuštanje na plaži i estuariju
        - Jednostavno iskrcavanje na plaži — ojačani kobilica i zaštita pramca
        - Montažne točke za opremu za nadzor i uzorkovanje
        - Cijevi za teške uvjete Hypalon za izdržljivost u uvjetima mješovite pijeska i morske vode
