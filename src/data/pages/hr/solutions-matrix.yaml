hero:
  tagline: Matrica industrijskih rješenja
  title: Scenarijska pomorska rješenja<br />Za profesionalne operacije
  subtitle: Namjenski dizajnirana napuhavajuća plovila, RIBs konfigurirana za spašavanje, najam flote, tendere jahti i komercijalni ribolov — svaka potkrijepljena tehničkim specifikacijama i opcijama prilagodbe.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock Profesionalna pomorska rješenja za razne industrije
direct_answer: 'Paddle Board Overstock isporučuje scenarijski inženjerske napuhavajuće plovila i RIB rješenja za komercijalne pomorske operacije: spasilačke i patrolne čamce s Hypalon ojačanim cijevima i višekomornom sigurnošću, najam SUPs flote i kajake s šavovima promjera 1,2 mm PVC i vrućim zrakom za nisku trajnost održavanja, luksuzne brodove za jahte s dubokim V aluminijskim trupom RIBste teške ribarske konfiguracije s držačima za štapove i sustavima za livewell.'
solution_a:
  tagline: Rješenje A
  title: Morsko spašavanje i<br />Komercijalna patrola
  subtitle: Brza, višekomorna sigurnost RIBs za profesionalne hitne intervencije i policijske operacije.
  badge: Heavy-Duty Series
  description: Naše pomorske spasilačke i patrolne operacije RIBs izrađene su od HypalonPVC ojačanih visokogustoćnih / zračnih cijevi s višekomornim neovisnim plutajućim dizajnom. Svako plovilo opremljeno je profesionalnom reflektirajućom trakom, spasilačkim hvataljkama i ventilima za brzo napuhavanje radi spremnosti za isplovljavanje. Deep-V fiberglas trupovi pružaju iznimnu stabilnost pri velikim brzinama i u nemirnim morskim uvjetima.
  features:
    - title: Višekabinska sigurnost
      description: 4–6 neovisnih zračnih komora — svaka pojedinačna probušena komora održava pozitivnu flotaciju
    - title: Ojačana cijevna tkanina
      description: 1,2 mm Hypalon CSM ili 1.680 DTEX PVC mm s dvostrukim slojem zavarivanja na vrući zrak
    - title: Profesionalna razina
      description: SOLAS Reflektirajuća traka, užad za hvatanje za spašavanje, vučne kopče, brzoopuštajuća linija za slikanje
    - title: Trup za velike brzine
      description: Deep-V trup od stakloplastike ili aluminija ocijenjen za brzine od 25 do 45 čvorova, ovisno o konfiguraciji
  recommended_models:
    - RIB 450. patrola
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materijal trupa
      value: Stakloplastika / aluminij pomorske kvalitete
    - label: Cijevna tkanina
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Maksimalna brzina
      value: 25–45 čvorova
    - label: Kapacitet
      value: 6–12 osoba
    - label: Raspon motora
      value: 40–200 HP
    - label: Certifikacija
      value: CE / ISO 9001
solution_b:
  tagline: Rješenje B
  title: Najam vodnih sportova &<br />Oprema flote odmarališta
  subtitle: Izuzetno izdržljivi, za održavanje zahtjevaju malo napora, napuhavajući SUPs, kajaci i čamci izrađeni za svakodnevnu najamnu upotrebu u odmaralištima, klubovima i turističkim operacijama.
  badge: Rental-Grade
  description: Naša oprema za najam flotnih vozila dizajnirana je za najvišu izdržljivost i najniže troškove održavanja. Koristimo 1,2 mm ojačani PVC s trostrukom tehnologijom spajanja šavova vrućim zrakom koja odolijeva propadanju UV i čestim udarnim oštećenjima. Drop-stitch konstrukcija osigurava da daske zadrže čvrstoću čak i nakon stotina najamnih ciklusa. Svi modeli imaju ojačane D-prstenove, trake otpornosti na abraziju i ventile komercijalne kvalitete.
  features:
    - title: Komercijalna klasa PVC
      description: 1,2 mm ojačani PVC s UV stabilizatorima — 3x deblji od materijala potrošačke kvalitete
    - title: Spojevi zavareni vrućim zrakom
      description: Trostruko spajanje fuzijskim zavarivanjem — jače od ljepljenja, otporno na raslojavanje
    - title: Drop-Stitch Krutost
      description: 1.680 DTEX jezgri s 2 navoja/kvadratni inč — ocijenjeno na 20 PSI za čvrstoću sličnu vlaknastim pločama
    - title: Dizajn spreman za flotu
      description: Ojačani D-prstenovi, komercijalni Halkey-Roberts ventili, tračnice otporne na habanje
  recommended_models:
    - SUP Cheetah Nalet
    - SUP Okeanski Putnik
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materijal cijevi
      value: 1,0–1,2 mm Ojačano PVC
    - label: Tehnologija šava
      value: Troslojno vruće zračno zavarivanje
    - label: Maksimalni pritisak
      value: 15–20 PSI (drop-stitch modela)
    - label: UV otpornost
      value: 1.000+ sati ubrzanog testiranja
    - label: Jamstvo
      value: 2–5 godina, ovisno o modelu
    - label: Održavanje
      value: Minimalno — isprati i pohraniti
solution_c:
  tagline: Rješenje C
  title: Jahtini tenderi &<br />Luksuzna plovila
  subtitle: Laki, visokoučinkoviti RIB tenderi dizajnirani za skladištenje na superjahtama i prijevoz gostiju s luksuznim završnim detaljima.
  badge: Premium Series
  description: Naši jahtini tenderi RIBs kombiniraju laganu konstrukciju s luksuznom estetikom. Duboki V trupovi od aluminija ili stakloplastike pružaju izvanrednu kvalitetu vožnje i jednostavno podizanje dizalicom. Dostupni su s grafikom na cijevima u boji, premium tapecirungom i prilagođenim rasporedima konzole. Kompaktne dimenzije za skladištenje čine ih idealnima za garaže i palube superjahti.
  features:
    - title: Lagano Građenje
      description: Trupovi od aluminija morske kvalitete smanjuju težinu za 30% u usporedbi sa stakloplastikom za jednostavno podizanje
    - title: Deep-V Performanse
      description: Trup s deadriseom od 18–22 stupnja za glatku vožnju po valovitom moru i izvrsno praćenje kursa
    - title: Luksuzna Završna Obrada
      description: Prilagođeni tapecirung, cijevi u boji, premium konzola za kormilo, pakiranje od nehrđajućeg čelika
    - title: Kompaktno Skladištenje
      description: Dizajnirano za garaže superjahti — cijevi se mogu ispuhati za kompaktno spremanje
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Vrsta trupa
      value: Deep-V Aluminij / Stakloplastika
    - label: Deadrise
      value: 18–22 stupnja
    - label: Maksimalna brzina
      value: 30–40 čvorova
    - label: Suha Težina
      value: 120–350 kg (aluminijski trup)
    - label: Spremno za Dizalicu
      value: Da — točke podizanja standardne
    - label: Skladištenje
      value: Ispuhive cijevi, slagive
