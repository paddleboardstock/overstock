stories:
  - title: Kako je mediteransko odmaralište izgradilo profitabilni SUP posao najma
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: Odmaralište s 5 zvjezdica na plaži — Grčka
    problem: Odmaralištu su bile potrebne vrhunske vodene aktivnosti za goste kako bi povećali ocjene zadovoljstva i stvorili novi izvor prihoda, ali su im nedostajali oprema, sigurnosna infrastruktura i stručnost osoblja.
    solution: Aquafarer isporučio 50 ploča s prilagođenim brendom u bojama i logotipu odmarališta, kompletnim sigurnosnim sustavom uključujući spasilački punkt i linije za bovu, te 3-dnevni program obuke osoblja koji pokriva rukovanje opremom, upute gostima i sigurnosne protokole.
    result:
      - 300+ tjednih aktivnosti za goste rezervirano unutar prvog mjeseca
      - 'Ocjene zadovoljstva gostiju za vodene aktivnosti: 4.8/5'
      - 'Novi godišnji pomoćni prihod: 180.000 $'
      - Nula sigurnosnih incidenata u prvoj sezoni rada
      - Trošak zamjene opreme smanjen za 40% u odnosu na prethodnog dobavljača
    quote:
      text: Aquafarer nije samo isporučio ploče — pomogao nam je izgraditi kompletno iskustvo za goste. Naš program vodenih sportova od nule je postao vrhunac odmarališta u jednoj sezoni.
      author: Generalni direktor odmarališta
    cta_text: Izgradite svoje rješenje za odmaralište
    cta_href: /solutions/resorts
  - title: Kako je australski startup izgradio vodeni brend u 90 dana
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Poduzetnik po prvi put — Australija
    problem: Ljubitelj prirode želio je pokrenuti vlastiti SUP brend za australsko tržište, ali nije imao iskustvo u proizvodnji, veze s dobavljačima i imao je ograničeni kapital.
    solution: Brand Launch Package Aquafarer pružio je savjetovanje pri odabiru proizvoda, dizajn prilagođenog logotipa i boja, brendiranu maloprodajnu ambalažu s oznakama, dokumentaciju o CE certifikaciji, te FOB dostavu u Sydney.
    result:
      - Prva pošiljka od 200 ploča isporučena u roku od 75 dana od prvog kontakta
      - Brend lansiran na Shopify + Amazon AU unutar 2 tjedna od dolaska
      - Početni inventar prodan u roku od 45 dana
      - 'Prosječna marža: 55% na maloprodajne cijene'
      - 'Druga narudžba: 500 jedinica naručeno u roku od 60 dana od lansiranja'
    quote:
      text: Imao sam ideju za brend, ali nula znanja o proizvodnji. Aquafarer me doslovno vodio kroz cijeli proces — od odabira pravilnog dizajna ploče do otvaranja prve pošiljke. 90 dana od sna do isporuke.
      author: Osnivač, australski SUP brend
    cta_text: Pokrenite svoj brend
    cta_href: /solutions/entrepreneurs
  - title: Kako je tajlandski plažni klub povećao s 10 na 80 ploča
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Sportski klub za vodene sportove — Tajland
    problem: Mali klub na plaži u Phuketu trebao je prerasti iz hobističkog poslovanja u profesionalni najam opreme za turiste, ali nije mogao pronaći pouzdanog dobavljača opreme s dosljednom kvalitetom i cijenama.
    solution: Počevši s Aquafarer Paketom za početak kluba (10 dasaka, vesla, sigurnosna oprema, brendiranje), klub je rastao kroz program Premium paketa tijekom 18 mjeseci.
    result:
      - Povećano s 10 na 80 dasaka u 18 mjeseci uz dosljednu kvalitetu i cijene
      - Dodani najam kajaka i pedalina koristeći istog dobavljača
      - Prilagođeno brendiranje kluba povećalo prepoznatljivost brenda među turistima
      - Troškovi održavanja smanjeni za 60% u odnosu na prethodnu opremu
      - Sada se ostvaruje 150 + dnevnih najma tijekom vrhunca sezone
    quote:
      text: Paket za početak kluba bio je savršena ulazna točka. Kako je naše poslovanje raslo, Aquafarer je rasla s nama — ista kvaliteta, iste cijene, bez iznenađenja.
      author: Vlasnik kluba, Phuket
    cta_text: Započnite Vaš paket kluba
    cta_href: /solutions/clubs
  - title: Kako je lanac resorta u Karibima standardizirao vodene sportove u 5 objekata
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Lanac resorta — Karibi
    problem: Luksuzni lanac resorta s 5 objekata trebao je dosljednu kvalitetu opreme za vodene sportove i brendiranje u svim lokacijama, s centraliziranom nabavom i planiranjem sezonske zamjene.
    solution: 'Aquafarer isporučio je flotu opreme za više objekata: 300 SUPs i 100 kajaka s jedinstvenim brendingom, zajedničkim skladištem rezervnih dijelova te godišnjim rasporedom zamjene uz količinske cijene.'
    result:
      - Standardizirano iskustvo za goste u svih 5 objekata
      - Smanjenje troškova za 30% kroz objedinjenu nabavu i količinske cijene
      - Centralizirano skladište rezervnih dijelova smanjilo je zastoje za 80%
      - Godišnji program obnove opreme eliminirao je žurbu na kraju sezone
      - Sudjelovanje gostiju u vodenim sportovima povećano je za 45% iz godine u godinu
    cta_text: Dizajnirajte svoj program resorta
    cta_href: /solutions/resorts
