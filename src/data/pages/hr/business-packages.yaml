faq:
  title: Često postavljana pitanja o paketu
  questions:
    - q: Koja je minimalna količina narudžbe za pakete?
      a: Club Starter paket ima minimalno 10 jedinica. Paketi Resort i Brand prilagođeni su vašim potrebama s fleksibilnim MOQs.
    - q: Koliko traje isporuka?
      a: Standardna proizvodnja traje 30–45 dana od potvrde narudžbe. Ubrzana proizvodnja dostupna je uz dodatnu naknadu.
    - q: Mogu li prilagoditi boje opreme i brendiranje?
      a: Da. Svi paketi uključuju potpunu prilagodbu — boje dasaka, otisak logotipa i dizajn pakiranja.
    - q: Nudite li podršku nakon prodaje?
      a: Da. Svaki paket uključuje pristup našim online vodičima za održavanje, video tutorijalima i sustavu narudžbe rezervnih dijelova.
