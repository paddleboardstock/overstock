hero:
  tagline: Zašto Paddle Board Overstock
  title: Izgrađeno drugačije. Izgrađeno za posao.<br />Partner iza vodenih avantura širom svijeta
  subtitle: Ne samo proizvođač — poslovni partner koji dizajnira, projektira i isporučuje opremu komercijalne kvalitete za klubove, odmarališta, tvrtke za najam i nove vodene brendove.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock kvaliteta proizvodnje i stručnost
pillars:
  tagline: Tri stupa partnerstva
  title: Zašto svjetska vodena poduzeća biraju Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Dizajnirano za komercijalnu upotrebu
      description: Naša oprema je projektirana za svakodnevni najam, ne samo za rekreaciju vikendom. Oprema komercijalne kvalitete PVC, ojačana drop-stitch jezgra, UV-stabilne Hypalon opcije i ispitana oprema na terenu znače niže troškove održavanja, duži vijek trajanja i veći ROI za vaše poslovanje.
      icon: tabler:building-factory
      callToAction:
        text: Pogledajte komercijalnu liniju proizvoda
        href: /products
    - title: Od ideje do tržišta
      description: 'Pokrenite svoj brend vodenih sportova u 90 dana. Vodimo vas kroz svaki korak: provjeru koncepta, odabir proizvoda, prototip, proizvodnju, dizajn pakiranja i globalnu dostavu. Nema pritiska minimalne narudžbe — počnite s malim, skalirajte s povjerenjem.'
      icon: tabler:rocket
      callToAction:
        text: Započnite svoje putovanje brenda
        href: /oem-odm-blueprint
    - title: Izgrađeno za globalne uvjete
      description: 'Proizvodi optimizirani za svaku klimu: formulacije za hladnu vodu PVC za Europu, materijali otporni na UV za Bliski istok i Australiju, tretmani protiv vlage za jugoistočnu Aziju. Svaka pošiljka je prilagođena svojoj odredišnoj sredini.'
      icon: tabler:world
