reasons:
  tagline: Razlika Paddle Board Overstock
  title: Što nas izdvaja
  isBeforeContent: false
  columns: 3
  items:
    - title: Prava proizvodnja, ne trgovina
      description: Posjedujemo i upravljamo tvornicom od 12.000 m². Kada surađujete s Paddle Board Overstock, radite izravno s ljudima koji dizajniraju, inženjerski izrađuju i proizvode vaše proizvode — bez posrednika.
      icon: tabler:building-factory
    - title: Pristup vođen inženjeringom
      description: Naš proces dizajna počinje s upotrebnom svrhom, a ne kategorijom proizvoda. Optimiziramo oblik trupa, izbor materijala i konfiguraciju prema načinu na koji će se oprema stvarno koristiti u komercijalnim okruženjima.
      icon: tabler:engine
    - title: Certificirana kvaliteta
      description: CE certificirano, ISO sustav kvalitete, BSCI sukladno, REACH sukladno, USCG odobreni prsluci za spašavanje tipa III/V; svi proizvodi udovoljavaju važećim međunarodnim standardima.
      icon: tabler:certificate
    - title: Fleksibilno OEM/ODM
      description: Boje cijevi, raspored konzole, brendiranje, pakiranje — prilagođavamo prema vašim specifikacijama. Nema pritiska na minimalnu narudžbu. Počnite s prototipom, povećavajte s povjerenjem.
      icon: tabler:adjustments
    - title: Globalna logistika
      description: Skladište u SAD-u u Kaliforniji, direktna dostava iz Qingdaoa, zračni prijevoz za hitne narudžbe. Mi se brinemo za carinsku papirologiju i dokumentaciju širom svijeta.
      icon: tabler:truck-delivery
    - title: Doživotna podrška
      description: Podupiremo brodove koje smo izgradili prije 20 godina. Originalni rezervni dijelovi, tehnički savjeti, upute za popravak — naš tim je dostupan kad vam zatrebamo, gdje god se nalazili.
      icon: tabler:lifebuoy
testimonials:
  tagline: Pouzdano od strane brendova širom svijeta
  title: Što naši partneri kažu
  items:
    - content: Radili smo s nekoliko proizvođača u Kini, ali Paddle Board Overstock se ističe njihovom inženjerskom podrškom i dosljednom kvalitetom. Svoje ponašaju prema našem brendu kao da je njihov vlastiti.
      name: — OEM Partner, europski brend vodenih sportova
    - content: Njihovi Hypalon RIBs koriste se u našoj floti više od 5 godina. Minimalno održavanje, izvrsna otpornost UV. Petogodišnje jamstvo na cijevi daje nam povjerenje.
      name: — Operater flote, ljetovališni kompleks na Bliskom istoku
    - content: Paddle Board Overstock tim pomogao nam je razviti prilagođeni SUP dizajn daske od koncepta do proizvodnje u 90 dana. Kvaliteta je nadmašila naša očekivanja.
      name: — Distributer, australski vodeni sportovi
    - content: Kao vlasnik malog poduzeća, brinuo sam se zbog MOQs. Paddle Board Overstock je radio s mojim proračunom i pomogao mi lansirati moj brend s samo 50 dasaka. Sad naručujem 500.
      name: — Osnivač brenda, američka SUP tvrtka za najam
