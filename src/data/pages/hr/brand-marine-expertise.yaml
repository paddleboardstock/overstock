hero:
  tagline: Pomorska stručnost
  title: Desetljeća pomorskog inženjerstva<br />u svakom trupu
  subtitle: Aquafarer kombinira duboko znanje o materijalima, preciznu proizvodnju i testiranje u stvarnom svijetu kako bi stvorio plovila koja funkcioniraju kada je to važno.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer tim za pomorsko inženjerstvo i R&D u radu
expertise_materials:
  tagline: Znanost o materijalima
  title: Odabir pravog materijala<br />za svaku primjenu
  subtitle: Radimo s tri osnovna materijala – svaki odabran za specifične slučajeve uporabe i zahtjeve performansi.
  columns: 3
  items:
    - title: Pomorski razred PVC
      description: 1100 denier PVC tkanina – naš najsvestraniji materijal. UV-stabiliziran, otporan na habanje i u skladu s REACH. Idealno za rekreativne čamce, SUP daske i kajake gdje su važni težina i isplativost.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Izvrsna kemijska otpornost i stabilnost UV. Hypalon čamci mogu trajati 15–20 godina uz pravilnu njegu. Preporučeno za komercijalne, spasilačke i vojne primjene gdje je dugoročna izdržljivost ključna.
      icon: tabler:shield
    - title: Stakloplastika i aluminij
      description: Trupovi od stakloplastike Deep-V za RIBs i ophodne čamce – performanse rezanja valova u teškim uvjetima. Aluminijski trupovi za teška komercijalna radna plovila koja zahtijevaju maksimalnu čvrstoću i nosivost.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Proizvodne mogućnosti
  title: Precizna proizvodnja<br />u svakom koraku
  subtitle: Naš pogon od 12.000 m² opremljen je specijaliziranom opremom za svaku fazu proizvodnje.
  columns: 2
  items:
    - title: CNC Rezanje
      description: Računalno upravljano rezanje osigurava precizne, ponovljive tkaninske panele s minimalnim otpadom. Svaki dio odgovara točno onako kako je dizajniran.
      icon: tabler:cpu
    - title: Visokofrekventno zavarivanje
      description: Industrijsko HF zavarivanje stvara šavove jače od osnovnog materijala. Kontrola temperature i tlaka osigurava zrakonepropusno zavarivanje tijekom cijelog proizvodnog procesa.
      icon: tabler:bolt
    - title: Sastavljanje s Drop Stitch jezgrom
      description: Tisuće poliesterskih niti povezuje gornje i donje slojeve tkanine, omogućujući visokotlačno napuhavanje (15–20 PSI) za krute, stabilne SUP daske i podove.
      icon: tabler:building-arch
    - title: Testiranje tlaka
      description: Svaki napuhujući proizvod testira se na tlak prije isporuke. RIB cijevi testiraju se na 1,25x nazivne tlačne vrijednosti – ako izdrže, performirat će na vodi.
      icon: tabler:wind
    - title: Testiranje čvrstoće šava
      description: Nasumični uzorci iz svake proizvodne serije podvrgavaju se destruktivnom testiranju čvrstoće šava. Rezultati se bilježe i mogu se pratiti do specifičnih proizvodnih serija.
      icon: tabler:files
    - title: Testiranje na vodi
      description: Svaki RIB model prolazi pomorske probe prije certificiranja. Testiranje u stvarnim obalnim uvjetima potvrđuje performanse, upravljanje i stabilnost.
      icon: tabler:ripple
expertise_design:
  tagline: Dizajn i inženjering
  title: Projektirano za stvarne uvjete
  subtitle: Naša filozofija dizajna započinje s načinom na koji će se brod koristiti — zatim se inženjering gradi oko te upotrebe.
  items:
    - title: Dizajn trupa u obliku dubokog V
      description: Naši stakloplastični trupovi imaju izračunate kutove deadrise optimizirane za duljinu i namjenu svakog modela. Strmiji V za performanse u nemirnim vodama, plići za stabilnost.
    - title: Višekabinska sigurnost
      description: Svaki brod ima 3-7 neovisnih zračnih komora. Ako je jedna komora oštećena, preostale komore drže brod na površini i operativnim.
    - title: Ergonomski raspored
      description: Pozicija konzole, visina tubusa i položaj sjedala dizajnirani su s obzirom na udobnost operatera tijekom duže upotrebe — bilo da patrolira, lovi ribu ili prevozi.
    - title: Prilagođena konfiguracija
      description: Boje tubusa, konfiguracija konzole, kapacitet goriva, nosači dodatne opreme — svaki se model može prilagoditi kako bi odgovarao specifičnim operativnim zahtjevima.
cta:
  title: Imate li specifičnu primjenu na umu?
  subtitle: Naš inženjerski tim može savjetovati o odabiru materijala, dizajnu i proizvodnji za vaš projekt.
  actions:
