hero_text:
  tagline: Resursi
  title: Centar za preuzimanje i vodiči za kupce
  subtitle: Pristupite katalogu proizvoda, OEM vodičima, kontrolnim listama za kupce i tehničkoj dokumentaciji koja će vam pomoći pri donošenju informiranih odluka o nabavi.
features3_downloads:
  tagline: Preuzimanja
  title: Dokumentacija o proizvodu<br />i resursi za kupce
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog pomorskih proizvoda 2026.
      description: Cijeli raspon proizvoda uključujući RIB brodove, napuhavajuće čamce, SUP daske, kajake i dodatke. Specifikacije, konfiguracije i opcije. PDF format.
      icon: tabler:file-text
    - title: OEM Vodič za proizvodnju
      description: 'Sve što trebate znati o OEM/ODM partnerstvima: pregled procesa, minimalne količine narudžbe, opcije prilagodbe, kontrola kvalitete i dostava.'
      icon: tabler:building-factory
    - title: RIB Vodič za kupce brodova
      description: 'Kako odabrati pravi RIB: materijali trupa, materijali cijevi, izbor motora, razmatranja veličine i opcije konfiguracije za različite primjene.'
      icon: tabler:file-description
    - title: SUP Kontrolna lista dobavljača
      description: 'Ključni čimbenici pri odabiru proizvođača SUP dasaka: pokazatelji kvalitete, zahtjevi za certifikate, MOQ razmatranja i na što obratiti pažnju tijekom audita tvornice.'
      icon: tabler:clipboard-check
    - title: Vodič za materijale napuhavajućih čamaca
      description: 'PVC vs Hypalon: usporedba izdržljivosti, otpornosti na UV, vijeka trajanja, opcija popravka i troškova za različite pomorske primjene.'
      icon: tabler:files
    - title: Predložak prilagođenog izrade proizvoda
      description: Preuzmite naš predložak tehničkog opisa proizvoda. Ispunite svoje zahtjeve i pošaljite nam za ponudu i procjenu izvedivosti u istom tjednu.
      icon: tabler:template
faqs:
  title: Najčešće postavljana pitanja
  subtitle: Uobičajena pitanja o našim proizvodima, proizvodnom procesu i modelu partnerstva.
  columns: 2
  items:
    - title: Koja je minimalna količina narudžbe?
      description: MOQ varira ovisno o kategoriji proizvoda. RIB brodovi obično počinju od 10 jedinica po modelu. SUP daske od 50 jedinica. Kontaktirajte naš prodajni tim za specifične informacije o MOQ.
      icon: tabler:help-circle
    - title: Mogu li dobiti uzorke prije narudžbe?
      description: Da. Paddle Board Overstock omogućuje izradu uzoraka za procjenu prije masovne proizvodnje. Troškovi uzoraka su pregovarajući i često se uračunavaju u prvu proizvodnu narudžbu.
      icon: tabler:package
    - title: Koji uvjeti plaćanja su dostupni?
      description: Standardni uvjeti su 30% pologa prilikom narudžbe, 70% prije isporuke. LC uvjeti dostupni za kvalificirane kupce. Kontaktirajte naš financijski tim za dogovor.
      icon: tabler:currency-dollar
    - title: Koliko traje proizvodnja?
      description: 'Tipični rokovi isporuke: RIB brodovi 30-45 dana, SUP daske 20-30 dana, napuhavajući čamci 25-35 dana. Prilagođeni razvoj dodaje 15-30 dana za izradu prototipa.'
      icon: tabler:calendar-clock
    - title: Koje certifikate posjeduju vaši proizvodi?
      description: CE certifikat za tržišta EU, proizvodnja odobrena od strane Obalne straže SAD-a, ISO sustav kvalitete, BSCI usklađenost i REACH usklađenost materijala.
      icon: tabler:certificate
    - title: Nudite li prilagođeno pakiranje i brendiranje?
      description: Da. Nudimo prilagođeno pakiranje s vašim logotipom, bojama i identitetom brenda. MOQ za prilagođeno pakiranje ovisi o kategoriji proizvoda.
      icon: tabler:color-swatch
cta:
  title: Trebate li pomoć u pronalaženju pravog resursa?
  subtitle: Kontaktirajte naš tim za personalizirane smjernice o odabiru proizvoda, OEM partnerstvima ili tehničkim specifikacijama.
  actions:
    - variant: primary
      text: Kontaktirajte naš tim
      href: /contact
