features3_certifications:
  title: Certifikati i sukladnost
  subtitle: Svaki proizvod se neovisno testira; 64 modela su CE certificirana prema međunarodnim standardima.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Certifikacija
      description: 64 modela certificiranih po CE standardu za SUPs, kajake, čamce i RIBs udovoljavaju europskom CE sigurnosnom standardu za rekreativne plovne objekte. Svaki proizvod prolazi testiranje tlaka, plovnosti i opterećenja prije napuštanja tvornice.
      icon: tabler:certificate
    - title: ''
      description: Naš pogon u Qingdauu od 12.000 m² radi prema sustavu upravljanja kvalitetom ISO 9001. Svaka proizvodna serija je pratljiva, dokumentirana i pregledana.
      icon: tabler:clipboard-check
    - title: BSCI Društvena usklađenost
      description: Mi smo certificirani prema BSCI, što osigurava etičke radne prakse, sigurne radne uvjete i odgovornost prema okolišu u cijelom našem opskrbnom lancu.
      icon: tabler:users
    - title: REACH & RoHS
      description: Svi materijali — PVC, Hypalon, EVA pjena, ljepila — u skladu su s EU REACH i RoHS propisima. Nema zabranjenih tvari, nema kompromisa.
      icon: tabler:flask
    - title: Laboratorij za ispitivanje materijala
      description: Laboratorijski testovi materijala u tvrtki ispituju vlačnu čvrstoću, otpornost na UV, integritet šava i otpornost na habanje svakog tkanog serijala prije proizvodnje.
      icon: tabler:microscope
    - title: 5-godišnje jamstvo za brod
      description: Paddle Board Overstock čamci imaju ograničeno 5-godišnje jamstvo na tkaninu cijevi, šavove i trup. SUP daske i dodaci imaju 2-godišnje jamstvo. Stojimo iza onoga što smo izgradili.
      icon: tabler:shield-check
testimonials:
  tagline: Povjerenje kupaca
  title: Što naši kupci kažu
  subtitle: Od početnika u veslanju do profesionalnih upravitelja flota — pogledajte zašto vjeruju Paddle Board Overstock.
  items:
    - content: Cijelu našu flotu za najam opremili smo s Paddle Board Overstock RIBs — 12 brodova na tri lokacije. Dvije sezone, bez ijednog kvara. CE Certifikacijska dokumentacija omogućila je odobrenje osiguranja besprijekornim. Njihov inženjerski tim čak je prilagodio boje cijevi da odgovaraju našem brendu.
      name: Marco Valenti
      title: Direktor operacija, Adriatic Adventure Tours — Dubrovnik, Hrvatska
    - content: Kao kupac po prvi put, bio sam nervozan zbog kvalitete narudžbe iz inozemstva. Dokumentacija ISO i izvještaji trećih strana koje su podijelili prije nego što sam uopće pitao dali su mi potpunu sigurnost. Daska je stigla za 6 dana i nadmašila moja očekivanja.
      name: James Thornton
      title: SUP Vlasnik Explorer 11 — Vancouver, Kanada
    - content: Upravljamo s 24 Paddle Board Overstock RIBs unutar naše pokretne patrolne flote. Njihov QC proces je dosljedan za svaku seriju — ista kvaliteta šava, isto postavljanje ventila, isti tlak svaki put. Ta ponovljivost je bitna kad životi ovise o opremi.
      name: Poručnik zapovjednik Andres Reyes
      title: Pomorski službenik za nabavu, pomoćna služba Filipinske obalne straže — Manila, Filipini
features3_lab:
  title: Interni laboratorij za testiranje i kvalitetu
  subtitle: Svaka serija materijala i gotov proizvod prolaze kroz naš laboratorij za testiranje na licu mjesta prije slanja.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ispitivanje vlačne čvrstoće
      description: 'PVC Svaka rola tkanine testirana je prema ASTM D751 standardima. Minimalni zahtjev: osnova i potka od 350 N/cm. Odbijene serije vraćaju se dobavljaču — odbijamo otprilike 3% pristiglih materijala.'
      icon: tabler:scale
    - title: UV Ubrzano starenje
      description: Uzorci tkanina prolaze QUV ubrzano trošenje od 1.000 sati (ASTM G154). Zadržavanje vlačne čvrstoće mora premašiti 80% nakon UV izlaganja. Proizvodi su ocijenjeni za+ 3 godine vanjske uporabe.
      icon: tabler:sun
    - title: Čvrstoća kore šava
      description: RF zavarivani spojevi testirani na minimalnoj čvrstoći od 5 N/mm (ASTM D751). Ručno lijepljeni Hypalon spojevi testirani na 3,5 N/mm. Svaka proizvodna serija ima uzorke šavova destruktivno testirane i arhivirane.
      icon: tabler:stack
    - title: 24–48 sati zadržavanja tlaka
      description: 'Svaki napuhujući proizvod napuhan na 1,25x ocijenjen PSI i praćen 24–48 sati. Maksimalni dopušteni pad tlaka: 5%. Proizvodi koji ne prođu ovaj test ponovno se obrađuju i testiraju prije isporuke.'
      icon: tabler:wind
    - title: Testiranje ciklusa ventila
      description: Svaki dizajn ventila prolazi kroz 10.000 ciklusa otvaranja i zatvaranja u našem laboratoriju. Ventili moraju održavati hermetički zatvoreni tlak na 1,25x nazivnom tlaku nakon ciklusa. Svi Paddle Board Overstock ventili su predviđeni za+ 5 godina redovite uporabe.
      icon: tabler:rotate
    - title: Otpornost na hladne pukotine
      description: Materijali testirani na -30°C tijekom 4 sata prema ISO 4646. Nije dopušteno pucanje niti lomljivost. Proizvodi namijenjeni za zimsko skladištenje i hladnu vodu do -10°C na temperaturi okoline.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kako osiguravamo kvalitetu
  subtitle: Od pregleda sirovina do završnog testiranja pod tlakom — svaki proizvod prolazi kroz rigorozan lanac kvalitete.
  items:
    - title: Inspekcija sirovina
      description: Svaka rola PVC tkanine testira se na debljinu, vlačnu čvrstoću i UV otpornost prije ulaska u proizvodnju.
      icon: tabler:search
    - title: Kontrola kvalitete u procesu
      description: Spojevi zavarivanja, instalacije ventila i spojevi komora pregledaju se na svakoj stanici tijekom sklapanja.
      icon: tabler:eye
    - title: Testiranje tlaka
      description: Svaki napuhujući proizvod napuhuje se na 1,25x i PSI drži 24–48 sati radi provjere zadržavanja zraka i integriteta šavova.
      icon: tabler:wind
    - title: Završna inspekcija
      description: Svaka jedinica se pregledava na završnu obradu, hardver i pakiranje prije nego što bude odobrena za otpremu. Uzorci iz serije idu u naš laboratorij na destruktivna ispitivanja.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Često postavljana pitanja o brodovima
  subtitle: Česta pitanja o našim napuhavajućim čamcima s krutim trupom.
  columns: 2
  items:
    - title: Koje veličine RIB čamaca Paddle Board Overstock nudi?
      description: Nudimo 35 modela duljine RIB od 2,5 m do 7,6 m, pokrivajući sve od kompaktnih tendera do teških komercijalnih i patrolnih plovila. Svaki model dostupan je s više konfiguracijskih opcija.
    - title: Koja je razlika između RIB i tradicionalnog napuhavajućeg čamca?
      description: (RIBRigid-Hull Inflatable Boat) kombinira čvrsti trup od stakloplastike ili aluminija s dubokim V trupom s napuhivačem Hypalon ili PVC cijevima. To vam daje stabilnost i nosivost tvrdog čamca uz apsorpciju udaraca i plovnost napuhavajućeg čamca.
    - title: S kojim su motorima kompatibilni Paddle Board Overstock RIBs?
      description: Naši RIBs vanjski motori podržavaju motore od 3 HP do 250 HP , ovisno o modelu. Svaka stranica proizvoda navodi maksimalnu nazivnu snagu motora. Preporučujemo da se konzultirate sa svojim zastupnikom za idealno podudaranje.
    - title: Jesu li Paddle Board Overstock RIBs CE certificirani?
      description: Da. RIB Svi rekreativni modeli certificirani su CE prema važećim europskim standardima za rekreativna plovila. Komercijalni i patrolni modeli ispunjavaju dodatne zahtjeve za stabilnost i opterećenje.
    - title: Koja je garancija za RIB brodove?
      description: Svi Paddle Board Overstock RIBs dolaze s ograničenim jamstvom od 5 godina na tkaninu cijevi, spojeve i trup; ventili za napuhavanje pokriveni na 5 godina; tvornički ugrađeni dodaci pokriveni na 1 godinu.
    - title: Koliko zračnih komora Paddle Board Overstock RIBs zapravo ima?
      description: RIBs Imamo 3 do 7 neovisnih zračnih komora, ovisno o duljini modela. Ovaj višekomorni dizajn osigurava da brod ostane na površini čak i ako je jedan odjeljak oštećen.
faqs_inflatable:
  title: Često postavljana pitanja o napuhanim čamcima
  subtitle: Česta pitanja o našim napuhavajućim čamcima, kajacima i čamcima.
  columns: 2
  items:
    - title: Koji se materijali koriste u Paddle Board Overstock napuhavajućim čamcima?
      description: Koristimo vojnu PVC klasu (1100 denier) i premium Hypalon/CSM gumu, ovisno o modelu. Oba materijala su UVstabilizirana, otporna na habanje i usklađena s REACH RoHS EU i propisima.
    - title: Koliko dugo traju čamci na napuhavanje?
      description: Uz pravilnu njegu, PVC kvalitetan napuhujući čamac traje 7–10 godina, dok Hypalon modeli mogu trajati 15–20 godina. Redovito čišćenje, UV zaštita i pravilno skladištenje značajno produžuju vijek trajanja.
    - title: Koje održavanje je potrebno za napuhujući čamac?
      description: Osnovno održavanje uključuje ispiranje svježom vodom nakon svake upotrebe (posebno u slanoj vodi), sušenje prije skladištenja, godišnju provjeru brtvi ventila i nanošenje UV zaštitnog sredstva na cijevi. Izbjegavajte dugotrajno izlaganje suncu kada se ne koristi.
    - title: Mogu li se napuhujući čamci koristiti u slanoj vodi?
      description: Da. Svi Paddle Board Overstock napuhujući čamci dizajnirani su i za upotrebu u slatkoj i za slanu vodu. Preporučujemo ispiranje svježom vodom i temeljito sušenje nakon izlaganja slanoj vodi kako bi se spriječila korozija i kristalizacija tkanine solju.
    - title: Kako spremiti napuhujući čamac?
      description: Ispuhnite ga, očistite i potpuno osušite brod prije skladištenja. Valjajte labavo (izbjegavajte uske preklope), čuvajte ga na hladnom i suhom mjestu daleko od izravne sunčeve svjetlosti i držite se podalje od betonskih podova kako biste spriječili upijanje vlage.
    - title: Kolika je nosivost Paddle Board Overstock napuhanih čamaca?
      description: Nosivosti se kreću od 290 kg za naše najmanje modele do preko 2000 kg za veće komercijalne letjelice. Svaka stranica proizvoda navodi maksimalnu nosivost za vaš specifični model.
faqs_sup:
  title: SUP Često postavljana pitanja odbora
  subtitle: Česta pitanja o našim daskama za veslanje u stajanju.
  columns: 2
  items:
    - title: SUP Koje su veličine ploča dostupne?
      description: Nudimo SUP daske od 9 ft do 12 ft, uključujući univerzalne, touring, joga i specijalizirane dizajne. Naši najprodavaniji modeli uključuju Tropical Breeze (10 ft) i Ocean Voyager (11 ft).
    - title: Što drop-stitch je građevinarstvo?
      description: Drop-stitch Konstrukcija koristi tisuće poliesterskih niti koji povezuju gornji i donji sloj daske, što joj omogućuje držanje visokog zračnog tlaka (15–20PSI) i postizanje krute, stabilne platforme. Ovo je industrijski standard za premium napuhavajuće pločeSUPs.
    - title: Koja je težinska granica za SUP daske?
      description: Naše SUP daske podržavaju do 150 kg, ovisno o modelu i volumenu. Leviathan Wake daska je naš model s najvećim kapacitetom, dizajniran za veće vozače i korištenje joge.
    - title: Nudite li SUP kompletne pakete?
      description: Da. Svaka SUP daska dolazi s kompletnim paketom koji uključuje aluminijsku lopaticu od 3 dijela, ručnu pumpu pod visokim tlakom, povodac za zavojnicu, putni ruksak i komplet za popravak. Neki modeli također uključuju uklonjivi set peraja.
    - title: Koja je garancija na SUP pločama?
      description: Sve Paddle Board Overstock SUP ploče imaju dvogodišnje jamstvo protiv proizvodnih nedostataka, uključujući kvar spoja, nedostatke ventila i delaminaciju materijala pri normalnoj upotrebi.
    - title: Koliko dugo traje napuhavanje SUP daske?
      description: Korištenjem priložene ručne pumpe, potpuno napuhavanje do 15 PSI stupnjeva traje otprilike 8–12 minuta. Za brže napuhavanje preporučujemo našu Paddle Board Overstock 12V električnu pumpu, koja napuhuje ploču za manje od 4 minute.
