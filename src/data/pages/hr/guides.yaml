hero:
  tagline: Vodiči
  title: Novi ste na SUP?
  subtitle: Praktični vodiči koji će vam pomoći odabrati, koristiti i uživati ​​u opremi za vodene sportove na napuhavanje.
size_guide:
  tagline: Veličina i specifikacije
  title: Pronađite pravu veličinu za svoje potrebe
  desc: Usporedite dimenzije proizvoda, nosivost i preporučene namjene. Bilo da trebate touring SUP, kompaktni kajak ili komercijalni RIB — naš vodič za veličinu pomaže vam odabrati pravi izbor.
  link_label: Cjeloviti vodič za veličine s informacijama o proizvodu →
  link: /size-guide
  cards:
    - title: SUP Ploče
      desc: Odaberite duljinu prema svojoj težini i namjeni. Šire daske (32"+) nude veću stabilnost. Duže daske (11–12 ft) bolje prate putanju za touring.
    - title: Kajaci
      desc: Jednostavni kajaci (9 ft) za solo putovanja i rijeke. Tandem kajaci (12 ft) za dvoje veslača ili jednog s opremom. Uvijek provjerite nosivost.
    - title: Čamci i RIBs
      desc: Odaberite duljinu prema broju putnika i upotrebi. Veći RIBs (4,5 m+) za otvoreno more i spašavanje. Manji čamci (2,7 m) kao pomoćni brodovi i platforme za ribolov.
