hero:
  tagline: Životni stil
  title: The Paddle Board Overstock<br />Životni stil
  subtitle: Izgrađeno za one koji žive na vodi — od vikend istraživača do komercijalnih operatera koji se svakodnevno oslanjaju na svoju opremu.
values:
  - icon: 🌊
    title: Rođeno na vodi
    desc: Svaki dizajn započinje razumijevanjem ponašanja vode. Projektiramo od ruba uvjeta prema unutra — jer je ocean naš učitelj, a ne radno mjesto.
  - icon: 🔧
    title: Izgrađeno da traje
    desc: Najodrživiji proizvod je onaj koji ne treba zamjenu. Materijali marine-grade, drop-stitch jezgre ocijenjene na 15 PSI i šavovi koji nadživljavaju sezonu.
  - icon: 🏆
    title: Pristupačno po dizajnu
    desc: Vodni sportovi ne smiju biti luksuz. Profesionalna izvedba po cijeni koja ima smisla za obitelji, vodiče i male operatere — ne samo za komercijalne flote.
  - icon: 🌍
    title: Globalna zajednica
    desc: 'Od obala Qingdaoa do jezera u Europi, rijeka u jugoistočnoj Aziji i zaljeva u Americi — naši kupci dijele jednu stvar: ljubav prema boravku na vodi.'
  - icon: ♻️
    title: Odgovorna proizvodnja
    desc: CNC - optimizirani nesting smanjuje otpad materijala ispod 5%. Izdržljiva konstrukcija smanjuje cikluse zamjene. Gradimo za dugovječnost jer je to najodrživiji izbor.
  - icon: 🤝
    title: Podrška koja traje
    desc: Dvadeset godina stari trupovi još nas zovu zbog rezervnih dijelova. Naš prosjek odgovora na jamstvo je 24 sata. Ne nestajemo nakon prodaje — tu smo za život proizvoda.
