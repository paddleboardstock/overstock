content_challenge:
  tagline: Izazov
  title: Zašto ronilački centri trebaju<br />brodove izrađene za svrhu
  subtitle: Ronioca operacije postavljaju jedinstvene zahtjeve za plovilima — zahtjeve koje opći brodovi često ne mogu ispuniti.
  paragraphs:
    - Komercijalni ronilački centri rade 200-300 dana godišnje, obavljajući 3-5 ronilačkih tura dnevno. Svaka tura zahtijeva prijevoz 10-20 ronilačkih boca, kompletne BCD opreme, regulatore, peraje, maske, sigurnosnu opremu, instruktorsku opremu i putnike. Obični brod jednostavno ne može podnijeti ovu operativnu intenzivnost.
    - '**Ograničen prostor na palubi** — Većina rekreativnih brodova dizajnirana je za brzinu i udobnost putnika, a ne za rukovanje opremom. Kad boce, oprema i ronioci dijele isti prostor, vrijeme pripreme se povećava, kretanje postaje teško, a sigurnosni rizici rastu.'
    - '**Teško ukrcavanje ronioca** — Međunarodni turisti, prvi put ronioci i stariji putnici trebaju siguran i jednostavan ulazak i izlazak. Visoka pozicija za ukrcaj, ograničena mogućnost držanja za ruke i nestabilne platforme stvaraju nelagodu i sigurnosne opasnosti — posebno kada ronioci nose 30 kg opreme.'
    - '**Korozija od slane vode i UV oštećenja** — Tropska okruženja ubrzavaju degradaciju materijala. Standardne PVC cijevi mogu izblijedjeti, procureti i zahtijevati zamjenu unutar 3 godine. Korozija metalnih komponenti povećava troškove održavanja i zastoja u radu.'
    - '**Stabilnost u mirovanju** — Ronioci trebaju stabilnu platformu pri opremanju, ulasku u vodu i povratku na brod. Nedostatak stabilnosti stvara sigurnosne rizike i negativno utječe na iskustvo korisnika.'
    - '**Visoki troškovi rada** — Učinkovitost goriva je važna kada se svakodnevno obavlja više tura. Brod koji troši više goriva izravno smanjuje profit. Komercijalni ronilački operateri više vode računa o dnevnim troškovima rada nego o najvećoj brzini.'
content_solution:
  tagline: Naše rješenje
  title: Dizajnirano prema stvarnim<br />Ronioci operacije
  subtitle: Svaki Paddle Board Overstock ronilački RIB konfiguriran je za specifične potrebe komercijalnih ronilačkih centara — nije prilagođen iz rekreativnog dizajna broda.
  list:
    - Veliki radni raspored palube — dizajniran za pohranu ronilačkih boca, pripremu opreme i kretanje ronioca, a ne samo za sjedenje putnika
    - Profesionalni sustav ronilačkih ljestvi s rukohvatima od nehrđajućeg čelika — širok, nizak ukrcaj za siguran i jednostavan ulazak i izlazak ronioca
    - Ekstra široke Hypalon ili PVC cijevi — omogućuju stabilnu platformu za ukrcaj i poboljšavaju plovnost kada se ronioci kreću po palubi
    - Integrirani nosači za spremnike — održavaju nisku težinu, prostor čistim i opremu organiziranom za brži promet
    - Površina palube protiv klizanja EVA — smanjuje rizik od klizanja kada je paluba mokra i ronioci se kreću u teškoj opremi
    - Konzola je postavljena za jasnu vidljivost ronilaca u vodi — ključno za nadzor sigurnosti instruktora
    - Opcije motora od 40 HP do 115 HP — konfiguracija s jednim ili dva motora, optimizirana za ekonomičnost goriva tijekom više dnevnih vožnji
    - Pomorska građevina — teške cijevi s UV otpornošću na slanu vodu, ojačana konstrukcija za svakodnevnu komercijalnu upotrebu
    - Prilagođene konfiguracije ronilačkih ljestava i platformi — prilagođene vašoj radnoj dubini vode i profilu ronioca
    - Montažne ploče opreme za sonar, GPS i komunikacijsku opremu
content_models:
  tagline: Preporučeni modeli
  title: Konfiguracije ronjenja RIB
  subtitle: Naši RIB najpopularniji ronilački modeli — svaki dostupan s prilagođenom konfiguracijom za ronjenje.
  items:
    - title: RIB 500 Ronioc
      description: '5,0 m od stakloplastike RIB s ronilačkim ljestvama, nosačima spremnika, neklizajućom palubom i 60 metara HP izvan broda. Idealno za male ronilačke škole i zaštićene vodene operacije s 1-2 vožnje dnevno. Kapacitet: 8 osoba.'
    - title: RIB 520 Diver
      description: '5,2 m RIB s poboljšanom stabilnošću, spremnikom goriva s produženim dometom, ronilačkim ljestvama, spremnikom spremnika i motorom od 90 metara HP . Pogodan za obalne ronilačke centre koji obavljaju više dnevnih izleta. Kapacitet: 10 osoba.'
    - title: RIB 550 Ronioc
      description: '5,5 m RIB s velikim rasporedom palube, profesionalnim ronilačkim ljestvama, nosačima za spremnike i teškim cijevima. Dizajniran za ronilačke operacije u resortima s mješovitim skupinama putnika. Kapacitet: 10 osoba.'
    - title: RIB 580 Diver Pro
      description: '5,8 m teški teret RIB s opcijom s dva motora, integriranom ronilačkom platformom, kompletnim navigacijskim sustavom i maksimalnim prostorom na palubi. Za profesionalne ronilačke operacije u izloženim vodama izvode se 3-5 vožnji dnevno. Kapacitet: 12 osoba.'
content_dive_resorts:
  tagline: Za ronilačke resorte
  title: Premium Dive RIBs<br />Za ugostiteljske operacije resorta
  subtitle: Luksuzno ronjenje RIBs dizajnirano za udobnost gostiju, imidž brenda i kapacitet u vrhuncu sezone — gdje je iskustvo broda jednako važno kao i sam ronjenje.
  paragraphs:
    - Ronilačka odmarališta temeljno se razlikuju od komercijalnih ronilačkih centara. Vaši gosti su turisti koji plaćaju za potpuno premium iskustvo — a brod je ključni dio tog iskustva. Funkcionalan radni brod koji izgleda industrijski ili neudoban stvara primjetan jaz između kvalitete resorta i iskustva na vodi.
    - '**Problem razlike u iskustvu** — Gost koji boravi u apartmanu s pet zvjezdica s vrhunskom gastronomijom i profesionalnom uslugom ne bi trebao kročiti na stari aluminijski brod s tvrdim klupama i bez hlada. Taj kontrast narušava percepciju luksuza koju je vaš resort pažljivo izgradio. Brod nije samo prijevoz — on je mobilni produžetak vašeg brenda.'
    - '**Imidž brenda kao konkurentska prednost** — Svaki ronilački izlet je dodirna točka brenda. Premium RIB s prilagođenim bojama resorta, integriranim logotipima i usklađenim tapecirungom postaje plutajući ambasador brenda. Gosti ga fotografiraju, dijele na društvenim mrežama i pamte. Na konkurentnim destinacijama poput Maldiva, Balija ili Kariba, kvaliteta broda može biti odlučujući faktor za ponovne rezervacije.'
    - '**Udobnost donosi zadovoljstvo i recenzije** — Duge vožnje do ronilačkih lokacija u tropskoj vrućini trebale bi biti ugodne, a ne iscrpljujuće. Premium sjedala s ergonomskim naslonima, T-top ili Bimini zaštitom od sunca, glatko ukrcavanje širokim ronilačkim ljestvama i stabilna platforma za odmor izravno utječu na ocjenu zadovoljstva gostiju, online recenzije i stopu povrata. VIP gosti, stariji putnici i obitelji posebno su osjetljivi na udobnost.'
    - '**Kapacitet i prihodi u vršnoj sezoni** — Tijekom visoke sezone (Božić, proljetni praznici, ljeto), ronilačke operacije mogu obaviti 4-6 vožnji dnevno s uzastopnim grupama gostiju. Potreban vam je brod koji može podnijeti intenzitet bez kompromisa u iskustvu. Brza obrada, pouzdan rad i minimalni zastoji izravno utječu na prihode i reputaciju. Jedan prekid rada broda tijekom vršnog tjedna može koštati desetke tisuća izgubljenih rezervacija.'
    - '**Prilagodba kao razlika** — Paddle Board Overstock Premium Dive RIBs su potpuno prilagodljivi: sheme boja i grafika trupa s logotipom resorta, prilagođeni raspored logotipa, premium presvlake u bojama resorta, T-top ili Bimini sjenila za sunce, premium pomorski zvučni sustavi, EVA neklizna podloga u stilu tikovine, integrirani spremnik za ronjenje i široke ronilačke ljestve s rukohvatima. Vaš brod postaje neprimjetan dio iskustva resorta.'
    - '**Poslovni slučaj** — Premija RIB košta više na početku, ali donosi povrat kroz veće zadovoljstvo gostiju, jaču percepciju brenda, povećan broj ponovljenih rezervacija, mogućnost naplate premije, smanjeno vrijeme održavanja i duži vijek trajanja u tropskim morskim uvjetima. To je ulaganje u iskustvo gostiju, a ne operativni trošak.'
content_diving_profiles:
  tagline: Profili ronilačkih centara
  title: Vrste ronilačkih centara<br />Gradimo za
  subtitle: Različite ronilačke operacije zahtijevaju različite konfiguracije brodova. Svaku prilagođavamo RIB specifičnim potrebama vašeg ronilačkog poslovanja.
  items:
    - title: Škole ronjenja i centri za obuku
      subtitle: Rekreativno ronjenje, certifikacijski tečajevi, svakodnevna turistička putovanja
      description: Ovi centri djeluju tijekom cijele godine na tropskim destinacijama, organizirajući više vožnji dnevno za međunarodne turiste i studente s certifikacijom. Brod je središte svakodnevnih operacija — mora prevoziti teške terete opreme, često ukrcavanje putnika i duge sate u slanoj vodi. Svaki sat zastoja znači otkazane ronjenja i izgubljene prihode.
      features:
        - Velika radna paluba za 10-20 boca za ronjenje, BCD-ove i putničku opremu
        - Široke ronilačke ljestve s rukohvatima od nehrđajućeg čelika za lakše ukrcavanje
        - Hypalon Ekstra široke cijevi za stabilnu platformu tijekom ulaska i izlaska ronioca
        - Površina palube protiv klizanja EVA radi sigurnosti kada je paluba mokra
        - Konfiguracije štedljivih četverotaktnih motora za rad 200+ dana godišnje
        - Teška ili PVC Hypalon konstrukcija za izdržljivost u tropskoj slanoj vodi
        - Skladišne police za spremnike integrirane su u raspored palube, a ne naknadno ugrađene
    - title: Komercijalni i industrijski ronilački operateri
      subtitle: Održavanje luka, podvodna inspekcija, pomorsko inženjerstvo
      description: Ovi profesionalni operateri rade na projektima pomorske infrastrukture — inspekciji luka, podvodnim popravcima, polaganju kabela i obalnom inženjerstvu. Njihov brod je mobilna radna platforma, a ne samo prijevoz. Posadi je potreban prostor za alate, opremu za inspekciju i ronilačke sustave. Pouzdanost je ključna jer su rokovi projekata fiksni, a kašnjenja skupa.
      features:
        - Poboljšana stabilnost za sigurne radne uvjete u otvorenoj vodi
        - Ojačani trup za teška opterećenja i česte operacije
        - Velika otvorena paluba konfigurirana za skladištenje alata i pripremu opreme
        - Profesionalno sjedenje za udobnost posade tijekom dugih offshore operacija
        - Opcije redundancije motora radi operativne sigurnosti
        - Potpuni navigacijski sustav uključujući GPS, sonar i komunikacijsku opremu
        - Prilagođene konfiguracije platforme za ronjenje i ljestava za industrijsku upotrebu
    - title: Brodovi za podršku i ekspedicije na brodovima za podršku i ekspedicije
      subtitle: Višednevni ronilački safariji, ekspedicije na udaljenim atolima, podrška istraživanju
      description: Operatori liveaboard brodova i ekspedicijski timovi trebaju kompaktne, pouzdane RIBs koji se mogu svakodnevno lansirati i vraćati. Ti brodovi služe kao pomoćni čamci za glavne brodove, prevozeći ronioce do grebena, shuttle opremu i pružajući hitnu podršku u udaljenim lokacijama. Moraju biti dovoljno robusni za prelazak otvorenih voda, ali i kompaktni za spremanje na palubu.
      features:
        - Kompatkni dizajn (4,5-5,5 m) za lansiranje iz davita i spremanje na palubu
        - Ojačano trupno oklopljenje za česta iskrcavanja na plažu i navigaciju oko grebena
        - Tvrdi nosači za podizanje za svakodnevne operacije kranom ili davitom
        - Ronilačka ljestva s niskim profilom za jednostavan ulazak i izlazak iz vode
        - Izdržljivi materijali cjijevi otporni na dugotrajnu izloženost suncu i soli
        - Doseg goriva od 50+ nautičkih milja između točenja
        - Opcije brze napuhavanja/ispuhavanja cijevi za prostor-efikasno spremanje
    - title: Operacije ronilačkih resorta i ugostiteljstva
      subtitle: Ronjenje u resortu, VIP usluge za goste, transferi do otoka
      description: Ovi operatori pružaju usluge turistima koji očekuju vrhunsko iskustvo. Brod mora balansirati operativnu učinkovitost s udobnošću gostiju i prezentacijom brenda. Za razliku od čisto komercijalnih operatora, ronilački centri u resortu trebaju brodove koji izgledaju dobro, udobni su u vožnji i odražavaju kvalitetu objekta — a istovremeno pouzdano obavljaju svakodnevne ronilačke operacije.
      features:
        - Vrhunska sjedala s ergonomskim naslonima za udobnost gostiju
        - T-top ili Bimini zaštita od sunca za izlaganje tropskom suncu
        - Prilagođene sheme boja i integracija logotipa u skladu s brendom resorta
        - Široka ronilačka ljestva s rukohvatima za jednostavno ukrcavanje gostiju
        - Paluba u stilu tikovine za vrhunski izgled i sigurnost protiv proklizavanja
        - Tiha konfiguracija motora za minimalnu buku
        - Integrirano spremište za rashlađene napitke i ručnike za goste
content_segments:
  tagline: Profili ronilačkih resorta
  title: Vrste resorta koje opslužujemo<br />Sa prilagođenim RIB rješenjima
  subtitle: Svaki ronilački resort je drugačiji. Dizajniramo RIB konfiguracije prema tipu vašeg resorta, profilu gostiju i operativnom okruženju.
  items:
    - title: Luksuzni otocni ronilački resorti
      subtitle: Maldivi, Fidži, Bora Bora, Karibi
      description: Ovi resorti služe putnicima s visokim primanjima koji očekuju da svaki detalj odražava luksuz. Brod mora odgovarati objektu — prilagođene boje resorta, integrirani brending, vrhunska sjedišta i potpuna sunčana zaštita su neophodni. Gosti često fotografiraju brod za društvene mreže, što ga čini vidljivom imovinom brenda.
      features:
        - Potpuno prilagođena boja trupa i grafike u skladu s VI resorata
        - Vrhunska tapeciranja u koordiniranoj paleti boja resorta
        - T-top ili hardtop zaštita od sunca s integriranim zvučnicima
        - Široka ronilačka ljestva s rukohvatima za jednostavno ukrcavanje u odjeći za resort
        - Hladnjak s rashlađenim napitcima i ručnicima
        - Decking u stilu tikovine EVA za luksuzan izgled i sigurnost protiv klizanja
        - Tiha konfiguracija motora za minimalnu buku
    - title: Boutique eko-ronilački resorti
      subtitle: Nekretnine uz plažu, ekološki smještaji, fokus na održivost
      description: Manje nekretnine u udaljenim obalnim lokacijama koje naglašavaju odgovornost prema okolišu i autentična iskustva. Ovi resorti trebaju pouzdane, nisko-održavajuće brodove koji mogu samostalno djelovati uz ograničenu tehničku podršku. Efikasnost goriva i trajnost su važniji od maksimalne brzine. Brod treba odražavati prirodno okruženje.
      features:
        - Efikasne 4-taktne vanbrodske konfiguracije
        - Tubusi za teške uvjete Hypalon za dug vijek trajanja u udaljenim lokacijama
        - Električni sustav kompatibilan sa solarnom energijom za punjenje izvan mreže
        - Kompaktni raspored palube za 8-10 gostiju s minimalnim utjecajem na okoliš
        - Dizajn jednostavan za održavanje — pristupačne komponente za lokalni servis
        - Neutralne opcije boja koje se stapaju s prirodnim okruženjem
        - Lagani konstrukcijski materijali za iskrcavanje na plažu i rad u plitkim vodama
    - title: Premium operatori Liveaboard brodova
      subtitle: Višednevni ronilački safariji, ekspedicijsko ronjenje, udaljeni atolovi
      description: 'Operatori Liveaboard brodova trebaju tender brodove koji služe više uloga: prijevoz ronioca do grebena, prijevoz opreme, hitna podrška i izleti za goste. RIB mora biti dovoljno kompaktan za pohranu na palubi ili vuču, a opet sposoban za plovidbu otvorenim morem u različitim uvjetima. Dnevno lansiranje i povrat zahtijeva robusnu konstrukciju.'
      features:
        - Kompaktni dizajn (4,5-5,5 m) za pohranu na palubi ili vuču iza liveaboard broda
        - Ojačano trupno oklopljenje za česta iskrcavanja na plažu i navigaciju oko grebena
        - Opcije bržeg napuhavanja/spuštanja tubusa za učinkovitost pohrane
        - Roniocinska ljestvica s niskim profilom za jednostavno ukrcavanje iz vode
        - Kote težine za dizanje za davits ili kranske sustave
        - Doseg goriva od 50+ nautičkih milja između točenja
        - Izdržljivi materijali tubusa otporni na sunce, sol i izloženost gorivu
    - title: VIP privatne čarter operacije
      subtitle: Ultra-luksuzni privatni otoci, slavne osobe, korporativni čarteri
      description: Najviša razina hotelskog ugostiteljstva, gdje je svaki detalj personaliziran, a očekivanja ekstremna. Brod mora biti besprijekoran, gotovo nečujan i imati besprijekornu poslugu. Privatnost, udobnost i estetska savršenost su od najveće važnosti. Ovi klijenti nisu osjetljivi na cijenu, ali su izuzetno osjetljivi na kvalitetu.
      features:
        - Ultra-premijerna sjedala s prilagođenim šivanjem i opcijama grijanja
        - Kabina motora s prigušenjem zvuka za gotovo tihu plovidbu
        - Opcija potpune zatvorenosti za privatnost i zaštitu od vremenskih uvjeta
        - Integrirani zabavni sustav s zvučnicima marine kvalitete
        - Prilagođeni wet bar ili stanica za osvježenje
        - Kabina za privatnost kod WC-a i presvlačenje
        - Posvećena stanica za posadu s komunikacijom i navigacijom
        - Usklađen tender set — koordinirani mothership i pomoćni RIB
content_benefits:
