    - Široki dizajn cijevi pruža stabilnu platformu za ukrcaj opremljenih ronioca — sigurniji ulazak i izlazak za sve razine iskustva
    - Raspored palube optimiziran za radni tijek opreme — boce, oprema i putnici imaju svaki svoja posebna mjesta
