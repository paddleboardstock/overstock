hero:
  tagline: Partneri i distribucija
  title: Postanite Aquafarer partner<br />— Globalna distribucijska mreža
  subtitle: Pridružite se Aquafarerglobalnoj mreži partnera. Surađujemo s distributerima za pomorstvo, prodavačima brodova, prodavačima opreme i partnerskim brendovima u 50+ zemalja.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer Globalna mreža partnera i distributera
content_programs:
  tagline: Partnerski programi
  title: Partnerski programi<br />Izgrađen za rast
  subtitle: Bilo da ste distributer, prodavač ili partner brenda, Aquafarer nudi programe osmišljene za podršku vašem poslovanju.
  columns: 3
  items:
    - title: Program distributera
      description: Ekskluzivna distribucija teritorija s količinskim cijenama, marketinškom podrškom i izravnim pristupom tvornicama. Minimalna obveza potrebna ovisno o veličini teritorija.
      icon: tabler:world
    - title: Program za trgovce
      description: Izravno određivanje cijena kod prodavača, obuka o proizvodima, marketinški materijali i jamstvena podrška za maloprodajne lokacije i online trgovine.
      icon: tabler:building-store
    - title: OEM/ODM Partnerstvo
      description: Potpuna usluga OEM i ODM proizvodnja s prilagođenim brendiranjem, pakiranjem i specifikacijama proizvoda. Od koncepta do kontejnera.
      icon: tabler:certificate
    - title: Partnerstvo s brendom
      description: Co-branding, privatne marke i ekskluzivni modelski programi za etablirane brendove u području pomorske i vanjske rekreacije.
      icon: tabler:stars
    - title: Vlada i institucije
      description: Programi preferiranih dobavljača za državne agencije, obalne straže, vojsku i humanitarne organizacije. Dokumentacija spremna za tender.
      icon: tabler:building-community
    - title: Resort & Partner za najam
      description: Cijene flote, dosljedna kvaliteta i prilagođeni brending za odmarališta, ronilačke centre i najam diljem svijeta.
      icon: tabler:sun
content_benefits:
  tagline: Zašto surađivati s nama
  title: Zašto partneri biraju Aquafarer
  subtitle: Naši partneri imaju koristi od stvarnih proizvodnih kapaciteta, dosljedne kvalitete i brze podrške.
  list:
    - 'Izravan pristup tvornici: Radite izravno s našim proizvodnim timom — bez posrednika. Ostvarite brže odgovore, bolje cijene i potpunu vidljivost proizvodnje.'
    - 'Spremni za prilagodbu: Brendirajte svoje proizvode s prilagođenim bojama, logotipima, pakiranjima i specifikacijama. Minimalne količine narudžbe prilagođene vašem tržištu.'
    - 'Zajamčena kvaliteta: ISO 9001 certificirana proizvodnja s CE, UKCA, i BSCI usklađenošću. Svaki proizvod testiran prije slanja.'
    - 'Globalna logistika: Dostava iz Qingdaoa, Kina s FOB, CIF, i DDP opcijama. Američko skladište u Montclairu, CA za distribuciju u Sjevernoj Americi.'
    - 'Marketinška podrška: Katalozi proizvoda, fotografije, tehnička dokumentacija i digitalni materijali za podršku vašim prodajnim naporima.'
    - 'Obuka i podrška: Obuka o proizvodima za vaš prodajni tim, tehnička podrška za vaše kupce i koordinacija jamstvenih servisa.'
content_process:
  tagline: Kako postati partner
  title: Jednostavan proces partnerstva
  subtitle: Naš proces partnerstva je jednostavan — dizajniran da vam omogući brzo prodavanje Aquafarer proizvoda.
  items:
    - title: 'Korak 1: Podnošenje prijave'
      description: Ispunite naš obrazac za prijavu partnera sa profilom vaše tvrtke, ciljnim tržištem i interesima za proizvode.
    - title: 'Korak 2: Pregled kvalifikacija'
      description: Naš tim za partnerstva pregledava vašu prijavu i kontaktira vas u roku od 3 radna dana kako bi raspravili mogućnosti.
    - title: 'Korak 3: Ugovor i postavljanje'
      description: Potpišite ugovor o partnerstvu, postavite svoj račun i primite partnerske cijene, marketinške materijale i uzorke proizvoda.
    - title: 'Korak 4: Obuka i lansiranje'
      description: Osigurana je obuka o proizvodima, podrška u prodaji i marketinški materijali. Spremni ste za početak prodaje.
cta:
  title: Spremni postati Aquafarer partner?
  subtitle: Prijavite se za partnerstvo i naš tim će odgovoriti u roku od 3 radna dana.
  actions:
    - variant: primary
      text: Prijavite se za partnerstvo
      href: /contact
    - text: Pogledajte naše proizvode
      href: /products
