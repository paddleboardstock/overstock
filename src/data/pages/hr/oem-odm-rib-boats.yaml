content_customization:
  tagline: Što se može prilagoditi
  title: RIB Prilagodba<br />Opcije
  subtitle: Svaki element RIB broda može se prilagoditi vašoj primjeni, tržištu i zahtjevima brenda.
  items:
    - title: Trup i konstrukcije
      description: Duljina trupa (2,5–8,5 m), materijal trupa (GRP stakloplastična vlakna ili aluminij pomorske kvalitete), boja trupa (gelcoat ili obojana), profil kobilice (duboki V, umjereni-V, ravni), tip krme (zatvoreni krmni dio s nosačem ili bušotinom) i strukturna ojačanja za komercijalne zahtjeve opterećenja.
      icon: tabler:sailboat
    - title: Cijev i ovratnik
      description: Materijal cijevi (0,9–1,2 mm PVC ili 1,4–1,7 mm Hypalon/CSM), promjer cijevi (40–55 cm), broj komora (3–7), tip ventila (Halkey-Roberts, Leafield D7 ili Boston), boja cijevi (standardna ili prilagođena) i konfiguracija konusa/konusa ovratnika.
      icon: tabler:circle
    - title: Raspored palube i konzole
      description: Središnja konzola, bočna konzola ili upravljač s kormilom. Raspored sjedala (sjedala za jahače, klupe, sjedala za potporu). Pokrivanje palube (EVAizgled pjene tikovine, boja protiv klizanja ili goli GRP). Točke za montažu opreme, rukohvati i položaji D-prstenova.
      icon: tabler:layout-dashboard
    - title: Elektrika i navigacija
      description: Navigacijska svjetla (LED), sustav pumpe za vodu, upravljanje baterijama, instalacija VHF radija, montaža GPS/plotera za karte, USB punjači i konfiguracija prekidača.
      icon: tabler:bolt
    - title: Brendiranje i grafika
      description: Grafika trupa i cijevi (sitotisak, prijenos toplinom, UV digitalni tisak), postavljanje logotipa, prilagođene sheme boja, identifikacijske oznake i prilagođena dokumentacija vlasnika s vašim brendom.
      icon: tabler:palette
    - title: Sigurnost i usklađenost
      description: Ocjena dizajnerske kategorije (A/B/C/D po ), RCDsustav za gašenje požara, specifikacije sustava goriva (prijenosni spremnik, fiksni spremnik, podpaluba) i paket dokumentacije o usklađenosti za vaše ciljno tržište.
      icon: tabler:shield
content_applications:
  tagline: Konfiguracije aplikacija
  title: RIB Konfiguracije<br />Prema primjeni
  subtitle: Različite misije zahtijevaju različite konfiguracije. Evo provjerenih postavki za RIB najčešće primjene.
  items:
    - title: Spašavanje i patrola
      description: Duboki V trup, Hypalon cijevi, paluba koja se sama izbacuje, sjedala za potporu, ručke hvataljki, navigacijska svjetla i teški D-prstenovi.RCD Kategorija dizajna B ili C. Sustav goriva otporan na požar i komercijalna električna oprema.
      icon: tabler:lifebuoy
    - title: Podrška u ronjenju
      description: Široka greda, stražnje ljestve za ukrcaj, pozicije nosača spremnika, dodatni D-prstenovi, nosač za ronilačku zastavu, ojačani krmni dio za dvostruke vanjske brodove i EVA protuklizni pokrivač cijele palube.
      icon: tabler:mask
    - title: Turizam i komercijala
      description: Raspored certificiran za putnike s klupama, sjedenjem za sunce/Bimini, rukohvatima, suhim spremištem i sustavom s dvije baterije.RCD Kategorija C. Dizajniran za upravljanje resort i charter flotama.
      icon: tabler:beach
    - title: Ribarstvo
      description: Otvoreni raspored palube, pozicije držača štapova, živi mamac, nosač za lov na ribu, nosač trolling motora, ojačani krmni dio i prijenosni sustav goriva. Opcije u središnjoj konzoli ili bočnoj konzoli.
      icon: tabler:fish
    - title: Slobodno vrijeme i tender za jahte
      description: Lagana oplata, PVC cijevi, udobna sjedala, teleskopski kormilo ili kompaktna konzola, točke za dizanje za davit i uklonjivi rezervoar za gorivo. RCD Kategorija C ili D.
      icon: tabler:sailboat
    - title: Profesionalni radni brod
      description: Opcija aluminijskog trupa, ojačanja za teške uvjete, hidrauličko upravljanje, elektrika komercijalne razine, radar luk i točke za integraciju opreme specifične za misiju. Prilagođena usklađenost po projektu.
      icon: tabler:anchor
process_steps:
  title: 7-korak RIB OEM/ODM razvojni proces
  subtitle: Od projektne specifikacije do postprodajne podrške — definirani tijek rada s jasnim prekretnicama i isporukama
  steps:
    - number: '01'
      title: Projektna specifikacija i zahtjevi
      description: Definirajte ciljani način uporabe, veličinu trupa, materijal cijevi, zahtjeve usklađenosti i potrebe za brendiranjem. Procjenjujemo izvedivost i potvrđujemo model suradnje (OEM/ODM/Polu-prilagođeno/Potpuno prilagođeno).
      timeline: 3–5 dana
    - number: '02'
      title: Tehnički pregled i izvedivost
      description: Inženjerski tim pregledava strukturnu izvedivost, stabilnost i proračune plovnosti, put usklađenosti i dostupnost materijala. Identificiramo postojeće kalupe ili zahtjeve za specijalnim kalupima.
      timeline: 5–7 dana
    - number: '03'
      title: Prijedlog i ponuda
      description: Primit ćete detaljan prijedlog uključujući specifikacije, 3D prikaze ili GA crteže, opseg usklađenosti, vremenski okvir i cijenu po jedinici na temelju volumenskih razina i MOQ.
      timeline: 5–7 dana
    - number: '04'
      title: Potvrda dizajna i uzorak
      description: Odobrite konačni GA, raspored palube i konfiguraciju cijevi. Proizvodimo predproizvodni uzorak u bojama vašeg brenda, s logotipom i specificiranim materijalima za fizički pregled.
      timeline: 15–20 dana
    - number: '05'
      title: Odobrenje uzorka i protokol kontrole kvalitete
      description: 'Pregledajte i odobrite uzorak. Definirajte protokol kontrole kvalitete proizvodnje: testiranje tlaka (1,25x / 24–48h), dimenzijske provjere i kontrolni popis dokumentacije usklađenosti po trupu.'
      timeline: 3–5 dana
    - number: '06'
      title: Serijska proizvodnja i kontrola kvalitete
      description: Kompletna proizvodnja s kontrolnim popisom od 100 točaka po jedinici. Pregledi u toku proizvodnje, testiranje tlaka i praćenje na razini serije. CE/ISO dokumentacija pripremljena paralelno.
      timeline: 30–45 dana
    - number: '07'
      title: Pakiranje, otprema i postprodajna podrška
      description: Prilagođeno pakiranje (standardno, spremno za maloprodaju ili na paleti), izvozni dokumenti, utovar u kontenere i logistika. Uključeni setovi rezervnih dijelova i dokumentacija za održavanje.
      timeline: 7–14 dana
certifications:
  title: Usklađenost i certifikati za RIB brodove
  subtitle: Svaka prilagođena RIB narudžba šalje se s dokumentacijom usklađenosti specifičnom za model
  items:
    - name: CE 2013/53/EU
      description: RCD usklađenost po modelu i kategoriji dizajna — uključeni DoC, pločica brodograditelja, priručnik za vlasnika
      badge: CE
    - name: ISO 9001:2015
      description: Sustav upravljanja kvalitetom certificiran od SGS koji pokriva dizajn, proizvodnju i distribuciju
      badge: ISO
    - name: HR ISO 6185
      description: Standard izgradnje gumenjaka — stabilnost, plovnost i spašavanje osobe koja je pala u vodu
      badge: 6185
    - name: HR ISO 14945
      description: Standardna pločica proizvođača — trajno označene informacije o identifikaciji i kapacitetu
      badge: 14945
    - name: BSCI
      description: Revizija društvene usklađenosti za etičku proizvodnju — zahtijevana od strane trgovaca u EU
      badge: BSCI
    - name: REACH
      description: Usklađenost s propisima EU-a o sigurnosti kemikalija za PVC, Hypalon, ljepila i premaze
      badge: REACH
content_service_modules:
  tagline: Uslužni moduli
  title: OEM/ODM Usluga<br />Moduli
  subtitle: Svaki projekt kombinira odgovarajuće servisne module. Nije svaki projekt potreban svaki modul — definiramo samo ono što vaš projekt zahtijeva.
  items:
    - title: Inženjerski pregled i izvodljivost
      description: 'Procjena platforme trupa, provjera strukturne izvedivosti, verifikacija stabilnosti i plovnosti, identifikacija puta usklađenosti i potvrda dostupnosti materijala. Rezultat: izvještaj o izvedivosti s preporukom za nastavak/prekid.'
      icon: tabler:math-function
    - title: Dizajn i konfiguracija
      description: 'GA crtež, raspored palube, konfiguracija cijevi, položaji konzole i sjedenja, plan montaže opreme i odabir boja/materijala. Izlaz: odobrena GA i specifikacija konfiguracije.'
      icon: tabler:ruler
    - title: Uzorak i prototip
      description: Predproizvodni uzorak s odobrenim bojama, logotipom i određenim materijalima za fizičku inspekciju. Uključuje protokol odobrenja uzorka, kontrolni popis za inspekciju i proces zahtjeva za promjenom.
      icon: tabler:3d-cube-sphere
    - title: Proizvodnja i kontrola kvalitete
      description: Masovna proizvodnja s kontrolnim popisom od 100 točaka po jedinici, inspekcijama u procesu, ispitivanjem tlaka (1,25x / 24-48h) i sljedivosti na razini serije. CE/ISO dokumentacija pripremljena paralelno.
      icon: tabler:clipboard-check
    - title: Brendiranje i pakiranje
      description: Primjena logotipa privatne marke, prilagođene grafike trupa i cijevi, dokumentacija za vlasnika s markom, pakiranje spremno za maloprodaju ili na paletama, te priprema kompleta rezervnih dijelova.
      icon: tabler:palette
    - title: Izvoz i dokumentacija
      description: Izvozno pakiranje, plan utovara kontejnera, FOB/CIF/DDP dokumentacija, papirologija o sukladnosti prema odredišnom tržištu i protokol komunikacije nakon isporuke.
      icon: tabler:world
content_risk_control:
  tagline: Kontrola rizika i isporuke
  title: Rizik projekta &<br />Upravljanje dostavom
  subtitle: Profesionalni kupci OEM/ODM brinu o kontroli rizika jednako kao i o kvaliteti proizvoda. Evo kako to upravljamo.
  items:
    - title: Definicija opsega i vlasništva
      description: 'Prije početka razvoja, pismeno definiramo: opseg prilagodbe, zahtjeve za alatima, kriterije za odobrenje uzoraka, vlasništvo nad crtežima i kalupima te odgovornosti za dokumentaciju. Nema nejasnoća oko toga tko što posjeduje.'
      icon: tabler:file-text
    - title: Proces kontrole promjena
      description: Sve promjene specifikacija nakon potvrde dizajna slijede dokumentirani proces zahtjeva za izmjenama s procjenom utjecaja (trošak, vremenski okvir, usklađenost). Nema neodobrenih izmjena koje ulaze u proizvodnju.
      icon: tabler:arrows-diff
    - title: Jamstvo konzistentnosti serije
      description: 50. jedinica odgovara prvom odobrenom uzorku. Odobrene specifikacije se zamrzavaju, parametri materijala i procesa su zaključani, a kontrolne točke tijekom procesa provjeravaju dosljednost tijekom proizvodnog ciklusa.
      icon: tabler:repeat
    - title: Transparentnost isporuke i kapaciteta
      description: Rokovi isporuke navode se na temelju stvarnog proizvodnog kapaciteta, razine zaliha materijala i trenutnog opterećenja narudžbama — a ne aspiracijskih ciljeva. Raspored proizvodnje s datumima prekretnica navedenim po narudžbi.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Često postavljana pitanja
  questions:
    - q: Koja je razlika između OEM ODM RIB i za brodove?
      a: 'OEM (Proizvodnja originalne opreme): vi dajete detaljne specifikacije, a mi izrađujemo vaš dizajn.ODM (Proizvodnja originalnog dizajna): birate Aquafarer RIB provjerenu platformu i mi je prilagođavamo vašim željenim značajkama i brendiranju.ODM brži je i jeftiniji;OEM nudi maksimalnu kontrolu dizajna.'
    - q: Mogu li prilagoditi RIB oblik i veličinu trupa?
      a: Da. Nudimo polu-prilagođene modifikacije postojećih kalupa trupa (različiti rasporedi palube, konfiguracije cijevi) i potpuni prilagođeni razvoj trupa s novim CNCobrađenim kalupima. Polu-prilagođeni projekti mogu započeti s 2-5 jedinica; potpuno prilagođeni obično zahtijevaju veće obveze.
    - q: Koji su materijali za cijevi dostupni za customRIBs?
      a: Nudimo 0,9-1,2 mm PVC za rekreativnu i laganu komercijalnu upotrebu, te 1,4-1,7 mm HypalonCSM / za profesionalne, spasilačke i komercijalne primjene koje zahtijevaju UV vrhunsku otpornost na ozon (životni vijek 10-15 godina naspram 5-8 godina za PVC).
    - q: Možete li konfigurirati RIBs za specifične aplikacije poput spašavanja, ronjenja ili ribolova?
      a: Da. Održavamo provjerene konfiguracijske predloške za spašavanje/patrolu, ronilačku podršku, turizam/čarter, ribolov, tender jahti i profesionalne radne brodove. Svaki predložak uključuje preporučeni tip trupa, materijal cijevi, raspored palube i opremu — koju zatim prilagođavamo vašim točnim zahtjevima.
    - q: Koje informacije su vam potrebne za RIB OEMODM / ponudu?
      a: Ciljana primjena, željena duljina trupa, preferencija materijala cijevi (PVCili ), Hypalonpribližna količina i raspored isporuke, zahtjevi usklađenosti ciljnog tržišta te svi referentni proizvodi ili specifikacije. Što više detalja pružite, to je naša ponuda brža i točnija.
    - q: Što MOQ je za RIB prilagođene brodove?
      a: Za postojeće kalupe trupa sa standardnim modifikacijama, počinje MOQ s 2-5 jedinica po dizajnu. Za prilagođene kalupe i potpuni prilagođeni razvoj MOQ ovisi o složenosti projekta — obično 10-20 jedinica za polu-prilagođene i 30 za potpuno prilagođene+ s novim alatima.
    - q: Tko posjeduje prilagođene kalupe i crteže?
      a: Kalupi razvijeni prema Aquafarer osnovnim dizajnima ostaju Aquafarer vlasništvo. Potpuno prilagođeni kalupi koje naruči i plati klijent mogu se prenijeti na klijentovo vlasništvo prema uvjetima ugovora. Svi uvjeti vlasništva nad kalupom dokumentirani su prije početka projekta.
    - q: Kako se RIBs prilagođeno pakiraju za izvoz?
      a: 'Standardno: prilagođena + rastezljiva folija za pakiranje kontejnera. Premium: pakiranje spremno za maloprodaju, vakuumsko pakiranje ili paletizirano. Nudimo FOB Qingdao, CIF, DDP i dostavu. Uključena je potpuna izvozna dokumentacija i carinska provjera.'
