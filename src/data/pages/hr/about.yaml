hero:
  tagline: O nama
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer tvornica i radionica
  title: |
    Pomorsko inženjerstvo,<br />
    izgradili smo<span class="text-accent dark:text-white">Aquafarer</span>način
  subtitle: 'Počeli smo u radionici na obali s jednom barkom i tvrdoglavim uvjerenjem: pomorski proizvodi trebaju biti konstruirani kao da su važni, jer jesu. Danas šaljemo u više od 50 zemalja, ali svaki trup još uvijek prolazi kroz iste ruke koje su osnovale tvrtku.'
