features3_what_we_build:
  title: Što gradimo
  subtitle: Fokusirana linija proizvoda koju poznajemo do u detalje — bez poluzavršenih eksperimenata, bez inženjeringa radi imena.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB brodovi
      description: Aluminijski trup RIBs od 3,3 m do 7,5 m. Dizajnirani za patrolu, ronjenje, ribolov i obiteljski use.
      icon: tabler:ship
    - title: Gumeni čamci
      description: PVC i Hypalon gumeni čamci od 2,4 m do 4,2 m. Lagani, čvrsti i jednostavni za spremanje.
      icon: tabler:speedboat
    - title: Tenderi za superjahtěe
      description: Kompaktni, visokospecijalizirani RIBs po mjeri, prilagođeni izgledu vaše glavne jahte.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Dodaci
      description: Vesla, pumpe, navlake, vodootporne torbe, spremnici za gorivo i elektronika. Sve u skladu s našim čamcima.
      icon: tabler:package
    - title: Refit i popravak
      description: Unutarnja zamjena cijevi, nadogradnja elektronike i motora.
      icon: tabler:tool
    - title: Izrada po mjeri
      description: Dizajn po projektu za komercijalne, znanstvene i vojne kupce.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Rasprava o dizajnu i inženjerstvu čamaca
steps2_values:
  title: Naše vrijednosti
  subtitle: Tri načela koja su oblikovala svaki proizvod od prvog dana.
  items:
    - title: Gradite kao da je za vašu obitelj
      description: Svaki trup, zavar i pričvrsni element tretira se kao da ga koriste naše vlastite obitelji.
      icon: tabler:heart
    - title: Inženjering prije nego što prodamo
      description: Ako je specifikacija pogrešna, mijenjamo specifikaciju — nikada kupca.
      icon: tabler:settings
    - title: Podrška koja traje dulje od jamstva
      description: Dvadeset godina stari trupovi i dalje nas zovu za rezervne dijelove, a mi i dalje odgovaramo.
      icon: tabler:headset
steps2_milestones:
  title: Prekretnice
  subtitle: Kratka verzija priče Aquafarer.
  isReversed: true
  items:
    - title: Osnovano u radionici na obali
      description: Pokrenuli su ga dva pomorska arhitekta s CNC strojem i tvrdoglavom idejom.
      icon: tabler:building-factory
    - title: Prvih 1.000 isporučenih trupova
      description: Dostignuto u našoj sedmoj godini, uglavnom usmenom predajom i ponovljenim kupcima.
      icon: tabler:circle-check
    - title: Program međunarodnog izvoza
      description: Sada šaljemo u 50+ zemalja s lokaliziranim partnerskim podrškama na pet kontinenata.
      icon: tabler:world
    - title: Nova globalna struktura poslovanja
      description: U rujnu 2026. godine, operacije brenda premještene su iz Qingdao Vatrad Grupe u Aquafarer LLC (New Mexico, SAD); proizvodni centar u Qingdau i dalje obavlja istraživanje i razvoj, proizvodnju i izravan izvoz iz tvornice.
      icon: tabler:building-skyscraper
features2_locations:
  title: Naše lokacije
  tagline: Pronađite nas
  columns: 3
  items:
    - title: Sjedište i radionica
      description: Obalni industrijski park, zgrada 4 — otvoreno od ponedjeljka do petka uz prethodnu najavu.
    - title: EU servisni centar
      description: Mediteranska luka — prerada, popravak i jamstvena podrška za europske kupce.
    - title: APAC mreža partnera
      description: Odobreni servisni partneri u Australiji, Japanu, Singapuru i Hong Kongu.
brand_hub_tagline: Brend
brand_hub_title: Istražite naš brend
brand_hub_subtitle: Proučite detaljnije našu stručnost u pomorskom inženjeringu, globalnu prisutnost i principe koji nas pokreću.
brand_hub_cards:
  - title: Pomorska stručnost
    desc: Desetljeća znanosti o materijalima, precizne proizvodnje i testiranja u stvarnom svijetu — od PVC/Hypalon izrade do dizajna trupa deep-V i drop-stitch tehnologije.
    link: /brand-marine-expertise
    link_label: Saznajte više →
  - title: Globalna prisutnost
    desc: Isporuka u 50+ zemalja iz naše postrojbe u Qingdauu s ovlaštenim servisnim partnerima diljem Europe, Azijsko-pacifičke regije i Amerike.
    link: /brand-global-presence
    link_label: Saznajte više →
  - title: Zašto Aquafarer
    desc: Vertikalna integracija, dvostruka certifikacija (ISO 9001 + BSCI), CE usklađenost i niska MOQs — razvijeno za brendove, distributere i državne agencije.
    link: /brand-why-aquafarer
    link_label: Saznajte više →
production_section:
  tagline: Izvrsnost proizvodnje
  title: Osiguravanje izvanredne izrade
  description: Aquafarer proizvodna linija posvećena je proizvodnji visokokvalitetnih, izdržljivih i visokoučinkovitih proizvoda na napuhavanje.
  cards:
    - title: Iskusan tehnički tim
      items:
        - Profesionalno znanje o PVC, Hypalon i pomorskim materijalima
        - Precizna izrada u rezanju, lijepljenju i ugradnji dodataka
        - Neprekidna obuka za svladavanje najnovijih proizvodnih tehnologija
    - title: Napredna proizvodna oprema
      items:
        - CNC oprema za rezanje za precizno rezanje tkanine s minimalnom pogreškom
        - Visoko precizno toplinsko/hladno lijepljenje za zračno nepropusne, izdržljive šavove
        - Profesionalna oprema za testiranje nepropusnosti i vlačne čvrstoće
    - title: Zreli sustav upravljanja
      items:
        - Standardizirani proizvodni procesi s jasno definiranim standardima kvalitete
        - Filozofija vitke proizvodnje koja smanjuje otpad i poboljšava učinkovitost
        - Učinkovito upravljanje opskrbnim lancem s pouzdanim partnerskim dobavljačima
    - title: Stroga kontrola kvalitete
      items:
        - certificirani sustav upravljanja kvalitetom
        - 'Višestupanjska inspekcija: sirovina, tijekom proizvodnje, konačna inspekcija'
        - Stroga testiranja nepropusnosti i trajnosti prije isporuke
global_ops_section:
  tagline: Globalna operativna arhitektura
  title_html: Jedan brend,<span class="text-white/90">dva središta</span>
  description_html: Od rujna 2026., Aquafarer upravlja<strong class="text-white">Aquafarer LLC</strong>(New Mexico, SAD) — globalna jedinica za distribuciju, komercijalnu B2B prodaju, ugovore, fakturiranje i postprodaju. R&D, proizvodnja i kontrola kvalitete ostaju u<strong class="text-white">Aquafarer Qingdao Manufacturing Hub</strong>, koja otprema svaki narudžbeni proizvod izravno iz tvornice, FOB Qingdao. Promjena je utjecala na osobu koja potpisuje vaš ugovor — ne na onoga tko izrađuje vaš brod.
  stats:
    - value: 2,400+
      label: Konstrukcije isporučene globalno
    - value: 50+
      label: Zemlje izvele
    - value: 10+
      label: Godine proizvodnje
