content_challenge:
  tagline: Izazov
  title: Zahtjevi morskog turizma<br />Pouzdani, putnički spremni brodovi
  subtitle: Turistički operateri trebaju brodove koji mogu podnijeti svakodnevne prijevoze putnika, promjenjive uvjete na moru i visoka očekivanja gostiju — uz održavanje nisko i profitabilnost operacija.
  paragraphs:
    - Otočni turistički operateri na destinacijama poput Maldiva, Filipina, Indonezije i Tajlanda svakodnevno organiziraju prijevoz putnika, izlete s maskom i morske izlete. Njihovi brodovi plove 300+ dana u godini u slanim vodama s minimalnim zastojima za održavanje.
    - '**Transferi na otok** zahtijevaju brz i udoban prijevoz putnika između odmarališta, zračnih luka i ronilačkih mjesta. Putnici očekuju glatku vožnju, lako ukrcavanje i zaštitu od sunca i prskanja. Spor ili neudoban brod izravno utječe na zadovoljstvo gostiju i ponovljene rezervacije.'
    - '**Operateri promatranja kitova i dupina** trebaju brodove koji mogu brzo doći do divljih životinja, održavati stabilne platforme za promatranje i tiho djelovati kako bi izbjegli uznemiravanje morskog života. Brzina, stabilnost i okretnost su ključni — putnici očekuju bliske susrete bez osjećaja morske bolesti.'
    - '**Tvrtke za avanturistički turizam** organiziraju obalne istraživačke ture, izlete u špilje i iskustva s morskim divljim životinjama. Njihovi brodovi plove raznolikim okruženjima — od otvorenog oceana do plitkih uvala — što zahtijeva svestrane dizajne trupova i pouzdanu konstrukciju.'
    - U svim segmentima, otpornost na koroziju, učinkovitost goriva i udobnost putnika su najvažniji. Brod koji otkaže ili zahtijeva česte popravke znači gubitak prihoda, otkazane ture i narušen ugled.
content_solution:
  tagline: Naše rješenje
  title: Turistička kategorija RIBs<br />& Oprema flote
  subtitle: Paddle Board Overstock Osigurava RIB i komercijalne brodove za putničke operacije i opremu flote (SUPskajaka, napuhivače) za programe aktivnosti u resortu — sve od jednog dobavljača.
  list:
    - Komercijalni putnički RIBs prijevoz od 4,8 m do 8m — prilagođen za transfere na otok, ture s ronjenjem i promatranje divljih životinja
    - Udobna sjedala s naslonima za leđa i sjenilom — udobnost za putnike tijekom ture od 1-2 sata
    - Široka širina i duboki V trup za stabilnost — smanjuje morsku bolest i poboljšava povjerenje putnika
    - Opcije tihih motora za promatranje divljih životinja — minimalno ometanje morskih životinja
    - Ronilačke ljestve i platforma za plivanje — neizostavni za ronilačke izlete i izlete
    - Personalizirani brend i sheme boja — logotip vaše tvrtke i flotna livrea na svakom plovilu
    - Cijene flote za RIB narudžbe na veliko — dosljedne specifikacije kroz višebrodske operacije
    - SUP daske, kajaci i napuhujući čamci za programe aktivnosti gostiju u resortima
    - Rezervni dijelovi i podrška održavanju — minimizirajte zastoje tijekom vrhunca turističke sezone
content_segments:
  tagline: Turistički segmenti
  title: Rješenja za morski turizam<br />Prema vrsti operacije
  subtitle: Različite turističke operacije zahtijevaju različite konfiguracije brodova.Paddle Board Overstock Odgovara vašoj RIB specifičnoj primjeni.
  items:
    - title: Operateri prijenosa na otoku
      subtitle: Maldivi, Filipini, Indonezija, Tajland — dnevni prijevoz gostiju
      description: Otočni turistički operateri u jugoistočnoj Aziji i Maldivima svakodnevno organiziraju prijevoz putnika između zračnih luka, odmarališta i ronilačkih mjesta — često 300+ dana u godini. Brod je okosnica iskustva gostiju. Kvar znači zaglavljene goste, otkazane rezervacije i štetu po reputaciju. Ti operateri trebaju brodove koji prežive čestu upotrebu na udaljenim lokacijama gdje je podrška održavanju ograničena, a dijelovi teško dostupni.
      features:
        - Komercijalna gradnja ocijenjena na 300+ radnih dana godišnje
        - Udobna klupa za sjedenje s naslonima za 8-16 putnika
        - T-top ili Bimini sjenilo za zaštitu od tropskog sunca i prskanja
        - Široka platforma za ukrcaj za jednostavan pristup gostima s prtljagom
        - Suhi skladišni prostori za torbe gostiju i potrepštine za odmaralište.
        - Štedljivi četverotaktni vanbrodski motor — nizak operativni trošak po vožnji
        - Hypalon Teške cijevi za životni vijek od 5-8 godina u tropskim uvjetima
        - Jednostavan dizajn za održavanje — dostupne komponente za servisiranje na udaljenim lokacijama
    - title: Operateri za promatranje kitova
      subtitle: Offshore sposobnost, brzina do vidikovaca, stabilna platforma
      description: Promatranje kitova je sezonski, ali vrlo vrijedan turistički segment koji djeluje u regijama poput Hervey Baya (Australija), Kaikoure (Novi Zeland), Baja Californije (Meksiko) i Azora. Operateri moraju brzo stići do područja promatranja na otvorenom moru prije nego što kitovi zarone ili odu dalje, održavati stabilnu platformu za dulje promatračke periode i djelovati tiho kako ne bi uznemiravali morske sisavce. Udobnost putnika tijekom 2-4 satnih tura izravno utječe na recenzije i ponovljene rezervacije. Spor ili nestabilan brod znači propuštena viđenja i povrat ture.
      features:
        - Konfiguracije od 7-10 m RIB za offshore sposobnost u otvorenom moru
        - Tihi četverotaktni vanjski motor — minimalna buka i vibracije
        - Duboko-V trup s izvrsnom stabilnošću u mirovanju — udobna platforma za promatranje
        - Platforma za promatranje na pramcu s rukohvatima za fotografiranje gostiju
        - Potpuna zaštita od vremenskih uvjeta — T-top ili zatvorena konzola za uvjete na moru
        - Ergonomska sjedala dizajnirana za udobnost tijekom 2-4 sata trajanja ture
        - Materijali morske kvalitete za dugotrajnu izloženost i otpornost na slanu vodu UV
    - title: Operateri za promatranje dupina
      subtitle: Brza potjera, kapacitet za više putnika, tihi prilaz
      description: Operateri za promatranje dupina trebaju drugačiji omjer sposobnosti. Dupini su brži i razigraniji od kitova, što zahtijeva brodove koji mogu brzo ubrzati, precizno manevrirati i pristupati grupama bez da ih uplaše. Ove ture obično prevoze više putnika po vožnji i djeluju bliže obali. Tihi rad je ključan — dupini koji se naviknu na glasne motore izbjegavat će brodove, smanjujući uspješnost uočavanja. Operateri također trebaju pouzdane brodove za dnevne rasporede s više putovanja tijekom vrhunca turističke sezone.
      features:
        - 5,5-8 m RIB za agilnost, brzinu i pristup plitkoj vodi
        - Brzo ubrzanje za dosezanje aktivnih jata dupina
        - Tihi ispušni plinovi i trup s niskim vibracijama za bliski prilaz
        - Stabilna platforma u mirovanju za promatranje gostiju i fotografiranje
        - Veliki kapacitet putnika (10-18 osoba) za ture u vršnoj sezoni
        - Prostor za sjedenje na pramcu za promatranje dupina blizu vode
        - Plitki gaz za obalne i zaljevske operacije
    - title: Avantura i ekoturizam
      subtitle: Istraživanje obale, obilasci špilja, susreti s divljim životinjama
      description: Operateri avanturističkog turizma kreću se kroz raznolika okruženja — prelazak otvorenog oceana, istraživanje plitkih laguna, pristup obalnim špiljama i susrete s morskim životinjama. Njihovi brodovi trebaju svestranost za različite morske uvjete, izdržljivost za korištenje na udaljenim lokacijama i plitki gaz za pristup zaštićenim uvalama i pristaništima na plaži. Pouzdanost opreme je od presudne važnosti — kvar na udaljenoj lokaciji može uništiti turu i ugroziti goste.
      features:
        - Plitki trup za pristup laguni, špilji i plaži
        - Ojačani trup i Hypalon cijevi za izdržljivost u mješovitim uvjetima
        - Fleksibilno sjedenje — prilagodljivo za različite vrste tura i veličine grupa
        - Mjesta za montažu opreme za fotografsku opremu i specijaliziranu opremu
        - Mogućnost jednostavnog slijetanja na plažu — ojačana zaštita kobilice i cijevi
        - Zaštita od vremenskih uvjeta za udobnost gostiju tijekom produženih tura
    - title: Flote aktivnosti odmarališta
      subtitle: Kompletni programi vodenih sportova za goste — RIBs, SUPs, kajaci, sigurnost
      description: Odmarališta koja nude vodene sportove kao dio iskustva gostiju trebaju flotu koja balansira raznolikost, izdržljivost i prezentaciju brenda. Flota obično uključuje RIBs za izlete i transfere gostiju, SUPs kajake za samostalno istraživanje i napuhavajuće čamce za grupne ture s maskom i disalicom. Upravljanje različitim vrstama opreme kroz sezonske brojke gostiju zahtijeva dosljednu kvalitetu, lako održavanje i jedinstveno brendiranje. Kvar ili istrošena oprema izravno utječe na recenzije gostiju i prihode.
      features:
        - RIB tenderi za gostujuće izlete, transfere i izlete s maskom
        - SUP Daske i kajaci za samostalne aktivnosti gostiju
        - Napuhavajući čamci za grupne ture i ronjenje s maskom od plaže do grebena
        - Potpuno prilagođeno brendiranje na cijeloj opremi — jedinstvena prezentacija resorta
        - 'Paket sigurnosne opreme: PFD-ovi, zviždaljke, prva pomoć, užad za plutače'
        - Materijali za obuku osoblja o rukovanju opremom i sigurnosti gostiju
