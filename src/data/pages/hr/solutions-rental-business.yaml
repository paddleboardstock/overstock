testimonial:
  content: Iznajmljivao sam 5 dasaka iz lokalne trgovine i gubio 60% svog prihoda njima. Paddle Board Overstock mi je pomogao izgraditi vlastitu flotu od 15 SUPs. Kalkulator ROI kojeg su mi dali pokazao je da ću povrat ostvariti za 4 mjeseca — zapravo je trebalo 3. Sada proširujem na 30 dasaka i dodajem kajake.
  name: Daniel Okonkwo
  title: Vlasnik, Lakeland SUP Najam — Ontario, Kanada
content_segments:
  tagline: Profili Najma
  title: Rješenja za Najam Vodenih Sportova<br />Prema tipu operatora
  subtitle: Različiti najmom vodnih sportova različito upravljaju potrebama — od malih najma pokraj plaže SUP do velikih centara vodnih sportova u odmaralištima. Prilagođavamo naše pakete opreme i model podrške u skladu s tim.
  items:
    - title: Najmovi Pokraj Plaže & Jezera SUP
      subtitle: Poslovi velikog volumena, niske složenosti
      description: Operateri koji iznajmljuju daske za stand-up paddle i kajake izravno posjetiteljima plaže i jezera. Vaš prioritet je minimalizirati vrijeme između najmova, održavati opremu u rotaciji i upravljati sezonskim povećanjima potražnje s malim skladišnim prostorom.
      features:
        - Naduvane SUP flote koje se pakiraju na ravno — bez dokova ili prikolica
        - Komercijalna PVC ocjena za 100+ ciklusa najma po sezoni
        - Tkanina koja se brzo suši i otporna na UV za obnovu najma isti dan
        - Raspon dasaka označen bojama za lakšu identifikaciju flote
    - title: Centri Vodenih Sportova u Odmaralištima & Hotelima
      subtitle: Iskustvo gosta i usklađenost s brendom
      description: Resorti i hoteli koji nude vodene sportove kao pogodnost na lokaciji. Oprema mora izgledati vrhunski, pouzdano funkcionirati kod gostiju početnika i srednje razine te se integrirati s postojećim sustavima rezervacije aktivnosti i naplate u resortu.
      features:
        - Prilagođene daske i prsluci za spašavanje u bojama resorta
        - 'Miješana flota: SUPs, kajaci, pedaline i mali RIB čamci'
        - Tihi, bezgorivni električni pumpni sustavi za napuhavanje na plaži
        - Uključena obuka osoblja i uvod u održavanje
    - title: Operateri najma brodova i RIB
      subtitle: Flote brodova komercijalne kategorije
      description: Operateri koji iznajmljuju motorne brodove — RIB čamce, napuhavajuće čamce i male glisere — po satu ili pola dana. Vaša flota mora zadovoljiti pomorske sigurnosne propise, izdržati intenzivnu upotrebu gostiju i minimalizirati mehaničke zastoje između najma.
      features:
        - RIB paketi s 30–90 HP transoma spremnih za vanjske motore
        - Ploče od marine kvaliteta šperploče za dugotrajnu strukturnu otpornost
        - Sustavi quick-launch ventila za bržu pripremu
        - Komplet rezervnih dijelova + tehnička podrška prema SLA
    - title: Operateri tura i avantura
      subtitle: Flote za vođene izlete
      description: Operateri koji vode vođene ture vodenih sportova — SUP safariji, kajak izleti kroz špilje, izleti na snorkeling ili RIB ture po otocima. Oprema mora biti dovoljno stabilna za početnike, brza za čišćenje između grupa i dovoljno izdržljiva za svakodnevnu vođenu upotrebu u raznolikim uvjetima na vodi.
      features:
        - Ekstra stabilne SUP platforme (širine 32" +) za prve korisnike
        - Tandem kajak opcije za konfiguracije ture za parove/grupe
        - Uvijek dostupni prostori za opremu za snorkeling, suhe torbe i hladnjake
        - CE + USCG dokumentacija za usklađenost za komercijalno poslovanje
