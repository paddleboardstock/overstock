hero:
  tagline: Certifikati i standardi
  title: Certifikati kvalitete<br />i standardi usklađenosti
  subtitle: Paddle Board Overstock proizvodi se proizvode u skladu s međunarodnim standardima sigurnosti u pomorstvu, sustavima upravljanja kvalitetom i propisima o zaštiti okoliša.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock certifikati kvalitete i dokumentacija o usklađenosti
content_certifications:
  tagline: Naši certifikati
  title: Certificirana kvaliteta,<br />prepoznata globalno
  subtitle: 64 CE-certificirana modela i certifikati za cijelu tvornicu pokazuju našu predanost kvaliteti, sigurnosti i odgovornosti prema okolišu.
  items:
    - title: CE Certificirano
      description: 64 CE-certificirani modeli udovoljavaju europskim zahtjevima CE označavanja za rekreativne vodene plovove, osiguravajući ispunjenje standarda sigurnosti, zdravlja i zaštite okoliša.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Naš sustav upravljanja kvalitetom certificiran je prema ISO 9001:2015, obuhvaćajući dizajn, proizvodnju i distribuciju napuhavajućih vodnih plovila i pomorske opreme.
      icon: tabler:clipboard-check
    - title: UKCA Označeno
      description: Proizvodi koji se prodaju na tržištu UK nose UKCA oznaku, potvrđujući usklađenost s britanskim propisima za pomorsku opremu i osobne vodene plovove.
      icon: tabler:shield
    - title: BSCI Usklađeno
      description: Paddle Board Overstock je revidiran prema BSCI (Inicijativa za društvenu usklađenost poduzeća), pokazujući etičke proizvodne prakse, poštene radne uvjete i odgovornost u lancu opskrbe.
      icon: tabler:heart-handshake
    - title: REACH Sukladno
      description: Svi materijali korišteni u Paddle Board Overstock proizvodima udovoljavaju EU REACH propisima o kemijskoj sigurnosti, osiguravajući da nema zabranjenih tvari u našim PVC, Hypalon ili komponentama.
      icon: tabler:flask
    - title: Testiranje materijala
      description: Tkanine se testiraju na vlačnu čvrstoću, otpornost na kidanje, UV propadanje i otpornost na hladno pucanje. Svaka proizvodna serija se uzorkuje i provjerava.
      icon: tabler:test-pipe
content_factory:
  tagline: Standardi tvornice
  title: Izvrsnost u proizvodnji<br />— Izrađeno prema specifikacijama
  subtitle: Naš pogon od 12.000 m² radi pod strogim protokolima kontrole kvalitete u svakoj fazi proizvodnje.
  list:
    - 'Inspekcija ulaznog materijala: Svi sirovine — PVC tkanina, Hypalon, aluminij, šperploča, ljepila — testiraju se u skladu s tehničkim specifikacijama prije ulaska u proizvodnju.'
    - 'Kontrola kvalitete u procesu: Svaka faza proizvodnje ima dokumentirane kontrolne točke. Provjeravaju se čvrstoća zavarivanja, poravnanje šavova, instalacija ventila i moment pričvršćenja.'
    - 'Testiranje tlaka: Svaka napuhavajuća komora podvrgava se testiranju tlaka od 1,25× nazivne vrijednosti 24–48 sati. Stopa curenja mora biti unutar prihvatljivih granica prema ISO 6185.'
    - 'Konačna inspekcija: Gotovi proizvodi se pregledavaju radi dimenzijske preciznosti, kozmetičkog završetka, potpune opreme dodataka i integriteta pakiranja prije slanja.'
    - 'Praćenje serija: Svaki proizvod nosi serijski broj povezan s proizvodnom serijom, omogućujući potpunu sljedivost od sirovine do gotovih proizvoda.'
content_safety:
  tagline: Standardi sigurnosti na moru
  title: Sigurnost na prvom mjestu<br />— Dizajnirano za pouzdan rad
  subtitle: Paddle Board Overstock proizvodi su dizajnirani i testirani kako bi zadovoljili međunarodne standarde sigurnosti na moru za komercijalnu i rekreacijsku upotrebu.
  items:
    - title: ISO 6185
      description: Pneumatski čamci udovoljavaju standardima ISO 6185 za konstrukciju, stabilnost, plovnost i nosivost.
      icon: tabler:sailboat
    - title: ABYC standardi
      description: Električni sustavi i sustavi goriva slijede ABYC (American Boat & Yacht Council) standarde za sigurnu instalaciju i rad.
      icon: tabler:bolt
    - title: SOLAS Usklađenost
      description: Sigurnosna oprema i sredstva za spašavanje života zadovoljavaju zahtjeve SOLAS (Safety of Life at Sea) ondje gdje je primjenjivo.
      icon: tabler:lifebuoy
