label: Jamstvo
headline: Paddle Board Overstock Ograničeno jamstvo proizvođača
subtitle: Paddle Board Overstock stoji iza kvalitete svakog napuhavajućeg morskog proizvoda koji proizvodimo. Ovo ograničeno jamstvo određuje uvjete i pokriće za Paddle Board Overstock vaš proizvod.
seo:
  headline: Paddle Board Overstock Jamstvo na napuhivački čamac — 5-godišnje ograničeno jamstvo | Paddle Board Overstock
  description: Paddle Board Overstock Nudi 5-godišnje ograničeno jamstvo na primarnu cijevnu tkaninu, spojeve i strukturnu čvrstoću trupa od staklenih vlakana. Također pokriva ventile za napuhavanje i tvornički ugrađene dodatke. Potpuni uvjeti i odredbe za Paddle Board Overstock jamstvo na napuhujući čamac.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ovo ograničeno jamstvo odnosi se na Paddle Board Overstock nove brendirane napuhavajuće morske proizvode Paddle Board Overstock kupljene izravno od Paddle Board Overstock ovlaštenog prodavača ili trgovca. Datum stupanja na snagu je provjerljiv datum originalne maloprodajne kupnje.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Jamstvo i trajanje</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Integritet tkanine primarnih cijevi (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturni integritet trupa od stakloplastike</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Sposobnost zadržavanja zraka na napuhavajućem spoju cijevi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Funkcionalnost ventila za napuhavanje</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 godina</h3>
        <p class="text-sm text-gray-600 mt-1">Tvornički ugrađeni dodaci i pomoćni dijelovi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 godina*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercijalna, najam ili flotna upotreba — sve komponente</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komercijalna, državna, čarter, najam ili instruktivna upotreba smanjuje jamstvo na 1 godinu. Utrka ili natjecateljska upotreba potpuno poništava jamstvo.</p>
  </div>

  <h2>Što je pokriveno</h2>
  <h3>Primarna cijevna tkanina (5 godina)</h3>
  <p>Paddle Board Overstock jamči glavnu cijevnu tkaninu protiv propadanja poroznosti koje značajno narušava sposobnost proizvoda da održava operativnu inflaciju. Ovo se odnosi na CSM Hypalon() presvučenu tkaninu i sve ostale materijale cijevne tkanine korištene u proizvodnji.</p>

  <h3>Strukturni integritet trupa od stakloplastike (5 godina)</h3>
  <p>Za proizvode s plastičnim trupom ojačanim staklenim FRPvlaknima, osnovna kompozitna struktura je osigurana protiv strukturnog kvara zbog nedostataka u materijalima ili izradi.</p>

  <h3>Sposobnost zadržavanja zraka u šavu na napuhavanje cijevi (5 godina)</h3>
  <p>Spojevi napuhavajućih cijevi, gdje su spojeni tijekom proizvodnje, zaštićeni su od proizvodnih nedostataka koji uzrokuju znatno propuštanje zraka kroz spoj. Periodični pregledi i održavanje odgovarajućih tlakova napuhavanja uvjeti su pokrića.</p>

  <h3>Funkcionalnost ventila za napuhavanje (5 godina)</h3>
  <p>Ventili za napuhavanje zraka koji su izvorno ugrađeni Paddle Board Overstock od strane su osigurani protiv proizvodnih nedostataka u materijalima ili izradi koji sprječavaju ventil da zadrži zrak prema dizajnu.</p>

  <h3>Tvornički ugrađeni dodaci (1 godina)</h3>
  <p>Komponente i oprema proizvedeni Paddle Board Overstock u tvornici i izvorno ugrađeni u tvornici imaju jamstvo protiv nedostataka u materijalu i izradi tijekom jedne godine. Ovo isključuje predmete trećih strana, koji su pokriveni samo njihovim proizvođačkim jamstvima.</p>

  <h2>Što nije pokriveno</h2>
  <ul>
    <li>Kozmetičke nepravilnosti uključujući promjenu boje, mrlje, blijeđenje, crtanje kredom ili bilo kakve promjene izgleda</li>
    <li>Ubodi, posjekotine, poderotine, poderotine ili druga fizička oštećenja</li>
    <li>Lomljenje, pucanje, abrazija, struganje ili propadanje zbog trenja ili kontakta</li>
    <li>Degradacija zbog UV izloženosti svjetlu, vremenskih utjecaja ili atmosferskih uvjeta</li>
    <li>Oštećenja od kontakta s gorivima, otapalima, kiselinama, alkalijama ili kemikalijama</li>
    <li>Šteta uzrokovana nemarom, nepravilnom uporabom, zloupotrebom, nesrećom ili uobičajenim habanjem</li>
    <li>Problemi s gelcoatom ili površinom boje (mjehurići, pucanje, promjena boje, blijeđenje)</li>
    <li>Oštećenja od udara, naprezanja, nepravilne potpore ili prijevoza prikolicom</li>
    <li>Šteta uzrokovana nepravilnom inflacijom/deflacijom ili korištenjem neodobrenih uređaja za inflaciju</li>
    <li>Oprema, komponente ili sustavi trećih strana (pokriveni od strane njihovih proizvođača)</li>
  </ul>

  <h2>Obveza proizvođača i pravni lijek</h2>
  <p>Paddle Board OverstockJedina i isključiva obveza je popravak ili zamjena, po Paddle Board Overstockizboru, bilo koje komponente za koju se utvrdi da je neispravna u materijalima ili izradi i pokrivena ovim jamstvom. Popravci ili zamjene izvode se u Paddle Board Overstock ovlaštenom servisnom servisu ili u njegovom ovlaštenom servisu. Komponente koje su popravljene ili zamijenjene jamče se samo za neistekli dio izvornog jamstvenog roka.</p>

  <h2>Uvjeti jamstva</h2>
  <ul>
    <li><strong>Registracija:</strong>Proizvod mora biti pravilno registriran kako je propisano uvjetima jamstva.</li>
    <li><strong>Održavanje:</strong>Proizvod se mora održavati u skladu s Paddle Board Overstockobjavljenim smjernicama, uključujući periodične preglede i održavanje odgovarajućih tlakova inflacije.</li>
    <li><strong>Suradnja:</strong>Kupac mora u potpunosti i brzo surađivati Paddle Board Overstock u svim pitanjima vezanim uz jamstvene zahtjeve.</li>
    <li><strong>Izvorni kupac:</strong>Ovo jamstvo daje se isključivo originalnom krajnjem korisniku i nije prenosivo.</li>
  </ul>

  <h2>Komercijalna upotreba</h2>
  <p>Ako se proizvod koristi za komercijalne, državne, neprofitne, čarter, najam, instruktivnu ili bilo koju drugu svrhu osim privatne rekreativne upotrebe, jamstveni rok za sve komponente smanjuje se na jednu (1) godinu od izvornog datuma maloprodajne kupnje. Korištenje u utrkama, brzinskim ili izdržljivostnim natjecanjima odmah i neopozivo poništava jamstvo u potpunosti.</p>

  <h2>Kako podnijeti zahtjev za jamstvo</h2>
  <p>Kontaktirajte Paddle Board Overstock ili svog ovlaštenog prodavača s dokazom o kupnji i detaljnim opisom problema.Paddle Board Overstock Pregledat ćemo zahtjev i dati upute za inspekciju i servis.</p>
  <p>Za upite vezane uz jamstveni servis, molimo kontaktirajte nas putem našeg<a href="/contact" class="text-sky-600 underline">Kontakt stranica</a>s brojem narudžbe i detaljima o proizvodu.</p>

  <h2>Predmeti trećih strana</h2>
  <p>Oprema, komponente ili sustavi proizvedeni od strane trećih strana (čak i ako su instalirani od Paddle Board Overstockstrane ) pokriveni su isključivo bilo kojim jamstvom koje nudi njihov proizvođač.Paddle Board Overstock Izričito se odriče bilo kakve jamstvene odgovornosti za takve predmete trećih strana.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Ova izjava o jamstvu sažetak je Paddle Board Overstock potpune ograničene garancije proizvođača. Potpuni pravni jamstveni dokument regulira sve uvjete i odredbe jamstva. Specifikacije podložne promjenama bez prethodne najave.Paddle Board Overstock je tvornička marka Paddle Board Overstock Qingdao Manufacturing Hub-a.
  </p>
