content_priorities:
  tagline: Što kupci provjeravaju
  title: 8 stvari koje kupci provjeravaju<br />tučevom posjetu tvornici
  subtitle: Na temelju povratnih informacija od 50+ kupaca iz različitih zemalja, ovo je osam prioriteta koje klijenti procjenjuju prije nego što naruče B2B.
  items:
    - title: Pravi proizvođač
      description: 'Jeste li stvarna tvornica, a ne trgovačko poduzeće? Kupci provjeravaju: pravnu osobu, stvarnu proizvodnu opremu, zaposlenike koji upravljaju strojevima, trenutne proizvodne narudžbe na proizvodnoj podlozi i dosljednost između web stranice i radionice.'
      icon: tabler:building-factory
    - title: Proizvod prikladan za primjenu
      description: Odgovara li RIB njihovom specifičnom slučaju korištenja? Operateri u odmaralištima, spašavanju, ronjenju, ribolovu i ophodnji imaju fundamentalno različite zahtjeve. Kupci ocjenjuju raspored palube, materijal cijevi i opcije opreme na izloženoj brodici.
      icon: tabler:target
    - title: Stabilnost i ponovljivost kvalitete
      description: Je li 50. jedinica jednako dobra kao i prva? Kupci ispituju QC sustave, kontrolne točke u procesu, obradu nesukladnosti i traže da vide zapise iz više proizvodnih ciklusa kako bi provjerili dosljednost.
      icon: tabler:repeat
    - title: Autentičnost dokumentacije o usklađenosti
      description: Jesu li CE certifikati model-specifični? Je li DoC potpisan od strane stvarne osobe? Može li se usklađenost provjeriti po broju trupa? Kupci provjeravaju tvrdnje općenito naspram dokumentacije specifične za model.
      icon: tabler:file-certificate
    - title: Izvršenje prilagodbe
      description: Može li tvornica zapravo isporučiti prilagođene konfiguracije? Kupci traže dokaze o prošlim prilagođenim projektima, prototipove na izložbi, inženjerske crteže i mogućnost rasprave o tehničkim modifikacijama na licu mjesta.
      icon: tabler:adjustments
    - title: Vrijeme isporuke i kapacitet
      description: 'Jesu li navedeni vremenski okviri realni? Kupci procjenjuju: trenutni volumen proizvodnje, raspoloživi kapacitet, veličinu radne snage, razinu zaliha materijala i ima li tvornica sustav planiranja proizvodnje.'
      icon: tabler:clock
    - title: Cijene i uvjeti trgovine
      description: 'Jesu li cijene transparentne? FOB Je li cijena jasna? Kupci provjeravaju: raspodjelu jediničnih cijena, troškove alata, troškove pakiranja i može li tvornica podnijeti ili DDP CIF pristati na odgovarajuću izvoznu dokumentaciju.'
      icon: tabler:currency-dollar
    - title: Naknadna prodaja i rezervni dijelovi
      description: 'Što se događa nakon isporuke? Kupci procjenjuju: dostupnost rezervnih dijelova, proces jamstva, sekcije zamjenske cijevi, zamjenu ventila i ima li tvornica dokumentirani protokol nakon prodaje.'
      icon: tabler:headset
content_tour:
  tagline: Trasa tvorničke ture
  title: Revizijska tura —<br />Što ćete vidjeti
  subtitle: Naš standardni obilazak tvornice prati definiranu rutu osmišljenu kako bi se odgovorilo na pitanja kupaca na svakoj stanici.
  items:
    - title: 1. Soba za sastanke — Uvod u tvrtku
      description: Poslovna licenca, ISO 9001 i BSCI certifikati, izvozne dozvole i povijest tvrtke. Brzi pregled proizvodnih kapaciteta i opsega usklađenosti.
      icon: tabler:users
    - title: 2. Skladište sirovina — IQC stanica
      description: Zapisi o inspekciji dolaznih materijala, certifikati serija tkanina, ljepila i uzorci hardvera. Pogledajte kako se materijali testiraju prije ulaska u proizvodnju.
      icon: tabler:building-warehouse
    - title: 3. Izrada cijevi — RF zavarivanje i ručno lijepljenje
      description: Proces zavarivanja ili lijepljenja živih cijevi, demonstracije ispitivanja čvrstoće šava i ugradnja ventila. Promatrajte konstrukciju po komorama i kontrolne točke kvalitete.
      icon: tabler:flame
    - title: 4. Laminacija trupa — radionica za GRP
      description: Proces polaganja staklenih vlakana, nanošenje gelcoata i stvrdnjavanje trupa. Pogledajte raspored laminacije i strukturnog ojačanja za RIB različite modele.
      icon: tabler:layers-subtract
    - title: 5. Sastavljanje i integracija
      description: Spajanje cijevi trupa, ugradnja konzole i sjedala, integracija električnog i gorivnog sustava te montaža opreme. Promatrajte proizvodnu liniju u radu.
      icon: tabler:tool
    - title: 6. Stanica za ispitivanje tlaka
      description: Test zadržavanja tlaka 24-48 sati na 1,25x nazivnom tlaku. Pogledajte zapise testova, manometre i kriterije prolaza/pada. Pogledajte kako su rezultati testova povezani sa serijskim brojevima trupa.
      icon: tabler:gauge
    - title: 7. Završna inspekcija i kontrola kvaliteta
      description: Popis kvalitete od 100 točaka po jedinici, dimenzionalna verifikacija, kozmetička inspekcija i provjera integriteta ambalaže. Pregled evidencije o neusklađenosti i evidencije korektivnih mjera.
      icon: tabler:clipboard-check
    - title: 8. Soba za pregled dokumenata
      description: Dokumentacija o usklađenosti po modelu (DoC, građevinska ploča, priručnik za vlasnika), zapisi o proizvodnoj sljedivosti, HIN registar i demonstracija baze podataka za praćenje serija materijala.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvalitetni dokazi
  title: 8-stupanjski QC lanac<br />— Provjerljivo na svakom koraku
  subtitle: Naš lanac kontrole kvalitete proteže se od dolaznih materijala do konačne pošiljke, s dokumentiranim dokazima u svakoj fazi.
  items:
    - title: 'Faza 1: Inspekcija dolaznog materijala'
      description: Svaka serija PVC, Hypalon, staklenih vlakana, aluminija, ljepila i hardvera testira se prema specifikacijama prije ulaska u proizvodnju. Čvrstoća na zatezanje, prionjivost premaza i dimenzionalne provjere prema AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Faza 2: QC zavarivanje / lijepljenje cijevi'
      description: Testiranje čvrstoće šava na odljepljivanje po proizvodnoj seriji. RF parametri zavarivanja nadzirani i zabilježeni. Ručno lijepljeni šavovi provjeravaju se za dosljedno prekrivanje ljepilom i vrijeme stvrdnjavanja.
      icon: tabler:flame
    - title: 'Faza 3: QC laminacija trupa'
      description: Mjerenje debljine gelcoata, provjera polaganja staklenih vlakana prema rasporedu laminata i nadzor vremena stvrdnjavanja. Položaji strukturnih ojačanja provjeravaju se prema inženjerskim crtežima.
      icon: tabler:layers-subtract
    - title: 'Faza 4: QC montaža i integracija'
      description: Integritet spoja trupa i cijevi, moment pričvršćenja konzole i sjedala, električna kontinuitet i test curenja gorivnog sustava. Svaka točka instalacije provjerava se prema specifičnoj kontrolnoj listi montaže modela.
      icon: tabler:tool
    - title: 'Faza 5: Test zadržavanja tlaka'
      description: Svaka napuhavajuća komora napuhana je na 1,25x ocijenjenog PSI i zadržana 24–48 sati. Pad tlaka zabilježen po komori. Prag prolaska/neuspjeha dokumentiran. Povezano sa serijskim brojem trupa.
      icon: tabler:gauge
    - title: 'Faza 6: Završna inspekcija'
      description: Kontrolna lista kvalitete od 100 točaka koja pokriva dimenzionalnu točnost, kozmetički završetak, cjelovitost dodatne opreme, paket dokumentacije i integritet pakiranja. Neovisno od proizvodnog tima.
      icon: tabler:clipboard-check
    - title: 'Faza 7: Dokumentacija usklađenosti'
      description: Specifična DoC modela, provjera pločice proizvođača, cjelovitost uputa za vlasnika i unos u HIN registar. Svi dokumenti usklađenosti pripremljeni i provjereni prije otpreme.
      icon: tabler:file-certificate
    - title: 'Faza 8: Otpust otpreme i praćenje'
      description: Konačna otprema zahtijeva da sve QC faze budu prošle, dokumentacija usklađenosti kompletna i dokumentacija za otpremu provjerena. Zapis trupa zatvoren i arhiviran 10+ godina.
      icon: tabler:truck
content_traceability:
  tagline: Praćenje proizvodnje
  title: HIN → Master File →<br />Zapis trupa → Isporuka
  subtitle: Svaka RIB brod nosi jedinstveni Hull Identification Number povezan s potpunim nizom zapisa o proizvodnji i usklađenosti.
  items:
    - title: Identifikacijski broj trupa (HIN)
      description: 14-znamenkasti jedinstveni identifikator trajno označen na svakom brodu. Sadrži kod proizvođača (MIC), oznaku modela, godinu proizvodnje i serijski broj. Ključ koji otvara cijeli niz praćenja.
      icon: tabler:hash
    - title: Glavni tehnički dosje
      description: Dokumentacija o usklađenosti i inženjerska dokumentacija za obitelj modela. Sadrži GA crteže, procjenu rizika, izračune stabilnosti, specifikacije materijala i primjenjive standarde. Povezano sa svim trupovima tog modela.
      icon: tabler:folder
    - title: Pojedinačni zapis trupa
      description: 'Zapis proizvodnje po trupu: HIN, datum proizvodnje, serija cijevi, certifikati materijala, rezultat testa tlaka, konačna konfiguracija, specifikacija motora, rezultati kontrolne liste kvalitete i destinacija isporuke. 21+ podatkovno polje po trupu.'
      icon: tabler:file-description
    - title: Paket za usklađenost korisnika
      description: Paket isporuke po trupu uključuje DoC, fotografiju pločice proizvođača, upute za vlasnika, kontrolnu listu usklađenosti i listu konačne konfiguracije. Isporučuje se s brodom i arhivira u tvornici 10+ godina.
      icon: tabler:package
content_red_flags:
  tagline: Zamke audita
  title: Crvena upozorenja kupcima<br />Lako uočljivo
  subtitle: Uobičajeni problemi koji narušavaju povjerenje kupaca tijekom revizija tvornica. Proaktivno rješavamo svaki od njih.
  items:
    - title: CE Opće tvrdnje bez opsega modela
      description: '"Svi proizvodi CE certificirani" bez navođenja koje direktive, koji modeli i koji modul za usklađenost. Crvena zastava: sugerira da je usklađenost površna, a ne po modelu ili konfiguraciji.'
      icon: tabler:alert-triangle
    - title: Nema dokaza fizičkog testiranja
      description: 'Zahtjevi za testiranje tlaka bez evidencije o testiranju, mjerača ili testne stanice vidljive na tvorničkom podu. Crvena zastava: tvrdnje o kvaliteti ne mogu se provjeriti tijekom posjeta.'
      icon: tabler:alert-triangle
    - title: Sljedivost nedostajućeg materijala
      description: 'Nema evidencije o serijama, nema dolazne inspekcije ili nema veze između certifikata o materijalu i gotovih proizvoda. Crvena zastavica: nema načina da se problemi s kvalitetom pronađu do izvora.'
      icon: tabler:alert-triangle
    - title: Generička dokumentacija
      description: 'Jedan DoC koji pokriva sve modele, bez HIN-specifičnih zapisa ili "predložka" dokumenata o usklađenosti. Crvena zastava: usklađenost nije vezana uz pojedinačne proizvodne jedinice.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Dostava i pakiranje
  title: RIB Kontejner za čamac<br />Utovar i sanduk
  subtitle: Naša rješenja za dostavu štite vašu investiciju od Qingdaa do odredišne luke. Planovi utovara kontejnera i specifikacije sanduka dostupni su za svaki model.
  items:
    - title: Konfiguracije kontejnera od 20 stopa
      description: 'Standardni kontejner od 20 stopa: 1-2 RIB čamca (4,0-5,5 m) smještena s odvojenim palubom i cijevima, ili 8-12 SUP dasaka. RIB + SUP Dostupne su mješovite konfiguracije. Detaljan plan utovara dostupan je po narudžbi.'
      icon: tabler:box
    - title: Konfiguracije kontejnera od 40 stopa
      description: 'Standardni kontejner od 40 stopa: 2-4 RIB broda (do 7,0 m) s trupovima smještenim i cijevima složenim, ili 20-30 SUP dasaka. Za više modele dostupno je sjedište od 40 stopa RIB . Pakiranje optimizirano za volumen smanjuje troškove transporta po jedinici.'
      icon: tabler:container
    - title: Drveni sanduk za RIB trupove
      description: Aluminijski i GRP trupovi smješteni u drvene sanduke po mjeri s pjenastim jastučićima, barijerom protiv vlage i čeličnim trakama. Dimenzije i težina sanduka po modelu dostupne su za logističko planiranje. Uključena je certifikacija za drvo obrađenog toplinom ISPM-15.
      icon: tabler:wood
    - title: Pakiranje za razdvajanje cijevi i palube
      description: Cijevi su se ispuhale i preklapale odvojeno od trupa radi učinkovitosti prostora. Palubne ploče, konzole i sjedala pakirani su u zaštitni omot s montažnim hardverskim kompletima. Upute za ponovno sastavljanje dolazile su uz svaku pošiljku.
      icon: tabler:package
    - title: Zaštita od vlage i korozije
      description: VCI protukorozijski papir za aluminijske komponente, pakete silikagela za isušivanje i vakuumski zatvorene vrećice za hardver. Sprječava oštećenja od kondenzacije tijekom 30-45 dana plovidbe oceanom.
      icon: tabler:droplet-off
    - title: FOB Qingdao dokumentacija
      description: Teretni list, komercijalni račun, popis pakiranja, potvrda o podrijetlu i dokumentacija o usklađenosti po pošiljci. Dostupna konsolidacija FCL i LCL. Podrška carinskoj dokumentaciji za tržišta EU, SAD-a i Bliskog istoka.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Dokazi o verifikaciji
  title: Revizijski dokazi<br />Možete provjeriti na licu mjesta
  subtitle: Tijekom posjeta tvornicama, klijenti mogu provjeriti specifične dokaze na svakom proizvodnom području. Evo na što treba obratiti pažnju — i što pripremamo za svaku reviziju.
  areas:
    - area: Skladište sirovina
      what_to_verify: Jesu li materijali stabilni? Postoji li miješanje serija?
      evidence: Evidencija dolazne inspekcije, oznake serija, FIFO skladištenje, popis odobrenih dobavljača, certifikati materijala (PVC, Hypalon, fiberglas, aluminij, ljepila, pribor)
      icon: tabler:building-warehouse
    - area: Proizvodnja cijevi
      what_to_verify: Kako je zajamčena čvrstoća šava i zrakonepropusnost?
      evidence: Procesne kartice, potvrda prvog uzorka, zapisnici o ispitivanju pritiska po komori, zapisi o popravcima i ponovnim testovima, zapisnici o ugradnji ventila
      icon: tabler:flame
    - area: Proizvodnja trupa
      what_to_verify: Kako se kontrolira strukturna dosljednost?
      evidence: Kontrolirani procesni dokumenti, kontrolne točke kvalitete, numeracija poluproizvoda, mjerenja debljine gelcoata, provjera rasporeda laminacije
      icon: tabler:layers-subtract
    - area: Prostor montaže
      what_to_verify: Kako se sprječava pogrešna montaža opcionalnih dijelova?
      evidence: BOM, radni nalozi, kontrolne liste konfiguracije, inspekcijske kartice radnog mjesta, provjere momenta i funkcionalnosti po modelu
      icon: tabler:tool
    - area: Stanicu za testiranje
      what_to_verify: Kako potvrđujete da je brod ispravan prije isporuke?
      evidence: Testne procedure, popis instrumenata, zapisi kalibracije, zapisnici o ispitivanju pritiska (1,25x / 24-48h), kontrolne liste funkcionalnog testa, dokumentirana kriterija prolaska/neprolaska
      icon: tabler:gauge
    - area: Prostor za nepridržavanja
      what_to_verify: Kako se rukuje s nedostacima?
      evidence: Naljepnice za izolaciju, zapisnici NCR-a, analiza uzroka, zapisi o odobrenju prepravaka, praćenje CAPA (korektivne i preventivne akcije)
      icon: tabler:alert-triangle
    - area: Skladište gotovih proizvoda
      what_to_verify: Kako spriječiti pogrešnu isporuku i oštećenje?
      evidence: Oznake gotovih proizvoda, zapisnici o usklađivanju narudžbi, standardi pakiranja, zapisnici o pred-ispitivanjima prije otpreme
      icon: tabler:box
    - area: Rezervni dijelovi i postprodaja
      what_to_verify: Možete li podržati dugoročnu postprodajnu uslugu?
      evidence: Popis uobičajenih rezervnih dijelova, strategija zaliha, sustav numeracije dijelova, dokumentacija procesa jamstva, upute za održavanje
      icon: tabler:headset
content_closing_script:
  tagline: Revizija po narudžbi
  title: Od posjete tvornici<br />do potvrđenog projekta
  subtitle: Uspješna revizija ne bi trebala završiti fotografijama i rukovanjem. Prije odlaska osiguravamo da su tri komercijalna ishoda dokumentirana.
  items:
    - title: Potvrditi tehničku konfiguraciju
      description: Dogovoriti se o modelu, primjeni, ključnim opcijama, ciljnom tržištu, procijenjenoj količini i rasporedu isporuka — sve dokumentirano prije odlaska.
      icon: tabler:checklist
    - title: Potvrditi dokumente za sljedeći korak
      description: 'Definirajte što Paddle Board Overstock slijedi: revidirani GA, popis konfiguracije, ponude, kontrolni popis dokumenata, uzorak plana ili NDA — s određenim vremenskim okvirima.'
      icon: tabler:file-plus
    - title: Potvrdite zajedničku vremensku crtu
      description: Revidirana konfiguracija i preliminarna ponuda u roku od 3 radna dana. Potvrda uzorka ili dolaska u roku od 7 dana. Inženjerski pregled ili inspekcija treće strane u roku od 14 dana. Datum sljedećeg sastanka i zaključane odgovorne strane.
      icon: tabler:calendar
faq:
  title: Revizija tvornice — Često postavljana pitanja
  questions:
    - q: Mogu li osobno posjetiti tvornicu?
      a: Da. Rado provodimo inspekcije tvornica na licu mjesta u našem objektu od 12.000 m² u Qingdaou. Naš standardni obilazak obuhvaća 8 stanica od skladišta sirovina do sobe za pregled dokumenata. Za početnu kvalifikaciju dostupni su i virtualni obilasci tvornica putem video poziva.
    - q: Prihvaćate li revizije trećih strana (BSCI, SMETA, SGS)?
      a: Da. Održavamo BSCI certifikaciju (Intertek) i pozdravljamo protokole revizije prilagođene klijentima. Također možemo dogovoriti SGS TÜV inspekcije na zahtjev. Izvještaji o reviziji dostupni su pod NDA.
    - q: Mogu li vidjeti testiranje pod pritiskom tijekom posjeta?
      a: Naša stanica za testiranje tlaka dio je standardne rute obilaska (tour). Ovisno o proizvodnom rasporedu, možete promatrati aktivne testove tlaka s očitanjem manometra i zapisima testova. Dnevnici ispitivanja tlaka po trupu uvijek su dostupni za pregled.
    - q: Kako se nosite s proizvodima koji nisu u skladu s pravilima?
      a: Neusklađene jedinice se segregiraju, dokumentiraju i pregledavaju prema ISO našem 9001 procesu korektivnih mjera. Provodi se analiza uzroka, provode se korektivne mjere, a vodi se evidencija. Kupci mogu pregledavati naš NCR dnevnik tijekom revizija.
    - q: Koja je dokumentacija o usklađenosti dostupna za pregled?
      a: 'Tijekom revizije možete pregledati: uzorke DoC-a specifične za model, specifikacije ploča proizvođača, HIN registar, nacrte priručnika za vlasnike, popise primjenjivih standarda i zapise o procjeni sukladnosti za svaku obitelj modela.'
    - q: Kako mogu rezervirati virtualni obilazak tvornice?
      a: Kontaktirajte naš prodajni tim kako biste dogovorili video turu uživo putem WhatsAppa, Zooma ili Teamsa. Pratimo istu rutu s 8 stanica i možemo se fokusirati na specifična područja prema vašim interesima. Tipična virtualna tura traje 45-60 minuta.
    - q: Je li tvornica stvarni proizvođač ili trgovačka tvrtka?
      a: Paddle Board Overstock je stvarni proizvođač. Mi upravljamo tvornicom u Laixiju, Qingdao. Poslovna licenca, opseg proizvodnje i fizička proizvodnja mogu se provjeriti tijekom revizije.
    - q: Koje kvalitetne zapise mogu pregledati?
      a: Evidencije inspekcija dolaznog materijala, kontrolne točke kontrole kvalitete tijekom procesa, dnevnici ispitivanja tlaka, popisi završnih inspekcija od 100 točaka, izvještaji o neusklađenosti, zapisi o korektivnim mjerama i zapisi o sljedivosti po trupu. Sve se održava prema ISO zahtjevima 9001.
