articles:
  sup:
    - title: SUP Osnove — Vodič za početnike
      desc: Sve što početnik treba znati — vrste dasaka, veličina reketa, stav i savjeti za prvi dan.
    - title: SUP Vodič za veličinu
      desc: Pronađite pravu duljinu, širinu i volumen daske za vašu težinu, vještinu i stil veslanja.
    - title: Napuhavanje protiv tvrde daske
      desc: Koji je pravi za vas? Usporedba prenosivosti, performansi, izdržljivosti i cijene.
    - title: Srednje tehnike
      desc: Podignite svoj veslački nivo naprednim zamahima, tehnikama okretanja i upravljanjem u nemirnim vodama.
    - title: Kako odabrati napuhavajući SUP
      desc: Navigirajte ključnim čimbenicima — konstrukcija, debljina, postavljanje peraja i uključeni dodaci.
    - title: Sigurnost na vodi
      desc: Osnovno znanje o sigurnosti uključujući čitanje vremena, odabir PFD, samopomoć i veslanje u grupi.
  inflatable-boat:
    - title: Referenca materijala
      desc: PVC, Hypalon, drop-stitch, ocjene deniera — razumite od čega je izrađena vaša napuhujuća oprema.
    - title: PVC protiv Hypalon
      desc: Definitivna usporedba PVC i Hypalon tkanina za napuhavajuće čamce — izdržljivost, otpornost na UV i cijena.
    - title: Drop-Stitch Objašnjenje Jezgre
      desc: Kako tisuće unutarnjih niti stvaraju rigidnu platformu na 12-15 PSI za visokoučinkovite napuhujuće SUPs.
    - title: Pregled tehnologije napuhavanja
      desc: Kako se konstruiraju napuhavajući čamci i SUPs — od slojeva materijala do ventilskih sustava i zavarivanja šavova.
    - title: Vodič za rigidni napuhujući čamac (RIB)
      desc: Sve o konstrukciji RIB, vrstama trupa, materijalima cijevi i odabiru pravog RIB za vaše potrebe.
    - title: Napuhavajući čamac vs RIB
      desc: Ključne razlike između tradicionalnih napuhavajućih čamaca i čvrstih napuhujućih čamaca sa čvrstim trupom za različite slučajeve upotrebe.
  water-safety:
    - title: Vodič za sigurnost na vodi
      desc: Osnovno znanje o sigurnosti za svakog veslača — vrijeme, PFD-ovi, samopomoć i protokoli veslanja u grupi.
    - title: Vodič za prsluke za spašavanje i PFD
      desc: Kako odabrati odgovarajući osobni plovni uređaj za SUP, kajakarenje, vožnju čamcem i profesionalnu upotrebu.
    - title: SUP Sigurnosni kontrolni popis
      desc: Kontrolni popis sigurnosti prije lansiranja koji svaki veslač na dasci treba slijediti prije ulaska u vodu.
    - title: Sigurnost veslanja u hladnoj vodi
      desc: Osnovne mjere predostrožnosti, oprema i tehnike za veslanje u uvjetima hladne vode.
    - title: Pogreške početnika u veslanju
      desc: Uobičajene pogreške koje prave osobe koje prvi put veslaju i kako ih izbjeći za sigurnije i ugodnije iskustvo.
    - title: CE Objašnjena certifikacija
      desc: Što CE certifikacija znači za napuhavajuće plovilo — standardi, testiranje i zašto je važna za sigurnost.
ui:
  read_guide: Pročitajte vodič →
  card_tech: Inženjering pomorske sigurnosti i testiranje materijala
  card_products: Istražite cjelokupni Aquafarer katalog proizvoda
  card_trust: CE, ISO i BSCI usklađenost
materials:
  intro_p1: Performanse, trajnost i sigurnost napuhavajućeg plovila gotovo u potpunosti ovise o materijalima korištenima u njegovoj izradi. Od tkanine koja tvori cijevi do niti koje daju SUP dasci rigidnost, svaki izbor materijala utječe na to kako proizvod funkcionira na vodi i koliko dugo traje.
  intro_p2: 'Ovaj vodič pokriva četiri osnovna materijala korištena u modernim napuhavajućim plovilima: PVC tkaninu, Hypalon CSM gumu, drop-stitch konstrukciju jezgre i EVA pjenasti podest. Razumijevanje ovih materijala pomoći će vam pri odabiru pravog proizvoda za vaše potrebe i njegovom održavanju za maksimalni vijek trajanja.'
  labels:
    advantages: Prednosti
    limitations: Ograničenja
    best_for: 'Najbolje za:'
  items:
    - name: PVC (polivinil-klorid)
      summary: Industrijski standard za rekreativne napuhavajuće čamce i SUPs. Višeslojna laminirana tkanina nudi izvrsnu omjer snage i težine po pristupačnoj cijeni.
      pros:
        - Povoljno — 30-50% jeftinije od Hypalon
        - Lagana i jednostavna za rukovanje
        - Dobra UV otpornost uz odgovarajuće premaze
        - Širok raspon boja i završnih obrada
        - Jednostavno za popravak s PVC zakrpama i otapalnim ljepilom
      cons:
        - Kraći vijek trajanja od Hypalon (7-10 godina)
        - Manje fleksibilna na niskim temperaturama
        - Niža kemijska otpornost
        - S vremenom može doći do migracije plastifikatora
      best_for: Rekreativni SUPs, proračunski čamci, flote za iznajmljivanje, sezonska uporaba, slatka i priobalna voda.
    - name: Hypalon (CSM guma)
      summary: Vrhunski sintetički gumeni materijal poznat po izuzetnoj izdržljivosti, UV otpornosti i dugovječnosti. Zlatni standard za komercijalne i vojne napuhavajuće čamce.
      pros:
        - Izvanredna UV i otpornost na ozon
        - Životni vijek od 15-20 godina uz pravilnu njegu
        - Izvrsna fleksibilnost na hladnom vremenu
        - Nadmoćna otpornost na kemikalije i ulja
        - Zadržava boju duže od PVC
      cons:
        - Znatno skuplje od PVC
        - Teža težina tkanine
        - Manje opcija boja
        - Popravci zahtijevaju specijalizirane ljepila
        - Manje proizvodnih pogona širom svijeta
      best_for: Komercijalna RIBs, potraga i spašavanje, vojne primjene, tropske klime, dugoročno vlasništvo flote.
    - name: Drop-stitch jezgra
      summary: Tehnologija koja je revolucionirala napuhavanje SUPs. Tisuće poliesterskih niti povezuju gornje i donje slojeve tkanine, omogućujući napuhavanje visokim pritiskom za čvrstu, tvrdu izvedbu.
      pros:
        - Izuzetno kruto pri 12-20 PSI
        - Lagano — 18-30 lbs za ploču pune veličine
        - Može se preklopiti radi skladištenja i putovanja
        - Izvrsna otpornost na udarce
        - Dosljedne performanse u različitim temperaturnim rasponima
      cons:
        - Zahtijeva pumpu visokog tlaka
        - Popravak probijanja složeniji od jednoslojnog
        - Viša proizvodna cijena od standardnih napuhanih
        - Gubitak tlaka tijekom vremena zahtijeva povremeno dopunjavanje
      best_for: Ploče za veslanje stojeći, kajaci, zračne palube za napuhavanje čamaca, svaka primjena koja zahtijeva čvrstu izvedbu uz prenosivost napuhanog.
    - name: EVA Pjena za palubu
      summary: Pjena zatvorenih ćelija EVA (etilen-vinil acetat) koristi se za podloge za hvatanje na SUP pločama i palubama čamaca. Pruža amortizaciju, prianjanje i toplinsku izolaciju.
      pros:
        - Izvrsno prianjanje protiv klizanja mokro ili suho
        - Amortizacija smanjuje umor pri dugim veslanjima
        - Toplinska izolacija od hladne površine palube
        - UV i otporno na slanu vodu
        - Dostupno u više boja slojevito i laserski gravirano
      cons:
        - Može izdržati tešku upotrebu 2-3 godine
        - Mora biti pravilno povezano kako bi se spriječilo odvajanje slojeva
        - Nije strukturno — ne utječe na krutost
        - Dodaje malu težinu (200-400 g po dasci)
      best_for: SUP prijanjanje trupa, podloga palube broda, udobnost sjedala kajaka, bilo koja površina koja zahtijeva neklizajuće stajanje.
  selection:
    title: Vodič za odabir materijala
    subtitle: 'Odaberite pravi materijal na temelju glavne namjene:'
    headers:
      - Slučaj upotrebe
      - Preporučeni materijal
      - Zašto
    rows:
      - - Rekreativno SUP veslanje
        - Drop-stitch PVC
        - Lagano, kruto, povoljno — idealna ravnoteža za rekreativne veslače
      - - Porodični čamac / jezerski čamac
        - PVC (1100 denier)
        - Isplativo, jednostavno za popravak, dovoljno izdržljivo za rekreativnu upotrebu
      - - Komercijalni RIB / patrolni čamac
        - Hypalon CSM
        - Maksimalna UV otpornost, vijek trajanja 15-20 godina, otpornost na kemikalije/ulja
      - - Najamni SUP daske
        - Drop-stitch PVC + EVA paluba
        - Izdržljivo, moguće popraviti, dobra vrijednost za čestu upotrebu
      - - Operacije spašavanja
        - Hypalon CSM
        - Pouzdanost u ekstremnim uvjetima, fleksibilnost na hladnoći, otpornost na kemikalije
      - - Turistički / ekspedicijski kajak
        - Drop-stitch PVC
        - Kruta izvedba s mogućnošću pakiranja za putovanja
  deep_dive:
    title: Vodiči za detaljno proučavanje
    topics:
      - title: Pomorski razred PVC
        desc: Višeslojna laminirana PVC tkanina — objašnjenje otpornosti UV, testa abrazije i denier vrijednosti.
      - title: PVC protiv Hypalon
        desc: Definitivna usporedba dva dominantna materijala za napuhavajuće čamce — cijena, vijek trajanja, otpornost UV.
      - title: Drop-stitch jezgra
        desc: Kako tisuće unutarnjih niti stvaraju krute, visokotlačne napuhujuće strukture pri 12-15 PSI.
      - title: RF tehnologija zavarivanja
        desc: Visokofrekventno zavarivanje stvara jake, dosljedne šavove — kako funkcionira i zašto je važno.
      - title: PSI i performanse
        desc: Zašto je zračni tlak važan za napuhavajuće SUPs i čamce — krutost, nosivost i kvaliteta vožnje.
      - title: Testiranje kvalitete
        desc: Testiranje tlaka, ispitivanje plovnosti, UV starenje i destruktivno testiranje — naš proces kontrole kvalitete.
      - title: EVA Pjeneće palube
        desc: Pjenaste podloge zatvorenih stanica EVA — prianjanje, udobnost i izdržljivost za SUP i palube čamaca.
      - title: Briga o materijalu
        desc: Čišćenje, UV zaštita, sprječavanje plijesni i najbolje prakse skladištenja za napuhavajuće proizvode.
