hero:
  tagline: Znanje o istraživanju vode
  title: Naučiti
  subtitle: |
    Vodiči, tutorijali i detaljna istraživanja — sve što vam treba za istraživanje<br />
    voda s povjerenjem. Od odabira vašeg prvog SUP do svladavanja naprednih tehnika.
  taglineSection: Znanje za svakog veslača. Od početnika do profesionalca.
featured:
  tagline: Istaknute teme
  title: Započnite svoje putovanje učenja
  subtitle: Bilo da ste novi u vodenim sportovima ili želite napredovati, naši vodiči su tu za vas.
  items:
    - title: SUP Osnove
      description: Sve što početnik treba znati — vrste dasaka, veličina reketa, stav i savjeti za prvi dan.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Napuhavanje protiv tvrde daske
      description: Koji je pravi za vas? Uspoređujemo prenosivost, performanse, izdržljivost i cijenu jedan pored drugoga.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Sigurnost na vodi
      description: Osnovno znanje o sigurnosti koje svaki veslač treba imati — vremenski uvjeti, prsluci za spašavanje, samopomoć u spašavanju i još mnogo toga.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Vodič za materijale
      description: PVC protiv Hypalon, drop-stitch tehnologija, ocjene poricatelja — razumite od čega je vaša oprema napravljena.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Vodič za veličinu
      description: Pronađite pravu duljinu, širinu i volumen daske za vašu težinu, vještinu i stil veslanja.
      icon: tabler:ruler
      href: /size-guide
    - title: Srednje tehnike
      description: Podignite svoj veslački nivo naprednim zamahima, tehnikama okretanja i upravljanjem u nemirnim vodama.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
