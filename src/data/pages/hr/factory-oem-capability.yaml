services:
  - title: Dizajn proizvoda i inženjering
    description: Naš internog R&D tim radi s vašim konceptom ili specifikacijama kako bi razvili CAD crteže, 3D modele i prototipove. Nudimo dizajn kalupa, optimizaciju oblika trupa i savjete o odabiru materijala.
  - title: Prilagođeni branding i grafika
    description: Tiskanje u punoj boji, sitotisak, utiskivanje i opcije etiketa. Razvijamo grafike palube specifične za brend, označavanje tubusa i pakiranje spremno za maloprodaju.
  - title: Prilagodba materijala i specifikacija
    description: Izaberite između PVC (standardni, ekološki prihvatljiv, otpornost na vatru), Hypalon/CSM, drop-stitch i hibridnih konstrukcija. Prilagođene boje tubusa, težine tkanina i opcije ojačanja.
  - title: Pakiranje i logistika
    description: Prilagođeno maloprodajno pakiranje, kutije s privatnom oznakom, vakuumsko pakiranje, paletiranje i utovar u kontejnere. Dostupni uvjeti otpreme FOB Qingdao, CIF ili DDP.
