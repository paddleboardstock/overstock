hero:
  tagline: OEM/ODM Proizvodnja
  title: OEM i Proizvodnja s privatnom oznakom
  subtitle: Od koncepta do kontejnera — prilagodite svaki detalj svoje linije napuhavajućih plovila
intro: Aquafarer nudi sveobuhvatne OEM i ODM usluge za brendove, distributere i državne agencije širom svijeta. S 10+ godina iskustva u izvozu i tvornicom od 12.000 m² ISO s certifikatima 9001 i BSCI, brinemo se za sve, od dizajna proizvoda i razvoja kalupa do proizvodnje u punom opsegu, pakiranja i logistike.
