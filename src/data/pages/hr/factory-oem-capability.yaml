why_us:
  - title: Vertikalna integracija
    description: Posjedujemo vlastitu tvornicu, kalupe i opskrbni lanac — bez posrednika, bez podizvođača. To nam daje kontrolu nad kvalitetom, troškovima i isporukom.
  - title: Dvostruka certifikacija
    description: ISO certifikat upravljanja kvalitetom 9001 i BSCI certifikat društvene usklađenosti. Izvještaji o auditu tvornice dostupni na zahtjev.
  - title: CE Usklađenost
    description: Svi standardni modeli posjeduju CE certifikat 2013/53/EU. Prilagođeni modeli mogu se CE certificirati kroz naš uspostavljeni proces.
  - title: Niski MOQ
    description: Počnite s najmanje 5 jedinica za standardne modele. Pomažemo rastućim markama da lansiraju proizvode bez prekomjerne zalihe.
