features3_reasons:
  tagline: Zašto odabrati Paddle Board Overstock
  title: Sedam razloga za suradnju s nama
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Prava proizvodnja, ne trgovina
      description: Posjedujemo i upravljamo tvornicom od 12.000 m². Kada surađujete s Paddle Board Overstock, radite izravno s ljudima koji dizajniraju, inženjerski izrađuju i proizvode vaše proizvode — bez posrednika.
      icon: tabler:building-factory
    - title: 2. Pristup vođen inženjeringom
      description: Naš proces dizajna počinje s uporabnim slučajem, a ne s kategorijom proizvoda. Optimiziramo oblik trupa, odabir materijala i konfiguraciju prema načinu na koji će se brod zapravo koristiti.
      icon: tabler:engine
    - title: 3. Certificirana kvaliteta
      description: CE certificiran, ISO sustav kvalitete, BSCI u skladu, REACH u skladu, USCG odobren. Naših 64 CE-certificirana modela udovoljavaju međunarodnim standardima — ne samo tvrdnjama.
      icon: tabler:certificate
    - title: 4. Fleksibilan OEM/ODM
      description: Boje cijevi, raspored konzole, brendiranje, pakiranje — prilagođavamo prema vašim specifikacijama. Nema pritiska na minimalnu narudžbu. Počnite s prototipom, povećavajte s povjerenjem.
      icon: tabler:adjustments
    - title: 5. Globalna logistika
      description: Skladište u SAD-u u Kaliforniji, izravna dostava iz Qingdaoa, zračni prijevoz za hitne narudžbe. Mi se brinemo za carinsku papirologiju i dokumentaciju.
      icon: tabler:truck-delivery
    - title: 6. Doživotna podrška
      description: Podržavamo brodove koje smo izgradili prije 20 godina. Originalni rezervni dijelovi, tehnički savjeti, upute za popravak — naš tim je dostupan kad vam zatrebamo.
      icon: tabler:lifebuoy
    - title: 7. Iskrene specifikacije
      description: Stvarna nosivost, stvarne dimenzije, stvarna težina. Nema marketinškog napuhavanja. Ono što objavimo, to i dobivate — potvrđeno neovisnim testiranjem.
      icon: tabler:ruler-measure
testimonials:
  tagline: Pouzdano od strane brendova širom svijeta
  title: Što naši partneri kažu
  items:
    - content: Radili smo s nekoliko proizvođača u Kini, ali Paddle Board Overstock se ističe njihovom inženjerskom podrškom i dosljednom kvalitetom. Svoje ponašaju prema našem brendu kao da je njihov vlastiti.
      name: — OEM Partner, europski brend vodenih sportova
    - content: Njihovi Hypalon RIBs koriste se u našoj floti više od 5 godina. Minimalno održavanje, izvrsna otpornost UV. Petogodišnje jamstvo na cijevi daje nam povjerenje.
      name: — Operater flote, ljetovališni kompleks na Bliskom istoku
    - content: Paddle Board Overstock tim pomogao nam je razviti prilagođeni SUP dizajn daske od koncepta do proizvodnje u 90 dana. Kvaliteta je nadmašila naša očekivanja.
      name: — Distributer, australski vodeni sportovi
