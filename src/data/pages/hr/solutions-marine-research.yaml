content_challenge:
  tagline: Izazov
  title: Zahtjevi za morska istraživanja<br />Stabilne, instrumentalno spremne platforme
  subtitle: Znanstveni radni brodovi moraju pružiti stabilnu platformu za osjetljivu instrumentaciju, tihi rad radi izbjegavanja uznemiravanja divljih životinja te fleksibilne rasporede za raznoliku istraživačku opremu.
  paragraphs:
    - Morska istraživanja i praćenje okoliša zahtijevaju radne brodove koji služe kao mobilni laboratoriji. Za razliku od komercijalnih ili rekreacijskih plovila, istraživanja RIBs moraju sadržavati osjetljive elektroničke instrumente, opremu za uzorkovanje vode i sedimenta, a ponekad i transport živih uzoraka — sve to uz održavanje stabilne platforme za točno prikupljanje podataka.
    - '**Stabilnost platforme je ključna** — Sonar, echo sonderi i CTD (provodljivost, temperatura, dubina) profileri zahtijevaju stabilan trup u mirovanju i pri malim brzinama. Prekomjerno pomicanje valova ili trupa unosi šum u znanstvene podatke. Duboko-V trup s dobrim karakteristikama stabilnosti je ključan.'
    - '**Integracija instrumenata** — Istraživački brodovi trebaju montažne točke za GPS antene, sonar pretvarače, ruke za uzorkovanje i opremu za snimanje podataka. Konzolni prostor mora sadržavati više zaslona, raspodjelu energije za instrumente i sigurno pohranjivanje osjetljive elektronike.'
    - '**Tihi rad** — Za istraživanja morske biologije i praćenje okoliša, buka motora i vibracije trupa mogu uplašiti morski život i ugroziti promatranje ponašanja. Tihe vanjske konfiguracije i dizajni trupova s smanjenim vibracijama važni su za istraživačke primjene.'
    - Aquafarer Istraživanja RIBs su dizajnirana sa stabilnim platformama trupa, integriranim sustavima za montažu opreme i tihim vanjskim konfiguracijama za znanstvene i ekološke nadzorne primjene.
content_solution:
  tagline: Naše rješenje
  title: Istraživanja izgrađena RIBsza tu svrhu<br />Za rad u znanosti i zaštiti okoliša
  subtitle: Aquafarer Svako istraživanje RIB konfigurirano je kao stabilna, prilagodljiva platforma za znanstvenu instrumentaciju i opremu za terensko uzorkovanje.
  list:
    - Deep-V fiberglas trup s izvrsnom stabilnošću u mirovanju i pri malim brzinama pregleda
    - Raspored ravne platforme s montažnim pločama za sonar, GPS i opremu za uzorkovanje
    - Konzola konfigurirana za više zaslona — ploter, sonder, data logger
    - 12V i 24V pomoćna distribucija napajanja za znanstvene instrumente
    - Tihi četverotaktni vanbrodski motor — minimalne vibracije i buka za istraživanja divljih životinja
    - Opcionalni dizajn trupa s niskim valom za minimalne smetnje tijekom prikupljanja podataka
    - Prilagođene boje cijevi za brendiranje istraživačkih institucija i identifikaciju voznog parka
content_segments:
  tagline: Istraživački profili
  title: Rješenja za morske znanosti<br />Prema vrsti primjene
  subtitle: Različite istraživačke primjene imaju jedinstvene zahtjeve za plovilima — od sveučilišnih platformi za nastavu do plovila za istraživanje okoliša i praćenja kvalitete vodeRIBs.
  items:
    - title: Sveučilišni programi morskih znanosti
      subtitle: Nastavne platforme, studentska terenska putovanja, istraživanje obale
      description: Sveučilišta za morske znanosti i odjeli za oceanografiju trebaju pouzdane, svestrane radne brodove za podučavanje terenskih kolegija, studentskih istraživačkih projekata i obalnih istraživanja pod vodstvom profesora. Brod mora biti jednostavan za upravljanje studentima pod nadzorom, dovoljno stabilan za praktičnu uporabu instrumenata i dovoljno izdržljiv za čestu upotrebu od strane više korisnika tijekom akademskih studija. Proračunska ograničenja u akademskom okruženju čine isplativost i nisku razinu održavanja važnima za razmatranje.
      features:
        - Stabilna platforma za vježbanje raspoređivanja i oporavka studenata
        - Jednostavan rad — konfiguracija s kormilom ili jednom konzolom za nadziranu upotrebu učenika
        - Hypalon Izdržljive cijevi za česta iskrcavanja na plaži i rukovanje studentima
        - Montaža opreme za sonar nastavne razine, secchi disk i opremu za uzorkovanje
        - PVC Isplativa opcija za akademske programe s ograničenim budžetom
    - title: Instituti za morska istraživanja
      subtitle: Pregled RIBs s integracijom instrumenata, GPS-om, opremom za uzorkovanje
      description: Posvećene organizacije za morska istraživanja koje provode obalna i offshore istraživanja trebaju profesionalno RIBs konfigurirane preglede s integriranom instrumentacijom. Ova plovila imaju sonar sustave za batimetrijsko kartiranje, CTD profilere za analizu vodenog stupca, uzorkomore sedimenta i opremu za biološko prikupljanje. Brod mora pružiti stabilnu platformu pri malim brzinama istraživanja, imati dovoljno prostora na palubi za postavljanje opreme i nuditi čistu 12V/24V energiju za elektroniku.
      features:
        - Integrirano montiranje sonar pretvarača — konfiguracija kroz trup ili transom
        - Montaža GPS antene i integracija konzole za navigaciju prema geodetskom standardu
        - Područje za postavljanje CTD-a i uzorkovanja vode s sigurnim točkama pričvršćivanja
        - 12V/24V pomoćna distribucija napajanja za instrumente i podatkovne logere
        - Stabilan pri maloj brzini (3-6 čvorova) radi točnosti geodetskih linija
        - Opcionalni A-okvir ili dizalica za postavljanje teže opreme za uzorkovanje
    - title: Praćenje okoliša i očuvanje okoliša
      subtitle: Ekološka istraživanja, promatranje divljih životinja, procjena staništa
      description: Ekološke nevladine organizacije, državne agencije i organizacije za očuvanje prirode provode morska ekološka istraživanja, praćenje populacije divljih životinja i procjene staništa. Ove operacije zahtijevaju tihe, niskoutjecajne brodove koji mogu pristupiti osjetljivim staništima bez uznemiravanja divljih životinja. Brodovi moraju nositi kameru, GPS za transektno mapiranje i opremu za uzorkovanje vode i sedimenta. Niska buka valova i minimalna buka motora ključni su za proučavanje ponašanja.
      features:
        - Tihi četverotaktni vanbrodski motor — minimalno ometanje morskog životinjskog svijeta
        - Stabilna platforma za promatranje fotografije i video dokumentacije
        - Montiranje opreme za kamere, GPS uređaje za praćenje i terenska računala
        - Plitki gaz za pristup obalnim močvarama, mangrovama i ušćima
        - Površine palube i cijevi koje se lako čiste radi dekontaminacije između lokacija
    - title: Praćenje i testiranje kvalitete vode
      subtitle: Redovni uzorkovanja, praćenje zagađenja, nadzor usklađenosti
      description: Organizacije za praćenje kvalitete vode redovito provode uzorkovanja duž obalnih zona, luka i unutarnjih vodenih putova kako bi pratili razine zagađenja, cvjetanje algi i usklađenost s okolišnim propisima. Ove operacije zahtijevaju učinkovite, pouzdane brodove za ponovljene posjete fiksnim stanicama za uzorkovanje. Plovilo mora nositi opremu za uzorkovanje, hladnjake za očuvanje uzoraka i terensku laboratorijsku opremu — s lako perivim palubama između lokacija kako bi se spriječila unakrsna kontaminacija.
      features:
        - Namjenski prostor za stanicu za uzorkovanje s hladnjakom i spremištem opreme
        - Lako perive površine palube i cijevi za dekontaminaciju između lokacija
        - Integracija GPS-a za precizan povratak na fiksne koordinate uzorkovanja
        - Kompaktna veličina za pristup ograničenim vodenim putovima i uskim kanalima
        - Ekonomični izvanbrodski motor za isplativa redovna uzorkovanja
