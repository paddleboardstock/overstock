content_capability:
  tagline: Inženjerska sposobnost
  title: Što Naše Inženjerstvo<br />Tim isporučuje
  subtitle: Inženjering Aquafarer pokriva cijeli životni ciklus proizvoda — od istraživanja tržišta i dizajna koncepta do izrade prototipa, testiranja i masovne proizvodnje.
  items:
    - title: Industrijski dizajn
      description: Naš tim za industrijski dizajn radi na temelju zahtjeva kupaca, istraživanja tržišta i analize konkurencije kako bi razvio koncepte proizvoda koji uravnotežuju estetiku, funkcionalnost i mogućnost proizvodnje. Izrađujemo 2D skice, 3D prikaze i dokumente specifikacija za pregled klijenta prije nego što se posvetimo izradi alata.
      features:
        - Razvoj koncepta i studije izvedivosti
        - 2D dizajnerski crteži i 3D prikazi
        - Odabir i specifikacija materijala
        - Analiza dizajna za proizvodnju (DFM)
        - Ergonomska i sigurnosna procjena
    - title: Građevinsko inženjerstvo
      description: Naši konstrukcijski inženjeri specijalizirani su za arhitekturu gumenjaka — dizajn trupa, konfiguraciju zračnih komora tubusa, inženjering jezgre drop-stitch i raspodjelu opterećenja. Svaki je dizajn analiziran zbog strukturne čvrstoće, optimizacije težine i usklađenosti s relevantnim standardima (CE, ISO, AS).
      features:
        - Dizajn trupa od stakloplastike s Deep-V oblikom s izračunatim kutovima uspona trupa
        - Višekomorna konfiguracija cijevi za sigurnost i plovnost
        - specifikacija jezgre i optimizacija gustoće
        - Analiza konačnih elemenata za nosive komponente
        - Izračuni raspodjele težine i stabilnosti
    - title: 3D modeliranje i CAD
      description: Svi dizajni proizvoda razvijaju se u 3D CAD-u prije nego što započne izrada prototipnog alata. Naši inženjeri koriste SolidWorks i Rhino 3D za modeliranje proizvoda, omogućujući klijentima pregled svakog detalja — od profila cijevi do rasporeda konzole — prije nego što se odluče za proizvodnju.
      features:
        - Potpuno 3D CAD modeliranje u SolidWorks i Rhino 3D
        - Fotorealistično renderiranje za prezentacije klijentima
        - Tehnički paketi crteža za proizvodnju
        - Dizajn kalupa i alata iz 3D modela
        - Izravni prijenos podataka iz CAD-a za precizno rezanje
    - title: Prototipiranje i testiranje
      description: Prije masovne proizvodnje, svaki novi proizvod prolazi kroz fazu prototipa. Gradimo funkcionalne prototipe za evaluaciju klijenata, a potom ih podvrgavamo našem punom protokolom testiranja — testiranje tlaka, testiranje stabilnosti, testiranje opterećenja i vodena ispitivanja. Iteracije dizajna u fazi prototipa su brze i isplative.
      features:
        - Brzo izrađivanje prototipnog alata (vremenski rok 15-20 dana)
        - Funkcionalni prototip za evaluaciju u stvarnom svijetu
        - Potpuni protokol testiranja prije odobrenja proizvodnje
        - Iterativno usavršavanje dizajna na temelju rezultata testiranja
        - Milestone odobrenja klijenta prije izrade alata za proizvodnju
    - title: Integracija prilagođenih dodataka
      description: Mnogi projekti zahtijevaju integraciju dodataka koje dostavi klijent ili treća strana — prilagođene konzole, specijalizirana sjedala, elektronički sustavi, nosači opreme za ronjenje ili elementi brendiranja. Naš inženjerski tim upravlja dizajnom integracije, strukturnom prilagodbom i provjerom kvalitete svih dodataka.
      features:
        - Dizajn konzola i raspored instrument ploče
        - Integracija prilagođenih sjedala i tapeciranja
        - Dizajn elektroničkog sustava i ožičenje
        - Sustavi montaže opreme za ronjenje i spašavanje
        - Specifikacije za brendiranje i grafiku
content_process:
  tagline: Proces razvoja
  title: Od koncepta<br />do proizvodnje
  subtitle: Naš proces razvoja proizvoda slijedi strukturiran radni tijek u 6 faza koje su dizajnirane za minimiziranje rizika, skraćivanje rokova i osiguranje spremnosti za proizvodnju od prvog dana.
  stages:
    - stage: '01'
      title: Zahtjevi i istraživanje
      duration: 1-2 tjedna
      description: Radimo s klijentom na definiranju specifikacija proizvoda, zahtjeva ciljanog tržišta, potreba za usklađenošću sa zakonodavstvom i komercijalnih ciljeva. Ova faza rezultira Dokumentom o zahtjevima proizvoda (PRD) koji vodi sve daljnje radove.
      deliverables: PRD, analiza tržišta, usporedna analiza konkurencije, preliminarna procjena troškova
    - stage: '02'
      title: Koncept dizajn
      duration: 2-3 tjedna
      description: Tim industrijskog dizajna razvija koncepte proizvoda na temelju PRD-a. Predstavljaju se višestruke dizajnerske opcije s 3D prikazima, preporukama materijala i početnim inženjerskim procjenama. Klijent odabire smjer za detaljan razvoj.
      deliverables: 3D konceptualni prikazi, specifikacije materijala, obrazloženje dizajna, preliminarni popis materijala (BOM)
    - stage: '03'
      title: Detaljno inženjerstvo
      duration: 2-4 tjedna
      description: Odabrani koncept je potpuno inženjerski razvijen — 3D CAD modeliranje, strukturna analiza, konfiguracija cijevi, dizajn trupa, integracija dodataka i proizvodna dokumentacija. Sve dimenzije, materijali i procesi su specificirani za alatne alate.
      deliverables: Puni 3D CAD model, inženjerski crteži, konačna BOM lista, specifikacije alata, QC plan
    - stage: '04'
      title: Prototipiranje
      duration: 2-3 tjedna
      description: Prototipni alati se proizvode i izrađuju funkcionalni uzorci. Klijent pregledava prototip u odnosu na PRD specifikacije. Testiranje se provodi prema dogovorenom protokolu. Izmjene dizajna se vrše na temelju povratnih informacija prije proizvodnje alata.
      deliverables: Funkcionalni prototip, izvještaj o testiranju, zapisnik o reviziji dizajna, dokument za odobrenje klijenta
    - stage: '05'
      title: Proizvodni alati
      duration: 2-3 tjedna
      description: Kada je prototip odobren, proizvodni alati se naručuju — kalupi, jigovi za zavarivanje, programi za rezanje, pribori za sastavljanje. QC dokumentacija i kriteriji inspekcije se finaliziraju. Provodi se probni rad za validaciju procesa.
      deliverables: Proizvodni alati, dokumentacija procesa, plan kontrole kvalitete, izvještaj o probnom pokretanju
    - stage: '06'
      title: Masovna proizvodnja i kontrola kvalitete
      duration: U tijeku
      description: Cjelokupna proizvodnja započinje kontrolom kvalitete u procesu na svakom stupnju. Prvi primjerci se pregledavaju i odobravaju prije puštanja serije. Kontinuirano praćenje kvalitete, praćenje nedostataka i stalno poboljšanje tijekom cijelog životnog ciklusa proizvodnje.
      deliverables: Raspored proizvodnje, QC izvješća, zapisi o sljedivosti serija, dokumentacija za otpremu
content_customization:
  tagline: Mogućnosti prilagodbe
  title: Što može biti<br />Prilagođeno
  subtitle: Gotovo svaki aspekt naših proizvoda može se prilagoditi zahtjevima klijenata. Ispod su najčešće kategorije prilagodbe.
  columns: 3
  items:
    - title: Trup i struktura
      description: Prilagođena duljina trupa, širina grebena, kut nagiba trupa, promjer cijevi, konfiguracija komora i kvaliteta materijala.
      icon: tabler:sailboat
    - title: Boje i grafika
      description: Boja cijevi (PVC/Hypalon), boja gelcoata trupa, boja konzole, grafika na palubi, položaj logotipa i dizajn pakiranja.
      icon: tabler:palette
    - title: Konzola i upravljanje
      description: Središnja konzola, bočna konzola ili kormilarska palica. Prilagođeni raspored instrumenata, postavljanje prekidača i položaj kormila.
      icon: tabler:steering-wheel
    - title: Sjedenje i presvlake
      description: Jahače sjedalice, klupska sjedala, luksuzna presvlaka, šavovi u boji, sklopive ili uklonjive konfiguracije.
      icon: tabler:armchair
    - title: Dodaci i oprema
      description: Ljesteve za ronjenje, stalci za spremnike, vučne pylone, T-krovove, Bimini krovove, zvučne sustave, navigacijsku elektroniku i sigurnosnu opremu.
      icon: tabler:backpack
    - title: Pakiranje i brendiranje
      description: Prilagođeno maloprodajno pakiranje, kutije privatne robne marke, transportne kutije s oznakama brenda, oznake za vješanje i korisnički priručnici na jeziku klijenta.
      icon: tabler:box
content_industries:
  tagline: Primjene u industriji
  title: Inženjerska rješenja<br />po industriji
  subtitle: Naš inženjerski tim razvio je proizvode za širok raspon primjena u pomorstvu — svaki s različitim zahtjevima i kriterijima izvedbe.
  columns: 3
  items:
    - title: Ronioci operacije
      description: Ojačani palubi, integracija ljestava za ronjenje, sustavi za pohranu boca i stabilne platforme za komercijalne ronilačke centre širom svijeta.
      icon: tabler:lifebuoy
    - title: Spašavanje i hitne intervencije
      description: Projektiranje trupova visokih brzina, palube s automatskim pražnjenjem, sustavi za montiranje opreme i višekombinarne sigurnosne konfiguracije za SAR operacije.
      icon: tabler:alert-triangle
    - title: Pomorski turizam
      description: Rasporedi za udobnost putnika, integracija sjenila, sustavi za ukrcaj i konfiguracije štedljive na gorivu za operacije transfera između otoka.
      icon: tabler:beach
    - title: Jahta tenderi
      description: Kompaktni dizajni za spremanje na dizalicu, luksuzne opcije završne obrade, boje koje se podudaraju s matičnom jahtom i karakteristike visokih performansi za vuču.
      icon: tabler:sailboat
    - title: Ribarstvo i akvakultura
      description: Konfiguracije ravnih paluba, integracija živih rezervoara, rasporedi držača štapova, antikorozivna oprema za kontinuirano izlaganje slanoj vodi.
      icon: tabler:fish
    - title: Luka i industrija
      description: Ojačani trupovi za teške uvjete, rasporedi radnih brodova, konfiguracije za transport osoblja i integracija opreme za offshore operacije.
      icon: tabler:ship
