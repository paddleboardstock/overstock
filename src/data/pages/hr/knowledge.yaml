hero:
  tagline: Grafikon znanja
  title: Znanje o istraživanju vode
  subtitle: |
    Strukturirana baza znanja koja pokriva tehnologiju napuhavanja SUP,<br />
    sigurnost na vodi, inženjering čamaca i planiranje avantura.
  taglineSection: Istražujte. Učite. Idite s povjerenjem.
clusters:
  tagline: Klastri znanja
  title: Istražite po temi
  subtitle: Duboko istraživanje tehnologije, sigurnosti i vještina iza svakog Aquafarer proizvoda.
  items:
    - title: SUP Znanje
      description: Od odabira vaše prve daske do naprednih tehnika turneja — sve o stand-up paddleboardingu.
      icon: tabler:lifebuoy
      topics:
        - Kako odabrati svoj prvi napuhavajući SUP
        - Najbolja SUP veličina za početnike
        - Koliko je teško veslati na dasci?
        - Usporedba napuhljive i tvrde daske
        - SUP sigurnosni popis
    - title: Znanje o čamcima
      description: Tehnički vodiči o napuhavnim čamcima, RIBs, čamcima i kajacima — inženjering, materijali i uporaba.
      icon: tabler:sailboat
      topics:
        - Objašnjene vrste napuhavajućih čamaca
        - PVC vs Hypalon usporedba
        - RIB vs Dinghy usporedba
        - dubinska analiza Drop-stitch tehnologije
        - Vodič za znanost o morskim materijalima
    - title: Sigurnosno znanje
      description: Osnovno znanje o sigurnosti za svakog veslača — od odabira PFD, preko čitanja vremenskih uvjeta do tehnika samopomoći.
      icon: tabler:shield
      topics:
        - SUP sigurnosni popis
        - Trebaš li prsluk za spašavanje?
        - Vodič za sigurnost veslanja na oceanu
        - Sigurnost na rijeci za napuhljive kajake
        - Svijest o vremenskim i vodnim uvjetima
    - title: Tehnologija
      description: Inženjering iza Aquafarer proizvoda — materijali, metode izgradnje i testiranje kvalitete.
      icon: tabler:microscope
      topics:
        - Tehnologija pomorske razine PVC
        - Drop-stitch Core objašnjen
        - Zašto PSI je važno za napuhavanje SUPs
        - RF zavarivanje naspram ljepljivog vezivanja
        - Testiranje kvalitete i certificiranje
    - title: Poslovno znanje
      description: Komercijalni vodiči za izgradnju i širenje vašeg poslovanja s vodenim sportovima — od najma do brendiranja privatne marke.
      icon: tabler:briefcase
      topics:
        - Kako pokrenuti SUP posao najma
        - Izgradnja odmarališta-centra za vodene sportove
        - Veličina flote paddle boardova za palice
        - Napuhavanje naspram tvrdog SUP za komercijalnu upotrebu
        - Najbolji materijal za kajak za najam flota
        - Pokretanje privatne marke vode
        - Strategije prihoda od vodenih sportova u odmaralištima
        - Vodič za održavanje komercijalne opreme
