breadcrumb: OEM/ODM Proizvođač
tldr:
  summary: Paddle Board Overstock je izravno iz tvornice OEM/ODM proizvođač. 12.000 m² ISO 9001:2015 pogon, 15.000 jedinica godišnje proizvodnje, CE/BSCI/REACH/UKCA usklađenost, niska MOQs od 2 do 10 jedinica.
  points:
    - 12.000 m² ISO 9001:2015 certificirani objekt Qingdao
    - 15.000 jedinica godišnjeg kapaciteta s 200-300 kvalificiranih radnika
    - CE 2013/53/EU, UKCA, BSCIREACH , usklađenost
    - 'NiskoMOQs: 2-5 jedinica (RIB), 5-10 jedinica (SUP) za standardne modele'
    - 50+ izvoznih zemalja s FOB Qingdao brodovima
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 Certificirano
      desc: SGS- revidirani sustav upravljanja kvalitetom na svim proizvodnim linijama.
      variant: cert
    - icon: ⭐
      title: CE & UKCA Usklađenost
      desc: Potpuna usklađenost s EU 2013/53/EU i zahtjevima za označavanje u Ujedinjenom Kraljevstvu.
      variant: cert
    - icon: ⭐
      title: BSCI Društvena revizija
      desc: Potvrđene etičke radne prakse i standardi na radnom mjestu.
      variant: standard
    - icon: ⭐
      title: Nisko MOQ s 2 jedinice
      desc: 'Standardni RIB modeli od 2-5 jedinica, SUP od 5-10 jedinica. Prilagođeni kalup: 200+.'
      variant: standard
process_section:
  eyebrow: Naš proces
  title: End-to-End OEM/ODM Radni tok
  subtitle: Od dizajnerskog zadatka do utovara kontejnera — šest koraka do vašeg privatnog napuhanog plovila.
  steps:
    - step: '01'
      title: Specifikacija i sažetak dizajna
      desc: Podijelite svoje ciljne specifikacije, CAD crteže ili referentni proizvod. Naš inženjerski tim pregledava materijale, dimenzije i zahtjeve usklađenosti (CE, BSCI) prije nego što daju ponudu.
    - step: '02'
      title: 3D prototipiranje kalupa
      desc: Dizajniramo i obrađujemo CNCprilagođene kalupe za SUP daske, trupove kajaka i RIB komponente. Prototipni uzorci proizvedeni unutar 15–20 radnih dana za vaše odobrenje.
    - step: '03'
      title: Odabir materijala i proizvodnja uzoraka
      desc: Birajte između PVC vojnih (0,9 mm–1,2 mm) Hypalon CSMdrop-stitch ili osnovnih tkanina. Proizvodimo predprodukcijske uzorke s bojama, logotipom i pakiranjem vašeg brenda za odobrenje.
    - step: '04'
      title: CE Revizija tvornica i usklađenost
      desc: OEM Svaka narudžba uključuje dokumentaciju o usklađenosti — CE izjavu o usklađenosti, ISO zapise o sljedivosti 9001, BSCI izvješće o društvenoj usklađenosti i REACH materijalne deklaracije.
    - step: '05'
      title: Masovna proizvodnja i inline QC
      desc: Proizvodne serije slijede našu kontrolnu listu od 100 točaka kvalitete. Svaka jedinica prolazi 24-satno testiranje zadržavanja tlaka, testiranje odvajanja šavova i vizualni pregled prije pakiranja.
    - step: '06'
      title: FOB Qingdao logistika i brodarstvo
      desc: Gotovi proizvodi se paletiziraju, omotavaju i utovaruju u kontejnere u luci Qingdao. Mi brinemo o svojoj izvoznoj dokumentaciji, carinskoj kontroli i pružamo praćenje pošiljki u stvarnom vremenu.
capabilities_section:
  eyebrow: Proizvodne mogućnosti
  title: Što gradimo
  subtitle: Šest ključnih proizvodnih kapaciteta za B2B globalne partnere.
  items:
    - title: Drop-Stitch SUP Proizvodnja ploča
      desc: drop-stitch Laminacija jezgre pune duljine za krute, visokotlačne (15–20PSI) stand-up paddle boardove. Prilagođena duljina, širina, debljina, profil rockera i grafički dizajn.
    - title: PVC Proizvodnja napuhanih čamaca
      desc: PVC Visokofrekventni zavareni čamci, tenderi i sportski brodovi. Višekomorne konfiguracije, opcije poda (letvice, zračna paluba, roll-up) i integracija dodatne opreme.
    - title: Hypalon RIB Izrada brodova
      desc: Hypalon CSM Komercijalne cijevi vezane za trupove dubokog V od stakloplastike ili aluminija. Duljine od 3,3 m do 6,0 m za ophodnje, spašavanje, ture i ronilačke operacije.
    - title: Privatna marka i prilagođeno brendiranje
      desc: 'Potpuna usluga privatne robne marke: prilagođeni prijenos logotipa toplinom ili sitotisak, brendirana ambalaža (kutije za maloprodaju, vrećice za nošenje), korisnički priručnici na vašem jeziku te barkod/UPCregistracija.'
    - title: Dizajn kalupa po mjeri i alata
      desc: Interni 3D CAD/CAM inženjerski tim. Dizajniramo i izrađujemo prilagođene aluminijske i kompozitne kalupe za jedinstvene oblike trupa, konfiguracije palube i točke montaže dodataka.
    - title: OEM Dodaci i oprema
      desc: Prsluci za spašavanje (CE12402), pumpe s dvostrukim djelovanjem, karbonske/najlonske vesla, kompleti za popravak, torbe za nošenje i sklopovi povodca. Kompletna oprema i pakiranje za prezentaciju spremnu za maloprodaju.
experience_section:
  eyebrow: Iskustvo iz stvarnog svijeta
  title: Partnerstva koja su gradila brendove
  subtitle: Stvarne priče od brendova i organizacija koje su surađivale Paddle Board Overstock s proizvodnjom i proizvodnjom OEMODM .
  stories:
    - quote: Došli smo Paddle Board Overstock k sebi sa skicom na salveti i popisom zahtjeva. Osam mjeseci kasnije, proizvod spreman za proizvodnju prošao CE je certifikat iz prvog pokušaja.
      narrative: Europski startup s novim SUP dizajnom pristupio je Paddle Board Overstock ODM proizvodnji. Paddle Board Overstock R&D tim je koncept proveo kroz CAD dizajn, FEA strukturnu analizu, hidrodinamičku simulaciju, izradu kalupa, izradu prototipova i proizvodne alate. Osnivač startupa posjetio je Qingdao tri puta tijekom procesa. Konačni proizvod prošao CE je certifikaciju bez ikakvih izmjena — rezultat koji osnivač pripisuje Paddle Board Overstockinženjerskom timu koji je od početka razumio europske regulatorne zahtjeve.
      context: SUP Europsko lansiranje brenda, 2023.-2024.
      source: Brand Founder
    - quote: Razina NDA zaštite i sigurnosti intelektualnog vlasništva Paddle Board Overstock daje nam povjerenje da dijelimo naše vlasničke dizajne. Oni tretiraju naše intelektualno vlasništvo kao da je njihovo vlastito.
      narrative: Američka tvrtka za pomorsku opremu s vlasničkom tehnologijom ventila trebala je proizvodnog partnera koji bi mogao zaštititi njihovo intelektualno vlasništvo dok proizvode u velikim količinama. Nakon revizije pet kineskih proizvođača, odabrali su Paddle Board Overstock na temelju protokola zaštite intelektualnog vlasništva tvornice, sigurnog rukovanja dizajnerskim datotekama i spremnosti na potpisivanje strogih NDA ugovora. Partnerstvo je tijekom četiri godine proizvelo tri linije proizvoda bez ikakvih incidenata intelektualnog vlasništva.
      context: Američka tvrtka za pomorsku opremu, OEM partnerstvo od 2021.
      source: Potpredsjednik operacija
