content_challenge:
  tagline: Izazov
  title: Zahtjevi Offshore Energije<br />Pouzdanost u ekstremnim uvjetima
  subtitle: Operacije u offshore energiji stavljaju opremu na granicu — ekstremno vrijeme, udaljene lokacije, kontinuirani ciklusi rada i nulta tolerancija na kvarove.
  paragraphs:
    - Offshore energetska industrija posluje u najzahtjevnijim morskim uvjetima na svijetu. Radne brodice podupiru naftne i plinske platforme, instalacije vjetroturbina, operacije podmorskih kabela i projekte pomorske konstrukcije — često u uvjetima otvorenog oceana s ograničenim vremenskim prozorima. Neuspjeh opreme nije samo skup, već je i opasan.
    - '**Sigurnost je najveći prioritet** — Brodovi za prijenos posade moraju sigurno raditi u morskim uvjetima koji bi zaustavili druge operacije. Stabilnost u trenutku prijenosa, pouzdan rad motora u svim vremenskim uvjetima i robusna konstrukcija za višestruko pristajanje uz offshore strukture su obavezni zahtjevi.'
    - '**Sposobnost za sve vremenske uvjete je ključna** — Offshore vjetroelektrane i naftne platforme rade tijekom cijele godine. Radne brodice moraju raditi u velikim valovima, jakim vjetrovima i ograničenoj vidljivosti. Dnevne i noćne operacije zahtijevaju potpune navigacijske sustave i pouzdane sustave rasvjete.'
    - '**Sektor offshore vjetra brzo raste** — Tisuće novih turbina postavljaju se širom svijeta, od kojih svaka zahtijeva redovan prijenos posade, transport alata i podršku u održavanju. To stvara stalnu potražnju za namjenski izgrađenim brodovima za prijenos posade (CTV) i potporom RIBs.'
    - Aquafarer offshore energija RIBs su dizajnirani s ojačanim deep-V trupovima, teškim Hypalon cijevima, potpunim navigacijskim sustavima i sigurnosnim sustavima dizajniranim za ekstremne uvjete offshore energetskih operacija.
content_solution:
  tagline: Naše rješenje
  title: Namjenski izgrađeni Offshore RIBs<br />Za Energetsku Industriju
  subtitle: Svaki Aquafarer offshore energija RIB je dizajniran za siguran, pouzdan rad u ekstremnim morskim uvjetima — od Sjevernog mora do jugoistočne Azije.
  list:
    - Ojačani deep-V trup za performanse u nemirnoj vodi i predvidljivo rukovanje
    - Teške Hypalon cijevi s UV i otpornost na kemikalije za produženi offshore rad
    - 316 nehrđajući čelik — bez korozije pri kontinuiranom izlaganju slanoj vodi
    - 'Potpuni navigacijski paket: GPS, radar, VHF, svjetla za noćnu navigaciju — standard na offshore modelima'
    - Samopražnjenje palube za siguran rad u plimnim uvjetima boarding
    - Konfiguracije s više motora — jedan ili dva vanjska motora radi redundancije misije
    - Vučni stup i teški nosači za upravljanje platformom i bovima
    - Boje cijevi visoke vidljivosti za identifikaciju na radnim mjestima na moru
content_segments:
  tagline: Energetski profili
  title: Offshore energetska rješenja<br />Prema vrsti primjene
  subtitle: Različiti sektori offshore energije imaju jedinstvene zahtjeve za radnim brodovima — od potpore RIBs platformi do CTV-ova vjetroelektrana i inspekcijskih plovila za podvodne vode.
  items:
    - title: Podrška za offshore naftne i plinske platforme
      subtitle: Prijenos posade, opskrba opremom, sigurnosna pripravnost na platformi
      description: Naftne i plinske platforme zahtijevaju dnevnu smjenu posade, prijevoz opreme i zaliha te sigurnosnu pripravnost. Radni brodovi moraju sigurno ploviti oko platformskih struktura, u jakim strujama i promjenjivim stanjima mora, te održavati precizno držanje položaja tijekom prijenosa osoblja pomoću ljestvi ili prolaza. Ekstremni uvjeti — ugljikovodici, kemikalije, stalna slana prskava — zahtijevaju konstrukciju otpornu na koroziju i pouzdane performanse.
      features:
        - Konfiguracija prijenosa posade s sigurnim pristupom ukrcaju i rukohvatima
        - Cijevi otporne na koroziju Hypalon i 316 hardvera od nehrđajućeg čelika
        - Ojačane trake za trljanje radi čestog kontakta s blatobranima na platformi
        - Samo-bailirajuća paluba za masnu vodu i kemijsko ispiranje
        - Spremnik za gorivo velikog kapaciteta za produženi domet rada na otvorenom moru
        - Opcija s dva motora za ključnu redundanciju
    - title: Operacije vjetroelektrane na moru
      subtitle: Prijenos posade, održavanje turbine, transport alata
      description: Vjetroelektrana na moru najbrže je rastući sektor u pomorskoj energiji. Operateri trebaju brodove za prijenos posade (CTV) koji mogu sigurno prebaciti tehničare na platforme za pristup turbinama u morskim stanjima do visine valova od 1,5 m značajne. Stabilnost tijekom prijenosa, sposobnost u svim vremenskim uvjetima i pouzdan svakodnevni rad su ključni. Brodovi za usluge vjetroelektrana rade po strogim rasporedima — svaki zastoj usporava puštanje u rad ili održavanje turbine, izravno utječući na prihode od proizvodnje energije.
      features:
        - Optimiziran oblik trupa za stabilan prijenos posade na bazi turbine
        - Deep-V ulaz za ugodnu vožnju u valovima i valovima na moru
        - Potpuna zaštita od vremenskih uvjeta — zatvorena konzola ili kormilarnica za udobnost posade
        - Prostor na palubi za alate, rezervne dijelove i servisnu opremu
        - Paket noćnih operacija za produžene zimske smjene s ograničenim dnevnim svjetlom
        - Tihi vanjski rad za minimalan utjecaj buke na morsko okruženje
    - title: Podrška podmorskim kabelima i cjevovodima
      subtitle: Inspekcija, održavanje, podrška za ROV-ove, pregled
      description: Operateri podmorskih kabela i cjevovoda trebaju radne brodove za inspekciju ruta, podršku održavanju, operacije ROV-a i zadatke istraživanja. Ovi brodovi zahtijevaju stabilne platforme za postavljanje i vraćanje podvodne opreme, precizno manevriranje pri malim brzinama za praćenje kabela te pouzdan rad u obalnim i offshore okruženjima. Stabilnost broda ključna je za točnost sonara i opreme za snimanje.
      features:
        - Stabilna platforma pri niskoj brzini za praćenje kabela i geodetske operacije
        - Otvoreni raspored palube za postavljanje ROV-a, kalema kabela i opreme za snimanje
        - Ploče za montažu opreme za sonare, GPS i istraživačku opremu
        - Dizajn trupa s niskim valovima za minimalno ometanje morskog dna tijekom inspekcije
        - Precizno manevriranje pri niskim brzinama uz responzivno upravljanje vanbrodskim motorom
    - title: Podrška u pomorskom inženjerstvu i konstrukciji
      subtitle: Prijevoz osoblja, opskrba materijalom, podrška ronjenju
      description: Izvođači pomorskog inženjerstva koji rade na izgradnji luka, zaštiti obale i offshore instalacijskim projektima trebaju svestrane radne brodice za prijevoz osoblja između konstrukcijskih plovila i obale, opskrbu materijalom i alatima, podršku ronjenju i pregled lokacija. Ove brodice djeluju u aktivnim građevinskim zonama s više plovila, ograničenim prostorom za manevriranje i promjenjivim uvjetima na moru. Izdržljivost i svestranost su od najveće važnosti.
      features:
        - Višenamjenski raspored palube za osoblje, materijale i ronilačku opremu
        - Merdevine za ronjenje i montaža opreme za operacije podrške ronjenju
        - Tvrde kuke i stup za vuču za manevriranje na gradilištu
        - Izdržljiva Hypalon konstrukcija za otpornost na građevinski otpad i abraziju
        - Fleksibilna konfiguracija sjedenja — prijevoz posade ili način za teret
