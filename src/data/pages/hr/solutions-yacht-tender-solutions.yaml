content_challenge:
  tagline: Izazov
  title: Tenderi za jahte zahtijevaju<br />Performanse i prezentaciju
  subtitle: Tender za jahtu je više od čamca — on je produžetak matičnog plovila i izjava o kvaliteti.
  paragraphs:
    - Vlasnici jahti i kapetani trebaju tendere koji dobro funkcioniraju, kompaktno se skladište i lijepo izgledaju. Tender bi trebao nadopunjavati estetiku jahte dok pruža pouzdan prijevoz za goste i posadu.
    - '**Skladištenje je ključno** — Tender mora stati na palubu, u garažu ili na davit sustav. Težina je važna za sustave lansiranja i povratka. Paddle Board Overstock RIBs nude izvrsne omjere snage i težine s kompaktnim profilima za skladištenje.'
    - '**Očekivanja u pogledu performansi su visoka** — Gosti očekuju glatku, suhu vožnju pri prijevozu do obale. Opcije motora moraju balansirati brzinu, domet i razinu buke za premium iskustvo. Za operacije chartera, tender se koristi svakodnevno i mora podnijeti često korištenje.'
    - '**Izgled je važan** — Neusklađeni ili istrošeni tender umanjuje ukupnu prezentaciju jahte. Prilagođene boje tubusa, tapeciranje i brendiranje osiguravaju da tender izgleda kao da pripada.'
content_solution:
  tagline: Naše rješenje
  title: Konfiguracije tendera<br />Za svaku primjenu jahte
  subtitle: Paddle Board Overstock RIB tenderi mogu se prilagoditi prema vašem plovilu, vrsti operacije i zahtjevima skladištenja — od specifikacija brodograditelja superjahti do programa flote za charter.
  list:
    - Prilagođene boje tubusa koje se podudaraju ili nadopunjuju matično plovilo — bilo koja RAL boja dostupna za Hypalon ili PVC tubuse
    - Prilagođeno tapeciranje i šavovi — premium vinil pomorske kvalitete s usklađivanjem boja i vezenjem logotipa
    - Konzola ili kormilo — odaberite prema obrascu korištenja i preferencijama operatera
    - Vlakna stakla dubokog V trupa za glatku, suhu vožnju u različitim uvjetima mora
    - Kompaktno skladištenje — ispuhuje se ili slaže u gnijezdo za palubnu garažu, ormarić ili davit skladištenje
    - Hypalon cijevi za UV otpornost i dugotrajnu očuvanost izgleda
    - Podizne točke i vučne prstenove standardno na svim modelima
    - Opcionalni pokrov za pramac, puni pokrov i zaštitni umeci protiv trošenja
    - 'Raspon motora: 15 HP do 60 HP — vanbrodski ili upravljačka konfiguracija'
    - OEM/privatna oznaka dostupna za brodograditelje jahti i marine distributere
content_segments:
  tagline: Profili kupaca
  title: Rješenja za brodove superjacht<br />Prema vrsti kupca
  subtitle: Različiti segmenti industrije jahti imaju jedinstvene zahtjeve. Paddle Board Overstock konfigurira gumenjake kako bi odgovarali svakoj primjeni.
  items:
    - title: Brodograditelji superjahti
      subtitle: OEM integracija gumenjaka — prilagođene dimenzije, boje i materijali
      description: 'Brodograditelji jahti suočavaju se s ponavljajućim izazovom: svako novo plovilo ima jedinstvena dimenzionalna ograničenja, težinska ograničenja i estetska očekivanja. Gumenjak se mora savršeno uklopiti u sustav daviča matične jahte, stati unutar preciznih dimenzija garaže i odgovarati dizajnerskom jeziku višemilijunske jahte. Svaka nesukladnost — pogrešna boja cijevi, neispravna postavka podizne točke, nekompatibilna težina — odgađa isporuku i negativno odražava na brodograditelja. Paddle Board Overstock izravno surađuje s nabavom i dizajnerskim timovima brodograditelja kako bi isporučio gumenjake s prilagođenim RAL bojama cijevi, odgovarajućim tapecirungom, brendiranim konzolnim panelima i kompletnim OEM paketom dokumentacije.'
      features:
        - Prilagođene dimenzionalne specifikacije u skladu s ograničenjima garaže i daviča
        - Bilo koja RAL boja cijevi i odgovarajući tapecirung — uzorci odobrenja dizajna dostupni
        - OEM brendiranje na konzoli, cijevi i naslonima sjedala
        - Validacija podizne točke i montaže daviča za svaki model
        - Optimizirana težina trupa za određene sustave lansiranja i oporavka
        - Raspored masovne isporuke u skladu s proizvodnim rokovima
    - title: Tvrtke za upravljanje jahtama
      subtitle: Standardizirani gumenjaci po floti — globalna podrška, minimalno zastoje
      description: Upravljačke tvrtke nadziru više jahti koje plove Sredozemljem, Karibima, Južnim Pacifikom i šire. Njihova osnovna potreba je pouzdanost — neispravan gumenjak u udaljenoj luci znači prekovremeni rad posade, žalbe gostiju i skupe zamjene u posljednjem trenutku. Standardizirane specifikacije flote smanjuju vrijeme obuke posade na brodovima i pojednostavljuju upravljanje rezervnim dijelovima. Paddle Board Overstock nudi cijene flote za više plovila, dosljedne specifikacije kroz narudžbe i globalnu podršku rezervnih dijelova za tvrtke koje upravljaju plovilima u različitim regijama.
      features:
        - Standardizirane specifikacije za cijelu upravljanu flotu
        - Zamjenski dijelovi zamjenjivi u svim gumenjacima flote
        - Cijene flote i popusti za višestruke narudžbe
        - Globalna dostupnost rezervnih dijelova — brza dostava u bilo koju luku
        - Dosljedna dokumentacija za servis i održavanje za posadu
        - Koordinacija isporuke više jedinica na različite lokacije plovila
    - title: Operateri charter jahti
      subtitle: Visokofrekventno dnevno poslovanje — izdržljivost bez narušavanja izgleda
      description: 'Tenderi za najam suočavaju se s najzahtjevnijim operativnim rasporedom u industriji jahti: dnevnim transferima gostiju, izletima na obalu, podrškom za vodene sportove i opskrbom pristaništa — često 200+ operacija po sezoni najma. Tender mora izgledati besprijekorno za svaku predaju gostiju, dok izdržava kontinuirano ukrcavanje, izloženost slanoj vodi i sate rada motora. Propadanje izgleda izravno je poslovno pitanje — istrošen tender utječe na recenzije gostiju i cijene najma. Paddle Board Overstock konfigurira tenderi za najam s nadograđenim tapecirungom, teškim Hypalon cijevima i ojačanim područjima za rukovanje radi dugoročne izdržljivosti koja održava kvalitetu prezentacije.'
      features:
        - Teške Hypalon cijevi — 5-8 godina trajanja u dnevnoj charter usluzi
        - Ojačani koraci za ukrcaj i držalice za čestu upotrebu
        - Premium vinilni tapecirung otporan na mrlje — jednostavno čišćenje između najmova
        - Površine palube protiv klizanja koje se lako čiste
        - Pouzdani vanbrodski paketi s jednostavnim pristupom za održavanje radi brzog okretanja
        - Materijali kozmetičke kvalitete koji održavaju izgled kroz sezone najma
    - title: Prodavači i brokeri jahti
      subtitle: Pouzdana opskrba tenderima za dovršetak plovila i vrijednost preprodaje
      description: Prodavači i brokeri trebaju stabilnu opskrbu kvalitetnim tenderima koji nadopunjuju plovila koja prodaju — usklađujući se s pozicioniranjem marke i poboljšavajući iskustvo kupca. Nepouzdani tender ili kašnjenje u opskrbi može odgoditi predaju jahte ili umanjiti prezentaciju oglasa. Prodavači zahtijevaju dosljednu kvalitetu među serijama, pouzdane rokove isporuke i konkurentne cijene za održavanje marži. Paddle Board Overstock nudi programe inventara za prodavače s rasporedom sezonskih isporuka, mogućnostima su-brendiranja za izlaganje u salonu i prioritetnu dodjelu tijekom vršne sezone.
      features:
        - Programi zaliha s modelima dostupnim na zahtjev
        - Sezonski raspored isporuka usklađen s kalendarom predaje
        - Su-brendiranje prodavača na konzoli i cijevima za izlaganje u salonu
        - Dosljedna kvaliteta i specifikacije u svim narudžbama serije
        - Konkurentne cijene za prodavače s obzirom na količinu
