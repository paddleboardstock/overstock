hero:
  tagline: Središte ovlasti
  title: Zašto Paddle Board Overstock?<br />Povjerenje izgrađeno tijekom desetljeća
  subtitle: Svaka brodica koju gradimo nosi težinu 10+ godina pomorskog inženjerstva, certificiranih sustava kvalitete i tisuća uspješnih operacija širom svijeta. Zato profesionalci iz industrije biraju Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock pogon za proizvodnju plovila i tim inženjera
