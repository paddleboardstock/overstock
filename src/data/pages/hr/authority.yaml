features3_brand:
  tagline: Tko smo mi
  title: Temelj brenda<br />& naslijeđe
  subtitle: Priča, stručnost i globalni doseg koji definiraju Paddle Board Overstock kao pouzdanog proizvođača pomorske opreme.
  isBeforeContent: false
  columns: 3
  items:
    - title: Oko Paddle Board Overstock
      description: Osnovano 2012. u Qingdao, Kina. Od obalnog radionice do pogona od 12.000 m² — potpuna priča o Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Priča o robnoj marki
      description: Kako je tim pomorskih inženjera krenuo učiniti profesionalne napuhljive brodice dostupnima širom svijeta.
      icon: tabler:book
      link: /brand-story
    - title: Stručnost u pomorskoj industriji
      description: Duboka znanost o materijalima, precizna proizvodnja i testiranje u stvarnom svijetu — desetljeća pomorskog inženjerstva u svakom trupu.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globalna prisutnost
      description: Opskrbljujemo 50+ zemalja na svim kontinentima. Regionalna stručnost za lokalne regulatorne zahtjeve i preferencije tržišta.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Zašto Paddle Board Overstock
      description: Što nas izdvaja — kvaliteta, prilagodba, izravne tvorničke cijene i cjelovita podrška za komercijalne operatore.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Naš tim
      description: Upoznajte rukovodstvo — pomorske inženjere, znanstvenike za materijale i stručnjake za proizvodnju koji pokreću Paddle Board Overstock naprijed.
      icon: tabler:users
      link: /brand/team
    - title: Inženjerski tim
      description: Ukupno 78+ godina u R&D, 40+ platformi, 12 certifikata, 1200+ OEM projekata. Tehnički tim iza svakog proizvoda.
      icon: tabler:engine
      link: /engineering-team
    - title: Centar za istraživanje i razvoj
      description: Hidrodinamičko inženjerstvo brodskog trupa, RF zavarivanje, PVC laboratorij, prototipiranje, ispitni bazen i laboratorij za kvalitetu — naš cjelokupni istraživačko-razvojni centar.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Povjerenje i Kvaliteta
  title: Certifikati, Kvaliteta<br />i Dokazi
  subtitle: Neovisni certifikati, rigorozna ispitivanja i stvarni dokazi koji pokazuju našu predanost kvaliteti.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifikati
      description: CE, ISO 9001, UKCA, BSCI, REACH — kompletna dokumentacija o certifikaciji i usklađenosti za globalna tržišta.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvaliteta i testiranje
      description: Svaki proizvod se ispituje pod pritiskom prije slanja. Čvrstoća šava, otpornost UV, plovnost — provjeravaju se u svakoj fazi.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dokazi i Potvrde
      description: Rezultati testiranja, fotografije primjene, izvještaji neovisnih inspekcija i studije slučaja koji potvrđuju kvalitetu Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Grafikon znanja
      description: Istražite graf entiteta Paddle Board Overstock — proizvodi, tehnologije, certifikati i odnosi u povezanoj bazi znanja.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vodstvo
  title: Upoznajte Tim<br />Iza Paddle Board Overstock
  subtitle: Stručnost u industriji koja obuhvaća pomorsko inženjerstvo, znanost o materijalima, upravljanje kvalitetom i globalnu B2B trgovinu.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Osnivač i CEO
      description: 15+ godina u proizvodnji brodova. Ranije vodio R&D u velikom kineskom proizvođaču brodova. Posjeduje više patenata za dizajn napuhanih čamaca.
      icon: tabler:crown
    - title: Zhang Wei — Glavni inženjer
      description: 20+ godina u PVC/Hypalon proizvodnji i dizajnu trupa dubokog V oblika. Bivši tehnički direktor u europskoj tvrtki za pomorsko inženjerstvo.
      icon: tabler:engine
    - title: Chen Ming — Voditelj R&D-a
      description: Doktorat iz znanosti o materijalima. Specijalizira se u drop-stitch tehnologiji i visokofrekvencijskom zavarivanju. 10+ godina u tekstilnim kompozitima.
      icon: tabler:flask
    - title: Liu Qiang — Direktor proizvodnje
      description: 18+ godina u lean proizvodnji. Six Sigma Black Belt. Implementirao ISO 9001 sustave kvalitete u svim proizvodnim linijama.
      icon: tabler:settings
    - title: Wang Fang — Voditelj kvalitete
      description: 12+ godina u kontroli kvalitete u pomorstvu. Certificirani CE i ISO auditor. Nadgleda testiranje svake proizvodne serije.
      icon: tabler:shield-check
    - title: Helen Lee — Direktorica prodaje
      description: 15+ godina u međunarodnoj B2B trgovini. Upravljala OEM/ODM partnerstvima u 30+ zemalja. Tečno govori 4 jezika.
      icon: tabler:briefcase
