workshops_section:
  tagline: Radionice
  title: Proizvodne radionice
  workshops:
    - title: PVC Rezanje i priprema materijala
      description: Automatske CNC rezačke mašine obrađuju PVC, Hypalon i drop-stitch tkanine s preciznošću manjom od milimetra. Računalno optimizirano slaganje smanjuje otpad materijala i osigurava da svaki panel zadovoljava dimenzijske specifikacije prije zavarivanja.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Zavarivanje cijevi i toplinska brtva
      description: Namjenska radionica za zavarivanje s mašinama za toplinsko brtvljenje i RF dielektričnim prešama. Brtvila za toplim zrakom spajaju i povezuju PVC cijevne odjeljke, dok RF zavarivanje stvara šavove velike čvrstoće i zrakonepropusnosti koji premašuju zahtjeve ISO 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: Proizvodnja trupa RIB — stakloplastika
      description: RIB brodskih trupova proizvodi se ručnim oblikovanjem stakloplastike s poliester i vinilester smolama. Svaki sloj se ručno valja i vakumira za konstantnu kvalitetu. Kabina za raspršivanje gelcoata pruža visokosjajni, UV otporniji morski završetak.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Tisak i dekoracija
      description: SUP ploče se ukrašavaju digitalnim tiskom za grafiku u punoj boji i sitotiskom za logotipe i ponavljajuće uzorke. Digitalni pisači stvaraju fotokvalitetne dizajne paluba, dok sitotisak osigurava izdržljive, jarke brend oznake.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Završno sastavljanje i opremanje
      description: Proizvodna linija gdje se trupovi od stakloplastike i PVC cijevi spajaju, motori montiraju, upravljanje i kontrole povezuju, a električni sustavi ožičuju. Svaki brod prolazi 100-točkovni popis za sastavljanje koji potpisuje voditelj tima.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Kontrola kvalitete i inspekcija
      description: Svaki gotovi brod podliježe obaveznom testiranju zadržavanja zraka, provjeri šavova i potpunoj provjeri sustava prije isporuke. Naš laboratorij za kontrolu kvalitete radi neovisno o proizvodnji i izravno izvještava upravu.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
