qc_section:
  tagline: Kontrola kvalitete
  title: Proces testiranja i osiguranja kvalitete
  subtitle: Svaki brod prolazi obavezna testiranja prije otpreme. Naš laboratorij za kvalitetu radi neovisno o proizvodnji i izravno izvještava upravu.
  steps:
    - step: '1'
      title: Inspekcija sirovina
      desc: ', PVCHypalon, , a drop-stitch tkanine prolaze ispitivanje zateznosti (ASTM D751), širenje trganja i UV provjeru otpornosti prije nego što bilo koja serija uđe u proizvodnju.'
    - step: '2'
      title: 48-satni test zadržavanja zraka
      desc: Svaka komora cijevi napuhuje se na 125% nazivnog tlaka i drži se 48 sati. Pad tlaka veći od 5% pokreće automatsko odbacivanje i ponovnu inspekciju spoja.
    - step: '3'
      title: Testiranje opterećenja i ravnoteže
      desc: Dovršeni brodovi se pune do maksimalnog kapaciteta i testiraju na stabilnost, slobodni bok i upravljivost. Svako plovilo se testira na vodi prije završnog pregleda.
oem_section:
  tagline: OEM Projekti
  title: OEM Studije slučaja brenda i partnerstva
  subtitle: Od koncepta do kontejnera — kako pomažemo globalnim brendovima da lansiraju i prošire svoje linije napuhavajućih plovila.
  cases:
    - challenge: Europski trgovac na otvorenom trebao je liniju privatne robne SUP marke s jedinstvenom grafikom na terasama, ekološki PVCprihvatljivim i ambalažom spremnom za prodaju — sve isporučeno u roku od 60 dana.
      solution: Razvili smo prilagođene digitalne datoteke za ispis, pribavili REACHusklađene podatke PVCi komprimirali uzorke iz 3 u 1 tako što smo zajedno smjestili dizajnerski tim u našu tvornicu u Qingdaou.
      result: 55 dana od potpisanog PO do FOB. 2.400 jedinica u 4 SKU-a. Ponovljena narudžba prije dolaska prvog kontejnera.
    - challenge: Američki startup za vodene sportove trebao je visokoučinkovit drop-stitch kajak s prilagođenim oblikom trupa, zajedničkim pakiranjem i BSCI certifikatom za maloprodaju.
      solution: Prilagodio je drop-stitch postojeći kalup kajaka s modificiranim profilom rockera, razvio zajedničku umjetničku obradu ambalaže i pružio BSCI potpunu revizijsku dokumentaciju.
      result: Uspješno je uvršten u 3 velika američka lanca outdoor trgovina. 5.000+ jedinica u prvoj godini s 98% stope prodaje.
    - challenge: Australski distributer zahtijevao je CERIB -certificirani poligon s prilagođenim bojama cijevi, Hypalon opcijom nadogradnje i usklađenošću s australskim standardom AS 1799.
      solution: Proizveo je predproizvodne uzorke s 4 varijante u boji cijevi, nabavljene CSM Hypalon od japanskog dobavljača, i koordinirao testiranje usklađenosti s AS 1799 s neovisnim stranama.
      result: RIB Lansirana je serija od 3 modela na tržištu Australije/Novog Zelanda. Nakon toga je uslijedila pobjeda na državnom natječaju za 12 patrolaRIBs.
faq_section:
  tagline: Često postavljana pitanja
  title: '& B2B OEM Često postavljana pitanja'
  questions:
    - q: Koja je minimalna količina narudžbe (MOQ) za OEM SUP napuhavajuće daske?
      a: MOQ Standardni modeli počinju s 5–10 jedinica OEM . Prilagođeni kalupi i projekti privatnih marki zahtijevaju minimalno 200 jedinica, ovisno o složenosti. Probne narudžbe i probne serije dostupne su za lansiranje novih marki.
    - q: Aquafarer Ima BSCI li certifikat?
      a: Da. Naša tvornica održava BSCI važeću certifikaciju socijalne usklađenosti (izvještaj o reviziji dostupan na zahtjev). Također posjedujemo ISO 9001:2015 za upravljanje kvalitetom, a 64 naša modela proizvoda imaju CE certifikat (TÜVRheinland).REACH i RoHS dokumentaciju o usklađenosti koja se pruža uz OEM svaku pošiljku.
    - q: Koje je uobičajeno vrijeme isporuke OEM narudžbe?
      a: Standardno vrijeme isporuke je 30–45 dana od potvrđene narudžbe i uplate depozita. Razvoj posebnih kalupa dodaje 15–20 dana za izradu alata. Nudimo ubrzanu proizvodnju za hitne narudžbe i sezonske nalete tijekom predljetnog razdoblja (siječanj–ožujak).
    - q: Možete li isporučiti FOB Qingdao ili CIF u našu luku?
      a: Da. Dostavljamo u FOB Qingdao, CIF glavne svjetske luke i DDP za kvalificirane partnere. Naš logistički tim upravlja rezervacijom kontejnera, izvoznom dokumentacijom i carinjenjem. Dostavljamo u 50+ zemalja širom EU, SAD-a, Australije i azijskih tržišta.
b2b_moq: 'Standard MOQ: 5–10 jedinica po modelu (SUP/kajak/drop-stitch). RIB MOQ: 2–5 jedinica. Probna narudžba dobrodošla za nova partnerstva.'
production_flow:
  tagline: Proizvodni tok
  title: Od materijala do gotove čamca
  subtitle: Svaka brod prolazi kroz 6 proizvodnih faza s kontrolnim točkama za QC na svakom koraku. Nema prečaca, nema preskakanja inspekcija.
  stages:
    - stage: '01'
      title: Primanje materijala i dolazna kontrola kvalitete
      description: Svi dolazni materijali bilježe se po serijskom/broju lota u našem ERP sustavu. Valjci tkanine PVC, jezgre drop-stitch, ventili, ljepila i pričvrsni elementi se stavljaju u karantenu dok ne dobiju odobrenje kontrole kvalitete.
      qc_check: Vlačna čvrstoća (ASTM D751), otpornost na kidanje (ISO 4674), mjera debljine, viskoznost ljepila, vizualno skeniranje nedostataka
      qc_threshold: 100% serija testirano. Odbiti ako je čvrstoća na zatezanje < 90% specifikacije, čvrstoća na kidanje < minimalne specifikacije ili bilo kakva vizualna mana
      responsibility: Dolazni QC tim (3 inspektora)
    - stage: '02'
      title: CNC Rezanje i priprema materijala
      description: Računalno optimizirano slaganje raspoređuje ploče na PVC materijalu kako bi se minimalizirao otpad. Automatske CNC rezačke strojeve održavaju preciznost pozicioniranja od 0,1 mm.
      qc_check: Dimenzijska provjera prema CAD DXF datotekama, inspekcija kvalitete rubova, provjera broja panela
      qc_threshold: Svaki 20. panel se mjeri. Tolerancija ±0,5 mm. Odbaciti seriju ako je >2% izvan tolerancije
      responsibility: Voditelj radionice rezanja
    - stage: '03'
      title: Zavarivanje i Drop-Stitch spajanje
      description: Drop-stitch jezgre su vezane za vanjske PVC slojeve pomoću toplinske laminacije. Cijevne komore su RF-zavarene ili zavarene vrućim zrakom. Pojasevi tračnica su trostruko slojno fuzijsko povezani.
      qc_check: Test ljuštenja svakih 50 jedinica (ASTM D751), mjerenje širine zavara, pregled zapisa temperature toplog zraka, vizualna inspekcija šava pod svjetlom s leđa
      qc_threshold: Minimalna čvrstoća ljuštenja 8 N/cm. Tolerancija širine zavarivanja ±1 mm. Svaki vidljivi kanal = odbaciti
      responsibility: Kontrola kvalitete zavarivanja (2 inspektora po smjeni)
    - stage: '04'
      title: Sastavljanje i montiranje
      description: 'Brodovi se premještaju na završnu montažu gdje se svi dijelovi spajaju: trup, cijevi, instalirani ventili, D-prstenovi, ručke, kutije za peraje i priprema torbe za nošenje. Svaka jedinica prolazi kroz kontrolni popis montaže od 100 točaka.'
      qc_check: Potpisivanje kontrolnog popisa od 100 točaka po jedinici, test funkcije ventila (10 ciklusa otvaranja/zatvaranja), provjera momenta pričvršćivača, vizualni pregled
      qc_threshold: 'Politika nulte pogreške na sigurnosno kritičnim predmetima (ventili, D-prstenovi, ručke). Manji kozmetički: AQL 2,5 (ISO 2859)'
      responsibility: Vođa montažnog tima + kontrola kvalitete na liniji
    - stage: '05'
      title: Testiranje tlaka i zadržavanje kvalitete
      description: Svaka komora se napuhuje do 1,25× nazivne tlačne vrijednosti (obično 20–25 PSI) i održava 24–48 sati. Senzori tlaka neprestano bilježe podatke. Komore s padom tlaka većim od 5% odbacuju se i šalju na ponovnu inspekciju šava.
      qc_check: 24-satni zapis držanja tlaka, kalibracija senzora provjerava se dnevno, očitanje tlaka kompenzirano temperaturom, ponovno testiranje šava nakon popravka
      qc_threshold: Maksimalni pad tlaka od 5% tijekom 24 sata na stabilnoj temperaturi. Svaka komora iznad ove = 100% ponovno testiranje cijele proizvodne serije
      responsibility: Laboratorij za kvalitetu (neovisno o proizvodnji, izvještava upravu)
    - stage: '06'
      title: Završni pregled i pakiranje
      description: Završna vizualna i funkcionalna inspekcija. Površinski nedostaci, konzistencija boje, provjera oznaka/BIN-a, integritet pakiranja i potpunost dodataka. Jedinice se vakuumski pakiraju, pakiraju i paletiziraju za utovar u kontejnere.
      qc_check: Potpuni vizualni pregled, kontrolni popis dodataka po SKUkomadu, test pada ambalaže (1 m, nasumični uzorak), provjera skeniranja naljepnica/barkodova
      qc_threshold: AQL 2,5 za veće kvarove, AQL 4,0 za manje. Nulta tolerancija na sigurnosne nedostatke. 100% jedinica vizualno pregledanih
      responsibility: Konačni QC tim (4 inspektora) + Vođa tima za pakiranje
