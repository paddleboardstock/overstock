material_traceability:
  tagline: Sljedivost
  title: Praćenje materijala i kontrola serija
  description: Svaka serija sirovina u našem sustavu dobiva jedinstveni broj serije ERP . Od dolaska preko proizvodnje do gotovog proizvoda, popis materijala svakog broda povezuje se s izvornom serijom dobavljača. To omogućuje potpunu sljedivost unaprijed za bilo kakve upite o kvaliteti ili usklađenosti.
  system: ERP Prilagođene (interne + sistemske) fizičke batch oznake na svakom radnom nalogu
  coverage: 100% proizvodnih materijala — PVC, Hypalon, drop-stitch tkanina, ljepila, ventili, hardver, pakiranje
  records_retained: 10 godina (prema CE zahtjevu 2013/53/EU)
  suppliers:
    - material: Pomorska kvaliteta PVC
      source: Kineski i korejski dobavljači
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch tkanina
      source: Interno tkanje + vanjski partner
      certified: Interna kontrola kvalitete + dobavljača ISO 9001
    - material: Ventili i hardver
      source: Chinese OEM suppliers
      certified: ISO 9001, certifikati materijala po seriji
