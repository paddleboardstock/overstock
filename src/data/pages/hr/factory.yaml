hero:
  tagline: Tvornica
  title: Tvornica i Proizvodnja
  subtitle: 12.000 m2 integrirane proizvodnje — od sirovine do gotovog broda
intro:
  - Kao tvornica marke **Aquafarer Qingdao Manufacturing Hub**, Aquafarer kontrolira svaku fazu proizvodnje — od dolaska sirovih PVC i stakloplastičnih materijala do konačne predisporuke inspekcije gotovog broda. Naš proizvodni pogon u Qingdao Ekonomskoj Razvojnoj Zoni prostire se na 12.000 četvornih metara i sadrži posebne radionice za PVC rezanje, toplinsko zaptivanje cijevi, proizvodnju stakloplastičnih RIB trupova, SUP digitalni tisak, završnu montažu i testiranje kvalitete.
  - Integriranjem dizajna, inženjeringa, prototipiranja, proizvodnje i testiranja pod jednim krovom, uklanjamo neučinkovitosti ugovorene proizvodnje i održavamo izravnu kontrolu nad kvalitetom izrade, odabirom materijala i rokovima isporuke. Svaki brod koji napusti našu radionicu izrađen je od naših ljudi, na našoj opremi, prema našim standardima.
