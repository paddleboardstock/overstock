  cards:
    - challenge: Europski trgovac na otvorenom trebao je liniju privatne robne SUP marke s jedinstvenom grafikom na terasama, ekološki PVCprihvatljivim i ambalažom spremnom za prodaju — sve isporučeno u roku od 60 dana.
      solution: Razvili smo prilagođene digitalne datoteke za ispis, pribavili REACHusklađene podatke PVCi komprimirali uzorke iz 3 u 1 tako što smo zajedno smjestili dizajnerski tim u našu tvornicu u Qingdaou.
      result: 55 dana od potpisanog PO do FOB. 2.400 jedinica u 4 SKU-a. Ponovljena narudžba prije dolaska prvog kontejnera.
    - challenge: Američki startup za vodene sportove trebao je visokoučinkovit drop-stitch kajak s prilagođenim oblikom trupa, zajedničkim pakiranjem i BSCI certifikatom za maloprodaju.
      solution: Prilagodio je drop-stitch postojeći kalup kajaka s modificiranim profilom rockera, razvio zajedničku umjetničku obradu ambalaže i pružio BSCI potpunu revizijsku dokumentaciju.
      result: Uspješno je uvršten u 3 velika američka lanca outdoor trgovina. 5.000+ jedinica u prvoj godini s 98% stope prodaje.
    - challenge: Australski distributer zahtijevao je CERIB -certificirani poligon s prilagođenim bojama cijevi, Hypalon opcijom nadogradnje i usklađenošću s australskim standardom AS 1799.
      solution: Proizveo je predproizvodne uzorke s 4 varijante u boji cijevi, nabavljene CSM Hypalon od japanskog dobavljača, i koordinirao testiranje usklađenosti s AS 1799 s neovisnim stranama.
      result: RIB Lansirana je serija od 3 modela na tržištu Australije/Novog Zelanda. Nakon toga je uslijedila pobjeda na državnom natječaju za 12 patrolaRIBs.
