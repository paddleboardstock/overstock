hero:
  tagline: Škole i treninzi vodenih sportova
  title: Rješenja opreme<br />Za SUP i škole kajaka
  subtitle: Pouzdana oprema komercijalne kvalitete za škole veslanja, instrukcije surfanja, trening kajaka i programe obrazovanja u vodenim sportovima bilo koje veličine.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP daske za škole i centre za trening
direct_answer: Aquafarer opskrbljuje SUP i škole kajaka širom svijeta daskama komercijalne kvalitete, sigurnosnom opremom i paketima za instruktore. Naša je oprema izrađena za svakodnevnu nastavu — deblji PVC, ojačani drop-stitch jezgre i stabilni trupovi koji daju početnicima samopouzdanje, a instruktorima pouzdanost. Paketi uključuju prilagođeno brendiranje, programe rezervnih dijelova i resurse za obuku.
