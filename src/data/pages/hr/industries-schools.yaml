benefits:
  - title: Izgrađeno za svakodnevnu nastavu
    description: Deblji PVC i ojačane šine izdržavaju svakodnevnu upotrebu od strane učenika, padove na pijesku i stjenovita doskakanja.
    icon: tabler:shield
  - title: Stabilne platforme za učenje
    description: Šira trupa i ravnije kljunove daju početnicima povjerenje. Instruktori se fokusiraju na podučavanje, a ne na opremu.
    icon: tabler:scale
  - title: Jednostavno skladištenje i transport
    description: Napuhivač dizajn omogućuje skladištenje u malim prostorima. Ispuhane daske stanu u prtljažnike standardnih vozila za mobilnu nastavu.
    icon: tabler:box-seam
  - title: Prilagođeno brendiranje
    description: Školski logotipi i boje na svakoj dasci. Vaš brend, vaš identitet — ne generička iznajmljiva oprema.
    icon: tabler:brush
content_segments:
  tagline: Školski profili
  title: Rješenja za obrazovanje u vodenim sportovima<br />Prema tipu programa
  subtitle: Škole veslanja, surf akademije, sveučilišni programi i franšizni operateri suočavaju se s različitim operativnim izazovima — od integracije nastavnog plana do standardizacije flote na više lokacija. Konfiguriramo pakete opreme tako da odgovaraju obrazovnom modelu.
  items:
    - title: Nezavisne SUP i škole kajaka
      subtitle: Centri za obuku kojima upravlja vlasnik
      description: Male do srednje škole koje vode instruktori-vlasnici nude SUP lekcije, obuku kajaka i certifikacijske tečajeve. Oprema mora biti dovoljno izdržljiva za svakodnevnu upotrebu u nastavi, pristupačna u okviru malog poslovnog budžeta i dovoljno svestrana da služi početnicima do srednje naprednim učenicima u jednoj floti.
      features:
        - Stabilne ploče SUP za sve namjene i rekreativni kajaci za početničke lekcije
        - Instruktor-specifične ploče s dodatnom stabilnošću za podučavanje u vodi
        - Uključeni predlošci planova lekcija i vodiči za napredovanje vještina
        - Godišnji program obnove opreme s popustima pri zamjeni
    - title: Programi rekreacije na sveučilištima i fakultetima
      subtitle: Veliki flotni sustavi za studentsku rekreaciju
      description: Odsjeci za rekreaciju na sveučilištima upravljaju klubovima za veslanje, programima najma i tečajevima kao dijelom ponude kampus rekreacije. Oprema je u vršnoj upotrebi tijekom semestra, zahtijeva jednostavne sustave za prijavu/odjavu i mora izdržati različite razine vještina, od apsolutnih početnika do naprednih veslača.
      features:
        - Izdržljiva PVC konstrukcija ocijenjena za institucionalne cikluse uporabe
        - Flote kodirane bojama prema razini vještine radi jednostavnog upravljanja
        - Kompatibilnost sa sustavima praćenja inventara temeljenim na RFID-u ili naljepnicama
        - Cijene u velikim količinama s narudžbama i uvjetima plaćanja temeljenim na semestru
    - title: Škole surfanja i surf akademije
      subtitle: Programi podučavanja surfanja na obali
      description: Škole surfanja podučavaju SUP surfing, veslanje u ležećem položaju i vještine surf kajaka u oceanima. Oprema mora podnijeti uvjete u zoni valova — otpornost na udarce, toleranciju na pijesak i slanu vodu te jednostavno ispiranje i ponovnu pripremu između satnih lekcija.
      features:
        - Surf specifični oblici s ojačanim bridovima i konstrukcijom otpornom na udarce
        - Opcije s mekim perajama i uvijenim sigurnosnim uzicama za sigurnost učenika
        - Tkanina koja se brzo ispire i suši između rotacija lekcija
        - Program obnove flote s inspekcijom i obnovom na kraju sezone
    - title: Franšize i lanci s više lokacija
      subtitle: Standardizirana oprema u svim lokacijama
      description: Operateri s više lokacija provode standardizirane programe obuke u više gradova ili regija. Dosljednost flote u svim lokacijama je ključna — svaki učenik treba imati isto iskustvo opreme bez obzira koju franšiznu lokaciju posjeti. Centralizirana narudžba, uniformnost brenda i podrška za skaliranje su ključni.
      features:
        - Identične specifikacije flote u svim franšiznim lokacijama
        - Centralizirana konsolidirana narudžba s cijenama za velike količine
        - 'Opcije su-brendiranja: franšizni brand + Aquafarer su-brend'
        - 'Komplet za postavljanje nove lokacije: oprema, signalizacija i početni inventar'
