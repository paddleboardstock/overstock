hero:
  tagline: Proizvodni kapacitet
  title: Proizvodni kapacitet i godišnja proizvodnja
  subtitle: Postrojenje od 12.000 m² koje proizvodi 15.000 čamaca godišnje uz mogućnost proširenja
intro: Aquafarer upravlja jednim od najvećih postrojenja posvećenih proizvodnji napuhavajućih čamaca u Qingdaou, Kina. Naša tvornica od 12.000 m² organizirana je u šest specijaliziranih radionica koje rade paralelno, što nam daje kapacitet za proizvodnju 15.000 čamaca godišnje u SUP, kajak, čamac, RIB i linijama sigurnosne opreme.
highlights:
  - value: 12,000 m²
    label: Ukupna proizvodna površina
    detail: Kroz 6 specijaliziranih radionica
  - value: 15,000
    label: Čamci proizvedeni godišnje
    detail: SUPs, kajaci, RIBs, čamci, sigurnosna oprema
  - value: 200-300
    label: Kvalificirana radna snaga
    detail: 25+ inženjera, 2 smjene/dan
  - value: 50+
    label: Zemlje izvoza
    detail: EU, SAD, Australija, Bliski Istok, Azija
  - value: 30–45
    label: Standardno vrijeme isporuke (dani)
    detail: Od potvrde narudžbe do FOB
  - value: 10+
    label: Godine iskustva u izvozu
    detail: Od 2012
workshops:
  - title: SUP Proizvodnja dasaka
    description: '4 paralelne linije montaže za napuhavajuće SUP daske. Svaka linija može proizvesti 50–80 dasaka po smjeni. Stanice za digitalni i sito tisak rade istovremeno. Godišnji kapacitet SUP: 8.000+ dasaka.'
    output: 8.000+ SUPs/godina
  - title: RIB Proizvodnja čamaca
    description: 'Posvećena radionica za staklo-plastične trupove sa 6 stanica kalupa za RIB trupove do 7,6 m. Područje zavarivanja cijevi i montaže obrađuje 3–5 RIBs istovremeno. Godišnji kapacitet RIB: 2.000+ čamaca.'
    output: 2.000+ RIBs/godina
  - title: Napuhavajući čamci i gumenjaci
    description: 'Višenamjenske proizvodne linije za napuhavajuće čamce, kajake i gumenjake. Stanice za zavarivanje toplim zrakom, RF dielektrične preše i montažne stanice se rekonfiguriraju prema miksu narudžbi. Godišnji kapacitet: 5.000+ jedinica.'
    output: 5.000+ jedinica/godina
  - title: Sigurnosna oprema
    description: 'Odvojeno kontrolirano područje za proizvodnju prsluka za spašavanje i sigurnosne opreme. Posvećene stanice za šivanje, umetanje pjene i testiranje. Godišnji kapacitet prsluka: 50.000+ jedinica.'
    output: 50.000+ prsluka/godina
oem_capacity:
  moq: 'SUP: 5–10 jedinica | RIB: 2–5 jedinica | Kajak/čamac: 10–20 jedinica | Prilagođeni kalup: 200+ jedinica'
  lead_time: Standardno 30–45 dana. Uzorak 15–20 dana. Dostupna je ubrzana narudžba.
  payment: T/T 30% depozit + 70% prije slanja. L/C, Western Union prihvaćeni.
