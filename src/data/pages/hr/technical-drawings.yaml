content_version_control:
  tagline: Upravljanje verzijama
  title: Verzija crteža<br />Upravljanje
  subtitle: Svaki crtež prati kontrolirani sustav revizija. Uvijek provjerite imate li najnoviju verziju prije upotrebe crteža za planiranje projekta.
  items:
    - title: Praćenje revizija
      description: Svaki crtež nosi kod revizije (Rev-A, Rev-B, Rev-C), datum izdavanja, datum posljednjeg pregleda, primjenjivi model/konfiguraciju, jedinice, veličinu datoteke i format. Samo je "Trenutna" revizija dostupna za preuzimanje.
      icon: tabler:git-branch
    - title: Obavijest o statusu crteža
      description: Svi javni crteži označeni su "Samo preliminarni raspored — nije za izgradnju, certificiranje ili proizvodnju. Dimenzije podložne konačnoj specifikaciji i potvrdi narudžbe." To štiti obje strane od nepravilne primjene.
      icon: tabler:alert-circle
    - title: Obavijesti o ažuriranjima
      description: Kad se specifikacija modela promijeni, revizija crteža se ažurira, a prethodne verzije označene su "Zastarjelo." Registriranim korisnicima koji su preuzeli DXF/DWG pakete, značajna ažuriranja se šalju putem e-pošte.
      icon: tabler:bell
faq:
  title: Tehnički crteži — Često postavljana pitanja
  questions:
    - q: Jesu li GA PDF-ovi stvarno besplatni?
      a: Da. GA PDF-ovi za naše glavne modele dostupni su besplatno — ispunite kratak obrazac za kvalifikaciju u nastavku i poveznica za preuzimanje će biti poslana e-poštom u roku od 1 radnog dana. Sadrže informacije na razini planiranja dovoljne za procjenu projekta, raspored prostora i preliminarni pregled specifikacija.
    - q: Kako mogu pristupiti DXF/DWG datotekama?
      a: Ispunite kratak obrazac za kvalifikaciju na stranici za preuzimanje s nazivom vaše tvrtke, vrsta projekta i namjeravana upotreba. Odobreni zahtjevi dobivaju poveznicu za preuzimanje putem e-pošte u roku od 1 radnog dana.
    - q: Mogu li dobiti STEP/IGES 3D modele?
      a: STEP ili IGES 3D model datoteke dostupne su putem našeg postupka prijave projekta. Dostavite opseg projekta, zahtjeve za integraciju, vremenski okvir i namjeru kupnje. Podložno odobrenju — obično unutar 3-5 radnih dana.
    - q: Zašto ograničavate pristup datotekama s više detalja?
      a: Geometrija trupa, podaci o kalupu i strukturni proračuni predstavljaju godine ulaganja u istraživanje i razvoj te su ključna proizvodna intelektualna svojina. Prilikom planiranja nabave i integracije projekta pružamo sve potrebne informacije, dok štitimo našu sposobnost daljnjeg ulaganja u razvoj novih proizvoda.
    - q: Jesu li crteži uključuju detalje proizvodnje?
      a: Ne. Javne i jednostavne forme crteža sadrže informacije na razini nabave za planiranje i specifikaciju. Detalji na razini proizvodnje (rasporedi laminacije, putanje alata, proširenja rezanja) dijele se samo pod NDA s potvrđenim narudžbama.
    - q: Jesu li crteži dostupni za prilagođene ili polu-prilagođene RIB konfiguracije?
      a: Crteži prilagođenih projekata pripremaju se kao dio OEM/ODM procesa razvoja. Ako procjenjujete prilagođeni RIB projekt, kontaktirajte nas s vašim zahtjevima i pružit ćemo GA crteže specifične za projekt kao dio ponude.
