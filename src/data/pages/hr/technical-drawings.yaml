hero:
  tagline: Tehnički crteži i CAD
  title: RIB i napuhavanje čamca<br />Preuzimanja tehničkih crteža i CAD-a
  subtitle: Crteži opće namjene (GA), listovi dimenzija i tlocrt palube za evaluaciju i specifikaciju projekta. Pristupite tehničkim crtežima na odgovarajućoj razini — od javnih PDF-ova do projektnih STEP datoteka.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB tehnički crteži čamaca i CAD preuzimanja
direct_answer: Paddle Board Overstock pruža tehničke crteže za razinu nabave za RIB čamce i napuhavajuća plovila — uključujući PDF-ove opće namjene (GA), listove dimenzija i crteže rasporeda palube. Formati s višom razinom detalja (DXF/DWG, STEP/IGES) dostupni su na kvalificirani upit ili prijavu projekta.
stats:
  - value: GA PDF
    label: Besplatno preuzimanje
    detail: Opći raspored po modelu
  - value: DXF/DWG
    label: Pristup osnovnoj verziji
    detail: CAD 2D za razinu planiranja
  - value: STEP/IGES
    label: Prijava projekta
    detail: 3D model za integraciju
  - value: NDA Samo
    label: Strukturni crteži
    detail: Laminacija trupa, podaci o kalupima
content_tiers:
  tagline: Razine preuzimanja
  title: Četiri razine pristupa<br />— Pravi detalj za odgovarajuću fazu
  subtitle: Nudimo crteže za razinu nabave, a ne datoteke za proizvodnju. Svaka razina odgovara različitoj fazi projekta.
  items:
    - title: Razina 1 — Javni PDF
      description: Opći raspored (GA), crtež dimenzija u 4 prikaza i raspored palube u PDF formatu. Dostupno za besplatno preuzimanje. Dovoljno za planiranje projekta, raspodjelu prostora i preliminarni pregled specifikacija.
      icon: tabler:file-type-pdf
    - title: Razina 2 — Osnovni DXF/DWG
      description: 2D CAD datoteke (DXF ili DWG) za integraciju tlocrtnih planova. Zahtijeva kratki upitnik (naziv tvrtke, vrsta projekta, namjena upotrebe). Nema uključenih strukturnih ili proizvodnih podataka.
      icon: tabler:file-code
    - title: Razina 3 — Prijava projekta STEP/IGES
      description: 3D model datoteke (STEP ili IGES) za integraciju sustava, dizajn opreme ili koordinaciju brodogradnje. Potrebna je prijava projekta s opsegom, rokovima i namjerom kupnje. Podložno odobrenju.
      icon: tabler:cube
    - title: Razina 4 — NDA Inženjering
      description: Strukturni crteži trupa, rasporedi laminacije, proširenja rezanja cijevi i podaci o kalupima. Dostupno samo putem NDA uz potvrđene narudžbe. To su datoteke za razinu proizvodnje — nisu za javnu distribuciju.
      icon: tabler:lock
content_included:
  tagline: Što je uključeno
  title: Sadržaj crteža<br />Po modelu
  subtitle: Svaki model ima standardni paket crteža koji pokriva osnovne informacije za planiranje za kupce i projektne inženjere B2B.
  items:
    - title: Opći raspored (GA)
      description: Bočni prikaz, pogled odozgo i presjek prikazuju oblik trupa, položaj cijevi, lokaciju konzole, sjedenje, sustav goriva i ključne dimenzije (UK, širina, promjer cijevi, kut trupa). Status revizije i autorska prava zabilježeni su u naslovnom bloku.
      icon: tabler:layout
    - title: 4-prikazni dimenzijski crtež
      description: Pogledi sa strane, sprijeda, straga i odozgo s ukupnim dimenzijama za planiranje transporta (visina na prikolici, širina za kontejner, težina za podizanje). Uključuje operativne i transportne konfiguracije.
      icon: tabler:ruler-2
    - title: Raspored palube i plan opreme
      description: Pogled na palubu odozgo prikazuje osnovu konzole, položaje sjedala, mjesta D-prstena, položaje navigacijskih svjetala, pristup pumpi za potpalje, odjeljak za bateriju/gorivo i točke za montažu opreme. Ograničena preciznost na vlasničkim sučeljima.
      icon: tabler:map
    - title: Crtež transporta i pakiranja
      description: Plan utovara kontejnera, dimenzije kolijevke, raspodjela težine i položaji točaka dizanja za planiranje logistike. Uključuje standardne i prilagođene opcije pakiranja.
      icon: tabler:truck
content_protection:
  tagline: Zaštita intelektualnog vlasništva
  title: Što ne dijelimo<br />& Zašto
  subtitle: Zaštita našeg inženjerskog intelektualnog vlasništva osigurava da možemo nastaviti ulagati u istraživanje i razvoj, a istovremeno pružati sve što kupci trebaju za planiranje projekata.
  items:
    - title: Podaci jezgre kalupa trupa
      description: Geometrija kalupa i utikača, CNC putanje alata i predlošci laminacije su vlasnička proizvodna sredstva. Ne dijele se na bilo kojoj razini pristupa izvan potvrđenih NDA ugovora.
      icon: tabler:ban
    - title: Proširenja za rezanje cijevi
      description: Datoteke za rezanje ravnog uzorka za tkaninu cijevi su podaci na razini proizvodnje. Dostupne su samo pod NDA uz potvrđene proizvodne narudžbe i dijele se samo s ugovornom stranom.
      icon: tabler:ban
    - title: Strukturni proračuni
      description: Detaljna analiza naprezanja, rezultati FEA i rasporedi laminata su dokumenti osjetljivi na usklađenost koji se dijele samo s Obaviještenim tijelima i klijentima vezanim uz NDA tijekom procesa ocjene sukladnosti.
      icon: tabler:ban
    - title: Pregled konkurenata
      description: Zadržavamo pravo odbiti zahtjeve za pristup CAD-u koji izgleda da dolaze od konkurenata, studenata bez konteksta projekta ili strana bez legitimne namjere nabave.
      icon: tabler:shield
content_models:
  tagline: Dostupni modeli
  title: Tehnički crtež<br />Dostupnost po modelu
  subtitle: GA PDF preuzimanja dostupna su za naše glavne RIB i modele napuhavanje brodova. Kontaktirajte nas za nacrte specifičnih modela koji nisu navedeni.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, trup GRP deep-V, Hypalon ili PVC cijevi, centralna konzola. Dostupni su GA, dimenzije, raspored palube i plan prijevoza. Kategorija dizajna C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP trup umjerene V, Hypalon ili PVC cijevi, bočna ili centralna konzola. Dostupni GA i dimenzije. Kategorija dizajna C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, trup od GRP-a, PVC cijevi, kormilo ili konzola. Dostupni GA i dimenzije. Kategorija dizajna C/D.
      icon: tabler:sailboat
    - title: AF380 Napuhavajući Čamac
      description: Puhatljiva gumenjak 3,8 m, aluminijski pod, PVC cijevi. Dostupne su GA i pakirne dimenzije. U skladu s EN ISO 6185.
      icon: tabler:sailboat
    - title: AF320 Napuhavajući Čamac
      description: Napuhavajući čamac od 3,2 m, podnica od zračne palube, PVC tubusi. Dostupne opće dimenzije i dimenzije pakiranja. U skladu s EN ISO 6185.
      icon: tabler:sailboat
