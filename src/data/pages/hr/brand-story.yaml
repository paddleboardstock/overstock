content_founding:
  tagline: Početak
  title: Rođeni na Obali
  subtitle: 'Aquafarer započeo je u radionici na obali u Qingdau s jednim čamcem i vizijom: graditi napuhavajuća plovila koja mogu izdržati stvarne pomorske uvjete.'
  paragraphs:
    - Godine 2012. naši osnivači vidjeli su prazninu na tržištu — većina napuhavajućih čamaca bila je ili pristupačna, ali nepouzdana, ili vrhunske kvalitete, ali izuzetno skupa. Vjerovali su da postoji prostor za proizvođača koji isporučuje i kvalitetu i vrijednost.
    - Prvi trup izrađen je ručno, testiran u lokalnim vodama i usavršen na temelju stvarnih povratnih informacija ribara i malih komercijalnih operatera. Ta povratna sprega — graditi, testirati, slušati, poboljšavati — i dalje je u središtu naše inženjerske filozofije danas.
    - Do 2015. vijest se proširila izvan Qingdaoa. Međunarodni distributeri počeli su tražiti uzorke. Ono što je započelo kao lokalna radionica postajalo je globalni dobavljač.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Rana proizvodna radionica i proizvodnja
content_growth:
  tagline: Rast i inovacije
  title: Od radionice do objekta od 12.000 m²
  subtitle: Kontinuirana ulaganja u ljude, opremu i procese pretvorila su se Aquafarer u moderan brodski proizvodni pogon.
  paragraphs:
    - Kako je potražnja rasla, rasla je i naša tvornica. Proširili smo se s male radionice na tvornicu od 12.000 m² s namjenskim proizvodnim linijama za RIB brodove, napuhivačke, SUP daske i dodatke.
    - Uložili smo CNC u strojeve za rezanje, opremu za visokofrekventno zavarivanje, proizvodne linije za drop stitch i sveobuhvatne testne uređaje — što nam omogućuje kontrolu nad svakim aspektom kvalitete proizvodnje.
    - Danas naš tim od 200-300 ljudi uključuje pomorske inženjere, znanstvenike za materijale, stručnjake za kontrolu kvalitete i vješte majstore — od kojih su mnogi s nama Aquafarer od samih početaka.
content_mission:
  tagline: Naša misija
  title: Inženjerska sloboda na vodi
  subtitle: Svaki Aquafarer proizvod dizajniran je kako bi ljudima pomogao u istraživanju, radu i napredovanju na vodi — pouzdano, sigurno i povoljno.
  list:
    - Dizajnirati plovila koja funkcioniraju u stvarnim morskim uvjetima — ne samo na papiru
    - Izgradite trajna partnerstva s distributerima i markama kroz pouzdanu OEM/ODM uslugu
    - Neprestano poboljšavajte naše proizvodne procese kako biste pružili veću vrijednost
    - Podržite svaki proizvod pravim rezervnim dijelovima i tehničkom stručnošću
