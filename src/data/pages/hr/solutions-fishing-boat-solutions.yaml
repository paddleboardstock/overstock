content_challenge:
  tagline: Izazov
  title: Potrebno za ribarske čamce<br />Stabilnost, domet i izdržljivost
  subtitle: Bez obzira upravljate li komercijalnim ribarskim plovilom, vodite li zadrugarsku flotu ili organizirate ribolovne chartere — vaš čamac mora svakodnevno pouzdano funkcionirati.
  paragraphs:
    - Ribarski čamci trebaju stabilne platforme za rad s ribolovnim linijama, rukovanje ulovom i sigurno kretanje po palubi. Napuhavajući čamci i RIBs nude inherentnu stabilnost zahvaljujući dizajnu tubusa — značajna prednost u odnosu na krute trupove slične duljine.
    - Učinkovitost goriva je važna za ribolovne operacije u kojima troškovi rada izravno utječu na profitabilnost. RIBs i napuhavajući čamci lakši su od odgovarajućih krutih čamaca, zahtijevaju manje snage i troše manje goriva — ključno za komercijalne operatore koji koriste čamce svaki dan i zadruge koje upravljaju flotom u okviru proračuna.
    - Izdržljivost u morskom okruženju je neophodna. Slana voda, UV izloženost i stalna uporaba zahtijevaju materijale koji mogu izdržati teške uvjete bez degradacije. Za komercijalne i zadružne operatore, pouzdanost izravno utječe na prihod — pokvaren čamac znači izgubljene ribolovne dane.
    - Paddle Board Overstock ribarske konfiguracije uključuju držače štapova, fishfindere, posude za mamac, žive kutije i rješenja za rukovanje teretom dizajnirana za ozbiljne ribolovne primjene u komercijalnim, zadružnim i rekreativnim operacijama.
content_solution:
  tagline: Naše rješenje
  title: Ribolovu spremne konfiguracije
  subtitle: Svaki Paddle Board Overstock ribarski čamac može se konfigurirati za vašu specifičnu ribolovnu primjenu.
  list:
    - Montaža držača štapova — tvornički ugrađena ili pripremljena za naknadnu instalaciju
    - Montažna ploča za fishfinder/GPS na konzolnoj poziciji
    - Opcije posude za mamac ili žive kutije za charter i komercijalne operatore
    - Konfiguracije za hladnjak/skladištenje za rukovanje ulovom
    - Deep-V trup za mogućnost plovidbe na otvorenom moru — stabilan u mirovanju, glatka vožnja pri brzini
    - PVC ili Hypalon opcije cijevi — Hypalon za UV produženu ekspoziciju
    - Vanbrodski motori u rasponu od 15 HP do 115, HP ovisno o modelu i primjeni
content_segments:
  tagline: Ribolovni profili
  title: Rješenja za napuhavajuće ribarski čamce<br />Prema tipu operatora
  subtitle: Od priobalnog sportskog ribolova do komercijalnog longlininga — različite ribolovne operacije zahtijevaju različite konfiguracije trupa, raspon snage i postavke na palubi. Svaki brod prilagođavamo ribarstvu, vodama i stilu rada.
  items:
    - title: Komercijalne ribarske tvrtke
      subtitle: Flotni radni brodovi za svakodnevne ribolovne operacije, rukovanje mrežama, prijevoz ulova
      description: Komercijalne ribarske tvrtke upravljaju radnim brodovima za postavljanje i izvlačenje mreža, servisiranje zamki, postavljanje dugih linija i prijevoz ulova. Ovi brodovi svakodnevno rade u slanim vodama i moraju izdržati teška opterećenja, stalno rukovanje palubom i duge radne sate. Učinkovitost goriva i niska razina održavanja ključni su za profitabilnost flote. Plovilo mora osigurati stabilne radne platforme za opremu za rukovanje posadom i ulov u različitim morskim uvjetima.
      features:
        - Raspored ravne palube za rukovanje mrežama, slaganje zamki i skladištenje ribe
        - Štedljivi 40-115 HP vanbrodski motor za niske dnevne troškove rada
        - Hypalon Teške cijevi za otpornost na habanje u svakodnevnoj upotrebi
        - Ojačane trake za trljanje radi čestog kontakta s dokom i plovilom
        - Paluba s automatskim odvodom za jednostavno pranje nakon operacija
        - Cijene flote i dosljedne specifikacije za operatere s više plovila
    - title: Operateri čarter ribolova
      subtitle: Udobnost za više putnika, upravljanje hvatanjem, sigurnosna certifikacija
      description: Operateri organiziraju poludnevne i cjelodnevne ribolovne čartere — od ribolova na priobalnim grebenima do ribolova na dnu na moru. Vaš brod treba sjedala za putnike s certifikatima sigurnosti, dovoljno prostora na palubi za više ribolovaca i integrirane livewellove za održavanje mamca i ulova svježim tijekom cijelog putovanja. Udobnost gostiju izravno utječe na recenzije putovanja, ponovne rezervacije i online ocjene.
      features:
        - Upravljač na konzoli s amortizirajućim sportskim sjedalima
        - Tvornički ugrađeni držači štapova (4–8 pozicija)
        - 60–115 HP izvanbrodskih dometa za brzine krstarenja na moru
        - CE Certifikacija kategorije C ili B za komercijalne putničke operacije
        - Bimini ili T-top sjenilo za udobnost gostiju na dužim putovanjima
    - title: Zanatski i mali komercijalni ribolovci
      subtitle: Pouzdani radni brodovi za svakodnevni život
      description: Neovisni ribari koji se oslanjaju na svoj brod kao glavni izvor prihoda — postavljanje mreža, održavanje zamki za ribu ili ručno nošenje riba blizu obale. Vaš prioritet je ekonomičnost goriva, jednostavno održavanje koje možete sami obaviti i brod koji podnosi umjerene količine ulova i opreme bez žrtvovanja stabilnosti.
      features:
        - Štedljivi 15–40 HP vanbrodski motor za niske operativne troškove
        - Hypalon CSM cijevi za UV produženu i otpornost na habanje
        - Raspored ravne palube za rukovanje mrežama i skladištenje ribe
        - Jednostavna sposobnost slijetanja na plažu s napuhavajućom zaštitom kobilice
    - title: Ribarske zadruge
      subtitle: Prikupljanje ulova, prijevoz članova, distribucija zaliha
      description: Ribarske zadruge upravljaju flotama temeljenim na zajednici za prikupljanje ulova od članova ribara, prijevoz zaliha u udaljene ribarske zajednice i distribuciju ulova na tržnicama. Ovi radni brodovi zahtijevaju veliku nosivost, pouzdan svakodnevni rad i jednostavno održavanje na udaljenim lokacijama. Zadruge često djeluju u zemljama u razvoju gdje su dostupnost dijelova i servisa ograničeni, što čini jednostavne izvanbrodske konfiguracije i izdržljivu konstrukciju nužnima.
      features:
        - Velika nosivost za prijevoz ulova i zaliha
        - Jednostavna vanbrodska konfiguracija za lak servis na licu mjesta
        - Teška vozila PVC ili Hypalon građevinarstvo radi fleksibilnosti proračuna
        - Ravna paluba s točkama za pričvršćivanje tereta
        - Energetski učinkovit rad koji minimizira operativne troškove kooperative
    - title: Ljubitelji sportskog i sportskog ribolova
      subtitle: Performanse i stil za ozbiljne ribolovce
      description: Iskusni ribolovci traže sposobnu ribolovnu platformu koja omogućuje brzinu do udaljenih područja, stabilne borbene položaje i vrhunsku udobnost. Brod se mora osjećati kao kod kuće, bilo da plovi dvije milje od obale do grebena ili istražuje udaljene estuarijske zabačene vode.
      features:
        - RIB Deep-V trup za glatku vožnju u valovitim uvjetima
        - Fishfinder/GPS montažna ploča unaprijed ožičena na konzoli
        - Baitwell i hladnjak integrirani u stražnji modul sjedala
        - EVA Prilagođene opcije boja palube koje odgovaraju grafikama brodova/cijevi
    - title: Vodič za ribolov i ekoturistički operateri
      subtitle: Vođena ribolovna iskustva za posjetitelje
      description: Vodiči koji vode male grupe posjetiteljskih ribolovaca na produktivna ribolovna mjesta — često kombinirajući ribolov s elementima ekoturizma poput promatranja ptica ili istraživanja mangrova. Brod mora ploviti suh i udoban za goste koji nisu navikli na male brodove, s jednostavnim ukrcavanjem i opcijama hlada.
      features:
        - Montažne točke za Bimini vrh ili T-vrh tvornički ugrađene
        - Glatka ulazna ljestve za ukrcaj radi lakšeg ponovnog ukrcaja
        - Tihi četverotaktni vanbrodski motor radi smanjenja smetnji
        - Suhi spremišta za gostujuće telefone, novčanike, kamere
