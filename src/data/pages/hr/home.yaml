faqs:
  title: SUP Često postavljana pitanja o naručivanju i proizvodima
  subtitle: Česta pitanja o našim SUP rasprodajnim pločama, narudžbi, plaćanju, dostavi i jamstvu.
  columns: 2
  items:
    - title: Je li SUP teško naučiti?
      description: Nimalo. Većina početnika ustane i vesla već u prvoj sesiji. Naše SUP daske za sve imaju ekstra široke stabilne platforme dizajnirane posebno za početnike. Počnite na mirnoj vodi i za nekoliko minuta ćete krstariti.
      icon: tabler:swimming
      category: sup
    - title: Koja je granica težine?
      description: Naša SUPs sveobuhvatna podrška do 220 lbs, a platforme za touring i jogu do 250 lbs. Svaka stranica proizvoda navodi točnu težinu vozača kako biste mogli prilagoditi dasku svojim potrebama.
      icon: tabler:adjustments
      category: sup
    - title: Mogu li putovati s gumenjakom SUP?
      description: Apsolutno. Paddle Board Overstock Svaka daska se pakira u torbu veličine ruksaka. Sa samo 18-22 lbs, lako ju je nositi do plaže, jezera ili kroz aerodromske terminale. Prije putovanja provjerite pravila o prtljazi u zrakoplovu.
      icon: tabler:truck-delivery
      category: sup
    - title: Što dolazi u kutiji?
      description: Svaki Paddle Board Overstock SUP uključuje dasku, putni ruksak, ručnu pumpu, podesivu lopaticu, uklonjivu peraju, povodac za zavojnicu i komplet za popravak.
      icon: tabler:clipboard-list
      category: sup
    - title: Zašto su vaše cijene niže od maloprodajnih?
      description: Prodajemo višak zaliha iz tvornice i serije na rasprodaji izravno iz naše proizvodne jedinice u Weihaiu, Kina — bez posrednika, bez maloprodajne marže. To znači potpune SUP pakete s popustom do 60% u odnosu na uobičajene maloprodajne cijene, uz istu CE certificiranu kvalitetu.
      icon: tabler:certificate
      category: orders
    - title: Kako mogu naručiti i platiti?
      description: Dodajte svoj SUP paket u košaricu i sigurno dovršite kupnju putem Stripea ili PayPala. Prihvaćamo sve glavne kreditne i debitne kartice. Svaka narudžba se potvrđuje e-mailom s punom fakturom.
      icon: tabler:file-text
      category: orders
    - title: Šaljete li širom svijeta?
      description: Da. Dostavljamo u 50+ zemalja diljem EU-a, Sjeverne Amerike, Azijsko-pacifičkog područja, Bliskog istoka i Afrike. Narudžbe koje su na skladištu obično se šalju unutar 2-3 radna dana uz praćenje koje je dostupno za svaki paket.
      icon: tabler:route
      category: orders
    - title: Koje jamstvo uključuju SUP ploče?
      description: 'Svaka SUP daska i dodatak ima dvogodišnje jamstvo — uključujući samu dasku, drop-stitch šavove i ventile za napuhavanje. Zahtjevi se rješavaju u danima, a ne tjednima: podnesite online i mi ćemo popraviti ili zamijeniti.'
      icon: tabler:lifebuoy
      category: orders
