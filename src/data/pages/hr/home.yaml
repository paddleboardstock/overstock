features:
  id: features
  tagline: Zašto kupovati Paddle Board Overstock
  title: Real Factory,<br />Stvarne uštede
  subtitle: Paketi za višak i rasprodaju izravno iz tvornice SUP — certificirana kvaliteta bez maloprodajne marže.
  columns: 2
  items:
    - title: Do 60% popusta na maloprodaju
      description: Prodajemo tvorničke zalihe i serije rasprodaje izravno — bez posrednika, bez maloprodajne marže. Iste ploče koje se prodaju po punoj cijeni drugdje, po rasprodajnim cijenama ovdje.
      icon: tabler:rocket
    - title: Kompletni paketi
      description: 'Svaki SUP dolazi kao kompletan paket: daska, putni ruksak, ručna pumpa, podesiva lopatica, uklonjiva pera, povodac za zavojnicu i komplet za popravak.'
      icon: tabler:clipboard-list
    - title: Certificirana kvaliteta
      description: 13 CE-certificirani SUP modeli prema primjenjivim EU direktivama. Svaka ploča se 100% testira na tlak od 1,25x nominalnog PSI prije isporuke. Stopa besprijekornosti od 99,3% prema AQL 2,5.
      icon: tabler:certificate
    - title: Ne MOQ — Ploča Naredbe Jedan
      description: Rasprodaja viška zaliha znači da su narudžbe po jedinicama dobrodošle. Dodaj ploču u košaricu, naplata je gotova. Nema minimalne narudžbe, nema procesa ponude.
      icon: tabler:adjustments
    - title: Brza svjetska dostava
      description: Narudžbe na skladištu iz Weihaija šalju se unutar 2-3 radna dana. Praćenje isporuke u 50+ zemalja EU, Sjeverne Amerike, Azijsko-pacifičke regije i šire.
      icon: tabler:truck-delivery
    - title: 2-godišnje SUP Jamstvo
      description: SUP Svaka daska i dodatak pokriveni su na 2 godine — drop-stitch uključujući šavove, ventile za napuhavanje i dodatke. Zahtjevi se rješavaju u danima, a ne tjednima.
      icon: tabler:lifebuoy
