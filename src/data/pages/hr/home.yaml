content_customer_types:
  tagline: Kome služimo
  title: Izgrađeno za B2B kupce<br />— Ne maloprodajni kupci
  subtitle: Aquafarer proizvodi za četiri vrste kupaca. Svaka ima različite prioritete, i mi se njima svima bavimo.
  items:
    - title: Vlasnici marki / Privatna marka
      description: Dizajn prilagođenog proizvoda, grafike privatne robne marke, dokumentacija o usklađenosti pod vašom markom i posvećena inženjerska podrška od koncepta do kontejnera.
      icon: tabler:palette
      cta: Zahtjev OEM/ODM Ponuda
      cta_href: /request-quotation
    - title: Distributeri / veletrgovci
      description: Zaštita teritorija, konkurentne veleprodajne cijene, marketinški paketi podrške, obuka o proizvodima i potpuna dokumentacija usklađenosti za vaše tržište.
      icon: tabler:world
      cta: Prijavite se za salon
      cta_href: /dealers-distributors
    - title: Odmarališta / Operateri najma
      description: Komercijalna izdržljivost, savjeti o veličini voznog parka, narudžbe kontejnera za mješovite modele, strategija rezervnih dijelova i paketi opreme s brendom resorta.
      icon: tabler:beach
      cta: Nabavite komercijalni paket
      cta_href: /solutions/resorts
    - title: Spašavanje / Vlada / Profesionalno
      description: Hypalon/CSM građevinarstvo, SOLAS opcije usklađenosti, certifikacija specifična za projekte, podrška dokumentaciji natječaja i NDA-zaštićeno inženjerstvo.
      icon: tabler:shield
      cta: Rasprava o projektu
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Mogućnosti
  title: Što ti dobiješ<br />Aquafarers
  subtitle: Izravan pristup tvornici s potpunom inženjerskom, kvalitetnom i usklađenom podrškom — nije trgovačka tvrtka.
  columns: 2
  items:
    - title: OEM/ODM Prilagodba
      description: Prilagođeni dizajn trupa, materijal cijevi (PVCili Hypalon/CSM), raspored konzole, sjedala, brendiranje, boje i pakiranje. Od manjih preinaka do potpunog prilagođenog inženjeringa.
      icon: tabler:adjustments
    - title: NiskoMOQ, brzo uzorkovanje
      description: 'RIB: 2-5 jedinica (postojeći kalup). SUP: 5-10 jedinica po SKU. Prilagođeni kalupi: 200+ jedinica. Predprodukcijski uzorci s vašim brendiranjem u roku od 7-14 dana.'
      icon: tabler:rocket
    - title: Kvaliteta spremna za proizvodnju
      description: Svaka jedinica testirana tlakom na 1,25x, ocijenjena PSI na 24-48 sati. 99,3% stopa bez defekta na AQL 2,5 / ISO 2859. Popis kvalitete od 100 bodova po trupu.
      icon: tabler:certificate
    - title: Potpuna dokumentacija o usklađenosti
      description: CE prema 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI društvena revizija, REACH usklađenost, UKCA označavanje. Uključeni su podaci o DoC i pločama proizvođača specifični za model.
      icon: tabler:file-certificate
    - title: Rok isporuke od 30-45 dana
      description: Standardna proizvodnja 30-45 dana FOB Qingdao. Prototipovi 7-14 dana. Dostupna hitna proizvodnja. Planovi utovara kontejnera i ISPM-15 sanduci uključeni.
      icon: tabler:truck-delivery
    - title: Naknadna prodaja i rezervni dijelovi
      description: 5 godina jamstva na brodove/kajaka/RIBs, 2 godine na SUP/dodatak. Isporuka rezervnih dijelova s prioritetnom dostavom. Podrška za obradu jamstvenih zahtjeva.
      icon: tabler:lifebuoy
content_categories:
  tagline: Kategorije proizvoda
  title: 5 kategorija,<br />64 CE- certificirani modeli
  subtitle: Od tendera od 2,4 m RIB do dasaka visine 15 stopa SUP — sve proizvedeno u ISO našem pogonu u Qingdao 9001.
  items:
    - title: RIB Čamci
      description: 2,4 m do 7,0 m s aluminijskim ili GRP trupovima. PVC ili Hypalon/CSM tubusi. CE prema 2013/53/EU. Patrolne, ronilačke, spasilačke i komercijalne konfiguracije.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Gumeni čamci
      description: 2,0 m do 5,0 m s aluminijskim podom, drvenim podom ili opcijama zračnog poda. Modeli za ribolov, rekreaciju i pomoćne čamce.
      icon: tabler:sailboat
      link: /products
    - title: SUP Daske
      description: 9 ft do 15 ft u 4-inch i 6-inch Drop-Stitch. Sveobuhvatni, touring, joga i modeli za ribolov. Dostupni su i modeli komercijalne kvalitete.
      icon: tabler:swimming
      link: /products
    - title: Kajaci
      description: Gumeni kajaci za 1 do 3 osobe. Rekreativni i touring modeli s Drop-Stitch opcijama poda.
      icon: tabler:kayak
      link: /products
    - title: Sigurnosni dodaci
      description: CE-certificirani prsluci za spašavanje, bacalne užadi, setovi za popravak, pumpe i navigacijska svjetla. USCG Tip III/V odobreni PFD-ovi.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Snaga tvornice
  title: Proizvodnja spremna za reviziju<br />u Qingdau
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO 9001 Pogon — Pravi proizvođač, ne trgovačko društvo</h3>
  items:
    - title: 6 posvećenih proizvodnih linija
      description: Odvojene RIB, gumeni čamac, SUP, kajak, sigurnosna oprema, i OEM/ODM linije. Svaka s posvećenim kontrolnim točkama QC i planiranjem proizvodnje.
    - title: 100% Testirano pod pritiskom
      description: Svaka zračna komora napunjena do 1,25x nazivne PSI i zadržana 24–48 sati. Rezultati testova povezani s serijskim brojem trupa (HIN).
    - title: Praćenje po trupu
      description: 'Proizvodni zapisi po HIN razini s 21+ podatkovna polja po trupu: serija materijala, ID zavarivača, rezultat testiranja tlaka, konačna konfiguracija i odredište dostave.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12.000 m² ISO 9001 proizvodni pogon u Qingdau s RIB proizvodnim linijama
content_compliance:
  tagline: Dokaz usklađenosti i kvalitete
  title: Dokumentirani dokazi,<br />ne samo tvrdnje
  subtitle: Svaka tvrdnja o usklađenosti potkrijepljena model-specifičnom dokumentacijom dostupnom za vašu provjeru.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Sustav upravljanja kvalitetom certificiran od strane TÜV Rheinland/SGS. Godišnji nadzorni auditi. Dokumentirani QC procesi od dolaznog materijala do otpreme.
      icon: tabler:certificate
    - title: CE prema 2013/53/EU (RCD)
      description: 64 modela s model-specifičnim Izjavama o sukladnosti. Procjena sukladnosti prema primjenjivim modulima. Registracija HIN-a i podaci s pločice proizvođača za svaki trup.
      icon: tabler:file-certificate
    - title: BSCI Socijalna usklađenost
      description: BSCI Godišnja revizija od SGSstrane . Potvrđene etičke radne prakse, sigurnost na radu i upravljanje okolišem u našem objektu.
      icon: tabler:users
    - title: REACH UKCA&
      description: Svi PVC i ljepljivi materijali u skladu su REACH s EU regulativom.UKCA Oznaka dostupna za britansko tržište. Sigurnosno pakiranje materijala na zahtjev.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proces — Od podneska do kontejnera
  items:
    - title: Korak 1:<span class="font-medium">Zahtjevi</span>
      description: Podijelite specifikacije proizvoda, ciljno tržište, količinu i zahtjeve usklađenosti. Naš inženjerski tim pregleda u roku od 48 sati.
      icon: tabler:file-text
    - title: Korak 2:<span class="font-medium">Prijedlog</span>
      description: Primite detaljnu ponudu sa specifikacijama, opcijama materijala, MOQcijenama, rokovima isporuke i opsegom usklađenosti za vaše tržište.
      icon: tabler:clipboard-list
    - title: Korak 3:<span class="font-medium">Prototip</span>
      description: Predprodukcijski uzorak s vašim brendiranjem za 7-14 dana. Potpuno testiranje kvalitete na tlaku od 1,25x. Trošak uzorka priznat za proizvodnju.
      icon: tabler:settings
    - title: Korak 4:<span class="font-medium">Produkcija</span>
      description: 30-45 dana proizvodnje FOB Qingdao nakon odobrenja uzorka. Kontrolne točke kontrole kvalitete u procesu, ispitivanje tlaka i završna inspekcija od 100 točaka na svakoj jedinici.
      icon: tabler:building-factory
    - title: Korak 5:<span class="font-medium">Isporuka</span>
      description: Plan utovara kontejnera, ISPM-15 drveni sanduk, paket dokumentacije o usklađenosti i FOB pošiljka Qingdao s punom izvoznom dokumentacijom.
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer OEM/ODM Proces proizvodnje napuhavajućih čamaca od dizajna do kontejnerskog transporta
blog_latest:
  title: Industrija i tehnički uvidi
  information: |
    RCD vodiči za usklađenost, OEM/ODM procesni članci, usporedbe materijala,
    i resurse za inspekciju tvornica od Aquafarer strane inženjerskog tima.
faqs:
  title: B2B Često postavljana pitanja o nabavi
  subtitle: Česta pitanja od brendova, distributera i komercijalnih operatera o OEMODM / proizvodnji s Aquafarer.
  columns: 2
  items:
    - title: Jeste li proizvođač ili trgovačka tvrtka?
      description: Mi smo vertikalno integrirana tvornica s potpunom kontrolom nad kvalitetom, materijalima i rokovima isporuke. Poslovna licenca i opseg proizvodnje mogu se provjeriti tijekom revizije tvornice.
      icon: tabler:building-factory
      category: all
    - title: Koji je OEMODM tvoj / proces?
      description: Pregled zahtjeva (48 sati) do prijedloga za prototip (7-14 dana) do proizvodnje (30-45 dana FOB Qingdao). Potpuna inženjerska podrška, dokumentacija usklađenosti i praćenje po trupu tijekom cijelog procesa.
      icon: tabler:route
      category: all
    - title: MOQ Koji su tvoji zahtjevi?
      description: 'RIB brodovi: 2-5 jedinica po modelu (postojeći kalup), 200+ za prilagođene kalupe. SUP daske: 5-10 jedinica po SKU. Dostupne narudžbe kontejnera s mješovitim modelima. Uzorci se naručuju u količini od 2-5 jedinica za procjenu.'
      icon: tabler:sort-ascending
      category: all
    - title: Koje mogućnosti prilagodbe su dostupne?
      description: Dizajn trupa, materijal cijevi (PVC ili Hypalon/CSM), promjer cijevi, raspored konzole, sjedenje, upravljanje, sustav goriva, raspored palube, boje brenda, grafika logotipa, dizajn podloge EVA, maloprodajno pakiranje i brendiranje korisničkog priručnika.
      icon: tabler:adjustments
      category: all
    - title: Koje dokumente o usklađenosti možete osigurati za moje tržište?
      description: CE DoC prema 2013/53/EU, UKCA označavanje, ISO ISO 9001 certifikat (SGS), BSCI izvještaj o reviziji, REACH usklađenost, izvještaji o ispitivanju materijala, zapisi o ispitivanju tlaka i podaci o pločici proizvođača specifični za model. Dokumentacija specifična za tržište na zahtjev.
      icon: tabler:file-certificate
      category: all
    - title: Koje je vrijeme izrade uzorka i proizvodnje?
      description: 'Uzorci prije proizvodnje: 7-14 radnih dana. Standardna proizvodnja: 30-45 dana FOB Qingdao. Hitna proizvodnja dostupna uz dodatni trošak. Sezona vrhunca (ožujak-lipanj) može produžiti rokove isporuke.'
      icon: tabler:clock
      category: all
    - title: Mogu li dogovoriti inspekciju tvornice ili obilazak uživo putem video prijenosa?
      description: Da. Inspekcije tvornice na licu mjesta u našoj tvornici u Qingdau dobrodošle su uz najavu od 3-5 dana. Video ture uživo putem WhatsAppa/Zooma dostupne su odmah. Inspekcije trećih strana (SGS, BV, TÜV) su omogućene.
      icon: tabler:video
      category: all
    - title: Koje se inspekcije kvalitete provode prije otpreme?
      description: Test zadržavanja tlaka ocijenjenog na 1,25x (24-48h), test ljuštenja šava, kontrolni popis završne inspekcije od 100 točaka, provjera dimenzija, kozmetička inspekcija, provjera dokumentacije o usklađenosti i provjera integriteta pakiranja. Sve prema postupcima ISO 9001.
      icon: tabler:clipboard-check
      category: all
