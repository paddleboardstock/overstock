content_workshop:
  isReversed: true
  tagline: Snaga tvornice
  title: Zašto su naše cijene rasprodaje<br />prave
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Prava tvornica, prava ušteda — svaka daska se šalje iz našeg postrojenja u Weihaiu</h3>
  items:
    - title: Iste proizvodne linije kao kod velikih marki
      description: Naša tvornica u Weihaiu od 12.000 m² izrađuje daske za međunarodne brendove i naše vlastite viškove na istim linijama s istim materijalima.
    - title: 100% Testirano pod pritiskom
      description: Svaka se daska napuhuje do 1,25x nazivne PSI i drži prije isporuke. 99,3% bez defekata po AQL 2,5 / ISO 2859.
    - title: Bez posrednika
      description: Daske se šalju direktno iz tvornice na vaša vrata. Nema dodatka distributera, nema maloprodajnog dodatka — tako cijene rasprodaje ostaju do 60% niže od maloprodajne.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Tvornica u Weihaiu od 12.000 m² s proizvodnim linijama za napuhive SUP
content_compliance:
  tagline: Dokaz usklađenosti i kvalitete
  title: Certificirana kvaliteta,<br />Dokumentirano
  subtitle: Svaka tvrdnja o usklađenosti podržana je certifikatima i dokumentacijom specifičnom za model dostupnom za vašu provjeru.
  items:
    - title: ISO 9001:2015
      description: Sustav upravljanja kvalitetom certificiran od strane TÜV Rheinland/SGS. Godišnji nadzorni auditi. Dokumentirani QC procesi od dolaznog materijala do otpreme.
      icon: tabler:certificate
    - title: CE Certificirano
      description: 13 CE-certificiranih SUP modela po važećim EU direktivama, svaki s Deklaracijom o sukladnosti specifičnom za model i podacima s pločice proizvođača.
      icon: tabler:file-certificate
    - title: REACH UKCA&
      description: Svi PVC i ljepila materijali su u skladu s EU REACH regulativom. UKCA oznaka dostupna za tržište UK-a. Sigurnosni listovi materijala dostupni na zahtjev.
      icon: tabler:shield-check
    - title: 2-godišnje SUP Jamstvo
      description: Svaka SUP daska i dodatak pokriveni su 2 godine — drop-stitch šavovi, ventil za napuhavanje i dodaci uključeni. Zahtjevi se rješavaju brzo.
      icon: tabler:lifebuoy
steps:
  title: Od naplate do vode — Kako vaša narudžba šalje
  items:
    - title: Korak 1:<span class="font-medium">Odaberite svoju ploču</span>
      description: Birajte između univerzalnih, turističkih, joga i dječjih modela. Naši vodiči za kupnju pomažu vam uskladiti veličinu i stil daske s vašim veslanjem.
      icon: tabler:clipboard-list
    - title: Korak 2:<span class="font-medium">Sigurna odjava</span>
      description: Plaćajte sigurno putem Stripea ili PayPal-a. Sve glavne kreditne i debitne kartice su prihvaćene. Nije potreban račun — potvrda o narudžbi stiže u vaš inbox.
      icon: tabler:file-text
    - title: Korak 3:<span class="font-medium">Inspekcija kvalitete</span>
      description: Svaka ploča je 100% testirana pod tlakom na 1,25x PSI i provjerava se prema punom popisu kvalitete prije pakiranja.
      icon: tabler:settings
    - title: Korak 4:<span class="font-medium">Fast Dispatch</span>
      description: Narudžbe na skladištu šalju se iz naše tvornice u Weihaiju u roku od 2-3 radna dana. Za hitne narudžbe dostupno je rukovanje hitnim narudžbama.
      icon: tabler:building-factory
    - title: Korak 5:<span class="font-medium">Praćena dostava</span>
      description: Pratio sam pošiljke širom svijeta u 50+ zemalja. Vaše dvogodišnje jamstvo i brza postprodajna podrška počinju onog dana kada vaša ploča stigne.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Proces narudžbe od sigurne naplate do praćene globalne dostave
