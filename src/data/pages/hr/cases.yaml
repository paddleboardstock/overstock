features3_cases:
  tagline: Istaknuti slučajevi
  title: Prilagođena rješenja<br />Za prave izazove
  isBeforeContent: false
  columns: 3
  items:
    - title: Dnevna nadogradnja rada Bali ronilačkog centra
      customer: Ronilački centar Blue Ocean
      country: Indonezija
      industry: Komercijalni ronilački centar
      challenge: Blue Ocean Diving Center na Baliju upravljao je starijim ronilačkim brodom od stakloplastike s ograničenim prostorom na palubi, teškim ukrcavanjem ronioca i visokim održavanjem u tropskim morskim uvjetima. Utovar opreme bio je prenatrpan, vrijeme pripreme dugo, a nestabilna platforma stvarala je sigurnosne probleme za međunarodne turiste — uključujući ronioce početnike i starije putnike. Centar organizira 3-5 ronilačkih izleta dnevno, 200+ dana godišnje.
      solution: Paddle Board Overstock isporučivao je prilagođeni 6,8 m Professional Diving s RIB proširenim rasporedom palube optimiziranim za skladištenje ronilačke opreme, širokim nehrđajućim čeličnim ronilačkim ljestvama, Hypalon teškim cijevima za UV otpornost na slanu vodu, nekliznom površinom palube i rješenjem za skladištenje spremnika. Konfiguracija je dizajnirana prema svakodnevnom radnom toku ronilačkog centra — nije se temeljila na standardnom rasporedu rekreativnog broda.
      product: 6,8 m Profesionalni skokovi RIBu vodu
      results: Veći radni prostor poboljšao je učinkovitost pripreme opreme. Ronioci su doživjeli sigurnije i lakše ukrcaj. Zahtjevi za održavanjem znatno su smanjeni. Centar je s većim povjerenjem dobio kapacitet za rukovanje većim brojem kupaca tijekom vrhunca sezone. RIB Centar je postao temelj svakodnevnih ronilačkih operacija.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Naš ronilački brod nije samo prijevoz. On je temelj našeg svakodnevnog rada.Paddle Board Overstock RIB Daje našem timu više samopouzdanja kada organiziramo više ronilačkih izleta svaki dan.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center RIB Profesionalna nadogradnja
      customer: Ocean Explorer ronilački centar
      country: Tajland
      industry: Komercijalni ronilački centar
      challenge: Ronilački centar Ocean Explorer u Phuketu, Tajland, morao je nadograditi tradicionalni ronilački brod od stakloplastike koji nije mogao zadovoljiti rastuću potražnju kupaca. Ograničen prostor na palubi činio je pripremu opreme neučinkovitom. Teško ukrcavanje stvaralo je sigurnosne izazove za međunarodne turiste. Visoki zahtjevi za održavanjem u tropskim morskim uvjetima povećavali su operativne troškove. Centar obavlja više dnevnih putovanja, 200+ dana u godini.
      solution: Paddle Board Overstock isporučio je prilagođeni 6,8 m komercijalni ronilački brod RIB s optimiziranim radnim rasporedom palube za skladištenje boca za ronjenje, pripremu opreme i kretanje ronilaca. Značajke su uključivale široke ronilačke ljestve s rukohvatima od nehrđajućeg čelika, konstrukciju od čvrstih cijevi s UVotpornim materijalima, pod protiv klizanja, rješenje za skladištenje spremnika, profesionalnu konzolu i sjedala za putnike — sve konfigurirano za komercijalne ronilačke operacije.
      product: 6,8 m Komercijalno skakanje RIBu vodu
      results: Veća površina palube omogućila je bržu organizaciju opreme i učinkovitiji svakodnevni rad. Udobnost i sigurnost ukrcaja kupaca znatno su se poboljšali. Vrijeme održavanja smanjeno je zahvaljujući pomorskoj gradnji. Ronilački centar mogao je opsluživati više kupaca tijekom vrhunca sezone i s povjerenjem proširivati profesionalne ronilačke usluge.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Za ronilački centar, brod nije samo prijevoz. On je važan dio našeg svakodnevnog rada.Paddle Board Overstock RIB Daje našem timu samopouzdanje da svakodnevno organizira više ronilačkih izleta s boljom sigurnošću i učinkovitošću.
      icon: tabler:lifebuoy
    - title: Flota europskih ronilačkih centara
      customer: BlueMed ronilački centri
      country: Grčka
      industry: Ronjenje i morski turizam
      challenge: Bilo je potrebno 12 ronilačkih RIBs centara konfiguriranih za lanac ronilačkih centara na više grčkih otoka. Svaki brod trebao je prilagođene ronilačke ljestve, spremnik za 8 spremnika i stabilnu platformu za ulazak ronioca na otvorenoj vodi. Flota je morala stići unutar 60 dana za početak turističke sezone.
      solution: Proizvedeno je 12 RIB 520 ronilačkih modela s integriranim nosačima spremnika, ronilačkim ljestvama i ekstra Hypalon širokim cijevima za stabilnost ukrcaja. Svaki brod bio je označen bojama flote kupaca. Svih 12 brodova prošlo je tlak-testiranje i otpremljeno iz Qingdaoa unutar 55 dana.
      product: RIB 520 Dive
      results: Svih 12 brodova isporučeno je na vrijeme za turističku sezonu. Flota je u svakodnevnom radu već 18+ mjeseci bez ikakvih kvarova na materijalu. Kupac je naručio još 6 jedinica u drugoj godini.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive je okosnica naših svakodnevnih ronilačkih operacija. Stabilnost u mirovanju je izvrsna, a raspored spremnika održava palubu čistom i sigurnom za naše goste.
      icon: tabler:lifebuoy
    - title: OEM Australski program distributera
      customer: Pacific Watersports Pty Ltd
      country: Australija
      industry: OEM/ODM Proizvodnja
      challenge: Australski distributer trebao SUP je liniju ploča privatne marke po konkurentnim cijenama kako bi konkurirao kineskim brendovima za izravnu prodaju potrošačima. Zahtijevalo je 8 jedinstvenih modela od početnika do naprednih, s prilagođenom grafikom, prilagođenim pakiranjem i drop-shipping isporukom u maloprodajne objekte.
      solution: Razvijeno je 8 SUP modela (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) s ekskluzivnim australskim grafičkim paketom. Prilagođena maloprodajna pakiranja s QR kodovima koji vode do videozapisa postavljanja. Logistika dropshippinga konfigurirana iz Qingdaoa izravno u australske maloprodajne trgovine.
      product: SUP Custom linija (8 modela)
      results: Koncept do prve isporuke u roku od 90 dana. Maloprodajna stopa prodaje od 85% u prvoj sezoni. Distributer je proširio partnerstvo uključivanjem linije napuhavajućih čamaca u drugoj godini.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock Isporučili smo SUP kompletnu liniju u roku od 90 dana — od početnog dizajna do maloprodajnog prodajnog prostora. Kvaliteta odgovara markama koje prodaju po dvostruko većoj cijeni.
      icon: tabler:arrows-exchange
    - title: Bliskoistočna opskrba spasilačkim čamcima
      customer: Nacionalna uprava za civilnu zaštitu
      country: Ujedinjeni Arapski Emirati
      industry: Potraga i spašavanje
      challenge: Civilna zaštitna organizacija trebala je 20 patrolnih vozila RIBs spremnih za obalnu potragu i spašavanje, sigurnost luka i odgovor na poplave. Zahtijevali su palube koje se same iskrcavaju, potpune navigacijske sustave (GPS, radar, VHF), narančaste cijevi visoke vidljivosti i usklađenost s lokalnim pomorskim propisima.
      solution: Opskrbljeno je 20 RIB modela 450 Patrol s palubama koje se samoispuštaju, Garmin navigacijskim sustavima, LED reflektorima SOLAS , reflektirajućom trakom i Hypalon narančastim cijevima visoke vidljivosti. Svaki brod je certificiran CEi testiran prema ISO standardima 6185. Paket dokumentacije uključivao je potvrde o usklađenosti za lokalnu registraciju.
      product: RIB 450. patrola
      results: Flota raspoređena na 5 obalnih postaja. Brodovi su plovili u ekstremnoj vrućini (45°C+) bez degradacije cijevi. Domet patrola i učinkovitost goriva premašili su specifikacije za 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450. patrola premašila je naše operativne zahtjeve. U ekstremnim vrućim uvjetima Hypalon cijevi ne pokazuju znakove UV propadanja nakon 24 mjeseca svakodnevne upotrebe.
      icon: tabler:alert-triangle
    - title: OEM Europsko partnerstvo za brend
      customer: Sjevernomorska pomorska oprema BV
      country: Nizozemska
      industry: OEM/ODM Proizvodnja
      challenge: Etablirani europski pomorski brend želio se proširiti na RIB tržište bez ulaganja u proizvodne pogone. Trebao je partner s bijelom etiketom sposoban proizvesti 5 RIB modela (3,9 milijuna do 6,2 milijuna) s privatnim brendom CE , certifikacijom i ekskluzivnim EU pravima distribucije.
      solution: Uspostavljen je ugovor o proizvodnji pod bijelom etiketom za 5 RIB modela. Svaki model s logotipima kupaca i shemom boja.CE Za svaki model pripremljena je certifikacijska dokumentacija. Ekskluzivna EU distribucijska prava dodijeljena uz minimalne narudžbe. Tehnička dokumentacija i katalog rezervnih dijelova dostupni lokalnoj servisnoj mreži.
      product: RIB Custom linija (5 modela)
      results: Potpisan višegodišnji ugovor. Prva serijska serija od 50 jedinica isporučena u roku od 75 dana. Marka je predstavljena na METSTRADE-u uz pozitivan prijem kod distributera.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Suradnja Paddle Board Overstock nam je omogućila ulazak na RIB tržište bez izgradnje tvornice — isporučili su kompletno rješenje s CE certifikacijom i dokumentacijom podrške prodavača.
      icon: tabler:building
    - title: Flota karipskih odmarališta
      customer: Paradise Island Resorts Ltd
      country: Bahami
      industry: Pomorski turizam i ugostiteljstvo
      challenge: 'Luksuzno odmaralište trebalo je kompletnu flotu opreme za vodene sportove za aktivnosti gostiju: 40 SUP dasaka za vođene ture, 20 kajaka za istraživanje lagune, 10 napuhanih čamaca za prijevoz gostiju i ribolovne izlete, plus dodatke. Sva oprema zahtijevala je poseban brend resorta i morala je biti dostavljena prije vrhunca turističke sezone.'
      solution: 'Proizveo je kompletan paket vodenih sportova: 40 SUP Voyager dasaka (model All-Around), 20 Explorer kajaka, 10 AirDeck 360 napuhanih čamaca, plus PFD-ove, vesla, pumpe i kompleti za popravak. Sva oprema otisnuta s logom resorta i tropskom shemom boja. Kontejnerizirana pošiljka s kompletnim inventarom.'
      product: Kompletan paket vodenih sportova (70+ jedinica)
      results: Flota je stigla 6 tjedana prije vrhunca sezone. Ocjene zadovoljstva gostiju za vodene sportove porasle su za 40% u odnosu na prethodnu godinu. Oprema je trajala 3 sezone uz samo rutinsko održavanje.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Pristup kompletnog paketa značio je da smo u jednoj pošiljci dobili sve što nam je trebalo — daske, kajake, brodove i dodatke, sve brendirano i spremno za goste. Naši gosti obožavaju kvalitetu opreme.
      icon: tabler:beach
    - title: Nadogradnja komercijalnog ronilačkog centra Queensland RIB
      customer: Komercijalni ronilački centar
      country: Australija
      industry: Komercijalne ronilačke i pomorske usluge
      challenge: Komercijalni ronilački centar sa sjedištem u Queenslandu, specijaliziran za inspekciju pomorske infrastrukture, održavanje luka i podvodne popravke, upravljao je starim radnim brodom. Kako je potražnja za projektom rasla, stari brod postao je teret — česta održavanja uzrokovala su poremećaje u rasporedu, raspored nije bio dizajniran za moderne ronilačke operacije (ograničen prostor za boce, alate i opremu), a udobnost posade tijekom dugih operacija bila je loša. Tvrtka je trebala plovilo koje može podržavati njihove profesionalne operacije svaki radni dan.
      solution: Paddle Board Overstock provedena je detaljna operativna analiza radnog toka ronjenja korisnika, tipičnog trajanja projekta, veličine posade i zahtjeva za opremom. Na temelju ove analize, Paddle Board Overstock isporučen je prilagođeni profesionalac RIB s funkcionalnim rasporedom palube optimiziranim za pripremu opreme i kretanje ronilaca, profesionalnim sjedalima za dulje transportne periode, poboljšanom stabilnošću za sigurniji ulazak i izlazak ronioca te značajkama podrške ronjenju integriranim u dizajn.
      product: Profesionalno ronjenje RIBpo narudžbi
      results: Novi RIB je postao pouzdana platforma za svakodnevni rad. Priprema opreme postala je brža s optimiziranim rasporedom. Posada je izvijestila o poboljšanoj udobnosti i sigurnosti tijekom dugih operacija. Profesionalni izgled broda ojačao je povjerenje kupaca pri radu s operaterima luka i pomorskim izvođačima. Ronilački centar dobio je plovilo koje je odgovaralo profesionalnosti njihove usluge.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Trebali smo brod koji može podržati naše poslovanje svaki dan, a ne samo plovilo za prijevoz. Paddle Board Overstock je surađivao s nama kako bi razumio naše operativne zahtjeve i isporučio rješenje RIB koje odgovara našem komercijalnom ronilačkom tijeku rada.
      icon: tabler:lifebuoy
    - title: Ugovor o obalnoj patroli SAD-a
      customer: Agencija za sigurnost atlantske obale
      country: Sjedinjene Američke Države
      industry: Pomorska sigurnost i provođenje zakona
      challenge: Agencija za obalnu sigurnost SAD-a zahtijevala je teški ophodni brod RIBs za presretanje na otvorenim vodama. Trebala je konfiguracija s dva motora radi redundantnosti, oklopljena konzola za zaštitu posade, vojne specifikacije elektronike (kriptirana komunikacija, FLIR, radar) i usklađenost s propisima Obalne straže SAD-a.
      solution: Projektiran RIB 600 Patrol s dvostrukom konfiguracijom izvanbrodskih motora 115 HP, oklopljenom konzolom s balističkom zaštitom, FLIR termovizijom, šifriranom VHF/UHF komunikacijom i integriranim punktovima za montažu oružja. Trup ojačan za manevre presretanja pri visokim brzinama. Sva elektronika integrirana i testirana u tvornici. Dostavljena dokumentacija o usklađenosti USCG.
      product: RIB 600 Patrol (Dvostruki motor)
      results: Brodovi su postigli maksimalnu brzinu od 52 čvora tijekom ispitivanja prihvaćanja. Agencija je izvijestila o 95% stupnju spremnosti za misije tijekom prvih 12 mjeseci. Postavljena je dodatna narudžba za 8 jedinica.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Dvomotorni RIB 600 pruža našim posadama brzinu i redundantnost potrebnu za operacije presretanja na otvorenoj vodi. Oklopljena konzola osigurava ključnu zaštitu bez kompromisa u performansama.
      icon: tabler:shield
