testimonial:
  content: Paddle Board Overstock je dizajnirao i opremio cijeli naš program aktivnosti na plaži u tri objekta odmarališta. 80 SUPs, 40 kajaka, sigurnosna infrastruktura i obuka osoblja — sve dostavljeno u jednom isporukom. Sudjelovanje naših gostiju u vodenim aktivnostima povećalo se za 60% u prvoj sezoni.
  name: Sophie Laurent
  title: Direktorica iskustava gostiju, Azure Bay Resorts — Phuket, Tajland
content_segments:
  tagline: Profili odmarališta
  title: Rješenja za ugostiteljstvo na obali<br />Po vrsti objekta
  subtitle: Svaki objekt odmarališta ima jedinstveni profil gostiju, mješavinu aktivnosti i operativni ritam — od boutique ekoloških lodgeova do prostranih luksuznih odmarališta na plaži. Dizajniramo programe vodenih sportova koji odgovaraju klasi objekta i očekivanjima gostiju.
  items:
    - title: Luksuzna odmarališta na plaži
      subtitle: VIP transferi, vodene aktivnosti, premium iskustvo gostiju
      description: Luksuzni objekti na plaži — Four Seasons, Aman i slične luksuzne grupe — gdje su vodeni sportovi glavna pogodnost za goste koja povećava ocjene zadovoljstva i sporedne prihode. Flota mora izgledati premium, nuditi raznolikost za sve dobne skupine i razine sposobnosti, te se besprijekorno integrirati sa sustavima conciergea i rezervacija odmarališta. Očekivanja gostiju u pogledu izgleda opreme su izuzetno visoka — stanje i prezentacija opreme izravno utječu na recenzije s 5 zvjezdica.
      features:
        - 'Premium brendirana flota: SUPs, kajaci, pedaline i mali RIB tenderi'
        - 'Prezentacija spremna za goste: boje odmarališta, logotip, pripremljeno izlaganje opreme'
        - Mali luksuzni RIB za VIP transfere gostiju s prilagođenim presvlakama i usklađivanjem boja
        - 'Integrirana sigurnosna infrastruktura: sigurnosne linije, platforme za spasioca, AED'
        - 'Upravljanje prihodima: predlošci dinamičnih cijena, obuka za dodatne prodaje, paketi ponuda'
    - title: Odmarališta na privatnim otocima
      subtitle: Prijevoz gostiju u svim vremenskim uvjetima — nema zastoja, apsolutna pouzdanost
      description: Privatna otočna odmarališta posluju na udaljenim lokacijama gdje je brod jedina veza s kopnom. Dnevni prijevoz gostiju, opskrbne vožnje i hitne medicinske evakuacije ovise o jednom plovilu — svaki zastoj izravno utječe na iskustvo gostiju i rad resorta. Ovi operateri trebaju brod koji pouzdano plovi u svim vremenskim uvjetima, zahtijeva minimalno održavanje i ima rezervne sustave za kritičnu pouzdanost. Brod također mora lijepo funkcionirati pri dolasku gostiju na otok.
      features:
        - konfiguracija za sve vremenske uvjete RIB s potpunim vremenskim oklopom i cijevima za teške uvjete
        - Dvomotorna ili rezervna lokomotiva za rad bez zastoja
        - Hypalon Komercijalna gradnja s životnim vijekom od 5-8 godina u udaljenoj službi
        - Jednostavan dizajn za održavanje s dostupnim komponentama za servisiranje na licu mjesta
        - Personalizirani brend resorta i premium presvlake koje odgovaraju estetici otoka
    - title: Jezerska i ekološka odmarališta
      subtitle: Iskustva gostiju integrirana u prirodu
      description: Nekretnine uz jezero, eko-lodgeovi i prirodna utočišta nude tihe, niskoutjecajne vodene aktivnosti koje nadopunjuju prirodno okruženje. Oprema treba biti nemotorizirana gdje je to moguće, jednostavna za skladištenje u kućicama s ograničenim prostorom i tiha u upotrebi kako bi se sačuvalo ambijentalno iskustvo za sve goste.
      features:
        - 'Nemotorizirana flota: SUPs, kajaci, kanui i pedalinski čamci'
        - Tihe električne pumpe za napuhavanje za potrebe gostiju
        - Ekološki prihvatljivi materijali i ambalaža usklađeni s održivim brendiranjem
        - Uključivali su skladišne police i sustave organizacije čamčarnica
    - title: Plažni klubovi
      subtitle: Prijevoz gostiju, zabava, mali luksuz RIBs
      description: Plažni klubovi djeluju u energičnom, vizualno fokusiranom okruženju gdje je oprema dio atmosfere. Potrebni su im mali luksuz RIBs za prijevoz gostiju iz obližnjih hotela ili pristaništa, te vodene igračke za zabavu gostiju — vuču jet skija, napuhavajuće tobogane i daske za veslanje. Flota mora izgledati moderno, biti jednostavna za upravljanje i izdržati svakodnevnu upotrebu od strane gostiju različitih razina vještine. Skladištenje i brza upotreba ključni su tijekom vršnih sati.
      features:
        - Kompaktni luksuz RIB (3,3-4,3 m) za prijevoz gostiju i uslugu tendera
        - 'Vodene igračke: vučne napuhivačke, SUP daske, kajaci za zabavu gostiju'
        - Prilagođene boje i brendiranje koje odgovara vizualnom identitetu beach cluba
        - Sustavi brzog lansiranja i povrata za operacije s velikim prometom
        - Hypalon Izdržljiva konstrukcija za svakodnevno izlaganje slanoj vodi i UV
    - title: Privatni članovi Klubovi i Jaht klubovi
      subtitle: Prijevoz kroz luku, tenderi za članove, ekskluzivni vodeni sportovi
      description: Privatni klubovi u kojima su vodeni sportovi i prijevoz brodovima korist za članove, a ne izvor prihoda. Oprema mora zadovoljavati više estetske standarde, biti dostupna na zahtjev članovima i zahtijevati minimalan nadzor osoblja. Marina jedriličarski klubovi posebno trebaju tendere za prijevoz kroz luku — premještanje članova između dokova, priveza i obale. Skladištenje i održavanje trebaju biti nevidljivi članovima.
      features:
        - RIB Luksuzni tenderi za prijevoz u lukama i usluge prijenosa članova
        - 'Premium oprema: EVA palube, prilagođene boje članova, markirana presvlaka'
        - Samoposlužni sustav za pristup članovima bez osoblja
        - Izvansezonsko skladištenje i godišnji program osvježenja
    - title: Hoteli usmjereni na avanturu i aktivnosti
      subtitle: Vođene ture, SUP joga, izleti sa snorkelingom, grupne aktivnosti
      description: Nekretnine koje se pozicioniraju kao destinacije za avanturu — nude vođene ture, SUP jogu, vožnju kajakom pri zalasku sunca, izlete sa snorkelingom i grupne aktivnosti. Flota mora podržavati i modele slobodnog najma i vođenih programa, s opremom koja se bez problema može koristiti i samostalno od strane gostiju i pod vodstvom instruktora. Ove nekretnine trebaju izdržljivu opremu za visokofrekventnu uporabu, s lakoćom čišćenja između grupa gostiju.
      features:
        - Svestrana miješana flota koja podržava modele najma + vođene ture
        - Tandem kajaci i ekstra stabilne SUP platforme za grupne aktivnosti
        - 'Oprema za vodiče: daske za instruktore, suhe kutije, vodootporna komunikacija'
        - 'Sezonska rotacija opreme: ljetna flota → zimski program skladištenja'
        - Izdržljiva konstrukcija namijenjena dnevnoj upotrebi od strane gostiju uz minimalno održavanje
