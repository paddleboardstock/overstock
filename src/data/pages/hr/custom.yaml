hero:
  tagline: Paddle Board Overstock Prilagođeni laboratorij
  title: Dizajnirajte svoje<br />plovilo
  subtitle: OEM, ODM, privatna marka i usluge prilagođenog brendiranja za tvrtke širom svijeta. Od jednog prototipa do pune proizvodnje.
  cta: Započni svoj projekt
  footer_link: /contact
steps_section:
  tagline: Kako radi
  title: Od koncepta do proizvodnje
  subtitle: Četiri koraka od vaše ideje do gotovog proizvoda spremnog za more.
  steps:
    - num: '01'
      title: Odaberite svoju dasku
      desc: Odaberite iz naših osnovnih modela — SUP, kajak, čamac ili RIB. Odaberite veličinu, materijal i boju.
    - num: '02'
      title: Prenesite svoj dizajn
      desc: Pošaljite nam svoj logo, umjetnički rad ili smjernice brenda. Naš tim za dizajn priprema digitalni dokaz.
    - num: '03'
      title: Pregled AI makete
      desc: Pogledajte fotorealističnu AI-generiranu maketu svoje prilagođene daske prije početka proizvodnje.
    - num: '04'
      title: Proizvodnja i dostava
      desc: Nakon odobrenja, vaša narudžba ulazi u našu ISO-certificiranu proizvodnu liniju. Rokovi isporuke od 30 dana.
services_section:
  tagline: Usluge
  title: Proizvodne usluge za globalne brendove
  subtitle: Fleksibilni modeli suradnje — od ugovorne proizvodnje do izgradnje brenda s punim uslugama.
  items:
    - title: OEM Proizvodnja
      desc: Proizvodimo vaše dizajne prema specifikacijama — vaša intelektualna svojina, vaši crteži, vaši standardi kvalitete. Potpuna NDA zaštita.
      icon: ⚙️
    - title: ODM Rješenja
      desc: Odaberite među 50+ provjerenih platformi i prilagodite veličinu, boju, grafiku i pakiranje.
      icon: 🎨
    - title: Privatna marka
      desc: Vaš brend na našim proizvodima — logo, pakiranje, etikete, priručnici. Spremno za prodaju odmah iz kutije.
      icon: 🏷️
    - title: Prilagođeno brendiranje
      desc: Tiskanje podloga palube, grafike trupa, naljepnice na cijevima i prilagođene oznake — potpuna integracija brenda.
      icon: ✨
capabilities_section:
  tagline: Mogućnosti
  title: Proizvodne i prilagodbene mogućnosti
  subtitle: Sve što trebate znati prije nego što izvršite narudžbu.
  capabilities:
    - label: Količina narudžbe
      value: MOQ 5–10 jedinica (SUP/kajak), 2–5 jedinica (RIB)
    - label: Rok isporuke
      value: 30–45 dana standardno; 15–20 dana za prototipove
    - label: Prilagodba
      value: Veličina, oblik, boja, grafika, pakiranje, hardver
    - label: Materijali
      value: PVC, Hypalon, drop-stitch, stakloplastika, aluminij
    - label: Tisak
      value: Digitalni (CMYK), sitotisak, prijenos toplinom, sublimacija
    - label: Certifikacija
      value: CE, ISO 9001, BSCI, UKCA (podrška za globalnu usklađenost)
why_section:
