process_steps:
  title: 6-Step OEM/ODM Process
  subtitle: From design brief to FOB Qingdao — a streamlined workflow
  steps:
    - number: '01'
      title: Design Brief & 3D CAD Modeling
      description: Share your target specs, reference product, or concept. Our engineering team develops detailed CAD drawings and 3D renderings for your approval.
      timeline: 3–5 days
    - number: '02'
      title: Material Selection & Fabric Testing
      description: Choose from military-grade PVC (0.9–1.2 mm), Hypalon CSM, or drop-stitch core fabrics. We perform tensile strength, coating adhesion, and UV stability tests.
      timeline: 2–3 days
    - number: '03'
      title: Rapid Prototyping & Sample Production
      description: We CNC-machine custom molds and produce pre-production samples with your brand colors, logo, and specified materials. Samples shipped for your approval.
      timeline: 7–14 days
    - number: '04'
      title: 24–48 Hour High-Pressure Hold Test
      description: Each prototype undergoes rigorous pressure retention testing at 1.25x rated pressure. Seam peel tests and dimensional verification are performed.
      timeline: 1–2 days
    - number: '05'
      title: CE/ISO Quality Inspection & Packaging
      description: 100-point quality checklist. Every unit is inspected before retail-ready packaging. CE declaration of conformity and BSCI compliance report included.
      timeline: 2–3 days
    - number: '06'
      title: FOB Qingdao Shipping & Logistics
      description: Finished goods palletized, shrink-wrapped, and container-loaded at Qingdao port. Full export documentation, customs clearance, and real-time tracking.
      timeline: 7–14 days

