faq:
  title: OEM/ODM — Frequently Asked Questions
  questions:
    - q: What is the minimum order quantity (MOQ) for custom inflatable SUPs?
      a: For standard models with existing molds, MOQ starts at 5–10 units per design. For fully custom molds and tooling, MOQ is typically 200+ units. We work with startups and emerging brands to find feasible entry points.
    - q: What is the MOQ for custom RIB boats?
      a: RIB models start at 2–5 units per design with existing molds, while fully custom RIB molds require larger commitments. We work with startups and established brands to find feasible entry points.
    - q: How long does the OEM sample process take?
      a: Standard prototype samples are completed within 7–14 working days after design approval. Rush orders can be prioritized to 5–7 days for an additional fee.
    - q: What is the difference between PVC and Hypalon for inflatable boats?
      a: PVC is lighter, more affordable, and offers excellent cold-weather flexibility. Hypalon (CSM) provides superior UV and ozone resistance with a longer lifespan (10–15 years vs 5–8 years). We recommend PVC for most recreational applications and Hypalon for commercial/professional use.
    - q: Can you customize the shape and design of the inflatable?
      a: Yes. Our R&D team can develop custom molds for any hull shape, board outline, or tube configuration. We use CNC-machined aluminum molds for precision and consistency.
    - q: Do you provide factory audit services?
      a: We welcome on-site and third-party factory audits at our 12,000 m² Qingdao facility. We maintain ISO 9001 and BSCI certifications and can share audit reports upon NDA.
    - q: What shipping terms do you offer?
      a: We offer FOB Qingdao (standard), CIF, and DDP shipping terms. Container loading and full export documentation are included in all OEM orders.

