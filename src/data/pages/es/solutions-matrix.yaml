hero:
  tagline: Matriz de soluciones industriales
  title: Soluciones marinas basadas en escenarios<br />Para operaciones profesionales
  subtitle: Embarcaciones inflables y RIB diseñadas específicamente para aplicaciones de rescate, flotas de alquiler, embarcaciones auxiliares y pesca comercial, cada una respaldada por especificaciones técnicas y opciones de personalización.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Soluciones marinas profesionales Aquafarer para diversas industrias
direct_answer: 'Aquafarer ofrece soluciones de embarcaciones inflables y RIB diseñadas para escenarios para operaciones marinas comerciales: lanchas de rescate y patrulla con tubos Hypalon reforzados y seguridad multicámara, SUP y kayaks para flotas de alquiler con PVC de 1,2 mm y costuras soldadas con aire caliente para una durabilidad de bajo mantenimiento, yates de lujo con RIB con casco de aluminio en V profunda y configuraciones de pesca de alta resistencia con portacañas y sistemas de vivero.'
solution_a:
  tagline: Solución A
  title: Rescate Marino y<br />Patrulla Comercial
  subtitle: RIB de seguridad multicámara de alta velocidad para operaciones profesionales de respuesta a emergencias y aplicación de la ley.
  badge: Heavy-Duty Series
  description: Nuestras RIB de patrulla y rescate marino están construidas con tubos de aire reforzados de Hypalon/PVC de alta densidad con un diseño de flotación independiente de múltiples cámaras. Cada embarcación está equipada con cinta reflectante de calidad profesional, líneas de agarre de rescate y válvulas de inflado rápido para estar listos para el despliegue. Los cascos de fibra de vidrio en V profunda proporcionan una estabilidad excepcional a altas velocidades y en condiciones de mar agitadas.
  features:
    - title: Seguridad multicámara
      description: '4 a 6 cámaras de aire independientes: cualquier punción en una sola cámara mantiene una flotación positiva'
    - title: Tejido de tubo reforzado
      description: Hypalon CSM de 1,2 mm o PVC 1.680 DTEX con costuras soldadas con aire caliente de doble capa
    - title: Grado profesional
      description: Cinta reflectante SOLAS, líneas de agarre de rescate, cornamusas de remolque, línea de pintor de liberación rápida
    - title: Casco de alta velocidad
      description: Casco de fibra de vidrio o aluminio en V profunda con capacidad para 25 a 45 nudos, según la configuración
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Material del casco
      value: Fibra de vidrio/aluminio de grado marino
    - label: Tela de tubo
      value: Hypalon CSM de 1,2 mm/PVC 1.680 DTEX
    - label: Velocidad máxima
      value: 25-45 nudos
    - label: Capacidad
      value: 6 a 12 personas
    - label: Gama de motores
      value: 40–200 CV
    - label: Proceso de dar un título
      value: CE/ISO 9001
solution_b:
  tagline: Solución B
  title: Alquiler de deportes acuáticos y equipo para flotas de complejos turísticos
  subtitle: SUP, kayaks y embarcaciones inflables ultraduraderos y de bajo mantenimiento construidos para uso diario de alquiler en complejos turísticos, clubes y operaciones turísticas.
  badge: Rental-Grade
  description: El equipo de nuestra flota de alquiler está diseñado para brindar la mayor durabilidad y el menor costo de mantenimiento. Utilizamos PVC reforzado de 1,2 mm con tecnología de costura soldada con aire caliente de triple capa que resiste la degradación por rayos UV y los daños por colisiones frecuentes. La construcción con costuras garantiza que las tablas mantengan la rigidez incluso después de cientos de ciclos de alquiler. Todos los modelos cuentan con anillos en D reforzados, bandas de riel resistentes a la abrasión y válvulas de calidad comercial.
  features:
    - title: PVC de calidad comercial
      description: 'PVC reforzado de 1,2 mm con estabilizadores UV: 3 veces más grueso que los materiales de consumo'
    - title: Costuras soldadas con aire caliente
      description: 'Soldadura por fusión de triple capa: más resistente que la unión adhesiva y resistente a la delaminación'
    - title: Rigidez de puntada caída
      description: 'Núcleo de 1680 DTEX con 2 hilos/pulgada cuadrada: nominal de 20 PSI para una rigidez similar a la de un tablero duro'
    - title: Diseño listo para flotas
      description: Anillos en D reforzados, válvulas comerciales Halkey-Roberts, bandas de riel resistentes a la abrasión
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Material del tubo
      value: PVC reforzado de 1,0 a 1,2 mm
    - label: Tecnología de costura
      value: Soldadura por aire caliente de triple capa
    - label: Presión máxima
      value: 15–20 PSI (modelos de punto caído)
    - label: Resistencia a los rayos UV
      value: Pruebas aceleradas de más de 1000 horas
    - label: Garantía
      value: 2 a 5 años según el modelo
    - label: Mantenimiento
      value: 'Mínimo: enjuague y almacene'
solution_c:
  tagline: Solución C
  title: Licitaciones de yates y<br />embarcaciones de lujo
  subtitle: Lanchas RIB ligeras y de alto rendimiento diseñadas para el almacenamiento de superyates y el transporte de invitados con ajuste y acabado de lujo.
  badge: Premium Series
  description: Nuestras RIB para yates combinan una construcción liviana con una estética de lujo. Los cascos de aluminio o fibra de vidrio en V profunda brindan una calidad de navegación excepcional y un fácil levantamiento del pescante. disponible con gráficos de tubos del mismo color, tapicería premium y diseños de consola personalizados. Las dimensiones de almacenamiento compactas los hacen ideales para garajes de superyates y almacenamiento en cubierta.
  features:
    - title: Construcción ligera
      description: Los cascos de aluminio de calidad marina reducen el peso en un 30% en comparación con los de fibra de vidrio para facilitar el levantamiento
    - title: Rendimiento en V profunda
      description: Casco con ángulo muerto de 18 a 22 grados para una navegación suave en picado y un seguimiento excelente
    - title: Ajuste y acabado de lujo
      description: Tapicería personalizada, tubos del mismo color, consola de timón premium, paquete de acero inoxidable
    - title: Almacenamiento compacto
      description: 'Diseñado para garajes de superyates: tubos desinflables para almacenamiento compacto'
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Tipo de casco
      value: Aluminio en V profunda/fibra de vidrio
    - label: Salida de la muerte
      value: 18-22 grados
    - label: Velocidad máxima
      value: 30-40 nudos
    - label: Peso seco
      value: 120-350 kg (casco de aluminio)
    - label: Listo para elevación con pescante
      value: Sí, puntos de elevación estándar
    - label: Almacenamiento
      value: Tubos desinflables, apilables.
