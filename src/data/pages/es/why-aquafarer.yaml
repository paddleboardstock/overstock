hero:
  tagline: Por qué Aquafarer
  title: 'Construido diferente. Construido para el negocio.<br />El socio detrás de las aventuras acuáticas en todo el mundo'
  subtitle: 'No somos solo un fabricante: somos un socio comercial que diseña, desarrolla y entrega equipos de grado comercial para clubes, resorts, operadores de alquiler y marcas acuáticas emergentes.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Calidad de fabricación y experiencia de Aquafarer

pillars:
  tagline: Los tres pilares de la alianza
  title: Por qué las empresas de deportes acuáticos del mundo eligen Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Diseñado para uso comercial
      description: 'Nuestro equipo está diseñado para el alquiler diario, no para la recreación de fin de semana. PVC de grado comercial, núcleos drop-stitch reforzados, opciones de Hypalon resistente a los UV y herrajes probados en campo significan menos mantenimiento, mayor vida útil y un mejor retorno de la inversión para su operación.'
      icon: tabler:building-factory
      callToAction:
        text: Ver línea de productos comerciales
        href: /products
    - title: De la idea al mercado
      description: 'Lance su marca de deportes acuáticos en 90 días. Le guiamos en cada paso: validación del concepto, selección de producto, prototipo, producción, diseño de empaque y envío global. Sin presión por pedidos mínimos: empiece poco a poco y escale con confianza.'
      icon: tabler:rocket
      callToAction:
        text: Inicie el viaje de su marca
        href: /oem-odm-blueprint
    - title: Construido para condiciones globales
      description: 'Productos optimizados para cada clima: formulaciones de PVC para aguas frías en Europa, materiales resistentes a los UV para Oriente Medio y Australia, tratamientos antihumedad para el Sudeste Asiático. Cada envío se calibra según el entorno de destino.'
      icon: tabler:world

stats:
  title: Confianza en números
  stats:
    - title: Años en el negocio
      amount: Desde 2012
    - title: Embarcaciones construidas
      amount: 15,000+
    - title: Clientes recurrentes
      amount: '85%'
    - title: Reclamaciones de garantía
      amount: '<2%'

reasons:
  tagline: La diferencia Aquafarer
  title: Qué nos distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Fabricación real, no intermediación
      description: 'Somos propietarios y operamos una fábrica de 12.000 m². Cuando se asocia con Aquafarer, trabaja directamente con las personas que diseñan, desarrollan y fabrican sus productos: sin intermediarios.'
      icon: tabler:building-factory
    - title: Enfoque liderado por la ingeniería
      description: 'Nuestro proceso de diseño comienza con el caso de uso, no con la categoría de producto. Optimizamos la forma del casco, la selección de materiales y la configuración para el uso real en entornos comerciales.'
      icon: tabler:engine
    - title: Calidad certificada
      description: 'Certificación CE, sistema de calidad ISO, conformidad BSCI, conformidad REACH, aprobación USCG. Cada producto cumple estándares internacionales, no solo promesas.'
      icon: tabler:certificate
    - title: OEM/ODM flexible
      description: 'Colores de los tubos, diseño de la consola, branding, empaque: personalizamos según sus especificaciones. Sin presión por pedidos mínimos. Empiece con un prototipo y escale con confianza.'
      icon: tabler:adjustments
    - title: Logística global
      description: 'Almacén en EE. UU. en California, envío directo desde Qingdao y carga aérea para pedidos urgentes. Gestionamos trámites aduaneros y documentación en todo el mundo.'
      icon: tabler:truck-delivery
    - title: Soporte de por vida
      description: 'Apoyamos embarcaciones que construimos hace 20 años. Repuestos genuinos, asesoría técnica y guías de reparación: nuestro equipo está disponible cuando nos necesite, esté donde esté.'
      icon: tabler:lifebuoy

testimonials:
  tagline: La confianza de marcas de todo el mundo
  title: Lo que dicen nuestros socios
  items:
    - content: 'Hemos trabajado con varios fabricantes en China, pero Aquafarer destaca por su soporte de ingeniería y su calidad constante. Tratan nuestra marca como propia.'
      name: '— Socio OEM, marca europea de deportes acuáticos'
    - content: 'Sus RIB de Hypalon llevan más de 5 años en servicio en nuestra flota. Mantenimiento mínimo y excelente resistencia a los UV. La garantía de 5 años en los tubos nos da confianza.'
      name: '— Operador de flota, grupo de resorts de Oriente Medio'
    - content: 'El equipo de Aquafarer nos ayudó a desarrollar un diseño de tabla SUP personalizada del concepto a la producción en 90 días. La calidad superó nuestras expectativas.'
      name: '— Distribuidor, Watersports de Australia'
    - content: 'Como dueño de un pequeño negocio, me preocupaban los pedidos mínimos. Aquafarer trabajó con mi presupuesto y me ayudó a lanzar mi marca con solo 50 tablas. Ahora estoy pidiendo 500.'
      name: '— Fundador de marca, empresa de alquiler de SUP de EE. UU.'

cta:
  title: '¿Listo para construir su negocio acuático?'
