breadcrumb: Fabricante OEM/ODM
tldr:
  summary: Paddle Board Overstock es un fabricante OEM/ODM directo de fábrica. Planta de 12 000 m² certificada ISO 9001:2015, producción anual de 15 000 unidades, cumplimiento CE/BSCI/REACH/UKCA, MOQ bajos desde 2-10 unidades.
  points:
    - Planta de Qingdao de 12 000 m² certificada ISO 9001:2015
    - Capacidad anual de 15 000 unidades con 200-300 trabajadores cualificados
    - Cumplimiento CE 2013/53/EU, UKCA, BSCI, REACH
    - 'MOQ bajos: 2-5 unidades (RIB), 5-10 unidades (SUP) para modelos estándar'
    - Exportación a más de 50 países con envío FOB Qingdao
