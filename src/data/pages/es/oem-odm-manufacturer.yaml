process_section:
  eyebrow: Nuestro proceso
  title: Flujo de trabajo OEM/ODM de extremo a extremo
  subtitle: Del brief de diseño a la carga del contenedor — seis pasos hacia su embarcación inflable de marca propia.
  steps:
    - step: '01'
      title: Especificación y brief de diseño
      desc: Comparta sus especificaciones objetivo, planos CAD o un producto de referencia. Nuestro equipo de ingeniería revisa materiales, dimensiones y requisitos de cumplimiento (CE, BSCI) antes de cotizar.
    - step: '02'
      title: Prototipado de moldes 3D
      desc: Diseñamos y mecanizamos por CNC moldes a medida para tablas de SUP, cascos de kayak y componentes de RIB. Las muestras de prototipo se producen en 15–20 días laborables para su aprobación.
    - step: '03'
      title: Selección de materiales y producción de muestras
      desc: Elija entre PVC de grado militar (0,9 mm–1,2 mm), Hypalon CSM o tejidos de núcleo drop-stitch. Producimos muestras de preproducción con los colores de su marca, logotipo y embalaje para su validación.
    - step: '04'
      title: Auditoría de fábrica CE y cumplimiento
      desc: Cada pedido OEM incluye documentación de cumplimiento — declaración de conformidad CE, registros de trazabilidad ISO 9001, informe de cumplimiento social BSCI y declaraciones de materiales REACH.
    - step: '05'
      title: Producción en serie y control en línea
      desc: Las tiradas de producción siguen nuestra lista de verificación de calidad de 100 puntos. Cada unidad se somete a pruebas de retención de presión de 24 horas, pruebas de pelado de costuras e inspección visual antes del embalaje.
    - step: '06'
      title: Logística FOB Qingdao y envío
      desc: Los productos terminados se paletizan, se envuelven en film y se cargan en contenedor en el puerto de Qingdao. Gestionamos toda la documentación de exportación, el despacho de aduanas y ofrecemos seguimiento de envío en tiempo real.
capabilities_section:
  eyebrow: Capacidades de fabricación
  title: Lo que fabricamos
  subtitle: Seis capacidades de producción clave para socios B2B globales.
  items:
    - title: Fabricación de tablas de SUP drop-stitch
      desc: Laminación de núcleo drop-stitch en toda la longitud para tablas de paddle surf rígidas de alta presión (15–20 PSI). Longitud, anchura, grosor, perfil de rocker y diseño gráfico personalizados.
    - title: Producción de barcas neumáticas de PVC
      desc: Botes auxiliares, tenders y botes deportivos de PVC soldados por alta frecuencia. Múltiples configuraciones de cámaras, opciones de suelo (listones, cubierta de aire, enrollable) e integración de accesorios.
    - title: Fabricación de RIB de Hypalon
      desc: Flotadores CSM de Hypalon de grado comercial unidos a cascos de fibra de vidrio o aluminio en V profunda. Longitudes de 3,3 m a 6,0 m para operaciones de patrulla, rescate, turismo y buceo.
    - title: Marca blanca y personalización de marca
      desc: 'Servicio completo de marca blanca: logotipo personalizado por transferencia térmica o serigrafía, embalaje con marca (cajas de venta, bolsas de transporte), manuales de usuario en su idioma y registro de códigos de barras/UPC.'
    - title: Diseño de moldes y utillajes a medida
      desc: Equipo propio de ingeniería 3D CAD/CAM. Diseñamos y fabricamos moldes de aluminio y materiales compuestos a medida para formas de casco únicas, configuraciones de cubierta y puntos de anclaje de accesorios.
    - title: Accesorios OEM y kitting
      desc: Chalecos salvavidas (CE 12402), bombas de doble acción, palas de carbono/nylon, kits de reparación, bolsas de transporte y correas. Kitting completo y embalaje por lotes para una presentación lista para la venta.
experience_section:
  eyebrow: Experiencia real
  title: Alianzas que construyeron marcas
  subtitle: Historias reales de marcas y organizaciones que eligieron a Paddle Board Overstock para su fabricación OEM/ODM.
  stories:
    - quote: Llegamos a Paddle Board Overstock con un boceto en una servilleta y una lista de requisitos. Ocho meses después, teníamos un producto listo para producción que pasó la certificación CE al primer intento.
      narrative: Una startup europea con un diseño de SUP novedoso acudió a Paddle Board Overstock para su fabricación ODM. El equipo de I+D de Paddle Board Overstock llevó el concepto a través del diseño CAD, el análisis estructural por FEA, la simulación hidrodinámica, la creación del molde, la fabricación del prototipo y el utillaje de producción. El fundador de la startup viajó tres veces a Qingdao durante el proceso. El producto final pasó la certificación CE sin ninguna modificación — un resultado que el fundador atribuye a que el equipo de ingeniería de Paddle Board Overstock comprendió desde el principio los requisitos regulatorios europeos.
      context: Lanzamiento de marca europea de SUP, 2023-2024
      source: Fundador de la marca
    - quote: El nivel de protección por NDA y seguridad de la PI en Paddle Board Overstock nos da confianza para compartir nuestros diseños propietarios. Tratan nuestra PI como si fuera suya.
      narrative: Una empresa estadounidense de equipos marinos con tecnología de válvulas propietaria necesitaba un socio de fabricación capaz de proteger su PI produciendo a escala. Tras auditar a cinco fabricantes chinos, eligieron Paddle Board Overstock por los protocolos de protección de la PI de la fábrica, la gestión segura de archivos de diseño y la disposición a firmar NDA estrictos. La alianza ha producido tres líneas de productos en cuatro años sin ningún incidente de PI.
      context: Empresa estadounidense de equipos marinos, alianza OEM desde 2021
      source: Vicepresidente de Operaciones
