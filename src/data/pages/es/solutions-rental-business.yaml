testimonial:
  content: Estaba alquilando 5 tablas en una tienda local y perdía el 60% de mis ingresos con ellas. Paddle Board Overstock me ayudó a construir mi propia flota de 15 SUP. La calculadora de retorno de la inversión que me proporcionaron mostró que alcanzaría el punto de equilibrio en 4 meses; en realidad, me tomó 3. Ahora me estoy expandiendo a 30 tablas y agregando kayaks.
  name: Daniel Okonkwo
  title: Propietario, Lakeland SUP Rentals - Ontario, Canadá
content_segments:
  tagline: Perfiles de alquiler
  title: Soluciones de alquiler de deportes acuáticos<br />Por tipo de operador
  subtitle: Las diferentes operaciones de alquiler tienen diferentes necesidades, desde pequeños alquileres de SUP en la playa hasta centros de deportes acuáticos a gran escala. Adaptamos nuestros paquetes de equipos y modelo de soporte en consecuencia.
  items:
    - title: Alquiler de SUP en la playa y junto al lago
      subtitle: Operaciones de gran volumen y baja complejidad
      description: Operadores que alquilan tablas de remo y kayaks directamente a bañistas y visitantes del lago. Su prioridad es minimizar el tiempo de respuesta entre alquileres, mantener los equipos en rotación y gestionar los picos de demanda estacionales con un espacio de almacenamiento pequeño.
      features:
        - Flotas de SUP hinchables que se guardan planas — sin necesidad de muelle ni remolque
        - PVC de grado comercial con capacidad para más de 100 ciclos de alquiler por temporada
        - Tejido de secado rápido y resistente a los UV para reponer el alquiler el mismo día
        - Gamas de tablas codificadas por color para una identificación fácil de la flota
    - title: Resort y hotel Centros de deportes acuáticos
      subtitle: Experiencia del huésped y alineación de la marca
      description: Resorts y hoteles que ofrecen deportes acuáticos como servicio en el lugar. El equipo debe verse de primera calidad, funcionar de manera confiable para huéspedes principiantes e intermedios e integrarse con los flujos de trabajo de facturación y reserva de actividades existentes del resort.
      features:
        - Tablas de SUP y chalecos salvavidas personalizados con los colores del resort
        - 'Flota mixta: SUP, kayaks, pedaleos y pequeños tienders RIB'
        - Soluciones de bombas eléctricas silenciosas y sin combustible para el inflado en la playa
        - Formación del personal e incorporación al mantenimiento incluidas
    - title: Operadores de alquiler de embarcaciones y RIB
      subtitle: Flotas de alquiler de embarcaciones de calidad comercial
      description: Operadores que alquilan embarcaciones motorizadas (lanchas semirrígidas, botes inflables y pequeños runabouts) por horas o medio día. Su flota debe cumplir con las normas de seguridad marítima, soportar el uso intensivo de los huéspedes y minimizar el tiempo de inactividad mecánica entre vuelos.
      features:
        - Paquetes RIB con espejos de popa listos para fueraborda de 30–90 CV
        - Paneles de suelo en contrachapado de grado marino para una integridad estructural duradera
        - Sistemas de válvulas de lanzamiento rápido para una rotación más rápida
        - Kit de repuestos + soporte técnico SLA a demanda
    - title: Operadores de viajes y aventuras
      subtitle: Flotas de excursiones guiadas
      description: 'Operadores que organizan recorridos guiados por deportes acuáticos: safaris en SUP, kayak en cuevas, excursiones de snorkel o recorridos en RIB de isla en isla. El equipo debe ser lo suficientemente estable para los visitantes novatos del recorrido, rápido de limpiar entre grupos y lo suficientemente resistente para el uso guiado diario en diversas condiciones de agua.'
      features:
        - Plataformas SUP extrastables (82 cm o más de ancho) para principiantes
        - Opciones de kayak tándem para configuraciones de tours en pareja o grupo
        - Capacidad de carga integrada para equipo de snorkel, bolsas secas y neveras
        - Documentación de cumplimiento CE + USCG para operaciones comerciales
