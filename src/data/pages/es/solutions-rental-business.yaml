testimonial:
  content: Estaba alquilando 5 tablas en una tienda local y perdiendo el 60% de mis ingresos con ellos. Paddle Board Overstock me ayudó a construir mi propia flota de 15 SUPs. La calculadora ROI que me proporcionaron mostró que alcanzaría el punto de equilibrio en 4 meses; en realidad, tardó 3. Ahora estoy expandiéndome a 30 tablas.
  name: Daniel Okonkwo
  title: Propietario, Lakeland SUP Rentals - Ontario, Canadá
content_segments:
  tagline: Perfiles de alquiler
  title: Soluciones de Alquiler de Deportes Acuáticos<br />Por tipo de operador
  subtitle: Las diferentes operaciones de alquiler tienen diferentes necesidades, desde pequeños alquileres de SUP en la playa hasta centros de deportes acuáticos a gran escala. Adaptamos nuestros paquetes de equipos y modelo de soporte en consecuencia.
  items:
    - title: Alquiler de SUP en la playa y junto al lago
      subtitle: Operaciones de gran volumen y baja complejidad
      description: Operadores que alquilan tablas de paddle a personas directamente en la playa y visitantes del lago. Su prioridad es minimizar el tiempo de preparación entre alquileres, mantener el equipo en rotación y gestionar los picos de demanda estacional con un espacio de almacenamiento reducido.
      features:
        - Flotas inflables SUP que se pliegan — no se necesita muelle ni remolque
        - De grado comercial PVC clasificado para 100+ ciclos de alquiler por temporada
        - Tejido de secado rápido y resistente a UV para estar listo para re-alquiler el mismo día
        - Rangos de tablero codificados por colores para una fácil identificación de la flota
    - title: Resort y hotel Centros de deportes acuáticos
      subtitle: Experiencia del huésped y alineación de la marca
      description: Resorts y hoteles que ofrecen deportes acuáticos como servicio en el lugar. El equipo debe verse de primera calidad, funcionar de manera confiable para huéspedes principiantes e intermedios e integrarse con los flujos de trabajo de facturación y reserva de actividades existentes del resort.
      features:
        - Tablas y chalecos salvavidas personalizados con la marca SUP que combinan con los colores del resort
        - 'Flota mixta: todo terreno, touring y serie artística SUPs'
        - Soluciones de bombeo eléctricas silenciosas y sin combustible para inflado en la playa
        - Capacitación del personal y incorporación al mantenimiento incluida
    - title: Alquileres boutique y móviles de SUP
      subtitle: Servicios de alquiler emergentes y basados en entregas
      description: 'Operadores que llevan las tablas directamente al cliente: entregas en la playa del hotel, estaciones de alquiler emergentes en eventos y configuraciones móviles. El equipo debe ser rápido de desplegar, fácil de transportar y presentable a primera vista, con tamaño de flota flexible para eventos y demanda estacional.'
      features:
        - Transporte de tablas estilo mochila — sin remolque requerido
        - Inflado rápido para configuración a demanda en menos de 15 minutos
        - Equipo presentable que luce premium a primera vista
        - Tamaño de flota flexible para eventos y demanda estacional
    - title: Operadores de viajes y aventuras
      subtitle: Flotas de excursiones guiadas
      description: Operadores que realizan recorridos guiados de deportes acuáticos — safaris SUP, excursiones de esnórquel y tours de exploración costera. El equipo debe ser lo suficientemente estable para invitados novatos, rápido de limpiar entre grupos y lo suficientemente duradero para uso diario guiado en condiciones acuáticas diversas.
      features:
        - Plataformas extra estables SUP (32" de ancho+) para principiantes
        - Plataformas grandes y estables para fotos de tours en pareja o grupo
        - Capacidad de carga incorporada para equipo de esnórquel, bolsas secas y neveras
        - Paquetes de equipos de seguridad para operaciones de tours comerciales
