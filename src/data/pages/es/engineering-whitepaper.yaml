section_faq:
  title: Preguntas técnicas frecuentes
  questions:
    - q: ¿Cómo se compara el drop-stitch con la construcción tradicional de carcasa rígida?
      a: Los modernos núcleos de costura a 20 PSI logran entre el 85% y el 90% de la rigidez de las carcasas duras de espuma EPS/fibra de vidrio comparables, a la vez que son completamente desinflables para el transporte. La compensación es un peso ligeramente mayor y una rigidez final menor, pero para la mayoría de las aplicaciones comerciales y recreativas, la diferencia es insignificante.
    - q: ¿Qué densidad de hilo se considera de primera calidad?
      a: Las telas de punto caído de primera calidad utilizan 2 hilos por pulgada cuadrada (aproximadamente 3100 hilos por m²) tejidos con hilo de poliéster 1680 DTEX. Las telas de nivel básico utilizan 1 hilo por pulgada cuadrada con hilo de 1100 DTEX.
    - q: ¿Se puede soldar Hypalon como el PVC?
      a: No. Hypalon/CSM no se puede soldar por RF. Debe ensamblarse utilizando cemento de contacto aplicado a mano, lo que hace que la producción requiera más mano de obra y las uniones dependan de la habilidad del operador. El PVC se puede soldar por radiofrecuencia o por aire caliente para obtener una calidad de costura constante y automatizada.
    - q: ¿Cuál es la presión máxima segura para embarcaciones inflables?
      a: Los tubos inflables estándar para botes funcionan a entre 8 y 12 PSI. Los pisos de punto caído funcionan a entre 12 y 20 PSI. Los núcleos de costura por caída (SUP) de alta presión pueden funcionar a entre 20 y 25 PSI. Cada producto incluye válvulas de alivio de presión calibradas para evitar el inflado excesivo.
    - q: ¿Cuánto tiempo se tarda en fabricar una embarcación neumática a medida?
      a: La producción OEM estándar dura entre 30 y 45 días desde la confirmación del pedido hasta FOB Qingdao. El desarrollo de moldes personalizados añade entre 15 y 20 días a la producción y prueba de prototipos.
