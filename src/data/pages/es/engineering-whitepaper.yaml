hero:
  tagline: Informe técnico de ingeniería
  title: Tecnología Drop-Stitch y ciencia de materiales:<br />La ingeniería detrás de las modernas embarcaciones inflables
  subtitle: Una referencia técnica autorizada que cubre la construcción del núcleo con punto de caída, la comparación de materiales de PVC versus Hypalon, pruebas de rigidez de recipientes de alta presión y estándares de fabricación de embarcaciones.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-design-discussion-lab.webp
    alt: 'Laboratorio de I+D de Paddle Board Overstock: pruebas e ingeniería de materiales'
direct_answer: La tecnología Drop-Stitch utiliza miles de hilos internos de poliéster que conectan las capas de tela superior e inferior de un núcleo inflable. Cuando se inflan a 15-20 PSI, estos hilos actúan como miembros de tensión, evitando que se abulten y creando una estructura rígida comparable a la construcción rígida. Combinado con revestimientos avanzados de tela de PVC o Hypalon y soldadura por RF, esto permite una embarcación inflable portátil de alto rendimiento adecuada para uso profesional, comercial y recreativo.
section_drop_stitch:
  title: Ingeniería estructural con punto de caída
  subtitle: Cómo miles de hilos transforman un tejido flexible en una estructura rígida
  content: |-
    El drop-stitch (también conocido como "tejido drop-stitch" o "núcleo drop-stitch") representa un gran avance en la ingeniería de estructuras inflables. El principio es engañosamente simple: miles de hilos de poliéster individuales se tejen simultáneamente en dos capas separadas de tejido base, conectando los paneles superior e inferior en un ángulo de 90 grados.

    Cuando se presuriza la cámara sellada, la presión del aire interno ejerce fuerza igualmente en todas las direcciones, tratando de separar los paneles superior e inferior para darles una forma cilíndrica. Los miles de hilos de punto caído resisten esta separación, transfiriendo la carga en tensión a lo largo del eje del hilo. El resultado es un panel plano y rígido que puede soportar entre 15 y 20 PSI de presión interna.

    A 20 PSI, un panel de costura caída de 1 m² experimenta aproximadamente 14 000 kg de fuerza interna total; sin embargo, la matriz del hilo lo mantiene perfectamente plano. Esto proporciona a las estructuras de punto caído una relación resistencia-peso que rivaliza con los materiales rígidos tradicionales.
section_materials:
  title: 'PVC vs Hypalon: comparación de materiales técnicos'
  subtitle: Datos objetivos para una selección informada de materiales en la fabricación de embarcaciones inflables
  table:
    columns:
      - header: Propiedad
      - header: PVC (Cloruro de polivinilo)
      - header: Hypalon (CSM)
    rows:
      - property: Resistencia a los rayos UV
        pvc: Bueno (con estabilizadores UV)
        hypalon: Excelente (inherente)
      - property: Resistencia a la abrasión
        pvc: Bien
        hypalon: Muy bien
      - property: Resistencia a la tracción
        pvc: 3000–5000 N/5 cm
        hypalon: 2500-4000 N/5 cm
      - property: Peso por m²
        pvc: 850-1200 gramos
        hypalon: 1.100–1.500 gramos
      - property: Flexión en frío
        pvc: -30°C
        hypalon: -20 °C
      - property: Método de unión
        pvc: Soldadura por RF / Soldadura por aire caliente
        hypalon: Pegado manual (cemento de contacto)
      - property: Reparabilidad
        pvc: Fácil (soldadura por calor o adhesivo)
        hypalon: Requiere adhesivo CSM
      - property: Costo de materiales
        pvc: 8–15 $/m²
        hypalon: 20–40 $/m²
      - property: Esperanza de vida (sol tropical)
        pvc: 5 a 8 años
        hypalon: 10 a 15 años
      - property: Gama de colores
        pvc: Amplio (espectro de color completo)
        hypalon: Limitado (colores básicos)
      - property: Resistencia química
        pvc: Bueno (grados resistentes al combustible/aceite)
        hypalon: Excelente (amplia gama química)
section_testing:
  title: Protocolos de prueba y seguridad
  subtitle: El marco de garantía de calidad de Paddle Board Overstock para cada lote de producción
  protocols:
    - title: Prueba de retención de presión nominal de 1,25x
      description: Cada recipiente ensamblado se infla a 1,25 veces su presión operativa nominal y se mantiene durante 24 a 48 horas. Cualquier caída de presión superior al 2% provoca rechazo y retrabajo.
      standard: ISO 6185
    - title: Prueba de resistencia al pelado de costuras
      description: Se prueban muestras de soldadura y costura de pegamento de cada lote de producción para determinar su resistencia al pelado utilizando equipos de tensión calibrados. Se requiere una resistencia mínima al pelado de 4 kN/m.
      standard: ISO 2411
    - title: Prueba de tracción de la tela
      description: Los rollos de tela entrantes se someten a pruebas de resistencia a la tracción y alargamiento tanto en la dirección de la urdimbre como de la trama. Umbral de rechazo inferior a 3.000 N/5 cm para PVC.
      standard: ISO 1421
    - title: Meteorización acelerada por rayos UV
      description: Las muestras de material se someten a más de 1000 horas de exposición UV acelerada en cámaras de prueba QUV. Se permite una pérdida máxima de resistencia a la tracción del 15%.
      standard: ASTM G154
    - title: Integridad de válvulas y accesorios
      description: Cada conjunto de válvula se prueba para determinar la integridad del sello a una presión nominal de 1,25 veces. Las válvulas antirretorno se prueban para determinar el rendimiento del sello unidireccional.
      standard: ISO 12402
