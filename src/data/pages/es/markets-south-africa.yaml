hero:
  tagline: Sudáfrica
  title: SUP Tablas mayoristas para<br />Minoristas sudafricanos
  subtitle: Talleres y operadores de Cape Town, Durban y Garden Route — tablas de paddle nuevas en stock de 5 unidades, modelos mixtos, enviadas desde China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paneles de sobrestock SUP para minoristas y operadores sudafricanos
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas en SUP exceso a empresas sudafricanas — tiendas y escuelas en Ciudad del Cabo, Durban y a lo largo de la Garden Route, operadores de alquiler y vendedores online. Los pedidos mayoristas comienzan en 5 tablas con modelos mixtos en un solo envío, enviadas desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada placa está 100% sometida a prueba de presión y cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Sirviendo al mercado minorista de deportes de mesa más consolidado de África
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El SUP mercado sudafricano
  paragraphs:
    - Sudáfrica tiene el mercado de deportes de tabla más maduro del continente. Ciudad del Cabo combina pistas de surf de clase mundial y lagunas de aguas tranquilas con una profunda cultura del surf; Durban tiene playas de aguas cálidas durante todo el año; las lagunas de Knysna y la bahía de Plettenberg de la Garden Route están diseñadas para el remo. Una infraestructura comercial bien establecida y una auténtica comunidad local de remeros — desde SUP surfistas hasta practicantes de fitness en aguas tranquilas — distinguen a este mercado.
    - Buyers here are seasoned: tiendas de surf con pisos comerciales reales, escuelas de remo con flotas y operadores de aventura SUP combinándose con rutas de kayak y ciclismo. Evalúan el equipo como profesionales — construcción, garantía y reparabilidad — y piden en pequeños lotes deliberados de 5 a 20 tablas, mezclando todoterreno de alquiler con ediciones premium para la pared comercial.
  customer_types:
    - title: Tiendas de surf y remo
      description: Estableció comercios en Ciudad del Cabo y Durban que añadió o amplió SUP las colas para la comunidad local de piragüismo.
    - title: Escuelas de remo y alquileres
      description: Escuelas y flotas de alquiler en lagunas y playas de aguas tranquilas refrescando tablas en un ciclo real de reemplazo.
    - title: Operadores de Aventura
      description: Los operadores de Garden Routes y Western Cape amplian SUP la oferta de aventuras multiactividad.
shipping_section:
  title: Barco a Sudáfrica
  paragraphs:
    - Los pedidos se envían desde Weihai, China. El transporte aéreo exprés transporta muestras y de 1 a 3 pedidos de embarcación hacia Johannesburgo y Ciudad del Cabo; Consolidated Sea Freight atiende entre 5 y 20 pedidos al por mayor a bordo a través de Durban, Ciudad del Cabo y otros puertos. Las estimaciones de tránsito para tu destino están incluidas en tu presupuesto.
    - Proporcionamos las facturas comerciales y los requisitos de autorización de listas de empaquetado, con códigos HS correctos y valores declarados. Los derechos de importación y el IVA son pagables por el importador según las normas sudafricanas.
  customs_note: 'La autorización SARS se basa en la documentación: confirma el tratamiento actual de impuestos y IVA para equipos deportivos inflables con tu agente de compensación antes de hacer el pedido. Proporcionamos documentación completa y consistente y respondemos rápidamente a las solicitudes de los intermediarios.'
faq_section:
  title: Preguntas frecuentes sobre Sudáfrica
  items:
    - q: ¿Se adaptan las tablas a las condiciones mixtas de Ciudad del Cabo?
      a: Sí. Los modelos completos manejan aguas tranquilas de laguna y días costeros tranquilos, y la gama incluye tablas orientadas al turismo para remadas largas. Para recorridos en mar abierto a fondo del viento, los palistas experimentados deberían comentar con nosotros su caso de uso específico antes de hacer el pedido.
    - q: ¿Cómo es un pedido de tienda?
      a: 'Normalmente entre 5 y 20 tablas: una base de modelos completos para clases y alquileres, además de ediciones artísticas premium para la pared de la tienda — modelos mixtos, un envío, con precio por cantidad total.'
    - q: ¿Cómo se cotiza el transporte de mercancías a Sudáfrica?
      a: Envío exprés por aire a Johannesburgo o Ciudad del Cabo para muestras y pedidos pequeños; flete marítimo consolidado a Durban o Ciudad del Cabo para cantidades al por mayor. Ambos están detallados en su cotización con tiempos estimados de tránsito.
    - q: ¿Quién se encarga de los aranceles de importación y del IVA?
      a: Usted, como importador, a través de su agente de aduanas según las normas de SARS. Nosotros proporcionamos la factura comercial y la lista de empaque con los códigos HS correctos y los valores declarados.
