content_challenge:
  tagline: El desafío
  title: 'El turismo marino exige<br />embarcaciones fiables y listas para pasajeros'
  subtitle: 'Los operadores turísticos necesitan barcos capaces de gestionar traslados diarios de pasajeros, condiciones variables del mar y altas expectativas de los invitados, manteniendo al mismo tiempo un mantenimiento reducido y operaciones rentables.'
  paragraphs:
    - 'Los operadores de turismo insular en destinos como Maldivas, Filipinas, Indonesia y Tailandia realizan traslados diarios de pasajeros, excursiones de snorkel y salidas marinas. Sus barcos operan más de 300 días al año en entornos de agua salada con un tiempo de inactividad mínimo para mantenimiento.'
    - '**Los traslados entre islas** requieren un transporte rápido y cómodo de pasajeros entre resorts, aeropuertos y puntos de buceo. Los pasajeros esperan un trayecto suave, fácil embarque y protección contra el sol y las salpicaduras. Un barco lento o incómodo afecta directamente a la satisfacción del huésped y a las reservas repetidas.'
    - '**Los operadores de avistamiento de ballenas y delfines** necesitan barcos que lleguen rápidamente a la fauna, mantengan plataformas de observación estables y operen en silencio para no molestar a la vida marina. La velocidad, la estabilidad y la maniobrabilidad son fundamentales: los pasajeros esperan encuentros cercanos sin mareos.'
    - '**Las empresas de turismo de aventura** ofrecen excursiones de exploración costera, visitas a cuevas y experiencias con fauna marina. Sus barcos navegan por entornos diversos, desde mar abierto hasta calas poco profundas, lo que requiere diseños de casco versátiles y una construcción fiable.'
    - 'En todos los segmentos, la resistencia a la corrosión, la eficiencia de combustible y la comodidad de los pasajeros son las principales preocupaciones. Un barco que falla o requiere reparaciones frecuentes significa pérdida de ingresos, excursiones canceladas y daño a la reputación.'
content_solution:
  tagline: Nuestra solución
  title: 'RIBs de grado turístico<br />y equipo de flota'
  subtitle: 'Paddle Board Overstock ofrece tanto barcos RIB comerciales para operaciones de pasajeros como equipo de flota (SUPs, kayaks, inflables) para programas de actividades en resorts, todo de un único proveedor.'
  list:
    - 'RIBs comerciales de pasajeros de 4,8 m a 8 m — configurados para traslados entre islas, excursiones de snorkel y avistamiento de fauna'
    - 'Asientos cómodos con respaldos y toldo solar: comodidad para los pasajeros en excursiones de 1-2 horas'
    - 'Manga ancha y casco en V profunda para estabilidad: reduce los mareos y aumenta la confianza de los pasajeros'
    - 'Opciones de motor silencioso para el avistamiento de fauna: mínima perturbación de los animales marinos'
    - 'Escalera de buceo y plataforma de baño: esenciales para excursiones de snorkel y natación'
    - 'Personalización de marca y combinaciones de colores: el logotipo de su empresa y la librea de su flota en cada embarcación'
    - 'Precios de flota para pedidos de RIB al por mayor: especificaciones coherentes en operaciones de varias embarcaciones'
    - 'Tablas de SUP, kayaks y barcos inflables para programas de actividades de los huéspedes en el resort'
    - 'Soporte de repuestos y mantenimiento: minimiza el tiempo de inactividad en temporadas turísticas altas'
content_segments:
  tagline: Segmentos turísticos
  title: 'Soluciones de turismo marino<br />según el tipo de operación'
  subtitle: 'Las distintas operaciones turísticas requieren configuraciones de barco diferentes. Paddle Board Overstock asigna el RIB adecuado a su aplicación específica.'
  items:
    - title: Operadores de traslado insular
      subtitle: 'Maldivas, Filipinas, Indonesia, Tailandia: transporte diario de huéspedes'
      description: 'Los operadores de turismo insular del Sudeste Asiático y Maldivas realizan traslados diarios de pasajeros entre aeropuertos, resorts y puntos de buceo, a menudo más de 300 días al año. El barco es la columna vertebral de la experiencia del huésped. Una avería significa huéspedes varados, reservas canceladas y daños a la reputación. Estos operadores necesitan barcos que sobrevivan al uso intensivo en ubicaciones remotas donde el soporte de mantenimiento es limitado y las piezas difíciles de conseguir.'
      features:
        - 'Construcción de grado comercial diseñada para más de 300 días de operación al año'
        - 'Asientos de banco cómodos con respaldos para 8-16 pasajeros'
        - 'Toldo T-top o bimini para protección del sol tropical y las salpicaduras'
        - 'Plataforma de embarque amplia para facilitar el acceso de los huéspedes con equipaje'
        - 'Compartimentos de almacenamiento seco para bolsas de huéspedes y provisiones del resort'
        - 'Fueraborda de 4 tiempos eficiente en combustible: bajo coste operativo por trayecto'
        - 'Tubos de Hypalon de uso intensivo para una vida útil de 5-8 años en condiciones tropicales'
        - 'Diseño de fácil mantenimiento: componentes accesibles para el servicio en ubicaciones remotas'
    - title: Operadores de avistamiento de ballenas
      subtitle: 'Capacidad de alta mar, velocidad hasta las zonas de avistamiento, plataforma estable'
      description: 'El avistamiento de ballenas es un segmento turístico estacional pero de alto valor en regiones como Hervey Bay (Australia), Kaikoura (Nueva Zelanda), Baja California (México) y las Azores. Los operadores deben llegar rápidamente a las zonas de avistamiento en alta mar antes de que las ballenas se sumerjan o se alejen, mantener una plataforma estable durante periodos prolongados de observación y operar en silencio para no molestar a los mamíferos marinos. La comodidad de los pasajeros durante excursiones de 2-4 horas afecta directamente a las reseñas y a las reservas repetidas. Un barco lento o inestable significa avistamientos perdidos y excursiones reembolsadas.'
      features:
        - 'Configuraciones RIB de 7-10 m para capacidad de alta mar en aguas abiertas'
        - 'Fueraborda de 4 tiempos silencioso: mínima molestia por ruido y vibraciones'
        - 'Casco en V profunda con excelente estabilidad en reposo: plataforma de observación cómoda'
        - 'Plataforma de observación en proa con pasamanos para la fotografía de los huéspedes'
        - 'Protección meteorológica completa: T-top o consola cerrada para condiciones de alta mar'
        - 'Asientos ergonómicos diseñados para la comodidad en excursiones de 2-4 horas'
        - 'Materiales de calidad marina para exposición prolongada al agua salada y resistencia a los rayos UV'
    - title: Operadores de avistamiento de delfines
      subtitle: 'Persecución rápida, gran capacidad de pasajeros, aproximación silenciosa'
      description: 'El avistamiento de delfines requiere un equilibrio diferente de capacidades. Los delfines son más rápidos y juguetones que las ballenas: los barcos deben acelerar rápidamente, maniobrar con precisión y acercarse a los grupos sin asustarlos. Estas excursiones suelen transportar más pasajeros por trayecto y operan más cerca de la costa. La operación silenciosa es fundamental: los delfines acostumbrados a motores ruidosos evitan los barcos, lo que reduce la tasa de avistamientos. Los operadores también necesitan barcos fiables para los turnos diarios múltiples en las temporadas turísticas altas.'
      features:
        - 'RIB de 5,5-8 m para agilidad, velocidad y acceso a aguas poco profundas'
        - 'Aceleración rápida para alcanzar a las manadas de delfines activas'
        - 'Escape silencioso y casco de baja vibración para la aproximación cercana'
        - 'Plataforma estable en reposo para observación y fotografía de los huéspedes'
        - 'Gran capacidad de pasajeros (10-18 personas) para excursiones de temporada alta'
        - 'Zona de asientos en proa para la observación de delfines cerca del agua'
        - 'Calado reducido para operaciones costeras y en bahías'
    - title: Turismo de aventura y ecoturismo
      subtitle: 'Exploración costera, visitas a cuevas, encuentros con fauna'
      description: 'Los operadores de turismo de aventura navegan por entornos diversos: travesías de mar abierto, exploración de lagunas poco profundas, acceso a cuevas costeras y encuentros con fauna marina. Sus barcos necesitan versatilidad para condiciones variables del mar, durabilidad para el uso en ubicaciones remotas y calado reducido para acceder a calas protegidas y playas. La fiabilidad del equipo es primordial: una avería en una ubicación remota puede arruinar una excursión y poner en peligro a los huéspedes.'
      features:
        - 'Casco de calado reducido para acceso a lagunas, cuevas y playas'
        - 'Casco reforzado y tubos de Hypalon para durabilidad en entornos mixtos'
        - 'Asientos flexibles: reconfigurables para distintos tipos de excursiones y tamaños de grupo'
        - 'Puntos de montaje para equipo fotográfico y equipos especializados'
        - 'Capacidad de varada fácil en playa: quilla y tubos reforzados'
        - 'Protección meteorológica para la comodidad de los huéspedes en excursiones prolongadas'
    - title: Flotas de actividades de resorts
      subtitle: 'Programas completos de deportes acuáticos — RIBs, SUPs, kayaks, seguridad'
      description: 'Los resorts que ofrecen deportes acuáticos como parte de la experiencia del huésped necesitan una flota que combine variedad, durabilidad y presentación de marca. La flota suele incluir RIBs para excursiones y traslados de huéspedes, SUPs y kayaks para exploración autónoma, y barcos inflables para excursiones de snorkel en grupo. Gestionar tipos de equipo mixtos en volúmenes de huéspedes estacionales requiere calidad constante, fácil mantenimiento y marca unificada. Una avería o un equipo desgastado afecta directamente a las reseñas de los huéspedes y a los ingresos.'
      features:
        - 'Tenders RIB para excursiones, traslados y salidas de snorkel de huéspedes'
        - 'Tablas de SUP y kayaks para actividades autónomas de los huéspedes'
        - 'Barcos inflables para excursiones en grupo y snorkel de playa a arrecife'
        - 'Personalización de marca completa en todo el equipo: presentación unificada del resort'
        - 'Paquete de equipo de seguridad: chalecos salvavidas, silbatos, primeros auxilios, líneas de flotación'
        - 'Materiales de formación del personal para el manejo de equipos y la seguridad de los huéspedes'
