testimonial:
  quote: Lo que distingue a Paddle Board Overstock es su ciencia de materiales. No se limitan a ensamblar componentes — los compuestos de PVC, los parámetros de soldadura y el apilado estructural se desarrollan internamente. Esa integración vertical se nota en el producto final.
  author: David Park
  title: Director de desarrollo de producto
  company: Bluewater Sports Equipment
  location: Australia

sections:
  - title: Núcleo drop-stitch
    standard: Presión de trabajo de 12-15 PSI
    description: Miles de hilos internos de poliéster conectan las capas superior e inferior, creando una estructura rígida a 12-15 PSI. Es la misma tecnología que se usa en tablas de paddle profesionales y botes de carreras inflables. Nuestra densidad drop-stitch se optimiza por modelo para el equilibrio ideal entre rigidez y peso.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagrama del núcleo drop-stitch
  - title: PVC de grado marino
    standard: Soldado por fusión | Ensayado frente a UV / agua de mar / abrasión
    description: Tejido de PVC laminado multicapa certificado para entornos marinos. Cada capa se suelda por fusión en lugar de pegarse, eliminando el riesgo de delaminación. Ensayado en resistencia UV (ASTM G154, 1.000+ horas), corrosión por agua de mar (ISO 9227) y abrasión (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Capa de PVC
  - title: Tubos de Hypalon
    standard: Caucho CSM | Resistente a UV / productos químicos / temperaturas extremas
    description: Utilizado en los modelos RIB, el caucho Hypalon (CSM) ofrece una resistencia superior a los UV y a los productos químicos en comparación con el PVC estándar. Los tubos de Hypalon mantienen la flexibilidad a temperaturas extremas y resisten la degradación por exposición a combustible y aceite. Todas las costuras se colocan a mano por técnicos certificados.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Suelo Air Deck
    standard: Inflable de alta presión | Sustituye a la madera contrachapada/aluminio
    description: Sistema de suelo inflable de alta presión que sustituye a los suelos tradicionales de contrachapado o listones de aluminio. Reduce el tiempo de montaje, el peso total y el volumen de almacenamiento, a la vez que proporciona rigidez suficiente para estar de pie, pescar y caminar. Ensayado para soportar una carga repartida de 200+ kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Suelo inflable

