testimonial:
  quote: Lo que me convenció fue la construcción. Costuras soldadas por fusión en lugar de pegamento, un núcleo drop-stitch que se siente sólido a 15 PSI, y sin balanceo cuando retrocedo para girar. Dos años después, ningún problema.
  author: Marta Keller
  title: Comprador verificado
  company: Remera de turismo lacustre
  location: Alemania
sections:
  - title: Núcleo Drop-Stitch
    standard: Presión de funcionamiento 12-15 PSI
    description: Miles de hilos internos de poliéster conectan las capas superior e inferior, creando una estructura rígida a 12-15 PSI. Esta es la misma tecnología utilizada en tablas de remo profesionales. Nuestra densidad drop-stitch está optimizada por modelo para el equilibrio ideal entre rigidez y peso.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagrama del núcleo DS
  - title: Grado Marino PVC
    standard: Soldado por fusión | UV / agua salada / probado contra abrasión
    description: Tela laminada de múltiples capas PVC clasificada para entornos marinos. Cada capa está soldada por fusión en lugar de pegada, eliminando riesgos de delaminación. Probada por resistencia a UV (1,000+ horas), corrosión por agua salada y abrasión.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Capa PVC
  - title: Sistema de cubierta EVA
    standard: Agarre, comodidad, patrones de la serie de arte
    description: La espuma de cubierta completa EVA proporciona agarre, amortiguación y el aspecto característico de la serie de arte. Paneles cortados con precisión se colocan en patrones sin costuras — sin gráficos impresos que se puedan rayar, sin necesidad de cera.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Cubierta EVA
  - title: Sistema de rieles de triple capa
    standard: Fusionado por unión | Sobreconstruido en la zona de mayor estrés
    description: Las bandas del rail están fusionadas por triple capa y envueltas alrededor del borde de la tabla, la zona de mayor estrés en cualquier inflable. Aquí es donde las tablas baratas fallan primero; las nuestras están sobreconstruidas.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistema de Rail
