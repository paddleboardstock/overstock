hero:
  tagline: Nuestro equipo
  title: 'Las personas detrás de Paddle Board Overstock<br />— Ingeniería para la libertad en el agua'
  subtitle: 'Fundada en 2012 en Qingdao (China), Paddle Board Overstock fue creada por ingenieros marinos, científicos de materiales y entusiastas de los deportes acuáticos que creían en hacer accesibles en todo el mundo las embarcaciones inflables de grado profesional.'
  image:
    src: /images/team-all.webp
    alt: Foto del equipo completo de Paddle Board Overstock — ingeniería, producción y liderazgo
founding:
  tagline: Nuestra fundación
  title: 'De un taller costero<br />a una instalación de 12.000 m²'
  subtitle: 'Paddle Board Overstock fue fundada por un equipo de ingenieros marinos con décadas de experiencia combinada en el diseño de botes inflables, la fabricación de PVC/Hypalon y la producción mundial de equipos marinos.'
  items:
    - title: 'Fundada: 2012'
      description: 'Establecida en Qingdao (China), un importante centro marítimo con una profunda tradición de construcción naval.'
      icon: tabler:calendar
    - title: '200-300 empleados'
      description: 'Incluidos más de 50 ingenieros de I+D, especialistas en control de calidad y técnicos de producción.'
      icon: tabler:users
    - title: 'Instalación de 12.000 m²'
      description: 'Planta de fabricación dedicada con 6 líneas de producción para RIB, botes inflables y tablas de SUP.'
      icon: tabler:building-factory
    - title: 'Más de 50 países atendidos'
      description: 'Exportamos a Europa, América, Oriente Medio, Asia-Pacífico y África.'
      icon: tabler:globe
leadership:
  tagline: Liderazgo
  title: 'Dirección de gestión e ingeniería'
  subtitle: 'Nuestro equipo directivo reúne una profunda experiencia en ingeniería marina, comercio internacional y gestión de calidad.'
  columns: 3
  items:
    - title: 'Fundador y CEO'
      name: 'Toby Liu'
      description: 'Más de 15 años en fabricación marina. Dirigió anteriormente el departamento de I+D de un importante fabricante chino de embarcaciones. Posee varias patentes en el diseño de botes inflables.'
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: 'Ingeniero jefe'
      name: 'Zhang Wei'
      description: 'Más de 20 años en la fabricación de PVC/Hypalon y el diseño de cascos en V profunda. Ex director técnico de una empresa europea de ingeniería marina.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Jefe de I+D'
      name: 'Chen Ming'
      description: 'Doctorado en Ciencia de Materiales. Especialista en tecnología drop-stitch y procesos de soldadura de alta frecuencia. Más de 10 años en compuestos textiles.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Director de producción'
      name: 'Liu Qiang'
      description: 'Más de 18 años en fabricación ajustada y optimización de líneas de producción. Cinturón Negro Six Sigma. Implementó sistemas de calidad ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Responsable de calidad'
      name: 'Wang Fang'
      description: 'Más de 12 años en el control de calidad marino. Auditor certificado CE e ISO. Supervisa las pruebas de cada lote de producción.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Director de ventas y operaciones'
      name: 'Helen Lee'
      description: 'Más de 15 años en comercio internacional B2B. Gestionó alianzas OEM/ODM en más de 30 países. Habla 4 idiomas con fluidez.'
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filosofía de diseño
  title: 'Diseño impulsado por la ingeniería<br />— Cada detalle importa'
  subtitle: 'Nuestra filosofía de ingeniería se basa en tres principios que guían cada producto que construimos.'
  list:
    - 'Fiabilidad ante todo: Cada producto de Paddle Board Overstock se prueba para resistir las condiciones del mundo real, desde operaciones de rescate en aguas frías hasta alquileres en resorts tropicales. Sobre-ingeniería donde más importa.'
    - 'Precisión de fabricación: Nuestras instalaciones utilizan corte CNC, soldadura de alta frecuencia y pruebas de presión automatizadas. Cada costura, cada válvula y cada accesorio cumple especificaciones documentadas.'
    - 'Innovación continua: Nuestro equipo de I+D evalúa continuamente nuevos materiales, métodos de producción y mejoras de diseño. No esperamos a que surjan los problemas — los anticipamos.'
cta:
  title: '¿Quieres hablar de un proyecto con nuestro equipo?'
  subtitle: 'Nuestros ingenieros están listos para asesorarte en la selección de productos, la personalización y las alianzas OEM/ODM.'
  actions:
    - variant: primary
      text: Contacta con nuestro equipo
      href: /contact
    - text: Ver nuestros productos
      href: /products