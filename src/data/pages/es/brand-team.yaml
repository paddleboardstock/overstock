hero:
  tagline: Nuestro equipo
  title: Las Personas Detrás de Paddle Board Overstock<br />— Ingeniería de la Libertad en el Agua
  subtitle: Fundada en 2012 en Weihai, China, Paddle Board Overstock fue creada por ingenieros marinos, científicos de materiales y entusiastas de los deportes acuáticos que creían en hacer que las tablas de paddle inflables de nivel profesional fueran accesibles en todo el mundo.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock foto completa del equipo — ingeniería, producción y liderazgo
founding:
  tagline: Nuestra Fundación
  title: Desde un Taller Costero<br />hasta una Instalación de 12.000 m²
  subtitle: Paddle Board Overstock fue fundada por un equipo de ingenieros marinos con décadas de experiencia combinada en diseño de SUP inflables, construcción de drop-stitch y fabricación global de deportes acuáticos.
  items:
    - title: 'Fundada: 2012'
      description: Establecida en Weihai, China — un importante centro marítimo con una profunda tradición en construcción naval.
      icon: tabler:calendar
    - title: 200-300 Empleados
      description: Incluyendo 14+ ingenieros de I+D, especialistas en control de calidad y técnicos de producción.
      icon: tabler:users
    - title: Instalación de 12.000 m²
      description: Planta de fabricación dedicada con 6 líneas de producción para tablas SUP y accesorios.
      icon: tabler:building-factory
    - title: 50+ Países Atendidos
      description: Exportando a Europa, América, Medio Oriente, Asia-Pacífico y África.
      icon: tabler:globe
leadership:
  tagline: Liderazgo
  title: Liderazgo en Gestión e Ingeniería
  subtitle: Nuestro equipo de liderazgo reúne una profunda experiencia en ingeniería marina, comercio internacional y gestión de calidad.
  columns: 3
  items:
    - title: Fundador y CEO
      name: Toby Liu
      description: 15+ años en fabricación marina. Anteriormente lideró I+D en un importante fabricante marino chino. Posee múltiples patentes en diseño de productos inflables.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Ingeniero Jefe
      name: Zhang Wei
      description: 20+ años en fabricación de polímeros y diseño de estructuras inflables. Ex director técnico en una empresa europea de ingeniería marina.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Jefe de I+D
      name: Chen Ming
      description: Doctorado en Ciencia de Materiales. Especializado en tecnología drop-stitch y procesos de soldadura de alta frecuencia. 10+ años en composites textiles.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director de Producción
      name: Liu Qiang
      description: 18+ años en manufactura esbelta y optimización de líneas de producción. Construyó los sistemas de calidad detrás de nuestra tasa de defectos del 99,3%.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Gerente de Calidad
      name: Wang Fang
      description: 12+ años en control de calidad marina. Supervisa pruebas de presión, costura y carga para cada lote de producción antes de su lanzamiento.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Director de Ventas y Operaciones
      name: Helen Lee
      description: 15+ años en comercio electrónico internacional y logística. Envía tablas a remadores en 50+ países. Fluida en 4 idiomas.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filosofía de Diseño
  title: Diseño Liderado por Ingeniería<br />— Cada Detalle Importa
  subtitle: Nuestra filosofía de ingeniería se centra en tres principios que guían cada producto que construimos.
  list:
    - 'Fiabilidad Primero: Cada producto Paddle Board Overstock se prueba para soportar condiciones del mundo real — desde expediciones en aguas frías hasta alquileres en playas tropicales. Ejecutamos sobre ingeniería donde más importa.'
    - 'Precisión en la Manufactura: Nuestras instalaciones usan corte CNC, soldadura de alta frecuencia y pruebas automatizadas de presión. Cada costura, cada válvula, cada accesorio cumple con las especificaciones documentadas.'
    - 'Innovación Continua: Nuestro equipo de I+D evalúa constantemente nuevos materiales, métodos de producción y mejoras de diseño. No esperamos a que surjan problemas — los anticipamos.'
cta:
  title: ¿Quieres discutir un proyecto con nuestro equipo?
  subtitle: Nuestro equipo está listo para ayudarte a elegir la tabla, accesorios y equipo adecuados para tu estilo de remo.
  actions:
    - variant: primary
      text: Contacta a nuestro equipo
      href: /contact
    - text: Ver nuestros productos
      href: /products
