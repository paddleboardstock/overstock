hero:
  tagline: Cumplimiento CE y RCD
  title: Cumplimiento CE de embarcaciones RIB<br />y documentación técnica
  subtitle: Las embarcaciones RIB y las embarcaciones inflables Paddle Board Overstock están diseñadas y documentadas para cumplir con el mercado de la UE según la Directiva sobre embarcaciones de recreo 2013/53/UE. Desde la evaluación de riesgos hasta la Declaración de conformidad, proporcionamos documentación de cumplimiento específica del modelo para cada casco.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Documentación y certificación de cumplimiento CE de embarcaciones RIB
direct_answer: Paddle Board Overstock proporciona documentación de cumplimiento RCD 2013/53/UE específica del modelo para embarcaciones RIB y embarcaciones inflables, incluidos archivos técnicos, declaraciones de conformidad, placas de construcción y manuales del propietario, todos alineados con EN ISO 6185, ISO 12217 y las normas armonizadas aplicables.
