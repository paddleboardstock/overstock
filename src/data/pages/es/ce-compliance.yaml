content_scope:
  tagline: Alcance del cumplimiento
  title: ¿Qué productos necesitan<br />cumplimiento RCD?
  subtitle: La Directiva sobre embarcaciones de recreo 2013/53/UE se aplica a las embarcaciones de recreo con una longitud de casco de entre 2,5 m y 24 m. Comprender el alcance es el primer paso hacia el cumplimiento.
  items:
    - title: Embarcaciones semirrígidas (2,5–24 m)
      description: Los botes inflables rígidos con esloras de casco de 2,5 ma 24 m se incluyen en el RCD. Las categorías de diseño A a D se aplican dependiendo de las condiciones del mar previstas y la fuerza máxima del viento.
      icon: tabler:sailboat
    - title: Embarcaciones neumáticas (menos de 2,5 m)
      description: Los botes inflables pequeños y los botes inflables de menos de 2,5 m pueden estar parcialmente exentos del RCD, pero aún requieren el marcado CE según otras directivas aplicables y las normas de construcción EN ISO 6185.
      icon: tabler:sailboat
    - title: Tablas y accesorios de SUP
      description: Las tablas de paddle surf están fuera del alcance de la RCD. Sin embargo, los dispositivos de flotación personal (PFD) asociados requieren la marca CE según el Reglamento de EPI (UE) 2016/425 con aprobación USCG Tipo III/V cuando corresponda.
      icon: tabler:swimming
    - title: Barcos parcialmente terminados
      description: Las embarcaciones entregadas sin motor ni instalaciones específicas requieren una Declaración del Constructor para embarcaciones parcialmente terminadas, con pleno cumplimiento del RCD completada por el constructor o importador final.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistema de confianza de tres capas
  title: 'Información de cumplimiento<br />: compartida al nivel adecuado'
  subtitle: No todos los datos de cumplimiento pertenecen a un sitio web público. Seguimos un enfoque de tres niveles que protege la propiedad intelectual y al mismo tiempo genera confianza en los compradores.
  items:
    - title: 'Capa 1: sitio web público'
      description: Estándares referenciados, rutas de conformidad explicadas, tipos de documentos enumerados, alcance de certificación por familia de modelos. Sin certificados reales, datos de prueba ni detalles de ingeniería patentados.
      icon: tabler:world
    - title: 'Capa 2: intercambio posterior a la consulta'
      description: 'Después de una consulta calificada: muestra de declaración de conformidad redactada, fotografía de la placa del constructor, lista de estándares aplicables, lista de verificación de cumplimiento y resúmenes de certificación de materiales, compartidos bajo términos de uso legítimo.'
      icon: tabler:mail
    - title: 'Capa 3: NDA/Etapa de pedido'
      description: Archivo técnico completo, evaluaciones de riesgos, cálculos de estabilidad, informes de prueba, registros de lotes de materiales y documentación de trazabilidad de la producción, compartidos únicamente bajo NDA con compradores confirmados.
      icon: tabler:lock
content_standards:
  tagline: Normas aplicables
  title: Normas ISO y EN<br />Construimos para
  subtitle: Nuestros productos están diseñados y probados según las normas armonizadas del RCD. Se hace referencia a los números y nombres estándar; Los textos estándar completos conservan los derechos de autor ISO.
  items:
    - title: EN ISO 6185-3
      description: 'Embarcaciones neumáticas. Parte 3: Embarcaciones con una potencia máxima de motor de 15 kW o más. Requisitos de construcción, estabilidad, flotabilidad y recuperación de hombre al agua para semirrígidas.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Embarcaciones neumáticas — Parte 4: Embarcaciones con una potencia máxima de motor de 15 kW y superior o igual a 4,5 kW. Requisitos estructurales y de estabilidad adicionales.'
      icon: tabler:file-text
    - title: Serie ISO 12215
      description: Pequeñas embarcaciones — Construcción del casco y cuartones. Diseño estructural de casco, cubierta y mamparas para cascos RIB de fibra de vidrio y aluminio.
      icon: tabler:ruler-2
    - title: EN ISO 10240:2020
      description: Embarcaciones pequeñas — Manual del propietario. Contenido y formato requeridos para el manual del propietario que acompaña a cada embarcación RIB entregada en la UE.
      icon: tabler:book
    - title: EN ISO 14945:2021
      description: 'Pequeñas embarcaciones: placa de construcción. Información que se marcará en la placa de construcción adherida permanentemente a cada embarcación.'
      icon: tabler:badge
    - title: ISO 8666
      description: Embarcaciones pequeñas — Datos principales. Medidas y parámetros estandarizados para una especificación consistente en toda la documentación del producto.
      icon: tabler:dimensions
content_process:
  tagline: Proceso de cumplimiento
  title: Cumplimiento CE de 6 pasos<br />Flujo de trabajo
  subtitle: 'Desde el alcance del proyecto hasta la trazabilidad a nivel de serie: cada modelo RIB sigue una ruta de cumplimiento definida.'
  steps:
    - number: '01'
      title: Alcance y clasificación del proyecto
      description: Defina el modelo de RIB, la categoría de diseño (A/B/C/D), el número máximo de personas, la carga útil, la potencia del motor y el mercado objetivo. Determinar si se aplica el RCD y qué módulo de evaluación de la conformidad se requiere.
      timeline: 2-3 días
    - number: '02'
      title: Identificación de requisitos aplicables
      description: Identifique todos los requisitos esenciales de seguridad aplicables del Anexo I del RCD, las normas armonizadas pertinentes (EN ISO 6185, 12215, 10240, 14945) y cualquier requisito nacional adicional para el mercado objetivo.
      timeline: 3 a 5 días
    - number: '03'
      title: Diseño y documentación técnica
      description: 'Crear el Archivo Técnico Maestro: planos de disposición general, cálculos de estabilidad y flotabilidad, evaluación de riesgos, especificaciones de materiales y análisis de seguridad de sistemas (combustible, eléctricos, dirección).'
      timeline: 10 a 15 días
    - number: '04'
      title: Verificación y pruebas de productos
      description: 'Realice una verificación física: pruebas de presión a 1,25 veces la presión nominal durante 24 a 48 horas, pruebas de estabilidad y flotabilidad, pruebas de carga y puesta en servicio de sistemas. Registre todos los resultados de las pruebas por casco.'
      timeline: 5 a 7 días
    - number: '05'
      title: Documentación de marcado y entrega
      description: Coloque el marcado CE, la placa del fabricante (EN ISO 14945) y HIN/CIN (número de identificación del casco). Prepare la Declaración de conformidad de la UE, el manual del propietario (EN ISO 10240) y la lista de verificación de cumplimiento.
      timeline: 2-3 días
    - number: '06'
      title: Trazabilidad a nivel de serie
      description: Cada casco recibe un Registro de casco único que lo vincula con el Archivo técnico maestro, el lote de producción, los certificados de materiales, los resultados de las pruebas y la configuración final. Registros conservados durante más de 10 años por RCD.
      timeline: En curso
content_document_cards:
  tagline: Tipos de documentos
  title: Documento de Cumplimiento<br />Tarjetas
  subtitle: Estos son los tipos de documentos que preparamos y mantenemos para cada modelo de RIB con certificación CE. Las muestras están disponibles previa consulta calificada.
  items:
    - title: Certificado de cumplimiento CE/RCD
      description: Certificado específico del modelo que confirma que la embarcación cumple con todos los requisitos esenciales de seguridad aplicables del RCD 2013/53/UE, emitido por el fabricante con la participación del organismo notificado cuando sea necesario.
      icon: tabler:certificate
    - title: Declaración de conformidad de la UE (DoC)
      description: Declaración firmada por el fabricante o representante autorizado, que enumera las directivas, normas, módulo de conformidad y detalles del organismo notificado aplicables. Requerido para todos los modelos comercializados en el mercado de la UE.
      icon: tabler:file-check
    - title: Placa de construcción (EN ISO 14945)
      description: Placa fijada permanentemente que muestra el número máximo de personas, la potencia máxima del motor, la categoría de diseño y la identificación del fabricante. Debe permanecer legible durante la vida útil de la embarcación.
      icon: tabler:badge
    - title: Manual del propietario (EN ISO 10240)
      description: Manual completo que cubre operación segura, procedimientos de emergencia, programas de mantenimiento y advertencias de seguridad. Obligatorio para todas las RIB entregadas en la UE.
      icon: tabler:book
    - title: Informes de prueba e inspección ISO
      description: Registros de pruebas de presión (1,25x / 24–48 h), resultados de pruebas de estabilidad y flotabilidad, certificados de pruebas de materiales e informes de verificación dimensional, todos vinculados a números de casco específicos.
      icon: tabler:test-pipe
    - title: Registros de trazabilidad de materiales
      description: Trazabilidad a nivel de lotes para telas de tubos, adhesivos, fibra de vidrio y herrajes. Vincula cada unidad de producción con los certificados de materiales entrantes y los resultados de la inspección IQC.
      icon: tabler:link
    - title: Inspección de calidad y registros de control de calidad
      description: Lista de verificación de calidad de 100 puntos por unidad, registros de control de calidad en proceso, informes de no conformidad y acciones correctivas. Parte de la cadena de trazabilidad de la producción.
      icon: tabler:clipboard-check
    - title: Paquete de documentos del proyecto
      description: Paquete de documentación por casco que incluye registro de configuración final, detalles de instalación del motor y equipo, lista de verificación de puesta en servicio y documentación de entrega.
      icon: tabler:package
content_design_categories:
  tagline: Categorías de diseño de RCD
  title: Categoría de diseño A–D<br />— Qué significan
  subtitle: El RCD asigna categorías de diseño basadas en la fuerza máxima del viento y la altura significativa de las olas que la embarcación está diseñada para soportar.
  items:
    - title: 'Categoría A: Océano'
      description: Diseñado para viajes prolongados donde la fuerza del viento puede exceder Beaufort 8 (>40 nudos) y la altura significativa de las olas puede exceder los 4 m. Requiere la verificación estructural y de estabilidad más rigurosa.
      icon: tabler:ripple
    - title: 'Categoría B: alta mar'
      description: Diseñado para viajes en alta mar con fuerza de viento de hasta Beaufort 8 (≤40 nudos) y una altura de ola significativa de hasta 4 m. Apto para aguas costeras y semiexpuestas.
      icon: tabler:anchor
    - title: 'Categoría C: costera'
      description: Diseñado para viajes costeros con fuerza de viento de hasta Beaufort 6 (≤27 nudos) y altura de ola significativa de hasta 2 m. La mayoría de las RIB recreativas entran en esta categoría.
      icon: tabler:sun
    - title: Categoría D - Protegido
      description: Diseñado para aguas abrigadas con fuerza de viento de hasta Beaufort 4 (≤16 nudos) y altura de ola significativa de hasta 0,3 m. Lagos, ríos y puertos protegidos.
      icon: tabler:pool
content_hin:
  tagline: Identificación artesanal
  title: HIN/CIN y placa de construcción
  subtitle: Cada embarcación RIB requiere un Número de identificación del casco (HIN) o un Número de identificación de la embarcación (CIN) y una placa de construcción según los requisitos de EN ISO 14945 y RCD.
  items:
    - title: Número de identificación del casco (HIN)
      description: Un código único de 14 caracteres marcado permanentemente en el lado de estribor del espejo de popa, que codifica el código del fabricante (MIC), el año del modelo, el año de producción y el número de serie. Requerido para ingresar al mercado de la UE.
      icon: tabler:hash
    - title: Número de identificación de embarcación (CIN)
      description: Según EN ISO 10087, un número de identificación secundario oculto colocado en un lugar oculto con fines antirrobo y de trazabilidad.
      icon: tabler:eye-off
    - title: Contenido de la placa del constructor
      description: Número máximo de personas, potencia máxima del motor (kW), carga máxima (kg), categoría de diseño, nombre del fabricante y marcado CE, todo ello expuesto permanentemente en una placa resistente a la corrosión.
      icon: tabler:badge
content_tech_file:
  tagline: Estructura del expediente técnico
  title: Expediente técnico maestro<br />y registro de casco
  subtitle: 'Nuestro sistema de documentación sigue una estructura de dos niveles: el Archivo Técnico Maestro para cada familia de modelos y los Registros de Casco individuales para cada barco producido.'
  items:
    - title: Archivo Técnico Maestro
      description: 'Contiene la documentación de cumplimiento completa para una familia de modelos: disposición general, evaluación de riesgos, cálculos de estabilidad/flotabilidad, especificaciones de materiales, estándares aplicables y registros de evaluación de conformidad. Retenido por más de 10 años.'
      icon: tabler:folder
    - title: Registro de casco (trazabilidad por barco)
      description: 'Cada casco tiene un registro único que lo vincula al Archivo Técnico Maestro: HIN, fecha de producción, lote de tubos, certificados de materiales, resultado de la prueba de presión, configuración final, instalación del motor y destino de entrega.'
      icon: tabler:file-description
    - title: Paquete de cumplimiento del cliente
      description: Paquete de entrega por casco que incluye declaración de conformidad, fotografía de la placa del fabricante, manual del propietario, resumen de pruebas y hoja de configuración final, incluido con cada RIB enviada a la UE.
      icon: tabler:package
content_material_cert:
  tagline: Certificación de materiales
  title: Trazabilidad de materiales y<br />evidencia de certificación
  subtitle: >-
    Los RIB de calidad comienzan con materiales controlados y procesos documentados. A continuación,
    cómo organizamos la certificación de materiales para cada grupo de componentes críticos.
  items:
    - title: Trazabilidad del material de tubos inflables
      description: >-
        Los materiales de tubos PVC y CSM/Hypalon se seleccionan según el uso previsto, las
        condiciones climáticas y el mercado objetivo. Los datos técnicos del proveedor (TDS), la
        información de lote de material, la trazabilidad del tejido, los informes de ensayos UV e
        intemperie y las declaraciones REACH/SVHC están disponibles dentro del alcance documental
        acordado del proyecto.
      icon: tabler:circle
    - title: Trazabilidad del aluminio marino
      description: >-
        En los proyectos de RIB con casco de aluminio, el grado de aleación, el espesor y los lotes
        de material se controlan según la especificación aprobada. Los certificados de ensayo de
        material (MTC/MTR), la documentación EN 10204 3.1, los informes de composición química y
        propiedades mecánicas y la trazabilidad de colada/lote se suministran según lo acordado.
      icon: tabler:rectangle
    - title: Casco GRP — control de material y proceso
      description: >-
        En los RIB con casco de fibra de vidrio, el gelcoat, la resina, el refuerzo de fibra de
        vidrio y los materiales del núcleo se gestionan mediante especificaciones controladas. Los
        TDS/SDS de materiales, los registros de lote, las especificaciones de laminado y los registros
        de curado y control de taller están disponibles previo acuerdo del proyecto.
      icon: tabler:layers-subtract
    - title: Soporte documental de componentes
      description: >-
        Para los componentes seleccionados — materiales de cubierta EVA, asientos, herrajes de acero
        inoxidable, sistemas de combustible, equipos eléctricos y accesorios marinos — la
        documentación aplicable del proveedor se coordina según la configuración final y los
        requisitos del mercado de destino.
      icon: tabler:package
    - title: Aviso sobre el alcance de la conformidad
      description: >-
        Los certificados, informes de ensayo y documentos de conformidad se aplican únicamente al
        modelo de producto, material, componente, lote de producción o alcance de proyecto indicado
        en el documento correspondiente. Contáctenos con su mercado objetivo, uso previsto y
        requisitos técnicos para confirmar el paquete documental aplicable antes del pedido.
      icon: tabler:info-circle

faq:
  title: 'Cumplimiento CE: preguntas frecuentes'
  questions:
    - q: ¿Todos los barcos Paddle Board Overstock RIB tienen certificación CE para el mercado de la UE?
      a: Las embarcaciones RIB de nuestro catálogo están diseñadas y documentadas para cumplir con RCD 2013/53/UE según las directivas de la UE aplicables. El marcado CE se aplica por modelo y por configuración. Contáctenos para obtener un documento de alcance de cumplimiento específico del modelo.
    - q: ¿Cuál es la diferencia entre el cumplimiento de RCD y el marcado CE?
      a: RCD (Directiva de embarcaciones de recreo 2013/53/UE) es la legislación de la UE que establece los requisitos esenciales de seguridad. El marcado CE es el símbolo visual colocado en un producto que ha sido evaluado y confirmado que cumple con esos requisitos. Un producto debe cumplir con el RCD antes de poder llevar la marca CE.
    - q: ¿Proporcionan declaraciones de conformidad con cada barco?
      a: Sí. Cada embarcación RIB entregada al mercado de la UE incluye una Declaración de conformidad de la UE específica del modelo que enumera las directivas aplicables, las normas armonizadas, el módulo de evaluación de la conformidad y los detalles del organismo notificado.
    - q: ¿Qué módulo de evaluación de la conformidad utiliza Paddle Board Overstock?
      a: El módulo depende de la categoría de diseño y del tipo de embarcación. La mayoría de los modelos RIB en la categoría de diseño C utilizan el Módulo A (control de producción interno). Para embarcaciones de categoría de diseño A/B o configuraciones específicas, se pueden aplicar los módulos B+C o B+D con la participación del organismo notificado. Asesoramos sobre el módulo adecuado por proyecto.
    - q: ¿Puede compartir documentación de cumplimiento antes de realizar un pedido?
      a: Después de una consulta calificada, compartimos un documento de alcance de cumplimiento que enumera los estándares aplicables, la ruta de conformidad y los tipos de documentos disponibles para el modelo que está evaluando. Los archivos técnicos completos se comparten bajo NDA después de la confirmación del pedido.
    - q: ¿Qué es un número de identificación del casco (HIN) y está incluido?
      a: El HIN es un identificador único de 14 caracteres marcado permanentemente en cada embarcación, que codifica el código del fabricante (MIC), la designación del modelo, el año de producción y el número de serie. Es obligatorio para todas las embarcaciones RIB comercializadas en el mercado de la UE y está incluido en todas las RIB Paddle Board Overstock.
    - q: ¿Cuánto tiempo se conservan los archivos técnicos?
      a: Según los requisitos del RCD 2013/53/UE, el fabricante debe conservar el expediente técnico durante al menos 10 años a partir de la última fecha de introducción del producto en el mercado. Paddle Board Overstock mantiene la documentación técnica completa de todos los modelos producidos.
    - q: ¿Ayudan a los importadores con las obligaciones bajo el RCD?
      a: 'Sí. Proporcionamos el paquete de documentación que los importadores de la UE necesitan para cumplir con sus obligaciones: acceso al archivo técnico, DoC, placa de construcción, manual del propietario y registros de trazabilidad del producto. Las responsabilidades del importador según el RCD están claramente documentadas en nuestra guía de cumplimiento.'
