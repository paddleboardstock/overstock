certifications:
  - title: Certificación CE (UE 2016/425)
    standard: Reglamento EPI (UE) 2016/425 | EN ISO 12402
    description: Todo el equipo de seguridad Paddle Board Overstock cumple los requisitos de marcado CE conforme al Reglamento europeo de equipos de protección individual. Cada producto es probado de forma independiente por TÜV Rheinland, un organismo notificado europeo. Nuestros barcos neumáticos y RIB cumplen los requisitos de las categorías C y D de la Directiva de Embarcaciones de Recreo 2013/53/UE (RCD).
    body: La certificación CE cubre los requisitos esenciales de salud y seguridad para los dispositivos de flotación personal y las embarcaciones neumáticas. TÜV Rheinland audita anualmente nuestra planta de producción para verificar el cumplimiento continuo.
  - title: SOLAS — Seguridad de la Vida Humana en el Mar
    standard: SOLAS Capítulo III | Código LSA
    description: El chaleco salvavidas Pro cumple la normativa SOLAS para operaciones marítimas offshore y comerciales. Probado para una retención de flotabilidad de 24 horas, inflado automático al sumergirse y rendimiento con estados de mar hasta fuerza 5. Cumple los requisitos del Capítulo III para chalecos salvavidas en buques comerciales.
    body: La aprobación SOLAS exige pruebas independientes de un organismo notificado sobre flotabilidad, resistencia, visibilidad y activación automática. Nuestro chaleco salvavidas Pro cuenta con la homologación de tipo SOLAS completa con certificación MED.
  - title: USCG Tipo III / Tipo V
    standard: 46 CFR Parte 160 | Aprobación USCG
    description: Determinados chalecos salvavidas Paddle Board Overstock cumplen la clasificación de la Guardia Costera de Estados Unidos para dispositivos de Tipo III (ayuda a la flotación) y Tipo V (uso especial). Adecuados para aguas protegidas, navegación costera y operaciones comerciales que exigen chalecos homologados por la USCG.
    body: La aprobación USCG exige pruebas de un laboratorio independiente reconocido por la Guardia Costera. La aprobación de Tipo V incluye diseños híbridos inflables con activación manual o automática.
  - title: Cumplimiento social BSCI
    standard: Código de conducta amfori BSCI
    description: Nuestra fábrica se audita anualmente bajo la iniciativa amfori Business Social Compliance Initiative (BSCI). Esto verifica prácticas laborales éticas, seguridad en el trabajo, horarios laborales justos y gestión ambiental en nuestra planta de producción de 12 000 m².
    body: El cumplimiento de BSCI es un requisito previo para minoristas e importadores europeos. Nuestra valoración BSCI actual es «C» (Bien), auditada por SGS.
  - title: Cumplimiento REACH y RoHS
    standard: Reglamento REACH (CE) 1907/2006 | Directiva RoHS 2011/65/UE
    description: Todos los compuestos de PVC, adhesivos y recubrimientos utilizados en los productos Paddle Board Overstock cumplen el Reglamento europeo REACH de seguridad química y las restricciones de sustancias peligrosas RoHS. Las fichas de datos de seguridad (MSDS) están disponibles para cada línea de productos.
    body: El cumplimiento de REACH garantiza que no haya sustancias SVHC restringidas por encima de los límites de umbral. Pruebas periódicas en laboratorios independientes verifican el cumplimiento continuo de cada lote de producción.
  - title: Gestión de calidad ISO 9001:2015
    standard: ISO 9001:2015 | Certificado por TÜV Rheinland
    description: Nuestro sistema de gestión de calidad está certificado según ISO 9001:2015 por TÜV Rheinland y abarca el diseño, la producción, las pruebas y el servicio posventa. Las auditorías de vigilancia anuales garantizan la mejora continua y el control de procesos.
    body: La certificación ISO 9001 exige políticas de calidad documentadas, auditorías internas, revisiones por la dirección, procedimientos de acciones correctivas y registros de producción trazables.

testimonial:
  quote: Hemos comprado equipo de seguridad a varios proveedores en Asia. Paddle Board Overstock es el único fabricante que entregó desde el principio la documentación CE completa, los certificados SOLAS y los informes de pruebas de terceros, sin que se lo pidiéramos.
  author: Erik Lindström
  title: Oficial de seguridad
  company: Baltic Marine Supply
  location: Finlandia

content_overpressure:
  tagline: Seguridad por sobrepresión
  title: 'Gestión de la presión de los tubos RIB<br />en climas cálidos'
  subtitle: 'La presión de los tubos inflables aumenta con la temperatura. Comprender y gestionar la sobrepresión evita daños y garantiza un funcionamiento seguro en entornos tropicales y desérticos.'
  items:
    - title: 'Válvulas de alivio de sobrepresión Boyle'
      description: 'Los tubos RIB de Paddle Board Overstock están equipados con válvulas de alivio que liberan automáticamente el exceso de presión por encima del máximo nominal. Evita la tensión en las costuras y el posible reventón de los tubos por calentamiento solar.'
      icon: tabler:gauge
    - title: 'Cambio de presión de la mañana al mediodía'
      description: 'Un tubo inflado a 3,5 PSI a 20 °C puede superar los 4,5 PSI con sol a 40 °C. Infle siempre en el extremo inferior del rango recomendado en climas cálidos y deje que la válvula de alivio gestione el exceso de presión.'
      icon: tabler:sun
    - title: 'Presiones de funcionamiento recomendadas'
      description: 'Tubos de PVC: 3,0–3,5 PSI de funcionamiento, 4,5 PSI máximo. Tubos de Hypalon: 3,5–4,0 PSI de funcionamiento, 5,0 PSI máximo. Pruebe siempre a 1,25 veces la presión nominal (4,4 PSI para PVC, 5,0 PSI para Hypalon) según los estándares de QC de Paddle Board Overstock.'
      icon: tabler:chart-bar
    - title: 'Buenas prácticas con exposición solar'
      description: 'Guarde los RIB en zonas sombreadas cuando no se utilicen. Use fundas de protección UV para fondeos prolongados. Compruebe y ajuste la presión de los tubos antes y después de las horas de mayor sol. Nunca supere la presión nominal máxima.'
      icon: tabler:umbrella
    - title: 'Despresurización de emergencia'
      description: 'Si el tubo se siente demasiado firme o la válvula de alivio está liberando aire, suelte aire por la válvula Halkey-Roberts o la válvula militar hasta que la presión vuelva al rango de funcionamiento. Lleve siempre un manómetro para lecturas precisas.'
      icon: tabler:alert-circle

