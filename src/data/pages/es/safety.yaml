content_overpressure:
  tagline: Seguridad por presión
  title: Presión de la tabla<br />Gestión en climas cálidos
  subtitle: La presión de la tabla inflable aumenta con la temperatura. Comprender y gestionar la sobrepresión protege tu tabla y mantiene cada sesión segura.
  items:
    - title: Por qué aumenta la presión
      description: El aire se expande con el calor. Una tabla inflada a PSI 15 a 20°C puede subir 1-2 PSI en 40°C de sol — la misma física que hace que una tabla fresca de la mañana se sienta dura como una roca al mediodía.
      icon: tabler:gauge
    - title: Presión de funcionamiento recomendada
      description: 'Infla a 12-15 PSI, como se imprime cerca de la válvula. El rango clasificado equilibra rigidez, seguridad y vida útil de la junta: más no es mejor.'
      icon: tabler:chart-bar
    - title: Mejores prácticas para climas cálidos
      description: Infla hasta el extremo inferior de la cocina en días calurosos. Suelta un poco de aire antes de una exposición prolongada al sol y nunca dejes una tabla completamente inflada en la playa.
      icon: tabler:sun
    - title: Exposición y almacenamiento al sol
      description: Guarda las tablas sombreadas y parcialmente desinfladas cuando no se usan. Usa una bolsa para UV tablas para protección. Enjuaga y seca antes de enrollarla para guardarla.
      icon: tabler:umbrella
    - title: Si la tabla se siente dura como una roca
      description: 'Libera aire por la válvula hasta que la tabla vuelva al rango nominal. Lleva el manómetro en tu bomba para lecturas precisas: una tabla sobreinflada sobrecarga las juntas innecesariamente.'
      icon: tabler:alert-circle
