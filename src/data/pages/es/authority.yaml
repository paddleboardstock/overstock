      amount: Since 2012
    - title: Ingenieros de I+D
      amount: 50+
    - title: Países atendidos
      amount: 50+
    - title: Equipo entregado
      amount: 15,000+
features3_brand:
  tagline: Quienes somos
  title: Fundación de la marca<br />y herencia
  subtitle: La historia, la experiencia y el alcance global que definen a Aquafarer como un fabricante confiable de equipos marinos.
  isBeforeContent: false
  columns: 3
  items:
    - title: Acerca de Aquafarer
      description: 'Fundada en 2012 en Qingdao, China. Desde un taller costero hasta unas instalaciones de 12.000 m²: la historia completa de Aquafarer.'
      icon: tabler:building-factory
      link: /about
    - title: Historia de la marca
      description: Cómo un equipo de ingenieros marinos se propuso hacer que las embarcaciones inflables de nivel profesional fueran accesibles en todo el mundo.
      icon: tabler:book
      link: /brand-story
    - title: Experiencia en la industria marina
      description: 'Ciencia profunda de los materiales, fabricación de precisión y pruebas en el mundo real: décadas de ingeniería marina en cada casco.'
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Presencia Global
      description: Sirviendo a más de 50 países en todos los continentes. Experiencia regional para requisitos regulatorios locales y preferencias del mercado.
      icon: tabler:globe
      link: /brand-global-presence
    - title: ¿Por qué Aquafarer?
      description: 'Lo que nos diferencia: calidad, personalización, precios directos de fábrica y soporte de extremo a extremo para operadores comerciales.'
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Nuestro equipo
      description: 'Conozca a los líderes: ingenieros marinos, científicos de materiales y expertos en fabricación que impulsan a Aquafarer.'
      icon: tabler:users
      link: /brand/team
    - title: Equipo de ingeniería
      description: Más de 78 años combinados de I+D, más de 40 plataformas, 12 certificaciones, más de 1200 proyectos OEM. El equipo técnico detrás de cada producto.
      icon: tabler:engine
      link: /engineering-team
    - title: Centro de I+D
      description: 'Ingeniería de casco, soldadura por RF, laboratorio de PVC, creación de prototipos, tanque de pruebas y laboratorio de calidad: nuestras instalaciones completas de investigación y desarrollo.'
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Confianza y calidad
  title: Certificaciones, Calidad<br />y Pruebas
  subtitle: Certificaciones independientes, pruebas rigurosas y evidencia real que demuestran nuestro compromiso con la calidad.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certificaciones
      description: 'CE, ISO 9001, UKCA, BSCI, REACH: documentación de certificación completa y cumplimiento para mercados globales.'
      icon: tabler:shield-check
      link: /certifications
    - title: Calidad y pruebas
      description: Cada producto se prueba a presión antes del envío. Resistencia de las costuras, resistencia a los rayos UV y flotabilidad, verificadas en cada etapa.
      icon: tabler:clipboard-check
      link: /quality
    - title: Evidencia y prueba
      description: Resultados de pruebas, fotografías de implementación, informes de inspección de terceros y estudios de casos que validan la calidad de Aquafarer.
      icon: tabler:file-check
      link: /evidence
    - title: Gráfico de conocimiento
      description: 'Explore el gráfico de entidades de Aquafarer: productos, tecnologías, certificaciones y relaciones en una base de conocimientos conectada.'
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderazgo
  title: Conozca al equipo<br />detrás de Aquafarer
  subtitle: Experiencia en la industria que abarca ingeniería marina, ciencia de materiales, gestión de calidad y comercio B2B global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu, fundador y director ejecutivo
      description: Más de 15 años en la fabricación marina. Anteriormente dirigió I+D en un importante fabricante de embarcaciones chino. Posee múltiples patentes en diseño de botes inflables.
      icon: tabler:crown
    - title: Zhang Wei - Ingeniero jefe
      description: Más de 20 años en la fabricación de PVC/Hypalon y diseño de cascos en V profunda. Ex director técnico de una empresa europea de ingeniería marina.
      icon: tabler:engine
    - title: Chen Ming - Jefe de I+D
      description: Doctorado en Ciencia de los Materiales. Se especializa en tecnología de punto de caída y soldadura de alta frecuencia. Más de 10 años en compuestos textiles.
      icon: tabler:flask
    - title: Liu Qiang - Director de producción
      description: Más de 18 años en fabricación ajustada. Cinturón Negro Seis Sigma. Implementé sistemas de calidad ISO 9001 en todas las líneas de producción.
      icon: tabler:settings
    - title: Wang Fang - Gerente de Calidad
      description: Más de 12 años en control de calidad marino. Auditor certificado CE e ISO. Supervisa las pruebas para cada lote de producción.
      icon: tabler:shield-check
    - title: Helen Lee - Directora de ventas
      description: Más de 15 años en el comercio B2B internacional. Gestioné asociaciones OEM/ODM en más de 30 países. Fluido en 4 idiomas.
      icon: tabler:briefcase
cta:
  title: ¿Quieres verificar nuestras credenciales?
  subtitle: Contáctenos para obtener copias de certificación, informes de inspección de terceros o para programar una visita a la fábrica.
  actions:
    - variant: primary
      text: Solicitar credenciales
      href: /contact
    - text: Ver detalles de la certificación
      href: /certifications
