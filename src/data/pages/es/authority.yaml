hero:
  tagline: Centro de autoridad
  title: ¿Por qué Aquafarer?<br />Confianza construida durante una década
  subtitle: Cada barco que construimos lleva el peso de más de 10 años de ingeniería marina, sistemas de calidad certificados y miles de operaciones exitosas en todo el mundo. Por eso los profesionales del sector eligen Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Equipo de ingeniería e instalaciones de fabricación marina de Aquafarer
