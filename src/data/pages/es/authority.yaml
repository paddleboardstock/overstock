features3_brand:
  tagline: Quienes somos
  title: Fundación de la marca<br />y herencia
  subtitle: La historia, la experiencia y el alcance global que definen Paddle Board Overstock como una SUP marca de confianza.
  isBeforeContent: false
  columns: 3
  items:
    - title: Acerca Paddle Board Overstock de
      description: Fundado en 2012 en Weihai, China. De un taller costero a una instalación de 12.000 m² — la Paddle Board Overstock historia completa.
      icon: tabler:building-factory
      link: /about
    - title: Historia de la marca
      description: Cómo un equipo de ingenieros marinos se propuso hacer accesibles a nivel mundial tablas de remo hinchables de calidad profesional.
      icon: tabler:book
      link: /brand-story
    - title: Experiencia en la industria marina
      description: 'Ciencia profunda de materiales, fabricación de precisión y pruebas en el mundo real: décadas de ingeniería marina en cada plancha.'
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: ¿Por qué hay exceso de existencias de tablas de paddle surf?
      description: 'Lo que nos diferencia: calidad, personalización, precios directos de fábrica y soporte integral para cada palista.'
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Nuestro equipo
      description: Conoce a los líderes — ingenieros navales, científicos de materiales y expertos en fabricación que Paddle Board Overstock avanzan.
      icon: tabler:users
      link: /brand/team
    - title: Equipo de ingeniería
      description: 78+ años combinados de investigación y desarrollo, 40+ plataformas, 1.200+ proyectos de ingeniería. El equipo técnico detrás de cada producto.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Confianza y calidad
  title: Calidad, pruebas<br />& Demostración
  subtitle: Pruebas rigurosas, datos reales y pruebas que demuestren nuestro compromiso con la calidad.
  isBeforeContent: false
  columns: 3
  items:
    - title: Calidad y pruebas
      description: Cada producto se prueba a presión antes del envío. Resistencia de las costuras, resistencia a los rayos UV y flotabilidad, verificadas en cada etapa.
      icon: tabler:clipboard-check
      link: /quality
    - title: Evidencia y prueba
      description: Resultados de pruebas, fotos de despliegue, informes de inspección de terceros y estudios de caso que Paddle Board Overstock validan la calidad.
      icon: tabler:file-check
      link: /evidence
    - title: Gráfico de conocimiento
      description: 'Explora el Paddle Board Overstock grafo de entidades: productos, tecnologías, materiales y relaciones en una base de conocimiento conectada.'
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderazgo
  title: Conoce al equipo<br />Detrás Paddle Board Overstock
  subtitle: Experiencia industrial que abarca ingeniería marina, ciencia de materiales, gestión de la calidad y comercio electrónico global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Fundador y CEO
      description: 15+ años en fabricación marina. Anteriormente lideró I+D en un importante fabricante marino chino. Posee múltiples patentes en diseño de productos inflables.
      icon: tabler:crown
    - title: Zhang Wei - Ingeniero jefe
      description: 20+ años en fabricación de polímeros y diseño de estructuras inflables. Ex director técnico en una empresa europea de ingeniería marina.
      icon: tabler:engine
    - title: Chen Ming - Jefe de I+D
      description: Doctorado en Ciencia de Materiales. Especializado en drop-stitch tecnología y soldadura de alta frecuencia. 10+ años en materiales textiles.
      icon: tabler:flask
    - title: Liu Qiang - Director de producción
      description: 18+ años en fabricación enxuta. Implementó rigurosos sistemas de calidad en todas las líneas de producción.
      icon: tabler:settings
    - title: Wang Fang - Gerente de Calidad
      description: 12+ años en control de calidad marina. Lidera auditorías internas de calidad. Supervisa las pruebas de cada lote de producción.
      icon: tabler:shield-check
    - title: Helen Lee - Directora de ventas
      description: 15+ años en comercio electrónico internacional y logística. Envía tablas a remadores en 50+ países. Fluida en 4 idiomas.
      icon: tabler:briefcase
cta:
  title: ¿Quieres pruebas de nuestra calidad?
  subtitle: Contáctanos para obtener informes de prueba, registros de inspección o para programar una visita a la fábrica.
  actions:
    - variant: primary
      text: Solicitar documentación
      href: /contact
