hero:
  tagline: Sobre nosotros
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Taller Paddle Board Overstock
  title: |
    Ingeniería marina, <br />
    hecha a la manera <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: 'Empezamos en un taller costero con un solo barco y una convicción firme: los productos marinos deben diseñarse como si importaran, porque importan. Hoy exportamos a más de 50 países, pero cada casco sigue pasando por las mismas manos que fundaron la empresa.'

stats:
  title: En cifras
  columns: 4
  stats:
    - title: Cascos entregados
      amount: '2,400+'
    - title: Países con envíos
      amount: '50+'
    - title: Años de experiencia combinada
      amount: '60'
    - title: Respuesta media de garantía (horas)
      amount: '24'

features3_what_we_build:
  title: Lo que construimos
  subtitle: Una línea de productos enfocada que conocemos al dedillo — sin experimentos a medias, sin ingeniería de marca.
  columns: 3
  isBeforeContent: true
  items:
    - title: Barcos RIB
      description: RIB de casco de aluminio de 3,3 m a 7,5 m. Diseñados para patrulla, buceo, pesca y uso familiar.
      icon: tabler:ship
    - title: Barcos inflables
      description: Anexos inflables de PVC y Hypalon de 2,4 m a 4,2 m. Ligeros, resistentes y fáciles de guardar.
      icon: tabler:speedboat
    - title: Anexos para superyates
      description: RIB compactos y de alta especificación construidos a medida para combinar con el estilo de su buque nodriza.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accesorios
      description: Remos, bombas, cubiertas, bolsas impermeables, tanques de combustible y electrónica. Todos adaptados a nuestros barcos.
      icon: tabler:package
    - title: Reforma y reparación
      description: Sustitución de flotadores, modernización electrónica y mejoras de motor.
      icon: tabler:tool
    - title: Construcciones a medida
      description: Diseño proyecto por proyecto para clientes comerciales, científicos y militares.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Construcción de barco a medida

steps2_values:
  title: Nuestros valores
  subtitle: Tres principios que han moldeado cada producto desde el primer día.
  items:
    - title: Construir como si llevara a tu familia
      description: Cada casco, soldadura y fijación se trata como si nuestras propias familias fueran a usarlo.
      icon: tabler:heart
    - title: Ingeniería antes de vender
      description: Si una especificación es incorrecta, cambiamos la especificación — nunca al cliente.
      icon: tabler:settings
    - title: Soporte que supera la garantía
      description: Los cascos de veinte años todavía nos llaman para pedir repuestos, y seguimos respondiendo.
      icon: tabler:headset

steps2_milestones:
  title: Hitos
  subtitle: Una versión breve de la historia de Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fundado en un taller costero
      description: Iniciado por dos arquitectos navales con una fresadora CNC y una idea tenaz.
      icon: tabler:building-factory
    - title: Primeros 1000 cascos entregados
      description: Alcanzado en nuestro séptimo año, principalmente gracias al boca a boca y clientes recurrentes.
      icon: tabler:circle-check
    - title: Programa de exportación internacional
      description: Ahora enviamos a más de 50 países con socios de soporte localizados en cinco continentes.
      icon: tabler:world
    - title: Una nueva estructura operativa global
      description: 'En septiembre de 2026, la operación de la marca pasó de Qingdao Vatrad Group a Weihai Dongjilian Co., Ltd. (Nuevo México, EE. UU.); la planta de Qingdao sigue encargándose de la I+D, la producción y la exportación directa de fábrica.'
      icon: tabler:building-skyscraper

features2_locations:
  title: Nuestras ubicaciones
  tagline: Encuéntranos
  columns: 3
  items:
    - title: Sede central y taller
      description: Parque industrial costero, edificio 4 — abierto lun–vie para visitas con cita previa.
    - title: Centro de servicio UE
      description: Puerto mediterráneo — reforma, reparación y soporte de garantía para clientes europeos.
    - title: Red de socios APAC
      description: Socios de servicio autorizados en Australia, Japón, Singapur y Hong Kong.
brand_hub_tagline: Marca
brand_hub_title: Explore nuestra marca
brand_hub_subtitle: Profundice en nuestra experiencia en ingeniería marina, presencia global y los principios que nos impulsan.
brand_hub_cards:
  - title: Experiencia Marina
    desc: 'Décadas de ciencia de materiales, fabricación de precisión y pruebas reales — desde la fabricación de PVC/Hypalon hasta el diseño de cascos en V profunda y tecnología drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'Más información →'
  - title: Presencia Global
    desc: 'Envíos a más de 50 países desde nuestra instalación en Qingdao con socios de servicio autorizados en Europa, Asia-Pacífico y América.'
    link: /brand-global-presence
    link_label: 'Más información →'
  - title: Por qué Paddle Board Overstock
    desc: 'Integración vertical, doble certificación (ISO 9001 + BSCI), cumplimiento CE y MOQ bajos — diseñado para marcas, distribuidores y agencias gubernamentales.'
    link: /brand-why-paddleboardoverstock
    link_label: 'Más información →'

production_section:
  tagline: 'Excelencia en producción'
  title: 'Garantizando un arte exquisito'
  description: 'La línea de producción de Paddle Board Overstock está dedicada a fabricar productos inflables de alta calidad, duraderos y de alto rendimiento.'
  cards:
    - title: 'Equipo de técnicos experimentados'
      items:
        - 'Conocimiento profesional de PVC, Hypalon y materiales marinos'
        - 'Artesanía precisa en corte, unión e instalación de accesorios'
        - 'Formación continua para dominar las últimas tecnologías de producción'
    - title: 'Equipo de producción avanzado'
      items:
        - 'Equipos de corte CNC para un corte de tela preciso con error mínimo'
        - 'Unión térmica/fría de alta precisión para costuras herméticas y duraderas'
        - 'Equipos profesionales de prueba de hermeticidad y tracción'
    - title: 'Sistema de gestión maduro'
      items:
        - 'Procesos de producción estandarizados con estándares de calidad claros'
        - 'Filosofía de producción lean que reduce desperdicios y mejora la eficiencia'
        - 'Gestión eficiente de la cadena de suministro con proveedores confiables'
    - title: 'Control de calidad estricto'
      items:
        - 'Sistema de gestión de calidad certificado'
        - 'Inspección en varias etapas: materia prima, en proceso, salida final'
        - 'Estrictas pruebas de hermeticidad y durabilidad antes del envío'

global_ops_section:
  tagline: 'Arquitectura operativa global'
  title_html: 'Una marca, <span class="text-white/90">dos centros</span>'
  description_html: 'Desde septiembre de 2026, Paddle Board Overstock es operado por <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (Nuevo México, EE. UU.) — la entidad global para distribución, ventas B2B comerciales, contratos, facturación y posventa. La I+D, la producción y el control de calidad permanecen en el <strong class="text-white">Centro de Fabricación Paddle Board Overstock Qingdao</strong>, que envía cada pedido directamente de fábrica, FOB Qingdao. La transición cambió quién firma su contrato — no quién construye su bote.'
  stats:
    - value: '2,400+'
      label: 'Cascos entregados globalmente'
    - value: '50+'
      label: 'Países de exportación'
    - value: '10+'
      label: 'Años de fabricación'
