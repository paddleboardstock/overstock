hero:
  tagline: Sobre nosotros
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fábrica y taller de excedentes de tablas de paddle surf.
  title: Acerca del <span class="text-accent dark:text-white">exceso de existencias de tablas de remo</span>
  subtitle: Tablas de SUP inflables nuevas a precios de excedente y liquidación, respaldadas por nuestra propia fabricación en Weihai desde 2012, venta al por mayor de modelos mixtos para pequeños minoristas y envíos flexibles a todo el mundo.
stats:
  title: Por los números
  columns: 4
  stats:
    - title: Capacidad de producción anual
      amount: 15,000 unidades
    - title: Países enviados
      amount: 50+
    - title: Tableros probados a presión
      amount: 100%
    - title: ingenieros de I + D
      amount: 14+
features3_what_we_build:
  title: lo que construimos
  subtitle: 'Una línea de productos enfocada que conocemos al dedillo: sin experimentos a medio terminar ni ingeniería de insignias.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Tablas de SUP inflables
      description: SUP todoterreno y de turismo de 10 a 12 pies. Estables, rígidos y completos con bomba, remo y correa.
      icon: tabler:swimming
    - title: Barajas de series de arte
      description: 'Diseño exclusivo de la cubierta de EVA: Cheetah Surge, Tropical Breeze, Medusa Glow y más.'
      icon: tabler:hexagons
    - title: Paquetes completos
      description: 'Cada tabla se envía como un kit completo: tabla, mochila, bomba, remo, aleta, correa y kit de reparación.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accesorios
      description: Bombas, remos, correas, kits de reparación y bolsas secas. Todo adaptado a nuestras tablas.
      icon: tabler:tool
    - title: Cuidado y reparación
      description: Soporte de reparación interno, repuestos y orientación de mantenimiento para mantener su tabla en el agua durante años.
      icon: tabler:settings
    - title: Clubes y flotas de alquiler
      description: Equipamiento a granel para clubes, escuelas y flotas de alquiler con soporte directo de fábrica.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Discusión sobre diseño e ingeniería de tableros.
steps2_values:
  title: Nuestros valores
  subtitle: Tres principios que han dado forma a cada producto desde el primer día.
  items:
    - title: Construye como si llevara a tu familia
      description: Cada tabla, costura y válvula se trata como si nuestras propias familias las usaran.
      icon: tabler:heart
    - title: Ingeniero antes de vender
      description: Si una especificación es incorrecta, la cambiamos, nunca el cliente.
      icon: tabler:settings
    - title: Soporte que dura más que la garantía
      description: Las placas que construimos hace años todavía nos llaman para pedir repuestos y seguimos recogiendo.
      icon: tabler:headset
steps2_milestones:
  title: Hitos
  subtitle: Una versión corta de la historia de Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fundada en Weihai
      description: Un taller costero dedicado al drop-stitch de tablas de SUP hinchables.
      icon: tabler:building-factory
    - title: Campus de producción de 12.000 m²
      description: Ampliado a una instalación dedicada con capacidad de producción de soldadura por radiofrecuencia y punto de caída.
      icon: tabler:circle-check
    - title: Programa de exportación internacional
      description: Ahora realizamos envíos a más de 50 países con opciones de transporte marítimo y exprés.
      icon: tabler:world
    - title: Enfoque en exceso de existencias y venta al por mayor
      description: En septiembre de 2026, las operaciones de la marca se trasladaron de Qingdao Vatrad Group a Weihai Dongjilian Co., Ltd.; el centro de fabricación de Weihai continúa con la investigación y el desarrollo, la producción y el envío directo a la fábrica.
      icon: tabler:building-skyscraper
features2_locations:
  title: Nuestras ubicaciones
  tagline: Encuéntranos
  columns: 3
  items:
    - title: Sede y taller
      description: 'Parque industrial costero, edificio 4: abierto de lunes a viernes para visitas con cita previa.'
    - title: centro de servicio de la UE
      description: 'Puerto mediterráneo: reacondicionamiento, reparación y soporte de garantía para clientes europeos.'
    - title: Red de socios de APAC
      description: Socios de servicio autorizados en Australia, Japón, Singapur y Hong Kong.
brand_hub_tagline: Marca
brand_hub_title: Explora nuestra marca
brand_hub_subtitle: Profundice en nuestra experiencia en ingeniería marina, nuestra presencia global y los principios que nos impulsan.
brand_hub_cards:
  - title: Experiencia marina
    desc: Décadas de ciencia de materiales, fabricación de precisión y pruebas en el mundo real, desde núcleos de costura hasta costuras soldadas y plataformas de series artísticas.
    link: /brand-marine-expertise
    link_label: Más información →
  - title: ¿Por qué hay exceso de existencias de tablas de paddle surf?
    desc: 'Precios directos de fábrica, tablas 100 % probadas con presión y una garantía de 2 años: diseñadas para remeros, familias y amantes de los deportes acuáticos.'
    link: /brand-why-paddleboardoverstock
    link_label: Más información →
