stories:
  tagline: Historias de exploradores
  title: Aventuras reales de personas reales
  subtitle: Escucha a remeros, familias y profesionales que usan el equipo Paddle Board Overstock en el agua.
  items:
    - name: Sarah y Mike
      title: Propietarios de SUP Explorer 11, Canadá
      content: Llevamos nuestras Explorer 11 en un viaje de una semana por el Parque Algonquin. Manejaron los porteos y cruces de lagos de manera excelente. La construcción drop-stitch significaba que podíamos inflarlas a 15 PSI y obtener el rendimiento de una tabla rígida de una tabla plegable.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Parque Algonquin, Canadá
    - name: Carlos R.
      title: Jinete de Cheetah Surge, España
      content: El Cheetah Surge es mi opción preferida para navegar por la costa. Su diseño vibrante atrae miradas en la playa, y la estabilidad me da confianza en marejada ligera. Se maneja maravillosamente tanto si estoy de excursión como si solo disfruto del atardecer.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, España
    - name: Lina y familia
      title: Paddlers del Loto Fluyente, Suecia
      content: Aventuras familiares de fin de semana en el archipiélago. The Flowing Lotus es lo suficientemente estable para que mi hija se mantenga de pie mientras yo remo. Se infla en menos de 10 minutos — no se necesita remolque, solo pura diversión familiar en el agua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Archipiélago de Estocolmo, Suecia
    - name: Andres D.
      title: Explorador Ocean Voyager, Filipinas
      content: Utilizo mi Ocean Voyager para recorridos costeros de larga distancia alrededor de Palawan. Después de meses de uso diario en condiciones tropicales, la tabla todavía funciona como nueva. La forma de turismo corta las olas que detendrían a tablas de menor calidad.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipinas
    - name: Emma T.
      title: Tropical Breeze, primerizo, Australia
      content: Nunca había estado en un SUP antes. El Tropical Breeze es tan estable que me sentí confiado en mi primer intento. Ahora remero todos los fines de semana. La curva de aprendizaje es prácticamente nula, y la tabla se ve increíble en el agua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
