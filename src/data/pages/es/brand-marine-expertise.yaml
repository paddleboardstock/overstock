hero:
  tagline: Experiencia marina
  title: Décadas de Ingeniería Marina<br />en Cada Tabla
  subtitle: Paddle Board Overstock combina profunda ciencia de materiales, fabricación de precisión y pruebas en el mundo real para producir tablas que funcionan cuando importa.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock equipo de ingeniería marina e I+D en acción
expertise_materials:
  tagline: Ciencia de Materiales
  title: Elegir el Material Correcto<br />para Cada Aplicación
  subtitle: Trabajamos con tres materiales principales, cada uno seleccionado para casos de uso específicos y requisitos de rendimiento.
  columns: 3
  items:
    - title: Grado Marino PVC
      description: Tela de 1100 deniers PVC — nuestro material más versátil. UV-estabilizado, resistente a la abrasión y probado con el tiempo. Ideal para tablas SUP donde el peso, la rigidez y la eficiencia de costos son importantes.
      icon: tabler:droplet
    - title: Núcleo Drop-Stitch
      description: Miles de hilos de poliéster conectan las capas superior e inferior de tela, permitiendo una inflación a alta presión (15 PSI) para un viaje rígido y estable que aún se enrolla en una mochila.
      icon: tabler:building-arch
    - title: Espuma de Cubierta EVA
      description: Espuma EVA de alta densidad ranurada proporciona agarre completo, amortiguación para caídas y un lienzo para nuestras cubiertas de la serie de arte.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Capacidades de Fabricación
  title: Fabricación de Precisión<br />en Cada Paso
  subtitle: Nuestra instalación de 12,000 m² está equipada con maquinaria especializada para cada etapa de producción.
  columns: 2
  items:
    - title: Corte CNC
      description: El corte controlado por computadora asegura paneles de tela precisos y repetibles con un mínimo desperdicio. Cada pieza encaja exactamente como fue diseñada.
      icon: tabler:cpu
    - title: Soldadura de Alta Frecuencia
      description: La soldadura industrial HF crea costuras más fuertes que el material base. El control constante de temperatura y presión asegura sellos herméticos en cada lote de producción.
      icon: tabler:bolt
    - title: Ensamblaje del Núcleo Drop Stitch
      description: Miles de hilos de poliéster conectan las capas superior e inferior de tela, permitiendo una inflación a alta presión (15-20 PSI) para tablas SUP y pisos rígidos y estables.
      icon: tabler:building-arch
    - title: Prueba de Presión
      description: Cada tabla se prueba a presión antes del envío, mantenida a 1.25 veces la presión nominal; si lo soporta, funcionará en el agua.
      icon: tabler:wind
    - title: Prueba de Resistencia de Costuras
      description: Muestras aleatorias de cada lote de producción se someten a pruebas destructivas de resistencia de costuras. Los resultados se registran y son rastreables a lotes de producción específicos.
      icon: tabler:files
    - title: Pruebas en Agua
      description: Cada diseño de tabla se somete a pruebas con agua real. Remar en condiciones costeras reales valida el rendimiento, la maniobrabilidad y la estabilidad.
      icon: tabler:ripple
expertise_design:
  tagline: Diseño e Ingeniería
  title: Diseñado para Condiciones Reales
  subtitle: Nuestra filosofía de diseño comienza con cómo se usará la tabla, luego construimos la ingeniería alrededor de ese caso de uso.
  items:
    - title: Forma y Contorno de la Tabla
      description: 'La longitud, el ancho y el rocker se ajustan para el uso previsto de cada modelo: contornos más largos para excursiones para un deslizamiento más eficiente, áreas de tabla más anchas para estabilidad y yoga.'
    - title: Refuerzo de Carriles y Quilla Central
      description: 'Los carriles reforzados y las quillas centrales añaden rigidez y absorben impactos: los lugares donde las tablas reciben más desgaste temporada tras temporada.'
    - title: Diseño de la Cubierta y Tracción
      description: El área de postura, la colocación de las asas, los montajes de anillas en D y las zonas de tracción se diseñan en función de las posturas reales de remo, ya sea paseando, pescando o practicando yoga.
    - title: Arte y Series de Colores
      description: 'El arte de la cubierta, los esquemas de colores y los montajes de accesorios: cada serie está diseñada para coincidir con una personalidad de remo distinta.'
cta:
  title: ¿Tienes una aplicación específica en mente?
  subtitle: Nuestro equipo puede ayudarte a elegir la tabla, el tamaño y el equipo adecuados para tu estilo de remo.
  actions:
    - variant: primary
      text: Consulta a nuestros ingenieros
      href: /contact
    - text: Ver gama de productos
      href: /products
