hero:
  tagline: Por qué Paddle Board Overstock
  title: Construido diferente. Hecho para durar.<br />Los tableros detrás de Water Adventures Worldwide
  subtitle: No solo una fábrica, sino un equipo de palistas e ingenieros que diseñan, prueban y construyen tablas hinchables SUP premium para familias, aventureros y clubes de todo el mundo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Calidad de fabricación y experiencia de Paddle Board Overstock
pillars:
  tagline: Tres pilares de la calidad
  title: Por qué los palistas de todo el mundo eligen Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Diseñado para uso comercial
      description: Nuestras tablas están diseñadas para años de remo regular. Los PVC núcleos reforzados de calidad drop-stitch comercial, los UV materiales estables y el hardware probado en el campo suponen menos mantenimiento y una vida útil más larga en el agua.
      icon: tabler:building-factory
      callToAction:
        text: Ver línea de productos comerciales
        href: /products
    - title: Probados más allá de los estándares
      description: Cada placa se infla a 1,25 veces su presión nominal durante 24-48 horas antes de salir de fábrica — 100% testada a presión, 99,3% sin defectos. Tu tabla está demostrada resistente antes de tocar el agua.
      icon: tabler:shield-check
      callToAction:
        text: Mira cómo probamos
        href: /quality
    - title: Construido para condiciones globales
      description: 'Productos optimizados para cada clima: formulaciones de PVC para aguas frías en Europa, materiales resistentes a los UV para Oriente Medio y Australia, tratamientos antihumedad para el Sudeste Asiático. Cada envío se calibra según el entorno de destino.'
      icon: tabler:world
stats:
  title: Confianza en números
  stats:
    - title: Años en el negocio
      amount: Desde 2012
    - title: Tablas fabricadas por año
      amount: 15,000+
    - title: Clientes recurrentes
      amount: 85%
    - title: Reclamaciones de garantía
      amount: <2%
reasons:
  tagline: La diferencia Paddle Board Overstock
  title: Qué nos distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Fabricación real, no intermediación
      description: 'Somos propietarios y operamos una fábrica de 12.000 m². Cuando se asocia con Paddle Board Overstock, trabaja directamente con las personas que diseñan, desarrollan y fabrican sus productos: sin intermediarios.'
      icon: tabler:building-factory
    - title: Enfoque liderado por la ingeniería
      description: Nuestro proceso de diseño comienza con el caso de uso, no con la categoría de producto. Optimizamos la forma del casco, la selección de materiales y la configuración para cómo se usará realmente la placa en el agua.
      icon: tabler:engine
    - title: Calidad probada
      description: Cada placa se somete a una prueba de presión a 1,25 veces su presión nominal durante 24-48 horas antes del envío, y el 99,3% de nuestros envíos llegan sin defectos, respaldados por nuestra garantía.
      icon: tabler:award
    - title: Diseño Palero-Primero
      description: 'Cada modelo empieza por cómo remas: plataformas estables para principiantes, formas aerodinámicas para travesías y terrazas de tamaño completo para yoga. Diseñamos para palistas reales, no para especificaciones de showroom.'
      icon: tabler:adjustments
    - title: Logística global
      description: Almacén en EE. UU. en California, envío directo desde Weihai y carga aérea para pedidos urgentes. Gestionamos trámites aduaneros y documentación en todo el mundo.
      icon: tabler:truck-delivery
    - title: Soporte de por vida
      description: Nos apoyamos en tablas que construimos hace 20 años. Repuestos auténticos, asesoramiento técnico, orientación para reparaciones — nuestro equipo está ahí cuando nos necesites, estés donde estés.
      icon: tabler:lifebuoy
testimonials:
  tagline: Confiable por los palistas de todo el mundo
  title: Lo que dicen los palistas
  items:
    - content: Mi Ocean Voyager ha manejado desde mañanas tranquilas en el lago hasta tardes costeras agitadas. A la segunda temporada, sigue pareciendo y conduciendo como nuevo.
      name: — Remero recreativo, California
    - content: Me dio miedo comprar mi primera tabla hinchable online, pero la calidad se notó en cuanto la infuré. Rígida, estable y con un acabado precioso.
      name: — SUP Propietario primerizo, Alemania
    - content: Remomos en familia todos los fines de semana de verano. Tres tablas, cero problemas, y a los niños les encantan los diseños llamativos.
      name: — Remador Familiar, Australia
    - content: 'La prueba de presión no es un discurso de marketing: mi tabla es firme como una roca a máxima presión y no muestra estiramiento después de un año de remar semanalmente.'
      name: — Weekly Paddler, Países Bajos
cta:
  title: ¿Listo para encontrar tu tabla perfecta?
  subtitle: Habla con nuestros expertos en remo para recibir consejos sinceros sobre cómo elegir la tabla adecuada — sin presión, solo ayuda real.
  actions:
    - variant: primary
      text: Hable con nuestro equipo
      href: /contact
    - text: Descargar catálogo de productos
      href: /resources
