hero:
  tagline: Por qué Paddle Board Overstock
  title: Built Different. Built to Last.<br />The Boards Behind Water Adventures Worldwide
  subtitle: Not just a factory — a team of paddlers and engineers who design, test, and build premium inflatable SUP boards for families, adventurers, and clubs worldwide.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Calidad de fabricación y experiencia de Paddle Board Overstock
pillars:
  tagline: Three Pillars of Quality
  title: Why Paddlers Worldwide Choose Paddle Board Overstock
  subtitle: ""
  columns: 3
  items:
    - title: Diseñado para uso comercial
      description: Our boards are engineered for years of regular paddling. Commercial-grade PVC, reinforced drop-stitch cores, UV-stable materials, and field-tested hardware mean lower maintenance and a longer life on the water.
      icon: tabler:building-factory
      callToAction:
        text: Ver línea de productos comerciales
        href: /products
    - title: Tested Beyond Standards
      description: Every board is inflated to 1.25x its rated pressure for 24-48 hours before it leaves our factory — 100% pressure-tested, 99.3% defect-free. Your board is proven tough before it ever hits the water.
      icon: tabler:shield-check
      callToAction:
        text: See how we test
        href: /quality
    - title: Construido para condiciones globales
      description: "Productos optimizados para cada clima: formulaciones de PVC para aguas frías en Europa, materiales resistentes a los UV para Oriente Medio y Australia, tratamientos antihumedad para el Sudeste Asiático. Cada envío se calibra según el entorno de destino."
      icon: tabler:world
stats:
  title: Confianza en números
  stats:
    - title: Años en el negocio
      amount: Desde 2012
    - title: Boards Built per Year
      amount: 15,000+
    - title: Clientes recurrentes
      amount: 85%
    - title: Reclamaciones de garantía
      amount: <2%
reasons:
  tagline: La diferencia Paddle Board Overstock
  title: Qué nos distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Fabricación real, no intermediación
      description: "Somos propietarios y operamos una fábrica de 12.000 m². Cuando se asocia con Paddle Board Overstock, trabaja directamente con las personas que diseñan, desarrollan y fabrican sus productos: sin intermediarios."
      icon: tabler:building-factory
    - title: Enfoque liderado por la ingeniería
      description: Our design process starts with the use case, not the product category. We optimize hull shape, material selection, and configuration for how the board will actually be used on the water.
      icon: tabler:engine
    - title: Proven Quality
      description: Every board is pressure-tested to 1.25x its rated pressure for 24-48 hours before shipping, and 99.3% of our shipments arrive defect-free — backed by our warranty.
      icon: tabler:award
    - title: Paddler-First Design
      description: "Every model starts with how you paddle: stable platforms for beginners, streamlined shapes for touring, and full-size decks for yoga. We design for real paddlers, not showroom specs."
      icon: tabler:adjustments
    - title: Logística global
      description: Almacén en EE. UU. en California, envío directo desde Weihai y carga aérea para pedidos urgentes. Gestionamos trámites aduaneros y documentación en todo el mundo.
      icon: tabler:truck-delivery
    - title: Soporte de por vida
      description: We stand behind boards we built 20 years ago. Genuine spare parts, technical advice, repair guidance — our team is there when you need us, wherever you are.
      icon: tabler:lifebuoy
testimonials:
  tagline: Trusted by Paddlers Worldwide
  title: What Paddlers Say
  items:
    - content: My Ocean Voyager has handled everything from calm lake mornings to choppy coastal afternoons. Two seasons in, it still looks and rides like new.
      name: — Recreational Paddler, California
    - content: I was nervous buying my first inflatable board online, but the quality was obvious the moment I inflated it. Rigid, stable, and beautifully finished.
      name: — First-Time SUP Owner, Germany
    - content: We paddle as a family every summer weekend. Three boards, zero issues, and the kids love the bright designs.
      name: — Family Paddler, Australia
    - content: The pressure testing is not marketing talk — my board is rock-solid at full pressure and shows no stretch after a year of weekly paddling.
      name: — Weekly Paddler, Netherlands
cta:
  title: Ready to Find Your Perfect Board?
  subtitle: Talk to our paddling experts for honest advice on choosing the right board — no pressure, just real help.
  actions:
