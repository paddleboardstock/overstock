features3_reasons:
  tagline: Por qué elegir Aquafarer
  title: 'Siete razones para asociarse con nosotros'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Fabricación real, no intermediación'
      description: 'Somos propietarios y operamos una fábrica de 12.000 m². Al asociarse con Aquafarer, trabaja directamente con las personas que diseñan, ingenierían y construyen sus productos, sin intermediarios.'
      icon: tabler:building-factory
    - title: '2. Enfoque liderado por la ingeniería'
      description: 'Nuestro proceso de diseño parte del caso de uso real, no de la categoría del producto. Optimizamos la forma del casco, la selección de materiales y la configuración según cómo se utilizará realmente la embarcación.'
      icon: tabler:engine
    - title: '3. Calidad certificada'
      description: 'Certificación CE, sistema de calidad ISO, conformidad BSCI, conformidad REACH, aprobación USCG. Nuestros 64 modelos con certificación CE cumplen estándares internacionales, no solo promesas.'
      icon: tabler:certificate
    - title: '4. OEM/ODM flexible'
      description: 'Colores de los flotadores, disposición de la consola, marca, embalaje: personalizamos todo según sus especificaciones. Sin presión por pedidos mínimos. Comience con un prototipo y escale con confianza.'
      icon: tabler:adjustments
    - title: '5. Logística global'
      description: 'Almacén en EE. UU. (California), envío directo desde Qingdao y flete aéreo para pedidos urgentes. Nos encargamos de los trámites aduaneros y la documentación.'
      icon: tabler:truck-delivery
    - title: '6. Soporte de por vida'
      description: 'Damos soporte a embarcaciones que construimos hace 20 años. Repuestos originales, asesoramiento técnico y guías de reparación: nuestro equipo está a su disposición cuando nos necesita.'
      icon: tabler:lifebuoy
    - title: '7. Especificaciones honestas'
      description: 'Capacidades de carga reales, dimensiones reales, peso real. Sin exageraciones de marketing. Lo que publicamos es lo que recibe, verificado mediante pruebas independientes.'
      icon: tabler:ruler-measure
testimonials:
  tagline: La confianza de marcas de todo el mundo
  title: Lo que dicen nuestros socios
  items:
    - content: 'Hemos trabajado con varios fabricantes en China, pero Aquafarer destaca por su soporte de ingeniería y su calidad constante. Tratan nuestra marca como si fuera suya.'
      name: '— Socio OEM, marca europea de deportes acuáticos'
    - content: 'Sus RIB de Hypalon llevan más de 5 años en servicio en nuestra flota. Mantenimiento mínimo, excelente resistencia a los rayos UV. La garantía de 5 años en los flotadores nos da confianza.'
      name: '— Operador de flota, grupo turístico de Oriente Medio'
    - content: 'El equipo de Aquafarer nos ayudó a desarrollar una tabla de SUP personalizada, del concepto a la producción, en 90 días. La calidad superó nuestras expectativas.'
      name: '— Distribuidor, deportes acuáticos de Australia'
cta:
  title: '¿Listo para experimentar la diferencia?'
  subtitle: 'Contacte con nuestro equipo para hablar de su proyecto. Sin compromiso: solo asesoramiento honesto sobre fabricación.'
  actions:
    - variant: primary
      text: Hable con nuestro equipo
      href: /contact
    - text: Descargar catálogo de productos
