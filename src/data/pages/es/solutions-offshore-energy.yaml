content_challenge:
  tagline: El desafío
  title: Demandas de energía marina<br />Confiabilidad en entornos extremos
  subtitle: 'Las operaciones de energía marina llevan los equipos al límite: clima extremo, ubicaciones remotas, ciclos de trabajo continuos y tolerancia cero ante fallas.'
  paragraphs:
    - "La industria de la energía offshore opera en los entornos marinos más exigentes del planeta. Los barcos de trabajo dan soporte a plataformas petrolíferas y de gas, instalaciones de turbinas eólicas marinas, operaciones de cables submarinos y proyectos de construcción marina — a menudo en pleno océano y con ventanas meteorológicas limitadas. Un fallo del equipo no es solo costoso: es peligroso."
    - '**La seguridad es la máxima prioridad** — Los buques de transferencia de personal deben operar con seguridad en estados de mar que detendrían cualquier otra operación. La estabilidad en el punto de transferencia, el rendimiento fiable de los motores con cualquier clima y una construcción robusta para el atraque repetido contra estructuras offshore son requisitos imprescindibles.'
    - '**La capacidad para todo tipo de clima es esencial** — Los parques eólicos marinos y las plataformas petrolíferas operan todo el año. Los barcos de trabajo deben rendir en mares gruesas, vientos fuertes y visibilidad reducida. Las operaciones diurnas y nocturnas exigen equipos de navegación completos y sistemas de iluminación fiables.'
    - '**El sector eólico marino crece rápidamente** — Se instalan miles de turbinas nuevas en todo el mundo, cada una de las cuales requiere transferencia regular de personal, transporte de herramientas y soporte de mantenimiento. Esto genera una demanda sostenida de buques de transferencia de personal (CTV) y RIB de apoyo diseñados a propósito.'
    - Los RIB para energía offshore de Aquafarer están diseñados con cascos deep-V reforzados, tubos Hypalon de alta resistencia, equipos de navegación completos y sistemas de seguridad concebidos para las condiciones extremas de las operaciones de energía offshore.
content_solution:
  tagline: Nuestra solución
  title: RIB costa afuera especialmente diseñadas<br />Para la industria energética
  subtitle: Cada RIB de energía marina de Aquafarer está diseñado para un funcionamiento seguro y confiable en condiciones marinas extremas, desde el Mar del Norte hasta el Sudeste Asiático.
  list:
    - Casco deep-V reforzado para rendimiento en aguas agitadas y manejo predecible
    - Tubos Hypalon de alta resistencia con resistencia a los UV y a los productos químicos para un servicio offshore prolongado
    - Herrajes de acero inoxidable 316 — sin corrosión en exposición continua a agua salada
    - 'Equipo de navegación completo: GPS, radar, VHF, luces de navegación nocturna — de serie en los modelos offshore'
    - Cubierta autoachicante para una operación segura en condiciones de mar embarcante
    - Configuraciones de motor múltiples — fueraborda simple o doble para redundancia de misión
    - Mástil de remolque y bitas de alta resistencia para la manipulación de plataformas y boyas
    - Colores de tubos de alta visibilidad para identificación en obras offshore
content_segments:
  tagline: Perfiles energéticos
  title: Soluciones de energía marina<br />Por tipo de aplicación
  subtitle: Los diferentes sectores de energía marina tienen requisitos únicos para los barcos de trabajo, desde RIB de soporte de plataforma hasta CTV de parques eólicos y buques de inspección submarinos.
  items:
    - title: Soporte para plataformas de petróleo y gas costa afuera
      subtitle: Transferencia de tripulación, suministro de equipos, respaldo de seguridad de la plataforma.
      description: Las plataformas de petróleo y gas requieren cambios diarios de tripulación, transporte de equipos y suministros, y cobertura de seguridad en espera. Los barcos de trabajo deben operar de manera segura alrededor de las estructuras de las plataformas, en corrientes fuertes y estados del mar variables, y mantener una posición precisa durante el traslado de personal a través de escaleras o pasarelas. El entorno extremo (hidrocarburos, productos químicos y niebla salina constante) exige una construcción resistente a la corrosión y un rendimiento confiable.
      features:
        - Configuración de transferencia de personal con acceso de embarque seguro y pasamanos
        - Tubos Hypalon anticorrosión y herrajes de acero inoxidable 316
        - Cintones de frote reforzados para el contacto frecuente con las defensas de la plataforma
        - Cubierta autoachicante para aguas oleosas y lavados químicos
        - Depósito de combustible de alta capacidad para un alcance operativo offshore ampliado
        - Opción de doble motor para redundancia crítica de misión
    - title: Operaciones de parques eólicos marinos
      subtitle: Traslado de tripulación, mantenimiento de turbinas, transporte de herramientas.
      description: 'La energía eólica marina es el sector de más rápido crecimiento en la energía marina. Los operadores necesitan buques de transferencia de tripulación (CTV) que puedan transferir técnicos de manera segura a plataformas de acceso a turbinas en estados del mar con una altura significativa de ola de hasta 1,5 m. La estabilidad durante el traslado, la capacidad en todo tipo de clima y el funcionamiento diario confiable son fundamentales. Los buques de servicio de parques eólicos operan con horarios ajustados: cualquier tiempo de inactividad retrasa la puesta en servicio o el mantenimiento de las turbinas, lo que afecta directamente los ingresos por producción de energía.'
      features:
        - Forma de casco optimizada para una transferencia estable del personal en la base de la turbina
        - Entrada deep-V para una travesía cómoda en mar rizada y swell offshore
        - Protección meteorológica completa — consola cerrada o caseta de gobierno para el confort de la tripulación
        - Espacio de cubierta para herramientas, repuestos y equipos de servicio
        - Paquete de operaciones nocturnas para los turnos de invierno limitados por la luz diurna
        - Funcionamiento silencioso del fueraborda para un impacto acústico mínimo en el entorno marino
    - title: Soporte para cables y tuberías submarinos
      subtitle: Inspección, mantenimiento, soporte ROV, encuesta.
      description: Los operadores de tuberías y cables submarinos necesitan embarcaciones de trabajo para la inspección de rutas, soporte de mantenimiento, operaciones de ROV y tareas de inspección. Estos buques requieren plataformas estables para desplegar y recuperar equipos submarinos, maniobras precisas para el seguimiento de cables y operaciones confiables en entornos costeros y marinos. La estabilidad de la embarcación es fundamental para la precisión de los equipos de sonar y topografía.
      features:
        - Plataforma estable a baja velocidad para el seguimiento de cables y operaciones de inspección
        - Distribución de cubierta abierta para el despliegue de ROV, carretes de cable y equipos de inspección
        - Placas de montaje de equipos para sónar, GPS e instrumentación de inspección
        - Diseño de casco de estela mínima para una perturbación mínima del fondo marino durante la inspección
        - Maniobras precisas a baja velocidad con dirección de fueraborda receptiva
    - title: Soporte de ingeniería y construcción marina
      subtitle: Transporte de personal, suministro de material, apoyo al buceo.
      description: Los contratistas de ingeniería marina que trabajan en proyectos de construcción portuaria, protección costera y de instalación en alta mar necesitan embarcaciones de trabajo versátiles para el transporte de personal entre los buques de construcción y la costa, el suministro de materiales y herramientas, el apoyo al buceo y los estudios del sitio. Estos barcos operan en zonas de construcción activa con múltiples embarcaciones, espacio de maniobra restringido y condiciones del mar variables. La durabilidad y la versatilidad son primordiales.
      features:
        - Distribución de cubierta polivalente para personal, materiales y equipos de buceo
        - Escalera de buceo y anclajes de equipo para operaciones de apoyo al buceo
        - Bitas de alta resistencia y mástil de remolque para maniobras en obras de construcción
        - Construcción Hypalon robusta resistente a escombros de obra y abrasión
        - Configuraciones de asientos flexibles — modo transporte de personal o carga
