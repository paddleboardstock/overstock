content_challenge:
  tagline: El desafío
  title: 'Los tenders de yate requieren<br />rendimiento y presentación'
  subtitle: 'Un tender de yate es más que un bote auxiliar — es una extensión del buque nodriza y una declaración de calidad.'
  paragraphs:
    - 'Los propietarios de yates y los capitanes necesitan tenders que rindan bien, se almacenen de forma compacta y presenten una imagen impecable. El tender debe complementar la estética del yate y, al mismo tiempo, ofrecer un transporte fiable para invitados y tripulación.'
    - '**El almacenamiento es fundamental** — El tender debe caber en cubierta, en un garaje o en los pescantes. El peso es decisivo para los sistemas de arriado e izado. Los RIB de Aquafarer ofrecen una excelente relación potencia-peso con perfiles de almacenamiento compactos.'
    - '**Las expectativas de rendimiento son altas** — Los invitados esperan una navegación suave y seca en el traslado a tierra. Las opciones de motor deben equilibrar velocidad, autonomía y niveles de ruido para una experiencia premium. En operaciones de chárter, el tender se utiliza a diario y debe soportar un uso frecuente.'
    - '**La imagen importa** — Un tender que no combina o está desgastado resta valor a la presentación general del yate. Los colores de flotadores personalizados, la tapicería y el branding garantizan que el tender luzca como parte del conjunto.'
content_solution:
  tagline: Nuestra solución
  title: 'Configuraciones de tender<br />Para cada aplicación náutica'
  subtitle: 'Los tenders RIB de Aquafarer pueden personalizarse para adaptarse a su embarcación, tipo de operación y requisitos de almacenamiento — desde especificaciones de astilleros de superyates hasta programas de flota de chárter.'
  list:
    - 'Colores de flotadores personalizados a juego o complementarios con el buque nodriza — cualquier color RAL disponible para flotadores de Hypalon o PVC'
    - 'Tapicería y costuras personalizadas — vinilo marino premium con cromatización a juego y bordado de logotipos'
    - 'Dirección por consola o caña — elija según el patrón de uso y la preferencia del operador'
    - 'Casco en V profunda de fibra de vidrio para una navegación suave y seca en diversas condiciones de mar'
    - 'Almacenamiento compacto — se desinfla o se apila para su almacenamiento en garaje de popa, pañol o pescantes'
    - 'Flotadores de Hypalon para resistencia a los rayos UV y conservación de la imagen a largo plazo'
    - 'Puntos de izado y argollas de remolque de serie en todos los modelos'
    - 'Funda de proa, cubierta total y protectores antirroce opcionales'
    - 'Gama de motores: de 15 HP a 60 HP — configuraciones de fueraborda o caña'
    - 'Etiquetado OEM/privado disponible para astilleros y distribuidores náuticos'
content_segments:
  tagline: Perfiles de cliente
  title: 'Soluciones de tender para yates<br />Según el tipo de cliente'
  subtitle: 'Los distintos segmentos del sector náutico tienen requisitos únicos. Aquafarer configura tenders para cada aplicación.'
  items:
    - title: Astilleros de superyates
      subtitle: Integración OEM del tender — dimensiones, colores y materiales personalizados
      description: 'Los astilleros se enfrentan a un desafío recurrente: cada nueva embarcación tiene limitaciones dimensionales, límites de peso y expectativas estéticas únicos. El tender debe integrarse perfectamente con el sistema de pescantes del buque nodriza, encajar en las dimensiones exactas del garaje y combinar con el lenguaje de diseño de un yate de varios millones de euros. Cualquier desajuste — un color de flotador incorrecto, puntos de izado mal ubicados, un peso incompatible — retrasa la entrega y perjudica la imagen del astillero. Aquafarer trabaja directamente con los equipos de compras y diseño de los astilleros para entregar tenders con colores RAL de flotador personalizados, tapicería a juego, paneles de consola con marca y paquetes completos de documentación OEM.'
      features:
        - 'Especificaciones dimensionales personalizadas que cumplen las limitaciones del garaje y los pescantes'
        - 'Cualquier color RAL de flotador y tapicería a juego — muestras de aprobación de diseño proporcionadas'
        - 'Marca OEM en consola, flotadores y respaldos de asientos'
        - 'Validación de ajuste de puntos de izado y pescantes para cada modelo'
        - 'Peso del casco optimizado para los sistemas de arriado e izado especificados'
        - 'Planificación de entregas en lote alineada con los calendarios de producción'
    - title: Empresas de gestión de yates
      subtitle: Tenders estandarizados de flota — soporte global, mínimas paradas
      description: 'Las empresas de gestión supervisan varios yates que operan en el Mediterráneo, el Caribe, el Pacífico Sur y más allá. Su necesidad central es la fiabilidad — un tender averiado en un puerto remoto significa horas extra de tripulación, quejas de invitados y caros reemplazos de última hora. Las especificaciones de flota estandarizadas reducen el tiempo de formación de la tripulación entre embarcaciones y simplifican la gestión de repuestos. Aquafarer ofrece precios de flota multimercante, especificaciones consistentes entre pedidos y soporte mundial de repuestos para empresas de gestión con embarcaciones en varias regiones.'
      features:
        - 'Especificaciones estandarizadas en toda la flota gestionada'
        - 'Repuestos intercambiables en todos los tenders de la flota'
        - 'Precios de flota y descuentos por volumen en pedidos de varias unidades'
        - 'Disponibilidad mundial de repuestos — envío rápido a cualquier puerto'
        - 'Documentación de servicio y mantenimiento uniforme para la tripulación'
        - 'Coordinación de entregas de varias unidades en diferentes ubicaciones de embarcaciones'
    - title: Operadores de chárter de yates
      subtitle: Operaciones diarias de alta frecuencia — durabilidad sin comprometer la imagen
      description: 'Los tenders de chárter afrontan el calendario operativo más exigente del sector náutico: traslados diarios de invitados, excursiones a tierra, apoyo a deportes acuáticos y servicio en puerto — a menudo más de 200 operaciones por temporada de chárter. El tender debe lucir impecable en cada entrega a los invitados y, al mismo tiempo, resistir el embarque continuo, la exposición al agua salada y las horas de motor. La degradación estética es una preocupación empresarial directa — un tender desgastado afecta a las reseñas de los invitados y a las tarifas de chárter. Aquafarer configura los tenders de chárter con tapicería mejorada, flotadores de Hypalon de alta resistencia y zonas de manipulación reforzadas para una durabilidad a largo plazo que mantiene la calidad de presentación.'
      features:
        - 'Flotadores de Hypalon de alta resistencia — vida útil de 5-8 años en servicio diario de chárter'
        - 'Escalones de embarque y líneas de agarre reforzados para uso frecuente'
        - 'Tapicería de vinilo premium resistente a manchas — fácil limpieza entre chárteres'
        - 'Superficies de cubierta antideslizantes de fácil limpieza'
        - 'Paquetes de fueraborda fiables con fácil acceso de servicio para rotaciones rápidas'
        - 'Materiales de grado cosmético que mantienen la imagen a lo largo de las temporadas de chárter'
    - title: Distribuidores y brokers de yates
      subtitle: Suministro fiable de tenders para la finalización de embarcaciones y el valor de reventa
      description: 'Los distribuidores y brokers necesitan un suministro estable de tenders de calidad que complementen las embarcaciones que venden — en sintonía con el posicionamiento de la marca y mejorando la experiencia del comprador. Un tender inconsistente o un retraso en el suministro pueden retrasar la entrega de un yate o perjudicar la presentación de un anuncio. Los distribuidores requieren calidad constante entre lotes, plazos de entrega fiables y precios competitivos para mantener sus márgenes. Aquafarer ofrece programas de inventario para distribuidores con planificación de entregas estacional, opciones de co-branding para exposición en sala y asignación prioritaria durante la temporada alta.'
      features:
        - 'Programas de stock con modelos disponibles bajo demanda'
        - 'Planificación de entregas estacional alineada con el calendario de entrega de embarcaciones'
        - 'Co-branding del distribuidor en consola y flotadores para exposición en sala'
        - 'Calidad y especificaciones uniformes en todos los pedidos por lotes'
        - 'Precios competitivos para distribuidores con niveles basados en volumen'
