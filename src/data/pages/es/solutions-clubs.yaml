testimonial:
  content: Empezamos con el Club Starter Package para nuestra escuela de surf en Portugal. 20 tablas, remos, chalecos... todo llegó en 3 semanas. Después de dos temporadas, actualizamos al paquete Pro. La marca personalizada con nuestro logotipo cambió las reglas del juego para nuestra imagen profesional.
  name: ricardo santos
  title: Propietario, Algarve Surf Academy - Lagos, Portugal
content_segments:
  tagline: Perfiles de clubes
  title: Soluciones para Clubes de Deportes Acuáticos<br />Por Tipo de Club
  subtitle: 'Desde clubes de pádel universitarios hasta clubes náuticos privados exclusivos: cada tipo de club tiene necesidades de equipo, patrones de uso y estructuras presupuestarias únicas. Adaptamos cada paquete para que coincida con el modelo del club.'
  items:
    - title: Clubes de pádel universitarios y universitarios
      subtitle: Flotas de estudiantes de alto uso
      description: Clubes de paddle administrados por estudiantes o apoyados por instituciones que operan programas SUP para departamentos de recreación universitaria. El equipo enfrenta un uso de alta frecuencia y alta rotación en múltiples niveles de habilidad cada semestre. La durabilidad y la fácil reparación son críticas, además de precios accesibles para organizaciones estudiantiles.
      features:
        - Construcción PVC extra-durable evaluada para ciclos de uso estudiantil
        - Gamas de tablas codificadas por color según el nivel de habilidad para una gestión fácil de la flota
        - Kit de reparación + con soporte en video disponible incluido con cada pedido
        - Precios con descuento para organizaciones estudiantiles y términos de pago por semestre
    - title: Pádel comunitario y clubes sociales
      subtitle: Clubes recreativos impulsados ​​por miembros
      description: Clubes comunitarios que ofrecen SUP experiencias sociales de remo y actividades sociales para los miembros. El equipamiento debe equilibrar rendimiento y comodidad para un amplio rango de edad, con una marca que fomente la identidad del club y el orgullo de los miembros. La eficiencia del almacenamiento es clave para los clubes que operan desde un acceso limitado al paseo marítimo.
      features:
        - 'Flota mixta: all-around y de SUPs gira'
        - 'Marca completa del club: colores personalizados, impresión de logotipos, PFDs de marca'
        - Soluciones compactas de almacenamiento para equipos inflables
        - 'Kit de inicio para el crecimiento de membresías: tarjetas de recomendación, fotografía de marca'
    - title: Escuelas y SUP Academias de Surf
      subtitle: Rendimiento costero y entrenamiento.
      description: Escuelas centradas en el surf que enseñan SUP habilidades de surf y surf de olas. El equipo debe funcionar en condiciones de oleaje — maniobrable, sensible y lo suficientemente resistente para soportar caídas repetidas, abrasión de arena y exposición al agua salada sin degradación rápida.
      features:
        - Formas más cortas y SUP anchas, optimizadas para la maniobrabilidad en el surf
        - Construcción de raíles reforzados para resistencia al impacto en ondas
        - 'Equipo de seguridad específico para el surf: correas enrolladas, opciones de aletas blandas'
        - Programa de reemplazo de flotas con descuentos estacionales por recompra
    - title: Clubes náuticos corporativos y privados
      subtitle: Experiencias de miembros premium
      description: 'Clubes privados exclusivos que ofrecen deportes acuáticos como amenidad premium para sus socios. Los estándares de equipamiento son altos: la estética, la alineación de la marca y la presentación lista para los invitados son tan importantes como el rendimiento. Las expectativas de servicio incluyen entrega con guante blanco, soluciones de almacenamiento personalizadas y soporte a nivel de conserjería.'
      features:
        - Paneles de acabado premium con detalles de veta EVA de madera y metálicos
        - Combinación personalizada de color según las directrices de la marca del club
        - 'Entrega de concierge: preinflada, preparada y etiquetada para cada temporada'
        - Gestión dedicada de cuentas con SLA de respuesta prioritaria
