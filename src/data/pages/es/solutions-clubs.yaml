hero:
  tagline: Clubes de deportes acuáticos
  title: Equipamiento y Soluciones<br />Para Clubes de Pádel y Centros de Entrenamiento
  subtitle: Paquetes completos de equipo, equipo de instructor, marca y soporte de mantenimiento para clubes de SUP, clubes de kayak, escuelas de surf y centros de entrenamiento de deportes acuáticos de cualquier tamaño.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Tablas de SUP Aquafarer para clubes de deportes acuáticos y flotas de alquiler
direct_answer: Aquafarer ofrece soluciones de equipos de extremo a extremo para clubes de deportes acuáticos y centros de entrenamiento en todo el mundo. Los paquetes de nuestro club incluyen tablas de SUP, kayaks, remos, bombas, kits de reparación y equipo de seguridad a precios mayoristas competitivos con MOQ bajos. Cada paquete se puede personalizar con logotipos del club, colores de marca y empaques personalizados. También brindamos capacitación en mantenimiento, soporte de repuestos y programas de rotación de equipos para maximizar la vida útil de su flota.
solution_offerings:
  - title: Paquete de inicio del club
    subtitle: Para clubes emergentes con entre 10 y 30 socios
    badge: Best Seller
    features:
      - title: Equipo básico
        description: 10 a 30 tablas de SUP o kayaks con remos, bombas y kits de reparación a juego
      - title: Equipo de seguridad
        description: Chalecos salvavidas, silbato y juegos de correas en los colores del club para cada tabla.
      - title: Equipo para instructores
        description: Tablas específicas para entrenadores con plataformas antideslizantes y estabilidad adicional
      - title: Paquete de marca
        description: Impresión de logotipos personalizados en tablas, remos y embalajes.
      - title: Materiales de capacitación
        description: Guías de lecciones para principiantes, protocolos de seguridad y listas de verificación de mantenimiento
    cta_text: 'Crear mi paquete de club'
    cta_href: /contact
  - title: Paquete Premium Club
    subtitle: Para clubes establecidos y operadores con múltiples ubicaciones
    badge: Professional
    features:
      - title: Flota completa
        description: 30-100 flota mixta de SUP, kayaks y accesorios
      - title: Sistema de seguridad avanzado
        description: Seguimiento de equipos RFID, aplicación de informes de daños, señalización de seguridad
      - title: Capacitación del personal
        description: Taller de certificación de instructores y mantenimiento de equipos en el sitio.
      - title: Soporte de marketing
        description: Fotografía profesional, folletos y plantillas para redes sociales.
      - title: Programa de reemplazo
        description: Actualización anual de equipos a tarifas reducidas con opciones de intercambio
    cta_text: 'Ampliar mi club'
    cta_href: /contact
