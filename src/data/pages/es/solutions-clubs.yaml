hero:
  tagline: Clubes de deportes acuáticos
  title: Equipamiento y Soluciones<br />Para Clubes de Paddle y Centros de Entrenamiento
  subtitle: Paquetes completos de equipo, equipamiento para instructores, branding y soporte de mantenimiento para clubes SUP, escuelas de surf y centros de entrenamiento de deportes acuáticos de cualquier tamaño.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP tablas para clubes de deportes acuáticos y flotas de alquiler
direct_answer: Paddle Board Overstock proporciona soluciones de equipamiento de principio a fin para clubes de deportes acuáticos y centros de entrenamiento en todo el mundo. Nuestros paquetes para clubes incluyen tablas SUP, palas, bombas, kits de reparación y equipo de seguridad a precios directos de fábrica para clubes. Cada paquete se puede personalizar con logotipos del club, colores de marca y empaques personalizados. También ofrecemos formación en mantenimiento, soporte de repuestos y programas de rotación de equipos para maximizar la vida útil de tu flota.
solution_offerings:
  - title: Paquete de inicio del club
    subtitle: Para clubes emergentes con entre 10 y 30 socios
    badge: Best Seller
    features:
      - title: Equipo básico
        description: 10–30 tablas SUP con palas a juego, bombas y kits de reparación
      - title: Equipo de seguridad
        description: Chalecos salvavidas, silbato y juegos de correas en los colores del club para cada tabla.
      - title: Equipo para instructores
        description: Tablas específicas para entrenadores con plataformas antideslizantes y estabilidad adicional
      - title: Paquete de marca
        description: Impresión de logotipos personalizados en tablas, remos y embalajes.
      - title: Materiales de capacitación
        description: Guías de lecciones para principiantes, protocolos de seguridad y listas de verificación de mantenimiento
    cta_text: Construye Mi Paquete de Club
    cta_href: /contact
  - title: Paquete Premium Club
    subtitle: Para clubes establecidos y operadores con múltiples ubicaciones
    badge: Professional
    features:
      - title: Flota completa
        description: 30–100 flota mixta de SUPs y accesorios
      - title: Sistema de seguridad avanzado
        description: Seguimiento de equipos RFID, aplicación de informes de daños, señalización de seguridad
      - title: Capacitación del personal
        description: Formación de instructores in situ y taller de mantenimiento de equipos
      - title: Soporte de marketing
        description: Fotografía profesional, folletos y plantillas para redes sociales.
      - title: Programa de reemplazo
        description: Actualización anual de equipos a tarifas reducidas con opciones de intercambio
    cta_text: Escala Mi Club
    cta_href: /contact
