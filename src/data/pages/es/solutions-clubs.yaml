testimonial:
  content: Empezamos con el Club Starter Package para nuestra escuela de surf en Portugal. 20 tablas, remos, chalecos... todo llegó en 3 semanas. Después de dos temporadas, actualizamos al paquete Pro. La marca personalizada con nuestro logotipo cambió las reglas del juego para nuestra imagen profesional.
  name: ricardo santos
  title: Propietario, Algarve Surf Academy - Lagos, Portugal
content_segments:
  tagline: Perfiles de clubes
  title: Soluciones para clubes de deportes acuáticos<br />Por tipo de club
  subtitle: 'Desde clubes de pádel universitarios hasta clubes náuticos privados exclusivos: cada tipo de club tiene necesidades de equipo, patrones de uso y estructuras presupuestarias únicas. Adaptamos cada paquete para que coincida con el modelo del club.'
  items:
    - title: Clubes de pádel universitarios y universitarios
      subtitle: Flotas de estudiantes de alto uso
      description: Clubes de remo dirigidos por estudiantes o respaldados por instituciones que operan programas de SUP y kayak para departamentos de recreación universitarios. Los equipos enfrentan un uso de alta frecuencia y alta rotación en múltiples niveles de habilidad cada semestre. La durabilidad y la fácil reparación son fundamentales, junto con precios económicos para las organizaciones estudiantiles.
      features:
        - 'Construcción de PVC extra resistente calificada para ciclos de uso estudiantil'
        - 'Gamas de tablas codificadas por color según el nivel para una gestión sencilla de la flota'
        - 'Kit de reparación + soporte de vídeo a demanda incluido en cada pedido'
        - 'Precios con descuento para organizaciones estudiantiles y pago por semestres'
    - title: Pádel comunitario y clubes sociales
      subtitle: Clubes recreativos impulsados por miembros
      description: Clubes comunitarios que ofrecen experiencias de SUP, kayak y remo social a sus miembros. El equipo debe equilibrar el rendimiento y la comodidad para un amplio rango de edades, con una marca que fomente la identidad del club y el orgullo de los miembros. La eficiencia del almacenamiento es clave para los clubes que operan desde un acceso limitado a la costa.
      features:
        - 'Flota mixta: SUPs polivalentes, tablas de travesía y kayaks recreativos'
        - 'Imagen de marca completa del club: colores personalizados, impresión del logotipo, chalecos salvavidas de marca'
        - 'Soluciones de almacenamiento compacto para equipos inflables'
        - 'Kit de inicio para el crecimiento de socios: tarjetas de referidos, fotografía de marca'
    - title: Escuelas de surf y academias de surf kayak
      subtitle: Rendimiento costero y entrenamiento.
      description: 'Escuelas centradas en el surf que enseñan surf SUP, kayak de surf y habilidades para montar olas. El equipo debe funcionar en condiciones de surf: maniobrable, receptivo y lo suficientemente duradero como para soportar golpes repetidos, abrasión de arena y exposición al agua salada sin una degradación rápida.'
      features:
        - 'Formas de SUP más cortas y anchas optimizadas para maniobrar en el surf'
        - 'Construcción de bordes reforzada para resistencia al impacto en las olas'
        - 'Equipo de seguridad específico para surf: correas en espiral, opciones de aletas flexibles'
        - 'Programa de reemplazo de flota con descuentos estacionales por entrega a cuenta'
    - title: Clubes náuticos corporativos y privados
      subtitle: Experiencias de miembros premium
      description: 'Clubes privados exclusivos que ofrecen deportes acuáticos como amenidad premium para sus socios. Los estándares de equipamiento son altos: la estética, la alineación de la marca y la presentación lista para los invitados son tan importantes como el rendimiento. Las expectativas de servicio incluyen entrega con guante blanco, soluciones de almacenamiento personalizadas y soporte a nivel de conserjería.'
      features:
        - 'Tablas con acabado premium con EVA de veta de madera y acentos metálicos'
        - 'Coincidencia de colores personalizada según las directrices de marca del club'
        - 'Entrega de conserjería: prehinchadas, preparadas y etiquetadas para cada temporada'
        - 'Gestión de cuenta dedicada con SLA de respuesta prioritaria'
