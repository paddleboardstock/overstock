content_priorities:
  tagline: Lo que verifican los clientes
  title: Ocho cosas que los compradores verifican<br />en cada visita a la fábrica
  subtitle: Según los comentarios de compradores de más de 50 países, estas son las ocho prioridades que los clientes evalúan antes de realizar un pedido B2B.
  items:
    - title: verdadero fabricante
      description: '¿Es usted la fábrica real, no una empresa comercial? Los compradores verifican: entidad comercial, equipo de producción real, empleados operando máquinas, órdenes de producción actuales en el piso y coherencia entre el sitio web y el taller.'
      icon: tabler:building-factory
    - title: Producto apto para la aplicación
      description: ¿El RIB coincide con su caso de uso específico? Los operadores de centros turísticos, rescate, buceo, pesca y patrullaje tienen requisitos fundamentalmente diferentes. Los compradores evalúan el diseño de la cubierta, el material de los tubos y las opciones de equipo en el barco exhibido.
      icon: tabler:target
    - title: Estabilidad de calidad y reproducibilidad
      description: ¿La unidad número 50 es tan buena como la primera? Los compradores examinan los sistemas de control de calidad, los puntos de control durante el proceso, el manejo de no conformidades y solicitan ver registros de múltiples ejecuciones de producción para verificar la coherencia.
      icon: tabler:repeat
    - title: Autenticidad del documento de cumplimiento
      description: ¿Los certificados CE son específicos del modelo? ¿El DoC está firmado por una persona real? ¿Se puede verificar el cumplimiento por número de casco? Los compradores verifican las reclamaciones generales frente a la documentación específica del modelo.
      icon: tabler:file-certificate
    - title: Ejecución de personalización
      description: ¿Puede la fábrica realmente ofrecer configuraciones personalizadas? Los compradores buscan evidencia de proyectos personalizados anteriores, muestras de prototipos en exhibición, dibujos de ingeniería y la capacidad de discutir modificaciones técnicas en el acto.
      icon: tabler:adjustments
    - title: Plazo de entrega y capacidad
      description: '¿Son realistas los plazos citados? Los compradores evalúan: el volumen de producción actual, la capacidad disponible, el tamaño de la fuerza laboral, los niveles de existencias de materiales y si la fábrica tiene un sistema de planificación de la producción.'
      icon: tabler:clock
    - title: Precio y términos comerciales
      description: '¿Los precios son transparentes? ¿Está claro el precio FOB? Los compradores verifican: desglose del precio unitario, costos de herramientas, costos de embalaje y si la fábrica puede manejar términos DDP o CIF con la documentación de exportación adecuada.'
      icon: tabler:currency-dollar
    - title: Postventa y repuestos
      description: '¿Qué pasa después del parto? Los compradores evalúan: disponibilidad de repuestos, proceso de garantía, reemplazo de secciones de tubo, reemplazo de válvulas y si la fábrica cuenta con un protocolo posventa documentado.'
      icon: tabler:headset
content_tour:
  tagline: Ruta del Tour por la Fábrica
  title: Tour de auditoría:<br />Lo que verá
  subtitle: Nuestro recorrido estándar por la fábrica sigue una ruta definida diseñada para responder las preguntas de los compradores en cada estación.
  items:
    - title: '1. Sala de reuniones: presentación de la empresa'
      description: Licencia comercial, certificados ISO 9001 y BSCI, licencias de exportación e historial de la empresa. Descripción rápida de las capacidades de producción y el alcance del cumplimiento.
      icon: tabler:users
    - title: 2. Almacén de Materias Primas – Estación IQC
      description: Registros de inspección de materiales entrantes, certificados de lotes de telas, adhesivos y muestras de hardware. Vea cómo se prueban los materiales antes de entrar en producción.
      icon: tabler:building-warehouse
    - title: '3. Fabricación de tubos: soldadura por radiofrecuencia y pegado manual'
      description: Proceso de soldadura o pegado de tubos vivos, demostraciones de pruebas de resistencia de las costuras e instalación de válvulas. Observe la construcción cámara por cámara y los puntos de control de calidad.
      icon: tabler:flame
    - title: '4. Laminación del casco: taller de GRP'
      description: Proceso de colocación de fibra de vidrio, aplicación de gelcoat y curado del casco. Consulte el programa de laminación y refuerzo estructural para los diferentes modelos de RIB.
      icon: tabler:layers-subtract
    - title: 5. Montaje e integración
      description: Unión casco-tubo, instalación de consola y asiento, integración de sistemas eléctricos y de combustible, y montaje de equipos. Observar la línea de producción en funcionamiento.
      icon: tabler:tool
    - title: 6. Estación de prueba de presión
      description: Prueba de retención de presión de 24 a 48 h a 1,25 veces la presión nominal. Vea registros de pruebas, manómetros y criterios de aprobación/rechazo. Vea cómo se vinculan los resultados de las pruebas con los números de serie del casco.
      icon: tabler:gauge
    - title: 7. Inspección final y control de calidad
      description: Lista de verificación de calidad de 100 puntos por unidad, verificación dimensional, inspección cosmética y verificación de integridad del empaque. Revisar los registros de no conformidad y los registros de acciones correctivas.
      icon: tabler:clipboard-check
    - title: 8. Sala de revisión de documentos
      description: Documentación de cumplimiento por modelo (DoC, placa de construcción, manual del propietario), registros de trazabilidad de producción, registro HIN y demostración de base de datos de seguimiento de lotes de materiales.
      icon: tabler:folder
content_qc_chain:
  tagline: Evidencia de calidad
  title: 'Cadena de control de calidad de 8 etapas<br />: verificable en cada paso'
  subtitle: Nuestra cadena de control de calidad va desde la entrada de materiales hasta el envío final, con evidencia documentada en cada etapa.
  items:
    - title: 'Etapa 1: Inspección del material entrante'
      description: Cada lote de PVC, Hypalon, fibra de vidrio, aluminio, adhesivos y herrajes se prueba según las especificaciones antes de ingresar a producción. Resistencia a la tracción, adhesión del recubrimiento y controles dimensionales según AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Etapa 2: Control de calidad de soldadura y pegado de tubos'
      description: Pruebas de resistencia al pelado de las costuras por lote de producción. Parámetros de soldadura por RF monitoreados y registrados. Costuras pegadas a mano revisadas para una cobertura adhesiva constante y tiempo de curado.
      icon: tabler:flame
    - title: 'Etapa 3: Control de calidad de laminación del casco'
      description: Medición del espesor del gelcoat, verificación de la colocación de fibra de vidrio según el cronograma del laminado y monitoreo del tiempo de curado. Posiciones de refuerzo estructural verificadas contra planos de ingeniería.
      icon: tabler:layers-subtract
    - title: 'Etapa 4: Control de calidad de ensamblaje e integración'
      description: Integridad de la unión casco-tubo, torque de montaje de la consola y el asiento, continuidad eléctrica y prueba de fugas del sistema de combustible. Cada punto de instalación se verifica con la lista de verificación de ensamblaje específica del modelo.
      icon: tabler:tool
    - title: 'Etapa 5: Prueba de retención de presión'
      description: Cada cámara inflable se presurizó a 1,25 veces la PSI nominal y se mantuvo durante 24 a 48 horas. Caída de presión registrada por cámara. Umbral de aprobación/rechazo documentado. Vinculado al número de serie del casco.
      icon: tabler:gauge
    - title: 'Etapa 6: Inspección final'
      description: Lista de verificación de calidad de 100 puntos que cubre precisión dimensional, acabado cosmético, integridad de los accesorios, paquete de documentación e integridad del embalaje. Independiente del equipo de producción.
      icon: tabler:clipboard-check
    - title: 'Etapa 7: Documentación de cumplimiento'
      description: Declaración de conformidad específica del modelo, verificación de la placa del fabricante, manual del propietario completo y entrada de registro HIN. Todos los documentos de cumplimiento preparados y verificados antes de la liberación del envío.
      icon: tabler:file-certificate
    - title: 'Etapa 8: Liberación y trazabilidad del envío'
      description: La versión final requiere que se pasen todas las etapas de control de calidad, se complete la documentación de cumplimiento y se verifique la documentación de envío. Registro del casco cerrado y archivado para conservación durante más de 10 años.
      icon: tabler:truck
content_traceability:
  tagline: Trazabilidad de la producción
  title: HIN → Archivo maestro →<br />Registro de casco → Entrega
  subtitle: Cada embarcación RIB lleva un número de identificación de casco único vinculado a una cadena de registro completa de producción y cumplimiento.
  items:
    - title: Número de identificación del casco (HIN)
      description: Identificador único de 14 caracteres marcado permanentemente en cada embarcación. Codifica el código del fabricante (MIC), la designación del modelo, el año de producción y el número de serie. La clave que abre la cadena de trazabilidad completa.
      icon: tabler:hash
    - title: Archivo Técnico Maestro
      description: La documentación de cumplimiento e ingeniería para la familia de modelos. Contiene dibujos GA, evaluación de riesgos, cálculos de estabilidad, especificaciones de materiales y estándares aplicables. Vinculado a todos los cascos de ese modelo.
      icon: tabler:folder
    - title: Registro de casco individual
      description: 'Registro de producción por casco: HIN, fecha de producción, lote de tubos, certificados de materiales, resultado de la prueba de presión, configuración final, especificaciones del motor, resultados de la lista de verificación de calidad y destino de entrega. Más de 21 campos de datos por casco.'
      icon: tabler:file-description
    - title: Paquete de cumplimiento del cliente
      description: Paquete de entrega por casco que incluye declaración de conformidad, fotografía de la placa de construcción, manual del propietario, lista de verificación de cumplimiento y hoja de configuración final. Enviado con el barco y archivado en fábrica durante más de 10 años.
      icon: tabler:package
content_red_flags:
  tagline: Errores de la auditoría
  title: Los compradores de señales de alerta<br />identifican fácilmente
  subtitle: Problemas comunes que socavan la confianza del comprador durante las auditorías de fábrica. Abordamos cada uno de forma proactiva.
  items:
    - title: Reclamaciones CE generales sin alcance del modelo
      description: '"Todos los productos con certificación CE" sin especificar qué directiva, qué modelos y qué módulo de conformidad. Señal de alerta: sugiere que el cumplimiento es superficial y no por modelo o configuración.'
      icon: tabler:alert-triangle
    - title: Sin evidencia de pruebas físicas
      description: 'Reclamaciones de pruebas de presión sin registros de prueba, medidores o estación de prueba visible en el piso de la fábrica. Bandera roja: las afirmaciones de calidad no se pueden verificar durante la visita.'
      icon: tabler:alert-triangle
    - title: Trazabilidad del material faltante
      description: 'Sin registros de lotes, sin inspecciones entrantes o sin vínculo entre los certificados de materiales y los productos terminados. Bandera roja: no hay forma de rastrear los problemas de calidad hasta el origen.'
      icon: tabler:alert-triangle
    - title: Documentación genérica
      description: 'Una declaración de conformidad que cubre todos los modelos, sin registros específicos de HIN ni documentos de cumplimiento tipo "modelo". Señal de alerta: el cumplimiento no está vinculado a unidades de producción individuales.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Envío y embalaje
  title: Carga y embalaje en contenedor<br />de embarcaciones RIB
  subtitle: Nuestras soluciones de envío protegen su inversión desde Qingdao hasta el puerto de destino. Planes de carga de contenedor y especificaciones de embalaje disponibles para cada modelo.
  items:
    - title: Configuraciones de contenedor de 20 pies
      description: 'Contenedor estándar de 20 pies: 1-2 embarcaciones RIB (4,0-5,5 m) encajadas con cubierta y tubos separados, u 8-12 tablas de SUP. Configuraciones mixtas RIB + SUP disponibles. Plan de carga detallado proporcionado con cada pedido.'
      icon: tabler:box
    - title: Configuraciones de contenedor de 40 pies
      description: 'Contenedor estándar de 40 pies: 2-4 embarcaciones RIB (hasta 7,0 m) con cascos encajados y tubos apilados, o 20-30 tablas de SUP. Contenedor 40 pies HQ disponible para modelos RIB más altos. Embalaje optimizado en volumen que reduce el coste de envío por unidad.'
      icon: tabler:container
    - title: Embalaje de madera para cascos RIB
      description: Cascos de aluminio y GRP encajonados en cajas de madera a medida con acolchado de espuma, barrera contra la humedad y flejes de acero. Dimensiones y peso de las cajas por modelo disponibles para la planificación logística. Certificación ISPM-15 de madera tratada térmicamente incluida.
      icon: tabler:wood
    - title: Embalaje con separación de tubos y cubierta
      description: Tubos desinflados y plegados por separado de los cascos para mayor eficiencia de espacio. Placas de cubierta, consolas y asientos embalados en envoltorio protector con kits de herrajes de montaje. Instrucciones de reensamblaje incluidas en cada envío.
      icon: tabler:package
    - title: Protección contra humedad y corrosión
      description: Papel anticorrosivo VCI para componentes de aluminio, bolsas de desecante de gel de sílice y bolsas de herrajes selladas al vacío. Previene daños por condensación durante el tránsito marítimo de 30-45 días.
      icon: tabler:droplet-off
    - title: Documentación FOB Qingdao
      description: Conocimiento de embarque, factura comercial, lista de empaque, certificado de origen y documentación de cumplimiento por envío. Consolidación FCL y LCL disponible. Soporte de documentación aduanera para mercados de la UE, EE. UU. y Oriente Medio.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Evidencias verificables en fábrica
  title: Evidencias de auditoría<br />verificables en planta
  subtitle: Durante las visitas a fábrica, los clientes pueden verificar evidencias concretas en cada área de producción. Esto es lo que conviene comprobar — y lo que preparamos para cada auditoría.
  areas:
    - area: Almacén de materias primas
      what_to_verify: ¿Los materiales están en buen estado? ¿Hay mezcla de lotes?
      evidence: Registros de inspección de entrada, etiquetas de lote, almacenamiento FIFO, lista de proveedores homologados, certificados de material (PVC, Hypalon, fibra de vidrio, aluminio, adhesivos, herrajes)
      icon: tabler:building-warehouse
    - area: Producción de tubos
      what_to_verify: ¿Cómo se garantizan la resistencia de las costuras y la estanqueidad?
      evidence: Fichas de proceso, confirmación de primera pieza, registros de ensayo de presión por cámara, bitácoras de reparación y reensayo, registros de instalación de válvulas
      icon: tabler:flame
    - area: Producción del casco
      what_to_verify: ¿Cómo se controla la consistencia estructural?
      evidence: Documentación controlada del proceso, puntos de control de calidad, numeración de productos semielaborados, mediciones de espesor del gelcoat, verificación del calendario de laminado
      icon: tabler:layers-subtract
    - area: Área de ensamblaje
      what_to_verify: ¿Cómo se evita el montaje erróneo de los opcionales?
      evidence: Listas de materiales (BOM), órdenes de trabajo, checklists de configuración, fichas de inspección por puesto, comprobaciones de par de apriete y funcionales por modelo
      icon: tabler:tool
    - area: Estación de ensayos
      what_to_verify: ¿Cómo se confirma que el barco está en buen estado antes de la entrega?
      evidence: Procedimientos de ensayo, lista de instrumentos, registros de calibración, bitácoras de ensayo de presión (1,25x / 24-48h), checklists de ensayo funcional, criterios de aprobación/rechazo documentados
      icon: tabler:gauge
    - area: Área de no conformidades
      what_to_verify: ¿Cómo se tratan los defectos?
      evidence: Etiquetas de segregación, registros de no conformidad (NCR), análisis de causa raíz, registros de aprobación de retrabajo, seguimiento CAPA (acción correctiva y preventiva)
      icon: tabler:alert-triangle
    - area: Almacén de producto terminado
      what_to_verify: ¿Cómo se evitan los envíos erróneos y los daños?
      evidence: Etiquetas de producto terminado, registros de correspondencia con pedidos, estándares de embalaje, registros de inspección previa al envío
      icon: tabler:box
    - area: Recambios y posventa
      what_to_verify: ¿Pueden ofrecer soporte posventa a largo plazo?
      evidence: Lista de recambios habituales, estrategia de inventario, sistema de numeración de piezas, documentación del proceso de garantía, tutoriales de mantenimiento
      icon: tabler:headset

content_closing_script:
  tagline: De la auditoría al pedido
  title: De la visita a fábrica<br />al proyecto confirmado
  subtitle: Una auditoría exitosa no debería terminar con fotos y un apretón de manos. Antes de su partida, nos aseguramos de que tres resultados comerciales queden documentados.
  items:
    - title: Confirmar la configuración técnica
      description: Acuerdo sobre modelo, aplicación, opciones clave, mercado objetivo, cantidad estimada y calendario de entrega — todo documentado antes de su partida.
      icon: tabler:checklist
    - title: Confirmar los documentos del siguiente paso
      description: 'Definición de lo que Aquafarer entregará a continuación: GA revisado, lista de configuración, cotización, checklist de documentos, plan de muestras o NDA — con plazos concretos.'
      icon: tabler:file-plus
    - title: Confirmar el cronograma conjunto
      description: Configuración revisada y cotización preliminar en 3 días laborables. Confirmación de muestra o de acabado en 7 días. Revisión de ingeniería o inspección de terceros en 14 días. Fecha de la próxima reunión y responsables fijados.
      icon: tabler:calendar

faq:
  title: 'Auditoría de fábrica: preguntas frecuentes'
  questions:
    - q: ¿Puedo visitar la fábrica en persona?
      a: Sí. Damos la bienvenida a las auditorías de fábrica in situ en nuestras instalaciones de 12.000 m² en Qingdao. Nuestro recorrido estándar cubre 8 estaciones desde el almacén de materia prima hasta la sala de revisión de documentos. También se encuentran disponibles recorridos virtuales por la fábrica mediante videollamada para la calificación inicial.
    - q: ¿Aceptan auditorías de terceros (BSCI, SMETA, SGS)?
      a: Sí. Mantenemos la certificación BSCI (Intertek) y aceptamos protocolos de auditoría específicos del cliente. También podemos organizar inspecciones SGS o TÜV a pedido. Los informes de auditoría están disponibles bajo NDA.
    - q: ¿Puedo ver las pruebas de presión durante la visita?
      a: Nuestra estación de prueba de presión es parte de la ruta turística estándar. Dependiendo del programa de producción, es posible que observe pruebas de presión activas con lecturas de manómetros y registros de pruebas. Los registros de pruebas de presión por casco siempre están disponibles para su revisión.
    - q: ¿Cómo maneja los productos no conformes?
      a: Las unidades no conformes se segregan, documentan y revisan según nuestro proceso de acciones correctivas ISO 9001. Se realiza un análisis de causa raíz, se implementan acciones correctivas y se mantienen registros. Los compradores pueden revisar nuestro registro NCR durante las auditorías.
    - q: ¿Qué documentación de cumplimiento está disponible para su revisión?
      a: 'Durante la auditoría, puede revisar: muestras de declaración de conformidad específicas del modelo, especificaciones de la placa de construcción, registro HIN, borradores del manual del propietario, listas de estándares aplicables y registros de evaluación de la conformidad por familia de modelos.'
    - q: ¿Cómo reservo un recorrido virtual por la fábrica?
      a: Comuníquese con nuestro equipo de ventas para programar un recorrido en video en vivo a través de WhatsApp, Zoom o Teams. Seguimos la misma ruta de 8 estaciones y podemos centrarnos en áreas específicas según sus intereses. El recorrido virtual típico dura entre 45 y 60 minutos.
    - q: ¿Es la fábrica el fabricante real o una empresa comercial?
      a: Aquafarer es el fabricante real. Operamos la fábrica en Laixi, Qingdao. La licencia comercial, el alcance de la fabricación y la producción física son todos verificables durante la auditoría.
    - q: ¿Qué registros de calidad puedo revisar?
      a: Registros de inspección de materiales entrantes, puntos de control de calidad en proceso, registros de pruebas de presión, listas de verificación de inspección final de 100 puntos, informes de no conformidad, registros de acciones correctivas y registros de trazabilidad por casco. Todo mantenido según los requisitos de ISO 9001.
