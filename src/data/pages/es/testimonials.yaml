testimonials:
  - category: clubes
    name: ricardo santos
    title: Propietario, Academia de Surf Algarve
    location: Lagos, Portugal
    content: Comenzamos con el Club Starter Package para nuestra escuela de surf. 20 tablas, remos, chalecos... todo llegó en 3 semanas. Después de dos temporadas, actualizamos al paquete Pro. La marca personalizada con nuestro logotipo cambió las reglas del juego para nuestra imagen profesional.
    rating: 5
    product: Paquete de inicio del club
    source: solutions/clubs
  - category: clubes
    name: Dueño del club
    title: Club de deportes acuáticos
    location: Phuket, Tailandia
    content: 'El paquete Club Starter fue el punto de entrada perfecto. A medida que nuestro negocio crecía, Paddle Board Overstock crecía con nosotros: la misma calidad, el mismo precio, sin sorpresas. Escalamos de 10 a 80 tableros en 18 meses.'
    rating: 5
    product: Club Inicial + Paquete Premium
    source: success-stories
  - category: complejos turísticos
    name: Gerente General del Resort
    title: Resort de playa de 5 estrellas
    location: Grecia
    content: 'Paddle Board Overstock no solo entregó tablas: nos ayudó a crear una experiencia completa para los huéspedes. Nuestro programa de deportes acuáticos pasó de cero a lo más destacado del resort en una temporada. Más de 300 reservas semanales y 180.000 dólares de ingresos anuales.'
    rating: 5
    product: Paquete Resort Premium
    source: success-stories
  - category: complejos turísticos
    name: Sofía Laurent
    title: Director de Experiencia del Huésped, Azure Bay Resorts
    location: Phuket, Tailandia
    content: Paddle Board Overstock diseñó y equipó todo nuestro programa de actividades en la playa en tres propiedades del resort. 80 SUP, 40 kayaks, infraestructura de seguridad y capacitación del personal, todo entregado en un solo envío. La participación de invitados aumentó un 60% en la primera temporada.
    rating: 5
    product: Paquete Resort Premium
    source: solutions/resorts
  - category: empresarios
    name: michael parque
    title: Fundador de Shoreline Paddle Co.
    location: California, Estados Unidos
    content: Lancé mi marca de SUP sin experiencia en la industria. El equipo de Paddle Board Overstock me guió desde la selección de productos hasta el diseño de logotipos y empaques personalizados. Mi primer contenedor llegó en 11 semanas y se agotó en 3 meses en Amazon.
    rating: 5
    product: Lanzamiento de marca inicial
    source: solutions/entrepreneurs
  - category: empresarios
    name: Fundador
    title: Marca australiana de SUP
    location: Australia
    content: Tenía la idea de la marca pero ningún conocimiento de fabricación. Paddle Board Overstock literalmente me tomó de la mano durante todo el proceso, desde elegir el diseño de placa correcto hasta abrir mi primer envío. 90 días desde el sueño hasta la entrega.
    rating: 5
    product: Paquete de lanzamiento de marca
    source: success-stories
  - category: alquiler
    name: Daniel Okonkwo
    title: Propietario, Lakeland SUP Rentals
    location: Ontario, Canadá
    content: Estaba alquilando 5 tablas en una tienda local y perdía el 60% de mis ingresos con ellas. Paddle Board Overstock me ayudó a construir mi propia flota de 15 SUP. La calculadora de retorno de la inversión mostró un punto de equilibrio en 4 meses; se necesitaron 3. Ahora me estoy ampliando a 30 tableros.
    rating: 5
    product: Kit de inicio de flota
    source: solutions/rental-business
  - category: alquiler
    name: Marco Valentí
    title: Director de Operaciones, Adriatic Adventure Tours
    location: Dubrovnik, Croacia
    content: 'Equipamos toda nuestra flota de alquiler con RIB Paddle Board Overstock: 12 embarcaciones en tres ubicaciones. Dos temporadas y cero fracasos. La documentación de certificación CE facilitó la aprobación del seguro. Su equipo de ingeniería incluso personalizó los colores de los tubos.'
    rating: 5
    product: Kit de expansión de flota
    source: trust
  - category: alquiler
    name: Teniente comandante Andrés Reyes
    title: Oficial de adquisiciones marítimas, Auxiliar de la Guardia Costera de Filipinas
    location: Manila, Filipinas
    content: 'Operamos 24 RIB Paddle Board Overstock en toda nuestra flota de patrulla costera. Su proceso de control de calidad es consistente en todos los lotes: la misma calidad de costura, la misma ubicación de válvula, la misma presión nominal en todo momento. Esa repetibilidad es importante cuando la vida depende del equipo.'
    rating: 5
    product: Flota de patrulla RIB
    source: trust
  - category: consumidores
    name: sara k.
    title: Propietario de SUP por primera vez
    location: Lago Tahoe, Estados Unidos
    content: Estable incluso para un principiante. Lo saqué al lago el primer día y nunca me caí. El paquete completo con bomba y remo significó que estaba en el agua 20 minutos después de abrir la caja.
    rating: 5
    product: Explorador de SUP 11
  - category: consumidores
    name: James Thornton
    title: Propietario de SUP Explorer 11
    location: Vancouver, Canadá
    content: Como compradora por primera vez, estaba nervioso por los pedidos de calidad desde el extranjero. La documentación ISO y los informes de pruebas de terceros que compartieron antes de que yo preguntara me dieron total confianza. La placa llegó en 6 días y superó mis expectativas.
    rating: 5
    product: Explorador de SUP 11
    source: trust
  - category: consumidores
    name: mike r.
    title: Kayakista recreativo
    location: Florida, Estados Unidos
    content: Calidad de construcción sólida. Maneja el corte costero mucho mejor de lo que esperaba de un inflable. Lo empaqué en el baúl de mi auto para un viaje de fin de semana y lo inflé en la rampa en menos de 4 minutos.
    rating: 5
    product: Kayak inflable
