testimonials:
  - category: clubs
    name: ricardo santos
    title: Propietario, Academia de Surf Algarve
    location: Lagos, Portugal
    content: Comenzamos con el Club Starter Package para nuestra escuela de surf. 20 tablas, remos, chalecos... todo llegó en 3 semanas. Después de dos temporadas, actualizamos al paquete Pro. La marca personalizada con nuestro logotipo cambió las reglas del juego para nuestra imagen profesional.
    rating: 5
    product: Paquete de inicio del club
    source: solutions/clubs
  - category: clubs
    name: Dueño del club
    title: Club de deportes acuáticos
    location: Phuket, Tailandia
    content: El Paquete Inicial para Clubes fue el punto de entrada perfecto. A medida que nuestro negocio crecía, Paddle Board Overstock crecía con nosotros — misma calidad, mismo precio, sin sorpresas. Pasamos de 10 a 80 tablas en 18 meses.
    rating: 5
    product: Club Inicial + Paquete Premium
    source: success-stories
  - category: resorts
    name: Gerente General del Resort
    title: Resort de playa de 5 estrellas
    location: Grecia
    content: Paddle Board Overstock no solo entregó tablas — nos ayudó a construir una experiencia completa para los huéspedes. Nuestro programa de deportes acuáticos pasó de cero a ser lo más destacado del resort en una temporada. 300+ reservas semanales y $180K en ingresos anuales.
    rating: 5
    product: Paquete Resort Premium
    source: success-stories
  - category: resorts
    name: Sofía Laurent
    title: Director de Experiencia del Huésped, Azure Bay Resorts
    location: Phuket, Tailandia
    content: Paddle Board Overstock diseñó y equipó todo nuestro programa de actividades de playa en tres propiedades de resort. 120 SUPs, infraestructura de seguridad y capacitación del personal — todo entregado en un solo envío. La participación de los huéspedes aumentó un 60% en la primera temporada.
    rating: 5
    product: Paquete Resort Premium
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Propietario, Lakeland SUP Rentals
    location: Ontario, Canadá
    content: Estaba alquilando 5 tablas de una tienda local y perdiendo el 60% de mis ingresos con ellos. Paddle Board Overstock me ayudó a construir mi propia flota de 15 SUPs. La calculadora ROI mostró el punto de equilibrio en 4 meses — tardó 3. Ahora estoy ampliando a 30 tablas.
    rating: 5
    product: Kit de inicio de flota
    source: solutions/rental-business
  - category: rental
    name: Marco Valentí
    title: Director de Operaciones, Adriatic Adventure Tours
    location: Dubrovnik, Croacia
    content: Equipamos toda nuestra flota de alquiler SUP con tablas Paddle Board Overstock — 30 tablas en tres ubicaciones. Dos temporadas después, cero fallas. La calidad constante en cada lote facilitó nuestra elección, y su equipo incluso igualó los colores con nuestra marca.
    rating: 5
    product: Paquete de flota de alquiler
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Propietaria, Lake Garda SUP Rentals
    location: Lago de Garda, Italia
    content: Nuestras tablas de alquiler salen cinco veces al día en temporada alta. Desde que cambiamos a Paddle Board Overstock, las quejas por daños cayeron casi a cero, y los clientes siguen preguntando dónde pueden comprar su propia tabla.
    rating: 5
    product: Paquete de flota de alquiler
    source: solutions/rental-business
  - category: consumers
    name: sara k.
    title: Propietario de SUP por primera vez
    location: Lago Tahoe, Estados Unidos
    content: Estable incluso para un principiante. Lo saqué al lago el primer día y nunca me caí. El paquete completo con bomba y remo significó que estaba en el agua 20 minutos después de abrir la caja.
    rating: 5
    product: Explorador de SUP 11
  - category: consumers
    name: James Thornton
    title: Propietario de SUP Explorer 11
    location: Vancouver, Canadá
    content: Como comprador primerizo, estaba nervioso por pedir desde el extranjero. La calidad de construcción habló por sí misma en el momento en que la saqué de la caja — rígida, costuras impecables, y llegó en solo 6 días.
    rating: 5
    product: Explorador de SUP 11
    source: trust
  - category: consumers
    name: mike r.
    title: Paddler de fin de semana
    location: Florida, Estados Unidos
    content: Calidad de construcción sólida. Maneja el corte costero mucho mejor de lo que esperaba de un inflable. Lo empaqué en el baúl de mi auto para un viaje de fin de semana y lo inflé en la rampa en menos de 4 minutos.
    rating: 5
    product: SUP Brisa Tropical
