hero:
  tagline: Proceso
  title: Proceso de fabricación
  subtitle: Desde materia prima hasta tabla lista para el mar — cada paso bajo nuestro control
  back_label: Volver a la Fábrica
  back_link: /factory
intro: A diferencia de las marcas que externalizan la producción a fábricas externas, Paddle Board Overstock posee y opera toda su cadena de producción. Esta integración vertical nos permite mantener un control de calidad estricto en cada etapa y ofrecer una calidad de producto consistente lote tras lote. Así es como se construye una placa en nuestras instalaciones.
steps:
  - step: '01'
    title: Recibo e Inspección de Materiales
    description: Cada lote entrante de PVC tela, drop-stitch núcleo, EVA espuma y herraje se inspecciona según las especificaciones. Las muestras de tela se analizan para determinar su resistencia a la tracción, uniformidad de grosor y UV resistencia antes de su liberación a producción. Los materiales no conformes se ponen en cuarentena y se devuelven.
    duration: 1–2 días
  - step: '02'
    title: PVC Corte automático
    description: Las tejidas aprobadas se colocan en la CNC máquina de corte automática y se cortan con precisión submilimétrica. El anidamiento optimizado por ordenador dispone los paneles para minimizar el desperdicio — normalmente por debajo del 5%. Los paneles cortados se etiquetan por modelo de placa y cámara, y luego se agrupan para su transferencia al taller de soldadura.
    duration: 2–4 horas por kit de tabla
  - step: '03'
    title: Sellado térmico y soldadura de tubos
    description: Los paneles se fijan y se unen mediante máquinas de sellado térmico con soldadura a aire caliente a temperaturas controladas de 200–600 °C. Las juntas principales se refuerzan con soldadura dieléctrica RF para juntas herméticas y de alta resistencia. Las cámaras terminadas se inflan a una presión de trabajo del 1,25× para una validación de retención de aire en 30 minutos.
    duration: 1–2 días por junta
  - step: '04'
    title: Arte de la cubierta y acabado EVA
    description: 'Aquí toman forma las cubiertas de la serie Art: EVA paneles de espuma cortados con precisión se colocan en patrones completos, se pegan y se recortan a mano. Aderentes, cómodos y duraderos — el aspecto característico de toda tabla de la serie Art.'
    duration: 1–2 días
  - step: '05'
    title: Impresión y decoración SUP
    description: Los SUP gráficos de tablero se aplican mediante impresión digital para diseños de calidad fotográfica a todo color, y serigrafía para logotipos duraderos y patrones repetitivos. Las impresiones se curan y sellan para UV resistir la abrasión.
    duration: 1–2 días
  - step: '06'
    title: Ensamblaje final y aparejo
    description: 'Las placas reciben sus componentes finales: las válvulas se aprietan y se prueban en su funcionamiento, se instalan anillos en D, manillas y cajas de aletas, y se asegura la correa. Cada placa sigue una lista de comprobación de ensamblaje de 100 puntos con aprobación obligatoria en cada etapa.'
    duration: 2-3 días
  - step: '07'
    title: Pruebas de calidad e inspección
    description: 'Cada placa terminada pasa por la puerta de calidad obligatoria: prueba de retención de aire en la cámara, comprobación de funcionamiento del sistema, verificación del par de los sujetadores e inspección estética. Las construcciones personalizadas y prototipo también reciben pruebas en el mar en el agua que abarcan velocidad, manejo, estabilidad y autonomía.'
    duration: 1–2 días
  - step: '08'
    title: Embalaje y envío
    description: Las tablas se desinflan, enrollan y se guardan en mochilas de viaje con bomba, pala, aleta, correa y kit de reparación, y luego se empaquetan para envío por mensajería y carga. Cada paquete está etiquetado con modelo, número de serie y destino. Enviamos a 50+ países en todo el mundo.
    duration: 1 día
