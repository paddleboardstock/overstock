comparison_matrix:
  title: 'OEM frente a ODM: ¿qué modelo se adapta a su proyecto?'
  subtitle: Cuatro modos de colaboración, cada uno con diferentes niveles de participación de la fábrica y control de la marca.
  columns:
    - header: Modo de colaboración
    - header: El papel de tu marca
    - header: Rol del Aquafarer
  rows:
    - option: Fabricación OEM
      standard: Proporcionar marca, especificaciones y requisitos de cumplimiento.
      premium: Construya según sus especificaciones utilizando nuestros moldes y líneas de producción existentes.
    - option: Personalización ODM
      standard: Seleccione un modelo base, personalice las características y la marca
      premium: Adapte la plataforma RIB probada con las modificaciones que desee
    - option: RIB semipersonalizado
      standard: Definir la longitud del casco, el material de los tubos, la disposición de la cubierta y el equipo.
      premium: Modifique el casco existente con una configuración de tubos y un plano de cubierta personalizados
    - option: Desarrollo personalizado completo
      standard: Proporcionar el concepto y los requisitos del mercado objetivo.
      premium: 'Diseño desde cero: casco personalizado, molde y documentación completa'
content_customization:
  tagline: Qué se puede personalizar
  title: Opciones de personalización de RIB<br />
  subtitle: Cada elemento de una embarcación RIB se puede adaptar a los requisitos de su aplicación, mercado y marca.
  items:
    - title: Casco y Estructural
      description: Longitud del casco (2,5 a 8,5 m), material del casco (fibra de vidrio GRP o aluminio de calidad marina), color del casco (gelcoat o pintado), perfil de la quilla (V profunda, V moderada, plana), tipo de espejo de popa (travesaño cerrado con soporte o pozo) y refuerzo estructural para requisitos de carga comercial.
      icon: tabler:sailboat
    - title: Tubo y collar
      description: Material del tubo (PVC de 0,9 a 1,2 mm o Hypalon/CSM de 1,4 a 1,7 mm), diámetro del tubo (40 a 55 cm), número de cámaras (3 a 7), tipo de válvula (Halkey-Roberts, Leafield D7 o Boston), color del tubo (estándar o personalizado) y configuración de cono/cónico del collar.
      icon: tabler:circle
    - title: Diseño de plataforma y consola
      description: Consola central, consola lateral o dirección del timón. Disposición de los asientos (asientos tipo jockey, asientos tipo banco, asientos reforzados). Revestimiento de terraza (espuma EVA aspecto teca, pintura antideslizante o PRFV desnudo). Puntos de montaje de equipos, pasamanos y posiciones de anillos en D.
      icon: tabler:layout-dashboard
    - title: Electricidad y Navegación
      description: Luces de navegación (LED), sistema de bomba de achique, gestión de batería, instalación de radio VHF, montaje de GPS/chartplotter, puertos de carga USB y configuración de panel de interruptores.
      icon: tabler:bolt
    - title: Marca y gráficos
      description: Gráficos de casco y tubos (serigrafía, transferencia de calor, impresión digital UV), colocación de logotipos, esquemas de color personalizados, marcas de identificación y documentación personalizada del propietario con su marca.
      icon: tabler:palette
    - title: Seguridad y cumplimiento
      description: Clasificación de categoría de diseño (A/B/C/D por RCD), sistema de extinción de incendios, especificación del sistema de combustible (tanque portátil, tanque fijo, debajo de la cubierta) y paquete de documentación de cumplimiento para su mercado objetivo.
      icon: tabler:shield
content_applications:
  tagline: Configuraciones de aplicaciones
  title: Configuraciones RIB<br />Por aplicación
  subtitle: Diferentes misiones exigen diferentes configuraciones. Aquí se muestran configuraciones probadas para las aplicaciones RIB más comunes.
  items:
    - title: Rescate y Patrulla
      description: Casco en V profunda, tubos Hypalon, plataforma autovaciable, asientos reforzados, asideros, luces de navegación y anillos en D de alta resistencia. RCD Diseño Categoría B o C. Sistema de combustible resistente al fuego y electricidad de calidad comercial.
      icon: tabler:lifebuoy
    - title: Soporte de buceo
      description: Viga ancha, escalera de embarque trasera, posiciones para portatanques, anillos en D adicionales, soporte para bandera de buceo, espejo de popa reforzado para motores fuera de borda gemelos y cubierta completa de EVA antideslizante.
      icon: tabler:mask
    - title: Turismo y Comercial
      description: Diseño certificado para pasajeros con asientos tipo banco, parasol/Bimini, pasamanos, almacenamiento en seco y sistema de batería dual. RCD Categoría C. Diseñado para operaciones de flotas turísticas y chárter.
      icon: tabler:beach
    - title: Pesca
      description: Diseño de cubierta abierta, posiciones para portacañas, pozo para cebo vivo, soporte para buscador de peces, soporte para motor de pesca por curricán, espejo de popa reforzado y sistema de combustible portátil. Opciones de consola central o consola lateral.
      icon: tabler:fish
    - title: Licitación de ocio y yates
      description: Casco liviano, tubos de PVC, asientos cómodos, timón telescópico o consola compacta, puntos de elevación para pescante y tanque de combustible extraíble. RCD de categoría C o D.
      icon: tabler:sailboat
    - title: Barco de trabajo profesional
      description: Opción de casco de aluminio, refuerzo de alta resistencia, dirección hidráulica, electricidad de calidad comercial, arco de radar y puntos de integración de equipos específicos de la misión. Cumplimiento personalizado por proyecto.
      icon: tabler:anchor
process_steps:
  title: Proceso de desarrollo OEM/ODM de RIB de 7 pasos
  subtitle: 'Desde el resumen del proyecto hasta el servicio posventa: un flujo de trabajo definido con hitos y entregables claros'
  steps:
    - number: '01'
      title: Resumen del proyecto y requisitos
      description: Defina la aplicación objetivo, el tamaño del casco, el material del tubo, los requisitos de cumplimiento y las necesidades de marca. Evaluamos la viabilidad y confirmamos el modelo de colaboración (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3 a 5 días
    - number: '02'
      title: Revisión técnica y viabilidad
      description: El equipo de ingeniería revisa los cálculos de viabilidad estructural, estabilidad y flotabilidad, el camino de cumplimiento y la disponibilidad de materiales. Identificamos moldes existentes o requisitos de moldes personalizados.
      timeline: 5 a 7 días
    - number: '03'
      title: Propuesta y Cotización
      description: Reciba una propuesta detallada que incluya especificaciones, representaciones 3D o dibujos GA, alcance de cumplimiento, cronograma y precio unitario basado en niveles de volumen y MOQ.
      timeline: 5 a 7 días
    - number: '04'
      title: Confirmación de diseño y muestreo
      description: Aprobar el GA final, el diseño de la plataforma y la configuración de los tubos. Producimos una muestra de preproducción con los colores, el logotipo y los materiales específicos de su marca para su inspección física.
      timeline: 15-20 días
    - number: '05'
      title: Aprobación de muestras y protocolo de control de calidad
      description: 'Inspeccionar y aprobar la muestra. Definir el protocolo de control de calidad de producción: prueba de presión (1,25x / 24–48 h), comprobaciones dimensionales y lista de verificación de documentación de cumplimiento por casco.'
      timeline: 3 a 5 días
    - number: '06'
      title: Producción en masa y control de calidad
      description: Ejecución de producción completa con lista de verificación de control de calidad de 100 puntos por unidad. Inspecciones en proceso, pruebas de presión y trazabilidad a nivel de serie. Documentación CE/ISO preparada en paralelo.
      timeline: 30–45 días
    - number: '07'
      title: Embalaje, envío y posventa
      description: Embalaje personalizado (estándar, listo para la venta al por menor o paletizado), documentación de exportación, carga de contenedores y logística. Kits de repuestos y documentación de mantenimiento incluidos.
      timeline: 7 a 14 días
certifications:
  title: Cumplimiento y certificaciones para embarcaciones RIB
  subtitle: Cada pedido de RIB personalizado se envía con documentación de cumplimiento específica del modelo.
  items:
    - name: CE 2013/53/UE
      description: 'Cumplimiento de RCD por modelo y categoría de diseño: DoC, placa de construcción y manual del propietario incluidos'
      badge: CE
    - name: Norma ISO 9001:2015
      description: Sistema de gestión de calidad certificado por SGS que cubre diseño, producción y distribución.
      badge: ISO
    - name: EN ISO 6185
      description: 'Norma de construcción de embarcaciones inflables: estabilidad, flotabilidad y recuperación de un hombre al agua'
      badge: 6185
    - name: EN ISO 14945:2021
      description: 'Estándar de placa del constructor: identificación permanentemente marcada e información de capacidad'
      badge: 14945
    - name: B$.
      description: 'Auditoría de cumplimiento social para la fabricación ética: requerida por los minoristas de la UE'
      badge: BSCI
    - name: ALCANZAR
      description: Cumplimiento de la UE en materia de seguridad química para PVC, Hypalon, adhesivos y revestimientos
      badge: REACH
content_service_modules:
  tagline: Módulos de servicio
  title: Módulos de servicio<br />OEM/ODM
  subtitle: Cada proyecto combina los módulos de servicio adecuados. No todos los proyectos necesitan todos los módulos — dimensionamos únicamente lo que su proyecto requiere.
  items:
    - title: Revisión de ingeniería y viabilidad
      description: 'Evaluación de la plataforma del casco, comprobación de la viabilidad estructural, verificación de estabilidad y flotabilidad, identificación de la vía de conformidad y confirmación de la disponibilidad de materiales. Entregable: informe de viabilidad con recomendación de continuidad (go/no-go).'
      icon: tabler:math-function
    - title: Diseño y configuración
      description: 'Plano GA, distribución de cubierta, configuración del tubo, posiciones de consola y asientos, plan de montaje de equipos y selección de color y material. Entregable: GA aprobado y especificación de configuración.'
      icon: tabler:ruler
    - title: Muestra y prototipo
      description: Muestra de preproducción con colores y logotipo aprobados y materiales especificados, para inspección física. Incluye protocolo de aprobación de muestra, checklist de inspección y proceso de solicitud de cambios.
      icon: tabler:3d-cube-sphere
    - title: Producción y control de calidad
      description: Producción en serie con checklist de control de calidad de 100 puntos por unidad, inspecciones en proceso, ensayo de presión (1,25x / 24-48h) y trazabilidad a nivel de número de serie. Documentación CE/ISO preparada en paralelo.
      icon: tabler:clipboard-check
    - title: Marca y embalaje
      description: Aplicación del logotipo de marca propia, grafismos personalizados de casco y tubo, documentación del propietario con su marca, embalaje listo para venta o paletizado y preparación de kits de recambios.
      icon: tabler:palette
    - title: Exportación y documentación
      description: Embalaje de exportación, plan de carga de contenedor, documentación FOB/CIF/DDP, expedientes de conformidad por mercado de destino y protocolo de comunicación tras la entrega.
      icon: tabler:world

content_risk_control:
  tagline: Control de riesgos y entregas
  title: Gestión de riesgos<br />y entregas del proyecto
  subtitle: Los compradores profesionales de OEM/ODM otorgan tanta importancia al control de riesgos como a la calidad del producto. Así es como lo gestionamos.
  items:
    - title: Definición de alcance y propiedad
      description: 'Antes de iniciar el desarrollo, definimos por escrito: alcance de la personalización, requisitos de utillaje, criterios de aprobación de muestras, propiedad de planos y moldes y responsabilidades documentales. Sin ambigüedad sobre qué pertenece a quién.'
      icon: tabler:file-text
    - title: Proceso de control de cambios
      description: Todos los cambios de especificación tras la confirmación del diseño siguen un proceso documentado de solicitud de cambio con evaluación de impacto (coste, plazos, conformidad). Ninguna modificación no aprobada entra en producción.
      icon: tabler:arrows-diff
    - title: Garantía de consistencia por lote
      description: La unidad 50 coincide con la 1.ª muestra aprobada. Las especificaciones aprobadas se congelan, los parámetros de material y proceso se bloquean, y los puntos de control en proceso verifican la consistencia en toda la serie de producción.
      icon: tabler:repeat
    - title: Transparencia en plazos y capacidad
      description: Los plazos se calculan según la capacidad de producción real, los niveles de stock de material y la carga de pedidos actual — no según objetivos deseables. Se facilita un plan de producción con hitos fechados para cada pedido.
      icon: tabler:calendar-stats

faq:
  title: 'OEM/ODM de RIB: preguntas frecuentes'
  questions:
    - q: ¿Cuál es la diferencia entre OEM y ODM para embarcaciones RIB?
      a: 'OEM (fabricación de equipos originales): usted proporciona especificaciones detalladas y nosotros construimos su diseño. ODM (fabricación de diseño original): usted selecciona una plataforma Aquafarer RIB probada y la personalizamos con las características y la marca que desee. ODM es más rápido y de menor costo; OEM ofrece el máximo control de diseño.'
    - q: ¿Puedo personalizar la forma y el tamaño del casco del RIB?
      a: Sí. Ofrecemos modificaciones semipersonalizadas a los moldes de casco existentes (diferentes diseños de cubierta, configuraciones de tubos) y desarrollo de casco completamente personalizado con nuevos moldes mecanizados por CNC. Los proyectos semipersonalizados pueden comenzar con 2 a 5 unidades; La costumbre completa normalmente requiere compromisos más altos.
    - q: ¿Qué materiales de tubo están disponibles para las RIB personalizadas?
      a: Ofrecemos PVC de 0,9 a 1,2 mm para uso recreativo y comercial ligero, y Hypalon/CSM de 1,4 a 1,7 mm para aplicaciones profesionales, de rescate y comerciales que requieren una resistencia superior a los rayos UV y al ozono (vida útil de 10 a 15 años frente a 5 a 8 años para el PVC).
    - q: ¿Se pueden configurar RIB para aplicaciones específicas como rescate, buceo o pesca?
      a: Sí. Mantenemos plantillas de configuración comprobadas para aplicaciones de rescate/patrulla, soporte de buceo, turismo/chárter, pesca, embarcaciones auxiliares y embarcaciones de trabajo profesionales. Cada plantilla incluye el tipo de casco, el material de los tubos, el diseño de la cubierta y el equipo recomendados, que luego personalizamos según sus requisitos exactos.
    - q: ¿Qué información necesita para una cotización de RIB OEM/ODM?
      a: Aplicación objetivo, longitud de casco deseada, preferencia de material del tubo (PVC o Hypalon), cantidad aproximada y cronograma de entrega, requisitos de cumplimiento del mercado objetivo y cualquier producto o especificación de referencia. Cuanto más detalles proporcione, más rápida y precisa será nuestra cotización.
    - q: ¿Cuál es el MOQ para embarcaciones RIB personalizadas?
      a: 'Para moldes de casco existentes con modificaciones estándar, la cantidad mínima de pedido comienza en 2 a 5 unidades por diseño. Para moldes personalizados y desarrollo totalmente personalizado, la cantidad mínima de pedido depende de la complejidad del proyecto: normalmente entre 10 y 20 unidades para semipersonalizados y más de 30 para totalmente personalizados con herramientas nuevas.'
    - q: ¿A quién pertenecen los moldes y dibujos personalizados?
      a: Los moldes desarrollados utilizando diseños básicos de Aquafarer siguen siendo propiedad de Aquafarer. Los moldes totalmente personalizados encargados y pagados por el cliente se pueden asignar a la propiedad del cliente según los términos del contrato. Todos los términos de propiedad del molde se documentan antes del inicio del proyecto.
    - q: ¿Cómo se empaquetan las RIB personalizadas para la exportación?
      a: 'Estándar: cuna a medida + film estirable para carga de contenedores. Premium: envasado listo para la venta al por menor, envasado al vacío o paletizado. Ofrecemos envíos FOB Qingdao, CIF y DDP. Documentación completa de exportación y despacho de aduana incluido.'
