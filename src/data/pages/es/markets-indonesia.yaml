hero:
  tagline: Indonesia
  title: SUP Tablas mayoristas para<br />Negocios indonesios
  subtitle: Tiendas de deportes acuáticos, resorts insulares y operadores por todo el archipiélago — tablas nuevas de 5 unidades, modelos mixtos, enviadas desde China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tablas de excedente SUP para resorts indonesios y tiendas de deportes acuáticos en Bali
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas SUP de excedente a negocios indonesios — tiendas de deportes acuáticos en Bali, resorts isleños desde Lombok hasta Gillis y más allá, clubes de playa y operadores de alquiler. Los pedidos mayoristas comienzan con 5 tablas con modelos mixtos en un solo envío, enviadas desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada placa está 100% sometida a prueba de presión y cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Sirviendo a la economía de deportes acuáticos y a los resorts insulares de Bali en todo el país
  - Rutas cortas de mercancías China–Indonesia, aéreas o marítimas
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El mercado indonesio SUP
  paragraphs:
    - 'Indonesia es una de las grandes economías asiáticas de deportes acuáticos, y Bali es su corazón palpitante. Desde los clubes de playa de Seminyak y Canggu hasta las tranquilas lagunas de Sanur y Nusa Dua, las tablas de remo aparecen por todas partes: remadas al amanecer sobre arrecifes, SUP clases de yoga, excursiones a lagunas y programas para huéspedes de hoteles. Más allá de Bali, Lombok, las islas Gili y las crecientes escenas turísticas en todo el archipiélago siguen el mismo patrón.'
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: La durabilidad, UV el rendimiento y la reparabilidad importan más que el brillo del catálogo. Los pedidos son de 5 a 20 tablas, mezcladas para clases, alquileres y exposición en tiendas.
  customer_types:
    - title: Tiendas de deportes acuáticos de Bali
      description: Operadores establecidos en Sanur, Seminyak y Canggu añadiendo SUP líneas de surf, buceo y snorkel.
    - title: Resorts y Clubes de Playa en la Isla
      description: Resorts y clubes de playa en Bali, Lombok y Gillis organizan programas de paddle para invitados y SUP yoga.
    - title: Operadores turísticos y de alquiler
      description: Operadores turísticos de lagunas y manglares y puestos de alquiler por horas que refrescan flotas según la temporada.
shipping_section:
  title: Barco a Indonesia
  paragraphs:
    - Indonesia es una de las rutas de carga más cortas desde nuestra base en Weihai, China. El transporte aéreo exprés transporta muestras y 1–3 pedidos de embarcación rápidamente hacia Denpasar y Yakarta; Consolidated Sea Freight atiende entre 5 y 20 pedidos al por mayor a bordo a través de Tanjung Priok, Tanjung Benoa y otros puertos. Ambas opciones se cotizan con tiempos estimados de tránsito para tu destino.
    - Proporcionamos las facturas comerciales y la autorización de listas de embalaje requeridas, con códigos HS correctos y valores declarados. Los derechos de importación y los impuestos son a cargo del importador según las normas indonesias.
  customs_note: 'La autorización indonesia para equipamiento deportivo es sensible a la documentación: trabaja con tu agente de aduanas (PPJK) para confirmar el tratamiento actual de los derechos y fiscales. Proporcionamos documentación completa y consistente y respondemos rápidamente a las solicitudes de los intermediarios.'
faq_section:
  title: Preguntas frecuentes sobre Indonesia
  items:
    - q: ¿Qué velocidad tiene la carga de China a Bali?
      a: Indonesia es uno de nuestros destinos de carga más cercanos desde Weihai. El avión exprés hacia Denpasar o Yakarta es la opción más rápida para muestras y pedidos pequeños; el transporte marítimo consolidado se cotiza con una ventana de tránsito para pedidos mayoristas. Ambos están detallados en tu presupuesto.
    - q: ¿Las tablas son adecuadas para el alquiler diario en tropical UV?
      a: Sí — drop-stitch PVC la construcción está homologada para ciclos de alquiler diario es lo que suministramos a flotas en 50+ países. El cuidado estándar (enjuagar tras agua salada, almacenamiento a la sombra) las mantiene en servicio durante muchas estaciones del sol en Bali.
    - q: ¿Cómo es un pedido en una tienda de deportes acuáticos?
      a: 'Normalmente de 5 a 15 tablas mezcladas entre modelos estables y versátiles para clases y alquileres y algunas ediciones de arte premium para exhibición minorista: un envío, con precio según la cantidad total.'
    - q: ¿Puede apoyar nuestro PPJK con documentación?
      a: Sí. Cada pedido se envía con una factura comercial y una lista de empaque con los códigos HS correctos y los valores declarados, y respondemos rápidamente cuando su agente de aduanas necesita documentos adicionales.
