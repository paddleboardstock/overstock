  title: Paquetes de negocios de agua listos para implementar<br />para cada etapa
  subtitle: Paquetes de equipos preconfigurados para clubes de deportes acuáticos, complejos turísticos y nuevas marcas, con precios transparentes, entrega rápida y opciones de personalización completas.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
