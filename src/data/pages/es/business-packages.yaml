faq:
  title: Preguntas frecuentes sobre paquetes
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido para paquetes?
      a: El Paquete Club Starter tiene un mínimo de 10 unidades. Los paquetes Resort y Brand se personalizan según sus necesidades con MOQ flexibles.
    - q: ¿Cuánto tiempo tarda la entrega?
      a: La producción estándar es de 30 a 45 días desde la confirmación del pedido. La producción acelerada está disponible por una tarifa adicional.
    - q: ¿Puedo personalizar los colores y la marca del equipo?
      a: 'Sí. Todos los paquetes incluyen personalización completa: colores del tablero, impresiones de logotipos y diseño de empaque.'
    - q: ¿Ofrecen soporte postventa?
      a: Sí. Cada paquete incluye acceso a nuestras guías de mantenimiento en línea, tutoriales en vídeo y sistema de pedido de repuestos.
