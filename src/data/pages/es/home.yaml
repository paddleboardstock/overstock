features:
  id: features
  tagline: Por Qué Comprar en Paddle Board Overstock
  title: Fábrica real,<br />Ahorros reales
  subtitle: 'Paquetes de SUP en liquidación y exceso de existencias directos de fábrica: calidad comprobada sin el margen de beneficio minorista.'
  columns: 2
  items:
    - title: Hasta 60% de Descuento Sobre el Precio de Venta
      description: 'Vendemos exceso de stock y lotes de liquidación directamente desde la fábrica: sin intermediarios, sin recargo de retail. Las mismas tablas que se venden a precio completo en otros lugares, aquí a precios de liquidación.'
      icon: tabler:rocket
    - title: Paquetes Completos
      description: 'Cada SUP viene como un paquete completo: tabla, mochila de viaje, bomba manual, remo ajustable, quilla removible, correa en espiral y kit de reparación.'
      icon: tabler:clipboard-list
    - title: Calidad probada
      description: Cada placa se prueba al 100 % con una presión de 1,25 veces la PSI nominal antes de enviarse. Tasa de ausencia de defectos del 99,3 % en cada lote.
      icon: tabler:shield-check
    - title: Sin pedido mínimo
      description: 'Compra exactamente lo que necesitas. Agregue un tablero al carrito, pague y listo: sin mínimos, sin proceso de cotización, sin esperas.'
      icon: tabler:adjustments
    - title: Envío Rápido a Nivel Mundial
      description: Los pedidos en stock se envían desde Weihai en 2-3 días hábiles. Entrega con seguimiento a 50+ países en la UE, América del Norte, Asia-Pacífico y más.
      icon: tabler:truck-delivery
    - title: Garantía de 2 años SUP
      description: Cada tabla y accesorio SUP tiene cobertura de 2 años — incluidos drop-stitch costuras, válvulas de inflado y accesorios. Los reclamos se resuelven en días, no semanas.
      icon: tabler:lifebuoy
