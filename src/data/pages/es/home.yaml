content_customer_types:
  tagline: Para quién fabricamos
  title: 'Diseñado para compradores B2B<br />— no para el consumidor final'
  subtitle: 'Aquafarer fabrica para cuatro perfiles de cliente. Cada uno tiene prioridades distintas — y cubrimos todas.'
  items:
    - title: Propietarios de marcas / Marca blanca
      description: 'Diseño de producto a medida, gráficos de marca blanca, documentación de conformidad bajo su marca y acompañamiento técnico dedicado, del concepto al contenedor.'
      icon: tabler:palette
      cta: Solicitar presupuesto OEM/ODM
      cta_href: /request-quotation
    - title: Distribuidores / Mayoristas
      description: 'Protección de territorio, precios mayoristas competitivos, kits de apoyo de marketing, formación de producto y documentación de conformidad completa para su mercado.'
      icon: tabler:world
      cta: Solicitar distribución
      cta_href: /dealers-distributors
    - title: Resorts / Operadores de alquiler
      description: 'Durabilidad de uso comercial, asesoría de dimensionamiento de flota, pedidos de contenedor mixtos, estrategia de repuestos y equipos con la marca del resort.'
      icon: tabler:beach
      cta: Pedir paquete comercial
      cta_href: /solutions/resorts
    - title: Rescate / Gobierno / Sector profesional
      description: 'Construcción en Hypalon/CSM, opciones de conformidad SOLAS, certificación específica por proyecto, apoyo documental para licitaciones e ingeniería bajo NDA.'
      icon: tabler:shield
      cta: Hablemos de su proyecto
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Capacidades OEM/ODM
  title: 'Lo que obtiene<br />con Aquafarer'
  subtitle: 'Acceso directo a fábrica con ingeniería, calidad y conformidad integradas — no una empresa intermediaria.'
  columns: 2
  items:
    - title: Personalización OEM/ODM
      description: 'Diseño de casco, material de los tubos (PVC o Hypalon/CSM), distribución de consola, asientos, branding, colores y embalaje. Desde ajustes mínimos hasta ingeniería 100 % a medida.'
      icon: tabler:adjustments
    - title: MOQ bajos, muestreo rápido
      description: 'RIB: 2-5 unidades (molde existente). SUP: 5-10 unidades por SKU. Moldes a medida: 200+ unidades. Muestras de preproducción con su marca en 7-14 días.'
      icon: tabler:rocket
    - title: Calidad lista para producción
      description: 'Cada unidad se prueba a 1,25× la presión nominal durante 24-48 h. 99,3 % sin defectos según AQL 2,5 / ISO 2859. Lista de verificación de 100 puntos por casco.'
      icon: tabler:certificate
    - title: Documentación de conformidad completa
      description: 'CE según 2013/53/EU (RCD), ISO 9001:2015 (SGS), auditoría social BSCI, cumplimiento REACH, marcado UKCA. DoC y placa de fabricante específicos de cada modelo.'
      icon: tabler:file-certificate
    - title: Plazo de 30-45 días
      description: 'Producción estándar de 30-45 días FOB Qingdao. Prototipos en 7-14 días. Producción urgente disponible. Planes de carga de contenedor y embalaje ISPM-15 incluidos.'
      icon: tabler:truck-delivery
    - title: Posventa y repuestos
      description: 'Garantía de 5 años en botes, kayaks y RIB, 2 años en SUP y accesorios. Suministro de repuestos con envío prioritario. Apoyo en la gestión de garantías.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Categorías de productos
  title: '5 categorías,<br />64 modelos con certificación CE'
  subtitle: 'Desde lanchas RIB de 2,4 m hasta SUP de 15 pies — todo fabricado en nuestra planta ISO 9001 de Qingdao.'
  items:
    - title: Botes RIB
      description: '2,4 m a 7,0 m con cascos de aluminio o GRP. Tubos de PVC o Hypalon/CSM. CE según 2013/53/EU. Configuraciones de patrulla, buceo, rescate y uso comercial.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Embarcaciones neumáticas
      description: '2,0 m a 5,0 m con piso de aluminio, de madera marina o de aire. Modelos de pesca, recreo y lancha auxiliar.'
      icon: tabler:sailboat
      link: /products
    - title: Tablas SUP
      description: '9 a 15 pies en Drop-Stitch de 4 y 6 pulgadas. Modelos all-round, touring, yoga y pesca. Disponibles en calidad comercial.'
      icon: tabler:swimming
      link: /products
    - title: Kayaks
      description: 'Kayaks inflables de 1 a 3 plazas. Modelos recreativos y de touring con opción de piso Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Accesorios de seguridad
      description: 'Chalecos salvavidas certificados CE, cuerdas de rescate, kits de reparación, bombas y luces de navegación. Chalecos aprobados USCG Tipo III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Potencia de fábrica
  title: 'Fabricación lista<br />para auditorías'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² certificados ISO 9001 — fabricante real, no empresa intermediaria</h3>
  items:
    - title: 6 líneas de producción dedicadas
      description: 'Líneas separadas para RIB, embarcaciones neumáticas, SUP, kayaks, equipos de seguridad y OEM/ODM. Cada una con puntos de control de calidad y planificación propios.'
    - title: 100 % probadas a presión
      description: 'Cada cámara se infla a 1,25× la presión nominal y se mantiene 24-48 h. Los resultados quedan vinculados al número de casco (HIN).'
    - title: Trazabilidad por casco
      description: 'Registros de producción a nivel HIN con más de 21 campos por casco: lote de material, identificación del soldador, resultado de la prueba de presión, configuración final y destino de entrega.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Planta de fabricación de Aquafarer de 12.000 m² certificada ISO 9001 en Qingdao, con líneas de producción RIB

content_compliance:
  tagline: Cumplimiento y pruebas de calidad
  title: 'Evidencia documentada,<br />no solo afirmaciones'
  subtitle: 'Cada afirmación de conformidad está respaldada por documentación específica del modelo, disponible para su verificación.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Sistema de gestión de calidad certificado por TÜV Rheinland/SGS. Auditorías de vigilancia anuales. Procesos de QC documentados desde la entrada de material hasta la liberación del embarque.'
      icon: tabler:certificate
    - title: CE según 2013/53/EU (RCD)
      description: '64 modelos con Declaraciones de Conformidad específicas. Evaluación de conformidad según los módulos aplicables. Registro HIN y placa de fabricante para cada casco.'
      icon: tabler:file-certificate
    - title: Cumplimiento social BSCI
      description: 'Auditoría BSCI anual realizada por SGS. Prácticas laborales éticas, seguridad en el trabajo y gestión ambiental verificadas en toda la planta.'
      icon: tabler:users
    - title: REACH y UKCA
      description: 'Todos los materiales de PVC y adhesivos cumplen el reglamento REACH de la UE. Marcado UKCA disponible para el mercado británico. Fichas de datos de seguridad a petición.'
      icon: tabler:shield-check

steps:
  title: El proceso OEM/ODM — del brief al contenedor
  items:
    - title: 'Paso 1: <span class="font-medium">Requisitos</span>'
      description: 'Comparta sus especificaciones de producto, mercado objetivo, cantidades y requisitos de cumplimiento. Nuestro equipo de ingeniería lo revisa en 48 horas.'
      icon: tabler:file-text
    - title: 'Paso 2: <span class="font-medium">Propuesta</span>'
      description: 'Recibirá una propuesta detallada con especificaciones, opciones de material, MOQ, precios, plazo de entrega y alcance de cumplimiento para su mercado.'
      icon: tabler:clipboard-list
    - title: 'Paso 3: <span class="font-medium">Prototipo</span>'
      description: 'Muestra de preproducción con su marca en 7-14 días. Pruebas de calidad completas a 1,25× la presión nominal. El coste de la muestra se descuenta de la producción.'
      icon: tabler:settings
    - title: 'Paso 4: <span class="font-medium">Producción</span>'
      description: 'Producción de 30-45 días FOB Qingdao tras la aprobación de la muestra. Puntos de control de calidad en proceso, pruebas de presión e inspección final de 100 puntos en cada unidad.'
      icon: tabler:building-factory
    - title: 'Paso 5: <span class="font-medium">Entrega</span>'
      description: 'Plan de carga de contenedor, embalaje de madera ISPM-15, paquete de documentación de cumplimiento y embarque FOB Qingdao con documentación de exportación completa.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Proceso de fabricación OEM/ODM de Aquafarer, del diseño al contenedor

blog_latest:
  title: Análisis del sector y técnica
  information: |
    Guías de cumplimiento RCD, artículos sobre el proceso OEM/ODM, comparativas
    de materiales y recursos de auditoría de fábrica — del equipo de ingeniería de Aquafarer.

faqs:
  title: Preguntas frecuentes sobre compras B2B
  subtitle: 'Las preguntas más habituales de marcas, distribuidores y operadores comerciales sobre la fabricación OEM/ODM con Aquafarer.'
  columns: 2
  items:
    - title: ¿Es fabricante o empresa intermediaria?
      description: 'Somos una planta verticalmente integrada con control total sobre calidad, materiales y plazos. Licencia comercial y alcance de producción verificables durante una auditoría de fábrica.'
      icon: tabler:building-factory
      category: all
    - title: ¿Cómo es su proceso OEM/ODM?
      description: 'De la revisión de requisitos (48 h) a la propuesta, el prototipo (7-14 días) y la producción (30-45 días FOB Qingdao). Con acompañamiento de ingeniería, documentación de cumplimiento y trazabilidad por casco en todo el proceso.'
      icon: tabler:route
      category: all
    - title: ¿Cuáles son sus MOQ?
      description: 'Botes RIB: 2-5 unidades por modelo (molde existente), 200+ para moldes a medida. Tablas SUP: 5-10 unidades por SKU. Pedidos de contenedor mixtos disponibles. Pedidos de muestra desde 2-5 unidades para evaluación.'
      icon: tabler:sort-ascending
      category: all
    - title: ¿Qué opciones de personalización ofrecen?
      description: 'Diseño de casco, material de los tubos (PVC o Hypalon/CSM), diámetro de tubos, distribución de consola, asientos, dirección, sistema de combustible, disposición de cubierta, colores de marca, gráficos de logotipo, diseño de almohadillas EVA, embalaje retail y manual con su marca.'
      icon: tabler:adjustments
      category: all
    - title: ¿Qué documentos de conformidad pueden proporcionar para mi mercado?
      description: 'DoC CE según 2013/53/EU, marcado UKCA, certificado ISO 9001 (SGS), informe de auditoría BSCI, cumplimiento REACH, informes de ensayo de materiales, registros de pruebas de presión y placa de fabricante específica por modelo. Documentación específica por mercado a petición.'
      icon: tabler:file-certificate
      category: all
    - title: ¿Cuáles son los plazos de muestreo y producción?
      description: 'Muestras de preproducción: 7-14 días laborables. Producción estándar: 30-45 días FOB Qingdao. Producción urgente disponible con coste adicional. En temporada alta (marzo-junio) los plazos pueden extenderse.'
      icon: tabler:clock
      category: all
    - title: ¿Puedo organizar una auditoría de fábrica o una visita en video en directo?
      description: 'Sí. Las auditorías in situ en Qingdao son bienvenidas con 3-5 días de antelación. Visitas en video en directo por WhatsApp/Zoom disponibles de inmediato. Inspecciones de terceros (SGS, BV, TÜV) admitidas.'
      icon: tabler:video
      category: all
    - title: ¿Qué inspecciones de calidad se completan antes del embarque?
      description: 'Prueba de retención de presión a 1,25× la nominal (24-48 h), ensayo de pelado de costuras, lista de inspección final de 100 puntos, verificación dimensional, inspección cosmética, verificación documental de cumplimiento y prueba de integridad del embalaje. Todo según procedimientos ISO 9001.'
      icon: tabler:clipboard-check
      category: all

