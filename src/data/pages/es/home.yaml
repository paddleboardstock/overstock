content_workshop:
  isReversed: true
  tagline: Fortaleza de Fábrica
  title: Por Qué Nuestros Precios de Liquidación<br />Son Reales
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Fábrica Real, Ahorros Reales — Cada Tabla se Envía desde Nuestra Instalación en Weihai</h3>
  items:
    - title: Mismas Líneas de Producción que las Marcas Principales
      description: Nuestra fábrica de 12,000 m² en Weihai produce tablas para marcas internacionales y nuestras propias partidas de exceso de inventario en las mismas líneas con los mismos materiales.
    - title: 100% Probada a Presión
      description: Cada tabla se presuriza a 1.25x el PSI nominal y se mantiene antes del envío. Tasa de defectos del 99.3% según AQL 2.5 / ISO 2859.
    - title: Sin Intermediarios
      description: Las tablas se envían directamente de la fábrica a tu puerta. Sin aumento de precio de distribuidor, sin aumento de precio minorista — así es como los precios de liquidación se mantienen hasta un 60% por debajo del precio de venta al público.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Fábrica de 12,000 m² en Weihai con líneas de producción de SUP inflables
content_compliance:
  tagline: Cumplimiento y Pruebas de Calidad
  title: Calidad Certificada,<br />Documentada
  subtitle: Cada afirmación de cumplimiento está respaldada por certificados y documentación específica del modelo disponible para tu verificación.
  items:
    - title: Norma ISO 9001:2015
      description: Sistema de gestión de calidad certificado por TÜV Rheinland/SGS. Auditorías de vigilancia anuales. Procesos de control de calidad documentados desde la recepción de materiales hasta la liberación del envío.
      icon: tabler:certificate
    - title: CE Certificado
      description: 13 modelos CE-certificados SUP según las directivas europeas aplicables, cada uno con una Declaración de Conformidad específica del modelo y datos de la placa del fabricante.
      icon: tabler:file-certificate
    - title: REACH y UKCA
      description: Todos los materiales PVC y adhesivos cumplen con la normativa REACH de la UE. Marcado UKCA disponible para el mercado del Reino Unido. Hojas de datos de seguridad de materiales disponibles bajo solicitud.
      icon: tabler:shield-check
    - title: Garantía de 2 años SUP
      description: Cada tabla SUP y accesorio tiene cobertura de 2 años — incluidas costuras drop-stitch, válvulas de inflado y accesorios. Reclamaciones resueltas rápidamente.
      icon: tabler:lifebuoy
steps:
  title: Del Pago al Agua — Cómo Se Envía Su Pedido
  items:
    - title: Paso 1:<span class="font-medium">Elige tu tabla</span>
      description: Elija entre modelos de todo terreno, de turismo, de yoga y para niños. Nuestras guías de compra le ayudan a combinar el tamaño y estilo de la tabla con su remo.
      icon: tabler:clipboard-list
    - title: Paso 2:<span class="font-medium">Pago seguro</span>
      description: 'Paga de manera segura con Stripe o PayPal. Se aceptan todas las principales tarjetas de crédito y débito. No se necesita cuenta: la confirmación del pedido llegará a tu correo electrónico.'
      icon: tabler:file-text
    - title: Paso 3:<span class="font-medium">Inspección de Calidad</span>
      description: Cada placa se prueba al 100% de presión a 1.25 veces la PSI nominal y se verifica contra una lista de control de calidad completa antes de ser empacada.
      icon: tabler:settings
    - title: Paso 4:<span class="font-medium">Envío rápido</span>
      description: Los pedidos en stock se envían desde nuestra fábrica de Weihai en 2-3 días hábiles. Servicio urgente disponible para pedidos urgentes.
      icon: tabler:building-factory
    - title: Paso 5:<span class="font-medium">Entrega con seguimiento</span>
      description: Envío rastreado a nivel mundial a 50+ países. Su garantía de 2 años y soporte posventa receptivo comienzan el día en que llegue su tabla.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP proceso de pedido desde el pago seguro hasta la entrega rastreada a nivel mundial
