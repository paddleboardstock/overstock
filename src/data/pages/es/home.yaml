  title: SUP Guías y Perspectivas Técnicas
  information: |
    Guías de compra, técnica de remo, elementos esenciales de seguridad y construcción
    investigación del equipo Paddle Board Overstock.
faqs:
  title: SUP Preguntas frecuentes sobre pedidos y productos
  subtitle: Preguntas frecuentes sobre nuestras placas en liquidación SUP, pedidos, pago, envío y garantía.
  columns: 2
  items:
    - title: ¿Es difícil aprender SUP?
      description: En absoluto. La mayoría de los principiantes se ponen de pie y remar durante su primera sesión. Nuestras tablas todo terreno SUP cuentan con plataformas extra anchas y estables diseñadas específicamente para quienes remar por primera vez. Comienza en aguas tranquilas y estarás navegando en minutos.
      icon: tabler:swimming
      category: sup
    - title: ¿Cuál es el límite de peso?
      description: Nuestro soporte integral SUPs soporta hasta 220 lbs y las plataformas de touring y yoga soportan hasta 250 lbs. Cada página de producto indica la capacidad exacta de peso del usuario para que puedas combinar la tabla con tus necesidades.
      icon: tabler:adjustments
      category: sup
    - title: ¿Puedo viajar con un SUP inflable?
      description: Absolutamente. Cada tabla Paddle Board Overstock se guarda en un estuche de transporte del tamaño de una mochila. Con solo 18-22 libras, es fácil de llevar a la playa, al lago o a través de las terminales del aeropuerto. Verifique la política de equipaje de su aerolínea antes de viajar.
      icon: tabler:truck-delivery
      category: sup
    - title: ¿Qué viene en la caja?
      description: Cada Paddle Board Overstock SUP incluye la tabla, una mochila de viaje, bomba de mano, remo ajustable, aleta removible, correa en espiral y kit de reparación.
      icon: tabler:clipboard-list
      category: sup
    - title: ¿Por qué sus precios son más bajos que los del comercio minorista?
      description: 'Vendemos excedentes de fábrica y lotes de liquidación directamente desde nuestra propia instalación de producción en Weihai, China: sin intermediarios, sin aumento de precio minorista. Eso significa paquetes completos SUP con hasta un 60% de descuento sobre los precios minoristas típicos, con la misma calidad certificada CE.'
      icon: tabler:certificate
      category: orders
    - title: ¿Cómo hago un pedido y pago?
      description: Agrega tu paquete SUP al carrito y realiza el pago de forma segura con Stripe o PayPal. Aceptamos todas las principales tarjetas de crédito y débito. Cada pedido es confirmado por correo electrónico con una factura completa.
      icon: tabler:file-text
      category: orders
    - title: ¿Realizan envíos a todo el mundo?
      description: Sí. Enviamos a 50+ países de la UE, América del Norte, Asia-Pacífico, Medio Oriente y África. Los pedidos en stock generalmente se envían en 2-3 días hábiles y se proporciona seguimiento para cada paquete.
      icon: tabler:route
      category: orders
    - title: ¿Qué garantía incluyen las placas SUP?
      description: 'Cada SUP tabla y accesorio está cubierto por una garantía de 2 años, incluyendo la propia tabla, las costuras drop-stitch y las válvulas de inflado. Las reclamaciones se resuelven en días, no en semanas: presente el reclamo en línea y nosotros lo repararemos o reemplazaremos.'
      icon: tabler:lifebuoy
      category: orders
