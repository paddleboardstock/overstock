content_founding:
  tagline: El comienzo
  title: 'Nacidos frente al mar'
  subtitle: 'Aquafarer comenzó en un taller costero en Qingdao con un bote y una visión: construir embarcaciones inflables capaces de soportar condiciones marinas reales.'
  paragraphs:
    - 'En 2012, nuestros fundadores vieron un hueco en el mercado — la mayoría de los botes inflables eran asequibles pero poco fiables, o de alta calidad pero prohibitivamente caros. Creían que había espacio para un fabricante que ofreciera calidad y valor a la vez.'
    - 'El primer casco se construyó a mano, se probó en aguas locales y se perfeccionó a partir de los comentarios reales de pescadores y pequeños operadores comerciales. Ese ciclo — construir, probar, escuchar, mejorar — sigue siendo el núcleo de nuestra filosofía de ingeniería hoy en día.'
    - 'En 2015, la reputación se había extendido más allá de Qingdao. Distribuidores internacionales comenzaron a solicitar muestras. Lo que empezó como un taller local se estaba convirtiendo en un proveedor global.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Primer taller de producción de Aquafarer y fabricación
content_growth:
  tagline: Crecimiento e innovación
  title: 'Del taller a unas instalaciones de 12,000 m²'
  subtitle: 'La inversión continua en personas, equipos y procesos ha transformado Aquafarer en unas modernas instalaciones de fabricación marítima.'
  paragraphs:
    - 'A medida que crecía la demanda, crecían nuestras instalaciones. Pasamos de un pequeño taller a una fábrica de 12,000 m² con líneas de producción dedicadas a botes RIB, botes inflables, tablas SUP y accesorios.'
    - 'Invertimos en máquinas de corte CNC, equipos de soldadura de alta frecuencia, líneas de producción drop stitch y bancos de pruebas integrales — lo que nos permite controlar cada aspecto de la calidad de producción.'
    - 'Hoy, nuestro equipo de 200-300 personas incluye ingenieros navales, científicos de materiales, especialistas en control de calidad y artesanos cualificados — muchos de ellos con Aquafarer desde los primeros días.'
content_mission:
  tagline: Nuestra misión
  title: 'Ingeniería de libertad en el agua'
  subtitle: 'Cada producto de Aquafarer está diseñado para ayudar a las personas a explorar, trabajar y prosperar en el agua — de forma fiable, segura y asequible.'
  list:
    - 'Diseñar embarcaciones que funcionan en condiciones marinas reales — no solo sobre el papel'
    - 'Construir alianzas duraderas con distribuidores y marcas mediante un servicio OEM/ODM fiable'
    - 'Mejorar continuamente nuestros procesos de fabricación para ofrecer más valor'
    - 'Respaldar cada producto con repuestos originales y experiencia técnica'
cta:
  title: '¿Listo para asociarte con un fabricante<br />que se preocupa por la calidad?'
  subtitle: 'Contacta con nuestro equipo para hablar de tu proyecto OEM/ODM — sin presión de pedido mínimo, solo consejos honestos.'
  actions:
    - variant: primary
      text: Iniciar una conversación
      href: /contact
    - text: Explorar nuestros productos
      href: /products
