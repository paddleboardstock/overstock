services:
  - title: Diseño de producto e ingeniería
    description: Nuestro equipo interno de I+D trabaja con tu concepto o especificación para desarrollar dibujos CAD, modelos 3D y prototipos. Ofrecemos diseño de moldes, optimización de la forma del casco y asesoramiento en la selección de materiales.
  - title: Personalización de marca y gráficos
    description: Impresión digital a todo color, serigrafía, gofrado y opciones de etiquetado. Desarrollamos gráficos de cubierta específicos de marca, branding en tubos y embalajes listos para el comercio minorista.
  - title: Personalización de materiales y especificaciones
    description: Elige entre construcciones de PVC (estándar, ecológico, ignífugo), Hypalon/CSM, drop-stitch e híbridas. Colores de tubo personalizados, pesos de tela y opciones de refuerzo.
  - title: Embalaje y logística
    description: Embalaje minorista personalizado, cajas de marca propia, embalaje al vacío, paletizado y carga de contenedores. Disponibles términos de envío FOB Qingdao, CIF o DDP.

