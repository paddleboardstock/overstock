why_us:
  - title: Integración vertical
    description: Somos propietarios de nuestra fábrica, moldes y cadena de suministro — sin intermediarios ni subcontratistas. Esto nos da control sobre la calidad, el coste y la entrega.
  - title: Certificación dual
    description: Sistema de gestión de calidad ISO 9001 y certificación de cumplimiento social BSCI. Informes de auditoría de fábrica disponibles bajo petición.
  - title: Cumplimiento CE
    description: Todos los modelos estándar cuentan con la certificación CE 2013/53/EU. Los modelos personalizados pueden obtener la certificación CE mediante nuestro proceso establecido.
  - title: MOQ bajo
    description: Comienza con tan solo 5 unidades en los modelos estándar. Ayudamos a las marcas emergentes a lanzarse sin comprometer demasiado inventario.
