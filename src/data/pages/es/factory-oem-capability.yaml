hero:
  tagline: Fabricación OEM/ODM
  title: Fabricación OEM y de marca propia
  subtitle: Del concepto al contenedor — personaliza cada detalle de tu línea de embarcaciones hinchables

intro: Paddle Board Overstock ofrece servicios integrales de OEM y ODM para marcas, distribuidores y agencias gubernamentales de todo el mundo. Con más de 10 años de experiencia en exportación y una fábrica de 12,000 m² certificada ISO 9001 y BSCI, nos encargamos de todo, desde el diseño del producto y el desarrollo de moldes hasta la producción a gran escala, el embalaje y la logística.

