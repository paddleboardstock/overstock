workshops:
  - title: Producción de tablas de SUP
    description: '4 líneas de ensamblaje en paralelo para tablas de SUP hinchables. Cada línea puede producir 50–80 tablas por turno. Las estaciones de impresión digital y serigrafía funcionan simultáneamente. Capacidad anual de SUP: más de 8,000 tablas.'
    output: 'Más de 8,000 SUPs/año'
  - title: Producción de botes RIB
    description: 'Taller dedicado de cascos de fibra de vidrio con 6 estaciones de molde para cascos de RIB de hasta 7,6 m. La zona de soldadura de tubos y ensamblaje gestiona 3–5 RIBs a la vez. Capacidad anual de RIB: más de 2,000 embarcaciones.'
    output: 'Más de 2,000 RIBs/año'
  - title: Embarcaciones hinchables y auxiliares
    description: 'Líneas de producción polivalentes para embarcaciones hinchables, kayaks y auxiliares. Las estaciones de soldadura de aire caliente, las prensas dieléctricas RF y los puestos de ensamblaje se reconfiguran según la combinación de pedidos. Capacidad anual: más de 5,000 unidades.'
    output: 'Más de 5,000 unidades/año'
  - title: Equipos de seguridad
    description: 'Zona de producción de sala limpia independiente para chalecos salvavidas y equipos de seguridad. Estaciones dedicadas de costura, inserción de espuma y pruebas. Capacidad anual de chalecos salvavidas: más de 50,000 unidades.'
    output: 'Más de 50,000 chalecos salvavidas/año'

oem_capacity:
  moq: 'SUP: 5–10 unidades | RIB: 2–5 unidades | Kayak/Auxiliar: 10–20 unidades | Molde personalizado: más de 200 unidades'
  lead_time: 'Estándar de 30–45 días. Muestra en 15–20 días. Producción urgente disponible.'
  payment: 'T/T 30% de anticipo + 70% antes del envío. Se aceptan L/C y Western Union.'
