workshops:
  - title: SUP Producción de tablas
    description: '4 líneas de montaje paralelas para SUP tableros inflables. Cada línea puede producir entre 50 y 80 placas por turno. Las estaciones de impresión digital y serigrafía funcionan simultáneamente. SUP Capacidad anual: 8.000+ tableros.'
    output: 8.000+ SUPs al año
  - title: Arte de la cubierta y acabado EVA
    description: Taller dedicado de acabado para barajas de la serie artística. Corte de EVA precisión, patrones de cubiertas colocadas a mano y molduras finales. La capacidad anual cubre toda la gama de la serie de arte.
    output: Gama completa de series de arte
  - title: Drop-Stitch Laminación
    description: 'Las líneas de laminación térmica drop-stitch unen los núcleos a PVC los laminados exteriores. Las bandas de raíles son fusionadas de triple capa para garantizar la resistencia hermética. Capacidad anual: 15.000+ núcleos.'
    output: 15.000+ núcleos/año
  - title: Accesorios y embalaje
    description: Ensamblaje de accesorios y líneas de empaquetado para bombas, paletas, correas y kits de reparación. Las tablas se envasan al vacío, se encajas y se paletizan para su envío mundial.
    output: Paquetes completos, listos para enviar
