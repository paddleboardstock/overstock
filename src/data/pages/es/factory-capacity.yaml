hero:
  tagline: Capacidad de producción
  title: Capacidad de fabricación y producción anual
  subtitle: Instalación de 12.000 m² que produce 15.000 tablas al año con espacio para escalar
intro: Paddle Board Overstock opera una de las SUP mayores instalaciones dedicadas a la fabricación de tablas hinchables en Weihai, China. Nuestra fábrica de 12.000 m² está organizada en seis talleres especializados que operan en paralelo, lo que nos permite producir 15.000 tablas anuales en líneas de series integrales, de turismo y SUP de arte.
