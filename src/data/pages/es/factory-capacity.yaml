hero:
  tagline: Capacidad de producción
  title: Capacidad de fabricación y producción anual
  subtitle: Instalación de 12,000 m² que produce 15,000 embarcaciones al año, con margen de crecimiento

intro: Paddle Board Overstock opera una de las mayores instalaciones dedicadas de fabricación de embarcaciones hinchables en Qingdao, China. Nuestra fábrica de 12,000 m² está organizada en seis talleres especializados que trabajan en paralelo, lo que nos da la capacidad de producir 15,000 embarcaciones al año en las líneas de SUP, kayak, auxiliar, RIB y equipos de seguridad.

