content_capability:
  tagline: Capacidad de ingeniería
  title: Lo que nuestro equipo de ingeniería ofrece
  subtitle: La ingeniería de Aquafarer cubre el ciclo de vida completo del producto, desde la investigación de mercado y el diseño conceptual hasta la creación de prototipos, pruebas y producción en masa.
  items:
    - title: Diseño Industrial
      description: Nuestro equipo de diseño industrial trabaja a partir de los requisitos del cliente, la investigación de mercado y el análisis competitivo para desarrollar conceptos de productos que equilibren la estética, la funcionalidad y la capacidad de fabricación. Producimos bocetos 2D, representaciones 3D y documentos de especificaciones para que el cliente los revise antes de comprometerse con las herramientas.
      features:
        - Desarrollo de conceptos y estudios de viabilidad
        - Planos de diseño 2D y renderizados 3D
        - Selección y especificación de materiales
        - Análisis de diseño para fabricación (DFM)
        - Evaluación ergonómica y de seguridad
    - title: Ingeniería Estructural
      description: 'Nuestros ingenieros estructurales se especializan en la arquitectura de embarcaciones inflables: diseño del casco, configuración de la cámara del tubo, ingeniería del núcleo de costura y distribución de carga. Cada diseño se analiza para determinar la integridad estructural, la optimización del peso y el cumplimiento de las normas pertinentes (CE, ISO, AS).'
      features:
        - Diseño de cascos de fibra de vidrio en V profunda con ángulos de deadrise calculados
        - Configuración de cámaras múltiples en los tubos para seguridad y flotabilidad
        - Especificación del núcleo drop-stitch y optimización de densidad
        - Análisis de elementos finitos para componentes estructurales
        - Cálculos de distribución de pesos y estabilidad
    - title: Modelado 3D y CAD
      description: Todos los diseños de productos se desarrollan en CAD 3D antes de que comience la elaboración de prototipos. Nuestros ingenieros utilizan SolidWorks y Rhino 3D para el modelado de productos, lo que permite a los clientes revisar cada detalle (desde el perfil del tubo hasta el diseño de la consola) antes de comprometerse con la producción.
      features:
        - Modelado CAD 3D completo en SolidWorks y Rhino 3D
        - Renderizados fotorrealistas para presentaciones a clientes
        - Paquetes de planos técnicos para producción
        - Diseño de moldes y utillaje a partir de modelos 3D
        - Transferencia directa de datos de CAD a CNC para corte de precisión
    - title: Creación de prototipos y pruebas
      description: 'Antes de la producción en masa, cada producto nuevo pasa por la etapa de prototipo. Construimos prototipos funcionales para la evaluación del cliente y luego los sometemos a nuestro protocolo de prueba completo: pruebas de presión, pruebas de estabilidad, pruebas de carga y pruebas de agua. Las iteraciones de diseño en la etapa de prototipo son rápidas y rentables.'
      features:
        - Utillaje rápido de prototipos (plazo de 15 a 20 días)
        - Prototipo funcional para evaluación en condiciones reales
        - Protocolo de pruebas completo antes de la aprobación de producción
        - Refinamiento iterativo del diseño según los resultados de las pruebas
        - Hito de aprobación del cliente antes del utillaje de producción
    - title: Integración de accesorios personalizados
      description: 'Muchos proyectos OEM requieren la integración de accesorios proporcionados por el cliente o de terceros: consolas personalizadas, asientos especializados, sistemas electrónicos, soportes para equipos de buceo o elementos de marca. Nuestro equipo de ingeniería gestiona el diseño de integración, adaptación estructural y validación de calidad de todos los accesorios.'
      features:
        - Diseño de consolas y distribución del panel de instrumentos
        - Integración de asientos y tapicería personalizados
        - Diseño y cableado de sistemas electrónicos
        - Sistemas de montaje para equipos de buceo y rescate
        - Especificaciones de aplicación de marca y gráficos
content_process:
  tagline: Proceso de desarrollo
  title: Del concepto<br />a la producción
  subtitle: Nuestro proceso de desarrollo de productos sigue un flujo de trabajo estructurado de seis etapas diseñado para minimizar el riesgo, comprimir los plazos y garantizar la preparación de la fabricación desde el primer día.
  stages:
    - stage: '01'
      title: Requisitos e investigación
      duration: 1-2 semanas
      description: Trabajamos con el cliente para definir las especificaciones del producto, los requisitos del mercado objetivo, las necesidades de cumplimiento normativo y los objetivos comerciales. Esta etapa produce un Documento de requisitos del producto (PRD) que guía todo el trabajo posterior.
      deliverables: PRD, análisis de mercado, benchmark competitivo, estimación preliminar de costos
    - stage: '02'
      title: Diseño conceptual
      duration: 2-3 semanas
      description: El equipo de diseño industrial desarrolla conceptos de productos basados en el PRD. Se presentan múltiples opciones de diseño con representaciones 3D, recomendaciones de materiales y evaluaciones de ingeniería iniciales. El cliente selecciona la dirección para el desarrollo detallado.
      deliverables: Representaciones conceptuales en 3D, especificaciones de materiales, fundamentos del diseño, lista de materiales preliminar
    - stage: '03'
      title: Ingeniería de detalle
      duration: 2-4 semanas
      description: 'El concepto seleccionado está completamente diseñado: modelado CAD 3D, análisis estructural, configuración de tubos, diseño del casco, integración de accesorios y documentación de producción. Todas las dimensiones, materiales y procesos están especificados para las herramientas.'
      deliverables: Modelo CAD 3D completo, dibujos de ingeniería, lista de materiales final, especificaciones de herramientas, plan de control de calidad
    - stage: '04'
      title: Creación de prototipos
      duration: 2-3 semanas
      description: Se producen prototipos de herramientas y se construyen muestras funcionales. El cliente revisa el prototipo según las especificaciones del PRD. Las pruebas se realizan según el protocolo acordado. Los ajustes de diseño se realizan en función de la retroalimentación antes de las herramientas de producción.
      deliverables: Prototipo funcional, informe de prueba, registro de revisión de diseño, documento de aprobación del cliente
    - stage: '05'
      title: Herramientas de producción
      duration: 2-3 semanas
      description: 'Una vez aprobado el prototipo, se ponen en marcha las herramientas de producción: moldes, plantillas de soldadura, programas de corte y accesorios de montaje. La documentación de control de calidad y los criterios de inspección están finalizados. Ejecución de prueba realizada para la validación del proceso.'
      deliverables: Herramientas de producción, documentación de procesos, plan de inspección de control de calidad, informe de ejecución de prueba.
    - stage: '06'
      title: Producción en masa y control de calidad
      duration: En curso
      description: La producción completa comienza con el control de calidad durante el proceso en cada etapa. Los primeros artículos se inspeccionan y aprueban antes del lanzamiento del lote. Monitoreo continuo de la calidad, seguimiento de defectos y mejora continua durante todo el ciclo de vida de producción.
      deliverables: Programa de producción, informes de control de calidad, registros de trazabilidad de lotes, documentación de envío
content_customization:
  tagline: Opciones de personalización
  title: Qué se puede<br />personalizar
  subtitle: Casi todos los aspectos de nuestros productos se pueden personalizar para satisfacer los requisitos del cliente. A continuación se muestran las categorías de personalización más comunes.
  columns: 3
  items:
    - title: Casco y estructura
      description: Longitud del casco, ancho de la viga, ángulo de elevación, diámetro del tubo, configuración de la cámara y calidad del material personalizados.
      icon: tabler:sailboat
    - title: Colores y gráficos
      description: Color del tubo (PVC/Hypalon), color del gelcoat del casco, color de la consola, gráficos de la cubierta, ubicación del logotipo y diseño del empaque.
      icon: tabler:palette
    - title: Consola y controles
      description: Consola central, consola lateral o dirección del timón. Diseño personalizado del panel de instrumentos, ubicación de los interruptores y posición del timón.
      icon: tabler:steering-wheel
    - title: Asientos y tapizados
      description: Asientos tipo jockey, asientos tipo banco, tapicería de lujo, costuras a juego, configuraciones plegables o extraíbles.
      icon: tabler:armchair
    - title: Accesorios y equipos
      description: Escaleras de buceo, soportes para tanques, torres de remolque, T-tops, toldos Bimini, sistemas de sonido, electrónica de navegación y equipos de seguridad.
      icon: tabler:backpack
    - title: Embalaje y marca
      description: Embalajes minoristas personalizados, cajas con etiquetas privadas, cajas de envío con marcas, etiquetas colgantes y manuales de usuario en el idioma del cliente.
      icon: tabler:box
content_industries:
  tagline: Aplicaciones industriales
  title: Soluciones de ingeniería<br />por industria
  subtitle: Nuestro equipo de ingeniería ha desarrollado productos para una amplia gama de aplicaciones marinas, cada una con requisitos y criterios de rendimiento distintos.
  columns: 3
  items:
    - title: Operaciones de buceo
      description: Plataformas reforzadas, integración de escaleras de buceo, sistemas de almacenamiento de tanques y plataformas estables para centros de buceo comerciales en todo el mundo.
      icon: tabler:lifebuoy
    - title: Rescate y Emergencia
      description: Diseños de cascos de alta velocidad, cubiertas autovaciantes, sistemas de montaje de equipos y configuraciones de seguridad multicámara para operaciones SAR.
      icon: tabler:alert-triangle
    - title: Turismo Marino
      description: Diseños de comodidad para los pasajeros, integración de parasoles, sistemas de embarque y configuraciones de bajo consumo de combustible para operaciones de transferencia entre islas.
      icon: tabler:beach
    - title: Tenders para yates
      description: Diseños compactos para almacenamiento en pescante, opciones de acabados de lujo, colores de nave nodriza a juego y características de remolque de alto rendimiento.
      icon: tabler:sailboat
    - title: Pesca y Acuicultura
      description: Configuraciones de plataforma plana, integración de vivero, diseños de portacañas, herrajes resistentes a la corrosión para exposición continua al agua salada.
      icon: tabler:fish
    - title: Portuario e Industrial
      description: Refuerzo de casco de servicio pesado, diseños de embarcaciones de trabajo, configuraciones de transporte de personal e integración de equipos para operaciones en alta mar.
      icon: tabler:ship
