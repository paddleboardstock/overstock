faq:
  title: 'OEM/ODM: Preguntas Frecuentes'
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para tablas de SUP inflables personalizadas?
      a: Para modelos estándar con moldes existentes, la MOQ comienza en 5–10 unidades por diseño. Para moldes y herramientas totalmente personalizados, la MOQ suele ser de 200+ unidades. Trabajamos con startups y marcas emergentes para encontrar puntos de entrada viables.
    - q: ¿Cuál es la MOQ para barcos RIB personalizados?
      a: Los modelos RIB comienzan en 2–5 unidades por diseño con moldes existentes, mientras que los moldes RIB totalmente personalizados requieren compromisos mayores. Trabajamos con startups y marcas establecidas para encontrar puntos de entrada viables.
    - q: ¿Cuánto tarda el proceso de muestras OEM?
      a: Las muestras de prototipo estándar se completan en un plazo de 7 a 14 días hábiles después de la aprobación del diseño. Los pedidos urgentes pueden priorizarse a 5–7 días por una tarifa adicional.
    - q: ¿Cuál es la diferencia entre PVC y Hypalon para lanchas inflables?
      a: El PVC es más ligero, más económico y ofrece una excelente flexibilidad en climas fríos. El Hypalon (CSM) ofrece una resistencia superior a los rayos UV y al ozono con una vida útil más larga (10–15 años frente a 5–8 años). Recomendamos PVC para la mayoría de las aplicaciones recreativas e Hypalon para uso comercial/profesional.
    - q: ¿Pueden personalizar la forma y el diseño del inflable?
      a: Sí. Nuestro equipo de I+D puede desarrollar moldes personalizados para cualquier forma de casco, contorno de tabla o configuración de tubos. Utilizamos moldes de aluminio mecanizados con CNC para lograr precisión y consistencia.
    - q: ¿Ofrecen servicios de auditoría de fábrica?
      a: Damos la bienvenida a auditorías de fábrica in situ y de terceros en nuestras instalaciones de 12 000 m² en Qingdao. Mantenemos las certificaciones ISO 9001 y BSCI y podemos compartir informes de auditoría bajo NDA.
    - q: ¿Qué términos de envío ofrecen?
      a: Ofrecemos términos de envío FOB Qingdao (estándar), CIF y DDP. La carga de contenedores y la documentación completa de exportación están incluidas en todos los pedidos OEM.

content_profiles:
  tagline: Perfiles de Marca
  title: 'Fabricación OEM / Marca Privada<br /> por Tipo de Cliente'
  subtitle: 'Los diferentes perfiles de marca conllevan requisitos distintos: adaptamos nuestros servicios OEM/ODM a su modelo de negocio, escala y estrategia de comercialización.'
  items:
    - title: Marcas Emergentes de Navegación
      subtitle: MOQ bajo, arranque rápido
      description: 'Emprendedores y fundadores que lanzan su primera línea de barcos RIB, tablas de SUP o lanchas inflables. Necesitan un socio de fabricación que trate su marca como propia, con umbrales de entrada bajos, tamaños de lote flexibles y orientación práctica de diseño en cada paso.'
      features:
        - 'MOQ desde solo 2–5 unidades (RIB) / 5–10 unidades (SUP) por SKU'
        - 'Biblioteca de moldes existentes para evitar costos de herramientas'
        - 'Paquete completo de marca: logotipo, gráficos de tubo, embalaje, etiquetas colgantes'
        - 'Flujo de trabajo de muestra primero: aprobar antes de producir'
    - title: Marcas Marinas Establecidas
      subtitle: Escala OEM con cumplimiento CE/ISO
      description: 'Marcas existentes de barcos, motos acuáticas o accesorios marinos que añaden embarcaciones inflables a su cartera. Necesitan calidad constante entre series de producción, cumplimiento normativo para mercados globales y la capacidad de co-diseñar cascos o formas de tubo personalizados.'
      features:
        - 'Ingeniería personalizada de moldes 3D para diseños propios'
        - 'Documentación de cumplimiento CE 2013/53/EU, UKCA, USCG'
        - 'Informes de auditoría social BSCI para el cumplimiento de minoristas'
        - 'Gestión de cuenta dedicada + ventanas de producción prioritarias'
    - title: Marcas DTC y de Comercio Electrónico
      subtitle: Embalaje listo para tienda a gran escala
      description: 'Marcas digitales que venden a través de Amazon, Shopify o sus propias tiendas web. El embalaje, la experiencia de unboxing y la calidad constante de cada unidad son fundamentales. Necesitan una fábrica que entienda la dinámica de velocidad de venta y tasa de devoluciones del comercio electrónico.'
      features:
        - 'Diseño de caja lista para tienda + impresión de tarjetas insertables'
        - 'Empaque al vacío / paletizado para un envío rentable'
        - 'Códigos de barras EAN / UPC y documentación lista para aduanas'
        - 'Consolidación de contenedores mixtos para optimizar el costo de aterrizaje'
    - title: Operadores de Alquiler y Hostelería
      subtitle: Flotas de grado comercial para resorts y negocios de alquiler
      description: 'Resorts, centros de deportes acuáticos y operadores de alquiler necesitan flotas duraderas y mantenibles con una marca coherente. Ofrecemos precios de flota, contenedores de modelos mixtos y soporte de repuestos durante años de operación.'
      features:
        - 'Precios de flota en pedidos de contenedores de modelos mixtos'
        - 'Opciones de tubo y cubierta de grado comercial y duraderas'
        - 'Kits de repuestos y capacitación en mantenimiento'
        - 'Marca coherente en flotas de SUP, RIB y kayak'

