process_steps:
  title: Proceso OEM/ODM en 6 Pasos
  subtitle: 'Del brief de diseño a FOB Qingdao: un flujo de trabajo optimizado'
  steps:
    - number: '01'
      title: Brief de Diseño y Modelado CAD 3D
      description: Comparta sus especificaciones objetivo, producto de referencia o concepto. Nuestro equipo de ingeniería elabora dibujos CAD detallados y renders 3D para su aprobación.
      timeline: 3–5 días
    - number: '02'
      title: Selección de Materiales y Pruebas de Tejido
      description: Elija entre PVC de grado militar (0,9–1,2 mm), Hypalon CSM o tejidos de núcleo drop-stitch. Realizamos pruebas de resistencia a la tracción, adherencia del recubrimiento y estabilidad UV.
      timeline: 2–3 días
    - number: '03'
      title: Prototipado Rápido y Producción de Muestras
      description: Mecanizamos moldes personalizados con CNC y producimos muestras de preproducción con los colores de su marca, su logotipo y los materiales especificados. Las muestras se envían para su aprobación.
      timeline: 7–14 días
    - number: '04'
      title: Prueba de Retención de Presión de 24–48 Horas
      description: Cada prototipo se somete a rigurosas pruebas de retención de presión a 1,25x la presión nominal. Se realizan pruebas de pelado de costuras y verificación dimensional.
      timeline: 1–2 días
    - number: '05'
      title: Inspección de Calidad CE/ISO y Embalaje
      description: Lista de verificación de calidad de 100 puntos. Cada unidad se inspecciona antes del embalaje listo para tienda. Incluye declaración de conformidad CE e informe de cumplimiento BSCI.
      timeline: 2–3 días
    - number: '06'
      title: Envío FOB Qingdao y Logística
      description: Los productos terminados se paletizan, se enfundan en film retráctil y se cargan en contenedores en el puerto de Qingdao. Documentación completa de exportación, despacho aduanero y seguimiento en tiempo real.
      timeline: 7–14 días

