hero:
  tagline: Acerca de
  title: Acerca Paddle Board Overstock de
  subtitle: 'Desde 2012, hemos estado poniendo tablas inflables nuevas SUP en manos de palistas y pequeños minoristas en 50+ países: inventario excedente, precios justos y una garantía que realmente respetamos.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock tablas inflables nuevas SUP
direct_answer: Paddle Board Overstock es una marca de equipamiento para deportes acuáticos fundada en 2012 y con sede en Weihai, China. Vendemos tablas inflables nuevas SUP a partir de inventario excedente — una mezcla de producción excedente de nuestra propia base de fabricación y stock cuidadosamente seleccionado de fábricas asociadas — directamente a remeros de extremo y a pequeños minoristas en 50+ países. Cada tabla está 100% testada a presión, respaldada por una garantía de 2 SUP años y enviada por transporte exprés o marítimo.
tldr_points:
  - Fundado en 2012, con sede en Weihai, China — uno de los SUP principales polos manufactureros del mundo
  - 'Modelo con sobrestock: placas nuevas a precios inferiores al de la tienda, sin intermediarios'
  - 'El inventario es de fuentes mixtas: producción excedente de nuestra base más stock de fábricas asociadas y verificadas'
  - 50+ países atendidos, tasa de aprobación del 99,3% en la inspección final, garantía de 2 años SUP
story_section:
  tagline: Nuestra historia
  title: Por qué vendemos excedente
  paragraphs:
    - Paddle Board Overstock iniciado en 2012 en Weihai, China, una ciudad costera de la provincia de Shandong que se ha convertido en uno de los centros de fabricación de hinchables más importantes del mundo SUP . Desde esa base, hemos pasado más de una década fabricando tablas de remo hinchables y enviándolas a todo el mundo.
    - Along the way we noticed something that shapes everything we do today: Cada temporada de producción deja atrás tablas nuevas y perfectamente buenas — tiradas de excedentes, pedidos cancelados, coloraciones de la temporada pasada. Mientras tanto, los minoristas independientes de todo el mundo quedaron excluidos del comercio mayorista porque los proveedores tradicionales exigían pedidos del tamaño de envases.
    - Esa brecha es nuestro negocio. Vendiendo inventario excedente — producción excedente de nuestra propia base en Weihai, además de stock cuidadosamente seleccionado de fábricas asociadas — podemos ofrecer tablas nuevas a precios muy por debajo del comercio habitual, en cantidades que funcionen para un solo paddler o un pedido de tienda de cinco tablas. Nada es de segunda mano, nada es un segundo; simplemente es inventario que merece un cliente en lugar de un almacén.
model_section:
  tagline: Nuestro modelo de negocio
  title: Cómo funciona el modelo de sobrestock
  items:
    - title: Nuevo de palanca, nunca usado
      description: Cada tabla que vendemos es nueva y sin usar. Excedente significa excedente y excedente de inventario — no devoluciones, ni reacondicionadas, ni segundas.
    - title: Inventario de fuentes mixtas
      description: Nuestro stock combina la producción excedente de nuestra propia base de fabricación en Weihai con el inventario seleccionado de fábricas asociadas que mantenemos al mismo nivel de calidad. Las fuentes son mixtas; los estándares no.
    - title: Por debajo de los precios minoristas
      description: El exceso de inventario nos cuesta menos conseguirlo, así que te cuesta menos comprar. Sin precios inflados de lista, sin descuentos falsos — solo precios justos en inventario real.
    - title: Mayorista Amigable para Pequeñas Empresas
      description: El comercio mayorista comienza con 5 tablas, no en contenedores. Los pequeños minoristas pueden mezclar cualquier modelo en stock en un solo pedido y elegir transporte exprés o marítimo.
    - title: Envío directo a ti
      description: Los pedidos se envían directamente desde nuestra base logística de Weihai a tu puerta en 50+ países — exprés para muestras y pedidos pequeños, y transporte marítimo consolidado para venta al por mayor.
quality_section:
  tagline: Calidad y garantía
  title: La calidad detrás de cada tabla
  subtitle: El precio por encima del stock nunca significa estándares relajados. Cada junta — sea cual sea su origen — pasa por el mismo proceso antes de enviarse.
  items:
    - title: 100% probado a presión
      description: Cada tabla individual se infla y se somete a prueba de presión a 15 PSI antes del despacho. Ninguna tabla se envía sin ser probada, sin importar de dónde provenga su inventario.
    - title: Probada para sobrecarga a 1.25x
      description: 'Las tablas de nuestras series de producción se prueban por muestreo más allá de la presión nominal: se mantienen a 1.25x la presión de trabajo durante 24–48 horas para verificar las costuras, las válvulas y la construcción drop-stitch.'
    - title: 99.3% Tasa de Aprobación en Inspección Final
      description: Nuestro proceso de inspección final aprueba el 99.3% de las tablas como libres de defectos, y la pequeña fracción que falla nunca ingresa a nuestro inventario excedente.
    - title: Garantía de 2 años SUP
      description: Cada tabla SUP cuenta con una Garantía de SUP de 2 años que cubre defectos de fabricación. La misma garantía se aplica a todos los clientes en cada uno de nuestros 50+ mercados.
