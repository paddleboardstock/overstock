hero:
  tagline: Equipo
  title: Equipos y Maquinaria de Fabricación
  subtitle: Equipos de grado industrial para corte, soldadura, impresión y ensamblaje
  back_label: Volver a la Fábrica
  back_link: /factory
categories:
  - title: Corte y Preparación de Materiales
    items:
      - name: Máquina automática de corte PVC
        spec: Corte controlado por CNC, 6,5 m × 2,5 m, precisión de 0,1 mm
        desc: Máquina de corte automática controlada por computadora para telas PVC y drop-stitch. El software de anidamiento optimiza la utilización del material a menos del 5% de desperdicio.
      - name: Extendedora de Tela
        spec: Ancho máximo de 3 m, alimentación con tensión controlada
        desc: Coloca la tela en una o varias capas con tensión controlada para evitar distorsiones antes del corte.
  - title: Soldadura y Unión
    items:
      - name: Máquina de sellado térmico
        spec: Soldadura con aire caliente, variable 200–600 °C, 0,5–5 m/min
        desc: Máquina de sellado térmico por aire caliente para unir y soldar laminados PVC, bandas de riel y costuras de cámara. Se utiliza para sujetar, sellar y fusionar juntas del núcleo drop-stitch.
      - name: Prensa Dielectrica RF
        spec: 15 kW, platina 2000 × 600 mm
        desc: Prensa de soldadura por radiofrecuencia para costuras longitudinales principales, articulaciones de travesaño a tubo y fabricación de cámaras grandes.
      - name: Soldador RF Controlado por CNC
        spec: 8 kW, mesa XY 2500 × 1200 mm
        desc: Soldadura programable de costuras curvas para geometrías complejas, estampado de logotipos y trabajos de patchwork de precisión.
  - title: Arte y acabado de baraja
    items:
      - name: Máquina de corte de cubierta EVA
        spec: Corte con cuchillo CNC, ancho de 2 m
        desc: Corte de precisión de paneles de espuma de cubierta EVA para patrones de cubierta de la serie artística. Cada panel se corta con forma para un ajuste completo y sin costuras de la cubierta.
      - name: Prensa de Laminación de Cubierta
        spec: Control de temperatura y presión
        desc: Une paneles de cubierta EVA a la superficie de la tabla con adhesión consistente en toda el área de la cubierta.
  - title: Impresión y decoración SUP
    items:
      - name: Impresora digital
        spec: Inyección de tinta de alta resolución, hasta 2 m de ancho de impresión
        desc: Impresión digital directa a tela para gráficos a todo color para SUP barajas. Imprime patrones personalizados, degradados e imágenes de calidad fotográfica con UV tintas resistentes al agua.
      - name: Máquina de serigrafía
        spec: Registro manual y semiautomático, multicolor
        desc: Serigrafía para SUP logotipos de cartón, marcas y patrones repetitivos. Proporciona impresiones duraderas y opacas con saturación de color vibrante.
  - title: Asamblea Final
    items:
      - name: Estación de torsión de válvulas
        spec: Prueba de función calibrada de 10 ciclos
        desc: Instala y aprieta las válvulas de inflación, luego prueba la función de cada válvula durante 10 ciclos de apertura/cierre.
      - name: Caja de aletas y colocador de anillo D
        spec: Alineado con plantillas y curado con adhesivo
        desc: Coloca y enlaza las cajas de aletas, los anillos en D y los mangos en ubicaciones exactas de la plataforma según la especificación del modelo.
  - title: Pruebas y control de calidad
    items:
      - name: Probador de tracción universal
        spec: Capacidad de 50 kN
        desc: Pruebas de fuerza de ruptura, elongación al romper y propagación de desgarros para lotes de tela.
      - name: Plataforma de pruebas de retención de aire
        spec: Programable, mantenimiento de presión de 30 minutos
        desc: Prueba automatizada de mantenimiento de presión para cada cámara de tubos antes del montaje.
      - name: Probador de despegadura de costura
        spec: Velocidad motorizada de 180° a 100 mm/min
        desc: Pruebas de resistencia de pelado de soldadura y unión según el protocolo interno.
      - name: Cámara de meteorización con arco de xenón
        spec: Exposición 2000 h
        desc: UV pruebas de resistencia para cambio de color y retención de resistencia.
cta:
  title: ¿Te interesa hacer una visita a la fábrica?
  desc: Damos la bienvenida a los visitantes en nuestras instalaciones de Weihai. Consulta nuestro equipo y procesos en persona.
  label: Programa una visita →
  link: /contact
tldr:
  summary: Paddle Board Overstock opera 12.000 m² de espacio de producción equipado con máquinas automáticas de corte PVC, soldadoras RF de alta frecuencia, estaciones de corte y acabado de plataformas EVA, prensas de sellado térmico y equipos de ensamblaje final. Cada tabla pasa pruebas de retención de presión de 1,25 veces la presión nominal.
  points:
    - Corte automático PVC con precisión CNC
    - Soldadura RF de alta frecuencia para la integridad de las costuras
    - Estaciones de corte y acabado a mano de plataformas EVA
    - Equipos de montaje de válvulas y cajas de aletas
    - Pruebas de retención de presión de 1,25 veces la presión nominal en el 100% de las tablas
