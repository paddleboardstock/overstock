hero:
  tagline: América Latina
  title: SUP Tablas mayoristas para<br />Minoristas latinoamericanos
  subtitle: Nuevas tablas de paddle en exceso para tiendas de playa, flotas de alquiler y vendedores online en toda América Latina — desde 5 tablas, modelos mixtos, exprés o de carga marítima.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tablas con sobrestock SUP para minoristas de paddle boards latinoamericanos
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas de SUP excedente a pequeños minoristas de América Latina — desde México y Brasil hasta Colombia, Perú, Chile y Argentina. Los pedidos al por mayor comienzan en 5 tableros, con modelos mixtos bienvenidos, y cada pedido se envía desde Weihai, China, por transporte aéreo exprés o marítimo consolidado. Las placas están 100% probadas por presión y cubiertas por la garantía de 2 SUP años.
tldr_points:
  - Al por mayor de 5 placas — modelos mixtos en un solo pedido, con precio por cantidad total
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - Mercados de habla española y portuguesa atendidos en toda la región
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El mercado latinoamericano SUP
  paragraphs:
    - 'América Latina es uno de los mercados de stand up paddle de más rápido crecimiento en el mundo. Largas costas en dos océanos, economías consolidadas del turismo de playa y una fuerte cultura de deportes de tabla ofrecen a los minoristas independientes desde Tulum hasta Florianópolis una base creciente de clientes: turistas que reciben su primera clase, palistas de fin de semana y una comunidad local de SUP carreras y surf en auge.'
    - The retail landscape is dominated by small and mid-sized independent shops: 'Escuelas de remo frente a la playa que venden lo que alquilan, tiendas de surf que añaden SUP colas y vendedores online que importan directamente por primera vez. Estos negocios rara vez necesitan contenedores llenos de un solo modelo: necesitan entre 5 y 20 tablas por pedido, mezcladas entre modelos para principiantes y algunas ediciones premium.'
  customer_types:
    - title: Comercios de Beach Town
      description: Las tiendas en las ciudades turísticas que atienden turistas — necesitan tablas resistentes para principiantes en gran volumen, además de algunos modelos premium para exhibición y venta.
    - title: Escuelas de remo y flotas de alquiler
      description: Las escuelas combinan clases con comercio, y las flotas de alquiler renovan las tablas cada temporada con pedidos de modelos mixtos.
    - title: Vendedores online
      description: Vendedores de comercio electrónico en español y portugués que introducen la SUP categoría en su mercado nacional sin riesgo de escala de contenedor.
shipping_section:
  title: Barco a América Latina
  paragraphs:
    - Los pedidos se envían desde nuestra base logística en Weihai, China. Muestras de trajes de transporte aéreo exprés, 1–3 pedidos de embarcación y reaprovisionamientos urgentes; el transporte marítimo consolidado es la ruta económica para 5–20 pedidos mayoristas de bordo a los principales puertos de la región.
    - Proporcionamos documentación de exportación completa y precisa — factura comercial y lista de empaquetado — para que el despeje aduanero sea fluido. Los derechos y los impuestos de importación son establecidos por tu país y pagables por el importador; nunca agrupamos promesas vagas de "impuestos incluidos" en un presupuesto de transporte.
  customs_note: Las normas de importación y los tipos de derechos varían significativamente entre países latinoamericanos. Consulta el régimen actual de importación de tu país para equipos de deportes acuáticos inflables antes de hacer el pedido, y pídenos cualquier documentación adicional que necesites tu corredor.
faq_section:
  title: Preguntas frecuentes sobre América Latina
  items:
    - q: ¿Puedo pedir un presupuesto en español o portugués?
      a: Nuestro equipo trabaja con compradores de toda América Latina y puede gestionar presupuestos y confirmaciones de pedidos para clientes que hablan español y portugués. Pregunta en tu consulta.
    - q: ¿Enviáis a mi país en América Latina?
      a: Enviamos por toda la región — México, Brasil, Colombia, Perú, Chile, Argentina, Ecuador y más allá. Confirma tu destino exacto en tu solicitud de presupuesto y verificaremos el servicio de carga vigente.
    - q: ¿Cuál es el mínimo al por mayor para los minoristas latinoamericanos?
      a: 'Cinco tablas en total, mezclando cualquier modelo en stock. Ese total determina tu nivel de precios: puedes combinar ediciones all-around, touring y art en un solo envío.'
    - q: ¿Quién paga los aranceles de importación en mi país?
      a: Usted lo hace, como importador, según las reglas de su país. Nosotros proporcionamos la documentación correcta y completa (factura comercial, lista de empaque) para que el despacho sea predecible; consulte nuestra página de envíos internacionales para tener una visión completa.
