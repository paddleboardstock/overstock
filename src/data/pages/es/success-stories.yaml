hero:
  tagline: Historias de éxito
  title: Resultados reales de<br />creadores de negocios del agua
  subtitle: Vea cómo clubes, complejos turísticos y empresarios de todo el mundo construyeron operaciones rentables de deportes acuáticos con el equipo y el soporte de Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Historias de éxito de clientes de Aquafarer
stories:
  - title: Cómo un resort mediterráneo construyó un negocio rentable de alquiler de SUP
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 'Resort de playa de 5 estrellas: Grecia'
    problem: El complejo necesitaba actividades acuáticas premium para los huéspedes para aumentar los puntajes de satisfacción y crear una nueva fuente de ingresos, pero carecía de equipo, infraestructura de seguridad y experiencia del personal.
    solution: Aquafarer entregó 50 tablas de SUP personalizadas con los colores y el logotipo del resort, un sistema de seguridad completo que incluye una estación de salvavidas y líneas de boyas, y un programa de capacitación del personal de 3 días que cubre el manejo del equipo, la instrucción de los huéspedes y los protocolos de seguridad.
    result:
      - Más de 300 actividades de huéspedes reservadas por semana en el primer mes
      - 'Puntuación de satisfacción de los huéspedes en actividades acuáticas: 4,8/5'
      - 'Nuevos ingresos anuales adicionales: 180.000 $'
      - Cero incidentes de seguridad en la primera temporada de operación
      - Coste de reposición de equipos reducido un 40 % frente al proveedor anterior
    quote:
      text: 'Aquafarer no solo entregó tablas: nos ayudó a crear una experiencia completa para los huéspedes. Nuestro programa de deportes acuáticos pasó de cero a lo más destacado del resort en una temporada.'
      author: Gerente General del Resort
    cta_text: Crea tu solución para resorts
    cta_href: /solutions/resorts
  - title: Cómo una startup australiana creó una marca de agua en 90 días
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: 'Emprendedor por primera vez: Australia'
    problem: Un entusiasta de las actividades al aire libre quería lanzar su propia marca de SUP para el mercado australiano, pero no tenía experiencia en fabricación, relaciones con proveedores y capital limitado.
    solution: El paquete de lanzamiento de marca de Aquafarer proporcionó consultas para la selección de productos, logotipo personalizado y diseño de color, embalaje minorista de marca con etiquetas colgantes, documentación de certificación CE y envío FOB a Sydney.
    result:
      - Primer envío de 200 tablas entregado en 75 días desde el primer contacto
      - Marca lanzada en Shopify + Amazon AU en menos de 2 semanas tras la llegada
      - Inventario inicial agotado en 45 días
      - 'Margen medio: 55 % sobre el precio de venta al público'
      - 'Segundo pedido: 500 unidades realizadas en menos de 60 días tras el lanzamiento'
    quote:
      text: Tenía la idea de la marca pero ningún conocimiento de fabricación. Aquafarer literalmente me tomó de la mano durante todo el proceso, desde elegir el diseño de placa correcto hasta abrir mi primer envío. 90 días desde el sueño hasta la entrega.
      author: Fundador de la marca australiana de SUP
    cta_text: Lanza tu marca
    cta_href: /solutions/entrepreneurs
  - title: Cómo un club de playa tailandés pasó de 10 a 80 tablas
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Club de deportes acuáticos — Tailandia
    problem: Un pequeño club de SUP junto a la playa en Phuket necesitaba pasar de una operación de pasatiempo a un negocio de alquiler profesional que presta servicios a turistas, pero no pudo encontrar un proveedor de equipos confiable con calidad y precios constantes.
    solution: Comenzando con el paquete inicial del club Aquafarer (10 tablas, remos, equipo de seguridad, marca), el club creció a través del programa del paquete premium durante 18 meses.
    result:
      - Crecimiento de 10 a 80 tablas en 18 meses con calidad y precios constantes
      - Añadieron alquiler de kayaks y patines acuáticos con el mismo proveedor
      - La imagen de marca personalizada del club aumentó el reconocimiento entre los turistas
      - Costes de mantenimiento reducidos un 60 % frente al equipo económico anterior
      - Actualmente más de 150 alquileres diarios en temporada alta
    quote:
      text: 'El paquete Club Starter fue el punto de entrada perfecto. A medida que nuestro negocio crecía, Aquafarer crecía con nosotros: la misma calidad, el mismo precio, sin sorpresas.'
      author: Propietario del club, Phuket
    cta_text: Comienza tu paquete de club
    cta_href: /solutions/clubs
  - title: Cómo una cadena turística caribeña estandarizó los deportes acuáticos en cinco propiedades
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: 'Cadena turística: Caribe'
    problem: Una cadena de complejos turísticos de lujo con cinco propiedades necesitaba una calidad y una marca consistentes en los equipos para deportes acuáticos en todas las ubicaciones, con adquisiciones centralizadas y planificación de reemplazo estacional.
    solution: Aquafarer entregó una flota de propiedades múltiples de 300 SUP y 100 kayaks con marca unificada, inventario de repuestos compartido y programa de reemplazo anual con precios por volumen.
    result:
      - Experiencia de huéspedes estandarizada en las 5 propiedades
      - Reducción de costes del 30 % mediante compras consolidadas y precios por volumen
      - Un inventario centralizado de repuestos redujo los tiempos de parada un 80 %
      - El programa anual de renovación de equipos eliminó las prisas de fin de temporada
      - La participación de los huéspedes en deportes acuáticos aumentó un 45 % interanual
    cta_text: Diseña tu programa para resorts
    cta_href: /solutions/resorts
