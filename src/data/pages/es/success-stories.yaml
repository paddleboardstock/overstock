hero:
  tagline: Historias de éxito
  title: Resultados reales de<br />creadores de negocios del agua
  subtitle: Vea cómo clubes, resorts y operadores de alquiler en todo el mundo construyeron programas de deportes acuáticos prósperos con el equipo y apoyo de Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Historias de éxito de clientes de Paddle Board Overstock
stories:
  - title: Cómo un resort mediterráneo construyó un negocio rentable de alquiler de SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 'Resort de playa de 5 estrellas: Grecia'
    problem: El complejo necesitaba actividades acuáticas premium para los huéspedes para aumentar los puntajes de satisfacción y crear una nueva fuente de ingresos, pero carecía de equipo, infraestructura de seguridad y experiencia del personal.
    solution: Paddle Board Overstock entregó 50 tablas de SUP personalizadas con los colores y el logotipo del resort, un sistema de seguridad completo que incluye una estación de salvavidas y líneas de boyas, y un programa de capacitación del personal de 3 días que cubre el manejo del equipo, la instrucción de los huéspedes y los protocolos de seguridad.
    result:
      - Más de 300 actividades de huéspedes reservadas por semana en el primer mes
      - 'Puntuación de satisfacción de los huéspedes en actividades acuáticas: 4,8/5'
      - 'Nuevos ingresos anuales adicionales: 180.000 $'
      - Cero incidentes de seguridad en la primera temporada de operación
      - Coste de reposición de equipos reducido un 40 % frente al proveedor anterior
    quote:
      text: 'Paddle Board Overstock no solo entregó tablas: nos ayudó a crear una experiencia completa para los huéspedes. Nuestro programa de deportes acuáticos pasó de cero a lo más destacado del resort en una temporada.'
      author: Gerente General del Resort
    cta_text: Crea tu solución para resorts
    cta_href: /solutions/resorts
  - title: Cómo un club de playa tailandés pasó de 10 a 80 tablas
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Club de deportes acuáticos — Tailandia
    problem: Un pequeño club de SUP junto a la playa en Phuket necesitaba pasar de una operación de pasatiempo a un negocio de alquiler profesional que presta servicios a turistas, pero no pudo encontrar un proveedor de equipos confiable con calidad y precios constantes.
    solution: Comenzando con el paquete inicial del club Paddle Board Overstock (10 tablas, remos, equipo de seguridad, marca), el club creció a través del programa del paquete premium durante 18 meses.
    result:
      - Crecimiento de 10 a 80 tablas en 18 meses con calidad y precios constantes
      - Se añadieron clases de yoga y fitness SUP al horario semanal.
      - La imagen de marca personalizada del club aumentó el reconocimiento entre los turistas
      - Costes de mantenimiento reducidos un 60 % frente al equipo económico anterior
      - Actualmente más de 150 alquileres diarios en temporada alta
    quote:
      text: 'El paquete Club Starter fue el punto de entrada perfecto. A medida que nuestro negocio crecía, Paddle Board Overstock crecía con nosotros: la misma calidad, el mismo precio, sin sorpresas.'
      author: Propietario del club, Phuket
    cta_text: Comienza tu paquete de club
    cta_href: /solutions/clubs
  - title: Cómo una cadena turística caribeña estandarizó los deportes acuáticos en cinco propiedades
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: 'Cadena turística: Caribe'
    problem: Una cadena de complejos turísticos de lujo con cinco propiedades necesitaba una calidad y una marca consistentes en los equipos para deportes acuáticos en todas las ubicaciones, con adquisiciones centralizadas y planificación de reemplazo estacional.
    solution: Paddle Board Overstock entregó una flota de 400 SUPs en varias propiedades con una marca unificada, inventario compartido de repuestos y un calendario de reemplazo anual con precios por volumen.
    result:
      - Experiencia de huéspedes estandarizada en las 5 propiedades
      - Reducción de costes del 30 % mediante compras consolidadas y precios por volumen
      - Un inventario centralizado de repuestos redujo los tiempos de parada un 80 %
      - El programa anual de renovación de equipos eliminó las prisas de fin de temporada
      - La participación de los huéspedes en deportes acuáticos aumentó un 45 % interanual
    cta_text: Diseña tu programa para resorts
    cta_href: /solutions/resorts
