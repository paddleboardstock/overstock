timeline:
  - year: '2012'
    title: 'Fundación de la fabricación marina'
    body: 'Paddle Board Overstock comenzó como un taller especializado en embarcaciones inflables en Qingdao, China, dedicado a la artesanía marina y la fabricación de botes inflables. El enfoque inicial fue construir productos inflables fiables a través de experiencia práctica en ingeniería y disciplina de fabricación.'
  - year: '2015'
    title: 'Primera exportación y certificación CE'
    body: 'Los primeros pedidos de exportación llegaron a Japón y Corea. Se obtuvo la certificación CE para las líneas de productos principales, marcando la entrada de Paddle Board Overstock en los mercados internacionales. La empresa comenzó a atender a usuarios comerciales y recreativos más allá de China.'
  - year: '2018'
    title: 'Ampliación de la fábrica'
    body: 'Traslado a una instalación de producción de 12,000 m². Se añadieron líneas de soldadura RF y capacidad de producción drop-stitch, permitiendo una fabricación a mayor escala y sistemas de control de calidad mejorados.'
  - year: '2020'
    title: 'Creación del centro de I+D'
    body: 'Apertura de un centro de I+D dedicado con laboratorio de tejidos PVC, tanque de pruebas hidrodinámicas y estudio de simulación CAD/FEA. El desarrollo de productos se centró en la construcción ligera, la durabilidad mejorada y el diseño centrado en el usuario.'
  - year: '2022'
    title: 'Certificación y crecimiento global'
    body: 'Obtención de la certificación ISO 9001. Expansión a 14 ingenieros de I+D y 200+ trabajadores. Los productos llegaron a clientes en Europa, América y Asia-Pacífico a través de asociaciones de distribución y OEM.'
  - year: '2024'
    title: 'Estudio de innovación y diseño'
    body: 'Lanzamiento de un estudio integral de diseño e innovación para proyectos ODM personalizados, desde el concepto hasta la producción. Fortalecimiento de aplicaciones marinas profesionales, incluyendo licitaciones de rescate, comerciales y gubernamentales.'
  - year: '2026'
    title: 'Construyendo el futuro de la exploración acuática'
    body: 'Hoy, Paddle Board Overstock continúa desarrollando botes inflables, sistemas SUP y soluciones marinas personalizadas — conectando a personas y organizaciones con las aguas del mundo. Más de 50 países atendidos, capacidad anual de 15,000 unidades.'

content_founding:
  tagline: El comienzo
  title: 'Nacido junto al agua'
  subtitle: 'Paddle Board Overstock comenzó en un taller costero en Qingdao con un bote y una visión: construir embarcaciones inflables capaces de soportar condiciones marinas reales.'
  paragraphs:
    - 'En 2012, nuestros fundadores vieron un vacío en el mercado — la mayoría de los botes inflables eran asequibles pero poco fiables, o de alta calidad pero prohibitivamente caros. Creían que había espacio para un fabricante que ofreciera tanto calidad como valor.'
    - 'El primer casco fue construido a mano, probado en aguas locales y refinado con base en comentarios reales de pescadores y pequeños operadores comerciales. Ese ciclo de retroalimentación — construir, probar, escuchar, mejorar — sigue siendo el núcleo de nuestra filosofía de ingeniería hoy en día.'
    - 'Para 2015, la noticia se había extendido más allá de Qingdao. Distribuidores internacionales comenzaron a solicitar muestras. Lo que empezó como un taller local se estaba convirtiendo en un proveedor global.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Taller de producción temprana y fabricación de Paddle Board Overstock

content_growth:
  tagline: Crecimiento e innovación
  title: 'Del taller a una instalación de 12,000 m²'
  subtitle: 'La inversión continua en personas, equipos y procesos ha transformado a Paddle Board Overstock en una instalación moderna de fabricación marina.'
  paragraphs:
    - 'A medida que crecía la demanda, también crecían nuestras instalaciones. Pasamos de un pequeño taller a una fábrica de 12,000 m² con líneas de producción dedicadas para botes RIB, botes inflables, tablas de SUP y accesorios.'
    - 'Invertimos en máquinas de corte CNC, equipos de soldadura de alta frecuencia, líneas de producción drop-stitch y bancos de prueba integrales — permitiéndonos controlar cada aspecto de la calidad de producción.'
    - 'Hoy, nuestro equipo de 200-300 personas incluye ingenieros marinos, científicos de materiales, especialistas en control de calidad y artesanos cualificados — muchos de los cuales han estado con Paddle Board Overstock desde los primeros días.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Instalación de producción moderna de Paddle Board Overstock

founder:
  tagline: El fundador
  title: Creado por un hombre de mar
  subtitle: >-
    El fundador David Chen combina experiencia en fabricación con una pasión de toda la vida por los
    deportes acuáticos — una combinación que define el enfoque de Paddle Board Overstock hacia el desarrollo de
    productos.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fundador de Paddle Board Overstock
  story:
    - >-
      David Chen creció en la costa de Qingdao, donde el mar no era un destino vacacional, sino una
      forma de vida. Pasó su juventud practicando kayak, vela y pesca en el mar Amarillo —
      experiencias que le dieron una comprensión intuitiva de lo que las embarcaciones deben
      soportar.
    - >-
      Antes de fundar Paddle Board Overstock, David pasó una década en la fabricación marítima, trabajando en
      producción, calidad y comercio internacional. Gestionó programas OEM para marcas europeas y
      norteamericanas, conociendo de primera mano los estándares y expectativas de los mercados
      globales.
    - >-
      En 2012 fundó Paddle Board Overstock con una misión simple — construir embarcaciones inflables en las que
      confiaría con su propia familia en el agua. Ese criterio personal (¿lo usaría yo?) sigue siendo
      la prueba final para cada producto que sale de la fábrica.
    - >-
      Hoy, David lidera la estrategia de producto y supervisa el equipo de I+D, revisando
      personalmente los nuevos diseños y probando prototipos en las aguas de Qingdao. Cree que los
      grandes productos nacen de entender tanto la ingeniería como la experiencia.

philosophy:
  tagline: 'Filosofía de marca'
  title: 'Ingeniería de la Libertad en el Agua'
  body: 'La libertad en el agua no se trata solo de movimiento. Representa descubrir nuevos lugares, crear experiencias al aire libre, conectar a las personas con la naturaleza y permitir misiones profesionales. La ingeniería hace posible esa libertad.'
  pillars:
    - title: 'Fiabilidad ante todo'
      body: 'Los entornos acuáticos exigen confianza. Los productos Paddle Board Overstock están diseñados para ofrecer estabilidad, durabilidad, seguridad y rendimiento constante.'
    - title: 'Diseño centrado en las personas'
      body: 'Los productos deben servir a las personas, no a la tecnología. Cada decisión de diseño comienza por entender cómo las personas usan las embarcaciones, dónde exploran y qué desafíos enfrentan.'
    - title: 'Exploración accesible'
      body: 'El agua no debería pertenecer solo a los expertos. Paddle Board Overstock crea equipos que permiten a más personas experimentar de forma segura ríos, lagos, océanos y entornos costeros.'
    - title: 'Innovación continua'
      body: 'La innovación no es solo crear nuevos productos. Es mejorar cada detalle — materiales, estructuras, fabricación y experiencia de usuario.'

engineeringDna:
  tagline: 'ADN de ingeniería'
  title: 'Cómo Paddle Board Overstock crea productos'
  areas:
    - title: 'Ciencia de materiales'
      body: 'Paddle Board Overstock se centra en seleccionar materiales apropiados para diferentes entornos marinos. Las consideraciones clave incluyen resistencia a la abrasión, resistencia a los rayos UV, estabilidad a la presión y durabilidad a largo plazo.'
      items: ['Resistencia a la abrasión', 'Resistencia UV', 'Estabilidad a la presión', 'Durabilidad a largo plazo']
    - title: 'Ingeniería estructural'
      body: 'Las embarcaciones inflables requieren un equilibrio preciso entre rigidez, peso, portabilidad y estabilidad. La ingeniería de Paddle Board Overstock se centra en optimizar estos factores mediante la tecnología drop-stitch y la construcción avanzada de costuras.'
      items: ['Rigidez', 'Optimización de peso', 'Portabilidad', 'Estabilidad']
    - title: 'Precisión de fabricación'
      body: 'Cada producto pasa por procesos controlados: preparación de materiales, corte de precisión, soldadura y unión, montaje, inspección de calidad y verificación de rendimiento.'
      items: ['Preparación de materiales', 'Corte de precisión', 'Soldadura y unión', 'Montaje y CC']
    - title: 'Ingeniería de escenarios de uso'
      body: 'Los productos se desarrollan en torno a aplicaciones reales — recreación, aventura y uso profesional — asegurando que cada diseño cumpla con las demandas específicas de su entorno previsto.'
      items: ['Recreación', 'Aventura', 'Profesional', 'Comercial']

