hero:
  tagline: Nuestra Historia
  title: 'Paddle Board Overstock — Ingeniería de la Libertad en el Agua'
  subtitle: 'De un taller costero a un fabricante marino global — nuestro viaje se basa en la firme creencia de que las embarcaciones deben diseñarse como si importaran, porque importan.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fábrica de Paddle Board Overstock e instalación de fabricación marina en Qingdao

