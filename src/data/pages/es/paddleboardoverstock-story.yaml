timeline:
  - year: '2012'
    title: Fundación de Fabricación Marina
    body: Paddle Board Overstock comenzó como un taller especializado de tablas de paddle hinchables en Weihai, China, dedicado a la artesanía marina y la fabricación de tablas. El enfoque inicial fue construir productos inflables fiables mediante experiencia práctica en ingeniería y disciplina en fabricación.
  - year: '2015'
    title: Primeras exportaciones
    body: Los pedidos iniciales de exportación llegaron a Japón y Corea, marcando Paddle Board Overstock la entrada de la empresa en mercados internacionales. La empresa comenzó a atender a palistas y entusiastas de los deportes acuáticos más allá de China.
  - year: '2018'
    title: Expansión de la fábrica
    body: Se trasladó a una instalación de producción de 12.000 m². Se añadieron líneas de soldadura RF y drop-stitch capacidad de producción, permitiendo una fabricación a mayor escala y sistemas de control de calidad mejorados.
  - year: '2020'
    title: Establecimiento del Centro de Investigación y Desarrollo
    body: Se abrió un centro dedicado de investigación y desarrollo con PVC laboratorio de telas, tanque de pruebas hidrodinámicas y estudio de simulación CAD/FEA. El desarrollo de producto se amplió para centrarse en la construcción ligera, la mayor durabilidad y el diseño centrado en el usuario.
  - year: '2022'
    title: Crecimiento global
    body: Se amplió a 14 ingenieros de I&D y 200+ trabajadores. Las tablas llegaron a remeros de toda Europa, América y Asia-Pacífico, enviando a 50+ países.
  - year: '2024'
    title: Estudio de Innovación y Diseño
    body: Lanzamos un estudio de diseño e innovación de servicio completo para nuevas series de tableros, desde el concepto hasta la producción. Ampliamos nuestras cubiertas de series artísticas y plataformas de gira características.
  - year: '2026'
    title: Construyendo el futuro de la exploración acuática
    body: Hoy en día, Paddle Board Overstock sigue SUP desarrollando tablas inflables, equipos de remo y soluciones marinas personalizadas — conectando a personas y organizaciones con las aguas del mundo. 50+ países atendidos, con una capacidad anual de 15.000 unidades.
content_founding:
  tagline: El comienzo
  title: Nacidos en el Malecón
  subtitle: 'Paddle Board Overstock comenzó en un taller costero en Weihai con una tabla y una visión: construir tablas de paddle hinchables que pudieran soportar condiciones marinas reales.'
  paragraphs:
    - 'En 2012, nuestros fundadores vieron un vacío en el mercado: la mayoría de las tablas inflables eran asequibles pero poco fiables, o de alta calidad pero prohibitivamente caras. Creían que había espacio para un fabricante que ofreciera tanto calidad como valor.'
    - El primer casco se construyó a mano, se probó en aguas locales y se perfeccionó basándose en la retroalimentación real de pescadores y pequeños operadores comerciales. Ese bucle de retroalimentación — construir, probar, escuchar, mejorar — sigue siendo el núcleo de nuestra filosofía de ingeniería hoy en día.
    - Para 2015, la noticia se había extendido más allá de Weihai. Remeros y tiendas de deportes acuáticos de toda Asia empezaron a solicitar tablas. Lo que comenzó como un taller local se estaba convirtiendo en una marca global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Taller y fabricación de la producción temprana
content_growth:
  tagline: Crecimiento e innovación
  title: Del taller a una instalación de 12.000 m²
  subtitle: La inversión continua en personas, equipos y procesos se ha transformado Paddle Board Overstock en una moderna planta de fabricación marina.
  paragraphs:
    - A medida que crecía la demanda, también lo hacía nuestra instalación. Ampliamos de un pequeño taller a una fábrica de 12.000 m² con líneas de producción dedicadas para SUP tableros, accesorios y equipos de seguridad.
    - Invertimos en CNC máquinas de corte, equipos de soldadura de alta frecuencia, líneas de producción de puntadas por gota y equipos de prueba completos, lo que nos permitió controlar todos los aspectos de la calidad de producción.
    - Hoy en día, nuestro equipo de 200-300 personas incluye ingenieros navales, científicos de materiales, especialistas en control de calidad y artesanos cualificados, muchos de los cuales han estado en el equipo Paddle Board Overstock desde los primeros días.
founder:
  tagline: Conoce al fundador
  title: Construido por un Waterman
  subtitle: El fundador David Chen combina experiencia en fabricación y una pasión de toda la vida por los deportes acuáticos, una combinación que define cómo Paddle Board Overstock abordar el desarrollo de productos.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fundador de Paddle Board Overstock
  story:
    - David Chen creció en la costa de Weihai, donde el mar no era un destino vacacional sino un modo de vida. Pasó su juventud remantando, navegando y pescando en el Mar Amarillo, experiencias que le dieron una comprensión intuitiva de lo que las tablas de remo deben soportar.
    - Antes de Paddle Board Overstock fundar, David pasó una década en la fabricación marina, trabajando en producción, calidad y comercio internacional. Lideró programas de producción y calidad para los mercados europeo y norteamericano, aprendiendo de primera mano las expectativas de los palistas globales.
    - 'En 2012, fundó Paddle Board Overstock con una misión sencilla: construir tablas de remos hinchables en las que confiara a su propia familia en el agua. Ese estándar personal — ¿lo usaría yo? — sigue siendo la prueba final para cada producto que sale de la fábrica.'
    - Hoy en día, David lidera la estrategia de producto y supervisa el equipo de I&D, revisando personalmente nuevos diseños y probando prototipos en las aguas de Weihai. Cree que los grandes productos provienen de entender tanto la ingeniería como la experiencia.
philosophy:
  tagline: Filosofía de marca
  title: Libertad de ingeniería en el agua
  body: La libertad en el agua no es solo movimiento. Representa descubrir nuevos lugares, crear experiencias al aire libre, conectar a las personas con la naturaleza y facilitar misiones profesionales. La ingeniería hace posible esa libertad.
  pillars:
    - title: Fiabilidad ante todo
      body: Los entornos hídricos exigen confianza.Paddle Board Overstock Los productos están diseñados en torno a la estabilidad, durabilidad, seguridad y un rendimiento constante.
    - title: Diseño centrado en el ser humano
      body: Los productos deben servir a las personas, no a la tecnología. Cada decisión de diseño comienza con entender cómo usan las personas sus tablas, dónde exploran y qué desafíos enfrentan.
    - title: Exploración accesible
      body: El agua no debería pertenecer solo a los expertos.Paddle Board Overstock Crea equipos que permiten a más personas experimentar de forma segura ríos, lagos, océanos y entornos costeros.
    - title: Innovación Continua
      body: 'La innovación no solo consiste en crear nuevos productos. Es mejorar cada detalle: materiales, estructuras, fabricación y experiencia del usuario.'
engineeringDna:
  tagline: ADN de Ingeniería
  title: Cómo Paddle Board Overstock Crea Productos
  areas:
    - title: Ciencia de Materiales
      body: Paddle Board Overstock se centra en seleccionar materiales apropiados para diferentes ambientes marinos. Las consideraciones clave incluyen resistencia a la abrasión, resistencia a UV, estabilidad a la presión y durabilidad a largo plazo.
      items:
        - Resistencia a la abrasión
        - Resistencia a los rayos UV
        - Estabilidad a la Presión
        - Durabilidad a Largo Plazo
    - title: Ingeniería Estructural
      body: Los paddle boards inflables requieren un equilibrio preciso entre rigidez, peso, portabilidad y estabilidad. La ingeniería de Paddle Board Overstock se centra en optimizar estos factores mediante la tecnología central drop-stitch y la construcción avanzada de las costuras.
      items:
        - Rigidez
        - Optimización del Peso
        - Portabilidad
        - Estabilidad
    - title: Precisión en la Fabricación
      body: 'Cada producto pasa por procesos controlados: preparación de materiales, corte de precisión, soldadura y adhesión, ensamblaje, inspección de calidad y verificación del rendimiento.'
      items:
        - Preparación de Materiales
        - Corte de Precisión
        - Soldadura y Unión
        - Ensamblaje y Control de Calidad
    - title: Ingeniería Basada en Escenarios de Usuario
      body: 'Los productos se desarrollan en torno a aplicaciones reales de remo: recreación, aventura, familia y turismo, asegurando que cada diseño cumpla con las demandas específicas del entorno previsto.'
      items:
        - Recreación
        - Aventura
        - Familia
        - Turismo
