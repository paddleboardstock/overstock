hero:
  tagline: Guías
  title: ¿Nuevo en SUP?
  subtitle: Guías prácticas para ayudarle a elegir, utilizar y disfrutar de equipos inflables para deportes acuáticos.
size_guide:
  tagline: Tamaño y especificaciones
  title: Encuentre el tamaño adecuado para sus necesidades
  desc: Compare las dimensiones del producto, las capacidades de peso y los usos recomendados. Ya sea que necesites un SUP de travesía, un kayak compacto o una RIB comercial, nuestra guía de tallas te ayudará a elegir el ajuste adecuado.
  link_label: Guía de tallas completa con especificaciones del producto →
  link: /size-guide
  cards:
    - title: Tablas de SUP
      desc: Elija la longitud según su peso y el uso previsto. Las tablas más anchas (32"+) ofrecen más estabilidad. Las tablas más largas (11 a 12 pies) se mueven mejor para viajar.
    - title: kayaks
      desc: Kayaks individuales (9 pies) para viajes en solitario y ríos. Kayaks tándem (12 pies) para dos remeros o uno con equipo. Siempre verifique la capacidad de peso.
    - title: Botes y RIB
      desc: Elija la longitud según el número de pasajeros y el uso. RIB más grandes (4,5 m+) para alta mar y rescate. Botes más pequeños (2,7 m) como auxiliares y plataformas de pesca.
