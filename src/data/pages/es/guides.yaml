hero:
  tagline: Guías
  title: ¿Nuevo en SUP?
  subtitle: Guías prácticas para ayudarle a elegir, utilizar y disfrutar de equipos inflables para deportes acuáticos.
size_guide:
  tagline: Tamaño y especificaciones
  title: Encuentre el tamaño adecuado para sus necesidades
  desc: Compare las dimensiones de la tabla, la capacidad de peso y los usos recomendados. Ya sea que desee una tabla estable para todo uso o una forma más rápida para recorrer — nuestra guía de tallas le ayuda a elegir el ajuste correcto.
  link_label: Guía de tallas completa con especificaciones del producto →
  link: /size-guide
  cards:
    - title: Tablas SUP Todo Terreno
      desc: Nuestras tablas de aproximadamente 11 pies (32" de ancho) equilibran estabilidad, velocidad y capacidad. El núcleo de 6 pulgadas drop-stitch a 15 PSI mantiene la cubierta rígida para palistas de todos los niveles.
    - title: Anchura y estabilidad
      desc: Las tablas más anchas (32"+) ofrecen más estabilidad para principiantes, yoga y pesca. El grosor de 6 pulgadas añade rigidez y capacidad de peso para el jinete y su equipo.
    - title: Paquetes y Accesorios
      desc: 'Cada tabla se envía como un paquete completo: tabla, mochila de viaje, bomba de mano, remo ajustable, aleta desmontable, correa en espiral y kit de reparación. Verifique la carga máxima para el usuario más el equipo.'
