features3_cases:
  tagline: Historias Destacadas
  title: Tablas Reales<br />Para Aventuras Reales
  isBeforeContent: false
  columns: 3
  items:
    - title: Del Sofá a Ponerse de Pie en el Primer Intento
      customer: Remero Principiante
      country: Alemania
      industry: Recreación para Principiantes
      challenge: Anna nunca había remado antes y estaba nerviosa por el equilibrio, el agua fría y por verse tonta frente a los demás. Viviendo en un pequeño apartamento en Múnich, además no tenía lugar para guardar una tabla rígida ni portaequipajes para transportarla.
      solution: El SUP Explorer 11 ofrece una plataforma amplia y estable que perdona los primeros remos inestables. El paquete completo —tabla, remo ajustable, bomba, leash y bolsa— significaba que podía llevar todo al lago a pie. De la caja al agua en menos de 20 minutos, sin necesidad de experiencia.
      product: Explorador de SUP 11
      results: Anna se levantó en su primer intento y remó durante una hora sin caerse. Dos meses después rema tres veces por semana y se ha unido a un grupo local. La tabla se guarda en una mochila que cabe en su armario del pasillo.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Esperaba pasar mi primer día nadando al lado de la tabla. En cambio, estaba deslizándome por el lago en minutos — no podía creer lo estable que se siente.
      icon: tabler:school
    - title: Una Tabla, Dos Niños, Sin Quejas
      customer: Familia de Cuatro
      country: Italia
      industry: Recreación Familiar
      challenge: Marco y Giulia querían una actividad de verano que realmente hiciera que sus dos hijos dejaran las pantallas. Los inflables baratos anteriores se deformaban, tenían fugas en las costuras y se desinflaban a mitad del remo — los niños perdieron confianza después de un mal baño.
      solution: La Serie Tropical Breeze trae todo un lienzo de vacación isleña —sol, cocoteros y escenas de playa— que hizo que los niños quisieran salir al agua. El núcleo drop-stitch se mantiene rígido a 15 PSI, y cada tabla se prueba a una presión de 1.25 veces su presión nominal durante 24-48 horas en la fábrica antes de enviarse.
      product: Serie Tropical Breeze
      results: Ahora la familia rema todos los fines de semana de junio a septiembre. Después de toda una temporada de tráfico infantil, la tabla no muestra estrés en las costuras ni decoloración. Su hija ha empezado a pedir su propia tabla para su cumpleaños.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: Los niños pelean por quién le toca remar. Después de las tablas baratas que probamos antes, esta se siente construida para sobrevivir exactamente a nuestra familia.
      icon: tabler:users
    - title: Un Estudio de Yoga Flotante al Amanecer
      customer: Practicante de Yoga
      country: Indonesia
      industry: SUP Yoga & Meditación
      challenge: Putu enseña yoga en Bali y quería llevar su práctica al agua, pero sus primeros intentos con una tabla prestada le parecieron resbaladizos e inestables. Mantener una postura mientras se desliza en aguas abiertas exige agarre, estabilidad y un diseño que induca calma.
      solution: La serie Flowing Lotus combina ilustraciones de loto, koi y libélula con una almohadilla de tracción grabada con láser que mantiene manos y pies anclados en la posición de perro hacia abajo. El contorno amplio y el grosor de 6 pulgadas crean una plataforma flotante constante para flujos y meditación sentada.
      product: Serie Loto Fluido
      results: Putu ahora dirige pequeñas SUP clases de yoga al amanecer dos veces por semana. Sus alumnos reservan con semanas de antelación, y la junta se ha convertido en la seña de identidad de sus clases — el arte hace la mitad de su marketing por ella.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Practicar en el agua lo cambia todo. La tabla es lo suficientemente estable para la postura del cuervo, y el diseño de loto hace que cada clase se sienta como un ritual.
      icon: tabler:heart
    - title: Color Que Está Incorporado en el Material — Literalmente
      customer: Creador de contenido de viajes
      country: Portugal
      industry: Redes sociales y creación de contenido
      challenge: Miguel graba contenido de paddle profesionalmente. Las tablas impresas que usaba antes perdieron su color en una temporada de agua salada y sol — sus grabaciones empezaron a verse cansadas y los seguidores notaron las plataformas de la cubierta descascaradas.
      solution: La Edición Cheetah Surge construye su motivo de guepardo a partir de piezas de bloque de EVA de varios colores cortadas con troquel en lugar de tinta superficial. Los colores son parte de la espuma misma, por lo que el agua salada, UV y el tráfico peatonal tienen mucha menos probabilidad de desvanecerse, pelarse o rayar el diseño.
      product: Edición Cheetah Surge
      results: Un año entero de sesiones costeras después, el tablero parece completamente nuevo en cámara. Sus clips del amanecer del Algarve se convirtieron en su contenido con mejor rendimiento hasta la fecha, y el propio tablero aparece en decenas de colaboraciones de marcas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Mis viejas tablas envejecieron más rápido que mi contenido. El Cheetah es idéntico al primer día después de un año en el océano — mis seguidores no paran de preguntarme qué filtro uso. No es un filtro. Es el tablero.
      icon: tabler:camera
    - title: Expediciones costeras de fin de semana
      customer: Palista de Turismo Costero
      country: Australia
      industry: Turismo y Exploración
      challenge: Tom quería remar por las bahías y cabos tranquilos de la Costa de Oro en tours de varias horas, pero las tablas ligeras de presupuesto se flexionaban con el mar y le dejaban exhausto tras una hora. Necesitaba rigidez que pudiera llevar solo hasta los lugares de entrada remotos.
      solution: La serie Ocean Voyager combina una obra de arte de tortuga marina en azul verdoso profundo y coral con un drop-stitch núcleo rígido que mantiene la forma a través de la ligera oleaje costero. Con unos 20 libras en su mochila, Tom puede caminar hasta playas a las que ningún coche puede llegar, inflarla con la bomba incluida y hacer un tour durante horas.
      product: Serie Ocean Voyager
      results: Tom ha trazado ahora once rutas costeras, incluyendo una travesía matutina completa que antes consideraba fuera de su habilidad. El tablero se mantiene rígido desde el lanzamiento hasta la comida, y el diseño de la tortuga marina se ha convertido en su sello reconocible en el agua.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Las tablas rígidas se sienten como tablas duras, y esta se lleva como una mochila. Abrió toda una costa que nunca podría alcanzar con coche y remolque.
      icon: tabler:compass
    - title: Forma física corporal completa, cero cuotas de gimnasio
      customer: Remador de fitness
      country: Canadá
      industry: Fitness y Entrenamiento
      challenge: Priya quería un entrenamiento de cuerpo completo de bajo impacto que no se sintiera como un entrenamiento. Correr le dolía las rodillas y el gimnasio le resultaba repetitivo — dejó todas las rutinas en seis semanas.
      solution: 'La serie Dolphin Wave convirtió el ejercicio en juego: remar quema calorías, fortalece el core y los hombros, y desafía el equilibrio, todo mientras se desliza junto al paisaje de Vancouver. La estable plataforma de 32 pulgadas perdona golpes torpes mientras exige un microequilibrio constante — un gimnasio disfrazado de tabla de paddle.'
      product: Serie Dolphin Wave
      results: Priya rema cinco mañanas a la semana antes de ir a trabajar y lleva 14 meses manteniendo la rutina — su récord personal en cualquier plan de ejercicio. Ahora sus amigas se unen a su club semanal de paddle, y sus rodillas nunca han estado más felices.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Nunca he tenido que obligarme a ir a remar. El entrenamiento es real — simplemente dejé de notarlo porque estoy demasiado ocupado disfrutando del agua.
      icon: tabler:trophy
    - title: Un Labrador de 30 kilos y una cubierta muy estable
      customer: Palista con perro
      country: Estados Unidos
      industry: Remando con mascotas
      challenge: Jake quería llevar a su labrador, Biscuit, al agua, pero su vieja tabla estrecha se convirtió en un submarino en cuanto el perro saltó a bordo. Las garras también destrozaron la cubierta barata en cuestión de semanas.
      solution: La Leviathan Wake Series ofrece una plataforma ancha y de gran volumen que transporta a un palista más un pasajero de 30 kilos sin que se hunda. La EVA plataforma de tracción sobrevive a garras que destruyeron su anterior tabla, y el tótem de la ballena azul le da a Biscuit un "sitio" claramente visible para sentarse.
      product: Serie Leviathan Wake
      results: Ahora Biscuit salta a bordo a voluntad y monta la proa como una figura de proa. Dos veranos después, la cubierta no muestra ningún daño en las garras, y sus remos de río se han convertido en el contenido más popular en la señal de Jake.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: Compré una tabla y un primer oficial. La cubierta se encogía de hombros para todo lo que un perro grande y mojado podía lanzarle — literalmente.
      icon: tabler:dog
    - title: Presupuesto estudiantil, calidad a precio completo
      customer: Estudiante universitario
      country: Polonia
      industry: Estilo de vida estudiantil
      challenge: Kasia es una estudiante en Gdansk con un presupuesto de estudiante y una rutina de verano en el lago. Cada tabla barata que encontraba era endeble, fea o ambas cosas — y las tablas de calidad costaban más que su presupuesto mensual de comida.
      solution: La serie Medusa Glow combina una construcción premium — drop-stitch núcleo, PSI rigidez 15, ilustraciones de medusa en verde menta ensambladas con bloques troquelados EVA — con Paddle Board Overstock precios de liquidación directa de fábrica que evitan todos los márgenes intermediarios.
      product: Serie Medusa Glow
      results: Kasia pagó menos de la mitad de lo que venden tablas premium comparables localmente. Su tabla sobrevivió a una temporada completa de sesiones diarias en el lago y una semana en la playa báltica, y tres compañeros pidieron la suya tras probar la suya.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Esperaba compromisos entre el presupuesto estudiantil. En cambio, conseguí una placa que mis amigos pensaban que costaba tres veces más — y duró más que dos de las suyas.
      icon: tabler:backpack
    - title: Despegar desde una plataforma estable
      customer: Pescador de fin de semana
      country: Estados Unidos
      industry: Pesca ocasional SUP
      challenge: Devon pesca en aguas tranquilas y poco profundas para que cualquier embarcación a motor la alcance. Necesitaba una embarcación de remos lo suficientemente estable para lanzar de pie, lo bastante resistente para anzuelos y equipos, y lo bastante ligera para llevarla por un sendero al amanecer.
      solution: La serie Jungle Mandala le ofrece una plataforma ancha y rígida para lanzar lanzamientos, con una terraza de hibisco y colibrí en azul Tiffany que se mantiene fresca bajo el sol de la mañana. La tabla se ajusta al tamaño de mochila para el sendero, se infla en minutos al borde del agua, y la PVC piel reforzada se deshace de enganches y golpes de aletas.
      product: Serie Jungle Mandala
      results: Devon alcanza ahora tres calas de desove que nadie más puede pescar. Su tasa de captura se duplicó durante la temporada, y la tabla — anzuelos, encordadores y todo — sigue pareciendo lista para otro verano.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Estar de pie SUP cambió completamente la forma en que pesco. Esta tabla es lo suficientemente estable para lanzar, anzuelo y aterrizar un pez — todo sin mojarse.
      icon: tabler:fish
