features3_cases:
  tagline: Casos destacados
  title: Soluciones personalizadas<br />Para desafíos reales
  isBeforeContent: false
  columns: 3
  items:
    - title: Actualización de operaciones diarias del centro de buceo de Bali
      customer: Centro de Buceo Océano Azul
      country: Indonesia
      industry: Centro de Buceo Comercial
      challenge: El Centro de Buceo Blue Ocean en Bali operaba un antiguo barco de buceo de fibra de vidrio con espacio limitado en cubierta, difícil acceso para los buzos y alto mantenimiento en condiciones de agua salada tropical. La carga de equipos estaba abarrotada, el tiempo de preparación era largo y la plataforma inestable creó preocupaciones de seguridad para los turistas internacionales, incluidos los buceadores primerizos y los viajeros mayores. El centro realiza entre 3 y 5 viajes de buceo diarios, más de 200 días al año.
      solution: Paddle Board Overstock suministró un Buceo Profesional RIB personalizado de 6,8 m con diseño de plataforma ampliado optimizado para el almacenamiento de equipos de buceo, amplia escalera de buceo de acero inoxidable, tubos Hypalon resistentes para resistencia a los rayos UV y al agua salada, superficie de plataforma antideslizante y solución de almacenamiento en tanque. La configuración se diseñó en torno al flujo de trabajo diario del centro de buceo, no basándose en el diseño estándar de una embarcación de recreo.
      product: Buceo profesional de 6,8 m RIB
      results: Un área de trabajo más grande mejoró la eficiencia de preparación del equipo. Los buzos experimentaron un embarque más seguro y sencillo. Los requisitos de mantenimiento se redujeron significativamente. El centro ganó capacidad para atender a más clientes durante la temporada alta con mayor confianza. El RIB se convirtió en la base de las operaciones diarias de buceo.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Nuestro barco de buceo no es sólo transporte. Es la base de nuestra operación diaria. Paddle Board Overstock RIB le da a nuestro equipo más confianza al realizar múltiples viajes de buceo todos los días.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professional RIB Actualización
      customer: Centro de Buceo Ocean Explorer
      country: Tailandia
      industry: Centro de Buceo Comercial
      challenge: El Centro de Buceo Ocean Explorer en Phuket, Tailandia, necesitaba actualizar su tradicional barco de buceo de fibra de vidrio que no podía satisfacer la creciente demanda de los clientes. El espacio limitado en la cubierta hizo que la preparación del equipo fuera ineficiente. El difícil embarque creó desafíos de seguridad para los turistas internacionales. Los altos requisitos de mantenimiento en condiciones de agua salada tropical aumentaron los costos operativos. El centro opera múltiples viajes diarios, más de 200 días al año.
      solution: Paddle Board Overstock entregó un RIB de buceo comercial personalizado de 6,8 m con un diseño de plataforma de trabajo optimizado para el almacenamiento de tanques de buceo, la preparación de equipos y el movimiento de los buzos. Las características incluyeron una amplia escalera de buceo con pasamanos de acero inoxidable, construcción de tubos de alta resistencia con materiales resistentes a los rayos UV, piso antideslizante, solución de almacenamiento en tanque, consola profesional y asientos para pasajeros, todo configurado para operaciones de buceo comercial.
      product: Buceo comercial de 6,8 m RIB
      results: El área de cubierta más grande permitió una organización más rápida del equipo y un flujo de trabajo diario más eficiente. La comodidad y seguridad en el embarque de los clientes mejoraron significativamente. El tiempo de inactividad por mantenimiento disminuyó con la construcción de grado marino. El centro de buceo podría atender a más clientes durante la temporada alta y ampliar los servicios de buceo profesional con confianza.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Para un centro de buceo, el barco no es sólo transporte. Es una parte importante de nuestra operación diaria. Paddle Board Overstock RIB le brinda a nuestro equipo la confianza para realizar múltiples viajes de buceo todos los días con mayor seguridad y eficiencia.
      icon: tabler:lifebuoy
    - title: Flota del Centro Europeo de Buceo
      customer: Centros de Buceo BlueMed
      country: Grecia
      industry: Buceo y Turismo Marino
      challenge: Se necesitaban 12 RIB configurados para buceo para una cadena de centros de buceo en varias islas griegas. Cada barco necesitaba una escalera de buceo personalizada, almacenamiento de tanques para 8 tanques y una plataforma estable para la entrada de buzos en aguas abiertas. La flota debía llegar en un plazo de 60 días para el inicio de la temporada turística.
      solution: Se produjeron 12 modelos RIB 520 Dive con soportes para tanques integrados, escaleras de buceo y tubos Hypalon extraanchos para mayor estabilidad en el abordaje. Cada barco llevaba la marca de la flota del cliente. Los 12 barcos fueron sometidos a pruebas de presión y enviados desde Qingdao en un plazo de 55 días.
      product: RIB 520 Buceo
      results: Los 12 barcos se entregaron a tiempo para la temporada turística. La flota ha estado en operación diaria durante más de 18 meses sin fallas materiales. El cliente pidió 6 unidades adicionales en el segundo año.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: El RIB 520 Dive ha sido la columna vertebral de nuestras operaciones de buceo diarias. La estabilidad en reposo es excelente y la disposición del tanque de almacenamiento mantiene la cubierta limpia y segura para nuestros huéspedes.
      icon: tabler:lifebuoy
    - title: Programa de Distribuidor Australiano OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Fabricación
      challenge: El distribuidor australiano necesitaba una gama de placas SUP de marca privada a precios competitivos para competir con las marcas chinas directas al consumidor. Se requieren 8 modelos únicos que abarcan desde principiantes hasta avanzados, con gráficos personalizados, empaques personalizados y envío directo a puntos de venta.
      solution: Se desarrollaron 8 modelos SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) con un paquete de gráficos australiano exclusivo. Embalaje minorista personalizado con códigos QR que enlazan a vídeos de configuración. Logística de envío directo configurada desde Qingdao directamente a las tiendas minoristas australianas.
      product: Línea SUP personalizada (8 modelos)
      results: Concepto a primer envío en 90 días. Tasa de ventas minoristas del 85% en la primera temporada. El distribuidor amplió su asociación para incluir una línea de botes inflables en el segundo año.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock entregó una línea SUP completa en 90 días, desde el diseño inicial hasta el piso de venta minorista. La calidad coincide con las marcas que se venden al doble del precio.
      icon: tabler:arrows-exchange
    - title: Suministro de botes de rescate en Medio Oriente
      customer: Autoridad Nacional de Defensa Civil
      country: Emiratos Árabes Unidos
      industry: Búsqueda y Rescate
      challenge: La organización de defensa civil necesitaba 20 RIB listas para patrullar para búsqueda y rescate costero, seguridad portuaria y respuesta a inundaciones. Se requieren cubiertas autovaciables, suites de navegación completas (GPS, radar, VHF), tubos naranjas de alta visibilidad y cumplimiento de las regulaciones marítimas locales.
      solution: Se suministran 20 RIB modelos Patrol 450 con plataformas autovaciables, conjuntos de navegación Garmin, reflectores LED, SOLAS cinta reflectante y tubos naranjas Hypalon de alta visibilidad. Cada barco fue certificado CE y probado según los estándares ISO 6185. El paquete de documentación incluía certificados de cumplimiento para el registro local.
      product: RIB 450 Patrulla
      results: Flota desplegada en 5 estaciones costeras. Los barcos han estado operando en condiciones de calor extremo (45°C+) sin degradación de los tubos. El alcance de patrulla y la eficiencia de combustible superaron las especificaciones en un 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: La Patrulla RIB 450 superó nuestros requisitos operativos. En condiciones de calor extremo, los tubos Hypalon no muestran signos de degradación UV después de 24 meses de uso diario.
      icon: tabler:alert-triangle
    - title: Asociación de marca europea OEM
      customer: Equipo marino del Mar del Norte BV
      country: Países Bajos
      industry: OEM/ODM Fabricación
      challenge: Una marca náutica europea establecida quería expandirse en el mercado RIB sin invertir en instalaciones de fabricación. Se necesitaba un socio de marca blanca capaz de producir 5 RIB modelos (de 3,9 a 6,2 m) con marca privada, certificación CE y derechos exclusivos de distribución en la UE.
      solution: Acuerdo de fabricación de marca blanca establecido para modelos 5 RIB. Cada modelo tiene la marca con logotipos de clientes y combinación de colores. CE Documentación de certificación preparada para cada modelo. Derechos exclusivos de distribución en la UE concedidos con compromisos de pedido mínimo. Documentación técnica y catálogo de repuestos proporcionados para la red de servicio local.
      product: Línea RIB personalizada (5 modelos)
      results: Se firma un acuerdo plurianual. Primera producción de 50 unidades enviada en 75 días. Lanzamiento de la marca en METSTRADE con recepción positiva por parte de los distribuidores.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: 'Trabajar con Paddle Board Overstock nos permitió ingresar al mercado RIB sin construir una fábrica: entregaron una solución completa llave en mano con certificación CE y documentación de respaldo del distribuidor.'
      icon: tabler:building
    - title: Flota de complejos turísticos del Caribe
      customer: Paradise Island Resorts Ltd.
      country: bahamas
      industry: Turismo Marino y Hospitalidad
      challenge: 'El resort de lujo necesitaba una flota completa de equipos de deportes acuáticos para las actividades de los huéspedes: 40 tablas SUP para visitas guiadas, 20 kayaks para exploración de lagunas, 10 botes inflables para traslados de huéspedes y excursiones de pesca, además de accesorios. Todo el equipo necesitaba una marca de resort personalizada y debía entregarse antes de la temporada alta de turismo.'
      solution: 'Se produjo un paquete completo de deportes acuáticos: 40 tablas Voyager SUP (modelo All-Around), 20 kayaks Explorer, 10 botes inflables AirDeck 360, además de PFD, remos, bombas y kits de reparación. Todo el equipo impreso con el logotipo del resort y una combinación de colores tropicales. Envío en contenedores con manifiesto de inventario completo.'
      product: Paquete completo de deportes acuáticos (más de 70 unidades)
      results: La flota llegó 6 semanas antes de la temporada alta. Los puntajes de satisfacción de los huéspedes con respecto a las actividades de deportes acuáticos aumentaron un 40 % año tras año. El equipo ha durado 3 temporadas con sólo mantenimiento de rutina.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: 'El enfoque de paquete completo significó que recibimos todo lo que necesitábamos en un solo envío: tablas, kayaks, botes y accesorios, todos de marca y listos para el uso de los huéspedes. A nuestros huéspedes les encanta la calidad del equipo.'
      icon: tabler:beach
    - title: Centro de buceo comercial de Queensland RIB Actualización
      customer: Centro de Buceo Comercial
      country: Australia
      industry: Buceo comercial y servicios marinos
      challenge: 'Un centro de buceo comercial con sede en Queensland que se especializa en inspección de infraestructura marina, mantenimiento de puertos y proyectos de reparación submarina estaba operando un viejo barco de trabajo. A medida que creció la demanda del proyecto, la vieja embarcación se convirtió en un problema: el mantenimiento frecuente causaba interrupciones en la programación, el diseño no estaba diseñado para operaciones de buceo modernas (espacio limitado para cilindros, herramientas y equipos) y la comodidad de la tripulación durante operaciones prolongadas era deficiente. La empresa necesitaba un barco que pudiera soportar sus operaciones profesionales todos los días laborables.'
      solution: Paddle Board Overstock realizó un análisis operativo detallado del flujo de trabajo de buceo del cliente, la duración típica del proyecto, el tamaño de la tripulación y los requisitos del equipo. Según este análisis, Paddle Board Overstock entregó un profesional personalizado RIB con un diseño de plataforma funcional optimizado para la preparación del equipo y el movimiento de los buzos, asientos profesionales para períodos de transporte más largos, estabilidad mejorada para una entrada y salida más segura de los buzos y características de apoyo al buceo integradas en el diseño.
      product: Buceo Profesional Personalizado RIB
      results: El nuevo RIB se convirtió en una plataforma confiable de trabajo diario. La preparación del equipo se volvió más rápida con el diseño optimizado. La tripulación informó una mayor comodidad y seguridad durante operaciones prolongadas. La apariencia profesional del barco reforzó la confianza del cliente cuando trabajaba con operadores portuarios y contratistas marítimos. El centro de buceo obtuvo una embarcación que coincidía con la profesionalidad de su servicio.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Necesitábamos un barco que pudiera sustentar nuestro negocio todos los días, no sólo un barco de transporte. Paddle Board Overstock trabajó con nosotros para comprender nuestros requisitos operativos y entregó una solución RIB que se adapta a nuestro flujo de trabajo de buceo comercial.
      icon: tabler:lifebuoy
    - title: Contrato de patrulla costera de EE. UU.
      customer: Agencia de Seguridad Costera del Atlántico
      country: Estados Unidos
      industry: Seguridad marítima y aplicación de la ley
      challenge: La agencia de seguridad costera de EE. UU. necesitaba semirrígidas de patrullaje pesado para operaciones de intercepción en aguas abiertas. Se necesitaba configuración bimotor para redundancia, consola blindada para protección de la tripulación, electrónica con especificaciones militares (comunicaciones cifradas, FLIR, radar) y cumplimiento de las regulaciones de la Guardia Costera de EE. UU.
      solution: Diseñado RIB 600 Patrol con configuración fueraborda gemela 115 HP, consola blindada con protección balística, imágenes térmicas FLIR, comunicaciones cifradas VHF/UHF y puntos de montaje de armas integrados. Casco reforzado para maniobras de intercepción a alta velocidad. Toda la electrónica integrada y probada en fábrica. USCG documentación de cumplimiento proporcionada.
      product: RIB 600 Patrulla (Bimotor)
      results: Los barcos alcanzaron una velocidad máxima de 52 nudos durante las pruebas de aceptación. La agencia informó una tasa de preparación para la misión del 95% durante los primeros 12 meses. Pedido adicional realizado por 8 unidades.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: El bimotor RIB 600 brinda a nuestras tripulaciones la velocidad y la redundancia necesarias para las operaciones de intercepción en aguas abiertas. La consola blindada proporciona protección crítica sin comprometer el rendimiento.
      icon: tabler:shield
