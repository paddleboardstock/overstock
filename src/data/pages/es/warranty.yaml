label: Garantía
headline: Paddle Board Overstock Garantía limitada del fabricante
subtitle: Paddle Board Overstock Respalda la calidad de cada SUP tabla hinchable que fabricamos. Esta Garantía Limitada establece los términos y la cobertura de tu Paddle Board Overstock tabla.
seo:
  headline: Paddle Board Overstock SUP Garantía — Garantía Limitada de 2 Años | Paddle Board Overstock
  description: Paddle Board Overstock Ofrece una garantía limitada de 2 años que cubre drop-stitch juntas, construcción de los raíles, válvulas de inflado y accesorios incluidos en cada SUP placa. Términos y condiciones completos.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Esta Garantía Limitada se aplica a Paddle Board Overstock SUP las nuevas tablas hinchables de marca compradas directamente en la Paddle Board Overstock tienda online. La fecha de vigencia es la fecha verificable de la compra original.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Cobertura y duración de la garantía</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 años</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Núcleo y estructura de la cubierta</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 años</h3>
          <p class="text-sm text-gray-600 mt-1">Construcción de raíles y vetas</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 años</h3>
          <p class="text-sm text-gray-600 mt-1">Funcionalidad de la válvula de inflado</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 años</h3>
          <p class="text-sm text-gray-600 mt-1">Accesorios incluidos (bomba, pala, correa, aleta)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 año*</h3>
          <p class="text-sm text-gray-600 mt-1">Uso comercial, de alquiler o de flota — todos componentes</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*El uso comercial, de alquiler o de flota reduce la garantía a 1 año. El uso en competición o en competición anula completamente la garantía.</p>
    </div>

    <h2>Lo que se cubre</h2>
    <h3>Drop-Stitch Núcleo y estructura de cubierta (2 años)</h3>
    <p>El drop-stitch núcleo interno y la estructura exterior de la placa están garantizados contra defectos de fabricación que comprometen la capacidad de la placa para mantener la inflación y rigidez operativas.</p>

    <h3>Construcción de Ferrocarril y Costura (2 años)</h3>
    <p>Las juntas y las bandas de triple capa, cuando se unieron durante la fabricación, están garantizadas contra defectos de fabricación que resulten en una fuga considerable de aire a través de la junta. La inspección periódica y el mantenimiento de presiones de inflado adecuadas son condiciones de cobertura.</p>

    <h3>Funcionalidad de la válvula de inflado (2 años)</h3>
    <p>Las válvulas de inflado de aire instaladas Paddle Board Overstock originalmente por están garantizadas contra defectos de fabricación en materiales o mano de obra que impiden que la válvula retenga el aire según el diseño.</p>

    <h3>Accesorios incluidos (2 años)</h3>
    <p>La bomba, la paleta ajustable, la correa, la aleta extraíble y otros componentes incluidos en tu paquete de tabla están protegidos contra defectos de materiales y mano de obra.</p>

    <h2>Lo que no se cubre</h2>
    <ul>
      <li>Defectos cosméticos como decoloración, manchas, desvanecimiento, tiza o cualquier alteración en su apariencia</li>
      <li>Pinchazos, cortes, desgarros, desgarros u otros daños físicos</li>
      <li>Grietas, grietas, abrasiones, raspaduras o deterioro por fricción o contacto</li>
      <li>Degradación por UV exposición a la luz, meteorización o condiciones atmosféricas</li>
      <li>Daños por contacto con disolventes, ácidos, álcalis o productos químicos</li>
      <li>Daños por negligencia, uso indebido, abuso, accidente o desgaste normal</li>
      <li>Daños por impacto, tensión, soporte inadecuado o transporte</li>
      <li>Daños por inflación/deflación incorrecta o uso de dispositivos de inflado no aprobados</li>
      <li>Equipos, componentes o sistemas de terceros (cubiertos por sus respectivos fabricantes)</li>
    </ul>

    <h2>Obligación y recurso del fabricante</h2>
    <p>La única y exclusiva obligación de Paddle Board Overstock es la reparación o el reemplazo, a elección de Paddle Board Overstock, de cualquier componente que se determine defectuoso en materiales o mano de obra y que esté cubierto por esta garantía. Las reparaciones o reemplazos son realizados por Paddle Board Overstock o su centro de servicio designado. Los componentes reparados o reemplazados están garantizados únicamente por la parte no vencida del período de garantía original.</p>

    <h2>Condiciones de la garantía</h2>
    <ul>
      <li><strong>Mantenimiento:</strong>El producto debe mantenerse de acuerdo con las directrices publicadas por Paddle Board Overstock, incluyendo la inspección periódica y mantenimiento de las presiones de inflado adecuadas.</li>
      <li><strong>Cooperación:</strong>El comprador debe cooperar total y puntualmente con Paddle Board Overstock en todos los asuntos relacionados con reclamaciones de garantía.</li>
      <li><strong>Comprador original:</strong>Esta garantía se extiende exclusivamente al comprador final original y no es transferible.</li>
    </ul>

    <h2>Uso comercial</h2>
    <p>Si el producto se usa con fines comerciales, de alquiler o para flotas, el período de garantía de todos los componentes se reduce a un (1) año desde la fecha de compra original. El uso en carreras, velocidad o competencias de resistencia anula de inmediato e irrevocablemente la garantía en su totalidad.</p>

    <h2>Cómo presentar una reclamación de garantía</h2>
    <p>Contacte a Paddle Board Overstock con el comprobante de compra y una descripción detallada del problema. Paddle Board Overstock revisará la reclamación y proporcionará instrucciones para la inspección y el servicio.</p>
    <p>Para consultas sobre el servicio de garantía, por favor contáctenos a través de nuestra<a href="/contact" class="text-sky-600 underline">página de contacto</a>con su número de pedido y detalles del producto.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Esta declaración de garantía es un resumen de la Garantía Limitada del Fabricante de Paddle Board Overstock. El documento legal completo de la garantía rige todos los términos y condiciones de la garantía. Las especificaciones están sujetas a cambios sin previo aviso. Paddle Board Overstock es una marca de fábrica del Centro de Manufactura Paddle Board Overstock Weihai.
    </p>
