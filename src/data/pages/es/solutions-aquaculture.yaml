content_challenge:
  tagline: El desafío
  title: La acuicultura exige<br />Equipos resistentes al agua salada
  subtitle: 'Las piscifactorías, las granjas de perlas y los ranchos oceánicos operan en el ambiente marino químicamente más agresivo: exposición prolongada al agua salada, residuos de combustible y alimento, y uso diario continuo.'
  paragraphs:
    - Las operaciones de acuicultura funcionan 365 días al año en entornos costeros expuestos y en alta mar. Las embarcaciones de trabajo utilizadas para la inspección de jaulas, el transporte de alimento, el mantenimiento de las líneas de perlas y la atención de equipos enfrentan una inmersión constante en agua salada, la exposición a los UV y el contacto químico con combustibles, alimento para peces y tratamientos antifouling.
    - '**La corrosión es el enemigo principal** — El equipo marino estándar se deteriora rápidamente en estas condiciones. Los motores fueraborda, los chasis de los remolques y los herrajes del casco requieren reemplazo constante. Los operadores necesitan embarcaciones construidas con materiales resistentes a la corrosión que soporten años en este entorno sin degradarse.'
    - '**La fiabilidad diaria es fundamental** — Una embarcación de trabajo averiada significa horarios de alimentación incumplidos, cosechas retrasadas y costosas pérdidas de producción. En las granjas de perlas, un solo día de inspección omitida puede significar daños significativos en la cosecha. En las granjas de peces, una alimentación retrasada afecta los ritmos de crecimiento y la rentabilidad.'
    - Los RIB de acuicultura de Paddle Board Overstock están diseñados con herrajes resistentes a la corrosión, tubos Hypalon de alta resistencia y cascos reforzados concebidos específicamente para las condiciones exigentes de la piscicultura, el cultivo de perlas y la crianza oceánica.
content_solution:
  tagline: Nuestra solución
  title: RIB especialmente diseñadas<br />Para la industria de la acuicultura
  subtitle: Cada barco de trabajo para acuicultura Paddle Board Overstock está diseñado para resistir ambientes agresivos de agua salada y, al mismo tiempo, ofrecer un rendimiento diario confiable.
  list:
    - Tubos Hypalon de calidad marina — resistencia superior a los UV, al agua salada, a los combustibles y a los productos químicos del alimento para peces
    - Herrajes de acero inoxidable 316 en todo el barco — sin óxido en exposición prolongada al agua salada
    - Cintones de frote reforzados y protector de quilla para el contacto repetido con muelles y jaulas
    - Cubierta autovaciante para lavado y drenaje sencillos tras el transporte de alimento y las operaciones de cosecha
    - Configuración de cubierta plana para transportar sacos de alimento, cajas de cosecha y equipos
    - Configuraciones de fueraborda de 15 a 60 CV — optimizadas para el equilibrio entre carga útil y eficiencia de combustible
    - Opciones de colores de tubos de alta visibilidad para localizarlos fácilmente en grandes áreas de granja
content_segments:
  tagline: Perfiles de acuicultura
  title: Soluciones de embarcaciones de trabajo<br />Por tipo de acuicultura
  subtitle: Las diferentes operaciones de acuicultura tienen diferentes requisitos de embarcaciones de trabajo, desde pequeñas y ágiles embarcaciones neumáticas para la inspección de jaulas de peces hasta plataformas de transporte estables para el cultivo de perlas y embarcaciones de trabajo pesadas para la cría en granjas en el océano.
  items:
    - title: Operaciones de piscicultura
      subtitle: Inspección de jaulas, transporte de alimento, apoyo a la cosecha.
      description: 'Las piscifactorías marinas operan jaulas en lugares costeros y marinos expuestos. Los botes de trabajo se utilizan diariamente para la inspección de redes de jaulas, operaciones de alimentación, apoyo a la cosecha y mantenimiento de equipos. El principal desafío es la corrosión: los barcos están constantemente expuestos al agua salada, a los residuos de alimento para peces y al combustible. Un barco de trabajo confiable es esencial porque la falta de alimentación o el retraso en la cosecha afectan directamente la producción y la rentabilidad.'
      features:
        - 'Paquete para entornos agresivos: herrajes de acero inoxidable 316, componentes de aleación de calidad marina'
        - Distribución de cubierta plana para el transporte de sacos de alimento y cajas de cosecha
        - Cubierta autovaciante para un lavado sencillo después de las operaciones
        - Tubos Hypalon con recubrimiento resistente a productos químicos para la exposición al alimento y los combustibles
        - Cintones de frote reforzados para el contacto frecuente con jaulas y muelles
    - title: Operaciones de cultivo de perlas
      subtitle: Transporte estable para inspección y recolección de líneas de perlas.
      description: Las granjas de perlas requieren barcos de trabajo estables y confiables para el transporte diario entre líneas de perlas, la inspección de redes para ostras y la recolección de cosechas. Estas operaciones se realizan en ubicaciones costeras remotas con infraestructura de mantenimiento limitada. El barco debe ser lo suficientemente estable para que la tripulación pueda trabajar mientras inspecciona las líneas de perlas, con fácil acceso y amplio espacio en cubierta para transportar ostras cosechadas, redes y suministros. La confiabilidad y el fácil mantenimiento son críticos en ubicaciones agrícolas remotas.
      features:
        - Diseño de casco estable para la tripulación de pie durante la inspección de las líneas de perlas
        - Cubierta plana con superficie antideslizante para movimientos seguros de la tripulación
        - Borda baja para un acceso fácil a las redes de ostras y a la cosecha
        - Configuración de fueraborda sencilla para un mantenimiento fácil in situ
        - Conjunto de tubos y herrajes resistentes a la corrosión para exposición continua al agua salada
    - title: Crianza oceánica y mejora marina
      subtitle: Transporte de juveniles, mantenimiento de jaulas, apoyo al seguimiento.
      description: Las operaciones de cría en granjas en el océano implican la liberación de poblaciones juveniles en entornos marinos gestionados, el seguimiento del crecimiento y el mantenimiento de estructuras de mejora. Los barcos de trabajo deben transportar juveniles vivos en contenedores aireados, llevar equipo de monitoreo y acceder a sitios de liberación costeros poco profundos. El diseño del casco debe equilibrar la capacidad de carga con un calado poco profundo para el acceso a la playa y al estuario.
      features:
        - Espacio de cubierta para contenedores de transporte aireado de alevines y equipos de seguimiento
        - Calado bajo para acceder a los sitios de suelta en playas y estuarios
        - Varada fácil en la playa — quilla reforzada y protección de proa
        - Puntos de anclaje para la electrónica de seguimiento y los equipos de muestreo
        - Tubos Hypalon de alta resistencia para mayor durabilidad en condiciones mixtas de arena y agua de mar
