hero:
  tagline: Paddle Board Overstock Academia
  title: Centro de Aprendizaje
  subtitle: Guías y tutoriales para todos los niveles de habilidad — desde SUP lo básico hasta técnicas avanzadas de rescate
categories:
  - level: Principiante
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Conceptos básicos
        desc: 'Aprende los fundamentos del paddleboarding de pie: postura, técnica de brazada y equilibrio.'
        slug: beginner-sup-guide
      - title: Técnicas de remo
        desc: Golpe hacia adelante, barrido, golpe de estirado y refuerzo bajo — domina los movimientos esenciales de la pala.
        slug: sup-paddle-guide
      - title: La seguridad es lo primero
        desc: Prácticas esenciales de seguridad que incluyen revisiones meteorológicas, PFD uso, normas de correa y auto-rescate.
        slug: sup-safety-guide
  - level: Intermedio
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Imprescindibles para giras
        desc: Planificar remadas de varias horas — navegación, hidratación, ritmo y lectura de pronósticos de viento.
        slug: touring-sup-guide
      - title: Lectura del tiempo
        desc: Interpreta las previsiones marinas, identifica patrones de nubes y entiende los efectos del viento sobre el agua.
        slug: weather-planning-water-sports
      - title: Fundamentos de la navegación
        desc: Lectura de cartas, uso de brújula, puntos GPS y planificación de rutas para el remo costero.
        slug: sup-navigation-guide
      - title: Conciencia de las Mareas
        desc: Entender los ciclos de mareas, las corrientes y cómo afectan al momento y la ruta de lanzamiento.
        slug: understanding-tides
  - level: Avanzado
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planificación de viajes de varios días
        desc: Logística de expediciones — selección de equipo, planificación de alimentos, protocolos de seguridad y contactos de emergencia.
        slug: sup-travel-guide
      - title: Técnicas de rescate
        desc: Auto-rescate, T-rescue y protocolos de remolque para aguas abiertas.
        slug: sup-self-rescue
      - title: Remo nocturno
        desc: Navegación después del anochecer — requisitos de iluminación, memoria de rutas, comunicación grupal y conciencia de peligros.
        slug: sup-navigation-guide
  - level: Mantenimiento
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Limpieza y cuidado
        desc: Enjuague en agua dulce, UV protección, prevención de hongos y técnicas adecuadas de secado después de cada sesión.
        slug: inflatable-sup-maintenance
      - title: Guía de almacenamiento
        desc: Mejores prácticas para almacenar tablas inflables — desinflado, plegado, control de temperatura y vida útil.
        slug: inflatable-sup-storage
      - title: Conceptos básicos de reparación
        desc: Repara pequeños pinchazos, fugas en las costuras y problemas con la válvula con kits de reparación PVC y técnicas de parches.
        slug: inflatable-sup-repair
      - title: Mantenimiento de la válvula
        desc: Identifica los tipos de válvula (Halkey-Roberts, Boston, Leafield), limpia los residuos y reemplaza los vástagos defectuosos.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centro de conocimiento
knowledge_center_title: Guías y conocimientos sobre paddle boards
knowledge_center_subtitle: Guías de expertos y consejos de compra para paddle boarders de todos los niveles.
knowledge_sections:
  - title: Tecnología y construcción de tablas
    tagline: Dentro de tu paddle board
    desc: Cómo se construyen las tablas de paddle inflables — núcleos drop-stitch, capas laminadas, cubiertas EVA, y pruebas de presión en fábrica.
    guides:
      - title: Cómo se fabrican las paddle boards
        desc: Desde el corte de materiales y la laminación hasta las pruebas de presión al 100% — descubre cómo cada tabla sale de la fábrica.
        href: /factory/process
      - title: Tecnología de núcleo Drop-Stitch
        desc: Cómo miles de hilos internos crean una estructura inflable rígida y de alta presión.
        href: /learn/drop-stitch-core
      - title: Referencia de materiales
        desc: Clasificaciones de denier PVC, pesos de tela, resistencia UV y materiales de cubierta explicados.
        href: /learn/materials
      - title: Tecnología de tablas inflables
        desc: Costuras soldadas, construcción del borde y sistemas de válvula que mantienen tu tabla rígida y hermética.
        href: /learn/inflatable-technology
  - title: Guías de compra
    tagline: Elige la tabla correcta
    desc: Todo lo que necesitas para elegir tu primera — o próxima — SUP inflable, desde el tamaño hasta la construcción.
    guides:
      - title: Cómo elegir una SUP inflable
        desc: Los factores clave — construcción, grosor, configuración de aletas y accesorios incluidos.
        href: /guides/how-to-choose-your-sup/
      - title: ¿Qué es el stand-up paddleboarding?
        desc: Una introducción amistosa al deporte, el equipo, y por qué las tablas inflables facilitan el inicio.
        href: /guides/what-is-sup
      - title: Tabla inflable vs tabla rígida
        desc: Compara i SUP y tablas rígidas de epoxi en cuanto a portabilidad, durabilidad, rendimiento y valor.
        href: /compare/inflatable-vs-hardboard
      - title: Guía de tallas SUP
        desc: Encuentra la longitud, anchura y volumen adecuados de la tabla según tu peso, habilidad y estilo de remo.
        href: /size-guide
  - title: Habilidades y Seguridad
    tagline: Rema con Confianza
    desc: 'Conocimiento práctico para cada sesión: conceptos básicos para principiantes, seguridad en el agua, cuidado y reparación.'
    guides:
      - title: SUP Conceptos Básicos — Guía para Principiantes
        desc: 'Todo lo que un principiante necesita saber: tipos de tabla, tamaño del remo, postura y consejos para el primer día.'
        href: /v2/beginner-sup-guide
      - title: Conceptos Esenciales de Seguridad en el Agua
        desc: Revisión del clima, PFD selección, reglas del leash, autorrescate y mejores prácticas para remar en grupo.
        href: /learn/water-safety
      - title: SUP Mantenimiento y Cuidado
        desc: Limpieza, almacenamiento, protección UV y consejos de cuidado para tablas inflables SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Conceptos Básicos de Reparación de Tablas
        desc: Repara pequeños pinchazos, fugas en las costuras y problemas con la válvula con kits de reparación PVC y técnicas de parches.
        href: /v2/inflatable-sup-repair
