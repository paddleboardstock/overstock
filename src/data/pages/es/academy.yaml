hero:
  tagline: Academia Paddle Board Overstock
  title: Centro de aprendizaje
  subtitle: Guías y tutoriales para cada nivel de habilidad — desde los conceptos básicos del SUP hasta técnicas avanzadas de rescate

categories:
  - level: Principiante
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: Fundamentos del SUP
        desc: Aprende los fundamentos del paddle surf — postura, técnica de remada y equilibrio.
        slug: beginner-sup-guide
      - title: Técnicas de remada
        desc: Remada frontal, remada de barrido, remada de arrastre y apoyo bajo — domina los movimientos esenciales de la pala.
        slug: sup-paddle-guide
      - title: La seguridad primero
        desc: Prácticas de seguridad esenciales que incluyen comprobación del tiempo, uso del PFD, normas del leash y autorrescate.
        slug: sup-safety-guide
  - level: Intermedio
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Fundamentos del touring
        desc: Planificación de travesías de varias horas — navegación, hidratación, ritmo y lectura de pronósticos de viento.
        slug: touring-sup-guide
      - title: Lectura del tiempo
        desc: Interpreta los pronósticos marinos, identifica patrones de nubes y comprende los efectos del viento sobre el agua.
        slug: weather-planning-water-sports
      - title: Fundamentos de navegación
        desc: Lectura de cartas, uso de la brújula, waypoints de GPS y planificación de rutas para remar en la costa.
        slug: sup-navigation-guide
      - title: Conciencia de las mareas
        desc: Comprender los ciclos de las mareas, las corrientes y cómo afectan al momento de salida y a la ruta.
        slug: understanding-tides
  - level: Avanzado
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planificación de travesías de varios días
        desc: Logística de expedición — selección de equipo, planificación de comidas, protocolos de seguridad y contactos de emergencia.
        slug: sup-travel-guide
      - title: Técnicas de rescate
        desc: Autorrescate, rescate en T, rescate esquimal para kayaks y protocolos de remolque para aguas abiertas.
        slug: sup-self-rescue
      - title: Remar de noche
        desc: Navegación después del anochecer — requisitos de iluminación, memoria de la ruta, comunicación en grupo y conciencia de los peligros.
        slug: sup-navigation-guide
  - level: Mantenimiento
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Limpieza y cuidado
        desc: Enjuague con agua dulce, protección UV, prevención del moho y técnicas de secado adecuadas después de cada sesión.
        slug: inflatable-sup-maintenance
      - title: Guía de almacenamiento
        desc: Mejores prácticas para almacenar tablas y botes inflables — desinflado, plegado, control de temperatura y vida útil.
        slug: inflatable-sup-storage
      - title: Fundamentos de reparación
        desc: Repara pequeños pinchazos, fugas en las costuras y problemas de válvulas con kits de reparación de PVC y técnicas de parcheo.
        slug: inflatable-sup-repair
      - title: Mantenimiento de válvulas
        desc: Identifica los tipos de válvula (Halkey-Roberts, Boston, Leafield), limpia los residuos y reemplaza los vástagos defectuosos.
        slug: inflatable-sup-repair

knowledge_center_tagline: Centro de conocimiento

knowledge_center_title: Guías de equipamiento náutico y sector marítimo

knowledge_center_subtitle: Conocimiento experto y guías de compra para profesionales náuticos, operadores de flotas y aficionados a los deportes acuáticos.

knowledge_sections:
  - title: Conocimiento sobre RIB
    tagline: Guías de botes semirrígidos
    desc: Todo sobre los RIB — diseño de casco, materiales, selección de motor, mantenimiento y consejos de compra para uso comercial y recreativo.
    guides:
      - title: Cómo elegir el RIB adecuado
        desc: Guía completa para seleccionar un RIB — tamaño, potencia del motor, material del tubo, tipo de casco y uso previsto.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs. bote inflable
        desc: Semirrígido frente a bote inflable tradicional — comparación de diseño de casco, rendimiento, durabilidad y capacidad.
        href: /compare/rib-vs-dinghy
      - title: RIB comercial vs. RIB recreativo
        desc: RIB de grado comercial frente a RIB recreativo — estándares de construcción, materiales, vida útil, coste y certificaciones.
        href: /compare/commercial-vs-recreational-rib
      - title: Casco de aluminio vs. fibra de vidrio
        desc: Comparativa de cascos de aluminio y fibra de vidrio para RIB — peso, coste, durabilidad y resistencia a la corrosión.
        href: /compare/aluminum-vs-fiberglass
  - title: Guía de botes inflables
    tagline: Conocimiento de embarcaciones inflables
    desc: Guías completas sobre botes inflables — PVC vs. Hypalon, métodos de construcción, normas de seguridad y mejores prácticas de mantenimiento.
    guides:
      - title: 'Guía de materiales: PVC vs. Hypalon'
        desc: Comparativa definitiva entre PVC y Hypalon CSM para la construcción de botes inflables.
        href: /compare/pvc-vs-hypalon
      - title: Cómo se fabrican los botes inflables
        desc: Proceso de fabricación — corte de material, soldadura HF, construcción de costuras, ensayo de presión y control de calidad.
        href: /learn/inflatable-technology
      - title: Guía de seguridad para botes inflables
        desc: Normas de seguridad, capacidad de carga, inflado correcto, comprobaciones previas a la salida y procedimientos de emergencia.
        href: /learn/water-safety
      - title: Mantenimiento de botes inflables
        desc: Limpieza, almacenamiento, protección UV, invernalización y reparación de botes inflables y RIB.
        href: /v2/inflatable-boat-maintenance
  - title: Conocimiento náutico
    tagline: Botes inflables y RIB
    desc: Guías técnicas sobre tipos de botes inflables, materiales, métodos de construcción, mantenimiento y seguridad — desde dinghies hasta RIB.
    guides:
      - title: Tipos de botes inflables
        desc: Dinghies, RIB, kayaks y tenders — conozca las diferencias y elija el adecuado.
        href: /v2/inflatable-boat-buying-guide
      - title: Tecnología drop-stitch
        desc: Cómo miles de hilos internos crean estructuras inflables rígidas de alta presión.
        href: /learn/drop-stitch-core
      - title: Referencia de materiales
        desc: Índices denier del PVC, pesos de tejido, resistencia UV y materiales de grado marino explicados.
        href: /learn/materials
      - title: RIB vs. dinghy
        desc: Comparativa entre semirrígidos y dinghies inflables tradicionales para distintos casos de uso.
        href: /compare/rib-vs-dinghy
  - title: Conocimiento sobre SUP
    tagline: Guías de paddle surf
    desc: Todo sobre las tablas de SUP — inflable vs. rígida, dimensiones, tecnología de materiales y consejos de expertos para todos los niveles.
    guides:
      - title: SUP inflable vs. rígido
        desc: Comparativa entre iSUP y tablas rígidas de epoxi — portabilidad, durabilidad, rendimiento y relación calidad-precio.
        href: /learn/sup
      - title: Guía de dimensiones del SUP
        desc: Cómo afectan el largo, el ancho y el grosor a la estabilidad, la velocidad y la maniobrabilidad.
        href: /learn/sup
      - title: Mantenimiento y cuidado del SUP
        desc: Consejos de limpieza, almacenamiento, protección UV y reparación para tablas de SUP inflables.
        href: /v2/inflatable-sup-maintenance
      - title: Elegir su primer SUP
        desc: Guía para principiantes sobre cómo seleccionar la tabla de paddle adecuada según su peso, nivel y uso previsto.
        href: /learn/sup
  - title: Guía de equipos de buceo
    tagline: Conocimiento de botes de buceo comerciales
    desc: Guías especializadas sobre botes de buceo, RIB de buceo y equipamiento para centros de buceo, operadores y equipos de buceo comercial.
    guides:
      - title: El mejor RIB para centros de buceo
        desc: Cómo elegir el RIB de buceo adecuado para su centro — capacidad, configuración y presupuesto.
        href: /solutions-diving-center-boats
      - title: Guía de configuración de RIB de buceo
        desc: Características esenciales de los RIB de buceo — portabotellones, escaleras, plataforma de buceo y almacenamiento de equipo.
        href: /solutions-diving-center-boats
  - title: Guía de tenders para yates
    tagline: Soluciones de tender para superyates y ámbito náutico
    desc: Guías para elegir el tender perfecto — tenders inflables, tenders RIB, soluciones de almacenamiento y accesorios.
    guides:
      - title: Cómo elegir un tender para yacht
        desc: Factores a considerar al seleccionar un tender para su yate — tamaño, material, motor y almacenamiento.
        href: /solutions-yacht-tender-solutions
      - title: Tenders inflables vs. RIB
        desc: Comparativa entre tenders inflables y tenders semirrígidos en rendimiento, durabilidad y facilidad de estiba.
        href: /compare/rib-vs-dinghy
  - title: Guía de equipos de rescate
    tagline: Conocimiento de embarcaciones de búsqueda y rescate
    desc: Guías profesionales sobre botes de rescate, embarcaciones SAR y equipos de respuesta a emergencias para guardacostas, socorristas y equipos de ayuda humanitaria.
    guides:
      - title: Guía de selección de botes SAR
        desc: Cómo elegir el bote de búsqueda y rescate adecuado — velocidad, capacidad, durabilidad y requisitos de equipamiento especializado.
        href: /solutions-rescue-watercraft
      - title: RIB comercial para operaciones de rescate
        desc: Por qué los RIB de grado comercial son la opción preferida de los equipos profesionales de búsqueda y rescate en todo el mundo.
        href: /use-cases/search-and-rescue

