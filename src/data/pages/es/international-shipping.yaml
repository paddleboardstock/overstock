hero:
  tagline: Transporte marítimo internacional
  title: Transporte internacional —<br />Transporte exprés y marítimo a 50+ países
  subtitle: Cada pedido se envía desde nuestra base logística en Weihai, China. Elige transporte aéreo exprés para muestras y reposiciones urgentes, o transporte marítimo consolidado para pedidos mayoristas de pequeñas empresas.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Tablas empaquetadas para envíos internacionales
direct_answer: Paddle Board Overstock envía a más de 50 países desde Weihai, China. El transporte aéreo exprés transporta de 1 a 3 tableros, pedidos de muestra y reposiciones urgentes; el transporte marítimo consolidado es la opción económica para 5 a 20 pedidos mayoristas de tablero. Cada envío incluye seguimiento puerta a puerta, y cada cartón está 100% probado a presión y empaquetado con su kit completo de accesorios antes del envío.
tldr_points:
  - 'Transporte aéreo exprés: 1–3 tablas, muestras, reposiciones urgentes — opción más rápida'
  - 'Transporte marítimo: 5–20 pedidos mayoristas a bordo — coste de envío por embarcación más bajo'
  - Seguimiento puerta a puerta en cada envío a 50+ países
  - El flete, el seguro, el despacho aduanero y los derechos de importación se detallan en tu presupuesto — sin promesas vagas de todo incluido
from_china:
  tagline: Envío desde China
  title: De dónde se envían los pedidos
  description: Todos los pedidos se envían desde nuestra base logística en Weihai, China, el corazón de nuestra operación de producción y almacenamiento. Weihai es una importante ciudad portuaria costera en la provincia de Shandong con conexiones directas de carga marítima y aérea, lo que mantiene los tiempos de tránsito y los costes de transporte competitivos respecto a destinos en Asia, América, África, Europa y Oriente Medio.
modes_section:
  tagline: Dos opciones
  title: Envío exprés o transporte marítimo
  subtitle: El método de envío adecuado depende de la rapidez con la que necesites las placas y de cuántas estés pidiendo. Ambas opciones se cotizan en cada consulta.
  express:
    name: Opción A — Envío exprés
    best_for: Ideal para 1–3 tablas, muestras y reposiciones urgentes
    description: Air Express recibe pequeños pedidos y paneles de muestras en tu puerta en días, no en semanas. Ideal cuando pruebas un modelo antes de un pedido mayor o repones un superventas a mitad de temporada.
    features:
      - 1–3 placas, modelos individuales o muestras mixtas
      - El tránsito más rápido de las dos opciones — cotizado por destino
      - Seguimiento puerta a puerta con una gran compañía expresa
      - 'Uso típico: muestras, reposiciones urgentes, pequeños pedidos iniciales'
  sea:
    name: Opción B — Transporte marítimo
    best_for: Mejor para 5–20 pedidos mayoristas y minoristas de tablero
    description: El transporte marítimo consolidado es la opción económica para pedidos mayoristas de pequeñas empresas. Los tableros se empaquetan juntos en un único envío consolidado desde Weihai, manteniendo bajo el coste de envío por tablón.
    features:
      - 5–20 pedidos de venta al por mayor y de junta
      - El coste de transporte por tabla más bajo de las dos opciones
      - Empaquetado consolidado — un envío, una despeje
      - 'Uso típico: reposiciones estacionales, pedidos mayoristas de modelos mixtos'
