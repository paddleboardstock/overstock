process_section:
  tagline: Cómo Funciona el Envío
  title: Desde Nuestro Almacén Hasta Tu Puerta
  steps:
    - title: Cotización con Opciones de Flete
      description: Cada cotización detalla las opciones de flete para tu destino — exprés y marítimo — con tiempos de tránsito estimados, para que nada se decida por ti.
    - title: Revisión de Calidad y Empaque
      description: Las tablas se prueban al 100% de presión y luego se empaquetan con bomba, remo, leash, quilla, mochila y kit de reparación — el mismo paquete completo que vendemos al por menor.
    - title: Despacho Desde Weihai
      description: Tu envío sale de nuestra base logística con el método de flete que elegiste y el seguimiento puerta a puerta se comparte contigo el mismo día.
    - title: Desaduanaje
      description: Proporcionamos la factura comercial y la lista de empaque que necesitas para la importación. Los aranceles e impuestos de importación en tu país son responsabilidad del importador — consulta la sección de aduanas a continuación.
    - title: Entrega e Inspección
      description: Inspecciona tu entrega al llegar. Si algo está dañado o falta, contáctanos con fotos y tu número de pedido — consulta nuestra política de pérdidas y daños a continuación.
customs_section:
  tagline: Aduanas e Impuestos
  title: Derechos de Aduana e Impuestos de Importación
  subtitle: Mantenemos las responsabilidades de flete explícitas en lugar de hacer promesas vagas. Aquí está exactamente quién es responsable de qué.
  items:
    - title: Lo que Cubrimos
      description: Tu cotización incluye el costo de flete hasta tu destino, y preparamos y proporcionamos todos los documentos de exportación — factura comercial, lista de empaque y seguimiento del envío.
    - title: Lo que Cubre el Importador
      description: Los aranceles de importación, IVA/GST y cualquier impuesto en el país de destino deben ser pagados por el importador (tú o tu negocio) según las reglas de tu país. No incluimos promesas vagas de impuestos en nuestras cotizaciones de flete.
    - title: Soporte para Desaduanaje
      description: Nuestra documentación es completa y coherente — códigos HS correctos, valores declarados y especificaciones del tablero — lo que mantiene la autorización fluida. Si tu agente o oficina de aduanas necesita documentación adicional, la proporcionamos.
    - title: Consulta tus tarifas locales antes de hacer el pedido
      description: 'Los tipos de arancel sobre equipos de deportes acuáticos inflables varían según el país. Consulta las normas de importación de tu país o pregunta en tu consulta: nuestras guías de mercados regionales incluyen notas aduaneras para los mercados clave.'
lost_damaged:
  title: Envíos perdidos o dañados
  description: Inspecciona tu entrega cuando llegue. En el raro caso de que una placa llegue dañada o falte un paquete, contáctanos lo antes posible con tu número de pedido y fotos claras del embalaje y de la placa. Evaluamos cada caso individualmente — dependiendo del caso, eso significa una pieza de repuesto, una placa de repuesto o un reembolso del artículo afectado. Los defectos de fabricación están cubiertos por separado por nuestra Garantía de 2 SUP Años.
destinations_section:
  tagline: Dónde Enviamos
  title: 50+ países y contando
  description: Enviamos a todo el mundo, con guías detalladas para nuestros principales mercados regionales. Cada guía de mercado cubre tipos de clientes locales, notas de envío y consejos aduaneros para esa región.
  regions_label: Guías regionales
  countries_label: Guías de País
faq_section:
  title: Preguntas frecuentes sobre envíos
  items:
    - q: ¿Cuánto tarda el envío exprés?
      a: 'El tiempo de tránsito exprés depende del destino: en cada consulta indicamos el tiempo estimado de tránsito para tu país antes de que te comprometas con cualquier cosa.'
    - q: ¿Cuánto tarda el transporte marítimo?
      a: El transporte marítimo de mercancías varía según el puerto de destino y los horarios de navegación. Damos un plazo estimado para tu destino junto con tu pedido, y recibirás seguimiento una vez que el envío se va.
    - q: ¿Qué método de envío debo elegir?
      a: Envío exprés para 1–3 placas, muestras o reposiciones urgentes. Transporte marítimo para 5–20 pedidos mayoristas de tablero, donde el coste por tabla importa más que la rapidez. Damos cotizaciones para que puedas comparar.
    - q: ¿Se incluyen los derechos y los impuestos de importación en el coste de envío?
      a: No. El transporte se cotiza por separado y los derechos de importación, el IVA/GST y los impuestos de destino son responsabilidad del importador según las normas de tu país. Proporcionamos documentación completa y precisa para que el desaloje sea fluido.
    - q: ¿Hacen envíos a mi país?
      a: Enviamos a 50+ países. Consulta nuestras guías regionales y por países a continuación, o simplemente pregunta en tu consulta — confirmaremos el servicio actual a tu dirección.
    - q: ¿Puedo registrar mi pedido?
      a: Sí. Cada envío — exprés o marítimo — incluye seguimiento puerta a puerta que compartimos contigo el día del envío.
