how_to_choose:
  title: Cómo Elegir el Tamaño Correcto
  cards:
    - title: Tablas SUP Todo Terreno
      description: Nuestras tablas todo terreno de ~11 pies (32" de ancho, 6 pulgadas drop-stitch) equilibran estabilidad, velocidad y capacidad. Ajusta el volumen de la tabla a tu peso; los remeros más pesados necesitan más volumen.
    - title: Ancho y Grosor
      description: Las tablas más anchas (32"+) ofrecen más estabilidad para principiantes, yoga y pesca. Grosor de 6 pulgadas a 15 PSI mantiene la cubierta rígida bajo el remero y el equipo.
    - title: Paquetes y Accesorios
      description: 'Cada tabla se envía como un paquete completo: tabla, mochila de viaje, bomba de mano, remo ajustable, aleta desmontable, correa en espiral y kit de reparación. Verifique la carga máxima para el usuario más el equipo.'
