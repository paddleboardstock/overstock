hero:
  title: Guía de tallas y especificaciones
  subtitle: Dimensiones, capacidades y usos recomendados para cada producto Paddle Board Overstock.

categories:
  inflatable: SUPs y kayaks inflables diseñados para portabilidad sin sacrificar rendimiento. Elija la talla adecuada según su peso y estilo de remado.
  rib: Botes inflables de casco rígido para navegación costera, patrullaje y operaciones marinas profesionales. Elija según la longitud y capacidad del motor.
  accessory: Accesorios y equipos de seguridad para complementar su embarcación. Tallas universales con múltiples opciones.

