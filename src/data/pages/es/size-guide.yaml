how_to_choose:
  title: Cómo elegir la talla correcta
  cards:
    - title: Tablas SUP
      description: Elija la longitud según su peso y uso previsto. Las tablas más anchas (32"+) ofrecen más estabilidad. Las tablas más largas (11-12 pies) trackean mejor para touring. Los remeros más pesados necesitan tablas de mayor volumen.
    - title: Kayaks
      description: Los kayaks individuales (9 pies) son mejores para viajes en solitario y ríos. Los kayaks tándem (12 pies) acomodan a dos remeros o un adulto con equipo. Verifique la capacidad de peso para la carga total incluyendo equipo.
    - title: Dinghies y RIBs
      description: Elija la longitud del dinghy según el número de pasajeros y el uso previsto. Los RIB más grandes (4,5 m+) son adecuados para alta mar y rescate. Los dinghies más pequeños (2,7 m) funcionan como tender y plataformas de pesca.
