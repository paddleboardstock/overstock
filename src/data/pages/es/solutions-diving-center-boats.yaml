content_dive_resorts:
  tagline: Para resorts de buceo
  title: RIB de buceo premium<br />para operaciones de hospitalidad de resort
  subtitle: RIB de buceo de lujo diseñados para la comodidad de los huéspedes, la imagen de marca y la capacidad en temporada alta — donde la experiencia a bordo importa tanto como la propia inmersión.
  paragraphs:
    - Los resorts de buceo son fundamentalmente distintos de los centros de buceo comerciales. Sus huéspedes son turistas que pagan por una experiencia premium completa — y el bote es una parte clave de esa experiencia. Un bote de trabajo funcional de aspecto industrial o incómodo crea un vacío notable entre la calidad del resort y la experiencia en el agua.
    - '**El problema de la brecha de experiencia** — Un huésped que se hospeda en una suite de cinco estrellas con alta cocina y servicio profesional no debería subir a un bote de aluminio envejecido con bancos duros y sin sombra. Ese contraste daña la percepción de lujo que su resort ha construido con cuidado. El bote no es solo transporte — es una extensión móvil de su marca.'
    - '**La imagen de marca como ventaja competitiva** — Cada salida de buceo es un punto de contacto con la marca. Un RIB premium con los colores personalizados del resort, logotipos integrados y tapicería coordinada se convierte en un embajador de marca flotante. Los huéspedes lo fotografían, lo comparten en redes sociales y lo recuerdan. En destinos competitivos como Maldivas, Bali o el Caribe, la calidad del bote puede ser un factor decisivo para reservas repetidas.'
    - '**La comodidad impulsa la satisfacción y las reseñas** — Los trayectos largos hasta los puntos de buceo bajo el calor tropical deben ser placenteros, no agotadores. Asientos premium con respaldos ergonómicos, protección tipo T-top o bimini, embarque suave mediante escaleras de buceo anchas y una plataforma estable en reposo influyen directamente en las puntuaciones de satisfacción, las reseñas en línea y las tasas de retorno. Los huéspedes VIP, los viajeros mayores y las familias son especialmente sensibles a la comodidad.'
    - '**Capacidad e ingresos en temporada alta** — En temporada alta (Navidad, vacaciones de primavera, verano), las operaciones de buceo pueden realizar de 4 a 6 salidas diarias con grupos de huéspedes encadenados. Necesita un bote capaz de soportar esa intensidad sin comprometer la experiencia. Rotaciones rápidas, operación fiable y tiempos de parada mínimos repercuten directamente en los ingresos y la reputación. Una sola avería del bote en la semana pico puede costar decenas de miles en reservas perdidas.'
    - '**La personalización como diferenciador** — Los RIB de buceo premium de Aquafarer son totalmente personalizables: esquemas de color y grafismos de casco con la marca del resort, colocación personalizada de logotipos, tapicería premium en los colores del resort, opciones de T-top o bimini, sistemas de sonido marinos premium, cubiertas de EVA antideslizantes estilo teca, almacenamiento integrado de botellones y escaleras de buceo anchas con pasamanos. Su bote se convierte en una parte integrada de la experiencia del resort.'
    - '**El argumento de negocio** — Un RIB premium cuesta más al principio, pero genera retornos mediante una mayor satisfacción de los huéspedes, una percepción de marca más sólida, más reservas repetidas, la posibilidad de aplicar tarifas premium, menos paradas por mantenimiento y una vida útil más larga en condiciones de agua salada tropical. Es una inversión en la experiencia del huésped, no un gasto operativo.'
content_diving_profiles:
  tagline: Perfiles de centros de buceo
  title: Tipos de centros de buceo<br />para los que construimos
  subtitle: Las distintas operaciones de buceo exigen configuraciones de bote diferentes. Adaptamos cada RIB a las necesidades específicas de su negocio de buceo.
  items:
    - title: Escuelas de buceo & centros de formación
      subtitle: Buceo recreativo, cursos de certificación, salidas turísticas diarias
      description: Estos centros operan todo el año en destinos tropicales, con varias salidas diarias para turistas internacionales y alumnos en certificación. El bote es el centro de la operación diaria — debe soportar cargas pesadas de equipo, embarques frecuentes de pasajeros y largas horas en agua salada. Cada hora de inactividad supone inmersiones canceladas e ingresos perdidos.
      features:
        - Cubierta de trabajo amplia para 10-20 botellones, chalecos y equipo de pasajeros
        - Escalera de buceo ancha con pasamanos de acero inoxidable para un embarque fácil
        - Tubos de Hypalon extra anchos para una plataforma estable en la entrada y salida de buceadores
        - Superficie de cubierta de EVA antideslizante para seguridad con la cubierta mojada
        - Configuraciones de motor de 4 tiempos de bajo consumo para operar 200+ días al año
        - Construcción de PVC o Hypalon de uso intensivo para durabilidad en agua salada tropical
        - Soportes para botellones integrados en el diseño de la cubierta, no añadidos a posteriori
    - title: Operadores de buceo comerciales e industriales
      subtitle: Mantenimiento portuario, inspección subacuática, ingeniería marina
      description: Estos operadores profesionales trabajan en proyectos de infraestructura marítima — inspección portuaria, reparación subacuática, tendido de cables e ingeniería costera. Su bote es una plataforma de trabajo móvil, no solo transporte. La tripulación necesita espacio para herramientas, equipos de inspección y sistemas de buceo. La fiabilidad es crítica porque los plazos de proyecto son fijos y los retrasos resultan costosos.
      features:
        - Estabilidad mejorada para condiciones de trabajo seguras en aguas abiertas
        - Casco reforzado para cargas pesadas de equipo y operaciones frecuentes
        - Cubierta abierta amplia configurada para almacenamiento de herramientas y preparación de equipo
        - Asientos profesionales para el confort de la tripulación en operaciones offshore prolongadas
        - Opciones de redundancia de motor para seguridad operativa
        - Suite de navegación completa con GPS, sónar y equipos de comunicación
        - Configuraciones personalizadas de plataforma y escalera de buceo para uso industrial
    - title: Apoyo a liveaboards & tenders de expedición
      subtitle: Safaris de buceo de varios días, expediciones a atolones remotos, apoyo a la investigación
      description: 'Los operadores de liveaboard y los equipos de expedición necesitan RIB compactos y fiables que se boten y recojan a diario. Estos botes actúan como tenders de los barcos nodriza: trasladan buceadores a los arrecifes, transportan equipo y brindan apoyo de emergencia en lugares remotos. Deben ser lo bastante robustos para travesías en aguas abiertas y lo bastante compactos para guardarse en cubierta.'
      features:
        - Diseño compacto (4,5-5,5 m) para botadura con pescante y almacenamiento en cubierta
        - Casco reforzado para varadas frecuentes en playa y navegación entre arrecifes
        - Puntos de izado de uso intensivo para operaciones diarias con grúa o pescante
        - Escalera de buceo de perfil bajo para una entrada y salida fáciles del agua
        - Materiales de tubo duraderos resistentes a la exposición prolongada al sol y a la sal
        - Autonomía para 50+ millas náuticas entre repostajes
        - Opciones de tubo de inflado/desinflado rápido para un almacenamiento eficiente
    - title: Operaciones de resorts de buceo y hospitalidad
      subtitle: Buceo desde el resort, servicios para huéspedes VIP, traslados entre islas
      description: Estos operadores atienden a turistas que esperan una experiencia premium. El bote debe equilibrar eficiencia operativa, comodidad del huésped y presentación de marca. A diferencia de los operadores puramente comerciales, los centros de buceo de resort necesitan botes que luzcan bien, naveguen cómodos y reflejen la calidad del establecimiento — sin dejar de afrontar con fiabilidad la operación diaria de buceo.
      features:
        - Asientos premium con respaldos ergonómicos para la comodidad del huésped
        - Protección T-top o bimini frente a la exposición al sol tropical
        - Esquemas de color personalizados e integración de logotipo acordes a la marca del resort
        - Escalera de buceo ancha con pasamanos para el embarque fácil de los huéspedes
        - Cubierta de EVA estilo teca para un aspecto premium y seguridad antideslizante
        - Configuración de motor silenciosa para una molestia mínima por ruido
        - Almacenamiento refrigerado integrado para bebidas y toallas de los huéspedes
content_segments:
  tagline: Perfiles de resorts de buceo
  title: Tipos de resorts a los que servimos<br />con soluciones RIB a medida
  subtitle: Cada resort de buceo es diferente. Diseñamos configuraciones RIB en torno a su tipo de resort, perfil de huéspedes y entorno operativo.
  items:
    - title: Resorts de buceo insulares de lujo
      subtitle: Maldivas, Fiyi, Bora Bora, Caribe
      description: Estos resorts atienden a viajeros de alto poder adquisitivo que esperan que cada detalle refleje lujo. El bote debe estar a la altura de la propiedad — colores personalizados del resort, branding integrado, asientos premium y protección solar completa son innegociables. Los huéspedes suelen fotografiar el bote para redes sociales, lo que lo convierte en un activo de marca visible.
      features:
        - Color de casco y grafismos totalmente personalizados, acordes a la identidad visual del resort
        - Tapicería premium coordinada con la paleta cromática del resort
        - Protección solar T-top o hardtop con sistema de altavoces integrado
        - Escalera de buceo ancha con pasamanos para embarcar fácilmente en atuendo de resort
        - Almacenamiento refrigerado para bebidas premium y toallas
        - Cubierta de EVA estilo teca para un aspecto lujoso y seguridad antideslizante
        - Configuración de motor silenciosa para una molestia mínima por ruido
    - title: Resorts de buceo ecológicos boutique
      subtitle: Propiedades frente al mar, ecolodges, enfoque en sostenibilidad
      description: Propiedades más pequeñas en ubicaciones costeras remotas que priorizan la responsabilidad ambiental y las experiencias auténticas. Estos resorts necesitan botes fiables y de bajo mantenimiento capaces de operar de forma autónoma con soporte técnico limitado. La eficiencia de combustible y la durabilidad importan más que la velocidad máxima. El bote debería integrarse en el entorno natural.
      features:
        - Configuraciones de fueraborda de 4 tiempos de bajo consumo
        - Tubos de Hypalon de uso intensivo para una larga vida útil en ubicaciones remotas
        - Sistema eléctrico compatible con energía solar para carga fuera de la red
        - Distribución de cubierta compacta para 8-10 huéspedes con huella ambiental mínima
        - Diseño de fácil mantenimiento — componentes accesibles para el servicio local
        - Opciones de color neutro que se integran con el entorno natural
        - Construcción ligera para varadas en playa y operaciones en aguas someras
    - title: Operadores de liveaboard premium
      subtitle: Safaris de buceo de varios días, buceo de expedición, atolones remotos
      description: 'Los operadores de liveaboard necesitan tenders polivalentes: transporte de buceadores a los arrecifes, traslado de equipo, apoyo de emergencia y excursiones. El RIB debe ser lo bastante compacto para guardarse en cubierta o remolcarse, y lo bastante capaz para travesías en aguas abiertas con condiciones variables. La botadura y recogida diarias exigen una construcción robusta.'
      features:
        - Diseño compacto (4,5-5,5 m) para almacenamiento en cubierta o remolque tras el liveaboard
        - Casco reforzado para varadas frecuentes en playa y navegación entre arrecifes
        - Opciones de tubo de inflado/desinflado rápido para una estiba eficiente
        - Escalera de buceo de perfil bajo para subir fácilmente desde el agua
        - Puntos de izado de uso intensivo para sistemas de botadura con pescante o grúa
        - Autonomía para 50+ millas náuticas entre repostajes
        - Materiales de tubo duraderos resistentes a la exposición al sol, la sal y el combustible
    - title: Operaciones de charter privado VIP
      subtitle: Islas privadas ultralujosas, huéspedes famosos, charters corporativos
      description: El nivel más alto de hospitalidad de resort, donde cada detalle se personaliza y las expectativas son extremas. El bote debe estar impecable, navegar en un susurro y contar con un servicio impecable. Privacidad, comodidad y perfección estética son primordiales. Estos clientes no son sensibles al precio, pero sí excepcionalmente sensibles a la calidad.
      features:
        - Asientos ultra premium con costuras personalizadas y opciones calefactadas
        - Compartimento del motor insonorizado para una navegación casi silenciosa
        - Opción de cierre total para privacidad y protección meteorológica
        - Sistema de entretenimiento integrado con altavoces de grado marino
        - Barra húmeda o estación de refrigerios personalizada
        - Recinto privado de aseo/vestuario
        - Puesto de tripulación dedicado con comunicaciones y navegación
        - Juego de tenders a juego — nave nodriza y RIB de apoyo coordinados
content_benefits:
  tagline: Ventajas clave
  title: Por qué Aquafarer para<br />operaciones de buceo
  subtitle: RIB de buceo diseñados a propósito, en los que confían centros de buceo comerciales en más de 30 países — construidos para operación diaria, no para uso ocasional.
  list:
    - Construidos para 200-300 días de operación al año — no un bote de fin de semana, sino una plataforma de trabajo diaria
    - Tubos de Hypalon o PVC de grado militar — durabilidad máxima en entornos de agua salada tropical con resistencia UV
    - El diseño de tubo ancho proporciona una plataforma estable de embarque para buceadores equipados — entrada y salida más seguras para todos los niveles
    - Distribución de cubierta optimizada para el flujo de equipo — botellones, equipo y pasajeros cuentan cada uno con espacio propio
    - Configuraciones personalizadas de escalera y plataforma de buceo — sin solución estándar, cada bote a juego con su operación
    - Opciones de redundancia de motor (simple/doble) — seguridad operativa cuando hay buceadores en el agua
    - Menores costes operativos diarios — eficiencia de combustible optimizada y requisitos de mantenimiento reducidos
    - 'Entrega rápida: 30-60 días del pedido al envío para configuraciones estándar'
