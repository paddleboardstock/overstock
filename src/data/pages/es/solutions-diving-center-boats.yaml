    - Opciones de motor de 40 HP a 115 HP — configuración simple o bimotor
    - Placas de montaje para sonar, GPS y equipo de comunicación
    - Capacidad de combustible adaptada a los requisitos de autonomía operativa
    - 'Construcción de calidad marina: materiales de tubo de alta resistencia con resistencia a los rayos UV y al agua salada, estructura reforzada para uso comercial diario'
    - Configuraciones personalizadas de plataforma y escalera de buceo, adaptadas a la profundidad operativa del agua y al perfil del buceador
    - Placas de montaje de equipos para sonar, GPS y equipos de comunicación.
