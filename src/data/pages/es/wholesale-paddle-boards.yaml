hero:
  tagline: SUP Juntas mayoristas
  title: Tablas inflables de paddle al por mayor<br />para pequeñas empresas
  subtitle: SUP Tableros nuevos de sobrestock en cantidades aptas para pequeñas empresas. Pide de 5 a 20 tablas, mezcla cualquier modelo en un solo envío y elige transporte exprés aéreo o marítimo a 50+ países.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tablas inflables al por mayor SUP Paddle Board Overstock listas para el envío
direct_answer: Paddle Board Overstock SUP Suministra tablas inflables nuevas en exceso a pequeños minoristas de todo el mundo. No hay un pedido mínimo grande — un pedido al por mayor comienza con solo 5 tablas, y puedes mezclar cualquier modelo en stock en un solo pedido. Las placas se envían desde nuestra base en Weihai, China, por transporte aéreo exprés (1–3 tableros, muestras o reposiciones urgentes) o transporte marítimo consolidado (5–20 pedidos de tableros en comercios). Cada placa está 100% sometida a prueba de presión antes del envío y está cubierta por nuestra garantía de 2 años SUP .
tldr_points:
  - 'Bajo MOQ: los pedidos mayoristas empiezan en 5 tablas — tamaño para tiendas pequeñas, no para cargas en contenedor'
  - 'Pedidos de modelos mixtos: combinar cualquier modelo en stock SUP en un solo envío'
  - 'Dos opciones de envío: carga aérea exprés para 1–3 embarcaciones, carga marítima para 5–20 órdenes de embarcación'
  - 'Material nuevo: 100% probado por presión, 99,3% tasa de aprobación en inspección final, garantía de 2 años SUP'
why_retailers:
  title: Por qué los pequeños minoristas eligen SUP las tablas de sobrestock
  subtitle: No necesitas un almacén ni un presupuesto para contenedores para comprar a precios mayoristas.
  items:
    - title: Cantidades Favorables a Pequeñas Empresas
      description: 'El comercio mayorista tradicional exige cientos de unidades por pedido. Nuestro modelo de sobrestock está diseñado para tiendas independientes: empieza con 5 tablas y aumenta tu pedido a medida que tu tienda crece.'
    - title: Precios reales al por mayor sin compromiso de volumen
      description: Como vendemos inventario excedente — producción excedente y stock cuidadosamente adquirido de fábricas asociadas seleccionadas — obtienes precios unitarios a nivel de volumen sin el riesgo de volumen.
    - title: Mezcla modelos para adaptarlos a tus clientes
      description: Las tiendas de playa, las tiendas de servicios de lagos y las tiendas de la ciudad atienden a diferentes remeros. Mezcla modelos de todo tipo, de turismo y de estilo surf SUP en un solo pedido para que tu estantería se adapte a la demanda local.
    - title: Nuevo de palanca, nunca usado
      description: Cada placa en nuestro inventario excedente es nueva y sin usar — ni segundas, ni devoluciones. Cada placa está 100% sometida a presión antes de salir del almacén.
    - title: Envío internacional rápido y flexible
      description: El transporte aéreo exprés recibe de 1 a 3 pedidos de muestra o cartas en tu puerta rápidamente; el transporte marítimo consolidado mantiene bajo el coste por mesa en 5–20 pedidos de tableros en comercios.
    - title: Respaldado por una garantía real
      description: Mayorista no significa que no esté soportado. Cada SUP placa lleva nuestra garantía de 2 años SUP , la misma cobertura que ofrecemos a cada cliente en 50+ países.
pricing_section:
  tagline: Precios al por mayor
  title: Precios mayoristas sencillos y transparentes
  subtitle: 'El precio se presupuesta por pedido según los modelos, cantidades y método de envío que elijas. Sin cargos ocultos: el presupuesto que recibes es el precio que pagas.'
  points:
    - title: Clasificado por cantidad
      description: Los precios de las unidades bajan a medida que aumenta el tamaño de la orden. Un pedido de 10 juntas cuesta mejor por junta que uno de 5 juntas; una orden de 20 juntas aún mejor.
    - title: Los modelos mixtos cuentan para un total
      description: Su nivel de descuento se basa en el número total de tablas en el pedido, no por modelo. Mezclar 4 modelos diferentes × 3 tablas cada uno cuenta como un pedido de 12 tablas.
    - title: Cotizado Con Opciones de Envío
      description: Cada cotización incluye opciones tanto de envío exprés como marítimo con tiempos de tránsito estimados, para que pueda elegir el equilibrio velocidad-costo que se ajuste a su calendario de reposición.
    - title: No se Requiere Cuenta o Membresía
      description: No hay un club mayorista al que unirse ni tarifa anual. Solicite una cotización, confirme el pedido y nosotros lo enviamos.
inventory_section:
  tagline: Inventario Actual
  title: Productos Disponibles e Inventario Actual
  subtitle: Los 11 productos a continuación son inventario actual en exceso. Las condiciones son totalmente nuevas; los niveles de stock cambian semanalmente, por lo que confirme la disponibilidad en su solicitud de cotización.
  table_labels:
    product: Modelo
    condition: Condición
    price: Precio de Venta al Público
    action: Contáctenos
    condition_value: Nuevo
    note: Precio de venta al público mostrado como referencia. El precio unitario al por mayor se cotiza por pedido y es inferior al precio minorista.
who_section:
  tagline: A Quién Suministramos
  title: Construido para Negocios Independientes de Deportes Acuáticos
  items:
    - title: Tiendas de Playa y Surf
      description: Pequeños minoristas costeros que necesitan 5–15 tablas por temporada, mezcladas entre modelos versátiles para turistas y tablas de estilo surf para locales.
    - title: Vendedores online
      description: Tiendas de comercio electrónico y vendedores de marketplaces que prueban la categoría SUP sin comprometerse con un contenedor completo de un solo modelo.
    - title: Flotas de Alquiler y Escuelas
      description: 'Operaciones de alquiler y escuelas SUP que reponen flotas: tablas duraderas, modelos mixtos para atender diferentes tamaños de clientes y respaldo de garantía.'
    - title: Resorts y Operadores Turísticos
      description: Hoteles, resorts en islas y operadores turísticos que agregan SUP a su catálogo de actividades con flotas iniciales pequeñas y fácil reposición estacional.
how_to_order:
  tagline: Cómo funciona
  title: Cómo Realizar un Pedido al por Mayor
  steps:
    - title: Navegue por el Inventario
      description: Revise los 11 modelos disponibles en stock arriba o use el selector de modelos mixtos para elaborar una combinación que se ajuste a sus clientes.
    - title: Solicite una Cotización
      description: Envíenos los modelos, cantidades estimadas, su país y la velocidad de envío preferida usando el formulario de consulta a continuación. Respondemos con precios unitarios y opciones de envío.
    - title: Confirmar y Pagar
      description: 'Apruebe el presupuesto final: modelos, cantidades, método de envío y total. Los términos de pago se confirman al cotizar.'
    - title: Probamos, Empaquetamos y Enviamos
      description: Cada tabla se prueba al 100% de presión, se empaqueta con su kit completo de accesorios y se despacha desde Weihai. Usted recibe el número de seguimiento para todo el trayecto.
