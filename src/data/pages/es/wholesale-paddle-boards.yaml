faq_section:
  title: Preguntas Frecuentes de Venta al por Mayor
  items:
    - q: ¿Cuál es el pedido mínimo al por mayor?
      a: Cinco tablas. Nuestro modelo de sobrestock está diseñado para pequeños minoristas — no necesita llenar un contenedor para obtener precios al por mayor.
    - q: ¿Puedo mezclar diferentes modelos SUP en un pedido al por mayor?
      a: Sí. Los pedidos con modelos mixtos son una de las mayores ventajas de comprar sobrestock — combine cualquier modelo disponible en un solo envío, y la cantidad total de tablas determina su nivel de precios. Consulte nuestra página de venta al por mayor con modelos mixtos para más detalles.
    - q: ¿Son las tablas completamente nuevas?
      a: Sí. Cada placa es completamente nueva, inventario sobrante sin usar, nunca son segundas, reacondicionadas o devoluciones de clientes. Cada placa se prueba al 100% bajo presión antes del envío.
    - q: ¿Cuánto más barato es al por mayor que al por menor?
      a: El precio unitario al por mayor se cotiza por pedido según los modelos y las cantidades, y es significativamente inferior a los precios de venta al por menor indicados arriba. Solicite una cotización para su combinación objetivo y lo tasaremos exactamente.
    - q: ¿Qué método de envío debo elegir?
      a: El transporte aéreo exprés es adecuado para 1–3 tablas, muestras y reabastecimientos urgentes. El transporte marítimo consolidado es la opción económica para pedidos de 5–20 tablas por minorista. Cotizamos ambas opciones con cada consulta.
    - q: ¿Qué garantía tienen las placas al por mayor?
      a: La misma garantía de 2 años SUP que damos a cada cliente, en cada uno de los 50+ países a los que enviamos.
    - q: ¿Hacen envíos a mi país?
      a: Actualmente realizamos envíos a más de 50 países, con guías regionales para América Latina, el sudeste asiático, África, Medio Oriente y mercados clave como México, Brasil, Filipinas, Indonesia, Tailandia, Sudáfrica, Kenia y los Emiratos Árabes Unidos. Pregunte en su solicitud de presupuesto y confirmaremos el servicio actual a su dirección.
