hero:
  tagline: Kenia
  title: SUP Tablas mayoristas para<br />Empresas kenianas
  subtitle: Diani, Watamu, Mombasa y Nairobi — operadores de playa, resorts y minoristas que disponen de tablas nuevas de excedente de 5 unidades, modelos mixtos.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tableros de excedente SUP para resorts y operadores de playa keniana
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas SUP en exceso a empresas kenianas — operadores de playa y resorts en Diani, Watamu, Nyali y la costa alrededor de Mombasa, además de minoristas y escuelas que llegan a la creciente comunidad de piragüistas de Nairobi. Los pedidos mayoristas comienzan con 5 placas con modelos mixtos en un solo envío, enviados desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada placa está 100% sometida a prueba de presión y está cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Servicio al turismo de playas del Océano Índico de Kenia y a los complementos de safari-lodges
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El mercado keniano SUP
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: una actividad en aguas tranquilas que funciona para los huéspedes del resort, los días sin viento de las escuelas de kitesurf y los paseos al atardecer sobre el arrecife.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: 'lodges y campamentos que añaden sesiones de paddle a sus menús de actividades. Entre operadores de playa, hoteles, escuelas de kitesurf y buceo que amplian su oferta, y una pequeña pero creciente escena de remo en Nairobi, los pedidos son pequeños y prácticos: de 5 a 15 tablas de modelos estables y duraderos para todo el equipo, con una o dos ediciones premium para exhibición.'
  customer_types:
    - title: Operadores de playa
      description: Los operadores de Diani, Watamu y Mombasa están añadiendo SUP alquileres y clases para turistas.
    - title: Resorts y Lodges de Safari y Playa
      description: Resorts costeros y lodges que añaden SUP programas para huéspedes con flotas mixtas compactas.
    - title: Escuelas de kitesurf y buceo
      description: Las escuelas de deportes acuáticos existentes amplian su oferta con remadas en aguas tranquilas.
shipping_section:
  title: Barco a Kenia
  paragraphs:
    - Los pedidos se envían desde Weihai, China. Freight aéreo exprés transporta muestras y entre 1 y 3 pedidos de embarcación hacia el aeropuerto Jomo Kenyatta de Nairobi y la costa; Consolidated Sea Freight atiende entre 5 y 20 pedidos al por mayor a bordo a través del puerto de Mombasa. Las estimaciones de tránsito para tu destino están incluidas en tu presupuesto.
    - Proporcionamos las facturas comerciales y los requisitos de despacho de listas de empaquetado, con códigos HS correctos y valores declarados. Los derechos de importación y los impuestos son a cargo del importador según las normas kenianas.
  customs_note: 'Confirma el tratamiento actual de derechos y impuestos para el equipamiento deportivo con tu agente de compensación antes de hacer el pedido: la estructura arancelaria de Kenia cambia periódicamente. Proporcionamos documentación completa y consistente para un saldo fluido.'
faq_section:
  title: Preguntas frecuentes sobre Kenia
  items:
    - q: ¿Pueden las placas llegar directamente a Diani o Watamu?
      a: Los presupuestos de entrega puerta a puerta cubren destinos costeros, utilizando la logística desde el aeropuerto de llegadas o el puerto de Mombasa. Anota tu ubicación exacta en la consulta y te pondremos el precio específico.
    - q: ¿Cómo es un pedido inicial de un operador de playa?
      a: 'Normalmente 5–10 tablas: modelos estables y completos para lecciones turísticas y alquileres, además de una o dos ediciones premium para exposición. Modelos mixtos, un envío, con precio por cantidad total.'
    - q: ¿Las tablas son adecuadas para lagoas cálidas y aguas planas de arrecife?
      a: Sí — las condiciones tranquilas, cálidas y poco profundas son exactamente para lo que están diseñados todos los SUPs inflables polivalentes, y la aleta flexible y la construcción drop-stitch manejan bien los aterrizajes en arena y en arrecifes planos.
    - q: ¿Cómo se cotiza el envío a Kenia?
      a: Envío exprés aéreo a Nairobi o la costa para muestras y pedidos pequeños; envío marítimo consolidado a Mombasa para cantidades mayoristas. Ambos están desglosados en su cotización con los tiempos de tránsito estimados.
