hero:
  tagline: Certificaciones y Normas
  title: 'Certificaciones de Calidad<br />y Normas de Cumplimiento'
  subtitle: 'Los productos Paddle Board Overstock se fabrican de conformidad con las normas internacionales de seguridad marítima, los sistemas de gestión de calidad y las regulaciones medioambientales.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Certificaciones de calidad de Paddle Board Overstock y documentación de cumplimiento
content_certifications:
  tagline: Nuestras Certificaciones
  title: 'Calidad Certificada,<br />Reconocida Mundialmente'
  subtitle: '64 modelos con certificación CE y certificaciones de toda la fábrica demuestran nuestro compromiso con la calidad, la seguridad y la responsabilidad medioambiental.'
  items:
    - title: 'Certificado CE'
      description: '64 modelos con certificación CE cumplen los requisitos de marcado CE europeo para embarcaciones de recreo, garantizando el cumplimiento de las normas de seguridad, salud y protección del medio ambiente.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Nuestro sistema de gestión de calidad está certificado según ISO 9001:2015, abarcando el diseño, la fabricación y la distribución de embarcaciones inflables y equipos marinos.'
      icon: tabler:clipboard-check
    - title: 'Marcado UKCA'
      description: 'Los productos vendidos en el mercado británico llevan el marcado UKCA, que confirma el cumplimiento de las regulaciones del Reino Unido para equipos marinos y embarcaciones personales.'
      icon: tabler:shield
    - title: 'Conforme con BSCI'
      description: 'Paddle Board Overstock está auditado según BSCI (Business Social Compliance Initiative), lo que demuestra prácticas de fabricación éticas, condiciones laborales justas y responsabilidad en la cadena de suministro.'
      icon: tabler:heart-handshake
    - title: 'Conforme con REACH'
      description: 'Todos los materiales utilizados en los productos Paddle Board Overstock cumplen la regulación REACH de la UE sobre seguridad química, garantizando que no haya sustancias restringidas en nuestro PVC, Hypalon o componentes.'
      icon: tabler:flask
    - title: 'Pruebas de Material'
      description: 'Los tejidos se someten a pruebas de resistencia a la tracción, resistencia al desgarro, degradación por rayos UV y comportamiento al frío. Cada lote de producción se muestrea y verifica.'
      icon: tabler:test-pipe
content_factory:
  tagline: Estándares de Fábrica
  title: 'Excelencia en Fabricación<br />— Construido según Especificación'
  subtitle: 'Nuestras instalaciones de 12.000 m² operan bajo estrictos protocolos de control de calidad en cada etapa de la producción.'
  list:
    - 'Inspección de Materiales Entrantes: Todas las materias primas — tejido de PVC, Hypalon, aluminio, madera contrachapada, adhesivos — se prueban contra las especificaciones antes de entrar en producción.'
    - 'Control de Calidad en Proceso: Cada etapa de producción tiene puntos de control de calidad documentados. La resistencia de las soldaduras, la alineación de las costuras, la instalación de las válvulas y el par de apriete se verifican en línea.'
    - 'Pruebas de Presión: Cada cámara inflable se somete a pruebas de presión a 1,25× la presión nominal durante 24-48 horas. La tasa de fuga debe ser cero para superar la prueba.'
    - 'Inspección Final: Los productos terminados se inspeccionan en cuanto a precisión dimensional, acabado cosmético, integridad de accesorios e integridad del embalaje antes del envío.'
    - 'Trazabilidad de Lotes: Cada producto lleva un número de serie vinculado a los registros del lote de producción, lo que permite una trazabilidad completa desde la materia prima hasta el producto terminado.'
content_safety:
  tagline: Normas de Seguridad Marítima
  title: 'La Seguridad Primero<br />— Diseñado para un Funcionamiento Fiable'
  subtitle: 'Los productos Paddle Board Overstock están diseñados y probados para cumplir las normas internacionales de seguridad marítima para uso comercial y recreativo.'
  items:
    - title: 'ISO 6185'
      description: 'Las embarcaciones inflables cumplen las normas ISO 6185 sobre construcción, estabilidad, flotabilidad y capacidad de carga.'
      icon: tabler:sailboat
    - title: 'Normas ABYC'
      description: 'Los sistemas eléctricos y de combustible siguen las normas ABYC (American Boat & Yacht Council) para una instalación y funcionamiento seguros.'
      icon: tabler:bolt
    - title: 'Cumplimiento SOLAS'
      description: 'El equipo de seguridad y los dispositivos de salvamento cumplen los requisitos SOLAS (Safety of Life at Sea) cuando corresponda.'
      icon: tabler:lifebuoy
cta:
  title: '¿Necesita productos certificados para su proyecto?'
  subtitle: 'Contacte con nuestro equipo para hablar de los requisitos de certificación, la documentación y el cumplimiento normativo para su mercado.'
  actions:
    - variant: primary
      text: Solicitar documentación de certificación
      href: /contact
    - text: Ver nuestra página de calidad
      href: /quality
