content_challenge:
  tagline: El desafío
  title: La investigación marina exige plataformas estables y listas para instrumentos
  subtitle: Los barcos de trabajo científicos deben proporcionar una plataforma estable para instrumentación sensible, un funcionamiento silencioso para evitar perturbar la vida silvestre y diseños flexibles para diversos equipos de investigación.
  paragraphs:
    - La investigación marina y el monitoreo ambiental requieren embarcaciones de trabajo que funcionen como laboratorios móviles. A diferencia de las embarcaciones comerciales o recreativas, los RIB de investigación deben alojar instrumentación electrónica sensible, equipos de muestreo de agua y sedimentos y, a veces, el transporte de especímenes vivos — todo ello manteniendo una plataforma estable para una recopilación de datos precisa.
    - '**La estabilidad de la plataforma es crítica** — El sonar, las ecosondas y los perfiladores CTD (conductividad, temperatura, profundidad) requieren un casco estable en reposo y a baja velocidad. Una estela excesiva o el movimiento del casco introducen ruido en los datos científicos. Un casco en V profundo con buenas características de estabilidad es esencial.'
    - '**Integración de instrumentos** — Los buques de investigación necesitan puntos de montaje para antenas GPS, transductores de sonar, brazos de muestreo y equipos de registro de datos. El espacio de la consola debe alojar múltiples pantallas, la distribución eléctrica de los instrumentos y un almacenamiento seguro para la electrónica sensible.'
    - '**Funcionamiento silencioso** — Para los estudios de biología marina y el monitoreo ambiental, el ruido del motor y la vibración del casco pueden ahuyentar la vida marina y comprometer las observaciones de comportamiento. Las configuraciones silenciosas de fuera de borda y los diseños de casco de vibración reducida son importantes para aplicaciones de investigación.'
    - Los RIB de investigación Paddle Board Overstock están diseñados con plataformas de casco estables, sistemas integrados de montaje de equipos y configuraciones silenciosas de fuera de borda para aplicaciones científicas y de monitoreo ambiental.
content_solution:
  tagline: Nuestra solución
  title: RIB de investigación especialmente diseñadas<br />Para trabajos científicos y medioambientales
  subtitle: Cada RIB de investigación de Paddle Board Overstock está configurado como una plataforma estable y personalizable para instrumentación científica y equipos de muestreo de campo.
  list:
    - Casco de fibra de vidrio en V profundo con excelente estabilidad en reposo y a velocidades de estudio lentas
    - Cubierta plana con placas de montaje de equipos para sonar, GPS y material de muestreo
    - Consola configurada para múltiples pantallas — plotter, sonda, registrador de datos
    - Distribución de energía de accesorios de 12 V y 24 V para instrumentos científicos
    - Fuera de borda de 4 tiempos silencioso — vibración y ruido mínimos para estudios de fauna
    - Diseño opcional de casco de baja estela para una perturbación mínima durante la recopilación de datos
    - Colores de tubos personalizados para la imagen de marca de instituciones de investigación y la identificación de flotas
content_segments:
  tagline: Perfiles de investigación
  title: Soluciones de ciencias marinas<br />Por tipo de aplicación
  subtitle: Las diferentes aplicaciones de investigación tienen requisitos de embarcaciones únicos, desde plataformas de enseñanza universitaria hasta embarcaciones de estudios ambientales y RIB para monitoreo de la calidad del agua.
  items:
    - title: Programas universitarios de ciencias marinas
      subtitle: Plataformas de enseñanza, excursiones de estudiantes, investigación costera.
      description: Las universidades de ciencias marinas y los departamentos de oceanografía necesitan barcos de trabajo confiables y versátiles para impartir cursos de campo, proyectos de investigación de estudiantes y estudios costeros dirigidos por profesores. El barco debe ser fácil de operar para los estudiantes bajo supervisión, lo suficientemente estable para el despliegue práctico de instrumentos y lo suficientemente duradero para el uso frecuente por parte de múltiples usuarios a lo largo de los períodos académicos. Las restricciones presupuestarias en los entornos académicos hacen que la rentabilidad y el bajo mantenimiento sean consideraciones importantes.
      features:
        - Plataforma estable para que los estudiantes practiquen el despliegue y la recuperación de instrumentos
        - Operación sencilla — configuración de caña del timón o consola simple para uso estudiantil supervisado
        - Tubos de Hypalon duraderos para varadas frecuentes en la playa y manipulación por estudiantes
        - Montaje de equipos para sonar didáctico, disco de Secchi y material de muestreo
        - Opción de PVC rentable para programas académicos con presupuesto limitado
    - title: Institutos de investigación marina
      subtitle: RIB de inspección con integración de instrumentos, GPS y equipo de muestreo
      description: Las organizaciones de investigación marina dedicadas a realizar estudios costeros y marinos necesitan RIB de estudio configuradas profesionalmente con instrumentación integrada. Estos buques llevan sistemas de sonar para mapeo batimétrico, perfiladores CTD para análisis de columnas de agua, muestreadores de sedimentos y equipos de recolección biológica. El barco debe proporcionar una plataforma estable a velocidades de reconocimiento lentas, tener un amplio espacio en cubierta para el despliegue del equipo y ofrecer energía limpia de 12 V/24 V para los dispositivos electrónicos.
      features:
        - Montaje integrado de transductor de sonar — configuración pasacasco o en espejo de popa
        - Montaje de antena GPS e integración en consola para navegación apta para estudios
        - Zona de despliegue de CTD y muestreador de agua con puntos de sujeción seguros
        - Distribución de energía auxiliar de 12 V/24 V para instrumentos y registradores de datos
        - Estable a baja velocidad (3-6 nudos) para la precisión de las líneas de estudio
        - Pórtico en A o pescante opcional para desplegar equipos de muestreo más pesados
    - title: Monitoreo y conservación ambiental
      subtitle: Estudios ecológicos, observación de vida silvestre, evaluación de hábitat.
      description: Las ONG ambientalistas, las agencias gubernamentales y las organizaciones conservacionistas realizan estudios ecológicos marinos, monitoreo de poblaciones de vida silvestre y evaluaciones de hábitat. Estas operaciones requieren embarcaciones silenciosas y de bajo impacto que puedan acercarse a hábitats sensibles sin perturbar la vida silvestre. Los barcos deben llevar equipo de cámara, GPS para mapeo de transectos y equipo de muestreo para recolección de agua y sedimentos. Una estela baja y un ruido mínimo del motor son fundamentales para los estudios de observación del comportamiento.
      features:
        - Fuera de borda de 4 tiempos silencioso — perturbación mínima de la fauna marina
        - Plataforma de observación estable para documentación fotográfica y en vídeo
        - Montaje de equipos para rigs de cámara, rastreadores GPS y ordenadores de campo
        - Calado reducido para acceder a humedales costeros, manglares y estuarios
        - Superficies de cubierta y tubos de fácil limpieza para la descontaminación entre sitios
    - title: Monitoreo y pruebas de la calidad del agua
      subtitle: Ejecuciones periódicas de muestreo, seguimiento de contaminantes, seguimiento del cumplimiento
      description: Las organizaciones de monitoreo de la calidad del agua realizan muestreos regulares en zonas costeras, puertos y vías navegables interiores para rastrear los niveles de contaminación, la proliferación de algas y el cumplimiento de las regulaciones ambientales. Estas operaciones necesitan embarcaciones eficientes y confiables para visitas repetidas a estaciones de muestreo fijas. El barco debe llevar equipo de muestreo, refrigeradores para la conservación de muestras y equipo de prueba de campo, con fácil lavado de la cubierta entre los sitios de muestreo para evitar la contaminación cruzada.
      features:
        - Zona dedicada de estación de muestreo con nevera y almacenamiento de equipos
        - Cubierta y superficies de tubos de fácil limpieza para la descontaminación entre sitios
        - Integración GPS para el retorno preciso a coordenadas de muestreo fijas
        - Tamaño compacto para el acceso a vías navegables restringidas y canales estrechos
        - Fuera de borda de bajo consumo para campañas de muestreo regulares rentables
