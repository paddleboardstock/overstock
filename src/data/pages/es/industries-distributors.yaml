hero:
  tagline: Distribuidores y venta al por mayor de deportes acuáticos
  title: 'Partnership de venta al por mayor<br />para distribuidores de deportes acuáticos'
  subtitle: 'Conviértase en socio de distribución de Paddle Board Overstock. Acceda a nuestro catálogo completo de productos, precios exclusivos de venta al por mayor, soporte de drop-shipping y gestión de cuenta dedicada.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Fábrica de Paddle Board Overstock y distribución al por mayor

direct_answer: 'Paddle Board Overstock ofrece partnerships de venta al por mayor integrales para distribuidores de deportes acuáticos en todo el mundo. Los socios reciben precios de mayorista en todo el catálogo, gestión de cuenta dedicada, material de marketing y soporte logístico. Ofrecemos capacidades de drop-shipping, etiquetado privado y cantidades mínimas de pedido flexibles que se adaptan a su modelo de negocio.'

solution_offerings:
  - title: Distributor Starter
    subtitle: Para nuevas asociaciones y distribuidores regionales
    badge: Popular
    features:
      - title: Acceso al catálogo completo
        description: Precios de mayorista en todas las tablas de SUP, kayaks, RIB y accesorios
      - title: Gestor de cuenta dedicado
        description: Un único punto de contacto para pedidos, soporte e información de productos
      - title: Material de marketing
        description: Fotos de producto, fichas técnicas, folletos y recursos digitales en su idioma
      - title: Soporte logístico
        description: Coordinación de envíos, documentación aduanera y entrega en almacén
      - title: Programa de muestras
        description: Pedidos de muestra con descuento para expositores de showroom y demostraciones a distribuidores
    cta_text: Solicitar partnership
    cta_href: '/contact'

  - title: Distributor Premium
    subtitle: Para distribuidores consolidados con cobertura multinacional
    badge: Best Value
    features:
      - title: Precios por niveles
        description: Niveles de precios basados en volumen con programas trimestrales de descuentos
      - title: Territorio exclusivo
        description: Derechos de distribución protegidos para su región o país
      - title: Programa de drop-shipping
        description: Envío directo a sus clientes desde nuestros almacenes con su marca
      - title: Etiquetado privado
        description: Soporte completo OEM/ODM para su propia marca — tablas, barcos y accesorios
      - title: Soporte prioritario
        description: Garantía de respuesta en 48 horas, coordinador logístico dedicado y pedidos urgentes
    cta_text: Mejorar partnership
    cta_href: '/contact'

  - title: Master Distributor
    subtitle: Para grandes distribuidores regionales y nacionales
    badge: Enterprise
    features:
      - title: Partnership estratégico
        description: Planificación comercial conjunta, fondos de desarrollo de mercado y programas de co-marketing
      - title: Desarrollo de producto a medida
        description: Diseños y especificaciones de producto exclusivos para su mercado
      - title: Soporte de almacén local
        description: Inventario en consignación, stock local de repuestos y montaje de centro de servicio regional
      - title: Soporte a red de distribuidores
        description: Programas de formación, cursos de certificación e integración de localizador de distribuidores
      - title: Cumbre anual de socios
        description: Reuniones estratégicas, avances de producto y creación de redes con socios globales
    cta_text: Explorar partnership Master
    cta_href: '/contact'

benefits:
  - title: Acceso directo al fabricante
    description: Sin intermediarios. Usted trabaja directamente con la fábrica que diseña, desarrolla y produce cada producto.
    icon: tabler:building-factory
  - title: Márgenes competitivos
    description: Precios de mayorista con descuentos por volumen, programas de descuentos y territorios protegidos.
    icon: tabler:coin
  - title: Soporte de marketing
    description: Recursos de producto profesionales, folletos localizados y campañas de marketing en co-branding.
    icon: tabler:chart-bar
  - title: Partnership logístico
    description: Envíos coordinados, soporte aduanero y opciones de almacén local para reducir sus costes logísticos.
    icon: tabler:truck-delivery

content_segments:
  tagline: Perfiles de socios
  title: 'Modelos de partnership de distribución<br />por tipo de socio'
  subtitle: 'Cada distribuidor aporta fortalezas distintas de salida al mercado: infraestructura regional, alcance de e-commerce, venta especializada o carteras multimarca. Estructuramos las condiciones del partnership, los niveles de precios y el soporte para adaptarlos a cada perfil de socio.'
  items:
    - title: Distribuidores marítimos regionales
      subtitle: Distribución B2B con territorio exclusivo
      description: 'Distribuidores consolidados con infraestructura de almacén, redes de distribuidores y capacidad logística al servicio de concesionarios náuticos, minoristas de deportes acuáticos y operadores de alquiler dentro de un territorio geográfico definido. Necesita una línea de productos completa, precios protegidos y la capacidad de atender cuentas de distribuidores con stock y soporte locales.'
      features:
        - 'Protección exclusiva de territorio con condiciones de compromiso mínimo'
        - 'Precios de mayorista del catálogo completo con descuentos trimestrales por volumen'
        - 'Programa de stock en consignación para referencias de rotación rápida'
        - 'Formación de la red de distribuidores y programas de marketing en co-branding'
    - title: E-commerce y minoristas online
      subtitle: Canales de distribución digital first
      description: 'Minoristas online que venden equipos de deportes acuáticos a través de Amazon, eBay o sus propias plataformas de e-commerce. La rapidez de salida al mercado, los precios competitivos y la logística directa al consumidor son críticos. Necesita un socio capaz de enviar pedidos individuales bajo su marca con entrega rápida y cero riesgo de inventario.'
      features:
        - 'Programa de drop-shipping: preparación directa de fábrica con su marca'
        - 'Feed API de inventario en tiempo real para su plataforma de e-commerce'
        - 'Integración con Amazon Seller Central y soporte EAN/UPC'
        - 'Logística de devoluciones y tramitación de garantías incluidas'
    - title: Minoristas especializados en deportes acuáticos
      subtitle: Socios con showroom físico
      description: 'Tiendas físicas especializadas en equipos de deportes acuáticos: atienden a palistas, pescadores y navegantes locales con venta presencial, demostraciones y servicio posventa. Necesita envases optimizados para venta al por menor, programas de unidades de demostración y material de punto de venta que convierta a los clientes que entran.'
      features:
        - 'Programa de unidades de demostración: tablas de exposición con descuento'
        - 'Envases listos para tienda con diseño de caja optimizado para estantería'
        - 'Expositores de punto de venta, tablas comparativas y guías de compra'
        - 'Formación y programa de certificación para el personal de tienda'
    - title: Distribuidores multimarca y grandes almacenes
      subtitle: Distribución de artículos deportivos de línea amplia
      description: 'Distribuidores a gran escala que sirven a grandes almacenes, cadenas de gran consumo y tiendas de artículos deportivos con catálogos multimarca. La coherencia, la documentación de cumplimiento y las normas del proveedor son primordiales: cada referencia debe cumplir los estándares de envasado, etiquetado y calidad específicos de cada minorista.'
      features:
        - 'Documentación de cumplimiento del minorista: especificación de envasado, código de barras, etiquetado'
        - 'Integración EDI/ASN para los sistemas de pedidos de grandes minoristas'
        - 'Inventario gestionado por el proveedor y programas de reposición automática'
        - 'Gestión de cuenta dedicada con SLA de respuesta en 24 horas'

cta:
  title: 'Conviértase en socio de distribución'
  subtitle: 'Solicite unirse a la red de socios de Paddle Board Overstock. Revisamos las solicitudes en un plazo de 48 horas.'
  actions:
    - variant: primary
      text: Solicitar ahora
      href: /contact
    - text: Descargar el folleto de socios
      href: /resources
