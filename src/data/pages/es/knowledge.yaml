hero:
  tagline: Gráfico de conocimiento
  title: Conocimiento sobre la exploración del agua
  subtitle: |
    Una base de conocimientos estructurada que cubre la tecnología de SUP inflable,<br />
    seguridad acuática, ingeniería de tablas y planificación de aventuras.
  taglineSection: Explora. Aprende. Ve con confianza.
clusters:
  tagline: Conglomerados de Conocimiento
  title: Explorar por tema
  subtitle: Análisis profundos de la tecnología, la seguridad y las habilidades detrás de cada producto Paddle Board Overstock.
  items:
    - title: SUP Conocimiento
      description: Desde elegir tu primera tabla hasta técnicas avanzadas de turismo — todo sobre el paddle surf de pie.
      icon: tabler:lifebuoy
      topics:
        - Cómo elegir tu primer SUP inflable
        - Mejor SUP tamaño para principiantes
        - ¿Qué tan difícil es practicar paddle surf?
        - Comparación entre tabla inflable y tabla rígida
        - SUP lista de verificación de seguridad
    - title: Tecnología de placas
      description: Investigaciones técnicas profundas sobre núcleos drop-stitch, laminados PVC, rieles y válvulas — cómo se diseñan inflables SUPs.
      icon: tabler:anchor
      topics:
        - Cómo se hacen los SUPs inflables
        - PVC capas de laminado explicadas
        - Construcción de rieles y costuras
        - Drop-stitch inmersión profunda en la tecnología
        - Arte de mazo EVA explicado
    - title: Conocimiento de seguridad
      description: Conocimientos esenciales de seguridad para cada piragüista — desde la selección de PFD hasta la interpretación del clima y las técnicas de auto-rescate.
      icon: tabler:shield
      topics:
        - SUP lista de verificación de seguridad
        - ¿Necesitas un chaleco salvavidas?
        - Guía de seguridad para remar en el océano
        - Seguridad en ríos y corrientes para palistas
        - Conciencia sobre las condiciones del clima y del agua
    - title: Tecnología
      description: 'La ingeniería detrás de los productos Paddle Board Overstock: materiales, métodos de construcción y pruebas de calidad.'
      icon: tabler:microscope
      topics:
        - Tecnología PVC de grado marino
        - Explicación del núcleo Drop-stitch
        - Por qué PSI es importante para SUPs inflables
        - Soldadura por RF vs unión adhesiva
        - Pruebas de calidad en cada tabla
    - title: Conocimiento para Clubes y Alquileres
      description: Guías prácticas para ejecutar un programa SUP — desde operaciones de alquiler hasta flotas de resorts y clubes.
      icon: tabler:briefcase
      topics:
        - Cómo iniciar un negocio de alquiler SUP
        - Construcción de un centro de deportes acuáticos en un resort
        - Dimensionamiento de flotas de tablas de paddle surf para clubes
        - Inflable vs duro SUP para uso comercial
        - Mejores tablas SUP para flotas de alquiler
        - Estrategias de ingresos de deportes acuáticos en complejos turísticos
        - Guía de mantenimiento de equipos comerciales.
