hero:
  tagline: Hoteles, complejos turísticos y hospitalidad
  title: Experiencias Premium frente al mar<br />Para hoteles, complejos turísticos y clubes náuticos
  subtitle: Programas de deportes acuáticos llave en mano para hoteles frente a la playa, complejos turísticos en islas privadas, clubes de playa y clubes náuticos, desde equipos para huéspedes y embarcaciones neumáticas hasta sistemas de seguridad y capacitación del personal.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Embarcaciones inflables Aquafarer para actividades frente al mar en el resort
direct_answer: Aquafarer se asocia con hoteles, complejos turísticos, islas privadas, clubes de playa y clubes de yates en todo el mundo para crear experiencias premium frente al mar. Nuestras soluciones incluyen flotas de alquiler de SUP, kayaks para visitas guiadas, embarcaciones neumáticas auxiliares para transporte de invitados, pequeñas embarcaciones neumáticas de lujo para traslados a clubes de playa y sistemas completos de seguridad. Cada pieza de equipo puede llevar el logotipo y la combinación de colores de su propiedad. También brindamos capacitación al personal, consultas sobre el diseño de programas y planificación de reemplazo de flotas para garantizar una calidad constante en todas las estaciones.
solution_offerings:
  - title: Paquete estándar de resort
    subtitle: Para propiedades pequeñas y medianas (50 a 150 habitaciones)
    badge: Popular
