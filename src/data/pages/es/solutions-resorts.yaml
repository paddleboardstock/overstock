testimonial:
  content: Paddle Board Overstock diseñó y equipó todo nuestro programa de actividades de playa en tres propiedades del resort. 120 SUPs, infraestructura de seguridad y capacitación del personal, todo entregado en un solo envío. La participación de nuestros huéspedes en actividades acuáticas aumentó un 60% en la primera temporada.
  name: Sofía Laurent
  title: Director de Experiencia del Huésped, Azure Bay Resorts - Phuket, Tailandia
content_segments:
  tagline: Perfiles de complejos turísticos
  title: Soluciones de Hospitalidad Frente al Agua<br />Por Tipo de Propiedad
  subtitle: Cada propiedad turística tiene un perfil de huésped, una combinación de actividades y un ritmo operativo únicos, desde alojamientos ecológicos boutique hasta complejos turísticos de lujo frente a la playa. Diseñamos programas de deportes acuáticos que coinciden con la clase de propiedad y las expectativas de los huéspedes.
  items:
    - title: Resorts de lujo frente a la playa
      subtitle: Traslados VIP, actividades acuáticas, experiencia premium para huéspedes.
      description: 'Propiedades de alta gama frente a la playa (Four Seasons, Aman y grupos de lujo similares) donde los deportes acuáticos son un servicio destacado para los huéspedes que genera puntuaciones de satisfacción e ingresos auxiliares. La flota debe lucir premium, ofrecer variedad en todos los grupos de edad y niveles de habilidad, e integrarse perfectamente con los sistemas de reserva y conserjería existentes del resort. Las expectativas de apariencia de los huéspedes son extremadamente altas: el estado y la presentación del equipo afectan directamente las reseñas de 5 estrellas.'
      features:
        - Flota de SUPs de marca premium en colores coincidentes con el resort
        - 'Presentación lista para huéspedes: colores coincidentes con el resort, logo de la marca, exhibición de equipo preparada'
        - Tablas de la serie de arte exclusiva para experiencias de huéspedes premium y momentos fotográficos
        - 'Infraestructura de seguridad integrada: líneas de boyas, estaciones de socorristas, DEA'
        - 'Gestión de ingresos: plantillas de precios dinámicos, capacitación en ventas adicionales, paquetes combinados'
    - title: Resorts en islas privadas
      subtitle: Actividades acuáticas tranquilas y autosuficientes para invitados
      description: 'Los resorts privados en islas operan en lugares remotos donde la logística es compleja y cada entrega cuenta. Las actividades acuáticas para los huéspedes deben ser autosuficientes: equipos que se almacenen de forma compacta, se inflan bajo demanda, requieren un mantenimiento mínimo y se presentan de forma excelente a la llegada de los huéspedes. Planificamos los programas de flota en torno a las ventanas de hidroaviones y cargas marítimas, y nuestra construcción resistente mantiene el equipo listo para los visitantes durante largas temporadas sin apoyo del continente.'
      features:
        - Flota compacta de inflables — barcos y suministros de forma eficiente en islas remotas
        - Construcción de grado comercial PVC para uso de invitados durante varias temporadas
        - Mantenimiento sencillo in situ con kits de reparación incluidos y guía en vídeo
        - Marca personalizada de resort que combina con la estética de la isla
    - title: Resorts ecológicos y junto al lago
      subtitle: Experiencias para huéspedes integradas en la naturaleza
      description: Propiedades junto al lago, eco-lodges y retiros naturales que ofrecen actividades acuáticas tranquilas y de bajo impacto que complementan el entorno natural. El equipo debe ser no motorizado siempre que sea posible, fácil de almacenar donde el espacio es limitado y silencioso en uso para preservar la experiencia ambiental de todos los huéspedes.
      features:
        - Flota no motorizada SUP en una serie de arte inspirada en la naturaleza
        - Estaciones silenciosas de inflado de bombas eléctricas para uso bajo demanda de los invitados
        - Materiales y embalajes ecológicos alineados con la marca sostenible
        - Los racks de almacenamiento y los sistemas de organización en el muelle incluían
    - title: Clubes de playa
      subtitle: Entretenimiento para invitados y ambiente frente al mar
      description: Los clubes de playa operan en un entorno de alta energía y enfoque visual, donde el equipo forma parte del ambiente. Necesitan tablas de remo elegantes para el entretenimiento de los invitados, SUP alquileres para actividades junto a la playa y equipamiento que tenga un aspecto tan bueno como el propio recinto. La flota debe ser fácil de operar, soportar el uso diario de huéspedes con distintos niveles de habilidad y desplegarse rápidamente en horas punta.
      features:
        - Serie artística SUPs emblemática que también sirve de decoración para el espacio
        - Flota lista para alquiler SUP y entretenimiento para invitados
        - Color personalizado y marca que combinan con la identidad visual del club de playa
        - Sistemas de lanzamiento y recuperación rápida para operaciones de alta rotación
        - UV- construcción resistente para exposición diaria al agua salada
    - title: Clubes privados y clubes náuticos
      subtitle: Deportes acuáticos y programas exclusivos de remo
      description: Clubes privados donde los deportes acuáticos son un beneficio para los socios y no un generador de ingresos. El equipamiento debe cumplir con estándares estéticos más altos, estar disponible bajo demanda para los socios y requerir una supervisión mínima del personal. Los clubes náuticos de la marina utilizan SUP flotas de marca para la recreación de los socios alrededor del puerto. El almacenamiento y mantenimiento deben ser invisibles para los miembros.
      features:
        - SUP Flotas premium de marca para deportes acuáticos miembros
        - 'Equipamiento premium: EVA cubiertas, colores personalizados de los miembros, tapicería de marca'
        - Sistema de autoservicio para acceso a miembros sin personal
        - Almacenamiento fuera de temporada y programa anual de refresco
    - title: Hoteles enfocados en aventuras y actividades
      subtitle: Visitas guiadas, SUP yoga, excursiones de snorkel, actividades grupales.
      description: Propiedades que se posicionan como destinos de aventura, ofreciendo visitas guiadas, SUP yoga, remo al atardecer, excursiones de snorkel y actividades grupales. La flota debe admitir modelos de programas guiados y de alquiler gratuito, con equipos que realicen una transición perfecta entre el uso propio de los huéspedes y los recorridos guiados por un instructor. Estas propiedades necesitan equipos duraderos para una rotación de alta frecuencia, con una fácil limpieza entre grupos de huéspedes.
      features:
        - Flota mixta versátil que soporta modelos de tours guiados de alquiler +
        - Plataformas extraestables SUP para actividades grupales
        - 'Equipo para guías: tablas para instructores, cajas secas, comunicaciones impermeables'
        - 'Rotación de equipos por temporada: flota de verano → programa de almacenamiento de invierno'
        - Construcción durable diseñada para el uso diario de los huéspedes con mantenimiento mínimo
