  - title: Paquete Resort Premium
    subtitle: Para propiedades de lujo y operaciones a gran escala
    badge: Premium
    features:
      - title: Flota Premium
        description: Más de 50 a 100 SUP, kayaks, botes a pedal y embarcaciones neumáticas auxiliares con personalización completa
      - title: Seguridad avanzada
        description: Torres de salvavidas, sistema de radio, tablero de rescate, DEA y plan de acción de emergencia
      - title: Experiencia del huésped
        description: Quiosco de check-in, exhibición de equipos, cabañas para cambiarse, almacenamiento junto a la playa
      - title: Programa de ingresos
        description: Guía dinámica de precios, capacitación en ventas adicionales, estrategias de agrupación de paquetes
      - title: Soporte estacional
        description: Almacenamiento fuera de temporada, inspección de final de temporada, pedidos de actualización
