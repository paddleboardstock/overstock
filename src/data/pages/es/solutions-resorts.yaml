testimonial:
  content: Aquafarer diseñó y equipó todo nuestro programa de actividades en la playa en tres propiedades del resort. 80 SUP, 40 kayaks, infraestructura de seguridad y capacitación del personal, todo entregado en un solo envío. La participación de nuestros huéspedes en actividades acuáticas aumentó un 60% en la primera temporada.
  name: Sofía Laurent
  title: Director de Experiencia del Huésped, Azure Bay Resorts - Phuket, Tailandia
content_segments:
  tagline: Perfiles de complejos turísticos
  title: Soluciones hoteleras frente al mar<br />Por tipo de propiedad
  subtitle: Cada propiedad turística tiene un perfil de huésped, una combinación de actividades y un ritmo operativo únicos, desde alojamientos ecológicos boutique hasta complejos turísticos de lujo frente a la playa. Diseñamos programas de deportes acuáticos que coinciden con la clase de propiedad y las expectativas de los huéspedes.
  items:
    - title: Resorts de lujo frente a la playa
      subtitle: Traslados VIP, actividades acuáticas, experiencia premium para huéspedes.
      description: 'Propiedades de alta gama frente a la playa (Four Seasons, Aman y grupos de lujo similares) donde los deportes acuáticos son un servicio destacado para los huéspedes que genera puntuaciones de satisfacción e ingresos auxiliares. La flota debe lucir premium, ofrecer variedad en todos los grupos de edad y niveles de habilidad, e integrarse perfectamente con los sistemas de reserva y conserjería existentes del resort. Las expectativas de apariencia de los huéspedes son extremadamente altas: el estado y la presentación del equipo afectan directamente las reseñas de 5 estrellas.'
      features:
        - 'Flota premium de marca: SUP, kayaks, botes a pedal y pequeños tenders RIB'
        - 'Presentación lista para los huéspedes: colores a juego con el resort, marca con logotipo, exhibición escenificada de equipos'
        - Pequeño RIB de lujo para traslados de huéspedes VIP con tapicería personalizada y colores a juego
        - 'Infraestructura de seguridad integrada: líneas de boyas, puestos de salvavidas, DEA'
        - 'Gestión de ingresos: plantillas de precios dinámicos, capacitación en ventas adicionales, agrupación de paquetes'
    - title: Resorts en islas privadas
      subtitle: 'Transporte de huéspedes en todo tipo de clima: cero tiempo de inactividad, confiabilidad absoluta'
      description: Los complejos turísticos de islas privadas operan en lugares remotos donde el barco es la única conexión con el continente. Los traslados diarios de huéspedes, los recorridos de suministros y las evacuaciones médicas de emergencia dependen de un solo barco; cualquier tiempo de inactividad afecta directamente la experiencia de los huéspedes y las operaciones del resort. Estos operadores necesitan un barco que funcione de manera confiable en todas las condiciones climáticas, requiera un mantenimiento mínimo y tenga sistemas de respaldo para una confiabilidad de misión crítica. El barco también debe presentar un bonito aspecto cuando los huéspedes lleguen a la isla.
      features:
        - Configuración RIB para todo clima con protección climática completa y tubos reforzados
        - Previsión de motor doble o motor de respaldo para operaciones sin tiempo de inactividad
        - Construcción de Hypalon de grado comercial para una vida útil de 5-8 años en zonas remotas
        - Diseño de fácil mantenimiento con componentes accesibles para el servicio en el sitio
        - Marca personalizada del resort y tapicería premium acorde con la estética de la isla
    - title: Resorts ecológicos y junto al lago
      subtitle: Experiencias para huéspedes integradas en la naturaleza
      description: Propiedades junto al lago, albergues ecológicos y retiros en la naturaleza que ofrecen actividades acuáticas tranquilas y de bajo impacto que complementan el entorno natural. El equipo debe ser no motorizado siempre que sea posible, fácil de almacenar en cobertizos para botes con espacio limitado y de uso silencioso para preservar la experiencia ambiental para todos los huéspedes.
      features:
        - 'Flota no motorizada: SUP, kayaks, canoas y botes a pedal'
        - Estaciones de inflado con bombas eléctricas silenciosas para uso de los huéspedes a demanda
        - Materiales y empaques ecológicos alineados con el branding de sostenibilidad
        - Incluye estanterías y sistemas de organización para cobertizos de botes
    - title: Clubes de playa
      subtitle: Traslados de invitados, entretenimiento, pequeñas embarcaciones neumáticas de lujo.
      description: 'Los clubes de playa operan en un ambiente de alta energía y enfocado visualmente donde el equipo es parte de la atmósfera. Necesitan pequeñas embarcaciones neumáticas de lujo para el traslado de huéspedes desde hoteles o muelles cercanos, y juguetes acuáticos para entretener a los huéspedes: remolque de motos acuáticas, toboganes inflables y tablas de remo. La flota debe tener un aspecto elegante, ser fácil de operar y resistir el uso diario por parte de huéspedes con distintos niveles de habilidad. El almacenamiento y la implementación rápida son fundamentales durante las horas pico.'
      features:
        - RIB de lujo compacto (3,3-4,3 m) para traslados de huéspedes y servicio de tender
        - 'Juguetes acuáticos: inflables remolcables, tablas de SUP, kayaks para el entretenimiento de los huéspedes'
        - Color y marca personalizados a juego con la identidad visual del club de playa
        - Sistemas rápidos de botadura y recuperación para operaciones de alta rotación
        - Construcción duradera de Hypalon para exposición diaria al agua salada y los UV
    - title: Clubes privados y clubes náuticos
      subtitle: Transporte portuario, licitaciones asociadas, deportes acuáticos exclusivos.
      description: 'Los clubes privados donde los deportes acuáticos y el transporte en barco son un beneficio para los miembros más que un generador de ingresos. El equipo debe cumplir con estándares estéticos más altos, estar disponible a pedido de los miembros y requerir una supervisión mínima del personal. Los clubes de yates deportivos necesitan específicamente licitaciones para el transporte portuario: trasladar a sus miembros entre el muelle, el amarre y la costa. El almacenamiento y el mantenimiento deben ser invisibles para los miembros.'
      features:
        - Tenders RIB de alta gama para transporte portuario y servicio de traslado de miembros
        - 'Equipamiento premium: cubiertas de EVA, colores personalizados para los miembros, tapicería con marca'
        - Sistema de retiro de autoservicio para el acceso de los miembros sin personal
        - Almacenamiento fuera de temporada y programa de actualización anual
    - title: Hoteles enfocados en aventuras y actividades
      subtitle: Visitas guiadas, SUP yoga, excursiones de snorkel, actividades grupales.
      description: Propiedades que se posicionan como destinos de aventura, ofreciendo visitas guiadas, SUP yoga, remo al atardecer, excursiones de snorkel y actividades grupales. La flota debe admitir modelos de programas guiados y de alquiler gratuito, con equipos que realicen una transición perfecta entre el uso propio de los huéspedes y los recorridos guiados por un instructor. Estas propiedades necesitan equipos duraderos para una rotación de alta frecuencia, con una fácil limpieza entre grupos de huéspedes.
      features:
        - Flota mixta versátil compatible con modelos de alquiler + tours guiados
        - Kayaks tándem y plataformas SUP extra estables para actividades grupales
        - 'Equipamiento para guías: tablas de instructores, cajas secas, comunicaciones impermeables'
        - 'Rotación estacional de equipos: flota de verano → programa de almacenamiento invernal'
        - Construcción duradera certificada para uso diario por los huéspedes con mantenimiento mínimo
