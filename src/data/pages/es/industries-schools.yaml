hero:
  tagline: Escuelas de deportes acuáticos y centros de entrenamiento
  title: Soluciones de equipos<br />Para escuelas de SUP y kayak
  subtitle: Equipo confiable y de calidad comercial para escuelas de remo, instrucción de surf, entrenamiento de kayak y programas educativos de deportes acuáticos a cualquier escala.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Tablas de SUP Aquafarer para escuelas y centros de entrenamiento
direct_answer: 'Aquafarer suministra a las escuelas de SUP y kayak de todo el mundo tablas, equipos de seguridad y paquetes de instructor de calidad comercial. Nuestro equipo está diseñado para el uso educativo diario: PVC más grueso, núcleos de costura reforzados y diseños de casco estables que brindan confianza a los principiantes y confiabilidad a los instructores. Los paquetes incluyen marcas personalizadas, programas de repuestos y recursos de capacitación.'
solution_offerings:
  - title: Paquete de inicio escolar
    subtitle: Para nuevos programas y pequeños centros de formación
    badge: Popular
    features:
      - title: Tablas para estudiantes
        description: De 10 a 25 tablas de SUP polivalentes o kayaks recreativos con plataformas estables para lecciones para principiantes
      - title: Tablas para instructores
        description: Tablas más anchas y largas con mayor estabilidad y cubiertas de EVA antideslizantes para entrenar
      - title: Equipo de seguridad
        description: Chalecos salvavidas, correas, silbatos y bolsas arrojadizas en colores a juego
      - title: Almacenamiento y transporte
        description: Soportes para tablas apilables, soportes acolchados para kayak y plataformas rodantes de transporte
      - title: Apoyo curricular
        description: Plantillas de lecciones, listas de verificación de seguridad y guías de progresión de habilidades
    cta_text: Comenzar mi paquete escolar
    cta_href: /contact
  - title: Paquete escolar premium
    subtitle: Para escuelas establecidas y operadores de programas múltiples
    badge: Best Value
    features:
      - title: Flota completa
        description: 25 a 50 tablas o kayaks con flota mixta (todo terreno, turismo, tallas para jóvenes)
      - title: Flota de instructores
        description: De 3 a 5 tableros de instructor especializados con soportes para sistema de sonido incorporados
      - title: Estación de seguridad
        description: Estación centralizada de equipo de seguridad con PFD, radios, primeros auxilios y señalización.
      - title: Paquete de marca
        description: Impresión completa de logotipos en tablas, remos, chalecos salvavidas y uniformes.
      - title: Programa de mantenimiento
        description: Kits de mantenimiento trimestrales, paquetes de repuestos y capacitación en reparación
    cta_text: Configurar mi paquete Premium
    cta_href: /contact
  - title: Paquete de franquicia escolar
    subtitle: Para cadenas con múltiples ubicaciones y operadores de franquicias
    badge: Enterprise
    features:
      - title: Estandarización de flotas
        description: Equipo idéntico en todas las ubicaciones para una experiencia estudiantil consistente
      - title: Pedidos centrales
        description: Pedidos consolidados, precios al por mayor y gestión centralizada de repuestos
      - title: Formación de instructores
        description: Certificación de manejo y mantenimiento de equipos para todos los instructores.
      - title: Marca compartida
        description: Branding conjunto con franquicia + opciones de co-branding Aquafarer
      - title: Soporte de expansión
        description: Consulta de escalamiento, previsión de equipos y configuración de nuevas ubicaciones.
    cta_text: Discutir el plan de franquicia
    cta_href: /contact
benefits:
  - title: Construido para la instrucción diaria
    description: El PVC más grueso y los rieles reforzados resisten el uso diario de los estudiantes, caídas sobre arena y aterrizajes rocosos.
    icon: tabler:shield
  - title: Plataformas de aprendizaje estables
    description: Los cascos más anchos y los balancines más planos dan confianza a los principiantes. Los instructores se centran en la enseñanza, no en el equipamiento.
    icon: tabler:scale
  - title: Fácil almacenamiento y transporte
    description: Tiendas hinchables de diseño en espacios reducidos. Las tablas desinfladas caben en los maleteros de los vehículos estándar para la enseñanza móvil.
    icon: tabler:box-seam
  - title: Marca personalizada
    description: Logotipos y colores de la escuela en cada tablero. Tu marca, tu identidad, no equipo de alquiler genérico.
    icon: tabler:brush
content_segments:
  tagline: Perfiles escolares
  title: Soluciones educativas para deportes acuáticos<br />Por tipo de programa
  subtitle: Las escuelas de remo, las academias de surf, los programas universitarios y los operadores de franquicias enfrentan diferentes desafíos operativos, desde la integración del plan de estudios hasta la estandarización de flotas en múltiples ubicaciones. Configuramos paquetes de equipos acordes al modelo educativo.
  items:
    - title: Escuelas independientes de SUP y kayak
      subtitle: Centros de formación operados por propietarios
      description: Escuelas pequeñas y medianas dirigidas por instructores propietarios que ofrecen lecciones de SUP, entrenamiento en kayak y cursos de certificación. El equipo debe ser lo suficientemente duradero para el uso educativo diario, asequible para el presupuesto de una pequeña empresa y lo suficientemente versátil para atender a estudiantes principiantes hasta intermedios en una sola flota.
      features:
        - Tablas SUP polivalentes estables y kayaks recreativos para clases de principiantes
        - Tablas específicas para instructores con estabilidad adicional para enseñar desde el agua
        - Plantillas de planes de clase y guías de progresión de habilidades incluidas
        - Programa anual de renovación de equipos con descuentos por entrega a cambio
    - title: Programas de recreación universitaria y universitaria
      subtitle: Flotas de ocio estudiantil a gran escala
      description: Los departamentos de recreación de la universidad operan clubes de pádel, programas de alquiler y cursos de instrucción como parte de las ofertas de recreación del campus. El equipo enfrenta un uso máximo durante los semestres, requiere sistemas sencillos de registro y salida y debe soportar diversos niveles de habilidad, desde estudiantes primerizos hasta remeros avanzados.
      features:
        - Construcción en PVC de alta durabilidad calificada para ciclos de uso institucional
        - Flotas codificadas por colores según el nivel para una gestión sencilla
        - Compatibilidad con sistemas de seguimiento de inventario basados en RFID o etiquetas
        - Precios al por mayor con pedidos y condiciones de pago semestrales
    - title: Escuelas y academias de surf
      subtitle: Programas de instrucción de surf costero.
      description: 'Escuelas de surf que enseñan habilidades de SUP surf, remo boca abajo y kayak de surf en ambientes oceánicos. El equipo debe soportar las condiciones de la zona de surf: resistencia al impacto, tolerancia a la arena y al agua salada, y fácil rotación de enjuague y devolución entre lecciones por hora.'
      features:
        - Formas específicas de surf con rieles reforzados y construcción resistente a impactos
        - Opciones de aletas flexibles y correas enrolladas para la seguridad de los estudiantes
        - Tejido de enjuague rápido que se seca entre rotaciones de clases
        - Programa de reemplazo de flota con inspección y renovación al final de la temporada
    - title: Franquicias y cadenas con múltiples ubicaciones
      subtitle: Equipo estandarizado en todas las ubicaciones
      description: 'Operadores con múltiples ubicaciones que ejecutan programas de capacitación estandarizados en múltiples ciudades o regiones. La coherencia de la flota en todas las ubicaciones es primordial: todos los estudiantes deben tener la misma experiencia con el equipo independientemente de la ubicación de la franquicia que visiten. Los pedidos centralizados, la uniformidad de la marca y el soporte de escalamiento son esenciales.'
      features:
        - Especificaciones de flota idénticas en todas las ubicaciones de franquicia
        - Pedidos centralizados y consolidados con precios por volumen
        - 'Opciones de co-branding: marca de franquicia + co-branding de Aquafarer'
        - 'Kit de apertura de nueva ubicación: equipo, señalética e inventario inicial'
