hero:
  tagline: Estilo de vida
  title: El Paddle Board Overstock<br />Estilo de vida
  subtitle: Diseñado para quienes viven en el agua — desde exploradores de fin de semana hasta remadores diarios que cuentan los días entre sesiones.
values:
  - icon: 🌊
    title: Nacido en el Agua
    desc: Cada diseño comienza con la comprensión de cómo se comporta el agua. Diseñamos desde el borde de las condiciones hacia adentro — porque el océano es nuestro maestro, no nuestro lugar de trabajo.
  - icon: 🔧
    title: Hecho para Durar
    desc: El producto más sostenible es aquel que no necesita ser reemplazado. Materiales de grado marino, núcleos drop-stitch calificados hasta 15 PSI, y costuras que duran más que la temporada.
  - icon: 🏆
    title: Accesible por Diseño
    desc: Los deportes acuáticos no deberían ser un lujo. Rendimiento de nivel profesional a un precio que tenga sentido para familias, guías y remadores cotidianos — no solo para profesionales.
  - icon: 🌍
    title: Comunidad Global
    desc: 'Desde la costa de Weihai hasta lagos en Europa, ríos en el Sudeste Asiático y bahías en las Américas — nuestros clientes tienen algo en común: el amor por estar en el agua.'
  - icon: ♻️
    title: Fabricación Responsable
    desc: Cortes de anidamiento optimizados CNC reducen los desechos de material a menos del 5%. La construcción duradera reduce los ciclos de reemplazo. Construimos para la longevidad porque esa es la opción más sostenible.
  - icon: 🤝
    title: Soporte que Perdura
    desc: Tablas que construimos hace años todavía nos llaman por repuestos. Nuestra respuesta de garantía promedia 24 horas. No desaparecemos después de la venta — estamos aquí durante toda la vida del producto.
