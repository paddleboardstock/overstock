hero:
  tagline: Laboratorio de Control de Calidad
  title: Laboratorio de Pruebas y Aseguramiento de Calidad
  subtitle: Laboratorio de calidad independiente — cada unidad se prueba antes del envío
intro: Paddle Board Overstock opera un laboratorio dedicado de control de calidad que funciona de manera independiente a la producción. Cada lote de materia prima y cada tablero terminado pasa por protocolos de inspección documentados antes de su liberación. Nuestro equipo de QC informa directamente a la gerencia, garantizando decisiones de calidad imparciales.
highlights:
  - value: 100%
    label: Unidades sometidas a prueba de presión
    detail: Cada cámara, cada tablero
  - value: 48 h
    label: Duración de la prueba de retención de aire
    detail: A 1,25× presión nominal
  - value: '&lt;5%'
    label: Caída máxima de presión permitida
    detail: Durante un período de mantenimiento de 24 horas
  - value: 99.3%
    label: Tasa libre de defectos
    detail: Envíos de los últimos 12 meses
test_procedures:
  - title: Inspección de materia prima
    description: Cada lote entrante de PVC, tela drop-stitch, espuma EVA y hardware se prueba antes de su aceptación. Se verifica la resistencia a la tracción, la resistencia al desgarro y la resistencia a UV. Los materiales no conformes se aíslan y se devuelven.
    standards:
      - Resistencia a la tracción (mínimo 350 N/cm)
      - Resistencia al desgarro
      - Resistencia a UV (1.000 h)
  - title: Puntos de verificación de QC en proceso
    description: Los operadores de producción realizan autoinspección en cada etapa. Los auditores de QC realizan muestreos aleatorios durante el turno. Se realizan pruebas de despegue de soldadura cada 50 unidades. Las verificaciones dimensionales se realizan en cada vigésimo panel.
    standards:
      - Prueba de despegue cada 50 unidades
      - Lista de verificación interna de 100 puntos
      - Auditorías de muestreo aleatorio
  - title: Prueba de retención de aire de 48 horas
    description: Cada cámara del tubo se infla al 125% de la presión nominal y se mantiene durante 48 horas. Los sensores de presión registran continuamente con compensación de temperatura. Cualquier cámara que exceda una caída de presión del 5% activa automáticamente una re-inspección del lote.
    standards:
      - Mantenimiento a 1,25× presión nominal
      - '&lt;5% caída máxima de presión'
  - title: Pruebas de Carga y Equilibrio
    description: Los tableros terminados se prueban a la capacidad máxima nominal para estabilidad, flotabilidad y manipulación. Cada tablero pasa por prueba de agua antes de la aprobación de la inspección final.
    standards:
      - Verificación de carga nominal 1,25x
      - Pruebas de agua
equipment:
  - name: Máquina de Ensayo Universal (tracción)
