values:
  - title: La calidad primero
    desc: Cada barco que sale de nuestra fábrica supera pruebas obligatorias de retención de aire, pelado de costuras y de sistemas antes del envío.
  - title: Integración vertical
    desc: Controlamos cada etapa — desde el corte del PVC hasta el ensamblaje final — eliminando las ineficiencias de los contratistas y garantizando una calidad constante.
  - title: Seguridad como estándar
    desc: La certificación CE es parte esencial de lo que fabricamos. Nuestros 64 modelos con certificación CE cumplen los estándares de seguridad de la UE para uso recreativo y comercial.
  - title: Centrados en el socio
    desc: Construimos relaciones a largo plazo con socios OEM, ODM y de marca privada a través de la transparencia, la fiabilidad y el crecimiento compartido.
services:
  - title: Fabricación OEM
    desc: Fabricamos según tus especificaciones. Comparte tus planos y nuestro equipo de ingeniería se encarga del prototipado, el utillaje y la producción.
  - title: Soluciones ODM
    desc: Parte de nuestros diseños de plataforma probados. Personaliza tamaño, color, gráficos y embalaje para crear tu línea de productos única.
  - title: Marca privada
    desc: Tu nombre de marca, tu logotipo, tu embalaje. Los productos llegan listos para la venta minorista con integración completa de la marca.
  - title: Personalización de marca
    desc: Impresión en las almohadillas de cubierta, gráficos del casco, calcomanías en los tubos y etiquetas personalizadas — presencia de marca coherente en cada superficie.
certifications:
  - name: Certificación CE
    desc: Nuestros botes y embarcaciones cumplen con la Directiva de Embarcaciones de Recreo de la UE (2013/53/UE) y las normas armonizadas pertinentes.
    scope: Botes y embarcaciones
  - name: ISO 9001
    desc: Sistema de gestión de calidad certificado para el diseño, la fabricación y la distribución de embarcaciones inflables.
    scope: Toda la instalación
  - name: ISO 6185
    desc: Botes inflables — requisitos de seguridad y rendimiento para botes inflables reforzados y de casco rígido.
    scope: Líneas RIB e inflables
