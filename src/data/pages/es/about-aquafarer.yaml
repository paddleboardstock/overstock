factory_details:
  - label: Tamaño de la instalación
    value: Campus integrado de 12.000 m² (130.000 ft²) en la Zona de Desarrollo Económico de Qingdao
  - label: Capacidad anual
    value: 15.000 barcos, incluidos SUP, kayaks, botes, RIB y equipos de seguridad
  - label: Equipo de I+D
    value: Más de 25 ingenieros en diseño de productos, ciencia de materiales e ingeniería de calidad
  - label: Equipamiento clave
    value: Mesas de corte CNC, soldadoras dieléctricas RF, selladoras de aire caliente, impresoras digitales, moldes de fibra de vidrio, bancos de pruebas de retención de aire
  - label: Líneas de producción
    value: '6 líneas dedicadas: corte de PVC, soldadura de tubos, laminado de cascos de fibra de vidrio, ensamblaje de SUP, ensamblaje de RIB, control de calidad final'
  - label: Volumen de exportación anual
    value: Más de 8 millones de USD exportados a más de 50 países de Europa, América, Asia-Pacífico y Oriente Medio
