  tagline: Acerca de
  title: Acerca de {SITE}
  subtitle: Un fabricante de deportes acuáticos verticalmente integrado — desde la materia prima hasta el barco terminado
intro:
  - 'Aquafarer se fundó en 2012 con una única misión: diseñar y fabricar equipos de deportes acuáticos que rindan tan bien en el agua como en el informe de calidad. Lo que comenzó como un taller especializado en tablas de SUP ha crecido hasta convertirse en una instalación de fabricación integrada de 12.000 metros cuadrados en la Zona de Desarrollo Económico de Qingdao, que produce botes inflables, RIB, kayaks, tablas de SUP, equipos de seguridad y accesorios para clientes en más de 50 países.'
  - Hoy en día, Aquafarer opera como una marca de fábrica — diseñamos, desarrollamos, creamos prototipos, fabricamos y probamos todo bajo un mismo techo. Esta integración vertical nos da control directo sobre la selección de materiales, la calidad de construcción y los plazos de entrega. Cada barco es construido por nuestra gente, con nuestros equipos, según nuestros estándares.
  - Atendemos a usuarios recreativos, operadores comerciales, agencias gubernamentales y socios de marca en todo el mundo. Nuestros programas OEM y ODM ayudan a las empresas a lanzar sus propias líneas de productos sin invertir en infraestructura de fábrica. Ya sea que necesites un solo prototipo o una producción completa, nuestro equipo te guía desde el concepto hasta la entrega lista para navegar.
