hero_text:
  tagline: Contacto
  title: PONTE EN CONTACTO
contact_form:
  id: form
  title: Envíanos un mensaje
  subtitle: Para preguntas sobre pedidos, consejos de tallas o soporte de productos, envíanos un mensaje. Respondemos en un día hábil.
  email_to: info@paddleboardoverstock.com
  submit_button: Enviar consulta → Obtener una cotización
  success_message: ¡Gracias! Tu mensaje ha llegado a nuestra bandeja de entrada. Respondemos en un día hábil.
  error_message: Algo salió mal al enviar tu mensaje. Por favor, inténtalo de nuevo o envíanos un correo directamente.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: por favor resuelve lo siguiente'
  fields:
    - name: Nombre
      label: Nombre
      row: 1
    - name: Apellido
      label: Apellido
      row: 1
    - name: nombre de empresa
      label: nombre de empresa
      row: 2
    - name: address
      label: Dirección
      row: 3
    - name: zip
      label: Código Postal
      row: 4
    - name: country
      label: País
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Correo electrónico
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: Volumen de pedido
      label: Volumen estimado del pedido
      row: 6
      type: select
      options:
        - value: ''
          label: ¿Cuántas tablas estás comprando?...
        - value: one
          label: Solo una tabla
        - value: 2-4
          label: 2–4 tablas
        - value: 5-plus
          label: 5+ tablas (familia, club o alquiler)
    - name: customization
      label: ¿Con qué podemos ayudarte?
      row: 7
      type: select
      options:
        - value: ''
          label: Selecciona un tema...
        - value: none
          label: Pregunta general sobre el producto
        - value: sizing
          label: Ayuda para elegir la tabla correcta
        - value: order
          label: Pedido, pago o envío
        - value: warranty
          label: Soporte de garantía o reparación
    - name: interés del producto
      label: Categorías de productos de interés
      row: 8
      type: select
      options:
        - value: ''
          label: Seleccionar categoría de producto...
        - value: all
          label: Todos los productos / Catálogo completo
        - value: sup
          label: SUP Tablas / Paddleboards
        - value: packages
          label: Paquetes completos SUP
        - value: accessory
          label: Accesorios (bombas, remos, bolsas)
    - name: subject
      label: Asunto
      row: 9
    - name: message
      label: Mensaje
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Otras formas de contactarnos
  columns: 3
  items:
    - title: Ayuda con pedidos
      description: Preguntas sobre productos, asesoramiento de tallas y soporte de pedidos.
      icon: tabler:shopping-bag
    - title: Soporte técnico
      description: Garantía, reparaciones, repuestos y preguntas de funcionamiento.
      icon: tabler:tool
    - title: Prensa y asociaciones
      description: Kits de medios, patrocinio y colaboración en la industria.
      icon: tabler:news
    - title: Teléfono
      description: +1 279 732 3333 (HQ EE.UU.) · +86 13305324192 (fábrica)
      icon: tabler:headset
    - title: Correo electrónico
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: HQ Global y Facturación
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Nuestra Ubicación
  subtitle: Visita nuestro centro de fabricación en Weihai
  address: Weihai, Shandong, China
  zoom: 15
