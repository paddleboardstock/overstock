hero:
  tagline: África
  title: SUP Tablas mayoristas para<br />Minoristas y operadores africanos
  subtitle: Operadores de turismo costero y minoristas de deportes acuáticos en toda África — tablas nuevas de excedente SUP de 5 unidades, modelos mixtos, exprés o marítimo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tableros de sobrestock SUP para minoristas y operadores costeros africanos
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas SUP en exceso a empresas de toda África — desde Sudáfrica y Kenia hasta Marruecos, Ghana, Tanzania y Egipto. Los pedidos mayoristas comienzan en 5 tablas con modelos mixtos en un solo envío, enviadas desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada placa está 100% sometida a prueba de presión y cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Sirviendo a los mercados turísticos costeros desde el norte de África hasta el Cabo
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El SUP mercado africano
  paragraphs:
    - Africa's coastline runs tens of thousands of kilometers through wildly different water worlds — the Atlantic surf towns of Morocco and South Africa, the reef-protected lagoons of Kenya and Tanzania, the Red Sea resorts of Egypt, and the growing beach scenes of West Africa. In each of them, stand-up paddle is finding its audience: turistas que buscan una primera actividad acuática segura, y locales que construyen auténticas comunidades de piragüismo.
    - 'Las empresas que compran SUP tablas aquí suelen ser pequeñas y emprendedoras: tiendas de surf que añaden una opción de aguas tranquilas, resorts de playa que crean programas de actividades, operadores de buceo y deportes acuáticos ampliando su oferta, y lodges de safari y playa que añaden paddles al atardecer. Piden en pequeñas flotas y necesitan tablas que funcionen el primer día y aguanten temporada tras temporada.'
  customer_types:
    - title: Complejos y Lodges costeros
      description: Resorts de playa y safaris y lodges de playa añadiendo SUP sesiones para los huéspedes — pequeñas flotas mixtas, fácil reposición estacional.
    - title: Operadores de Deportes Acuáticos y Buceo
      description: Operadores existentes añadiendo SUP alquileres y clases junto con operaciones de buceo o cometas.
    - title: Tiendas de Surf y Playa
      description: Los minoristas en las ciudades surferas consolidadas de África se expanden hacia aguas tranquilas y viajan SUP para locales y turistas.
shipping_section:
  title: Barco a África
  paragraphs:
    - Los pedidos se envían desde Weihai, China. El transporte aéreo exprés transporta muestras, de 1 a 3 órdenes de embarcación y reposiciones urgentes a los principales aeropuertos africanos; el transporte marítimo consolidado atiende entre 5 y 20 pedidos al por mayor a bordo a través de los principales puertos de la región. Ambas opciones se cotizan con tiempos estimados de tránsito para tu destino específico.
    - Preparamos documentación completa de exportación — factura comercial y lista de empaquetado — y podemos apoyar a tu corredor con cualquier documentación adicional que requiera el proceso de autorización.
  customs_note: Los regímenes de importación varían mucho entre países africanos y los tipos de arancel sobre el equipamiento deportivo cambian periódicamente. Confirma las normas actuales con tu autoridad local o agente de autorización antes de hacer el pedido; nosotros proporcionamos toda la documentación estándar.
faq_section:
  title: Preguntas frecuentes sobre África
  items:
    - q: ¿A qué mercados africanos sirves?
      a: Enviamos a través del continente, con guías dedicadas para Sudáfrica y Kenia — además de destinos desde Marruecos y Egipto hasta Ghana y Tanzania. Confirma tu ubicación en tu solicitud de presupuesto.
    - q: ¿Puede una pequeña logia pedir solo unas pocas juntas?
      a: Sí, para ellos está diseñado exactamente el modelo de sobrestock. Cinco placas es el mínimo, se aceptan modelos mixtos, y las primeras flotas pequeñas son comunes entre los clientes del resort.
    - q: ¿Cómo se mantienen los alquileres en agua salada y sol?
      a: Las tablas utilizan la construcción drop-stitch PVC que suministramos a flotas de alquiler en todo el mundo. Enjuague después de su uso en agua salada y almacene a la sombra cuando sea posible; cuidado estándar que mantiene las tablas de alquiler en buen estado durante muchas temporadas.
    - q: ¿Cuáles son los pasos de pago y envío?
      a: Usted solicita una cotización, nosotros confirmamos el stock y cotizamos el precio unitario más las opciones de flete, usted aprueba la cotización final, y nosotros probamos, empacamos y enviamos con seguimiento puerta a puerta. Los términos de pago se confirman al momento de cotizar.
