content_challenge:
  tagline: El desafío
  title: 'Las operaciones de rescate exigen<br />una fiabilidad sin concesiones'
  subtitle: 'Las organizaciones de búsqueda y rescate operan bajo una responsabilidad de seguridad extrema — cada fallo de una embarcación tiene consecuencias inaceptables.'
  paragraphs:
    - 'En las operaciones de rescate, el margen entre el éxito y el fracaso se mide en minutos. La embarcación debe estar lista para zarpar de inmediato, operar en condiciones adversas y regresar en seguridad con los pasajeros. La responsabilidad de seguridad es absoluta — un fallo mecánico durante una misión de rescate no es un coste de reparación, es una vida perdida.'
    - 'Las embarcaciones SAR necesitan alta velocidad para llegar rápidamente a las víctimas, combinada con una estabilidad excepcional para operaciones de recuperación seguras. Deben transportar equipo de rescate, suministros médicos y material de comunicaciones — a menudo en un espacio de cubierta limitado. Las embarcaciones al servicio de instituciones públicas también necesitan una larga vida útil (10-15+ años) para justificar los presupuestos de contratación pública.'
    - 'La visibilidad — tanto para el operador como para la búsqueda — es fundamental. El diseño de la consola debe ofrecer visibilidad de 360 grados, y la embarcación debe ser muy visible para aeronaves y otras embarcaciones.'
    - 'Los RIB de rescate de Aquafarer están diseñados desde la quilla hacia arriba para cumplir estos requisitos — con cubiertas autovaciables, cascos reforzados, sistemas de navegación y poste de remolque de serie en los modelos de patrulla.'
content_solution:
  tagline: Nuestra solución
  title: 'RIBs de rescate de propósito específico'
  subtitle: 'Toda embarcación de rescate de Aquafarer está diseñada para cumplir o superar las normas SOLAS y SAR nacionales.'
  list:
    - 'Cubierta autovaciable — el agua drena automáticamente para garantizar la estabilidad durante las operaciones de recuperación'
    - 'Casco de V profunda reforzado — capacidad para aguas agitadas con un comportamiento predecible a alta velocidad'
    - 'Sistema completo de luces de navegación — operativo de día y de noche en cualquier condición meteorológica'
    - 'Poste y línea de remolque — listos para el remolque de embarcaciones u operaciones con trineo de rescate'
    - 'Placas de montaje de equipos — radio, reflector, sirena y equipo médico'
    - 'Múltiples configuraciones de motor — un único fueraborda o redundancia de doble motor'
    - 'Colores de flotadores de alta visibilidad — naranja, amarillo o rojo para una visibilidad máxima'
content_segments:
  tagline: Perfiles de rescate
  title: 'Soluciones de embarcaciones de búsqueda y rescate<br />Por tipo de organización'
  subtitle: 'Distintas organizaciones de rescate operan bajo distintos mandatos, ciclos presupuestarios y entornos operativos — desde tripulaciones voluntarias costeras hasta flotas nacionales de guardia costera. Configuramos cada RIB de rescate para que se ajuste al perfil de la misión.'
  items:
    - title: 'Guardia Costera y Agencias SAR Gubernamentales'
      subtitle: 'Responsabilidad de seguridad absoluta — estándares de flota críticos para la misión'
      description: 'Las agencias SAR gubernamentales asumen la mayor responsabilidad de seguridad en las operaciones marítimas. Cada embarcación debe funcionar a la perfección en condiciones extremas — un fallo del equipo durante una misión de rescate no es una opción. Las decisiones de contratación se rigen por el coste total de propiedad durante una vida útil de 10-15 años, no por el precio inicial. Las agencias necesitan embarcaciones que soporten años de patrullaje costero, cumplan estrictas normas nacionales y ofrezcan un rendimiento constante en estaciones distribuidas. Un dossier documental de cumplimiento integral y acuerdos de servicio plurianuales son obligatorios.'
      features:
        - 'Dossier documental de cumplimiento de las normas SOLAS y SAR nacionales'
        - 'Compatibilidad de piezas en toda la flota — reduce la complejidad de inventario a nivel de estación'
        - 'Configuración de doble motor para una redundancia crítica en la misión'
        - 'Diseño con una vida útil de 10-15 años y programas de mantenimiento programado'
        - 'Capacidad para todo clima — casco de V profunda reforzado para estados de mar adversos'
    - title: 'Servicios de Salvamento y Rescate en Playas'
      subtitle: 'Operaciones de lanzamiento rápido en aguas poco profundas'
      description: 'Servicios de socorrismo municipales y de playa que necesitan embarcaciones de respuesta rápida capaces de cruzar la zona de rompientes, operar en aguas costeras poco profundas y alcanzar a nadadores o embarcaciones en dificultades en cuestión de minutos. El equipo debe ser lo bastante ligero para ser remolcado por la playa con un vehículo pequeño o manualmente.'
      features:
        - 'Casco RIB de poco calado para operar en la zona de rompientes y aguas costeras'
        - 'Capaz de lanzarse desde la playa gracias a la asa de izado en proa y a la protección de quilla'
        - 'Trineo de rescate integrado o plataforma para el socorrista de rescate'
        - 'Flotadores naranjas o amarillos de alta visibilidad de serie'
    - title: 'Departamentos de Bomberos de Rescate'
      subtitle: 'Integración de bomba contra incendios, montaje de equipos, respuesta rápida'
      description: 'Las unidades marítimas de rescate de los bomberos responden a incendios de estructuras en la costa, incendios de embarcaciones e incidentes de rescate acuático. Estas embarcaciones deben llevar bombas contra incendios, lanzas monitor, almacenamiento de mangueras y equipos de respiración — todo integrado en una plataforma estable y de respuesta rápida. Los departamentos también las utilizan para la respuesta ante inundaciones y las operaciones de ayuda mutua. La distribución de la consola debe alojar los controles de la bomba, los sistemas de radio y la iluminación de emergencia sin comprometer el espacio de cubierta para el movimiento de la tripulación.'
      features:
        - 'Lanza monitor montada en proa con paquete de integración de bomba'
        - 'Montaje de equipos dedicado para bomba contra incendios, almacenamiento de mangueras y equipos de respiración autónoma'
        - 'Distribución de consola configurable para controles de bomba, radio e iluminación de emergencia'
        - 'Cubierta autovaciable para el drenaje del agua de extinción y la estabilidad'
        - 'Paquete de operaciones nocturnas: reflector, iluminación de la escena, barra de luces azul/roja'
    - title: 'Policía Marítima y Seguridad Portuaria'
      subtitle: 'Operaciones de interdicción, patrullaje y abordaje'
      description: 'Las unidades de aplicación de la ley marítima requieren embarcaciones capaces de realizar persecuciones a alta velocidad, abordar embarcaciones sospechosas y patrullar la seguridad portuaria. Estas embarcaciones deben disponer de almacenamiento seguro para el equipo de interdicción y las armas, integración de comunicaciones con el mando en tierra y espacio de cubierta suficiente para las operaciones del equipo de abordaje. La capacidad de operación nocturna y la aproximación discreta son esenciales para las misiones de interdicción.'
      features:
        - 'Capacidad de persecución a alta velocidad — casco de planeo con una velocidad máxima superior a 40 nudos'
        - 'Armero seguro y compartimentos de almacenamiento para el equipo de interdicción'
        - 'Integración en consola de radio policial, MDT y sistemas de comunicaciones'
        - 'Paquete de operaciones nocturnas: reflector IR, soporte FLIR, iluminación encubierta'
        - 'Plataforma de abordaje reforzada con superficie antideslizante'
        - 'Sistema de iluminación de emergencia azul/roja y sirena'
    - title: 'Organizaciones SAR Voluntarias y Sin Ánimo de Lucro'
      subtitle: 'Operaciones costeras y lacustres comunitarias financiadas con subvenciones'
      description: 'Los grupos de rescate comunitarios operan en lagos, ríos y zonas costeras donde la cobertura SAR gubernamental es limitada. A menudo financiadas con donaciones o subvenciones públicas, estas organizaciones necesitan la máxima capacidad por euro — una embarcación fiable y de bajo mantenimiento que los voluntarios puedan operar con seguridad con una formación mínima. Los ciclos de subvenciones implican que las embarcaciones deben cumplir los requisitos normativos sin salirse de unos presupuestos fijos.'
      features:
        - 'Configuración de un único fueraborda optimizada para reducir los costes de adquisición y operación'
        - 'Construcción en PVC para un menor mantenimiento y una fácil reparación sobre el terreno'
        - 'Consola multifunción que minimiza la complejidad electrónica para los operadores voluntarios'
        - 'Dossier documental de cumplimiento de subvenciones para las solicitudes de financiación'
        - 'Diseño ligero para el lanzamiento en playa sin remolque ni grúa dedicados'
    - title: 'Rescate en Inundaciones y Respuesta ante Desastres'
      subtitle: 'Inundaciones interiores, aguas poco profundas, entornos con escombros'
      description: 'El rescate en inundaciones es un perfil operativo distinto — las embarcaciones operan en zonas urbanas inundadas, corrientes cargadas de escombros y aguas extremadamente poco profundas donde los obstáculos sumergidos son invisibles. Los operadores necesitan embarcaciones capaces de navegar por calles inundadas, abrirse paso entre los escombros y extraer a las víctimas de edificios y vehículos. El poco calado es fundamental, al igual que la capacidad de operar en corrientes con riesgo de enganches. Estas embarcaciones las despliegan a menudo los departamentos de bomberos, la protección civil y las ONG de ayuda en catástrofes.'
      features:
        - 'Casco de calado ultrarreducido — opera en 30-50 cm de agua'
        - 'Proa deflectora de escombros y protección de flotadores reforzada para obstáculos sumergidos'
        - 'Cubierta autovaciable para el drenaje del agua de inundación y la recuperación de víctimas'
        - 'Flotadores naranjas o amarillos de alta visibilidad para la observación aérea'
        - 'Diseño ligero para el transporte en helicóptero y el despliegue por carretera'
        - 'Puntos de izado reforzados para operaciones de elevación y rescate con cuerda'
