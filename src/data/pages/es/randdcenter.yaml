rd_services:
  tagline: I+D personalizada
  title: Servicios de I+D para socios
  services:
    - title: Desarrollo de materiales personalizados
      desc: Desarrollamos formulaciones de tela, pilas de laminado y sistemas adhesivos personalizados, adaptados a tu entorno operativo y objetivos de rendimiento.
    - title: Ingeniería de productos OEM / ODM
      desc: Desde bocetos conceptuales hasta paquetes de ingeniería listos para producción, nuestro equipo puede diseñar, prototipar y validar botes bajo tu marca.
    - title: Pruebas y certificación de terceros
      desc: Usa nuestras instalaciones de prueba conformes con ISO para pruebas de materiales independientes, validación de productos y soporte de certificación.
  cta: Habla sobre tus requisitos de I+D →
  cta_link: /contact

vision:
  tagline: Nuestra visión
  title: Dando forma al futuro de los deportes acuáticos
  body: Aquafarer se esfuerza por liderar la industria de los botes inflables y el SUP a través de la innovación continua, la calidad inquebrantable y un compromiso firme con la seguridad y la sostenibilidad, enriqueciendo en última instancia las experiencias de los entusiastas de los deportes acuáticos de todo el mundo. El Centro de I+D de Aquafarer es donde la pasión se encuentra con la innovación, estableciendo nuevos estándares para la industria de los deportes acuáticos.

labs_section:
  tagline: Laboratorios
  title: Nuestros laboratorios
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: Laboratorio de telas de PVC
      description: Investigación y pruebas continuas de las telas de PVC y Hypalon de los tubos para verificar resistencia a la tracción, resistencia a los rayos UV, abrasión y flexibilidad a bajas temperaturas, con el fin de garantizar la fiabilidad a largo plazo en entornos marinos.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Estudio de ingeniería de cascos
      description: Diseño impulsado por CAD y análisis por elementos finitos de cascos de HDPE, aluminio y fibra de vidrio. Cada casco se simula digitalmente para verificar la distribución de tensiones y la resistencia a los impactos antes de construir el primer prototipo.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Centro de soldadura RF
      description: Instalación dedicada de soldadura por radiofrecuencia con control preciso de temperatura y presión, que produce costuras herméticas de alta resistencia que cumplen con los estándares de la industria marina para embarcaciones inflables.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Canal de pruebas hidrodinámicas
      description: Pruebas con modelos a escala en nuestro canal de pruebas interno para optimizar la forma del casco, el rendimiento de planeo, la estabilidad y la eficiencia de combustible en una variedad de condiciones de carga y mar.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Taller de prototipos
      description: Instalación de prototipado y aparejado a escala real donde se construyen, equipan y prueban en el mar los nuevos modelos. Cada prototipo se somete a un programa de pruebas en el agua de un mínimo de 20 horas antes de la aprobación para producción.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratorio de calidad e inspección
      description: Laboratorio dedicado de garantía de calidad que realiza pruebas de tracción, ciclos de retención de aire, pruebas de pelado de costuras y certificación de materiales para garantizar que cada barco que sale del taller cumpla con nuestras especificaciones publicadas.
      href: /randdcenter/quality-inspection-lab
