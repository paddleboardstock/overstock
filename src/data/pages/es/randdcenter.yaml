hero:
  tagline: Centro de I+D
  title: Centro de I+D
  subtitle: Enfocados en el progreso

intro:
  - El Centro de Investigación y Desarrollo (I+D) de Aquafarer es la fuerza impulsora detrás de nuestra misión de revolucionar los equipos de deportes acuáticos. Potenciamos a los entusiastas de los deportes acuáticos de todo el mundo con productos más seguros, cómodos y placenteros a través de una innovación incansable en tablas de paddle surf (SUP) y botes inflables. Nuestro equipo dedicado de ingenieros, diseñadores y apasionados expertos en deportes acuáticos está dando forma al futuro de la industria, elevando constantemente el listón en calidad, rendimiento y sostenibilidad.
  - Nuestra instalación de I+D reúne a científicos de materiales, arquitectos navales e ingenieros de producción bajo un mismo techo. Desde la formulación de telas y la simulación de cascos hasta el desarrollo de procesos de soldadura y las pruebas de navegación a escala real, cada etapa del desarrollo del producto se guía por datos y se valida mediante pruebas.

mission:
  tagline: Nuestra misión
  title: Innovando el futuro de los deportes acuáticos
  pillars:
    - icon: lightning
      title: Avance tecnológico
      desc: Pioneros en nuevos materiales, diseños y fabricación para un rendimiento y una longevidad del producto superiores.
    - icon: design
      title: Diseño centrado en el usuario
      desc: Comprender profundamente y superar las necesidades del usuario a través de un diseño de producto ergonómico e intuitivo.
    - icon: globe
      title: Prácticas sostenibles
      desc: Minimizar nuestra huella ambiental utilizando materiales y procesos ecológicos.
    - icon: shield
      title: Seguridad sin concesiones
      desc: Garantizar los más altos estándares de seguridad mediante pruebas y certificaciones rigurosas.

pillars:
  - title: Avance tecnológico
    desc: Pioneros en nuevos materiales, diseños y procesos de fabricación para ofrecer un rendimiento y una longevidad del producto superiores.
    icon: tech
  - title: Materiales avanzados
    desc: Investigación de PVC, Hypalon, composites y alternativas sostenibles de vanguardia para mejorar las características del producto.
    icon: materials
  - title: Sostenibilidad
    desc: 'Un compromiso fundamental: Nos dedicamos a la gestión ambiental a través de la fabricación sostenible y los materiales reciclables.'
    icon: sustainability

capabilities:
  tagline: Capacidades
  title: Capacidades de I+D
  subtitle: Cuatro disciplinas fundamentales que nos dan un control integral sobre el desarrollo de productos, desde la investigación de materias primas hasta la certificación final.
  groups:
    - title: Ciencia de materiales y tecnología de telas
      items:
        - Análisis y optimización de la formulación de PVC y Hypalon
        - Estabilización UV, retardancia de llama y desarrollo de aditivos antimicrobianos
        - Ingeniería de laminación y adhesión de telas multicapa
        - Pruebas de envejecimiento acelerado (UV, térmico, humedad, niebla salina)
    - title: Ingeniería de cascos e hidrodinámica
      items:
        - Diseño paramétrico de cascos en 3D y optimización por CFD
        - Análisis por elementos finitos para cargas estructurales y de impacto
        - Pruebas en canal de arrastre con modelos a escala y validación del rendimiento
        - Desarrollo de cascos personalizados para perfiles de misión especiales
    - title: Tecnología de soldadura y unión
      items:
        - Desarrollo y optimización del proceso de soldadura dieléctrica RF
        - Métodos de soldadura por aire caliente, cuña caliente y ultrasonido
        - Unión adhesiva y calificación de cintas para costuras
        - Modelado de la resistencia de la soldadura y predicción de la vida útil
    - title: Pruebas, certificación y cumplimiento
      items:
        - Gestión de calidad y pruebas de cumplimiento CE
        - Pruebas de terceros independientes y soporte de certificación
        - Desarrollo de protocolos de prueba personalizados para la calificación de compras
        - Análisis de fallos en servicio e investigación de causa raíz

