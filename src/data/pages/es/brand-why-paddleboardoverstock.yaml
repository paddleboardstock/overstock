features3_reasons:
  tagline: Por qué Elegir Paddle Board Overstock
  title: Siete Razones para Asociarse con Nosotros
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Fabricación Real, No Comercialización
      description: Poseemos y operamos una fábrica de 12,000 m². Cuando compras en Paddle Board Overstock, compras directamente de las personas que diseñan, ingenian y fabrican tu tabla — sin intermediarios, sin sobreprecio comercial.
      icon: tabler:building-factory
    - title: 2. Enfoque Liderado por Ingeniería
      description: Nuestro proceso de diseño comienza con el caso de uso, no con la categoría del producto. Optimizamos la forma del casco, la selección de materiales y la configuración según cómo se utilizará realmente la tabla.
      icon: tabler:engine
    - title: 3. Calidad Comprobada
      description: Cada tabla se prueba al 100% de presión a 1.25x del PSI nominal antes de ser enviada. Una tasa de defectos del 99.3% libre de fallos — medida en cada lote, no solo declarada.
      icon: tabler:shield-check
    - title: 4. Diseño Pensado para Remeros
      description: 'Arte de cubierta, series de colores, monturas para accesorios y paquetes completos — tablas diseñadas en torno al remo real: turismo, yoga, pesca, ejercicios y diversión familiar.'
      icon: tabler:swimming
    - title: 5. Logística Global
      description: Envío directo desde nuestra fábrica en Weihai a remeros en 50+ países, con seguimiento completo y gestión aduanera.
      icon: tabler:truck-delivery
    - title: 6. Soporte de por Vida
      description: Respaldamos las tablas que fabricamos hace años. Piezas genuinas, asesoramiento técnico, guía de reparaciones — nuestro equipo está disponible cuando nos necesites.
      icon: tabler:lifebuoy
    - title: 7. Especificaciones Honestamente
      description: Capacidades de carga reales, dimensiones reales, peso real. Sin inflaciones de marketing. Lo que publicamos es lo que obtienes — verificado por pruebas independientes.
      icon: tabler:ruler-measure
testimonials:
  tagline: Confiado por Marcas en Todo el Mundo
  title: Lo que Dicen Nuestros Socios
  items:
    - content: Mi tabla llegó como recién salida de fábrica con todo en la caja. Dos temporadas de remo semanal y aún mantiene el aire perfectamente.
      name: — Sarah M., Remera de fin de semana, Florida
    - content: Comparé las especificaciones durante semanas antes de comprar. Paddle Board Overstock fue la única marca que publicaba pesos reales y presiones reales. Lo que ellos listan es lo que se obtiene.
      name: — Tomasz K., Remero de turismo, Polonia
    - content: Ahora toda la familia rema. Empezamos con una tabla y terminamos con cuatro — la calidad hizo que la decisión fuera fácil.
      name: — Angela R., Remera familiar, Australia
