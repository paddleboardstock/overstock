content_challenge:
  tagline: El desafío
  title: Las operaciones de deportes acuáticos<br />exigen semirrígidas versátiles
  subtitle: Las escuelas de vela, los centros de deportes acuáticos y los organizadores de eventos necesitan embarcaciones que puedan desempeñar múltiples funciones (entrenamiento, remolque, seguridad y transporte) y que a menudo cambien de función en cuestión de horas.
  paragraphs:
    - "Los deportes acuáticos constituyen uno de los sectores marítimos más diversos: abarcan desde la enseñanza de vela hasta actividades motorizadas como el wakeboard y el esquí acuático, pasando por competiciones de todos los niveles. Cada aplicación exige capacidades náuticas distintas, pero muchos operadores necesitan una única flota capaz de asumir múltiples funciones a lo largo de su jornada diaria."
    - '**Las escuelas de vela** necesitan RIB de instrucción lo bastante estables para que los monitores puedan mantenerse de pie y hacer demostraciones, lo bastante rápidos para alcanzar con celeridad a los navegantes que han volcado y lo bastante resistentes para soportar varadas repetidas en la playa. La embarcación debe ser visible, maniobrable en los espacios reducidos del puerto deportivo y capaz de remolcar los veleros a tierra cuando el viento cae.'
    - '**Los centros de deportes acuáticos** que ofrecen esquí acuático, wakeboard y paseos en tubo necesitan lanchas de tracción diseñadas a medida, con características de estela constantes, fuerte aceleración de salida y mayor autonomía para sesiones de riders consecutivas. La estabilidad a baja velocidad es crítica para recoger a los riders y supervisar la seguridad.'
    - '**Los organizadores de eventos** que gestionan regatas, triatlones y competiciones acuáticas requieren embarcaciones de marshalling y seguridad capaces de patrullar los límites del recorrido, hacer cumplir las reglas, responder a emergencias y transportar oficiales — todo ello manteniendo una apariencia profesional y un rendimiento fiable durante eventos de varios días.'
    - El denominador común de los tres segmentos es la necesidad de RIB polivalentes, duraderos y equipados profesionalmente, capaces de operar en condiciones variadas con un tiempo de inactividad mínimo. Aquafarer fabrica RIB para deportes acuáticos configurados para cada uno de estos roles específicos.
content_solution:
  tagline: Nuestra solución
  title: RIB para deportes acuáticos<br />Diseñadas para cada función
  subtitle: Las RIB para deportes acuáticos de Aquafarer están diseñadas con configuraciones modulares que permiten que una sola plataforma de embarcación cumpla múltiples funciones en toda su operación.
  list:
    - "Diseño de casco estable: los monitores pueden mantenerse de pie y moverse con confianza mientras instruyen desde la embarcación"
    - Mástil de remolque y puntos de anclaje de cuerda para esquí acuático, wakeboard y tracción de tubos
    - Aceleración rápida con una combinación motor-casco adecuada para la tracción de deportes acuáticos
    - Distribuciones de asientos profesionales para la comodidad del monitor, entrenador u oficial durante largas sesiones en el agua
    - Consola completa con parabrisas, electrónica de navegación, radio VHF y almacenamiento de equipos de seguridad
    - "Tubos de Hypalon o PVC de grado marino: resistentes a los UV y al agua de mar para una vida útil prolongada"
    - "Cubierta antideslizante: movimiento seguro de la tripulación cuando la cubierta está mojada por la rociadura o la recogida de riders"
    - "Personalización de marca y kits de calcomanías: con los colores de su escuela, centro o evento"
    - Puntos de izado para pescantes y refuerzos para varadas en playa, para botadura y recuperación diarias
    - Configuraciones de motores fueraborda de 4 tiempos con bajo consumo para jornadas diarias de operación prolongadas
content_segments:
  tagline: Perfiles de deportes acuáticos
  title: Soluciones RIB<br />Por tipo de deportes acuáticos
  subtitle: 'Las diferentes operaciones de deportes acuáticos exigen diferentes configuraciones de embarcaciones: adaptamos cada RIB a la función específica que desempeñará.'
  items:
    - title: Escuelas de vela y centros de formación
      subtitle: RIBs de autocar para instrucción de navegación, cobertura de seguridad y remolque de veleros
      description: 'Las escuelas de vela operan en bahías, lagos y aguas costeras protegidas y ofrecen sesiones de capacitación para navegantes principiantes y avanzados durante todo el año. La RIB de autocar sirve como plataforma de enseñanza móvil, embarcación con cubierta de seguridad y barco remolcador. Los instructores necesitan una plataforma estable para mantenerse de pie y hacer demostraciones, una respuesta rápida para llegar a los estudiantes volcados y una construcción resistente para los desembarcos diarios en la playa y las maniobras en el puerto deportivo. La confiabilidad es primordial: una embarcación averiada significa lecciones canceladas y estudiantes decepcionados. El barco también debe tener una apariencia profesional que refleje la calidad de la escuela.'
      features:
        - Plataforma estable con borda baja para la comunicación entre monitor y alumno a corta distancia
        - Cubierta antideslizante y pasamanos para la seguridad del monitor al estar de pie y moverse
        - Mástil de remolque y punto de anclaje de aparejo para devolver a tierra los veleros averiados
        - Casco de planeo rápido para responder con rapidez a alumnos volcados o a la deriva
        - Eslora compacta (4,3-5,2 m) para facilitar el transporte y el almacenamiento entre temporadas
        - Opciones de colores de alta visibilidad para localizar fácilmente la embarcación en toda la zona de entrenamiento
        - Opciones de protección de hélice para la seguridad de los alumnos en maniobras de corta distancia
    - title: Centros de deportes acuáticos y operadores de remolques
      subtitle: Remolque RIB para esquí acuático, wakeboard y paseos en tubos inflables
      description: 'Los centros de deportes acuáticos que operan en lagos, ríos y tramos costeros realizan diariamente operaciones de remolque de gran volumen: esquí acuático, wakeboard, rodillas y paseos en tubos remolcables para turistas y lugareños. El barco remolcador necesita características de estela consistentes, una fuerte aceleración para que los pasajeros se suban al avión rápidamente y un manejo estable a baja velocidad para recoger a los pasajeros y recuperarse de caídas. Estos barcos operan en aguas poco profundas cerca de la costa, lo que requiere cascos reforzados y protección de la hélice. La eficiencia del combustible es importante cuando se realizan sesiones consecutivas durante 8 a 10 horas al día. El barco también sirve como plataforma de seguridad (lleva a un conductor, un observador y, a veces, un entrenador) y, al mismo tiempo, parece atractivo para los clientes que pagan.'
      features:
        - Potencia del motor ajustada al uso para una fuerte aceleración de salida y una velocidad de tracción constante
        - Mástil de remolque y puntos de sujeción de cuerda posicionados para un ángulo de tracción óptimo del rider
        - Estela suave y predecible para una experiencia cómoda y segura del rider
        - Estabilidad a baja velocidad para recoger con seguridad a los riders tras las caídas
        - Quilla y casco reforzados para operaciones frecuentes en playa y aguas someras
        - Túnel de hélice o protector para operar con seguridad en zonas poco profundas
        - Capacidad de combustible ampliada para 6-8 horas de operaciones de tracción continuas
        - Asientos para conductor y observador con visibilidad clara del rider en todo momento
    - title: Organizaciones de eventos y competiciones
      subtitle: Mariscal, seguridad y transporte oficial semirrígidas para eventos marítimos.
      description: Los organizadores de regatas, directores de carreras de triatlón y coordinadores de competiciones de deportes acuáticos necesitan RIB fiables y de aspecto profesional para la gestión de recorridos, cobertura de seguridad y transporte oficial. Estos barcos patrullan los límites del campo, hacen cumplir las reglas de las regatas, brindan asistencia médica de primera respuesta y transportan a los jueces y al personal de los medios. Los eventos se llevan a cabo en todas las condiciones climáticas (viento, oleaje y corrientes) que exigen un manejo estable y un rendimiento confiable. La apariencia del barco es importante porque representa la marca del evento frente a los participantes, espectadores y medios de comunicación. Los eventos de varios días requieren embarcaciones que puedan operar día tras día con un tiempo de inactividad mínimo por mantenimiento.
      features:
        - Casco estable para oficiales de pie y manejo seguro de cámaras en cualquier condición
        - "Equipo de navegación completo: cartográfico GPS, radio VHF y luces de navegación para operaciones de madrugada y atardecer"
        - Almacenamiento de botiquín de primeros auxilios para intervenciones de emergencia
        - Personalización profesional de marca y kits de calcomanías para la visibilidad de los patrocinadores del evento
        - Múltiples configuraciones de asientos para oficiales, medios de comunicación y personal médico
        - Velocidad de planeo rápida para reposicionar el recorrido con rapidez y responder a emergencias
        - Consola con protección meteorológica y parabrisas para mayor comodidad en largas guardias sobre el agua
        - Construcción de tubos resistente para el contacto en el pantalán en puertos deportivos de eventos abarrotados
