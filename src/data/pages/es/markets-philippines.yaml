hero:
  tagline: Filipinas
  title: SUP Tablas mayoristas para<br />Empresas filipinas
  subtitle: Resorts insulares, clubes de playa y operadores de remo desde El Nido y Siargao hasta Boracay — tablas nuevas de excedente de 5 unidades, modelos mixtos, enviadas desde China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tablas de sobrestock SUP para resorts y operadores de remos en las islas Filipinas
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas SUP de excedente a negocios filipinos — resorts insulares en Palawan y Siargao, clubes de playa en Boracay y Cebú, operadores de alquiler y turismos, y pequeños minoristas. Los pedidos mayoristas comienzan en 5 tablas con modelos mixtos en un solo envío, enviados desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada placa está 100% testada a presión y cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Sirviendo a resorts insulares y clubes de playa a lo largo del archipiélago filipino
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El mercado filipino SUP
  paragraphs:
    - Con más de siete mil islas, Filipinas está diseñada para el remo de pie. Las lagunas de El Nido y Coron, la tranquila escena de surf e islas de Siargao, la energía de club de playa de Boracay y la economía de buceo y deportes acuáticos de Cebú generan una demanda constante — desde turistas que reman al amanecer en una laguna de piedra caliza hasta locales que construyen SUP comunidades de fitness y yoga en Manila y más allá.
    - The buyers are typically resort and tour operators: resorts isleños que añaden una actividad para huéspedes que no necesita combustible, ni motor ni licencia; operadores turísticos que saltan de isla en isla ampliando su oferta; y pequeñas tiendas que atienden a la comunidad nacional de piragüismos. Los pedidos son pequeños — de 5 a 20 tablas — y se mezclan entre tablas estables y generales para principiantes y algunas ediciones premium para el aspecto de fachada de resort.
  customer_types:
    - title: Resorts en la isla
      description: Resorts de Palawan, Siargao y Boracay que añaden SUP programas para huéspedes con flotas mixtas compactas.
    - title: Operadores turísticos
      description: Viajes de isla en isla y de lagunas añadiendo paradas para remar a sus itinerarios.
    - title: Tiendas y escuelas locales
      description: Escuelas y tiendas urbanas que atienden a la creciente comunidad filipina de piragüismo y SUP yoga.
shipping_section:
  title: Barco a Filipinas
  paragraphs:
    - Los pedidos se envían desde Weihai, China. El transporte aéreo exprés transporta muestras y de 1 a 3 pedidos a bordo rápidamente hacia Manila y Cebú; el transporte marítimo consolidado atiende entre 5 y 20 pedidos al por mayor a través de Manila y otros puertos filipinos. Las estimaciones de tránsito para tu destino — Metro Manila o provincia — están incluidas en tu presupuesto.
    - Proporcionamos las facturas comerciales y la autorización de listas de empaquetado requeridas, con códigos HS correctos y valores declarados. Los derechos de importación y los impuestos son pagables por el importador según las normas filipinas.
  customs_note: Para destinos provinciales, la entrega final desde el puerto o aeropuerto se cotiza como parte del presupuesto puerta a puerta. Confirma el tratamiento actual de derechos de importación para equipamiento deportivo con tu intermediario; proporcionamos documentación completa.
faq_section:
  title: Preguntas frecuentes sobre Filipinas
  items:
    - q: ¿Cuánto tarda el envío a Filipinas?
      a: Depende del método. El transporte aéreo exprés hacia Manila o Cebú es la opción más rápida para muestras y 1–3 pedidos de embarcación; el transporte marítimo consolidado cubre de 5 a 20 pedidos mayoristas y se presupuesta con una ventana de tránsito para tu puerto. Ambos presupuestos se detallan en tu presupuesto antes de comprometerte.
    - q: ¿Pueden las juntas llegar a islas provinciales como Palawan o Siargao?
      a: 'Sí: la entrega puerta a puerta a destinos provinciales se cotiza como parte de la estimación de flete, utilizando logística nacional desde el puerto o aeropuerto de llegada. Tome en cuenta la estimación y las opciones en su consulta y lo valoraremos específicamente.'
    - q: ¿Cómo se ve una flota inicial de un resort?
      a: 'Usualmente 5–10 tablas: modelos estables para todo uso para clases de invitados y remo libre, además de una o dos ediciones artísticas premium para la playa. Modelos mixtos, un envío, con precio según la cantidad total.'
    - q: ¿Son adecuadas las tablas para su uso en lagunas y plataformas de arrecife?
      a: 'Sí: las condiciones de agua tranquila, poco profunda y cálida son exactamente para lo que están diseñadas las tablas inflables SUP todoterreno, y la aleta flexible y la construcción duradera drop-stitch manejan bien los aterrizajes en arrecifes y playas.'
