who_benefits:
  tagline: Quién Puede Beneficiarse
  title: Para Quién Es el Mayorista de Modelos Mixtos
  items:
    - title: Importadores por Primera Vez
      description: Probar la categoría SUP con una variedad de modelos en lugar de comprometerse con un SKU al por mayor.
    - title: Minoristas de Playa Estacionales
      description: Tiendas que necesitan tablas para principiantes para turistas y ediciones premium para locales, todo en el mismo pedido de reposición.
    - title: Vendedores online
      description: Listar varios modelos a la vez para aprender qué ilustración, longitud y caso de uso convierten mejor.
    - title: Flotas de Alquiler y Escuelas
      description: Flotas que necesitan diferentes tamaños de tablas para distintos pesos de los riders y tipos de clases, no una flota de una sola especificación.
faq_section:
  title: Preguntas Frecuentes sobre Modelos Mixtos
  items:
    - q: ¿Hay una cantidad mínima por modelo?
      a: No. El mínimo de 5 tablas aplica al pedido total, no a cada modelo. Podrías pedir 5 modelos diferentes, una tabla de cada uno.
    - q: ¿Mezclar modelos cambia el precio?
      a: El precio unitario al por mayor se cotiza por modelo, pero tu nivel de precio mejora con el recuento total de tablas; mezclar modelos no te penaliza.
    - q: ¿Puedo mezclar tablas y accesorios?
      a: Sí, se pueden añadir palas de repuesto, bombas y kits de reparación a un pedido mixto. Pregunta en tu consulta.
    - q: ¿Cómo sé qué modelos se adaptan a mi mercado?
      a: Envíanos una nota sobre tus clientes (costeros o del interior, turistas o locales, principiantes o riders) en el formulario de consulta y te recomendaremos una mezcla.
