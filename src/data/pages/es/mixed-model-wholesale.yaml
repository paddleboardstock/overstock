hero:
  tagline: Modelo mixto al por mayor
  title: Paddle Boards de Modelos Mixtos al Por Mayor —<br />Mezcla diferentes SUP modelos en un solo orden
  subtitle: ¿Por qué limitar tu presupuesto a un solo modelo? Combina cualquier SUP tabla disponible — ediciones allaround, touring, surf y art — en un solo pedido mayorista, con un total tan bajo como 5 tablas.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Un orden mixto de diferentes SUP modelos de tablas hinchables de Paddle Board Overstock
direct_answer: El modelo mixto al por mayor permite a un pequeño minorista pedir varios SUP modelos diferentes en un solo envío consolidado en lugar de una cantidad masiva de una sola placa. Paddle Board Overstock En , cualquier modelo en stock puede combinarse, el pedido mínimo es de 5 placas en total, y la cantidad total determina el nivel de precios. Los pedidos mixtos se envían desde Weihai, China, por transporte aéreo exprés (1–3 tableros) o transporte marítimo consolidado (5–20 tableros) a 50+ países, y cada placa está 100% sometida a prueba de presión y cubierta por la garantía de 2 años SUP .
tldr_points:
  - Mezcla cualquier modelo en stock SUP en un solo orden — sin mínimos por modelo
  - La cantidad total del pedido (no la cantidad por modelo) determina tu nivel de precios
  - Empieza con 5 tablas en total — construidas para pequeños minoristas, no para cargas en contenedores
  - 'Un envío consolidado: un coste de transporte, un despache de aduanas, una entrega'
why_mixed:
  tagline: ¿Por qué mezclado?
  title: Mezcla y combina. Compra más variedad. Gasta menos.
  subtitle: Una estantería de tablas idénticas sirve a un tipo de palan. Un pedido mixto convierte el mismo presupuesto en una línea completa de productos.
  items:
    - title: Más variedad en tu estantería
      description: 'Combina tablas para principiantes, tablas de turismo para aventureros y tablas de surf para riders: un pedido cubre toda tu gama de clientes.'
    - title: Menor riesgo por modelo
      description: En lugar de apostar tu temporada a un modelo, pide de 2 a 4 de cada uno. Si un modelo vende más que el resto, reponlo en el siguiente pedido con datos reales de ventas.
    - title: Prueba qué se vende en tu mercado
      description: 'Cada playa, lago y ciudad tiene una demanda diferente. Un primer pedido mixto es la investigación de mercado más barata que existe: haz stock de seis modelos, mira cuáles se mueven.'
    - title: Mejores márgenes en las ediciones de arte
      description: Las placas de la serie art premium (Leviathan Wake, Medusa Glow, Ocean Voyager) tienen precios de venta más altos. Mezcla algunas en una base de tablas para aumentar tu margen medio.
    - title: Un envío consolidado
      description: Un pedido mixto significa una sola reserva de carga, una despacho de aduanas y una entrega, en lugar de cinco envíos separados de cinco proveedores distintos.
how_it_works:
  tagline: Cómo funciona
  title: Cómo funciona un orden de modelos mixtos
  steps:
    - title: Elige tu mezcla
      description: Elige los modelos y cantidades para tu mercado — o usa el selector de abajo para hacer un draft y ver en directo el número de tablones y la actualización del valor total.
    - title: Solicite una Cotización
      description: Envíanos la mezcla. Confirmamos el stock actual de cada modelo y cotizamos precios unitarios, además de opciones de transporte exprés y marítimo a tu país.
    - title: Confirmar la orden
      description: 'Apruebe la cotización final: modelos, cantidades, flete, total. Bloqueamos el stock y programamos el despacho desde Weihai.'
    - title: Probamos Cada Tabla
      description: Cada tabla en su pedido mixto se prueba al 100% con presión de 15 PSI antes del embalaje, con el mismo estándar para todos los modelos, ya sea un modelo de uso general o una edición artística.
    - title: Una Entrega en su Puerta
      description: 'Todo el pedido mixto se envía junto: envío exprés por aire para pedidos pequeños, flete marítimo consolidado para 5–20 tablas, con seguimiento de puerta a puerta.'
