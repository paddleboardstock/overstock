hero:
  tagline: Brasil
  title: SUP Tablas mayoristas para<br />Minoristas brasileños
  subtitle: Para tiendas y operadores desde Río y Florianópolis hasta la costa noreste — nuevas tablas de paddle de 5 unidades, modelos mixtos, enviadas desde China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tablas de sobrestock SUP para minoristas de playa brasileños y escuelas de paddle
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas SUP y sobrantes a empresas brasileñas — escuelas y tiendas de paddle en Río de Janeiro, Florianópolis y la costa noreste, operadores de alquiler y vendedores online. Los pedidos al por mayor comienzan con 5 tablas con modelos mixtos en un solo envío, enviadas desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada tabla está 100% sometida a prueba de presión y cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Sirviendo a la cultura costera de Brasil desde Río hasta el noreste
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El mercado brasileño SUP
  paragraphs:
    - Brasil es uno de los mercados de stand up paddle más naturales del mundo. La cultura de la playa es cultura nacional — desde la escena de Stand Up Paddle en las lagunas de Río y la mezcla de surf y aguas tranquilas de Florianópolis hasta las aguas cálidas y tranquilas del noreste en Ceará, Pernambuco y Bahía. Las escuelas de remo, los alquileres de lagunas y las comunidades de surf y a favor del SUP viento se basan en una población enorme y apasionada por el deporte.
    - Los compradores brasileños suelen ser negocios gestionados por sus propietarios — puestos de alquiler junto a la laguna, escuelas de playa, tiendas de surf que añaden SUP colas y vendedores nacionales de comercio electrónico en crecimiento. Piden en pequeños lotes (5–20 tablas), y se preocupan por la durabilidad para el uso diario y la competitividad en precios en un mercado con costes de importación significativos.
  customer_types:
    - title: Escuelas Lagoon y Beach
      description: Escuelas y operadores de alquiler en las lagunas de Río y en las playas de aguas tranquilas del noreste ofrecen clases y alquileres por horas.
    - title: Tiendas de Surf
      description: Tiendas consolidadas de surf que añaden aguas tranquilas y turismo SUP para la comunidad local de remodores.
    - title: Vendedores online
      description: Vendedores nacionales de comercio electrónico importando SUP material para servir al enorme mercado interno de Brasil.
shipping_section:
  title: Barco a Brasil
  paragraphs:
    - Los pedidos se envían desde Weihai, China. El transporte aéreo exprés transporta muestras y de 1 a 3 pedidos de embarcación hacia los principales aeropuertos de Brasil; el transporte marítimo consolidado atiende entre 5 y 20 pedidos al por mayor a través de puertos como Santos y otras puertas costeras. Las estimaciones de tránsito para tu destino se incluyen en tu presupuesto.
    - Proporcionamos la factura comercial y la lista de empaquetado necesarias para la despesa, con los códigos HS correctos y los valores declarados. Los derechos de importación y los impuestos son pagables por el importador según las normas brasileñas.
  customs_note: 'Los impuestos de importación de Brasil sobre artículos deportivos son significativos y varían según la clasificación del producto. Confirma el arancel actual, el IVA y cualquier cargo a nivel estatal con tu agente de aduanas (despachante) antes de hacer el pedido: proporcionamos documentación completa pero no agrupamos los impuestos de importación en los presupuestos de transporte.'
faq_section:
  title: Preguntas frecuentes sobre Brasil
  items:
    - q: ¿Se pueden gestionar los presupuestos y el soporte en portugués?
      a: Sí — trabajamos con compradores que hablan portugués. Pregunta en tu consulta y nos encargaremos de tu presupuesto y pedido en portugués.
    - q: ¿Están incluidos los impuestos de importación de Brasil en vuestros precios?
      a: No. Los derechos de importación, el IVA y los impuestos estatales son responsabilidad del importador según las normas brasileñas. Ofrecemos precios de junta y transporte de forma clara y separada, y proporcionamos la documentación que necesita su despachante.
    - q: ¿Cómo es un primer pedido para una escuela de playa brasileña?
      a: 'Normalmente 5–15 tablas: modelos duraderos y versátiles para clases y alquiler por hora, además de un par de ediciones premium para exhibición en tienda. Modelos mixtos en un mismo envío, con precio según la cantidad total.'
    - q: ¿Envían por transporte marítimo a Brasil?
      a: Sí — el transporte marítimo consolidado llega a puertos brasileños para pedidos mayoristas de 5–20 tablas, cotizado por destino. El envío aéreo exprés está disponible para muestras y pedidos pequeños urgentes.
