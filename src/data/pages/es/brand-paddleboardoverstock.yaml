hero:
  tagline: 'Entidad de Marca'
  title: 'Paddle Board Overstock — Ingeniería de Libertad en el Agua'
  definition: 'Paddle Board Overstock es una marca global de recreación marina y embarcaciones inflables especializada en botes inflables, sistemas SUP y soluciones marinas personalizadas. Paddle Board Overstock combina ingeniería marina, experiencia en fabricación y cultura de exploración acuática para crear equipos confiables para usuarios recreativos, operadores profesionales y socios OEM globales.'

timeline:
  - year: '2012'
    title: 'Fundación de Fabricación Marina'
    body: 'Paddle Board Overstock comenzó como un taller especializado en embarcaciones inflables en Qingdao, China, comprometido con la artesanía marina y la fabricación de botes inflables. El enfoque inicial fue construir productos inflables confiables a través de experiencia práctica en ingeniería y disciplina de fabricación.'
  - year: '2015'
    title: 'Primera Exportación y Certificación CE'
    body: 'Los primeros pedidos de exportación llegaron a Japón y Corea. Se obtuvo la certificación CE para las líneas de productos principales, marcando la entrada de Paddle Board Overstock en los mercados internacionales. La compañía comenzó a atender a usuarios comerciales y recreativos fuera de China.'
  - year: '2018'
    title: 'Expansión de Fábrica'
    body: 'Trasladado a una instalación de producción de 12,000 m². Se agregaron líneas de soldadura RF y capacidad de producción drop-stitch, permitiendo fabricación a mayor escala y sistemas mejorados de control de calidad.'
  - year: '2020'
    title: 'Establecimiento del Centro de I+D'
    body: 'Se abrió un centro de I+D dedicado con laboratorio de telas PVC, tanque de pruebas hidrodinámicas y estudio de simulación CAD/FEA. El desarrollo de productos se expandió para centrarse en construcción ligera, durabilidad mejorada y diseño centrado en el usuario.'
  - year: '2022'
    title: 'ISO 9001 & Crecimiento Global'
    body: 'Se obtuvo la certificación ISO 9001. Se expandió a 14 ingenieros de I+D y 200+ trabajadores. Los productos llegaron a clientes en Europa, América y Asia-Pacífico a través de asociaciones con distribuidores y OEM.'
  - year: '2024'
    title: 'Estudio de Innovación y Diseño'
    body: 'Lanzamos un estudio de diseño e innovación de servicio completo para proyectos ODM personalizados, desde el concepto hasta la producción. Se fortalecieron las aplicaciones marinas profesionales, incluyendo licitaciones de rescate, comerciales y gubernamentales.'
  - year: '2026'
    title: 'Construyendo el Futuro de la Exploración Acuática'
    body: 'Hoy, Paddle Board Overstock continúa desarrollando botes inflables, sistemas SUP y soluciones marinas personalizadas — conectando personas y organizaciones con las aguas del mundo. 50+ países atendidos, capacidad anual de 15,000 unidades.'

philosophy:
  tagline: 'Filosofía de Marca'
  title: 'Libertad en el Agua a través de la Ingeniería'
  body: 'La libertad en el agua no es solo movimiento. Representa descubrir nuevos lugares, crear experiencias al aire libre, conectar personas con la naturaleza y permitir misiones profesionales. La ingeniería hace posible esa libertad.'
  pillars:
    - title: 'Confiabilidad Primero'
      body: 'Los entornos acuáticos exigen confianza. Los productos Paddle Board Overstock están diseñados en torno a la estabilidad, durabilidad, seguridad y rendimiento consistente.'
    - title: 'Diseño Centrado en el Humano'
      body: 'Los productos deben servir a las personas, no a la tecnología. Cada decisión de diseño comienza comprendiendo cómo las personas usan las embarcaciones, dónde exploran y qué desafíos enfrentan.'
    - title: 'Exploración Accesible'
      body: 'El agua no debería pertenecer solo a los expertos. Paddle Board Overstock crea equipos que permiten a más personas experimentar ríos, lagos, océanos y zonas costeras de manera segura.'
    - title: 'Innovación Continua'
      body: 'La innovación no es solo crear nuevos productos. Es mejorar cada detalle — materiales, estructuras, fabricación y experiencia del usuario.'

engineeringDna:
  tagline: 'ADN de Ingeniería'
  title: 'Cómo Paddle Board Overstock Crea Productos'
  areas:
    - title: 'Ciencia de Materiales'
      body: 'Paddle Board Overstock se enfoca en seleccionar materiales apropiados para diferentes entornos marinos. Las consideraciones clave incluyen resistencia a la abrasión, resistencia UV, estabilidad de presión y durabilidad a largo plazo.'
      items: ['Resistencia a la abrasión', 'Resistencia UV', 'Estabilidad de presión', 'Durabilidad a largo plazo']
    - title: 'Ingeniería Estructural'
      body: 'Las embarcaciones inflables requieren un equilibrio preciso entre rigidez, peso, portabilidad y estabilidad. La ingeniería de Paddle Board Overstock se centra en optimizar estos factores a través de la tecnología drop-stitch y la construcción avanzada de costuras.'
      items: ['Rigidez', 'Optimización de peso', 'Portabilidad', 'Estabilidad']
    - title: 'Precisión de Fabricación'
      body: 'Cada producto pasa por procesos controlados: preparación de material, corte de precisión, soldadura y unión, ensamblaje, inspección de calidad y verificación de rendimiento.'
      items: ['Preparación de material', 'Corte de precisión', 'Soldadura y unión', 'Ensamblaje y QC']
    - title: 'Ingeniería de Escenarios de Usuario'
      body: 'Los productos se desarrollan en torno a aplicaciones reales — recreación, aventura y uso profesional — asegurando que cada diseño cumpla con las demandas específicas de su entorno previsto.'
      items: ['Recreación', 'Aventura', 'Profesional', 'Comercial']

