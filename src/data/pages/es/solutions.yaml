features3_solutions:
  tagline: Soluciones
  title: 'Su Socio De Aventuras<br />Acuáticas'
  isBeforeContent: false
  columns: 3
  items:
    - title: Clubes de deportes acuáticos
      description: 'Paquetes completos de equipamiento, marca personalizada y programas de mantenimiento para clubes de SUP, clubes de kayak, escuelas de surf y centros de entrenamiento.'
      icon: tabler:users
      link: /solutions/clubs
    - title: RIBs de deportes acuáticos
      description: 'RIBs diseñados para escuelas de vela, centros de deportes acuáticos y organizadores de eventos. Barcos de entrenamiento, de remolque y de seguridad para deportes acuáticos profesionales.'
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorts y hoteles
      description: 'Programas premium de deportes acuáticos con equipamiento de flota, sistemas de seguridad, formación de personal y gestión de ingresos para propiedades hoteleras.'
      icon: tabler:beach
      link: /solutions/resorts
    - title: Emprendedores de marcas acuáticas
      description: 'Fabricación OEM/ODM de marca privada con pedidos mínimos bajos, diseño de producto personalizado, embalaje y envío global para nuevos propietarios de marca.'
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Barcos para centros de buceo
      description: 'Plataformas RIB estables con fácil entrada y salida, almacenamiento de equipo y configuraciones de motor optimizadas para operaciones de buceo.'
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Embarcaciones de rescate y emergencia
      description: 'RIBs de alta velocidad y lanchas neumáticas diseñadas para búsqueda y rescate, respuesta de emergencia y operaciones de guardia costera.'
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Soluciones de tender para yates
      description: 'Tenders RIB compactos y elegantes que complementan superyates y embarcaciones de recreo. Fácil almacenamiento, gran rendimiento.'
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Soluciones de barcos de pesca
      description: 'Lanchas neumáticas y RIBs estables y duraderas configuradas para operaciones de pesca comercial y recreativa.'
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Equipamiento de turismo marino
      description: 'Lanchas neumáticas, tablas de SUP y kayaks listos para flotas para resorts, operadores turísticos y negocios de alquiler de deportes acuáticos.'
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIBs de energía offshore
      description: 'RIBs de servicio pesado para soporte de plataformas de petróleo y gas, transferencia de tripulación en parques eólicos, inspección de cables submarinos y construcción marina.'
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Embarcaciones de trabajo para acuicultura
      description: 'RIBs resistentes a la corrosión para piscicultura, cultivo de perlas y ranching oceánico. Tubos de Hypalon, herrajes de acero inoxidable, durabilidad de uso diario.'
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Investigación y prospección marina
      description: 'RIBs estables aptos para instrumentación para investigación oceanográfica, monitoreo ambiental, muestreo de calidad del agua y programas de enseñanza universitaria.'
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Embarcaciones de trabajo comerciales
      description: 'RIBs de servicio pesado para patrullaje, prospección, transporte y logística offshore. Construidos para las exigencias rigurosas de las operaciones comerciales.'
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: '¿No está seguro de qué camino se adapta a su negocio?'
  subtitle: 'Cuéntenos sobre su operación: le recomendaremos el paquete de equipamiento, el programa de marca o la solución personalizada adecuada.'
  actions:
    - variant: primary
      text: Solicite una consulta gratuita
      href: /contact
