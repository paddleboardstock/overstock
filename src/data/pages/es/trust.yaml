features3_lab:
  title: Laboratorio de ensayos y calidad interno
  subtitle: >-
    Cada lote de material y cada producto terminado pasa por nuestro laboratorio de ensayos in situ
    antes del envío.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ensayo de resistencia a la tracción
      description: >-
        Cada rollo de tejido PVC se ensaya según ASTM D751. Requisito mínimo: 350 N/cm en urdimbre y
        trama. Los lotes rechazados se devuelven al proveedor — rechazamos aproximadamente el 3 % de
        los materiales entrantes.
      icon: tabler:scale
    - title: Envejecimiento acelerado UV
      description: >-
        Muestras de tejido sometidas a 1.000 horas de exposición QUV (ASTM G154). La retención de
        resistencia a la tracción debe superar el 80 % tras la exposición UV. Productos calificados
        para más de 3 años de uso en exterior.
      icon: tabler:sun
    - title: Resistencia al pelado de costuras
      description: >-
        Costuras soldadas por RF ensayadas a 5 N/mm mínimos (ASTM D751). Costuras de Hypalon pegadas
        a mano ensayadas a 3,5 N/mm. Cada lote de producción tiene muestras de costura ensayadas
        destructivamente y archivadas.
      icon: tabler:stack
    - title: Mantenimiento de presión 24–48 h
      description: >-
        Cada producto inflable se infla a 1,25× la presión nominal y se monitoriza durante 24–48
        horas. Caída de presión máxima admisible: 5 %. Los productos que no superan este ensayo se
        reprocesan y reensayan antes del envío.
      icon: tabler:wind
    - title: Ensayo de ciclos de válvula
      description: >-
        Cada diseño de válvula supera 10.000 ciclos de apertura-cierre en laboratorio. Las válvulas
        deben mantener la estanqueidad a 1,25× la presión nominal tras el ciclado. Todas las válvulas
        Aquafarer están calificadas para más de 5 años de uso regular.
      icon: tabler:rotate
    - title: Resistencia al agrietamiento en frío
      description: >-
        Materiales ensayados a -30 °C durante 4 horas según ISO 4646. No se admite agrietamiento ni
        fragilización. Productos calificados para almacenamiento invernal y uso en agua fría hasta
        -10 °C de temperatura ambiente.
      icon: tabler:snowflake

steps2_manufacturing:
  title: 'Cómo aseguramos la calidad'
  subtitle: 'Desde la inspección de materias primas hasta las pruebas finales de presión — cada producto pasa por una rigurosa cadena de calidad.'
  items:
    - title: 'Inspección de Materias Primas'
      description: 'Cada rollo de tela PVC se prueba para espesor, resistencia a la tracción y resistencia UV antes de entrar en producción.'
      icon: 'tabler:search'
    - title: 'QC en Proceso'
      description: 'Las costuras soldadas, instalaciones de válvulas y uniones de cámaras se inspeccionan en cada estación durante el ensamblaje.'
      icon: 'tabler:eye'
    - title: 'Prueba de Presión'
      description: 'Cada producto inflable se infla a 1.25x el PSI nominal y se mantiene durante 24-48 horas para verificar la retención de aire y la integridad de las costuras.'
      icon: 'tabler:wind'
    - title: 'Inspección Final'
      description: 'Cada unidad se inspecciona para acabado, herrajes y embalaje antes de ser aprobada para envío. Las muestras de lotes van a nuestro laboratorio para pruebas destructivas.'
      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'Preguntas Frecuentes RIB'
  subtitle: 'Preguntas comunes sobre nuestras embarcaciones inflables de casco rígido.'
  columns: 2
  items:
    - title: '¿Qué tamaños de botes RIB ofrece Aquafarer?'
      description: 'Ofrecemos 35 modelos RIB desde 2.5 m hasta 7.6 m, cubriendo desde tenders compactos hasta embarcaciones comerciales y de patrulla pesadas. Cada modelo está disponible con múltiples opciones de configuración.'
    - title: '¿Cuál es la diferencia entre un RIB y un bote inflable tradicional?'
      description: 'Un RIB combina un casco sólido de fibra de vidrio o aluminio en V profunda con tubos inflables de Hypalon o PVC. Esto proporciona la estabilidad y capacidad de carga de un bote rígido con la absorción de impactos y flotabilidad de un inflable.'
    - title: '¿Qué motores son compatibles con los RIB de Aquafarer?'
      description: 'Nuestros RIB admiten motores fueraborda de 3 HP a 250 HP según el modelo. Cada página de producto enumera la potencia máxima del motor. Recomendamos consultar a su distribuidor para la combinación ideal.'
    - title: '¿Los RIB de Aquafarer están certificados CE?'
      description: 'Sí. Todos los modelos RIB recreativos están certificados CE según los estándares europeos aplicables para embarcaciones recreativas. Los modelos comerciales y de patrulla cumplen requisitos adicionales de estabilidad y carga.'
    - title: '¿Cuál es la garantía de los botes RIB?'
      description: 'Todos los RIB de Aquafarer vienen con una garantía estándar de un año contra defectos de fabricación, que cubre delaminación del casco, fallo de costuras, defectos de válvulas y problemas de herrajes.'
    - title: '¿Cuántas cámaras de aire tienen los RIB de Aquafarer?'
      description: 'Nuestros RIB cuentan con 3 a 7 cámaras de aire independientes según la longitud del modelo. Este diseño multicámara asegura que la embarcación permanezca a flote incluso si un compartimento se ve comprometido.'

faqs_inflatable:
  title: 'Preguntas Frecuentes Botes Inflables'
  subtitle: 'Preguntas comunes sobre nuestros dinghys, kayaks y botes inflables.'
  columns: 2
  items:
    - title: '¿Qué materiales se utilizan en los botes inflables Aquafarer?'
      description: 'Utilizamos PVC de grado militar (1100 denier) y caucho Hypalon/CSM premium, según el modelo. Ambos materiales están estabilizados contra UV, son resistentes a la abrasión y cumplen con las regulaciones REACH y RoHS de la UE.'
    - title: '¿Cuánto duran los botes inflables?'
      description: 'Con cuidado adecuado, un bote inflable de PVC de calidad dura de 7 a 10 años, mientras que los modelos de Hypalon pueden durar de 15 a 20 años. La limpieza regular, la protección UV y el almacenamiento adecuado extienden significativamente la vida útil.'
    - title: '¿Qué mantenimiento requiere un bote inflable?'
      description: 'El mantenimiento básico incluye enjuague con agua dulce después de cada uso (especialmente en agua salada), secado antes del almacenamiento, verificación anual de los sellos de las válvulas y aplicación de protector UV a los tubos. Evite la exposición prolongada al sol cuando no esté en uso.'
    - title: '¿Se pueden usar los botes inflables en agua salada?'
      description: 'Sí. Todos los botes inflables Aquafarer están diseñados para uso tanto en agua dulce como salada. Recomendamos enjuagar con agua dulce y secar completamente después de la exposición al agua salada para prevenir la corrosión de los herrajes y la cristalización de sal en la tela.'
    - title: '¿Cómo almaceno un bote inflable?'
      description: 'Desinfle, limpie y seque completamente el bote antes del almacenamiento. Enrolle suelto (evite pliegues pronunciados), almacene en un lugar fresco y seco alejado de la luz solar directa y manténgalo alejado de pisos de concreto para evitar la absorción de humedad.'
    - title: '¿Cuál es la capacidad de peso de los botes inflables Aquafarer?'
      description: 'Las capacidades de peso van desde 290 kg para nuestros modelos más pequeños hasta más de 2000 kg para embarcaciones comerciales más grandes. Cada página de producto enumera la carga máxima para su modelo específico.'

faqs_sup:
  title: 'Preguntas Frecuentes SUP'
  subtitle: 'Preguntas comunes sobre nuestras tablas de paddleboarding.'
  columns: 2
  items:
    - title: '¿Qué tamaños de tablas SUP están disponibles?'
      description: 'Ofrecemos tablas SUP desde 9 pies hasta 12 pies, incluyendo diseños todoterreno, de travesía, yoga y especiales. Nuestros modelos más vendidos incluyen Tropical Breeze (10 pies) y Ocean Voyager (11 pies).'
    - title: '¿Qué es la construcción drop-stitch?'
      description: 'La construcción drop-stitch utiliza miles de hilos de poliéster que conectan las capas superior e inferior de la tabla, permitiendo mantener alta presión de aire (15-20 PSI) y lograr una plataforma rígida y estable. Este es el estándar de la industria para SUP inflables premium.'
    - title: '¿Cuál es el límite de peso para las tablas SUP?'
      description: 'Nuestras tablas SUP soportan hasta 150 kg según el modelo y volumen. Leviathan Wake es nuestro modelo de mayor capacidad, diseñado para usuarios más grandes y uso en yoga.'
    - title: '¿Ofrecen paquetes completos de SUP?'
      description: 'Sí. Cada tabla SUP se envía con un paquete completo que incluye un remo de aluminio de 3 piezas, bomba manual de alta presión, correa espiral, mochila de viaje y kit de reparación. Algunos modelos también incluyen un juego de aletas desmontables.'
    - title: '¿Cuál es la garantía de las tablas SUP?'
      description: 'Todas las tablas SUP Aquafarer tienen una garantía de un año contra defectos de fabricación, incluyendo fallo de costuras, defectos de válvulas y delaminación de material bajo uso normal.'
    - title: '¿Cuánto tiempo se tarda en inflar una tabla SUP?'
      description: 'Usando la bomba manual incluida, la inflación completa a 15 PSI toma aproximadamente 8-12 minutos. Para inflación más rápida, recomendamos nuestra bomba eléctrica Aquafarer 12V, que infla una tabla en menos de 4 minutos.'

