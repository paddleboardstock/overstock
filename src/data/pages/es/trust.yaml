features3_certifications:
  title: Calidad y pruebas
  subtitle: Cada placa se prueba en nuestro propio laboratorio antes de enviarse — números reales, registros reales, sin afirmaciones de marketing.
  columns: 3
  isBeforeContent: true
  items:
    - title: Construido en nuestra propia fábrica
      description: Poseemos y operamos una instalación de Weihai de 12.000 m². Cada lote de producción es rastreable, documentado e inspeccionado — sin fabricación misteriosa externalizada.
      icon: tabler:building-factory
    - title: Laboratorio de Ensayos de Materiales
      description: El laboratorio de materiales interno analiza la resistencia a la tracción, UV resistencia, integridad de la costura y abrasión para cada lote de tela antes de la producción.
      icon: tabler:microscope
    - title: Materiales de grado marino
      description: UV- PVC estabilizados, drop-stitch núcleos y EVA espuma de terraza — seleccionados y probados para estaciones de sol, sal y abuso.
      icon: tabler:flask
    - title: Garantía de 2 años SUP
      description: Paddle Board Overstock SUP Las placas cuentan con una garantía de 2 años contra defectos de fabricación, incluyendo juntas, válvulas y deslaminación de materiales. Respaldamos lo que construimos.
      icon: tabler:shield-check
testimonials:
  tagline: Confianza en el cliente
  title: Lo que dicen nuestros clientes
  subtitle: Desde palistas primerizos hasta exploradores experimentados — descubre por qué Paddle Board Overstock confían en ellos.
  items:
    - content: Como comprador primerizo, estaba nervioso por pedir desde el extranjero. El equipo respondió a todas las preguntas con fotos reales y registros de pruebas antes incluso de que yo preguntara. La junta llegó en 6 días y superó mis expectativas.
      name: James Thornton
      title: SUP Propietario del Explorer 11 — Vancouver, Canadá
features3_lab:
  title: Laboratorio interno de pruebas y calidad
  subtitle: Cada lote de material y producto terminado pasa por nuestro laboratorio de pruebas in situ antes de su envío.
  columns: 3
  isBeforeContent: true
  items:
    - title: Ensayo de resistencia a la tracción
      description: 'Cada PVC rollo de tela se prueba internamente para comprobar su resistencia a la tracción. Requisito mínimo: urdimbre y trama de 350 N/cm. Los lotes rechazados se devuelven al proveedor — rechazamos aproximadamente el 3% de los materiales entrantes.'
      icon: tabler:scale
    - title: UV Envejecimiento acelerado
      description: Las muestras de tela sufren un envejecimiento acelerado de 1.000 horas UV . La resistencia a la tracción debe retener el 80%+ tras la exposición. Productos clasificados para 3+ años de uso en exteriores.
      icon: tabler:sun
    - title: Resistencia a la descascada de la costura
      description: Las juntas soldadas se prueban hasta una resistencia mínima al despegamento de 5 N/mm. Cada lote de producción tiene muestras de la junta analizadas y archivadas de forma destructiva.
      icon: tabler:stack
    - title: Mantenimiento de presión de 24 a 48 horas
      description: 'Cada producto hinchable inflado a 1,25x de la clasificación PSI y monitorizado durante 24–48 horas. Caída máxima de presión permitida: 5%. Los productos que no superan esta prueba se reelaboran y vuelven a analizar antes del envío.'
      icon: tabler:wind
    - title: Pruebas de ciclo de válvulas
      description: Cada diseño de válvula pasa por 10.000 ciclos de apertura y cierre en nuestro laboratorio. Las válvulas deben mantener un sellado hermético a 1,25 veces la presión nominal tras el ciclo. Todas Paddle Board Overstock las válvulas están homologadas para+ 5 años de uso regular.
      icon: tabler:rotate
    - title: Resistencia a grietas en frío
      description: Los materiales se prueban a -30°C durante 4 horas. No se permiten grietas ni fragilizas. Productos clasificados para almacenamiento en invierno y uso en agua fría hasta -10°C a temperatura ambiente.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Cómo garantizamos la calidad
  subtitle: Desde la inspección de materias primas hasta la prueba final de presión, cada producto pasa por una rigurosa cadena de calidad.
  items:
    - title: Inspección de materia prima
      description: Cada rollo de PVC tela se prueba para comprobar su grosor, resistencia a la tracción y UV resistencia antes de entrar en producción.
      icon: tabler:search
    - title: Control de calidad en proceso
      description: Las juntas de soldadura, las instalaciones de válvulas y las uniones de la cámara se inspeccionan en cada estación durante el montaje.
      icon: tabler:eye
    - title: Prueba de Presión
      description: Cada producto hinchable se infla a 1,25x de la clasificación PSI y se mantiene durante 24–48 horas para verificar la retención de aire y la integridad de las juntas.
      icon: tabler:wind
    - title: Inspección final
      description: Cada unidad es inspeccionada para el acabado, el hardware y el embalaje antes de ser aprobada para su envío. Las muestras en lote se envían a nuestro laboratorio para pruebas destructivas.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Preguntas frecuentes sobre la junta
  subtitle: Preguntas frecuentes sobre nuestras tablas de paddle up.
  columns: 2
  items:
    - title: ¿Qué SUP tamaños de placa hay disponibles?
      description: Ofrecemos SUP tablas de 9 a 12 pies, incluyendo diseños para todoterreno, turismo, yoga y especiales. Nuestros modelos más vendidos incluyen la Tropical Breeze (10 pies) y la Ocean Voyager (11 pies).
    - title: ¿Qué es drop-stitch la construcción?
      description: Drop-stitch La construcción utiliza miles de hilos de poliéster que conectan las capas superior e inferior de la placa, permitiendo que mantenga una alta presión de aire (15–20 PSI) y logre una plataforma rígida y estable. Este es el estándar industrial para los hinchables premium SUPs.
    - title: ¿Cuál es el límite de peso para SUP las tablas?
      description: Nuestras SUP tablas soportan hasta 150 kg dependiendo del modelo y el volumen. La Leviathan Wake es nuestro modelo de mayor capacidad, diseñada para riders más grandes y uso de yoga.
    - title: ¿Ofrecéis SUP paquetes completos?
      description: Sí. Cada SUP tabla viene con un paquete completo que incluye una paleta de aluminio de 3 piezas, bomba manual de alta presión, correa de bobina, mochila de viaje y kit de reparación. Algunos modelos también incluyen un juego de aletas extraíbles.
    - title: ¿Cuál es la garantía de SUP las placas?
      description: Todas Paddle Board Overstock SUP las placas cuentan con una garantía de 2 años contra defectos de fabricación, incluyendo fallo en la junta, defectos en las válvulas y delaminación de materiales bajo uso normal.
    - title: ¿Cuánto tiempo se tarda en inflar una SUP tabla?
      description: Con la bomba manual incluida, una inflación completa hasta 15 PSI minutos lleva aproximadamente 8–12 minutos. Para una inflación más rápida, recomendamos nuestra Paddle Board Overstock bomba eléctrica de 12V, que infla una tabla en menos de 4 minutos.
