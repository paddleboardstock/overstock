hero:
  tagline: Socios y Distribución
  title: 'Conviértase en Socio de Paddle Board Overstock<br />— Red Global de Distribución'
  subtitle: 'Únase a la red global de socios de Paddle Board Overstock. Trabajamos con distribuidores marinos, concesionarios de embarcaciones, minoristas de equipos y socios de marca en más de 50 países.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Red global de socios y distribuidores de Paddle Board Overstock
content_programs:
  tagline: Programas para Socios
  title: 'Programas para Socios<br />Diseñados para Crecer'
  subtitle: 'Ya sea distribuidor, concesionario o socio de marca, Paddle Board Overstock ofrece programas diseñados para apoyar su negocio.'
  columns: 3
  items:
    - title: 'Programa de Distribuidor'
      description: 'Distribución exclusiva por territorio con precios por volumen, apoyo de marketing y acceso directo a la fábrica. Compromiso mínimo requerido según el tamaño del territorio.'
      icon: tabler:world
    - title: 'Programa de Concesionario'
      description: 'Precios directos de concesionario, formación de producto, materiales de marketing y soporte de garantía para tiendas físicas y tiendas en línea.'
      icon: tabler:building-store
    - title: 'Colaboración OEM/ODM'
      description: 'Fabricación OEM y ODM de servicio completo con marca personalizada, embalaje y especificaciones de producto. Del concepto al contenedor.'
      icon: tabler:certificate
    - title: 'Colaboración de Marca'
      description: 'Co-branding, marca privada y programas de modelos exclusivos para marcas establecidas en el sector marino y recreativo al aire libre.'
      icon: tabler:stars
    - title: 'Gobierno e Instituciones'
      description: 'Programas de proveedor preferente para agencias gubernamentales, guardias costeras, fuerzas armadas y organizaciones humanitarias. Documentación lista para licitaciones.'
      icon: tabler:building-community
    - title: 'Socio de Resort y Alquiler'
      description: 'Precios de flota, calidad constante y marca personalizada para resorts, centros de buceo y operaciones de alquiler en todo el mundo.'
      icon: tabler:sun
content_benefits:
  tagline: Por Qué Asociarse Con Nosotros
  title: 'Por Qué los Socios Eligen Paddle Board Overstock'
  subtitle: 'Nuestros socios se benefician de una capacidad de fabricación real, calidad constante y soporte receptivo.'
  list:
    - 'Acceso Directo a la Fábrica: Trabaje directamente con nuestro equipo de fabricación — sin intermediarios. Respuestas más rápidas, mejores precios y visibilidad total de la producción.'
    - 'Personalización Lista: Personalice sus productos con colores, logotipos, embalajes y especificaciones a medida. Cantidades mínimas de pedido adaptadas a su mercado.'
    - 'Calidad Garantizada: Producción certificada ISO 9001 con cumplimiento CE, UKCA y BSCI. Cada producto se prueba antes del envío.'
    - 'Logística Global: Envíos desde Qingdao, China, con opciones FOB, CIF y DDP. Almacén en EE. UU. en Montclair, CA para la distribución en Norteamérica.'
    - 'Apoyo de Marketing: Catálogos de producto, fotografía, documentación técnica y recursos digitales para apoyar sus esfuerzos de venta.'
    - 'Formación y Soporte: Formación de producto para su equipo de ventas, soporte técnico para sus clientes y coordinación del servicio de garantía.'
content_process:
  tagline: Cómo Convertirse en Socio
  title: 'Proceso de Colaboración Sencillo'
  subtitle: 'Nuestro proceso de colaboración es directo — diseñado para que empiece a vender productos Paddle Board Overstock rápidamente.'
  items:
    - title: 'Paso 1: Enviar la Solicitud'
      description: 'Complete nuestro formulario de solicitud de socio con el perfil de su empresa, su mercado objetivo y sus intereses de producto.'
    - title: 'Paso 2: Revisión de Calificación'
      description: 'Nuestro equipo de colaboración revisa su solicitud y le contacta en un plazo de 3 días laborables para hablar de las oportunidades.'
    - title: 'Paso 3: Acuerdo y Configuración'
      description: 'Firme un acuerdo de colaboración, configure su cuenta y reciba precios de socio, materiales de marketing y muestras de producto.'
    - title: 'Paso 4: Formación y Lanzamiento'
      description: 'Se proporcionan formación de producto, soporte de ventas y material de marketing. Ya está listo para empezar a vender.'
cta:
  title: '¿Listo para convertirse en socio de Paddle Board Overstock?'
  subtitle: 'Solicite la colaboración y nuestro equipo responderá en un plazo de 3 días laborables.'
  actions:
    - variant: primary
      text: Solicitar colaboración
      href: /contact
    - text: Ver nuestros productos
      href: /products
