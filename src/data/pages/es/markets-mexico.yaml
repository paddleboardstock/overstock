hero:
  tagline: México
  title: SUP Tablas mayoristas para<br />Minoristas mexicanos
  subtitle: Desde Cancún y Tulum hasta Puerto Vallarta y Los Cabos — tablas de paddle nuevas y de sobrestock para tiendas de playa mexicanas, hoteles y vendedores online, desde 5 tablas.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Tableros de excedentes para minoristas de playa mexicana y operadores hoteleros
direct_answer: Paddle Board Overstock suministra tablas inflables nuevas y sobrantes SUP a negocios mexicanos — minoristas de playa en Cancún, Tulum, Puerto Vallarta y Los Cabos, operadores hoteleros, flotas de alquiler y vendedores online. Los pedidos mayoristas comienzan con 5 tablas con modelos mixtos en un solo envío, enviados desde Weihai, China, por transporte aéreo exprés o transporte marítimo consolidado. Cada placa está 100% testada a presión y cubierta por la garantía de 2 SUP años.
tldr_points:
  - Mayorista de 5 placas — modelos mixtos, con precios por cantidad total
  - Sirviendo a las ciudades comerciales de playas caribeñas y del Pacífico de México
  - Transporte aéreo exprés o marítimo consolidado desde Weihai, China
  - 100% probado por presión, SUP garantía de 2 años en cada placa
overview_section:
  tagline: Visión general del mercado
  title: El mercado mexicano SUP
  paragraphs:
    - México cuenta con dos de las mejores costas turísticas de playa del mundo. El lado caribeño — Cancún, Playa del Carmen, Tulum, Cozumel — ofrece aguas turquesas cálidas y planas que prácticamente están hechas para remar de pie, mientras que el lado del Pacífico — Puerto Vallarta, Sayulita, Los Cabos — combina la cultura del surf con bahías protegidas, ideales para clases y alquileres. El turismo durante todo el año mantiene la demanda estable, y una comunidad mexicana de remeros en crecimiento compra localmente entre visitas.
    - The typical buyer here is a small beach business: una escuela de paddle que vende tablas a sus alumnos, un hotel boutique que SUP mejora la experiencia de los huéspedes, una tienda de surf que se amplía hacia aguas planas, o un vendedor online que atiende al mercado nacional. Los pedidos son de 5 a 20 tablas, mezcladas entre modelos duraderos y versátiles para clases y alquileres y algunas ediciones premium para exhibición en tienda.
  customer_types:
    - title: Operadores de la Costa Caribe
      description: Escuelas de remo y puestos de alquiler en Cancún, Tulum y Playa del Carmen atienden la demanda turística diaria.
    - title: Hoteles boutique
      description: Pequeños hoteles y casas de SUP huéspedes que añadieron programas para huéspedes con flotas mixtas compactas.
    - title: Vendedores online
      description: Vendedores mexicanos de comercio electrónico importando su primer SUP stock para el mercado interno.
shipping_section:
  title: Barco a México
  paragraphs:
    - Los pedidos se envían desde Weihai, China. El transporte aéreo exprés transporta muestras y de 1 a 3 pedidos de carga rápidamente hacia Ciudad de México y los aeropuertos turísticos; Consolidated Sea Freight atiende entre 5 y 20 pedidos al por mayor a bordo a través de los puertos del Pacífico y el Golfo de México. Ambas opciones se cotizan con tiempos estimados de tránsito para tu destino.
    - Proporcionamos la factura comercial y la lista de empaquetado que necesita tu agente aduanero, con los códigos HS correctos y los valores declarados. Los derechos de importación y los impuestos son a cargo del importador según las normas mexicanas.
  customs_note: 'El régimen de importación de equipamiento deportivo en México está impulsado por intermediarios: trabaja con tu agente aduanal para confirmar el tratamiento actual de los derechos y impuestos antes de hacer el pedido. Proporcionamos documentación completa y consistente para un saldo fluido.'
faq_section:
  title: Preguntas frecuentes sobre México
  items:
    - q: ¿Se pueden gestionar los presupuestos y el soporte en español?
      a: Sí — trabajamos con compradores hispanohablantes en toda América Latina. Pregunta en tu consulta y nos encargaremos de tu presupuesto y pedido en español.
    - q: ¿Cómo es un primer pedido para una tienda de Tulum o Cancún?
      a: 'La mayoría empiezan con 5–10 tablas: una base de modelos para principiantes y todo en el mercado turístico, además de una o dos ediciones artísticas premium para exhibición y venta al público. Modelos mixtos, un envío, con precios por cantidad total.'
    - q: ¿Cómo llegan las tablas a México?
      a: Envío exprés por aire para muestras y pedidos pequeños urgentes; flete marítimo consolidado para cantidades al por mayor, cotizado por puerto. Ambos están detallados en su cotización con tiempos estimados de tránsito.
    - q: ¿Quién se encarga de los aranceles de importación en México?
      a: Usted, como importador, a través de su agente aduanal. Nosotros proporcionamos la factura comercial y la lista de empaque con los códigos HS correctos para que su agente pueda despachar el envío de manera predecible.
