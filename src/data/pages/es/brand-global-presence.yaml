hero:
  tagline: Presencia Global
  title: 'Sirviendo a Más de 50 Países<br />en Todos los Continentes'
  subtitle: 'Desde operadores europeos de patrulla costera hasta distribuidores australianos de deportes acuáticos y equipos de rescate de Oriente Medio — las embarcaciones Paddle Board Overstock navegan en aguas de todo el mundo.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabricación y distribución marina global de Paddle Board Overstock
stats:
  title: Alcance Global
  stats:
    - title: Países
      amount: '50+'
    - title: Mercados de Exportación
      amount: Europa, América, Asia, Oriente Medio, Oceanía
    - title: Producción
      amount: Qingdao, China
    - title: Almacén en EE. UU.
      amount: Montclair, CA
features3_markets:
  tagline: Mercados Clave
  title: 'Experiencia Regional<br />para Requisitos Locales'
  subtitle: 'Entendemos que los distintos mercados tienen diferentes requisitos normativos, preferencias y casos de uso.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa y Reino Unido
      description: 'Productos certificados CE que cumplen las normas EN ISO 6185. Fuerte demanda de RIBs, embarcaciones inflables y tablas SUP en los mercados de la UE. Los distribuidores británicos valoran nuestro rápido tiempo de respuesta.'
      icon: tabler:map-pin
    - title: Norteamérica
      description: 'Fabricación aprobada por la Guardia Costera de EE. UU. Almacén en EE. UU. en Montclair, CA para entregas rápidas en la costa oeste. Demanda creciente de embarcaciones de pesca, embarcaciones de rescate y SUPs recreativos.'
      icon: tabler:map-pin
    - title: Australia y Oceanía
      description: 'Mercado sólido para barcos RIB y tender inflables. Los distribuidores australianos valoran nuestros barcos de Hypalon por su resistencia a los rayos UV en condiciones de sol intenso. Envío rápido desde nuestras instalaciones en Asia.'
      icon: tabler:map-pin
    - title: Oriente Medio
      description: 'Demanda creciente de embarcaciones de patrulla y rescate. Nuestros RIB de casco de aluminio son populares entre las guardias costeras y operadores de seguridad. Configuraciones personalizadas para entornos de altas temperaturas.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Red de Distribución
  title: 'Colaboración con Distribuidores<br />en Todo el Mundo'
  subtitle: 'Trabajamos con distribuidores de equipos marinos establecidos, marcas OEM y agencias de compras gubernamentales.'
  isBeforeContent: false
  columns: 3
  items:
    - title: Colaboraciones OEM/ODM
      description: 'Fabricación con marca privada para marcas globales de deportes acuáticos. Nos encargamos de todo, desde el diseño hasta la producción y el envío directo.'
      icon: tabler:building
    - title: Red de Distribuidores
      description: 'Distribuidores autorizados en más de 20 países mantienen stock y ofrecen soporte local. Se aceptan solicitudes de nuevos distribuidores.'
      icon: tabler:users
    - title: Gobierno e Instituciones
      description: 'Suministro directo a guardias costeras, organizaciones de búsqueda y rescate y programas de compra militar. Cumplimiento de los requisitos de adquisición institucional.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Logística y Soporte Globales'
  subtitle: 'De la fábrica al destino — gestionamos toda la cadena de suministro.'
  items:
    - title: Opciones de Envío
      description: 'Flete marítimo (FOB Qingdao), flete aéreo para pedidos urgentes y mensajería exprés para muestras y piezas de repuesto.'
      icon: tabler:truck-delivery
    - title: Almacén en EE. UU.
      description: 'Stock en Montclair, CA para entrega rápida en toda Norteamérica. Costa oeste: 2-3 días, centro: 3-4 días, costa este: 4-5 días.'
      icon: tabler:building-warehouse
    - title: Piezas de Repuesto
      description: 'Piezas de repuesto genuinas de Paddle Board Overstock y consumibles disponibles todo el año. Las piezas comunes se envían en 24 horas.'
      icon: tabler:package
    - title: Soporte Técnico
      description: 'Línea directa con nuestro equipo de ingeniería para preguntas técnicas, asesoramiento sobre reparaciones y soporte de reacondicionamiento. Damos soporte a embarcaciones que construimos hace 20 años.'
      icon: tabler:headset
cta:
  title: '¿Quiere convertirse en distribuidor?'
  subtitle: 'Estamos ampliando activamente nuestra red de distribución. Contacte con nuestro equipo de exportación para hablar de las oportunidades de colaboración.'
  actions:
    - variant: primary
      text: Consulta de colaboración
      href: /contact
    - text: Ver nuestra gama de productos
      href: /products
