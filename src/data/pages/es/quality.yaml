commitment:
  title: Nuestro compromiso
  body: A través de estos rigurosos procedimientos de prueba, {SITE} ofrece a los clientes la seguridad de que nuestras tablas hinchables SUP no solo son de alto rendimiento, sino que también están diseñadas para durar — asegurando innumerables aventuras agradables y seguras en el agua. Nuestro laboratorio de calidad opera de forma independiente de la producción y reporta directamente a la dirección.
  cta: Solicitar documentación de pruebas
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock opera un programa de pruebas de calidad con 8 protocolos que cubren presión, impacto, UV, abrasión, baja temperatura, flotabilidad, maniobrabilidad e impermeabilidad. Tasa de defectos del 0,7% en los envíos de los últimos 12 meses.
  points:
    - '8 protocolos de prueba: presión, impacto, UV, abrasión, baja temperatura, flotabilidad, maniobrabilidad e impermeabilidad'
    - Tasa de 99,3% libre de defectos en los envíos de los últimos 12 meses
    - Cada unidad pasa por una retención de 24-48 horas a 1,25 veces la presión nominal con una tolerancia máxima de caída del 5%
    - Pruebas de intemperismo acelerado UV (1.000+ horas) y resistencia a la abrasión del recubrimiento
testing_note: Cada prueba sigue protocolos internos documentados. Los resultados de las pruebas se registran, son rastreables y revisados por nuestro laboratorio de calidad independiente.
