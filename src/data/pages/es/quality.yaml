tests:
  - title: Prueba de Presión
    standard: Especificaciones internas AF-PT-001
    description: Las cámaras inflables se presurizan a 1,25 veces el límite de funcionamiento recomendado y se mantienen durante 30 minutos. Se mide la decaimiento de presión para validar la hermeticidad y la integridad estructural de materiales y juntas.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Pruebas de impacto
    standard: Especificaciones internas AF-IT-002
    description: Los productos están sometidos a impactos controlados por pesos de caída estandarizados y aparatos de péndulo. Esto evalúa la resistencia a la perforación, la propagación de desgarros y la resistencia estructural frente a colisiones con obstáculos, muelles y escombros.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Pruebas de resistencia
    standard: Protocolo de Prueba Interno
    description: Las muestras de materiales se exponen a lámparas UVA-340 en cámaras de meteorización acelerada durante 1.000+ horas. Medimos el cambio de color (Delta E), la retención de brillo y la pérdida de resistencia a la tracción para UV validar los encapsulados estabilizadores.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Ensayo de resistencia a la abrasión
    standard: Protocolo de Prueba Interno
    description: Las muestras de materiales se someten a ruedas abrasivas CS-10 bajo cargas de 500g/1.000g durante 1.000 ciclos. La pérdida de masa y la clasificación visual de desgaste determinan la durabilidad del recubrimiento frente a arena, grava y lanzamientos repetidos.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Pruebas de rendimiento a baja temperatura
    standard: Especificaciones internas AF-LT-003
    description: Los productos y cupones de materiales ensamblados se acondicionan a -20°C, -10°C y 0°C durante 24 horas y luego se prueban por flexión. Verificamos que PVC se mantenga flexible sin grietas ni delaminaciones.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Pruebas de flotabilidad y capacidad de carga
    standard: Protocolo de Prueba Interno
    description: Los productos se cargan incrementalmente hasta 1,25 veces la capacidad nominal en un pool controlado. Se registran el rendimiento de bordo, estabilidad y auto-drenaje. La capacidad nominal de cada modelo se verifica matemática y empíricamente.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Pruebas de maniobrabilidad
    standard: Especificaciones internas AF-MT-004
    description: Las pruebas en el agua miden el radio de giro, la aceleración, el tiempo de planeo y la respuesta de paletas/motores en una variedad de condiciones de carga. Las características de manejo en el mundo real se validan frente a objetivos de diseño.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Pruebas de estanqueidad
    standard: Especificaciones internas AF-WT-005
    description: Cada producto ensamblado se prueba por pulverización a 0,5 bar en todas las juntas, válvulas y accesorios. Una prueba de sumergida presurizada de 5 minutos valida la estanqueidad de la cámara y de las válvulas. Estándar de fuga cero antes del envío.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
