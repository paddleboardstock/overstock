hero_text:
  tagline: Recursos
  title: Centro de descarga y guías de remo
  subtitle: Catálogos de productos, guías de compra e instrucciones de cuidado para ayudarte a elegir, usar y disfrutar de tu SUP tabla hinchable.
features3_downloads:
  tagline: Descargas
  title: Documentación del producto<br />& Recursos para el remo
  isBeforeContent: false
  columns: 2
  items:
    - title: Catálogo de productos 2026 SUP
      description: 'La gama completa Paddle Board Overstock SUP : tablas completas, series de arte y accesorios, con especificaciones completas y contenido del paquete. Formato PDF.'
      icon: tabler:file-text
    - title: Guía de compra inflable SUP
      description: 'Cómo elegir tu primera tabla: longitud, ancho, grosor, volumen, ajuste del peso del sprinter y qué forma de tabla se adapta a tu estilo de remo.'
      icon: tabler:file-description
    - title: SUP Guía de tallas y ajuste
      description: Ajusta el volumen y las dimensiones de la tabla a tu peso y nivel, con recomendaciones específicas para actividades recreativas, turismo, yoga y fitness.
      icon: tabler:clipboard-check
    - title: Guía de Cuidado y Mantenimiento de Viviendas
      description: 'Mantén tu placa como nueva: limpiando, secando, almacenando, UV protegiendo, cuidando las válvulas e instrucciones de reparación menor.'
      icon: tabler:tool
    - title: Guía de materiales para tablas inflables
      description: PVC construcción, drop-stitch núcleos, EVA almohadillas de cubierta y lo que PSI la rigidez de 15 significa para rendimiento y durabilidad.
      icon: tabler:files
    - title: Empezando con SUP
      description: 'Conceptos básicos para un remero primerizo: inflación, carga, lanzamiento, brazadas básicas y aspectos esenciales de seguridad para mantenerte de pie el primer día.'
      icon: tabler:swimming
faqs:
  title: Preguntas Frecuentes
  subtitle: Preguntas frecuentes sobre nuestras tablas, el pedido y cómo subirse al agua.
  columns: 2
  items:
    - title: ¿Qué incluye mi placa?
      description: Cada paquete completo incluye la tabla, el remo ajustable, la bomba de alto caudal, la correa, el kit de reparación y la mochila. El Juego de Remos y Bomba también está disponible por separado.
      icon: tabler:package
    - title: ¿Cuánto tarda la inflación?
      description: 'Con la bomba de alto caudal incluida, la mayoría de los remeros alcanzan la presión máxima en 8-12 minutos. Las bombas eléctricas también funcionan: solo hay que parar en la presión nominal impresa cerca de la válvula.'
      icon: tabler:clock
    - title: ¿Cómo elijo el tablero adecuado?
      description: 'Empieza por tu peso y estilo de remo: a los principiantes y familias les encantan plataformas anchas y estables como la SUP Explorer 11; los practicantes de yoga prefieren tracción a toda la cubierta; los practicantes de travesía quieren formas rígidas y aerodinámicas. Nuestro equipo está encantado de recomendarlo.'
      icon: tabler:help-circle
    - title: ¿Qué métodos de pago aceptáis?
      description: Aceptamos tarjetas de crédito principales, PayPal y transferencias bancarias. Todos los precios incluyen el paquete completo — sin extras ocultos.
      icon: tabler:currency-dollar
    - title: ¿Cuánto tiempo tarda la entrega?
      description: Los pedidos se envían desde nuestra fábrica y normalmente llegan en un plazo de 5-10 días laborables, dependiendo de tu región. Se proporciona seguimiento para cada pedido.
      icon: tabler:truck-delivery
    - title: ¿Está mi tabla cubierta por garantía?
      description: 'Sí: cada tabla está cubierta contra defectos de fabricación, y cada unidad es sometida a una prueba de presión de 1.25 veces su presión nominal durante 24-48 horas antes de salir de la fábrica. Nuestra tasa de reclamaciones de garantía es inferior al 2%.'
      icon: tabler:shield-check
cta:
  title: ¿Necesita ayuda para encontrar la tabla adecuada?
  subtitle: Contacte a nuestro equipo para recibir asesoramiento honesto sobre la selección de tablas, tamaño o preguntas sobre pedidos.
  actions:
    - variant: primary
      text: Contacta a nuestro equipo
      href: /contact
