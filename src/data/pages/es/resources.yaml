hero_text:
  tagline: Recursos
  title: 'Centro de descargas y guías de compra'
  subtitle: 'Acceda a catálogos de productos, guías OEM, listas de verificación para compradores y documentación técnica para tomar decisiones de compra informadas.'
features3_downloads:
  tagline: Descargas
  title: 'Documentación de producto<br />y recursos para compradores'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Catálogo de productos marinos 2026'
      description: 'Gama completa de productos, incluidos barcos RIB, barcos inflables, tablas de SUP, kayaks y accesorios. Especificaciones, configuraciones y opciones. Formato PDF.'
      icon: tabler:file-text
    - title: 'Guía de fabricación OEM'
      description: 'Todo lo que necesita saber sobre las asociaciones OEM/ODM: descripción del proceso, cantidades mínimas de pedido, opciones de personalización, control de calidad y envío.'
      icon: tabler:building-factory
    - title: 'Guía de compra de barcos RIB'
      description: 'Cómo elegir el RIB adecuado: materiales del casco, materiales de los flotadores, selección del motor, consideraciones sobre el tamaño y opciones de configuración para distintas aplicaciones.'
      icon: tabler:file-description
    - title: 'Lista de verificación de proveedores de SUP'
      description: 'Aspectos clave al seleccionar un fabricante de tablas de SUP: indicadores de calidad, requisitos de certificación, consideraciones sobre el MOQ y qué buscar en una auditoría de fábrica.'
      icon: tabler:clipboard-check
    - title: 'Guía de materiales para barcos inflables'
      description: 'PVC frente a Hypalon: comparación de durabilidad, resistencia a los rayos UV, vida útil, opciones de reparación y consideraciones de coste para distintas aplicaciones marinas.'
      icon: tabler:files
    - title: 'Plantilla de brief para fabricación personalizada'
      description: 'Descargue nuestra plantilla de brief de producto. Complete sus requisitos y envíenosla de vuelta para recibir un presupuesto y una evaluación de viabilidad en el plazo de una semana.'
      icon: tabler:template
faqs:
  title: Preguntas frecuentes
  subtitle: 'Preguntas habituales sobre nuestros productos, el proceso de fabricación y nuestro modelo de colaboración.'
  columns: 2
  items:
    - title: ¿Cuál es la cantidad mínima de pedido?
      description: 'El MOQ varía según la categoría de producto. Los barcos RIB suelen partir de 10 unidades por modelo; las tablas de SUP, de 50 unidades. Póngase en contacto con nuestro equipo comercial para conocer el MOQ específico de cada producto.'
      icon: tabler:help-circle
    - title: ¿Puedo obtener muestras antes de realizar un pedido?
      description: 'Sí. Aquafarer fabrica muestras para su evaluación antes de la producción en serie. El coste de las muestras es negociable y suele descontarse del primer pedido de producción.'
      icon: tabler:package
    - title: ¿Qué condiciones de pago están disponibles?
      description: 'Las condiciones estándar son un 30 % de anticipo con el pedido y el 70 % antes del envío. Se ofrecen condiciones de carta de crédito (LC) para clientes cualificados. Contacte con nuestro equipo financiero para acordar las modalidades.'
      icon: tabler:currency-dollar
    - title: ¿Cuánto tiempo tarda la producción?
      description: 'Plazos de entrega habituales: barcos RIB entre 30 y 45 días, tablas de SUP entre 20 y 30 días, barcos inflables entre 25 y 35 días. El desarrollo personalizado añade entre 15 y 30 días para la creación de prototipos.'
      icon: tabler:calendar-clock
    - title: ¿Qué certificaciones tienen sus productos?
      description: 'Certificación CE para los mercados de la UE, fabricación aprobada por la Guardia Costera de EE. UU., sistema de calidad ISO, cumplimiento de BSCI y cumplimiento de materiales REACH.'
      icon: tabler:certificate
    - title: ¿Ofrecen embalaje y marca personalizados?
      description: 'Sí. Ofrecemos embalajes personalizados con su logotipo, sus colores y su identidad de marca. El MOQ para embalajes personalizados depende de la categoría de producto.'
      icon: tabler:color-swatch
cta:
  title: '¿Necesita ayuda para encontrar el recurso adecuado?'
  subtitle: 'Contacte con nuestro equipo para recibir asesoramiento personalizado sobre selección de productos, asociaciones OEM o especificaciones técnicas.'
  actions:
    - variant: primary
      text: Contacte con nuestro equipo
      href: /contact