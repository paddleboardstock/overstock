content_system:
  tagline: Resumen del sistema de control de calidad
  title: Calidad Integrada<br />Marco de Control
  subtitle: Nuestro sistema de control de calidad opera de manera independiente de la producción y reporta directamente a la gerencia. Ningún lote se envía sin la liberación de calidad firmada por el laboratorio de calidad.
  items:
    - title: Laboratorio de Calidad Independiente
      description: 'Nuestro laboratorio de calidad funciona como una función separada de la producción. Los inspectores de control de calidad reportan al Gerente de Calidad, no al Director de Producción. Esta independencia organizacional asegura que las decisiones de calidad se tomen de manera objetiva: los plazos de producción nunca prevalecen sobre los requisitos de calidad.'
      features:
        - Informa directamente a la gerencia, independiente de la producción
        - Autorizado para detener la producción por problemas de calidad
        - 12 inspectores de control de calidad dedicados en todas las etapas
        - Todo el equipo de prueba calibrado anualmente
    - title: Trazabilidad de lotes
      description: A cada lote de materia prima se le asigna un número de lote único en nuestro sistema ERP. Desde la llegada del material hasta la producción y el producto terminado, la lista de materiales de cada placa se vincula a los lotes originales del proveedor. Esto permite una trazabilidad completa hacia atrás para cualquier consulta de calidad o cumplimiento.
      features:
        - Seguimiento de lotes basado en ERP desde el material hasta el producto terminado
        - Etiquetas físicas por lote en cada orden de trabajo
        - Cobertura de material al 100 % — PVC, drop-stitch, EVA espuma, herrajes, adhesivos
        - Registros conservados por 10 años
    - title: Gestión de la Calidad
      description: Nuestros procedimientos de control de calidad siguen protocolos internos documentados. Los resultados de las pruebas se registran, son rastreables y son revisados por nuestro laboratorio de calidad independiente. Tasa de productos sin defectos del 99,3 % en los envíos de los últimos 12 meses.
      features:
        - Protocolos internos de control de calidad documentados, revisados anualmente
        - Tasa de 99,3% libre de defectos en los envíos de los últimos 12 meses
        - Tolerancia cero para defectos críticos para la seguridad
        - Registros conservados por 10 años
content_inspection:
  tagline: Etapas de inspección
  title: Seis etapas<br />Proceso de inspección
  subtitle: Cada producto pasa por 6 etapas de inspección con puntos de control de control de calidad documentados. Los defectos se detectan a tiempo, las acciones correctivas son inmediatas y cada lote es completamente rastreable.
  stages:
    - stage: '1'
      title: Inspección de materiales entrantes
      description: Todos los materiales entrantes se registran por lote/lote y se ponen en cuarentena hasta la firma de control de calidad.PVC Los rollos de tela se prueban para medir su resistencia a la tracción, resistencia al desgarro y grosor.Drop-stitch Los núcleos, válvulas, adhesivos y herrajes se inspeccionan visualmente y se miden según las especificaciones.
      checks: Resistencia a la tracción, resistencia al desgarro, calibre de espesor, viscosidad del adhesivo, escaneo de defectos visuales
      threshold: 100% de los lotes probados. Rechazar si la resistencia a la tracción es < 90% de la especificación, el desgarro < mínimo de la especificación, o cualquier defecto visual
    - stage: '2'
      title: Control de calidad en proceso — Corte y preparación
      description: CNC-los paneles cortados se comprueban dimensionalmente con archivos fuente CAD cada vigésimo panel. Se inspecciona la calidad de los bordes para detectar deshilachados, cortes desiguales o deriva dimensional. El conteo de paneles se verifica con la lista de materiales para cada lote de producción antes de que los materiales pasen a soldar.
      checks: Verificación dimensional contra archivos CAD DXF, inspección de calidad de bordes, verificación del conteo de paneles
      threshold: Tolerancia ±0,5 mm. Rechazar el lote si >2% fuera de tolerancia
    - stage: '3'
      title: Control de calidad en proceso — Soldadura y unión
      description: Durante la producción, la calidad de la soldadura se monitoriza continuamente. Se realizan pruebas de despegado en muestras cada 50 unidades. Se mide el ancho de soldadura según la especificación. Se revisan los registros de temperatura de aire caliente para comprobar su consistencia. Cada junta se inspecciona visualmente bajo retroiluminación para detectar canales o huecos.
      checks: Prueba de despegue cada 50 unidades, medición del ancho de soldadura, revisión del registro de temperatura del aire caliente, inspección de retroiluminación de las juntas
      threshold: Resistencia al despegado mínima 8 N/cm. Tolerancia de ancho de soldadura ±1 mm. Cualquier canal visible = rechazo
    - stage: '4'
      title: Control de calidad de ensamblaje
      description: Cada unidad sigue una lista de comprobación de ensamblaje de 100 puntos aprobada por el jefe de equipo. El funcionamiento de la válvula se prueba a través de 10 ciclos de apertura/cierre. Se verifica el par de equipo. La inspección visual abarca el acabado superficial, la consistencia del color, la colocación de etiquetas y la completitud de accesorios.
      checks: Lista de comprobación de 100 puntos por unidad, prueba de función de válvulas, verificación de par por hardware, inspección visual
      threshold: 'Política cero defectos en elementos críticos para la seguridad (válvulas, anillos en D, manillas). Estética menor: objetivo sin defectos al 99,3%'
    - stage: '5'
      title: Prueba de Presión
      description: Cada cámara se infla a 1,25× presión nominal y se mantiene durante 24-48 horas. Los sensores de presión registran continuamente durante todo el periodo de retención. Las lecturas compensadas por temperatura garantizan la precisión. Cualquier cámara que supere el 5% de caída de presión es rechazada y enviada a reinspección de la junta con una re-prueba del 100% de todo el lote de producción.
      checks: Registro de retención de presión de 24-48 horas, calibración del sensor verificada diariamente, lectura compensada por temperatura, reprueba de la junta tras reparación
      threshold: Caída máxima de presión del 5% en 24 horas a temperatura estable. Exceder = 100% de volver a probar todo el lote
    - stage: '6'
      title: Inspección final y liberación del envío
      description: Inspección visual y funcional final antes del empaquetado. Se comprueban los defectos superficiales, la consistencia del color, la verificación de etiquetas/BIN, la integridad del embalaje y la completitud de los accesorios en relación con el pedido del cliente. Las unidades se envasan al vacío, se empaquetan y se paletizan. Se requiere la aprobación final del control de calidad antes de que cualquier producto salga de la fábrica.
      checks: Inspección visual completa, lista de comprobación de accesorios por SKU uno, prueba de caída del embalaje (muestra aleatoria de 1 m), verificación de escaneo de etiquetas/códigos de barras
      threshold: Tolerancia cero defectos de seguridad. 99,3% de defectos sin defectos. 100% de las unidades inspeccionadas visualmente
content_equipment:
  tagline: Equipos de prueba
  title: Laboratorio de QC<br />Equipo
  subtitle: Nuestro laboratorio de calidad está equipado con equipos especializados para pruebas para la verificación de materiales, la integridad de la soldadura y la validación del rendimiento del producto.
  columns: 3
  items:
    - title: Máquina de ensayo de tracción
      description: Mide la resistencia a la tracción y el alargamiento de la tela según el protocolo de prueba interno. Se utiliza para la control de calidad entrante de todos los PVC drop-stitch lotes y lotes de tela.
      icon: tabler:scale
    - title: Cámara de Temperatura
      description: Cámara ambiental para UV pruebas de resistencia y de flexibilidad a baja temperatura. Simula condiciones de funcionamiento extremas.
      icon: tabler:temperature
    - title: Sensores de presión y registradores
      description: Sensores digitales de presión con registro continuo de datos para pruebas de retención de aire de 24 a 48 horas. Compensado por temperatura para mayor precisión.
      icon: tabler:wind
    - title: Plataforma de pruebas de peel
      description: Equipos calibrados de prueba de peel para la verificación de la resistencia de las juntas de soldadura. Muestras aleatorias de cada lote de producción.
      icon: tabler:files
    - title: Tanque de Detección de Fugas
      description: Depósito de agua para pruebas de fugas sumergidas en cámaras infladas. Detección visual de burbujas para verificación de integridad de juntas y válvulas.
      icon: tabler:ripple
    - title: Herramientas de inspección
      description: Herramientas de medición calibradas — medidores de grosor, llaves dinamométricas, pinzas dimensionales, comprobadores de dureza para estaciones de control de calidad de producción.
      icon: tabler:tools
content_metrics:
  tagline: Rendimiento en control de calidad
  title: Control de Calidad<br />Métricas
  subtitle: Datos reales de aprobados/fallos de nuestra línea de producción. Estas métricas se monitorizan diariamente y revisan mensualmente por la dirección.
  columns: 3
  items:
    - title: 100% unidades probadas
      description: Cada cámara de cada placa se prueba a presión antes del envío. Sin muestreo — inspección 100% de la integridad de la presión.
      icon: tabler:check
    - title: <5% de caída de presión
      description: Pérdida máxima permitida de presión durante 24-48 horas a 1,25× presión nominal. Cualquier cámara que supere este umbral activa la repetición por lotes.
      icon: tabler:gauge
    - title: 99,3% libre de defectos
      description: Tasa sin defectos en los envíos finales de 12 meses. Tolerancia cero con defectos críticos para la seguridad.
      icon: tabler:clipboard-check
    - title: Espera de 24-48 horas
      description: Las placas se mantienen entre 24 y 48 horas, dependiendo del modelo y del lote. Los sensores de presión registran de forma continua durante todo el periodo de retención.
      icon: tabler:clock
    - title: 1,25× Presión de prueba
      description: Margen de seguridad en cada cámara — probado a un 25% por encima de la presión nominal para asegurar un margen por encima de las condiciones máximas de funcionamiento.
      icon: tabler:arrow-up
    - title: 0% de defectos de seguridad
      description: Política de tolerancia cero para defectos críticos para la seguridad — válvulas, anillos en D, juntas y cámaras de flotabilidad. Cualquier defecto = 100% de reinspección.
      icon: tabler:shield
