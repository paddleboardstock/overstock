tldr:
  summary: 'Sistema de control de calidad de seis etapas: inspección de materiales, control de calidad en proceso, verificación de soldadura, control de calidad de ensamblaje, prueba de presión a 1.25 veces la nominal y inspección final. Prueba de presión al 100% de las unidades. Tasa libre de defectos del 99,3% según muestreo AQL 2.5.'
  points:
    - 'Control de calidad de seis etapas: inspección de materiales, control de calidad en proceso, verificación de soldadura, control de calidad de ensamblaje, prueba de presión a 1.25 veces y inspección final de 100 puntos'
    - Inspección final de 100 puntos en cada placa antes del empaquetado
    - El 100% de las unidades se somete a retención de 24-48 horas a 1.25 veces la presión nominal con una tolerancia máxima de caída del 5%
    - Muestreo AQL 2.5 asegurando una tasa libre de defectos del 99,3%
    - 'Control de calidad de soldadura: prueba de pelado, verificación del ancho de la soldadura e inspección de la costura de retroiluminación en cada unión soldada'
