testimonial:
  content: Lancé mi marca de SUP sin experiencia en la industria. El equipo de Paddle Board Overstock me guió desde la selección de productos hasta el diseño de logotipos y empaques personalizados. Mi primer contenedor llegó en 11 semanas y se agotó en 3 meses en Amazon. Ahora estoy pidiendo mi tercer contenedor.
  name: michael parque
  title: Fundador, Shoreline Paddle Co. - California, EE. UU.
content_segments:
  tagline: Perfiles de emprendedores
  title: Lanzamiento de marca de deportes acuáticos<br />Por tipo de emprendedor
  subtitle: 'Los diferentes fundadores tienen diferentes fortalezas: experiencia en comercio electrónico, conexiones industriales, alcance de contenido o infraestructura de distribución. Adaptamos el programa de lanzamiento OEM/ODM para que coincida con su posición inicial y ambición de crecimiento.'
  items:
    - title: Vendedores de Amazon Logística de Amazon y comercio electrónico
      subtitle: Constructores de marca de rápido crecimiento basados en datos
      description: Vendedores en línea experimentados que lanzan productos para deportes acuáticos en Amazon, Walmart o sus propias tiendas Shopify. Sabe cómo optimizar listados, administrar PPC y leer datos de categorías, pero necesita un socio de fabricación que comprenda la velocidad del comercio electrónico, las tasas de retorno y los cambios estacionales en la demanda.
      features:
        - Embalaje listo para la venta minorista, optimizado para los límites de dimensiones de FBA
        - Generación de códigos de barras EAN/UPC y documentación conforme a Amazon
        - MOQ bajo (2–5 unidades por SKU para RIB, 5–10 para SUP) para probar la demanda antes de escalar
        - Consolidación de contenedores mixtos para optimizar el costo unitario en destino
    - title: Personas influyentes en el fitness y el estilo de vida al aire libre
      subtitle: Creadores de marcas que dan prioridad a la audiencia
      description: 'Creadores de contenido, entrenadores físicos y personalidades del aire libre con una audiencia comprometida y lista para comprar una marca de estilo de vida. Usted trae la comunidad y la historia de la marca: nosotros nos encargamos de la ingeniería del producto, el cumplimiento, el empaque y la logística para que usted pueda concentrarse en el contenido y la conversión.'
      features:
        - 'Personalización de marca rápida: ciclo de muestras de 2 semanas con logo + colores'
        - Ediciones limitadas co-brandeadas y lanzamientos de colorways estacionales
        - Apoyo a la producción de fotografía lifestyle y contenido de video
        - 'Cumplimiento directo al consumidor: drop shipping de fábrica → al cliente'
    - title: Distribuidores regionales que van directamente al consumidor
      subtitle: Operadores B2B lanzando su propia marca
      description: Distribuidores establecidos de equipos marinos o para exteriores que desean lanzar su propia marca junto con la reventa de productos de terceros o en lugar de ellos. Ya cuenta con una infraestructura de almacén, relaciones logísticas y una base de clientes; necesita un socio de fábrica que pueda ofrecer calidad de marca privada a escala.
      features:
        - Diseños de productos exclusivos para su territorio de mercado
        - Desarrollo completo de moldes OEM para formas y especificaciones exclusivas
        - Documentación de cumplimiento localizada (CE, UKCA, USCG) para su región
        - 'Embalaje co-brandeado: marca del distribuidor + sello de calidad Paddle Board Overstock'
    - title: Fundadores de marcas por primera vez
      subtitle: Creación de marca guiada de principio a fin
      description: Emprendedores apasionados sin experiencia en la industria de los deportes acuáticos que quieren construir una marca desde cero. Necesita un socio que lo acompañe en cada etapa, desde la selección y el nombre del producto hasta el diseño del empaque y la logística del primer contenedor, con cronogramas claros y precios transparentes.
      features:
        - Selección consultiva de productos entre más de 50 diseños base probados
        - 'Paquete de identidad de marca: denominación, logo, paleta de colores, diseño de embalaje'
        - Plazo de 60 a 90 días desde el concepto hasta el primer envío
        - Gerente de proyecto dedicado para propietarios de marcas primerizos
