hero:
  tagline: Conocimiento sobre la exploración del agua
  title: Aprender
  subtitle: |
    Guías, tutoriales y análisis profundos: todo lo que necesitas para explorar<br />
    el agua con confianza. Desde elegir tu primer SUP hasta dominar técnicas avanzadas.
  taglineSection: Conocimiento para cada palista. Desde principiante hasta profesional.
featured:
  tagline: Temas Destacados
  title: Comienza tu viaje de aprendizaje
  subtitle: Ya sea que seas nuevo en los deportes acuáticos o quieras mejorar, nuestras guías te respaldan.
  items:
    - title: SUP Conceptos básicos
      description: 'Todo lo que un principiante necesita saber: tipos de tabla, tamaño del remo, postura y consejos para el primer día.'
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Tabla inflable vs tabla rígida
      description: ¿Cuál es adecuado para ti? Comparamos portabilidad, rendimiento, durabilidad y costo lado a lado.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Seguridad en el Agua
      description: 'Conocimientos esenciales de seguridad que todo palista debe tener: clima, chalecos salvavidas, auto-rescate y más.'
      icon: tabler:shield
      href: /learn/water-safety
    - title: Guía de Materiales
      description: 'Núcleos Drop-stitch, laminados PVC, espuma de cubierta EVA: comprende de qué está hecha tu tabla.'
      icon: tabler:hexagons
      href: /learn/materials
    - title: Guía de tallas SUP
      description: Encuentra la longitud, anchura y volumen adecuados de la tabla según tu peso, habilidad y estilo de remo.
      icon: tabler:ruler
      href: /size-guide
    - title: Técnicas Intermedias
      description: Mejora tu remo con paladas avanzadas, técnicas de giro y manejo en aguas bravas.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
