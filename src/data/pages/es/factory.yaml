hero:
  tagline: Fábrica
  title: Fábrica y Fabricación
  subtitle: 12.000 m2 de fabricación integrada — desde materia prima hasta placa terminada
intro:
  - Como marca de fábrica del **Paddle Board Overstock Centro de Fabricación de Weihai**, Paddle Board Overstock controla cada etapa de la producción — desde la llegada de las materias PVC primas y drop-stitch materiales hasta la inspección final previa a la entrega del tablero acabado. Nuestra planta de fabricación en la Zona de Desarrollo Económico de Weihai abarca 12.000 metros cuadrados y alberga talleres dedicados para PVC corte, sellado térmico y soldadura, acabado de arte de cubiertas, montaje final y pruebas de calidad.
  - Al integrar diseño, ingeniería, prototipado, fabricación y pruebas bajo un mismo techo, eliminamos las ineficiencias de la fabricación por contrato y mantenemos el control directo sobre la calidad de construcción, la selección de materiales y los plazos de entrega. Cada placa que sale de nuestro taller es construida por nuestro personal, sobre nuestro equipo, según nuestros estándares.
