qc_section:
  tagline: Control de Calidad
  title: Proceso de prueba y aseguramiento de la calidad
  subtitle: Cada tabla se somete a pruebas obligatorias antes del envío. Nuestro laboratorio de calidad opera independientemente de la producción y reporta directamente a la gerencia.
  steps:
    - step: '1'
      title: Inspección de materia prima
      desc: Los tejidos PVC y drop-stitch se someten a pruebas de tracción, propagación de desgarre y verificación de resistencia UV antes de que cualquier lote ingrese a producción.
    - step: '2'
      title: Prueba de retención de aire de 48 horas
      desc: Cada cámara de la junta se infla al 125% de la presión nominal y se mantiene durante 48 horas. Una caída de presión que supere el 5% desencadena el rechazo automático y la reinspección de la costura.
    - step: '3'
      title: Pruebas de Carga y Equilibrio
      desc: Los tableros completados se cargan hasta la capacidad máxima nominal y se prueban para verificar estabilidad, francobordo y maniobrabilidad. Cada tablero se prueba con agua antes de la inspección final.
faq_section:
  tagline: Preguntas Frecuentes
  title: Preguntas Frecuentes
  questions:
    - q: ¿Dónde se fabrican tus tablas de paddle?
      a: 'Cada tabla se fabrica en nuestra propia fábrica de 12.000 m² en Weihai, China. No subcontratamos: el diseño, los materiales, la soldadura, el ensamblaje y las pruebas ocurren bajo un mismo techo, por lo que la calidad nunca depende de un tercero.'
    - q: ¿Cómo es que sus precios son mucho más bajos que los de venta al por menor?
      a: Vendemos excedentes de fábrica y lotes de liquidación directamente desde nuestra propia instalación de producción — sin intermediarios, sin sobreprecio minorista. Eso significa paquetes completos SUP con hasta un 60% de descuento sobre los precios minoristas típicos, con la misma calidad probada bajo presión.
    - q: ¿Qué se incluye con una tabla?
      a: 'Cada SUP se envía como un paquete completo: tabla, mochila de viaje, bomba de mano, remo ajustable, aleta removible, correa en espiral y kit de reparación.'
    - q: ¿Qué tan rápido se envían los pedidos?
      a: Los pedidos en stock salen de nuestra fábrica de Weihai en un plazo de 2-3 días hábiles con entrega rastreada a 50+ países de toda la UE, América del Norte, Asia-Pacífico y más allá.
production_flow:
  tagline: Flujo de producción
  title: Del material a la placa terminada
  subtitle: Cada placa pasa por 6 etapas de producción con puntos de control de calidad en cada paso. No hay atajos, no se omiten inspecciones.
  stages:
    - stage: '01'
      title: Recepción de Material y Control de Calidad Entrante
      description: Todos los materiales entrantes se registran por número de lote en nuestro sistema ERP. PVC rollos de tela, drop-stitch núcleos, válvulas, adhesivos y herrajes están en cuarentena hasta la aprobación de control de calidad.
      qc_check: Resistencia a la tracción, resistencia al desgarro, calibre de espesor, viscosidad del adhesivo, escaneo de defectos visuales
      qc_threshold: 100% de los lotes probados. Rechazar si la resistencia a la tracción es < 90% de la especificación, el desgarro < mínimo de la especificación, o cualquier defecto visual
      responsibility: Equipo de control de calidad entrante (3 inspectores)
    - stage: '02'
      title: CNC Corte y Preparación de Material
      description: El anidamiento optimizado por computadora dispone los paneles en el material PVC para minimizar el desperdicio. Las máquinas de corte CNC automáticas mantienen una precisión posicional de 0,1 mm.
      qc_check: Verificación dimensional contra archivos CAD DXF, inspección de calidad de bordes, verificación del conteo de paneles
      qc_threshold: Se mide cada vigésimo panel. Tolerancia ±0,5 mm. Rechazar el lote si >2% está fuera de tolerancia
      responsibility: Líder del taller de corte
    - stage: '03'
      title: Soldadura y Drop-Stitch Unión
      description: Los núcleos Drop-stitch están unidos a los laminados exteriores PVC mediante laminación en caliente. Las cámaras de los tubos se sueldan por RF o por soldadura con aire caliente. Las bandas del riel se unen por fusión de triple capa.
      qc_check: Prueba de despegue cada 50 unidades, medición del ancho de soldadura, revisión del registro de temperatura del aire caliente, inspección visual de la costura bajo luz trasera
      qc_threshold: Resistencia al despegue mínima 8 N/cm. Tolerancia del ancho de soldadura ±1 mm. Cualquier canalización visible = rechazar
      responsibility: Control de calidad de soldadura (2 inspectores por turno)
    - stage: '04'
      title: Montaje y montaje
      description: 'Las placas pasan al montaje final donde se instalan todos los componentes: válvulas instaladas, anillas en D, asas, cajas de aletas y ajuste de bolsas de transporte. Cada unidad sigue una lista de comprobación de montaje de 100 puntos.'
      qc_check: Lista de comprobación de 100 puntos por unidad, prueba de función de válvulas (10 ciclos de apertura/cierre), verificación de par por hardware, inspección visual
      qc_threshold: Política de cero defectos en elementos críticos para la seguridad (válvulas, anillos en D, manillas). Defectos estéticos menores dentro de límites estéticos estrictos
      responsibility: Control + de calidad de línea líder de equipo de montaje
    - stage: '05'
      title: Pruebas de presión y mantenimiento de calidad
      description: Cada cámara se infla a una presión nominal del 1,25× (normalmente 20–25 PSI) y se mantiene durante 24–48 horas. Los sensores de presión registran de forma continua. Las cámaras que superan el 5% de caída de presión son rechazadas y enviadas a reinspección de la junta.
      qc_check: registro de mantenimiento de presión a 24 horas, calibración del sensor verificada diariamente, lectura de presión compensada por temperatura, revisión de la junta tras la reparación
      qc_threshold: Caída máxima de presión del 5% durante 24 horas a temperatura estable. Cualquier cámara que supere esto = 100% de repetición de la prueba completa del lote de producción
      responsibility: Laboratorio de calidad (independiente de la producción, reporta a la dirección)
    - stage: '06'
      title: Inspección final y embalaje
      description: Inspección visual y funcional final. Defectos superficiales, consistencia de color, verificación de etiquetas/BIN, integridad del embalaje y completitud de accesorios. Las unidades se envasan al vacío, se empaquetan y se paletizan para la carga de contenedores.
      qc_check: Inspección visual completa, lista de comprobación de accesorios por SKU ejemplo, prueba de caída del embalaje (1 m, muestra aleatoria), verificación de escaneo de etiquetas/códigos de barras
      qc_threshold: Tolerancia cero a los defectos de seguridad. Defectos cosméticos dentro de límites estrictos. 100% de las unidades inspeccionadas visualmente
      responsibility: Equipo final de control de calidad (4 inspectores) + Jefe del equipo de embalaje
workforce:
