workshops_section:
  tagline: Talleres
  title: Talleres de fabricación
  workshops:
    - title: PVC Corte y preparación de materiales
      description: Las CNC máquinas automáticas de corte PVC procesan y drop-stitch fabrican tejidos con precisión submilimétrica. El anidamiento optimizado por ordenador minimiza el desperdicio de materiales y garantiza que cada panel cumpla con su especificación dimensional antes de soldar.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Soldadura y sellado térmico
      description: Taller dedicado de soldadura con máquinas de sellado térmico y prensas dieléctricas de RF. Los soldadores de aire caliente unen y fusionan laminados de núcleo drop-stitch y bandas de riel, mientras que las soldaduras RF producen costuras herméticas de alta resistencia.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Arte de la cubierta y acabado EVA
      description: 'Las cubiertas de la serie de arte toman forma aquí: los paneles de espuma EVA cortados con precisión se colocan en patrones de cubierta completa, se pegan y se recortan a mano para un acabado cómodo, resistente y antideslizante, el aspecto distintivo de cada tabla de la serie de arte.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: Impresión y decoración SUP
      description: Las tablas SUP se decoran usando impresión digital para gráficos a todo color y serigrafía para logotipos y patrones repetitivos. Las impresoras digitales producen diseños de cubierta con calidad fotográfica, mientras que la serigrafía entrega marcas de marca duraderas y vívidas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Ensamblaje final y aparejo
      description: Línea de ensamblaje donde las tablas reciben sus válvulas, anillas en D, asas, aletas y enganches para correa. Cada tabla sigue una lista de verificación de ensamblaje de 100 puntos aprobada por el líder del equipo.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Pruebas de calidad e inspección
      description: Cada tabla completada se somete a pruebas obligatorias de retención de aire, verificación de desprendimiento de costuras y un chequeo completo del sistema antes del envío. Nuestro laboratorio de calidad opera independientemente de la producción y reporta directamente a la gerencia.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
