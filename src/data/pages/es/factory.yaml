material_traceability:
  tagline: Trazabilidad
  title: Seguimiento de materiales y control de lotes
  description: A cada lote de materia prima se le asigna un número de lote único en nuestro sistema ERP. Desde la llegada, pasando por la producción hasta el producto terminado, la lista de materiales de cada placa se vincula al lote del proveedor original. Esto permite una trazabilidad completa hacia atrás para cualquier consulta de calidad.
  system: Etiquetas físicas de lote personalizadas ERP (sistema interno) + en cada orden de trabajo
  coverage: 100% de los materiales de producción — PVC, tela drop-stitch, espuma EVA, adhesivos, válvulas, herrajes, embalaje
  records_retained: 10 años
