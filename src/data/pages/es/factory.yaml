qc_section:
  tagline: Control de calidad
  title: Proceso de pruebas y garantía de calidad
  subtitle: Cada barco se somete a pruebas obligatorias antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción y reporta directamente a la dirección.
  steps:
    - step: '1'
      title: Inspección de materias primas
      desc: Las telas de PVC, Hypalon y drop-stitch se someten a pruebas de tracción (ASTM D751), propagación de desgarros y verificación de resistencia a los rayos UV antes de que cualquier lote entre en producción.
    - step: '2'
      title: Prueba de retención de aire de 48 horas
      desc: Cada cámara de tubo se infla al 125% de la presión nominal y se mantiene durante 48 horas. Una caída de presión superior al 5% activa el rechazo automático y la reinspección de las costuras.
    - step: '3'
      title: Prueba de carga y equilibrio
      desc: Los barcos terminados se cargan hasta su capacidad nominal máxima y se prueban para verificar estabilidad, francobordo y manejo. Cada embarcación se prueba en el agua antes de la inspección final.

oem_section:
  tagline: Proyectos OEM
  title: Estudios de caso de alianzas de marca y OEM
  subtitle: Del concepto al contenedor — cómo ayudamos a las marcas globales a lanzar y escalar sus líneas de embarcaciones inflables.
  cases:
    - challenge: Un minorista de artículos de exterior europeo necesitaba una línea de SUP de marca privada con gráficos de cubierta únicos, PVC ecológico y embalaje listo para la venta minorista, todo entregado en 60 días.
      solution: Desarrollamos archivos de impresión digital personalizados, obtuvimos PVC conforme a REACH y comprimimos el muestreo de 3 rondas a 1 al ubicar el equipo de diseño en nuestra fábrica de Qingdao.
      result: 55 días desde el pedido firmado hasta el FOB. 2.400 unidades en 4 SKU. Pedido de repetición realizado antes de que llegara el primer contenedor.
    - challenge: Una startup estadounidense de deportes acuáticos necesitaba un kayak drop-stitch de alto rendimiento con forma de casco personalizada, embalaje de marca compartida y certificación BSCI para su colocación minorista.
      solution: Adaptamos un molde de kayak drop-stitch existente con un perfil de rocker modificado, desarrollamos la obra gráfica del embalaje de marca compartida y proporcionamos la documentación completa de la auditoría BSCI.
      result: Listado con éxito en 3 grandes cadenas de exterior de EE. UU. Más de 5.000 unidades en el primer año con una tasa de venta del 98%.
    - challenge: Un distribuidor australiano requería una gama de RIB con certificación CE con colores de tubo personalizados, opción de mejora a Hypalon y cumplimiento de la norma australiana AS 1799.
      solution: Produjimos muestras de preproducción con 4 variantes de color de tubo, obtuvimos Hypalon CSM de un proveedor japonés y coordinamos las pruebas de cumplimiento de terceros de la AS 1799.
      result: Gama de RIB de 3 modelos lanzada en el mercado AU/NZ. Seguida por la adjudicación de una licitación gubernamental de 12 RIB de patrulla.

faq_section:
  tagline: Preguntas frecuentes
  title: Preguntas frecuentes B2B y OEM
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para tablas de SUP inflables OEM?
      a: El MOQ comienza en 5–10 unidades para los modelos OEM estándar. Los moldes personalizados y los proyectos de marca privada requieren un mínimo de 200 unidades según la complejidad. Hay pedidos de prueba y series de muestra disponibles para el lanzamiento de nuevas marcas.
    - q: ¿Paddle Board Overstock posee la certificación BSCI?
      a: Sí. Nuestra fábrica mantiene una certificación válida de cumplimiento social BSCI (informe de auditoría disponible bajo solicitud). También contamos con la certificación ISO 9001:2015 de gestión de calidad, y 64 de nuestros modelos llevan la certificación CE (TÜV Rheinland). Documentación de cumplimiento de REACH y RoHS proporcionada con cada envío OEM.
    - q: ¿Cuál es el plazo de entrega típico para un pedido OEM?
      a: El plazo de entrega estándar es de 30 a 45 días desde el pedido confirmado y el depósito. El desarrollo de moldes personalizados añade de 15 a 20 días para el utillaje. Ofrecemos producción acelerada para pedidos urgentes y picos de temporada durante la ventana previa al verano (ene–mar).
    - q: ¿Pueden enviar FOB Qingdao o CIF a nuestro puerto?
      a: Sí. Enviamos FOB Qingdao, CIF a los principales puertos globales y DDP para socios cualificados. Nuestro equipo de logística gestiona la reserva de contenedores, la documentación de exportación y el despacho de aduanas. Enviamos a más de 50 países en los mercados de la UE, EE. UU., AU y Asia.

b2b_moq: 'MOQ estándar: 5–10 unidades por modelo (SUP/kayak/drop-stitch). MOQ de RIB: 2–5 unidades. Se aceptan pedidos de prueba para nuevas alianzas.'

production_flow:
  tagline: Flujo de producción
  title: Del material al barco terminado
  subtitle: Cada barco pasa por 6 etapas de producción con puntos de control QC en cada paso. Sin atajos, sin inspecciones omitidas.
  stages:
    - stage: '01'
      title: Recepción de material y QC de entrada
      description: Todos los materiales entrantes se registran por número de lote en nuestro sistema ERP. Rollos de tela PVC, núcleos drop-stitch, válvulas, adhesivos y herrajes se ponen en cuarentena hasta la aprobación de QC.
      qc_check: Resistencia a la tracción (ASTM D751), resistencia al desgarro (ISO 4674), medidor de espesor, viscosidad del adhesivo, escaneo visual de defectos
      qc_threshold: 100 % de los lotes probados. Rechazo si tracción < 90 % de especificación, desgarro < mínimo de especificación o cualquier defecto visual
      responsibility: Equipo de QC de entrada (3 inspectores)
    - stage: '02'
      title: Corte CNC y preparación de material
      description: El anidado optimizado por computadora distribuye los paneles sobre el material PVC para minimizar el desperdicio. Las máquinas automáticas de corte CNC mantienen una precisión posicional de 0,1 mm.
      qc_check: Control dimensional contra archivos CAD DXF, inspección de calidad de bordes, verificación del número de paneles
      qc_threshold: Cada 20.º panel medido. Tolerancia ±0,5 mm. Rechazo del lote si >2 % fuera de tolerancia
      responsibility: Jefe de taller de corte
    - stage: '03'
      title: Soldadura y unión drop-stitch
      description: Los núcleos drop-stitch se unen a los laminados exteriores de PVC mediante laminación por calor. Las cámaras del tubo se sueldan por RF o aire caliente. Las bandas de riel se unen por fusión de tres capas.
      qc_check: Prueba de pelado cada 50 unidades (ASTM D751), medición del ancho de soldadura, revisión del registro de temperatura de aire caliente, inspección visual de costuras con luz trasera
      qc_threshold: Resistencia de pelado mín. 8 N/cm. Tolerancia del ancho de soldadura ±1 mm. Cualquier canalización visible = rechazo
      responsibility: QC de soldadura (2 inspectores por turno)
    - stage: '04'
      title: Montaje y aparejado
      description: 'Los barcos pasan al montaje final, donde se unen todos los componentes: casco + tubos, válvulas instaladas, anillas en D, asas, cajas de aletas y ajuste de bolsa de transporte. Cada unidad sigue una lista de montaje de 100 puntos.'
      qc_check: Firma de lista de verificación de 100 puntos por unidad, prueba de función de válvula (10 ciclos de apertura/cierre), verificación de par de herrajes, inspección visual
      qc_threshold: 'Política de cero defectos en elementos críticos para la seguridad (válvulas, anillas en D, asas). Cosméticos menores: AQL 2,5 (ISO 2859)'
      responsibility: Jefe de montaje + QC de línea
    - stage: '05'
      title: Prueba de presión y retención de calidad
      description: Cada cámara se infla a 1,25× la presión nominal (normalmente 20–25 PSI) y se mantiene durante 24–48 horas. Los sensores de presión registran de forma continua. Las cámaras con más del 5 % de caída de presión se rechazan y se envían a reinspección de costuras.
      qc_check: Registro de retención de presión de 24 h, calibración de sensores verificada a diario, lectura de presión compensada por temperatura, repetición de prueba de costuras tras reparación
      qc_threshold: Máx. 5 % de caída de presión en 24 h a temperatura estable. Cualquier cámara que lo supere = retest del 100 % del lote de producción completo
      responsibility: Laboratorio de calidad (independiente de producción, informa directamente a la dirección)
    - stage: '06'
      title: Inspección final y embalaje
      description: Inspección visual y funcional final. Defectos de superficie, consistencia de color, verificación de etiqueta/BIN, integridad del embalaje y completitud de accesorios. Las unidades se envasan al vacío, se encajan en cajas y se paletizan para carga en contenedor.
      qc_check: Inspección visual completa, lista de accesorios por SKU, prueba de caída del embalaje (1 m, muestra aleatoria), verificación por escaneo de etiqueta/código de barras
      qc_threshold: AQL 2,5 para defectos mayores, AQL 4,0 para menores. Tolerancia cero en defectos de seguridad. 100 % de las unidades inspeccionadas visualmente
      responsibility: Equipo de QC final (4 inspectores) + jefe de embalaje

