  shift_pattern: 2 turnos al día (07:00–15:30, 15:30–00:00). Turno de noche opcional para órdenes urgentes.
  training: Formación mensual en control de calidad, simulacros de seguridad trimestrales, evaluación anual de habilidades. Los nuevos empleados completan una inducción de 40 horas antes de trabajar en la línea de producción.
