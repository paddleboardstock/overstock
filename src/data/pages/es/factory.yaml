material_traceability:
  tagline: Trazabilidad
  title: Seguimiento de materiales y control de lotes
  description: Cada lote de materia prima recibe un número de lote único en nuestro sistema ERP. Desde la llegada, pasando por la producción hasta el producto terminado, la lista de materiales de cada barco remite al lote original del proveedor. Esto permite una trazabilidad ascendente completa ante cualquier consulta de calidad o cumplimiento.
  system: ERP propio (sistema interno) + etiquetas físicas de lote en cada orden de trabajo
  coverage: 100 % de los materiales de producción — PVC, Hypalon, tela drop-stitch, adhesivos, válvulas, herrajes, embalaje
  records_retained: 10 años (según requisito CE 2013/53/EU)
  suppliers:
    - material: PVC de grado marino
      source: Proveedores chinos y coreanos
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Proveedor japonés
      certified: ISO 9001, REACH
    - material: Tela drop-stitch
      source: Tejido propio + socio externo
      certified: QC interno + ISO 9001 del proveedor
    - material: Válvulas y herrajes
      source: Proveedores OEM chinos
      certified: ISO 9001, certificados de material por lote

