content_challenge:
  tagline: El desafío
  title: 'Los Barcos de Pesca Necesitan<br />Estabilidad, Autonomía y Durabilidad'
  subtitle: 'Ya sea que opere embarcaciones pesqueras comerciales, gestione una flota cooperativa u ofrezca chárteres de pesca, su barco debe rendir de forma fiable todos los días.'
  paragraphs:
    - 'Los barcos de pesca necesitan plataformas estables para trabajar las líneas, manejar la captura y moverse con seguridad por la cubierta. Los inflables y los RIB ofrecen estabilidad inherente gracias al diseño de sus flotadores, una ventaja significativa frente a los cascos rígidos de eslora similar.'
    - 'La eficiencia de combustible es clave en las operaciones pesqueras, donde los costes operativos inciden directamente en la rentabilidad. Los RIB y los barcos inflables son más ligeros que los barcos rígidos equivalentes, requieren menos potencia y consumen menos combustible, un factor crítico para los operadores comerciales que navegan a diario y para las cooperativas que gestionan presupuestos de flota.'
    - 'La durabilidad en entornos marinos es esencial. El agua salada, la exposición a los rayos UV y el uso constante exigen materiales capaces de soportar condiciones adversas sin degradarse. Para operadores comerciales y cooperativas, la fiabilidad incide directamente en los ingresos: un barco averiado significa días de pesca perdidos.'
    - 'Las configuraciones de pesca Aquafarer incluyen portacañas, sondas, pozos para carnada, viveros y soluciones de manejo de carga diseñadas para aplicaciones de pesca exigentes, tanto comerciales, cooperativas como recreativas.'
content_solution:
  tagline: Nuestra solución
  title: 'Configuraciones Listas para la Pesca'
  subtitle: 'Cada barco de pesca Aquafarer puede configurarse para su aplicación pesquera específica.'
  list:
    - 'Montaje de portacañas: instalado de fábrica o listo para instalación en el mercado de accesorios'
    - 'Placa de montaje para sonda/GPS en la posición de la consola'
    - 'Opciones de pozo de carnada o vivero para operadores de chárter y comerciales'
    - 'Configuraciones de nevera/almacenamiento para el manejo de la captura'
    - 'Casco en V profunda para capacidad en altura: estable en reposo, suave a velocidad'
    - 'Opciones de flotadores de PVC o Hypalon: Hypalon para exposición prolongada a los rayos UV'
    - 'Motor fueraborda de 15 CV a 115 CV según el modelo y la aplicación'
content_segments:
  tagline: Perfiles de pesca
  title: 'Soluciones de Barcos Inflables de Pesca<br />Por Tipo de Operador'
  subtitle: 'De la pesca deportiva costera a la pesca comercial con palangre: distintas operaciones pesqueras exigen distintas configuraciones de casco, rangos de potencia y equipamiento en cubierta. Adaptamos cada barco a la pesquería, las aguas y el estilo de trabajo.'
  items:
    - title: Empresas Pesqueras Comerciales
      subtitle: 'Embarcaciones de trabajo para operaciones diarias de pesca, manejo de redes y transporte de captura'
      description: 'Las empresas pesqueras comerciales operan embarcaciones de trabajo para calar y recoger redes, revisar trampas, pescar con palangre y transportar la captura. Estas embarcaciones trabajan a diario en ambientes de agua salada y deben soportar cargas elevadas, manejo constante en cubierta y largas horas de operación. La eficiencia de combustible y el bajo mantenimiento son críticos para la rentabilidad de la flota. La embarcación debe ofrecer plataformas de trabajo estables para que la tripulación maneje el equipo y la captura en distintas condiciones de mar.'
      features:
        - 'Cubierta plana para el manejo de redes, apilado de trampas y almacenamiento de pescado'
        - 'Motor fueraborda de 40-115 CV de bajo consumo para un coste operativo diario reducido'
        - 'Flotadores de Hypalon reforzados para resistencia a la abrasión en uso diario'
        - 'Defensas de fricción reforzadas para el contacto frecuente con muelles y embarcaciones'
        - 'Cubierta autovaciante para una fácil limpieza tras las operaciones'
        - 'Precios de flota y especificaciones consistentes para operadores con varias embarcaciones'
    - title: Operadores de Chárter de Pesca
      subtitle: 'Comodidad para múltiples pasajeros, manejo de captura, certificación de seguridad'
      description: 'Operadores que ofrecen chárteres de pesca de media jornada y jornada completa, desde la pesca en arrecifes costeros hasta la pesca de fondo en altura. Su barco necesita asientos para pasajeros con certificaciones de seguridad, amplio espacio en cubierta para varios pescadores y viveros integrados para mantener frescas la carnada y la captura durante todo el viaje. La comodidad de los invitados incide directamente en las reseñas, las reservas recurrentes y las calificaciones online.'
      features:
        - 'Dirección desde consola con asientos tipo cubo amortiguados'
        - 'Portacañas instalados de fábrica (de 4 a 8 posiciones)'
        - 'Motor fueraborda de 60-115 CV para velocidades de crucero en altura'
        - 'Certificación CE categoría C o B para operaciones comerciales con pasajeros'
        - 'Bimini o T-top como protección solar para la comodidad de los invitados en viajes largos'
    - title: Pescadores Artesanales y Comerciales a Pequeña Escala
      subtitle: Embarcaciones de trabajo fiables para el sustento diario
      description: 'Pescadores independientes que dependen de su barco como principal fuente de ingresos: calan redes, atienden trampas de pesca o pescan con línea de mano cerca de la costa. Su prioridad es el ahorro de combustible, el mantenimiento sencillo que pueda realizar usted mismo y un barco que maneje cargas moderadas de captura y equipo sin sacrificar la estabilidad.'
      features:
        - 'Motor fueraborda de 15-40 CV de bajo consumo para un coste operativo reducido'
        - 'Flotadores de Hypalon CSM para mayor resistencia a los rayos UV y la abrasión'
        - 'Cubierta plana para el manejo de redes y el almacenamiento de pescado'
        - 'Fácil varada en playa con protección de quilla inflable'
    - title: Cooperativas Pesqueras
      subtitle: 'Recolección de captura, transporte de socios, distribución de suministros'
      description: 'Las cooperativas pesqueras operan flotas comunitarias para recolectar la captura de los pescadores socios, transportar suministros a comunidades pesqueras remotas y distribuir la producción a los mercados. Estas embarcaciones de trabajo necesitan una alta capacidad de carga útil, operación diaria fiable y mantenimiento sencillo en ubicaciones remotas. Las cooperativas suelen operar en regiones en desarrollo donde la disponibilidad de repuestos y el acceso al servicio son limitados, lo que hace esenciales las configuraciones simples de fueraborda y la construcción duradera.'
      features:
        - 'Alta capacidad de carga útil para transportar captura y suministros'
        - 'Configuración simple de fueraborda para un servicio fácil en el lugar'
        - 'Construcción robusta en PVC o Hypalon para flexibilidad presupuestaria'
        - 'Cubierta plana con puntos de amarre para asegurar la carga'
        - 'Operación de bajo consumo que minimiza los costes de la cooperativa'
    - title: Entusiastas de la Pesca Deportiva y de Grandes Piezas
      subtitle: Rendimiento y estilo para pescadores exigentes
      description: 'Pescadores experimentados que buscan una plataforma de pesca capaz: velocidad hacia caladeros lejanos, posiciones estables para pelear las piezas de pie y un acabado premium. El barco debe sentirse como en casa tanto recorriendo dos millas hasta un arrecife como explorando remotos ríos de estuario.'
      features:
        - 'Casco RIB en V profunda para una navegación suave con mar picado'
        - 'Placa de montaje para sonda/GPS precableada en la consola'
        - 'Pozo de carnada y nevera integrados en el módulo del asiento trasero'
        - 'Opciones de color EVA personalizadas a juego con los gráficos del barco y los flotadores'
    - title: Guías de Pesca y Operadores de Ecoturismo
      subtitle: Experiencias de pesca guiadas para pescadores visitantes
      description: 'Guías que llevan a pequeños grupos de pescadores visitantes a lugares de pesca productivos, a menudo combinando la pesca con elementos de ecoturismo como la observación de aves o la exploración de manglares. El barco debe navegar seco y cómodo para invitados no acostumbrados a embarcaciones pequeñas, con fácil embarque y opciones de sombra.'
      features:
        - 'Puntos de montaje para Bimini o T-top instalados de fábrica'
        - 'Escalera de baño de entrada suave para un reembarco fácil'
        - 'Motor fueraborda de 4 tiempos silencioso para minimizar molestias'
        - 'Compartimentos de almacenamiento seco para teléfonos, carteras y cámaras de los invitados'

