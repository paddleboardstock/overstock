faq:
  title: OEM/ODM — Preguntas Frecuentes
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para SUPs inflables personalizados?
      a: Para modelos estándar con moldes existentes, MOQ comienza en 5–10 unidades por diseño. Para moldes y herramientas totalmente personalizados, MOQ suele ser de 200 unidades. Trabajamos con startups y marcas emergentes para encontrar puntos de entrada viables.
    - q: ¿Cuánto tiempo tarda el proceso de la muestra OEM?
      a: Las muestras de prototipo estándar se completan dentro de 7 a 14 días hábiles después de la aprobación del diseño. Los pedidos urgentes pueden priorizarse a 5 a 7 días por una tarifa adicional.
    - q: ¿Cuál es la diferencia entre PVC y Hypalon para botes inflables?
      a: PVC es más ligero, más económico y ofrece una excelente flexibilidad en climas fríos. Hypalon (CSM) proporciona una superior UV y resistencia al ozono con una vida útil más larga (10–15 años frente a 5–8 años). Recomendamos PVC para la mayoría de las aplicaciones recreativas y Hypalon para uso comercial/profesional.
    - q: ¿Puedes personalizar la forma y el diseño del inflable?
      a: Sí. Nuestro equipo de I+D puede desarrollar moldes personalizados para cualquier forma de casco, contorno de tabla o configuración de tubo. Usamos moldes de aluminio mecanizados CNC para precisión y consistencia.
    - q: ¿Ofrecen servicios de auditoría de fábrica?
      a: Damos la bienvenida a auditorías en el lugar y de terceros en nuestra instalación de 12.000 m² en Qingdao. Mantenemos certificaciones ISO 9001 y BSCI, y podemos compartir informes de auditoría bajo un NDA.
    - q: ¿Qué condiciones de envío ofrecen?
      a: Ofrecemos términos de envío FOB Qingdao (estándar), CIF y DDP. La carga de contenedores y toda la documentación de exportación están incluidas en todos los pedidos OEM.
content_profiles:
  tagline: Perfiles de marcas
  title: OEM / Fabricación de Marca Privada<br />Por Tipo de Cliente
  subtitle: 'Diferentes perfiles de marca cuentan con requisitos distintos: adaptamos nuestros servicios OEM/ODM para que coincidan con su modelo de negocio, escala y estrategia de entrada al mercado.'
  items:
    - title: Marcas de embarcaciones startup
      subtitle: Bajo MOQ, aumento rápido
      description: Emprendedores y fundadores que lanzan su primera línea de SUPs, kayaks o botes inflables. Necesitan un socio de fabricación que trate su marca como propia, con bajos umbrales de entrada, tamaños de lote flexibles y orientación práctica de diseño en cada paso del camino.
      features:
        - MOQ tan bajo como 50–100 unidades por SKU, no miles
        - Biblioteca de moldes preexistente para evitar los costos de herramental
        - 'Paquete completo de marca: logo, gráficos para el tubo, embalaje, etiquetas colgantes'
        - 'Flujo de trabajo de muestra primero: aprobar antes de la producción'
    - title: Marcas Marinas Establecidas
      subtitle: OEM escala con CE/ISO cumplimiento
      description: Marcas existentes de botes, PWC o accesorios marinos que añaden embarcaciones inflables a su portafolio. Necesita calidad consistente en las series de producción, cumplimiento normativo para mercados globales y la capacidad de co-diseñar cascos o formas de tubos personalizados.
      features:
        - Ingeniería de moldes 3D personalizados para diseños propios
        - CE 2013/53/UE, UKCA, USCG documentación de conformidad
        - Informes de auditoría social BSCI para el cumplimiento de minoristas
        - Gestión de cuentas dedicada + ranuras de producción prioritarias
    - title: Marcas DTC y de comercio electrónico
      subtitle: Embalaje listo para venta al por menor a gran escala
      description: Marcas que priorizan lo online vendiendo a través de Amazon, Shopify o sus propias tiendas web. El empaque, la experiencia de desempaquetado y la calidad constante de las unidades son cruciales. Necesitas una fábrica que entienda la velocidad y la dinámica de la tasa de devolución del comercio electrónico.
      features:
        - Diseño de caja lista para el comercio + impresión de tarjeta insertada
        - Envasado al vacío / paletización para un envío rentable
        - Código de barras EAN / UPC y documentación lista para aduanas
        - Consolidación de contenedores mixtos para optimizar el costo entregado
    - title: Marcas de Estilo de Vida y Exterior
      subtitle: Extensión de categoría de diseño de marca blanca
      description: Ropa, equipo para actividades al aire libre o marcas de viajes que ingresan a la categoría de deportes acuáticos bajo su propia etiqueta. Es posible que no tengas experiencia en ingeniería marina internamente, por lo que necesitas un socio que pueda guiarte desde el concepto hasta el contenedor con la menor fricción posible.
      features:
        - Investigación de tendencias y tableros de estado de ánimo conceptuales
        - Ediciones limitadas con marca conjunta y combinaciones de colores de temporada
        - Ciclo de diseño a muestra en 10–14 días hábiles
        - 'Logística de extremo a extremo: fábrica → almacén → consumidor'
