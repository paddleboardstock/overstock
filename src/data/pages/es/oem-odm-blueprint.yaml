process_steps:
  title: Proceso de 6 pasos OEM/ODM
  subtitle: Del resumen de diseño al FOB Qingdao — un flujo de trabajo simplificado
  steps:
    - number: '01'
      title: Resumen de Diseño y Modelado 3D en CAD
      description: Comparta sus especificaciones objetivo, producto de referencia o concepto. Nuestro equipo de ingeniería desarrolla dibujos CAD detallados y representaciones 3D para su aprobación.
      timeline: 3 a 5 días
    - number: '02'
      title: Selección de Materiales y Pruebas de Tela
      description: Elija entre telas de grado militar PVC (0.9–1.2 mm), Hypalon CSM o drop-stitch núcleo. Realizamos pruebas de resistencia a la tracción, adhesión del recubrimiento y estabilidad UV.
      timeline: 2-3 días
    - number: '03'
      title: Prototipado rápido y producción de muestras
      description: Fabricamos moldes personalizados con máquina CNC y producimos muestras previas a la producción con los colores de su marca, logotipo y materiales especificados. Las muestras se envían para su aprobación.
      timeline: 7 a 14 días
    - number: '04'
      title: Prueba de Retención de Alta Presión de 24 a 48 Horas
      description: Cada prototipo se somete a rigurosas pruebas de retención de presión a 1,25 veces la presión nominal. Se realizan pruebas de desprendimiento de costuras y verificación dimensional.
      timeline: 1–2 días
    - number: '05'
      title: Inspección de Calidad y Empaque CE/ISO
      description: Lista de verificación de calidad de 100 puntos. Cada unidad se inspecciona antes del embalaje listo para la venta. Se incluye CE declaración de conformidad y BSCI informe de cumplimiento.
      timeline: 2-3 días
    - number: '06'
      title: Envío y logística FOB Qingdao
      description: Productos terminados paletizados, envueltos en film retráctil y cargados en contenedor en el puerto de Qingdao. Documentación completa de exportación, despacho aduanero y seguimiento en tiempo real.
      timeline: 7 a 14 días
