content_benefits:
  tagline: Beneficios de la asociación
  title: Por qué los distribuidores<br />elegir Paddle Board Overstock
  subtitle: Una asociación diseñada para distribuidores marítimos que necesitan un suministro confiable, márgenes competitivos y soporte profesional.
  items:
    - title: Protección del territorio
      description: Derechos territoriales exclusivos o semiexclusivos para distribuidores calificados. Mapeo de mercado y gestión de conflictos de canales para proteger su inversión en la construcción de la marca Paddle Board Overstock en su región.
      icon: tabler:map-pin
    - title: Precios competitivos al por mayor
      description: Precios escalonados basados en compromisos de volumen anual. Estructura de precios que protege los márgenes con garantías de precios anticipadas y desgloses de costos transparentes (base FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Kit de soporte de marketing
      description: Fotografía profesional de productos, hojas de especificaciones, plantillas de documentación de cumplimiento, contenido de redes sociales y materiales de marketing de marca compartida. Actualizado anualmente con lanzamientos de nuevos productos.
      icon: tabler:photo
    - title: Formación Técnica
      description: Capacitación sobre productos para su equipo de ventas (virtual o in situ), capacitación en mantenimiento y reparación para sus técnicos de servicio, y guías de solución de problemas y preguntas frecuentes orientadas al cliente.
      icon: tabler:school
    - title: Repuestos y posventa
      description: Suministro exclusivo de repuestos con envío prioritario. Secciones de tubo de repuesto, válvulas, aletas y kits de reparación disponibles para un rápido cumplimiento de pedidos. Soporte en el procesamiento de reclamos de garantía.
      icon: tabler:tool
    - title: Documentación de cumplimiento
      description: 'Paquete completo de documentación de cumplimiento para su mercado: CE DoC, datos de placas de construcción, manuales del propietario y soporte de registro regulatorio. Elimina su carga de cumplimiento.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Lo que buscamos
  title: Distribuidor<br />Requisitos
  subtitle: Buscamos socios que puedan representar y respaldar profesionalmente los productos Paddle Board Overstock en su territorio.
  items:
    - title: Conocimiento del territorio y del mercado
      description: Presencia consolidada en el mercado marino, de deportes acuáticos o de recreación al aire libre. Comprensión de las regulaciones locales, las preferencias de los consumidores y los canales de distribución de productos para embarcaciones.
      icon: tabler:target
    - title: Experiencia en la industria
      description: Mínimo 2 años de experiencia distribuyendo equipos marinos, outdoor o deportivos. Historial comprobado con marcas internacionales y operaciones mayoristas B2B.
      icon: tabler:briefcase
    - title: Sala de exposición o almacén
      description: Instalación física para exhibición de productos, almacenamiento de inventario y atención al cliente. Capacidad para mantener unidades de demostración e inventario de repuestos para su territorio.
      icon: tabler:building-store
    - title: Compromiso con los estándares de la marca
      description: Voluntad de mantener los estándares de presentación de la marca Paddle Board Overstock, brindar atención al cliente según nuestros protocolos de servicio y participar en actualizaciones anuales de capacitación sobre productos.
      icon: tabler:star
content_process:
  tagline: Proceso de solicitud
  title: Proceso de solicitud de distribuidor<br />de 4 pasos
  subtitle: 'Desde la consulta inicial hasta el primer envío: un proceso de incorporación sencillo.'
  steps:
    - number: '01'
      title: Consulta inicial y calificación
      description: Envíe su solicitud de distribuidor con los detalles de la empresa, el territorio de interés, las líneas de productos actuales y las estimaciones de volumen anual. Revisamos dentro de los 5 días hábiles.
      timeline: 5 dias
    - number: '02'
      title: Revisión comercial y términos
      description: Reunión virtual para discutir la estrategia territorial, los niveles de precios y los términos de la asociación. Revise los requisitos de documentación de cumplimiento para su mercado. Firma de acuerdo de confidencialidad si es necesario.
      timeline: 1-2 semanas
    - number: '03'
      title: Pedido de muestra y evaluación
      description: Realice un pedido de muestra inicial (2-5 unidades) a precio de distribuidor para evaluación de mercado y capacitación del equipo. Se incluye documentación de cumplimiento completa y preparación de demostración.
      timeline: 30-45 días
    - number: '04'
      title: Lanzamiento y soporte de la asociación
      description: Primer pedido de contenedor con protección de territorio activada. Se entregó el kit de marketing, se capacitó al equipo de ventas y se asignó un gerente de cuenta dedicado. Revisiones comerciales trimestrales continuas.
      timeline: En curso
content_application_docs:
  tagline: Documentos de solicitud
  title: Documentos requeridos<br />para la solicitud de concesión
  subtitle: Para solicitar una concesión Paddle Board Overstock, prepare los siguientes documentos e información para nuestro equipo de revisión.
  items:
    - title: Certificado de registro mercantil
      description: Documento de registro de empresa válido que muestre la razón social, la dirección registrada y el objeto social que cubra la distribución de equipos marinos, deportivos o de exterior.
      icon: tabler:file-text
    - title: Plan de cobertura territorial
      description: Territorio geográfico de interés, red de venta o distribución existente, segmentos de clientes objetivo y volumen anual propuesto por categoría de producto (RIB, SUP, kayak).
      icon: tabler:map
    - title: Capacidad de sala de exposición o almacén
      description: Instalación física para exposición de productos, almacenamiento de inventario y atención al cliente. Fotos o planos que muestren la zona de demostración y la capacidad de almacenamiento de repuestos.
      icon: tabler:building
    - title: Declaración de capacidad financiera
      description: 'Referencia bancaria o estado financiero que confirme la capacidad de realizar un pedido inicial de contenedor y mantener inventario. Pedido inicial mínimo: un contenedor de 20 pies (10-20 unidades, modelos mixtos).'
      icon: tabler:coin
    - title: Capacidad de soporte posventa
      description: Técnicos de servicio formados o formables para el mantenimiento y reparación de embarcaciones neumáticas. Capacidad de tramitación de reclamaciones de garantía y compromiso de inventario de repuestos.
      icon: tabler:tool
    - title: Referencias de marcas anteriores
      description: Lista de marcas de equipos marinos o deportivos distribuidas actualmente o anteriormente. Referencias de contacto disponibles previo acuerdo mutuo. Las empresas emergentes sin experiencia previa en distribución pueden calificar con un compromiso financiero mayor.
      icon: tabler:users
faq:
  title: 'Programa de concesionarios: preguntas frecuentes'
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido para distribuidores?
      a: La MOQ del distribuidor comienza en 10-20 unidades por pedido, con flexibilidad para modelos mixtos (RIB, inflable, SUP). Los pedidos de muestra iniciales de 2 a 5 unidades están disponibles a precio de distribuidor para evaluación de mercado.
    - q: ¿Ofrecen derechos territoriales exclusivos?
      a: Los derechos territoriales exclusivos están disponibles para distribuidores calificados que cumplan con sus compromisos de volumen anual y mantengan los estándares de marca. También se encuentran disponibles acuerdos semiexclusivos y no exclusivos para los mercados emergentes.
    - q: ¿Qué apoyo de marketing ofrecen?
      a: Proporcionamos un kit de marketing completo que incluye fotografías profesionales de productos, hojas de especificaciones, plantillas de documentación de cumplimiento, biblioteca de contenido de redes sociales y materiales de marca compartida. Actualizado anualmente con lanzamientos de nuevos productos.
    - q: ¿Cómo se manejan las reclamaciones de garantía?
      a: 'Los distribuidores sirven como el primer punto de contacto para reclamos de garantía. Proporcionamos criterios de garantía claros, protocolos de documentación fotográfica y procesamiento rápido de reemplazo o crédito. Términos de la garantía: 5 años limitados en tela/costuras/casco de tubos de embarcaciones; 2 años en SUP y accesorios.'
    - q: ¿Puedo etiquetar productos Paddle Board Overstock con mi propia marca?
      a: Sí, a través de nuestro programa OEM/ODM. Las opciones de etiquetas privadas incluyen gráficos de tubos personalizados, marcas de consolas, empaques minoristas y documentación de cumplimiento bajo su marca. Consulte nuestra página de servicios OEM/ODM para obtener más detalles.
    - q: ¿Qué documentación de cumplimiento se incluye para los distribuidores?
      a: Cada envío incluye CE DoC específica del modelo, datos de la placa de construcción, manuales del propietario y documentación de envío. También brindamos soporte de registro regulatorio para su territorio y ayudamos con cualquier requisito de cumplimiento local.
