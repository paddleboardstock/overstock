materials:
  intro_p1: El rendimiento, la durabilidad y la seguridad de una tabla de paddle inflable dependen casi en su totalidad de los materiales utilizados en su construcción. Desde el laminado que forma el casco hasta los hilos que le dan rigidez a una tabla SUP, cada elección de material afecta cómo se comporta el producto en el agua y su duración.
  intro_p2: 'Esta guía cubre los tres materiales principales utilizados en las tablas de paddle inflables modernas: el laminado PVC, el núcleo drop-stitch y la cubierta de espuma EVA. Comprender estos materiales te ayudará a elegir la tabla adecuada para tus necesidades y mantenerla para una vida útil máxima.'
  labels:
    advantages: Ventajas
    limitations: Limitaciones
    best_for: 'Mejor para:'
  items:
    - name: PVC (Cloruro de polivinilo)
      summary: El estándar de la industria para SUPs inflables. La tela laminada de varias capas ofrece una excelente relación resistencia-peso a un precio accesible.
      pros:
        - Excelente relación calidad-precio
        - Ligero y fácil de manejar
        - Buena resistencia UV con los recubrimientos adecuados
        - Amplia gama de colores y acabados
        - Fácil de reparar con parches PVC y adhesivo solvente
      cons:
        - Vida útil típica de 7-10 años con el cuidado adecuado
        - Menos flexible a bajas temperaturas
        - Resistencia química menor
        - Puede desarrollar migración de plastificantes con el tiempo
      best_for: SUPs recreativos y de touring, paddle familiar, uso estacional, entornos de agua dulce y costeros.
    - name: Núcleo Drop-Stitch
      summary: La tecnología que revolucionó las SUPs inflables. Miles de hilos de poliéster conectan las capas superior e inferior de la tela, permitiendo una inflada a alta presión para un rendimiento rígido tipo casco duro.
      pros:
        - Extremadamente rígido a 12-20 PSI
        - Ligero — 18-30 libras para tabla de tamaño completo
        - Se pliega plano para almacenamiento y viaje
        - Excelente resistencia al impacto
        - Rendimiento consistente en diferentes rangos de temperatura
      cons:
        - Requiere bomba de alta presión
        - Reparación de pinchazos más compleja que en las de una sola capa
        - Costo de fabricación más alto que los inflables estándar
        - La pérdida de presión con el tiempo requiere rellenar periódicamente
      best_for: Tablas de paddle de pie y cualquier equipo que necesite un rendimiento rígido con portabilidad inflable.
    - name: EVA Cubierta de espuma
      summary: Espuma de célula cerrada EVA (etileno-vinil acetato) usada para almohadillas de tracción en tablas SUP. Proporciona amortiguación, agarre e aislamiento térmico — y lleva los diseños de la serie artística.
      pros:
        - Excelente agarre antideslizante mojado o seco
        - La amortiguación reduce la fatiga en largos remos
        - Aislamiento térmico de la superficie fría de la cubierta
        - UV y resistente al agua salada
        - Disponible en combinaciones de bloques multicolor y diseños grabados con láser
      cons:
        - Puede desgastarse con uso intenso durante 2-3 años
        - Debe estar correctamente adherida para evitar la delaminación
        - No es estructural — no afecta la rigidez
        - Añade un ligero peso (200-400 g por tabla)
      best_for: Tracción en cubierta SUP, diseños de la serie artística en la cubierta, y cualquier superficie que necesite footing antideslizante.
  selection:
    title: Guía de selección de materiales
    subtitle: 'Elige el material adecuado según tu caso de uso principal:'
    headers:
      - Caso de uso
      - Material recomendado
      - Por qué
    rows:
      - - Remo recreativo SUP
        - Drop-stitch PVC
        - Ligero, rígido, asequible — equilibrio ideal para remeros ocasionales
      - - Remo familiar y para principiantes
        - Ancho drop-stitch PVC (32"+)
        - Estable y tolerante — confianza para remeros principiantes
      - - Pesca y remo con equipo pesado
        - Ancho drop-stitch PVC con cubierta completa EVA
        - Estabilidad extra para pararse y lanzar, alto volumen para equipo de pesca
      - - Tablas de flota de alquiler SUP
        - Drop-stitch PVC + EVA cubierta
        - Duradera, reparable, buena relación calidad-precio para uso de alto giro
      - - Touring y remadas largas
        - Drop-stitch PVC (~11 pies)
        - Mejor seguimiento y eficiencia de deslizamiento para largas distancias
      - - Yoga y remo fitness
        - Ancho drop-stitch PVC con cubierta completa EVA
        - Plataforma estable y cómoda para posturas y entrenamientos
  deep_dive:
    title: Guías de profundidad
    topics:
      - title: Grado Marino PVC
        desc: Tela PVC laminada de múltiples capas — resistencia UV, pruebas de abrasión y clasificaciones de denier explicadas.
      - title: Capas de laminado PVC
        desc: Cómo la laminación de múltiples capas PVC equilibra fuerza, peso y resistencia UV.
      - title: Núcleo Drop-Stitch
        desc: Cómo miles de hilos internos crean estructuras inflables rígidas de alta presión a 15 PSI.
      - title: Tecnología de soldadura RF
        desc: La soldadura de alta frecuencia crea costuras fuertes y consistentes — cómo funciona y por qué es importante.
      - title: PSI y rendimiento
        desc: Por qué la presión de aire es importante para SUPs inflables — rigidez, capacidad de peso y calidad de manejo.
      - title: Pruebas de Calidad
        desc: Pruebas de presión, pruebas de flotabilidad, envejecimiento UV y pruebas destructivas — nuestro proceso de calidad.
      - title: Cubiertas de espuma EVA
        desc: Almohadillas de cubierta de espuma EVA de celda cerrada — tracción, comodidad y durabilidad para cubiertas SUP.
      - title: Cuidado del material
        desc: Limpieza, protección UV, prevención de moho y mejores prácticas de almacenamiento para productos inflables.
