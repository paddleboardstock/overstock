materials:
  intro_p1: El rendimiento, la durabilidad y la seguridad de una embarcación inflable dependen casi por completo de los materiales utilizados en su construcción. Desde el tejido que forma los tubos hasta los hilos que dan rigidez a una tabla de SUP, cada elección de material afecta al comportamiento del producto en el agua y a su duración.
  intro_p2: 'Esta guía cubre los cuatro materiales principales utilizados en las embarcaciones inflables modernas: el tejido de PVC, el caucho Hypalon CSM, la construcción con núcleo drop-stitch y las cubiertas de espuma EVA. Comprender estos materiales le ayudará a elegir el producto adecuado a sus necesidades y a mantenerlo para alargar su vida útil.'
  labels:
    advantages: Ventajas
    limitations: Limitaciones
    best_for: 'Ideal para:'
  items:
    - name: PVC (cloruro de polivinilo)
      summary: El estándar de la industria para botes inflables y SUP recreativos. El tejido laminado multicapa ofrece una excelente relación resistencia-peso a un precio accesible.
      pros:
        - Asequible — 30-50 % más barato que el Hypalon
        - Ligero y fácil de manejar
        - Buena resistencia a los rayos UV con los recubrimientos adecuados
        - Amplia gama de colores y acabados
        - Fácil de reparar con parches de PVC y adhesivo de disolvente
      cons:
        - Vida útil más corta que el Hypalon (7-10 años)
        - Menos flexible a bajas temperaturas
        - Menor resistencia química
        - Puede desarrollar migración de plastificantes con el tiempo
      best_for: SUP recreativos, botes económicos, flotas de alquiler, uso estacional, aguas dulces y entornos costeros.
    - name: Hypalon (caucho CSM)
      summary: Material de caucho sintético premium conocido por su durabilidad excepcional, su resistencia a los rayos UV y su larga vida útil. La referencia para botes inflables comerciales y de grado militar.
      pros:
        - Resistencia excepcional a los rayos UV y al ozono
        - Vida útil de 15-20 años con los cuidados adecuados
        - Excelente flexibilidad en climas fríos
        - Superior resistencia a productos químicos y aceites
        - Conserva el color más tiempo que el PVC
      cons:
        - Sensiblemente más caro que el PVC
        - Tejido de mayor peso
        - Menos opciones de color
        - Las reparaciones requieren adhesivos especializados
        - Menos fábricas de producción en el mundo
      best_for: RIB comerciales, búsqueda y rescate, aplicaciones militares, climas tropicales, propiedad de flota a largo plazo.
    - name: Núcleo drop-stitch
      summary: La tecnología que revolucionó los SUP inflables. Miles de hilos de poliéster conectan las capas superior e inferior del tejido, permitiendo una inflación a alta presión para un rendimiento digno de una tabla rígida.
      pros:
        - Extremadamente rígido a 12-20 PSI
        - Ligero — 18-30 lbs para una tabla de tamaño completo
        - Se pliega plano para almacenarlo y viajar
        - Excelente resistencia a los impactos
        - Rendimiento constante en todos los rangos de temperatura
      cons:
        - Requiere bomba de alta presión
        - La reparación de perforaciones es más compleja que en una sola capa
        - Mayor coste de fabricación que los inflables estándar
        - La pérdida de presión con el tiempo requiere un rellenado periódico
      best_for: Tablas de stand-up paddle, kayaks, cubiertas de aire para botes inflables, cualquier aplicación que exija rendimiento rígido con portabilidad inflable.
    - name: Cubierta de espuma EVA
      summary: Espuma EVA de celda cerrada (etileno-acetato de vinilo) utilizada para las alfombrillas de agarre de las tablas de SUP y las cubiertas de botes. Proporciona amortiguación, adherencia y aislamiento térmico.
      pros:
        - Excelente agarre antideslizante, mojada o seca
        - La amortiguación reduce la fatiga en paladas largas
        - Aislamiento térmico de la superficie fría de la cubierta
        - Resistente a los rayos UV y al agua salada
        - Disponible en composiciones multicolor y diseños grabados por láser
      cons:
        - Puede desgastarse con un uso intensivo en 2-3 años
        - Debe adherirse correctamente para evitar el deslaminado
        - No es estructural — no afecta a la rigidez
        - Añade un ligero peso (200-400 g por tabla)
      best_for: Agarre de cubierta para SUP, acolchado de cubierta de bote, comodidad del asiento de kayak, cualquier superficie que requiera un apoyo antideslizante.
  selection:
    title: Guía de selección de materiales
    subtitle: 'Elija el material adecuado según su uso principal:'
    headers:
      - Uso
      - Material recomendado
      - Por qué
    rows:
      - - SUP recreativo
        - PVC drop-stitch
        - Ligero, rígido y asequible — el equilibrio ideal para palistas ocasionales
      - - Bote familiar / bote de lago
        - PVC (1100 denier)
        - Rentable, fácil de reparar y con durabilidad suficiente para el uso recreativo
      - - RIB comercial / bote patrullero
        - Hypalon CSM
        - Máxima resistencia a los rayos UV, vida útil de 15-20 años, resistencia a productos químicos y aceites
      - - Flota de tablas SUP de alquiler
        - PVC drop-stitch + cubierta EVA
        - Duradero, reparable y con buena relación calidad-precio para un uso intensivo
      - - Operaciones de búsqueda y rescate
        - Hypalon CSM
        - Fiabilidad en condiciones extremas, flexibilidad en frío, resistencia química
      - - Kayak de travesía / expedición
        - PVC drop-stitch
        - Rendimiento rígido con portabilidad plegable para viajar
  deep_dive:
    title: Guías en profundidad
    topics:
      - title: PVC de grado marino
        desc: Tejido PVC laminado multicapa — resistencia a los rayos UV, pruebas de abrasión e índices denier explicados.
      - title: PVC vs Hypalon
        desc: La comparación definitiva de los dos materiales dominantes de los botes inflables — coste, vida útil y resistencia a los rayos UV.
      - title: Núcleo drop-stitch
        desc: Cómo miles de hilos internos crean estructuras inflables rígidas a alta presión de 12-15 PSI.
      - title: Tecnología de soldadura RF
        desc: La soldadura de alta frecuencia crea costuras fuertes y uniformes — cómo funciona y por qué es importante.
      - title: PSI y rendimiento
        desc: Por qué la presión del aire importa en los SUP y botes inflables — rigidez, capacidad de carga y calidad de navegación.
      - title: Pruebas de calidad
        desc: Pruebas de presión, pruebas de flotabilidad, envejecimiento UV y pruebas destructivas — nuestro proceso de calidad.
      - title: Cubiertas de espuma EVA
        desc: Alfombrillas de celda cerrada en espuma EVA — agarre, comodidad y durabilidad para cubiertas de SUP y botes.
      - title: Cuidado de los materiales
        desc: Limpieza, protección UV, prevención de moho y buenas prácticas de almacenamiento de productos inflables.
