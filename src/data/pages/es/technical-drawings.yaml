hero:
  tagline: Dibujos técnicos y CAD
  title: RIB y bote inflable<br />Dibujos técnicos y descargas CAD
  subtitle: Dibujos generales, hojas de dimensiones y diseños de cubiertas a nivel de planificación para la evaluación y especificación del proyecto. Acceda a dibujos técnicos en el nivel correcto, desde archivos PDF públicos hasta archivos STEP a nivel de proyecto.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Dibujos técnicos de embarcaciones RIB y descargas CAD.
direct_answer: Paddle Board Overstock proporciona dibujos técnicos a nivel de adquisición para embarcaciones RIB y embarcaciones inflables, incluidos archivos PDF de disposición general (GA), hojas de dimensiones y dibujos de disposición de la cubierta. Los formatos con mayor detalle (DXF/DWG, STEP/IGES) están disponibles previa consulta calificada o solicitud de proyecto.
stats:
  - value: PDF
    label: Descarga gratuita
    detail: Disposición general por modelo
  - value: DXF/DWG
    label: Acceso al formulario ligero
    detail: CAD 2D a nivel de planificación
  - value: PASO/IGES
    label: Solicitud de proyecto
    detail: Modelo 3D para integración.
  - value: Sólo acuerdo de confidencialidad
    label: Dibujos estructurales
    detail: Laminación del casco, datos del molde.
content_tiers:
  tagline: Descargar niveles
  title: 'Cuatro niveles de acceso<br />: el detalle adecuado para el escenario adecuado'
  subtitle: Proporcionamos planos a nivel de adquisición, no archivos a nivel de fabricación. Cada nivel coincide con una etapa de proyecto diferente.
  items:
    - title: 'Nivel 1: PDF público'
      description: Disposición general (GA), plano acotado de 4 vistas y diseño de plataforma en formato PDF. Disponible para descarga gratuita. Suficiente para la planificación de proyectos, asignación de espacio y revisión de especificaciones preliminares.
      icon: tabler:file-type-pdf
    - title: 'Nivel 2: formato ligero DXF/DWG'
      description: Archivos CAD 2D (DXF o DWG) para la integración del diseño a nivel de planificación. Requiere un breve formulario de calificación (nombre de la empresa, tipo de proyecto, uso previsto). No se incluyen datos estructurales ni de fabricación.
      icon: tabler:file-code
    - title: 'Nivel 3: Solicitud de proyecto STEP/IGES'
      description: Archivos de modelos 3D (STEP o IGES) para integración de sistemas, diseño de equipamiento o coordinación de arquitectura naval. Requiere solicitud de proyecto con alcance, cronograma e intención de compra. Sujeto a aprobación.
      icon: tabler:cube
    - title: 'Nivel 4: ingeniería de NDA'
      description: Dibujos estructurales del casco, programas de laminación, expansiones de corte de tubos y datos de moldes. Disponible solo bajo NDA con pedidos confirmados. Estos son archivos a nivel de fabricación, no para distribución pública.
      icon: tabler:lock
content_included:
  tagline: Qué está incluido
  title: Contenido del dibujo<br />Por modelo
  subtitle: Cada modelo tiene un paquete de dibujos estándar que cubre la información de planificación esencial para compradores B2B e ingenieros de proyectos.
  items:
    - title: Acuerdo General (GA)
      description: Perfil lateral, vista superior y sección transversal que muestra la forma del casco, la posición del tubo, la ubicación de la consola, los asientos, el sistema de combustible y las dimensiones clave (LOA, manga, diámetro del tubo, ángulo de elevación). Estado de revisión y derechos de autor indicados en el bloque de título.
      icon: tabler:layout
    - title: Dibujo de dimensiones de 4 vistas
      description: Vistas lateral, frontal, trasera y superior con dimensiones generales para la planificación del transporte (altura en el remolque, viga del contenedor, peso de elevación). Incluye configuraciones operativas y de transporte.
      icon: tabler:ruler-2
    - title: Plano de diseño y equipamiento de la cubierta
      description: Vista de arriba hacia abajo de la plataforma que muestra la base de la consola, las posiciones de los asientos, las ubicaciones de los anillos en D, las posiciones de las luces de navegación, el acceso a la bomba de achique, el compartimiento de batería/combustible y los puntos de montaje del equipo. Precisión limitada en interfaces propietarias.
      icon: tabler:map
    - title: Dibujo de transporte y embalaje
      description: Plan de carga de contenedores, dimensiones de cuna, distribución de peso y posiciones de puntos de elevación para planificación logística. Incluye opciones de embalaje estándar y personalizado.
      icon: tabler:truck
content_protection:
  tagline: Protección de propiedad intelectual
  title: Lo que no compartimos<br />y por qué
  subtitle: Proteger nuestra propiedad intelectual de ingeniería garantiza que podamos seguir invirtiendo en I+D y al mismo tiempo proporcionar todo lo que los compradores necesitan para la planificación de proyectos.
  items:
    - title: Datos del núcleo del molde del casco
      description: La geometría del enchufe y del molde, las trayectorias de las herramientas CNC y las plantillas de laminación son activos de fabricación patentados. No se comparten en ningún nivel de acceso fuera de los contratos NDA confirmados.
      icon: tabler:ban
    - title: Expansiones de corte de tubos
      description: Los archivos de corte de patrones planos para tela tubular son datos a nivel de fabricación. Disponible únicamente bajo NDA con pedidos de producción confirmados y compartidos únicamente con la parte contratante.
      icon: tabler:ban
    - title: Cálculos estructurales
      description: El análisis de tensión detallado, los resultados de FEA y los cronogramas de laminado son documentos sensibles al cumplimiento que se comparten únicamente con los organismos notificados y los clientes sujetos a NDA durante el proceso de evaluación de la conformidad.
      icon: tabler:ban
    - title: Selección de competidores
      description: Nos reservamos el derecho de rechazar solicitudes de acceso a CAD que parezcan provenir de competidores, estudiantes sin contexto de proyecto o partes sin intención legítima de adquisición.
      icon: tabler:shield
content_models:
  tagline: Modelos disponibles
  title: Dibujo Técnico<br />Disponibilidad por Modelo
  subtitle: Las descargas GA PDF están disponibles para nuestros principales modelos de embarcaciones neumáticas y RIB. Contáctenos para dibujos de modelos específicos que no figuran en la lista.
  items:
    - title: AF580 COSTILLA
      description: Neumática de 5,8 m, casco en V profunda de PRFV, tubos Hypalon o PVC, consola central. GA, dimensiones, diseño de la plataforma y plan de transporte disponibles. Categoría de diseño C.
      icon: tabler:sailboat
    - title: AF520 COSTILLA
      description: Neumática de 5,2 m, casco en V moderada de PRFV, tubos Hypalon o PVC, consola lateral o central. GA y dimensiones disponibles. Categoría de diseño C.
      icon: tabler:sailboat
    - title: AF430 COSTILLA
      description: Neumática de 4,3 m, casco de PRFV, tubos de PVC, timón o consola. GA y dimensiones disponibles. Categoría de diseño C/D.
      icon: tabler:sailboat
    - title: Embarcación inflable AF380
      description: Embarcación neumática de 3,8 m, suelo de aluminio, tubos de PVC. Dimensiones GA y embalaje disponibles. Cumple con la norma EN ISO 6185.
      icon: tabler:sailboat
    - title: Embarcación inflable AF320
      description: Embarcación neumática de 3,2 m, suelo air deck, tubos de PVC. Dimensiones GA y embalaje disponibles. Cumple con la norma EN ISO 6185.
      icon: tabler:sailboat
