content_version_control:
  tagline: Control de versiones
  title: Gestión de versiones<br />de planos
  subtitle: Cada plano sigue un sistema de revisión controlado. Verifique siempre que dispone de la revisión vigente antes de usar los planos para la planificación de su proyecto.
  items:
    - title: Seguimiento de revisiones
      description: Cada plano lleva un código de revisión (Rev-A, Rev-B, Rev-C), fecha de emisión, fecha de última revisión, modelo o configuración aplicable, unidades, tamaño de archivo y formato. Solo la revisión "vigente" está disponible para descarga.
      icon: tabler:git-branch
    - title: Aviso sobre el estado de los planos
      description: Todos los planos públicos están marcados como "Disposición preliminar — no usar para construcción, certificación o producción. Dimensiones sujetas a la especificación final y a la confirmación del pedido." Esto protege a ambas partes de un uso indebido.
      icon: tabler:alert-circle
    - title: Notificaciones de actualización
      description: Cuando cambia la especificación de un modelo, se actualiza la revisión del plano y las versiones anteriores se marcan como "sustituidas". Los usuarios registrados que descargaron paquetes DXF/DWG reciben por correo electrónico aviso de las actualizaciones significativas.
      icon: tabler:bell

faq:
  title: 'Dibujos técnicos: preguntas frecuentes'
  questions:
    - q: ¿Los archivos GA PDF se pueden descargar realmente gratis?
      a: Sí. Los PDF de arreglos generales de nuestros principales modelos están disponibles sin costo. Contienen información a nivel de planificación suficiente para la evaluación del proyecto, la asignación de espacio y la revisión de las especificaciones preliminares.
    - q: ¿Cómo accedo a archivos DXF/DWG?
      a: Complete el breve formulario de calificación en la página de descarga con el nombre de su empresa, el tipo de proyecto y el uso previsto. Las solicitudes aprobadas reciben un enlace de descarga por correo electrónico dentro de 1 día hábil.
    - q: ¿Puedo obtener modelos 3D de STEP/IGES?
      a: Los archivos de modelos 3D STEP o IGES están disponibles a través de nuestro proceso de solicitud de proyectos. Proporcione el alcance de su proyecto, los requisitos de integración, el cronograma y la intención de compra. Sujeto a aprobación, normalmente dentro de 3 a 5 días hábiles.
    - q: ¿Por qué restringes el acceso a archivos con mayor detalle?
      a: La geometría del casco, los datos del molde y los cálculos estructurales representan años de inversión en I+D y son propiedad intelectual fundamental en la fabricación. Proporcionamos todo lo necesario para la planificación de adquisiciones y la integración de proyectos mientras protegemos nuestra capacidad de continuar invirtiendo en el desarrollo de nuevos productos.
    - q: ¿Los dibujos incluyen detalles de fabricación?
      a: No. Los planos públicos y ligeros contienen información a nivel de adquisiciones para la planificación y especificación. Los detalles a nivel de fabricación (programas de laminación, trayectorias de herramientas, expansiones de corte) se comparten únicamente bajo NDA con pedidos confirmados.
    - q: ¿Hay dibujos disponibles para configuraciones RIB personalizadas o semipersonalizadas?
      a: Los dibujos de proyectos personalizados se preparan como parte del proceso de desarrollo OEM/ODM. Si está evaluando un proyecto RIB personalizado, contáctenos con sus requisitos y le proporcionaremos dibujos GA específicos del proyecto como parte de la propuesta.
