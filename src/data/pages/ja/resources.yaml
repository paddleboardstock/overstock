hero_text:
  tagline: リソース
  title: 'ダウンロードセンター・バイヤーガイド'
  subtitle: '製品カタログ、OEM ガイド、バイヤーチェックリスト、技術文書を活用して、十分な情報に基づいた調達判断を行えます。'
features3_downloads:
  tagline: ダウンロード
  title: '製品ドキュメント<br />とバイヤー向けリソース'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 マリン製品カタログ'
      description: 'RIB ボート、インフレータブルボート、SUP ボード、カヤック、アクセサリーを含む完全な製品ラインナップ。仕様、構成、オプション。PDF 形式。'
      icon: tabler:file-text
    - title: 'OEM 製造ガイド'
      description: 'OEM/ODM パートナーシップについて知るべきすべて：プロセスの概要、最小注文数量、カスタマイズオプション、品質管理、出荷。'
      icon: tabler:building-factory
    - title: 'RIB ボート バイヤーガイド'
      description: '適切な RIB の選び方：船体素材、チューブ素材、エンジン選定、サイズの考慮点、用途別の構成オプション。'
      icon: tabler:file-description
    - title: 'SUP サプライヤーチェックリスト'
      description: 'SUP ボードメーカー選定時の重要な考慮点：品質指標、認証要件、MOQ の検討事項、工場監査で確認すべきポイント。'
      icon: tabler:clipboard-check
    - title: 'インフレータブルボート素材ガイド'
      description: 'PVC とハイパロンの比較：耐久性、耐 UV 性、寿命、修理オプション、用途別のコスト考慮点。'
      icon: tabler:files
    - title: 'カスタム製造ブリーフテンプレート'
      description: '製品ブリーフテンプレートをダウンロード。要件を記入してご返送いただくと、同一週内に見積もりと実現可能性評価をご提案します。'
      icon: tabler:template
faqs:
  title: よくある質問
  subtitle: '製品、製造プロセス、パートナーシップモデルについてのよくある質問。'
  columns: 2
  items:
    - title: 最小注文数量はどのくらいですか？
      description: 'MOQ は製品カテゴリによって異なります。RIB ボートは通常モデルごとに 10 台から、SUP ボードは 50 台から。製品固有の MOQ 情報は営業チームにお問い合わせください。'
      icon: tabler:help-circle
    - title: 注文前にサンプルを入手できますか？
      description: 'はい。Paddle Board Overstock は量産前の評価用にサンプル製造を提供しています。サンプル費用は相談可能で、多くの場合、最初の生産注文に充当されます。'
      icon: tabler:package
    - title: どのような支払条件がありますか？
      description: '標準条件は注文時 30% の頭金、出荷前 70% のお支払いです。条件を満たす顧客には LC 条件も利用できます。詳細は財務チームにご相談ください。'
      icon: tabler:currency-dollar
    - title: 生産にはどのくらいかかりますか？
      description: '典型的なリードタイム：RIB ボート 30～45 日、SUP ボード 20～30 日、インフレータブルボート 25～35 日。カスタム開発は試作に 15～30 日追加されます。'
      icon: tabler:calendar-clock
    - title: 製品はどのような認証を取得していますか？
      description: 'EU 市場向け CE 認証、US 沿岸警備隊認可の製造、ISO 品質システム、BSCI 準拠、REACH 素材準拠。'
      icon: tabler:certificate
    - title: カスタムパッケージとブランディングはありますか？
      description: 'はい。お客様のロゴ、カラー、ブランドアイデンティティを使用したカスタムパッケージを提供します。カスタムパッケージの MOQ は製品カテゴリによって異なります。'
      icon: tabler:color-swatch
cta:
  title: '適切なリソースが見つからない場合は？'
  subtitle: '製品選定、OEM パートナーシップ、技術仕様について、当社チームが個別にご案内します。'
  actions:
    - variant: primary
      text: チームに問い合わせる
      href: /contact
