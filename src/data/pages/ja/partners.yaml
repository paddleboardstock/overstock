hero:
  tagline: パートナー・流通
  title: 'Paddle Board Overstock パートナーになる<br />— グローバル流通ネットワーク'
  subtitle: "Paddle Board Overstock のグローバルパートナーネットワークに参加しませんか。当社は 50 カ国以上の海洋ディストリビューター、ボート販売店、機器小売店、ブランドパートナーと連携しています。"
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstock のグローバルパートナー・ディーラーネットワーク
content_programs:
  tagline: パートナープログラム
  title: '成長のための<br />パートナープログラム'
  subtitle: 'ディストリビューター、ディーラー、ブランドパートナーのいずれであっても、Paddle Board Overstock はビジネスを支援するために設計されたプログラムを提供します。'
  columns: 3
  items:
    - title: 'ディストリビュータープログラム'
      description: '独占地域流通。ボリューム価格、マーケティングサポート、工場への直接アクセス付き。地域の規模に応じた最低コミットメントが必要です。'
      icon: tabler:world
    - title: 'ディーラープログラム'
      description: '直販ディーラー価格、製品トレーニング、マーケティング資材、小売店舗・オンラインストアのための保証サポート。'
      icon: tabler:building-store
    - title: 'OEM/ODM パートナーシップ'
      description: 'カスタムブランディング、パッケージ、製品仕様を備えたフルサービスの OEM・ODM 製造。コンセプトからコンテナまで。'
      icon: tabler:certificate
    - title: 'ブランドパートナーシップ'
      description: '海洋・アウトドアレジャー分野の確立されたブランドのためのコ・ブランディング、プライベートブランド、独占モデルプログラム。'
      icon: tabler:stars
    - title: '政府・公共機関'
      description: '政府機関、沿岸警備隊、軍、人道支援組織のための優先サプライヤープログラム。入札対応の文書を用意。'
      icon: tabler:building-community
    - title: 'リゾート・レンタルパートナー'
      description: '世界中のリゾート、ダイビングセンター、レンタル事業のためのフリート価格、一貫した品質、カスタムブランディング。'
      icon: tabler:sun
content_benefits:
  tagline: 当社がパートナーに選ばれる理由
  title: 'パートナーが Paddle Board Overstock を選ぶ理由'
  subtitle: '当社のパートナーは、本物の製造能力、一貫した品質、迅速なサポートの恩恵を受けています。'
  list:
    - '工場への直接アクセス：当社の製造チームと直接やり取り — 仲介者なし。より迅速な対応、より良い価格、生産の完全な可視性を得られます。'
    - 'カスタマイズ対応：カスタムカラー、ロゴ、パッケージ、仕様で製品をブランド化。お客様の市場に合わせた最小注文数量。'
    - '品質保証：CE、UKCA、BSCI 準拠の ISO 9001 認証生産。すべての製品を出荷前にテスト。'
    - 'グローバル物流：FOB、CIF、DDP オプションで中国・青島から出荷。北米流通のためのカリフォルニア州モントクレアの米国倉庫。'
    - 'マーケティングサポート：販売活動を支援する製品カタログ、写真、技術文書、デジタルアセット。'
    - 'トレーニング・サポート：営業チームへの製品トレーニング、顧客への技術サポート、保証サービスの調整。'
content_process:
  tagline: パートナーになる方法
  title: 'シンプルなパートナーシップ手順'
  subtitle: '当社のパートナーシップ手順は明快で — Paddle Board Overstock 製品をすぐに販売開始できるように設計されています。'
  items:
    - title: 'ステップ 1：申請の提出'
      description: '会社概要、対象市場、興味のある製品を記入して、パートナー申請フォームをご提出ください。'
    - title: 'ステップ 2：審査'
      description: 'パートナーシップチームが申請を確認し、3 営業日以内に機会についてご連絡します。'
    - title: 'ステップ 3：契約・セットアップ'
      description: 'パートナーシップ契約を結び、アカウントを設定すると、パートナー価格、マーケティング資材、製品サンプルを受け取れます。'
    - title: 'ステップ 4：トレーニング・開始'
      description: '製品トレーニング、販売サポート、マーケティング資材を提供。販売開始の準備が整います。'
cta:
  title: 'Paddle Board Overstock パートナーになる準備はできましたか？'
  subtitle: 'パートナーシップに応募すると、当社チームが 3 営業日以内にご回答します。'
  actions:
    - variant: primary
      text: パートナーシップに応募する
      href: /contact
    - text: 製品を見る
      href: /products
