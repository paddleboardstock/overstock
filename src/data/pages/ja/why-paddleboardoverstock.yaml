reasons:
  tagline: Paddle Board Overstockの違い
  title: 私たちを際立たせるもの
  isBeforeContent: false
  columns: 3
  items:
    - title: 本物の製造、取引ではなく
      description: 当社は12,000平方メートルの工場を所有・運営しています。Paddle Board Overstockと提携すると、製品を設計・エンジニアリング・製造する人々と直接仕事をすることができ、仲介者はいません。
      icon: tabler:building-factory
    - title: エンジニア主導のアプローチ
      description: 私たちの設計プロセスは、製品カテゴリーではなくユースケースから始まります。私たちは、機器が商業環境で実際にどのように使用されるかに応じて、船体形状、材料の選択、および構成を最適化します。
      icon: tabler:engine
    - title: 認定品質
      description: CE 認定済み、ISO 品質システム、BSCI 適合、REACH 適合、USCG タイプIII/V承認ライフベスト；すべての製品は該当する国際規格に適合しています。
      icon: tabler:certificate
    - title: 柔軟な OEM/ODM
      description: チューブの色、コンソールのレイアウト、ブランド、パッケージ — お客様の仕様に合わせてカスタマイズします。最小注文数の制約はありません。まずはプロトタイプから始め、自信をもってスケールアップしてください。
      icon: tabler:adjustments
    - title: グローバルロジスティクス
      description: 米国カリフォルニア州の倉庫、青島からの直送、緊急注文には航空便。世界中の通関手続きや書類作成を対応します。
      icon: tabler:truck-delivery
    - title: 生涯サポート
      description: 私たちは20年前に作ったボートをサポートしています。純正のスペアパーツ、技術的なアドバイス、修理の指導 — 私たちのチームは、あなたがどこにいても、必要なときに対応します。
      icon: tabler:lifebuoy
testimonials:
  tagline: 世界中のブランドに信頼されている
  title: 私たちのパートナーの声
  items:
    - content: 私たちは中国のいくつかのメーカーと仕事をしてきましたが、Paddle Board Overstockはその技術サポートと安定した品質で際立っています。彼らは私たちのブランドを自分のもののように扱っています。
      name: — OEM パートナー、ヨーロッパのウォータースポーツブランド
    - content: 彼らのHypalonRIBsは、5年以上にわたり私たちの艦隊で使用されています。メンテナンスは最小限で、UV耐性は優れています。チューブの5年間保証が私たちに安心感を与えます。
      name: — フリートオペレーター、中東リゾートグループ
    - content: Paddle Board Overstockチームは、コンセプトから生産まで90日間でカスタムSUPボードの設計開発を手伝ってくれました。品質は私たちの期待を超えました。
      name: — ディストリビューター、オーストラリアウォータースポーツ
    - content: 小規模事業のオーナーとして、私はMOQsについて心配していました。Paddle Board Overstockは私の予算に合わせて対応してくれ、わずか50枚のボードで私のブランドを立ち上げるのを手伝ってくれました。今では500枚を注文しています。
      name: — ブランド創設者、米国 SUP レンタル会社
