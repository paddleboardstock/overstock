hero:
  tagline: なぜ Paddle Board Overstock
  title: 他とは違う作り。ビジネスのために作られた。<br />世界中のウォーターアドベンチャーのパートナー
  subtitle: 単なる製造業者ではなく、クラブ、リゾート、レンタル事業者、新興のウォーターブランド向けに商用グレードの機器を設計、開発、提供するビジネスパートナーです。
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstockの製造品質と専門知識
pillars:
  tagline: パートナーシップの三本柱
  title: なぜ世界の水ビジネスはPaddle Board Overstockを選ぶのか
  subtitle: ''
  columns: 3
  items:
    - title: 商業用に設計された
      description: 当社の機器は週末のレクリエーションではなく、日常的なレンタルのために設計されています。商業グレードのPVC、強化されたdrop-stitchコア、UV安定のHypalonオプション、そして現場でテストされたハードウェアにより、保守コストの低減、寿命の延長、そして運用におけるROIの向上を実現します。
      icon: tabler:building-factory
      callToAction:
        text: 商用製品ラインを見る
        href: /products
    - title: アイデアから市場へ
      description: 90日であなたのウォータースポーツブランドを立ち上げましょう。コンセプトの検証、商品選定、プロトタイプ、製造、パッケージデザイン、世界的な発送まで、私たちがすべてのステップを案内します。最低注文のプレッシャーはありません — 小規模から始めて、自信を持って拡大できます。
      icon: tabler:rocket
      callToAction:
        text: ブランドの旅を始めましょう
        href: /oem-odm-blueprint
    - title: 世界の環境に対応して作られた
      description: あらゆる気候に最適化された製品：ヨーロッパ向けの冷水用PVC処方、中東およびオーストラリア向けのUV耐性素材、東南アジア向けの防湿処理。各出荷は目的地の環境に合わせて調整されています。
      icon: tabler:world
stats:
