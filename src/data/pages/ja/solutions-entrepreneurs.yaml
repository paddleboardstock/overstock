  title: ブランドを立ち上げる準備はできていますか?
  subtitle: あなたのビジョンをお聞かせください — 48 時間以内に製品とパッケージの提案を作成します。
  actions:
    - variant: primary
      text: ブランドを始める
      href: /contact
    - text: OEM の機能を表示する
      href: /oem-odm-manufacturer
    - text: ビジネスパッケージを見る
      href: /business-packages
