hero:
  tagline: "ウォーターブランド起業家"
  title: Paddle Board OverstockのOEM/ODMで<br />自分だけのウォータースポーツブランドを立ち上げよう
  subtitle: Amazonセラー、アウトドアインフルエンサー、地域代理店、初めてのブランドオーナー向けのターンキー式プライベートブランド製造――製品デザインから初回出荷までトータルにサポートします。
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: "ウォータースポーツブランド向けプライベートラベル製造を行うPaddle Board Overstock工場"
direct_answer: Paddle Board Overstockなら、自分だけのウォータースポーツブランドを簡単に立ち上げられます。プライベートブランドプログラムは、製品選定やカスタム金型デザインから、ロゴ印刷、パッケージング、お客様へのドロップシッピングまで、すべてお任せいただけます。SKUあたり2〜5個（RIB）/ 5〜10個（SUP）の低MOQと30〜45日のリードタイムにより、初めての起業家も通常60〜90日でアイデアから初回出荷まで到達できます。実績のある50種類以上のインフレータブルSUP・カヤック・RIB・アクセサリーデザインのカタログからお選びいただくか、社内エンジニアリングチームとともに完全オリジナルの製品を開発することも可能です。
solution_offerings:
  - title: "スターターブランド立ち上げ"
    subtitle: "市場を試したい初めての起業家向け"
    badge: Popular
    features:
      - title: "製品選定"
        description: "工場直価格で、実績のある50種類以上のインフレータブルボートデザインから選択可能"
      - title: カスタムブランディング
        description: "ボードへのロゴ印刷、カスタムカラーマッチング、ブランドパッケージング"
      - title: "低MOQ"
        description: SKUあたり2〜5個（RIB）、5〜10個（SUP）からスタート――拡大前に市場をテスト
      - title: "認証対応"
        description: "64モデルがCE認証取得――安心して世界中で販売できます"
      - title: "物流サポート"
        description: FOB青島またはCIF条件で仕向港へお届け
    cta_text: "マイブランドを立ち上げる"
    cta_href: /contact
  - title: "プレミアムブランド立ち上げ"
    subtitle: "カスタムデザインと専用パッケージが必要な本格的なブランド向け"
    badge: Premium
    features:
      - title: "カスタム製品デザイン"
        description: "オーダーメイドの金型開発、形状最適化、パフォーマンスチューニング"
      - title: "フルパッケージデザイン"
        description: "小売対応パッケージ、ハングタグ、取扱説明書、開封体験までトータルに"
      - title: "デジタルアセット"
        description: "プロフェッショナルな製品撮影、ライフスタイル画像、動画コンテンツ"
      - title: "品質保証"
        description: "第三者検査、工場監査報告書、生産サンプル"
      - title: "スケーラブルな生産"
        description: "初回200個から10,000個以上まで、一貫した品質と価格で対応"
    cta_text: "マイブランドを育てる"
    cta_href: /contact
