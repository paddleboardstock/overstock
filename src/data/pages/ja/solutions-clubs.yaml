testimonial:
  content: 私たちはポルトガルのサーフィンスクールのクラブスターターパッケージから始めました。ボード、パドル、ベスト 20 枚 - すべてが 3 週間以内に到着しました。 2 シーズン後、プロ パッケージにアップグレードしました。当社のロゴを使用したカスタムブランディングは、当社のプロフェッショナルなイメージを一変させました。
  name: リカルド・サントス
  title: アルガルベ サーフ アカデミー、オーナー — ポルトガル、ラゴス
content_segments:
  tagline: クラブプロフィール
  title: ウォーター スポーツ クラブ ソリューション<br />クラブ タイプ別
  subtitle: 大学のパドルクラブから高級プライベートヨットクラブまで、クラブの種類ごとに独自の用具ニーズ、使用パターン、予算構造があります。クラブモデルに合わせてあらゆるパッケージをカスタマイズします。
  items:
    - title: 大学およびカレッジパドルクラブ
      subtitle: 使用率の高い学生フリート
      description: 大学のレクリエーション部門向けに SUP およびカヤック プログラムを運営する学生主導または教育機関が支援するパドル クラブ。機器は、学期ごとに複数のスキル レベルにわたって、高頻度かつ高回転の使用に直面します。学生団体にとって予算に優しい価格設定とともに、耐久性と簡単な修理性が重要です。
      features:
        - 学生の使用サイクル向けに評価された非常に耐久性の高いPVC構造
        - スキルレベルごとに色分けされたボード範囲により、フリート管理が容易になります
        - すべての注文に修理キット + オンコールビデオサポートが含まれています
        - 学生団体の割引価格と学期ベースの支払い条件
    - title: コミュニティ パドル & ソーシャル クラブ
      subtitle: 会員制レクリエーションクラブ
      description: メンバーに SUP、カヤック、ソーシャル パドリング体験を提供する地域密着型のクラブ。用具は、クラブのアイデンティティと会員の誇りを育むブランディングとともに、幅広い年齢層向けに性能と快適性のバランスを取る必要があります。限られたウォーターフロントアクセスで運営されているクラブにとって、保管効率は鍵となります。
      features:
        - '混合フリート: オールラウンド SUP、ツーリング ボード、レクリエーション カヤック'
        - '完全なクラブブランディング: カスタムカラー、ロゴ印刷、ブランド化された PFD'
        - インフレータブル機器用のコンパクトな保管ソリューション
        - '会員増強スターター キット: 紹介カード、ブランド写真'
    - title: サーフ スクールとサーフ カヤック アカデミー
      subtitle: 海岸でのパフォーマンスとコーチング
      description: SUP サーフィン、サーフ カヤック、波乗りのスキルを教えるサーフィン専門の学校。装備は波の状況でも機能する必要があります。操作性、応答性、および繰り返しのワイプアウト、砂の磨耗、塩水への曝露に急速に劣化することなく対処できる十分な耐久性が必要です。
      features:
        - サーフでの操作性を最適化した、より短く幅広のSUP形状
        - 波の衝撃に耐える強化レール構造
        - 'サーフィン専用の安全装備: コイル状のリーシュ、ソフトフィンのオプション'
        - 季節の下取り割引を伴う車両交換プログラム
    - title: 企業および民間のヨットクラブ
      subtitle: プレミアム会員の体験
      description: 会員向けの高級アメニティとしてウォーター スポーツを提供する高級プライベート クラブ。機器の基準は高く、美観、ブランドの整合性、ゲスト向けのプレゼンテーションがパフォーマンスと同じくらい重要です。期待されるサービスには、きめ細やかなサービスの提供、カスタム ストレージ ソリューション、コンシェルジュ レベルのサポートが含まれます。
      features:
        - 木目調EVAとメタリックアクセントを備えたプレミアム仕上げのボード
        - クラブブランドのガイドラインに合わせたカスタムカラー
        - 'コンシェルジュによる配達: 季節ごとに事前に膨らませ、段階的にラベルを付けます。'
        - 優先対応 SLA を備えた専用アカウント管理
