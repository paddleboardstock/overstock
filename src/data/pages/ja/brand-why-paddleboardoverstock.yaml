features3_reasons:
  tagline: Paddle Board Overstock を選ぶ理由
  title: 'パートナーとして選ばれる 7 つの理由'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. 商社ではない、本物の製造'
      description: '当社は 12,000㎡ の工場を所有し運営しています。Paddle Board Overstock と組めば、製品の設計、エンジニアリング、製造を行う人々と直接やり取りできます — 仲介者はいません。'
      icon: tabler:building-factory
    - title: '2. エンジニアリング主導のアプローチ'
      description: '当社の設計プロセスは製品カテゴリではなく使用例から始まります。船体形状、素材選定、構成を、ボートの実際の使い方に合わせて最適化します。'
      icon: tabler:engine
    - title: '3. 認証された品質'
      description: 'CE 認証、ISO 品質システム、BSCI 準拠、REACH 準拠、USCG 認可。CE認証を取得した64モデルが国際基準を満たしています — 口先だけではありません。'
      icon: tabler:certificate
    - title: '4. 柔軟な OEM/ODM'
      description: 'チューブカラー、コンソールレイアウト、ブランディング、パッケージ — お客様の仕様に合わせてカスタマイズします。最小注文のプレッシャーはありません。試作から始めて、自信を持ってスケールできます。'
      icon: tabler:adjustments
    - title: '5. グローバル物流'
      description: 'カリフォルニアの米国倉庫、青島からの直接出荷、緊急注文のための航空輸送。通関書類と各種文書も当社が処理します。'
      icon: tabler:truck-delivery
    - title: '6. ライフタイムサポート'
      description: '20 年前に造ったボートもサポートします。純正スペアパーツ、技術的なアドバイス、修理のガイダンス — 必要なときにチームが対応します。'
      icon: tabler:lifebuoy
    - title: '7. 正直な仕様'
      description: '実際の積載定格、実際の寸法、実際の重量。マーケティング上の水増しはありません。公表しているものがそのまま手に入ります — 独立したテストで検証済みです。'
      icon: tabler:ruler-measure
testimonials:
  tagline: 世界中のブランドから信頼される
  title: パートナーの声
  items:
    - content: '中国のいくつかのメーカーと取引してきましたが、Paddle Board Overstock はエンジニアリングサポートと一貫した品質で際立っています。当社のブランドを自分たちのものとして扱ってくれます。'
      name: '— OEM パートナー、欧州ウォータースポーツブランド'
    - content: '彼らのハイパロン RIB は当社のフリートで 5 年以上運用されています。最小限のメンテナンスで、耐 UV 性に優れています。チューブの 5 年保証は安心材料です。'
      name: '— フリート運営者、中東リゾートグループ'
    - content: 'Paddle Board Overstock チームは、カスタム SUP ボートの設計をコンセプトから量産まで 90 日で開発するのを助けてくれました。品質は期待を超えていました。'
      name: '— ディストリビューター、オーストラリアン・ウォータースポーツ'
cta:
