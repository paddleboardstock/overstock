faq:
  title: パッケージに関するよくある質問
  questions:
    - q: パッケージの最低注文数量はいくらですか?
      a: Club Starter Package には最低 10 ユニットが必要です。リゾートおよびブランド パッケージは、柔軟な MOQ でお客様のニーズに合わせてカスタマイズされます。
    - q: 配達にはどのくらい時間がかかりますか?
      a: 標準的な生産期間は注文確認後 30 ～ 45 日です。追加料金で特急生産も可能です。
    - q: 機器の色やブランドをカスタマイズできますか?
      a: はい。すべてのパッケージには、ボードの色、ロゴプリント、パッケージデザインなどの完全なカスタマイズが含まれています。
    - q: 購入後のサポートはありますか?
      a: はい。すべてのパッケージには、オンライン メンテナンス ガイド、ビデオ チュートリアル、スペアパーツ注文システムへのアクセスが含まれています。
cta:
  title: どのパッケージが適合するかわかりませんか?
  subtitle: 3 つの簡単な質問に答えると、あなたのビジネスに最適なパッケージをお勧めします。
  actions:
