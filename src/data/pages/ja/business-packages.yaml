hero:
  tagline: ビジネスパッケージ
  title: すぐに展開できる水ビジネス<br />あらゆる段階に対応するパッケージ
  subtitle: ウォーター スポーツ クラブ、リゾート、ブランドのスタートアップ向けの事前構成済みの機器パッケージ。透明性のある価格設定、短納期、完全なカスタマイズ オプションを備えています。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    alt: Aquafarer ビジネス機器パッケージ
direct_answer: Aquafarer は、あらゆる段階のウォーター スポーツ オペレーター向けに設計された 3 つの事前設定されたビジネス パッケージを提供します。クラブ スターター パッケージには、パドル、ポンプ、修理キット、新興クラブや学校向けの安全装備を備えた 10 台の SUP が含まれています。リゾート プレミアム パッケージは、ホテルやホスピタリティ施設向けの保管システム、ブランディング、トレーニング ガイドを備えた 50 ～ 100 ユニットを提供します。ブランド立ち上げパッケージは、独自のウォーター スポーツ ブランドを立ち上げる起業家向けに、製品の選択、カスタム ロゴ デザイン、梱包、製造、発送を提供します。すべてのパッケージには、工場直販価格、CE 認証、およびグローバルな物流サポートが含まれています。
