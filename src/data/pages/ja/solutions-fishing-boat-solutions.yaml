content_challenge:
  tagline: 挑戦
  title: 'フィッシングボートに必要な<br />安定性・航続力・耐久性'
  subtitle: '商業漁船を運用する場合も、協同組合のフリートを管理する場合も、釣りチャーターを運営する場合も — ボートは毎日確実に性能を発揮する必要があります。'
  paragraphs:
    - 'フィッシングボートには、釣り糸の操作、漁獲物の取り扱い、デッキ上の安全な移動のための安定したプラットフォームが必要です。インフレータブルボートと RIB は、チューブ設計により本来の安定性を備えています — 同程度の長さの硬い船体に対する大きな利点です。'
    - '運用コストが収益性に直結する漁業において、燃費は重要です。RIB とインフレータブルボートは同等の硬式艇より軽いため、必要な馬力が少なく、燃料消費も少ありません — 毎日ボートを運行する商業事業者やフリート予算を管理する協同組合にとって極めて重要です。'
    - '海洋環境での耐久性が不可欠です。海水、紫外線、絶え間ない使用は、劣化せずに過酷な条件に耐えられる材料を必要とします。商業事業者や協同組合にとって、信頼性は収入に直接影響します — 故障したボートは、漁に出られない日を意味します。'
    - 'Paddle Board Overstock のフィッシング構成には、ロッドホルダー、魚群探知機、ベイトウェル、ライブウェル、そして商業・協同組合・レジャーの本格的な釣り用途向けに設計された積載物取り扱いソリューションが含まれます。'
content_solution:
  tagline: 私たちのソリューション
  title: '釣り対応構成'
  subtitle: 'すべての Paddle Board Overstock フィッシングボートは、お客様固有の釣り用途に合わせて構成できます。'
  list:
    - 'ロッドホルダー取付け — 工場取り付けまたはアフターマーケット取付け対応'
    - 'コンソール位置の魚群探知機/GPS 取付けプレート'
    - 'チャーター・商業事業者向けのベイトウェルまたはライブウェルオプション'
    - '漁獲物取り扱いのためのクーラー/ストレージ構成'
    - '沖合対応能力のための深 V 船体 — 停止時は安定、高速時は滑らか'
    - 'PVC またはハイパロンのチューブオプション — 長時間の紫外線曝露にはハイパロン'
    - 'モデルと用途に応じて 15 HP～115 HP の船外機'
content_segments:
  tagline: フィッシングプロファイル
  title: '事業者種別ごとの<br />インフレータブルフィッシングボートソリューション'
  subtitle: '沿岸のスポーツフィッシングから商業延縄漁まで — 釣り・漁業の運用はそれぞれ異なる船体構成、馬力範囲、デッキレイアウトを必要とします。すべてのボートを、漁業種、水域、作業スタイルに合わせて調整します。'
  items:
    - title: 商業漁業企業
      subtitle: '毎日の漁労、網の操作、漁獲物輸送のためのフリート作業艇'
      description: '商業漁業企業は、網の設置・回収、カゴ漁具の保守、延縄漁、漁獲物輸送のための作業艇を運用しています。これらのボートは海水環境で毎日働き、重い積載、絶え間ないデッキでの取り扱い、長時間の運用に耐えなければなりません。燃費と低メンテナンス性は、フリートの収益性にとって重要です。船舶は、さまざまな海況で乗員が漁具と漁獲物を扱うための安定した作業プラットフォームを提供しなければなりません。'
      features:
        - '網の操作、カゴの積み上げ、魚の保管のためのフラットデッキレイアウト'
        - '低い日々の運用コストのための燃費に優れた 40～115 HP 船外機'
        - '毎日の使用に耐える耐摩耗性のヘビーデューティ ハイパロンチューブ'
        - '頻繁なドックや船舶との接触に対応する強化ラビングストレーク'
        - '作業後の洗浄が容易なセルフベーリングデッキ'
        - '複数艇を運用する事業者向けのフリート価格と一貫した仕様'
    - title: チャーターフィッシング事業者
      subtitle: '多人数の快適性、漁獲物の取り扱い、安全認証済み'
      description: '半日・一日の釣りチャーターを運営する事業者 — 沿岸のリーフフィッシングから沖合の底釣りまで。ボートには、安全認証を取得した乗客用シート、複数のアングラーが立つ十分なデッキスペース、旅の間中エサと漁獲物を新鮮に保つ統合型ライブウェルが必要です。ゲストの快適性は、ツアーのレビュー、リピート予約、オンライン評価に直接影響します。'
      features:
        - '衝撃吸収バケットシート付きコンソールステアリング'
        - '工場取り付けロッドホルダー（4～8 ポジション）'
        - '沖合巡航速度のための 60～115 HP 船外機'
        - '商業乗客運用のための CE カテゴリー C または B 認証'
        - '長時間のトリップでのゲストの快適性のためのビミニまたは T-top 日よけ'
    - title: 小規模・伝統的漁師
      subtitle: 日々の生計を支える信頼できる作業艇
      description: '船を主要な収入源とする独立した漁師 — 沿岸で網を仕かけ、魚カゴを世話し、手釣りをする人々。優先事項は燃費の良さ、自分で行える簡単なメンテナンス、そして安定性を犠牲にせずに適度な漁獲物と漁具を積めるボートです。'
      features:
        - '低運用コストのための燃費に優れた 15～40 HP 船外機'
        - '優れた耐 UV 性・耐摩耗性のためのハイパロン CSM チューブ'
        - '網の操作と魚の保管のためのフラットデッキレイアウト'
        - 'インフレータブルキール保護付きでビーチ着岸が容易'
    - title: 漁業協同組合
      subtitle: '漁獲物の集荷、組合員の輸送、物資の配給'
      description: '漁業協同組合は、組合員漁師からの漁獲物の集荷、遠隔の漁村への物資輸送、市場への水揚げの配給のために、コミュニティベースのフリートを運用しています。これらの作業艇には、高い積載能力、毎日の信頼できる運用、遠隔地での容易なメンテナンスが必要です。協同組合は部品の入手性やサービスアクセスが限られる発展途上地域で運用されることが多く、単純な船外機構成と耐久性の高い構造が不可欠です。'
      features:
        - '漁獲物と物資の輸送に対応する高い積載能力'
        - '現場での整備が容易なシンプルな船外機構成'
        - '予算の柔軟性のためのヘビーデューティ PVC またはハイパロン構造'
        - '積載物を固定するタイダウンポイント付きフラットデッキ'
        - '協同組合の運用コストを最小化する燃費の良い運用'
    - title: スポーツ・ゲームフィッシング愛好家
      subtitle: 本格アングラーのための性能とスタイル
      description: '遠方の釣り場への速さ、安定した立ち込みファイトポジション、プレミアムな仕上がりを提供する優れたフィッシングプラットフォームを求める経験豊富なアングラー。2 マイル沖のリーフまで走る場合も、遠隔の汽水域の奥を探索する場合も、ボートは違和感なく機能しなければなりません。'
      features:
        - '波立ちの多い海での滑らかな走行のための深 V RIB 船体'
        - 'コンソールで配線済みの魚群探知機/GPS マウントプレート'
        - 'リアシートモジュールに統合されたベイトウェルとクーラー'
        - 'ボート/チューブのグラフィックに合わせたカスタム EVA デッキカラー'
    - title: フィッシングガイド・エコツアー事業者
      subtitle: 訪問アングラー向けのガイド釣り体験
      description: '少人数の訪問アングラーを生産性の高い釣り場へ案内するガイド — バードウォッチングやマングローブ探検などのエコツーリズム要素と釣りを組み合わせることも多い。ボートは、小型ボートに慣れていないゲストのために濡れずに快適に走り、乗り降りが容易で、日よけオプションを備えていなければなりません。'
      features:
        - '工場取り付けのビミニトップまたは T-top 取付けポイント'
        - '再乗船が容易なスムースエントリー乗降ラダー'
        - '騒音を最小限に抑える静かな 4 ストローク船外機'
        - 'ゲストの電話、財布、カメラ用のドライストレージコンパートメント'

