rd_services:
  tagline: カスタム R&D
  title: パートナー向け R&D サービス
  services:
    - title: カスタム材料開発
      desc: お客様の運用環境と性能目標に合わせた、カスタム生地配合、ラミネートスタック、接着システムを開発します。
    - title: OEM / ODM 製品エンジニアリング
      desc: コンセプトスケッチから生産可能なエンジニアリングパッケージまで — 当社チームは、お客様のブランドでボートを設計、試作、検証できます。
    - title: 第三者テスト・認証
      desc: ISO 準拠の当社テスト施設を、独立した材料テスト、製品検証、認証サポートにご活用ください。
  cta: R&D のご要望を相談する →
  cta_link: /contact

vision:
  tagline: 私たちのビジョン
  title: ウォータースポーツの未来を形づくる
  body: Aquafarer は、継続的なイノベーション、揺るぎない品質、安全性とサステナビリティへの確固たるコミットメントを通じて、インフレータブルボート・SUP 業界をリードすることを目指しています — そして最終的に、世界中のウォータースポーツ愛好家の体験を豊かにします。Aquafarer の R&D センターは、情熱とイノベーションが出会う場所であり、ウォータースポーツ業界に新たな標準を打ち立てています。

labs_section:
  tagline: ラボ
  title: 当社のラボ
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC 生地ラボ
      description: 海洋環境での長期的な信頼性を確保するため、PVC およびハイパロンチューブ生地の引張強度、耐 UV 性、耐摩耗性、低温柔軟性を継続的に研究・テストしています。
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: 船体エンジニアリングスタジオ
      description: HDPE、アルミ、グラスファイバー船体の CAD 駆動設計と有限要素解析。すべての船体は、最初の試作が作られる前に、応力分布と耐衝撃性のデジタルシミュレーションを受けます。
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF 溶接センター
      description: 精密な温度・圧力制御を備えた専用の高周波溶接施設で、インフレータブル艇の海洋業界標準を満たす高強度・気密性のシームを生み出します。
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: 流体力学テスト水槽
      description: 社内テスト水槽での縮尺模型テストにより、さまざまな積載および海況条件にわたって船体形状、滑走性能、安定性、燃費を最適化します。
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: プロトタイプワークショップ
      description: 新しいモデルの建造、艤装、海上試験が行われる実規模の試作・艤装施設。すべてのプロトタイプは、生産承認前に最低 20 時間の水上テストプログラムを受けます。
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: 品質・検査ラボ
      description: 引張テスト、気密サイクルテスト、シーム剥離テスト、材料認証を実施する専用の品質保証ラボ。工房から出るすべてのボートが、公表された仕様を満たすことを確実にします。
      href: /randdcenter/quality-inspection-lab
