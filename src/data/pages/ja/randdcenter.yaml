hero:
  tagline: R&D センター
  title: R&D センター
  subtitle: 進化を追求する

intro:
  - Aquafarer の研究開発（R&D）センターは、ウォータースポーツ器材に革命を起こすという私たちのミッションを推進する原動力です。インフレータブル スタンドアップパドルボード（SUP）とボートにおける絶え間ないイノベーションを通じて、世界中のウォータースポーツ愛好家に、より安全で、より快適で、より楽しい製品をお届けします。エンジニア、デザイナー、そしてウォータースポーツに情熱を持つ専門家からなる専任チームが、業界の未来を形づくり、品質、性能、サステナビリティの水準を高め続けています。
  - 当社の R&D 施設には、材料科学者、造船設計者、生産エンジニアが同一の屋根の下に集まっています。生地の配合から船体シミュレーション、溶接プロセスの開発、実規模の海上試験まで、製品開発のすべての段階がデータに基づいて進められ、テストによって検証されます。

mission:
  tagline: 私たちのミッション
  title: ウォータースポーツの未来を革新する
  pillars:
    - icon: lightning
      title: 技術の進歩
      desc: 優れた製品性能と長寿命のために、新しい材料、デザイン、製造を開拓します。
    - icon: design
      title: ユーザー中心のデザイン
      desc: 人間工学に基づく直感的な製品デザインを通じて、ユーザーのニーズを深く理解し、それを超えます。
    - icon: globe
      title: 持続可能な取り組み
      desc: 環境に配慮した材料とプロセスの活用により、環境負荷を最小限に抑えます。
    - icon: shield
      title: 妥協なき安全性
      desc: 厳格なテストと認証を通じて、最高の安全基準を確保します。

pillars:
  - title: 技術の進歩
    desc: 優れた製品性能と長寿命を実現するために、新しい材料、デザイン、製造プロセスを開拓します。
    icon: tech
  - title: 先進材料
    desc: 製品特性の向上のため、最先端の PVC、ハイパロン、複合材料、持続可能な代替材料を研究しています。
    icon: materials
  - title: サステナビリティ
    desc: '中核的なコミットメント：持続可能な製造とリサイクル可能な材料を通じて、環境管理に取り組んでいます。'
    icon: sustainability

capabilities:
  tagline: 取り組み分野
  title: R&D の主要分野
  subtitle: 原材料の研究から最終認証まで、製品開発をエンドツーエンドで管理できる 4 つの中核分野。
  groups:
    - title: 材料科学・生地テクノロジー
      items:
        - PVC およびハイパロンの配合分析と最適化
        - UV 安定化、難燃性、抗菌添加剤の開発
        - 多層生地ラミネーションと接着エンジニアリング
        - 促進劣化テスト（UV、熱、湿度、塩水噴霧）
    - title: 船体エンジニアリング・流体力学
      items:
        - パラメトリック 3D 船体設計と CFD 最適化
        - 構造荷重および衝撃荷重のための有限要素解析
        - 縮尺模型の曳航水槽テストと性能検証
        - 特殊ミッションプロファイルのためのカスタム船体開発
    - title: 溶接・接合技術
      items:
        - RF 誘電溶接プロセスの開発と最適化
        - 熱風、熱くさび、超音波溶接などの手法
        - 接着剤による接合とシームテープの認定
        - 溶接強度のモデリングと寿命予測
    - title: テスト・認証・コンプライアンス
      items:
        - 品質管理と CE コンプライアンステスト
        - 独立した第三者テストと認証サポート
        - 調達認定のためのカスタムテストプロトコル開発
        - 使用中の故障分析と根本原因調査

