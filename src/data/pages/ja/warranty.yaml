label: '保証'
headline: 'Paddle Board Overstock メーカー限定保証'
subtitle: 'Paddle Board Overstock は、製造するすべてのインフレータブル海洋製品の品質に責任を持ちます。本限定保証は、お客様の Paddle Board Overstock 製品に関する条件と補償内容を定めるものです。'
seo:
  headline: 'Paddle Board Overstock インフレータブルボート保証 — 5 年限定保証 | Paddle Board Overstock'
  description: 'Paddle Board Overstock は、主要チューブ生地、シーム、グラスファイバー船体の構造健全性に対し 5 年間の限定保証を提供します。膨張バルブおよび工場取り付けアクセサリーも対象。Paddle Board Overstock インフレータブルボート保証の完全な規約。'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    本限定保証は、Paddle Board Overstock または正規 Paddle Board Overstock 販売店・小売店から直接購入された、Paddle Board Overstock ブランドの新品インフレータブル海洋製品に適用されます。有効期間の起算日は、確認可能な当初の小売購入日です。
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">保証内容と保証期間</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年間</h3>
        <p class="text-sm text-gray-600 mt-1">主要チューブ生地の健全性（CSM/PVC）</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年間</h3>
        <p class="text-sm text-gray-600 mt-1">グラスファイバー船体の構造健全性</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年間</h3>
        <p class="text-sm text-gray-600 mt-1">インフレータブルチューブシームの気密保持能力</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 年間</h3>
        <p class="text-sm text-gray-600 mt-1">膨張バルブの機能</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 年間</h3>
        <p class="text-sm text-gray-600 mt-1">工場取り付けのアクセサリーおよび補助部品</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 年間*</h3>
        <p class="text-sm text-gray-600 mt-1">商用・レンタル・フリート利用 — すべてのコンポーネント</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*商用、政府、チャーター、レンタル、研修での使用の場合、保証は 1 年間に短縮されます。レースや競技での使用は、保証を完全に無効にします。</p>
  </div>

  <h2>保証の対象</h2>
  <h3>主要チューブ生地（5 年間）</h3>
  <p>Paddle Board Overstock は、運用に必要な空気圧の維持能力を実質的に損なう透過性の劣化に対して、主要チューブ生地を保証します。これは、CSM（ハイパロン）コーティング生地、および製造に使用されるその他すべてのチューブ生地に適用されます。</p>

  <h3>グラスファイバー船体の構造健全性（5 年間）</h3>
  <p>グラスファイバー強化プラスチック（FRP）船体を備えた製品については、材料または仕上がりの欠陥に起因する構造破損に対して、基本的な複合構造を保証します。</p>

  <h3>インフレータブルチューブシームの気密保持能力（5 年間）</h3>
  <p>製造時に接合されたインフレータブルチューブのシームは、シームを通じて重大な空気漏れを引き起こす製造上の欠陥に対して保証されます。定期的な点検と適切な空気圧の維持は、保証適用の条件です。</p>

  <h3>膨張バルブの機能（5 年間）</h3>
  <p>当初 Paddle Board Overstock が取り付けた空気膨張バルブは、設計どおりに空気を保持できない原因となる、材料または仕上がりの製造上の欠陥に対して保証されます。</p>

  <h3>工場取り付けアクセサリー（1 年間）</h3>
  <p>Paddle Board Overstock が製造し、工場で当初から取り付けられたコンポーネントおよび部品は、材料および仕上がりの欠陥に対して 1 年間保証されます。サードパーティ製品は対象外であり、それぞれの製造者保証のみが適用されます。</p>

  <h2>保証の対象外</h2>
  <ul>
  <li>変色、シミ、褪色、チョーキングなど、あらゆる外観の変化を含む外観上の欠陥</li>
  <li>パンク、切り傷、裂け、破れ、その他の物理的損傷</li>
  <li>クレイジング、ひび割れ、摩耗、擦れ、摩擦や接触による劣化</li>
  <li>紫外線への暴露、風化、大気条件による劣化</li>
  <li>燃料、溶剤、酸、アルカリ、薬品との接触による損傷</li>
  <li>不注意、不適切な使用、乱用、事故、通常の摩耗による損傷</li>
  <li>ゲルコートまたは塗料表面の問題（ブリスター、クレイジング、変色、褪色）</li>
  <li>衝撃、応力、不適切な支持、トレーラー輸送による損傷</li>
  <li>不適切な膨張・収縮、または承認されていない膨張装置の使用による損傷</li>
  <li>サードパーティの機器、コンポーネント、システム（それぞれの製造者が保証）</li>
  </ul>

  <h2>製造者の義務と救済</h2>
  <p>Paddle Board Overstock の唯一かつ排他的な義務は、材料または仕上がりの欠陥があり本保証の対象と判断されたコンポーネントを、Paddle Board Overstock の選択により修理または交換することです。修理または交換は、Paddle Board Overstock またはその指定の正規サービス拠点によって実施されます。修理または交換されたコンポーネントの保証は、当初の保証期間の残存期間に限られます。</p>

  <h2>保証の条件</h2>
  <ul>
  <li><strong>登録：</strong>製品は、保証規定に定められたとおりに正しく登録されている必要があります。</li>
  <li><strong>メンテナンス：</strong>製品は、定期的な点検および適切な空気圧の維持を含む、Paddle Board Overstock の公表ガイドラインに従って保守されている必要があります。</li>
  <li><strong>協力：</strong>購入者は、保証請求に関するすべての事柄について、Paddle Board Overstock に完全かつ迅速に協力する必要があります。</li>
  <li><strong>当初の購入者：</strong>本保証は、当初のエンドユーザー購入者のみを対象とし、譲渡できません。</li>
  </ul>

  <h2>商用利用</h2>
  <p>製品が商用、政府、非営利、チャーター、レンタル、研修、または私的レジャー以外の目的で使用される場合、すべてのコンポーネントの保証期間は、当初の小売購入日から 1 年間に短縮されます。レース、速度競技または耐久競技での使用は、保証を直ちにかつ取消不能に完全に無効にします。</p>

  <h2>保証請求の方法</h2>
  <p>購入証明書と問題の詳細な説明を添えて、Paddle Board Overstock または正規販売店にご連絡ください。Paddle Board Overstock が請求内容を確認し、点検およびサービスの手順をご案内します。</p>
  <p>保証サービスについてのお問い合わせは、注文番号と製品情報とともに、<a href="/contact" class="text-sky-600 underline">お問い合わせページ</a>からご連絡ください。</p>

  <h2>サードパーティ製品</h2>
  <p>サードパーティが製造した機器、コンポーネント、またはシステム（Paddle Board Overstock が取り付けたものであっても）は、それぞれの製造者が提供する保証のみが適用されます。Paddle Board Overstock は、このようなサードパーティ製品に対する保証責任を明示的に否認します。</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    本保証書は、Paddle Board Overstock メーカー限定保証の完全版の要約です。すべての保証条項および条件は、完全版の法的保証文書が規定します。仕様は予告なく変更される場合があります。Paddle Board Overstock は、Paddle Board Overstock 青島製造ハブの工場ブランドです。
  </p>
