content_segments:
  tagline: 学校プロフィール
  title: "プログラムタイプ別のウォータースポーツ教育ソリューション"
  subtitle: パドルスクール、サーフィンアカデミー、大学プログラム、フランチャイズ運営者はそれぞれ、カリキュラムの統合から複数拠点のフリートの標準化まで、さまざまな運営上の課題に直面しています。教育モデルに合わせて機器パッケージを構成します。
  items:
    - title: 独立系の SUP & カヤック スクール
      subtitle: オーナー運営のトレーニングセンター
      description: オーナーインストラクターが運営する中小規模のスクールで、SUP レッスン、カヤック トレーニング、認定コースを提供しています。機器は、毎日の教育用途に十分な耐久性があり、中小企業の予算内で手頃な価格であり、単一のフリートで初心者から中級者まで対応できるほど多用途である必要があります。
      features:
        - "初心者レッスン向けの安定したオールラウンド SUP ボードとレクリエーション カヤック"
        - "水上からのコーチングに最適な安定性を高めたインストラクター専用ボード"
        - "レッスンプランのテンプレートとスキルアップガイド付き"
        - "下取り割引付きの年間機器更新プログラム"
    - title: 大学およびカレッジのレクリエーション プログラム
      subtitle: 大規模な学生レクリエーション船団
      description: 大学のレクリエーション部門は、キャンパス レクリエーションの一環としてパドル クラブ、レンタル プログラム、教育コースを運営しています。用具は学期中に使用のピークに直面し、簡単なチェックイン/チェックアウト システムが必要で、初めての学生から上級パドラーまでのさまざまなスキル レベルに耐える必要があります。
      features:
        - "教育機関での使用サイクルに対応した高耐久 PVC 構造"
        - "スキルレベル別にカラーコード化されたフリートで管理が容易"
        - RFID またはステッカーベースの在庫管理システムとの互換性
        - "学期ベースの発注と支払条件付きのまとめ買い価格"
    - title: "サーフ スクール & サーフィンアカデミー"
      subtitle: 海岸サーフィン指導プログラム
      description: 海洋環境で SUP サーフィン、プローン パドル、サーフ カヤックのスキルを教えるサーフ スクール。用具は、耐衝撃性、砂や海水への耐性、1時間ごとのレッスン間の簡単な洗い流しと返却など、サーフゾーンの条件に対応する必要があります。
      features:
        - "強化レールと耐衝撃構造を備えたサーフ専用シェイプ"
        - "生徒の安全のためのソフトフィンとコイルリーシュのオプション"
        - "すぐに水洗いでき、レッスンの合間に乾く生地"
        - "シーズン終了時の点検と更新を含むフリート交換プログラム"
    - title: フランチャイズおよび複数拠点チェーン
      subtitle: 拠点全体で標準化された機器
      description: 複数拠点のオペレーターが、複数の都市または地域にわたって標準化されたトレーニング プログラムを実行しています。拠点間でのフリートの一貫性が最も重要です。どのフランチャイズの店舗を訪れても、すべての学生が同じ機器の経験を積む必要があります。一元的な注文、ブランドの統一性、およびスケーリングのサポートが不可欠です。
      features:
        - "すべてのフランチャイズ拠点で同一のフリート仕様"
        - "ボリュームディスカウントによる一元化された統合発注"
        - 'コーブランディングオプション：フランチャイズブランド + Paddle Board Overstock コーブランディング'
        - '新拠点オープンキット：機器・サイン・開業在庫'
