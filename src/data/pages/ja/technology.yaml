testimonial:
  quote: "Aquafarer を他社と分けるのは材料科学です。部品を組み立てるだけでなく — PVC コンパウンド、溶接パラメータ、構造レイアップを社内でエンジニアリングしています。その垂直統合は完成品に表れています。"
  author: David Park
  title: 製品開発マネージャー
  company: Bluewater Sports Equipment
  location: オーストラリア

sections:
  - title: ドロップステッチコア
    standard: 12～15 PSI の稼働圧力
    description: 何千本もの内部ポリエステル糸が上下の層を接続し、12～15 PSI で剛性のある構造を作ります。これはプロフェッショナルパドルボートやインフレータブルレーシングボートで使われるのと同じテクノロジーです。当社のドロップステッチ密度は、剛性と重量の理想的なバランスのためにモデルごとに最適化されています。
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS コア図
  - title: マリングレード PVC
    standard: 溶融溶接 | UV・海水・摩耗テスト済み
    description: 海洋環境定格の多層ラミネート PVC 生地。各層は接着ではなく溶融溶接され、剥離のリスクを排除します。耐 UV 性（ASTM G154、1,000 時間以上）、海水腐食（ISO 9227）、摩耗（ASTM D751）についてテスト済みです。
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC 層
  - title: ハイパロンチューブ
    standard: 'CSM ゴム | 耐 UV・耐薬品性・極端な温度に対応'
    description: RIB モデルに使用されるハイパロン（CSM）ゴムは、標準的な PVC と比べて優れた耐 UV 性・耐薬品性を提供します。ハイパロンチューブは極端な温度でも柔軟性を保ち、燃料や油への曝露による劣化に抵抗します。すべてのシームは認定技術者によって手作業で施工されます。
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: ハイパロン
  - title: エアデッキフロア
    standard: 高圧インフレータブル | ベニヤ/アルミの代替
    description: 従来のベニヤやアルミのスラットフロアに代わる高圧インフレータブルフロアシステム。組み立て時間、総重量、収納体積を削減しながら、立ち上がり、釣り、歩行に十分な剛性を提供します。200 kg 以上の分散荷重に対応することをテスト済みです。
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: エアデッキ

