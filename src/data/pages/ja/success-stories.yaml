hero:
  tagline: 成功事例
  title: <br />水ビジネスビルダーの実際の成果
  subtitle: 世界中のクラブ、リゾート、起業家が、Aquafarer の機器とサポートを利用して、収益性の高いウォーター スポーツ事業をどのように構築したかをご覧ください。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer のお客様の成功事例
stories:
  - title: 地中海のリゾートが収益性の高い SUP レンタル ビジネスを構築した方法
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5 つ星のビーチリゾート — ギリシャ
    problem: このリゾートは、満足度スコアを向上させ、新たな収益源を生み出すために、ゲスト向けのプレミアム ウォーター アクティビティを必要としていましたが、設備、安全インフラ、スタッフの専門知識が不足していました。
    solution: アクアファーラーは、リゾートのカラーとロゴが入ったカスタムブランドのSUPボード50台、ライフガードステーションとブイラインを含む完全な安全システム、機器の取り扱い、ゲストへの指導、安全プロトコルを含む3日間のスタッフトレーニングプログラムを提供しました。
    result:
      - "稼働初月から週300件以上のゲストアクティビティ予約"
      - 'ウォーターアクティビティのゲスト満足度スコア：4.8/5'
      - '新規の年間副収入：18万ドル'
      - "初稼働シーズンは安全事故ゼロ"
      - "機材交換コスト、前のサプライヤー比で40%削減"
    quote:
      text: Aquafarer はボードを提供するだけでなく、完全なゲスト エクスペリエンスの構築を支援してくれました。私たちのウォーター スポーツ プログラムは、ゼロから 1 シーズンでリゾートのハイライトにまで成長しました。
      author: リゾート総支配人
    cta_text: "リゾートソリューションを構築"
    cta_href: /solutions/resorts
  - title: オーストラリアのスタートアップ企業が 90 日間で水ブランドを構築した方法
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: 初めての起業家 — オーストラリア
    problem: あるアウトドア愛好家は、オーストラリア市場向けに独自の SUP ブランドを立ち上げたいと考えていましたが、製造経験がなく、サプライヤーとの関係もなく、資本も限られていました。
    solution: Aquafarer のブランド立ち上げパッケージでは、製品選択のコンサルティング、カスタムのロゴとカラー デザイン、ハング タグ付きのブランド小売パッケージ、CE 認証文書、シドニーへの FOB 発送が提供されました。
    result:
      - "最初の連絡から75日で200枚のボードを初出荷"
      - "到着から2週間以内にShopify + Amazon AUでブランドを展開"
      - "初回在庫は45日で完売"
      - '平均マージン：小売価格の55%'
      - '第2回目注文：ローンチ後60日以内に500台を発注'
    quote:
      text: ブランドのアイデアはありましたが、製造の知識はゼロでした。 Aquafarer は、適切な基板設計の選択から最初の出荷品の開梱に至るまで、文字通りプロセス全体を通して私の手を握ってくれました。夢から出産まで90日。
      author: オーストラリアのSUPブランド創設者
    cta_text: "ブランドを立ち上げる"
    cta_href: /solutions/entrepreneurs
  - title: タイのビーチクラブがボードの数を 10 人から 80 人に拡張した方法
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: ウォーター スポーツ クラブ — タイ
    problem: プーケットのビーチサイドの小さな SUP クラブは、趣味の運営から観光客向けの専門的なレンタル ビジネスまで拡大する必要がありましたが、一貫した品質と価格を備えた信頼できる機器サプライヤーを見つけることができませんでした。
    solution: Aquafarer のクラブ スターター パッケージ (ボード 10 枚、パドル、安全装備、ブランディング) から始まり、クラブは 18 か月にわたるプレミアム パッケージ プログラムを通じて成長しました。
    result:
      - 18か月間でボードを10枚から80枚へ拡大、品質と価格は一貫
      - "同じサプライヤーでカヤックとペダルボートのレンタルを追加"
      - "クラブ独自のブランディングで観光客への認知度が向上"
      - "メンテナンスコスト、従来の格安機材比で60%削減"
      - "ピーク時には1日150件以上のレンタルを提供"
    quote:
      text: Club Starter Package は完璧なエントリーポイントでした。当社のビジネスが成長するにつれて、Aquafarer も当社とともに成長しました。同じ品質、同じ価格で、驚くべきことではありません。
      author: クラブオーナー、プーケット
    cta_text: "クラブパッケージを始める"
    cta_href: /solutions/clubs
  - title: カリビアンリゾートチェーンはどのようにして 5 つの施設でウォーター スポーツを標準化したか
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: リゾート チェーン — カリブ海
    problem: 5 つの施設を持つ高級リゾート チェーンでは、一元的な調達と季節ごとの交換計画により、すべての拠点で一貫したウォーター スポーツ用品の品質とブランド化が必要でした。
    solution: Aquafarer は、統一されたブランド、共有のスペアパーツ在庫、ボリューム価格による年間交換スケジュールを備えた 300 台の SUP と 100 台のカヤックからなる複数の不動産フリートを納入しました。
    result:
      - 5つの施設すべてでゲスト体験を統一
      - "購買の統合とボリューム価格により30%のコスト削減"
      - "部品在庫の一元管理によりダウンタイムを80%削減"
      - "毎年の機材更新プログラムでシーズン末の駆け込みを解消"
      - "ウォータースポーツへのゲスト参加率が前年比45%増"
    cta_text: "リゾートプログラムを設計"
    cta_href: /solutions/resorts
