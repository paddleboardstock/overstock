hero:
  tagline: 生産能力
  title: 製造能力と年間生産量
  subtitle: 12,000 m² の施設で年間 15,000 隻を生産、拡張の余地あり

intro: Aquafarer は中国・青島において、インフレータブルボート専用の最大級の製造施設を運営しています。12,000 m² の工場は 6 つの専門ワークショップが並列稼働しており、SUP、カヤック、ディンギー、RIB、安全装備の各ラインで年間 15,000 隻を生産する能力を備えています。

highlights:
  - value: 12,000 m²
    label: 総製造床面積
    detail: 6 つの専門ワークショップ
  - value: 15,000
    label: 年間ボート生産数
    detail: SUP、カヤック、RIB、ディンギー、安全装備
  - value: 200-300
    label: 熟練した労働力
    detail: 25 名以上のエンジニア、1 日 2 シフト
  - value: 50+
    label: 輸出先国
    detail: EU、米国、豪州、中東、アジア
  - value: 30–45
    label: 標準リードタイム（日）
    detail: PO 確定から FOB まで
  - value: 10+
    label: 輸出経験年数
    detail: 2012 年より

workshops:
  - title: SUP ボート生産
    description: 'インフレータブル SUP ボート向けの 4 つの並列組立ライン。各ラインは 1 シフトあたり 50～80 枚のボードを生産可能です。デジタル印刷とスクリーン印刷のステーションが同時に稼働します。年間 SUP 生産能力：8,000 枚以上。'
    output: '年間 8,000 枚以上の SUP'
  - title: RIB ボート生産
    description: '7.6 m までの RIB 船体に対応する 6 基の金型ステーションを備えた専用グラスファイバー船体ワークショップ。チューブ溶接・組立エリアでは 3～5 隻の RIB を同時に扱えます。年間 RIB 生産能力：2,000 隻以上。'
    output: '年間 2,000 隻以上の RIB'
  - title: インフレータブルボートとディンギー
    description: 'インフレータブルボート、カヤック、ディンギー向けの多目的生産ライン。熱風溶接ステーション、RF 誘電プレス、組立ワークステーションは受注構成に応じて再構成されます。年間生産能力：5,000 隻以上。'
    output: '年間 5,000 隻以上'
  - title: 安全装備
    description: 'ライフジャケットと安全装備のための独立したクリーンルーム生産エリア。専用の縫製、フォーム挿入、検査ステーションを備えています。年間ライフジャケット生産能力：50,000 枚以上。'
    output: '年間 50,000 枚以上のライフジャケット'

oem_capacity:
  moq: 'SUP: 5～10 隻 | RIB: 2～5 隻 | カヤック/ディンギー: 10～20 隻 | カスタム金型: 200 隻以上'
  lead_time: '標準 30～45 日。サンプル 15～20 日。特急対応可能。'
  payment: 'T/T 前払い 30% + 出荷前 70%。L/C、Western Union に対応。'
