why_us:
  - title: 垂直統合
    description: 工場、金型、サプライチェーンを自社で所有 — 仲介者も下請けもいません。そのため品質、コスト、納期をコントロールできます。
  - title: 二重認証
    description: ISO 9001 品質マネジメントと BSCI 社会的コンプライアンス認証。工場監査報告書はリクエストに応じて提供します。
  - title: CE 準拠
    description: すべての標準モデルが CE 2013/53/EU 認証を取得。カスタムモデルも当社の確立されたプロセスで CE 認証を取得できます。
  - title: 低 MOQ
    description: 標準モデルは 5 台から始められます。台数に無理のない形で新興ブランドの立ち上げを支援します。
