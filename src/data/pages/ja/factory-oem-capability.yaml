hero:
  tagline: OEM/ODM 製造
  title: OEM・プライベートブランド製造
  subtitle: コンセプトからコンテナまで — インフレータブル水上艇ラインのあらゆる詳細をカスタマイズ

intro: Aquafarer は、世界中のブランド、ディストリビューター、政府機関に包括的な OEM・ODM サービスを提供しています。10 年以上の輸出経験と 12,000㎡ の ISO 9001・BSCI 認証工場を持ち、製品設計と金型開発から本格生産、パッケージング、物流まですべてを担当します。

highlight:
  - value: 10+
    label: OEM 経験年数
    detail: 2012 年以降
  - value: 50+
    label: 輸出国
    detail: グローバルなリーチ
  - value: 200+
    label: 納入済みカスタムプロジェクト
    detail: 全製品ライン
  - value: 30–45
    label: 標準リードタイム（日）
    detail: PO から FOB まで

services:
  - title: 製品設計・エンジニアリング
    description: 社内 R&D チームがお客様のコンセプトや仕様をもとに、CAD 図面、3D モデル、試作品を開発します。金型設計、船体形状の最適化、素材選定のガイダンスも提供します。
  - title: カスタムブランディング・グラフィック
    description: フルカラー デジタル印刷、シルクスクリーン、エンボス、ラベルのオプション。ブランド専用のデッキグラフィック、チューブブランディング、店頭対応パッケージを開発します。
  - title: 素材・仕様のカスタマイズ
    description: PVC（標準、エコ、難燃）、ハイパロン/CSM、ドロップステッチ、ハイブリッド構造から選択できます。カスタムチューブカラー、生地重量、補強オプションに対応。
  - title: パッケージング・物流
    description: カスタム小売パッケージ、プライベートブランド箱、真空パック、パレタイズ、コンテナ積み込み。FOB 青島、CIF、DDP の出荷条件に対応します。

