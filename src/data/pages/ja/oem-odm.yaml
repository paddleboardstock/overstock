process_steps:
  title: 6ステップOEM/ODMプロセス
  subtitle: デザインブリーフから青島FOBまで — スムーズなワークフロー
  steps:
    - number: '01'
      title: デザインブリーフと3D CADモデリング
      description: 目標仕様、参考製品、またはコンセプトを共有してください。私たちのエンジニアリングチームは、お客様の承認のために詳細なCAD図面と3Dレンダリングを作成します。
      timeline: 3～5日
    - number: '02'
      title: 材料選定と生地試験
      description: 軍用グレードのPVC（0.9–1.2 mm）、Hypalon CSM、またはdrop-stitchコア生地から選択してください。引張強度、コーティング密着性、およびUV安定性の試験を行います。
      timeline: 2～3日
    - number: '03'
      title: ラピッドプロトタイピングとサンプル生産
      description: 私たちはCNCマシンでカスタム金型を作り、ブランドの色、ロゴ、指定された材料で試作品を製造します。承認のためにサンプルを発送します。
      timeline: 7～14日
    - number: '04'
      title: 24〜48時間高圧保持試験
      description: 各プロトタイプは、定格圧力の1.25倍で厳格な圧力保持試験を受けます。シーム剥離試験および寸法確認も行われます。
      timeline: 1〜2日
    - number: '05'
      title: CE/ISO 品質検査と梱包
      description: 100ポイント品質チェックリスト。すべてのユニットは小売準備包装前に検査されます。CE適合宣言およびBSCI適合報告書が含まれています。
      timeline: 2～3日
    - number: '06'
      title: FOB青島出荷・物流
      description: 完成品はパレットに積まれ、シュリンクラップで梱包され、青島港でコンテナに積み込まれました。完全な輸出書類、通関手続き、リアルタイム追跡が可能です。
      timeline: 7～14日
