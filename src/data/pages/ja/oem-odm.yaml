faq:
  title: OEM/ODM — よくある質問
  questions:
    - q: カスタムインフレータブルSUPsの最小注文数量（MOQ）はいくらですか？
      a: 既存の金型を使用した標準モデルでは、MOQ はデザインあたり5～10ユニットから始まります。完全にカスタムの金型および工具の場合、MOQ は通常200ユニットです。私たちはスタートアップや新興ブランドと協力して、実現可能な参入ポイントを見つけます。
    - q: カスタム RIB ボートの MOQ はいくらですか?
      a: 既存の金型を使用するRIBモデルは、デザインごとに2～5ユニットから始められますが、完全にカスタムのRIB金型は、より大きなコミットメントが必要です。私たちは、スタートアップや既存ブランドと協力して、実現可能な参入ポイントを見つけます。
    - q: OEMサンプルの処理にはどのくらい時間がかかりますか？
      a: 標準プロトタイプサンプルは、設計承認後7～14営業日以内に完成します。急ぎの注文は、追加料金で5～7日に優先対応することが可能です。
    - q: ゴムボートにおけるPVCとHypalonの違いは何ですか？
      a: PVCはより軽量で手頃な価格であり、優れた寒冷地での柔軟性を提供します。Hypalon（CSM）は、優れたUVおよびオゾン耐性を持ち、寿命も長く（10～15年対5～8年）なります。ほとんどのレクリエーション用途にはPVCを、商業・プロフェッショナル用途にはHypalonをお勧めします。
    - q: インフレータブルの形状やデザインをカスタマイズできますか？
      a: はい。私たちの研究開発チームは、あらゆる船体形状、ボードの輪郭、またはチューブ構成に対応するカスタム金型を開発できます。精度と一貫性のために、CNC加工されたアルミニウム金型を使用しています。
    - q: 工場監査サービスを提供していますか？
      a: 私たちは、青島の12,000平方メートルの施設での現地および第三者による工場監査を歓迎します。私たちはISO 9001およびBSCI認証を維持しており、NDAの締結後に監査報告書を共有することができます。
    - q: どのような配送条件を提供していますか？
      a: 私たちはFOB青島（標準）、CIF、DDPの配送条件を提供しています。コンテナ積み込みおよび完全な輸出書類は、すべてのOEM注文に含まれています。
content_profiles:
  tagline: ブランドプロフィール
  title: OEM / 顧客タイプ別のプライベートラベル製造<br />
  subtitle: 異なるブランドのプロフィールにはそれぞれ異なる要件があり、私たちはお客様のビジネスモデル、規模、そして市場投入戦略に合わせてOEM/ODMサービスを調整します。
  items:
    - title: スタートアップの水上船ブランド
      subtitle: 低MOQ、高速立ち上げ
      description: 起業家や創業者が最初のRIBボート、SUPs、またはインフレータブルボートのラインを立ち上げる際に。あなたのブランドを自分のもののように扱う製造パートナーが必要です—低い参入障壁、柔軟なバッチサイズ、そして設計の各段階での実践的なガイダンスを提供します。
      features:
        - MOQはSKUあたりわずか2～5ユニット(RIB) / 5～10ユニット(SUP)
        - 既存の金型ライブラリにより、金型費用を省く
        - フルブランディングパッケージ：ロゴ、チューブグラフィック、パッケージ、ハングタグ
        - サンプル最初のワークフロー — 本番前に承認
    - title: 設立されたマリンブランド
      subtitle: OEM は CE/ISO の遵守度で評価
      description: 既存のボート、PWC、またはマリンアクセサリーブランドが、ポートフォリオにインフレータブルウォータークラフトを追加しています。生産ロット全体で一貫した品質、世界市場向けの規制遵守、カスタムハルやチューブ形状を共同設計する能力が必要です。
      features:
        - 独自設計のためのカスタム3D金型設計
        - CE 2013/53/EU、UKCA、USCG 適合性文書
        - BSCI 小売業者のコンプライアンスに関する社会的監査報告
        - 専任のアカウント管理 + 優先生産枠
    - title: DTCおよびEコマースブランド
      subtitle: 大規模な小売向けパッケージ
      description: Amazon、Shopify、または自社のウェブストアを通じて販売するオンライン優先ブランド。パッケージング、開封体験、そして一貫した製品の品質が重要です。eコマースの速度と返品率の動向を理解している工場が必要です。
      features:
        - 小売向け箱デザイン + インサートカード印刷
        - コスト効率の高い出荷のための真空パック／パレット積み
        - EAN / UPCバーコードおよび税関対応書類
        - 到着コストを最適化するための混載コンテナの統合
    - title: レンタルおよびホスピタリティ運営者
      subtitle: リゾートやレンタルビジネス向けのフリートグレードのビルド
      description: リゾート、ウォータースポーツセンター、レンタル事業者は、耐久性があり、メンテナンス可能で、一貫したブランドイメージを持つ車両群が必要です。当社は、フリートの価格設定、混合モデルのコンテナ、そして長年の運用に対応する交換部品サポートを提供します。
      features:
        - 混合モデルコンテナ注文のフリート価格設定
        - 耐久性のある商業用グレードのチューブとデッキのオプション
        - 予備部品キットとメンテナンストレーニング
        - SUP、RIB、カヤックの艦隊全体で一貫したブランディング
