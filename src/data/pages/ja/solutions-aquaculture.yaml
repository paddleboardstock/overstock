content_challenge:
  tagline: 挑戦
  title: 水産養殖の需要<br />海水に耐える機器
  subtitle: 養殖場、真珠養殖場、海洋牧場は、長期間の海水への曝露、燃料や飼料の残留物、継続的な日常使用など、最も化学的に攻撃的な海洋環境で運営されています。
  paragraphs:
    - "養殖事業は過酷な沿岸および沖合の環境で年間365日稼働しています。生け簀の検査、飼料輸送、パールラインの保守、機器の整備に使用される作業船は、海水への常時浸漬、紫外線への暴露、燃料・養魚飼料・防汚処理に由来する化学物質との接触にさらされます。"
    - '**腐食は最大の敵です** — 標準的な海洋機器はこうした条件下では急速に劣化します。船外機、トレーラーフレーム、船体金具は絶えず交換が必要です。事業者には、腐食に強い素材で造られ、この環境で何年も劣化せずに耐えられる船が必要です。'
    - '**日々の信頼性が重要です** — 作業船が故障すると、給餌スケジュールの遅延、収穫の遅れ、多大な生産損失につながります。真珠養殖では、検査を1日怠るだけで収穫に重大な損害が生じることがあります。養魚では、給餌の遅れが成長率と収益性に影響します。'
    - Paddle Board Overstock の養殖用 RIB は、耐食性金具、強靭な Hypalon チューブ、強化船体を備え、養魚、真珠養殖、海洋牧場の過酷な条件に特化して設計されています。
content_solution:
  tagline: 私たちのソリューション
  title: 専用RIB<br />水産養殖業界向け
  subtitle: Paddle Board Overstock の水産養殖作業船はすべて、過酷な塩水環境に耐えられるように設計されており、信頼性の高い毎日のパフォーマンスを提供します。
  list:
    - "海洋グレードの Hypalon チューブ — 紫外線、海水、燃料、養魚飼料の化学物質に対する優れた耐性"
    - "船全体に 316 ステンレス鋼製金具 — 長時間の海水暴露でも錆びません"
    - "強化された擦れ止め帯とキールガードにより、桟橋や生け簀との繰り返しの接触に対応"
    - "給餌輸送や収穫作業後の洗浄と排水が容易なセルフベーリングデッキ"
    - "飼料袋、収穫コンテナ、機器を搭載できるフラットデッキ構成"
    - 15～60馬力の船外機構成 — 積載量と燃費のバランスを最適化
    - "大型の養殖場全域で視認しやすい高視認性チューブカラーを選択可能"
content_segments:
  tagline: 水産養殖のプロフィール
  title: ワークボート ソリューション<br />養殖タイプ別
  subtitle: 魚の生簀検査用の機敏な小型 RIB から、真珠養殖用の安定した輸送プラットフォーム、海洋養殖用の頑丈な作業船に至るまで、水産養殖業によって作業船の要件も異なります。
  items:
    - title: 養殖業
      subtitle: ケージ検査、飼料輸送、収穫サポート
      description: 海洋養殖場は、海岸や沖合の露出した場所で生簀を運営しています。作業船は毎日、生け簀網の検査、給餌作業、収穫支援、設備のメンテナンスなどに使用されています。主な課題は腐食です。ボートは常に海水、魚の餌の残留物、燃料にさらされています。給餌の失敗や収穫の遅れは生産量と収益性に直接影響するため、信頼性の高い作業船が不可欠です。
      features:
        - '過酷環境パッケージ：316 ステンレス鋼製金具、海洋グレード合金部品'
        - "飼料袋と収穫コンテナの輸送に適したフラットデッキレイアウト"
        - "作業後の洗い流しが容易なセルフベーリングデッキ"
        - "飼料や燃料への暴露に対応した耐薬品性コーティングの Hypalon チューブ"
        - "生け簀や桟橋との頻繁な接触に対応する強化擦れ止め帯"
    - title: 真珠養殖事業
      subtitle: パールライン検査・収穫時の安定輸送
      description: 真珠養殖場では、真珠ライン間の毎日の輸送、カキ網の検査、収穫物の収集のために、安定した信頼性の高い作業船が必要です。これらの業務は、メンテナンス インフラストラクチャが限られている遠隔の海岸沿いの場所で実行されます。ボートは、乗組員が真珠ラインを検査する際に作業できるのに十分な安定性があり、簡単に乗船でき、収穫したカキ、網、必需品を運ぶための十分なデッキスペースがなければなりません。遠隔地にある農場では、信頼性とメンテナンスの容易さが重要です。
      features:
        - "パールライン検査時に乗組員が立ち上がれる安定した船体設計"
        - "滑り止め表面のフラットデッキで乗組員の安全な移動を確保"
        - "低フリーボードによりカキ網や収穫作業へのアクセスが容易"
        - "現場での整備が容易なシンプルな船外機構成"
        - "連続的な海水暴露に耐える耐食性チューブ・金具パッケージ"
    - title: 海洋牧場と海洋強化
      subtitle: "稚魚の輸送、ケージの整備、監視サポート"
      description: 海洋牧場経営には、管理された海洋環境への稚魚の放流、成長の監視、強化構造物の整備などが含まれます。作業船は、生きた稚魚を通気コンテナに入れて輸送し、監視装置を搭載し、沿岸の浅い放流場所にアクセスする必要があります。船体の設計では、海岸や河口へのアクセスのための浅い喫水と積載能力のバランスを取る必要があります。
      features:
        - "通気式の稚魚輸送コンテナと監視機器を搭載できるデッキスペース"
        - "浅喫水により浜辺や汽水域の放流場所へのアクセスが可能"
        - "ビーチランディングが容易 — 強化キールと船首保護"
        - "監視電子機器やサンプリング機器を取り付けられる装備マウントポイント"
        - "砂と海水が混在する条件下での耐久性に優れた強靭な Hypalon チューブ"
