workshops_section:
  tagline: ワークショップ
  title: 製造ワークショップ
  workshops:
    - title: PVC 裁断・材料準備
      description: 自動 CNC 裁断機が、PVC、ハイパロン、ドロップステッチ生地をサブミリ精度で加工します。コンピューター最適化されたネスティングが材料ロスを最小化し、すべてのパネルが溶接前に寸法仕様を満たすことを保証します。
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: チューブ溶接・熱溶着
      description: 熱溶着機と RF 誘電プレスを備えた専用溶接ワークショップ。ホットエア熱溶着機が PVC チューブチャンバーを接合・融着し、RF 溶接は ISO 9001 要求を超える高強度の気密シームを生み出します。
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB 船体生産 — グラスファイバー
      description: RIB ボートの船体は、ポリエステルおよびビニルエステル樹脂システムを用いたハンドレイアップのグラスファイバー成形で生産されます。各層は一貫した品質のために手作業でロール仕上げされ、真空バギングされます。ゲルコートスプレーブースが高光沢・耐紫外線の海洋仕上げを提供します。
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP 印刷・装飾
      description: SUP ボードは、フルカラーグラフィックにデジタル印刷、ロゴや反復パターンにスクリーン印刷を用いて装飾されます。デジタルプリンターはフォト品質のデッキデザインを、スクリーン印刷は耐久性のある鮮やかなブランドマークを生み出します。
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: 最終組立・リギング
      description: グラスファイバー船体と PVC チューブを結合し、エンジンを搭載し、操舵・制御系を接続し、電気系統を配線する組立ライン。各ボートは、チームリーダーが署名確認する 100 項目の組立チェックリストに従います。
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: 品質テスト・検査
      description: 完成したすべてのボートは、出荷前に必須の気密保持テスト、シーム剥離検証、全システムチェックを受けます。当社の品質ラボは生産から独立しており、経営陣に直接報告します。
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp

