material_traceability:
  tagline: トレーサビリティ
  title: 材料トラッキング・バッチ管理
  description: すべての原材料バッチに、当社の ERP システム内で一意のロット番号が割り当てられます。入荷から生産、完成製品に至るまで、各ボートの部品表（BOM）は元のサプライヤーバッチに遡ってリンクされます。これにより、品質またはコンプライアンスに関する問い合わせに対して、完全な上流トレーサビリティが可能になります。
  system: カスタム ERP（社内システム）＋各作業オーダーの物理バッチタグ
  coverage: 生産材料の 100% — PVC、ハイパロン、ドロップステッチ生地、接着剤、バルブ、ハードウェア、パッケージング
  records_retained: 10 年間（CE 2013/53/EU 要求による）
  suppliers:
    - material: 海洋グレード PVC
      source: 中国および韓国のサプライヤー
      certified: ISO 9001, REACH, RoHS
    - material: ハイパロン（CSM）
      source: 日本のサプライヤー
      certified: ISO 9001, REACH
    - material: ドロップステッチ生地
      source: 自社織造＋外部パートナー
      certified: 社内 QC＋サプライヤー ISO 9001
    - material: バルブ・ハードウェア
      source: 中国の OEM サプライヤー
      certified: ISO 9001、バッチごとの材料証明書

