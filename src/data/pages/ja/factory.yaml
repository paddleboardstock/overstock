qc_section:
  tagline: 品質管理
  title: テスト・品質保証プロセス
  subtitle: すべてのボートは、出荷前に必須のテストを受けます。当社の品質ラボは生産から独立しており、経営陣に直接報告します。
  steps:
    - step: '1'
      title: 原材料検査
      desc: PVC、ハイパロン、ドロップステッチ生地は、いずれのバッチも生産に入る前に、引張テスト（ASTM D751）、引き裂き伝播、耐紫外線性の検証を受けます。
    - step: '2'
      title: 48 時間気密保持テスト
      desc: すべてのチューブチャンバーを定格圧力の 125% まで膨張させ、48 時間保持します。5% を超える圧力降下は、自動的な不合格およびシーム再検査を引き起こします。
    - step: '3'
      title: 荷重・バランステスト
      desc: 完成したボートは最大定格積載量まで積載され、安定性、乾舷、操縦性がテストされます。各船は最終検査の前に水上テストを受けます。

oem_section:
  tagline: OEM プロジェクト
  title: ブランド・OEM パートナーシップ事例
  subtitle: コンセプトからコンテナまで — グローバルブランドのインフレータブルウォータークラフトラインの立ち上げと拡大を、当社がどのように支援するか。
  cases:
    - challenge: ヨーロッパのアウトドア小売業者が、独自のデッキグラフィック、環境配慮型 PVC、店頭対応パッケージングを備えたプライベートレーベル SUP ラインを必要としていました — すべて 60 日での納品が条件でした。
      solution: カスタムデジタルプリントファイルを開発し、REACH 準拠の PVC を調達し、デザインチームを青島工場に常駐させることでサンプル回数を 3 回から 1 回に短縮しました。
      result: 署名済み PO から FOB まで 55 日。4 SKU で合計 2,400 台。最初のコンテナ到着前にリピート注文を獲得。
    - challenge: 米国のウォータースポーツ系スタートアップが、カスタム船体形状、共同ブランドパッケージング、小売販売のための BSCI 認証を備えた高性能ドロップステッチカヤックを必要としていました。
      solution: 既存のドロップステッチカヤック金型を改良したロッカープロファイルで適合させ、共同ブランドパッケージのアートワークを開発し、完全な BSCI 監査ドキュメントを提供しました。
      result: 米国の大手アウトドアチェーン 3 社での販売に成功。初年度 5,000 台以上、売り切り率 98%。
    - challenge: オーストラリアのディストリビューターが、カスタムチューブカラー、ハイパロングレードアップオプション、オーストラリア規格 AS 1799 準拠を備えた CE 認証済み RIB レンジを必要としていました。
      solution: 4 種類のチューブカラーバリエーションの量産前サンプルを製作し、日本のサプライヤーから CSM ハイパロンを調達し、第三者機関による AS 1799 適合テストを調整しました。
      result: 3 モデルの RIB レンジを AU/NZ 市場で発売。その後、パトロール RIB 12 隻の政府入札を獲得しました。

faq_section:
  tagline: よくある質問
  title: B2B・OEM よくある質問
  questions:
    - q: OEM インフレータブル SUP ボードの最小注文数量（MOQ）はどのくらいですか?
      a: 標準 OEM モデルの MOQ は 5～10 台から始まります。カスタム金型およびプライベートレーベルプロジェクトには、複雑さに応じて最低 200 台が必要です。新規ブランド立ち上げに向けて、トライアル注文およびサンプル生産もご利用いただけます。
    - q: Aquafarer は BSCI 認証を取得していますか?
      a: はい。当社工場は有効な BSCI 社会的コンプライアンス認証を維持しています（監査報告書はリクエストに応じて提供）。さらに品質管理のための ISO 9001:2015 を取得しており、64の製品モデルが CE 認証（TÜV Rheinland）を保有しています。REACH および RoHS コンプライアンス文書は、すべての OEM 出荷に添付されます。
    - q: OEM 注文の標準的なリードタイムはどれくらいですか?
      a: 標準リードタイムは、確定 PO と入金から 30～45 日です。カスタム金型の開発には、治具分として 15～20 日が加算されます。緊急注文や初夏前の繁忙期（1～3 月）には特急生産もご提供します。
    - q: FOB 青島または当社港宛ての CIF で出荷できますか?
      a: はい。FOB 青島、主要グローバル港宛ての CIF、適格パートナー向けの DDP で出荷します。当社のロジスティクスチームが、コンテナ予約、輸出書類、通関を管理します。EU、米国、豪州、アジア市場の 50 か国以上に出荷しています。

b2b_moq: '標準 MOQ: モデルあたり 5～10 台（SUP/カヤック/ドロップステッチ）。RIB の MOQ: 2～5 台。新しいパートナーシップに向けてトライアル注文も歓迎します。'

production_flow:
  tagline: 生産フロー
  title: 材料から完成ボートへ
  subtitle: すべてのボートは、各段階に QC チェックポイントを備えた 6 つの生産段階を通過します。近道も、省略された検査もありません。
  stages:
    - stage: '01'
      title: 材料受入・入荷検査
      description: '入荷するすべての材料は、バッチ／ロット番号で当社の ERP システムに記録されます。PVC 生地ロール、ドロップステッチコア、バルブ、接着剤、ハードウェアは、QC 確認まで隔離されます。'
      qc_check: '引張強度（ASTM D751）、引き裂き抵抗（ISO 4674）、厚さゲージ、接着剤粘度、外観欠陥スキャン'
      qc_threshold: 'すべてのバッチをテスト。引張が仕様の 90% 未満、引き裂きが仕様最小値未満、または外観欠陥がある場合は不合格'
      responsibility: 入荷検査チーム（検査員 3 名）
    - stage: '02'
      title: CNC 裁断・材料準備
      description: 'コンピューター最適化されたネスティングが、PVC 原反の上にパネルを配置してロスを最小化します。自動 CNC 裁断機は 0.1 mm の位置精度を維持します。'
      qc_check: 'CAD DXF ファイルとの寸法チェック、エッジ品質検査、パネル枚数検証'
      qc_threshold: '20 枚ごとにパネルを測定。公差 ±0.5 mm。公差外が 2% を超えるバッチは不合格'
      responsibility: 裁断ワークショップリーダー
    - stage: '03'
      title: 溶接・ドロップステッチ接合
      description: 'ドロップステッチコアは、熱ラミネーションによって外側の PVC ラミネートに接合されます。チューブチャンバーは RF 溶接またはホットエア溶接されます。レールバンドは 3 層融着接合されます。'
      qc_check: '50 台ごとの剥離テスト（ASTM D751）、溶接幅測定、ホットエア温度ログレビュー、バックライト下での目視シーム検査'
      qc_threshold: '剥離強度最小 8 N/cm。溶接幅公差 ±1 mm。目視可能なチャネリングはすべて不合格'
      responsibility: 溶接 QC（シフトあたり検査員 2 名）
    - stage: '04'
      title: 組立・リギング
      description: 'ボートは最終組立に移り、すべてのコンポーネントが組み合わされます：船体＋チューブ、バルブ取り付け、D リング、ハンドル、フィンボックス、キャリーバッグの取付。各ユニットは 100 項目の組立チェックリストに従います。'
      qc_check: 'ユニットごとの 100 項目チェックリスト署名確認、バルブ動作テスト（開閉 10 サイクル）、ハードウェアトルク検証、目視検査'
      qc_threshold: '安全重要項目（バルブ、D リング、ハンドル）はゼロディフェクト方針。軽微な外観欠陥：AQL 2.5（ISO 2859）'
      responsibility: 組立チームリーダー＋ライン QC
    - stage: '05'
      title: 圧力テスト・品質ホールド
      description: 'すべてのチャンバーを定格圧力の 1.25 倍（通常 20～25 PSI）まで膨張させ、24～48 時間保持します。圧力センサーが継続的に記録します。圧力降下が 5% を超えるチャンバーは不合格となり、シーム再検査に回されます。'
      qc_check: '24 時間圧力保持ログ、センサーキャリブレーションの毎日検証、温度補正された圧力読み取り、修理後のシーム再テスト'
      qc_threshold: '安定温度で 24 時間あたりの最大圧力降下 5%。これを超えるチャンバーがある場合、生産バッチ全体の 100% 再テスト'
      responsibility: 品質ラボ（生産から独立、経営陣に直接報告）
    - stage: '06'
      title: 最終検査・梱包
      description: '最終の外観および機能検査。表面欠陥、カラーの一貫性、ラベル／BIN 検証、梱包の完全性、アクセサリーの網羅性を確認します。ユニットは真空梱包され、箱詰めされ、コンテナ積み込みのためにパレタイズされます。'
      qc_check: '完全目視検査、SKU ごとのアクセサリーチェックリスト、梱包落下テスト（1 m、ランダムサンプリング）、ラベル／バーコードスキャン検証'
      qc_threshold: '主要欠陥は AQL 2.5、軽微欠陥は AQL 4.0。安全欠陥はゼロトレランス。すべてのユニットを目視検査'
      responsibility: 最終 QC チーム（検査員 4 名）＋梱包チームリーダー

