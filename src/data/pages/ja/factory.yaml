hero:
  tagline: 工場
  title: 工場と製造
  subtitle: 原材料から完成ボートまで — 12,000㎡ の一貫製造

intro:
  - "**Aquafarer 青島製造ハブ**の工場ブランドとして、Aquafarer は生産のすべての段階を管理します — PVC およびグラスファイバー材料の入荷から、完成ボートの出荷前最終検査に至るまで。青島経済技術開発区に所在する当社の製造施設は 12,000 平方メートルの面積を有し、PVC 裁断、チューブ熱溶着、グラスファイバー RIB 船体生産、SUP デジタル印刷、最終組立、品質テストのための専用ワークショップを擁しています。"
  - 設計、エンジニアリング、試作、製造、テストを一つ屋根の下に統合することで、当社は受託製造の非効率を排除し、造船品質、材料選定、納期への直接管理を維持します。当社のワークショップから出荷されるすべてのボートは、当社の人材が、当社の設備で、当社の基準に従って造られています。

