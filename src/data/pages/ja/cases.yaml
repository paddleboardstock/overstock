hero:
  tagline: 導入事例
  title: '実プロジェクト、実結果<br />— 実践する Paddle Board Overstock'
  subtitle: 'Paddle Board Overstock が世界中のディストリビューター、ブランド、オペレーターとどのようにパートナーシップを組み、あらゆる用途にカスタム海洋ソリューションを届けているかをご覧ください。'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock 導入事例 — カスタム海洋製造プロジェクト
features3_cases:
  tagline: 注目のケース
  title: '実際の課題に対する<br />カスタムソリューション'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'バリ ダイビングセンターの日常運用アップグレード'
      customer: Blue Ocean Diving Center
      country: インドネシア
      industry: 商用ダイビングセンター
      challenge: 'バリの Blue Ocean Diving Center は、デッキスペースが限られ、ダイバーの乗船が困難で、熱帯の海水環境ではメンテナンス負担が大きい、古いグラスファイバー製ダイブボートを運用していました。器材の積み込みは混雑し、準備時間は長く、不安定なプラットフォームは、初心者ダイバーや高齢の旅行者を含む海外観光客に安全上の懸念をもたらしていました。同センターは年間 200 日以上、1 日 3～5 回のダイビングトリップを運営しています。'
      solution: 'Paddle Board Overstock は、スキューバ器材の収納に最適化された拡張デッキレイアウト、幅広のステンレス製ダイブラダー、耐 UV・耐海水性のヘビーデューティハイパロンチューブ、滑り止めデッキ面、タンク収納ソリューションを備えたカスタム 6.8m プロフェッショナルダイビング RIB を納品しました。この構成は、標準的なレジャーボートのレイアウトではなく、ダイビングセンターの日常のワークフローに基づいて設計されています。'
      product: '6.8m プロフェッショナルダイビング RIB'
      results: 'より広い作業エリアにより器材準備の効率が向上。ダイバーはより安全で楽な乗船を体験できました。メンテナンスの必要量は大幅に減少。同センターは、繁忙期により多くの顧客に対応する能力と自信を得ました。この RIB は日常のダイビング運用の基盤となっています。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp'
      quote: '私たちのダイビングボートは単なる移動手段ではありません。日常運用の基盤です。Paddle Board Overstock RIB は、毎日複数のダイビングトリップを運営するチームに大きな自信を与えてくれます。'
      icon: tabler:lifebuoy
    - title: 'プーケットダイブセンターのプロフェッショナル RIB アップグレード'
      customer: Ocean Explorer Diving Center
      country: タイ
      industry: 商用ダイビングセンター
      challenge: 'タイ・プーケットの Ocean Explorer Diving Center は、成長する顧客需要に追いつけない従来のグラスファイバー製ダイブボートからのアップグレードを必要としていました。限られたデッキスペースは器材準備を非効率にし、乗船の難しさは海外観光客に安全上の課題をもたらし、熱帯の海水環境での高いメンテナンス要件が運用コストを押し上げていました。同センターは年間 200 日以上、1 日複数回のトリップを運営しています。'
      solution: 'Paddle Board Overstock は、スキューバタンクの収納、器材準備、ダイバーの移動に最適化された作業デッキレイアウトを持つカスタマイズされた 6.8m 商用ダイビング RIB を納品しました。ステンレス製手すり付きの幅広ダイブラダー、耐 UV 材料を使用したヘビーデューティチューブ構造、滑り止めフロア、タンク収納ソリューション、プロフェッショナルコンソール、乗客用シートを装備 — すべて商用ダイビング運用のために構成されています。'
      product: '6.8m 商用ダイビング RIB'
      results: 'より広いデッキ面積により、器材の整理が速くなり、日常のワークフローがより効率化されました。顧客の乗船時の快適性と安全性が大幅に向上。マリングレードの構造によりメンテナンスダウンタイムが減少しました。ダイビングセンターは繁忙期により多くの顧客にサービスを提供し、プロフェッショナルなダイビングサービスを自信を持って拡大できるようになりました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp'
      quote: 'ダイビングセンターにとって、ボートは単なる移動手段ではありません。日常運用の重要な一部です。Paddle Board Overstock RIB は、毎日複数のダイビングトリップをより安全かつ効率的に運営する自信をチームに与えてくれます。'
      icon: tabler:lifebuoy
    - title: ヨーロッパのダイビングセンターフリート
      customer: BlueMed Diving Centers
      country: ギリシャ
      industry: ダイビング・海洋ツーリズム
      challenge: 'ギリシャの複数の島にまたがるダイビングセンターのチェーンのために、12 隻のダイビング仕様 RIB が必要でした。各ボートにはカスタムダイブラダー、8 本のタンク収納、オープンウォーターでのダイバーエントリーのための安定したプラットフォームが必要で、フリートは観光シーズンの開始に間に合うよう 60 日以内の到着が求められました。'
      solution: 'タンクラック、ダイブラダー、乗船時の安定性を高めるための極太ハイパロンチューブを統合した 12 隻の RIB 520 Dive を生産。各ボートには顧客のフリートリバリーが施されました。12 隻すべてが圧力テストを終え、55 日以内に青島から出荷されました。'
      product: RIB 520 Dive
      results: '12 隻すべてが観光シーズンに間に合うように納品されました。フリートは 18 か月以上日常運用されており、材料の故障はゼロです。顧客は 2 年目に 6 隻を追加発注しました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp'
      quote: 'RIB 520 Dive は、私たちの日常のダイビング運用の基幹です。停泊時の安定性は優れており、タンク収納のレイアウトのおかげで、ゲストにとってデッキが清潔で安全な状態に保たれています。'
      icon: tabler:lifebuoy
    - title: オーストラリアンディストリビューター OEM プログラム
      customer: Pacific Watersports Pty Ltd
      country: オーストラリア
      industry: OEM/ODM 製造
      challenge: 'オーストラリアのディストリビューターは、中国のダイレクトトゥコンシューマーブランドと競争するため、競争力のある価格のプライベートブランド SUP ボードシリーズを必要としていました。初心者から上級者までをカバーする 8 つの独自モデルと、カスタムグラフィックス、カスタムパッケージ、小売店へのドロップシップ対応が必要でした。'
      solution: 'オーストラリア限定のグラフィックスパッケージを備えた 8 つの SUP モデル（オールラウンド、ツーリング、ヨガ、キッズ、スポーツ、ウルトラコンパクト、ウルトラステーブル、ホワイトウォーター）を開発。セットアップ動画にリンクする QR コード付きのカスタム小売パッケージ。青島からオーストラリアの小売店へ直接届くドロップシップ物流を構成しました。'
      product: カスタム SUP ライン（8 モデル）
      results: 'コンセプトから初回出荷まで 90 日。初シーズンの小売売れ行き率は 85%。ディストリビューターは 2 年目にパートナーシップをインフレータブルボートラインまで拡大しました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp'
      quote: 'Paddle Board Overstock は 90 日で完全な SUP ラインを納品しました — 最初のデザインから小売店の店頭まで。品質は、2 倍の価格で売られているブランドに匹敵します。'
      icon: tabler:arrows-exchange
    - title: 中東への救助艇供給
      customer: National Civil Defense Authority
      country: アラブ首長国連邦
      industry: 捜索・救助
      challenge: '民間防衛組織が、沿岸捜索救助、港湾警備、洪水対応のために、警備即応仕様の RIB 20 隻を必要としていました。セルフベーリングデッキ、完全なナビゲーションスイート（GPS、レーダー、VHF）、高視認性のオレンジ色のチューブ、現地の海運規制への準拠が求められました。'
      solution: 'セルフベーリングデッキ、Garmin 製ナビゲーションスイート、LED サーチライト、SOLAS 再帰反射テープ、高視認性のオレンジ色ハイパロンチューブを備えた 20 隻の RIB 450 Patrol を納品。各ボートは CE 認証を取得し、ISO 6185 規格でテストされました。ドキュメント一式には、現地登録用のコンプライアンス証明書が含まれています。'
      product: RIB 450 Patrol
      results: 'フリートは 5 つの沿岸拠点に配備されました。ボートは（45°C 以上の）過酷な暑さの中で運用されており、チューブの劣化はありません。航続距離と燃費は仕様を 12% 上回りました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp'
      quote: 'RIB 450 Patrol は、私たちの運用要件を上回りました。過酷な暑さの条件下でも、ハイパロンチューブは 24 か月の日常使用後も UV 劣化の兆候を示していません。'
      icon: tabler:alert-triangle
    - title: ヨーロッパ OEM ブランドパートナーシップ
      customer: North Sea Marine Equipment BV
      country: オランダ
      industry: OEM/ODM 製造
      challenge: '確立されたヨーロッパの海洋ブランドが、製造施設への投資なしに RIB 市場に参入しようとしていました。プライベートブランディング、CE 認証、EU 独占販売権を備えた 5 つの RIB モデル（3.9m～6.2m）を生産できるホワイトラベルパートナーが必要でした。'
      solution: '5 つの RIB モデルに関するホワイトラベル製造契約を締結。各モデルには顧客のロゴとカラースキームが施されました。各モデルの CE 認証ドキュメントを準備。最低発注数量付きの EU 独占販売権を付与しました。現地サービスネットワーク向けに技術文書とスペアパーツカタログを提供しています。'
      product: カスタム RIB ライン（5 モデル）
      results: '複数年契約が締結されました。初回生産の 50 隻は 75 日以内に出荷。ブランドは METSTRADE で発表され、ディーラーから好評を得ました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp'
      quote: 'Paddle Board Overstock との協業により、工場を建てることなく RIB 市場に参入できました — CE 認証とディーラーサポートのドキュメントを備えた、完全なターンキーソリューションを納品してもらいました。'
      icon: tabler:building
    - title: カリブ海リゾートフリート
      customer: Paradise Island Resorts Ltd
      country: バハマ
      industry: 海洋ツーリズム・ホスピタリティ
      challenge: '高級リゾートが、ゲストアクティビティのための完全なウォータースポーツ器材フリートを必要としていました：ガイドツアー用の SUP ボード 40 枚、ラグーン探検用のカヤック 20 艇、ゲストの送迎と釣りエクスカーション用のインフレータブルボート 10 隻、さらにアクセサリー。すべての器材にリゾートのブランディングが必要で、観光ピークシーズンの前に納品されなければなりませんでした。'
      solution: '完全なウォータースポーツパッケージを生産：SUP Voyager ボード 40 枚（オールラウンドモデル）、Explorer カヤック 20 艇、AirDeck 360 インフレータブルボート 10 隻、さらに PFD、パドル、ポンプ、修理キット。すべての器材にリゾートのロゴとトロピカルカラースキームがプリントされました。完全な在庫リスト付きのコンテナ出荷です。'
      product: フルウォータースポーツパッケージ（70 隻以上）
      results: 'フリートはピークシーズンの 6 週間前に到着。ウォータースポーツアクティビティのゲスト満足度スコアは前年比 40% 向上しました。器材は 3 シーズン使用しても、日常のメンテナンスのみで持続しています。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp'
      quote: '完全パッケージというアプローチのおかげで、必要なすべてを 1 回の出荷で受け取れました — ボード、カヤック、ボート、アクセサリーすべてにブランディングが施され、ゲストがすぐに使える状態でした。ゲストは器材の品質を気に入っています。'
      icon: tabler:beach
    - title: 'クイーンズランド商用ダイビングセンター RIB アップグレード'
      customer: 商用ダイビングセンター
      country: オーストラリア
      industry: 商用ダイビング・海洋サービス
      challenge: '海洋インフラ点検、港湾メンテナンス、水中修理プロジェクトを専門とするクイーンズランドの商用ダイビングセンターは、老朽化した作業船を運用していました。プロジェクト需要の拡大に伴い、古い船は足かせとなっていました — 頻繁なメンテナンスがスケジュールの支障となり、レイアウトは現代のダイビング運用に対応した設計ではなく（シリンダー、工具、器材のスペースが限られ）、長時間の運用中のクルーの快適性も低いものでした。同社は、毎営業日のプロフェッショナルな運用を支えられる船を必要としていました。'
      solution: 'Paddle Board Overstock は、顧客のダイビングワークフロー、典型的なプロジェクト期間、クルー規模、器材要件について詳細な運用分析を実施しました。この分析に基づき、器材準備とダイバーの移動に最適化された機能的なデッキレイアウト、長時間の移動に対応するプロフェッショナルシート、より安全なダイバーの出入りのための強化された安定性、設計に統合されたダイビングサポート機能を備えたカスタマイズされたプロフェッショナル RIB を納品しました。'
      product: 'カスタムプロフェッショナルダイビング RIB'
      results: '新しい RIB は信頼性の高い日常の作業プラットフォームとなりました。最適化されたレイアウトにより器材準備が速くなり、クルーは長時間の運用中の快適性と安全性の向上を報告しています。ボートのプロフェッショナルな外観は、港湾オペレーターや海洋請負業者との仕事において顧客の信頼を強化しました。ダイビングセンターは、自社のサービスのプロフェッショナリズムに見合った船を手に入れました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp'
      quote: '私たちが必要としていたのは、単なる移動のための船ではなく、毎日のビジネスを支えられるボートでした。Paddle Board Overstock は運用要件を理解するために私たちと協力し、商用ダイビングのワークフローに合う RIB ソリューションを納品してくれました。'
      icon: tabler:lifebuoy
    - title: 米国沿岸警備契約
      customer: Atlantic Coastal Security Agency
      country: アメリカ合衆国
      industry: 海上保安・法執行
      challenge: '米国の沿岸保安機関が、外洋迎撃作戦用のヘビーデューティ警備 RIB を必要としていました。冗長性のためのツインエンジン構成、クルー保護のための装甲コンソール、軍用規格の電子機器（暗号化通信、FLIR、レーダー）、米国沿岸警備隊規制への準拠が求められました。'
      solution: 'ツイン 115 HP 船外機構成、弾道防護を備えた装甲コンソール、FLIR サーマルイメージング、暗号化 VHF/UHF 通信、統合ウェポンマウントを備えた RIB 600 Patrol を設計。高速迎撃機動に対応するよう船体を強化しました。すべての電子機器は工場で統合・テスト済みです。USCG 準拠ドキュメントを提供しました。'
      product: RIB 600 Patrol（ツインエンジン）
      results: '受領試験で 52 ノットの最高速度を達成。機関は最初の 12 か月で 95% の作戦即応率を報告しました。8 隻の追加発注が行われています。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp'
      quote: 'ツインエンジンの RIB 600 は、外洋迎撃作戦に必要な速度と冗長性をクルーに与えてくれます。装甲コンソールは、性能を損なうことなく重要な保護を提供します。'
      icon: tabler:shield
cta:
  title: '相談したいプロジェクトがありますか?'
  subtitle: 'すべての Paddle Board Overstock パートナーシップは、会話から始まります。ご要望をお聞かせください。ソリューションを開発いたします。'
  actions:
    - variant: primary
      text: プロジェクトを開始する
      href: /contact
