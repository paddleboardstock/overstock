hero:
  tagline: レンタルビジネスソリューション
  title: Aquafarer で収益性の高いウォーター スポーツ<br />レンタル ビジネスを構築する
  subtitle: SUP クラブ、ビーチ リゾート、湖の経営者、ウォーター スポーツ センター向けの、機器の選択からフリートの管理とメンテナンスのサポートに至るまで、完全なレンタル フリート パッケージを提供します。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-paddle-girls-team.webp
    alt: Aquafarer ウォーター スポーツ レンタル船団が稼働中
direct_answer: Aquafarer は、ウォーター スポーツ オペレーター向けにエンドツーエンドのレンタル ビジネス ソリューションを提供します。初心者向けの SUP フリートから商用グレードの RIB レンタルまで、当社は適切な機器の選択、所在地に合わせたフリート サイズの最適化、メンテナンスのダウンタイムの最小化、レンタルあたりの収益の最大化をお手伝いします。当社のレンタル実績のある製品は、商用グレードの PVC 構造、簡単な修理機能、保管コストを排除するインフレータブル設計を特徴としています。新しいレンタル事業を開始する場合でも、既存のフリートをアップグレードする場合でも、Aquafarer は収益性の高いウォーター スポーツ レンタル ビジネスを構築するための機器と専門知識を提供します。
solution_offerings:
  - title: フリート スターター キット
    subtitle: 市場をテストする新たなレンタル事業に向けて
    badge: Popular
    features:
      - title: フリートの評価
        description: お客様の所在地、ゲストの人口統計、収益目標を専門家が分析してフリートのサイズを決定します
      - title: スターター機器
        description: パドル、ポンプ、救命胴衣、修理キットを備えた 10 台の SUP ボード - 立ち上げるために必要なものがすべて揃っています
      - title: ストレージソリューション
        description: インフレータブル機器は平らに梱包されます - 保管にボートドックやトレーラーは必要ありません
      - title: 安全性の遵守
        description: すべての機器は商業グレードの構造で CE 認定を受けており、毎日のレンタルに適しています。
      - title: スターターマーケティング
        description: サービスの立ち上げに役立つブランド化された写真アセットとレンタル メニュー テンプレート
    cta_text: Start Rental Fleet
    cta_href: /contact
  - title: フリート拡張キット
    subtitle: 成長を続ける業務に能力と多様性を追加するために
    badge: Premium
    features:
      - title: 混合艦隊設計
        description: SUP、カヤック、インフレータブルボート、RIBを組み合わせてゲストの多様な好みに対応
      - title: ボリュームプライシング
        description: 20 ユニット以上のフリートに対する段階的な卸売価格と優先物流料金
      - title: カスタムブランディング
        description: 機器へのロゴ印刷、ブランドの救命胴衣、レンタル車両のカスタムカラーオプション
      - title: メンテナンスプログラム
        description: スペアパーツキット、スタッフ向けの修理トレーニング、テクニカルサポートへの直接アクセス
      - title: 収益の最適化
        description: 価格設定、機器のローテーション、季節ごとのフリート調整に関するデータに基づく推奨事項
    cta_text: Scale My Fleet
    cta_href: /contact
