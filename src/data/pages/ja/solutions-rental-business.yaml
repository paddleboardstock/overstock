testimonial:
  content: 私は地元のショップからボードを 5 枚レンタルしていましたが、収益の 60% がショップに失われていました。 Aquafarer は、15 台の SUP を自分で構築するのに役立ちました。彼らが提供した ROI 計算ツールによると、4 か月で損益分岐点になることがわかりましたが、実際には 3 か月かかりました。現在、ボードを 30 枚に拡張し、カヤックを追加しています。
  name: ダニエル・オコンクォ
  title: Lakeland SUP Rentals のオーナー — カナダ、オンタリオ
content_segments:
  tagline: レンタルプロフィール
  title: ウォーター スポーツ レンタル ソリューション<br />オペレーター タイプ別
  subtitle: ビーチサイドの小規模な SUP レンタルから大規模なリゾートのウォーター スポーツ センターまで、レンタル業務にはさまざまなニーズがあります。当社は機器パッケージをカスタマイズし、それに応じてモデルをサポートします。
  items:
    - title: ビーチと湖畔のSUPレンタル
      subtitle: 大量の複雑さの少ない操作
      description: スタンドアップ パドルボードやカヤックを海水浴客や湖の訪問者に直接レンタルする業者。優先事項は、レンタル間の所要時間を最小限に抑え、機器のローテーションを維持し、小さなストレージ占有面積で季節的な需要の急増を管理することです。
      features:
        - "平坦に収納できるインフレータブルSUPフリート — ドックもトレーラーも不要"
        - "シーズン100回以上のレンタルサイクルに対応する業務用グレードのPVC"
        - "速乾性・耐UV性素材で当日中に再貸出可能"
        - "カラー分けされたボードラインナップでフリートの識別が容易"
    - title: リゾート & ホテルのウォーター スポーツ センター
      subtitle: ゲストエクスペリエンスとブランドの連携
      description: 施設内のアメニティとしてウォーター スポーツを提供するリゾートやホテル。設備は高級感があり、初心者から中級者までのゲストに確実に機能し、リゾートの既存のアクティビティの予約と請求のワークフローと統合する必要があります。
      features:
        - "リゾートカラーに合わせたカスタムブランドのSUPボードとライフベスト"
        - 'ミックスフリート：SUP、カヤック、ペダルボート、小型RIBテンダー'
        - "静音・無燃料の電動ポンプでビーチでの空気入れが可能"
        - "スタッフ研修とメンテナンスの導入研修を含む"
    - title: ボートおよびRIBレンタルオペレーター
      subtitle: 商用グレードのレンタル船舶
      description: 動力船（RIB テンダー、ゴムボート、小型滑走艇）を時間単位または半日単位でレンタルするオペレーター。お客様のフリートは海上安全規制を満たし、ゲストの頻繁な使用に耐え、チャーター間の機械のダウンタイムを最小限に抑える必要があります。
      features:
        - 30〜90馬力の船外機に対応したトランサム付きRIBパッケージ
        - "長期的な構造強度を確保する船用合板フロアパネル"
        - "高速回転を実現するクイックローンチバルブシステム"
        - "予備部品キット＋オンコール技術サポートSLA"
    - title: ツアー & アドベンチャー オペレーター
      subtitle: ガイド付き遊覧船団
      description: SUP サファリ、洞窟カヤック、シュノーケリング ツアー、アイランドホッピング RIB ツアーなど、ガイド付きウォーター スポーツ ツアーを運営するオペレーター。用具は、初心者のツアーゲストにとって十分に安定しており、グループ間ですぐに掃除でき、さまざまな水質条件下での毎日のガイド付き使用に十分な耐久性がなければなりません。
      features:
        - "初心者向けの超高安定性SUPプラットフォーム（幅82cm以上）"
        - "カップル・グループツアー構成に対応するタンデムカヤックオプション"
        - "シュノーケル器材、ドライバッグ、クーラーボックスを搭載できる内蔵積載容量"
        - "事業運営向けのCE＋USCG適合ドキュメント"
cta:
  title: レンタル車両を構築する準備はできていますか?
  subtitle: 貴社の所在地とゲストの数についてお知らせください。貴社の市場に最適化したレンタル車両を設計します。
  actions:
    - variant: primary
      text: レンタルの提案を取得する
      href: /contact
    - text: ビジネスパッケージを比較する
      href: /business-packages
    - text: 成功事例を見る
      href: /success-stories
