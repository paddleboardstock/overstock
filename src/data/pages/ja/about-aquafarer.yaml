certifications_section:
  tagline: 認証
  title: CE・ISO 認証製造
  subtitle: CE認証を取得した64モデルが国際的な安全・品質基準を満たしています。

values:
  - title: 品質第一
    desc: 工場から出荷されるすべてのボートは、出荷前に必須の気密保持、シームピール、システムテストに合格しています。
  - title: 垂直統合
    desc: PVC 裁断から最終組立まで、すべての段階を管理 — 外注先の非効率を排除し、一貫した品質を確保します。
  - title: 標準としての安全
    desc: CE認証は私たちのものづくりの核です。CE認証を取得した64モデルがレジャー・商用用途の EU 安全基準を満たしています。
  - title: パートナー中心
    desc: 透明性、信頼性、共通の成長を通じて、OEM・ODM・プライベートブランドパートナーと長期的な関係を築きます。

services:
  - title: OEM 製造
    desc: お客様の仕様に従って製造します。図面をお送りいただければ、当社のエンジニアリングチームが試作、治具、生産を担当します。
  - title: ODM ソリューション
    desc: 実績のある当社のプラットフォーム設計から始めましょう。サイズ、カラー、グラフィック、パッケージをカスタマイズして、独自の製品ラインを作り上げます。
  - title: プライベートブランド
    desc: お客様のブランド名、ロゴ、パッケージ。完全なブランド統合により、製品は販売可能な状態で届けられます。
  - title: カスタムブランディング
    desc: デッキパッド印刷、船体グラフィック、チューブデカル、カスタムラベル — すべての表面に一貫したブランドの存在感を。

certifications:
  - name: CE 認証
    desc: 当社のボートおよび舟艇が EU レジャー艇指令（2013/53/EU）および関連する統一規格に準拠しています。
    scope: ボートおよび舟艇
  - name:
    desc: インフレータブルウォータークラフトの設計、製造、流通に対して認証された品質マネジメントシステム。
    scope: 施設全体
  - name:
    desc: インフレータブルボート — 強化型および硬い船体を持つインフレータブルボートの安全・性能要件。
    scope: RIB・インフレータブルライン

