hero:
  tagline: 会社概要
  title: "{SITE} について"
  subtitle: 原材料から完成艇まで — 垂直統合されたウォータースポーツメーカー

intro:
  - 'Aquafarer は 2012 年、たったひとつのミッションとともに創業しました：品質レポートと同じように水上でも優れた性能を発揮するウォータースポーツ器材を設計・製造することです。専門特化した SUP ボード工房として始まった事業は、青島経済技術開発区にある 12,000㎡ の統合製造施設へと成長し、50 カ国以上の顧客に向けてインフレータブルボート、RIB、カヤック、SUP ボード、安全装備、アクセサリーを生産しています。'
  - 今日、Aquafarer は工場ブランドとして運営されています — 設計、エンジニアリング、試作、製造、テストをすべてひとつの屋根の下で行っています。この垂直統合により、材料の選定、製造品質、納期を直接管理できます。すべてのボートは、私たちの人材が、私たちの設備で、私たちの基準によって造られています。
  - 世界中のレジャーユーザー、商業事業者、政府機関、ブランドパートナーにサービスを提供しています。当社の OEM・ODM プログラムは、工場インフラに投資することなく、独自の製品ラインを立ち上げる支援をします。単発の試作でもフル生産でも、当社チームがコンセプトから出荷可能な状態までサポートします。

