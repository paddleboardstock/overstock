materials:
  intro_p1: インフレータブルウォータークラフトの性能、耐久性、安全性は、その構造に使用される材料にほぼ完全に依存します。チューブを形成する生地から、SUP ボードに剛性を与える糸まで、すべての材料選択が、製品の水上での性能と寿命に影響します。
  intro_p2: 'このガイドでは、現代のインフレータブルウォータークラフトに使用される 4 つの主要材料を取り上げます：PVC 生地、ハイパロン CSM ゴム、ドロップステッチコア構造、EVA フォームデッキ。これらの材料を理解することで、ニーズに合った製品を選び、最大の寿命のためにメンテナンスできるようになります。'
  labels:
    advantages: 長所
    limitations: 短所
    best_for: '適した用途:'
  items:
    - name: PVC（ポリ塩化ビニル）
      summary: レジャー用インフレータブルボートおよび SUP の業界標準。多層ラミネート生地が、手の届く価格で優れた比強度を提供します。
      pros:
        - 手頃な価格 — ハイパロンより 30～50% 安い
        - 軽量で扱いやすい
        - 適切なコーティングで優れた耐 UV 性
        - 豊富なカラーと仕上げ
        - PVC パッチと溶剤系接着剤で修理が容易
      cons:
        - ハイパロンより短い寿命（7～10 年）
        - 低温で柔軟性が低下
        - やや低い耐薬品性
        - 経年で可塑剤移行が発生する可能性
      best_for: レジャー用 SUP、コスト重視のボート、レンタルフリート、季節限定使用、淡水・沿岸環境。
    - name: ハイパロン（CSM ゴム）
      summary: 卓越した耐久性、耐 UV 性、長寿命で知られるプレミアム合成ゴム材料。商用およびミリタリーグレードのインフレータブルボートのゴールドスタンダード。
      pros:
        - 卓越した耐 UV・耐オゾン性
        - 適切なケアで 15～20 年の寿命
        - 優れた寒冷時の柔軟性
        - 優れた耐薬品性・耐油性
        - PVC より長く色を保つ
      cons:
        - PVC よりかなり高価
        - 生地の重量が重い
        - カラーオプションが少ない
        - 修理には専門接着剤が必要
        - 世界中の製造施設が少ない
      best_for: 商用 RIB、捜索救助、軍事用途、熱帯気候、長期的なフリート保有。
    - name: ドロップステッチコア
      summary: インフレータブル SUP に革命をもたらした技術。何千本ものポリエステル糸が上下の生地層を接続し、高圧膨張によってハードシェルに匹敵する剛性と性能を実現します。
      pros:
        - 12～20 PSI で非常に高い剛性
        - 軽量 — フルサイズボードで 18～30 lbs
        - 平らに折りたためて保管・運搬しやすい
        - 優れた耐衝撃性
        - 温度範囲全体で一貫した性能
      cons:
        - 高圧ポンプが必要
        - 単層構造よりパンク修理が複雑
        - 標準的なインフレータブルより製造コストが高い
        - 経時的な圧力低下により定期的な追い充気が必要
      best_for: スタンドアップパドルボード、カヤック、インフレータブルボートのエアデッキ、インフレータブルの携帯性と剛性の両方を必要とするあらゆる用途。
    - name: EVA フォームデッキ
      summary: SUP ボードやボートデッキのトラクションパッドに使用される独立気泡 EVA（エチレン酢酸ビニル）フォーム。クッション性、グリップ、断熱性を提供します。
      pros:
        - 濡れた状態でも乾いた状態でも優れた滑り止めグリップ
        - クッション性が長時間のパドリングの疲労を軽減
        - 冷たいデッキ面からの断熱
        - 耐 UV・耐海水性
        - 複数色のブロック組み合わせおよびレーザー彫刻デザインに対応
      cons:
        - 過酷な使用では 2～3 年で摩耗することがある
        - 層間剥離を防ぐために適切に接着する必要がある
        - 構造部材ではない — 剛性には影響しない
        - わずかに重量が増える（ボードあたり 200～400 g）
      best_for: SUP デッキのトラクション、ボートデッキのパッド、カヤックシートの快適性、滑りにくい足場を必要とするあらゆる表面。
  selection:
    title: 材料選定ガイド
    subtitle: '主な使用目的に基づいて適切な材料を選びましょう:'
    headers:
      - ユースケース
      - 推奨材料
      - 理由
    rows:
      - - レジャー用 SUP パドリング
        - ドロップステッチ PVC
        - 軽量、剛性、手頃な価格 — カジュアルなパドラーに理想的なバランス
      - - ファミリーディンギー／レイクボート
        - PVC（1100 デニール）
        - コスト効率が高く、修理が容易、レジャー使用に十分な耐久性
      - - 商用 RIB／パトロールボート
        - ハイパロン CSM
        - 最大限の耐 UV 性、15～20 年の寿命、耐薬品性・耐油性
      - - レンタルフリート用 SUP ボード
        - ドロップステッチ PVC＋EVA デッキ
        - 耐久性があり修理可能、高回転使用に対する優れた価値
      - - 捜索救助活動
        - ハイパロン CSM
        - 過酷な条件下での信頼性、寒冷時の柔軟性、耐薬品性
      - - ツーリング／遠征カヤック
        - ドロップステッチ PVC
        - 旅行に持ち運べる収納性と剛性のある性能
  deep_dive:
    title: 詳細ガイド
    topics:
      - title: 海洋グレード PVC
        desc: 多層ラミネート PVC 生地 — 耐 UV 性、耐摩耗テスト、デニール規格の解説。
      - title: PVC とハイパロンの比較
        desc: 2 大インフレータブルボート材料の決定的な比較 — コスト、寿命、耐 UV 性。
      - title: ドロップステッチコア
        desc: 何千本もの内部の糸が 12～15 PSI で剛性のある高圧インフレータブル構造を作る仕組み。
      - title: RF 溶接技術
        desc: 高周波溶接が強力で均一なシームを作る — その仕組みと重要性。
      - title: PSI と性能
        desc: インフレータブル SUP とボートにとって空気圧が重要な理由 — 剛性、積載能力、乗り心地。
      - title: 品質テスト
        desc: 圧力テスト、浮力テスト、UV エージング、破壊テスト — 当社の品質プロセス。
      - title: EVA フォームデッキ
        desc: 独立気泡 EVA フォームデッキパッド — SUP およびボートデッキのためのトラクション、快適性、耐久性。
      - title: 材料のケア
        desc: インフレータブル製品の清掃、UV 保護、カビ防止、保管のベストプラクティス。
