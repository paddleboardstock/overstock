articles:
  sup:
    - title: SUP の基礎 — 初心者ガイド
      desc: 初心者が知っておくべきすべて — ボードのタイプ、パドルのサイズ、スタンス、初日のヒント。
    - title: SUP サイズガイド
      desc: 体重、スキル、パドリングスタイルに合ったボードの長さ、幅、体積を見つけましょう。
    - title: インフレータブルとハードボードの比較
      desc: どちらが適していますか? 携帯性、性能、耐久性、コストを比較。
    - title: 中級者向け技術
      desc: 高度なストローク、旋回技術、荒れた水面での操作で、パドリングをワンランク上げましょう。
    - title: インフレータブル SUP の選び方
      desc: 重要な要素を確認 — 構造、厚さ、フィン構成、付属アクセサリー。
    - title: 水上安全
      desc: 天候の読み方、PFD の選定、セルフレスキュー、グループパドリングを含む必須の安全知識。
  inflatable-boat:
    - title: 材料リファレンス
      desc: PVC、ハイパロン、ドロップステッチ、デニール規格 — インフレータブル器材が何でできているかを理解しましょう。
    - title: PVC とハイパロンの比較
      desc: インフレータブルボートのための PVC とハイパロン生地の決定的な比較 — 耐久性、耐 UV 性、コスト。
    - title: ドロップステッチコアの解説
      desc: 何千本もの内部の糸が、高性能インフレータブル SUP のために 12～15 PSI で剛性のあるプラットフォームをどのように作るか。
    - title: インフレータブル技術の概要
      desc: インフレータブルボートと SUP の構造 — 材料のレイアップからバルブシステム、シーム溶接まで。
    - title: リジッドインフレータブルボート（RIB）ガイド
      desc: RIB の構造、船体タイプ、チューブ材料、ニーズに合った RIB の選び方のすべて。
    - title: インフレータブルボートと RIB の比較
      desc: 従来のインフレータブルディンギーと硬式船体インフレータブルボートの、用途ごとの主な違い。
  water-safety:
    - title: 水上安全ガイド
      desc: すべてのパドラーのための必須安全知識 — 天候、PFD、セルフレスキュー、グループパドリングプロトコル。
    - title: ライフジャケット・PFD ガイド
      desc: SUP、カヤック、ボーティング、プロフェッショナル用途に適した個人用浮力装置（PFD）の選び方。
    - title: SUP 安全チェックリスト
      desc: すべてのスタンドアップパドルボーダーが水上に出る前に確認すべき、進水前の安全チェックリスト。
    - title: 冷水パドリングの安全
      desc: 冷水条件下でのパドリングに必要な予防策、器材、技術。
    - title: 初心者が犯しやすいパドリングのミス
      desc: 初めてのパドラーが犯すよくあるミスと、より安全で楽しい体験のための回避方法。
    - title: CE 認証の解説
      desc: インフレータブルウォータークラフトにとって CE 認証が意味するもの — 規格、テスト、そしてそれが安全に重要な理由。
