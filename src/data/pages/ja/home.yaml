content_customer_types:
  tagline: 私たちが奉仕する人
  title: B2B バイヤー向けに構築<br /> - 小売店の買い物客ではない
  subtitle: Aquafarer は 4 つの顧客タイプに合わせて製造しています。それぞれに異なる優先順位があり、私たちはそれらすべてに取り組みます。
  items:
    - title: ブランドオーナー / プライベートブランド
      description: カスタム製品設計、プライベート ラベルのグラフィックス、貴社ブランドのコンプライアンス文書、コンセプトからコンテナに至るまでの専用エンジニアリング サポート。
      icon: tabler:palette
      cta: OEM/ODM 見積もりをリクエストする
      cta_href: /request-quotation
    - title: 代理店・卸売業者
      description: 領土の保護、競争力のある卸売価格、マーケティング サポート キット、製品トレーニング、市場向けの完全なコンプライアンス文書。
      icon: tabler:world
      cta: 販売店の申し込み
      cta_href: /dealers-distributors
    - title: リゾート・レンタル事業者
      description: 商用グレードの耐久性、フリートのサイジングに関するアドバイス、混合モデルのコンテナの注文、スペアパーツ戦略、リゾートブランドの設備パッケージ。
      icon: tabler:beach
      cta: 商用パッケージを入手する
      cta_href: /solutions/resorts
    - title: 救助 / 政府 / 専門家
      description: Hypalon/CSM 建設、SOLAS 準拠オプション、プロジェクト固有の認証、入札書類サポート、NDA で保護されたエンジニアリング。
      icon: tabler:shield
      cta: プロジェクトについて話し合う
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM 機能
  title: Aquafarer で得られるもの<br />
  subtitle: 商社ではなく、完全なエンジニアリング、品質、コンプライアンスのサポートを備えた工場への直接アクセス。
  columns: 2
  items:
    - title: OEM/ODMのカスタマイズ
      description: カスタムの船体デザイン、チューブ素材 (PVC または Hypalon/CSM)、コンソールのレイアウト、座席、ブランド、色、パッケージ。小さな変更から完全なカスタムエンジニアリングまで。
      icon: tabler:adjustments
    - title: 低MOQ、高速サンプリング
      description: 'RIB：2～5個（既存金型） SUP: SKU あたり 5 ～ 10 ユニット。カスタム金型: 200 個以上。 7 ～ 14 日でブランディングを施した試作サンプルが作成されます。'
      icon: tabler:rocket
    - title: 本番環境に対応した品質
      description: すべてのユニットは、定格 PSI の 1.25 倍で 24 ～ 48 時間の圧力テストが行われています。 AQL 2.5 / ISO 2859 に基づく 99.3% の無欠陥率。船体ごとに 100 ポイントの品質チェックリスト。
      icon: tabler:certificate
    - title: 完全なコンプライアンス文書
      description: CE 2013/53/EU (RCD)、ISO 9001:2015 (SGS)、BSCI 社会監査、REACH 準拠、UKCA マーキング。モデル固有の DoC およびビルダー プレート データが含まれています。
      icon: tabler:file-certificate
    - title: 30～45日のリードタイム
      description: 標準生産 30 ～ 45 日 FOB 青島。プロトタイプの製作には 7 ～ 14 日間かかります。急ぎ生産も可能です。コンテナ積み込み計画と ISPM-15 木箱が含まれています。
      icon: tabler:truck-delivery
    - title: アフターセールスおよびスペアパーツ
      description: ボート/カヤック/RIB は 5 年、SUP/アクセサリーは 2 年保証。優先配送によるスペアパーツの供給。保証請求処理サポート。
      icon: tabler:lifebuoy
content_categories:
  tagline: 製品カテゴリー
  title: 5カテゴリー<br />64のCE認定モデル
  subtitle: 2.4m RIB テンダーから 15 フィート SUP ボードまで、すべて青島 ISO 9001 施設で製造されています。
  items:
    - title: RIBボート
      description: アルミニウムまたは GRP 船体で 2.4m ～ 7.0m。 PVC または Hypalon/CSM チューブ。 2013/53/EU に基づく CE。パトロール、ダイビング、レスキュー、商業用の構成。
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: ゴムボート
      description: 2.0m ～ 5.0m (アルミニウム床、合板床、またはエアデッキのオプションあり)。フィッシング、レクリエーション、テンダーモデル。
      icon: tabler:sailboat
      link: /products
    - title: SUPボード
      description: 4インチおよび6インチのドロップステッチで9フィートから15フィート。ツーリング、ヨガ、フィッシングまでオールラウンドに使えるモデル。商用グレードも利用可能。
      icon: tabler:swimming
      link: /products
    - title: カヤック
      description: 1人乗りから3人乗りまでのインフレータブルカヤック。ドロップステッチフロアオプションを備えたレクリエーションおよびツーリングモデル。
      icon: tabler:kayak
      link: /products
    - title: 安全アクセサリ
      description: CE 認定救命胴衣、投擲ロープ、修理キット、ポンプ、航海灯。 USCG Type III/V 承認済み PFD。
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: 工場の強み
  title: 青島の監査対応製造<br />
  content: <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12,000 m² ISO 9001 施設 — 商社ではなく本物のメーカー</h3>
  items:
    - title: 6つの専用生産ライン
      description: RIB、インフレータブルボート、SUP、カヤック、安全装置、OEM/ODM ラインを個別に提供します。それぞれに専用の QC チェックポイントと生産計画があります。
    - title: 100% 圧力テスト済み
      description: すべての膨張式チャンバーは定格 PSI の 1.25 倍に加圧され、24 ～ 48 時間保持されます。テスト結果は船体のシリアル番号 (HIN) に関連付けられています。
    - title: 船体ごとのトレーサビリティ
      description: '船体ごとに 21 以上のデータ フィールドを含む HIN レベルの生産記録: 材料バッチ、溶接機 ID、圧力テスト結果、最終構成、配送先。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer RIB 生産ラインを備えた青島の 12,000 平方メートル ISO 9001 製造施設
content_compliance:
  tagline: コンプライアンスと品質証明
  title: 主張だけでなく文書化された証拠<br />
  subtitle: すべてのコンプライアンス主張は、検証に利用できるモデル固有の文書によって裏付けられています。
  items:
    - title: ISO 9001 ： 2015 （ SGS ）
      description: テュフ ラインランド/SGS によって認証された品質管理システム。 Annual surveillance audits.材料の入荷から出荷リリースまでの QC プロセスを文書化します。
      icon: tabler:certificate
    - title: 2013/53/EU (RCD) に基づく CE
      description: 64 モデルにはモデル固有の適合宣言が付いています。該当するモジュールごとの適合性評価。すべての船体の HIN 登録とビルダー プレート データ。
      icon: tabler:file-certificate
    - title: BSCI 社会的コンプライアンス
      description: SGS による年次 BSCI 監査。施設全体における倫理的な労働慣行、職場の安全、環境管理を検証しました。
      icon: tabler:users
    - title: リーチとUKCA
      description: すべての PVC および接着剤材料は EU REACH 規制に準拠しています。英国市場向けに UKCA マーキングが利用可能です。ご要望に応じて、製品安全データシートをご提供します。
      icon: tabler:shield-check
steps:
  title: OEM/ODM プロセス — ブリーフからコンテナまで
  items:
    - title: 'ステップ 1: <span class="font-medium">要件</span>'
      description: 製品仕様、対象市場、数量、コンプライアンス要件を共有します。当社のエンジニアリングチームは 48 時間以内にレビューします。
      icon: tabler:file-text
    - title: 'ステップ 2: <span class="font-medium">提案</span>'
      description: 仕様、材料オプション、MOQ、価格、リードタイム、市場のコンプライアンス範囲を含む詳細な提案を受け取ります。
      icon: tabler:clipboard-list
    - title: 'ステップ 3: <span class="font-medium">プロトタイプ</span>'
      description: 7 ～ 14 日でブランディングを施した試作サンプルが作成されます。 1.25x 定格圧力での完全な品質テスト。サンプル費用は生産に充当されます。
      icon: tabler:settings
    - title: 'ステップ 4: <span class="font-medium">本番</span>'
      description: サンプル承認後、30〜45日間の生産FOB青島。工程内 QC チェックポイント、圧力テスト、およびすべてのユニットの 100 ポイントの最終検査。
      icon: tabler:building-factory
    - title: 'ステップ 5: <span class="font-medium">配送</span>'
      description: コンテナ積載計画、ISPM-15 木箱、コンプライアンス文書パッケージ、および完全な輸出書類を伴う FOB 青島出荷。
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer OEM/ODM インフレータブルボートの設計からコンテナ出荷までの製造プロセス
blog_latest:
  title: 業界および技術的な洞察
  information: |-
    RCD コンプライアンス ガイド、OEM/ODM プロセスの記事、材料の比較、
    Aquafarer エンジニアリング チームからの工場検査リソース。
faqs:
  title: B2B調達に関するよくある質問
  subtitle: Aquafarer による OEM/ODM 製造に関するブランド、代理店、商業事業者からのよくある質問。
  columns: 2
  items:
    - title: メーカーですか、それとも商社ですか？
      description: 私たちは、品質、材料、リードタイムを完全に管理する垂直統合型工場である青島ヴァトラッドグループ有限公司の製造部門です。工場監査時に営業許可と生産範囲を検証可能。
      icon: tabler:building-factory
      category: 全て
    - title: OEM/ODM プロセスは何ですか?
      description: 要件レビュー (48 時間)、提案、プロトタイプ (7 ～ 14 日)、生産 (30 ～ 45 日 FOB 青島)。完全なエンジニアリング サポート、コンプライアンス文書、船体ごとのトレーサビリティを一貫して提供します。
      icon: tabler:route
      category: 全て
    - title: MOQ要件は何ですか?
      description: 'RIB ボート: モデルあたり 2 ～ 5 ユニット (既存の金型)、カスタム金型の場合は 200 以上。 SUP ボード: SKU あたり 5 ～ 10 ユニット。混合モデルのコンテナの注文も可能です。評価用に 2 ～ 5 個のサンプルを注文します。'
      icon: tabler:sort-ascending
      category: 全て
    - title: どのようなカスタマイズ オプションが利用可能ですか?
      description: 船体デザイン、チューブ材質 (PVC または Hypalon/CSM)、チューブ直径、コンソール レイアウト、座席、ステアリング、燃料システム、デッキ レイアウト、ブランド カラー、ロゴ グラフィック、EVA パッド デザイン、小売パッケージ、およびオーナー マニュアルのブランド。
      icon: tabler:adjustments
      category: 全て
    - title: 私の市場向けにどのようなコンプライアンス文書を提供してもらえますか?
      description: 2013/53/EU に基づく CE DoC、UKCA マーキング、ISO 9001 証明書 (SGS)、BSCI 監査レポート、REACH 準拠、材料試験レポート、圧力試験ログ、およびモデル固有のビルダー プレート データ。ご要望に応じて市場固有のドキュメントを提供します。
      icon: tabler:file-certificate
      category: 全て
    - title: サンプリングと生産のリードタイムはどれくらいですか?
      description: '試作サンプル: 7 ～ 14 営業日。標準生産: 30 ～ 45 日 FOB 青島。追加料金で急ぎ生産も可能です。繁忙期（3月～6月）は納期が延びる場合がございます。'
      icon: tabler:clock
      category: 全て
    - title: 工場監査やライブビデオツアーを手配できますか?
      description: はい。当社の青島施設でのオンサイト工場監査は、3 ～ 5 日前までにご連絡いただければ受け付けております。 WhatsApp/Zoom によるライブ ビデオ ツアーはすぐにご利用いただけます。第三者検査（SGS、BV、TÜV）に対応。
      icon: tabler:video
      category: 全て
    - title: 出荷前にどのような品質検査が完了しますか?
      description: 1.25x 定格圧力保持テスト (24 ～ 48 時間)、継ぎ目剥離テスト、100 ポイントの最終検査チェックリスト、寸法検証、外観検査、準拠文書検証、およびパッケージングの完全性チェック。すべて ISO 9001 手順に従っています。
      icon: tabler:clipboard-check
      category: 全て
