faqs:
  title: SUP 注文と製品に関するFAQ
  subtitle: 当社のクリアランスSUPボード、注文、支払い、配送、保証に関するよくある質問。
  columns: 2
  items:
    - title: SUP は学ぶのが難しいですか?
      description: 全くそんなことはありません。ほとんどの初心者は、最初のセッションで立ってパドルを漕ぐことができます。私たちのオールラウンドSUPボードは、初めてのパドラー向けに特別に設計された、幅広で安定したプラットフォームを備えています。穏やかな水面で始めれば、数分でクルージングを楽しむことができるでしょう。
      icon: tabler:swimming
      category: sup
    - title: 体重制限は何ですか?
      description: 当社のオールラウンド SUPs は最大220ポンドまでのサポートが可能で、ツーリングおよびヨガ用プラットフォームは最大250ポンドまでのサポートが可能です。各製品ページには正確なライダーの体重制限が記載されているため、ボードを自分のニーズに合わせて選ぶことができます。
      icon: tabler:adjustments
      category: sup
    - title: インフレータブル SUP を持って旅行できますか?
      description: もちろんです。すべてのPaddle Board Overstockボードはバックパックサイズのキャリングケースに収納できます。わずか18〜22ポンドなので、ビーチや湖へ、あるいは空港のターミナルを通る際にも簡単に持ち運べます。旅行前に航空会社の手荷物規定を確認してください。
      icon: tabler:truck-delivery
      category: sup
    - title: 箱には何が入っていますか?
      description: すべてのPaddle Board OverstockSUPには、ボード、トラベルバックパック、ハンドポンプ、調節可能なパドル、取り外し可能なフィン、コイルリーシュ、修理キットが含まれています。
      icon: tabler:clipboard-list
      category: sup
    - title: なぜあなたの価格は小売よりも安いのですか？
      description: 私たちは中国ウェイハイにある自社生産施設から、工場の余剰在庫やクリアランス商品のバッチを直接販売しています — 仲介業者なし、通常の小売価格の上乗せなし。つまり、同じCE認証の品質を維持しつつ、通常の小売価格の最大60％オフで完全なSUPパッケージを提供しています。
      icon: tabler:certificate
      category: orders
    - title: 注文をして支払うにはどうすればいいですか？
      description: あなたのSUPパッケージをカートに追加し、StripeまたはPayPalで安全にチェックアウトしてください。すべての主要なクレジットカードおよびデビットカードを受け付けています。すべての注文は、完全な請求書付きのメールで確認されます。
      icon: tabler:file-text
      category: orders
    - title: 世界中に発送しますか？
      description: はい。私たちはEU、北米、アジア太平洋、中東、アフリカの50+か国に発送しています。在庫のある注文は通常、2〜3営業日以内に発送され、すべての荷物に追跡情報が提供されます。
      icon: tabler:route
      category: orders
    - title: SUP ボードにはどのような保証が含まれていますか？
      description: すべてのSUPボードとアクセサリーは2年間の保証が付いています — ボード本体、drop-stitchの継ぎ目、空気注入バルブも含まれます。クレームは数週間ではなく数日で解決します：オンラインで申し込み、修理または交換します。
      icon: tabler:lifebuoy
      category: orders
