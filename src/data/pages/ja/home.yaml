content_customer_types:
  tagline: 私たちが奉仕する人
  title: あらゆる<br />パドラー向けボード
  subtitle: 初めてのセッションでも50回目のセッションでも、あなたのパドルスタイルに合ったクリアランスボードがあります。
  items:
    - title: 初心者
      description: 超広く、安定したオールラウンドボードで、初めてのセッションも簡単 — ほとんどの初心者は数分で立てます。
      icon: tabler:swimming
      cta: 初心者にも優SUPsしいショップ
      cta_href: /supboard
    - title: 家族
      description: 家族全員で共有できる馬鈴板や、車内に詰めて数分で膨らむ軽量な子供用モデルもあります。
      icon: tabler:beach
      cta: ファミリーパッケージをショップ
      cta_href: /products
    - title: ツーリング&フィットネスパドラー
      description: 長く速いツーリングボードや、長距離を走るパドラー向けのフルデッキヨガプラットフォーム。
      icon: tabler:route
      cta: ショップ ツーリング&ヨガボード
      cta_href: /supboard
    - title: 釣り人
      description: 超安定したプラットフォームで、ギアマウントとクーラーを置くスペースがあり、静かで平らなデッキからキャストされます。
      icon: tabler:lifebuoy
      cta: ショップフィッシングSUPs
      cta_href: /products
features:
  id: features
  tagline: なぜ購入するのかPaddle Board Overstock
  title: リアルファクトリー、<br />実質節約
  subtitle: 工場直送の過剰在庫とクリアランスSUPパッケージ — 小売マークアップなしで認証された品質。
  columns: 2
  items:
    - title: 小売価格で最大60%オフ
      description: 工場出荷時の在庫やクリアランスバッチを直接販売しており、仲介業者も小売価格もありません。他の場所でも定価で販売されているのと同じボードを、ここでクリアランス価格で販売しています。
      icon: tabler:rocket
    - title: 完全パッケージ
      description: すべてがSUP一体化しています:ボード、トラベルバックパック、ハンドポンプ、調整可能なパドル、取り外し可能なフィン、コイルリード、修理キット。
      icon: tabler:clipboard-list
    - title: 認定品質
      description: 13 CE認定のSUPモデルは、該当するEU指令に準拠しています。すべてのボードは出荷前に定格PSIの1.25倍で100%圧力テストが行われます。AQL 2.5に基づく欠陥率は99.3%です。
      icon: tabler:certificate
    - title: いいえ MOQ — オーダー・ワンボード
      description: 在庫過剰のクリアランスにより、単品注文を歓迎します。カートにボードを追加して、チェックアウト、完了。最低注文なし、見積もりなし。
      icon: tabler:adjustments
    - title: 迅速な世界配送
      description: 在庫入荷の注文は威海から2〜3営業日以内に発送されます。+EU、北米、アジア太平洋地域、その他50か国への配送を追跡しています。
      icon: tabler:truck-delivery
    - title: 2年間 SUP 保証
      description: すべてのSUPボードとアクセサリーは2年間カバーされます drop-stitch 。継ぎ目、膨張バルブ、アクセサリーも含めてです。請求は数週間ではなく数日で解決します。
      icon: tabler:lifebuoy
content_categories:
  tagline: 製品カテゴリー
  title: 一つの製品ライン、<br />Done Right(正しい方向)
  subtitle: インフレータブルSUPボードとアクセサリーはすべて、当社の威海ISO9001施設で製造されています。
  items:
    - title: SUPボード
      description: 9フィートから12フィートまで全長のオールラウンドインフレータブルSUPs。安定していて耐久性があり、ポンプ、パドル、リード、バックパックが完備です。
      icon: tabler:swimming
      link: /supboard
    - title: ツアー SUPs
      description: 湖や川、沿岸探検のためのツアーアウトライン付きの長くて速いボード。
      icon: tabler:route
      link: /supboard
    - title: ヨガとフィットネスSUPs
      description: ヨガや水上でのトレーニングに最適な全長デッキパッドを備えた、超幅で超安定なプラットフォーム。
      icon: tabler:users
      link: /supboard
    - title: 子どもたちSUPs
      description: 子ども向けの軽量で短いボードで、同じdrop-stitch品質で子どもに優しいパッケージです。
      icon: tabler:lifebuoy
      link: /products
    - title: 付属品
      description: ポンプ、パドル、ライフベスト、リード、修理キット、交換部品を販売するすべてのボードに対応しています。
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: 工場の強み
  title: なぜ私たちのクリアランス価格なのか<br />現実
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">リアルファクトリー、リアルセービング — すべてのボードは威海施設から発送されます</h3>
  items:
    - title: 主要ブランドと同じ生産ライン
      description: 当社の12,000平方メートルの威海工場は、国際ブランド向けのボードや、同じライン・同じ材料の過剰在庫バッチを製造しています。
    - title: 100% 圧力テスト済み
      description: すべての基板は1.25倍の定格圧力で加圧されPSI、出荷前に保持されています。AQL2.5/2859あたり99.3%の欠陥フリー率 ISO です。
    - title: 仲介業者はなし
      description: ボードは工場直送で自宅に届きます。ディストリビューターのマークアップも小売価格もありません。これがクリアランス価格が小売価格より60%も低いまま維持される理由です。
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12,000平方メートルの威海工場(インフレータブSUPル生産ライン)
content_compliance:
  tagline: コンプライアンスと品質証明
  title: 認証品質、<br />記録
  subtitle: すべてのコンプライアンス主張には、認証やモデル固有の文書が裏付けられています。
  items:
    - title: ISO 9001:2015
      description: ラインラント認証の品質管理システムTÜVSGS。年次監視監査。入荷から出荷リリースまでのQCプロセスの文書化。
      icon: tabler:certificate
    - title: CE 認定済み
      description: 適用されるEU指令に基づき、13のCE認証済みSUPモデル、それぞれにモデル固有の適合宣言書および製造者プレートデータがあります。
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: すべてのPVC材料および接着材料はEU REACH 規制に準拠しています。UKCA英国市場向けのマーキングも利用可能です。要望に応じて材料安全データシートも提供可能です。
      icon: tabler:shield-check
    - title: 2年間 SUP 保証
      description: すべてのSUPボードとアクセサリーは2年間カバーされており drop-stitch 、継ぎ目、膨張バルブ、付属品も含まれます。請求は迅速に解決しました。
      icon: tabler:lifebuoy
steps:
  title: チェックアウトから配送まで — 注文はどのように発送されるか
  items:
    - title: ステップ1：<span class="font-medium">ボードを選んでください</span>
      description: オールラウンド、ツーリング、ヨガ、キッズモデルから選べます。購入ガイドでは、ボードのサイズとスタイルをあなたのパドリングに合わせる方法を紹介しています。
      icon: tabler:clipboard-list
    - title: ステップ2：<span class="font-medium">安全なチェックアウト</span>
      description: StripeまたはPayPalで安全にお支払いください。すべての主要なクレジットカードおよびデビットカードが利用可能です。アカウントは不要です — 注文確認はメールで届きます。
      icon: tabler:file-text
    - title: ステップ3：<span class="font-medium">品質検査</span>
      description: すべてのボードは、梱包される前に、定格の1.25倍の圧力で100％耐圧テストされ、完全な品質チェックリストに基づいて確認されます。
      icon: tabler:settings
    - title: ステップ4：<span class="font-medium">迅速発送</span>
      description: 在庫のある注文は、威海工場から2～3営業日以内に出荷されます。緊急の注文には迅速な処理が可能です。
      icon: tabler:building-factory
    - title: ステップ5：<span class="font-medium">追跡配達</span>
      description: 世界50+か国への追跡可能な配送。2年間の保証と迅速なアフターサービスは、ボードが届いた日から始まります。
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP 安全なチェックアウトから世界中の追跡可能な配送までの注文プロセス
blog_latest:
  title: SUP ガイドと技術的な洞察
  information: |
    購入ガイド、パドリング技術、安全の基本、そして構造
