features3_brand:
  tagline: 私たちは誰なのか
  title: ブランド基盤<br /> と遺産
  subtitle: Paddle Board Overstock を信頼できる海洋機器メーカーとして定義するストーリー、専門知識、世界的な展開。
  isBeforeContent: false
  columns: 3
  items:
    - title: アクアファーラーについて
      description: 2012年に中国の青島で設立されました。海岸沿いのワークショップから 12,000 平方メートルの施設まで、Paddle Board Overstock の完全なストーリー。
      icon: tabler:building-factory
      link: /about
    - title: ブランドストーリー
      description: 海洋エンジニアのチームが、プロ仕様のインフレータブル水上バイクを世界中で利用できるようにするためにどのように取り組んだのか。
      icon: tabler:book
      link: /brand-story
    - title: 海洋産業の専門知識
      description: 深い材料科学、精密な製造、実世界のテスト - あらゆる船体における数十年にわたる海洋工学。
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: 世界的な存在感
      description: すべての大陸の 50 か国以上にサービスを提供しています。地域の規制要件と市場の好みに関する地域の専門知識。
      icon: tabler:globe
      link: /brand-global-presence
    - title: なぜアクアファーラーなのか
      description: 当社の特徴は、品質、カスタマイズ、工場での直接価格設定、商用事業者向けのエンドツーエンドのサポートです。
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: 私たちのチーム
      description: Paddle Board Overstock を前進させる海洋エンジニア、材料科学者、製造専門家などのリーダーをご紹介します。
      icon: tabler:users
      link: /brand/team
    - title: エンジニアリングチーム
      description: 合わせて 78 年以上の研究開発年数、40 以上のプラットフォーム、12 の認証、1200 以上の OEM プロジェクト。すべての製品を支える技術チーム。
      icon: tabler:engine
      link: /engineering-team
    - title: 研究開発センター
      description: 船体エンジニアリング、RF 溶接、PVC ラボ、プロトタイピング、テストタンク、品質ラボ - 当社の完全な研究開発施設。
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: 信頼と品質
  title: 認証、品質<br />& 証明
  subtitle: 品質に対する当社の取り組みを示す独立した認証、厳格なテスト、および実際の証拠。
  isBeforeContent: false
  columns: 3
  items:
    - title: 認証
      description: CE、ISO 9001、UKCA、BSCI、REACH — 世界市場向けの完全な認証文書とコンプライアンス。
      icon: tabler:shield-check
      link: /certifications
    - title: 品質とテスト
      description: すべての製品は出荷前に圧力テストを行っています。縫い目の強度、耐紫外線性、浮力 - あらゆる段階で検証されています。
      icon: tabler:clipboard-check
      link: /quality
    - title: 証拠と証明
      description: Paddle Board Overstock の品質を検証するテスト結果、展開写真、第三者検査レポート、ケーススタディ。
      icon: tabler:file-check
      link: /evidence
    - title: ナレッジグラフ
      description: Paddle Board Overstock エンティティ グラフ、つまり製品、テクノロジー、認証、および接続されたナレッジ ベース内の関係を探索します。
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: リーダーシップ
  title: チーム紹介<br />Paddle Board Overstock の裏側
  subtitle: 海洋工学、材料科学、品質管理、世界的な B2B 貿易にわたる業界の専門知識。
  isBeforeContent: false
  columns: 3
  items:
    - title: トビー・リュー — 創設者兼 CEO
      description: 海洋製造業で 15 年以上。以前は中国の大手ボートメーカーで研究開発を主導していました。インフレータブルボートの設計で複数の特許を取得。
      icon: tabler:crown
    - title: チャン・ウェイ — チーフエンジニア
      description: PVC/ハイパロン製造とディープ V 船体設計で 20 年以上。ヨーロッパの海洋エンジニアリング会社の元テクニカルディレクター。
      icon: tabler:engine
    - title: チェン・ミン — 研究開発責任者
      description: 材料科学の博士号。ドロップステッチ技術と高周波ウェルディングを得意としています。繊維複合材の分野で 10 年以上。
      icon: tabler:flask
    - title: Liu Qiang — 制作ディレクター
      description: 無駄のない製造業で 18 年以上。シックスシグマの黒帯。すべての生産ラインに ISO 9001 品質システムを導入。
      icon: tabler:settings
    - title: 王芳 — 品質マネージャー
      description: 海洋品質管理において 12 年以上の経験。認定CEおよびISO審査員。すべての生産バッチのテストを監督します。
      icon: tabler:shield-check
    - title: ヘレン・リー — セールスディレクター
      description: 国際B2B貿易で15年以上。 30 か国以上で OEM/ODM パートナーシップを管理。 4ヶ国語に堪能。
      icon: tabler:briefcase
cta:
  title: 資格情報を確認したいですか?
  subtitle: 認証コピー、第三者検査報告書、または工場訪問のスケジュールについては、お問い合わせください。
  actions:
    - variant: primary
      text: 認証情報の要求
      href: /contact
    - text: 認定の詳細を表示する
      href: /certifications
