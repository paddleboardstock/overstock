hero:
  tagline: 設備
  title: 製造設備・機械
  subtitle: 裁断、溶接、印刷、組立にわたる産業グレードの設備
  back_label: 工場に戻る
  back_link: /factory

categories:
  - title: 裁断・材料準備
    items:
      - name: PVC 自動裁断機
        spec: CNC 制御、6.5 m × 2.5 m、0.1 mm 精度
        desc: PVC、ハイパロン、ドロップステッチ生地用のコンピューター制御自動裁断機。ネスティングソフトウェアが材料の歩留まりを最適化し、ロスを 5% 未満に抑えます。
      - name: 生地スプレッダー
        spec: 最大幅 3 m、張力制御送り
        desc: 裁断前の歪みを防ぐため、制御された張力で生地を単層または複数層に展開します。

  - title: チューブ溶接・接合
    items:
      - name: 熱溶着機
        spec: 熱風溶接、200～600 °C 可変、0.5～5 m/min
        desc: PVC およびハイパロンのチューブシームの接着・溶着用の熱風熱溶着機。チューブチャンバーとフロート接合部の仮固定、シーリング、溶融に使用します。
      - name: 誘電 RF プレス
        spec: 15 kW、加圧板 2000 × 600 mm
        desc: 主要な縦シーム、トランサムとチューブの接合、大型チャンバーの製造のための高周波溶接プレス。
      - name: CNC 制御 RF 溶接機
        spec: 8 kW、XY テーブル 2500 × 1200 mm
        desc: 複雑な形状、ロゴのエンボス加工、精密なパッチワークのためのプログラマブルな曲線シーム溶接。

  - title: RIB 船体製造
    items:
      - name: グラスファイバー手積み金型
        spec: 全長 6 m までの RIB 船体用の複数金型
        desc: ポリエステルおよびビニルエステル樹脂による従来の手積みグラスファイバー成形。各層は手作業でロールがけされ、真空バッグ処理されて、一貫した積層品質と強度を確保します。
      - name: ゲルコートスプレーブース
        spec: 温度管理、ろ過空気換気
        desc: RIB 船体へのゲルコート塗布。精密な厚み管理により、高光沢で耐 UV 性のある仕上げを提供します。
      - name: CNC ルーター（5 軸）
        spec: 3 m × 2 m × 1 m の可動範囲、水冷スピンドル
        desc: 船体インサート、コンソール金型、シートベース、カスタムブラケットの加工。

  - title: SUP 印刷・装飾
    items:
      - name: デジタルプリンター
        spec: 高解像度インクジェット、印刷幅最大 2 m
        desc: フルカラーの SUP デッキグラフィックのための生地直刷りデジタル印刷。UV 耐性の水性インクで、カスタムパターン、グラデーション、フォト品質の画像を印刷します。
      - name: スクリーン印刷機
        spec: 手動および半自動、多色見当合わせ
        desc: SUP ボードのロゴ、ブランドマーク、リピートパターンのスクリーン印刷。鮮やかな発色の耐久性のある不透明な印刷を提供します。

  - title: 組立・艤装
    items:
      - name: エンジンホイスト
        spec: 500 kg 能力、調整式スプレッダーバー
        desc: 2.5～60 hp の船外機を安全に搭載。
      - name: コンソールモックアップフレーム
        spec: 高さと角度の調整可能
        desc: 取り付け前のステアリング、スロットル、計器パネルの事前艤装。
      - name: 油圧ホース圧着機
        spec: 内径最大 1 インチ、デジタル圧力計
        desc: 圧着フィッティング付きのカスタム長油圧ステアリングホースアセンブリ。
      - name: 電気ハーネスボード
        spec: 3 m × 1.5 m、印刷済み配線図
        desc: 完全な電気ハーネスの艇外での組立とテスト。

  - title: テスト・品質管理
    items:
      - name: 汎用引張試験機
        spec: 50 kN、ASTM D751
        desc: 生地バッチの破断力、破断伸び、裂け伝播テスト。
      - name: 気密保持テスト装置
        spec: プログラマブル、30 分間の圧力保持
        desc: 組立前のすべてのチューブチャンバーへの自動圧力保持テスト。
      - name: シームピール試験機
        spec: 100 mm/min での電動 180° ピール
        desc: ISO 6185 に準拠した溶接・接着シームのピール強度テスト。
      - name: キセノンアーク耐候性試験機
        spec: 2000 時間の曝露
        desc: 色変化と強度保持のための耐 UV 性テスト。

