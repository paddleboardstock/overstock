stories:
  tagline: 'エクスプローラーストーリー'
  title: '本物の人々の本物の冒険'
  subtitle: '水上で Paddle Board Overstock の器材を使うパドラー、家族、プロフェッショナルの声をご紹介します。'
  items:
    - name: 'Sarah & Mike'
      title: 'SUP Explorer 11 オーナー、カナダ'
      content: '私たちは Explorer 11 を持って、アルゴンキン公園を横断する 1 週間の旅に出ました。運搬も湖の横断も文句なしにこなしました。ドロップステッチ構造のおかげで 15 PSI まで空気を入れられ、パックできるボートからハードボード並みの性能を引き出せました。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp'
      location: 'アルゴンキン公園、カナダ'
    - name: 'Carlos R.'
      title: 'Cheetah Surge ライダー、スペイン'
      content: 'Cheetah Surge は私の沿岸クルージングの相棒です。鮮やかなデザインはビーチで注目を集め、安定性はさざ波の中でも自信を与えてくれます。ツーリングでも、サンセットを楽しむときでも、美しく走ります。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp'
      location: 'コスタ・ブラーバ、スペイン'
    - name: 'Lina & family'
      title: 'Flowing Lotus パドラー、スウェーデン'
      content: '週末は群島での家族の冒険です。Flowing Lotus はとても安定していて、私がパドルを漕ぐ間に娘が立っていられます。10 分未満で膨らむので、トレーラーも不要 — 水上での純粋な家族の楽しみです。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp'
      location: 'ストックホルム諸島、スウェーデン'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager エクスプローラー、フィリピン'
      content: '私は Ocean Voyager をパラワン周辺の長距離沿岸ツーリングに使っています。熱帯の環境で毎日数カ月使っても、ボードは新品同様の性能を保っています。ツーリングシェイプは、他のボートなら止まってしまうようなさざ波を切り裂いて進みます。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp'
      location: 'パラワン、フィリピン'
    - name: 'Emma T.'
      title: 'Tropical Breeze 初心者、オーストラリア'
      content: 'それまで SUP に乗ったことがありませんでした。Tropical Breeze はとても安定していて、初挑戦でも自信が持てました。今では毎週末パドルを漕いでいます。習得のハードルはほぼゼロ — 水上のボードの見た目も最高です。'
      image: 'https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp'
      location: 'ゴールドコースト、オーストラリア'

