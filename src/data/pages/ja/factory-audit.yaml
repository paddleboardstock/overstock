content_priorities:
  tagline: クライアントが確認する内容
  title: バイヤーが工場訪問のたびに<br />確認する 8 つのこと
  subtitle: 50 か国以上のバイヤーからのフィードバックに基づいて、これらはクライアントが B2B 注文を行う前に評価する 8 つの優先事項です。
  items:
    - title: 本物のメーカー
      description: 商社ではなく実際の工場ですか？バイヤーは、事業体、実際の生産設備、機械を操作する従業員、現場での現在の製造オーダー、Web サイトとワークショップの一貫性を確認します。
      icon: tabler:building-factory
    - title: 用途に適した製品
      description: RIB は特定の使用例に一致しますか?リゾート、レスキュー、ダイビング、釣り、パトロールのオペレーターには、根本的に異なる要件があります。バイヤーは、展示されているボートのデッキ レイアウト、チューブの材質、装備のオプションを評価します。
      icon: tabler:target
    - title: 品質の安定性と再現性
      description: 50号機も1号機と同じくらい良いですか？バイヤーは、QC システム、工程内のチェックポイント、不適合の処理を検査し、一貫性を検証するために複数の生産実行からの記録を参照するよう求めます。
      icon: tabler:repeat
    - title: コンプライアンス文書の信頼性
      description: CE 証明書はモデル固有のものですか? DoC は実在の人物によって署名されていますか?船体番号ごとに適合性を確認できますか?購入者は包括的な主張とモデル固有の文書を確認します。
      icon: tabler:file-certificate
    - title: カスタマイズの実行
      description: 工場は実際にカスタム構成を提供できますか?バイヤーは、過去のカスタム プロジェクトの証拠、展示されているプロトタイプ サンプル、エンジニアリング図面、およびその場で技術的な変更について話し合える能力を探します。
      icon: tabler:adjustments
    - title: リードタイムと生産能力
      description: 引用されたタイムラインは現実的ですか?バイヤーは、現在の生産量、利用可能な能力、労働力の規模、材料の在庫レベル、工場に生産計画システムがあるかどうかを評価します。
      icon: tabler:clock
    - title: 価格と取引条件
      description: 価格は透明ですか? FOB価格は明確ですか?バイヤーは、単価の内訳、工具コスト、梱包コスト、工場が適切な輸出書類を備えた DDP または CIF 条件に対応できるかどうかを確認します。
      icon: tabler:currency-dollar
    - title: アフターセールスおよびスペアパーツ
      description: 納品後はどうなりますか?購入者は、スペアパーツの入手可能性、保証プロセス、交換用チューブセクション、バルブ交換、および工場に文書化されたアフターセールスプロトコルがあるかどうかを評価します。
      icon: tabler:headset
content_tour:
  tagline: 工場見学ルート
  title: 監査ツアー —<br />何が見えるのか
  subtitle: 当社の標準的な工場ツアーは、各ステーションでバイヤーの質問に答えるように設計された定義されたルートに従います。
  items:
    - title: 1. 会議室 – 会社紹介
      description: ビジネスライセンス、ISO 9001 および BSCI 証明書、輸出ライセンス、および会社の歴史。生産能力とコンプライアンスの範囲の概要。
      icon: tabler:users
    - title: 2. 原材料倉庫 — IQC ステーション
      description: 入荷した材料の検査記録、生地のバッチ証明書、接着剤およびハードウェアのサンプル。生産に入る前に材料がどのようにテストされるかをご覧ください。
      icon: tabler:building-warehouse
    - title: 3. チューブの製造 – RF 溶接と手による接着
      description: ライブチューブ溶接または接着プロセス、継ぎ目強度テストのデモンストレーション、およびバルブの取り付け。チャンバーごとの構造と品質チェックポイントを観察します。
      icon: tabler:flame
    - title: 4. 船体の積層 — GRP ワークショップ
      description: グラスファイバーのレイアッププロセス、ゲルコートの塗布、船体の硬化。さまざまな RIB モデルの積層スケジュールと構造補強を参照してください。
      icon: tabler:layers-subtract
    - title: 5. 組み立てと統合
      description: 船体チューブの接合、コンソールとシートの取り付け、電気および燃料システムの統合、および機器の取り付け。実際に稼働している生産ラインを見学します。
      icon: tabler:tool
    - title: 6. 圧力試験ステーション
      description: 1.25x 定格圧力で 24 ～ 48 時間の圧力保持テスト。テスト記録、圧力計、合否基準を表示します。テスト結果が船体のシリアル番号にどのように関連付けられているかを確認してください。
      icon: tabler:gauge
    - title: 7. 最終検査と品質管理
      description: ユニットごとの 100 点の品質チェックリスト、寸法検証、外観検査、およびパッケージの完全性チェック。不適合ログと是正措置記録を確認します。
      icon: tabler:clipboard-check
    - title: 8. 書類審査室
      description: モデルごとのコンプライアンス文書 (DoC、ビルダー プレート、オーナー マニュアル)、製造トレーサビリティ記録、HIN レジストリ、材料バッチ追跡データベースのデモンストレーション。
      icon: tabler:folder
content_qc_chain:
  tagline: 品質の証拠
  title: 8 段階の QC チェーン<br />— 各ステップで検証可能
  subtitle: 当社の品質管理チェーンは、材料の入荷から最終出荷まで続き、あらゆる段階で文書化された証拠が存在します。
  items:
    - title: 'ステージ 1: 受入材料検査'
      description: PVC、ハイパロン、グラスファイバー、アルミニウム、接着剤、ハードウェアのすべてのバッチは、生産に入る前に仕様に照らしてテストされます。 AQL 2.5/ISO 2859 に準拠した引張強度、コーティング密着性、および寸法チェック。
      icon: tabler:package
    - title: 'ステージ 2: チューブの溶接/接着 QC'
      description: 生産バッチごとの継ぎ目剥離強度テスト。 RF 溶接パラメータが監視および記録されます。手で接着された継ぎ目は、接着剤の塗布範囲と硬化時間が一貫しているかどうかをチェックされています。
      icon: tabler:flame
    - title: 'ステージ 3: 船体のラミネート QC'
      description: ゲルコートの厚さ測定、ラミネートスケジュールごとのグラスファイバーレイアップ検証、および硬化時間のモニタリング。構造補強の位置を設計図面と照合して確認します。
      icon: tabler:layers-subtract
    - title: 'ステージ 4: 組み立てと統合の QC'
      description: 船体とチューブの接合部の完全性、コンソールとシートの取り付けトルク、電気的導通、および燃料システムの漏れテスト。各取り付けポイントは、モデル固有の組み立てチェックリストに照らして検証されます。
      icon: tabler:tool
    - title: 'ステージ 5: 圧力保持テスト'
      description: すべての膨張式チャンバーは定格 PSI の 1.25 倍まで加圧され、24 ～ 48 時間保持されます。チャンバーごとに記録された圧力損失。合格/不合格のしきい値が文書化されています。船体のシリアル番号にリンクされています。
      icon: tabler:gauge
    - title: 'ステージ 6: 最終検査'
      description: 寸法精度、表面仕上げ、付属品の完全性、文書パッケージ、およびパッケージの完全性を網羅する 100 ポイントの品質チェックリスト。制作チームから独立。
      icon: tabler:clipboard-check
    - title: 'ステージ 7: コンプライアンス文書'
      description: モデル固有の DoC、ビルダー プレートの検証、オーナー マニュアルの完全性、および HIN レジストリ エントリ。すべてのコンプライアンス文書は出荷リリース前に準備および検証されます。
      icon: tabler:file-certificate
    - title: 'ステージ 8: 出荷のリリースとトレーサビリティ'
      description: 最終リリースでは、すべての QC 段階に合格し、コンプライアンス文書が完成し、出荷文書が検証される必要があります。船体記録は閉鎖され、10 年以上保存されるようにアーカイブされました。
      icon: tabler:truck
content_traceability:
  tagline: 生産トレーサビリティ
  title: HIN → マスターファイル →<br />船体記録 → 納品
  subtitle: すべての RIB ボートには、完全な生産およびコンプライアンスの記録チェーンにリンクされた固有の船体識別番号が付いています。
  items:
    - title: 船体識別番号 (HIN)
      description: 14 文字の一意の識別子が各ボートに永続的にマークされます。メーカーコード (MIC)、モデル指定、製造年、シリアル番号をエンコードします。完全なトレーサビリティ チェーンのロックを解除する鍵。
      icon: tabler:hash
    - title: マスターテクニカルファイル
      description: モデル ファミリのコンプライアンスおよびエンジニアリングに関するドキュメント。 GA 図面、リスク評価、安定性計算、材料仕様、および適用される規格が含まれています。 Linked to all hulls of that model.
      icon: tabler:folder
    - title: 個別の船体記録
      description: '船体ごとの生産記録: HIN、生産日、チューブバッチ、材料証明書、圧力試験結果、最終構成、エンジン仕様、品質チェックリストの結果、納品先。船体ごとに 21 以上のデータ フィールド。'
      icon: tabler:file-description
    - title: カスタマーコンプライアンスパック
      description: DoC、ビルダー プレートの写真、オーナー マニュアル、コンプライアンス チェックリスト、最終構成シートを含む船体ごとの配送パッケージ。ボートと一緒に出荷され、工場で10年以上保管されていました。
      icon: tabler:package
content_red_flags:
  tagline: 監査の落とし穴
  title: 危険信号を発している購入者<br />簡単に見分けられる
  subtitle: 工場監査中に購入者の信頼を損なう一般的な問題。一つ一つに積極的に取り組んでいきます。
  items:
    - title: モデル範囲のないブランケット CE クレーム
      description: 'どの指令、どのモデル、どの適合モジュールを指定せずに「全製品 CE 認証済み」。危険信号: コンプライアンスがモデルごと、構成ごとではなく、表面的なものであることを示唆しています。'
      icon: tabler:alert-triangle
    - title: 物理的検査の証拠がない
      description: '工場の現場にテスト記録、ゲージ、またはテストステーションが表示されていない圧力テストのクレーム。危険信号: 訪問中に品質に関する主張を確認することはできません。'
      icon: tabler:alert-triangle
    - title: 不足している材料のトレーサビリティ
      description: 'バッチ記録、受入検査、または材料証明書と最終製品間のリンクはありません。危険信号: 品質の問題を発生源まで追跡する方法がありません。'
      icon: tabler:alert-triangle
    - title: 一般的なドキュメント
      description: 'すべてのモデルをカバーする 1 つの DoC で、HIN 固有の記録や「テンプレート」コンプライアンス文書はありません。危険信号: コンプライアンスは個々の生産ユニットに関連付けられていません。'
      icon: tabler:alert-triangle
content_shipping:
  tagline: 出荷と梱包
  title: RIBボートのコンテナ積み込み<br />と木枠梱包
  subtitle: 当社の出荷ソリューションは、青島から目的地の港まであなたの投資を保護します。すべてのモデルに対してコンテナ積み込み計画と梱包仕様書をご用意しています。
  items:
    - title: 20フィートコンテナ構成
      description: 標準20フィートコンテナ：RIBボート1〜2隻（4.0〜5.5 m）を甲板とチューブを分離してネスト式に積み込むか、SUPボード8〜12枚。RIB＋SUPの混合構成も可能です。ご注文ごとに詳細な積み込み計画を提供します。
      icon: tabler:box
    - title: 40フィートコンテナ構成
      description: 標準40フィートコンテナ：RIBボート2〜4隻（最大7.0 m）を船体をネストしチューブを積み重ねて搭載するか、SUPボード20〜30枚。背の高いRIBモデルには40フィートHQもご利用いただけます。容積を最適化した積み込みで1台あたりの輸送コストを削減します。
      icon: tabler:container
    - title: RIB船体用の木枠梱包
      description: アルミおよびGRP船体は、フォームクッション、防湿バリア、鋼帯を使用した特注の木枠で梱包されます。モデルごとの木枠寸法と重量は物流計画用にご用意できます。ISPM-15熱処理木材認証付き。
      icon: tabler:wood
    - title: チューブ・甲板分離梱包
      description: チューブは空気を抜いて船体とは別に折りたたまれ、スペース効率を高めます。甲板プレート、コンソール、シートは保護包装され、取り付け金具キットが同梱されます。再組み立て手順書が毎回の出荷に含まれます。
      icon: tabler:package
    - title: 湿気・腐食保護
      description: アルミ部品用のVCI防錆紙、シリカゲル乾燥剤、真空密封された金具袋。30〜45日の海上輸送中の結露による損傷を防ぎます。
      icon: tabler:droplet-off
    - title: FOB青島ドキュメント
      description: 船荷証券、商業インボイス、パッキングリスト、原産地証明書、および出荷ごとの適合ドキュメント。FCLおよびLCLの混載が可能です。EU、米国、中東市場向けの通関ドキュメントサポートをご提供します。
      icon: tabler:file-text
faq:
  title: 工場監査 — よくある質問
  questions:
    - q: 工場を直接訪問することはできますか?
      a: はい。当社は、12,000 平方メートルの青島施設でのオンサイト工場監査を歓迎します。当社の標準ツアーは、原料倉庫から書類審査室までの 8 つのステーションをカバーします。初期資格取得のために、ビデオ通話によるバーチャル工場見学も可能です。
    - q: 第三者監査（BSCI、SMETA、SGS）を受け入れますか?
      a: はい。当社は BSCI 認証 (Intertek) を維持しており、顧客固有の監査プロトコルを歓迎しています。ご要望に応じて、SGS または TÜV 検査を手配することもできます。監査レポートは NDA に基づいて入手できます。
    - q: 訪問中に圧力検査を見ることはできますか?
      a: 当社の圧力試験ステーションは標準ツアー ルートの一部です。生産スケジュールに応じて、ゲージの読み取り値とテスト記録を含むアクティブな圧力テストを観察することができます。船体ごとの圧力テストのログはいつでも確認できます。
    - q: 不適合品の場合はどのように対応していますか？
      a: 不適合ユニットは、ISO 9001 是正措置プロセスに従って隔離され、文書化され、レビューされます。根本原因の分析が実行され、是正措置が実施され、記録が維持されます。バイヤーは監査中に NCR ログを確認できます。
    - q: どのようなコンプライアンス文書を確認できますか?
      a: 監査中に、モデル固有の DoC サンプル、ビルダー プレート仕様、HIN レジストリ、オーナー マニュアル草案、該当する規格リスト、モデル ファミリごとの適合性評価記録を確認できます。
    - q: バーチャル工場ツアーを予約するにはどうすればよいですか?
      a: WhatsApp、Zoom、または Teams を介してライブ ビデオ ツアーをスケジュールするには、弊社の営業チームにお問い合わせください。私たちは同じ 8 駅のルートをたどっており、お客様の興味に基づいて特定のエリアに焦点を当てることができます。一般的なバーチャル ツアーは 45 ～ 60 分です。
    - q: 工場は実際のメーカーですか、それとも商社ですか？
      a: 実際の製造元は Aquafarer です。私たちは青島莱西市に工場を運営しています。ビジネスライセンス、製造範囲、物理的な生産はすべて監査中に検証可能です。
    - q: どのような品質記録を確認できますか?
      a: 受入材料検査記録、工程内 QC チェックポイント、圧力試験ログ、100 ポイントの最終検査チェックリスト、不適合報告書、是正措置記録、船体ごとのトレーサビリティ記録。すべて ISO 9001 要件に従って維持されます。
cta:
  title: 工場見学を予約する
  subtitle: ライブビデオ工場ツアーを予約したり、青島施設への現地訪問を計画したりできます。当社の生産、QC システム、コンプライアンス文書を直接ご覧ください。
  actions:
    - variant: primary
      text: ライブ工場ビデオツアーを予約する
      href: /contact
    - text: QC チェックリストをリクエストする
      href: /contact
content_audit_evidence:
  tagline: 検証証拠
  title: 監査証拠<br />現場で検証可能
  subtitle: 工場訪問中に、クライアントは各生産地域での特定の証拠を確認できます。何を探すべきか、そしてすべての監査に対して私たちが準備するものは次のとおりです。
  areas:
    - area: 原料倉庫
      what_to_verify: 材料は安定していますか？バッチ混合はありますか?
      evidence: 受入検査記録、バッチラベル、FIFOストレージ、サプライヤー承認リスト、材料証明書（PVC、Hypalon、グラスファイバー、アルミニウム、接着剤、ハードウェア）
      icon: tabler:building-warehouse
    - area: "チューブ生産"
      what_to_verify: 縫い目の強度や気密性はどのようにして確保されているのでしょうか？
      evidence: プロセスカード、初品確認、チャンバーごとの圧力テスト記録、修理および再テストログ、バルブ取り付け記録
      icon: tabler:flame
    - area: "船体生産"
      what_to_verify: 構造の一貫性はどのように制御されますか?
      evidence: 管理されたプロセス文書、品質チェックポイント、半製品の番号付け、ゲルコートの厚さの測定、ラミネートスケジュールの検証
      icon: tabler:layers-subtract
    - area: "組立エリア"
      what_to_verify: オプションパーツの誤組み付けはどのように防止されていますか？
      evidence: BOM、作業指示書、構成チェックリスト、ワークステーション検査カード、モデルごとのトルクおよび機能チェック
      icon: tabler:tool
    - area: "検査ステーション"
      what_to_verify: 納車前にボートが良好であることをどのように確認しますか?
      evidence: テスト手順、機器リスト、校正記録、圧力テストログ (1.25x / 24 ～ 48 時間)、機能テストチェックリスト、文書化された合否基準
      icon: tabler:gauge
    - area: 不適合エリア
      what_to_verify: 欠陥はどのように処理されますか?
      evidence: 隔離ラベル、NCR ログ、根本原因分析、やり直し承認記録、CAPA (是正措置および予防措置) 追跡
      icon: tabler:alert-triangle
    - area: 完成品倉庫
      what_to_verify: 誤出荷や破損をどうやって防ぐのか？
      evidence: 完成品ラベル、発注照合記録、梱包基準、出荷前検査記録
      icon: tabler:box
    - area: スペアパーツとアフターセールス
      what_to_verify: 長期のアフターサポートはしてもらえますか？
      evidence: 共通スペアパーツリスト、在庫戦略、パーツ番号付けシステム、保証プロセス文書、メンテナンスチュートリアル
      icon: tabler:headset
content_closing_script:
  tagline: 注文に応じた監査
  title: 工場訪問<br />プロジェクト確定まで
  subtitle: 監査の成功は写真と握手だけで終わってはいけません。出発する前に、3 つの商業的成果が文書化されていることを確認します。
  items:
    - title: 技術構成の確認
      description: モデル、アプリケーション、主要なオプション、対象市場、推定数量、納品スケジュールについて合意し、すべて出発前に文書化します。
      icon: tabler:checklist
    - title: 次のステップの書類を確認する
      description: 'Aquafarer が次に提供するものを定義します: 改訂された GA、構成リスト、見積書、文書チェックリスト、サンプル計画、NDA など — 具体的なタイムラインとともに。'
      icon: tabler:file-plus
    - title: 相互のタイムラインを確認する
      description: 3営業日以内に構成の修正と事前見積もりを行います。 7日以内にサンプルまたは外観確認。 14 日以内のエンジニアリングレビューまたは第三者検査。次回の会議の日付と責任者はロックされています。
      icon: tabler:calendar

