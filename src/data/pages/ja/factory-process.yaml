intro: 製造を第三者工場に外注するブランドとは異なり、Paddle Board Overstock は製造チェーン全体を自社で所有・運営しています。この垂直統合により、各段階で厳格な品質管理を維持し、カスタム要求に迅速に対応し、ロットごとに一貫した製品品質を提供できます。当社工場でのボート製造の流れをご紹介します。

steps:
  - step: '01'
    title: 材料受入と検査
    description: 入荷するすべての PVC 生地、グラスファイバーマット、樹脂、金物類は仕様書に照らして検査されます。生地サンプルは生産投入前に引張強度、厚み均一性、耐 UV 性のテストを受けます。不適合材料は隔離され、返品されます。
    duration: 1～2 日
  - step: '02'
    title: PVC 自動裁断
    description: 承認された生地は自動 CNC 裁断機に載せられ、サブミリ精度で裁断されます。コンピュータで最適化されたネスティングがパネルを配置してロスを最小化します — 通常は 5% 未満です。裁断されたパネルはボートモデルおよびチャンバーごとにラベル付けされ、溶接ワークショップへ移送されます。
    duration: ボートキットあたり 2～4 時間
  - step: '03'
    title: チューブ熱融着と溶接
    description: パネルは熱融着機で、管理された 200～600 °C の熱風溶接により仮固定・接着されます。主要シームは気密性と高強度の接合のために RF 誘電溶接で補強されます。完成したチャンバーは使用圧力の 1.25 倍で 30 分間の気密検証が行われます。
    duration: ボート 1 隻あたり 1～2 日
  - step: '04'
    title: グラスファイバー RIB 船体成形
    description: RIB ボートの船体はハンドレイアップ方式のグラスファイバー成形で生産されます。グラスファイバーマットとロービングクロスの層を、精密金型の中でポリエステル樹脂またはビニルエステル樹脂とともに手作業でローリングします。各層は一貫した積層品質のために真空バッグ処理されます。船体は高光沢・耐 UV の海洋表面とするためジェルコートで仕上げられます。
    duration: 船体 1 基あたり 2～4 日
  - step: '05'
    title: SUP の印刷と装飾
    description: SUP ボードのデッキグラフィックは、フルカラー写真品質のデザインにはデジタル印刷を、耐久性のあるロゴや反復パターンにはスクリーン印刷を用いて施されます。印刷は UV ・耐摩耗性を高めるために硬化・シール処理されます。
    duration: 1～2 日
  - step: '06'
    title: 最終組立と艤装
    description: グラスファイバー船体と PVC チューブ組立体は組立ラインで結合されます。エンジンを搭載し、操舵・スロットルコントロールを接続し、燃料システムを取り付け、電気配線全体を結線します。各ボートは 100 項目の組立チェックリストに従い、各段階で必須の確認サインが行われます。
    duration: 2～3 日
  - step: '07'
    title: 品質テストと検査
    description: '完成したすべてのボートは必須の品質ゲートを通過します：チャンバー気密テスト、各システムの機能チェック、締結トルク検証、外観検査。カスタム艇と試作艇には、速度・操縦性・安定性・耐久性をカバーする水上試験航行も実施されます。'
    duration: 1～2 日
  - step: '08'
    title: 梱包と出荷
    description: ボートは空気を抜き、手順に従って折りたたまれ、丈夫な編布バッグまたは合板クレートに梱包されて出荷されます。各パッケージにはモデル、シリアル番号、宛先のラベルが付けられます。世界中への FCL・LCL コンテナ輸送のため、フォワーダーとの調整を行います。
    duration: 1 日

