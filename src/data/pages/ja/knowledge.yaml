hero:
  tagline: 'ナレッジグラフ'
  title: '水上探究ナレッジ'
  subtitle: |
    インフレータブル SUP テクノロジー、水上安全、ボートエンジニアリング、<br />
    冒険計画を網羅する構造化されたナレッジベース。
  taglineSection: '探索する。学ぶ。自信を持って出かける。'

clusters:
