      description: 'ウォータースポーツビジネスの構築と拡大のための商業ガイド — レンタル運用からプライベートブランドまで。'
      icon: 'tabler:briefcase'
      topics:
        - 'SUP レンタルビジネスの始め方'
        - 'リゾートウォータースポーツセンターの作り方'
