        - 'SUP 安全チェックリスト'
    - title: 'ボートナレッジ'
      description: 'インフレータブルボート、RIB、ディンギー、カヤックの技術ガイド — エンジニアリング、材料、運用。'
      icon: 'tabler:sailboat'
      topics:
        - 'インフレータブルボートのタイプ解説'
        - 'PVC とハイパロンの比較'
        - 'RIB とディンギーの比較'
        - 'ドロップステッチテクノロジーの深掘り'
