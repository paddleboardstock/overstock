hero:
  tagline: 私たちのチーム
  title: 'Paddle Board Overstock を支える人々<br />— 水上の自由をエンジニアリングする'
  subtitle: '2012 年に中国・青島で創業した Paddle Board Overstock は、プロフェッショナルグレードのインフレータブルウォータークラフトを世界中の誰もが手にできるようにしたいと信じる、海洋エンジニア、材料科学者、ウォータースポーツ愛好家によって築かれました。'
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock 全チームの写真 — エンジニアリング、生産、リーダーシップ
founding:
  tagline: 私たちの創業
  title: '沿岸の工房から<br />12,000㎡ の施設へ'
  subtitle: 'Paddle Board Overstock は、インフレータブルボートの設計、PVC/ハイパロン製造、世界の海洋機器製造で合計数十年の経験を持つ海洋エンジニアのチームによって創業されました。'
  items:
    - title: '創業：2012 年'
      description: '中国・青島に設立 — 造船の伝統が深い主要な海洋拠点です。'
      icon: tabler:calendar
    - title: '200～300 名の従業員'
      description: '50 名以上の R&D エンジニア、品質管理スペシャリスト、生産技術者を含みます。'
      icon: tabler:users
    - title: '12,000㎡ の施設'
      description: 'RIB、インフレータブルボート、SUP ボードのための 6 つの生産ラインを備えた専用工場。'
      icon: tabler:building-factory
    - title: '50 カ国以上に納入'
      description: 'ヨーロッパ、南北アメリカ、中東、アジア太平洋、アフリカへ輸出しています。'
      icon: tabler:globe
leadership:
  tagline: リーダーシップ
  title: '経営・エンジニアリング リーダーシップ'
  subtitle: '私たちのリーダーシップチームは、海洋エンジニアリング、国際貿易、品質管理の深い専門性を結集しています。'
  columns: 3
  items:
    - title: '創業者・CEO'
      name: 'Toby Liu'
      description: '海洋製造業 15 年以上の経験。中国の大手ボートメーカーで R&D を統括。インフレータブルボート設計で複数の特許を保有。'
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: 'チーフエンジニア'
      name: 'Zhang Wei'
      description: 'PVC/ハイパロン製造と深 V 船体設計 20 年以上の経験。ヨーロッパの海洋エンジニアリング会社で技術部長を務めていました。'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'R&D 責任者'
      name: 'Chen Ming'
      description: '材料科学の博士号。ドロップステッチテクノロジーと高周波溶接プロセスが専門。繊維複合材料 10 年以上の経験。'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: '生産ディレクター'
      name: 'Liu Qiang'
      description: 'リーンマニュファクチャリングと生産ライン最適化 18 年以上の経験。シックスシグマ ブラックベルト。ISO 9001 品質システムを導入。'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: '品質マネージャー'
      name: 'Wang Fang'
      description: '海洋品質管理 12 年以上の経験。CE・ISO 審査員資格保有。すべての生産バッチのテストを監督。'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: '営業・オペレーションズディレクター'
      name: 'Helen Lee'
      description: '国際 B2B 貿易 15 年以上の経験。30 カ国以上の OEM/ODM パートナーシップを管理。4 カ国語に精通。'
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: デザイン哲学
  title: 'エンジニアリング主導のデザイン<br />— すべての細部が重要'
  subtitle: '私たちのエンジニアリング哲学は、作るすべての製品を導く 3 つの原則を中心にしています。'
  list:
    - '信頼性第一：すべての Paddle Board Overstock 製品は、冷水での救助活動から熱帯のリゾートレンタルまで、実世界の条件に耐えるようテストされています。最も重要な箇所では、必要以上の設計余裕を持たせています。'
    - '製造の精密さ：当社の施設は CNC 裁断、高周波溶接、自動圧力テストを使用しています。すべてのシーム、すべてのバルブ、すべての継手が文書化された仕様を満たします。'
    - '継続的なイノベーション：当社の R&D チームは、新しい材料、生産方法、設計改善を継続的に評価します。問題を待つのではなく — 先を読みます。'
cta:
  title: '私たちのチームとプロジェクトについて相談したいですか？'
  subtitle: '当社のエンジニアが、製品選定、カスタマイズ、OEM/ODM パートナーシップについてアドバイスする準備ができています。'
  actions:
    - variant: primary
      text: チームに連絡する
      href: /contact
    - text: 製品を表示する
      href: /products
