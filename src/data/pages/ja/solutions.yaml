features3_solutions:
  tagline: ソリューション
  title: 'あなたのウォーターアドベンチャー<br />ビジネスパートナー'
  isBeforeContent: false
  columns: 3
  items:
    - title: ウォータースポーツクラブ
      description: 'SUP クラブ、カヤッククラブ、サーフスクール、トレーニングセンターのための器材フルパッケージ、カスタムブランディング、メンテナンスプログラム。'
      icon: tabler:users
      link: /solutions/clubs
    - title: ウォータースポーツ用 RIB
      description: 'セーリングスクール、ウォータースポーツセンター、イベント組織のための専用設計 RIB。プロフェッショナルウォータースポーツのためのコーチボート、曳航ボート、マーシャル艇。'
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: リゾート・ホテル
      description: 'ホテル・リゾート向けの、フリート器材、安全システム、スタッフ研修、収益管理を備えたプレミアムウォータースポーツプログラム。'
      icon: tabler:beach
      link: /solutions/resorts
    - title: ウォーターブランド起業家
      description: '新規ブランドオーナーのための、低 MOQ のプライベートブランド OEM/ODM 製造、カスタム製品デザイン、パッケージング、グローバル出荷。'
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: ダイビングセンター艇
      description: '容易なエントリー/エキジット、器材格納、ダイブ運用に最適化されたエンジン構成を備えた安定した RIB プラットフォーム。'
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: 救助・緊急用ウォータークラフト
      description: '捜索救助、緊急対応、沿岸警備運用のために設計された高速 RIB とインフレータブルボート。'
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: ヨットテンダーソリューション
      description: 'スーパーヨットやレジャー艇を引き立てる、コンパクトでスタイリッシュな RIB テンダー。簡単な収納とパワフルな性能。'
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: フィッシングボートソリューション
      description: '商業・レジャー釣りの運用向けに構成された、安定性と耐久性に優れたインフレータブルボートと RIB。'
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: マリンツーリズム器材
      description: 'リゾート、ツアー事業者、ウォータースポーツレンタルビジネスのための、フリート対応インフレータブルボート、SUP ボード、カヤック。'
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: オフショアエネルギー用 RIB
      description: '石油・ガスプラットフォーム支援、風力発電所の人員輸送、海底ケーブル検査、海洋建設のためのヘビーデューティ RIB。'
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: 養殖作業艇
      description: '養殖、真珠栽培、海洋牧場のための耐食性 RIB。ハイパロンチューブ、ステンレス製ハードウェア、日常使用に耐える耐久性。'
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: 海洋調査・観測
      description: '海洋研究、環境モニタリング、水質サンプリング、大学教育プログラムのための、計器搭載に対応した安定した RIB。'
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: 商業作業艇
      description: 'パトロール、調査、輸送、オフショア物流のためのヘビーデューティ RIB。商業運用の厳しい要求のために造られています。'
      icon: tabler:ship
      link: /commercial-workboats
