hero:
  tagline: "ガイド"
  title: SUPは初めてですか？
  subtitle: "インフレータブルウォータースポーツ機器の選び方・使い方・楽しみ方を実践的なガイドでご案内します。"
size_guide:
  tagline: "サイズと仕様"
  title: "ニーズに合ったサイズを見つける"
  desc: "製品の寸法、積載重量、推奨用途を比較できます。ツーリング SUP、コンパクトなカヤック、業務用 RIB のいずれをお探しでも — サイズガイドが最適な選択をお手伝いします。"
  link_label: "製品仕様付きの完全サイズガイド →"
  link: /size-guide
  cards:
    - title: SUPボード
      desc: "体重と用途に基づいて長さを選びましょう。幅の広いボード（32インチ以上）は安定性に優れます。長いボード（11～12フィート）はツーリングでの直進性に優れています。"
    - title: "カヤック"
      desc: 9フィートのシングルカヤックはソロツーリングや川下りに最適。12フィートのタンデムカヤックは2人乗りまたは1人＋荷物向け。必ず積載重量を確認してください。
    - title: "ディンギーとRIB"
      desc: "乗船人数と用途で長さを選びましょう。大型 RIB（4.5 m以上）は沖合・救助用。小型ディンギー（2.7 m）はテンダーや釣り台として最適です。"
