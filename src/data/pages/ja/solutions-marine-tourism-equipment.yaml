content_challenge:
  tagline: 挑戦
  title: 'マリンツーリズムには<br />信頼性の高い乗客仕様の船が不可欠'
  subtitle: 'ツーリズム事業者には、毎日の乗客送迎、変化する海況、高いゲストの期待に対応しながら、メンテナンスを低く抑え、収益性の高い運用を維持できるボートが必要です。'
  paragraphs:
    - 'モルディブ、フィリピン、インドネシア、タイなどの目的地の島嶼ツーリズム事業者は、毎日乗客送迎、シュノーケリングトリップ、海洋エクスカーションを運営しています。彼らのボートは、メンテナンスのためのダウンタイムを最小限に抑えながら、海水環境で年間 300 日以上運用されています。'
    - '**島間送迎**には、リゾート、空港、ダイビングサイト間の迅速で快適な乗客輸送が必要です。乗客は滑らかな走行、簡単な乗船、日差しや飛沫からの保護を期待しています。遅いボートや快適性の低いボートは、ゲスト満足度とリピート予約に直接影響します。'
    - '**ホエール・ドルフィンウォッチング**事業者には、野生動物に素早く到達し、安定した観察プラットフォームを維持し、海洋生物を乱さないよう静かに運用できるボートが必要です。速度、安定性、機動性が重要です — 乗客は船酔いせずに間近での遭遇を期待しています。'
    - '**アドベンチャーツーリズム**企業は、沿岸探検ツアー、洞窟エクスカーション、海洋野生生物体験を運営しています。彼らのボートは外洋から浅い入り江まで多様な環境を航行するため、汎用性の高い船体設計と信頼できる構造が必要です。'
    - 'すべてのセグメントで、耐食性、燃費、乗客の快適性が最大の関心事です。故障や頻繁な修理が必要なボートは、収益の損失、ツアーのキャンセル、評判の低下を意味します。'
content_solution:
  tagline: 私たちのソリューション
  title: 'ツーリズムグレード RIB<br />とフリート器材'
  subtitle: 'Paddle Board Overstock は、乗客運用のための商用 RIB ボートと、リゾートアクティビティプログラムのためのフリート器材（SUP、カヤック、インフレータブル）の両方を、単一のサプライヤーから提供します。'
  list:
    - '4.8m から 8m までの商用乗客 RIB — 島間送迎、シュノーケリングツアー、野生生物観察用に構成'
    - '背もたれと日よけ付きの快適なシート — 1～2 時間のツアー時間に対応する乗客の快適性'
    - '安定性のための広いビームとディープ V 船体 — 船酔いを軽減し、乗客の安心感を高めます'
    - '野生生物観察のための静音エンジンオプション — 海洋動物への影響を最小限に'
    - 'ダイブラダーとスイムプラットフォーム — シュノーケリングと遊泳エクスカーションに不可欠'
    - 'カスタムブランディングとカラースキーム — すべての船に貴社のロゴとフリートリバリーを'
    - 'RIB の大量発注向けフリート価格 — 複数艇運用で一貫した仕様'
    - 'リゾートでのゲストアクティビティプログラムのための SUP ボード、カヤック、インフレータブルボート'
    - 'スペアパーツとメンテナンスサポート — 観光ピークシーズンのダウンタイムを最小化'
content_segments:
  tagline: ツーリズムセグメント
  title: '運用タイプ別の<br />マリンツーリズムソリューション'
  subtitle: 'ツーリズム運用の種類によって、必要なボートの構成は異なります。Paddle Board Overstock が、お客様の具体的な用途に合った RIB をご提案します。'
  items:
    - title: 島間送迎事業者
      subtitle: 'モルディブ、フィリピン、インドネシア、タイ — 毎日のゲスト輸送'
      description: '東南アジアおよびモルディブの島嶼ツーリズム事業者は、空港、リゾート、ダイビングサイト間の乗客送迎を — しばしば年間 300 日以上 — 毎日運営しています。ボートはゲスト体験の基幹です。故障は、立ち往生するゲスト、キャンセルされた予約、評判の低下を意味します。こうした事業者には、メンテナンスサポートが限られ、部品の入手が困難な遠隔地での高頻度使用に耐えられるボートが必要です。'
      features:
        - '年間 300 日以上の運用日に対応した商用グレード構造'
        - '8～16 名の乗客のための背もたれ付き快適ベンチシート'
        - 'トロピカルな日差しと飛沫から守る Tトップまたはビミニ日よけ'
        - '荷物を持ったゲストが楽に乗降できる幅広乗船プラットフォーム'
        - 'ゲストのバッグやリゾートの備品のためのドライ収納庫'
        - '燃費に優れた 4 ストローク船外機 — トリップあたりの運用コストを低減'
        - '熱帯環境で 5～8 年の寿命に対応するヘビーデューティハイパロンチューブ'
        - 'メンテナンスしやすい設計 — 遠隔地でも整備しやすいアクセス性の高い部品配置'
    - title: ホエールウォッチング事業者
      subtitle: '外洋対応力、観察海域への速達性、安定したプラットフォーム'
      description: 'ホエールウォッチングは、ハーベイベイ（オーストラリア）、ケイコラ（ニュージーランド）、バハカリフォルニア（メキシコ）、アゾレス諸島などの地域で運営される、季節性ながら高付加価値のツーリズムセグメントです。事業者は、鯨が潜るまたは移動する前に外洋の観察海域へ素早く到達し、長時間の観察に安定したプラットフォームを維持し、海洋哺乳類を乱さないよう静かに運用しなければなりません。2～4 時間のツアー中の乗客の快適性は、レビューとリピート予約に直接影響します。遅いボートや不安定なボートは、機会損失と返金につながります。'
      features:
        - '外洋での航行力を備えた 7～10m RIB 構成'
        - '静かな 4 ストローク船外機 — 騒音と振動の影響を最小限に'
        - '停泊時に優れた安定性を発揮するディープ V 船体 — 快適な観察プラットフォーム'
        - 'ゲストの撮影のための手すり付き船首観察プラットフォーム'
        - '完全な天候保護 — 外洋条件に対応する Tトップまたはクローズドコンソール'
        - '2～4 時間のツアー時間の快適性のために設計された人間工学に基づくシート'
        - '長時間の海水曝露と耐 UV 性に対応するマリングレード材料'
    - title: ドルフィンウォッチング事業者
      subtitle: '高速追跡、多人数乗車能力、静音接近'
      description: 'ドルフィンウォッチング事業者には、異なるバランスの能力が必要です。イルカは鯨よりも速く、より活発なため、素早く加速し、正確に操縦し、群れを驚かせずに接近できるボートが求められます。これらのツアーは通常、1 トリップあたりの乗客が多く、岸により近い海域で運用されます。静音運用が決定的に重要です — 大きなエンジン音に慣れたイルカはボートを避けるようになり、遭遇率が下がります。事業者はまた、観光ピークシーズンの 1 日複数便のスケジュールに対応する信頼性の高いボートを必要としています。'
      features:
        - '機動性、速度、浅瀬へのアクセスに対応する 5.5～8m RIB'
        - '活発なイルカの群れに到達するための高速加速'
        - '静かな排気と低振動の船体で間近への接近'
        - '停泊時の安定したプラットフォームでゲストの観察と撮影をサポート'
        - 'ピークシーズンのツアーに対応する多数乗車能力（10～18 名）'
        - '水面に近い位置からイルカを観察できる船首シートエリア'
        - '沿岸・湾内運用のための浅喫水'
    - title: アドベンチャー・エコツーリズム
      subtitle: '沿岸探検、洞窟ツアー、野生生物との遭遇'
      description: 'アドベンチャーツーリズム事業者は、外洋横断、浅いラグーンの探検、沿岸洞窟へのアクセス、海洋野生生物との遭遇など、多様な環境を航行します。彼らのボートには、変化する海況に対応する汎用性、遠隔地での使用に耐える耐久性、保護された入り江やビーチへの上陸にアクセスするための浅喫水が必要です。器材の信頼性が何より重要です — 遠隔地での故障は、ツアーを台無しにし、ゲストを危険にさらしかねません。'
      features:
        - 'ラグーン、洞窟、ビーチへのアクセスに対応する浅喫水船体'
        - '多様な環境での耐久性のための強化船体とハイパロンチューブ'
        - 'フレキシブルなシート — ツアーの種類やグループサイズに応じて再構成可能'
        - '撮影機材や専門器材のための器材マウントポイント'
        - '簡単なビーチ上陸 — 強化キールとチューブ保護'
        - '長時間ツアー中のゲストの快適性のための天候保護'
    - title: リゾートアクティビティフリート
      subtitle: '完全なゲストウォータースポーツプログラム — RIB、SUP、カヤック、安全器材'
      description: 'ゲスト体験の一環としてウォータースポーツを提供するリゾートには、多様性、耐久性、ブランド表現のバランスが取れたフリートが必要です。フリートには通常、ゲストのエクスカーションと送迎のための RIB、セルフガイドの探検のための SUP とカヤック、グループでのシュノーケリングツアーのためのインフレータブルボートが含まれます。季節ごとに変動するゲスト数に対応しながら多様な器材を管理するには、一貫した品質、簡単なメンテナンス、統一されたブランディングが必要です。故障や器材の劣化は、ゲストのレビューと収益に直接影響します。'
      features:
        - 'ゲストのエクスカーション、送迎、シュノーケリングトリップのための RIB テンダー'
        - 'セルフガイドのゲストアクティビティのための SUP ボードとカヤック'
        - 'グループツアーとビーチからリーフへのシュノーケリングのためのインフレータブルボート'
        - 'すべての器材への完全なカスタムブランディング — 統一されたリゾートの印象'
        - '安全器材パッケージ：PFD、ホイッスル、救急用品、浮き索'
        - '器材の取り扱いとゲストの安全のためのスタッフ研修資料'
