section_faq:
  title: 技術的なよくある質問
  questions:
    - q: ドロップステッチは従来のハードシェル構造とどう違うのですか?
      a: 20 PSI の最新のドロップステッチ コアは、同等の EPS フォーム/グラスファイバー ハード シェルの 85 ～ 90% の剛性を達成し、輸送時には完全に収縮させることができます。トレードオフとして、重量がわずかに増加し、最終剛性が低くなりますが、ほとんどのレクリエーションおよび商業用途では、その差は無視できるほどです。
    - q: どのくらいの糸密度がプレミアム品質とみなされるのでしょうか?
      a: プレミアム ドロップステッチ生地は、1,680 DTEX ポリエステル糸で織られた 1 平方インチあたり 2 本の糸 (1 平方メートルあたり約 3,100 本の糸) を使用しています。エントリーレベルの生地は、1,100 DTEX 糸を使用し、平方インチあたり 1 本の糸を使用します。
    - q: ハイパロンはPVCのように溶接できますか?
      a: いいえ、Hypalon/CSM は RF 溶接できません。手動で塗布されたコンタクトセメントを使用して組み立てる必要があるため、生産に労力がかかり、継ぎ目はオペレーターのスキルに依存します。 PVC は RF 溶接または熱風溶接することができ、一貫した自動化された縫い目の品質を実現します。
    - q: インフレータブルボートの安全な最大圧力はどれくらいですか?
      a: 標準のインフレータブル ボート チューブは 8 ～ 12 PSI で動作します。ドロップステッチフロアは 12 ～ 20 PSI で動作します。高圧ドロップステッチ コア (SUP) は 20 ～ 25 PSI で動作します。各製品には、過膨張を防ぐために調整された圧力リリーフバルブが含まれています。
    - q: カスタムインフレータブルボートの製造にはどのくらい時間がかかりますか?
      a: 標準的な OEM 生産は、注文確認から FOB 青島まで 30 ～ 45 日かかります。カスタム金型の開発では、プロトタイプの製造とテストに 15 ～ 20 日かかります。
