hero:
  tagline: エンジニアリングに関するホワイトペーパー
  title: ドロップステッチ技術と材料科学:<br />現代のインフレータブルウォータークラフトを支えるエンジニアリング
  subtitle: ドロップステッチコア構造、PVC とハイパロン素材の比較、高圧容器の剛性テスト、船舶の製造基準を網羅する信頼できる技術リファレンス。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer R&D ラボラトリー - 材料試験およびエンジニアリング
direct_answer: ドロップステッチ技術では、何千もの内部ポリエステル糸を使用して、インフレータブルコアの上部と下部の生地層を接続しています。 15 ～ 20 PSI まで膨張すると、これらの糸が張力部材として機能し、膨らみを防ぎ、ハードシェル構造に匹敵する剛性の構造を作り出します。高度な PVC または Hypalon 生地コーティングおよび RF 溶接と組み合わせることで、プロ、商業、娯楽用途に適したポータブルで高性能のインフレータブル水上バイクが可能になります。
section_drop_stitch:
  title: ドロップステッチ構造工学
  subtitle: 何千もの糸がどのようにして柔軟な生地を硬い構造に変えるのか
  content: |-
    ドロップステッチ (「ドロップステッチ ファブリック」または「ドロップステッチ コア」とも呼ばれる) は、インフレータブル構造工学における画期的な技術です。原理は一見単純です。何千もの個別のポリエステル糸がベース生地の 2 つの別々の層に同時に織り込まれ、上部パネルと下部パネルが 90 度の角度で接続されます。

    密閉されたチャンバーが加圧されると、内部の空気圧が全方向に均等に力を及ぼし、上部パネルと底部パネルを押し広げて円筒形にしようとします。何千ものドロップステッチ糸がこの分離に抵抗し、負荷を糸軸に沿った張力に伝達します。その結果、15 ～ 20 PSI の内圧に耐えることができる平坦で剛性の高いパネルが得られます。

    20 PSI では、1 m² のドロップステッチ パネルには合計約 14,000 kg の内力がかかりますが、糸の母材によって完全に平らに保持されます。これにより、ドロップステッチ構造に従来の硬質素材に匹敵する強度対重量比が与えられます。
section_materials:
  title: PVC とハイパロン — 技術材料の比較
  subtitle: "インフレータブル艇製造における材料選択のための客観的データ"
  table:
    columns:
      - header: 財産
      - header: PVC（ポリ塩化ビニル）
      - header: ハイパロン (CSM)
    rows:
      - property: 耐紫外線性
        pvc: 良好（UV安定剤配合）
        hypalon: 素晴らしい（本質的に）
      - property: 耐摩耗性
        pvc: 良い
        hypalon: とても良い
      - property: 抗張力
        pvc: 3,000～5,000N/5cm
        hypalon: 2,500～4,000N/5cm
      - property: 平方メートルあたりの重量
        pvc: 850～1,200g
        hypalon: 1,100～1,500g
      - property: コールドフレックス
        pvc: -30℃
        hypalon: -20℃
      - property: 接合方法
        pvc: RF溶接・熱風溶接
        hypalon: 手接着（コンタクトセメント）
      - property: 修理可能性
        pvc: 簡単（熱溶着または接着）
        hypalon: CSM接着剤が必要です
      - property: 材料費
        pvc: 8 ～ 15 ドル / ㎡
        hypalon: 20 ～ 40 ドル / ㎡
      - property: 寿命（熱帯の太陽）
        pvc: 5～8年
        hypalon: 10～15年
      - property: 色の範囲
        pvc: ワイド (フルカラースペクトル)
        hypalon: 限定（基本色）
      - property: 耐薬品性
        pvc: 良好（耐燃料・耐油グレード）
        hypalon: "優秀（幅広い化学物質に対応）"
section_testing:
  title: テストと安全プロトコル
  subtitle: すべての生産バッチに対する Aquafarer の品質保証フレームワーク
  protocols:
    - title: 1.25x 定格圧力保持テスト
      description: 組み立てられたすべての容器は、定格動作圧力の 1.25 倍まで膨張され、24 ～ 48 時間保持されます。圧力降下が 2% を超えると、不合格となり再加工が発生します。
      standard: ISO6185
    - title: 縫い目剥離強度試験
      description: 各生産バッチからの溶接および接着シームのサンプルは、校正された張力装置を使用して剥離強度がテストされます。最低 4 kN/m の剥離抵抗が必要です。
      standard: ISO2411
    - title: 生地引張試験
      description: 入荷した生地ロールは、縦糸と横糸の両方向で引張強度と伸びの試験を受けます。 PVC の拒否閾値は 3,000 N/5cm 未満。
      standard: ISO1421
    - title: UV促進耐候性
      description: 材料サンプルは、QUV テスト チャンバー内で 1,000 時間以上の加速 UV 暴露にさらされます。最大 15% の引張強度の損失が許容されます。
      standard: ASTM G 154
    - title: バルブと継手の完全性
      description: 各バルブアセンブリは、定格圧力の 1.25 倍でシールの完全性がテストされます。リークバックバルブは、一方向シールの性能についてテストされています。
      standard: ISO12402
