hero:
  tagline: Aquafarer カスタムラボ
  title: あなただけの<br />ウォータークラフトを設計
  subtitle: 世界中のビジネスのための OEM、ODM、プライベートブランド、カスタムブランディングサービス。単体の試作から本格生産まで。
  cta: プロジェクトを始める
  footer_link: /contact

steps_section:
  tagline: ご利用の流れ
  title: コンセプトから量産まで
  subtitle: あなたのアイデアから海で使える完成品まで、4 つのステップ。
  steps:
    - num: '01'
      title: ボードを選ぶ
      desc: 当社のコアモデル — SUP、カヤック、ディンギー、RIB から選択。サイズ、素材、色を選びます。
    - num: '02'
      title: デザインをアップロード
      desc: ロゴ、アートワーク、ブランドガイドラインをお送りください。当社のデザインチームがデジタル校正を用意します。
    - num: '03'
      title: AI モックアップ確認
      desc: 生産開始前に、カスタムボートのフォトリアルな AI 生成モックアップをご確認ください。
    - num: '04'
      title: 生産・納品
      desc: 承認後、注文は ISO 認証を受けた生産ラインに入ります。リードタイムは最短 30 日です。

services_section:
  tagline: サービス
  title: グローバルブランドのための製造サービス
  subtitle: 契約製造からフルサービスのブランド構築まで — 柔軟な契約形態。
  items:
    - title: OEM 製造
      desc: 仕様に従ってあなたのデザインを生産 — あなたの IP、あなたの図面、あなたの品質基準。完全な NDA 保護。
      icon: ⚙️
    - title: ODM ソリューション
      desc: 50 以上の実績あるプラットフォームから選び、サイズ、色、グラフィック、パッケージをカスタマイズ。
      icon: '🎨'
    - title: プライベートブランド
      desc: 当社の製品にあなたのブランドを — ロゴ、パッケージ、タグ、マニュアル。開封即店頭販売可能です。
      icon: 🏷️
    - title: カスタムブランディング
      desc: デッキパッド印刷、船体グラフィック、チューブデカル、カスタムラベル — 完全なブランド統合。
      icon: ✨

capabilities_section:
  tagline: 対応能力
  title: 生産・カスタマイズ対応力
  subtitle: ご注文前に知っておくべきすべてのこと。
  capabilities:
    - label: 注文数量
      value: MOQ 5～10 台（SUP/カヤック）、2～5 台（RIB）
    - label: リードタイム
      value: 標準 30～45 日、試作は 15～20 日
    - label: カスタマイズ
      value: サイズ、形状、色、グラフィック、パッケージ、ハードウェア
    - label: 素材
      value: PVC、ハイパロン、ドロップステッチ、グラスファイバー、アルミ
    - label: 印刷
      value: デジタル（CMYK）、シルクスクリーン、熱転写、昇華
    - label: 認証
      value: CE、ISO 9001、BSCI、UKCA（グローバル法規対応をサポート）

why_section:
  tagline: Aquafarer が選ばれる理由
  title: 一つの工場。一つの基準。妥協なし。
  points:
    - text: 12,000㎡ の統合製造施設
      highlight: 12,000㎡
    - text: 200～300 名の熟練作業者とエンジニア
      highlight: 200-300
    - text: 年間 15,000 隻を生産
      highlight: 15,000
    - text: ISO 9001 認証の品質管理
      highlight: ISO 9001
    - text: EU 市場向け CE 認証製品
      highlight: CE
  cta: 工場の詳細を見る
  cta_link: /factory
  contact:
    title: プロジェクトについて相談する準備はできましたか？
    desc: 当社チームが 24 時間以内に概算見積もりでお返事します。
