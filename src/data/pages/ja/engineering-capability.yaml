content_capability:
  tagline: エンジニアリング能力
  title: 私たちのエンジニアリング<br /> チームが提供するもの
  subtitle: Paddle Board Overstock エンジニアリングは、市場調査やコンセプト設計からプロトタイピング、テスト、量産に至るまで、製品ライフサイクル全体をカバーします。
  items:
    - title: 工業デザイン
      description: 当社の工業デザイン チームは、顧客の要件、市場調査、競合分析に基づいて、美しさ、機能性、製造性のバランスがとれた製品コンセプトを開発します。ツールの開発に着手する前に、クライアントのレビューのために 2D スケッチ、3D レンダリング、仕様書を作成します。
      features:
        - "コンセプト開発と実現可能性調査"
        - 2D設計図面と3Dレンダリング
        - "材料の選定と仕様策定"
        - "製造向け設計（DFM）分析"
        - "人間工学および安全性の評価"
    - title: 構造工学
      description: 当社の構造エンジニアは、船体設計、チューブチャンバー構成、ドロップステッチコアエンジニアリング、荷重分散といったインフレータブルボートのアーキテクチャを専門としています。各設計は、構造の完全性、重量の最適化、関連規格 (CE、ISO、AS) への準拠について分析されます。
      features:
        - "計算されたデッドライズ角を採用したディープVグラスファイバー船体設計"
        - "安全性と浮力を高めるマルチチャンバー チューブ構成"
        - "ドロップステッチ コアの仕様と密度の最適化"
        - "耐荷重部品に対する有限要素解析"
        - "重量配分と安定性の計算"
    - title: 3DモデリングとCAD
      description: すべての製品設計は、プロトタイプのツール作成が開始される前に 3D CAD で開発されます。当社のエンジニアは製品モデリングに SolidWorks と Rhino 3D を使用しており、クライアントは製造に着手する前にチューブのプロファイルからコンソールのレイアウトに至るまであらゆる詳細を確認できます。
      features:
        - SolidWorks および Rhino 3D によるフル 3D CAD モデリング
        - "顧客プレゼンテーション用のフォトリアルなレンダリング"
        - "生産用の技術図面パッケージ"
        - 3Dモデルからの金型および治具設計
        - "高精度切断のためのCADからCNCへの直接データ転送"
    - title: プロトタイピングとテスト
      description: 量産の前に、すべての新製品は試作段階を経ます。当社は顧客評価用に機能的なプロトタイプを構築し、圧力試験、安定性試験、負荷試験、水試験などの完全な試験プロトコルを実施します。プロトタイプ段階での設計の反復は迅速かつコスト効率が高くなります。
      features:
        - "迅速な試作治具（15～20日で対応）"
        - "実際の使用環境での評価用機能プロトタイプ"
        - "生産承認前の完全なテストプロトコル"
        - "テスト結果に基づく反復的な設計改善"
        - "量産治具前に顧客承認のマイルストーンを設定"
    - title: カスタムアクセサリの統合
      description: 多くの OEM プロジェクトでは、カスタム コンソール、専用シート、電子システム、ダイビング器材マウント、ブランド要素など、クライアント提供またはサードパーティのアクセサリの統合が必要です。当社のエンジニアリング チームは、すべてのアクセサリの統合設計、構造適応、品質検証を管理します。
      features:
        - "コンソール設計と計器パネルのレイアウト"
        - "カスタムシートと内装の統合"
        - "電子システムの設計と配線"
        - "ダイビング・救助機器の搭載システム"
        - "ブランディングとグラフィック適用の仕様"
content_process:
  tagline: 開発プロセス
  title: コンセプト<br /> から制作まで
  subtitle: 当社の製品開発プロセスは、リスクを最小限に抑え、スケジュールを短縮し、初日から確実に製造準備を整えるように設計された構造化された 6 段階のワークフローに従っています。
  stages:
    - stage: '01'
      title: 要件と調査
      duration: 1～2週間
      description: 当社はクライアントと協力して、製品仕様、対象市場の要件、規制遵守のニーズ、商業目的を定義します。この段階では、その後のすべての作業の指針となる製品要件文書 (PRD) が作成されます。
      deliverables: PRD、市場分析、競合ベンチマーク、暫定コスト見積もり
    - stage: '02'
      title: コンセプトデザイン
      duration: 2～3週間
      description: 工業デザインチームはPRDに基づいて製品コンセプトを開発します。複数の設計オプションが 3D レンダリング、材料の推奨事項、初期エンジニアリング評価とともに表示されます。クライアントは詳細な開発の方向性を選択します。
      deliverables: 3D コンセプト レンダリング、材料仕様、設計理論的根拠、暫定 BOM
    - stage: '03'
      title: 詳細なエンジニアリング
      duration: 2～4週間
      description: 選択されたコンセプトは、3D CAD モデリング、構造解析、チューブ構成、船体設計、付属品の統合、生産文書など、完全に設計されています。 All dimensions, materials, and processes are specified for tooling.
      deliverables: フル 3D CAD モデル、エンジニアリング図面、最終 BOM、工具仕様、QC 計画
    - stage: '04'
      title: プロトタイピング
      duration: 2～3週間
      description: プロトタイプ ツールが作成され、機能サンプルが構築されます。クライアントは PRD 仕様に照らしてプロトタイプをレビューします。テストは合意されたプロトコルに従って実施されます。設計の調整は、生産ツールの前にフィードバックに基づいて行われます。
      deliverables: 機能プロトタイプ、テストレポート、設計改訂ログ、クライアントの承認文書
    - stage: '05'
      title: 生産工具
      duration: 2～3週間
      description: プロトタイプが承認されると、金型、溶接治具、切断プログラム、組立治具などの生産ツールが試運転されます。 QC 文書と検査基準が完成します。プロセス検証のために試運転を実施。
      deliverables: 生産ツール、プロセス文書、QC 検査計画、試運転レポート
    - stage: '06'
      title: 量産と品質管理
      duration: 進行中
      description: 完全な生産は、あらゆる段階での工程内 QC から始まります。最初の商品はバッチリリース前に検査され、承認されます。継続的な品質監視、欠陥追跡、生産ライフサイクル全体にわたる継続的な改善。
      deliverables: 生産スケジュール、QCレポート、バッチトレーサビリティ記録、出荷文書
content_customization:
  tagline: カスタマイズオプション
  title: カスタマイズできるもの<br />
  subtitle: 当社の製品のほぼすべての側面は、顧客の要件に合わせてカスタマイズできます。以下は最も一般的なカスタマイズ カテゴリです。
  columns: 3
  items:
    - title: 船体と構造
      description: カスタムの船体長、ビーム幅、デッドライズ角度、チューブ直径、チャンバー構成、および材料グレード。
      icon: tabler:sailboat
    - title: 色とグラフィック
      description: チューブカラー（PVC/ハイパロン）、船体ゲルコートカラー、コンソールカラー、デッキグラフィック、ロゴ配置、パッケージデザイン。
      icon: tabler:palette
    - title: コンソールとコントロール
      description: センターコンソール、サイドコンソール、またはティラーステアリング。インストルメントパネルのレイアウト、スイッチの配置、およびヘルムの位置をカスタム化します。
      icon: tabler:steering-wheel
    - title: 座席と室内装飾品
      description: ジョッキーシート、ベンチシート、豪華な室内装飾、同色のステッチ、折りたたみ式または取り外し可能な構成。
      icon: tabler:armchair
    - title: アクセサリと装備
      description: ダイビングラダー、タンクラック、牽引パイロン、Tトップ、ビミニトップ、サウンドシステム、ナビゲーション電子機器、安全装置。
      icon: tabler:backpack
    - title: パッケージングとブランディング
      description: カスタム小売パッケージ、プライベート ラベルの箱、ブランド マーク付きの輸送用ダンボール、下げタグ、クライアント言語のユーザー マニュアル。
      icon: tabler:box
content_industries:
  tagline: 産業用途
  title: 業界別のエンジニアリング ソリューション<br />
  subtitle: 当社のエンジニアリング チームは、それぞれに異なる要件と性能基準を持つ幅広い海洋用途向けの製品を開発してきました。
  columns: 3
  items:
    - title: ダイビング業務
      description: 強化されたデッキ、ダイビングラダーの統合、タンク保管システム、世界中の商業ダイビングセンター向けの安定したプラットフォーム。
      icon: tabler:lifebuoy
    - title: 救助と緊急事態
      description: SAR運用のための高速船体設計、自動ベイリングデッキ、機器取り付けシステム、およびマルチチャンバー安全構成。
      icon: tabler:alert-triangle
    - title: マリンツーリズム
      description: 乗客の快適なレイアウト、サンシェードの統合、搭乗システム、および島への移動業務のための燃料効率の高い構成。
      icon: tabler:beach
    - title: ヨットテンダー
      description: ダビット収納用のコンパクトな設計、豪華な仕上げオプション、母船の色に合わせて、高性能の牽引特性を備えています。
      icon: tabler:sailboat
    - title: 釣りと水産養殖
      description: フラットデッキ構成、ライブウェル統合、ロッドホルダーレイアウト、継続的な海水暴露に耐える耐食性ハードウェア。
      icon: tabler:fish
    - title: 港湾と産業
      description: 頑丈な船体の補強、作業船のレイアウト、人員輸送の構成、および洋上作業のための機器の統合。
      icon: tabler:ship
