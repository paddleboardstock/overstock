hero:
  tagline: 海洋専門性
  title: 'すべての船体に宿る<br />数十年の海洋エンジニアリング'
  subtitle: 'Aquafarer は深い材料科学、精密製造、実環境テストを組み合わせ、重要な場面で性能を発揮するウォータークラフトを生産しています。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: 作業中の Aquafarer 海洋エンジニアリング・R&D チーム
expertise_materials:
  tagline: 材料科学
  title: 'すべての用途に<br />最適な素材を選ぶ'
  subtitle: '当社は 3 つのコア素材を扱っています — それぞれ特定の使用例と性能要件のために選定されています。'
  columns: 3
  items:
    - title: マリングレード PVC
      description: '1100 デニール PVC 生地 — 当社で最も汎用性の高い素材。UV 安定化、耐摩耗性、REACH 準拠。重量とコスト効率が重要なレジャーボート、SUP ボード、カヤックに最適です。'
      icon: tabler:droplet
    - title: プレミアムハイパロン/CSM
      description: '優れた耐薬品性と UV 安定性。ハイパロンボートは適切なケアで 15～20 年使用できます。長期耐久性が重要な商業、救助、軍事用途に推奨されます。'
      icon: tabler:shield
    - title: グラスファイバー・アルミ
      description: 'RIB とパトロール艇のためのディープ V グラスファイバー船体 — 荒れた条件での波を切る性能。最大限の強度と積載容量を必要とするヘビーデューティ商業作業艇のためのアルミ船体。'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 製造能力
  title: 'すべての工程での<br />精密製造'
  subtitle: '12,000㎡ の施設には、生産のあらゆる段階のための専門機械が整っています。'
  columns: 2
  items:
    - title: CNC カット
      description: 'コンピューター制御のカットにより、無駄を最小限に抑えた正確で再現性のある生地パネルを実現。すべてのピースが設計どおりに正確に収まります。'
      icon: tabler:cpu
    - title: 高周波溶接
      description: '産業用 HF 溶接は、母材より強いシームを作ります。一貫した温度・圧力管理により、すべての生産ロットで気密シールを保証します。'
      icon: tabler:bolt
    - title: ドロップステッチコア組立
      description: '何千本ものポリエステル糸が上下の生地層を接続し、高圧注入（15～20 PSI）で剛性があり安定した SUP ボードとフロアを実現します。'
      icon: tabler:building-arch
    - title: 圧力テスト
      description: 'すべてのインフレータブル製品は出荷前に圧力テストを受けています。RIB チューブは定格圧力の 1.25 倍でテストされます — そこで保持できれば、水上でも性能を発揮します。'
      icon: tabler:wind
    - title: シーム強度テスト
      description: '各生産バッチからの無作為サンプルが破壊的なシーム強度テストを受けます。結果は記録され、特定の生産ロットまでトレース可能です。'
      icon: tabler:files
    - title: 水上テスト
      description: 'すべての RIB モデルは認証前に試験航行を受けます。沿岸条件下での実環境テストが性能、操作性、安定性を検証します。'
      icon: tabler:ripple
expertise_design:
  tagline: 設計・エンジニアリング
  title: '実環境のために設計'
  subtitle: '当社の設計哲学は、ボートがどのように使われるかから始まり — その使用例に合わせてエンジニアリングを構築します。'
  items:
    - title: ディープ V 船体設計
      description: "当社のグラスファイバー船体は、各モデルの長さと用途に合わせて計算されたデッドライズ角を特徴とします。荒れた水面での性能には急な V を、安定性には緩い V を採用しています。"
    - title: マルチチャンバー安全設計
      description: 'すべてのボートに 3～7 個の独立したエアチャンバーを装備。一つの区画が損傷しても、残りのチャンバーがボートを浮上させ操業可能に保ちます。'
    - title: 人間工学に基づくレイアウト
      description: 'コンソール位置、チューブ高、シート配置は、パトロール、釣り、輸送のいずれでも長時間使用時の操作者の快適性を中心に設計されています。'
    - title: カスタム構成
      description: 'チューブカラー、コンソール構成、燃料容量、アクセサリーマウント — 各モデルは特定の運用要件に合わせてカスタマイズできます。'
cta:
  title: '具体的な用途をお考えですか？'
  subtitle: '当社のエンジニアリングチームが、プロジェクトの素材選定、設計、製造についてアドバイスします。'
  actions:
    - variant: primary
      text: エンジニアに相談する
      href: /contact
    - text: 製品ラインナップを見る
      href: /products
