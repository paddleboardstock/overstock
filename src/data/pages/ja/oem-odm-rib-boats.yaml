faq:
  title: RIB OEM/ODM — よくある質問
  questions:
    - q: RIBボートのOEMとODMの違いは何ですか?
      a: 'OEM (Original Equipment Manufacturing): 詳細な仕様を提供していただき、当社が設計を構築します。 ODM (オリジナル設計製造): 実績のある Aquafarer RIB プラットフォームを選択すると、希望の機能とブランドでカスタマイズします。 ODM は高速かつ低コストです。 OEM は最大限の設計制御を提供します。'
    - q: RIB ハルの形状とサイズをカスタマイズできますか?
      a: はい。当社は、既存の船体金型のセミカスタム修正 (異なるデッキ レイアウト、チューブ構成) と、新しい CNC 機械加工金型を使用したフルカスタムの船体開発を提供します。セミカスタム プロジェクトは 2 ～ 5 ユニットから開始できます。フルカスタムには通常、より高いコミットメントが必要です。
    - q: カスタム RIB にはどのようなチューブ材料が利用できますか?
      a: 当社は、レクリエーションおよび軽商業用途向けに 0.9 ～ 1.2 mm の PVC を提供し、優れた耐紫外線性および耐オゾン性 (PVC の寿命は 5 ～ 8 年であるのに対し、10 ～ 15 年) を必要とする専門家、救助、および商業用途向けに 1.4 ～ 1.7 mm の Hypalon/CSM を提供しています。
    - q: 救助、ダイビング、釣りなどの特定のアプリケーション向けに RIB を構成できますか?
      a: はい。当社は、救助/パトロール、ダイビング サポート、観光/チャーター、釣り、ヨット テンダー、およびプロの作業ボート アプリケーション向けに実証済みの構成テンプレートを維持しています。各テンプレートには、推奨される船体のタイプ、チューブの材質、デッキのレイアウト、装備が含まれており、お客様の正確な要件に合わせてカスタマイズされます。
    - q: RIB OEM/ODM の見積もりにはどのような情報が必要ですか?
      a: 対象用途、希望する船体長さ、チューブ材質の好み（PVC または Hypalon）、おおよその数量と納期、対象市場のコンプライアンス要件、および参考製品または仕様。より詳細に提供していただくほど、見積もりがより速く正確になります。
    - q: カスタム RIB ボートの MOQ はいくらですか?
      a: 標準的な変更を加えた既存の船体モールドの場合、MOQ は 1 デザインあたり 2 ～ 5 ユニットから始まります。カスタム金型とフルカスタム開発の場合、MOQ はプロジェクトの複雑さによって異なります。通常、セミカスタムの場合は 10 ～ 20 ユニット、新しいツールを使用したフルカスタムの場合は 30 以上です。
    - q: カスタム金型と図面の所有者は誰ですか?
      a: Aquafarer の基本設計を使用して開発された金型は、Aquafarer の所有物として残ります。顧客が委託して料金を支払った完全カスタム金型は、契約条件に従って顧客の所有権に割り当てることができます。すべての金型所有権条件はプロジェクト開始前に文書化されます。
    - q: カスタム RIB はエクスポート用にどのようにパッケージ化されますか?
      a: '標準: コンテナ積載用のカスタム クレードル + ストレッチ ラップ。プレミアム: 小売用の包装、真空パック、またはパレット化。 FOB 青島、CIF、DDP の配送を提供しています。完全な輸出書類と通関手続きが含まれています。'
