content_customization:
  tagline: カスタマイズできるもの
  title: RIBカスタマイズ<br />オプション
  subtitle: RIB ボートのあらゆる要素は、アプリケーション、市場、ブランドの要件に合わせて調整できます。
  items:
    - title: 船体と構造
      description: 船体長 (2.5 ～ 8.5 m)、船体材質 (GRP グラスファイバーまたは船舶グレードのアルミニウム)、船体色 (ゲルコートまたは塗装)、キールのプロファイル (深い V、中程度の V、フラット)、トランサムのタイプ (ブラケットまたはウェル付きのクローズトランサム)、商用荷重要件に応じた構造補強。
      icon: tabler:sailboat
    - title: チューブとカラー
      description: チューブの材質 (0.9 ～ 1.2 mm PVC または 1.4 ～ 1.7 mm Hypalon/CSM)、チューブの直径 (40 ～ 55 cm)、チャンバーの数 (3 ～ 7)、バルブの種類 (Halkey-Roberts、Leafield D7、または Boston)、チューブの色 (標準またはカスタム)、およびカラー コーン/テーパー構成。
      icon: tabler:circle
    - title: デッキとコンソールのレイアウト
      description: センターコンソール、サイドコンソール、またはティラーステアリング。座席レイアウト（ジョッキーシート、ベンチシート、ボルスターシート）。デッキカバー（EVAフォームチーク風、滑り止めペイント、または裸のGRP）。機器の取り付けポイント、グラブレール、D リングの位置。
      icon: tabler:layout-dashboard
    - title: 電気とナビゲーション
      description: 航海灯 (LED)、ビルジ ポンプ システム、バッテリー管理、VHF 無線機の設置、GPS/チャートプロッターの取り付け、USB 充電ポート、およびスイッチ パネルの構成。
      icon: tabler:bolt
    - title: ブランディングとグラフィック
      description: 船体とチューブのグラフィックス (スクリーン印刷、熱転写、UV デジタル印刷)、ロゴの配置、オーダーメイドの配色、識別マーキング、およびブランドのカスタム所有者文書。
      icon: tabler:palette
    - title: 安全性とコンプライアンス
      description: 設計カテゴリの評価 (RCD ごとに A/B/C/D)、消火システム、燃料システム仕様 (ポータブル タンク、固定タンク、アンダーデッキ)、およびターゲット市場向けのコンプライアンス文書パッケージ。
      icon: tabler:shield
content_applications:
  tagline: アプリケーション構成
  title: RIB 構成<br />アプリケーション別
  subtitle: ミッションが異なれば、異なる構成が必要になります。ここでは、最も一般的な RIB アプリケーションの実証済みのセットアップを示します。
  items:
    - title: レスキュー&パトロール
