      icon: tabler:mask
    - title: 観光と商業
      description: ベンチシート、サンシェード/ビミニ、グラブレール、ドライストレージ、デュアルバッテリーシステムを備えた乗客認定のレイアウト。 RCD カテゴリ C。リゾートおよびチャーター船の運航向けに設計されています。
      icon: tabler:beach
    - title: 釣り
      description: オープンデッキレイアウト、ロッドホルダーの位置、生き餌ウェル、魚群探知機マウント、トローリングモーターマウント、強化トランサム、ポータブル燃料システム。センターコンソールまたはサイドコンソールのオプション。
      icon: tabler:fish
    - title: レジャー&ヨットテンダー
      description: 軽量の船体、PVC チューブ、快適な座席、伸縮式ティラーまたはコンパクトなコンソール、ダビット用のリフティング ポイント、および取り外し可能な燃料タンク。 RCD カテゴリー C または D。
      icon: tabler:sailboat
    - title: プロフェッショナルワークボート
      description: アルミニウム製の船体オプション、頑丈な補強材、油圧ステアリング、商用グレードの電気、レーダー アーチ、およびミッション固有の機器統合ポイント。プロジェクトごとのカスタムコンプライアンス。
      icon: tabler:anchor
process_steps:
  title: 7 ステップの RIB OEM/ODM 開発プロセス
  subtitle: プロジェクトの概要からアフターセールスまで - 明確なマイルストーンと成果物を備えた定義されたワークフロー
  steps:
    - number: '01'
      title: プロジェクトの概要と要件
      description: 対象アプリケーション、船体サイズ、チューブ材質、コンプライアンス要件、およびブランド化のニーズを定義します。実現可能性を評価し、コラボレーションモデル（OEM/ODM/セミカスタム/フルカスタム）を確認します。
      timeline: 3～5日
    - number: '02'
      title: 技術レビューと実現可能性
      description: エンジニアリング チームは、構造の実現可能性、安定性と浮力の計算、コンプライアンス パス、および材料の入手可能性をレビューします。既存の金型またはカスタム金型の要件を特定します。
      timeline: 5～7日
    - number: '03'
      title: ご提案・お見積り
      description: 仕様、3D レンダリングまたは GA 図面、コンプライアンス範囲、タイムライン、ボリューム階層と MOQ に基づく単価などの詳細な提案を受け取ります。
      timeline: 5～7日
    - number: '04'
      title: デザイン確認＆サンプリング
      description: 最終的な GA、デッキ レイアウト、チューブ構成を承認します。お客様の物理的な検査のために、ブランドカラー、ロゴ、指定された素材を使用した生産前サンプルを作成します。
      timeline: 15～20日
    - number: '05'
      title: サンプルの承認と QC プロトコル
      description: 'サンプルを検査して承認します。生産 QC プロトコルを定義します: 圧力テスト (1.25x / 24 ～ 48 時間)、寸法チェック、船体ごとのコンプライアンス文書チェックリスト。'
      timeline: 3～5日
    - number: '06'
      title: 量産と品質管理
      description: ユニットごとに 100 ポイントの QC チェックリストを使用して完全な生産を実行します。工程内検査、圧力試験、シリアルレベルのトレーサビリティ。 CE/ISO ドキュメントも並行して作成されます。
      timeline: 30～45日
    - number: '07'
      title: 梱包、配送、アフターセールス
      description: カスタム梱包 (標準、小売対応、またはパレット化)、輸出書類、コンテナの積み込み、物流。スペアパーツキットとメンテナンス文書が含まれています。
      timeline: 7～14日
