content_service_modules:
  tagline: "サービスメニュー"
  title: OEM/ODM サービス<br />モジュール
  subtitle: 各プロジェクトは適切なサービス モジュールを組み合わせます。すべてのプロジェクトにすべてのモジュールが必要なわけではありません。プロジェクトに必要なもののみを対象とします。
  items:
    - title: エンジニアリングのレビューと実現可能性
      description: '船体プラットフォームの評価、構造の実現可能性チェック、安定性と浮力の検証、コンプライアンスパスの特定、材料の入手可能性の確認。出力: 実行/中止の推奨事項を含む実現可能性レポート。'
      icon: tabler:math-function
    - title: 設計と構成
      description: '一般図、デッキレイアウト、チューブ構成、コンソールと座席の位置、機器の取り付け計画、色/素材の選択。出力: 承認された GA および構成仕様。'
      icon: tabler:ruler
    - title: "サンプル・試作"
      description: 物理検査用に承認された色、ロゴ、および指定された素材を使用した生産前サンプル。サンプル承認プロトコル、検査チェックリスト、変更要求プロセスが含まれます。
      icon: tabler:3d-cube-sphere
    - title: "生産・品質管理"
      description: ユニットごとの 100 ポイントの QC チェックリスト、工程内検査、圧力テスト (1.25 倍 / 24 ～ 48 時間)、およびシリアルレベルのトレーサビリティを備えた量産。 CE/ISO ドキュメントは並行して作成されます。
      icon: tabler:clipboard-check
    - title: ブランディングとパッケージング
      description: プライベート ラベルのロゴの適用、カスタムの船体とチューブのグラフィックス、ブランドの所有者文書、小売用またはパレット化された梱包、およびスペアパーツ キットの準備。
      icon: tabler:palette
    - title: エクスポートとドキュメント
      description: 輸出梱包、コンテナ積載計画、FOB/CIF/DDP 文書、仕向地市場ごとのコンプライアンス書類作成、および納品後の通信プロトコル。
      icon: tabler:world
content_risk_control:
  tagline: リスクとデリバリーの管理
  title: プロジェクトのリスクと<br />納期管理
  subtitle: プロのOEM/ODM バイヤーは、製品の品質と同じくらいリスク管理を重視します。これが私たちの管理方法です。
  items:
    - title: 範囲と所有権の定義
      description: 開発を開始する前に、カスタマイズ範囲、工具要件、サンプル承認基準、図面と金型の所有権、および文書化の責任を書面で定義します。誰が何を所有しているかについて曖昧さはありません。
      icon: tabler:file-text
    - title: 変更管理プロセス
      description: 設計確認後のすべての仕様変更は、影響評価 (コスト、スケジュール、コンプライアンス) を伴う文書化された変更要求プロセスに従います。未承認の変更が本番環境に導入されることはありません。
      icon: tabler:arrows-diff
    - title: バッチの一貫性の保証
      description: 50 番目のユニットは最初に承認されたサンプルと一致します。承認された仕様は凍結され、材料とプロセスのパラメータはロックされ、プロセス内のチェックポイントによって生産実行全体の一貫性が検証されます。
      icon: tabler:repeat
    - title: 配信と容量の透明性
      description: リードタイムは、希望的な目標ではなく、実際の生産能力、材料在庫レベル、現在の注文負荷に基づいて見積もられます。注文ごとにマイルストーン日を含む生産スケジュールが提供されます。
      icon: tabler:calendar-stats

