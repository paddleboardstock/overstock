content_material_cert:
  tagline: 材料認証
  title: 材料のトレーサビリティと<br />認証証拠
  subtitle: 品質RIB ボートは、管理された材料と文書化されたプロセスから始まります。以下は、重要なコンポーネント グループごとに材料認証をどのように整理するかです。
  items:
    - title: インフレータブルチューブ材料のトレーサビリティ
      description: PVC および CSM/Hypalon のチューブ材料は、使用目的、気候条件、対象市場に応じて選択されます。サプライヤー技術データ (TDS)、材料バッチ情報、生地バッチのトレーサビリティ、UV および耐候性試験レポート、および REACH/SVHC 宣言は、合意されたプロジェクト文書の範囲内で利用可能です。
      icon: tabler:circle
    - title: 海洋アルミニウムのトレーサビリティ
      description: アルミニウム船体 RIB プロジェクトの場合、合金グレード、厚さ、材料バッチは承認された仕様に従って管理されます。材料試験証明書 (MTC/MTR)、EN 10204 3.1 文書、化学組成および機械的特性のレポート、および熱/ロットのトレーサビリティが合意された場合に提供されます。
      icon: tabler:rectangle
    - title: GRP 船体の材質とプロセス管理
