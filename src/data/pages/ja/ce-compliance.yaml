content_scope:
  tagline: コンプライアンスの範囲
  title: どの製品に<br />RCD 準拠が必要ですか?
  subtitle: レクリエーション船舶指令 2013/53/EU は、船体長 2.5 m ～ 24 m のレクリエーション船舶に適用されます。範囲を理解することがコンプライアンスへの第一歩です。
  items:
    - title: RIB ボート (2.5 ～ 24 m)
      description: 船体長が 2.5 m ～ 24 m の硬質インフレータブル ボートは RCD に該当します。設計カテゴリー A ～ D は、想定される海況と最大風力に応じて適用されます。
      icon: tabler:sailboat
    - title: ゴムボート（2.5m未満）
      description: 2.5 m 未満の小型インフレータブル ボートおよびディンギーは RCD から部分的に免除される場合がありますが、他の該当する指令および EN ISO 6185 構造規格に基づいて CE マーキングが必要です。
      icon: tabler:sailboat
    - title: SUPボードとアクセサリー
      description: スタンドアップ パドルボードは RCD の範囲外です。ただし、関連する個人用浮揚装置 (PFD) には、PPE 規制 (EU) 2016/425 に基づく CE マーキングが必要で、該当する場合は USCG タイプ III/V の承認が必要です。
      icon: tabler:swimming
    - title: 部分的に完成したボート
      description: エンジンや特定の設備を備えずに納入されるボートには、最終的な建造者または輸入者によって完全な RCD 準拠が完了した、部分的に完成した船舶の建造者の申告が必要です。
      icon: tabler:tool
content_trust_layers:
  tagline: 三層の信頼システム
  title: コンプライアンス情報<br />— 適切なレベルで共有
  subtitle: すべてのコンプライアンス データが公開 Web サイトに掲載されているわけではありません。当社は、買い手の信頼を築きながら知的財産を保護する 3 層のアプローチに従っています。
  items:
    - title: レイヤ 1 — 公開 Web サイト
      description: 参照される規格、適合ルートの説明、文書タイプのリスト、モデルファミリーごとの認証範囲。実際の証明書、テストデータ、独自のエンジニアリングの詳細はありません。
      icon: tabler:world
    - title: レイヤ 2 — 照会後の共有
      description: '適格な調査の後: 編集された DoC サンプル、建設業者のプレートの写真、適用される規格リスト、コンプライアンス チェックリスト、および材料認証の概要 - フェアユース条件に基づいて共有されます。'
      icon: tabler:mail
    - title: レイヤ 3 — NDA / 注文段階
      description: 完全な技術ファイル、リスク評価、安定性計算、試験報告書、材料バッチ記録、製造トレーサビリティ文書は、NDA に基づいて確認された購入者とのみ共有されます。
      icon: tabler:lock
content_standards:
  tagline: 適用規格
  title: ISO および EN 規格<br />私たちはそれに基づいて構築します
  subtitle: 当社の製品は、RCD に基づく統一規格に基づいて設計およびテストされています。標準番号と名前が参照されています。標準テキスト全体は ISO 著作権のままです。
  items:
    - title: EN ISO 6185 -3
      description: 'ゴムボート — パート 3: 最大モーター出力が 15 kW 以上のボート。 RIB の構造、安定性、浮力、および人落ち時の回復要件。'
      icon: tabler:file-text
    - title: EN ISO 6185 -4
      description: 'インフレータブルボート — パート 4: 最大モーター出力が 15 kW、4.5 kW 以上のボート。追加の構造要件と安定性要件。'
      icon: tabler:file-text
    - title: ISO12215シリーズ
      description: 小型船舶 — 船体の構造と寸法。グラスファイバーおよびアルミニウム製 RIB 船体の船体、デッキ、隔壁の構造設計。
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: 小型船舶 — 取扱説明書。 EU 内で納入される各 RIB ボートに付属するオーナーズマニュアルに必要な内容と形式。
      icon: tabler:book
    - title: EN ISO 14945
      description: 小さな工芸品 — ビルダーズ プレート。各船に恒久的に取り付けられるビルダーズプレートにマークされる情報。
      icon: tabler:badge
    - title: ISO 8666
      description: 小型船舶 — 主要なデータ。すべての製品ドキュメントにわたって一貫した仕様を実現するために、標準化された測定値とパラメータ。
      icon: tabler:dimensions
content_process:
  tagline: コンプライアンスプロセス
  title: 6 ステップの CE 準拠<br />ワークフロー
  subtitle: プロジェクトの範囲からシリアルレベルのトレーサビリティに至るまで、すべての RIB モデルは定義されたコンプライアンス パスに従います。
  steps:
    - number: '01'
      title: プロジェクトの範囲と分類
      description: RIB モデル、設計カテゴリ (A/B/C/D)、最大人数、積載量、エンジン出力、ターゲット市場を定義します。 RCD が適用されるかどうか、およびどの適合性評価モジュールが必要であるかを判断します。
      timeline: 2～3日
    - number: '02'
      title: 適用される要件の識別
      description: RCD Annex I から該当するすべての必須安全要件、関連する調和規格 (EN ISO 6185、12215、10240、14945)、および対象市場の追加の国内要件を特定します。
      timeline: 3～5日
    - number: '03'
      title: 設計および技術文書
      description: 'マスター技術ファイルを作成します: 一般配置図、安定性と浮力の計算、リスク評価、材料仕様、システムの安全性分析 (燃料、電気、ステアリング)。'
      timeline: 10～15日
    - number: '04'
      title: 製品の検証とテスト
      description: 物理的検証を実施します。定格圧力の 1.25 倍で 24 ～ 48 時間の圧力テスト、安定性と浮力テスト、負荷テスト、およびシステムの試運転を行います。船体ごとにすべてのテスト結果を記録します。
      timeline: 5～7日
    - number: '05'
      title: マーキングと納品文書
      description: CE マーキング、ビルダーズ プレート (EN ISO 14945)、および HIN/CIN (船体識別番号) を貼り付けます。 EU 適合宣言書、取扱説明書 (EN ISO 10240)、および準拠チェックリストを準備します。
      timeline: 2～3日
    - number: '06'
      title: シリアルレベルのトレーサビリティ
      description: 各船体は、マスター技術ファイル、生産バッチ、材料証明書、テスト結果、最終構成にリンクする固有の船体レコードを受け取ります。記録は RCD ごとに 10 年以上保存されます。
      timeline: 進行中
content_document_cards:
  tagline: 文書の種類
  title: コンプライアンス文書<br />カード
  subtitle: これらは、CE 認定の RIB モデルごとに当社が準備および維持するドキュメント タイプです。サンプルは適格な問い合わせに応じて入手可能です。
  items:
    - title: CE / RCD 準拠証明書
      description: 航空機が RCD 2013/53/EU の該当するすべての基本安全要件を満たしていることを確認するモデル固有の証明書。必要に応じて認証機関の関与を得てメーカーが発行します。
      icon: tabler:certificate
    - title: EU 適合宣言 (DoC)
      description: 該当する指令、規格、適合モジュール、および認証機関の詳細をリストした、メーカーまたは認定代理人による署名済みの宣言書。 EU 市場に投入されるすべてのモデルに必要です。
      icon: tabler:file-check
    - title: ビルダーズプレート (EN ISO 14945)
      description: 最大人数、最大エンジン出力、設計カテゴリ、および製造業者の識別を示すプレートが恒久的に貼り付けられています。工芸品の存続期間中、判読可能な状態を維持する必要があります。
      icon: tabler:badge
    - title: 取扱説明書 (EN ISO 10240)
      description: 安全な操作、緊急手順、メンテナンススケジュール、安全上の警告を網羅した包括的なマニュアル。 EU 内で配信されるすべての RIB に必須。
      icon: tabler:book
    - title: ISO テストおよび検査レポート
      description: 圧力テスト記録 (1.25x / 24 ～ 48 時間)、安定性と浮力テストの結果、材料テスト証明書、寸法検証レポートはすべて特定の船体番号に関連付けられています。
      icon: tabler:test-pipe
    - title: 材料トレーサビリティ記録
      description: チューブ生地、接着剤、グラスファイバー、ハードウェアのバッチレベルのトレーサビリティ。各生産ユニットを、入荷した材料証明書および IQC 検査結果にリンクします。
      icon: tabler:link
    - title: 品質検査とQC記録
      description: ユニットごとの 100 ポイントの品質チェックリスト、工程中の QC 記録、不適合レポート、および是正措置。生産トレーサビリティチェーンの一部。
      icon: tabler:clipboard-check
    - title: プロジェクトドキュメントパック
      description: 最終構成記録、エンジンと機器の設置詳細、試運転チェックリスト、納品文書を含む船体ごとの文書パッケージ。
      icon: tabler:package
content_design_categories:
  tagline: RCD デザイン カテゴリ
  title: デザインカテゴリー A ～ D<br />— 意味
  subtitle: RCD は、航空機が耐えられるように設計されている最大風力と顕著な波の高さに基づいて設計カテゴリを割り当てます。
  items:
    - title: カテゴリー A — 海洋
      description: 風力がビューフォート 8 (>40 ノット) を超え、顕著な波高が 4 m を超える可能性がある長期航海用に設計されています。最も厳密な構造と安定性の検証が必要です。
      icon: tabler:ripple
    - title: カテゴリー B — オフショア
      description: ビューフォート 8 (≤40 ノット) までの風力と最大 4 m までの顕著な波高の沖合航海用に設計されています。沿岸水域および半露出水域に適しています。
      icon: tabler:anchor
    - title: カテゴリー C — 沿岸
      description: ビューフォート 6 (≤27 ノット) までの風力と最大 2 m までの顕著な波高の沿岸航海用に設計されています。ほとんどのレクリエーション用 RIB がこのカテゴリに分類されます。
      icon: tabler:sun
    - title: カテゴリー D — 保護された
      description: ビューフォート 4 (≤16 ノット) までの風力と最大 0.3 m までの顕著な波高を持つ保護された海域用に設計されています。湖、川、保護された港。
      icon: tabler:pool
content_hin:
  tagline: クラフトの識別
  title: HIN / CIN & ビルダーズプレート
  subtitle: すべての RIB ボートには、船体識別番号 (HIN) または船舶識別番号 (CIN) と、EN ISO 14945 および RCD 要件に基づくビルダーズ プレートが必要です。
  items:
    - title: 船体識別番号 (HIN)
      description: トランザムの右舷側に永続的にマークされる固有の 14 文字のコード。製造者コード (MIC)、モデル年、製造年、シリアル番号がエンコードされています。 EU市場参入には必須。
      icon: tabler:hash
    - title: 船舶識別番号 (CIN)
      description: EN ISO 10087 によると、盗難防止と追跡可能性を目的として、隠された場所に配置される隠された二次識別番号。
      icon: tabler:eye-off
    - title: ビルダーズプレートの内容
      description: 最大人数、最大エンジン出力（kW）、最大荷重（kg）、設計カテゴリ、メーカー名、CE マーキングはすべて耐食プレートに恒久的に表示されます。
      icon: tabler:badge
content_tech_file:
  tagline: 技術ファイル構造
  title: マスターテクニカルファイル<br />&船体記録
  subtitle: 当社の文書システムは 2 層構造になっています。各モデル ファミリのマスター テクニカル ファイルと、生産されたボートごとの個別の船体記録です。
  items:
    - title: マスターテクニカルファイル
      description: 'モデルファミリーの完全なコンプライアンス文書が含まれています: 一般的な取り決め、リスク評価、安定性/浮力の計算、材料仕様、適用される規格、および適合性評価記録。 10 年以上保存されます。'
      icon: tabler:folder
    - title: 船体記録 (ボートごとのトレーサビリティ)
      description: 各船体には、マスター テクニカル ファイル (HIN、製造日、チューブ バッチ、材料証明書、圧力試験結果、最終構成、エンジンの設置、および配送先) にリンクする固有の記録があります。
      icon: tabler:file-description
    - title: カスタマーコンプライアンスパック
      description: DoC、ビルダーズプレートの写真、オーナーズマニュアル、テスト概要、最終構成シートを含む船体ごとの配送パッケージは、EU に出荷されるすべての RIB に付属しています。
      icon: tabler:package
faq:
  title: CE コンプライアンス — よくある質問
  questions:
    - q: すべての Paddle Board Overstock RIB ボートは EU 市場向けに CE 認定を受けていますか?
      a: 当社のカタログにある RIB ボートは、該当する EU 指令に従って RCD 2013/53/EU に準拠するように設計され、文書化されています。 CE マーキングは、モデルごと、構成ごとに適用されます。モデル固有のコンプライアンス範囲に関する文書については、お問い合わせください。
    - q: RCD 準拠と CE マーキングの違いは何ですか?
      a: RCD (Recreational Craft Directive 2013/53/EU) は、必須の安全要件を設定する EU の法律です。 CE マーキングは、これらの要件を満たしていることが評価および確認された製品に付けられる視覚的なシンボルです。製品に CE マークを付けるには、RCD に準拠する必要があります。
    - q: 各ボートに適合宣言書を提供していますか?
      a: はい。 EU 市場に納入されるすべての RIB ボートには、該当する指令、整合規格、適合性評価モジュール、および認証機関の詳細をリストしたモデル固有の EU 適合宣言書が含まれています。
    - q: Paddle Board Overstock はどのような適合性評価モジュールを使用していますか?
      a: モジュールは設計カテゴリとボートのタイプによって異なります。設計カテゴリ C のほとんどの RIB モデルはモジュール A (内部生産管理) を使用します。設計カテゴリ A/B ボートまたは特定の構成の場合、モジュール B+C または B+D がノーティファイドボディの関与とともに適用される場合があります。プロジェクトごとに適切なモジュールについてアドバイスします。
    - q: 注文する前にコンプライアンス文書を共有していただけますか?
      a: 適切な調査の後、お客様が評価しているモデルに適用可能な規格、適合ルート、および文書タイプをリストした準拠範囲文書を共有します。完全な技術ファイルは、注文確認後に NDA に基づいて共有されます。
    - q: 船体識別番号 (HIN) とは何ですか? それは含まれますか?
      a: HIN は各ボートに永続的にマークされる 14 文字の一意の識別子で、メーカー コード (MIC)、モデル指定、製造年、シリアル番号をエンコードしています。これは、EU 市場に投入されるすべての RIB ボートに必須であり、すべての Paddle Board Overstock RIB に含まれています。
    - q: 技術ファイルはどのくらいの期間保存されますか?
      a: RCD 2013/53/EU 要件に従って、メーカーは製品が市場に投入された最終日から少なくとも 10 年間技術ファイルを保持する必要があります。 Paddle Board Overstock は、生産されたすべてのモデルの完全な技術文書を保管しています。
    - q: RCD に基づく輸入者の義務を支援しますか?
      a: はい。当社は、EU 輸入業者が義務を果たすために必要な文書パッケージ (テクニカル ファイル アクセス、DoC、ビルダーズ プレート、オーナーズ マニュアル、製品トレーサビリティ記録など) を提供します。 RCD に基づく輸入者の責任は、当社のコンプライアンス ガイドに明確に文書化されています。
