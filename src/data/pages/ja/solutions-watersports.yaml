content_challenge:
  tagline: 挑戦
  title: ウォータースポーツ事業<br />多用途な RIB の需要
  subtitle: セーリング スクール、ウォーター スポーツ センター、イベント主催者は、指導、曳航、安全、輸送など、複数の役割を実行できるボートを必要としています。多くの場合、数時間以内に機能を切り替えることができます。
  paragraphs:
    - "マリンスポーツは最も多様性に富む海洋産業の一つです — セーリング指導からウェークボードやウォータースキーなどの動力系アクティビティ、あらゆるレベルの競技イベントまで幅広くカバーします。それぞれの用途は異なる船の性能を求めますが、多くの事業者は日常のスケジュールの中で複数の役割をこなせる単一の船隊を必要としています。"
    - '**セーリングスクール**では、インストラクターが立って実演できるだけの安定性、転覆したセイラーへ素早く駆けつけられる速力、繰り返しのビーチランディングに耐える頑健さを備えたコーチング用 RIB が必要です。船には高い視認性、狭いマリーナ内での機動性、風が止んだ際にセイルボートを岸まで曳航できる能力が求められます。'
    - 'ウォータースキー、ウェークボード、牽引チューブライドを運営する**ウォータースポーツセンター**には、安定したウェーク特性、強力な発進加速、連続セッションに対応する大きな航続距離を備えた専用設計のトウボートが必要です。ライダーの救助と安全監視には低速時の安定性が不可欠です。'
    - 'ヨットレース、トライアスロン、ウォータースポーツ競技会を運営する**イベント主催者**には、コース境界の巡回、ルールの執行、緊急時の対応、審判員の輸送をこなせるマーシャル艇および安全艇が必要です — 複数日にわたるイベント全期間を通じて、プロフェッショナルな外観と信頼できる性能を維持しながらです。'
    - "この3つのセグメントに共通するのは、多様な条件下でも最小限のダウンタイムで運用できる、多目的で耐久性に優れ、プロ仕様の装備を備えた RIB へのニーズです。Aquafarer はこれらそれぞれの役割に特化した構成のマリンスポーツ用 RIB を製造しています。"
content_solution:
  tagline: 私たちのソリューション
  title: ウォータースポーツ RIB<br />あらゆる役割に合わせて構築
  subtitle: Aquafarer ウォータースポーツ RIB はモジュール構成で設計されており、単一のボート プラットフォームで業務全体にわたって複数の役割を果たせるようになります。
  list:
    - "安定した船体設計 — インストラクターが船上から指導しながら安心して立ち、移動できます"
    - "ウォータースキー、ウェークボード、チューブ牽引用のトウパイロンと牽引ロープ取り付けポイント"
    - "マリンスポーツ牽引に最適なエンジンと船体のマッチングによる優れた加速性能"
    - "長時間の水上セッションでもインストラクター、コーチ、審判員が快適に過ごせるプロ仕様のシートレイアウト"
    - "ウィンドシールド、航法電子機器、VHF 無線、安全装備品収納を備えたフルコンソール"
    - "海洋グレードの Hypalon または PVC チューブ — 紫外線と海水に強く、長い使用寿命を実現"
    - "滑り止めデッキ表面 — 飛沫やライダー救助でデッキが濡れても乗組員が安全に移動できます"
    - "カスタムブランディングとデカールパッケージ — スクール、センター、イベントのカラーに合わせられます"
    - "毎日の進水・揚収に対応するダビット吊り上げポイントとビーチランディング強化"
    - "長時間の日常運用に対応する燃費に優れた4ストローク船外機構成"
content_segments:
  tagline: ウォータースポーツのプロフィール
  title: RIB ソリューション<br />ウォータースポーツの種類別
  subtitle: ウォータースポーツのオペレーションが異なれば、ボートの構成も異なります。私たちはあらゆる RIB を、それが果たす特定の役割に合わせて調整します。
  items:
    - title: セーリング スクールとトレーニング センター
      subtitle: セーリング指導、安全カバー、ヨット牽引用のコーチ RIB
      description: セーリング スクールは、保護された湾、湖、沿岸水域で運営されており、初心者から上級セーラーまでを対象としたトレーニング セッションを年間を通じて開催しています。コーチ RIB は、移動式教示プラットフォーム、安全カバー船、および曳航ボートとして機能します。インストラクターには、立ってデモンストレーションするための安定したデッキ、転覆した生徒に連絡するための迅速な対応、毎日のビーチへの着陸やマリーナの操縦のための頑丈な構造が必要です。信頼性は最も重要です。コーチボートが壊れると、レッスンはキャンセルされ、生徒は失望することになります。ボートはまた、学校の品質を反映するプロフェッショナルな外観を備えている必要があります。
      features:
        - "低フリーボードの安定プラットフォーム — 教官と生徒が至近距離でコミュニケーションできます"
        - "インストラクターが立ち上がって移動する際の安全を確保する滑り止めデッキと手すり"
        - "動けなくなったセイルボートを岸へ戻すためのトウポストとブライダル取り付け"
        - "転覆または流された生徒へ素早く対応できる速い滑走船体"
        - "コンパクトな全長（4.3～5.2 m）— トレーラー輸送とシーズンオフの保管が容易"
        - "訓練エリア全体で視認しやすい高視認性カラーを選択可能"
        - "至近距離での操船時に生徒の安全を守るプロペラガードオプション"
    - title: ウォーター スポーツ センターと牽引業者
      subtitle: 水上スキー、ウェイクボード、インフレータブル チューブ ライド用の牽引 RIB
      description: 湖、川、海岸沿いで運営されているウォーター スポーツ センターでは、水上スキー、ウェイクボード、ニーボード、観光客や地元住民向けの牽引可能なチューブ ライドなど、大量の牽引業務が毎日行われています。曳航ボートには、安定した後流特性、ライダーを素早く飛行機に乗せるための強力な加速、ライダーを乗せて落下から回復するための安定した低速ハンドリングが必要です。これらのボートは海岸線近くの浅瀬で航行するため、強化された船体とプロペラの保護が必要です。毎日 8 ～ 10 時間連続してセッションを実行する場合、燃料効率が重要になります。このボートは、安全なプラットフォームとしても機能し、ドライバー、スポッター、そして場合によってはコーチを乗せて、有料の顧客を招待しています。
      features:
        - "強力な発進加速と安定した牽引速度を実現する用途に合わせたエンジン出力"
        - "ライダーへの最適な牽引角度となる位置に配置されたトウパイロンとロープ取り付けポイント"
        - "滑らかで予測しやすいウェーク — ライダーに快適で安全な体験を提供"
        - "ライダーの安全な救助と転倒復帰のための低速安定性"
        - "頻繁なビーチおよび浅瀬での運用に対応する強化キールと船体"
        - "浅い運用エリアでの保護を目的としたプロペラトンネルまたはガード"
        - 6～8時間の連続牽引運用に対応する大容量燃料タンク
        - "ライダーを常に明視できる運転席とスポッター席"
    - title: イベントおよび競技団体
      subtitle: 海洋イベントのマーシャル、安全、公式輸送 RIB
      description: レガッタの主催者、トライアスロン レースのディレクター、ウォーター スポーツ競技コーディネーターは、コース管理、安全カバー、公式輸送のために、信頼性が高くプロフェッショナルな外観の RIB を必要としています。これらのボートは、コース境界をパトロールし、レース規則を施行し、初期対応の医療支援を提供し、裁判官やメディア関係者の輸送を行います。イベントは、風、波、流れなど、あらゆる気象条件で実行され、安定したハンドリングと信頼性の高いパフォーマンスが求められます。ボートの外観は、参加者、観客、メディアの前でイベントのブランドを表すため、重要です。複数日に渡るイベントでは、メンテナンスのダウンタイムを最小限に抑えながら毎日運航できるボートが必要です。
      features:
        - "あらゆる条件下で審判員が立ち、カメラを安全に操作できる安定した船体"
        - "フル航法装備 — GPS チャートプロッター、VHF 無線、早朝・夜間の運用に対応する航海灯"
        - "緊急時に対応できる救急医療キットの収納"
        - "イベントスポンサーの露出に対応するプロ仕様のブランディングとデカールパッケージ"
        - "審判員、メディア、医療要員に対応する複数のシート構成"
        - "コースの迅速な再配置と緊急対応を可能にする速い滑走速度"
        - "長時間の水上任務でも快適な、防風・防波コンソールとウィンドシールド"
        - "混雑したイベントマリーナでの桟橋接触に耐える耐久性のあるチューブ構造"
