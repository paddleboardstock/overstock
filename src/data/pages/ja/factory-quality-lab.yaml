hero:
  tagline: 品質管理ラボ
  title: テストラボ・品質保証
  subtitle: ISO 9001 プロセスに基づく独立した品質ラボ — すべてのユニットを出荷前にテスト

intro: Aquafarer は生産から独立して運用される専用の品質管理ラボを運営しています。原材料の各バッチと完成したすべてのボートは、リリース前に文書化された検査プロトコルを通過します。QC チームは経営陣に直接報告し、公正な品質判断を保証します。

highlights:
  - value: 100%
    label: 圧力テスト済みユニット
    detail: すべてのチャンバー、すべてのボート
  - value: 48 h
    label: 気密保持テスト時間
    detail: 定格圧力の 1.25 倍で
  - value: '&lt;5%'
    label: 許容最大圧力降下
    detail: 24 時間保持で
  - value: AQL 2.5
    label: 重大欠陥しきい値
    detail: ISO 2859 サンプリングに基づく

test_procedures:
  - title: 原材料検査
    description: 受け入れるすべての PVC、ハイパロン、ドロップステッチ生地、金具のバッチを検査します。引張強度（ASTM D751）、引き裂き強度（ISO 4674）、耐 UV 性を検証。不適合材料は隔離され返品されます。
    standards:
      - ASTM D751（引張）
      - ISO 4674（引き裂き）
      - ISO 4892（UV）
  - title: 工程内 QC チェックポイント
    description: 生産作業者が各段階で自主検査を行います。QC 監査員がシフトを通じて無作為サンプリングを実施。溶接ピールテストは 50 ユニットごとに行われます。寸法チェックは 20 パネルごとです。
    standards:
      - ASTM D751（ピール）
      - 社内 100 ポイントチェックリスト
      - ISO 2859 サンプリング
  - title: 48 時間気密保持テスト
    description: すべてのチューブチャンバーを定格圧力の 125% に注入し、48 時間保持します。圧力センサーが温度補償付きで連続記録。5% を超える圧力降下があったチャンバーは、自動的にバッチ再検査が行われます。
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: 積載・バランステスト
    description: 完成したボートは、最大定格積載量で安定性、フリーボード、操作性をテストされます。各船は最終検査承認前に水上テストを受けます。
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: 汎用試験機（引張）
    spec: 5 kN、ASTM D751 準拠
  - name: 圧力低下テスター
    spec: マルチチャネル、0～50 psi、データロギング
  - name: UV 耐候性チャンバー
    spec: ISO 4892、1,000 時間サイクル
  - name: 厚さ計（デジタル）
    spec: 0.01 mm 分解能
  - name: ピールテスター（溶接）
    spec: 電動、50 N 容量
  - name: 温度チャンバー
    spec: "-40 °C ～ +100 °C"
  - name: 漏れ検出タンク
    spec: 6 m × 2 m、照明付き
