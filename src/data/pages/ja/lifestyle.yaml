hero:
  tagline: ライフスタイル
  title: Aquafarer<br />ライフスタイル
  subtitle: 水上で暮らす人のために — 週末の探検者から、毎日装備に頼る商用オペレーターまで。

values:
  - icon: 🌊
    title: 水上で生まれたブランド
    desc: すべての設計は、水の挙動を理解することから始まります。私たちはコンディションの限界から内側へ向かって設計します — 海は私たちの職場ではなく、師であるからです。
  - icon: 🔧
    title: 長持ちする設計
    desc: 最も持続可能な製品は、交換を必要としない製品です。マリングレードの素材、15 PSI 対応のドロップステッチコア、シーズンを超えて持ちこたえるシーム。
  - icon: '🏆'
    title: 設計で実現する手頃さ
    desc: ウォータースポーツは贅沢品であるべきではありません。ファミリー、ガイド、小規模オペレーターにとって理にかなった価格で、プロフェッショナルグレードのパフォーマンスを — 商用艦隊だけでなく。
  - icon: 🌍
    title: グローバルコミュニティ
    desc: '青島の海岸からヨーロッパの湖、東南アジアの川、南北アメリカの湾まで — 私たちのお客様に共通するのは、水上にいることへの愛です。'
  - icon: ♻️
    title: 責任ある製造
    desc: CNC 最適化ネストにより材料ロスを 5% 未満に削減。耐久性の高い構造が交換サイクルを減らします。私たちは長寿命のために造ります — それが最も持続可能な選択だからです。
  - icon: 🤝
    title: ずっと続くサポート
    desc: 20 年物の船体から今でもスペアパーツの依頼が来ます。保証対応は平均 24 時間です。販売後に消えることはありません — 製品の寿命の間、ずっと寄り添います。

