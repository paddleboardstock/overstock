content_founding:
  tagline: はじまり
  title: 'ウォーターフロントで生まれる'
  subtitle: 'Aquafarer は青島の沿岸作業場で、1 隻のボートと一つのビジョンから始まりました：本物の海洋コンディションに耐えるインフレータブルウォータークラフトを造る、というビジョンです。'
  paragraphs:
    - '2012 年、創業者たちは市場のギャップに気づきました — 当時のインフレータブルボートのほとんどは、手頃だが信頼性に欠けるか、高品質だが法外に高いかのどちらかでした。品質と価値の両方を提供するメーカーの余地があると彼らは信じたのです。'
    - '最初の船体は手作業で造られ、地元の水域でテストされ、漁師や小規模商用オペレーターからの実際のフィードバックに基づいて改良されました。造る、テストする、聞く、改善する — このフィードバックループは今日も私たちのエンジニアリング哲学の核にあります。'
    - '2015 年までに、評判は青島の外へと広がっていました。海外のディストリビューターがサンプルを求め始めたのです。地元の作業場として始まったものが、グローバルサプライヤーへと成長しつつありました。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 初期の生産作業場と製造の様子
content_growth:
  tagline: 成長とイノベーション
  title: '作業場から 12,000 m² の施設へ'
  subtitle: '人、設備、工程への継続的な投資が、Aquafarer を現代的な海洋製造施設へと変貌させました。'
  paragraphs:
    - '需要の拡大とともに施設も成長しました。小さな作業場から、RIB ボート、インフレータブルボート、SUP ボード、アクセサリーの専用生産ラインを備えた 12,000 m² の工場へと拡張したのです。'
    - 'CNC 裁断機、高周波溶接設備、ドロップステッチ生産ライン、総合的な試験設備に投資し、生産品質のあらゆる側面を管理できるようになりました。'
    - '今日、200～300 名の私たちのチームには、海洋エンジニア、材料科学者、品質管理スペシャリスト、熟練クラフトマンがいます — その多くは創業期から Aquafarer と共に歩んできたメンバーです。'
content_mission:
  tagline: 私たちのミッション
  title: '水上の自由をエンジニアリングする'
  subtitle: 'すべての Aquafarer 製品は、人々が水上で探索し、働き、活き活きと過ごせるように設計されています — 信頼性、安全性、手頃な価格とともに。'
  list:
    - '本物の海洋コンディションで性能を発揮するウォータークラフトを設計する — 紙の上だけではなく'
    - '信頼できる OEM/ODM サービスを通じて、ディストリビューターやブランドと永続的なパートナーシップを築く'
    - 'より良い価値を届けるために、製造工程を継続的に改善する'
    - 'すべての製品を、純正スペアパーツと技術的専門性でサポートする'
cta:
  title: '品質を大切にするメーカーと<br />提携する準備はできましたか?'
  subtitle: 'OEM/ODM プロジェクトについて私たちのチームにご相談ください — 最小ロットの圧力はなく、誠実なアドバイスだけを。'
  actions:
    - variant: primary
      text: 相談を始める
      href: /contact
    - text: 製品を見る
      href: /products
