breadcrumb: OEM/ODM メーカー
tldr:
  summary: Aquafarer は工場直販の OEM/ODM メーカーです。12,000㎡ の ISO 9001:2015 認証施設、年間 15,000 隻の生産能力、CE/BSCI/REACH/UKCA 準拠、2～10 隻からの低 MOQ に対応します。
  points:
    - 青島にある 12,000㎡ の ISO 9001:2015 認証施設
    - 熟練工 200～300 名による年間 15,000 隻の生産能力
    - CE 2013/53/EU、UKCA、BSCI、REACH 準拠
    - '低 MOQ：標準モデルは RIB 2～5 隻、SUP 5～10 台'
    - FOB 青島での出荷に対応し、50 カ国以上へ輸出
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 認証
      desc: 全生産ラインにわたる SGS 監査済みの品質マネジメントシステム。
      variant: cert
    - icon: ⭐
      title: CE・UKCA 準拠
      desc: EU 2013/53/EU および UK マーキング要件に完全準拠。
      variant: cert
    - icon: ⭐
      title: BSCI 社会監査
      desc: 検証済みの倫理的労働慣行と職場基準。
      variant: standard
    - icon: ⭐
      title: 2 隻からの低 MOQ
      desc: '標準 RIB モデルは 2～5 隻、SUP は 5～10 台から。カスタム金型は 200 隻以上。'
      variant: standard
process_section:
  eyebrow: 私たちのプロセス
  title: エンドツーエンドの OEM/ODM ワークフロー
  subtitle: デザインブリーフからコンテナ積み込みまで — あなたのプライベートブランドのインフレータブルボートが完成する 6 つのステップ。
  steps:
    - step: '01'
      title: 仕様・デザインブリーフ
      desc: 目標仕様、CAD 図面、または参照製品をお送りください。当社のエンジニアリングチームが、見積もりの前に材料、寸法、コンプライアンス要件（CE、BSCI）を確認します。
    - step: '02'
      title: 3D 金型プロトタイピング
      desc: SUP ボード、カヤック船体、RIB コンポーネントのカスタム金型を設計し、CNC 加工します。プロトタイプサンプルは 15～20 営業日以内に製作し、お客様の承認を得ます。
    - step: '03'
      title: 材料選定・サンプル生産
      desc: ミリタリーグレード PVC（0.9mm～1.2mm）、ハイパロン CSM、ドロップステッチコア生地からお選びいただけます。お客様のブランドカラー、ロゴ、パッケージを施した量産前サンプルを製作し、承認をいただきます。
    - step: '04'
      title: CE 工場監査・コンプライアンス
      desc: すべての OEM 注文にコンプライアンス文書が付属します — CE 適合宣言書、ISO 9001 トレーサビリティ記録、BSCI 社会コンプライアンス報告書、REACH 材料宣言書。
    - step: '05'
      title: 量産・ライン内 QC
      desc: 生産は当社の 100 項目品質チェックリストに従って行われます。各ユニットは、梱包前に 24 時間の耐圧テスト、シーム剥離テスト、外観検査を受けます。
    - step: '06'
      title: FOB 青島物流・出荷
      desc: 完成品は青島港でパレット積みされ、シュリンク包装され、コンテナに積み込まれます。すべての輸出書類と通関手続きを当社が処理し、リアルタイムの出荷追跡を提供します。
capabilities_section:
  eyebrow: 製造能力
  title: 製造できるもの
  subtitle: グローバル B2B パートナーのための 6 つの中核生産能力。
  items:
    - title: ドロップステッチ SUP ボード製造
      desc: 剛性が高く高圧（15～20 PSI）のスタンドアップパドルボードのための、全長にわたるドロップステッチコアのラミネーション。長さ、幅、厚さ、ロッカープロファイル、グラフィックデザインをカスタマイズできます。
    - title: PVC インフレータブルボート生産
      desc: 高周波溶接された PVC ディンギー、テンダー、スポーツボート。複数のチャンバー構成、フロアオプション（スラット、エアデッキ、ロールアップ）、アクセサリーの統合に対応します。
    - title: ハイパロン RIB ボート製造
      desc: 商業グレードのハイパロン CSM チューブを、グラスファイバーまたはアルミの深 V 船体に接着。パトロール、救助、ツアー、ダイビング用途に 3.3 m～6.0 m をラインナップします。
    - title: プライベートブランド・カスタムブランディング
      desc: 'フルプライベートブランドサービス：カスタムロゴの熱転写またはスクリーン印刷、ブランドパッケージ（リテールボックス、キャリーバッグ）、お客様の言語での取扱説明書、バーコード/UPC 登録。'
    - title: カスタム金型・治具設計
      desc: 社内の 3D CAD/CAM エンジニアリングチーム。独自の船体形状、デッキ構成、アクセサリー取付けポイントのための、カスタムアルミおよび複合材の金型を設計・製作します。
    - title: OEM アクセサリー・キッティング
      desc: ライフジャケット（CE 12402）、両方向ポンプ、カーボン/ナイロン パドル、修理キット、キャリーバッグ、リーシュ。リテール対応のフルキッティングとバンドルパッケージングを提供します。
experience_section:
  eyebrow: 実績
  title: ブランドを築いたパートナーシップ
  subtitle: Aquafarer と OEM/ODM 製造で提携したブランドや組織の実際のストーリー。
  stories:
    - quote: 私たちは、ナプキンに描いたスケッチと要件のリストを持って Aquafarer を訪れました。8 カ月後には、初回の CE 認証に一発で合格した量産可能な製品が完成していました。
      narrative: ヨーロッパのスタートアップが、新しい SUP デザインの ODM 製造を Aquafarer に依頼しました。Aquafarer の R&D チームは、CAD 設計、FEA 構造解析、流体力学シミュレーション、金型製作、プロトタイプ製作、量産治具までを一貫して担当。その過程でスタートアップの創業者は 3 回青島を訪れました。最終製品は修正なしで CE 認証に合格しました — 創業者はこの結果を、Aquafarer のエンジニアリングチームが当初からヨーロッパの規制要件を理解していたことによるものだと評価しています。
      context: ヨーロッパ SUP ブランドのローンチ、2023-2024
      source: ブランド創業者
    - quote: Aquafarer の NDA 保護と IP セキュリティの水準により、私たちは独自の設計を安心して共有できます。彼らは私たちの IP を、まるで自分たちのものであるかのように扱ってくれます。
      narrative: 独自のバルブ技術を持つアメリカの海洋機器メーカーは、大規模生産をしながら IP を保護できる製造パートナーを必要としていました。5 社の中国メーカーを監査した結果、同社は Aquafarer の IP 保護プロトコル、安全管理された設計ファイルの取り扱い、厳格な NDA への署名意向を評価し、Aquafarer を選択しました。この提携では 4 年間で 3 つの製品ラインを生み出し、IP 関連の事故はゼロです。
      context: アメリカの海洋機器メーカー、2021 年からの OEM 提携
      source: オペレーションズ担当 VP
