hero:
  title: サイズとスペックガイド
  subtitle: すべての Paddle Board Overstock 製品の寸法、積載量、推奨用途。

categories:
  inflatable: パフォーマンスを犠牲にせず携帯性を追求したインフレータブル SUP とカヤック。体重とパドリングスタイルに合ったサイズをお選びください。
  rib: 沿岸航行、パトロール、専門的な海洋業務のための硬式船体インフレータブルボート。長さとエンジン出力で選択してください。
  accessory: ウォータークラフトを補完するアクセサリーと安全装備。ユニバーサルサイズで複数の選択肢をご用意。

table:
  headers:
