how_to_choose:
  title: 適切なサイズの選び方
  cards:
    - title: SUP ボード
      description: 体重と使用目的に基づいて長さを選んでください。幅の広いボード（32 インチ以上）は安定性が高く、長いボード（11～12 フィート）はツーリングでの直進性に優れます。体重の重いパドラーには容積の大きいボードが必要です。
    - title: カヤック
      description: 1 人乗りカヤック（9 フィート）はソロツーリングや川下りに最適です。2 人乗りカヤック（12 フィート）は 2 名のパドラー、または装備を携えた大人 1 名に対応します。装備を含む総積載量について耐荷重をご確認ください。
    - title: ディンギーと RIB
      description: 定員と使用目的に応じてディンギーの長さを選んでください。大型の RIB（4.5 m 以上）は沖合航行やレスキューに適しています。小型のディンギー（2.7 m）はテンダーや釣りプラットフォームとして利用できます。
