testimonial:
  content: アクアファーラーは、3 つのリゾート施設にわたるビーチ アクティビティ プログラム全体を設計し、備え付けました。 80 台の SUP、40 台のカヤック、安全インフラ、スタッフのトレーニングをすべて 1 回の発送で配送します。ウォーターアクティビティへのゲストの参加は、最初のシーズンで 60% 増加しました。
  name: ソフィー・ローラン
  title: アズール ベイ リゾート、ゲスト エクスペリエンス ディレクター — タイ、プーケット
content_segments:
  tagline: リゾートのプロフィール
  title: ウォーターフロントのホスピタリティ ソリューション<br />物件タイプ別
  subtitle: ブティックのエコ ロッジから広大な高級ビーチフロント リゾートまで、すべてのリゾート施設には、ゲストのプロフィール、アクティビティの組み合わせ、運営リズムが異なります。私たちは、不動産クラスやゲストの期待に合わせたウォーター スポーツ プログラムを企画します。
  items:
    - title: ビーチフロントの高級リゾート
      subtitle: VIP送迎、ウォーターアクティビティ、プレミアムなゲスト体験
      description: フォーシーズンズ、アマン、および同様の高級グループの高級ビーチフロント施設では、ウォーター スポーツが顧客の主要なアメニティとして満足度スコアと付随収益をもたらしています。フリートは高級感があり、年齢層や能力レベルに合わせて多様性を提供し、リゾートの既存のコンシェルジュや予約システムとシームレスに統合する必要があります。ゲストの出演に対する期待は非常に高く、機器の状態やプレゼンテーションが 5 つ星の評価に直接影響します。
      features:
        - 'プレミアムブランドフリート：SUP、カヤック、ペダル ボート、小型テンダー RIB'
        - 'ゲストを迎える準備が整ったプレゼンテーション：リゾートに合わせたカラー、ロゴブランディング、演出された備品ディスプレイ'
        - "専用内装とカラーマッチングを備えたVIPゲスト送迎用の小型高級 RIB"
        - '統合された安全インフラ：ブイライン、ライフガードスタンド、AED'
        - '収益管理：ダイナミック価格設定テンプレート、アップセル トレーニング、パッケージのセット販売'
    - title: プライベートアイランドリゾート
      subtitle: 全天候型ゲスト輸送 - ダウンタイムゼロ、絶対的な信頼性
      description: プライベート アイランド リゾートは、本土への唯一の接続手段がボートである遠隔地で運営されています。毎日のゲストの移動、物資の輸送、緊急医療搬送は 1 隻の船舶に依存しており、ダウンタイムはゲストのエクスペリエンスとリゾートの運営に直接影響します。これらのオペレーターは、あらゆる気象条件で確実に稼働し、最小限のメンテナンスで済み、ミッションクリティカルな信頼性を実現するバックアップ システムを備えたボートを必要としています。ゲストが島に到着するときにも、ボートは美しくなければなりません。
      features:
        - "完全な全天候カバーと頑丈なチューブを備えたオールウェザー RIB 構成"
        - "ツインエンジンまたはバックアップエンジンの装備で、ダウンタイムゼロの運用を実現"
        - "遠隔地での使用に対応した商業用グレードの Hypalon 構造で5～8年の耐用年数を実現"
        - "アクセスしやすい部品を採用した、現地メンテナンスが容易な設計"
        - "島の美観に調和したリゾート専用ブランディングとプレミアム内装"
    - title: レイクサイド & エコ リゾート
      subtitle: 自然と一体化したゲスト体験
      description: 湖畔の施設、エコロッジ、自然保護区では、自然環境を補う静かで影響の少ない水上アクティビティを提供しています。設備は可能な限りモーターを使用せず、限られたスペースのボートハウスに簡単に保管でき、すべてのゲストの環境体験を維持するために静かに使用する必要があります。
      features:
        - '非機動フリート：SUP、カヤック、カヌー、ペダル ボート'
        - "必要なときにゲストが利用できる、静かな電動ポンプ式膨張ステーション"
        - "サステナビリティブランディングに合わせた環境にやさしい素材とパッケージング"
        - "保管ラックとボートハウス整理システムを含む"
    - title: ビーチクラブ
      subtitle: ゲストの送迎、エンターテイメント、スモール・ラグジュアリー・リブ
      description: ビーチ クラブは、設備も雰囲気の一部であり、エネルギーに満ちた視覚に重点を置いた環境を運営しています。近くのホテルや埠頭からのゲストの送迎には小型の豪華な RIB が必要で、ゲストの娯楽にはジェット スキー牽引、インフレータブル スライド、パドルボードなどの水遊び用のおもちゃが必要です。フリートはスタイリッシュに見え、操作が簡単で、さまざまなスキルレベルのゲストによる毎日の使用に耐えられるものでなければなりません。ピーク時間帯には、ストレージと迅速な導入が重要です。
      features:
        - "ゲスト送迎とテンダーサービスに対応するコンパクトな高級 RIB (3.3～4.3m)"
        - 'ウォータートイ：牽引式インフレータブル、SUP ボード、ゲストエンターテイメント用カヤック'
        - "ビーチクラブのビジュアルアイデンティティに合わせた専用カラーとブランディング"
        - "回転率の高い運用向けの迅速な投入・回収システム"
        - "日常的な海水や紫外線への曝露に耐える耐久性のある Hypalon 構造"
    - title: プライベートメンバーズクラブとヨットクラブ
      subtitle: 港湾輸送、会員入札、特別なウォーター スポーツ
      description: ウォーター スポーツやボートの輸送が収益の原動力ではなく、会員の利益となるプライベート クラブ。機器はより高い美的基準を満たし、会員の要求に応じて利用可能であり、スタッフの監督は最小限で済む必要があります。マリーナ ヨット クラブは、港湾輸送、つまり波止場、係留所、海岸の間でメンバーを移動させるための入札を特に必要としています。保管とメンテナンスはメンバーには見えないようにする必要があります。
      features:
        - "港湾輸送と会員送迎サービスに対応するハイエンドのテンダー RIB"
        - 'プレミアム設備：EVA デッキ、会員専用カラー、ブランド入り内装'
        - "スタッフなしで会員が利用できるセルフサービス貸出システム"
        - "オフシーズン保管と年次リフレッシュプログラム"
    - title: 冒険とアクティビティを重視したホテル
      subtitle: ガイド付きツアー、SUPヨガ、シュノーケリングツアー、グループアクティビティ
      description: ガイド付きツアー、SUP ヨガ、サンセット パドル、シュノーケリング ツアー、グループ アクティビティなどを提供し、冒険の目的地としての地位を確立している施設。フリートは、ゲストのセルフ使用とインストラクター主導のツアーの間をシームレスに移行できる機器を備えた、無料レンタルとガイド付きプログラム モデルの両方をサポートする必要があります。これらの施設には、ゲストグループ間で簡単に清掃できる、頻繁な入れ替わりに対応した耐久性のある設備が必要です。
      features:
        - "レンタル + ガイド付きツアーの両モデルに対応する万能なミックスフリート"
        - "グループアクティビティに最適なタンデムカヤックと安定性の高い SUP プラットフォーム"
        - 'ガイド用設備：インストラクターボード、ドライボックス、防水通信機器'
        - '季節ごとの機材ローテーション：夏季フリート → 冬季保管プログラム'
        - "最小限のメンテナンスで日常的なゲスト使用に耐える耐久性のある構造"
