hero:
  tagline: ホテル、リゾート、ホスピタリティ
  title: プレミアムなウォーターフロント体験<br />ホテル、リゾート、ヨットクラブ向け
  subtitle: ビーチフロントのホテル、プライベートアイランドリゾート、ビーチクラブ、ヨットクラブ向けのターンキーウォータースポーツプログラム - ゲスト用具やRIB入札から安全システムやスタッフトレーニングまで。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: リゾートのウォーターフロントアクティビティ用のインフレータブルボート「Aquafarer」
direct_answer: アクアファーラーは、世界中のホテル、リゾート、プライベートアイランド、ビーチクラブ、ヨットクラブと提携して、プレミアムなウォーターフロント体験を生み出しています。当社のソリューションには、SUP レンタル フリート、ガイド付きツアー カヤック、ゲスト送迎用のテンダー RIB、ビーチ クラブ送迎用の小型高級 RIB、完全な安全システムが含まれます。すべての設備に、施設のロゴと配色を使用してブランド化できます。また、シーズンを通して一貫した品質を確保するために、スタッフのトレーニング、プログラム設計のコンサルティング、車両の交換計画も提供します。
