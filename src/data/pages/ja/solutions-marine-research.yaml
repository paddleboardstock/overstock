content_challenge:
  tagline: 挑戦
  title: 海洋研究の需要<br />安定した機器対応プラットフォーム
  subtitle: 科学作業船は、高感度の機器を搭載するための安定したプラットフォーム、野生動物の邪魔をしない静かな操作、および多様な研究機器のための柔軟なレイアウトを提供する必要があります。
  paragraphs:
    - "海洋調査や環境モニタリングには、移動式実験室として機能する作業艇が必要です。商業船やレジャー艇とは異なり、調査用 RIB は精密な電子機器、水質や堆積物のサンプリング機器、場合によっては生物試料の輸送に対応しつつ、正確なデータ収集のための安定したプラットフォームを維持しなければなりません。"
    - '**プラットフォームの安定性が重要** — ソナー、測深儀、CTD プロファイラー（導電率・水温・深度）は、停止時や低速航行時に安定した船体を必要とします。過剰な航跡波や船体の動揺は科学データにノイズを混入させます。安定性に優れたディープ V 型船体が不可欠です。'
    - '**機器の統合** — 調査船には GPS アンテナ、ソナートランスデューサー、サンプリングアーム、データロギング機器の取付ポイントが必要です。コンソール空間には複数のディスプレイ、機器用の電源配分、精密機器を安全に保管するスペースを確保しなければなりません。'
    - '**静粛な運転** — 海洋生物学の調査や環境モニタリングでは、エンジン音や船体振動が海洋生物を驚かせ、行動観察を妨げる可能性があります。研究用途には、静粛な船外機構成と振動を抑えた船体設計が重要です。'
    - Paddle Board Overstock の調査用 RIB は、安定した船体プラットフォーム、統合型の機器取付システム、静粛な船外機構成を備え、科学調査や環境モニタリングの用途に対応して設計されています。
content_solution:
  tagline: 私たちのソリューション
  title: 研究専用の RIB<br />科学および環境活動向け
  subtitle: すべての Paddle Board Overstock 研究 RIB は、科学機器およびフィールド サンプリング機器用の安定したカスタマイズ可能なプラットフォームとして構成されています。
  list:
    - "停止時や低速調査時に優れた安定性を発揮するディープ V 型 FRP 船体"
    - "ソナー、GPS、サンプリング機器用の取付プレートを備えたフラットデッキレイアウト"
    - "複数ディスプレイに対応したコンソール — プロッター、測深儀、データロガー"
    - "科学機器用の 12V・24V アクセサリー電源配分"
    - "静粛な 4ストローク船外機 — 野生生物調査のための最小限の振動と騒音"
    - "データ収集中の擾乱を最小限に抑える低航跡波船体設計（オプション）"
    - "研究機関のブランディングと艦隊識別のためのチューブカスタムカラー"
content_segments:
  tagline: 研究プロフィール
  title: 海洋科学ソリューション<br />アプリケーション タイプ別
  subtitle: 大学の教育プラットフォームから環境調査船、水質監視用の RIB まで、さまざまな研究アプリケーションには固有の容器要件があります。
  items:
    - title: 大学の海洋科学プログラム
      subtitle: 教育プラットフォーム、学生の野外旅行、沿岸調査
      description: 海洋科学大学と海洋学部は、フィールドコースの指導、学生の研究プロジェクト、教員主導の海岸調査のために、信頼性が高く多用途のワークボートを必要としています。ボートは、監督下で学生が操作しやすく、実際に機器を配置できるほど安定しており、学期を超えて複数のユーザーが頻繁に使用できる耐久性がなければなりません。学術環境では予算の制約があるため、費用対効果とメンテナンスの負担が少ないことが重要な考慮事項になります。
      features:
        - "学生が機器の展開・回収を実習できる安定したプラットフォーム"
        - "操作が簡単 — 監督下での学生使用に適したティラーまたはシングルコンソール構成"
        - "頻繁なビーチランディングと学生の取り扱いに耐える耐久性のある Hypalon チューブ"
        - "教育用ソナー、セッキ円板、サンプリング機器の取付対応"
        - "予算制約のある学術プログラムに経済的な PVC オプション"
    - title: 海洋研究所
      subtitle: 機器統合、GPS、サンプリング装置を備えた調査 RIB
      description: 沿岸および沖合の調査を実施する専門の海洋調査組織には、統合された機器を備えた専門的に構成された調査 RIB が必要です。これらの船舶には、深浅地図作成用のソナー システム、水柱分析用の CTD プロファイラー、堆積物サンプラー、および生物学的収集装置が搭載されています。ボートは、遅い調査速度でも安定したプラットフォームを提供し、機器を展開するための十分なデッキスペースを備え、電子機器にクリーンな 12V/24V 電源を提供する必要があります。
      features:
        - "統合型ソナートランスデューサー取付 — 船体貫通式またはトランサム取付"
        - "調査グレードの航法用 GPS アンテナ取付とコンソール統合"
        - "確実な固定ポイントを備えた CTD および水質サンプラーの展開エリア"
        - "機器およびデータロガー用の 12V/24V 補助電源配分"
        - "調査ラインの精度を確保する低速時（3〜6ノット）の安定性"
        - "より重いサンプリング機器を展開するためのオプションの Aフレームまたはダビット"
    - title: 環境モニタリングと保全
      subtitle: 生態調査、野生動物観察、生息地評価
      description: 環境 NGO、政府機関、自然保護団体は、海洋生態調査、野生生物の個体数監視、生息地の評価を行っています。これらの作業には、野生生物を妨げることなく敏感な生息地に近づくことができる、静かで衝撃の少ない船舶が必要です。ボートにはカメラ機器、トランセクトマッピング用の GPS、水と堆積物を収集するためのサンプリング装置を搭載する必要があります。行動観察研究には、低い航跡と最小限のエンジン騒音が重要です。
      features:
        - "静粛な 4ストローク船外機 — 海洋野生生物への擾乱を最小化"
        - "写真・ビデオ記録のための安定した観察プラットフォーム"
        - "カメラリグ、GPS トラッカー、フィールドコンピューター用の機器取付"
        - "沿岸湿地帯、マングローブ、河口域へのアクセスを可能にする浅喫水"
        - "サイト間の汚染除去が容易なデッキ・チューブ表面"
    - title: 水質の監視と検査
      subtitle: 定期的なサンプリングの実行、汚染物質の追跡、コンプライアンスの監視
      description: 水質監視組織は、汚染レベル、藻類の発生、環境規制の順守を追跡するために、沿岸地帯、港、内陸水路にわたって定期的なサンプリングを実施しています。これらの作業には、固定されたサンプリングステーションを繰り返し訪問するための効率的で信頼性の高いボートが必要です。容器には、サンプリング装置、サンプル保存用のクーラー、および現場試験装置を搭載し、相互汚染を防ぐためにサンプリングサイト間で簡単にデッキを洗浄できる必要があります。
      features:
        - "クーラーボックスと機器収納を備えた専用サンプリングステーションエリア"
        - "サイト間の汚染除去に対応した洗いやすいデッキとチューブ表面"
        - "固定サンプリング座標への正確な回帰を実現する GPS 統合"
        - "制限水域や狭い水路へのアクセスに対応するコンパクトサイズ"
        - "経済的な定期サンプリング運航に最適な燃費の良い船外機"
