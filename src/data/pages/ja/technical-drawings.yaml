      icon: tabler:sailboat
faq:
  title: 技術図面 — よくある質問
  questions:
    - q: GA PDF は本当に無料でダウンロードできるのでしょうか?
      a: はい。当社の主要モデルの概要PDFを無料でご利用いただけます。これらには、プロジェクトの評価、スペース割り当て、および予備的な仕様レビューに十分な計画レベルの情報が含まれています。
    - q: DXF/DWG ファイルにアクセスするにはどうすればよいですか?
      a: ダウンロード ページの短い認定フォームに、会社名、プロジェクトの種類、用途を記入してください。承認されたリクエストには、1 営業日以内に電子メールでダウンロード リンクが届きます。
    - q: STEP/IGES 3D モデルを入手できますか?
      a: STEP または IGES 3D モデル ファイルは、プロジェクト申請プロセスを通じて入手できます。プロジェクトの範囲、統合要件、タイムライン、購入意図を提供します。承認が必要となります – 通常 3 ～ 5 営業日以内。
    - q: より詳細なファイルへのアクセスを制限するのはなぜですか?
      a: 船体の形状、金型データ、構造計算は、長年にわたる研究開発投資を代表するものであり、中核となる製造知的財産です。当社は、新製品開発への継続的な投資能力を保護しながら、調達計画とプロジェクトの統合に必要なすべてを提供します。
    - q: 図面には製造の詳細が含まれていますか?
      a: いいえ。公開図面と簡易図面には、計画と仕様のための調達レベルの情報が含まれています。製造レベルの詳細（積層スケジュール、ツールパス、切断拡張）は、確認された注文を持つNDAの下でのみ共有されます。
    - q: カスタムまたはセミカスタム RIB 構成の図面は利用できますか?
      a: カスタム プロジェクトの図面は、OEM/ODM 開発プロセスの一環として作成されます。カスタム RIB プロジェクトを評価している場合は、要件をお知らせください。提案の一部としてプロジェクト固有の GA 図面を提供します。
