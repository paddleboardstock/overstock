content_version_control:
  tagline: "バージョン管理"
  title: 図面版<br />管理
  subtitle: すべての図面は管理された改訂システムに従います。プロジェクト計画に図面を使用する前に、最新のリビジョンを持っていることを必ず確認してください。
  items:
    - title: "改訂履歴管理"
      description: 各図面には、リビジョン コード (Rev-A、Rev-B、Rev-C)、発行日、最終レビュー日、適用可能なモデル/構成、単位、ファイル サイズ、および形式が含まれています。ダウンロードできるのは「最新」リビジョンのみです。
      icon: tabler:git-branch
    - title: 描画状況の通知
      description: すべての公開図面には、「暫定的なレイアウトのみ — 建設、認証、または製造用途には使用できません。寸法は最終仕様と注文確認の対象となります。」とマークされています。これにより、双方が誤用から保護されます。
      icon: tabler:alert-circle
    - title: アップデート通知
      description: モデルの仕様が変更されると、図面のリビジョンが更新され、以前のバージョンは「置き換え」とマークされます。 DXF/DWG パックをダウンロードした登録ユーザーには、重要なアップデートが電子メールで通知されます。
      icon: tabler:bell

