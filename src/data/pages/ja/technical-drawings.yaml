hero:
  tagline: 製図とCAD
  title: RIB およびインフレータブル ボート<br />技術図面および CAD のダウンロード
  subtitle: プロジェクトの評価と仕様のための計画レベルの GA 図面、寸法シート、デッキ レイアウト。公開 PDF からプロジェクト レベルの STEP ファイルまで、適切なレベルで技術図面にアクセスします。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB ボートの技術図面と CAD のダウンロード
direct_answer: Aquafarer は、一般手配書 (GA) PDF、寸法シート、デッキ レイアウト図面など、RIB ボートおよびインフレータブル ウォータークラフトの調達レベルの技術図面を提供します。より詳細な形式 (DXF/DWG、STEP/IGES) は、適切な問い合わせまたはプロジェクトの申請に応じて利用できます。
