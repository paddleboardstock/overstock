content_tiers:
  tagline: ダウンロード階層
  title: 4 つのアクセス レベル<br />— 適切な段階に適切な詳細を提供
  subtitle: 当社は製造レベルのファイルではなく、調達レベルの図面を提供します。各層は、異なるプロジェクトの段階に対応します。
  items:
    - title: Tier 1 — 公開 PDF
      description: PDF形式の一般配置図(GA)、4面寸法図、デッキレイアウト。無料でダウンロードできます。プロジェクト計画、スペース割り当て、および予備的な仕様レビューには十分です。
      icon: tabler:file-type-pdf
    - title: Tier 2 — ライトフォーム DXF/DWG
      description: 計画レベルのレイアウト統合のための 2D CAD ファイル (DXF または DWG)。短い資格フォーム (会社名、プロジェクトの種類、使用目的) が必要です。構造データや製造データは含まれていません。
      icon: tabler:file-code
    - title: Tier 3 — プロジェクト アプリケーション STEP/IGES
      description: システム統合、艤装設計、造船調整用の 3D モデル ファイル (STEP または IGES)。範囲、スケジュール、購入意図を伴うプロジェクトの申請が必要です。承認が必要です。
      icon: tabler:cube
    - title: Tier 4 — NDA エンジニアリング
      description: 船体の構造図、積層スケジュール、チューブの切断拡張、および金型データ。注文が確認されたNDAのもとでのみ利用可能です。これらは製造レベルのファイルであり、一般に配布するためのものではありません。
      icon: tabler:lock
content_included:
  tagline: 含まれるもの
  title: 描画内容<br />機種別
  subtitle: 各モデルには、B2B バイヤーおよびプロジェクト エンジニアにとって重要な計画情報をカバーする標準図面パッケージが含まれています。
  items:
    - title: 一般的な取り決め (GA)
      description: 船体の形状、チューブの位置、コンソールの位置、座席、燃料システム、主要な寸法 (LOA、ビーム、チューブの直径、デッドライズ角度) を示す側面図、上面図、および断面図。改訂ステータスと著作権は表題欄に記載されています。
      icon: tabler:layout
    - title: 4面寸法図
      description: 輸送計画のための全体的な寸法 (トレーラー上の高さ、コンテナのビーム、持ち上げるための重量) を含む側面図、正面図、背面図、および上面図。運用構成とトランスポート構成が含まれます。
      icon: tabler:ruler-2
    - title: デッキレイアウトと設備計画
      description: コンソール ベース、シート位置、D リングの位置、ナビゲーション ライトの位置、ビルジ ポンプへのアクセス、バッテリー/燃料コンパートメント、および機器の取り付けポイントを示すトップダウン デッキ ビュー。独自のインターフェイスでは精度が制限されます。
      icon: tabler:map
    - title: 輸送および梱包図
      description: 物流計画のためのコンテナの積載計画、クレードルの寸法、重量配分、吊り上げポイントの位置。標準およびカスタムのパッケージング オプションが含まれます。
      icon: tabler:truck
content_protection:
  tagline: IP保護
  title: 共有しない内容<br /> とその理由
  subtitle: エンジニアリング知的財産を保護することで、バイヤーがプロジェクト計画に必要とするすべてのものを提供しながら、研究開発への投資を継続できるようになります。
  items:
    - title: 船体モールドコアデータ
      description: プラグ アンド モールドの形状、CNC ツール パス、積層テンプレートは独自の製造資産です。これらは、確認された NDA 契約以外のアクセス層では共有されません。
      icon: tabler:ban
    - title: チューブの切断拡張
      description: チューブ生地のフラット パターン カッティング ファイルは製造レベルのデータです。確認済みの製造注文を伴う NDA に基づいてのみ利用可能であり、契約当事者とのみ共有されます。
      icon: tabler:ban
    - title: 構造計算
      description: 詳細な応力解析、FEA の結果、およびラミネートのスケジュールは、適合性評価プロセス中に通知機関および NDA に拘束されたクライアントとのみ共有される、コンプライアンスに敏感な文書です。
      icon: tabler:ban
    - title: 競合他社のスクリーニング
      description: 当社は、競合他社、プロジェクトの背景を持たない学生、または正当な調達意図を持たない関係者からのものと思われる CAD アクセス要求を拒否する権利を留保します。
      icon: tabler:shield
