hero:
  tagline: 認証・規格
  title: '品質認証<br />とコンプライアンス規格'
  subtitle: 'Paddle Board Overstock 製品は、国際的な海洋安全基準、品質マネジメントシステム、環境規制に準拠して製造されています。'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock の品質認証・コンプライアンス文書
content_certifications:
  tagline: 当社の認証
  title: '認証された品質、<br />世界的に認識される'
  subtitle: '64のCE認証モデルと工場全体の認証が、品質、安全、環境責任への当社の取り組みを示しています。'
  items:
    - title: 'CE 認証済み'
      description: '64のCE認証モデルは、レジャー用水上艇の欧州 CE マーキング要件に準拠し、安全、健康、環境保護基準を満たしています。'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: '当社の品質マネジメントシステムは ISO 9001:2015 認証を取得しており、インフレータブル水上艇および海洋機器の設計、製造、流通を対象としています。'
      icon: tabler:clipboard-check
    - title: 'UKCA マーキング'
      description: '英国市場で販売される製品は UKCA マーキングを付けており、海洋機器およびパーソナルウォータークラフトに対する英国規制への準拠を確認しています。'
      icon: tabler:shield
    - title: 'BSCI 準拠'
      description: 'Paddle Board Overstock は BSCI（Business Social Compliance Initiative）の監査を受けており、倫理的な製造慣行、公正な労働条件、サプライチェーンの責任を示しています。'
      icon: tabler:heart-handshake
    - title: 'REACH 準拠'
      description: 'Paddle Board Overstock 製品に使用されるすべての素材は、化学的安全性に関する EU REACH 規制に準拠しており、PVC、ハイパロン、部品に制限物質が含まれていないことを保証します。'
      icon: tabler:flask
    - title: '素材テスト'
      description: '生地は引張強度、引き裂き強度、UV 劣化、コールドクラック性能についてテストされます。すべての生産バッチがサンプリングされ検証されます。'
      icon: tabler:test-pipe
content_factory:
  tagline: 工場基準
  title: '製造の卓越性<br />— 仕様どおりに造る'
  subtitle: '12,000㎡ の施設は、生産のあらゆる段階で厳格な品質管理プロトコルの下で運営されています。'
  list:
    - '受入検査：すべての原材料 — PVC 生地、ハイパロン、アルミ、ベニヤ、接着剤 — は生産に入る前に仕様に対してテストされます。'
    - '工程内品質管理：すべての生産段階に文書化された QC チェックポイントがあります。溶接強度、シームの位置合わせ、バルブ取付、金具の締付トルクをインラインで検証します。'
    - '圧力テスト：すべてのインフレータブルチャンバーを定格圧力の 1.25 倍で 24～48 時間テストします。漏れ率は ISO 6185 の許容範囲内でなければなりません。'
    - '最終検査：完成品は出荷前に寸法精度、外観仕上がり、アクセサリーの完全性、パッケージの完全性について検査されます。'
    - 'バッチトレーサビリティ：すべての製品に生産バッチ記録と紐づくシリアル番号が付いており、原材料から完成品まで完全にトレースできます。'
content_safety:
  tagline: 海洋安全基準
  title: '安全第一<br />— 信頼できる操業のために設計'
  subtitle: 'Paddle Board Overstock 製品は、商業・レジャー用途の国際的な海洋安全基準を満たすように設計・テストされています。'
  items:
    - title: 'ISO 6185'
      description: 'インフレータブルボートは、構造、安定性、浮力、積載容量に関する ISO 6185 規格に準拠しています。'
      icon: tabler:sailboat
    - title: 'ABYC 規格'
      description: '電気系統と燃料系統は、安全な設置と運転のための ABYC（American Boat & Yacht Council）規格に従っています。'
      icon: tabler:bolt
    - title: 'SOLAS 準拠'
      description: '安全装備と救命設備は、該当する場合 SOLAS（Safety of Life at Sea）要件を満たしています。'
      icon: tabler:lifebuoy
cta:
  title: 'プロジェクトに認証製品が必要ですか？'
  subtitle: '当社チームにご連絡いただき、お客様の市場向けの認証要件、文書、コンプライアンスについてご相談ください。'
  actions:
    - variant: primary
      text: 認証文書を請求する
      href: /contact
    - text: 品質ページを見る
      href: /quality
