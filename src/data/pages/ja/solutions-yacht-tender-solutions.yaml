content_challenge:
  tagline: 挑戦
  title: 'ヨットテンダーに求められる<br />性能と佇まい'
  subtitle: 'ヨットテンダーは単なるディンギーではありません — 母船の延長であり、品質の表現です。'
  paragraphs:
    - 'ヨットのオーナーと船長には、性能が高く、コンパクトに収納でき、美しく見えるテンダーが必要です。テンダーは、ゲストと乗組員の信頼できる移動手段を提供しながら、ヨットの美観を引き立てるものであるべきです。'
    - '**収納性が重要** — テンダーはデッキ上、ガレージ内、またはダビットに収まらなければなりません。揚降装置にとって重量は重要です。Paddle Board Overstock RIB は、コンパクトな収納プロファイルと優れたパワーウェイトレシオを提供します。'
    - '**性能への期待は高い** — ゲストは岸までの移送で滑らかで濡れない走行を期待します。プレミアムな体験のために、エンジンオプションは速度、航続距離、騒音レベルのバランスが取れていなければなりません。チャーター運用では、テンダーは毎日運行され、頻繁な使用に耐えなければなりません。'
    - '**外観が重要** — 不釣り合いや傷んだテンダーは、ヨット全体の佇まいを損ないます。カスタムチューブカラー、内装、ブランディングにより、テンダーが調和して見えるようにします。'
content_solution:
  tagline: 私たちのソリューション
  title: 'あらゆるヨット用途のための<br />テンダー構成'
  subtitle: 'Paddle Board Overstock の RIB テンダーは、お客様の船舶、運用形態、収納要件に合わせてカスタマイズできます — スーパーヨットビルダーの仕様からチャーターフリートプログラムまで。'
  list:
    - '母船に合わせた、または引き立てるカスタムチューブカラー — ハイパロンまたは PVC チューブに任意の RAL カラーを対応'
    - 'カスタム内装・ステッチ — カラーマッチングとロゴ刺繍を施したプレミアムマリングレード ビニール'
    - 'コンソールまたはティラー操舵 — 使用パターンと操縦者の好みに基づいて選択'
    - 'さまざまな海況で滑らかで濡れない走行のためのグラスファイバー深 V 船体'
    - 'コンパクト収納 — 空気を抜くか重ねて、デッキガレージ、ロッカー、ダビットに収納'
    - '耐 UV 性と長期的な外観維持のためのハイパロンチューブ'
    - '全モデルにリフティングポイントと曳航リングを標準装備'
    - 'オプションのバウカバー、フルカバー、保護チューフガード'
    - 'エンジン範囲：15 HP～60 HP — 船外機またはティラー構成'
    - 'ヨットビルダー・マリンディーラー向けの OEM/プライベートブランド対応'
content_segments:
  tagline: 顧客プロファイル
  title: '顧客種別ごとの<br />ヨットテンダーソリューション'
  subtitle: 'ヨット業界の各セグメントには固有の要件があります。Paddle Board Overstock は各用途に合わせてテンダーを構成します。'
  items:
    - title: スーパーヨットビルダー
      subtitle: OEM テンダー統合 — カスタム寸法、カラー、材料
      description: 'ヨットビルダーは繰り返し直面する課題があります：新しい船舶ごとに固有の寸法制約、重量制限、美観への期待があります。テンダーは母船のダビットシステムと完全に統合し、ガレージの精密な寸法内に収まり、数百万ユーロのヨットのデザイン言語に合致しなければなりません。わずかな不整合 — チューブカラーの相違、リフティングポイント位置の誤り、重量の非互換 — は引き渡しを遅らせ、ビルダーの評価を損ないます。Paddle Board Overstock はビルダーの調達・設計チームと直接連携し、カスタム RAL チューブカラー、マッチング内装、ブランド入りコンソールパネル、完全な OEM ドキュメントパッケージを備えたテンダーを納品します。'
      features:
        - 'ガレージ・ダビットの制約に合ったカスタム寸法仕様'
        - '任意の RAL チューブカラーとマッチング内装 — デザイン承認サンプルを提供'
        - 'コンソール、チューブ、シートバックへの OEM ブランディング'
        - '各モデルのリフティングポイント・ダビット適合検証'
        - '指定された揚降装置に最適化された船体重量'
        - '生産スケジュールに合わせた一括納品計画'
    - title: ヨット管理会社
      subtitle: フリート標準化テンダー — グローバルサポート、最小限のダウンタイム
      description: '管理会社は、地中海、カリブ海、南太平洋などで運用される複数のヨットを統括しています。彼らの中心的なニーズは信頼性です — 遠隔の港でテンダーが故障すれば、乗組員の残業、ゲストの不満、高額な駆け込み交換を意味します。フリート仕様の標準化は、船舶横断での乗組員訓練時間を短縮し、スペアパーツ管理を簡素化します。Paddle Board Overstock は、複数地域に船舶を持つ管理会社向けに、複数艇フリート価格、注文間で一貫した仕様、グローバルのスペアパーツサポートを提供します。'
      features:
        - '管理下のフリート全体で標準化された仕様'
        - 'フリート全テンダーで互換性のあるスペアパーツ'
        - '複数艇注文向けのフリート価格と数量割引'
        - 'グローバルなスペアパーツ在庫 — どの港にも迅速に発送'
        - '乗組員向けの一貫したサービス・メンテナンスドキュメント'
        - '異なる船舶所在地への複数艇納品調整'
    - title: ヨットチャーター事業者
      subtitle: 高頻度の日常運用 — 外観を損なわない耐久性
      description: 'チャーターテンダーは、ヨット業界で最も過酷な運用スケジュールに直面します：毎日のゲスト移送、上陸、マリンスポーツ支援、ポートテンダリング — チャーターシーズン中に 200 回以上の運用になることも。テンダーは、連続する乗降、海水への曝露、エンジン時間に耐えながら、ゲストへの引き渡しのたびに新品同様に見えなければなりません。外観の劣化は直接的なビジネス上の問題です — 傷んだテンダーはゲストのレビューとチャーター料金に影響します。Paddle Board Overstock はチャーターテンダーを、アップグレードされた内装、ヘビーデューティ ハイパロンチューブ、強化された取り扱い部で構成し、佇まいの品質を維持する長期耐久性を実現します。'
      features:
        - 'ヘビーデューティ ハイパロンチューブ — 毎日のチャーター運用で 5～8 年の寿命'
        - '頻繁な使用に対応する強化乗降ステップとグラブライン'
        - 'プレミアムな防汚ビニール内装 — チャーター間の清掃が容易'
        - '清掃が容易な滑り止めデッキ表面'
        - '短い回転期間に対応する整備アクセス性の良い信頼できる船外機パッケージ'
        - 'チャーターシーズンを通じて外観を維持する化粧グレードの材料'
    - title: ヨットディーラー・ブローカー
      subtitle: 船舶の完成と再販価値のための信頼できるテンダー供給
      description: 'ディーラーとブローカーには、販売する船舶に調和する高品質テンダーの安定した供給が必要です — ブランドポジショニングに合わせ、購入者の体験を高めるものです。テンダーの品質のばらつきや供給遅延は、ヨットの引き渡しを遅らせたり、リスティングの魅力を損なったりします。ディーラーは、マージンを維持するために、バッチ間で一貫した品質、信頼できるリードタイム、競争力のある価格を必要とします。Paddle Board Overstock は、季節に合わせた納品スケジュールのディーラー在庫プログラム、ショールーム展示用のコブランディングオプション、繁忙期の優先割り当てを提供します。'
      features:
        - 'オンデマンド対応モデルを備えた在庫プログラム'
        - '引き渡しカレンダーに合わせた季節別納品計画'
        - 'ショールーム展示のためのコンソール・チューブへのディーラーコブランディング'
        - 'すべてのバッチ注文で一貫した品質と仕様'
        - '数量ベースの階層による競争力のあるディーラー価格'
