hero:
  tagline: 私たちのストーリー
  title: 'Aquafarer — 水上の自由をエンジニアリングする'
  subtitle: '沿岸の小さな工房からグローバルな海洋メーカーへ — 私たちの歩みは、一つの頑固な信念の上に成り立っています。ウォータークラフトは大切なものとして設計されるべきです。実際に大切なものなのですから。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: 青島にある Aquafarer の工場と海洋製造施設

