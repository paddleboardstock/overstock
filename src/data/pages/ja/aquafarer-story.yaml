timeline:
  - year: '2012'
    title: '海洋製造の基盤を確立'
    body: 'Aquafarer は、海洋クラフトマンシップとインフレータブルボート製造に取り組む、中国・青島の専門的なインフレータブルウォータークラフト工房として始まりました。初期の焦点は、実践的なエンジニアリング経験と製造規律を通じて、信頼性の高いインフレータブル製品を作ることでした。'
  - year: '2015'
    title: '初の輸出と CE 認証'
    body: "最初の輸出注文は日本と韓国に届きました。主要製品ラインで CE 認証を取得し、Aquafarer の国際市場への参入を印象づけました。同社は中国国外の商用・レジャーユーザーへの供給を開始しました。"
  - year: '2018'
    title: '工場拡張'
    body: '12,000㎡ の生産施設に移転。RF 溶接ラインとドロップステッチ生産能力を追加し、より大規模な製造と改善された品質管理システムを実現しました。'
  - year: '2020'
    title: 'R&D センター設立'
    body: 'PVC 生地ラボ、流体力学テスト水槽、CAD/FEA シミュレーションスタジオを備えた専用の R&D センターを開設。製品開発は、軽量構造、耐久性の向上、ユーザー中心のデザインに焦点を拡大しました。'
  - year: '2022'
    title: '認証取得とグローバル成長'
    body: 'ISO 9001 認証を取得。14 名の R&D エンジニアと 200 名以上のワーカーへ拡大。ディストリビューターおよび OEM パートナーシップを通じて、製品はヨーロッパ、南北アメリカ、アジア太平洋全域の顧客に届きました。'
  - year: '2024'
    title: 'イノベーション・デザインスタジオ'
    body: 'コンセプトから生産まで、カスタム ODM プロジェクトのためのフルサービスのデザイン・イノベーションスタジオを開設。救助、商用、政府調達を含むプロフェッショナルな海洋用途を強化しました。'
  - year: '2026'
    title: '水上探査の未来を築く'
    body: "今日、Aquafarer はインフレータブルボート、SUP システム、カスタマイズされた海洋ソリューションの開発を続け、人々や組織を世界の水域とつなげています。50 以上の国にサービスを提供し、年間 15,000 隻の生産能力を備えています。"

content_founding:
  tagline: はじまり
  title: 'ウォーターフロントで生まれる'
  subtitle: 'Aquafarer は、青島の沿岸の工房で、1 隻のボートと一つのビジョンから始まりました：本当の海洋環境に耐えられるインフレータブルウォータークラフトを作ること。'
  paragraphs:
    - '2012 年、創業者たちは市場のギャップに気づきました — 当時のほとんどのインフレータブルボートは、手頃だが信頼性に欠けるか、高品質だが法外に高いかのどちらかでした。品質と価値の両方を提供するメーカーの余地があると彼らは確信したのです。'
    - '最初の船体は手作業で作られ、地元の水域でテストされ、漁師や小規模商用事業者からの実際のフィードバックに基づいて改良されました。作る、テストする、聴く、改善する — このフィードバックループは、今日も私たちのエンジニアリング哲学の核にあります。'
    - '2015 年までに、評判は青島の外へ広がっていました。海外のディストリビューターがサンプルのリクエストを始めました。地元の工房として始まったものが、グローバルサプライヤーへと成長しつつあったのです。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 初期の生産工房と製造風景

content_growth:
  tagline: 成長とイノベーション
  title: '工房から 12,000㎡ の施設へ'
  subtitle: '人、設備、プロセスへの継続的な投資が、Aquafarer を現代的な海洋製造施設へと変えました。'
  paragraphs:
    - '需要の拡大とともに、施設も成長しました。小さな工房から、RIB ボート、インフレータブルボート、SUP ボード、アクセサリーの専用生産ラインを備えた 12,000㎡ の工場へと拡大しました。'
    - 'CNC 切断機、高周波溶接設備、ドロップステッチ生産ライン、包括的なテスト設備に投資し、生産品質のあらゆる側面を管理できるようにしました。'
    - '今日、200～300 名のチームには、海洋エンジニア、材料科学者、品質管理スペシャリスト、熟練したクラフトマンが在籍しており、その多くは創業期から Aquafarer にいます。'

founder:
  tagline: '創業者をご紹介'
  title: 'ウォーターマンが築いたもの'
  subtitle: '創業者の David Chen は、製造の専門知識と生涯にわたるウォータースポーツへの情熱を兼ね備えています — この組み合わせが、Aquafarer の製品開発への取り組み方を定義しています。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Aquafarer 創業者
  story:
    - 'David Chen は青島の海岸で育ちました。そこでは海はバケーション先ではなく、生活そのものでした。彼は青春時代を黄海でのカヤック、セーリング、釣りに費やし — その経験から、ウォータークラフトが何に耐えなければならないかを直感的に理解するようになりました。'
    - 'Aquafarer の創業前、David は海洋製造業で 10 年間、生産、品質、国際貿易にわたって働きました。欧州および北米ブランドの OEM プログラムを管理し、グローバル市場の基準と期待を直接学びました。'
    - '2012 年、彼はシンプルな使命とともに Aquafarer を創業しました：自分の家族を水上で安心して預けられるインフレータブルウォータークラフトを作ること。「自分なら使うか?」 — この個人的な基準は、工場から出荷されるすべての製品に対する最終テストであり続けています。'
    - '今日、David は製品戦略を率い、R&D チームを統括しながら、新しいデザインを自ら確認し、青島沖の水域でプロトタイプをテストしています。優れた製品は、エンジニアリングと体験の両方の理解から生まれると彼は信じています。'

philosophy:
  tagline: 'ブランドフィロソフィー'
  title: '水上の自由をエンジニアリングする'
  body: '水上の自由は、移動だけを意味するものではありません。新しい場所の発見、アウトドア体験の創造、人と自然をつなぐこと、プロフェッショナルなミッションの実現を表しています。エンジニアリングがその自由を可能にします。'
  pillars:
    - title: '信頼性第一'
      body: '水上環境は信頼を要求します。Aquafarer の製品は、安定性、耐久性、安全性、一貫した性能を中心に設計されています。'
    - title: '人間中心のデザイン'
      body: '製品はテクノロジーではなく、人に奉仕するものであるべきです。すべての設計判断は、人々がウォータークラフトをどのように使い、どこで探検し、どのような課題に直面するかを理解することから始まります。'
    - title: '誰にでも開かれた探検'
      body: '水は専門家だけのものではありません。Aquafarer は、より多くの人が川、湖、海、沿岸環境を安全に体験できる器材を作ります。'
    - title: '継続的なイノベーション'
      body: 'イノベーションは、新製品を作ることだけではありません。材料、構造、製造、ユーザー体験 — すべての細部を改善することです。'

engineeringDna:
  tagline: 'エンジニアリング DNA'
  title: 'Aquafarer のものづくり'
  areas:
    - title: '材料科学'
      body: 'Aquafarer は、異なる海洋環境に適した材料の選定に注力しています。重要な考慮事項は、耐摩耗性、耐 UV 性、圧力安定性、長期耐久性です。'
      items: ['耐摩耗性', '耐 UV 性', '圧力安定性', '長期耐久性']
    - title: '構造エンジニアリング'
      body: 'インフレータブルウォータークラフトには、剛性、重量、携帯性、安定性の精密なバランスが必要です。Aquafarer のエンジニアリングは、ドロップステッチコア技術と先進的なシーム構造を通じて、これらの要素の最適化に焦点を当てています。'
      items: ['剛性', '重量最適化', '携帯性', '安定性']
    - title: '製造精度'
      body: 'すべての製品は、管理されたプロセスを経ます：材料準備、精密切断、溶接と接合、組立、品質検査、性能検証。'
      items: ['材料準備', '精密切断', '溶接・接合', '組立・QC']
    - title: 'ユーザーシナリオエンジニアリング'
      body: '製品は、レジャー、アドベンチャー、プロフェッショナル用途という実際のアプリケーションを中心に開発され、各デザインが意図された環境の特定の要求を満たすようにしています。'
      items: ['レジャー', 'アドベンチャー', 'プロフェッショナル', '商用']

