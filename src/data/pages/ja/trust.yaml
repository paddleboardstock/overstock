features3_certifications:
  title: '認証とコンプライアンス'
  subtitle: 'すべての製品が第三者機関によりテストされ、64モデルが国際規格でCE認証を取得しています。'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'CE 認証'
      description: 'SUP、カヤック、ディンギー、RIB を含む64のCE認証モデルが、レジャー用ウォータークラフトの欧州 CE 安全基準を満たしています。各製品は工場出荷前に圧力、浮力、積載テストを受けます。'
      icon: 'tabler:certificate'
    - title: ''
      description: '青島の 12,000㎡ 拠点は ISO 9001 品質マネジメントシステムの下で運営されています。すべての生産バッチが追跡可能で、文書化され、検査されます。'
      icon: 'tabler:clipboard-check'
    - title: 'BSCI 社会的コンプライアンス'
      description: '当社は BSCI 認証を取得しており、サプライチェーン全体で倫理的な労働慣行、安全な作業環境、環境責任を確保しています。'
      icon: 'tabler:users'
    - title: 'REACH & RoHS'
      description: 'すべての材料 — PVC、ハイパロン、EVA フォーム、接着剤 — が EU の REACH および RoHS 規制に準拠。規制物質は一切含まず、妥協もありません。'
      icon: 'tabler:flask'
    - title: '材料テストラボ'
      description: '社内の材料ラボでは、生産前のすべての生地バッチについて引張強度、耐 UV 性、シームの完全性、耐摩耗性をテストします。'
      icon: 'tabler:microscope'
    - title: '5 年間ボート保証'
      description: 'Aquafarer ボートには、チューブ生地、シーム、船体に対する 5 年間の限定保証が付きます。SUP ボードとアクセサリーには 2 年間の保証。私たちは自分たちが製造したものに責任を持ちます。'
      icon: 'tabler:shield-check'

testimonials:
  tagline: 'お客様の信頼'
  title: 'お客様の声'
  subtitle: '初めてのパドラーからプロフェッショナルなフリート運営者まで — なぜ Aquafarer が信頼されるのかをご覧ください。'
  items:
    - content: 'レンタルフリート全体を Aquafarer RIB で装備しました — 3 拠点で 12 隻。2 シーズン経過しても故障ゼロです。CE 認証のドキュメントのおかげで保険承認がスムーズでした。エンジニアリングチームは、当社ブランドに合わせてチューブの色までカスタマイズしてくれました。'
      name: 'Marco Valenti'
      title: '運営ディレクター、Adriatic Adventure Tours — クロアチア・ドブロブニク'
    - content: '初めての購入者として、海外から注文する品質には不安がありました。お願いする前に共有してもらえた ISO ドキュメントと第三者テストレポートに、完全な自信を得ました。ボードは 6 日で届き、期待を上回るものでした。'
      name: 'James Thornton'
      title: 'SUP Explorer 11 オーナー — カナダ・バンクーバー'
    - content: '沿岸警備フリートで 24 隻の Aquafarer RIB を運用しています。QC プロセスはどのバッチでも一貫しており — 毎回同じシーム品質、同じバルブ配置、同じ圧力定格です。人命が器材に委ねられる状況では、この再現性が重要です。'
      name: 'Lt. Commander Andres Reyes'
      title: '海事調達担当官、Philippine Coast Guard Auxiliary — フィリピン・マニラ'

features3_lab:
  title: '社内テスト・品質ラボ'
  subtitle: 'すべての材料バッチと完成品が、出荷前に当社の敷地内テストラボを通ります。'
  columns: 3
  isBeforeContent: true
  items:
    - title: '引張強度テスト'
      description: 'すべての PVC 生地ロールを ASTM D751 規格に基づきテスト。最低要件：タテ・ヨコ 350 N/cm。不合格バッチはサプライヤーに返品 — 当社は入荷材料の約 3% を不合格にしています。'
      icon: 'tabler:scale'
    - title: 'UV 促進劣化テスト'
      description: '生地サンプルは 1,000 時間の QUV 促進耐候性試験（ASTM G154）を受けます。UV 曝露後の引張強度保持率は 80% を超える必要があります。製品は 3 年以上の屋外使用に対応。'
      icon: 'tabler:sun'
    - title: 'シーム剥離強度'
      description: 'RF 溶接シームは最低 5 N/mm の剥離強度（ASTM D751）でテスト。手貼りハイパロンシームは 3.5 N/mm でテスト。各生産バッチのシームサンプルは破壊テストのうえ保管されます。'
      icon: 'tabler:stack'
    - title: '24～48 時間の圧力保持テスト'
      description: 'すべてのインフレータブル製品を定格 PSI の 1.25 倍に膨張させ、24～48 時間監視します。許容最大圧力低下：5%。このテストに不合格だった製品は、出荷前に修正して再テストされます。'
      icon: 'tabler:wind'
    - title: 'バルブサイクルテスト'
      description: 'すべてのバルブ設計が当社ラボで 10,000 回の開閉サイクルを受けます。バルブはサイクル後に定格圧力の 1.25 倍で気密を維持する必要があります。すべての Aquafarer バルブは 5 年以上の通常使用に対応。'
      icon: 'tabler:rotate'
    - title: '耐コールドクラック性'
      description: '材料は ISO 4646 に基づき -30°C で 4 時間テスト。割れや脆化は一切許容されません。製品は冬期保管および周囲温度 -10°C までの冷水使用に対応。'
      icon: 'tabler:snowflake'

steps2_manufacturing:
  title: '品質を確保する方法'
  subtitle: '原材料検査から最終圧力テストまで — すべての製品が厳格な品質チェーンを通ります。'
  items:
    - title: '原材料検査'
      description: 'すべての PVC 生地ロールは、生産に入る前に厚さ、引張強度、耐 UV 性をテストされます。'
      icon: 'tabler:search'
    - title: '工程内 QC'
      description: '溶接シーム、バルブ取付け、チャンバー接合は、組立中の各工程で検査されます。'
      icon: 'tabler:eye'
    - title: '圧力テスト'
      description: 'すべてのインフレータブル製品を定格 PSI の 1.25 倍に膨張させ、24～48 時間保持して、気密性とシームの完全性を検証します。'
      icon: 'tabler:wind'
    - title: '最終検査'
      description: '各ユニットは、出荷承認前に仕上がり、ハードウェア、梱包を検査されます。バッチサンプルは破壊テストのため当社ラボに送られます。'
      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'RIB ボート FAQ'
  subtitle: 'リジッド船体インフレータブルボートについてのよくある質問。'
  columns: 2
  items:
    - title: 'Aquafarer はどのサイズの RIB ボートを扱っていますか?'
      description: '2.5 m から 7.6 m までの 35 の RIB モデルをラインナップし、コンパクトなテンダーから過酷な用途の商用・警備艇までカバーします。各モデルには複数の構成オプションがあります。'
    - title: 'RIB と従来のインフレータブルボートの違いは何ですか?'
      description: 'RIB（リジッド船体インフレータブルボート）は、硬いグラスファイバーまたはアルミ製のディープ V 船体と、インフレータブルのハイパロンまたは PVC チューブを組み合わせたものです。ハードボートの安定性と積載能力に、インフレータブルの衝撃吸収と浮力を加えた性能を実現します。'
    - title: 'Aquafarer RIB にはどんなエンジンが対応していますか?'
      description: 'RIB はモデルに応じて 3 HP から 250 HP の船外機に対応します。各製品ページに最大定格エンジン出力が記載されています。理想的な組み合わせについては、販売店への相談をおすすめします。'
    - title: 'Aquafarer RIB は CE 認証を取得していますか?'
      description: 'はい。すべてのレジャー用 RIB モデルは、レジャー用ウォータークラフトに適用される欧州規格の CE 認証を取得しています。商用・警備モデルは、さらなる安定性および積載要件を満たしています。'
    - title: 'RIB ボートの保証はどのようになっていますか?'
      description: 'すべての Aquafarer RIB には、チューブ生地、シーム、船体に対する 5 年間の限定保証が付きます。膨張バルブは 5 年、工場取り付けアクセサリーは 1 年の保証です。'
    - title: 'Aquafarer RIB のエアチャンバーはいくつありますか?'
      description: 'RIB はモデルの長さに応じて 3～7 の独立したエアチャンバーを備えています。このマルチチャンバー設計により、1 つの区画が損傷してもボートは浮上し続けます。'

faqs_inflatable:
  title: 'インフレータブルボート FAQ'
  subtitle: 'インフレータブルディンギー、カヤック、ボートについてのよくある質問。'
  columns: 2
  items:
    - title: 'Aquafarer のインフレータブルボートにはどんな材料が使われていますか?'
      description: 'モデルに応じて、ミリタリーグレード PVC（1100 デニール）およびプレミアム ハイパロン/CSM ゴムを使用しています。どちらの材料も UV 安定化、耐摩耗性を備え、EU の REACH および RoHS 規制に準拠しています。'
    - title: 'インフレータブルボートの寿命はどのくらいですか?'
      description: '適切に手入れすれば、高品質な PVC インフレータブルボートは 7～10 年、ハイパロンモデルは 15～20 年使用できます。定期的な清掃、UV 保護、適切な保管により、使用寿命が大幅に延びます。'
    - title: 'インフレータブルボートにはどんなメンテナンスが必要ですか?'
      description: '基本的なメンテナンスには、使用後（特に海水中で使用した場合）の真水での洗浄、保管前の乾燥、年 1 回のバルブシール点検、チューブへの UV 保護剤の塗布が含まれます。使用しないときは長時間の直射日光を避けてください。'
    - title: 'インフレータブルボートは海水中で使用できますか?'
      description: 'はい。すべての Aquafarer インフレータブルボートは、淡水および海水の両方での使用を想定して設計されています。金具の腐食や生地の塩結晶化を防ぐため、海水にさらした後は真水で洗浄し、十分に乾燥させることをおすすめします。'
    - title: 'インフレータブルボートはどのように保管すればよいですか?'
      description: '保管前には、空気を抜き、清掃し、完全に乾燥させてください。ゆるく巻き（強く折りたたまない）、直射日光の当たらない涼しく乾燥した場所に保管し、コンクリート床から離して湿気の吸い上げを防ぎます。'
    - title: 'Aquafarer インフレータブルボートの積載重量はどのくらいですか?'
      description: '積載能力は、最小モデルの 290 kg から、大型商用艇の 2000 kg 以上までです。各製品ページに、お使いのモデルの最大積載定格が記載されています。'

faqs_sup:
  title: 'SUP ボード FAQ'
  subtitle: 'スタンドアップパドルボードについてのよくある質問。'
  columns: 2
  items:
    - title: 'どのサイズの SUP ボードがありますか?'
      description: '9 ft から 12 ft までの SUP ボードを、オールラウンド、ツーリング、ヨガ、特殊設計を含めてラインナップしています。売れ筋モデルには Tropical Breeze（10 ft）と Ocean Voyager（11 ft）があります。'
    - title: 'ドロップステッチ構造とは何ですか?'
      description: 'ドロップステッチ構造は、何千本ものポリエステル糸でボードの上下の層を接続し、高圧（15～20 PSI）を保持して剛性のある安定したプラットフォームを実現します。これはプレミアムインフレータブル SUP の業界標準です。'
    - title: 'SUP ボードの積載重量制限はどのくらいですか?'
      description: 'SUP ボードはモデルと体積に応じて最大 150 kg まで対応します。Leviathan Wake は当社最大の積載能力を持つモデルで、大型ライダーとヨガ用途のために設計されています。'
    - title: '完全な SUP パッケージはありますか?'
      description: 'はい。すべての SUP ボードには、3 ピースアルミパドル、高圧手動ポンプ、コイルリーシュ、旅行用バックパック、修理キットを含む完全なパッケージが付属します。一部のモデルには着脱式フィンセットも含まれます。'
    - title: 'SUP ボードの保証はどのようになっていますか?'
      description: 'すべての Aquafarer SUP ボードには、通常使用下でのシーム破損、バルブ欠陥、材料の層間剥離を含む製造欠陥に対する 2 年間の保証が付きます。'
    - title: 'SUP ボードの膨張にはどのくらいかかりますか?'
      description: '付属の手動ポンプで 15 PSI まで完全に膨張させるのに約 8～12 分かかります。より速く膨張させたい場合は、1 枚を 4 分未満で膨張させる Aquafarer 12V 電動ポンプをおすすめします。'

