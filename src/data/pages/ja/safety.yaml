hero:
  tagline: "安全"
  title: "安全規格と認証"
  subtitle: Aquafarerのすべての製品は厳格な試験を実施し、64のCE認証モデルがレジャーおよび業務用の国際安全規格を満たしています。ISO 9001認証工場。
trust_bar:
  items:
    - value: CE 6185
      label: "認証取得済みのレジャーボート"
      sub: TÜV Rheinland試験済み
    - value: SOLAS
      label: "オフショア安全基準適合"
      sub: 24時間浮力検証済み
    - value: ISO 9001
      label: "品質管理"
      sub: TÜV Rheinland監査済み
    - value: 99.3%
      label: "無欠陥率"
      sub: ISO 2859準拠 AQL 2.5
certifications:
  - title: CE認証（EU 2016/425）
    standard: PPE規則（EU）2016/425 | EN ISO 12402
    description: Aquafarerの安全装備はすべて、欧州個人用保護具規則に基づくCEマーク要件に適合しています。各製品は欧州の公告機関であるTÜV Rheinlandによる独立試験を受けています。当社のインフレータブルボートおよびRIBは、レジャーボート指令2013/53/EU（RCD）のカテゴリーCおよびD要件を満たしています。
    body: CE認証は、個人用浮力補助具およびインフレータブル艇に係る不可欠な健康・安全要件を対象とします。TÜV Rheinlandは継続的な適合を確認するため、当社の生産施設を毎年監査しています。
  - title: SOLAS — 海上における人命の安全
    standard: SOLAS第III章 | LSAコード
    description: Life Vest Proは、オフショアおよび商用海洋作業に関するSOLAS規則に適合しています。24時間の浮力保持、浸水時の自動膨張、最大風力5までの海象における性能が試験済みです。商用船舶用救命衣類の第III章要件を満たしています。
    body: SOLAS承認には、公告機関による浮力、強度、視認性、自動作動に関する独立試験が必要です。当社のLife Vest ProはMED認証を伴う完全なSOLAS型式承認を取得しています。
  - title: USCGタイプIII / タイプV
    standard: 46 CFR Part 160 | USCG承認
    description: "選定されたAquafarerライフベストは、米国沿岸警備隊のタイプIII（浮力補助）およびタイプV（特殊用途）機器の分類に適合しています。避難水域、沿岸クルージング、USCG承認済みPFDを必要とする商用作業に適しています。"
    body: USCG承認には、沿岸警備隊が認定した独立試験所による試験が必要です。タイプV承認には、手動または自動作動を必要とするハイブリッドインフレータブル設計が含まれます。
  - title: BSCI社会的コンプライアンス
    standard: amfori BSCI行動規範
    description: "当社工場は、amfori Business Social Compliance Initiative（BSCI）に基づき毎年監査を受けています。これにより、12,000 m²の生産施設における倫理的労務慣行、職場の安全、公正な労働時間、環境管理が検証されます。"
    body: BSCIコンプライアンスは欧州の小売業者および輸入業者にとって前提条件です。当社の現在のBSCI評価は「C」（良好）で、SGSによる監査を受けています。
  - title: REACHおよびRoHSコンプライアンス
    standard: EU REACH規則（EC）1907/2006 | RoHS指令2011/65/EU
    description: Aquafarer製品に使用されるすべてのPVCコンパウンド、接着剤、コーティングは、EU REACH化学物質安全規則およびRoHSの有害物質制限に適合しています。各製品ラインについて安全データシート（MSDS）をご用意しています。
    body: REACHコンプライアンスにより、制限対象のSVHC物質が閾値を超えて含まれないことが保証されます。第三者機関による定期的な試験により、各生産バッチの継続的な適合が検証されます。
  - title: ISO 9001:2015 品質マネジメント
    standard: ISO 9001:2015 | TÜV Rheinland認証
    description: "当社の品質マネジメントシステムはTÜV RheinlandによりISO 9001:2015認証を取得しており、設計、生産、試験、アフターサービスを対象としています。年次サーベイランス監査により、継続的改善とプロセス管理が確保されます。"
    body: ISO 9001認証には、文書化された品質方針、内部監査、マネジメントレビュー、是正処置手順、トレーサブルな生産記録が必要です。
testimonial:
  quote: "アジアの複数のサプライヤーから安全装備を調達してきました。Aquafarerは、CE文書、SOLAS証明書、第三者試験レポートを完整的に事前提供してくれた唯一のメーカーです。しかも、こちらから依頼していないのにです。"
  author: Erik Lindström
  title: "安全責任者"
  company: Baltic Marine Supply
  location: "フィンランド"
content_overpressure:
  tagline: "過圧時の安全"
  title: "高温気候における<br />RIBチューブ圧力管理"
  subtitle: "インフレータブルチューブの圧力は気温とともに上昇します。過圧の理解と管理は、損傷を防ぎ、熱帯および砂漠環境での安全な運用を確保します。"
  items:
    - title: Boyle過圧リリーフバルブ
      description: AquafarerのRIBチューブには、定格最大値を超えた過剰圧力を自動的に排出する過圧リリーフバルブが装備されています。日射による加熱で生じる縫合部への応力やチューブ破裂を防止します。
      icon: tabler:gauge
    - title: "朝から正午の圧力変化"
      description: 20°Cで3.5 PSIまで膨張させたチューブは、40°Cの日射下では4.5 PSI以上に達する可能性があります。高温気候では必ず推奨範囲の下限まで膨張させ、過剰圧力はリリーフバルブに任せてください。
      icon: tabler:sun
    - title: "推奨作動圧力"
      description: 'PVCチューブ：作動圧3.0〜3.5 PSI、最大4.5 PSI。Hypalonチューブ：作動圧3.5〜4.0 PSI、最大5.0 PSI。AquafarerのQC基準に従い、必ず定格の1.25倍（PVCは4.4 PSI、Hypalonは5.0 PSI）で試験してください。'
      icon: tabler:chart-bar
    - title: "日射時のベストプラクティス"
      description: "使用しないRIBは日陰に保管してください。長期係留時にはUV保護カバーを使用してください。日射のピーク時間の前後でチューブ圧力を点検・調整してください。最大定格圧力を超えないようにしてください。"
      icon: tabler:umbrella
    - title: "緊急減圧"
      description: "チューブが硬すぎると感じたり、リリーフバルブが排気している場合は、Halkey-Robertsバルブまたは軍用バルブから空気を抜き、圧力を作動範囲に戻してください。正確な測定のために圧力計を携帯してください。"
      icon: tabler:alert-circle
