content_benefits:
  tagline: パートナーシップの特典
  title: 販売代理店が<br /> アクアファーラーを選ぶ理由
  subtitle: 信頼性の高い供給、競争力のあるマージン、専門的なサポートを必要とする船舶販売業者向けに設計されたパートナーシップです。
  items:
    - title: 領土の保護
      description: 資格のある販売代理店に対する独占的または半独占的領域の権利。市場マッピングとチャネル競合管理により、お住まいの地域での Aquafarer ブランド構築への投資を保護します。
      icon: tabler:map-pin
    - title: 競争力のある卸売価格
      description: 年間契約量に基づいた段階的な価格設定。事前価格保証と透明性のあるコスト内訳を備えたマージン保護の価格体系 (FOB 青島ベース)。
      icon: tabler:currency-dollar
    - title: マーケティングサポートキット
      description: プロ仕様の製品写真、仕様書、コンプライアンス文書テンプレート、ソーシャル メディア コンテンツ、および共同ブランドのマーケティング資料。新製品の発売に合わせて毎年更新されます。
      icon: tabler:photo
    - title: 技術研修
      description: 営業チーム向けの製品トレーニング (バーチャルまたはオンサイト)、サービス技術者向けのメンテナンスと修理のトレーニング、顧客対応の FAQ とトラブルシューティング ガイド。
      icon: tabler:school
    - title: スペアパーツとアフターセールス
      description: 専用のスペアパーツを優先的に供給します。交換用のチューブ セクション、バルブ、フィン、修理キットを利用して、迅速な注文対応が可能です。保証請求処理サポート。
      icon: tabler:tool
    - title: コンプライアンス文書
      description: '市場向けの完全なコンプライアンス文書パッケージ: CE DoC、ビルダー プレート データ、オーナー マニュアル、規制登録サポート。コンプライアンスの負担を軽減します。'
      icon: tabler:file-certificate
content_requirements:
  tagline: 私たちが求めているもの
  title: 販売代理店<br />要件
  subtitle: 私たちは、各地域で Aquafarer 製品を専門的に代表し、サポートできるパートナーを求めています。
  items:
    - title: 地域と市場の知識
      description: マリン、ウォータースポーツ、アウトドアレクリエーション市場で確立された存在感。現地の規制、消費者の好み、水上バイク製品の流通チャネルについての理解。
      icon: tabler:target
    - title: 業界経験
      description: マリン、アウトドア、スポーツ用品の販売経験が 2 年以上あること。国際ブランドやB2B卸売事業での確かな実績。
      icon: tabler:briefcase
    - title: ショールームまたは倉庫
      description: 製品の展示、在庫保管、顧客サービスのための物理的な施設。あなたの地域のデモユニットとスペアパーツの在庫を維持する機能。
      icon: tabler:building-store
    - title: ブランド基準へのこだわり
      description: Aquafarer ブランドのプレゼンテーション基準を維持し、当社のサービス プロトコルに従って顧客サポートを提供し、年次の製品トレーニング更新に参加する意欲。
      icon: tabler:star
content_process:
  tagline: 申請プロセス
  title: 4 ステップのディーラー<br />申し込みプロセス
  subtitle: 最初の問い合わせから最初の出荷まで、簡単なオンボーディング プロセスです。
  steps:
    - number: '01'
      title: 最初のお問い合わせと資格認定
      description: 会社の詳細、関心のある地域、現在の製品ライン、および年間の販売量の見積もりを添えて、販売代理店の申請書を提出してください。 5営業日以内に審査させていただきます。
      timeline: 5日間
    - number: '02'
      title: ビジネスレビューと規約
      description: 地域戦略、価格帯、パートナーシップ条件について話し合う仮想会議。市場のコンプライアンス文書要件を確認します。必要に応じてNDAに署名します。
      timeline: 1～2週間
    - number: '03'
      title: サンプルの注文と評価
      description: 市場評価とチームトレーニングのために、ディストリビューター価格で最初のサンプル注文 (2 ～ 5 ユニット) を行ってください。完全なコンプライアンス文書とデモの準備が含まれています。
      timeline: 30～45日
    - number: '04'
      title: パートナーシップの立ち上げとサポート
      description: 領土保護を有効にした最初のコンテナ注文。マーケティング キットが提供され、営業チームがトレーニングを受け、専任のアカウント マネージャーが割り当てられました。継続的な四半期ごとのビジネスレビュー。
      timeline: 進行中
content_application_docs:
  tagline: "申請書類"
  title: "代理店申請に必要な<br />書類"
  subtitle: Aquafarer代理店への申請には、審査チーム向けに以下の書類と情報をご準備ください。
  items:
    - title: "法人登記簿謄本"
      description: "法人名、登記住所、および海洋・スポーツ・アウトドア機器の流通を含む事業範囲を示す有効な会社登記書類。"
      icon: tabler:file-text
    - title: "販売地域カバレッジプラン"
      description: "希望する地理的テリトリー、既存の小売・流通ネットワーク、ターゲット顧客セグメント、および製品カテゴリー別（RIB、SUP、カヤック）の提案年間数量。"
      icon: tabler:map
    - title: "ショールームまたは倉庫の能力"
      description: "製品展示、在庫保管、顧客サービスのための物理的施設。デモエリアと予備部品の保管能力を示す写真または間取り図。"
      icon: tabler:building
    - title: "財務能力証明書"
      description: '初回コンテナ注文の発注と在庫維持の能力を証明する銀行照会先または財務諸表。初回最低注文：20フィートコンテナ1本（10〜20台、混合モデル）。'
      icon: tabler:coin
    - title: "アフターサービス対応力"
      description: "インフレータブルボートの整備・修理に対応する訓練済みまたは訓練可能なサービス技術者。保証請求の処理能力と予備部品在庫の確約。"
      icon: tabler:tool
    - title: "過去のブランド実績"
      description: "現在または過去に流通させた海洋・スポーツ機器ブランドのリスト。紹介者の連絡先は相互合意に基づき提供可能。流通経験のないスタートアップでも、より強固な財務コミットメントにより認定される場合があります。"
      icon: tabler:users
faq:
  title: ディーラープログラム — よくある質問
  questions:
    - q: 販売代理店の最低注文数量はいくらですか?
      a: 販売代理店の MOQ は注文ごとに 10 ～ 20 ユニットから始まり、混合モデル (RIB、インフレータブル、SUP) に柔軟に対応します。市場評価のために、2 ～ 5 ユニットの初回サンプル注文を代理店価格でご利用いただけます。
    - q: 独占的領土権を提供しますか?
      a: 独占的地域権は、年間販売量の約束を満たし、ブランド基準を維持する認定販売代理店に与えられます。新興市場では、準独占的および非独占的な取り決めも利用できます。
    - q: どのようなマーケティングサポートを提供していますか?
      a: 当社は、プロ仕様の製品写真、仕様書、コンプライアンス文書テンプレート、ソーシャル メディア コンテンツ ライブラリ、および共同ブランド資料を含む包括的なマーケティング キットを提供します。新製品の発売に合わせて毎年更新されます。
    - q: 保証請求はどのように処理されますか?
      a: '販売代理店は、保証請求の最初の連絡先として機能します。当社は、明確な保証基準、写真文書化プロトコル、迅速な交換またはクレジット処理を提供します。保証期間: ボートチューブの生地/縫い目/船体は 5 年間に限定されます。 SUP とアクセサリーに関しては 2 年間。'
    - q: Aquafarer 製品を自分のブランドでプライベートラベルにすることはできますか?
      a: はい、OEM/ODM プログラムを通じて可能です。プライベート ラベルのオプションには、カスタム チューブ グラフィックス、コンソールのブランディング、小売パッケージ、ブランド名でのコンプライアンス文書などが含まれます。詳細については、OEM/ODM サービスのページをご覧ください。
    - q: ディストリビュータ向けにどのようなコンプライアンス文書が含まれていますか?
      a: すべての出荷には、モデル固有の CE DoC、ビルダー プレート データ、オーナー マニュアル、出荷書類が含まれています。また、お客様の地域の規制登録サポートも提供し、現地のコンプライアンス要件もサポートします。
