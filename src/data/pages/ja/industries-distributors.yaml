content_segments:
  tagline: "パートナープロフィール"
  title: "パートナータイプ別<br />販売代理店パートナーシップモデル"
  subtitle: "ディストリビューターごとに異なる市場参入の強み ― 地域インフラ、Eコマースリーチ、専門小売、またはマルチブランドポートフォリオ。当社は各パートナープロフィールに合わせてパートナーシップ条件、価格ティア、サポートレベルを構築します。"
  items:
    - title: "地域マリンディストリビューター"
      subtitle: "テリトリー独占のB2B流通"
      description: "倉庫インフラ、販売店ネットワーク、ロジスティクス能力を備え、定義された地域内のマリン販売店、ウォータースポーツ小売店、レンタル事業者にサービスを提供する実績あるディストリビューター。完全な製品ライン、保護された価格、ローカル在庫とサポートで販売店アカウントを対応できる力が必要です。"
      features:
        - "最低限の契約条件による独占的なテリトリー保護"
        - "四半期ごとのボリュームリベート付きの全カタログ卸売価格"
        - "回転の速いSKU向けのローカル在庫委託プログラム"
        - "販売店ネットワークの研修とコブランド・マーケティングプログラム"
    - title: Eコマース・オンライン小売業者
      subtitle: "デジタルファーストの流通チャネル"
      description: Amazon、eBay、または独自のEコマースプラットフォームを通じてウォータースポーツ用品を販売するオンライン小売業者。市場投入スピード、競争力ある価格、消費者への直接配送ロジスティクスが重要です。高速フルフィルメントと在庫リスクゼロで御社ブランドの個別注文をドロップシッピングできるパートナーが必要です。
      features:
        - 'ドロップシッピングプログラム：御社ブランドによる工場直送フルフィルメント'
        - Eコマースプラットフォーム向けのリアルタイム在庫APIフィード
        - EAN/UPC対応のAmazon Seller Central連携
        - "返品ロジスティクスと保証クレーム処理を含む"
    - title: "ウォータースポーツ専門小売店"
      subtitle: "実店舗ショールームパートナー"
      description: "ウォータースポーツ用品を専門とする実店舗 ― 地域のパドラー、アングラー、ボーターに直接販売、デモンストレーション、アフターサービスを提供します。小売最適化パッケージング、デモユニットプログラム、来店顧客を転換するPOS資材が必要です。"
      features:
        - 'デモユニットプログラム：割引価格のショールーム展示ボード'
        - "棚に最適化された箱デザインの小売対応パッケージング"
        - POSディスプレイ・比較チャート・バイヤーズガイド
        - "店舗スタッフ向けの研修および認定プログラム"
    - title: "マルチブランド・百貨店ディストリビューター"
      subtitle: "総合スポーツ用品流通"
      description: "マルチブランドカタログで百貨店、大型量販店、スポーツ用品チェーンにサービスを提供する大規模ディストリビューター。一貫性、コンプライアンス文書、ベンダーコンプライアンスが最重要 ― すべてのSKUが小売業者固有のパッケージング、ラベリング、品質基準を満たす必要があります。"
      features:
        - '小売業者向けコンプライアンス文書：パッケージ仕様、バーコード、ラベリング'
        - "主要小売業者の発注システム向けEDI/ASN連携"
        - "ベンダー管理型在庫と自動補充プログラム"
        - 24時間対応SLA付きの専任アカウントマネジメント
