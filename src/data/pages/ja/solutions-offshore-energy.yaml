content_challenge:
  tagline: 挑戦
  title: 海洋エネルギー需要<br />極限環境の信頼性
  subtitle: 洋上エネルギー運用では、異常気象、遠隔地、継続的な負荷サイクル、故障に対するゼロトレランスなど、機器を限界まで追い込みます。
  paragraphs:
    - "海洋エネルギー産業は、地球上で最も過酷な海洋環境で稼働しています。作業船は石油・ガスプラットフォーム、風力タービン設備、海底ケーブル工事、海洋建設プロジェクトを支えており — しばしば気象条件の猶予が限られる外洋の状況で運用されます。機器の故障はコストの問題だけでなく、危険を意味します。"
    - '**安全が最優先です** — クルー輸送船は、他の作業なら停止するような海況でも安全に運用できなければなりません。乗降時の安定性、あらゆる天候での確実なエンジン性能、海洋構造物への繰り返しの接岸に耐える頑健な構造が必須要件です。'
    - '**全天候型の性能が不可欠です** — 海上風力発電所や石油プラットフォームは年間を通じて稼働しています。作業船は高波、強風、視界不良の中でも性能を発揮しなければなりません。昼夜の運用には、フル航法装備と信頼性の高い照明システムが必要です。'
    - '**洋上風力セクターは急成長しています** — 世界中で何千基もの新しいタービンが設置されており、それぞれに定期的なクルー輸送、工具輸送、保守支援が必要です。これにより、専用設計のクルー輸送船（CTV）と支援 RIB への持続的な需要が生まれています。'
    - Aquafarer の海洋エネルギー用 RIB は、強化ディープV船体、ヘビーデューティ仕様の Hypalon チューブ、フル航法装備、海洋エネルギー運用の過酷な条件のために設計された安全システムを備えています。
content_solution:
  tagline: 私たちのソリューション
  title: エネルギー産業専用のオフショア RIB<br />
  subtitle: すべての Aquafarer オフショア エネルギー RIB は、北海から東南アジアに至る極端な海洋条件でも安全かつ信頼性の高い運用ができるように設計されています。
  list:
    - "荒天での性能と予測可能な操縦性を実現する強化ディープV船体"
    - "長期の洋上勤務に対応する紫外線・耐薬品性を備えたヘビーデューティ Hypalon チューブ"
    - 316 ステンレス鋼製金具 — 継続的な海水暴露でも錆びません
    - 'フル航法装備：GPS、レーダー、VHF、夜間航行灯 — 洋上モデルの標準装備'
    - "打ち波条件下でも安全に運用できるセルフベーリングデッキ"
    - "複数のエンジン構成 — ミッションの冗長性のための単機または双船外機"
    - "プラットフォームやブイの操作に対応するトウポストとヘビーデューティ クレート"
    - "洋上作業現場で識別しやすい高視認性チューブカラー"
content_segments:
  tagline: エネルギープロファイル
  title: 海洋エネルギー ソリューション<br />アプリケーション タイプ別
  subtitle: プラットフォームサポート RIB から風力発電所の CTV、海底検査船に至るまで、海洋エネルギー分野ごとに独自の作業船要件があります。
  items:
    - title: オフショア石油・ガスプラットフォームのサポート
      subtitle: 乗務員の移動、機材の供給、プラットフォームの安全待機
      description: 石油およびガスのプラットフォームでは、毎日の乗組員の交代、機器と供給品の輸送、および安全待機の補償が必要です。作業船は、強い流れや変わりやすい海況の中でプラットフォーム構造物の周囲で安全に航行し、はしごやタラップによる人員移送中に正確な位置維持を維持しなければなりません。炭化水素、化学薬品、絶え間ない塩水噴霧などの極限環境では、耐腐食性の構造と信頼性の高い性能が求められます。
      features:
        - "安全な乗降アクセスと手すりを備えたクルー輸送構成"
        - "耐食性の Hypalon チューブと 316 ステンレス鋼製金具"
        - "プラットフォームフェンダーとの頻繁な接触に対応する強化擦れ止め帯"
        - "油水分や薬品の洗い流しに対応するセルフベーリングデッキ"
        - "洋上の長い航行距離に対応する大容量燃料タンク"
        - "ミッションクリティカルな冗長性のための双エンジンオプション"
    - title: 洋上風力発電所の運営
      subtitle: 乗組員の移動、タービンのメンテナンス、工具の輸送
      description: 洋上風力発電は海洋エネルギー分野で最も急速に成長している分野です。オペレーターには、有義波高 1.5 メートルまでの海域で技術者をタービン アクセス プラットフォームに安全に移送できる乗組員移送船 (CTV) が必要です。移動中の安定性、全天候対応機能、信頼性の高い毎日の操作が重要です。風力発電所のサービス船はタイトなスケジュールで運航されており、ダウンタイムがあるとタービンの試運転やメンテナンスが遅れ、エネルギー生産収益に直接影響します。
      features:
        - "タービン基部での安定したクルー輸送に最適化された船体形状"
        - "洋上の波立ちとうねりの中でも快適な乗り心地を実現するディープVエントリー"
        - "完全な防風・防波保護 — 乗組員の快適さのための密閉型コンソールまたは操舵室"
        - "工具、予備部品、整備機器を搭載できるデッキスペース"
        - "日照時間が限られる冬季の長時間シフトに対応する夜間運用パッケージ"
        - "海洋環境への騒音影響を最小限に抑える静かな船外機運転"
    - title: 海底ケーブルとパイプラインのサポート
      subtitle: 点検、保守、ROVサポート、調査
      description: 海底ケーブルおよびパイプラインのオペレーターは、ルートの検査、メンテナンスのサポート、ROV の操作、調査作業のために作業船を必要としています。これらの船舶には、水中機器の展開と回収のための安定したプラットフォーム、ケーブル追跡のための正確な低速操縦、および沿岸および沖合環境での信頼性の高い操作が必要です。ソナーや測量機器の精度にとって、ボートの安定性は非常に重要です。
      features:
        - "ケーブル追跡調査や測量作業のための低速時安定プラットフォーム"
        - ROV 展開、ケーブルスプール、測量機器に対応するオープンデッキレイアウト
        - "ソナー、GPS、測定機器用の装備マウントプレート"
        - "点検時の海底への影響を最小限に抑える低ウェーク船体設計"
        - "応答性の高い船外機操舵による精密な低速操船"
    - title: 海洋エンジニアリングおよび建設サポート
      subtitle: 人員輸送、資材供給、ダイビングサポート
      description: 港湾建設、海岸保護、海洋設置プロジェクトに取り組む海洋工学請負業者は、建設船と海岸の間の人員輸送、資材と工具の供給、潜水支援、現場調査のために多用途の作業船を必要としています。これらのボートは、複数の船舶、制限された操縦スペース、および変わりやすい海況で建設中の工事区域で運航されます。耐久性と多用途性が最も重要です。
      features:
        - "要員、資材、潜水機器に対応する多目的デッキレイアウト"
        - "潜水支援作業用のダイブラダーと機器マウント"
        - "建設現場での作業に対応するヘビーデューティ クレートとトウポスト"
        - "建設残骸や摩耗に耐える頑強な Hypalon 構造"
        - "柔軟なシート構成 — クルー輸送または貨物モードに切り替え可能"
