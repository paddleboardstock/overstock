content_system:
  tagline: QCシステム概要
  title: 統合品質管理フレームワーク
  subtitle: 当社のQCシステムは生産部門から独立して運用され、直接経営陣に報告します。品質試験室からの署名入り品質承認なしには、どのバッチも出荷されません。
  items:
    - title: 独立品質検査ラボ
      description: 当社の品質ラボは生産とは別の機能として運営されています。QC検査員は生産部長ではなく、品質マネージャーに報告します。この組織の独立性により、品質に関する決定は客観的に行われ、納期が品質要件を上回ることはありません。
      features:
        - 生産部門とは独立して、経営陣に直接報告する
        - 品質の問題で生産を停止する権限がある
        - すべての段階において12名の専任QC検査員
        - すべての試験機器は毎年校正されます
    - title: バッチトレーサビリティ
      description: 当社のERPシステムでは、原材料のすべてのバッチに固有のロット番号が割り当てられます。原材料の到着から生産、完成品に至るまで、各ボートの部品表は元の供給者のバッチに遡ってリンクされます。これにより、品質やコンプライアンスに関する問い合わせに対して完全な上流追跡が可能になります。
      features:
        - 原材料から製品完成までのERPベースのロット追跡
        - 各作業指示書の物理的なバッチタグ
        - 100%の素材カバレッジ — PVC、Hypalon、ハードウェア、接着剤
        - 記録は10年間保持されます（CE 2013/53/EU要件）
    - title: 基準とコンプライアンス
      description: 当社のQC手順は国際基準に沿っています。製品はEUレクリエーショナルクラフト指令2013/53/EUの下でCE認証されています。当社の品質管理システムはISO9001認証を受けています。社会的コンプライアンスはBSCI認証を通じて維持されています。
      features:
        - CE 認証（EU 2013/53/EU）
        - ISO 9001:2015 品質マネジメント
        - BSCI の社会的適合性認証
        - REACHおよびRoHS材料適合
        - ブレグジット後のUKCA認証
content_inspection:
  tagline: 検査段階
  title: 六段階<br />検査プロセス
  subtitle: すべての製品は、記録されたQCチェックポイントを伴う6つの検査段階を通過します。不良は早期に発見され、是正措置は即座に行われ、すべてのバッチは完全に追跡可能です。
  stages:
    - stage: '1'
      title: 受入材料検査
      description: すべての入荷材料は、バッチ／ロット番号ごとに記録され、品質管理（QC）の承認があるまで隔離されます。PVC／Hypalonの布のロールは、引張強度（ASTM D751）、引き裂き強度（ISO 4674）、および厚さをテストされます。Drop-stitchのコア、バルブ、接着剤、およびハードウェアは、目視で検査され、仕様に対して測定されます。
      checks: 引張強さ ASTM D751、引裂強度 ISO 4674、厚さゲージ、接着剤粘度、目視欠陥検査
      threshold: テスト済みのバッチは100%。引張強度が仕様の90%未満、引裂強度が仕様最小値未満、または目視での欠陥がある場合は不合格
    - stage: '2'
      title: 工程内QC — 切断と準備
      description: CNC切断パネルは、20枚ごとにCAD元データと寸法の確認を行います。端部の品質は、ほつれ、不均一な切断、寸法のずれがないか検査します。各生産バッチごとに、材料を溶接に移す前にパネルの数量がBOMと照合されます。
      checks: CAD DXFファイルに対する寸法チェック、エッジの品質検査、パネル数の確認
      threshold: 公差 ±0.5mm。公差外が2％を超える場合はバッチを廃棄する
    - stage: '3'
      title: 工程内QC — 溶接と接着
      description: 生産中、溶接の品質は継続的に監視されます。サンプルは50ユニットごとにピールテスト（ASTM D751）が実施されます。溶接幅は仕様に対して測定されます。ホットエア温度の記録は一貫性のために確認されます。すべての継ぎ目は、背面光でチャネリングや空隙がないか目視で検査されます。
      checks: 50ユニットごとのASTM D751ピールテスト、溶接幅の測定、熱風温度ログの確認、バックライト継ぎ目の検査
      threshold: 剥離強さ最低8 N/cm。溶接幅許容差±1mm。目に見えるチャンネルがある場合は不良とする
    - stage: '4'
      title: 組立検査
      description: 各ユニットは、チームリーダーが承認した100点満点の組み立てチェックリストに従います。バルブの機能は、10回の開閉サイクルを通じてテストされます。ハードウェアのトルクは確認されます。視覚的検査では、表面仕上げ、色の一貫性、ラベルの配置、付属品の完全性が確認されます。
      checks: ユニットごとの100項目チェックリスト、バルブ機能テスト、ハードウェアトルク確認、目視検査
      threshold: 安全に関わる重要部品（バルブ、Dリング、ハンドル）に関するゼロ欠陥方針。軽微な外観：AQL 2.5（ISO 2859）
    - stage: '5'
      title: 圧力試験
      description: すべてのチャンバーは公称圧力の1.25倍に膨張させ、24～48時間保持します。保持期間中、圧力センサーは連続的にデータを記録します。温度補正済みの読み取りにより精度が保証されます。圧力が5％以上低下したチャンバーは不合格とされ、シームの再検査を行い、製造バッチ全体を100％再試験します。
      checks: 24～48時間の加圧保持ログ、センサー校正は毎日確認、温度補償済みの読み取り、修理後の継ぎ目再テスト
      threshold: 安定した温度で24時間にわたり最大5％の圧力低下。これを超える場合は、バッチ全体の100％再テスト
    - stage: '6'
      title: 最終検査および出荷承認
      description: 梱包前の最終的な外観および機能検査。表面の欠陥、色の一貫性、ラベル／BINの確認、梱包の完全性、付属品の完備状況が顧客注文と照合されます。製品は真空包装され、箱詰めされ、パレット化されます。製品が工場を出る前に、最終QCの承認が必要です。
      checks: 完全な目視検査、SKUごとの付属品チェックリスト、梱包落下試験（1mランダムサンプル）、ラベル/バーコードスキャン確認
      threshold: 主要欠陥のAQLは2.5、軽微な欠陥はAQL 4.0。安全上の欠陥はゼロ許容。全てのユニットは目視検査済み
content_equipment:
  tagline: 試験装置
  title: QCラボ<br />機器
  subtitle: 当社の品質ラボには、材料の確認、溶接の完全性、および製品の性能検証のための専門的な試験装置が備わっています。
  columns: 3
  items:
    - title: 引張試験機
      description: ASTM D751 に従って生地の引張強さと伸びを測定します。すべての PVC、Hypalon、および drop-stitch の生地バッチの入荷QCに使用されます。
      icon: tabler:scale
    - title: 温度チャンバー
      description: UV耐性試験（ASTM G154）および低温柔軟性試験のための環境チャンバー。極端な作動条件をシミュレートします。
      icon: tabler:temperature
    - title: 圧力センサーとロガー
      description: 24～48時間の空気保持試験用の連続データ記録対応デジタル圧力センサー。精度のために温度補償済み。
      icon: tabler:wind
    - title: 剥離試験装置
      description: 溶接継ぎ目の強度確認用の校正済みピール試験装置。すべての生産バッチからランダムサンプルを抽出。
      icon: tabler:files
    - title: 漏れ検知タンク
      description: 膨張チャンバーの水没漏れ試験用の水槽。シームおよびバルブの完全性確認のための目視バブル検出。
      icon: tabler:ripple
    - title: 検査ツール
      description: 校正済みの測定ツール — 厚さゲージ、トルクレンチ、寸法キャリパー、生産QCステーション用の硬度テスター。
      icon: tabler:tools
content_metrics:
  tagline: QCのパフォーマンス
  title: 品質管理指標
  subtitle: 私たちの生産ラインからの実際の合格/不合格データです。これらの指標は毎日監視され、経営陣によって毎月レビューされます。
  columns: 3
  items:
    - title: 100％ユニットテスト済み
      description: すべてのボートのすべてのチャンバーは、出荷前に耐圧試験が行われます。サンプリングは行わず、耐圧性について100％検査します。
      icon: tabler:check
    - title: <5％圧力降下
      description: 1.25倍の定格圧力で24～48時間の最大許容圧力損失。この閾値を超えるチャンバーはバッチ再試験を引き起こします。
      icon: tabler:gauge
    - title: AQL 2.5
      description: 主要な欠陥に対する許容品質レベルはISO 2859サンプリング標準に従います。安全上重要な欠陥にはゼロ許容です。
      icon: tabler:clipboard-check
    - title: 24～48時間の拘留
      description: 圧力保持時間は製品カテゴリによって異なります。RIBチャンバー：48時間。SUPおよびインフレータブルボート：24〜48時間。
      icon: tabler:clock
    - title: 1.25× 試験圧力
      description: すべてのチャンバーの安全マージン — 最大運転条件を上回るマージンを確保するため、定格圧力の25％高でテスト済み。
      icon: tabler:arrow-up
    - title: 安全欠陥 0%
      description: 安全上重要な欠陥に対するゼロトレランスポリシー — バルブ、Dリング、継ぎ目、浮力室。欠陥がある場合は100％再検査。
      icon: tabler:shield
