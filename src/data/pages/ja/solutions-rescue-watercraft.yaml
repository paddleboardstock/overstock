content_challenge:
  tagline: 挑戦
  title: '救助活動が求める<br />妥協なき信頼性'
  subtitle: '捜索救助組織は極めて重い安全責任の下で活動しています — ボートの故障は、許容できない結果をもたらします。'
  paragraphs:
    - '救助活動において、成功と失敗の差は分単位で測られます。ボートは直ちに出動でき、荒れた条件下で運用でき、乗員を乗せて安全に帰還できなければなりません。安全責任は絶対です — 救助ミッション中の機械的故障は修理費用の問題ではなく、失われる一条の命なのです。'
    - 'SAR ボートには、被災者に迅速に到達するための高速性と、安全な救出活動のための卓越した安定性の両方が求められます。限られたデッキスペースの中で、救助器材、医療品資材、通信機器を積載しなければなりません。政府業務で運用されるボートには、公共調達予算を正当化する長い耐用年数（10～15 年以上）も必要です。'
    - '操縦者にとっての視界と、捜索における視認性の両方が極めて重要です。コンソールデザインは 360 度の視界を確保し、ボート自体も航空機や他の船舶から高い視認性を持つ必要があります。'
    - 'Aquafarer の救助 RIB は、キールからこれらの要件のために設計されています — セルフベーリングデッキ、強化船体、航海計器一式を標準装備し、パトロールモデルにはトウポストが標準装備されています。'
content_solution:
  tagline: 私たちのソリューション
  title: '専用設計の救助 RIB'
  subtitle: 'すべての Aquafarer 救助艇は、SOLAS および各国の SAR 規格を満たす、または上回るように設計されています。'
  list:
    - 'セルフベーリングデッキ — 救出活動中の安定性のため、水が自動的に排出されます'
    - '強化された深 V 船体 — 荒天時の航行能力と高速時の予測可能な操縦性'
    - '航海灯フルセット — あらゆる天候条件下で昼夜の運用が可能'
    - 'トウポストと曳航ロープ — 船舶曳航やレスキュースレッド運用に即応'
    - '器材取付けプレート — 無線機、捜索灯、サイレン、医療器材'
    - '複数のエンジン構成 — 単発船外機または双発の冗長性'
    - '高視認性チューブカラー — 最大の視認性のためにオレンジ、イエロー、またはレッド'
content_segments:
  tagline: 救助プロファイル
  title: '組織種別ごとの<br />捜索・救助ウォータークラフトソリューション'
  subtitle: '救助組織はそれぞれ異なる権限、予算サイクル、運用環境の下で活動しています — 沿岸のボランティア隊から国家規模の沿岸警備隊フリートまで。すべての救助 RIB をミッションプロファイルに合わせて構成します。'
  items:
    - title: 沿岸警備隊・政府 SAR 機関
      subtitle: '絶対的な安全責任 — ミッションクリティカルなフリート基準'
      description: '政府 SAR 機関は、海上活動において最も重い安全責任を負っています。すべてのボートは過酷な条件下で完璧に作動しなければなりません — 救助ミッション中の器材故障は許されません。調達の決定は、初期価格ではなく 10～15 年の耐用年数にわたる総所有コストによって左右されます。機関には、何年もの沿岸パトロールに耐え、厳格な国家規格を満たし、分散した基地全体で一貫した性能を発揮する船舶が必要です。包括的なコンプライアンス文書と複数年のサービス契約が必須となります。'
      features:
        - 'SOLAS および各国 SAR 規格準拠のドキュメントパッケージ'
        - 'フリート全体での部品共通化 — 基地レベルの在庫の複雑さを軽減'
        - 'ミッションクリティカルな冗長性のための双発エンジン構成'
        - '計画保全プログラム付きの 10～15 年耐用年数設計'
        - '全天候型の能力 — 荒れた海況に対応する強化深 V 船体'
    - title: ライフガード・ビーチ救助サービス
      subtitle: 迅速出動、浅瀬での運用
      description: 'サーフゾーンを通って出動し、浅い沿岸水域で運用し、数分以内に泳者や遭難艇に到達できる迅速対応船舶を必要とする、自治体や海浜のライフガードサービス。器材は、小型車両によるビーチ曳航や人力移動ができる程度に軽量でなければなりません。'
      features:
        - 'サーフゾーン・沿岸運用のための浅喫水 RIB 船体'
        - 'バウ持ち上げハンドルとキールガード付きでビーチからの進水が可能'
        - '統合型レスキュースレッドまたは救助泳者プラットフォーム'
        - '高視認性のオレンジまたはイエローのチューブカラーを標準装備'
    - title: 消防救助部門
      subtitle: '消防ポンプの統合、器材取付け、迅速対応'
      description: '消防救助の海上部隊は、臨海部の建物火災、船舶火災、水上救助事案に対応します。これらのボートには、消防ポンプ、モニター、ホース格納庫、呼吸器を搭載しなければならず — それらすべてが安定した迅速対応プラットフォームに統合されている必要があります。各部門はこれらの船舶を洪水対応や相互援助活動にも使用します。コンソールレイアウトは、乗員の移動スペースを犠牲にすることなく、ポンプ制御、無線システム、緊急照明を収めなければなりません。'
      features:
        - 'ポンプ統合パッケージ付きのバウ搭載消防モニター'
        - '消防ポンプ、ホース格納、空気呼吸器セット専用の器材取付け'
        - 'ポンプ制御、無線、緊急照明に対応可能なコンソールレイアウト'
        - '消火水の排出と安定性のためのセルフベーリングデッキ'
        - '夜間運用パッケージ：捜索灯、現場照明、ブルー/レッドライトバー'
    - title: 海上警察・港湾保安
      subtitle: '取り締まり、パトロール、臨検活動'
      description: '海上の法執行部隊には、高速追跡、容疑船舶への臨検、港湾保安パトロールができる船舶が必要です。これらのボートには、執行器材や武器の格納庫、陸上指令との通信統合、臨検チームの活動に十分なデッキスペースが求められます。取り締まりミッションには、夜間運用能力と低視認性アプローチが不可欠です。'
      features:
        - '高速追跡能力 — 40 ノット以上の最高速度を持つ滑走船体'
        - '安全な武器ロッカーと執行器材格納コンパートメント'
        - '警察無線、MDT、通信システムのためのコンソール統合'
        - '夜間運用パッケージ：IR スポットライト、FLIR マウント、隠密照明'
        - '滑り止め表面付きの強化臨検プラットフォーム'
        - 'ブルー/レッド緊急照明とサイレンシステム'
    - title: ボランティア SAR・非営利組織
      subtitle: 助成金による、コミュニティベースの沿岸・湖沼活動
      description: 'コミュニティベースの救助団体は、政府の SAR カバーが限られる湖、河川、沿岸域で活動しています。寄付や政府助成金で運営されることが多いこれらの組織には、1 ドルあたりの最大の能力 — ボランティアが最小限の専用訓練で安全に運用できる、信頼性が高く低メンテナンスの船舶が必要です。助成金の調達サイクルにより、ボートは固定予算内でコンプライアンス要件を満たさなければなりません。'
      features:
        - '取得コストと運用コストの低減に最適化された単発船外機構成'
        - '低メンテナンスと現場での修理が容易な PVC 構造'
        - 'ボランティア操縦者のための電子機器の複雑さを最小限に抑える多機能コンソール'
        - '資金申請のための助成金コンプライアンスドキュメントパッケージ'
        - '専用トレーラーやクレーンなしでビーチ進水できる軽量設計'
    - title: 洪水救助・災害対応
      subtitle: '内水氾濫、浅瀬、漂流物の多い環境'
      description: '洪水救助は独特の運用プロファイルです — ボートは冠水した市街地、漂流物だらけの水流、水没障害物が見えない極浅い水域で運用されます。操縦者には、冠水した街路を航行し、漂流物をかわして進み、建物や車両から被災者を救出できる船舶が必要です。浅喫水能力が極めて重要であり、障害物に引っかかる危険がある水流の中での運用能力も同様です。これらのボートは、消防部門、民間防衛組織、災害救援 NGO によって配備されることが多いのです。'
      features:
        - '超浅喫水船体 — 水深 30～50 cm での運用が可能'
        - '漂流物をかわすバウと、水没障害物に対応する強化チューブ保護'
        - '洪水の排水と被災者収容のためのセルフベーリングデッキ'
        - '空中偵察からの視認性のための高視認性オレンジまたはイエローチューブ'
        - 'ヘリコプター輸送と陸送配置に対応する軽量設計'
        - '巻き上げおよびロープ救助活動用の強化リフティングポイント'

