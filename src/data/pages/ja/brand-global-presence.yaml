hero:
  tagline: 世界的な存在感
  title: 'すべての大陸にまたがる<br />50 カ国以上への納入'
  subtitle: 'ヨーロッパの沿岸パトロール事業者から、オーストラリアのウォータースポーツディーラー、中東の救助チームまで — Aquafarer のボートは世界中の水上で活躍しています。'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer のグローバルな海洋製造・流通
stats:
  title: グローバルなリーチ
  stats:
    - title: 国
      amount: '50+'
    - title: 輸出市場
      amount: ヨーロッパ、南北アメリカ、アジア、中東、オセアニア
    - title: 生産拠点
      amount: 中国・青島
    - title: 米国倉庫
      amount: カリフォルニア州モントクレア
features3_markets:
  tagline: 主要市場
  title: '地域の要件に応える<br />地域ごとの専門性'
  subtitle: '市場ごとに規制要件、嗜好、使用例が異なることを理解しています。'
  isBeforeContent: false
  columns: 4
  items:
    - title: ヨーロッパ・英国
      description: 'EN ISO 6185 規格を満たす CE 認証製品。EU 市場全体で RIB、インフレータブルボート、SUP ボードへの需要が堅調です。英国のディーラーは当社の迅速な納品を高く評価しています。'
      icon: tabler:map-pin
    - title: 北アメリカ
      description: 'US 沿岸警備隊認可の製造。カリフォルニア州モントクレアの米国倉庫から西海岸へ迅速に納品。フィッシングボート、救助艇、レジャー SUP への需要が拡大しています。'
      icon: tabler:map-pin
    - title: オーストラリア・オセアニア
      description: 'RIB ボートとインフレータブルテンダーの強い市場。オーストラリアのディーラーは、過酷な日差しに対するハイパロンボートの耐 UV 性を高く評価しています。アジアの施設から迅速に出荷します。'
      icon: tabler:map-pin
    - title: 中東
      description: 'パトロール艇・救助艇への需要が拡大。当社のアルミ船体 RIB は沿岸警備隊や保安事業者に人気があります。高温環境向けのカスタム構成に対応します。'
      icon: tabler:map-pin
features3_distribution:
  tagline: 流通ネットワーク
  title: '世界中のディーラーとの<br />パートナーシップ'
  subtitle: '実績のある海洋機器ディーラー、OEM ブランド、政府調達機関と連携しています。'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM パートナーシップ
      description: 'グローバルウォータースポーツブランドのためのプライベートブランド製造。設計から生産、直送まですべて対応します。'
      icon: tabler:building
    - title: ディーラーネットワーク
      description: '20 カ国以上の正規ディーラーが在庫を保有し、ローカルサポートを提供します。新しいディーラーのお問い合わせを歓迎します。'
      icon: tabler:users
    - title: 政府・公共機関
      description: '沿岸警備隊、捜索救助組織、軍の調達プログラムへの直接供給。公共調達要件への準拠。'
      icon: tabler:building-community
steps2_logistics:
  title: 'グローバル物流・サポート'
  subtitle: '工場から最終目的地まで — サプライチェーン全体を管理します。'
  items:
    - title: 配送オプション
      description: '海上輸送（FOB 青島）、緊急注文のための航空輸送、サンプル・スペアパーツのための国際宅配便。'
      icon: tabler:truck-delivery
    - title: 米国倉庫
      description: '北アメリカ全体への迅速な納品のため、カリフォルニア州モントクレアに在庫を保有。西海岸：2～3 日、中部：3～4 日、東海岸：4～5 日。'
      icon: tabler:building-warehouse
    - title: スペアパーツ
      description: 'Aquafarer 純正スペアパーツと消耗品を通年在庫。一般的な部品は 24 時間以内に出荷します。'
      icon: tabler:package
    - title: 技術サポート
      description: '技術的な質問、修理のアドバイス、改装サポートのためのエンジニアリングチームへの直通窓口。20 年前に造ったボートもサポートします。'
      icon: tabler:headset
cta:
  title: 'ディーラーになりたいですか？'
  subtitle: '流通ネットワークを積極的に拡大しています。輸出チームにご連絡いただき、パートナーシップの可能性についてご相談ください。'
  actions:
    - variant: primary
      text: パートナーシップのお問い合わせ
      href: /contact
    - text: 製品ラインナップを表示する
      href: /products
