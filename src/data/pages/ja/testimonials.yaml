testimonials:
  - category: クラブ
    name: リカルド・サントス
    title: アルガルベ サーフ アカデミー オーナー
    location: ラゴス、ポルトガル
    content: 私たちはサーフィンスクールのクラブスターターパッケージから始めました。ボード、パドル、ベスト 20 枚 - すべてが 3 週間以内に到着しました。 2 シーズン後、プロ パッケージにアップグレードしました。当社のロゴを使用したカスタムブランディングは、当社のプロフェッショナルなイメージを一変させました。
    rating: 5
    product: クラブスターターパッケージ
    source: solutions/clubs
  - category: クラブ
    name: クラブオーナー
    title: ウォータースポーツクラブ
    location: プーケット、タイ
    content: Club Starter Package は完璧なエントリーポイントでした。当社のビジネスが成長するにつれて、Aquafarer も当社とともに成長しました。同じ品質、同じ価格で、驚くべきことではありません。 18 か月でボードの数を 10 から 80 に拡張しました。
    rating: 5
    product: クラブスターター + プレミアムパッケージ
    source: success-stories
  - category: リゾート
    name: リゾート総支配人
    title: 5つ星のビーチリゾート
    location: ギリシャ
    content: Aquafarer はボードを提供するだけでなく、完全なゲスト エクスペリエンスの構築を支援してくれました。私たちのウォーター スポーツ プログラムは、ゼロから 1 シーズンでリゾートのハイライトにまで成長しました。毎週 300 件以上の予約があり、年間収益は 18 万ドルです。
    rating: 5
    product: リゾートプレミアムパッケージ
    source: success-stories
  - category: リゾート
    name: ソフィー・ローラン
    title: アズール ベイ リゾーツ、ゲスト エクスペリエンス ディレクター
    location: プーケット、タイ
    content: アクアファーラーは、3 つのリゾート施設にわたるビーチ アクティビティ プログラム全体を設計し、備え付けました。 80 台の SUP、40 台のカヤック、安全インフラ、スタッフのトレーニングをすべて 1 回の発送で配送します。最初のシーズンではゲストの参加が 60% 増加しました。
    rating: 5
    product: リゾートプレミアムパッケージ
    source: solutions/resorts
  - category: 起業家
    name: マイケル・パーク
    title: ショアライン・パドル社創設者
    location: 米国カリフォルニア州
    content: 私は業界経験ゼロでSUPブランドを立ち上げました。 Aquafarer のチームは、製品の選択からカスタムのロゴデザインとパッケージングまで私を指導してくれました。最初のコンテナは 11 週間で到着しましたが、Amazon では 3 か月で完売しました。
    rating: 5
    product: スターターブランドの立ち上げ
    source: solutions/entrepreneurs
  - category: 起業家
    name: 創設者
    title: オーストラリアのSUPブランド
    location: オーストラリア
    content: ブランドのアイデアはありましたが、製造の知識はゼロでした。 Aquafarer は、適切な基板設計の選択から最初の出荷品の開梱に至るまで、文字通りプロセス全体を通して私の手を握ってくれました。夢から出産まで90日。
    rating: 5
    product: ブランド立ち上げパッケージ
    source: success-stories
  - category: レンタル
    name: ダニエル・オコンクォ
    title: レイクランド SUP レンタルのオーナー
    location: オンタリオ州、カナダ
    content: 私は地元のショップからボードを 5 枚レンタルしていましたが、収益の 60% がショップに失われていました。 Aquafarer は、15 台の SUP を自分で構築するのに役立ちました。 ROI 計算ツールでは 4 か月で損益分岐点になることが示されましたが、3 か月かかりました。現在、ボードを 30 枚まで拡張しています。
    rating: 5
    product: フリート スターター キット
    source: solutions/rental-business
  - category: レンタル
    name: マルコ・ヴァレンティ
    title: アドリアティック アドベンチャー ツアーズ、オペレーション ディレクター
    location: ドブロブニク、クロアチア
    content: 当社は、3 か所にわたる 12 隻のレンタル船団全体に Aquafarer RIB を装備しました。 2シーズン経ち、失敗はゼロ。 CE 認証文書により、保険の承認がシームレスになりました。彼らのエンジニアリングチームはチューブの色もカスタマイズしました。
    rating: 5
    product: フリート拡張キット
    source: trust
  - category: レンタル
    name: アンドレス・レイエス中佐
    title: 海上調達担当官、フィリピン沿岸警備隊補佐官
    location: マニラ、フィリピン
    content: 当社は沿岸パトロール隊全体で 24 台の Aquafarer RIB を運用しています。同社の QC プロセスはすべてのバッチにわたって一貫しており、毎回同じシーム品質、同じバルブ配置、同じ圧力定格を実現しています。命が機器に依存する場合、再現性が重要になります。
    rating: 5
    product: RIBパトロール艦隊
    source: trust
  - category: 消費者
    name: サラ・K
    title: 初めてSUPオーナーになる方へ
    location: タホ湖、米国
    content: 全くの初心者でも安定して使えます。初日に湖に持ち出しましたが、落ちることはありませんでした。ポンプとパドルが付属した完全なパッケージなので、箱を開けてから 20 分後には水上にいることができました。
    rating: 5
    product: SUP エクスプローラー 11
  - category: 消費者
    name: ジェームズ・ソーントン
    title: SUP エクスプローラー 11 オーナー
    location: カナダ、バンクーバー
    content: 初めて購入するので、海外からの注文で品質に不安がありました。私が尋ねる前に彼らが共有してくれた ISO ドキュメントとサードパーティのテストレポートは、私に完全な自信を与えてくれました。ボードは 6 日で到着し、期待を上回りました。
    rating: 5
    product: SUP エクスプローラー 11
    source: trust
  - category: 消費者
    name: マイク R.
    title: レクリエーションカヤッカー
    location: 米国フロリダ州
    content: しっかりしたビルド品質。インフレータブルから予想していたよりもはるかに優れた海岸チョップを処理します。週末の旅行のために車のトランクに詰めて、スロープで 4 分以内に空気を入れました。
    rating: 5
    product: インフレータブルカヤック
