hero:
  tagline: 業界ソリューションのマトリックス
  title: シナリオベースの海洋ソリューション<br />プロフェッショナル業務向け
  subtitle: 救助、レンタル船団、ヨット入札、商業漁業用途向けに構成された、目的に合わせて設計されたインフレータブル水上バイクと RIB で、それぞれ技術仕様とカスタマイズ オプションがサポートされています。
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer の多様な業界向けのプロフェッショナルな海洋ソリューション
direct_answer: アクアファーラーは、商業海洋事業向けにシナリオ設計されたインフレータブルウォータークラフトとRIBソリューションを提供しています。強化されたハイパロンチューブとマルチチャンバーの安全性を備えた救助ボートとパトロールボート、1.2mmのPVCと熱風溶接の縫い目を備えたメンテナンスの手間がかからない耐久性を備えたレンタルフリートSUPとカヤック、ディープVアルミニウム船体RIBを備えた高級ヨットテンダー、ロッドホルダーとライブウェルシステムを備えた頑丈な釣り構成などです。
solution_a:
  tagline: 解決策A
  title: 海洋救助と<br />商業パトロール
  subtitle: 専門的な緊急対応および法執行業務向けの高速マルチチャンバー安全 RIB。
  badge: Heavy-Duty Series
  description: '当社の海洋救助・パトロールRIBは、多室独立浮力設計を特徴とする強化高密度Hypalon/PVCエアチューブで構成されています。 各船舶にはプロ仕様の反射テープ、突撃用グラブライン、展開準備のための急速膨張バルブが装備されています。 Deep-Vグラスファイバー船体は、高速時や荒れた海上状況でも優れた安定性を提供します。'
  features:
    - title: マルチチャンバーの安全性
      description: 4 ～ 6 個の独立した空気室 - 単一の空気室に穴が開いても、確実な浮力が維持されます。
    - title: 強化チューブ生地
      description: 1.2 mm Hypalon CSM または 1,680 DTEX PVC、二層熱風溶接シーム付き
    - title: プロフェッショナルグレード
      description: SOLAS 反射テープ、レスキューグラブライン、牽引クリート、クイックリリースペインターライン
    - title: 高速船体
      description: Deep-V グラスファイバーまたはアルミニウムの船体、構成に応じて 25 ～ 45 ノットの定格
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: 船体材質
      value: グラスファイバー / 船舶用アルミニウム
    - label: チューブファブリック
      value: 1.2 mm ハイパロン CSM / 1,680 DTEX PVC
    - label: 最高速度
      value: 25～45ノット
    - label: 容量
      value: 6～12名様
    - label: エンジン範囲
      value: 40 ～ 200 馬力
    - label: 認証
      value: CE/ISO 9001
solution_b:
  tagline: ソリューション B
  title: ウォータースポーツのレンタルと<br />リゾートの備品
  subtitle: 超耐久性があり、メンテナンスの手間がかからないインフレータブル SUP、カヤック、ボートは、リゾート、クラブ、ツアー運営での毎日のレンタル用に作られています。
  badge: Rental-Grade
  description: 当社のレンタル車両機器は、最高の耐久性と最低のメンテナンスコストを実現するように設計されています。紫外線による劣化や頻繁な衝突による損傷に耐える三層熱風溶着シーム技術を備えた 1.2 mm 強化 PVC を使用しています。ドロップステッチ構造により、数百回のレンタルサイクル後でもボードの剛性が維持されます。すべてのモデルには、強化された D リング、耐摩耗性レール バンド、商用グレードのバルブが装備されています。
  features:
    - title: 商用グレードのPVC
      description: UV 安定剤を備えた 1.2 mm 強化 PVC — 消費者グレードの素材より 3 倍の厚さ
    - title: 熱風溶接された継ぎ目
      description: 三層融着 - 接着よりも強く、剥離しにくい
    - title: ドロップステッチの剛性
      description: 1,680 DTEX コア、2 スレッド/平方インチ - 定格 20 PSI でハードボードのような剛性を実現
    - title: フリート対応設計
      description: 強化された D リング、市販の Halkey-Roberts バルブ、耐摩耗性レール バンド
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: チューブ材質
      value: 1.0～1.2mm強化PVC
    - label: "シーム技術"
      value: 三層熱風溶着
    - label: 最大圧力
      value: 15 ～ 20 PSI (ドロップステッチモデル)
    - label: 耐紫外線性
      value: 1,000 時間以上の加速テスト
    - label: 保証
      value: モデルに応じて 2 ～ 5 年
    - label: メンテナンス
      value: 最小限 — 洗い流して保管する
solution_c:
  tagline: ソリューション C
  title: ヨット入札と<br />豪華水上バイク
  subtitle: 軽量で高性能の RIB テンダーは、スーパーヨットの保管とゲストの輸送用に設計されており、高級感のあるフィット感と仕上げが施されています。
  badge: Premium Series
  description: 当社のヨットテンダー RIB は、軽量構造と豪華な美しさを兼ね備えています。 Deep-V アルミニウムまたはグラスファイバーの船体は、優れた乗り心地と簡単なダビット持ち上げを提供します。カラーマッチしたチューブグラフィックス、プレミアムな室内装飾、カスタムコンソールレイアウトが利用可能です。コンパクトな収納寸法により、スーパーヨットのガレージやデッキの保管に最適です。
  features:
    - title: 軽量構造
      description: 船舶グレードのアルミニウム船体により、グラスファイバーと比較して重量が 30% 削減され、持ち上げが簡単になります。
    - title: Deep-V パフォーマンス
      description: 18 ～ 22 度のデッドライズ ハルにより、チョップ時のスムーズな乗り心地と優れた追従性を実現
    - title: 贅沢なフィット感と仕上げ
      description: カスタム張り地、同色のチューブ、プレミアムヘルムコンソール、ステンレスパッケージ
    - title: コンパクトに収納
      description: スーパーヨットのガレージ用に設計 - コンパクトに収納できる収縮可能なチューブ
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: 船体の種類
      value: Deep-V アルミニウム / グラスファイバー
    - label: デッドライズ
      value: 18～22度
    - label: 最高速度
      value: 30～40ノット
    - label: 乾燥重量
      value: 120 ～ 350 kg (アルミニウム船体)
    - label: ダビットリフト対応
      value: はい - リフティングポイント標準
    - label: ストレージ
      value: 収縮可能なチューブ、積み重ね可能
