content_compliance:
  tagline: Quality & Testing
  title: Tested Quality,<br />Documented
  subtitle: Every quality claim is backed by real numbers from our production line — pressure tests, batch records, and measured defect rates.
  items:
    - title: 100% Pressure-Tested
      description: Every board is inflated to 1.25x rated PSI and held before it ships. If a seam, valve, or drop-stitch thread fails, the board never leaves the factory.
      icon: tabler:shield-check
    - title: 99.3% Defect-Free Rate
      description: Measured across every production batch. The number comes from our own final-inspection records — not marketing.
      icon: tabler:gauge
    - title: Batch Traceability
      description: Every board carries a production batch code, so warranty claims and quality checks trace back to exact materials and runs.
      icon: tabler:clipboard-check
    - title: 2-Year SUP Warranty
      description: Every SUP board and accessory covered for 2 years — drop-stitch seams, inflation valves, and accessories included. Claims resolved fast.
      icon: tabler:lifebuoy
