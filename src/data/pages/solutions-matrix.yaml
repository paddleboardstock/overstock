hero:
  tagline: Industry Solutions Matrix
  title: 'Scenario-Based Marine Solutions<br />For Professional Operations'
  subtitle: 'Purpose-engineered inflatable watercraft and RIBs configured for rescue, rental fleet, yacht tender, and commercial fishing applications — each backed by technical specifications and customization options.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer professional marine solutions for diverse industries

direct_answer: 'Aquafarer delivers scenario-engineered inflatable watercraft and RIB solutions for commercial marine operations: rescue and patrol boats with reinforced Hypalon tubes and multi-chamber safety, rental fleet SUPs and kayaks with 1.2 mm PVC and hot-air welded seams for low-maintenance durability, luxury yacht tenders with deep-V aluminum hull RIBs, and heavy-duty fishing configurations with rod holders and livewell systems.'

solution_a:
  tagline: Solution A
  title: 'Marine Rescue &<br />Commercial Patrol'
  subtitle: 'High-speed, multi-chamber safety RIBs for professional emergency response and law enforcement operations.'
  badge: Heavy-Duty Series
  description: Our marine rescue and patrol RIBs are constructed with reinforced high-density Hypalon/PVC air tubes featuring multi-chamber independent flotation design. Each vessel is equipped with professional-grade reflective tape, rescue grab lines, and rapid-inflate valves for deployment readiness. Deep-V fiberglass hulls provide exceptional stability at high speeds and in rough sea conditions.
  features:
    - title: Multi-Chamber Safety
      description: 4–6 independent air chambers — any single chamber puncture maintains positive flotation
    - title: Reinforced Tube Fabric
      description: 1.2 mm Hypalon CSM or 1,680 DTEX PVC with double-layer hot-air welded seams
    - title: Professional Grade
      description: SOLAS reflective tape, rescue grab lines, towing cleats, quick-release painter line
    - title: High-Speed Hull
      description: Deep-V fiberglass or aluminum hull rated for 25–45 knots depending on configuration
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Hull Material
      value: Fiberglass / Marine-grade Aluminum
    - label: Tube Fabric
      value: 1.2 mm Hypalon CSM / 1,680 DTEX PVC
    - label: Max Speed
      value: 25–45 knots
    - label: Capacity
      value: 6–12 persons
    - label: Engine Range
      value: 40–200 HP
    - label: Certification
      value: CE / ISO 9001

solution_b:
  tagline: Solution B
  title: 'Water Sports Rental &<br />Resort Fleet Equipment'
  subtitle: 'Ultra-durable, low-maintenance inflatable SUPs, kayaks, and boats built for daily rental use in resorts, clubs, and tour operations.'
  badge: Rental-Grade
  description: Our rental fleet equipment is engineered for the highest durability and lowest maintenance cost. We use 1.2 mm reinforced PVC with triple-layer hot-air welded seam technology that resists UV degradation and frequent collision damage. Drop-stitch construction ensures boards maintain rigidity even after hundreds of rental cycles. All models feature reinforced D-rings, abrasion-resistant rail bands, and commercial-grade valves.
  features:
    - title: Commercial-Grade PVC
      description: 1.2 mm reinforced PVC with UV stabilizers — 3x thicker than consumer-grade materials
    - title: Hot-Air Welded Seams
      description: Triple-layer fusion welding — stronger than adhesive bonding, resists delamination
    - title: Drop-Stitch Rigidity
      description: 1,680 DTEX core with 2 threads/sq in — rated to 20 PSI for hardboard-like stiffness
    - title: Fleet-Ready Design
      description: Reinforced D-rings, commercial Halkey-Roberts valves, abrasion-resistant rail bands
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Tube Material
      value: 1.0–1.2 mm Reinforced PVC
    - label: Seam Technology
      value: Triple-layer hot-air welding
    - label: Max Pressure
      value: 15–20 PSI (drop-stitch models)
    - label: UV Resistance
      value: 1,000+ hour accelerated testing
    - label: Warranty
      value: 2–5 years depending on model
    - label: Maintenance
      value: Minimal — rinse and store

solution_c:
  tagline: Solution C
  title: 'Yacht Tenders &<br />Luxury Watercraft'
  subtitle: 'Lightweight, high-performance RIB tenders designed for superyacht storage and guest transport with luxury fit and finish.'
  badge: Premium Series
  description: Our yacht tender RIBs combine lightweight construction with luxury aesthetics. Deep-V aluminum or fiberglass hulls provide exceptional ride quality and easy davit lifting. available with color-matched tube graphics, premium upholstery, and custom console layouts. Compact storage dimensions make them ideal for superyacht garages and deck storage.
  features:
    - title: Lightweight Construction
      description: Marine-grade aluminum hulls reduce weight by 30% vs fiberglass for easy lifting
    - title: Deep-V Performance
      description: 18–22 degree deadrise hull for smooth ride in chop and excellent tracking
    - title: Luxury Fit & Finish
      description: Custom upholstery, color-matched tubes, premium helm console, stainless package
    - title: Compact Storage
      description: Designed for superyacht garages — deflatable tubes for compact stowage
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Hull Type
      value: Deep-V Aluminum / Fiberglass
    - label: Deadrise
      value: 18–22 degrees
    - label: Max Speed
      value: 30–40 knots
    - label: Dry Weight
      value: 120–350 kg (aluminum hull)
    - label: Davit Lift Ready
      value: Yes — lifting points standard
    - label: Storage
      value: Deflatable tubes, stackable

