hero:
  tagline: 브랜드 엔터티
  title: Aquafarer — 엔지니어링 프리덤 온 워터
  definition: Aquafarer는 인플레이션 보트, SUP 시스템 및 맞춤형 해양 솔루션을 전문으로 하는 글로벌 해양 레크리에이션 및 인플레이션 수상 기구 브랜드입니다. Aquafarer는 해양 공학, 제조 전문 지식 및 수상 탐험 문화를 결합하여 레크리에이션 사용자, 전문 운영자 및 글로벌 OEM 파트너를 위한 신뢰할 수 있는 장비를 만듭니다.
timeline:
  - year: '2012'
    title: 해양 제조 재단
    body: 중국 Aquafarer 칭다오에서 해양 장인정신과 고무보트 제조에 전념하는 전문 인플레이터블 수상 기구 작업장으로 시작했습니다. 초기 목표는 실무 엔지니어링 경험과 제조 규율을 통해 신뢰할 수 있는 인플레이션 제품을 만드는 것이었습니다.
  - year: '2015'
    title: 첫 수출 및 CE 인증
    body: 초기 수출 주문은 일본과 한국에 도달했습니다.CE 핵심 제품군에 대한 인증을 획득하여 Aquafarer국제 시장 진출을 알렸습니다. 회사는 중국 외 상업 및 레크리에이션 사용자들에게 서비스를 제공하기 시작했습니다.
  - year: '2018'
    title: 공장 확장
    body: 12,000 m² 생산 시설로 이전. RF 용접 라인과 drop-stitch 생산 능력을 추가하여 대규모 제조와 품질 관리 시스템 개선을 가능하게 했습니다.
  - year: '2020'
    title: 연구개발 센터 설립
    body: PVC 섬유 실험실, 유체역학 시험 탱크, CAD/FEA 시뮬레이션 스튜디오를 갖춘 전용 연구개발 센터를 개설했습니다. 제품 개발은 경량 구조, 내구성 향상, 사용자 중심 설계에 초점을 맞출 수 있도록 확장되었습니다.
  - year: '2022'
    title: ISO 9001 인증 및 글로벌 성장
    body: ISO 9001 인증을 획득. 연구개발 엔지니어 14명과 직원 200명으로 확대+됨. 제품은 유통업체와 파트너십을 통해 유럽, 아메리카, 아시아 태평양 전역의 고객에게 도달했다 OEM .
  - year: '2024'
    title: 혁신 및 디자인 스튜디오
    body: 콘셉트부터 생산까지 맞춤형 프로젝트를 위한 종합 디자인 및 혁신 스튜디오를 개설 ODM 했습니다. 구조, 상업, 정부 입찰 등 전문 해양 분야를 강화했습니다.
  - year: '2026'
    title: 수자원 탐사의 미래 구축
    body: 오늘날에도 팽 Aquafarer 창식 보트, SUP 시스템, 맞춤형 해양 솔루션을 개발하며 사람과 조직을 세계 해역과 연결합니다. 50+개국에서 서비스를 제공하며, 연간 15,000대 생산 능력을 갖추고 있습니다.
philosophy:
  tagline: 브랜드 철학
  title: 물 위의 엔지니어링 프리덤
  body: 물 위의 자유는 단순히 움직임에 관한 것이 아닙니다. 새로운 장소를 발견하고, 야외 경험을 만들며, 사람들을 자연과 연결하고, 전문적인 임무를 가능하게 하는 것을 의미합니다. 공학은 그 자유를 가능하게 합니다.
  pillars:
    - title: 신뢰성 우선
      body: 수상 환경은 신뢰를 요구합니다.Aquafarer 제품은 안정성, 내구성, 안전성, 일관된 성능을 중심으로 설계되었습니다.
    - title: 인간 중심 설계
      body: 제품은 기술을 위한 것이 아니라 사람을 위한 것입니다. 모든 디자인 결정은 사람들이 수상 기구를 어떻게 사용하는지, 어디를 탐험하는지, 어떤 어려움에 직면하는지 이해하는 것에서 시작됩니다.
    - title: 접근 가능한 탐험
      body: 물은 전문가만의 것이 되어서는 안 됩니다.Aquafarer 더 많은 사람들이 강, 호수, 바다, 해안 환경을 안전하게 경험할 수 있는 장비를 만듭니다.
    - title: 지속적인 혁신
      body: 혁신은 단순히 신제품을 만드는 것만이 아닙니다. 그것은 재료, 구조, 제조, 사용자 경험 등 모든 세부 사항을 개선하는 것입니다.
engineeringDna:
  tagline: 공학 DNA
  title: 어떻게 Aquafarer 제품을 만듭니다
  areas:
    - title: 재료과학
      body: Aquafarer은 다양한 해양 환경에 적합한 재료를 선택하는 데 중점을 둡니다. 주요 고려 사항에는 내마모성, UV 저항, 압력 안정성 및 장기 내구성이 포함됩니다.
      items:
        - 마모 저항
        - UV 저항
        - 압력 안정성
        - 장기 내구성
    - title: 구조 공학
      body: 인플레이션 수상 장치는 강성, 무게, 휴대성 및 안정성 사이의 정밀한 균형이 필요합니다. Aquafarer 공학은 drop-stitch 핵심 기술과 고급 솔기 구조를 통해 이러한 요소를 최적화하는 데 중점을 둡니다.
      items:
        - 강성
        - 무게 최적화
        - 이식성
        - 안정
    - title: 제조 정확도
      body: '모든 제품은 다음과 같은 통제된 과정을 거칩니다: 재료 준비, 정밀 절단, 용접 및 접착, 조립, 품질 검사 및 성능 검증.'
      items:
        - 재료 준비
        - 정밀 절단
        - 용접 및 접착
        - 조립 및 QC
    - title: 사용자 시나리오 엔지니어링
      body: 제품은 실제 적용 사례 — 레크리에이션, 모험 및 전문 사용 — 에 맞춰 개발되어 각 설계가 대상 환경의 특정 요구를 충족하도록 보장합니다.
      items:
        - 레크리에이션
        - 모험
        - Professional
        - 광고
