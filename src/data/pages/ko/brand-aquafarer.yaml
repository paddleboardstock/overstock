trustSignals:
  tagline: 신뢰 신호
  title: 왜 Aquafarer가 신뢰할 수 있는 파트너인가
  manufacturing:
    title: 제조 역량
    body: 200-300명의 숙련된 근로자와 14명의 + R&D 엔지니어가 있는 12,000 m² 생산 시설. ISO 9001 인증 품질 관리 시스템. 연간 15,000대의 인플레이터블 수상 장치를 생산하여 50개 + 국가에 공급.
    stats:
      - label: 시설 규모
        value: 12,000 m²
      - label: 인력
        value: 200-300
      - label: 연구개발 엔지니어
        value: 14+
      - label: 연간 수용 인원
        value: 15,000
  quality:
    title: 품질 약속
    body: 재료 검사부터 최종 테스트까지, Aquafarer는 신뢰할 수 있는 해양 제품을 제공하기 위해 체계적인 품질 프로세스를 유지합니다. 모든 단위는 출하 전에 압력 테스트, 솔기 검사 및 성능 검증을 거칩니다.
    items:
      - CE 인증 완료 — 64개 모델이 유럽 안전 기준을 충족
      - ISO 9001:2015 — 품질 경영 시스템 인증
      - UKCA 표시됨 — 영국 시장 적합성
  global:
    title: 글로벌 존재
    body: Aquafarer는 유럽, 아시아-태평양, 아메리카, 중동, 아프리카 전역의 50+개국에서 배급업체, 아웃도어 브랜드, 전문 해양 사용자를 지원하며 여러 글로벌 시장에서 고객에게 서비스를 제공합니다.
comparison:
  tagline: 브랜드 포지셔닝
  title: Aquafarer 시장에서
  position: 공학 중심의 해양 제조업체로, 풍선 수상 보트 전문 지식과 완전한 OEM/ODM 능력, 맞춤 개발, 12+년의 수출 생산 경험을 결합합니다.
  strengths:
    - 팽창식 수상기구 공학 전문 지식
    - 전체 OEM/ODM 제조 능력
    - 맞춤형 제품 개발 및 디자인
    - 12,000 m² ISO 인증 생산 시설
  bestFor:
    - 신뢰할 수 있는 팽창식 수상 기구를 찾는 야외 레크리에이션 이용자
    - 상업용 장비가 필요한 해양 작업자
    - 브랜드 파트너가 OEM/ODM 제조가 필요함
    - 전문 구조 및 순찰 조직
