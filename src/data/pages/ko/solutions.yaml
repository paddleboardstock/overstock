features3_solutions:
  tagline: 솔루션
  title: 당신의 수상 모험<br />비즈니스 파트너
  isBeforeContent: false
  columns: 3
  items:
    - title: 수상 스포츠 클럽
      description: SUP 클럽, 카약 클럽, 서핑 스쿨 및 교육 센터를 위한 완전한 장비 패키지, 맞춤 브랜딩 및 유지보수 프로그램.
      icon: tabler:users
      link: /solutions/clubs
    - title: 수상 스포츠 RIBs
      description: 요트 학교, 수상 스포츠 센터 및 이벤트 조직을 위한 목적 맞춤형 RIBs. 전문 수상 스포츠용 코치 보트, 견인 보트 및 마샬 크래프트.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: 리조트 & 호텔
      description: 시설 운영을 위한 함대 장비, 안전 시스템, 직원 교육 및 수익 관리가 포함된 프리미엄 수상 스포츠 프로그램.
      icon: tabler:beach
      link: /solutions/resorts
    - title: 수상 브랜드 기업가
      description: 낮은 MOQs, 맞춤 제품 설계, 포장 및 전 세계 배송을 위한 개인 브랜드 OEM/ODM 제조, 신규 브랜드 소유자를 위해.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: 다이빙 센터 보트
      description: 출입이 용이하고, 장비 보관 및 다이빙 작업에 최적화된 엔진 구성을 갖춘 안정적인 RIB 플랫폼.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: 구조 및 긴급 수상 보트
      description: 수색 구조, 긴급 대응 및 해안 경비 작전을 위해 설계된 고속 RIBs 및 인플레이션 보트.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: 요트 탠더 솔루션
      description: 슈퍼요트 및 레크리에이션 선박을 보완하는 컴팩트하고 스타일리시한 RIB 텐더. 쉬운 보관, 강력한 성능.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: 낚시 보트 솔루션
      description: 상업 및 레크리에이션 낚시 작업에 맞게 구성된 안정적이고 내구성 있는 인플레이션 보트와 RIBs.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: 해양 관광 장비
      description: 리조트, 여행사, 수상 스포츠 대여업체를 위한 함대 준비 완료형 고무보트, SUP 보드, 카약.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: 해양 에너지 RIBs
      description: 석유 및 가스 플랫폼 지원, 풍력 발전소 승무원 운송, 해저 케이블 점검, 해양 건설을 위한 중장비 RIBs.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: 양식업용 작업보트
      description: 양식, 진주 양식, 해양 목장용 내식성 RIBs. Hypalon 튜브, 스테인리스 장비, 일상 사용에 적합한 내구성.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: 해양 연구 및 조사
      description: 해양학 연구, 환경 모니터링, 수질 샘플링, 대학 교육 프로그램을 위한 안정적인 계기 장착형 RIBs.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: 상업용 작업선
      description: 순찰, 조사, 운송, 해양 물류를 위한 중장비 RIBs. 상업 운영의 엄격한 요구에 맞게 제작됨.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: 어떤 선택이 귀하의 사업에 맞는지 잘 모르겠나요?
  subtitle: 귀하의 운영에 대해 알려주시면, 적합한 장비 패키지, 브랜드 프로그램 또는 맞춤형 솔루션을 추천해 드립니다.
  actions:
