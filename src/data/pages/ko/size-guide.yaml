hero:
  title: 사이즈 및 사양 안내
  subtitle: 모든 Aquafarer 제품의 치수, 용량 및 권장 사용법.
categories:
  inflatable: 휴대성을 위해 설계된 SUPs 및 카약으로 성능을 희생하지 않습니다. 체중과 패들링 스타일에 맞는 적절한 사이즈를 선택하세요.
  rib: 연안 항해, 순찰 및 전문 해양 작업용 단단한 선체의 인플레이션 보트. 길이와 엔진 용량으로 선택하세요.
  accessory: 수상 장비를 보완하는 액세서리 및 안전 장비. 다양한 옵션과 함께 제공되는 범용 사이즈.
table:
  headers:
    product: 제품
    length: 길이
    width: 폭
    weight: 무게
    max_load: 최대 적재량
    best_for: 최고의 대상
how_to_choose:
  title: 적절한 사이즈 선택 방법
  cards:
    - title: SUP 보드
      description: 체중과 사용 목적에 따라 길이를 선택하세요. 더 넓은 보드(32"+)는 더 높은 안정성을 제공합니다. 더 긴 보드(11-12피트)는 투어링에 더 적합합니다. 체중이 더 나가는 패들러는 더 큰 용적의 보드가 필요합니다.
    - title: 카약
      description: 단일 카약(9피트)는 1인 여행과 강에서 사용하기에 가장 적합합니다. 2인용 카약(12피트)은 두 명의 패들러 또는 장비를 가진 1명의 성인을 수용할 수 있습니다. 총 장비 포함 적재량을 확인하세요.
    - title: 딩히 & RIBs
      description: 딩기 길이는 승객 수와 사용 목적에 따라 선택하세요. 더 큰 RIBs(4.5 m+)는 근해와 구조에 적합합니다. 작은 딩기(2.7 m)는 텐더 및 낚시 플랫폼으로 사용됩니다.
