    잡을 준비가 된<br class="block sm:hidden" /><span class="sm:whitespace-nowrap">클리어런스 웨이브?</span>
  subtitle: 소매가에서 최대 60% 할인된 SUP 패키지를 공장 직판으로 구매하세요 — 2년 보증과 전 세계 배송 포함.
  actions:
    - variant: primary
      text: 클리어런스 상품 쇼핑하기
      href: /supboard
      icon: tabler:rocket
    - text: 문의하기
      href: /contact
      icon: tabler:file-text
