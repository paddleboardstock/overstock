content_customer_types:
  tagline: 우리가 서비스를 제공하는 대상
  title: 모든 사람을 위한 보드<br />패들러 종류
  subtitle: 처음 세션이든 쉰 번째 세션이든, 패들하는 방식에 맞춘 클리어런스 보드가 있습니다.
  items:
    - title: 초보자
      description: 처음 세션을 쉽게 만들어주는 매우 넓고 안정적인 전천후 보드 — 대부분의 초보자는 몇 분 안에 일어설 수 있습니다.
      icon: tabler:swimming
      cta: 초보자 친화적인 SUPs쇼핑
      cta_href: /supboard
    - title: 가족
      description: 온 가족이 함께 쓸 수 있는 마구간 보드와 가벼운 어린이용 모델 — 차에 짐을 넣고 몇 분 만에 부풀리는 장비들.
      icon: tabler:beach
      cta: 가족 패키지 쇼핑
      cta_href: /products
    - title: 투어링 및 피트니스 패들러
      description: 더 길고 빠른 투어링 보드와 장거리 패들러를 위한 풀덱 요가 플랫폼.
      icon: tabler:route
      cta: 투어링 및 요가 보드 쇼핑
      cta_href: /supboard
    - title: 낚시꾼들
      description: 조용하고 평평한 갑판에서 주조하는 초안정형 플랫폼, 기어 마운트와 쿨러 공간이 있습니다.
      icon: tabler:lifebuoy
      cta: 샵 피싱 SUPs
      cta_href: /products
features:
  id: features
  tagline: 왜 구매해야 하는가 Paddle Board Overstock
  title: 리얼 팩토리,<br />실질 절감
  subtitle: 공장 직접 재고 초과 재고 및 클리어런스 SUP 패키지 — 소매 마진 없이 인증된 품질.
  columns: 2
  items:
    - title: 최대 60% 할인
      description: 공장 재고와 클리어런스 배치를 직접 판매하며, 중간상이나 소매 마진 없이. 다른 곳에서 정가로 판매되는 동일한 보드를 여기서도 클리어런스 가격에 판매합니다.
      icon: tabler:rocket
    - title: 완전 패키지
      description: 모든 제품 SUP 이 보드, 여행용 백팩, 핸드펌프, 조절 가능한 패들, 탈착식 핀, 코일 리쉬, 수리 키트 등 완전한 패키지로 제공됩니다.
      icon: tabler:clipboard-list
    - title: 인증된 품질
      description: 13개의 CE 인증 SUP 모델은 해당 EU 지침에 따라 적용됩니다. 각 보드는 배송 전에 정격 PSI의 1.25배 압력에서 100% 압력 테스트를 거칩니다. AQL 2.5 기준으로 99.3% 무결점 비율을 기록합니다.
      icon: tabler:certificate
    - title: 아니요 MOQ — 오더 원 보드
      description: 재고 초과 정리로 단일 주문 환영합니다. 장바구니에 보드를 추가하고, 계산 완료. 최소 주문 없이, 견적 절차도 없습니다.
      icon: tabler:adjustments
    - title: 빠른 전 세계 배송
      description: 재고 주문은 웨이하이에서 2-3영업일 이내에 배송됩니다.+ EU, 북미, 아시아 태평양 및 그 외 50개국에 배송을 추적합니다.
      icon: tabler:truck-delivery
    - title: 2년 SUP 보증
      description: 모든 SUP 보드와 액세서리는 2년간 보장되며 drop-stitch , 이음새, 팽창 밸브, 액세서리도 포함됩니다. 청구는 몇 주 만에 해결됩니다.
      icon: tabler:lifebuoy
content_categories:
  tagline: 제품 카테고리
  title: 한 가지 제품 라인,<br />제대로 된 거
  subtitle: 인플레이터블 SUP 보드와 액세서리 — 모두 저희 웨이하이 ISO 9001 시설에서 제작되었습니다.
  items:
    - title: SUP 보드
      description: 올라운드 인플레이터블 SUPs, 9~12피트 길이. 안정적이고 내구성이 뛰어나며 펌프, 패들, 리쉬, 백팩 포함.
      icon: tabler:swimming
      link: /supboard
    - title: 투어링 SUPs
      description: 호수, 강, 해안 탐험용으로 긴 길이와 빠른 속도의 투어링 보드.
      icon: tabler:route
      link: /supboard
    - title: 요가 & 피트니스 SUPs
      description: 물 위에서의 요가와 운동을 위한 전체 길이 데크 패드가 있는 초광폭, 초안정 플랫폼.
      icon: tabler:users
      link: /supboard
    - title: 키즈 SUPs
      description: 아이들을 위한 더 가볍고 짧은 보드 — 동일한 drop-stitch 품질을 어린이 친화 패키지로 제공.
      icon: tabler:lifebuoy
      link: /products
    - title: 액세서리
      description: 펌프, 패들, 구명조끼, 리쉬, 수리 키트, 모든 판매 보드용 교체 부품.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: 공장 강도
  title: 왜 우리의 클리어런스 가격이<br />실제인지
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">진짜 공장, 진짜 절약 — 모든 보드는 웨이하이 시설에서 발송</h3>
  items:
    - title: 주요 브랜드와 동일한 생산 라인
      description: 12,000 m² 웨이하이 공장은 국제 브랜드용 보드와 우리의 자체 재고 배치를 동일한 라인과 동일한 재료로 제작합니다.
    - title: 100% 압력 테스트 완료
      description: 모든 보드는 PSI 정격의 1.25배로 압력 테스트 후 발송됩니다. AQL 2.5 / ISO 2859당 결함률 0.7%.
    - title: 중간 상인 없음
      description: 보드는 공장에서 직접 문앞까지 배송됩니다. 배급상 가격 마진 없음, 소매 마진 없음 — 이렇게 클리어런스 가격이 소매가보다 최대 60% 낮게 유지됩니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12,000 m² 웨이하이 공장, 인플레이터블 SUP 생산 라인
content_compliance:
  tagline: 준수 및 품질 증명
  title: 인증된 품질,<br />문서화
  subtitle: 모든 규정 준수 주장은 인증서와 모델별 문서로 뒷받침되며 검증 가능합니다.
  items:
    - title: ISO 9001:2015
      description: TÜV Rheinland/SGS 인증 품질 관리 시스템. 연간 감시 감사 수행. 입고 자재부터 출하 승인까지 문서화된 품질 관리 절차.
      icon: tabler:certificate
    - title: CE 인증됨
      description: EU 지침에 따른 13개의 CE 인증 SUP 모델, 각 모델별 적합 선언서와 제작자 명판 데이터 포함.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: 모든 PVC 및 접착 재료는 EU REACH 규정을 준수합니다. UK 시장용 UKCA 마킹 가능. 요청 시 물질 안전보건자료 제공.
      icon: tabler:shield-check
    - title: 2년 SUP 보증
      description: 모든 SUP 보드 및 액세서리는 2년간 보장 — drop-stitch 심, 인플레이션 밸브 및 액세서리 포함. 클레임 신속 처리.
      icon: tabler:lifebuoy
steps:
  title: 결제에서 물까지 — 주문이 배송되는 방법
  items:
    - title: 1단계:<span class="font-medium">보드를 선택하세요</span>
      description: 전천후, 투어링, 요가, 키즈 모델 중에서 선택하세요. 구매 가이드는 보드 크기와 스타일을 패들링에 맞추는 데 도움을 줍니다.
      icon: tabler:clipboard-list
    - title: 단계 2:<span class="font-medium">안전한 결제</span>
      description: Stripe 또는 PayPal로 안전하게 결제하세요. 모든 주요 신용카드 및 직불카드 사용 가능. 계정 필요 없음 — 주문 확인이 이메일로 전송됩니다.
      icon: tabler:file-text
    - title: 3단계:<span class="font-medium">품질 검사</span>
      description: 모든 보드는 포장되기 전에 정격의 1.25배 PSI에서 100% 압력 테스트를 거치고 전체 품질 체크리스트를 기준으로 확인됩니다.
      icon: tabler:settings
    - title: 단계 4:<span class="font-medium">빠른 배송</span>
      description: 재고 주문은 당사 웨이하이 공장에서 2~3영업일 이내에 발송됩니다. 긴급 주문의 경우 신속 처리도 가능합니다.
      icon: tabler:building-factory
    - title: 5단계:<span class="font-medium">추적 배송</span>
      description: 전 세계 50개국으로 배송 추적 가능. 보드가 도착하는 날부터 2년 보증과 신속한 애프터서비스가 시작됩니다.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP 보안 결제부터 전 세계 추적 배송까지의 주문 과정
blog_latest:
  title: SUP 가이드 및 기술 정보
  information: |
    구입 가이드, 패들링 기술, 안전 필수품, 그리고 구조
    Paddle Board Overstock 팀의 연구.
faqs:
  title: SUP 주문 및 제품 FAQ
  subtitle: 저희 클리어런스 SUP 보드, 주문, 결제, 배송 및 보증에 대한 일반적인 질문.
  columns: 2
  items:
    - title: SUP 배우기 어렵나요?
      description: 전혀 그렇지 않습니다. 대부분의 초보자들은 첫 세션 내에 일어나서 패들을 사용할 수 있습니다. 저희의 올어라운드 SUP 보드는 처음 패들링을 하는 사람들을 위해 특별히 설계된 넓고 안정적인 플랫폼을 갖추고 있습니다. 잔잔한 물에서 시작하면 몇 분 만에 패들링을 즐기실 수 있습니다.
      icon: tabler:swimming
      category: sup
    - title: 무게 제한은 무엇입니까?
      description: 우리의 올어라운드 SUPs는 최대 220파운드까지 지원하며, 투어링 및 요가 플랫폼은 최대 250파운드까지 지원합니다. 모든 제품 페이지에는 정확한 라이더 체중 용량이 나와 있어 보드를 필요에 맞게 선택할 수 있습니다.
      icon: tabler:adjustments
      category: sup
    - title: 풍선 SUP을 가지고 여행할 수 있나요?
      description: 절대적으로 그렇습니다. 모든 Paddle Board Overstock 보드는 배낭 크기의 운반 케이스에 들어갑니다. 무게가 단 18-22파운드로 해변, 호수, 또는 공항 터미널을 통해서도 쉽게 운반할 수 있습니다. 여행 전에 항공사 수하물 정책을 확인하세요.
      icon: tabler:truck-delivery
      category: sup
    - title: 상자에는 무엇이 들어있나요?
      description: 모든 Paddle Board Overstock SUP에는 보드, 여행용 백팩, 손 펌프, 조절 가능한 패들, 탈착식 핀, 코일 리쉬, 수리 키트가 포함됩니다.
      icon: tabler:clipboard-list
      category: sup
    - title: 왜 당신의 가격이 소매가보다 낮나요?
      description: 우리는 중국 웨이하이의 자체 생산 시설에서 직접 공장 재고 및 클리어런스 배치를 판매합니다 — 중간상 없음, 소매 마진 없음. 이는 일반 소매 가격 대비 최대 60% 할인된 완전한 SUP 패키지를 제공하며, 동일한 CE 인증 품질을 보장합니다.
      icon: tabler:certificate
      category: orders
    - title: 주문하고 결제하려면 어떻게 해야 하나요?
      description: 귀하의 SUP 패키지를 장바구니에 추가하고 Stripe 또는 PayPal로 안전하게 결제하세요. 저희는 모든 주요 신용카드와 직불카드를 받습니다. 모든 주문은 전체 인보이스와 함께 이메일로 확인됩니다.
      icon: tabler:file-text
      category: orders
    - title: 전 세계로 배송하시나요?
      description: 예. 저희는 EU, 북미, 아시아-태평양, 중동 및 아프리카 전역의 50개+ 국가로 배송합니다. 재고가 있는 주문은 일반적으로 2-3영업일 내에 배송되며, 모든 소포에 대해 추적 정보를 제공합니다.
      icon: tabler:route
      category: orders
    - title: SUP 보드에는 어떤 보증이 포함되어 있나요?
      description: '모든 SUP 보드와 액세서리는 보드 자체, drop-stitch 이음새, 인플레이션 밸브를 포함하여 2년 보증이 적용됩니다. 클레임은 몇 주가 아닌 며칠 내에 해결됩니다: 온라인으로 접수하면 저희가 수리하거나 교체합니다.'
      icon: tabler:lifebuoy
      category: orders
cta:
