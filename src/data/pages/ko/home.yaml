content_customer_types:
  tagline: 우리가 서비스를 제공하는 대상
  title: B2B 구매자를 위해 만들어짐<br />— 소매 고객이 아님
  subtitle: Aquafarer는 네 가지 고객 유형을 위해 제조합니다. 각 유형마다 우선 순위가 다르며, 우리는 모두 이를 충족합니다.
  items:
    - title: 브랜드 소유자 / 자체 상표
      description: 맞춤형 제품 디자인, 프라이빗 라벨 그래픽, 귀사 브랜드 하의 규정 준수 문서, 그리고 컨셉부터 컨테이너까지 전담 엔지니어 지원.
      icon: tabler:palette
      cta: 견적 요청 OEM/ODM
      cta_href: /request-quotation
    - title: 유통업체 / 도매업체
      description: 영토 보호, 경쟁력 있는 도매 가격, 마케팅 지원 키트, 제품 교육 및 귀하의 시장을 위한 완전한 준수 문서.
      icon: tabler:world
      cta: 딜러십 신청
      cta_href: /dealers-distributors
    - title: 리조트 / 렌탈 운영자
      description: 상업용 등급 내구성, 차량 규모 조언, 혼합 모델 컨테이너 주문, 예비 부품 전략, 리조트 브랜드 장비 패키지.
      icon: tabler:beach
      cta: 상업용 패키지 받기
      cta_href: /solutions/resorts
    - title: 구조 / 정부 / 전문직
      description: Hypalon/CSM 건설, SOLAS 준수 옵션, 프로젝트별 인증, 입찰 문서 지원, 및 NDA 보호 엔지니어링.
      icon: tabler:shield
      cta: 프로젝트에 대해 논의하다
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM 기능
  title: 획득 내용<br />Aquafarer와 함께
  subtitle: 무역회사가 아닌, 엔지니어링, 품질 및 규정 준수를 완전히 지원하는 직접 공장 접근.
  columns: 2
  items:
    - title: OEM/ODM 맞춤 설정
      description: 맞춤형 선체 설계, 튜브 재질 (PVC 또는 Hypalon/CSM), 콘솔 배치, 좌석 배치, 브랜딩, 색상 및 포장. 사소한 수정부터 완전 맞춤형 엔지니어링까지.
      icon: tabler:adjustments
    - title: 낮은 MOQ, 빠른 샘플링
      description: 'RIB: 2-5개 (기존 몰드). SUP: SKU당 5-10개. 맞춤 몰드: 200+개. 7-14일 내에 귀사 브랜드가 적용된 사전 생산 샘플 제공.'
      icon: tabler:rocket
    - title: 생산 준비 완료 품질
      description: 모든 유닛은 정격 PSI의 1.25배에서 24-48시간 압력 시험을 거쳤습니다. AQL 2.5 / ISO 2859 기준 결함 없는 비율 99.3%. 선체별 100점 품질 점검표 적용.
      icon: tabler:certificate
    - title: 완전한 준수 문서
      description: CE 2013/53/EU (RCD) 기준, ISO 9001:2015 (SGS), BSCI 사회 감사, REACH 준수, UKCA 표시. 모델별 DoC 및 제작자 판넬 데이터 포함.
      icon: tabler:file-certificate
    - title: 30-45일 리드 타임
      description: 표준 생산 30-45일 FOB 칭다오. 시제품 7-14일. 긴급 생산 가능. 컨테이너 적재 계획 및 ISPM-15 포장 포함.
      icon: tabler:truck-delivery
    - title: 애프터서비스 및 예비 부품
      description: 보트/카약/RIBs는 5년 보증, SUP/액세서리는 2년 보증. 부품 우선 배송 지원. 보증 청구 처리 지원.
      icon: tabler:lifebuoy
content_categories:
  tagline: 제품 카테고리
  title: 5개 범주,<br />64 CE-인증 모델
  subtitle: 2.4m RIB 소형 보트부터 15ft SUP 보드까지 — 모두 우리 청도 ISO 9001 시설에서 제조되었습니다.
  items:
    - title: RIB 보트
      description: 알루미늄 또는 GRP 선체로 2.4m에서 7.0m. PVC 또는 Hypalon/CSM 튜브. 2013/53/EU에 따른 CE. 순찰, 다이빙, 구조 및 상업용 구성.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: 에어보트
      description: 알루미늄 바닥, 합판 바닥 또는 에어덱 옵션과 함께 2.0m에서 5.0m까지. 낚시, 레크리에이션 및 텐더 모델.
      icon: tabler:sailboat
      link: /products
    - title: SUP 보드
      description: 4인치 및 6인치 Drop-Stitch로 9피트에서 15피트까지. 올라운드, 투어링, 요가, 낚시 모델. 상업용 등급 사용 가능.
      icon: tabler:swimming
      link: /products
    - title: 카약
      description: 1인용에서 3인용까지의 충전식 카약. Drop-Stitch 바닥 옵션이 있는 레크리에이션 및 투어링 모델.
      icon: tabler:kayak
      link: /products
    - title: 안전 장비
      description: CE 인증 구명조끼, 던지는 밧줄, 수리 키트, 펌프, 및 항해용 조명. USCG III/V형 승인 PFD.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: 공장 강도
  title: 감사 준비 완료 제조<br />칭다오에서
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12,000 m² ISO 9001 시설 — 무역회사가 아닌 실제 제조업체</h3>
  items:
    - title: 6개의 전용 생산 라인
      description: 별도의 RIB, 고무보트, SUP, 카약, 안전 장비 및 OEM/ODM 라인. 각각 전용 QC 체크포인트와 생산 계획 포함.
    - title: 100% 압력 테스트 완료
      description: 모든 팽창식 챔버는 정격 PSI의 1.25배로 압력이 가해지고 24-48시간 동안 유지됩니다. 시험 결과는 선체 일련 번호(HIN)에 연결됩니다.
    - title: 개별 선체 추적성
      description: 'HIN 수준의 생산 기록으로 선체당 21개의 데이터 필드: 재료 배치, 용접사 ID, 압력 테스트 결과, 최종 구성, 및 배송 목적지.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12,000 m² ISO 9001 제조 시설, RIB 생산 라인 보유, 칭다오
content_compliance:
  tagline: 준수 및 품질 증명
  title: 문서화된 증거,<br />단순한 주장만이 아니다
  subtitle: 모든 준수(claim) 주장은 귀하가 확인할 수 있는 모델별 문서로 뒷받침됩니다.
  items:
    - title: ISO 9001:2015 (SGS)
      description: TÜV Rheinland/SGS 인증 품질 관리 시스템. 연간 감시 감사 수행. 입고 자재부터 출하 승인까지 문서화된 품질 관리 절차.
      icon: tabler:certificate
    - title: CE 2013/53/EU (RCD) 기준
      description: 모델별 적합성 선언이 있는 64개의 모델. 적용 가능한 모듈에 따른 적합성 평가. 모든 선체에 대한 HIN 등록 및 제작자 플레이트 데이터.
      icon: tabler:file-certificate
    - title: BSCI 사회적 준수
      description: 연간 SGS에 의한 BSCI 감사. 우리 시설 전반의 윤리적 노동 관행, 작업장 안전 및 환경 관리를 검증했습니다.
      icon: tabler:users
    - title: REACH & UKCA
      description: 모든 PVC 및 접착 재료는 EU REACH 규정을 준수합니다. UK 시장용 UKCA 표시 가능. 요청 시 물질 안전 보건 자료 제공.
      icon: tabler:shield-check
steps:
  title: OEM/ODM 프로세스 — 브리핑에서 컨테이너까지
  items:
    - title: 1단계:<span class="font-medium">요구 사항</span>
      description: 제품 사양, 목표 시장, 수량 및 규정 준수 요구 사항을 공유하세요. 우리 엔지니어링 팀이 48시간 내에 검토합니다.
      icon: tabler:file-text
    - title: 단계 2:<span class="font-medium">제안</span>
      description: 귀하의 시장을 위한 사양, 재료 옵션, MOQ, 가격, 리드 타임 및 준수 범위를 포함한 자세한 제안을 받으십시오.
      icon: tabler:clipboard-list
    - title: 3단계:<span class="font-medium">프로토타입</span>
      description: 귀하의 브랜딩이 적용된 사전 제작 샘플을 7-14일 내에 제공합니다. 정격 압력의 1.25배에서 전체 품질 테스트 진행. 샘플 비용은 제작 비용으로 전액 공제됩니다.
      icon: tabler:settings
    - title: 단계 4:<span class="font-medium">생산</span>
      description: 샘플 승인 후 30-45일 생산 FOB 청도. 공정 중 QC 체크포인트, 압력 테스트, 그리고 모든 유닛에 대한 100점 최종 검사.
      icon: tabler:building-factory
    - title: 5단계:<span class="font-medium">배송</span>
      description: 컨테이너 적재 계획, ISPM-15 목재 포장, 준수 문서 패키지, 그리고 FOB 청도 선적과 모든 수출 서류.
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: 'Aquafarer OEM/ODM 고무보트 제작 과정: 설계부터 컨테이너 출하까지'
blog_latest:
  title: 산업 및 기술 인사이트
  information: |
    RCD 준수 가이드, OEM/ODM 프로세스 기사, 자료 비교,
    그리고 Aquafarer 엔지니어링 팀의 공장 검사 자원.
faqs:
  title: B2B 조달 FAQ
  subtitle: 브랜드, 유통업체 및 상업 운영자가 Aquafarer로 OEM/ODM 제조에 대해 자주 묻는 질문.
  columns: 2
  items:
    - title: 당신은 제조업체인가요, 아니면 무역 회사인가요?
      description: 우리는 품질, 자재, 리드 타임을 완전히 통제할 수 있는 수직 통합 공장입니다. 사업자 등록증과 생산 범위는 공장 감사 시 확인 가능합니다.
      icon: tabler:building-factory
      category: all
    - title: 당신의 OEM/ODM 과정은 무엇입니까?
      description: 요구 사항 검토(48시간)에서 제안서, 프로토타입(7-14일), 생산(30-45일 FOB 칭다오)까지. 전체 엔지니어링 지원, 준수 문서, 그리고 선체별 추적 가능성을 제공.
      icon: tabler:route
      category: all
    - title: 귀하의 MOQ 요구 사항은 무엇입니까?
      description: 'RIB 보트: 모델당 2-5개(기존 몰드), 맞춤 몰드의 경우 200개+. SUP 보드: SKU당 5-10개. 혼합 모델 컨테이너 주문 가능. 평가를 위한 샘플 주문은 2-5개.'
      icon: tabler:sort-ascending
      category: all
    - title: 어떤 맞춤 설정 옵션을 사용할 수 있나요?
      description: 선체 설계, 튜브 재질(PVC 또는 Hypalon/CSM), 튜브 직경, 콘솔 배치, 좌석, 조향, 연료 시스템, 데크 배치, 브랜드 색상, 로고 그래픽, EVA 패드 디자인, 소매 포장, 소유자 매뉴얼 브랜딩.
      icon: tabler:adjustments
      category: all
    - title: 저의 시장에 대해 어떤 준수 문서를 제공할 수 있습니까?
      description: CE 2013/53/EU에 따른 DoC, UKCA 표시, ISO 9001 인증서 (SGS), BSCI 감사 보고서, REACH 준수, 재료 시험 보고서, 압력 시험 기록, 모델별 제작자 명판 데이터. 요청 시 시장별 문서 제공.
      icon: tabler:file-certificate
      category: all
    - title: 샘플링 및 생산 리드타임은 얼마입니까?
      description: '사전 생산 샘플: 7-14 근무일. 표준 생산: 30-45일 FOB 칭다오. 긴급 생산은 추가 비용으로 가능. 성수기(3월-6월)에는 리드 타임이 연장될 수 있습니다.'
      icon: tabler:clock
      category: all
    - title: 공장 감사나 라이브 영상 투어를 예약할 수 있나요?
      description: 예. 청도 시설에서의 현장 공장 감사는 3-5일 사전 통보 시 환영합니다. WhatsApp/Zoom을 통한 실시간 영상 투어는 즉시 가능합니다. 제3자 검사(SGS, BV, TÜV)도 가능합니다.
      icon: tabler:video
      category: all
    - title: 출하 전에 어떤 품질 검사가 완료되나요?
      description: 1.25배 정격 압력 유지 시험(24-48시간), 솔기 박리 시험, 100포인트 최종 검사 체크리스트, 치수 검증, 외관 검사, 규정 준수 문서 검증 및 포장 완전성 점검. 모두 ISO 9001 절차에 따름.
      icon: tabler:clipboard-check
      category: all
