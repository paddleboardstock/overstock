testimonials:
  - category: clubs
    name: 리카르도 산토스
    title: 소유자, 알가르브 서프 아카데미
    location: 포르투갈, 라고스
    content: 우리 서핑 학교는 클럽 스타터 패키지로 시작했습니다. 보드 20개, 패들, 조끼 — 모든 것이 3주 안에 도착했습니다. 두 시즌 후 우리는 프로 패키지로 업그레이드했습니다. 우리 로고로 맞춤 브랜딩을 한 것은 전문적인 이미지에 혁신적인 변화를 가져왔습니다.
    rating: 5
    product: 클럽 스타터 패키지
    source: solutions/clubs
  - category: clubs
    name: 클럽 소유자
    title: 워터 스포츠 클럽
    location: 태국, 푸켓
    content: 클럽 스타터 패키지는 완벽한 입문점이었습니다. 사업이 성장함에 따라, Aquafarer도 함께 성장했습니다 — 동일한 품질, 동일한 가격, 놀라움 없음. 우리는 18개월 만에 보드를 10개에서 80개로 확장했습니다.
    rating: 5
    product: 클럽 스타터 + 프리미엄 패키지
    source: success-stories
  - category: resorts
    name: 리조트 총지배인
    title: 5성급 해변 리조트
    location: 그리스
    content: Aquafarer는 단순히 보드를 제공하는 것에 그치지 않고 완벽한 고객 경험 구축을 도왔습니다. 우리의 워터 스포츠 프로그램은 한 시즌 만에 리조트의 하이라이트로 자리잡았습니다. 주간 예약 300+건과 연간 매출 $180K.
    rating: 5
    product: 리조트 프리미엄 패키지
    source: success-stories
  - category: resorts
    name: 소피 로랑
    title: 게스트 경험 이사, Azure Bay Resorts
    location: 태국, 푸켓
    content: Aquafarer는 세 개의 리조트 시설에서 우리의 해변 활동 프로그램 전체를 설계하고 장비를 갖추었습니다. 80개의 SUPs, 40개의 카약, 안전 인프라, 직원 교육 — 모두 한 번의 배송으로 제공되었습니다. 첫 시즌에 게스트 참여율이 60% 증가했습니다.
    rating: 5
    product: 리조트 프리미엄 패키지
    source: solutions/resorts
  - category: entrepreneurs
    name: 마이클 박
    title: 창립자, Shoreline Paddle Co.
    location: 캘리포니아, 미국
    content: 저는 업계 경험 없이 SUP 브랜드를 출시했습니다. Aquafarer 팀은 제품 선택부터 맞춤 로고 디자인과 포장까지 저를 안내했습니다. 첫 번째 컨테이너는 11주 만에 도착했고, 3개월 만에 아마존에서 매진되었습니다.
    rating: 5
    product: 스타터 브랜드 런치
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: 창립자
    title: 호주 SUP 브랜드
    location: 호주
    content: 브랜드 아이디어는 있었지만 제조 지식은 전혀 없었습니다. Aquafarer가 처음 보드 디자인 선택부터 첫 배송 개봉까지 전체 과정을 문자 그대로 손잡고 안내해 주었습니다. 꿈에서 배송까지 90일.
    rating: 5
    product: 브랜드 런치 패키지
    source: success-stories
  - category: rental
    name: 다니엘 오콘크워
    title: 소유자, Lakeland SUP 렌탈
    location: 캐나다 온타리오
    content: 저는 지역 상점에서 보드를 5개 빌리며 수익의 60%를 잃고 있었습니다. Aquafarer는 저만의 15개 SUPs 보트 함대를 구축하도록 도와주었습니다. ROI 계산기에 따르면 손익분기점은 4개월이었지만 실제로 3개월 만에 달성했습니다. 이제 30대로 확장 중입니다.
    rating: 5
    product: 함대 스타터 키트
    source: solutions/rental-business
  - category: rental
    name: 마르코 발렌티
    title: 운영 이사, Adriatic Adventure Tours
    location: 크로아티아 두브로브니크
    content: 저희는 렌탈 함대 전체를 Aquafarer RIBs로 장비했습니다 — 세 곳에서 12척의 보트. 두 시즌째 무고장 상태입니다. CE 인증 문서 덕분에 보험 승인도 원활하게 진행되었습니다. 엔지니어링 팀은 튜브 색상까지 맞춤 제작했습니다.
    rating: 5
    product: 함대 확장 키트
    source: trust
  - category: rental
    name: 중령 안드레스 레예스
    title: 해양 조달 담당, 필리핀 해안경비보조대
    location: 필리핀 마닐라
    content: 저희는 해안 순찰 함대 전역에서 24개의 Aquafarer RIBs를 운영합니다. 그들의 QC 프로세스는 모든 배치에서 일관되며 — 동일한 솔기 품질, 동일한 밸브 위치, 동일한 압력 등급이 매번 동일합니다. 장비에 생명이 달려 있을 때, 이러한 반복 가능성은 중요합니다.
    rating: 5
    product: RIB 순찰 함대
    source: trust
  - category: consumers
    name: 사라 K.
    title: 처음 SUP 소유자
    location: 미국 레이크 타호
    content: 완전 초보자에게도 안정적입니다. 첫날 호수에서 시험 삼아 탔는데 한번도 넘어지지 않았습니다. 펌프와 패들이 포함된 완전한 구성 덕분에 상자를 연 지 20분 만에 물 위에 있을 수 있었습니다.
    rating: 5
    product: SUP 익스플로러 11
  - category: consumers
    name: 제임스 소런톤
    title: SUP 익스플로러 11 소유자
    location: 캐나다 밴쿠버
    content: 처음 구매하는 사람으로서, 해외에서 주문하는 품질이 걱정됐습니다. 제가 요청하기도 전에 그들이 공유해준 ISO 문서와 제3자 테스트 보고서는 저에게 완전한 신뢰를 주었습니다. 보드는 6일 만에 도착했고 제 기대를 뛰어넘었습니다.
    rating: 5
    product: SUP 익스플로러 11
    source: trust
  - category: consumers
    name: 마이크 R.
    title: 레크리에이션 카약 사용자
    location: 미국 플로리다
    content: 견고한 제작 품질. 인플레이터블보다는 예상보다 해안 물결을 훨씬 잘 견뎌냅니다. 주말 여행을 위해 차 트렁크에 싣고 갔고 — 4분 만에 램프에서 부풀렸습니다.
    rating: 5
    product: 풍선 카약
