hero:
  tagline: 파트너 및 유통
  title: Aquafarer 파트너 되기<br />— 글로벌 유통 네트워크
  subtitle: Aquafarer의 글로벌 파트너 네트워크에 참여하세요. 우리는 50+개국의 해양 유통 업체, 보트 딜러, 장비 소매업체 및 브랜드 파트너와 협력합니다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer 글로벌 파트너 및 유통 네트워크
content_programs:
  tagline: 파트너 프로그램
  title: 파트너 프로그램<br />성장을 위한 설계
  subtitle: 귀하가 유통업체, 딜러 또는 브랜드 파트너인지에 관계없이, Aquafarer는 귀하의 비즈니스를 지원하도록 설계된 프로그램을 제공합니다.
  columns: 3
  items:
    - title: 유통업체 프로그램
      description: 독점 지역 유통, 대량 가격 책정, 마케팅 지원 및 직접 공장 접근. 지역 크기에 따라 최소 참여 조건 필요.
      icon: tabler:world
    - title: 딜러 프로그램
      description: 직접 딜러 가격, 제품 교육, 마케팅 자료 및 소매점 및 온라인 스토어를 위한 보증 지원.
      icon: tabler:building-store
    - title: OEM/ODM 파트너십
      description: 맞춤 브랜드, 포장 및 제품 사양을 포함한 전면 서비스 OEM 및 ODM 제조. 초기 개념부터 컨테이너까지.
      icon: tabler:certificate
    - title: 브랜드 파트너십
      description: 해양 및 야외 레크리에이션 분야에서 확립된 브랜드를 위한 공동 브랜딩, 프라이빗 라벨 및 독점 모델 프로그램.
      icon: tabler:stars
    - title: 정부 및 기관
      description: 정부 기관, 해안 경비대, 군대 및 인도주의 단체를 위한 우선 공급업체 프로그램. 입찰 준비 문서 제공.
      icon: tabler:building-community
    - title: 리조트 및 렌탈 파트너
      description: 전 세계 리조트, 다이빙 센터 및 렌탈 운영을 위한 선박 가격, 일관된 품질 및 맞춤 브랜드.
      icon: tabler:sun
content_benefits:
  tagline: 왜 우리와 파트너해야 하는가
  title: 파트너들이 Aquafarer를 선택하는 이유
  subtitle: 우리 파트너들은 실제 제조 능력, 일관된 품질 및 신속한 지원의 혜택을 누립니다.
  list:
    - '직접 공장 접근: 중개인 없이 제조팀과 직접 작업. 빠른 응답, 더 나은 가격, 생산에 대한 완전한 가시성 확보.'
    - '맞춤화 준비 완료: 제품을 맞춤 색상, 로고, 포장 및 사양으로 브랜드화. 시장에 맞춘 최소 주문 수량.'
    - '품질 보장: ISO 9001 인증 생산과 CE, UKCA, BSCI 준수. 모든 제품은 배송 전에 테스트 완료.'
    - '글로벌 물류: 중국 칭다오에서 FOB, CIF, DDP 옵션으로 배송. 북미 유통을 위한 캘리포니아 몬트클레어 소재 미국 창고.'
    - '마케팅 지원: 제품 카탈로그, 사진 촬영, 기술 문서 및 디지털 자산으로 판매 활동 지원.'
    - '교육 및 지원: 영업팀을 위한 제품 교육, 고객을 위한 기술 지원, 보증 서비스 조정.'
content_process:
  tagline: 파트너가 되는 방법
  title: 간단한 파트너십 절차
  subtitle: 우리의 파트너십 절차는 간단합니다 — Aquafarer 제품을 빠르게 판매할 수 있도록 설계되었습니다.
  items:
    - title: '1단계: 신청서 제출'
      description: 회사 정보, 목표 시장, 관심 있는 제품을 포함하여 파트너 신청서를 작성하세요.
    - title: '2단계: 자격 검토'
      description: 파트너십 팀이 신청서를 검토하고 3영업일 이내에 기회 논의를 위해 연락드립니다.
    - title: '3단계: 계약 및 설정'
      description: 파트너십 계약서에 서명하고 계정을 설정한 후 파트너 가격, 마케팅 자료, 제품 샘플을 받습니다.
    - title: '4단계: 교육 및 시작'
      description: 제품 교육, 판매 지원, 마케팅 자료가 제공됩니다. 판매를 시작할 준비가 완료됩니다.
cta:
  title: Aquafarer 파트너가 될 준비가 되셨나요?
  subtitle: 파트너십을 신청하면 팀이 3영업일 이내에 응답드립니다.
  actions:
    - variant: primary
      text: 파트너십 신청
      href: /contact
    - text: 우리 제품 보기
      href: /products
