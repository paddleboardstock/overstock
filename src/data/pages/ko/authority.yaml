hero:
  tagline: 권위 센터
  title: 왜 Paddle Board Overstock?<br />10년간 쌓아온 신뢰
  subtitle: 저희가 제작하는 모든 보트는 10+년간의 해양 공학, 인증된 품질 시스템, 그리고 전 세계 수천 건의 성공적인 운영 경험을 담고 있습니다. 바로 이것이 업계 전문가들이 Paddle Board Overstock을 선택하는 이유입니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 해양 제조 시설 및 엔지니어링 팀
stats:
  title: Paddle Board Overstock 숫자에 따라
  stats:
    - title: 운영 연수
      amount: 2012년부터
    - title: 연구개발 엔지니어
      amount: 50+
    - title: 서비스 대상 국가
      amount: 50+
    - title: 납품 장비
      amount: 15,000+
features3_brand:
  tagline: 우리가 누구인지
  title: 브랜드의 기초<br />및 유산
  subtitle: Paddle Board Overstock을 신뢰할 수 있는 해양 장비 제조업체로 정의하는 이야기, 전문성, 그리고 글로벌 네트워크.
  isBeforeContent: false
  columns: 3
  items:
    - title: Paddle Board Overstock 소개
      description: 2012년 중국 청도에서 설립. 해안 워크숍에서 12,000 m² 규모의 시설로 확장 — Paddle Board Overstock의 완전한 이야기.
      icon: tabler:building-factory
      link: /about
    - title: 브랜드 스토리
      description: 해양 엔지니어 팀이 전문 등급의 인플레이블 수상 장비를 전 세계적으로 접근 가능하게 만들기 위해 나선 이야기.
      icon: tabler:book
      link: /brand-story
    - title: 해양 산업 전문성
      description: 심도 있는 재료 과학, 정밀 제조, 실제 테스트 — 모든 선체마다 수십 년간의 해양 공학 경험 담김.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: 글로벌 존재
      description: 전 세계 모든 대륙의 50+개국에 서비스 제공. 지역 규정 요구사항과 시장 선호도에 맞춘 전문 역량.
      icon: tabler:globe
      link: /brand-global-presence
    - title: 왜 Paddle Board Overstock
      description: 우리를 차별화하는 요소 — 품질, 맞춤화, 직접 공장 가격, 그리고 상업 운영자를 위한 종합 지원.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: 우리 팀
      description: 리더십 소개 — Paddle Board Overstock를 이끄는 해양 엔지니어, 재료 과학자, 제조 전문가.
      icon: tabler:users
      link: /brand/team
    - title: 엔지니어링 팀
      description: 78+년 합산 R&D 경력, 40+개 플랫폼, 12개 인증, 1200+ OEM 프로젝트. 모든 제품 뒤의 기술 팀.
      icon: tabler:engine
      link: /engineering-team
    - title: 연구개발센터
      description: 선체 엔지니어링, RF 용접, PVC 실험실, 프로토타입 제작, 시험수조, 품질 실험실 — 우리의 전체 연구개발 시설.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: 신뢰와 품질
  title: 인증, 품질<br />& 증거
  subtitle: 독립적인 인증, 철저한 테스트, 그리고 우리의 품질에 대한 헌신을 보여주는 실제 증거.
  isBeforeContent: false
  columns: 3
  items:
    - title: 인증
      description: CE, ISO 9001, UKCA, BSCI, REACH — 글로벌 시장을 위한 전체 인증 문서 및 준수.
      icon: tabler:shield-check
      link: /certifications
    - title: 품질 및 테스트
      description: 모든 제품은 배송 전 압력 테스트를 거칩니다. 솔기 강도, UV 저항, 부력 — 모든 단계에서 검증됩니다.
      icon: tabler:clipboard-check
      link: /quality
    - title: 증거 및 증명
      description: 시험 결과, 배포 사진, 제3자 검사 보고서 및 Paddle Board Overstock 품질을 검증하는 사례 연구.
      icon: tabler:file-check
      link: /evidence
    - title: 지식 그래프
      description: Paddle Board Overstock 엔터티 그래프 탐색 — 연결된 지식 기반에서 제품, 기술, 인증 및 관계
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: 리더십
  title: 팀을 만나보세요<br />Paddle Board Overstock 뒤에
  subtitle: 해양 공학, 재료 과학, 품질 관리 및 글로벌 B2B 무역에 걸친 산업 전문 지식.
  isBeforeContent: false
  columns: 3
  items:
    - title: 토비 류 — 창립자 및 CEO
      description: 해양 제조업에서 15년 경력을 보유. 이전에는 중국의 주요 보트 제조사에서 연구개발(R&D)을 이끌었음. 고무보트 설계 분야에서 여러 특허 보유.
      icon: tabler:crown
    - title: 장웨이 — 수석 엔지니어
      description: PVC/Hypalon 제작과 딥-V 선체 설계 분야에서 20+년 경력. 유럽 해양 공학 회사의 전 기술 이사.
      icon: tabler:engine
    - title: 첸밍 — 연구개발 책임자
      description: 재료 과학 박사. drop-stitch 기술과 고주파 용접을 전문으로 합니다. 섬유 복합재 분야에서 10+년 경력.
      icon: tabler:flask
    - title: 류창 — 제작 감독
      description: 린 제조에서 18+년 경력. 식스 시그마 블랙 벨트. 모든 생산 라인에 ISO 9001 품질 시스템을 구현함.
      icon: tabler:settings
    - title: 왕팡 — 품질 관리자
      description: 해양 품질 관리 분야에서 12+년 경력. 인증된 CE 및 ISO 감사자. 모든 생산 배치에 대한 테스트를 감독합니다.
      icon: tabler:shield-check
    - title: 헬렌 리 — 영업 이사
      description: 국제 B2B 무역에서 15+년 경력. 30+개국에서 OEM/ODM 파트너십 관리. 4개 국어에 능통.
      icon: tabler:briefcase
cta:
  title: 저희 자격 증명을 확인해 보시겠습니까?
  subtitle: 인증 사본, 제3자 검사 보고서를 요청하거나 공장 방문을 예약하려면 저희에게 연락하십시오.
  actions:
    - variant: primary
      text: 자격 증명 요청
      href: /contact
    - text: 인증 세부 정보 보기
      href: /certifications
