hero_text:
  tagline: 자원
  title: 다운로드 센터 및 구매자 가이드
  subtitle: 제품 카탈로그, OEM 가이드, 구매자 체크리스트 및 기술 문서를 확인하여 정보에 기반한 구매 결정을 내리세요.
features3_downloads:
  tagline: 다운로드
  title: 제품 문서<br />및 구매자 자료
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 해양 제품 카탈로그
      description: RIB 보트, 고무보트, SUP 보드, 카약 및 액세서리를 포함한 전체 제품군. 사양, 구성 및 옵션. PDF 형식.
      icon: tabler:file-text
    - title: OEM 제조 가이드
      description: 'OEM/ODM 파트너십에 대해 알아야 할 모든 것: 프로세스 개요, 최소 주문 수량, 맞춤화 옵션, 품질 관리 및 배송.'
      icon: tabler:building-factory
    - title: RIB 보트 구매자 가이드
      description: '올바른 RIB 선택 방법: 선체 재료, 튜브 재료, 엔진 선택, 크기 고려 사항, 다양한 응용에 맞는 구성 옵션.'
      icon: tabler:file-description
    - title: SUP 공급업체 체크리스트
      description: 'SUP 보드 제조업체 선택 시 주요 고려 사항: 품질 지표, 인증 요구 사항, MOQ 고려 사항, 공장 감사 시 확인할 사항.'
      icon: tabler:clipboard-check
    - title: 고무보트 재료 가이드
      description: 'PVC 대 Hypalon: 내구성, UV 저항, 수명, 수리 옵션 및 다양한 해양 용도에서의 비용 고려 사항 비교.'
      icon: tabler:files
    - title: 맞춤형 제조 브리프 템플릿
      description: 제품 브리프 템플릿을 다운로드하세요. 요구 사항을 작성하여 보내주시면 같은 주 내 견적 및 타당성 평가를 제공합니다.
      icon: tabler:template
faqs:
  title: 자주 묻는 질문
  subtitle: 당사 제품, 제조 프로세스 및 파트너십 모델에 대한 일반 질문.
  columns: 2
  items:
    - title: 최소 주문 수량은 얼마입니까?
      description: MOQ는 제품 카테고리에 따라 다릅니다. RIB 보트는 일반적으로 모델당 10대부터 시작합니다. SUP 보드는 50대부터 시작합니다. 제품별 MOQ 정보는 영업팀에 문의하세요.
      icon: tabler:help-circle
    - title: 주문 전에 샘플을 받을 수 있습니까?
      description: 예. Aquafarer는 대량 생산 전에 평가용 샘플 제작을 제공합니다. 샘플 비용은 협상 가능하며, 첫 생산 주문에 차감됩니다.
      icon: tabler:package
    - title: 어떤 결제 조건이 제공됩니까?
      description: 표준 조건은 주문 시 30% 보증금, 선적 전 70%입니다. 적격 고객의 경우 LC 조건 가능. 재무팀에 문의하여 협의하세요.
      icon: tabler:currency-dollar
    - title: 생산 기간은 얼마나 걸립니까?
      description: '일반 리드 타임: RIB 보트 30-45일, SUP 보드 20-30일, 고무보트 25-35일. 맞춤 개발 시 프로토타입 제작은 추가로 15-30일 필요합니다.'
      icon: tabler:calendar-clock
    - title: 제품은 어떤 인증을 받았습니까?
      description: EU 시장용 CE 인증, 미국 해안경비대 승인 제조, ISO 품질 시스템, BSCI 준수 및 REACH 재료 준수.
      icon: tabler:certificate
    - title: 맞춤 포장 및 브랜딩을 제공하나요?
      description: 예. 저희는 귀사의 로고, 색상 및 브랜드 아이덴티티가 포함된 맞춤 포장을 제공합니다. 맞춤 포장 비용은 제품 카테고리에 따라 다릅니다.
      icon: tabler:color-swatch
cta:
  title: 적합한 리소스를 찾는 데 도움이 필요하신가요?
  subtitle: 제품 선택, OEM 파트너십 또는 기술 사양에 대한 개인 맞춤 안내를 원하시면 저희 팀에 문의하세요.
  actions:
    - variant: primary
      text: 우리 팀에 연락하기
      href: /contact
