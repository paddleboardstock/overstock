  tagline: 사례 연구
  title: 진짜 프로젝트, 진짜 결과<br />— Aquafarer 행동 중
  subtitle: Aquafarer 전 세계 유통업체, 브랜드, 운영자들과 협력하여 모든 애플리케이션에 맞춤형 해양 솔루션을 제공하는 방법을 확인해 보세요.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
