features3_cases:
  tagline: 주요 사건들
  title: 맞춤형 솔루션<br />진짜 도전을 위해
  isBeforeContent: false
  columns: 3
  items:
    - title: 발리 다이빙 센터 일상 운영 업그레이드
      customer: 블루 오션 다이빙 센터
      country: 인도네시아
      industry: 상업 다이빙 센터
      challenge: 발리의 블루 오션 다이빙 센터는 제한된 데크 공간, 다이버 탑승이 어렵고 열대 염수 조건에서 유지보수가 많은 구형 유리섬유 다이빙 보트를 운영했습니다. 장비 적재는 붐비고 준비 기간이 길었으며, 불안정한 플랫폼은 첫 다이빙자와 노인 여행자를 포함한 국제 관광객들의 안전 문제를 야기했습니다. 센터는 연중 200일 동안 하루 3-5회의 다이빙 여행을 운영+합니다.
      solution: 스 Aquafarer RIB 쿠버 장비 보관에 최적화된 확장 데크 레이아웃, 넓은 스테인리스 스틸 다이빙 사다리, 염 Hypalon UV 분 저항 및 염분 방지 튜브, 미끄럼 방지 데크 표면, 탱크 저장 솔루션을 갖춘 맞춤형 6.8m 프로페셔널 다이빙을 제공했습니다. 구성은 표준 레크리에이션 보트 배치가 아닌 다이빙 센터의 일상 작업 흐름에 맞춰 설계되었습니다.
      product: 6.8m 프로 다이빙 RIB
      results: 더 넓은 작업 공간은 장비 준비 효율성을 향상시켰습니다. 잠수부들은 더 안전하고 쉬운 탑승을 경험했습니다. 유지보수 요구사항이 크게 줄었습니다. 센터는 성수기에도 더 많은 고객을 더 자신 있게 처리할 수 있는 용량을 확보했습니다. 이것이 RIB 일상 다이빙 운영의 기반이 되었습니다.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: 우리 다이빙 보트는 단순한 교통수단이 아닙니다. 일상 운영의 기초입니다. 매일Aquafarer RIB 여러 번 다이빙 트립을 수행할 때 팀에게 더 큰 자신감을 줍니다.
      icon: tabler:lifebuoy
    - title: 푸켓 다이브 센터 프로페셔널 RIB 업그레이드
      customer: 오션 익스플로러 다이빙 센터
      country: 태국
      industry: 상업 다이빙 센터
      challenge: 태국 푸켓에 위치한 오션 익스플로러 다이빙 센터는 증가하는 고객 수요를 따라가지 못한 전통적인 유리섬유 다이빙 보트에서 업그레이드해야 했습니다. 제한된 갑판 공간으로 인해 장비 준비가 비효율적이었습니다. 어려운 승선은 국제 관광객에게 안전 문제를 야기했습니다. 열대 염수 조건에서의 높은 유지보수 요구는 운영 비용을 증가시켰습니다. 센터는 연 200일 동안 여러 차례 매일 운항합니다+.
      solution: 스 Aquafarer RIB 쿠버 탱크 저장, 장비 준비, 다이버 이동을 위해 최적화된 작업 데크 레이아웃을 갖춘 맞춤형 6.8m 상업용 다이빙을 제공했습니다. 특징으로는 스테인리스 스틸 손잡이가 있는 넓은 다이빙 사다리, 내구성 소재가 적용된 중장비 튜브 구조UV, 미끄럼 방지 바닥재, 탱크 저장 솔루션, 전문 콘솔, 승객 좌석 등이 포함되었으며, 모두 상업용 다이빙 작업에 맞게 구성되었습니다.
      product: 6.8m 상업 다이빙 RIB
      results: 더 넓은 데크 면적은 장비 정리 속도와 일상 업무 흐름을 가속화했습니다. 고객 탑승 편의성과 안전성이 크게 향상되었습니다. 해양급 구조로 유지보수 중단 시간이 줄었습니다. 다이빙 센터는 성수기 동안 더 많은 고객을 지원하고 전문 다이빙 서비스를 자신 있게 확장할 수 있습니다.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: 다이빙 센터에서 보트는 단순한 교통수단이 아닙니다. 일상 운영의 중요한 부분입니다. 팀이 매일Aquafarer RIB 여러 번 다이빙 투어를 더 안전하고 효율적으로 운영할 수 있다는 자신감을 줍니다.
      icon: tabler:lifebuoy
    - title: 유럽 다이빙 센터 함대
      customer: 블루메드 다이빙 센터
      country: 그리스
      industry: 다이빙 및 해양 관광
      challenge: 여러 RIBs 그리스 섬에 걸쳐 다이빙 센터 체인을 위해 12척의 다이빙 시스템이 필요했다. 각 보트에는 맞춤형 다이브 사다리, 8개의 탱크를 수용할 수 있는 탱크 저장 공간, 그리고 개방 수역 다이버 진입을 위한 안정적인 플랫폼이 필요했다. 관광 시즌 시작을 위해 함대는 60일 이내에 도착해야 했다.
      solution: RIB 통합 탱크 랙, 다이브 사다리, 보딩 안정성을 위한 초폭 튜브를 갖춘 520 다이브 모델 12대를 생산 Hypalon 했습니다. 각 보트는 고객 함대 도색으로 브랜드화되었습니다. 12척 모두 압력 테스트를 거쳐 칭다오에서 55일 이내에 출하되었습니다.
      product: RIB 520 다이브
      results: 12척 모두 관광 시즌에 맞춰 제때 인도되었습니다. 선단은 18개월간 매일 운항+ 중이며 재료 고장은 전혀 없었습니다. 고객은 2년 차에 6척을 추가로 주문했습니다.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 다이브는 저희 일상 다이빙 작업의 중추 역할을 해왔습니다. 휴식 시 안정성이 뛰어나며, 탱크 저장 구조는 손님들이 데크를 깨끗하고 안전하게 유지합니다.
      icon: tabler:lifebuoy
    - title: 호주 유통업체 OEM 프로그램
      customer: 퍼시픽 워터스포츠 Pty Ltd
      country: 호주
      industry: OEM/ODM 제조업
      challenge: 호주 유통업체는 SUP 중국 직등 브랜드와 경쟁하기 위해 경쟁력 있는 가격의 프라이빗 라벨 보드 라인을 필요로 했습니다. 초급부터 고급 단계까지 아우르는 8가지 독특한 모델이 필요했으며, 맞춤형 그래픽, 맞춤 포장, 소매점으로의 드롭시핑 이행이 필요했습니다.
      solution: 호주 SUP 전용 그래픽 패키지로 8가지 모델(올어라운드, 투어링, 요가, 키즈, 스포츠, 울트라 컴팩트, 울트라 스테이블, 화이트워터)을 개발했습니다. QR 코드가 설치된 영상으로 연결되는 맞춤형 소매 포장. 칭다오에서 호주 소매점으로 직접 구성된 드롭쉽 물류.
      product: 커스텀 SUP 라인 (8 모델)
      results: 개념부터 첫 출하까지 90일 만에 완료. 첫 시즌에 소매 판매율 85%. 유통업체는 2년 차에 고무식 보트 라인을 포함하도록 파트너십을 확장했습니다.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer SUP 초기 디자인부터 소매 매장까지 90일 만에 완전한 라인을 완성했습니다. 품질은 두 배 가격대에 판매되는 브랜드와 견줄 만합니다.
      icon: tabler:arrows-exchange
    - title: 중동 구조 보트 공급
      customer: 국가 민방위 당국
      country: 아랍 에미리트 연합국
      industry: 수색 및 구조
      challenge: 민방위 조직은 RIBs 해안 수색 및 구조, 항만 보안, 홍수 대응을 위해 순찰 준비 가능한 20척을 필요로 했습니다. 자동 탈출 갑판, 완전한 항법 장비(GPS, 레이더, VHF), 고가시성 주황 튜브, 현지 해상 규정 준수가 필요했습니다.
      solution: RIB 20척의 450 패트롤 모델을 제공했으며, 셀프 베이링 데크, 가민 내비게이션 스위트, LED 탐조등, SOLAS 반사 테이프, 고가시성 오렌지 튜브가 장착되었습니다 Hypalon . 각 보트는 CE6185 기준에 따라 인증되고 시험되었습니다 ISO . 문서 패키지에는 지역 등록을 위한 준수 증명서가 포함되어 있었습니다.
      product: RIB 450 순찰
      results: 함대는 5개 해안 기지에 배치되었습니다. 보트들은 극한의 더위(45°C)에서도 +튜브 열화 없이 운항 중입니다. 순찰 거리와 연료 효율이 규격을 12% 초과했습니다.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450 패트롤은 우리의 작전 요구사항을 초과했습니다. 극심한 더위 조건에서도 Hypalon UV 튜브는 24개월 동안 매일 사용해도 열화 징후가 없습니다.
      icon: tabler:alert-triangle
    - title: 유럽 OEM 브랜드 파트너십
      customer: 노스 씨 마린 이큅먼트 BV
      country: 네덜란드
      industry: OEM/ODM 제조업
      challenge: 기존 유럽 해양 브랜드는 RIB 제조 시설에 투자하지 않고 시장 진출을 원했습니다. 5개의 RIB 모델(39m에서 6.2m)을 생산할 수 있는 화이트라벨 파트너가 필요했으며, 개인 브랜드, CE 인증, 독점 EU 유통권을 갖추었습니다.
      solution: 5개 모델에 대해 화이트라벨 제조 계약을 체결했습니다 RIB . 각 모델마다 고객 로고와 색상 조합이 브랜드화되었습니다.CE 각 모델에 대한 인증 문서가 준비되었습니다. 최소 주문 약속 하에 독점 EU 유통권이 부여되었습니다. 지역 서비스 네트워크를 위한 기술 문서 및 예비 부품 카탈로그가 제공됩니다.
      product: 커스텀 RIB 라인 (5 모델)
      results: 다년 계약 체결. 50대의 첫 생산 생산이 75일 이내에 출하됨. 브랜드는 METSTRADE에서 긍정적인 딜러 반응을 얻으며 출시되었다.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: 이 덕분에 Aquafarer RIB 공장을 직접 짓지 않고도 시장에 진입할 수 있었고, CE 인증과 딜러 지원 문서가 포함된 완전한 턴키 솔루션을 제공했습니다.
      icon: tabler:building
    - title: 카리브해 리조트 함대
      customer: 파라다이스 아일랜드 리조트 주식회사
      country: 바하마
      industry: 해양 관광 및 환대
      challenge: '럭셔리 리조트는 손님 활동을 위한 완전한 수상 스포츠 장비 함대가 필요했습니다: 가이드 투어용 보드 40대 SUP , 석호 탐험용 카약 20대, 손님 이동 및 낚시 여행용 10척의 고무보트, 그리고 액세서리가 필요했습니다. 모든 장비는 맞춤형 리조트 브랜드가 필요했고, 관광 성수기 전에 배송되어야 했습니다.'
      solution: '완전한 수상 스포츠 패키지를 생산했습니다: 40대의 SUP 보이저 보드(올어라운드 모델), 20대의 익스플로러 카약, 10대의 AirDeck 360도 팽창식 보트, 그리고 PFD, 노, 펌프, 수리 키트. 모든 장비는 리조트 로고와 열대 색상 조합으로 인쇄되었습니다. 컨테이너 배송으로 전체 재고 명세서가 포함되어 있습니다.'
      product: 풀 워터 스포츠 패키지 (70+단위)
      results: 선단은 성수기 6주 전에 도착했습니다. 수상 스포츠 활동의 고객 만족도 점수는 전년 대비 40% 상승했습니다. 장비는 3시즌 동안 정기 점검만 수행했습니다.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: 완전한 패키지 방식 덕분에 보드, 카약, 보트, 액세서리 등 모든 브랜드가 붙어 손님이 사용할 수 있도록 한 번에 필요한 모든 것을 받았습니다. 손님들은 장비 품질을 매우 좋아합니다.
      icon: tabler:beach
    - title: 퀸즐랜드 상업 다이빙 센터 RIB 업그레이드
      customer: 상업 다이빙 센터
      country: 호주
      industry: 상업 잠수 및 해양 서비스
      challenge: 퀸즐랜드에 기반을 둔 상업 다이빙 센터가 해양 인프라 점검, 항만 유지보수, 수중 수리 프로젝트를 전문으로 하고 노후한 작업정을 운영하고 있었습니다. 프로젝트 수요가 증가함에 따라 노후 선박은 부담이 되었습니다 — 잦은 유지보수로 일정이 차질을 초래했고, 배치는 현대식 잠수 작업에 적합하지 않으며(실린더, 도구, 장비 공간이 제한됨), 장시간 운항 시 승무원의 편의가 좋지 않았습니다. 회사는 매일 근무 중일 전문 작업을 지원할 수 있는 선박이 필요했습니다.
      solution: Aquafarer 고객 다이빙 워크플로우, 일반적인 프로젝트 기간, 승무원 규모, 장비 요구사항에 대한 상세한 운영 분석을 수행했습니다. 이 분석을 바탕으로 장비 Aquafarer RIB 준비와 다이버 이동에 최적화된 기능적인 데크 레이아웃, 장기 운송 시간을 위한 전문 좌석, 안전한 출입을 위한 향상된 안정성, 그리고 설계에 통합된 다이빙 지원 기능을 갖춘 맞춤형 전문가 모델을 제공했습니다.
      product: 맞춤형 프로 다이빙 RIB
      results: 새로운 선박 RIB 은 신뢰할 수 있는 일상 작업 플랫폼이 되었다. 최적화된 배치로 장비 준비가 빨라졌다. 승무원들은 장시간 운항 시 편안함과 안전성이 향상되었다고 보고했다. 보트의 전문적인 외관은 항만 운영자 및 해양 계약업체와 협력할 때 고객의 신뢰를 강화했다. 다이빙 센터는 그들의 서비스에 걸맞은 전문성을 갖춘 선박을 갖게 되었다.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: 우리는 단순한 운송 수단이 아니라 매일 우리 비즈니스를 지원할 수 있는 보트가 필요했습니다. Aquafarer는 우리의 운영 요구 사항을 이해하기 위해 협력했고, 상업 다이빙 작업 흐름에 맞는 RIB 솔루션을 제공했습니다.
      icon: tabler:lifebuoy
    - title: 미국 해안 순찰 계약
      customer: 대서양 해안 보안 기관
      country: 미국
      industry: 해양 보안 및 법 집행
      challenge: 미국 해안 보안 기관은 개방수역 요격 작전을 위한 중장비 순찰 RIBs이 필요했습니다. 중복성을 위해 트윈 엔진 구성, 승무원 보호를 위한 장갑 콘솔, 군사 사양 전자 장비(암호화 통신, FLIR, 레이더), 그리고 미국 해안경비대 규정 준수가 요구되었습니다.
      solution: 트윈 115 HP 외부 엔진 구성을 갖춘 RIB 600 순찰선, 탄도 보호 장갑 콘솔, FLIR 열화상, 암호화된 VHF/UHF 통신 및 통합 무기 장착 지점을 설계했습니다. 선체는 고속 요격 기동을 위해 강화되었으며, 모든 전자 장비는 공장에서 통합 및 테스트되었습니다. USCG 준수 문서가 제공되었습니다.
      product: RIB 600 순찰선 (트윈 엔진)
      results: 보트는 인수 시험에서 최대 52노트 속도를 달성했습니다. 기관은 첫 12개월 동안 95%의 임무 준비율을 보고했습니다. 추가 8대 주문이 이루어졌습니다.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: 트윈 엔진 RIB 600은 우리 승무원에게 개방수역 요격 작전에 필요한 속도와 중복성을 제공합니다. 장갑 콘솔은 성능을 저해하지 않으면서 중요한 보호 기능을 제공합니다.
      icon: tabler:shield
