hero:
  tagline: 품질 관리
  title: 품질 관리 시스템<br />OEM 마린 제조용
  subtitle: 입고 자재, 공정 중 생산, 압력 테스트, 최종 조립 및 출하 전 검증을 포함한 다단계 검사 프로세스. 모든 배치는 추적 가능하며, 모든 테스트는 기록됩니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
    alt: Paddle Board Overstock 품질 관리 및 압력 테스트 과정
stats:
  title: 숫자로 보는 품질 관리
  stats:
    - title: 단위 압력 테스트 완료
      amount: 100%
    - title: 최대 압력 강하
      amount: <5%
    - title: 품질 검사관
      amount: '12'
    - title: 기록 보관
      amount: 10년
content_system:
  tagline: 품질 관리 시스템 개요
  title: 통합 품질<br />통제 프레임워크
  subtitle: 우리의 QC 시스템은 생산과 독립적으로 운영되며, 경영진에게 직접 보고합니다. 품질 연구소의 서명된 품질 승인 없이는 어떤 배치도 출하되지 않습니다.
  items:
    - title: 독립 품질 연구소
      description: 우리 품질 실험실은 생산과 별도의 기능으로 운영됩니다. 품질 관리 검사관들은 생산 부서장이 아닌 품질 관리자에게 보고합니다. 이러한 조직적 독립성은 품질 결정이 객관적으로 이루어지도록 보장하며, 생산 마감일이 품질 요구 사항을 우선하지 않도록 합니다.
      features:
        - 생산 부서와 독립적으로 경영진에게 직접 보고
        - 품질 문제로 생산 중단 권한이 있음
        - 모든 단계에 걸쳐 12명의 전담 QC 검사원
        - 모든 시험 장비는 매년 교정됩니다
    - title: 배치 추적성
      description: 우리 ERP 시스템에서는 원자재의 각 배치에 고유한 로트 번호가 지정됩니다. 원자재 도착부터 생산 완료 제품에 이르기까지, 각 보트의 자재 명세서는 원래 공급업체 배치와 연결됩니다. 이를 통해 품질 또는 규제 문의에 대한 완전한 상류 추적이 가능합니다.
      features:
        - 재료에서 완제품까지 ERP 기반 로트 추적
        - 각 작업 지시에 대한 물리적 배치 태그
        - 100% 재료 커버리지 — PVC, Hypalon, 하드웨어, 접착제
        - 10년간 보관된 기록 (CE 2013/53/EU 요구사항)
    - title: 기준 및 준수
      description: 우리의 QC 절차는 국제 표준에 부합합니다. 제품은 EU 레크리에이션 크래프트 지침 2013/53/EU에 따라 CE 인증을 받았습니다. 당사의 품질 관리 시스템은 ISO 9001 인증을 받았습니다. 사회적 준수는 BSCI 인증을 통해 유지됩니다.
      features:
        - CE 인증 (EU 2013/53/EU)
        - ISO 9001:2015 품질 경영
        - BSCI 사회적 준수 인증
        - REACH 및 RoHS 소재 준수
        - UKCA 브렉시트 이후 인증
content_inspection:
  tagline: 검사 단계
  title: 6단계<br />검사 프로세스
  subtitle: 모든 제품은 문서화된 QC 체크포인트가 포함된 6단계 검사를 거칩니다. 결함은 조기에 발견되고, 시정 조치는 즉시 이루어지며, 모든 배치는 완전히 추적 가능합니다.
  stages:
    - stage: '1'
      title: 입고 자재 검사
      description: 모든 입고 자재는 배치/로트 번호별로 기록되고 QC 승인 전까지 격리됩니다. PVC/Hypalon 원단 롤은 인장 강도(ASTM D751), 인열 강도(ISO 4674), 두께를 시험합니다. Drop-stitch 코어, 밸브, 접착제 및 하드웨어는 육안으로 검사하고 사양에 맞게 측정합니다.
      checks: 인장 강도 ASTM D751, 인열 강도 ISO 4674, 두께 게이지, 접착제 점도, 육안 결함 검사
      threshold: 100%의 배치 검사. 인장 강도가 사양의 90% 미만이거나, 인열 강도가 사양 최소치 미만이거나, 시각적 결함이 있으면 거부
    - stage: '2'
      title: 공정 중 QC — 절단 및 준비
      description: CNC-절단 패널은 20번째 패널마다 CAD 원본 파일과 치수 검사를 합니다. 모서리 품질은 올 풀림, 불균일한 절단, 치수 편차를 검사합니다. 각 생산 배치의 패널 수는 자재가 용접으로 이동하기 전에 BOM과 대조 확인됩니다.
      checks: CAD DXF 파일에 대한 치수 검사, 모서리 품질 검사, 패널 수 검증
      threshold: 허용 오차 ±0.5mm. 허용 오차 초과 시 배치 폐기
    - stage: '3'
      title: 공정 중 QC — 용접 및 접착
      description: 생산 중 용접 품질은 지속적으로 모니터링됩니다. 샘플 50개마다 박리 테스트(ASTM D751)를 수행합니다. 용접 너비는 사양과 비교하여 측정합니다. 핫에어 온도 기록은 일관성 검토를 위해 참조됩니다. 모든 솔기는 백라이트 하에서 채널링 또는 공극을 육안으로 검사합니다.
      checks: 50개 단위마다 박리 테스트 ASTM D751, 용접 너비 측정, 핫에어 온도 기록 검토, 백라이트 솔기 검사
      threshold: 박리 강도 최소 8 N/cm. 용접 너비 허용 오차 ±1mm. 육안으로 채널링 확인 시 배제
    - stage: '4'
      title: 조립 QC
      description: 각 유닛은 팀 리더가 승인한 100포인트 조립 체크리스트를 따릅니다. 밸브 기능은 10회 개폐 사이클로 테스트합니다. 하드웨어 토크를 검증합니다. 육안 검사는 표면 마감, 색상 일관성, 라벨 배치 및 액세서리 완전성을 확인합니다.
      checks: 유닛당 100포인트 체크리스트, 밸브 기능 테스트, 하드웨어 토크 검증, 육안 검사
      threshold: '안전 관련 핵심 부품(밸브, D-링, 손잡이)에 대한 무결점 정책. 경미한 외관: AQL 2.5 (ISO 2859)'
    - stage: '5'
      title: 압력 시험
      description: 모든 챔버는 정격 압력의 1.25배로 팽창시키고 24-48시간 유지합니다. 압력 센서는 유지 기간 내내 지속적으로 기록합니다. 온도 보정된 측정값을 통해 정확성을 확보합니다. 5% 이상 압력 감소가 발생한 챔버는 폐기되고 솔기 재검사를 위해 보내지며 해당 생산 배치는 100% 재검사를 실시합니다.
      checks: 24-48시간 압력 유지 기록, 일일 센서 교정 확인, 온도 보정 측정값, 수리 후 솔기 재검사
      threshold: 안정된 온도에서 24시간 동안 최대 5% 압력 감소. 초과 시 배치 전체 100% 재검사
    - stage: '6'
      title: 최종 검사 및 출하 승인
      description: 포장 전 최종 육안 및 기능 검사. 표면 결함, 색상 일관성, 라벨/BIN 확인, 포장 완전성 및 액세서리 완전성을 고객 주문과 대조합니다. 유닛은 진공 포장 후 상자에 담아 팔레트에 적재됩니다. 제품이 공장을 떠나기 전에 최종 QC 승인이 필요합니다.
      checks: 전체 시각 검사, SKU에 따른 액세서리 체크리스트, 포장 낙하 시험(1m 임의 샘플), 라벨/바코드 스캔 검증
      threshold: AQL 2.5개의 주요 결함, AQL 4.0개의 경미한 결함. 안전 결함은 무관용. 100%의 제품을 육안 검사함
content_equipment:
  tagline: 테스트 장비
  title: QC 실험실<br />장비
  subtitle: 저희 품질 연구소는 재료 검증, 용접 완전성, 제품 성능 검증을 위한 전문 시험 장비를 갖추고 있습니다.
  columns: 3
  items:
    - title: 인장 시험기
      description: ASTM D751에 따라 원단의 인장 강도와 신장을 측정합니다. 모든 PVC, Hypalon, drop-stitch 원단 배치의 입고 QC에 사용됩니다.
      icon: tabler:scale
    - title: 온도 챔버
      description: UV 내성 시험(ASTM G154) 및 저온 유연성 시험을 위한 환경 챔버. 극한 작동 조건을 시뮬레이션합니다.
      icon: tabler:temperature
    - title: 압력 센서 및 로거
      description: 24-48시간 공기 유지 테스트를 위한 연속 데이터 기록이 가능한 디지털 압력 센서. 정확성을 위해 온도 보정됨.
      icon: tabler:wind
    - title: 박리 시험 장치
      description: 용접 이음강도 검증을 위한 보정된 박리 시험 장비. 모든 생산 배치에서 무작위 샘플.
      icon: tabler:files
    - title: 누수 탐지 탱크
      description: 팽창된 챔버의 잠수 누수 테스트용 물탱크. 이음새 및 밸브 무결성 확인을 위한 시각적 기포 감지.
      icon: tabler:ripple
    - title: 검사 도구
      description: 교정된 측정 도구 — 두께 게이지, 토크 렌치, 치수 캘리퍼스, 생산 품질 관리 스테이션용 경도 테스트기.
      icon: tabler:tools
content_metrics:
  tagline: QC 성과
  title: 품질 관리<br />측정 기준
  subtitle: 우리 생산 라인의 실제 합격/불합격 데이터입니다. 이러한 지표는 매일 모니터링되며 경영진에 의해 매월 검토됩니다.
  columns: 3
  items:
    - title: 100% 단위 테스트 완료
      description: 모든 보트의 모든 챔버는 배송 전에 압력 테스트를 거칩니다. 샘플링 없이 — 압력 완전성을 100% 검사합니다.
      icon: tabler:check
    - title: <5% 압력 강하
      description: 정격 압력의 1.25배에서 24-48시간 동안 허용 가능한 최대 압력 손실. 이 기준을 초과하는 챔버는 배치 재검사를 유발합니다.
      icon: tabler:gauge
    - title: AQL 2.5
      description: ISO 2859 샘플링 기준에 따른 주요 결함 허용 품질 수준. 안전에 중요한 결함은 무관용.
      icon: tabler:clipboard-check
    - title: 24-48시간 보류
      description: '압력 유지 시간은 제품 카테고리에 따라 다릅니다. RIB 챔버: 48시간. SUP 및 고무보트: 24-48시간.'
      icon: tabler:clock
    - title: 1.25× 시험 압력
      description: 모든 챔버의 안전 여유 — 최대 운전 조건을 초과하는 여유를 보장하기 위해 정격 압력의 25% 이상에서 테스트됨.
      icon: tabler:arrow-up
    - title: 안전 결함 0%
      description: 안전 관련 결함에 대한 무관용 정책 — 밸브, D-링, 솔기 및 부력 챔버. 결함 발생 시 100% 재검사.
      icon: tabler:shield
cta:
  title: 품질 문서 요청
  subtitle: 테스트 보고서, 재료 인증서 및 적합성 선언서를 포함한 전체 품질 문서 패키지를 모든 배송에 제공합니다. 샘플 문의는 연락 바랍니다.
  actions:
    - variant: primary
      text: QC 문서 요청
      href: /contact
    - text: 테스트 프로토콜 보기
      href: /quality
