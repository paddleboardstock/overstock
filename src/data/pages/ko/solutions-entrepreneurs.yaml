hero:
  tagline: 수상 브랜드 기업가
  title: 자신만의 수상 스포츠 브랜드 시작하기<br />Aquafarer OEM/ODM와 함께
  subtitle: 아마존 판매자, 야외 인플루언서, 지역 유통업체, 처음 브랜드를 시작하는 사람들을 위한 턴키(private label) 제조 — 제품 디자인부터 첫 번째 배송까지.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer 공장 — 수상 스포츠 브랜드를 위한 프라이빗 라벨 제조
direct_answer: Aquafarer를 사용하면 자신만의 수상 스포츠 브랜드를 쉽게 시작할 수 있습니다. 저희 프라이빗 라벨 프로그램은 제품 선택, 맞춤 금형 디자인, 로고 인쇄, 포장, 고객 배송까지 모든 것을 처리합니다. MOQs 단위당 2–5개, SUP는 5–10개, 리드 타임은 30–45일로, 처음 브랜드를 시작하는 기업가는 일반적으로 아이디어에서 첫 번째 배송까지 60–90일이 소요됩니다. 50+개의 검증된 인플레이션 SUP, 카약, RIB, 액세서리 디자인 중에서 선택하거나, 자체 엔지니어링 팀과 함께 완전히 맞춤형 제품을 개발할 수 있습니다.
solution_offerings:
  - title: 스타터 브랜드 런치
    subtitle: 시장 테스트를 하는 처음 기업가를 위한 솔루션
    badge: Popular
    features:
      - title: 제품 선택
        description: 공장 직송 가격으로 50+개의 검증된 인플레이션 수상 보트 디자인 중 선택
      - title: 맞춤 브랜딩
        description: 보드 로고 인쇄, 맞춤 색상 매칭, 브랜드 포장
      - title: 낮은 MOQ
        description: RIB SKU당 단 2–5개 ( SUP는 5–10개)부터 시작 — 확장 전 시장 테스트 가능
      - title: 규격 준수 준비 완료
        description: 64 CE 인증 모델 — 글로벌 판매 걱정 없이 가능
      - title: 물류 지원
        description: 청도(FOB) 또는 CIF 목적지 항구까지 배송
    cta_text: 내 브랜드 런치
    cta_href: /contact
  - title: 프리미엄 브랜드 런치
    subtitle: 맞춤형 디자인과 포장을 필요로 하는 전문 브랜드용
    badge: Premium
    features:
      - title: 맞춤 제품 디자인
        description: 맞춤 금형 개발, 형태 최적화, 성능 튜닝
      - title: 전체 패키지 디자인
        description: 소매용 포장, 행택, 사용 설명서, 언박싱 경험
      - title: 디지털 자산
        description: 전문 제품 사진, 라이프스타일 이미지, 영상 콘텐츠
      - title: 품질 보증
        description: 타사 검사, 공장 감사 보고서, 생산 샘플
      - title: 확장 가능한 생산
        description: 초기 200개에서 10,000개로, 일관된 품질과 가격 유지
    cta_text: 브랜드 구축
    cta_href: /contact
benefits:
  - icon: rocket
    title: 빠른 출시
    description: 컨셉에서 첫 출하까지 60–90일
  - icon: shield
    title: 품질 보장
    description: CE, ISO 9001, BSCI 인증 제조, 완전 추적 가능
  - icon: palette
    title: 완전 맞춤화
    description: 제품과 포장의 모든 측면을 브랜드에 맞게 커스터마이즈 가능
  - icon: globe
    title: 글로벌 배송
    description: 전 세계 어디든 경쟁력 있는 운송료로 물류 처리
trust_bar:
  items:
    - amount: 50+
      label: 선택 가능한 검증된 기본 디자인
    - amount: 60–90
      label: 컨셉에서 첫 출하까지 걸리는 일수
    - amount: 2–5 / 5–10
      label: 최소 주문 단위 SKU (RIB / SUP)
    - amount: CE + ISO
      label: 글로벌 시장 인증
testimonial:
  content: 저는 전혀 업계 경험 없이 SUP 브랜드를 런칭했습니다. Aquafarer 팀이 제품 선택에서 커스텀 로고 디자인과 포장까지 안내해 주었습니다. 첫 컨테이너는 11주 만에 도착했고, 3개월 만에 아마존에서 완판했습니다. 이제 세 번째 컨테이너를 주문 중입니다.
  name: 마이클 박
  title: 설립자, 쇼어라인 패들 컴퍼니 — 캘리포니아, 미국
content_segments:
  tagline: 기업가 프로필
  title: 수상 스포츠 브랜드 런칭<br />기업가 유형별
  subtitle: 각 창업자는 서로 다른 강점을 가지고 옵니다 — 전자상거래 전문성, 업계 연결, 콘텐츠 도달 범위, 또는 유통 인프라. 우리는 OEM/ODM 런칭 프로그램을 시작 위치와 성장 목표에 맞게 맞춤 제공합니다.
  items:
    - title: 아마존 FBA & 전자상거래 판매자
      subtitle: 데이터 기반, 빠른 확장 브랜드 빌더
      description: 아마존, 월마트 또는 자체 Shopify 스토어에서 수상 스포츠 제품을 출시하는 경험 있는 온라인 판매자. 목록 최적화, PPC 관리, 카테고리 데이터 읽기는 가능하지만, 전자상거래 속도, 반품율, 계절적 수요 변동을 이해하는 제조 파트너가 필요합니다.
      features:
        - FBA 치수 제한에 최적화된 소매용 패키징
        - EAN/UPC 바코드 생성 및 아마존 준수 문서
        - 규모 확대 전 수요 테스트를 위한 낮은 MOQ (2–5개 per RIB SKU, 5–10 per SUP)
        - 단가 최적화를 위한 혼합 컨테이너 통합
    - title: 피트니스 & 야외 라이프스타일 인플루언서
      subtitle: 청중 우선 브랜드 크리에이터
      description: 콘텐츠 크리에이터, 피트니스 코치, 아웃도어 인플루언서 등 생활 방식 브랜드에 투자할 준비가 되어 있는 참여도 높은 청중을 가진 분들. 여러분은 커뮤니티와 브랜드 스토리를 가져오고, 우리는 제품 설계, 규제 준수, 포장 및 물류를 처리하여 콘텐츠 제작과 전환에 집중할 수 있게 합니다.
      features:
        - '빠른 맞춤 브랜드 제작: 로고 + 색상을 포함한 2주 샘플 주기'
        - 공동 브랜드 한정판 및 시즌별 컬러 출시
        - 라이프스타일 사진 및 영상 콘텐츠 제작 지원
        - '직접 소비자 배송: 공장 → 고객 직배송'
    - title: 지역 유통업체 직접 판매
      subtitle: B2B 운영자가 자신의 브랜드 출시
      description: 기존 해양 또는 아웃도어 장비 유통업체 중 제3자 제품 판매 대신 또는 함께 자체 브랜드를 출시하려는 분들. 이미 창고 인프라, 물류 관계, 고객 기반을 보유하고 있으며, 대규모로 프라이빗 라벨 품질을 제공할 수 있는 공장 파트너가 필요합니다.
      features:
        - 귀하의 시장 지역을 위한 독점 제품 디자인
        - 독자적 형상 및 사양을 위한 전체 OEM 금형 개발
        - 귀하 지역의 현지화된 규제 준수 문서 (CE, UKCA, USCG)
        - '공동 브랜드 포장: 유통업체 브랜드 + Aquafarer 품질 표시'
    - title: 신규 브랜드 창립자
      subtitle: 끝까지 안내되는 브랜드 생성
      description: 워터 스포츠 산업 경험이 전혀 없는 열정적인 기업가들이 처음부터 브랜드를 구축하려는 경우. 제품 선택 및 명명부터 포장 디자인과 첫 컨테이너 물류까지 모든 단계에서 명확한 일정과 투명한 가격으로 지원할 파트너가 필요합니다.
      features:
        - 50+개의 검증된 기본 디자인에서 컨설팅 제품 선택
        - '브랜드 아이덴티티 패키지: 이름, 로고, 색상 팔레트, 포장 디자인'
        - 컨셉에서 첫 출하까지 60–90일 소요
        - 신규 브랜드 창립자를 위한 전담 프로젝트 매니저
cta:
  title: 브랜드 출시 준비 완료?
  subtitle: 여러분의 비전을 알려주세요 — 48시간 이내에 제품 및 포장 제안을 만들어 드립니다.
  actions:
    - variant: primary
      text: 브랜드 시작하기
      href: /contact
    - text: OEM 역량 보기
      href: /oem-odm-manufacturer
    - text: 비즈니스 패키지 보기
      href: /business-packages
