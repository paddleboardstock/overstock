hero:
  tagline: 수상 스포츠 유통업체 및 도매
  title: 도매 파트너십<br />수상 스포츠 유통업체를 위해
  subtitle: Aquafarer 유통 파트너가 되세요. 전체 제품 카탈로그, 독점 도매 가격, 드롭-쉽 지원, 전담 계정 관리에 접근할 수 있습니다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 공장 및 도매 유통
direct_answer: Aquafarer는 전 세계 수상 스포츠 유통업체를 위한 종합 도매 파트너십을 제공합니다. 파트너는 전체 제품 카탈로그의 도매 가격, 전담 계정 관리, 마케팅 자료 및 물류 지원을 받을 수 있습니다. 당사는 드롭-쉽 기능, 프라이빗 라벨링, 그리고 비즈니스 모델에 맞춘 유연한 최소 주문 수량을 제공합니다.
solution_offerings:
  - title: 배급사 시작 패키지
    subtitle: 신규 파트너십 및 지역 유통업체용
    badge: Popular
    features:
      - title: 전체 카탈로그 접근
        description: 모든 SUP 보드, 카약, RIBs, 액세서리에 대한 도매 가격
      - title: 전담 계정 관리자
        description: 주문, 지원 및 제품 정보를 위한 단일 연락 창구
      - title: 마케팅 자료
        description: 제품 사진, 사양서, 브로셔 및 디지털 자료 제공 (귀하의 언어로)
      - title: 물류 지원
        description: 배송 조정, 통관 서류, 창고 배송
      - title: 샘플 프로그램
        description: 쇼룸 전시 및 딜러 시연을 위한 할인 샘플 주문
    cta_text: 파트너십 신청
    cta_href: /contact
  - title: 배급사 프리미엄 패키지
    subtitle: 다국가 커버리지를 가진 기존 유통업체용
    badge: Best Value
    features:
      - title: 단계별 가격
        description: 분기별 리베이트 프로그램이 적용되는 볼륨 기반 가격 단계
      - title: 독점 영토
        description: 귀하의 지역 또는 국가를 위한 보호된 유통권
      - title: 드롭-쉽 프로그램
        description: 귀하의 브랜딩으로 창고에서 고객에게 직접 배송
      - title: 프라이빗 라벨링
        description: 자사 브랜드를 위한 전체 OEM/ODM 지원 — 보드, 보트 및 액세서리
      - title: 우선 지원
        description: 48시간 대응 보장, 전담 물류 코디네이터, 그리고 신속 주문
    cta_text: 업그레이드 파트너십
    cta_href: /contact
  - title: 마스터 배급사
    subtitle: 대규모 지역 및 전국 유통업체를 위한
    badge: Enterprise
    features:
      - title: 전략적 파트너십
        description: 공동 사업 계획, 시장 개발 기금, 공동 마케팅 프로그램
      - title: 맞춤형 제품 개발
        description: 시장을 위한 독점 제품 디자인과 사양
      - title: 지역 창고 지원
        description: 재고 위탁, 지역 예비 부품 재고, 지역 서비스 센터 설립
      - title: 딜러 네트워크 지원
        description: 교육 프로그램, 자격증 과정, 딜러 위치 확인기 통합
      - title: 연례 파트너 서밋
        description: 전략 회의, 제품 미리보기, 글로벌 파트너와의 네트워크 구축
    cta_text: 마스터 파트너십 탐색
    cta_href: /contact
benefits:
  - title: 직접 제조사 접근
    description: 중개인은 없습니다. 모든 제품을 설계, 엔지니어링, 생산하는 공장과 직접 일하게 됩니다.
    icon: tabler:building-factory
  - title: 경쟁 마진
    description: 도매 가격과 대량 할인, 리베이트 프로그램, 보호 구역 등이 포함됩니다.
    icon: tabler:coin
  - title: 마케팅 지원
    description: 전문 제품 자산, 지역화된 브로셔, 그리고 공동 브랜드 마케팅 캠페인.
    icon: tabler:chart-bar
  - title: 물류 파트너십
    description: 배송, 세관 지원, 지역 창고 옵션을 조율하여 물류 비용을 절감하세요.
    icon: tabler:truck-delivery
content_segments:
  tagline: 파트너 프로필
  title: 유통 파트너십 모델<br />파트너 유형별
  subtitle: 각 유통업체는 지역 인프라, 전자상거래 도달 범위, 전문 소매, 다중 브랜드 포트폴리오 등 시장 진출 강점을 각기 다르게 제공합니다. 우리는 각 파트너 프로필에 맞춘 파트너십 조건, 가격 등급, 지원 수준을 구조화합니다.
  items:
    - title: 지역 해양 유통업체
      subtitle: 영토 전용 B2B 배포
      description: 지정된 지리적 영역 내에서 해양 딜러, 수상 스포츠 소매업체, 렌탈 운영자를 대상으로 창고 인프라, 딜러 네트워크, 물류 역량을 갖춘 기존 유통업체입니다. 완전한 제품 라인, 보호된 가격, 그리고 현지 재고와 지원으로 딜러 계정을 서비스할 수 있는 능력이 필요합니다.
      features:
        - 최소 약정 조건으로 독점 지역 보호
        - 분기별 판매량 리베이트가 포함된 전체 카탈로그 도매 가격
        - 빠르게 판매되는 SKU를 위한 현지 재고 위탁 프로그램
        - 딜러 네트워크 교육 및 공동 브랜드 마케팅 프로그램
    - title: 전자상거래 및 온라인 소매업체
      subtitle: 디지털 우선 유통 채널
      description: Amazon, eBay 또는 자체 전자상거래 플랫폼을 통해 수상 스포츠 장비를 판매하는 온라인 소매업체. 시장 출시 속도, 경쟁력 있는 가격, 소비자 직배송 물류가 중요합니다. 빠른 이행과 재고 위험 없이 귀사의 브랜드로 개별 주문을 배송할 수 있는 파트너가 필요합니다.
      features:
        - '드롭-쉽 프로그램: 귀사 브랜드로 공장 직접 이행'
        - 귀사의 전자상거래 플랫폼용 실시간 재고 API 피드
        - EAN/UPC 지원이 포함된 Amazon Seller Central 통합
        - 반품 물류 및 보증 청구 처리 포함
    - title: 전문 수상 스포츠 소매업체
      subtitle: 오프라인 전시 파트너
      description: 지역 패들러, 낚시인, 보트 이용자를 대상으로 수상 스포츠 장비를 전문으로 판매하는 오프라인 소매점 — 현장 판매, 시연, 애프터서비스 제공. 소매용 최적화 포장, 시연 장치 프로그램, 방문 고객을 구매로 유도할 수 있는 판매 시점 자료가 필요합니다.
      features:
        - '시연 장치 프로그램: 할인된 전시장 디스플레이 보드'
        - 선반 최적화 박스 디자인의 소매용 포장
        - 판매 시점 디스플레이, 비교 차트, 구매자 가이드
        - 매장 직원 교육 및 인증 프로그램
    - title: 멀티 브랜드 및 백화점 유통업체
      subtitle: 광범위 스포츠 용품 유통
      description: 백화점, 대형 소매점, 스포츠 용품 체인에 멀티 브랜드 카탈로그를 제공하는 대규모 유통업체. 일관성, 준수 문서, 공급업체 준수가 가장 중요 — 모든 SKU는 소매업체별 포장, 라벨링 및 품질 기준을 충족해야 합니다.
      features:
        - '소매업체 준수 문서: 포장 사양, 바코드, 라벨링'
        - 주요 소매업체 주문 시스템용 EDI/ASN 통합
        - 공급업체 관리 재고 및 자동 보충 프로그램
        - 24시간 응답 SLA가 포함된 전담 계정 관리
cta:
  title: 유통 파트너 되기
  subtitle: Aquafarer 파트너 네트워크 가입 신청. 신청서는 48시간 이내에 검토됩니다.
  actions:
    - variant: primary
      text: 지금 신청
      href: /contact
    - text: 파트너 브로셔 다운로드
      href: /resources
