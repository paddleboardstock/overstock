hero:
  tagline: 에 대한
  title: '{SITE} 정보'
  subtitle: 원자재부터 완제품 보트까지 수직 통합된 수상 스포츠 제조업체
intro:
  - 'Aquafarer은 2012년에 단 하나의 사명을 가지고 설립되었습니다: 수상에서의 성능만큼 품질 보고서에서도 우수한 수상 스포츠 장비를 설계하고 제조하는 것. SUP 보드 워크숍으로 시작된 것은 현재 칭다오 경제개발구에 위치한 12,000제곱미터 규모의 통합 제조 시설로 성장하여, 고객이 있는 50+개국을 위해 고무보트, RIBs, 카약, SUP 보드, 안전 장비 및 액세서리를 생산하고 있습니다.'
  - 오늘날, Aquafarer은 공장 브랜드로 운영되고 있습니다 — 우리는 설계, 엔지니어링, 프로토타입 제작, 제조 및 테스트를 모두 한 지붕 아래에서 수행합니다. 이러한 수직 통합은 재료 선택, 제작 품질, 납기일에 대한 직접적인 통제를 가능하게 합니다. 모든 보트는 우리 직원들이, 우리 장비로, 우리 기준에 맞춰 제작합니다.
  - 우리는 전 세계의 레크리에이션 사용자, 상업 운영자, 정부 기관 및 브랜드 파트너들에게 서비스를 제공합니다. 우리의 OEM 및 ODM 프로그램은 기업이 공장 인프라에 투자하지 않고 자신만의 제품 라인을 출시할 수 있도록 돕습니다. 단일 프로토타입이 필요하든 전체 생산이 필요하든, 우리 팀은 컨셉부터 실사용 가능 배송까지 안내합니다.
