factory_details:
  - label: 시설 규모
    value: 칭다오 경제개발구에 위치한 12,000 m²(130,000 ft²) 통합 캠퍼스
  - label: 연간 생산 능력
    value: SUPs, 카약, 소형보트, RIBs, 안전 장비를 포함하여 15,000척의 보트
  - label: R&D 팀
    value: 제품 설계, 소재 공학 및 품질 공학 분야에서 25+명의 엔지니어
  - label: 핵심 장비
    value: CNC 절단 테이블, RF 유전체 용접기, 열풍 실링기, 디지털 프린터, 유리섬유 몰드, 공기 유지 테스트 장치
  - label: 생산 라인
    value: '6개 전용 라인: PVC 절단, 튜브 용접, 유리섬유 선체 적층, SUP 조립, RIB 조립, 최종 QC'
  - label: 연간 수출량
    value: 미국 달러 8백만  50+개국으로 유럽, 아메리카, 아시아 태평양 및 중동 지역 수출
factory_section:
  tagline: 공장 프로필
  title: 제조 및 수출 역량
values_section:
  tagline: 미션 및 가치
  title: 우리를 움직이는 원동력
services_section:
  tagline: 서비스
  title: OEM, ODM 및 프라이빗 라벨
  subtitle: 모든 규모의 비즈니스를 위한 유연한 제조 파트너십.
certifications_section:
  tagline: 인증
  title: CE & ISO 인증 제조
  subtitle: 우리의 64개 CE 인증 모델은 국제 안전 및 품질 기준을 충족합니다.
values:
  - title: 품질 우선
    desc: 우리 공장을 떠나는 모든 보트는 배송 전에 필수 공기 유지, 솔기 박리, 시스템 테스트를 통과합니다.
  - title: 수직 통합
    desc: PVC 절단에서 최종 조립까지 모든 단계를 통제하여 계약업체 비효율을 제거하고 일관된 품질을 보장합니다.
  - title: 안전성 기본
    desc: CE 인증은 우리가 만드는 것의 핵심입니다. 우리의 64개 CE 인증 모델은 레크리에이션 및 상업용 EU 안전 기준을 충족합니다.
  - title: 파트너 중심
    desc: OEM, ODM 및 프라이빗 라벨 파트너들과 투명성, 신뢰성 및 공유 성장을 통해 장기적인 관계를 구축합니다.
services:
  - title: OEM 제조
    desc: 귀하의 사양에 맞게 제작합니다. 도면을 공유하면, 우리의 엔지니어링 팀이 프로토타입, 금형 및 생산을 처리합니다.
  - title: ODM 솔루션
    desc: 검증된 플랫폼 디자인에서 시작하십시오. 크기, 색상, 그래픽 및 포장을 맞춤 설정하여 고유한 제품 라인을 만드세요.
  - title: 프라이빗 라벨
    desc: 귀하의 브랜드 이름, 로고, 포장. 제품이 유통 준비 상태로 도착하며 완벽한 브랜드 통합을 제공합니다.
  - title: 맞춤 브랜딩
    desc: 갑판 패드 인쇄, 선체 그래픽, 튜브 데칼, 맞춤 라벨 — 모든 표면에서 일관된 브랜드 존재감.
certifications:
  - name: CE 인증
    desc: 우리의 보트와 수상 기기는 EU 레크리에이션 크래프트 지침(2013/53/EU) 및 관련 조화 기준을 준수합니다.
    scope: 보트 및 수상 기기
  - name: null
    desc: 팽창식 수상 기기의 설계, 제조 및 유통을 위한 품질 관리 시스템 인증.
    scope: 전체 시설
  - name: null
    desc: 팽창 보트 — 강화 및 강체 선체 팽창 보트에 대한 안전 및 성능 요구 사항.
    scope: RIB & 팽창 라인
cta:
  title: 제조 과정을 보고 싶으신가요?
  desc: 모든 제조 작업장 및 품질 관리 프로세스를 자세히 살펴보려면 공장 페이지를 방문하세요.
  link: /factory
  label: 공장 → 탐험
