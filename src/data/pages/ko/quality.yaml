testimonial:
  quote: Paddle Board Overstock가 제공하는 품질 테스트 문서화 및 추적 가능성 수준은 우리가 중국 제조업체에서 본 것을 능가합니다. 각 출하에는 기준 참조와 합격/불합격 데이터가 포함된 전체 테스트 보고서가 포함됩니다.
  author: 마커스 한센
  title: 조달 관리자
  company: 노르딕 마린 서플라이
  location: 스웨덴
