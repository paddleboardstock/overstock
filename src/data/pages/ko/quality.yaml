commitment:
  title: 우리의 약속
  body: 이러한 엄격한 테스트 절차를 통해 {SITE}는 고객에게 고성능일 뿐만 아니라 내구성도 뛰어나다는 확신을 제공하여 수많은 SUPs 즐겁고 안전한 수상 모험을 보장합니다. 품질 연구소는 생산과 독립적으로 운영되며 경영진에게 직접 보고합니다.
  cta: 테스트 문서 요청
  cta_link: /contact
