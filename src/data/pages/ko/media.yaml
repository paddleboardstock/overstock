    title: 제품 이미지
    desc: 웹, 인쇄물 및 소매용 고해상도 제품 사진.
    items:
      - SUP 보드 갤러리
      - RIB 보트 갤러리
      - 인플레이션 카약 갤러리
      - 액세서리 및 안전 장비
  - id: logo-brand-kit
    title: 로고 및 브랜드 키트
    desc: 공식 Paddle Board Overstock 로고 파일, 색상 팔레트, 타이포그래피 및 브랜드 가이드라인.
    items:
      - 기본 로고 (PNG/SVG/EPS)
      - 아이콘 마크
      - 색상 팔레트
      - 타이포그래피 사양
      - 브랜드 가이드라인 PDF
  - id: catalogs
    title: PDF 카탈로그
    desc: 제품 카탈로그, 사양서 및 기술 문서 다운로드.
    items:
      - name: SUP 보드 카탈로그 2027
        url: /catalogs/paddleboardoverstock-sup-catalog.pdf
  - id: videos
    title: 비디오
    desc: 제품 데모, 공장 투어, 브랜드 필름 및 고객 후기.
    items:
      - 제품 데모
      - 공장견학
      - 브랜드 영화
      - 고객 이야기
      - 사용 방법 안내서
