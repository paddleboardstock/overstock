content_challenge:
  tagline: 도전 과제
  title: 양식 요구 사항<br />염수에 강한 장비
  subtitle: 어류 양식장, 진주 양식장, 해양 목장은 가장 화학적으로 공격적인 해양 환경에서 운영 — 장기간 염수 노출, 연료 및 사료 잔류물, 지속적인 일상 사용.
  paragraphs:
    - 양식 작업은 연중 365일 노출된 해안 및 원양 환경에서 진행됩니다. 케이지 점검, 사료 운송, 진주 줄 유지 관리 및 장비 서비스에 사용되는 작업 보트는 지속적인 염수 침수, UV 노출, 연료, 어류 사료 및 부착 방지 처리제와의 화학적 접촉에 직면합니다.
    - '**부식이 주적입니다** — 일반 해양 장비는 이러한 조건에서 빠르게 손상됩니다. 외부 모터, 트레일러 프레임, 선체 장치는 지속적으로 교체가 필요합니다. 운영자는 수년간 이 환경에서도 손상되지 않고 사용할 수 있는 부식 방지 재료로 만든 보트를 필요로 합니다.'
    - '**일일 신뢰성이 중요합니다** — 작업용 보트가 고장 나면 사료 공급 일정이 지연되고, 수확이 늦어지며, 생산 손실이 발생합니다. 진주 양식장에서는 점검을 하루라도 놓치면 상당한 작물 피해가 발생할 수 있습니다. 어류 양식장에서는 사료 공급 지연이 성장률과 수익성에 영향을 미칩니다.'
    - Paddle Board Overstock 양식용 RIBs 보트는 부식 방지 하드웨어, 대형 Hypalon 튜브, 양식, 진주 양식, 해양 목장 운영의 까다로운 조건에 맞게 설계된 보강 선체로 제작됩니다.
content_solution:
  tagline: 우리의 해결책
  title: 목적 맞춤형 RIBs<br />양식 산업을 위한
  subtitle: 모든 Paddle Board Overstock 양식용 작업용 보트는 공격적인 염수 환경에서도 견딜 수 있도록 설계되었으며 일상적인 신뢰할 수 있는 성능을 제공합니다.
  list:
    - 해양 등급 Hypalon 튜브 — UV, 염수, 연료, 어류 사료 화학물질에 대한 우수한 저항성
    - 전체 316 스테인리스 스틸 하드웨어 — 장기간 염수 노출에도 녹 없음
    - 반복적인 도크 및 케이지 접촉을 위한 보강 고무 스트레이크 및 키 가드
    - 사료 운송 및 수확 작업 후 세척 및 배수를 용이하게 하는 자배수 덱
    - 사료 봉투, 수확통, 장비 운반을 위한 평평한 데크 구성
    - 15에서 60까지의 외부 구성 HP HP — 탑재량과 연료 효율에 최적화됨
    - 넓은 농장에서 쉽게 식별할 수 있는 고가시성 튜브 색상 옵션
content_segments:
  tagline: 양식 프로필
  title: 워크보트 솔루션<br />양식 유형별
  subtitle: 양식장마다 작업선 요구사항이 다릅니다 — 어장 검사용 소형 민첩성 RIBs 부터 진주 양식을 위한 안정적인 운송 플랫폼, 해양 목장을 위한 중장비 작업선까지 다양합니다.
  items:
    - title: 양식업
      subtitle: 케이지 점검, 사료 운송, 수확 지원
      description: 해양 어류 양식장은 노출된 해안 및 해상 지역에 케이지를 운영합니다. 작업선은 매일 케이지 그물 점검, 먹이 작업, 어획 지원, 장비 유지보수에 사용됩니다. 주요 문제는 부식으로, 선박은 지속적으로 염수, 어류 사료 잔류물, 연료에 노출됩니다. 신뢰할 수 있는 작업선은 필수적인데, 먹이 놓치거나 어획 지연이 생산 생산과 수익성에 직접적인 영향을 미치기 때문입니다.
      features:
        - '공격적 환경 패키지: 316개의 스테인리스 스틸 하드웨어, 해양 등급 합금 부품'
        - 사료 가방과 수확통 운송을 위한 평평한 데크 배치
        - 작업 후 쉽게 세척할 수 있는 셀프 베이링 데크가 있습니다
        - Hypalon 공급 및 연료 노출을 위한 화학물질 내성 코팅이 있는 튜브
        - 케이지와 부두가 자주 접촉할 수 있도록 강화된 마찰 스트레이크가 적용되었습니다
    - title: 진주 양식 운영
      subtitle: 진주선 점검 및 채취를 위한 안정적인 운송
      description: 진주 양식장에서는 진주선 간 일상 운송, 굴 그물 검사, 수확 수집을 위해 안정적이고 신뢰할 수 있는 작업선이 필요합니다. 이러한 작업은 유지보수 인프라가 제한된 외딴 해안 지역에서 운영됩니다. 선박은 승무원이 진주줄 점검 시 작업할 수 있을 만큼 안정적이어야 하며, 쉽게 승선하고 수확한 굴, 그물, 보급품을 운반할 수 있는 충분한 갑판 공간이 있어야 합니다. 신뢰성과 간편한 유지보수는 외딴 농장 지역에서 매우 중요합니다.
      features:
        - 진주선 점검 시 상주 승무원을 위한 안정적인 선체 설계
        - 승무원의 안전한 이동을 위한 미끄럼 방지 표면의 평평한 갑판
        - 굴 그물과 수확 접근이 용이하도록 낮은 프리보드
        - 현장 정비를 쉽게 할 수 있는 간단한 외부 구성입니다
        - 지속적인 염수 노출을 위한 부식 방지 튜브 및 하드웨어 패키지
    - title: 해양 목장 및 해양 강화
      subtitle: 청소년 수송, 케이지 서비스, 모니터링 지원
      description: 해양 목장 운영은 어린 어린 개체를 관리된 해양 환경에 방류하고, 성장 모니터링하며, 개선 구조물을 점검하는 것을 포함합니다. 작업선은 살아있는 어린 개체를 에어링 컨테이너에 운송하고, 모니터링 장비를 탑재하며, 얕은 해안 방류장에 접근해야 합니다. 선체 설계는 해변과 하구 접근을 위한 얕은 흘수와 적재 용량의 균형을 맞춰야 합니다.
      features:
        - 에어레이드 청소년 이송 컨테이너 및 모니터링 장비를 위한 데크 공간
        - 해변과 하구 방류지 접근을 위한 얕은 흘수
        - 쉬운 해변 상륙 — 강화된 용골과 선수 보호
        - 전자 장치 모니터링 및 샘플링 장비를 위한 장비 장착 지점
        - 혼합 모래 및 해수 조건에서 내구성을 위한 중장비 Hypalon 튜브
