hero:
  tagline: 해양 전문 지식
  title: 수십 년의 해양 공학<br />모든 선체 안에
  subtitle: Paddle Board Overstock는 물질 과학, 정밀 제조, 실제 테스트를 결합하여 중요한 순간에 성능을 발휘하는 수상 기구를 생산합니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 해양 엔지니어링 및 연구개발 팀 작업 중
expertise_materials:
  tagline: 재료과학
  title: 올바른 재료 선택하기<br />모든 애플리케이션용
  subtitle: 우리는 세 가지 핵심 재료를 사용하며 — 각각 특정 용도와 성능 요구 사항에 맞게 선택됩니다.
  columns: 3
  items:
    - title: 해양 등급 PVC
      description: 1100 데니어 PVC 원단 — 우리의 가장 다재다능한 소재입니다. UV-강화, 마모 저항성, 그리고 REACH 준수. 무게와 비용 효율이 중요한 레크리에이션 보트, SUP 보드, 카약에 이상적입니다.
      icon: tabler:droplet
    - title: 프리미엄 Hypalon/CSM
      description: 우수한 화학적 저항성과 UV 안정성. Hypalon 보트는 적절한 관리 시 15-20년 동안 지속될 수 있습니다. 장기적인 내구성이 중요한 상업용, 구조용 및 군사용에 권장됩니다.
      icon: tabler:shield
    - title: 유리섬유 및 알루미늄
      description: 깊은 V형 유리섬유 선체는 RIBs와 순찰선용 — 거친 조건에서 파도를 가르는 성능. 최대 강도와 적재 용량이 필요한 중장비 상업용 작업선에는 알루미늄 선체.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: 제조 능력
  title: 정밀 제조<br />매 단계마다
  subtitle: 저희 12,000 m² 규모의 시설에는 생산의 모든 단계에 필요한 전문 기계가 갖추어져 있습니다.
  columns: 2
  items:
    - title: CNC 절단
      description: 컴퓨터 제어 절단은 최소한의 낭비로 정확하고 반복 가능한 원단 패널을 보장합니다. 모든 조각이 설계대로 정확히 맞습니다.
      icon: tabler:cpu
    - title: 고주파 용접
      description: 산업용 HF 용접은 모재보다 더 강한 이음새를 만듭니다. 일정한 온도와 압력 제어는 모든 생산 과정에서 공기 밀폐 밀봉을 보장합니다.
      icon: tabler:bolt
    - title: 드롭 스티치 코어 조립
      description: 수천 개의 폴리에스터 실이 상단과 하단의 원단 층을 연결하여, 단단하고 안정적인 SUP 보드와 바닥을 위해 높은 압력(15-20 PSI)으로 팽창할 수 있게 합니다.
      icon: tabler:building-arch
    - title: 압력 시험
      description: 모든 팽창식 제품은 배송 전에 압력 테스트를 거칩니다. RIB 튜브는 정격 압력의 1.25배로 테스트됩니다 — 그 압력을 견디면 물 위에서도 성능을 발휘할 것입니다.
      icon: tabler:wind
    - title: 솔 강도 테스트
      description: 각 생산 배치에서 무작위로 선택된 샘플은 파괴적 봉합 강도 테스트를 거칩니다. 결과는 기록되며 특정 생산 로트에 추적할 수 있습니다.
      icon: tabler:files
    - title: 수질 검사
      description: 모든 RIB 모델은 인증 전에 해상 시운전을 거칩니다. 해안 조건에서의 실제 테스트는 성능, 조작성, 안정성을 검증합니다.
      icon: tabler:ripple
expertise_design:
  tagline: 디자인 및 엔지니어링
  title: 실제 조건을 위해 설계됨
  subtitle: 우리의 디자인 철학은 보트가 어떻게 사용될지를 먼저 생각한 다음, 그 사용 사례를 중심으로 엔지니어링을 구축하는 것에서 시작합니다.
  items:
    - title: 딥-V 선체 설계
      description: 우리의 유리섬유 선체는 각 모델의 길이와 용도에 최적화된 계산된 데드라이즈 각도를 특징으로 합니다. 거친 파도를 위한 더 가파른 V, 안정성을 위한 더 얕은 V.
    - title: 다중 챔버 안전
      description: 모든 보트에는 3~7개의 독립된 공기실이 있습니다. 하나의 구획이 손상되더라도 나머지 구획이 보트를 부양 상태로 유지하고 작동하게 합니다.
    - title: 인체공학적 배치
      description: 콘솔 위치, 튜브 높이, 좌석 배치는 장기간 사용 시 운전자의 편안함을 중심으로 설계되었습니다 — 순찰, 낚시 또는 이동 중에 상관없이.
    - title: 맞춤 설정
      description: 튜브 색상, 콘솔 구성, 연료 용량, 액세서리 장착 — 각 모델은 특정 운용 요구 사항에 맞게 맞춤 설정할 수 있습니다.
cta:
  title: 특정한 용도가 있나요?
  subtitle: 우리 엔지니어링 팀은 귀하의 프로젝트를 위한 재료 선택, 설계 및 제조에 대해 조언할 수 있습니다.
  actions:
    - variant: primary
      text: 우리 엔지니어에게 물어보세요
      href: /contact
    - text: 제품 범위 보기
      href: /products
