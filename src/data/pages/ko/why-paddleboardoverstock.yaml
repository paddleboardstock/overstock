hero:
  tagline: 왜 Paddle Board Overstock
  title: 다르게 설계됨. 비즈니스를 위해 설계됨.<br />전 세계 워터 어드벤처의 파트너
  subtitle: 단순한 제조업체가 아니라 — 클럽, 리조트, 렌탈 운영자 및 신생 워터 브랜드를 위해 상업용 장비를 설계, 엔지니어링 및 제공하는 비즈니스 파트너입니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 제조 품질 및 전문성
pillars:
  tagline: 파트너십의 세 가지 기둥
  title: 왜 전 세계의 워터 비즈니스가 Paddle Board Overstock를 선택하는가
  subtitle: ''
  columns: 3
  items:
    - title: 상업용으로 설계됨
      description: 당사의 장비는 주말 레크리에이션용이 아닌 매일 렌탈용으로 엔지니어링되었습니다. 상업용 PVC, 강화된 drop-stitch 코어, UV-안정 Hypalon 옵션, 현장 테스트를 거친 하드웨어는 유지보수 비용을 낮추고, 수명을 늘리며, 귀하의 운영 효율을 높입니다.
      icon: tabler:building-factory
      callToAction:
        text: 상업용 제품 라인 보기
        href: /products
    - title: 아이디어에서 시장까지
      description: 워터 스포츠 브랜드를 90일 만에 출시하세요. 우리는 개념 검증, 제품 선택, 프로토타입, 생산, 패키지 디자인, 글로벌 배송까지 모든 과정을 안내합니다. 최소 주문 강요 없이 — 소규모로 시작하고 자신 있게 확장하세요.
      icon: tabler:rocket
      callToAction:
        text: 브랜드 여정을 시작하세요
        href: /oem-odm-blueprint
    - title: 글로벌 환경에 맞게 설계됨
      description: '모든 기후에 최적화된 제품: 유럽용 냉수 PVC 조성, 중동 및 호주용 UV-저항 재료, 동남아시아용 항습 처리. 각 발송물은 목적지 환경에 맞추어 조정됩니다.'
      icon: tabler:world
stats:
  title: 숫자를 믿다
  stats:
    - title: 사업 경력
      amount: 2012년부터
    - title: 건조된 보트
      amount: 15,000+
    - title: 단골 고객
      amount: 85%
    - title: 보증 청구
      amount: <2%
reasons:
  tagline: Paddle Board Overstock의 차이
  title: 우리를 차별화하는 요소
  isBeforeContent: false
  columns: 3
  items:
    - title: 실제 제조, 단순 거래가 아님
      description: 우리는 12,000 m² 규모의 공장을 소유하고 운영합니다. Paddle Board Overstock와 협력하면 중개인 없이 귀하의 제품을 설계, 엔지니어링, 제작하는 사람들과 직접 일하게 됩니다.
      icon: tabler:building-factory
    - title: 엔지니어링 중심 접근
      description: 우리의 설계 과정은 제품 카테고리가 아닌 사용 사례에서 시작됩니다. 상업 환경에서 실제로 장비가 사용되는 방식에 맞추어 선체 모양, 재료 선택 및 구성을 최적화합니다.
      icon: tabler:engine
    - title: 인증된 품질
      description: CE 인증, ISO 품질 시스템, BSCI 준수, REACH 준수, USCG Type III/V 승인 구명조끼; 모든 제품은 적용 가능한 국제 기준을 충족합니다.
      icon: tabler:certificate
    - title: 유연한 OEM/ODM
      description: 튜브 색상, 콘솔 배치, 브랜딩, 포장 — 우리는 귀하의 사양에 맞게 맞춤 제작합니다. 최소 주문 수량에 대한 압박 없음. 프로토타입으로 시작하고 자신 있게 확장하세요.
      icon: tabler:adjustments
    - title: 글로벌 물류
      description: 캘리포니아에 있는 미국 창고, 칭다오에서 직접 배송, 긴급 주문은 항공 운송. 전 세계 통관 서류와 문서 업무를 처리합니다.
      icon: tabler:truck-delivery
    - title: 평생 지원
      description: 우리는 20년 전에 제작한 보트를 지원합니다. 정품 부품, 기술 조언, 수리 안내 — 우리의 팀은 필요할 때 어디에 있든 여러분을 위해 대기하고 있습니다.
      icon: tabler:lifebuoy
testimonials:
  tagline: 전 세계 브랜드가 신뢰하는
  title: 우리 파트너들이 말하는 것
  items:
    - content: 우리는 중국의 여러 제조업체와 협력해 왔지만, Paddle Board Overstock은 그들의 엔지니어링 지원과 일관된 품질로 눈에 띕니다. 그들은 우리의 브랜드를 그들 자신의 브랜드처럼 다룹니다.
      name: — OEM 파트너, 유럽 수상 스포츠 브랜드
    - content: 그들의 Hypalon RIBs는 우리 함대에서 5년 이상 사용되었습니다. 유지보수가 최소화되고, UV 저항성이 뛰어납니다. 튜브에 대한 5년 보증 덕분에 신뢰할 수 있습니다.
      name: — 함대 운영자, 중동 리조트 그룹
    - content: Paddle Board Overstock 팀은 개념부터 생산까지 90일 만에 맞춤형 SUP 보드 설계를 개발하도록 도와주었습니다. 품질이 우리의 기대를 뛰어넘었습니다.
      name: — 유통업체, 호주 수상 스포츠
    - content: 소규모 사업체 소유자로서, 저는 MOQs에 대해 걱정하고 있었습니다. Paddle Board Overstock는 제 예산에 맞춰 일하며 겨우 50개의 보드로 제 브랜드를 출시하도록 도와주었습니다. 지금은 500개를 주문하고 있습니다.
      name: — 브랜드 창립자, 미국 SUP 렌탈 회사
cta:
  title: 물 사업을 시작할 준비가 되셨나요?
  subtitle: 무료 상담을 원하시면 저희 팀에 연락하세요. 아무런 부담 없이 장비와 제조에 대한 솔직한 조언을 드립니다.
  actions:
    - variant: primary
      text: 팀에 문의하기
      href: /contact
    - text: 제품 카탈로그 다운로드
      href: /resources
