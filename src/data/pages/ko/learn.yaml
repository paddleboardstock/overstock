hero:
  tagline: 수자원 탐사 지식
  title: 배우다
  subtitle: |
    가이드, 튜토리얼, 심층 분석 — 탐험하는 데 필요한 모든 것<br />
    자신 있게 물과 함께 하세요. 첫 SUP 선택부터 고급 기술 숙달까지.
  taglineSection: 모든 패들러를 위한 지식. 초보자부터 전문가까지.
featured:
  tagline: 추천 주제
  title: 학습 여정을 시작하세요
  subtitle: 수상 스포츠가 처음이든 실력을 높이고 싶든, 저희 가이드가 도움을 드립니다.
  items:
    - title: SUP 기본
      description: 초보자가 알아야 할 모든 것 — 보드 종류, 패들 크기, 자세, 첫날 팁.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: 팽창식 대 하드보드
      description: 어떤 것이 당신에게 맞을까요? 우리는 휴대성, 성능, 내구성, 비용을 나란히 비교합니다.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: 물 안전
      description: 모든 패들러가 알아야 할 필수 안전 지식 — 날씨, 구명조끼, 자기 구조, 그리고 그 밖의 내용.
      icon: tabler:shield
      href: /learn/water-safety
    - title: 재료 가이드
      description: PVC 대 Hypalon, drop-stitch 기술, 부정 평가 — 당신의 장비가 무엇으로 만들어졌는지 이해하세요.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP 사이즈 가이드
      description: 체중, 기술, 패들링 스타일에 맞는 적절한 보드 길이, 너비, 부피를 찾으세요.
      icon: tabler:ruler
      href: /size-guide
    - title: 중급 기술
      description: 고급 스트로크, 회전 기술, 거친 물 다루기를 통해 패들링 실력을 향상시키세요.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
categories:
  tagline: 카테고리
  title: 주제별로 탐색
  subtitle: 모든 학습 콘텐츠는 숙련도와 관심사별로 정리되어 있습니다.
  columns:
    - title: 초보자
      items:
        - SUP 기초 — 여기서 시작
        - 팽창식 대 하드보드
        - 수상 안전 필수 사항
        - SUP 선택 방법
        - 펌프 및 포장 가이드
    - title: 중급
      items:
        - 노 젓기 기술
        - 인플레이션 기술
        - 재료 참조
        - PVC 대 Hypalon 비교
        - Drop-Stitch 코어 설명
    - title: 고급 및 전문
      items:
        - 함대 운영
        - 상업용 장비
        - 안전 및 구조 프로토콜
        - 맞춤 제작 및 OEM
cta:
  title: 여전히 질문이 있으신가요?
  subtitle: 장비, 안전 및 기술에 대한 맞춤형 답변을 위해 AI 가이드에게 문의하세요.
  actions:
    - variant: primary
      text: 워터 어드바이저 AI에게 문의하기
      href: '#ai-guide'
    - text: 모든 가이드를 둘러보기
      href: /academy
