hero:
  tagline: 기술 도면 및 CAD
  title: RIB 및 고무보트<br />기술 도면 및 CAD 다운로드
  subtitle: 프로젝트 평가 및 사양 작성을 위한 계획 수준의 GA 도면, 치수 시트 및 갑판 배치도. 공개 PDF에서 프로젝트 수준의 STEP 파일까지 적절한 수준의 기술 도면에 접근할 수 있습니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB 보트 기술 도면 및 CAD 다운로드
direct_answer: Paddle Board Overstock는 RIB 보트 및 고무 수상기구에 대한 조달 수준의 기술 도면을 제공합니다 — 일반 배치(GA) PDF, 치수 시트 및 갑판 배치도 포함. 높은 세부 수준의 형식(DXF/DWG, STEP/IGES)은 적격 문의 또는 프로젝트 신청 시 제공됩니다.
stats:
  - value: GA PDF
    label: 무료 다운로드
    detail: 모델별 일반 배치
  - value: DXF/DWG
    label: 라이트 형식 접근
    detail: 계획 수준의 2D CAD
  - value: STEP/IGES
    label: 프로젝트 신청
    detail: 통합을 위한 3D 모델
  - value: NDA 전용
    label: 구조 도면
    detail: 선체 적층, 몰드 데이터
content_tiers:
  tagline: 다운로드 단계
  title: 네 가지 접근 수준<br />— 적절한 단계에 맞는 적절한 세부 정보
  subtitle: 저희는 제조 수준 파일이 아닌 조달 수준의 도면을 제공합니다. 각 단계는 다른 프로젝트 단계에 맞습니다.
  items:
    - title: 1단계 — 공개 PDF
      description: 일반 배치(GA), 4면 치수 도면 및 PDF 형식의 갑판 배치도. 무료로 다운로드 가능. 프로젝트 계획, 공간 배치, 예비 사양 검토에 충분함.
      icon: tabler:file-type-pdf
    - title: 2단계 — 라이트 형식 DXF/DWG
      description: 계획 수준의 레이아웃 통합을 위한 2D CAD 파일(DXF 또는 DWG). 짧은 자격 확인 양식(회사명, 프로젝트 유형, 사용 목적) 필요. 구조 또는 제조 데이터는 포함되지 않음.
      icon: tabler:file-code
    - title: 3단계 — 프로젝트 신청 STEP/IGES
      description: 시스템 통합, 장비 설계 또는 조선 설계 조정을 위한 3D 모델 파일(STEP 또는 IGES). 범위, 일정 및 구매 의도를 포함한 프로젝트 신청 필요. 승인 대상.
      icon: tabler:cube
    - title: 4단계 — NDA 엔지니어링
      description: 선체 구조 도면, 적층 일정, 튜브 절단 확장 및 몰드 데이터. 확정 주문이 있는 NDA에서만 제공. 이는 제조 수준 파일로 공개 배포용이 아님.
      icon: tabler:lock
content_included:
  tagline: 포함된 내용
  title: 그림 내용<br />모델별
  subtitle: 각 모델은 B2B 구매자와 프로젝트 엔지니어를 위한 필수 계획 정보를 포함하는 표준 도면 패키지를 가지고 있습니다.
  items:
    - title: 일반 편열 (GA)
      description: 측면 프로필, 상도 및 단면을 보여주는 선체 형태, 튜브 위치, 콘솔 위치, 좌석, 연료 시스템, 주요 치수(LOA, 빔, 튜브 직경, 데드라이즈 각도). 개정 상태 및 저작권은 제목 표시에 표기되어 있습니다.
      icon: tabler:layout
    - title: 4-뷰 차원 드로잉
      description: 측면, 앞면, 후방, 상단 전경과 전체 치수(트레일러 높이, 컨테이너 빔, 들어 올리기 무게)가 포함되어 있습니다. 운영 및 운송 구성 포함.
      icon: tabler:ruler-2
    - title: 데크 배치 및 장비 계획
      description: 콘솔 베이스, 좌석 위치, D-링 위치, 항법등 위치, 빌지 펌프 접근, 배터리/연료 구획, 장비 장착 지점을 보여주는 탑다운 덱 뷰. 독자적인 인터페이스에 대한 정밀도가 제한적입니다.
      icon: tabler:map
    - title: 운송 및 포장 도면
      description: 물류 계획을 위한 컨테이너 적재 계획, 요람 크기, 무게 분포, 리프팅 포인트 위치. 표준 및 맞춤 포장 옵션 포함.
      icon: tabler:truck
content_protection:
  tagline: IP 보호
  title: 우리가 공유하지 않는 것들<br />& 왜
  subtitle: 엔지니어링 IP를 보호함으로써 구매자가 프로젝트 계획에 필요한 모든 것을 제공하면서도 연구개발에 계속 투자할 수 있습니다.
  items:
    - title: 선체 몰드 코어 데이터
      description: 플러그 앤 몰드 형하학, CNC 공구 경로, 적층 템플릿은 독점 제조 자산입니다. 확정된 계약 외에는 접근 계층에서 공유되지 않습니다 NDA .
      icon: tabler:ban
    - title: 튜브 절단 확장
      description: 튜브 원단용 평면 패턴 절단 파일은 제조 수준 데이터입니다. NDA 확정된 생산 주문 하에서만 제공되며 계약자와만 공유됩니다.
      icon: tabler:ban
    - title: 구조 계산
      description: 상세한 응력 분석, FEA 결과, 라미네이트 일정은 준수 민감 문서로, 적합성 평가 과정에서 공지기관 및 구속 고객에게만 공유됩니다NDA.
      icon: tabler:ban
    - title: 경쟁사 심사
      description: 경쟁사, 프로젝트 맥락이 없는 학생, 정당한 조달 의도가 없는 당사자로부터 온 것으로 보이는 CAD 접근 요청을 거부할 권리를 보유합니다.
      icon: tabler:shield
content_models:
  tagline: 사용 가능한 모델
  title: 기술 도면<br />모델별 이용 가능성
  subtitle: GA PDF 다운로드는 메인 RIB 및 인플레이터블 보트 모델에 대해 제공됩니다. 목록에 없는 특정 모델 도면은 저희에게 문의해 주세요.
  items:
    - title: AF580 RIB
      description: 5.8 mRIB, GRP 딥-V 선체 Hypalon 또는 PVC 튜브, 센터 콘솔. GA, 치수, 갑판 배치, 운송 계획 제공. 설계 등급 C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5.2 m RIB, GRP 중등급 V형 선체, Hypalon 또는 PVC 튜브, 측면 또는 중앙 콘솔. 일반 배치도 및 치수 제공. 설계 카테고리 C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4.3 m RIB, GRP 선체, PVC 튜브, 틸러 또는 콘솔. 일반 배치도 및 치수 제공. 설계 카테고리 C/D.
      icon: tabler:sailboat
    - title: AF380 인플레이션 보트
      description: 3.8 m 인플레이터블 딩기, 알루미늄 바닥, PVC 튜브. 일반 배치도 및 포장 치수 제공. EN ISO 6185 준수.
      icon: tabler:sailboat
    - title: AF320 인플레이션 보트
      description: 3.2 m 인플레이터블 보트, 에어 데크 바닥, PVC 튜브. 일반 배치도 및 포장 치수 제공. EN ISO 6185 준수.
      icon: tabler:sailboat
