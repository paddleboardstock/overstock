content_version_control:
  tagline: 버전 관리
  title: 그림 버전<br />경영진
  subtitle: 모든 도면은 통제된 수정 시스템을 따릅니다. 도면을 프로젝트 계획에 사용하기 전에 항상 현재 수정본을 가지고 있는지 확인하세요.
  items:
    - title: 수정 추적
      description: 각 도면에는 개정 코드(Rev-A, Rev-B, Rev-C), 발행일, 마지막 검토일, 적용 모델/구성, 단위, 파일 크기 및 형식이 포함되어 있습니다. "현재" 개정판만 다운로드할 수 있습니다.
      icon: tabler:git-branch
    - title: 도면 상태 안내
      description: 모든 공개 도면에는 "예비 레이아웃 전용으로, 건설, 인증, 생산 용도가 아님. 치수는 최종 사양 및 주문 확인 조건"으로 표시되어 있습니다. 이는 양측 모두 오용으로부터 보호합니다.
      icon: tabler:alert-circle
    - title: 업데이트 알림
      description: 모델 사양이 변경되면 도면 개정판이 업데이트되고 이전 버전은 "대체됨"으로 표시됩니다. DXF/DWG 팩을 다운로드한 등록 사용자는 이메일로 중요한 업데이트 통보를 받습니다.
      icon: tabler:bell
faq:
  title: 기술 도면 — 자주 묻는 질문
  questions:
    - q: GA PDF가 정말 무료인가요?
      a: 네. 주요 모델에 대한 일반 배치 PDF는 무료로 제공됩니다 — 아래 간단한 자격 심사 양식을 작성하시면 다운로드 링크가 영업일 이내에 이메일로 전달됩니다. 이 PDF에는 프로젝트 평가, 공간 배분, 예비 사양 검토에 충분한 계획 수준의 정보가 포함되어 있습니다.
    - q: DXF/DWG 파일에 어떻게 접근하나요?
      a: 다운로드 페이지의 회사 이름, 프로젝트 유형, 사용 목적을 기재한 간단한 자격증명서를 작성하세요. 승인된 요청은 1영업일 이내에 이메일로 다운로드 링크를 받습니다.
    - q: STEP/IGES 3D 모델을 받을 수 있나요?
      a: STEP 또는 IGES 3D 모델 파일은 프로젝트 신청 절차를 통해 제공됩니다. 프로젝트 범위, 통합 요구사항, 일정, 구매 의도를 제공하세요. 승인 조건으로 — 보통 3-5영업일 이내에 완료됩니다.
    - q: 왜 더 세밀한 파일 접근을 제한하나요?
      a: 선체 형상, 금형 데이터, 구조 계산은 수년간의 연구개발 투자를 나타내며, 핵심 제조 IP입니다. 우리는 조달 계획과 프로젝트 통합에 필요한 모든 것을 제공하며, 신제품 개발에 대한 투자를 계속할 수 있는 능력을 보호합니다.
    - q: 도면에 제조 세부 사항이 포함되어 있나요?
      a: 아니요. 공개 및 경량 도면은 계획 및 명세를 위한 조달 수준의 정보를 포함합니다. 제조 수준의 세부 사항(적층 일정, 공구 경로, 절단 확장)은 NDA 확인된 주문과 함께 하에서만 공유됩니다.
    - q: 맞춤형이나 세미 커스텀 구성용 도면이 있나요 RIB ?
      a: 맞춤형 프로젝트 도면은 개발 과정의 일부로 작성됩니다 OEMODM . 맞춤 프로젝트를 평가 중이라면 요구사항을 문의해 주 RIB 시면 제안서에 프로젝트 특화된 GA 도면을 제공해 드립니다.
