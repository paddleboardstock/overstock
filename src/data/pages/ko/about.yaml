hero:
  tagline: 회사 소개
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock 공장과 작업장
  title: |
    해양공학,<br />
    지었다<span class="text-accent dark:text-white">Paddle Board Overstock</span>길
  subtitle: '우리는 한 척의 배와 고집스러운 믿음을 가지고 해안 작업장에서 시작했습니다: 해양 제품은 중요하니까 중요하게 설계되어야 한다는 믿음입니다. 오늘날 우리는 50개국 이상으로 배송하지만, 모든 선체는 여전히 회사를 시작한 동일한 사람들의 손을 거칩니다.'
stats:
  title: 숫자로 보면
  columns: 4
  stats:
    - title: 선체 배송 완료
      amount: 2,400+
    - title: 나라들이 배송했다
      amount: 50+
    - title: 수년간의 합산 경험
      amount: '60'
    - title: 평균 보증 응답 시간(시간)
      amount: '24'
features3_what_we_build:
  title: 우리가 만드는 것
  subtitle: 우리가 속속들이 아는 집중된 제품 라인 — 미완성 실험도, 배지 엔지니어링도 없습니다.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB 보트
      description: 알루미늄 선체 RIBs 3.3m에서 7.5m까지. 순찰, 다이빙, 낚시 및 가족용으로 설계됨.
      icon: tabler:ship
    - title: 고무 보트
      description: PVC와 Hypalon 인플레이션 보트, 2.4m에서 4.2m까지. 가볍고, 튼튼하며, 보관이 용이합니다.
      icon: tabler:speedboat
    - title: 슈퍼요트 텐더
      description: 컴팩트하고 고사양의 RIBs 맞춤 제작으로 모선의 외관과 일치하도록 설계되었습니다.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: 액세서리
      description: 노, 펌프, 덮개, 방수 가방, 연료 탱크 및 전자 장치. 모두 우리 보트에 맞춰져 있습니다.
      icon: tabler:package
    - title: 개조 및 수리
      description: 사내 튜브 교체, 전자 장치 개조 및 엔진 업그레이드.
      icon: tabler:tool
    - title: 맞춤 제작
      description: 상업, 과학 및 군사 고객을 위한 프로젝트별 설계.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: 보트 설계 및 공학 토론
steps2_values:
  title: 우리의 가치
  subtitle: 첫날부터 모든 제품을 형성해온 세 가지 원칙.
  items:
    - title: 마치 가족을 지탱하는 것처럼 지어라
      description: 모든 선체, 용접, 패스너는 마치 우리 가족이 사용할 것처럼 다뤄집니다.
      icon: tabler:heart
    - title: 판매 전에 엔지니어링
      description: 사양이 잘못되면, 고객이 아니라 사양을 변경합니다.
      icon: tabler:settings
    - title: 보증 기간을 넘어서는 지원
      description: 20년 된 선체도 여전히 예비 부품을 위해 저희에게 연락하며, 저희는 여전히 응답합니다.
      icon: tabler:headset
steps2_milestones:
  title: 주요 이정표
  subtitle: Paddle Board Overstock 이야기의 짧은 버전.
  isReversed: true
  items:
    - title: 해안 워크숍에서 창립
      description: 두 명의 해양 건축가가 CNC 밀과 고집스러운 아이디어로 시작했습니다.
      icon: tabler:building-factory
    - title: 첫 1,000 선체 납품
      description: 7년차에 도달했으며, 주로 입소문과 재구매 고객을 통해 이루어졌습니다.
      icon: tabler:circle-check
    - title: 국제 수출 프로그램
      description: 현재 50+개국으로 배송하며, 다섯 대륙에 현지 지원 파트너가 있습니다.
      icon: tabler:world
    - title: 새로운 글로벌 운영 구조
      description: 2026년 9월, 브랜드 운영이 칭다오 Vatrad 그룹에서 Weihai Dongjilian Co., Ltd.(미국 뉴멕시코)로 이전되었습니다; 칭다오 제조 허브는 계속해서 연구개발, 생산 및 공장 직접 수출을 수행합니다.
      icon: tabler:building-skyscraper
features2_locations:
  title: 우리의 위치
  tagline: 찾아오시는 길
  columns: 3
  items:
    - title: 본사 및 워크숍
      description: 해안 산업 단지, 4동 — 방문은 월~금 예약제로 가능합니다.
    - title: EU 서비스 센터
      description: 지중해 항구 — 유럽 고객을 위한 리핏, 수리 및 보증 지원.
    - title: APAC 파트너 네트워크
      description: 호주, 일본, 싱가포르, 홍콩의 공인 서비스 파트너.
brand_hub_tagline: 브랜드
brand_hub_title: 브랜드 탐색
brand_hub_subtitle: 저희의 해양 공학 전문성, 글로벌 존재감, 그리고 저희를 움직이는 원칙을 더 깊이 알아보세요.
brand_hub_cards:
  - title: 해양 전문성
    desc: 수십 년의 재료 과학, 정밀 제조, 실험 검증 — PVC/Hypalon 제작부터 딥-V 선체 설계와 drop-stitch 기술까지.
    link: /brand-marine-expertise
    link_label: 더 알아보기 →
  - title: 글로벌 존재감
    desc: 유럽, 아시아 태평양, 아메리카 전역의 공인 서비스 파트너와 함께 청도 시설에서 50+개국으로 배송합니다.
    link: /brand-global-presence
    link_label: 더 알아보기 →
  - title: 왜 Paddle Board Overstock
    desc: 수직 통합, 이중 인증 (ISO 9001 + BSCI), CE 준수, 그리고 낮은 MOQs — 브랜드, 유통업체, 정부 기관을 위해 구축됨.
    link: /brand-why-paddleboardoverstock
    link_label: 더 알아보기 →
production_section:
  tagline: 생산 우수성
  title: 정교한 장인정신 보장
  description: Paddle Board Overstock 생산 라인은 고품질, 내구성, 고성능의 고무보트 제품을 생산하는 데 전념하고 있습니다.
  cards:
    - title: 경험 많은 기술자 팀
      items:
        - PVC, Hypalon 및 해양 재료에 대한 전문 지식
        - 정밀한 절단, 접합 및 부속품 설치 기술
        - 최신 생산 기술을 숙달하기 위한 지속적인 훈련
    - title: 첨단 생산 장비
      items:
        - CNC 최소한의 오차로 정밀하게 원단을 재단할 수 있는 재단 장비
        - 기밀하고 내구성 있는 솔기를 위한 고정밀 열/냉 접합
        - 전문 기밀성 및 인장 시험 장비
    - title: 성숙한 관리 시스템
      items:
        - 명확한 품질 기준을 갖춘 표준화된 생산 공정
        - 낭비를 줄이고 효율성을 향상시키는 린 생산 철학
        - 신뢰할 수 있는 공급업체 파트너십을 통한 효율적인 공급망 관리
    - title: 엄격한 품질 관리
      items:
        - 인증된 품질 관리 시스템
        - '다단계 검사: 원자재, 공정 중, 최종 출하'
        - 출하 전 엄격한 기밀성과 내구성 테스트
global_ops_section:
  tagline: 글로벌 운영 아키텍처
  title_html: 한 브랜드,<span class="text-white/90">두 개의 허브</span>
  description_html: 2026년 9월부터 Paddle Board Overstock는 운영되고 있습니다<strong class="text-white">Paddle Board Overstock 유한회사</strong>(미국 뉴멕시코) — 유통, 상업 B2B 판매, 계약, 청구 및 애프터서비스를 위한 글로벌 기관. 연구개발, 생산 및 품질 관리는 여전히<strong class="text-white">Paddle Board Overstock 칭다오 제조 허브</strong>, 모든 주문을 공장에서 직접 배송하는 FOB 칭다오. 이 전환은 누가 당신의 계약서에 서명하는지는 바꿨지만, 누가 당신의 배를 만드는지는 바꾸지 않았습니다.
  stats:
    - value: 2,400+
      label: 전 세계적으로 납품된 선체
    - value: 50+
      label: 수출한 국가
    - value: 10+
      label: 제조 연도
