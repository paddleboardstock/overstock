content_capability:
  tagline: 공학 역량
  title: 우리의 엔지니어링<br />팀 전달
  subtitle: Aquafarer 엔지니어링은 시장 조사와 개념 설계에서부터 시제품 제작, 테스트, 양산에 이르기까지 제품 라이프사이클 전반을 포괄합니다.
  items:
    - title: 산업 디자인
      description: 우리 산업 디자인 팀은 고객 요구 사항, 시장 조사 및 경쟁 분석을 바탕으로 미학, 기능성 및 제조 가능성의 균형을 맞춘 제품 개념을 개발합니다. 우리는 금형 제작에 착수하기 전에 고객 검토를 위해 2D 스케치, 3D 렌더링 및 사양 문서를 제작합니다.
      features:
        - 개념 개발 및 타당성 조사
        - 2D 설계 도면과 3D 렌더링
        - 재료 선택 및 사양
        - 제조용 설계(DFM) 분석
        - 인체공학적 및 안전 평가
    - title: 구조 공학
      description: 저희 구조 엔지니어들은 고무보트 구조 설계 — 선체 설계, 튜브 챔버 구성, drop-stitch 코어 엔지니어링, 하중 분포를 전문으로 합니다. 각 설계는 구조적 완전성, 무게 최적화 및 관련 기준(CE, ISO, AS) 준수를 위해 분석됩니다.
      features:
        - 계산된 데드라이즈 각을 가진 딥-V 유리섬유 선체 설계
        - 안전과 부력을 위한 다중 챔버 튜브 구성
        - Drop-stitch 코어 사양 및 밀도 최적화
        - 하중 지지 부품에 대한 유한 요소 해석
        - 무게 분배 및 안정성 계산
    - title: 3D 모델링 및 CAD
      description: 모든 제품 디자인은 시제품 공구 제작이 시작되기 전에 3D CAD에서 개발됩니다. 당사의 엔지니어들은 제품 모델링을 위해 SolidWorks와 Rhino 3D를 사용하여, 고객이 생산을 결정하기 전에 튜브 프로필부터 콘솔 레이아웃까지 모든 세부 사항을 검토할 수 있도록 합니다.
      features:
        - SolidWorks와 Rhino 3D에서의 전체 3D CAD 모델링
        - 고객 프레젠테이션을 위한 사진 실사 렌더링
        - 생산용 기술 도면 패키지
        - 3D 모델로부터 금형 및 공구 설계
        - 정밀 절단을 위한 CAD-CNC 직접 데이터 전송
    - title: 프로토타이핑 및 테스트
      description: 대량 생산 전에 모든 신제품은 시제품 단계를 거칩니다. 우리는 고객 평가를 위해 기능성 시제품을 제작한 후, 압력 테스트, 안정성 테스트, 하중 테스트, 수중 실험 등 전체 테스트 프로토콜에 따라 시험합니다. 시제품 단계에서의 디자인 반복은 빠르고 비용 효율적입니다.
      features:
        - 빠른 시제품 제작 도구(15-20일 소요)
        - 실제 환경 평가를 위한 기능적 프로토타입
        - 생산 승인 전 전체 테스트 프로토콜
        - 시험 결과를 기반으로 한 반복적인 설계 개선
        - 생산 도구 제작 전에 클라이언트 승인 마일스톤
    - title: 맞춤 액세서리 통합
      description: 많은 OEM 프로젝트는 클라이언트 제공 또는 제3자 액세서리의 통합을 필요로 합니다 — 맞춤형 콘솔, 특수 좌석, 전자 시스템, 잠수 장비 거치대 또는 브랜딩 요소 등이 해당됩니다. 우리 엔지니어링 팀은 모든 액세서리의 통합 설계, 구조적 적응 및 품질 검증을 관리합니다.
      features:
        - 콘솔 설계 및 계기판 레이아웃
        - 맞춤 좌석 및 장식 통합
        - 전자 시스템 설계 및 배선
        - 다이빙 및 구조 장비 장착 시스템
        - 브랜딩 및 그래픽 적용 사양
content_process:
  tagline: 개발 과정
  title: 개념에서<br />프로덕션으로
  subtitle: 우리의 제품 개발 프로세스는 위험을 최소화하고, 일정 압축을 가능하게 하며, 첫날부터 제조 준비성을 보장하도록 설계된 구조화된 6단계 워크플로우를 따릅니다.
  stages:
    - stage: '01'
      title: 요구 사항 및 연구
      duration: 1-2주
      description: 우리는 고객과 협력하여 제품 사양, 목표 시장 요구사항, 규제 준수 필요사항 및 상업적 목표를 정의합니다. 이 단계에서는 이후 모든 작업을 안내하는 제품 요구사항 문서(PRD)를 작성합니다.
      deliverables: PRD, 시장 분석, 경쟁 벤치마크, 예비 비용 추정
    - stage: '02'
      title: 컨셉 디자인
      duration: 2-3주
      description: 산업 디자인 팀은 PRD를 기반으로 제품 개념을 개발합니다. 여러 디자인 옵션이 3D 렌더링, 재료 추천 및 초기 엔지니어링 평가와 함께 제시됩니다. 클라이언트는 세부 개발을 위한 방향을 선택합니다.
      deliverables: 3D 컨셉 렌더링, 재료 사양, 설계 근거, 예비 자재 명세서
    - stage: '03'
      title: 상세 엔지니어링
      duration: 2-4주
      description: 선택된 개념은 완전히 설계되었습니다 — 3D CAD 모델링, 구조 분석, 튜브 구성, 선체 설계, 액세서리 통합 및 생산 문서화. 모든 치수, 재료 및 공정이 툴링을 위해 지정되었습니다.
      deliverables: 전체 3D CAD 모델, 엔지니어링 도면, 최종 BOM, 금형 사양, QC 계획
    - stage: '04'
      title: 프로토타이핑
      duration: 2-3주
      description: 프로토타입 도구가 제작되고 기능 샘플이 구축됩니다. 클라이언트는 PRD 사양에 따라 프로토타입을 검토합니다. 합의된 프로토콜에 따라 테스트가 수행됩니다. 생산 도구 이전에 피드백을 기반으로 디자인 조정이 이루어집니다.
      deliverables: 기능 프로토타입, 테스트 보고서, 설계 수정 기록, 클라이언트 승인 문서
    - stage: '05'
      title: 생산 장비
      duration: 2-3주
      description: 프로토타입이 승인되면 생산 도구가 가동됩니다 — 금형, 용접 지그, 절단 프로그램, 조립 설비. QC 문서와 검사 기준이 최종 확정됩니다. 공정 검증을 위해 시운전이 수행됩니다.
      deliverables: 생산 도구, 공정 문서, 품질 검사 계획, 시운전 보고서
    - stage: '06'
      title: 대량 생산 및 품질 관리
      duration: 지속
      description: 전체 생산은 각 단계에서 진행 중인 QC로 시작됩니다. 첫 번째 샘플은 배치 출시 전에 검사 및 승인됩니다. 생산 주기 전반에 걸쳐 지속적인 품질 모니터링, 결함 추적 및 지속적인 개선이 이루어집니다.
      deliverables: 생산 일정, 품질관리 보고서, 배치 추적 기록, 배송 문서
content_customization:
  tagline: 사용자 정의 옵션
  title: 무엇이 될 수 있는가<br />맞춤형
  subtitle: 우리 제품의 거의 모든 측면은 고객 요구 사항을 충족하도록 맞춤화할 수 있습니다. 아래는 가장 일반적인 맞춤화 범주입니다.
  columns: 3
  items:
    - title: 선체 및 구조
      description: 맞춤형 선체 길이, 빔 너비, 드레라이스 각도, 튜브 직경, 챔버 구성 및 재질 등급.
      icon: tabler:sailboat
    - title: 색상 및 그래픽
      description: 튜브 색상 (PVC/Hypalon), 선체 젤코트 색상, 콘솔 색상, 데크 그래픽, 로고 배치, 패키지 디자인.
      icon: tabler:palette
    - title: 콘솔 및 컨트롤
      description: 센터 콘솔, 사이드 콘솔, 또는 틸러 스티어링. 맞춤형 계기판 배치, 스위치 위치, 그리고 운전대 위치.
      icon: tabler:steering-wheel
    - title: 좌석 및 장식
      description: 조키 시트, 벤치 시트, 고급 가죽 장식, 색상 맞춤 스티치, 접이식 또는 탈착식 구성.
      icon: tabler:armchair
    - title: 액세서리 및 장비
      description: 다이브 사다리, 탱크 랙, 견인 파일런, T-탑, 비미니 탑, 오디오 시스템, 항해 전자 장치, 안전 장비.
      icon: tabler:backpack
    - title: 포장 및 브랜딩
      description: 맞춤형 소매 포장, 프라이빗 라벨 상자, 브랜드 마크가 있는 배송 상자, 행태그, 고객 언어로 된 사용자 매뉴얼.
      icon: tabler:box
content_industries:
  tagline: 산업 응용
  title: 엔지니어링 솔루션<br />산업별
  subtitle: 우리 엔지니어링 팀은 다양한 해양 응용 분야에 맞춘 제품을 개발했습니다. 각 분야는 고유한 요구 사항과 성능 기준을 가지고 있습니다.
  columns: 3
  items:
    - title: 다이빙 운영
      description: 강화된 갑판, 다이브 사다리 통합, 탱크 저장 시스템, 전 세계 상업 다이빙 센터용 안정적인 플랫폼.
      icon: tabler:lifebuoy
    - title: 구조 및 긴급 상황
      description: 고속 선체 설계, 자체 배수 갑판, 장비 장착 시스템, SAR 운영용 다중 챔버 안전 구성.
      icon: tabler:alert-triangle
    - title: 해양 관광
      description: 승객 편의 레이아웃, 차양 통합, 탑승 시스템, 섬 이동 작업을 위한 연료 효율적인 구성.
      icon: tabler:beach
    - title: 요트 텐더
      description: 다비트 저장용 컴팩트 설계, 고급 마감 옵션, 모선 색상 일치, 고성능 견인 특성.
      icon: tabler:sailboat
    - title: 낚시 및 양식업
      description: 평갑판 구성, 라이브웰 통합, 로드 홀더 레이아웃, 지속적인 바닷물 노출에 대한 내식성 하드웨어.
      icon: tabler:fish
    - title: 항구 및 산업
      description: 강력한 선체 보강, 작업선 레이아웃, 인원 수송 구성, 해상 작업용 장비 통합.
      icon: tabler:ship
cta:
  title: 제품 개발 프로젝트 시작하기
  subtitle: 제품 요구 사항, 목표 시장, 일정 공유 — 우리 엔지니어링 팀이 48시간 내 개발 제안서와 비용 견적을 제공합니다.
  actions:
    - variant: primary
      text: 프로젝트 시작하기
      href: /contact
    - text: OEM/ODM 설계도 보기
      href: /oem-odm-blueprint
