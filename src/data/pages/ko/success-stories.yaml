hero:
  tagline: 성공 사례
  title: 실제 결과<br />워터 비즈니스 빌더즈
  subtitle: 전 세계 클럽, 리조트, 그리고 기업가들이 Paddle Board Overstock 장비와 지원으로 수익성 있는 수상 스포츠 운영을 어떻게 구축했는지 확인하세요.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock 고객 성공 사례
stories:
  - title: 지중해 리조트가 어떻게 수익성 있는 SUP 대여 사업을 구축했는지
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5성급 해변 리조트 — 그리스
    problem: 리조트는 고객 만족도를 높이고 새로운 수익원을 창출하기 위해 프리미엄 수상 활동이 필요했으나, 장비, 안전 인프라, 직원 전문성이 부족했습니다.
    solution: Paddle Board Overstock는 리조트 색상과 로고가 들어간 50개의 맞춤형 SUP 보드, 구명 요원 스테이션과 부이 라인을 포함한 완전한 안전 시스템, 장비 취급, 고객 안내, 안전 프로토콜 교육이 포함된 3일간의 직원 교육 프로그램을 제공했습니다.
    result:
      - 첫 달 내 주간 고객 활동 300회 예약
      - '수상 활동 고객 만족도: 4.8/5'
      - '연간 신규 부가 수익: $180K'
      - 첫 운영 시즌 안전 사고 제로
      - 이전 공급업체 대비 장비 교체 비용 40% 절감
    quote:
      text: Paddle Board Overstock는 단순히 보드만 제공한 것이 아니라 완벽한 고객 경험을 구축하도록 도와주었습니다. 우리 수상 스포츠 프로그램은 한 시즌 만에 리조트의 하이라이트가 되었습니다.
      author: 리조트 총지배인
    cta_text: 리조트 솔루션 구축하기
    cta_href: /solutions/resorts
  - title: 호주 스타트업이 90일 만에 수상 브랜드를 구축한 방법
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: 첫 번째 기업가 — 호주
    problem: 야외 활동 애호가는 호주 시장을 위한 자신의 SUP 브랜드를 출시하고 싶었지만 제조 경험, 공급업체 관계, 그리고 자본이 부족했습니다.
    solution: Paddle Board Overstock의 브랜드 런치 패키지는 제품 선택 상담, 맞춤 로고 및 색상 디자인, 행택이 포함된 브랜드 소매 포장, CE 인증 서류, FOB 시드니 배송을 제공했습니다.
    result:
      - 첫 접촉 후 75일 이내 200개 보드 첫 배송
      - 도착 2주 이내 Shopify + Amazon AU에서 브랜드 출시
      - 초기 재고 45일 만에 매진
      - '평균 마진율: 소매가 기준 55%'
      - '두 번째 주문: 출시 60일 이내 500개 발주'
    quote:
      text: 브랜드 아이디어는 있었지만 제조 지식은 전혀 없었습니다. Paddle Board Overstock가 처음 보드 디자인 선택부터 첫 배송 개봉까지 전체 과정을 문자 그대로 손잡고 안내해 주었습니다. 꿈에서 배송까지 90일.
      author: 호주 SUP 브랜드 창업자
    cta_text: 브랜드 론칭하기
    cta_href: /solutions/entrepreneurs
  - title: 태국 비치 클럽이 10보드에서 80보드로 확장한 방법
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: 워터 스포츠 클럽 — 태국
    problem: 푸켓의 작은 해변가 SUP 클럽은 취미 사업에서 관광객을 위한 전문 임대 사업으로 확장해야 했지만, 일관된 품질과 가격을 제공하는 신뢰할 수 있는 장비 공급업체를 찾지 못했습니다.
    solution: Paddle Board Overstock클럽 스타터 패키지(10개의 보드, 패들, 안전 장비, 브랜드 포함)부터 시작해 18개월에 걸쳐 프리미엄 패키지 프로그램을 통해 클럽이 성장했습니다.
    result:
      - 18개월 만에 10판에서 80판으로 일관된 품질과 가격으로 확장했습니다
      - 같은 공급업체를 이용해 카약과 페달 보트 대여도 추가했습니다
      - 맞춤형 클럽 브랜드는 관광객들 사이에서 브랜드 인지도를 높였습니다
      - 유지보수 비용은 이전 예산 장비 대비 60% 절감되었습니다
      - 현재 성수기에는 하루 150대의+ 임대 서비스를 제공합니다
    quote:
      text: 클럽 스타터 패키지는 완벽한 입문점이었습니다. 사업이 성장하면서 Paddle Board Overstock — 같은 품질, 같은 가격, 놀라운 일도 없었습니다.
      author: 클럽 소유주, 푸켓
    cta_text: 클럽 패키지 시작
    cta_href: /solutions/clubs
  - title: 카리브해 리조트 체인이 5개 호텔에 걸쳐 수상 스포츠를 표준화한 방법
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: 리조트 체인 — 카리브해
    problem: 5개의 호텔을 가진 럭셔리 리조트 체인은 모든 지점에서 일관된 수상 스포츠 장비 품질과 브랜드 구축, 중앙 조달 및 계절별 교체 계획이 필요했습니다.
    solution: Paddle Board Overstock SUPs 통합 브랜드, 공유 부품 재고, 연간 교체 일정과 대량 가격 체계를 갖춘 300대 및 100대의 다부지 카약 함대를 납품했습니다.
    result:
      - 5개 호텔 전반에 걸쳐 표준화된 고객 경험
      - 통합 구매 및 대량 가격 책정을 통한 비용 절감 30%
      - 중앙집중식 예비 부품 재고는 다운타임을 80% 줄였습니다
      - 연례 장비 갱신 프로그램으로 시즌 종료 시 긴급 출격 현상이 없어졌습니다
      - 게스트 수상 스포츠 참여는 전년 대비 45% 증가했습니다
    cta_text: 리조트 프로그램 설계
    cta_href: /solutions/resorts
