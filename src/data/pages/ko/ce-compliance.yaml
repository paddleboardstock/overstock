hero:
  tagline: CE & RCD 준수
  title: RIB 보트 CE 준수<br />& 기술 문서
  subtitle: Paddle Board Overstock RIB 보트와 팽창식 수상 이동수단은 레크리에이션용 선박 지침 2013/53/EU에 따른 EU 시장 준수를 위해 설계되고 문서화됩니다. 위험 평가부터 적합성 선언까지, 우리는 모든 선체에 대해 모델별 준수 문서를 제공합니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB 보트 CE 준수 문서 및 인증
direct_answer: Paddle Board Overstock은 EN ISO 6185, ISO 12217 및 적용 가능한 조화 표준과 일치하는 기술 문서, 적합성 선언서, 제작자 명판 및 사용자 설명서를 포함하여 RIB 보트 및 인플레이션 수상기구에 대한 모델별 RCD 2013/53/EU 준수 문서를 제공합니다.
