content_scope:
  tagline: 준수 범위
  title: 어떤 제품이 필요한가<br />RCD 준수?
  subtitle: 레크리에이션 선박 지침 2013/53/EU는 선체 길이가 2.5m에서 24m 사이인 레크리에이션 선박에 적용됩니다. 범위를 이해하는 것이 준수의 첫 번째 단계입니다.
  items:
    - title: RIB 보트 (2.5–24 m)
      description: 길이 2.5m에서 24m인 강성 팽창 보트는 RCD에 해당합니다. 설계 카테고리 A부터 D까지는 의도된 해상 조건과 최대 풍속에 따라 적용됩니다.
      icon: tabler:sailboat
    - title: 고무보트 (2.5 m 미만)
      description: 2.5m 미만의 소형 고무보트와 소형 보트는 RCD에서 부분적으로 면제될 수 있지만, 여전히 다른 해당 지침 및 EN ISO 6185 제작 기준에 따라 CE 표시가 필요합니다.
      icon: tabler:sailboat
    - title: SUP 보드 및 액세서리
      description: 스탠드업 패들 보드는 RCD 범위 외입니다. 그러나 관련 개인 구명 장치(PFD)는 해당되는 경우 USCG 유형 III/V 승인을 포함하여 PPE 규정(EU) 2016/425에 따라 CE 표기가 필요합니다.
      icon: tabler:swimming
    - title: 부분적으로 완성된 보트
      description: 엔진이나 특정 설비 없이 전달된 보트는 부분적으로 완성된 선박에 대한 제작자 선언서가 필요하며, 최종 제작자나 수입업자가 전체 RCD 준수를 완료해야 합니다.
      icon: tabler:tool
content_trust_layers:
  tagline: 삼층 신뢰 시스템
  title: 준수 정보<br />— 적절한 수준에서 공유됨
  subtitle: 모든 컴플라이언스 데이터가 공개 웹사이트에 있어야 하는 것은 아닙니다. 우리는 지적 재산권을 보호하고 구매자 신뢰를 구축하는 3단계 접근법을 따릅니다.
  items:
    - title: 레이어 1 — 공개 웹사이트
      description: 참조된 표준, 적합성 경로 설명, 문서 유형 나열, 모델 계열별 인증 범위 등. 실제 인증서, 테스트 데이터, 독점 엔지니어링 세부사항은 없음.
      icon: tabler:world
    - title: 레이어 2 — 조사 후 공유
      description: '적격 조사 후: 검열된 DoC 샘플, 건축사 번호판 사진, 적용 가능한 표준 목록, 준수 체크리스트, 자재 인증 요약 — 공정 사용 조건 하에 공유됨.'
      icon: tabler:mail
    - title: 레이어 3 — NDA / 주문 단계
      description: 전체 기술 파일, 위험 평가, 안정성 계산, 시험 보고서, 자재 배치 기록, 생산 추적성 문서 — NDA 확인된 구매자에게만 공유됩니다.
      icon: tabler:lock
content_standards:
  tagline: 적용 가능한 표준
  title: ISO 및 EN 표준<br />우리는 쌓아 올립니다
  subtitle: 저희 제품은 .에 따른 조화 표준에 따라 설계 및 테스트되었습니다RCD. 표준 번호와 명칭이 참조되며; 전체 표준 텍스트는 ISO 저작권을 유지합니다.
  items:
    - title: EN ISO 6185-3
      description: '고무보트 — 3부: 최대 모터 출력이 15kW 이상인 보트. 구조, 안정성, 부력 및 인명 추진 인수 요건.RIBs'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: '팽창식 보트 — 4부: 최대 모터 출력이 15kW이고 4.5kW 이상인 보트. 추가적인 구조 및 안정성 요구사항.'
      icon: tabler:file-text
    - title: ISO 12215 시리즈
      description: 소형 선박 — 선체 구조 및 스칸틀링. 유리섬유 및 알루미늄 선체의 선체, 갑판, 격벽의 구조 설계 RIB .
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: 소형 선박 — 소유자 매뉴얼. RIB EU에서 인도된 각 보트에 첨부된 소유주 매뉴얼의 필수 내용과 형식.
      icon: tabler:book
    - title: EN ISO 14945
      description: 소형 선박 — 제작자 번호판. 각 선박에 영구적으로 부착된 제작자 번호판에 표시될 정보.
      icon: tabler:badge
    - title: ISO 8666
      description: 소형 선박 — 주요 데이터. 모든 제품 문서에서 일관된 사양을 위한 표준화된 측정 및 매개변수.
      icon: tabler:dimensions
content_process:
  tagline: 준수 절차
  title: 6단계 CE 준수<br />워크플로우
  subtitle: 프로젝트 범위부터 직렬 수준의 추적성에 이르기까지 — 모든 RIB 모델은 정의된 준수 경로를 따릅니다.
  steps:
    - number: '01'
      title: 프로젝트 범위 및 분류
      description: RIB 모델, 설계 카테고리(A/B/C/D), 최대 인원, 적재량, 엔진 출력 및 목표 시장을 정의합니다. RCD가 적용되는지 여부와 필요한 적합성 평가 모듈을 결정합니다.
      timeline: 2–3일
    - number: '02'
      title: 적용 요구 사항 식별
      description: RCD 부록 I에서 모든 적용 가능한 필수 안전 요구 사항, 관련 조화 표준(EN ISO 6185, 12215, 10240, 14945) 및 목표 시장에 대한 추가 국가 요구 사항을 식별합니다.
      timeline: 3–5일
    - number: '03'
      title: 설계 및 기술 문서
      description: '마스터 기술 파일을 작성합니다: 일반 배열 도면, 안정성 및 부력 계산, 위험 평가, 재료 사양, 시스템 안전 분석(연료, 전기, 조종).'
      timeline: 10–15일
    - number: '04'
      title: 제품 검증 및 테스트
      description: 물리적 검증 수행 — 정격 압력의 1.25배에서 24–48시간 압력 테스트, 안정성 및 부력 테스트, 하중 테스트 및 시스템 시운전. 모든 테스트 결과를 선체별로 기록합니다.
      timeline: 5–7일
    - number: '05'
      title: 표시 및 배송 문서
      description: CE 표식, 제작자 플레이트(EN ISO 14945) 및 HIN/CIN(선체 식별 번호)을 부착합니다. EU 적합성 선언서, 사용 설명서(EN ISO 10240) 및 적합성 체크리스트를 준비합니다.
      timeline: 2–3일
    - number: '06'
      title: 시리얼 수준 추적성
      description: 각 선체는 마스터 기술 파일, 생산 배치, 재료 인증서, 테스트 결과 및 최종 구성과 연결된 고유한 선체 기록을 받습니다. 기록은 RCD에 따라 10+년 동안 보관됩니다.
      timeline: 지속
content_document_cards:
  tagline: 문서 유형
  title: 적합성 문서<br />카드
  subtitle: 각 CE 인증 RIB 모델에 대해 준비하고 유지 관리하는 문서 유형입니다. 샘플은 자격을 갖춘 문의 시 제공됩니다.
  items:
    - title: CE / RCD 적합성 인증서
      description: 해당 선박이 RCD 2013/53/EU의 모든 필수 안전 요구 사항을 충족함을 확인하는 모델별 인증서로, 필요한 경우 공인 기관 참여 하에 제조업체에서 발행합니다.
      icon: tabler:certificate
    - title: EU 적합성 선언서(DoC)
      description: 제조업체 또는 승인된 대표가 서명한 선언서로, 적용되는 지침, 표준, 적합성 모듈 및 공인 기관 세부 정보를 나열합니다. EU 시장에 출시되는 모든 모델에 필요합니다.
      icon: tabler:file-check
    - title: 제작자 플레이트(EN ISO 14945)
      description: 최대 인원, 최대 엔진 출력, 설계 카테고리 및 제조업체 식별을 표시하는 영구 부착 플레이트. 선박 수명 동안 읽을 수 있어야 합니다.
      icon: tabler:badge
    - title: 사용 설명서(EN ISO 10240)
      description: 안전 운항, 비상 절차, 유지보수 일정 및 안전 경고를 포함한 종합 매뉴얼. EU에서 배송되는 모든 RIB에 필수입니다.
      icon: tabler:book
    - title: ISO 테스트 및 검사 보고서
      description: 압력 테스트 기록(1.25x / 24–48시간), 안정성 및 부력 테스트 결과, 재료 시험 인증서, 치수 검증 보고서 — 모두 특정 선체 번호와 연결됩니다.
      icon: tabler:test-pipe
    - title: 자재 추적 기록
      description: 튜브 원단, 접착제, 유리섬유 및 하드웨어에 대한 배치 수준 추적성. 각 생산 단위를 입고 자재 인증서 및 IQC 검사 결과와 연결합니다.
      icon: tabler:link
    - title: 품질 검사 및 QC 기록
      description: 단위당 100점 품질 체크리스트, 공정 중 QC 기록, 부적합 보고서 및 시정 조치. 생산 추적 가능성 체인의 일부.
      icon: tabler:clipboard-check
    - title: 프로젝트 문서 패키지
      description: 최종 구성 기록, 엔진 및 장비 설치 세부사항, 시운전 점검표 및 인도 문서를 포함한 선체별 문서 패키지.
      icon: tabler:package
content_design_categories:
  tagline: RCD 디자인 카테고리
  title: 디자인 카테고리 A–D<br />— 그들이 의미하는 것
  subtitle: RCD는 해당 선박이 견딜 수 있도록 설계된 최대 풍속과 유의파고를 기준으로 설계 범주를 지정합니다.
  items:
    - title: 카테고리 A — 바다
      description: 풍속이 보퍼트 8(40노트 이상)을 초과하고 유의 파고가 4m를 초과할 수 있는 장거리 항해를 위해 설계되었습니다. 가장 엄격한 구조 및 안정성 검증이 필요합니다.
      icon: tabler:ripple
    - title: 카테고리 B — 해외
      description: 풍속 최대 보퍼트 8급(≤40노트)과 유의 파고 최대 4m까지의 원양 항해에 적합하게 설계되었습니다. 연안 및 반노출 해역에 적합합니다.
      icon: tabler:anchor
    - title: 카테고리 C — 근해
      description: 최대 6등급(≤27노트)의 바람과 최대 2m의 유의파고를 가진 해안 항해를 위해 설계되었습니다. 대부분의 레크리에이션 RIBs가 이 범주에 속합니다.
      icon: tabler:sun
    - title: D급 — 보호 시설
      description: 보포트 풍력 4(≤16노트)까지와 유의파고 0.3m까지의 보호된 수역을 위해 설계되었습니다. 호수, 강, 보호된 항구에서 사용 가능합니다.
      icon: tabler:pool
content_hin:
  tagline: 공예 식별
  title: HIN / CIN 및 제작자 명판
  subtitle: 모든 RIB 보트는 EN ISO 14945 및 RCD 요구 사항에 따라 선체 식별 번호(HIN) 또는 선박 식별 번호(CIN)와 제작자 명판이 필요합니다.
  items:
    - title: 선체 식별 번호 (HIN)
      description: 트랜섬의 우현 측에 영구적으로 표시된 고유한 14자리 코드로, 제조사 코드(MIC), 모델 연도, 생산 연도 및 일련 번호를 인코딩합니다. EU 시장 진입을 위해 필요합니다.
      icon: tabler:hash
    - title: 항공기 식별 번호 (CIN)
      description: EN ISO 10087에 따라, 절도 방지 및 추적 가능성을 위해 숨겨진 위치에 배치된 숨겨진 보조 식별 번호.
      icon: tabler:eye-off
    - title: 건축업자 명판 내용
      description: 최대 인원 수, 최대 엔진 출력(kW), 최대 적재량(kg), 설계 등급, 제조사 이름 및 CE 표시 — 모두 부식 방지 판에 영구적으로 표시되어야 합니다.
      icon: tabler:badge
content_tech_file:
  tagline: 기술 파일 구조
  title: 마스터 기술 파일<br />& 선체 기록
  subtitle: '저희 문서 시스템은 두 단계 구조를 따릅니다: 각 모델 계열의 마스터 기술 파일과 생산된 모든 보트에 대한 개별 선체 기록입니다.'
  items:
    - title: 마스터 기술 파일
      description: 모델 계열에 대한 완전한 준수 문서(일반 배치, 위험 평가, 안정성/부력 계산, 자재 사양, 적용 기준, 적합성 평가 기록)를 포함합니다. 10년간 보관+됨.
      icon: tabler:folder
    - title: 선체 기록 (선박별 추적성)
      description: '각 선체는 마스터 기술 파일과 연결된 고유한 기록을 가지고 있습니다: HIN, 생산일, 튜브 배치, 자재 증명서, 압력 시험 결과, 최종 구성, 엔진 설치, 인도 목적지.'
      icon: tabler:file-description
    - title: 고객 컴플라이언스 팩
      description: 선체별 납품 패키지로는 DoC, 제작자 번호판 사진, 사용 설명서, 시험 요약, 최종 구성표가 포함되어 있으며, RIB EU로 배송될 때마다 모두 제공됩니다.
      icon: tabler:package
content_material_cert:
  tagline: 자재 인증
  title: 재료 추적성 및<br />인증 증거
  subtitle: 품질 RIB 보트는 통제된 재료와 문서화된 공정에서 시작합니다. 아래는 각 핵심 부품 그룹별로 자재 인증을 어떻게 조직하는지입니다.
  items:
    - title: 팽창식 튜브 재료 추적 가능성
      description: 튜브 PVC CSMHypalon 재료는 의도된 용도, 기후 조건 및 목표 시장에 따라 선정됩니다. 공급업체 기술 데이터(TDS), 재료 배치 정보, 직물 배치 추적성, UV 풍화 시험 보고서, REACH그리고 /SVHC 선언문이 합의된 프로젝트 문서 범위 내에서 제공됩니다.
      icon: tabler:circle
    - title: 해양 알루미늄 추적성
      description: 알루미늄 선체 프로젝트의 경우 RIB , 합금 등급, 두께 및 재료 배치가 승인된 사양에 따라 통제됩니다. 재료 시험 인증서(MTC/MTR), EN 10204 3.1 문서, 화학 조성 및 기계적 특성 보고서, 열/로트 추적성은 합의된 경우 제공됩니다.
      icon: tabler:rectangle
    - title: GRP 선체 재료 및 공정 제어
      description: 유리섬유 선체RIBs의 경우, 젤코트, 수지, 유리섬유 보강재 및 코어 재료는 통제된 사양에 따라 관리됩니다. 재료 TDS/SDS, 배치 기록, 적층 사양, 경화 및 작업장 관리 기록은 프로젝트 동의 시 제공됩니다.
      icon: tabler:layers-subtract
    - title: 컴포넌트 문서 지원
      description: 선정된 부품 — EVA 갑판 재료, 좌석, 스테인리스 하드웨어, 연료 시스템, 전기 장비 및 해양 액세서리 포함 — 에 대해서는 최종 구성과 목적지 시장 요구사항에 따라 공급업체 문서가 조정됩니다.
      icon: tabler:package
    - title: 준수 범위 통지
      description: 인증서, 시험 보고서 및 준수 문서는 관련 문서에 명시된 특정 제품 모델, 재료, 부품, 생산 배치 또는 프로젝트 범위에만 적용됩니다. 주문 전에 해당 문서 패키지를 확인하기 위해 귀하의 목표 시장, 의도된 사용 목적 및 기술 요구사항을 저희에게 문의해 주시기 바랍니다.
      icon: tabler:info-circle
faq:
  title: CE 준수 — 자주 묻는 질문
  questions:
    - q: 모든 Paddle Board Overstock RIB 보트가 CE EU 시장에 적합한지 인증받았나요?
      a: RIB 저희 카탈로그에 있는 보트들은 RCD 적용 가능한 EU 지침에 따라 2013/53/EU 준수를 위해 설계 및 문서화되었습니다.CE 마킹은 모델별, 구성별로 적용됩니다. 모델별 준수 범위 문서가 필요하시면 저희에게 연락해 주십시오.
    - q: RCD 준수와 마킹의 차이점은 무엇인가요 CE ?
      a: RCD (레크리에이션 공예 지침 2013/53/EU)는 필수 안전 요건을 규정하는 EU 법률입니다.CE 마킹은 해당 요구사항을 충족하는 것으로 평가되고 확인된 제품에 부착된 시각적 기호입니다. 제품은 마크를 부착하기 전에 반드시 이를 준수해야 RCD CE 합니다.
    - q: 각 보트에 합격 선언서를 제공하나요?
      a: 예. EU 시장에 배송되는 모든 RIB 보트에는 적용 지침, 조화 표준, 적합성 평가 모듈 및 공인 기관 세부 정보를 나열한 모델별 EU 적합성 선언서(EU Declaration of Conformity)가 포함되어 있습니다.
    - q: Paddle Board Overstock는 어떤 적합성 평가 모듈을 사용합니까?
      a: 모듈은 설계 범주와 보트 유형에 따라 다릅니다. 설계 범주 C에 속하는 대부분의 RIB 모델은 모듈 A(내부 생산 관리)를 사용합니다. 설계 범주 A/B 보트나 특정 구성의 경우, 공인 기관 참여와 함께 모듈 B+C 또는 B+D가 적용될 수 있습니다. 프로젝트별로 적합한 모듈에 대해 조언드립니다.
    - q: 주문하기 전에 준수 문서를 공유할 수 있습니까?
      a: 자격 있는 문의 후, 평가 중인 모델에 적용 가능한 표준, 적합성 경로 및 문서 유형을 나열한 준수 범위 문서를 공유합니다. 주문 확인 후 전체 기술 파일이 NDA에서 제공됩니다.
    - q: 선체 식별 번호(HIN)란 무엇이며 포함되어 있습니까?
      a: HIN은 각 보트에 영구적으로 표시된 14자리 고유 식별 번호로, 제조업체 코드(MIC), 모델 지정, 생산 연도 및 일련 번호를 인코딩합니다. EU 시장에 판매되는 모든 RIB 보트에 필수이며, 모든 Paddle Board Overstock RIB에 포함되어 있습니다.
    - q: 기술 파일은 얼마나 오래 보관됩니까?
      a: RCD 2013/53/EU 요구 사항에 따라, 제조업체는 제품이 마지막으로 시장에 출시된 날로부터 최소 10년 동안 기술 파일을 보관해야 합니다. Paddle Board Overstock는 생산된 모든 모델에 대한 전체 기술 문서를 유지합니다.
    - q: RCD에 따른 수입업자 의무에 대해 지원합니까?
      a: '예. EU 수입업자가 의무를 이행하는 데 필요한 문서 패키지: 기술 파일 접근, DoC, 제작자 명판, 사용 설명서 및 제품 추적 기록을 제공합니다. RCD에 따른 수입업자 책임은 저희 준수 가이드에 명확하게 문서화되어 있습니다.'
