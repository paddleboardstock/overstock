breadcrumb: OEM/ODM 제조사
tldr:
  summary: Paddle Board Overstock 공장에서 직접 생산되는 제조업체입니다 OEMODM . 12,000 m² ISO 9001:2015 시설, 연간 15,000대 생산량, CE/BSCI/REACH/UKCA 준수 기준, MOQs 2-10 단위 저향.
  points:
    - 12,000 m² ISO 9001:2015 인증 칭다오 시설
    - 연간 15,000가구의 생산 능력과 200-300명의 숙련 노동자가 근무 중입니다
    - CE 2013/53/EU, UKCA, BSCIREACH , 준수
    - '저가형 MOQs: 2-5 단위 (RIB), 표준 SUP모델의 경우 5-10 단위 ()'
    - + FOB 칭다오 해운을 보유한 50개 수출국
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 인증
      desc: SGS- 모든 생산 라인에서 감사된 품질 관리 시스템.
      variant: cert
    - icon: ⭐
      title: CE & UKCA 컴플라이언스
      desc: EU 2013/53/EU 및 영국 마킹 요건을 완전히 준수합니다.
      variant: cert
    - icon: ⭐
      title: BSCI 사회 감사
      desc: 윤리적 노동 관행과 직장 기준이 검증되었습니다.
      variant: standard
    - icon: ⭐
      title: MOQ 2 유닛에서 낮음
      desc: 'RIB 표준 모델은 2-5 단위, SUP 5-10 단위 모델. 맞춤 금형: 200+.'
      variant: standard
process_section:
  eyebrow: 우리의 프로세스
  title: 종단 간 / OEMODM 워크플로우
  subtitle: 디자인 브리프부터 컨테이너 적재까지 — 프라이빗 라벨 인플레이터블 수상기구까지 여섯 단계.
  steps:
    - step: '01'
      title: 사양 및 설계 개요
      desc: 목표 사양, CAD 도면 또는 참조 제품을 공유하세요. 저희 엔지니어링 팀은 CE견적 전에 재료, 치수, 준수 요건(, )을 검토합니다BSCI.
    - step: '02'
      title: 3D 몰드 프로토타이핑
      desc: 저희는 CNCSUP 보드, 카약 선체 및 부품에 맞춤형 몰드를 설계하고 가공 RIB 합니다. 프로토타입 샘플은 15–20영업일 이내에 제작되어 승인을 받을 수 있습니다.
    - step: '03'
      title: 재료 선발 및 샘플 생산
      desc: 군용 등급 PVC (0.9mm–1.2mm) Hypalon CSM또는 drop-stitch 코어 원단 중에서 선택하세요. 저희는 귀사의 브랜드 색상, 로고, 포장이 포함된 사전 생산 샘플을 제작하여 서명을 제공합니다.
    - step: '04'
      title: CE 공장 감사 및 준수
      desc: 모든 OEM 명령에는 준수 문서가 포함되어 있습니다 — CE 적합성 선언서, ISO 9001 추적 기록, BSCI 사회적 준수 보고서, REACH 그리고 물질적 신고서.
    - step: '05'
      title: 대량 생산 및 인라인 품질 관리
      desc: 생산 공정은 저희의 100점 품질 체크리스트를 따릅니다. 각 유닛은 포장 전 24시간 압력 유지 테스트, 이음 벗기기 테스트, 육안 검사를 거칩니다.
    - step: '06'
      title: FOB 칭다오 물류 및 해운
      desc: 완제품은 칭다오 항구에서 팔레타이징, 수축 포장, 컨테이너 적재 작업을 진행합니다. 모든 수출 서류, 통관 처리, 실시간 선적 추적을 담당합니다.
capabilities_section:
  eyebrow: 제조 능력
  title: 우리가 만드는 것
  subtitle: 글로벌 파트너를 위한 6개의 핵심 생산 역량 B2B .
  items:
    - title: Drop-Stitch SUP 보드 제조
      desc: drop-stitch 강성하고 고압(15–20) 스탠드업 패들 보드용 전장 코어 라미네이션PSI. 맞춤 길이, 너비, 두께, 로커 프로파일 및 그래픽 디자인.
    - title: PVC 팽창식 보트 생산
      desc: 고주파 용접 PVC 딩기, 텐더, 스포츠 보트. 다중 챔버 구성, 바닥 옵션(슬랫, 에어 데크, 롤업), 액세서리 통합.
    - title: Hypalon RIB 보트 제작
      desc: 상업용 Hypalon CSM 등급 튜브는 유리섬유 또는 알루미늄 딥-V 선체에 접착되어 있습니다. 순찰, 구조, 투어, 다이빙 작업에 적합한 길이는 3.3m에서 6.0m입니다.
    - title: 프라이빗 라벨 및 커스텀 브랜딩
      desc: '완전한 프라이빗 라벨 서비스: 맞춤형 로고 열전사 또는 실크스크린 인쇄, 브랜드 포장(소매 박스, 휴대 가방), 사용자 언어 매뉴얼, 바코드/UPC등록 서비스.'
    - title: 맞춤형 금형 및 금형 설계
      desc: 사내 3D CAD/CAM 엔지니어링 팀입니다. 독특한 선체 형태, 갑판 구성, 액세서리 장착 지점에 맞는 맞춤형 알루미늄 및 복합 몰드를 설계하고 제작합니다.
    - title: OEM 액세서리 및 키트
      desc: 구명조끼(CE12402), 듀얼 액션 펌프, 카본/나일론 패들, 수리 키트, 캐리어백, 그리고 목줄 조립체. 소매용 프레젠테이션을 위한 풀 키트 및 번들 포장.
experience_section:
  eyebrow: 실제 경험
  title: 브랜드를 구축한 파트너십
  subtitle: 제조업과 협력한 브랜드와 조직들의 실제 이야기 Paddle Board Overstock OEMODM 입니다.
  stories:
    - quote: 우리는 Paddle Board Overstock 냅킨에 스케치와 요구 사항 목록을 가지고 있었다. 8개월 후, CE 우리는 첫 시도에서 생산 준비가 된 제품을 인증에 통과했다.
      narrative: 유럽의 스타트업이 SUP 새로운 설계를 통해 Paddle Board Overstock 제조에 접근했습니다 ODM . Paddle Board Overstock 연구개발팀은 CAD 설계, FEA 구조 해석, 유체역학 시뮬레이션, 금형 제작, 프로토타입 제작, 생산 도구 제작 과정을 통해 개념을 발전시켰습니다. 창업자는 이 과정에서 세 차례 칭다오를 방문했습니다. 최종 제품은 CE 어떤 수정도 없이 인증을 통과했으며, 이는 창립자가 처Paddle Board Overstock음부터 유럽 규제 요구사항을 이해한 엔지니어링 팀의 덕분이라고 평가합니다.
      context: 유럽 SUP 브랜드 출시, 2023-2024
      source: Brand Founder
    - quote: 이 보안 수준 NDA 과 IP 보안 덕분에 우리는 독 Paddle Board Overstock 점 설계를 공유할 자신감을 갖고 있습니다. 그들은 우리의 IP를 자기 것처럼 취급합니다.
      narrative: 독자적인 밸브 기술을 가진 미국의 해양 장비 회사는 대규모 생산을 하면서 자사의 지적 재산권을 보호할 수 있는 제조 파트너가 필요했습니다. 5개 중국 제조업체를 감사한 후 Paddle Board Overstock , 공장의 IP 보호 프로토콜, 안전한 설계 파일 처리, 엄격한 NDA 서명 의향을 기준으로 선정했습니다. 이 파트너십은 4년간 3개의 제품 라인을 생산했으며 지적 재산권 사건은 전혀 발생하지 않았습니다.
      context: 미국 해양 장비 회사, OEM 2021년부터 파트너십
      source: 운영 부사장
