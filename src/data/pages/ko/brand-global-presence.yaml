hero:
  tagline: 글로벌 존재
  title: 50개국에 서비스 제공<br />모든 대륙에서
  subtitle: 유럽 연안 순찰 운영자부터 호주 수상 스포츠 유통업체, 중동 구조팀까지 — Aquafarer 보트는 전 세계 물 위에서 활동하고 있습니다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer 글로벌 해양 제조 및 유통
stats:
  title: 글로벌 도달 범위
  stats:
    - title: 국가
      amount: 50+
    - title: 수출 시장
      amount: 유럽, 아메리카, 아시아, 중동, 오세아니아
    - title: 생산
      amount: Qingdao, 중국
    - title: 미국 창고
      amount: 캘리포니아주 몬트클레어
features3_markets:
  tagline: 주요 시장
  title: 지역 전문성<br />지역 요구사항에 맞춤
  subtitle: 각 시장마다 다른 규제 요구사항, 선호도, 사용 사례가 있음을 이해합니다.
  isBeforeContent: false
  columns: 4
  items:
    - title: 유럽 및 영국
      description: EN ISO 6185 기준을 충족하는 CE 인증 제품. 유럽 연합 시장에서 RIBs, 인플레이션 보트 및 SUP 보드에 대한 강한 수요. 영국 유통업체들은 우리의 빠른 처리 속도를 높이 평가합니다.
      icon: tabler:map-pin
    - title: 북미
      description: 미 해안경비대 승인 제조. 서부 해안 빠른 배송을 위한 캘리포니아주 몬트클레어 미국 창고. 낚시 보트, 구조용 선박, 레크리에이션 SUPs에 대한 수요 증가.
      icon: tabler:map-pin
    - title: 호주 및 오세아니아
      description: RIB 보트와 인플레이터블 텐더에 대한 강력한 시장. 호주 유통업체들은 강한 햇빛 환경에서의 UV 저항성 때문에 우리의 Hypalon 보트를 중요하게 평가. 아시아 시설에서 빠른 배송.
      icon: tabler:map-pin
    - title: 중동
      description: 순찰 및 구조 보트 수요 증가. 우리의 알루미늄 선체 RIBs는 해안경비대와 보안 운영자들 사이에서 인기. 고온 환경에 맞춘 맞춤 구성.
      icon: tabler:map-pin
features3_distribution:
  tagline: 유통 네트워크
  title: 유통업체와의 파트너십<br />전 세계
  subtitle: 우리는 기존 해양 장비 유통업체, OEM 브랜드 및 정부 조달 기관과 협력합니다.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM 파트너십
      description: 글로벌 수상 스포츠 브랜드를 위한 프라이빗 라벨 제조. 디자인부터 생산, 드랍쉬핑까지 모든 것을 처리합니다.
      icon: tabler:building
    - title: 유통망
      description: 20+개국의 공인 대리점이 재고를 보유하고 현지 지원을 제공합니다. 신규 대리점 문의를 환영합니다.
      icon: tabler:users
    - title: 정부 및 기관
      description: 해안경비대, 수색 및 구조 조직, 군사 조달 프로그램에 직접 공급. 기관 조달 요구 사항 준수.
      icon: tabler:building-community
steps2_logistics:
  title: 글로벌 물류 및 지원
  subtitle: 공장에서 목적지까지 — 우리는 전체 공급망을 관리합니다.
  items:
    - title: 배송 옵션
      description: 해상 운송(FOB 칭다오), 긴급 주문을 위한 항공 운송, 샘플 및 예비 부품을 위한 특급 택배.
      icon: tabler:truck-delivery
    - title: 미국 창고
      description: '북미 전역에 빠른 배송을 위해 캘리포니아 몬트클레어에 재고 보유. 서부: 2-3일, 중부: 3-4일, 동부: 4-5일.'
      icon: tabler:building-warehouse
    - title: 예비 부품
      description: 정품 Aquafarer 부품 및 소모품을 연중 재고 보유. 일반 부품은 24시간 내 배송.
      icon: tabler:package
    - title: 기술 지원
      description: 기술 질문, 수리 조언 및 리핏 지원을 위해 엔지니어링 팀과 직접 연결되는 연락 창구입니다. 우리는 20년 전에 제작한 보트도 지원합니다.
      icon: tabler:headset
cta:
  title: 유통업체가 되고 싶으신가요?
  subtitle: 우리는 유통망을 적극적으로 확장하고 있습니다. 파트너십 기회를 논의하시려면 저희 수출팀에 연락하십시오.
  actions:
    - variant: primary
      text: 파트너십 문의
      href: /contact
    - text: 우리 제품군 보기
      href: /products
