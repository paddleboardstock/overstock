articles:
  sup:
    - title: SUP 기초 — 초보자 가이드
      desc: 초보자가 알아야 할 모든 것 — 보드 종류, 패들 크기, 자세, 첫날 팁.
    - title: SUP 사이즈 가이드
      desc: 체중, 기술, 패들링 스타일에 맞는 적절한 보드 길이, 너비, 부피를 찾으세요.
    - title: 팽창식 대 하드보드
      desc: 어떤 것이 당신에게 적합할까? 휴대성, 성능, 내구성, 비용 비교.
    - title: 중급 기술
      desc: 고급 스트로크, 회전 기술, 거친 물 다루기를 통해 패들링 실력을 향상시키세요.
    - title: 인플레이션 가능한 SUP 선택 방법
      desc: 핵심 요소 탐색 — 구조, 두께, 핀 구성 및 포함된 액세서리.
    - title: 물 안전
      desc: 날씨 확인, PFD 선택, 자가 구조, 그룹 패들링을 포함한 필수 안전 지식.
  inflatable-boat:
    - title: 재료 참조
      desc: PVC, Hypalon, drop-stitch, 데니어 등급 — 인플레이션 장비가 무엇으로 만들어졌는지 이해하기.
    - title: PVC 대 Hypalon
      desc: 인플레이션 보트를 위한 PVC와 Hypalon 원단의 확실한 비교 — 내구성, UV 저항성, 비용.
    - title: Drop-Stitch 코어 설명
      desc: 수천 개의 내부 실이 12-15 PSI에서 고성능 인플레이션 SUPs을 위한 견고한 플랫폼을 만드는 방법.
    - title: 인플레이션 기술 개요
      desc: 인플레이션 보트와 SUPs가 어떻게 제작되는지 — 재료 적층부터 밸브 시스템 및 솔기 용접까지.
    - title: 강체 인플레이션 보트 (RIB) 가이드
      desc: RIB 구조, 선체 유형, 튜브 재료 및 필요에 맞는 RIB 선택에 관한 모든 것.
    - title: 인플레이션 보트 vs RIB
      desc: 다양한 사용 사례를 위한 전통적인 인플레이션 딩히와 강체 선체 인플레이션 보트의 주요 차이점.
  water-safety:
    - title: 수상 안전 가이드
      desc: 모든 패들러를 위한 필수 안전 지식 — 날씨, PFD, 자가 구조, 그룹 패들링 프로토콜.
    - title: 구명조끼 및 PFD 가이드
      desc: SUP, 카약, 보트, 전문 사용을 위한 적절한 개인 부양 장치를 선택하는 방법.
    - title: SUP 안전 체크리스트
      desc: 모든 스탠드업 패들보더가 물에 들어가기 전에 따라야 할 사전 출항 안전 체크리스트.
    - title: 차가운 물에서의 패들링 안전
      desc: 차가운 물 조건에서 패들링할 때 필요한 필수 예방 조치, 장비 및 기술.
    - title: 초보자 패들링 실수
      desc: 처음 패들링하는 사람들이 흔히 하는 실수와 이를 피하여 더 안전하고 즐거운 경험을 얻는 방법.
    - title: CE 인증 설명
      desc: 팽창식 수상 기구에 대한 CE 인증 의미 — 기준, 테스트 및 안전에 중요한 이유.
ui:
  read_guide: 가이드 읽기 →
  card_tech: 해양 안전 공학 및 재료 테스트
  card_products: 전체 Aquafarer 제품 카탈로그 보기
  card_trust: CE, ISO 및 BSCI 준수
materials:
  intro_p1: 팽창식 수상 기구의 성능, 내구성 및 안전성은 거의 전적으로 제작에 사용되는 재료에 달려 있습니다. 튜브를 형성하는 직물부터 SUP 보드에 강성을 주는 실까지, 모든 재료 선택은 제품이 물에서 어떻게 성능을 발휘하고 얼마나 오래 지속되는지에 영향을 줍니다.
  intro_p2: '이 가이드는 현대 팽창식 수상 기구에 사용되는 네 가지 핵심 재료: PVC 직물, Hypalon CSM 고무, drop-stitch 코어 구조 및 EVA 폼 데킹을 다룹니다. 이러한 재료를 이해하면 필요에 맞는 제품을 선택하고 최대 수명을 유지할 수 있습니다.'
  labels:
    advantages: 장점
    limitations: 제한 사항
    best_for: '가장 적합한 대상:'
  items:
    - name: PVC (폴리염화비닐)
      summary: 레크리에이션용 팽창식 보트와 SUPs의 업계 표준. 다층 라미네이팅 직물은 우수한 강도 대비 무게 비율을 합리적인 가격으로 제공합니다.
      pros:
        - 저렴함 — Hypalon보다 30-50% 저렴
        - 가볍고 취급이 쉬움
        - 적절한 코팅 시 우수한 UV 저항성
        - 다양한 색상과 마감 제공
        - PVC 패치 및 용제 접착제로 수리가 쉬움
      cons:
        - Hypalon보다 수명이 짧음(7-10년)
        - 추운 온도에서 유연성이 낮음
        - 화학적 저항성 낮음
        - 시간이 지남에 따라 가소제 이동 발생 가능
      best_for: 레크리에이션 SUPs, 저렴한 보트, 임대용, 계절 사용, 담수 및 연안 환경.
    - name: Hypalon (CSM 고무)
      summary: 탁월한 내구성, UV 저항성 및 장수명으로 유명한 고급 합성 고무 재료. 상업용 및 군용 팽창식 보트의 금본위 표준.
      pros:
        - 탁월한 UV 및 오존 저항성
        - 적절한 관리 시 15-20년의 수명
        - 우수한 추운 날씨 유연성
        - 화학 물질 및 오일에 대한 뛰어난 저항성
        - PVC보다 색상 유지 기간이 길음
      cons:
        - PVC보다 상당히 비쌈
        - 무거운 원단 무게
        - 색상 선택이 적음
        - 수리는 전문 접착제가 필요함
        - 전 세계 제조 시설이 적음
      best_for: 상업용 RIBs, 수색 및 구조, 군사용, 열대 기후, 장기 플릿 소유.
    - name: Drop-Stitch 코어
      summary: 인플레이션 SUPs를 혁신한 기술. 수천 개의 폴리에스터 실이 상단과 하단 원단층을 연결하여 경질, 하드 셸 성능을 위한 고압 인플레이션을 가능하게 함.
      pros:
        - 12-20 PSI에서 매우 단단함
        - 경량 — 풀사이즈 보드는 18-30 lbs
        - 보관 및 여행을 위해 평평하게 접힘
        - 우수한 충격 저항성
        - 온도 범위에 따른 일관된 성능
      cons:
        - 고압 펌프 필요
        - 단일층보다 펑크 수리 복잡
        - 표준 인플레이션보다 높은 제조 비용
        - 시간 경과에 따른 압력 손실로 주기적 보충 필요
      best_for: 스탠드업 패들 보드, 카약, 인플레이션 보트용 에어 덱, 인플레이션 휴대성과 경질 성능이 필요한 모든 용도.
    - name: EVA 폼 데크
      summary: SUP 보드와 보트 데크의 트랙션 패드에 사용되는 폐쇄형 셀 EVA (에틸렌-비닐 아세테이트) 폼. 쿠션, 그립, 열 절연 제공.
      pros:
        - 습하거나 건조한 상태에서도 우수한 미끄럼 방지 그립
        - 쿠션감으로 긴 패들에서 피로 감소
        - 차가운 데크 표면에서 열 절연
        - UV 및 염수에 강함
        - 멀티컬러 블록 조각 및 레이저 각인 디자인 가능
      cons:
        - 2-3년 동안 사용 시 마모 가능
        - 층분리를 방지하려면 적절히 접착되어야 함
        - 구조용 아님 — 강성에는 영향 없음
        - 약간의 무게 추가 (보드당 200-400g)
      best_for: SUP 데크 접지, 보트 데크 패딩, 카약 좌석 편안함, 미끄럼 방지 발판이 필요한 모든 표면.
  selection:
    title: 재료 선택 가이드
    subtitle: '주요 사용 사례에 따라 적절한 재료 선택:'
    headers:
      - 사용 사례
      - 추천 재료
      - 이유
    rows:
      - - 레크리에이션 SUP 패들링
        - Drop-stitch PVC
        - 가볍고, 강하며, 저렴 — 일반 패들러에게 이상적인 균형
      - - 가족용 딩기 / 호수 보트
        - PVC (1100 데니어)
        - 비용 효율적, 수리 용이, 레크리에이션 사용에 충분한 내구성
      - - 상업용 RIB / 순찰 보트
        - Hypalon CSM
        - 최대 UV 저항, 15-20년 수명, 화학/오일 저항성
      - - 렌털용 SUP 보드
        - Drop-stitch PVC + EVA 데크
        - 튼튼하고, 수리가 가능하며, 높은 교체율 사용에 대한 우수한 가치
      - - 수색 및 구조 작업
        - Hypalon CSM
        - 극한 조건에서의 신뢰성, 저온 유연성, 화학 저항성
      - - 투어링 / 탐험용 카약
        - Drop-stitch PVC
        - 여행을 위한 접이식 휴대성에 강하고 안정적인 성능
  deep_dive:
    title: 심층 가이드
    topics:
      - title: 해양 등급 PVC
        desc: 다층 적층 PVC 직물 — UV 저항, 마모 테스트 및 데니어 등급 설명.
      - title: PVC 대 Hypalon
        desc: 두 가지 주요 인플레이터블 보트 재료의 결정적 비교 — 비용, 수명, UV 저항성.
      - title: Drop-Stitch 코어
        desc: 수천 개의 내부 실이 12-15 PSI에서 어떻게 단단하고 고압의 인플레이터블 구조를 만드는지.
      - title: RF 용접 기술
        desc: 고주파 용접은 강하고 일관된 이음을 만듭니다 — 작동 원리와 중요성.
      - title: PSI 및 성능
        desc: 공기압이 인플레이션 SUPs 및 보트에 왜 중요한지 — 강성, 중량 용량, 승차감.
      - title: 품질 테스트
        desc: 압력 테스트, 부력 테스트, UV 노화, 파괴 시험 — 우리의 품질 관리 과정.
      - title: EVA 폼 데크
        desc: 폐쇄형 셀 EVA 폼 데크 패드 — SUP 및 보트 데크를 위한 접지력, 편안함, 내구성.
      - title: 재료 관리
        desc: 청소, UV 보호, 곰팡이 예방, 인플레이션 제품 보관 모범 사례.
