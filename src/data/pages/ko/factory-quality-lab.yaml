hero:
  tagline: 품질 관리 실험실
  title: 시험 실험실 및 품질 보증
  subtitle: 독립적인 품질 실험실, ISO 9001 프로세스 적용 — 출하 전 모든 유닛 테스트 완료
intro: Aquafarer는 생산과 독립적으로 운영되는 전용 품질 관리 실험실을 운영합니다. 원자재의 모든 배치와 완제품 모든 보트는 출하 전 문서화된 검사 프로토콜을 거칩니다. 우리의 QC 팀은 관리팀에 직접 보고하여 공정한 품질 결정을 보장합니다.
highlights:
  - value: 100%
    label: 단위 압력 테스트 수행
    detail: 모든 챔버, 모든 보트
  - value: 48 h
    label: 공기 유지 테스트 기간
    detail: 정격 압력의 1.25배에서
  - value: '&lt;5%'
    label: 허용 최대 압력 손실
    detail: 24시간 유지 기간 동안
  - value: AQL 2.5
    label: 주요 결함 기준치
    detail: ISO 2859 샘플링 당
test_procedures:
  - title: 원자재 검사
    description: PVC, Hypalon, drop-stitch 원단 및 하드웨어의 모든 입고 배치는 수락 전에 테스트됩니다. 인장 강도(ASTM D751), 인열 저항(ISO 4674), 및 UV 저항을 확인합니다. 규격 미달 재료는 격리되어 반품됩니다.
    standards:
      - ASTM D751 (인장)
      - ISO 4674 (인열)
      - ISO 4892 (UV)
  - title: 공정 중 QC 체크포인트
    description: 생산 작업자는 각 단계에서 자체 검사를 수행합니다. QC 감사자는 근무 시간 동안 무작위 샘플링을 수행합니다. 용접 박리 테스트는 50유닛마다 수행됩니다. 치수 검사는 20번째 패널마다 이루어집니다.
    standards:
      - ASTM D751 (박리)
      - 내부 100점 체크리스트
      - ISO 2859 샘플링
  - title: 48시간 공기 유지 테스트
    description: 모든 튜브 챔버는 정격 압력의 125%로 팽창시킨 후 48시간 유지됩니다. 압력 센서는 온도 보정과 함께 지속적으로 기록합니다. 5% 이상의 압력 손실이 발생하는 챔버는 자동으로 배치 재검사를 유발합니다.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: 하중 및 균형 시험
    description: 완성된 보트는 안정성, 흘수 및 조종 성능을 위해 최대 정격 용량으로 테스트됩니다. 각 선박은 최종 검사 승인 전에 수상 테스트를 거칩니다.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: 만능재료시험기 (인장)
    spec: 5 kN, ASTM D751 준수
  - name: 압력 감쇠 시험기
    spec: 다채널, 0–50 psi, 데이터로깅
  - name: UV 내후성 챔버
    spec: ISO 4892, 1,000시간 사이클
  - name: 두께 게이지 (디지털)
    spec: 0.01 mm 해상도
  - name: 박리 시험기 (용접)
    spec: 모터 구동, 50 N 용량
  - name: 온도 챔버
    spec: -40 °C ~ +100 °C
  - name: 누수 탐지 탱크
    spec: 6 m × 2 m, 조명 장착
