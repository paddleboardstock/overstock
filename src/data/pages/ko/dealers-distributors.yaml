hero:
  tagline: 딜러십 프로그램
  title: Aquafarer이 되세요<br />유통업체
  subtitle: 50+개국에 서비스를 제공하는 CE 인증 RIB 및 인플레이션 수상 레저기구 제조업체와 파트너가 되세요. 영토 보호, 마케팅 지원 및 기존 해양 유통업체를 위한 경쟁력 있는 가격 제공.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer 딜러십 및 유통업체 프로그램
direct_answer: Aquafarer는 영토 보호, 경쟁력 있는 도매 가격, 마케팅 지원 키트 및 완전한 준수 문서(CE, ISO 9001, BSCI)와 함께 딜러십 및 유통 파트너십을 제공합니다. MOQ은 전용 계정 관리를 통해 주문당 10-20단위부터 시작합니다.
stats:
  - value: 50+
    label: 서비스 대상 국가
    detail: 글로벌 유통 네트워크
  - value: 64
    label: CE-인증 모델
    detail: RIB, 인플레이션, SUP, 안전
  - value: 30-45
    label: 1일 리드 타임
    detail: FOB 칭다오
  - value: 10-20
    label: 유통업체 MOQ
    detail: 주문당 혼합 모델
content_benefits:
  tagline: 파트너십 혜택
  title: 유통업체 이유<br />Aquafarer 선택
  subtitle: 신뢰할 수 있는 공급, 경쟁력 있는 마진 및 전문적인 지원이 필요한 해양 유통업체를 위해 설계된 파트너십입니다.
  items:
    - title: 영토 보호
      description: 자격을 갖춘 유통업체에게 독점 또는 반독점 지역 권한 제공. 귀하의 지역에서 Aquafarer 브랜드를 구축하는 투자를 보호하기 위한 시장 매핑 및 채널 충돌 관리.
      icon: tabler:map-pin
    - title: 경쟁력 있는 도매 가격
      description: 연간 주문량 약정에 따른 계층별 가격 책정. 선행 가격 보장 및 투명한 비용 내역(FOB 칭다오 기준)을 통한 마진 보호 가격 구조.
      icon: tabler:currency-dollar
    - title: 마케팅 지원 키트
      description: 전문적인 제품 사진, 사양서, 준수 문서 템플릿, 소셜 미디어 콘텐츠, 공동 브랜드 마케팅 자료. 신제품 출시와 함께 매년 업데이트됨.
      icon: tabler:photo
    - title: 기술 교육
      description: 영업팀을 위한 제품 교육(가상 또는 현장), 서비스 기술자를 위한 유지보수 및 수리 교육, 고객용 FAQ 및 문제 해결 가이드 제공.
      icon: tabler:school
    - title: 예비 부품 및 애프터 서비스
      description: 우선 배송이 가능한 전용 예비 부품 공급. 빠른 주문 처리를 위해 교체용 튜브 섹션, 밸브, 핀 및 수리 키트 제공. 보증 클레임 처리 지원.
      icon: tabler:tool
    - title: 준수 문서
      description: '귀하의 시장을 위한 완전한 준수 문서 패키지: CE DoC, 제작자 플레이트 데이터, 사용자 매뉴얼 및 규제 등록 지원. 귀하의 준수 부담을 제거합니다.'
      icon: tabler:file-certificate
content_requirements:
  tagline: 우리가 찾는 것
  title: 유통업체<br />요구 사항
  subtitle: 저희는 각 지역에서 Aquafarer 제품을 전문적으로 대표하고 지원할 수 있는 파트너를 찾고 있습니다.
  items:
    - title: 영토 및 시장 지식
      description: 해양, 수상 스포츠 또는 야외 레크리에이션 시장에서 확립된 입지. 수상 기기 제품에 대한 현지 규제, 소비자 선호도 및 유통 채널에 대한 이해.
      icon: tabler:target
    - title: 업계 경험
      description: 해양, 아웃도어 또는 스포츠 장비 유통 분야에서 최소 2년 이상의 경력. 국제 브랜드 및 B2B 도매 운영에서 입증된 실적 보유.
      icon: tabler:briefcase
    - title: 전시장 또는 창고
      description: 제품 전시, 재고 보관 및 고객 서비스를 위한 물리적 시설. 해당 지역의 데모 장치 및 예비 부품 재고를 유지할 수 있는 능력.
      icon: tabler:building-store
    - title: 브랜드 기준 준수
      description: Aquafarer 브랜드 프레젠테이션 기준을 유지하고, 서비스 프로토콜에 따라 고객 지원을 제공하며, 연간 제품 교육 업데이트에 참여하려는 의지.
      icon: tabler:star
content_process:
  tagline: 신청 절차
  title: 4단계 딜러<br />신청 절차
  subtitle: 초기 문의부터 첫 배송까지 — 간단한 온보딩 과정.
  steps:
    - number: '01'
      title: 초기 문의 및 자격 확인
      description: 회사 세부 정보, 관심 지역, 현재 제품 라인 및 연간 판매량 추정치를 포함하여 대리점 신청서를 제출하세요. 저희는 5영업일 내에 검토합니다.
      timeline: 5일
    - number: '02'
      title: 사업 검토 및 조건
      description: 지역 전략, 가격 책정 단계 및 파트너십 조건을 논의하기 위한 가상 회의. 귀하의 시장에 대한 컴플라이언스 문서 요구 사항 검토. 필요 시 NDA 서명.
      timeline: 1-2주
    - number: '03'
      title: 샘플 주문 및 평가
      description: 시장 평가 및 팀 교육을 위해 유통업체 가격으로 초기 샘플 주문(2-5개)을 진행하십시오. 전체 준수 문서 및 데모 준비가 포함되어 있습니다.
      timeline: 30-45일
    - number: '04'
      title: 파트너십 시작 및 지원
      description: 영역 보호가 활성화된 첫 번째 컨테이너 주문. 마케팅 키트 전달, 영업팀 교육 완료, 전담 계정 관리자 배정. 분기별 지속적인 비즈니스 검토 진행 중.
      timeline: 지속
content_application_docs:
  tagline: 지원 서류
  title: 필요한 서류<br />딜러 신청용
  subtitle: Aquafarer 딜러십에 지원하려면, 검토 팀을 위해 다음 서류와 정보를 준비해 주십시오.
  items:
    - title: 사업자 등록증
      description: 법인 명칭, 등록 주소 및 해양, 스포츠 또는 아웃도어 장비 유통을 포함하는 사업 범위를 보여주는 유효한 회사 등록 문서.
      icon: tabler:file-text
    - title: 영역 범위 계획
      description: 관심 있는 지리적 영역, 기존 소매 또는 유통망, 목표 고객 세그먼트, 제품 카테고리별 제안 연간 판매량 (RIB, SUP, 카약).
      icon: tabler:map
    - title: 쇼룸 및 창고 역량
      description: 제품 전시, 재고 보관 및 고객 서비스를 위한 실물 시설. 데모 구역 및 예비 부품 보관 용량을 보여주는 사진 또는 평면도.
      icon: tabler:building
    - title: 재무 능력 증명서
      description: '초기 컨테이너 주문 및 재고 유지 능력을 확인하는 은행 추천서 또는 재무제표. 최소 초기 주문: 20ft 컨테이너 1개 (혼합 모델 10-20개).'
      icon: tabler:coin
    - title: 판매 후 지원 능력
      description: 인플레이션 보트 유지보수 및 수리 교육을 받았거나 받을 수 있는 서비스 기술자. 보증 청구 처리 능력 및 예비 부품 재고 보유.
      icon: tabler:tool
    - title: 이전 브랜드 참조
      description: 현재 또는 이전에 유통한 해양/스포츠 장비 브랜드 목록. 상호 합의 시 연락처 제공 가능. 이전 유통 경험이 없는 스타트업도 강력한 재정적 약속으로 자격을 얻을 수 있음.
      icon: tabler:users
faq:
  title: 딜러십 프로그램 — 자주 묻는 질문
  questions:
    - q: 유통업체의 최소 주문 수량은 얼마인가요?
      a: 유통업체 MOQ는 주문당 10-20개 단위로 시작하며, 혼합 모델(RIB, 인플레이션, SUP)에 대해 유연하게 조정 가능. 시장 평가를 위한 초기 샘플 주문 2-5개 단위 가능하며 유통 가격 적용.
    - q: 독점 권한을 제공하나요?
      a: 독점 권한은 연간 판매량 약속을 충족하고 브랜드 기준을 유지하는 적격 유통업체에게 제공됨. 신흥 시장을 위한 반독점 및 비독점 계약도 가능.
    - q: 어떤 마케팅 지원을 제공하나요?
      a: 전문 제품 사진, 사양서, 준수 문서 템플릿, 소셜 미디어 콘텐츠 라이브러리, 공동 브랜딩 자료를 포함한 종합 마케팅 키트를 제공하며, 신제품 출시 시 매년 업데이트됨.
    - q: 보증 청구는 어떻게 처리되나요?
      a: '유통업체는 보증 청구의 첫 번째 연락 지점 역할을 수행. 우리는 명확한 보증 기준, 사진 문서 프로토콜, 빠른 교체 또는 크레딧 처리를 제공. 보증 조건: 보트 튜브 원단/솔기/선체 5년 제한; SUP 및 액세서리 2년.'
    - q: 자사 브랜드로 Aquafarer 제품을 프라이빗 라벨링할 수 있나요?
      a: 예, 당사의 OEM/ODM 프로그램을 통해 가능. 프라이빗 라벨 옵션에는 사용자 맞춤 튜브 그래픽, 콘솔 브랜딩, 소매 포장, 브랜드 이름의 준수 문서가 포함됨. 자세한 내용은 OEM/ODM 서비스 페이지 참조.
    - q: 유통업체를 위한 준수 문서는 무엇이 포함되나요?
      a: 모든 출하에는 모델별 CE DoC, 제작자 플레이트 데이터, 사용 설명서, 운송 문서가 포함됨. 또한 귀하의 영역에 대한 규제 등록 지원과 지역 준수 요구 사항에 대한 지원을 제공함.
