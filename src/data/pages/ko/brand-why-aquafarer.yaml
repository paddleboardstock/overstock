features3_reasons:
  tagline: 왜 Aquafarer를 선택해야 하나요
  title: 저희와 제휴해야 하는 7가지 이유
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. 거래가 아닌 진짜 제조
      description: 우리는 12,000 m² 규모의 공장을 소유하고 운영합니다. Aquafarer와 협력하면 중개인 없이 귀하의 제품을 설계, 엔지니어링, 제작하는 사람들과 직접 일하게 됩니다.
      icon: tabler:building-factory
    - title: 2. 엔지니어링 주도 접근
      description: 우리의 설계 과정은 제품 카테고리가 아니라 사용 사례에서 시작됩니다. 우리는 보트가 실제로 어떻게 사용될지를 기준으로 선체 형태, 소재 선택 및 구성을 최적화합니다.
      icon: tabler:engine
    - title: 3. 인증된 품질
      description: CE 인증, ISO 품질 시스템, BSCI 준수, REACH 준수, USCG 승인. 저희 64개의 CE 인증 모델은 단순한 주장만이 아니라 국제 기준을 충족합니다.
      icon: tabler:certificate
    - title: 4. 유연한 OEM/ODM
      description: 튜브 색상, 콘솔 배치, 브랜딩, 포장 — 우리는 귀하의 사양에 맞게 맞춤 제작합니다. 최소 주문 수량에 대한 압박 없음. 프로토타입으로 시작하고 자신 있게 확장하세요.
      icon: tabler:adjustments
    - title: 5. 글로벌 물류
      description: 캘리포니아에 있는 미국 창고, 칭다오에서 직배송, 긴급 주문은 항공 운송. 우리는 세관 서류 및 문서를 처리합니다.
      icon: tabler:truck-delivery
    - title: 6. 평생 지원
      description: 우리는 20년 전에 만든 보트도 지원합니다. 정품 부품, 기술 조언, 수리 안내 — 필요할 때 우리 팀이 언제든지 도와드립니다.
      icon: tabler:lifebuoy
    - title: 7. 정직한 사양
      description: 실제 하중 등급, 실제 치수, 실제 무게. 마케팅 부풀리기 없음. 우리가 공개하는 것이 바로 당신이 얻는 것이며 — 독립적인 테스트로 검증되었습니다.
      icon: tabler:ruler-measure
testimonials:
  tagline: 전 세계 브랜드가 신뢰하는
  title: 우리 파트너들이 말하는 것
  items:
    - content: 우리는 중국의 여러 제조업체와 협력해 왔지만, Aquafarer은 그들의 엔지니어링 지원과 일관된 품질로 눈에 띕니다. 그들은 우리의 브랜드를 그들 자신의 브랜드처럼 다룹니다.
      name: — OEM 파트너, 유럽 수상 스포츠 브랜드
    - content: 그들의 Hypalon RIBs는 우리 함대에서 5년 이상 사용되었습니다. 유지보수가 최소화되고, UV 저항성이 뛰어납니다. 튜브에 대한 5년 보증 덕분에 신뢰할 수 있습니다.
      name: — 함대 운영자, 중동 리조트 그룹
    - content: Aquafarer 팀은 개념부터 생산까지 90일 만에 맞춤형 SUP 보드 설계를 개발하도록 도와주었습니다. 품질이 우리의 기대를 뛰어넘었습니다.
      name: — 유통업체, 호주 수상 스포츠
