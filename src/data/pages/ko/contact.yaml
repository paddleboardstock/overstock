hero_text:
  tagline: 연락
  title: 문의하기
contact_form:
  id: form
  title: 메시지를 보내세요
  subtitle: 견적, 기술 질문 또는 파트너십 문의는 저희에게 연락해 주세요. 저희는 영업일 기준 하루 이내에 답변드립니다.
  email_to: info@paddleboardoverstock.com
  submit_button: 문의 보내기 → 견적 받기
  success_message: 감사합니다! 귀하의 메시지가 저희 받은 편지함에 도착했습니다. 저희는 영업일 기준 하루 이내에 답변드리겠습니다.
  error_message: 메시지를 보내는 중에 문제가 발생했습니다. 다시 시도하거나 직접 이메일을 보내주세요.
  default_country_code: '+1'
  captcha:
    label: '스팸 방지: 다음을 해결해 주세요'
  fields:
    - name: 이름
      label: 이름
      row: 1
    - name: 성
      label: 성
      row: 1
    - name: 회사명
      label: 회사 이름
      row: 2
    - name: address
      label: 주소
      row: 3
    - name: zip
      label: 우편번호
      row: 4
    - name: country
      label: 나라
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: 이메일
      row: 5
      type: email
    - name: tel
      label: 전화
      row: 5
      type: tel
      withCountryCode: true
    - name: 주문량
      label: 예상 주문량
      row: 6
      type: select
      options:
        - value: ''
          label: 예상 수량을 선택하세요...
        - value: sample
          label: 샘플 / 시제품 전용
        - value: 5-10
          label: 5–10 단위 (표준 MOQ)
        - value: 100-500
          label: 100–500 단위
        - value: 500-plus
          label: 500+ 단위 (대량 구매 가격)
    - name: customization
      label: 맞춤 설정 필요?
      row: 7
      type: select
      options:
        - value: ''
          label: 맞춤 설정 유형 선택...
        - value: none
          label: 표준 제품(맞춤 없음)
        - value: logo
          label: 맞춤 로고 / 브랜딩 전용
        - value: full
          label: 전체 OEM (크기, 색상, 그래픽, 포장)
        - value: consultation
          label: 잘 모르겠음 — 상담 필요
    - name: 제품 관심
      label: 관심 있는 제품 카테고리
      row: 8
      type: select
      options:
        - value: ''
          label: 제품 카테고리 선택...
        - value: all
          label: 모든 제품 / 전체 카탈로그
        - value: sup
          label: SUP 보드 / 패들보드
        - value: kayak
          label: 팽창식 카약
        - value: rib
          label: RIB 보트
        - value: dinghy
          label: 딩기 / 텐더
        - value: safety
          label: 안전 장비 / 구명조끼
        - value: accessory
          label: 액세서리 (펌프, 노, 가방)
    - name: subject
      label: 제목
      row: 9
    - name: message
      label: 메시지
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: 다른 방법으로 연락하기
  columns: 3
  items:
    - title: 영업 문의
      description: 견적, 구성, 딜러 신청 및 대량 주문.
      icon: tabler:shopping-bag
    - title: 기술 지원
      description: 보증, 수리, 부품 및 운영 관련 문의.
      icon: tabler:tool
    - title: 언론 & 파트너십
      description: 미디어 키트, 스폰서십 및 산업 협력.
      icon: tabler:news
    - title: 전화
      description: +1 279 732 3333 (미국 본사) · +86 13305324192 (공장)
      icon: tabler:headset
    - title: 이메일
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: 글로벌 본사 & 청구
      description: Weihai Dongjilian Co., Ltd., 뉴멕시코, 미국
      icon: tabler:map-pin
map:
  title: 위치
  subtitle: 칭다오 제조 허브 방문
