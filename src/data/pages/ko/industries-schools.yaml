hero:
  tagline: 수상 스포츠 학교 및 교육 센터
  title: 장비 솔루션<br />SUP 및 카약 학교용
  subtitle: 패들 학교, 서핑 교육, 카약 훈련 및 모든 규모의 수상 스포츠 교육 프로그램을 위한 신뢰할 수 있는 상업용 장비.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP 보드 학교 및 교육 센터용
direct_answer: Aquafarer는 전 세계 SUP 및 카약 학교에 상업용 등급의 보드, 안전 장비 및 강사 패키지를 제공합니다. 당사의 장비는 일상적인 수업용으로 제작되어 — 두꺼운 PVC, 강화된 drop-stitch 코어 및 초보자에게 자신감을 주고 강사에게 신뢰성을 제공하는 안정적인 선체 디자인을 갖추고 있습니다. 패키지에는 맞춤 브랜딩, 예비 부품 프로그램 및 교육 자료가 포함됩니다.
solution_offerings:
  - title: 학교 스타터 패키지
    subtitle: 신규 프로그램 및 소규모 교육 센터용
    badge: Popular
    features:
      - title: 학생 보드
        description: 초급 수업용으로 안정적인 플랫폼을 제공하는 10-25개의 올어라운드 SUP 보드 또는 레크리에이션 카약
      - title: 강사용 보드
        description: 코칭용으로 넓고 길며 추가 안정성과 미끄럼 방지 EVA 갑판이 있는 보드
      - title: 안전장비
        description: 라이프 재킷, 리쉬, 호루라기 및 동일 색상의 던지기 가방
      - title: 보관 및 운송
        description: 적층 보드 랙, 패딩 처리된 카약 크래들, 운송용 돌리
      - title: 커리큘럼 지원
        description: 수업 템플릿, 안전 점검표 및 기술 발전 가이드
    cta_text: 내 학교 시작 패키지
    cta_href: /contact
  - title: 학교 프리미엄 패키지
    subtitle: 설립된 학교 및 다중 프로그램 운영자용
    badge: Best Value
    features:
      - title: 전체 함대
        description: 혼합 함대(올어라운드, 투어링, 청소년용) 포함 25–50개의 보드 또는 카약
      - title: 강사 함대
        description: 내장 사운드 시스템 장착 3–5개의 전문 강사용 보드
      - title: 안전 스테이션
        description: PFD, 무선, 응급 처치 및 표지판이 포함된 중앙 안전 장비 스테이션
      - title: 브랜딩 패키지
        description: 보드, 패들, PFD 및 유니폼 전체 로고 인쇄
      - title: 유지 관리 프로그램
        description: 분기별 유지보수 키트, 예비 부품 번들 및 수리 교육
    cta_text: 프리미엄 패키지 구성
    cta_href: /contact
  - title: 학교 프랜차이즈 패키지
    subtitle: 다중 지점 체인 및 프랜차이즈 운영자를 위한
    badge: Enterprise
    features:
      - title: 함대 표준화
        description: 일관된 학생 경험을 위해 모든 지점에서 동일한 장비 사용
      - title: 중앙 주문
        description: 통합 주문, 대량 가격 및 중앙 예비 부품 관리
      - title: 강사 교육
        description: 모든 강사를 위한 장비 취급 및 유지보수 인증
      - title: 공동 브랜드
        description: 프랜차이즈 + Aquafarer 공동 브랜드 옵션
      - title: 확장 지원
        description: 규모 확장 상담, 장비 예측 및 신규 지점 설치
    cta_text: 프랜차이즈 계획 논의
    cta_href: /contact
benefits:
  - title: 일일 수업용 설계
    description: 두꺼운 PVC 및 강화된 레일은 학생들의 일일 사용, 모래 바닥에서의 낙하 및 바위 착지에도 견딥니다.
    icon: tabler:shield
  - title: 안정적인 학습 플랫폼
    description: 더 넓은 선체와 평평한 로커는 초보자에게 자신감을 줍니다. 강사는 장비가 아닌 지도에 집중할 수 있습니다.
    icon: tabler:scale
  - title: 쉬운 보관 및 이동
    description: 인플레이션 디자인으로 작은 공간에도 보관 가능. 공기 제거 후 보드는 표준 차량 트렁크에도 들어가 이동식 수업에 적합합니다.
    icon: tabler:box-seam
  - title: 맞춤 브랜딩
    description: 모든 보드에 학교 로고와 색상 표시. 당신의 브랜드, 당신의 정체성 — 일반 대여 장비가 아닙니다.
    icon: tabler:brush
content_segments:
  tagline: 학교 프로필
  title: 수상 스포츠 교육 솔루션<br />프로그램 유형별
  subtitle: 패들 스쿨, 서핑 아카데미, 대학 프로그램 및 프랜차이즈 운영자는 각각 교육 과정 통합에서 다중 지점 함대 표준화까지 다양한 운영 문제에 직면합니다. 우리는 교육 모델에 맞게 장비 패키지를 구성합니다.
  items:
    - title: 독립 SUP 및 카약 스쿨
      subtitle: 소유주 운영 교육 센터
      description: 소유주 강사가 운영하는 소규모~중규모 학교로 SUP 수업, 카약 훈련 및 인증 과정을 제공합니다. 장비는 일일 수업 사용에 견딜 수 있을 만큼 내구성이 있어야 하며, 작은 사업 예산에 맞게 비용 효율적이어야 하고, 초보자에서 중급 학생까지 단일 함대로 다양하게 활용될 수 있어야 합니다.
      features:
        - 초보자 레슨을 위한 안정적인 전천후 SUP 보드 및 레크리에이션 카약
        - 코칭용 추가 안정성을 갖춘 강사 전용 보드
        - 레슨 계획 템플릿 및 기술 진행 가이드 포함
        - 연간 장비 교체 프로그램 및 반품 시 할인 혜택
    - title: 대학교 및 단과대학 레크리에이션 프로그램
      subtitle: 대규모 학생 레크리에이션 장비
      description: 대학교 레크리에이션 부서에서 캠퍼스 레크리에이션 제공의 일환으로 패들 클럽, 대여 프로그램 및 강습 과정을 운영합니다. 장비는 학기 중 최고 사용량을 견뎌야 하며, 간편한 대여/반납 시스템이 필요하며, 초보 학생부터 고급 패들러까지 다양한 기술 수준을 견뎌야 합니다.
      features:
        - 기관용 사용 주기에 적합한 고내구성 PVC 구조
        - 관리 편의를 위한 기술 수준별 색상 코드 배치
        - RFID 또는 스티커 기반 재고 추적 시스템 호환
        - 학기 단위 주문 및 결제 조건으로 대량 구매 가능
    - title: 서핑 학교 및 서핑 아카데미
      subtitle: 해안 서핑 강습 프로그램
      description: 서핑 학교에서 SUP 서핑, 프론 파들, 서핑 카약 기술을 바다 환경에서 교육합니다. 장비는 파도 구역 조건을 견뎌야 하며 — 충격 저항, 모래 및 염수 내성, 시간별 레슨 사이 간편한 세척 및 복귀가 필요합니다.
      features:
        - 강화된 레일과 충격 저항 구조를 가진 서핑 전용 모양
        - 학생 안전을 위한 소프트 핀 옵션과 코일 리쉬
        - 레슨 사이 쉽게 건조되는 빠른 세척용 패브릭
        - 시즌 종료 시 점검 및 장비 교체 프로그램
    - title: 프랜차이즈 및 다중 지점 체인
      subtitle: 지점 간 표준화된 장비
      description: 여러 도시에 걸쳐 표준화된 교육 프로그램을 운영하는 다중 지점 사업자. 지점 간 장비 일관성이 매우 중요 — 어떤 프랜차이즈 지점을 방문하더라도 모든 학생이 동일한 장비 경험을 해야 합니다. 중앙 주문, 브랜드 통일성, 확대 지원이 필수적입니다.
      features:
        - 모든 프랜차이즈 지점에서 동일한 장비 사양
        - 중앙 집중식 대량 주문 및 가격 혜택
        - '공동 브랜딩 옵션: 프랜차이즈 브랜드 + Aquafarer 공동 브랜드'
        - '신규 지점 설치 키트: 장비, 간판 및 개장 재고'
cta:
  title: 학교에 장비를 갖출 준비가 되었나요?
  subtitle: 맞춤형 장비 계획을 위해 저희 팀에 연락하세요. 모든 규모의 학교와 협력합니다.
  actions:
    - variant: primary
      text: 팀에 문의하기
      href: /contact
    - text: 제품 카탈로그 보기
      href: /products
