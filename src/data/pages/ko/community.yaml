stories:
  tagline: 탐험가 이야기
  title: 진짜 사람들의 진짜 모험
  subtitle: 물 위에서 Paddle Board Overstock 장비를 사용하는 패들러, 가족, 전문가들의 이야기를 들어보세요.
  items:
    - name: 사라 & 마이크
      title: SUP 익스플로러 11 소유자, 캐나다
      content: 우리는 Explorer 11을 가지고 일주일 동안 Algonquin 공원을 여행했습니다. 그것들은 운반과 호수 건너기를 멋지게 소화했습니다. drop-stitch 구조 덕분에 15 PSI까지 부풀릴 수 있었고, 접이식 보드에서 단단한 보드 성능을 얻을 수 있었습니다.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: 앨곤퀸 공원, 캐나다
    - name: 카를로스 R.
      title: 치타 서지 라이더, 스페인
      content: 치타 서지는 해안 순항용으로 제가 가장 자주 사용하는 보드입니다. 생동감 있는 디자인은 해변에서 시선을 사로잡고, 안정성 덕분에 가벼운 파도에서도 자신감을 줍니다. 투어링을 하든 단순히 일몰을 즐기든 훌륭하게 다룰 수 있습니다.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: 코스타 브라바, 스페인
    - name: 리나 & 가족
      title: 흐르는 연꽃 패들러, 스웨덴
      content: 군도에서 주말 가족 모험. 플로잉 로터스는 제가 노를 젓는 동안 제 딸이 서 있을 수 있을 만큼 안정적입니다. 10분 내에 부풀 수 있으며, 트레일러는 필요 없고 물 위에서 순수한 가족 재미만 있습니다.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: 스웨덴 스톡홀름 군도
    - name: 안드레스 중위
      title: 오션 보야저 탐험가, 필리핀
      content: 저는 팔라완 주변 장거리 해안 투어를 위해 제 오션 보이저를 사용합니다. 열대 기후에서 몇 달 동안 매일 사용한 후에도 보드는 여전히 새 것처럼 성능을 발휘합니다. 투어링형 모양은 다른 보드라면 멈췄을 물결을 가르며 나아갑니다.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: 팔라완, 필리핀
    - name: 엠마 T.
      title: 뜨거운 열대의 바람, 처음 체험한 호주
      content: 저는 한 번도 SUP를 타본 적이 없었습니다. Tropical Breeze는 매우 안정적이어서 처음 시도할 때도 자신감이 생겼습니다. 이제는 매주 주말마다 패들링을 하고 있습니다. 배우는 곡선은 거의 없고, 보드도 물 위에서 정말 멋져 보입니다.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: 호주, 골드코스트
