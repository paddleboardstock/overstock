content_challenge:
  tagline: 도전 과제
  title: 어선의 필요성<br />안정성, 사거리 및 내구성
  subtitle: 상업용 어선을 운영하든, 협동 선단을 관리하든, 낚시 전세를 운영하든 — 당신의 배는 매일 안정적으로 작동해야 합니다.
  paragraphs:
    - 어선은 낚싯줄을 작업하고, 어획물을 다루며, 갑판을 안전하게 이동할 수 있도록 안정적인 플랫폼이 필요합니다. 인플레이터블은 RIBs 튜브 설계를 통해 고유한 안정성을 제공하는데, 이는 비슷한 길이의 강체 선체에 비해 큰 장점입니다.
    - 연료 효율성은 운영 비용이 수익성에 직접적인 영향을 미치는 어업 운영에 중요합니다.RIBs 또한 팽창식 보트는 동등한 강체 보트보다 가볍고, 동력이 적으며 연료 소모도 적어 상업 운영자와 선단 예산 관리를 하는 협동조합에 매우 중요합니다.
    - 해양 환경에서의 내구성은 필수적입니다. 염수, 노출, 지속적인 사용은 열 UV 화 없이 혹독한 조건을 견딜 수 있는 소재를 요구합니다. 상업 및 협동 운영자에게 신뢰성은 수익에 직접적인 영향을 미치며, 고장 난 배는 어업 기회를 잃게 만듭니다.
    - Paddle Board Overstock 낚시 구성에는 낚싯대 홀더, 어인공, 미끼 우물, 라이브웰, 그리고 상업, 협동조합, 레크리에이션 운영에 걸친 진지한 어업 용도로 설계된 화물 취급 솔루션이 포함됩니다.
content_solution:
  tagline: 우리의 해결책
  title: 낚시 준비 구성
  subtitle: 모든 Paddle Board Overstock 어선은 귀하의 특정 낚시 용도에 맞게 구성할 수 있습니다.
  list:
    - 로드 홀더 장착 — 공장 설치 또는 애프터마켓 설치 준비 완료
    - 콘솔 위치의 어인/GPS 장착판
    - 전세 및 상업 운영자를 위한 미끼 웰 또는 라이브웰 옵션
    - 캐치 취급을 위한 쿨러/저장 구성
    - 해상 능력용 딥-V 선체 — 정지 시 안정적, 속도 시 부드럽다
    - PVC 또는 Hypalon 튜브 옵션 — Hypalon 장 UV 시간 노출을 위한
    - 아웃보드는 HP HP 모델과 용도에 따라 15에서 115까지 다양합니다
content_segments:
  tagline: 낚시 프로필
  title: 팽창식 낚시 보트 솔루션<br />운영자 유형별
  subtitle: 연안 스포츠 낚시부터 상업용 롱라인업까지, 다양한 어업 작업은 선체 구성, 출력 범위, 갑판 위 장비를 요구합니다. 우리는 모든 보트를 어업, 수역, 작업 스타일에 맞게 맞춤 제작합니다.
  items:
    - title: 상업 어업 회사
      subtitle: 일상 어업, 그물 취급, 어획 운송을 위한 함대 작업정
      description: 상업 어업 회사들은 그물 설치 및 회수, 덫 서비스, 롱라인 작업, 어획 운송을 위해 작업선을 운영합니다. 이 보트들은 매일 바닷물 환경에서 운항하며, 무거운 하중, 지속적인 갑판 조작, 긴 운항 시간을 견뎌야 합니다. 연료 효율성과 낮은 유지보수는 선대 수익성에 매우 중요합니다. 선박은 다양한 해상 조건에서 승무원 조종 장비와 어획물을 위한 안정적인 작업 플랫폼을 제공해야 합니다.
      features:
        - 그물 취급, 덫 쌓기, 어류 저장을 위한 평평한 데크 배치
        - 연료 효율적인 40-115 HP 외부 엔진으로 낮은 일일 운행 비용
        - Hypalon 일상 사용 시 마모 저항성을 위한 중장비 튜브
        - 잦은 도크 및 선박 접촉을 위한 강화 마찰 스트레이크
        - 작업 후 쉽게 세척할 수 있는 셀프 베이링 데크가 있습니다
        - 다선박 운영자를 위한 함대 가격 책정 및 일관된 사양
    - title: 전세 낚시 운영자
      subtitle: 다수 승객 편의, 캐치 핸들링, 안전 인증
      description: 반나절 및 전일 전세 낚시 전세를 운영하는 운영자들 — 내륙 암초 낚시부터 해상 저지 낚시까지 다양합니다. 귀하의 보트에는 안전 인증을 받은 승객 좌석, 여러 낚시꾼을 위한 충분한 데크 공간, 그리고 여행 내내 미끼와 잡힌 잡이를 신선하게 유지할 수 있는 통합 라이브웰이 필요합니다. 손님의 편안함은 여행 리뷰, 재예약, 온라인 평점에 직접적인 영향을 미칩니다.
      features:
        - 충격 흡수 버킷 시트가 있는 콘솔 스티어링
        - 공장 장착 로드 홀더 (4–8 위치)
        - 60–115 HP 외부 범위, 해상 순항 속도
        - CE 상업용 여객 운행을 위한 카테고리 C 또는 B 인증
        - 장거리 여행 시 손님이 편안하게 사용할 수 있도록 비미니 또는 T-탑 선쉐이드가 좋습니다
    - title: 수공예 및 소규모 상업 어부
      subtitle: 일상생활을 위한 신뢰할 수 있는 작업선
      description: 보트를 주요 수입원으로 삼는 독립 어부들 — 그물을 설치하고, 어획을 관리하며, 해안 근처에서 손줄 작업을 합니다. 당신의 우선순위는 연비, 스스로 할 수 있는 간단한 유지보수, 그리고 안정성을 희생하지 않으면서 적당한 어획량과 장비를 처리할 수 있는 배입니다.
      features:
        - 연료 효율적인 15–40 외부 기구 HP , 낮은 운용 비용
        - Hypalon CSM 확장 UV 및 마모 저항을 위한 튜브
        - 그물 취급과 어류 저장을 위한 평평한 데크 배치
        - 팽창식 키일 보호와 함께 쉬운 해변 착륙 능력
    - title: 어업 협동조합
      subtitle: 어획 수집, 회원 운송, 보급품 배포
      description: 어업 협동조합은 회원 어부들로부터 어획물을 수집하고, 외딴 어촌 공동체로 물자를 운송하며, 어획물을 시장에 분배하기 위해 지역사회 기반 선단을 운영합니다. 이러한 작업선은 높은 적재 용량, 신뢰할 수 있는 일상 운용, 그리고 외딴 지역에서의 용이한 유지보수가 필요합니다. 협동조합은 부품 공급과 서비스 접근성이 제한된 개발도상국에서 자주 운영되어, 단순한 외부 구조와 내구성 있는 구조가 필수적입니다.
      features:
        - 어획물 및 보급품 운반을 위한 높은 적재 용량
        - 현장 정비를 쉽게 할 수 있는 간단한 외부 구성입니다
        - PVC Hypalon 예산 유연성을 위한 중장비 또는 건설
        - 화물 고정을 위한 고정 지점이 있는 평평한 갑판
        - 연료 효율적인 운행과 협력 운영 비용 최소화
    - title: 스포츠 및 게임 낚시 애호가 여러분
      subtitle: 진지한 낚시꾼을 위한 성능과 스타일
      description: 경험 많은 낚시꾼들은 먼 곳까지 빠른 속도를 제공하고, 안정적인 스탠드업 파이팅 자세, 그리고 프리미엄 핏 앤 피니시를 제공하는 유능한 낚시 플랫폼을 찾습니다. 이 배는 해안에서 2마일 떨어진 산호초까지 달릴 때나 외딴 하구 후미지를 탐험할 때 편안함을 느껴야 합니다.
      features:
        - RIB 파도에서 부드러운 승차감을 위한 딥-V 선체가 적용되었습니다
        - 콘솔에 미리 배선된 어인기/GPS 마운트 플레이트
        - 베이트웰과 쿨러는 뒷좌석 모듈에 통합되어 있습니다
        - EVA 보트/튜브 그래픽에 맞는 맞춤 데크 색상 옵션
    - title: 낚시 가이드 및 에코 투어 운영자
      subtitle: 방문 낚시꾼을 위한 가이드 낚시 경험
      description: 소규모 방문 낚시꾼 그룹을 생산적인 낚시터로 안내하는 가이드들로, 종종 조류 관찰이나 맹그로브 탐험 같은 생태 관광 요소를 결합합니다. 이 배는 작은 보트에 익숙하지 않은 손님들을 위해 건조하고 편안하게 타야 하며, 승선과 그늘 옵션이 쉽게 제공되어야 합니다.
      features:
        - 비미니 탑 또는 T-탑 장착 지점 공장 설치
        - 원활한 출입 탑승 사다리를 통해 쉽게 재탑승할 수 있습니다
        - 소음을 최소화하기 위한 조용한 4행정 아웃보드
        - 손님용 휴대폰, 지갑, 카메라를 위한 건조 수납 공간
cta:
  title: 낚시 배를 설치하세요
  subtitle: 어업 용도, 목표 어종, 운영 수역에 대해 연락해 주세요 — 적합한 구성을 추천해 드리겠습니다.
  actions:
    - variant: primary
      text: 낚시 보트 구성
      href: /contact
    - text: 해양 제품 보기
      href: /products
