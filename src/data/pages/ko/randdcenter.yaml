hero:
  tagline: 연구개발센터
  title: 연구개발센터
  subtitle: 진전에 집중
intro:
  - Paddle Board Overstock의 연구 개발(R&D) 센터는 수상 스포츠 장비 혁신이라는 우리의 사명을 이끄는 원동력입니다. 우리는 인플레이션 스탠드업 패들 보드(SUPs)와 보트에 대한 끊임없는 혁신을 통해 전 세계 수상 스포츠 애호가들에게 더 안전하고, 더 편안하며, 더 즐거운 제품을 제공합니다. 헌신적인 엔지니어, 디자이너, 그리고 열정적인 수상 스포츠 전문가들로 구성된 팀은 업계의 미래를 형성하며, 품질, 성능, 지속 가능성의 기준을 꾸준히 높이고 있습니다.
  - 우리의 연구개발 시설은 재료 과학자, 조선 설계자, 생산 엔지니어를 한 지붕 아래 모읍니다. 원단 조성 및 선체 시뮬레이션부터 용접 공정 개발과 실제 규모의 해상 시험까지, 제품 개발의 모든 단계는 데이터에 의해 추진되고 테스트를 통해 검증됩니다.
mission:
  tagline: 우리의 미션
  title: 수상 스포츠의 미래를 혁신하다
  pillars:
    - icon: lightning
      title: 기술 발전
      desc: 우수한 제품 성능과 수명을 위해 새로운 재료, 디자인 및 제조 방식을 개척합니다.
    - icon: design
      title: 사용자 중심 디자인
      desc: 인체공학적이고 직관적인 제품 디자인을 통해 사용자 요구를 깊이 이해하고 이를 초과 달성합니다.
    - icon: globe
      title: 지속 가능한 실천
      desc: 환경 친화적인 재료와 공정을 활용하여 우리의 환경 발자국을 최소화합니다.
    - icon: shield
      title: 타협 없는 안전
      desc: 철저한 테스트와 인증을 통해 최고의 안전 기준을 보장합니다.
pillars:
  - title: 기술 발전
    desc: 우수한 제품 성능과 수명을 제공하기 위해 새로운 소재, 디자인 및 제조 공정을 개척합니다.
    icon: tech
  - title: 첨단 소재
    desc: 최첨단 PVC, Hypalon, 복합재료 및 향상된 제품 특성을 위한 지속 가능한 대안을 조사하고 있습니다.
    icon: materials
  - title: 지속 가능성
    desc: '핵심 약속: 우리는 지속 가능한 제조와 재활용 가능한 소재를 통해 환경 관리에 헌신합니다.'
    icon: sustainability
capabilities:
  tagline: 역량
  title: 연구개발 역량
  subtitle: 원자재 연구부터 최종 인증에 이르기까지 제품 개발 전 과정을 완전히 통제할 수 있게 해주는 네 가지 핵심 분야.
  groups:
    - title: 재료 과학 및 직물 기술
      items:
        - PVC 및 Hypalon 제형 분석 및 최적화
        - UV 안정화, 난연성 및 항균 첨가제 개발
        - 다층 직물 적층 및 접착 공학
        - 가속 노화 시험(UV, 열, 습도, 염수 분무)
    - title: 선체 공학 및 수리역학
      items:
        - 파라메트릭 3D 선체 설계 및 CFD 최적화
        - 구조 및 충격 하중을 위한 유한 요소 해석
        - 축척 모형 견인 수조 시험 및 성능 검증
        - 특수 임무 프로필을 위한 맞춤 선체 개발
    - title: 용접 및 접합 기술
      items:
        - RF 유전체 용접 공정 개발 및 최적화
        - 열풍 용접, 핫웨지 용접, 초음파 용접 방법
        - 접착제 접합 및 이음새 테이프 인증
        - 용접 강도 모델링 및 수명 예측
    - title: 테스트, 인증 및 준수
      items:
        - 품질 관리 및 CE 규정 준수 테스트
        - 독립 제3자 테스트 및 인증 지원
        - 조달 자격을 위한 맞춤형 시험 프로토콜 개발
        - 서비스 중 고장 분석 및 근본 원인 조사
rd_numbers:
  tagline: 혁신
  title: 숫자로 보는 연구개발
  stats:
    - value: '14'
      label: 연구개발 엔지니어 및 과학자
    - value: '8'
      label: 활성 특허 및 출원
    - value: '6'
      label: 전문 실험실
    - value: 12년
      label: 평균 팀 경험
rd_services:
  tagline: 맞춤형 연구개발
  title: 파트너를 위한 연구개발 서비스
  services:
    - title: 맞춤 소재 개발
      desc: 우리는 귀하의 운영 환경과 성능 목표에 맞춘 맞춤형 원단 배합, 적층 구조, 접착 시스템을 개발합니다.
    - title: OEM / ODM 제품 엔지니어링
      desc: 개념 스케치부터 생산 준비가 된 엔지니어링 패키지까지 — 우리 팀은 귀사의 브랜드로 보트를 설계, 시제품 제작 및 검증할 수 있습니다.
    - title: 제3자 테스트 및 인증
      desc: 독립적인 소재 테스트, 제품 검증 및 인증 지원을 위해 당사의 ISO 규정 준수 테스트 시설을 사용하십시오.
  cta: 귀하의 연구개발 요구사항에 대해 논의하십시오 →
  cta_link: /contact
vision:
  tagline: 우리의 비전
  title: 수상 스포츠의 미래를 만들어가다
  body: Paddle Board Overstock는 지속적인 혁신, 변함없는 품질, 안전과 지속 가능성에 대한 확고한 헌신을 통해 고무 보트 및 SUP 산업을 선도하고자 하며, 궁극적으로 전 세계 수상 스포츠 애호가들의 경험을 풍부하게 합니다. Paddle Board Overstock 연구개발 센터는 열정과 혁신이 만나는 곳으로, 수상 스포츠 산업의 새로운 기준을 세웁니다.
labs_section:
  tagline: 실험실
  title: 우리의 연구소
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC 패브릭 랩
      description: 해양 환경에서 장기적인 신뢰성을 보장하기 위해 인장 강도, UV 저항, 마모 및 저온 유연성에 대한 PVC 및 Hypalon 튜브 원단의 지속적인 연구 및 테스트.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: 헐 엔지니어링 스튜디오
      description: HDPE, 알루미늄 및 유리섬유 선체의 CAD 기반 설계 및 유한 요소 해석. 모든 선체는 첫 번째 시제품이 제작되기 전에 스트레스 분포와 충격 저항을 위해 디지털로 시뮬레이션됩니다.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF 용접 센터
      description: 정밀한 온도 및 압력 제어가 가능한 전용 고주파 용접 시설로, 해양 산업 표준을 충족하는 고강도 기밀 이음매를 생산하는 팽창식 선박용 시설입니다.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: 유체역학 시험 탱크
      description: 자체 시험 수조에서의 축척 모델 테스트를 통해 다양한 하중과 해상 조건에서 선체 형상, 활주 성능, 안정성 및 연료 효율을 최적화합니다.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: 프로토타입 작업실
      description: 신모델이 제작되고 장착되며 바다 시운전을 받는 본격적인 프로토타입 제작 및 장비 시설. 모든 프로토타입은 생산 승인을 받기 전에 최소 20시간의 수중 테스트 프로그램을 거칩니다.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: 품질 및 검사 실험실
      description: 전담 품질 보증 실험실에서는 인장 시험, 공기 유지 사이클 테스트, 솔기 박리 시험 및 재료 인증을 수행하여 작업장을 떠나는 모든 보트가 당사에서 발표한 사양을 충족하도록 합니다.
      href: /randdcenter/quality-inspection-lab
