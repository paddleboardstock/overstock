hero:
  tagline: 중요한 표준에 맞춰 제작됨
  title: 신뢰 Paddle Board Overstock
  subtitle: |
    64 CE 인증 모델 — 안전성 테스트 완료,<br />
    내구성과 성능. 지름길은 없습니다. 예외는 없습니다.
  taglineSection: 인증됨. 테스트 완료. 증명됨.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  imageAlt: Paddle Board Overstock 제품 품질 검사 진행 중
stats:
  title: Paddle Board Overstock 수치로 보면
  stats:
    - title: CE 6185
      description: 64개의 CE 인증 레크리에이션 모델이 EU 안전 기준을 충족 — TÜV 라인란드 인증
    - title: ISO 9001:2015
      description: 2022년부터 SGS 인증을 받은 품질 관리 시스템
    - title: BSCI & REACH
      description: 윤리적 제조 및 EU 자재 준수 — 인터텍에서 검증
    - title: 5년 보트 보증
      description: 튜브 원단, 솔기, 선체 — SUP 및 액세서리에 대해 2년 보증. 결함 없는 비율 99.3% (ISO 2859개당 AQL 2.5개)
features3_certifications:
  title: 인증 및 규정 준수
  subtitle: 모든 제품은 독립적으로 테스트되며, 64개 모델이 국제 표준에 따라 CE 인증을 받았습니다.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE 인증
      description: 카약, 딩기, RIBs를 포함한 SUPs 전반의 64개 CE 인증 모델이 유럽 CE 레크리에이션 수상기구 안전 기준을 충족합니다. 각 제품은 출고 전에 압력, 부력 및 하중 테스트를 거칩니다.
      icon: tabler:certificate
    - title: ''
      description: 우리 12,000 m² 칭다오 시설은 ISO 9001 품질 관리 시스템 하에서 운영됩니다. 모든 생산 배치는 추적 가능하며, 문서화되고, 검사됩니다.
      icon: tabler:clipboard-check
    - title: BSCI 사회적 준수
      description: 우리는 BSCI 인증을 받아 윤리적인 노동 관행, 안전한 근로 조건, 그리고 공급망 전반에 걸친 환경 책임을 보장합니다.
      icon: tabler:users
    - title: REACH & RoHS
      description: 모든 재료 — PVC, Hypalon, EVA 폼, 접착제 — 는 EU REACH 및 RoHS 규정을 준수합니다. 제한 물질 없음, 타협 없음.
      icon: tabler:flask
    - title: 재료 시험실
      description: 사내 소재 실험실은 생산 전에 모든 원단 배치에 대해 인장 강도, UV 저항, 봉제선 무결성 및 마모를 테스트합니다.
      icon: tabler:microscope
    - title: 5년 보트 보증
      description: Paddle Board Overstock 보트는 튜브 패브릭, 솔기 및 선체에 대해 5년 제한 보증이 적용됩니다. SUP 보드와 액세서리는 2년 보증이 제공됩니다. 우리는 우리가 만드는 것을 믿습니다.
      icon: tabler:shield-check
testimonials:
  tagline: 고객 신뢰
  title: 우리 고객의 말
  subtitle: 처음 노를 젓는 사람부터 전문 선단 운영자까지 — 왜 그들이 Paddle Board Overstock를 신뢰하는지 확인해보세요.
  items:
    - content: 저희는 전체 렌탈 함대를 Paddle Board Overstock RIBs로 장착했습니다 — 세 곳에서 총 12척의 보트. 두 시즌 동안, 고장 없음. CE 인증 문서 덕분에 보험 승인도 원활하게 진행되었습니다. 그들의 엔지니어 팀은 심지어 브랜드에 맞게 튜브 색상까지 맞춤 제작했습니다.
      name: 마르코 발렌티
      title: 운영 이사, Adriatic Adventure Tours — 두브로브니크, 크로아티아
    - content: 처음 구매하는 사람으로서, 해외에서 주문하는 품질이 걱정됐습니다. 제가 요청하기도 전에 그들이 공유해준 ISO 문서와 제3자 테스트 보고서는 저에게 완전한 신뢰를 주었습니다. 보드는 6일 만에 도착했고 제 기대를 뛰어넘었습니다.
      name: 제임스 소런톤
      title: SUP Explorer 11 소유주 — 밴쿠버, 캐나다
    - content: 저희는 해안 순찰 함대 전역에서 24개의 Paddle Board Overstock RIBs를 운영합니다. 그들의 QC 프로세스는 모든 배치에서 일관되며 — 동일한 솔기 품질, 동일한 밸브 위치, 동일한 압력 등급이 매번 동일합니다. 장비에 생명이 달려 있을 때, 이러한 반복 가능성은 중요합니다.
      name: 중령 안드레스 레예스
      title: 해양 조달 책임자, 필리핀 해안 경비대 보조 — 마닐라, 필리핀
features3_lab:
  title: 사내 테스트 및 품질 실험실
  subtitle: 모든 원자재 배치와 완제품은 출하 전에 현장 시험실을 거칩니다.
  columns: 3
  isBeforeContent: true
  items:
    - title: 인장 강도 테스트
      description: '모든 PVC 원단 롤은 ASTM D751 기준에 따라 테스트됩니다. 최소 요구 사항: 350 N/cm 경사 및 위사. 불합격 배치는 공급업체로 반송 — 입고 자재의 약 3%를 거부합니다.'
      icon: tabler:scale
    - title: UV 가속 노화 테스트
      description: 원단 샘플은 1,000시간 QUV 가속 풍화 (ASTM G154)를 거칩니다. UV 노출 후 인장 강도 유지율은 80% 이상이어야 합니다. 제품은 실외 사용 기준으로 3+년 등급입니다.
      icon: tabler:sun
    - title: 솔기 박리 강도
      description: RF 용접 솔기는 최소 5 N/mm 박리 강도( ASTM D751)를 테스트합니다. 수작업 접착 Hypalon 솔기는 3.5 N/mm 테스트. 각 생산 배치마다 솔기 샘플을 파괴 시험 후 보관합니다.
      icon: tabler:stack
    - title: 24–48시간 압력 유지
      description: '모든 팽창 제품은 정격 PSI의 1.25배로 팽창 후 24–48시간 동안 모니터링합니다. 허용 최대 압력 저하: 5%. 이 테스트를 통과하지 못한 제품은 다시 작업 후 재테스트 후 출하합니다.'
      icon: tabler:wind
    - title: 밸브 사이클 테스트
      description: 모든 밸브 설계는 실험실에서 10,000회 개폐 사이클을 거칩니다. 사이클 후 밸브는 1.25배 정격 압력에서 기밀을 유지해야 합니다. 모든 Paddle Board Overstock 밸브는 5+년 정기 사용 기준 등급입니다.
      icon: tabler:rotate
    - title: 내한균열 저항
      description: 재료는 -30°C에서 4시간 동안 ISO 4646에 따라 테스트됩니다. 균열이나 취성 발생 없음. 제품은 겨울 보관 및 -10°C 주변 온도까지의 냉수 사용 가능 등급입니다.
      icon: tabler:snowflake
steps2_manufacturing:
  title: 품질 보장 방법
  subtitle: 원자재 검사부터 최종 압력 테스트까지 — 모든 제품은 철저한 품질 체인을 거칩니다.
  items:
    - title: 원자재 검사
      description: 모든 PVC 원단 롤은 생산에 들어가기 전 두께, 인장 강도, UV 저항성을 테스트합니다.
      icon: tabler:search
    - title: 공정 중 QC
      description: 용접 솔기, 밸브 설치 및 챔버 접착은 조립 각 단계에서 검사됩니다.
      icon: tabler:eye
    - title: 압력 시험
      description: 모든 팽창식 제품은 1.25배 정격으로 팽창 PSI 하여 24–48시간 동안 공기 유지와 이음새의 완전성을 확인합니다.
      icon: tabler:wind
    - title: 최종 검사
      description: 각 유닛은 마감, 하드웨어, 포장 상태를 검사한 후 배송 승인을 받습니다. 배치 샘플은 파괴 검사를 위해 저희 실험실로 이동합니다.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB 보트 FAQ
  subtitle: 저희 강체 팽창식 보트에 관한 흔한 질문들입니다.
  columns: 2
  items:
    - title: 어떤 크기의 RIB 보트를 Paddle Board Overstock 제공하나요?
      description: 저희는 RIB 2.5m에서 7.6m까지 35가지 모델을 제공하며, 컴팩트 텐더부터 중장비 상업용 및 순찰선까지 다양합니다. 각 모델은 다양한 구성 옵션으로 제공됩니다.
    - title: 전통적인 RIB 고무보트와 전통적인 고무보트의 차이점은 무엇인가요?
      description: (RIB리지드 헐 인플레이터블 보트)는 견고한 유리섬유 또는 알루미늄 딥-V 선체와 팽창식 또는 튜브를 결합한 구조입니다 Hypalon PVC . 이로 인해 하드 보트의 안정성과 적재 능력, 그리고 인플레이터블의 충격 흡수와 부력을 동시에 제공합니다.
    - title: 어떤 엔진과 호환 Paddle Board Overstock RIBs되나요?
      description: 모델 RIBs HP 에 따라 3에서 250까지 엔진 엔진을 지원합니다 HP . 각 제품 페이지에는 최대 엔진 출력 명시가 나와 있습니다. 최적의 엔진 출력은 딜러와 상담하시기 바랍니다.
    - title: Paddle Board Overstock RIBs CE 자격증이 있나요?
      description: 네. 모든 레크리에이션 RIB 모델은 CE 레크리에이션 수상 기구에 관한 적용 가능한 유럽 기준에 따라 인증을 받았습니다. 상업용 및 순찰 모델은 추가적인 안정성과 하중 요구사항을 충족합니다.
    - title: 보트의 보증 기간은 어떻게 RIB 되나요?
      description: 모두 Paddle Board Overstock RIBs 튜브 패브릭, 솔기, 선체에 대해 5년 제한 보증이 제공됩니다; 5년간 보장된 인플레이션 밸브; 1년간 공장 장착 액세서리가 보장됩니다.
    - title: 공기 챔버가 몇 개 Paddle Board Overstock RIBs 나 있나요?
      description: 저희 RIBs 엔진은 모델 길이에 따라 3개에서 7개의 독립 공기 챔버를 제공합니다. 이 다중 챔버 설계는 한 구획이 손상되어도 보트가 떠 있는 상태를 보장합니다.
faqs_inflatable:
  title: 팽창식 보트 FAQ
  subtitle: 우리의 팽창식 딩기, 카약, 보트에 관한 흔한 질문들입니다.
  columns: 2
  items:
    - title: Paddle Board Overstock 팽창식 보트에는 어떤 재료가 사용되나요?
      description: 저희는 모델에 따라 군용 등급 PVC (1100 데니에)과 프리미엄Hypalon/CSM고무를 사용합니다. 두 재료 모두 UV안정화되고 마모 방지가 되어 있으며 EU 및 규정을 준수합니다 REACH RoHS .
    - title: 풍선 보트는 얼마나 오래 지속되나요?
      description: 적절한 관리만 하면 고 PVC 품질의 고무보트는 7년에서 10년 정도 지속되며, Hypalon 모델은 15년에서 20년까지 사용할 수 있습니다. 정기적인 청소, UV 보호, 적절한 보관은 서비스 수명을 크게 연장합니다.
    - title: 고무식 보트에 필요한 유지보수는 무엇인가요?
      description: 기본 유지보수로는 매번 사용 후 신선한 물로 세척하기(특히 염수에서), 보관 전 건조, 밸브 밀봉 매년 점검, 튜브 보호제 발라기가 포함됩니다 UV . 사용하지 않을 때는 장시간 햇빛 노출을 피하세요.
    - title: 고무보트를 바닷물에서 사용할 수 있나요?
      description: 네. 모든 Paddle Board Overstock 팽창식 보트는 담수와 염수 모두를 위해 설계되었습니다. 염수 노출 후에는 신선한 물로 헹구고 충분히 건조하여 부식과 천 염분 결정화를 방지할 것을 권장합니다.
    - title: 팽창식 보트는 어떻게 보관하나요?
      description: 보관 전에 배를 완전히 빼고, 청소한 뒤 건조하세요. 느슨하게 말아야 하며(꽉 끼는 부분은 피하고), 직사광선이 닿지 않는 서늘하고 건조한 곳에 보관하며, 콘크리트 바닥은 수분 흡수를 방지해 놓으세요.
    - title: 팽창식 보트의 무게 수용 능력은 얼마 Paddle Board Overstock 인가요?
      description: 무게 허용 범위는 가장 작은 모델의 경우 290kg에서 대형 상업용 제품의 경우 2000kg 이상까지 다양합니다. 각 제품 페이지에는 특정 모델의 최대 하중 등급이 표시되어 있습니다.
faqs_sup:
  title: SUP 게시판 FAQ
  subtitle: 우리 스탠드업 패들 보드에 대한 일반적인 질문들.
  columns: 2
  items:
    - title: 어떤 SUP 보드 크기가 사용 가능한가요?
      description: 저희는 9피트에서 12피트까지 SUP 보드를 제공하며, 올라운드, 투어링, 요가 및 특수 디자인을 포함합니다. 저희의 가장 잘 팔리는 모델에는 트로피컬 브리즈(10피트)와 오션 보이저(11피트)가 있습니다.
    - title: drop-stitch 건설이란 무엇입니까?
      description: Drop-stitch 건설은 상단과 하단 보드를 연결하는 수천 개의 폴리에스터 실을 사용하여 높은 공기 압력(15–20 PSI)을 견디고 견고하고 안정적인 플랫폼을 제공합니다. 이는 프리미엄 인플레이션 SUPs의 산업 표준입니다.
    - title: SUP 보드의 무게 제한은 얼마입니까?
      description: 저희 SUP 보드는 모델과 부피에 따라 최대 150kg까지 지원합니다. Leviathan 웨이크보드는 대형 라이더와 요가 사용을 위해 설계된 가장 높은 용량의 모델입니다.
    - title: 완전한 SUP 패키지를 제공하나요?
      description: 네. 모든 SUP 보드는 3피스 알루미늄 패들, 고압 핸드 펌프, 코일 리시, 여행용 백팩, 수리 키트를 포함한 완전한 패키지와 함께 배송됩니다. 일부 모델에는 탈부착 가능한 핀 세트도 포함됩니다.
    - title: SUP 보드의 보증 기간은 얼마입니까?
      description: 모든 Paddle Board Overstock SUP 보드는 정상적인 사용 시 이음새 파손, 밸브 결함, 재료 박리 등을 포함한 제조 결함에 대해 2년 보증이 제공됩니다.
    - title: SUP 보드를 부는 데 얼마나 걸리나요?
      description: 포함된 핸드 펌프를 사용하면 15 PSI까지 완전히 부는 데 약 8~12분이 걸립니다. 더 빠른 부풀림을 원하시면, 보드를 4분 이내에 부를 수 있는 Paddle Board Overstock 12V 전동 펌프를 추천합니다.
cta:
  title: 직접 인증서를 보고 싶으신가요?
  subtitle: 당사의 인증 포트폴리오, 공장 감사 보고서 또는 자재 적합성 문서를 요청하십시오. NDA는 필요하지 않습니다.
