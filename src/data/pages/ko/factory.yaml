qc_section:
  tagline: 품질 관리
  title: 테스트 및 품질 보증 프로세스
  subtitle: 모든 보트는 출하 전에 의무 테스트를 거칩니다. 품질 실험실은 생산과 독립적으로 운영되며 경영진에게 직접 보고합니다.
  steps:
    - step: '1'
      title: 원자재 검사
      desc: ', 그리고 PVCHypalondrop-stitch 섬유는 생산 전에 인장 시험(ASTM D751), 찢어짐 전파, 저항 검증을 거칩니다 UV .'
    - step: '2'
      title: 48시간 공기 유지 테스트
      desc: 모든 튜브 챔버는 정격 압력의 125%로 팽창하고 48시간 동안 유지됩니다. 압력 강하가 5%를 초과하면 자동 거부 및 이음 재검사가 촉발됩니다.
    - step: '3'
      title: 하중 및 균형 시험
      desc: 완성된 보트는 최대 정격 용량으로 적재되고 안정성, 선박 상태, 조종성 검사를 받습니다. 각 선박은 최종 검사 전에 수상 검사를 거칩니다.
oem_section:
  tagline: OEM 프로젝트
  title: 브랜드 및 OEM 파트너십 사례 연구
  subtitle: 컨셉부터 컨테이너까지 — 글로벌 브랜드가 인플레이션 수상기구 라인을 출시하고 확장할 수 있도록 돕는 방법입니다.
  cases:
    - challenge: 유럽의 야외 소매업체는 SUP 독특한 데크 그래픽, 친환경적이고 소매용 포장을 갖춘 프라이빗 라벨 라인을 필요로 했으며PVC, 이 모든 것을 60일 내에 배송해야 했습니다.
      solution: 맞춤형 디지털 인쇄 파일을 개발하고, 소스 준수를 기준으로 하며REACHPVC, 3라운드에서 1라운드로 압축하여 칭다오 공장에 디자인 팀을 배치했습니다.
      result: 서명된 PO부터 55일 만에 FOB4개 SKU에 걸쳐 2,400단위. 첫 컨테이너가 도착하기 전에 다시 주문했습니다.
    - challenge: 미국 수상 스포츠 스타트업은 drop-stitch 맞춤형 선체 형태, 공동 브랜드 포장, BSCI 소매 배치 인증을 갖춘 고성능 카약이 필요했습니다.
      solution: 기존 drop-stitch 카약 몰드를 로커 프로파일 수정, 공동 브랜드 패키지 아트워크 개발, 완전한 BSCI 감사 문서 제공.
      result: 미국 주요 3개 아웃도어 체인에 성공적으로 상장됨. 첫 해에 5,000+대, 98% 판매율.
    - challenge: 호주 유통업체는 CERIB 맞춤형 튜브 색상, Hypalon 업그레이드 옵션, 호주 표준 AS 1799 준수가 포함된 인증 라인업을 요구했습니다.
      solution: 일본 공급업체로부터 공급받은 4개의 튜브 색상 변형으로 사전 생산 샘플을 제작 CSM Hypalon 하고, 제3자 AS 1799 준수 테스트를 조정했습니다.
      result: RIB 호주/뉴질랜드 시장에서 3모델 라인업을 출시했습니다. 이후 12 순찰에 대한 정부 입찰에서 낙찰되었습니다RIBs.
faq_section:
  tagline: 자주 묻는 질문
  title: B2B & OEM 자주 묻는 질문
  questions:
    - q: MOQOEM 인플레이터블 보드의 최소 주문 수량()은 얼마 SUP 인가요?
      a: MOQ 표준 모델은 5개에서 10개씩 시작 OEM 됩니다. 맞춤 금형과 개인 라벨 프로젝트는 복잡성에 따라 최소 200개 정도 필요합니다. 신제품 출시를 위한 시험 주문과 샘플 생산이 가능합니다.
    - q: Aquafarer BSCI 자격증을 보유하나요?
      a: 네. 우리 공장은 유효한 BSCI 사회적 준수 인증을 유지하고 있으며(감사 보고서는 요청 시 제공됩니다). 또한 ISO 품질 관리를 위해 9001:2015 인증을 보유하고 있으며, 64개 제품 모델이 라인 CE TÜV 란트 인증을 보유하고 있습니다.REACH 그리고 RoHS 모든 출하마다 준수 문서가 제공됩니다 OEM .
    - q: 주문의 일반적인 리드 타임은 얼마나 OEM 되나요?
      a: 표준 리드 타임은 확인된 구매 주문(PO) 및 보증금 기준으로 30~45일입니다. 맞춤 금형 개발은 금형 제작에 15~20일이 추가됩니다. 긴급 주문 및 여름 전(1월~3월) 시즌 급증 주문을 위해 신속 생산 서비스를 제공합니다.
    - q: 당신은 FOB 칭다오 또는 CIF을 우리 항구로 배송할 수 있습니까?
      a: 네. 저희는 FOB 칭다오, CIF 주요 글로벌 항구, 그리고 DDP 자격을 갖춘 파트너에게 배송합니다. 저희 물류 팀은 컨테이너 예약, 수출 서류 작성, 통관을 관리합니다. 저희는 EU, 미국, 호주, 아시아 시장을 포함하여 50+개국에 배송합니다.
b2b_moq: '표준 MOQ: 모델당 5–10개 단위 (SUP/카약/drop-stitch). RIB MOQ: 2–5개 단위. 새로운 파트너십을 위한 시범 주문 환영.'
production_flow:
  tagline: 생산 흐름
  title: 재료에서 완성된 보트까지
  subtitle: 모든 보트는 각 단계마다 QC 점검이 있는 6개의 생산 단계를 거칩니다. 지름길도, 검사를 건너뛰는 것도 없습니다.
  stages:
    - stage: '01'
      title: 자재 수령 및 입고 품질 검사
      description: 모든 입고 자재는 ERP 시스템에서 배치/로트 번호로 기록됩니다. PVC 원단 롤, drop-stitch 코어, 밸브, 접착제 및 하드웨어는 QC 승인까지 격리됩니다.
      qc_check: 인장 강도 (ASTM D751), 인열 저항 (ISO 4674), 두께 게이지, 접착제 점도, 육안 결함 검사
      qc_threshold: 100%의 배치 검사. 인장 강도가 사양의 90% 미만이거나, 인열 강도가 사양 최소치 미만이거나, 시각적 결함이 있으면 거부
      responsibility: 도착 예정 QC 팀 (검사원 3명)
    - stage: '02'
      title: CNC 절단 및 자재 준비
      description: 컴퓨터 최적화 배치 기능은 PVC 원자재에 패널을 배치하여 낭비를 최소화합니다. 자동 CNC 절단 기계는 0.1 mm 위치 정확도를 유지합니다.
      qc_check: CAD DXF 파일에 대한 치수 검사, 모서리 품질 검사, 패널 수 검증
      qc_threshold: 매 20번째 패널 측정. 허용오차 ± 0.5 mm. 허용오차를 초과한 경우 배치 거부 (>2%)
      responsibility: 절단 작업장 책임자
    - stage: '03'
      title: 용접 및 Drop-Stitch 접합
      description: Drop-stitch 코어는 열 적층을 사용하여 외부 PVC 라미네이트에 접합됩니다. 튜브 챔버는 RF 용접 또는 열풍 용접됩니다. 레일 밴드는 삼중층 융합 접합됩니다.
      qc_check: 50개 단위마다 박리 시험(ASTM D751), 용접 폭 측정, 열풍 온도 기록 검토, 백라이트 아래 시각적 이음 검사
      qc_threshold: 박리 강도 최소 8 N/cm. 용접 폭 허용 오차 ±1 mm. 눈에 보이는 채널링이 있는 경우 = 불합격
      responsibility: 용접 QC (교대당 검사원 2명)
    - stage: '04'
      title: 조립 및 장비 설치
      description: '보트는 모든 부품이 결합되는 최종 조립 단계로 이동합니다: 선체 + 튜브, 밸브 설치, D링, 손잡이, 핀 박스, 운반 가방 장착. 각 유닛은 100포인트 조립 체크리스트를 따릅니다.'
      qc_check: 단위별 100점 체크리스트 서명, 밸브 기능 테스트(10회 개폐 사이클), 하드웨어 토크 확인, 육안 검사
      qc_threshold: '안전 관련 핵심 부품(밸브, D-링, 손잡이)에 대한 무결점 정책. 경미한 외관: AQL 2.5 (ISO 2859)'
      responsibility: 조립 팀장 + 라인 QC
    - stage: '05'
      title: 압력 테스트 및 품질 보류
      description: 모든 챔버는 정격 압력의 1.25배(일반적으로 20–25 PSI)까지 팽창시킨 후 24–48시간 동안 유지됩니다. 압력 센서는 지속적으로 기록합니다. 압력이 5% 이상 감소한 챔버는 거부되고 솔기 재검사를 위해 보내집니다.
      qc_check: 24시간 압력 유지 기록, 센서 보정 매일 확인, 온도 보정 압력 측정, 수리 후 솔기 재시험
      qc_threshold: 24시간 동안 안정된 온도에서 최대 5% 압력 강하. 이를 초과하는 챔버가 있을 경우 전체 생산 배치 100% 재검사
      responsibility: 품질 연구소(생산과 독립, 경영진에 보고)
    - stage: '06'
      title: 최종 검사 및 포장
      description: 최종 외관 및 기능 검사. 표면 결함, 색상 일관성, 라벨/BIN 확인, 포장 무결성 및 부속품 완전성 확인. 제품은 진공 포장 후 박스에 담아 팔레트에 적재하여 컨테이너에 선적.
      qc_check: 전체 외관 검사, SKU에 따른 부속품 체크리스트, 포장 낙하 테스트(1m, 무작위 샘플), 라벨/바코드 스캔 확인
      qc_threshold: AQL 주요 결함에 대해 2.5, AQL 경미한 결함에 대해 4.0. 안전 결함에 대해 제로 허용. 모든 유닛 100% 외관 검사.
      responsibility: 최종 QC 팀(검사원 4명) + 포장팀 팀장
