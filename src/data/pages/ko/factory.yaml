  system: 맞춤 ERP(내부 시스템) + 각 작업 주문서마다 물리적 배치 태그 부착
  coverage: 생산 자재 100% — PVC, Hypalon, drop-stitch 원단, 접착제, 밸브, 하드웨어, 포장
  records_retained: 10년(CE 2013/53/EU 요구사항 기준)
  suppliers:
