workshops_section:
  tagline: 워크숍
  title: 제조 워크숍
  workshops:
    - title: PVC 절단 및 소재 준비
      description: 자동 CNC 절단 기계가 PVC, Hypalon, drop-stitch 직물을 서브밀리미터 정확도로 가공합니다. 컴퓨터 최적화 배치로 자재 낭비를 최소화하고 용접 전에 모든 패널이 치수 규격을 충족하도록 보장합니다.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: 튜브 용접 및 열 실링
      description: 전용 용접 워크숍에는 열 실링 기계와 RF 유전 용접 프레스가 있습니다. 열풍 열 실링기는 PVC 튜브 챔버를 접합하고 용융시키며, RF 용접은 ISO 9001 요구 사항을 초과하는 강력한 기밀 용접선을 생성합니다.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB 선체 생산 — 유리섬유
      description: RIB 보트 선체는 폴리에스터 및 비닐에스터 수지 시스템을 사용한 핸드 레이업 유리섬유 몰딩으로 제작됩니다. 각 층은 일관된 품질을 위해 손으로 말고 진공 백 처리됩니다. 겔코트 스프레이 부스는 고광택, UV-저항성 해양 마감을 제공합니다.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP 인쇄 및 장식
      description: SUP 보드는 풀컬러 그래픽을 위한 디지털 인쇄와 로고 및 반복 패턴을 위한 실크스크린 인쇄로 장식됩니다. 디지털 프린터는 사진 품질의 데크 디자인을 출력하고, 실크스크린 인쇄는 내구성이 있으며 생생한 브랜드 마크를 제공합니다.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: 최종 조립 및 장비 설치
      description: 유리섬유 선체와 PVC 튜브를 결합하고, 엔진을 장착하며, 조종 및 제어 장치를 연결하고 전기 시스템을 배선하는 조립 라인. 각 보트는 팀장이 승인한 100포인트 조립 체크리스트를 따릅니다.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: 품질 테스트 및 검사
      description: 완성된 모든 보트는 배송 전에 필수 공기 유지 테스트, 봉합선 박리 검증 및 전체 시스템 점검을 거칩니다. 품질 실험실은 생산 부서와 독립적으로 운영되며 경영진에게 직접 보고합니다.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
