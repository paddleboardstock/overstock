testing_section:
  tagline: 품질 관리
  title: 테스트 및 품질 보증 프로세스
  description: 모든 보트는 출하 전에 의무 테스트를 거칩니다. 품질 실험실은 생산과 독립적으로 운영되며 경영진에게 직접 보고합니다.
  steps:
    - title: 원자재 검사
      desc: PVC, Hypalon, 및 drop-stitch 원단은 배치가 생산에 들어가기 전에 인장 시험, 찢김 전파 시험 및 UV 저항 검증을 수행.
    - title: 48시간 공기 유지 테스트
      desc: 모든 튜브 챔버는 정격 압력의 125%로 팽창하고 48시간 동안 유지됩니다. 압력 강하가 5%를 초과하면 자동 거부 및 이음 재검사가 촉발됩니다.
    - title: 하중 및 균형 시험
      desc: 완성된 보트는 최대 정격 용량으로 적재되고 안정성, 선박 상태, 조종성 검사를 받습니다. 각 선박은 최종 검사 전에 수상 검사를 거칩니다.
case_studies:
  tagline: OEM 프로젝트
  title: 브랜드 및 OEM 파트너십 사례 연구
  description: 컨셉부터 컨테이너까지 — 글로벌 브랜드가 인플레이션 수상기구 라인을 출시하고 확장할 수 있도록 돕는 방법입니다.
  labels:
    challenge: 도전
    solution: 해결책
    result: 결과
  cards:
    - challenge: 유럽의 야외 소매업체는 SUP 독특한 데크 그래픽, 친환경적이고 소매용 포장을 갖춘 프라이빗 라벨 라인을 필요로 했으며PVC, 이 모든 것을 60일 내에 배송해야 했습니다.
      solution: 맞춤형 디지털 인쇄 파일을 개발하고, 소스 준수를 기준으로 하며REACHPVC, 3라운드에서 1라운드로 압축하여 칭다오 공장에 디자인 팀을 배치했습니다.
      result: 서명된 PO부터 55일 만에 FOB4개 SKU에 걸쳐 2,400단위. 첫 컨테이너가 도착하기 전에 다시 주문했습니다.
    - challenge: 미국 수상 스포츠 스타트업은 drop-stitch 맞춤형 선체 형태, 공동 브랜드 포장, BSCI 소매 배치 인증을 갖춘 고성능 카약이 필요했습니다.
      solution: 기존 drop-stitch 카약 몰드를 로커 프로파일 수정, 공동 브랜드 패키지 아트워크 개발, 완전한 BSCI 감사 문서 제공.
      result: 미국 주요 3개 아웃도어 체인에 성공적으로 상장됨. 첫 해에 5,000+대, 98% 판매율.
    - challenge: 호주 유통업체는 CERIB 맞춤형 튜브 색상, Hypalon 업그레이드 옵션, 호주 표준 AS 1799 준수가 포함된 인증 라인업을 요구했습니다.
      solution: 일본 공급업체로부터 공급받은 4개의 튜브 색상 변형으로 사전 생산 샘플을 제작 CSM Hypalon 하고, 제3자 AS 1799 준수 테스트를 조정했습니다.
      result: RIB 호주/뉴질랜드 시장에서 3모델 라인업을 출시했습니다. 이후 12 순찰에 대한 정부 입찰에서 낙찰되었습니다RIBs.
