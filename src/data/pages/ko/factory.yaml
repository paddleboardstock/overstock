hero:
  tagline: 공장
  title: 공장 및 제조
  subtitle: 총 12,000 m²의 통합 제조 시설 — 원자재에서 완성 보트까지
intro:
  - '**Aquafarer 청도 제조 허브**의 공장 브랜드인 Aquafarer는 원자재 PVC 및 유리섬유 자재 도착부터 완성 보트의 출고 전 최종 검수까지 모든 생산 단계를 관리합니다. 청도 경제개발구에 위치한 우리의 제조 시설은 12,000 제곱미터에 걸쳐 있으며, PVC 절단, 튜브 열봉합, 유리섬유 RIB 선체 생산, SUP 디지털 프린팅, 최종 조립 및 품질 테스트를 위한 전용 작업장을 갖추고 있습니다.'
  - 디자인, 엔지니어링, 시제품 제작, 제조 및 테스트를 한 지붕 아래 통합함으로써, 우리는 외주 제조의 비효율성을 제거하고 제작 품질, 자재 선택 및 납기 일정에 대한 직접적인 контроль을 유지합니다. 우리 작업장에서 출고되는 모든 보트는 우리의 장비와 우리의 표준에 따라 우리 직원들이 제작합니다.
