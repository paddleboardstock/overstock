      source: 중국과 한국 공급업체
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch 원단
      source: 사내 직조 + 외부 파트너
