  tagline: 기술
  title: 성능을 위해 제작됨
  subtitle: 모든 Aquafarer 보드는 해양 환경을 고려하여 테스트된 정밀한 재료와 제작 방법으로 설계되었습니다. 사내 프로토타입 제작이 가능한 12,000 m² R&D 센터.
