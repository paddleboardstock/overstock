testimonial:
  quote: Aquafarer의 차별점은 바로 재료 과학입니다. 단순히 부품을 조립하는 것이 아니라 PVC 화합물, 용접 매개변수, 구조 레이업을 자체적으로 설계합니다. 이러한 수직적 통합은 최종 제품에서 확인할 수 있습니다.
  author: David Park
  title: 제품 개발 매니저
  company: Bluewater Sports Equipment
  location: 호주
sections:
  - title: Drop-Stitch 코어
    standard: 12-15 PSI 작동 압력
    description: 수천 개의 내부 폴리에스터 실이 상단과 하단 레이어를 연결하여 12-15 PSI에서 견고한 구조를 만듭니다. 이 기술은 전문 패들 보드와 인플레이션 레이싱 보트에도 사용됩니다. 모델별 최적의 강성과 무게 균형을 위해 drop-stitch 밀도가 조정됩니다.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS 코어 다이어그램
  - title: 해양 등급 PVC
    standard: 퓨전 용접 | UV / 염수 / 내마모 테스트
    description: 해양 환경에 적합한 다층 적층 PVC 원단. 각 층은 접착이 아닌 퓨전 용접으로 처리되어 박리 위험이 제거됩니다. UV 저항(ASTM G154, 1,000+ 시간), 염수 부식(ISO 9227), 마모(ASTM D751)에 대해 테스트되었습니다.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC 레이어
  - title: Hypalon 튜브
    standard: CSM 고무 | UV / 화학물질 / 극한 온도 저항
    description: RIB 모델에 사용되며, Hypalon (CSM) 고무는 일반 PVC에 비해 우수한 UV와 화학 저항을 제공합니다. Hypalon 튜브는 극한 온도에서도 유연성을 유지하고 연료와 오일 노출에도 내구성을 갖습니다. 모든 솔기는 인증된 기술자가 수작업으로 배치합니다.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: 에어 덱 플로어
    standard: 고압 인플레이터블 | 합판/알루미늄 대체
    description: 전통적인 합판 또는 알루미늄 슬랫 바닥을 대체하는 고압 인플레이터블 바닥 시스템. 설치 시간, 전체 무게, 저장 부피를 줄이면서 서기, 낚시, 걷기에 적절한 강성을 제공합니다. 200+ kg 분산 하중을 지탱하도록 테스트 완료.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: 에어 덱
