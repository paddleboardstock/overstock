hero:
  tagline: 호텔, 리조트 및 환대 산업
  title: 프리미엄 워터프런트 체험<br />호텔, 리조트 및 요트 클럽용
  subtitle: 비치프런트 호텔, 개인 섬 리조트, 비치 클럽 및 요트 클럽을 위한 턴키 수상 스포츠 프로그램 — 고객 장비와 RIB 텐더에서 안전 시스템 및 직원 교육까지.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer 리조트 워터프런트 활동용 인플레이션 보트
direct_answer: Aquafarer 전 세계 호텔, 리조트, 개인 섬, 비치 클럽 및 요트 클럽과 협력하여 프리미엄 워터프런트 체험을 제공합니다. 당사의 솔루션에는 SUP 렌탈 함대, 가이드 투어 카약, 고객 이동용 텐더 RIBs, 비치 클럽 전용 소형 럭셔리 RIBs, 완벽한 안전 시스템이 포함됩니다. 모든 장비는 귀하의 시설 로고와 색상으로 브랜드화할 수 있습니다. 또한 직원 교육, 프로그램 설계 컨설팅, 시즌별 품질 유지를 위한 함대 교체 계획도 제공합니다.
solution_offerings:
  - title: 리조트 표준 패키지
    subtitle: 중소형 시설용 (50–150 객실)
    badge: Popular
    features:
      - title: 고객 함대
        description: 리조트 브랜드 색상과 로고가 적용된 20–50 SUPs 및 카약
      - title: 안전 인프라
        description: 라이프가드 스탠드, 부표 라인, 안전 표지판, 응급 처치소
      - title: 보관 및 유지보수
        description: 랙 시스템, 공기 주입 스테이션, 일일 점검 체크리스트
      - title: 직원 교육
        description: 장비 취급 및 고객 안전에 대한 현장 활동 직원 오리엔테이션
      - title: 출항 지원
        description: 가격 템플릿, 면책 양식, 활동 일정이 포함된 프로그램 플레이북
    cta_text: 나만의 리조트 솔루션 디자인
    cta_href: /contact
  - title: 리조트 프리미엄 패키지
    subtitle: 럭셔리 시설 및 대규모 운영용
    badge: Premium
    features:
      - title: 프리미엄 함대
        description: 완전 맞춤형 50–100+ SUPs, 카약, 페달 보트 및 텐더 RIBs
      - title: 고급 안전
        description: 라이프가드 타워, 무전 시스템, 구조 보드, AED, 비상 대응 계획
      - title: 고객 경험
        description: 체크인 키오스크, 장비 전시, 탈의 카바나, 해변가 보관
      - title: 수익 프로그램
        description: 동적 가격 가이드, 업셀링 교육, 패키지 번들 전략
      - title: 시즌별 지원
        description: 비시즌 보관, 시즌 종료 점검, 리프레시 주문
    cta_text: 리조트 경험 업그레이드
    cta_href: /contact
