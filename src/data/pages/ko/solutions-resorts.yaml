testimonial:
  content: Aquafarer는 세 개 리조트 시설 전반의 해변 활동 프로그램을 설계하고 장비를 갖추었습니다. 80 SUPs, 40개의 카약, 안전 인프라, 직원 교육 — 모두 한 번의 배송으로 완료되었습니다. 첫 시즌에 고객의 수상 활동 참여가 60% 증가했습니다.
  name: 소피 로랑
  title: 고객 경험 담당 이사, Azure Bay Resorts — 푸켓, 태국
content_segments:
  tagline: 리조트 프로필
  title: 워터프런트 호스피탈리티 솔루션<br />부동산 유형별
  subtitle: 각 리조트 시설은 부티크 생태 로지부터 광활한 럭셔리 해변 리조트까지 고유한 고객 프로필, 활동 구성 및 운영 패턴을 갖추고 있습니다. 우리는 시설 클래스와 고객 기대에 맞는 수상 스포츠 프로그램을 설계합니다.
  items:
    - title: 비치프런트 럭셔리 리조트
      subtitle: VIP 이동 서비스, 수상 활동, 프리미엄 고객 경험
      description: 최고급 해변가 시설 — 포시즌스, 아만 등 유사 럭셔리 그룹 — 수상 스포츠가 고객 편의 시설의 핵심 요소로 만족도 점수와 부가 수익을 높입니다. 장비는 프리미엄으로 보여야 하며, 연령 및 능력 수준별 다양성을 제공하고 리조트의 기존 컨시어지 및 예약 시스템과 완벽하게 통합되어야 합니다. 고객의 외형적 기대치가 매우 높으며, 장비 상태와 프레젠테이션이 5성 리뷰에 직접적인 영향을 미칩니다.
      features:
        - '프리미엄 브랜드 함대: SUPs, 카약, 페달 보트, 소형 RIB 보트'
        - '고객용 프레젠테이션: 리조트 색상 일치, 로고 브랜딩, 장비 디스플레이 연출'
        - 'VIP 고객 이동용 소형 럭셔리 RIB 보트: 맞춤형 장식 및 색상 매칭'
        - '통합 안전 인프라: 부표 라인, 라이프가드 스테이션, AED'
        - '수익 관리: 동적 가격 템플릿, 업셀 교육, 패키지 번들링'
    - title: 프라이빗 아일랜드 리조트
      subtitle: 전천후 고객 운송 — 다운타임 제로, 절대적인 신뢰성
      description: 개인 섬 리조트는 육지와의 유일한 연결 수단이 보트인 외딴 위치에서 운영됩니다. 일일 고객 이동, 물자 운송 및 응급 의료 대피는 단일 선박에 의존하며, 다운타임이 발생하면 고객 경험과 리조트 운영에 직접적인 영향을 줍니다. 이러한 운영자는 모든 기상 조건에서 안정적으로 운행되며, 최소한의 유지보수로 작동하고, 임무 필수 신뢰성을 위해 백업 시스템을 갖춘 보트를 필요로 합니다. 또한, 보트는 손님이 섬에 도착할 때 아름답게 보여야 합니다.
      features:
        - 전천후 RIB 구성, 완전 방한 설비 및 내구성 튜브 장착
        - 트윈 엔진 또는 백업 엔진 제공, 다운타임 없는 운영
        - 상업용 급 Hypalon 구조, 외딴 지역 서비스에서 5-8년 수명
        - 현장 정비용 접근이 용이한 손쉬운 유지보수 설계
        - 리조트 맞춤 브랜드 및 프리미엄 가구, 섬의 미적 감각과 조화
    - title: 호수 및 생태 리조트
      subtitle: 자연과 통합된 고객 경험
      description: 조용하고 환경에 영향을 최소화하는 수상 활동을 제공하는 호숫가 숙소, 생태 로지, 자연 휴양지. 장비는 가능한 비동력형이어야 하며, 공간이 제한된 보트하우스에 쉽게 보관 가능하고, 모든 고객에게 주변 환경의 경험을 보존할 수 있도록 사용 시 조용해야 합니다.
      features:
        - '비동력형 장비: SUPs, 카약, 카누, 패들 보트'
        - 고객 사용 시 요구에 맞춘 조용한 전기 펌프 인플레이션 스테이션
        - 지속 가능성 브랜드에 부합하는 친환경 재료 및 포장
        - 보관 랙 및 보트하우스 정리 시스템 포함
    - title: 비치 클럽
      subtitle: 고객 이동, 엔터테인먼트, 소형 럭셔리 RIBs
      description: 비치 클럽은 장비가 분위기의 일부인 고에너지, 시각 중심 환경에서 운영됩니다. 인근 호텔이나 독에서 고객 이동을 위한 소형 럭셔리 RIBs와 고객 엔터테인먼트를 위한 수상 놀이기구 — 제트스키 견인, 인플레이블 슬라이드, 패들보드 등이 필요합니다. 장비는 스타일리시하게 보여야 하고, 조작이 쉬우며, 다양한 기술 수준의 고객이 매일 사용할 수 있도록 견뎌야 합니다. 성수기 시 보관 및 신속한 배치가 중요합니다.
      features:
        - 고객 이동 및 텐더 서비스용 소형 럭셔리 RIB (3.3-4.3m)
        - '水上놀이기구: 견인용 인플레이블, SUP 보드, 고객 엔터테인먼트를 위한 카약'
        - 비치 클럽 시각 정체성과 일치하는 맞춤 색상 및 브랜드
        - 빠른 배치 및 회수 시스템, 고회전 운영에 적합
        - 일상적인 해수 노출 및 UV에 견딜 수 있는 내구성 있는 Hypalon 구조
    - title: 프라이빗 멤버스 클럽 및 요트 클럽
      subtitle: 항구 운송, 회원 텐더, 독점 수상 스포츠
      description: 수상 스포츠와 보트 운송이 수익원이 아니라 회원 혜택인 개인 클럽. 장비는 높은 미적 기준을 충족해야 하며, 회원을 위해 즉시 사용 가능하고 최소한의 직원 감독만 필요합니다. 마리나 요트 클럽은 항구 이동용 텐더가 필요하며 — 회원을 도크, 계류장, 육지 사이에서 이동시킵니다. 보관과 유지보수는 회원에게 보이지 않아야 합니다.
      features:
        - 항구 운송 및 회원 이동 서비스용 고급 RIB 텐더
        - '프리미엄 장비: EVA 데크, 맞춤형 회원 색상, 브랜드 가구'
        - 직원 없이 회원 접근이 가능한 셀프 서비스 체크아웃 시스템
        - 비수기 보관 및 연간 리프레시 프로그램
    - title: 어드벤처 및 액티비티 중심 호텔
      subtitle: 가이드 투어, SUP 요가, 스노클링 여행, 그룹 활동
      description: 모험 목적지로 자리잡은 숙박 시설 — 가이드 투어, SUP 요가, 일몰 패들링, 스노클링 여행, 그룹 활동을 제공합니다. 선박 운영은 자유 대여와 가이드 프로그램 모델 모두를 지원해야 하며, 장비는 고객이 직접 사용하는 것과 강사가 이끄는 투어를 원활하게 전환할 수 있어야 합니다. 이러한 숙박 시설에는 손님 그룹 간 장비 청소가 용이하고, 빈번한 사용에도 견딜 수 있는 내구성 있는 장비가 필요합니다.
      features:
        - 대여 + 가이드 투어 모델을 지원하는 다목적 혼합 선박
        - 그룹 활동용 2인 카약과 초안정 SUP 플랫폼
        - '가이드 장비: 강사용 보드, 방수 박스, 방수 통신 장치'
        - '계절별 장비 교체: 여름 선박 → 겨울 보관 프로그램'
        - 일일 손님 사용에도 최소한의 유지보수로 견디는 내구성 있는 구조
cta:
  title: 당신만의 수상 경험을 만들어보세요
  subtitle: 당신의 숙박 시설에 대해 알려주세요 — 맞춤형 수상 스포츠 프로그램을 설계해드립니다.
  actions:
    - variant: primary
      text: 리조트 제안 받기
      href: /contact
    - text: 비즈니스 패키지 보기
      href: /business-packages
    - text: 사례 연구 보기
      href: /success-stories
