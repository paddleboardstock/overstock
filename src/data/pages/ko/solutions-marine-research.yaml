content_challenge:
  tagline: 도전 과제
  title: 해양 연구 요구<br />안정적이고 장비 사용 준비가 된 플랫폼
  subtitle: 과학용 작업 보트는 민감한 기기를 위한 안정된 플랫폼을 제공하고, 야생동물을 방해하지 않기 위해 조용하게 작동하며, 다양한 연구 장비를 위한 유연한 배치를 제공해야 합니다.
  paragraphs:
    - 해양 연구와 환경 모니터링에는 이동 실험실 역할을 하는 작업선이 필요합니다. 상업용 또는 레저용 선박과 달리, 연구용 RIBs는 민감한 전자 장비, 수질 및 퇴적물 샘플링 장비, 때로는 살아있는 표본 운반을 수용해야 하며, 정확한 데이터 수집을 위해 안정적인 플랫폼을 유지해야 합니다.
    - '**플랫폼 안정성은 중요합니다** — 소나, 에코사운더, CTD(전도도, 온도, 수심) 프로파일러는 정지 상태이거나 느린 속도에서 안정적인 선체가 필요합니다. 과도한 물보라나 선체 움직임은 과학 데이터에 잡음을 일으킵니다. 안정성이 좋은 딥-V 선체가 필수적입니다.'
    - '**기기 통합** — 연구 선박은 GPS 안테나, 소나 트랜스듀서, 샘플링 암, 데이터 기록 장비를 장착할 지점이 필요합니다. 콘솔 공간은 여러 디스플레이, 기기용 전원 분배, 민감한 전자 장비를 안전하게 보관할 수 있는 공간을 수용해야 합니다.'
    - '**조용한 작동** — 해양 생물학 조사와 환경 모니터링에서는 엔진 소음과 선체 진동이 해양 생물을 놀라게 하고 행동 관찰에 영향을 줄 수 있습니다. 조용한 외부선 엔진 구성과 진동이 적은 선체 설계는 연구 목적으로 중요합니다.'
    - Paddle Board Overstock 연구 RIBs는 과학 및 환경 모니터링 응용을 위해 안정적인 선체 플랫폼, 통합 장비 장착 시스템 및 조용한 외부 엔진 구성을 갖추도록 설계되었습니다.
content_solution:
  tagline: 우리의 해결책
  title: 목적에 맞게 만들어진 연구 RIBs<br />과학 및 환경 작업을 위해
  subtitle: 모든 Paddle Board Overstock 연구 RIB는 과학 장비 및 현장 샘플링 장비를 위한 안정적이고 맞춤형 플랫폼으로 구성되어 있습니다.
  list:
    - 정지 상태와 느린 조사 속도에서 우수한 안정성을 가진 딥-V 유리섬유 선체
    - 소나, GPS 및 샘플링 장비용 장착판이 있는 평평한 갑판 배치
    - 여러 디스플레이용으로 구성된 콘솔 — 플로터, 소너, 데이터 로거
    - 과학 장비용 12V 및 24V 액세서리 전원 분배
    - 조용한 4행정 외부 엔진 — 야생동물 조사 시 진동과 소음 최소화
    - 자료 수집 중 방해를 최소화하는 선택적 저속 스케일 선체 설계
    - 연구 기관 브랜드와 선단 식별을 위한 맞춤형 튜브 색상
content_segments:
  tagline: 연구 프로필
  title: 해양 과학 솔루션<br />응용 유형별
  subtitle: 연구 응용 분야에 따라 선박 요구 사항이 다릅니다 — 대학 교육 플랫폼, 환경 조사 선박, 수질 모니터링 등
  items:
    - title: 대학 해양 과학 프로그램
      subtitle: 교육 플랫폼, 학생 현장 학습, 연안 연구
      description: 해양 과학 대학과 해양학 학과는 현장 실습 과정, 학생 연구 프로젝트 및 교수 주도 연안 조사에 신뢰할 수 있고 다용도의 작업 보트를 필요로 합니다. 보트는 감독하에 학생들이 쉽게 조작할 수 있어야 하고, 손으로 장비를 배치하기에 충분히 안정적이어야 하며, 학기 동안 여러 사용자가 자주 사용해도 내구성이 있어야 합니다. 학술 환경의 예산 제약으로 인해 비용 효율성과 낮은 유지보수가 중요한 고려 사항입니다.
      features:
        - 학생 장비 배치 및 회수 연습을 위한 안정적인 플랫폼
        - 쉽게 조작 가능 — 학생 감독용으로 틸러 또는 단일 콘솔 구성
        - 빈번한 해변 착륙과 학생 사용을 위한 내구성 있는 튜브
        - 교육용 소나, 세키 디스크 및 샘플링 장비 장착
        - 예산 제한이 있는 학술 프로그램을 위한 비용 효율적 옵션
    - title: 해양 연구 기관
      subtitle: 계측 통합, GPS, 샘플링 장비를 갖춘 조사
      description: 연안 및 해양 조사를 수행하는 전문 해양 연구 기관은 통합 계측 장비가 설치된 전문 조사 보트를 필요로 합니다. 이 선박들은 수심 측정용 소나 시스템, 수직 수층 분석용 CTD 프로파일러, 퇴적물 채취기, 생물학적 샘플링 장비를 운반합니다. 보트는 저속 조사 시 안정적인 플랫폼을 제공하고, 장비 배치를 위한 충분한 갑판 공간을 가지며, 전자기기용 깨끗한 12V/24V 전원을 제공해야 합니다.
      features:
        - 통합 소나 트랜스듀서 장착 — 선체 통과형 또는 트랜섬 구성
        - 조사용 내비게이션을 위한 GPS 안테나 장착 및 콘솔 통합
        - 안전한 고정점이 있는 CTD 및 수샘플러 배치 구역
        - 계측기 및 데이터 로거용 12V/24V 보조 전원 분배
        - 조사 선 정확성을 위한 저속(3-6노트)에서 안정적
        - 무거운 샘플링 장비 배치를 위한 선택적 A-프레임 또는 데이빗
    - title: 환경 모니터링 및 보호
      subtitle: 생태 조사, 야생동물 관찰, 서식지 평가
      description: 환경 NGO, 정부 기관 및 보호 단체들은 해양 생태 조사, 야생동물 개체수 모니터링, 서식지 평가를 수행합니다. 이러한 작업에는 민감한 서식지에 접근할 수 있고 야생동물에 방해가 되지 않는 조용하고 저영향 선박이 필요합니다. 보트는 카메라 장비, 트랜섹트 매핑용 GPS, 수질 및 퇴적물 채취용 장비를 운반해야 합니다. 낮은 파문과 최소 엔진 소음은 행동 관찰 연구에 매우 중요합니다.
      features:
        - 조용한 4행정 외부 엔진 — 해양 야생동물에 대한 방해 최소화
        - 사진 및 영상 기록을 위한 안정적인 관찰 플랫폼
        - 카메라 장비, GPS 추적기 및 현장 컴퓨터 장착 장치
        - 해안 습지, 맹그로브 및 강어귀 접근을 위한 얕은 흘수
        - 현장 간 오염 방지를 위한 손쉬운 청소가 가능한 갑판 및 튜브 표면
    - title: 수질 모니터링 및 테스트
      subtitle: 정기 샘플링, 오염물 추적, 규정 준수 모니터링
      description: 수질 모니터링 기관은 해안 지역, 항구 및 내륙 수로를 대상으로 정기적인 샘플링을 수행하여 오염 수준, 조류 번식, 환경 규제 준수 여부를 추적합니다. 이러한 작업에는 고정 샘플링 지점을 반복 방문할 수 있는 효율적이고 신뢰할 수 있는 보트가 필요합니다. 선박은 샘플링 장비, 샘플 보존용 쿨러, 현장 테스트 장비를 운반해야 하며, 샘플링 지점 간 교차 오염을 방지하기 위해 쉽게 갑판을 세척할 수 있어야 합니다.
      features:
        - 샘플링 전용 구역과 쿨러 및 장비 보관 공간
        - 현장 간 오염 방지를 위한 손쉬운 갑판 및 튜브 표면 청소
        - 정밀한 고정 좌표 복귀를 위한 GPS 통합
        - 제한된 수로 및 좁은 수로 접근을 위한 컴팩트 사이즈
        - 정기 샘플링을 위한 비용 효율적인 연료 절감형 외부 엔진
