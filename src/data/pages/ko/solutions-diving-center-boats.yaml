content_challenge:
  tagline: 도전 과제
  title: 다이브 센터가 필요한 이유<br />목적에 맞게 제작된 보트
  subtitle: 다이빙 작업은 수상 차량에 독특한 요구를 부과하며, 일반 목적의 보트는 이러한 요구를 충족하지 못하는 경우가 많습니다.
  paragraphs:
    - 상업 다이빙 센터는 연간 200-300일 동안 운영되며, 매일 3-5회의 다이빙 여행을 진행합니다. 각 여행에는 10-20개의 스쿠버 탱크, 완비된 BCD 장비, 레귤레이터, 오리발, 마스크, 안전 장비, 강사 장비 및 승객을 운반해야 합니다. 일반 용도의 보트는 이러한 운영 강도를 감당할 수 없습니다.
    - '**제한된 갑판 공간** — 대부분의 레저용 보트는 장비 취급이 아니라 속도와 승객 편의를 위해 설계됩니다. 탱크, 장비, 다이버가 같은 공간을 공유하면 준비 시간이 늘어나고, 이동이 어려워지며, 안전 위험이 커집니다.'
    - '**어려운 다이버 탑승** — 국제 관광객, 처음 다이빙하는 사람, 그리고 노년층 여행자는 안전하고 쉬운 출입이 필요합니다. 높은 탑승 위치, 제한된 손잡이, 불안정한 플랫폼은 불편함과 안전 위험을 초래합니다 — 특히 다이버들이 30kg의 장비를 들고 있을 때 더욱 그렇습니다.'
    - '**소금물 부식 및 UV 손상** — 열대 환경은 재료 열화를 가속화합니다. 표준 PVC 튜브는 3년 내에 색이 바래거나, 누수가 생기거나, 교체가 필요할 수 있습니다. 금속 부품의 부식은 유지보수 비용과 운영 중단 시간을 증가시킵니다.'
    - '**정지 상태에서의 안정성** — 다이버는 장비를 착용하거나 물에 들어가거나 다시 보트에 오를 때 안정적인 플랫폼이 필요합니다. 안정성이 부족하면 안전 위험이 발생하고 고객 경험에도 부정적인 영향을 미칩니다.'
    - '**높은 운영 비용** — 매일 여러 번 운항할 때 연료 효율은 매우 중요합니다. 연료를 더 많이 소비하는 보트는 직접적으로 수익률을 낮춥니다. 상업용 다이빙 운영자들은 최고 속도보다 일일 운영 비용에 더 신경을 씁니다.'
content_solution:
  tagline: 우리의 해결책
  title: 실제를 중심으로 설계됨<br />다이빙 운영
  subtitle: 모든 Paddle Board Overstock 잠수 RIB는 레크리에이션 보트 설계에서 변형된 것이 아니라 상업 다이빙 센터의 특정 요구에 맞게 구성됩니다.
  list:
    - 큰 작업 갑판 레이아웃 — 승객 좌석뿐만 아니라 스쿠버 탱크 저장, 장비 준비, 다이버 이동을 위해 설계됨
    - 스테인리스 스틸 난간이 있는 전문 잠수용 사다리 시스템 — 안전하고 손쉬운 잠수사 출입을 위한 넓고 낮은 계단
    - 초광폭 Hypalon 또는 PVC 튜브 — 안정적인 승선 플랫폼을 제공하고 잠수부가 갑판 위를 이동할 때 부력을 향상시킵니다
    - 통합 탱크 저장 선반 — 무게를 가볍게 유지하고, 갑판을 깨끗하게 하며, 장비를 정리하여 더 빠른 이동 시간을 제공합니다
    - 미끄럼 방지 EVA 데크 표면 — 갑판이 젖어 있을 때 미끄러질 위험을 줄여주고, 다이버들이 무거운 장비를 착용하고 움직일 때
    - 다이버의 수중 시야를 명확히 볼 수 있도록 위치한 콘솔 — 강사 안전 모니터링에 매우 중요합니다
    - 엔진 옵션은 40 HP 부터 115까지 HP 다양하며, 단일 또는 트윈 구성, 일일 여러 번 주행할 때 연비를 최적화했습니다
    - 해양용 구조 — 일 UV 상적인 상업용 용도에 적합한 중장비 튜브 소재와 강장 구조물, 염수 저항성
    - 맞춤형 다이빙 사다리 및 플랫폼 구성 — 운영 수심과 다이버 프로필에 맞춰
    - 소나, GPS, 통신 장비를 장착하는 장비 장착판
content_models:
  tagline: 추천 모델
  title: 다이빙 RIB 구성
  subtitle: 가장 인기 있는 다이빙 RIB 모델 — 각각 맞춤형 다이빙 구성으로 제공됩니다.
  items:
    - title: RIB 500 다이버
      description: '5.0m 유리섬유로 다이 RIB 빙 사다리, 탱크 랙, 미끄럼 방지 갑판, HP 60명의 바깥쪽 선박이 있습니다. 소규모 다이빙 학교와 하루 1-2회 수상 운항에 이상적입니다. 수용 인원: 8명.'
    - title: RIB 520 다이버
      description: '5.2m RIB 길이에 안정성이 향상되어 있고, 연장 항속 연료 탱크, 다이브 사다리, 탱크 저장 공간, 90 엔진이 포함되어 HP 있습니다. 여러 차례 매일 다이빙을 하는 해안 다이빙 센터에 적합합니다. 수용 인원: 10명.'
    - title: RIB 550 다이버
      description: '5.5m, RIB 대형 갑판 배치, 전문 다이브 사다리, 탱크 랙, 중장비 튜브를 갖추고 있습니다. 혼합 승객 그룹이 있는 리조트 다이빙 운영을 위해 설계되었습니다. 수용 인원: 10명.'
    - title: RIB 580 다이버 프로
      description: '5.8m 중장비 장비 RIB , 쌍발 옵션, 통합 다이빙 플랫폼, 완전한 항법 장비, 최대 갑판 공간. 노출된 수역에서 하루 3-5회 운항하는 전문 다이빙 작업용. 수용 인원: 12명.'
content_dive_resorts:
  tagline: 다이브 리조트를 위해
  title: 프리미엄 다이브 RIBs<br />리조트 호스피탈리티 운영을 위해
  subtitle: RIBs 손님의 편안함, 브랜드 이미지, 그리고 성수기 수용 인원을 위해 설계된 럭셔리 다이빙 — 여기서 보트 경험이 다이빙 자체만큼 중요하다.
  paragraphs:
    - 다이브 리조트는 상업용 다이빙 센터와 근본적으로 다릅니다. 손님들은 완전한 프리미엄 경험을 위해 비용을 지불하는 관광객이며, 보트는 그 경험의 핵심 요소입니다. 산업적이거나 불편해 보이는 기능적인 작업선은 리조트 품질과 수상 경험 사이에 뚜렷한 격차를 만듭니다.
    - '**경험 격차 문제** — 고급 다이닝과 전문 서비스를 갖춘 5성급 스위트에 머무는 손님은 딱딱한 벤치와 그늘이 없는 노후한 알루미늄 보트에 올라타서는 안 됩니다. 이러한 대비는 리조트가 신중하게 구축한 럭셔리의 이미지를 훼손합니다. 보트는 단순한 교통수단이 아니라 브랜드의 이동식 확장입니다.'
    - '**경쟁 우위로서의 브랜드 이미지** — 모든 다이빙 여행은 브랜드 접촉점입니다. RIB 맞춤형 리조트 색상, 통합 로고, 조화로운 가구가 있는 프리미엄은 떠다니는 브랜드 앰배서더가 됩니다. 손님들은 이를 사진으로 남기고, 소셜 미디어에 공유하며, 기억합니다. 몰디브, 발리, 카리브해 같은 경쟁이 치열한 목적지에서는 보트 품질이 재예약의 결정적 요소가 될 수 있습니다.'
    - '**편안함이 만족과 리뷰를 이끈다** — 열대 더위 속에서 다이빙 장소로 가는 긴 라이딩은 피곤하지 않고 즐거워야 합니다. 인체공학적 등받이, T-탑 또는 비미니 선쉐이드 보호, 넓은 다이브 사다리를 통한 부드러운 탑승, 안정된 플랫폼이 손님 만족도, 온라인 리뷰, 반품률에 직접적인 영향을 미칩니다. VIP 손님, 노인 여행자, 가족들은 특히 편안함에 민감합니다.'
    - '**성수기 수용 인원과 수익** — 성수기(크리스마스, 봄방학, 여름)에는 다이빙 운영이 하루에 4-6회 연속 손님 그룹과 함께 운항할 수 있습니다. 경험을 해치지 않으면서 강도를 견딜 수 있는 보트가 필요합니다. 빠른 회전, 신뢰할 수 있는 운항, 그리고 최소한의 가동 중단이 수익과 평판에 직접적인 영향을 미칩니다. 성수기 주간에 단 한 번의 보트 정지로 인해 수만 달러의 예약 손실이 발생할 수 있습니다.'
    - '**차별화로서의 맞춤화** — Paddle Board Overstock 프리미엄 다이브 RIBs 는 완전 커스터마이즈가 가능합니다: 리조트 브랜드 색상 구성과 선체 그래픽, 맞춤형 로고 배치, 리조트 색상의 프리미엄 시트, T탑 또는 비미니 선쉐이드 옵션, 프리미엄 해양 사운드 시스템, 미끄럼 방지 티크 EVA 스타일 데크, 통합 다이브 탱크 수납 공간, 그리고 손잡이가 있는 넓은 다이브 사다리. 당신의 보트는 리조트 경험의 완벽한 일부가 됩니다.'
    - '**비즈니스 케이스** — 프리미엄은 RIB 초기 비용이 더 들지만, 더 높은 고객 만족도, 강한 브랜드 인식, 재예약 증가, 프리미엄 요금 부과 능력, 유지보수 중단 시간 감소, 열대 염수 조건에서의 더 긴 서비스 수명을 통해 수익을 제공합니다. 이는 운영 비용이 아니라 고객 경험에 대한 투자입니다.'
content_diving_profiles:
  tagline: 다이빙 센터 프로필
  title: 다이빙 센터 종류<br />우리는 다음을 위해 건설한다
  subtitle: 다이빙 운영마다 요구하는 보트 구성도 다릅니다. 저희는 RIB 귀하의 다이빙 비즈니스의 구체적인 요구에 맞춰 모든 것을 맞춤화합니다.
  items:
    - title: 스쿠버 다이빙 학교 및 훈련 센터
      subtitle: 레크리에이션 다이빙, 자격증 과정, 일일 관광 여행
      description: 이 센터들은 열대 지역에서 연중 운영되며, 국제 관광객과 자격증 학생들을 위해 매일 여러 차례 운항을 운영합니다. 보트는 일상 운영의 중심이며, 중장비 적재, 잦은 승객 탑승, 그리고 바닷물에서의 긴 시간을 감당해야 합니다. 한 시간의 다운타임은 다이빙 취소와 수익 손실을 의미합니다.
      features:
        - 10-20개의 스쿠버 탱크, BCD, 승객 장비를 수용할 수 있는 대형 작업 갑판
        - 스테인리스 스틸 난간이 달린 넓은 다이브 사다리를 이용해 쉽게 탑승할 수 있습니다
        - Hypalon 다이버 출입 시 안정적인 플랫폼을 위한 초폭 튜브
        - EVA 데크가 젖었을 때 안전을 위한 미끄럼 방지 표면
        - 연 200일 운용을 위한 연료 효율적인 4행정 엔진 구성입니다+
        - PVC Hypalon 열대 염수 내구성을 위한 중장비 또는 건설
        - 갑판 배치에 통합된 탱크 저장 선반, 개조되지 않음
    - title: 상업 및 산업용 다이브 운영자
      subtitle: 항만 유지보수, 수중 점검, 해양 공학
      description: 이 전문 운영자들은 항만 검사, 수중 수리, 케이블 부설, 해안 공학 등 해양 인프라 프로젝트에 참여합니다. 이들의 보트는 단순한 운송 수단이 아니라 이동식 작업 플랫폼입니다. 승무원들은 도구, 검사 장비, 잠수 시스템을 위한 공간이 필요합니다. 프로젝트 일정이 고정되어 있고 지연이 비용을 초래하기 때문에 신뢰성이 매우 중요합니다.
      features:
        - 개방 수역에서의 안전한 작업 환경을 위한 향상된 안정성
        - 중장비 적재와 잦은 작전을 위한 강화 선체
        - 도구 보관 및 장비 준비를 위해 설계된 대형 오픈 데크
        - 장기간 해상 작전 중 승무원 편의를 위한 전문 좌석
        - 운용 안전을 위한 엔진 중복 옵션
        - GPS, 소나, 통신 장비를 포함한 완전한 항법 장비
        - 산업용 맞춤형 다이빙 플랫폼 및 사다리 구성
    - title: 리비어보드 지원 및 원정 지원선
      subtitle: 다일간의 다이빙 사파리, 외딴 환초 탐험, 연구 지원
      description: 라이브어보드 운영자와 탐험 팀은 매일 출항하고 회수할 수 있는 소형이면서 신뢰할 수 있는 RIBs가 필요합니다. 이 보트들은 모선의 보조선으로서 다이버를 산호초로 운송하고 장비를 싣고 나르며 외딴 지역에서 긴급 지원을 제공합니다. 이 보트들은 대양 횡단이 가능하도록 튼튼해야 하면서도 갑판에 보관할 수 있을 만큼 소형이어야 합니다.
      features:
        - 데빗 발사 및 갑판 저장을 위한 소형 디자인(4.5-5.5m)
        - 자주 해변 착륙과 암초 항해를 위한 강화 선체
        - 일일 크레인 또는 데빗 작업을 위한 중장비 리프팅 포인트
        - 물에 쉽게 들어가고 나갈 수 있는 낮은 프로파일의 다이버 사다리
        - 장기간 햇빛과 소금 노출에 강한 내구성 튜브 재료
        - 50+ 해리마다 주유 간 연료 항속거리
        - 공간 효율적인 보관을 위한 빠른 팽창/공기 빼기 튜브 옵션
    - title: 다이브 리조트 및 호스피탈리티 운영
      subtitle: 리조트 기반 다이빙, VIP 고객 서비스, 섬 이동 서비스
      description: 이 운항사들은 프리미엄 경험을 기대하는 관광객을 위한 것입니다. 보트는 운영 효율성과 손님의 편안함, 브랜드 프레젠테이션 사이에서 균형을 맞춰야 합니다. 순수 상업 운영자와 달리, 리조트 다이빙 센터에는 보기 좋고, 편안하게 운항되며, 시설의 품질을 반영하는 보트가 필요하지만, 동시에 일상적인 다이빙 운영도 안정적으로 수행할 수 있어야 합니다.
      features:
        - 손님 편의를 위한 인체공학적 등받이를 갖춘 프리미엄 좌석
        - 열대 햇볕 노출에 대한 T-탑 또는 비미니 선쉐이드 보호
        - 리조트 브랜딩에 맞춘 맞춤형 색상 구성과 로고 통합
        - 손잡이가 있는 넓은 다이빙 사다리로 손님이 쉽게 탑승할 수 있음
        - 프리미엄 외관과 미끄럼 방지 안전을 위한 티크 스타일 EVA 데킹
        - 최소한의 소음 방해를 위한 조용한 엔진 구성
        - 손님용 음료와 수건을 위한 통합 냉각기 저장 공간
content_segments:
  tagline: 다이브 리조트 프로필
  title: 저희가 제공하는 리조트 유형<br />맞춤형 RIB 솔루션과 함께
  subtitle: 모든 다이빙 리조트는 다릅니다. 우리는 리조트 유형, 고객 프로필, 운영 환경에 맞춰 RIB 구성을 설계합니다.
  items:
    - title: 럭셔리 아일랜드 다이브 리조트
      subtitle: 몰디브, 피지, 보라보라, 카리브해
      description: 이 리조트들은 모든 세부 사항이 럭셔리를 반영하기를 기대하는 고액 자산 여행객을 대상으로 합니다. 보트는 리조트를 반영해야 하며, 맞춤형 리조트 색상, 통합 브랜딩, 프리미엄 좌석, 그리고 전체 햇빛 차단 보호는 필수적입니다. 손님들은 종종 보트를 소셜 미디어에 사진으로 올리기 때문에, 이는 눈에 띄는 브랜드 자산이 됩니다.
      features:
        - 리조트 VI와 매치되는 완전히 맞춤화된 선체 색상과 그래픽
        - 조화를 이루는 리조트 색상 팔레트의 프리미엄 장식용 직물
        - 스피커 시스템이 통합된 T탑 또는 하드탑 선쉐이드
        - 리조트 복장으로 쉽게 오르내릴 수 있는 손잡이가 있는 넓은 다이빙 사다리
        - 프리미엄 음료와 수건을 위한 냉장 쿨러 보관
        - 럭셔리한 외관과 미끄럼 방지 안전성을 위한 티크 스타일 EVA 갑판
        - 최소한의 소음 방해를 위한 조용한 엔진 구성
    - title: 부티크 에코 다이빙 리조트
      subtitle: 해변가 부동산, 에코 롯지, 지속 가능성 중심
      description: 환경적 책임과 진정한 경험을 강조하는 외딴 해안 지역의 소규모 부동산. 이러한 리조트는 제한된 기술 지원으로 독립적으로 운용할 수 있는 신뢰할 수 있고 유지보수가 적은 보트가 필요합니다. 최고 속도보다 연료 효율과 내구성이 중요합니다. 보트는 자연 환경을 반영해야 합니다.
      features:
        - 연료 효율이 높은 4행정 외부 엔진 구성
        - 외딴 지역에서 장기 사용을 위한 내구성 있는 Hypalon 튜브
        - 오프그리드 충전을 위한 태양광 호환 전기 시스템
        - 환경 발자국이 최소인 8-10명용 컴팩트 갑판 레이아웃
        - 현지 서비스가 쉽도록 유지보수 용이 설계
        - 자연 환경과 조화되는 중립 색상 옵션
        - 해변 접안 및 얕은 물 작업을 위한 경량 구조
    - title: 프리미엄 라이브어보드 운영자
      subtitle: 다일 잠수 사파리, 탐사 다이빙, 외딴 환초
      description: 라이브어보드 운영자는 다이버를 암초로 이동, 장비 수송, 긴급 지원, 고객 여행 등 다양한 역할을 수행할 보조 보트가 필요합니다. RIB는 갑판에 보관하거나 견인할 수 있을 만큼 컴팩트해야 하며, 다양한 조건에서 개방 수역 횡단이 가능해야 합니다. 일일 출항 및 회수 작업을 위해 견고한 구조가 필요합니다.
      features:
        - 갑판 보관이나 라이브어보드 견인을 위한 컴팩트 디자인(4.5-5.5m)
        - 자주 해변 착륙과 암초 항해를 위한 강화 선체
        - 보관 효율성을 위한 빠른 팽창/수축 튜브 옵션
        - 물에서 쉽게 탑승할 수 있는 저형 다이버 사다리
        - 데이빗이나 크레인 출항 시스템용 내구성 있는 인양 지점
        - 50+ 해리마다 주유 간 연료 항속거리
        - 햇빛, 염분, 연료 노출에 강한 내구성 있는 튜브 재료
    - title: VIP 프라이빗 차터 운영
      subtitle: 초럭셔리 개인 섬, 유명인 고객, 기업 차터
      description: 모든 세부 사항이 개인화되고 기대치가 극단적인 최고급 리조트 환대. 보트는 완벽하고, 거의 무소음이어야 하며, 원활한 서비스가 필요합니다. 프라이버시, 편안함, 미적 완벽함이 최우선입니다. 이러한 고객은 가격에 민감하지 않지만 품질에 매우 민감합니다.
      features:
        - 맞춤 스티치와 열선 옵션이 있는 초프리미엄 좌석
        - 거의 무소음 항해를 위한 엔진실 방음 처리
        - 프라이버시 및 날씨 보호를 위한 전체 장착 옵션
        - 해양 등급 스피커가 포함된 통합 엔터테인먼트 시스템
        - 맞춤형 웻 바나 음료 스테이션
        - 화장실/옷 갈아입기 프라이버시 장치
        - 통신 및 항해용 전용 승무원 스테이션
        - 조화로운 보조 보트 세트 — 모선과 지원 RIB 연계
