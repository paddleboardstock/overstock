hero:
  tagline: 프로세스
  title: 제조 공정
  subtitle: 원자재부터 해상 준비 가능한 보트까지 — 모든 단계가 저희 통제 하에 있습니다
  back_label: 공장으로 돌아가기
  back_link: /factory
intro: 생산을 제3자 공장에 아웃소싱하고 Aquafarer 전체 제조 체인을 소유하고 운영하는 브랜드와 달리 말입니다. 이 수직적 통합은 모든 단계에서 엄격한 품질 관리를 유지하고, 맞춤형 요구사항에 신속히 대응하며, 배치마다 일관된 품질 제품을 제공할 수 있게 합니다. 우리 시설에서 보트가 어떻게 제작되는지 살펴보겠습니다.
steps:
  - step: '01'
    title: 자재 수령 및 검사
    description: 모든 배치의 PVC 원단, 유리섬유 매트, 수지, 하드웨어는 규격에 따라 검사됩니다. 원단 샘플은 생산 전에 인장 강도, 두께 균일성, 저항성을 검사합니다 UV . 비적합 재료는 격리되어 반송됩니다.
    duration: 1–2일
  - step: '02'
    title: 자동 PVC 절단
    description: 승인된 원단은 자동 CNC 절단기에 올려져 서브밀리미터 단위의 정확도로 절단됩니다. 컴퓨터 최적화 중첩 시스템은 패널을 배열하여 낭비를 최소화하며, 보통 5% 미만으로 줄입니다. 절단된 패널은 보트 모델과 챔버별로 라벨이 붙어 묶여 용접 작업장으로 옮깁니다.
    duration: 보트 키트당 2–4시간
  - step: '03'
    title: 튜브 열 밀봉 및 용접
    description: 패널은 200–600 °C의 제어 온도에서 열폐 기계와 열공기 용접을 사용하여 고정 및 접합합니다. 주요 이음새는 RF 유전 용접으로 보강되어 기밀성 고강도 접합부가 가능합니다. 완성된 챔버는 30분간 공기 유지 검증을 위해 1.25× 작업압으로 팽창됩니다.
    duration: 보트당 1–2일
  - step: '04'
    title: 유리섬유 RIB 선체 몰딩
    description: RIB 보트 선체는 손으로 쌓은 유리섬유 몰딩을 사용해 제작됩니다. 유리섬유 매트와 직조된 로빙 층은 폴리에스터 또는 비닐스터 수지로 정밀한 몰드에서 수작업으로 말아줍니다. 각 층은 일관된 적층 품질을 위해 진공 포장됩니다. 선체는 고광택과 UV내구성 있는 해양 표면을 위해 젤코트로 마감됩니다.
    duration: 선체당 2–4일
  - step: '05'
    title: SUP 인쇄 및 장식
    description: SUP 보드 덱 그래픽은 디지털 인쇄를 사용해 풀컬러 사진 품질 디자인을 구현하고, 내구성 있는 로고와 반복 패턴을 위해서는 스크린 인쇄를 사용합니다. 인쇄물은 마모 방지를 위해 경화되고 밀봉됩니다 UV .
    duration: 1–2일
  - step: '06'
    title: 최종 조립 및 장비 설치
    description: 유리섬유 선체와 PVC 튜브 조립체가 조립 라인에서 조립됩니다. 엔진이 장착되고, 조향 및 스로틀 제어가 연결되며, 연료 시스템이 설치되고 전기 하네스가 전선으로 연결됩니다. 각 보트는 각 단계마다 100점 조립 체크리스트를 따릅니다.
    duration: 2–3일
  - step: '07'
    title: 품질 테스트 및 검사
    description: 완성된 모든 보트는 챔버 공기 유지 테스트, 시스템 기능 점검, 패스너 토크 검증, 외관 검사 등 필수 품질 게이트를 거칩니다. 맞춤 및 프로토타입 제작은 속도, 핸들링, 안정성, 내구성을 포함한 수중 해상 시험도 받습니다.
    duration: 1–2일
  - step: '08'
    title: 포장 및 배송
    description: 보트는 절차마다 공기를 빼고 접고, 중장비용 직조 가방이나 합판 상자에 포장되어 선적을 위해 적재됩니다. 각 소포에는 모델, 일련번호, 목적지가 라벨이 붙어 있습니다. 전 세계 FCL 및 LCL 컨테이너 운송을 위해 화물 운송업체와 협력합니다.
    duration: 1일
