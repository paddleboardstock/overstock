content_challenge:
  tagline: 도전 과제
  title: 해양 관광 요구 사항<br />신뢰할 수 있고 승객 운송 준비 완료된 선박
  subtitle: 관광 운영자는 일일 승객 이동, 다양한 해상 조건, 높은 고객 기대를 감당할 수 있는 보트가 필요하며 유지보수는 최소화하고 운영은 수익성 있게 유지해야 합니다.
  paragraphs:
    - 몰디브, 필리핀, 인도네시아, 태국 등의 섬 관광 운영자는 매일 승객 이동, 스노클링 여행, 해양 여행을 운영합니다. 그들의 보트는 연간 300+일 동안 염수 환경에서 최소한의 유지보수로 운행됩니다.
    - '**섬 이동**은 리조트, 공항, 다이빙 지역 간 빠르고 편안한 승객 운송이 필요합니다. 승객은 원활한 이동, 쉬운 승선, 햇빛과 물보호를 기대합니다. 느리거나 불편한 보트는 고객 만족도와 재방문 예약에 직접적인 영향을 미칩니다.'
    - '**고래 및 돌고래 관찰** 운영자는 야생동물에게 신속하게 접근하고 안정적인 관람 플랫폼을 유지하며 바다 생물을 방해하지 않고 조용하게 운행할 수 있는 보트가 필요합니다. 속도, 안정성, 기동성이 중요하며 — 승객은 멀미 없이 근접 관찰을 기대합니다.'
    - '**어드벤처 관광** 업체는 해안 탐험 투어, 동굴 탐험, 해양 생물 체험을 운영합니다. 그들의 보트는 개방된 해양부터 얕은 만까지 다양한 환경을 항해하며, 다용도 선체 설계와 신뢰할 수 있는 구조가 필요합니다.'
    - 모든 분야에서 부식 저항, 연료 효율, 승객 편안함이 가장 중요한 관심사입니다. 보트가 고장 나거나 잦은 수리가 필요하면 수익 손실, 투어 취소, 평판 손상이 발생합니다.
content_solution:
  tagline: 우리의 해결책
  title: 관광 등급 RIBs<br />& 함대 장비
  subtitle: Paddle Board Overstock은 승객 운송용 상업용 RIB 보트와 리조트 활동 프로그램용 함대 장비(SUPs, 카약, 고무보트)를 단일 공급 업체에서 모두 제공합니다.
  list:
    - 상업용 승객 RIBs 4.8m에서 8m — 섬 이동, 스노클링 투어, 야생동물 관찰용 구성
    - 등받이와 선셰이드가 있는 편안한 좌석 — 1-2시간 투어 동안 승객 편안함 제공
    - 넓은 빔과 깊은 V형 선체로 안정성 확보 — 멀미 감소 및 승객 신뢰 향상
    - 야생동물 관찰을 위한 조용한 엔진 옵션 — 해양 동물에 최소한의 방해
    - 다이브 사다리 및 수영 플랫폼 — 스노클링과 수영 여행 필수
    - 맞춤형 브랜딩과 색상 체계 — 모든 선박에 회사 로고와 함대 도색을 적용합니다
    - 대량 주문에 대한 함대 가격 RIB 책정 — 다척 작전 전반에 걸친 일관된 사양
    - SUP 리조트 기반 게스트 활동 프로그램을 위한 보드, 카약, 고무보트
    - 예비 부품 및 유지보수 지원 — 관광 성수기 동안 가동 중단 시간을 최소화합니다
content_segments:
  tagline: 관광 부문
  title: 해양 관광 솔루션<br />작전 유형별
  subtitle: 관광 사업마다 다른 보트 구성이 필요합니다. 귀하의Paddle Board Overstock RIB 특정 용도에 맞는 권리를 맞춥니다.
  items:
    - title: 섬 환승 운영자
      subtitle: 몰디브, 필리핀, 인도네시아, 태국 — 일일 고객 운송
      description: 동남아시아와 몰디브의 섬 관광 운영자들은 공항, 리조트, 다이빙 장소 간에 연간 300일간 매일 승객 환승을 운행합니다+. 보트는 손님 경험의 중추입니다. 고장이 나면 손님이 고립되고, 예약이 취소되며, 평판에 손상이 발생합니다. 이들 운영자들은 유지보수 지원이 제한적이고 부품 구하기 어려운 외딴 지역에서 고빈도 운용을 견딜 수 있는 보트가 필요합니다.
      features:
        - 상업용 등급 건설,+ 연간 300일 운행 가능
        - 8-16명 승객을 위한 편안한 벤치 좌석과 등받이가 있습니다
        - 열대 햇볕과 스프레이 방지를 위한 T-탑 또는 비미니 선쉐이드
        - 손님이 짐을 쉽게 이용할 수 있도록 넓은 탑승 플랫폼이 마련되어 있습니다
        - 손님 가방과 리조트 물품을 위한 건조 보관 칸
        - 연료 효율적인 4행정 외부 기갑 — 이동당 운영 비용이 낮음
        - Hypalon 열대 환경에서 5-8년 수명을 위한 중장비 튜브
        - 유지보수가 쉬운 설계 — 원격 위치 정비를 위한 접근 가능한 부품
    - title: 고래 관찰 운영자
      subtitle: 해상 능력, 관측장으로의 속도, 안정적인 플랫폼
      description: 고래 관찰은 허비 베이(호주), 카이쿠라(뉴질랜드), 바하 캘리포니아(멕시코), 아조레스 제도 등지에서 운영되는 계절적이지만 가치 높은 관광 부문입니다. 운영자는 고래가 잠수하거나 이동하기 전에 해상 관측 구역에 신속히 도착해야 하며, 장기간 관찰 시간을 위해 안정적인 플랫폼을 유지하고, 해양 포유류를 방해하지 않도록 조용히 운항해야 합니다. 2-4시간 투어 중 승객의 편안함은 리뷰와 재예약에 직접적인 영향을 미칩니다. 느리거나 불안정한 보트는 관측을 놓치거나 투어가 환불되는 결과를 의미합니다.
      features:
        - RIB 개방 수역에서의 해상 능력은 7-10m 구성입니다
        - 조용한 4행정 아웃보드 — 소음과 진동 방해가 최소화됨
        - 휴식 시 뛰어난 안정성을 가진 딥-V 선체 — 편안한 전망대
        - 손님 사진 촬영을 위한 난간이 있는 선수 전망대
        - 완전 기상 보호 — 해상 조건을 위한 T-탑 또는 밀폐형 콘솔
        - 2-4시간 투어 기간 동안 편안함을 위해 설계된 인체공학적 좌석
        - 장기간 염수 노출과 저항을 위한 해양 등급 소재 UV
    - title: 돌고래 관찰 운영자
      subtitle: 빠른 추격, 다인승 수용력, 조용한 접근
      description: 돌고래 관찰 운영자는 다른 능력의 균형이 필요합니다. 돌고래는 고래보다 빠르고 장난기가 많아, 빠르게 가속할 수 있고 정밀하게 조종할 수 있으며 무리를 놀라게 하지 않고 접근할 수 있는 보트가 필요합니다. 이러한 투어는 일반적으로 1회 여행당 더 많은 승객을 수용하며 해안 가까이에서 운영됩니다. 조용한 운행이 매우 중요합니다 — 시끄러운 엔진에 익숙해진 돌고래는 보트를 피하게 되어 관찰 성공률이 줄어듭니다. 운영자는 또한 성수기 동안 매일 여러 차례 여행 일정을 소화할 수 있는 신뢰할 수 있는 보트가 필요합니다.
      features:
        - 민첩성, 속도 및 얕은 물 접근을 위해 5.5-8m RIB
        - 활발한 돌고래 무리에 도달하기 위한 빠른 가속
        - 조용한 배기와 저진동 선체로 근접 접근 가능
        - 손님 관람 및 사진 촬영을 위한 정지된 안정적인 플랫폼
        - 피크 시즌 투어를 위한 높은 승객 수용 인원(10-18명)
        - 선수 좌석 구역에서 물가 가까이에서 돌고래를 감상
        - 해안 및 만 지역 작전을 위한 얕은 흘수
    - title: 모험 및 친환경 관광
      subtitle: 해안 탐험, 동굴 투어, 야생 동물 체험
      description: 모험 관광 운영자들은 다양한 환경 — 대양 횡단, 얕은 석호 탐험, 해안 동굴 접근, 해양 야생동물 조우 — 을 탐색합니다. 이들의 보트는 다양한 해상 조건을 처리할 수 있는 다재다능함, 외딴 지역 사용을 견딜 수 있는 내구성, 보호된 만과 해변 상륙에 접근할 수 있는 얕은 흘수 깊이를 필요로 합니다. 장비 신뢰성은 매우 중요합니다 — 외딴 지역에서 장비가 고장 나면 투어가 망치고 손님을 위험에 빠뜨릴 수 있습니다.
      features:
        - 섬, 동굴, 해변 접근을 위한 얕은 흘수 선체
        - 혼합 환경 내구성을 위한 강화 선체 및 Hypalon 튜브
        - 유연한 좌석 — 다양한 투어 유형과 그룹 크기에 맞게 재구성 가능
        - 사진 장비 및 특수 장비를 위한 장비 장착 지점
        - 쉬운 해변 상륙 능력 — 강화된 용골과 튜브 보호
        - 장기 투어 동안 손님의 편안함을 위한 날씨 보호
    - title: 리조트 액티비티 함대
      subtitle: 완전한 게스트 수상 스포츠 프로그램 — RIBs, SUPs, 카약, 안전
      description: 손님 경험의 일부로 수상 스포츠를 제공하는 리조트는 다양성, 내구성, 브랜드 표현을 균형 있게 갖춘 장비를 갖추어야 합니다. 장비에는 일반적으로 손님 여행과 이동을 위한 RIBs, 자율 탐험을 위한 SUPs와 카약, 그룹 스노클링 투어를 위한 고무보트가 포함됩니다. 계절별 손님 수에 맞춰 다양한 장비 유형을 관리하려면 일관된 품질, 용이한 유지보수, 통합된 브랜딩이 필요합니다. 장비 고장이나 노후화는 손님 후기와 수익에 직접적인 영향을 미칩니다.
      features:
        - RIB 손님 여행, 이동, 스노클링 여행 입찰
        - SUP 보드와 카약은 자율 이용 고객 활동용입니다
        - 단체 투어 및 해변에서 산호초 스노클링용 고무보트
        - 모든 장비에 대한 완전 맞춤형 브랜딩 — 통일된 리조트 프레젠테이션
        - '안전 장비 패키지: 구명조끼, 호루라기, 응급처치 키트, 부표 줄'
        - 장비 취급 및 고객 안전을 위한 직원 교육 자료
content_benefits:
  tagline: 주요 혜택
  title: 왜 Paddle Board Overstock를 선택해야 하는가<br />해양 관광
  subtitle: 50+개국의 관광 운영자들이 일일 승객 운송을 위해 신뢰하는 상업용 RIBs 및 운송 장비.
  list:
    - 연간 300+ 운항일을 위해 제작 — 일상적인 관광 운영을 위한 상업용 내구성
    - 다양한 선박 크기 옵션 (3.3m~8m) — 모든 해양 관광 요구에 맞는 단일 공급업체
    - Hypalon 또는 PVC 튜브 옵션 — 운영 환경과 예산에 따라 선택 가능
    - 맞춤형 선박 브랜딩 — 회사 아이덴티티를 반영한 모든 선박과 장비의 통일된 외관
    - 승객 편의 기능 — 편안한 좌석, 차양, 편리한 탑승, 안정적인 운항
    - '빠른 제작: 표준 RIB 구성의 경우 30-45일 소요'
    - 3+척 이상의 선박 또는 10+개 장비 유닛의 대량 주문 가격
