hero:
  tagline: 맞춤형 RIB 제조
  title: 맞춤형 RIB 보트 OEM<br />& ODM 서비스
  subtitle: 검증된 플랫폼에서 목적 기반 수상 보트까지 — Aquafarer은 브랜드, 딜러, 전문 운영자가 필요로 하는 맞춤형 선체 구성, 튜브 재료, 데크 레이아웃 및 목표 시장에 대한 준수 문서를 위한 RIB-특화 OEM 및 ODM 서비스를 제공합니다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer에서 맞춤형 RIB 보트 OEM 제조
direct_answer: Aquafarer은 CE 인증 청도 공장에서 RIB-특화 OEM 및 ODM 맞춤화를 제공하며 — 맞춤형 선체 길이, 튜브 재료 (PVC 또는 Hypalon/CSM), 데크 레이아웃, 콘솔 및 좌석 구성, 그리고 완전한 RCD 2013/53/EU 준수 문서를 포함합니다. MOQ은 RIB 모델의 경우 2-5 단위부터 시작합니다.
stats:
  - value: 2–5
    label: RIB MOQ
    detail: 모델별, 기존 몰드
  - value: 12,000 m²
    label: ISO 9001 시설
    detail: 칭다오 제조 캠퍼스
  - value: 30–45
    label: 1일 리드 타임
    detail: 샘플에서 FOB 청도로
  - value: RCD 2013/53/EU
    label: 규정 준수
    detail: 모델별, 구성별
comparison_matrix:
  title: OEM 대 ODM — 어느 모델이 귀하의 프로젝트에 적합합니까?
  subtitle: 네 가지 협업 모드, 각 모드마다 공장 참여 수준과 브랜드 통제 수준이 다릅니다.
  columns:
    - header: 협업 모드
    - header: 브랜드 역할
    - header: Aquafarer 역할
  rows:
    - option: OEM 제조
      standard: 브랜드, 사양 및 준수 요구 사항 제공
      premium: 기존 몰드와 생산 라인을 사용하여 사양에 맞게 제작
    - option: ODM 맞춤화
      standard: 기본 모델 선택, 기능 및 브랜딩 맞춤화
      premium: 원하는 수정 사항으로 검증된 RIB 플랫폼 적용
    - option: 세미 맞춤형 RIB
      standard: 선체 길이, 튜브 재료, 데크 레이아웃 및 장비 정의
      premium: 기존 선체를 맞춤형 튜브 구성과 데크 계획으로 수정
    - option: 완전 맞춤 개발
      standard: 개념 및 목표 시장 요구 사항 제공
      premium: 처음부터 설계 — 맞춤형 선체, 몰드, 완전한 문서화
content_customization:
  tagline: 무엇을 맞춤 설정할 수 있나요
  title: RIB 사용자 정의<br />옵션
  subtitle: 모든 RIB 보트의 요소는 귀하의 용도, 시장 및 브랜드 요구 사항에 맞게 맞춤화할 수 있습니다.
  items:
    - title: 선체 및 구조
      description: 선체 길이(2.5–8.5 m), 선체 재질(GRP 유리섬유 또는 해양 등급 알루미늄), 선체 색상(겔코트 또는 도장), 키 프로파일(딥-V, 보통-V, 평면), 트랜섬 유형(브래킷이 있는 폐쇄형 트랜섬 또는 웰), 상업적 하중 요구 사항을 위한 구조적 보강.
      icon: tabler:sailboat
    - title: 튜브 및 칼라
      description: 튜브 재질 (0.9–1.2 mm PVC 또는 1.4–1.7 mm Hypalon/CSM), 튜브 직경 (40–55 cm), 챔버 수 (3–7), 밸브 유형 (Halkey-Roberts, Leafield D7 또는 Boston), 튜브 색상 (표준 또는 맞춤), 그리고 칼라 콘/테이퍼 구성.
      icon: tabler:circle
    - title: 갑판 및 콘솔 배치
      description: 센터 콘솔, 사이드 콘솔, 또는 틸러 스티어링. 좌석 배치(조키 좌석, 벤치 좌석, 볼스터 좌석). 갑판 커버링(EVA 폼 티크 느낌, 미끄럼 방지 페인트, 또는 노출 GRP). 장비 장착 지점, 손잡이 레일, D-링 위치.
      icon: tabler:layout-dashboard
    - title: 전기 및 항법
      description: 항해등(LED), 윗물 배수 펌프 시스템, 배터리 관리, VHF 라디오 설치, GPS/차트플로터 장착, USB 충전 포트, 스위치 패널 구성.
      icon: tabler:bolt
    - title: 브랜딩 및 그래픽
      description: 선체 및 튜브 그래픽(스텐실 인쇄, 열 전사, UV 디지털 인쇄), 로고 배치, 맞춤 색상 구성, 식별 표시, 브랜드가 포함된 맞춤 소유자 문서.
      icon: tabler:palette
    - title: 안전 및 규정 준수
      description: 설계 등급 평가 (RCD 기준 A/B/C/D), 화재 진압 시스템, 연료 시스템 사양(휴대용 탱크, 고정 탱크, 데크 하부), 그리고 목표 시장에 대한 준수 문서 패키지.
      icon: tabler:shield
content_applications:
  tagline: 애플리케이션 구성
  title: RIB 구성<br />응용 프로그램별
  subtitle: 다른 임무는 서로 다른 구성을 요구합니다. 다음은 가장 일반적인 RIB 응용 프로그램에 대한 검증된 설정입니다.
  items:
    - title: 구조 및 순찰
      description: 딥-V 선체, Hypalon 튜브, 자동 배수 갑판, 받침 좌석, 손잡이, 항해등, 그리고 강력한 D-링. RCD 설계 카테고리 B 또는 C. 방화 연료 시스템 및 상업용 등급 전기 장치.
      icon: tabler:lifebuoy
    - title: 다이빙 지원
      description: 넓은 빔, 후방 탑승 사다리, 연료통 거치대 위치, 추가 D-링, 다이빙 깃발 장착대, 트윈 아웃보드를 위한 강화 트랜섬, 논슬립 전체 데크 EVA 덮개.
      icon: tabler:mask
    - title: 관광 및 상업
      description: 벤치 시트, 햇빛 가리개/비미니, 손잡이, 건조 보관 공간, 듀얼 배터리 시스템을 갖춘 승객 인증 레이아웃. RCD C 등급. 리조트 및 차터 선대 운영을 위해 설계됨.
      icon: tabler:beach
    - title: 어업
      description: 오픈 데크 레이아웃, 로드 홀더 위치, 생미끼 웰, 어군 탐지기 장착, 트롤링 모터 장착, 강화 트랜섬, 휴대용 연료 시스템. 센터 콘솔 또는 사이드 콘솔 옵션.
      icon: tabler:fish
    - title: 레저 & 요트 텐더
      description: 경량 선체, PVC 튜브, 편안한 좌석, 텔레스코핑 틸러 또는 컴팩트 콘솔, 데비트용 리프팅 포인트, 탈부착 연료탱크. RCD C 또는 D 카테고리.
      icon: tabler:sailboat
    - title: 전문 작업선
      description: 알루미늄 선체 옵션, 강화된 중장비 구조, 유압 조향, 상업용 전기 시스템, 레이더 아치, 임무별 장비 통합 포인트. 프로젝트별 맞춤 준수.
      icon: tabler:anchor
process_steps:
  title: 7단계 RIB OEM/ODM 개발 프로세스
  subtitle: 프로젝트 브리핑에서 애프터 세일즈까지 — 명확한 마일스톤과 산출물이 정의된 워크플로우
  steps:
    - number: '01'
      title: 프로젝트 브리핑 및 요구사항
      description: 목표 애플리케이션, 선체 크기, 튜브 재료, 준수 요구사항, 브랜딩 필요사항 정의. 실현 가능성을 평가하고 협업 모델(OEM/ODM/세미 커스텀/풀 커스텀)을 확인합니다.
      timeline: 3–5일
    - number: '02'
      title: 기술 검토 및 타당성
      description: 엔지니어링 팀이 구조적 타당성, 안정성 및 부력 계산, 준수 경로, 재료 가용성을 검토합니다. 기존 몰드 또는 맞춤 몰드 필요 사항을 확인합니다.
      timeline: 5–7일
    - number: '03'
      title: 제안서 및 견적
      description: 사양, 3D 렌더링 또는 GA 도면, 준수 범위, 일정, 볼륨 티어 및 MOQ 기준 단가가 포함된 상세 제안서 수령.
      timeline: 5–7일
    - number: '04'
      title: 디자인 확인 및 샘플링
      description: 최종 GA, 데크 레이아웃, 튜브 구성 승인. 브랜드 색상, 로고 및 지정 재료로 사전 생산 샘플을 제작하여 물리적으로 검수합니다.
      timeline: 15–20일
    - number: '05'
      title: 샘플 승인 및 QC 프로토콜
      description: '샘플 검수 및 승인. 생산 QC 프로토콜 정의: 압력 테스트(1.25배 / 24–48시간), 치수 검사, 선체별 준수 문서 체크리스트.'
      timeline: 3–5일
    - number: '06'
      title: 대량 생산 및 품질 관리
      description: 단위별 100포인트 QC 체크리스트를 포함한 전체 생산. 공정 중 검사, 압력 테스트, 시리얼 수준 추적 가능. CE/ISO 문서 병행 준비.
      timeline: 30–45일
    - number: '07'
      title: 포장, 배송 및 애프터 세일즈
      description: 맞춤 포장(표준, 소매용, 팔레트 포장), 수출 문서, 컨테이너 적재 및 물류. 예비 부품 키트 및 유지 관리 문서 포함.
      timeline: 7–14일
certifications:
  title: RIB 보트를 위한 준수 및 인증
  subtitle: 모든 맞춤 RIB 주문에는 모델별 준수 문서 포함
  items:
    - name: CE 2013/53/EU
      description: RCD 모델 및 설계 카테고리별 준수 — DoC, 제작사 명판, 사용 설명서 포함
      badge: CE
    - name: ISO 9001:2015
      description: SGS 인증을 받은 품질 관리 시스템으로 설계, 생산 및 유통을 포함
      badge: ISO
    - name: EN ISO 6185
      description: 고무보트 제작 기준 — 안정성, 부력 및 사람-바다로 떨어짐 회수
      badge: 6185
    - name: EN ISO 14945
      description: 제조사 명판 기준 — 영구적으로 표시된 식별 및 용량 정보
      badge: 14945
    - name: BSCI
      description: 윤리적 제조를 위한 사회적 준수 감사 — EU 소매업체가 요구
      badge: BSCI
    - name: REACH
      description: 'EU 화학물질 안전 준수: PVC, Hypalon, 접착제 및 코팅'
      badge: REACH
content_service_modules:
  tagline: 서비스 모듈
  title: OEM/ODM 서비스<br />모듈
  subtitle: 각 프로젝트는 적절한 서비스 모듈을 결합합니다. 모든 프로젝트가 모든 모듈을 필요로 하는 것은 아닙니다 — 우리는 귀하의 프로젝트에 필요한 것만 범위를 정합니다.
  items:
    - title: 공학 검토 및 타당성
      description: '선체 플랫폼 평가, 구조적 타당성 점검, 안정성과 부력 검증, 준수 경로 확인, 자재 가용성 확인. 출력: 진행 여부 추천이 포함된 타당성 보고서.'
      icon: tabler:math-function
    - title: 설계 및 구성
      description: 'GA 도면, 갑판 배치, 튜브 구성, 콘솔 및 좌석 위치, 장비 장착 계획, 색상/재료 선택. 출력: 승인된 GA 및 구성 사양.'
      icon: tabler:ruler
    - title: 샘플 및 프로토타입
      description: 색상, 로고 및 지정된 재료가 승인된 사전 생산 샘플로 물리적 검사를 위해 제공됩니다. 샘플 승인 프로토콜, 검사 체크리스트 및 변경 요청 절차가 포함됩니다.
      icon: tabler:3d-cube-sphere
    - title: 생산 및 품질 관리
      description: 단위당 100점 QC 체크리스트를 통한 대량 생산, 공정 중 검사, 압력 테스트(1.25배 / 24-48시간), 그리고 시리얼 수준 추적 가능성. CE/ISO 문서가 병행하여 준비됨.
      icon: tabler:clipboard-check
    - title: 브랜딩 및 포장
      description: 자체 브랜드 로고 적용, 맞춤형 선체 및 튜브 그래픽, 브랜드 소유자 문서, 소매 준비 또는 팔레트 포장, 부품 키트 준비.
      icon: tabler:palette
    - title: 내보내기 및 문서화
      description: 수출 포장, 컨테이너 적재 계획, FOB/CIF/DDP 문서, 목적지 시장별 규정 준수 서류, 배송 후 커뮤니케이션 프로토콜.
      icon: tabler:world
content_risk_control:
  tagline: 위험 및 제공 관리
  title: 프로젝트 위험 &<br />배달 관리
  subtitle: 전문 OEM/ODM 구매자는 제품 품질만큼 위험 관리에도 관심을 가집니다. 저희가 이를 관리하는 방법은 다음과 같습니다.
  items:
    - title: 범위 및 소유권 정의
      description: 개발이 시작되기 전에, 우리는 서면으로 다음과 같은 맞춤화 범위, 금형 요구사항, 샘플 승인 기준, 도면 및 몰드의 소유권, 문서 작성 책임을 정의합니다. 누가 무엇을 소유하는지에 대해 모호함이 없습니다.
      icon: tabler:file-text
    - title: 변경 통제 프로세스
      description: 설계 확인 이후의 모든 사양 변경은 영향 평가(비용, 일정, 준수 여부)와 함께 문서화된 변경 요청 과정을 따릅니다. 승인되지 않은 수정은 생산 환경에 들어가지 않습니다.
      icon: tabler:arrows-diff
    - title: 배치 일관성 보장
      description: 50번째 유닛은 첫 번째 승인된 샘플과 일치합니다. 승인된 사양은 냉동되고, 재료 및 공정 매개변수가 고정되며, 공정 중 점검소가 생산 공정 전반에 걸친 일관성을 확인합니다.
      icon: tabler:repeat
    - title: 전달 및 용량 투명성
      description: 리드 타임은 실제 생산 능력, 자재 재고 수준, 현재 주문 부하를 기준으로 견적되며, 목표치는 아닙니다. 주문당 마일스톤 날짜가 포함된 생산 일정표.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — 자주 묻는 질문
  questions:
    - q: OEM ODM RIB 보트와 보트의 차이점은 무엇인가요?
      a: 'OEM (오리지널 장비 제조): 상세한 사양을 제공하면 저희가 설계를 만듭니다.ODM (오리지널 디자인 제조): 검증된 플랫폼을 선택 Aquafarer RIB 하시면 원하는 기능과 브랜드로 맞춤화합니다.ODM 더 빠르고 비용이 적습니다;OEM 최대한의 설계 제어권을 제공합니다.'
    - q: 선체 모양과 크기를 커스터마이즈할 수 RIB 있나요?
      a: 네. 기존 선체 몰드에 대한 세미 커스텀 개조(다른 데크 레이아웃, 튜브 구성)와 신규 가공 몰드를 통한 완전 맞춤 선체 개발을 제공합니다CNC. 세미 커스텀 프로젝트는 2-5 유닛부터 시작할 수 있으며; 완전 커스텀은 보통 더 높은 투자 금액이 필요합니다.
    - q: 커스텀용 튜브 재료는 무엇인가요RIBs?
      a: 저희는 PVC 레크리에이션 및 경상업용으로 0.9-1.2 mm, 전문 HypalonCSM , 구조, 상업용으로 우수한 오존 저항성을 요구하는 용도(UV10-15년 대 5-8년)를 위해 PVC1.4-1.7 mm 크기를 제공합니다.
    - q: RIBs 구조, 다이빙, 낚시 같은 특정 용도에 맞게 설정할 수 있나요?
      a: 네. 구조/순찰, 다이빙 지원, 관광/전세, 낚시, 요트 텐더, 전문 작업용 보트 용도에 검증된 구성 템플릿을 유지하고 있습니다. 각 템플릿에는 권장 선체 유형, 튜브 재질, 갑판 배치, 장비가 포함되어 있으며, 고객의 정확한 요구에 맞게 맞춤화합니다.
    - q: / 견적을 받으려면 어떤 정보가 필요 RIB OEMODM 한가요?
      a: 대상 용도, 원하는 선체 길이, 튜브 재질 선호도(PVC또는 Hypalon), 대략적인 수량 및 납품 일정, 목표 시장 준수 요건, 그리고 참조 제품 또는 사양. 더 많은 정보를 제공할수록 견적이 더 빠르고 정확하게 제공됩니다.
    - q: MOQ 커스텀 보트의 기준은 무엇인가요 RIB ?
      a: 기존 선체 몰드에 표준 수정이 적용된 경우, MOQ 설계당 2-5단위부터 시작합니다. 맞춤형 몰드와 완전 맞춤 개발은 MOQ 프로젝트 복잡도에 따라 다릅니다 — 세미 커스텀은 보통 10-20단위,+ 완전 맞춤 금형에 새 금형이 적용된 경우 30단위입니다.
    - q: 맞춤형 몰드와 도면은 누가 소유하고 있나요?
      a: 베이스 디자인을 사용해 개발된 몰드는 Aquafarer 여전히 Aquafarer 재산으로 남아 있습니다. 고객이 의뢰하고 비용을 지불한 완전 맞춤형 몰드는 계약 조건에 따라 고객 소유권에 할당될 수 있습니다. 모든 몰드 소유권 조건은 프로젝트 시작 전에 문서화됩니다.
    - q: RIBs 수출용으로 맞춤 포장은 어떻게 되나요?
      a: '기본: + 컨테이너 적재용 맞춤 크래들 스트레치 랩. 프리미엄: 소매용 포장, 진공 포장, 팔레타이즈. FOB 칭다오CIF, , 배송 서비스를 제공합니다 DDP . 전체 수출 서류와 통관 절차가 포함되어 있습니다.'
