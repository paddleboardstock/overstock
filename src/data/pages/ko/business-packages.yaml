faq:
  title: 패키지 FAQ
  questions:
    - q: 패키지 최소 주문 수량은 얼마인가요?
      a: 클럽 스타터 패키지는 최소 10개 단위입니다. 리조트와 브랜드 패키지는 귀하의 요구에 맞게 맞춤 제작되며 유연한 MOQs이 가능합니다.
    - q: 배송은 얼마나 걸리나요?
      a: 표준 생산은 주문 확인 후 30–45일 소요됩니다. 추가 요금으로 신속 생산도 가능합니다.
    - q: 장비 색상과 브랜딩을 커스터마이즈할 수 있나요?
      a: 예. 모든 패키지에는 보드 색상, 로고 인쇄, 포장 디자인 등 전체 맞춤 제작이 포함됩니다.
    - q: 판매 후 지원을 제공하나요?
      a: 예. 모든 패키지에는 온라인 유지보수 가이드, 비디오 튜토리얼, 예비 부품 주문 시스템 접근이 포함됩니다.
