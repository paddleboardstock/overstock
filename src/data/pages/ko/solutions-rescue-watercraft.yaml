content_challenge:
  tagline: 도전 과제
  title: 구조 작전 수요<br />타협 없는 신뢰성
  subtitle: 수색 및 구조 조직은 극도의 안전 책임 하에 운영되며, 모든 보트 고장은 용납할 수 없는 결과를 초래합니다.
  paragraphs:
    - 구조 작전에서는 성공과 실패 사이의 여진이 분 단위로 측정됩니다. 보트는 즉시 출항 준비가 되어 있어야 하며, 거친 조건에서도 운항하며 승객을 안전하게 태우고 돌아와야 합니다. 안전 책임은 절대적입니다 — 구조 임무 중 기계적 고장은 수리 비용이 아니라 생명 손실입니다.
    - SAR 보트는 피해자에게 신속히 도달하기 위해 고속과 안전한 구조 작업을 위한 뛰어난 안정성이 필요합니다. 구조 장비, 의료 물자, 통신 장비를 운반해야 하며, 종종 제한된 갑판 공간 내에 보관해야 합니다. 정부 서비스 보트는 공+공 조달 예산을 정당화하기 위해 10-15년의 긴 운용 수명이 필요합니다.
    - 조작자와 수색 모두에 시야가 매우 중요합니다. 콘솔 설계는 360도 시야를 제공해야 하며, 보트는 항공기와 다른 선박에 매우 잘 노출되어야 합니다.
    - Aquafarer 구조 구조 RIBs 는 이러한 요구에 맞게 처음부터 설계되었으며, 자체 배달 갑판, 강화된 선체, 항법 장비, 견인 기둥이 순찰 모델에 기본으로 탑재되어 있습니다.
content_solution:
  tagline: 우리의 해결책
  title: 목적 구조 RIBs
  subtitle: 모든 Aquafarer 구조 보트는 SOLAS 국가 수색구조 기준을 충족하거나 그 이상으로 설계됩니다.
  list:
    - 자동 배수 갑판 — 회수 작업 중 안정성을 위해 자동으로 물이 배수됩니다
    - 강화된 딥-V 선체 — 거친 수역과 예측 가능한 고속 조종 능력
    - 완전한 항법등(full navigation light) — 모든 기상 조건에서 주야간 운용
    - 예인 기둥과 예인줄 — 선박 예인 또는 구조 썰매 작업 준비 완료
    - 장비 장착판 — 무선, 탐조등, 사이렌, 의료 장비
    - 다중 엔진 구성 — 단일 외부 엔진 또는 쌍발 엔진 중복
    - 고가시성 튜브 색상 — 최대 시야를 위해 주황색, 노란색, 빨간색
content_segments:
  tagline: 구조 프로필
  title: 수색 및 구조 수상 기구 솔루션<br />조직 유형별
  subtitle: 서로 다른 구조 조직은 해안 자원봉사 팀부터 국가 해안경비대 함대에 이르기까지 서로 다른 임무, 예산 주기, 운영 환경 하에 운영됩니다. 우리는 모든 구조를 RIB 임무 프로필에 맞게 구성합니다.
  items:
    - title: 해안경비대 및 정부 수색 구조 기관
      subtitle: 절대적인 안전 책임 — 미션 크리티컬 함대 기준
      description: 정부 수색 구조 기관은 해상 작전에서 가장 높은 안전 책임을 집니다. 모든 보트는 극한 조건에서도 완벽하게 작동해야 하며, 구조 임무 중 장비 고장은 선택지가 아닙니다. 조달 결정은 초기 비용이 아니라 10-15년의 서비스 수명 동안 총 소유 비용에 따라 결정됩니다. 기관들은 수년간의 해안 순찰을 견디고, 엄격한 국가 기준을 충족하며, 분산된 기지 전반에 걸쳐 일관된 성능을 제공하는 선박을 필요로 합니다. 포괄적인 준수 문서와 다년간의 서비스 계약이 필수적입니다.
      features:
        - SOLAS 그리고 국가 SAR 표준 준수 문서 패키지
        - 함대 전체 부품 공용 성 — 기지 단위 재고 복잡성 감소
        - 임무 중요 중복성을 위한 쌍발 엔진 구성
        - 10-15년 서비스 수명 설계와 정기 정비 프로그램
        - 전천후 능력 — 거친 해상 상태를 위한 강화된 딥-V 선체
    - title: 구조대 및 해변 구조 서비스
      subtitle: 신속 발사, 얕은 수역 작전
      description: 시 및 해변가 구조대는 파도 구역을 통과해 출항하고, 얕은 연안에서 작전하며, 수영객이나 조난 선박에 몇 분 내에 도달할 수 있는 신속 대응 선박이 필요합니다. 장비는 소형 차량이나 수동으로 해변 견인이 가능할 만큼 가벼워야 합니다.
      features:
        - RIB 서핑 구역 및 내륙 작업을 위한 얕은 흘수 선체
        - 선수 리프팅 핸들과 키일 가드를 갖춘 해변 발치가 가능하다
        - 통합 구조용 썰매 또는 구조용 수영용 플랫폼
        - 고가시성 주황색 또는 노란색 튜브 색상 표준
    - title: 소방 구조 부서
      subtitle: 소방펌프 통합, 장비 장착, 신속 대응
      description: 화재 구조 해양 부대는 해안가 구조물 화재, 선박 화재, 수상 구조 사고에 대응합니다. 이 보트들은 소방 펌프, 모니터, 호스 보관 장치, 호흡 장비를 탑재해야 하며, 모두 안정적이고 신속한 대응 플랫폼에 통합되어 있어야 합니다. 부서는 홍수 대응 및 상호 지원 작업에도 이 선박을 사용합니다. 콘솔 배치는 승무원 이동을 위한 갑판 공간을 해치지 않으면서 펌프 제어장치, 무선 시스템, 비상 조명을 수용해야 합니다.
      features:
        - 펌프 통합 패키지가 포함된 선수 장착 화재 모니터
        - 화재 펌프, 호스 보관 및 BA 세트용 전용 장비 장착
        - 펌프 제어, 라디오, 비상 조명 설정 가능한 콘솔 레이아웃
        - 소방수 유출과 안정성을 위한 자가 배수 갑판
        - '야간 작전 패키지: 탐조등, 장면 조명, 청색/빨간색 라이트 바'
    - title: 해양경찰 및 항만 보안
      subtitle: 단속, 순찰, 승선 작전
      description: 해양 법 집행 부대는 고속 추적, 용의선 승선, 항구 보안 순찰이 가능한 함정을 필요로 합니다. 이러한 선박은 집행 장비와 무기를 안전하게 보관할 수 있어야 하고, 육상 지휘와의 통신 통합이 가능하며, 승선 팀 작전을 위한 충분한 갑판 공간을 갖추어야 합니다. 단속 임무를 위해 야간 작전 능력과 저프로파일 접근이 필수적입니다.
      features:
        - 고속 추적 능력 — 계획형 선체, 최고 속도 40+ 노트
        - 안전한 무기 보관함 및 집행 장비 수납 공간
        - 경찰 라디오, MDT 및 통신 시스템용 콘솔 통합
        - '야간 작전 패키지: IR 스포트라이트, FLIR 마운트, 은밀한 조명'
        - 강화된 승선 플랫폼, 논슬립 표면
        - 청색/적색 비상등 및 사이렌 시스템
    - title: 자원봉사 SAR 및 비영리 단체
      subtitle: 보조금 지원, 지역사회 기반 해안 및 호수 작전
      description: 지역사회 기반 구조 단체는 정부 SAR 지원이 제한적인 호수, 강, 연안 지역에서 활동합니다. 종종 기부금이나 정부 보조금으로 운영되며, 이들 단체는 투자 대비 최대 성능을 갖춘 내구성이 높고 유지보수가 적은 선박을 필요로 하며, 최소한의 전용 훈련으로 자원봉사자가 안전하게 운용할 수 있어야 합니다. 보조금 조달 주기 때문에, 선박은 규정 준수 요건을 충족하면서 정해진 예산 내에서 유지해야 합니다.
      features:
        - 취득 및 운영 비용을 낮춘 단일 외부 엔진 구성
        - 유지보수가 쉽고 현장 수리가 용이한 PVC 구조
        - 자원봉사자가 전자 장비 복잡성을 최소화할 수 있는 다기능 콘솔
        - 보조금 신청용 준수 문서 패키지
        - 전용 트레일러나 크레인 없이 해안에서 출항 가능한 경량 설계
    - title: 홍수 구조 및 재난 대응
      subtitle: 내륙 홍수, 얕은 물, 잔해가 많은 환경
      description: 홍수 구조는 특수한 작전 환경입니다 — 선박은 침수된 도시 지역, 잔해가 많은 급류, 잠긴 장애물이 보이지 않는 극히 얕은 물에서 운용됩니다. 운영자는 침수된 도로에서 항해하고, 잔해를 돌파하며, 건물과 차량에서 피해자를 구조할 수 있는 선박이 필요합니다. 얕은 흘수 능력이 중요하며, 장애물이 있는 급류에서도 운용 가능해야 합니다. 이러한 선박은 소방서, 민방위, 재난 구호 NGO에서 자주 배치됩니다.
      features:
        - 초저흘수 선체 — 30-50cm 물에서도 운용 가능
        - 잔해를 튕겨내는 선수와 잠긴 장애물 보호용 강화 튜브
        - 홍수수 장치 및 피해자 구조를 위한 자기 배수 갑판
        - 항공 정찰용 고가시성 주황색 또는 노란색 튜브
        - 헬리콥터 운송 및 도로 배치를 위한 경량 설계
        - 호이스트 및 로프 구조 작전을 위한 강화 리프팅 포인트
cta:
  title: 구조 요구 사항 논의
  subtitle: 우리 팀은 전 세계 구조 단체에 장비를 공급해 왔습니다. 우리는 조달 요구 사항을 이해하며, 준수 문서를 제공할 수 있습니다.
  actions:
    - variant: primary
      text: 우리 SAR 팀과 상담하세요
      href: /contact
    - text: 순찰 RIB 모델 보기
      href: /products
