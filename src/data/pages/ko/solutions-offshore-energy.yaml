content_challenge:
  tagline: 도전 과제
  title: 해상 에너지 수요<br />극한 환경 신뢰성
  subtitle: 해상 에너지 작업은 장비를 극한의 기상 조건, 외진 위치, 연속 근무 주기, 그리고 고장에 대한 무관용 등 한계까지 밀어붙입니다.
  paragraphs:
    - 해상 에너지 산업은 지구상에서 가장 까다로운 해양 환경에서 운영됩니다. 작업선은 석유 및 가스 플랫폼, 풍력 터빈 설치, 해저 케이블 운영, 해양 건설 프로젝트를 지원하며, 종종 제한된 기상 조건과 열린 바다 조건에서 이루어집니다. 장비 고장은 비용이 많이 들 뿐만 아니라 위험합니다.
    - '**안전이 최우선입니다** — 승무원 이송선은 다른 작업이 중단될 수 있는 해상 상태에서도 안전하게 운항해야 합니다. 이송 지점의 안정성, 모든 기상 조건에서의 신뢰할 수 있는 엔진 성능, 그리고 해상 구조물에 반복적으로 도킹할 수 있는 견고한 구조가 필수 요건입니다.'
    - '**전천후 능력이 필수** — 해상 풍력 발전소와 석유 플랫폼은 연중 운영됩니다. 작업선은 거친 파도, 강풍, 제한된 시야 환경에서 수행해야 합니다. 주야간 운용은 완전한 항법 장비와 신뢰할 수 있는 조명 시스템이 필요합니다.'
    - '**해상 풍력 부문은 빠르게 성장하고 있습니다** — 전 세계적으로 수천 대의 신규 터빈이 설치되고 있으며, 각각 정기적인 승무원 이동, 공구 운송, 유지보수 지원이 필요합니다. 이로 인해 전용 승무원 이동선(CTV)과 지원에 대한 지속적인 수요가 생깁니다RIBs.'
    - Paddle Board Overstock 해양 에너지 RIBs 는 강화된 딥-V 선체, 중장비 Hypalon 튜브, 완전한 항법 장비, 그리고 극한 해양 에너지 작업에 맞춘 안전 시스템으로 설계되었습니다.
content_solution:
  tagline: 우리의 해결책
  title: 목적 설계 해상 RIBs<br />에너지 산업을 위한
  subtitle: 모든 Paddle Board Overstock 해상 에너지 RIB 는 북해에서 동남아시아에 이르는 극한 해양 환경에서 안전하고 신뢰할 수 있는 운영을 위해 설계되었습니다.
  list:
    - 거친 수역에서의 성능과 예측 가능한 조종을 위한 강화된 딥-V 선체를 적용했습니다
    - Hypalon UV 장기간 해상 운항을 위한 중장비 튜브와 화학 저항성
    - 316 스테인리스 스틸 하드웨어 — 연속적인 염수 노출 시 부식 없음
    - '전체 내비게이션 세트: GPS, 레이더, VHF, 야간 내비게이션 등 — 해상 모델 기본 장착'
    - 승선 해상 조건에서 안전하게 운용하기 위한 자가 포장 갑판
    - 다양한 엔진 구성 — 임무 중복성을 위한 단일 또는 쌍둥이 외부 엔진
    - 플랫폼 및 부표 취급용 견인 포스트 및 고강도 클릿
    - 해양 작업 현장에서 식별을 위한 고가시성 튜브 색상
content_segments:
  tagline: 에너지 프로필
  title: 해양 에너지 솔루션<br />응용 유형별
  subtitle: 다양한 해양 에너지 부문은 고유한 작업선 요구 사항을 가지고 있습니다 — 플랫폼 지원부터 RIBs에서 풍력 발전 CTV, 해저 검사 선박까지.
  items:
    - title: 해양 석유 및 가스 플랫폼 지원
      subtitle: 승무원 이송, 장비 공급, 플랫폼 안전 대기
      description: 석유 및 가스 플랫폼은 매일 승무원 교대, 장비 및 물자 운송, 안전 대기 지원이 필요합니다. 작업선은 강한 조류와 변화하는 해상 상태에서도 플랫폼 구조 주변에서 안전하게 운항해야 하며, 사다리나 통로를 통한 인원 이송 시 정확한 위치 유지가 요구됩니다. 극한 환경 — 탄화수소, 화학물질, 지속적인 염분 스프레이 — 은 내식성 구조와 신뢰할 수 있는 성능을 요구합니다.
      features:
        - 안전한 승선 접근과 손잡이가 있는 승무원 이송 구성
        - 내식성 Hypalon 튜브 및 316 스테인리스 스틸 하드웨어
        - 자주 플랫폼 펜더 접촉에도 견딜 수 있는 강화 러빙 스트레이크
        - 오일 물 및 화학 세척용 자기 배수식 데크
        - 장거리 해상 운항을 위한 대용량 연료 탱크
        - 임무 중요 중복성을 위한 쌍둥이 엔진 옵션
    - title: 해양 풍력 발전소 운용
      subtitle: 승무원 이송, 터빈 유지보수, 공구 운송
      description: 해양 풍력은 해상 에너지에서 가장 빠르게 성장하는 부문입니다. 운영자는 최대 1.5m 유의파고의 해상 조건에서도 기술자를 터빈 접근 플랫폼으로 안전하게 이송할 수 있는 승무원 이송 선박(CTV)이 필요합니다. 이송 시 안정성, 전천후 운항 능력, 신뢰할 수 있는 일일 운행이 필수적입니다. 풍력 발전소 서비스 선박은 촉박한 일정으로 운항되므로, 운항 중단 시간은 터빈 시운전 또는 유지보수를 지연시켜 에너지 생산 수익에 직접적인 영향을 미칩니다.
      features:
        - 터빈 기초에서 안정적인 승무원 이송을 위한 최적화된 선체 형상
        - 외해의 잔물결과 파도에서 편안한 운항을 위한 딥-V 선입
        - 승무원의 안락함을 위한 완전 기상 보호 — 콘솔 또는 조타실 밀폐
        - 공구, 예비 부품, 서비스 장비를 위한 데크 공간
        - 겨울철 낮 시간 제한 근무를 위한 야간 작업 패키지
        - 해양 환경에 최소한의 소음 영향을 주는 조용한 외부 엔진 운행
    - title: 해저 케이블 및 파이프라인 지원
      subtitle: 검사, 유지보수, ROV 지원, 측량
      description: 해저 케이블 및 파이프라인 운영자는 경로 검사, 유지보수 지원, ROV 운용, 측량 작업을 위한 작업선이 필요합니다. 이러한 선박은 수중 장비 배치 및 회수를 위한 안정적인 플랫폼, 케이블 추적을 위한 정확한 저속 기동, 해안 및 연안 환경에서의 신뢰할 수 있는 운항 능력이 요구됩니다. 선박 안정성은 소나 및 측량 장비의 정확성에 매우 중요합니다.
      features:
        - 저속에서 케이블 추적 및 측량 작업을 위한 안정적인 플랫폼
        - ROV 배치, 케이블 스풀 및 측량 장비를 위한 개방형 데크 레이아웃
        - 소나, GPS 및 측량 장비용 장비 장착판
        - 검사 중 해저 교란을 최소화하는 저흘수 선체 설계
        - 반응성 좋은 외부 조종 장치를 통한 정밀 저속 기동
    - title: 해양 공학 및 건설 지원
      subtitle: 인원 수송, 자재 공급, 다이빙 지원
      description: 항만 건설, 연안 보호 및 해상 설치 프로젝트를 수행하는 해양 공학 계약업체는 건설 선박과 육지 사이의 인원 수송, 자재 및 도구 공급, 다이빙 지원, 현장 조사를 위한 다목적 작업 보트가 필요합니다. 이러한 보트는 여러 선박이 운항하는 활발한 건설 구역에서, 제한된 기동 공간과 다양한 해상 조건에서 운항합니다. 내구성과 다목적성이 가장 중요합니다.
      features:
        - 인원, 자재 및 다이빙 장비를 위한 다목적 데크 배치
        - 다이빙 지원 작업을 위한 다이빙 사다리 및 장비 장착
        - 건설 현장 기동을 위한 견고한 클리트와 견인 기둥
        - 건설 잔해 및 마모 저항용 견고한 Hypalon 구조
        - 유연한 좌석 구성 — 승무원 수송 또는 화물 모드
