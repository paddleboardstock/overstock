faq:
  title: OEM/ODM — 자주 묻는 질문
  questions:
    - q: 맞춤형 에어 인플레이션 SUPs의 최소 주문 수량(MOQ)은 얼마입니까?
      a: 기존 몰드가 있는 표준 모델의 경우, MOQ 디자인당 5–10단위부터 시작합니다. 완전 맞춤 금형과 금형의 경우 MOQ 보통 200+단위입니다. 우리는 스타트업과 신흥 브랜드와 협력하여 실현 가능한 진입 지점을 찾습니다.
    - q: MOQ 커스텀 보트의 기준은 무엇인가요 RIB ?
      a: RIB 기존 몰드를 사용한 모델들은 디자인당 2–5단위부터 시작하지만, 완전 맞춤 RIB 몰드는 더 큰 투자가 필요합니다. 우리는 스타트업과 기존 브랜드와 협력하여 현실적인 진입 지점을 찾습니다.
    - q: OEM 샘플 과정은 얼마나 걸리나요?
      a: 표준 프로토타입 샘플은 설계 승인 후 7–14영업일 이내에 완료됩니다. 추가 비용을 지불하면 급한 주문은 5–7일로 우선 처리할 수 있습니다.
    - q: PVC Hypalon 고무보트와 고무보트의 차이점은 무엇인가요?
      a: PVC 더 가볍고 저렴하며, 추운 날씨에도 뛰어난 유연성을 제공합니다. () 수명이 더 길고 오존 저항성이 뛰어나며Hypalon CSMUV (10–15년 대 5–8년) 장점이 있습니다. PVC 대부분의 레크리에이션 용도와 Hypalon 상업적/전문적 용도에 권장합니다.
    - q: 인플레이터블의 모양과 디자인을 맞춤 설정할 수 있나요?
      a: 네. 저희 연구개발팀은 선체 형태, 판자 윤곽, 튜브 구성에 맞는 맞춤형 몰드를 개발할 수 있습니다. CNC정밀도와 일관성을 위해 가공된 알루미늄 몰드를 사용합니다.
    - q: 공장 감사 서비스를 제공하나요?
      a: 저희는 12,000 m² 규모의 칭다오 시설에서 현장 및 제3자 공장 감사를 환영합니다. 저희는 ISO 9001 BSCI 및 인증을 유지하며 감사 보고서를 공유할 수 있습니다NDA.
    - q: 어떤 배송 조건을 제공하나요?
      a: 저희는 FOB 칭다오(표준), CIF배송 DDP 조건을 제공합니다. 컨테이너 적재 및 전체 수출 서류가 모든 주문에 포함되어 OEM 있습니다.
content_profiles:
  tagline: 브랜드 프로필
  title: OEM / 프라이빗 라벨 제조<br />고객 유형별
  subtitle: 브랜드 프로필마다 요구사항이 다릅니다 — 저희는 OEMODM 귀하의 비즈니스 모델, 규모, 시장 진출 전략에 맞춰 서비스를 맞춤화합니다.
  items:
    - title: 스타트업 수상 기구 브랜드
      subtitle: 낮MOQ고 빠른 속도 상승
      description: 첫 라인의 RIB 보트, 즉 팽창식 보트를 출시하는 창업가SUPs들. 진입 기준이 낮고, 유연한 배치 크기이며, 매 단계마다 실무 디자인 지도를 제공하는 제조 파트너가 필요합니다.
      features:
        - MOQ 최대 2–5단위(RIB) / 5–10단위(SUP)SKU
        - 기존 금형 라이브러리를 활용해 금형 비용을 건너뛰게 할 수 있습니다
        - '전체 브랜딩 패키지: 로고, 튜브 그래픽, 포장, 행태그'
        - 샘플 우선 워크플로우 — 제작 전에 승인하세요
    - title: 기존 해양 브랜드
      subtitle: OEM 스케일링 CE/ISO 컴플라이언스
      description: 기존 보트, PWC, 해양 액세서리 브랜드가 인플레이터블 수상 선박을 포트폴리오에 추가하는 경우입니다. 생산 공정에 걸쳐 일관된 품질, 글로벌 시장을 위한 규제 준수, 맞춤형 선체나 튜브 형태의 공동 설계 능력이 필요합니다.
      features:
        - 독점 설계를 위한 맞춤형 3D 몰드 엔지니어링
        - CE 2013/53/EU, UKCAUSCG 준수 문서
        - BSCI 소매업체 준수를 위한 사회적 감사 보고서
        - 전담 계정 관리 + 우선 생산 슬롯
    - title: DTC 및 전자상거래 브랜드
      subtitle: 대규모 소매용 포장
      description: 아마존, Shopify 또는 자체 웹스토어를 통해 판매하는 온라인 우선 브랜드. 포장, 언박싱 경험, 그리고 일관된 단위 품질이 중요합니다. 전자상거래의 속도와 반품률 동향을 이해하는 공장이 필요합니다.
      features:
        - 소매용 박스 디자인 + 삽입 카드 인쇄
        - 비용 효율적인 배송을 위한 진공 포장 / 팔레타이징
        - EAN / UPC 바코드 및 관세 준비 문서
        - 도착 비용 최적화를 위한 혼합 컨테이너 통합
    - title: 렌털 & 호스피탈리티 운영자
      subtitle: 리조트 및 렌털 비즈니스를 위한 플릿 등급 구축
      description: 리조트, 수상 스포츠 센터, 렌털 운영자는 일관된 브랜딩을 가진 내구성 있고 서비스 가능한 플릿이 필요합니다. 우리는 플릿 가격, 혼합 모델 컨테이너 및 수년간 운영을 위한 교체 부품 지원을 제공합니다.
      features:
        - 혼합 모델 컨테이너 주문 시 플릿 가격
        - 내구성 있는 상업용 튜브 및 데크 옵션
        - 예비 부품 키트 및 유지 관리 교육
        - SUP, RIB, 카약 플릿 전반에 걸친 일관된 브랜딩
