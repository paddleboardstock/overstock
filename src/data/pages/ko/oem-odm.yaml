process_steps:
  title: 6단계 OEM/ODM 프로세스
  subtitle: 디자인 브리프에서 FOB 칭다오까지 — 간소화된 작업 흐름
  steps:
    - number: '01'
      title: 디자인 브리프 & 3D CAD 모델링
      description: 목표 사양, 참조 제품 또는 컨셉을 공유하십시오. 당사의 엔지니어링 팀이 상세 CAD 도면과 3D 렌더링을 개발하여 승인을 받습니다.
      timeline: 3–5일
    - number: '02'
      title: 재료 선택 및 원단 테스트
      description: 군용 등급 PVC (0.9–1.2 mm), Hypalon CSM, 또는 drop-stitch 코어 원단 중에서 선택합니다. 인장 강도, 코팅 부착력 및 UV 안정성 테스트를 수행합니다.
      timeline: 2–3일
    - number: '03'
      title: 빠른 프로토타이핑 및 샘플 제작
      description: 우리는 CNC-머신 커스텀 몰드를 제작하고 브랜드 색상, 로고 및 지정된 재료로 사전 생산 샘플을 제조합니다. 샘플은 승인받기 위해 배송됩니다.
      timeline: 7–14일
    - number: '04'
      title: 24–48시간 고압 유지 테스트
      description: 각 프로토타입은 정격 압력의 1.25배에서 엄격한 압력 유지 테스트를 받습니다. 봉합선 박리 테스트 및 치수 검증이 수행됩니다.
      timeline: 1–2일
    - number: '05'
      title: CE/ISO 품질 검사 및 포장
      description: 100점 만점 품질 체크리스트. 모든 제품은 소매 준비 포장 전에 검사됩니다. CE 적합성 선언서 및 BSCI 준수 보고서 포함.
      timeline: 2–3일
    - number: '06'
      title: FOB 칭다오 배송 및 물류
      description: 완제품은 팔레트에 적재, 수축 포장 후 칭다오 항구에서 컨테이너에 적재됩니다. 모든 수출 서류, 통관, 실시간 추적 가능.
      timeline: 7–14일
