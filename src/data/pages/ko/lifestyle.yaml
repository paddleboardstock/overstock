hero:
  tagline: 라이프 스타일
  title: 그 Paddle Board Overstock<br />라이프 스타일
  subtitle: 물 위에서 사는 사람들을 위해 만들어졌습니다 — 주말 탐험가부터 매일 장비에 의존하는 상업용 운영자까지.
values:
  - icon: 🌊
    title: 물 위에 태어나다
    desc: 모든 디자인은 물이 어떻게 움직이는지 이해하는 데서 시작합니다. 우리는 조건의 경계에서 중심으로 설계합니다 — 왜냐하면 바다는 우리의 직장이 아니라 교사이기 때문입니다.
  - icon: 🔧
    title: 오래가도록 만들어진
    desc: 가장 지속 가능한 제품은 교체할 필요가 없는 제품입니다. 해양 등급 재료, 15 PSI로 등급이 매겨진 drop-stitch 코어, 그리고 시즌보다 더 오래 지속되는 솔기.
  - icon: 🏆
    title: 디자인으로 접근 가능
    desc: 수상 스포츠는 사치가 되어서는 안 됩니다. 가족, 가이드, 소규모 운영자를 위한 합리적인 가격에 전문 수준의 성능 — 단지 상업용 함대만을 위한 것이 아닙니다.
  - icon: 🌍
    title: 글로벌 커뮤니티
    desc: '칭다오 해안에서 유럽의 호수, 동남아시아의 강, 아메리카의 만에 이르기까지, 우리 고객들은 한 가지 공통점을 가지고 있습니다: 물 위에 있는 것을 좋아한다는 것입니다.'
  - icon: ♻️
    title: 책임 있는 제조
    desc: CNC에 최적화된 네스팅은 재료 손실을 5% 미만으로 줄입니다. 내구성이 강한 구조는 교체 주기를 줄여줍니다. 우리는 장기 사용을 위해 제작합니다. 왜냐하면 그것이 가장 지속 가능한 선택이기 때문입니다.
  - icon: 🤝
    title: 지속되는 지원
    desc: 20년 된 선체들도 여전히 부품을 위해 우리에게 연락합니다. 우리 보증 대응 시간은 평균 24시간입니다. 우리는 판매 후 사라지지 않고 — 제품의 수명 동안 함께합니다.
