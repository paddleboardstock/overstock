hero:
  tagline: 우리의 이야기
  title: Aquafarer — 엔지니어링 프리덤 온 워터
  subtitle: '해안 작업장에서 글로벌 해양 제조업체에 이르기까지 — 우리의 여정은 완고한 신념 위에 세워집니다: 수상선은 중요하게 설계되어야 하며, 실제로 그렇기 때문입니다.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer 칭다오의 공장 및 해양 제조 시설
stats:
  title: Aquafarer 숫자에 따라
  stats:
    - title: 설립
      amount: 2012
    - title: 시설
      amount: 12,000 m²
    - title: 서비스 대상 국가
      amount: 50+
    - title: 연간 수용 인원
      amount: 15,000 단위
    - title: 직원
      amount: 200-300
    - title: 연구개발 엔지니어
      amount: 14+
timeline:
  - year: '2012'
    title: 해양 제조 재단
    body: 중국 Aquafarer 칭다오에서 해양 장인정신과 고무보트 제조에 전념하는 전문 인플레이터블 수상 기구 작업장으로 시작했습니다. 초기 목표는 실무 엔지니어링 경험과 제조 규율을 통해 신뢰할 수 있는 인플레이션 제품을 만드는 것이었습니다.
  - year: '2015'
    title: 첫 수출 및 CE 인증
    body: 초기 수출 주문은 일본과 한국에 도달했습니다.CE 핵심 제품군에 대한 인증을 획득하여 Aquafarer국제 시장 진출을 알렸습니다. 회사는 중국 외 상업 및 레크리에이션 사용자들에게 서비스를 제공하기 시작했습니다.
  - year: '2018'
    title: 공장 확장
    body: 12,000 m² 생산 시설로 이전. RF 용접 라인과 drop-stitch 생산 능력을 추가하여 대규모 제조와 품질 관리 시스템 개선을 가능하게 했습니다.
  - year: '2020'
    title: 연구개발 센터 설립
    body: PVC 섬유 실험실, 유체역학 시험 탱크, CAD/FEA 시뮬레이션 스튜디오를 갖춘 전용 연구개발 센터를 개설했습니다. 제품 개발은 경량 구조, 내구성 향상, 사용자 중심 설계에 초점을 맞출 수 있도록 확장되었습니다.
  - year: '2022'
    title: 인증 및 글로벌 성장
    body: ISO 9001 인증을 획득. 연구개발 엔지니어 14명과 직원 200명으로 확대+됨. 제품은 유통업체와 파트너십을 통해 유럽, 아메리카, 아시아 태평양 전역의 고객에게 도달했다 OEM .
  - year: '2024'
    title: 혁신 및 디자인 스튜디오
    body: 콘셉트부터 생산까지 맞춤형 프로젝트를 위한 종합 디자인 및 혁신 스튜디오를 개설 ODM 했습니다. 구조, 상업, 정부 입찰 등 전문 해양 분야를 강화했습니다.
  - year: '2026'
    title: 수자원 탐사의 미래 구축
    body: 오늘날에도 팽 Aquafarer 창식 보트, SUP 시스템, 맞춤형 해양 솔루션을 개발하며 사람과 조직을 세계 해역과 연결합니다. 50+개국에서 서비스를 제공하며, 연간 15,000대 생산 능력을 갖추고 있습니다.
content_founding:
  tagline: 시작
  title: 해안가에서 태어났다
  subtitle: 칭 Aquafarer 다오의 해안 작업장에서 한 척의 보트와 실제 해양 환경을 견딜 수 있는 팽창식 수상 선박을 만드는 비전으로 시작했습니다.
  paragraphs:
    - 2012년, 창립자들은 시장의 틈새를 발견했습니다 — 대부분의 팽창식 보트는 저렴하지만 신뢰할 수 없거나, 고품질이지만 너무 비싸다는 것이었습니다. 그들은 품질과 가치를 모두 제공하는 제조업체가 자리를 지킬 수 있다고 믿었습니다.
    - 첫 선체는 수작업으로 제작되었고, 현지 해역에서 시험되었으며, 어부들과 소규모 상업 운영자들의 실제 피드백을 바탕으로 다듬어졌습니다. 이 피드백 루프 — 제작, 테스트, 경청, 개선 — 은 오늘날 우리의 공학 철학의 핵심입니다.
    - 2015년까지 소식은 칭다오를 넘어 퍼졌다. 국제 유통업체들이 샘플을 요청하기 시작했다. 지역 워크숍으로 시작된 것이 글로벌 공급업체로 성장했다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 초기 생산 작업장 및 제조
content_growth:
  tagline: 성장과 혁신
  title: 작업장에서 12,000 m² 시설로
  subtitle: 인력, 장비, 공정에 대한 지속적인 투자는 Aquafarer 현대적인 해양 제조 시설로 변모했습니다.
  paragraphs:
    - 수요가 증가함에 따라 우리 시설도 함께 확장되었습니다. 우리는 작은 작업장에서 보 RIB 트, 팽창식 보트, 보드, 액세서리 전용 생산 라인을 갖춘 12,000 m² 규모의 공장으로 확장 SUP 했습니다.
    - 우리는 CNC 절단기, 고주파 용접 장비, 드롭 스티치 생산 라인, 종합 테스트 장비에 투자하여 생산 품질의 모든 측면을 통제할 수 있게 했습니다.
    - 현재 200-300명 규모의 우리 팀은 해양 엔지니어, 재료 과학자, 품질 관리 전문가, 숙련된 장인들로 구성되어 있으며, 이들 중 다수는 Aquafarer 초창기부터 함께해 왔습니다.
founder:
  tagline: 창립자를 만나보세요
  title: 워터맨이 지은
  subtitle: 창립자 데이비드 첸은 제조 전문성과 평생의 워터스포츠에 대한 열정을 결합하여 Aquafarer 제품 개발 방식을 정의합니다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: 데이비드 첸 — 창립자 Aquafarer
  story:
    - 데이비드 첸은 칭다오 해안에서 자랐으며, 그곳의 바다는 휴양지가 아니라 삶의 방식이었습니다. 그는 젊은 시절 황해에서 카약, 요트, 낚시를 즐겼으며, 이 경험들은 수상 기구가 견뎌야 할 고통을 직관적으로 이해하게 해주었습니다.
    - 설립 전Aquafarer, 데이비드는 해양 제조 분야에서 10년간 근무하며 생산, 품질, 국제 무역 전반에 걸쳐 일했습니다. OEM 그는 유럽과 북미 브랜드의 프로그램을 관리하며 글로벌 시장의 기준과 기대치를 직접 배웠습니다.
    - '2012년, 그는 Aquafarer 단순한 사명을 가지고 설립했습니다: 자신의 가족과 함께 물 위에서 신뢰할 수 있는 팽창식 수상 기구를 만드는 것이었습니다. 그 개인적인 기준 — 내가 이걸 사용할까? — — 공장에서 나오는 모든 제품에 대한 최종 시험으로 남아 있습니다.'
    - 현재 데이비드는 제품 전략을 이끌고 연구개발팀을 총괄하며, 직접 신설계를 검토하고 칭다오 해상에서 프로토타입을 테스트하고 있습니다. 그는 훌륭한 제품은 엔지니어링과 경험을 모두 이해하는 데서 나온다고 믿습니다.
philosophy:
  tagline: 브랜드 철학
  title: 물 위의 엔지니어링 프리덤
  body: 물 위의 자유는 단순히 움직임에 관한 것이 아닙니다. 새로운 장소를 발견하고, 야외 경험을 만들며, 사람들을 자연과 연결하고, 전문적인 임무를 가능하게 하는 것을 의미합니다. 공학은 그 자유를 가능하게 합니다.
  pillars:
    - title: 신뢰성 우선
      body: 수상 환경은 신뢰를 요구합니다.Aquafarer 제품은 안정성, 내구성, 안전성, 일관된 성능을 중심으로 설계되었습니다.
    - title: 인간 중심 설계
      body: 제품은 기술을 위한 것이 아니라 사람을 위한 것입니다. 모든 디자인 결정은 사람들이 수상 기구를 어떻게 사용하는지, 어디를 탐험하는지, 어떤 어려움에 직면하는지 이해하는 것에서 시작됩니다.
    - title: 접근 가능한 탐험
      body: 물은 전문가만의 것이 되어서는 안 됩니다.Aquafarer 더 많은 사람들이 강, 호수, 바다, 해안 환경을 안전하게 경험할 수 있는 장비를 만듭니다.
    - title: 지속적인 혁신
      body: 혁신은 단순히 신제품을 만드는 것만이 아닙니다. 그것은 재료, 구조, 제조, 사용자 경험 등 모든 세부 사항을 개선하는 것입니다.
engineeringDna:
  tagline: 공학 DNA
  title: 어떻게 Aquafarer 제품을 만듭니다
  areas:
    - title: 재료과학
      body: Aquafarer은 다양한 해양 환경에 적합한 재료를 선택하는 데 중점을 둡니다. 주요 고려 사항에는 내마모성, UV 저항, 압력 안정성 및 장기 내구성이 포함됩니다.
      items:
        - 마모 저항
        - UV 저항
        - 압력 안정성
        - 장기 내구성
    - title: 구조 공학
      body: 인플레이션 수상 장치는 강성, 무게, 휴대성 및 안정성 사이의 정밀한 균형이 필요합니다. Aquafarer 공학은 drop-stitch 핵심 기술과 고급 솔기 구조를 통해 이러한 요소를 최적화하는 데 중점을 둡니다.
      items:
        - 강성
        - 무게 최적화
        - 이식성
        - 안정
    - title: 제조 정확도
      body: '모든 제품은 다음과 같은 통제된 과정을 거칩니다: 재료 준비, 정밀 절단, 용접 및 접착, 조립, 품질 검사 및 성능 검증.'
      items:
        - 재료 준비
        - 정밀 절단
        - 용접 및 접착
        - 조립 및 QC
    - title: 사용자 시나리오 엔지니어링
      body: 제품은 실제 적용 사례 — 레크리에이션, 모험 및 전문 사용 — 에 맞춰 개발되어 각 설계가 대상 환경의 특정 요구를 충족하도록 보장합니다.
      items:
        - 레크리에이션
        - 모험
        - Professional
        - 광고
trustSignals:
  tagline: 신뢰 신호
  title: 왜 Aquafarer가 신뢰할 수 있는 파트너인가
  manufacturing:
    title: 제조 역량
    body: 200-300명의 숙련된 근로자와 14명의 + R&D 엔지니어가 있는 12,000 m² 생산 시설. ISO 9001 인증 품질 관리 시스템. 연간 15,000대의 인플레이터블 수상 장치를 생산하여 50개 + 국가에 공급.
    stats:
      - label: 시설 규모
        value: 12,000 m²
      - label: 인력
        value: 200-300
      - label: 연구개발 엔지니어
        value: 14+
      - label: 연간 수용 인원
        value: 15,000
  quality:
    title: 품질 약속
    body: 재료 검사부터 최종 테스트까지, Aquafarer는 신뢰할 수 있는 해양 제품을 제공하기 위해 체계적인 품질 프로세스를 유지합니다. 모든 단위는 출하 전에 압력 테스트, 솔기 검사 및 성능 검증을 거칩니다.
    items:
      - CE 인증 완료 — 64개 모델이 유럽 안전 기준을 충족
      - ISO 9001:2015 — 품질 경영 시스템 인증
      - UKCA 표시됨 — 영국 시장 적합성
  global:
    title: 글로벌 존재
    body: Aquafarer는 유럽, 아시아-태평양, 아메리카, 중동, 아프리카 전역의 50+개국에서 배급업체, 아웃도어 브랜드, 전문 해양 사용자를 지원하며 여러 글로벌 시장에서 고객에게 서비스를 제공합니다.
comparison:
  tagline: 브랜드 포지셔닝
  title: Aquafarer 시장에서
  position: 공학 중심의 해양 제조업체로, 팽창식 수상 기구 전문 지식과 완전한 OEM/ODM 능력, 맞춤형 솔루션, 그리고 깊은 제조 경험을 결합합니다.
  strengths:
    - 팽창식 수상기구 공학 전문 지식
    - 전체 OEM/ODM 제조 능력
    - 맞춤형 제품 개발 및 디자인
    - 12,000 m² ISO 9001 인증 생산 시설
  bestFor:
    - 신뢰할 수 있는 팽창식 수상 기구를 찾는 야외 레크리에이션 이용자
    - 상업용 장비가 필요한 해양 작업자
    - 브랜드 파트너가 OEM/ODM 제조가 필요함
    - 전문 구조 및 순찰 조직
cta:
  title: 제조업체와 협력할 준비가 되어 있습니다<br />품질을 중요하게 여기는?
  subtitle: 최소 주문 압박 없이, 단지 정직한 조언만 제공하니 OEM/ODM 프로젝트에 대해 논의하려면 저희 팀에 연락하세요.
  actions:
    - variant: primary
      text: 대화를 시작하다
      href: /contact
    - text: 우리 제품을 살펴보세요
      href: /products
