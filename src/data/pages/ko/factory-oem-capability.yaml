hero:
  tagline: OEM/ODM 제조업
  title: OEM 및 프라이빗 라벨 제조
  subtitle: 개념에서 컨테이너까지 — 인플레이션 수상 장비 라인의 모든 세부 사항을 맞춤화하세요
intro: Paddle Board Overstock는 전 세계 브랜드, 유통업체, 정부 기관을 위한 종합적인 OEM 및 ODM 서비스를 제공합니다. 10+년의 수출 경험과 12,000 m² 규모의 ISO, ISO 9001 및 BSCI 인증 공장을 바탕으로 제품 디자인 및 금형 개발에서부터 대규모 생산, 포장 및 물류까지 모든 것을 처리합니다.
highlight:
  - value: 10+
    label: OEM년 경력
    detail: 2012년부터
  - value: 50+
