    detail: 글로벌 네트워크
  - value: 200+
    label: 맞춤 프로젝트 제공
    detail: 모든 제품 라인에 걸쳐
  - value: 30–45
    label: 표준 리드 타임(일수)
    detail: PO에서 FOB까지
services:
  - title: 제품 디자인 및 엔지니어링
    description: 저희 사내 R&D 팀은 귀사의 컨셉 또는 사양을 바탕으로 CAD 도면, 3D 모델, 프로토타입을 개발합니다. 금형 설계, 선체 형상 최적화, 소재 선택 가이드를 제공합니다.
  - title: 맞춤 브랜드 및 그래픽
    description: 풀 컬러 디지털 인쇄, 스크린 인쇄, 엠보싱, 라벨 옵션 제공. 브랜드 전용 데크 그래픽, 튜브 브랜딩, 소매용 포장을 개발합니다.
  - title: 소재 및 사양 맞춤화
    description: PVC (표준, 친환경, 난연), Hypalon/CSM, drop-stitch, 하이브리드 구조 중 선택 가능합니다. 맞춤 튜브 색상, 원단 두께, 보강 옵션 제공.
  - title: 포장 및 물류
    description: 맞춤형 소매 포장, 프라이빗 라벨 박스, 진공 포장, 팔레타이징, 컨테이너 적재. FOB 칭다오, CIF, 또는 DDP 배송 조건 가능.
moq_table:
  - product: 인플레이션 SUP 보드
    standard_moq: 5–10개 단위
    custom_moq: 200+개 단위
    lead_time: 30–45일
  - product: RIB 보트
    standard_moq: 2–5개 단위
    custom_moq: 50+개 단위
    lead_time: 45–60일
  - product: 풍선 카약
    standard_moq: 10–20개 단위
    custom_moq: 200+개 단위
    lead_time: 30–45일
  - product: 소형 보트 및 텐더
    standard_moq: 10–20개 단위
    custom_moq: 200+개 단위
    lead_time: 30–45일
  - product: 구명조끼 및 안전
    standard_moq: 100–500개
    custom_moq: 1,000+개
    lead_time: 20–30일
why_us:
  - title: 수직 통합
    description: 우리는 자체 공장, 금형 및 공급망을 보유하고 있으며 중개인이나 하청업체가 없습니다. 이를 통해 품질, 비용 및 납기 관리를 할 수 있습니다.
  - title: 이중 인증
    description: ISO 9001 품질 경영 및 BSCI 사회적 준수 인증. 공장 감사 보고서는 요청 시 제공 가능합니다.
  - title: CE 준수
    description: 모든 표준 모델은 CE 2013/53/EU 인증을 보유하고 있습니다. 맞춤형 모델은 기존 절차를 통해 CE 인증될 수 있습니다.
  - title: 낮은 MOQ
    description: 표준 모델은 최소 5개 단위부터 시작 가능합니다. 우리는 신생 브랜드가 너무 많은 재고 부담 없이 출시할 수 있도록 도와줍니다.
