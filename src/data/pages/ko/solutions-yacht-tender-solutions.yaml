content_challenge:
  tagline: 도전 과제
  title: 요트 텐더가 요구하는 사항<br />성능 및 외관
  subtitle: 요트 텐더는 단순한 소형 보트가 아니라 모선의 연장선이자 품질의 표식입니다.
  paragraphs:
    - 요트 소유자와 선장은 성능이 뛰어나고, 컴팩트하게 보관되며, 아름답게 보이는 텐더가 필요합니다. 텐더는 요트의 미학을 보완하면서 손님과 승무원을 위한 신뢰할 수 있는 운송 수단을 제공해야 합니다.
    - '**보관이 중요합니다** — 텐더는 갑판, 차고 또는 데빗에 맞아야 합니다. 출시 및 회수 시스템에는 무게가 중요합니다. Paddle Board Overstock RIBs은 컴팩트한 보관 프로파일에서 뛰어난 출력 대비 무게 비율을 제공합니다.'
    - '**성능 기대치가 높습니다** — 손님들은 육지로 이동할 때 부드럽고 건조한 승차감을 기대합니다. 엔진 옵션은 속도, 항속 거리 및 소음 수준의 균형을 맞춰 프리미엄한 경험을 제공합니다. 차터 운영에서는 텐더가 매일 운행되며, 빈번한 사용을 견뎌야 합니다.'
    - '**외관이 중요합니다** — 맞지 않거나 낡은 텐더는 전체 요트의 외관을 손상시킵니다. 맞춤 튜브 색상, 장식, 브랜딩을 통해 텐더가 요트에 어울리도록 보장합니다.'
content_solution:
  tagline: 우리의 해결책
  title: 텐더 구성<br />모든 요트 활용에 적합
  subtitle: Paddle Board Overstock RIB 텐더는 슈퍼요트 제작사 사양부터 차터 함대 프로그램에 이르기까지 사용자의 선박, 운영 유형 및 보관 요구 사항에 맞게 맞춤화할 수 있습니다.
  list:
    - 모선과 일치하거나 보완되는 맞춤 튜브 색상 — Hypalon 또는 PVC 튜브에 적용 가능한 모든 RAL 색상
    - 맞춤 장식 및 스티치 — 색상 일치와 로고 자수가 포함된 고급 해양용 비닐
    - 콘솔 또는 틸러 조종 — 사용 패턴과 운영자 선호에 따라 선택
    - 다양한 해상 조건에서 부드럽고 건조한 승차감을 제공하는 유리섬유 딥-V 선체
    - 컴팩트 수납 — 데크 차고, 사물함, 또는 데이빗 보관용 디폴트 또는 네스트
    - Hypalon UV 저항과 장기적인 외관 보존을 위한 튜브
    - 모든 모델에 기본 장착된 리프팅 포인트와 견인 링
    - 선택 가능한 활 커버, 풀 커버, 그리고 보호용 마모 가드
    - '엔진 범위: 15 HP 에서 60 HP — 외부 또는 틸러 구성'
    - OEM/요트 제작자 및 해양 딜러를 위한 개인 라벨링 제공
content_segments:
  tagline: 고객 프로필
  title: 요트 탠더 솔루션<br />고객 유형별
  subtitle: 요트 산업 부문마다 고유한 요구사항이 있습니다.Paddle Board Overstock 각 신청에 맞는 입찰을 구성합니다.
  items:
    - title: 슈퍼요트 빌더스
      subtitle: OEM 입찰 통합 — 맞춤 치수, 색상, 재료
      description: '요트 제작자들은 반복되는 도전에 직면해 있습니다: 모든 신형 선박은 고유한 치수 제약, 무게 제한, 미적 요구를 가지고 있습니다. 텐더는 모선 데이빗 시스템과 완벽하게 통합되어야 하며, 정확한 차고 치수에 맞아야 하며, 수백만 유로 규모의 요트의 설계 언어와 일치해야 합니다. 잘못된 튜브 색상, 잘못된 리프팅 포인트 위치, 맞지 않는 무게 등 불일치는 납품을 지연시키고 제작자에게 불리한 이미지를 줍니다. 건조 조Paddle Board Overstock달 및 설계팀과 직접 협력하여 맞춤형 RAL 튜브 색상, 매칭 실내 장식, 브랜드 콘솔 패널, 완전한 문서 패키지를 갖춘 텐더를 납품합니다 OEM .'
      features:
        - 차고와 데이빗 제약 조건에 맞는 맞춤 치수 사양
        - RAL 튜브 색상과 매칭 시트 — 설계 승인 샘플 제공
        - OEM 콘솔, 튜브, 좌석 등받이에 브랜드
        - 각 모델에 대한 리프팅 포인트 및 데이빗 적합 검증
        - 지정된 발사 및 회수 시스템에 최적화된 선체 중량
        - 대량 배송 일정이 생산 일정에 맞춰 조정됩니다
    - title: 요트 관리 회사
      subtitle: 함대 표준화된 텐더 — 전 세계 지원, 최소한의 가동 중단
      description: 관리 회사들은 지중해, 카리브해, 남태평양 및 그 너머에서 운항하는 여러 요트를 감독합니다. 그들의 핵심 요구는 신뢰성입니다 — 외딴 항구에서 고장 난 텐더는 승무원 초과 근무, 고객 불만, 그리고 고가의 막판 교체를 의미합니다. 표준화된 함대 사양은 선박 전반에 걸쳐 승무원 교육 시간을 단축하고 예비 부품 관리를 단순화합니다.Paddle Board Overstock 다선박 함대 가격 책정, 주문 간 일관된 사양, 그리고 여러 지역에 선박을 보유한 관리 회사를 위한 글로벌 부품 지원을 제공합니다.
      features:
        - 전체 관리 차량에 걸친 표준화된 사양
        - 모든 선대 텐더에서 교체 가능한 예비 부품
        - 다중 유닛 주문에 대한 차량 가격 및 대량 할인
        - 전 세계 예비 부품 공급 — 어느 항구로든 빠른 배송
        - 승무원을 위한 일관된 서비스 및 정비 문서
        - 여러 선박 위치로의 다중 유닛 배송 조정
    - title: 요트 전세 운영자
      subtitle: 고빈도 일상 작업 — 외관을 해치지 않으면서 내구성
      description: '전세 보트 보조정은 요트 산업에서 가장 힘든 운영 일정을 수행합니다: 매일 손님 이송, 육상 여행, 수상 스포츠 지원 및 항구 보조정 운항 — 전세 시즌마다 종종 200회 이상의 작업이 이루어집니다. 보조정은 매번 손님에게 인도될 때 완벽하게 보여야 하며, 지속적인 탑승, 염수 노출 및 엔진 사용 시간을 견뎌야 합니다. 외관 손상은 직접적인 사업 문제로 이어집니다 — 낡은 보조정은 손님 후기에 영향을 미치고 전세 요금에도 영향을 줍니다. Paddle Board Overstock은 장기적인 내구성을 유지하며 외관 품질을 유지하기 위해 업그레이드된 장식, 내구성이 강한 Hypalon 튜브, 강화된 취급 구역으로 전세 보트 보조정을 구성합니다.'
      features:
        - 중장비 Hypalon 튜브 — 일일 전세 서비스에서 5-8년 수명
        - 자주 사용하는 것을 위해 강화된 탑승 계단과 조작용 손잡이 줄
        - 프리미엄 방오 비닐 시트 — 요트 대여 사이 간편한 청소
        - 청소가 쉬운 미끄럼 방지 갑판 표면
        - 빠른 처리 시간을 위한 쉬운 서비스 접근이 가능한 신뢰할 수 있는 외부 엔진 패키지
        - 모든 시기 동안 외관을 유지하는 화장품 등급의 재료
    - title: 요트 딜러 및 중개인
      subtitle: 선박 완성 및 재판매 가치를 위한 신뢰할 수 있는 조달 공급
      description: 딜러와 중개인은 판매하는 선박을 보완할 수 있는 안정적인 품질의 텐더 공급이 필요합니다 — 브랜드 포지셔닝에 맞추고 구매자 경험을 향상시키기 위해서입니다. 텐더의 불규칙한 품질이나 공급 지연은 요트 인도 일정을 늦추거나 목록 프레젠테이션을 약화시킬 수 있습니다. 딜러는 마진을 유지하기 위해 배치 간 일관된 품질, 신뢰할 수 있는 납기, 경쟁력 있는 가격이 필요합니다. Paddle Board Overstock는 계절별 배송 일정, 쇼룸 전시용 공동 브랜드 옵션, 성수기 우선 배정을 포함한 딜러 재고 프로그램을 제공합니다.
      features:
        - 주문형 모델을 갖춘 재고 적재 프로그램
        - 인도 일정과 연계된 계절별 배송 일정
        - 쇼룸 전시용 콘솔 및 튜브에서 딜러 공동 브랜드
        - 모든 배치 주문에서 일관된 품질과 사양
        - 볼륨 기반 등급에 따른 경쟁력 있는 딜러 가격
content_benefits:
  tagline: 주요 혜택
  title: 왜 Paddle Board Overstock처럼<br />당신의 요트 텐더
  subtitle: 전 세계 슈퍼요트 소유주, 제작자, 차터 운영자 및 딜러가 선택한 프리미엄 요트 텐더.
  list:
    - 공기 뺀 상태에서는 가볍고 컴팩트하여 차고, 사물함, 데크 크래들에 보관하기 쉽습니다
    - Hypalon 구조 — 열대 태양 아래 마리나 보관용으로 뛰어난 UV 내구성
    - 다양한 해상 조건에서 손님 이동을 위한 안정적이고 편안한 승차감
    - 맞춤형 실내 장식, 튜브 색상, 요트에 완벽하게 맞는 브랜딩
    - '외부 범위: 보조정 및 딩기 적용을 위해 15 HP에서 60 HP까지'
    - '빠른 처리 시간: 표준 입찰 구성의 경우 주문에서 배송까지 25-45일'
    - 다중 유닛 요트 제조 및 관리 회사 프로그램을 위한 선박 가격 제공
cta:
  title: 귀하의 입찰을 명시하십시오
  subtitle: 귀하의 선박, 저장 장치 및 손님 이동 요구 사항에 대해 알려주십시오 — 우리는 귀하의 운영에 가장 적합한 텐더 구성을 추천해 드릴 것입니다.
  actions:
    - variant: primary
      text: 입찰을 구성하세요
      href: /contact
