hero:
  tagline: 우리 팀
  title: Aquafarer 뒤의 사람들<br />— 물 위에서의 자유를 설계하다
  subtitle: 2012년 중국 칭다오에서 설립된 Aquafarer는 전문 등급의 팽창식 수상 스포츠 기구를 전 세계적으로 접근 가능하게 만드는 것을 믿는 해양 엔지니어, 재료 과학자 및 수상 스포츠 애호가들에 의해 만들어졌습니다.
  image:
    src: /images/team-all.webp
    alt: Aquafarer 전체 팀 사진 — 엔지니어링, 제작, 그리고 리더십
founding:
  tagline: 우리의 창립
  title: 해안 작업장에서<br />12,000 m² 시설로
  subtitle: Aquafarer는 수십 년의 합산 경험을 가진 해양 엔지니어 팀에 의해 설립되었으며, 고무보트 설계, PVC/Hypalon 제작, 전 세계 해양 장비 제조 분야에서 전문성을 보유하고 있습니다.
  items:
    - title: '설립: 2012'
      description: 중국 청도에 설립됨 — 조선업 전통이 깊은 주요 해양 허브.
      icon: tabler:calendar
    - title: 200-300명 직원
      description: 50명의 연구개발(R&D) 엔지니어, 품질 관리 전문가, 생산 기술자를 포함합니다.
      icon: tabler:users
    - title: 12,000 m² 시설
      description: RIBs, 고무보트, 그리고 SUP 보드를 위한 6개의 생산 라인을 갖춘 전용 제조 공장.
      icon: tabler:building-factory
    - title: 50개국에 서비스 제공
      description: 유럽, 아메리카, 중동, 아시아-태평양, 아프리카로 수출 중입니다.
      icon: tabler:globe
leadership:
  tagline: 리더십
  title: 경영 및 엔지니어링 리더십
  subtitle: 우리 경영진 팀은 해양 공학, 국제 무역 및 품질 관리에 대한 깊은 전문 지식을 결합합니다.
  columns: 3
  items:
    - title: 창립자 겸 최고경영자
      name: 토비 리우
      description: 해양 제조업에서 15년 경력을 보유. 이전에는 중국의 주요 보트 제조사에서 연구개발(R&D)을 이끌었음. 고무보트 설계 분야에서 여러 특허 보유.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: 수석 엔지니어
      name: 장웨이
      description: PVC/Hypalon 제작과 딥-V 선체 설계 분야에서 20+년 경력. 유럽 해양 공학 회사의 전 기술 이사.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 연구개발 책임자
      name: 첸밍
      description: 재료과학 박사. drop-stitch 기술과 고주파 용접 공정을 전문으로 합니다. 섬유 복합재 분야에서 10+년 경력.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 제작 이사
      name: 류치앙
      description: 린 제조 및 생산 라인 최적화 분야에서 18년 경력. 식스시그마 블랙벨트. ISO 9001 품질 시스템 ISO을 구현함.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 품질 관리자
      name: 왕팡
      description: 해양 품질 관리 분야에서 12+년 경력. 인증된 CE 및 ISO 감사자. 모든 생산 배치에 대한 테스트를 감독합니다.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: 영업 및 운영 이사
      name: 헬렌 리
      description: 국제 B2B 무역에서 15+년 경력. 30+개국에서 OEM/ODM 파트너십 관리. 4개 국어에 능통.
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: 디자인 철학
  title: 엔지니어링 중심 디자인<br />— 모든 디테일이 중요합니다
  subtitle: 우리의 엔지니어링 철학은 우리가 만드는 모든 제품을 안내하는 세 가지 원칙에 중심을 둡니다.
  list:
    - '신뢰성 우선: 모든 Aquafarer 제품은 실제 환경 조건에서도 견딜 수 있도록 테스트합니다 — 냉수 구조 작업부터 열대 리조트 렌탈까지. 중요한 부분에서는 과도하게 설계합니다.'
    - '제조 정밀도: 우리의 시설은 CNC 절단, 고주파 용접, 자동 압력 테스트를 사용합니다. 모든 솔기, 모든 밸브, 모든 부속품이 문서화된 사양을 충족합니다.'
    - '지속적인 혁신: 우리의 연구개발 팀은 새로운 소재, 생산 방법, 디자인 개선을 지속적으로 평가합니다. 우리는 문제를 기다리지 않고 미리 대응합니다.'
cta:
  title: 우리 팀과 프로젝트를 논의하고 싶으신가요?
  subtitle: 우리 엔지니어들은 제품 선택, 맞춤화 및 OEM/ODM 파트너십에 대해 조언할 준비가 되어 있습니다.
  actions:
    - variant: primary
      text: 우리 팀에 연락하기
      href: /contact
    - text: 우리 제품 보기
      href: /products
