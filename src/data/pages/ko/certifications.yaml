hero:
  tagline: 인증 및 표준
  title: 품질 인증<br />및 준수 표준
  subtitle: Aquafarer 제품은 국제 해양 안전 기준, 품질 관리 시스템 및 환경 규정을 준수하여 제조됩니다.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarer 품질 인증 및 준수 문서
content_certifications:
  tagline: 우리의 인증
  title: 인증된 품질,<br />전 세계적으로 인정받음
  subtitle: 64개의 CE 인증 모델과 전 공장 인증은 품질, 안전 및 환경 책임에 대한 우리의 약속을 보여줍니다.
  items:
    - title: CE 인증됨
      description: 64개의 CE 인증 모델은 유럽 CE 표시 요구 사항을 준수하여 레저 수상 기구의 안전, 건강 및 환경 보호 기준이 충족됨을 보장합니다.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: 우리의 품질 관리 시스템은 디자인, 제조 및 인플레이블 수상 기구와 해양 장비의 유통을 포함하여 ISO 9001:2015 인증을 받았습니다.
      icon: tabler:clipboard-check
    - title: UKCA 표시됨
      description: 영국 시장에서 판매되는 제품은 UKCA 표시를 가지고 있어 해양 장비 및 개인 수상기구에 대한 영국 규정을 준수함을 확인할 수 있습니다.
      icon: tabler:shield
    - title: BSCI 준수
      description: Aquafarer는 BSCI (Business Social Compliance Initiative) 감사를 거쳐 윤리적 제조 관행, 공정한 노동 조건 및 공급망 책임을 입증합니다.
      icon: tabler:heart-handshake
    - title: REACH 준수
      description: Aquafarer 제품에 사용된 모든 재료는 EU REACH 화학 안전 규정을 준수하며, PVC, Hypalon 또는 구성 요소에 제한 물질이 없음을 보장합니다.
      icon: tabler:flask
    - title: 재료 테스트
      description: 직물은 인장 강도, 내찢김성, UV 열화 및 저온 균열 성능을 시험합니다. 모든 생산 배치는 샘플링되어 검증됩니다.
      icon: tabler:test-pipe
content_factory:
  tagline: 공장 표준
  title: 제조 우수성<br />— 사양에 맞게 제작
  subtitle: 우리의 12,000 m² 시설은 생산의 모든 단계에서 엄격한 품질 관리 프로토콜 하에 운영됩니다.
  list:
    - '입고 재료 검사: 모든 원자재 — PVC 직물, Hypalon, 알루미늄, 합판, 접착제 — 은 생산에 들어가기 전에 사양에 따라 테스트됩니다.'
    - '공정 중 품질 관리: 모든 생산 단계에는 문서화된 QC 체크포인트가 있습니다. 용접 강도, 이음 정렬, 밸브 설치 및 체결 토크를 라인 상에서 확인합니다.'
    - '압력 테스트: 모든 인플레이션 챔버는 정격 압력의 1.25배로 24~48시간 동안 압력 테스트가 진행됩니다. 누출률은 ISO 6185 기준 내에서 허용 가능해야 합니다.'
    - '최종 검사: 완제품은 치수 정확성, 외관 마감, 부속품 완전성 및 포장 무결성을 출하 전에 검사합니다.'
    - '배치 추적성: 모든 제품에는 생산 배치 기록과 연결된 일련 번호가 있어 원자재부터 완제품까지 전체 추적이 가능합니다.'
content_safety:
  tagline: 해양 안전 기준
  title: 안전 우선<br />— 신뢰할 수 있는 운용을 위해 설계됨
  subtitle: Aquafarer 제품은 상업용 및 레크리에이션 용도로 국제 해양 안전 기준을 충족하도록 설계 및 테스트되었습니다.
  items:
    - title: ISO 6185
      description: 고무 보트는 구조, 안정성, 부력 및 적재 용량에 대한 ISO 6185 기준을 준수합니다.
      icon: tabler:sailboat
    - title: ABYC 기준
      description: 전기 시스템 및 연료 시스템은 안전한 설치 및 운용을 위해 ABYC(미국 보트 및 요트 협회) 기준을 따릅니다.
      icon: tabler:bolt
    - title: SOLAS 준수
      description: 안전 장비 및 구명 장치는 해당되는 경우 SOLAS (해상 인명 안전) 요건을 충족합니다.
      icon: tabler:lifebuoy
cta:
