  subtitle: 인증 요구사항, 문서 및 시장별 준수 사항을 논의하려면 저희 팀에 연락하세요.
  actions:
    - variant: primary
      text: 인증 문서 요청
      href: /contact
    - text: 품질 페이지 보기
      href: /quality
