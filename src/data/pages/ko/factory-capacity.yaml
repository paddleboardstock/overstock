hero:
  tagline: 생산 능력
  title: 제조 능력 및 연간 생산량
  subtitle: 12,000 m² 규모의 시설로 연간 15,000척의 보트를 생산하며 확장 공간도 갖추고 있습니다
intro: Paddle Board Overstock 중국 칭다오에서 가장 큰 전용 고무보트 제조 시설 중 하나를 운영하고 있습니다. 12,000 m² 규모의 공장은 6개의 전문 작업장으로 구성되어 병행하여 연간 15,000척의 보트SUP, 카약, 딩기, RIB안전 장비 생산 능력을 갖추고 있습니다.
highlights:
  - value: 12,000 m²
    label: 총 제조 현장
    detail: 6개의 전문 워크숍을 통해
  - value: 15,000
    label: 매년 생산되는 보트
    detail: SUPs카약, RIBs보트, 안전 장비
  - value: 200-300
    label: 숙련된 인력
    detail: 엔지니어 25명+, 하루 2교대 근무
  - value: 50+
    label: 수출 국가
    detail: EU, 미국, AU, 중동, 아시아
  - value: 30–45
    label: 표준 리드 타임(일수)
    detail: PO 확인FOB에서
  - value: 10+
    label: 수출 경력
    detail: 2012년부터
workshops:
  - title: SUP 보드 제작
    description: '팽창식 보드용 4개의 병렬 조립 라인 SUP . 각 라인은 교대당 50–80개의 보드를 생산할 수 있습니다. 디지털 인쇄와 실크스크린 인쇄 스테이션이 동시에 운영됩니다. 연간 SUP 생산 능력: 8,000개의+ 보드.'
    output: 연간 8,000+ SUPs
  - title: RIB 보트 생산
    description: '최대 7.6m 선체용 6개의 몰드 스테이션을 갖춘 전용 유리섬유 선체 작업장 RIB 이 있습니다. 튜브 용접 및 조립 구역에서는 3척에서 5척을 RIBs 동시에 처리할 수 있습니다. 연간 RIB 생산 능력: 2,000척+.'
    output: 연간 2,000+ RIBs
  - title: 팽창식 보트 및 딩기
    description: '고무선, 카약, 딩기의 다목적 생산 라인. 열공기 용접 스테이션, RF 유전체 프레스, 조립 작업대가 주문 구성에 따라 재구성됩니다. 연간 생산 능력: 5,000+대.'
    output: 연간 5,000+대
  - title: 안전장비
    description: '구명조끼 및 안전 장비를 위한 별도의 클린룸 생산 구역. 전용 재봉, 폼 삽입, 테스트 스테이션. 연간 구명조끼 생산 능력: 50,000+개.'
    output: 연간 50,000개의+ 구명조끼
oem_capacity:
  moq: 'SUP: 5–10 단위 | RIB: 2–5 단위 | 카약/딩기: 10–20단위 | 맞춤 금형: 200+ 단위'
  lead_time: 표준 30–45일. 샘플 15–20일. 급히 신청 가능.
  payment: T/T 30% 보증금 + 선적 전 70%. L/C, 웨스턴 유니언 가능.
