hero:
  tagline: Paddle Board Overstock 맞춤 실험실
  title: 자신만의<br />수상 스포츠 장비 디자인
  subtitle: OEM, ODM, 전 세계 기업을 위한 프라이빗 라벨 및 맞춤 브랜딩 서비스. 단일 프로토타입부터 대량 생산까지 가능.
  cta: 프로젝트 시작하기
  footer_link: /contact
steps_section:
  tagline: 작동 원리
  title: 아이디어에서 생산까지
  subtitle: 아이디어에서 완성된 바다 출항 가능 제품까지 네 단계.
  steps:
    - num: '01'
      title: 보드 선택
      desc: 주요 모델 중 선택 — SUP, 카약, 딩히, 또는 RIB. 크기, 소재, 색상 선택 가능.
    - num: '02'
      title: 디자인 업로드
      desc: 로고, 작품 또는 브랜드 가이드라인을 보내주세요. 디자인 팀이 디지털 시안을 준비합니다.
    - num: '03'
      title: AI 목업 리뷰
      desc: 생산 시작 전에 맞춤 보드의 사실적인 AI 생성 목업을 확인하세요.
    - num: '04'
      title: 생산 및 배송
      desc: 승인되면 주문이 ISO 인증 생산 라인에 들어갑니다. 제작 기간은 30일 이상.
services_section:
  tagline: 서비스
  title: 글로벌 브랜드를 위한 제조 서비스
  subtitle: 계약 제조부터 풀서비스 브랜드 구축까지 유연한 참여 모델.
  items:
    - title: OEM 제조
      desc: 당신의 설계대로 제작 — 귀하의 지식재산, 도면, 품질 기준에 따라 제작. 완전한 NDA 보호.
      icon: ⚙️
    - title: ODM 솔루션
      desc: 50+ 검증된 플랫폼 중 선택하고 크기, 색상, 그래픽, 패키지 맞춤 가능.
      icon: 🎨
    - title: 프라이빗 라벨
      desc: 우리 제품 위에 귀하의 브랜드 적용 — 로고, 포장, 행택, 매뉴얼. 박스에서 바로 소매 가능.
      icon: 🏷️
    - title: 맞춤 브랜딩
      desc: 덱 패드 인쇄, 선체 그래픽, 튜브 스티커, 맞춤 라벨 — 완전한 브랜드 통합.
      icon: ✨
capabilities_section:
  tagline: 역량
  title: 생산 및 맞춤화 역량
  subtitle: 주문 전에 알아야 할 모든 것.
  capabilities:
    - label: 주문 수량
      value: MOQ 5–10개 (SUP/카약), 2–5개 (RIB)
    - label: 리드 타임
      value: 표준 30–45일; 프로토타입 15–20일
    - label: 맞춤화
      value: 크기, 모양, 색상, 그래픽, 포장, 하드웨어
    - label: 재료
      value: PVC, Hypalon, drop-stitch, 유리섬유, 알루미늄
    - label: 인쇄
      value: 디지털(CMYK), 스크린 인쇄, 열전사, 승화
    - label: 인증
      value: CE, ISO 9001, BSCI, UKCA (글로벌 규정 준수 지원)
why_section:
  tagline: 왜 Paddle Board Overstock
  title: 하나의 공장. 하나의 기준. 타협 없는 품질.
  points:
    - text: 12,000㎡ 통합 제조 시설
      highlight: 12,000㎡
    - text: 200-300명의 숙련된 근로자 및 엔지니어
      highlight: 200-300
    - text: 연간 15,000척 생산
      highlight: 15,000
    - text: ISO 9001 인증 품질 관리
      highlight: ISO 9001
    - text: CE 유럽 시장 인증 제품
      highlight: CE
  cta: 공장 세부 정보 보기
  cta_link: /factory
  contact:
    title: 프로젝트 논의 준비가 되셨나요?
    desc: 저희 팀은 24시간 이내에 예비 견적과 함께 답변 드립니다.
