label: 보증
headline: Paddle Board Overstock 제조사 제한 보증
subtitle: Paddle Board Overstock 저희가 제조하는 모든 팽창식 해양 제품의 품질을 보장합니다. 이 제한 보증은 귀하의 제품에 대한 약관과 보장 범위를 명시합니다 Paddle Board Overstock .
seo:
  headline: Paddle Board Overstock 고무선상 보증 — 5년 제한 보증 | Paddle Board Overstock
  description: Paddle Board Overstock 주요 튜브 원단, 이음새, 유리섬유 선체 구조 완전성에 대해 5년 제한 보증을 제공합니다. 또한 공기 팽창 밸브와 공장 설치 액세서리도 포함됩니다. Paddle Board Overstock 팽창식 보트 보증에 대한 전체 약관 및 조건.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  이 제한 보증은 Paddle Board Overstock 공인 딜러 또는 소매업체로부터 직접 또는 구매한 신규 브랜드 인플레이터블 해양 제품에 적용됩니다 Paddle Board Overstock Paddle Board Overstock . 효력 발생일은 원래 소매 구매일의 검증 가능한 날짜입니다.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">보증 범위 및 기간</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5년</h3>
        <p class="text-sm text-gray-600 mt-1">1차 튜브 패브릭 무결성 (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5년</h3>
        <p class="text-sm text-gray-600 mt-1">유리섬유 선체 구조적 완전성</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5년</h3>
        <p class="text-sm text-gray-600 mt-1">팽창식 튜브 이음 공기 유지 능력</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5년</h3>
        <p class="text-sm text-gray-600 mt-1">인플레이션 밸브 기능</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1년</h3>
        <p class="text-sm text-gray-600 mt-1">공장 설치 액세서리 및 보조 부속품</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1년*</h3>
        <p class="text-sm text-gray-600 mt-1">상업용, 렌탈, 차량 사용 — 모든 구성 요소</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*상업용, 정부용, 전세, 렌탈 또는 교육용으로 사용되면 보증 기간이 1년으로 줄어듭니다. 경주용 또는 대회 용도는 보증이 완전히 무효가 됩니다.</p>
  </div>

  <h2>보장 내용</h2>
  <h3>기본 튜브 패브릭 (5년)</h3>
  <p>Paddle Board Overstock 제품 작동 팽창 유지에 상당한 저해를 초래하는 다공성 열화로부터 주관 섬유를 보증합니다. 이 규칙은 CSM (Hypalon) 코팅된 섬유 및 제조에 사용되는 모든 기타 튜브 섬유 재료에 적용됩니다.</p>

  <h3>유리섬유 선체 구조적 완전성 (5년)</h3>
  <p>유리섬유 강화 플라스틱() 선체를 가진 제품의 경우FRP, 기본 복합 구조는 재료 결함이나 시공 결함으로 인한 구조적 파손에 대해 보증됩니다.</p>

  <h3>팽창식 튜브 이음새 공기 유지 능력 (5년)</h3>
  <p>제조 과정에서 접합된 팽창식 튜브의 이음새는 이음새를 통해 상당한 공기 누출을 초래하는 제조 결함에 대해 보증됩니다. 적절한 팽창 압력의 정기적 점검과 유지보수가 보장 조건입니다.</p>

  <h3>인플레이션 밸브 기능 (5년)</h3>
  <p>원래 설치된 공기 팽창 밸브 Paddle Board Overstock 는 설계대로 공기를 유지하지 못하는 제조 결함이나 시공 결함에 대해 보증됩니다.</p>

  <h3>공장 설치 액세서리 (1년)</h3>
  <p>공장에서 제조하고 원래 설치된 부품과 부속품은 Paddle Board Overstock 재료 및 작업 결함에 대해 1년간 보증이 적용됩니다. 이는 제조사 보증만 적용되는 제3자 제품은 제외됩니다.</p>

  <h2>보장되지 않는 항목</h2>
  <ul>
    <li>변색, 착색, 색 바래기, 분필 모양 또는 외관의 변화 등 미용 결함</li>
    <li>펑크, 절단, 찢김, 찢어진 부분 또는 기타 물리적 손상</li>
    <li>균열, 금, 마모, 긁힘 또는 마찰이나 접촉으로 인한 손상</li>
    <li>UV 빛 노출, 풍화 또는 대기 조건으로 인한 열화</li>
    <li>연료, 용제, 산, 알칼리 또는 화학물질과 접촉으로 인한 손상</li>
    <li>부주의, 잘못된 사용, 남용, 사고 또는 정상적인 마모로 인한 손상</li>
    <li>젤코트 또는 페인트 표면 문제(물집, 균열, 변색, 퇴색)</li>
    <li>충격, 스트레스, 부적절한 지지 또는 트레일러링으로 인한 손상</li>
    <li>부적절한 공기 주입/배출 또는 승인되지 않은 공기 주입 장치 사용으로 인한 손상</li>
    <li>타사 장비, 부품 또는 시스템(각 제조업체에서 제공한 보증 범위)</li>
  </ul>

  <h2>제조업체의 의무 및 해결책</h2>
  <p>Paddle Board Overstock의 단독 및 배타적인 의무는 재료 또는 제작상의 결함이 있는 것으로 판정된 구성 요소를 Paddle Board Overstock의 선택에 따라 수리 또는 교체하는 것뿐이며, 본 보증에 따라 보장됩니다. 수리 또는 교체는 Paddle Board Overstock 또는 지정된 공인 서비스 시설에서 수행됩니다. 수리 또는 교체된 구성 요소는 원래 보증 기간의 남은 기간 동안만 보증됩니다.</p>

  <h2>보증 조건</h2>
  <ul>
    <li><strong>등록:</strong>제품은 보증 조건에 따라 적절하게 등록되어야 합니다.</li>
    <li><strong>유지관리:</strong>제품은 Paddle Board Overstock에서 발행한 안내에 따라 유지관리되어야 하며, 적절한 공기압 점검 및 주기적인 유지관리를 포함합니다.</li>
    <li><strong>협력:</strong>구매자는 보증 청구와 관련된 모든 사항에서 Paddle Board Overstock와 완전하고 신속하게 협력해야 합니다.</li>
    <li><strong>원래 구매자:</strong>이 보증은 원래 최종 사용자 구매자에게만 적용되며 양도할 수 없습니다.</li>
  </ul>

  <h2>상업적 사용</h2>
  <p>제품이 상업적, 정부, 비영리, 전세, 렌탈, 교육 또는 개인 오락용 외의 용도로 사용되는 경우, 모든 구성요소의 보증 기간은 소매 구매 원래 날짜부터 1년으로 단축됩니다. 레이싱, 속도 또는 지구력 경쟁에 사용될 경우 보증은 즉시 그리고 무효화됩니다.</p>

  <h2>보증 청구 방법</h2>
  <p>구매 영수증과 문제에 대한 상세한 설명을 가지고 Paddle Board Overstock 또는 공인 대리점에 연락하십시오. Paddle Board Overstock은 청구를 검토하고 검사 및 서비스 지침을 제공합니다.</p>
  <p>보증 서비스 문의는 주문 번호와 제품 세부 정보를 포함하여<a href="/contact" class="text-sky-600 underline">문의 페이지</a>를 통해 연락해 주십시오.</p>

  <h2>타사 품목</h2>
  <p>타사에서 제조한 장비, 부품 또는 시스템(설치 여부와 상관없이 Paddle Board Overstock): 각 제조업체에서 제공한 보증 범위에 따라 보장이 제공됩니다. Paddle Board Overstock는 이러한 타사 품목에 대해 어떠한 보증 책임도 명시적으로 부인합니다.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  이 보증 설명서는 Paddle Board Overstock 제조업체 제한 보증의 요약입니다. 모든 보증 조건은 전체 법적 보증 문서가 적용됩니다. 사양은 사전 통지 없이 변경될 수 있습니다. Paddle Board Overstock는 Paddle Board Overstock 칭다오 제조 허브의 공장 브랜드입니다.
  </p>
