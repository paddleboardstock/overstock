hero:
  tagline: 지식 그래프
  title: 수자원 탐사 지식
  subtitle: |
    팽창식 SUP 기술을 다루는 구조화된 지식 베이스,<br />
    수상 안전, 보트 공학, 모험 계획.
  taglineSection: 탐험하세요. 배우세요. 자신 있게 나아가세요.
clusters:
  tagline: 지식 클러스터
  title: 주제별로 탐색
  subtitle: 모든 Aquafarer 제품의 기술, 안전 및 기술에 대한 심층 분석.
  items:
    - title: SUP 지식
      description: 처음 보드를 선택하는 것부터 고급 투어 기술까지 — 스탠드업 패들보딩에 관한 모든 것.
      icon: tabler:lifebuoy
      topics:
        - 처음으로 SUP를 선택하는 방법
        - 초보자를 위한 최고의 SUP 크기
        - 패들 보딩은 얼마나 어려운가요?
        - 인플레이션 보드 vs 하드 보드 비교
        - SUP 안전 점검표
    - title: 보트 지식
      description: 고무보트, RIBs, 소형 보트, 카약에 대한 기술 안내서 — 공학, 재료, 운용.
      icon: tabler:sailboat
      topics:
        - 팽창식 보트 종류 설명
        - PVC 대 Hypalon 비교
        - RIB 대 Dinghy 비교
        - Drop-stitch 기술 심층 분석
        - 해양 재료 과학 안내서
    - title: 안전 지식
      description: 모든 패들러를 위한 필수 안전 지식 — PFD 선택부터 날씨 판독, 자기 구조 기술까지.
      icon: tabler:shield
      topics:
        - SUP 안전 점검표
        - 구명조끼가 필요하신가요?
        - 바다 패들링 안전 가이드
        - 고무 카약을 위한 강 안전
        - 날씨 및 수질 상태 인식
    - title: 기술
      description: Aquafarer 제품의 엔지니어링 — 재료, 제작 방법 및 품질 테스트.
      icon: tabler:microscope
      topics:
        - 해양용 PVC 기술
        - Drop-stitch 코어 설명
        - PSI 왜 인플레이터블SUPs이 중요한가
        - RF 용접과 접착 접착
        - 품질 시험 및 인증
    - title: 비즈니스 지식
      description: 임대 운영부터 프라이빗 브랜드 구축까지 수상 스포츠 사업을 구축하고 확장하는 상업 가이드.
      icon: tabler:briefcase
      topics:
        - 임대 사업을 시작하는 방법 SUP
        - 리조트 수상 스포츠 센터 건립
        - 클럽용 패들보드 플릿 사이즈
        - 상업용 인플레이터블 vs 하드 SUP
        - 렌탈 함대에 적합한 최고의 카약 재료
        - 프라이빗 라벨 워터 브랜드 시작
        - 리조트 수상 스포츠 수익 전략
        - 상업용 장비 유지보수 가이드
