testimonial:
  content: 우리는 포르투갈에 있는 서핑 학교를 위해 클럽 스타터 패키지로 시작했습니다. 보드 20개, 패들, 조끼 — 모든 것이 3주 이내에 도착했습니다. 두 시즌 후, 우리는 프로 패키지로 업그레이드했습니다. 우리 로고로 맞춤 브랜딩을 한 것이 우리의 전문 이미지를 크게 바꾸어 놓았습니다.
  name: 리카르도 산토스
  title: 소유자, 알가르브 서프 아카데미 — 라고스, 포르투갈
content_segments:
  tagline: 동호회 프로필
  title: 수상 스포츠 클럽 솔루션<br />클럽 유형별
  subtitle: 대학 패들 클럽에서부터 독점적인 개인 요트 클럽에 이르기까지 — 각 클럽 유형은 독특한 장비 요구, 사용 패턴, 예산 구조를 가지고 있습니다. 우리는 클럽 모델에 맞춰 모든 패키지를 맞춤 제공합니다.
  items:
    - title: 대학교 및 단과대학 패들 클럽
      subtitle: 고사용 학생 차량
      description: 대학 레크리에이션 부서를 위해 SUP 및 카약 프로그램을 운영하는 학생 주도 또는 기관 지원 패들 클럽. 장비는 매 학기 여러 수준의 기술을 가진 사용자들이 고빈도, 높은 교체율로 사용합니다. 내구성과 쉬운 수리가 중요하며, 학생 단체를 위한 예산 친화적인 가격도 중요합니다.
      features:
        - 학생 사용 주기에 적합하게 등급이 매겨진 초내구성 PVC 구조
        - 쉽게 함대를 관리할 수 있도록 기술 수준별 색상 코드가 있는 보드 범위
        - 수리 키트 + 모든 주문에 현장 영상 지원 포함
        - 학생 단체 할인 가격 및 학기별 결제 조건
    - title: 커뮤니티 패들 & 소셜 클럽
      subtitle: 회원 중심 레크리에이션 클럽
      description: 커뮤니티 기반 클럽으로 회원들에게 SUP, 카약 및 소셜 패들 경험을 제공합니다. 장비는 다양한 연령대를 고려하여 성능과 편안함을 균형 있게 갖추어야 하며, 클럽 정체성과 회원 자부심을 높이는 브랜딩이 필요합니다. 수변 접근이 제한된 클럽의 경우 보관 효율성이 중요합니다.
      features:
        - '혼합 함선: 다용도 SUPs, 투어링 보드, 레크리에이션 카약'
        - '완전한 클럽 브랜딩: 맞춤 색상, 로고 인쇄, 브랜딩된 구명조끼'
        - 인플레이션 장비를 위한 컴팩트한 보관 솔루션
        - '회원 성장 스타터 키트: 추천 카드, 브랜딩된 사진'
    - title: 서핑 스쿨 & 서프 카약 아카데미
      subtitle: 해안 성능 및 코칭
      description: 서프 중심 스쿨에서 SUP 서핑, 서프 카약, 파도 타기 기술을 가르칩니다. 장비는 서핑 환경에서 성능을 발휘해야 하며, 반복적인 전복, 모래 마모, 염수 노출에도 빠르게 손상되지 않도록 조작성이 좋고 반응성이 뛰어나며 내구성이 있어야 합니다.
      features:
        - 서핑 조작성에 최적화된 짧고 넓은 SUP 형태
        - 파도 충격에 강한 강화 레일 구조
        - '서프 전용 안전 장비: 코일 리쉬, 소프트 핀 옵션'
        - 시즌별 트레이드인 할인과 함선 교체 프로그램
    - title: 기업 & 프라이빗 요트 클럽
      subtitle: 프리미엄 회원 경험
      description: 회원에게 프리미엄 편의 시설로 수상 스포츠를 제공하는 독점 프라이빗 클럽. 장비 표준은 높으며, 성능만큼 미적 요소, 브랜드 정렬, 고객용 프레젠테이션도 중요합니다. 서비스 기대에는 화이트글러브 배송, 맞춤형 보관 솔루션, 컨시어지 수준 지원이 포함됩니다.
      features:
        - 목재 결 EVA 및 메탈릭 악센트가 있는 프리미엄 마감 보드
        - 클럽 브랜드 가이드라인에 맞춘 맞춤 색상
        - '컨시어지 배송: 각 시즌별로 사전 인플레이션, 배치, 라벨링'
        - 우선 응답 SLA를 갖춘 전담 계정 관리
