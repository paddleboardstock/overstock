        description: 10–30개의 SUP 보드 또는 카약과 일치하는 패들, 펌프, 수리 키트
      - title: 안전 장비
        description: 구명조끼, 호루라기, 클럽 색상의 목줄 세트가 각 보드마다 제공됩니다
      - title: 강사 장비
        description: 미끄럼 방지 데크와 추가 안정성을 갖춘 코치 전용 보드
      - title: 브랜딩 패키지
        description: 보드, 패들, 포장에 맞춤 로고 인쇄
      - title: 교육 자료
        description: 초보자 수업 가이드, 안전 수칙, 유지보수 체크리스트
    cta_text: 내 클럽 패키지 구축
    cta_href: /contact
  - title: 클럽 프리미엄 패키지
    subtitle: 기존 클럽과 다장소 운영자를 위한
    badge: Professional
    features:
