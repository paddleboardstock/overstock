        description: 30대에서 100대의 혼합 카SUPs약 및 액세서리 함대
      - title: 첨단 안전 시스템
        description: RFID 장비 추적, 피해 보고 앱, 안전 표지판
      - title: 직원 교육
        description: 현장 강사 자격증 및 장비 유지보수 워크숍
      - title: 마케팅 지원
        description: 전문 사진, 브로셔, 소셜 미디어 템플릿
      - title: 대체 프로그램
        description: 트레이드인 옵션과 함께 할인된 가격으로 연간 장비 교체
    cta_text: 내 클럽 확장
    cta_href: /contact
