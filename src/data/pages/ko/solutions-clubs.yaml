tldr_points:
  - '클럽 스타터 패키지: 10–30 SUPs/카약, 패들, 펌프, 수리 키트, 안전 장비 포함'
  - '클럽 프리미엄 패키지: RFID 추적 기능, 직원 교육, 마케팅 지원이 포함된 30–100 혼합 함선'
  - '완전 맞춤 브랜딩: 보드 로고 인쇄, 브랜드 색상, 맞춤형 패키징'
  - '도매 가격: 공장 직송, 대량 할인 및 연간 리프레시 프로그램'
packages_section:
  title: 클럽 장비 패키지
  subtitle: 클럽 규모에 맞는 패키지를 선택하세요. 모든 패키지에는 공장 직송 가격, 맞춤 브랜딩 옵션, 전 세계 배송이 포함됩니다.
  featured_label: 가장 인기 있는
  packages:
    - name: 클럽 스타터
      description: 회원 10-30명의 성장 중인 클럽을 위한 패키지
      audience: 소규모 클럽 및 서핑 학교
      items:
        - 10-20 SUP 보드 또는 카약
        - 패들, 펌프 및 수리 키트
        - 구명조끼 및 안전 장비 (CE 인증)
        - 보드에 기본 로고 브랜딩
        - 1년 보증 및 기술 지원
      cta: 스타터 견적 받기
      ctaHref: /request-quotation
    - name: 클럽 프로
      description: 회원 30-100명의 기존 클럽을 위한 패키지
      audience: 중간 규모 클럽 및 트레이닝 센터
      featured: true
      items:
        - 30-60 혼합 플릿 (SUP + 카약)
        - 프리미엄 패들, 고출력 펌프
        - 보관 랙이 포함된 전체 안전 패키지
        - 전체 맞춤 브랜딩 (보드 + 포장)
        - RFID 대여 추적 시스템
        - 직원 교육 및 마케팅 자료
        - 2년 보증 및 우선 지원
        - 연간 플릿 갱신 프로그램
      cta: 프로 견적 받기
      ctaHref: /request-quotation
    - name: 클럽 엔터프라이즈
      description: 회원 100+ 이상의 대형 클럽을 위한 패키지
      audience: 대형 클럽 및 다지점 운영자
      items:
        - 60-100+ 혼합 플릿과 RIB 텐더
        - 상업용 등급 펌프, 도구 및 예비품
        - 구조 장비가 포함된 완전한 안전 시스템
        - 풀 OEM/ODM 맞춤 제조
        - RFID + POS 통합
        - 현장 교육 및 운영 매뉴얼
        - 3년 보증 및 전담 계정 관리자
        - 계절별 차량 교체 및 트레이드인 프로그램
      cta: 기업 견적 받기
      ctaHref: /request-quotation
