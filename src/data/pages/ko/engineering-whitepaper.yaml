hero:
  tagline: 엔지니어링 백서
  title: Drop-Stitch 기술 및 재료 과학:<br />현대 팽창식 수상기구를 위한 엔지니어링
  subtitle: drop-stitch 주요 구조, PVC 대 Hypalon 재료 비교, 고압 용기 강성 시험, 수상기구 제조 기준을 다루는 권위 있는 기술 참고서.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-design-discussion-lab.webp
    alt: Paddle Board Overstock 연구개발(R&D) 실험실 — 재료 시험 및 엔지니어링
direct_answer: Drop-stitch 기술은 팽창식 코어의 상단과 하단 섬유층을 연결하는 수천 개의 내부 폴리에스터 실을 사용합니다. 15–20 PSI로 팽창했을 때, 이 실들은 장력 부재(tension member)로 작용하여 부풀어 오르는 것을 방지하고 단단한 구조를 만듭니다. 고급 PVC 또는 Hypalon 섬유 코팅 및 RF 용접과 결합하면 전문, 상업용, 레크리에이션용으로 적합한 휴대용 고성능 팽창식 수상기구를 제작할 수 있습니다.
section_drop_stitch:
  title: Drop-Stitch 구조 공학
  subtitle: 수천 개의 실이 유연한 섬유를 어떻게 단단한 구조로 바꾸는가
  content: |
    Drop-stitch (다른 이름으로는 "drop-stitch 섬유" 또는 "drop-stitch 코어")는 팽창식 구조 공학의 혁신을 나타냅니다. 원리는 매우 간단합니다: 수천 개의 개별 폴리에스터 실이 동시에 두 개의 독립된 기본 섬유층에 직조되어 상단과 하단 패널을 90도 각도로 연결합니다.

    밀폐된 챔버가 압력을 받을 때, 내부 공기 압력은 모든 방향으로 동일한 힘을 가하여 상단과 하단 패널을 원통형으로 밀어내려고 합니다. 수천 개의 drop-stitch 실이 이러한 분리를 저항하며, 실 축을 따라 하중을 장력으로 전달합니다. 결과적으로 15–20 PSI의 내부 압력을 견딜 수 있는 평평하고 단단한 패널이 만들어집니다.

    20 PSI에서 1 m² drop-stitch 패널은 약 14,000 kg의 전체 내부 힘을 받지만, 실 매트릭스는 이를 완벽하게 평평하게 유지합니다. 이로 인해 drop-stitch 구조는 전통적인 단단한 재료에 필적하는 강도 대비 중량 비를 가집니다.
section_materials:
  title: PVC 대 Hypalon — 기술적 재료 비교
  subtitle: 팽창식 수상기구 제조에서 정보에 기반한 재료 선택을 위한 객관적 데이터
  table:
    columns:
      - header: 속성
      - header: PVC (폴리염화비닐)
      - header: Hypalon (CSM)
    rows:
      - property: UV 저항
        pvc: 좋음 (UV 안정제 사용 시)
        hypalon: 훌륭하다(내재적)
      - property: 마모 저항
        pvc: 좋은
        hypalon: 매우 좋음
      - property: 인장강도
        pvc: 3,000–5,000 N/5cm
        hypalon: 2,500–4,000 N/5cm
      - property: ㎡당 무게
        pvc: 850–1,200 g
        hypalon: 1,100–1,500 g
      - property: 냉간 유연성
        pvc: -30°C
        hypalon: -20°C
      - property: 접합 방식
        pvc: RF 용접 / 열풍 용접
        hypalon: 손 접착(접촉 접착제)
      - property: 수리 가능성
        pvc: 쉬움 (열 용접 또는 접착제)
        hypalon: CSM 접착제 필요
      - property: 재료 비용
        pvc: $8–15 / m²
        hypalon: $20–40 / m²
      - property: 수명 (열대 태양 아래)
        pvc: 5–8년
        hypalon: 10–15년
      - property: 색상 범위
        pvc: 넓음 (전체 색상 스펙트럼)
        hypalon: 제한적 (기본 색상)
      - property: 내화학성
        pvc: 좋음 (연료/오일 저항 등급)
        hypalon: 우수함 (넓은 화학 범위)
section_testing:
  title: 시험 및 안전 프로토콜
  subtitle: 모든 생산 배치를 위한 Paddle Board Overstock의 품질 보증 체계
  protocols:
    - title: 1.25배 정격 압력 유지 시험
      description: 모든 조립된 장치는 정격 운전 압력의 1.25배로 팽창시킨 후 24~48시간 유지합니다. 압력 감소가 2%를 초과하면 거부 및 재작업이 진행됩니다.
      standard: ISO 6185
    - title: 심 접착 강도 시험
      description: 각 생산 배치에서 용접 및 접착 심 샘플을 캘리브레이션된 장력 장비를 사용하여 접착 강도를 테스트합니다. 최소 4 kN/m 접착 저항 필요.
      standard: ISO 2411
    - title: 직물 인장 시험
      description: 입고되는 원단 롤은 경사 및 위사 방향 모두에서 인장 강도와 신장률을 테스트합니다. PVC의 경우 3,000 N/5cm 이하일 시 거부.
      standard: ISO 1421
    - title: UV 가속 기상 시험
      description: 재료 샘플은 QUV 시험 챔버에서 1,000+ 시간의 가속 UV 노출을 받습니다. 최대 15% 인장 강도 손실 허용.
      standard: ASTM G154
    - title: 밸브 및 피팅 완전성
      description: 각 밸브 조립은 1.25배 정격 압력에서 밀봉 완전성을 테스트합니다. 역류 방지 밸브는 일방 통과 밀봉 성능을 테스트합니다.
      standard: ISO 12402
section_manufacturing:
  title: 제조 기준 및 품질 인증
  subtitle: 글로벌 시장 접근을 위한 산업 표준 준수
  standards:
    - name: ISO 9001:2015
      body: SGS 인증
      scope: 설계, 생산 및 배송 전반에 걸친 품질 관리 시스템
    - name: CE 2013/53/EU
      body: EU 공인기관
      scope: 레저용 선박 지침 — 선체 설계, 안정성, 부력, 배출
    - name: BSCI
      body: Amfori
      scope: 사회적 준수 — 근로자 안전, 공정 노동, 환경 관리
    - name: ISO 6185
      body: 국제 표준
      scope: 고무보트 — 구조, 안정성, 부력, 압력 테스트
    - name: REACH
      body: EU 규정
      scope: 화학 안전 — 재료 및 코팅의 제한 물질
section_faq:
  title: 기술 FAQ
  questions:
    - q: drop-stitch는 기존의 단단한 선체 구조와 어떻게 비교되나요?
      a: 현대 drop-stitch 코어는 20 PSI에서 비교 가능한 EPS 폼/유리섬유 단단한 선체의 강성의 85–90%를 달성하며, 운송을 위해 완전히 공기 제거가 가능합니다. 단점은 약간 높은 무게와 낮은 최종 강성이지만 — 대부분의 레저용 및 상업용 응용에서는 차이가 거의 없습니다.
    - q: 프리미엄 품질로 여겨지는 실 밀도는 얼마인가요?
      a: 프리미엄 drop-stitch 원단은 1평방인치당 2개의 실(약 3,100실/m²)을 사용하며 1,680 DTEX 폴리에스터 원사로 짜여집니다. 입문용 원단은 1평방인치당 1개의 실과 1,100 DTEX 원사를 사용합니다.
    - q: Hypalon는 PVC처럼 용접할 수 있나요?
      a: 아니요. Hypalon/CSM는 RF 용접이 불가능합니다. 수작업 접촉 접착제를 사용하여 조립해야 하며, 이는 생산을 더 노동집약적으로 만들고 솔기 품질이 작업자 기술에 따라 달라집니다. PVC는 RF 용접 또는 열풍 용접이 가능하여 일관되고 자동화된 솔기 품질을 제공합니다.
    - q: 고무보트의 최대 안전 압력은 얼마인가요?
      a: 표준 고무보트 튜브는 8–12 PSI에서 작동합니다. Drop-stitch 바닥은 12–20 PSI에서 작동합니다. 고압 drop-stitch 코어(SUPs)는 20–25 PSI에서 작동할 수 있습니다. 각 제품에는 과도한 팽창을 방지하기 위해 압력 완화 밸브가 포함되어 있습니다.
    - q: 맞춤형 고무보트 제조에는 얼마나 걸리나요?
      a: 표준 OEM 생산은 주문 확인 후 FOB 칭다오까지 30–45일 소요됩니다. 맞춤 몰드 개발은 프로토타입 생산 및 테스트를 위해 15–20일이 추가됩니다.
