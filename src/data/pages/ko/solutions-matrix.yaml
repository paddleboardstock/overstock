hero:
  tagline: 산업 솔루션 매트릭스
  title: 시나리오 기반 해양 솔루션<br />전문 작업용
  subtitle: 구조, 렌탈 함대, 요트 텐더, 상업용 낚시 용도로 설계된 목적 지향 인플레이션 수상 이동 수단 및 RIBs — 각 제품은 기술 사양과 맞춤 옵션으로 지원됩니다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock 다양한 산업을 위한 전문 해양 솔루션
direct_answer: 'Paddle Board Overstock는 상업용 해양 작업을 위한 시나리오 설계 인플레이션 수상보트 및 RIB 솔루션을 제공합니다: 강화된 Hypalon 튜브와 다중 챔버 안전 기능을 갖춘 구조 및 순찰 보트, 1.2mm PVC와 저유지 보수를 위한 열공기 용접 솔기를 갖춘 렌탈용 함대 SUPs 및 카약, 깊은 V형 알루미늄 선체 RIBs를 갖춘 고급 요트 텐더, 낚싯대 홀더와 라이브웰 시스템을 갖춘 중장비 낚시용 구성.'
solution_a:
  tagline: 솔루션 A
  title: 해양 구조 &<br />상업 순찰
  subtitle: 전문적인 응급 대응 및 법 집행 작전을 위한 고속 다중 챔버 안전 RIBs
  badge: Heavy-Duty Series
  description: 우리의 해양 구조 및 순찰 RIBs는 다중 챔버 독립 부력 설계를 특징으로 하는 강화 고밀도 Hypalon/PVC 공기 튜브로 제작되었습니다. 각 선박에는 전문 등급 반사 테이프, 구조용 그랩 라인, 급속 팽창 밸브가 장착되어 배치 준비가 되어 있습니다. 딥-V 유리섬유 선체는 고속과 거친 해상 조건에서도 뛰어난 안정성을 제공합니다.
  features:
    - title: 다중 챔버 안전
      description: 4–6개의 독립된 공기 챔버 — 하나의 챔버가 펑크가 나도 양력을 유지함
    - title: 강화 튜브 원단
      description: 1.2 mm Hypalon CSM 또는 이중층 열풍 용접 솔기를 가진 1,680 DTEX PVC
    - title: 전문가급
      description: SOLAS 반사 테이프, 구조용 잡는 줄, 견인 클리트, 빠른 해제 페인터 라인
    - title: 고속 선체
      description: 구성에 따라 25~45노트까지 가능하도록 등급이 매겨진 딥-V 유리섬유 또는 알루미늄 선체
  recommended_models:
    - RIB 450 순찰
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: 선체 재질
      value: 유리섬유 / 해양용 알루미늄
    - label: 튜브 원단
      value: 1.2 mm Hypalon CSM / 1,680 DTEX PVC
    - label: 최고 속도
      value: 25–45노트
    - label: 용량
      value: 6–12명
    - label: 엔진 범위
      value: 40–200 HP
    - label: 인증
      value: CE / ISO 9001
solution_b:
  tagline: 솔루션 B
  title: 수상 스포츠 대여 &<br />리조트 함대 장비
  subtitle: 초내구성, 저유지관리 인플레이션 SUPs, 카약 및 보트로, 리조트, 클럽 및 투어 운영에서 일일 대여용으로 제작되었습니다.
  badge: Rental-Grade
  description: 저희 렌탈 장비는 최고의 내구성과 최소 유지 비용을 위해 설계되었습니다. 저희는 1.2mm 강화 PVC를 사용하며, 삼중층 열풍 용접 봉제 기술로 UV 손상과 잦은 충돌 피해를 견디도록 합니다. Drop-stitch 구조는 수백 번의 렌탈 사이클 후에도 보드가 강성을 유지하도록 보장합니다. 모든 모델에는 강화 D-링, 마모 방지 레일 밴드, 상업용 등급 밸브가 특징입니다.
  features:
    - title: 상업용 등급 PVC
      description: 1.2mm 강화 PVC와 UV 안정 장치 — 소비자용 재료보다 3배 두꺼움
    - title: 열풍 용접 이음
      description: 삼중층 융합 용접 — 접착 결합보다 강하고, 박리 저항
    - title: Drop-Stitch 강직
      description: 1,680 DTEX 코어, 평방 인치당 2개의 스레드 — 하드보드와 같은 강성을 위해 20 PSI로 평가됨
    - title: 함대 준비 디자인
      description: 보강된 D자 고리, 상업용 할키-로버츠 밸브, 내마모 레일 밴드
  recommended_models:
    - SUP 치타 급상승
    - SUP 오션 보이저
    - AirDeck 360도
    - RIB 330
  specifications:
    - label: 튜브 재질
      value: 1.0–1.2 mm 강화 PVC
    - label: 심 기술
      value: 삼중층 열풍 용접
    - label: 최대 압력
      value: 15–20 PSI (drop-stitch 모델)
    - label: UV 저항
      value: 1,000+ 시간 가속 테스트
    - label: 보증
      value: 모델에 따라 2–5년
    - label: 유지
      value: 최소 — 헹구고 보관
solution_c:
  tagline: 솔루션 C
  title: 요트 텐더 &<br />럭셔리 수상 보트
  subtitle: 슈퍼요트 저장 및 손님 운송을 위해 설계된 경량 고성능 RIB 텐더, 럭셔리 마감 처리.
  badge: Premium Series
  description: 우리의 요트 텐더 RIBs는 경량 구조와 럭셔리 미학을 결합합니다. Deep-V 알루미늄 또는 유리섬유 선체는 뛰어난 승차감과 손쉬운 데이빗 리프팅을 제공합니다. 색상 매칭 튜브 그래픽, 프리미엄 시트, 맞춤형 콘솔 레이아웃으로 제공됩니다. 컴팩트한 저장 크기로 슈퍼요트 차고 및 데크 저장에 이상적입니다.
  features:
    - title: 경량 구조
      description: 해양용 알루미늄 선체는 유리섬유 대비 30% 경량으로 들어올리기 용이
    - title: Deep-V 성능
      description: 18–22도 데드라이즈 선체로 파도에서도 부드러운 승차감과 우수한 추적성 제공
    - title: 럭셔리 마감
      description: 맞춤형 시트, 색상 매칭 튜브, 프리미엄 헬름 콘솔, 스테인리스 패키지
    - title: 컴팩트 저장
      description: 슈퍼요트 차고용 설계 — 압축 가능한 튜브로 공간 절약
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: 선체 유형
      value: Deep-V 알루미늄 / 유리섬유
    - label: 데드라이즈
      value: 18–22도
    - label: 최고 속도
      value: 30–40노트
    - label: 건조 중량
      value: 120–350 kg (알루미늄 선체)
    - label: 데이빗 리프트 준비
      value: 예 — 표준 리프팅 포인트 포함
    - label: 저장
      value: 압축 가능한 튜브, 적층 가능
cta:
  title: 어떤 솔루션이 귀사의 운영에 적합한지 확신이 없으신가요?
  subtitle: 귀하의 애플리케이션, 운영 환경 및 용량 요구 사항을 설명해 주세요. 저희 팀이 48시간 이내에 최적의 구성을 추천해 드립니다.
  actions:
    - variant: primary
      text: 솔루션 추천 받기
      href: /contact
    - text: 모든 해양 제품 보기
      href: /products
