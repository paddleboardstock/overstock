hero:
  tagline: 장비
  title: 제조 장비 및 기계
  subtitle: 절단, 용접, 인쇄 및 조립 전반에 걸친 산업용 장비
  back_label: 공장으로 돌아가기
  back_link: /factory
categories:
  - title: 절단 및 자재 준비
    items:
      - name: 자동 PVC 절단기
        spec: CNC 제어, 6.5 m × 2.5 m, 0.1 mm 정확도
        desc: PVC, Hypalon, drop-stitch 원단용 컴퓨터 제어 자동 절단기. 네스팅 소프트웨어가 재료 활용도를 최적화하여 5% 미만의 폐기물 발생.
      - name: 원단 스프레더
        spec: 최대 3 m 폭, 장력 제어 공급
        desc: 절단 전 원단을 단일 또는 다층으로 깔고, 장력을 제어하여 변형 방지.
  - title: 튜브 용접 및 접합
    items:
      - name: 열 실링 기계
        spec: 열풍 용접, 200–600 °C 가변, 0.5–5 m/min
        desc: PVC 및 Hypalon 튜브 심 접합 및 용접용 열풍 열 밀봉 기계. 튜브 챔버와 플로트 조인트의 임시 고정, 밀봉 및 융합에 사용.
      - name: 유전 RF 프레스
        spec: 15 kW, 플래튼 2000 × 600 mm
        desc: 주 종방향 심, 트랜섬-튜브 접합, 대형 챔버 제작용 라디오 주파수 용접 프레스.
      - name: CNC 제어 RF 용접기
        spec: 8 kW, XY 테이블 2500 × 1200 mm
        desc: 복잡한 형상, 로고 엠보싱, 정밀 패치워크용 프로그래밍 가능 곡선 심 용접.
  - title: RIB 선체 제조
    items:
      - name: 유리섬유 핸드 레이업 몰드
        spec: 최대 6 m LOA RIB 선체용 다수 몰드
        desc: 폴리에스터 및 비닐에스터 수지 시스템을 사용한 전통적인 핸드 레이업 유리섬유 성형. 각 레이어는 손으로 롤링하고 진공 백을 이용해 일정한 적층 품질과 강도를 확보.
      - name: 젤코트 스프레이 부스
        spec: 온도 제어, 필터링된 공기 환기
        desc: RIB 선체용 젤코트 도포. 높은 광택과 UV 내성을 가진 마감 제공, 두께를 정확히 제어.
      - name: CNC 라우터 (5축)
        spec: 3 m × 2 m × 1 m 범위, 수냉 스핀들
        desc: 선체 인서트, 콘솔 몰드, 좌석 베이스, 맞춤형 브래킷 가공.
  - title: SUP 인쇄 및 장식
    items:
      - name: 디지털 프린터
        spec: 고해상도 잉크젯, 최대 2m 인쇄 폭
        desc: 풀컬러 덱 그래픽을 위한 직접 디지털 인쇄 SUP . 맞춤 패턴, 그라데이션, 사진 품질 이미지를 -UV저항성 수성 잉크로 인쇄합니다.
      - name: 스크린 인쇄기
        spec: 수동 및 반자동, 다색 등록
        desc: SUP 보드 로고, 브랜드 마크, 반복 패턴을 위한 스크린 인쇄. 내구성 있고 불투명하며 선명한 색상 채도를 제공하는 인쇄물.
  - title: 조립 및 장비 설치
    items:
      - name: 엔진 호이스트
        spec: 500kg 용량, 조절 가능한 스프레더 바
        desc: 외부 엔진의 안전한 장착 범위는 2.5마력에서 60마력까지.
      - name: 콘솔 목업 프레임
        spec: 조절 가능한 높이와 각도
        desc: 조향, 스로틀, 계기판 설치 전에 사전 리깅.
      - name: 유압 호스 크림퍼
        spec: 최대 1인치 내경, 디지털 압력 게이지
        desc: 맞춤 길이의 유압 조향 호스 어셈블리와 스웨이지 피팅.
      - name: 전기 하네스 위원회
        spec: 3 m × 1.5 m, 미리 인쇄된 배선도(배선 도면)
        desc: 완전한 전기 하네스의 오프보트 조립 및 시험.
  - title: 시험 및 품질 관리
    items:
      - name: 범용 인장 시험기
        spec: 50 kN, / ASTM D751
        desc: 원단 배치의 절단력, 파단 시 신장, 그리고 찢어진 전파 테스트.
      - name: 공기 유지 시험 장비
        spec: 프로그래밍 가능한 30분 압력 유지
        desc: 조립 전 모든 튜브 챔버에 대해 자동 압력 유지 테스트.
      - name: 솔기 필 테스터
        spec: 모터로 180° 필을 분당 100mm로 돌립니다
        desc: ISO 6185에 따른 용접 및 접착 이음 날림 강도 시험.
      - name: 제논 아크 기상 시험 챔버
        spec: 2000시간 노출
        desc: UV 색상 변화 및 강도 유지에 대한 내성 시험.
cta:
  title: 공장 견학에 관심이 있으신가요?
  desc: 저희 청도 시설을 방문하시는 것을 환영합니다. 저희 장비와 공정을 직접 확인해 보세요.
