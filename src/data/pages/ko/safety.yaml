hero:
  tagline: 안전
  title: 안전 기준 및 인증
  subtitle: 모든 Paddle Board Overstock 제품은 철저한 테스트를 거치며, 64개의 CE 인증 모델은 레크리에이션 및 전문 용도의 국제 안전 기준을 충족합니다. ISO 9001 인증 공장.
trust_bar:
  items:
    - value: CE 6185
      label: 레크리에이션 선박 인증
      sub: TÜV 라인란트(Rheinland) 테스트 완료
    - value: SOLAS
      label: 연안 안전 규정 준수
      sub: 24시간 부력 검증
    - value: ISO 9001
      label: 품질 관리
      sub: TÜV 라인란드 감사
    - value: 99.3%
      label: 결함률
      sub: AQL 2.5 per ISO 2859
certifications:
  - title: CE 인증 (EU 2016/425)
    standard: PPE 규정 (EU) 2016/425 | EN ISO 12402
    description: 모든 Paddle Board Overstock 안전 장비는 유럽 개인 보호 장비 규정에 따른 CE 표시 요구사항을 준수합니다. 모든 제품은 유럽 공인 기관인 TÜV 라인란트(Rheinland)가 독립적으로 테스트합니다. 우리의 고무보트와 RIBs은 레크리에이션 선박 지침 2013/53/EU (RCD) C 및 D 등급 요건을 충족합니다.
    body: CE 인증은 개인 부력 장치 및 인플레이션 수상 운송 장치의 필수 건강 및 안전 요구사항을 포함합니다. TÜV 라인란트(Rheinland)는 연간 생산 시설을 감사하여 지속적 준수 여부를 확인합니다.
  - title: SOLAS — 해상 생명 안전
    standard: SOLAS 제3장 | LSA 코드
    description: 라이프 베스트 프로는 연안 및 상업 해상 운용에 대한 SOLAS 규정을 준수합니다. 24시간 부력 유지, 물 침수 시 자동 팽창, 최대 풍력 5등급의 해상 상태에서 성능 테스트 완료. 상업 선박용 구명조끼 제3장 요구사항 충족.
    body: SOLAS 승인은 부력, 강도, 가시성 및 자동 작동에 대한 공인 기관의 독립 테스트가 필요합니다. 우리의 라이프 베스트 프로는 MED 인증을 통한 전체 SOLAS 형식 승인을 획득했습니다.
  - title: USCG 유형 III / 유형 V
    standard: 46 CFR Part 160 | USCG 승인
    description: 선택된 Paddle Board Overstock 구명조끼는 미국 해안경비대의 유형 III(부력 보조) 및 유형 V(특수 용도) 장치 분류를 충족합니다. 보호된 수역, 연안 항해 및 USCG 승인 PFD가 필요한 상업 운용에 적합합니다.
    body: USCG 승인은 CG 공인 독립 연구소에서의 테스트를 요구합니다. 유형 V 승인은 수동 또는 자동 작동이 필요한 하이브리드 인플레이터 디자인을 포함합니다.
  - title: BSCI 사회적 준수
    standard: amfori BSCI 행동 강령
    description: 우리 공장은 매년 amfori 비즈니스 사회적 준수 이니셔티브(BSCI)에 따라 감사를 받습니다. 이를 통해 윤리적 노동 관행, 작업장 안전, 공정 근로 시간 및 12,000 m² 규모의 생산 시설에 대한 환경 관리가 검증됩니다.
    body: BSCI 준수는 유럽 소매업체 및 수입업체의 전제 조건입니다. 현재 BSCI 등급은 SGS에 의해 감사된 “C”(양호)입니다.
  - title: REACH 및 RoHS 준수
    standard: EU REACH 규정 (EC) 1907/2006 |RoHS 지침 2011/65/EU
    description: PVC 제품에 사용되는 모든 화합물, 접착제 및 코팅은 Paddle Board Overstock EU REACH 화학 안전 규정과 RoHS 유해 물질 제한을 준수합니다. 각 제품 라인별로 물질 안전 데이터 시트(MSDS)가 제공됩니다.
    body: REACH 준수는 임계 한도를 초과하는 제한 SVHC 물질이 없음을 보장합니다. 정기적인 제3자 실험실 검사를 통해 모든 생산 배치에 대한 지속적인 준수를 확인합니다.
  - title: ISO 9001:2015 품질 관리
    standard: ISO 9001:2015 |TÜV 라인란트 인증
    description: 저희 품질 관리 시스템은 라인 ISO 란트에서 9001:2015 인증을 받았 TÜV 으며, 설계, 생산, 테스트, 애프터서비스 등에 걸쳐 있습니다. 연례 감시 감사는 지속적인 개선과 공정 통제를 보장합니다.
    body: ISO 9001 인증은 문서화된 품질 정책, 내부 감사, 경영 검토, 시정 조치 절차, 추적 가능한 생산 기록을 요구합니다.
testimonial:
  quote: 우리는 아시아 전역의 여러 공급업체로부터 안전 장비를 조달해 왔습니다.Paddle Board Overstock 이 회사는 요청 CE 없이 모든 문서, SOLAS 인증서, 제3자 시험 보고서를 사전에 제공한 유일한 제조사입니다.
  author: 에릭 린드스트룀
  title: 안전 담당관
  company: 발틱 해양 공급
  location: 핀란드
content_overpressure:
  tagline: 과압 안전
  title: RIB 튜브 압력<br />고온 기후에서의 관리
  subtitle: 팽창식 튜브 압력은 온도에 따라 증가합니다. 과압을 이해하고 관리하면 손상을 방지하고 열대 및 사막 환경에서 안전한 운행을 보장합니다.
  items:
    - title: 보일 압력 완화 밸브
      description: Paddle Board Overstock RIB 튜브에는 정격 최대 압력을 초과하는 과압 완화 밸브가 장착되어 있습니다. 태양열 가열로 인한 이음 응력 및 튜브 파열 가능성을 방지합니다.
      icon: tabler:gauge
    - title: 아침부터 정오까지의 압력 변화
      description: 20도에서 3.5로 부풀린 튜브 PSI 는 40도에서 4.5까지 부풀릴 수 있습니다+ PSI . 더운 기후에서는 항상 권장 범위의 하한선까지 팽창시키고, 릴리프 밸브가 과도한 압력을 관리하도록 하세요.
      icon: tabler:sun
    - title: 권장 작동 압력
      description: 'PVC 진공관: 3.0-3.5 PSI 작동 중, 최대 4.5 진 PSI Hypalon 공관. 진공관: 3.5-4.0 PSI 작동 중, 최대 5.0. 항상 PSI PSI PVCPSI HypalonPaddle Board Overstock 품질 관리 기준에 따라 1.25x 정격(4.4 x for 5.0 m) 기준으로 테스트하세요.'
      icon: tabler:chart-bar
    - title: 햇빛 노출 모범 사례
      description: RIBs 사용하지 않을 때는 그늘진 곳에 보관하세요. UV장시간 계류를 위해 보호 커버를 사용하세요. 햇볕 최대 시간 전후에 튜브 압력을 확인하고 조절하세요. 최대 정격 압력을 절대 초과하지 마세요.
      icon: tabler:umbrella
    - title: 비상 감압
      description: 튜브가 너무 단단하거나 릴리프 밸브가 배출된다면, Halkey-Roberts 또는 군용 밸브를 통해 공기를 방출하여 압력이 작동 범위에 도달할 때까지 유지하세요. 정확한 측정을 위해 압력 게이지를 휴대하세요.
      icon: tabler:alert-circle
