hero:
  tagline: 렌탈 비즈니스 솔루션
  title: 수익성 있는 수상 스포츠를 구축하다<br />Aquafarer와 함께하는 렌탈 사업
  subtitle: SUP 클럽, 해변 리조트, 호수 운영자, 수상 스포츠 센터를 위한 완벽한 렌탈 장비 패키지 — 장비 선택에서부터 장비 관리 및 유지보수 지원까지.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-paddle-girls-team.webp
    alt: Aquafarer 수상 스포츠 대여 함대 활동 중
direct_answer: Aquafarer은(는) 수상 스포츠 운영자를 위한 종합 렌탈 비즈니스 솔루션을 제공합니다. 초보자 친화적인 SUP 함대부터 상업용 RIB 렌탈까지, 저희는 귀하가 적절한 장비를 선택하고, 위치에 맞게 함대 규모를 최적화하며, 유지보수 다운타임을 최소화하고, 렌탈당 수익을 극대화할 수 있도록 도와드립니다. 저희의 렌탈 검증 제품은 상업용 PVC 구조, 손쉬운 수리 가능성, 보관 비용을 없애주는 인플레이션 디자인을 특징으로 합니다. 새로운 렌탈 운영을 시작하든 기존 함대를 업그레이드하든, Aquafarer은 수익성 있는 수상 스포츠 렌탈 비즈니스를 구축하는 장비와 전문 지식을 제공합니다.
solution_offerings:
  - title: 함대 스타터 키트
    subtitle: 시장 테스트를 위한 새로운 임대 운영
    badge: Popular
    features:
      - title: 함대 평가
        description: 위치, 고객 인구 통계 및 수익 목표에 대한 전문가 분석을 통해 귀하의 차량 규모를 결정
      - title: 초보 장비
        description: 패들, 펌프, 구명조끼, 수리 키트가 포함된 10개의 SUP 보드 — 출항에 필요한 모든 것
      - title: 저장 솔루션
        description: 공기 주입식 장비는 평평하게 포장됩니다 — 보관을 위해 보트 부두나 트레일러가 필요하지 않습니다
      - title: 안전 준수
        description: 모든 장비 CE 일상 대여 사용을 위한 상업용 등급 구조로 인증됨
      - title: 스타터 마케팅
        description: 서비스 출시에 도움을 주는 브랜디드 사진 자산 및 렌탈 메뉴 템플릿
    cta_text: 렌탈 차량 시작
    cta_href: /contact
  - title: 함대 확장 키트
    subtitle: 재배 작업에 용량과 다양성 추가
    badge: Premium
    features:
      - title: 혼합 함대 설계
        description: SUPs, 카약, 고무보트 및 RIBs의 조합으로 다양한 고객 취향을 충족
      - title: 대량 구매 가격
        description: 20대 이상 차량을 위한 단계별 도매 가격과 우대 물류 요금
      - title: 맞춤 브랜딩
        description: 장비에 로고 인쇄, 브랜드 구명조끼, 렌탈 장비용 맞춤 색상 옵션
      - title: 유지 관리 프로그램
        description: 예비 부품 키트, 직원 수리 교육, 기술 지원 직접 접속
      - title: 수익 최적화
        description: 가격 책정, 장비 회전 및 계절별 차량 조정에 대한 데이터 기반 권장 사항
    cta_text: 내 함대를 확장하다
    cta_href: /contact
benefits:
  - icon: coin
    title: 높음 ROI
    description: SUP 렌탈은 첫 시즌에 장비 비용의 3-5배를 회수합니다
  - icon: package
    title: 제로 저장 비용
    description: 공기 주입식 장비는 평평하게 포장됩니다 — 마리나, 부두, 트레일러가 필요 없습니다
  - icon: wrench
    title: 쉬운 유지 관리
    description: 현장에서 수리 가능한 PVC 구조로 패치 키트 사용 — 전문 인력 불필요
  - icon: users
    title: 입증된 수요
    description: 해안과 호수 지역에서 수상 스포츠 대여 수요가 매년 15%씩 증가하고 있습니다
trust_bar:
  items:
    - amount: 10,000+
      label: 전 세계에 제공된 함대 유닛
    - amount: 3–5
      label: 시즌 수명 (상업용 등급)
    - amount: 제로
      label: 보관 비용 — 팽창식 디자인
    - amount: 99.3%
      label: 출하 시 무결점률 (AQL 2.5 per ISO 2859)
testimonial:
  content: 저는 지역 가게에서 보드 5개를 빌리면서 매출의 60%를 그들에게 잃고 있었습니다. Aquafarer 덕분에 저는 제 자신의 15개 SUPs 보유함을 구축할 수 있었습니다. 그들이 제공한 ROI 계산기는 제가 4개월 만에 손익분기점을 달성할 것이라고 보여주었지만 실제로는 3개월이 걸렸습니다. 이제 저는 보드를 30개로 확장하고 카약을 추가하고 있습니다.
  name: 다니엘 오콘크워
  title: 소유자, 레이크랜드 SUP 렌탈 — 온타리오, 캐나다
content_segments:
  tagline: 렌탈 프로필
  title: 수상 스포츠 대여 솔루션<br />운영자 유형별
  subtitle: 다양한 렌탈 사업은 각각 다른 필요를 가지고 있습니다 — 작은 해변가 SUP 렌탈부터 대규모 리조트 수상 스포츠 센터까지. 저희는 이에 맞게 장비 패키지와 지원 모델을 맞춤 제공합니다.
  items:
    - title: 해변 및 호숫가 SUP 렌탈
      subtitle: 대량, 저복잡도 작업
      description: 독립적으로 서서 타는 패들보드와 카약을 해변 방문객과 호수 방문객에게 대여하는 운영자들. 우선순위는 대여 간 회전 시간을 최소화하고, 장비를 계속 사용 가능하게 유지하며, 작은 저장 공간으로 계절 수요 급증을 관리하는 것입니다.
      features:
        - 평평하게 접을 수 있는 SUP 플릿 — 부두나 트레일러 불필요
        - 상업용 등급 PVC, 시즌당 100+ 대여 사이클에 적합
        - 빠르게 건조되고 UV에 강한 원단으로 당일 재대여 준비 가능
        - 쉽게 함대를 식별할 수 있도록 색상 코드가 지정된 보드 범위
    - title: 리조트 및 호텔 수상 스포츠 센터
      subtitle: 고객 경험과 브랜드 정렬
      description: 리조트와 호텔이 현장 편의시설로 수상 스포츠를 제공하는 경우. 장비는 프리미엄처럼 보여야 하며, 초급부터 중급까지 모두 안정적으로 작동해야 하며, 리조트의 기존 활동 예약 및 청구 워크플로우와 통합되어야 합니다.
      features:
        - SUP 맞춤형 브랜드 보드와 리조트 색상에 맞는 구명조끼
        - '혼합 함대: SUPs카약, 페달 보트, 소형 RIB 텐더'
        - 해변 인플레이션을 위한 조용하고 연료 없는 전기 펌프 솔루션
        - 직원 교육 및 정비 온보딩에는
    - title: 보트 및 RIB 렌탈 운영자
      subtitle: 상업용 선박 임대 함대
      description: 운영자들은 RIB 텐더, 고무보트, 소형 런어바웃 등 동력 선박을 시간제 또는 반나절 단위로 임대합니다. 귀하의 선단은 해양 안전 규정을 준수하고, 손님 이용이 많으며, 전세 사이의 기계적 다운타임을 최소화해야 합니다.
      features:
        - RIB 30–90개의 HP 외부 준비 트랜섬을 가진 패키지
        - 장기적인 구조적 완전성을 위한 해양용 합판 바닥판
        - 빠른 회전을 위한 퀵런치 밸브 시스템
        - 예비 부품 키트 + 대기 기술 지원 SLA
    - title: 투어 및 어드벤처 운영자
      subtitle: 가이드 관광 함대
      description: 운영자들은 가이드 수상 스포츠 투어를 운영합니다 — SUP 사파리, 동굴 카약, 스노클링 투어, 섬 호핑 RIB 투어 등이 있습니다. 장비는 초보자 투어 손님이 사용할 수 있을 만큼 안정적이어야 하며, 그룹 간 세척이 빠르고, 다양한 수역 조건에서 매일 가이드 사용에 적합해야 합니다.
      features:
        - SUP +초보 라이더를 위한 32인치 폭의 엑스트라 스테이블
        - 커플/그룹 투어 구성용 탠덤 카약 옵션
        - 스노클 장비, 드라이백, 쿨러 내장 화물 용량
        - CE + USCG 상업 운영을 위한 준수 문서
cta:
  title: 임대 차량을 구축할 준비가 되셨나요?
  subtitle: 위치와 손님 수에 대해 알려주세요 — 시장에 최적화된 임대 차량을 설계해 드립니다.
  actions:
    - variant: primary
      text: 임대 제안서 받기
      href: /contact
    - text: 비즈니스 패키지 비교
      href: /business-packages
    - text: 성공 사례 보기
      href: /success-stories
