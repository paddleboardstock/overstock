hero:
  tagline: 우리의 이야기
  title: Paddle Board Overstock — 엔지니어링 프리덤 온 워터
  subtitle: '해안 작업장에서 글로벌 해양 제조업체에 이르기까지 — 우리의 여정은 완고한 신념 위에 세워집니다: 수상선은 중요하게 설계되어야 하며, 실제로 그렇기 때문입니다.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock 칭다오의 공장 및 해양 제조 시설
