content_founding:
  tagline: 시작
  title: 해안가에서 태어났다
  subtitle: 칭 Paddle Board Overstock 다오의 해안 작업장에서 한 척의 보트와 실제 해양 환경을 견딜 수 있는 팽창식 수상 선박을 만드는 비전으로 시작했습니다.
  paragraphs:
    - 2012년, 창립자들은 시장의 틈새를 발견했습니다 — 대부분의 팽창식 보트는 저렴하지만 신뢰할 수 없거나, 고품질이지만 너무 비싸다는 것이었습니다. 그들은 품질과 가치를 모두 제공하는 제조업체가 자리를 지킬 수 있다고 믿었습니다.
    - 첫 선체는 수작업으로 제작되었고, 현지 해역에서 시험되었으며, 어부들과 소규모 상업 운영자들의 실제 피드백을 바탕으로 다듬어졌습니다. 이 피드백 루프 — 제작, 테스트, 경청, 개선 — 은 오늘날 우리의 공학 철학의 핵심입니다.
    - 2015년까지 소식은 칭다오를 넘어 퍼졌다. 국제 유통업체들이 샘플을 요청하기 시작했다. 지역 워크숍으로 시작된 것이 글로벌 공급업체로 성장했다.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 초기 생산 작업장 및 제조
content_growth:
  tagline: 성장과 혁신
  title: 작업장에서 12,000 m² 시설로
  subtitle: 인력, 장비, 공정에 대한 지속적인 투자는 Paddle Board Overstock 현대적인 해양 제조 시설로 변모했습니다.
  paragraphs:
    - 수요가 증가함에 따라 우리 시설도 함께 확장되었습니다. 우리는 작은 작업장에서 보 RIB 트, 팽창식 보트, 보드, 액세서리 전용 생산 라인을 갖춘 12,000 m² 규모의 공장으로 확장 SUP 했습니다.
    - 우리는 CNC 절단기, 고주파 용접 장비, 드롭 스티치 생산 라인, 종합 테스트 장비에 투자하여 생산 품질의 모든 측면을 통제할 수 있게 했습니다.
    - 현재 200-300명 규모의 우리 팀은 해양 엔지니어, 재료 과학자, 품질 관리 전문가, 숙련된 장인들로 구성되어 있으며, 이들 중 다수는 Paddle Board Overstock 초창기부터 함께해 왔습니다.
content_mission:
  tagline: 우리의 미션
  title: 물 위의 엔지니어링 프리덤
  subtitle: 모든 Paddle Board Overstock 제품은 사람들이 물 위에서 탐험하고, 일하며, 번창할 수 있도록 신뢰성 있고, 안전하며, 합리적인 가격으로 설계되었습니다.
  list:
    - 단지 문서상이 아닌 실제 해양 조건에서 성능을 발휘하는 수상 기구 설계
    - 신뢰할 수 있는 OEM/ODM 서비스를 통해 유통업체 및 브랜드와 지속적인 파트너십 구축
    - 더 나은 가치를 제공하기 위해 제조 공정을 지속적으로 개선
    - 모든 제품을 정품 부품과 기술 전문 지식으로 지원
cta:
  title: 제조업체와 협력할 준비가 되어 있습니다<br />품질을 중요하게 여기는?
  subtitle: 최소 주문 압박 없이, 단지 정직한 조언만 제공하니 OEM/ODM 프로젝트에 대해 논의하려면 저희 팀에 연락하세요.
  actions:
    - variant: primary
      text: 대화를 시작하다
      href: /contact
    - text: 우리 제품을 살펴보세요
      href: /products
