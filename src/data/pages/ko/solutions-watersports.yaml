content_challenge:
  tagline: 도전 과제
  title: 수상 스포츠 운영<br />다재다능한 수요 RIBs
  subtitle: 세일링 학교, 수상 스포츠 센터, 이벤트 조직은 여러 역할을 수행할 수 있는 보트를 필요로 합니다 — 지도, 견인, 안전, 운송 — 종종 몇 시간 내에 기능을 전환해야 합니다.
  paragraphs:
    - 수상 스포츠는 가장 다양한 해양 산업 중 하나로, 세일링 교육, 웨이크보드 및 수상 스키 같은 모터 활동, 모든 수준의 경쟁 이벤트를 포함합니다. 각 응용 분야는 서로 다른 보트 기능을 요구하지만, 많은 운영자는 일상 일정에서 여러 역할을 수행할 수 있는 단일 선단이 필요합니다.
    - '**세일링 학교**는 교사가 선상에서 안정적으로 서서 시범을 보여줄 수 있을 만큼 안정적이고, 전복된 선수를 신속하게 구조할 만큼 빠르며, 반복적인 해변 상륙에도 견딜 수 있을 만큼 튼튼한 코치 RIBs를 필요로 합니다. 보트는 눈에 잘 보여야 하며, 마리나의 좁은 공간에서도 조종이 가능해야 하고, 바람이 멈출 때 세일보트를 다시 육지로 견인할 수 있어야 합니다.'
    - '**수상 스포츠 센터**는 수상 스키, 웨이크보드, 튜브 견인 등의 활동을 운영하며, 일정한 파형 특성, 강력한 초기 가속력, 연속 라이더 세션을 위한 연장된 연료 범위를 갖춘 전문 견인 보트를 필요로 합니다. 낮은 속도에서의 안정성은 라이더 탑승과 안전 모니터링에 매우 중요합니다.'
    - '**이벤트 조직**은 요트 경기, 철인 3종 경기, 수상 스포츠 대회를 관리하며, 코스 경계를 순찰하고, 규칙을 시행하며, 응급 상황에 대응하고, 임원을 운송할 수 있는 안전 및 관리 보트를 필요로 합니다 — 전체 다일 이벤트 동안 전문적인 외관과 안정적인 성능을 유지하면서.'
    - 세 가지 세그먼트 전반에 걸친 공통점은 다양한 조건에서 최소한의 다운타임으로 운용 가능한 다재다능하고 내구성이 있으며 전문적으로 장비된 RIBs의 필요성입니다. Paddle Board Overstock은 각 특정 역할에 맞게 구성된 수상 스포츠 RIBs을 제작합니다.
content_solution:
  tagline: 우리의 해결책
  title: 수상 스포츠 RIBs<br />모든 역할에 맞게 제작됨
  subtitle: Paddle Board Overstock 수상 스포츠 RIBs는 모듈식 구성으로 설계되어 하나의 보트 플랫폼이 여러 역할을 수행할 수 있습니다.
  list:
    - 안정적인 선체 설계 — 지도자가 선상에서 자신 있게 서서 보트에서 지도할 수 있음
    - 수상 스키, 웨이크보드, 튜브 견인을 위한 견인 파일론 및 견인선 부착 지점
    - 수상 스포츠 견인을 위한 적절한 엔진과 선체 매칭으로 빠른 가속
    - 장시간 수상 세션 동안 교사, 코치 또는 임원의 편의를 위한 전문 좌석 배치
    - 윈드실드, 내비게이션 전자기기, VHF 라디오 및 안전 장비 수납 공간이 있는 풀 콘솔
    - 해양 등급 Hypalon 또는 PVC 튜브 — 연장된 사용 수명을 위해 UV 및 염수에 강함
    - 논슬립 데크 표면 — 스프레이나 라이더 회복으로 데크가 젖어도 승무원의 안전한 이동
    - 맞춤 브랜딩 및 데칼 패키지 — 학교, 센터 또는 이벤트 색상에 맞추세요
    - 데이비트 리프팅 포인트 및 일상적 출항과 회수를 위한 해변 착륙 보강
    - 연장된 일일 운전 시간을 위한 연료 효율적인 4행정 외부 장치 구성
content_segments:
  tagline: 수상 스포츠 프로필
  title: RIB 솔루션<br />수상 스포츠 유형별
  subtitle: 다양한 수상 스포츠 활동은 각각 다른 보트 구성을 요구합니다 — 우리는 모든 RIB를 그것이 수행할 특정 역할에 맞게 맞춥니다.
  items:
    - title: 요트 학교 및 교육 센터
      subtitle: 요트 강습, 안전 지원 및 요트 견인용 코치 RIBs
      description: 요트 학교는 보호된 만, 호수, 연안 해역에서 운영되며, 초보자부터 고급 수강생까지 연중 훈련 세션을 진행합니다. 코치 RIB는 이동식 교육 플랫폼, 안전 지원 선박, 그리고 예인 보트 역할을 합니다. 강사는 서서 시범을 보여야 하므로 안정적인 갑판이 필요하며, 전복된 학생에게 신속하게 대응해야 하고, 매일 해변 착륙과 마리나 조종을 견딜 수 있는 견고한 구조가 요구됩니다. 신뢰성이 가장 중요합니다 — 코치 보트가 고장 나면 수업이 취소되고 학생들이 실망하게 됩니다. 또한 보트는 학교의 품질을 나타내는 전문적인 외관을 가져야 합니다.
      features:
        - 강사가 학생과 근거리에서 소통할 수 있는 낮은 흘수의 안정적인 플랫폼
        - 강사가 서서 이동할 때 안전을 위한 미끄럼 방지 덱과 손잡이
        - 장애가 있는 요트를 육지로 되돌릴 수 있는 견인용 기둥과 브라이들 부착 장치
        - 전복되거나 떠내려가는 학생에 대한 신속한 대응을 위한 빠른 계획 선체
        - 시즌 사이에 운반 및 보관이 용이하도록 날씬한 길이(4.3-5.2m)
        - 훈련 구역 전반에서 쉽게 식별할 수 있는 고가시성 색상 옵션
        - 근거리 조종 중 학생 안전을 위한 프로펠러 가드 옵션
    - title: 수상 스포츠 센터 및 견인 운영자
      subtitle: 수상스키, 웨이크보드, 인플레이션 튜브 타기를 위한 견인 RIBs
      description: 호수, 강, 해안 지역에서 운영되는 수상 스포츠 센터는 매일 대량 견인 작업을 수행합니다 — 수상 스키, 웨이크보드, 니보드, 관광객과 지역 주민을 위한 견인 튜브 승차 등이 포함됩니다. 견인 보트는 일관된 웨이크 특성, 라이더를 빠르게 플레인 상태로 올릴 수 있는 강력한 가속력, 그리고 라이더를 태우고 회수할 때 안정적인 저속 조종 성능이 필요합니다. 이러한 보트는 해안 근처의 얕은 물에서 운항하므로 강화된 선체와 프로펠러 보호 장치가 필요합니다. 하루 8~10시간 연속 세션을 진행할 때 연료 효율도 중요합니다. 이 보트는 또한 안전 플랫폼 역할을 하며 — 운전자, 스포터, 때로는 코치를 태우면서 — 유료 고객에게 매력적으로 보이도록 합니다.
      features:
        - 강력한 출발 가속과 일정한 견인 속도를 위한 목적에 맞춘 엔진 출력
        - 라이더 당기는 각도에 최적화되도록 위치한 두 개의 파일런 및 로프 부착 지점
        - 편안하고 안전한 라이더 경험을 위한 부드럽고 예측 가능한 물결
        - 저속 안정성으로 안전한 라이더 탑승 및 낙상 회복
        - 잦은 해변 및 얕은 물 작업을 위한 강화된 용골과 선체
        - 얕은 작업 구역에서 보호를 위한 프로펠러 터널 또는 가드
        - 6~8시간 연속 견인 작업을 위한 연장 연료 용량
        - 운전자 및 스포터 좌석으로 항상 라이더를 명확하게 볼 수 있음
    - title: 이벤트 및 대회 조직
      subtitle: 해양 이벤트용 마샬, 안전 및 공식 운송 RIBs
      description: 요트 레가타 주최자, 트라이애슬론 경기 감독, 수상 스포츠 대회 코디네이터는 코스 관리, 안전 커버, 공식 운송을 위해 신뢰할 수 있고 전문적인 외관의 RIBs이 필요합니다. 이 보트는 코스 경계를 순찰하고, 경기 규정을 집행하며, 응급 의료 지원을 제공하고, 심판 및 미디어 인력을 운송합니다. 이벤트는 풍향, 파도, 조류 등 모든 기상 조건에서 진행되므로 안정적인 조종과 신뢰할 수 있는 성능이 요구됩니다. 보트의 외관은 참가자, 관중 및 미디어 앞에서 이벤트 브랜드를 대표하기 때문에 중요합니다. 다일간 이벤트는 최소한의 유지보수 시간으로 연속 운영할 수 있는 보트를 필요로 합니다.
      features:
        - 모든 조건에서 서 있는 관계자와 안전한 카메라 작업을 위한 안정된 선체
        - 완전한 항해 시스템 — 조기 아침 및 늦은 저녁 작업을 위한 GPS 차트 플로터, VHF 라디오, 항해등
        - 응급 의료 처치를 위한 응급 키트 보관
        - 이벤트 스폰서 가시성을 위한 전문 브랜딩 및 데칼 패키지
        - 관계자, 미디어 및 의료 인력을 위한 다양한 좌석 구성
        - 빠른 코스 재배치 및 긴급 대응을 위한 신속한 계획 속도
        - 장시간 수상 근무 시 편안함을 위한 기상 보호 콘솔 및 윈드실드
        - 혼잡한 이벤트 마리나에서 도킹 시 안전한 내구성 있는 튜브 구조
