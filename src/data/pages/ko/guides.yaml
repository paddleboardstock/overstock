hero:
  tagline: 가이드
  title: SUP을 처음 사용하시나요?
  subtitle: 공기주입식 수상 스포츠 장비를 선택하고, 사용하고, 즐기는 데 도움이 되는 실용적인 가이드입니다.
size_guide:
  tagline: 사이즈 및 사양
  title: 필요에 맞는 올바른 사이즈 찾기
  desc: 제품 치수, 무게 용량, 권장 사용법을 비교하세요. 투어링 SUP, 컴팩트 카약, 또는 상업용 RIB이 필요하든 — 저희 사이즈 가이드가 올바른 선택을 도와드립니다.
  link_label: 제품 사양이 포함된 전체 사이즈 가이드 →
  link: /size-guide
  cards:
    - title: SUP 보드
      desc: 체중과 사용 목적에 따라 길이를 선택하세요. 넓은 보드(32"+)는 더 많은 안정성을 제공합니다. 긴 보드(11–12 ft)는 투어링에 더 적합합니다.
    - title: 카약
      desc: 단일 카약(9 ft)은 개인 여행과 강에서 사용. 2인용 카약(12 ft)은 두 명이 타거나 장비와 함께 탈 때 적합합니다. 항상 무게 용량을 확인하세요.
    - title: 딩히 & RIBs
      desc: 승객 수와 사용 목적에 따라 길이를 선택하세요. 더 큰 RIBs(4.5 m+)는 연안 및 구조용. 작은 딩히(2.7 m)는 텐더 및 낚시 플랫폼용.
