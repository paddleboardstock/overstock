hero:
  tagline: 공장 감사 및 증거
  title: 공장 감사 준비<br />& 품질 증거
  subtitle: 공장 방문 동안 구매자가 확인하는 모든 것 — 제조 진위와 규정 준수 문서부터 생산 추적 가능성과 품질 관리 시스템까지. 매일 감사 준비 완료.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock 공장 감사 준비 및 품질 증거
direct_answer: Paddle Board Overstock은 문서화된 QC 프로세스, 자재 추적성, HIN 수준의 생산 기록 및 모든 선체에 대한 규정 준수 문서를 갖춘 감사를 준비할 수 있는 12,000 m² 규모의 청도 시설을 운영하고 있습니다. 적격 구매자를 위한 현장 및 가상 공장 투어가 가능합니다.
stats:
  - value: 12,000 m²
    label: ISO 9001 시설
    detail: 칭다오 제조 캠퍼스
  - value: 6
    label: 생산 라인
    detail: 전용 RIB, SIB, SUP 선
  - value: 100%
    label: 압력 시험 완료
    detail: 모든 유닛, 1.25배 / 24-48시간
  - value: 힌
    label: 선체별 추적 가능성
    detail: 전체 배치별 배송 기록
content_priorities:
  tagline: 클라이언트가 확인하는 것
  title: 구매자가 확인하는 8가지 사항<br />모든 공장 방문에서
  subtitle: 50개국 구매자로부터 받은 피드백을 기반으로, 클라이언트가 B2B 주문을 하기 전에 평가하는 여덟 가지 우선순위가 있습니다.
  items:
    - title: 실제 제조업체
      description: '당신은 무역상이 아니라 실제 공장인가요? 구매자는 다음을 확인합니다: 사업체, 실제 생산 장비, 기계를 운영하는 직원, 현장에서 진행 중인 생산 주문, 그리고 웹사이트와 작업장의 일치 여부.'
      icon: tabler:building-factory
    - title: 응용에 적합한 제품
      description: RIB가 그들의 특정 사용 사례에 맞습니까? 리조트, 구조, 다이빙, 낚시, 그리고 순찰 운영자는 근본적으로 다른 요구 사항을 가지고 있습니다. 구매자는 전시된 보트의 갑판 배치, 튜브 재질, 장비 옵션을 평가합니다.
      icon: tabler:target
    - title: 품질 안정성 및 재현성
      description: 50번째 제품이 첫 번째 제품만큼 좋을까? 구매자는 QC 시스템, 공정 중 점검 지점, 부적합 처리 과정을 검토하고 일관성을 확인하기 위해 여러 생산 과정의 기록을 보도록 요청한다.
      icon: tabler:repeat
    - title: 준수 문서 진위
      description: CE 인증서는 모델별로 다른가요? DoC는 실제 사람이 서명한 건가요? 선체 번호별로 준수를 확인할 수 있나요? 구매자는 일반 청구와 모델별 문서를 확인합니다.
      icon: tabler:file-certificate
    - title: 맞춤 실행
      description: 공장이 실제로 맞춤 구성을 제공할 수 있을까요? 구매자는 과거 맞춤 프로젝트의 증거, 전시된 프로토타입 샘플, 엔지니어링 도면, 그리고 현장에서 기술적 수정 사항을 논의할 수 있는 능력을 찾습니다.
      icon: tabler:adjustments
    - title: 리드 타임 및 용량
      description: 제시된 일정은 현실적인가요? 구매자는 현재 생산량, 사용 가능한 생산능력, 인력 규모, 자재 재고 수준, 그리고 공장에 생산 계획 시스템이 있는지를 평가합니다.
      icon: tabler:clock
    - title: 가격 및 거래 조건
      description: '가격이 투명한가요? FOB 가격이 명확한가요? 구매자는 다음을 확인합니다: 단가 세부 내역, 금형 비용, 포장 비용, 그리고 공장이 적절한 수출 문서와 함께 DDP 또는 CIF 조건을 처리할 수 있는지 여부.'
      icon: tabler:currency-dollar
    - title: 애프터서비스 및 부품
      description: 배송 후에는 무엇이 일어납니까? 구매자들은 예비 부품의 가용성, 보증 절차, 교체 튜브 부품, 밸브 교체, 그리고 공장이 문서화된 사후 판매 프로토콜을 가지고 있는지 평가합니다.
      icon: tabler:headset
content_tour:
  tagline: 공장 견학 코스
  title: 감사 투어 —<br />당신이 보게 될 것
  subtitle: 우리의 표준 공장 투어는 각 구간마다 구매자의 질문에 답할 수 있도록 설계된 정해진 경로를 따릅니다.
  items:
    - title: 1. 회의실 — 회사 소개
      description: 사업자 등록증, ISO 9001 및 BSCI 인증서, 수출 면허, 회사 연혁. 생산 능력 및 준수 범위에 대한 간단한 개요.
      icon: tabler:users
    - title: 2. 원자재 창고 — IQC 스테이션
      description: 입고 자재 검사 기록, 원단 배치 증명서, 접착제 및 하드웨어 샘플. 자재가 생산에 들어가기 전에 어떻게 테스트되는지 확인하세요.
      icon: tabler:building-warehouse
    - title: 3. 튜브 제작 — RF 용접 및 수작업 접착
      description: 라이브 튜브 용접 또는 접착 과정, 이음부 강도 테스트 시연, 그리고 밸브 설치. 챔버별 구조와 품질 점검 지점을 관찰하십시오.
      icon: tabler:flame
    - title: 4. 선체 적층 — GRP 작업장
      description: 유리섬유 적층 과정, 젤코트 도포 및 선체 경화. 다양한 RIB 모델에 대한 적층 일정과 구조 보강을 참조하세요.
      icon: tabler:layers-subtract
    - title: 5. 조립 및 통합
      description: 선체-튜브 연결, 콘솔 및 좌석 설치, 전기 및 연료 시스템 통합, 장비 장착. 가동 중인 생산 라인을 관찰하세요.
      icon: tabler:tool
    - title: 6. 압력 시험 장치
      description: 정격 압력의 1.25배에서 24-48시간 압력 유지 테스트. 테스트 기록, 압력 게이지, 합격/불합격 기준 보기. 테스트 결과가 선체 일련 번호와 어떻게 연결되는지 확인.
      icon: tabler:gauge
    - title: 7. 최종 검사 및 품질 관리
      description: 단위당 100점 품질 점검표, 치수 검증, 외관 검사, 포장 상태 점검. 부적합 기록 및 시정 조치 기록 검토.
      icon: tabler:clipboard-check
    - title: 8. 문서 검토실
      description: 모델별 준수 문서(DoC, 빌더 플레이트, 사용자 설명서), 생산 추적 기록, HIN 등록, 자재 배치 추적 데이터베이스 시연.
      icon: tabler:folder
content_qc_chain:
  tagline: 양질의 증거
  title: 8단계 QC 체인<br />— 모든 단계에서 검증 가능
  subtitle: 우리의 품질 관리 체인은 입고 자재에서 최종 출하까지 이어지며, 모든 단계에서 문서로 증거를 남깁니다.
  items:
    - title: '1단계: 입고 자재 검사'
      description: 모든 배치의 PVC, Hypalon, 유리 섬유, 알루미늄, 접착제 및 하드웨어는 생산에 투입되기 전에 규격에 따라 테스트됩니다. 인장 강도, 도장 부착력 및 치수 확인은 AQL 2.5/ISO 2859에 따라 수행됩니다.
      icon: tabler:package
    - title: '단계 2: 튜브 용접 / 접착 품질 검사'
      description: 생산 배치별 솔기 박리 강도 시험. RF 용접 매개변수 모니터링 및 기록. 손접착 솔기는 접착제 도포 및 경화 시간의 일관성을 확인.
      icon: tabler:flame
    - title: '3단계: 선체 적층 품질 관리'
      description: 젤코트 두께 측정, 라미네이트 일정에 따른 유리섬유 적층 확인, 경화 시간 모니터링. 구조 보강 위치를 설계 도면과 비교하여 확인함.
      icon: tabler:layers-subtract
    - title: '4단계: 조립 및 통합 품질관리'
      description: 선체-튜브 접합부의 무결성, 콘솔 및 좌석 장착 토크, 전기 연속성, 연료 시스템 누출 테스트. 각 설치 지점은 모델별 조립 체크리스트에 따라 검증됨.
      icon: tabler:tool
    - title: '5단계: 압력 유지 테스트'
      description: 모든 인플레이션 챔버는 정격 PSI의 1.25배로 압력을 가하고 24-48시간 유지합니다. 챔버별 압력 강하가 기록됩니다. 합격/불합격 기준이 문서화됩니다. 선체 일련번호에 연결됩니다.
      icon: tabler:gauge
    - title: '단계 6: 최종 검사'
      description: 치수 정확성, 외관 마감, 부속품 완전성, 문서 패키지, 포장 상태를 포함한 100점 품질 점검표. 생산 팀과 독립적임.
      icon: tabler:clipboard-check
    - title: '단계 7: 준수 문서화'
      description: 모델별 DoC, 빌더 플레이트 검증, 소유자 매뉴얼 완전성 및 HIN 등록 항목. 모든 준수 문서는 출하 전 준비 및 검증됩니다.
      icon: tabler:file-certificate
    - title: '단계 8: 출하 승인 및 추적 가능성'
      description: 최종 출시는 모든 QC 단계 통과, 준수 문서 완료, 배송 문서 검증이 필요합니다. 선체 기록은 종료되어 10+년 동안 보관됩니다.
      icon: tabler:truck
content_traceability:
  tagline: 생산 추적성
  title: HIN → 마스터 파일 →<br />선체 기록 → 납품
  subtitle: 모든 RIB 보트에는 전체 생산 및 준수 기록 체인과 연결된 고유한 선체 식별 번호가 부여됩니다.
  items:
    - title: 선체 식별 번호 (HIN)
      description: 각 보트에 영구적으로 표시된 14자리 고유 식별자. 제조업체 코드(MIC), 모델 표시, 생산 연도 및 시리얼 번호를 암호화합니다. 전체 추적 가능성 체인을 열 수 있는 열쇠입니다.
      icon: tabler:hash
    - title: 마스터 기술 파일
      description: 모델 패밀리의 규정 준수 및 엔지니어링 문서입니다. GA 도면, 위험도 평가, 안정성 계산, 재료 사양 및 적용 가능한 기준이 포함되어 있습니다. 해당 모델의 모든 선체와 연결되어 있습니다.
      icon: tabler:folder
    - title: 개별 선체 기록
      description: '선체별 생산 기록: HIN, 생산일, 튜브 배치, 자재 증명서, 압력 시험 결과, 최종 구성, 엔진 사양, 품질 체크리스트 결과, 배송지. 선체당 21개의 데이터 필드.'
      icon: tabler:file-description
    - title: 고객 컴플라이언스 팩
      description: DoC, 제작사 플레이트 사진, 사용자 매뉴얼, 준수 체크리스트, 최종 구성 시트를 포함한 선체별 배송 패키지. 보트와 함께 배송되며 공장에서 10+년 동안 보관됩니다.
      icon: tabler:package
content_red_flags:
  tagline: 감사 함정
  title: 적신호 구매자<br />쉽게 찾다
  subtitle: 공장 감사 중 구매자의 신뢰를 약화시키는 일반적인 문제들. 우리는 각 문제를 선제적으로 해결합니다.
  items:
    - title: CE 모델 범위 없는 일괄적 청구
      description: '"모든 제품 CE 이 인증됨"이지만 어떤 지침, 어떤 모델, 어떤 적합성 모듈인지 명시하지 않습니다. 경고 신호: 준수가 모델별, 구성별로 이루어지지 않고 피상적임을 시사합니다.'
      icon: tabler:alert-triangle
    - title: 신체 검사 증거 없음
      description: '공장 바닥에 테스트 기록, 게이지, 테스트 스테이션이 보이지 않는 압력 테스트 주장. 경고 신호: 방문 중에 품질 주장을 확인할 수 없습니다.'
      icon: tabler:alert-triangle
    - title: 누락된 물질 추적성
      description: '배치 기록도 없고, 들어오는 검사도 없으며, 자재 증명서와 완제품 간의 연관성도 없습니다. 경고 신호: 품질 문제를 출처로 추적할 방법이 없습니다.'
      icon: tabler:alert-triangle
    - title: 일반 문서
      description: "모든 모델을 아우르는 하나의 DoC, HIN에 특화된 기록이나 '템플릿' 준수 문서는 없습니다. 경고 신호: 준수는 개별 생산 단위에 국한되지 않습니다."
      icon: tabler:alert-triangle
content_shipping:
  tagline: 배송 및 포장
  title: RIB 보트 컨테이너<br />적재 및 포장
  subtitle: 저희 배송 솔루션은 칭다오에서 목적지 항구까지 귀하의 투자를 보호합니다. 모든 모델에 대해 컨테이너 적재 계획과 케이지 사양이 제공됩니다.
  items:
    - title: 20피트 컨테이너 구성
      description: '표준 20피트 컨테이너: RIB 1-2척(4.0-5.5m)의 보트가 중첩되어 있고 갑판과 튜브가 분리되어 있으며, 또는 8-12개의 SUP 보드. 혼합 RIB + SUP 구성 제공. 주문마다 상세한 적재 계획이 제공됩니다.'
      icon: tabler:box
    - title: 40피트 컨테이너 구성
      description: '표준 40피트 컨테이너: 선체가 중첩되고 튜브를 쌓은 2-4척(최대 RIB 7.0m) 또는 20-30개의 SUP 보드. 키 큰 모델에는 40피트 HQ 제공 RIB . 부피 최적화된 포장은 단위당 운송 비용을 절감합니다.'
      icon: tabler:container
    - title: 선체용 나무 상자 RIB
      description: 알루미늄 및 GRP 선체는 맞춤형 목재 상자에 담겨 폼 패딩, 습기 차단, 강철 밴딩이 적용되었습니다. 물류 계획을 위해 모델별 크레이트 크기와 무게가 제공됩니다. ISPM-15 열처리목재 인증 포함.
      icon: tabler:wood
    - title: 튜브 및 데크 분리 패킹
      description: 튜브는 공간 효율성을 위해 선체와 분리되어 공기를 빼고 접혔다. 갑판, 콘솔, 좌석은 보호 포장에 장착 하드웨어 키트와 함께 포장되었다. 모든 배송에 재조립 지침이 포함되어 있다.
      icon: tabler:package
    - title: 습기 및 부식 방지
      description: 알루미늄 부품용 VCI 방부식지, 실리카 젤 건조제 팩, 진공 밀봉 하드웨어 백. 30-45일 해상 운송 중 결로 피해를 방지합니다.
      icon: tabler:droplet-off
    - title: FOB 칭다오 문서
      description: 선하증권, 상업 송장, 포장 목록, 원산지 증명서, 선적별 준수 문서. FCL 및 LCL 통합 지원 가능. EU, 미국, 중동 시장을 위한 세관 문서 지원.
      icon: tabler:file-text
content_audit_evidence:
  tagline: 검증 증거
  title: 감사 증거<br />현장에서 확인할 수 있습니다
  subtitle: 공장 방문 시 고객은 각 생산 구역에서 구체적인 증거를 확인할 수 있습니다. 다음은 주의해야 할 사항과 매 감사를 위해 준비하는 사항입니다.
  areas:
    - area: 원자재 창고
      what_to_verify: 재료가 안정적인가요? 배치 혼합이 있나요?
      evidence: 입고 검사 기록, 배치 라벨, 선입선출(FIFO) 보관, 공급업체 승인 목록, 재료 증명서 (PVC, Hypalon, 유리섬유, 알루미늄, 접착제, 하드웨어)
      icon: tabler:building-warehouse
    - area: 튜브 생산
      what_to_verify: 이음부 강도와 기밀성은 어떻게 보장되나요?
      evidence: 공정 카드, 시제품 확인, 챔버별 압력 테스트 기록, 수리 및 재테스트 로그, 밸브 설치 기록
      icon: tabler:flame
    - area: 선체 생산
      what_to_verify: 구조적 일관성은 어떻게 관리되나요?
      evidence: 관리된 공정 문서, 품질 점검 포인트, 반제품 번호 부여, 젤코트 두께 측정, 적층 일정 검증
      icon: tabler:layers-subtract
    - area: 조립 구역
      what_to_verify: 선택 부품의 오조립을 어떻게 방지하나요?
      evidence: BOM, 작업 지시서, 구성 체크리스트, 작업대 검사 카드, 모델별 토크 및 기능 점검
      icon: tabler:tool
    - area: 테스트 스테이션
      what_to_verify: 출고 전 보트가 정상임을 어떻게 확인하나요?
      evidence: 시험 절차, 계측기 목록, 교정 기록, 압력 테스트 기록(1.25배 / 24-48시간), 기능 테스트 체크리스트, 합격/불합격 기준 문서화
      icon: tabler:gauge
    - area: 비적합 구역
      what_to_verify: 결함은 어떻게 처리되나요?
      evidence: 격리 라벨, NCR 로그, 근본 원인 분석, 재작업 승인 기록, CAPA(시정 및 예방조치) 추적
      icon: tabler:alert-triangle
    - area: 완제품 창고
      what_to_verify: 오배송과 손상을 어떻게 방지하나요?
      evidence: 완제품 라벨, 주문 일치 기록, 포장 기준, 출하 전 검사 기록
      icon: tabler:box
    - area: 예비 부품 및 애프터 서비스
      what_to_verify: 장기 사후지원이 가능한가요?
      evidence: 일반 예비 부품 목록, 재고 전략, 부품 번호 체계, 보증 절차 문서, 유지보수 안내
      icon: tabler:headset
content_closing_script:
  tagline: 주문 감사를 위한 절차
  title: 공장 방문에서<br />확정된 프로젝트까지
  subtitle: 성공적인 감사는 사진과 악수로 끝나지 않습니다. 떠나기 전에 세 가지 상업적 결과가 문서화되는 것을 확인합니다.
  items:
    - title: 기술 구성 확인
      description: 모델, 용도, 주요 옵션, 목표 시장, 예상 수량, 납기 일정에 대해 합의 — 모두 출발 전에 문서화해야 합니다.
      icon: tabler:checklist
    - title: 다음 단계 문서 확인
      description: 'Paddle Board Overstock가 제공하는 내용을 다음과 같이 정의합니다: 수정된 GA, 구성 목록, 견적서, 문서 체크리스트, 샘플 계획, 또는 NDA — 구체적인 일정 포함.'
      icon: tabler:file-plus
    - title: 상호 일정 확인
      description: 수정된 구성 및 예비 견적서는 3근무일 이내에 제공됩니다. 샘플 또는 외관 확인은 7일 이내에 완료됩니다. 엔지니어링 검토 또는 제3자 검사는 14일 이내에 이루어집니다. 다음 회의 날짜와 책임자는 확정됩니다.
      icon: tabler:calendar
faq:
  title: 공장 감사 — 자주 묻는 질문
  questions:
    - q: 직접 공장을 방문할 수 있나요?
      a: 예. 우리는 청도 12,000 m² 시설에서 현장 공장 감사를 환영합니다. 표준 투어는 원자재 창고부터 문서 검토실까지 8개 스테이션을 포함합니다. 초기 자격 심사에서는 화상 통화를 통한 가상 공장 투어도 가능합니다.
    - q: 제3자 감사(BSCI, SMETA, SGS)를 수용하나요?
      a: 예. 우리는 BSCI 인증(Intertek)을 유지하며 고객별 감사 프로토콜도 환영합니다. 요청 시 SGS 또는 TÜV 검사를 주선할 수도 있습니다. 감사 보고서는 NDA에서 확인 가능합니다.
    - q: 방문 중 압력 테스트를 볼 수 있나요?
      a: 압력 테스트 스테이션은 표준 투어 경로에 포함됩니다. 생산 일정에 따라 게이지 판독 및 테스트 기록과 함께 진행 중인 압력 테스트를 관찰할 수 있습니다. 선체별 압력 테스트 기록은 항상 검토 가능합니다.
    - q: 부적합 제품은 어떻게 처리하나요?
      a: 부적합 제품은 분리, 문서화되고, ISO 9001 시정 조치 프로세스에 따라 검토됩니다. 근본 원인 분석을 수행하고, 시정 조치를 실행하며, 기록을 유지합니다. 구매자는 감사 중에 NCR 로그를 검토할 수 있습니다.
    - q: 검토 가능한 준수 문서는 무엇인가요?
      a: '감사 중에는 다음을 검토할 수 있습니다: 모델별 DoC 샘플, 빌더 플레이트 사양, HIN 등록, 사용자 매뉴얼 초안, 적용 표준 목록, 모델 가족별 적합성 평가 기록.'
    - q: 가상 공장 투어는 어떻게 예약하나요?
      a: 영업팀에 연락하여 WhatsApp, Zoom 또는 Teams를 통해 실시간 화상 투어를 예약하세요. 동일한 8개 스테이션 경로를 따르며 관심 분야에 따라 특정 영역에 집중할 수 있습니다. 일반적인 가상 투어는 45~60분입니다.
    - q: 공장은 실제 제조사인가요, 아니면 무역 회사인가요?
      a: Paddle Board Overstock은 실제 제조사입니다. 우리는 청도 라이시 공장을 운영합니다. 사업자 등록, 제조 범위, 실제 생산 모두 감사 중 검증 가능합니다.
    - q: 검토할 수 있는 품질 기록은 무엇인가요?
      a: 입고 자재 검사 기록, 공정 중 QC 체크포인트, 압력 테스트 기록, 100점 최종 검사 체크리스트, 부적합 보고서, 시정 조치 기록, 선체별 추적 기록. 모두 ISO 9001 요건에 따라 유지됩니다.
