content_priorities:
  tagline: What Clients Verify
  title: '8 Things Buyers Verify<br />at Every Factory Visit'
  subtitle: 'Based on feedback from 50+ country buyers, these are the eight priorities clients assess before placing a B2B order.'
  items:
    - title: 'Real Manufacturer'
      description: 'Are you the actual factory, not a trading company? Buyers check: business entity, real production equipment, employees operating machines, current production orders on the floor, and website-workshop consistency.'
      icon: tabler:building-factory
    - title: 'Product Fit for Application'
      description: 'Does the RIB match their specific use case? Resort, rescue, diving, fishing, and patrol operators have fundamentally different requirements. Buyers evaluate deck layout, tube material, and equipment options on the displayed boat.'
      icon: tabler:target
    - title: 'Quality Stability & Reproducibility'
      description: 'Is the 50th unit as good as the 1st? Buyers examine QC systems, in-process checkpoints, non-conformance handling, and ask to see records from multiple production runs to verify consistency.'
      icon: tabler:repeat
    - title: 'Compliance Document Authenticity'
      description: 'Are CE certificates model-specific? Is the DoC signed by a real person? Can compliance be verified per hull number? Buyers check for blanket claims vs. model-specific documentation.'
      icon: tabler:file-certificate
    - title: 'Customization Execution'
      description: 'Can the factory actually deliver custom configurations? Buyers look for evidence of past custom projects, prototype samples on display, engineering drawings, and the ability to discuss technical modifications on the spot.'
      icon: tabler:adjustments
    - title: 'Lead Time & Capacity'
      description: 'Are quoted timelines realistic? Buyers assess: current production volume, available capacity, workforce size, material stock levels, and whether the factory has a production planning system.'
      icon: tabler:clock
    - title: 'Price & Trade Terms'
      description: 'Are prices transparent? Is FOB pricing clear? Buyers verify: unit price breakdown, tooling costs, packaging costs, and whether the factory can handle DDP or CIF terms with proper export documentation.'
      icon: tabler:currency-dollar
    - title: 'After-Sales & Spare Parts'
      description: 'What happens after delivery? Buyers evaluate: spare parts availability, warranty process, replacement tube sections, valve replacement, and whether the factory has a documented after-sales protocol.'
      icon: tabler:headset

content_tour:
  tagline: Factory Tour Route
  title: 'Audit Tour —<br />What You Will See'
  subtitle: 'Our standard factory tour follows a defined route designed to answer buyer questions at every station.'
  items:
    - title: '1. Meeting Room — Company Introduction'
      description: 'Business license, ISO 9001 and BSCI certificates, export licenses, and company history. Quick overview of production capabilities and compliance scope.'
      icon: tabler:users
    - title: '2. Raw Material Warehouse — IQC Station'
      description: 'Incoming material inspection records, fabric batch certificates, adhesives and hardware samples. See how materials are tested before entering production.'
      icon: tabler:building-warehouse
    - title: '3. Tube Fabrication — RF Welding & Hand Gluing'
      description: 'Live tube welding or gluing process, seam strength test demonstrations, and valve installation. Observe chamber-by-chamber construction and quality checkpoints.'
      icon: tabler:flame
    - title: '4. Hull Lamination — GRP Workshop'
      description: 'Fiberglass layup process, gelcoat application, and hull curing. See the lamination schedule and structural reinforcement for different RIB models.'
      icon: tabler:layers-subtract
    - title: '5. Assembly & Integration'
      description: 'Hull-tube joining, console and seat installation, electrical and fuel system integration, and equipment mounting. Observe the production line in operation.'
      icon: tabler:tool
    - title: '6. Pressure Testing Station'
      description: '24-48h pressure hold test at 1.25x rated pressure. View test records, pressure gauges, and pass/fail criteria. See how test results are linked to hull serial numbers.'
      icon: tabler:gauge
    - title: '7. Final Inspection & QC'
      description: '100-point quality checklist per unit, dimensional verification, cosmetic inspection, and packaging integrity check. Review non-conformance logs and corrective action records.'
      icon: tabler:clipboard-check
    - title: '8. Document Review Room'
      description: 'Compliance documentation per model (DoC, builder plate, owner manual), production traceability records, HIN registry, and material batch tracking database demonstration.'
      icon: tabler:folder

content_qc_chain:
  tagline: Quality Evidence
  title: '8-Stage QC Chain<br />— Verifiable at Every Step'
  subtitle: 'Our quality control chain runs from incoming materials to final shipment, with documented evidence at every stage.'
  items:
    - title: 'Stage 1: Incoming Material Inspection'
      description: 'Every batch of PVC, Hypalon, fiberglass, aluminum, adhesives, and hardware is tested against specifications before entering production. Tensile strength, coating adhesion, and dimensional checks per AQL 2.5/ISO 2859.'
      icon: tabler:package
    - title: 'Stage 2: Tube Welding / Gluing QC'
      description: 'Seam peel strength testing per production batch. RF weld parameters monitored and recorded. Hand-glued seams checked for consistent adhesive coverage and cure time.'
      icon: tabler:flame
    - title: 'Stage 3: Hull Lamination QC'
      description: 'Gelcoat thickness measurement, fiberglass layup verification per laminate schedule, and cure time monitoring. Structural reinforcement positions verified against engineering drawings.'
      icon: tabler:layers-subtract
    - title: 'Stage 4: Assembly & Integration QC'
      description: 'Hull-tube joint integrity, console and seat mounting torque, electrical continuity, and fuel system leak test. Each installation point verified against the model-specific assembly checklist.'
      icon: tabler:tool
    - title: 'Stage 5: Pressure Hold Test'
      description: 'Every inflatable chamber pressurized to 1.25x rated PSI and held for 24-48 hours. Pressure drop recorded per chamber. Pass/fail threshold documented. Linked to hull serial number.'
      icon: tabler:gauge
    - title: 'Stage 6: Final Inspection'
      description: '100-point quality checklist covering dimensional accuracy, cosmetic finish, accessory completeness, documentation package, and packaging integrity. Independent from production team.'
      icon: tabler:clipboard-check
    - title: 'Stage 7: Compliance Documentation'
      description: 'Model-specific DoC, builder plate verification, owner manual completeness, and HIN registry entry. All compliance documents prepared and verified before shipment release.'
      icon: tabler:file-certificate
    - title: 'Stage 8: Shipment Release & Traceability'
      description: 'Final release requires all QC stages passed, compliance documentation complete, and shipping documentation verified. Hull record closed and archived for 10+ year retention.'
      icon: tabler:truck

content_traceability:
  tagline: Production Traceability
  title: 'HIN → Master File →<br />Hull Record → Delivery'
  subtitle: 'Every RIB boat carries a unique Hull Identification Number linked to a complete production and compliance record chain.'
  items:
    - title: 'Hull Identification Number (HIN)'
      description: '14-character unique identifier permanently marked on each boat. Encodes manufacturer code (MIC), model designation, production year, and serial number. The key that unlocks the full traceability chain.'
      icon: tabler:hash
    - title: 'Master Technical File'
      description: 'The compliance and engineering documentation for the model family. Contains GA drawings, risk assessment, stability calculations, material specifications, and applicable standards. Linked to all hulls of that model.'
      icon: tabler:folder
    - title: 'Individual Hull Record'
      description: 'Per-hull production record: HIN, production date, tube batch, material certificates, pressure test result, final configuration, engine specification, quality checklist results, and delivery destination. 21+ data fields per hull.'
      icon: tabler:file-description
    - title: 'Customer Compliance Pack'
      description: 'Per-hull delivery package including DoC, builder plate photo, owner manual, compliance checklist, and final configuration sheet. Shipped with the boat and archived at the factory for 10+ years.'
      icon: tabler:package

content_red_flags:
  tagline: Audit Pitfalls
  title: 'Red Flags Buyers<br />Easily Spot'
  subtitle: 'Common issues that undermine buyer confidence during factory audits. We proactively address each one.'
  items:
    - title: 'Blanket CE Claims Without Model Scope'
      description: '"All products CE certified" without specifying which directive, which models, and which conformity module. Red flag: suggests compliance is superficial rather than per-model, per-configuration.'
      icon: tabler:alert-triangle
    - title: 'No Physical Testing Evidence'
      description: 'Pressure test claims without test records, gauges, or test station visible on the factory floor. Red flag: quality claims cannot be verified during the visit.'
      icon: tabler:alert-triangle
    - title: 'Missing Material Traceability'
      description: 'No batch records, no incoming inspection, or no link between material certificates and finished products. Red flag: no way to trace quality issues to source.'
      icon: tabler:alert-triangle
    - title: 'Generic Documentation'
      description: 'One DoC covering all models, no HIN-specific records, or "template" compliance documents. Red flag: compliance is not tied to individual production units.'
      icon: tabler:alert-triangle

content_shipping:
  tagline: Shipping & Packaging
  title: 'RIB Boat Container<br />Loading & Crating'
  subtitle: 'Our shipping solutions protect your investment from Qingdao to destination port. Container loading plans and crating specifications available for every model.'
  items:
    - title: '20ft Container Configurations'
      description: 'Standard 20ft container: 1-2 RIB boats (4.0-5.5m) nested with deck and tubes separated, or 8-12 SUP boards. Mixed RIB + SUP configurations available. Detailed loading plan provided per order.'
      icon: tabler:box
    - title: '40ft Container Configurations'
      description: 'Standard 40ft container: 2-4 RIB boats (up to 7.0m) with hulls nested and tubes stacked, or 20-30 SUP boards. 40ft HQ available for taller RIB models. Volume-optimized packing reduces per-unit shipping cost.'
      icon: tabler:container
    - title: 'Wooden Crating for RIB Hulls'
      description: 'Aluminum and GRP hulls crated in custom-fit wooden crates with foam padding, moisture barrier, and steel banding. Crate dimensions and weight per model available for logistics planning. ISPM-15 heat-treated wood certification included.'
      icon: tabler:wood
    - title: 'Tube & Deck Separation Packing'
      description: 'Tubes deflated and folded separately from hulls for space efficiency. Deck plates, consoles, and seats packed in protective wrapping with mounting hardware kits. Reassembly instructions included with every shipment.'
      icon: tabler:package
    - title: 'Moisture & Corrosion Protection'
      description: 'VCI anti-corrosion paper for aluminum components, silica gel desiccant packs, and vacuum-sealed hardware bags. Prevents condensation damage during 30-45 day ocean transit.'
      icon: tabler:droplet-off
    - title: 'FOB Qingdao Documentation'
      description: 'Bill of Lading, Commercial Invoice, Packing List, Certificate of Origin, and compliance documentation per shipment. FCL and LCL consolidation available. Customs documentation support for EU, US, and Middle East markets.'
      icon: tabler:file-text

content_audit_evidence:
  tagline: Verification Evidence
  title: 'Audit Evidence<br />You Can Verify On-Site'
  subtitle: 'During factory visits, clients can verify specific evidence at each production area. Here is what to look for — and what we prepare for every audit.'
  areas:
    - area: 'Raw Material Warehouse'
      what_to_verify: 'Are materials stable? Is there batch mixing?'
      evidence: 'Incoming inspection records, batch labels, FIFO storage, supplier approval list, material certificates (PVC, Hypalon, fiberglass, aluminum, adhesives, hardware)'
      icon: tabler:building-warehouse
    - area: 'Tube Production'
      what_to_verify: 'How is seam strength and air-tightness guaranteed?'
      evidence: 'Process cards, first-article confirmation, pressure test records per chamber, repair and retest logs, valve installation records'
      icon: tabler:flame
    - area: 'Hull Production'
      what_to_verify: 'How is structural consistency controlled?'
      evidence: 'Controlled process documents, quality checkpoints, semi-finished product numbering, gelcoat thickness measurements, lamination schedule verification'
      icon: tabler:layers-subtract
    - area: 'Assembly Area'
      what_to_verify: 'How are optional parts prevented from mis-assembly?'
      evidence: 'BOM, work orders, configuration checklists, workstation inspection cards, torque and functional checks per model'
      icon: tabler:tool
    - area: 'Testing Station'
      what_to_verify: 'How do you confirm the boat is good before delivery?'
      evidence: 'Test procedures, instrument list, calibration records, pressure test logs (1.25x / 24-48h), functional test checklists, pass/fail criteria documented'
      icon: tabler:gauge
    - area: 'Non-Conformance Area'
      what_to_verify: 'How are defects handled?'
      evidence: 'Isolation labels, NCR logs, root cause analysis, rework approval records, CAPA (Corrective and Preventive Action) tracking'
      icon: tabler:alert-triangle
    - area: 'Finished Goods Warehouse'
      what_to_verify: 'How do you prevent mis-shipment and damage?'
      evidence: 'Finished product labels, order matching records, packaging standards, pre-shipment inspection records'
      icon: tabler:box
    - area: 'Spare Parts & After-Sales'
      what_to_verify: 'Can you support long-term after-sales?'
      evidence: 'Common spare parts list, inventory strategy, part numbering system, warranty process documentation, maintenance tutorials'
      icon: tabler:headset

content_closing_script:
  tagline: Audit to Order
  title: 'From Factory Visit<br />to Confirmed Project'
  subtitle: 'A successful audit should not end with photos and a handshake. Before leaving, we ensure three commercial outcomes are documented.'
  items:
    - title: 'Confirm Technical Configuration'
      description: 'Agree on model, application, key options, target market, estimated quantity, and delivery schedule — all documented before departure.'
      icon: tabler:checklist
    - title: 'Confirm Next-Step Documents'
      description: 'Define what Aquafarer provides next: revised GA, configuration list, quotation, document checklist, sample plan, or NDA — with specific timelines.'
      icon: tabler:file-plus
    - title: 'Confirm Mutual Timeline'
      description: 'Revised configuration and preliminary quotation within 3 working days. Sample or appearance confirmation within 7 days. Engineering review or third-party inspection within 14 days. Next meeting date and responsible parties locked.'
      icon: tabler:calendar

faq:
  title: Factory Audit — Frequently Asked Questions
  questions:
    - q: Can I visit the factory in person?
      a: 'Yes. We welcome on-site factory audits at our 12,000 m² Qingdao facility. Our standard tour covers 8 stations from raw material warehouse to document review room. Virtual factory tours via video call are also available for initial qualification.'
    - q: Do you accept third-party audits (BSCI, SMETA, SGS)?
      a: 'Yes. We maintain BSCI certification (Intertek) and welcome customer-specific audit protocols. We can also arrange SGS or TÜV inspections on request. Audit reports are available under NDA.'
    - q: Can I see pressure testing during the visit?
      a: 'Our pressure testing station is part of the standard tour route. Depending on production schedule, you may observe active pressure tests with gauge readings and test records. Pressure test logs per hull are always available for review.'
    - q: How do you handle non-conforming products?
      a: 'Non-conforming units are segregated, documented, and reviewed per our ISO 9001 corrective action process. Root cause analysis is performed, corrective actions are implemented, and records are maintained. Buyers can review our NCR log during audits.'
    - q: What compliance documentation is available for review?
      a: 'During the audit, you can review: model-specific DoC samples, builder plate specifications, HIN registry, owner manual drafts, applicable standards lists, and conformity assessment records per model family.'
    - q: How do I book a virtual factory tour?
      a: 'Contact our sales team to schedule a live video tour via WhatsApp, Zoom, or Teams. We follow the same 8-station route and can focus on specific areas based on your interests. Typical virtual tour is 45-60 minutes.'
    - q: Is the factory the actual manufacturer or a trading company?
      a: 'Aquafarer is the actual manufacturer. We operate the factory in Laixi, Qingdao. Business license, manufacturing scope, and physical production are all verifiable during the audit.'
    - q: What quality records can I review?
      a: 'Incoming material inspection records, in-process QC checkpoints, pressure test logs, 100-point final inspection checklists, non-conformance reports, corrective action records, and per-hull traceability records. All maintained per ISO 9001 requirements.'

