content_challenge:
  tagline: The Challenge
  title: 'Offshore Energy Demands<br />Extreme-Environment Reliability'
  subtitle: 'Offshore energy operations push equipment to the limit — extreme weather, remote locations, continuous duty cycles, and zero tolerance for failure.'
  paragraphs:
    - 'The offshore energy industry operates in the most demanding marine environments on earth. Workboats support oil and gas platforms, wind turbine installations, subsea cable operations, and marine construction projects — often in open ocean conditions with limited weather windows. Equipment failure is not just costly, it is dangerous.'
    - '**Safety is the highest priority** — Crew transfer vessels must operate safely in sea states that would stop other operations. Stability at the point of transfer, reliable engine performance in all weather, and robust construction for repeated docking against offshore structures are mandatory requirements.'
    - '**All-weather capability is essential** — Offshore wind farms and oil platforms operate year-round. Workboats must perform in heavy seas, strong winds, and restricted visibility. Day and night operations demand full navigation suites and reliable lighting systems.'
    - '**The offshore wind sector is growing rapidly** — Thousands of new turbines are being installed globally, each requiring regular crew transfer, tooling transport, and maintenance support. This creates sustained demand for purpose-built crew transfer vessels (CTVs) and support RIBs.'
    - 'Paddle Board Overstock offshore energy RIBs are engineered with reinforced deep-V hulls, heavy-duty Hypalon tubes, full navigation suites, and safety systems designed for the extreme conditions of offshore energy operations.'
content_solution:
  tagline: Our Solution
  title: 'Purpose-Built Offshore RIBs<br />For the Energy Industry'
  subtitle: 'Every Paddle Board Overstock offshore energy RIB is designed for safe, reliable operation in extreme marine conditions — from the North Sea to Southeast Asia.'
  list:
    - 'Reinforced deep-V hull for rough-water performance and predictable handling'
    - 'Heavy-duty Hypalon tubes with UV and chemical resistance for extended offshore service'
    - '316 stainless steel hardware — no corrosion in continuous saltwater exposure'
    - 'Full navigation suite: GPS, radar, VHF, night navigation lights — standard on offshore models'
    - 'Self-bailing deck for safe operation in boarding sea conditions'
    - 'Multiple engine configurations — single or twin outboard for mission redundancy'
    - 'Tow post and heavy-duty cleats for platform and buoy handling'
    - 'High-visibility tube colors for identification in offshore worksites'
content_segments:
  tagline: Energy Profiles
  title: 'Offshore Energy Solutions<br />By Application Type'
  subtitle: 'Different offshore energy sectors have unique workboat requirements — from platform support RIBs to wind farm CTVs to subsea inspection vessels.'
  items:
    - title: Offshore Oil & Gas Platform Support
      subtitle: 'Crew transfer, equipment supply, platform safety standby'
      description: 'Oil and gas platforms require daily crew changeover, equipment and supply transport, and safety standby coverage. Workboats must operate safely around platform structures, in strong currents and variable sea states, and maintain precise station-keeping during personnel transfer via ladder or gangway. The extreme environment — hydrocarbons, chemicals, constant salt spray — demands corrosion-resistant construction and reliable performance.'
      features:
        - 'Crew transfer configuration with safe boarding access and handrails'
        - 'Corrosion-resistant Hypalon tubes and 316 stainless steel hardware'
        - 'Reinforced rubbing strakes for frequent platform fender contact'
        - 'Self-bailing deck for oily water and chemical wash-down'
        - 'High-capacity fuel tank for extended offshore operating range'
        - 'Twin-engine option for mission-critical redundancy'
    - title: Offshore Wind Farm Operations
      subtitle: 'Crew transfer, turbine maintenance, tooling transport'
      description: 'Offshore wind is the fastest-growing sector in marine energy. Operators need crew transfer vessels (CTVs) that can safely transfer technicians to turbine access platforms in sea states up to 1.5m significant wave height. Stability during transfer, all-weather capability, and reliable daily operation are critical. Wind farm service vessels operate on tight schedules — any downtime delays turbine commissioning or maintenance, directly affecting energy production revenue.'
      features:
        - 'Optimized hull form for stable crew transfer at turbine base'
        - 'Deep-V entry for comfortable ride in offshore chop and swell'
        - 'Full weather protection — enclosed console or wheelhouse for crew comfort'
        - 'Deck space for tooling, spare parts, and service equipment'
        - 'Night operations package for extended daylight-limited winter shifts'
        - 'Quiet outboard operation for minimal noise impact on marine environment'
    - title: Subsea Cable & Pipeline Support
      subtitle: 'Inspection, maintenance, ROV support, survey'
      description: 'Subsea cable and pipeline operators need workboats for route inspection, maintenance support, ROV operations, and survey tasks. These vessels require stable platforms for deploying and recovering underwater equipment, precise low-speed maneuvering for cable tracking, and reliable operation in coastal and offshore environments. Boat stability is critical for sonar and survey equipment accuracy.'
      features:
        - 'Stable platform at slow speed for cable tracking and survey operations'
        - 'Open deck layout for ROV deployment, cable spools, and survey gear'
        - 'Equipment mounting plates for sonar, GPS, and survey instrumentation'
        - 'Low-wake hull design for minimal seabed disturbance during inspection'
        - 'Precision low-speed maneuvering with responsive outboard steering'
    - title: Marine Engineering & Construction Support
      subtitle: 'Personnel transport, material supply, diving support'
      description: 'Marine engineering contractors working on port construction, coastal protection, and offshore installation projects need versatile workboats for personnel transport between construction vessels and shore, material and tool supply, diving support, and site surveys. These boats operate in active construction zones with multiple vessels, restricted maneuvering space, and variable sea conditions. Durability and versatility are paramount.'
      features:
        - 'Multi-purpose deck layout for personnel, materials, and dive equipment'
        - 'Dive ladder and equipment mounting for diving support operations'
        - 'Heavy-duty cleats and tow post for construction site maneuvering'
        - 'Rugged Hypalon construction for construction debris and abrasion resistance'
        - 'Flexible seating configurations — crew transport or cargo mode'
