overview_section:
  tagline: Market Overview
  title: The Thai SUP Market
  paragraphs:
    - Thailand's island tourism economy is one of Asia's most established. Phuket's beaches and beach clubs, the dramatic limestone bays of Krabi and Phi Phi, Koh Samui's resort coastline, and Pattaya's weekend crowd create year-round demand for on-water activities — and stand-up paddle is a staple: sunrise paddles in flat bays, lagoon tours, hotel guest programs, and SUP yoga classes that photograph beautifully against limestone karsts.
    - Buyers are typically established tourism businesses: beach clubs running activity programs, island resorts equipping guest experiences, longtail and speedboat tour operators adding a paddle stop, and rental operators on busy beaches. Monsoon-season seasonality on the Andaman coast makes flexible small-batch ordering — 5–20 boards at a time — the practical choice over container-loads.
  customer_types:
    - title: Beach Clubs & Resorts
      description: Phuket and Koh Samui beach clubs and resorts running guest paddle programs with compact mixed fleets.
    - title: Tour Operators
      description: Krabi, Phi Phi, and Phang Nga operators adding paddle stops to island and lagoon tours.
    - title: Rental Operators
      description: Beach rental stands and schools refreshing boards on a seasonal replacement cycle.
shipping_section:
  title: Ship to Thailand
  paragraphs:
    - Thailand is one of the shortest freight lanes from our Weihai, China base. Express air freight carries samples and 1–3 board orders fast into Bangkok and Phuket; consolidated sea freight serves 5–20 board wholesale orders through Laem Chabang and regional ports. Transit estimates for your destination are included in your quote.
    - We provide the commercial invoice and packing list clearance requires, with correct HS codes and declared values. Import duties and taxes are payable by the importer under Thai rules.
  customs_note: Thai customs processes for sports equipment are well established — confirm current duty and tax treatment with your broker before ordering. We provide complete, consistent documentation for smooth clearance.
faq_section:
  title: Thailand FAQ
  items:
    - q: How fast is freight from China to Thailand?
      a: Thailand is one of our closest freight destinations from Weihai. Express air into Bangkok or Phuket is the fastest option for samples and small orders; consolidated sea freight to Laem Chabang is quoted with a transit window for wholesale orders. Both are itemized in your quote.
    - q: What does a beach club starter order look like?
      a: "Typically 5–15 boards: stable all-around models for guest lessons and rentals, plus one or two premium art editions for the beachfront look. Mixed models, one shipment, priced by total quantity."
    - q: Do the boards suit limestone-bay and lagoon tours?
      a: Yes — calm, sheltered bays are exactly what all-around inflatable SUP boards are built for, and the durable drop-stitch construction and flexible fin handle beach and pontoon landings well.
    - q: Can we order ahead of high season?
      a: Yes — many Thai operators schedule wholesale deliveries ahead of the November–April Andaman high season. Send your target mix and timing in the inquiry and we will plan freight accordingly.
