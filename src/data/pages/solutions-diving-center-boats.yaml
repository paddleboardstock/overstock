content_dive_resorts:
  tagline: For Dive Resorts
  title: 'Premium Dive RIBs<br />For Resort Hospitality Operations'
  subtitle: 'Luxury diving RIBs designed for guest comfort, brand image, and peak season capacity — where the boat experience matters as much as the dive itself.'
  paragraphs:
    - 'Dive resorts are fundamentally different from commercial diving centers. Your guests are tourists paying for a complete premium experience — and the boat is a key part of that experience. A functional workboat that looks industrial or uncomfortable creates a noticeable gap between resort quality and the on-water experience.'
    - '**The experience gap problem** — A guest staying in a five-star suite with fine dining and professional service should not step onto an aging aluminum boat with hard benches and no shade. That contrast damages the luxury perception your resort has carefully built. The boat is not just transportation — it is a mobile extension of your brand.'
    - '**Brand image as a competitive advantage** — Every dive trip is a brand touchpoint. A premium RIB with custom resort colors, integrated logos, and coordinated upholstery becomes a floating brand ambassador. Guests photograph it, share it on social media, and remember it. In competitive destinations like the Maldives, Bali, or the Caribbean, boat quality can be a deciding factor for repeat bookings.'
    - '**Comfort drives satisfaction and reviews** — Long rides to dive sites in tropical heat should be enjoyable, not exhausting. Premium seating with ergonomic backrests, T-top or Bimini sunshade protection, smooth boarding via wide dive ladders, and a stable platform at rest directly impact guest satisfaction scores, online reviews, and return rates. VIP guests, older travelers, and families are particularly sensitive to comfort.'
    - '**Peak season capacity and revenue** — During high season (Christmas, spring break, summer), dive operations may run 4-6 trips daily with back-to-back guest groups. You need a boat that can handle the intensity without compromising the experience. Fast turnaround, reliable operation, and minimal downtime directly affect revenue and reputation. A single boat outage during peak week can cost tens of thousands in lost bookings.'
    - '**Customization as a differentiator** — Aquafarer Premium Dive RIBs are fully customizable: resort-branded color schemes and hull graphics, custom logo placement, premium upholstery in resort colors, T-top or Bimini sunshade options, premium marine sound systems, non-slip teak-style EVA decking, integrated dive tank storage, and wide dive ladders with handrails. Your boat becomes a seamless part of the resort experience.'
    - '**The business case** — A premium RIB costs more upfront but delivers returns through higher guest satisfaction, stronger brand perception, increased repeat bookings, ability to charge premium rates, reduced maintenance downtime, and longer service life in tropical saltwater conditions. It is an investment in guest experience, not an operating expense.'
content_diving_profiles:
  tagline: Diving Center Profiles
  title: 'Diving Center Types<br />We Build For'
  subtitle: 'Different diving operations demand different boat configurations. We tailor every RIB to the specific needs of your diving business.'
  items:
    - title: Scuba Diving Schools & Training Centers
      subtitle: 'Recreational diving, certification courses, daily tourist trips'
      description: 'These centers operate year-round in tropical destinations, running multiple trips daily for international tourists and certification students. The boat is the center of daily operations — it must handle heavy equipment loads, frequent passenger boarding, and long hours in saltwater. Every hour of downtime means cancelled dives and lost revenue.'
      features:
        - 'Large working deck for 10-20 scuba tanks, BCDs, and passenger gear'
        - 'Wide dive ladder with stainless steel handrails for easy boarding'
        - 'Extra-wide Hypalon tubes for stable platform during diver entry/exit'
        - 'Non-slip EVA deck surface for safety when deck is wet'
        - 'Fuel-efficient 4-stroke engine configurations for 200+ days/year operation'
        - 'Heavy-duty PVC or Hypalon construction for tropical saltwater durability'
        - 'Tank storage racks integrated into deck layout, not retrofitted'
    - title: Commercial & Industrial Dive Operators
      subtitle: 'Port maintenance, underwater inspection, marine engineering'
      description: 'These professional operators work on marine infrastructure projects — port inspection, underwater repair, cable laying, and coastal engineering. Their boat is a mobile working platform, not just transportation. The crew needs space for tools, inspection equipment, and diving systems. Reliability is critical because project schedules are fixed and delays are costly.'
      features:
        - 'Enhanced stability for safe working conditions in open water'
        - 'Reinforced hull for heavy equipment loads and frequent operations'
        - 'Large open deck configured for tool storage and equipment preparation'
        - 'Professional seating for crew comfort during long offshore operations'
        - 'Engine redundancy options for operational safety'
        - 'Full navigation suite including GPS, sonar, and communication gear'
        - 'Custom dive platform and ladder configurations for industrial use'
    - title: Liveaboard Support & Expedition Tenders
      subtitle: 'Multi-day dive safaris, remote atoll expeditions, research support'
      description: 'Liveaboard operators and expedition teams need compact, reliable RIBs that can be launched and recovered daily. These boats serve as tenders for mother ships, transporting divers to reefs, shuttling equipment, and providing emergency support in remote locations. They must be robust enough for open-water crossings yet compact for deck storage.'
      features:
        - 'Compact design (4.5-5.5m) for davit launch and deck storage'
        - 'Reinforced hull for frequent beach landings and reef navigation'
        - 'Heavy-duty lifting points for daily crane or davit operations'
        - 'Diver ladder with low profile for easy water entry and exit'
        - 'Durable tube materials resistant to extended sun and salt exposure'
        - 'Fuel range for 50+ nautical miles between refueling'
        - 'Quick-inflate/deflate tube options for space-efficient storage'
    - title: Dive Resort & Hospitality Operations
      subtitle: 'Resort-based diving, VIP guest services, island transfers'
      description: 'These operators cater to tourists who expect a premium experience. The boat must balance operational efficiency with guest comfort and brand presentation. Unlike pure commercial operators, resort diving centers need boats that look good, ride comfortably, and reflect the property quality — while still handling daily dive operations reliably.'
      features:
        - 'Premium seating with ergonomic backrests for guest comfort'
        - 'T-top or Bimini sunshade protection for tropical sun exposure'
        - 'Custom color schemes and logo integration matching resort branding'
        - 'Wide dive ladder with handrails for easy guest boarding'
        - 'Teak-style EVA decking for premium appearance and non-slip safety'
        - 'Quiet engine configuration for minimal noise disturbance'
        - 'Integrated cooler storage for guest beverages and towels'
