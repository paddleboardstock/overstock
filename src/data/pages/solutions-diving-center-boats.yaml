content_challenge:
  tagline: The Challenge
  title: 'Why Dive Centers Need<br />Purpose-Built Boats'
  subtitle: 'Diving operations place unique demands on watercraft — requirements that general-purpose boats often fail to meet.'
  paragraphs:
    - 'Commercial diving centers operate 200-300 days per year, running 3-5 diving trips daily. Each trip requires transporting 10-20 scuba tanks, full BCD equipment, regulators, fins, masks, safety gear, instructor equipment, and passengers. A general-purpose boat simply cannot handle this operational intensity.'
    - '**Limited deck space** — Most recreational boats are designed for speed and passenger comfort, not equipment handling. When tanks, gear, and divers share the same space, preparation time increases, movement becomes difficult, and safety risks grow.'
    - '**Difficult diver boarding** — International tourists, first-time divers, and older travelers need safe, easy entry and exit. A high boarding position, limited hand support, and unstable platforms create discomfort and safety hazards — especially when divers are carrying 30kg of equipment.'
    - '**Saltwater corrosion and UV damage** — Tropical environments accelerate material degradation. Standard PVC tubes can fade, leak, and require replacement within 3 years. Corrosion of metal components increases maintenance costs and operational downtime.'
    - '**Stability at rest** — Divers need a stable platform when gearing up, entering the water, and climbing back onboard. Insufficient stability creates safety risks and negatively impacts the customer experience.'
    - '**High operating costs** — Fuel efficiency matters when running multiple trips every day. A boat that consumes more fuel directly reduces profit margins. Commercial diving operators care more about daily operating cost than top speed.'
content_solution:
  tagline: Our Solution
  title: 'Designed Around Real<br />Diving Operations'
  subtitle: 'Every Aquafarer diving RIB is configured for the specific needs of commercial dive centers — not adapted from a recreational boat design.'
  list:
    - 'Large working deck layout — designed for scuba tank storage, equipment preparation, and diver movement, not just passenger seating'
    - 'Professional diving ladder system with stainless steel handrails — wide, low-step boarding for safe and easy diver entry and exit'
    - 'Extra-wide Hypalon or PVC tubes — provides a stable boarding platform and improves buoyancy when divers move around the deck'
    - 'Integrated tank storage racks — keeps weight low, deck clear, and equipment organized for faster trip turnaround'
    - 'Non-slip EVA deck surface — reduces slipping risk when the deck is wet and divers are moving in heavy gear'
    - 'Console positioned for clear visibility of divers in the water — critical for instructor safety monitoring'
    - 'Engine options from 40 HP to 115 HP — single or twin configuration, optimized for fuel efficiency over multiple daily trips'
    - 'Marine-grade construction — heavy-duty tube materials with UV and saltwater resistance, reinforced structure for daily commercial use'
    - 'Custom dive ladder and platform configurations — matched to your operating water depth and diver profile'
    - 'Equipment mounting plates for sonar, GPS, and communication gear'
