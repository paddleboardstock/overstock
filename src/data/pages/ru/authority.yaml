features3_brand:
  tagline: Кто мы
  title: Фонд бренда<br />и наследие
  subtitle: История, опыт и глобальный охват определяют Paddle Board Overstock как надежного производителя морского оборудования.
  isBeforeContent: false
  columns: 3
  items:
    - title: Об Аквафарере
      description: Основана в 2012 году в Циндао, Китай. От прибрежной мастерской до объекта площадью 12 000 м² — полная история Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: История бренда
      description: Как команда морских инженеров намеревалась сделать надувные суда профессионального уровня доступными по всему миру.
      icon: tabler:book
      link: /brand-story
    - title: Экспертиза морской отрасли
      description: Глубокая материаловедение, прецизионное производство и испытания в реальных условиях — десятилетия морской инженерии в каждом корпусе.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Глобальное присутствие
      description: Обслуживание более чем 50 стран на всех континентах. Региональная экспертиза в отношении местных нормативных требований и рыночных предпочтений.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Почему Аквафарер
      description: Что нас отличает — качество, индивидуализация, прямые заводские цены и комплексная поддержка коммерческих операторов.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Наша команда
      description: Познакомьтесь с руководством — морскими инженерами, учеными-материаловедами и экспертами в области производства, которые продвигают Paddle Board Overstock вперед.
      icon: tabler:users
      link: /brand/team
    - title: Инженерная команда
      description: Более 78 лет исследований и разработок, более 40 платформ, 12 сертификатов, более 1200 OEM-проектов. Техническая команда стоит за каждым продуктом.
      icon: tabler:engine
      link: /engineering-team
    - title: Центр исследований и разработок
      description: Корпусное проектирование, радиочастотная сварка, лаборатория ПВХ, прототипирование, испытательный резервуар и лаборатория качества — наш полный комплекс исследований и разработок.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Доверие и качество
  title: Сертификаты, качество<br />и доказательства
  subtitle: Независимые сертификаты, тщательное тестирование и реальные доказательства, подтверждающие нашу приверженность качеству.
  isBeforeContent: false
  columns: 3
  items:
    - title: Сертификаты
      description: CE, ISO 9001, UKCA, BSCI, REACH — полная сертификационная документация и соответствие требованиям мировых рынков.
      icon: tabler:shield-check
      link: /certifications
    - title: Качество и тестирование
      description: Каждый продукт проходит испытания под давлением перед отправкой. Прочность шва, устойчивость к ультрафиолету, плавучесть — проверяются на каждом этапе.
      icon: tabler:clipboard-check
      link: /quality
    - title: Доказательства и доказательства
      description: Результаты испытаний, фотографии развертывания, отчеты сторонних проверок и тематические исследования, подтверждающие качество Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: График знаний
      description: Изучите граф сущностей Paddle Board Overstock — продукты, технологии, сертификаты и отношения в связанной базе знаний.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Лидерство
  title: Познакомьтесь с командой<br />Paddle Board Overstock
  subtitle: Отраслевой опыт, охватывающий морское машиностроение, материаловедение, управление качеством и глобальную торговлю B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: Тоби Лю — основатель и генеральный директор
      description: Более 15 лет в морском производстве. Ранее руководил исследованиями и разработками у крупного китайского производителя лодок. Имеет множество патентов на конструкцию надувных лодок.
      icon: tabler:crown
    - title: Чжан Вэй — главный инженер
      description: Более 20 лет в производстве ПВХ/гипалона и конструкции корпуса с глубоким V-образным вырезом. Бывший технический директор европейской морской инженерной фирмы.
      icon: tabler:engine
    - title: Чэнь Мин — руководитель отдела исследований и разработок
      description: Кандидат наук о материалах. Специализируется на технологии капельной сварки и высокочастотной сварке. Более 10 лет в текстильных композитах.
      icon: tabler:flask
    - title: Лю Цян — директор по производству
      description: Более 18 лет в бережливом производстве. Черный пояс Шести Сигм. На всех производственных линиях внедрена система качества ISO 9001.
      icon: tabler:settings
    - title: Ван Фан — Менеджер по качеству
      description: Более 12 лет в сфере морского контроля качества. Сертифицированный аудитор CE и ISO. Контролирует тестирование каждой производственной партии.
      icon: tabler:shield-check
    - title: Хелен Ли — директор по продажам
      description: Более 15 лет в международной торговле B2B. Управлял партнерскими отношениями OEM/ODM в более чем 30 странах. Свободно говорит на 4 языках.
      icon: tabler:briefcase
