hero:
  tagline: Авторитетный центр
  title: Почему Paddle Board Overstock?<br />Доверие, построенное за десятилетие
  subtitle: Каждое судно, которое мы строим, несет в себе вес более чем 10-летнего опыта морской инженерии, сертифицированных систем качества и тысяч успешных операций по всему миру. Вот почему профессионалы отрасли выбирают Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Морской завод Paddle Board Overstock и команда инженеров
