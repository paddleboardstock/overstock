features3_brand:
  tagline: Кто мы
  title: Фонд бренда<br />и наследие
  subtitle: История, экспертиза и глобальный охват определяют Paddle Board Overstock SUP надёжный бренд.
  isBeforeContent: false
  columns: 3
  items:
    - title: О Paddle Board Overstock компании
      description: Основана в 2012 году в Вэйхае, Китай. От прибрежной мастерской до объекта площадью 12 000 м² — вся Paddle Board Overstock история.
      icon: tabler:building-factory
      link: /about
    - title: История бренда
      description: Как команда морских инженеров поставила перед собой задачу сделать профессиональные надувные доски доступными по всему миру.
      icon: tabler:book
      link: /brand-story
    - title: Экспертиза морской отрасли
      description: Глубокие материаловедения, точное производство и реальные испытания — десятилетия морской инженерии в каждой плате.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Почему Сапсерфинг Overstock
      description: Что нас отличает — качество, кастомизация, прямое ценообразование с завода и полная поддержка для каждого гребца.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Наша команда
      description: Познакомьтесь с руководством — морскими инженерами, материаловедами и экспертами по производству Paddle Board Overstock , которые движутся вперёд.
      icon: tabler:users
      link: /brand/team
    - title: Инженерная команда
      description: 78+ совокупных лет исследований и разработок, 40+ платформ, 1 200+ инженерных проектов. Техническая команда, стоящая за каждым продуктом.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Доверие и качество
  title: Качество, тестирование<br />& Доказательство
  subtitle: Строгие испытания, реальные тестовые данные и доказательства, демонстрирующие нашу приверженность качеству.
  isBeforeContent: false
  columns: 3
  items:
    - title: Качество и тестирование
      description: Каждый продукт проходил испытания под давлением перед отправкой. Прочность шва, UV сопротивление, плавучесть — проверяется на каждом этапе.
      icon: tabler:clipboard-check
      link: /quality
    - title: Доказательства и доказательства
      description: Результаты тестов, фотографии развертывания, отчёты сторонних инспекций и кейсы, Paddle Board Overstock подтверждающие качество.
      icon: tabler:file-check
      link: /evidence
    - title: График знаний
      description: Исследуйте Paddle Board Overstock граф сущностей — продукты, технологии, материалы и взаимосвязи в связанной базе знаний.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Лидерство
  title: Познакомьтесь с командой<br />Позади Paddle Board Overstock
  subtitle: Экспертиза в отрасли, охватывающая морскую инженерию, материалознание, управление качеством и глобальную электронную коммерцию.
  isBeforeContent: false
  columns: 3
  items:
    - title: Тоби Лю — основатель и генеральный директор
      description: 15+ лет в морском производстве. Ранее возглавлял отдел R&D крупного китайского морского производителя. Имеет несколько патентов на дизайн надувных продуктов.
      icon: tabler:crown
    - title: Чжан Вэй — главный инженер
      description: 20+ лет в области полимерной обработки и проектирования надувных конструкций. Бывший технический директор европейской морской инженерной компании.
      icon: tabler:engine
    - title: Чэнь Мин — руководитель отдела исследований и разработок
      description: Доктор наук по материаловедению. Специализируется drop-stitch на технологиях и высокочастотной сварке. 10+ лет в текстильных композитах.
      icon: tabler:flask
    - title: Лю Цян — директор по производству
      description: 18+ лет в бережливом производстве. Внедрение строгих систем качества на всех производственных линиях.
      icon: tabler:settings
    - title: Ван Фан — Менеджер по качеству
      description: 12+ лет в морском контроле качества. Руководит внутренними аудитами качества. Контролирует тестирование каждой производственной партии.
      icon: tabler:shield-check
    - title: Хелен Ли — директор по продажам
      description: 15+ лет в международной электронной коммерции и логистике. Отправляет доски гребцам в 50+ странах. Владеет 4 языками.
      icon: tabler:briefcase
