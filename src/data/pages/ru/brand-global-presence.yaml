hero:
  tagline: Глобальное присутствие
  title: 'Мы поставляем продукцию в более чем 50 стран<br />на всех континентах'
  subtitle: 'От европейских операторов берегового патрулирования до австралийских дистрибьюторов водного спорта и спасательных команд Ближнего Востока — лодки Aquafarer ходят по воде по всему миру.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Глобальное морское производство и дистрибуция Aquafarer
stats:
  title: Глобальный охват
  stats:
    - title: Страны
      amount: '50+'
    - title: Экспортные рынки
      amount: Европа, Америка, Азия, Ближний Восток, Океания
    - title: Производство
      amount: Qingdao, China
    - title: Склад в США
      amount: Montclair, CA
features3_markets:
  tagline: Ключевые рынки
  title: 'Региональная экспертиза<br />для локальных требований'
  subtitle: 'Мы понимаем, что разные рынки имеют разные нормативные требования, предпочтения и сценарии использования.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Европа и Великобритания
      description: 'Продукция с сертификацией CE, соответствующая стандартам EN ISO 6185. Высокий спрос на RIB, надувные лодки и SUP-борды на рынках ЕС. Дистрибьюторы из Великобритании ценят нашу быструю отработку заказов.'
      icon: tabler:map-pin
    - title: Северная Америка
      description: 'Производство, одобренное Береговой охраной США. Склад в США в Монтклэре, Калифорния, для быстрой доставки на Западное побережье. Растущий спрос на рыбацкие лодки, спасательные суда и прогулочные SUP.'
      icon: tabler:map-pin
    - title: Австралия и Океания
      description: 'Ёмкий рынок для RIB-лодок и надувных тендеров. Австралийские дистрибьюторы ценят наши лодки из Hypalon за устойчивость к УФ в условиях палящего солнца. Быстрая отгрузка с нашей площадки в Азии.'
      icon: tabler:map-pin
    - title: Ближний Восток
      description: 'Растущий спрос на патрульные и спасательные лодки. Наши RIB с алюминиевым корпусом популярны у береговой охраны и охранных структур. Индивидуальные конфигурации для условий высоких температур.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Дистрибьюторская сеть
  title: 'Сотрудничество с дистрибьюторами<br />по всему миру'
  subtitle: 'Мы работаем с авторитетными дистрибьюторами морского оборудования, OEM-брендами и государственными закупочными органами.'
  isBeforeContent: false
  columns: 3
  items:
    - title: Партнёрства OEM/ODM
      description: 'Контрактное производство для глобальных брендов водного спорта. Мы берём на себя всё — от проектирования до производства и дропшиппинга.'
      icon: tabler:building
    - title: Сеть дистрибьюторов
      description: 'Авторизованные дистрибьюторы более чем в 20 странах держат складские запасы и оказывают локальную поддержку. Приглашаем новых дистрибьюторов к сотрудничеству.'
      icon: tabler:users
    - title: Государственный и институциональный сектор
      description: 'Прямые поставки береговым охранам, поисково-спасательным организациям и военным закупочным программам. Соответствие требованиям институциональных закупок.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Глобальная логистика и поддержка'
  subtitle: 'От завода до точки назначения — мы управляем всей цепочкой поставок.'
  items:
    - title: Варианты доставки
      description: 'Морские перевозки (FOB Циндао), авиаперевозки для срочных заказов и экспресс-курьер для образцов и запчастей.'
      icon: tabler:truck-delivery
    - title: Склад в США
      description: 'Складские запасы в Монтклэре, Калифорния, для быстрой доставки по всей Северной Америке. Западное побережье: 2-3 дня, Центр: 3-4 дня, Восточное побережье: 4-5 дней.'
      icon: tabler:building-warehouse
    - title: Запасные части
      description: 'Оригинальные запчасти и расходники Aquafarer на складе круглый год. Ходовые позиции отправляются в течение 24 часов.'
      icon: tabler:package
    - title: Техническая поддержка
      description: 'Прямая связь с нашей инженерной командой по техническим вопросам, рекомендациям по ремонту и поддержке модернизации. Мы поддерживаем лодки, построенные нами 20 лет назад.'
      icon: tabler:headset
cta:
  title: 'Хотите стать дистрибьютором?'
  subtitle: 'Мы активно расширяем нашу дистрибьюторскую сеть. Свяжитесь с нашей экспортной командой, чтобы обсудить возможности сотрудничества.'
  actions:
    - variant: primary
      text: Запрос о сотрудничестве
      href: /contact
    - text: Посмотреть наш ассортимент
      href: /products
