content_challenge:
  tagline: Вызов
  title: Рыболовным лодкам нужны<br />устойчивость, дальность и прочность
  subtitle: Независимо от того, управляете ли вы коммерческими рыболовными судами, управляете кооперативным флотом или арендуете рыболовные чартеры — ваша лодка должна работать надежно каждый день.
  paragraphs:
    - Рыболовным лодкам нужны стабильные платформы для работы со снастями, обработки улова и безопасного перемещения по палубе. Надувные лодки и RIB обладают врождённой устойчивостью благодаря конструкции баллонов — существенное преимущество перед жёсткими корпусами аналогичной длины.
    - Эффективность использования топлива имеет значение для рыболовных операций, где эксплуатационные расходы напрямую влияют на прибыльность. Жёстко-надувные лодки и надувные лодки легче аналогичных жёстких лодок, требуют меньше энергии и сжигают меньше топлива, что крайне важно для коммерческих операторов, ежедневно эксплуатирующих лодки, и кооперативов, управляющих бюджетом флота.
    - 'Долговечность в морской среде имеет важное значение. Соленая вода, воздействие ультрафиолета и постоянное использование требуют материалов, которые могут выдерживать суровые условия без разрушения. Для коммерческих и кооперативных операторов надежность напрямую влияет на доход: сломанная лодка означает потерянные дни рыбалки.'
    - Aquafarer конфигурации для рыбалки включают держатели удочек, эхолоты, колодцы для наживки, живые колодцы и решения для погрузочно-разгрузочных работ, предназначенные для серьезного рыболовного применения в коммерческих, совместных и развлекательных целях.
content_solution:
  tagline: Наше решение
  title: Конфигурации, готовые к рыбалке
  subtitle: Каждая рыболовная лодка Aquafarer может быть настроена под ваше конкретное рыболовное применение.
  list:
    - Крепление держателя удилищ — заводская установка или готовность к монтажу в дальнейшем
    - Монтажная пластина эхолота/GPS в зоне консоли
    - Опции отсека для наживки или живорунца для чартерных и коммерческих операторов
    - Конфигурации холодильника/хранения для обработки улова
    - Корпус deep-V для выхода в открытое море — стабилен на стоянке, плавен на ходу
    - Опции баллонов из PVC или Hypalon — Hypalon для длительного УФ-воздействия
    - Диапазон подвесных моторов от 15 HP до 115 HP в зависимости от модели и применения
content_segments:
  tagline: Рыболовные профили
  title: Решения для надувных рыбацких лодок<br />По типам операторов
  subtitle: От прибрежного спортивного рыболовства до коммерческого ярусного лова — различные рыболовные операции требуют разных конфигураций корпуса, диапазонов мощностей и палубных установок. Мы адаптируем каждую лодку в соответствии с промыслом, водами и стилем работы.
  items:
    - title: Коммерческие рыболовные компании
      subtitle: Рабочие катера для ежедневного рыболовства, погрузки сетей, транспортировки улова.
      description: Коммерческие рыболовные компании используют рабочие лодки для постановки и извлечения сетей, обслуживания ловушек, ярусного лова и транспортировки улова. Эти лодки каждый день работают в соленой воде и должны выдерживать большие нагрузки, постоянную работу на палубе и продолжительное время работы. Топливная эффективность и низкие эксплуатационные расходы имеют решающее значение для рентабельности автопарка. Судно должно иметь устойчивые рабочие платформы для работы экипажа со снаряжением и ловлей в меняющихся морских условиях.
      features:
        - Плоская планировка для установки сетей, укладки ловушек и хранения рыбы.
        - Экономичный подвесной двигатель с температурой 40–115 HP для низких ежедневных эксплуатационных расходов.
        - Прочные трубки Hypalon для устойчивости к истиранию при ежедневном использовании.
        - Усиленные трущиеся накладки для частого контакта с причалом и судном.
        - Самовыливная платформа для легкой промывки после операций.
        - Цены на флот и согласованные спецификации для операторов нескольких судов
    - title: Чартерные рыболовные операторы
      subtitle: Комфорт для нескольких пассажиров, управление багажом, сертификат безопасности
      description: Операторы, осуществляющие рыболовные чартеры на полдня и на целый день — от прибрежной рифовой рыбалки до морской донной рыбалки. На вашей лодке необходимы пассажирские сиденья с сертификатами безопасности, достаточно места на палубе для нескольких рыболовов и встроенные живые колодцы, чтобы наживка и улов оставались свежими на протяжении всего путешествия. Комфорт гостей напрямую влияет на отзывы о поездках, повторные бронирования и онлайн-рейтинги.
      features:
        - Консольное рулевое управление с амортизирующими ковшеобразными сиденьями.
        - Установленные на заводе держатели удилищ (4–8 позиций)
        - Диапазон подвесного двигателя 60–115 HP для крейсерской скорости в открытом море.
        - CE Сертификация категории C или B для коммерческих пассажирских перевозок.
        - Бимини или зонтик T-top для комфорта гостей в длительных поездках.
    - title: Кустарные и мелкие коммерческие рыболовы
      subtitle: Надежные рабочие лодки для повседневной жизни
      description: 'Независимые рыбаки, которые полагаются на свою лодку как на основной источник дохода: ставят сети, ухаживают за ловушками или ловят леску у берега. Вашим приоритетом является экономия топлива, простое техническое обслуживание, которое вы можете выполнить самостоятельно, и лодка, которая справляется с умеренным количеством улова и снастей, не жертвуя при этом остойчивостью.'
      features:
        - Экономичный подвесной двигатель 15–40 HP для низких эксплуатационных расходов.
        - Hypalon CSM трубки для повышенной устойчивости к ультрафиолету и истиранию
        - Планировка плоской палубы для установки сетей и хранения рыбы
        - Возможность легкой посадки на пляж благодаря надувной защите киля.
    - title: Рыболовные кооперативы
      subtitle: Сбор улова, транспортировка участников, распределение припасов.
      description: Рыболовные кооперативы управляют местными флотами для сбора улова у рыбаков-членов, транспортировки припасов в отдаленные рыболовецкие общины и распределения урожая на рынках. Этим рабочим лодкам необходима высокая грузоподъемность, надежная ежедневная эксплуатация и простота обслуживания в удаленных местах. Кооперативы часто работают в развивающихся регионах, где наличие запчастей и доступ к обслуживанию ограничены, поэтому необходимы простые конфигурации подвесных двигателей и надежная конструкция.
      features:
        - Высокая грузоподъемность для перевозки улова и припасов.
        - Простая конфигурация подвесного двигателя для облегчения обслуживания на месте.
        - Прочная конструкция PVC или Hypalon для гибкости бюджета
        - Плоская палуба с точками крепления для крепления груза
        - Экономия топлива, минимизирующая совместные эксплуатационные расходы
    - title: Любители спортивной и игровой рыбалки
      subtitle: Производительность и стиль для серьезных рыболовов
      description: Опытные рыболовы, которым нужна мощная рыболовная платформа, обеспечивающая скорость на дальних участках, устойчивую боевую позицию и первоклассную отделку. Лодка должна чувствовать себя как дома, путешествуя в двух милях от берега к рифу или исследуя отдаленные заводи эстуария.
      features:
        - Корпус с глубоким V-образным вырезом RIB для плавного хода на чопе.
        - Монтажная пластина для эхолота/GPS, предварительно подключенная к консоли
        - Baitwell и охладитель встроены в модуль заднего сиденья.
        - Пользовательские варианты цвета палубы EVA, соответствующие графике лодки/трубы
    - title: Гид по рыбалке и операторы экотуров
      subtitle: Рыбалка с гидом для приезжих рыболовов
      description: Гиды, которые водят небольшие группы приезжих рыболовов к продуктивным местам для рыбалки, часто сочетая рыбалку с элементами экотуризма, такими как наблюдение за птицами или исследование мангровых зарослей. Лодка должна быть сухой и комфортной для гостей, не привыкших к маленьким лодкам, с удобной посадкой и возможностью выбора тени.
      features:
        - Навесной тент или точки крепления T-top, установленные на заводе.
        - Гладкая посадочная лестница для легкой повторной посадки
        - Тихий 4-тактный подвесной двигатель, минимизирующий помехи.
        - Сухие отсеки для хранения гостевых телефонов, кошельков, фотоаппаратов
