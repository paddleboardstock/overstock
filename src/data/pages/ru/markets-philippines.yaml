hero:
  tagline: Филиппины
  title: Оптовые SUP борды для<br />Филиппинский бизнес
  subtitle: Островные курорты, пляжные клубы и операторы гребных машин от Эль-Нидо и Сиаргао до Боракая — совершенно новые доски с избытком из 5 единиц, смешанные модели, отправленные из Китая.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Доски для оверстока для филиппинских островных курортов и операторов гребле
direct_answer: Paddle Board Overstock поставляет совершенно новые надувные доски с избытком SUP запаса филиппинским предприятиям — островным курортам в Палаване и Сиаргао, пляжным клубам в Боракай и Себу, операторам аренды и туров, а также небольшим ритейлерам. Оптовые заказы начинаются с 5 досок с смешанными моделями в одной партии, отправляемых из Вэйхая, Китай, экспресс-авиаперевозками или консолидированными морскими перевозками. Каждая плата проходит 100% испытания под давлением и покрывается SUP двухлетней гарантией.
tldr_points:
  - Оптовая покупка с 5 плат — смешанные модели, цены по общему объёму
  - Обслуживание островных курортов и пляжных клубов по всему филиппинскому архипелагу
  - Экспресс-авиаперевозки или консолидированные морские грузы из Вэйхая, Китай
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: SUP Филиппинский рынок
  paragraphs:
    - С более чем семью тысячами островов, Филиппины созданы для стоячего гребли. Лагуны Эль-Нидо и Корон, расслабленная серф-сцена и островная атмосфера Сиаргао, энергия пляжного клуба Боракая и экономика дайвинга и водных видов спорта Себу — всё это создаёт стабильный спрос — от туристов, катающихся на рассвете по известняковой лагуне, до местных жителей, SUP строящих фитнес- и йога-сообщества в Маниле и за его пределами.
    - The buyers are typically resort and tour operators: островные курорты, добавляющие гостевые активности, не требующие топлива, двигателя и лицензии; туроператоры, перемещающиеся по островам, расширяющие ассортимент; и небольшие магазины, обслуживающие отечественное сообщество гребцов. Заказы бывают небольшими — от 5 до 20 досок — и смешиваются между стабильными универсальными досками для новичков и несколькими премиальными версиями для вида курортного фасада.
  customer_types:
    - title: Островные курорты
      description: Курорты Палаван, Сиаргао и Боракай добавляют SUP гостевые программы с компактными смешанными автопарками.
    - title: Туроператоры
      description: Операторы туров по островам и лагунам добавляют остановки для гребли в свои маршруты.
    - title: Местные магазины и школы
      description: Городские школы и магазины, обслуживающие растущее филиппинское сообщество гребцов и SUP йоги.
shipping_section:
  title: Корабль на Филиппины
  paragraphs:
    - Заказы отправляются из Вэйхая, Китай. Экспресс-авиаперевозки быстро доставляют образцы и 1–3 заказа на борт в Манилу и Себу; Consolidated sea freight обслуживает 5–20 оптовых заказов через Манилу и другие порты Филиппин. В вашем смете включены оценки транзита для вашего пункта назначения — метро Манилы или провинциального региона.
    - Мы предоставляем коммерческие счета и список упаковки, необходимые для оформления списка упаковки, с корректными HS-кодами и заявленными значениями. Импортные пошлины и налоги оплачиваются импортером согласно филиппинским правилам.
  customs_note: Для провинциальных пунктов конечная доставка из порта или аэропорта указывается в рамках оценки от двери до двери. Подтвердите текущее вложение импортной пошлины на спортивное снаряжение у вашего брокера; мы предоставляем полную документацию.
faq_section:
  title: Часто задаваемые вопросы по Филиппинам
  items:
    - q: Сколько времени занимает доставка на Филиппины?
      a: Это зависит от метода. Экспресс-авиаперевозки в Манилу или Себу — самый быстрый вариант для получения образцов и 1–3 заказов на борт; Консолидированные морские грузоперевозки устраивают оптовые заказы на 5–20 бортов и включают транзитное окно для вашего порта. Обе оценки подробно перечислены в вашей смете до того, как вы заключите решение.
    - q: Могут ли советы достичь провинциальных островов, таких как Палаван или Сиаргао?
      a: Да — доставка от двери до двери в провинциальные пункты указывается как часть расчета стоимости перевозки с использованием последующей внутренней логистики от порта или аэропорта прибытия. Обратите внимание на оценку и варианты в вашем запросе, и мы предоставим точную цену.
    - q: Как выглядит стартовый флот курорта?
      a: 'Обычно 5–10 досок: стабильные универсальные модели для гостевых уроков и свободного плавания, а также одна-две премиальные художественные версии для набережной. Смешанные модели, одна поставка, цена зависит от общего количества.'
    - q: Подходят ли доски для использования в лагуне и на отмели рифа?
      a: Да — спокойные, мелкие, тёплые водные условия как раз подходят для надувных SUP досок универсального типа, а гибкий плавник и прочная конструкция drop-stitch хорошо справляются с приземлениями на рифах и пляжах.
