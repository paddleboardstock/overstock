hero_text:
  tagline: Ресурсы
  title: 'Центр загрузок и руководства для покупателей'
  subtitle: 'Получите доступ к каталогам продукции, руководствам OEM, чек-листам для покупателей и технической документации, чтобы принимать обоснованные решения о закупках.'
features3_downloads:
  tagline: Загрузки
  title: 'Документация на продукцию<br />и ресурсы для покупателей'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Каталог морской продукции 2026'
      description: 'Полный ассортимент продукции: лодки RIB, надувные лодки, доски SUP, каяки и аксессуары. Характеристики, комплектации и опции. Формат PDF.'
      icon: tabler:file-text
    - title: 'Руководство по OEM-производству'
      description: 'Все, что нужно знать о партнерстве OEM/ODM: обзор процесса, минимальные объемы заказа, варианты кастомизации, контроль качества и доставка.'
      icon: tabler:building-factory
    - title: 'Руководство покупателя лодок RIB'
      description: 'Как выбрать подходящую лодку RIB: материалы корпуса, материалы баллонов, выбор двигателя, вопросы размера и варианты комплектации для разных сценариев использования.'
      icon: tabler:file-description
    - title: 'Чек-лист поставщика SUP'
      description: 'Ключевые моменты при выборе производителя досок SUP: индикаторы качества, требования к сертификации, вопросы MOQ и на что обратить внимание при аудите завода.'
      icon: tabler:clipboard-check
    - title: 'Руководство по материалам надувных лодок'
      description: 'ПВХ против Hypalon: сравнение долговечности, УФ-стойкости, срока службы, вариантов ремонта и стоимости для различных сценариев применения.'
      icon: tabler:files
    - title: 'Шаблон технического задания для индивидуального производства'
      description: 'Скачайте наш шаблон технического задания на продукцию. Укажите ваши требования и отправьте его нам — вы получите коммерческое предложение в течение той же недели и оценку реализуемости.'
      icon: tabler:template
faqs:
  title: Часто задаваемые вопросы
  subtitle: 'Распространенные вопросы о нашей продукции, процессе производства и модели партнерства.'
  columns: 2
  items:
    - title: Каков минимальный объем заказа?
      description: 'MOQ зависит от категории продукции. Лодки RIB — обычно от 10 единиц на модель. Доски SUP — от 50 единиц. Свяжитесь с нашим отделом продаж, чтобы узнать MOQ по конкретному продукту.'
      icon: tabler:help-circle
    - title: Могу ли я получить образцы перед размещением заказа?
      description: 'Да. Aquafarer предоставляет образцы для оценки до начала серийного производства. Стоимость образцов обсуждается и часто засчитывается в счет первого производственного заказа.'
      icon: tabler:package
    - title: Какие условия оплаты доступны?
      description: 'Стандартные условия: 30% предоплата при заказе, 70% перед отгрузкой. Условия LC доступны квалифицированным клиентам. Свяжитесь с нашим финансовым отделом, чтобы обсудить варианты.'
      icon: tabler:currency-dollar
    - title: Сколько занимает производство?
      description: 'Типичные сроки производства: лодки RIB — 30-45 дней, доски SUP — 20-30 дней, надувные лодки — 25-35 дней. Индивидуальная разработка добавляет 15-30 дней на прототипирование.'
      icon: tabler:calendar-clock
    - title: Какие сертификаты есть у вашей продукции?
      description: 'Сертификация CE для рынков ЕС, производство одобрено Береговой охраной США, система менеджмента качества ISO, соответствие BSCI и требованиям REACH к материалам.'
      icon: tabler:certificate
    - title: Предлагаете ли вы индивидуальную упаковку и брендинг?
      description: 'Да. Мы предлагаем индивидуальную упаковку с вашим логотипом, вашими цветами и фирменным стилем. MOQ на индивидуальную упаковку зависит от категории продукции.'
      icon: tabler:color-swatch
cta:
  title: 'Нужна помощь с поиском подходящего материала?'
  subtitle: 'Свяжитесь с нашей командой, чтобы получить персональные рекомендации по выбору продукции, партнерству OEM или техническим характеристикам.'
  actions:
    - variant: primary
      text: Связаться с нашей командой
      href: /contact
