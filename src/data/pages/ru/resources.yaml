hero_text:
  tagline: Ресурсы
  title: Центр скачивания и руководства по гребле
  subtitle: Каталоги товаров, руководства по покупке и инструкции по уходу, которые помогут вам выбрать, использовать и насладиться SUP надувной доской.
features3_downloads:
  tagline: Загрузки
  title: Документация продукта<br />и ресурсы для гребли
  isBeforeContent: false
  columns: 2
  items:
    - title: Каталог продукции 2026 года SUP
      description: 'Полный Paddle Board Overstock SUP ассортимент: универсальные доски, арт-серии и аксессуары с полными техническими характеристиками и содержимым упаковки. Формат PDF.'
      icon: tabler:file-text
    - title: SUP Руководство для надувных покупателей
      description: 'Как выбрать первую доску: длина, ширина, толщина, объём, совпадение веса всадника и какая форма доски подходит вашему стилю гребли.'
      icon: tabler:file-description
    - title: SUP Руководство по размеру и посадке
      description: Подбирайте объём и размеры доски с вашим весом и уровнем навыков, давая рекомендации по отдыху, туризму, йоге и фитнесу.
      icon: tabler:clipboard-check
    - title: Руководство по уходу и уходу за советом
      description: 'Держите плату как новую: чистка, сушка, хранение, UV защита, уход за клапанами и незначительные инструкции по ремонту.'
      icon: tabler:tool
    - title: Руководство по материалам для надувных досок
      description: PVC drop-stitch Конструкция, сердечники, EVA площадки для палубы и то, что PSI жёсткость 15 для производительности и долговечности.
      icon: tabler:files
    - title: Начало работы SUP
      description: 'Основы для новичков: надувание, перенос, запуск, базовые гребки и необходимые меры безопасности, чтобы встать в первый же день.'
      icon: tabler:swimming
faqs:
  title: Часто задаваемые вопросы
  subtitle: Распространённые вопросы о наших досках, заказе и выходе на воду.
  columns: 2
  items:
    - title: Что входит в мою доску?
      description: Каждый комплект включает доску, регулируемое весло, насос с высоким расходом потока, поводок, ремонтный набор и рюкзак. Комплект для весла и насосов также доступен отдельно.
      icon: tabler:package
    - title: Сколько времени занимает инфляция?
      description: С включённым насосом с высоким расходом большинство гребцов достигают полного давления за 8-12 минут. Электрические насосы тоже работают — просто останавливайтесь на номинальном давлении, напечатанном рядом с клапаном.
      icon: tabler:clock
    - title: Как выбрать правильную доску?
      description: 'Начните с веса и стиля гребли: новички и семьи любят широкие, устойчивые платформы, такие как SUP Explorer 11; веслаборы по йоге предпочитают сцепление на полной палубе; туринговые гребцы хотят жёсткие, обтекаемые формы. Наша команда с радостью порекомендует её.'
      icon: tabler:help-circle
    - title: Какие способы оплаты вы принимаете?
      description: Мы принимаем основные кредитные карты, PayPal и банковские переводы. Все цены включают полный пакет — без скрытых дополнительных материалов.
      icon: tabler:currency-dollar
    - title: Сколько времени занимает доставка?
      description: Заказы отправляются с нашего завода и обычно приходят в течение 5-10 рабочих дней в зависимости от региона. Отслеживание каждого заказа предоставляется.
      icon: tabler:truck-delivery
    - title: Покрыта ли моя доска гарантией?
      description: Да — каждая доска защищена от производственных дефектов, и каждая единица подвергается проверке давления до 1,25 раза превышающего номинальное давление в течение 24-48 часов перед отправкой с завода. Наш уровень заявок по гарантии составляет менее 2%.
      icon: tabler:shield-check
cta:
