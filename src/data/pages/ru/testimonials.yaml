testimonials:
  - category: clubs
    name: Рикардо Сантос
    title: Владелец Академии серфинга Алгарве
    location: Лагос, Португалия
    content: Мы начали со стартового пакета Club для нашей школы серфинга. 20 досок, весла, жилеты — всё пришло за 3 недели. После двух сезонов мы перешли на пакет Pro. Индивидуальный брендинг с нашим логотипом изменил правила игры в нашем профессиональном имидже.
    rating: 5
    product: Клубный стартовый пакет
    source: solutions/clubs
  - category: clubs
    name: Владелец клуба
    title: Клуб водных видов спорта
    location: Пхукет, Таиланд
    content: Пакет "Старт для клуба" был идеальной отправной точкой. По мере роста нашего бизнеса, Paddle Board Overstock рос вместе с нами — то же качество, те же цены, никаких сюрпризов. Мы увеличили количество досок с 10 до 80 за 18 месяцев.
    rating: 5
    product: Клубный стартовый пакет + Премиум-пакет
    source: success-stories
  - category: resorts
    name: Генеральный директор курорта
    title: 5-звездочный пляжный курорт
    location: Греция
    content: Paddle Board Overstock не просто доставляли доски — они помогли нам создать полноценный опыт для гостей. Наша программа водных видов спорта выросла с нуля до главного события курорта всего за один сезон. 300+ бронирований в неделю и $180 тыс. годового дохода.
    rating: 5
    product: Курортный пакет «Премиум»
    source: success-stories
  - category: resorts
    name: Софи Лоран
    title: Директор по работе с гостями, Azure Bay Resorts
    location: Пхукет, Таиланд
    content: Paddle Board Overstock разработал и оснастил всю нашу программу пляжных развлечений на трех курортных объектах. 120 SUPs, инфраструктура безопасности и обучение персонала — все доставлено одним рейсом. Участие гостей увеличилось на 60% в первый сезон.
    rating: 5
    product: Курортный пакет «Премиум»
    source: solutions/resorts
  - category: rental
    name: Дэниел Оконкво
    title: Владелец, Lakeland SUP Rentals
    location: Онтарио, Канада
    content: Я арендовал 5 досок в местном магазине и терял 60% дохода из-за этого. Paddle Board Overstock помог мне создать собственный парк из 15 SUPs. Калькулятор ROI показал окупаемость за 4 месяца — на самом деле потребовалось 3. Теперь я расширяю парк до 30 досок.
    rating: 5
    product: Стартовый комплект флота
    source: solutions/rental-business
  - category: rental
    name: Марко Валенти
    title: Операционный директор Adriatic Adventure Tours
    location: Дубровник, Хорватия
    content: Мы оснастили весь наш флот прокатных SUP досок Paddle Board Overstock — 30 досок на трех локациях. Два сезона — ноль поломок. Постоянное качество каждой партии сделало выбор легким, а их команда даже подобрала цвета в соответствии с нашим брендом.
    rating: 5
    product: Пакет для прокатного флота
    source: trust
  - category: rental
    name: Елена Маркетти
    title: Владелица, Lake Garda SUP Rentals
    location: Озеро Гарда, Италия
    content: Наши прокатные доски выходят пять раз в день в пик сезона. С тех пор как мы перешли на Paddle Board Overstock, жалобы на повреждения почти исчезли, а клиенты постоянно спрашивают, где можно купить собственную доску.
    rating: 5
    product: Пакет для прокатного флота
    source: solutions/rental-business
  - category: consumers
    name: Сара К.
    title: Первый владелец SUP
    location: Озеро Тахо, США
    content: Стабильна даже для полного новичка. В первый же день вытащил его на озеро и ни разу не упал. Полный комплект с насосом и веслом означал, что я был на воде через 20 минут после открытия коробки.
    rating: 5
    product: SUP Эксплорер 11
  - category: consumers
    name: Джеймс Торнтон
    title: Владелец SUP Explorer 11
    location: Ванкувер, Канада
    content: Будучи покупателем в первый раз, я волновался из-за заказа из-за границы. Качество сборки говорило само за себя с момента распаковки — жесткая, безупречные швы, и доставка заняла всего 6 дней.
    rating: 5
    product: SUP Эксплорер 11
    source: trust
  - category: consumers
    name: Майк Р.
    title: Выходные на доске
    location: Флорида, США
    content: Солидное качество сборки. Справляется с прибрежной полосой лучше, чем я ожидал от надувной лодки. Упаковал его в багажник машины для поездки на выходные — надулся на рампе менее чем за 4 минуты.
    rating: 5
    product: SUP Тропический Бриз
