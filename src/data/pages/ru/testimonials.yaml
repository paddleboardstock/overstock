testimonials:
  - category: клубы
    name: Рикардо Сантос
    title: Владелец Академии серфинга Алгарве
    location: Лагос, Португалия
    content: Мы начали со стартового пакета Club для нашей школы серфинга. 20 досок, весла, жилеты — всё пришло за 3 недели. После двух сезонов мы перешли на пакет Pro. Индивидуальный брендинг с нашим логотипом изменил правила игры в нашем профессиональном имидже.
    rating: 5
    product: Клубный стартовый пакет
    source: solutions/clubs
  - category: клубы
    name: Владелец клуба
    title: Клуб водных видов спорта
    location: Пхукет, Таиланд
    content: Клубный стартовый пакет был идеальной отправной точкой. По мере того как наш бизнес рос, Paddle Board Overstock рос вместе с нами — то же качество, те же цены, никаких сюрпризов. Мы увеличили количество досок с 10 до 80 за 18 месяцев.
    rating: 5
    product: Клубный стартовый пакет + Премиум-пакет
    source: success-stories
  - category: курорты
    name: Генеральный директор курорта
    title: 5-звездочный пляжный курорт
    location: Греция
    content: Paddle Board Overstock не просто доставил доски — они помогли нам создать полноценный гостевой опыт. Наша программа водных видов спорта прошла путь от нуля до курортной вершины за один сезон. Более 300 заказов в неделю и годовой доход в размере 180 000 долларов США.
    rating: 5
    product: Курортный пакет «Премиум»
    source: success-stories
  - category: курорты
    name: Софи Лоран
    title: Директор по работе с гостями, Azure Bay Resorts
    location: Пхукет, Таиланд
    content: Компания Paddle Board Overstock спроектировала и оборудовала всю нашу программу пляжных развлечений на трех курортных объектах. 80 SUP, 40 каяков, инфраструктура безопасности и обучение персонала — все доставлено одной партией. В первом сезоне участие гостей увеличилось на 60%.
    rating: 5
    product: Курортный пакет «Премиум»
    source: solutions/resorts
  - category: предприниматели
    name: Майкл Парк
    title: Основатель компании Shoreline Paddle Co.
    location: Калифорния, США
    content: Я запустил свой бренд SUP, не имея опыта работы в отрасли. Команда Paddle Board Overstock помогла мне от выбора продукта до индивидуального дизайна логотипа и упаковки. Мой первый контейнер прибыл через 11 недель, а на Amazon я его распродал за 3 месяца.
    rating: 5
    product: Стартовый запуск бренда
    source: solutions/entrepreneurs
  - category: предприниматели
    name: Основатель
    title: Австралийский бренд SUP
    location: Австралия
    content: У меня была идея бренда, но не было знаний о производстве. Paddle Board Overstock буквально держал меня за руку на протяжении всего процесса — от выбора подходящего дизайна доски до распаковки моей первой партии. 90 дней от мечты до доставки.
    rating: 5
    product: Пакет запуска бренда
    source: success-stories
  - category: аренда
    name: Дэниел Оконкво
    title: Владелец, Lakeland SUP Rentals
    location: Онтарио, Канада
    content: Я арендовал 5 досок в местном магазине и потерял из-за них 60% своего дохода. Paddle Board Overstock помог мне построить собственный флот из 15 SUP. Калькулятор ROI показал безубыточность за 4 месяца — потребовалось 3. Сейчас расширяюсь до 30 досок.
    rating: 5
    product: Стартовый комплект флота
    source: solutions/rental-business
  - category: аренда
    name: Марко Валенти
    title: Операционный директор Adriatic Adventure Tours
    location: Дубровник, Хорватия
    content: Мы оснастили весь наш арендный флот надувными лодками Paddle Board Overstock — 12 лодок в трех локациях. Два сезона – ноль неудач. Сертификационная документация CE упростила процедуру утверждения страховки. Их инженерная команда даже настроила цвета трубок.
    rating: 5
    product: Комплект расширения парка
    source: trust
  - category: аренда
    name: Лейтенант-коммандер Андрес Рейес
    title: Сотрудник по морским закупкам, вспомогательная служба береговой охраны Филиппин
    location: Манила, Филиппины
    content: В нашем прибрежном патрульном флоте мы эксплуатируем 24 надувных лодки Paddle Board Overstock. Их процесс контроля качества одинаков для каждой партии — одинаковое качество шва, одинаковое расположение клапана, одинаковое номинальное давление каждый раз. Эта повторяемость имеет значение, когда от оборудования зависит жизнь.
    rating: 5
    product: Патрульный флот РИБ
    source: trust
  - category: потребители
    name: Сара К.
    title: Первый владелец SUP
    location: Озеро Тахо, США
    content: Стабильна даже для полного новичка. В первый же день вытащил его на озеро и ни разу не упал. Полный комплект с насосом и веслом означал, что я был на воде через 20 минут после открытия коробки.
    rating: 5
    product: САП Эксплорер 11
  - category: потребители
    name: Джеймс Торнтон
    title: Владелец SUP Explorer 11
    location: Ванкувер, Канада
    content: Будучи покупателем впервые, я нервничал по поводу качественного заказа из-за границы. Документация ISO и отчеты сторонних испытаний, которыми они поделились еще до того, как я спросил, вселили во меня полную уверенность. Доска прибыла через 6 дней и превзошла мои ожидания.
    rating: 5
    product: САП Эксплорер 11
    source: trust
  - category: потребители
    name: Майк Р.
    title: Рекреационный каякер
    location: Флорида, США
    content: Солидное качество сборки. Справляется с прибрежной полосой лучше, чем я ожидал от надувной лодки. Упаковал его в багажник машины для поездки на выходные — надулся на рампе менее чем за 4 минуты.
    rating: 5
    product: Надувной каяк
