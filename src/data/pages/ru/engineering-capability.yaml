content_capability:
  tagline: Инженерные возможности
  title: Что обеспечивает наша инженерная<br />команда
  subtitle: Проектирование Paddle Board Overstock охватывает полный жизненный цикл продукта — от исследования рынка и концептуального проектирования до прототипирования, тестирования и массового производства.
  items:
    - title: Промышленный дизайн
      description: Наша команда промышленных дизайнеров работает с учетом требований клиентов, исследований рынка и конкурентного анализа для разработки концепций продуктов, которые сочетают в себе эстетику, функциональность и технологичность. Мы создаем 2D-эскизы, 3D-рендеринги и техническую документацию для рассмотрения клиентом, прежде чем приступить к работе с инструментами.
      features:
        - Разработка концепции и исследования осуществимости
        - 2D-чертежи конструкции и 3D-визуализации
        - Выбор и спецификация материалов
        - Анализ технологичности конструкции (DFM)
        - Эргономическая оценка и оценка безопасности
    - title: Структурное проектирование
      description: Наши инженеры-конструкторы специализируются на архитектуре надувных лодок — проектировании корпуса, конфигурации трубчатой камеры, проектировании сердцевины с вышивкой и распределении нагрузки. Каждая конструкция анализируется на структурную целостность, оптимизацию веса и соответствие соответствующим стандартам (CE, ISO, AS).
      features:
        - Проектирование корпусов из стекловолокна с глубоким V и расчетными углами килеватости
        - Многокамерная конфигурация баллонов для безопасности и плавучести
        - Спецификация сердечника drop-stitch и оптимизация плотности
        - Конечно-элементный анализ несущих компонентов
        - Расчеты распределения веса и остойчивости
    - title: 3D-моделирование и САПР
      description: Все проекты изделий разрабатываются в 3D CAD до начала изготовления прототипа. Наши инженеры используют SolidWorks и Rhino 3D для моделирования изделий, что позволяет клиентам просматривать каждую деталь — от профиля трубы до компоновки консоли — перед тем, как приступить к производству.
      features:
        - Полное 3D-моделирование в САПР (SolidWorks и Rhino 3D)
        - Фотореалистичные визуализации для презентаций клиентам
        - Комплекты технических чертежей для производства
        - Проектирование пресс-форм и оснастки по 3D-моделям
        - Прямая передача данных из САПР на ЧПУ для точной резки
    - title: Прототипирование и тестирование
      description: Перед массовым производством каждый новый продукт проходит стадию прототипа. Мы создаем функциональные прототипы для оценки клиентов, а затем подвергаем их полному протоколу тестирования — испытаниям под давлением, испытаниям на стабильность, нагрузочным испытаниям и испытаниям на воде. Итерации проектирования на стадии прототипа выполняются быстро и экономично.
      features:
        - Быстрая оснастка для прототипов (срок 15-20 дней)
        - Функциональный прототип для оценки в реальных условиях
        - Полный протокол испытаний перед утверждением производства
        - Итеративная доработка конструкции на основе результатов испытаний
        - Этап согласования с клиентом перед производственной оснасткой
    - title: Интеграция индивидуальных аксессуаров
      description: Многие OEM-проекты требуют интеграции аксессуаров, поставляемых клиентом или сторонних производителей — индивидуальных консолей, специализированных сидений, электронных систем, креплений для снаряжения для дайвинга или элементов брендинга. Наша команда инженеров занимается проектированием интеграции, структурной адаптацией и проверкой качества всех аксессуаров.
      features:
        - Проектирование консолей и компоновка приборной панели
        - Интеграция индивидуальных сидений и обивки
        - Проектирование и разводка электронных систем
        - Системы крепления снаряжения для дайвинга и спасательных работ
        - Спецификации нанесения брендинга и графики
content_process:
  tagline: Процесс разработки
  title: От концепции<br />к производству
  subtitle: Наш процесс разработки продукта представляет собой структурированный шестиэтапный рабочий процесс, предназначенный для минимизации рисков, сокращения сроков и обеспечения готовности производства с первого дня.
  stages:
    - stage: '01'
      title: Требования и исследования
      duration: 1-2 недели
      description: Мы работаем с клиентом, чтобы определить спецификации продукта, требования целевого рынка, потребности в соблюдении нормативных требований и коммерческие цели. На этом этапе создается документ с требованиями к продукту (PRD), который определяет всю последующую работу.
      deliverables: PRD, анализ рынка, конкурентный бенчмарк, предварительная смета затрат
    - stage: '02'
      title: Концептуальный дизайн
      duration: 2-3 недели
      description: Команда промышленных дизайнеров разрабатывает концепции продуктов на основе PRD. Несколько вариантов дизайна представлены с 3D-рендерингами, рекомендациями по материалам и первоначальными инженерными оценками. Клиент выбирает направление для детальной разработки.
      deliverables: 3D-рендеринг концепции, спецификации материалов, обоснование проекта, предварительная спецификация.
    - stage: '03'
      title: Детальное проектирование
      duration: 2-4 недели
      description: Выбранная концепция полностью спроектирована — 3D-моделирование CAD, структурный анализ, конфигурация труб, проектирование корпуса, интеграция аксессуаров и производственная документация. Для оснастки указаны все размеры, материалы и процессы.
      deliverables: Полная 3D-модель CAD, инженерные чертежи, окончательная спецификация, спецификации инструментов, план контроля качества.
    - stage: '04'
      title: Прототипирование
      duration: 2-3 недели
      description: Изготовлены прототипы оснастки и построены функциональные образцы. Клиент проверяет прототип на соответствие спецификациям PRD. Тестирование проводится по согласованному протоколу. Корректировки конструкции вносятся на основе отзывов перед изготовлением оснастки.
      deliverables: Функциональный прототип, отчет об испытаниях, журнал изменений проекта, документ, подписанный клиентом.
    - stage: '05'
      title: Производственная оснастка
      duration: 2-3 недели
      description: После утверждения прототипа в эксплуатацию вводится производственная оснастка — формы, сварочные приспособления, программы резки, приспособления для сборки. Документация по контролю качества и критерии проверки завершены. Пробный запуск проведен для проверки процесса.
      deliverables: Производственная оснастка, технологическая документация, план проверки качества, отчет о пробном запуске.
    - stage: '06'
      title: Массовое производство и контроль качества
      duration: Непрерывный
      description: Полноценное производство начинается с внутрипроизводственного контроля качества на каждом этапе. Первые изделия проверяются и утверждаются перед выпуском партии. Постоянный контроль качества, отслеживание дефектов и постоянное улучшение на протяжении всего жизненного цикла производства.
      deliverables: График производства, отчеты по контролю качества, записи о отслеживании партий, отгрузочная документация.
content_customization:
  tagline: Параметры настройки
  title: Что можно<br />настроить
  subtitle: Почти каждый аспект нашей продукции может быть адаптирован в соответствии с требованиями клиента. Ниже приведены наиболее распространенные категории настройки.
  columns: 3
  items:
    - title: Корпус и структура
      description: Длина корпуса, ширина балки, угол килеватости, диаметр трубы, конфигурация камеры и марка материала могут быть изготовлены по индивидуальному заказу.
      icon: tabler:sailboat
    - title: Цвета и графика
      description: Цвет трубки (ПВХ/гипалон), цвет гелькоута корпуса, цвет консоли, графика палубы, размещение логотипа и дизайн упаковки.
      icon: tabler:palette
    - title: Консоль и элементы управления
      description: Центральная консоль, боковая консоль или рулевое управление с помощью румпеля. Настраиваемая компоновка приборной панели, расположение переключателей и положение руля.
      icon: tabler:steering-wheel
    - title: Сиденья и обивка
      description: Сиденья-жокей, многоместные сиденья, роскошная обивка, швы в тон, складные или съемные конфигурации.
      icon: tabler:armchair
    - title: Аксессуары и оборудование
      description: Трапы для дайвинга, стойки для баков, буксировочные пилоны, Т-образные топы, бимини-топы, звуковые системы, навигационная электроника и оборудование для обеспечения безопасности.
      icon: tabler:backpack
    - title: Упаковка и брендинг
      description: Индивидуальная розничная упаковка, коробки под собственной торговой маркой, транспортировочные коробки с фирменными знаками, бирки и руководства пользователя на языке клиента.
      icon: tabler:box
content_industries:
  tagline: Промышленные приложения
  title: Инженерные решения<br />по отраслям
  subtitle: Наша команда инженеров разработала продукцию для широкого спектра морских применений, каждая из которых имеет свои собственные требования и критерии производительности.
  columns: 3
  items:
    - title: Водолазные операции
      description: Усиленные палубы, интеграция лестниц для дайвинга, системы хранения резервуаров и устойчивые платформы для коммерческих дайв-центров по всему миру.
      icon: tabler:lifebuoy
    - title: Спасение и Чрезвычайная ситуация
      description: Высокоскоростные конструкции корпуса, самоосвобождающиеся палубы, системы крепления оборудования и многокамерные конфигурации безопасности для поисково-спасательных операций.
      icon: tabler:alert-triangle
    - title: Морской туризм
      description: Компоновка комфорта пассажиров, интеграция солнцезащитных навесов, системы посадки и экономичные конфигурации для операций по пересадке на остров.
      icon: tabler:beach
    - title: Яхтенные тендеры
      description: Компактная конструкция для хранения шлюпбалки, роскошные варианты отделки, соответствующие цвета материнского корабля и высокоэффективные буксирные характеристики.
      icon: tabler:sailboat
    - title: Рыбалка и аквакультура
      description: Конфигурации с плоской палубой, интеграция с живым колодцем, расположение держателей стержней, устойчивое к коррозии оборудование для постоянного воздействия соленой воды.
      icon: tabler:fish
    - title: Порт и промышленность
      description: Усиление сверхпрочного корпуса, компоновка рабочих лодок, конфигурация транспорта для персонала и интеграция оборудования для морских операций.
      icon: tabler:ship
