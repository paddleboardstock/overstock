hero:
  tagline: Бразилия
  title: Оптовые SUP борды для<br />Бразильские розничные продавцы
  subtitle: Для мастерских и операторов от Рио и Флорианополиса до северо-восточного побережья — совершенно новые избыточные доски для гребли из 5 экземпляров, смешанные модели, отправленные из Китая.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Доски для избыточных SUP запасов для бразильских пляжных ритейлеров и школ паддл-спорта
direct_answer: Paddle Board Overstock поставляет совершенно новые надувные доски в составе SUP бразильских предприятий — школы и магазины в Рио-де-Жанейро, Флорианополисе и на северо-восточном побережье, операторам аренды и онлайн-продавцам. Оптовые заказы начинаются с 5 досок, смешанных моделей в одной партии, отправляемых из Вэйхая, Китай, экспресс-авиаперевозками или консолидированными морскими перевозками. Каждая плата проходит 100% испытания под давлением и покрывается SUP двухлетней гарантией.
tldr_points:
  - Оптовая покупка с 5 плат — смешанные модели, цены по общему объёму
  - Обслуживание пляжной культуры Бразилии от Рио до северо-востока
  - Экспресс-авиаперевозки или консолидированные морские грузы из Вэйхая, Китай
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: SUP Бразильский рынок
  paragraphs:
    - 'Бразилия — один из самых естественных рынков для гребли на Земле. Пляжная культура — это национальная культура: от сцены стендап-на лагунах Рио и смеси прибой и спокойной воды Флорианополиса до тёплых, спокойных вод Северо-Востока в Сеара, Пернамбуку и Баии. Школы гребли, аренда лагун и сообщества по ветру и SUP серфингу — все они составляют огромное, увлечённое спортом население.'
    - Бразильские покупатели обычно — это бизнесы, управляемые владельцами — арендные киоски у лагуны, пляжные школы, серф-магазины, SUP добавляющие очереди, и растущий рынок отечественных продавцов электронной коммерции. Они заказывают небольшими партиями (5–20 досок) и заботятся о долговечности для повседневного использования и ценовой конкурентоспособности на рынке с существенными импортными затратами.
  customer_types:
    - title: Школы Лагуна и Бич
      description: Школы и операторы аренды на лагунах Рио и на спокойных пляжах северо-востока предоставляют уроки и аренду почасово.
    - title: Серф-магазины
      description: Устоявшиеся серф-ритейлеры добавляют спокойную воду и занимаются SUP туризмом для местного сообщества гребцов.
    - title: Онлайн-продавцы
      description: Отечественные продавцы электронной коммерции импортируют SUP товары для обслуживания огромного внутреннего рынка Бразилии.
shipping_section:
  title: Корабль в Бразилию
  paragraphs:
    - Заказы отправляются из Вэйхая, Китай. Экспресс-авиаперевозки перевозят образцы и 1–3 бортовых заказа в крупнейшие аэропорты Бразилии; Консолидированные морские грузоперевозки обслуживают 5–20 оптовых заказов через порты, такие как Сантос, и другие прибрежные шлюзы. В вашем смете включены оценки транзита для вашего пункта назначения.
    - Мы предоставляем коммерческий счет-фактура и список упаковки, необходимые для оформления, с правильными HS-кодами и заявленными значениями. Импортные пошлины и налоги уплачиваются импортером по бразильским правилам.
  customs_note: Импортные налоги на спортивные товары в Бразилии значительны и различаются в зависимости от классификации продукции. Перед заказом уточните текущие пошлины, НДС и любые сборы на уровне штатов у таможенного брокера (despachante) — мы предоставляем полную документацию, но не включаем импортные налоги в фрахтовые предложения.
faq_section:
  title: Часто задаваемые вопросы по Бразилии
  items:
    - q: Можно ли обработать предложения и поддержку на португальском?
      a: Да — мы работаем с покупателями, говорящими на португальском языке. Спросите в своем запросе, и мы обработаем вашу смету и заказ на португальском.
    - q: Включены ли в ваши цены импортные налоги Бразилии?
      a: Нет. Импортные пошлины, НДС и налоги на уровне штатов — ответственность импортера по бразильским правилам. Мы чётко и отдельно указываем цены и фрахт, а также предоставляем необходимые вам документы.
    - q: Как выглядит первый заказ для бразильской пляжной школы?
      a: 'Обычно 5–15 досок: долговечные универсальные модели для занятий и почасовой аренды, а также пара премиальных версий для розничного показа. Смешанные модели в одной поставке, цена зависит от общего количества.'
    - q: Вы отправляете морским транспортом в Бразилию?
      a: Да — консолидированные морские перевозки обслуживают бразильские порты для оптовых заказов от 5 до 20 досок, цена рассчитывается по пункту назначения. Экспресс-авиаперевозка доступна для образцов и срочных небольших заказов.
