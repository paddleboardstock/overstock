content_customer_types:
  tagline: Кому мы поставляем
  title: 'Создано для B2B-покупателей,<br />а не для розницы'
  subtitle: 'Paddle Board Overstock производит для четырёх типов заказчиков. У каждого свои приоритеты — и мы закрываем их все.'
  items:
    - title: Владельцы брендов / Private Label
      description: 'Индивидуальная разработка продукта, графика private-label, документация о соответствии под вашим брендом и профильная инженерная поддержка от концепции до контейнера.'
      icon: tabler:palette
      cta: Запросить расчёт OEM/ODM
      cta_href: /request-quotation
    - title: Дистрибьюторы / Оптовики
      description: 'Защита территории, конкурентные оптовые цены, маркетинговые комплекты, обучение по продукту и полная документация о соответствии для вашего рынка.'
      icon: tabler:world
      cta: Подать заявку на дилерство
      cta_href: /dealers-distributors
    - title: Курорты / Прокатные операторы
      description: 'Коммерческая надёжность, консультации по размеру флота, смешанные контейнерные заказы, стратегия запчастей и пакеты снаряжения с брендингом курорта.'
      icon: tabler:beach
      cta: Получить коммерческий пакет
      cta_href: /solutions/resorts
    - title: Спасательные службы / Госструктуры / Профессионалы
      description: 'Конструкция Hypalon/CSM, опции соответствия SOLAS, сертификация под конкретный проект, поддержка тендерной документации и инженерия под NDA.'
      icon: tabler:shield
      cta: Обсудить проект
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Возможности OEM/ODM
  title: 'Что вы получаете<br />от Paddle Board Overstock'
  subtitle: 'Прямой доступ к заводу с полной инженерной, качественной и комплаенс-поддержкой — не трейдинговая компания.'
  columns: 2
  items:
    - title: Кастомизация OEM/ODM
      description: 'Индивидуальный дизайн корпуса, материал труб (PVC или Hypalon/CSM), компоновка консоли, посадочные места, брендинг, цвета и упаковка. От малых доработок до полностью заказной инженерии.'
      icon: tabler:adjustments
    - title: Низкий MOQ, быстрые образцы
      description: 'RIB: 2–5 шт. (существующая форма). SUP: 5–10 шт. на SKU. Собственные формы: 200+ шт. Предсерийные образцы с вашим брендингом за 7–14 дней.'
      icon: tabler:rocket
    - title: Качество серийного уровня
      description: 'Каждое изделие проходит испытание давлением 1,25× номинала в течение 24–48 часов. 99,3 % продукции без дефектов по AQL 2,5 / ISO 2859. Чек-лист качества из 100 пунктов на каждый корпус.'
      icon: tabler:certificate
    - title: Полная документация о соответствии
      description: 'CE по 2013/53/EU (RCD), ISO 9001:2015 (SGS), социальный аудит BSCI, соответствие REACH, маркировка UKCA. Декларация соответствия по каждой модели и данные заводской таблички включены.'
      icon: tabler:file-certificate
    - title: Срок производства 30–45 дней
      description: 'Серийное производство 30–45 дней FOB Циндао. Прототипы за 7–14 дней. Возможна срочная партия. Планы загрузки контейнеров и упаковка ISPM-15 включены.'
      icon: tabler:truck-delivery
    - title: Сервис и запчасти
      description: 'Гарантия 5 лет на лодки/каяки/RIB, 2 года на SUP/аксессуары. Поставка запчастей приоритетной отправкой. Поддержка обработки гарантийных случаев.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Категории продукции
  title: '5 категорий,<br />64 модели с сертификацией CE'
  subtitle: 'От RIB-тендеров 2,4 м до SUP-досок 15 футов — всё производится на нашей площадке ISO 9001 в Циндао.'
  items:
    - title: Лодки RIB
      description: 'От 2,4 до 7,0 м с алюминиевым или стеклопластиковым корпусом. Трубы PVC или Hypalon/CSM. CE по 2013/53/EU. Конфигурации для патрулирования, дайвинга, спасения и коммерческого применения.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Надувные лодки
      description: 'От 2,0 до 5,0 м с алюминиевым, фанерным или надувным настилом. Модели для рыбалки, отдыха и в качестве тендера.'
      icon: tabler:sailboat
      link: /products
    - title: SUP-доски
      description: 'От 9 до 15 футов в исполнении Drop-Stitch 4 и 6 дюймов. Модели all-round, touring, йога и рыбалка. Доступно коммерческое исполнение.'
      icon: tabler:swimming
      link: /products
    - title: Каяки
      description: 'Надувные каяки на 1–3 человека. Модели для отдыха и туризма с настилом Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Спасательные аксессуары
      description: 'Сертифицированные CE спасжилеты, спасательные концы, ремкомплекты, насосы и навигационные огни. Спасжилеты, одобренные USCG Тип III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Сила завода
  title: 'Производство, готовое<br />к аудиту, в Циндао'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Площадка ISO 9001 площадью 12 000 м² — настоящий производитель, а не трейдер</h3>
  items:
    - title: 6 специализированных линий
      description: 'Отдельные линии для RIB, надувных лодок, SUP, каяков, спасательного снаряжения и OEM/ODM. На каждой — свои контрольные точки QC и собственное планирование.'
    - title: 100 % испытаний давлением
      description: 'Каждая надувная камера накачивается до 1,25× номинального давления и выдерживается 24–48 часов. Результаты привязаны к серийному номеру корпуса (HIN).'
    - title: Прослеживаемость каждого корпуса
      description: 'Производственные записи на уровне HIN с 21+ полями данных на корпус: партия материала, ID сварщика, результат испытания давлением, финальная конфигурация и пункт доставки.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Производственная площадка Paddle Board Overstock ISO 9001 на 12 000 м² в Циндао с линиями выпуска RIB

content_compliance:
  tagline: Соответствие и подтверждение качества
  title: 'Документальные доказательства,<br />а не только заявления'
  subtitle: 'Каждое заявление о соответствии подкреплено документацией по конкретной модели, доступной для вашей проверки.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Система менеджмента качества, сертифицированная TÜV Rheinland/SGS. Ежегодные надзорные аудиты. Задокументированные QC-процессы от входного контроля материалов до отгрузки.'
      icon: tabler:certificate
    - title: CE по 2013/53/EU (RCD)
      description: '64 модели с индивидуальными декларациями соответствия. Оценка соответствия по применимым модулям. Регистрация HIN и данные заводской таблички для каждого корпуса.'
      icon: tabler:file-certificate
    - title: Социальный аудит BSCI
      description: 'Ежегодный аудит BSCI силами SGS. Проверенная этичная организация труда, безопасность на рабочих местах и экологический менеджмент по всей площадке.'
      icon: tabler:users
    - title: REACH и UKCA
      description: 'Все материалы PVC и клеи соответствуют регламенту REACH ЕС. Маркировка UKCA доступна для рынка Великобритании. Паспорта безопасности материалов — по запросу.'
      icon: tabler:shield-check

steps:
  title: Процесс OEM/ODM — от ТЗ до контейнера
  items:
    - title: 'Шаг 1: <span class="font-medium">Требования</span>'
      description: 'Пришлите спецификацию продукта, целевой рынок, объём и требования по соответствию. Наша инженерная команда отвечает в течение 48 часов.'
      icon: tabler:file-text
    - title: 'Шаг 2: <span class="font-medium">Предложение</span>'
      description: 'Вы получаете детальное предложение со спецификациями, вариантами материалов, MOQ, ценами, сроками и объёмом сертификации для вашего рынка.'
      icon: tabler:clipboard-list
    - title: 'Шаг 3: <span class="font-medium">Прототип</span>'
      description: 'Предсерийный образец с вашим брендингом за 7–14 дней. Полные испытания качеством при 1,25× номинального давления. Стоимость образца засчитывается в серию.'
      icon: tabler:settings
    - title: 'Шаг 4: <span class="font-medium">Производство</span>'
      description: 'Производство 30–45 дней FOB Циндао после утверждения образца. Контрольные точки QC в процессе, испытания давлением и финальная 100-пунктная проверка каждого изделия.'
      icon: tabler:building-factory
    - title: 'Шаг 5: <span class="font-medium">Поставка</span>'
      description: 'План загрузки контейнера, деревянная упаковка ISPM-15, комплект документации о соответствии и отгрузка FOB Циндао с полным экспортным пакетом.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Процесс производства надувных лодок Paddle Board Overstock OEM/ODM — от проектирования до отгрузки в контейнере

blog_latest:
  title: Отраслевые и технические материалы
