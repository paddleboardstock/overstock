faqs:
  title: Вопросы по B2B-закупкам
  subtitle: 'Частые вопросы брендов, дистрибьюторов и коммерческих операторов о производстве OEM/ODM на Paddle Board Overstock.'
  columns: 2
  items:
    - title: Вы производитель или трейдинговая компания?
      description: 'Мы вертикально интегрированный завод с полным контролем качества, материалов и сроков. Бизнес-лицензию и масштаб производства можно проверить при аудите завода.'
      icon: tabler:building-factory
      category: all
    - title: Как устроен ваш процесс OEM/ODM?
      description: 'От анализа требований (48 ч) через предложение и прототип (7–14 дней) к производству (30–45 дней FOB Циндао). На всех этапах — инженерная поддержка, документация о соответствии и прослеживаемость по каждому корпусу.'
      icon: tabler:route
      category: all
    - title: Каковы ваши требования к MOQ?
      description: 'Лодки RIB: 2–5 шт. на модель (существующая форма), 200+ для собственных форм. SUP-доски: 5–10 шт. на SKU. Доступны смешанные контейнерные заказы. Образцовые заказы от 2–5 шт. для оценки.'
      icon: tabler:sort-ascending
      category: all
    - title: Какие опции кастомизации доступны?
      description: 'Дизайн корпуса, материал труб (PVC или Hypalon/CSM), диаметр труб, компоновка консоли, сиденья, рулевое управление, топливная система, планировка палубы, цвета бренда, логотипы, дизайн EVA-падов, розничная упаковка и брендирование инструкции.'
      icon: tabler:adjustments
      category: all
    - title: Какие документы о соответствии вы предоставляете для нашего рынка?
      description: 'Декларация CE по 2013/53/EU, маркировка UKCA, сертификат ISO 9001 (SGS), отчёт аудита BSCI, соответствие REACH, протоколы испытаний материалов, журналы испытаний давлением и данные заводской таблички по каждой модели. Документация под конкретный рынок — по запросу.'
      icon: tabler:file-certificate
      category: all
    - title: Какие сроки образцов и производства?
      description: 'Предсерийные образцы: 7–14 рабочих дней. Серийное производство: 30–45 дней FOB Циндао. Возможна срочная партия за доплату. В высокий сезон (март–июнь) сроки могут увеличиваться.'
      icon: tabler:clock
      category: all
    - title: Можно ли провести аудит завода или живую видео-экскурсию?
      description: 'Да. Очные аудиты на нашей площадке в Циндао — по предварительной записи за 3–5 дней. Живые видео-экскурсии через WhatsApp/Zoom — сразу. Инспекции третьих сторон (SGS, BV, TÜV) поддерживаются.'
      icon: tabler:video
      category: all
    - title: Какие проверки качества проводятся перед отгрузкой?
      description: 'Испытание удержанием давления 1,25× номинала (24–48 ч), тест на отслаивание швов, финальный чек-лист из 100 пунктов, контроль размеров, визуальный контроль, сверка документации о соответствии и проверка целостности упаковки. Всё по процедурам ISO 9001.'
      icon: tabler:clipboard-check
      category: all

