  title: Одна линейка продуктов,<br />сделано правильно
  subtitle: Надувные доски и аксессуары для SUP — все изготовлено на нашем заводе в Вэйхае.
  items:
    - title: SUP-доски
      description: Всесторонний надувной SUPs от 9 до 12 футов. Стабильный, прочный, комплектуется насосом, веслом, страховочным тросом и рюкзаком.
      icon: tabler:swimming
      link: /supboard
    - title: Туринг SUPs
      description: Более длинные и быстрые доски с туристическим дизайном для исследования озер, рек и побережья.
      icon: tabler:route
      link: /supboard
    - title: Йога и фитнес SUPs
      description: Очень широкие, ультра-стабильные платформы с полноразмерными ковриками для йоги и тренировок на воде.
      icon: tabler:users
      link: /supboard
    - title: Дети SUPs
      description: Более лёгкие, короткие доски, предназначенные для детей — то же drop-stitch качество в упаковке, подходящей для детей.
      icon: tabler:lifebuoy
      link: /products
    - title: Аксессуары
      description: Насосы, весла, спасательные жилеты, привязи, ремонтные наборы и запасные части для каждой доски, которую мы продаем.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Заводская прочность
  title: Почему наши расценки<br />реальны
  content: <h3 class="text-2xl font-bold track-tight dark:text-white sm:text-3xl mb-2">Настоящая фабрика, реальная экономия — каждая плата поставляется с нашего предприятия в Вэйхае</h3>
  items:
    - title: Те же производственные линии, что и у крупных брендов
      description: Наш завод в Вэйхай площадью 12 000 м² производит платы для международных брендов и наши собственные партии излишков на тех же линиях с использованием тех же материалов.
    - title: Совершенно новый, никогда не использовался
      description: Надлишковые запасы — это невостребованные остатки с завершённых производственных заказов — заводской новый товар, полный комплект аксессуаров и с гарантией.
    - title: Без посредников
      description: Доски отправляются с завода в Вэхае прямо к вашей двери — без посредников и наценки розничной торговли.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 м² фабрика в Вэйхае с производственными линиями для надувных SUP
content_compliance:
  tagline: Качество и тестирование
  title: Проверенное качество,<br />документированное
  subtitle: Каждое заявление о качестве подтверждается реальными показателями нашей производственной линии — испытаниями под давлением, протоколами партий и измеренным процентом дефектов.
  items:
    - title: 100 % проверено под давлением
      description: Каждая плата накачивается до номинального давления 1,25 фунта на квадратный дюйм и выдерживается перед отправкой. Если шов, клапан или нить для стежка выходят из строя, доска никогда не покидает завод.
      icon: tabler:shield-check
    - title: 99,3% процент бездефектности
      description: На основе инспекции отгружаемой продукции за последние 12 месяцев — согласно нашим собственным записям инспекций, а не маркетинговым данным.
      icon: tabler:gauge
    - title: Прослеживаемость партии
      description: На каждой плате имеется код производственной партии, поэтому гарантийные претензии и проверки качества относятся к точным материалам и пробегам.
      icon: tabler:clipboard-check
    - title: 2-летняя SUP гарантия
      description: Каждая SUP доска и аксессуары покрываются 2 года — drop-stitch швы, клапаны для надувания и аксессуары включены. Претензии решаются быстро.
      icon: tabler:lifebuoy
steps:
  title: От оформления заказа до воды — как отправляется ваш заказ
  items:
    - title: Шаг 1. <span class="font-medium">Выберите свою доску</span>
      description: Выбирайте из универсальных, туристических, йога-моделей и детских моделей. Наши руководства по покупке помогут вам подобрать размер и стиль доски под вашу греблину.
      icon: tabler:clipboard-list
    - title: Шаг 2. <span class="font-medium">Безопасная оплата</span>
      description: Оплачивайте безопасно через Stripe или PayPal. Принимаются все основные кредитные и дебетовые карты. Аккаунт не нужен — подтверждение заказа приходит на вашу почту.
      icon: tabler:file-text
    - title: Шаг 3. <span class="font-medium">Проверка качества</span>
      description: Каждая плата проходит 100% испытания под давлением с рейтингом 1.25x PSI и проверяется по полному списку качества перед упаковкой.
      icon: tabler:settings
    - title: Шаг 4. <span class="font-medium">Быстрая отправка</span>
      description: Заказы на складе отправляются с нашего завода в Вэйхае в течение 2-3 рабочих дней. Для срочных заказов доступна срочная обработка.
      icon: tabler:building-factory
    - title: Шаг 5. <span class="font-medium">Отслеживаемая доставка</span>
      description: Отслеживал мировые доставки в 50+ стран. Ваша двухлетняя гарантия и оперативная послепродажная поддержка начинаются с дня прибытия платы.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Процесс заказа — от защищённого оформления до отслеживаемой доставки по всему миру
