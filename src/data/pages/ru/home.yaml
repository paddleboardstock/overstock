faqs:
  title: SUP Часто задаваемые вопросы о заказах и продукции
  subtitle: Распространённые вопросы о наших SUP доске распродажи, заказе, оплате, доставке и гарантии.
  columns: 2
  items:
    - title: SUP Сложно научиться?
      description: Вовсе нет. Большинство новичков встают и гребутся уже в первую тренировку. Наши SUP универсальные доски оснащены сверхширокими стабильными платформами, специально разработанными для новичков. Если начать с спокойной воды, вы будете плыть за считанные минуты.
      icon: tabler:swimming
      category: sup
    - title: Каков предел веса?
      description: Наша универсальная SUPs поддержка до 220 фунтов, а платформы для туринга и йоги — до 250 фунтов. На каждой странице продукта указана точная вместимость гонщика, чтобы вы могли подобрать доску под свои нужды.
      icon: tabler:adjustments
      category: sup
    - title: Могу ли я путешествовать с SUPнадувной аппаратом?
      description: Абсолютно. Каждая Paddle Board Overstock доска упаковывается в чемодан размером с рюкзак. Вес всего 18-22 фунта легко носить его на пляж, озеро или через терминалы аэропорта. Перед поездкой проверьте правила багажа авиакомпании.
      icon: tabler:truck-delivery
      category: sup
    - title: Что идёт в коробку?
      description: В Paddle Board Overstock SUP каждом комплекте входят доска, дорожный рюкзак, ручной насос, регулируемое весло, съемный стабилизатор, поводок для спирали и комплект для ремонта.
      icon: tabler:clipboard-list
      category: sup
    - title: Почему ваши цены ниже розничных?
      description: Мы продаем избыточные производственные партии и уцененные товары напрямую с нашего собственного производства в Вэйхае, Китай — без посредников, без наценки розницы. Это означает полные SUP наборы с скидкой до 60% от обычной розничной цены при том же CE-сертифицированном качестве.
      icon: tabler:certificate
      category: orders
    - title: Как оформить заказ и оплатить?
      description: Добавьте ваш SUP набор в корзину и оформите безопасную оплату через Stripe или PayPal. Мы принимаем все основные кредитные и дебетовые карты. Каждый заказ подтверждается по электронной почте с полным счетом-фактурой.
      icon: tabler:file-text
      category: orders
    - title: Вы доставляете по всему миру?
      description: Да. Мы отправляем в 50+ стран по всей Европе, Северной Америке, Азиатско-Тихоокеанскому региону, Ближнему Востоку и Африке. Заказы, имеющиеся на складе, обычно отправляются в течение 2-3 рабочих дней с предоставлением трекинга для каждой посылки.
      icon: tabler:route
      category: orders
    - title: Какая гарантия предоставляется на SUP платы?
      description: 'Каждая SUP плата и аксессуар покрыты 2-летней гарантией — включая саму плату, drop-stitch швы и клапаны для инфляции. Претензии решаются в течение дней, а не недель: оформите онлайн, и мы отремонтируем или заменим товар.'
      icon: tabler:lifebuoy
      category: orders
