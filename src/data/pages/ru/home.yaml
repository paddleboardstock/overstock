content_customer_types:
  tagline: Кому мы служим
  title: Доски для каждого<br />типа паддлера
  subtitle: Будь то ваша первая сессия или пятидесятая, найдется распродажная доска, подходящая вашему стилю катания.
  items:
    - title: Начинающие
      description: Дополнительно широкие, стабильные универсальные доски, которые упрощают вашу первую сессию — большинство новичков встают на доску в течение нескольких минут.
