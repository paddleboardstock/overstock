      cta: Удобно для SUPsновичков
      cta_href: /supboard
    - title: Семьи
      description: Конюшни для всей семьи могут делиться, а также более лёгкие детские модели — снаряжение, которое убирается в машину и накапливается за считанные минуты.
      icon: tabler:beach
      cta: Покупайте семейные пакеты
      cta_href: /products
    - title: Туринговые и фитнес-гребцы
      description: Более длинные и быстрые туристические доски и полные платформы для йоги для гребцов, которые идут всю дистанцию.
      icon: tabler:route
      cta: Покупайте туристические и йога-доски
      cta_href: /supboard
    - title: Рыбаки
      description: Сверхстабильные платформы с креплениями для снаряжения и местом для кулера — отлив с тихой, ровной палубы.
      icon: tabler:lifebuoy
      cta: Рыбалка SUPsв магазине
      cta_href: /products
features:
  id: features
  tagline: Почему стоит покупать у Paddle Board Overstock
  title: Real Factory,<br />Реальные сбережения
  subtitle: Заводские избыточные и SUP распродажные пакеты — сертифицированное качество без розничной наценки.
  columns: 2
  items:
    - title: Скидка до 60% в розничной торговле
      description: Мы продаём заводские запасы и распродажные партии напрямую — без посредников, без розничной наценки. Те же платы, что продаются по полной цене в других местах, по ценам распродажи здесь.
      icon: tabler:rocket
    - title: Полные пакеты
      description: 'Все SUP комплектуются в комплекте: доска, дорожный рюкзак, ручной насос, регулируемое весло, съемный стабилизатор, поводок для спирали и комплект для ремонта.'
      icon: tabler:clipboard-list
    - title: Сертифицированное качество
      description: 13 сертифицированных CE моделей SUP согласно применимым директивам ЕС. Каждая плата проходит 100% испытание под давлением при 1,25x номинального PSI перед отправкой. Уровень бездефектных изделий составляет 99,3% по AQL 2.5.
      icon: tabler:certificate
    - title: Нет MOQ — Приказ первого совета
      description: Избыток запасов означает, что заказы на одиночные единицы приветствуются. Добавьте доску в корзину — оформляете — готово. Нет минимального заказа, нет процесса котировки.
      icon: tabler:adjustments
    - title: Быстрая мировая доставка
      description: Заказы на складе отправляются из Weihai в течение 2-3 рабочих дней. Отслеживал поставки в 50+ стран ЕС, Северной Америки, Азиатско-Тихоокеанского региона и других регионов.
      icon: tabler:truck-delivery
    - title: 2-летняя SUP гарантия
      description: Каждая SUP плата и аксессуары покрываются на 2 года — drop-stitch включая швы, клапаны надувки и аксессуары. Претензии решаются за дни, а не за недели.
      icon: tabler:lifebuoy
