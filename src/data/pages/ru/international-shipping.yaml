process_section:
  tagline: Как работает доставка
  title: От нашего склада до вашего дома
  steps:
    - title: Калькуляция с вариантами доставки
      description: Каждая калькуляция указывает варианты доставки для вашего пункта назначения — экспресс и морская — с предполагаемым временем в пути, чтобы решение не принималось за вас.
    - title: Проверка качества и упаковка
      description: Доски на 100% проходят проверку на давление, затем упаковываются с насосом, веслом, леейшем, плавником, рюкзаком и ремонтным комплектом — тот же полный комплект, который продается в розницу.
    - title: Отправка из Вэяна
      description: Ваша партия покидает нашу логистическую базу с выбранным вами способом доставки, отслеживание от двери до двери предоставляется в тот же день.
    - title: Таможенное оформление
      description: Мы предоставляем коммерческий счёт и упаковочный лист, необходимые для импорта. Импортные пошлины и налоги в вашей стране несет импортер — см. раздел о таможне ниже.
    - title: Доставка и осмотр
      description: Проверьте доставку при получении. Если что-либо повреждено или отсутствует, свяжитесь с нами с фотографиями и номером заказа — см. нашу политику по потерям и повреждениям ниже.
customs_section:
  tagline: Таможня и пошлины
  title: Таможенные пошлины и импортные налоги
  subtitle: Мы делаем обязанности по перевозке явными, а не даем расплывчатые обещания. Вот кто за что несет ответственность.
  items:
    - title: Что мы покрываем
      description: Ваш расчёт включает стоимость доставки до пункта назначения, и мы готовим и предоставляем все экспортные документы — коммерческий счёт, упаковочный лист и отслеживание отправления.
    - title: Что покрывает импортер
      description: Импортные пошлины, НДС/GST и любые налоги страны назначения оплачиваются импортером (вами или вашей компанией) в соответствии с правилами вашей страны. Мы не включаем расплывчатые налоговые обещания в наши расчёты доставки.
    - title: Поддержка таможенного оформления
      description: Наши документы полны и последовательны — корректные коды HS, заявленные значения и спецификации платы — именно поэтому допуск работает гладко. Если вашему брокеру или таможне нужна дополнительная документация, мы их предоставляем.
    - title: Проверьте местные тарифы перед заказом
      description: Ставки пошлин на надувное оборудование для водных видов спорта различаются в зависимости от страны. Проверьте правила импорта вашей страны или спросите по запросу — наши региональные рыночные путеводители содержат таможенные заметки для ключевых рынков.
lost_damaged:
  title: Потерянные или повреждённые грузы
  description: Осмотрите доставку по мере её прибытия. В редком случае, если плата прибивает повреждённой или посылка отсутствует, свяжитесь с нами как можно скорее, сообщите номер заказа и приложите четкие фотографии упаковки и платы. Мы оцениваем каждый случай индивидуально — в зависимости от случая это означает замену детали, замену платы или возврат денег за пострадавший товар. Производственные дефекты покрываются отдельно нашей SUP двухлетней гарантией.
destinations_section:
  tagline: Куда мы отправляем
  title: 50+ стран и растёт
  description: Мы отправляем по всему миру с подробными руководствами по ключевым региональным рынкам. Каждый путеводитель по рынку охватывает типы местных клиентов, примечания по доставке и таможенные советы для этого региона.
  regions_label: Региональные путеводители
  countries_label: Путеводители по странам
faq_section:
  title: Часто задаваемые вопросы по судоходству
  items:
    - q: Сколько времени занимает экспресс-доставка?
      a: Время экспресс-транзита зависит от пункта назначения — мы указываем ориентировочное время транзита для вашей страны при каждом запросе, прежде чем вы что-либо делаете.
    - q: Сколько времени занимает морские перевозки?
      a: Морские грузовые перевозки различаются в зависимости от пункта назначения, порта и расписания плаваний. Мы указываем ориентировочный окно для вашего заказа, и вы получаете отслеживание после отправления груза.
    - q: Какой способ доставки выбрать?
      a: Экспресс для 1–3 досок, образцов или срочного пополнения запасов. Морские перевозки для оптовых заказов на 5–20 бортов, где стоимость за борт важнее скорости. Мы предлагаем оба варианта, чтобы вы могли сравнивать.
    - q: Входят ли импортные пошлины и налоги в стоимость доставки?
      a: Нет. Фрахт указывается отдельно, а импортные пошлины, НДС/НДС и налоги на пункт назначения находятся на импортёре согласно правилам вашей страны. Мы предоставляем полные и точные документы для обеспечения безперебойного оформления.
    - q: Вы отправляете в мою страну?
      a: Мы отправляем товары в 50+ стран. Ознакомьтесь с нашими региональными и страновыми справочниками ниже или просто спросите по запросу — мы подтвердим текущее обслуживание по вашему адресу.
    - q: Могу ли я отслеживать свой заказ?
      a: Да. Каждая отправка — экспресс или морская — включает отслеживание от двери к двери, которое мы делимся с вами в день отправки.
