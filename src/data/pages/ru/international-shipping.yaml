hero:
  tagline: Международное судоходство
  title: Международное судоходство —<br />Экспресс и морские грузоперевозки в 50+ стран
  subtitle: Каждый заказ отправляется из нашей логистической базы в Вэйхае, Китай. Выбирайте экспресс-авиаперевозки для образцов и срочного пополнения запасов, или консолидированные морские перевозки для оптовых заказов малого бизнеса.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Доски упакованы для международной отправки
direct_answer: Paddle Board Overstock отправляется более чем в 50 стран из Вэйхая, Китай. Экспресс-авиаперевозки перевозят 1–3 доски, образцовые заказы и срочные пополнения запасов; консолидированные морские грузоперевозки — экономичный вариант для оптовых заказов на 5–20 бортов. Каждая отправка включает отслеживание от двери до двери, и каждая плата проходит 100% испытания под давлением и упакована полным комплектом аксессуаров перед отправкой.
tldr_points:
  - 'Экспресс-авиаперевозки: 1–3 борта, образцы, срочное пополнение запасов — самый быстрый вариант'
  - 'Морские грузоперевозки: 5–20 оптовых заказов на борт — самая низкая стоимость перевозки за борт'
  - Отслеживание от двери к двери каждой отправке в 50+ стран
  - Фрахт, страхование, таможенное оформление и импортные пошлины указаны в вашей смете — без расплывчатых гарантий
from_china:
  tagline: Судоходство из Китая
  title: Откуда отправляются заказы
  description: Все заказы отправляются с нашей логистической базы в Вэйхае, Китай — сердце нашей производственной и складской деятельности. Вэйхай — крупный прибрежный портовый город в провинции Шаньдун с прямыми морскими и воздушными грузовыми связями, что обеспечивает конкурентоспособность по времени транзита и стоимости перевозок в направлениях по всей Азии, Америке, Африке, Европе и Ближнему Востоку.
modes_section:
  tagline: Два варианта
  title: Экспресс-перевозки или морские грузоперевозки
  subtitle: Правильный способ перевозки зависит от того, насколько быстро вам нужны платы и сколько вы заказываете. Оба варианта указываются при каждом запросе.
  express:
    name: Вариант A — экспресс-доставка
    best_for: Лучше всего подходит для 1–3 плат, образцов и срочного пополнения запасов
    description: Air Express доставляет небольшие заказы и пробные доски к вашей двери за дни, а не недели. Идеально, когда вы тестируете модель перед крупным заказом или пополняете бестселлер в середине сезона.
    features:
      - 1–3 платы, отдельные модели или смешанные образцы моделей
      - Самый быстрый транзит из двух вариантов — по пункту назначения
      - Отслеживание от двери к двери с крупным экспресс-оператором
      - 'Типичное использование: образцы, срочные пополнения запасов, небольшие первые заказы'
  sea:
    name: Вариант B — морские грузоперевозки
    best_for: Лучший вариант для оптовых и розничных заказов на 5–20 плат
    description: Консолидированные морские грузоперевозки являются экономичным выбором для оптовых заказов малого бизнеса. Платы упаковываются в одну консолидированную партию из Вэйхая, что позволяет снизить стоимость перевозок за борт.
    features:
      - 5–20 заказов на розничные и оптовые заказы
      - Самая низкая стоимость перевозки на борт из двух вариантов
      - Консолидированная упаковка — одна отправка, одна расчистка
      - 'Типичное применение: сезонные пополнения запасов, оптовые заказы смешанных моделей'
