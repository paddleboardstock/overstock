hero:
  tagline: Истории успеха
  title: Реальные результаты от<br />строителей водного бизнеса
  subtitle: Узнайте, как клубы, курорты и предприниматели по всему миру построили прибыльную деятельность в сфере водных видов спорта с помощью оборудования и поддержки Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Истории успеха клиентов Paddle Board Overstock
stories:
  - title: Как средиземноморский курорт построил прибыльный бизнес по аренде SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-звездочный морской курорт — Греция
    problem: Курорту требовались водные развлечения премиум-класса для повышения показателей удовлетворенности и создания нового потока доходов, но ему не хватало оборудования, инфраструктуры безопасности и опыта персонала.
    solution: Paddle Board Overstock поставил 50 досок для серфинга с индивидуальной торговой маркой, цвета и логотип курорта, полную систему безопасности, включая спасательную станцию и буйки, а также трехдневную программу обучения персонала, включающую обращение с оборудованием, инструктирование гостей и протоколы безопасности.
    result:
      - Более 300 гостевых активностей в неделю забронировано уже в первый месяц
      - 'Оценка удовлетворенности гостей водными активностями: 4,8/5'
      - 'Новый годовой дополнительный доход: 180 тыс. $'
      - Ноль инцидентов безопасности за первый рабочий сезон
      - Стоимость замены оборудования снижена на 40 % по сравнению с предыдущим поставщиком
    quote:
      text: Paddle Board Overstock не просто доставил доски — они помогли нам создать полноценный гостевой опыт. Наша программа водных видов спорта прошла путь от нуля до курортной вершины за один сезон.
      author: Генеральный директор курорта
    cta_text: Создайте свое решение для курорта
    cta_href: /solutions/resorts
  - title: Как австралийский стартап создал бренд воды за 90 дней
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Начинающий предприниматель — Австралия
    problem: Энтузиаст активного отдыха хотел запустить свой собственный бренд SUP для австралийского рынка, но у него не было опыта производства, отношений с поставщиками и ограниченного капитала.
    solution: Пакет запуска бренда Paddle Board Overstock включал консультации по выбору продукта, индивидуальный логотип и цветовой дизайн, фирменную розничную упаковку с бирками, сертификационную документацию CE и доставку на условиях FOB в Сидней.
    result:
      - Первая партия из 200 досок доставлена за 75 дней с первого контакта
      - Бренд запущен на Shopify + Amazon AU в течение 2 недель после прибытия
      - Первая партия распродана за 45 дней
      - 'Средняя маржа: 55 % от розничной цены'
      - 'Второй заказ: 500 единиц размещены в течение 60 дней после запуска'
    quote:
      text: У меня была идея бренда, но не было знаний о производстве. Paddle Board Overstock буквально держал меня за руку на протяжении всего процесса — от выбора подходящего дизайна доски до распаковки моей первой партии. 90 дней от мечты до доставки.
      author: Основатель австралийского бренда SUP
    cta_text: Запустите свой бренд
    cta_href: /solutions/entrepreneurs
  - title: Как тайский пляжный клуб увеличил количество досок с 10 до 80
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Клуб водных видов спорта — Таиланд
    problem: Небольшому пляжному SUP-клубу на Пхукете нужно было перейти от хобби к профессиональному бизнесу по аренде снаряжения, обслуживающему туристов, но он не смог найти надежного поставщика оборудования с постоянным качеством и ценами.
    solution: Начав со стартового пакета клуба Paddle Board Overstock (10 досок, весла, защитное снаряжение, брендинг), клуб развивался по программе Премиум-пакета в течение 18 месяцев.
    result:
      - Рост с 10 до 80 досок за 18 месяцев при стабильном качестве и ценах
      - Добавлена аренда каяков и водных велосипедов у того же поставщика
      - Индивидуальный фирменный стиль клуба повысил узнаваемость бренда среди туристов
      - Расходы на обслуживание снижены на 60 % по сравнению с прежним бюджетным оборудованием
      - Сейчас более 150 прокатов в день в пик сезона
    quote:
      text: Клубный стартовый пакет был идеальной отправной точкой. По мере того как наш бизнес рос, Paddle Board Overstock рос вместе с нами — то же качество, те же цены, никаких сюрпризов.
      author: Владелец клуба, Пхукет
    cta_text: Запустите свой клубный пакет
    cta_href: /solutions/clubs
  - title: Как сеть курортов Карибского бассейна стандартизировала водные виды спорта в 5 отелях
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Сеть курортов — Карибы
    problem: Сеть роскошных курортов, состоящая из 5 отелей, нуждалась в постоянном качестве и брендировании оборудования для водных видов спорта во всех местах, а также в централизованном планировании закупок и сезонной замены.
    solution: Paddle Board Overstock предоставила комплексный парк из 300 SUP и 100 каяков с единым брендом, общим запасом запасных частей и ежегодным графиком замены с оптовыми ценами.
    result:
      - Стандартизированный гостевой опыт во всех 5 отелях
      - Снижение затрат на 30 % за счет консолидированных закупок и объемных цен
      - Централизованный склад запчастей сократил простои на 80 %
      - Ежегодная программа обновления оборудования устранила аврал в конце сезона
      - Участие гостей в водных видах спорта выросло на 45 % в годовом исчислении
    cta_text: Разработайте программу для вашего курорта
    cta_href: /solutions/resorts
