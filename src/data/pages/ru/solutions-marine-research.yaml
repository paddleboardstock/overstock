content_challenge:
  tagline: Вызов
  title: Требования морских исследований<br />Стабильные, готовые к использованию платформы
  subtitle: Научные рабочие суда должны обеспечивать стабильную платформу для чувствительных приборов, бесшумную работу, чтобы не беспокоить дикую природу, а также гибкую компоновку для различного исследовательского оборудования.
  paragraphs:
    - Морские исследования и экологический мониторинг требуют рабочих судов, выполняющих функции передвижных лабораторий. В отличие от коммерческих и прогулочных судов, исследовательские RIB должны вмещать чувствительные электронные приборы, оборудование для отбора проб воды и донных отложений, а иногда и транспортировку живых образцов — сохраняя при этом стабильную платформу для точного сбора данных.
    - '**Критически важна стабильность платформы** — Гидролокаторы, эхолоты и CTD-зонды (электропроводность, температура, глубина) требуют стабильного корпуса на стоянке и малом ходу. Избыточный кильватерный след или качка корпуса вносит помехи в научные данные. Необходим корпус с глубоким V-образным профилем и хорошими характеристиками остойчивости.'
    - '**Интеграция приборов** — Исследовательским судам нужны точки крепления для антенн GPS, гидроакустических преобразователей, манипуляторов для отбора проб и оборудования записи данных. Пространство консоли должно вмещать несколько дисплеев, распределение питания приборов и надежное хранение чувствительной электроники.'
    - '**Тихая работа** — При морских биологических съемках и экологическом мониторинге шум двигателя и вибрация корпуса могут отпугивать морских обитателей и искажать наблюдения за поведением. Тихие конфигурации подвесных моторов и корпуса со сниженной вибрацией важны для исследовательских задач.'
    - Исследовательские RIB Paddle Board Overstock проектируются со стабильными корпусными платформами, интегрированными системами крепления оборудования и тихими конфигурациями подвесных моторов для научных задач и экологического мониторинга.
content_solution:
  tagline: Наше решение
  title: Специальные исследовательские лодки<br />Для научной и экологической работы
  subtitle: Каждое исследовательское RIB Paddle Board Overstock сконфигурировано как стабильная, настраиваемая платформа для научных приборов и оборудования для отбора проб в полевых условиях.
  list:
    - Стеклопластиковый корпус с глубоким V-образным профилем — отличная остойчивость на стоянке и малых скоростях съемки
    - Плоская планировка палубы с монтажными плитами для сонара, GPS и оборудования отбора проб
    - Консоль, рассчитанная на несколько дисплеев — картплоттер, эхолот, регистратор данных
    - Распределение питания аксессуаров 12 В и 24 В для научных приборов
    - Тихий четырехтактный подвесной мотор — минимальные вибрация и шум при учете живой природы
    - Опциональная конструкция корпуса с малым кильватерным следом для минимальных помех при сборе данных
    - Индивидуальные цвета баллонов для фирменного стиля исследовательских организаций и идентификации флота
content_segments:
  tagline: Профили исследований
  title: Решения для морских наук<br />По типу применения
  subtitle: Различные исследовательские приложения предъявляют уникальные требования к судам — от университетских учебных платформ до судов для экологических исследований и RIB для мониторинга качества воды.
  items:
    - title: Университетские программы морских наук
      subtitle: Учебные платформы, студенческие экскурсии, прибрежные исследования
      description: Университетам морских наук и факультетам океанографии нужны надежные и универсальные рабочие суда для проведения полевых курсов, студенческих исследовательских проектов и прибрежных исследований под руководством преподавателей. Лодка должна быть простой в управлении для студентов под присмотром, достаточно устойчивой для практического использования инструментов и достаточно прочной для частого использования несколькими пользователями в течение академических семестров. Бюджетные ограничения в академических учреждениях делают важными соображениями экономическую эффективность и низкие эксплуатационные расходы.
      features:
        - Стабильная платформа для тренировки студентов по установке и извлечению приборов
        - Простое управление — румпель или одиночная консоль для работы студентов под наблюдением
        - Прочные баллоны из гипалона для частых выходов на берег и работы студентов
        - Крепление оборудования для учебного сонара, диска Секки и приспособлений для отбора проб
        - Экономичный вариант из ПВХ для академических программ с ограниченным бюджетом
    - title: Морские научно-исследовательские институты
      subtitle: Обследование RIB с интеграцией инструментов, GPS и оборудованием для отбора проб
      description: Специализированные морские исследовательские организации, проводящие прибрежные и морские исследования, нуждаются в профессионально настроенных исследовательских RIB со встроенными приборами. На этих судах имеются гидролокационные системы для батиметрического картографирования, профилометры CTD для анализа водной толщи, пробоотборники отложений и оборудование для биологического сбора. Лодка должна обеспечивать устойчивую платформу при низких скоростях съемки, иметь достаточно места на палубе для размещения оборудования и обеспечивать чистое питание 12 В/24 В для электроники.
      features:
        - Интегрированное крепление гидроакустического преобразователя — сквозной монтаж или установка на транце
        - Крепление GPS-антенны и интеграция в консоль для навигации съемочного класса
        - Зона спуска CTD-зонда и пробоотборника воды с надежными точками крепления
        - Вспомогательное распределение питания 12 В/24 В для приборов и регистраторов данных
        - Стабильность на малом ходу (3–6 узлов) для точности съемочных галсов
        - Опциональные А-образная рама или шлюпбалка для спуска более тяжелого оборудования отбора проб
    - title: Мониторинг и охрана окружающей среды
      subtitle: Экологические исследования, наблюдение за дикой природой, оценка среды обитания
      description: Экологические НПО, правительственные учреждения и природоохранные организации проводят морские экологические исследования, мониторинг популяций диких животных и оценку среды обитания. Для этих операций требуются тихие суда с низким уровнем воздействия, которые могут приближаться к уязвимым местам обитания, не беспокоя дикую природу. Лодки должны иметь на борту фотоаппаратуру, GPS для картографирования трансектов и оборудование для отбора проб воды и отложений. Низкий след и минимальный шум двигателя имеют решающее значение для исследований по наблюдению за поведением.
      features:
        - Тихий четырехтактный подвесной мотор — минимальное беспокойство морской фауны
        - Стабильная наблюдательная платформа для фото- и видеофиксации
        - Крепление оборудования для камерных ригов, GPS-трекеров и полевых компьютеров
        - Малая осадка для выхода в прибрежные водно-болотные угодья, мангровые заросли и эстуарии
        - Легко очищаемые палуба и баллоны для дезактивации между точками работ
    - title: Мониторинг и тестирование качества воды
      subtitle: Регулярные отборы проб, отслеживание загрязняющих веществ, контроль соблюдения требований
      description: Организации по мониторингу качества воды регулярно проводят отбор проб в прибрежных зонах, гаванях и внутренних водных путях для отслеживания уровня загрязнения, цветения водорослей и соблюдения экологических норм. Эти операции требуют эффективных и надежных судов для повторного посещения стационарных станций отбора проб. Судно должно иметь оборудование для отбора проб, охладители для хранения проб и оборудование для полевых испытаний, а также легкое мытье палубы между местами отбора проб во избежание перекрестного загрязнения.
      features:
        - Отдельная зона станции отбора проб с термоконтейнером и хранением оборудования
        - Легко очищаемые палуба и поверхности баллонов для дезактивации между точками
        - Интеграция GPS для точного возврата к фиксированным координатам отбора проб
        - Компактные размеры для доступа к закрытым акваториям и узким каналам
        - Экономичный подвесной мотор для выгодных регулярных рейсов отбора проб
