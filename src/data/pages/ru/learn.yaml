hero:
  tagline: Знания о водных исследованиях
  title: Учить
  subtitle: |
    Руководства, учебники и подробные исследования — всё, что вам нужно для исследования<br />
    Вода с уверенностью. От выбора вашего первого SUP до освоения продвинутых техник.
  taglineSection: Знания для каждого гребца. От новичка до профессионала.
featured:
  tagline: Избранные темы
  title: Начните своё путешествие в обучение
  subtitle: Будь вы новичком в водных видах спорта или хотите повысить уровень, наши гиды вам помогут.
  items:
    - title: SUP Основы
      description: Все, что нужно знать начинающему — типы досок, размер весла, стойка и советы для первого дня.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Надувная доска против жесткой доски
      description: Что подходит именно вам? Мы сравниваем портативность, производительность, долговечность и стоимость бок о бок.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Безопасность на воде
      description: Основные знания по безопасности, которые должен иметь каждый гребец — погода, спасательные жилеты, самоспасение и многое другое.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Руководство по материалам
      description: Drop-stitch сердечники, PVC ламиниры, EVA пенопласт для деки — разберитесь, из чего состоит ваша доска.
      icon: tabler:hexagons
      href: /learn/materials
    - title: Руководство по размерам SUP
      description: Найдите подходящую длину, ширину и объем доски для вашего веса, уровня навыков и стиля гребли.
      icon: tabler:ruler
      href: /size-guide
    - title: Промежуточные техники
      description: Улучшите свои навыки гребли с помощью продвинутых приемов, техник поворота и управления на бурной воде.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
