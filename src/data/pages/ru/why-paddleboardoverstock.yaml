reasons:
  tagline: Разница Paddle Board Overstock
  title: Что отличает нас
  isBeforeContent: false
  columns: 3
  items:
    - title: Реальное производство, а не торговля
      description: Мы владеем и управляем фабрикой площадью 12 000 м². Когда вы сотрудничаете с Paddle Board Overstock, вы работаете напрямую с людьми, которые разрабатывают, конструируют и производят ваши продукты — без посредников.
      icon: tabler:building-factory
    - title: Инженерно-ориентированный подход
      description: Наш процесс проектирования начинается с конкретного сценария использования, а не с категории продукта. Мы оптимизируем форму корпуса, выбор материалов и конфигурацию для того, как доска будет использоваться на воде.
      icon: tabler:engine
    - title: Проверенное качество
      description: Каждая плата проходит испытания под давлением до 1,25-кратного номинального давления в течение 24-48 часов до отправки, и 99,3% наших поставок поступают без дефектов — с гарантией.
      icon: tabler:award
    - title: Дизайн Paddler-First
      description: 'Каждая модель начинается с того, как вы греблите: стабильные платформы для новичков, обтекаемые формы для туров и полноразмерные палубы для йоги. Мы разрабатываем для настоящих гребцов, а не для шоурума.'
      icon: tabler:adjustments
    - title: Глобальная логистика
      description: Склад в США в Калифорнии, прямая доставка из Вэйхай, авиаперевозка для срочных заказов. Мы оформляем таможенные документы и документацию по всему миру.
      icon: tabler:truck-delivery
    - title: Пожизненная поддержка
      description: Мы стоим за платами, которые собрали 20 лет назад. Оригинальные запасные части, технические советы, рекомендации по ремонту — наша команда всегда рядом, когда вы нуждаетесь в нас, где бы вы ни находились.
      icon: tabler:lifebuoy
testimonials:
  tagline: Доверяет гребцы по всему миру
  title: Что говорят гребцы
  items:
    - content: My Ocean Voyager справлялся со всем — от спокойных утренних часов у озера до бурных прибрежных послеобеденных дней. Спустя два сезона, он всё ещё выглядит и едет как новый.
      name: — Рекреационный Пэддлер, Калифорния
    - content: Я нервничал, покупая свою первую надувную доску онлайн, но качество было очевидно сразу после надувания. Жёсткая, надёжная и прекрасно отделанная.
      name: — Первый SUP владелец, Германия
    - content: Каждые летние выходные мы гребём всей семьёй. Три доски, никаких проблем, и детям нравятся яркие дизайны.
      name: — Семейный веслач, Австралия
    - content: 'Тестирование давления — это не маркетинговые разговоры: моя доска надёжна на полном давлении и не показывает растяжения после года еженедельного гребли.'
      name: — Weekly Paddler, Нидерланды
