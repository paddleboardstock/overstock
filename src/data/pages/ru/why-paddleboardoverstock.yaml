hero:
  tagline: Почему Paddle Board Overstock
  title: Построен иначе. Построен, чтобы служить долго.<br />Советы директоров, стоящих за Water Adventures по всему миру
  subtitle: Это не просто завод — команда гребцов и инженеров, которые проектируют, тестируют и строят премиальные SUP надувные доски для семей, искателей приключений и клубов по всему миру.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock качество производства и опыт
pillars:
  tagline: Три столпа качества
  title: Почему гребцы по всему миру выбирают Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Разработано для коммерческого использования
      description: Наши доски спроектированы для многолетнего регулярного гребли. PVC Коммерческие drop-stitch усиленные сердечники, UV устойчивые материалы и испытанное оборудование требуют меньшего обслуживания и более долгого срока службы на воде.
      icon: tabler:building-factory
      callToAction:
        text: См. линейку коммерческих продуктов
        href: /products
    - title: Проверено сверх стандартов
      description: Каждая плата надувается до 1,25-кратного номинального давления в течение 24-48 часов перед покидением завода — 100% тестированная на давление, 99,3% без дефектов. Ваша плата доказана как прочная ещё до того, как она попадёт в воду.
      icon: tabler:shield-check
      callToAction:
        text: Посмотрите, как мы проверяем
        href: /quality
    - title: Создано для глобальных условий
      description: 'Продукты, оптимизированные для любого климата: формулы для холодной воды PVC для Европы, материалы, устойчивые к UV, для Ближнего Востока и Австралии, обработки против влажности для Юго-Восточной Азии. Каждая поставка калибруется под климатические условия места назначения.'
      icon: tabler:world
