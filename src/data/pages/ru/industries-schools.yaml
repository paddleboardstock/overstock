hero:
  tagline: Школы и учебные центры водных видов спорта
  title: Решения по оборудованию<br />Для школ SUP и каякинга
  subtitle: Надежное коммерческое оборудование для школ серфинга, обучения серфингу, обучения каякингу и образовательных программ по водным видам спорта любого масштаба.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Доски Paddle Board Overstock SUP для школ и учебных центров
direct_answer: 'Paddle Board Overstock снабжает школы SUP и каякинга по всему миру досками коммерческого уровня, защитным оборудованием и комплектами инструкторов. Наше оборудование создано для ежедневного использования в учебных целях: более толстый ПВХ, усиленные сердечники для стежков и устойчивая конструкция корпуса, которые придают новичкам уверенность и надежность инструкторам. Пакеты включают индивидуальный брендинг, программы запасных частей и учебные ресурсы.'
solution_offerings:
  - title: Стартовый пакет школы
