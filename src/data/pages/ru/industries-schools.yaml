        description: 10–25 универсальных досок для серфинга или прогулочных каяков с устойчивыми платформами для начинающих.
      - title: Доски для инструкторов
        description: Более широкие и длинные доски с повышенной устойчивостью и нескользящим покрытием из ЭВА для тренировок.
      - title: Защитное оборудование
        description: Спасательные жилеты, поводки, свистки и сумки соответствующих цветов.
      - title: Хранение и транспортировка
        description: Штабелируемые стойки для досок, мягкие подставки для каяков и транспортировочные тележки
      - title: Поддержка учебных программ
        description: Шаблоны уроков, контрольные списки по технике безопасности и руководства по развитию навыков
    cta_text: Оформить школьный пакет
    cta_href: /contact
