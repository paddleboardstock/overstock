        description: 3–5 специализированных инструкторских пультов со встроенными креплениями для звуковой системы.
      - title: Станция безопасности
        description: Централизованная станция защитного снаряжения с PFD, радиостанциями, средствами первой помощи и указателями.
      - title: Брендинговый пакет
        description: Полная печать логотипа на досках, веслах, PFD и униформе.
      - title: Программа обслуживания
        description: Ежеквартальные комплекты для технического обслуживания, комплекты запасных частей и обучение ремонту.
    cta_text: Собрать премиум-пакет
    cta_href: /contact
  - title: Пакет школьной франшизы
    subtitle: Для мультилокационных сетей и франчайзинговых операторов
    badge: Enterprise
