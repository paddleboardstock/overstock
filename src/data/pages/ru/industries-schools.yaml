      - title: Стандартизация флота
        description: Идентичное оборудование во всех местах для единообразного обучения студентов
      - title: Центральный заказ
        description: Объединенные заказы, оптовые цены и централизованное управление запасными частями.
      - title: Обучение инструкторов
        description: Сертификация по обращению и техническому обслуживанию оборудования для всех инструкторов.
      - title: Совместный брендинг
        description: Совместный брендинг с франшизой + варианты кобрендинга Paddle Board Overstock
      - title: Поддержка расширения
        description: Консультации по масштабированию, прогнозирование оборудования и настройка нового местоположения
    cta_text: Обсудить план франшизы
    cta_href: /contact
benefits:
  - title: Создан для ежедневного обучения
    description: Более толстый ПВХ и усиленные направляющие выдерживают ежедневное использование учащимися, падения на песок и каменистые приземления.
    icon: tabler:shield
  - title: Стабильные учебные платформы
    description: Более широкий корпус и более плоские рокеры придают новичкам уверенность. Инструкторы сосредотачиваются на обучении, а не на оборудовании.
    icon: tabler:scale
  - title: Легкое хранение и транспортировка
    description: Надувные конструкции хранятся в небольших помещениях. Спущенные доски помещаются в стандартные багажники автомобилей для мобильного обучения.
    icon: tabler:box-seam
  - title: Пользовательский брендинг
    description: Логотипы и цвета школ на каждой доске. Ваш бренд, ваша индивидуальность, а не обычное арендованное снаряжение.
    icon: tabler:brush
content_segments:
  tagline: Профили школ
  title: Решения для образования в области водных видов спорта<br />По типу программы
  subtitle: Школы серфинга, академии серфинга, университетские программы и операторы франчайзинга сталкиваются с различными операционными проблемами — от интеграции учебных программ до стандартизации автопарка в нескольких местах. Мы настраиваем пакеты оборудования в соответствии с образовательной моделью.
  items:
    - title: Независимые школы SUP и каякинга
      subtitle: Учебные центры, управляемые владельцем
      description: Небольшие и средние школы под управлением владельцев-инструкторов, предлагающие уроки SUP, обучение катанию на байдарках и сертификационные курсы. Оборудование должно быть достаточно прочным для ежедневного использования в учебных целях, доступным для бюджета малого бизнеса и достаточно универсальным, чтобы обслуживать как начинающих, так и учащихся среднего уровня в одном парке.
      features:
        - Стабильные универсальные доски SUP и прогулочные каяки для занятий с новичками
        - Доски для инструкторов с повышенной устойчивостью для обучения с воды
        - Включены шаблоны планов занятий и руководства по прогрессии навыков
        - Ежегодная программа обновления снаряжения со скидками при обмене старого
    - title: Программы отдыха для университетов и колледжей
      subtitle: Крупные студенческие парки отдыха
      description: Университетские отделы отдыха управляют клубами весла, программами аренды и учебными курсами в рамках предложений по отдыху в кампусе. Оборудование подвергается пиковому использованию в течение семестров, требует простых систем регистрации/выдачи и должно выдерживать различные уровни навыков – от студентов-новичков до опытных гребцов.
      features:
        - Конструкция из высокопрочного ПВХ, рассчитанная на институциональные циклы эксплуатации
        - Флоты с цветовой маркировкой по уровню подготовки для удобного управления
        - Совместимость с системами учета инвентаря на основе RFID или наклеек
        - Оптовые цены с заказами и условиями оплаты по семестрам
    - title: Школы серфинга и академии серфинга
      subtitle: Программы обучения прибрежному серфингу
      description: Школы серфинга обучают навыкам SUP-серфинга, гребли лежа и серфинга на каяках в океанских условиях. Снаряжение должно соответствовать условиям зоны серфинга — ударопрочность, устойчивость к песку и соленой воде, а также возможность легкого полоскания и возврата между часовыми уроками.
      features:
        - Специализированные серф-формы с усиленными бортами и ударопрочной конструкцией
        - Опции мягких плавников и спиральных страховочных шнуров для безопасности учеников
        - Ткань с быстрым ополаскиванием, высыхающая между сменами занятий
        - Программа замены флота с осмотром и обновлением в конце сезона
    - title: Франчайзинговые и мультилокационные сети
      subtitle: Стандартизированное оборудование в разных местах
      description: 'Операторы с несколькими локациями проводят стандартизированные программы обучения в нескольких городах и регионах. Согласованность парка машин в разных местах имеет первостепенное значение: каждый учащийся должен иметь одинаковый опыт работы с оборудованием независимо от того, какое место франшизы он посещает. Централизованный заказ, единообразие бренда и поддержка масштабирования имеют важное значение.'
      features:
        - Идентичные спецификации флота во всех точках франшизы
        - Централизованные консолидированные заказы со скидками за объем
        - 'Опции кобрендинга: бренд франшизы + кобрендинг Paddle Board Overstock'
        - 'Комплект для открытия новой локации: снаряжение, вывески и стартовый инвентарь'
