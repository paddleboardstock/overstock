content_challenge:
  tagline: Вызов
  title: Почему дайв-центрам нужны<br />специально построенные лодки
  subtitle: Дайвинг-операции предъявляют особые требования к судам — требования, которым универсальные лодки часто не соответствуют.
  paragraphs:
    - Коммерческие дайвинг-центры работают 200–300 дней в году, совершая 3–5 дайв-поездок в день. Каждая поездка требует перевозки 10-20 аквалангов, полного оборудования BCD, регуляторов, ласт, масок, защитного снаряжения, инструкторского снаряжения и пассажиров. Лодка общего назначения просто не сможет справиться с такой интенсивностью эксплуатации.
    - '**Ограниченное пространство на палубе**. Большинство прогулочных судов спроектированы с учетом скорости и комфорта пассажиров, а не управления оборудованием. Когда танки, снаряжение и водолазы находятся в одном пространстве, время подготовки увеличивается, передвижение становится затруднительным, а риски для безопасности растут.'
    - '**Трудная посадка на борт дайвера**. Иностранным туристам, дайверам-новичкам и путешественникам старшего возраста необходим безопасный и легкий вход и выход. Высокая посадка, ограниченная поддержка рук и нестабильные платформы создают дискомфорт и угрозу безопасности, особенно когда дайверы несут 30 кг снаряжения.'
    - '**Коррозия в соленой воде и повреждение ультрафиолетом** — Тропическая среда ускоряет деградацию материала. Стандартные трубки PVC могут выцветать, протекать и требовать замены в течение 3 лет. Коррозия металлических компонентов увеличивает затраты на техническое обслуживание и простои в эксплуатации.'
    - '**Устойчивость в состоянии покоя**. Дайверам нужна устойчивая платформа при подготовке, входе в воду и подъеме на борт. Недостаточная стабильность создает риски для безопасности и негативно влияет на качество обслуживания клиентов.'
    - '**Высокие эксплуатационные расходы**. Экономия топлива имеет значение при выполнении нескольких поездок каждый день. Лодка, которая потребляет больше топлива, напрямую снижает размер прибыли. Коммерческие водолазные операторы больше заботятся о ежедневных эксплуатационных расходах, чем о максимальной скорости.'
content_solution:
  tagline: Наше решение
  title: Создано для реальных<br />водолазных работ
  subtitle: Каждое погружение Aquafarer RIB настроено для конкретных нужд коммерческих дайв-центров, а не адаптировано к конструкции прогулочного судна.
  list:
    - Большая планировка рабочей палубы — предназначена для хранения аквалангов, подготовки оборудования и передвижения дайвера, а не только для сидения пассажиров.
    - Профессиональная система лестниц для дайвинга с поручнями из нержавеющей стали — широкая посадка с низкой ступенькой для безопасного и легкого входа и выхода дайвера.
    - Сверхширокие трубы Hypalon или PVC — обеспечивают устойчивую платформу для посадки и улучшают плавучесть при перемещении дайверов по палубе.
    - Встроенные стеллажи для хранения резервуаров — позволяют снизить вес, освободить палубу и организовать оборудование для более быстрого выполнения рейса.
    - Нескользящая поверхность палубы EVA — снижает риск поскользнуться, когда палуба мокрая и дайверы передвигаются с тяжелым снаряжением.
    - Консоль расположена так, чтобы дайверы были хорошо видны в воде, что крайне важно для контроля безопасности инструктора.
    - Варианты двигателей от 40 HP до 115 HP — одинарная или сдвоенная конфигурация, оптимизированная для экономии топлива при нескольких ежедневных поездках.
    - Конструкция морского класса — прочные материалы трубок, устойчивые к ультрафиолетовому излучению и морской воде, усиленная конструкция для ежедневного коммерческого использования.
    - Индивидуальная конфигурация лестницы и платформы для погружения — в соответствии с вашей рабочей глубиной воды и профилем дайвера.
    - Монтажные пластины оборудования для сонара, GPS и средств связи
content_models:
  tagline: Рекомендуемые модели
