      description: '5,0 м из стекловолокна RIB с лестницей для погружения, стойками для резервуаров, нескользящей палубой и подвесным двигателем 60 HP. Идеально подходит для небольших школ дайвинга и работы в закрытых водоемах, совершающих 1-2 рейса в день. Вместимость: 8 человек.'
    - title: RIB 520 Дайвер
      description: '5,2 м RIB с повышенной устойчивостью, топливным баком увеличенной дальности действия, лестницей для погружения, местом для хранения бака и двигателем на 90 HP. Подходит для прибрежных дайв-центров, совершающих несколько ежедневных поездок. Вместимость: 10 человек.'
    - title: RIB 550 дайвер
      description: '5,5 м RIB с большой планировкой палубы, профессиональной лестницей для дайвинга, стойками для резервуаров и прочными трубами. Предназначен для курортных водолазных работ со смешанными группами пассажиров. Вместимость: 10 человек.'
