hero:
  tagline: Решения для ритейлеров
  title: Доски для гребли для розничных продавцов —<br />Заполните свой магазин доски с избытком запаса SUP
  subtitle: Оптовая поставка новых надувных SUP досок для малого бизнеса, для пляжных магазинов, онлайн-продавцов и спортивных магазинов. Начинайте с 5 досок, смешивайте любые имеющиеся модели и отправляйте в 50+ стран.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Совершенно новые надувные доски, SUP готовые к полкам магазинов
direct_answer: Paddle Board Overstock поставляет совершенно новые надувные SUP доски независимым ритейлерам по всему миру. Оптовые заказы начинаются всего с 5 досок, и вы можете смешивать любые имеющиеся в наличии модели в одной партии — так что небольшой магазин может хранить универсальные, туристические и арт-серии доски без заполнения контейнера. Каждая плата проходит 100% испытания под давлением перед отправкой и покрывается SUP двухлетней гарантией. Заказы отправляются с нашей базы в Вэйхае, Китай, экспресс-авиаперевозкой или консолидированными морскими грузами более чем в 50 стран.
tldr_label: Быстрый ответ от ритейлера
