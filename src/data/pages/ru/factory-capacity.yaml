intro: 'Paddle Board Overstock управляет одним из крупнейших специализированных производств надувных SUP досок в Вэйхае, Китай. Наш завод площадью 12 000 м² разделен на шесть специализированных цехов, работающих параллельно, что позволяет нам выпускать 15 000 досок ежегодно во всех сериях: универсальной, туристической и арт-серии SUP.'
