workshops:
  - title: SUP Производство досок
    description: '4 параллельные сборочные линии для надувных SUP досок. Каждая линия может производить 50–80 досок за смену. Станции цифровой и трафаретной печати работают одновременно. Годовая мощность SUP: 8 000 + досок.'
    output: 8 000 + SUPs/год
  - title: Оформление палубы и EVA отделка
    description: Специализированный цех отделки для арт-серии. Прецизионная EVA резка, ручная укладка узоров на доски и финальная отделка. Годовая мощность покрывает полный ассортимент арт-серии.
    output: Полный ассортимент арт-серии
  - title: Drop-Stitch Ламинирование
    description: 'Линии термоламинации соединяют drop-stitch сердцевины с внешними PVC ламинатами. Кромочные ленты соединяются в три слоя для герметичности и прочности. Годовая мощность: 15 000 + сердцевин.'
    output: 15 000 + сердцевин/год
  - title: Аксессуары и упаковка
    description: 'Линии сборки и упаковки аксессуаров: насосы, весла, страховочные ремни и наборы для ремонта. Доски вакуумно упаковываются, помещаются в коробки и паллетируются для отправки по всему миру.'
    output: Полные комплекты, готовые к отправке
tldr:
  summary: Paddle Board Overstock производит 15 000 досок для гребли в год на собственной фабрике площадью 12 000 м² в Вэхае, Китай. 200–300 квалифицированных работников на двух сменах, прямые продажи гребцам в 50+ странах.
  points:
    - 12 000 м² производственного комплекса в Вэхае
    - 15 000 досок производятся ежегодно
    - 200–300 квалифицированных работников, 2 смены в день
    - Заказы со склада отправляются в течение 2–3 рабочих дней
    - 2-летняя гарантия на каждую доску
