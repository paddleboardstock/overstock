hero:
  tagline: Производственные мощности
  title: Производственные мощности и годовой выпуск
  subtitle: Производство площадью 12 000 м² выпускает 15 000 лодок в год с запасом для масштабирования

intro: Paddle Board Overstock управляет одним из крупнейших специализированных производств надувных лодок в Циндао, Китай. Наш завод площадью 12 000 м² разделён на шесть специализированных цехов, работающих параллельно, что позволяет выпускать 15 000 лодок в год по направлениям SUP, каяки, динги, RIB и снаряжение для безопасности.

highlights:
  - value: 12,000 m²
    label: Общая производственная площадь
    detail: В 6 специализированных цехах
  - value: 15,000
    label: Лодок выпускается в год
    detail: SUP, каяки, RIB, динги, снаряжение для безопасности
  - value: 200-300
    label: Квалифицированные кадры
    detail: Более 25 инженеров, 2 смены/день
  - value: 50+
    label: Страны экспорта
    detail: ЕС, США, Австралия, Ближний Восток, Азия
  - value: 30–45
    label: Стандартный срок производства (дней)
    detail: От подтверждения PO до FOB
  - value: 10+
    label: Лет опыта экспорта
    detail: С 2012 года

workshops:
  - title: Производство сап-досок
    description: '4 параллельные сборочные линии для надувных сап-досок. Каждая линия выпускает 50–80 досок за смену. Станции цифровой и трафаретной печати работают одновременно. Годовая мощность по SUP: более 8 000 досок.'
    output: 8 000+ SUP в год
  - title: Производство лодок RIB
    description: 'Специализированный цех стеклопластиковых корпусов с 6 формовочными станциями для корпусов RIB длиной до 7,6 м. Участок сварки и сборки труб обслуживает 3–5 RIB одновременно. Годовая мощность по RIB: более 2 000 лодок.'
    output: 2 000+ RIB в год
  - title: Надувные лодки и динги
    description: 'Универсальные производственные линии для надувных лодок, каяков и динги. Станции сварки горячим воздухом, ВЧ-диэлектрические прессы и сборочные посты перенастраиваются под структуру заказов. Годовая мощность: более 5 000 единиц.'
    output: 5 000+ единиц в год
  - title: Спасательное оборудование
    description: 'Отдельное чистое производственное помещение для спасательных жилетов и снаряжения безопасности. Выделенные участки шитья, вставки пеноматериала и тестирования. Годовая мощность по жилетам: более 50 000 единиц.'
    output: 'Более 50 000 жилетов в год'

oem_capacity:
  moq: 'SUP: 5–10 шт. | RIB: 2–5 шт. | Каяк/динги: 10–20 шт. | Индивидуальная форма: 200+ шт.'
  lead_time: 'Стандартно 30–45 дней. Образец 15–20 дней. Срочное производство доступно.'
  payment: 'T/T 30% предоплата + 70% перед отгрузкой. Принимаются L/C, Western Union.'
