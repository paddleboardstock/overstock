qc_section:
  tagline: Контроль качества
  title: Процесс тестирования и обеспечения качества
  subtitle: Каждая плата проходит обязательное тестирование перед отправкой. Наша лаборатория качества работает независимо от производства и напрямую подчиняется руководству.
  steps:
    - step: '1'
      title: Инспекция сырья
      desc: PVC а drop-stitch ткани проходят испытания на растяжение, распространение разрывов и UV проверку сопротивления перед началом любой партии в производство.
    - step: '2'
      title: 48-часовой тест на удержание воздуха
      desc: Каждая панельная камера надувается до 125% от номинального давления и удерживается 48 часов. Падение давления более 5% приводит к автоматическому отклонению и повторной проверке шва.
    - step: '3'
      title: Испытания нагрузки и баланса
      desc: Готовые доски загружаются до максимальной номинальной вместимости и проверяются на устойчивость, свободный борт и управляемость. Каждая доска проходит водяные испытания перед окончательной проверкой.
faq_section:
  tagline: FAQ
  title: Часто задаваемые вопросы
  questions:
    - q: Где изготавливаются ваши гребные доски?
      a: Каждая плата изготавливается на нашем собственном заводе площадью 12 000 м² в Вэйхае, Китай. Мы не аутсорсим — проектирование, материалы, сварка, сборка и тестирование происходят под одной крышей, поэтому качество никогда не зависит от сторонних специалистов.
    - q: Почему ваши цены настолько ниже, чем в рознице?
      a: Мы продаём заводские излишки и распродажные партии напрямую с собственного производственного объекта — без посредников, без розничной наценки. Это означает полные SUP упаковки по снижению до 60% от обычных розничных цен, с таким же проверенным качеством.
    - q: Что входит в комплект доски?
      a: 'Все SUP отправляются в комплекте: борт, дорожный рюкзак, ручной насос, регулируемое весло, съемный плавник, поводок с катушкой и комплект для ремонта.'
    - q: Как быстро отправляются заказы?
      a: Заказы на складе покидают наш завод в Вэйхай в течение 2-3 рабочих дней с отслеживаемой поставкой в 50+ стран ЕС, Северной Америки, Азиатско-Тихоокеанского региона и других регионов.
production_flow:
  tagline: Производственный процесс
  title: От материала к готовой плате
  subtitle: Каждая плата проходит 6 производственных этапов с контрольными точками контроля качества на каждом этапе. Нет коротких путей, нет пропусков проверок.
  stages:
    - stage: '01'
      title: Получение материалов и входящий контроль качества
      description: Все поступающие материалы регистрируются по партии/номеру партии в нашей ERP системе.PVC Рулоны ткани, drop-stitch сердечники, клапаны, клеи и оборудование находятся в карантине до подписания контроля качества.
      qc_check: Прочность на растяжение, устойчивость к разрыву, толщиномер, вязкость клея, визуальное сканирование дефектов
      qc_threshold: 100% партий проверено. Отбраковывать, если растяжение < 90 % от спецификации, разрыв < мин или любой визуальный дефект.
      responsibility: Приходящая группа контроля качества (3 инспектора)
    - stage: '02'
      title: CNC Резка и подготовка материалов
      description: Компьютерно оптимизированное вложение позволяет размещать панели на PVC стоке, чтобы минимизировать отходы. CNC Автоматические резные станки поддерживают точность позиционирования 0,1 мм.
      qc_check: Проверка размеров по файлам CAD DXF, проверка качества кромок, проверка количества панелей.
      qc_threshold: Измеряется каждая 20-я панель. Допуск ±0,5 мм. Отклонить партию, если >2 % выходит за пределы допуска.
      responsibility: Руководитель раскройного цеха
    - stage: '03'
      title: Сварка и Drop-Stitch сцепление
      description: Drop-stitch Сердечники соединяются с внешними PVC ламинированными материалами с помощью теплового ламинирования. Трубчатые камеры свариваются РЧ или сваривают горячим воздухом. Рельсовые ленты склеиваются трёхслойным плавом.
      qc_check: Тест на отшлёп каждые 50 единиц, измерение ширины сварки, обзор журнала температуры горячего воздуха, визуальный осмотр шва при подсветке
      qc_threshold: Сила отслаивания не менее 8 Н/см. Допуск ширины сварного шва ±1 мм. Любой видимый ченнелинг = отказ
      responsibility: Контроль качества сварки (2 инспектора в смену)
    - stage: '04'
      title: Сборка и оснастка
      description: 'Панели перемещаются к финальной сборке, где устанавливаются все компоненты: клапаны, D-образные кольца, ручки, крепления для плавников и сумки для переноски. Каждое изделие проходит 100-пунктовый контрольный список сборки.'
      qc_check: Подписание контрольного списка по 100 пунктам на единицу, проверка работоспособности клапана (10 циклов открытия/закрытия), проверка крутящего момента оборудования, визуальный осмотр
      qc_threshold: Политика нулевой терпимости к дефектам компонентов, критичных для безопасности (клапаны, D-образные кольца, ручки). Незначительные косметические дефекты допускаются в рамках строгих косметических норм.
      responsibility: Руководитель группы сборки + линейный контроль качества
    - stage: '05'
      title: Испытание давлением и контроль качества
      description: Каждая камера надувается до 1,25× номинального давления (обычно 20–25 PSI) и выдерживается 24–48 часов. Датчики давления ведут постоянный мониторинг. Камеры с падением давления более 5% отклоняются и отправляются на повторный осмотр швов.
      qc_check: Журнал удержания давления в течение 24 часов, калибровка датчика проверяется ежедневно, показания давления с температурной компенсацией, повторное испытание шва после ремонта
      qc_threshold: Падение давления не более 5% в течение 24 часов при стабильной температуре. Любая камера, превышающая это значение = 100% повторное испытание всей производственной партии.
      responsibility: Лаборатория качества (независимая от производства, подчиняется руководству)
    - stage: '06'
      title: Окончательная проверка и упаковка
      description: Окончательный визуальный и функциональный осмотр. Дефекты поверхности, постоянство цвета, проверка этикетки/БИН, целостность упаковки и комплектность аксессуаров. Единицы упаковываются в вакуумную коробку и укладываются на поддоны для загрузки в контейнеры.
      qc_check: Полная визуальная проверка, контрольный список аксессуаров по SKU, испытание при падении упаковки (1 м, случайная выборка), проверка этикеток/штрих-кодов.
      qc_threshold: Нулевая терпимость к дефектам, влияющим на безопасность. Косметические дефекты допускаются только в строгих пределах. 100% изделий проходят визуальный контроль.
      responsibility: Команда окончательного контроля качества (4 инспектора) + руководитель группы упаковки
workforce:
  tagline: Наши люди
  title: Рабочая сила и опыт
  engineers: 25+
  engineers_detail: Инженеры, занимающиеся исследованиями и разработками, проектированием пресс-форм, лабораторией материалов и производственным инжинирингом. В среднем 7+ лет в производстве надувных изделий.
  shift_pattern: 2 смены в день (07:00–15:30, 15:30–00:00). Дополнительная ночная смена для срочных заказов.
  training: Ежемесячное обучение контролю качества, ежеквартальные учения по технике безопасности, ежегодная оценка навыков. Прежде чем приступить к работе на производственной линии, новые сотрудники проходят 40-часовой вводный курс.
  departments:
    - name: НИОКР и инженерия
      count: 25+
      role: Проектирование изделий, проектирование пресс-форм, лаборатория материалов
    - name: Резка и подготовка материала
      count: 15
      role: Разрезка CNC, подготовка панелей, обработка материалов.
    - name: Сварка и ламинирование
      count: 40
      role: RF-сварка, горячий воздушный сварка, склеивание drop-stitch.
    - name: Декор палубы и финишная отделка
      count: '25'
      role: Укладка палубы EVA, финишная отделка серии с рисунком.
    - name: Сборка и оснастка
      count: 35
      role: Окончательная сборка, установка оборудования, проверка систем
    - name: Контроль качества
      count: 12
      role: Входной контроль качества, текущий контроль качества, окончательная проверка, лабораторные испытания
    - name: Логистика и упаковка
      count: 20
      role: Упаковка, погрузка контейнеров, экспортная документация
    - name: Управление и администрирование
      count: 15
      role: Продажи, закупки, HR, финансы, комплаенс
material_traceability:
  tagline: Отслеживаемость
  title: Отслеживание материалов и контроль партий
  description: Каждой партии сырья присваивается уникальный номер лота в нашей системе ERP. От поступления через производство до готового продукта, спецификации каждой доски связаны с исходной партией поставщика. Это обеспечивает полную прослеживаемость на всех этапах для любых запросов по качеству.
  system: Пользовательская ERP (внутренняя система) + физические теги партий для каждого рабочего задания
  coverage: 100% производственных материалов — PVC, ткань drop-stitch, EVA пена, клеи, клапаны, крепеж, упаковка
  records_retained: 10 лет
