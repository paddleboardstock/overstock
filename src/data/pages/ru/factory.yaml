testing_section:
  tagline: Контроль качества
  title: Процесс испытаний и обеспечения качества
  description: Каждая лодка проходит обязательные испытания перед отгрузкой. Наша лаборатория качества работает независимо от производства и отчитывается напрямую перед руководством.
  steps:
    - title: Входной контроль материалов
      desc: Ткани ПВХ, Hypalon и drop-stitch проходят испытания на растяжение, на устойчивость к распространению разрыва и проверку стойкости к УФ-излучению до поступления любой партии в производство.
    - title: 48-часовой тест на удержание воздуха
      desc: Каждая камера баллона накачивается до 125 % номинального давления и удерживается в течение 48 часов. Падение давления более чем на 5 % приводит к автоматической отбраковке и повторной проверке швов.
    - title: Испытания нагрузкой и балансировкой
      desc: Готовые лодки загружаются до максимальной номинальной вместимости и проверяются на устойчивость, высоту надводного борта и управляемость. Каждое судно проходит ходовые испытания на воде перед финальной инспекцией.
case_studies:
  tagline: OEM-проекты
  title: Кейсы сотрудничества с брендами и OEM-партнёрами
  description: От концепции до контейнера — как мы помогаем мировым брендам запускать и масштабировать линейки надувных судов.
  labels:
    challenge: Задача
    solution: Решение
    result: Результат
  cards:
    - challenge: Европейскому ритейлеру товаров для активного отдыха требовалась линейка SUP под собственной маркой с уникальной графикой настила, экологичным ПВХ и упаковкой, готовой к розничной продаже, — со сроком поставки 60 дней.
      solution: Мы разработали файлы цифровой печати, подобрали ПВХ, соответствующее REACH, и сократили количество этапов выборки с 3 до 1, разместив команду дизайнеров непосредственно на нашей фабрике в Циндао.
      result: 55 дней от подписанного заказа до FOB. 2 400 единиц в 4 SKU. Повторный заказ размещён до прибытия первого контейнера.
    - challenge: Американскому стартапу в сфере водного спорта требовался высокоэффективный каяк drop-stitch с индивидуальной формой корпуса, упаковкой с двойным брендингом и сертификацией BSCI для выхода в розницу.
      solution: Мы доработали существующую пресс-форму каяка drop-stitch с изменённым профилем rocker, разработали дизайн упаковки с двойным брендингом и предоставили полный комплект документов аудита BSCI.
      result: Успешно размещены в 3 крупных американских сетях товаров для активного отдыха. Более 5 000 единиц в первый год с показателем продаж 98 %.
    - challenge: Австралийскому дистрибьютору требовалась линейка RIB с сертификацией CE, индивидуальными цветами баллонов, опцией Hypalon и соответствием австралийскому стандарту AS 1799.
      solution: Мы изготовили предсерийные образцы в 4 вариантах цвета баллонов, закупили CSM Hypalon у японского поставщика и организовали независимые испытания на соответствие AS 1799.
      result: Линейка из 3 моделей RIB выведена на рынок AU/NZ. Затем — победа в государственном тендере на 12 патрульных RIB.
production_flow:
  tagline: Производственный процесс
  title: От материала к готовой лодке
  subtitle: Каждая лодка проходит 6 этапов производства с контрольными точками контроля качества на каждом этапе. Никаких ярлыков, никаких пропусков проверок.
  stages:
    - stage: '01'
      title: Получение материалов и входящий контроль качества
      description: Все поступающие материалы регистрируются по номеру партии/партии в нашей ERP-системе. PVC Рулоны ткани, сердцевины для стежков, клапаны, клеи и фурнитура помещаются на карантин до утверждения контроля качества.
      qc_check: Прочность на разрыв (ASTM D751), сопротивление разрыву (ISO 4674), толщиномер, вязкость клея, визуальное сканирование дефектов
      qc_threshold: 100% партий проверено. Отбраковывать, если растяжение < 90 % от спецификации, разрыв < мин или любой визуальный дефект.
      responsibility: Приходящая группа контроля качества (3 инспектора)
    - stage: '02'
      title: Резка с ЧПУ и подготовка материала
      description: Компьютерно-оптимизированная раскладка позволяет размещать панели на складе PVC, чтобы минимизировать отходы. Автоматические станки с ЧПУ обеспечивают точность позиционирования 0,1 мм.
      qc_check: Проверка размеров по файлам CAD DXF, проверка качества кромок, проверка количества панелей.
      qc_threshold: Измеряется каждая 20-я панель. Допуск ±0,5 мм. Отклонить партию, если >2 % выходит за пределы допуска.
      responsibility: Руководитель раскройного цеха
    - stage: '03'
      title: Сварка и прошивка
      description: Сердечники с вышивкой прикрепляются к внешним ламинатам PVC с помощью термоламинирования. Трубчатые камеры сварены радиочастотной сваркой или сваркой горячим воздухом. Рельсовые ленты склеены трехслойным сплавлением.
      qc_check: Испытание на отслаивание каждые 50 единиц (ASTM D751), измерение ширины сварного шва, просмотр журнала температуры горячего воздуха, визуальный осмотр шва при подсветке.
      qc_threshold: Сила отслаивания не менее 8 Н/см. Допуск ширины сварного шва ±1 мм. Любой видимый ченнелинг = отказ
      responsibility: Контроль качества сварки (2 инспектора в смену)
    - stage: '04'
      title: Сборка и оснащение
      description: 'Лодки переходят к окончательной сборке, где все компоненты соединяются: корпус + трубы, установлены клапаны, D-образные кольца, ручки, плавники и крепления сумки для переноски. Каждый блок соответствует контрольному списку сборки из 100 пунктов.'
      qc_check: Подписание контрольного списка по 100 пунктам на единицу, проверка работоспособности клапана (10 циклов открытия/закрытия), проверка крутящего момента оборудования, визуальный осмотр
      qc_threshold: 'Политика отсутствия дефектов в отношении критически важных для безопасности элементов (клапаны, D-образные кольца, ручки). Незначительная косметика: AQL 2,5 (ISO 2859)'
      responsibility: Руководитель группы сборки + линейный контроль качества
    - stage: '05'
      title: Испытание давлением и контроль качества
      description: Каждую камеру накачивают до давления, превышающего номинальное в 1,25 раза (обычно 20–25 фунтов на квадратный дюйм) и выдерживают в течение 24–48 часов. Датчики давления ведут непрерывную регистрацию. Камеры, в которых падение давления превышает 5%, бракуются и отправляются на повторный контроль швов.
      qc_check: Журнал удержания давления в течение 24 часов, калибровка датчика проверяется ежедневно, показания давления с температурной компенсацией, повторное испытание шва после ремонта
      qc_threshold: Падение давления не более 5% в течение 24 часов при стабильной температуре. Любая камера, превышающая это значение = 100% повторное испытание всей производственной партии.
      responsibility: Лаборатория качества (независимая от производства, подчиняется руководству)
    - stage: '06'
      title: Окончательная проверка и упаковка
      description: Окончательный визуальный и функциональный осмотр. Дефекты поверхности, постоянство цвета, проверка этикетки/БИН, целостность упаковки и комплектность аксессуаров. Единицы упаковываются в вакуумную коробку и укладываются на поддоны для загрузки в контейнеры.
      qc_check: Полный визуальный осмотр, контрольный список аксессуаров для каждой артикулы, испытание упаковки на падение (1 м, случайная выборка), проверка этикетки/штрих-кода
      qc_threshold: AQL 2,5 для крупных дефектов, AQL 4,0 для мелких. Нулевая терпимость к дефектам безопасности. 100% единиц визуально проверено
      responsibility: Команда окончательного контроля качества (4 инспектора) + руководитель группы упаковки
workforce:
  tagline: Наши люди
  title: Рабочая сила и опыт
  engineers: 25+
  engineers_detail: Инженеры, занимающиеся исследованиями и разработками, проектированием пресс-форм, лабораторией материалов и производственным инжинирингом. В среднем 7+ лет в производстве надувных изделий.
  shift_pattern: 2 смены в день (07:00–15:30, 15:30–00:00). Дополнительная ночная смена для срочных заказов.
  training: Ежемесячное обучение контролю качества, ежеквартальные учения по технике безопасности, ежегодная оценка навыков. Прежде чем приступить к работе на производственной линии, новые сотрудники проходят 40-часовой вводный курс.
  departments:
    - name: НИОКР и инжиниринг
      count: 25+
      role: Проектирование изделий, проектирование пресс-форм, лаборатория материалов
    - name: Резка и подготовка материала
      count: 15
      role: Резка с ЧПУ, подготовка панелей, погрузочно-разгрузочные работы.
    - name: Сварка и ламинирование
      count: 40
      role: RF-сварка, сварка горячим воздухом, склеивание методом капельного шва
    - name: Корпус RIB (FRP)
      count: 30
      role: Укладка стекловолокна, гелькоут, вакуумная упаковка
    - name: Сборка и оснащение
      count: 35
      role: Окончательная сборка, установка оборудования, проверка систем
    - name: Контроль качества
      count: 12
      role: Входной контроль качества, текущий контроль качества, окончательная проверка, лабораторные испытания
    - name: Логистика и упаковка
      count: 20
      role: Упаковка, погрузка контейнеров, экспортная документация
    - name: Руководство и администрирование
      count: 15
      role: Продажи, закупки, HR, финансы, комплаенс
material_traceability:
  tagline: Прослеживаемость
  title: Отслеживание материалов и контроль партий
  description: В нашей ERP-системе каждой партии сырья присваивается уникальный номер партии. От прибытия и производства до готовой продукции спецификация каждой лодки связана с исходной партией поставщика. Это обеспечивает полную прослеживаемость любого запроса на качество или соответствие требованиям.
  system: Пользовательская ERP (внутренняя система) + физические теги партий для каждого рабочего задания
  coverage: 100% производственных материалов — PVC, Hypalon, ткань для стежка, клеи, клапаны, фурнитура, упаковка.
  records_retained: 10 лет (в соответствии с требованиями CE 2013/53/ЕС)
  suppliers:
    - material: Морской ПВХ
      source: Китайские и корейские поставщики
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Японский поставщик
      certified: ISO 9001, REACH
    - material: Ткань drop-stitch
      source: Собственное ткацкое производство + внешний партнер
      certified: Внутренний контроль качества + поставщик ISO 9001
    - material: Клапаны и фурнитура
      source: Китайские OEM-поставщики
      certified: ISO 9001, сертификаты на материалы на партию
qc_dashboard:
  tagline: Контроль качества в цифрах
  title: Показатели контроля качества
  subtitle: Реальные данные о прохождении/непрохождении нашей производственной линии. Наша лаборатория качества работает независимо от производства и подчиняется непосредственно руководству.
  stats:
    - value: 100%
      label: Агрегаты испытаны под давлением
      detail: Каждая лодка, каждая камера, каждая партия
    - value: <5%
      label: Максимально допустимое падение давления
      detail: Более 24 часов при 1,25× номинальном давлении
    - value: AQL 2,5
      label: Порог серьезного дефекта
      detail: Согласно стандарту отбора проб ISO 2859
    - value: 24–48h
      label: Продолжительность удержания давления
      detail: В зависимости от категории товара
    - value: 1,25×
      label: Испытательное давление в сравнении с номинальным
      detail: Запас прочности в каждой камере
    - value: 0%
      label: Допуск на дефекты безопасности
      detail: Клапаны, D-образные кольца, швы, плавучесть

