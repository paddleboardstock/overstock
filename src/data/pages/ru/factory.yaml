hero:
  tagline: Фабрика
  title: Фабрика и производство
  subtitle: 12 000 м² интегрированного производства — от сырья до готовой платы
intro:
  - Как заводской бренд **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock он контролирует каждый этап производства — от доставки PVC сырья и drop-stitch материалов до финальной предпоставочной проверки готовой платы. Наше производственное предприятие в зоне экономического развития Вэйхай занимает площадь 12 000 квадратных метров и включает специализированные мастерские PVC по резке, термогерметизации и сварке, отделке настила, финальной сборке и тестированию качества.
  - Объединяя проектирование, инженерию, прототипирование, производство и тестирование под одной крышей, мы устраняем неэффективность контрактного производства и сохраняем прямой контроль над качеством сборки, выбором материалов и сроками поставки. Каждая плата, покидающая нашу мастерскую, строится нашими сотрудниками, на нашем оборудовании, в соответствии с нашими стандартами.
