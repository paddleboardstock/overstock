workshops_section:
  tagline: Цеха
  title: Производственные цеха
  workshops:
    - title: Раскрой ПВХ и подготовка материалов
      description: Автоматические ЧПУ-раскройные машины обрабатывают ПВХ, Hypalon и drop-stitch ткани с субмиллиметровой точностью. Компьютерно-оптимизированный расклад минимизирует отходы материала.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Сварка труб и термосварка
      description: Специализированный сварочный цех с машинами термосварки и RF-прессами. Горячевоздушные сварочные аппараты соединяют ПВХ-камеры труб, а RF-сварка создает высокопрочные герметичные швы, превышающие требования ISO 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: Производство RIB-корпусов — стеклопластик
      description: Корпуса RIB-лодок производятся методом ручной выкладки стеклопластика с полиэфирными и винилэфирными смолами. Каждый слой раскатывается вручную и вакуумируется для стабильного качества.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: Печать и декорирование SUP
      description: SUP-доски декорируются цифровой печатью для полноцветной графики и шелкографией для логотипов. Цифровые принтеры создают фото-качественные рисунки палубы.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Финальная сборка и оснастка
      description: Сборочная линия, где стеклопластиковые корпуса и ПВХ-трубы соединяются, монтируются двигатели, подключаются системы управления и проводка. Каждая лодка проходит 100-точечный чек-лист.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Контроль качества и инспекция
      description: Каждая готовая лодка проходит обязательное тестирование удержания воздуха, верификацию швов и полную проверку систем перед отправкой. Лаборатория качества работает независимо от производства.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
