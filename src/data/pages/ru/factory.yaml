hero:
  tagline: Фабрика
  title: Фабрика и производство
  subtitle: 12 000 м2 интегрированного производства — от сырья до готовой лодки
intro:
  - Как фабричный бренд **Aquafarer Qingdao Manufacturing Hub**, Aquafarer контролирует каждый этап производства — от поступления сырья до финальной проверки готовой лодки. Наше производственное помещение в зоне экономического развития Циндао занимает 12 000 квадратных метров и включает специализированные цеха для раскроя ПВХ, термосварки труб, производства стеклопластиковых RIB-корпусов, цифровой печати SUP, финальной сборки и контроля качества.
  - Объединяя дизайн, инженерию, прототипирование, производство и тестирование под одной крышей, мы устраняем неэффективность контрактного производства и сохраняем прямой контроль над качеством сборки, выбором материалов и сроками поставки. Каждая лодка, покидающая наш цех, построена нашими людьми, на нашем оборудовании, по нашим стандартам.
