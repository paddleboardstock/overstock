workshops_section:
  tagline: Мастер-классы
  title: Производственные мастерские
  workshops:
    - title: PVC Резка и подготовка материала
      description: Автоматические CNC резные машины PVC drop-stitch обрабатывают и обрабатывают ткани с домиллиметровой точностью. Компьютерно оптимизированное вложение минимизирует потери материала и гарантирует, что каждая панель соответствует своим размерным требованиям до сварки.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Сварка и термогерметизация
      description: Специализированная сварочная мастерская с термогерметичными машинами и радиочастотными диэлектрическими прессами. Сварочные аппараты с горячим воздухом соединяют drop-stitch и предотравляют ламинированные сердечники и рельсовые ленты, а RF-сварные швы обеспечивают высокопрочные герметичные швы.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Оформление палубы и EVA отделка
      description: 'Здесь формируются колоды серии Art: панели из пенопласта с точной вырезкой EVA выкладываются в полные формы, склеиваются и отделяются вручную для получения крепкого, комфортного и прочного покрытия — фирменного стиля каждой доски серии арт.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Печать и декорация
      description: SUP Платы украшают с помощью цифровой печати для полноцветной графики и трафаретной печати для логотипов и повторяющихся узоров. Цифровые принтеры создают фотокачественные дизайны настилов, а трафаретная печать обеспечивает надёжные и яркие брендовые отметки.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Окончательная сборка и такелажная установка
      description: Сборочная линия, где доски получают клапаны, D-образные кольца, ручки, ребра и крепления поводка. Каждая плата следует 100-пунктовому чек-листу сборки, подписанному руководителем команды.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Тестирование и инспекция качества
      description: Каждая готовая плата проходит обязательное тестирование на удержание воздуха, проверку отслоения шва и полную системную проверку перед отправкой. Наша лаборатория качества работает независимо от производства и отчитывается напрямую перед руководством.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
