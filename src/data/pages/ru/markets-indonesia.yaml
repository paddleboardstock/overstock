hero:
  tagline: Индонезия
  title: Оптовые SUP борды для<br />Индонезийский бизнес
  subtitle: Балийские магазины водных видов спорта, островные курорты и операторы по всему архипелагу — совершенно новые доски из 5 единиц, смешанные модели, доставленные из Китая.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Дополнительные SUP доски для индонезийских курортов и магазинов водных видов спорта на Бали
direct_answer: Paddle Board Overstock поставляет совершенно новые надувные доски в SUP запасе индонезийским предприятиям — магазинам водных видов спорта на Бали, островным курортам от Ломбока до Гиллиса и дальше, пляжным клубам и операторам аренды. Оптовые заказы начинаются с 5 досок, смешанных моделей в одной партии, отправленных из Вэйхая, Китай, экспресс-авиаперевозкой или консолидированными морскими перевозками. Каждая доска проходит 100% испытания под давлением и покрывается SUP двухлетней гарантией.
tldr_points:
  - Оптовая покупка с 5 плат — смешанные модели, цены по общему объёму
  - Обслуживает экономику водных видов спорта Бали и островные курорты по всей стране
  - Короткие грузовые маршруты Китай–Индонезия, воздушные или морские
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: SUP Индонезийский рынок
  paragraphs:
    - Индонезия — одна из крупнейших экономик водных видов спорта в Азии, а Бали — её бьющееся сердце. От пляжных клубов Семиняк и Чангу до спокойных лагун Санура и Нуса Дуа — гребные доски встречаются повсюду — гребли на рассвете над рифами, SUP занятия йогой, экскурсии по лагунам и программы гостиниц в отелях. За пределами Бали, Ломбок, острова Гили и растущая туристическая сцена по всему архипелагу следуют той же схеме.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: UV Прочность, производительность и ремонтируемость важнее, чем блеск каталога. Заказы включают от 5 до 20 досок, смешанных для уроков, аренды и розничной выставки.
  customer_types:
    - title: Магазины водных видов спорта Бали
      description: Известные операторы Sanur, Seminyak и Canggu, SUP расширяя линии для серфинга, дайвинга и снорклинга.
    - title: Островные курорты и пляжные клубы
      description: Курорты и пляжные клубы на Бали, Ломбоке и Гиллис проводят гостевые программы по веслам и SUP йоге.
    - title: Операторы туров и аренды
      description: Лагунные и мангровые туроператоры, а также почасовая аренда стендов обновляют автопарки сезонно.
shipping_section:
  title: Корабль в Индонезию
  paragraphs:
    - Индонезия — один из самых коротких грузовых маршрутов от нашей базы в Вэйхае, Китай. Экспрессные авиаперевозки доставляют образцы и 1–3 бортовых заказа быстро в Денпасар и Джакарту; Consolidated sea freight обслуживает 5–20 оптовых заказов через Танджунг Приок, Танджунг Беноа и другие порты. Оба варианта предлагаются с предполагаемым временем транзита для вашего пункта назначения.
    - Мы предоставляем коммерческие счета и оформление упаковочного списка, необходимые для оформления, с корректными HS-кодами и заявленной стоимостью. Импортные пошлины и налоги оплачиваются импортером по индонезийским правилам.
  customs_note: Допуск на спортивное снаряжение в Индонезии зависит от документации — работайте с таможенным брокером (PPJK), чтобы подтвердить текущее пошлинное и налоговое оформление. Мы предоставляем полные, последовательные документы и быстро отвечаем на запросы брокера.
faq_section:
  title: Часто задаваемые вопросы по Индонезии
  items:
    - q: Насколько быстро движутся грузы из Китая на Бали?
      a: Индонезия — один из ближайших грузовых направлений от Вэйхая. Экспресс-авиаперевозки в Денпасар или Джакарту — самый быстрый вариант для проб и небольших заказов; консолидированные морские грузоперевозки предлагаются с временем транзита для оптовых заказов. Оба варианта указаны в вашей смете.
    - q: Подходят ли доски для ежедневной аренды в UV тропических районах?
      a: Да — drop-stitch PVC мы поставляем автопарки в 50 странах, рассчитанные на ежедневную аренду, рассчитанные на+ ежедневную аренду. Стандартный уход (после промывания солёной воды, затенённое хранение) обеспечивает их в эксплуатации в течение многих сезонов солнечного времени на Бали.
    - q: Как выглядит заказ в магазине водных видов спорта?
      a: Обычно 5–15 досок, смешанных между стабильными универсальными моделями для уроков и аренды, а также несколькими премиальными арт-изданиями для розничной витрины — одна отправка, цена зависит от общего количества.
    - q: Вы можете поддержать наш PPJK документами?
      a: Да. Каждый заказ отправляется с коммерческим счетом-фактурой и упаковочным листом с правильными кодами HS и заявленной стоимостью, и мы быстро реагируем, когда вашему брокеру нужны дополнительные документы.
