testimonial:
  quote: Что отличает Paddle Board Overstock, так это их материаловедение. Они не просто собирают компоненты — они самостоятельно разрабатывают соединения PVC, параметры сварки и компоновку конструкции. Эта вертикальная интеграция проявляется в конечном продукте.
  author: Дэвид Парк
  title: Менеджер по развитию продуктов
  company: Bluewater Sports Equipment
  location: Австралия
sections:
  - title: Ядро Drop-Stitch
    standard: Рабочее давление 12–15 фунтов на квадратный дюйм
    description: Тысячи внутренних полиэфирных нитей соединяют верхний и нижний слои, создавая жесткую структуру при давлении 12–15 фунтов на квадратный дюйм. Это та же технология, которая используется в профессиональных досках для серфинга и надувных гоночных лодках. Плотность стежков оптимизирована для каждой модели для достижения идеального баланса жесткости и веса.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Схема drop-stitch ядра
  - title: Морской класс PVC
    standard: Сварные плавлением | Испытано на УФ/соленую воду/истирание
    description: Многослойная ламинированная ткань PVC, предназначенная для морской среды. Каждый слой сваривается плавлением, а не склеивается, что исключает риск расслоения. Протестировано на стойкость к ультрафиолетовому излучению (ASTM G154, более 1000 часов), коррозии в соленой воде (ISO 9227) и истиранию (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Слой ПВХ
  - title: Hypalon Трубы
    standard: CSM резина | Устойчивость к УФ/химическим воздействиям/экстремальным температурам
    description: Каучук Hypalon (CSM), используемый в моделях RIB, обеспечивает превосходную стойкость к ультрафиолетовому излучению и химическому воздействию по сравнению со стандартным PVC. Hypalon трубки сохраняют гибкость при экстремальных температурах и устойчивы к разрушению под воздействием топлива и масла. Все швы прокладываются вручную сертифицированными специалистами.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Воздушный пол палубы
    standard: Надувные лодки высокого давления | Заменяет фанеру/алюминий.
    description: Система надувных полов высокого давления заменяет традиционные полы из фанеры или алюминиевых реек. Сокращает время установки, общий вес и объем хранения, обеспечивая при этом достаточную жесткость для стояния, рыбалки и ходьбы. Протестировано на выдержку распределенной нагрузки более 200 кг.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Надувное дно (Air Deck)
