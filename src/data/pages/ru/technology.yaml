testimonial:
  quote: Меня убедила конструкция. Швы с плавной сваркой вместо клея, drop-stitch сердечник, который кажется твёрдым на 15 PSI градусов, и нет шатания, когда я отступаю назад, чтобы повернуть. Два года — никаких проблем.
  author: Марта Келлер
  title: Подтвержденный покупатель
  company: Гребец по озерам
  location: Германия
sections:
  - title: Ядро Drop-Stitch
    standard: PSI Рабочее давление 12-15
    description: Тысячи внутренних полиэстеровых нитей соединяют верхний и нижний слои, создавая жёсткую структуру на уровне 12-15 PSI. Это та же технология, что используется в профессиональных гребных досках. drop-stitch Наша плотность оптимизируется для каждой модели для идеального баланса жёсткости и веса.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Диаграмма ядра DS
  - title: Морской класс PVC
    standard: Сварка плавом |UV / солёная вода / испытания на абразию
    description: Многослойная PVC ламинированная ткань, рассчитанная на морские условия. Каждый слой сварен плавно, а не клеен, что устраняет риск расслоения. Тестировался на UV устойчивость (1 000+ часов), коррозию от солёной воды и истирание.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Слой
  - title: EVA Система палуб
    standard: Цепкие, удобные, шаблоны из арт-серии
    description: EVA Полнопластовая пена обеспечивает сцепление, амортизацию и фирменный стиль арт-серии. Панели с точной вырезкой выкладываются в бесшовные узоры — без печатной графики, без воска.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Колода
  - title: Трёхслойная рельсовая система
    standard: Сварка слиянием | Усиленная в зоне наибольшего напряжения
    description: Боковые части доски выполнены в трёхслойной сварке слиянием и обернуты вокруг края доски — это зона наибольшего напряжения на любой надувной доске. Именно здесь дешёвые доски ломаются в первую очередь; наши доски усилены.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Система боковых частей доски
