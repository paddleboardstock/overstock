timeline:
  - year: '2012'
    title: Фонд морского производства
    body: Paddle Board Overstock началась как специализированная мастерская по производству надувных досок в Вэйхае, Китай, ориентированная на морское мастерство и изготовление досок. Ранняя цель заключалась в создании надёжных надувных изделий с практическим инженерным опытом и производственной дисциплиной.
  - year: '2015'
    title: Первые экспорты
    body: Первоначальные экспортные заказы поступили в Японию и Корею, что ознаменовало Paddle Board Overstock выход компании на международные рынки. Компания начала обслуживать гребцов и любителей водных видов спорта за пределами Китая.
  - year: '2018'
    title: Расширение завода
    body: Перемещение на производственное помещение площадью 12 000 м². Добавлены линии радиочастотной сварки и drop-stitch производственные мощности, что позволило увеличить масштабное производство и улучшить системы контроля качества.
  - year: '2020'
    title: Создан центр исследований и разработок
    body: Открыт специализированный центр исследований и разработок с лабораторией тканей PVC, резервуаром для гидродинамических испытаний и студией моделирования CAD/FEA. Разработка продукта расширилась, сосредоточившись на облегченной конструкции, повышенной долговечности и дизайне, ориентированном на пользователя.
  - year: '2022'
    title: Глобальный рост
    body: Расширено до 14 инженеров по НИОКР и 200+ сотрудников. Доски доходили до гребцов по всей Европе, Америке и Азиатско-Тихоокеанскому региону, отправляя их в 50+ стран.
  - year: '2024'
    title: Студия инноваций и дизайна
    body: Запустили полноценную студию дизайна и инноваций для новых серий плат — от концепции до производства. Расширили наши фирменные колоды для арт-серий и платформы для путешествий.
  - year: '2026'
    title: Создавая будущее разведки водных ресурсов
    body: Сегодня Paddle Board Overstock продолжает разрабатывать надувные SUP доски, снаряжение для гребли и индивидуальные морские решения — связывая людей и организации с водами мира.+ Обслуживаются 50 стран, мощность составляет 15 000 единиц в год.
content_founding:
  tagline: Начало
  title: Родился на набережной
  subtitle: 'Paddle Board Overstock начался в прибрежной мастерской в Вэйхае с одной доской и мечтой: создавать надувные гребные доски, способные справляться с реальными морскими условиями.'
  paragraphs:
    - В 2012 году наши основатели заметили пробел на рынке — большинство надувных досок были либо доступными, но ненадёжными, либо качественными, но чрезвычайно дорогими. Они считали, что есть место для производителя, который обеспечивает и качество, и ценность.
    - Первый корпус был построен вручную, испытан в местных водах и доработан на основе реальных отзывов рыбаков и мелких коммерческих операторов. Этот цикл обратной связи — создавайте, тестируйте, слушайте, улучшайте — остается сегодня в основе нашей инженерной философии.
    - К 2015 году слухи распространились за пределы Вэйхая. Гребцы и магазины водных видов спорта по всей Азии начали запрашивать доски. То, что начиналось как локальная мастерская, превращалось в глобальный бренд.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Ранняя производственная мастерская и производство
content_growth:
  tagline: Рост и инновации
  title: От мастерской до объекта площадью 12 000 м²
  subtitle: Постоянные инвестиции в людей, оборудование и технологические процессы Paddle Board Overstock превратились в современное морское производственное предприятие.
  paragraphs:
    - С ростом спроса росло и наше предприятие. Мы расширились с небольшой мастерской до фабрики площадью 12 000 м² с выделенными производственными линиями SUP для плат, аксессуаров и защитного снаряжения.
    - Мы инвестировали в CNC режущие машины, оборудование для высокочастотной сварки, производственные линии с дропшвами и комплексные испытательные установки — что позволило нам контролировать все аспекты качества производства.
    - Сегодня наша команда из 200-300 человек включает морских инженеров, материаловед, специалистов по контролю качества и квалифицированных мастеров — многие из которых работают Paddle Board Overstock с нами с самого начала.
founder:
  tagline: Познакомьтесь с основателем
  title: Построен водителем
  subtitle: Основатель Дэвид Чен объединяет производственный опыт и давнюю страсть к водным видам спорта — сочетание, определяющее Paddle Board Overstock подходы к разработке продуктов.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: Дэвид Чен — основатель Paddle Board Overstock
  story:
    - Дэвид Чен вырос на побережье Вэйхая, где море было не местом для отдыха, а образом жизни. В юности он провёл, гребли, катаясь на парусах и рыбачи в Жёлтом море — опыт, который дал ему интуитивное понимание того, что нужно выдерживать гребным доскам.
    - До основания Paddle Board Overstock Дэвид провёл десять лет в морском производстве, работая в сферах производства, качества и международной торговли. Он руководил производственными и качественными программами для европейского и североамериканского рынков, на собственном опыте изучая ожидания мировых гребцов.
    - 'В 2012 году он основал Paddle Board Overstock компанию с простой миссией: создавать надувные гребные доски, которым он доверял бы свою семью на воде. Этот личный стандарт — буду ли я использовать это? — остаётся финальным испытанием для каждого продукта, который покидает завод.'
    - Сегодня Дэвид руководит стратегией продукта и руководит командой исследований и разработок, лично рассматривая новые разработки и тестируя прототипы на водах у Вэйхая. Он считает, что отличные продукты рождаются благодаря пониманию как инженерии, так и опыта.
philosophy:
  tagline: Философия бренда
  title: Инженерная свобода на воде
  body: Свобода на воде – это не только движение. Он представляет собой открытие новых мест, создание впечатлений на свежем воздухе, соединение людей с природой и выполнение профессиональных миссий. Инженерия делает эту свободу возможной.
  pillars:
    - title: Надежность прежде всего
      body: Водные среды требуют доверия.Paddle Board Overstock Продукция разработана с учётом стабильности, долговечности, безопасности и стабильной работы.
    - title: Человеко-ориентированный дизайн
      body: Продукты должны служить людям, а не технологии. Каждое дизайнерское решение начинается с понимания того, как люди используют свои доски, где исследуют и с какими трудностями сталкиваются.
    - title: Доступное исследование
      body: Вода не должна принадлежать только экспертам.Paddle Board Overstock Создаёт оборудование, которое позволяет большему числу людей безопасно ощущать реки, озёра, океаны и прибрежные условия.
    - title: Непрерывные инновации
      body: Инновации – это не только создание новых продуктов. Улучшается каждая деталь — материалы, конструкции, производство и пользовательский опыт.
engineeringDna:
  tagline: Инженерная ДНК
  title: Как Paddle Board Overstock Создаёт Продукты
  areas:
    - title: Материаловедение
      body: Paddle Board Overstock сосредоточен на выборе подходящих материалов для различных морских условий. Основные аспекты включают устойчивость к истиранию, UV устойчивость, стабильность под давлением и долговечность.
      items:
        - Устойчивость к истиранию
        - UV Устойчивость
        - Стабильность давления
        - Долгосрочная долговечность
    - title: Структурное проектирование
      body: Надувные сапборды требуют точного баланса между жёсткостью, весом, портативностью и стабильностью. Инженерия Paddle Board Overstock сосредоточена на оптимизации этих факторов с помощью drop-stitch основной технологии и продвинутого построения швов.
      items:
        - Жесткость
        - Оптимизация веса
        - Портативность
        - Стабильность
    - title: Точность производства
      body: 'Каждое изделие проходит контролируемые процессы: подготовку материала, прецизионную резку, сварку и склеивание, сборку, проверку качества и проверку работоспособности.'
      items:
        - Подготовка материала
        - Точная резка
        - Сварка и склеивание
        - Сборка и контроль качества
    - title: Разработка пользовательских сценариев
      body: Продукты разрабатываются с учётом реальных приложений для гребли — досуга, приключений, семейного использования и туринга — гарантируя, что каждая модель соответствует конкретным требованиям окружающей среды.
      items:
        - Отдых
        - Приключение
        - Семья
        - Туринг
