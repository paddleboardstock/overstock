hero:
  tagline: Наша команда
  title: Люди за Paddle Board Overstock<br />— Инженерное воплощение свободы на воде
  subtitle: Основана в 2012 году в Вэйхае, Китай, Paddle Board Overstock была создана инженерами-маринистами, материаловедами и энтузиастами водных видов спорта, которые верили в доступность профессиональных надувных паддлбордов для людей по всему миру.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock фото всей команды — инженеры, производство и руководство
founding:
  tagline: Наше основание
  title: От прибрежной мастерской<br />до предприятия площадью 12 000 м²
  subtitle: Paddle Board Overstock была основана командой инженеров-маринистов с десятилетиями совместного опыта в проектировании надувных SUP, drop-stitch строительстве и международном производстве товаров для водных видов спорта.
  items:
    - title: 'Основана: 2012'
      description: Создана в Вэйхае, Китай — крупном морском центре с богатым наследием судостроения.
      icon: tabler:calendar
    - title: 200–300 сотрудников
      description: Включая 14+ инженеров R&D, специалистов по контролю качества и производственных техников.
      icon: tabler:users
    - title: Предприятие площадью 12 000 м²
      description: Специализированный производственный завод с 6 производственными линиями для SUP досок и аксессуаров.
      icon: tabler:building-factory
    - title: Услуги предоставляются в 50+ странах
      description: Экспорт в Европу, Америку, Ближний Восток, Азиатско-Тихоокеанский регион и Африку.
      icon: tabler:globe
leadership:
  tagline: Лидерство
  title: Руководство и инженерное лидерство
  subtitle: Наша управленческая команда объединяет глубокую экспертизу в морской инженерии, международной торговле и управлении качеством.
