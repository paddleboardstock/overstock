hero:
  tagline: Наша команда
  title: 'Люди, стоящие за Aquafarer<br />— инженерия свободы на воде'
  subtitle: 'Основанная в 2012 году в Циндао (Китай), Aquafarer была создана морскими инженерами, специалистами по материалам и любителями водного спорта, верившими, что профессиональные надувные плавсредства должны быть доступны во всём мире.'
  image:
    src: /images/team-all.webp
    alt: Общее фото команды Aquafarer — инженерия, производство и руководство
founding:
  tagline: Основание компании
  title: 'От прибрежной мастерской<br />до площадки в 12,000 м²'
  subtitle: 'Aquafarer основана командой морских инженеров с многолетним совокупным опытом в проектировании надувных лодок, работе с PVC/Hypalon и мировом производстве морского оборудования.'
  items:
    - title: "Год основания: 2012"
      description: 'Основана в Циндао (Китай) — крупном морском центре с глубокими кораблестроительными традициями.'
      icon: tabler:calendar
    - title: 200-300 сотрудников
      description: 'Включая более 50 инженеров-разработчиков, специалистов по контролю качества и производственных техников.'
      icon: tabler:users
    - title: Площадка 12,000 м²
      description: 'Собственный завод с 6 производственными линиями для RIB, надувных лодок и SUP-бордов.'
      icon: tabler:building-factory
    - title: 'Более 50 стран'
      description: 'Экспорт в Европу, Америку, на Ближний Восток, в Азиатско-Тихоокеанский регион и Африку.'
      icon: tabler:globe
leadership:
  tagline: Руководство
  title: 'Менеджмент и инженерное руководство'
  subtitle: 'Наша команда руководителей объединяет глубокую экспертизу в морской инженерии, международной торговле и управлении качеством.'
  columns: 3
  items:
    - title: Основатель и генеральный директор
      name: 'Toby Liu'
      description: 'Более 15 лет в морском производстве. Ранее возглавлял НИОКР в крупной китайской судостроительной компании. Обладатель нескольких патентов в области проектирования надувных лодок.'
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: Главный инженер
      name: 'Zhang Wei'
      description: 'Более 20 лет в области обработки PVC/Hypalon и проектирования корпусов deep-V. Бывший технический директор европейской морской инженерной компании.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Руководитель НИОКР
      name: 'Chen Ming'
      description: 'Доктор наук в области материаловедения. Специализируется на технологии drop-stitch и высокочастотной сварке. Более 10 лет в текстильных композитах.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Директор по производству
      name: 'Liu Qiang'
      description: 'Более 18 лет в бережливом производстве и оптимизации производственных линий. Обладатель Six Sigma Black Belt. Внедрял системы качества ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Менеджер по качеству
      name: 'Wang Fang'
      description: 'Более 12 лет в морском контроле качества. Сертифицированный аудитор CE и ISO. Контролирует испытания каждой производственной партии.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Директор по продажам и операциям'
      name: 'Helen Lee'
      description: 'Более 15 лет в международной B2B-торговле. Управлял партнёрствами OEM/ODM более чем в 30 странах. Свободно владеет 4 языками.'
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Философия дизайна
  title: 'Инженерный подход к дизайну<br />— каждая деталь важна'
  subtitle: 'Наша инженерная философия строится на трёх принципах, которые определяют каждый наш продукт.'
  list:
    - 'Надёжность прежде всего: каждый продукт Aquafarer проходит испытания в реальных условиях — от спасательных операций в холодной воде до проката в тропических курортных зонах. Мы сознательно закладываем запас прочности там, где это важнее всего.'
    - 'Производственная точность: наши производства используют CNC-раскрой, высокочастотную сварку и автоматизированные испытания давлением. Каждый шов, каждый клапан, каждый фитинг соответствует задокументированным спецификациям.'
    - 'Постоянные инновации: наша команда R&D непрерывно оценивает новые материалы, методы производства и улучшения конструкции. Мы не ждём проблем — мы их предвосхищаем.'
cta:
  title: 'Хотите обсудить проект с нашей командой?'
  subtitle: 'Наши инженеры готовы проконсультировать по выбору продукции, кастомизации и партнёрствам OEM/ODM.'
  actions:
    - variant: primary
      text: Свяжитесь с нашей командой
      href: /contact
    - text: Посмотреть наши продукты
