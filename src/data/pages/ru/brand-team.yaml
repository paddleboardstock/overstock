philosophy:
  tagline: Философия дизайна
  title: Дизайн, основанный на инженерии<br />— Каждая деталь важна
  subtitle: Наша инженерная философия строится на трех принципах, которые определяют каждый созданный нами продукт.
  list:
    - 'Надежность прежде всего: каждая Paddle Board Overstock продукция проходит испытания на сопротивление реальным условиям — от экспедиций в холодной воде до аренды на тропических пляжах. Мы усиливаем конструкцию там, где это критично.'
    - 'Точность производства: наши предприятия используют CNC резку, высокочастотную сварку и автоматизированные испытания давления. Каждый шов, каждый клапан, каждая деталь соответствуют документированным спецификациям.'
    - 'Постоянные инновации: наша команда НИОКР постоянно оценивает новые материалы, методы производства и улучшения дизайна. Мы не ждем проблем — мы предвидим их.'
