hero:
  tagline: Процесс
  title: Производственный процесс
  subtitle: От сырья до готового к морю доски — каждый шаг под нашим контролем
  back_label: Назад на фабрику
  back_link: /factory
intro: В отличие от брендов, которые передают производство сторонним фабрикам, Paddle Board Overstock они владеют и управляют всей своей производственной цепочкой. Такая вертикальная интеграция позволяет нам поддерживать строгий контроль качества на каждом этапе и обеспечивать стабильное качество продукции партия за партией. Вот как на нашем предприятии изготавливается плата.
steps:
  - step: '01'
    title: Приём и инспекция материалов
    description: Каждая поступающая партия PVC ткани, drop-stitch сердечника, EVA пенопласта и фурнитуры проходит проверку по спецификациям. Образцы ткани тестируются на прочность на растяжение, равномерность толщины и UV устойчивость перед выпуском в производство. Несоответствующие материалы изолируются и возвращаются.
    duration: 1–2 дня
  - step: '02'
    title: Автоматическая PVC резка
    description: Утверждённые ткани укладываются на автоматическую CNC резку и вырезают с субмиллиметровой точностью. Компьютерно оптимизированное вложение позволяет минимизировать отходы — обычно ниже 5%. Разрезанные панели маркируются по модели платы и камере, затем упаковываются для передачи в сварочную мастерскую.
    duration: 2–4 часа на набор доски
  - step: '03'
    title: Термогерметизация и сварка труб
    description: Панели приклеиваются и склеиваются с помощью термогерметических машин с горячей сваркой на воздухе при контролируемых температурах 200–600 °C. Основные швы усилены радиочастотной диэлектрической сваркой для герметичных, высокопрочных соединений. Готовые камеры надуваются до рабочего давления 1,25× для 30-минутной проверки удержания воздуха.
    duration: 1–2 дня на доску
  - step: '04'
    title: Оформление палубы и EVA отделка
    description: 'Здесь формируются колоды серии Art: панели из пенопласта с точной EVA вырезкой укладываются в полные формы, склеиваются и отделяются вручную. Крепкие, комфортные и долговечные — фирменный стиль каждой доски серии искусств.'
    duration: 1–2 дня
  - step: '05'
    title: SUP Печать и декорация
    description: SUP Графика на плате применяется с помощью цифровой печати для полноцветных фотодизайнов и трафаретной печати для прочных логотипов и повторяющихся узоров. Отпечатки отверждаются и герметизируются для UV устойчивости к истиранию.
    duration: 1–2 дня
  - step: '06'
    title: Окончательная сборка и такелажная установка
    description: 'Платы получают свои окончательные компоненты: клапаны затягиваются и проходят тестирование функционала, устанавливаются D-образные кольца, ручки и коробки для ребрей, а также закрепляется крепление поводка. Каждая плата следует 100-пунктовому контрольному списку сборки с обязательным одобрением на каждом этапе.'
    duration: 2–3 дня
  - step: '07'
    title: Тестирование и инспекция качества
    description: 'Каждая готовая плата проходит обязательную проверку качества: тест на удержание воздуха в камере, проверку работы систем, проверку крутящего момента крепежного элемента и косметический осмотр. Индивидуальные и прототипные конструкции также проходят испытания на воде, охватывающие скорость, управляемость, устойчивость и выносливость.'
    duration: 1–2 дня
  - step: '08'
    title: Упаковка и транспортировка
    description: Доски сдуваются, скручиваются и упаковываются в дорожные рюкзаки с насосом, веслом, плавником, поводком и комплектом для ремонта, а затем упаковываются для курьерской и грузовой доставки. Каждая посылка маркируется моделью, серийным номером и местом назначения. Мы отправляем в 50+ стран мира.
    duration: 1 день
