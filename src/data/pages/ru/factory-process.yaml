tldr:
  summary: Paddle Board Overstock проходит строгий многоэтапный производственный процесс от проверки сырья до резки, сварки, декорирования палубы и EVA отделки, сборки, испытания давлением при 1,25-кратном номинальном давлении и окончательного контроля качества. 100% плат испытываются под давлением, 99,3% без дефектов.
  points:
    - 'Инспекция сырья: испытание на растяжение, разрыв, UV'
    - Автоматическая резка CNC и высокочастотная сварка методом РЧ
    - Ручная сборка EVA арт-доски с блоками, не выцветающими со временем
    - Держать давление 1,25x рабочее в течение 24-48 часов на каждом устройстве
    - Финальная проверка каждой платы на 100 пунктов
