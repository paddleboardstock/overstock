hero:
  tagline: Paddle Board Overstock Академия
  title: Учебный центр
  subtitle: Руководства и учебные пособия для любого уровня навыков — от SUP основ до продвинутых методов спасения.
categories:
  - level: Новичок
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Основы
        desc: Изучите основы гребли с веслом стоя — стойку, технику удара и баланс.
        slug: beginner-sup-guide
      - title: Техники весла
        desc: Гребок вперед, подметание, вытягивание и низкий подъем — освойте основные движения весла.
        slug: sup-paddle-guide
      - title: Безопасность превыше всего
        desc: Основные правила техники безопасности, включая проверку погодных условий, использование PFD, правила использования поводка и самоспасение.
        slug: sup-safety-guide
  - level: Средний
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Основы туризма
        desc: Планирование многочасовых весла — навигация, гидратация, темп и чтение прогнозов ветра.
        slug: touring-sup-guide
      - title: Погода Ридинг
        desc: Интерпретируйте морские прогнозы, определяйте структуру облаков и изучайте влияние ветра на воду.
        slug: weather-planning-water-sports
      - title: Основы навигации
        desc: Чтение карт, использование компаса, путевые точки GPS и планирование маршрута для плавания по побережью.
        slug: sup-navigation-guide
      - title: Приливная осведомленность
        desc: Понимание циклов приливов, течений и того, как они влияют на время и маршрут запуска.
        slug: understanding-tides
  - level: Передовой
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Планирование многодневной поездки
        desc: Логистика экспедиции — выбор снаряжения, планирование питания, протоколы безопасности и контакты в случае чрезвычайной ситуации.
        slug: sup-travel-guide
      - title: Спасательные методы
        desc: Протоколы самоспасения, спасения товарищей и буксировки на открытой воде.
        slug: sup-self-rescue
      - title: Ночная гребля
        desc: Навигация в темное время суток — требования к освещению, запоминание маршрута, групповое общение и предупреждение об опасностях.
        slug: sup-navigation-guide
  - level: Обслуживание
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Чистка и уход
        desc: Промывание пресной водой, защита UV, предотвращение плесени и правильные методы сушки после каждой тренировки.
        slug: inflatable-sup-maintenance
      - title: Руководство по хранению
        desc: Лучшие практики хранения надувных досок — спуск воздуха, складывание, контроль температуры и срок службы.
        slug: inflatable-sup-storage
      - title: Основы ремонта
        desc: Устраните небольшие проколы, неплотности швов и проблемы с клапанами с помощью ремонтных комплектов PVC и методов заплатки.
        slug: inflatable-sup-repair
      - title: Техническое обслуживание клапана
        desc: Определите типы клапанов (Halkey-Roberts, Boston, Leafield), очистите их от мусора и замените неисправные штоки.
        slug: inflatable-sup-repair
knowledge_center_tagline: Центр знаний
knowledge_center_title: Руководства и знания о паддлбордах
knowledge_center_subtitle: Экспертные руководства и советы по покупке для паддлбордистов любого уровня.
knowledge_sections:
  - title: Технологии и конструкция досок
    tagline: Внутри вашей паддлборд-доски
    desc: Как строятся надувные паддлборды — сердечники drop-stitch, слои ламината, палубы EVA и заводское тестирование под давлением.
    guides:
      - title: Как изготавливаются паддлборды
        desc: От резки материалов и ламинации до 100% тестирования под давлением — смотрите, как каждая доска покидает завод.
        href: /factory/process
      - title: Технология сердечника Drop-Stitch
        desc: Как тысячи внутренних нитей создают жесткую накачиваемую конструкцию с высоким давлением.
        href: /learn/drop-stitch-core
      - title: Справочник материалов
        desc: Рейтинги ден (denier), веса ткани, UV устойчивость и материалы палубы объяснены.
        href: /learn/materials
      - title: Технология надувных досок
        desc: Сварные швы, конструкция борта и клапанные системы, которые удерживают доску жесткой и герметичной.
        href: /learn/inflatable-technology
  - title: Руководства по покупке
    tagline: Выбор правильной доски
    desc: Все, что нужно для выбора вашей первой — или следующей — надувной доски SUP, от размера до конструкции.
    guides:
      - title: Как выбрать надувную SUP
        desc: Ключевые факторы — конструкция, толщина, установка плавников и включенные аксессуары.
        href: /guides/how-to-choose-your-sup/
      - title: Что такое стоячие заплывы на паддлборде?
        desc: Дружелюбное введение в спорт, снаряжение и почему надувные доски облегчают старт.
        href: /guides/what-is-sup
      - title: Надувная доска против жесткой доски
        desc: Сравните i SUP и жесткие эпоксидные доски по портативности, долговечности, производительности и стоимости.
        href: /compare/inflatable-vs-hardboard
      - title: Руководство по размерам SUP
        desc: Найдите подходящую длину, ширину и объем доски для вашего веса, уровня навыков и стиля гребли.
        href: /size-guide
  - title: Навыки и безопасность
    tagline: Гребите с уверенностью
    desc: Практические знания для каждой сессии — основы для начинающих, безопасность на воде, уход и ремонт.
    guides:
      - title: SUP Основы — Руководство для новичка
        desc: Все, что нужно знать начинающему — типы досок, размер весла, стойка и советы для первого дня.
        href: /v2/beginner-sup-guide
      - title: Основы безопасности на воде
        desc: Проверка погоды, выбор PFD, правила использования привязи, самоспасение и лучшие практики групповой гребли.
        href: /learn/water-safety
      - title: SUP Обслуживание и уход
        desc: Очистка, хранение, защита UV и советы по уходу за надувными SUP досками.
        href: /v2/inflatable-sup-maintenance
      - title: Основы ремонта досок
        desc: Устраните небольшие проколы, неплотности швов и проблемы с клапанами с помощью ремонтных комплектов PVC и методов заплатки.
        href: /v2/inflatable-sup-repair
