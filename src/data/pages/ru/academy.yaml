hero:
  tagline: Aquafarer Академия
  title: Учебный центр
  subtitle: Руководства и учебные пособия для любого уровня навыков — от SUP основ до продвинутых методов спасения.
categories:
  - level: Новичок
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Основы
        desc: Изучите основы гребли с веслом стоя — стойку, технику удара и баланс.
        slug: beginner-sup-guide
      - title: Техники весла
        desc: Гребок вперед, подметание, вытягивание и низкий подъем — освойте основные движения весла.
        slug: sup-paddle-guide
      - title: Безопасность превыше всего
        desc: Основные правила техники безопасности, включая проверку погодных условий, использование PFD, правила использования поводка и самоспасение.
        slug: sup-safety-guide
  - level: Средний
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Основы туризма
        desc: Планирование многочасовых весла — навигация, гидратация, темп и чтение прогнозов ветра.
        slug: touring-sup-guide
      - title: Погода Ридинг
        desc: Интерпретируйте морские прогнозы, определяйте структуру облаков и изучайте влияние ветра на воду.
        slug: weather-planning-water-sports
      - title: Основы навигации
        desc: Чтение карт, использование компаса, путевые точки GPS и планирование маршрута для плавания по побережью.
        slug: sup-navigation-guide
      - title: Приливная осведомленность
        desc: Понимание циклов приливов, течений и того, как они влияют на время и маршрут запуска.
        slug: understanding-tides
  - level: Передовой
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Планирование многодневной поездки
        desc: Логистика экспедиции — выбор снаряжения, планирование питания, протоколы безопасности и контакты в случае чрезвычайной ситуации.
        slug: sup-travel-guide
      - title: Спасательные методы
        desc: Самоспасение, Т-спасение, спасение эскимосов на байдарках и протоколы буксировки на открытой воде.
        slug: sup-self-rescue
      - title: Ночная гребля
        desc: Навигация в темное время суток — требования к освещению, запоминание маршрута, групповое общение и предупреждение об опасностях.
        slug: sup-navigation-guide
  - level: Обслуживание
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Чистка и уход
        desc: Ополаскивание пресной водой, защита от ультрафиолета, предотвращение появления плесени и правильная сушка после каждого сеанса.
        slug: inflatable-sup-maintenance
      - title: Руководство по хранению
        desc: Лучшие практики хранения надувных досок и лодок — сдувание, складывание, контроль температуры и срок годности.
        slug: inflatable-sup-storage
      - title: Основы ремонта
        desc: Устраните небольшие проколы, неплотности швов и проблемы с клапанами с помощью ремонтных комплектов PVC и методов заплатки.
        slug: inflatable-sup-repair
      - title: Техническое обслуживание клапана
        desc: Определите типы клапанов (Halkey-Roberts, Boston, Leafield), очистите их от мусора и замените неисправные штоки.
        slug: inflatable-sup-repair
knowledge_center_tagline: Центр знаний
knowledge_center_title: Морское оборудование и отраслевые справочники
knowledge_center_subtitle: Экспертные знания и руководства по покупке для морских профессионалов, операторов флота и любителей водных видов спорта.
knowledge_sections:
  - title: RIB Знание лодок
    tagline: Жесткие направляющие для надувных лодок
    desc: Все о лодках RIB — конструкция корпуса, материалы, выбор двигателя, техническое обслуживание и советы по покупке для коммерческого и прогулочного использования.
    guides:
      - title: Как правильно выбрать RIB лодку
        desc: Полное руководство по выбору RIB — размера, мощности двигателя, материала труб, типа корпуса и предполагаемого использования.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB против надувной лодки
        desc: Жесткая надувная лодка и традиционная надувная лодка — сравнение конструкции корпуса, характеристик, долговечности и вместимости.
        href: /compare/rib-vs-dinghy
      - title: Коммерческий RIB против развлекательного RIB
        desc: Лодки коммерческого класса и прогулочные RIB — стандарты конструкции, материалы, срок службы, стоимость и сертификаты.
        href: /compare/commercial-vs-recreational-rib
      - title: Алюминий против корпуса из стекловолокна
        desc: Сравните корпуса лодок RIB из алюминия и стекловолокна по весу, стоимости, долговечности и устойчивости к коррозии.
        href: /compare/aluminum-vs-fiberglass
  - title: Руководство по надувным лодкам
    tagline: Знания о надувных гидроциклах
    desc: Подробные руководства по надувным лодкам — PVC и Hypalon, методам строительства, стандартам безопасности и передовым методам обслуживания.
    guides:
      - title: PVC против Hypalon Руководство по материалам
        desc: Окончательное сравнение PVC и Hypalon CSM конструкции надувных лодок.
        href: /compare/pvc-vs-hypalon
      - title: Как изготавливаются надувные лодки
        desc: Производственный процесс — раскрой материала, высокочастотная сварка, выполнение швов, опрессовка, контроль качества.
        href: /learn/inflatable-technology
      - title: Руководство по безопасности надувных лодок
        desc: Стандарты безопасности, грузоподъемность, правильное надувание, проверки перед отъездом и действия в чрезвычайных ситуациях.
        href: /learn/water-safety
      - title: Обслуживание надувных лодок
        desc: Чистка, хранение, защита от ультрафиолета, подготовка к зиме и ремонт надувных лодок и РИБов.
        href: /v2/inflatable-boat-maintenance
  - title: Знание лодок
    tagline: Надувная лодка и концентратор RIB
    desc: Технические руководства, охватывающие типы надувных лодок, материалы, методы строительства, техническое обслуживание и безопасность — от лодок до надувных лодок.
    guides:
      - title: Типы надувных лодок
        desc: Лодки, РИБы, каяки и тендеры — изучите различия и выберите подходящий.
        href: /v2/inflatable-boat-buying-guide
      - title: Технология Drop-Stitch
        desc: Как тысячи внутренних нитей создают жесткие надувные конструкции, выдерживающие высокое давление.
        href: /learn/drop-stitch-core
      - title: Справочник материалов
        desc: PVC значения денье, вес ткани, устойчивость к ультрафиолетовому излучению и материалы морского класса.
        href: /learn/materials
      - title: RIB против Динги
        desc: Сравните жесткие надувные лодки с традиционными надувными лодками для разных вариантов использования.
        href: /compare/rib-vs-dinghy
  - title: SUP Знания
    tagline: Направляющие для стоячих паддлбордов
    desc: Все о досках SUP — надувные и жесткие, размеры досок, технологии материалов и советы экспертов для всех уровней навыков.
    guides:
      - title: Надувной против жесткого SUP
        desc: Сравните iSUP и твердые эпоксидные платы по портативности, долговечности, производительности и стоимости.
        href: /learn/sup
      - title: SUP Руководство по размерам платы
        desc: Как длина, ширина и толщина влияют на устойчивость, скорость и маневренность.
        href: /learn/sup
      - title: SUP Обслуживание и уход
        desc: Советы по очистке, хранению, защите от ультрафиолета и ремонту надувных досок SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Выбор первого SUP
        desc: Руководство для начинающих по выбору доски для серфинга стоя, подходящей для вашего веса, уровня навыков и предполагаемого использования.
        href: /learn/sup
  - title: Руководство по снаряжению для дайвинга
    tagline: Знание коммерческих дайв-ботов
    desc: Специализированные гиды по дайв-ботам, дайв-надувным лодкам и оборудованию для дайв-центров, дайв-операторов и коммерческих дайв-команд.
    guides:
      - title: Лучшая RIB Лодка для дайвинг-центров
        desc: Как выбрать правильное погружение RIB для вашего дайвинг-центра — вместимость, конфигурация и бюджет.
        href: /solutions-diving-center-boats
      - title: Руководство по настройке Dive RIB
        desc: Основные функции дайв-надувных лодок — стойки для резервуаров, лестничные системы, платформа для дайвинга и место для хранения оборудования.
        href: /solutions-diving-center-boats
  - title: Руководство по тендеру на яхту
    tagline: Решения для суперяхт и морских тендеров
    desc: Руководства по выбору идеального тендера для яхты — надувные тендеры, тендеры RIB, решения для хранения и аксессуары для тендера.
    guides:
      - title: Как выбрать яхтенный тендер
        desc: 'Факторы, которые следует учитывать при выборе тендера для вашей яхты: размер, материал, двигатель и место для хранения.'
        href: /solutions-yacht-tender-solutions
      - title: Надувные против RIB Тендеров
        desc: Сравните тендеры для надувных лодок с тендерами для жестких надувных лодок по характеристикам, долговечности и возможности хранения.
        href: /compare/rib-vs-dinghy
  - title: Руководство по спасательному оборудованию
    tagline: Знания о поисково-спасательных судах
    desc: Профессиональные гиды на спасательных лодках, гидроциклах SAR и аварийно-спасательном оборудовании для береговой охраны, спасателей и групп помощи при стихийных бедствиях.
    guides:
      - title: SAR Руководство по выбору лодки
        desc: Как правильно выбрать поисково-спасательный катер — скорость, вместимость, долговечность и требования к специальному оборудованию.
        href: /solutions-rescue-watercraft
      - title: Рекламный ролик RIB для спасательных операций
        desc: Почему надувные лодки коммерческого класса являются предпочтительным выбором для профессиональных поисково-спасательных команд по всему миру.
        href: /use-cases/search-and-rescue
