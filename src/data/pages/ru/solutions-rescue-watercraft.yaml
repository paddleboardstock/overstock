content_challenge:
  tagline: Вызов
  title: Спасательные операции требуют<br />безоговорочной надёжности
  subtitle: Поисково-спасательные организации действуют с особой ответственностью за безопасность — каждая поломка лодки влечет за собой неприемлемые последствия.
  paragraphs:
    - 'В спасательных операциях разница между успехом и неудачей измеряется минутами. Лодка должна быть готова к немедленному спуску на воду, работать в суровых условиях и безопасно вернуться с пассажирами. Ответственность за безопасность абсолютна: механическая поломка во время спасательной операции — это не стоимость ремонта, а потеря жизни.'
    - Лодкам SAR необходима высокая скорость, чтобы быстро добраться до пострадавших, в сочетании с исключительной устойчивостью для безопасных операций по спасению. Они должны нести спасательное оборудование, медикаменты и средства связи — часто на ограниченном пространстве палубы. Лодкам, эксплуатируемым на государственной службе, также необходим длительный срок службы (10-15+ лет), чтобы оправдать бюджеты государственных закупок.
    - Видимость — как для оператора, так и для поисковых работ — критически важна. Конструкция консоли должна обеспечивать круговой обзор на 360 градусов, а судно должно быть хорошо заметно с воздуха и для других судов.
    - Спасательные RIB Aquafarer проектируются от киля вверх под эти требования — с самоосушающейся палубой, усиленными корпусами, навигационными комплектами и буксировочными колоннами в стандартной комплектации патрульных моделей.
content_solution:
  tagline: Наше решение
  title: Целевые спасательные RIB
  subtitle: Каждая спасательная лодка Aquafarer спроектирована так, чтобы соответствовать или превосходить стандарты SOLAS и национальные стандарты SAR.
  list:
    - Самоосушающаяся палуба — вода сливается автоматически, обеспечивая устойчивость при подъёмных операциях
    - Усиленный корпус с глубокой V-образной формой — уверенная работа на волне с предсказуемой управляемостью на скорости
    - Полный комплект навигационных огней — работа днём и ночью в любых погодных условиях
    - Буксировочная колонна и трос — готовы к буксировке судов или работе со спасательными санями
    - Монтажные платы для оборудования — рация, прожектор, сирена и медицинское оборудование
    - Различные конфигурации двигателей — один подвесной мотор или резервирование с двумя моторами
    - Высокозаметные цвета труб — оранжевый, жёлтый или красный для максимальной видимости
content_segments:
  tagline: Спасательные профили
  title: Решения для поисково-спасательных судов<br />По типу организации
  subtitle: Различные спасательные организации действуют в соответствии с разными мандатами, бюджетными циклами и условиями работы — от бригад прибрежных волонтеров до национальных флотов береговой охраны. Мы настраиваем каждое спасение RIB в соответствии с профилем миссии.
  items:
    - title: Береговая охрана и правительство SAR Агентства
      subtitle: Абсолютная ответственность за безопасность — критически важные стандарты автопарка
      description: Государственные SAR агентства несут самую высокую ответственность за безопасность морских операций. Каждая лодка должна безупречно работать в экстремальных условиях — отказ оборудования во время спасательной операции недопустим. Решения о закупках принимаются на основе общей стоимости владения в течение 10-15-летнего срока службы, а не первоначальной цены. Агентствам нужны суда, которые выдержат годы прибрежного патрулирования, соответствуют строгим национальным стандартам и обеспечивают стабильную работу на распределенных станциях. Обязательны наличие комплексной документации по обеспечению соответствия и многолетних договоров на обслуживание.
      features:
        - Пакет документации о соответствии национальным стандартам SOLAS и SAR
        - Унификация запасных частей для всего парка — снижение сложности инвентаризации на уровне станции
        - Двухдвигательная конфигурация для критически важного резервирования
        - Срок службы 10-15 лет с плановыми программами технического обслуживания.
        - Всепогодность — усиленный корпус deep-V для условий бурного моря.
    - title: Спасатели и спасательные службы на пляже
      subtitle: Быстрый запуск, операции на мелководье
      description: Муниципальным и прибрежным спасательным службам нужны суда быстрого реагирования, которые могут проходить через зоны прибоя, работать на мелководье в прибрежных водах и достигать пловцов или терпящих бедствие судов в течение нескольких минут. Оборудование должно быть достаточно легким, чтобы его можно было буксировать на берег небольшим транспортным средством или вручную.
      features:
        - Корпус с мелкой осадкой RIB для зоны прибоя и прибрежной эксплуатации.
        - Возможность спуска с пляжа с ручкой для подъема в носовой части и защитой киля.
        - Встроенные спасательные сани или платформа для спасательного пловца.
        - Яркие оранжевые или желтые цвета трубок в стандартной комплектации.
    - title: Пожарно-спасательные службы
      subtitle: Интеграция пожарного насоса, монтаж оборудования, быстрое реагирование
      description: Морские пожарно-спасательные подразделения реагируют на пожары на береговых сооружениях, пожары на судах и спасательные операции на воде. На этих лодках должны быть пожарные насосы, мониторы, места для хранения шлангов и дыхательные аппараты — все это интегрировано в устойчивую платформу быстрого реагирования. Департаменты также используют эти суда для реагирования на наводнения и оказания взаимопомощи. Компоновка консолей должна предусматривать элементы управления насосами, радиосистемы и аварийное освещение без ущерба для пространства на палубе для передвижения экипажа.
      features:
        - Носовой пожарный лафетный ствол с пакетом интеграции насоса
        - Специальный монтаж оборудования для пожарного насоса, хранения шлангов и комплектов БА.
        - Компоновка консоли настраивается для управления насосом, радио и аварийного освещения.
        - Самоотливная платформа для стока воды при пожаре и устойчивости
        - 'Пакет для работы в ночное время: прожектор, освещение сцены, синяя/красная световая полоса.'
    - title: Морская полиция и безопасность порта
      subtitle: Запрет, патрулирование, абордажные операции
      description: Подразделениям правоохранительных органов морской пехоты требуются суда, способные преследовать на высокой скорости, высаживаться на подозрительное судно и патрулировать охрану порта. Эти лодки должны иметь надежное хранилище для снаряжения и оружия правоохранительных органов, интеграцию связи с береговым командованием и достаточное пространство на палубе для операций абордажной группы. Возможность ночных операций и сдержанный подход имеют важное значение для миссий по перехвату.
      features:
        - Возможность высокоскоростного преследования — глиссирующий корпус с максимальной скоростью более 40 узлов.
        - Надежный шкафчик для оружия и отсеки для хранения снаряжения
        - Интеграция консоли с полицейской радиостанцией, MDT и системами связи.
        - 'Пакет для ночных операций: ИК-прожектор, крепление FLIR, скрытое освещение'
        - Усиленная посадочная платформа с нескользящей поверхностью.
        - Сине-красное аварийное освещение и сирена
    - title: Волонтерство SAR и некоммерческие организации
      subtitle: Финансируемые за счет грантов прибрежные и озерные операции на уровне местных сообществ
      description: Местные спасательные группы действуют на озерах, реках и прибрежных территориях, где покрытие правительства SAR ограничено. Часто финансируемые за счет пожертвований или государственных грантов, эти организации нуждаются в максимальных возможностях за доллар — надежном судне, не требующем особого обслуживания, которым волонтеры могут безопасно управлять при минимальной специальной подготовке. Циклы закупок грантов означают, что лодки должны соответствовать требованиям соответствия, оставаясь при этом в рамках фиксированного бюджета.
      features:
        - Конфигурация с одним подвесным двигателем оптимизирована для снижения затрат на приобретение и эксплуатацию.
        - PVC конструкция, обеспечивающая меньшие затраты на техническое обслуживание и легкий ремонт в полевых условиях.
        - Многофункциональная консоль, минимизирующая электронную сложность для операторов-добровольцев
        - Пакет грантовой документации для заявок на финансирование
        - Легкая конструкция для запуска на пляж без специального прицепа или крана.
    - title: Спасение от наводнений и реагирование на стихийные бедствия
      subtitle: Внутренние наводнения, мелководье, засоренность окружающей среды
      description: 'Спасение при наводнении представляет собой особый оперативный профиль: лодки работают в затопленных городских районах, на течениях, заполненных мусором, и на крайне мелководье, где подводные препятствия невидимы. Операторам нужны суда, которые смогут перемещаться по затопленным улицам, преодолевать завалы и извлекать пострадавших из зданий и транспортных средств. Возможность работы на малой осадке имеет решающее значение, как и способность работать в условиях течения с риском зацепления. Эти лодки часто используются пожарными службами, гражданской обороной и неправительственными организациями по оказанию помощи при стихийных бедствиях.'
      features:
        - Корпус со сверхмалой осадкой — работа при глубине воды 30–50 см.
        - Носовая часть, отклоняющая мусор, и усиленная трубчатая защита от подводных препятствий.
        - Самоотливная площадка для стока паводковых вод и спасения пострадавших
        - Яркие оранжевые или желтые трубки для видимости с воздуха.
        - Легкая конструкция для вертолетной транспортировки и использования на дорогах.
        - Усиленные точки подъема для подъема и спасательных операций с помощью веревок.
