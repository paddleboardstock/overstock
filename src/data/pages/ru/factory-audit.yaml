  subtitle: Все, что покупатели B2B проверяют во время посещения завода — от документации по аутентичности производства и соответствия требованиям до систем отслеживания производства и контроля качества. Готовность к аудиту каждый день.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
