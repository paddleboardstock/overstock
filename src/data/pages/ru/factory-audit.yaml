content_priorities:
  tagline: Что проверяют клиенты
  title: 8 вещей, которые покупатели проверяют<br />при каждом посещении завода
  subtitle: Основываясь на отзывах покупателей из более чем 50 стран, это восемь приоритетов, которые клиенты оценивают перед размещением заказа B2B.
  items:
    - title: Настоящий производитель
      description: 'Вы настоящая фабрика, а не торговая компания? Покупатели проверяют: субъект предпринимательской деятельности, реальное производственное оборудование, сотрудников, работающих на машинах, текущие производственные заказы на производстве и соответствие веб-сайта и мастерской.'
      icon: tabler:building-factory
    - title: Продукт подходит для применения
      description: Соответствует ли RIB их конкретному сценарию использования? К операторам курортов, спасателей, водолазов, рыболовов и патрулей предъявляются принципиально разные требования. Покупатели оценивают планировку палубы, материал труб и варианты оборудования на представленной лодке.
      icon: tabler:target
    - title: Стабильность качества и воспроизводимость
      description: 50-й блок так же хорош, как 1-й? Покупатели проверяют системы контроля качества, контрольные точки в процессе производства, обработку несоответствий и просят показать записи нескольких производственных циклов, чтобы убедиться в согласованности.
      icon: tabler:repeat
    - title: Подлинность документа соответствия
      description: Сертификаты CE зависят от модели? Подписан ли ДС реальным человеком? Можно ли проверить соответствие по бортовому номеру? Покупатели проверяют наличие общих претензий и документации по конкретной модели.
      icon: tabler:file-certificate
    - title: Выполнение настройки
      description: Может ли завод на самом деле поставлять индивидуальные конфигурации? Покупатели ищут доказательства прошлых индивидуальных проектов, выставленные образцы прототипов, инженерные чертежи и возможность обсудить технические модификации на месте.
      icon: tabler:adjustments
    - title: Время выполнения и мощность
      description: 'Являются ли указанные сроки реалистичными? Покупатели оценивают: текущий объем производства, имеющиеся мощности, численность рабочей силы, уровень запасов материалов, а также наличие на заводе системы планирования производства.'
      icon: tabler:clock
    - title: Цена и торговые условия
      description: 'Прозрачны ли цены? Ясны ли цены на условиях FOB? Покупатели проверяют: разбивку цен за единицу продукции, стоимость оснастки, стоимость упаковки, а также возможность фабрики работать на условиях DDP или CIF с надлежащей экспортной документацией.'
      icon: tabler:currency-dollar
    - title: Послепродажное обслуживание и запасные части
      description: 'Что происходит после родов? Покупатели оценивают: наличие запчастей, гарантийный процесс, замену трубных секций, замену клапанов, а также наличие на заводе документированного протокола послепродажного обслуживания.'
      icon: tabler:headset
content_tour:
  tagline: Маршрут экскурсии по фабрике
  title: Аудиторский тур —<br />Что вы увидите
  subtitle: Наша стандартная экскурсия по фабрике проходит по определенному маршруту, предназначенному для ответа на вопросы покупателей на каждой станции.
  items:
    - title: 1. Конференц-зал — введение в компанию
      description: Бизнес-лицензия, сертификаты ISO 9001 и BSCI, экспортные лицензии и история компании. Краткий обзор производственных возможностей и области соответствия.
      icon: tabler:users
    - title: 2. Склад сырья — станция IQC.
      description: Протоколы входного контроля материалов, сертификаты партий тканей, образцы клеев и фурнитуры. Посмотрите, как материалы проверяются перед поступлением в производство.
      icon: tabler:building-warehouse
    - title: 3. Изготовление труб — радиочастотная сварка и ручная склейка.
      description: Процесс сварки или склеивания труб под напряжением, демонстрация испытаний на прочность швов и установка клапана. Соблюдайте покамерную конструкцию и контрольные точки качества.
      icon: tabler:flame
    - title: 4. Ламинирование корпуса — мастерская стеклопластика
      description: Процесс укладки стекловолокна, нанесение гелькоута и отверждение корпуса. См. график ламинирования и усиления конструкции для различных моделей RIB.
      icon: tabler:layers-subtract
    - title: 5. Сборка и интеграция
      description: Соединение труб корпуса, установка консоли и сиденья, интеграция электрической и топливной систем, монтаж оборудования. Наблюдайте за работой производственной линии.
      icon: tabler:tool
    - title: 6. Станция испытания давлением
      description: Испытание на удержание давления в течение 24–48 часов при давлении, превышающем номинальное в 1,25 раза. Просматривайте записи испытаний, показания манометров и критерии прохождения/неудовлетворения. Посмотрите, как результаты испытаний связаны с серийными номерами корпуса.
      icon: tabler:gauge
    - title: 7. Окончательная проверка и контроль качества
      description: Контрольный список качества из 100 пунктов на единицу, проверка размеров, косметический осмотр и проверка целостности упаковки. Просмотрите журналы несоответствий и записи корректирующих действий.
      icon: tabler:clipboard-check
    - title: 8. Комната просмотра документов
      description: Документация о соответствии каждой модели (DoC, заводская табличка, руководство пользователя), записи о отслеживании производства, реестр HIN и демонстрация базы данных отслеживания партий материалов.
      icon: tabler:folder
content_qc_chain:
  tagline: Доказательства качества
  title: 8-ступенчатая цепочка контроля качества<br /> — проверка на каждом этапе
  subtitle: Наша цепочка контроля качества простирается от поступления материалов до окончательной отгрузки, с документированным подтверждением на каждом этапе.
  items:
    - title: 'Этап 1: Входной контроль материалов'
      description: Каждая партия ПВХ, хайпалона, стекловолокна, алюминия, клеев и метизов перед поступлением в производство проверяется на соответствие спецификациям. Прочность на разрыв, адгезия покрытия и проверка размеров согласно AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Этап 2: Сварка труб/склеивание, контроль качества'
      description: Испытание прочности на отслаивание швов для каждой производственной партии. Параметры радиочастотной сварки контролируются и записываются. Проклеенные вручную швы проверяются на равномерность покрытия клея и время отверждения.
      icon: tabler:flame
    - title: 'Этап 3: Контроль качества ламинирования корпуса'
      description: Измерение толщины гелькоута, проверка укладки стекловолокна в соответствии с графиком ламината и контроль времени отверждения. Положения структурной арматуры проверены по инженерным чертежам.
      icon: tabler:layers-subtract
    - title: 'Этап 4: Контроль качества сборки и интеграции'
      description: Целостность соединения труб корпуса, крутящий момент крепления консоли и сиденья, целостность электрической цепи и проверка герметичности топливной системы. Каждая точка установки проверена на соответствие контрольному списку сборки для конкретной модели.
      icon: tabler:tool
    - title: 'Этап 5: Испытание на удержание давления'
      description: Каждая надувная камера находится под давлением 1,25x номинального давления на квадратный дюйм и выдерживается в течение 24–48 часов. Падение давления регистрируется на камеру. Порог «прошел/не прошел» документально. Связан с серийным номером корпуса.
      icon: tabler:gauge
    - title: 'Этап 6: Заключительная проверка'
      description: Контрольный список качества из 100 пунктов, охватывающий точность размеров, внешний вид, комплектность аксессуаров, комплект документации и целостность упаковки. Независимость от продюсерской команды.
      icon: tabler:clipboard-check
    - title: 'Этап 7: Документация о соответствии'
      description: DoC для конкретной модели, проверка заводской таблички, полнота руководства пользователя и запись в реестре HIN. Все документы о соответствии подготовлены и проверены перед выпуском отгрузки.
      icon: tabler:file-certificate
    - title: 'Этап 8: Выпуск и отслеживание груза'
      description: Для окончательной версии необходимо пройти все этапы контроля качества, заполнить документацию о соответствии и проверить отгрузочную документацию. Запись о корпусе закрыта и заархивирована сроком хранения более 10 лет.
      icon: tabler:truck
content_traceability:
  tagline: Отслеживание производства
  title: HIN → Мастер-файл →<br />Корпусная запись → Доставка
  subtitle: Каждая лодка RIB имеет уникальный идентификационный номер корпуса, связанный с полной цепочкой записей о производстве и соблюдении требований.
  items:
    - title: Идентификационный номер корпуса (HIN)
      description: 14-значный уникальный идентификатор, постоянно нанесенный на каждую лодку. Кодирует код производителя (MIC), обозначение модели, год производства и серийный номер. Ключ, открывающий всю цепочку отслеживания.
      icon: tabler:hash
    - title: Основной технический файл
      description: Соответствующая и конструкторская документация на модельное семейство. Содержит общие чертежи, оценку рисков, расчеты устойчивости, спецификации материалов и применимые стандарты. Связан со всеми корпусами этой модели.
      icon: tabler:folder
    - title: Индивидуальный рекорд корпуса
      description: 'Запись о производстве каждого корпуса: HIN, дата производства, партия труб, сертификаты на материалы, результаты испытаний под давлением, окончательная конфигурация, спецификация двигателя, результаты контрольного списка качества и пункт назначения. Более 21 поля данных на корпус.'
      icon: tabler:file-description
    - title: Пакет соответствия требованиям клиентов
      description: Комплект поставки по корпусу, включая DoC, фотографию заводской таблички, руководство пользователя, контрольный список соответствия и лист окончательной конфигурации. Поставляется вместе с лодкой и хранится на заводе более 10 лет.
      icon: tabler:package
content_red_flags:
  tagline: Ловушки аудита
  title: Покупатели, помеченные красным флажком<br />Легко обнаружить
  subtitle: Распространенные проблемы, которые подрывают доверие покупателей во время заводских проверок. Мы активно обращаемся к каждому.
  items:
    - title: Общие заявления CE без объема модели
      description: '«Все продукты сертифицированы CE» без указания какой директивы, каких моделей и какого модуля соответствия. Красный флаг: предполагает, что соответствие является поверхностным, а не индивидуальным для каждой модели и каждой конфигурации.'
      icon: tabler:alert-triangle
    - title: Нет доказательств физических испытаний
      description: 'Заявления об испытаниях под давлением без протоколов испытаний, манометров или испытательной станции, видимой в заводских цехах. Красный флаг: претензии по качеству не могут быть проверены во время посещения.'
      icon: tabler:alert-triangle
    - title: Отсутствует отслеживание материалов
      description: 'Никаких записей о партиях, никакого входного контроля или никакой связи между сертификатами на материалы и готовой продукцией. Красный флаг: невозможно отследить проблемы с качеством до источника.'
      icon: tabler:alert-triangle
    - title: Общая документация
      description: 'Один документ DoC, охватывающий все модели, без каких-либо записей, относящихся к HIN, или «шаблонных» документов о соответствии. Красный флаг: соответствие не привязано к отдельным производственным подразделениям.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Доставка и упаковка
  title: Загрузка и упаковка<br />лодок RIB в контейнер
  subtitle: Наши решения по доставке защищают ваши вложения от Циндао до порта назначения. Планы загрузки контейнеров и спецификации упаковки доступны для каждой модели.
  items:
    - title: Конфигурации 20-футового контейнера
      description: 'Стандартный 20-футовый контейнер: 1–2 лодки RIB (4,0–5,5 м) с вложенной установкой и отделённой палубой и трубами, либо 8–12 сап-досок. Доступны смешанные конфигурации RIB + SUP. Подробный план загрузки прилагается к каждому заказу.'
      icon: tabler:box
    - title: Конфигурации 40-футового контейнера
      description: 'Стандартный 40-футовый контейнер: 2–4 лодки RIB (до 7,0 м) с вложенными корпусами и штабелированными трубами, либо 20–30 сап-досок. 40-футовый HQ доступен для более высоких моделей RIB. Оптимизированная по объёму упаковка снижает стоимость доставки на единицу.'
      icon: tabler:container
    - title: Деревянная обрешётка для корпусов RIB
      description: Алюминиевые и GRP корпуса упаковываются в деревянную обрешётку по индивидуальным размерам с пенопластовой защитой, пароизоляцией и стальной обвязкой. Габариты и вес обрешётки по каждой модели доступны для планирования логистики. Сертификация термически обработанной древесины ISPM-15 включена.
      icon: tabler:wood
    - title: Упаковка с разделением труб и палубы
      description: Трубы сдуваются и складываются отдельно от корпусов для экономии места. Палубные плиты, консоли и сиденья упаковываются в защитную плёнку с комплектами крепежа. Инструкции по повторной сборке прилагаются к каждой поставке.
      icon: tabler:package
    - title: Защита от влаги и коррозии
      description: Противокоррозионная бумага VCI для алюминиевых компонентов, пакетики силикагеля-осушителя и вакуумная упаковка крепежа. Предотвращает повреждения от конденсата во время 30–45-дневного морского транзита.
      icon: tabler:droplet-off
    - title: Документация FOB Циндао
      description: Коносамент, коммерческий инвойс, упаковочный лист, сертификат происхождения и документация о соответствии на каждую поставку. Доступна консолидация FCL и LCL. Поддержка таможенной документации для рынков ЕС, США и Ближнего Востока.
      icon: tabler:file-text
faq:
  title: Заводской аудит — часто задаваемые вопросы
  questions:
    - q: Могу ли я посетить завод лично?
      a: Да. Мы приветствуем выездные проверки на нашем заводе в Циндао площадью 12 000 м². Наш стандартный тур охватывает 8 станций от склада сырья до помещения для просмотра документации. Для первоначальной квалификации также доступны виртуальные экскурсии по заводу посредством видеозвонка.
    - q: Принимаете ли вы аудиты третьих сторон (BSCI, SMETA, SGS)?
      a: Да. Мы поддерживаем сертификацию BSCI (Intertek) и приветствуем протоколы аудита, адаптированные к требованиям клиентов. По запросу мы также можем организовать проверки SGS или TÜV. Отчеты об аудите доступны в соответствии с соглашением о неразглашении.
    - q: Могу ли я увидеть опрессовку во время визита?
      a: Наша станция опрессовки является частью стандартного маршрута экскурсии. В зависимости от производственного графика вы можете наблюдать за активными испытаниями под давлением с показаниями манометров и протоколами испытаний. Журналы испытаний под давлением каждого корпуса всегда доступны для просмотра.
    - q: Как вы поступаете с несоответствующей продукцией?
      a: Несоответствующие единицы отделяются, документируются и проверяются в соответствии с нашим процессом корректирующих действий ISO 9001. Выполняется анализ первопричин, реализуются корректирующие действия и ведутся записи. Покупатели могут просматривать наш журнал NCR во время проверок.
    - q: Какая документация о соответствии доступна для проверки?
      a: 'В ходе аудита вы можете просмотреть: образцы DoC для конкретной модели, спецификации заводских табличек, реестр HIN, проекты руководств пользователя, списки применимых стандартов и записи оценки соответствия для каждого семейства моделей.'
    - q: Как заказать виртуальную экскурсию по фабрике?
      a: Свяжитесь с нашим отделом продаж, чтобы запланировать видеотур в реальном времени через WhatsApp, Zoom или Teams. Мы следуем по тому же маршруту из 8 станций и можем сосредоточиться на конкретных областях в зависимости от ваших интересов. Типичный виртуальный тур длится 45-60 минут.
    - q: Является ли завод фактическим производителем или торговой компанией?
      a: Фактическим производителем является Paddle Board Overstock. Мы управляем заводом в Лайси, Циндао. Лицензия на ведение бизнеса, объем производства и физическое производство — все это можно проверить в ходе аудита.
    - q: Какие записи качества я могу просмотреть?
      a: Записи о входных проверках материалов, контрольные точки контроля качества в процессе, журналы испытаний под давлением, контрольные списки окончательной проверки из 100 пунктов, отчеты о несоответствиях, записи корректирующих действий и записи прослеживаемости каждого корпуса. Все поддерживается в соответствии с требованиями ISO 9001.
