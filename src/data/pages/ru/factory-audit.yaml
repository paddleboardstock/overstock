content_audit_evidence:
  tagline: Доказательства проверки
  title: Доказательства аудита<br />Вы можете проверить на месте
  subtitle: Во время посещения завода клиенты могут проверить конкретные доказательства на каждом производственном участке. Вот на что обратить внимание — и что мы готовим к каждой проверке.
  areas:
    - area: Склад сырья
      what_to_verify: Материалы стабильны? Есть ли пакетное смешивание?
      evidence: Записи о входном контроле, этикетки партий, хранение FIFO, список утверждений поставщика, сертификаты на материалы (PVC, Hypalon, стекловолокно, алюминий, клей, метизы)
      icon: tabler:building-warehouse
    - area: Производство баллонов
      what_to_verify: Как обеспечивается прочность и герметичность шва?
      evidence: Технологические карты, подтверждение первого изделия, записи испытаний под давлением для каждой камеры, журналы ремонта и повторных испытаний, записи установки клапанов
      icon: tabler:flame
    - area: Производство корпусов
      what_to_verify: Как контролируется структурная согласованность?
      evidence: Контролируемая технологическая документация, контрольные точки качества, нумерация полуфабрикатов, замеры толщины гелькоута, проверка графика ламинирования.
      icon: tabler:layers-subtract
    - area: Зона сборки
      what_to_verify: Как предотвращается неправильная сборка дополнительных деталей?
      evidence: Спецификация, рабочие задания, контрольные списки конфигурации, карты проверки рабочей станции, проверки крутящего момента и функциональности для каждой модели
      icon: tabler:tool
    - area: Испытательная станция
      what_to_verify: Как вы подтверждаете, что лодка в порядке перед доставкой?
      evidence: Процедуры испытаний, список приборов, записи о калибровке, журналы испытаний под давлением (1,25x / 24–48 часов), контрольные списки функциональных испытаний, документированные критерии соответствия/несоответствия
      icon: tabler:gauge
    - area: Область несоответствия
      what_to_verify: Как устраняются дефекты?
      evidence: Метки изоляции, журналы NCR, анализ первопричин, записи об утверждении доработок, отслеживание CAPA (корректирующих и предупреждающих действий).
      icon: tabler:alert-triangle
    - area: Склад готовой продукции
      what_to_verify: Как предотвратить неправильную доставку и повреждение?
      evidence: Этикетки готовой продукции, записи сопоставления заказов, стандарты упаковки, записи предотгрузочной проверки.
      icon: tabler:box
    - area: Запасные части и послепродажное обслуживание
      what_to_verify: Можете ли вы поддержать долгосрочное послепродажное обслуживание?
      evidence: Общий список запасных частей, стратегия инвентаризации, система нумерации деталей, документация по гарантийному процессу, учебные пособия по техническому обслуживанию.
      icon: tabler:headset
content_closing_script:
  tagline: Аудит на заказ
  title: От посещения завода<br />до подтверждения проекта
  subtitle: Успешный аудит не должен заканчиваться фотографиями и рукопожатием. Прежде чем уйти, мы обеспечиваем документирование трех коммерческих результатов.
  items:
    - title: Подтвердите техническую конфигурацию
      description: Согласуйте модель, применение, ключевые опции, целевой рынок, предполагаемое количество и график доставки — все это задокументировано перед отправкой.
      icon: tabler:checklist
    - title: Подтвердите документы следующего шага
      description: 'Определите, что Paddle Board Overstock предоставит дальше: пересмотренный общий доступ, список конфигурации, предложение, контрольный список документов, образец плана или соглашение о неразглашении — с указанием конкретных сроков.'
      icon: tabler:file-plus
    - title: Подтвердить взаимный график
      description: Пересмотренная конфигурация и предварительное предложение в течение 3 рабочих дней. Подтверждение образца или внешнего вида в течение 7 дней. Инженерная экспертиза или сторонняя проверка в течение 14 дней. Дата следующей встречи и ответственные лица заблокированы.
      icon: tabler:calendar

