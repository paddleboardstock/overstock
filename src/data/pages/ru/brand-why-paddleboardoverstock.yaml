features3_reasons:
  tagline: Почему выбрать Paddle Board Overstock
  title: Семь причин сотрудничать с нами
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Настоящее производство, а не торговля
      description: Мы владеем и управляем фабрикой площадью 12 000 м². Когда вы покупаете у Paddle Board Overstock, вы покупаете напрямую у людей, которые проектируют, разрабатывают и производят вашу доску — без посредников, без розничной наценки.
      icon: tabler:building-factory
    - title: 2. Подход, основанный на инженерии
      description: Наш процесс проектирования начинается с анализа варианта использования, а не категории продукта. Мы оптимизируем форму корпуса, выбор материала и конфигурацию в зависимости от того, как доска будет действительно использоваться.
      icon: tabler:engine
    - title: 3. Доказанное качество
      description: Каждая плата проходит 100% проверку давления при 1,25x номинального PSI перед отправкой. Уровень бездефектности 99,3% — измеряется для каждой партии, а не заявляется просто так.
      icon: tabler:shield-check
    - title: 4. Дизайн с упором на гребца
      description: 'Иллюстрация доски, цветовая серия, крепления для аксессуаров и полные комплекты — доски, разработанные для реальной гребли: туринг, йога, рыбалка, фитнес и семейное удовольствие.'
      icon: tabler:swimming
    - title: 5. Глобальная логистика
      description: Прямая доставка с нашего завода в Вэйхае гребцам в 50+ стран, с полной отслеживаемостью и оформлением таможни.
      icon: tabler:truck-delivery
    - title: 6. Пожизненная поддержка
      description: Мы поддерживаем платы, которые мы разработали много лет назад. Оригинальные запчасти, технические советы, рекомендации по ремонту — наша команда доступна, когда вы нуждаетесь в нас.
      icon: tabler:lifebuoy
    - title: 7. Честные спецификации
      description: Реальные показатели нагрузки, реальные размеры, реальный вес. Никакого маркетингового завышения. То, что мы публикуем, вы и получаете — подтверждено независимыми испытаниями.
      icon: tabler:ruler-measure
testimonials:
  tagline: Доверяют бренды по всему миру
  title: Что говорят наши партнеры
  items:
    - content: Моя доска прибыла с завода совершенно новой со всем содержимым в коробке. Два сезона еженедельного заплыва, и она по-прежнему держит воздух идеально.
      name: — Сара М., любительница каякинга на выходных, Флорида
    - content: Я сравнивала характеристики неделями перед покупкой. Paddle Board Overstock была единственной маркой, которая публиковала реальные веса и реальные давления. То, что они указывают, соответствует действительности.
      name: — Томаш К., туристический байдарочник, Польша
    - content: Теперь каякают все члены семьи. Мы начали с одной доски и в итоге купили четыре — качество помогло легко принять решение.
      name: — Анджела Р., семейный байдарочник, Австралия
