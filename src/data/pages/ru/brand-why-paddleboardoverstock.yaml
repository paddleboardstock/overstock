features3_reasons:
  tagline: Почему выбирают Paddle Board Overstock
  title: 'Семь причин для сотрудничества с нами'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Настоящее производство, а не трейдинг'
      description: 'Мы владеем и управляем заводом площадью 12 000 м². Сотрудничая с Paddle Board Overstock, вы работаете напрямую с теми, кто проектирует, разрабатывает и строит вашу продукцию — без посредников.'
      icon: tabler:building-factory
    - title: '2. Инженерный подход'
      description: 'Наш процесс проектирования начинается со сценария использования, а не с категории продукта. Мы оптимизируем форму корпуса, выбор материалов и конфигурацию под реальное использование лодки.'
      icon: tabler:engine
    - title: '3. Сертифицированное качество'
      description: 'Сертификация CE, система качества ISO, соответствие BSCI и REACH, одобрение USCG. Наши 64 модели, сертифицированные CE, соответствуют международным стандартам — это не просто слова.'
      icon: tabler:certificate
    - title: '4. Гибкий OEM/ODM'
      description: 'Цвета баллонов, компоновка консоли, брендинг, упаковка — мы настраиваем всё под ваши спецификации. Никакого давления по минимальному заказу. Начните с прототипа, масштабируйтесь с уверенностью.'
      icon: tabler:adjustments
    - title: '5. Глобальная логистика'
      description: 'Склад в США в Калифорнии, прямые отгрузки из Циндао, авиаперевозки для срочных заказов. Мы берём на себя таможенные документы и оформление.'
      icon: tabler:truck-delivery
    - title: '6. Пожизненная поддержка'
      description: 'Мы поддерживаем лодки, построенные нами 20 лет назад. Оригинальные запчасти, технические консультации, рекомендации по ремонту — наша команда на связи, когда вы в нас нуждаетесь.'
      icon: tabler:lifebuoy
    - title: '7. Честные характеристики'
      description: 'Реальные нагрузки, реальные размеры, реальный вес. Без маркетинговых преувеличений. Что публикуем — то и получаете, подтверждено независимыми испытаниями.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Доверие брендов по всему миру
  title: Что говорят наши партнёры
  items:
    - content: 'Мы работали с несколькими производителями в Китае, но Paddle Board Overstock выделяется инженерной поддержкой и стабильным качеством. Они относятся к нашему бренду как к своему.'
      name: '— OEM-партнёр, европейский бренд водных видов спорта'
    - content: 'Их лодки RIB из Hypalon служат в нашем флоте более 5 лет. Минимальное обслуживание, отличная стойкость к УФ. Пятилетняя гарантия на баллоны даёт нам уверенность.'
      name: '— Оператор флота, курортная группа Ближнего Востока'
    - content: 'Команда Paddle Board Overstock помогла нам разработать индивидуальный дизайн SUP-борда от концепции до производства за 90 дней. Качество превзошло наши ожидания.'
      name: '— Дистрибьютор, австралийский водный спорт'
