hero:
  tagline: About us
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock factory and workshop
  title: |
    Marine engineering, <br />
    built the <span class="text-accent dark:text-white">Paddle Board Overstock</span> way
  subtitle: "We started in a coastal workshop with one board and a stubborn belief: boards should be engineered like they matter, because they do. Today we ship to over 50 countries, but every board still passes through the same hands that started the company."
