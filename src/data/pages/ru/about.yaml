hero:
  tagline: О нас
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Фабрика и цех Aquafarer
  title: |
    Морское машиностроение <br />
    в стиле <span class="text-accent dark:text-white">Aquafarer</span>
  subtitle: 'Мы начинали в прибрежной мастерской с одной лодкой и твёрдым убеждением: морские изделия должны разрабатываться так, будто от них зависят жизни — потому что так и есть. Сегодня мы отгружаем в 40+ стран, но каждый корпус по-прежнему проходит через те же руки, что основали компанию.'

stats:
  title: В цифрах
  columns: 4
  stats:
    - title: Доставлено корпусов
      amount: '2,400+'
    - title: Стран доставки
      amount: '50+'
    - title: Совокупный опыт, лет
      amount: '60'
    - title: Среднее время ответа (ч)
      amount: '24'

features3_what_we_build:
  title: Что мы строим
  subtitle: Сфокусированная линейка продукции, которую мы знаем досконально — никаких недоработанных экспериментов и чужих брендов.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB-лодки
      description: RIB с алюминиевыми корпусами от 3,3 до 7,5 м. Разработаны для патрулирования, дайвинга, рыбалки и семейного отдыха.
      icon: tabler:ship
    - title: Надувные лодки
      description: Надувные лодки из ПВХ и Hypalon от 2,4 до 4,2 м. Лёгкие, прочные и удобные в хранении.
      icon: tabler:speedboat
    - title: Тендеры для суперъяхт
      description: Компактные RIB с высокими характеристиками, изготовленные под стиль вашей яхты.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Аксессуары
      description: Вёсла, насосы, чехлы, гермомешки, топливные баки и электроника. Всё совместимо с нашими лодками.
      icon: tabler:package
    - title: Модернизация и ремонт
      description: Замена баллонов, модернизация электроники и обновление двигателей.
      icon: tabler:tool
    - title: Изделия на заказ
      description: Проектирование под конкретную задачу для коммерческих, научных и военных заказчиков.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Обсуждение дизайна лодки

steps2_values:
  title: Наши ценности
  subtitle: Три принципа, которые формируют каждый продукт с первого дня.
  items:
    - title: Строй так, будто в лодке твоя семья
      description: Каждый корпус, сварной шов и крепёж обрабатываются так, будто ими будут пользоваться наши собственные семьи.
      icon: tabler:heart
    - title: Разрабатывай до продажи
      description: Если спецификация неверна, мы меняем спецификацию — а не клиента.
      icon: tabler:settings
    - title: Поддержка, переживающая гарантию
      description: Двадцатилетние корпуса всё ещё звонят нам за запчастями, и мы всё ещё отвечаем.
      icon: tabler:headset

steps2_milestones:
  title: Вехи
  subtitle: Краткая версия истории Aquafarer.
  isReversed: true
  items:
    - title: Основана в прибрежной мастерской
      description: Начата двумя корабельными инженерами с ЧПУ-станком и упрямой идеей.
      icon: tabler:building-factory
    - title: Первые 1 000 доставленных корпусов
      description: Достигнуто на седьмой год, в основном через «сарафанное радио» и постоянных клиентов.
      icon: tabler:circle-check
    - title: Международная экспортная программа
      description: Отгрузка в 40+ стран с локализованными партнёрами по поддержке на пяти континентах.
      icon: tabler:world

features2_locations:
  title: Наши офисы
  tagline: Где нас найти
  columns: 3
  items:
    - title: Головной офис и цех
      description: Прибрежный индустриальный парк, корпус 4 — открыто Пн–Пт для посещения по записи.
    - title: Сервисный центр ЕС
      description: Средиземноморский порт — модернизация, ремонт и гарантийное обслуживание для европейских клиентов.
    - title: Партнёрская сеть АТР
      description: Авторизованные сервисные партнёры в Австралии, Японии, Сингапуре и Гонконге.
brand_hub_tagline: 'Бренд'
brand_hub_title: 'Знакомьтесь с нашим брендом'
brand_hub_subtitle: 'Погрузитесь глубже в нашу морскую инженерию, глобальное присутствие и принципы, которыми мы руководствуемся.'

brand_hub_cards:
  - title: 'Морская экспертиза'
    desc: 'Десятилетия материаловедения, точного производства и реальных испытаний — от изготовления ПВХ/гипалона до конструкции глубокого V-образного корпуса и технологии drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'Подробнее →'
  - title: 'Глобальное присутствие'
    desc: 'Доставка в более чем 50 стран с нашего завода в Циндао с авторизованными сервисными партнёрами в Европе, Азиатско-Тихоокеанском регионе и Америке.'
    link: /brand-global-presence
    link_label: 'Подробнее →'
  - title: 'Почему Aquafarer'
    desc: 'Вертикальная интеграция, двойная сертификация (ISO 9001 + BSCI), соответствие требованиям CE и низкие минимальные объёмы заказа — для брендов, дистрибьюторов и государственных организаций.'
    link: /brand-why-aquafarer
    link_label: 'Подробнее →'

production_section:
  tagline: 'Производственное совершенство'
  title: 'Безупречное мастерство производства'
  description: 'Производственная линия Aquafarer посвящена выпуску надувных изделий высокого качества — долговечных и с высокими характеристиками.'
  cards:
    - title: 'Опытная команда техников'
      items:
        - 'Профессиональные знания ПВХ, Hypalon и морских материалов'
        - 'Точное мастерство раскроя, склейки и установки аксессуаров'
        - 'Непрерывное обучение новейшим производственным технологиям'
    - title: 'Передовое производственное оборудование'
      items:
        - 'Раскройное оборудование с ЧПУ для точной резки ткани с минимальной погрешностью'
        - 'Высокоточная термо-/холодная склейка для герметичных и прочных швов'
        - 'Профессиональное оборудование для испытаний на герметичность и прочность на разрыв'
    - title: 'Отлаженная система управления'
      items:
        - 'Стандартизированные производственные процессы с чёткими стандартами качества'
        - 'Философия бережливого производства, сокращающая отходы и повышающая эффективность'
        - 'Эффективное управление цепочками поставок с надёжными партнёрами'
    - title: 'Строгий контроль качества'
      items:
        - 'Сертифицированная система менеджмента качества'
        - 'Многоступенчатый контроль: сырьё, производственный процесс, готовая продукция'
        - 'Строгие испытания на герметичность и долговечность перед отгрузкой'

global_ops_section:
  tagline: 'Глобальная операционная структура'
  title_html: 'Один бренд, <span class="text-white/90">два центра</span>'
  description_html: 'С сентября 2026 года брендом Aquafarer управляет <strong class="text-white">Aquafarer LLC</strong> (Нью-Мексико, США) — глобальная структура, отвечающая за дистрибуцию, коммерческие B2B-продажи, контракты, выставление счетов и послепродажное обслуживание. НИОКР, производство и контроль качества остаются в <strong class="text-white">производственном центре Aquafarer в Циндао</strong>, откуда каждый заказ отгружается напрямую с завода, FOB Циндао. Переход изменил того, кто подписывает ваш контракт — но не того, кто строит вашу лодку.'
  stats:
    - value: '2,400+'
      label: 'Корпусов поставлено по всему миру'
    - value: '50+'
      label: 'Стран экспорта'
    - value: '10+'
      label: 'Лет производства'
