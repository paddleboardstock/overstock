hero:
  tagline: О нас
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Фабрика и мастерская Overstock для весла
  title: О <span class="text-accent dark:text-white">Overstock лопастной доски</span>
  subtitle: Совершенно новые надувные доски SUP по ценам распродажи и распродажи — при поддержке нашего собственного производства в Weihai с 2012 года, оптовой продажи смешанных моделей для небольших розничных продавцов и гибкой доставки по всему миру.
stats:
  title: По цифрам
  columns: 4
  stats:
    - title: Годовая производственная мощность
      amount: 15 000 единиц
    - title: Страны отгрузки
      amount: 50+
    - title: Щиты, испытанные под давлением
      amount: 100%
    - title: Инженеры НИОКР
      amount: 14+
features3_what_we_build:
  title: What we build
  subtitle: Целенаправленная линейка продуктов, которую мы знаем наизнанку — никаких полузаконченных экспериментов, никакого бейдж-инжиниринга.
  columns: 3
  isBeforeContent: true
  items:
    - title: Надувные доски SUP
      description: Универсальные и туристические SUP от 10 до 12 футов. Стабильный, жесткий и в комплекте с насосом, лопастью и поводком.
      icon: tabler:swimming
    - title: Колоды для арт-сериалов
      description: Фирменные шедевры EVA — Cheetah Surge, Tropical Breeze, Medusa Glow и многое другое.
      icon: tabler:hexagons
    - title: Полные пакеты
      description: 'Каждый борт поставляется в виде полного комплекта: борт, рюкзак, насос, весло, плавник, поводок и комплект для ремонта.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Аксессуары
      description: Насосы, лопасти, поводки, ремонтные комплекты и сухие мешки. Все совпало с нашими досками.
      icon: tabler:tool
    - title: Уход И ремонт
      description: Внутренняя поддержка ремонта, запасные части и руководство по техническому обслуживанию, чтобы держать вашу доску на воде в течение многих лет.
      icon: tabler:settings
    - title: Клубные и арендные автопарки
      description: Оптовая экипировка для клубов, школ и арендных парков с прямой поддержкой завода.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Обсуждение дизайна и проектирования доски
steps2_values:
  title: 'Наши ценности '
  subtitle: Три принципа, которые формировали каждый продукт с первого дня.
  items:
    - title: Стройте так, как будто он несет вашу семью
      description: Каждая доска, шов и клапан обрабатываются так, как если бы их использовали наши собственные семьи.
      icon: tabler:heart
    - title: Инженер перед продажей
      description: Если спецификация неверна, мы меняем спецификацию, а не клиента.
      icon: tabler:settings
    - title: Поддержка, которая продлевает гарантию
      description: Доски, которые мы построили много лет назад, все еще вызывают нас за запасными частями, и мы все еще их забираем.
      icon: tabler:headset
steps2_milestones:
  title: Контрольные этапы
  subtitle: Краткая версия истории Paddle Board Overstock.
  isReversed: true
  items:
    - title: Основана в Вэйхае
      description: Прибрежная мастерская, посвященная надувным доскам SUP с вышивкой.
      icon: tabler:building-factory
    - title: Производственный кампус площадью 12 000 м²
      description: Расширение до специализированного объекта с производственными мощностями по сварке и прошивке в радиочастотном диапазоне.
      icon: tabler:circle-check
    - title: Международная экспортная программа
      description: Теперь доставка в более чем50 стран с возможностью экспресс-доставки и морских перевозок.
      icon: tabler:world
    - title: Overstock & оптовая торговля
      description: В сентябре 2026 года операции бренда перешли из Qingdao Vatrad Group в Weihai Dongjilian Co., Ltd.; производственный центр Weihai продолжает исследования и разработки, производство и прямую доставку на завод.
      icon: tabler:building-skyscraper
features2_locations:
  title: Наши офисы
  tagline: Обращайтесь к нам
  columns: 3
  items:
    - title: Штаб-квартира и мастерская
      description: Прибрежный индустриальный парк, корпус 4 — открыт пн-пт для посещения по предварительной записи.
    - title: Сервисный центр
      description: Средиземноморский порт — переоборудование, ремонт и гарантийная поддержка для европейских клиентов.
    - title: APAC partner network
      description: Авторизованные сервисные партнеры в Австралии, Японии, Сингапуре и Гонконге.
brand_hub_tagline: Марка
brand_hub_title: Познакомьтесь с нашим брендом
brand_hub_subtitle: Погрузитесь глубже в наш опыт в области морской инженерии, глобальное присутствие и принципы, которыми мы руководствуемся.
brand_hub_cards:
  - title: Морская экспертиза
    desc: Десятилетия материаловедения, точного производства и реальных испытаний — от стержней с вышивкой до сварных швов и палуб художественных серий.
    link: /brand-marine-expertise
    link_label: Подробнее
  - title: Почему Сапсерфинг Overstock
    desc: Прямое ценообразование на заводе-изготовителе, 100% доски, испытанные под давлением, и 2-летняя гарантия — созданы для гребцов, семей и любителей водных видов спорта.
    link: /brand-why-paddleboardoverstock
    link_label: Подробнее
