features3_what_we_build:
  title: What we build
  subtitle: A focused product line that we know inside out — no half-finished experiments, no badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Inflatable SUP boards
      description: All-around and touring SUPs from 10' to 12 ft. Stable, rigid, and complete with pump, paddle, and leash.
      icon: tabler:swimming
    - title: Art series decks
      description: Signature EVA deck artwork — Cheetah Surge, Tropical Breeze, Medusa Glow, and more.
      icon: tabler:hexagons
    - title: Complete packages
      description: "Every board ships as a full kit: board, backpack, pump, paddle, fin, leash, and repair kit."
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessories
      description: Pumps, paddles, leashes, repair kits, and dry-bags. All matched to our boards.
      icon: tabler:tool
    - title: Care & repair
      description: In-house repair support, spare parts, and maintenance guidance to keep your board on the water for years.
      icon: tabler:settings
    - title: Club & rental fleets
      description: Bulk outfitting for clubs, schools, and rental fleets with direct factory support.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Board design and engineering discussion
steps2_values:
  title: Our values
  subtitle: Three principles that have shaped every product since day one.
  items:
    - title: Build like it carries your family
      description: Every board, seam, and valve is treated as if our own families will use it.
      icon: tabler:heart
    - title: Engineer before we sell
      description: If a spec is wrong, we change the spec — never the customer.
      icon: tabler:settings
    - title: Support that outlasts the warranty
      description: Boards we built years ago still call us for spare parts, and we still pick up.
      icon: tabler:headset
steps2_milestones:
  title: Milestones
  subtitle: A short version of the Paddle Board Overstock story.
  isReversed: true
  items:
    - title: Founded in a coastal workshop
      description: Started by two naval architects with a CNC mill and a stubborn idea.
      icon: tabler:building-factory
    - title: First 10,000 boards built
      description: Reached through word of mouth and repeat customers.
      icon: tabler:circle-check
    - title: International export programme
      description: Now shipping to 50+ countries with localised support partners on five continents.
      icon: tabler:world
    - title: A new global operating structure
      description: In September 2026, brand operations moved from Qingdao Vatrad Group to Weihai Dongjilian Co., Ltd.; the Weihai manufacturing hub continues R&D, production, and factory-direct shipping.
      icon: tabler:building-skyscraper
features2_locations:
  title: Our locations
  tagline: Find us
  columns: 3
  items:
    - title: Headquarters & workshop
      description: Coastal industrial park, building 4 — open Mon–Fri for visits by appointment.
    - title: EU service centre
      description: Mediterranean port — refit, repair and warranty support for European customers.
    - title: APAC partner network
      description: Authorised service partners in Australia, Japan, Singapore and Hong Kong.
brand_hub_tagline: Brand
brand_hub_title: Explore Our Brand
brand_hub_subtitle: Dive deeper into our marine engineering expertise, global presence, and the principles that drive us.
brand_hub_cards:
  - title: Marine Expertise
    desc: Decades of material science, precision manufacturing, and real-world testing — from drop-stitch cores to welded seams and art-series decks.
    link: /brand-marine-expertise
    link_label: Learn more →
  - title: Why Paddle Board Overstock
    desc: Factory-direct pricing, 100% pressure-tested boards, and a 2-year warranty — built for paddlers, families, and water sports lovers.
    link: /brand-why-paddleboardoverstock
    link_label: Learn more →
production_section:
  tagline: Production Excellence
  title: Ensuring Exquisite Craftsmanship
  description: The Paddle Board Overstock production line is dedicated to producing high-quality, durable, and high-performance inflatable SUP boards.
  cards:
    - title: Experienced Technician Team
      items:
        - Professional knowledge of PVC, drop-stitch, and marine-grade materials
        - Precise craftsmanship in cutting, bonding, and accessory installation
        - Continuous training to master latest production technologies
    - title: Advanced Production Equipment
      items:
        - CNC cutting equipment for precise fabric cutting with minimal error
        - High-precision heat/cold bonding for airtight, durable seams
        - Professional airtightness and tensile testing equipment
    - title: Mature Management System
      items:
        - Standardized production processes with clear quality standards
        - Lean production philosophy reducing waste and improving efficiency
        - Efficient supply chain management with reliable supplier partnerships
    - title: Strict Quality Control
      items:
        - Documented quality management across every production stage
        - "Multi-stage inspection: raw material, in-process, final outgoing"
        - Strict airtightness and durability testing before shipping
global_ops_section:
  tagline: Global Operation Architecture
  title_html: One brand, <span class="text-white/90">two hubs</span>
  description_html: Since September 2026, Paddle Board Overstock has been operated by <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> — the global entity for distribution, sales, contracts, billing, and after-sales. R&D, production, and quality control remain at the <strong class="text-white">Paddle Board Overstock Weihai Manufacturing Hub</strong>, which ships every order factory-direct from Weihai. The transition changed who signs your contract — not who builds your board.
  stats:
    - value: 15,000+
      label: Boards delivered globally
    - value: 50+
      label: Countries exported
    - value: 10+
      label: Years of manufacturing
