articles:
  sup:
    - title: Основы SUP — руководство для начинающих
      desc: 'Всё, что нужно знать новичку: типы досок, размер весла, стойка и советы для первого выхода на воду.'
    - title: Руководство по подбору SUP
      desc: Подберите правильную длину, ширину и объем доски под ваш вес, уровень подготовки и стиль гребли.
    - title: Надувной SUP или жесткая доска
      desc: Что подойдет именно вам? Сравнение портативности, характеристик, долговечности и цены.
    - title: Промежуточные техники
      desc: Улучшите свою греблю с помощью продвинутых гребков, техник поворотов и управления на бурной воде.
    - title: Как выбрать надувной SUP
      desc: 'Ключевые факторы: конструкция, толщина, конфигурация плавников и комплектующие.'
    - title: Безопасность на воде
      desc: 'Основы безопасности: чтение погоды, выбор спасательного жилета (ПСЖ), самоспасение и групповая гребля.'
  inflatable-boat:
    - title: Обзор материалов
      desc: ПВХ, Хайпалон, drop-stitch, плотность denier — узнайте, из чего сделано ваше надувное снаряжение.
    - title: ПВХ против Хайпалона
      desc: 'Детальное сравнение тканей ПВХ и Хайпалона для надувных лодок: долговечность, стойкость к УФ и цена.'
    - title: Технология drop-stitch простыми словами
      desc: Как тысячи внутренних нитей создают жесткую платформу под давлением 12-15 PSI для высокоэффективных надувных SUP.
    - title: Обзор технологии надувных судов
      desc: 'Как устроены надувные лодки и SUP: от слоев материалов до клапанных систем и сварки швов.'
    - title: Руководство по RIB (лодкам с жестким корпусом)
      desc: Всё о конструкции RIB, типах корпусов, материалах баллонов и выборе подходящей модели под ваши задачи.
    - title: Надувная лодка или RIB
      desc: Ключевые различия между классическими надувными лодками и лодками с жестким корпусом в зависимости от сценариев использования.
  water-safety:
    - title: Руководство по безопасности на воде
      desc: 'Основы безопасности для каждого гребца: погода, спасательные жилеты (ПСЖ), самоспасение и протоколы групповой гребли.'
    - title: Руководство по жилетам и ПСЖ
      desc: Как выбрать правильное спасательное средство для SUP, байдарки, лодки и профессионального использования.
    - title: Чек-лист безопасности SUP
      desc: Чек-лист перед выходом на воду, которому должен следовать каждый райдер.
    - title: Безопасность в холодной воде
      desc: Основные меры предосторожности, снаряжение и техники для гребли в холодной воде.
    - title: Ошибки начинающих гребцов
      desc: Типичные ошибки новичков и как их избежать ради безопасного и приятного отдыха на воде.
    - title: Сертификация CE простыми словами
      desc: 'Что означает сертификация CE для надувных судов: стандарты, испытания и почему это важно для безопасности.'
ui:
  read_guide: Читать руководство →
  card_tech: Морская инженерия безопасности и испытания материалов
  card_products: Откройте полный каталог продукции Aquafarer
  card_trust: Соответствие CE, ISO и BSCI
materials:
  intro_p1: Ходовые качества, долговечность и безопасность надувного судна почти полностью зависят от материалов, использованных при его производстве. От ткани баллонов до нитей, придающих жесткость доске SUP, — каждый выбор материала влияет на поведение изделия на воде и срок его службы.
  intro_p2: 'Это руководство охватывает четыре основных материала, применяемых в современных надувных судах: ткань ПВХ, каучук Хайпалон CSM, конструкцию с ядром drop-stitch и настилы из пены EVA. Понимание этих материалов поможет выбрать подходящее изделие и правильно ухаживать за ним, чтобы продлить срок службы.'
  labels:
    advantages: Преимущества
    limitations: Ограничения
    best_for: 'Лучше всего подходит для:'
  items:
    - name: ПВХ (поливинилхлорид)
      summary: Отраслевой стандарт для прогулочных надувных лодок и SUP. Многослойная ламинированная ткань предлагает отличное соотношение прочности и веса по доступной цене.
      pros:
        - Доступная цена — на 30-50 % дешевле Хайпалона
        - Легкий и удобный в обращении
        - Хорошая стойкость к УФ при качественных покрытиях
        - Широкий выбор цветов и отделки
        - Легко ремонтируется заплатками из ПВХ и контактным клеем
      cons:
        - Срок службы короче, чем у Хайпалона (7-10 лет)
        - Менее эластичен на морозе
        - Ниже стойкость к химикатам
        - Со временем возможна миграция пластификаторов
      best_for: Прогулочные SUP, бюджетные лодки, прокатные флоты, сезонное использование, пресные и прибрежные воды.
    - name: Хайпалон (каучук CSM)
      summary: Премиальный синтетический каучук, известный исключительной прочностью, стойкостью к УФ и долговечностью. Эталон для коммерческих и военных надувных лодок.
      pros:
        - Исключительная стойкость к УФ и озону
        - Срок службы 15-20 лет при правильном уходе
        - Отличная эластичность в мороз
        - Превосходная стойкость к химикатам и маслам
        - Дольше сохраняет цвет, чем ПВХ
      cons:
        - Значительно дороже ПВХ
        - Более тяжелая ткань
        - Меньше вариантов цвета
        - Для ремонта нужны специальные клеи
        - В мире меньше производственных площадок
      best_for: Коммерческие RIB, поисково-спасательные службы, военное применение, тропический климат, долгосрочное владение флотом.
    - name: Ядро drop-stitch
      summary: Технология, совершившая революцию в надувных SUP. Тысячи полиэфирных нитей соединяют верхний и нижний слои ткани, позволяя накачивать доску до высокого давления для характеристик уровня жесткой доски.
      pros:
        - Исключительная жесткость при 12-20 PSI
        - Легкость — 18-30 lbs для полноразмерной доски
        - Складывается в компактный размер для хранения и перевозки
        - Отличная стойкость к ударам
        - Стабильные характеристики при любых температурах
      cons:
        - Требуется насос высокого давления
        - Ремонт проколов сложнее, чем у однослойных конструкций
        - Выше себестоимость производства, чем у обычных надувных изделий
        - Падение давления со временем требует периодической подкачки
      best_for: Доски для SUP, байдарки, надувные настилы для лодок — везде, где нужны жесткость и компактность надувной конструкции.
    - name: Настил из пены EVA
      summary: Пена EVA с закрытыми ячейками (этиленвинилацетат) используется для противоскользящих ковриков на досках SUP и палубах лодок. Обеспечивает амортизацию, сцепление и теплоизоляцию.
      pros:
        - Отличное нескользящее сцепление в мокром и сухом виде
        - Амортизация снижает усталость при долгой гребле
        - Теплоизоляция от холодной палубы
        - Стойкость к УФ и соленой воде
        - Доступны многоцветные композиции и гравированные лазером узоры
      cons:
        - Может изнашиваться при интенсивной эксплуатации за 2-3 года
        - Требует качественной приклейки во избежание расслоения
        - Не несущая — на жесткость не влияет
        - Добавляет небольшой вес (200-400 г на доску)
      best_for: Покрытия палубы SUP, обшивка палубы лодок, комфорт сидений байдарок — любая поверхность, где нужно противоскользящее покрытие.
  selection:
    title: Руководство по выбору материала
    subtitle: 'Выбирайте материал под основной сценарий использования:'
    headers:
      - Сценарий использования
      - Рекомендуемый материал
      - Почему
    rows:
      - - Прогулочный SUP
        - ПВХ drop-stitch
        - Легко, жестко, доступно — идеальный баланс для любителей
      - - Семейская или озерная лодка
        - ПВХ (1100 denier)
        - Выгодно по цене, легко ремонтируется, достаточно прочна для прогулок
      - - Коммерческий RIB / патрульный катер
        - Хайпалон CSM
        - Максимальная стойкость к УФ, срок службы 15-20 лет, стойкость к химикатам и маслам
      - - Прокатный флот SUP
        - ПВХ drop-stitch + настил EVA
        - Износостойко, ремонтопригодно, выгодно при интенсивной эксплуатации
      - - Поисково-спасательные операции
        - Хайпалон CSM
        - Надежность в экстремальных условиях, эластичность на морозе, стойкость к химикатам
      - - Туринговый или экспедиционный каяк
        - ПВХ drop-stitch
        - Жесткость жесткой лодки плюс компактность для перевозки
  deep_dive:
    title: Углубленные руководства
    topics:
      - title: Морской ПВХ
        desc: Многослойная ламинированная ткань ПВХ — стойкость к УФ, испытания на истирание и показатели denier.
      - title: ПВХ против Хайпалона
        desc: Детальное сравнение двух доминирующих материалов надувных лодок — цена, срок службы, стойкость к УФ.
      - title: Ядро drop-stitch
        desc: Как тысячи внутренних нитей создают жесткие высоконапорные надувные конструкции при 12-15 PSI.
      - title: Технология ВЧ-сварки
        desc: Высокочастотная сварка создает прочные и равномерные швы — как это работает и почему это важно.
      - title: PSI и характеристики
        desc: Почему давление воздуха важно для надувных SUP и лодок — жесткость, грузоподъемность и комфорт хода.
      - title: Испытания качества
        desc: Испытания давлением, тесты плавучести, УФ-старение и разрушающие испытания — наш процесс контроля качества.
      - title: Настилы из пены EVA
        desc: Коврики из пены EVA с закрытыми ячейками — сцепление, комфорт и долговечность для палуб SUP и лодок.
      - title: Уход за материалами
        desc: Очистка, защита от УФ, профилактика плесени и правила хранения надувных изделий.
