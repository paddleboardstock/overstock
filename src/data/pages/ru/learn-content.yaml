articles:
  sup:
    - title: SUP Основы — Руководство для новичка
      desc: Все, что нужно знать начинающему — типы досок, размер весла, стойка и советы для первого дня.
    - title: Руководство по размерам SUP
      desc: Найдите подходящую длину, ширину и объем доски для вашего веса, уровня навыков и стиля гребли.
    - title: Надувная доска против жесткой доски
      desc: Что подходит именно вам? Сравнение портативности, производительности, прочности и стоимости.
    - title: Промежуточные техники
      desc: Улучшите свои навыки гребли с помощью продвинутых приемов, техник поворота и управления на бурной воде.
    - title: Как выбрать надувную SUP
      desc: Ознакомьтесь с ключевыми факторами — конструкция, толщина, расположение плавников и включенные аксессуары.
    - title: Безопасность на воде
      desc: Основные знания по безопасности, включая определение погоды, выбор PFD, самоспасение и групповое плавание.
  inflatable-boat:
    - title: Справочник материалов
      desc: Drop-stitch сердцевины, PVC ламинирующие слои, EVA пена на палубе и показатели дение — понимание того, из чего состоит ваша доска.
    - title: EVA Объяснение оформления деки
      desc: Как многоцветные блоки EVA вырубаются и собираются вручную в составные иллюстрации для колоды с долговечным цветовым исполнением.
    - title: Drop-Stitch Объяснение сердечника
      desc: Как тысячи внутренних нитей создают жесткую платформу при 15 PSI для высокопроизводительных надувных SUPs.
    - title: Обзор технологий надувных досок
      desc: Как изготовляются надувные доски для паддлборда — от выкладки материалов до клапанных систем и сварки швов.
    - title: Конструкция рельсов и швов
      desc: Как трехслойные рельсовые полосы и радиочастотная сварка швов сохраняют герметичность доски при полном давлении.
    - title: Почему 15 PSI имеет значение
      desc: Как давление воздуха обеспечивает жесткость и характеристики твердой доски у надувной, которая легко упаковывается.
  water-safety:
    - title: Руководство по водной безопасности
      desc: Основные знания по безопасности для каждого гребца — погода, спасательные жилеты, самоспасение и протоколы групповного плавания.
    - title: Руководство по спасательным жилетам и PFD
      desc: Как выбрать правильное средство индивидуальной плавучести для стоячего паддлбординга — показатели плавучести, посадка и комфорт.
    - title: Контрольный список безопасности SUP
      desc: Контрольный список безопасности перед спуском на воду, который должен соблюдать каждый паддлбордер.
    - title: Безопасность при гребле на холодной воде
      desc: Основные меры предосторожности, снаряжение и техники гребли в холодной воде.
    - title: Ошибки для начинающих при гребле
      desc: Распространённые ошибки, которые совершают первокурсники, и как их избежать ради более безопасного и приятного опыта.
    - title: Правила поводка и PFD безопасности
      desc: Когда поводок важен, PFD какие типы SUP подходят и какое защитное снаряжение должен иметь с собой каждый гребец.
ui:
  read_guide: Читать руководство →
  card_tech: Инженерия по безопасности и испытания материалов
  card_products: Ознакомьтесь с полным Paddle Board Overstock каталогом продукции
  card_trust: Заводское тестирование качества с двухлетней гарантией
materials:
  intro_p1: Характеристики, долговечность и безопасность надувной доски почти полностью зависят от материалов, используемых при её конструкции. От ламинированного материала корпуса до резьбы, придающей SUP доске жёсткость, каждый выбор материала влияет на то, как продукт работает на воде и сколько он служит.
  intro_p2: 'В этом руководстве рассматриваются три материала из сердечников, используемых в современных надувных досках: PVC ламинат, drop-stitch сердечник и EVA пенопластовая настилка. Понимание этих материалов поможет вам выбрать доску, подходящую для ваших нужд, и поддерживать её до максимального срока службы.'
  labels:
    advantages: Преимущества
    limitations: Ограничения
    best_for: 'Лучше всего для:'
  items:
    - name: PVC (поливинилхлорид)
      summary: Отраслевой стандарт для SUPs надувных тканей. Многослойная ламинированная ткань обеспечивает отличное соотношение прочности к весу по доступной цене.
      pros:
        - Отличное соотношение цены и качества
        - Лёгкий и простой в обращении
        - Хорошая UV устойчивость при правильных покрытиях
        - Широкий выбор цветов и отделок
        - Легко ремонтировать с PVC помощью пластырей и растворительного клея
      cons:
        - Типичная продолжительность жизни составляет 7-10 лет при правильном уходе
        - Менее гибкий в низких температурах
        - Низкая химическая устойчивость
        - Со временем может развиваться миграция пластификаторов
      best_for: Рекреационные и туристические SUPs занятия, семейные гребли, сезонное использование, пресноводные и прибрежные условия.
    - name: Ядро Drop-Stitch
      summary: Технология, которая произвела революцию в SUPs надувном производстве. Тысячи полиэстеровых нитей соединяют верхний и нижний слои ткани, обеспечивая высокое давление для жёсткой, твёрдой конструкции.
      pros:
        - Крайне жёсткая в 12-20 PSI
        - Лёгкий — 18-30 фунтов для полноразмерной доски
        - Складывается для хранения и путешествий
        - Отличная ударопрочность
        - Стабильная производительность при различных температурах
      cons:
        - Требуется насос высокого давления
        - Ремонт проколов сложнее, чем у однослойных
        - Более высокая стоимость производства по сравнению с обычными надувными досками
        - Потеря давления со временем требует периодической подкачки
      best_for: Сапборды и любое снаряжение, которому нужна жёсткость и портативность надувного варианта.
    - name: EVA Поролоновая дека
      summary: Закрытоячеистая пена EVA (этилен-винилацетат) используется для противоскользящих накладок на SUP досках. Обеспечивает амортизацию, сцепление и теплоизоляцию — а также отображает дизайнерские рисунки серии art.
      pros:
        - Отличное противоскользящее сцепление на мокрой и сухой поверхности
        - Амортизация снижает усталость при длительных заплывах
        - Теплоизоляция от холодной поверхности деки
        - Устойчива к UV и морской воде
        - Доступна в многоцветных блоках и с лазерной гравировкой дизайнов
      cons:
        - Может изнашиваться при интенсивном использовании в течение 2-3 лет
        - Должна быть правильно приклеена, чтобы избежать расслоения
        - Не является несущей — не влияет на жёсткость
        - Добавляет небольшой вес (200-400 г на доску)
      best_for: SUP Противоскользящие накладки на деке, дизайнерские декорации серии art и любая поверхность, требующая сцепления.
  selection:
    title: Руководство по выбору материалов
    subtitle: 'Выбирайте правильный материал исходя из вашего основного сценария использования:'
    headers:
      - Сценарий использования
      - Рекомендуемый материал
      - Почему
    rows:
      - - Развлекательное SUP гребля
        - Drop-stitch PVC
        - Лёгкий, жёсткий, доступный — идеальный баланс для любителей
      - - Семейная и начинающая гребля
        - Широкий drop-stitch PVC (32"+)
        - Стабильный и прощающий ошибки — уверенность для новичков в гребле
      - - Рыбалка и гребля с тяжёлым снаряжением
        - Широкий drop-stitch PVC с полным EVA настилом
        - Дополнительная стабильность для стояния и забросов, большой объём для снаряжения
      - - Прокатный парк SUP досок
        - Drop-stitch PVC + EVA настил
        - Прочный, ремонтопригодный, хорошее соотношение цены и качества для интенсивного использования
      - - Туризм и длинные гребки
        - Drop-stitch PVC (~11 футов)
        - Лучшее управление курсом и эффективность скольжения на дистанции
      - - Йога и фитнес на воде
        - Широкий drop-stitch PVC с полным EVA настилом
        - Стабильная, удобная платформа для поз и тренировок
  deep_dive:
    title: Подробные руководства
    topics:
      - title: Морской класс PVC
        desc: Многослойная ламинированная PVC ткань — UV сопротивление, тестирование на износ и рейтинг дене.
      - title: PVC Слои ламинации
        desc: Как многослойная ламинированная PVC ткань балансирует прочность, вес и UV сопротивление.
      - title: Ядро Drop-Stitch
        desc: Как тысячи внутренних нитей создают жёсткие надувные конструкции под высоким давлением при 15 PSI.
      - title: Технология RF-сварки
        desc: Высокочастотная сварка создаёт прочные и ровные швы — как это работает и почему важно.
      - title: PSI и характеристики
        desc: Почему давление воздуха важно для надувных SUPs — жёсткость, грузоподъёмность и качество хода.
      - title: Тестирование качества
        desc: Испытания на давление, плавучесть, UV старение и разрушающие тесты — наш процесс контроля качества.
      - title: EVA Настилы из пенопласта
        desc: Закрытоячеистые EVA пенопластовые настилы — сцепление, комфорт и долговечность для SUP настилов.
      - title: Уход за материалом
        desc: Чистка, UV защита, предотвращение плесени и лучшие практики хранения надувных изделий.
