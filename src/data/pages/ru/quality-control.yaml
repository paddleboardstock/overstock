content_system:
  tagline: Обзор системы контроля качества
  title: Интегрированная система контроля качества
  subtitle: Наша система контроля качества работает независимо от производства и напрямую отчитывается перед руководством. Ни одна партия не отгружается без подписанного разрешения на качество от лаборатории контроля качества.
  items:
    - title: Независимая лаборатория качества
      description: Наша лаборатория контроля качества работает как отдельная функция от производства. Инспекторы ОТК подчиняются менеджеру по качеству, а не директору производства. Эта организационная независимость гарантирует, что решения по качеству принимаются объективно — сроки производства никогда не ставятся выше требований к качеству.
      features:
        - Подчиняется непосредственно руководству, независимо от производства
        - Уполномочен приостанавливать производство из-за проблем с качеством
        - 12 выделенных инспекторов по контролю качества на всех этапах
        - Все испытательное оборудование калибруется ежегодно
    - title: Прослеживаемость партии
      description: Каждой партии сырья присваивается уникальный номер партии в нашей системе ERP. От поступления материала через производство до готовой продукции, спецификации каждой лодки связываются с исходными партиями поставщиков. Это обеспечивает полную прослеживаемость вверх по цепочке на случай любых вопросов качества или соответствия требованиям.
      features:
        - Отслеживание партий на основе ERP от материала до готовой продукции
        - Физические пакетные теги на каждом заказе на работу
        - 100% покрытие материала — PVC, Hypalon, оборудование, клеи
        - Записи хранятся в течение 10 лет (CE требование 2013/53/ЕС)
    - title: Стандарты и соответствие
      description: Наши процедуры контроля качества соответствуют международным стандартам. Продукция сертифицирована CE в соответствии с Директивой ЕС о рекреационных судах 2013/53/EU. Наша система менеджмента качества сертифицирована по стандарту ISO 9001. Социальное соответствие поддерживается сертификацией BSCI.
      features:
        - сертификация CE (ЕС 2013/53/EU)
        - ISO 9001:2015 управление качеством
        - BSCI сертификация социальной соответствия
        - REACH и соответствие материалам RoHS
        - Сертификация UKCA после Брексита
content_inspection:
  tagline: Этапы инспекции
  title: Шестиступенчатый процесс инспекции
  subtitle: Каждый продукт проходит через 6 этапов проверки с документированными контрольными точками качества. Дефекты выявляются на ранней стадии, корректирующие действия выполняются немедленно, и каждая партия полностью прослеживается.
  stages:
    - stage: '1'
      title: Инспекция поступающего материала
      description: Все поступающие материалы регистрируются по номеру партии и помещаются на карантин до прохождения контроля качества. PVC/Hypalon рулоны ткани испытываются на прочность на разрыв (ASTM D751), сопротивление разрыву (ISO 4674) и толщину. Drop-stitch сердечники, клапаны, клеи и фурнитура визуально осматриваются и измеряются по спецификациям.
      checks: Прочность на разрыв ASTM D751, разрывное сопротивление ISO 4674, измеритель толщины, вязкость клея, визуальная проверка на дефекты
      threshold: 100% партий проверено. Отбраковывать, если растяжение < 90 % от спецификации, разрыв < мин или любой визуальный дефект.
    - stage: '2'
      title: Операционный контроль качества — Резка и подготовка
      description: Панели, вырезанные по CNC, проверяются на соответствие размерам по исходным файлам CAD каждая 20-я панель. Качество кромок проверяется на изнашивание, неровные резы или отклонения в размерах. Количество панелей сверяется с спецификацией (BOM) для каждой производственной партии до перемещения материалов на сварку.
      checks: Проверка размеров по файлам CAD DXF, проверка качества кромок, проверка количества панелей.
      threshold: Допуск ±0,5 мм. Отклонять партию, если >2% не соответствуют допуску
    - stage: '3'
      title: Контроль качества в процессе — Сварка и склеивание
      description: Во время производства качество сварки постоянно контролируется. Каждые 50 единиц проводятся испытания на отслоение (ASTM D751) на образцах. Ширина сварного шва измеряется по спецификации. Журналы температуры горячего воздуха проверяются на соответствие. Каждый шов визуально осматривается под подсветкой на наличие каналов или пустот.
      checks: Тест на отслаивание ASTM D751 каждые 50 единиц, измерение ширины шва, проверка журнала температуры горячего воздуха, проверка шва на просвет
      threshold: Прочность на отрыв минимум 8 Н/см. Допуск ширины сварного шва ±1 мм. Любая видимая канализация = отклонить
    - stage: '4'
      title: Контроль качества сборки
      description: Каждое устройство проходит проверку по сборочному контрольному списку на 100 пунктов, который подписан руководителем команды. Работа клапана проверяется через 10 циклов открывания/закрывания. Крутящий момент крепежа проверяется. Визуальный осмотр включает оценку отделки поверхности, однородности цвета, размещения этикеток и комплектации аксессуаров.
      checks: Контрольный список из 100 пунктов на каждый блок, проверка работы клапана, проверка крутящего момента оборудования, визуальный осмотр
      threshold: 'Политика отсутствия дефектов в отношении критически важных для безопасности элементов (клапаны, D-образные кольца, ручки). Незначительная косметика: AQL 2,5 (ISO 2859)'
    - stage: '5'
      title: Испытание давлением
      description: Каждая камера надувается до 1,25× номинального давления и удерживается в течение 24-48 часов. Датчики давления ведут непрерывную запись на протяжении всего периода выдержки. С показаниями, скорректированными с учётом температуры, обеспечивается точность. Любая камера, у которой падение давления превышает 5%, отклоняется и отправляется на повторную проверку швов с 100% повторным тестированием всей производственной партии.
      checks: Журнал удержания давления 24-48 часов, ежедневная проверка калибровки датчика, показания с компенсацией температуры, повторная проверка шва после ремонта
      threshold: Максимальное падение давления 5% за 24 часа при стабильной температуре. Превышение = 100% повторная проверка всей партии
    - stage: '6'
      title: Окончательная проверка и выпуск к отгрузке
      description: Окончательная визуальная и функциональная проверка перед упаковкой. Проверяются дефекты поверхности, соответствие цвета, проверка этикетки/лота, целостность упаковки и комплектность аксессуаров в соответствии с заказом клиента. Единицы продукции вакуумируются, упаковываются в коробки и укладываются на поддоны. Финальное утверждение контроля качества требуется перед тем, как продукт покинет завод.
      checks: Полная визуальная проверка, проверка аксессуаров по SKU, тест падения упаковки (случайная выборка 1 м), проверка сканирования этикетки/штрих-кода
      threshold: AQL 2,5 для существенных дефектов, AQL 4,0 для незначительных. Полная неприемлемость дефектов, влияющих на безопасность. 100% единиц проверяются визуально
content_equipment:
  tagline: Испытательное оборудование
  title: Оборудование лаборатории контроля качества
  subtitle: Наша лаборатория контроля качества оснащена специализированным испытательным оборудованием для проверки материалов, целостности сварных соединений и подтверждения характеристик продукции.
  columns: 3
  items:
    - title: Испытательная машина на растяжение
      description: Измеряет прочность ткани на разрыв и удлинение в соответствии с ASTM D751. Используется для входного контроля качества всех партий ткани PVC, Hypalon и drop-stitch.
      icon: tabler:scale
    - title: Температурная камера
      description: Климатическая камера для испытаний на стойкость к UV (ASTM G154) и испытаний на гибкость при низких температурах. Моделирует экстремальные условия эксплуатации.
      icon: tabler:temperature
    - title: Датчики давления и регистраторы
      description: Цифровые датчики давления с непрерывной регистрацией данных для тестов на удержание воздуха в течение 24-48 часов. Компенсированы по температуре для точности.
      icon: tabler:wind
    - title: Испытательный стенд для отслоения
      description: Калиброванное оборудование для испытаний на отслаивание для проверки прочности сварного шва. Случайные образцы из каждой производственной партии.
      icon: tabler:files
    - title: Резервуар для обнаружения утечек
      description: Водяной резервуар для погружного тестирования на протечки на надувных камерах. Визуальное обнаружение пузырей для проверки целостности швов и клапанов.
      icon: tabler:ripple
    - title: Инструменты для инспекции
      description: Калиброванные измерительные приборы — толщиномеры, динамометрические ключи, штангенциркули, твердомеры для производственных станций контроля качества.
      icon: tabler:tools
content_metrics:
  tagline: Работа контроля качества
  title: Метрики контроля качества
  subtitle: Настоящие данные о прохождении/непрохождении с нашей производственной линии. Эти показатели отслеживаются ежедневно и ежемесячно рассматриваются руководством.
  columns: 3
  items:
    - title: 100% протестировано
      description: Каждое отделение каждой лодки проходит проверку давления перед отправкой. Без выборки — 100% проверка герметичности под давлением.
      icon: tabler:check
    - title: <Падение давления <5%>
      description: Максимально допустимая потеря давления за 24-48 часов при 1,25× номинального давления. Любая камера, превышающая этот порог, вызывает повторное тестирование партии.
      icon: tabler:gauge
    - title: AQL 2.5
      description: Допустимый уровень качества для основных дефектов согласно стандарту выборки ISO 2859. Нулевая терпимость к дефектам, критичным для безопасности.
      icon: tabler:clipboard-check
    - title: Задержание на 24-48 часов
      description: 'Продолжительность выдержки давления зависит от категории продукта. RIB камеры: 48 часов. SUP и надувные лодки: 24-48 часов.'
      icon: tabler:clock
    - title: 1,25× Испытательное давление
      description: Запас прочности каждой камеры — испытан при 25% превышении номинального давления, чтобы гарантировать запас прочности выше максимальных рабочих условий.
      icon: tabler:arrow-up
    - title: 0% дефектов безопасности
      description: Политика нулевой терпимости к дефектам, критически важным для безопасности — клапаны, D-образные кольца, швы и камеры плавучести. Любой дефект = 100% повторная проверка.
      icon: tabler:shield
