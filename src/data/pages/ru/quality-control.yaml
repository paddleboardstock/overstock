tldr:
  summary: 'Шестиступенчатая система контроля качества: проверка материалов, контроль качества в процессе, проверка сварки, контроль качества сборки, испытание под давлением при 1,25-кратном номинальном значении и финальная проверка. 100% тестирование единиц на давление. 99,3% уровень бездефектности по выборке AQL 2,5.'
  points:
    - 'Шестиступенчатый контроль качества: проверка материала, контроль качества в процессе, проверка сварки, контроль качества сборки, испытание на давление 1,25x и финальная проверка по 100 пунктам'
    - Финальная проверка на 100 очков каждой платы перед упаковкой
    - 100% объектов подвергаются выдержке в течение 24-48 часов при 1,25-кратном номинальном давлении с максимальной допустимой потерей 5%
    - AQL 2.5 выборка, обеспечивающая 99,3% бездефектных изделий
    - 'Контроль качества сварки: контроль отслоения, проверка ширины сварного шва и осмотр шва на просвет каждого сварного соединения'
