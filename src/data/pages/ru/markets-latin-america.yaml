hero:
  tagline: Латинская Америка
  title: Оптовые SUP борды для<br />Латиноамериканские ритейлеры
  subtitle: Совершенно новые избыточные доски для пляжных магазинов, арендных автопарков и онлайн-продавцов по всей Латинской Америке — от 5 досок, смешанных моделей, экспрессов или морских грузов.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Избыточные доски для латиноамериканских продавцов досок для паддлбордов
direct_answer: Paddle Board Overstock поставляет новые надувные доски с избытком запаса SUP небольшим ритейлерам по всей Латинской Америке — от Мексики и Бразилии до Колумбии, Перу, Чили и Аргентины. Оптовые заказы начинаются с 5 досок, смешанные модели, приветствуются, и каждый заказ отправляется из Вэйхая, Китай, экспресс-авиаперевозкой или консолидированным морским грузом. Платы проходят 100% испытание под давлением и покрываются двухлетней SUP гарантией.
tldr_points:
  - Оптовая покупка с 5 плат — смешанные модели в одном заказе, по общей цене
  - Экспресс-авиаперевозки или консолидированные морские грузы из Вэйхая, Китай
  - Рынки испаноязычного и португальского языков обслуживались по всему региону
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: SUP Латиноамериканский рынок
  paragraphs:
    - Латинская Америка — один из самых быстрорастущих рынков стендап-падлов в мире. Длинные берега на двух океанах, устоявшаяся экономика пляжного туризма и сильная культура настенных видов спорта дают независимым ритейлерам от Тулума до Флорианополиса растущую базу клиентов — туристов, проходящих первые уроки, любителей гребли по выходным и растущее местное SUP сообщество гонщиков и серфинга.
    - The retail landscape is dominated by small and mid-sized independent shops: Школы для гребли на пляже, которые продают то, что арендуют, магазины серфинга, SUP добавляющие линии, и онлайн-продавцы, впервые импортирующие напрямую. Этим бизнесам редко нужны контейнеры одной модели — им нужно 5–20 досок на заказ, смешанные между универсальными моделями для начинающих и несколькими премиальными версиями.
  customer_types:
    - title: Ритейлеры Бич-Тауна
      description: Магазины в курортных городах, обслуживающие туристов — им нужны долговечные доски для начинающих в большом количестве плюс несколько премиальных моделей для выставки и продажи.
    - title: Школы для гребных спортов и арендные парки
      description: Школы сочетают уроки с розничной торговлей, а арендные автопарки обновляют доски каждый сезон с заказами смешанных моделей.
    - title: Онлайн-продавцы
      description: Продавцы электронной коммерции на испанском и португальском языках выводят SUP эту категорию на свой национальный рынок без риска контейнерного масштаба.
shipping_section:
  title: Корабль в Латинскую Америку
  paragraphs:
    - Заказы поступают с нашей логистической базы в Вэйхае, Китай. Экспресс-грузовые костюмы — образцы, 1–3 бортовых заказа и срочные пополнения запасов; консолидированные морские грузоперевозки — экономически выгодный путь для оптовых заказов на 5–20 бортов в крупные порты региона.
    - Мы предоставляем полные, точные экспортные документы — коммерческий счет и список упаковки — чтобы таможенное оформление было гладким. Импортные пошлины и налоги устанавливаются вашей страной и уплачиваются импортером; мы никогда не включаем расплывчатые обещания «включены налоги» в фрахтовую смету.
  customs_note: Правила импорта и ставки пошлин значительно различаются в разных странах Латинской Америки. Перед заказом проверьте текущий режим импорта надувного водного спорта в вашей стране и попросите предоставить нам дополнительные документы, необходимые брокеру.
faq_section:
  title: Часто задаваемые вопросы по Латинской Америке
  items:
    - q: Могу ли я получить смету на испанском или португальском?
      a: Наша команда работает с покупателями по всей Латинской Америке и может заниматься оформлением предложений и подтверждением заказов для испаноязычных и португальоязычных клиентов. Задавайте вопросы в своем запросе.
    - q: Вы отправляете в мою страну в Латинской Америке?
      a: Мы отправляем по всему региону — Мексике, Бразилии, Колумбии, Перу, Чили, Аргентине, Эквадору и за его пределами. Подтвердите точный пункт назначения в запросе стоимости, и мы проверим текущие грузовые услуги.
    - q: Какой минимальный оптовый тариф для латиноамериканских розничных продавцов?
      a: Всего пять досок, можно смешивать любые модели, имеющиеся в наличии. Эта сумма определяет ваш ценовой уровень — вы можете комбинировать универсальные, туристические и художественные издания в одной поставке.
    - q: Кто оплачивает импортные пошлины в моей стране?
      a: Вы, как импортер, в соответствии с правилами вашей страны. Мы предоставляем правильные, полные документы (коммерческий счет, упаковочный лист), чтобы таможенное оформление было прогнозируемым — см. нашу страницу международной доставки для полной информации.
