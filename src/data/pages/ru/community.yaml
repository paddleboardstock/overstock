stories:
  tagline: Истории исследователей
  title: Настоящие приключения от реальных людей
  subtitle: Услышите истории гребцов, семей и профессионалов, которые используют Paddle Board Overstock снаряжение на воде.
  items:
    - name: Сара и Майк
      title: SUP Владельцы Explorer 11, Канада
      content: Мы отправились с нашими Explorer 11 в недельную поездку по парку Алгонкин. Они прекрасно справлялись с переносками и переходами через озёра. drop-stitch Конструкция позволила нам надуть до 15 PSI и добиться работы по жёсткой доске с упаковываемой доски.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Парк Алгонкин, Канада
    - name: Карлос Р.
      title: Гонщик Cheetah Surge в Испании
      content: Cheetah Surge — мой выбор для прибрежных круизов. Яркий дизайн привлекает внимание на пляже, а стабильность придаёт уверенности в лёгкой скорости. Он прекрасно управляется как в туре, так и просто наслаждаюсь закатом.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Коста-Брава, Испания
    - name: Лина и семья
      title: Гребцы Flowing Lotus, Швеция
      content: Семейные приключения на архипелаге на выходных. Flowing Lotus достаточно устойчив, чтобы моя дочь могла стоять, пока я греблю. Надувается менее чем за 10 минут — трейлер не нужен, просто семейное веселье на воде.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Стокгольмский архипелаг, Швеция
    - name: Андрес Д.
      title: Исследователь Ocean Voyager, Филиппины
      content: Я использую свой Ocean Voyager для дальних прибрежных туров вокруг Палавана. После месяцев ежедневного использования в тропических условиях доска всё ещё работает как новая. Форма для туров прорезает чоп, который остановил бы слабые доски.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Палаван, Филиппины
    - name: Эмма Т.
      title: Tropical Breeze, начинающий пользователь, Австралия
      content: Я никогда раньше не катался на SUP. Tropical Breeze настолько устойчивый, что я чувствовал уверенность с первой попытки. Сейчас я катаюсь каждые выходные. Кривая обучения практически нулевая — и доска выглядит потрясающе на воде.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Золотой Берег, Австралия
