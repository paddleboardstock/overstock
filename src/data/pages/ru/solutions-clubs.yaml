testimonial:
  content: Мы начали со стартового пакета Club для нашей школы серфинга в Португалии. 20 досок, весла, жилеты — всё пришло за 3 недели. После двух сезонов мы перешли на пакет Pro. Индивидуальный брендинг с нашим логотипом изменил правила игры в нашем профессиональном имидже.
  name: Рикардо Сантос
  title: Владелец, Algarve Surf Academy — Лагос, Португалия
content_segments:
  tagline: Профили клубов
  title: Решения для клубов водных видов спорта<br />По типу клуба
  subtitle: От университетских паддл-клубов до эксклюзивных частных яхт-клубов — каждый тип клубов имеет уникальные потребности в оборудовании, модели использования и структуру бюджета. Мы адаптируем каждый пакет в соответствии с моделью клуба.
  items:
    - title: Клубы паддл-клубов университетов и колледжей
      subtitle: Студенческие автопарки с высокой посещаемостью
      description: Клубы гребли, управляемые студентами или поддерживаемые учебными заведениями, реализующие программы SUP и каякинга для отделов отдыха университетов. Каждый семестр оборудование сталкивается с высокой частотой и высокой текучестью кадров на разных уровнях квалификации. Долговечность и простота ремонта имеют решающее значение, наряду с доступной ценой для студенческих организаций.
      features:
        - 'Особо прочная конструкция из ПВХ, рассчитанная на студенческие циклы эксплуатации'
        - 'Цветовая маркировка серий досок по уровню подготовки для удобного управления флотом'
        - 'Ремкомплект + видеоконсультации по запросу включены в каждый заказ'
        - 'Скидки для студенческих организаций и оплата по семестрам'
    - title: Общественные весла и социальные клубы
      subtitle: Рекреационные клубы, основанные на членстве
      description: Общественные клубы, предлагающие членам SUP-серфинг, катание на каяках и общение в социальных сетях. Оборудование должно сочетать производительность и комфорт для широкого возрастного диапазона, а брендинг должен способствовать идентичности клуба и гордости его членов. Эффективность хранения является ключевым моментом для клубов, работающих с ограниченным доступом к набережной.
      features:
        - 'Смешанный флот: универсальные SUP, туристические доски и прогулочные каяки'
        - 'Полный клубный брендинг: индивидуальные цвета, печать логотипа, фирменные спасжилеты'
        - 'Компактные решения для хранения надувного снаряжения'
        - 'Стартовый набор для роста числа членов: реферальные карты, фирменная фотосъёмка'
    - title: Школы серфинга и академии серфинга на каяках
      subtitle: Прибрежные выступления и тренировки
      description: Школы серфинга, обучающие навыкам SUP-серфинга, серфинга на каяках и катания на волнах. Оборудование должно работать в условиях прибоя — оно должно быть маневренным, отзывчивым и достаточно прочным, чтобы выдерживать повторяющиеся вытирания, истирание песком и воздействие соленой воды без быстрой деградации.
      features:
        - 'Более короткие и широкие формы SUP, оптимизированные для манёвренности на волне'
        - 'Усиленная конструкция боковин для стойкости к ударам в волнах'
        - 'Специальное снаряжение для сёрфа: спиральные леши, варианты мягких плавников'
        - 'Программа замены флота со сезонными скидками при сдаче в trade-in'
    - title: Корпоративные и частные яхт-клубы
      subtitle: Премиум-членство
      description: 'Эксклюзивные частные клубы, предлагающие водные виды спорта в качестве премиального развлечения для своих членов. Стандарты оборудования высоки: эстетика, соответствие бренду и презентация для гостей так же важны, как и производительность. Ожидаемые услуги включают оперативную доставку, индивидуальные решения для хранения и поддержку на уровне консьержа.'
      features:
        - 'Доски премиальной отделки с EVA под дерево и металлическими акцентами'
        - 'Индивидуальный подбор цветов по фирменному стилю клуба'
        - 'Доставка уровня консьерж: надуты, подготовлены и промаркированы к каждому сезону'
        - 'Персональный менеджер с приоритетным SLA на ответы'
