testimonial:
  content: Мы начали со стартового пакета Club для нашей школы серфинга в Португалии. 20 досок, весла, жилеты — всё пришло за 3 недели. После двух сезонов мы перешли на пакет Pro. Индивидуальный брендинг с нашим логотипом изменил правила игры в нашем профессиональном имидже.
  name: Рикардо Сантос
  title: Владелец, Algarve Surf Academy — Лагос, Португалия
content_segments:
  tagline: Профили клубов
  title: Решения для водных спортивных клубов<br />По типу клуба
  subtitle: От университетских паддл-клубов до эксклюзивных частных яхт-клубов — каждый тип клубов имеет уникальные потребности в оборудовании, модели использования и структуру бюджета. Мы адаптируем каждый пакет в соответствии с моделью клуба.
  items:
    - title: Клубы паддл-клубов университетов и колледжей
      subtitle: Студенческие автопарки с высокой посещаемостью
      description: Клубы по гребле на досках, управляемые студентами или поддерживаемые учебными заведениями, которые проводят SUP программы для университетских отделов досуга. Оборудование подвергается частому и интенсивному использованию на разных уровнях навыков каждый семестр. Ключевыми являются долговечность и простота ремонта, а также доступная цена для студенческих организаций.
      features:
        - Экстра-прочная конструкция PVC, рассчитанная на студенческие циклы использования
        - Доски окрашены по уровню сложности для удобного управления флотом
        - Комплект для ремонта + с видеоподдержкой на заказ включён в каждый заказ
        - Скидки для студенческих организаций и условия оплаты по семестрам
    - title: Общественные весла и социальные клубы
      subtitle: Рекреационные клубы, основанные на членстве
      description: Клубы на базе сообщества, предлагающие SUP клубы и социальные занятия для весла. Оборудование должно балансировать производительность и комфорт для широкой возрастной группы, с брендингом, который способствует клубной идентичности и гордости за членов. Эффективность хранения — ключ к клубам, работающим с ограниченным доступом к воде.
      features:
        - 'Смешанный флот: многоборье и гастроли SUPs'
        - 'Полный брендинг клуба: индивидуальные цвета, печать логотипа, брендированные PFD'
        - Компактные решения для хранения надувного оборудования
        - 'Стартовый набор для роста членства: реферальные карты, брендированные фотографии'
    - title: Школы и академии серфинга SUP
      subtitle: Прибрежные выступления и тренировки
      description: Школы, ориентированные на серфинг, SUP обучающие навыкам серфинга и катания на волнах. Оборудование должно работать в условиях волны — манёвренное, отзывчивое и достаточно долговечное, чтобы выдерживать повторные падения, стирание песка и воздействие солёной воды без быстрого разрушения.
      features:
        - Более короткие, SUP широкие формы, оптимизированные для маневренности на волне
        - Усиленная конструкция рельсов для волнового сопротивления ударам
        - 'Специальное снаряжение безопасности для серфинга: спиральные поводки, варианты с мягкими плавниками'
        - Программа замены автопарка с сезонными скидками при обмене
    - title: Корпоративные и частные яхт-клубы
      subtitle: Премиум-членство
      description: 'Эксклюзивные частные клубы, предлагающие водные виды спорта в качестве премиального развлечения для своих членов. Стандарты оборудования высоки: эстетика, соответствие бренду и презентация для гостей так же важны, как и производительность. Ожидаемые услуги включают оперативную доставку, индивидуальные решения для хранения и поддержку на уровне консьержа.'
      features:
        - Премиальные отделочные доски с текстурой EVA дерева и металлическими акцентами
        - Индивидуальное сопоставление цвета с требованиями клубного бренда
        - 'Консьерж-доставка: заранее надута, оформлена и промаркирована для каждого сезона'
        - Управление выделенными аккаунтами с приоритетным реагированием SLA
