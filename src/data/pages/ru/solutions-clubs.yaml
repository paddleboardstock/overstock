hero:
  tagline: Клубы водных видов спорта
  title: Оборудование и решения<br />Для паддл-клубов и тренировочных центров
  subtitle: Полные пакеты снаряжения, инструкторское оборудование, брендинг и техническая поддержка для SUP-клубов, каякинг-клубов, школ серфинга и учебных центров по водным видам спорта любого размера.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Доски Aquafarer SUP для клубов водных видов спорта и прокатных автопарков
direct_answer: Aquafarer предоставляет комплексные решения по оборудованию для клубов водных видов спорта и тренировочных центров по всему миру. В наши клубные пакеты входят доски для серфинга, каяки, весла, насосы, ремонтные комплекты и защитное снаряжение по конкурентоспособным оптовым ценам с низким минимальным объемом заказа. Каждая упаковка может быть персонализирована с использованием логотипов клуба, фирменных цветов и индивидуальной упаковки. Мы также предоставляем обучение техническому обслуживанию, поддержку запасных частей и программы ротации оборудования, чтобы максимально продлить срок службы вашего парка техники.
