factory_details:
  - label: Размер предприятия
    value: Интегрированный кампус 12 000 м² (130 000 ft²) в зоне экономического развития Циндао
  - label: Годовая мощность
    value: 15 000 лодок, включая SUP, байдарки, тузики, RIB и спасательное оборудование
  - label: Команда НИОКР
    value: Более 25 инженеров в области дизайна продуктов, материаловедения и инженерии качества
  - label: Ключевое оборудование
    value: CNC-столы для резки, RF-диэлектрические сварщики, аппараты горячего воздуха, цифровые принтеры, стеклопластиковые формы, стенды испытания воздухонепроницаемости
  - label: Производственные линии
    value: '6 специализированных линий: резка PVC, сварка труб, формовка стеклопластиковых корпусов, сборка SUP, сборка RIB, финальный QC'
  - label: Годовой объем экспорта
    value: Более 8 млн долларов США экспортируется в более чем 50 стран Европы, Америки, Азиатско-Тихоокеанского региона и Ближнего Востока

