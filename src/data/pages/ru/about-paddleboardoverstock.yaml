hero:
  tagline: О компании
  title: 'О {SITE}'
  subtitle: Вертикально интегрированный производитель водного снаряжения — от сырья до готовой лодки

intro:
  - 'Paddle Board Overstock был основан в 2012 году с одной миссией: проектировать и производить водное снаряжение, которое работает на воде так же хорошо, как и в отчете о качестве. То, что начиналось как мастерская, focused на досках SUP, выросло в интегрированное производственное предприятие площадью 12 000 квадратных метров в зоне экономического развития Циндао, производящее надувные лодки, RIB, байдарки, доски SUP, спасательное оборудование и аксессуары для клиентов в более чем 50 странах.'
  - Сегодня Paddle Board Overstock работает как фабричный бренд — мы проектируем, разрабатываем, создаем прототипы, производим и тестируем все под одной крышей. Эта вертикальная интеграция дает нам прямой контроль над выбором материалов, качеством сборки и сроками поставки. Каждая лодка строится нашими людьми, на нашем оборудовании, по нашим стандартам.
  - Мы обслуживаем частных пользователей, коммерческих операторов, государственные учреждения и партнеров брендов по всему миру. Наши программы OEM и ODM помогают компаниям запускать собственные линейки продуктов без инвестиций в фабричную инфраструктуру. Нужен ли вам единичный прототип или полная производственная партия, наша команда проведет вас от концепции до готовой к морю поставки.

