certifications_section:
  tagline: Сертификаты
  title: Сертифицированное производство CE и ISO
  subtitle: Наши 64 модели, сертифицированные CE, соответствуют международным стандартам безопасности и качества.

values:
  - title: Качество прежде всего
    desc: Каждая лодка, покидающая нашу фабрику, проходит обязательную проверку воздухонепроницаемости, прочности швов и систем перед отправкой.
  - title: Вертикальная интеграция
    desc: Мы контролируем каждый этап — от резки PVC до финальной сборки — устраняя неэффективность субподрядчиков и обеспечивая стабильное качество.
  - title: Безопасность как стандарт
    desc: Сертификация CE — основа того, что мы создаём. Наши 64 модели, сертифицированные CE, соответствуют стандартам безопасности ЕС для рекреационного и коммерческого использования.
  - title: Ориентация на партнера
    desc: Мы строим долгосрочные отношения с партнерами OEM, ODM и private label через прозрачность, надежность и взаимный рост.

services:
  - title: Производство OEM
    desc: Мы производим по вашим спецификациям. Предоставьте ваши чертежи, и наша инженерная команда займется прототипированием, оснасткой и производством.
  - title: Решения ODM
    desc: Начните с наших проверенных платформ дизайна. Настройте размер, цвет, графику и упаковку для создания уникальной линейки продуктов.
  - title: Private Label
    desc: Ваш бренд, ваш логотип, ваша упаковка. Продукты поступают готовыми к розничной продаже с полной интеграцией бренда.
  - title: Индивидуальный брендинг
    desc: Печать на деке, графика корпуса, наклейки на трубы и индивидуальные этикетки — единое присутствие бренда на каждой поверхности.

certifications:
  - name: Сертификация CE
    desc: Наши лодки и плавсредства соответствуют директиве ЕС о рекреационных судах (2013/53/EU) и соответствующим гармонизированным стандартам.
    scope: Лодки и плавсредства
  - name:
    desc: Сертифицированная система менеджмента качества для проектирования, производства и распределения надувных плавсредств.
    scope: Все предприятие
  - name:
    desc: Надувные лодки — требования безопасности и производительности для усиленных и жесткокорпусных надувных лодок.
    scope: Линии RIB и надувные

