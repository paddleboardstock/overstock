timeline:
  - year: '2012'
    title: Фонд морского производства
    body: Aquafarer начиналась как специализированная мастерская по производству надувных лодок в Qingdao, Китай, занимающаяся морским мастерством и производством надувных лодок. Вначале основное внимание уделялось созданию надежных надувных изделий на основе практического инженерного опыта и производственной дисциплины.
  - year: '2015'
    title: Первый экспорт и сертификация CE
    body: Первые экспортные заказы поступили в Японию и Корею. Сертификация CE была получена для основных продуктовых линеек, что ознаменовало выход Aquafarer на международные рынки. Компания начала обслуживать коммерческих и развлекательных пользователей за пределами Китая.
  - year: '2018'
    title: Расширение завода
    body: Переезд в производственное помещение площадью 12 000 м². Добавлены линии радиочастотной сварки и производственные мощности для стежков, что позволяет увеличить масштабы производства и улучшить системы контроля качества.
  - year: '2020'
    title: Создан центр исследований и разработок
    body: Открыт специализированный центр исследований и разработок с лабораторией тканей PVC, резервуаром для гидродинамических испытаний и студией моделирования CAD/FEA. Разработка продукта расширилась, сосредоточившись на облегченной конструкции, повышенной долговечности и дизайне, ориентированном на пользователя.
  - year: '2022'
    title: Сертификация и глобальный рост
    body: Получен сертификат ISO 9001. Расширено до 14 инженеров по исследованиям и разработкам и более 200 рабочих. Продукты достигли клиентов в Европе, Америке и Азиатско-Тихоокеанском регионе через дистрибьюторов и партнерские отношения OEM.
  - year: '2024'
    title: Студия инноваций и дизайна
    body: Открыта студия дизайна и инноваций с полным спектром услуг для индивидуальных проектов ODM, от концепции до производства. Усиление профессиональных морских приложений, включая спасательные, коммерческие и государственные тендеры.
  - year: '2026'
    title: Создавая будущее разведки водных ресурсов
    body: Сегодня Aquafarer продолжает разрабатывать надувные лодки, системы SUP и индивидуальные морские решения, соединяющие людей и организации с водами мира. Обслуживается более 50 стран, годовая мощность 15 000 единиц.
content_founding:
  tagline: Начало
  title: Родился на набережной
  subtitle: 'Aquafarer началась в прибрежной мастерской в ​​Qingdao с одной лодкой и идеей: построить надувной плавсредство, способное работать в реальных морских условиях.'
  paragraphs:
    - В 2012 году наши основатели увидели нишу на рынке — большинство надувных лодок были либо доступными, но ненадежными, либо качественными, но непомерно дорогими. Они считали, что есть место для производителя, который обеспечивает как качество, так и ценность.
    - Первый корпус был построен вручную, испытан в местных водах и доработан на основе реальных отзывов рыбаков и мелких коммерческих операторов. Этот цикл обратной связи — создавайте, тестируйте, слушайте, улучшайте — остается сегодня в основе нашей инженерной философии.
    - К 2015 году слухи распространились за пределы Qingdao. Международные дистрибьюторы начали запрашивать образцы. То, что началось как местная мастерская, превратилось в глобального поставщика.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Ранняя производственная мастерская и производство Aquafarer
content_growth:
  tagline: Рост и инновации
  title: От мастерской до объекта площадью 12 000 м²
  subtitle: Постоянные инвестиции в людей, оборудование и процессы превратили Aquafarer в современное морское производственное предприятие.
  paragraphs:
    - По мере роста спроса росло и наше предприятие. Мы расширились от небольшой мастерской до фабрики площадью 12 000 м² со специализированными производственными линиями для лодок RIB, надувных лодок, досок SUP и аксессуаров.
    - Мы инвестировали в станки для резки с ЧПУ, высокочастотное сварочное оборудование, производственные линии drop stitch и комплексные испытательные стенды, что позволяет нам контролировать каждый аспект качества продукции.
    - Сегодня в нашу команду из 200–300 человек входят морские инженеры, ученые-материаловеды, специалисты по контролю качества и квалифицированные мастера, многие из которых работают в Aquafarer с первых дней ее существования.
founder:
  tagline: Познакомьтесь с основателем
  title: Построен водителем
  subtitle: Основатель Дэвид Чен объединяет производственный опыт и давнюю страсть к водным видам спорта — сочетание, которое определяет подход Aquafarer к разработке продукции.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: Дэвид Чэнь — основатель Aquafarer
  story:
    - Дэвид Чен вырос на побережье Qingdao, где море было не местом отдыха, а образом жизни. Свою юность он провел, занимаясь каякингом, парусным спортом и рыбалкой в ​​Желтом море. Этот опыт дал ему интуитивное понимание того, что приходится выдерживать водным судам.
    - Прежде чем основать Aquafarer, Дэвид десять лет занимался морским производством, занимаясь производством, качеством и международной торговлей. Он руководил OEM программами для европейских и североамериканских брендов, из первых рук изучая стандарты и ожидания мировых рынков.
    - 'В 2012 году он основал Aquafarer с простой миссией: построить надувной гидроцикл, которому он сможет доверить плавание со своей семьей. Этот личный стандарт — буду ли я его использовать? — остается последним испытанием для каждого продукта, покидающего завод.'
    - Сегодня Дэвид руководит стратегией продукта и курирует команду исследований и разработок, лично проверяя новые конструкции и тестируя прототипы в водах Qingdao. Он считает, что отличные продукты рождаются благодаря пониманию как технологии, так и опыта.
philosophy:
  tagline: Философия бренда
  title: Инженерная свобода на воде
  body: Свобода на воде – это не только движение. Он представляет собой открытие новых мест, создание впечатлений на свежем воздухе, соединение людей с природой и выполнение профессиональных миссий. Инженерия делает эту свободу возможной.
  pillars:
    - title: Надежность прежде всего
      body: Водная среда требует доверия. Продукты Aquafarer разработаны с учетом стабильности, долговечности, безопасности и стабильной производительности.
    - title: Человеко-ориентированный дизайн
      body: Продукты должны служить людям, а не технологиям. Каждое дизайнерское решение начинается с понимания того, как люди используют гидроциклы, где они исследуют и с какими проблемами сталкиваются.
    - title: Доступное исследование
      body: Вода не должна принадлежать только экспертам. Aquafarer создает оборудование, которое позволяет большему количеству людей безопасно посещать реки, озера, океаны и прибрежные районы.
    - title: Непрерывные инновации
      body: Инновации – это не только создание новых продуктов. Улучшается каждая деталь — материалы, конструкции, производство и пользовательский опыт.
engineeringDna:
  tagline: Инженерная ДНК
  title: Как Aquafarer создает продукты
  areas:
    - title: Материаловедение
      body: Aquafarer фокусируется на выборе подходящих материалов для различных морских сред. Ключевые факторы включают стойкость к истиранию, устойчивость к ультрафиолетовому излучению, устойчивость к давлению и долговечность.
      items:
        - Устойчивость к истиранию
        - Устойчивость к ультрафиолетовому излучению
        - Стабильность давления
        - Долгосрочная долговечность
    - title: Структурное проектирование
      body: Надувные гидроциклы требуют точного баланса между жесткостью, весом, портативностью и устойчивостью. Aquafarer инженерное дело направлено на оптимизацию этих факторов за счет технологии вышивки сердцевины и усовершенствованной конструкции шва.
      items:
        - Жесткость
        - Оптимизация веса
        - Портативность
        - Стабильность
    - title: Точность производства
      body: 'Каждое изделие проходит контролируемые процессы: подготовку материала, прецизионную резку, сварку и склеивание, сборку, проверку качества и проверку работоспособности.'
      items:
        - Подготовка материала
        - Точная резка
        - Сварка и склеивание
        - Сборка и контроль качества
    - title: Разработка пользовательских сценариев
      body: Продукты разрабатываются для реальных применений — для отдыха, приключений и профессионального использования — гарантируя, что каждый дизайн соответствует конкретным требованиям предполагаемой среды.
      items:
        - Отдых
        - Приключение
        - Профессиональное использование
        - Коммерческий
trustSignals:
  tagline: Сигналы доверия
  title: Почему Aquafarer — надежный партнер
  manufacturing:
    title: Производственные возможности
    body: Производственный комплекс площадью 12 000 м², на котором работают 200–300 квалифицированных рабочих и более 14 инженеров по исследованиям и разработкам. ISO Сертифицированная система менеджмента качества 9001. Годовой объем производства 15 000 надувных гидроциклов для обслуживания более чем 50 стран.
    stats:
      - label: Размер объекта
        value: 12 000 м²
      - label: Рабочая сила
        value: 200-300
      - label: Инженеры по исследованиям и разработкам
        value: 14+
      - label: Годовая мощность
        value: 15 000
  quality:
    title: Обязательства по качеству
    body: От проверки материалов до окончательного тестирования Aquafarer поддерживает систематические процессы обеспечения качества, чтобы поставлять надежную морскую продукцию. Перед отправкой каждое изделие проходит испытания под давлением, проверку швов и проверку работоспособности.
    items:
      - CE Сертифицировано — 64 модели соответствуют европейским стандартам безопасности.
      - ISO 9001:2015 — Сертифицирована система менеджмента качества
      - UKCA Маркировка — соответствие рынку Великобритании.
  global:
    title: Глобальное присутствие
    body: Aquafarer обслуживает клиентов на нескольких мировых рынках, поддерживая дистрибьюторов, бренды активного отдыха и профессиональных пользователей морских судов в более чем 50 странах Европы, Азиатско-Тихоокеанского региона, Америки, Ближнего Востока и Африки.
