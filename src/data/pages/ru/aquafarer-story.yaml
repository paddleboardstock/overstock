hero:
  tagline: Наша история
  title: Aquafarer — Инженерная свобода на воде
  subtitle: 'От прибрежной мастерской до мирового производителя морских судов — наш путь основан на упрямом убеждении: водные суда следует проектировать так, как они имеют значение, потому что они имеют значение.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Завод и морское производственное предприятие Aquafarer в Циндао
