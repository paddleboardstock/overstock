content_scope:
  tagline: Область соответствия
  title: Какие продукты должны соответствовать требованиям УЗО?
  subtitle: Директива о прогулочных судах 2013/53/EU применяется к прогулочным судам с длиной корпуса от 2,5 до 24 м. Понимание области действия — это первый шаг к соблюдению требований.
  items:
    - title: РИБ-лодки (2,5–24 м)
      description: Под УЗО подпадают жесткие надувные лодки с длиной корпуса от 2,5 м до 24 м. Категории проектирования от A до D применяются в зависимости от предполагаемых морских условий и максимальной силы ветра.
      icon: tabler:sailboat
    - title: Надувные лодки (до 2,5 м)
      description: Небольшие надувные лодки и шлюпки длиной менее 2,5 м могут быть частично освобождены от RCD, но все же требуют маркировки CE в соответствии с другими применимыми директивами и строительными стандартами EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP доски и аксессуары
      description: Доски для стоячих веслов выходят за рамки УЗО. Однако соответствующие индивидуальные плавучие устройства (PFD) требуют маркировки CE в соответствии с Регламентом СИЗ (ЕС) 2016/425 с одобрением USCG типа III/V, где это применимо.
      icon: tabler:swimming
    - title: Частично завершенные лодки
      description: Лодки, поставляемые без двигателя или специальных установок, требуют Декларации строителя для частично завершенных судов с полным соответствием RCD, заполненным конечным строителем или импортером.
      icon: tabler:tool
content_trust_layers:
  tagline: Трехуровневая система доверия
  title: Информация о соответствии<br />— передается на нужном уровне
  subtitle: Не все данные о соответствии находятся на общедоступном веб-сайте. Мы придерживаемся трехуровневого подхода, который защищает интеллектуальную собственность и одновременно укрепляет доверие покупателей.
  items:
    - title: Уровень 1 — общедоступный веб-сайт
      description: Ссылки на стандарты, объяснение маршрутов соответствия, перечень типов документов, область сертификации для каждого семейства моделей. Никаких действительных сертификатов, данных испытаний или запатентованных технических данных.
      icon: tabler:world
    - title: Уровень 2 — Обмен после запроса
      description: 'После квалифицированного запроса: отредактированный образец DoC, фотография таблички изготовителя, список применимых стандартов, контрольный список соответствия и сводные данные о сертификации материалов — предоставляются на условиях добросовестного использования.'
      icon: tabler:mail
    - title: Уровень 3 – соглашение о неразглашении/этап заказа
      description: Полный технический файл, оценки рисков, расчеты стабильности, отчеты об испытаниях, записи партий материалов и документация по отслеживанию производства — предоставляются только подтвержденным покупателям в соответствии с соглашением о неразглашении.
      icon: tabler:lock
content_standards:
  tagline: Применимые стандарты
  title: Стандарты ISO и EN<br />Мы строим для
  subtitle: Наша продукция разработана и протестирована на соответствие гармонизированным стандартам УЗО. Приводятся стандартные номера и имена; полные стандартные тексты сохраняют авторские права ISO.
  items:
    - title: ЕН ИСО 6185-3
      description: Лодки надувные. Часть 3. Лодки с максимальной мощностью двигателя 15 кВт и более. Требования к конструкции, остойчивости, плавучести и эвакуации человека за борт для РИБ.
      icon: tabler:file-text
    - title: ЕН ИСО 6185-4
      description: Надувные лодки. Часть 4. Лодки с максимальной мощностью двигателя 15 кВт и мощностью не менее 4,5 кВт. Дополнительные требования к конструкции и устойчивости.
      icon: tabler:file-text
    - title: Серия ISO 12215
      description: Малое судно — Конструкция корпуса и каркас. Конструктивное проектирование корпуса, палубы и переборок для корпусов RIB из стекловолокна и алюминия.
      icon: tabler:ruler-2
    - title: ЕН ИСО 10240
      description: Малое судно — Руководство пользователя. Обязательное содержание и формат руководства пользователя, прилагаемого к каждой лодке RIB, поставляемой в ЕС.
      icon: tabler:book
    - title: ЕН ИСО 14945
      description: Малая поделка — Тарелка Строителя. Информация должна быть указана на табличке строителя, постоянно прикрепленной к каждому судну.
      icon: tabler:badge
    - title: ИСО 8666
      description: Малое судно. Основные данные. Стандартизированные измерения и параметры для единообразия спецификаций во всей документации по продукту.
      icon: tabler:dimensions
content_process:
  tagline: Процесс соответствия
  title: 6-этапный процесс соответствия требованиям CE<br />Рабочий процесс
  subtitle: От объема проекта до отслеживания на серийном уровне — каждая модель RIB следует определенному пути соответствия.
  steps:
    - number: '01'
      title: Объем и классификация проекта
      description: Определите модель РИБ, категорию конструкции (A/B/C/D), максимальное количество человек, полезную нагрузку, мощность двигателя и целевой рынок. Определите, применяется ли УЗО и какой модуль оценки соответствия требуется.
      timeline: 2–3 дня
    - number: '02'
      title: Определение применимых требований
      description: Определите все применимые основные требования безопасности из Приложения I УЗО, соответствующие гармонизированные стандарты (EN ISO 6185, 12215, 10240, 14945) и любые дополнительные национальные требования для целевого рынка.
      timeline: 3–5 дней
    - number: '03'
      title: Проектная и техническая документация
      description: 'Создайте главный технический файл: чертежи общего вида, расчеты остойчивости и плавучести, оценку рисков, спецификации материалов и анализ безопасности систем (топливная, электрическая, рулевая).'
      timeline: 10–15 дней
    - number: '04'
      title: Проверка и тестирование продукта
      description: Проведите физическую проверку — испытания под давлением, превышающим номинальное в 1,25 раза, в течение 24–48 часов, испытания на устойчивость и плавучесть, испытания под нагрузкой и ввод системы в эксплуатацию. Запишите все результаты испытаний по корпусу.
      timeline: 5–7 дней
    - number: '05'
      title: Маркировка и документация на поставку
      description: Прикрепите маркировку CE, табличку производителя (EN ISO 14945) и HIN/CIN (идентификационный номер корпуса). Подготовьте декларацию соответствия ЕС, руководство пользователя (EN ISO 10240) и контрольный список соответствия.
      timeline: 2–3 дня
    - number: '06'
      title: Прослеживаемость на серийном уровне
      description: Каждый корпус получает уникальную запись корпуса, связывающую его с основным техническим файлом, производственной партией, сертификатами на материалы, результатами испытаний и окончательной конфигурацией. Записи хранятся более 10 лет на каждое УЗО.
      timeline: Непрерывный
content_document_cards:
  tagline: Типы документов
  title: Документ о соответствии<br />Карты
  subtitle: Это типы документов, которые мы готовим и поддерживаем для каждой модели RIB, сертифицированной CE. Образцы доступны по квалифицированному запросу.
  items:
    - title: Сертификат соответствия CE/УЗО
      description: Сертификат для конкретной модели, подтверждающий, что судно соответствует всем применимым основным требованиям безопасности RCD 2013/53/EU, выданный производителем с участием уполномоченного органа, где это необходимо.
      icon: tabler:certificate
    - title: Декларация соответствия ЕС (DoC)
      description: Подписанная производителем или уполномоченным представителем декларация с указанием применимых директив, стандартов, модуля соответствия и сведений об уполномоченном органе. Требуется для каждой модели, представленной на рынке ЕС.
      icon: tabler:file-check
    - title: Табличка строителя (EN ISO 14945)
      description: Постоянно прикрепленная табличка с указанием максимального количества человек, максимальной мощности двигателя, категории конструкции и идентификации производителя. Должно оставаться разборчивым на протяжении всего срока службы судна.
      icon: tabler:badge
    - title: Руководство пользователя (EN ISO 10240)
      description: Подробное руководство, описывающее безопасную эксплуатацию, аварийные процедуры, графики технического обслуживания и предупреждения по технике безопасности. Обязательно для каждой надувной лодки, доставляемой в ЕС.
      icon: tabler:book
    - title: Отчеты об испытаниях и проверках ISO
      description: Записи испытаний под давлением (1,25x/24–48 ч), результаты испытаний на остойчивость и плавучесть, сертификаты испытаний материалов и отчеты о проверке размеров — все это связано с конкретными номерами корпуса.
      icon: tabler:test-pipe
    - title: Записи о отслеживании материалов
      description: Отслеживание на уровне партии трубчатой ткани, клеев, стекловолокна и метизов. Связывает каждую производственную единицу с входящими сертификатами на материалы и результатами проверки IQC.
      icon: tabler:link
    - title: Контроль качества и записи контроля качества
      description: Контрольный список качества из 100 пунктов на единицу, записи текущего контроля качества, отчеты о несоответствиях и корректирующие действия. Часть цепочки отслеживания производства.
      icon: tabler:clipboard-check
    - title: Пакет документов проекта
      description: Пакет документации по корпусу, включая запись окончательной конфигурации, детали установки двигателя и оборудования, контрольный список ввода в эксплуатацию и документацию на поставку.
      icon: tabler:package
content_design_categories:
  tagline: Категории конструкции УЗО
  title: Категория дизайна A–D<br /> — что они означают
  subtitle: RCD присваивает категории конструкции на основе максимальной силы ветра и значительной высоты волн, на которые судно рассчитано.
  items:
    - title: Категория А — Океан
      description: Предназначен для длительных плаваний, где сила ветра может превышать 8 баллов по шкале Бофорта (>40 узлов), а значительная высота волн может превышать 4 м. Требует самой строгой проверки конструкции и устойчивости.
      icon: tabler:ripple
    - title: Категория Б — Оффшор
      description: Предназначен для морских плаваний при силе ветра до 8 баллов по шкале Бофорта (до 40 узлов) и значительной высоте волн до 4 м. Подходит для прибрежных и полуоткрытых вод.
      icon: tabler:anchor
    - title: Категория C — Прибрежный
      description: Предназначен для прибрежных плаваний при силе ветра до 6 баллов по шкале Бофорта (до 27 узлов) и значительной высоте волн до 2 м. Большинство прогулочных РИБов попадают в эту категорию.
      icon: tabler:sun
    - title: Категория D — Закрытые
      description: Предназначен для защищенных вод с силой ветра до 4 баллов по шкале Бофорта (≤16 узлов) и значительной высотой волн до 0,3 м. Озера, реки и охраняемые гавани.
      icon: tabler:pool
content_hin:
  tagline: Идентификация ремесла
  title: HIN/CIN и табличка строителя
  subtitle: Для каждой лодки RIB требуется идентификационный номер корпуса (HIN) или идентификационный номер судна (CIN) и табличка производителя в соответствии с требованиями EN ISO 14945 и RCD.
  items:
    - title: Идентификационный номер корпуса (HIN)
      description: Уникальный 14-значный код, постоянно нанесенный на правую сторону транца, кодирующий код производителя (MIC), год модели, год производства и серийный номер. Требуется для выхода на рынок ЕС.
      icon: tabler:hash
    - title: Идентификационный номер судна (CIN)
      description: Согласно EN ISO 10087, скрытый вторичный идентификационный номер, размещенный в скрытом месте в целях защиты от кражи и отслеживания.
      icon: tabler:eye-off
    - title: Содержимое таблички строителя
      description: Максимальное количество человек, максимальная мощность двигателя (кВт), максимальная нагрузка (кг), категория конструкции, название производителя и маркировка CE — все это постоянно отображается на устойчивой к коррозии табличке.
      icon: tabler:badge
content_tech_file:
  tagline: Техническая структура файла
  title: Основной технический файл<br />и запись о корпусе
  subtitle: 'Наша система документации имеет двухуровневую структуру: главный технический файл для каждого семейства моделей и отдельные записи корпуса для каждой произведенной лодки.'
  items:
    - title: Основной технический файл
      description: 'Содержит полную документацию о соответствии для семейства моделей: общий вид, оценку рисков, расчеты остойчивости/плавучести, спецификации материалов, применимые стандарты и записи оценки соответствия. Сохраняется более 10 лет.'
      icon: tabler:folder
    - title: Рекорд корпуса (отслеживание по каждой лодке)
      description: 'Каждый корпус имеет уникальную запись, связывающую его с основным техническим файлом: HIN, дату производства, партию труб, сертификаты на материалы, результаты испытаний под давлением, окончательную конфигурацию, установку двигателя и пункт назначения.'
      icon: tabler:file-description
    - title: Пакет соответствия требованиям клиентов
      description: Пакет поставки по корпусу, включая DoC, фотографию таблички строителя, руководство пользователя, сводку испытаний и лист окончательной конфигурации — поставляется с каждой надувной лодкой, отправляемой в ЕС.
      icon: tabler:package
faq:
  title: Соответствие CE — часто задаваемые вопросы
  questions:
    - q: Все ли лодки Paddle Board Overstock RIB сертифицированы CE для рынка ЕС?
      a: Лодки RIB в нашем каталоге спроектированы и задокументированы в соответствии с требованиями RCD 2013/53/EU и действующими директивами ЕС. Маркировка CE применяется к каждой модели и к каждой конфигурации. Свяжитесь с нами для получения документа об области соответствия конкретной модели.
    - q: В чем разница между соответствием УЗО и маркировкой CE?
      a: RCD (Директива о рекреационных судах 2013/53/EU) — это законодательство ЕС, устанавливающее основные требования безопасности. Маркировка CE — это визуальный символ, нанесенный на продукт, который был оценен и подтвержден на соответствие этим требованиям. Прежде чем продукт сможет иметь маркировку CE, он должен соответствовать требованиям УЗО.
    - q: Предоставляете ли вы декларации соответствия на каждое судно?
      a: Да. Каждая лодка RIB, поставляемая на рынок ЕС, включает в себя декларацию соответствия ЕС для конкретной модели, в которой перечислены применимые директивы, гармонизированные стандарты, модуль оценки соответствия и сведения об уполномоченном органе.
    - q: Какой модуль оценки соответствия использует Paddle Board Overstock?
      a: Модуль зависит от категории конструкции и типа лодки. В большинстве моделей RIB категории конструкции C используется модуль A (внутренний производственный контроль). Для лодок проектной категории A/B или конкретных конфигураций модуль B+C или B+D может применяться при участии уполномоченного органа. Мы консультируем по соответствующему модулю для каждого проекта.
    - q: Можете ли вы поделиться документацией о соответствии, прежде чем мы разместим заказ?
      a: После квалифицированного запроса мы предоставляем документ об области соответствия со списком применимых стандартов, маршрута соответствия и типов документов, доступных для оцениваемой вами модели. Полные технические файлы передаются в соответствии с соглашением о неразглашении после подтверждения заказа.
    - q: Что такое бортовой идентификационный номер (HIN) и включен ли он?
      a: HIN — это 14-значный уникальный идентификатор, постоянно нанесенный на каждую лодку и кодирующий код производителя (MIC), обозначение модели, год производства и серийный номер. Это обязательно для всех лодок RIB, представленных на рынке ЕС, и включено в каждую RIB Paddle Board Overstock.
    - q: Как долго хранятся технические файлы?
      a: В соответствии с требованиями RCD 2013/53/EU производитель должен хранить технический файл в течение как минимум 10 лет с даты последнего размещения продукта на рынке. Paddle Board Overstock ведет полную техническую документацию на все выпускаемые модели.
    - q: Помогаете ли вы выполнять обязательства импортера в соответствии с RCD?
      a: 'Да. Мы предоставляем пакет документации, необходимый импортерам ЕС для выполнения своих обязательств: доступ к техническим файлам, DoC, табличку производителя, руководство пользователя и записи о отслеживании продукции. Обязанности импортера в соответствии с RCD четко описаны в нашем руководстве по соблюдению требований.'
