content_material_cert:
  tagline: Сертификация материалов
  title: Прослеживаемость материалов и свидетельства сертификации
  subtitle: Лодки качества RIB начинаются с контролируемых материалов и документированных процессов. Ниже описано, как мы организуем сертификацию материалов для каждой группы критически важных компонентов.
  items:
    - title: Отслеживание материала надувной трубки
      description: Материалы трубок PVC и CSM/Hypalon выбираются в соответствии с предполагаемым использованием, климатическими условиями и целевым рынком. Технические данные поставщика (TDS), информация о партии материала, отслеживаемость партий ткани, отчеты об испытаниях на УФ-излучение и атмосферные воздействия, а также декларации REACH/SVHC доступны в рамках согласованного объема проектной документации.
      icon: tabler:circle
    - title: Отслеживание морского алюминия
      description: Для проектов с алюминиевым корпусом RIB марка сплава, толщина и партии материалов контролируются в соответствии с утвержденными спецификациями. Сертификаты испытаний материалов (MTC/MTR), документация EN 10204 3.1, отчеты о химическом составе и механических свойствах, а также данные о отслеживании плавки/партии предоставляются по согласованию.
      icon: tabler:rectangle
    - title: GRP Контроль материалов и процессов корпуса
      description: Для RIB со стекловолоконным корпусом гелькоут, смола, армирование из стекловолокна и материалы сердцевины контролируются в соответствии с контролируемыми спецификациями. TDS/SDS материала, записи о партиях, спецификации ламината, а также записи об отверждении и производственном контроле доступны по соглашению с проектом.
      icon: tabler:layers-subtract
    - title: Поддержка документации компонентов
      description: Для выбранных компонентов, включая материалы палубы EVA, сиденья, оборудование из нержавеющей стали, топливные системы, электрооборудование и морские аксессуары, действующая документация поставщика согласовывается на основе окончательной конфигурации и требований рынка назначения.
      icon: tabler:package
    - title: Уведомление об области соответствия
      description: Сертификаты, протоколы испытаний и документы о соответствии применимы только к конкретной модели продукта, материалу, компоненту, производственной партии или объему проекта, указанным в соответствующем документе. Свяжитесь с нами и сообщите свой целевой рынок, предполагаемое использование и технические требования, чтобы можно было подтвердить применимый пакет документации перед размещением заказа.
      icon: tabler:info-circle

