features3_solutions:
  tagline: Решения
  title: Ваше водное приключение<br />Деловой партнер
  isBeforeContent: false
  columns: 3
  items:
    - title: Клубы водных видов спорта
      description: Полные пакеты оборудования, индивидуальный брендинг и программы технического обслуживания для SUP клубов, каякинг-клубов, школ серфинга и учебных центров.
      icon: tabler:users
      link: /solutions/clubs
    - title: Водные виды спорта
      description: Специально созданные надувные лодки для парусных школ, центров водного спорта и организаций мероприятий. Тренерские катера, буксиры и маршальские суда для профессионального водного спорта.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Курорты и отели
      description: Премиальные программы по водным видам спорта с оборудованием для автопарка, системами безопасности, обучением персонала и управлением доходами для объектов гостеприимства.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Предприниматели водных брендов
      description: Производство под частной торговой маркой OEM/ODM с низким минимальным объемом заказа, индивидуальным дизайном продукции, упаковкой и доставкой по всему миру для новых владельцев брендов.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Дайвинг-центр Лодки
      description: Стабильные платформы RIB с удобным входом/выходом, хранением снаряжения и конфигурациями двигателей, оптимизированными для дайвинг-операций.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Спасательные и аварийные суда
      description: Высокоскоростные RIB и надувные лодки, предназначенные для поиска и спасения, реагирования на чрезвычайные ситуации и операций береговой охраны.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Решения для тендеров яхт
      description: Компактные и стильные тендеры RIB, дополняющие суперяхты и прогулочные суда. Лёгкое хранение, мощные характеристики.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Решения для рыболовных лодок
      description: Стабильные и прочные надувные лодки и RIB, настроенные для коммерческого и любительского рыболовства.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Оборудование морского туризма
      description: Готовые для флота надувные лодки, доски SUP и каяки для курортов, туроператоров и прокатов водного спорта.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Морские энергетические РИБы
      description: Сверхмощные РИБ для поддержки нефтегазовых платформ, перевозки бригад ветроэлектростанций, проверки подводных кабелей и морского строительства.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Рабочие лодки для аквакультуры
      description: Коррозионностойкие РИБы для рыбоводства, выращивания жемчуга и океанского животноводства. Hypalon трубки, фурнитура из нержавеющей стали, долговечность при ежедневном использовании.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Морские исследования и исследования
      description: Стабильные готовые к использованию РИБы для океанографических исследований, мониторинга окружающей среды, отбора проб качества воды и программ университетского обучения.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Коммерческие рабочие суда
      description: Усиленные RIB для патрулирования, съёмки, транспортировки и офшорной логистики. Созданы для жёстких требований коммерческой эксплуатации.
      icon: tabler:ship
      link: /commercial-workboats
