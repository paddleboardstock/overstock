hero:
  tagline: Решения для арендного бизнеса
  title: Постройте прибыльный бизнес по аренде водных видов спорта<br />с Paddle Board Overstock
  subtitle: Полный пакет услуг по аренде автопарка для SUP-клубов, пляжных курортов, операторов озер и центров водных видов спорта — от выбора оборудования до управления автопарком и технической поддержки.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-paddle-girls-team.webp
    alt: Флот проката водных видов спорта Paddle Board Overstock в действии
direct_answer: Paddle Board Overstock предоставляет комплексные бизнес-решения по аренде для операторов водных видов спорта. От парка SUP для начинающих до аренды надувных лодок коммерческого уровня — мы помогаем вам выбрать подходящее оборудование, оптимизировать размер парка для вашего местоположения, минимизировать время простоя на техническое обслуживание и максимизировать доход от аренды. Наши проверенные на прокат продукты имеют конструкцию из ПВХ коммерческого класса, легко ремонтируются и имеют надувную конструкцию, что исключает затраты на хранение. Независимо от того, запускаете ли вы новую операцию по аренде или модернизируете существующий автопарк, Paddle Board Overstock предоставит оборудование и опыт для построения прибыльного бизнеса по аренде водных видов спорта.
solution_offerings:
  - title: Стартовый комплект флота
    subtitle: Для новых операций по аренде, тестирующих рынок
    badge: Popular
    features:
      - title: Оценка флота
        description: Экспертный анализ вашего местоположения, демографических данных гостей и целевых показателей дохода для определения размера вашего автопарка.
      - title: Стартовое оборудование
        description: 10 досок SUP с веслами, насосами, спасательными жилетами и ремонтными комплектами — все, что нужно для спуска на воду.
      - title: Решения для хранения данных
        description: Надувное снаряжение упаковывается в плоском виде — для хранения не требуется причал или прицеп для лодки.
      - title: Соответствие требованиям безопасности
        description: Все оборудование сертифицировано CE и имеет конструкцию коммерческого класса для ежедневной аренды.
      - title: Стартовый маркетинг
        description: Фирменные фотоматериалы и шаблоны меню аренды, которые помогут вам запустить свой сервис.
    cta_text: Start Rental Fleet
    cta_href: /contact
  - title: Комплект расширения парка
    subtitle: Для увеличения производительности и разнообразия
    badge: Premium
    features:
      - title: Смешанный дизайн флота
        description: Сочетание SUP, каяков, надувных лодок и RIB для удовлетворения разнообразных предпочтений гостей.
      - title: Объемное ценообразование
        description: Многоуровневые оптовые цены для автопарков из 20+ единиц с льготными тарифами на логистику.
      - title: Пользовательский брендинг
        description: Печать логотипа на оборудовании, фирменных спасательных жилетах и индивидуальные цветовые решения для вашего арендуемого парка.
      - title: Программа обслуживания
        description: Комплект запасных частей, обучение персонала ремонту и прямой доступ к технической поддержке.
      - title: Оптимизация доходов
        description: Рекомендации на основе данных по ценообразованию, ротации оборудования и сезонной корректировке парка оборудования.
    cta_text: Scale My Fleet
    cta_href: /contact
