testimonial:
  content: Я арендовал 5 досок в местном магазине и потерял из-за них 60% своего дохода. Paddle Board Overstock помог мне построить собственный флот из 15 SUP. Предоставленный ими калькулятор рентабельности инвестиций показал, что я выйду на уровень безубыточности через 4 месяца — на самом деле для этого потребовалось 3. Теперь я расширяю до 30 досок и добавляю каяки.
  name: Дэниел Оконкво
  title: Владелец компании Lakeland SUP Rentals — Онтарио, Канада
content_segments:
  tagline: Профили аренды
  title: Решения по аренде водных видов спорта<br />По типу оператора
  subtitle: У разных компаний по прокату разные потребности — от небольших пунктов проката SUP-серфинга на пляже до крупных курортных центров водных видов спорта. Мы соответствующим образом адаптируем наши пакеты оборудования и модели поддержки.
  items:
    - title: Аренда SUP на пляже и на берегу озера
      subtitle: Большие объемы операций с низкой сложностью
      description: Операторы сдают в аренду доски для серфинга и каяки непосредственно любителям пляжного отдыха и посетителям озера. Вашим приоритетом является минимизация времени между арендами, поддержание ротации оборудования и управление сезонными скачками спроса при небольшой занимаемой площади.
      features:
        - Флоты надувных SUP, которые складываются плоско — не нужны пирс или прицеп
        - ПВХ коммерческого класса, рассчитанный более чем на 100 циклов проката за сезон
        - Быстросохнущая, устойчивая к УФ ткань для готовности к повторной сдаче в тот же день
        - Линейки досок с цветовой маркировкой для удобной идентификации флота
    - title: Центры водных видов спорта курортов и отелей
      subtitle: Опыт гостей и соответствие бренда
      description: Курорты и отели, предлагающие водные виды спорта в качестве развлечения. Оборудование должно выглядеть превосходно, надежно работать для гостей от начинающего до среднего уровня и интегрироваться с существующими процессами бронирования мероприятий и выставления счетов на курорте.
      features:
        - Суповые доски и спасательные жилеты с индивидуальным брендингом в цветах курорта
        - 'Смешанный флот: SUP, каяки, педальные лодки и малые тендеры RIB'
        - Тихие безтопливные электрические насосы для накачивания на пляже
        - Включено обучение персонала и вводное обслуживание
    - title: Операторы по аренде лодок и надувных лодок
      subtitle: Арендный флот коммерческих судов
      description: Операторы арендуют моторные суда — тендеры RIB, надувные лодки и небольшие катера — на час или полдня. Ваш флот должен соответствовать правилам морской безопасности, выдерживать интенсивное использование гостей и минимизировать время простоя оборудования между чартерами.
      features:
        - Комплекты RIB с транцами, готовыми под подвесные моторы 30–90 л.с.
        - Морские фанерные панели настила для долгосрочной структурной прочности
        - Системы клапанов быстрого запуска для ускоренной оборачиваемости
        - Комплект запчастей + техническая поддержка SLA по вызову
    - title: Операторы туров и приключений
      subtitle: Экскурсионный флот с гидом
      description: Операторы, организующие туры по водным видам спорта — SUP-сафари, каякинг по пещерам, экскурсии с подводным плаванием или туры по островам на надувных лодках. Снаряжение должно быть достаточно устойчивым для начинающих туристов, быстро чиститься между группами и достаточно прочным для ежедневного использования под руководством гида в различных водных условиях.
      features:
        - Сверхстабильные SUP-платформы (шириной 82 см и более) для новичков
        - Варианты двухместных каяков для конфигураций парных и групповых туров
        - Встроенная грузоподъёмность для снаряжения для сноркелинга, гермосумок и холодильников
        - Документация о соответствии CE + USCG для коммерческой эксплуатации
