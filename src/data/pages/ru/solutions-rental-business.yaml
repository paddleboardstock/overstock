testimonial:
  content: Раньше я арендовал 5 досок в местном магазине и терял 60% своего дохода им. Paddle Board Overstock помог мне создать собственный флот из 15 SUPs. Калькулятор ROI, предоставленный ими, показал, что я выйду на окупаемость за 4 месяца — на самом деле потребовалось 3. Теперь я расширяюсь до 30 досок.
  name: Дэниел Оконкво
  title: Владелец компании Lakeland SUP Rentals — Онтарио, Канада
content_segments:
  tagline: Профили аренды
  title: Решения для аренды водного спорта<br />По типу оператора
  subtitle: У разных компаний по прокату разные потребности — от небольших пунктов проката SUP-серфинга на пляже до крупных курортных центров водных видов спорта. Мы соответствующим образом адаптируем наши пакеты оборудования и модели поддержки.
  items:
    - title: Аренда SUP на пляже и на берегу озера
      subtitle: Большие объемы операций с низкой сложностью
      description: Операторы, сдающие в аренду доски для стоячего весла непосредственно отдыхающим на пляже и посетителям озера. Ваш приоритет — минимизировать время между арендами, поддерживать оборудование в ротации и управлять сезонными пиками спроса с небольшой занимаемой площадью.
      features:
        - Надувные SUP парки, которые складываются в плоский вид — не требуется причал или трейлер
        - Коммерческий PVC, рассчитанный на 100+ циклов аренды за сезон
        - Быстросохнущая, устойчивая к UV ткань для готовности к повторной аренде в тот же день
        - Диапазоны досок с цветовой маркировкой для легкой идентификации флота
    - title: Центры водных видов спорта курортов и отелей
      subtitle: Опыт гостей и соответствие бренда
      description: Курорты и отели, предлагающие водные виды спорта в качестве развлечения. Оборудование должно выглядеть превосходно, надежно работать для гостей от начинающего до среднего уровня и интегрироваться с существующими процессами бронирования мероприятий и выставления счетов на курорте.
      features:
        - Доски и спасательные жилеты с индивидуальным брендингом SUP, соответствующие цветам курорта
        - 'Смешанный флот: универсальные, туристические и арт-серии SUPs'
        - Тихие, безтопливные электрические насосы для надувания на пляже
        - Включено обучение персонала и ввод в эксплуатацию
    - title: Бутик и мобильная аренда SUP
      subtitle: Пошаговые и доставочные услуги аренды
      description: Операторы доставляют доски напрямую клиенту — доставка на пляж отеля, временные пункты аренды на мероприятиях и мобильные установки. Оборудование должно быть быстро развертываемым, легким в транспортировке и презентабельным с первого взгляда, с возможностью гибкого увеличения парка для мероприятий и сезонного спроса.
      features:
        - Переноска досок в рюкзаке — без прицепа
        - Быстрое надувание для оперативной подготовки за менее чем 15 минут
        - Презентабельное оборудование, которое выглядит премиально с первого взгляда
        - Гибкая настройка парка для мероприятий и сезонного спроса
    - title: Операторы туров и приключений
      subtitle: Экскурсионный флот с гидом
      description: Операторы проводят экскурсии с водными видами спорта — сафари SUP, экскурсии с маской и трубкой, и прибрежные исследовательские туры. Оборудование должно быть устойчивым для новичков, легко очищаемым между группами и достаточно прочным для ежедневного использования в различных водных условиях.
      features:
        - Дополнительно устойчивые платформы SUP (шириной 32" +) для начинающих райдеров
        - Дополнительно большие устойчивые платформы для фото пар/групп
        - Встроенная грузовая емкость для снаряжения для снорклинга, сухих сумок и кулеров
        - Комплекты защитного оборудования для коммерческих туропераций
