hero:
  tagline: Сертификации и стандарты
  title: 'Сертификация качества<br />и стандарты соответствия'
  subtitle: 'Продукция Aquafarer производится в соответствии с международными стандартами морской безопасности, системами менеджмента качества и природоохранными нормами.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Сертификаты качества и документация о соответствии Aquafarer
content_certifications:
  tagline: Наши сертификаты
  title: 'Сертифицированное качество,<br />признанное во всём мире'
  subtitle: '64 модели с сертификацией CE и сертификация всей фабрики демонстрируют нашу приверженность качеству, безопасности и экологической ответственности.'
  items:
    - title: 'Сертификация CE'
      description: '64 модели с сертификацией CE соответствуют европейским требованиям маркировки CE для прогулочных судов, обеспечивая соблюдение стандартов безопасности, здоровья и охраны окружающей среды.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Наша система менеджмента качества сертифицирована по ISO 9001:2015 и охватывает проектирование, производство и распространение надувных судов и морского оборудования.'
      icon: tabler:clipboard-check
    - title: 'Маркировка UKCA'
      description: 'Продукция, продаваемая на рынке Великобритании, имеет маркировку UKCA, подтверждая соответствие нормативам Великобритании для морского оборудования и прогулочных судов.'
      icon: tabler:shield
    - title: 'Соответствие BSCI'
      description: 'Aquafarer проходит аудит BSCI (Business Social Compliance Initiative), что подтверждает этичные производственные практики, справедливые условия труда и ответственность цепочки поставок.'
      icon: tabler:heart-handshake
    - title: 'Соответствие REACH'
      description: 'Все материалы, используемые в продукции Aquafarer, соответствуют регламенту REACH ЕС по химической безопасности, что гарантирует отсутствие ограниченных веществ в нашем ПВХ, Hypalon и комплектующих.'
      icon: tabler:flask
    - title: 'Испытания материалов'
      description: 'Ткани проходят испытания на прочность на разрыв, стойкость к разрыву, УФ-деградацию и устойчивость к растрескиванию на холоде. Каждая производственная партия выборочно проверяется.'
      icon: tabler:test-pipe
content_factory:
  tagline: Заводские стандарты
  title: 'Производственное совершенство<br />— точно по спецификации'
  subtitle: 'Наше производство площадью 12,000 m² работает по строгим протоколам контроля качества на каждом этапе производства.'
  list:
    - 'Входной контроль материалов: все сырьевые материалы — ткань ПВХ, Hypalon, алюминий, фанера, клеи — проверяются на соответствие спецификациям до запуска в производство.'
    - 'Контроль качества в процессе: каждый этап производства имеет документированные контрольные точки QC. Прочность сварных швов, совмещение швов, установка клапанов и момент затяжки креплений проверяются по ходу производства.'
    - 'Испытание под давлением: каждая надувная камера подвергается испытанию под давлением, превышающим номинальное в 1,25 раза, в течение 24–48 часов. Для прохождения оценки уровень утечки должен быть равен нулю.'
    - 'Финальная инспекция: готовая продукция проверяется на точность размеров, качество отделки, комплектность аксессуаров и целостность упаковки перед отгрузкой.'
    - 'Прослеживаемость партий: каждый продукт имеет серийный номер, связанный с записями производственной партии, что обеспечивает полную прослеживаемость от сырья до готовой продукции.'
content_safety:
  tagline: Стандарты морской безопасности
  title: 'Безопасность прежде всего<br />— надёжность в эксплуатации'
  subtitle: 'Продукция Aquafarer спроектирована и испытана в соответствии с международными стандартами морской безопасности для коммерческого и рекреационного использования.'
  items:
    - title: 'ISO 6185'
      description: 'Надувные лодки соответствуют стандартам ISO 6185 по конструкции, остойчивости, плавучести и грузоподъёмности.'
      icon: tabler:sailboat
    - title: 'Стандарты ABYC'
      description: 'Электрические и топливные системы следуют стандартам ABYC (American Boat & Yacht Council) для безопасной установки и эксплуатации.'
      icon: tabler:bolt
    - title: 'Соответствие SOLAS'
      description: 'Средства безопасности и спасательное оборудование соответствуют требованиям SOLAS (Safety of Life at Sea) там, где это применимо.'
      icon: tabler:lifebuoy
cta:
  title: 'Нужна сертифицированная продукция для вашего проекта?'
  subtitle: 'Свяжитесь с нашей командой, чтобы обсудить требования к сертификации, документацию и соответствие для вашего рынка.'
  actions:
    - variant: primary
      text: Запросить документы о сертификации
      href: /contact
    - text: Посмотреть страницу качества
