content_challenge:
  tagline: Вызов
  title: Занятия водными видами спорта<br />требуют универсальных надувных лодок
  subtitle: Парусным школам, центрам водных видов спорта и организаторам мероприятий нужны лодки, которые могут выполнять несколько функций — обучение, буксировку, безопасность и транспортировку — часто переключаясь между функциями в течение нескольких часов.
  paragraphs:
    - "Водные виды спорта — одна из самых разнообразных морских отраслей: она охватывает обучение парусному спорту, моторизованные развлечения вроде вейкбординга и водных лыж, а также соревнования любого уровня. Каждая задача предъявляет свои требования к лодке, но многим операторам нужен один флот, способный выполнять несколько ролей в течение дня."
    - '**Парусные школы** нуждаются в тренировочных RIB, достаточно устойчивых, чтобы инструктор мог стоять и показывать приёмы, достаточно быстрых, чтобы оперативно приходить на помощь перевернувшимся яхтсменам, и достаточно прочных для регулярных выходов на берег. Лодка должна быть хорошо заметна, манёвренна в стеснённой марине и способна отбуксировать парусники к берегу при затихшем ветре.'
    - '**Центры водного спорта**, работающие с водными лыжами, вейкбордом и буксировкой тюбингов, нуждаются в специализированных буксировочных лодках со стабильной волной от кильватера, мощным разгоном с места и увеличенным запасом топлива для подряд идущих заездов. Устойчивость на малом ходу критична для подъёма райдеров и контроля безопасности.'
    - '**Организаторы мероприятий**, проводящие регаты, триатлоны и водные соревнования, требуют катеров сопровождения и безопасности, способных патрулировать границы трассы, следить за соблюдением правил, реагировать на чрезвычайные ситуации и перевозить судей — сохраняя профессиональный вид и надёжную работу на протяжении многодневных событий.'
    - Общее у всех трёх сегментов — потребность в универсальных, долговечных и профессионально укомплектованных RIB, способных работать в разных условиях с минимальным простоем. Paddle Board Overstock строит RIB для водного спорта, настроенные под каждую из этих задач.
content_solution:
  tagline: Наше решение
  title: Надувные лодки для водных видов спорта<br />Созданы для любой роли
  subtitle: Надувные лодки Paddle Board Overstock для водного спорта имеют модульную конфигурацию, которая позволяет одной лодочной платформе выполнять несколько функций в рамках вашей деятельности.
  list:
    - Устойчивая конструкция корпуса — инструкторы могут уверенно стоять и перемещаться, обучая прямо с лодки
    - Буксировочная колонна и точки крепления фала для водных лыж, вейкборда и тюбингов
    - Быстрый разгон за счёт правильного подбора мотора к корпусу для буксировки в водном спорте
    - Профессиональные схемы посадочных мест для комфорта инструктора, тренера или судьи во время длительных сессий на воде
    - Полная консоль с ветровым стеклом, навигационной электроникой, УКВ-радиостанцией и местом для спасательного снаряжения
    - Баллоны из морского Hypalon или ПВХ — стойкие к УФ и солёной воде для долгого срока службы
    - Противоскользящая палуба — безопасное передвижение экипажа, когда палуба мокрая от брызг или подъёма райдеров
    - Фирменная окраска и комплекты наклеек — в цветах вашей школы, центра или мероприятия
    - Точки подъёма под davit и усиление для выхода на берег при ежедневном спуске и подъёме
    - Экономичные четырёхтактные подвесные моторы для продолжительных ежедневных смен
content_segments:
  tagline: Профили водных видов спорта
  title: Решения RIB<br />По типу водного спорта
  subtitle: Различные виды водного спорта требуют разных конфигураций лодок — мы адаптируем каждую надувную лодку к конкретной роли, которую она будет выполнять.
  items:
    - title: Парусные школы и учебные центры
      subtitle: Тренерские РИБы для обучения управлению парусным спортом, защитного покрытия и буксировки парусной лодки.
      description: 'Школы парусного спорта работают в защищенных бухтах, озерах и прибрежных водах, проводя занятия для начинающих и опытных моряков круглый год. Тренер RIB служит мобильной обучающей платформой, судном прикрытия и буксиром. Инструкторам нужна устойчивая платформа, чтобы стоять и демонстрировать, быстрое реагирование, чтобы дотянуться до опрокинувшихся учеников, а также прочная конструкция для ежедневных приземлений на пляж и маневрирования в гавани. Надежность имеет первостепенное значение: сломанный автобус означает отмену уроков и разочарование учеников. Лодка также должна иметь профессиональный внешний вид, отражающий качество школы.'
      features:
        - Устойчивая платформа с низким бортом для общения инструктора и ученика на близком расстоянии
        - Противоскользящая палуба и поручни для безопасности инструктора стоя и в движении
        - Буксировочная колонна и крепление бриделя для возврата на берег парусников с неисправностями
        - Быстро выходящий на глиссирование корпус для оперативной помощи перевернувшимся или дрейфующим ученикам
        - Компактная длина (4,3–5,2 м) для удобной перевозки и межсезонного хранения
        - Варианты хорошо заметных цветов для лёгкого поиска по всей тренировочной акватории
        - Опции защиты винта для безопасности учеников при манёврах на малой дистанции
    - title: Центры водных видов спорта и буксиры
      subtitle: Буксирные РИБы для катания на водных лыжах, вейкборде и надувных трубках.
      description: Центры водных видов спорта, работающие на озерах, реках и прибрежных участках, ежедневно проводят большие объемы буксировок — катание на водных лыжах, вейкборде, книбординге и буксируемых трубках для туристов и местных жителей. Буксирующему катеру необходимы постоянные характеристики следа, сильное ускорение, чтобы быстро доставить гонщика в самолет, и стабильное управление на низкой скорости для подъема и восстановления после падения. Эти лодки работают на мелководье вблизи береговой линии, поэтому требуют усиленных корпусов и защиты гребного винта. Экономия топлива имеет значение при проведении сессий подряд по 8–10 часов в день. Лодка также служит платформой безопасности — на ней находятся водитель, корректировщик, а иногда и тренер — и одновременно она ищет платящих клиентов.
      features:
        - "Мощность мотора, подобранная под задачу: уверенный разгон с места и стабильная скорость буксировки"
        - Буксировочная колонна и точки крепления фала, расположенные под оптимальным углом тяги райдера
        - Ровная и предсказуемая волна для комфортного и безопасного катания
        - Устойчивость на малом ходу для безопасного подъёма райдеров после падений
        - Усиленный киль и корпус для частых выходов на берег и работы на мелководье
        - Тунель или защита винта для эксплуатации на мелководных участках
        - Увеличенный запас топлива на 6–8 часов непрерывной буксировки
        - Сиденья водителя и наблюдателя с постоянным обзором райдера
    - title: Организации мероприятий и соревнований
      subtitle: Надувные лодки маршала, безопасности и официального транспорта для морских мероприятий
      description: Организаторам регаты, директорам триатлонных гонок и координаторам соревнований по водным видам спорта нужны надежные, профессионально выглядящие надувные лодки для управления трассой, защитного покрытия и официального транспорта. Эти лодки патрулируют границы трассы, обеспечивают соблюдение правил гонок, оказывают первую медицинскую помощь, а также перевозят судей и сотрудников СМИ. Соревнования проводятся при любых погодных условиях — ветре, порывах ветра и течении — требуя стабильного управления и надежной работы. Внешний вид лодки имеет значение, поскольку он представляет бренд мероприятия перед участниками, зрителями и средствами массовой информации. Для многодневных мероприятий требуются лодки, которые могут работать изо дня в день с минимальными простоями на техническое обслуживание.
      features:
        - Устойчивый корпус для судей стоя и безопасной работы с камерами в любых условиях
        - Полный навигационный комплект — GPS-плоттер, УКВ-радиостанция и ходовые огни для работы ранним утром и поздним вечером
        - Место для аптечки первой помощи при экстренных вмешательствах
        - Профессиональное фирменное оформление и наклейки для заметности спонсоров мероприятия
        - Несколько конфигураций сидений для судей, прессы и медперсонала
        - Быстрый выход на глиссирование для оперативной смены позиции трассы и реагирования на ЧП
        - Консоль с защитой от непогоды и ветровым стеклом для комфорта при длительных вахтах на воде
        - Прочные баллоны, рассчитанные на контакты у пирса в переполненных маринах на мероприятиях
