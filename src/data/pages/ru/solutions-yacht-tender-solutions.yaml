content_challenge:
  tagline: Вызов
  title: Яхтенные тендеры требуют<br />характеристик и презентабельности
  subtitle: Яхтенный тендер — это не просто шлюпка, а продолжение материнского судна и заявление о качестве.
  paragraphs:
    - Владельцам и капитанам яхт нужны тендеры, которые хорошо работают, компактно хранятся и красиво презентуются. Тендер должен дополнять эстетику яхты, обеспечивая при этом надежную транспортировку гостей и экипажа.
    - '**Хранение имеет решающее значение** — Тендер должен помещаться на палубе, в гараже или на шлюпбалках. Вес имеет значение для систем запуска и восстановления. Aquafarer РИБы предлагают отличное соотношение мощности к весу и компактные профили для хранения.'
    - '**Ожидания к производительности высоки** — гости ожидают плавной и сухой езды при доставке на берег. Варианты двигателей должны балансировать между скоростью, дальностью полета и уровнем шума, чтобы обеспечить превосходные впечатления. Для чартерных перевозок тендер курсирует ежедневно и должен выдерживать частое использование.'
    - '**Внешний вид имеет значение** — Несоответствующий или изношенный тендер портит общий вид яхты. Нестандартные цвета трубок, обивка и брендинг гарантируют, что тендер будет выглядеть так, как будто он принадлежит ему.'
content_solution:
  tagline: Наше решение
  title: Тендерные конфигурации<br />Для любого применения яхты
  subtitle: Aquafarer RIB тендеры могут быть настроены в соответствии с вашим судном, типом операции и требованиями к хранению — от спецификаций производителя суперяхт до программ чартерного флота.
  list:
    - Цвета трубок по индивидуальному заказу, соответствующие материнскому судну или дополняющие его — любой цвет RAL доступен для трубок Hypalon или PVC.
    - Индивидуальная обивка и швы — винил морского класса премиум-класса с подобранным по цвету и вышивкой логотипа.
    - Консольное или румпельное рулевое управление — выбирайте в зависимости от характера использования и предпочтений оператора.
    - Корпус из стекловолокна deep-V для плавного и сухого хода в различных морских условиях.
    - Компактное хранилище — сдувается или складывается для хранения в палубном гараже, шкафчике или шлюпбалке.
    - Hypalon трубки для устойчивости к ультрафиолетовому излучению и длительного сохранения внешнего вида
    - Точки подъема и буксировочные кольца входят в стандартную комплектацию всех моделей.
    - Дополнительный чехол для носовой части, полный чехол и защитные приспособления для защиты от истирания.
    - 'Диапазон двигателя: от 15 HP до 60 HP — подвесная конфигурация или конфигурация с румпелем.'
    - OEM/частная маркировка доступна для производителей яхт и морских дилеров.
content_segments:
  tagline: Профили клиентов
  title: Решения для яхтенных тендеров<br />По типам клиентов
  subtitle: Различные сегменты яхтенной индустрии имеют уникальные требования. Aquafarer настраивает тендеры в соответствии с каждой заявкой.
  items:
    - title: Строители суперяхт
      subtitle: OEM тендерная интеграция — нестандартные размеры, цвета и материалы
      description: 'Строители яхт постоянно сталкиваются с проблемой: каждое новое судно имеет уникальные ограничения по размерам, весу и эстетическим ожиданиям. Тендер должен идеально интегрироваться с системой шлюпбалки базового судна, вписываться в точные размеры гаража и соответствовать языку дизайна яхты стоимостью в несколько миллионов евро. Любое несоответствие — неправильный цвет трубки, неправильное расположение точки подъема, несовместимый вес — задерживает доставку и плохо отражается на строителе. Aquafarer работает напрямую с группами закупок и проектировщиков застройщиков, предоставляя тендеры с индивидуальными цветами трубок RAL, соответствующей обивкой, фирменными панелями консоли и полным пакетом документации OEM.'
      features:
        - Пользовательские размеры, соответствующие ограничениям гаража и шлюпбалки
        - Любой цвет трубки RAL и соответствующая обивка — предоставляются образцы утверждения дизайна.
        - OEM брендинг на консоли, трубке и спинках сидений
        - Проверка точки подъема и соответствия шлюпбалки для каждой модели
        - Вес корпуса оптимизирован для определенных систем запуска и восстановления.
        - График оптовых поставок соответствует срокам производства.
    - title: Компании по управлению яхтами
      subtitle: Тендеры по стандартизации автопарка — глобальная поддержка, минимальное время простоя
      description: 'Управляющие компании контролируют несколько яхт, работающих в Средиземноморье, Карибском бассейне, южной части Тихого океана и за его пределами. Их основная потребность — надежность: сломанный тендер в отдаленном порту означает сверхурочную работу экипажа, жалобы гостей и дорогостоящую замену в последнюю минуту. Стандартизированные характеристики флота сокращают время обучения экипажей на всех судах и упрощают управление запасными частями. Aquafarer предлагает цены на флот из нескольких судов, согласованные спецификации для всех заказов и глобальную поддержку запасных частей для управляющих компаний с судами в разных регионах.'
      features:
        - Стандартизированные характеристики для всего управляемого парка
        - Взаимозаменяемые запасные части для всех тендеров флота
        - Цены на автопарк и оптовые скидки для заказов на несколько единиц
        - Доступность запасных частей по всему миру — быстрая доставка в любой порт
        - Последовательная документация по техническому обслуживанию и техническому обслуживанию для экипажа
        - Координация доставки нескольких единиц в различные места расположения судов
    - title: Операторы чартера яхт
      subtitle: Высокочастотные ежедневные операции — долговечность без ущерба для внешнего вида
      description: 'Чартерные тендеры сталкиваются с самым суровым графиком работы в яхтенной индустрии: ежедневные трансферы для гостей, поездки на берег, поддержка водных видов спорта и тендеры в портах — часто более 200 операций за чартерный сезон. Тендер должен выглядеть безупречно при передаче каждого гостя, выдерживая непрерывную посадку, воздействие соленой воды и часы работы двигателя. Ухудшение внешнего вида является прямой проблемой бизнеса: изношенный тендер влияет на отзывы гостей и стоимость чартера. Aquafarer оснащает чартерные тендеры улучшенной обивкой, сверхпрочными трубами Hypalon и усиленными погрузочно-разгрузочными зонами для обеспечения длительного срока службы и сохранения качества презентации.'
      features:
        - Сверхмощные трубки Hypalon — срок службы 5–8 лет при ежедневных чартерных перевозках.
        - Усиленные ступеньки и поручни для частого использования.
        - Премиальная грязеотталкивающая виниловая обивка — легкая чистка между рейсами.
        - Легко очищаемые нескользящие поверхности палубы
        - Надежные подвесные агрегаты с легким доступом для обслуживания для сокращения сроков ремонта
        - Косметические материалы, сохраняющие внешний вид в течение всего чартерного сезона.
    - title: Дилеры и брокеры яхт
      subtitle: Надежные тендерные поставки для достройки судна и его стоимости при перепродаже
      description: Дилерам и брокерам необходимы стабильные поставки качественных тендеров, которые дополнят продаваемые ими суда, соответствуя позиционированию бренда и улучшая качество обслуживания покупателей. Непоследовательный тендер или задержка поставки могут задержать передачу яхты или ухудшить представление о листинге. Для поддержания прибыльности дилерам требуется стабильное качество всех партий, надежные сроки выполнения заказов и конкурентоспособные цены. Aquafarer предлагает дилерские программы инвентаризации с сезонным графиком поставок, вариантами совместного брендинга для демонстрации в выставочном зале и приоритетным распределением в пик сезона.
      features:
        - Программы складского хранения с моделями, доступными по запросу.
        - Сезонный график поставок в соответствии с календарем передачи
        - Совместный брендинг дилеров на консоли и трубках для витрины в выставочном зале
        - Стабильное качество и технические характеристики для всех партийных заказов.
        - Конкурентоспособные дилерские цены с уровнем объема
