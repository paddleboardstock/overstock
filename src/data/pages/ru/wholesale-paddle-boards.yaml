faq_section:
  title: Часто задаваемые вопросы о оптовых закупках
  items:
    - q: Каков минимальный оптовый заказ?
      a: Пять досок. Наша модель для избыточных запасов создана для мелких розничных продавцов — вам не нужно заполнять контейнер, чтобы получить оптовую цену.
    - q: Могу ли я смешивать разные модели SUP в одном оптовом заказе?
      a: 'Да. Заказы на смешанные модели — одно из самых больших преимуществ покупки излишков на складе: комбинируйте любые модели, находящиеся в наличии, в одной поставке, и общее количество плат определяет ваш ценовой уровень. Подробнее см. на нашей странице оптовых продаж смешанных моделей.'
    - q: Платы совершенно новые?
      a: Да. Каждая плата совершенно новая, невостребованная избыточная продукция — никогда не бывшие в употреблении, не восстановленные и не возвращенные клиентами. Каждая плата на 100% проходит тестирование под давлением перед отправкой.
    - q: Насколько оптовая цена дешевле розничной?
      a: Оптовая цена за единицу указывается по заказу в зависимости от моделей и количества и существенно ниже указанных выше розничных цен. Запросите предложение для вашей целевой комплектации, и мы точно рассчитаем цену.
    - q: Какой способ доставки выбрать?
      a: Экспресс-авиа подходит для 1–3 плат, образцов и срочного пополнения запасов. Консолидированная морская доставка — экономичный вариант для заказов розничных торговцев на 5–20 плат. Мы предлагаем оба варианта при каждом запросе.
    - q: Какая гарантия на оптовые платы?
      a: Та же 2-летняя SUP гарантия, которую мы предоставляем каждому клиенту в каждой из 50+ стран, куда отправляем.
    - q: Вы отправляете в мою страну?
      a: В настоящее время мы отправляем в более чем 50 стран, с региональными руководствами для Латинской Америки, Юго-Восточной Азии, Африки, Ближнего Востока и ключевых рынков, включая Мексику, Бразилию, Филиппины, Индонезию, Таиланд, Южную Африку, Кению и ОАЭ. Уточните в запросе предложения, и мы подтвердим текущее обслуживание для вашего адреса.
