hero:
  tagline: Оптовые SUP борды
  title: Оптовые надувные доски<br />для малого бизнеса
  subtitle: Совершенно новые дополнительные SUP доски в массах, удобных для малого бизнеса. Закажите 5–20 досок, смешайте любые модели в одной партии и выберите экспресс-авиаперевозки или морские перевозки в 50+ стран.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Оптовые SUP надувные доски с Paddle Board Overstock готовых к отправке
direct_answer: Paddle Board Overstock поставляет новые надувные SUP доски в избыточный запас небольшим ритейлерам по всему миру. Крупного минимального заказа нет — оптовый заказ начинается всего с 5 досок, и вы можете смешивать любые имеющиеся в наличии модели в одном заказе. Доски отправляются с нашей базы в Вэйхае, Китай, экспресс-авиаперевозками (1–3 доски, образцы или срочное пополнение запасов) или консолидированными морскими грузами (5–20 заказов в розничных магазинах). Каждая плата проходит 100% проверку под давлением перед отправкой и покрывается нашей SUP двухлетней гарантией.
tldr_points:
  - 'MOQ Низкий: оптовые заказы начинаются с 5 досок — размера для небольших магазинов, а не для контейнеров'
  - 'Заказы на смешанные модели: объединяйте любые имеющиеся в SUP наличии модели в одной партии'
  - 'Два варианта доставки: экспресс-авиаперевозки для 1–3 бортов, морские грузы для 5–20 заказов на борт'
  - 'Совершенно новый товар: 100% проверен на давление, 99,3% финальный контроль, SUP 2-летняя гарантия'
why_retailers:
  title: Почему мелкие ритейлеры выбирают доски с избыточным запасом SUP
  subtitle: Вам не нужен склад или контейнерный бюджет, чтобы покупать по оптовым ценам.
  items:
    - title: Количества, удобные для малого бизнеса
      description: Традиционная оптовая торговля требует сотен единиц на один заказ. Наша модель избытка предназначена для независимых магазинов — начните с 5 досок и увеличивайте заказ по мере роста магазина.
    - title: Реальные оптовые цены без обязательств по объему
      description: Поскольку мы продаём избыточные запасы — излишки производства и аккуратно закупаемые с выбранных партнёрских заводов — вы получаете цены на единицу на уровне объёма без риска на уровне объёма.
    - title: Комбинируйте модели, чтобы соответствовать вашим клиентам
      description: Пляжные магазины, магазины на озёрах и городские магазины обслуживают разных гребцов. Сочетайте универсальные, туристические SUP и серфовые модели в одном заказе, чтобы ваша полка соответствовала местному спросу.
    - title: Совершенно новый, никогда не использовался
      description: Каждая доска в нашем избытке запасов совершенно новая и неиспользованная — не вторая и не возвратная. Каждая доска проходит 100% испытания под давлением перед выходом из склада.
    - title: Быстрая и гибкая международная доставка
      description: Экспресс-авиаперевозки быстро доставляют 1–3 доски или образцы заказов к вашему дому; Консолидированные морские перевозки позволяют снизить стоимость за борт при заказах на 5–20 заказов в розничных магазинах.
    - title: С настоящей гарантией
      description: Оптовая торговля не означает без поддержки. Каждая SUP плата имеет нашу SUP двухлетнюю гарантию — такую же страховку, как и каждому клиенту в 50+ странах.
pricing_section:
  tagline: Оптовые цены
  title: Простое и прозрачное оптовое ценообразование
  subtitle: Цены устанавливаются на каждый заказ в зависимости от выбранных моделей, количества и способа доставки. Никаких скрытых комиссий — это цена, которую вы получаете, — это цена, которую вы платите.
  points:
    - title: Уровни по количеству
      description: Цены на единицу снижаются по мере увеличения размера заказа. Заказ на 10 плат стоит лучше за одну плату, чем заказ на 5; заказ на 20 плат ещё лучше.
    - title: Смешанные модели засчитываются в общий счет
      description: Ваш уровень скидки зависит от общего количества плат в заказе — а не на модель. Смешивание 4 разных моделей × 3 плат каждая считается заказом из 12 плат.
    - title: Цитирование с вариантами доставки
      description: Каждая котировка включает как экспресс, так и морские варианты с предполагаемым временем доставки, чтобы вы могли выбрать баланс скорости и затрат, который соответствует вашему графику пополнения запасов.
    - title: Аккаунт и членство не требуются
      description: Нет оптового клуба для вступления и ежегодной платы нет. Запросите смету, подтвердите заказ, и мы отправим.
