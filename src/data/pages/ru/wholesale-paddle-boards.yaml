who_section:
  tagline: Кого мы снабжаем
  title: Создано для независимых компаний в сфере водных видов спорта
  items:
    - title: Пляжные и серф-магазины
      description: Небольшие прибрежные ритейлеры, которым нужно от 5 до 15 досок в сезон, смешанные между универсальными моделями для туристов и серф-досками для местных жителей.
    - title: Онлайн-продавцы
      description: Магазины электронной коммерции и продавцы на рынке тестируют SUP категорию, не привязываясь к полному контейнеру одной модели.
    - title: Арендные автопарки и школы
      description: Арендные операции и SUP школы, пополняющие автопарк — долговечные доски, смешанные модели для обслуживания клиентов разных размеров и гарантийный резерв.
    - title: Курорты и туроператоры
      description: Отели, островные курорты и туроператоры SUP пополняют свою программу небольшими первоначальными автопарками и лёгкой сезонной пополнением запасов.
how_to_order:
  tagline: Как это работает
  title: Как оформить оптовый заказ
  steps:
    - title: Просмотр инвентаря
      description: Ознакомьтесь с 11 наличными моделями выше или воспользуйтесь выбором смешанных моделей, чтобы подготовить комбинацию, подходящую вашим клиентам.
    - title: Запросите смету
      description: Пришлите нам модели, предполагаемые количества, вашу страну и желаемую скорость доставки, используя форму запроса ниже. Мы отвечаем с указанием цен за единицу и вариантами доставки.
    - title: Подтвердить и оплатить
      description: Утвердите окончательную смету — модели, количество, способ доставки и общую сумму. Условия оплаты подтверждены при выставлении сметы.
    - title: Мы тестируем, упаковываем и отправляем
      description: Каждая доска проходит 100% проверку на давление, комплектуется полным набором аксессуаров и отправляется из Вэйхая. Вы получаете отслеживание на весь путь.
