hero_text:
  tagline: Контакты
  title: СВЯЖИТЕСЬ С НАМИ
contact_form:
  id: form
  title: Отправьте нам сообщение
  subtitle: По вопросам заказа, советам по размеру или поддержке продукта напишите нам. Мы отвечаем в течение одного рабочего дня.
  email_to: info@paddleboardoverstock.com
  submit_button: Отправить запрос → Получить предложение
  success_message: Спасибо! Ваше сообщение получено. Мы ответим в течение одного рабочего дня.
  error_message: При отправке сообщения произошла ошибка. Пожалуйста, попробуйте снова или напишите нам напрямую по электронной почте.
  default_country_code: '+1'
  captcha:
    label: 'Анти-спам: пожалуйста, решите следующее'
  fields:
    - name: Имя
      label: Имя
      row: 1
    - name: Фамилия
      label: Фамилия
      row: 1
    - name: Название компании
      label: Название компании
      row: 2
    - name: address
      label: Адрес
      row: 3
    - name: zip
      label: Индекс / Почтовый код
      row: 4
    - name: country
      label: Страна
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Электронная почта
      row: 5
      type: email
    - name: tel
      label: Телефон
      row: 5
      type: tel
      withCountryCode: true
    - name: Объем заказа
      label: Ожидаемый объем заказа
      row: 6
      type: select
      options:
        - value: ''
          label: Сколько досок вы планируете приобрести?...
        - value: one
          label: Только одну доску
        - value: 2-4
          label: 2–4 доски
        - value: 5-plus
          label: 5+ досок (для семьи, клуба или проката)
    - name: customization
      label: С чем мы можем помочь?
      row: 7
      type: select
      options:
        - value: ''
          label: Выберите тему...
        - value: none
          label: Общий вопрос о продукте
        - value: sizing
          label: Помощь в выборе подходящей доски
        - value: order
          label: Заказ, оплата или доставка
        - value: warranty
          label: Гарантия или поддержка по ремонту
    - name: продуктИнтерес
      label: Интересующие категории продуктов
      row: 8
      type: select
      options:
        - value: ''
          label: Выберите категорию продукта...
        - value: all
          label: Все продукты / Полный каталог
        - value: sup
          label: SUP Доски / Сапборды
        - value: packages
          label: Полные комплекты SUP
        - value: accessory
          label: Аксессуары (насосы, весла, сумки)
    - name: subject
      label: Тема
      row: 9
    - name: message
      label: Сообщение
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Другие способы связи с нами
  columns: 3
  items:
    - title: Помощь с заказом
      description: Вопросы о продуктах, советы по размеру и поддержка по заказам.
      icon: tabler:shopping-bag
    - title: Техническая поддержка
      description: Гарантия, ремонт, запасные части и вопросы эксплуатации.
      icon: tabler:tool
    - title: Пресса и партнерство
      description: Медиакиты, спонсорство и сотрудничество в отрасли.
      icon: tabler:news
    - title: Телефон
      description: +1 279 732 3333 (штаб-квартира в США) · +86 13305324192 (фабрика)
      icon: tabler:headset
    - title: Электронная почта
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Глобальная штаб-квартира и бухгалтерия
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Наше местоположение
  subtitle: Посетите наш производственный центр в Вэйхай
  address: Вэйхай, Шаньдун, Китай
  zoom: 15
