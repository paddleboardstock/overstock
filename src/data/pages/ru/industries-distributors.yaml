content_segments:
  tagline: Профили партнеров
  title: Модели дистрибьюторского партнерства<br />По типу партнера
  subtitle: Разные дистрибьюторы обладают разными преимуществами при выходе на рынок — региональной инфраструктурой, охватом электронной коммерции, специализированной розничной торговлей или мультибрендовым портфелем. Мы структурируем условия партнерства, уровни цен и уровни поддержки в соответствии с профилем каждого партнера.
  items:
    - title: Региональные морские дистрибьюторы
      subtitle: Эксклюзивное распространение B2B на территории
      description: Установленные дистрибьюторы со складской инфраструктурой, дилерской сетью и логистическими возможностями, обслуживающие морских дилеров, розничных торговцев водными видами спорта и операторов проката на определенной географической территории. Вам нужна полная линейка продуктов, защищенные цены и возможность обслуживать счета дилеров, используя местные склады и поддержку.
      features:
        - Эксклюзивная защита территории при минимальных обязательствах
        - Оптовые цены на весь каталог с квартальными ретро-бонусами за объём
        - Программа консигнации локального склада для ходовых SKU
        - Обучение дилерской сети и программы совместного маркетинга
    - title: Электронная коммерция и интернет-магазины
      subtitle: Цифровые каналы сбыта
      description: Интернет-магазины, продающие снаряжение для водных видов спорта через Amazon, eBay или собственные платформы электронной коммерции. Скорость выхода на рынок, конкурентоспособные цены и логистика, ориентированная непосредственно на потребителя, имеют решающее значение. Вам нужен партнер, который сможет доставлять индивидуальные заказы под вашим брендом с быстрым выполнением и нулевым риском запасов.
      features:
        - 'Дропшиппинг: отправка напрямую с завода под вашим брендом'
        - Лента остатков в реальном времени по API для вашей e-commerce платформы
        - Интеграция с Amazon Seller Central с поддержкой EAN/UPC
        - Обратная логистика и обработка гарантийных претензий включены
    - title: Специализированные розничные торговцы водными видами спорта
      subtitle: Партнеры по физическим выставочным залам
      description: Физические розничные магазины, специализирующиеся на снаряжении для водных видов спорта, обслуживающие местных гребцов, рыболовов и яхтсменов с личными продажами, демонстрациями и послепродажным обслуживанием. Вам нужна упаковка, оптимизированная для розничной торговли, демонстрационные программы и материалы для точек продаж, которые привлекут постоянных клиентов.
      features:
        - 'Демо-программа: демонстрационные борды для шоурума со скидкой'
        - Розничная упаковка с дизайном коробок, оптимизированным под полки
        - POS-материалы, сравнительные таблицы и руководства для покупателей
        - Обучение и сертификация персонала в магазинах
    - title: Дистрибьюторы мультибрендовых и универмагов
      subtitle: Широкая дистрибуция спортивных товаров
      description: Крупные дистрибьюторы, обслуживающие универмаги, крупные магазины розничной торговли и сети спортивных товаров с мультибрендовыми каталогами. Согласованность, соответствие документации и соответствие требованиям поставщиков имеют первостепенное значение — каждый SKU должен соответствовать стандартам упаковки, маркировки и качества, специфичным для розничного продавца.
      features:
        - 'Комплаенс-документация для ритейлеров: спецификация упаковки, штрихкоды, маркировка'
        - Интеграция EDI/ASN с системами заказов крупных ритейлеров
        - Управление запасами вендором и программы автоматического пополнения
        - Персональный менеджер с SLA ответа в течение 24 часов
