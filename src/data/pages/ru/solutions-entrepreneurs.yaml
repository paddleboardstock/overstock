hero:
  tagline: Предприниматели водных брендов
  title: Запустите свой собственный бренд водных видов спорта<br />с OEM/ODM Aquafarer
  subtitle: Производство частных торговых марок «под ключ» для продавцов Amazon, влиятельных лиц на открытом воздухе, региональных дистрибьюторов и начинающих владельцев брендов — от дизайна продукта до вашей первой поставки.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Фабрика Aquafarer — производство частных торговых марок для брендов водного спорта.
direct_answer: 'Aquafarer позволяет легко запустить собственный бренд водных видов спорта. Наша программа создания частных торговых марок охватывает все: от выбора продукции и индивидуального проектирования пресс-форм до печати логотипов, упаковки и прямой доставки вашим клиентам. Благодаря минимальному заказу 2–5 единиц на артикул для RIB и 5–10 для SUP и времени выполнения заказа 30–45 дней начинающие предприниматели обычно проходят путь от идеи до первой поставки за 60–90 дней. Выбирайте из нашего каталога более 50 проверенных конструкций надувных SUP, каяков, RIB и аксессуаров или разработайте полностью индивидуальный продукт с нашей собственной командой инженеров.'
solution_offerings:
  - title: Стартовый запуск бренда
    subtitle: Для начинающих предпринимателей, тестирующих рынок
    badge: Popular
    features:
      - title: Выбор продукта
        description: Выбирайте из более чем 50 проверенных моделей надувных плавсредств по ценам напрямую с завода
      - title: Пользовательский брендинг
        description: Печать логотипа на досках, подбор цвета по индивидуальному заказу, фирменная упаковка
      - title: Низкий минимальный заказ
        description: Начните с 2–5 единиц на SKU для RIB (5–10 для SUP) — протестируйте рынок, прежде чем масштабировать его.
      - title: Соответствие готово
        description: 64 модели сертифицированы CE — уверенно продавайте по всему миру.
      - title: Логистическая поддержка
        description: Доставка на условиях FOB Циндао или CIF в порт назначения.
    cta_text: Запустить мой бренд
    cta_href: /contact
  - title: Запуск премиум-бренда
    subtitle: Для серьезных брендов, которым требуется индивидуальный дизайн и упаковка.
    badge: Premium
    features:
      - title: Индивидуальный дизайн продукта
        description: Индивидуальная разработка пресс-форм, оптимизация формы и настройка производительности
      - title: Полный дизайн упаковки
        description: Готовая к розничной торговле упаковка, бирки, инструкции по эксплуатации и опыт распаковки.
      - title: Цифровые активы
        description: Профессиональная фотография продуктов, изображения образа жизни и видеоконтент
      - title: Гарантия качества
        description: Сторонняя проверка, отчеты о заводском аудите и производственные образцы
      - title: Масштабируемое производство
        description: От первоначальных 200 единиц до 10 000+ с постоянным качеством и ценой.
    cta_text: Создать мой бренд
    cta_href: /contact
