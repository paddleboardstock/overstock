testimonial:
  content: Я запустил свой бренд SUP, не имея опыта работы в отрасли. Команда Aquafarer помогла мне от выбора продукта до индивидуального дизайна логотипа и упаковки. Мой первый контейнер прибыл через 11 недель, а на Amazon я его распродал за 3 месяца. Сейчас заказываю третий контейнер.
  name: Майкл Парк
  title: Основатель компании Shoreline Paddle Co. — Калифорния, США.
content_segments:
  tagline: Профили предпринимателей
  title: Запуск бренда водных видов спорта<br />По типу предпринимателя
  subtitle: Разные основатели обладают разными сильными сторонами — опытом в области электронной коммерции, отраслевыми связями, охватом контента или инфраструктурой распространения. Мы адаптируем программу запуска OEM/ODM в соответствии с вашей стартовой позицией и амбициями роста.
  items:
    - title: Amazon FBA и продавцы электронной коммерции
      subtitle: Управляемые данными, быстромасштабируемые создатели брендов
      description: Опытные интернет-продавцы, запускающие товары для водных видов спорта на Amazon, Walmart или в собственных магазинах Shopify. Вы знаете, как оптимизировать списки, управлять оплатой за клик и читать данные о категориях, но вам нужен партнер-производитель, который понимает скорость электронной коммерции, уровень возврата и сезонные колебания спроса.
      features:
        - Упаковка, готовая к розничной продаже, с учётом габаритных ограничений FBA
        - Генерация штрихкодов EAN/UPC и документация, соответствующая требованиям Amazon
        - Низкий MOQ (2–5 единиц на SKU для RIB, 5–10 для SUP) для проверки спроса перед масштабированием
        - Консолидация смешанных контейнеров для снижения стоимости единицы с учётом доставки
    - title: Влиятельные люди в области фитнеса и активного отдыха
      subtitle: Создатели бренда, ориентированные на аудиторию
      description: Создатели контента, тренеры по фитнесу и деятели активного отдыха с заинтересованной аудиторией, готовые купить бренд образа жизни. Вы приносите сообщество и историю бренда — мы занимаемся разработкой продукта, соблюдением требований, упаковкой и логистикой, чтобы вы могли сосредоточиться на контенте и конверсии.
      features:
        - 'Быстрый кастомный брендинг: 2-недельный цикл образцов с логотипом + цветами'
        - Лимитированные совместные издания и сезонные цветовые дропы
        - Поддержка производства лайфстайл-фотографии и видеоконтента
        - 'Прямые продажи потребителю: дропшиппинг с завода → покупателю'
    - title: Региональные дистрибьюторы идут напрямую к потребителю
      subtitle: B2B-операторы запускают собственный бренд
      description: Признанные дистрибьюторы морского или уличного оборудования, которые хотят запустить собственный бренд наряду с перепродажей сторонних продуктов или вместо них. У вас уже есть складская инфраструктура, логистические отношения и клиентская база — вам нужен завод-партнер, который сможет обеспечить качество под собственной торговой маркой в масштабе.
      features:
        - Эксклюзивные дизайн-решения для вашего рыночного региона
        - Полная разработка OEM-пресс-форм для собственных форм и спецификаций
        - Локализованная документация о соответствии (CE, UKCA, USCG) для вашего региона
        - 'Ко-брендинговая упаковка: бренд дистрибьютора + знак качества Aquafarer'
    - title: Основатели брендов-новичков
      subtitle: Комплексное создание бренда под руководством руководства
      description: Увлеченные предприниматели с нулевым опытом работы в сфере водных видов спорта, которые хотят построить бренд с нуля. Вам нужен партнер, который будет держать вас за руку на каждом этапе — от выбора продукта и его наименования до дизайна упаковки и логистики первого контейнера — с четкими сроками и прозрачным ценообразованием.
      features:
        - Консультативный подбор продукции из более чем 50 проверенных базовых дизайнов
        - 'Пакет фирменного стиля: нейминг, логотип, цветовая палитра, дизайн упаковки'
        - Сроки 60–90 дней от концепции до первой отгрузки
        - Персональный менеджер проекта для начинающих владельцев брендов
