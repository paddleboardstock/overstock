hero:
  tagline: Юго-Восточная Азия
  title: Оптовые SUP борды для<br />Бизнесы Юго-Восточной Азии
  subtitle: Островные курорты, пляжные клубы и гребные магазины от Филиппин до Бали и Пхукета — совершенно новые доски с избытком из 5 единиц, смешанные модели, привезённые из Китая.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Дополнительные SUP доски для курортов и гребных лавок Юго-Восточной Азии
direct_answer: Paddle Board Overstock поставляет новые надувные SUP доски в избыточный запас для предприятий по всей Юго-Восточной Азии — островным курортам, пляжным клубам, операторам аренды и малым ритейлерам на Филиппинах, в Индонезии, Таиланде, Вьетнаме, Малайзии и других странах. Оптовая продажа начинается с 5 досок, смешанных моделей в одном заказе, доставляемых из Вэйхая, Китай, экспресс-авиасообщением или объединённым морским транспортом. Каждая плата проходит 100% испытания под давлением и покрывается двухлетней SUP гарантией.
tldr_points:
  - Смешанная модель оптовой продукции из 5 досок — построена для курортов и небольших магазинов, а не для контейнеров
  - Короткие грузовые маршруты из Китая в порты и аэропорты Юго-Восточной Азии
  - Долговечные, высокие UV доски, подходящие для тропического круглогодичного использования
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: Рынок Юго-Восточной Азии SUP
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: Ретельного стола мероприятий, оператора пляжного клуба и Island Paddle School.
    - Розничная торговля региона доминирует владельцами бизнесов, обслуживающих как туристов, так и быстрорастущее местное сообщество гребцов. Они заказывают небольшими партиями — от 5 до 20 досок, и им нужны доски, которые выдерживают циклы UV аренды в тропиках, солёной воде и ежедневной аренде, а не прототипы выставок.
  customer_types:
    - title: Островные курорты и пляжные клубы
      description: Программы курортной активности SUP пополняют ассортимент, заказывая смешанные автопарки, обслуживающие как новичков, так и постоянных гостей.
    - title: Аренда и туроператоры
      description: Операторы проводят почасовую аренду и экскурсии по мангровым и лагунам, заменяя изношенные доски парка сезонно.
    - title: Местные гребные магазины
      description: Небольшие магазины, обслуживающие растущее сообщество региона SUP — от любителей гребцов по выходным до SUP занятий йогой.
shipping_section:
  title: Корабль в Юго-Восточную Азию
  paragraphs:
    - Юго-Восточная Азия — один из ближайших грузовых регионов от Вэйхая, Китай — короткие морские маршруты и прямые экспресс-авиалинии обеспечивают как время транзита, так и стоимость перевозок. Экспресс-авиаперевозки подходят образцами и 1–3 борта для срочных заказов; консолидированные морские перевозки — экономичный выбор для оптовых заказов на 5–20 бортов в крупные региональные порты.
    - Мы предоставляем коммерческие счета и список упаковки, необходимые вашему брокеру, с правильными HS-кодами и заявленными значениями. Импортные пошлины и налоги соответствуют правилам вашей страны и оплачиваются импортером.
  customs_note: Таможенные процедуры различаются в разных странах АСЕАН. Проверьте правила импорта надувного спортивного снаряжения вашей страны и уточните, нужны ли вам конкретные документы — мы их готовим.
faq_section:
  title: Часто задаваемые вопросы по Юго-Восточной Азии
  items:
    - q: В какие страны Юго-Восточной Азии вы отправляете?
      a: Филиппины, Индонезия, Таиланд, Вьетнам, Малайзия и другие страны — а также специальные путеводители по странам для Филиппин, Индонезии и Таиланда. Подтвердите свой точный пункт назначения в запросе на расчёт.
    - q: Подходят ли доски для тропического круглогодичного использования?
      a: Да. Доски изготовлены по drop-stitch PVC конструкции, рассчитанной на ежедневное использование в тёплых, высоких UV условиях — те же доски, которые мы поставляем в арендные автопарки в 50+ странах. Стандартный уход (полоскание после солёной воды, хранение в тени) поддерживает их в эксплуатации годами.
    - q: Как выглядит заказ в небольшом курорте?
      a: 'Обычно 5–15 досок: базовый набор универсальных моделей, удобных для начинающих и гостей, плюс несколько премиальных художественных изданий для демонстрации, фотографий и розничной продажи. Смешанные модели в одной поставке, цена зависит от общего количества.'
    - q: Как быстро доски могут достичь этого региона?
      a: Юго-Восточная Азия является одним из самых коротких маршрутов для грузоперевозок от нашей базы в Вэйхае. Экспресс-авиа — самый быстрый вариант для образцов и мелких заказов; морские перевозки оцениваются по пунктам назначения для оптовых партий. Оба варианта указаны в вашем предложении.
