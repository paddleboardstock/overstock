hero:
  tagline: Бизнес-пакеты
  title: Готовые к развертыванию водного бизнеса<br />пакеты для каждого этапа
  subtitle: Предварительно настроенные пакеты оборудования для клубов водных видов спорта, курортов и брендовых стартапов — с прозрачными ценами, быстрой доставкой и полными возможностями индивидуальной настройки.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
