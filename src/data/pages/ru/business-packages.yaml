faq:
  title: Часто задаваемые вопросы по пакету
  questions:
    - q: Каков минимальный объем заказа упаковок?
      a: Клубный стартовый пакет включает минимум 10 единиц. Пакеты Resort и Brand настраиваются в соответствии с вашими потребностями с помощью гибких MOQ.
    - q: Сколько времени занимает доставка?
      a: Стандартное производство составляет 30–45 дней с момента подтверждения заказа. Ускоренное изготовление возможно за дополнительную плату.
    - q: Могу ли я настроить цвета и брендинг оборудования?
      a: Да. Все пакеты включают полную персонализацию — цвета картона, печать логотипов и дизайн упаковки.
    - q: Предоставляете ли вы послепродажную поддержку?
      a: Да. Каждый пакет включает доступ к нашим онлайн-руководствам по техническому обслуживанию, видеоурокам и системе заказа запасных частей.
