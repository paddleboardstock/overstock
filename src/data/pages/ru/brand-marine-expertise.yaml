hero:
  tagline: Морская экспертиза
  title: Десятилетия морской инженерии<br />на каждой доске
  subtitle: Paddle Board Overstock объединяет углубленные знания материаловедения, точное производство и реальные испытания, чтобы создавать доски, которые работают тогда, когда это важно.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock команда морского инженерного дела и НИОКР за работой
expertise_materials:
  tagline: Материаловедение
  title: Выбор правильного материала<br />для каждого приложения
  subtitle: Мы работаем с тремя основными материалами — каждый выбирается для конкретных случаев использования и требований к производительности.
  columns: 3
  items:
    - title: Морской класс PVC
      description: Ткань 1100 денier PVC — наш самый универсальный материал. UV-стабилизированная, устойчивая к истиранию и проверенная временем. Идеально подходит для досок SUP, где важны вес, жесткость и экономичность.
      icon: tabler:droplet
    - title: Ядро Drop-Stitch
      description: Тысячи полиэстеровых нитей соединяют верхний и нижний слои ткани, позволяя высокое давление надува (15 PSI) для жесткой, стабильной езды, которая при этом сворачивается в рюкзак.
      icon: tabler:building-arch
    - title: EVA Пена для палубы
      description: Рифленая высокоплотная пена EVA обеспечивает захват по всей длине, амортизацию при падениях и является основой для наших колод серии с фирменным искусством.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Производственные возможности
  title: Точное производство<br />на каждом шагу
  subtitle: Наше предприятие площадью 12 000 м² оснащено специализированным оборудованием для каждого этапа производства.
  columns: 2
  items:
    - title: CNC Резка
      description: Компьютерное управление резкой обеспечивает точные и повторяемые тканевые панели с минимальными отходами. Каждая деталь подходит точно так, как задумано.
      icon: tabler:cpu
    - title: Высокочастотная сварка
      description: Промышленная HF-сварка создает швы, прочнее основного материала. Постоянный контроль температуры и давления обеспечивает герметичность на каждом этапе производства.
      icon: tabler:bolt
    - title: Сборка сердцевины с пропущенными стежками
      description: Тысячи полиэстеровых нитей соединяют верхние и нижние слои ткани, позволяя высоконапорное надувание (15-20 PSI) для жестких, стабильных досок и полов SUP.
      icon: tabler:building-arch
    - title: Испытание давлением
      description: Каждая доска проходит испытание давлением перед отправкой, выдерживая давление в 1,25 раза больше номинального — если она выдерживает его, она будет хорошо себя вести на воде.
      icon: tabler:wind
    - title: Испытание прочности шва
      description: Случайные образцы из каждой производственной партии подвергаются разрушительному испытанию прочности шва. Результаты фиксируются и могут быть прослежены до конкретных производственных выпусков.
      icon: tabler:files
    - title: Тестирование воды
      description: Каждый дизайн доски проходит испытания в реальной воде. Реальное катание в прибрежных условиях подтверждает характеристики, управляемость и устойчивость.
      icon: tabler:ripple
expertise_design:
  tagline: Дизайн и инженерия
  title: Создано для реальных условий
  subtitle: Наша философия проектирования начинается с того, как будет использоваться доска, а затем инженерная разработка строится вокруг этого сценария использования.
  items:
    - title: Форма и контур доски
      description: Длина, ширина и рокер настроены для каждого конкретного использования модели — более длинные контуры для туринга ради скольжения, более широкие для стабильности и занятий йогой.
    - title: Укрепление кантов и стрингеров
      description: Укрепленные канты и центральные стрингеры добавляют жесткость и поглощают удары — в тех местах, где доски испытывают наибольшую нагрузку из сезона в сезон.
    - title: Планировка палубы и сцепление
      description: Зона стойки, расположение ручек, крепления D-образных колец и зоны сцепления разработаны с учетом реальных положений при гребле — будь то прогулка, рыбалка или занятия йогой.
    - title: Искусство и цветовые серии
      description: Рисунки на палубе, цветовые схемы и крепления для аксессуаров — каждая серия разработана, чтобы отражать определенную «личность» гребца.
