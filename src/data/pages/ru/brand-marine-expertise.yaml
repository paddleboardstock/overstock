hero:
  tagline: Морская экспертиза
  title: 'Десятилетия морской инженерии<br />в каждом корпусе'
  subtitle: 'Paddle Board Overstock объединяет глубокое материаловедение, точное производство и испытания в реальных условиях, создавая суда, которые работают, когда это важно.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Команда морской инженерии и НИОКР Paddle Board Overstock за работой
expertise_materials:
  tagline: Материаловедение
  title: 'Правильный материал<br />для каждой задачи'
  subtitle: 'Мы работаем с тремя основными материалами — каждый выбран под конкретные сценарии использования и требования к характеристикам.'
  columns: 3
  items:
    - title: Морской ПВХ
      description: 'Ткань ПВХ плотностью 1100 денье — наш самый универсальный материал. Стабилизирован к УФ, устойчив к истиранию, соответствует REACH. Идеален для прогулочных лодок, SUP-досок и каяков, где важны вес и экономичность.'
      icon: tabler:droplet
    - title: Премиум Hypalon/CSM
      description: 'Превосходная химическая стойкость и УФ-стабильность. Лодки из гипалона служат 15-20 лет при правильном уходе. Рекомендуется для коммерческого, спасательного и военного применения, где критична долговечность.'
      icon: tabler:shield
    - title: Стеклопластик и алюминий
      description: 'Стеклопластиковые корпуса с глубоким V-профилем для RIB и патрульных катеров — рассекающее волны поведение в сложных условиях. Алюминиевые корпуса для тяжелых коммерческих рабочих лодок с максимальной прочностью и грузоподъемностью.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Производственные возможности
  title: 'Точное производство<br />на каждом этапе'
  subtitle: 'Наше производство площадью 12 000 м² оснащено специализированным оборудованием для каждого этапа.'
  columns: 2
  items:
    - title: Раскрой с ЧПУ
      description: 'Компьютерный раскрой обеспечивает точные повторяемые полотна ткани с минимальными отходами. Каждая деталь точно соответствует проекту.'
      icon: tabler:cpu
    - title: Высокочастотная сварка
      description: 'Промышленная ВЧ-сварка создает швы прочнее основного материала. Стабильный контроль температуры и давления гарантирует герметичность в каждой партии.'
      icon: tabler:bolt
    - title: Сборка drop-stitch-основы
      description: 'Тысячи полиэстеровых нитей соединяют верхний и нижний слои ткани, позволяя накачку до высокого давления (15-20 PSI) для жестких и стабильных SUP-досок и палубов.'
      icon: tabler:building-arch
    - title: Испытание давлением
      description: 'Каждое надувное изделие проходит испытание давлением перед отгрузкой. Баллоны RIB тестируются при 1,25x рабочего давления — если выдержали, будут работать на воде.'
      icon: tabler:wind
    - title: Испытание прочности швов
      description: 'Случайные образцы из каждой партии проходят разрушающие испытания прочности швов. Результаты протоколируются и отслеживаются до конкретных производственных серий.'
      icon: tabler:files
    - title: Испытания на воде
      description: 'Каждая модель RIB проходит ходовые испытания перед сертификацией. Проверка в реальных прибрежных условиях подтверждает характеристики, управляемость и остойчивость.'
      icon: tabler:ripple
expertise_design:
  tagline: Дизайн и инженерия
  title: 'Разработано для реальных условий'
  subtitle: 'Наша инженерная философия начинается с того, как будет использоваться лодка — и строится вокруг этого сценария.'
  items:
    - title: Корпус с глубоким V
      description: "Наши стеклопластиковые корпуса имеют рассчитанные углы килеватости, оптимизированные под длину и назначение каждой модели. Более острое V — для хода по волне, более пологое — для остойчивости."
    - title: Многокамерная безопасность
      description: 'Каждая лодка имеет 3-7 независимых воздушных камер. При повреждении одного отсека остальные сохраняют плавучесть и работоспособность.'
    - title: Эргономичная компоновка
      description: 'Расположение консоли, высота баллона и посадка сидений спроектированы для комфорта оператора при длительной работе — на патрулировании, рыбалке или перевозке.'
    - title: Индивидуальная конфигурация
      description: 'Цвета баллонов, конфигурация консоли, запас топлива, крепления аксессуаров — каждую модель можно настроить под конкретные эксплуатационные требования.'
cta:
  title: 'Есть конкретная задача?'
  subtitle: 'Наша инженерная команда проконсультирует по выбору материалов, конструкции и производству вашего проекта.'
  actions:
    - variant: primary
      text: Спросите наших инженеров
      href: /contact
    - text: Посмотреть ассортимент
      href: /products
