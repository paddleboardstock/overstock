hero:
  tagline: Лаборатория контроля качества
  title: Испытательная лаборатория и обеспечение качества
  subtitle: Независимая лаборатория качества с процессами ISO 9001 — каждая единица продукции проходит испытания перед отгрузкой

intro: Aquafarer располагает собственной лабораторией контроля качества, работающей независимо от производства. Каждая партия сырья и каждое готовое судно проходит документированные протоколы инспекции перед выпуском. Наша команда QC отчитывается напрямую перед руководством, что обеспечивает беспристрастные решения по качеству.

highlights:
  - value: 100%
    label: Единиц продукции испытано под давлением
    detail: Каждая камера, каждое судно
  - value: 48 h
    label: Длительность теста на удержание воздуха
    detail: При 1,25× номинального давления
  - value: '&lt;5%'
    label: Максимально допустимое падение давления
    detail: За 24-часовой период выдержки
  - value: AQL 2.5
    label: Порог существенных дефектов
    detail: По выборочному контролю ISO 2859

test_procedures:
  - title: Входной контроль материалов
    description: Каждая входящая партия ПВХ, Hypalon, ткани drop-stitch и фурнитуры проходит испытания до приемки. Проверяются прочность на растяжение (ASTM D751), стойкость к разрыву (ISO 4674) и УФ-стойкость. Несоответствующие материалы изолируются и возвращаются.
    standards:
      - ASTM D751 (растяжение)
      - ISO 4674 (разрыв)
      - ISO 4892 (UV)
  - title: Контрольные точки QC в процессе производства
    description: Операторы производства выполняют самоконтроль на каждом этапе. Аудиторы QC проводят случайную выборку в течение смены. Испытания сварных швов на отслаивание выполняются каждые 50 единиц. Проверка размеров проводится на каждой 20-й панели.
    standards:
      - ASTM D751 (отслаивание)
      - Внутренний 100-балльный чек-лист
      - Выборочный контроль ISO 2859
  - title: 48-часовой тест на удержание воздуха
    description: Каждая камера баллона накачивается до 125% номинального давления и выдерживается 48 часов. Датчики давления ведут непрерывную запись с температурной компенсацией. Любая камера с падением давления более 5% запускает автоматическую повторную инспекцию партии.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Испытания на нагрузку и балансировку
    description: Готовые суда испытываются при максимальной номинальной нагрузке на устойчивость, надводный борт и управляемость. Каждое судно проходит ходовые испытания на воде перед утверждением при окончательной инспекции.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Универсальная испытательная машина (растяжение)
    spec: 5 кН, соответствие ASTM D751
  - name: Тестер падения давления
    spec: Многоканальный, 0–50 psi, регистрация данных
  - name: Камера УФ-старения
    spec: ISO 4892, циклы 1,000 ч
  - name: Толщиномер (цифровой)
    spec: Разрешение 0,01 мм
  - name: Тестер отслаивания (сварной шов)
    spec: С электроприводом, усилие 50 Н
  - name: Термокамера
    spec: от -40 °C до +100 °C
  - name: Резервуар для обнаружения утечек
    spec: 6 м × 2 м, с подсветкой
