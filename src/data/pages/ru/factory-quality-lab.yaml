hero:
  tagline: Лаборатория контроля качества
  title: Лаборатория тестирования и обеспечение качества
  subtitle: Независимая лаборатория качества — каждая единица протестирована перед отправкой
  back_label: Назад на фабрику
intro: Paddle Board Overstock Управляет специализированной лабораторией контроля качества, которая работает независимо от производства. Каждая партия сырья и каждая готовая плата проходят задокументированные протоколы инспекции перед выпуском. Наша команда контроля качества напрямую подчиняется руководству, обеспечивая беспристрастные решения по качеству.
highlights:
  - value: 100%
    label: Агрегаты испытаны под давлением
    detail: Каждая палата, каждая доска
  - value: 48 h
    label: Длительность испытаний на удержание воздуха
    detail: При номинальном давлении 1,25×
  - value: <5%
    label: Максимальное допустимое падение давления
    detail: Период ожидания более 24 часов
  - value: 99.3%
    label: Коэффициент отсутствия дефектов
    detail: Последующие 12-месячные поставки
test_procedures:
  - title: Инспекция сырья
    description: Каждая поступающая партия PVC drop-stitch ткани, EVA пены и фурнитуры тестируется перед принятием. Проверяются прочность на растяжение, устойчивость к разрыву и UV устойчивость. Несоответствующие материалы изолируются в карантин и возвращаются.
    standards:
      - Прочность на растяжение (350 Н/см мин)
      - Устойчивость к разрыву
      - UV Сопротивление (1 000 ч)
  - title: Контрольные пункты контроля качества в процессе
    description: Производственные операторы проводят самоосмотр на каждом этапе. Аудиторы контроля качества проводят случайный отбор проб на протяжении всей смены. Тесты на отслоение сварки проводятся каждые 50 единиц. Проверки размеров проводятся на каждой 20-й панели.
    standards:
      - Тест на очистку каждые 50 единиц
      - Внутренний контрольный список из 100 пунктов
      - Аудиты случайной выборки
  - title: 48-часовой тест на удержание воздуха
    description: Каждая камера трубы надувается до 125% от номинального давления и удерживается в течение 48 часов. Датчики давления фиксируются непрерывно с температурной компенсацией. Любое падение давления в камере превышает 5% запускает автоматическую повторную проверку по партии.
    standards:
      - Номинальное удержание давления 1,25x
      - <5% максимального падения давления
  - title: Испытания нагрузки и баланса
    description: Готовые платы тестируются на максимальной номинальной мощности по устойчивости, борту и управляемости. Каждая плата проходит испытания на воду перед окончательным одобрением инспекции.
    standards:
      - Проверка нагрузки с номиналом 1,25x
      - Испытание воды
equipment:
  - name: Универсальная испытательная машина (на растяжение)
    spec: Вместимость 5 кН
  - name: Тестер падения давления
    spec: Многоканальный, 0–50 psi, регистрация данных
  - name: UV Камера старения
    spec: UVA-340, 1 000 часовых циклов
  - name: Толщиномер (цифровой)
    spec: Разрешение 0,01 мм
  - name: Тестер отрыва (сварка)
    spec: Моторизованный, вместимость 50 Н
  - name: Температурная камера
    spec: -40 °C до +100 °C
  - name: Резервуар для обнаружения утечек
    spec: 6 м × 2 м, с подсветкой
tldr:
  summary: 'Лаборатория контроля качества Paddle Board Overstock работает независимо от производства, выполняя испытания на растяжение, отслаивание, UV и давление в соответствии с задокументированными внутренними протоколами. 100% единиц подвергаются испытанию на удержание давления при 1,25-кратном номинальном давлении. Доля изделий без дефектов: 99,3% по поставкам за последние 12 месяцев.'
  points:
    - Независимая лаборатория, отделённая от производства для объективной проверки качества
    - 100% испытания на давление при 1,25-кратном номинальном давлении с удержанием 24-48 часов для каждой единицы
    - Задокументированные внутренние протоколы, регулирующие каждый тест
    - 99,3% бездефектных поставок за последние 12 месяцев
    - Каждая единица проходит инспекцию на 6 этапах контроля качества перед отправкой
protocols_label: Протоколы
