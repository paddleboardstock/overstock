reasons:
  tagline: Разница Aquafarer
  title: Что отличает нас
  isBeforeContent: false
  columns: 3
  items:
    - title: Реальное производство, а не торговля
      description: Мы владеем и управляем фабрикой площадью 12 000 м². Когда вы сотрудничаете с Aquafarer, вы работаете напрямую с людьми, которые разрабатывают, конструируют и производят ваши продукты — без посредников.
      icon: tabler:building-factory
    - title: Инженерно-ориентированный подход
      description: Наш процесс проектирования начинается с анализа сценария использования, а не с категории продукта. Мы оптимизируем форму корпуса, выбор материалов и конфигурацию в зависимости от того, как оборудование будет действительно использоваться в коммерческих условиях.
      icon: tabler:engine
    - title: Сертифицированное качество
      description: CE сертифицировано, ISO система качества, BSCI соответствует требованиям, REACH соответствует требованиям, USCG утвержденные спасательные жилеты типов III/V; все продукты соответствуют применимым международным стандартам.
      icon: tabler:certificate
    - title: Гибкий OEM/ODM
      description: Цвета туб, расположение элементов на консоли, брендинг, упаковка — мы настраиваем всё по вашим требованиям. Нет давления минимального заказа. Начните с прототипа, масштабируйтесь с уверенностью.
      icon: tabler:adjustments
    - title: Глобальная логистика
      description: Склад в США в Калифорнии, прямая доставка из Циндао, авиаперевозка для срочных заказов. Мы оформляем таможенные документы и документацию по всему миру.
      icon: tabler:truck-delivery
    - title: Пожизненная поддержка
      description: Мы поддерживаем лодки, которые построили 20 лет назад. Оригинальные запасные части, технические советы, руководство по ремонту — наша команда доступна, когда вы в этом нуждаетесь, где бы вы ни находились.
      icon: tabler:lifebuoy
testimonials:
  tagline: Доверяют бренды по всему миру
  title: Что говорят наши партнеры
  items:
    - content: Мы работали с несколькими производителями в Китае, но Aquafarer выделяется своей инженерной поддержкой и стабильным качеством. Они относятся к нашему бренду как к своему собственному.
      name: — OEM Партнёр, Европейский бренд водного спорта
    - content: Их Hypalon RIBs находятся на службе в нашем флоте более 5 лет. Минимальное обслуживание, отличная UV сопротивляемость. 5-летняя гарантия на трубы дает нам уверенность.
      name: — Оператор флота, Группа курортов Ближнего Востока
    - content: Команда Aquafarer помогла нам разработать индивидуальный дизайн платы SUP от концепции до производства за 90 дней. Качество превзошло наши ожидания.
      name: — Дистрибьютор, Австралийские водные виды спорта
    - content: Будучи владельцем малого бизнеса, я волновался о MOQs. Aquafarer учел мой бюджет и помог мне запустить мой бренд всего с 50 досками. Теперь я заказываю 500.
      name: — Основатель бренда, американская SUP компания по аренде
