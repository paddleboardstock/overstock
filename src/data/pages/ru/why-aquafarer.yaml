hero:
  tagline: Почему Aquafarer
  title: Создан по-особенному. Создан для бизнеса.<br />Партнёр в водных приключениях по всему миру
  subtitle: Не просто производитель — бизнес-партнер, который разрабатывает, проектирует и поставляет оборудование коммерческого уровня для клубов, курортов, арендных операторов и новых водных брендов.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer качество производства и опыт
pillars:
  tagline: Три столпа партнерства
  title: Почему мировые водные компании выбирают Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Разработано для коммерческого использования
      description: Наше оборудование разработано для ежедневной аренды, а не для уикенд-развлечений. Коммерческого класса PVC, усиленные drop-stitch сердечники, UV-стабильные Hypalon опции и проверенное в полевых условиях оборудование означают меньшие затраты на обслуживание, более долгий срок службы и более высокую ROI для вашей работы.
      icon: tabler:building-factory
      callToAction:
        text: См. линейку коммерческих продуктов
        href: /products
    - title: От идеи до рынка
      description: 'Запустите свой бренд водного спорта за 90 дней. Мы проводим вас через каждый этап: проверка концепции, выбор продукта, прототип, производство, дизайн упаковки и глобальная доставка. Без давления на минимальный заказ — начните с малого, масштабируйтесь с уверенностью.'
      icon: tabler:rocket
      callToAction:
        text: Начните своё путешествие с брендом
        href: /oem-odm-blueprint
    - title: Создано для глобальных условий
      description: 'Продукты, оптимизированные для любого климата: формулы для холодной воды PVC для Европы, материалы, устойчивые к UV, для Ближнего Востока и Австралии, обработки против влажности для Юго-Восточной Азии. Каждая поставка калибруется под климатические условия места назначения.'
      icon: tabler:world
