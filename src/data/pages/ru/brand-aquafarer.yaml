hero:
  tagline: 'Бренд'
  title: 'Aquafarer — Инженерия свободы на воде'
  definition: 'Aquafarer — это глобальный бренд морского отдыха и надувных плавсредств, специализирующийся на надувных лодках, SUP-системах и индивидуальных морских решениях. Aquafarer сочетает морскую инженерию, производственный опыт и культуру исследования водных пространств для создания надежного оборудования для любителей, профессионалов и глобальных OEM-партнеров.'

timeline:
  - year: '2012'
    title: 'Основание морского производства'
    body: 'Aquafarer начинался как специализированная мастерская надувных плавсредств в Циндао, Китай, с приверженностью морскому мастерству и производству надувных лодок. Первоначальный фокус был на создании надежных надувных изделий через практический инженерный опыт и производственную дисциплину.'
  - year: '2015'
    title: 'Первый экспорт и сертификация CE'
    body: 'Первые экспортные заказы достигли Японии и Кореи. Была получена сертификация CE для основных линеек продукции, что ознаменовало выход Aquafarer на международные рынки. Компания начала обслуживать коммерческих и частных пользователей за пределами Китая.'
  - year: '2018'
    title: 'Расширение фабрики'
    body: 'Переезд в производственное помещение площадью 12 000 м². Добавлены линии RF-сварки и мощности по производству drop-stitch, что позволило увеличить масштабы производства и улучшить системы контроля качества.'
  - year: '2020'
    title: 'Создание R&D центра'
    body: 'Открыт специализированный научно-исследовательский центр с лабораторией ПВХ-тканей, гидродинамическим испытательным бассейном и студией CAD/FEA-моделирования. Разработка продукции расширилась с фокусом на легкие конструкции, повышенную долговечность и дизайн, ориентированный на пользователя.'
  - year: '2022'
    title: 'ISO 9001 и глобальный рост'
    body: 'Получена сертификация ISO 9001. Штат расширен до 14 инженеров-исследователей и более 200 рабочих. Продукция достигла клиентов в Европе, Америке и Азиатско-Тихоокеанском регионе через дистрибьюторские и OEM-партнерства.'
  - year: '2024'
    title: 'Студия инноваций и дизайна'
    body: 'Запущена студия дизайна и инноваций полного цикла для индивидуальных ODM-проектов — от концепции до производства. Укреплены профессиональные морские направления, включая спасательные, коммерческие и государственные тендеры.'
  - year: '2026'
    title: 'Строительство будущего водных исследований'
    body: 'Сегодня Aquafarer продолжает разрабатывать надувные лодки, SUP-системы и индивидуальные морские решения, объединяя людей и организации с водами мира. Более 50 стран, годовая мощность 15 000 единиц.'

philosophy:
  tagline: 'Философия бренда'
  title: 'Инженерия свободы на воде'
  body: 'Свобода на воде — это не только движение. Это открытие новых мест, создание впечатлений на природе, связь людей с природой и выполнение профессиональных задач. Инженерия делает эту свободу возможной.'
  pillars:
    - title: 'Надежность прежде всего'
      body: 'Водная среда требует доверия. Продукты Aquafarer разработаны с учетом стабильности, долговечности, безопасности и постоянной производительности.'
    - title: 'Дизайн, ориентированный на человека'
      body: 'Продукты должны служить людям, а не технологиям. Каждое дизайнерское решение начинается с понимания того, как люди используют плавсредства, где они исследуют и с какими трудностями сталкиваются.'
    - title: 'Доступные исследования'
      body: 'Вода не должна принадлежать только экспертам. Aquafarer создает оборудование, которое позволяет большему числу людей безопасно исследовать реки, озера, океаны и прибрежные зоны.'
    - title: 'Постоянные инновации'
      body: 'Инновации — это не только создание новых продуктов. Это улучшение каждой детали — материалов, конструкций, производства и пользовательского опыта.'

engineeringDna:
  tagline: 'Инженерная ДНК'
  title: 'Как Aquafarer создает продукты'
  areas:
    - title: 'Материаловедение'
      body: 'Aquafarer фокусируется на выборе подходящих материалов для различных морских сред. Ключевые параметры: устойчивость к истиранию, УФ-стойкость, стабильность давления и долговечность.'
      items: ['Устойчивость к истиранию', 'УФ-стойкость', 'Стабильность давления', 'Долговечность']
    - title: 'Структурная инженерия'
      body: 'Надувные плавсредства требуют точного баланса между жесткостью, весом, портативностью и устойчивостью. Инженерия Aquafarer направлена на оптимизацию этих факторов через технологию drop-stitch и современные методы соединения.'
      items: ['Жесткость', 'Оптимизация веса', 'Портативность', 'Устойчивость']
    - title: 'Точность производства'
      body: 'Каждый продукт проходит контролируемые процессы: подготовка материалов, точный раскрой, сварка и соединение, сборка, контроль качества и проверка характеристик.'
      items: ['Подготовка материалов', 'Точный раскрой', 'Сварка и соединение', 'Сборка и контроль']
    - title: 'Инженерия сценариев использования'
      body: 'Продукты разрабатываются для реальных применений — отдых, приключения и профессиональное использование — гарантируя, что каждый дизайн отвечает конкретным требованиям своей среды.'
      items: ['Отдых', 'Приключения', 'Профессиональное', 'Коммерческое']

