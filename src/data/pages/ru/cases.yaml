features3_cases:
  tagline: Рекомендуемые кейсы
  title: Индивидуальные решения<br />Для реальных задач
  isBeforeContent: false
  columns: 3
  items:
    - title: Ежедневное обновление деятельности дайвинг-центра Бали
      customer: Дайвинг-центр «Голубой океан»
      country: Индонезия
      industry: Коммерческий дайвинг-центр
      challenge: Дайвинг-центр Blue Ocean на Бали эксплуатировал старое судно для дайвинга из стекловолокна с ограниченным пространством на палубе, сложной посадкой для дайверов и высокими требованиями к обслуживанию в условиях тропической соленой воды. Загрузка оборудования была тесной, время подготовки было долгим, а нестабильная платформа создавала проблемы безопасности для иностранных туристов, в том числе для начинающих дайверов и пожилых путешественников. Центр проводит 3-5 дайвинг-поездок ежедневно, более 200 дней в году.
      solution: Paddle Board Overstock поставила изготовленный на заказ профессиональный дайвинг RIB длиной 6,8 м с расширенной планировкой палубы, оптимизированной для хранения оборудования для подводного плавания, широкой лестницей для дайвинга из нержавеющей стали, сверхпрочными трубками Hypalon, устойчивыми к ультрафиолетовому излучению и морской воде, нескользящей поверхностью палубы и решением для хранения резервуаров. Конфигурация была разработана с учетом ежедневного рабочего процесса дайвинг-центра, а не на основе стандартной компоновки прогулочного судна.
      product: Профессиональный дайвинг на глубине 6,8 м RIB
      results: Увеличенная рабочая зона повысила эффективность подготовки оборудования. Посадка на борт дайверов стала более безопасной и легкой. Требования к техническому обслуживанию значительно снижены. Центр получил возможность с большей уверенностью обслуживать больше клиентов в пик сезона. RIB стал основой ежедневных водолазных операций.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Наш водолазный катер – это не только транспорт. Это основа нашей повседневной деятельности. Paddle Board Overstock RIB придает нашей команде больше уверенности при проведении нескольких погружений каждый день.
      icon: tabler:lifebuoy
    - title: Дайв-центр Пхукета Профессиональное обновление RIB
      customer: Дайвинг-центр Ocean Explorer
      country: Таиланд
      industry: Коммерческий дайвинг-центр
      challenge: Дайвинг-центру Ocean Explorer на Пхукете, Таиланд, необходимо было обновить традиционную дайв-лодку из стекловолокна, которая не могла удовлетворить растущий спрос клиентов. Ограниченное пространство на палубе делало подготовку оборудования неэффективной. Сложная посадка создала проблемы с безопасностью иностранных туристов. Высокие требования к техническому обслуживанию в условиях тропической соленой воды увеличили эксплуатационные расходы. Центр осуществляет несколько ежедневных поездок, более 200 дней в году.
      solution: Paddle Board Overstock поставила индивидуальное коммерческое водолазное судно RIB высотой 6,8 м с оптимизированной планировкой рабочей палубы для хранения аквалангов, подготовки оборудования и передвижения дайвера. Особенности включали широкую лестницу для дайвинга с поручнями из нержавеющей стали, прочную трубчатую конструкцию из устойчивых к ультрафиолетовому излучению материалов, нескользящий пол, решение для хранения резервуара, профессиональную консоль и пассажирские сиденья - все это настроено для коммерческих водолазных операций.
      product: Коммерческий дайвинг на глубине 6,8 м RIB
      results: Увеличенная площадь палубы позволила быстрее организовать оборудование и повысить эффективность ежедневного рабочего процесса. Комфорт и безопасность посадки клиентов значительно улучшились. Время простоя при обслуживании сократилось благодаря строительству морского класса. Дайвинг-центр сможет обслуживать больше клиентов в пик сезона и с уверенностью расширять профессиональные услуги по дайвингу.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Для дайв-центра лодка – это не просто транспорт. Это важная часть нашей повседневной работы. Paddle Board Overstock RIB дает нашей команде уверенность в том, что она сможет проводить несколько погружений каждый день с большей безопасностью и эффективностью.
      icon: tabler:lifebuoy
    - title: Флот Европейского дайвинг-центра
      customer: Дайвинг-центры BlueMed
      country: Греция
      industry: Дайвинг и морской туризм
      challenge: Требовалось 12 надувных лодок, настроенных для дайвинга, для сети дайвинг-центров на нескольких греческих островах. На каждой лодке требовалась специальная лестница для дайвинга, хранилище для 8 резервуаров и устойчивая платформа для входа дайверов в открытую воду. Флот должен был прибыть в течение 60 дней к началу туристического сезона.
      solution: Произведено 12 моделей RIB 520 Dive со встроенными стойками для баков, лестницами для погружения и очень широкими трубками Hypalon для обеспечения устойчивости при посадке. Каждая лодка была окрашена в ливрею флота заказчика. Все 12 лодок прошли испытания под давлением и отправлены с Qingdao в течение 55 дней.
      product: RIB 520 погружений
      results: Все 12 лодок сданы вовремя к туристическому сезону. Парк находится в ежедневной эксплуатации более 18 месяцев без каких-либо сбоев в работе оборудования. Клиент заказал еще 6 единиц во втором году.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Погружение RIB 520 было основой наших ежедневных дайверских операций. Устойчивость в состоянии покоя превосходна, а расположение резервуаров обеспечивает чистоту и безопасность палубы для наших гостей.
      icon: tabler:lifebuoy
    - title: Программа австралийского дистрибьютора OEM
      customer: Пасифик Уотерспортс Пти Лтд.
      country: Австралия
      industry: OEM/ODM Производство
      challenge: Австралийскому дистрибьютору требовалась линейка досок под частной торговой маркой SUP по конкурентоспособной цене, чтобы конкурировать с китайскими брендами, ориентированными непосредственно на потребителя. Требуется 8 уникальных моделей, от начинающих до продвинутых, с индивидуальной графикой, индивидуальной упаковкой и возможностью прямой поставки в розничные магазины.
      solution: Разработано 8 моделей SUP (универсальная, туристическая, йога, детская, спортивная, сверхкомпактная, сверхстабильная, Whitewater) с эксклюзивным австралийским графическим пакетом. Индивидуальная розничная упаковка с QR-кодами, ссылками на видеоролики по настройке. Прямая доставка осуществляется с Qingdao напрямую в австралийские розничные магазины.
      product: Пользовательская линия SUP (8 моделей)
      results: От концепции до первой поставки за 90 дней. Продажи в розницу в первый сезон составили 85%. Во второй год дистрибьютор расширил партнерство, включив в него линейку надувных лодок.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock поставила полную линию SUP за 90 дней — от первоначального дизайна до торгового зала. Качество соответствует брендам, которые продаются в два раза дороже.
      icon: tabler:arrows-exchange
    - title: Поставка спасательных лодок на Ближний Восток
      customer: Национальное управление гражданской обороны
      country: Объединенные Арабские Эмираты
      industry: Поиск и спасение
      challenge: Организации гражданской обороны потребовалось 20 готовых к патрулированию РИБ для прибрежных поисково-спасательных операций, обеспечения безопасности портов и реагирования на наводнения. Требуются самоспускающиеся палубы, полное навигационное оборудование (GPS, радар, УКВ), оранжевые трубки повышенной видимости и соответствие местным морским правилам.
      solution: Поставляется 20 моделей RIB 450 Patrol с самовытаскивающимися деками, навигационными комплектами Garmin, светодиодными прожекторами, светоотражающей лентой SOLAS и оранжевыми трубками повышенной видимости Hypalon. Каждая лодка прошла сертификацию CE и прошла испытания по стандартам ISO 6185. В комплект документации вошли сертификаты соответствия для местной регистрации.
      product: RIB 450 патрулей
      results: Флот развернут на 5 береговых станциях. Лодки эксплуатировались в условиях сильной жары (45°C+) без каких-либо деградаций трубок. Дальность патрулирования и топливная экономичность превысили нормативы на 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: Патруль RIB 450 превысил наши оперативные требования. В условиях экстремальной жары лампы Hypalon не проявляют признаков деградации от ультрафиолета после 24 месяцев ежедневного использования.
      icon: tabler:alert-triangle
    - title: Европейское партнерство брендов OEM
      customer: Северное Море Морское Оборудование Б.В.
      country: Нидерланды
      industry: OEM/ODM Производство
      challenge: Известный европейский морской бренд хотел выйти на рынок RIB без инвестиций в производственные мощности. Нужен партнер с белой этикеткой, способный производить 5 моделей RIB (от 3,9 до 6,2 млн) с частным брендом, сертификацией CE и эксклюзивными правами на распространение в ЕС.
      solution: Заключено соглашение о производстве «white label» для 5 моделей RIB. Каждая модель брендирована логотипами клиентов и цветовой гаммой. CE сертификационная документация, подготовленная для каждой модели. Эксклюзивные права на распространение в ЕС предоставляются при условии минимального заказа. Техническая документация и каталог запасных частей предоставляются для местной сервисной сети.
      product: Пользовательская линия RIB (5 моделей)
      results: Подписано многолетнее соглашение. Первая производственная партия из 50 единиц была отправлена ​​в течение 75 дней. Бренд представлен на выставке METSTRADE и получил положительный прием дилеров.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Работа с Paddle Board Overstock позволила нам выйти на рынок RIB без строительства завода — они предоставили комплексное решение «под ключ» с сертификацией CE и документацией дилерской поддержки.
      icon: tabler:building
    - title: Карибский курортный флот
      customer: Райский остров Резортс Лтд.
      country: Багамы
      industry: Морской туризм и гостиничный бизнес
      challenge: 'Роскошному курорту требовался полный парк снаряжения для водных видов спорта для гостей: 40 SUP досок для экскурсий, 20 каяков для исследования лагуны, 10 надувных лодок для трансфера гостей и рыбацких экскурсий, а также аксессуары. Все оборудование нуждалось в индивидуальном брендировании курорта и должно было быть доставлено до пика туристического сезона.'
      solution: 'Произведен полный комплект для занятий водными видами спорта: 40 досок SUP Voyager (модель All-Around), 20 каяков Explorer, 10 надувных лодок AirDeck 360, а также PFD, весла, насосы и ремонтные комплекты. На все оборудование нанесен логотип курорта и тропическая цветовая гамма. Контейнерные перевозки с полной инвентарной ведомостью.'
      product: Полный пакет водных видов спорта (70+ единиц)
      results: Флот прибыл за 6 недель до пика сезона. Уровень удовлетворенности гостей занятиями водными видами спорта увеличился на 40% по сравнению с прошлым годом. Оборудование прослужило 3 сезона только при плановом обслуживании.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Комплексный подход означал, что мы получили все необходимое в одной поставке — доски, каяки, лодки и аксессуары, все фирменные и готовые для использования гостями. Нашим гостям нравится качество оборудования.
      icon: tabler:beach
    - title: Коммерческий дайвинг-центр Квинсленда RIB Обновление
      customer: Коммерческий дайвинг-центр
      country: Австралия
      industry: Коммерческий дайвинг и морские услуги
      challenge: Коммерческий дайвинг-центр в Квинсленде, специализирующийся на проверке морской инфраструктуры, обслуживании портов и проектах подводного ремонта, эксплуатировал устаревшую рабочую лодку. По мере роста спроса на проект старое судно стало обузой — частое техническое обслуживание приводило к сбоям в графике, планировка не была рассчитана на современные водолазные операции (ограниченное пространство для баллонов, инструментов и оборудования), а комфорт экипажа во время длительных операций был плохим. Компании требовалось судно, которое могло бы поддерживать ее профессиональную деятельность каждый рабочий день.
      solution: Paddle Board Overstock провел подробный оперативный анализ рабочего процесса водолазных работ заказчика, типичной продолжительности проекта, численности экипажа и требований к оборудованию. На основе этого анализа компания Paddle Board Overstock предоставила индивидуализированную профессиональную модель RIB с функциональной компоновкой палубы, оптимизированной для подготовки оборудования и передвижения дайвера, профессиональными сиденьями для длительных периодов транспортировки, повышенной устойчивостью для более безопасного входа и выхода дайвера, а также функциями поддержки дайвинга, интегрированными в конструкцию.
      product: Индивидуальный профессиональный дайвинг RIB
      results: Новый RIB стал надежной ежедневной рабочей платформой. Подготовка оборудования стала быстрее благодаря оптимизированной компоновке. Экипаж сообщил об улучшении комфорта и безопасности при длительных операциях. Профессиональный внешний вид катера укрепил доверие клиентов при работе с портовыми операторами и морскими подрядчиками. Дайвинг-центр получил судно, соответствующее профессионализму службы.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Нам нужна была лодка, которая могла бы поддерживать наш бизнес каждый день, а не просто судно для перевозки. Paddle Board Overstock работала с нами, чтобы понять наши эксплуатационные требования, и предоставила RIB решение, которое соответствует нашему рабочему процессу коммерческого дайвинга.
      icon: tabler:lifebuoy
    - title: Контракт с прибрежным патрулем США
      customer: Агентство безопасности Атлантического побережья
      country: Соединенные Штаты
      industry: Морская безопасность и правоохранительная деятельность
      challenge: Агентству береговой безопасности США потребовались сверхмощные патрульные надувные лодки для операций по перехвату в открытой воде. Требовалась двухмоторная конфигурация для резервирования, бронированная консоль для защиты экипажа, электроника военного назначения (шифрованная связь, FLIR, радар) и соответствие правилам береговой охраны США.
      solution: Разработанный RIB 600 Patrol с двойной подвесной конфигурацией 115 HP, бронированной консолью с баллистической защитой, тепловизором FLIR, зашифрованной связью VHF/UHF и встроенными точками крепления вооружения. Корпус усилен для маневров на высокоскоростном перехвате. Вся электроника интегрирована и протестирована на заводе. USCG предоставлена ​​документация о соответствии.
      product: RIB Патруль 600 (двухмоторный)
      results: На приемочных испытаниях лодки достигли максимальной скорости 52 узла. Агентство сообщило о 95% готовности миссии за первые 12 месяцев. Размещен дополнительный заказ на 8 единиц.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Двухмоторный двигатель RIB 600 обеспечивает нашим экипажам скорость и резерв, необходимые для операций по перехвату в открытой воде. Бронированная консоль обеспечивает критически важную защиту без ущерба для производительности.
      icon: tabler:shield
