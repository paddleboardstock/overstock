hero:
  tagline: Тематические исследования
  title: Настоящие гребцы, настоящие истории<br />— Paddle Board Overstock в действии
  subtitle: Узнайте, как гребцы, семьи и искатели приключений по всему миру выходят на воду с Paddle Board Overstock SUP надувными досками.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock Истории клиентов — надувные SUP доски в действии
features3_cases:
  tagline: Избранные статьи
  title: Настоящие доски<br />Для настоящих приключений
  isBeforeContent: false
  columns: 3
  items:
    - title: От дивана к стоянию с первого раза
      customer: Первый гребец
      country: Германия
      industry: Отдых для начинающих
      challenge: Анна никогда раньше не гребла и нервничала из-за равновесия, холодной воды и глупого выглядеть перед другими. Живя в маленькой мюнхенской квартире, у неё не было где хранить жёсткую доску и багажника на крыше для транспортировки.
      solution: SUP Explorer 11 предлагает широкую и устойчивую платформу, которая прощает шаткие первые гребки. Полный комплект — доска, регулируемое весло, насос, поводок и сумка — позволял ей доносить всё до озера пешком. От коробки до воды менее чем за 20 минут, без необходимости опыта.
      product: SUP Эксплорер 11
      results: Анна встала с первой же попытки и гребла час без падения. Два месяца спустя она гребёт три раза в неделю и присоединилась к местной группе встреч. Доска упаковывается в рюкзак, который помещается в шкаф в коридоре.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Я ожидал провести свой первый день, плавая рядом с доской. Вместо этого я уже скользил по озеру за считанные минуты — я не мог поверить, насколько оно устойчиво.
      icon: tabler:school
    - title: Одна доска, двое детей, ни одной жалобы
      customer: Семья из четырёх человек
      country: Италия
      industry: Семейный отдых
      challenge: Марко и Джулия хотели летнее занятие, ради которого их двое детей действительно оставляли бы свои экраны. Раньше дешёвые надувные катушки деформировались, протекали по швам и сдувались посреди весла — дети потеряли уверенность после одного неудачного заплыва.
      solution: Серия Tropical Breeze предлагает полноценный пейзаж островного отпуска — солнечный свет, кокосовые рощи и пляжные сцены — которые заставили детей хотеть выйти на воду. drop-stitch Ядро работает жёстко на 15 PSI градусах, и каждая доска проходит испытания под давлением на 1,25 раза выше номинального давления в течение 24-48 часов на заводе перед отправкой.
      product: Серия Tropical Breeze
      results: Теперь семья гребёт каждые выходные с июня по сентябрь. После целого сезона детского трафика доска не показывает ни нагрузки в швах, ни выцветания. Их дочь начала просить себе собственную доску на день рождения.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: Дети спорят, чья очередь грести. После дешёвых досок, которые мы пробовали раньше, эта кажется созданной, чтобы выжить именно для нашей семьи.
      icon: tabler:users
    - title: Плавающая йога-студия на рассвете
      customer: Практик йоги
      country: Индонезия
      industry: SUP Йога и медитация
      challenge: Путу преподаёт йогу на Бали и хотела взять практику на воду, но первые попытки на одолженной доске казались скользкими и нестабильными. Держать позу в открытой воде требует захвата, устойчивости и умиротворяющего дизайна.
      solution: Серия Flowing Lotus сочетает изображения лотоса, кои и стрекозы с лазерной гравировкой для тяги, которая удерживает руки и ноги в опущенной собаке. Широкий контур и толщина 6 дюймов создают устойчивую парящую платформу для потоков и сидячей медитации.
      product: Серия Flowing Lotus
      results: Путу теперь проводит SUP небольшие занятия йогой на рассвете два раза в неделю. Её ученики записываются за несколько недель вперёд, а доска стала визитной карточкой её занятий — иллюстрации занимаются половиной её маркетинга.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Практика на воде меняет всё. Доска достаточно устойчивая для позы ворона, а дизайн лотоса делает каждый класс настоящим ритуалом.
      icon: tabler:heart
    - title: Контент, который никогда не исчезает — буквально
      customer: Создатель туристического контента
      country: Португалия
      industry: Социальные сети и создание контента
      challenge: Мигель зарабатывает на жизнь контентом для весла. Печатные доски, которыми он пользовался раньше, теряли цвет в течение сезона солёной воды и солнца — его кадры стали выглядеть устаревшими, а поклонники заметили облупившиеся площадки палубы.
      solution: Издание Cheetah Surge строит мотив гепарда из вырезанного многоцветного EVA блока, а не на поверхностных чернилах. Цвета являются частью самой пенопласта, поэтому солёная UV вода и поток людей не могут выцветать, отлуплять или царапать дизайн.
      product: Издание Cheetah Surge
      results: Спустя целый год съёмок на побережье доска выглядит совершенно новой на камере. Его клипы с рассветом из Алгарве стали его самым успешным контентом за всю историю, а сама доска появляется в десятках коллабораций брендов.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Мои старые доски старели быстрее, чем мой контент. Cheetah выглядит так же, как в первый день после года в океане — мои подписчики всё время спрашивают, какой фильтр я использую. Это не фильтр. Это плата.
      icon: tabler:camera
    - title: Выходные прибрежные экспедиции
      customer: Прибрежный туринг-гребец
      country: Австралия
      industry: Туризм и исследование
      challenge: Том хотел грести по спокойным заливам и мысам Золотого Берега во время многочасовых туров, но лёгкие бюджетные доски сгибались в течение часа и оставили его измотанным уже через час. Ему нужна была жёсткость, которую он мог бы нести в одиночку на удалённые входы.
      solution: Серия Ocean Voyager сочетает в себе изображение морской черепахи в глубоких бирюзовых и коралловых цветах с жёстким drop-stitch сердцевином, которое сохраняет форму при лёгком прибрежном рублении. Веся около 20 фунтов в рюкзаке, Том может доехать до пляжей, куда не дойдёт ни одна машина, надуть его с помощью насоса и часами турировать.
      product: Серия Ocean Voyager
      results: Том уже проложил на карту одиннадцать прибрежных маршрутов, включая полноценный утренний переход, который когда-то считал выше своих возможностей. Доска остаётся жёсткой от запуска до обеда, а дизайн морской черепахи стал его узнаваемой фирменной карточкой на воде.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Жёсткие доски ощущаются как хардборды, а эта — как рюкзак. Она открыла целое побережье, до которого я никогда не смог добраться с машиной и прицепом.
      icon: tabler:compass
    - title: Фитнес для всего тела, ноль платы за спортзал
      customer: Фитнес-гребец
      country: Канада
      industry: Физическая подготовка и тренировки
      challenge: Прия хотела тренировки с низким уровнем нагрузки на всё тело, которая не ощущалась как тренировка. Бег причинял ей боль в коленях, а спортзал казался однообразным — она бросила все тренировки за шесть недель.
      solution: 'Серия Dolphin Wave превратила тренировки в игру: гребля сжигает калории, укрепляет корпус и плечи, а также ставит вызов балансу, при этом дрейфуя мимо пейзажей Ванкувера. Стабильная 32-дюймовая палуба прощает неуклюжие движения, но при этом требует постоянного микробаланса — спортзал, замаскированный под доску для гребли.'
      product: Серия Dolphin Wave
      results: Прия гребёт пять раз в неделю утром перед работой и сохраняет этот режим уже 14 месяцев — это её личный рекорд для любого плана упражнений. Теперь друзья присоединяются к её еженедельному клубу по гребли, и её колени никогда не были так счастливы.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Мне ни разу не пришлось заставлять себя покататься на гребле. Тренировка настоящая — я просто перестал её замечать, потому что слишком занят удовольствием от воды.
      icon: tabler:trophy
    - title: 30-килограммовый лабрадор и одна очень стабильная палуба
      customer: Гребец с собакой
      country: Соединенные Штаты
      industry: Гребка с питомцами
      challenge: Джейк хотел вывести своего лабрадора Бисквита на воду, но его старая узкая доска превратилась в подводную лодку в тот момент, когда собака прыгнула на борт. Когти также разорвали дешёвый палубный наклад за несколько недель.
      solution: Серия Leviathan Wake предлагает широкую платформу с большим объёмом груза, на которой перевозят гребца и пассажира весом 30 килограммов, не удавливаясь. EVA Тяговая палуба пережила когти, разрушившие его предыдущую доску, а тотем синего кита даёт Бисквиту чётко видимое «место» для сидения.
      product: Серия «Пробуждение Левиафана»
      results: Теперь Бисквит прыгает на борт по команде и едет носом, как настоящая голова. Спустя два лета палуба не показывает повреждений когтями, а их речные гребли стали самым любимым контентом в ленте Джейка.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: Я купил доску и взял первого помощника. Терраса буквально отмахивалась от всего, что могла бросить в неё большая мокрая собака.
      icon: tabler:dog
    - title: Студенческий бюджет, полноценное качество
      customer: Студент университета
      country: Польша
      industry: Студенческий образ жизни
      challenge: Касия — студентка в Гданьске с ученическим бюджетом и летним распорядком на озере. Каждая дешёвая доска, которую она нашла, была либо хлипкой, либо некрасивой, либо и тем, и другим — а качественные доски стоили дороже ежемесячного бюджета на еду.
      solution: Серия Medusa Glow сочетает премиальную сборку — drop-stitch ядро, 15 PSI жёсткости, медузы в мятно-зелёном цвете, собранную из EVA вырезанных блоков — с Paddle Board Overstock ценами на заводские прямые распродажи, которые не учитывают все посредники.
      product: Серия Medusa Glow
      results: Касия заплатила меньше половины того, что продаются аналогичные премиальные доски в местном магазине. Её доска пережила целый сезон ежедневных занятий на озере и неделю на балтийском пляже, а трое одноклассников заказали свои сами после того, как попробовали её.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Я ожидал компромиссов со студенческим бюджетом. Вместо этого я получил доску, которую мои друзья считали стоей в три раза дороже — и она прослужила дольше двух их доски.
      icon: tabler:backpack
    - title: Отходы с устойчивой платформы
      customer: Уикенд-рыбак
      country: Соединенные Штаты
      industry: SUP Случайная рыбалка
      challenge: Девон ловит тихие захолустья, слишком мелкие для какого-либо моторного суда. Ему нужен был весловой судно, достаточно устойчивый для заброса стоя, достаточно прочный для крючков и снаряжения, и достаточно лёгкий, чтобы нести по тропе на рассвете.
      solution: Серия Jungle Mandala предоставляет ему широкую жёсткую платформу для заклинания с палубой из гибискуса и колибри цвета Tiffany Blue, которая остаётся прохладной под утренним солнцем. Доска упаковывается до размера рюкзака для тропы, надувается за считанные минуты у воды, а усиленная PVC кожа снимает зацепки крючка и удары плавников.
      product: Серия «Джунгли Мандала»
      results: Девон теперь достигает трёх нерестовых бухт, которые никто другой не может поймать. Его показатель улова удвоился за сезон, и доска — крючки, стрингер и всё остальное — всё ещё готова к следующему лету.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Стоя на SUP рыбалке полностью изменилось. Эта доска достаточно устойчива, чтобы бросать, ставить крючок и ловить рыбу — и всё это без промока.
      icon: tabler:fish
cta:
  title: Готовы написать свою собственную историю о гребле?
  subtitle: Каждая Paddle Board Overstock доска готова и полностью проверена под давлением. Расскажите, как вы греблите, и мы поможем вам найти подходящую доску.
  actions:
    - variant: primary
      text: Найдите свою доску
      href: /supboard
    - text: Просмотреть все доски
      href: /products
