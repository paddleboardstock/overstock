hero:
  tagline: Тематические исследования
  title: Реальные проекты, реальные результаты<br />— Paddle Board Overstock в действии
  subtitle: Узнайте, как Paddle Board Overstock сотрудничает с дистрибьюторами, брендами и операторами по всему миру, чтобы предоставлять индивидуальные морские решения для каждого применения.
