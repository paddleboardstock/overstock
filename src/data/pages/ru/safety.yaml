certifications:
  - title: Сертификация CE (ЕС 2016/425)
    standard: Регламент СИЗ (ЕС) 2016/425 | EN ISO 12402
    description: Все средства безопасности Paddle Board Overstock соответствуют требованиям маркировки CE согласно Европейскому регламенту по средствам индивидуальной защиты. Каждый продукт независимо испытывается TÜV Rheinland — европейским нотифицированным органом. Наши надувные лодки и RIB соответствуют требованиям категорий C и D Директивы по прогулочным судам 2013/53/EU (RCD).
    body: Сертификация CE охватывает основные требования к здоровью и безопасности для индивидуальных спасательных средств и надувных судов. TÜV Rheinland ежегодно аудирует наше производство для подтверждения постоянного соответствия.
  - title: SOLAS — безопасность жизни на море
    standard: Глава III СОЛАС | Кодекс LSA
    description: Life Vest Pro соответствует правилам SOLAS для офшорных и коммерческих морских операций. Испытан на удержание плавучести в течение 24 часов, автоматическое надувание при погружении и работу при волнении моря до 5 баллов. Соответствует требованиям главы III к спасательным жилетам на коммерческих судах.
    body: Одобрение SOLAS требует независимых испытаний нотифицированным органом на плавучесть, прочность, видимость и автоматическое срабатывание. Наш Life Vest Pro имеет полное одобрение типа SOLAS с сертификацией MED.
  - title: USCG тип III / тип V
    standard: 46 CFR Часть 160 | Одобрение USCG
    description: Отобранные спасательные жилеты Paddle Board Overstock соответствуют классификации Береговой охраны США для устройств типа III (вспомогательное плавсредство) и типа V (специального назначения). Подходят для закрытых акваторий, прибрежного плавания и коммерческих операций, требующих PFD, одобренных USCG.
    body: Одобрение USCG требует испытаний в независимой лаборатории, признанной Береговой охраной. Одобрение типа V включает гибридные надувные конструкции с ручным или автоматическим срабатыванием.
  - title: Социальная ответственность BSCI
    standard: Кодекс поведения amfori BSCI
    description: Наша фабрика ежегодно проходит аудит по инициативе amfori Business Social Compliance Initiative (BSCI). Это подтверждает этичные трудовые практики, безопасность на рабочем месте, справедливые часы работы и экологический менеджмент на нашей производственной площадке площадью 12 000 м².
    body: Соответствие BSCI — обязательное требование для европейских ритейлеров и импортёров. Наш текущий рейтинг BSCI — «C» (хорошо), аудит проведён SGS.
  - title: Соответствие REACH и RoHS
    standard: Регламент ЕС REACH (EC) 1907/2006 | Директива RoHS 2011/65/EU
    description: Все ПВХ-композиции, клеи и покрытия, используемые в продуктах Paddle Board Overstock, соответствуют европейским регламентам химической безопасности REACH и ограничениям RoHS на опасные вещества. Паспорта безопасности материалов (MSDS) доступны для каждой продуктовой линейки.
    body: Соответствие REACH гарантирует отсутствие ограниченных веществ SVHC выше пороговых пределов. Регулярные испытания в сторонних лабораториях подтверждают соответствие каждой производственной партии.
  - title: Менеджмент качества ISO 9001:2015
    standard: ISO 9001:2015 | Сертифицировано TÜV Rheinland
    description: Наша система менеджмента качества сертифицирована по ISO 9001:2015 компанией TÜV Rheinland и охватывает проектирование, производство, испытания и послепродажное обслуживание. Ежегодные надзорные аудиты обеспечивают постоянное совершенствование и контроль процессов.
    body: Сертификация ISO 9001 требует документированной политики качества, внутренних аудитов, анализа со стороны руководства, процедур корректирующих действий и прослеживаемых производственных записей.
testimonial:
  quote: Мы закупали спасательное оборудование у нескольких поставщиков в Азии. Paddle Board Overstock — единственный производитель, который заранее предоставил полную документацию CE, сертификаты SOLAS и отчёты сторонних испытаний — без нашей просьбы.
  author: Erik Lindström
  title: Ответственный за безопасность
  company: Baltic Marine Supply
  location: Финляндия
content_overpressure:
  tagline: Защита от избыточного давления
  title: Управление давлением в трубах RIB<br />в жарком климате
  subtitle: Давление в надувных трубах растёт с температурой. Понимание и контроль избыточного давления предотвращают повреждения и обеспечивают безопасную эксплуатацию в тропических и пустынных условиях.
  items:
    - title: Предохранительные клапаны Boyle
      description: Трубы RIB Paddle Board Overstock оснащены предохранительными клапанами избыточного давления, которые автоматически стравливают избыток выше номинального максимума. Это предотвращает напряжение швов и возможный разрыв трубы от солнечного нагрева.
      icon: tabler:gauge
    - title: Изменение давления с утра к полудню
      description: Труба, накачанная до 3,5 PSI при 20 °C, может достичь 4,5+ PSI на солнце при 40 °C. В жарком климате всегда накачивайте до нижней границы рекомендуемого диапазона и позвольте предохранительному клапану управлять избыточным давлением.
      icon: tabler:sun
    - title: Рекомендуемые рабочие давления
      description: 'Трубы из ПВХ: рабочее 3,0-3,5 PSI, максимум 4,5 PSI. Трубы из Hypalon: рабочее 3,5-4,0 PSI, максимум 5,0 PSI. Всегда испытывайте при 1,25x номинала (4,4 PSI для ПВХ, 5,0 PSI для Hypalon) согласно стандартам контроля качества Paddle Board Overstock.'
      icon: tabler:chart-bar
    - title: Правила эксплуатации на солнце
      description: Храните RIB в затенённых местах при отсутствии использования. Используйте УФ-защитные чехлы при длительной стоянке на воде. Проверяйте и регулируйте давление в трубах до и после часов пиковой солнечной активности. Никогда не превышайте максимальное номинальное давление.
      icon: tabler:umbrella
    - title: Аварийное стравливание давления
      description: Если труба кажется чрезмерно жёсткой или предохранительный клапан стравливает воздух, выпустите воздух через клапан Halkey-Roberts или военный клапан, пока давление не вернётся в рабочий диапазон. Носите с собой манометр для точных показаний.
      icon: tabler:alert-circle
