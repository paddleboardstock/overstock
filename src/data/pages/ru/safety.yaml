  tagline: Безопасность
  title: Стандарты безопасности и сертификация
  subtitle: Каждый продукт Paddle Board Overstock проходит строгие испытания, и 64 модели с сертификацией CE соответствуют международным стандартам безопасности для рекреационного и профессионального использования. Фабрика с сертификацией ISO 9001.
