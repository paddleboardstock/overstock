testimonial:
  quote: Я проверил журнал тестов давления, который пришёл вместе с моей платой, и отправил в поддержку два вопроса о инфляции в летнюю жару. Они ответили реальными цифрами в тот же день. Это больше, чем любой магазин когда-либо сделал для меня.
  author: София Маркетти
  title: Подтвержденный покупатель
  company: Прибрежный гребец
  location: Италия
content_overpressure:
  tagline: Безопасность при давлении
  title: Давление на плату<br />Управление в жарком климате
  subtitle: Давление на надувной доске увеличивается с температурой. Понимание и управление избыточным давлением защищает вашу доску и делает каждую сессию безопасной.
  items:
    - title: Почему давление растёт
      description: Воздух расширяется от тепла. Доска, надутая до 15 PSI при 20°C, может подниматься на PSI 1-2 градуса солнца при 40°C — та же физика, которая к полудню делает прохладную утреннюю доску твёрдой, как камень.
      icon: tabler:gauge
    - title: Рекомендуемое рабочее давление
      description: Надуть до 12-15 PSI, как указано рядом с клапаном. Номинальный диапазон балансирует жёсткость, безопасность и срок службы шва — больше не лучше.
      icon: tabler:chart-bar
    - title: Лучшие практики в области горячего климата
      description: В жаркие дни надувайте до нижней границы диапазона. Выпускайте немного воздуха перед длительным воздействием солнца и никогда не оставляйте полностью надутую доску гореть на пляже.
      icon: tabler:sun
    - title: Экспозиция и хранение на солнце
      description: Храните доски в тени и частично сдуванные, когда не используются. Используйте мешок для UV досок для защиты. Промыйте и высушите перед скатыванием для хранения.
      icon: tabler:umbrella
    - title: Если доска кажется твёрдой как камень
      description: Выпускайте воздух через клапан, пока плата не вернётся к номинальному диапазону. Держите манометр на насосе для точных показаний — чрезмерно надутая плата излишне напрягает швы.
      icon: tabler:alert-circle
