content_challenge:
  tagline: Вызов
  title: Морская энергетика требует<br />надежности в экстремальных условиях
  subtitle: Морские энергетические операции заставляют оборудование работать на пределе возможностей — экстремальные погодные условия, удаленные места, непрерывные рабочие циклы и нулевая терпимость к сбоям.
  paragraphs:
    - Офшорная энергетика работает в самых суровых морских условиях на планете. Рабочие катера обслуживают нефтегазовые платформы, монтаж морских ветротурбин, подводные кабельные операции и морское строительство — зачастую в открытом океане в ограниченные погодные окна. Отказ оборудования — это не только дорого, это опасно.
    - '**Безопасность — высший приоритет** — Катера для доставки персонала должны безопасно работать при волнении, останавливающем любые другие операции. Устойчивость в момент пересадки, надёжная работа двигателей в любую погоду и прочная конструкция для регулярной стыковки с офшорными сооружениями — обязательные требования.'
    - '**Всепогодность критически важна** — Офшорные ветропарки и нефтеплатформы работают круглый год. Рабочие катера должны выполнять задачи при значительном волнении, сильном ветре и ограниченной видимости. Круглосуточные операции требуют полной навигационной комплектации и надёжных систем освещения.'
    - '**Офшорная ветроэнергетика быстро растёт** — По всему миру устанавливаются тысячи новых турбин, каждая из которых требует регулярной доставки персонала, перевозки инструмента и технической поддержки. Это создаёт устойчивый спрос на специализированные катера доставки экипажей (CTV) и вспомогательные RIB.'
    - Офшорные энергетические RIB Aquafarer созданы с усиленными корпусами deep-V, сверхпрочными баллонами Hypalon, полным навигационным оборудованием и системами безопасности, рассчитанными на экстремальные условия офшорных энергетических операций.
content_solution:
  tagline: Наше решение
  title: Специально построенные морские РИБ<br />Для энергетической отрасли
  subtitle: Каждое морское энергетическое надувное судно Aquafarer спроектировано для безопасной и надежной работы в экстремальных морских условиях — от Северного моря до Юго-Восточной Азии.
  list:
    - Усиленный корпус deep-V для работы на взволнованном море и предсказуемого управления
    - Сверхпрочные баллоны Hypalon с защитой от УФ и химии для длительной офшорной службы
    - Фурнитура из нержавеющей стали 316 — не корродирует при постоянном контакте с морской водой
    - 'Полный навигационный комплект: GPS, радар, УКВ-радиостанция, ходовые огни — стандарт для офшорных моделей'
    - Самоосушающаяся палуба для безопасной работы при захлёстывающих волнах
    - Различные конфигурации моторов — один или два подвесных для резервирования миссии
    - Буксировочная колонна и мощные кнехты для работы с платформами и буями
    - Хорошо заметные цвета баллонов для опознания на офшорных объектах
content_segments:
  tagline: Энергетические профили
  title: Решения для морской энергетики<br />По типу применения
  subtitle: Различные отрасли морской энергетики предъявляют уникальные требования к рабочим судам — от RIB для поддержки платформ до CTV ветряных электростанций и подводных инспекционных судов.
  items:
    - title: Поддержка морских нефтегазовых платформ
      subtitle: Переезд экипажа, поставка оборудования, дежурство по обеспечению безопасности платформы
      description: Нефтяные и газовые платформы требуют ежедневной смены экипажа, транспортировки оборудования и снабжения, а также резервного обеспечения безопасности. Рабочие лодки должны безопасно работать вокруг конструкций платформ, при сильном течении и переменном состоянии моря, а также сохранять точное положение во время перемещения персонала по трапу или трапу. Экстремальные условия — углеводороды, химикаты, постоянные солевые брызги — требуют коррозионностойкой конструкции и надежной работы.
      features:
        - Конфигурация доставки персонала с безопасным доступом на борт и поручнями
        - Коррозионностойкие баллоны Hypalon и фурнитура из нержавеющей стали 316
        - Усиленные привальные брусья для частых касаний кранцев платформы
        - Самоосушающаяся палуба для нефтесодержащей воды и химической промывки
        - Топливный бак повышенной ёмкости для увеличенной офшорной автономности
        - Вариант с двумя моторами для критически важного резервирования
    - title: Работа морской ветряной электростанции
      subtitle: Переезд экипажа, обслуживание турбин, транспортировка инструментов
      description: 'Морская ветроэнергетика является наиболее быстрорастущим сектором морской энергетики. Операторам нужны суда для перевозки экипажа (CTV), которые могут безопасно доставлять технических специалистов на платформы доступа к турбинам при волнении на море с высотой волны до 1,5 м. Стабильность во время транспортировки, всепогодность и надежная ежедневная эксплуатация имеют решающее значение. Суда для обслуживания ветряных электростанций работают по жесткому графику: любые простои задерживают ввод в эксплуатацию или техническое обслуживание турбин, что напрямую влияет на доходы от производства энергии.'
      features:
        - Оптимизированные обводы корпуса для стабильной пересадки персонала у основания турбины
        - Носовые обводы deep-V для комфортного хода на ветровой волне и зыби
        - Полная защита от непогоды — закрытая консоль или рубка для комфорта экипажа
        - Палубное пространство для инструмента, запчастей и сервисного оборудования
        - Пакет для ночных операций при укороченном световом дне зимних смен
        - Тихая работа подвесного мотора с минимальным шумовым воздействием на морскую среду
    - title: Поддержка подводных кабелей и трубопроводов
      subtitle: Осмотр, обслуживание, поддержка ROV, обследование
      description: Операторам подводных кабелей и трубопроводов нужны рабочие катера для проверки маршрутов, поддержки технического обслуживания, операций ROV и исследовательских задач. Этим судам требуются устойчивые платформы для развертывания и подъема подводного оборудования, точное маневрирование для отслеживания кабеля и надежная работа в прибрежных и морских условиях. Устойчивость лодки имеет решающее значение для точности гидролокатора и геодезического оборудования.
      features:
        - Устойчивая платформа на малом ходу для сопровождения кабелей и съёмочных работ
        - Открытая планировка палубы для спуска ROV, кабельных барабанов и изыскательского оборудования
        - Монтажные плиты для сонара, GPS и измерительной аппаратуры
        - Корпус с малой кильватерной волной для минимального возмущения дна при инспекции
        - Точное маневрирование на малом ходу с отзывчивым рулевым управлением
    - title: Морская инженерия и поддержка строительства
      subtitle: Перевозка персонала, материальное обеспечение, водолазное обеспечение
      description: Подрядчикам морского машиностроения, работающим над строительством портов, береговой защитой и морскими монтажными проектами, нужны универсальные рабочие катера для перевозки персонала между строительными судами и берегом, поставки материалов и инструментов, водолазной поддержки и обследования площадок. Эти лодки работают в зонах активного строительства с большим количеством судов, ограниченным пространством для маневра и переменными морскими условиями. Главное — долговечность и универсальность.
      features:
        - Многофункциональная планировка палубы для персонала, материалов и снаряжения для дайвинга
        - Водолазный трап и крепления снаряжения для водолазных работ
        - Мощные кнехты и буксировочная колонна для маневрирования на стройплощадке
        - Прочная конструкция Hypalon со стойкостью к строительному мусору и истиранию
        - Гибкие конфигурации сидений — режим перевозки экипажа или груза
