hero:
  tagline: Образ жизни
  title: Paddle Board Overstock<br />Образ жизни
  subtitle: Создано для тех, кто живет на воде — от уикенд-исследователей до ежедневных гребцов, которые считают дни до следующей сессии.
values:
  - icon: 🌊
    title: Рождено на воде
    desc: Каждый дизайн начинается с понимания поведения воды. Мы проектируем от предела условий внутрь — потому что океан наш учитель, а не место работы.
  - icon: 🔧
    title: Создано, чтобы служить долго
    desc: Наиболее экологичный продукт — это тот, который не нужно заменять. Материалы морского класса, ядра drop-stitch с рейтингом 15 PSI и швы, которые переживут сезон.
  - icon: 🏆
    title: Доступность по дизайну
    desc: Водные виды спорта не должны быть роскошью. Профессиональная производительность по цене, которая имеет смысл для семей, гидов и повседневных гребцов — не только для профессионалов.
  - icon: 🌍
    title: Глобальное сообщество
    desc: 'От побережья Вейхая до озер Европы, рек Юго-Восточной Азии и заливов Америк — наших клиентов объединяет одно: любовь к нахождению на воде.'
  - icon: ♻️
    title: Ответственное производство
    desc: CNC — оптимизированная укладка материалов снижает отходы до 5%. Прочная конструкция сокращает циклы замены. Мы создаём для долговечности, потому что это самый экологичный выбор.
  - icon: 🤝
    title: Поддержка, которая длится
    desc: Доски, которые мы создали годы назад, до сих пор звонят нам за запчастями. Среднее время ответа по гарантии — 24 часа. Мы не исчезаем после продажи — мы здесь на весь срок жизни продукта.
