hero:
  tagline: Партнёрство и дистрибуция
  title: 'Станьте партнёром Aquafarer<br />— глобальная дистрибьюторская сеть'
  subtitle: "Присоединяйтесь к глобальной сети партнёров Aquafarer. Мы сотрудничаем с дистрибьюторами морского оборудования, дилерами лодок, розничными продавцами снаряжения и брендами-партнёрами более чем в 50 странах."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Глобальная сеть партнеров и дистрибьюторов Aquafarer
content_programs:
  tagline: Партнерские программы
  title: 'Партнёрские программы,<br />созданные для роста'
  subtitle: 'Независимо от того, кто вы — дистрибьютор, дилер или бренд-партнёр, Aquafarer предлагает программы, разработанные для поддержки вашего бизнеса.'
  columns: 3
  items:
    - title: Программа для дистрибьюторов
      description: 'Эксклюзивная дистрибуция по территориям с оптовыми ценами, маркетинговой поддержкой и прямым доступом к заводу. Минимальные обязательства зависят от размера территории.'
      icon: tabler:world
    - title: Программа для дилеров
      description: 'Прямые дилерские цены, обучение по продукту, маркетинговые материалы и гарантийная поддержка для розничных точек и интернет-магазинов.'
      icon: tabler:building-store
    - title: Партнерство OEM/ODM
      description: 'Полный цикл производства OEM и ODM с индивидуальным брендингом, упаковкой и спецификациями продукции. От концепции до контейнера.'
      icon: tabler:certificate
    - title: Партнерство с брендами
      description: 'Программы совместного брендинга, частных марок и эксклюзивных моделей для устоявшихся брендов в сфере морского отдыха и активного отдыха на природе.'
      icon: tabler:stars
    - title: 'Государственные и институциональные организации'
      description: 'Программы приоритетного поставщика для государственных органов, береговых охран, военных и гуманитарных организаций. Документация, готовая к тендерам.'
      icon: tabler:building-community
    - title: 'Партнёр для курортов и проката'
      description: 'Флотские цены, стабильное качество и индивидуальный брендинг для курортов, дайвинг-центров и прокатных компаний по всему миру.'
      icon: tabler:sun
content_benefits:
  tagline: Почему стоит сотрудничать с нами
  title: 'Почему партнёры выбирают Aquafarer'
  subtitle: 'Наши партнёры получают реальные производственные возможности, стабильное качество и оперативную поддержку.'
  list:
    - 'Прямой доступ к заводу: работайте напрямую с нашей производственной командой — без посредников. Более быстрые ответы, лучшие цены и полная прозрачность производства.'
    - 'Готовность к кастомизации: наносите на продукцию собственные цвета, логотипы, упаковку и спецификации. Минимальные объёмы заказа подстраиваются под ваш рынок.'
    - 'Гарантированное качество: сертифицированное ISO 9001 производство с соответствием CE, UKCA и BSCI. Каждое изделие тестируется перед отгрузкой.'
    - 'Глобальная логистика: отгрузка из Циндао, Китай на условиях FOB, CIF и DDP. Склад в США в Монтклэре, Калифорния для дистрибуции в Северной Америке.'
    - 'Маркетинговая поддержка: каталоги продукции, фотоматериалы, техническая документация и цифровые активы для поддержки ваших продаж.'
    - 'Обучение и поддержка: обучение по продукту для вашей команды продаж, техническая поддержка ваших клиентов и координация гарантийного обслуживания.'
content_process:
  tagline: Как стать партнёром
  title: 'Простой процесс партнёрства'
  subtitle: 'Наш процесс партнёрства прост — он разработан, чтобы вы быстро начали продавать продукцию Aquafarer.'
  items:
    - title: 'Шаг 1. Подайте заявку'
      description: 'Заполните нашу форму заявки партнёра с профилем компании, целевым рынком и интересующими продуктами.'
    - title: 'Шаг 2. Проверка квалификации'
      description: 'Наша команда по партнёрству рассматривает заявку и связывается с вами в течение 3 рабочих дней для обсуждения возможностей.'
    - title: 'Шаг 3. Соглашение и настройка'
      description: 'Подпишите партнёрское соглашение, откройте аккаунт и получите партнёрские цены, маркетинговые материалы и образцы продукции.'
    - title: 'Шаг 4. Обучение и запуск'
      description: 'Обучение по продукту, поддержка продаж и маркетинговые материалы предоставлены. Вы готовы начать продавать.'
cta:
  title: 'Готовы стать партнёром Aquafarer?'
  subtitle: 'Подайте заявку на партнёрство, и наша команда ответит в течение 3 рабочих дней.'
  actions:
    - variant: primary
      text: Подать заявку на партнёрство
      href: /contact
    - text: Посмотреть наши продукты
      href: /products
