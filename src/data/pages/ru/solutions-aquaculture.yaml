content_challenge:
  tagline: Вызов
  title: Требования аквакультуры<br />Оборудование, устойчивое к соленой воде
  subtitle: Рыбные фермы, жемчужные фермы и океанские ранчо работают в самой химически агрессивной морской среде — длительном воздействии соленой воды, остатках топлива и кормов и постоянном ежедневном использовании.
  paragraphs:
    - Операции аквакультуры ведутся 365 дней в году в суровых прибрежных и морских условиях. Рабочие лодки, используемые для осмотра клеток, перевозки корма, обслуживания жемчужных линий и ремонта оборудования, постоянно подвергаются погружению в соленую воду, воздействию УФ и контакту с химическими веществами от топлива, рыбного корма и противообрастающих покрытий.
    - '**Коррозия является главным врагом** — Стандартное морское оборудование в таких условиях быстро выходит из строя. Подвесные моторы, рамы прицепов и фурнитура корпуса требуют постоянной замены. Операторам нужны лодки, построенные из коррозионностойких материалов, способные годами работать в этой среде без разрушения.'
    - '**Ежедневная надежность критически важна** — Сломавшаяся рабочая лодка означает сорванные графики кормления, задержки сбора урожая и дорогостоящие потери производства. Для жемчужных ферм один пропущенный день осмотра может обернуться значительным ущербом урожаю. Для рыбных ферм задержка кормления влияет на темпы роста и рентабельность.'
    - Лодки RIB для аквакультуры Paddle Board Overstock созданы с коррозионностойкой фурнитурой, сверхпрочными баллонами Hypalon и усиленными корпусами, специально разработанными для суровых условий рыбоводства, выращивания жемчуга и океанского животноводства.
content_solution:
  tagline: Наше решение
  title: Специально созданные надувные лодки<br />Для аквакультуры
  subtitle: Каждое рабочее судно для аквакультуры Paddle Board Overstock спроектировано так, чтобы выдерживать агрессивную среду соленой воды, обеспечивая при этом надежную ежедневную работу.
  list:
    - Баллоны Hypalon морского класса — превосходная стойкость к УФ, соленой воде, топливу и химическим веществам рыбного корма
    - Фурнитура из нержавеющей стали 316 по всей лодке — никакой ржавчины при длительном контакте с соленой водой
    - Усиленные привальные брусья и защита киля для многократного контакта с причалами и клетками
    - Самоотливная палуба для легкой мойки и слива после перевозки корма и сбора урожая
    - Конфигурация с плоской палубой для перевозки мешков корма, контейнеров для урожая и оборудования
    - Конфигурации подвесных моторов от 15 до 60 л.с. — оптимизированы под соотношение грузоподъемности и расхода топлива
    - Варианты окраски баллонов повышенной видимости для легкого обнаружения на больших площадях ферм
content_segments:
  tagline: Профили аквакультуры
  title: Решения для рабочих лодок<br />По типу аквакультуры
  subtitle: Различные предприятия аквакультуры предъявляют разные требования к рабочим лодкам — от небольших маневренных надувных лодок для проверки рыбных садков до устойчивых транспортных платформ для выращивания жемчуга и сверхмощных рабочих лодок для разведения рыбы в океане.
  items:
    - title: Рыбоводство
      subtitle: Осмотр клеток, транспортировка корма, поддержка сбора урожая
      description: 'Морские рыбоводные фермы используют садки в открытых прибрежных и морских районах. Рабочие лодки используются ежедневно для проверки клеточной сети, операций по кормлению, поддержки сбора урожая и технического обслуживания оборудования. Основной проблемой является коррозия: лодки постоянно подвергаются воздействию соленой воды, остатков рыбного корма и топлива. Надежная рабочая лодка имеет важное значение, поскольку пропуск кормления или задержка сбора урожая напрямую влияют на объем производства и прибыльность.'
      features:
        - 'Пакет для агрессивных сред: фурнитура из нержавеющей стали 316, компоненты из сплавов морского класса'
        - Плоская планировка палубы для транспортировки мешков корма и контейнеров для урожая
        - Самоотливная палуба для легкой промывки после работ
        - Баллоны Hypalon с химостойким покрытием для контакта с кормом и топливом
        - Усиленные привальные брусья для частого контакта с клетками и причалами
    - title: Производство жемчуга
      subtitle: Стабильный транспорт для проверки и сбора жемчуга
      description: Жемчужным фермам требуются стабильные и надежные рабочие суда для ежедневных перевозок между линиями добычи жемчуга, проверки устричных сетей и сбора урожая. Эти операции проводятся в отдаленных прибрежных районах с ограниченной инфраструктурой обслуживания. Лодка должна быть достаточно устойчивой, чтобы экипаж мог работать при проверке жемчужных линий, с удобной посадкой и достаточной палубой для перевозки собранных устриц, сетей и припасов. Надежность и простота обслуживания имеют решающее значение на удаленных фермах.
      features:
        - Стабильная конструкция корпуса для стоящего экипажа при осмотре жемчужных линий
        - Плоская палуба с нескользящим покрытием для безопасного передвижения экипажа
        - Низкий борт для легкого доступа к устричным сетям и сбору урожая
        - Простая конфигурация подвесного мотора для удобного обслуживания на месте
        - Коррозионностойкий комплект баллонов и фурнитуры для постоянного контакта с соленой водой
    - title: Океанское животноводство и улучшение морской среды
      subtitle: Перевозка молоди, обслуживание клеток, мониторинговая поддержка
      description: Операции по разведению океанских животных включают выпуск молоди в управляемую морскую среду, мониторинг роста и обслуживание структур по улучшению. Рабочие катера должны перевозить живую молодь в аэрированных контейнерах, иметь на борту оборудование для мониторинга и иметь доступ к мелководным прибрежным местам выпуска. Конструкция корпуса должна сочетать грузоподъемность с мелкой осадкой для доступа к пляжу и устью.
      features:
        - Место на палубе для аэрируемых контейнеров перевозки молоди и оборудования для мониторинга
        - Малая осадка для доступа к местам выпуска на пляжах и в устьях рек
        - Легкая высадка на берег — усиленный киль и защита носовой части
        - Точки крепления оборудования для мониторинговой электроники и пробоотборного снаряжения
        - Сверхпрочные баллоны Hypalon для долговечности в смешанных условиях песка и морской воды
