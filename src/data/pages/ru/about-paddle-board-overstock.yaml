hero:
  tagline: О компании
  title: О Paddle Board Overstock компании
  subtitle: С 2012 года мы предоставляем совершенно новые надувные SUP доски гребцам и небольшим ритейлерам в 50+ странах — избыток запасов, честное ценообразование и гарантия, которую мы действительно соблюдаем.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Совершенно новые надувные SUP доски
direct_answer: Paddle Board Overstock — это бренд оборудования для водных видов спорта, основанный в 2012 году и базирующийся в Вэйхае, Китай. Мы продаём совершенно новые надувные SUP доски из избыточных запасов — смесь излишков производства с собственной производственной базы и тщательно отобранных товаров с партнёрских заводов — напрямую для конечных гребцов и небольшим ритейлерам в 50+ странах. Каждая доска проходит 100% испытания под давлением, обеспечивается SUP двухлетней гарантией и отправляется экспрессом или морским транспортом.
tldr_points:
  - Основан в 2012 году, базируется в Вэйхае, Китай — одном из ключевых SUP производственных центров мира
  - 'Модель избыточных запасов: совершенно новые советы по ценам ниже розничных, без посредников'
  - 'Запасы — смешанные источники: избыточное производство с нашей базы плюс проверенный товар на заводе партнёра'
  - 50+ обслуженных стран, 99,3% прохождения итоговой инспекции, SUP 2-летняя гарантия
story_section:
  tagline: Наша история
  title: Почему мы продаём избыточный запас
  paragraphs:
    - Paddle Board Overstock Стартовал в 2012 году в Вэйхае, Китай — прибрежном городе провинции Шаньдун, который вырос в один из важнейших в мире центров производства надувных судов. SUP На этой базе мы более десяти лет производили надувные гребные доски и отправляли их по всему миру.
    - Along the way we noticed something that shapes everything we do today: Каждый производственный сезон оставляет после себя совершенно новые, отличные доски — излишки партий, отменённые заказы, цветовые варианты прошлого сезона. Тем временем независимые ритейлеры по всему миру оказались без оптовых продаж, потому что традиционные поставщики требовали заказы размером с контейнер.
    - Этот разрыв — наш бизнес. Продавая избыточный запас — излишки продукции на нашей базе в Вэйхае, плюс тщательно отобранные товары с партнерских фабрик — мы можем предлагать совершенно новые доски по ценам значительно ниже обычных розничных, в количествах, подходящих для одного гребца или заказа из пяти досок. Ничто не б/у в руках, ничто не является вторичным; это просто инвентарь, который заслуживает клиента, а не склад.
model_section:
  tagline: Наша бизнес-модель
  title: Как работает модель избыточных запасов
  items:
    - title: Совершенно новый, никогда не использовался
      description: Каждая плата, которую мы продаём, совершенно новая и неиспользована. Избыток — это избыток и избыток запасов — не возвраты, не восстановленные материалы, не вторичные запасы.
    - title: Смешанный инвентарь
      description: Наш запас объединяет избыточное производство с собственной производственной базы в Вэйхае с запасами, отобранными на наших заводах, на уровне того же качества. Источники неоднозначны; стандарты — нет.
    - title: Цены ниже розничного уровня
      description: Избыток запасов обходится дешевле в приобретение, поэтому покупка стоит дешевле. Нет завышенной цены, нет фальшивых скидок — просто честное ценообразование на реальные товары.
    - title: Оптовая торговля, дружелюбная к малому бизнесу
      description: Оптовая торговля начинается с 5 досок, а не с контейнеров. Мелкие розничные продавцы могут смешивать любые имеющиеся в наличии модели в одном заказе и выбрать экспресс или морской груз.
    - title: Прямая доставка
      description: Заказы отправляются прямо с нашей логистической базы в Вэйхай к вашей двери в 50+ странах — экспресс для образцов и небольших заказов, консолидированные морские грузы для оптовых.
quality_section:
  tagline: Качество и гарантия
  title: Качество каждой доски
  subtitle: Избыточные цены никогда не означали смягчение стандартов. Каждая плата — независимо от источника — проходит один и тот же процесс перед отправкой.
  items:
    - title: 100 % проверено под давлением
      description: Каждая доска накачивается воздухом и проходит проверку давления до 15 PSI перед отправкой. Ни одна доска не уходит без тестирования, независимо от того, откуда поступила на склад.
    - title: Перегрузочное тестирование до 1,25x
      description: Доски из наших производственных партий проходят выборочное тестирование выше номинального давления — выдерживаются при 1,25x рабочем давлении в течение 24–48 часов для проверки швов, клапанов и конструкции drop-stitch.
    - title: 99,3% проходят финальную инспекцию
      description: Наш процесс финальной инспекции пропускает 99,3% досок как свободные от дефектов — и небольшая часть, которая не проходит тест, никогда не попадает в наш избыточный склад.
    - title: 2-летняя SUP гарантия
      description: Каждая SUP доска имеет 2-летнюю SUP гарантию на производственные дефекты. Та же гарантия распространяется на каждого клиента во всех наших 50+ рынках.
