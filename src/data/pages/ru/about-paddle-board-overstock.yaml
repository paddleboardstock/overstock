team_section:
  tagline: Команда
  title: Люди, стоящие за досками
  description: Наша база в Вэйхай насчитывает команду по исследованию и разработке из 14+ человек, которая занимается материалами, конструкцией и производственными процессами. Вокруг них работает более широкая команда, которая отвечает за контроль качества, склад, логистику и поддержку, к которой вы обращаетесь, когда связываетесь с нами — одни и те же люди, независимо от того, покупаете ли вы одну доску или двадцать.
