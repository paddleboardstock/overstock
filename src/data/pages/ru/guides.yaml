hero:
  tagline: Путеводители
  title: Впервые в SUP?
  subtitle: Практические руководства, которые помогут вам выбрать, использовать и получать удовольствие от надувного снаряжения для водных видов спорта.
size_guide:
  tagline: Размер и характеристики
  title: Найдите правильный размер для ваших нужд
  desc: Сравните размеры продукта, весовую нагрузку и рекомендации по использованию. Нужен ли вам туристический SUP, компактный каяк или коммерческая надувная лодка — наше руководство по размерам поможет вам выбрать подходящий вариант.
  link_label: Полноразмерное руководство со характеристиками продукта →
  link: /size-guide
  cards:
    - title: SUP-доски
      desc: Выбирайте длину в зависимости от вашего веса и предполагаемого использования. Более широкие доски (32 дюйма и более) обеспечивают большую устойчивость. Более длинные доски (11–12 футов) лучше подходят для туров.
    - title: Каяки
      desc: Одиночные каяки (9 футов) для одиночных путешествий и рек. Байдарки-тандемы (12 футов) для двух гребцов или одного со снаряжением. Всегда проверяйте грузоподъемность.
    - title: Лодки и РИБы
      desc: Выбирайте длину в зависимости от количества пассажиров и использования. РИБы большего размера (4,5 м+) для морских и спасательных операций. Лодки меньшего размера (2,7 м) в качестве тендеров и рыболовных платформ.
