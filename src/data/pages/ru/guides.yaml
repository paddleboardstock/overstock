hero:
  tagline: Путеводители
  title: Впервые в SUP?
  subtitle: Практические руководства, которые помогут вам выбрать, использовать и получать удовольствие от надувного снаряжения для водных видов спорта.
size_guide:
  tagline: Размер и характеристики
  title: Найдите правильный размер для ваших нужд
  desc: Сравните размеры доски, грузоподъемность и рекомендуемое использование. Независимо от того, нужна ли вам стабильная универсальная доска или более быстрая туристическая форма — наше руководство по размерам поможет вам выбрать правильный вариант.
  link_label: Полноразмерное руководство со характеристиками продукта →
  link: /size-guide
  cards:
    - title: Универсальные SUP доски
      desc: Наши доски примерно 11 футов (шириной 32 дюйма) сочетают в себе устойчивость, скорость и вместимость. Шестидюймовый drop-stitch сердечник при 15 PSI держит палубу жесткой для гребцов любого уровня.
    - title: Ширина и устойчивость
      desc: Более широкие доски (32"+) обеспечивают большую устойчивость для начинающих, йоги и рыбалки. Толщина 6 дюймов добавляет жесткость и грузоподъемность для райдера и снаряжения.
    - title: Пакеты и аксессуары
      desc: Каждая доска поставляется как полный комплект — доска, туристический рюкзак, ручной насос, регулируемая весло, съемный плавник, спиральный поводок и ремонтный набор. Проверьте максимальную нагрузку для райдера с снаряжением.
