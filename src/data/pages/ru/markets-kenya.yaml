hero:
  tagline: Кения
  title: Оптовые SUP борды для<br />Кенийский бизнес
  subtitle: Диани, Ватаму, Момбаса и Найроби — операторы пляжей, курорты и ритейлеры, предлагающие совершенно новые доски с избытком из 5 квартир, смешанные модели.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Доски для оверстока для кенийских пляжных курортов и операторов
direct_answer: Paddle Board Overstock поставляет новые надувные доски для SUP кенийских предприятий — операторов пляжей и курортов на Диани, Ватаму, Ньяли и побережье вокруг Момбасы, а также ритейлерам и школам, охватывающим растущее сообщество гребцов в Найроби. Оптовые заказы начинаются с 5 досок с смешанными моделями в одной партии, отправляемых из Вэйхая, Китай, экспресс-авиаперевозками или объединённым морским грузом. Каждая доска проходит 100% испытания под давлением и покрывается SUP двухлетней гарантией.
tldr_points:
  - Оптовая покупка с 5 плат — смешанные модели, цены по общему объёму
  - Обслуживание пляжного туризма Кении в Индийском океане и дополнений к сафари-лоджам
  - Экспресс-авиаперевозки или консолидированные морские грузы из Вэйхая, Китай
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: SUP Кенийский рынок
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: Это развлечение на спокойной воде, удобное для гостей курорта, в школах кайтсерфинга без ветра и для гребле на закате над рифом.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: Лоджи и лагеря добавляют в меню активностей занятия по гребле. Между операторами пляжей, отелями, школами кайтсерфинга и дайвинга, расширяющими ассортимент, и небольшой, но растущей гребной сценой в Найроби, заказы небольшие и практичные — 5–15 досок, устойчивых, надёжных универсальных моделей с одним-двумя премиальными версиями для демонстрации.
  customer_types:
    - title: Операторы пляжей
      description: Операторы Diani, Watamu и Mombasa добавляют SUP аренду и уроки для туристов.
    - title: Курорты и сафари-пляжные лоджи
      description: Прибрежные курорты и лоджи добавляют SUP гостевые программы с компактными смешанными флотами.
    - title: Школы кайтсерфинга и дайвинга
      description: Существующие школы водных видов спорта расширяют своё предложение, занимаясь греблями в спокойной воде.
shipping_section:
  title: Корабль в Кению
  paragraphs:
    - Заказы отправляются из Вэйхая, Китай. Экспресс-авиаперевозки перевозят образцы и 1–3 бортовых заказа в аэропорт Джомо Кениата в Найроби и побережье; Консолидированные морские грузовые перевозки обслуживают 5–20 оптовых заказов через порт Момбаса. Оценки транзита для вашего пункта назначения включены в вашу смету.
    - Мы предоставляем коммерческие счета и оформление упаковочного списка, необходимые для оформления, с корректными HS-кодами и заявленной стоимостью. Импортные пошлины и налоги оплачиваются импортером по кенийским правилам.
  customs_note: Проверьте текущие пошлины и налоговое оформление спортивного оборудования с вашим клиринговым агентом перед заказом — тарифная структура Кении периодически меняется. Мы предоставляем полную и последовательную документацию для бесперебойного оформления.
faq_section:
  title: Часто задаваемые вопросы по Кении
  items:
    - q: Могут ли доски напрямую связываться с Диани или Ватаму?
      a: Котировки доставки от двери до двери охватывают прибрежные направления, с дальнейшей логистикой из аэропорта прибытия или порта Момбасы. Укажите своё точное местоположение в запросе, и мы укажем цену конкретно.
    - q: Как выглядит стартовый заказ для оператора пляжа?
      a: 'Обычно 5–10 плат: стабильные универсальные модели для туристических уроков и проката, плюс одна-две премиальные версии для демонстрации. Смешанные модели, одна партия, цена по общему количеству.'
    - q: Подходят ли доски для тёплой лагуны и рифовой воды?
      a: Да — спокойные, тёплые, мелководные условия — именно то, для чего предназначены универсальные надувные SUPs, а гибкий плавник и конструкция drop-stitch хорошо справляются с посадками на песок и риф.
    - q: Как рассчитываются перевозки в Кению?
      a: Экспресс-перевозка воздушным транспортом в Найроби или на побережье для образцов и небольших заказов; консолидированные морские перевозки в Момбасу для оптовых партий. Оба варианта указаны в вашей смете с примерными сроками доставки.
