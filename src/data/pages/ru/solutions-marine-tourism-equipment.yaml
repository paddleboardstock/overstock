content_challenge:
  tagline: Вызов
  title: Морской туризм требует<br />Надежных, готовых к перевозке пассажиров судов
  subtitle: Туристическим операторам нужны суда, способные выполнять ежедневные пассажирские перевозки, меняющиеся морские условия и высокие ожидания гостей, сохраняя при этом низкие эксплуатационные расходы и рентабельность операций.
  paragraphs:
    - Операторы островного туризма в таких местах, как Мальдивы, Филиппины, Индонезия и Таиланд, ежедневно организуют пассажирские трансферы, поездки для подводного плавания и морские экскурсии. Их лодки работают более 300 дней в году в морской воде с минимальными простоями на техническое обслуживание.
    - '**Трансфер на остров** требует быстрого и комфортабельного пассажирского транспорта между курортами, аэропортами и местами для дайвинга. Пассажиры ожидают плавной езды, легкой посадки и защиты от солнца и брызг. Медленная или неудобная лодка напрямую влияет на удовлетворенность гостей и количество повторных бронирований.'
    - '**Операторам наблюдения за китами и дельфинами** нужны лодки, которые могут быстро добраться до дикой природы, иметь устойчивые смотровые площадки и работать тихо, чтобы не беспокоить морскую жизнь. Скорость, стабильность и маневренность имеют решающее значение — пассажиры ожидают близких встреч, не испытывая при этом морской болезни.'
    - '**Компании, занимающиеся приключенческим туризмом**, проводят исследовательские туры по побережью, экскурсии в пещеры и знакомство с морской дикой природой. Их лодки плавают в самых разных условиях — от открытого океана до мелких бухт — и требуют универсальной конструкции корпуса и надежной конструкции.'
    - Во всех сегментах главными приоритетами являются устойчивость к коррозии, топливная экономичность и комфорт пассажиров. Лодка, которая выходит из строя или требует частого ремонта, означает потерю дохода, отмену туров и испорченную репутацию.
content_solution:
  tagline: Наше решение
  title: Туристические надувные лодки<br />и оборудование для флота
  subtitle: Aquafarer предоставляет как коммерческие лодки RIB для пассажирских перевозок, так и оборудование флота (SUP, каяки, надувные лодки) для программ курортной деятельности — все от одного поставщика.
  list:
    - Коммерческие пассажирские надувные лодки длиной от 4,8 до 8 метров, предназначенные для трансфера по островам, подводного плавания и наблюдения за дикой природой.
    - Комфортные сиденья со спинками и солнцезащитным козырьком — комфорт пассажиров на протяжении 1-2-часовой экскурсии.
    - Широкая ширина и корпус deep-V для устойчивости — уменьшают морскую болезнь и повышают уверенность пассажиров.
    - Тихий двигатель для наблюдения за дикой природой — минимальное беспокойство для морских животных
    - Лестница для дайвинга и платформа для купания — незаменимы для подводного плавания и плавательных экскурсий.
    - Индивидуальный брендинг и цветовые схемы — логотип вашей компании и окраска флота на каждом судне.
    - Цены на флот для оптовых заказов RIB — согласованные спецификации для операций с несколькими судами
    - SUP доски, каяки и надувные лодки для программ отдыха гостей курорта
    - Запасные части и техническая поддержка — минимизируйте время простоя в пиковые туристические сезоны.
content_segments:
  tagline: Туристические сегменты
  title: Решения для морского туризма<br />По типу деятельности
  subtitle: Различные туристические операции требуют разных конфигураций лодок. Aquafarer соответствует правильному RIB для вашего конкретного приложения.
  items:
    - title: Островные трансферные операторы
      subtitle: Мальдивы, Филиппины, Индонезия, Таиланд — ежедневный гостевой транспорт
      description: Операторы островного туризма в Юго-Восточной Азии и на Мальдивах осуществляют ежедневные пассажирские перевозки между аэропортами, курортами и местами для дайвинга — часто более 300 дней в году. Лодка является основой впечатлений гостей. Поломка означает застрявшие гости, отмену бронирования и репутационный ущерб. Этим операторам нужны лодки, которые выдерживают частое использование в отдаленных местах, где техническая поддержка ограничена, а запасные части трудно найти.
      features:
        - Строительство коммерческого уровня, рассчитанное на 300+ рабочих дней в году.
        - Комфортное сиденье со спинкой для 8-16 пассажиров.
        - T-top или солнцезащитный козырек Bimini для защиты от тропического солнца и брызг.
        - Широкая посадочная платформа для удобного доступа гостей с багажом
        - Сухие отсеки для хранения сумок гостей и курортных принадлежностей
        - Экономичный 4-тактный подвесной двигатель — низкие эксплуатационные расходы за поездку
        - Сверхпрочные трубки Hypalon со сроком службы 5–8 лет в тропических условиях.
        - Удобная в обслуживании конструкция — доступные компоненты для удаленного обслуживания.
    - title: Операторы по наблюдению за китами
      subtitle: Возможность работы в море, скорость до смотровых площадок, устойчивая платформа
      description: Наблюдение за китами — это сезонный, но очень ценный сегмент туризма, работающий в таких регионах, как Херви-Бей (Австралия), Кайкоура (Новая Зеландия), Нижняя Калифорния (Мексика) и Азорские острова. Операторы должны быстро добраться до прибрежных зон наблюдения до того, как киты нырнут или двинутся дальше, поддерживать устойчивую платформу в течение длительных периодов наблюдения и действовать тихо, чтобы не беспокоить морских млекопитающих. Комфорт пассажиров во время 2-4-часовых туров напрямую влияет на отзывы и повторные бронирования. Медленная или нестабильная лодка означает пропущенные наблюдения и возврат средств за туры.
      features:
        - Конфигурации 7-10 м RIB для работы в открытом море
        - Тихий 4-тактный подвесной двигатель — минимальный шум и вибрация.
        - Корпус с глубоким V-образным вырезом и превосходной устойчивостью в состоянии покоя — удобная смотровая площадка.
        - Носовая смотровая площадка с поручнями для фотосъемки гостей
        - Полная защита от атмосферных воздействий — T-top или закрытая консоль для морских условий.
        - Эргономичные сиденья, рассчитанные на комфортную экскурсию продолжительностью 2–4 часа.
        - Материалы морского класса для длительного воздействия соленой воды и устойчивости к ультрафиолетовому излучению.
    - title: Операторы по наблюдению за дельфинами
      subtitle: Быстрое преследование, вместимость нескольких пассажиров, бесшумный подход
      description: 'Операторам наблюдения за дельфинами нужен другой баланс возможностей. Дельфины быстрее и игривее, чем киты, и им нужны лодки, которые могут быстро ускоряться, точно маневрировать и приближаться к стадам, не пугая их. Эти туры обычно перевозят больше пассажиров за поездку и курсируют ближе к берегу. Тихая работа имеет решающее значение: дельфины, привыкшие к громкому звуку двигателей, будут избегать лодок, что снизит эффективность наблюдения. Операторам также нужны надежные суда для ежедневных многократных рейсов в пиковые туристические сезоны.'
      features:
        - 5,5–8 м RIB для маневренности, скорости и доступа на мелководье.
        - Быстрое ускорение для достижения активных стад дельфинов.
        - Тихий выхлоп и корпус с низкой вибрацией для близкого подхода.
        - Стабильная платформа в состоянии покоя для просмотра гостей и фотографирования
        - Высокая пассажировместимость (10-18 человек) для туров в пик сезона.
        - Зона отдыха на носу для наблюдения за дельфинами у воды
        - Мелкая осадка для прибрежных и заливных операций.
    - title: Приключенческий и экологический туризм
      subtitle: Исследование побережья, туры по пещерам, встречи с дикой природой
      description: 'Операторы приключенческого туризма путешествуют по разнообразным средам: переходы через открытый океан, исследование мелководных лагун, доступ к прибрежным пещерам и встречи с морской дикой природой. Их лодкам нужна универсальность, чтобы справляться с различными морскими условиями, долговечность, чтобы выдерживать использование в удаленных местах, и небольшая осадка для доступа к защищенным бухтам и пристаням к пляжам. Надежность оборудования имеет первостепенное значение — поломка в удаленном месте может испортить тур и подвергнуть опасности гостей.'
      features:
        - Корпус с мелкой осадкой для доступа к лагуне, пещере и пляжу.
        - Усиленный корпус и трубы Hypalon для долговечности в смешанной среде.
        - Гибкое размещение — можно реконфигурировать для разных типов туров и размеров групп.
        - Точки крепления оборудования для фототехники и специализированного оборудования
        - Возможность легкой посадки на пляж — усиленная защита киля и трубы
        - Защита от атмосферных воздействий для комфорта гостей во время длительных туров
    - title: Парки курортной деятельности
      subtitle: Полные программы водных видов спорта для гостей — РИБы, SUP, каяки, безопасность.
      description: Курортам, предлагающим водные виды спорта в рамках отдыха гостей, нужен автопарк, в котором сочетаются разнообразие, долговечность и презентация бренда. Флот обычно включает в себя надувные лодки для гостевых экскурсий и трансферов, SUP и каяки для самостоятельного исследования, а также надувные лодки для групповых туров по подводному плаванию. Управление смешанными типами оборудования в зависимости от сезонного количества гостей требует стабильного качества, простоты обслуживания и единого бренда. Поломка или изношенное оборудование напрямую влияет на отзывы гостей и доходы.
      features:
        - RIB тендеры на гостевые экскурсии, трансферы и снорклинг-путешествия
        - SUP доски и каяки для самостоятельного отдыха гостей
        - Надувные лодки для групповых туров и подводного плавания от пляжа до рифа.
        - Полный индивидуальный брендинг всего оборудования — единая презентация курорта
        - 'Пакет защитного оборудования: спасательные жилеты, свистки, средства первой помощи, буйковые тросы.'
        - Учебные материалы для персонала по обращению с оборудованием и безопасности гостей
