breadcrumb: Производитель OEM/ODM
tldr:
  summary: Aquafarer — производитель OEM/ODM, работающий напрямую от завода. Производственная площадка 12 000 м² с сертификатом ISO 9001:2015, годовой выпуск 15 000 единиц, соответствие CE/BSCI/REACH/UKCA, низкие MOQ от 2-10 единиц.
  points:
    - Завод в Циндао площадью 12 000 м² с сертификатом ISO 9001:2015
    - Годовая мощность 15 000 единиц, 200-300 квалифицированных рабочих
    - Соответствие CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Низкие MOQ: 2-5 единиц (RIB), 5-10 единиц (SUP) для стандартных моделей'
    - Экспорт более чем в 50 стран, отгрузка FOB Циндао
trust_badges:
  badges:
    - icon: ⭐
      title: Сертификат ISO 9001:2015
      desc: Система менеджмента качества, проверенная SGS на всех производственных линиях.
      variant: cert
    - icon: ⭐
      title: Соответствие CE и UKCA
      desc: Полное соответствие директиве ЕС 2013/53/EU и британским требованиям маркировки.
      variant: cert
    - icon: ⭐
      title: Социальный аудит BSCI
      desc: Проверенная этичная организация труда и стандарты на рабочих местах.
      variant: standard
    - icon: ⭐
      title: Низкие MOQ от 2 единиц
      desc: 'Стандартные модели RIB от 2-5 единиц, SUP от 5-10 единиц. Индивидуальная пресс-форма: 200+.'
      variant: standard
process_section:
  eyebrow: Наш процесс
  title: Полный цикл работы OEM/ODM
  subtitle: От технического задания до загрузки контейнера — шесть шагов к вашему надувному судну под собственным брендом.
  steps:
    - step: '01'
      title: Спецификация и техническое задание
      desc: Отправьте нам целевые спецификации, чертежи CAD или референс-продукт. Наша инженерная команда проверяет материалы, размеры и требования соответствия (CE, BSCI) перед расчётом стоимости.
    - step: '02'
      title: 3D-прототипирование пресс-форм
      desc: Мы проектируем и изготавливаем на ЧПУ индивидуальные пресс-формы для SUP-бордов, корпусов каяков и компонентов RIB. Опытные образцы изготавливаются в течение 15-20 рабочих дней на ваше утверждение.
    - step: '03'
      title: Выбор материалов и производство образцов
      desc: Выбирайте из военного ПВХ (0,9-1,2 мм), Hypalon CSM или тканей с drop-stitch-сердечником. Мы производим предсерийные образцы в цветах вашего бренда, с логотипом и упаковкой для финального согласования.
    - step: '04'
      title: Заводской аудит CE и соответствие
      desc: Каждый заказ OEM включает комплект документов соответствия — декларацию соответствия CE, записи прослеживаемости ISO 9001, отчёт о социальном соответствии BSCI и декларации по материалам REACH.
    - step: '05'
      title: Серийное производство и пооперационный контроль
      desc: Производственные партии проходят наш 100-пунктовый чек-лист качества. Каждое изделие проходит 24-часовые испытания на удержание давления, тесты на отслаивание швов и визуальный контроль перед упаковкой.
    - step: '06'
      title: Логистика FOB Циндао и отгрузка
      desc: Готовая продукция паллетируется, упаковывается в термоусадочную плёнку и загружается в контейнеры в порту Циндао. Мы оформляем всю экспортную документацию, таможенное сопровождение и предоставляем отслеживание груза в реальном времени.
capabilities_section:
  eyebrow: Производственные возможности
  title: Что мы производим
  subtitle: Шесть ключевых производственных компетенций для глобальных B2B-партнёров.
  items:
    - title: Производство SUP-бордов drop-stitch
      desc: Ламинация drop-stitch-сердечника по всей длине для жёстких SUP-бордов высокого давления (15-20 PSI). Индивидуальные длина, ширина, толщина, профиль рокера и графический дизайн.
    - title: Производство надувных лодок из ПВХ
      desc: 'Лодки из ПВХ, сваренные высокочастотной сваркой: динги, тендеры и спортивные лодки. Множество конфигураций баллонов, варианты днища (слани, надувное, складное) и интеграция аксессуаров.'
    - title: Изготовление RIB из Hypalon
      desc: Баллоны из Hypalon CSM коммерческого класса, приклеенные к стеклопластиковым или алюминиевым корпусам с глубоким V. Длины от 3,3 до 6,0 м для патрульных, спасательных, туристических и дайвинг-операций.
    - title: Private label и индивидуальный брендинг
      desc: 'Полный сервис private label: нанесение логотипа термопереносом или шелкографией, брендированная упаковка (розничные коробки, сумки для переноски), инструкции на вашем языке и регистрация штрихкодов/UPC.'
    - title: Проектирование пресс-форм и оснастки
      desc: Собственная инженерная команда 3D CAD/CAM. Мы проектируем и изготавливаем индивидуальные алюминиевые и композитные пресс-формы для уникальных форм корпусов, конфигураций палубы и креплений аксессуаров.
    - title: Аксессуары OEM и комплектация
      desc: Спасательные жилеты (CE 12402), насосы двойного действия, весла из карбона/нейлона, ремкомплекты, сумки для переноски и лиши. Полная комплектация и упаковка наборов для готовой к продаже подачи.
experience_section:
  eyebrow: Реальный опыт
  title: Партнёрства, создавшие бренды
  subtitle: Реальные истории брендов и организаций, выбравших Aquafarer для производства OEM/ODM.
  stories:
    - quote: Мы пришли в Aquafarer с эскизом на салфетке и списком требований. Восемь месяцев спустя у нас был готовый к производству продукт, прошедший сертификацию CE с первой попытки.
      narrative: Европейский стартап с новаторским дизайном SUP обратился в Aquafarer за производством ODM. Команда R&D Aquafarer провела концепт через CAD-проектирование, прочностной анализ FEA, гидродинамическое моделирование, создание пресс-формы, изготовление прототипа и производственную оснастку. Основатель стартапа трижды приезжал в Циндао в ходе процесса. Итоговый продукт прошёл сертификацию CE без каких-либо доработок — результат, который основатель объясняет тем, что инженерная команда Aquafarer с самого начала понимала европейские нормативные требования.
      context: Запуск европейского SUP-бренда, 2023-2024
      source: Основатель бренда
    - quote: Уровень защиты NDA и безопасности интеллектуальной собственности в Aquafarer даёт нам уверенность делиться своими патентованными разработками. Они относятся к нашей ИС как к собственной.
      narrative: Американская компания морского оборудования с запатентованной технологией клапанов искала производственного партнёра, способного защитить её ИС при серийном производстве. Проведя аудит пяти китайских производителей, она выбрала Aquafarer благодаря протоколам защиты ИС завода, безопасному обращению с файлами проектов и готовности подписывать строгие NDA. Партнёрство выпустило три продуктовые линейки за четыре года без единого инцидента, связанного с ИС.
      context: Американская компания морского оборудования, партнёрство OEM с 2021 года
      source: Вице-президент по операциям
