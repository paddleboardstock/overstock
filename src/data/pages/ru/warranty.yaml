    <h2>Что покрывается</h2>
    <h3>Drop-Stitch Структура сердечника и палубы (2 года)</h3>
    <p>Внутренняя drop-stitch сердцевина и внешняя конструкция платы защищены от производственных дефектов, которые снижают способность платы поддерживать рабочую надуваемость и жёсткость.</p>

    <h3>Строительство рельсов и пластов (2 года)</h3>
    <p>Швы и трёхслойные рельсовые ленты, соединённые во время производства, гарантированы на наличие производственных дефектов, приводящих к значительной утечке воздуха через шв. Периодические проверки и поддержание соответствующих давлений надувки являются условиями покрытия.</p>

    <h3>Функциональность клапана надувки (2 года)</h3>
    <p>Клапаны надува воздуха, изначально установленные Paddle Board Overstock компанией, гарантированы на наличие производственных дефектов в материалах или изготовлении, которые мешают клапану удерживать воздух по конструкции.</p>

    <h3>Включённые аксессуары (2 года)</h3>
    <p>Насос, регулируемое весло, поводок, съемный стабилизатор и другие компоненты, входящие в комплект доски, гарантированы на наличие дефектов в материалах и изготовлении.</p>

    <h2>Что не охватывается</h2>
    <ul>
      <li>Косметические недостатки, такие как изменение цвета, пятна, выцветание, мел или любые изменения внешнего вида</li>
      <li>Проколы, порезы, разрывы, разрывы или другие физические повреждения</li>
      <li>Царапины, трещины, стирания, царапины или разрушение из-за трения или контакта</li>
      <li>Деградация из-за UV воздействия света, воздействия выветривания или атмосферных условий</li>
      <li>Повреждения от контакта с растворителями, кислотами, щелочью или химикатами</li>
      <li>Повреждения вследствие небрежности, неправильного использования, злоупотребления, несчастного случая или нормального износа</li>
      <li>Повреждения от ударов, нагрузки, неправильной поддержки или транспортировки</li>
      <li>Повреждения вследствие неправильной накачки/спуска или использования неутвержденных устройств для накачки</li>
      <li>Оборудование, компоненты или системы третьих сторон (покрываются их соответствующими производителями)</li>
    </ul>

    <h2>Обязанности и средства защиты производителя</h2>
    <p>Paddle Board Overstock несет единственную и исключительную обязанность по ремонту или замене, по выбору Paddle Board Overstock, любого компонента, признанного дефектным по материалам или изготовлению и покрытого этой гарантией. Ремонт или замена выполняются Paddle Board Overstock или его назначенным сервисным центром. Компоненты, отремонтированные или замененные, гарантируются только на оставшуюся часть первоначального гарантийного срока.</p>

    <h2>Условия гарантии</h2>
    <ul>
      <li><strong>Обслуживание:</strong>Продукт должен обслуживаться в соответствии с опубликованными руководствами Paddle Board Overstock, включая периодическую проверку и поддержание соответствующего давления воздуха.</li>
      <li><strong>Сотрудничество:</strong>Покупатель должен полностью и своевременно сотрудничать с Paddle Board Overstock по всем вопросам, связанным с гарантийными требованиями.</li>
      <li><strong>Первоначальный покупатель:</strong>Эта гарантия предоставляется исключительно первоначальному конечному покупателю и не подлежит передаче.</li>
    </ul>

    <h2>Коммерческое использование</h2>
    <p>Если продукт используется для коммерческих, арендных или флотовых целей, срок гарантии на все компоненты сокращается до одного (1) года с даты первоначальной покупки. Использование в гонках, соревнованиях по скорости или выносливости немедленно и безвозвратно аннулирует гарантию полностью.</p>

    <h2>Как подать гарантийный иск</h2>
    <p>Свяжитесь с Paddle Board Overstock с доказательством покупки и подробным описанием проблемы. Paddle Board Overstock рассмотрит запрос и предоставит инструкции по проверке и обслуживанию.</p>
    <p>По вопросам гарантийного обслуживания обращайтесь через нашу<a href="/contact" class="text-sky-600 underline">страницу контактов</a>с номером вашего заказа и данными о продукте.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Это гарантийное заявление является кратким изложением полной Ограниченной Гарантии производителя Paddle Board Overstock. Полный юридический документ о гарантии регулирует все условия и положения гарантии. Спецификации могут изменяться без уведомления. Paddle Board Overstock является фабричной торговой маркой Paddle Board Overstock Weihai Manufacturing Hub.
