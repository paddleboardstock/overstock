          <p class="text-sm text-gray-600 mt-1">Drop-stitch Структура сердечника и палубы</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 года</h3>
          <p class="text-sm text-gray-600 mt-1">Строительство рельсов и пластов</p>
