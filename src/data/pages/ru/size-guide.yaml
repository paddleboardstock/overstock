how_to_choose:
  title: Как выбрать правильный размер
  cards:
    - title: Универсальные SUP доски
      description: Наши универсальные доски около 11 футов (шириной 32 дюйма, толщиной 6 дюймов drop-stitch) сочетают стабильность, скорость и вместимость. Подбирайте объем доски в зависимости от вашего веса — более тяжелым гребцам нужен больший объем.
    - title: Ширина и толщина
      description: Широкие доски (32"+) обеспечивают большую стабильность для новичков, йоги и рыбалки. Толщина 6 дюймов на 15 PSI сохраняет жесткость палубы под гребцом и снаряжением.
    - title: Пакеты и аксессуары
      description: Каждая доска поставляется как полный комплект — доска, туристический рюкзак, ручной насос, регулируемая весло, съемный плавник, спиральный поводок и ремонтный набор. Проверьте максимальную нагрузку для райдера с снаряжением.
