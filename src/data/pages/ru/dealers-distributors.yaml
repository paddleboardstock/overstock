content_benefits:
  tagline: Преимущества партнерства
  title: Почему дистрибьюторы<br />выбирают Paddle Board Overstock
  subtitle: Партнерство, предназначенное для морских дистрибьюторов, которым необходимы надежные поставки, конкурентоспособная прибыль и профессиональная поддержка.
  items:
    - title: Охрана территории
      description: Эксклюзивные или полуэксклюзивные права на территории для квалифицированных дистрибьюторов. Картирование рынка и управление конфликтами каналов для защиты ваших инвестиций в создание бренда Paddle Board Overstock в вашем регионе.
      icon: tabler:map-pin
    - title: Конкурентные оптовые цены
      description: Многоуровневое ценообразование на основе годовых обязательств по объему. Структура ценообразования, защищающая прибыль, с предварительными ценовыми гарантиями и прозрачной разбивкой затрат (на условиях FOB Циндао).
      icon: tabler:currency-dollar
    - title: Комплект маркетинговой поддержки
      description: Профессиональные фотографии продуктов, спецификации, шаблоны документации о соответствии, контент для социальных сетей и совместные маркетинговые материалы. Ежегодно обновляется с появлением новых продуктов.
      icon: tabler:photo
    - title: Техническое обучение
      description: Обучение по продукту для вашего отдела продаж (виртуальное или на месте), обучение техническому обслуживанию и ремонту для ваших технических специалистов, а также ответы на часто задаваемые вопросы для клиентов и руководства по устранению неполадок.
      icon: tabler:school
    - title: Запасные части и послепродажное обслуживание
      description: Специализированная поставка запасных частей с приоритетной доставкой. Для быстрого выполнения заказа доступны сменные секции труб, клапаны, ребра и ремонтные комплекты. Поддержка обработки гарантийных претензий.
      icon: tabler:tool
    - title: Соответствующая документация
      description: 'Полный пакет документации, соответствующий вашему рынку: CE DoC, данные заводской таблички, руководства пользователя и поддержка при регистрации в регулирующих органах. Устраняет ваше бремя соблюдения требований.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Что мы ищем
  title: Дистрибьютор<br />Требования
  subtitle: Мы ищем партнеров, которые могут профессионально представлять и поддерживать продукцию Paddle Board Overstock на своей территории.
  items:
    - title: Знание территории и рынка
      description: Установленное присутствие на рынке морских, водных видов спорта или отдыха на природе. Понимание местных правил, потребительских предпочтений и каналов сбыта продукции для гидроциклов.
      icon: tabler:target
    - title: Опыт работы в отрасли
      description: Минимум 2 года опыта продаж морского, уличного или спортивного оборудования. Подтвержденный опыт работы с международными брендами и оптовыми операциями B2B.
      icon: tabler:briefcase
    - title: Выставочный зал или склад
      description: Физическое помещение для демонстрации продукции, хранения запасов и обслуживания клиентов. Возможность поддерживать склад демо-блоков и запасных частей на своей территории.
      icon: tabler:building-store
    - title: Приверженность стандартам бренда
      description: Готовность поддерживать стандарты представления бренда Paddle Board Overstock, обеспечивать поддержку клиентов в соответствии с нашими протоколами обслуживания и участвовать в ежегодных обновлениях обучения по продуктам.
      icon: tabler:star
content_process:
  tagline: Процесс подачи заявки
  title: 4-этапный дилерский процесс<br />Подача заявки
  subtitle: От первоначального запроса до первой поставки — простой процесс адаптации.
  steps:
    - number: '01'
      title: Первоначальный запрос и квалификация
      description: Подайте заявку на дистрибьюторство, указав подробную информацию о компании, интересующую территорию, текущие линейки продуктов и оценки годовых объемов. Мы рассматриваем в течение 5 рабочих дней.
      timeline: 5 дней
    - number: '02'
      title: Обзор бизнеса и условия
      description: Виртуальная встреча для обсуждения территориальной стратегии, ценовых уровней и условий партнерства. Изучите требования к документации по обеспечению соответствия для вашего рынка. Подписание NDA при необходимости.
      timeline: 1-2 недели
    - number: '03'
      title: Заказ образца и оценка
      description: Разместите первоначальный заказ образца (2–5 единиц) по ценам дистрибьютора для оценки рынка и обучения команды. В комплект входит полная документация о соответствии и подготовка к демонстрации.
      timeline: 30-45 дней
    - number: '04'
      title: Запуск и поддержка партнерства
      description: Первый контейнерный заказ с активированной охраной территории. Доставлен маркетинговый комплект, обучена команда продаж и назначен специальный менеджер по работе с клиентами. Постоянные ежеквартальные обзоры бизнеса.
      timeline: Непрерывный
content_application_docs:
  tagline: Документы для заявки
  title: Документы, необходимые<br />для заявки дилера
  subtitle: Чтобы подать заявку на дилерство Paddle Board Overstock, подготовьте, пожалуйста, следующие документы и информацию для нашей команды по рассмотрению.
  items:
    - title: Свидетельство о регистрации компании
      description: Действующий документ о регистрации компании с указанием юридического наименования, зарегистрированного адреса и сферы деятельности, включающей дистрибуцию морского, спортивного или аутдор-оборудования.
      icon: tabler:file-text
    - title: План покрытия территории
      description: Интересующая географическая территория, существующая розничная или дистрибьюторская сеть, целевые сегменты клиентов и предлагаемый годовой объём по категориям продукции (RIB, SUP, каяки).
      icon: tabler:map
    - title: Возможности шоурума или склада
      description: Физическое помещение для демонстрации продукции, хранения запасов и обслуживания клиентов. Фото или планировки, показывающие демо-зону и складские мощности для запчастей.
      icon: tabler:building
    - title: Подтверждение финансовой состоятельности
      description: 'Банковская справка или финансовая отчётность, подтверждающая способность разместить первый контейнерный заказ и поддерживать склад. Минимальный первый заказ: один 20-футовый контейнер (10–20 единиц, смешанные модели).'
      icon: tabler:coin
    - title: Возможности послепродажного обслуживания
      description: Сервисные техники, обученные или готовые к обучению обслуживанию и ремонту надувных лодок. Возможность обработки гарантийных обращений и обязательство по складу запчастей.
      icon: tabler:tool
    - title: Референции по прежним брендам
      description: Список морских или спортивных брендов, которые вы распространяете сейчас или распространяли ранее. Контактные референции доступны по взаимному согласию. Стартапы без опыта дистрибуции могут пройти отбор при более весомых финансовых обязательствах.
      icon: tabler:users
faq:
  title: Дилерская программа — часто задаваемые вопросы
  questions:
    - q: Какой минимальный объем заказа для дистрибьюторов?
      a: Минимальный объем заказа для дистрибьюторов начинается с 10–20 единиц на заказ, с возможностью гибкого выбора для смешанных моделей (надувные лодки, SUP). Первоначальные заказы на образцы в количестве 2–5 единиц доступны по ценам дистрибьютора для оценки рынка.
    - q: Предлагаете ли вы эксклюзивные права на территорию?
      a: Эксклюзивные права на территорию доступны квалифицированным дистрибьюторам, которые выполняют ежегодные обязательства по объемам и поддерживают стандарты бренда. Для развивающихся рынков также доступны полуэксклюзивные и неэксклюзивные соглашения.
    - q: Какую маркетинговую поддержку вы предоставляете?
      a: Мы предоставляем комплексный маркетинговый комплект, включающий профессиональные фотографии продуктов, спецификации, шаблоны документации о соответствии, библиотеку контента для социальных сетей и совместные материалы. Ежегодно обновляется с появлением новых продуктов.
    - q: Как обрабатываются гарантийные претензии?
      a: 'Дистрибьюторы служат первым контактным лицом по гарантийным претензиям. Мы предоставляем четкие критерии гарантии, протоколы фотодокументации, а также быструю замену или оформление кредита. Условия гарантии: 5 лет, ограниченная на ткань/швы/корпус лодки; 2 года на SUP и аксессуары.'
    - q: Могу ли я продавать продукцию Paddle Board Overstock под своей торговой маркой?
      a: Да, через нашу программу OEM/ODM. Варианты частных торговых марок включают в себя индивидуальную графику на трубках, брендинг консоли, розничную упаковку и документацию о соответствии требованиям под вашим брендом. Подробную информацию см. на нашей странице услуг OEM/ODM.
    - q: Какая документация о соответствии включена в комплект поставки для дистрибьюторов?
      a: Каждая поставка включает в себя документ CE для конкретной модели, данные заводской таблички, руководства пользователя и транспортную документацию. Мы также предоставляем поддержку при регистрации в соответствии с нормативными требованиями на вашей территории и помогаем соблюдать любые местные требования.
