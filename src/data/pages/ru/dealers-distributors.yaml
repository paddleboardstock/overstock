hero:
  tagline: Дилерская программа
  title: Станьте дистрибьютором Paddle Board Overstock<br />
  subtitle: Станьте партнером сертифицированного CE производителя надувных лодок и надувных судов, обслуживающего более 50 стран. Защита территории, маркетинговая поддержка и конкурентоспособные цены для авторитетных морских дистрибьюторов.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Дилерская и дистрибьюторская программа Paddle Board Overstock
direct_answer: Paddle Board Overstock предлагает дилерское и дистрибьюторское партнерство с защитой территории, конкурентоспособными оптовыми ценами, комплектами маркетинговой поддержки и документацией полного соответствия (CE, ISO 9001, BSCI). Минимальный заказ начинается с 10-20 единиц на заказ со специальным управлением учетными записями.
