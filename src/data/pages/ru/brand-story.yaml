  title: 'Paddle Board Overstock — инжиниринг свободы на воде'
  subtitle: 'От прибрежной мастерской до глобального производителя морской техники — наш путь построен на твёрдом убеждении: суда должны быть спроектированы так, будто от них зависит многое. Потому что это действительно так.'
