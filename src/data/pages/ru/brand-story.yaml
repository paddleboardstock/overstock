content_founding:
  tagline: Начало
  title: 'Рождённые на набережной'
  subtitle: 'Paddle Board Overstock начался в прибрежной мастерской в Циндао с одной лодки и одного видения: создавать надувные суда, способные выдерживать реальные морские условия.'
  paragraphs:
    - 'В 2012 году наши основатели увидели пробел на рынке — большинство надувных лодок были либо доступными, но ненадёжными, либо качественными, но непомерно дорогими. Они верили, что есть место производителю, сочетающему и качество, и ценность.'
    - 'Первый корпус был собран вручную, испытан в местных водах и доработан на основе реальных отзывов рыбаков и небольших коммерческих операторов. Этот цикл — создавать, испытывать, слушать, улучшать — остаётся ядром нашей инженерной философии и сегодня.'
    - 'К 2015 году о нас узнали за пределами Циндао. Международные дистрибьюторы начали запрашивать образцы. То, что начиналось как местная мастерская, становилось глобальным поставщиком.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Ранний производственный цех Paddle Board Overstock
content_growth:
  tagline: Рост и инновации
  title: 'От мастерской до производства 12,000 м²'
  subtitle: 'Постоянные инвестиции в людей, оборудование и процессы превратили Paddle Board Overstock в современный производственный комплекс морской техники.'
  paragraphs:
    - 'Вместе с ростом спроса росло и наше производство. Мы выросли из небольшой мастерской в завод площадью 12,000 м² с отдельными линиями для лодок RIB, надувных лодок, SUP-досок и аксессуаров.'
    - 'Мы инвестировали в станки CNC-резки, высокочастотное сварочное оборудование, линии производства drop stitch и комплексные испытательные стенды — что позволяет нам контролировать каждый аспект качества.'
    - 'Сегодня наша команда из 200-300 человек включает морских инженеров, материаловедов, специалистов по контролю качества и опытных мастеров — многие из них работают в Paddle Board Overstock с первых дней.'
content_mission:
  tagline: Наша миссия
  title: 'Инжиниринг свободы на воде'
  subtitle: 'Каждый продукт Paddle Board Overstock создан, чтобы помогать людям исследовать, работать и жить на воде — надёжно, безопасно и доступно.'
  list:
    - 'Создавать суда, которые работают в реальных морских условиях — а не только на бумаге'
    - 'Выстраивать долгосрочные партнёрства с дистрибьюторами и брендами через надёжный сервис OEM/ODM'
    - 'Постоянно совершенствовать производственные процессы, чтобы давать больше ценности'
    - 'Поддерживать каждый продукт оригинальными запчастями и технической экспертизой'
cta:
  title: 'Готовы работать с производителем,<br />которому небезразлично качество?'
  subtitle: 'Свяжитесь с нашей командой, чтобы обсудить ваш проект OEM/ODM — без давления минимальным заказом, только честные рекомендации.'
  actions:
    - variant: primary
      text: Начать разговор
      href: /contact
    - text: Посмотреть нашу продукцию
