content_service_modules:
  tagline: Сервисные модули
  title: OEM/ODM Сервисные<br />Модули
  subtitle: Каждый проект сочетает в себе нужные сервисные модули. Не каждому проекту нужен каждый модуль — мы определяем только то, что требуется вашему проекту.
  items:
    - title: Инженерный обзор и технико-экономическое обоснование
      description: 'Оценка платформы корпуса, проверка конструктивной осуществимости, проверка остойчивости и плавучести, определение пути соответствия и подтверждение доступности материалов. Результат: технико-экономическое обоснование с рекомендациями «принимать/не применять».'
      icon: tabler:math-function
    - title: Дизайн и конфигурация
      description: 'Общий чертеж, компоновка палубы, конфигурация труб, расположение консоли и сидений, план установки оборудования и выбор цвета/материала. Результат: утвержденная GA и спецификация конфигурации.'
      icon: tabler:ruler
    - title: Образец и прототип
      description: Предварительный образец с утвержденными цветами, логотипом и указанными материалами для физического осмотра. Включает образец протокола утверждения, контрольный список проверок и процесс запроса на изменение.
      icon: tabler:3d-cube-sphere
    - title: Производство и контроль качества
      description: Массовое производство с контрольным списком контроля качества из 100 пунктов на единицу, внутрипроизводственными проверками, испытаниями под давлением (1,25x / 24–48 часов) и отслеживаемостью на уровне серийной продукции. CE/ISO документация, подготовленная параллельно.
      icon: tabler:clipboard-check
    - title: Брендинг и упаковка
      description: Нанесение логотипа под собственной торговой маркой, индивидуальная графика корпуса и труб, фирменная документация владельца, упаковка, готовая к розничной продаже или на паллетах, а также подготовка комплекта запасных частей.
      icon: tabler:palette
    - title: Экспорт и документация
      description: Экспортная упаковка, план загрузки контейнера, документация FOB/CIF/DDP, документы о соответствии требованиям для каждого рынка назначения и протокол связи после доставки.
      icon: tabler:world
content_risk_control:
  tagline: Контроль рисков и поставок
  title: Риски проекта и управление доставкой
  subtitle: Профессиональные OEM/ODM покупатели заботятся о контроле рисков не меньше, чем о качестве продукции. Вот как мы с этим справляемся.
  items:
    - title: Определение объема и владения
      description: 'Прежде чем начать разработку, мы определяем в письменной форме: объем настройки, требования к инструментам, критерии утверждения образцов, право собственности на чертежи и формы, а также обязанности по документации. Никакой двусмысленности относительно того, кто чем владеет.'
      icon: tabler:file-text
    - title: Процесс контроля изменений
      description: Все изменения спецификаций после подтверждения проекта следуют задокументированным процессом запроса на изменения с оценкой воздействия (стоимость, сроки, соответствие). Никакие несанкционированные модификации не поступают в производство.
      icon: tabler:arrows-diff
    - title: Гарантия целостности партии
      description: 50-я единица соответствует 1-му утвержденному образцу. Утвержденные спецификации замораживаются, параметры материалов и процессов фиксируются, а контрольные точки в процессе проверяют согласованность на протяжении всего производственного цикла.
      icon: tabler:repeat
    - title: Прозрачность доставки и мощности
      description: Сроки выполнения заказов указаны на основе фактической производственной мощности, уровня запасов материалов и текущей загрузки заказов, а не амбициозных целей. График производства с указанием контрольных дат предоставляется для каждого заказа.
      icon: tabler:calendar-stats

