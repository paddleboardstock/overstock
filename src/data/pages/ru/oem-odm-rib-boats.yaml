content_customization:
  tagline: Что можно настроить
  title: Настройка RIB<br />Опции
  subtitle: Каждый элемент лодки RIB может быть адаптирован к вашему применению, рынку и требованиям бренда.
  items:
    - title: Корпус и конструкция
      description: Длина корпуса (2,5–8,5 м), материал корпуса (стеклопластик или морской алюминий), цвет корпуса (гелькоут или окрашенный), профиль киля (глубокий V, средний V, плоский), тип транца (закрытый транец с кронштейном или колодцем) и усиление конструкции для требований к коммерческой нагрузке.
      icon: tabler:sailboat
    - title: Трубка и воротник
      description: Материал трубки (ПВХ 0,9–1,2 мм или гипалон/CSM толщиной 1,4–1,7 мм), диаметр трубки (40–55 см), количество камер (3–7), тип клапана (Halkey-Roberts, Leafield D7 или Boston), цвет трубки (стандартный или индивидуальный) и конфигурация конуса/конуса воротника.
      icon: tabler:circle
    - title: План колоды и консоли
      description: Центральная консоль, боковая консоль или рулевое управление с помощью румпеля. Расположение сидений (жокейские сиденья, многоместные сиденья, сиденья с подушками). Покрытие палубы (пена EVA под тик, нескользящая краска или голый стеклопластик). Точки крепления оборудования, поручни и положения D-образных колец.
      icon: tabler:layout-dashboard
    - title: Электрика и навигация
      description: Навигационные огни (светодиоды), система трюмной помпы, управление аккумулятором, установка УКВ-радио, крепление GPS/картплоттера, USB-порты для зарядки и настройка панели переключателей.
      icon: tabler:bolt
    - title: Брендинг и графика
      description: Графика корпуса и труб (трафаретная печать, теплопередача, цифровая УФ-печать), размещение логотипа, индивидуальные цветовые схемы, идентификационная маркировка и индивидуальная документация владельца с вашим брендом.
      icon: tabler:palette
    - title: Безопасность и соответствие
      description: Категория конструкции (A/B/C/D на каждое УЗО), система пожаротушения, спецификация топливной системы (переносной бак, стационарный бак, подпалубный бак) и пакет документации соответствия для вашего целевого рынка.
      icon: tabler:shield
content_applications:
  tagline: Конфигурации приложения
  title: Конфигурации RIB<br />По применению
  subtitle: Разные миссии требуют разных конфигураций. Ниже приведены проверенные настройки для наиболее распространенных приложений RIB.
  items:
    - title: Спасение и патрулирование
      description: Корпус с глубоким V-образным вырезом, трубы из гипалона, самовысвобождающаяся палуба, сиденья с боковой поддержкой, поручни, навигационные огни и прочные D-образные кольца. Категория конструкции УЗО B или C. Огнестойкая топливная система и электрооборудование коммерческого класса.
      icon: tabler:lifebuoy
    - title: Дайвинг-поддержка
      description: Широкая балка, задняя лестница для посадки, места для крепления баков, дополнительные D-образные кольца, крепление для флажка, усиленный транец для двух подвесных двигателей и нескользящее покрытие всей палубы из этиленвинилацетата.
      icon: tabler:mask
    - title: Туризм и Коммерция
      description: Компоновка, сертифицированная для пассажиров, со многоместными сиденьями, навесом от солнца/бимини, поручнями, сухим хранилищем и двойной аккумуляторной системой. УЗО категории C. Предназначено для эксплуатации курортного и чартерного флота.
      icon: tabler:beach
    - title: Рыбалка
      description: Открытая планировка палубы, места для держателей удочек, отсек для живой наживки, крепление для эхолота, крепление для троллингового мотора, усиленный транец и переносная топливная система. Варианты центральной или боковой консоли.
      icon: tabler:fish
    - title: Тендер для отдыха и яхт
      description: Легкий корпус, трубы из ПВХ, удобное сиденье, телескопический румпель или компактная консоль, точки подъема шлюпбалки и съемный топливный бак. УЗО категории C или D.
      icon: tabler:sailboat
    - title: Профессиональная рабочая лодка
      description: Вариант алюминиевого корпуса, усиленное усиление, гидравлическое рулевое управление, электрическая система коммерческого уровня, радиолокационная арка и точки интеграции оборудования для конкретных задач. Пользовательское соответствие для каждого проекта.
      icon: tabler:anchor
process_steps:
  title: 7-шаговый процесс разработки OEM/ODM RIB
  subtitle: От краткого описания проекта до послепродажного обслуживания — определенный рабочий процесс с четкими этапами и результатами
  steps:
    - number: '01'
      title: Краткое описание проекта и требования
      description: Определите целевое применение, размер корпуса, материал труб, требования соответствия и потребности в брендинге. Мы оцениваем осуществимость и подтверждаем модель сотрудничества (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 дней
    - number: '02'
      title: Технический обзор и технико-экономическое обоснование
      description: Команда инженеров проверяет конструктивное обоснование, расчеты устойчивости и плавучести, путь соответствия и доступность материалов. Мы определяем существующие формы или требования к индивидуальным формам.
      timeline: 5–7 дней
    - number: '03'
      title: Предложение и цитата
      description: Получите подробное предложение, включающее спецификации, 3D-рендеринги или общедоступные чертежи, объем соответствия, сроки и цену за единицу продукции на основе уровней объема и минимального заказа.
      timeline: 5–7 дней
    - number: '04'
      title: Подтверждение дизайна и отбор проб
      description: Утвердите окончательный общий обзор, планировку палубы и конфигурацию труб. Мы производим предсерийный образец с цветами вашего бренда, логотипом и указанными материалами для вашего физического осмотра.
      timeline: 15–20 дней
    - number: '05'
      title: Утверждение образца и протокол контроля качества
      description: 'Осмотрите и утвердите образец. Определите протокол контроля качества продукции: испытание под давлением (1,25x / 24–48 часов), проверки размеров и контрольный список документации на соответствие для каждого корпуса.'
      timeline: 3–5 дней
    - number: '06'
      title: Массовое производство и контроль качества
      description: Полный производственный цикл с контрольным списком контроля качества из 100 пунктов на единицу. Внутрипроизводственные проверки, испытания под давлением и прослеживаемость на уровне серийной продукции. Документация CE/ISO подготавливается параллельно.
      timeline: 30–45 дней
    - number: '07'
      title: Упаковка, доставка и послепродажное обслуживание
      description: Индивидуальная упаковка (стандартная, готовая к розничной торговле или на паллетах), экспортная документация, погрузка контейнеров и логистика. В комплект поставки входят комплекты запасных частей и документация по техническому обслуживанию.
      timeline: 7–14 дней
