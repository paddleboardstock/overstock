      badge: REACH
faq:
  title: RIB OEM/ODM — часто задаваемые вопросы
  questions:
    - q: В чем разница между OEM и ODM для лодок RIB?
      a: 'OEM (производство оригинального оборудования): вы предоставляете подробные спецификации, а мы разрабатываем ваш дизайн. ODM (производство оригинального дизайна): вы выбираете проверенную платформу Paddle Board Overstock RIB, и мы настраиваем ее с учетом ваших желаемых функций и бренда. ODM быстрее и дешевле; OEM предлагает максимальный контроль над дизайном.'
    - q: Могу ли я настроить форму и размер корпуса RIB?
      a: Да. Мы предлагаем полуиндивидуальные модификации существующих форм корпуса (различные схемы расположения палуб, конфигурации труб) и полную разработку корпуса по индивидуальному заказу с использованием новых форм, обработанных на станках с ЧПУ. Полузаказные проекты могут начинаться с 2-5 единиц; полная индивидуализация обычно требует более высоких обязательств.
    - q: Какие материалы трубок доступны для изготовления нестандартных РИБов?
      a: Мы предлагаем ПВХ толщиной 0,9-1,2 мм для рекреационного и легкого коммерческого использования, а также Hypalon/CSM толщиной 1,4-1,7 мм для профессионального, спасательного и коммерческого применения, требующего превосходной устойчивости к ультрафиолетовому излучению и озону (срок службы 10-15 лет по сравнению с 5-8 годами для ПВХ).
    - q: Можете ли вы настроить RIB для конкретных приложений, таких как спасение, дайвинг или рыбалка?
      a: Да. Мы поддерживаем проверенные шаблоны конфигураций для спасательных/патрульных операций, поддержки дайвинга, туризма/чартерных перевозок, рыбалки, тендеров на яхты и профессиональных рабочих лодок. Каждый шаблон включает рекомендуемый тип корпуса, материал труб, планировку палубы и оборудование, которые мы затем настраиваем в соответствии с вашими требованиями.
    - q: Какая информация вам нужна для получения предложения RIB OEM/ODM?
      a: Целевое применение, желаемая длина корпуса, предпочтительный материал труб (ПВХ или хайпалон), приблизительное количество и график поставок, требования соответствия целевому рынку, а также любые эталонные продукты или спецификации. Чем больше деталей вы предоставите, тем быстрее и точнее будет наше предложение.
    - q: Каков минимальный заказ для лодок RIB на заказ?
      a: Для существующих корпусных форм стандартных модификаций минимальный заказ начинается от 2-5 единиц на конструкцию. Для нестандартных форм и полной индивидуальной разработки минимальный заказ зависит от сложности проекта — обычно 10–20 единиц для полунестандартных изделий и более 30 для полностью нестандартных изделий с новым инструментом.
    - q: Кому принадлежат изготовленные на заказ формы и чертежи?
      a: Пресс-формы, разработанные с использованием базовых конструкций Paddle Board Overstock, остаются собственностью Paddle Board Overstock. Полностью изготовленные на заказ формы, заказанные и оплаченные клиентом, могут быть переданы в собственность клиента в соответствии с условиями контракта. Все условия владения пресс-формой документируются до начала проекта.
    - q: Как упаковываются нестандартные РИБы для экспорта?
      a: 'Стандарт: нестандартная люлька + стретч-пленка для погрузки контейнера. Премиум: упаковка, готовая к розничной продаже, вакуумная упаковка или паллетирование. Мы предлагаем доставку на условиях FOB Циндао, CIF и DDP. Включена полная экспортная документация и таможенное оформление.'
