process_steps:
  title: 6-ступенчатый процесс OEM/ODM
  subtitle: От технического задания до FOB Циндао — оптимизированный рабочий процесс
  steps:
    - number: '01'
      title: Техническое задание и 3D CAD моделирование
      description: Поделитесь своими целевыми спецификациями, эталонным продуктом или концепцией. Наша команда инженеров разрабатывает подробные чертежи CAD и 3D визуализации для вашего одобрения.
      timeline: 3–5 дней
    - number: '02'
      title: Выбор материалов и тестирование тканей
      description: Выбирайте из тканей военного класса PVC (0,9–1,2 мм), Hypalon CSM или drop-stitch core. Мы проводим испытания на прочность на разрыв, адгезию покрытия и стабильность UV.
      timeline: 2–3 дня
    - number: '03'
      title: Быстрое прототипирование и производство образцов
      description: Мы CNC-машинные индивидуальные формы и производим предварительные образцы с вашими фирменными цветами, логотипом и указанными материалами. Образцы отправляются для вашего утверждения.
      timeline: 7–14 дней
    - number: '04'
      title: 24–48-часовое испытание на выдержку высокого давления
      description: Каждый прототип проходит строгие испытания на удержание давления при 1,25-кратном номинальном давлении. Проводятся испытания на отслаивание швов и проверка размеров.
      timeline: 1–2 дня
    - number: '05'
      title: CE/ISO Контроль качества и упаковка
      description: Контрольный список качества на 100 пунктов. Каждое устройство проверяется перед упаковкой для розничной продажи. Включены декларация о соответствии CE и отчет о соответствии BSCI.
      timeline: 2–3 дня
    - number: '06'
      title: FOB Циндао Судоходство и Логистика
      description: Готовая продукция уложена на поддоны, обертка термоусадочной пленкой и загружена в контейнер в порту Циндао. Полный экспортный комплект документов, таможенное оформление и отслеживание в режиме реального времени.
      timeline: 7–14 дней
