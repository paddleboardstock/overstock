faq:
  title: OEM/ODM — Часто задаваемые вопросы
  questions:
    - q: Какое минимальное количество заказа (MOQ) для надувных SUPs по индивидуальному заказу?
      a: Для стандартных моделей с существующими формами, MOQ начинается с 5–10 единиц на дизайн. Для полностью индивидуальных форм и инструментов, MOQ обычно составляет 200 единиц. Мы работаем с стартапами и новыми брендами, чтобы найти осуществимые точки входа.
    - q: Каков MOQ для заказных RIB лодок?
      a: Модели RIB начинаются от 2–5 единиц на дизайн с использованием существующих форм, в то время как полностью индивидуальные формы RIB требуют большего объема обязательств. Мы работаем с стартапами и устоявшимися брендами, чтобы находить реалистичные точки входа.
    - q: Сколько времени занимает процесс образца OEM?
      a: Стандартные образцы прототипов изготавливаются в течение 7–14 рабочих дней после утверждения дизайна. Срочные заказы могут быть выполнены в приоритетном порядке за 5–7 дней за дополнительную плату.
    - q: В чем разница между PVC и Hypalon для надувных лодок?
      a: PVC легче, более доступен по цене и обеспечивает отличную гибкость при холодной погоде. Hypalon (CSM) обеспечивает превосходную стойкость к UV и озону с более длительным сроком службы (10–15 лет против 5–8 лет). Мы рекомендуем PVC для большинства развлекательных приложений и Hypalon для коммерческого/профессионального использования.
    - q: Можете ли вы настроить форму и дизайн надувного изделия?
      a: Да. Наша команда НИОКР может разработать индивидуальные формы для любого типа корпуса, контура доски или конфигурации баллона. Мы используем алюминиевые формы, обработанные на CNC, для точности и стабильности.
    - q: Вы предоставляете услуги аудита на заводе?
      a: Мы приветствуем аудиты на месте и сторонние аудиты заводов на нашем предприятии в Циндао площадью 12 000 м². Мы поддерживаем сертификаты ISO 9001 и BSCI и можем предоставить отчеты аудитов после подписания соглашения о неразглашении (NDA).
    - q: Какие условия доставки вы предлагаете?
      a: Мы предлагаем условия поставки FOB Циндао (стандартные), CIF и DDP. Загрузка контейнеров и полный экспортный пакет документов включены во все OEM заказы.
content_profiles:
  tagline: Профили брендов
  title: OEM / Производство под частной маркой<br /> по типу клиента
  subtitle: Разные профили брендов имеют различные требования — мы адаптируем наши OEM/ODM услуги в соответствии с вашей бизнес-моделью, масштабом и стратегией выхода на рынок.
  items:
    - title: Начальные бренды водного транспорта
      subtitle: Низкий MOQ, быстрый набор
      description: Предприниматели и основатели, запускающие свою первую линейку лодок RIB, SUPs или надувных лодок. Вам нужен производственный партнер, который относится к вашему бренду как к своему собственному — с низкими порогами входа, гибкими размерами партий и практическим руководством по дизайну на каждом этапе пути.
      features:
        - MOQ всего 2–5 единиц (RIB) / 5–10 единиц (SUP) на каждый SKU
        - Предварительно существующая библиотека форм для экономии на стоимости оснастки
        - 'Полный пакет брендинга: логотип, графика на тубе, упаковка, подвесные ярлыки'
        - Рабочий процесс «сначала образец» — утверждать перед производством
    - title: Установленные морские бренды
      subtitle: OEM шкала с CE/ISO соблюдением
      description: Существующие бренды лодок, гидроциклов или морских аксессуаров, добавляющие надувные водные суда в свой портфель. Вам необходимы стабильное качество на всех производственных сериях, соблюдение нормативных требований для глобальных рынков и возможность совместной разработки индивидуальных корпусов или форм баллонов.
      features:
        - Индивидуальная 3D-проектировка форм для собственных разработок
        - CE 2013/53/EU, UKCA, USCG документация по соответствию
        - BSCI отчеты социального аудита для соблюдения требований розничного продавца
        - Выделенное управление аккаунтом + приоритетные производственные слоты
    - title: Бренды DTC и электронной коммерции
      subtitle: Упаковка, готовая для розничной торговли, в больших масштабах
      description: Бренды, ориентированные на онлайн-продажи, продающие через Amazon, Shopify или собственные интернет-магазины. Упаковка, опыт распаковки и стабильное качество единиц продукции имеют решающее значение. Вам нужна фабрика, которая понимает динамику скорости продаж и возвратов в электронной коммерции.
      features:
        - Дизайн готовой к продаже коробки + печать вставной карточки
        - Вакуумная упаковка / паллетирование для экономичной доставки
        - Штрихкод EAN / UPC и документация, готовая для таможни
        - Консолидация смешанных контейнеров для оптимизации стоимости на месте
    - title: Операторы аренды и гостиничного бизнеса
      subtitle: Готовые решения для курортов и арендного бизнеса
      description: Курорты, центры водных видов спорта и компании по аренде нуждаются в прочном, удобном в обслуживании транспорте с единым брендингом. Мы предоставляем цены на парки, контейнеры с различными моделями и поддержку по запасным частям на многие годы эксплуатации.
      features:
        - Флотное ценообразование на заказы контейнеров с различными моделями
        - Прочные коммерческие варианты труб и настилов
        - Комплекты запасных частей и обучение техническому обслуживанию
        - Последовательный брендинг на SUP, RIB и флотах каяков
