why_us:
  - title: Вертикальная интеграция
    description: Мы владеем своим заводом, пресс-формами и цепочкой поставок — без посредников и субподрядчиков. Это даёт нам контроль над качеством, себестоимостью и сроками.
  - title: Двойная сертификация
    description: Менеджмент качества ISO 9001 и сертификация социальной ответственности BSCI. Отчёты заводского аудита предоставляются по запросу.
  - title: Соответствие CE
    description: Все стандартные модели имеют сертификацию CE 2013/53/EU. Индивидуальные модели могут быть сертифицированы CE по нашему отработанному процессу.
  - title: Низкий MOQ
    description: Начните всего с 5 единиц стандартных моделей. Мы помогаем молодым брендам выходить на рынок без избыточных складских обязательств.
