hero:
  tagline: Производство OEM/ODM
  title: Производство OEM и под частной маркой
  subtitle: От концепции до контейнера — настройте каждую деталь вашей линейки надувных судов

intro: Paddle Board Overstock предлагает комплексные услуги OEM и ODM для брендов, дистрибьюторов и государственных организаций по всему миру. Имея более 10 лет опыта экспорта и завод площадью 12 000 м² с сертификатами ISO 9001 и BSCI, мы берём на себя всё — от проектирования изделия и разработки пресс-форм до полномасштабного производства, упаковки и логистики.

