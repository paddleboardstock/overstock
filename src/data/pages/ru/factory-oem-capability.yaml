services:
  - title: Проектирование и инженерия изделий
    description: Наша собственная команда R&D работает с вашей концепцией или спецификацией, разрабатывая чертежи CAD, 3D-модели и прототипы. Мы предлагаем проектирование пресс-форм, оптимизацию формы корпуса и помощь в выборе материалов.
  - title: Индивидуальный брендинг и графика
    description: Полноцветная цифровая печать, трафаретная печать, тиснение и варианты этикеток. Мы разрабатываем фирменную графику палубы, брендинг труб и упаковку, готовую к розничной продаже.
  - title: Настройка материалов и спецификаций
    description: Выбирайте из ПВХ (стандартный, экологичный, огнестойкий), Hypalon/CSM, drop-stitch и гибридных конструкций. Индивидуальные цвета труб, плотность ткани и варианты усиления.
  - title: Упаковка и логистика
    description: Индивидуальная розничная упаковка, коробки под частной маркой, вакуумная упаковка, паллетирование и загрузка контейнеров. Условия поставки FOB Циндао, CIF или DDP.

