hero:
  tagline: Центр НИОКР
  title: Центр Н И О К Р
  subtitle: Сосредоточены на прогрессе

intro:
  - Центр исследований и разработок (НИОКР) Paddle Board Overstock является движущей силой нашей миссии по революционизации оборудования для водных видов спорта. Мы расширяем возможности любителей водных видов спорта по всему миру, предлагая более безопасные, удобные и приятные продукты благодаря неустанным инновациям в надувных досках SUP и лодках. Наша команда инженеров, дизайнеров и страстных экспертов по водным видам спорта формирует будущее отрасли, постоянно повышая планку качества, производительности и устойчивости.
  - Наше подразделение НИОКР объединяет материаловедов, кораблестроителей и инженеров-технологов под одной крышей. От разработки составов тканей и симуляции корпусов до разработки сварочных процессов и полномасштабных морских испытаний — каждый этап разработки продукта основан на данных и подтвержден тестированием.

mission:
  tagline: Наша миссия
  title: Инновации в будущее водных видов спорта
  pillars:
    - icon: lightning
      title: Технологический прогресс
      desc: Внедрение новых материалов, дизайнов и производственных процессов для превосходной производительности и долговечности продукции.
    - icon: design
      title: Дизайн, ориентированный на пользователя
      desc: Глубокое понимание и превышение потребностей пользователей через эргономичный и интуитивный дизайн продуктов.
    - icon: globe
      title: Устойчивые практики
      desc: Минимизация нашего экологического следа за счет использования экологичных материалов и процессов.
    - icon: shield
      title: Непоколебимая безопасность
      desc: Обеспечение высочайших стандартов безопасности через строгие испытания и сертификацию.

pillars:
  - title: Технологический прогресс
    desc: Внедрение новых материалов, дизайнов и производственных процессов для обеспечения превосходной производительности и долговечности продукции.
    icon: tech
  - title: Передовые материалы
    desc: Исследование передовых PVC, Hypalon, композитов и устойчивых альтернатив для улучшенных характеристик продукции.
    icon: materials
  - title: Устойчивое развитие
    desc: 'Ключевое обязательство: Мы стремимся к экологической ответственности через устойчивое производство и перерабатываемые материалы.'
    icon: sustainability

capabilities:
  tagline: Возможности
  title: Возможности НИОКР
  subtitle: Четыре основные дисциплины, дающие нам полный контроль над разработкой продукта — от исследований сырья до финальной сертификации.
  groups:
    - title: Материаловедение и технология тканей
      items:
        - Анализ и оптимизация составов PVC и Hypalon
        - Разработка УФ-стабилизации, антипиренов и антимикробных добавок
        - Инженерия многослойной ламинации и адгезии тканей
        - Ускоренные испытания на старение (УФ, термическое, влажность, соляной туман)
    - title: Инженерия корпуса и гидродинамика
      items:
        - Параметрический 3D-дизайн корпуса и оптимизация CFD
        - Конечно-элементный анализ структурных и ударных нагрузок
        - Буксировочные испытания масштабных моделей и валидация производительности
        - Разработка индивидуальных корпусов для специальных профилей миссий
    - title: Технология сварки и соединения
      items:
        - Разработка и оптимизация процессов RF-диэлектрической сварки
        - Методы сварки горячим воздухом, горячим клином и ультразвуком
        - Квалификация клеевых соединений и лент для швов
        - Моделирование прочности сварки и прогнозирование срока службы
    - title: Тестирование, сертификация и соответствие
      items:
        - Испытания на соответствие , и CE
        - Независимое стороннее тестирование и поддержка сертификации
        - Разработка индивидуальных протоколов испытаний для квалификации закупок
        - Анализ отказов в эксплуатации и исследование первопричин

