rd_services:
  tagline: Индивидуальные НИОКР
  title: Услуги НИОКР для партнеров
  services:
    - title: Разработка индивидуальных материалов
      desc: Мы разрабатываем индивидуальные составы тканей, пакеты ламинатов и клеевые системы, адаптированные к вашей рабочей среде и целям производительности.
    - title: Инженерия продукции OEM / ODM
      desc: От концептуальных эскизов до готовых к производству инженерных пакетов — наша команда может проектировать, прототипировать и испытывать лодки под вашим брендом.
    - title: Стороннее тестирование и сертификация
      desc: Используйте наши соответствующие ISO испытательные мощности для независимого тестирования материалов, валидации продукции и поддержки сертификации.
  cta: Обсудить ваши требования НИОКР →
  cta_link: /contact

vision:
  tagline: Наше видение
  title: Формирование будущего водных видов спорта
  body: Paddle Board Overstock стремится лидировать в индустрии надувных лодок и SUP через непрерывные инновации, непоколебимое качество и твердую приверженность безопасности и устойчивости — в конечном итоге обогащая опыт любителей водных видов спорта по всему миру. Центр НИОКР Paddle Board Overstock — это место, где страсть встречается с инновациями, устанавливая новые стандарты для индустрии водных видов спорта.

labs_section:
  tagline: Лаборатории
  title: Наши лаборатории
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: Лаборатория тканей PVC
      description: Непрерывные исследования и тестирование трубных тканей PVC и Hypalon на прочность на растяжение, стойкость к УФ, истирание и гибкость при низких температурах для обеспечения долгосрочной надежности в морских условиях.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Студия инженерии корпуса
      description: CAD-дизайн и конечно-элементный анализ корпусов из HDPE, алюминия и стеклопластика. Каждый корпус цифрово симулируется на распределение напряжений и ударопрочность перед созданием первого прототипа.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: Центр RF-сварки
      description: Специализированное подразделение радиочастотной сварки с точным контролем температуры и давления, производящее высокопрочные герметичные швы, превышающие стандарты для надувных плавсредств.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Гидродинамический испытательный бассейн
      description: Испытания на масштабных моделях в нашем внутреннем испытательном бассейне для оптимизации формы корпуса, глиссирующих характеристик, устойчивости и топливной эффективности в диапазоне нагрузок и морских условий.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Прототипный цех
      description: Подразделение полномасштабного прототипирования и оснащения, где новые модели строятся, оснащаются и проходят морские испытания. Каждый прототип проходит минимум 20-часовую программу испытаний на воде перед утверждением производства.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Лаборатория качества и инспекции
      description: Специализированная лаборатория обеспечения качества, выполняющая испытания на растяжение, циклы воздухонепроницаемости, тесты на отслаивание швов и сертификацию материалов, чтобы гарантировать, что каждая лодка, покидающая цех, соответствует нашим опубликованным спецификациям.
      href: /randdcenter/quality-inspection-lab
