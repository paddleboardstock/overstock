hero:
  tagline: Оборудование
  title: Производственное оборудование и машины
  subtitle: Промышленное оборудование для резки, сварки, печати и сборки
  back_label: Назад на фабрику
  back_link: /factory
categories:
  - title: Резка и подготовка материалов
    items:
      - name: PVC Автоматическая режущая машина
        spec: Компьютерное управление, 6,5 м × 2,5 м, точность 0,1 мм
        desc: Автоматический компьютерный раскройный станок для тканей PVC и drop-stitch. Программное обеспечение для размещения кроя оптимизирует использование материалов с отходами менее 5%.
      - name: Расстилатель ткани
        spec: Макс. ширина 3 м, подача с контролем натяжения
        desc: Разглаживает ткань в один или несколько слоев с контролируемым натяжением, чтобы предотвратить деформацию перед резкой.
  - title: Сварка и склеивание
    items:
      - name: Термогерметизационная машина
        spec: Горячий воздушный сварочный аппарат, переменная температура 200–600 °C, скорость 0,5–5 м/мин
        desc: Горячий воздушный термосварочный станок для склеивания и сварки ламинатов PVC, рельсовых лент и швов камер. Используется для закрепления, герметизации и соединения сердечников drop-stitch.
      - name: Диаэлектрический пресс RF
        spec: 15 кВт, плитa 2000 × 600 мм
        desc: Радиочастотный пресс для сварки основных продольных швов, соединений трансом-трубка и изготовления больших камер.
      - name: RF-сварщик с управлением CNC
        spec: 8 кВт, XY-стол 2500 × 1200 мм
        desc: Программируемая сварка кривых швов для сложных геометрий, тиснение логотипа и точная лоскутная работа.
  - title: Декор палубы и финишная отделка
    items:
      - name: EVA Машина для резки настилов
        spec: Резка ножом CNC, ширина 2 м
        desc: Точная резка панелей из поролона палубы EVA для художественных серий палуб. Каждая панель вырезается по форме для бесшовной подгонки всей палубы.
      - name: Пресс для ламинации палуб
        spec: Контроль температуры и давления
        desc: Склеивает панели палубы EVA с поверхностью доски с равномерной адгезией по всей площади палубы.
  - title: SUP Печать и декорация
    items:
      - name: Цифровой принтер
        spec: Высококачественная струйная печать, до 2 м ширины печати
        desc: Прямая цифровая печать по ткани для полноцветной графики палубы SUP. Печатает индивидуальные узоры, градиенты и изображения фотокачества с использованием водных чернил, стойких к UV.
      - name: Трафаретная машина
        spec: Ручная и полуавтоматическая многокрасочная регистрация
        desc: Трафаретная печать для логотипов на досках SUP, брендовых знаков и повторяющихся узоров. Обеспечивает долговечную, непрозрачную печать с яркой насыщенностью цветов.
  - title: Финальная сборка
    items:
      - name: Станция затяжки клапанов
        spec: Калиброванный, 10-цикловый функциональный тест
        desc: Устанавливает и затягивает клапаны накачки, затем тестирует каждый клапан через 10 циклов открытия/закрытия.
      - name: Финбокс и установка D-образного кольца
        spec: Выравнивание по шаблону, отверждение клеем
        desc: Размещает и фиксирует финбоксы, D-образные кольца и ручки в точных местах палубы согласно спецификациям модели.
  - title: Тестирование и контроль качества
    items:
      - name: Универсальный разрывной тестер
        spec: Вместимость 50 кН
        desc: Тестирование прочности на разрыв, удлинения при разрыве и распространения разрыва для партий ткани.
      - name: Испытательный стенд для проверки удержания воздуха
        spec: Программируемый, удержание давления 30 мин
        desc: Автоматический тест удержания давления для каждой камеры трубы перед сборкой.
      - name: Тестер отслаивания шва
        spec: Моторизованное 180° отслаивание со скоростью 100 мм/мин
        desc: Тестирование прочности сварных и клеевых швов по внутреннему протоколу.
      - name: Камера старения Xenon-Arc
        spec: Экспозиция 2000 ч
        desc: Тестирование стойкости к UV на изменение цвета и сохранение прочности.
cta:
  title: Хотите посетить фабрику?
  desc: Мы приглашаем гостей на наше предприятие в Вэйхае. Увидьте наше оборудование и процессы лично.
  label: Запланировать визит →
  link: /contact
tldr:
  summary: Paddle Board Overstock управляет 12 000 м² производственных площадей, оснащённых автоматическими PVC станками для резки, высокочастотными RF-сварочными аппаратами, EVA станциями резки и отделки палуб, прессами для термосварки и установками для окончательной сборки. Каждая доска проходит проверку удержания давления 1,25x номинального.
  points:
    - Автоматическая PVC резка с CNC точностью
    - Высокочастотная RF-сварка для целостности швов
    - EVA станции резки палуб и ручной отделки
    - Сборочные установки для крутящего момента клапанов и коробок плавников
    - Проверка удержания давления 1,25x на 100% досок
