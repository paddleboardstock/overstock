hero:
  tagline: Технические чертежи и САПР
  title: Надувные лодки и надувные лодки<br />Технические чертежи и файлы для загрузки в формате CAD
  subtitle: Общие чертежи на уровне планирования, размерные таблицы и макеты площадок для оценки и спецификации проекта. Получите доступ к техническим чертежам на нужном уровне — от общедоступных PDF-файлов до файлов STEP на уровне проекта.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Технические чертежи RIB-лодок и файлы для загрузки в формате CAD
direct_answer: Paddle Board Overstock предоставляет технические чертежи на уровне закупок для лодок RIB и надувных плавсредств, включая PDF-файлы общего вида (GA), габаритные таблицы и чертежи компоновки палубы. Форматы с более высокой детализацией (DXF/DWG, STEP/IGES) доступны по квалифицированному запросу или проектной заявке.
