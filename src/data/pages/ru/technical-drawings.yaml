content_version_control:
  tagline: Управление версиями
  title: Версия чертежа<br />Управление
  subtitle: Каждый рисунок следует контролируемой системе редакций. Всегда проверяйте, что у вас есть текущая версия, прежде чем использовать чертежи для планирования проекта.
  items:
    - title: Отслеживание изменений
      description: На каждом чертеже указан код версии (Rev-A, Rev-B, Rev-C), дата выпуска, дата последней проверки, применимая модель/конфигурация, единицы измерения, размер файла и формат. Для скачивания доступна только «Текущая» редакция.
      icon: tabler:git-branch
    - title: Уведомление о состоянии чертежа
      description: На всех общедоступных чертежах имеется пометка «Только предварительная компоновка — не для использования в строительстве, сертификации или производстве. Размеры подлежат окончательной спецификации и подтверждению заказа». Это защищает обе стороны от неправильного применения.
      icon: tabler:alert-circle
    - title: Уведомления об обновлениях
      description: При изменении спецификации модели версия чертежа обновляется, а предыдущие версии помечаются как «Заменено». Зарегистрированные пользователи, загрузившие пакеты DXF/DWG, получают уведомления о существенных обновлениях по электронной почте.
      icon: tabler:bell

