faq:
  title: Технические чертежи — часто задаваемые вопросы
  questions:
    - q: Действительно ли PDF-файлы GA можно загрузить бесплатно?
      a: Да. PDF-файлы общего вида для наших основных моделей доступны бесплатно. Они содержат информацию уровня планирования, достаточную для оценки проекта, распределения пространства и предварительного анализа спецификаций.
    - q: Как получить доступ к файлам DXF/DWG?
      a: Заполните короткую квалификационную форму на странице загрузки, указав название вашей компании, тип проекта и предполагаемое использование. Одобренные запросы получают ссылку для скачивания по электронной почте в течение 1 рабочего дня.
    - q: Могу ли я получить 3D-модели STEP/IGES?
      a: Файлы 3D-моделей STEP или IGES доступны в процессе подачи заявки на проект. Укажите объем вашего проекта, требования к интеграции, сроки и намерения покупки. При условии одобрения — обычно в течение 3–5 рабочих дней.
    - q: Почему вы ограничиваете доступ к файлам с более подробной информацией?
      a: Геометрия корпуса, данные пресс-форм и структурные расчеты представляют собой годы инвестиций в исследования и разработки и являются основной интеллектуальной собственностью производства. Мы предоставляем все необходимое для планирования закупок и интеграции проектов, сохраняя при этом нашу способность продолжать инвестировать в разработку новых продуктов.
    - q: Включают ли чертежи производственные детали?
      a: Нет. Чертежи в общедоступной и упрощенной форме содержат информацию на уровне закупок для планирования и спецификации. Детали производственного уровня (графики ламинирования, траектории движения инструмента, расширения резки) передаются только в соответствии с соглашением о неразглашении при подтвержденных заказах.
    - q: Доступны ли чертежи для нестандартных или полуиндивидуальных конфигураций РИБ?
      a: Чертежи индивидуального проекта подготавливаются в рамках процесса разработки OEM/ODM. Если вы оцениваете индивидуальный проект RIB, свяжитесь с нами и сообщите о своих требованиях, и мы предоставим чертежи GA для конкретного проекта как часть предложения.
