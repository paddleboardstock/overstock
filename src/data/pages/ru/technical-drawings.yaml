content_tiers:
  tagline: Скачать уровни
  title: Четыре уровня доступа<br />— правильная деталь для правильного этапа
  subtitle: Мы предоставляем чертежи на уровне закупок, а не файлы на уровне производства. Каждый уровень соответствует определенному этапу проекта.
  items:
    - title: Уровень 1 — общедоступный PDF-файл
      description: Общий вид (GA), габаритный чертеж в 4 проекциях и планировка палубы в формате PDF. Доступно для бесплатного скачивания. Достаточно для планирования проекта, распределения пространства и предварительного рассмотрения спецификаций.
      icon: tabler:file-type-pdf
    - title: Уровень 2 — облегченная форма DXF/DWG
      description: 2D-файлы САПР (DXF или DWG) для интеграции макетов на уровне планирования. Требуется краткая квалификационная форма (название компании, тип проекта, предполагаемое использование). Никакие структурные или производственные данные не включены.
      icon: tabler:file-code
    - title: Уровень 3 — Проектная заявка STEP/IGES
      description: Файлы 3D-моделей (STEP или IGES) для системной интеграции, проектирования оборудования или координации военно-морской архитектуры. Требуется заявка на проект с указанием объема, сроков и намерения покупки. При условии одобрения.
      icon: tabler:cube
    - title: Уровень 4 — Проектирование NDA
      description: Структурные чертежи корпуса, графики расслоения, расширения труб и данные пресс-форм. Доступно только по соглашению о неразглашении с подтвержденными заказами. Это файлы производственного уровня, а не для публичного распространения.
      icon: tabler:lock
content_included:
  tagline: Что включено
  title: Содержание чертежей<br />Для каждой модели
  subtitle: Каждая модель имеет стандартный пакет чертежей, содержащий важную информацию о планировании для покупателей B2B и инженеров-проектировщиков.
  items:
    - title: Генеральное расположение (GA)
      description: Боковой профиль, вид сверху и поперечное сечение, показывающее форму корпуса, положение труб, расположение консоли, сидений, топливную систему и основные размеры (длина подвески, ширина, диаметр труб, угол килеватости). Статус редакции и авторские права указаны в основной надписи.
      icon: tabler:layout
    - title: Габаритный чертеж с 4 видами
      description: Виды сбоку, спереди, сзади и сверху с габаритными размерами для планирования транспортировки (высота на прицепе, ширина для контейнера, вес для подъема). Включает в себя оперативную и транспортную конфигурации.
      icon: tabler:ruler-2
    - title: План палубы и план оборудования
      description: Вид на палубу сверху вниз, показывающий основание консоли, положения сидений, расположение D-образных колец, расположение навигационных огней, доступ к трюмной помпе, аккумуляторный/топливный отсек и точки крепления оборудования. Ограниченная точность в проприетарных интерфейсах.
      icon: tabler:map
    - title: Транспортный и упаковочный чертеж
      description: План загрузки контейнера, размеры люльки, распределение веса и положения точек подъема для планирования логистики. Включает стандартные и индивидуальные варианты упаковки.
      icon: tabler:truck
content_protection:
  tagline: IP-защита
  title: Чем мы не делимся<br />и почему
  subtitle: Защита нашей инженерной интеллектуальной собственности гарантирует, что мы сможем продолжать инвестировать в исследования и разработки, одновременно предоставляя покупателям все необходимое для планирования проектов.
  items:
    - title: Основные данные пресс-формы корпуса
      description: Геометрия вставок и пресс-форм, траектории движения инструментов с ЧПУ и шаблоны для ламинирования являются запатентованными производственными активами. Они не используются ни на каком уровне доступа за пределами подтвержденных контрактов NDA.
      icon: tabler:ban
    - title: Расширения для резки труб
      description: Файлы для резки трубчатой ткани с плоским рисунком представляют собой данные производственного уровня. Доступно только в соответствии с соглашением о неразглашении с подтвержденными производственными заказами и передается только договаривающейся стороне.
      icon: tabler:ban
    - title: Структурные расчеты
      description: Подробный анализ стресса, результаты FEA и графики ламинирования представляют собой документы, чувствительные к соблюдению требований, которые передаются только уполномоченным органам и клиентам, связанным соглашением о неразглашении, во время процесса оценки соответствия.
      icon: tabler:ban
    - title: Проверка конкурентов
      description: Мы оставляем за собой право отклонять запросы на доступ к САПР, которые предположительно исходят от конкурентов, студентов, не имеющих контекста проекта, или сторон, не имеющих законных намерений закупок.
      icon: tabler:shield
