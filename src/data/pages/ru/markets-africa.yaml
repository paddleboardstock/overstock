hero:
  tagline: Африка
  title: Оптовые SUP борды для<br />Африканские розничные продавцы и операторы
  subtitle: Операторы прибрежного туризма и ритейлеры водных видов спорта по всей Африке — совершенно новые SUP избыточные доски из 5 единиц, смешанные модели, экспресс или морские грузовые перевозки.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Доски для перепродажи запасов для африканских прибрежных ритейлеров и операторов
direct_answer: Paddle Board Overstock поставляет новые надувные доски с избытком SUP запаса для предприятий по всей Африке — от Южной Африки и Кении до Марокко, Ганы, Танзании и Египта. Оптовые заказы начинаются с 5 досок, смешанных моделей в одной партии, отправляемых из Вэйхая, Китай, экспресс-авиаперевозками или консолидированными морскими перевозками. Каждая плата проходит 100% испытания под давлением и покрывается SUP двухлетней гарантией.
tldr_points:
  - Оптовая покупка с 5 плат — смешанные модели, цены по общему объёму
  - Обслуживание прибрежных туристических рынков от Северной Африки до мыса
  - Экспресс-авиаперевозки или консолидированные морские грузы из Вэйхая, Китай
  - 100% проверенный под давлением, SUP двухлетняя гарантия на каждую плату
overview_section:
  tagline: Обзор рынка
  title: SUP Африканский рынок
  paragraphs:
    - Africa's coastline runs tens of thousands of kilometers through wildly different water worlds — the Atlantic surf towns of Morocco and South Africa, the reef-protected lagoons of Kenya and Tanzania, the Red Sea resorts of Egypt, and the growing beach scenes of West Africa. In each of them, stand-up paddle is finding its audience: туристы, ищущие безопасное первое водное занятие, а местные жители строят настоящие гребные сообщества.
    - Бизнесы, покупающие SUP доски здесь, обычно небольшие и предприимчивые — серф-шопы добавляют вариант с плоской водой, пляжные курорты строят программы активности, операторы дайвинга и водных видов спорта расширяют ассортимент, а сафари-и и пляжные лоджи добавляют гребли на закате. Они заказывают небольшие автопарки, и им нужны доски, которые работают в первый день и выдерживают сезон за сезоном.
  customer_types:
    - title: Прибрежные курорты и гостиницы
      description: Пляжные курорты и сафари-пляжные лоджи добавляют SUP гостям сессии — небольшие смешанные автопарки, лёгкая сезонная пополнение запасов.
    - title: Операторы водных видов спорта и дайвинга
      description: Существующие операторы SUP добавляют аренду и уроки наряду с дайвингом или кайт-операциями.
    - title: Магазины для серфинга и пляжа
      description: Ритейлеры в устоявшихся серф-городах Африки расширяются в спокойные воды и SUP гастролируют для местных жителей и туристов.
shipping_section:
  title: Корабль в Африку
  paragraphs:
    - Заказы отправляются из Вэйхая, Китай. Экспресс-авиаперевозки перевозят образцы, 1–3 бортовых заказа и срочные пополнения запасов в крупные африканские аэропорты; Consolidated sea freight обслуживает 5–20 оптовых заказов через основные порты региона. Оба варианта указаны с предполагаемым временем транзита для вашего конкретного пункта назначения.
    - Мы готовим полную экспортную документацию — коммерческий счет и список упаковки — и можем поддержать вашего брокера с дополнительными документами, необходимыми для процесса оформления.
  customs_note: Режимы импорта сильно различаются между африканскими странами, а ставки пошлин на спортивное снаряжение периодически меняются. Подтвердите действующие правила с местным органом власти или клиринговым агентом перед заказом; мы предоставляем всю стандартную документацию.
faq_section:
  title: Часто задаваемые вопросы по Африке
  items:
    - q: Какие африканские рынки вы обслуживаете?
      a: Мы отправляем рейсы по всему континенту, имея специальных гидов для Южной Африки и Кении — а также из Марокко и Египта в Гану и Танзанию. Подтвердите своё местоположение в запросе на котировку.
    - q: Может ли маленькая ложа заказать всего несколько досок?
      a: Да — именно для этого и предназначена модель с избытком. Минимум — пять досок, смешанные модели приветствуются, а небольшие автопарки часто встречаются среди клиентов курортов.
    - q: Как аренда держится в солёной воде и на солнце?
      a: Доски используют конструкцию drop-stitch PVC, которую мы поставляем в арендные парки по всему миру. Прополощите после использования в солёной воде и по возможности храните в тени — стандартный уход, который позволяет арендным доскам служить несколько сезонов.
    - q: Какие шаги по оплате и доставке?
      a: Вы запрашиваете предложение, мы подтверждаем наличие и предоставляем цену за единицу плюс варианты доставки, вы утверждаете окончательное предложение, а мы тестируем, упаковываем и отправляем с отслеживанием «от двери до двери». Условия оплаты подтверждаются при предоставлении предложения.
