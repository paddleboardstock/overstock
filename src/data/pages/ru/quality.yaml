tests:
  - title: Испытание давлением
    standard: ISO 6185-1 | Внутренние характеристики AF-PT-001
    description: В надувных камерах создается давление, превышающее рекомендуемый рабочий предел в 1,25 раза, и выдерживается в течение 30 минут. Падение давления измеряется для проверки герметичности и структурной целостности материалов и швов.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Испытание на удар
    standard: Внутренние характеристики AF-IT-002
    description: Изделия подвергаются контролируемым ударам стандартизированных падающих грузов и маятниковых устройств. При этом оценивается устойчивость к проколам, распространение разрывов и устойчивость конструкции к столкновениям с препятствиями, доками и мусором.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: Испытание на устойчивость к ультрафиолетовому излучению
    standard: АСТМ G154 | ISO 4892-3
    description: Образцы материала подвергаются воздействию ламп UVA-340 в камерах ускоренного выветривания в течение более 1000 часов. Мы измеряем изменение цвета (Delta E), сохранение блеска и потерю прочности на разрыв для проверки пакетов УФ-стабилизаторов.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Испытание на стойкость к истиранию
    standard: ASTM D751 (Табер) | ISO 5470-1
    description: Образцы материала подвергаются абразивным кругам CS-10 с нагрузкой 500 г/1000 г в течение 1000 циклов. Потеря массы и степень визуального износа определяют стойкость покрытия к воздействию песка, гравия и повторных пусков.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Тестирование производительности при низких температурах
    standard: Внутренние характеристики AF-LT-003 | МИЛ-СТД-810Г
    description: Собранные изделия и купоны на материалы выдерживают при температуре -20°C, -10°C и 0°C в течение 24 часов, а затем подвергают испытаниям на гибкость. Мы проверяем, что PVC и Hypalon остаются гибкими, без растрескивания и расслоения.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Испытание плавучести и грузоподъемности
    standard: ISO 6185-1 | ISO 12402
    description: Продукты постепенно загружаются до 1,25-кратной номинальной мощности в контролируемом пуле. Регистрируются надводный борт, устойчивость и характеристики самоосушения. Номинальная мощность каждой модели проверена математически и эмпирически.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Проверка маневренности
    standard: Внутренние характеристики AF-MT-004
    description: В ходе испытаний на воде измеряются радиус поворота, ускорение, время глиссирования и реакция лопастей/двигателей в различных условиях нагрузки. Реальные характеристики управляемости проверяются на соответствие проектным целям.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Испытание на водонепроницаемость
    standard: ISO 6185-1 §7.3 | Внутренние характеристики AF-WT-005
    description: Каждое собранное изделие проходит испытания на распыление под давлением 0,5 бар на все швы, клапаны и фитинги. 5-минутное испытание на погружение под давлением подтверждает водонепроницаемость камеры и клапана. Стандарт нулевой утечки перед отправкой.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
