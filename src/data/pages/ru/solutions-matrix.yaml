hero:
  tagline: Матрица отраслевых решений
  title: Морские решения на основе сценариев<br />Для профессиональных операций
  subtitle: Специально спроектированные надувные плавсредства и жестко-надувные лодки, предназначенные для спасательных операций, аренды флота, тендерных яхт и коммерческого рыболовства — каждый из них имеет технические характеристики и возможности индивидуальной настройки.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Профессиональные морские решения Aquafarer для различных отраслей промышленности
direct_answer: 'Aquafarer поставляет спроектированные по сценарию надувные плавсредства и надувные лодки для коммерческих морских операций: спасательные и патрульные катера с усиленными трубами Hypalon и многокамерной безопасностью, арендованный флот SUP и каяки с ПВХ-швами толщиной 1,2 мм и сварными швами горячим воздухом для долговечности, не требующей особого обслуживания, роскошные яхтенные тендеры с алюминиевыми надувными лодками с глубоким V-образным корпусом, а также сверхмощные рыболовные конфигурации с держателями удочек и системами жилых колодцев.'
solution_a:
  tagline: Решение А
  title: Морская спасательная служба и коммерческий патруль
  subtitle: Высокоскоростные многокамерные надувные лодки безопасности для профессионального реагирования на чрезвычайные ситуации и операций правоохранительных органов.
  badge: Heavy-Duty Series
  description: Наши морские спасательные и патрульные надувные лодки изготовлены из усиленных воздушных трубок из гипалона и ПВХ высокой плотности и имеют многокамерную независимую плавучую конструкцию. Каждое судно оснащено светоотражающей лентой профессионального уровня, спасательными захватами и клапанами быстрого надувания для обеспечения готовности к развертыванию. Корпуса из стекловолокна с глубоким V-образным вырезом обеспечивают исключительную устойчивость на высоких скоростях и в бурных морских условиях.
  features:
    - title: Многокамерная безопасность
      description: 4–6 независимых воздушных камер — любой прокол одной камеры обеспечивает положительную флотацию.
    - title: Армированная трубчатая ткань
      description: Hypalon CSM толщиной 1,2 мм или ПВХ 1680 DTEX с двухслойными сварными швами горячим воздухом.
    - title: Профессиональный уровень
      description: Светоотражающая лента SOLAS, спасательные поручни, буксировочные планки, быстросъемный малярный трос.
    - title: Высокоскоростной корпус
      description: Корпус из стекловолокна или алюминия с глубоким V-образным вырезом рассчитан на скорость 25–45 узлов в зависимости от конфигурации.
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Материал корпуса
      value: Стекловолокно/морской алюминий
    - label: Трубчатая ткань
      value: Hypalon CSM толщиной 1,2 мм / ПВХ 1680 DTEX
    - label: Максимальная скорость
      value: 25–45 узлов
    - label: Емкость
      value: 6–12 человек
    - label: Диапазон двигателей
      value: 40–200 л.с.
    - label: Сертификация
      value: СЕ/ИСО 9001
solution_b:
  tagline: Решение Б
  title: Прокат водных видов спорта и оборудование для курортного парка
  subtitle: Сверхпрочные, не требующие особого ухода надувные SUP-серфинги, каяки и лодки, созданные для ежедневной аренды на курортах, в клубах и туристических организациях.
  badge: Rental-Grade
  description: Наше арендуемое оборудование спроектировано таким образом, чтобы обеспечить максимальную долговечность и минимальные затраты на техническое обслуживание. Мы используем армированный ПВХ толщиной 1,2 мм с трехслойной технологией сварки горячим воздухом, которая устойчива к разрушению под воздействием ультрафиолета и частым повреждениям от столкновений. Конструкция Drop-stitch гарантирует, что доски сохранят жесткость даже после сотен циклов аренды. Все модели оснащены усиленными D-образными кольцами, устойчивыми к истиранию направляющими лентами и клапанами коммерческого класса.
  features:
    - title: Коммерческий ПВХ
      description: Армированный ПВХ толщиной 1,2 мм с УФ-стабилизаторами — в 3 раза толще, чем материалы потребительского класса.
    - title: Сварные швы горячим воздухом
      description: Трехслойная сварка плавлением — прочнее, чем клеевое соединение, устойчива к расслоению.
    - title: Жесткость стежка
      description: Сердечник 1680 DTEX с резьбой 2 на квадратный дюйм — рассчитан на давление 20 фунтов на квадратный дюйм для жесткости, как у оргалитового картона.
    - title: Готовая к эксплуатации конструкция
      description: Усиленные D-образные кольца, коммерческие клапаны Halkey-Roberts, износостойкие направляющие ленты.
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Материал трубки
      value: 1,0–1,2 мм Армированный ПВХ
    - label: Технология швов
      value: Трехслойная сварка горячим воздухом
    - label: Максимальное давление
      value: 15–20 фунтов на квадратный дюйм (модели с прямой строчкой)
    - label: Устойчивость к ультрафиолетовому излучению
      value: 1000+ часов ускоренного тестирования
    - label: Гарантия
      value: 2–5 лет в зависимости от модели
    - label: Обслуживание
      value: Минимум — промыть и хранить.
solution_c:
  tagline: Решение С
  title: Тендеры на яхты и роскошные водные суда
  subtitle: Легкие, высокопроизводительные RIB-тендеры, предназначенные для хранения суперяхт и перевозки гостей, с роскошной отделкой и отделкой.
  badge: Premium Series
  description: Наши RIB для яхтенных тендеров сочетают в себе легкую конструкцию и роскошную эстетику. Корпуса из алюминия или стекловолокна с глубоким V-образным вырезом обеспечивают исключительное качество езды и легкий подъем шлюпбалки. доступен с цветной графикой, обивкой премиум-класса и индивидуальной компоновкой консоли. Компактные размеры делают их идеальными для гаражей суперяхт и хранения на палубе.
  features:
    - title: Легкая конструкция
      description: Корпус из морского алюминия снижает вес на 30 % по сравнению с корпусом из стекловолокна, что упрощает подъем.
    - title: Производительность Deep-V
      description: Подъем корпуса на 18–22 градуса для плавного хода на чопе и отличного отслеживания движения.
    - title: Роскошная отделка и отделка
      description: Индивидуальная обивка, трубы подобранного цвета, рулевая консоль премиум-класса, упаковка из нержавеющей стали.
    - title: Компактное хранилище
      description: Разработан для гаражей суперяхт — надувные трубы для компактного хранения.
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Тип корпуса
      value: Глубокий V-образный алюминий/стекловолокно
    - label: Мертвый подъем
      value: 18–22 градуса
    - label: Максимальная скорость
      value: 30–40 узлов
    - label: Сухой вес
      value: 120–350 кг (корпус алюминиевый)
    - label: Давит Лифт Готов
      value: Да — стандартные точки подъема
    - label: Хранилище
      value: Надувные трубки, штабелируемые
