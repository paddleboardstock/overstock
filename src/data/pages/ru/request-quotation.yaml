hero_text:
  tagline: Получить предложение
  title: Запросить ценовое предложение<br /> для вашего проекта
  subtitle: Расскажите нам о своих требованиях, и наша команда ответит вам и предоставит подробное предложение в течение 2 рабочих дней.
steps2_process:
  title: Как это работает
  subtitle: Четыре простых шага от запроса до предложения.
  items:
    - title: Шаг 1. Отправьте свои требования
      description: Заполните форму ниже, указав тип, количество и характеристики вашего продукта. Чем больше подробностей вы предоставите, тем точнее будет ваше предложение.
      icon: tabler:file-text
    - title: 'Шаг 2: Мы проверяем и даем рекомендации'
      description: Наша команда инженеров рассмотрит ваши требования и может связаться с вами для уточнения. Предоставляем рекомендации по комплектации и опциям продукта.
      icon: tabler:users
    - title: 'Шаг 3: Получите ценовое предложение'
      description: Вы получаете подробное предложение, включая цену за единицу, минимальный заказ, время выполнения, условия оплаты и варианты доставки. Обычно в течение 48 часов.
      icon: tabler:currency-dollar
    - title: 'Шаг 4: Образец и производство'
      description: После принятия предложения мы приступаем к выборочному производству (если применимо) или непосредственно к серийному производству. Регулярные обновления на протяжении всего процесса.
      icon: tabler:building-factory
content_form:
  tagline: Форма предложения
  title: Расскажите нам о вашем проекте
  subtitle: Все поля, отмеченные *, являются обязательными.
  fields:
    - name: Категория продукта
      type: выбирать
      options:
        - Лодка RIB
        - Надувная лодка
        - SUP-доска
        - Надувной каяк
        - Спасательный жилет
        - Морской аксессуар
        - OEM/ODM на заказ
    - name: Приложение
      type: выбирать
      options:
        - Дайвинг-центр
        - Рыбалка
        - Морской туризм / Курорт
        - Поиск и спасение
        - Тендер для яхты
        - Коммерческое рабочее судно
        - Государственный / Военный
        - OEM / Собственный бренд
        - Личное / Для отдыха
        - Другое
    - name: Количество
      type: текст
      placeholder: например 50 единиц
    - name: Целевой рынок
      type: текст
      placeholder: например Европа, Северная Америка, Ближний Восток
    - name: Страна доставки
      type: текст
      placeholder: например Италия, ОАЭ, США, Австралия
    - name: Предпочтение материала
      type: выбирать
      options:
        - Без предпочтений
        - ПВХ морского класса (1100 dtex)
        - Премиум-гипалон / CSM
        - Стеклопластиковый корпус
        - Алюминиевый корпус
    - name: Требования к двигателю
      type: текст
      placeholder: например Подвесной двигатель мощностью 60 л.с., без двигателя, двойной мощностью 115 л.с.
    - name: Требуется настройка
      type: текст
      placeholder: например индивидуальные цвета, брендинг/логотип, упаковка, специальная фурнитура
    - name: Хронология
      type: текст
      placeholder: например доставка в течение 90 дней
    - name: Дополнительные требования
      type: текстовая область
      placeholder: Опишите ваше приложение, технические характеристики или любые особые требования — включите справочные чертежи, спецификации или ссылки, если таковые имеются.
    - name: Загрузить спецификацию
      type: файл
      placeholder: Загрузите спецификацию, чертеж или справочный документ (PDF, DWG, DXF)
    - name: Загрузить логотип/иллюстрацию
      type: файл
      placeholder: Загрузите свой логотип или изображение для индивидуального брендинга (AI, EPS, PNG).
content_rfq_types:
  tagline: Трехуровневая система запросов цен
  title: Выберите правильный<br />уровень запроса
  subtitle: Разные проекты требуют разного уровня детализации. Выберите форму, соответствующую вашему этапу покупки.
  items:
    - title: Быстрый запрос
      description: 5-6 полей, 30 секунд. Для первоначального контакта, общих вопросов или последующей загрузки ресурсов. Мы ответим в течение 24 часов и предоставим основную информацию и дальнейшие действия.
      icon: tabler:bolt
    - title: Стандартный запрос цен
      description: 8-10 полей, 2 минуты. Для получения конкретных предложений по продуктам с выбором модели, количеством и требованиями к доставке. Получите подробное предложение в течение 48 часов.
      icon: tabler:file-text
    - title: Запрос предложений по проекту
      description: 10-14 полей, 5 минут. Для RIB, курортного флота, спасательных или государственных проектов, требующих индивидуальной конфигурации, документации соответствия и многолетнего планирования поставок. Назначен выделенный менеджер проекта.
      icon: tabler:clipboard-list
form_quick:
  title: Быстрый запрос
  subtitle: Быстрый контакт для общих вопросов и запросов первичной информации.
  fields:
    - name: полное имя
      label: Полное имя
      type: текст
      required: true
      placeholder: Ваше полное имя
    - name: businessЭлектронная почта
      label: Деловая электронная почта
      type: электронная почта
      required: true
      placeholder: you@company.com
    - name: Название компании
      label: Название компании
      type: текст
      required: true
      placeholder: Ваша компания
    - name: Тип покупателя
      label: Я...
      type: выбирать
      required: true
      options:
        - Дистрибьютор / Импортёр
        - Владелец бренда / Собственная марка
        - Курорт / Водный центр
        - Оператор проката
        - Государственная / Спасательная организация
        - Оператор дайвинга / рыбалки
        - Судовой инженер / специалист по рефиту
        - Другое
    - name: продуктИнтерес
      label: Интерес к продукту
      type: множественный выбор
      required: true
      options:
        - Лодки RIB
        - Надувные лодки
        - SUP-доски
        - Спасательное оборудование
        - Аксессуары
        - OEM/ODM на заказ
    - name: сообщение
      label: Что вам нужно?
      type: текстовая область
      required: false
      placeholder: Краткое описание ваших требований...
form_standard:
  title: Стандартный запрос цен
  subtitle: Подробный запрос цен на конкретные продукты и количества.
  fields:
    - name: полное имя
      label: Полное имя
      type: текст
      required: true
    - name: businessЭлектронная почта
      label: Деловая электронная почта
      type: электронная почта
      required: true
    - name: Название компании
      label: Название компании
      type: текст
      required: true
    - name: Тип покупателя
      label: Тип покупателя
      type: выбирать
      required: true
    - name: модель продукта
      label: Модель/тип продукта
      type: текст
      required: true
      placeholder: например, AF580 RIB, AF380 Надувная лодка
    - name: количество
      label: Расчетное количество
      type: текст
      required: true
      placeholder: например, 10-20 единиц
    - name: целевой рынок
      label: Целевой рынок/регион
      type: текст
      required: true
      placeholder: например, ЕС, Северная Америка, Ближний Восток
    - name: сроки доставки
      label: Желаемая доставка
      type: выбирать
      required: true
      options:
        - В течение 30 дней
        - 30-60 дней
        - 60-90 дней
        - Заблаговременное планирование (90+ дней)
        - Просто изучаю
    - name: соответствиеОбязательно
      label: Требования соответствия
      type: множественный выбор
      required: false
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - Нет / Не уверен
    - name: сообщение
      label: Дополнительные сведения
      type: текстовая область
      required: false
form_project:
  title: Запрос предложений по проекту
  subtitle: Комплексный запрос проекта для автопарка, таможенных или государственных закупок.
  fields:
    - name: полное имя
      label: Полное имя
      type: текст
      required: true
    - name: businessЭлектронная почта
      label: Деловая электронная почта
      type: электронная почта
      required: true
    - name: Название компании
      label: Название компании
      type: текст
      required: true
    - name: Тип покупателя
      label: Тип покупателя
      type: выбирать
      required: true
    - name: Тип проекта
      label: Тип проекта
      type: выбирать
      required: true
      options:
        - Флот курорта / отеля
        - Арендный флот
        - Спасательный / патрульный флот
        - Флот дайвинг-центра
        - Государственные закупки
        - Собственная марка / OEM
        - Заказ склада дилера
        - Другое
    - name: Типы лодок
      label: Требуемые типы лодок
      type: множественный выбор
      required: true
      options:
        - Лодки RIB
        - Надувные лодки / динги
        - SUP-доски
        - Каяки
        - Спасательное оборудование
    - name: Размер флота
      label: Размер парка/количественный диапазон
      type: текст
      required: true
      placeholder: например, 20-50 единиц в течение 12 месяцев
    - name: пользовательские требования
      label: Требования к индивидуальной конфигурации
      type: текстовая область
      required: false
      placeholder: Размер корпуса, материал труб, расположение палубы, требования к брендингу...
    - name: соответствиеОбязательно
      label: Требования соответствия и сертификации
      type: множественный выбор
      required: true
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG Type III/V
        - ISO 9001
        - BSCI
        - REACH / RoHS
        - Сертификация для местного рынка
    - name: целевой рынок
      label: Целевой рынок
      type: текст
      required: true
    - name: диапазон бюджета
      label: Бюджетный диапазон
      type: выбирать
      required: false
      options:
        - Менее $10,000
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - Предпочитаю не указывать
    - name: сроки доставки
      label: График реализации проекта
      type: выбирать
      required: true
      options:
        - Срочно (в течение 30 дней)
        - Стандартно (30-60 дней)
        - Запланировано (60-90 дней)
        - Планы на будущее (90+ дней)
    - name: сообщение
      label: Детали проекта и требования
      type: текстовая область
      required: false
      placeholder: Опишите свой проект, приложение и любые конкретные требования...
cta:
  title: Предпочитаете обсудить по электронной почте?
  subtitle: Отправьте запрос непосредственно в наш отдел продаж, и мы ответим в течение 24 часов.
  actions:
    - variant: primary
      text: Напишите нам напрямую
      href: /contact
