hero:
  tagline: График знаний
  title: Знания о водных исследованиях
  subtitle: |
    Структурированная база знаний, охватывающая SUP надувные технологии,<br />
    Водная безопасность, инженерное дело и планирование приключений.
  taglineSection: Исследуй. Учись. Иди уверенно.
clusters:
  tagline: Кластеры знаний
  title: Исследуйте по темам
  subtitle: Глубокое исследование технологий, безопасности и навыков, стоящих за Paddle Board Overstock каждым продуктом.
  items:
    - title: SUP Знания
      description: От выбора первой доски до продвинутых техник туринга — всё, что связано с падлбордингом стоячиком.
      icon: tabler:lifebuoy
      topics:
        - Как выбрать первую надувную машину SUP
        - Лучший SUP размер для начинающих
        - Насколько сложен падлбординг?
        - Сравнение надувной и жёсткой доски
        - SUP Чек-лист безопасности
    - title: Технология плат
      description: Технические глубокие исследования drop-stitch сердечников, PVC ламинатов, рельсов и клапанов — как SUPs надувные устройства проектируются.
      icon: tabler:anchor
      topics:
        - Как делают надувные SUPs
        - PVC Объяснение слоёв ламинации
        - Строительство рельсов и шва
        - Drop-stitch Глубокое погружение в технологии
        - EVA Объяснение оформления колоды
    - title: Знания по безопасности
      description: Важные знания о безопасности для каждого гребца — от PFD выбора до прогнозирования погоды и методов самоспасения.
      icon: tabler:shield
      topics:
        - SUP Чек-лист безопасности
        - Тебе нужен спасательный жилет?
        - Руководство по безопасности плавания в океане
        - Безопасность для гребцов в реках и течениях
        - Осведомленность о погодных условиях и состоянии воды
    - title: Технология
      description: Инженерия, лежащая в Paddle Board Overstock основе продуктов — материалов, методов строительства и тестирования качества.
      icon: tabler:microscope
      topics:
        - Технология морского класса PVC
        - Объяснение Drop-stitch ядра
        - Почему PSI важен для надувных SUPs
        - Сварка RF против склеивания
        - Контроль качества каждой доски
    - title: Знания для клубов и проката
      description: Практические руководства по управлению программой SUP — от операций проката до флотов курортов и клубов.
      icon: tabler:briefcase
      topics:
        - Как начать арендный бизнес SUP
        - Строительство курортного центра водных видов спорта
        - Определение размеров парка досок для катания на досках для клубов
        - Надувной или жесткий SUP для коммерческого использования
        - Лучшие SUP доски для прокатных флотов
        - Стратегии получения доходов от водных видов спорта на курортах
        - Руководство по обслуживанию торгового оборудования
