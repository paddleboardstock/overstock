testimonial:
  content: Компания Aquafarer спроектировала и оборудовала всю нашу программу пляжных развлечений на трех курортных объектах. 80 SUP, 40 каяков, инфраструктура безопасности и обучение персонала — все доставлено одной партией. В первом сезоне участие наших гостей в водных развлечениях выросло на 60%.
  name: Софи Лоран
  title: Директор по работе с гостями, Azure Bay Resorts — Пхукет, Таиланд
content_segments:
  tagline: Профили курортов
  title: Решения для гостиничного бизнеса на набережной<br />По типу объекта недвижимости
  subtitle: Каждый курортный отель имеет уникальный профиль гостей, набор мероприятий и ритм работы — от бутик-эко-домиков до обширных роскошных пляжных курортов. Мы разрабатываем программы водных видов спорта, соответствующие классу отеля и ожиданиям гостей.
  items:
    - title: Шикарные Курорты На Море
      subtitle: VIP-трансферы, водные развлечения, впечатления премиум-класса
      description: Элитные пляжные отели — Four Seasons, Aman и подобные им роскошные группы, — где водные виды спорта являются выдающимся развлечением для гостей, обеспечивающим показатели удовлетворенности и дополнительный доход. Автопарк должен выглядеть премиально, предлагать разнообразие для разных возрастных групп и уровней способностей, а также легко интегрироваться с существующими системами консьержа и бронирования курорта. Ожидания гостей от внешнего вида чрезвычайно высоки — состояние оборудования и презентация напрямую влияют на 5-звездочные отзывы.
      features:
        - 'Фирменный флот премиум-класса: SUP, каяки, водные велосипеды и небольшие тендеры RIB'
        - 'Оформление, готовое к приему гостей: цвета в стиле курорта, брендинг с логотипом, эффектно представленное снаряжение'
        - Небольшой люксовый RIB для трансфера VIP-гостей с индивидуальной обивкой и подбором цветов
        - 'Интегрированная инфраструктура безопасности: буйковые линии, спасательные посты, AED'
        - 'Управление выручкой: шаблоны динамического ценообразования, обучение дополнительным продажам, комплектация пакетов'
    - title: Частные островные курорты
      subtitle: Всепогодный гостевой транспорт — ноль простоев, абсолютная надежность
      description: Частные островные курорты работают в отдаленных местах, где лодка — единственное сообщение с материком. Ежедневные перевозки гостей, перевозки грузов и экстренная медицинская эвакуация зависят от одного судна — любой простой напрямую влияет на качество обслуживания гостей и работу курорта. Этим операторам нужна лодка, которая надежно работает в любых погодных условиях, требует минимального обслуживания и имеет резервные системы для обеспечения надежности в критически важных ситуациях. Лодка также должна красиво выглядеть по прибытии гостей на остров.
      features:
        - Всепогодная конфигурация RIB с полной защитой от непогоды и усиленными баллонами
        - Комплектация двумя двигателями или резервным двигателем для работы без простоев
        - Конструкция Hypalon коммерческого класса со сроком службы 5-8 лет в удаленных условиях эксплуатации
        - Простая в уходе конструкция с легкодоступными компонентами для сервисного обслуживания на месте
        - Индивидуальный брендинг курорта и премиальная обивка в соответствии с эстетикой острова
    - title: Лейксайд и эко-курорты
      subtitle: Впечатления гостей, интегрированные в природу
      description: Недвижимость на берегу озера, эко-домики и места отдыха на природе, предлагающие тихие водные развлечения с низким уровнем воздействия, дополняющие природную среду. Оборудование должно быть, по возможности, безмоторным, легко храниться в эллингах с ограниченным пространством и быть бесшумным в использовании, чтобы сохранить атмосферу для всех гостей.
      features:
        - 'Безмоторный флот: SUP, каяки, каноэ и водные велосипеды'
        - Тихие станции накачивания с электронасосом для использования гостями по требованию
        - Экологичные материалы и упаковка в соответствии с брендингом устойчивого развития
        - Включены стойки для хранения и системы организации эллингов
    - title: Пляжные клубы
      subtitle: Трансферы для гостей, развлечения, небольшие роскошные надувные лодки.
      description: Пляжные клубы представляют собой энергичную, визуально ориентированную среду, где оборудование является частью атмосферы. Им нужны небольшие роскошные надувные лодки для трансфера гостей из близлежащих отелей или доков, а также водные игрушки для развлечения гостей — буксировка гидроциклов, надувные горки и доски для серфинга. Автопарк должен выглядеть стильно, быть простым в управлении и выдерживать ежедневное использование гостями разного уровня подготовки. Хранение и быстрое развертывание имеют решающее значение в часы пик.
      features:
        - Компактный люксовый RIB (3,3-4,3 м) для трансфера гостей и тендерного обслуживания
        - 'Водные развлечения: буксируемые надувные аттракционы, доски SUP, каяки для развлечения гостей'
        - Индивидуальный цвет и брендинг в соответствии с визуальной идентичностью пляжного клуба
        - Системы быстрого спуска на воду и подъема для операций с высокой оборачиваемостью
        - Прочная конструкция Hypalon для ежедневного воздействия соленой воды и ультрафиолета
    - title: Частные клубы и яхт-клубы
      subtitle: Портовый транспорт, членские тендеры, эксклюзивные водные виды спорта
      description: Частные клубы, в которых водные виды спорта и лодочный транспорт являются выгодой для членов, а не источником дохода. Оборудование должно соответствовать более высоким эстетическим стандартам, быть доступным для участников по требованию и требовать минимального контроля со стороны персонала. Яхт-клубам пристани особенно нужны тендеры на портовый транспорт — перемещение членов между причалом, причалом и берегом. Хранение и обслуживание должны быть невидимы для участников.
      features:
        - Тендеры RIB высокого класса для портового транспорта и услуги трансфера членов клуба
        - 'Оборудование премиум-класса: палубы EVA, фирменные цвета членов клуба, брендированная обивка'
        - Система самостоятельной выдачи снаряжения для доступа членов без персонала
        - Хранение в межсезонье и ежегодная программа обновления
    - title: Отели, ориентированные на приключения и активный отдых
      subtitle: Экскурсии, SUP-йога, экскурсии с маской и трубкой, групповые мероприятия.
      description: Отели, позиционирующие себя как места для приключений — предлагают туры с гидом, SUP-йогу, катание на закате, экскурсии с подводным плаванием и групповые мероприятия. Автопарк должен поддерживать модели как бесплатной аренды, так и программ с гидом, с оборудованием, которое плавно переключается между самостоятельным использованием гостей и экскурсиями под руководством инструктора. Эти объекты нуждаются в прочном оборудовании, обеспечивающем частую смену гостей и упрощающую уборку между группами гостей.
      features:
        - Универсальный смешанный флот для моделей аренды + экскурсий с гидом
        - Двухместные каяки и сверхустойчивые платформы SUP для групповых занятий
        - 'Снаряжение для гидов: доски инструкторов, герметичные боксы, водонепроницаемая связь'
        - 'Сезонная ротация снаряжения: летний флот → программа зимнего хранения'
        - Прочная конструкция, рассчитанная на ежедневное использование гостями при минимальном обслуживании
