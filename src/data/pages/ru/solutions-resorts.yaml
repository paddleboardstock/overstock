testimonial:
  content: Paddle Board Overstock разработала и оснастила всю нашу программу пляжных мероприятий на трех курортных объектах. 120 SUPs, средства безопасности и обучение персонала — все доставлено в одной партии. Участие гостей в водных развлечениях увеличилось на 60% в первый сезон.
  name: Софи Лоран
  title: Директор по работе с гостями, Azure Bay Resorts — Пхукет, Таиланд
content_segments:
  tagline: Профили курортов
  title: Решения для гостеприимства на набережной<br />По типу объекта
  subtitle: Каждый курортный отель имеет уникальный профиль гостей, набор мероприятий и ритм работы — от бутик-эко-домиков до обширных роскошных пляжных курортов. Мы разрабатываем программы водных видов спорта, соответствующие классу отеля и ожиданиям гостей.
  items:
    - title: Шикарные Курорты На Море
      subtitle: VIP-трансферы, водные развлечения, впечатления премиум-класса
      description: Элитные пляжные отели — Four Seasons, Aman и подобные им роскошные группы, — где водные виды спорта являются выдающимся развлечением для гостей, обеспечивающим показатели удовлетворенности и дополнительный доход. Автопарк должен выглядеть премиально, предлагать разнообразие для разных возрастных групп и уровней способностей, а также легко интегрироваться с существующими системами консьержа и бронирования курорта. Ожидания гостей от внешнего вида чрезвычайно высоки — состояние оборудования и презентация напрямую влияют на 5-звездочные отзывы.
      features:
        - Премиум-автопарк SUPs в цветах курорта
        - 'Презентация для гостей: цвета, соответствующие курорту, брендинг логотипа, выставка оборудования'
        - Фирменные доски из арт-серии для премиальных впечатлений гостей и фотомоментов
        - 'Интегрированная инфраструктура безопасности: буйковые линии, пункты спасателей, AED'
        - 'Управление доходами: динамические шаблоны ценообразования, обучение дополнительным продажам, комплектные пакеты'
    - title: Частные островные курорты
      subtitle: Тихие, самодостаточные гостевые водные активности
      description: 'Частные островные курорты работают в отдалённых местах, где логистика сложна и каждая доставка имеет значение. Водные объекты для гостей должны быть самодостаточными: оборудование, которое компактно хранится, надувается по требованию, требует минимального обслуживания и красиво презентуется при прибытии гостей. Мы планируем программы флота вокруг окон гидросамолётов и морских грузов, а наша надёжная конструкция поддерживает оборудование в готовности гостей в течение долгих сезонов без поддержки материка.'
      features:
        - Компактный надувной флот — эффективно отправляет и припадает на удалённых островах
        - PVC Коммерческое строительство для многосезонного гостевого использования
        - Простое обслуживание на месте с комплектами для ремонта и видеоинструкциями
        - Индивидуальный брендинг курорта, соответствующий эстетике острова
    - title: Лейксайд и эко-курорты
      subtitle: Впечатления гостей, интегрированные в природу
      description: Прибрежные объекты, эко-лоджи и природные отдыхи предлагают тихие, низкоэффективные водные активности, которые гармонируют с природной средой. Оборудование должно быть немоторизованным, удобным для хранения там, где ограничено пространство, и тихим, чтобы сохранить атмосферу для всех гостей.
      features:
        - Серия искусства о немоторизованном SUP парке в природе
        - Тихие станции надувки электрических насосов для использования гостями по требованию
        - Экологичные материалы и упаковка, соответствующие брендингу устойчивого развития
        - Стеллажи для хранения и системы организации у причала включали
    - title: Пляжные клубы
      subtitle: Гостевые развлечения и атмосфера на набережной
      description: Пляжные клубы работают в энергичной, визуально ориентированной среде, где оборудование является частью атмосферы. Им нужны стильные доски для развлечения гостей, SUP аренда для пляжных мероприятий и оборудование, которое выглядит не хуже, чем само заведение. Парк должен быть прост в эксплуатации, выдерживать ежедневное использование гостями с разным уровнем мастерства и быстро разворачиваться в часы пик.
      features:
        - Фирменные арт-серии SUPs , которые одновременно служат декором площадки
        - Автопарк, готовый к SUP аренде для развлечений гостей
        - Индивидуальный цвет и брендинг, соответствующие визуальному стилю пляжного клуба
        - Системы быстрого запуска и извлечения для операций с высокой текучностью кадров
        - UV-устойчивая конструкция для ежедневного воздействия солёной воды
    - title: Частные клубы и яхт-клубы
      subtitle: Члены водных видов спорта и эксклюзивные программы гребли
      description: Частные клубы, где водные виды спорта являются преимуществом для членов, а не источником дохода. Оборудование должно соответствовать более высоким эстетическим стандартам, быть доступным по запросу для членов и требовать минимального контроля персонала. Яхт-клубы марины используют брендированные SUP флоты для отдыха членов вокруг гавани. Хранение и обслуживание должны быть невидимы для членов.
      features:
        - SUP Премиальные брендовые автопарки для водных видов спорта.
        - 'Премиальное снаряжение: EVA колоды, индивидуальные цвета для членов, фирменная обивка'
        - Система самообслуживания для доступа участников без персонала
        - Внесезонье хранения и ежегодная программа обновления
    - title: Отели, ориентированные на приключения и активный отдых
      subtitle: Экскурсии, SUP-йога, экскурсии с маской и трубкой, групповые мероприятия.
      description: Отели, позиционирующие себя как места для приключений — предлагают туры с гидом, SUP-йогу, катание на закате, экскурсии с подводным плаванием и групповые мероприятия. Автопарк должен поддерживать модели как бесплатной аренды, так и программ с гидом, с оборудованием, которое плавно переключается между самостоятельным использованием гостей и экскурсиями под руководством инструктора. Эти объекты нуждаются в прочном оборудовании, обеспечивающем частую смену гостей и упрощающую уборку между группами гостей.
      features:
        - Универсальный смешанный флот, поддерживающий модели аренды + с экскурсиями с гидом
        - Сверхустойчивые платформы SUP для групповых мероприятий
        - 'Оборудование для гида: доски для инструктора, герметичные коробки, водонепроницаемые средства связи'
        - 'Сезонная ротация оборудования: летний флот → зимняя программа хранения'
        - Прочная конструкция, рассчитанная на ежедневное использование гостями при минимальном обслуживании
