hero:
  tagline: Отели, курорты и гостиничный бизнес
  title: Премиальные впечатления на набережной<br />Для отелей, курортов и яхт-клубов
  subtitle: Программы водных видов спорта «под ключ» для пляжных отелей, частных островных курортов, пляжных клубов и яхт-клубов — от снаряжения для гостей и тендеров на надувные лодки до систем безопасности и обучения персонала.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Надувные лодки Aquafarer для курортного отдыха на набережной
direct_answer: Aquafarer сотрудничает с отелями, курортами, частными островами, пляжными клубами и яхт-клубами по всему миру, чтобы создать первоклассные впечатления на набережной. Наши решения включают в себя арендуемые SUP-парки, экскурсионные каяки, тендерные надувные лодки для перевозки гостей, небольшие роскошные надувные лодки для трансфера в пляжный клуб и комплексные системы безопасности. На каждую единицу оборудования можно нанести логотип и цветовую гамму вашего объекта. Мы также обеспечиваем обучение персонала, консультации по разработке программ и планирование замены автопарка, чтобы обеспечить стабильное качество в зависимости от сезона.
solution_offerings:
  - title: Стандартный курортный пакет
    subtitle: Для небольших и средних объектов (50–150 номеров)
    badge: Popular
    features:
      - title: Гостевой флот
        description: 20–50 SUP и каяков с фирменными цветами и логотипами курорта.
      - title: Инфраструктура безопасности
        description: Стенды спасателей, буйки, знаки безопасности и пункты первой помощи.
      - title: Хранение и обслуживание
        description: Стеллажные системы, станции накачивания и контрольные списки ежедневных проверок
      - title: Обучение персонала
        description: Инструктаж на месте для персонала по обращению с оборудованием и безопасности гостей
      - title: Запуск поддержки
        description: Сборник программ с шаблонами цен, формами отказа и графиками мероприятий.
    cta_text: Разработать мое решение для курорта
    cta_href: /contact
  - title: Курортный пакет «Премиум»
    subtitle: Для элитной недвижимости и крупномасштабных операций
    badge: Premium
    features:
      - title: Премиум-парк
        description: Более 50–100 SUP-серфингов, каяков, водных велосипедов и тендерных надувных лодок с полной настройкой.
      - title: Повышенная безопасность
        description: Вышки спасателей, радиосистема, спасательный щит, AED и план действий в чрезвычайной ситуации.
      - title: Гостевой опыт
        description: Киоск регистрации, витрина оборудования, кабинки для переодевания, хранилище на пляже.
      - title: Программа доходов
        description: Руководство по динамическому ценообразованию, обучение дополнительным продажам, стратегии комплектации пакетов
      - title: Сезонная поддержка
        description: Хранение в межсезонье, осмотр в конце сезона, обновление заказа
    cta_text: Улучшить впечатления от курорта
    cta_href: /contact
