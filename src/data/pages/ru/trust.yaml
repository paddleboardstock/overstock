  subtitle: Каждый продукт независимо протестирован; 64 модели имеют сертификацию CE по международным стандартам.
  columns: 3
  isBeforeContent: true
  items:
    - title: Сертификация CE
      description: 64 модели с сертификацией CE в категориях SUP, байдарки, тузики и RIB соответствуют европейскому стандарту безопасности CE для прогулочных плавсредств. Каждое изделие проходит испытания давлением, плавучестью и нагрузкой перед отправкой с фабрики.
      icon: tabler:certificate
    - title: ''
      description: Наше помещение в Циндао площадью 12 000 м² работает по системе менеджмента качества ISO 9001:2015. Каждая производственная партия отслеживаема, документирована и проверена.
      icon: tabler:clipboard-check
    - title: Социальное соответствие BSCI
      description: Мы сертифицированы BSCI, что гарантирует этичные трудовые практики, безопасные условия труда и экологическую ответственность во всей цепочке поставок.
      icon: tabler:users
    - title: REACH и RoHS
      description: Все материалы — ПВХ, Hypalon, пена EVA, клеи — соответствуют правилам ЕС REACH и RoHS. Никаких запрещенных веществ, никаких компромиссов.
      icon: tabler:flask
    - title: Лаборатория испытаний материалов
      description: Внутренняя лаборатория испытывает прочность на разрыв, УФ-стойкость, целостность швов и истирание для каждой партии ткани перед производством.
      icon: tabler:microscope
    - title: Гарантия 2 года
      description: Каждый продукт Aquafarer поставляется с двухлетней гарантией на производственные дефекты. Мы отвечаем за то, что создаем.
      icon: tabler:shield-check
