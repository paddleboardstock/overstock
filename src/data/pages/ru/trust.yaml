      name: Джеймс Торнтон
      title: SUP Владелец Explorer 11 — Ванкувер, Канада
features3_lab:
  title: Собственная лаборатория тестирования и качества
  subtitle: Каждая партия материала и готовая продукция перед отправкой проходят через нашу испытательную лабораторию на месте.
  columns: 3
  isBeforeContent: true
  items:
    - title: Испытание прочности на растяжение
      description: 'Каждый PVC рулон ткани тестируется на прочность на растяжение внутри компании. Минимальное требование: 350 Н/см основы и утка. Отклонённые партии возвращаются поставщику — мы отклоняем примерно 3% поступающих материалов.'
      icon: tabler:scale
    - title: UV Ускоренное старение
      description: Образцы ткани проходят ускоренное выветривание продолжительностью 1000 часов UV . Прочность на растяжение должна сохраняться+ 80% после воздействия. Изделия, рассчитанные на 3+ года использования на открытом воздухе.
      icon: tabler:sun
    - title: Прочность отслоения шва
      description: Сварные швы тестируются с минимальной прочностью на отслоение 5 Н/мм. В каждой серийной партии образцы швов проходят разрушительные испытания и архивируются.
      icon: tabler:stack
    - title: Удержание давления в течение 24–48 часов
      description: 'Каждое надувное изделие накачивается до номинального значения PSI в 1,25 раза и контролируется в течение 24–48 часов. Максимально допустимое падение давления: 5%. Продукты, не прошедшие этот тест, перерабатываются и проходят повторное тестирование перед отправкой.'
      icon: tabler:wind
    - title: Испытания циклов клапанов
      description: Каждая конструкция клапана проходит 10 000 циклов открытия-закрытия в нашей лаборатории. Клапаны должны поддерживать герметичность при давлении 1,25x после цикла. Все Paddle Board Overstock клапаны рассчитаны на 5+ лет регулярного использования.
      icon: tabler:rotate
    - title: Сопротивление холодному растрескиванию
      description: Материалы тестируются при -30°C в течение 4 часов. Трещины и хрупкость не допускаются. Продукция, рассчитанная на зимнее хранение и использование в холодной воде при температуре окружающей среды до -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Как мы обеспечиваем качество
  subtitle: От инспекции сырья до финального испытания под давлением — каждый продукт проходит строгую цепочку качества.
  items:
    - title: Инспекция сырья
      description: Каждый рулон PVC ткани тестируется на толщину, прочность на растяжение UV и сопротивление перед началом производства.
      icon: tabler:search
    - title: Контроль качества в процессе
      description: Швы сварки, установка клапанов и соединения камер проверяются на каждой станции во время сборки.
      icon: tabler:eye
    - title: Испытание давлением
      description: Каждый надувной продукт надувается до 1,25x PSI и держится в течение 24–48 часов для проверки удержания воздуха и целостности шва.
      icon: tabler:wind
    - title: Итоговая инспекция
      description: Каждое устройство проходит проверку на отделку, оборудование и упаковку перед одобрением на отправку. Партии образцов поступают в нашу лабораторию для проведения деструктивного контроля.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Часто задаваемые вопросы по форуму
  subtitle: Распространённые вопросы о наших стендап-паддлбордах.
  columns: 2
  items:
    - title: Какие SUP размеры плат доступны?
      description: Мы предлагаем SUP доски от 9 до 12 футов, включая универсальные, туристические, йога и специализированные дизайны. Наши самые продаваемые модели включают Tropical Breeze (10 футов) и Ocean Voyager (11 футов).
    - title: Что такое drop-stitch строительство?
      description: Drop-stitch Конструкция использует тысячи полиэфирных резьб, соединяющих верхний и нижний слои доски, что позволяет ей выдерживать высокое давление воздуха (15–20 PSI) и обеспечивать жёсткую, устойчивую платформу. Это отраслевый стандарт для премиальных SUPs надувных кабинах.
    - title: Каков предел веса SUP досок?
      description: Наши SUP доски выдерживают до 150 кг в зависимости от модели и объёма. Leviathan Wake — наша самая большая вместимость модель, предназначенная для крупных райдеров и йоги.
    - title: Предлагаете ли вы SUP полные пакеты?
      description: Да. Каждая SUP плата поставляется с полным комплектом, включая алюминиевую лопатку из трёх частей, ручной насос высокого давления, поводок с катушкой, дорожный рюкзак и комплект для ремонта. Некоторые модели также оснащены съемным набором плавников.
    - title: Какова гарантия на SUP платы?
      description: Все Paddle Board Overstock SUP платы имеют двухлетнюю гарантию на производственные дефекты, включая разрушения швов, дефекты клапанов и деламинацию материалов при обычном использовании.
    - title: Сколько времени занимает надувание SUP платы?
      description: С использованием включённого ручного насоса полное накачивание до 15 PSI занимает примерно 8–12 минут. Для более быстрого надувания мы рекомендуем наш Paddle Board Overstock электрический насос на 12 В, который надувает плату менее чем за 4 минуты.
