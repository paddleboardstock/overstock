features3_certifications:
  title: Качество и тестирование
  subtitle: Каждая плата тестируется в нашей собственной лаборатории перед отправкой — реальные числа, реальные записи, никаких маркетинговых заявлений.
  columns: 3
  isBeforeContent: true
  items:
    - title: Построено на нашей собственной фабрике
      description: Мы владеем и управляем предприятием в Вэйхай площадью 12 000 м². Каждая производственная партия отслеживается, документируется и проверяется — без аутсорсингового тайного производства.
      icon: tabler:building-factory
    - title: Лаборатория испытаний материалов
      description: Внутренняя лаборатория материалов проверяет прочность на растяжение, UV сопротивление, целостность шва и стирание для каждой партии ткани перед производством.
      icon: tabler:microscope
    - title: Морские материалы
      description: UV- PVC стабилизированная, drop-stitch сердечник и EVA пена для палубы — выбрана и протестирована для сезонов солнца, соли и злоупотребления.
      icon: tabler:flask
    - title: 2-летняя SUP гарантия
      description: Paddle Board Overstock SUP Платы покрываются двухлетней гарантией на производственные дефекты, включая швы, клапаны и расслоение материалов. Мы поддерживаем то, что создаём.
      icon: tabler:shield-check
testimonials:
  tagline: Доверие клиентов
  title: Что говорят наши клиенты
  subtitle: От новичков до опытных исследователей — узнайте, почему они Paddle Board Overstock доверяют.
