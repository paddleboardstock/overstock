features3_lab:
  title: Собственная лаборатория тестирования и качества
  subtitle: Каждая партия материала и готовая продукция перед отправкой проходят через нашу испытательную лабораторию на месте.
  columns: 3
  isBeforeContent: true
  items:
    - title: Испытание прочности на растяжение
      description: 'Every PVC fabric roll is tested for tensile strength in-house. Minimum requirement: 350 N/cm warp and weft. Rejected batches are returned to supplier — we reject approximately 3% of incoming materials.'
      icon: tabler:scale
    - title: UV Accelerated Aging
      description: Fabric samples undergo 1,000-hour accelerated UV weathering. Tensile strength must retain 80%+ after exposure. Products rated for 3+ years of outdoor use.
      icon: tabler:sun
    - title: Seam Peel Strength
      description: Welded seams are tested to a 5 N/mm minimum peel strength. Each production batch has seam samples destructively tested and archived.
      icon: tabler:stack
    - title: Удержание давления в течение 24–48 часов
      description: 'Каждое надувное изделие накачивается до номинального значения PSI в 1,25 раза и контролируется в течение 24–48 часов. Максимально допустимое падение давления: 5%. Продукты, не прошедшие этот тест, перерабатываются и проходят повторное тестирование перед отправкой.'
      icon: tabler:wind
    - title: Valve Cycle Testing
      description: Every valve design undergoes 10,000 open-close cycles in our lab. Valves must maintain airtight seal at 1.25x rated pressure after cycling. All Paddle Board Overstock valves rated for 5+ years of regular use.
      icon: tabler:rotate
    - title: Сопротивление холодному растрескиванию
      description: Materials are tested at -30°C for 4 hours. No cracking or embrittlement allowed. Products rated for winter storage and cold-water use down to -10°C ambient temperature.
      icon: tabler:snowflake
steps2_manufacturing:
  title: How we ensure quality
  subtitle: From raw material inspection to final pressure testing — every product goes through a rigorous quality chain.
  items:
    - title: Raw Material Inspection
      description: Every roll of PVC fabric is tested for thickness, tensile strength, and UV resistance before entering production.
      icon: tabler:search
    - title: In-Process QC
      description: Weld seams, valve installations, and chamber bonds are inspected at each station during assembly.
      icon: tabler:eye
    - title: Испытание давлением
      description: Every inflatable product is inflated to 1.25x rated PSI and held for 24–48 hours to verify air retention and seam integrity.
      icon: tabler:wind
    - title: Final Inspection
      description: Each unit is inspected for finish, hardware, and packaging before being approved for shipment. Batch samples go to our lab for destructive testing.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Board FAQs
  subtitle: Common questions about our stand-up paddle boards.
  columns: 2
  items:
    - title: What SUP board sizes are available?
      description: We offer SUP boards from 9 ft to 12 ft, including all-round, touring, yoga, and specialty designs. Our best-selling models include the Tropical Breeze (10 ft) and Ocean Voyager (11 ft).
    - title: What is drop-stitch construction?
      description: Drop-stitch construction uses thousands of polyester threads connecting the top and bottom layers of the board, allowing it to hold high air pressure (15–20 PSI) and achieve a rigid, stable platform. This is the industry standard for premium inflatable SUPs.
    - title: What is the weight limit for SUP boards?
      description: Our SUP boards support up to 150 kg depending on the model and volume. The Leviathan Wake board is our highest-capacity model, designed for larger riders and yoga use.
    - title: Do you offer complete SUP packages?
      description: Yes. Every SUP board ships with a complete package including a 3-piece aluminum paddle, high-pressure hand pump, coil leash, travel backpack, and repair kit. Some models also include a removable fin set.
    - title: What is the warranty on SUP boards?
      description: All Paddle Board Overstock SUP boards carry a 2-year warranty against manufacturing defects, including seam failure, valve defects, and material delamination under normal use.
    - title: How long does it take to inflate a SUP board?
      description: Using the included hand pump, a full inflation to 15 PSI takes approximately 8–12 minutes. For faster inflation, we recommend our Paddle Board Overstock 12V electric pump, which inflates a board in under 4 minutes.
