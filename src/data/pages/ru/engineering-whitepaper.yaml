section_testing:
  title: Протоколы испытаний и безопасности
  subtitle: Система обеспечения качества Paddle Board Overstock для каждой партии продукции
  protocols:
    - title: 1,25-кратное номинальное испытание на удержание давления
      description: Каждый собранный сосуд накачивают до давления, в 1,25 раза превышающего его номинальное рабочее давление, и выдерживают в течение 24–48 часов. Любое падение давления, превышающее 2%, приводит к браковке и доработке.
      standard: ИСО 6185
    - title: Испытание на прочность шва на отслаивание
      description: Образцы сварных и клеевых швов из каждой производственной партии проверяются на прочность на отслаивание с использованием калиброванного оборудования для натяжения. Требуется сопротивление отслаиванию минимум 4 кН/м.
      standard: ИСО 2411
    - title: Испытание ткани на растяжение
      description: Поступающие рулоны ткани проходят испытания на прочность на разрыв и удлинение как в направлении основы, так и в направлении утка. Порог отбраковки для ПВХ ниже 3000 Н/5 см.
      standard: ИСО 1421
    - title: УФ-ускоренное выветривание
      description: Образцы материалов подвергаются ускоренному УФ-облучению в течение более 1000 часов в испытательных камерах QUV. Допускается максимальная потеря прочности на растяжение 15%.
      standard: АСТМ Г154
    - title: Целостность клапана и фитинга
      description: Каждый узел клапана проверяется на целостность уплотнения при давлении, превышающем номинальное в 1,25 раза. Обратные клапаны проверяются на герметичность одностороннего уплотнения.
      standard: ИСО 12402
