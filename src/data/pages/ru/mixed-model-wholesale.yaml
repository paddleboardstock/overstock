who_benefits:
  tagline: Кому это может быть полезно
  title: Для кого предназначена оптовая продажа смешанных моделей
  items:
    - title: Новички-импортеры
      description: Тестируют категорию SUP с разнообразными моделями вместо того, чтобы сразу заказывать оптом одну модель SKU.
    - title: Сезонные пляжные магазины
      description: Магазины, которым нужны начальные доски для туристов и премиальные версии для местных жителей — в одном заказе на пополнение.
    - title: Онлайн-продавцы
      description: Одновременное размещение нескольких моделей, чтобы понять, какое оформление, длина и назначение продаются лучше.
    - title: Арендные автопарки и школы
      description: Флоты, которым нужны разные размеры досок для разных весов райдеров и типов уроков, а не флоты с одной спецификацией.
faq_section:
  title: Часто задаваемые вопросы о смешанных моделях
  items:
    - q: Есть ли минимальное количество для каждой модели?
      a: Нет. Минимум 5 досок относится ко всему заказу, а не к каждой модели. Вы можете заказать 5 разных моделей по одной доске каждой.
    - q: Меняет ли смешивание моделей цену?
      a: Оптовая цена указана за единицу каждой модели, но ваш уровень цен улучшается в зависимости от общего количества досок — смешивание моделей не влечет штрафа.
    - q: Можно ли смешивать доски и аксессуары?
      a: Да — запасные весла, насосы и ремонтные комплекты можно добавить в смешанный заказ. Уточните это в запросе.
    - q: Как узнать, какие модели подходят для моего рынка?
      a: Отправьте нам информацию о ваших клиентах (побережье или внутренняя зона, туристы или местные, новички или райдеры) через форму запроса, и мы порекомендуем подходящую смесь.
