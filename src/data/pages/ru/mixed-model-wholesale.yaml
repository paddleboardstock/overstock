hero:
  tagline: Оптовая продажа различных моделей
  title: Оптовая продажа различных моделей паддлбордов —<br />Смешивайте разные SUP модели в одном заказе
  subtitle: Зачем ограничивать свой бюджет одной моделью? Объединяйте любые доступные SUP доски — универсальные, туристические, для серфинга и художественных серий — в одном оптовом заказе, с минимальной партией всего 5 досок.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Смешанный заказ различных надувных SUP моделей досок от Paddle Board Overstock
direct_answer: Оптовая продажа разных моделей позволяет небольшому ритейлеру заказать несколько разных SUP моделей в одной объединённой поставке вместо оптового количества одной доски. В Paddle Board Overstock можно комбинировать любые доступные модели, минимальный заказ — всего 5 досок, а общая количество определяет ценовую категорию. Смешанные заказы отправляются из Вэйхая, Китай экспресс-авиаперевозкой (1–3 доски) или консолидированной морской доставкой (5–20 досок) в 50+ стран, и каждая доска на 100% проверяется на давление и покрыта 2-летней гарантией SUP.
tldr_points:
  - Комбинируйте любые доступные SUP модели в одном заказе — без минимальных количеств по каждой модели
  - Общая сумма заказа (не количество по каждой модели) определяет ваш ценовой уровень
  - Минимальная партия всего 5 досок — рассчитано на небольших ритейлеров, а не контейнерные поставки
  - 'Одна объединённая поставка: одна стоимость фрахта, одно таможенное оформление, одна доставка'
why_mixed:
  tagline: Почему стоит выбрать смешанные модели?
  title: Смешивайте и сочетайте. Покупайте больше разнообразия. Тратьте меньше.
  subtitle: Полка одинаковых досок обслуживает одного типа гребца. Смешанный заказ превращает тот же бюджет в полноценную линию продуктов.
  items:
    - title: Больше разнообразия на вашей полке
      description: Комбинируйте универсальные доски для начинающих, туристические доски для авантюристов и серф-доски для райдеров — один заказ покрывает весь диапазон ваших клиентов.
    - title: Меньше риска для каждой модели
      description: Вместо того чтобы ставить весь сезон на одну модель, заказывайте по 2–4 каждой. Если одна модель продается лучше остальных, повторно закажите её в следующем заказе, опираясь на реальные данные о продажах.
    - title: Проверяйте, что продается на вашем рынке
      description: На каждом пляже, озере и в каждом городе спрос разный. Смешанный первый заказ — это самый дешевый способ изучить рынок — возьмите шесть моделей и посмотрите, какие имеют наибольший спрос.
    - title: Лучшие маржи на художественных сериях
      description: Премиальные доски серий art (Leviathan Wake, Medusa Glow, Ocean Voyager) имеют более высокую розничную цену. Добавьте несколько таких досок к базовому набору универсальных досок, чтобы увеличить среднюю маржу.
    - title: Одна объединённая поставка
      description: Один смешанный заказ означает одно бронирование фрахта, одно таможенное оформление и одну доставку — вместо пяти отдельных поставок от пяти разных поставщиков.
how_it_works:
  tagline: Как это работает
  title: Как работает заказ смешанных моделей
  steps:
    - title: Выберите сочетание
      description: Выберите модели и количество для вашего рынка — или используйте селектор ниже, чтобы составить комбинацию и увидеть обновление количества досок и общей стоимости в реальном времени.
    - title: Запросите смету
      description: Отправьте нам свой набор. Мы подтверждаем наличие каждой модели и указываем цену за единицу, а также варианты экспресс- и морской доставки в вашу страну.
    - title: Подтвердите заказ
      description: Утвердите окончательную смету — модели, количества, фрахт, общую сумму. Мы резервируем товар и планируем отправку из Вэйхая.
    - title: Мы тестируем каждую плату
      description: Каждая плата в вашем смешанном заказе проходит 100% испытание давлением до 15 PSI перед упаковкой — одинаковый стандарт для всех моделей, будь то универсальная начальная модель или арт-версия.
    - title: Одна доставка до вашей двери
      description: Весь смешанный заказ отправляется вместе — экспресс-почтой для маленьких заказов, консолидированным морским фрахтом для 5–20 плат — с отслеживанием от двери до двери.
