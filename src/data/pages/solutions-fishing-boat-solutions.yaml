content_challenge:
  tagline: The Challenge
  title: 'Fishing Boats Need<br />Stability, Range & Durability'
  subtitle: 'Whether you operate commercial fishing vessels, manage a cooperative fleet, or run fishing charters — your boat needs to perform reliably every day.'
  paragraphs:
    - 'Fishing boats need stable platforms for working lines, handling catch, and moving around the deck safely. Inflatables and RIBs offer inherent stability through their tube design — a significant advantage over rigid hulls of similar length.'
    - 'Fuel efficiency matters for fishing operations where operating costs directly impact profitability. RIBs and inflatable boats are lighter than equivalent rigid boats, requiring less power and burning less fuel — critical for commercial operators running boats daily and cooperatives managing fleet budgets.'
    - 'Durability in marine environments is essential. Saltwater, UV exposure, and constant use demand materials that can withstand harsh conditions without degradation. For commercial and cooperative operators, reliability directly affects income — a broken boat means lost fishing days.'
    - 'Paddle Board Overstock fishing configurations include rod holders, fishfinders, bait wells, livewells, and cargo handling solutions designed for serious fishing applications across commercial, cooperative, and recreational operations.'
content_solution:
  tagline: Our Solution
  title: 'Fishing-Ready Configurations'
  subtitle: 'Every Paddle Board Overstock fishing boat can be configured for your specific fishing application.'
  list:
    - 'Rod holder mounting — factory-installed or ready for aftermarket installation'
    - 'Fishfinder/GPS mounting plate at console position'
    - 'Bait well or livewell options for charter and commercial operators'
    - 'Cooler/storage configurations for catch handling'
    - 'Deep-V hull for offshore capability — stable at rest, smooth at speed'
    - 'PVC or Hypalon tube options — Hypalon for extended UV exposure'
    - 'Outboard range from 15 HP to 115 HP depending on model and application'
content_segments:
  tagline: Fishing Profiles
  title: 'Inflatable Fishing Boat Solutions<br />By Operator Type'
  subtitle: 'From inshore sports fishing to commercial longlining — different fishing operations demand different hull configurations, power ranges, and on-deck setups. We tailor every boat to match the fishery, the waters, and the working style.'
  items:
    - title: Commercial Fishing Companies
      subtitle: 'Fleet workboats for daily fishing operations, net handling, catch transport'
      description: 'Commercial fishing companies operate workboats for net setting and retrieval, trap servicing, longlining, and catch transport. These boats work every day in saltwater environments and must withstand heavy loads, constant deck handling, and long operating hours. Fuel efficiency and low maintenance are critical for fleet profitability. The vessel must provide stable working platforms for crew handling gear and catch in varying sea conditions.'
      features:
        - 'Flat deck layout for net handling, trap stacking, and fish storage'
        - 'Fuel-efficient 40-115 HP outboard for low daily operating cost'
        - 'Heavy-duty Hypalon tubes for abrasion resistance in daily use'
        - 'Reinforced rubbing strakes for frequent dock and vessel contact'
        - 'Self-bailing deck for easy wash-down after operations'
        - 'Fleet pricing and consistent specifications for multi-vessel operators'
    - title: Charter Fishing Operators
      subtitle: 'Multi-passenger comfort, catch handling, safety-certified'
      description: 'Operators running half-day and full-day fishing charters — from inshore reef fishing to offshore bottom fishing. Your boat needs passenger seating with safety certifications, ample deck space for multiple anglers, and integrated livewells for keeping bait and catch fresh throughout the trip. Guest comfort directly affects trip reviews, repeat bookings, and online ratings.'
      features:
        - 'Console steering with shock-absorbing bucket seats'
        - 'Factory-installed rod holders (4–8 positions)'
        - '60–115 HP outboard range for offshore cruising speeds'
        - 'CE Category C or B certification for commercial passenger operations'
        - 'Bimini or T-top sunshade for guest comfort on extended trips'
    - title: Artisanal & Small-Scale Commercial Fishers
      subtitle: Reliable workboats for daily livelihood
      description: 'Independent fishers who rely on their boat as their primary income source — setting nets, tending fish traps, or handlining near shore. Your priority is fuel economy, simple maintenance you can perform yourself, and a boat that handles moderate loads of catch and gear without sacrificing stability.'
      features:
        - 'Fuel-efficient 15–40 HP outboard for low operating cost'
        - 'Hypalon CSM tubes for extended UV and abrasion resistance'
        - 'Flat deck layout for net handling and fish storage'
        - 'Easy beach-landing capability with inflatable keel protection'
    - title: Fishing Cooperatives
      subtitle: 'Catch collection, member transport, supply distribution'
      description: 'Fishing cooperatives operate community-based fleets for collecting catch from member fishers, transporting supplies to remote fishing communities, and distributing harvest to markets. These workboats need high payload capacity, reliable daily operation, and easy maintenance in remote locations. Cooperatives often operate in developing regions where parts availability and service access are limited, making simple outboard configurations and durable construction essential.'
      features:
        - 'High payload capacity for hauling catch and supplies'
        - 'Simple outboard configuration for easy on-site servicing'
        - 'Heavy-duty PVC or Hypalon construction for budget flexibility'
        - 'Flat deck with tie-down points for securing cargo'
        - 'Fuel-efficient operation minimizing cooperative operating costs'
    - title: Sports & Game Fishing Enthusiasts
      subtitle: Performance and style for serious anglers
      description: 'Experienced anglers seeking a capable fishing platform that delivers speed to distant grounds, stable stand-up fighting positions, and premium fit-and-finish. The boat must feel at home whether running two miles offshore to a reef or exploring remote estuarine backwaters.'
      features:
        - 'Deep-V RIB hull for smooth ride in chop'
        - 'Fishfinder/GPS mount plate pre-wired at console'
        - 'Baitwell and cooler integrated into rear seat module'
        - 'Custom EVA deck color options matching boat/tube graphics'
    - title: Fishing Guide & Eco-Tour Operators
      subtitle: Guided fishing experiences for visiting anglers
      description: 'Guides who take small groups of visiting anglers to productive fishing spots — often combining fishing with eco-tourism elements like bird watching or mangrove exploration. The boat must ride dry and comfortable for guests unaccustomed to small boats, with easy boarding and shade options.'
      features:
        - 'Bimini top or T-top mounting points factory-installed'
        - 'Smooth entry boarding ladder for easy reboarding'
        - 'Quiet 4-stroke outboard to minimize disturbance'
        - 'Dry storage compartments for guest phones, wallets, cameras'

