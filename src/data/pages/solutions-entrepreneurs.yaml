content_segments:
  tagline: Entrepreneur Profiles
  title: 'Water Sports Brand Launch<br />By Entrepreneur Type'
  subtitle: 'Different founders come with different strengths — e-commerce expertise, industry connections, content reach, or distribution infrastructure. We tailor the OEM/ODM launch program to match your starting position and growth ambition.'
  items:
    - title: Amazon FBA & E-Commerce Sellers
      subtitle: Data-driven, fast-scaling brand builders
      description: 'Experienced online sellers launching water sports products on Amazon, Walmart, or their own Shopify stores. You know how to optimize listings, manage PPC, and read category data — but you need a manufacturing partner who understands e-commerce velocity, return rates, and seasonal demand swings.'
      features:
        - 'Retail-ready packaging optimized for FBA dimension limits'
        - 'EAN/UPC barcode generation and Amazon-compliant documentation'
        - 'Low MOQ (2–5 units per RIB SKU, 5–10 per SUP) to test demand before scaling'
        - 'Mixed-container consolidation to optimize per-unit landed cost'
    - title: Fitness & Outdoor Lifestyle Influencers
      subtitle: Audience-first brand creators
      description: 'Content creators, fitness coaches, and outdoor personalities with an engaged audience ready to buy into a lifestyle brand. You bring the community and the brand story — we handle the product engineering, compliance, packaging, and logistics so you can focus on content and conversion.'
      features:
        - 'Quick-turn custom branding: 2-week sample cycle with logo + colors'
        - 'Co-branded limited editions and seasonal colorway drops'
        - 'Lifestyle photography and video content production support'
        - 'Direct-to-consumer fulfillment: factory → customer drop shipping'
    - title: Regional Distributors Going Direct-to-Consumer
      subtitle: B2B operators launching their own brand
      description: 'Established marine or outdoor equipment distributors who want to launch their own brand alongside or instead of reselling third-party products. You already have warehouse infrastructure, logistics relationships, and a customer base — you need a factory partner who can deliver private-label quality at scale.'
      features:
        - 'Exclusive product designs for your market territory'
        - 'Full OEM mold development for proprietary shapes and specs'
        - 'Localized compliance documentation (CE, UKCA, USCG) for your region'
        - 'Co-branded packaging: distributor brand + Paddle Board Overstock quality mark'
    - title: First-Time Brand Founders
      subtitle: Guided end-to-end brand creation
      description: 'Passionate entrepreneurs with zero water sports industry experience who want to build a brand from scratch. You need a partner who holds your hand through every stage — from product selection and naming to packaging design and first-container logistics — with clear timelines and transparent pricing.'
      features:
        - 'Consultative product selection from 50+ proven base designs'
        - 'Brand identity package: naming, logo, color palette, packaging design'
        - '60–90 day timeline from concept to first shipment'
        - 'Dedicated project manager for first-time brand owners'

