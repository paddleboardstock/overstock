content_challenge:
  tagline: Zorluk
  title: Offshore Enerji Talepleri<br />Aşırı Ortamda Güvenilirlik
  subtitle: Offshore enerji operasyonları ekipmanı sınırlarına kadar zorlar — aşırı hava koşulları, uzak lokasyonlar, sürekli görev döngüleri ve arızaya sıfır tolerans.
  paragraphs:
    - Offshore enerji sektörü, dünyanın en zorlu deniz ortamlarında faaliyet gösterir. İş tekneleri, petrol ve gaz platformlarını, rüzgar türbini kurulumlarını, deniz altı kablo operasyonlarını ve deniz yapım projelerini destekler — çoğunlukla sınırlı hava penceresine sahip açık deniz koşullarında. Ekipman arızası sadece maliyetli değil, aynı zamanda tehlikelidir.
    - '**Güvenlik en yüksek önceliktir** — Personel transfer gemileri, diğer operasyonları durdurabilecek deniz durumlarında güvenli şekilde çalışmak zorundadır. Transfer noktasında stabilite, her hava koşulunda güvenilir motor performansı ve offshore yapılarına tekrar tekrar yanaşmaya uygun sağlam yapı zorunlu gereksinimlerdir.'
    - '**Her hava koşulunda çalışma yeteneği şarttır** — Offshore rüzgar çiftlikleri ve petrol platformları yıl boyunca faaliyet gösterir. İş tekneleri ağır dalgalarda, güçlü rüzgarlarda ve sınırlı görüş koşullarında çalışabilmelidir. Gündüz ve gece operasyonları tam navigasyon setleri ve güvenilir aydınlatma sistemleri gerektirir.'
    - '**Offshore rüzgar sektörü hızla büyüyor** — Dünya genelinde binlerce yeni türbin kuruluyor ve her biri düzenli personel transferi, ekipman taşıma ve bakım desteği gerektiriyor. Bu, özel inşa edilmiş personel transfer gemileri (CTV) ve destek RIBs için sürekli talep yaratır.'
    - Aquafarer offshore enerji RIBs, güçlendirilmiş deep-V gövde, ağır hizmet tipi Hypalon tüpler, tam navigasyon setleri ve offshore enerji operasyonlarının aşırı koşulları için tasarlanmış güvenlik sistemleri ile mühendislik yapılmıştır.
content_solution:
  tagline: Çözümümüz
  title: Amaca Özel Offshore RIBs<br />Enerji Sektörü İçin
  subtitle: Her Aquafarer offshore enerji RIB, Kuzey Denizi’nden Güneydoğu Asya’ya kadar aşırı deniz koşullarında güvenli ve güvenilir işletim için tasarlanmıştır.
  list:
    - Zorlu su performansı ve öngörülebilir manevra kabiliyeti için güçlendirilmiş deep-V gövde
    - Uzun offshore servis için UV ve kimyasal dirençli ağır hizmet tipi Hypalon tüpler
    - 316 paslanmaz çelik donanım — sürekli tuzlu suya maruz kalmada korozyon yok
    - 'Tam navigasyon paketi: GPS, radar, VHF, gece navigasyon ışıkları — offshore modellerde standart'
    - Biniş deniz koşullarında güvenli operasyon için kendi kendine boşalan güverte
    - Çoklu motor konfigürasyonları — görev yedekliliği için tek veya çift dış motorlu
    - Platform ve şamandıra kullanımı için çekme direği ve ağır hizmet mantapları
    - Açık deniz çalışma alanlarında tanımlama için yüksek görünürlüklü tüp renkleri
content_segments:
  tagline: Enerji Profilleri
  title: Offshore Enerji Çözümleri<br />Uygulama Türüne Göre
  subtitle: Farklı açık deniz enerji sektörlerinin benzersiz çalışma teknesi gereksinimleri vardır — platform RIBs desteğinden rüzgar çiftliği CTV'lerine ve denizaltı denetim gemilerine kadar.
  items:
    - title: Açık Deniz Petrol ve Gaz Platformu Desteği
      subtitle: Mürettebat transferi, ekipman tedariki, platform güvenliği bekleyi
      description: Petrol ve gaz platformları günlük mürettebat değişimi, ekipman ve malzeme taşımacılığı ile güvenlik bekleme kapsamı gerektirir. İş tekneleri, platform yapılarının etrafında, güçlü akıntılarda ve değişken deniz koşullarında güvenli şekilde hareket etmeli ve personel transferi sırasında merdiven veya geçit yoluyla hassas konum korumalıdır. Aşırı çevre — hidrokarbonlar, kimyasallar, sürekli tuz püskürtme — korozyona dayanıklı yapı ve güvenilir performans gerektirir.
      features:
        - Güvenli biniş erişimi ve korkuluklarla mürettebat transfer konfigürasyonu
        - Korozyona dayanıklı Hypalon tüpler ve 316 paslanmaz çelik donanım
        - Sık platform çamurluk teması için güçlendirilmiş sürtme streketleri
        - Yağlı su ve kimyasal yıkama için kendi kendine temizleme güvertesi
        - Uzun açık deniz çalışma menzili için yüksek kapasiteli yakıt tankı
        - Görev kritik yedekliliği için çift motorlu seçenek
    - title: Açık Deniz Rüzgar Çiftliği İşletmeleri
      subtitle: Mürettebat transferi, türbin bakımı, alet taşımacılığı
      description: Açık deniz rüzgarı, deniz enerjisinde en hızlı büyüyen sektördür. Operatörler, teknisyenleri 1,5 metre dalga yüksekliğine kadar olan deniz eyaletlerinde türbin erişim platformlarına güvenli şekilde aktarabilen mürettebat transfer gemilerine (CTV) ihtiyaç duyar. Transfer sırasında stabilite, her hava koşulunda dayanıklılık ve güvenilir günlük çalışma kritik öneme sahiptir. Rüzgar çiftliği hizmet gemileri sıkı takvimlerde çalışır — herhangi bir kesinti türbin hizmete girmesini veya bakımını geciktirir ve enerji üretim gelirini doğrudan etkiler.
      features:
        - Türbin tabanında stabil mürettebat transferi için optimize edilmiş gövde formu
        - Açık deniz dalgası ve dalga hareketlerinde rahat sürüş için derin V girişi
        - Tam hava koşullarına karşı koruma — mürettebat konforu için kapalı konsol veya direksiyon yuvası
        - Takım, yedek parça ve servis ekipmanları için güverte alanı
        - Uzun gündüz sınırlı kış vardiyaları için gece operasyonları paketi
        - Deniz ortamına minimum gürültü etkisi için sessiz dış motorlu çalışma
    - title: Denizaltı Kablosu ve Boru Hattı Desteği
      subtitle: Denetim, bakım, ROV desteği, inceleme
      description: Denizaltı kablo ve boru hattı operatörleri, güzergah denetimi, bakım desteği, ROV operasyonları ve araştırma görevleri için çalışma teknelerine ihtiyaç duyar. Bu gemiler, su altı ekipmanlarının yerleştirilmesi ve kurtarılması için stabil platformlara, kablo izleme için hassas düşük hızlı manevralara ve kıyı ile açık deniz ortamlarında güvenilir çalışma gerektirir. Tekne stabilitesi, sonar ve araştırma ekipmanlarının doğruluğu için kritik öneme sahiptir.
      features:
        - Kablo izleme ve araştırma operasyonları için yavaş hızda sabit platform
        - ROV dağıtımı, kablo makaraları ve araştırma ekipmanları için açık güverte düzeni
        - Sonar, GPS ve ölçüm cihazları için ekipman montaj plakaları
        - Muayene sırasında deniz tabanına minimum etki için düşük dalga uyandıran gövde tasarımı
        - Duyarlı dıştan takma dümen ile hassas düşük hızlı manevra
    - title: Deniz Mühendisliği ve İnşaat Desteği
      subtitle: Personel taşımacılığı, malzeme temini, dalış desteği
      description: Liman inşaatı, kıyı koruma ve açık deniz kurulum projelerinde çalışan deniz mühendisliği müteahhitleri, inşaat gemileri ile kara arasında personel taşımacılığı, malzeme ve araç temini, dalış desteği ve saha ölçümleri için çok yönlü iş teknelerine ihtiyaç duyar. Bu tekneler, birden fazla geminin bulunduğu aktif inşaat alanlarında, sınırlı manevra alanında ve değişken deniz koşullarında çalışır. Dayanıklılık ve çok yönlülük hayati öneme sahiptir.
      features:
        - Personel, malzeme ve dalış ekipmanı için çok amaçlı güverte düzeni
        - Dalış destek operasyonları için dalış merdiveni ve ekipman montajı
        - İnşaat sahası manevraları için ağır hizmet tipi bağlantı ve çekme direği
        - İnşaat döküntüsü ve aşınmaya karşı dayanıklılık için sağlam Hypalon konstrüksiyon
        - Esnek oturma düzenleri — personel taşımacılığı veya yük modu
