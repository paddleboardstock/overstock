hero:
  tagline: Kılavuzlar
  title: SUP için yeni misiniz?
  subtitle: Şişme su sporları ekipmanlarını seçmenize, kullanmanıza ve keyfini çıkarmanıza yardımcı olacak pratik kılavuzlar.
size_guide:
  tagline: Boyut ve Özellikler
  title: İhtiyacınıza Uygun Boyutu Bulun
  desc: Tahta boyutlarını, ağırlık kapasitelerini ve önerilen kullanım alanlarını karşılaştırın. İster dengeli bir çok amaçlı tahta ister daha hızlı bir tur şekli isteyin — boyut rehberimiz doğru uyumu seçmenize yardımcı olur.
  link_label: Ürün özellikleri ile tam boyut kılavuzu →
  link: /size-guide
  cards:
    - title: Her Yönlü SUP Tahtaları
      desc: ~11 ft tahtalarımız (32" genişliğinde) denge, hız ve kapasiteyi dengeliyor. 15 PSI uzunluğundaki 6 inç drop-stitch çekirdek, her seviyeden kürekçilerin kullanımı için güvertede sertlik sağlıyor.
    - title: Genişlik ve Stabilite
      desc: Daha geniş tahtalar (32"+) yeni başlayanlar, yoga ve balık tutma için daha fazla denge sağlar. 6 inç kalınlık, binici ve ekipman için sertlik ve ağırlık kapasitesi ekler.
    - title: Paketler ve Aksesuarlar
      desc: Her tahta, tam bir paket olarak gönderilir — tahta, seyahat sırt çantası, el pompası, ayarlanabilir kürek, çıkarılabilir yüzgeç, spiral kayış ve onarım kiti. Sürücü ve ekipmanı için maksimum yükü kontrol edin.
