hero:
  tagline: Kılavuzlar
  title: SUP için yeni misiniz?
  subtitle: Şişme su sporları ekipmanlarını seçmenize, kullanmanıza ve keyfini çıkarmanıza yardımcı olacak pratik kılavuzlar.
size_guide:
  tagline: Boyut ve Özellikler
  title: İhtiyacınıza Uygun Boyutu Bulun
  desc: Ürün boyutlarını, ağırlık kapasitelerini ve önerilen kullanımları karşılaştırın. İster bir tur SUP, ister kompakt bir kano, ister ticari bir RIB ihtiyacınız olsun — boyut kılavuzumuz doğru seçimi yapmanıza yardımcı olur.
  link_label: Ürün özellikleri ile tam boyut kılavuzu →
  link: /size-guide
  cards:
    - title: SUP Tahtalar
      desc: Boyu, ağırlığınıza ve kullanım amacınıza göre seçin. Daha geniş tahtalar (32"+) daha fazla denge sağlar. Daha uzun tahtalar (11–12 ft) tur için daha iyi yönlendirir.
    - title: Kanolar
      desc: Tek kişilik kanolar (9 ft) solo seyahat ve nehirler için. İkili kanolar (12 ft) iki kürekçi veya bir kişi ve ekipman için. Ağırlık kapasitesini her zaman kontrol edin.
    - title: Botlar ve RIBs
      desc: Boyu yolcu sayısına ve kullanım amacına göre seçin. Daha büyük RIBs (4.5 m+) açık deniz ve kurtarma için. Daha küçük botlar (2.7 m) ise yardımcı bot ve balık tutma platformları olarak.
