content_challenge:
  tagline: Zorluk
  title: Su Ürünleri Talepleri<br />Tuzlu Suya Dayanıklı Ekipman
  subtitle: Balık çiftlikleri, inci çiftlikleri ve deniz çiftlikleri en kimyasal açıdan agresif deniz ortamlarında çalışır — uzun süreli tuzlu su maruziyeti, yakıt ve yem kalıntıları ve sürekli günlük kullanım.
  paragraphs:
    - Su ürünleri operasyonları yılın 365 günü açık deniz ve kıyı ortamlarında devam eder. Kafes denetimi, yem taşıma, inci hattı bakımı ve ekipman servisinde kullanılan iş botları sürekli tuzlu suya batma, UV maruz kalma ve yakıtlar, balık yemleri ve anti-fouling işlemlerinden kaynaklanan kimyasal temasla karşı karşıyadır.
    - '**Korozyon birincil düşmandır** — Standart deniz ekipmanı bu koşullarda hızla bozulur. Dıştan takma motorlar, römork çerçeveleri ve gövde donanımları sürekli değiştirilmeye ihtiyaç duyar. Operatörlerin, bu ortamda yıllarca bozulmadan dayanabilecek korozyona dayanıklı malzemelerden yapılmış botlara ihtiyacı vardır.'
    - '**Günlük güvenilirlik kritiktir** — Arızalı bir iş botu, besleme programlarının aksamasına, hasatların gecikmesine ve maliyetli üretim kayıplarına neden olur. İnci çiftlikleri için, tek bir günü kaçırmak önemli ürün kaybı anlamına gelebilir. Balık çiftlikleri için, gecikmiş besleme büyüme oranlarını ve karlılığı etkiler.'
    - Aquafarer su ürünleri RIBs balık çiftçiliği, inci yetiştiriciliği ve deniz çiftçiliği operasyonlarının zorlu koşulları için özel olarak tasarlanmış korozyona dayanıklı donanım, ağır hizmet Hypalon tüpler ve takviyeli gövdeler ile mühendislik ile üretilmiştir.
content_solution:
  tagline: Çözümümüz
  title: Amaca Özel RIBs<br />Su Ürünleri Endüstrisi İçin
  subtitle: Her Aquafarer su ürünleri iş botu, agresif tuzlu su ortamlarına dayanacak şekilde tasarlanmış ve güvenilir günlük performans sunmaktadır.
  list:
    - Deniz sınıfı Hypalon tüpler — UV, tuzlu su, yakıtlar ve balık yemi kimyasallarına üstün direnç
    - 316 paslanmaz çelik donanım — uzun süreli tuzlu su maruziyetinde paslanma yok
    - Tekrarlayan iskele ve kafes temasına karşı takviyeli çarpışma bordası ve omurga koruyucu
    - Yem taşıma ve hasat operasyonları sonrası kolay yıkama ve drenaj için kendi kendini boşaltan güverte
    - Yem çantaları, hasat kutuları ve ekipman taşımak için düz güverte konfigürasyonu
    - 15 HP ila 60 HP dıştan takmalı motor konfigürasyonları — yük kapasitesi ve yakıt verimliliği için optimize edilmiştir
    - Geniş tarım alanlarında kolay fark edilmesi için yüksek görünürlüklü boru renk seçenekleri
content_segments:
  tagline: Su Ürünleri Profilleri
  title: Çalışma Teknesi Çözümleri<br />Su Ürünleri Türüne Göre
  subtitle: Farklı su ürünleri işletmelerinin farklı çalışma teknesi gereksinimleri vardır — balık kafesi denetimi için küçük çevik RIBs teknelerden inci yetiştiriciliği için stabil taşıma platformlarına ve okyanus çiftlikleri için ağır hizmet teknelerine kadar.
  items:
    - title: Balık Çiftliği İşletmeleri
      subtitle: Kafes denetimi, yem taşımacılığı, hasat desteği
      description: Deniz balık çiftlikleri, açık kıyı ve offshore alanlarda kafesler işletmektedir. Çalışma tekneleri günlük olarak kafes ağlarının denetimi, yemleme operasyonları, hasat desteği ve ekipman bakımı için kullanılır. Ana zorluk korozyondur — tekneler sürekli olarak tuzlu suya, balık yemi kalıntılarına ve yakıta maruz kalır. Güvenilir bir çalışma teknesi çok önemlidir çünkü kaçırılan yemleme veya geciken hasat doğrudan üretim çıktısını ve karlılığı etkiler.
      features:
        - 'Agresif ortam paketi: 316 paslanmaz çelik donanım, deniz kalitesinde alaşım bileşenler'
        - Yem çantaları ve hasat kutularını taşımak için düz güverte düzeni
        - Operasyon sonrası kolay yıkama için kendi kendini tahliye eden güverte
        - Hypalon tüpler, yem ve yakıt maruziyetine karşı kimyasal dirençli kaplama ile
        - Sık kafes ve iskele temasları için güçlendirilmiş yan koruma rayları
    - title: İnci Yetiştiriciliği İşletmeleri
      subtitle: İnci hattı denetimi ve hasat için stabil taşıma
      description: İnci çiftlikleri, günlük olarak inci hatları arasında taşımacılık, istiridye ağlarının denetimi ve hasat toplama için stabil, güvenilir teknelere ihtiyaç duyar. Bu işletmeler uzak kıyı alanlarda sınırlı bakım altyapısıyla çalışır. Teknenin, mürettebatın inci hatlarını denetlerken çalışabilecek kadar stabil olması, kolay binme ve hasat edilen istiridye, ağ ve malzeme taşımak için geniş güverte alanına sahip olması gerekir. Uzak çiftlik alanlarında güvenilirlik ve kolay bakım kritik öneme sahiptir.
      features:
        - İnci hattı denetimi sırasında ayakta duran mürettebat için stabil gövde tasarımı
        - Mürettebatın güvenli hareketi için kaymaz yüzeyli düz güverte
        - İstiridye ağı ve hasata kolay erişim için alçak borda
        - Yerinde servis için basit dıştan takmalı motor konfigürasyonu
        - Sürekli tuzlu suya maruz kalmaya dayanıklı boru ve donanım paketi
    - title: Okyanus Çiftlikleri ve Deniz Geliştirme
      subtitle: Genç balık taşımacılığı, kafes bakımı, izleme desteği
      description: Okyanus çiftliği operasyonları, genç stokları yönetilen deniz ortamlarına salmayı, büyümeyi izlemeyi ve geliştirme yapıları için bakım yapmayı içerir. Çalışma tekneleri, canlı genç stokları havalandırmalı kaplarda taşımak, izleme ekipmanlarını taşımak ve sığ kıyı salım alanlarına erişmek zorundadır. Gövde tasarımı, taşıma kapasitesini sığ draft ile dengeler, böylece sahil ve nehir ağızlarına erişim sağlar.
      features:
        - Havalandırmalı genç balık taşıma kapları ve izleme ekipmanları için güverte alanı
        - Sığ draft ile sahil ve nehir ağzı salım alanlarına erişim
        - Kolay sahil inişi — güçlendirilmiş omurga ve pruvası koruma
        - İzleme elektronik ve örnekleme ekipmanı için ekipman montaj noktaları
        - Karışık kum ve deniz suyu koşullarında dayanıklılık için ağır hizmet Hypalon tüpleri
