features3_reasons:
  tagline: Aquafarer'yi Neden Seçmelisiniz
  title: Bizimle Ortak Olmanız İçin Yedi Sebep
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Ticaret Değil, Gerçek Üretim
      description: 12.000 m² bir fabrikanın sahibiyiz ve işletiyoruz. Aquafarer ile ortaklık yaptığınızda, ürünlerinizi tasarlayan, mühendisliğini yapan ve üreten kişilerle doğrudan çalışırsınız — aracı yok.
      icon: tabler:building-factory
    - title: 2. Mühendislik Odaklı Yaklaşım
      description: Tasarım sürecimiz, ürün kategorisi ile değil, kullanım senaryosu ile başlar. Teknelerin nasıl kullanılacağına göre gövde şekli, malzeme seçimi ve konfigürasyonu optimize ederiz.
      icon: tabler:engine
    - title: 3. Sertifikalı Kalite
      description: CE sertifikalı, ISO kalite sistemi, BSCI uyumlu, REACH uyumlu, USCG onaylı. 64 CE sertifikalı modelimiz sadece iddialarla değil, uluslararası standartlarla da uyumludur.
      icon: tabler:certificate
    - title: 4. Esnek OEM/ODM
      description: Tüp renkleri, konsol düzeni, markalaşma, ambalaj — spesifikasyonlarınıza göre özelleştiriyoruz. Minimum sipariş baskısı yok. Bir prototip ile başlayın, güvenle ölçeklendirin.
      icon: tabler:adjustments
    - title: 5. Küresel Lojistik
      description: Kaliforniya'da ABD deposu, Qingdao'dan doğrudan sevkiyat, acil siparişler için hava kargo. Gümrük evraklarını ve belgelerini biz yönetiyoruz.
      icon: tabler:truck-delivery
    - title: 6. Ömür Boyu Destek
      description: 20 yıl önce inşa ettiğimiz tekneleri destekliyoruz. Orijinal yedek parçalar, teknik tavsiye, tamir rehberi — ekibimiz ihtiyacınız olduğunda hizmetinizdedir.
      icon: tabler:lifebuoy
    - title: 7. Dürüst Spesifikasyonlar
      description: Gerçek yük kapasiteleri, gerçek boyutlar, gerçek ağırlık. Pazarlama abartısı yok. Yayınladığımız şey, aldığınız şeydir — bağımsız testlerle doğrulanmıştır.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dünya Çapında Markalar Tarafından Güvenilen
  title: Ortaklarımızın Söyledikleri
  items:
    - content: Çin'deki birkaç üretici ile çalıştık, ancak Aquafarer mühendislik destekleri ve sürekli kaliteleriyle öne çıkıyor. Markamıza kendi markaları gibi değer veriyorlar.
      name: — OEM Ortak, Avrupa Su Sporları Markası
    - content: Hypalon RIBs filomuzda 5 yıldan uzun süredir hizmet veriyor. Minimal bakım, mükemmel UV dayanıklılık. Tüplerdeki 5 yıllık garanti bize güven veriyor.
      name: — Filom Operatörü, Orta Doğu Tatil Köyü Grubu
    - content: Aquafarer ekibi, kavramdan üretime 90 gün içinde özel SUP board tasarımımızı geliştirmemize yardımcı oldu. Kalite beklentilerimizi aştı.
      name: — Distribütör, Avustralya Su Sporları
