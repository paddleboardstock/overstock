comparison_matrix:
  title: OEM vs. ODM — Hangi Model Projenize Uygun?
  subtitle: Dört iş birliği modu, her biri farklı fabrika katılımı ve marka kontrol seviyelerine sahip
  columns:
    - header: İş Birliği Modu
    - header: Marka Rolünüz
    - header: Aquafarer Rolü
  rows:
    - option: OEM Üretim
      standard: Marka, spesifikasyonlar ve uyumluluk gereksinimlerini sağlayın
      premium: Mevcut kalıplarımız ve üretim hatlarımız kullanılarak sizin spesifikasyonunuza göre üretim
    - option: ODM Özelleştirme
      standard: Bir temel model seçin, özellikleri ve markalamayı özelleştirin
      premium: İstenen değişikliklerle kanıtlanmış RIB platformunu uyarlayın
    - option: Yarı-Özel RIB
      standard: Gövde uzunluğu, tüp malzemesi, güverte düzeni ve ekipmanı belirleyin
      premium: Mevcut gövdeyi özel tüp konfigürasyonu ve güverte planı ile değiştirin
    - option: Tam Özel Geliştirme
      standard: Kavram ve hedef pazar gereksinimlerini sağlayın
      premium: Baştan tasarım — özel gövde, kalıp ve eksiksiz dokümantasyon
content_customization:
  tagline: Ne Özelleştirilebilir
  title: RIB Özelleştirme<br />Seçenekler
  subtitle: Bir RIB teknenin her öğesi, uygulamanıza, pazarınıza ve marka gereksinimlerinize göre özelleştirilebilir.
  items:
    - title: Gövde ve Yapısal
      description: Gövde uzunluğu (2,5–8,5 m), gövde malzemesi (GRP fiberglas veya deniz sınıfı alüminyum), gövde rengi (gelcoat veya boyalı), omurga profili (derin-V, orta-V, düz), küpeşte türü (braketli veya havuzlu kapalı küpeşte) ve ticari yük gereksinimleri için yapısal takviye.
      icon: tabler:sailboat
    - title: Tüp ve Yaka
      description: Boru malzemesi (0,9–1,2 mm PVC veya 1,4–1,7 mm Hypalon/CSM), boru çapı (40–55 cm), bölüm sayısı (3–7), vana tipi (Halkey-Roberts, Leafield D7 veya Boston), boru rengi (standart veya özel) ve yaka koni/konik yapılandırması.
      icon: tabler:circle
    - title: Güverte ve Konsol Düzeni
      description: Merkez konsol, yan konsol veya dümenli direksiyon. Oturma düzeni (jokey koltuklar, sıradaki koltuklar, destekli koltuklar). Güverte kaplaması (EVA köpük tik görünümlü, kaymaz boya veya çıplak GRP). Ekipman montaj noktaları, tutma rayları ve D-halkası pozisyonları.
      icon: tabler:layout-dashboard
    - title: Elektrik ve Navigasyon
      description: Navigasyon ışıkları (LED), su tahliye pompası sistemi, akü yönetimi, VHF radyo kurulumu, GPS/harita plotteri montajı, USB şarj portları ve anahtar paneli yapılandırması.
      icon: tabler:bolt
    - title: Markalaşma ve Grafikler
      description: Gövde ve tüp grafikleri (serigrafi, ısı transferi, UV dijital baskı), logo yerleştirme, özel renk şemaları, tanımlama işaretleri ve markanızla özel sahip belgelendirmesi.
      icon: tabler:palette
    - title: Güvenlik ve Uyum
      description: Tasarım kategori derecelendirmesi (her RCD için A/B/C/D), yangın bastırma sistemi, yakıt sistemi spesifikasyonu (taşınabilir tank, sabit tank, güvertenin altı) ve hedef pazarınız için uyum belgeleri paketi.
      icon: tabler:shield
content_applications:
  tagline: Uygulama Ayarları
  title: RIB Yapılandırmalar<br />Uygulama ile
  subtitle: Farklı görevler farklı yapılandırmalar gerektirir. İşte en yaygın RIB uygulamaları için kanıtlanmış kurulumlar.
  items:
    - title: Kurtarma ve Devriye
      description: Derin V gövde, Hypalon tüpler, kendi kendine boşalan güverte, destekli koltuklar, tutma kolları, seyir ışıkları ve ağır hizmet tipi D halkalar. RCD Tasarım Kategorisi B veya C. Yangına dayanıklı yakıt sistemi ve ticari sınıf elektrik sistemi.
      icon: tabler:lifebuoy
    - title: Dalış Desteği
      description: Geniş kiriş, arka biniş merdiveni, yakıt tankı rafı pozisyonları, ekstra D halka, dalış bayrağı montajı, çift dıştan takma motorlar için takviye edilmiş kıç ve kaymaz tam güverte EVA kaplaması.
      icon: tabler:mask
    - title: Turizm ve Ticari
      description: Yolcu sertifikalı düzen, sıralı oturma, güneşlik/Bimini, tutma kolları, kuru depolama ve çift akü sistemi ile. RCD C Kategorisi. Tatil köyü ve kiralama filosu operasyonları için tasarlanmıştır.
      icon: tabler:beach
    - title: Balık tutma
      description: Açık güverte düzeni, olta tutucu pozisyonları, canlı yem tankı, balık bulucu montajı, yavaş sürüş motoru montajı, takviye edilmiş transom ve taşınabilir yakıt sistemi. Orta konsol veya yan konsol seçenekleri.
      icon: tabler:fish
    - title: Boş Zaman & Yat Yardım Botu
      description: Hafif gövde, PVC tüpler, rahat oturma düzeni, teleskopik dümen kolu veya kompakt konsol, vinç için kaldırma noktaları ve çıkarılabilir yakıt tankı. RCD Kategori C veya D.
      icon: tabler:sailboat
    - title: Profesyonel İş Botu
      description: Alüminyum gövde seçeneği, ağır hizmet takviyesi, hidrolik direksiyon, ticari sınıf elektrik sistemi, radar kemeri ve görev spesifik ekipman entegrasyon noktaları. Projeye özel uyumluluk.
      icon: tabler:anchor
process_steps:
  title: 7 Adımlı RIB OEM/ODM Geliştirme Süreci
  subtitle: Proje tanımından satış sonrası hizmete kadar — net kilometre taşları ve teslimatlar içeren tanımlı iş akışı
  steps:
    - number: '01'
      title: Proje Tanımı ve Gereksinimler
      description: Hedef uygulamayı, gövde boyutunu, tüp malzemesini, uyumluluk gereksinimlerini ve marka ihtiyaçlarını belirleyin. Fizibiliteyi değerlendiriyor ve iş birliği modelini onaylıyoruz (OEM/ODMYarı Özel/Tam Özel).
      timeline: 3–5 gün
    - number: '02'
      title: Teknik İnceleme & Fizibilite
      description: Mühendislik ekibi yapısal fizibiliteyi, stabilite ve taşma hesaplarını, uyumluluk yolunu ve malzeme uygunluğunu inceler. Mevcut kalıpları veya özel kalıp gereksinimlerini belirliyoruz.
      timeline: 5–7 gün
    - number: '03'
      title: Teklif & Fiyatlandırma
      description: Spesifikasyonlar, 3D görselleştirmeler veya GA çizimleri, uyumluluk kapsamı, zaman çizelgesi ve adet bazlı fiyatlandırma ile detaylı teklif alın.
      timeline: 5–7 gün
    - number: '04'
      title: Tasarım Onayı & Numune
      description: Son GA, güvertesi düzeni ve tüp konfigürasyonunu onaylayın. Marka renkleriniz, logonuz ve belirtilen malzemelerle üretim öncesi bir numune üretiyoruz ve fiziksel incelemenize sunuyoruz.
      timeline: 15–20 gün
    - number: '05'
      title: Numune Onayı & QC Protokolü
      description: 'Numuneyi inceleyip onaylayın. Üretim QC protokolünü belirleyin: basınç testi (1.25x / 24–48s), boyutsal kontroller ve gövde başına uyumluluk dokümantasyon kontrol listesi.'
      timeline: 3–5 gün
    - number: '06'
      title: Seri Üretim & Kalite Kontrol
      description: Birim başına 100 noktalı QC kontrol listesi ile tam üretim. Süreç içi kontroller, basınç testleri ve seri numarası seviyesinde izlenebilirlik. CE/ISO dokümantasyonu paralel olarak hazırlanır.
      timeline: 30–45 gün
    - number: '07'
      title: Paketleme, Nakliye & Satış Sonrası
      description: Özel paketleme (standart, perakende hazır veya paletli), ihracat belgeleri, konteyner yüklemesi ve lojistik. Yedek parça kitleri ve bakım dokümantasyonu dahil.
      timeline: 7–14 gün
certifications:
  title: RIB Botları için Uyumluluk & Sertifikalar
  subtitle: Her özel RIB siparişi, modele özel uyumluluk dokümantasyonu ile gönderilir
  items:
    - name: CE 2013/53/AB
      description: RCD model ve tasarım kategorisine göre uyumluluk — DoC, üretici plakası, kullanıcı kılavuzu dahil
      badge: CE
    - name: ISO 9001:2015
      description: SGS tarafından tasarım, üretim ve dağıtımı kapsayan kalite yönetim sistemi sertifikalı
      badge: ISO
    - name: EN ISO 6185
      description: Şişme bot yapım standardı — denge, kaldırma kuvveti ve adam düşme kurtarma
      badge: 6185
    - name: EN ISO 14945
      description: Yapıcı plaka standardı — kalıcı olarak işaretlenmiş tanımlama ve kapasite bilgisi
      badge: 14945
    - name: BSCI
      description: Etik üretim için sosyal uyum denetimi — AB perakendecileri tarafından gereklidir
      badge: BSCI
    - name: REACH
      description: Avrupa Birliği kimyasal güvenlik uyumluluğu PVC, Hypalon, yapıştırıcılar ve kaplamalar için
      badge: REACH
content_service_modules:
  tagline: Hizmet Modülleri
  title: OEM/ODM Servisi<br />Modüller
  subtitle: Her proje doğru hizmet modüllerini birleştirir. Her proje her modüle ihtiyaç duymaz — sadece projenizin gerektirdiği şeyi kapsamlı şekilde belirleriz.
  items:
    - title: Mühendislik İncelemesi ve Fizibilite
      description: 'Gövde platformu değerlendirmesi, yapısal uygulanabilirlik kontrolü, stabilite ve kaldırma kuvveti doğrulaması, uyum yolu belirleme ve malzeme mevcudiyetinin onayı. Çıktı: devam/ölçülmez önerisi ile uygulanabilirlik raporu.'
      icon: tabler:math-function
    - title: Tasarım ve Konfigürasyon
      description: 'GA çizimi, güverte düzeni, tüp konfigürasyonu, konsol ve oturma pozisyonları, ekipman montaj planı ve renk/malzeme seçimi. Çıktı: onaylanmış GA ve konfigürasyon spesifikasyonu.'
      icon: tabler:ruler
    - title: Numune & Prototip
      description: Onaylanmış renkler, logo ve belirtilen malzemelerle fiziksel denetim için üretim öncesi numune. Numune onay protokolü, denetim kontrol listesi ve değişiklik talep sürecini içerir.
      icon: tabler:3d-cube-sphere
    - title: Üretim ve Kalite Kontrol
      description: Birim başına 100 maddelik kalite kontrol listesi ile seri üretim, süreç içi denetimler, basınç testi (1.25x / 24-48 saat) ve seri düzeyinde izlenebilirlik. CE/ISO belgeleri paralel olarak hazırlandı.
      icon: tabler:clipboard-check
    - title: Markalaşma ve Ambalajlama
      description: Özel marka logo uygulaması, özel gövde ve tüp grafikleri, markalı sahip belgeleri, perakende hazır veya paletlenmiş ambalajlama ve yedek parça kiti hazırlığı.
      icon: tabler:palette
    - title: Dışa Aktarma ve Belgeleme
      description: İhracat ambalajı, konteyner yükleme planı, FOB/CIF/DDP belgeleri, varış pazarı başına uyum evrakları ve teslimat sonrası iletişim protokolü.
      icon: tabler:world
content_risk_control:
  tagline: Risk ve Teslimat Kontrolü
  title: Proje Riski &<br />Teslimat Yönetimi
  subtitle: Profesyonel OEM/ODM alıcıları, ürün kalitesi kadar risk kontrolüne de önem verir. İşte bunu nasıl yönettiğimiz.
  items:
    - title: Kapsam ve Sahiplik Tanımı
      description: 'Geliştirme başlamadan önce, yazılı olarak tanımlarız: özelleştirme kapsamı, araç gereksinimleri, örnek onay kriterleri, çizim ve kalıpların sahipliği ve dokümantasyon sorumlulukları. Kim neyin sahibi olduğu konusunda hiçbir belirsizlik yok.'
      icon: tabler:file-text
    - title: Değişim Kontrol Süreci
      description: Tasarım onayı sonrası tüm spesifikasyon değişiklikleri, etki değerlendirmesi (maliyet, zaman çizelgesi, uyumluluk) ile belgelenmiş bir değişiklik talebi sürecini takip eder. Onaylanmamış değişiklik üretime girmez.
      icon: tabler:arrows-diff
    - title: Parti Tutarlılığı Garantisi
      description: 50. ünite, 1. onaylanmış örnekle eşleşiyor. Onaylanmış spesifikasyonlar donduruluyor, malzeme ve süreç parametreleri kilitleniyor ve işlem içi kontrol noktaları üretim boyunca tutarlılığı doğruluyor.
      icon: tabler:repeat
    - title: Teslimat ve Kapasite Şeffaflığı
      description: Teslim süreleri, gerçek üretim kapasitesi, malzeme stok seviyeleri ve mevcut sipariş yükü temelinde belirtilir — hedefli hedeflere değil. Sipariş başına verilen kilometre taşı tarihleriyle üretim takvimi.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Sıkça Sorulan Sorular
  questions:
    - q: OEM ODM RIB Tekneler arasındaki fark nedir?
      a: 'OEM (Orijinal Ekipman Üretimi): siz ayrıntılı spesifikasyonları sunarsınız ve biz tasarımınızı oluştururuz.ODM (Orijinal Tasarım Üretimi): kanıtlanmış Aquafarer RIB bir platformu seçersiniz ve biz onu istediğiniz özellikler ve markayla özelleştiririz.ODM daha hızlı ve daha düşük maliyetlidir;OEM maksimum tasarım kontrolü sunar.'
    - q: RIB Gövde şeklini ve boyutunu özelleştirebilir miyim?
      a: Evet. Mevcut gövde kalıplarına yarı özel modifikasyonlar (farklı güverte düzenleri, tüp konfigürasyonları) ve yeni makineli kalıplarla tam özel gövde geliştirme sunuyoruzCNC. Yarı özel projeler 2-5 üniteden başlayabilir; tam özel genellikle daha yüksek taahhütler gerektirir.
    - q: Özel özel ürünler için hangi tüp malzemeleri mevcutRIBs?
      a: Eğlence amaçlı ve hafif ticari kullanım için 0,9-1,2 PVC mm, profesyonel ve kurtarma ve ticari uygulamalar için ise 1,4-1,7 Hypalonmm /CSM yüksek UV ve ozon direnci gerektiren uygulamalar için (10-15 yıl ömrü vs. 5-8 yıl PVCiçin ).
    - q: RIBs Kurtarma, dalış veya balıkçılık gibi belirli uygulamalar için yapılandırabilir misiniz?
      a: Evet. Kurtarma/devriye, dalış desteği, turizm/kiralama, balıkçılık, yat destek gemisi ve profesyonel iş teknesi uygulamaları için kanıtlanmış konfigürasyon şablonlarını elimizde bulunduruyoruz. Her şablon, önerilen gövde tipi, boru malzemesi, güverte düzeni ve ekipmanları içerir — bunları tam ihtiyaçlarınıza göre özelleştiririz.
    - q: Bir RIB / alıntı için hangi bilgilere ihtiyacınız OEMODM var?
      a: Hedef uygulama, istenen gövde uzunluğu, boru malzemesi tercihi (PVCveya Hypalon), yaklaşık miktar ve teslimat takvimi, hedef pazar uyum gereksinimleri ve referans ürünleri veya spesifikasyonlar. Ne kadar çok detay verirseniz, teklifimizi o kadar hızlı ve doğru yaparız.
    - q: MOQ Özel RIB tekneler için ne gerekiyor?
      a: Standart modifikasyonlarla mevcut gövde kalıpları için tasarım MOQ başına 2-5 birimden başlar. Özel kalıplar ve tam özel geliştirme için MOQ ise proje karmaşıklığına bağlıdır — genellikle yarı özel kalıplar için 10-20 birim, yeni+ aletlerle tam özel için ise 30 birim.
    - q: Özel kalıplar ve çizimler kimdir?
      a: Temel tasarımlarla geliştirilen kalıplar Aquafarer mülkiyet olarak kalır Aquafarer . Müşteri tarafından sipariş edilen ve ödenen tamamen özel kalıplar, sözleşme şartlarına göre müşteri mülkiyetine tahsis edilebilir. Tüm kalıp sahiplik şartları proje başlamadan önce belgelenir.
    - q: RIBs İhracat için özel paketlenme nasıl yapılır?
      a: 'Standart: konteyner yüklemesi için özel beşik + streç sargı. Premium: perakendede hazır ambalaj, vakum paketi veya paletli. FOB Qingdao CIFve DDP kargo sunuyoruz. Tam ihracat belgeleri ve gümrük kontrolü dahil.'
