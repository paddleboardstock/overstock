hero:
  tagline: Özel RIB Üretim
  title: Özel RIB Tekne OEM<br />& ODM Hizmetleri
  subtitle: Kanıtlanmış platformlardan amaca yönelik deniz araçlarına kadar — Aquafarer, markalar, bayiler ve özel gövde konfigürasyonları, tüp malzemeleri, güverte düzenleri ve hedef pazarları için uyumluluk belgelerine ihtiyaç duyan profesyonel operatörler için RIB-özgü OEM ve ODM hizmetleri sağlar.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer’de özel RIB tekne OEM üretimi
direct_answer: Aquafarer olarak, CE sertifikalı Qingdao fabrikasından RIB-özgü OEM ve ODM özelleştirme sunuyor — özel gövde uzunlukları, tüp malzemeleri (PVC veya Hypalon/CSM), güverte düzenleri, konsol ve oturma konfigürasyonları ile tam RCD 2013/53/EU uyumluluk belgeleri dahil. MOQ, RIB modelleri için 2-5 birim ile başlar.
