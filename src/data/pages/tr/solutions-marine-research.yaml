content_challenge:
  tagline: Zorluk
  title: Deniz Araştırma Gereksinimleri<br />Kararlı, Cihaza Hazır Platformlar
  subtitle: Bilimsel iş tekneleri, hassas ölçüm cihazları için kararlı bir platform, vahşi yaşamı rahatsız etmemek için sessiz çalışma ve çeşitli araştırma ekipmanları için esnek düzenler sağlamalıdır.
  paragraphs:
    - Deniz araştırmaları ve çevresel izleme, mobil laboratuvar işlevi gören tekneler gerektirir. Ticari veya eğlence teknelerinin aksine, araştırma RIBs hassas elektronik cihazları, su ve sediment örnekleme ekipmanlarını ve bazen canlı örnek taşımayı barındırmak zorundadır — tüm bunları yaparken doğru veri toplamak için kararlı bir platformu korumalıdır.
    - '**Platform kararlılığı hayati önemdedir** — Sonar, eko sondalar ve CTD (iletkenlik, sıcaklık, derinlik) profilleyiciler, durgun ve yavaş hızda kararlı bir gövde gerektirir. Fazla dalga veya gövde hareketi bilimsel verilere gürültü katar. İyi kararlılık özelliklerine sahip derin-V gövde esastır.'
    - '**Cihaz entegrasyonu** — Araştırma tekneleri, GPS antenleri, sonar transdüserleri, örnekleme kolları ve veri kaydedici ekipmanlar için montaj noktalarına ihtiyaç duyar. Konsol alanı, birden fazla ekran, cihazlar için güç dağıtımı ve hassas elektronikler için güvenli depolama alanı sağlamalıdır.'
    - '**Sessiz çalışma** — Deniz biyolojisi araştırmaları ve çevresel izleme için motor gürültüsü ve gövde titreşimi deniz yaşamını korkutabilir ve davranış gözlemlerini etkileyebilir. Araştırma uygulamaları için sessiz dıştan takmalı motor konfigürasyonları ve az titreşimli gövde tasarımları önemlidir.'
    - Aquafarer araştırma RIBs, bilimsel ve çevresel izleme uygulamaları için kararlı gövde platformları, entegre ekipman montaj sistemleri ve sessiz dıştan takma motor konfigürasyonları ile tasarlanmıştır.
content_solution:
  tagline: Çözümümüz
  title: Amaç için Tasarlanmış Araştırma RIBs<br />Bilim ve Çevresel Çalışmalar İçin
  subtitle: Her Aquafarer araştırma RIB, bilimsel cihazlar ve saha örnekleme ekipmanları için kararlı, kişiselleştirilebilir bir platform olarak yapılandırılmıştır.
  list:
    - Durgun ve yavaş survey hızlarında mükemmel kararlılık sağlayan derin-V fiberglas gövde
    - Sonar, GPS ve örnekleme ekipmanları için montaj plakalarına sahip düz güverte düzeni
    - Birden fazla ekran için yapılandırılmış konsol — plotter, sounder, veri kaydedici
    - Bilimsel aletler için 12V ve 24V yardımcı güç dağıtımı
    - Sessiz 4-zamanlı dış motor — vahşi yaşam araştırmaları için minimum titreşim ve gürültü
    - Veri toplama sırasında minimum rahatsızlık için isteğe bağlı düşük dalgalı gövde tasarımı
    - Araştırma kurumlarının markalaşması ve filo tanımlaması için özel tüp renkleri
content_segments:
  tagline: Araştırma Profilleri
  title: Deniz Bilimi Çözümleri<br />Uygulama Türüne Göre
  subtitle: Farklı araştırma uygulamalarının benzersiz gemi gereksinimleri vardır — üniversite öğretim platformlarından çevresel araştırma gemilerine ve su kalitesi RIBsizlemeye kadar.
  items:
    - title: Üniversite Deniz Bilimleri Programları
      subtitle: Öğretim platformları, öğrenci saha gezileri, kıyı araştırmaları
      description: Deniz bilimleri üniversiteleri ve okyanusografi bölümleri, saha kursları, öğrenci araştırma projeleri ve öğretim üyeleri liderliğindeki kıyı araştırmaları için güvenilir ve çok yönlü çalışma teknelerine ihtiyaç duyar. Tekne, gözetim altındaki öğrenciler için kullanımı kolay, uygulamalı enstrüman kullanımı için yeterince stabil ve akademik dönemler boyunca birden fazla kullanıcı tarafından sıkça kullanılabilecek kadar dayanıklı olmalıdır. Akademik ortamlarda bütçe kısıtlamaları, maliyet etkinliği ve düşük bakım konularını önemli kılar.
      features:
        - Öğrenci enstrüman kullanımı ve kurtarma uygulamaları için stabil platform
        - Kolay kullanım — denetimli öğrenci kullanımı için tiller veya tek konsol konfigürasyonu
        - Hypalon Sık sık sahil inişleri ve öğrenci kontrolü için dayanıklı tüpler
        - Öğretim sınıfı sonar, secchi disk ve örnekleme ekipmanı için ekipman montajı
        - PVC Bütçe kısıtlı akademik programlar için maliyet etkin seçenek
    - title: Deniz Araştırma Enstitüleri
      subtitle: RIBs Ölçüm ve enstrüman entegrasyonu, GPS, örnekleme ekipmanı
      description: Kıyı ve açık deniz araştırmaları yapan özel deniz araştırma kuruluşları, RIBs entegre enstrümantasyonla profesyonel olarak yapılandırılmış bir araştırmaya ihtiyaç duyar. Bu gemiler, batimetrik haritalama için sonar sistemleri, su sütunu analizi için CTD profilleyiciler, tortu örnekleyicileri ve biyolojik toplama ekipmanları taşır. Tekne, yavaş ölçüm hızlarında stabil bir platform sağlamalı, ekipmanların yerleştirilmesi için geniş güverte alanına sahip olmalı ve elektronik için temiz 12V/24V güç sağlamalıdır.
      features:
        - Entegre sonar dönüştürücü montajı — gövde içi veya transom konfigürasyonu
        - Araştırma düzeyinde navigasyon için GPS anten montajı ve konsol entegrasyonu
        - CTD ve güvenli bağlama noktalarına sahip su numune cihazı yerleştirme alanı
        - Enstrümanlar ve veri kayıtçıları için 12V/24V yardımcı güç dağıtımı
        - Yavaş hızda (3-6 knot) ölçüm hattı doğruluğu için stabil
        - Daha ağır örnekleme ekipmanlarının yerleştirilmesi için isteğe bağlı A-çerçeve veya davit
    - title: Çevresel İzleme ve Koruma
      subtitle: Ekolojik araştırmalar, yaban hayatı gözlemi, habitat değerlendirmesi
      description: Çevresel STK'lar, devlet kurumları ve koruma kuruluşları deniz ekolojik araştırmaları, yaban hayatı popülasyonu izleme ve habitat değerlendirmeleri yapar. Bu operasyonlar, vahşi yaşamı rahatsız etmeden hassas habitatlara yaklaşabilen sessiz, düşük etkili gemiler gerektirir. Tekneler, kamera ekipmanı, transekt haritalama için GPS ve su ile tortu toplama için örnekleme ekipmanı taşımalıdır. Düşük dalga ve minimum motor gürültüsü, davranışsal gözlem çalışmaları için kritik öneme sahiptir.
      features:
        - Sessiz 4-zamanlı dış motor — deniz vahşi yaşamına minimum rahatsızlık
        - Fotoğrafçılık ve video dokümantasyonu için stabil gözlem platformu
        - Kamera sistemleri, GPS izleyiciler ve saha bilgisayarları için ekipman montajı
        - Kıyı sulak alanları, mangrovlar ve nehir ağızlarına erişim için sığ draft
        - Siteler arasında kontaminasyonu önlemek için kolay temizlenen güverte ve tüp yüzeyleri
    - title: Su Kalitesi İzleme ve Test
      subtitle: Düzenli örnekleme gezileri, kirletici izleme, uyum takibi
      description: Su kalitesi izleme kuruluşları, kirlilik seviyelerini, alg patlamalarını ve çevre düzenlemelerine uyumu izlemek için kıyı bölgeleri, limanlar ve iç su yolları boyunca düzenli örnekleme gezileri yapar. Bu işlemler, sabit örnekleme istasyonlarını tekrar ziyaret etmek için verimli ve güvenilir teknelere ihtiyaç duyar. Tekne, örnekleme ekipmanlarını, örneklerin korunması için soğutucuları ve saha testi ekipmanlarını taşımalı — ve siteler arasında çapraz kontaminasyonu önlemek için güverte kolayca yıkanabilmelidir.
      features:
        - Soğutucu ve ekipman depolaması ile özel örnekleme istasyonu alanı
        - Siteler arasında dezenfeksiyon için kolay temizlenen güverte ve tüp yüzeyleri
        - Sabit örnekleme koordinatlarına hassas geri dönüş için GPS entegrasyonu
        - Sınırlı su yolları ve dar kanallara erişim için kompakt boyut
        - Düzenli örnekleme gezileri için yakıt tasarruflu dıştan takma motor
