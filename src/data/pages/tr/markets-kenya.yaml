  subtitle: Diani, Watamu, Mombasa ve Nairobi — plaj işletmecileri, tatil köyleri ve perakendeciler, 5 üniteden yeni fazla stok kartları stoklayan karma modeller.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
