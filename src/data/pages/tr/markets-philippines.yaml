hero:
  tagline: Filipinler
  title: Toptan SUP Panolar için<br />Filipinler İşletmeleri
  subtitle: El Nido ve Siargao'dan Boracay'a kadar ada tatil köyleri, plaj kulüpleri ve kürek operatörleri — Çin'den gönderilen 5 üniteden yepyeni fazla stok tahtalar, karışık modeller.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Filipin adaları tatil köyleri ve kürek operatörleri için aşırı stok tahtaları
direct_answer: Paddle Board Overstock SUP Filipinli işletmelere — Palawan ve Siargao'daki ada tatil köylerine, Boracay ve Cebu'daki plaj kulüplerine, kiralama ve tur operatörlerine ve küçük perakendecilere yepyeni fazla şişme tahtalar tedarik eder. Toptan siparişler, Weihai, Çin'den ekspres hava yükü veya konsolide deniz yükü ile gönderilen tek bir sevkiyatta karışık modeller olan 5 karttan başlıyor. Her kart %100 baskı testine dayanmış ve 2 Yıllık SUP Garanti kapsamındadır.
tldr_points:
  - 5 karttan toptan — toplam miktara göre fiyatlandırılmış karışık modeller
  - Filipinler takımadaları genelindeki ada tatil köyleri ve plaj kulüplerine hizmet vermek
  - Weihai, Çin'den ekspres hava veya konsolide deniz taşımacılığı
  - '%100 basınç testinden geçti, SUP her kartta 2 Yıl Garanti'
overview_section:
  tagline: Pazar Genel Bakış
  title: Filipin SUP Pazarı
  paragraphs:
    - Yedi binden fazla adaya sahip olan Filipinler, ayakta kürek çekmek için inşa edilmiş. El Nido ve Coron'un lagünleri, Siargao'nun rahat sörf ve ada ortamı, Boracay'ın plaj kulübü enerjisi ve Cebu'nun dalış ve su sporları ekonomisi, turistlerin kireçtaşı lagününde gün doğumunda kürek çekenlerinden, Manila ve ötesinde, fitness ve yoga toplulukları kuran yerel halka kadar istikrarlı bir talep SUP yaratıyor.
    - The buyers are typically resort and tour operators: ada tatil köyleri, yakıt, motor ve lisans gerektirmeyen misafir aktiviteleri ekliyor; ada gezi tur operatörleri tekliflerini genişletiyor; ve yerel kürek topluluğuna hizmet veren küçük dükkanlar. Siparişler küçük — 5–20 board — ve ilk kez ziyaret edenler için stabil genel panolar ile tatil köyü görünümü için birkaç premium baskı arasında karışık.
  customer_types:
    - title: Ada Tatil Merkezleri
      description: Palawan, Siargao ve Boracay tatil köyleri SUP kompakt karma filolarla misafir programları eklemektedir.
    - title: Tur Operatörleri
      description: Ada atlama ve lagün tur operatörleri güzergahlarına kürek durakları ekledi.
    - title: Yerel Dükkanlar ve Okullar
      description: Şehir merkezli okullar ve mağazalar, büyüyen Filipinler kürek ve SUP yoga topluluğuna hizmet vermektedir.
shipping_section:
  title: Filipinler'e gemi
  paragraphs:
    - Siparişler Weihai, Çin'den gönderilir. Ekspres hava yükü örnekleri ve 1–3 board siparişini Manila ve Cebu'ya hızlı şekilde taşır; konsolide deniz yükü ise Manila ve diğer Filipinler limanları üzerinden 5–20 board toptan sipariş verir. Varış yeriniz için toplu taşıma tahminleri — metro Manila veya eyalet — teklifinize dahildir.
    - Ticari fatura ve paketleme listesi temizliği için gerekli olan, doğru HS kodları ve beyanmış değerlerle birlikte sağlıyoruz. İthalat vergileri ve vergileri, Filipinler kurallarına göre ithalatçı tarafından ödenmelidir.
  customs_note: Eyalet destinasyonları için, liman veya havalimanından nihai teslimat kapı-kapı tahmininin bir parçası olarak belirtilir. Spor ekipmanları için mevcut ithalat vergisi işlemini brokerınızla doğrulayın; biz tam belgeleri sağlıyoruz.
faq_section:
  title: Filipinler SSS
  items:
    - q: Filipinler'e gönderim ne kadar sürer?
      a: Yönteme bağlıdır. Manila veya Cebu'ya ekspres hava taşımacılığı, örnekler ve 1–3 board siparişi için en hızlı seçenektir; Konsolide deniz yükü ise 5–20 board toptan siparişi uygundur ve limanınız için bir geçiş penceresi ile teklif edilir. Her iki tahmin de teklifinizde detaylı olarak belirtilmiştir.
    - q: Boardlar Palawan veya Siargao gibi eyalet adalarına ulaşabilir mi?
      a: Evet — taşra bölgelerine kapıdan kapıya teslimat, varış limanından veya havaalanından sonraki yerel lojistik kullanılarak navlun tahmini kapsamında belirtilir. Sorgunuzdaki tahmini ve seçenekleri not edin, biz bunu özel olarak fiyatlandırırız.
    - q: Bir tatil köyü başlangıç filosu nasıl görünür?
      a: 'Genellikle 5–10 board: misafir dersleri ve serbest kürek çekme için stabil, her yönüyle uygun modeller, artı sahil kenarı için bir veya iki premium sanat baskısı. Karışık modeller, tek gönderim, toplam miktara göre fiyatlandırılır.'
    - q: Boardlar lagün ve resif-düzlüğü kullanımına uygun mu?
      a: Evet — sakin, sığ, sıcak su koşulları, her yönüyle şişme SUP boardların tasarlandığı tam koşullardır ve esnek yüzgeç ile dayanıklı drop-stitch yapı, resif-düzlüğü ve sahil inişlerini iyi şekilde karşılar.
