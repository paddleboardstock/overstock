faq_section:
  title: Toptan SSS
  items:
    - q: Minimum toptan sipariş miktarı nedir?
      a: Beş kart. Fazla stok modelimiz küçük perakendeciler için tasarlanmıştır — toptan fiyat almak için bir konteyner doldurmanıza gerek yok.
    - q: Farklı SUP modellerini bir toptan siparişte karıştırabilir miyim?
      a: Evet. Karışık model siparişleri, fazla stok almanın en büyük avantajlarından biridir — stokta bulunan herhangi bir modeli tek bir gönderimde birleştirebilirsiniz ve toplam kart sayısı fiyatlandırma seviyenizi belirler. Ayrıntılar için karışık model toptan sayfamıza bakın.
    - q: Panolar yepyeni mi?
      a: Evet. Her pano yepyeni, kullanılmamış fazla stok - asla ikinci sınıf, yenilenmiş veya müşteri iadesi değil. Her pano sevk edilmeden önce %100 basınç testinden geçer.
    - q: Toptan satış perakendeye kıyasla ne kadar daha ucuz?
      a: Toptan birim fiyatlandırması, modeller ve miktarlara göre sipariş bazında teklif edilir ve yukarıda listelenen perakende fiyatlarının anlamlı şekilde altındadır. Hedef karışımınız için teklif isteyin ve tam olarak fiyatlandıracağız.
    - q: Hangi nakliye yöntemini seçmeliyim?
      a: Hızlı hava taşımacılığı 1–3 pano, numuneler ve acil stoklar için uygundur. Konsolide deniz taşımacılığı, 5–20 pano perakendeci siparişleri için ekonomik seçenektir. Her soruda her iki seçeneği de teklif ediyoruz.
    - q: Toptan satın alınan panolarda hangi garanti vardır?
      a: Her müşteriye verdiğimiz ve sevk ettiğimiz 50+ ülkenin her birinde geçerli olan 2 Yıllık SUP Garanti ile aynıdır.
    - q: Ülkenize gönderiyor musunuz?
      a: Şu anda 50'den fazla ülkeye sevkiyat yapıyoruz; Latin Amerika, Güneydoğu Asya, Afrika, Orta Doğu ve Meksika, Brezilya, Filipinler, Endonezya, Tayland, Güney Afrika, Kenya ve BAE gibi ana pazarlar için bölgesel rehberlerimiz mevcuttur. Teklif talebinizde sorun, mevcut servisi adresinize doğrulayacağız.
