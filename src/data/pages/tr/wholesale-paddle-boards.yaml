      description: Yukarıdaki stokta bulunan 11 modeli inceleyin veya karma model seçicisini kullanarak müşterilerinize uygun bir kombinasyon hazırlayın.
    - title: Fiyat Teklifi İste
      description: Aşağıdaki sorgulama formunu kullanarak modelleri, tahmini miktarları, ülkenizi ve tercih ettiğiniz kargo hızını bize gönderin. Birim fiyatlandırma ve kargo seçenekleriyle yanıt veriyoruz.
    - title: Onayla ve Öde
      description: Nihai teklifi onaylayın — modeller, miktarlar, nakliye yöntemi ve toplam. Ödeme koşulları teklif esnasında onaylanır.
    - title: Biz Test Eder, Paketler ve Göndeririz
      description: Her kart %100 basınç testi yapılır, tüm aksesuar seti ile paketlenir ve Weihai’den gönderilir. Tüm yolculuk için takip bilgisi alırsınız.
