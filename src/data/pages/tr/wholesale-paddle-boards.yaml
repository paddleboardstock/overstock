  title: Mevcut Ürünler ve Mevcut Stok
  subtitle: Aşağıdaki 11 ürünün tamamı mevcut fazla stok stoklarıdır. Koşullar yepyeni; stok seviyeleri haftalık olarak değişir, bu yüzden teklif talebinizde uygunluğu onaylayın.
