hero:
  tagline: Toptan SUP Satış Kurulları
  title: Toptan Şişme Paddle Boardlar<br />Küçük İşletmeler İçin
  subtitle: SUP Küçük işletmeler için uygun miktarlarda yepyeni fazla stok kartları. 5–20 adet kart sipariş edin, herhangi bir modeli tek bir sevkiyatta karıştırın ve 50 ülkeye ekspres hava veya deniz taşımacılığı+ seçeneğini seçin.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Sevkiyata hazır toptan şişme SUP kartlar Paddle Board Overstock
direct_answer: Paddle Board Overstock Dünya çapında küçük perakendecilere yepyeni fazla stok şişme SUP kartlar tedarik eder. Büyük bir minimum sipariş yoktur — toptan sipariş sadece 5 karttan başlar ve stokta bulunan herhangi bir modeli tek bir siparişte karıştırabilirsiniz. Kartlar, Weihai, Çin merkezimizden ekspres hava kargosu (1–3 kart, numune veya acil stok) veya konsolide deniz yükü (5–20 kart perakendeci siparişi) ile gönderilir. Her kart, sevk öncesi %100 baskı testinden geçer ve 2 Yıllık Garanti kapsamında SUP korunur.
tldr_points:
  - 'Düşük MOQ: toptan siparişler 5 karttan başlıyor — küçük mağazalar için boyutlandırılmış, konteyner yükleri için değil'
  - 'Karma model siparişleri: stoktaki tüm SUP modelleri tek bir sevkiyatla birleştirin'
  - 'İki nakliye seçeneği: 1–3 kart için ekspres hava yükü, 5–20 araçlık siparişler için deniz yükü'
  - 'Yepyeni stok: %100 basınç testi, %99,3 son muayene geçiş oranı, 2 Yıl SUP Garanti'
why_retailers:
  title: Küçük Perakendeciler Neden Fazla Stok SUP Kartlarını Seçiyor
  subtitle: Toptan fiyatlarla satın almak için depo veya konteyner bütçesine ihtiyacınız yok.
  items:
    - title: Küçük İşletme Dostu Miktarlar
      description: Geleneksel toptan satış sipariş başına yüzlerce birim gerektirir. Fazla stok modelimiz bağımsız mağazalar için tasarlanmıştır — 5 kartla başlayın ve mağazanız büyüdükçe siparişinizi büyütün.
    - title: Hacim taahhüdü olmadan gerçek toptan fiyatlandırma
      description: Aşırı stok sattığımız için — fazla üretim ve seçilmiş partner fabrikalardan dikkatlice temin edilen stoklar — hacim düzeyinde birim fiyatlandırması elde ediyorsunuz, hacim düzeyinde risk olmadan.
    - title: Müşterilerinize Uygun Modelleri Karıştırın
      description: Plaj dükkanları, göl ekipman mağazaları ve şehir mağazaları farklı kürekçilere hizmet veriyor. Rafınız yerel talebinize uygun olmak için her taraftan tur, gezi ve sörf SUP tarzı modelleri tek bir siparişte karıştırın.
    - title: Yepyeni, hiç kullanılmamış
      description: Stok stokumuzdaki her karton yepyeni ve kullanılmamış — ne ikinci arta, ne de iade. Her karton, depodan çıkmadan önce %100 baskı testinden geçiyor.
    - title: Hızlı ve Esnek Uluslararası Nakliye
      description: Ekspres hava yükü ise kapınıza hızlıca 1–3 kart veya örnek sipariş getirir; konsolide deniz yükü ise 5–20 kartlık perakendeci siparişlerinde araç başına maliyeti düşük tutar.
    - title: Gerçek Garantiyle Destekleniyor
      description: Toptan satış, desteklenmediği anlamına gelmez. Her SUP pano 2 Yıllık SUP Garantimizi taşır; bu kapsam 50 ülkedeki her müşteriye verdiğimiz+ aynı kapsamdır.
pricing_section:
  tagline: Toptan Fiyatlandırma
  title: Basit, Şeffaf Toptan Fiyatlandırma
  subtitle: Fiyatlandırma, seçtiğiniz modellere, miktarlara ve kargo yöntemine göre sipariş başına teklif edilir. Gizli ücret yoktur — aldığınız teklif, ödediğiniz fiyattır.
  points:
    - title: Miktara Göre Kademeli
      description: Birim fiyatları, sipariş büyüklüğü arttıkça düşer. 10 kartlık sipariş, 5 tahtalı siparişten daha iyi fiyata sahiptir; 20 kartlık sipariş ise daha da iyidir.
    - title: Karışık modeller toplamda bir sayılır
      description: İndirim seviyeniz, siparişteki toplam kart sayısına göre belirlenir — model başına değil. 4 farklı modeli × 3 kartı karıştırmak 12 kartlık sipariş sayılır.
    - title: Kargo seçenekleriyle birlikte teklif
      description: Her teklif, tahmini transit süreleriyle birlikte hem ekspres hem de deniz yükü seçeneklerini içerir, böylece stok zamanınıza uygun hız-maliyet dengesini seçebilirsiniz.
    - title: Hesap veya üyelik gerektirmiyor
      description: Katılabileceğiniz toptan kulüp yok ve yıllık ücret yok. Teklif talep edin, siparişi onaylayın ve gönderiyoruz.
