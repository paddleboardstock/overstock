who_section:
  tagline: Kime Tedarik Ediyoruz
  title: Bağımsız Su Sporları İşletmeleri İçin Inşa Edilmiştir
  items:
    - title: Plaj ve Sörf Dükkanları
      description: Sezon başına 5–15 tahta ihtiyaç duyan küçük kıyı perakendecileri; turistler için genel modeller ile yerel halk için sörf tarzı boardlar arasında karışım.
    - title: Çevrimiçi Satıcılar
      description: E-ticaret mağazaları ve pazar yeri satıcıları SUP , tek bir modelin tam bir konteynerine bağlı kalmadan kategoriyi test ediyor.
    - title: Kiralanma Filoları ve Okullar
      description: Kira operasyonları ve SUP okullar filoları dolduruyor — dayanıklı kartlar, farklı müşteri büyüklüklerine hizmet etmek için karma modeller ve garanti desteği.
    - title: Tatil Köyleri ve Tur Operatörleri
      description: Oteller, ada tatil köyleri ve tur operatörleri SUP , küçük ilk filolar ve kolay mevsimsel stoklama ile etkinlik sıralarına katkıda bulunuyor.
