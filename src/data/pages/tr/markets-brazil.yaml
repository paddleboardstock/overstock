hero:
  tagline: Brezilya
  title: Toptan SUP Panolar için<br />Brezilya Perakendecileri
  subtitle: Rio ve Florianópolis'ten Kuzeydoğu kıyısına kadar olan atölyeler ve işletmeciler için — Çin'den gönderilen 5 üniteden yepyeni fazla stok paddle board'lar, karışık modeller.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Brezilya plaj perakendecileri ve kürek okulları için fazla stok tahtası
direct_answer: Paddle Board Overstock SUP Brezilya işletmelerine — Rio de Janeiro, Florianópolis ve Kuzeydoğu kıyısındaki kürek okulları ve dükkanlara, kiralama operatörlerine ve çevrimiçi satıcılara yepyeni fazla stoklu şişme kartlar tedarik eder. Toptan siparişler, Weihai, Çin'den ekspres hava yükü veya konsolide deniz yükü ile gönderilen karışık modellerle birlikte 5 karttan başlar. Her kart %100 baskı testine sahiptir ve 2 Yıllık SUP Garanti kapsamındadır.
tldr_points:
  - 5 karttan toptan — toplam miktara göre fiyatlandırılmış karışık modeller
  - Brezilya'nın Rio'dan Kuzeydoğu'ya kadar plaj kültürüne hizmet vermek
  - Weihai, Çin'den ekspres hava veya konsolide deniz taşımacılığı
  - '%100 basınç testinden geçti, SUP her kartta 2 Yıl Garanti'
overview_section:
  tagline: Pazar Genel Bakış
  title: Brezilya SUP Pazarı
  paragraphs:
    - Brezilya, dünyanın en doğal stand-up paddle pazarlarından biridir. Plaj kültürü ulusal kültürdür — Rio lagünlerindeki Stand Up Paddle sahnesinden ve Florianópolis'in sörf ve düz su karışımından Kuzeydoğu'nun sıcak ve sakin sularına kadar Ceará, Pernambuco ve Bahia'ya kadar. Kürek okulları, lagün kiralamaları ve rüzgar aşağı tarafı ile SUP sörf toplulukları devasa, spora düşkün bir nüfustan geliyor.
    - Brezilyalı alıcılar genellikle sahip tarafından işletilen işletmelerdir — lagün kenarında kiralık standlar, plaj okulları, hatlar ekleyen sörf SUP dükkanları ve artan yerli e-ticaret satıcıları. Küçük partiler halinde (5–20 tahta sipariş veriyorlar) ve günlük kullanım için dayanıklılık ile anlamlı ithalat maliyetleri olan bir pazarda fiyat rekabetçiliği önemsiyorlar.
  customer_types:
    - title: Lagün ve Plaj Okulları
      description: Rio'nun lagünlerinde ve Kuzeydoğu'nun sakin su plajlarında ders ve saatlik kiralama hizmeti veren okullar ve kiralama işletmeleri.
    - title: Sörf Dükkanları
      description: Yerel kürek topluluğu için düz su ve tur ekleyen yerleşik sörf SUP perakendecileri.
    - title: Çevrimiçi Satıcılar
      description: Yerel e-ticaret satıcıları, SUP Brezilya'nın devasa iç pazarına hizmet etmek için stok ithal ediyor.
shipping_section:
  title: Brezilya'ya gemi
  paragraphs:
    - Siparişler Weihai, Çin'den gönderilir. Ekspres hava yükü Brezilya'nın büyük havaalanlarına örnekler ve 1–3 board siparişi taşır; konsolide deniz yükü ise Santos ve diğer kıyı geçitleri gibi limanlar üzerinden 5–20 board toptan sipariş verir. Varış yeriniz için toplu taşıma tahminleri teklifinize dahil edilir.
    - Doğru HS kodları ve beyanlı değerlerle birlikte ticari fatura ve paketleme listesini sağlarız. İthalat vergileri ve vergiler, Brezilya kurallarına göre ithalatçı tarafından ödenmelidir.
  customs_note: Brezilya'nın spor malzemeleri üzerindeki ithalat vergileri önemlidir ve ürün sınıflandırmasına göre değişiklik gösterir. Sipariş vermeden önce mevcut gümrük vergisi, KDV ve eyalet düzeyindeki ücretleri gümrük komisyoncunuza (despachante) onaylayın — biz tam belgeler sağlarız ancak ithalat vergilerini yük tekliflerine dahil etmeziz.
faq_section:
  title: Brezilya SSS
  items:
    - q: Teklif ve destek Portekizce olarak yönetilebilir mi?
      a: Evet — Portekizce konuşan alıcılarla çalışıyoruz. Sorunuzu sorun, teklifinizi ve siparişinizi Portekizce hallederiz.
    - q: Brezilya'nın ithalat vergileri fiyatlarınıza dahil mi?
      a: Hayır. Brezilya kurallarına göre ithalat vergileri, KDV ve eyalet düzeyindeki vergiler ithalatçının sorumluluğundadır. Fiyatlandırma ve kargo fiyatlarını net ve ayrı ayrı veriyoruz ve ihtiyacınız olan evrakları sağlıyoruz.
    - q: Brezilya plaj okulu için ilk sipariş nasıl olur?
      a: 'Genellikle 5–15 board: dersler ve saatlik kiralamalar için dayanıklı genel modeller, ayrıca perakende sergisi için birkaç premium baskı. Tek bir sevkiyatta karışık modeller, toplam miktara göre fiyatlandırılır.'
    - q: Brezilya'ya deniz taşımacılığı yapıyor musunuz?
      a: Evet — konsolide deniz taşımacılığı, hedefe göre fiyatlandırılan 5–20 board toptan siparişleri için Brezilya limanlarına hizmet verir. Örnekler ve acil küçük siparişler için ekspres hava taşımacılığı mevcuttur.
