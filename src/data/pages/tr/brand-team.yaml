hero:
  tagline: Ekibimiz
  title: Arkadaşlarının Arkasında Paddle Board Overstock<br />— Suda Özgürlüğü Mühendislik
  subtitle: 2012 yılında Çin'in Weihai kentinde kurulan Paddle Board Overstock, profesyonel kalitede şişme sörf tahtalarını dünya çapında erişilebilir kılmaya inanan deniz mühendisleri, malzeme bilimcileri ve su sporları meraklıları tarafından inşa edildi.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock tüm ekip fotoğrafı — mühendislik, üretim ve liderlik
founding:
  tagline: Kuruluşumuz
  title: Bir Sahil Atölyesinden<br />12.000 m²'lik bir tesise
  subtitle: Paddle Board Overstock, onlarca yıllık birleşik deneyime sahip deniz mühendisleri ekibi tarafından şişme SUP tasarımı, drop-stitch inşaatı ve dünya çapında su sporları üretimi alanında kuruldu.
  items:
    - title: 'Kuruluş: 2012'
      description: Weihai, Çin’de kuruldu — derin gemi yapım mirasına sahip önemli bir denizcilik merkezi.
      icon: tabler:calendar
    - title: 200-300 Çalışan
      description: 14+ Ar-Ge mühendisi, kalite kontrol uzmanı ve üretim teknisyeni dahil.
      icon: tabler:users
    - title: 12.000 m² Tesis
      description: 6 üretim hattına sahip SUP kartlar ve aksesuarlar için özel üretim tesisi.
      icon: tabler:building-factory
    - title: Hizmet Verilen 50 Ülke
      description: Avrupa, Amerika, Orta Doğu, Asya-Pasifik ve Afrika'ya ihracat yapmaktadır.
      icon: tabler:globe
leadership:
  tagline: Liderlik
  title: Yönetim ve Mühendislik Liderliği
  subtitle: Liderlik ekibimiz, deniz mühendisliği, uluslararası ticaret ve kalite yönetimi konularında derin uzmanlığı bir araya getiriyor.
  columns: 3
  items:
    - title: Kurucu ve CEO
      name: Toby Liu
      description: Denizcilik üretiminde 15+ yıl. Önceden büyük bir Çinli denizcilik üreticisinde Ar-Ge'yi yönetti. Şişme ürün tasarımında birden fazla patente sahip.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Baş Mühendis
      name: Zhang Wei
      description: Polimer imalatı ve şişme yapı tasarımında 20+ yıl deneyim. Eski teknik direktör, bir Avrupa deniz mühendisliği firmasında.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ar-Ge Başkanı
      name: Chen Ming
      description: Malzeme Bilimi alanında doktora. drop-stitch teknolojisi ve yüksek frekanslı kaynak işlemleri konusunda uzman. Tekstil kompozitlerinde 10+ yıl deneyim.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Üretim Müdürü
      name: Liu Qiang
      description: 18+ yıl yalın üretim ve üretim hattı optimizasyonu deneyimi. %99,3 hata oranı olmayan ürünlerimizin arkasındaki kalite sistemlerini kurdu.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Kalite Müdürü
      name: Wang Fang
      description: 12+ yıl deniz kalite kontrolü deneyimi. Her üretim partisinin piyasaya sürülmeden önce basınç, dikiş ve yük testlerini denetler.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Satış ve Operasyon Direktörü
      name: Helen Lee
      description: 15+ yıl uluslararası e-ticaret ve lojistik deneyimi. 50+ ülkeye kürek tahtası gönderiyor. 4 dilde akıcı.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Tasarım Felsefesi
  title: Mühendislik Odaklı Tasarım<br />— Her Detay Önemlidir
  subtitle: Mühendislik felsefemiz, ürettiğimiz her ürünü yönlendiren üç ilkeye odaklanır.
  list:
    - 'Öncelik Güvenilirlik: Her Paddle Board Overstock ürün, soğuk su gezilerinden tropik plaj kiralamalarına kadar gerçek dünya koşullarına dayanacak şekilde test edilir. En çok önem taşıyan yerlerde aşırı mühendislik yapıyoruz.'
    - 'Üretim Hassasiyeti: Tesislerimiz CNC kesme, yüksek frekanslı kaynak ve otomatik basınç testleri kullanır. Her dikiş, her vana, her bağlantı belgelenmiş spesifikasyonlara uygundur.'
    - 'Sürekli İnovasyon: Ar-Ge ekibimiz sürekli olarak yeni malzemeleri, üretim yöntemlerini ve tasarım iyileştirmelerini değerlendirir. Sorunların ortaya çıkmasını beklemeyiz — onları önceden tahmin ederiz.'
cta:
  title: Ekibimizle bir proje hakkında konuşmak ister misiniz?
  subtitle: Ekibimiz, kürek tarzınıza uygun doğru tahtayı, aksesuarları ve ekipmanı seçmenize yardımcı olmaya hazır.
  actions:
