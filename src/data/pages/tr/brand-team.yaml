hero:
  tagline: Ekibimiz
  title: Paddle Board Overstock'ın Arkasındaki İnsanlar<br />— Suda Özgürlüğü Mühendislik
  subtitle: 2012 yılında Çin'in Qingdao kentinde kurulan Paddle Board Overstock, profesyonel düzeyde şişme su araçlarını dünya çapında erişilebilir kılmaya inanan deniz mühendisleri, malzeme bilimcileri ve su sporları tutkunları tarafından kuruldu.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock tüm ekip fotoğrafı — mühendislik, üretim ve yönetim
founding:
  tagline: Kuruluşumuz
  title: Bir Sahil Atölyesinden<br />12.000 m²'lik bir tesise
  subtitle: Paddle Board Overstock, şişme tekne tasarımı, PVC/Hypalon üretimi ve dünya çapında deniz ekipmanları imalatında onlarca yıllık birleşik deneyime sahip bir deniz mühendisleri ekibi tarafından kuruldu.
  items:
    - title: 'Kuruluş: 2012'
      description: Çin'in Qingdao şehrinde kuruldu — derin bir gemi yapım mirasına sahip büyük bir denizcilik merkezi.
      icon: tabler:calendar
    - title: 200-300 Çalışan
      description: 50+ Ar-Ge mühendisi, kalite kontrol uzmanı ve üretim teknisyeni dahil.
      icon: tabler:users
    - title: 12.000 m² Tesis
      description: RIBs, şişme botlar ve SUP panolar için 6 üretim hattına sahip özel üretim tesisi.
      icon: tabler:building-factory
    - title: Hizmet Verilen 50 Ülke
      description: Avrupa, Amerika, Orta Doğu, Asya-Pasifik ve Afrika'ya ihracat yapmaktadır.
      icon: tabler:globe
leadership:
  tagline: Liderlik
  title: Yönetim ve Mühendislik Liderliği
  subtitle: Liderlik ekibimiz, deniz mühendisliği, uluslararası ticaret ve kalite yönetimi konularında derin uzmanlığı bir araya getiriyor.
  columns: 3
  items:
    - title: Kurucu ve CEO
      name: Toby Liu
      description: Deniz üretiminde 15+ yıl. Daha önce büyük bir Çinli tekne üreticisinde Ar-Ge'yi yönetti. Şişme tekne tasarımında birden fazla patente sahip.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Baş Mühendis
      name: Zhang Wei
      description: PVC/Hypalon üretimi ve derin V gövde tasarımında 20+ yıl. Avrupa'da bir deniz mühendisliği firmasında eski teknik direktör.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ar-Ge Başkanı
      name: Chen Ming
      description: Malzeme Bilimi alanında doktora. drop-stitch teknolojisi ve yüksek frekanslı kaynak işlemleri konusunda uzman. Tekstil kompozitlerinde 10+ yıl deneyim.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Üretim Müdürü
      name: Liu Qiang
      description: 18 yıl yalın üretim ve üretim hattı optimizasyonu deneyimi. Altı Sigma Siyah Kuşak. ISO 9001 kalite sistemlerini uyguladı.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Kalite Müdürü
      name: Wang Fang
      description: Deniz kalite kontrolünde 12+ yıl. Sertifikalı CE ve ISO denetçi. Her üretim partisinin testlerini denetler.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Satış ve Operasyon Direktörü
      name: Helen Lee
      description: Uluslararası B2B ticaretinde 15+ yıl. OEM/ODM ortaklıkları 30+ ülkede yönetti. 4 dilde akıcı.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Tasarım Felsefesi
  title: Mühendislik Odaklı Tasarım<br />— Her Detay Önemlidir
  subtitle: Mühendislik felsefemiz, ürettiğimiz her ürünü yönlendiren üç ilkeye odaklanır.
  list:
    - 'Önce Güvenilirlik: Her Paddle Board Overstock ürün, soğuk su kurtarma operasyonlarından tropik tatil yeri kiralamalarına kadar gerçek dünya koşullarına dayanacak şekilde test edilir. En çok önem verdiğimiz yerlerde aşırı mühendislik uygularız.'
    - 'Üretim Hassasiyeti: Tesislerimiz CNC kesme, yüksek frekanslı kaynak ve otomatik basınç testleri kullanır. Her dikiş, her vana, her bağlantı belgelenmiş spesifikasyonlara uygundur.'
    - 'Sürekli İnovasyon: Ar-Ge ekibimiz sürekli olarak yeni malzemeleri, üretim yöntemlerini ve tasarım iyileştirmelerini değerlendirir. Sorunların ortaya çıkmasını beklemeyiz — onları önceden tahmin ederiz.'
cta:
  title: Ekibimizle bir proje hakkında konuşmak ister misiniz?
  subtitle: Mühendislerimiz ürün seçimi, özelleştirme ve OEM/ODM ortaklıkları konusunda danışmanlık yapmaya hazırdır.
  actions:
    - variant: primary
      text: Ekibimizle iletişime geçin
      href: /contact
    - text: Ürünlerimizi görüntüleyin
      href: /products
