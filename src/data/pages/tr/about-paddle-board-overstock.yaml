hero:
  tagline: Hakkında
  title: Paddle Board Overstock Hakkında
  subtitle: 2012'den beri, SUP 50 ülkedeki kürekçiler ve küçük perakendecilerin eline yepyeni şişme tahtalar+ sunuyoruz — stok fazlası, dürüst fiyatlandırma ve gerçekten saygı gösterdiğimiz bir garanti.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Yepyeni şişme SUP tahtalar
direct_answer: Paddle Board Overstock 2012 yılında kurulan ve Çin'in Weihai kentinde bulunan bir su sporları ekipmanı markasıdır. Kendi üretim üssümüzden gelen SUP fazla üretim ile ortak fabrikalardan özenle seçilmiş stokların karışımı olan yepyeni şişme tahtaları doğrudan son kürekçilere ve 50 ülkedeki küçük perakendecilere+ satıyoruz. Her kart %100 basınç testinden geçiyor, 2 Yıllık SUP Garanti ile destekleniyor ve ekspres veya deniz taşımacılığı ile sevk ediliyor.
tldr_points:
  - 2012 yılında kurulan ve dünyanın önemli üretim merkezlerinden biri olan Çin'in Weihai şehrinde kuruldu SUP
  - 'Stok aşırı modeli: perakende fiyatının altında yepyeni kartlar, aracı yok'
  - 'Envanter karışık kaynaklıdır: üssümüzden fazla üretim ve denetlenmiş ortak fabrika stokları'
  - 50+ ülkede hizmet verildi, %99,3 son denetim geçme oranı, 2 Yıl SUP Garanti
story_section:
  tagline: Hikayemiz
  title: Neden Fazla Stok Satıyoruz
  paragraphs:
    - Paddle Board Overstock 2012 yılında Çin'in Weihai şehrinde başladı — Shandong eyaletindeki kıyı şehri ve dünyanın en önemli şişme SUP üretim merkezlerinden birine dönüştü. Bu temelden bu noktada, on yılı aşkın süredir şişme paddle boardlar üretip dünya çapında gönderdik.
    - Along the way we noticed something that shapes everything we do today: Her üretim sezonu geride yepyeni, gayet iyi olan kartlar bırakıyor — fazla ürünler, iptal edilmiş siparişler, geçen sezonun renk modelleri. Bu arada, dünya genelindeki bağımsız perakendeciler geleneksel tedarikçilerin konteyner boyutunda siparişler talep etmesi nedeniyle toptan satıştan kapalı kaldı.
    - Bu boşluk bizim işimiz. Fazla stok stoku satarak — kendi Weihai üssümüzden fazla üretim ve ortak fabrikalardan özenle seçilmiş stoklar — standart perakende fiyatlarının çok altında yepyeni kartlar sunabiliriz; bu miktarlarda tek bir kürekçi veya beş tahta atölye siparişi için uygun miktarlarda. Hiçbir şey ikinci el değildir, hiçbir şey ikinci el değildir; sadece bir depo yerine müşteriyi hak eden envanterdir.
model_section:
  tagline: İş Modelimiz
  title: Aşırı Stok Modeli Nasıl Çalışır
  items:
    - title: Yepyeni, hiç kullanılmamış
      description: Sattığımız her karton yepyeni ve kullanılmamış. Fazla stok, fazla ve fazla envanter demektir — iade değil, yenilenmiş değil, ikinci stok değil.
    - title: Karma Kaynaklı Envanter
      description: Stoklarımız, kendi Weihai üretim üssümüzden fazla üretimi aynı kalite barına sahip tuttuğumuz ortak fabrikalardan seçilen envanterle birleştiriyor. Kaynaklar karışık; standartlar değil.
    - title: Perakende Fiyatlarının Altında
      description: Fazla stok stoku almak bize daha az maliyet getiriyor, bu yüzden satın almak da size daha az maliyet getiriyor. Şişirilmiş liste fiyatı yok, sahte indirimler yok — sadece gerçek envanterin dürüst fiyatlandırması.
    - title: Küçük İşletme Dostu Toptan Satış
      description: Toptan satış 5 karttan başlıyor, konteyner yükü değil. Küçük perakendeciler stoktaki herhangi bir modeli tek siparişte karıştırıp ekspres veya deniz taşımacılığı seçebilir.
    - title: Doğrudan Sana Gönderim
      description: Siparişler doğrudan Weihai lojistik üssümüzden 50 ülkedeki kapınıza+ gönderilir — örnekler ve küçük siparişler için ekspres, toptan için konsolide deniz yükü.
quality_section:
  tagline: Kalite ve Garanti
  title: Her Tahtanın Arkasındaki Kalite
  subtitle: Aşırı stok fiyatlandırması asla standartların gevşekleştiği anlamına gelir. Her pano — kaynağı ne olursa olsun — gönderilmeden önce aynı süreci geçer.
  items:
    - title: '%100 Basınç Testinden Geçti'
      description: Her bir gemi şişirilir ve gönderilmeden önce 15 dereceye kadar basınç testinden PSI geçirilir. Hiçbir gemi, envanterinin nereden geldiği önemsiz, test edilmemiş değildir.
    - title: Aşırı Yük 1.25x'e Test Edildi
      description: Üretim serilerimizdeki kartlar, nominal basınçın ötesinde örnek testinden geçiriliyor — 1.25x çalışma basıncında 24–48 saat boyunca tutularak dikişler, valfler ve drop-stitch yapı doğrulanıyor.
    - title: '%99,3 Son Denetim Geçme Oranı'
      description: Son denetim sürecimiz, kartların %99,3'ünü hatasız olarak kabul ediyor — ve arızalanan küçük bir kısmı asla fazla stok stokumuza girmiyor.
    - title: 2 Yıl SUP Garanti
      description: Her SUP kart, SUP üretim kusurlarını kapsayan 2 Yıllık Garanti taşır. Aynı garanti, 50 pazarımızın her birindeki her müşteriye+ uygulanır.
