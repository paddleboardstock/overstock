  description: Weihai üssümüz,+ malzemeler, yapısal tasarım ve üretim süreçlerini kapsayan 14 kişilik bir araştırma ve geliştirme ekibine ev sahipliği yapmaktadır. Etraflarında kalite kontrol, envanter, lojistik ve bizimle iletişime geçtiğinizde ulaştığınız desteği yürüten daha geniş bir ekip faaliyet göstermektedir — ister bir kart ister yirmi pano satın alın, aynı kişiler.
