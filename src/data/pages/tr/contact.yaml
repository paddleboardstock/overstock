      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (ABD Merkez) · +86 13305324192 (fabrika)
      icon: tabler:headset
    - title: E-posta
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Küresel Merkez & Fatura
