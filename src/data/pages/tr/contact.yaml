hero_text:
  tagline: İletişim
  title: İLETİŞİME GEÇİN
contact_form:
  id: form
  title: Bize bir mesaj gönderin
  subtitle: Sipariş soruları, beden tavsiyesi veya ürün desteği için bize bir mesaj bırakın. Bir iş günü içinde yanıtlıyoruz.
  email_to: info@paddleboardoverstock.com
  submit_button: Sorgu Gönder → Teklif Al
  success_message: Teşekkürler! Mesajınız gelen kutumuza ulaştı. Bir iş günü içinde yanıt vereceğiz.
  error_message: Mesajınız gönderilirken bir sorun oluştu. Lütfen tekrar deneyin veya doğrudan e-posta gönderin.
  default_country_code: '+1'
  captcha:
    label: 'Spam karşıtı: lütfen aşağıdakini çözün'
  fields:
    - name: ad
      label: Ad
      row: 1
    - name: soyad
      label: Soyad
      row: 1
    - name: şirketAdı
      label: Şirket Adı
      row: 2
    - name: address
      label: Adres
      row: 3
    - name: zip
      label: Posta / Zip Kodu
      row: 4
    - name: country
      label: Ülke
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-posta
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: siparişHacmi
      label: Tahmini Sipariş Hacmi
      row: 6
      type: select
      options:
        - value: ''
          label: Kaç tane board almayı düşünüyorsunuz?...
        - value: one
          label: Sadece bir board
        - value: 2-4
          label: 2–4 board
        - value: 5-plus
          label: 5+ board (aile, kulüp veya kiralama)
    - name: customization
      label: Size ne konuda yardımcı olabiliriz?
      row: 7
      type: select
      options:
        - value: ''
          label: Bir konu seçin...
        - value: none
          label: Genel ürün sorusu
        - value: sizing
          label: Doğru boardu seçmede yardım
        - value: order
          label: Sipariş, ödeme veya kargo
        - value: warranty
          label: Garanti veya onarım desteği
    - name: Ürün ilgisi
      label: İlgilenilen Ürün Kategorileri
      row: 8
      type: select
      options:
        - value: ''
          label: Ürün kategorisi seçin...
        - value: all
          label: Tüm ürünler / Tam katalog
        - value: sup
          label: SUP Panolar / Paddleboardlar
        - value: packages
          label: Tam SUP paketleri
        - value: accessory
          label: Aksesuarlar (pompalara, kürekler, çantalar)
    - name: subject
      label: Konu
      row: 9
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
