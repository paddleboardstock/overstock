testimonial:
  content: Hiçbir sektörel deneyimim olmadan SUP markamı başlattım. Paddle Board Overstock ekibi, ürün seçiminden özel logo tasarımı ve ambalaja kadar bana rehberlik etti. İlk konteynerim 11 haftada geldi ve Amazon'da 3 ay içinde tükendi. Şimdi üçüncü konteynerimi sipariş ediyorum.
  name: Michael Park
  title: Kurucu, Shoreline Paddle Co. — California, ABD
content_segments:
  tagline: Girişimci Profilleri
  title: Su Sporları Marka Lansmanı<br />Girişimci Türüne Göre
  subtitle: Farklı kurucular farklı güçlerle gelir — e-ticaret uzmanlığı, sektör bağlantıları, içerik erişimi veya dağıtım altyapısı. OEM/ODM lansman programını başlangıç pozisyonunuza ve büyüme hedeflerinize göre uyarlıyoruz.
  items:
    - title: Amazon FBA & E-Ticaret Satıcıları
      subtitle: Veri odaklı, hızlı büyüyen marka oluşturucular
      description: Amazon, Walmart veya kendi Shopify mağazalarında su sporları ürünleri başlatan deneyimli çevrimiçi satıcılar. Listelemeleri optimize etmeyi, PPC yönetmeyi ve kategori verilerini okumayı biliyorsunuz — ancak e-ticaret hızını, iade oranlarını ve sezonsal talep dalgalanmalarını anlayan bir üretim ortağına ihtiyacınız var.
      features:
        - FBA boyut sınırlamalarına göre optimize edilmiş perakendeye hazır ambalaj
        - EAN/UPC barkod oluşturma ve Amazon uyumlu dokümantasyon
        - Talebi ölçeklemeden önce test etmek için düşük MOQ (her RIB SKU başına 2–5 birim, her SUP başına 5–10)
        - Birim başına maliyeti optimize etmek için karışık konteyner birleştirme
    - title: Fitness & Açık Hava Yaşam Tarzı Etkileyicileri
      subtitle: Önceliği kitle olan marka yaratıcıları
      description: İçerik üreticileri, fitness koçları ve aktif bir kitlesi olan, yaşam tarzı markasına yatırım yapmaya hazır açık hava kişilikleri. Siz topluluğu ve marka hikayesini getiriyorsunuz — biz ürün mühendisliği, uyumluluk, ambalaj ve lojistik ile ilgileniyoruz, böylece siz içeriğe ve dönüşüme odaklanabilirsiniz.
      features:
        - 'Hızlı özel marka oluşturma: logo + renkleri ile 2 haftalık örnek döngü'
        - Ortak markalı sınırlı sayıda ürünler ve sezonluk renk seçenekleri
        - Yaşam tarzı fotoğraf ve video içerik üretimi desteği
        - 'Tüketiciye doğrudan dağıtım: fabrika → müşteri dropshipping'
    - title: Bölgesel Distribütörler Tüketiciye Direkt Satış
      subtitle: Kendi markasını başlatan B2B operatörleri
      description: Kendi markasını başlatmak isteyen veya üçüncü taraf ürünlerini yeniden satmak yerine bunu yapmak isteyen köklü deniz veya açık hava ekipmanı distribütörleri. Zaten depo altyapınız, lojistik ilişkileriniz ve müşteri tabanınız var — özel marka kalitesini ölçeklenebilir şekilde sunabilecek bir fabrika ortağına ihtiyacınız var.
      features:
        - Pazar bölgeniz için özel ürün tasarımları
        - Tescilli şekil ve spesifikasyonlar için tam OEM kalıp geliştirme
        - Bölgeniz için yerelleştirilmiş uyumluluk belgeleri (CE, UKCA, USCG)
        - 'Ortak markalı ambalaj: distribütör markası + Paddle Board Overstock kalite işareti'
    - title: İlk Kez Marka Kurucuları
      subtitle: Bütünsel rehberli marka oluşturma
      description: Sıfır su sporu sektörü deneyimi olan, sıfırdan bir marka kurmak isteyen tutkulu girişimciler. Ürün seçimi ve isimlendirmeden ambalaj tasarımı ve ilk konteyner lojistiğine kadar her aşamada elinizi tutacak bir ortağa ihtiyacınız var — net zaman çizelgeleri ve şeffaf fiyatlandırma ile.
      features:
        - 50+ kanıtlanmış temel tasarımdan danışmanlık ile ürün seçimi
        - 'Marka kimliği paketi: isimlendirme, logo, renk paleti, ambalaj tasarımı'
        - Konseptten ilk sevkiyata 60-90 günlük zaman çizelgesi
        - İlk kez marka sahibi olanlar için özel proje yöneticisi
