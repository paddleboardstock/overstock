hero:
  tagline: Su Keşif Bilgisi
  title: Öğren
  subtitle: |
    Rehberler, öğreticiler ve derinlemesine incelemeler — keşfetmek için ihtiyacınız olan her şey<br />
    Özgüvenle suyla. İlk SUP seçiminizden ileri teknikleri ustalıkla kullanmaya kadar.
  taglineSection: Her kürekçi için bilgi. Başlangıç seviyesinden profesyonele kadar.
featured:
  tagline: Öne Çıkan Konular
  title: Öğrenme yolculuğunuza başlayın
  subtitle: Su sporlarına yeni başlıyor olun ya da seviyenizi yükseltmek istiyor olun, rehberlerimiz sizin için hazır.
  items:
    - title: SUP Temeller
      description: Bir aceminin bilmesi gereken her şey — tahta türleri, raket boyutları, duruş ve ilk gün ipuçları.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Şişme ve Sert Tahta
      description: Hangi sizin için doğru? Taşınabilirlik, performans, dayanıklılık ve maliyeti yan yana karşılaştırıyoruz.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Su Güvenliği
      description: Her kürekçinin sahip olması gereken temel güvenlik bilgisi — hava durumu, can yelekleri, kendi kendine kurtarma ve daha fazlası.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Malzeme Rehberi
      description: PVC vs Hypalon, drop-stitch teknolojisi, inkarcı değerlendirmeleri — ekipmanınızın neyden yapıldığını anlayın.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Boyut Rehberi
      description: Ağırlığınıza, beceri seviyenize ve kürek çekme tarzınıza uygun doğru tahta uzunluğunu, genişliğini ve hacmini bulun.
      icon: tabler:ruler
      href: /size-guide
    - title: Orta Düzey Teknikler
      description: Gelişmiş kürek çekme teknikleri, dönüş teknikleri ve dalgalı suda kontrol ile kürek çekme becerilerinizi yükseltin.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
