features3_certifications:
  title: Kalite & Test
  subtitle: Every board is tested in our own lab before it ships — real numbers, real records, no marketing claims.
  columns: 3
  isBeforeContent: true
  items:
    - title: Built In Our Own Factory
      description: We own and operate a 12,000 m² Weihai facility. Every production batch is traceable, documented, and inspected — no outsourced mystery manufacturing.
      icon: tabler:building-factory
    - title: Malzeme Test Laboratuvarı
      description: Kendi bünyesindeki malzeme laboratuvarı, üretim öncesi her kumaş partisinin çekme dayanıklılığını, UV direncini, dikiş bütünlüğünü ve aşınmaya karşı direncini test eder.
      icon: tabler:microscope
    - title: Marine-Grade Materials
      description: UV-stabilized PVC, drop-stitch cores, and EVA deck foam — chosen and tested for seasons of sun, salt, and abuse.
      icon: tabler:flask
    - title: 2 Yıl SUP Garanti
      description: Paddle Board Overstock SUP tahtalar, dikişler, valfler ve malzeme katman ayrılmaları dahil olmak üzere üretim kusurlarına karşı 2 yıllık garanti kapsamındadır. Ürettiğimiz şeyin arkasındayız.
      icon: tabler:shield-check
testimonials:
  tagline: Müşteri Güveni
  title: Müşterilerimizin söyledikleri
  subtitle: İlk defa kürek çekenlerden deneyimli kaşiflere kadar — neden Paddle Board Overstock'e güvendiklerini görün.
  items:
    - content: As a first-time buyer, I was nervous about ordering from overseas. The team answered every question with real photos and test records before I even asked. The board arrived in 6 days and exceeded my expectations.
      name: James Thornton
      title: SUP Explorer 11 sahibi — Vancouver, Kanada
features3_lab:
  title: Kurum İçi Test ve Kalite Laboratuvarı
  subtitle: Her malzeme partisi ve bitmiş ürün, gönderilmeden önce sahadaki test laboratuvarımızdan geçer.
  columns: 3
  isBeforeContent: true
  items:
    - title: Çekme Dayanımı Testi
      description: 'Every PVC fabric roll is tested for tensile strength in-house. Minimum requirement: 350 N/cm warp and weft. Rejected batches are returned to supplier — we reject approximately 3% of incoming materials.'
      icon: tabler:scale
    - title: UV Hızlandırılmış Yaşlanma
      description: Fabric samples undergo 1,000-hour accelerated UV weathering. Tensile strength must retain 80%+ after exposure. Products rated for 3+ years of outdoor use.
      icon: tabler:sun
    - title: Dikiş Soyulma Gücü
      description: Welded seams are tested to a 5 N/mm minimum peel strength. Each production batch has seam samples destructively tested and archived.
      icon: tabler:stack
    - title: 24–48 Saat Basınç Tutma
      description: 'Her şişirilebilir ürün 1,25x dereceye kadar PSI şişirilir ve 24–48 saat boyunca izlenir. Maksimum izin verilen basınç düşüşü: %5. Bu testten geçemeyen ürünler sevkiyattan önce yeniden işlenir ve tekrar test edilir.'
      icon: tabler:wind
    - title: Valf Döngüsü Testi
      description: Her vana tasarımı laboratuvarımızda 10.000 açık-kapalı döngüsünden geçer. Vana, döngü sonrası 1,25x nominal basınçta hava geçirmez sızdırmazlığı korumalıdır. Tüm Paddle Board Overstock vanalar, düzenli kullanımda 5+ yıl olarak derecelendirilmiştir.
      icon: tabler:rotate
    - title: Soğuk Çatlak Direnci
      description: Materials are tested at -30°C for 4 hours. No cracking or embrittlement allowed. Products rated for winter storage and cold-water use down to -10°C ambient temperature.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kaliteyi nasıl garanti ederiz
  subtitle: Hammadde denetiminden nihai basınç testine kadar — her ürün titiz bir kalite zincirinden geçer.
  items:
    - title: Hammadde Denetimi
      description: Her kumaş rulosu PVC UV , üretime girmeden önce kalınlık, çekme dayanıklılığı ve direnç açısından test edilir.
      icon: tabler:search
    - title: Süreçteki QC
      description: Montaj sırasında her istasyonda kaynak dikişleri, valf montajları ve oda bağları incelenir.
      icon: tabler:eye
    - title: Basınç Testi
      description: Her şişirilebilir ürün 1,25x dereceye kadar PSI şişirilir ve hava tutumu ile dikiş bütünlüğü doğrulanmak için 24–48 saat boyunca tutulur.
      icon: tabler:wind
    - title: Son Denetim
      description: Her ünite, sevkiyat için onaylanmadan önce bitiş, donanım ve ambalaj açısından incelenir. Parti örnekleri yıkıcı test için laboratuvarımıza gönderilir.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Tahta SSS
  subtitle: Ayakta kürek sörfü tahtalarımız hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Hangi SUP tahta boyutları mevcut?
      description: 9 ft ile 12 ft arasında SUP tahtalar sunuyoruz; bunlar arasında her amaçlı, tur, yoga ve özel tasarımlar bulunmaktadır. En çok satan modellerimiz Tropical Breeze (10 ft) ve Ocean Voyager (11 ft) dahil.
    - title: drop-stitch yapı nedir?
      description: Drop-stitch yapı, tahtanın üst ve alt katmanlarını bağlayan binlerce polyester iplik kullanır, bu sayede yüksek hava basıncını (15–20 PSI) tutabilir ve sert, stabil bir platform elde eder. Bu, premium şişme SUPs için endüstri standardıdır.
    - title: SUP tahtaların ağırlık limiti nedir?
      description: SUP tahtalarımız modele ve hacme bağlı olarak 150 kg’a kadar destek sağlar. Leviathan Wake tahtası, daha büyük kullanıcılar ve yoga kullanımı için tasarlanmış en yüksek kapasiteli modelimizdir.
    - title: Tam SUP paketler sunuyor musunuz?
      description: Evet. Her SUP tahta, 3 parçalı alüminyum kürek, yüksek basınçlı el pompası, coil leash, taşıma sırt çantası ve tamir kiti dahil olmak üzere eksiksiz bir paketle gelir. Bazı modeller ayrıca çıkarılabilir yüzgeç seti içerir.
    - title: SUP tahtaların garantisi nedir?
      description: Tüm Paddle Board Overstock SUP panolar, normal kullanım altında dikiş hatası, vana kusurları ve malzeme katman ayrılmaları dahil olmak üzere üretim hatalarına karşı 2 yıl garanti taşır.
    - title: Bir SUP tahtayı şişirmek ne kadar sürer?
      description: Kutuya dahil el pompası kullanılarak, 15 PSI kadar tam şişirme yaklaşık 8–12 dakika sürer. Daha hızlı şişirme için, bir tahtayı 4 dakikadan kısa sürede şişiren Paddle Board Overstock 12V elektrik pompamızı öneriyoruz.
