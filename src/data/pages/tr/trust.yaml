  subtitle: |
    64 CE-sertifikalı model — güvenlik açısından test edilmiş,<br />
    dayanıklılık ve performans. Kestirme yok. İstisna yok.
  taglineSection: Sertifikalı. Test Edilmiş. Kanıtlanmış.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  imageAlt: Paddle Board Overstock kalite testinden geçen ürün
stats:
  title: Paddle Board Overstock sayılarla
  stats:
    - title: CE 6185
      description: 64 CE sertifikalı eğlence modelleri AB güvenlik standartlarını karşılıyor — TÜV Rheinland tarafından sertifikalandırılmıştır
    - title: ISO 9001:2015
      description: Kalite yönetim sistemi, 2022'den bu yana SGS tarafından sertifikalandırılmıştır
    - title: BSCI & REACH
      description: Etik üretim ve AB malzeme uyumu — Intertek tarafından doğrulandı
    - title: 5 Yıllık Tekne Garantisi
      description: Tüp kumaş, dikişler ve gövde üzerinde — SUP ve aksesuarlarda 2 yıl. %99,3 kusursuzluk oranı (ISO 2859 başına AQL 2,5)
features3_certifications:
  title: Sertifikalar ve Uyumluluk
  subtitle: Her ürün bağımsız olarak test edilir; 64 model uluslararası standartlara göre CE sertifikalandırılmıştır.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Sertifikası
      description: Avrupa CE güvenlik standardını karşılayan SUPs, kanolar, botlar ve RIBs arasındaki 64 CE sertifikalı model, eğlence amaçlı su araçları için uygundur. Her ürün, fabrikadan çıkmadan önce basınç, kaldırma ve yük testinden geçirilir.
      icon: tabler:certificate
    - title: ''
      description: 12.000 m²'lik Qingdao tesisimiz, ISO 9001 kalite yönetim sistemi kapsamında faaliyet göstermektedir. Her üretim partisi izlenebilir, belgelenmiş ve denetlenmiştir.
      icon: tabler:clipboard-check
    - title: BSCI Sosyal Uyum
      description: Biz BSCI-sertifikalıyız, tedarik zincirimizde etik iş uygulamalarını, güvenli çalışma koşullarını ve çevresel sorumluluğu sağlıyoruz.
      icon: tabler:users
    - title: REACH & RoHS
      description: Tüm malzemeler — PVC, Hypalon, EVA köpük, yapıştırıcılar — AB REACH ve RoHS yönetmeliklerine uygundur. Hiçbir yasaklı madde yok, hiçbir ödün yok.
      icon: tabler:flask
    - title: Malzeme Test Laboratuvarı
      description: Kendi bünyesindeki malzeme laboratuvarı, üretim öncesi her kumaş partisinin çekme dayanıklılığını, UV direncini, dikiş bütünlüğünü ve aşınmaya karşı direncini test eder.
      icon: tabler:microscope
    - title: 5 Yıllık Tekne Garantisi
      description: Paddle Board Overstock tekneleri, tüp kumaşı, dikişler ve gövde için 5 yıllık sınırlı garanti kapsamındadır. SUP tahtalar ve aksesuarlar 2 yıllık garantiye sahiptir. Yaptığımız işin arkasındayız.
      icon: tabler:shield-check
testimonials:
  tagline: Müşteri Güveni
  title: Müşterilerimizin söyledikleri
  subtitle: İlk kez kürek çekenlerden profesyonel filo işletmecilerine kadar — neden Paddle Board Overstock'a güvendiklerini görün.
  items:
    - content: Tüm kiralama Paddle Board Overstock RIBs filomuzu üç lokasyonda 12 tekne ile donattık. İki sezon geçti, hiç arıza olmadı. CE Sertifikasyon belgeleri sigorta onayını sorunsuz hale getirdi. Mühendislik ekipleri hatta tüp renklerini markamıza uygun şekilde özelleştirdi.
      name: Marco Valenti
      title: Operasyon Direktörü, Adriyatik Macera Turları — Dubrovnik, Hırvatistan
    - content: İlk kez alıcı olduğum için yurtdışından sipariş verirken kalite konusunda endişeliydim. Daha sormadan paylaştıkları ISO belgeler ve üçüncü taraf test raporları bana tam güven verdi. Board 6 gün içinde ulaştı ve beklentilerimi aştı.
      name: James Thornton
      title: SUP Explorer 11 sahibi — Vancouver, Kanada
    - content: Kıyı devriye filomuzda 24 Paddle Board Overstock RIBs işletiyoruz. Onların QC süreci her partide tutarlıdır — aynı dikiş kalitesi, aynı vana yerleşimi, her seferinde aynı basınç derecesi. Ekipmanın hayata bağlı olduğu durumlarda bu tekrarlanabilirlik önemlidir.
      name: Tuğamiral Andres Reyes
      title: Filipin Sahil Güvenlik Yardımcı Birimi Denizcilik Tedarik Görevlisi — Manila, Filipinler
features3_lab:
  title: Kurum İçi Test ve Kalite Laboratuvarı
  subtitle: Her malzeme partisi ve bitmiş ürün, gönderilmeden önce sahadaki test laboratuvarımızdan geçer.
  columns: 3
  isBeforeContent: true
  items:
    - title: Çekme Dayanımı Testi
      description: "Her PVC kumaş rulo ASTM D751 standartlarına göre test edilir. Minimum gereksinim: 350 N/cm çözgüt ve atkı. Reddedilen partiler tedarikçiye iade edilir — gelen malzemelerin yaklaşık %3'ünü reddediyoruz."
      icon: tabler:scale
    - title: UV Hızlandırılmış Yaşlanma
      description: Kumaş örnekleri 1.000 saatlik QUV hızlandırılmış hava koşullarına (ASTM G154) tabi tutulur. Çekme dayanıklılığının maruz kaldıktan sonra %80'i aşması UV gerekir. 3+ yıl açık havada kullanım için derecelendirilmiş ürünler.
      icon: tabler:sun
    - title: Dikiş Soyulma Gücü
      description: RF kaynaklı dikişler 5 N/mm minimum soyulma dayanıklılığında test edilmiştir (ASTM D751). Elle yapıştırılmış Hypalon dikişler 3,5 N/mm ile test edilmiştir. Her üretim partisinde dikiş örnekleri yıkıcı şekilde test edilip arşivlenmiştir.
      icon: tabler:stack
    - title: 24–48 Saat Basınç Tutma
      description: 'Her şişirilebilir ürün 1,25x dereceye kadar PSI şişirilir ve 24–48 saat boyunca izlenir. Maksimum izin verilen basınç düşüşü: %5. Bu testten geçemeyen ürünler sevkiyattan önce yeniden işlenir ve tekrar test edilir.'
      icon: tabler:wind
    - title: Valf Döngüsü Testi
      description: Her vana tasarımı laboratuvarımızda 10.000 açıp-kapanma döngüsünden geçiyor. Valfler, döngüden sonra 1.25x nominal basınçta hava geçirmez bir şekilde mühürlemelidir. Tüm Paddle Board Overstock vanalar 5+ yıl düzenli kullanım için derecelendirilmiştir.
      icon: tabler:rotate
    - title: Soğuk Çatlak Direnci
      description: Malzemeler 4646 başına 4 saat boyunca -30°C'de test ISO edildi. Çatlama veya kırılganlık yasaktır. Kış depolama ve soğuk su kullanımı için -10°C ortam sıcaklığına kadar uygun ürünler.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kaliteyi nasıl garanti ederiz
  subtitle: Hammadde denetiminden nihai basınç testine kadar — her ürün titiz bir kalite zincirinden geçer.
  items:
    - title: Hammadde Denetimi
      description: Her kumaş rulosu PVC UV , üretime girmeden önce kalınlık, çekme dayanıklılığı ve direnç açısından test edilir.
      icon: tabler:search
    - title: Süreçteki QC
      description: Montaj sırasında her istasyonda kaynak dikişleri, valf montajları ve oda bağları incelenir.
      icon: tabler:eye
    - title: Basınç Testi
      description: Her şişirilebilir ürün 1,25x dereceye kadar PSI şişirilir ve hava tutumu ile dikiş bütünlüğü doğrulanmak için 24–48 saat boyunca tutulur.
      icon: tabler:wind
    - title: Son Denetim
      description: Her ünite, sevkiyat için onaylanmadan önce bitiş, donanım ve ambalaj açısından incelenir. Parti örnekleri yıkıcı test için laboratuvarımıza gönderilir.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Tekne SSS
  subtitle: Sert gövdeli şişme botlarımızla ilgili sıkça sorulan sorular.
  columns: 2
  items:
    - title: Hangi boyutlarda RIB tekne Paddle Board Overstock seçenekleri sunuluyor?
      description: RIB 2,5 m ile 7,6 m arasında değişen 35 model sunuyoruz; bunlar kompakt tenderlerden ağır hizmet ticari ve devriye gemilerine kadar her şeyi kapsıyor. Her model birden fazla konfigürasyon seçeneğiyle sunulmaktadır.
    - title: A RIB ile geleneksel şişme tekne arasındaki fark nedir?
      description: RIB A (Rigid-Gövdeli Şişme Bot), katı fiberglas veya alüminyum derin-V gövdeyi şişme Hypalon veya PVC tüplerle birleştirir. Bu, sert bir teknenin stabilitesini ve yük kapasitesini, şişme bir teknenin şok emilimi ve kaldırma gücünü sağlar.
    - title: Hangi motorlarla uyumlu Paddle Board Overstock RIBs?
      description: Destekimiz RIBs , modele bağlı olarak 3 HP ile 250 arasında motorlar arasında HP . Her ürün sayfasında maksimum nominal motor gücü listelenir. İdeal eşleşme için bayinizle görüşmenizi öneririz.
    - title: Paddle Board Overstock RIBs CE Sertifikalı mısınız?
      description: Evet. Tüm eğlence RIB amaçlı modeller, CE rekreasyon amaçlı su araçları için geçerli Avrupa standartları kapsamında sertifikalandırılmıştır. Ticari ve devriye modelleri ek stabilite ve yük gereksinimlerini karşılar.
    - title: Teknelerin garantisi nedir RIB ?
      description: Hepsi Paddle Board Overstock RIBs tüp kumaşı, dikişler ve gövde için 5 yıllık sınırlı garantiyle gelir; şişlik valfleri 5 yıl kapsama altında; fabrikada kurulan aksesuarlar 1 yıl kapsama alınır.
    - title: Kaç hava Paddle Board Overstock RIBs odası var?
      description: RIBs Model uzunluğuna bağlı olarak 3 ila 7 bağımsız hava odası içeriyor. Bu çok odalı tasarım, bir bölme zarar görse bile tekneyin yüzmede kalmasını sağlar.
faqs_inflatable:
  title: Şişme Bot SSS
  subtitle: Şişme teknelerimiz, kayaklarımız ve teknelerimizle ilgili sıkça sorulan sorular.
  columns: 2
  items:
    - title: Paddle Board Overstock Şişme teknelerde hangi malzemeler kullanılır?
      description: Modele göre askeri sınıf PVC (1100 denier) ve premium Hypalon/CSM kauçuk kullanıyoruz. Her iki malzeme UVde stabilizasyonlu, aşınmaya dayanıklı ve AB REACH ile RoHS düzenlemelere uygun.
    - title: Şişme tekneler ne kadar dayanır?
      description: Doğru bakımla, kaliteli şişme PVC tekne 7–10 yıl dayanırken, Hypalon modeller 15–20 yıl dayanabilir. Düzenli temizlik, UV koruma ve uygun depolama hizmet ömrünü önemli ölçüde uzatır.
    - title: Şişme tekne için ne kadar bakım gereklidir?
      description: Temel bakım, her kullanımdan sonra (özellikle tuzlu suda) temiz suyla durulama, saklamadan önce kurutma, vana contalarını yıllık olarak kontrol etmek ve UV tüplere koruyucu uygulamayı içerir. Kullanılmadığında uzun süre güneşe maruz kalmaktan kaçının.
    - title: Şişme tekneler tuzlu suda kullanılabilir mi?
      description: Evet. Tüm Paddle Board Overstock şişme botlar hem tatlı su hem de tuzlu su kullanımı için tasarlanmıştır. Taze suyla durulama ve tuzlu suya maruz kaldıktan sonra iyice kurutmanız, böylece yapışma korozyonu ve kumaş tuzu kristalleşmesini önlüyoruz.
    - title: Şişme botu nasıl saklarım?
      description: Depolamadan önce tekneyi tamamen söndürün, temizleyin ve kurutun. Gevşek bir şekilde yuvarlayın (sıkı katlamalardan kaçının), doğrudan güneş ışığından uzak, serin ve kuru bir yerde saklayıp nemi emmesini önlemek için beton zeminlerden uzak durun.
    - title: Paddle Board Overstock Şişme teknelerin ağırlık kapasitesi nedir?
      description: Ağırlık kapasiteleri en küçük modellerimiz için 290 kg’dan büyük ticari tekneler için 2000 kg’ın üzerine kadar değişmektedir. Her ürün sayfası, belirli modeliniz için maksimum yük derecesini listeler.
faqs_sup:
  title: SUP Tahta SSS
  subtitle: Ayakta kürek sörfü tahtalarımız hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Hangi SUP tahta boyutları mevcut?
      description: 9 ft ile 12 ft arasında SUP tahtalar sunuyoruz; bunlar arasında her amaçlı, tur, yoga ve özel tasarımlar bulunmaktadır. En çok satan modellerimiz Tropical Breeze (10 ft) ve Ocean Voyager (11 ft) dahil.
    - title: drop-stitch yapı nedir?
      description: Drop-stitch yapı, tahtanın üst ve alt katmanlarını bağlayan binlerce polyester iplik kullanır, bu sayede yüksek hava basıncını (15–20 PSI) tutabilir ve sert, stabil bir platform elde eder. Bu, premium şişme SUPs için endüstri standardıdır.
    - title: SUP tahtaların ağırlık limiti nedir?
      description: SUP tahtalarımız modele ve hacme bağlı olarak 150 kg’a kadar destek sağlar. Leviathan Wake tahtası, daha büyük kullanıcılar ve yoga kullanımı için tasarlanmış en yüksek kapasiteli modelimizdir.
    - title: Tam SUP paketler sunuyor musunuz?
      description: Evet. Her SUP tahta, 3 parçalı alüminyum kürek, yüksek basınçlı el pompası, coil leash, taşıma sırt çantası ve tamir kiti dahil olmak üzere eksiksiz bir paketle gelir. Bazı modeller ayrıca çıkarılabilir yüzgeç seti içerir.
    - title: SUP tahtaların garantisi nedir?
      description: Tüm Paddle Board Overstock SUP tahtalar, normal kullanımda dikiş arızası, vana kusurları ve malzeme katmanlarının ayrılması dahil olmak üzere üretim hatalarına karşı 2 yıl garanti taşır.
    - title: Bir SUP tahtayı şişirmek ne kadar sürer?
      description: Dahil olan el pompası kullanılarak, 15 PSI seviyesine tam şişirme yaklaşık 8–12 dakika sürer. Daha hızlı şişirme için, bir tahtayı 4 dakikadan kısa sürede şişiren Paddle Board Overstock 12V elektrikli pompamızı öneririz.
