hero:
  tagline: Fabrika Denetimi ve Kanıt
  title: Fabrika Denetimi Hazırlığı<br />& Kaliteli Kanıt
  subtitle: Her şey B2B alıcıların fabrika ziyareti sırasında doğruladığı — üretim özgünlüğü ve uyum belgelerinden üretim izlenebilirliği ve kalite kontrol sistemlerine kadar. Denetime hazır, her gün.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer fabrika denetimi hazırlığı ve kalite kanıtı
direct_answer: Aquafarer, belgelenmiş kalite kontrol süreçleri, malzeme izlenebilirliği, HIN düzeyinde üretim kayıtları ve her gövde için uyumluluk belgeleri ile denetime hazır 12.000 m²'lik Qingdao tesisini sürdürmektedir. Nitelikli alıcılar için yerinde ve sanal fabrika turları mevcuttur.
stats:
  - value: 12,000 m²
    label: ISO 9001 Tesisi
    detail: Qingdao üretim kampüsü
  - value: 6
    label: Üretim Hatları
    detail: Tahsisli RIB, SIB, SUP hatlar
  - value: 100%
    label: Basınca Dayanıklı
    detail: Her ünite, 1,25x / 24-48s
  - value: HIN
    label: Her Gövde İçin İzlenebilirlik
    detail: Tam parti-teslim kayıtları
content_priorities:
  tagline: Müşteriler Ne Doğrular
  title: Alıcıların Doğruladığı 8 Şey<br />Her Fabrika Ziyaretinde
  subtitle: 50+ ülke alıcısından gelen geri bildirimlere dayanarak, müşterilerin bir B2B siparişi vermeden önce değerlendirdiği sekiz öncelik bunlardır.
  items:
    - title: Gerçek Üretici
      description: 'Gerçek fabrika mısınız, bir ticaret şirketi değil mi? Alıcılar şu konuları kontrol eder: işletme varlığı, gerçek üretim ekipmanları, makineleri çalıştıran çalışanlar, üretim alanındaki güncel siparişler ve web sitesi ile atölye uyumu.'
      icon: tabler:building-factory
    - title: Uygulama İçin Ürün Uygunluğu
      description: RIB onların özel kullanım durumuyla eşleşiyor mu? Tatil köyü, kurtarma, dalış, balıkçılık ve devriye operatörlerinin temelde farklı gereksinimleri vardır. Alıcılar, sergilenen teknedeki güverte düzenini, tüp malzemesini ve ekipman seçeneklerini değerlendirir.
      icon: tabler:target
    - title: Kalite Kararlılığı ve Tekrarlanabilirlik
      description: 50. birim, 1. birim kadar iyi mi? Alıcılar, kalite kontrol sistemlerini, süreç içi kontrol noktalarını, uygunsuzluk yönetimini inceler ve tutarlılığı doğrulamak için birden çok üretim çalışmasının kayıtlarını görmek ister.
      icon: tabler:repeat
    - title: Uyum Belgesi Otantikliği
      description: CE sertifikaları modele özel midir? DoC gerçek bir kişi tarafından mı imzalanmıştır? Uyum, gövde numarasına göre doğrulanabilir mi? Alıcılar, genel beyanlar ile modele özel belgeleri kontrol eder.
      icon: tabler:file-certificate
    - title: Özelleştirme Yürütme
      description: Fabrika gerçekten özel konfigürasyonlar teslim edebilir mi? Alıcılar, geçmişteki özel projelerin kanıtlarını, sergilenen prototip örneklerini, mühendislik çizimlerini ve teknik değişiklikleri yerinde tartışabilme yeteneğini arar.
      icon: tabler:adjustments
    - title: Tedarik Süresi ve Kapasite
      description: 'Fiyat süreleri gerçekçi mi? Alıcılar şu değerlendirmeleri yapar: mevcut üretim hacmi, mevcut kapasite, iş gücü büyüklüğü, malzeme stok seviyeleri ve fabrikanın üretim planlama sistemi olup olmadığı.'
      icon: tabler:clock
    - title: Fiyat ve Ticaret Şartları
      description: 'Fiyatlar şeffaf mı? FOB Fiyatlandırma net mi? Alıcılar doğrular: birim fiyat dağılımı, araç maliyetleri, ambalaj maliyetleri ve fabrikanın DDP CIF uygun ihracat belgelerini karşılayıp karşılayamayacağı veya şart koşup yapamayacağı.'
      icon: tabler:currency-dollar
    - title: Satış Sonrası ve Yedek Parçalar
      description: 'Teslimattan sonra ne olur? Alıcılar şunları değerlendirir: yedek parça bulunabilirliği, garanti süreci, boru bölümlerinin değiştirilmesi, vana değişimi ve fabrikanın belgelenmiş bir satış sonrası protokolü olup olmadığı.'
      icon: tabler:headset
content_tour:
  tagline: Fabrika Tur Rotası
  title: Denetim Turu —<br />Görecekleriniz
  subtitle: Standart fabrika turumuz, her istasyonda alıcı sorularını yanıtlamak için tasarlanmış belirli bir güzergahı takip eder.
  items:
    - title: 1. Toplantı Odası — Şirket Tanıtımı
      description: İşletme lisansı, ISO 9001 ve BSCI sertifikalar, ihracat lisansları ve şirket geçmişi. Üretim yetenekleri ve uyumluluk kapsamına hızlı bir genel bakış.
      icon: tabler:users
    - title: 2. Ham Madde Deposu — IQC İstasyonu
      description: Gelen malzeme denetim kayıtları, kumaş parti sertifikaları, yapıştırıcılar ve donanım örnekleri. Üretime girmeden önce malzemelerin nasıl test edildiğini görün.
      icon: tabler:building-warehouse
    - title: 3. Boru İmalatı — RF Kaynak ve Elle Yapıştırma
      description: Canlı boru kaynak veya yapıştırma süreci, dikiş mukavemeti testi gösterimleri ve valf kurulumu. Oda oda inşaatı ve kalite kontrol noktalarını gözlemleyin.
      icon: tabler:flame
    - title: 4. Gövde Laminasyonu — GRP Atölyesi
      description: Fiberglas döşeme süreci, jelkoat uygulaması ve gövde kürleme. Farklı modeller için laminasyon programı ve yapısal güçlendirme için RIB bakınız.
      icon: tabler:layers-subtract
    - title: 5. Montaj ve Entegrasyon
      description: Gövde-boru birleştirme, konsol ve koltuk montajı, elektrik ve yakıt sistemi entegrasyonu ve ekipman montajı. Üretim hattının çalıştığını gözlemleyin.
      icon: tabler:tool
    - title: 6. Basınç Test İstasyonu
      description: 1.25x nominal basınçta 24-48 saat basınç tutma testi. Test kayıtlarını, basınç göstergelerini ve geçiş/başarısızlık kriterlerini inceleyin. Test sonuçlarının gövde seri numaralarıyla nasıl bağlantılı olduğunu görün.
      icon: tabler:gauge
    - title: 7. Son Denetim ve Kalite Kontrol
      description: Ünite başına 100 puanlık kalite kontrol listesi, boyut doğrulama, kozmetik denetim ve ambalaj bütünlüğü kontrolü. Uyumsuzluk kayıtlarını ve düzeltici işlem kayıtlarını inceleyin.
      icon: tabler:clipboard-check
    - title: 8. Belge İnceleme Odası
      description: Model başına uyumluluk dokümantasyonu (DoC, üretici plakası, kullanım kılavuzu), üretim izlenebilirlik kayıtları, HIN kaydı ve malzeme parti takibi veritabanı gösterimi.
      icon: tabler:folder
content_qc_chain:
  tagline: Kaliteli Kanıt
  title: 8 Aşamalı QC Zinciri<br />— Her Adımda Doğrulanabilir
  subtitle: Kalite kontrol zincirimiz, gelen malzemelerden nihai sevkiyata kadar uzanır ve her aşamada belgelenmiş kanıtlar sunar.
  items:
    - title: 'Aşama 1: Gelen Malzeme Denetimi'
      description: Her PVCparti, Hypalon, , fiberglass, alüminyum, yapıştırıcı ve donanım üretime girmeden önce spesifikasyonlara göre test edilir. AQL 2.5/2859 başına çekme mukavemi, kaplama yapışması ve boyutISO kontrolleri.
      icon: tabler:package
    - title: 'Aşama 2: Boru Kaynakı / Yapıştırma Kalite Kontrol'
      description: Üretim partisi başına dikiş soyulma dayanıklılığı testi. RF kaynak parametreleri izlenip kaydedildi. Elle yapıştırılan dikişler, tutarlı yapışkan kapanması ve sertleşme süresi açısından kontrol edildi.
      icon: tabler:flame
    - title: 'Aşama 3: Gövde Laminasyonu Kalite Kontrolü'
      description: Gelcoat kalınlığı ölçümü, laminat programına göre fiberglas döşeme doğrulaması ve kürlenme süresi izleme. Yapısal güçlendirme pozisyonları mühendislik çizimleriyle doğrulanmıştır.
      icon: tabler:layers-subtract
    - title: '4. Aşama: Montaj ve Entegrasyon Kalite Kontrolü'
      description: Gövde-tüpü eklem bütünlüğü, konsol ve koltuk montaj torku, elektrik sürekliliği ve yakıt sistemi sızıntı testi. Her kurulum noktası, modele özgü montaj kontrol listesine göre doğrulandı.
      icon: tabler:tool
    - title: '5. Aşama: Basınç Tutma Testi'
      description: Her şişirilebilir oda, 1.25x dereceye kadar PSI basınçlandırılmış ve 24-48 saat boyunca tutulmuştur. Her odada basınç düşüşü kaydedilmiştir. Geçiş/başarısızlık eşiği belgelenmiştir. Gövde seri numarasına bağlanmıştır.
      icon: tabler:gauge
    - title: '6. Aşama: Son Denetim'
      description: Boyutsal doğruluk, kozmetik kaplama, aksesuar tamlığı, dokümantasyon paketi ve ambalaj bütünlüğü gibi 100 maddelik kalite kontrol listesi. Üretim ekibinden bağımsızdır.
      icon: tabler:clipboard-check
    - title: '7. Aşama: Uyumluluk Dokümantasyonu'
      description: Modele özel DoC, üretici plaka doğrulaması, kullanım kılavuzu tamlığı ve HIN kayıt girişi. Tüm uyumluluk belgeleri sevkiyat serbest bırakmadan önce hazırlanıp doğrulanmalıdır.
      icon: tabler:file-certificate
    - title: '8. Aşama: Sevkiyat Serbest Bırakılması ve İzlenebilirlik'
      description: Son sürüm için tüm kalite kontrol aşamalarının geçilmesi, uyumluluk belgelerinin tamamlanması ve nakliye belgelerinin doğrulanması gerekir. Gövde kaydı kapatılmış ve 10+ yıl saklanmak üzere arşivlenmiştir.
      icon: tabler:truck
content_traceability:
  tagline: Üretim İzlenebilirliği
  title: HIN → Ana Dosyası →<br />Gövde Rekor → Teslimatı
  subtitle: Her RIB tekne, tam bir üretim ve uyum kayıt zincirine bağlı benzersiz bir gövde tanımlama numarası taşır.
  items:
    - title: Gövde Tanımlama Numarası (HIN)
      description: Her teknede kalıcı olarak işaretlenmiş 14 karakterli benzersiz tanımlayıcı. Üretici kodu (MIC), model tanımını, üretim yılını ve seri numarasını kodlar. Tam izlenebilirlik zincirini açan anahtar.
      icon: tabler:hash
    - title: Ana Teknik Dosya
      description: Model ailesi için uyumluluk ve mühendislik dokümantasyonu. GA çizimleri, risk değerlendirmesi, stabilite hesaplamaları, malzeme özellikleri ve geçerli standartlar içerir. O modelin tüm gövdelerine bağlıdır.
      icon: tabler:folder
    - title: Bireysel Gövde Kaydı
      description: 'Gövde başına üretim kaydı: HIN, üretim tarihi, boru partisi, malzeme sertifikaları, basınç testi sonucu, nihai konfigürasyon, motor spesifikasyonu, kalite kontrol listesi sonuçları ve teslimat hedefi. Her gövde başına 21+ veri alanı.'
      icon: tabler:file-description
    - title: Müşteri Uyum Paketi
      description: Gövde başına teslimat paketi, DoC, üretici plaka fotoğrafı, kullanım kılavuzu, uyumluluk kontrol listesi ve nihai yapılandırma sayfası dahil. Tekneyle birlikte gönderildi ve fabrikada 10+ yıl arşivlendi.
      icon: tabler:package
content_red_flags:
  tagline: Denetim Tuzakları
  title: Red Flags Alıcıları<br />Kolayca Tespit Edilecek
  subtitle: Fabrika denetimleri sırasında alıcı güvenini sarsan yaygın sorunlar. Her birini proaktif olarak ele alıyoruz.
  items:
    - title: Model Kapsamı Olmadan Genel CE Beyanları
      description: 'Hangi direktif, hangi modeller ve hangi uygunluk modülü belirtilmeden "Tüm ürünler CE sertifikalı" denmesi. Kırmızı bayrak: Uyumun model ve konfigürasyon bazında değil, yüzeysel olduğunu düşündürür.'
      icon: tabler:alert-triangle
    - title: Fiziksel Test Kanıtı Yok
      description: 'Test kayıtları, göstergeler veya fabrika katında görülebilir test istasyonu olmadan basınç testi iddiaları. Kırmızı bayrak: kalite iddiaları ziyarette doğrulanamaz.'
      icon: tabler:alert-triangle
    - title: Malzeme İzlenebilirliği Eksik
      description: 'Parti kayıtları yok, gelen muayene yok veya malzeme sertifikaları ile bitmiş ürünler arasında bağlantı yok. Kırmızı bayrak: kalite sorunlarının kaynağa kadar izlenmesi mümkün değil.'
      icon: tabler:alert-triangle
    - title: Genel Belgeler
      description: 'Tüm modelleri kapsayan tek bir uygunluk belgesi, HIN’e özel kayıtlar yok veya "şablon" uygunluk belgeleri. Kırmızı bayrak: uygunluk tekil üretim birimlerine bağlı değil.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Nakliye ve Ambalaj
  title: RIB Tekne Konteyneri<br />Yükleme ve Sandıklama
  subtitle: Nakliye çözümlerimiz, yatırımınızı Qingdao’dan hedef limana kadar korur. Her model için konteyner yükleme planları ve sandıklama spesifikasyonları mevcuttur.
  items:
    - title: 20ft Konteyner Konfigürasyonları
      description: 'Standart 20ft konteyner: 1-2 RIB tekne (4.0-5.5m) güverte ve tüpler ayrılmış şekilde iç içe yerleştirilmiş veya 8-12 SUP levha. Karışık RIB + SUP konfigürasyonlar mevcuttur. Her sipariş için ayrıntılı yükleme planı sağlanır.'
      icon: tabler:box
    - title: 40ft Konteyner Konfigürasyonları
      description: 'Standart 40ft konteyner: 2-4 RIB tekne (7.0m’ye kadar) gövdeler iç içe yerleştirilmiş ve tüpler üst üste, veya 20-30 SUP levha. Daha uzun RIB modeller için 40ft HQ mevcuttur. Hacim optimize paketleme birim başına nakliye maliyetini düşürür.'
      icon: tabler:container
    - title: RIB Gövdeler için Ahşap Sandıklama
      description: Alüminyum ve GRP gövdeler, köpük dolgulu, nem bariyerli ve çelik bantlı özel ahşap sandıklarda paketlenir. Sandık boyutları ve model başına ağırlık lojistik planlama için mevcuttur. ISPM-15 ısı ile işlem görmüş ahşap sertifikası dahildir.
      icon: tabler:wood
    - title: Tüp ve Güverte Ayrı Paketleme
      description: Tüpler, yer tasarrufu için gövdelerden ayrı olarak indirilmiş ve katlanmış. Güverte plakaları, konsollar ve koltuklar montaj donanım kitleri ile koruyucu ambalajda paketlenir. Her sevkiyatla yeniden montaj talimatları dahil edilir.
      icon: tabler:package
    - title: Nem ve Korozyon Koruması
      description: Alüminyum parçalar için VCI anti-korozyon kağıdı, silica jel kurutucu paketleri ve vakumlu donanım çantaları. 30-45 günlük deniz taşımacılığı sırasında yoğunlaşma hasarını önler.
      icon: tabler:droplet-off
    - title: FOB Qingdao Belgeleri
      description: Yükleme Senedi, Ticari Fatura, Paket Listesi, Menşe Sertifikası ve sevkiyat başına uyumluluk belgeleri. FCL ve LCL konsolidasyonu mevcut. AB, ABD ve Orta Doğu pazarları için gümrük belgeleri desteği.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Doğrulama Kanıtı
  title: Denetim Kanıtı<br />Yerinde Doğrulayabilirsiniz
  subtitle: Fabrika ziyaretlerinde müşteriler her üretim alanında belirli kanıtları doğrulayabilir. İşte nelere bakılacağı ve her denetim için hazırladığımız şeyler.
  areas:
    - area: Hammadde Deposu
      what_to_verify: Malzemeler stabil mi? Parti karışımı var mı?
      evidence: Gelen malzeme inceleme kayıtları, parti etiketleri, FIFO depolama, tedarikçi onay listesi, malzeme sertifikaları (PVC, Hypalon, cam elyafı, alüminyum, yapıştırıcılar, donanım)
      icon: tabler:building-warehouse
    - area: Boru Üretimi
      what_to_verify: Dikiş dayanımı ve hava geçirmezlik nasıl garanti ediliyor?
      evidence: Proses kartları, ilk parça doğrulaması, her odacık için basınç testi kayıtları, tamir ve yeniden test logları, vana montaj kayıtları
      icon: tabler:flame
    - area: Gövde Üretimi
      what_to_verify: Yapısal tutarlılık nasıl kontrol ediliyor?
      evidence: Kontrollü proses dokümanları, kalite kontrol noktaları, yarı mamul ürün numaralandırması, jelcoat kalınlığı ölçümleri, laminasyon çizelgesi doğrulaması
      icon: tabler:layers-subtract
    - area: Montaj Alanı
      what_to_verify: Opsiyonel parçaların yanlış montajını önlemek için ne yapılıyor?
      evidence: BOM, iş emirleri, yapılandırma kontrol listeleri, iş istasyonu denetim kartları, modele göre tork ve fonksiyon kontrolleri
      icon: tabler:tool
    - area: Test İstasyonu
      what_to_verify: Teslimattan önce teknenin iyi olduğunu nasıl doğrularsınız?
      evidence: Test prosedürleri, enstrüman listesi, kalibrasyon kayıtları, basınç testi logları (1.25x / 24-48 saat), fonksiyon test kontrol listeleri, geçme/kalma kriterleri dokümante edilmiş
      icon: tabler:gauge
    - area: Uyumsuzluk Alanı
      what_to_verify: Hatalar nasıl ele alınıyor?
      evidence: İzolasyon etiketleri, NCR logları, kök neden analizi, yeniden işleme onay kayıtları, CAPA (Düzeltici ve Önleyici Faaliyet) takibi
      icon: tabler:alert-triangle
    - area: Bitmiş Ürün Deposu
      what_to_verify: Yanlış sevkiyat ve hasar nasıl önlenir?
      evidence: Bitmiş ürün etiketleri, sipariş eşleştirme kayıtları, ambalaj standartları, sevkiyat öncesi inceleme kayıtları
      icon: tabler:box
    - area: Yedek Parça ve Satış Sonrası
      what_to_verify: Uzun vadeli satış sonrası desteğini sağlayabilir misiniz?
      evidence: Ortak yedek parça listesi, stok stratejisi, parça numaralandırma sistemi, garanti prosedür dokümantasyonu, bakım eğitimleri
      icon: tabler:headset
content_closing_script:
  tagline: Sipariş Üzerine Denetim
  title: Fabrika Ziyaretinden<br />Onaylanmış Projeye
  subtitle: Başarılı bir denetim sadece fotoğraflar ve el sıkışmayla bitmemelidir. Ayrılmadan önce üç ticari sonucun dokümante edildiğinden emin oluruz.
  items:
    - title: Teknik Yapıyı Onaylayın
      description: Model, uygulama, ana seçenekler, hedef pazar, tahmini miktar ve teslimat takvimi üzerinde anlaşın — tümü ayrılmadan önce dokümante edilir.
      icon: tabler:checklist
    - title: Bir Sonraki Adım Belgelerini Onaylayın
      description: 'Aquafarer Sonraki özellikleri tanımlayın: revize edilmiş GA, yapılandırma listesi, teklif, belge kontrol listesi, örnek plan veya NDA — belirli zaman çizelgeleriyle birlikte.'
      icon: tabler:file-plus
    - title: Karşılıklı Zaman Çizelgesini Onaylayın
      description: Revize edilmiş yapılandırma ve ön teklif 3 iş günü içinde yapılacak. 7 gün içinde örnek veya görünüm onayı alınacak. 14 gün içinde mühendislik incelemesi veya üçüncü taraf denetimi. Sonraki toplantı tarihi ve sorumlu taraflar kilitlendi.
      icon: tabler:calendar
faq:
  title: Fabrika Denetimi — Sıkça Sorulan Sorular
  questions:
    - q: Fabrikayı şahsen ziyaret edebilir miyim?
      a: Evet. 12.000 m²'lik Qingdao tesisimizde yerinde fabrika denetimlerini memnuniyetle karşılıyoruz. Standart turumuz, ham madde deposundan belge inceleme odasına kadar 8 istasyonu kapsar. İlk yeterlilik için video görüşmesi yoluyla sanal fabrika turları da mevcuttur.
    - q: Üçüncü taraf denetimleri (BSCI, SMETA, SGS)?
      a: Evet. BSCI Sertifikasyon (Intertek) sürdürüyor ve müşteriye özel denetim protokollerini memnuniyetle karşılıyoruz. Ayrıca SGS TÜV talep üzerine denetimler düzenleyebiliriz. Denetim raporları NDA.
    - q: Ziyaret sırasında basınç testi görebilir miyim?
      a: Basınç test istasyonumuz standart tur rotasının bir parçasıdır. Üretim takvimine bağlı olarak, gösterge ölçüleri ve test kayıtlarıyla aktif basınç testlerini gözlemleyebilirsiniz. Her gövde için basınç test kayıtları her zaman inceleme için mevcuttur.
    - q: Uyumsuz ürünleri nasıl yönetiyorsunuz?
      a: Uyumsuz birimler ayrılır, belgelenir ve ISO 9001 düzeltici eylem sürecimize göre incelenir. Kök neden analizi yapılır, düzeltici işlemler uygulanır ve kayıtlar tutulur. Alıcılar, denetimler sırasında NCR günlüğümüzü inceleyebilir.
    - q: İnceleme için hangi uyumluluk belgeleri mevcuttur?
      a: Denetim sırasında, modele özgü DoC örneklerini, üretici plaka spesifikasyonlarını, HIN sicilini, kullanım kılavuzu taslaklarını, geçerli standart listelerini ve model ailesine göre uyum değerlendirme kayıtlarını inceleyebilirsiniz.
    - q: Sanal bir fabrika turunu nasıl ayarlayabilirim?
      a: WhatsApp, Zoom veya Teams üzerinden canlı video turu planlamak için satış ekibimizle iletişime geçin. Aynı 8 istasyonlu güzergahı takip ediyoruz ve ilgi alanlarınıza göre belirli alanlara odaklanabiliriz. Tipik sanal tur 45-60 dakika sürer.
    - q: Fabrika gerçek üretici mi yoksa bir ticaret şirketi mi?
      a: Aquafarer gerçek üreticidir. Fabrikayı Laixi, Qingdao'da işletiyoruz. İşletme lisansı, üretim kapsamı ve fiziksel üretim denetim sırasında doğrulanabilir.
    - q: Hangi kalitede kayıtları inceleyebilirim?
      a: Gelen malzeme denetim kayıtları, süreç içi QC kontrol noktaları, basınç test kayıtları, 100 noktalık nihai denetim kontrol listeleri, uyumsuzluk raporları, düzeltici eylem kayıtları ve gövde başına izlenebilirlik kayıtları. Hepsi ISO 9001 gereksinimlerine göre tutulmaktadır.
