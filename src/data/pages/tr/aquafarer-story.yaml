hero:
  tagline: Hikayemiz
  title: Aquafarer — Su Üzerinde Mühendislik Özgürlüğü
  subtitle: 'Bir kıyı atölyesinden küresel bir deniz üreticisine dönüşmek — yolculuğumuz inatçı bir inanç üzerine kuruludur: su araçları önemliymiş gibi tasarlanmalı, çünkü önemliler.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer Qingdao'daki fabrika ve deniz üretim tesisi
