services:
  - title: Ürün Tasarımı ve Mühendislik
    description: Kendi Ar-Ge ekibimiz, CAD çizimleri, 3D modeller ve prototipler geliştirmek için konseptiniz veya spesifikasyonunuzla çalışır. Kalıp tasarımı, gövde şekli optimizasyonu ve malzeme seçimi rehberliği sunuyoruz.
  - title: Özel Marka ve Grafikler
    description: Tam renkli dijital baskı, serigrafi, kabartma ve etiket seçenekleri. Marka özelinde desteler için grafikler, tüp marka çalışmaları ve perakende hazır ambalaj geliştiriyoruz.
  - title: Malzeme ve Spesifikasyon Özelleştirmesi
    description: PVC (standart, çevre dostu, yangına dayanıklı), Hypalon/CSM, drop-stitch ve hibrit yapılar arasından seçim yapın. Özel boru renkleri, kumaş ağırlıkları ve güçlendirme seçenekleri.
  - title: Ambalaj ve Lojistik
    description: Özel perakende ambalaj, özel markalı kutular, vakumlu paketleme, paletleme ve konteyner yükleme. FOB Qingdao, CIF veya DDP nakliye şartları mevcuttur.
