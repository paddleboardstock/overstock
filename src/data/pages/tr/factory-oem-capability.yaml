why_us:
  - title: Dikey Entegrasyon
    description: Fabrikamız, kalıplarımız ve tedarik zincirimiz bize ait — aracı yok, taşeron yok. Bu, kalite, maliyet ve teslimat üzerinde kontrol sağlar.
  - title: Çift Sertifikasyon
    description: ISO 9001 kalite yönetimi ve BSCI sosyal uyumluluk sertifikası. Fabrika denetim raporları talep üzerine mevcuttur.
  - title: CE Uyum
    description: Tüm standart modeller CE 2013/53/EU sertifikasına sahiptir. Özel modeller, kurulu sürecimiz aracılığıyla CE sertifikalandırılabilir.
  - title: Düşük MOQ
    description: Standart modeller için en az 5 adetle başlayabilirsiniz. Yeni markaların stok aşırı yüklenmeden piyasaya çıkmasına yardımcı oluyoruz.
