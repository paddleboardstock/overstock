hero:
  tagline: OEM/ODM Üretim
  title: OEM & Özel Marka Üretimi
  subtitle: Kavramdan konteynere — şişme deniz aracı hattınızın her detayını özelleştirin
intro: Aquafarer, dünya çapında markalar, distribütörler ve devlet ajansları için kapsamlı OEM ve ODM hizmetleri sunar. 10+ yıllık ihracat deneyimi ve 12.000 m²'lik ISO 9001 & BSCI sertifikalı fabrikası ile ürün tasarımından kalıp geliştirmeye, tam üretim, ambalaj ve lojistik süreçlerine kadar her şeyi yönetiyoruz.
