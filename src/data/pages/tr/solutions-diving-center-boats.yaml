content_benefits:
  tagline: Temel Faydalar
  title: Neden Aquafarer için<br />Dalış Operasyonları
  subtitle: Amaca uygun dalış RIBs, 30+ ülkedeki ticari dalış merkezleri tarafından güvenilir — sadece ara sıra kullanım için değil, günlük operasyon için tasarlandı.
  list:
    - Yılda 200-300 çalışma günü için tasarlandı — hafta sonu teknesi değil, günlük çalışma platformu
    - Hypalon veya askeri sınıf PVC tüpler — UV direnci ile tropikal tuzlu su ortamlarında maksimum dayanıklılık
    - Geniş boru tasarımı, dişli batıcılar için stabil bir binme platformu sağlar — her deneyim seviyesindeki kişiler için daha güvenli giriş ve çıkış
    - Ekipman iş akışı için optimize edilmiş güverte düzeni — tanklar, ekipman ve yolcuların her biri için ayrı alan
    - Özel dalış merdiveni ve platform konfigürasyonları — standart bir çözüm yok, her tekne operasyonunuza göre uyarlanır
    - Motor yedeklilik seçenekleri (tek/çift) — dalgıçlar suda olduğunda operasyonel güvenlik
    - Daha düşük günlük işletme maliyetleri — optimize edilmiş yakıt verimliliği ve azaltılmış bakım gereksinimleri
    - 'Hızlı teslimat: Standart konfigürasyonlar için siparişten sevkiyata 30-60 gün'
