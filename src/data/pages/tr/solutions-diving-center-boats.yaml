      description: Resort konaklamasının en yüksek seviyesi, her detayın kişiselleştirildiği ve beklentilerin son derece yüksek olduğu yer. Tekne kusursuz, sessiz ve kesintisiz hizmetle donatılmış olmalıdır. Gizlilik, konfor ve estetik mükemmellik ön plandadır. Bu müşteriler fiyata duyarlı değildir, ancak olağanüstü derecede kaliteye duyarlıdır.
      features:
