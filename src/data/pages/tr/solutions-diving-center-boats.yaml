        - Depolama verimliliği için hızlı şişirme/indirgeme tüp seçenekleri
        - Sudan kolay biniş için alçak profilli dalgıç merdiveni
        - Davit veya vinç başlatma sistemleri için ağır hizmet kaldırma noktaları
        - Yakıt ikmali arasında 50+ deniz mili menzil
        - Güneş, tuz ve yakıt maruziyetine dayanıklı dayanıklı boru malzemeleri
