hero:
  tagline: Üretim Kapasitesi
  title: Üretim Kapasitesi ve Yıllık Üretim
  subtitle: 12,000 m² facility producing 15,000 boards per year with room to scale
intro: Paddle Board Overstock operates one of the largest dedicated inflatable SUP board manufacturing facilities in Weihai, China. Our 12,000 m² factory is organized into six specialized workshops operating in parallel, giving us the capacity to produce 15,000 boards annually across all-around, touring, and art-series SUP lines.
highlights:
  - value: 12,000 m²
    label: Toplam üretim alanı
    detail: 6 uzman atölye genelinde
  - value: 15,000
    label: Yıllık üretilen tahtalar
    detail: All-around, touring & art-series SUPs
  - value: 200-300
    label: Kalifiye iş gücü
    detail: 25+ mühendis, günde 2 vardiya
  - value: 50+
    label: İhracat yapılan ülkeler
    detail: AB, ABD, AU, Orta Doğu, Asya
  - value: 2-3
    label: Business days to dispatch
    detail: In-stock orders leave Weihai fast
  - value: 10+
    label: İhracat tecrübesi yılları
    detail: 2012’den beri
workshops:
  - title: SUP Paddle Tahtası Üretimi
    description: 'Şişme SUP tahtaları için 4 paralel montaj hattı. Her hat vardiya başına 50–80 tahta üretebilir. Dijital baskı ve serigrafi istasyonları eşzamanlı çalışır. Yıllık SUP kapasitesi: 8.000+ tahta.'
    output: 8.000+ SUPs/yıl
  - title: Gövde Sanatı ve EVA Son İşlem
    description: Dedicated finishing workshop for art-series decks. Precision EVA cutting, hand-laid deck patterns, and final trim. Annual capacity covers the full art-series range.
    output: Full art-series range
  - title: Drop-Stitch Lamination
    description: 'Heat-lamination lines bond drop-stitch cores to outer PVC laminates. Rail bands are triple-layer fusion bonded for airtight strength. Annual capacity: 15,000+ cores.'
    output: 15,000+ cores/year
  - title: Accessories & Packaging
    description: Accessory assembly and packing lines for pumps, paddles, leashes, and repair kits. Boards are vacuum-packed, boxed, and palletized for worldwide shipping.
    output: Complete packages, ready to ship
