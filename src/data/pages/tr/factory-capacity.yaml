hero:
  tagline: Üretim Kapasitesi
  title: Üretim Kapasitesi ve Yıllık Üretim
  subtitle: 12.000 m²'lik tesis, yılda 15.000 kart üreten ve ölçek alanı
intro: Paddle Board Overstock Çin'in Weihai kentinde en büyük özel şişme SUP karton üretim tesislerinden birini işletmektedir. 12.000 m²'lik fabrikamız, paralel olarak çalışan altı özel atölyeye ayrılmış olup, her yıl 15.000 karton üretme kapasitesine sahip olup, genel genelde tur ve sanat serisi hatlarında SUP üretim kapasitesi sağlıyor.
highlights:
  - value: 12,000 m²
    label: Toplam üretim alanı
    detail: 6 uzman atölye genelinde
  - value: 15,000
    label: Yıllık üretilen tahtalar
    detail: Genel Yönlü, turne ve sanat serileri SUPs
  - value: 200-300
    label: Kalifiye iş gücü
    detail: 25+ mühendis, günde 2 vardiya
  - value: 50+
    label: İhracat yapılan ülkeler
    detail: AB, ABD, AU, Orta Doğu, Asya
  - value: 2-3
    label: Göndermeye iş günleri
    detail: Stok siparişleri Weihai'den hızla ayrılır
  - value: 10+
    label: İhracat tecrübesi yılları
    detail: 2012’den beri
workshops:
  - title: SUP Paddle Tahtası Üretimi
    description: 'Şişme SUP tahtaları için 4 paralel montaj hattı. Her hat vardiya başına 50–80 tahta üretebilir. Dijital baskı ve serigrafi istasyonları eşzamanlı çalışır. Yıllık SUP kapasitesi: 8.000+ tahta.'
    output: 8.000+ SUPs/yıl
  - title: Gövde Sanatı ve EVA Son İşlem
    description: Sanat serisi deckler için özel bitirme atölyesi. Hassas EVA kesim, elle döşeme deck desenleri ve son süsleme. Yıllık kapasite, tüm sanat serisi yelpazesini kapsar.
    output: Tam sanat serisi yelpazesi
  - title: Drop-Stitch Laminasyon
    description: 'Isı-laminasyon hatları, drop-stitch çekirdekleri dış PVC laminatlara bağlar. Ray bantları, hava geçirmez dayanıklılık için üç katmanlı füzyon bağlanmasıdır. Yıllık kapasite: 15.000+ çekirdek.'
    output: Yılda 15.000+ çekirdek
  - title: Aksesuarlar ve Ambalaj
    description: Pompalar, kürekler, tasmalar ve tamir kitleri için aksesuar montaj ve paketleme hatları. Kartlar vakumla paketlenir, kutulanır ve dünya çapında nakliye için paletlenir.
    output: Tam paketler, göndermeye hazır
tldr:
  summary: Paddle Board Overstock Çin'in Weihai kentindeki kendi 12.000 m²'lik fabrikasında yılda 15.000 paddle board üretmektedir. 2 vardiyada 200-300 kalifiye işçi çalışır ve 50 ülkedeki kürekçilere doğrudan satış+ yapar.
  points:
    - Weihai'de 12.000 m²'lik üretim kampüsü
    - Yılda 15.000 levha inşa edildi
    - 200-300 nitelikli işçi, günde 2 vardiya.
    - Stokta olan siparişler 2-3 iş günü içinde gönderilir
    - Her panoya 2 yıllık garanti
cta:
