hero:
  tagline: Üretim Kapasitesi
  title: Üretim Kapasitesi ve Yıllık Üretim
  subtitle: Yıllık 15.000 tekne üreten 12.000 m² tesis, genişleme için alan mevcut
intro: Paddle Board Overstock, Çin'in Qingdao şehrindeki en büyük şişme bot üretim tesislerinden birini işletmektedir. 12.000 m² büyüklüğündeki fabrikamız, paralel çalışan altı uzman atölyeye göre organize edilmiştir ve bu yapı SUP, kano, bot, RIB ve güvenlik ekipmanları üretim hattında yıllık 15.000 tekne üretme kapasitesi sağlamaktadır.
highlights:
  - value: 12,000 m²
    label: Toplam üretim alanı
    detail: 6 uzman atölye genelinde
  - value: 15,000
    label: Yıllık üretilen tekneler
    detail: SUPs, kanolar, RIBs, botlar, güvenlik ekipmanları
  - value: 200-300
    label: Kalifiye iş gücü
    detail: 25+ mühendis, günde 2 vardiya
  - value: 50+
    label: İhracat yapılan ülkeler
    detail: AB, ABD, AU, Orta Doğu, Asya
  - value: 30–45
    label: Standart teslim süresi (gün)
    detail: Sipariş onayından FOB kadar
  - value: 10+
    label: İhracat tecrübesi yılları
    detail: 2012'den Beri
workshops:
  - title: SUP Paddle Tahtası Üretimi
    description: 'Şişme SUP tahtaları için 4 paralel montaj hattı. Her hat vardiya başına 50–80 tahta üretebilir. Dijital baskı ve serigrafi istasyonları eşzamanlı çalışır. Yıllık SUP kapasitesi: 8.000+ tahta.'
    output: 8.000+ SUPs/yıl
  - title: RIB Bot Üretimi
    description: "7,6 m'ye kadar RIB gövdeler için 6 kalıp istasyonuna sahip özel fiberglas gövde atölyesi. Tüp kaynak ve montaj alanı aynı anda 3–5 RIBs botu işleyebilir. Yıllık RIB kapasitesi: 2.000+ tekne."
    output: 2.000+ RIBs/yıl
  - title: Şişme Bot ve Botiks
    description: 'Şişme botlar, kanolar ve botiks için çok amaçlı üretim hatları. Sıcak hava kaynak istasyonları, RF dielektrik presler ve montaj çalışma istasyonları sipariş karışımına göre yeniden yapılandırılır. Yıllık kapasite: 5.000+ birim.'
    output: 5.000+ birim/yıl
  - title: Güvenlik Ekipmanları
    description: 'Can yelekleri ve güvenlik ekipmanları için ayrı temiz oda üretim alanı. Özel dikiş, köpük yerleştirme ve test istasyonları. Yıllık can yeleği kapasitesi: 50.000+ birim.'
    output: 50.000+ can yeleği/yıl
oem_capacity:
  moq: 'SUP: 5–10 birim | RIB: 2–5 birim | Kano/Botiks: 10–20 birim | Özel kalıp: 200+ birim'
  lead_time: Standart 30–45 gün. Numune 15–20 gün. Acele üretim mevcut.
  payment: T/T %30 depozito + %70 sevkiyat öncesi. L/C, Western Union kabul edilir.
