testimonial:
  quote: Beni satın almaya ikna eden şey konstrüksiyonuydu. Yapıştırıcı yerine füzyon kaynaklı dikişler, 15 PSI’te sağlam hisseden drop-stitch çekirdek ve geri adım attığımda sallanmama. İki yıldır sıfır sorun.
  author: Marta Keller
  title: Doğrulanmış alıcı
  company: Göl turu kürekçisi
  location: Almanya
sections:
  - title: Drop-Stitch Çekirdek
    standard: 12-15 PSI çalışma basıncı
    description: Binlerce dahili polyester iplik, üst ve alt katmanları birbirine bağlayarak 12-15 PSI’te rijit bir yapı oluşturur. Bu, profesyonel kürek tahtalarında kullanılan aynı teknolojidir. drop-stitch yoğunluğumuz, rijitlik ve ağırlığın ideal dengesi için model başına optimize edilmiştir.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Çekirdek Diyagramı
  - title: Deniz Sınıfı PVC
    standard: Birleştirilmiş kaynak | UV / tuzlu su / aşındırma testli
    description: Çok katmanlı lamine PVC kumaş, deniz ortamları için derecelendirilmiştir. Her katman yapıştırılmak yerine füzyon kaynaklıdır, böylece katman ayrılma riski ortadan kalkar. UV direnci (1.000 + saat), tuzlu su korozyonu ve aşınmaya karşı test edilmiştir.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Katman
  - title: EVA Güverte Sistemi
    standard: Tutunması kolay, rahat, sanat serisi desenler
    description: Tam güverte EVA köpük tutuş, yastıklama ve karakteristik sanat serisi görünümü sağlar. Hassas kesilmiş paneller, sökülmeyen grafikler ve mum gerektirmeyen, sorunsuz desenler halinde yerleştirilir.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Güverte
  - title: Üç Katmanlı Bord Sistem
    standard: Füzyonla bağlanmış | En yüksek stres bölgesinde aşırı dayanıklı
    description: Kenar şeritleri üç katmanlı füzyonla bağlanmış ve boardun kenarına sarılmıştır — şişme bir ürünün en yüksek stres bölgesi. Ucuz boardlar burada ilk olarak bozulur; bizimkiler aşırı dayanıklıdır.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Kenar Sistemi
