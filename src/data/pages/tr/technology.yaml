testimonial:
  quote: Aquafarer'i farklı kılan şey onların malzeme bilimi. Sadece bileşenleri birleştirmekle kalmazlar — PVC bileşenlerini, kaynak parametrelerini ve yapısal katman düzenini kendi içlerinde tasarlarlar. Bu dikey entegrasyon nihai ürüne yansır.
  author: David Park
  title: Ürün Geliştirme Müdürü
  company: Bluewater Sports Equipment
  location: Avustralya
sections:
  - title: Drop-Stitch Çekirdek
    standard: 12-15 PSI çalışma basıncı
    description: Binlerce dahili polyester iplik, üst ve alt katmanları birbirine bağlayarak 12-15 PSI seviyesinde sert bir yapı oluşturur. Bu, profesyonel paddle board'lar ve şişme yarış teknelerinde kullanılan aynı teknolojidir. drop-stitch yoğunluğumuz, model başına sertlik ve ağırlık açısından ideal denge için optimize edilmiştir.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS Çekirdek Diyagramı
  - title: Deniz Sınıfı PVC
    standard: Birleştirilmiş kaynak | UV / tuzlu su / aşındırma testli
    description: Deniz ortamlarına uygun çok katmanlı PVC kumaş. Her katman yapıştırılmak yerine kaynakla birleştirilmiş, böylece delaminasyon riskini ortadan kaldırır. UV direnci (ASTM G154, 1.000+ saat), tuzlu su korozyonu (ISO 9227) ve aşınma (ASTM D751) için test edilmiştir.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC Katman
  - title: Hypalon Tüpler
    standard: CSM kauçuk | UV / kimyasal / ekstrem sıcaklık dayanıklı
    description: RIB modellerinde kullanılır, Hypalon (CSM) kauçuk, standart PVC ile karşılaştırıldığında üstün UV ve kimyasal direnç sağlar. Hypalon tüpler ekstrem sıcaklıklarda esnekliğini korur ve yakıt ve yağ maruziyetinden kaynaklanan bozulmalara direnç gösterir. Tüm dikişler sertifikalı teknisyenler tarafından elle yerleştirilmiştir.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Hava Güverte Zemini
    standard: Yüksek basınçlı şişme | Kontrplak/alüminyum yerine geçer
    description: Geleneksel kontrplak veya alüminyum çıtalı zeminlerin yerini alan yüksek basınçlı şişme zemin sistemi. Ayarlama süresini, toplam ağırlığı ve depolama hacmini azaltırken, ayakta durma, balık tutma ve yürüme için yeterli sertlik sağlar. 200 kg dağıtılmış yükü taşıyacak şekilde test edilmiştir.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Hava Güvertesi
