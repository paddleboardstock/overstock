  title: Performans için Üretildi
  subtitle: Her Paddle Board Overstock board, deniz ortamları için test edilmiş hassas malzemeler ve inşaat yöntemleriyle tasarlanmıştır. Kendi prototip üretimine sahip 12.000 m² AR-GE merkezi.
