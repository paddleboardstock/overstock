content_challenge:
  tagline: Zorluk
  title: Balıkçı Teknelerinin İhtiyacı<br />Stabilite, Menzil ve Dayanıklılık
  subtitle: İster ticari balıkçı tekneleri işletiyor olun, ister işbirlikçi bir filo yönetin, ister balıkçılık kiralamaları düzenliyor olun — teknenizin her gün güvenilir şekilde performans göstermesi gerekir.
  paragraphs:
    - Balıkçı tekneleri, ipleri çalıştırmak, avı tutmak ve güvertede güvenli hareket etmek için stabil platformlara ihtiyaç duyar. Şişirilebilir ve RIBs tüp tasarımları sayesinde doğal stabiliteler sunar — benzer uzunluktaki sert gövdelere göre önemli bir avantaj.
    - Yakıt verimliliği, işletme maliyetlerinin doğrudan kârlılığı etkilediği balıkçılık operasyonları için önemlidir.RIBs Şişme tekneler, eşdeğer sert teknelerden daha hafiftir, daha az güç gerektirir ve daha az yakıt yakarlar — günlük tekne işletmeciler ve filo bütçelerini yöneten kooperatifler için kritik öneme sahiptir.
    - Deniz ortamlarında dayanıklılık çok önemlidir. Tuzlu su, UV maruz kalma ve sürekli kullanım, bozulmadan zorlu koşullara dayanabilen malzemeler gerektirir. Ticari ve işbirlikçi işletmeciler için güvenilirlik doğrudan geliri etkiler — kırık bir tekne kaybedilen balıkçılık günleri anlamına gelir.
    - Paddle Board Overstock Balıkçılık konfigürasyonları arasında oltap tutucular, balık bulucular, yem kuyuları, canlı kuyular ve ticari faaliyetlerde ciddi balıkçılık uygulamaları için tasarlanmış kargo taşıma çözümleri bulunur.
content_solution:
  tagline: Çözümümüz
  title: Balık Tutmaya Hazır Konfigürasyonlar
  subtitle: Her Paddle Board Overstock balıkçı teknesi, sizin özel balıkçılık uygulamanıza göre yapılandırılabilir.
  list:
    - Çubuk tutucu montajı — fabrikada monte edilmiş veya sonradan montaj için hazır
    - Fishfinder/GPS montaj plakası konsol pozisyonunda
    - Kiralama ve ticari işletmeciler için yem kuyusu veya canlı kuyusu seçenekleri
    - Yakalama yönetimi için soğutucu/depolama yapılandırmaları
    - Açık deniz kapasitesi için derin V gövde — dururken stabil, hızda pürüzsüz
    - PVC veya Hypalon tüp seçenekleri — uzatılmış UV maruziyeti için Hypalon
    - Model ve uygulamaya bağlı olarak dıştan takma motor aralığı 15 HP ile 115 HP arasında değişir
content_segments:
  tagline: Balıkçılık Profilleri
  title: Şişme Balıkçı Teknesi Çözümleri<br />Operatör Tipine Göre
  subtitle: Kıyı spor balıkçılığından ticari uzun hat balıkçılığına kadar — farklı balıkçılık operasyonları farklı gövde konfigürasyonları, güç aralıkları ve güvertede düzenlemeler gerektirir. Her teknemizi balıkçılığa, sulara ve çalışma tarzına uygun olacak şekilde özelleştiriyoruz.
  items:
    - title: Ticari Balıkçılık Şirketleri
      subtitle: Günlük balıkçılık operasyonları, ağ yönetimi, av taşımacılığı için filo iş tekneleri
      description: Ticari balıkçılık şirketleri, ağ kurma ve toplama, tuzak servisleri, uzun hat balıkçılığı ve av taşımacılığı için iş tekneleri işletir. Bu tekneler tuzlu su ortamlarında her gün çalışır ve ağır yükleri, sürekli güverte kullanımı ve uzun çalışma saatlerini kaldırabilmelidir. Filo kârlılığı için yakıt verimliliği ve düşük bakım maliyeti kritiktir. Tekne, mürettebatın ekipman ve avı farklı deniz koşullarında yönetebilmesi için stabil çalışma platformları sağlamalıdır.
      features:
        - Ağ yönetimi, tuzak istifleme ve balık depolama için düz güverte düzeni
        - Düşük günlük işletme maliyeti için yakıt tasarruflu 40-115 HP dıştan takma motor
        - Günlük kullanımda aşınmaya dayanıklı ağır hizmet Hypalon tüpler
        - Sık iskele ve tekne temasına dayanıklı güçlendirilmiş sürtünme şeritleri
        - Operasyon sonrası kolay yıkama için kendi kendini tahliye eden güverte
        - Çoklu tekne operatörleri için filo fiyatlandırması ve tutarlı teknik özellikler
    - title: Charter Balıkçılık Operatörleri
      subtitle: Çok yolcu konforu, av yönetimi, güvenlik sertifikalı
      description: Yarım gün ve tam gün balıkçılık turları düzenleyen operatörler — kıyı resif balıkçılığından açık deniz dip balıkçılığına kadar. Teknenizin yolcu oturma düzenine güvenlik sertifikaları, çoklu balıkçılar için geniş güverte alanı ve yolculuk boyunca yem ve avın taze kalması için entegre canlı tanklar sağlaması gerekir. Misafir konforu doğrudan tur yorumlarını, tekrar rezervasyonları ve çevrimiçi puanları etkiler.
      features:
        - Şok emici kova koltuklu konsol direksiyon
        - Fabrikada takılmış olta tutucular (4–8 pozisyon)
        - Açık denizde seyir hızları için 60–115 HP dıştan takma motor aralığı
        - Ticari yolcu operasyonları için CE C veya B kategorisi sertifikası
        - Uzun turlar için misafir konforu amacıyla Bimini veya T-top güneşlik
    - title: Artizanal ve Küçük Ölçekli Ticari Balıkçılar
      subtitle: Günlük geçim için güvenilir iş tekneleri
      description: Teknesine birincil gelir kaynağı olarak güvenen bağımsız balıkçılar — ağ kurma, balık tuzaklarına bakım yapma veya kıyıya yakın elle hat balıkçılığı. Önceliğiniz yakıt tasarrufu, kendi başınıza yapabileceğiniz basit bakım ve istikrardan taviz vermeden orta yükte yük ve av taşıyabilen bir teknedir.
      features:
        - Düşük işletme maliyeti için yakıt tasarruflu 15–40 HP dıştan takma motor
        - Uzatılmış UV ve aşınmaya karşı direnç için Hypalon CSM tüpler
        - Ağ yönetimi ve balık depolama için düz güverte düzeni
        - Şişme kil koruması ile kolay sahile iniş kabiliyeti
    - title: Balıkçılık Kooperatifleri
      subtitle: Yakala koleksiyonu, üye taşımacılığı, tedarik dağıtımı
      description: Balıkçılık kooperatifleri, üye balıkçılardan avı toplamak, uzak balıkçı topluluklarına malzeme taşımak ve hasadı pazarlara dağıtmak için topluluk temelli filolar işletir. Bu çalışma tekneleri yüksek taşıma kapasitesine, güvenilir günlük çalışmaya ve uzak bölgelerde kolay bakıma ihtiyaç duyar. Kooperatifler genellikle yedek parça temini ve servis erişiminin sınırlı olduğu gelişmekte olan bölgelerde faaliyet gösterir, bu da basit dıştan takmalı motor konfigurasyonlarını ve dayanıklı yapıyı zorunlu kılar.
      features:
        - Av ve malzeme taşımak için yüksek yük kapasitesi
        - Yerinde servis için basit dıştan takmalı motor konfigürasyonu
        - Bütçe esnekliği için ağır hizmet tipi PVC veya Hypalon inşaat
        - Yükü sabitlemek için bağlama noktalarına sahip düz güverte
        - Kooperatif işletme maliyetlerini en aza indiren yakıt tasarruflu işletme
    - title: Spor ve Oyun Balıkçılığı Tutkunları
      subtitle: Ciddi balıkçılar için performans ve stil
      description: Uzman balıkçılar, uzak bölgelere hızla ulaşan, dengeli ayakta mücadele pozisyonları sunan ve üstün kalite ve işçiliğe sahip bir balıkçılık platformu arıyorlar. Tekne, iki mil açık denize resife gitmekte ya da uzak kıyı estuarin arka sularını keşfederken evinde hissetmeli.
      features:
        - Derin-V RIB gövde, çalkantıda pürüzsüz sürüş için
        - Balık bulucu/GPS montaj plakası konsolda önceden kablolu
        - Baitwell ve soğutucu arka koltuk modülüne entegre edilmiştir
        - Tekne/tüp grafikleriyle uyumlu özel EVA deste renk seçenekleri
    - title: Balıkçılık Rehberi ve Eko-Tur Operatörleri
      subtitle: Ziyaret eden balıkçılar için rehberli balık tutma deneyimleri
      description: Üretken balık tutma bölgelerine az sayıda ziyaretçi balıkçıyı götüren rehberler — genellikle balıkçılığı kuş gözlemi veya mangrov keşfi gibi ekoturizm unsurlarıyla birleştirirler. Teknenin, küçük teknelere alışık olmayan misafirler için kuru ve rahat bir şekilde seyretmesi, kolay binme ve gölge seçeneklerine sahip olması gerekir.
      features:
        - Bimini tentesi veya T-tente montaj noktaları fabrikada takılmış
        - Kolay yeniden binme için düzgün girişli binme merdiveni
        - Rahatsızlığı en aza indirmek için sessiz 4 zamanlı dıştan takma motor
        - Misafir telefonları, cüzdanlar, kameralar için kuru saklama bölmeleri
