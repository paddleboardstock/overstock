content_system:
  tagline: Kalite Kontrol Sistemi Genel Bakış
  title: Entegre Kalite<br />Kontrol Çerçevesi
  subtitle: Kalite kontrol sistemimiz üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir. Kalite laboratuvarından imzalı kalite onayı olmadan hiçbir parti sevk edilmez.
  items:
    - title: Bağımsız Kalite Laboratuvarı
      description: Kalite laboratuvarımız, üretimden bağımsız bir işlev olarak çalışmaktadır. Kalite kontrol denetçileri, Üretim Direktörüne değil, Kalite Müdürüne rapor verir. Bu organizasyonel bağımsızlık, kalite kararlarının objektif bir şekilde alınmasını sağlar — üretim süreleri asla kalite gereksinimlerinin önüne geçmez.
      features:
        - Üretimden bağımsız olarak doğrudan yönetime rapor verir
        - Kalite sorunları nedeniyle üretimi durdurma yetkisine sahip
        - Tüm aşamalarda 12 adanmış kalite kontrol müfettişi
        - Tüm test ekipmanları her yıl kalibre edilir
    - title: Seri İzlenebilirliği
      description: Her ham madde partisine ERP sistemimizde benzersiz bir lot numarası atanır. Malzeme gelişinden üretime ve bitmiş ürüne kadar her bir kartın malzeme listesi, orijinal tedarikçi partilerine geri bağlanır. Bu, her türlü kalite veya uyumluluk sorgusu için tam yukarı yönlü izlenebilirlik sağlar.
      features:
        - Malzemeden bitmiş ürüne ERP-tabanlı parti takibi
        - Her iş emri için fiziksel parti etiketleri
        - '%100 malzeme kapsaması — PVC, drop-stitch, EVA köpük, donanım, yapıştırıcılar'
        - Kayıtlar 10 yıl boyunca saklanır
    - title: Kalite Yönetimi
      description: Kalite kontrol prosedürlerimiz belgelenmiş iç protokollere uyar. Test sonuçları kaydedilir, izlenebilir ve bağımsız kalite laboratuvarımız tarafından gözden geçirilir. Son 12 aylık sevkiyatlarda %99,3 hata oranı yok.
      features:
        - Belgelenmiş iç QC protokolleri, yıllık olarak gözden geçirilir
        - Son 12 aylık sevkiyatlarda %99,3 hata oranı yok
        - Güvenlik açısından kritik kusurlara sıfır tolerans
        - Kayıtlar 10 yıl boyunca saklanır
content_inspection:
  tagline: Denetim Aşamaları
  title: Altı Aşamalı<br />Denetim Süreci
  subtitle: Her ürün, dokümante edilmiş KK kontrol noktalarına sahip 6 denetim aşamasından geçer. Kusurlar erken tespit edilir, düzeltici işlemler hemen uygulanır ve her parti tamamen izlenebilir durumdadır.
  stages:
    - stage: '1'
      title: Gelen Malzeme Muayenesi
      description: Tüm gelen malzemeler parti/lot numarası ile kaydedilir ve QC onayına kadar karantinada tutulur. PVC kumaş ruloları çekme dayanıklılığı, yırtılma direnci ve kalınlık açısından test edilir. Drop-stitch çekirdekler, vanalar, yapıştırıcılar ve donanımlar görsel olarak incelenir ve spesifikasyonlara göre ölçülür.
      checks: Çekme dayanımı, yırtılma direnci, kalınlık ölçer, yapışkan viskozite, görsel kusur taraması
      threshold: Test edilen partilerin %100'ü. Çekme dayanımı spesifikasyonun %90'ından az, yırtılma minimum spesifikasyondan az veya herhangi bir görsel kusur varsa reddedin
    - stage: '2'
      title: Süreç İçi Kalite Kontrol — Kesim ve Hazırlık
      description: CNC-kesim paneller, her 20. panelde bir CAD kaynak dosyalarına göre boyutsal olarak kontrol edilir. Kenar kalitesi, tüylenme, düzensiz kesimler veya boyutsal sapma açısından incelenir. Malzemeler kaynak işlemine geçmeden önce her üretim partisi için panel sayısı BOM ile doğrulanır.
      checks: CAD DXF dosyalarına karşı boyutsal kontrol, kenar kalitesi incelemesi, panel sayısı doğrulaması
      threshold: Tolerans ±0.5mm. Tolerans dışı %2’den fazlaysa seriyi reddedin
    - stage: '3'
      title: İşlem Sırasındaki Kalite Kontrolü — Kaynak ve Yapıştırma
      description: Üretim sırasında, kaynak kalitesi sürekli olarak izlenir. Her 50 birimde numunelerde soyma testleri yapılır. Kaynak genişliği spesifikasyonla karşılaştırılır. Sıcak hava sıcaklık kayıtları tutarlılık için gözden geçirilir. Her dikiş, kanal oluşumu veya boşluklar açısından arkadan aydınlatma altında görsel olarak incelenir.
      checks: Her 50 birimde soyma testi, kaynak genişliği ölçümü, sıcak hava sıcaklık kaydı incelemesi, arkadan ışıkla dikiş incelemesi
      threshold: Soyma dayanımı min 8 N/cm. Kaynak genişliği toleransı ±1mm. Görünür herhangi bir kanallama = reddet
    - stage: '4'
      title: Montaj Kalite Kontrolü
      description: Her bir birim, ekip lideri tarafından imzalanan 100 puanlık bir montaj kontrol listesine uyar. Valf fonksiyonu, 10 açma/kapatma döngüsü ile test edilir. Donanım torku doğrulanır. Görsel muayene, yüzey kaplaması, renk tutarlılığı, etiket yerleşimi ve aksesuar tamlığını kapsar.
      checks: Birim başına 100 maddelik kontrol listesi, vana fonksiyon testi, donanım tork doğrulaması, görsel muayene
      threshold: 'Güvenlik açısından kritik öğelerde (vanalar, D-halkalar, kulplar) sıfır kusur politikası. Hafif kozmetik: %99,3 kusursuz hedef'
    - stage: '5'
      title: Basınç Testi
      description: Her bir bölme, nominal basıncın 1,25 katına kadar şişirilir ve 24-48 saat boyunca tutulur. Basınç sensörleri, bekletme süresi boyunca sürekli olarak veri kaydeder. Sıcaklığa göre düzeltilmiş ölçümler doğruluğu sağlar. Basınçta %5'ten fazla düşüş olan herhangi bir bölme reddedilir ve dikiş tekrar kontrolü için gönderilir, tüm üretim partisi ise %100 yeniden test edilir.
      checks: 24-48 saat basınç tutma kaydı, sensör kalibrasyonu günlük olarak doğrulandı, sıcaklıkla telafi edilmiş okuma, tamir sonrası dikiş yeniden testi
      threshold: Sabit sıcaklıkta 24 saat boyunca maksimum %5 basınç düşüşü. Aşılması = tüm partinin %100 yeniden testi
    - stage: '6'
      title: Final Muayene ve Sevkiyat Serbestisi
      description: Paketlemeden önce son görsel ve fonksiyonel kontrol. Yüzey kusurları, renk tutarlılığı, etiket/BIN doğrulaması, ambalaj bütünlüğü ve aksesuar tamlığı müşteri siparişine karşı kontrol edilir. Ürünler vakumlanır, kutulanır ve paletlenir. Ürünün fabrikadan çıkmasından önce nihai kalite kontrol onayı gereklidir.
      checks: Tam görsel inceleme, SKU göre aksesuar kontrol listesi, ambalaj düşme testi (1m rastgele örnek), etiket/barkod tarama doğrulaması
      threshold: Güvenlik kusurlarında sıfır tolerans. %99,3 kusursuz hedef. Birimlerin %100'ü görsel olarak incelenmiştir
content_equipment:
  tagline: Test Ekipmanları
  title: QC Laboratuvarı<br />Ekipman
  subtitle: Kalite laboratuvarımız, malzeme doğrulama, kaynak bütünlüğü ve ürün performans doğrulaması için özel test ekipmanlarıyla donatılmıştır.
  columns: 3
  items:
    - title: Çekme Testi Makinesi
      description: Dahili test protokolüne göre kumaşın çekme dayanımını ve uzamasını ölçer. Tüm PVC ve drop-stitch kumaş partilerinin gelen kalite kontrolü için kullanılır.
      icon: tabler:scale
    - title: Sıcaklık Odası
      description: UV direnç testi ve düşük sıcaklık esnekliği testi için çevresel oda. Aşırı çalışma koşullarını simüle eder.
      icon: tabler:temperature
    - title: Basınç Sensörleri ve Kaydediciler
      description: 24-48 saatlik hava sızdırmazlık testleri için sürekli veri kaydı yapan dijital basınç sensörleri. Doğruluk için sıcaklığa göre düzeltme yapılmıştır.
      icon: tabler:wind
    - title: Soyma Testi Düzeni
      description: Kaynak dikiş dayanıklılığını doğrulamak için kalibre edilmiş soyma testi ekipmanı. Her üretim partisinden rastgele örnekler alınır.
      icon: tabler:files
    - title: Kaçak Tespit Tankı
      description: Şişirilmiş odaların su altında kaçak testleri için su tankı. Dikiş ve valf bütünlüğünü doğrulamak için görsel kabarcık tespiti.
      icon: tabler:ripple
    - title: İnceleme Araçları
      description: Kalibre edilmiş ölçüm aletleri — kalınlık ölçer, tork anahtarları, boyutsal kumpaslar, sertlik test cihazları üretim QC istasyonları için.
      icon: tabler:tools
content_metrics:
  tagline: QC Performansı
  title: Kalite Kontrol<br />Metrikler
  subtitle: Üretim hattımızdan gerçek geçme/kalma verileri. Bu metrikler günlük olarak izlenir ve yönetim tarafından aylık olarak gözden geçirilir.
  columns: 3
  items:
    - title: '%100 Test Edilen Üniteler'
      description: Her panonun her odası nakliyat öncesi basınç testine tabi tutulur. Numune alınmaz — basınç bütünlüğü %100 denetlenir.
      icon: tabler:check
    - title: <%5 Basınç Düşüşü
      description: 24-48 saat içinde 1.25× nominal basınçta maksimum izin verilen basınç kaybı. Bu eşik değerini aşan herhangi bir oda partinin tekrar test edilmesini tetikler.
      icon: tabler:gauge
    - title: '%99,3 Hatasız'
      description: Son 12 aylık sevkiyatlarda kusursuz oran. Güvenlik açısından kritik kusurlara sıfır tolerans.
      icon: tabler:clipboard-check
    - title: 24-48 Saat Bekletme
      description: Kartlar modele ve partiye bağlı olarak 24-48 saat tutulur. Basınç sensörleri tutma süresi boyunca sürekli olarak kaydeder.
      icon: tabler:clock
    - title: 1.25× Test Basıncı
      description: Her odada güvenlik payı — maksimum çalışma koşullarının üzerinde bir pay sağlamak için belirtilen basıncın %25 üzerinde test edilmiştir.
      icon: tabler:arrow-up
    - title: '%0 Güvenlik Hatası'
      description: Güvenlik açısından kritik hatalar konusunda sıfır tolerans politikası — valfler, D-halkalar, dikişler ve yüzdürme odaları. Herhangi bir hata = %100 yeniden inceleme.
      icon: tabler:shield
cta:
  title: Kalite belgelerini talep edin
  subtitle: Her sevkiyatla birlikte test raporları ve denetim kayıtlarını içeren tam kaliteli dokümantasyon paketleri sunuyoruz. Numuneler için bizimle iletişime geçin.
  actions:
    - variant: primary
      text: QC belgelerini talep edin
      href: /contact
    - text: Test protokollerini görüntüleyin
      href: /quality
tldr:
  summary: 'Altı aşamalı kalite kontrol sistemi: malzeme muayenesi, süreç içi kalite kontrol, kaynak doğrulama, montaj kalite kontrolü, 1,25 kat nominal basınçta basınç testi ve nihai muayene. %100 birim basınç testi. AQL 2,5 örneklemeye göre %99,3 kusursuz oran.'
  points:
    - 'Altı aşamalı kalite kontrol: malzeme muayenesi, üretim sürecinde kalite kontrol, kaynak doğrulama, montaj kalite kontrolü, 1.25 kat basınç testi ve 100 puanlık nihai muayene'
    - Paketlemeden önce her kartta 100 puanlık son kontrol
    - Ünitelerin %100'ü, maksimum %5 düşüş toleransı ile 1,25 kat nominal basınçta 24-48 saat bekletilir
    - AQL 2.5 numuneleme ile %99,3 kusursuzluk oranı sağlanması
    - 'Kaynak Kalite Kontrolü: her kaynaklı eklemde soyma testi, kaynak genişliği doğrulaması ve arka ışık dikiş muayenesi'
