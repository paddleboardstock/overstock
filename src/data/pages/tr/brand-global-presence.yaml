hero:
  tagline: Küresel Varlık
  title: 50 Ülkeye Hizmet Veriyoruz<br />Tüm Kıtalar Genelinde
  subtitle: Avrupa kıyı devriye operatörlerinden Avustralya su sporları distribütörlerine, Orta Doğu kurtarma ekiplerine kadar — Paddle Board Overstock tekneleri dünya genelinde suda yer alıyor.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock küresel denizcilik üretimi ve dağıtımı
stats:
  title: Küresel Erişim
  stats:
    - title: Ülkeler
      amount: 50+
    - title: İhracat Pazarları
      amount: Avrupa, Amerika, Asya, Orta Doğu, Okyanusya
    - title: Üretim
      amount: Qingdao, Çin
    - title: ABD Deposu
      amount: Montclair, CA
features3_markets:
  tagline: Ana Pazarlar
  title: Bölgesel Uzmanlık<br />Yerel Gereksinimler İçin
  subtitle: Farklı pazarların farklı düzenleyici gereksinimlere, tercihlere ve kullanım alanlarına sahip olduğunu anlıyoruz.
  isBeforeContent: false
  columns: 4
  items:
    - title: Avrupa & Birleşik Krallık
      description: EN ISO 6185 standartlarını karşılayan CE sertifikalı ürünler. AB pazarlarında RIBs, şişme tekneler ve SUP bordlara yüksek talep var. İngiltere distribütörleri hızlı sipariş süreçlerimizi takdir ediyor.
      icon: tabler:map-pin
    - title: Kuzey Amerika
      description: ABD Sahil Güvenlik onaylı üretim. Hızlı Batı Yakası teslimatı için Montclair, CA'da ABD deposu. Balıkçı tekneleri, kurtarma araçları ve eğlence amaçlı SUPs için artan talep.
      icon: tabler:map-pin
    - title: Avustralya & Okyanusya
      description: RIB tekneler ve şişme yardımcı teknelere güçlü pazar. Avustralya distribütörleri, zorlu güneş koşullarına karşı UV direncine sahip Hypalon teknelerimizi değerli buluyor. Asya tesisimizden hızlı gönderim.
      icon: tabler:map-pin
    - title: Orta Doğu
      description: Devriye ve kurtarma teknelerine artan talep. Alüminyum gövdeli RIBs teknelerimiz sahil güvenlik ve güvenlik operatörleri arasında popüler. Yüksek sıcaklıklı ortamlara özel konfigürasyonlar.
      icon: tabler:map-pin
features3_distribution:
  tagline: Dağıtım Ağı
  title: Distribütörlerle Ortaklık<br />Dünya Genelinde
  subtitle: Kurulmuş deniz ekipmanı distribütörleri, OEM markalar ve devlet tedarik ajansları ile çalışıyoruz.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Ortaklıklar
      description: Küresel su sporları markaları için özel etiketli üretim. Tasarımdan üretime ve doğrudan teslimata kadar her şeyi biz hallediyoruz.
      icon: tabler:building
    - title: Distribütör Ağı
      description: 20+ ülkede yetkili distribütörler stok bulundurur ve yerel destek sağlar. Yeni distribütör başvuruları memnuniyetle karşılanır.
      icon: tabler:users
    - title: Hükümet ve Kurumsal
      description: Sahil güvenlik, arama ve kurtarma kuruluşları ile askeri tedarik programlarına doğrudan temin. Kurumsal tedarik gereksinimlerine uyum.
      icon: tabler:building-community
steps2_logistics:
  title: Küresel Lojistik ve Destek
  subtitle: Fabrikadan varış noktasına — tüm tedarik zincirini yönetiyoruz.
  items:
    - title: Gönderim Seçenekleri
      description: Deniz taşımacılığı (FOB Qingdao), acil siparişler için hava taşımacılığı ve numuneler ile yedek parçalar için ekspres kurye.
      icon: tabler:truck-delivery
    - title: ABD Deposu
      description: "Kuzey Amerika genelinde hızlı teslimat için Montclair, CA'da stok bulundurulmaktadır. Batı Kıyısı: 2-3 gün, Orta: 3-4 gün, Doğu Kıyısı: 4-5 gün."
      icon: tabler:building-warehouse
    - title: Yedek Parçalar
      description: Orijinal Paddle Board Overstock yedek parçalar ve sarf malzemeleri yıl boyunca stokta bulundurulur. Yaygın parçalar 24 saat içinde gönderilir.
      icon: tabler:package
    - title: Teknik Destek
      description: Teknik sorular, tamir tavsiyesi ve yeniden donatma desteği için mühendislik ekibimize doğrudan hat. 20 yıl önce yaptığımız tekneleri destekliyoruz.
      icon: tabler:headset
cta:
  title: Distribütör olmak ister misiniz?
  subtitle: Dağıtım ağımızı aktif olarak genişletiyoruz. İş ortaklığı fırsatlarını görüşmek için ihracat ekibimizle iletişime geçin.
  actions:
    - variant: primary
      text: Ortaklık sorgusu
      href: /contact
    - text: Ürün yelpazemizi görüntüleyin
      href: /products
