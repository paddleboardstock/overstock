hero:
  tagline: Ekipman
  title: Üretim Ekipmanları ve Makineleri
  subtitle: Kesme, kaynak, baskı ve montajda endüstriyel düzeyde ekipman
  back_label: Fabrikaya Geri Dön
  back_link: /factory
categories:
  - title: Kesim ve Malzeme Hazırlığı
    items:
      - name: Otomatik PVC Kesme Makinesi
        spec: CNC-kontrollü, 6,5 m × 2,5 m, 0,1 mm hassasiyet
        desc: Bilgisayar kontrollü otomatik kesim makinesi, PVC ve drop-stitch kumaşlar için. Nesting yazılımı, malzeme kullanımını %5’in altına düşecek şekilde optimize eder.
      - name: Kumaş Serici
        spec: Maksimum 3 m genişlik, gerilim kontrollü besleme
        desc: Kesim öncesinde kumaşın tek veya çok kat halinde gerilimi kontrollü şekilde serilmesini sağlar ve deformasyonu önler.
  - title: Kaynak ve Yapıştırma
    items:
      - name: Isı Yapıştırma Makinesi
        spec: Sıcak hava kaynağı, değişken 200–600 °C, 0,5–5 m/dk
        desc: Sıcak hava ısı yapıştırma makinesi, PVC laminatları, ray bantlarını ve oda dikişlerini yapıştırmak ve kaynak yapmak için. drop-stitch çekirdek eklerini sabitlemek, mühürlemek ve birleştirmek için kullanılır.
      - name: Dielektrik RF Pres
        spec: 15 kW, plaka 2000 × 600 mm
        desc: Ana boyuna dikişler, borda-tüp birleşimleri ve büyük odacık imalatı için radyo frekanslı kaynak presi.
      - name: CNC-Kontrollü RF Kaynak Makinesi
        spec: 8 kW, XY tablo 2500 × 1200 mm
        desc: Karmaşık geometriler, logo kabartma ve hassas yama işleri için programlanabilir eğimli dikiş kaynağı.
  - title: Desteye Sanatı ve Bitirme
    items:
      - name: EVA Gövde Kesim Makinesi
        spec: CNC bıçak kesimi, 2 m genişlik
        desc: Sanat serisi güverte desenleri için EVA güverte köpüğü panellerinin hassas kesimi. Her panel, kusursuz bir tam güverte uyumu için şekle göre kesilir.
      - name: Güverte Lamine Presi
        spec: Sıcaklık ve basınç kontrollü
        desc: EVA güverte panellerini, tam güverte alanında tutarlı yapışma ile tahta yüzeyine bağlar.
  - title: SUP Baskı ve Dekorasyon
    items:
      - name: Dijital Yazıcı
        spec: Yüksek çözünürlüklü mürekkep püskürtmeli, 2 m'ye kadar baskı genişliği
        desc: Tam renkli SUP güverte grafikleri için kumaşa direkt dijital baskı. UV-dayanıklı su bazlı mürekkeplerle özel desenler, gradyanlar ve fotoğraf kalitesinde görüntüler basar.
      - name: Serigrafi Makinesi
        spec: Manuel ve yarı otomatik, çok renkli hizalama
        desc: SUP board logoları, marka işaretleri ve tekrarlayan desenler için serigrafi. Canlı renk doygunluğu ile dayanıklı, opak baskılar sağlar.
  - title: Final Montaj
    items:
      - name: Valf Tork İstasyonu
        spec: Kalibreli, 10 çevrim fonksiyon testi
        desc: Şişirme valflerini takar ve torklar, ardından her valfi 10 açma/kapatma çevrimi ile fonksiyon testinden geçirir.
      - name: Fin Kutusu ve D-Halka Yerleştirici
        spec: Cıvata hizalı, yapıştırıcı kürlenmiş
        desc: Fin kutularını, D-halkaları ve kulpları model spesifikasyonlarına göre tam güverte konumlarına yerleştirir ve yapıştırır.
  - title: Test ve Kalite Kontrol
    items:
      - name: Evrensel Çekme Test Cihazı
        spec: 50 kN kapasite
        desc: Kumaş partileri için kopma kuvveti, kopmada uzama ve yırtılma yayılımı testleri.
      - name: Hava Tutma Test Cihazı
        spec: Programlanabilir, 30 dakikalık basınç tutma
        desc: Her tüp bölmesi montaj öncesinde otomatik basınç tutma testi.
      - name: Dikiş Soyma Test Cihazı
        spec: 100 mm/dk hızla motorlu 180° soyma
        desc: İç protokole göre kaynak ve yapışkan dikiş soyulma mukavemet testi.
      - name: Ksenon-Arc Hava Koşulları Odası
        spec: 2000 saat maruz kalma
        desc: Renk değişimi ve mukavemet korunumu için UV direnç testi.
cta:
  title: Fabrika turuna ilgi duyuyor musunuz?
  desc: Weihai tesisimizi ziyarete gelenleri memnuniyetle karşılıyoruz. Ekipmanlarımızı ve süreçlerimizi yerinde görün.
  label: Bir ziyaret planlayın →
  link: /contact
tldr:
  summary: Paddle Board Overstock, otomatik PVC kesim makineleri, yüksek frekanslı RF kaynak makineleri, EVA güverte kesim ve montaj istasyonları, ısı presleri ve nihai montaj tezgahları ile donatılmış 12.000 m² üretim alanını işletmektedir. Her bir tabla 1,25 katı nominal basınçta basınç testi geçirir.
  points:
    - Otomatik PVC kesim ile CNC hassasiyet
    - Dikiş bütünlüğü için yüksek frekanslı RF kaynağı
    - EVA güverte kesim ve el ile tamamlama istasyonları
    - Valf torku ve kanat kutusu montaj tezgahları
    - Tablaların %100'ünde 1,25 katı nominal basınç testi
