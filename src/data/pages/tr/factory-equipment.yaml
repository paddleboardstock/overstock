hero:
  tagline: Ekipman
  title: Üretim Ekipmanları ve Makineleri
  subtitle: Kesme, kaynak, baskı ve montajda endüstriyel düzeyde ekipman
  back_label: Fabrikaya Geri Dön
  back_link: /factory
categories:
  - title: Kesim ve Malzeme Hazırlığı
    items:
      - name: Otomatik PVC Kesme Makinesi
        spec: CNC-kontrollü, 6,5 m × 2,5 m, 0,1 mm hassasiyet
        desc: PVC, Hypalon ve drop-stitch kumaşlar için bilgisayar kontrollü otomatik kesim makinesi. Yerleşim yazılımı malzeme kullanımını %5'in altına atık ile optimize eder.
      - name: Kumaş Serici
        spec: Maksimum 3 m genişlik, gerilim kontrollü besleme
        desc: Kesim öncesinde kumaşın tek veya çok kat halinde gerilimi kontrollü şekilde serilmesini sağlar ve deformasyonu önler.
  - title: Tüp Kaynak ve Yapıştırma
    items:
      - name: Isı Yapıştırma Makinesi
        spec: Sıcak hava kaynağı, değişken 200–600 °C, 0,5–5 m/dk
        desc: PVC ve Hypalon tüp dikişlerini birleştirmek ve kaynak yapmak için sıcak hava ısıtma makinesi. Tutuşturma, mühürleme ve tüp odaları ile şamandıra birleşimlerini eritmek için kullanılır.
      - name: Dielektrik RF Pres
        spec: 15 kW, plaka 2000 × 600 mm
        desc: Ana boyuna dikişler, borda-tüp birleşimleri ve büyük odacık imalatı için radyo frekanslı kaynak presi.
      - name: CNC-Kontrollü RF Kaynak Makinesi
        spec: 8 kW, XY tablo 2500 × 1200 mm
        desc: Karmaşık geometriler, logo kabartma ve hassas yama işleri için programlanabilir eğimli dikiş kaynağı.
  - title: RIB Gövde Üretimi
    items:
      - name: Fiberglas El Yatırmalı Kalıplar
        spec: 6 m LOA kadar RIB gövdeler için çoklu kalıplar
        desc: Polyester ve vinilester reçine sistemleriyle geleneksel el ile katman serme fiber üretim. Her kat elle silindirlenir ve vakum torbasına alınır, böylece laminat kalitesi ve dayanıklılığı tutarlı olur.
      - name: Jelcoat Püskürtme Kabini
        spec: Sıcaklık kontrollü, filtrelenmiş hava havalandırması
        desc: RIB gövdeler için jelcoat uygulaması. Yüksek parlaklıkta, UV-dirençli yüzey sağlar ve hassas kalınlık kontrolü sunar.
      - name: CNC Freze Tezgahı (5 eksenli)
        spec: 3 m × 2 m × 1 m çalışma hacmi, su soğutmalı mil
        desc: Gövde eklerinin, konsol kalıplarının, oturma yedeklerinin ve özel braketlerin işlenmesi.
  - title: SUP Baskı ve Dekorasyon
    items:
      - name: Dijital Yazıcı
        spec: Yüksek çözünürlüklü mürekkep püskürtmeli, 2 m'ye kadar baskı genişliği
        desc: Tam renkli SUP güverte grafikleri için kumaşa direkt dijital baskı. UV-dayanıklı su bazlı mürekkeplerle özel desenler, gradyanlar ve fotoğraf kalitesinde görüntüler basar.
      - name: Serigrafi Makinesi
        spec: Manuel ve yarı otomatik, çok renkli hizalama
        desc: SUP board logoları, marka işaretleri ve tekrarlayan desenler için serigrafi. Canlı renk doygunluğu ile dayanıklı, opak baskılar sağlar.
  - title: Montaj ve Kurulum
    items:
      - name: Motor Kaldırıcı
        spec: 500 kg kapasite, ayarlanabilir dağıtıcı çubuk
        desc: 2,5 ile 60 hp arasındaki dıştan takma motorların güvenli montajı.
      - name: Konsol Maketi Çerçevesi
        spec: Ayarlanabilir yükseklik ve açı
        desc: Kurulumdan önce direksiyon, gaz ve enstrüman panellerinin ön montajı.
      - name: Hidrolik Hortum Sıkma Makinesi
        spec: 1" çapa kadar, dijital basınç göstergeli
        desc: Özel uzunlukta hidrolik direksiyon hortumu montajları, sıkıştırmalı bağlantı elemanları ile.
      - name: Elektrik Tesisatı Panosu
        spec: 3 m × 1,5 m, önceden basılmış devre şemaları
        desc: Tam elektrik tesisatlarının tekneden bağımsız montajı ve test edilmesi.
  - title: Test ve Kalite Kontrol
    items:
      - name: Evrensel Çekme Test Cihazı
        spec: 50 kN, / ASTM D751
        desc: Kumaş partileri için kopma kuvveti, kopmada uzama ve yırtılma yayılımı testleri.
      - name: Hava Tutma Test Cihazı
        spec: Programlanabilir, 30 dakikalık basınç tutma
        desc: Her tüp bölmesi montaj öncesinde otomatik basınç tutma testi.
      - name: Dikiş Soyma Test Cihazı
        spec: 100 mm/dk hızla motorlu 180° soyma
        desc: Kaynak ve yapıştırılmış dikiş soyulma mukavemeti testi ISO 6185'e göre.
      - name: Ksenon-Arc Hava Koşulları Odası
        spec: 2000 saat maruz kalma
        desc: Renk değişimi ve mukavemet korunumu için UV direnç testi.
cta:
