content_segments:
  tagline: Ortak Profilleri
  title: Dağıtım Ortaklığı Modelleri<br />Ortak Türüne Göre
  subtitle: Farklı dağıtıcılar farklı pazara giriş güçleri getirir — bölgesel altyapı, e-ticaret erişimi, özel perakende veya çok markalı portföyler. Ortaklık şartlarını, fiyatlandırma kademelerini ve destek seviyelerini her ortak profiline uygun şekilde yapılandırıyoruz.
  items:
    - title: Bölgesel Deniz Dağıtıcıları
      subtitle: Bölgeye özel B2B dağıtımı
      description: Belirli bir coğrafi alan içinde deniz bayileri, su sporları perakendecileri ve kiralama operatörlerine hizmet veren, depo altyapısına, bayi ağına ve lojistik yeteneklere sahip köklü dağıtıcılar. Tam bir ürün hattına, korunan fiyatlandırmaya ve bayi hesaplarını yerel stok ve destek ile servis etme yeteneğine ihtiyacınız vardır.
      features:
        - Minimum taahhüt şartları ile özel bölge koruması
        - Çeyrek dönem hacim indirimleri ile tam katalog toptan fiyatlandırma
        - Hızlı dönen SKU'lar için yerel stok konsinye programı
        - Bayilik ağı eğitimi ve ortak markalı pazarlama programları
    - title: E-Ticaret ve Çevrimiçi Perakendeciler
      subtitle: Dijital öncelikli dağıtım kanalları
      description: Amazon, eBay veya kendi e-ticaret platformları aracılığıyla su sporları ekipmanları satan çevrimiçi perakendeciler. Pazara hızlı ulaşım, rekabetçi fiyatlandırma ve tüketiciye doğrudan lojistik kritik öneme sahiptir. Markanız altında bireysel siparişleri hızlı teslimat ve sıfır stok riski ile gönderebilecek bir ortağa ihtiyacınız var.
      features:
        - 'Drop-ship programı: markalı, fabrikadan doğrudan teslimat'
        - E-ticaret platformunuz için gerçek zamanlı stok API beslemesi
        - Amazon Seller Central entegrasyonu ile EAN/UPC desteği
        - İade lojistiği ve garanti talep işlemleri dahil
    - title: Özel Su Sporları Perakendecileri
      subtitle: Fiziksel mağaza showroom ortakları
      description: Su sporları ekipmanları konusunda uzmanlaşmış fiziksel perakende mağazaları — yerel kürekçileri, balıkçılar ve tekne sahiplerine yüz yüze satış, gösteri ve satış sonrası hizmet sunar. Mağaza dostu paketleme, demo ünitesi programları ve walk-in müşterileri dönüştüren nokta satış materyallerine ihtiyacınız var.
      features:
        - 'Demo ünitesi programı: indirimli showroom sergi panoları'
        - Raf optimizasyonlu kutu tasarımı ile perakende hazır paketleme
        - Nokta satış standları, karşılaştırma tabloları ve alıcı kılavuzları
        - Mağaza personeli eğitimi ve sertifikasyon programı
    - title: Çok Markalı & Mağazalar İçin Dağıtıcılar
      subtitle: Geniş ürün yelpazeli spor malzemeleri dağıtımı
      description: Büyük ölçekli dağıtıcılar, çok markalı kataloglarla mağazalar, büyük zincir mağazalar ve spor malzemeleri zincirlerine hizmet verir. Tutarlılık, uyumluluk belgeleri ve tedarikçi uyumu esastır — her SKU, perakendeciye özgü paketleme, etiketleme ve kalite standartlarını karşılamalıdır.
      features:
        - 'Perakendeci uyumluluk belgeleri: paketleme spesifikasyonu, barkod, etiketleme'
        - Önde gelen perakendeci sipariş sistemleri için EDI/ASN entegrasyonu
        - Tedarikçi yönetimli stok ve otomatik yenileme programları
        - 24 saat yanıt SLA ile özel hesap yönetimi
