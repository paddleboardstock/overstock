benefits:
  - title: Doğrudan Üreticiye Erişim
    description: Aracı yok. Her ürünü tasarlayan, mühendislik yapan ve üreten fabrika ile doğrudan çalışırsınız.
    icon: tabler:building-factory
  - title: Rekabetçi Kar Marjları
