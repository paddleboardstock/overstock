reasons:
  tagline: Aquafarer Farkı
  title: Bizi Farklı Kılan
  isBeforeContent: false
  columns: 3
  items:
    - title: Gerçek Üretim, Ticaret Değil
      description: 12.000 m²’lik bir fabrikaya sahibiz ve işletiyoruz. Aquafarer ile ortak olduğunuzda, ürünlerinizi tasarlayan, mühendislik yapan ve üreten kişilerle doğrudan çalışırsınız — aracı yok.
      icon: tabler:building-factory
    - title: Mühendislik Odaklı Yaklaşım
      description: Tasarım sürecimiz ürün kategorisi ile değil, kullanım durumuyla başlar. Ekipmanın ticari ortamlarda nasıl kullanılacağını optimize etmek için gövde şekli, malzeme seçimi ve konfigürasyonunu iyileştiriyoruz.
      icon: tabler:engine
    - title: Sertifikalı Kalite
      description: CE sertifikalı, ISO kalite sistemi, BSCI uygun, REACH uygun, USCG Tip III/V onaylı can yelekleri; tüm ürünler geçerli uluslararası standartlara uygundur.
      icon: tabler:certificate
    - title: Esnek OEM/ODM
      description: Tüp renkleri, konsol düzeni, markalama, ambalaj — taleplerinize göre özelleştiriyoruz. Minimum sipariş zorunluluğu yok. Bir prototiple başlayın, güvenle ölçeklendirin.
      icon: tabler:adjustments
    - title: Global Lojistik
      description: Kaliforniya'da ABD deposu, Qingdao'dan doğrudan sevkiyat, acil siparişler için hava kargo. Gümrük işlemleri ve evrak işlerini dünya çapında biz üstleniyoruz.
      icon: tabler:truck-delivery
    - title: Ömür Boyu Destek
      description: 20 yıl önce ürettiğimiz tekneleri destekliyoruz. Orijinal yedek parçalar, teknik tavsiye, tamir rehberi — ekibimiz ihtiyaç duyduğunuzda, nerede olursanız olun yanınızda.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dünya Çapında Markalar Tarafından Güvenilen
  title: Ortaklarımızın Söyledikleri
  items:
    - content: Çin’de birkaç üreticiyle çalıştık, ama Aquafarer mühendislik desteği ve istikrarlı kalite açısından öne çıkıyor. Markamıza kendi markaları gibi değer veriyorlar.
      name: — OEM Ortak, Avrupa Su Sporları Markası
    - content: Hypalon RIBs ürünleri, filomuzda 5 yıldan fazla hizmette. Minimum bakım, mükemmel UV direnci. Tüplerde 5 yıl garanti bize güven veriyor.
      name: — Filonun İşleticisi, Orta Doğu Tatil Köyü Grubu
    - content: Aquafarer ekibi, özel bir SUP board tasarımını konseptten üretime 90 günde geliştirmemize yardımcı oldu. Kalite beklentilerimizin ötesindeydi.
      name: — Distribütör, Avustralya Su Sporları
    - content: Küçük bir işletme sahibi olarak MOQs konusunda endişeliydim. Aquafarer bütçemle çalıştı ve sadece 50 board ile markamı başlatmamı sağladı. Şimdi 500 sipariş ediyorum.
      name: — Marka Kurucusu, ABD SUP Kiralama Şirketi
cta:
  title: Su işinizi kurmaya hazır mısınız?
  subtitle: Ücretsiz danışma için ekibimizle iletişime geçin. Taahhüt yok — sadece ekipman ve üretim konusunda dürüst tavsiye.
  actions:
    - variant: primary
      text: Ekibimizle konuşun
      href: /contact
    - text: Ürün kataloğunu indirin
      href: /resources
