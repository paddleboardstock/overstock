hero:
  tagline: Neden Aquafarer
  title: Farklı İnşa Edildi. İş İçin İnşa Edildi.<br />Dünya Çapında Su Maceralarının Arkasındaki Ortak
  subtitle: Sadece bir üretici değil — kulüpler, tatil köyleri, kiralama operatörleri ve gelişmekte olan su markaları için ticari sınıf ekipman tasarlayan, mühendislik yapan ve teslim eden bir iş ortağı.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer üretim kalitesi ve uzmanlığı
pillars:
  tagline: Ortaklığın Üç Temeli
  title: Dünyanın Su İşletmeleri Neden Aquafarer Seçiyor
  subtitle: ''
  columns: 3
  items:
    - title: Ticari Kullanım İçin Tasarlandı
      description: Ekipmanlarımız hafta sonu eğlencesi için değil, günlük kiralama için üretilmiştir. Ticari sınıf PVC, takviye drop-stitch çekirdekler, UV-kararlı Hypalon seçenekler ve saha testli donanım; düşük bakım, uzun ömür ve operasyonunuz için daha yüksek ROI anlamına gelir.
      icon: tabler:building-factory
      callToAction:
        text: Ticari ürün serisini görün
        href: /products
    - title: Fikirden Pazara
      description: 'Su sporları markanızı 90 günde başlatın. Her adımda sizi yönlendiriyoruz: kavram doğrulama, ürün seçimi, prototip, üretim, ambalaj tasarımı ve global nakliye. Minimum sipariş zorunluluğu yok — küçük başlayın, güvenle büyütün.'
      icon: tabler:rocket
      callToAction:
        text: Marka yolculuğunuza başlayın
        href: /oem-odm-blueprint
    - title: Küresel Koşullar İçin İnşa Edildi
      description: 'Ürünler her iklim için optimize edilmiştir: Avrupa için soğuk su PVC formülasyonları, Orta Doğu ve Avustralya için UV-dayanıklı malzemeler, Güneydoğu Asya için nem önleyici işlemler. Her sevkiyat, hedef ortamına uygun şekilde kalibre edilir.'
      icon: tabler:world
