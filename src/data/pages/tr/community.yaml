stories:
  tagline: Kaşif Hikayeleri
  title: Gerçek insanlardan gerçek maceralar
  subtitle: Suda Aquafarer ekipmanını kullanan kürekçilerin, ailelerin ve profesyonellerin deneyimlerini dinleyin.
  items:
    - name: Sarah ve Mike
      title: SUP Explorer 11 sahipleri, Kanada
      content: Explorer 11'lerimizi Algonquin Parkı'nda bir haftalık bir geziye çıkardık. Portajlar ve göl geçişlerini harika bir şekilde hallettiler. drop-stitch yapısı sayesinde 15 PSI basabiliyor ve katlanabilir bir tahtadan sert tahta performansı alabiliyorduk.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Çita Surge sürücüsü, İspanya
      content: Cheetah Surge, kıyı turları için benim favorim. Canlı tasarımı plajda dikkat çekiyor ve dengesi hafif dalgalarda bana güven veriyor. Tur yapıyor olsam da sadece gün batımının tadını çıkarıyor olsam da mükemmel bir şekilde idare ediyor.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, İspanya
    - name: Lina ve aile
      title: Akan Lotus kürekçileri, İsveç
      content: Takımadadaki hafta sonu aile maceraları. Flowing Lotus, ben kürek çekerken kızımın üzerinde durabilecek kadar sağlam. 10 dakikadan kısa sürede şişiyor — römork gerek yok, sadece suda saf aile eğlencesi.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholm Takımadaları, İsveç
    - name: Yardımcı Komutan Andres
      title: Okyanus Kaşifi gezgini, Filipinler
      content: Ocean Voyager'ımı Palawan çevresinde uzun mesafeli kıyı turları için kullanıyorum. Tropikal koşullarda aylardır günlük kullanımın ardından bile, board hâlâ yeniymiş gibi performans gösteriyor. Touring şekli, daha az kaliteli boardları durduracak dalgalardan kolayca geçiyor.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipinler
    - name: Emma T.
      title: Tropical Breeze ilk defa deneyen, Avustralya
      content: Daha önce hiç SUP üzerinde bulunmamıştım. Tropical Breeze o kadar stabildi ki ilk denememde kendimi güvende hissettim. Şimdi her hafta sonu kürek çekiyorum. Öğrenme eğrisi neredeyse sıfır — ve tahta su üzerinde müthiş görünüyor.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Avustralya
