hero:
  tagline: Bilgi Grafiği
  title: Su Keşif Bilgisi
  subtitle: |
    Şişirilebilir SUP teknolojisini kapsayan yapılandırılmış bir bilgi tabanı,<br />
    su güvenliği, board mühendisliği ve macera planlaması.
  taglineSection: Keşfet. Öğren. Güvenle git.
clusters:
  tagline: Bilgi Kümeleri
  title: Konuya göre keşfet
  subtitle: Her Paddle Board Overstock ürününün arkasındaki teknoloji, güvenlik ve becerilere derinlemesine dalış.
  items:
    - title: SUP Bilgisi
      description: İlk boardunuzu seçmekten gelişmiş tur tekniklerine kadar — ayakta kürek sörfü hakkında her şey.
      icon: tabler:lifebuoy
      topics:
        - İlk şişme SUP nasıl seçilir
        - Yeni başlayanlar için en iyi SUP boyutu
        - Paddle sörfü ne kadar zor?
        - Şişme ve sert tahta karşılaştırması
        - SUP güvenlik kontrol listesi
    - title: Board Teknolojisi
      description: drop-stitch çekirdekler, PVC lamine, kenarlar ve valfler hakkında teknik detaylar — şişme SUPs nasıl tasarlanır.
      icon: tabler:anchor
      topics:
        - Şişme SUPs nasıl yapılır
        - PVC lamine katmanlar açıklaması
        - Kenarlık ve dikiş yapısı
        - Drop-stitch teknoloji derinlemesine inceleme
        - EVA üst yüzey tasarımı açıklaması
    - title: Güvenlik Bilgisi
      description: Her kürekçi için temel güvenlik bilgisi — PFD seçimi, hava durumu okuma ve kendini kurtarma tekniklerinden.
      icon: tabler:shield
      topics:
        - SUP güvenlik kontrol listesi
        - Bir can yeleğine ihtiyacın var mı?
        - Okyanus kürek çekme güvenlik rehberi
        - Kürekçiler için nehir ve akıntı güvenliği
        - Hava ve su koşulları farkındalığı
    - title: Teknoloji
      description: Paddle Board Overstock ürünlerinin mühendisliği — malzemeler, üretim yöntemleri ve kalite testleri.
      icon: tabler:microscope
      topics:
        - Deniz Kuvvetleri PVC seviyesindeki teknoloji
        - Drop-stitch Core açıklama
        - PSI Şişme SUPsiçin neden önemlidir
        - RF kaynak vs yapıştırıcı yapıştırma
        - Her tahtada kalite testi
    - title: Kulüp ve Kiralama Bilgisi
      description: Bir SUP programı yürütmek için pratik rehberler — kiralama işlemlerinden tatil köyü ve kulüp filolarına kadar.
      icon: tabler:briefcase
      topics:
        - Kiralama işine nasıl başlanılır SUP
        - Bir tatil köyü su sporları merkezi inşa etmek
        - Kulüpler için paddle board filosu boyutları
        - Şişirilebilir ve ticari kullanım için sert mu SUP
        - Kiralama filoları için en iyi SUP tahtalar
        - Tatil köyü su sporları gelir stratejileri
        - Ticari ekipman bakım rehberi
