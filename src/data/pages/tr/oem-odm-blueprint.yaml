process_steps:
  title: 6 Adım OEM/ODM Süreci
  subtitle: Tasarım brifinginden FOB Qingdao’ya kadar — optimize edilmiş iş akışı
  steps:
    - number: '01'
      title: Tasarım Brifingi & 3D CAD Modelleme
      description: Hedef özelliklerinizi, referans ürününüzü veya konseptinizi paylaşın. Mühendislik ekibimiz, onayınız için detaylı CAD çizimleri ve 3D görselleştirmeler geliştirir.
      timeline: 3–5 gün
    - number: '02'
      title: Malzeme Seçimi & Kumaş Testi
      description: Askeri sınıf PVC (0.9–1.2 mm), Hypalon CSM veya drop-stitch çekirdek kumaşlardan seçin. Çekme dayanımı, kaplama yapışması ve UV stabilite testlerini gerçekleştiriyoruz.
      timeline: 2–3 gün
    - number: '03'
      title: Hızlı Prototipleme & Örnek Üretimi
      description: Özel kalıpları CNC-makine ile üretir ve marka renkleriniz, logonuz ve belirtilen malzemelerle ön üretim örnekleri oluştururuz. Onayınız için örnekler gönderilir.
      timeline: 7–14 gün
    - number: '04'
      title: 24–48 Saat Yüksek Basınç Dayanım Testi
      description: Her prototip, belirlenen basıncın 1.25 katı ile titiz basınç tutma testine tabi tutulur. Dikiş ayrılma testleri ve boyutsal doğrulamalar yapılır.
      timeline: 1–2 gün
    - number: '05'
      title: CE/ISO Kalite Kontrol & Ambalaj
      description: 100 maddelik kalite kontrol listesi. Her bir birim, perakende ambalajına hazır hale gelmeden önce incelenir. CE uygum beyanı ve BSCI uyum raporu dahildir.
      timeline: 2–3 gün
    - number: '06'
      title: FOB Qingdao Nakliye & Lojistik
      description: Bitmiş ürünler paletlenir, streçlenir ve Qingdao limanında konteynere yüklenir. Tam ihracat belgeleri, gümrük işlemleri ve gerçek zamanlı takip.
      timeline: 7–14 gün
