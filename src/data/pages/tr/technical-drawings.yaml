hero:
  tagline: Teknik Çizimler ve CAD
  title: RIB ve Şişme Bot<br />Teknik Çizimler ve CAD İndirmeleri
  subtitle: Proje değerlendirmesi ve spesifikasyon için planlama seviyesi GA çizimleri, boyut tabloları ve güverte düzenleri. Teknik çizimlere doğru seviyede erişim — halka açık PDF'lerden proje seviyesi STEP dosyalarına kadar.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB bot teknik çizimleri ve CAD indirmeleri
direct_answer: Paddle Board Overstock, RIB botları ve şişme su taşıtları için satın alma seviyesi teknik çizimler sağlar — genel düzen (GA) PDF'leri, boyut tabloları ve güverte düzen çizimleri dahil. Daha yüksek detaylı formatlar (DXF/DWG, STEP/IGES) uygun başvuru veya proje talebinde bulunulduğunda mevcuttur.
