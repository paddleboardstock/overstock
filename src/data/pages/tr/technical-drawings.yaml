content_version_control:
  tagline: Sürüm Kontrolü
  title: Çizim Sürümü<br />Yönetimi
  subtitle: Her çizim kontrollü bir revizyon sistemiyle takip edilir. Çizimleri proje planlamasında kullanmadan önce her zaman güncel revizyonu kontrol edin.
  items:
    - title: Revizyon Takibi
      description: Her çizim bir revizyon kodu (Rev-A, Rev-B, Rev-C), yayın tarihi, son gözden geçirme tarihi, geçerli model/konfigürasyon, birimler, dosya boyutu ve format içerir. Sadece "Güncel" revizyon indirilebilir durumdadır.
      icon: tabler:git-branch
    - title: Çizim Durum Bildirimi
      description: Tüm halka açık çizimler "Sadece ön tasarım — inşaat, sertifikasyon veya üretim için kullanılmaz. Ölçüler nihai spesifikasyon ve sipariş onayına tabidir." olarak işaretlenmiştir. Bu, her iki tarafı yanlış kullanımdan korur.
      icon: tabler:alert-circle
    - title: Güncelleme Bildirimleri
      description: Bir model spesifikasyonu değiştiğinde, çizim revizyonu güncellenir ve önceki sürümler "Geçersiz" olarak işaretlenir. DXF/DWG paketlerini indiren kayıtlı kullanıcılar önemli güncellemelerden e-posta ile haberdar edilir.
      icon: tabler:bell
faq:
  title: Teknik Çizimler — Sık Sorulan Sorular
  questions:
    - q: GA PDF'leri gerçekten ücretsiz mi?
      a: Evet. Ana modellerimizin genel yerleşim PDF'leri ücretsizdir — aşağıdaki kısa uygunluk formunu doldurun, indirme bağlantısı 1 iş günü içinde e-posta ile iletilir. PDF'ler, proje değerlendirmesi, alan tahsisi ve ön spesifikasyon incelemesi için yeterli planlama düzeyinde bilgi içerir.
    - q: DXF/DWG dosyalarına nasıl erişebilirim?
      a: İndirme sayfasındaki kısa uygunluk formunu şirket adı, proje türü ve kullanım amacı ile doldurun. Onaylanan talepler 1 iş günü içinde e-posta ile indirme bağlantısı alır.
    - q: STEP/IGES 3D modellerini alabilir miyim?
      a: STEP veya IGES 3D model dosyaları proje başvuru sürecimiz aracılığıyla sunulmaktadır. Proje kapsamınızı, entegrasyon gereksinimlerinizi, zamanlamanızı ve satın alma niyetinizi sağlayın. Onaya tabidir — genellikle 3-5 iş günü içinde.
    - q: Neden yüksek detaylı dosyalara erişimi kısıtlıyorsunuz?
      a: Gövde geometrisi, kalıp verileri ve yapısal hesaplamalar yılların AR-GE yatırımını temsil eder ve temel üretim IP'sidir. Tedarik planlaması ve proje entegrasyonu için gereken her şeyi sağlarken, yeni ürün geliştirmeye yatırım yapma yeteneğimizi koruyoruz.
    - q: Çizimler üretim detaylarını içeriyor mu?
      a: Hayır. Kamuya açık ve hafif biçimli çizimler, planlama ve spesifikasyon için tedarik düzeyinde bilgi içerir. Üretim detayı (lamine programları, takım yolları, kesim genişlemeleri) yalnızca NDA ile onaylanmış siparişler ile paylaşılır.
    - q: Çizimler özel veya yarı-özel RIB konfigürasyonları için mevcut mu?
      a: Özel proje çizimleri OEM/ODM geliştirme sürecinin bir parçası olarak hazırlanır. Özel bir RIB projesini değerlendiriyorsanız, gereksinimlerinizi bize bildirin ve teklif kapsamında proje özel GA çizimlerini sağlayacağız.
