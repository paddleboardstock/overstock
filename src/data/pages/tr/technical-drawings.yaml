content_tiers:
  tagline: İndirme Kademeleri
  title: Dört Erişim Seviyesi<br />— Doğru Aşama İçin Doğru Detay
  subtitle: Biz üretim seviyesi dosyalar değil, satın alma seviyesi çizimler sağlıyoruz. Her kademe farklı bir proje aşamasına uygundur.
  items:
    - title: Kademe 1 — Genel PDF
      description: Genel düzen (GA), 4 görünüm boyut çizimi ve PDF formatında güverte düzeni. Ücretsiz indirme için mevcut. Proje planlaması, alan tahsisi ve ön spesifikasyon incelemesi için yeterlidir.
      icon: tabler:file-type-pdf
    - title: Kademe 2 — Hafif Form DXF/DWG
      description: Planlama seviyesi düzen entegrasyonu için 2D CAD dosyaları (DXF veya DWG). Kısa bir uygunluk formu (şirket adı, proje türü, amaçlanan kullanım) gerektirir. Yapısal veya üretim verisi içermez.
      icon: tabler:file-code
    - title: Kademe 3 — Proje Başvurusu STEP/IGES
      description: Sistem entegrasyonu, teçhizat tasarımı veya denizcilik mimarisi koordinasyonu için 3B model dosyaları (STEP veya IGES). Kapsam, zaman çizelgesi ve satın alma niyetini içeren proje başvurusu gerektirir. Onaya tabidir.
      icon: tabler:cube
    - title: Kademe 4 — NDA Mühendislik
      description: Gövde yapısal çizimleri, laminasyon çizelgeleri, tüp kesim genişlemeleri ve kalıp verileri. Yalnızca onaylanmış siparişlerle NDA altında mevcuttur. Bunlar üretim seviyesi dosyalardır — halka dağıtım için değildir.
      icon: tabler:lock
content_included:
  tagline: Neler Dahil
  title: Çizim İçeriği<br />Model Başına
  subtitle: Her model, B2B alıcıları ve proje mühendisleri için gerekli planlama bilgilerini kapsayan standart bir çizim paketine sahiptir.
  items:
    - title: Genel Düzenleme (GA)
      description: Yan görünüş, üstten görünüş ve gövde formunu, tüp konumunu, konsol yerini, oturma düzenini, yakıt sistemini ve ana boyutları (LOA, genişlik, tüp çapı, deadrise açısı) gösteren enine kesit. Revizyon durumu ve telif hakkı başlık bloğunda belirtilmiştir.
      icon: tabler:layout
    - title: 4 Görünümlü Boyut Çizimi
      description: Nakliye planlaması için genel boyutlarla yan, ön, arka ve üst görünümler (römorkta yükseklik, konteyner için en, kaldırma için ağırlık). Operasyonel ve taşıma konfigürasyonlarını içerir.
      icon: tabler:ruler-2
    - title: Güverte Düzeni ve Ekipman Planı
      description: Konsol tabanı, koltuk pozisyonları, D-halkası konumları, navigasyon ışığı konumları, cenaze pompası erişimi, akü/yakıt bölmesi ve ekipman montaj noktalarını gösteren üstten güverte görünümü. Tescilli arayüzlerde sınırlı hassasiyet.
      icon: tabler:map
    - title: Taşıma ve Ambalaj Çizimi
      description: Lojistik planlaması için konteyner yükleme planı, beşik boyutları, ağırlık dağılımı ve kaldırma noktası konumları. Standart ve özel ambalaj seçeneklerini içerir.
      icon: tabler:truck
content_protection:
  tagline: IP Koruması
  title: Paylaşmadıklarımız<br />& Neden
  subtitle: Mühendislik fikri mülkiyetimizi korumak, alıcıların proje planlaması için gereken her şeyi sağlarken Ar-Ge'ye yatırım yapmaya devam edebilmemizi garanti eder.
  items:
    - title: Gövde Kalıp Çekirdek Verisi
      description: Kalıp ve kalıp geometrisi, CNC takım yolları ve lamine şablonları, özel üretim varlıklarıdır. Onaylanmış NDA sözleşmelerinin dışında hiçbir erişim düzeyinde paylaşılmazlar.
      icon: tabler:ban
    - title: Boru Kesme Genişletmeleri
      description: Tüp kumaş için düz desen kesim dosyaları üretim düzeyi verilerdir. Sadece NDA altında, onaylı üretim siparişleri ile mevcut olup yalnızca sözleşme tarafıyla paylaşılır.
      icon: tabler:ban
    - title: Yapısal Hesaplamalar
      description: Detaylı gerilme analizi, FEA sonuçları ve laminat çizelgeleri, uygunluk değerlendirme süreci sırasında yalnızca Bildirilen Kurumlar ve NDA ile sınırlı müşterilerle paylaşılan uyumluluk hassasiyeti olan belgelerdir.
      icon: tabler:ban
    - title: Rakip Tarama
      description: CAD erişim taleplerini, rakiplerden, proje bağlamı olmayan öğrencilerden veya geçerli satın alma niyeti bulunmayan taraflardan geldiği görünen durumlarda reddetme hakkını saklı tutarız.
      icon: tabler:shield
content_models:
  tagline: Mevcut Modeller
  title: Teknik Çizim<br />Model Bazında Mevcudiyet
  subtitle: GA PDF indirmeleri, ana RIB ve şişme bot modellerimiz için mevcuttur. Listelenmeyen belirli model çizimleri için bizimle iletişime geçin.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, GRP deep-V gövde, Hypalon veya PVC tüpler, orta konsol. GA, boyutlar, güverte düzeni ve taşıma planı mevcuttur. Tasarım Kategorisi C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP orta V gövde, Hypalon veya PVC tüpler, yan veya orta konsol. Genel düzen ve boyutlar mevcut. Tasarım Kategorisi C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP gövde, PVC tüpler, dümen veya konsol. Genel düzen ve boyutlar mevcut. Tasarım Kategorisi C/D.
      icon: tabler:sailboat
    - title: AF380 Şişme Bot
      description: 3,8 m şişme bot, alüminyum taban, PVC tüpler. Genel düzen ve paket boyutları mevcut. EN ISO 6185 uyumlu.
      icon: tabler:sailboat
    - title: AF320 Şişme Bot
      description: 3,2 m şişme bot, hava tabanlı döşeme, PVC tüpler. Genel düzen ve paket boyutları mevcut. EN ISO 6185 uyumlu.
      icon: tabler:sailboat
