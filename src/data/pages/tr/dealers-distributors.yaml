content_benefits:
  tagline: Ortaklık Faydaları
  title: Distribütörler için Neden<br />Paddle Board Overstock seçin
  subtitle: Güvenilir tedarik, rekabetçi marjlar ve profesyonel destek ihtiyacı olan denizcilik distribütörleri için tasarlanmış bir ortaklık.
  items:
    - title: Bölge Koruması
      description: Nitelikli distribütörler için münhasır veya yarı-münhasır bölge hakları. Bölge haritalaması ve kanal çatışması yönetimi, Paddle Board Overstock markasını kendi bölgenizde inşa etme yatırımınızı korur.
      icon: tabler:map-pin
    - title: Rekabetçi Toptan Fiyatlandırma
      description: Yıllık hacim taahhütlerine dayalı kademeli fiyatlandırma. Önceden fiyat garantileri ve şeffaf maliyet dökümü ile marj korumalı fiyat yapılandırması (FOB Qingdao bazında).
      icon: tabler:currency-dollar
    - title: Pazarlama Destek Kiti
      description: Profesyonel ürün fotoğrafçılığı, teknik özellik sayfaları, uyum belgeleri şablonları, sosyal medya içerikleri ve ortak markalı pazarlama materyalleri. Yeni ürün lansmanlarıyla her yıl güncellenir.
      icon: tabler:photo
    - title: Teknik Eğitim
      description: Satış ekibiniz için ürün eğitimi (sanal veya yerinde), servis teknisyenleri için bakım ve onarım eğitimi ve müşteriyle ilgili SSS ve sorun giderme kılavuzları.
      icon: tabler:school
    - title: Yedek Parça ve Satış Sonrası
      description: Öncelikli nakliye ile özel yedek parça tedariki. Hızlı sipariş karşılaması için değiştirilebilir tüp bölümleri, vanalar, kanatlar ve onarım kitleri. Garanti talepleri işlem desteği.
      icon: tabler:tool
    - title: Uyum Belgeleri
      description: 'Pazarınız için tam uyum belgeleri paketi: CE DoC, üretici levhası verileri, kullanıcı kılavuzları ve düzenleyici kayıt desteği. Uyumluluk yükümlülüğünüzü ortadan kaldırır.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Aradığımız Şey
  title: Distribütör<br />Gereksinimler
  subtitle: Bölgelerinde Paddle Board Overstock ürünlerini profesyonel bir şekilde temsil edebilecek ve destekleyebilecek ortaklar arıyoruz.
  items:
    - title: Bölge ve Pazar Bilgisi
      description: Denizcilik, su sporları veya açık hava rekreasyonu pazarında yerleşik bir varlık. Su aracı ürünleri için yerel düzenlemeler, tüketici tercihleri ve dağıtım kanalları konusunda anlayış.
      icon: tabler:target
    - title: Sektör Deneyimi
      description: Deniz, açık hava veya spor ekipmanları dağıtımında en az 2 yıl deneyim. Uluslararası markalar ve B2B toptan operasyonlarda kanıtlanmış başarı geçmişi.
      icon: tabler:briefcase
    - title: Showroom veya Depo
      description: Ürün sergileme, stok depolama ve müşteri hizmetleri için fiziksel tesis. Bölgeniz için demo birimleri ve yedek parça stokunu sürdürme yeteneği.
      icon: tabler:building-store
    - title: Marka Standartlarına Bağlılık
      description: Paddle Board Overstock marka sunum standartlarını sürdürme, hizmet protokollerimize uygun olarak müşteri desteği sağlama ve yıllık ürün eğitimi güncellemelerine katılma istekliliği.
      icon: tabler:star
content_process:
  tagline: Başvuru Süreci
  title: 4 Adımlı Satıcı<br />Başvuru Süreci
  subtitle: İlk sorudan ilk sevkiyata kadar — basit bir işe alım süreci.
  steps:
    - number: '01'
      title: İlk Sorgulama ve Nitelendirme
      description: Distribütör başvurunuzu şirket bilgileri, ilgi alanı bölgesi, mevcut ürün hattınız ve yıllık hacim tahminlerinizle birlikte gönderin. Başvurunuz 5 iş günü içinde incelenir.
      timeline: 5 gün
    - number: '02'
      title: İş İncelemesi ve Şartlar
      description: Bölge stratejisi, fiyatlandırma kademeleri ve ortaklık koşullarını görüşmek için sanal toplantı. Pazarınız için uyumluluk belgeleri gerekliliklerini gözden geçirin. NDA gerekirse imzalama.
      timeline: 1-2 hafta
    - number: '03'
      title: Örnek Sipariş ve Değerlendirme
      description: Pazar değerlendirmesi ve ekip eğitimi için distribütör fiyatıyla ilk örnek siparişi (2-5 birim) verin. Tam uyum belgeleri ve demo hazırlığı dahildir.
      timeline: 30-45 gün
    - number: '04'
      title: Ortaklık Başlatma ve Destek
      description: Bölge koruması etkinleştirilmiş ilk konteyner siparişi. Pazarlama kiti teslim edildi, satış ekibi eğitildi ve özel hesap yöneticisi atandı. Devam eden üç aylık iş değerlendirmeleri.
      timeline: Sürekli
content_application_docs:
  tagline: Başvuru Belgeleri
  title: Gerekli Belgeler<br />Bayi Başvurusu için
  subtitle: Bir Paddle Board Overstock bayiliği için başvurmak üzere, lütfen inceleme ekibimiz için aşağıdaki belgeleri ve bilgileri hazırlayın.
  items:
    - title: İşletme Kayıt Sertifikası
      description: Yasal kişi adını, kayıtlı adresini ve deniz, spor veya açık hava ekipmanları dağıtımını kapsayan iş alanını gösteren geçerli şirket kayıt belgesi.
      icon: tabler:file-text
    - title: Bölge Kapsam Planı
      description: İlgilenilen coğrafi bölge, mevcut perakende veya dağıtım ağı, hedef müşteri segmentleri ve ürün kategorisine göre önerilen yıllık hacim (RIB, SUP, kano).
      icon: tabler:map
    - title: Showroom veya Depo Kapasitesi
      description: Ürün sergileme, envanter depolama ve müşteri hizmetleri için fiziksel tesis. Demo alanı ve yedek parça depolama kapasitesini gösteren fotoğraflar veya kat planları.
      icon: tabler:building
    - title: Finansal Yeterlilik Beyanı
      description: 'İlk konteyner siparişini verme ve envanteri sürdürme yeteneğini doğrulayan banka referansı veya mali tablo. Minimum ilk sipariş: bir 20ft konteyner (10-20 adet karışık modeller).'
      icon: tabler:coin
    - title: Satış Sonrası Destek Kapasitesi
      description: Şişme bot bakımı ve onarımı için eğitimli veya eğitilebilir servis teknisyenleri. Garanti talebi işleme kapasitesi ve yedek parça stok taahhüdü.
      icon: tabler:tool
    - title: Önceki Marka Referansları
      description: Dağıtımı yapılan mevcut veya önceki deniz/spor ekipman markalarının listesi. Karşılıklı anlaşma ile iletişim referansları sağlanabilir. Önceki dağıtım deneyimi olmayan girişimler, daha güçlü finansal taahhütle nitelikli olabilir.
      icon: tabler:users
faq:
  title: Bayilik Programı — Sık Sorulan Sorular
  questions:
    - q: Distribütörler için minimum sipariş miktarı nedir?
      a: Distribütör MOQ siparişi, karışık modeller için esneklikle 10-20 adetle başlar (RIB, şişme, SUP). Pazar değerlendirmesi için 2-5 adetlik başlangıç numune siparişleri distribütör fiyatıyla mevcuttur.
    - q: Ayrıcalıklı bölge hakları sunuyor musunuz?
      a: Ayrıcalıklı bölge hakları, yıllık hacim taahhütlerini yerine getiren ve marka standartlarını koruyan nitelikli distribütörler için geçerlidir. Yarı ayrıcalıklı ve ayrıcalıksız düzenlemeler de gelişen pazarlar için mevcuttur.
    - q: Hangi pazarlama desteğini sağlıyorsunuz?
      a: Profesyonel ürün fotoğrafçılığı, teknik spesifikasyon belgeleri, uyumluluk dokümantasyonu şablonları, sosyal medya içerik kütüphanesi ve ortak markalı malzemeleri içeren kapsamlı bir pazarlama kiti sağlar. Yeni ürün lansmanları ile her yıl güncellenir.
    - q: Garanti talepleri nasıl işlenir?
      a: 'Distribütörler, garanti taleplerinde ilk iletişim noktası olarak hizmet verir. Net garanti kriterleri, fotoğraf belgeleme protokolleri ve hızlı değişim veya kredi işleme sağlıyoruz. Garanti koşulları: tekne tüp kumaşı/dikişler/gövde için 5 yıl sınırlı; SUP ve aksesuarlar için 2 yıl.'
    - q: Paddle Board Overstock ürünlerini kendi markam altında özel etiketli yapabilir miyim?
      a: Evet, OEM/ODM programımız aracılığıyla. Özel etiket seçenekleri, özel tüp grafikleri, konsol markalama, perakende ambalaj ve uyumluluk dokümantasyonunu kendi marka adınız altında içerir. Ayrıntılar için OEM/ODM hizmetler sayfamıza bakınız.
    - q: Distribütörler için hangi uyumluluk dokümantasyonu dahil?
      a: Her gönderim, model özel CE DoC, üretici plakası verileri, kullanım kılavuzları ve gönderi belgelerini içerir. Ayrıca bölgenizde düzenleyici kayıt desteği ve yerel uyumluluk gereklilikleri konusunda yardımcı oluruz.
