features3_cases:
  tagline: Öne Çıkan Vakalar
  title: Özel Çözümler<br />Gerçek Zorluklar İçin
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali Dalış Merkezi Günlük Operasyon Yükseltmesi
      customer: Mavi Okyanus Dalış Merkezi
      country: Endonezya
      industry: Ticari Dalış Merkezi
      challenge: Bali'deki Blue Ocean Diving Center, sınırlı güverte alanı, zorlu dalgıç binişi ve tropikal tuzlu su koşullarında yüksek bakım gerektiren eski bir fiberglas dalış teknesi işletiyordu. Ekipman yükleme yoğundu, hazırlık süresi uzundu ve dengesiz platform, ilk kez dalış yapanlar ve yaşlı yolcular dahil olmak üzere uluslararası turistler için güvenlik endişeleri yarattı. Merkez, yılda 200 gün, günde 3-5 dalış turu+ düzenliyor.
      solution: Aquafarer RIB Dalış ekipmanı depolama için optimize edilmiş genişletilmiş güverte düzeni, geniş paslanmaz çelik dalış merdiveni, ağır hizmet Hypalon UV tüpleri ve tuzlu su direnci, kaymaz güverte yüzeyi ve tank depolama çözümüne sahip özel 6.8m Profesyonel Dalış sağladı. Konfigürasyon, dalış merkezi günlük iş akışına göre tasarlandı — standart bir rekreasyon tekne düzenine dayanmamıştı.
      product: 6.8m Profesyonel Dalış RIB
      results: Daha büyük çalışma alanı ekipman hazırlama verimliliğini artırdı. Dalgıçlar daha güvenli ve kolay biniş deneyimledi. Bakım gereksinimleri önemli ölçüde azaldı. Merkez, yoğun sezonlarda daha fazla müşteriyi daha güvenle karşılayacak kapasite kazandı. Bu, RIB günlük dalış operasyonlarının temelini oluşturdu.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Dalış teknemiz sadece ulaşım değil. Günlük operasyonumuzun temelidir.Aquafarer RIB Ekibimize her gün birden fazla dalış gezisi düzenlerken daha fazla özgüven kazandırır.
      icon: tabler:lifebuoy
    - title: Phuket Dalış Merkezi Profesyonel RIB Yükseltmesi
      customer: Okyanus Keşif Dalış Merkezi
      country: Tayland
      industry: Ticari Dalış Merkezi
      challenge: Tayland'ın Phuket kentindeki Ocean Explorer Diving Center, artan müşteri talebine yetişemeyen geleneksel bir fiberglas dalış teknesinden yükseltmek zorundaydı. Sınırlı güverte alanı, ekipman hazırlığını verimsiz hale getirdi. Zorlu binişler, uluslararası turistler için güvenlik sorunları yarattı. Tropikal tuzlu su koşullarında yüksek bakım gereksinimleri işletme maliyetlerini artırdı. Merkez, yılda 200 gün olmak üzere birden fazla günlük yolculuk+ gerçekleştirmektedir.
      solution: Aquafarer RIB dalış tankı depolama, ekipman hazırlığı ve dalgıç hareketi için optimize edilmiş çalışma güverte düzenine sahip özelleştirilmiş 6,8m Ticari Dalış teslim etti. Özellikler arasında paslanmaz çelik tutamaçlarlı geniş dalış merdiveni, dayanıklı malzemelerle ağır hizmet boru yapısıUV, kaymayan zemin, tank depolama çözümü, profesyonel konsol ve yolcu koltukları yer alıyordu — hepsi ticari dalış operasyonları için konfigürasyonda.
      product: 6.8m Ticari Dalış RIB
      results: Daha büyük güverte alanı, ekipman organizasyonunu hızlandırdı ve günlük iş akışını daha verimli hale getirdi. Müşteri biniş konforu ve güvenliği önemli ölçüde arttı. Bakım kesintisi deniz seviyesindeki inşaatlarla azaldı. Dalış merkezi, yoğun sezonda daha fazla müşteriye hizmet verebilir ve profesyonel dalış hizmetlerini güvenle genişletebilirdi.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Bir dalış merkezi için tekne sadece ulaşım değil. Günlük operasyonumuzun önemli bir parçasıdır.Aquafarer RIB Ekibimize her gün birden fazla dalış gezisi yapma güveni ve daha iyi güvenlik ve verimlilikle gerçekleştirme güveni verir.
      icon: tabler:lifebuoy
    - title: Avrupa Dalış Merkezi Filosu
      customer: BlueMed Dalış Merkezleri
      country: Yunanistan
      industry: Dalış ve Deniz Turizmi
      challenge: Birden fazla Yunan adasında dalış merkezleri zinciri için 12 dalış yapılandırılması RIBs gerekiyordu. Her teknenin özel dalış merdivenesi, 8 tank için depo ve açık su dalgıcı girişi için stabil platformu gerekiyordu. Filo, turizm sezonunun başlaması için 60 gün içinde varmalıydı.
      solution: RIB Entegre tank rafları, dalış merdivenleri ve biniş stabilitesi için ekstra geniş tüplerle 12 adet 520 Dive modeli Hypalon üretildi. Her tekne müşteri filosu renkleriyle markalandı. Tüm 12 tekne basınçtan test edilip 55 gün içinde Qingdao'dan gönderildi.
      product: RIB 520 Dalış
      results: Tüm 12 tekne, turistik sezon için zamanında teslim edildi. Filo 18+ aydır günlük operasyonlarda ve hiç malzeme arızası yaşanmadı. Müşteri, ikinci yılda 6 ek ünite sipariş etti.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 Dalış, günlük dalış operasyonlarımızın bel kemiği oldu. Dinlenme sırasında stabilite mükemmel, tank depolama düzeni ise güverteyi misafirlerimiz için temiz ve güvenli tutuyor.
      icon: tabler:lifebuoy
    - title: Avustralya Dağıtıcı OEM Programı
      customer: Pasifik Su Sporları Pty Ltd
      country: Avustralya
      industry: OEM/ODM Üretim
      challenge: Avustralyalı dağıtıcı, SUP Çin doğrudan tüketici markalarıyla rekabet edebilmek için rekabetçi fiyatlarla özel etiketli karton serisine ihtiyaç duyuyordu. Başlangıçtan ileri seviyeye kadar olan 8 benzersiz model, özel grafikler, özel paketleme ve perakende mağazalara teslimat ile birlikte kullanılıyordu.
      solution: 8 SUP model geliştirdi (Overall-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) ve özel Avustralya grafik paketiyle birlikte. Kurulum videolarına bağlantı veren QR kodlu özel perakende paketleme. Qingdao'dan doğrudan Avustralya perakende mağazalarına yönlendirilmiş drop-ship lojisiği.
      product: Custom SUP Line (8 model)
      results: Konsept 90 gün içinde ilk sevkiyata kadar. İlk sezonda perakende satış oranı %85. Dağıtıcı, ikinci yılda şişme bot hattını da dahil ederek ortaklığı genişletti.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: İlk Aquafarer SUP tasarımdan perakende katına kadar tam bir ürün ürün yelpazesini 90 günde teslim etti. Kalite, iki kat fiyat fiyatıyla satan markalarla eşleşiyor.
      icon: tabler:arrows-exchange
    - title: Orta Doğu Kurtarma Botu Temalı
      customer: Ulusal Sivil Savunma Otoritesi
      country: Birleşik Arap Emirlikleri
      industry: Arama ve Kurtarma
      challenge: Sivil savunma organizasyonu, RIBs kıyı arama ve kurtarma, liman güvenliği ve sel müdahalesi için 20 devriye hazır personele ihtiyaç duyuyordu. Kendi kendine bayılan güverteler, tam navigasyon süitleri (GPS, radar, VHF), yüksek görünürlüklü turuncu tüpler ve yerel denizcilik düzenlemelerine uyum gerekiyordu.
      solution: 20 adet RIB 450 Patrol modeli, kendi kendine bayılan güverteler, Garmin navigasyon suitleri, LED arama lambaları, SOLAS yansıtıcı bant ve yüksek görünür turuncu Hypalon tüplerle tedarik edildi. Her tekne CE6185 standartlarına göre sertifikalandırıldı ve test edildi ISO . Dokümantasyon paketi yerel kayıt için uyumluluk sertifikalarını içeriyordu.
      product: RIB 450 Devriyesi
      results: Filo, 5 kıyı istasyonuna konuşlandırıldı. Tekneler, aşırı sıcakta (45°C+) boru bozulması olmadan faaliyet gösterdi. Devriye menzili ve yakıt verimliliği spetikleri %12 oranında aştı.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450 Devriyesi, operasyonel gereksinimlerimizi aştı. Aşırı sıcak koşullarda, Hypalon tüpler UV 24 aylık günlük kullanımdan sonra bozulma belirtisi göstermiyor.
      icon: tabler:alert-triangle
    - title: Avrupa OEM Marka Ortaklığı
      customer: Kuzey Denizi Deniz Ekipmanları BV
      country: Hollanda
      industry: OEM/ODM Üretim
      challenge: Köklü Avrupa denizcilik markası, RIB üretim tesislerine yatırım yapmadan pazara girmek istiyordu. RIB Özel markalama, CE sertifika ve münhasır AB dağıtım haklarıyla 5 model (3,9 milyon ila 6,2 milyon) üretebilen beyaz etiketli bir ortağa ihtiyaç duyuyordu.
      solution: 5 model için beyaz etiketli üretim anlaşması RIB kuruldu. Her model müşteri logosu ve renk şemasıyla markalandı.CE Her model için hazırlanmış sertifikasyon belgeleri. Minimum sipariş taahhütleriyle verilen münhasır AB dağıtım hakları. Yerel servis ağı için teknik dokümantasyon ve yedek parça kataloğu sağlandı.
      product: Custom RIB Line (5 model)
      results: Çok yıllık anlaşma imzalandı. İlk üretim 50 adet 75 gün içinde gönderildi. Marka, METSTRADE'de olumlu bayi tepkisiyle piyasaya sürüldü.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Çalışmak, Aquafarer RIB fabrika inşa etmeden piyasaya girmemizi sağladı — CE sertifika ve bayi destek belgeleriyle birlikte tam bir anahtar teslim çözümleri sundular.
      icon: tabler:building
    - title: Karayip Tatil Köyü Filosu
      customer: Paradise Adası Tatil Merkezleri Ltd
      country: Bahamalar
      industry: Deniz Turizmi ve Konaklama
      challenge: 'Lüks tatil köyünün, misafir aktiviteleri için tam bir su sporu ekipman filosuna ihtiyaç duyuyordu: SUP rehberli turlar için 40 tahta, lagün keşfi için 20 kayak, misafir transferleri ve balık tutma gezileri için 10 şişme tekne, ayrıca aksesuarlar. Tüm ekipmanların özel tatil köyü markası gerektiriyordu ve turistik sezonun zirvesinden önce teslim edilmesi gerekiyordu.'
      solution: "Tam su sporları paketi üretildi: 40 SUP Voyager tahtası (Genel model), 20 Explorer kayak, 10 AirDeck adet 360 şişme bot, ayrıca PFD'ler, kürekler, pompalar ve tamir kitleri. Tüm ekipmanlar tatil köyü logosu ve tropikal renk şemasıyla basılmış. Konteynerli sevkiyat ve tam envanter manifestosu ile birlikte."
      product: Tam Su Sporları Paketi (70+ birim)
      results: Filo, zirve sezonundan 6 hafta önce geldi. Su sporları etkinliklerindeki misafir memnuniyeti puanları yıllık bazda %40 arttı. Ekipman, sadece rutin bakım ile 3 sezon dayandı.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Tam paket yaklaşımı, ihtiyacınız olan her şeyi tek bir sevkiyatla aldık — tahtalar, kayaklar, tekneler ve aksesuarlar, hepsi markalı ve misafir kullanımına hazır. Misafirlerimiz ekipman kalitesini çok seviyor.
      icon: tabler:beach
    - title: Queensland Ticari Dalış Merkezi RIB Yükseltmesi
      customer: Ticari Dalış Merkezi
      country: Avustralya
      industry: Ticari Dalış ve Denizcilik Hizmetleri
      challenge: Queensland merkezli bir ticari dalış merkezi, deniz altyapısı denetimi, liman bakımı ve su altı onarım projelerinde uzmanlaşmış, yaşlanan bir iş teknesi işletiyordu. Proje talebi arttıkça, eski gemi bir yük haline geldi — sık bakım programlama aksaklıklarına yol açtı, düzen modern dalış operasyonları için tasarlanmamıştı (silindirler, aletler ve ekipman için sınırlı alan) ve uzun operasyonlarda mürettebat konforu zayıftı. Şirket, profesyonel operasyonlarını her iş günü destekleyebilecek bir gemiye ihtiyaç duyuyordu.
      solution: Aquafarer müşteri dalış iş akışının, tipik proje süresinin, mürettebat büyüklüğünün ve ekipman gereksinimlerinin ayrıntılı bir operasyonel analizini gerçekleştirdi. Bu analize dayanarak, Aquafarer RIB ekipman hazırlığı ve dalgıç hareketi için optimize edilmiş fonksiyonel güverte düzeni, daha uzun taşıma süreleri için profesyonel oturmalar, daha güvenli dalgıç giriş ve çıkış için gelişmiş stabilite ve tasarıma entegre dalış destek özelliklerine sahip özel bir profesyonel teslim edildi.
      product: Özel Profesyonel Dalış RIB
      results: Yeni platform RIB , güvenilir bir günlük çalışma platformu haline geldi. Ekipman hazırlığı, optimize edilmiş yerleşimle daha hızlı hale geldi. Mürettebat, uzun operasyonlarda konfor ve güvenliğin arttığını bildirdi. Teknenin profesyonel görünümü, liman operatörleri ve deniz müteahhitleriyle çalışırken müşteri güvenini güçlendirdi. Dalış merkezi, hizmetlerinin profesyonelliğine uygun bir gemi kazandı.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: İşimizi her gün destekleyebilecek bir tekneye ihtiyacımız vardı, sadece bir ulaşım aracı değil. Aquafarer, operasyonel gereksinimlerimizi anlamak için bizimle çalıştı ve ticari dalış iş akışımıza uygun bir RIB çözümü sundu.
      icon: tabler:lifebuoy
    - title: ABD Kıyı Devriyesi Sözleşmesi
      customer: Atlantik Kıyı Güvenlik Ajansı
      country: Amerika Birleşik Devletleri
      industry: Deniz Güvenliği ve Kanun Uygulama
      challenge: ABD kıyı güvenlik ajansı, açık deniz yakalama operasyonları için ağır hizmet devriye RIBs ihtiyacı duydu. Yedeklilik için çift motor konfigürasyonu, mürettebat koruması için zırhlı konsol, askeri standartlarda elektronikler (şifreli iletişim, FLIR, radar) ve ABD Sahil Güvenlik yönetmeliklerine uyum gerekmekteydi.
      solution: Çift 115 HP dıştan takma motor konfigürasyonlu RIB 600 Devriye tasarlandı, balistik korumalı zırhlı konsol, FLIR termal görüntüleme, şifreli VHF/UHF iletişim ve entegre silah montaj noktaları sağlandı. Gövde yüksek hızlı yakalama manevraları için güçlendirildi. Tüm elektronik sistemler fabrikada entegre edildi ve test edildi. USCG uyumluluk belgeleri sağlandı.
      product: RIB 600 Devriye (Çift Motor)
      results: Kabul testleri sırasında tekneler 52 knot maksimum hıza ulaştı. Ajans, ilk 12 ayda %95 görev hazır olma oranı bildirdi. Ek olarak 8 birimlik sipariş verildi.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Çift motorlu RIB 600, mürettebatımıza açık deniz yakalama operasyonları için gerekli hız ve yedekliliği sağlar. Zırhlı konsol, performanstan ödün vermeden kritik koruma sağlar.
      icon: tabler:shield
