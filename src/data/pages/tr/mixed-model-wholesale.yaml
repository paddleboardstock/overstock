who_benefits:
  tagline: Kimler Yararlanabilir
  title: Karışık Model Toptanı Kimler İçindir
  items:
    - title: İlk Kez İthalat Yapanlar
      description: Tek bir toplu SKU yerine, bir dizi modelle SUP kategorisini test etmek isteyenler.
    - title: Mevsimlik Plaj Perakendecileri
      description: Hem turistler için başlangıç seviyesinde, hem de yerel halk için premium sürümler gerektiren mağazalar — aynı yeniden stok siparişinde.
    - title: Çevrimiçi Satıcılar
      description: Hangi tasarımın, uzunluğun ve kullanım amacının en iyi dönüşüm sağladığını öğrenmek için birden fazla modeli aynı anda listelemek.
    - title: Kiralanma Filoları ve Okullar
      description: Farklı sürücü ağırlıkları ve ders türleri için çeşitli board boyutlarına ihtiyaç duyan filolar, tek tip filolar değil.
faq_section:
  title: Karışık Model SSS
  items:
    - q: Her model için minimum miktar var mı?
      a: Hayır. 5 board minimumu toplam sipariş için geçerlidir, her model için değil. 5 farklı model sipariş edebilir, her modelden birer tane alabilirsiniz.
    - q: Karışık modeller fiyatı değiştirir mi?
      a: Toptan birim fiyatları model başına verilir, ancak toplam board sayısına göre fiyat kademeniz iyileşir — karışık modeller sizi cezalandırmaz.
    - q: Board ve aksesuarları karıştırabilir miyim?
      a: Evet — yedek kürekler, pompalar ve onarım kitleri karışık bir siparişe eklenebilir. Talebinizde sorabilirsiniz.
    - q: Hangi modellerin pazarım için uygun olduğunu nasıl bilirim?
      a: Müşterileriniz (kıyı veya iç bölgeler, turistler veya yerel halk, başlangıç seviyesinde veya sürücüler) hakkında bir notu talep formunda gönderin, biz de bir karışım önereceğiz.
