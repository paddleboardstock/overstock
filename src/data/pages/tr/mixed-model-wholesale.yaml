hero:
  tagline: Karma Model Toptan Satış
  title: Karma Model Toptan Paddle Boardlar —<br />Farklı SUP modelleri tek sırayla karıştırın
  subtitle: Bütçenizi neden tek bir modele kilitleyesiniz? Stoktaki tüm SUP boardları — genel seyahat, tur, surf ve sanat sürümleri — tek bir toptan siparişte birleştirin, toplamda 5 board kadar düşük bir sipariş verebilirsiniz.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Farklı şişme SUP karton modelleri Paddle Board Overstock
direct_answer: Karma model toptan satış, küçük bir perakendecinin tek bir panodan toplu miktarda değil, tek bir konsolide gönderide birden fazla farklı model sipariş etmesini SUP sağlar. Paddle Board Overstock Fiyatta, stokta bulunan herhangi bir model birleştirilebilir, sipariş minimum toplam 5 kart olur ve toplam miktar fiyatlandırma seviyesini belirler. Karma siparişler Weihai, Çin'den ekspres hava yükü (1–3 kart) veya konsolide deniz yükü (5–20 kart) ile 50+ ülkeye gönderilir ve her kart %100 baskı testinden geçer ve 2 Yıllık SUP Garanti kapsamındadır.
tldr_points:
  - Stoktaki modelleri SUP tek bir sırayla karıştırın — model başına minimum ücret yok
  - Toplam sipariş miktarı (model başına miktar değil) fiyatlandırma katmanınızı belirler
  - Toplamda 5 karttan başlayın — küçük perakendeciler için tasarlanmış, konteyner yükleri için değil
  - 'Bir konsolide sevkiyat: bir nakliye maliyeti, bir gümrük kontrolü, bir teslimat'
why_mixed:
  tagline: Neden karışık?
  title: Karıştır ve Eşleştir. Daha Çok Çeşitlilik Satın Alın. Daha Az Harcama.
  subtitle: Aynı tahta rafı tek bir kürek çeşidine hizmet eder. Karışık sipariş aynı bütçeyi tam bir ürün serisine dönüştürür.
  items:
    - title: Rafınızda Daha Çok Çeşitlilik
      description: Yeni başlayanlar için çok yönlü tahtaları, maceracılar için tur tahtalarını ve biniciler için sörf tarzı tahtaları birleştirin — tek sipariş tüm müşteri yelpazesinizi kapsar.
    - title: Model Başına Daha Düşük Risk
      description: Sezonunuzu bir modele bahis yapmak yerine, her modelden 2–4 tane sipariş edin. Bir model diğerlerinden fazla satarsa, sonraki siparişi gerçek satış verileriyle stoklayın.
    - title: Pazarınızda Ne Sattığını Test Edin
      description: Her plaj, göl ve şehir farklı talebe sahiptir. Karışık birinci sipariş en ucuz piyasa araştırmasıdır — altı model stoklayın, hangilerinin hareket ettiğini görün.
    - title: Sanat Baskılarında Daha İyi Kenar Ayırt
      description: Premium sanat serisi panoları (Leviathan Wake, Medusa Glow, Ocean Voyager) daha yüksek perakende satışları sunar. Ortalama kârınızı artırmak için birkaç tanesini genel tahta tabanına karıştırın.
    - title: Bir Konsolide Sevkiyat
      description: Bir karışık sipariş, beş ayrı tedarikçiden beş ayrı sevkiyat yerine, bir yük rezervasyonu, bir gümrük kontrolü ve bir teslimat anlamına geliyor.
how_it_works:
  tagline: Nasıl Çalışır
  title: Karma Model Siparişi Nasıl İşler Sağlar
  steps:
    - title: Karışımını Seç
      description: Pazarınız için modelleri ve miktarları seçin — veya aşağıdaki seçici bölümünü kullanarak bir kombinasyon taslağını hazırlayın ve pano sayısı ile toplam değer güncellemesini canlı izleyin.
    - title: Fiyat Teklifi İste
      description: Bize karışımı gönderin. Her model ve teklif birim fiyatları ile ülkenize ekspres ve deniz taşımacılığı seçenekleri için mevcut stokları onaylıyoruz.
    - title: Emri Onayla
      description: Son teklifi onaylayın — modeller, miktarlar, yük, toplam. Stokları kilitliyoruz ve Weihai'den gönderi planlıyoruz.
    - title: Her tahtayı test ediyoruz
      description: Karışık siparişinizdeki her kart, paketlenmeden önce %100 basınç testinden 15'e kadar PSI test ediliyor — her model için aynı standart, ister giriş genel modeli ister sanat sürümü olsun.
    - title: Kapınıza bir teslimat
      description: Tam karma sipariş birlikte — küçük siparişler için ekspres hava, 5–20 gemi için konsolide deniz yükü — kapıdan kapıya takip ile birlikte gönderilir.
