hero:
  tagline: Yetki Merkezi
  title: Neden Aquafarer?<br />On Yıllık Güven
  subtitle: İnşa ettiğimiz her tekne, 10+ yıllık deniz mühendisliği, sertifikalı kalite sistemleri ve dünya çapında binlerce başarılı operasyonun ağırlığını taşır. Bu yüzden sektör profesyonelleri Aquafarer'i tercih ediyor.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer deniz üretim tesisi ve mühendislik ekibi
stats:
  title: Aquafarer Sayılarla
  stats:
    - title: Faaliyet Yılları
      amount: 2012'den Beri
    - title: Ar-Ge Mühendisleri
      amount: 50+
    - title: Hizmet Verilen Ülkeler
      amount: 50+
    - title: Teslim Edilen Ekipman
      amount: 15,000+
features3_brand:
  tagline: Biz Kimiz
  title: Marka Temeli<br />& Miras
  subtitle: Aquafarer'ü güvenilir bir deniz ekipmanları üreticisi olarak tanımlayan hikaye, uzmanlık ve küresel erişim.
  isBeforeContent: false
  columns: 3
  items:
    - title: Aquafarer Hakkında
      description: 2012 yılında Çin, Qingdao'da kuruldu. Kıyıdaki bir atölyeden 12.000 m²'lik tesise kadar — tam Aquafarer hikayesi.
      icon: tabler:building-factory
      link: /about
    - title: Marka Hikayesi
      description: Bir grup deniz mühendisi, profesyonel sınıf şişme su araçlarını dünya çapında erişilebilir kılmak için nasıl yola çıktı.
      icon: tabler:book
      link: /brand-story
    - title: Denizcilik Endüstrisi Uzmanlığı
      description: Derin malzeme bilimi, hassas üretim ve gerçek dünya testleri — her gövdede onlarca yıllık deniz mühendisliği.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Küresel Varlık
      description: Her kıtada 50+ ülkeye hizmet veriyor. Yerel düzenleme gereksinimleri ve pazar tercihleri için bölgesel uzmanlık.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Neden Aquafarer
      description: Bizi farklı kılan — kalite, özelleştirme, doğrudan fabrika fiyatlandırması ve ticari operatörler için uçtan uca destek.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Ekibimiz
      description: Liderliği tanıyın — Aquafarer'yi ileriye taşıyan deniz mühendisleri, malzeme bilimcileri ve üretim uzmanları.
      icon: tabler:users
      link: /brand/team
    - title: Mühendislik Ekibi
      description: 78+ birleşik Ar-Ge yılı, 40+ platform, 12 sertifika, 1200+ OEM projesi. Her ürünün arkasındaki teknik ekip.
      icon: tabler:engine
      link: /engineering-team
    - title: Ar-Ge Merkezi
      description: Gövde mühendisliği, RF kaynak, PVC laboratuvarı, prototip üretimi, test tankı ve kalite laboratuvarı — tam araştırma ve geliştirme tesisimiz.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Güven & Kalite
  title: Sertifikalar, Kalite<br />& Kanıt
  subtitle: Bağımsız sertifikalar, titiz testler ve kaliteye olan bağlılığımızı gösteren gerçek kanıtlar.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifikalar
      description: CE, ISO 9001, UKCA, BSCI, REACH — küresel pazarlar için tam sertifika dokümantasyonu ve uyumluluk.
      icon: tabler:shield-check
      link: /certifications
    - title: Kalite & Test
      description: Her ürün sevk edilmeden önce basınç testinden geçer. Dikiş dayanıklılığı, UV direnci, yüzdürme — her aşamada doğrulanır.
      icon: tabler:clipboard-check
      link: /quality
    - title: Kanıt & Delil
      description: Test sonuçları, kurulum fotoğrafları, üçüncü taraf denetim raporları ve Aquafarer kalitesini doğrulayan vaka incelemeleri.
      icon: tabler:file-check
      link: /evidence
    - title: Bilgi Grafiği
      description: Aquafarer varlık grafiğini keşfedin — ürünler, teknolojiler, sertifikalar ve bağlantılı bilgi tabanında ilişkiler.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderlik
  title: Ekibi Tanıyın<br />Aquafarer Arkasında
  subtitle: Deniz mühendisliği, malzeme bilimi, kalite yönetimi ve küresel B2B ticaretini kapsayan endüstri uzmanlığı.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Kurucu & CEO
      description: Deniz üretiminde 15+ yıl. Daha önce büyük bir Çinli tekne üreticisinde Ar-Ge'yi yönetti. Şişme tekne tasarımında birden fazla patente sahip.
      icon: tabler:crown
    - title: Zhang Wei — Baş Mühendis
      description: PVC/Hypalon üretimi ve derin V gövde tasarımında 20+ yıl. Avrupa'da bir deniz mühendisliği firmasında eski teknik direktör.
      icon: tabler:engine
    - title: Chen Ming — Ar-Ge Müdürü
      description: Malzeme Bilimi alanında Doktora. drop-stitch teknolojisi ve yüksek frekans kaynağı konusunda uzman. Tekstil kompozitlerinde 10+ yıl deneyim.
      icon: tabler:flask
    - title: Liu Qiang — Üretim Direktörü
      description: Yalın üretimde 18+ yıl. Six Sigma Siyah Kuşak. Tüm üretim hatlarında ISO 9001 kalite sistemlerini uyguladı.
      icon: tabler:settings
    - title: Wang Fang — Kalite Müdürü
      description: Deniz kalite kontrolünde 12+ yıl. Sertifikalı CE ve ISO denetçi. Her üretim partisinin testlerini denetler.
      icon: tabler:shield-check
    - title: Helen Lee — Satış Direktörü
      description: Uluslararası B2B ticaretinde 15+ yıl. OEM/ODM ortaklıkları 30+ ülkede yönetti. 4 dilde akıcı.
      icon: tabler:briefcase
cta:
  title: Referanslarımızı doğrulamak ister misiniz?
  subtitle: Sertifika kopyaları, üçüncü taraf denetim raporları için veya fabrika ziyareti planlamak için bizimle iletişime geçin.
  actions:
    - variant: primary
      text: Kimlik bilgilerini talep edin
      href: /contact
    - text: Sertifika detaylarını görüntüleyin
      href: /certifications
