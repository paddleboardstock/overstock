hero:
  tagline: Yetki Merkezi
  title: Neden Paddle Board Overstock?<br />On Yıllık Güven
  subtitle: Yaptığımız her tahta, 10+ yıllık deniz mühendisliği, titiz kalite kontrolü ve dünya çapında binlerce kürekçinin ağırlığını taşıyor. Bu yüzden kürekçiler Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock deniz üretim tesisi ve mühendislik ekibi
stats:
  title: Paddle Board Overstock Sayılarla
  stats:
    - title: Faaliyet Yılları
      amount: 2012’den beri
    - title: Ar-Ge Mühendisleri
      amount: 14+
    - title: Hizmet Verilen Ülkeler
      amount: 50+
    - title: Yıllık Üretilen Birimler
      amount: 15,000+
features3_brand:
  tagline: Biz Kimiz
  title: Marka Temeli<br />& Miras
  subtitle: Paddle Board Overstock Güvenilir bir marka olarak tanımlanan hikaye, uzmanlık ve küresel erişim SUP .
  isBeforeContent: false
  columns: 3
  items:
    - title: Paddle Board Overstock Hakkında
      description: 2012 yılında Çin'in Weihai şehrinde kuruldu. Sahil atölyesinden 12.000 m²'lik tesise — Paddle Board Overstock hikayesinin tamamı.
      icon: tabler:building-factory
      link: /about
    - title: Marka Hikayesi
      description: Bir deniz mühendisi ekibinin, profesyonel seviyede şişme paddle boardları dünya çapında erişilebilir hale getirmeye nasıl karar verdiği.
      icon: tabler:book
      link: /brand-story
    - title: Denizcilik Endüstrisi Uzmanlığı
      description: Derin malzeme bilimi, hassas üretim ve gerçek dünya testleri — her kartta onlarca yıllık deniz mühendisliği.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Neden Paddle Board Overstock
      description: Bizi farklı kılan şey — kalite, özelleştirme, doğrudan fabrika fiyatlandırması ve her kürekçi için uçtan uca destek.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Ekibimiz
      description: Liderlik ekibiyle tanışın — Paddle Board Overstock'yi ileriye taşıyan deniz mühendisleri, malzeme bilimcileri ve üretim uzmanları.
      icon: tabler:users
      link: /brand/team
    - title: Mühendislik Ekibi
      description: 78+ toplam Ar-Ge yılı, 40+ platform, 1.200+ mühendislik projesi. Her ürünün arkasındaki teknik ekip.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Güven & Kalite
  title: Kalite, Test<br />& Kanıt
  subtitle: Titiz testler, gerçek test verileri ve kaliteye olan bağlılığımızı gösteren kanıtlar.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kalite & Test
      description: Her ürün sevk edilmeden önce basınç testinden geçer. Dikiş dayanıklılığı, UV direnci, yüzdürme — her aşamada doğrulanır.
      icon: tabler:clipboard-check
      link: /quality
    - title: Kanıt & Delil
      description: Test sonuçları, kurulum fotoğrafları, üçüncü taraf denetim raporları ve Paddle Board Overstock kalitesini doğrulayan vaka çalışmaları.
      icon: tabler:file-check
      link: /evidence
    - title: Bilgi Grafiği
      description: Paddle Board Overstock Varlık grafiğini keşfedin — ürünler, teknolojiler, malzemeler ve ilişkiler bağlantılı bir bilgi tabanında.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Liderlik
  title: Ekibi Tanıyın<br />Paddle Board Overstock arkasında
  subtitle: Deniz mühendisliği, malzeme bilimi, kalite yönetimi ve küresel e-ticareti kapsayan sektör uzmanlığı.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Kurucu & CEO
      description: Denizcilik üretiminde 15+ yıl. Önceden büyük bir Çinli denizcilik üreticisinde Ar-Ge'yi yönetti. Şişme ürün tasarımında birden fazla patente sahip.
      icon: tabler:crown
    - title: Zhang Wei — Baş Mühendis
      description: Polimer imalatı ve şişme yapı tasarımında 20+ yıl deneyim. Eski teknik direktör, bir Avrupa deniz mühendisliği firmasında.
      icon: tabler:engine
    - title: Chen Ming — Ar-Ge Müdürü
      description: Malzeme Bilimi alanında Doktora. drop-stitch teknolojisi ve yüksek frekans kaynağı konusunda uzman. Tekstil kompozitlerinde 10+ yıl deneyim.
      icon: tabler:flask
    - title: Liu Qiang — Üretim Direktörü
      description: 18+ yıl boyunca yalın üretimde. Tüm üretim hatlarında titiz kalite sistemleri uyguladı.
      icon: tabler:settings
    - title: Wang Fang — Kalite Müdürü
      description: 12+ yıl denizcilik kalite kontrolü. İç kalite denetimlerini yönetiyor. Her üretim partisi için testleri denetliyor.
      icon: tabler:shield-check
    - title: Helen Lee — Satış Direktörü
      description: 15+ yıl uluslararası e-ticaret ve lojistik deneyimi. 50+ ülkeye kürek tahtası gönderiyor. 4 dilde akıcı.
      icon: tabler:briefcase
cta:
  title: Kalitemizin kanıtı mı istiyorsunuz?
  subtitle: Test raporları, denetim kayıtları veya fabrika ziyareti planlamak için bizimle iletişime geçin.
  actions:
    - variant: primary
      text: Dokümantasyon isteyin
      href: /contact
