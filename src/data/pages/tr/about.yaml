hero:
  tagline: Hakkımızda
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer fabrika ve atölye
  title: |
    Deniz mühendisliği<br />
    inşa etti<span class="text-accent dark:text-white">Aquafarer</span>yol
  subtitle: "Bir sahil atölyesinde bir tekne ve inatçı bir inançla başladık: deniz ürünleri önem taşıyormuş gibi tasarlanmalı, çünkü gerçekten önemlidir. Bugün 50'den fazla ülkeye gönderim yapıyoruz, ama her gövde hâlâ şirketi başlatan aynı ellerden geçiyor."
stats:
  title: Rakamlarla
  columns: 4
  stats:
    - title: Gövde teslim edildi
      amount: 2,400+
    - title: Ülkeler gönderdi
      amount: 50+
    - title: Yılların birleşik deneyimi
      amount: '60'
    - title: Ortalama garanti yanıt süresi (saat)
      amount: '24'
features3_what_we_build:
  title: Ne inşa ediyoruz
  subtitle: İçini tamamen bildiğimiz odaklanmış bir ürün serisi — yarım kalmış deneyler yok, rozet mühendisliği yok.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB tekneler
      description: Alüminyum gövde RIBs 3,3 m'den 7,5 m'ye kadar. Devriye, dalış, balıkçılık ve aile kullanımı için tasarlandı.
      icon: tabler:ship
    - title: Şişme botlar
      description: PVC ve Hypalon şişme botlar, 2.4 m'den 4.2 m'ye kadar. Hafif, dayanıklı ve kolay saklanabilir.
      icon: tabler:speedboat
    - title: Süperyat deniz taksileri
      description: Kompakt, yüksek özellikli RIBs ana batıza uyacak şekilde özel olarak üretilmiştir.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksesuarlar
      description: Kürekler, pompalar, kapaklar, kuru çantalar, yakıt tankları ve elektronikler. Hepsi teknelerimize uygun.
      icon: tabler:package
    - title: Yeniden donatma ve onarım
      description: Kendi bünyesinde tüp değişimi, elektronik yükseltme ve motor geliştirmeleri.
      icon: tabler:tool
    - title: Özel yapımlar
      description: Ticari, bilimsel ve askeri müşteriler için proje bazlı tasarım.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Tekne tasarımı ve mühendislik tartışması
steps2_values:
  title: Değerlerimiz
  subtitle: İlk günden beri her ürünü şekillendiren üç ilke.
  items:
    - title: Ailenizi taşır gibi inşa edin
      description: Her gövde, kaynak ve bağlantı elemanı sanki kendi ailemiz kullanacakmış gibi muamele görüyor.
      icon: tabler:heart
    - title: Satış yapmadan önce mühendislik
      description: Bir spesifikasyon yanlışsa, spesifikasyonu değiştiririz — asla müşteriyi değiştirmeyiz.
      icon: tabler:settings
    - title: Garanti süresinden uzun süren destek
      description: Yirmi yaşındaki gövdeler bile yedek parça için bizi arıyor ve biz hâlâ yanıtlıyoruz.
      icon: tabler:headset
steps2_milestones:
  title: Dönüm Noktaları
  subtitle: Aquafarer hikâyesinin kısa bir versiyonu.
  isReversed: true
  items:
    - title: Kıyı atölyesinde kuruldu
      description: İki deniz mimarı tarafından bir CNC değirmeni ve inatçı bir fikir ile başlatıldı.
      icon: tabler:building-factory
    - title: İlk 1.000 gövde teslim edildi
      description: Yedinci yılımızda ulaşıldı, çoğunlukla ağızdan ağıza ve tekrar eden müşteriler sayesinde.
      icon: tabler:circle-check
    - title: Uluslararası ihracat programı
      description: Şimdi 50+ ülkeye sevkiyat yapılıyor ve beş kıtada yerel destek ortaklarımız var.
      icon: tabler:world
    - title: Yeni global işletme yapısı
      description: Eylül 2026'da marka operasyonları Qingdao Vatrad Grubu'ndan Aquafarer LLC (New Mexico, ABD)'ye taşındı; Qingdao üretim merkezi Ar-Ge, üretim ve fabrika direkt ihracatı sürdürmeye devam ediyor.
      icon: tabler:building-skyscraper
features2_locations:
  title: Lokasyonlarımız
  tagline: Bizi bulun
  columns: 3
  items:
    - title: Merkez ve atölye
      description: Kıyı sanayi parkı, bina 4 — ziyaretler için Pazartesi–Cuma randevuyla açıktır.
    - title: AB servis merkezi
      description: Akdeniz limanı — Avrupa müşterilerine yeniden donatma, onarım ve garanti desteği.
    - title: APAC ortak ağı
      description: Avustralya, Japonya, Singapur ve Hong Kong'da yetkili servis ortakları.
brand_hub_tagline: Marka
brand_hub_title: Markamızı Keşfedin
brand_hub_subtitle: Deniz mühendisliği uzmanlığımızı, global varlığımızı ve bizi yönlendiren prensipleri daha derinlemesine inceleyin.
brand_hub_cards:
  - title: Deniz Uzmanlığı
    desc: Malzeme bilimi, hassas üretim ve gerçek dünya testlerini içeren onlarca yıl deneyim — PVC/Hypalon imalatından derin-V gövde tasarımı ve drop-stitch teknolojisine.
    link: /brand-marine-expertise
    link_label: Daha fazla bilgi edinin →
  - title: Global Varlık
    desc: Avrupa, Asya-Pasifik ve Amerika genelinde yetkili hizmet ortaklarımız ile Qingdao tesisimizden 50+ ülkeye gönderim.
    link: /brand-global-presence
    link_label: Daha fazla bilgi edinin →
  - title: Neden Aquafarer
    desc: Dikey entegrasyon, çift sertifikasyon (ISO 9001 + BSCI), CE uyumu ve düşük MOQs — markalar, distribütörler ve devlet kurumları için tasarlandı.
    link: /brand-why-aquafarer
    link_label: Daha fazla bilgi edinin →
production_section:
  tagline: Üretim Mükemmelliği
  title: Muhteşem İşçilik Sağlamak
  description: Aquafarer üretim hattı, yüksek kaliteli, dayanıklı ve yüksek performanslı şişme bot ürünleri üretmeye adanmıştır.
  cards:
    - title: Deneyimli Teknisyen Ekibi
      items:
        - PVC, Hypalon ve deniz malzemeleri konusunda profesyonel bilgi
        - Kesme, birleştirme ve aksesuar kurulumu konusunda hassas işçilik
        - En son üretim teknolojilerini ustalıkla kullanabilmek için sürekli eğitim
    - title: Gelişmiş Üretim Ekipmanı
      items:
        - CNC minimum hata ile kumaş kesimi için hassas kesim ekipmanı
        - Hava geçirmez ve dayanıklı dikişler için yüksek hassasiyetli ısı/soğuk yapıştırma
        - Profesyonel hava geçirmezlik ve çekme test ekipmanı
    - title: Olgun Yönetim Sistemi
      items:
        - Belirgin kalite standartlarına sahip standartlaştırılmış üretim süreçleri
        - Atıkı azaltan ve verimliliği artıran yalın üretim felsefesi
        - Güvenilir tedarikçi ortaklıklarıyla verimli tedarik zinciri yönetimi
    - title: Sıkı Kalite Kontrolü
      items:
        - sertifikalı kalite yönetim sistemi
        - 'Çok aşamalı denetim: ham madde, işlem sırasında, nihai çıkan'
        - Gönderim öncesi sıkı hava geçirmezlik ve dayanıklılık testi
global_ops_section:
  tagline: Küresel Operasyon Mimarisi
  title_html: Bir marka,<span class="text-white/90">iki merkez</span>
  description_html: Eylül 2026'dan bu yana, Aquafarer tarafından işletilmektedir<strong class="text-white">Aquafarer Limited Şirket</strong>(New Mexico, ABD) — dağıtım, ticari B2B satışlar, sözleşmeler, faturalama ve satış sonrası için küresel varlık. AR-GE, üretim ve kalite kontrol ise<strong class="text-white">Aquafarer Qingdao Üretim Merkezi</strong>, her siparişin fabrika direkt gönderildiği FOB Qingdao. Geçiş, sözleşmenizi kimin imzaladığını değiştirdi — teknenizi kimin yaptığı değil.
  stats:
    - value: 2,400+
      label: Küresel olarak teslim edilen gövdeler
    - value: 50+
      label: İhracat yapılan ülkeler
    - value: 10+
      label: Üretim yılları
