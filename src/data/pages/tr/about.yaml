hero:
  tagline: Hakkımızda
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock fabrika ve atölye
  title: |-
    <span class="text-accent dark:text-white">Paddle Board Overstock</span>
    Hakkında
  subtitle: 2012 'den beri kendi Weihai imalatımız, küçük perakendeciler için karma model toptan satış ve dünya çapında esnek nakliye ile desteklenen aşırı stok ve gümrükleme fiyatlarında yepyeni şişirilebilir SUP panoları.
stats:
  title: Rakamlarla
  columns: 4
  stats:
    - title: Annual production capacity
      amount: 15.000 birim
    - title: Ülkeler gönderdi
      amount: 50+
    - title: Levhalar basınç testinden geçirilmiştir
      amount: 100%
    - title: Ar-Ge mühendisleri
      amount: 14+
features3_what_we_build:
  title: Ne inşa ediyoruz
  subtitle: İçini tamamen bildiğimiz odaklanmış bir ürün serisi — yarım kalmış deneyler yok, rozet mühendisliği yok.
  columns: 3
  isBeforeContent: true
  items:
    - title: Şişirilebilir SUP LEVHALARI
      description: 10' ila 12 ft arasında çok yönlü ve gezici SUP'ler Sabit, rijit ve pompa, kürek ve tasma ile tamamlanmıştır.
      icon: tabler:swimming
    - title: Sanat serisi desteleri
      description: Süper EVA güvertesi sanat eseri — Çita Dalgası, Tropikal Esinti, Medusa Parıltısı ve daha fazlası.
      icon: tabler:hexagons
    - title: Komple Paketler
      description: 'Her tahta tam bir kit olarak gönderilir: tahta, sırt çantası, pompa, kürek, yüzgeç, tasma ve tamir kiti.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksesuarlar
      description: Pompalar, kürekler, tasmalar, tamir takımları ve kuru torbalar. Hepsi panolarımızla eşleşti.
      icon: tabler:tool
    - title: Bakım ve onarım
      description: Panonuzu yıllarca suda tutmak için kurum içi onarım desteği, yedek parçalar ve bakım kılavuzu.
      icon: tabler:settings
    - title: Kulüp ve kiralık filolar
      description: Kulüpler, okullar ve kiralık filolar için doğrudan fabrika desteğiyle toplu donatım.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Levha tasarımı ve mühendislik tartışması
steps2_values:
  title: Değerlerimiz
  subtitle: İlk günden beri her ürünü şekillendiren üç ilke.
  items:
    - title: Ailenizi taşır gibi inşa edin
      description: Her tahta, dikiş ve vana kendi ailelerimiz kullanacakmış gibi muamele görür.
      icon: tabler:heart
    - title: Satış yapmadan önce mühendislik
      description: Bir spesifikasyon yanlışsa, spesifikasyonu değiştiririz — asla müşteriyi değiştirmeyiz.
      icon: tabler:settings
    - title: Garanti süresinden uzun süren destek
      description: Yıllar önce inşa ettiğimiz panolar hala bizi yedek parça için çağırıyor ve hala topluyoruz.
      icon: tabler:headset
steps2_milestones:
  title: Dönüm Noktaları
  subtitle: Paddle Board Overstock hikayesinin kısa bir versiyonu.
  isReversed: true
  items:
    - title: Weihai'de kuruldu
      description: Damla dikişli şişirilebilir SUP tahtalarına adanmış bir kıyı atölyesi.
      icon: tabler:building-factory
    - title: 12.000 m² üretim yerleşkesi
      description: RF kaynağı ve damla dikiş üretim kapasitesi ile özel bir tesise genişletildi.
      icon: tabler:circle-check
    - title: Uluslararası ihracat programı
      description: Şimdi ekspres ve deniz taşımacılığı seçenekleriyle 50 'den fazla ülkeye gönderiliyor.
      icon: tabler:world
    - title: Fazla stok ve toptan satış odağı
      description: Eylül 2026 'da marka operasyonları Qingdao Vatrad Group'tan Weihai Dongjilian Co., Ltd .' ye taşındı; Weihai üretim merkezi Ar - Ge, üretim ve fabrikadan doğrudan nakliyeye devam ediyor.
      icon: tabler:building-skyscraper
features2_locations:
  title: Lokasyonlarımız
  tagline: Bizi bulun
  columns: 3
  items:
    - title: Merkez ve atölye
      description: Kıyı sanayi parkı, bina 4 — ziyaretler için Pazartesi–Cuma randevuyla açıktır.
    - title: AB servis merkezi
      description: Akdeniz limanı — Avrupa müşterilerine yeniden donatma, onarım ve garanti desteği.
    - title: APAC ortak ağı
      description: Avustralya, Japonya, Singapur ve Hong Kong'da yetkili servis ortakları.
brand_hub_tagline: Marka
brand_hub_title: Markamızı Keşfedin
brand_hub_subtitle: Deniz mühendisliği uzmanlığımızı, global varlığımızı ve bizi yönlendiren prensipleri daha derinlemesine inceleyin.
brand_hub_cards:
  - title: Deniz Uzmanlığı
    desc: Damla dikiş çekirdeklerinden kaynaklı dikişlere ve sanat serisi destelere kadar onlarca yıllık malzeme bilimi, hassas üretim ve gerçek dünya testleri.
    link: /brand-marine-expertise
    link_label: Daha fazla bilgi edinin →
  - title: Neden Paddle Board Overstock
    desc: Fabrikada doğrudan fiyatlandırma, % 100 basınç testine tabi tutulmuş panolar ve kürekçiler, aileler ve su sporları sevenler için üretilmiş 2 yıllık garanti.
    link: /brand-why-paddleboardoverstock
    link_label: Daha fazla bilgi edinin →
