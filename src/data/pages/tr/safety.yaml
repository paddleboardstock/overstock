certifications:
  - title: CE Sertifikasyon (AB 2016/425)
    standard: PPE Yönetmeliği (AB) 2016/425 | EN ISO 12402
    description: Tüm Aquafarer güvenlik CE ekipmanları, Avrupa Kişisel Koruyucu Ekipman Yönetmeliği kapsamındaki işaretleme gerekliliklerine uygundur. Her ürün, TÜV Avrupa Bilgilendirilmiş Kurumu olan Rheinland tarafından bağımsız olarak test edilmektedir. Şişme teknelerimiz ve RIBs Rekreasyon Tekneleri Direktifi 2013/53/EU (RCD) Kategori C ve D gereksinimlerini karşılar.
    body: CE Sertifikasyon kişisel yüzme cihazları ve şişirilebilir su araçları için temel sağlık ve güvenlik gereksinimlerini kapsar.TÜV Rheinland, üretim tesisimizi yıllık olarak denetleyerek devam eden uyumu doğrulamaktadır.
  - title: SOLAS — Denizde Yaşam Güvenliği
    standard: SOLAS Bölüm III | LSA Kodu
    description: Life Vest Pro, SOLAS açık deniz ve ticari deniz operasyonları için düzenlemelere uygundur. 24 saat boyunca yüzme tutuculuğu, suya batıldığında otomatik şişirme ve deniz koşullarında Kuvvet 5'e kadar performans açısından test edilmiştir. Ticari gemilerde can yeleği için Chapter III gereksinimlerini karşılar.
    body: SOLAS onay için ise yüzdürme, güç, görünürlük ve otomatik aktivasyon için bildirimli bir kurum tarafından bağımsız test yapılmasını gerektirir. Life Vest Pro'muz, SOLAS MED sertifikası ile tam tip onayına sahiptir.
  - title: USCG Tip III / Tip V
    standard: 46 CFR Bölüm 160 |USCG Onay
    description: Seçili Aquafarer can yelekleri, Amerika Birleşik Devletleri Sahil Güvenlik tarafından Tip III (yüzme yardımı) ve Tip V (özel kullanım) cihazları için sınıflandırmaya uygundur. Korunaklı sular, kıyı seyirciliği ve USCGonaylı PFD gerektiren ticari operasyonlar için uygundur.
    body: USCG onay, CG tarafından tanınan bağımsız bir laboratuvar tarafından test yapılmasını gerektirir. Tip V onayı, manuel veya otomatik aktivasyon gerektiren hibrit şişme tasarımları içerir.
  - title: BSCI Sosyal Uyum
    standard: amfori BSCI Davranış Kuralları
    description: Fabrikamız her yıl amfori İş Sosyal Uyum Girişimi kapsamında denetlenmektedir (BSCI). Bu yöntem, 12.000 m²'lik üretim tesisimizde etik çalışma uygulamaları, işyeri güvenliği, adil çalışma saatleri ve çevre yönetimini doğrular.
    body: BSCI Uyum, Avrupa perakendecileri ve ithalatçıları için ön koşuldur. Mevcut BSCI derecelendirmemiz "C" (İyi) olup, denetim tarafından SGSyapılmıştır.
  - title: REACH & RoHS Uyum
    standard: AB REACH Yönetmeliği (EC) 1907/2006 | RoHS Direktif 2011/65/EU
    description: Tüm PVC bileşikler, yapıştırıcılar ve Aquafarer ürünlerinde kullanılan kaplamalar, AB REACH kimyasal güvenlik yönetmeliklerine ve RoHS tehlikeli madde sınırlamalarına uygundur. Her ürün hattı için Malzeme Güvenlik Bilgi Formları (MSDS) mevcuttur.
    body: REACH uyumu, eşik limitlerin üzerinde sınırlı SVHC maddesi bulunmadığını garanti eder. Düzenli üçüncü taraf laboratuvar testleri, her üretim partisi için sürekli uyumu doğrular.
  - title: ISO 9001:2015 Kalite Yönetimi
    standard: ISO 9001:2015 | TÜV Rheinland Sertifikalı
    description: Kalite yönetim sistemimiz, tasarım, üretim, test ve satış sonrası hizmetleri kapsayacak şekilde ISO 9001:2015 tarafından TÜV Rheinland tarafından sertifikalandırılmıştır. Yıllık denetimlerle sürekli iyileştirme ve süreç kontrolü sağlanmaktadır.
    body: ISO 9001 sertifikası, belgelenmiş kalite politikaları, iç denetimler, yönetim gözden geçirmeleri, düzeltici işlem prosedürleri ve izlenebilir üretim kayıtları gerektirir.
testimonial:
  quote: Güvenlik ekipmanlarını Asya’nın çeşitli tedarikçilerinden temin ettik. Aquafarer, tam CE belgeler, SOLAS sertifikalar ve üçüncü taraf test raporlarını önceden sağlayan tek üreticidir — talep edilmese bile.
  author: Erik Lindström
  title: Güvenlik Görevlisi
  company: Baltic Marine Supply
  location: Finlandiya
content_overpressure:
  tagline: Aşırı Basınç Güvenliği
  title: RIB Tüp Basıncı<br />Sıcak İklimlerde Yönetim
  subtitle: Şişirilebilir tüp basıncı sıcaklık ile artar. Aşırı basıncı anlamak ve yönetmek, hasarı önler ve tropikal ve çöl ortamlarında güvenli çalışmayı sağlar.
  items:
    - title: Boyle Basınç Tahliye Valfleri
      description: Aquafarer RIB tüpler, izin verilen maksimumun üzerindeki fazla basıncı otomatik olarak tahliye eden aşırı basınç tahliye valfleri ile donatılmıştır. Dikişlere binen stresi önler ve güneş ısısından kaynaklı potansiyel tüp patlamasını engeller.
      icon: tabler:gauge
    - title: Sabah-Öğle Arası Basınç Değişimi
      description: 20C’de 3.5 PSI şişirilen bir tüp, 40C güneş maruziyetinde 4.5 + PSI olabilir. Sıcak iklimlerde her zaman önerilen aralığın alt sınırına kadar şişirin ve fazla basıncı tahliye valfi yönetsin.
      icon: tabler:sun
    - title: Önerilen Çalışma Basınçları
      description: 'PVC tüpler: 3.0-3.5 PSI çalışma, 4.5 PSI maksimum. Hypalon tüpler: 3.5-4.0 PSI çalışma, 5.0 PSI maksimum. Her zaman 1.25x nominalde (4.4 PSI için PVC, 5.0 PSI için Hypalon) Aquafarer QC standartlarına göre test edin.'
      icon: tabler:chart-bar
    - title: Güneş Maruziyeti İçin En İyi Uygulamalar
      description: Kullanılmadığında RIBs gölgeli yerlerde saklayın. Uzun süreli bağlama için UV koruyucu örtüler kullanın. Tüp basıncını güneşin yoğun olduğu saatlerden önce ve sonra kontrol edin ve ayarlayın. Maksimum izin verilen basıncı asla aşmayın.
      icon: tabler:umbrella
    - title: Acil Basınç Boşaltma
      description: Tüp çok sert hissediyorsa veya tahliye valfi boşalıyorsa, basınç çalışma aralığına dönene kadar Halkey-Roberts veya askeri valf üzerinden havayı boşaltın. Doğru okumalar için bir basınç ölçer taşıyın.
      icon: tabler:alert-circle
