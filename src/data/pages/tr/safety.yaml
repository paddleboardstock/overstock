  title: Doğrulanmış alıcı
  company: Kıyı kürekçisi
  location: İtalya
content_overpressure:
  tagline: Basınç Güvenliği
  title: Board Basıncı<br />Sıcak İklimlerde Yönetim
  subtitle: Şişme boardun basıncı sıcaklık ile artar. Aşırı basıncı anlamak ve yönetmek boardunuzu korur ve her seansı güvenli kılar.
  items:
    - title: Basıncın Yükselmesinin Sebebi
      description: Hava ısı ile genişler. 20°C’de 15 PSI şişirilmiş bir board, 40°C güneşte 1-2 PSI yükselebilir — aynı fizik, serin bir sabah boardunu öğlene kadar taş gibi hissettiren nedendir.
      icon: tabler:gauge
    - title: Önerilen Çalışma Basıncı
      description: Valfe yakın yerde yazan 12-15 PSI arasında şişirin. Belirlenen aralık sertlik, güvenlik ve dikiş ömrünü dengeler — daha fazla daha iyi değildir.
      icon: tabler:chart-bar
    - title: Sıcak İklim İçin En İyi Uygulamalar
      description: Sıcak günlerde aralığın alt sınırına göre şişirin. Uzun süre güneşte bırakmadan önce bir miktar hava bırakın ve tam şişmiş boardu plajda bırakmayın.
      icon: tabler:sun
    - title: Güneş Işığı ve Depolama
      description: Kullanılmadığında boardları gölgede ve kısmen indirilmiş olarak saklayın. UV koruması için board çantası kullanın. Depolama için rulo yapmadan önce durulayın ve kurutun.
      icon: tabler:umbrella
    - title: Board Taş Gibi Sert Hissettiğinde
      description: Board nominal aralığına dönene kadar valften hava bırakın. Doğru ölçümler için pompada ölçeği taşıyın — fazla şişirilmiş bir board dikişlere gereksiz stres uygular.
      icon: tabler:alert-circle
