hero:
  tagline: Fabrika
  title: Fabrika ve Üretim
  subtitle: 12.000 m2 entegre üretim — hammaddeden bitmiş tekneye kadar
intro:
  - "**Aquafarer Qingdao Üretim Merkezi**'nin fabrika markası olarak, Aquafarer ham PVC ve fiberglas malzemelerin gelişinden bitmiş teknenin nihai teslimat öncesi denetimine kadar her üretim aşamasını kontrol eder. Qingdao Ekonomik Kalkınma Bölgesi'ndeki üretim tesisimiz 12.000 metrekarelik bir alanı kapsıyor ve PVC kesme, boru ısı sızdırmazlığı, fiberglas RIB gövde üretimi, SUP dijital baskı, son montaj ve kalite testi için özel atölyelere ev sahipliği yapmaktadır."
  - Tasarım, mühendislik, prototipleme, üretim ve testi tek bir çatı altında entegre ederek, sözleşmeli üretimin verimsizliklerini ortadan kaldırır ve yapım kalitesi, malzeme seçimi ve teslimat zaman çizelgeleri üzerinde doğrudan kontrol sağlarız. Atölyemizden çıkan her tekne, ekibimiz tarafından, ekipmanlarımız üzerine, standartlarımıza uygun şekilde inşa edilir.
