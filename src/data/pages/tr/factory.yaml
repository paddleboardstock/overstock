qc_section:
  tagline: Kalite Kontrol
  title: Test ve Kalite Güvence Süreci
  subtitle: Her tekne, sevk edilmeden önce zorunlu testlerden geçer. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
  steps:
    - step: '1'
      title: Hammadde Denetimi
      desc: PVC, Hypalon, ve drop-stitch kumaşlar, UV herhangi bir parti üretime girmeden önce çekme testinden (ASTM D751), yırtık yayılmasından ve direnç doğrulamasından geçer.
    - step: '2'
      title: 48 Saatlik Hava Tutma Testi
      desc: Her tüp odası nominal basıncın %125'ine kadar şişirilir ve 48 saat boyunca tutulur. %5'i aşan basınç düşüşü otomatik reddi ve dikiş yeniden denetimini tetikler.
    - step: '3'
      title: Yük ve Denge Testi
      desc: Tamamlanmış tekneler maksimum nominal kapasiteye yüklenir ve stabilite, serbest board ve kontrol açısından test edilir. Her tekne, nihai muayeneden önce su testinden geçirilir.
oem_section:
  tagline: OEM Projeler
  title: Marka ve OEM Ortaklık Vaka Çalışmaları
  subtitle: Konseptten konteynere — küresel markaların şişme su aracı serilerini başlatmasına ve ölçeklendirmesine nasıl yardımcı oluyoruz.
  cases:
    - challenge: Avrupa açık hava perakendecisi, SUP benzersiz deck grafiklerine, çevre dostu PVCve perakendeye hazır ambalajlara sahip özel markalı bir ürün yelpazesine ihtiyaç duyuyordu — hepsi 60 günde teslim ediliyordu.
      solution: Tasarım REACHekibini Qingdao fabrikamızda birlikte yerleştirerek özel dijital baskı dosyaları geliştirdik, kaynak olarak -uyumlu PVCve 3 turdan 1'e kadar sıkıştırılmış örnekleme yaptım.
      result: İmzalanmış PO'dan 55 FOBgün sonra. 4 SKU'da 2.400 birim. İlk konteyner gelmeden önce tekrar sipariş verildi.
    - challenge: ABD'li su sporları girişimi, drop-stitch özel gövde şekline, ortak markalı ambalaja ve BSCI perakende yerleştirme için sertifikaya sahip yüksek performanslı bir kayak gerekiyordu.
      solution: Mevcut drop-stitch kano kalıbını modifiye edilmiş sallanan profille uyarladı, ortak markalı ambalaj sanatları geliştirdi ve tam BSCI denetim dokümantasyonu sağladı.
      result: ABD'nin 3 büyük açık hava zincirinde başarıyla listelendi. İlk yılda 5.000+ birim ve %98 satış oranı.
    - challenge: Avustralya distribütörü CERIB , özel tüp renkleri, Hypalon yükseltme seçeneği ve Avustralya Standardı AS 1799 uyumu içeren sertifikalı bir seri talep ediyordu.
      solution: Japon tedarikçiden temin edilen 4 tüp renk varyantıyla ön üretim CSM Hypalon örnekleri üretti ve üçüncü taraf AS 1799 uyum testlerini koordine etti.
      result: AU RIB /Yeni Zelanda pazarında 3 model serisi piyasaya sürüldü. Ardından 12 devriye için hükümet ihalesini RIBskazandı.
faq_section:
  tagline: SSS
  title: B2B & OEM Sıkça Sorulan Sorular
  questions:
    - q: MOQOEM Şişme tahtalar için minimum sipariş miktarı () nedir SUP ?
      a: standart MOQ modeller için 5–10 üniteden başlar OEM . Özel kalıplar ve özel etiket projeleri, karmaşıklığa bağlı olarak en az 200 ünite gerektirir. Yeni marka lansmanları için deneme siparişleri ve örnek seriler mevcuttur.
    - q: Aquafarer BSCI Sertifikası var mı?
      a: Evet. Fabrikamız geçerli BSCI sosyal uyumluluk sertifikasına sahiptir (talep üzerine denetim raporu mevcuttur). Ayrıca ISO kalite yönetimi için 9001:2015 sertifikası sahibiz ve ürün modellerimizin 64'ü sertifika CE taşır (TÜVRheinland).REACH ve RoHS her OEM sevkiyatla birlikte sağlanan uyumluluk belgeleri.
    - q: Bir sipariş için tipik teslim süresi nedir OEM ?
      a: Standart teslim süresi, onaylanmış sipariş ve depozito alındıktan sonra 30–45 gündür. Özel kalıp geliştirme, alet yapımı için 15–20 gün ekler. Acil siparişler ve yaz öncesi dönem (Ocak–Mart) sırasında yoğun sezon siparişleri için hızlandırılmış üretim sunuyoruz.
    - q: FOB Qingdao ya da CIF'i limanımıza gönderebilir misiniz?
      a: Evet. Biz FOB Qingdao, CIF büyük küresel limanlar ve DDP nitelikli ortaklar için gönderim yapıyoruz. Lojistik ekibimiz konteyner rezervasyonu, ihracat belgeleri ve gümrük işlemlerini yönetir. AB, ABD, AU ve Asya pazarlarındaki 50+ ülkeye gönderim yapıyoruz.
b2b_moq: 'Standart MOQ: Model başına 5–10 birim (SUP/kayak/drop-stitch). RIB MOQ: 2–5 birim. Yeni ortaklıklar için deneme siparişleri memnuniyetle karşılanır.'
production_flow:
  tagline: Üretim Akışı
  title: Malzemeden Bitmiş Tekneye
  subtitle: Her tekne, her adımda kalite kontrol noktalarıyla birlikte 6 üretim aşamasından geçer. Kestirme yok, atlanan denetim yok.
  stages:
    - stage: '01'
      title: Malzeme Kabul ve Gelen QC
      description: Tüm gelen malzemeler ERP sistemimizde parti/lota numarası ile kaydedilir. PVC kumaş rulo, drop-stitch göbekler, valfler, yapıştırıcılar ve donanımlar, QC onayı alınana kadar karantinaya alınır.
      qc_check: Çekme dayanımı (ASTM D751), yırtılma direnci (ISO 4674), kalınlık ölçer, yapışkan viskozitesi, görsel kusur taraması
      qc_threshold: Test edilen partilerin %100'ü. Çekme dayanımı spesifikasyonun %90'ından az, yırtılma minimum spesifikasyondan az veya herhangi bir görsel kusur varsa reddedin
      responsibility: Gelen Kalite Kontrol ekibi (3 müfettiş)
    - stage: '02'
      title: CNC Kesme ve Malzeme Hazırlığı
      description: Bilgisayar tarafından optimize edilmiş yerleşim, atığı en aza indirmek için panelleri PVC stoğu üzerine yerleştirir. Otomatik CNC kesim makineleri 0,1 mm konumsal hassasiyeti korur.
      qc_check: CAD DXF dosyalarına karşı boyutsal kontrol, kenar kalitesi incelemesi, panel sayısı doğrulaması
      qc_threshold: Her 20. panel ölçüldü. Tolerans ±0,5 mm. Tolerans dışı >%2 ise parti reddedilir
      responsibility: Kesim atölyesi sorumlusu
    - stage: '03'
      title: Kaynak ve Drop-Stitch Bağlama
      description: Drop-stitch çekirdekler, dış PVC laminatlara ısı laminasyonu kullanılarak bağlanır. Tüp odaları RF kaynaklı veya sıcak hava kaynaklıdır. Ray bantları üç katmanlı füzyonla bağlanmıştır.
      qc_check: Her 50 birimde soyma testi (ASTM D751), kaynak genişliği ölçümü, sıcak hava sıcaklık kaydı incelemesi, arkadan ışık altında görsel dikiş kontrolü
      qc_threshold: Soyma dayanımı min 8 N/cm. Kaynak genişliği toleransı ±1 mm. Görünür herhangi bir kanal varsa = reddet
      responsibility: Kaynak Kalite Kontrolü (vardiya başına 2 müfettiş)
    - stage: '04'
      title: Montaj ve Kurulum
      description: 'Botlar, tüm bileşenlerin birleştirildiği nihai montaja taşınır: gövde + tüpler, kurulan valfler, D-halkalar, tutacaklar, yüzgeç kutuları ve taşıma çantası montajı. Her bir birim 100 maddelik bir montaj kontrol listesini takip eder.'
      qc_check: Birim başına 100 maddelik kontrol listesi onayı, vana fonksiyon testi (10 açma/kapatma döngüsü), donanım tork doğrulaması, görsel muayene
      qc_threshold: 'Güvenlik açısından kritik öğelerde (valfler, D-ringler, kollar) sıfır hata politikası. Küçük kozmetik: AQL 2.5 (ISO 2859)'
      responsibility: Montaj ekip lideri + hat QC
    - stage: '05'
      title: Basınç Testi ve Kalite Bekletme
      description: Her hazne, 1,25× nominal basınca (genellikle 20–25 PSI) şişirilir ve 24–48 saat boyunca tutulur. Basınç sensörleri sürekli olarak kaydeder. Basınç düşüşü %5'i aşan hazneler reddedilir ve dikiş tekrar kontrol için gönderilir.
      qc_check: 24 saat basınç tutma kaydı, sensör kalibrasyonu günlük olarak doğrulandı, sıcaklığa göre düzeltilmiş basınç ölçümü, onarımdan sonra dikiş yeniden testi
      qc_threshold: 24 saat boyunca sabit sıcaklıkta maksimum %5 basınç düşüşü. Bu değeri aşan herhangi bir şalter odası = tüm üretim partisinin %100 yeniden test edilmesi
      responsibility: Kalite laboratuvarı (üretimden bağımsız, yönetime rapor verir)
    - stage: '06'
      title: Final Muayene ve Paketleme
      description: Son görsel ve fonksiyonel muayene. Yüzey kusurları, renk tutarlılığı, etiket/BIN doğrulaması, paketleme bütünlüğü ve aksesuarların eksiksizliği. Ürünler vakumlanmış, kutulanmış ve konteyner yüklemesi için paletlere yerleştirilmiştir.
      qc_check: Tam görsel muayene, her SKU için aksesuar kontrol listesi, paketleme düşme testi (1 m, rastgele örnekleme), etiket/barkod tarama doğrulaması
      qc_threshold: AQL büyük kusurlar için 2.5, AQL küçük kusurlar için 4.0. Güvenlik kusurlarında sıfır tolerans. Ürünlerin %100’ü görsel olarak muayene edilir.
      responsibility: Final QC ekibi (4 müfettiş) + Paketleme ekibi lideri
