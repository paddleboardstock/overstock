material_traceability:
  tagline: Takip
  title: Malzeme Takibi & Parti Kontrolü
  description: Hammadde her parti, ERP sistemimizde benzersiz bir parti numarası ile atanır. Gelişten üretime ve bitmiş ürüne kadar, her kartın malzeme listesi orijinal tedarikçi partisine bağlanır. Bu, herhangi bir kalite sorgulaması için tam yukarı yönlü izlenebilirliği sağlar.
  system: Özel ERP (dahili sistem) + her iş emrine fiziksel parti etiketleri
  coverage: Üretim malzemelerinin %100'ü — PVC, drop-stitch kumaş, EVA köpük, yapıştırıcılar, vanalar, donanım, ambalaj
  records_retained: 10 yıl
