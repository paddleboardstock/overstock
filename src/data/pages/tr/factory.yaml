workshops_section:
  tagline: Atölyeler
  title: Üretim Atölyeleri
  workshops:
    - title: PVC Kesme ve Malzeme Hazırlığı
      description: Otomatik CNC kesim makineleri PVC, Hypalon ve drop-stitch kumaşları alt milimetre hassasiyetiyle işler. Bilgisayar tarafından optimize edilen yerleştirme, malzeme israfını en aza indirir ve her panelin kaynak yapılmadan önce boyutsal spesifikasyonlarını karşıladığından emin olur.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Boru Kaynağı ve Isı ile Mühürleme
      description: Isı mühürleme makineleri ve RF dielektrik preslerle donatılmış özel kaynak atölyesi. Sıcak hava ısı mühürleyicileri PVC tüp odacıklarını birleştirip kaynaştırırken, RF kaynakları ISO 9001 gereksinimlerini aşan yüksek dayanımlı hava geçirmez dikişler üretir.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Gövde Üretimi — Fiberglas
      description: RIB tekne gövdeleri polyester ve vinilester reçine sistemleri ile el ile yerleştirilen fiberglas kalıplama yöntemi kullanılarak üretilir. Her katman elle yuvarlanır ve tutarlı kalite için vakum torbasına alınır. Jel kaplama sprey kabini yüksek parlaklıkta, UV dirençli deniz cilası sağlar.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Baskı ve Dekorasyon
      description: SUP panolar, tam renkli grafikler için dijital baskı ve logolar ile tekrarlayan desenler için serigrafi kullanılarak dekore edilir. Dijital yazıcılar fotoğraf kalitesinde yüzey tasarımları üretirken, serigrafi dayanıklı ve canlı marka işaretleri sağlar.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Final Montaj ve Bağlantı
      description: Fiberglas gövdelerin ve PVC boruların birleştirildiği, motorların monte edildiği, direksiyon ve kontrollerin bağlandığı ve elektrik sistemlerinin kablolandığı montaj hattı. Her tekne, ekip lideri tarafından onaylanan 100 maddelik bir montaj kontrol listesine göre ilerler.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Kalite Testi ve Denetimi
      description: Her tamamlanmış tekne, sevkıyattan önce zorunlu hava tutma testi, dikiş ayırma doğrulaması ve tam sistem kontrolünden geçer. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
