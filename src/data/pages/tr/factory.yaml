workshops_section:
  tagline: Atölyeler
  title: Üretim Atölyeleri
  workshops:
    - title: PVC Kesme ve Malzeme Hazırlığı
      description: Otomatik CNC kesme makineleri, PVC drop-stitch milimetre altı hassasiyetle işleme ve kumaş işleme yapar. Bilgisayar ile optimize edilmiş yuva yapımı, malzeme israfını en aza indirir ve her panelin kaynak öncesi boyutsal standartlarına uymasını sağlar.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Kaynak ve Isı Sızdırmazlığı
      description: Isı mühürleme makineleri ve RF dielektrik preslerle donatılmış özel kaynak atölyesi. Sıcak hava kaynak makineleri drop-stitch çekirdek laminatları ve ray bantlarını birleştirip kaynaştırırken, RF kaynaklar yüksek mukavemetli hava geçirmez dikişler üretir.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Gövde Sanatı ve EVA Son İşlem
      description: 'Art-serisi gövdeler burada şekillenir: hassas şekilde kesilmiş EVA köpük paneller tam gövde desenlerine yerleştirilir, yapıştırılır ve tutuşu iyi, konforlu, dayanıklı bir bitiriş için elle inceltilir — her art-serisi tahtanın karakteristik görünümü.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Baskı ve Dekorasyon
      description: SUP panolar, tam renkli grafikler için dijital baskı ve logolar ile tekrarlayan desenler için serigrafi kullanılarak dekore edilir. Dijital yazıcılar fotoğraf kalitesinde yüzey tasarımları üretirken, serigrafi dayanıklı ve canlı marka işaretleri sağlar.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Final Montaj ve Bağlantı
      description: Tahtaların valfleri, D halkaları, tutacakları, yüzgeçleri ve tasma bağlantıları alması için montaj hattı. Her tahta 100 maddelik bir montaj kontrol listesini takip eder ve liste ekip lideri tarafından onaylanır.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Kalite Testi ve Denetimi
      description: Her tamamlanmış tahta sevkiyat öncesinde zorunlu hava tutma testi, dikiş soyulma doğrulaması ve tam sistem kontrolünden geçer. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
