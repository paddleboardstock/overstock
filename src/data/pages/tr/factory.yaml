material_traceability:
  tagline: Takip
  title: Malzeme Takibi & Parti Kontrolü
  description: Her hammade partisinin ERP sistemimizde benzersiz bir parti numarası vardır. Varıştan üretime ve bitmiş ürüne kadar, her teknenin malzeme listesi orijinal tedarikçi partisine bağlanır. Bu, herhangi bir kalite veya uyum sorusu için tam upstream izlenebilirlik sağlar.
  system: Özel ERP (dahili sistem) + her iş emrine fiziksel parti etiketleri
  coverage: Üretim malzemelerinin %100'ü — PVC, Hypalon, drop-stitch kumaş, yapıştırıcılar, valfler, donanım, ambalaj
  records_retained: 10 yıl (CE 2013/53/AB gerekliliğine göre)
  suppliers:
    - material: Deniz sınıfı PVC
      source: Çinli ve Koreli tedarikçiler
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch kumaş
      source: Dahili dokuma + dış ortak
      certified: Dahili kalite kontrol + tedarikçi ISO 9001
    - material: Valfler ve Donanım
      source: Chinese OEM suppliers
      certified: ISO 9001, partilere göre malzeme sertifikaları
