hero:
  tagline: Fabrika
  title: Fabrika ve Üretim
  subtitle: 12.000 m2 entegre üretim — hammaddeden bitmiş tahtaya kadar
intro:
  - "**Paddle Board Overstock Weihai Üretim Merkezi**'nin fabrika markası olarak, Paddle Board Overstock ham maddelerin gelişinden bitmiş PVC drop-stitch kartın nihai teslimat öncesi denetimine kadar her üretim aşamasını kontrol eder. Weihai Ekonomik Kalkınma Bölgesi'ndeki üretim tesisimiz 12.000 metrekarelik bir alanı kaplar ve PVC kesme, ısı sızdırmazlık ve kaynaklama, güverte sanatı bitirme, son montaj ve kalite testleri için özel atölyelere ev sahipliği yapmaktadır."
  - Tasarım, mühendislik, prototipleme, üretim ve testleri tek bir çatı altında entegre ederek, sözleşmeli üretimin verimsizliklerini ortadan kaldırır ve yapım kalitesi, malzeme seçimi ve teslimat zaman çizelgeleri üzerinde doğrudan kontrol sağlarız. Atölyemizden çıkan her pano, ekibimiz tarafından, ekipmanlarımız üzerine, standartlarımıza göre inşa edilir.
