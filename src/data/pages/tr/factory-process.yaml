hero:
  tagline: Süreç
  title: Üretim Süreci
  subtitle: Ham maddeden denize hazır tekneye — her adım kontrolümüz altında
  back_label: Fabrikaya Geri Dön
  back_link: /factory
intro: Üretimi üçüncü taraf fabrikalara dış kaynak olarak veren markaların aksine, Paddle Board Overstock tüm üretim zincirine sahiptir ve işletir. Bu dikey entegrasyon, her aşamada sıkı kalite kontrolü sürdürmemizi, özel taleplere hızlı yanıt vermemizi ve partiden parçaya tutarlı ürün kalitesi sunmamızı sağlar. İşte tesisimizde bir teknenin nasıl yapıldığı.
steps:
  - step: '01'
    title: Malzeme Kabul ve Muayene
    description: Her gelen PVC kumaş, cam elyaf matı, reçine ve donanım partisi, şartnameye karşı incelenir. Kumaş örnekleri, üretime serbest bırakılmadan önce çekme mukavemeti, kalınlık uniformluğu ve UV direnci açısından test edilir. Uygun olmayan malzemeler karantinaya alınır ve iade edilir.
    duration: 1–2 gün
  - step: '02'
    title: Otomatik PVC Kesim
    description: Onaylı kumaşlar otomatik CNC kesim makinesine serilir ve milimetrenin altı hassasiyetle kesilir. Bilgisayar tarafından optimize edilen yerleştirme, atığı en aza indirecek şekilde panelleri düzenler — genellikle %5'in altı. Kesilen paneller tekne modeli ve bölmesine göre etiketlenir, ardından kaynak atölyesine transfer için paketlenir.
    duration: Her tekne kiti için 2–4 saat
  - step: '03'
    title: Boru Isı ile Kapama ve Kaynak
    description: Paneller, kontrollü 200–600 °C sıcaklıklarda sıcak hava kaynaklı ısı iletme makineleri kullanılarak tutturulur ve birleştirilir. Ana dikişler, hava geçirmez ve yüksek mukavemetli birleşimler için RF dielektrik kaynak ile güçlendirilir. Tamamlanan odalar, 30 dakikalık hava sızdırmazlık doğrulaması için çalışma basıncının 1,25 katına şişirilir.
    duration: Tekne başına 1–2 gün
  - step: '04'
    title: Fiberglas RIB Gövde Kalıplama
    description: RIB tekne gövdeleri, el ile kalıplama yöntemiyle cam elyafı kullanılarak üretilir. Cam elyafı mat ve dokuma fitiller, polyester veya vinilester reçinesi ile hassas kalıplarda elle yuvarlanır. Her katman, tutarlı lamina kalitesi için vakum torbasına alınır. Gövde, yüksek parlaklık ve UV-e dayanıklı deniz yüzeyi sağlamak için jelkaplama ile bitirilir.
    duration: Gövde başına 2–4 gün
  - step: '05'
    title: SUP Baskı ve Dekorasyon
    description: SUP kaykay tahtası grafikleri, tam renkli fotoğraf kalitesinde tasarımlar için dijital baskı ve dayanıklı logolar ile tekrar eden desenler için serigrafi ile uygulanır. Baskılar, UV ve aşınma direnci sağlamak amacıyla kürlenir ve mühürlenir.
    duration: 1–2 gün
  - step: '06'
    title: Final Montaj ve Bağlantı
    description: Fiberglas gövdeler ve PVC boru montajları montaj hattında birleştirilir. Motor monte edilir, direksiyon ve gaz kontrolü bağlanır, yakıt sistemi kurulur ve tüm elektrik tesisatı döşenir. Her tekne, her aşamada zorunlu imza ile tamamlanan 100 maddelik bir montaj kontrol listesini takip eder.
    duration: 2–3 gün
  - step: '07'
    title: Kalite Testi ve Denetimi
    description: 'Her tamamlanmış tekne zorunlu kalite kontrolünden geçer: hazne hava tutma testleri, sistemlerin işlev kontrolü, bağlantı elemanlarının tork doğrulaması ve kozmetik inceleme. Özel ve prototip yapımları ayrıca hız, kullanım, denge ve dayanıklılığı kapsayan su içi deniz denemeleri de alır.'
    duration: 1–2 gün
  - step: '08'
    title: Paketleme ve Nakliye
    description: Botlar hava boşaltılır, prosedüre göre katlanır, ağır hizmet tipi örme çantalara veya kontrplak kutulara paketlenir ve sevkiyat için yüklenir. Her paket model, seri numarası ve varış yeri ile etiketlenir. Dünya çapında FCL ve LCL konteyner sevkiyatları için nakliyecilerle koordinasyon sağlıyoruz.
    duration: 1 gün
