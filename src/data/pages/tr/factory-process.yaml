hero:
  tagline: Süreç
  title: Üretim Süreci
  subtitle: Hammaddeden denize hazır tahtaya kadar — her adım kontrolümüz altında
  back_label: Fabrikaya Geri Dön
  back_link: /factory
intro: Üretimi üçüncü taraf fabrikalara dış kaynak olarak veren markaların aksine, Paddle Board Overstock tüm üretim zincirinin sahibi ve işletiliyor. Bu dikey entegrasyon, her aşamada sıkı kalite kontrolünü sürdürmemize ve parti parti tutarlı ürün kalitesi sunmamıza olanak tanıyor. Tesisimizde bir kartın nasıl inşa edildiği şöyle.
steps:
  - step: '01'
    title: Malzeme Kabul ve Muayene
    description: Gelen her PVC kumaş, drop-stitch çekirdek, EVA köpük ve donanım partisi spesifikasyonlara göre kontrol edilir. Kumaş örnekleri, üretime teslim edilmeden önce çekme mukavemi, kalınlık eşitliği ve direnç açısından test UV edilir. Uyumsuz malzemeler karantinaya alınır ve geri gönderilir.
    duration: 1–2 gün
  - step: '02'
    title: Otomatik PVC Kesim
    description: Onaylı kumaşlar otomatik CNC kesme makinesine serilir ve milimetre altı hassasiyetle kesilir. Bilgisayar ile optimize edilmiş yuva yapımında, paneller genellikle %5'in altında olan atıkları en aza indirecek şekilde düzenlenir. Kesilen paneller kart modeli ve odasına göre etiketlenir, ardından kaynak atölyesine aktarılmak üzere paketlenir.
    duration: Her board kiti için 2–4 saat
  - step: '03'
    title: Boru Isı ile Kapama ve Kaynak
    description: Paneller, kontrollü 200–600 °C sıcaklıklarda sıcak hava kaynaklı ısı iletme makineleri kullanılarak tutturulur ve birleştirilir. Ana dikişler, hava geçirmez ve yüksek mukavemetli birleşimler için RF dielektrik kaynak ile güçlendirilir. Tamamlanan odalar, 30 dakikalık hava sızdırmazlık doğrulaması için çalışma basıncının 1,25 katına şişirilir.
    duration: Her tahta 1–2 gün
  - step: '04'
    title: Gövde Sanatı ve EVA Son İşlem
    description: 'Burada sanat serisi desteler şekilleniyor: hassas EVA kesim köpük paneller tam güverte desenlerine yerleştiriliyor, birbirine bağlanıyor ve elle süsleniyor. Tutuşucu, rahat ve dayanıklı — her sanat serisi tahtanın imza görünümü.'
    duration: 1–2 gün
  - step: '05'
    title: SUP Baskı ve Dekorasyon
    description: SUP kaykay tahtası grafikleri, tam renkli fotoğraf kalitesinde tasarımlar için dijital baskı ve dayanıklı logolar ile tekrar eden desenler için serigrafi ile uygulanır. Baskılar, UV ve aşınma direnci sağlamak amacıyla kürlenir ve mühürlenir.
    duration: 1–2 gün
  - step: '06'
    title: Final Montaj ve Bağlantı
    description: 'Kartlar son bileşenlerini alır: valfler burklanır ve işlev testinden geçirilir, D-halkalar, kollar ve finer kutuları takılır, tasma bağlantısı sabitlenir. Her kart, her aşamada zorunlu onay ile 100 puanlık bir montaj kontrol listesini takip eder.'
    duration: 2–3 gün
  - step: '07'
    title: Kalite Testi ve Denetimi
    description: 'Her tamamlanmış kart zorunlu kalite kontrolünden geçer: odada hava tutma testi, sistem fonksiyon kontrolü, bağlantı torku doğrulaması ve kozmetik denetim. Özel ve prototip yapımlar ayrıca hız, yol tutuşu, stabilite ve dayanıklılık gibi su içi deniz denemeleri alır.'
    duration: 1–2 gün
  - step: '08'
    title: Paketleme ve Nakliye
    description: Kartonlar söndürülür, rulo edilir ve pompa, kürek, kanat, tasma ve tamir kitiyle birlikte seyahat sırt çantalarına yerleştirilir, ardından kurye ve yük gönderimi için kutulara konur. Her paket model, seri numarası ve varış noktası ile etiketlenir.+ Dünya çapında 50 ülkeye gönderme yapıyoruz.
    duration: 1 gün
cta:
  title: Ekipman ve makinelerimizi görün
  desc: Her tahtanın arkasındaki endüstriyel kalite ekipmanları keşfedin Paddle Board Overstock .
  label: Ekipmanı görüntüle →
  link: /factory/equipment
tldr:
  summary: Paddle Board Overstock, hammadde denetiminden kesme, kaynak, güverte sanatı ve EVA son işlem, montaj, 1,25 kat nominal basınç testi ve nihai kalite kontrolüne kadar titiz, çok aşamalı bir üretim sürecini takip eder. Tüm panolar %100 basınç testinden geçirilir, %99,3 kusursuzdur.
  points:
    - 'Hammadde denetimi: çekme, yırtılma, UV testi'
    - Otomatik CNC kesim ve yüksek frekanslı RF kaynak
    - Elde monte edilmiş EVA güverte sanatı, solmaya karşı bloklarla
    - Her bir birimde 24-48 saat boyunca 1,25 kat nominal basınca dayanak
    - Her pano için 100 noktadan oluşan nihai denetim
