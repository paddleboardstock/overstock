hero:
  tagline: Paddle Board Overstock Özel Laboratuvar
  title: Kendi<br />Su Aracınızı Tasarlayın
  subtitle: OEM, ODM, özel etiket ve özel marka hizmetleri ile dünya çapında işletmeler için. Tek bir prototipten tam üretim serilerine kadar.
  cta: Projenize başlayın
  footer_link: /contact
steps_section:
  tagline: Nasıl Çalışır
  title: Kavramdan üretime
  subtitle: Fikrinizi tamamlanmış, denize hazır bir ürüne taşımanın dört adımı.
  steps:
    - num: '01'
      title: Tahtanızı Seçin
      desc: Ana modellerimizden seçin — SUP, kano, bot veya RIB. Boyut, malzeme ve renk seçin.
    - num: '02'
      title: Tasarımınızı Yükleyin
      desc: Logonuzu, sanat eserlerinizi veya marka yönergelerinizi bize gönderin. Tasarım ekibimiz dijital bir taslak hazırlar.
    - num: '03'
      title: Yapay Zeka Maketi İncelemesi
      desc: Üretim başlamadan önce özel tahtanızın foto-gerçekçi yapay zeka ile oluşturulmuş maketini görün.
    - num: '04'
      title: Üretim ve Teslimat
      desc: Onaylandıktan sonra siparişiniz ISO sertifikalı üretim hattımıza girer. Teslim süreleri 30 gün ve üzeri.
services_section:
  tagline: Hizmetler
  title: Küresel markalar için üretim hizmetleri
  subtitle: Esnek iş birliği modelleri — sözleşmeli üretimden tam hizmet marka oluşturma.
  items:
    - title: OEM Üretim
      desc: Tasarımınızı spesifikasyonlara göre üretiriz — fikri mülkiyet sizin, çizimleriniz sizin, kalite standartlarınız sizin. Tam NDA koruma.
      icon: ⚙️
    - title: ODM Çözümler
      desc: 50+ denenmiş platformdan seçim yapın ve boyut, renk, grafik ve ambalajı özelleştirin.
      icon: 🎨
    - title: Özel Marka
      desc: Ürünlerimizde markanız — logo, ambalaj, asma etiketler, kullanım kılavuzları. Kutudan çıkmaya hazır perakende.
      icon: 🏷️
    - title: Özel Markalama
      desc: Güverte ped baskısı, gövde grafikleri, tüp çıkartmaları ve özel etiketler — tam marka entegrasyonu.
      icon: ✨
capabilities_section:
  tagline: Yetenekler
  title: Üretim ve özelleştirme yetenekleri
  subtitle: Sipariş vermeden önce bilmeniz gereken her şey.
  capabilities:
    - label: Sipariş hacmi
      value: MOQ 5–10 birim (SUP/kayak), 2–5 birim (RIB)
    - label: Teslim süresi
      value: 30–45 gün standart; prototipler için 15–20 gün
    - label: Özelleştirme
      value: Boyut, şekil, renk, grafik, ambalaj, donanım
    - label: Malzemeler
      value: PVC, Hypalon, drop-stitch, fiberglas, alüminyum
    - label: Baskı
      value: Dijital (CMYK), serigrafi, ısı transferi, süblimasyon
    - label: Sertifikasyon
      value: CE, ISO 9001, BSCI, UKCA (küresel uyumluluk desteği)
why_section:
  tagline: Neden Paddle Board Overstock
  title: Tek fabrika. Tek standart. Sıfır ödün.
  points:
    - text: 12.000 m² entegre üretim tesisi
      highlight: 12.000 m²
    - text: 200-300 kalifiye işçi ve mühendis
      highlight: 200-300
    - text: Yıllık 15.000 tekne üretimi
      highlight: 15,000
    - text: ISO 9001 sertifikalı kalite yönetimi
      highlight: ISO 9001
    - text: CE EU pazarı için sertifikalı ürünler
      highlight: CE
  cta: Fabrika detaylarını görüntüle
  cta_link: /factory
  contact:
    title: Projenizi tartışmaya hazır mısınız?
    desc: Ekibimiz, ilk teklif ile 24 saat içinde yanıt verir.
