hero:
  tagline: Yaşam Tarzı
  title: Paddle Board Overstock<br />Yaşam Tarzı
  subtitle: Suda yaşayanlar için tasarlandı — hafta sonu kaşiflerinden, seanslar arasındaki günleri sayan günlük kürekçilere kadar.
values:
  - icon: 🌊
    title: Suda Doğdu
    desc: Her tasarım suyun nasıl davrandığını anlamakla başlar. Koşulların sınırlarından içeriye doğru mühendislik yapıyoruz — çünkü okyanus bizim öğretmenimiz, iş yerimiz değil.
  - icon: 🔧
    title: Dayanacak Şekilde Üretildi
    desc: En sürdürülebilir ürün, değiştirilmeye gerek duymayan üründür. Deniz sınıfı malzemeler, 15 PSI derecelik drop-stitch çekirdekler ve sezonu aşan dikişler.
  - icon: 🏆
    title: Tasarım Gereği Erişilebilir
    desc: Su sporları bir lüks olmamalı. Aileler, rehberler ve günlük kürekçiler için anlamlı bir fiyata profesyonel düzeyde performans — sadece profesyoneller için değil.
  - icon: 🌍
    title: Küresel Topluluk
    desc: 'Weihai kıyılarından Avrupa’daki göllere, Güneydoğu Asya’daki nehirlerden Amerika’daki koylara — müşterilerimizin paylaştığı bir şey var: su üzerinde olmayı seviyorlar.'
  - icon: ♻️
    title: Sorumlu Üretim
    desc: CNC-optimize edilmiş yerleşim, malzeme israfını %5’in altına indirir. Dayanıklı yapı, değiştirme döngülerini azaltır. Uzun ömür için üretiyoruz çünkü bu en sürdürülebilir seçimdir.
  - icon: 🤝
    title: Sürecek Destek
    desc: Yıllar önce ürettiğimiz tahtalar hâlâ bize yedek parça için başvuruyor. Garanti yanıtımız ortalama 24 saattir. Satıştan sonra kaybolmuyoruz — ürünün ömrü boyunca buradayız.
