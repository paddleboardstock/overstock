hero:
  tagline: Yaşam Tarzı
  title: Aquafarer<br />Yaşam Tarzı
  subtitle: Suyu yaşam biçimi haline getirenler için tasarlandı — hafta sonu kaşiflerinden her gün ekipmanlarına güvenen ticari operatörlere kadar.
values:
  - icon: 🌊
    title: Suda Doğdu
    desc: Her tasarım suyun nasıl davrandığını anlamakla başlar. Koşulların sınırlarından içeriye doğru mühendislik yapıyoruz — çünkü okyanus bizim öğretmenimiz, iş yerimiz değil.
  - icon: 🔧
    title: Dayanacak Şekilde Üretildi
    desc: En sürdürülebilir ürün, değiştirilmeye gerek duymayan üründür. Deniz sınıfı malzemeler, 15 PSI derecelik drop-stitch çekirdekler ve sezonu aşan dikişler.
  - icon: 🏆
    title: Tasarım Yoluyla Erişilebilir
    desc: Su sporları bir lüks olmamalı. Aileler, rehberler ve küçük operatörler için mantıklı bir fiyata profesyonel kalite performans — sadece ticari filolar için değil.
  - icon: 🌍
    title: Küresel Topluluk
    desc: 'Qingdao sahilinden Avrupa’daki göllere, Güneydoğu Asya’daki nehirlere ve Amerika’daki koylara kadar — müşterilerimiz bir şeyi paylaşıyor: suyla olmayı seviyorlar.'
  - icon: ♻️
    title: Sorumlu Üretim
    desc: CNC-optimize edilmiş yerleşim, malzeme israfını %5’in altına indirir. Dayanıklı yapı, değiştirme döngülerini azaltır. Uzun ömür için üretiyoruz çünkü bu en sürdürülebilir seçimdir.
  - icon: 🤝
    title: Sürecek Destek
    desc: Yirmi yıllık gövdeler hâlâ yedek parça için bizi arıyor. Garanti yanıt süremiz ortalama 24 saattir. Satıştan sonra yok olmuyoruz — ürünün ömrü boyunca buradayız.
