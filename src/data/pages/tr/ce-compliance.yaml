  - value: RCD 2013/53/EU
    label: Geçerli Direktif
    detail: Rekreasyonel Tekne Direktifi
  - value: 64
    label: CE-Sertifikalı Modeller
    detail: Modele özel uyum
  - value: EN ISO 6185
    label: Temel Standart
    detail: Şişme su aracı yapımı
  - value: TÜV Rheinland
