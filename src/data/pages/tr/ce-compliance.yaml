hero:
  tagline: CE & RCD Uyum
  title: RIB Tekne CE Uyumu<br />& Teknik Dokümantasyon
  subtitle: Paddle Board Overstock RIB tekneler ve şişme su araçları, Rekreasyonel Tekne Direktifi 2013/53/EU kapsamında AB pazarı uyumu için tasarlanmış ve belgelenmiştir. Risk değerlendirmesinden Uygunluk Beyanına kadar, her gövde için modele özel uyum belgeleri sağlıyoruz.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB tekne CE uyum belgeleri ve sertifikasyonu
direct_answer: Paddle Board Overstock modellerine özel RCD 2013/53/EU uyum belgelerini sağlar; bunlar arasında teknik dosyalar, Uygunluk Beyanları, üretici plakaları ve kullanıcı kılavuzları bulunur — hepsi EN ISO 6185, ISO 12217 ve geçerli uyumlaştırılmış standartlarla uyumludur.
