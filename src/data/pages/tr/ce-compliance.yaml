content_scope:
  tagline: Uyum Kapsamı
  title: Hangi Ürünler<br />RCD Uyumluluk Gerektirir?
  subtitle: Rekreasyonel Tekne Direktifi 2013/53/EU, gövde uzunluğu 2,5 m ila 24 m olan rekreasyonel teknelere uygulanır. Kapsamı anlamak, uyum için ilk adımdır.
  items:
    - title: RIB Tekneler (2,5–24 m)
      description: Gövde uzunluğu 2,5 m ila 24 m olan sert şişme tekneler RCD kapsamındadır. Tasarım kategorileri A'dan D'ye kadar, öngörülen deniz koşulları ve maksimum rüzgar kuvvetine göre uygulanır.
      icon: tabler:sailboat
    - title: Şişme Tekneler (2,5 m altında)
      description: 2,5 m altındaki küçük şişme tekneler ve botlar RCD kapsamından kısmen muaf olabilir ancak diğer geçerli direktifler ve EN ISO 6185 yapı standartları kapsamında CE işaretlemesini gerektirir.
      icon: tabler:sailboat
    - title: SUP Tahtalar & Aksesuarlar
      description: Ayakta kürek tekneleri RCD kapsamı dışındadır. Ancak, ilişkili kişisel can yelekleri (PFD) Uygunluk Avrupa Birliği Kişisel Koruyucu Donanım Yönetmeliği (EU) 2016/425 kapsamında CE işaretlemesini ve gerekli durumlarda USCG Tip III/V onayını gerektirir.
      icon: tabler:swimming
    - title: Kısmen Tamamlanmış Tekneler
      description: Motor veya belirli montajlar olmadan teslim edilen tekneler, kısmen tamamlanmış tekneler için Üretici Beyanı gerektirir ve tam RCD uyum nihai üretici veya ithalatçı tarafından tamamlanır.
      icon: tabler:tool
content_trust_layers:
  tagline: Üç Katmanlı Güven Sistemi
  title: Uyumluluk Bilgisi<br />— Doğru Düzeyde Paylaşıldı
  subtitle: Tüm uyumluluk verileri halka açık bir web sitesinde yer almamalıdır. Telif haklarını korurken alıcı güvenini oluşturmak için üç katmanlı bir yaklaşım izliyoruz.
  items:
    - title: Katman 1 — Halka Açık Web Sitesi
      description: Başvurulan standartlar, uygunluk yolları açıklandı, belge türleri listelendi, model ailesi başına sertifikasyon kapsamı. Gerçek sertifikalar, test verileri veya özel mühendislik detayları yok.
      icon: tabler:world
    - title: Katman 2 — Sorgu Sonrası Paylaşım
      description: 'Yetkin bir incelemenin ardından: sansürlenmiş DoC örneği, üretici plaka fotoğrafı, geçerli standartlar listesi, uyum kontrol listesi ve malzeme sertifikasyon özetleri — adil kullanım koşulları altında paylaşıldı.'
      icon: tabler:mail
    - title: Katman 3 — NDA / Sipariş Aşaması
      description: Tam teknik dosya, risk değerlendirmeleri, stabilite hesaplamaları, test raporları, malzeme parti kayıtları ve üretim izlenebilirlik belgeleri — yalnızca doğrulanmış alıcılarla NDA altında paylaşılır.
      icon: tabler:lock
content_standards:
  tagline: Uygulanabilir Standartlar
  title: ISO & EN Standartları<br />Biz İnşa Ederiz
  subtitle: Ürünlerimiz RCD kapsamındaki uyumlaştırılmış standartlara göre tasarlanmış ve test edilmiştir. Standart numaraları ve isimlerine atıfta bulunulmuştur; tam standart metinleri ISO telif hakkı kapsamında kalmaktadır.
  items:
    - title: EN ISO 6185-3
      description: 'Şişme botlar — Bölüm 3: Maksimum motor gücü 15 kW veya daha fazla olan botlar. RIBs için yapım, stabilite, yüzdürme ve adam-overboard kurtarma gereklilikleri.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Şişme tekneler — Bölüm 4: Maksimum motor gücü 15 kW olan ve 4,5 kW ve üzeri tekneler. Ek yapısal ve denge gereksinimleri.'
      icon: tabler:file-text
    - title: ISO 12215 Serisi
      description: Küçük gemiler — Gövde yapımı ve kirişler. Fiberglas ve alüminyum gövdeler için gövde, güverte ve borda tahkimatının yapısal tasarımı.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Küçük tekneler — Kullanıcı kılavuzu. AB'de teslim edilen her RIB teknesiyle birlikte verilen kullanıcı kılavuzunun gerekli içeriği ve formatı.
      icon: tabler:book
    - title: EN ISO 14945
      description: Küçük araç — Yapımcı plâkası. Her araca kalıcı olarak takılmış olan yapımcı plâkasında işaretlenecek bilgiler.
      icon: tabler:badge
    - title: ISO 8666
      description: Küçük tekneler — Temel veriler. Tüm ürün dokümantasyonunda tutarlı spesifikasyon için standartlaştırılmış ölçümler ve parametreler.
      icon: tabler:dimensions
content_process:
  tagline: Uygunluk Süreci
  title: 6 Adım CE Uyum<br />İş Akışı
  subtitle: Proje kapsamından seri düzeyinde izlenebilirliğe — her RIB model tanımlı bir uyumluluk yolunu takip eder.
  steps:
    - number: '01'
      title: Proje Kapsamı ve Sınıflandırması
      description: RIB modelini, tasarım kategorisini (A/B/C/D), maksimum kişi sayısını, yük kapasitesini, motor gücünü ve hedef pazarı tanımlayın. RCD'nin uygulanıp uygulanmadığını ve hangi uygunluk değerlendirme modülünün gerektiğini belirleyin.
      timeline: 2–3 gün
    - number: '02'
      title: Uygulanabilir Gereksinimlerin Belirlenmesi
      description: RCD Ek I'den tüm uygulanabilir Temel Güvenlik Gereksinimlerini, ilgili uyumlaştırılmış standartları (EN ISO 6185, 12215, 10240, 14945) ve hedef pazar için ek ulusal gereksinimleri belirleyin.
      timeline: 3–5 gün
    - number: '03'
      title: Tasarım ve Teknik Dokümantasyon
      description: 'Ana Teknik Dosyayı oluşturun: genel düzen çizimleri, stabilite ve kaldırma hesaplamaları, risk değerlendirmesi, malzeme özellikleri ve sistemler güvenlik analizleri (yakıt, elektrik, direksiyon).'
      timeline: 10–15 gün
    - number: '04'
      title: Ürün Doğrulama ve Testi
      description: Fiziksel doğrulamayı gerçekleştirin — 1,25x nominal basınçta 24–48 saat basınç testi, stabilite ve kaldırma testleri, yük testleri ve sistemlerin devreye alınması. Her gövde için tüm test sonuçlarını kaydedin.
      timeline: 5–7 gün
    - number: '05'
      title: Markalama ve Teslimat Dokümantasyonu
      description: CE işaretlemesini, üretici plakasını (EN ISO 14945) ve HIN/CIN (gövde tanımlama numarası) ekleyin. AB Uygunluk Beyanı, kullanım kılavuzu (EN ISO 10240) ve uyumluluk kontrol listesini hazırlayın.
      timeline: 2–3 gün
    - number: '06'
      title: Seri Düzeyinde İzlenebilirlik
      description: Her gövde, Ana Teknik Dosyayla, üretim partisiyla, malzeme sertifikalarıyla, test sonuçlarıyla ve nihai yapılandırmayla bağlantılı benzersiz bir Gövde Kaydı alır. Kayıtlar RCD uyarınca 10+ yıl süreyle saklanır.
      timeline: Sürekli
content_document_cards:
  tagline: Doküman Türleri
  title: Uyumluluk Dokümanı<br />Kartlar
  subtitle: Bunlar, her CE-sertifikalı RIB modeli için hazırladığımız ve muhafaza ettiğimiz doküman türleridir. Örnekler, nitelikli talep üzerine mevcuttur.
  items:
    - title: CE / RCD Uyumluluk Sertifikası
      description: Tekneye uygulanabilir tüm Temel Güvenlik Gereksinimlerini karşıladığını doğrulayan model özel sertifika, gerek duyulduğunda Bildirilmiş Kuruluş katılımıyla üretici tarafından verilir.
      icon: tabler:certificate
    - title: AB Uygunluk Beyanı (DoC)
      description: Uygulanabilir direktifler, standartlar, uygunluk modülü ve Bildirilmiş Kuruluş bilgilerini listeleyen, üretici veya yetkili temsilci tarafından imzalanmış beyan. AB pazarına sürülen her model için gereklidir.
      icon: tabler:file-check
    - title: Üretici Plakası (EN ISO 14945)
      description: Maksimum kişi sayısı, maksimum motor gücü, tasarım kategorisi ve üretici kimliğini gösteren kalıcı plaka. Teknenin ömrü boyunca okunabilir kalmalıdır.
      icon: tabler:badge
    - title: Kullanıcı Kılavuzu (EN ISO 10240)
      description: Güvenli kullanım, acil durum prosedürleri, bakım programları ve güvenlik uyarılarını kapsayan kapsamlı kılavuz. AB’de teslim edilen her RIB için zorunludur.
      icon: tabler:book
    - title: ISO Test ve Muayene Raporları
      description: Basınç testi kayıtları (1,25x / 24–48 saat), stabilite ve kaldırma test sonuçları, malzeme test sertifikaları ve ölçü doğrulama raporları — tümü belirli gövde numaralarına bağlıdır.
      icon: tabler:test-pipe
    - title: Malzeme İzlenebilirlik Kayıtları
      description: Boru kumaşı, yapıştırıcılar, fiberglas ve donanım için parti düzeyinde izlenebilirlik. Her üretim birimini gelen malzeme sertifikalarına ve IQC denetim sonuçlarına bağlar.
      icon: tabler:link
    - title: Kalite Denetimi ve KG Kayıtları
      description: Birim başına 100 puanlık kalite kontrol listesi, süreç içi kalite kontrol kayıtları, uygunsuzluk raporları ve düzeltici önlemler. Üretim izlenebilirlik zincirinin bir parçası.
      icon: tabler:clipboard-check
    - title: Proje Belge Paketi
      description: Nihai konfigürasyon kaydı, motor ve ekipman kurulum detayları, devreye alma kontrol listesi ve teslimat belgelerini içeren her gövde için dokümantasyon paketi.
      icon: tabler:package
content_design_categories:
  tagline: RCD Tasarım Kategorileri
  title: Tasarım Kategorisi A–D<br />— Ne Anlama Geliyorlar
  subtitle: RCD, teknenin dayanacak şekilde tasarlandığı maksimum rüzgar kuvveti ve önemli dalga yüksekliğine göre tasarım kategorilerini atar.
  items:
    - title: Kategori A — Okyanus
      description: Rüzgar kuvvetinin Beaufort 8'i (>40 knop) aşabileceği ve önemli dalga yüksekliğinin 4 m'yi geçebileceği uzun seyahatler için tasarlanmıştır. En titiz yapısal ve stabilite doğrulamasını gerektirir.
      icon: tabler:ripple
    - title: Kategori B — Açık deniz
      description: Beaufort 8 (≤40 knot) rüzgar kuvvetine ve 4 m'ye kadar önemli dalga yüksekliğine kadar açık deniz seyirleri için tasarlanmıştır. Kıyı ve yarı korunaklı sular için uygundur.
      icon: tabler:anchor
    - title: Kategori C — Kıyı İçi
      description: Rüzgar kuvveti Beaufort 6'ya (≤27 knot) kadar ve önemli dalga yüksekliği 2 m'ye kadar olan kıyı seyahatleri için tasarlanmıştır. Çoğu rekreasyonel RIBs bu kategoriye girer.
      icon: tabler:sun
    - title: Kategori D — Korunaklı
      description: Beaufort 4 wind gücüne kadar (≤16 knot) ve 0,3 m'ye kadar önemli dalga yüksekliğine sahip korunaklı sular için tasarlanmıştır. Göller, nehirler ve korunaklı limanlar.
      icon: tabler:pool
content_hin:
  tagline: Zanaat Tanımlaması
  title: HIN / CIN ve Yapıcı Plakası
  subtitle: Her RIB tekne, EN ISO 14945 ve RCD gereksinimlerine göre bir Gövde Tanımlama Numarası (HIN) veya Tekne Tanımlama Numarası (CIN) ve bir üretici plakasına sahip olmalıdır.
  items:
    - title: Gövde Tanımlama Numarası (HIN)
      description: Üretici kodu (MIC), model yılı, üretim yılı ve seri numarasını kodlayan, kıç tarafın sancak tarafına kalıcı olarak işlenmiş benzersiz 14 karakterlik bir kod. AB pazarına giriş için gereklidir.
      icon: tabler:hash
    - title: Havacılık Kimlik Numarası (CIN)
      description: EN ISO 10087’ye göre, hırsızlık ve izlenebilirlik amaçları için gizli bir yerde yerleştirilen gizli bir ikincil tanımlama numarası.
      icon: tabler:eye-off
    - title: İnşaatçı Plakası İçeriği
      description: Maksimum kişi sayısı, maksimum motor gücü (kW), maksimum yük (kg), tasarım kategorisi, üretici adı ve CE işareti — hepsi korozyona dayanıklı bir plakada kalıcı olarak gösterilmelidir.
      icon: tabler:badge
content_tech_file:
  tagline: Teknik Dosya Yapısı
  title: Ana Teknik Dosya<br />& Gövde Kaydı
  subtitle: 'Dokümantasyon sistemimiz iki katmanlı bir yapıya sahiptir: her model ailesi için Ana Teknik Dosya ve üretilen her tekne için ayrı Gövde Kayıtları.'
  items:
    - title: Ana Teknik Dosya
      description: 'Bir model ailesi için tam uyum dokümantasyonunu içerir: genel düzenleme, risk değerlendirmesi, stabilite/yüzdürme hesaplamaları, malzeme özellikleri, geçerli standartlar ve uyum değerlendirme kayıtları. 10+ yıl boyunca korunur.'
      icon: tabler:folder
    - title: Gövde Kaydı (Tekne Başına İzlenebilirlik)
      description: 'Her gövdenin Master Teknik Dosyasına bağlayan benzersiz bir kaydı vardır: HIN, üretim tarihi, tüp partisi, malzeme sertifikaları, basınç testi sonucu, nihai konfigürasyon, motor kurulumu ve teslimat hedefi.'
      icon: tabler:file-description
    - title: Müşteri Uyum Paketi
      description: Gövde başına teslimat paketi, DoC, üretici plaka fotoğrafı, kullanım kılavuzu, test özeti ve nihai yapılandırma sayfası dahil — AB'ye gönderilen her paketle RIB birlikte sağlanıyor.
      icon: tabler:package
content_material_cert:
  tagline: Malzeme Sertifikası
  title: Malzeme İzlenebilirliği &<br />Sertifikasyon Kanıtı
  subtitle: Kaliteli RIB tekneler, kontrollü malzemeler ve belgelenmiş süreçlerle başlar. Aşağıda, her kritik bileşen grubu için malzeme sertifikasyonunu nasıl organize ettiğimiz yer almaktadır.
  items:
    - title: Şişirilebilir Tüp Malzemesi İzlenebilirliği
      description: PVC ve CSM/Hypalon tüp malzemeleri amaçlanan kullanım, iklim koşulları ve hedef pazara göre seçilir. Tedarikçi teknik verileri (TDS), malzeme partisi bilgileri, kumaş partisi UV izlenebilirliği ve hava koşulları test raporları ile REACH/SVHC beyanları üzerinde anlaşılan proje dokümantasyon kapsamı içinde mevcuttur.
      icon: tabler:circle
    - title: Deniz Alüminyum İzlenebilirliği
      description: Alüminyum gövde RIB projeleri için, alaşım kalitesi, kalınlığı ve malzeme partileri onaylı spesifikasyonlara göre kontrol edilir. Malzeme test sertifikaları (MTC/MTR), EN 10204 3.1 dokümantasyonu, kimyasal bileşim ve mekanik özellikler raporları ile ısı/parti izlenebilirliği üzerinde anlaşmaya varılır.
      icon: tabler:rectangle
    - title: GRP Gövde Malzemesi ve Süreç Kontrolü
      description: Fiberglas gövdeRIBs, jelkoat, reçine, fiberglas takviye ve çekirdek malzemeler için kontrollü spesifikasyonlar ile yönetilir. Malzeme TDS/SDS, parti kayıtları, laminat spesifikasyonları ve kürleme ile atölye kontrol kayıtları proje anlaşması ile mevcuttur.
      icon: tabler:layers-subtract
    - title: Bileşen Dokümantasyon Desteği
      description: Seçilmiş bileşenler için — EVA güverte malzemeleri, oturma yerleri, paslanmaz çelik donanım, yakıt sistemleri, elektrik ekipmanları ve deniz aksesuarları dahil — geçerli tedarikçi dokümantasyonu nihai konfigürasyon ve destinasyon pazarı gereksinimlerine göre koordine edilir.
      icon: tabler:package
    - title: Uyum Kapsamı Bildirimi
      description: Sertifikalar, test raporları ve uyumluluk belgeleri yalnızca ilgili belgede belirtilen belirli ürün modeli, malzeme, bileşen, üretim partisi veya proje kapsamı için geçerlidir. Hedef pazarınız, kullanım amacınız ve teknik gereksinimlerinizi bizimle iletişime geçirin ki ilgili dokümantasyon paketi sipariş verilmeden önce onaylanabilsin.
      icon: tabler:info-circle
faq:
  title: CE Uyum — Sıkça Sorulan Sorular
  questions:
    - q: Tüm Paddle Board Overstock RIB tekneler CE AB pazarı için sertifikalı mı?
      a: RIB Kataloğumuzdaki tekneler, RCD geçerli AB direktiflerine göre 2013/53/AB uyumu için tasarlanmış ve belgelenmiştir.CE Markalama modele göre, konfigürasyona göre uygulanır. Modele özgü uyum kapsamı belgesi için bizimle iletişime geçin.
    - q: RCD Uyum ile işaretleme arasındaki fark nedir CE ?
      a: RCD (Rekreatif Araç Direktifi 2013/53/EU), Temel Güvenlik Gereksinimlerini belirleyen AB mevzuatıdır.CE İşaretleme, bu gereksinimleri karşılayacağı değerlendirilmiş ve onaylanmış bir ürüne yerleştirilen görsel semboldür. Bir ürün, RCD işareti taşımadan önce bu standartlara uymalıdır CE .
    - q: Her tekneyle birlikte Uyumluluk Beyanları veriyor musunuz?
      a: Evet. AB pazarına teslim edilen her RIB teknesi, geçerli direktifleri, uyumlaştırılmış standartları, uygunluk değerlendirme modülünü ve Bildirilmiş Kuruluş bilgilerini listeleyen model spesifik bir AB Uygunluk Beyanı içerir.
    - q: Paddle Board Overstock hangi uygunluk değerlendirme modülünü kullanıyor?
      a: Modül, tasarım kategorisine ve tekne tipine bağlıdır. Tasarım Kategorisi C’deki çoğu RIB model Modül A'yı (dahili üretim kontrolü) kullanır. Tasarım Kategorisi A/B tekneleri veya belirli konfigürasyonlar için Modül B+C veya B+D, Bildirilmiş Kuruluş katılımıyla uygulanabilir. Proje başına uygun modül hakkında tavsiyede bulunuyoruz.
    - q: Sipariş vermeden önce uyumluluk belgelerini paylaşabilir misiniz?
      a: Yetkin bir talebin ardından, değerlendirdiğiniz model için geçerli standartları, uygunluk yolunu ve mevcut belge türlerini listeleyen bir uyumluluk kapsam belgesi paylaşırız. Tam teknik dosyalar sipariş onayı sonrası NDA altında paylaşılır.
    - q: Gövde Tanımlama Numarası (HIN) nedir ve dahil mi?
      a: HIN, her teknede kalıcı olarak işaretlenen ve üretici kodunu (MIC), model adını, üretim yılını ve seri numarasını kodlayan 14 karakterlik benzersiz bir tanımlayıcıdır. AB pazarına sunulan tüm RIB tekneleri için zorunludur ve her Paddle Board Overstock RIB üzerinde bulunur.
    - q: Teknik dosyalar ne kadar süre saklanır?
      a: RCD 2013/53/EU gerekliliklerine göre, üretici, ürünün pazara sunulduğu son tarihten itibaren en az 10 yıl boyunca teknik dosyayı saklamak zorundadır. Paddle Board Overstock, üretilen tüm modeller için tam teknik dokümantasyonu muhafaza eder.
    - q: RCD kapsamında ithalatçı yükümlülüklerinde yardım ediyor musunuz?
      a: 'Evet. AB ithalatçılarının yükümlülüklerini yerine getirmesi için gerekli belge paketini sağlıyoruz: teknik dosya erişimi, Uygunluk Beyanı (DoC), üretici plakası, kullanıcı kılavuzu ve ürün izlenebilirlik kayıtları. RCD kapsamındaki ithalatçı sorumlulukları uyumluluk rehberimizde açıkça belgelenmiştir.'
cta:
  title: Model spesifik bir AB uyumluluk kapsamına mı ihtiyacınız var?
  subtitle: Değerlendirdiğiniz RIB model ve konfigürasyonu için geçerli standartlar, uyumluluk yolu ve mevcut belgeler dahil ayrıntılı bir uyumluluk kontrol listesi talep edin.
  actions:
    - variant: primary
      text: Uyumluluk Belgelerini Talep Et
      href: /contact
    - text: Sertifikaları Görüntüle
      href: /certifications
