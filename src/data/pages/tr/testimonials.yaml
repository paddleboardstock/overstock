testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Sahibi, Algarve Sörf Akademisi
    location: Lagos, Portekiz
    content: Sörf okulumuz için Kulüp Başlangıç Paketi ile başladık. 20 tahta, kürekler, can yelekleri — her şey 3 hafta içinde geldi. İki sezondan sonra Pro Paketi yükselttik. Logomuzla özel marka oluşturulması profesyonel imajımız için büyük bir değişiklikti.
    rating: 5
    product: Kulüp Başlangıç Paketi
    source: solutions/clubs
  - category: clubs
    name: Kulüp Sahibi
    title: Su Sporları Kulübü
    location: Phuket, Tayland
    content: Kulüp Başlangıç Paketi mükemmel bir başlangıç noktasıydı. İşimiz büyüdükçe, Paddle Board Overstock de bizimle birlikte büyüdü — aynı kalite, aynı fiyatlandırma, sürpriz yok. 18 ayda 10’dan 80 tahtaya kadar büyüdük.
    rating: 5
    product: Kulüp Başlangıç + Premium Paket
    source: success-stories
  - category: resorts
    name: Tatil Köyü Genel Müdürü
    title: 5 Yıldızlı Plaj Tatil Köyü
    location: Yunanistan
    content: Paddle Board Overstock sadece tahtaları teslim etmedi — bize tamamen bir misafir deneyimi oluşturmamızda yardımcı oldu. Su sporları programımız bir sezonda sıfırdan tatil köyünün en önemli etkinliklerinden biri haline geldi. Haftada 300+ rezervasyon ve yıllık 180.000$ gelir.
    rating: 5
    product: Tatil Köyü Premium Paketi
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Misafir Deneyimi Direktörü, Azure Bay Resorts
    location: Phuket, Tayland
    content: Paddle Board Overstock üç tatil köyü tesisimizdeki tüm plaj etkinliği programımızı tasarladı ve donattı. 120 SUPs, güvenlik altyapısı ve personel eğitimi — hepsi tek bir sevkiyatla teslim edildi. İlk sezonda misafir katılımı %60 arttı.
    rating: 5
    product: Tatil Köyü Premium Paketi
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Sahibi, Lakeland SUP Kiralama
    location: Ontario, Kanada
    content: Yerel bir dükkandan 5 tahta kiralıyordum ve gelirimin %60’ını onlara kaptırıyordum. Paddle Board Overstock bana kendi 15 SUPs filomu oluşturmamda yardımcı oldu. ROI hesaplayıcısı dört ayda başa baş noktasını gösteriyordu — 3 ayda başardık. Şimdi 30 tahtaya genişliyorum.
    rating: 5
    product: Filo Başlangıç Kiti
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Operasyon Direktörü, Adriatic Adventure Tours
    location: Dubrovnik, Hırvatistan
    content: Tüm SUP kiralık filomuzu Paddle Board Overstock boardlarla donattık — üç tesiste toplam 30 board. İki sezon geçti, sıfır arıza. Her partideki tutarlı kalite seçimimizi kolaylaştırdı ve ekipleri renkleri markamıza bile uyarladı.
    rating: 5
    product: Kiralık Filo Paketi
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Sahibi, Lake Garda SUP Kiralama
    location: Lake Garda, İtalya
    content: Kiralık boardlarımız yoğun sezonda günde beş kez çıkıyor. Paddle Board Overstock'ye geçtikten sonra hasar şikayetleri neredeyse sıfıra düştü ve müşteriler kendi boardlarını nereden alabileceklerini sürekli soruyor.
    rating: 5
    product: Kiralık Filo Paketi
    source: solutions/rental-business
  - category: consumers
    name: Sara K.
    title: İlk kez SUP Sahibi
    location: Lake Tahoe, ABD
    content: Tam bir acemi için bile stabil. İlk gün gölde denedim ve hiç düşmedim. Pompa ve kürekle birlikte gelen tam paket sayesinde kutuyu açtıktan 20 dakika sonra suya çıkmış oldum.
    rating: 5
    product: SUP Kaşif 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 Sahibi
    location: Vancouver, Kanada
    content: İlk kez alıcı olarak yurtdışından sipariş vermekten tedirgindim. Kutuyu açar açmaz yapı kalitesi kendini gösterdi — sert, kusursuz dikişler ve sadece 6 günde teslimat.
    rating: 5
    product: SUP Kaşif 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Haftasonu Paddlecısı
    location: Florida, ABD
    content: Sağlam yapı kalitesi. Şişme olmasına rağmen kıyı dalgalarıyla başa çıkmada beklediğimden çok daha iyi. Hafta sonu gezisi için arabamın bagajına koydum — rampada 4 dakikadan kısa sürede şişirdi.
    rating: 5
    product: SUP Tropical Breeze
