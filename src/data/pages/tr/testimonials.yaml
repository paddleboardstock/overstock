testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Sahibi, Algarve Sörf Akademisi
    location: Lagos, Portekiz
    content: Sörf okulumuz için Kulüp Başlangıç Paketi ile başladık. 20 tahta, kürekler, can yelekleri — her şey 3 hafta içinde geldi. İki sezondan sonra Pro Paketi yükselttik. Logomuzla özel marka oluşturulması profesyonel imajımız için büyük bir değişiklikti.
    rating: 5
    product: Kulüp Başlangıç Paketi
    source: solutions/clubs
  - category: clubs
    name: Kulüp Sahibi
    title: Su Sporları Kulübü
    location: Phuket, Tayland
    content: Kulüp Başlangıç Paketi mükemmel bir giriş noktasıydı. İşimiz büyüdükçe, Aquafarer bizimle birlikte büyüdü — aynı kalite, aynı fiyatlandırma, sürpriz yok. 18 ay içinde 10 tahtadan 80 tahtaya çıktık.
    rating: 5
    product: Kulüp Başlangıç + Premium Paket
    source: success-stories
  - category: resorts
    name: Tatil Köyü Genel Müdürü
    title: 5 Yıldızlı Plaj Tatil Köyü
    location: Yunanistan
    content: Aquafarer sadece tahtaları teslim etmedi — tam bir konuk deneyimi oluşturmamıza yardımcı oldu. Su sporları programımız bir sezonda sıfırdan tatil köyünün öne çıkan etkinliğine dönüştü. Haftalık 300+ rezervasyon ve yıllık 180.000$ gelir.
    rating: 5
    product: Tatil Köyü Premium Paketi
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Misafir Deneyimi Direktörü, Azure Bay Resorts
    location: Phuket, Tayland
    content: Aquafarer üç tatil köyü mülkümüzün tüm sahil aktivite programını tasarladı ve donattı. 80 SUPs, 40 kano, güvenlik altyapısı ve personel eğitimi — hepsi tek bir sevkiyatla teslim edildi. Misafir katılımı ilk sezonda %60 arttı.
    rating: 5
    product: Tatil Köyü Premium Paketi
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Kurucu, Shoreline Paddle Co.
    location: Kaliforniya, ABD
    content: Sıfır sektör deneyimiyle SUP markamı başlattım. Aquafarer ekibi beni ürün seçimi, özel logo tasarımı ve ambalajlamadan yönlendirdi. İlk konteynerim 11 hafta içinde geldi ve Amazon'da 3 ay içinde tükendi.
    rating: 5
    product: Başlangıç Marka Başlatma
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Kurucu
    title: Avustralya SUP Markası
    location: Avustralya
    content: Marka fikrim vardı ama üretim bilgim sıfırdı. Aquafarer tüm süreç boyunca adeta elimi tuttu — doğru pano tasarımını seçmekten ilk siparişimi kutusundan çıkarmaya kadar. Hayalden teslimata 90 gün.
    rating: 5
    product: Marka Lansman Paketi
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Sahibi, Lakeland SUP Kiralama
    location: Ontario, Kanada
    content: Yerel bir dükkândan 5 board kiralıyordum ve gelirimin %60'ını onlara kaybediyordum. Aquafarer bana 15 SUPs içeren kendi filomu kurmamda yardımcı oldu. ROI hesaplayıcısı 4 ayda başa baş gösteriyordu — gerçekte 3 ayda gerçekleşti. Şimdi 30 boarda genişliyorum.
    rating: 5
    product: Filo Başlangıç Kiti
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Operasyon Direktörü, Adriatic Adventure Tours
    location: Dubrovnik, Hırvatistan
    content: Tüm kiralama filomuzu Aquafarer RIBs ile donattık — üç lokasyonda 12 tekne. İki sezon geçti, sıfır arıza. CE sertifikasyon belgeleri sigorta onayını sorunsuz hale getirdi. Mühendislik ekipleri hatta tüp renklerini özel olarak tasarladı.
    rating: 5
    product: Filo Genişletme Kiti
    source: trust
  - category: rental
    name: Tuğamiral Andres Reyes
    title: Deniz Tedarik Görevlisi, Filipin Sahil Güvenlik Yardım Birimi
    location: Manila, Filipinler
    content: Kıyı devriye filomuzda 24 Aquafarer RIBs işletiyoruz. Onların QC süreci her partide tutarlıdır — aynı dikiş kalitesi, aynı vana yerleşimi, her seferinde aynı basınç derecesi. Ekipmanın hayata bağlı olduğu durumlarda bu tekrarlanabilirlik önemlidir.
    rating: 5
    product: RIB Devriye Filosu
    source: trust
  - category: consumers
    name: Sarah K.
    title: İlk kez SUP Sahibi
    location: Lake Tahoe, ABD
    content: Tam bir acemi için bile stabil. İlk gün gölde denedim ve hiç düşmedim. Pompa ve kürekle birlikte gelen tam paket sayesinde kutuyu açtıktan 20 dakika sonra suya çıkmış oldum.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 Sahibi
    location: Vancouver, Kanada
    content: İlk kez alıcı olduğum için yurtdışından sipariş verirken kalite konusunda endişeliydim. Daha sormadan paylaştıkları ISO belgeler ve üçüncü taraf test raporları bana tam güven verdi. Board 6 gün içinde ulaştı ve beklentilerimi aştı.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Rekreasyonel Kano Kullanıcısı
    location: Florida, ABD
    content: Sağlam yapı kalitesi. Şişme olmasına rağmen kıyı dalgalarıyla başa çıkmada beklediğimden çok daha iyi. Hafta sonu gezisi için arabamın bagajına koydum — rampada 4 dakikadan kısa sürede şişirdi.
    rating: 5
    product: Şişme Kano
