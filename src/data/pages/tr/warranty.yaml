label: Garanti
headline: Paddle Board Overstock Üretici Sınırlı Garantisi
subtitle: Paddle Board Overstock SUP Ürettiğimiz her şişme kartın kalitesinin arkasında durur. Bu Sınırlı Garanti, kartınız için şartları ve kapsamı Paddle Board Overstock belirler.
seo:
  headline: Paddle Board Overstock SUP Garanti — 2 Yıl Sınırlı Garanti | Paddle Board Overstock
  description: Her Paddle Board Overstock drop-stitch kartta dikişler, ray yapısı, şişme vanaları ve dahil edilen aksesuarları kapsayan 2 yıllık sınırlı garanti SUP sunar. Tam şartlar ve koşullar.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Bu Sınırlı Garanti, Paddle Board Overstock doğrudan çevrimiçi mağazadan satın alınan yeni markalı şişme SUP kartlar için geçerlidir Paddle Board Overstock . Yürürlüğe girme tarihi, orijinal satın alınmanın doğrulanabilir tarihidir.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Garanti kapsamı ve süresi</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Yıl</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Çekirdek ve güverte yapısı</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Yıl</h3>
          <p class="text-sm text-gray-600 mt-1">Ray ve dikiş yapısı</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Yıl</h3>
          <p class="text-sm text-gray-600 mt-1">Şişlik vana işlevselliği</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Yıl</h3>
          <p class="text-sm text-gray-600 mt-1">Dahil olan aksesuarlar (pompa, kürek, tasma, kanat)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Yıl*</h3>
          <p class="text-sm text-gray-600 mt-1">Ticari, kiralama veya filo kullanımı — tüm bileşenler</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Ticari, kiralık veya filo kullanımı garantiyi 1 yıla indirir. Yarış veya yarış kullanımı garantiyi tamamen geçersiz kılar.</p>
    </div>

    <h2>Neler Kapsama Alınıyor</h2>
    <h3>Drop-Stitch Çekirdek ve Güverte Yapısı (2 Yıl)</h3>
    <p>drop-stitch Kartın iç çekirdeği ve dış yapısı, kartın operasyonel enflasyon ve sertliği koruma yeteneğini tehlikeye atan üretim hatalarına karşı garantilidir.</p>

    <h3>Ray ve Dikiş İnşası (2 Yıl)</h3>
    <p>Üretim sırasında birleştirilen dikişler ve üç katmanlı ray bantları, dikişten önemli hava sızıntılarına yol açan üretim hatalarına karşı garantilidir. Uygun şişirme basınçlarının periyodik denetimi ve korunması, kapsama koşullarıdır.</p>

    <h3>Şişlik Valfi Fonksiyonelliği (2 Yıl)</h3>
    <p>Paddle Board Overstock tarafından fabrikanın ilk kurulumunda takılan hava şişirme valfleri, hava tutmasını engelleyen malzeme veya işçilik kaynaklı üretim hatalarına karşı garanti kapsamındadır.</p>

    <h3>Dahil Aksesuarlar (2 yıl)</h3>
    <p>Tahta paketinizle birlikte gelen pompa, ayarlanabilir kürek, tasma, çıkarılabilir kanat ve diğer bileşenler, malzeme ve işçilik kusurlarına karşı garantilidir.</p>

    <h2>Neler Kapsamsızdır</h2>
    <ul>
      <li>Renk değişikliği, lekelenme, solma, tebeşir veya görünümdeki herhangi bir değişiklik gibi kozmetik kusurlar</li>
      <li>Delikler, kesikler, yırtıklar, yırtıklar veya diğer fiziksel hasarlar</li>
      <li>Aşınma, çatlama, aşınma, sürtünme veya sürtünme veya temas nedeniyle bozulma</li>
      <li>UV Işık maruziyeti, hava koşulları veya atmosfer koşullarından kaynaklanan bozulma</li>
      <li>Çözücüler, asitler, alkaliler veya kimyasallarla temastan kaynaklanan hasar</li>
      <li>İhmal, uygunsuz kullanım, kötüye kullanım, kaza veya normal aşınma nedeniyle hasar</li>
      <li>Darbeden, stresten, uygunsuz destekten veya taşımadan kaynaklanan hasar</li>
      <li>Yanlış enflasyon/deflasyon veya onaylanmamış şişirme cihazlarının kullanımı nedeniyle hasar</li>
      <li>Üçüncü parti ekipman, bileşenler veya sistemler (ilgili üreticileri tarafından kapsanır)</li>
    </ul>

    <h2>Üreticinin Yükümlülüğü ve Çözümü</h2>
    <p>Paddle Board Overstock'ın tek ve münhasır yükümlülüğü, bu garanti kapsamında malzeme veya işçilik kusuru olarak belirlenen herhangi bir bileşenin, Paddle Board Overstock'in seçimine göre onarımı veya değiştirilmesidir. Onarım veya değişimler Paddle Board Overstock veya onun yetkilendirdiği servis tesisi tarafından gerçekleştirilir. Onarılan veya değiştirilen bileşenler yalnızca orijinal garanti süresinin bitmemiş kısmı için garanti kapsamındadır.</p>

    <h2>Garanti Koşulları</h2>
    <ul>
      <li><strong>Bakım:</strong>Ürün, uygun şişirme basınçlarının periyodik olarak kontrol edilmesi ve bakımının yapılması dahil olmak üzere Paddle Board Overstock'ın yayınlanan yönergelerine uygun şekilde bakım yapılmalıdır.</li>
      <li><strong>İşbirliği:</strong>Alıcı, garanti talepleriyle ilgili tüm konularda Paddle Board Overstock ile tam ve zamanında işbirliği yapmak zorundadır.</li>
      <li><strong>Orijinal Alıcı:</strong>Bu garanti yalnızca orijinal son kullanıcı alıcısına genişletilmiş olup, devredilemez.</li>
    </ul>

    <h2>Ticari Kullanım</h2>
    <p>Ürün ticari, kiralama veya filo amaçlı kullanılıyorsa, tüm bileşenler için garanti süresi, satın alma tarihinden itibaren bir (1) yıla düşürülür. Yarış, hız veya dayanıklılık yarışmalarında kullanım, garantiyi derhal ve geri dönülmez şekilde tamamen geçersiz kılar.</p>

    <h2>Garanti Talebi Nasıl Yapılır</h2>
    <p>Satın alma belgesi ve sorunun detaylı açıklaması ile Paddle Board Overstock ile iletişime geçin. Paddle Board Overstock, talebi inceleyerek inceleme ve servis için talimatlar sağlayacaktır.</p>
    <p>Garanti hizmeti soruları için lütfen bizimle iletişime geçin.<a href="/contact" class="text-sky-600 underline">İletişim sayfası</a>Sipariş numaranız ve ürün detaylarınızla birlikte.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Bu garanti beyanı, eksiksiz Paddle Board Overstock Üretici Sınırlı Garantisi'nin bir özetidir. Tüm garanti şart ve koşullarını belirleyen tam yasal garanti belgesidir. Teknik özellikler önceden haber verilmeksizin değiştirilebilir. Paddle Board Overstock, Paddle Board Overstock Weihai Üretim Merkezi'nin bir fabrika markasıdır.
    </p>
