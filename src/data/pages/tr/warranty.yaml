label: Garanti
headline: Paddle Board Overstock Üretici Sınırlı Garantisi
subtitle: Paddle Board Overstock Ürettiğimiz her şişme deniz ürününün kalitesinin arkasında durur. Bu Sınırlı Garanti, ürününüz için şartları ve kapsamı Paddle Board Overstock belirler.
seo:
  headline: Paddle Board Overstock Şişme Tekne Garantisi — 5 Yıl Sınırlı Garanti | Paddle Board Overstock
  description: Paddle Board Overstock birincil boru kumaşı, dikişleri ve fiberglas gövde yapısal bütünlüğü için 5 yıllık sınırlı garanti sunar. Ayrıca şişirme valfleri ve fabrikada kurulan aksesuarları da kapsar. Paddle Board Overstock Şişme bot garantisi için tam şartlar ve koşullar.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Bu Sınırlı Garanti, Paddle Board Overstock doğrudan yetkili bir bayi veya perakendeciden satın alınan yeni markalı şişme deniz ürünleri için geçerlidir Paddle Board Overstock Paddle Board Overstock . Yürürlüğe girme tarihi, orijinal perakende satın alınmanın doğrulanabilir tarihidir.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garanti kapsamı ve süresi</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Yıl</h3>
        <p class="text-sm text-gray-600 mt-1">Birincil tüp dokusu bütünlüğü (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Yıl</h3>
        <p class="text-sm text-gray-600 mt-1">Fiberglas gövde yapısal bütünlüğü</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Yıl</h3>
        <p class="text-sm text-gray-600 mt-1">Şişirilebilir boru dikişli hava tutma kapasitesi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Yıl</h3>
        <p class="text-sm text-gray-600 mt-1">Şişlik vana işlevselliği</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Yıl</h3>
        <p class="text-sm text-gray-600 mt-1">Fabrikada kurulan aksesuarlar ve yardımcı donanımlar</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Yıl*</h3>
        <p class="text-sm text-gray-600 mt-1">Ticari, kiralama veya filo kullanımı — tüm bileşenler</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Ticari, devlet, charter, kiralama veya eğitim amaçlı kullanım, garantiyi 1 yıla indirir. Yarış veya yarış kullanımı garantiyi tamamen geçersiz kılar.</p>
  </div>

  <h2>Neler Kapsama Alınıyor</h2>
  <h3>Birincil Tüp Kumaşı (5 Yıl)</h3>
  <p>ana Paddle Board Overstock tüp kumaşını, ürünün operasyonel enflasyonu sürdürme yeteneğini önemli ölçüde tehlikeye atan gözeneklilik bozulmasına karşı garanti eder. Bu, CSM (Hypalon) kaplı kumaş ve üretimde kullanılan diğer tüm tüp kumaş malzemeleri için geçerlidir.</p>

  <h3>Fiberglas Gövde Yapısal Bütünlüğü (5 Yıl)</h3>
  <p>Fiberglas takviyeli plastik (FRP) gövdeli ürünlerde, temel kompozit yapı, malzeme veya işçilikteki kusurlar nedeniyle yapısal arızalara karşı garantilidir.</p>

  <h3>Şişirilebilir Boru Dikişli Hava Tutma Kapasitesi (5 Yıl)</h3>
  <p>Şişirilebilir tüplerin dikişleri, üretim sırasında birleştirildiğinde, dikişten önemli hava sızıntısına yol açan üretim hatalarına karşı garantilidir. Uygun şişirme basınçlarının periyodik denetimi ve korunması, kapsam koşullarıdır.</p>

  <h3>Şişlik Valfi Fonksiyonelliği (5 Yıl)</h3>
  <p>Başlangıçta takılan hava şişme vanaları Paddle Board Overstock , valfin havayı tutmasını engelleyen malzemeler veya işçilikteki üretim hatalarına karşı garantilidir.</p>

  <h3>Fabrikada Kurulan Aksesuarlar (1 Yıl)</h3>
  <p>Paddle Board Overstock Fabrikada üretilen ve orijinal olarak kurulan bileşenler ve donanımlar, malzeme ve işçilikteki kusurlara karşı bir yıl garantilidir. Bu, yalnızca üretici garantileriyle kapsanan üçüncü taraf ürünleri kapsama girmez.</p>

  <h2>Neler Kapsamsızdır</h2>
  <ul>
    <li>Renk değişikliği, lekelenme, solma, tebeşir veya görünümdeki herhangi bir değişiklik gibi kozmetik kusurlar</li>
    <li>Delikler, kesikler, yırtıklar, yırtıklar veya diğer fiziksel hasarlar</li>
    <li>Aşınma, çatlama, aşınma, sürtünme veya sürtünme veya temas nedeniyle bozulma</li>
    <li>UV Işık maruziyeti, hava koşulları veya atmosfer koşullarından kaynaklanan bozulma</li>
    <li>Yakıtlar, çözücüler, asitler, alkaliler veya kimyasallarla temastan kaynaklanan hasar</li>
    <li>İhmal, uygunsuz kullanım, kötüye kullanım, kaza veya normal aşınma nedeniyle hasar</li>
    <li>Gelkot veya boya yüzeyi sorunları (kabarma, levanma, renk değişikliği, solma)</li>
    <li>Çarpma, stres, uygunsuz destek veya römorka nedeniyle hasar</li>
    <li>Yanlış enflasyon/deflasyon veya onaylanmamış şişirme cihazlarının kullanımı nedeniyle hasar</li>
    <li>Üçüncü parti ekipman, bileşenler veya sistemler (ilgili üreticileri tarafından kapsanır)</li>
  </ul>

  <h2>Üretici Yükümlülüğü ve Çözüm</h2>
  <p>Paddle Board OverstockTek ve münhasır yükümlülüğü, Paddle Board Overstockmalzeme veya işçilik açısından kusurlu olduğu tespit edilen ve bu garanti kapsamında kapsanan herhangi bir bileşenin isteğe bağlı olarak onarılması veya değiştirilmesini sağlamaktır. Onarım veya değişimler, Paddle Board Overstock onun belirlenmiş yetkili servis tesisi tarafından yapılır. Tamir edilen veya değiştirilen bileşenler, yalnızca orijinal garanti süresinin sona ermiş kısmı için garanti edilir.</p>

  <h2>Garanti Koşulları</h2>
  <ul>
    <li><strong>Kayıt:</strong>Ürün, garanti şartlarında belirtildiği gibi doğru şekilde kaydedilmiş olmalıdır.</li>
    <li><strong>Bakım:</strong>Ürün, Paddle Board Overstockyayımlanan yönergelere uygun olarak bakıma devam etmelidir; periyodik denetim ve uygun enflasyon basıncının korunması dahildir.</li>
    <li><strong>İşbirliği:</strong>Alıcı, Paddle Board Overstock garanti talepleriyle ilgili tüm konularda tam ve derhal iş birliği yapmalıdır.</li>
    <li><strong>Orijinal Alıcı:</strong>Bu garanti yalnızca orijinal son kullanıcı alıcısına genişletilmiş olup, devredilemez.</li>
  </ul>

  <h2>Ticari Kullanım</h2>
  <p>Ürün ticari, devlet, kar amacı gütmeyen kuruluş, charter, kiralama, eğitim veya özel eğlence amaçlı kullanım dışında herhangi bir amaçla kullanılıyorsa, tüm bileşenler için garanti süresi orijinal perakende satın alma tarihinden itibaren bir (1) yıla indirilir. Yarış, hız veya dayanıklılık yarışlarında hemen ve geri dönülmez şekilde kullanım garantisini tamamen geçersiz kılar.</p>

  <h2>Garanti Talebi Nasıl Yapılır</h2>
  <p>Paddle Board Overstock Satın alma kanıtı ve sorunun ayrıntılı açıklamasını içeren yetkili bayinizle iletişime geçin.Paddle Board Overstock Talebi inceleyecek ve inceleme ile servis talimatları verecektir.</p>
  <p>Garanti hizmeti soruları için lütfen bizimle iletişime geçin.<a href="/contact" class="text-sky-600 underline">İletişim sayfası</a>Sipariş numaranız ve ürün detaylarınızla birlikte.</p>

  <h2>Üçüncü Parti Ürünler</h2>
  <p>Üçüncü taraflar tarafından üretilen ekipman, bileşenler veya sistemler (hatta kurulmuş Paddle Board Overstockolsa bile) yalnızca kendi üreticisi tarafından sunulan garantilerle örtülüdür.Paddle Board Overstock Bu tür üçüncü taraf ürünler için herhangi bir garanti sorumluluğunu açıkça reddeder.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Bu garanti beyanı, Üreticinin Sınırlı Garantisi'nin tam bir özetidir Paddle Board Overstock . Tüm yasal garanti belgesi tüm garanti şartlarını ve koşullarını yönetir. Spesifikasyonlar bildirim olmadan değiştirilebilir.Paddle Board Overstock Paddle Board Overstock Qingdao Üretim Merkezi'nin fabrika markasıdır.
  </p>
