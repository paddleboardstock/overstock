testimonial:
  content: Portekiz’deki sörf okulumuz için Club Starter Paketi ile başladık. 20 board, kürek, yelek — her şey 3 hafta içinde geldi. İki sezondan sonra Pro Pakete yükselttik. Logomuzla yapılan özel markalama, profesyonel imajımız için oyun değiştirici oldu.
  name: Ricardo Santos
  title: Sahibi, Algarve Surf Akademisi — Lagos, Portekiz
content_segments:
  tagline: Kulüp Profilleri
  title: Su Sporları Kulüp Çözümleri<br />Kulüp Türüne Göre
  subtitle: Üniversite kürek kulüplerinden özel yat kulüplerine kadar — her kulüp türünün benzersiz ekipman ihtiyaçları, kullanım desenleri ve bütçe yapıları vardır. Her paketi kulüp modeline uygun şekilde özelleştiriyoruz.
  items:
    - title: Üniversite ve Kolej Kürek Kulüpleri
      subtitle: Yüksek kullanım öğrenci filoları
      description: Öğrenci yönetimli veya kurum destekli paddle kulüpleri, üniversite rekreasyon bölümleri için SUP programları yürütmektedir. Ekipman her dönem boyunca çeşitli beceri seviyelerinde yüksek frekanslı ve yüksek devirli kullanım görmektedir. Dayanıklılık ve kolay tamir edilebilirlik kritik öneme sahip olup, öğrenci organizasyonları için bütçe dostu fiyatlandırma da önemlidir.
      features:
        - Öğrenci kullanım döngüleri için derecelendirilmiş ekstra dayanıklı PVC yapı
        - Filoyu kolay yönetmek için beceri seviyelerine göre renk kodlu board aralıkları
        - Her sipariş ile birlikte acil video destekli + onarım kiti dahil
        - Öğrenci organizasyonları için indirimli fiyatlar ve dönem bazlı ödeme koşulları
    - title: Topluluk Kürek ve Sosyal Kulüpler
      subtitle: Üyelik temelli rekreasyon kulüpleri
      description: Topluluk tabanlı kulüpler, üyelere SUP ve sosyal kürek deneyimleri sunar. Ekipman, geniş yaş aralığı için performans ve konfor arasında denge sağlamalıdır; ayrıca kulüp kimliğini ve üye gururunu pekiştiren marka özelliklerine sahip olmalıdır. Sınırlı sahil erişimiyle çalışan kulüpler için depolama verimliliği önemlidir.
      features:
        - 'Karışık filo: çok amaçlı ve tur SUPs'
        - 'Tam kulüp markalaması: özel renkler, logo baskısı, markalı can yelekleri'
        - Şişme ekipmanlar için kompakt depolama çözümleri
        - 'Üyelik artış başlatıcı kiti: referans kartları, markalı fotoğrafçılık'
    - title: Sörf Okulları ve SUP Akademileri
      subtitle: Kıyı performansı ve koçluk
      description: Sörf odaklı okullar, SUP sörf ve dalga sürme becerilerini öğretir. Ekipman, sörf koşullarında performans göstermeli — manevra kabiliyeti yüksek, tepki veren ve tekrar eden düşüşler, kum aşındırması ve tuzlu suya maruz kalmaya karşı yeterince dayanıklı olmalıdır.
      features:
        - Dalgalarda manevra kabiliyeti için daha kısa, geniş SUP şekilleri
        - Dalgalarda darbeye dayanıklılık için güçlendirilmiş kenar yapısı
        - 'Sörfe özgü güvenlik ekipmanları: spiral kayışlar, yumuşak yüzgeç seçenekleri'
        - Sezonluk takas indirimleri ile filo değiştirme programı
    - title: Kurumsal ve Özel Yat Kulüpleri
      subtitle: Premium üye deneyimleri
      description: Üyelere su sporlarını premium bir ayrıcalık olarak sunan özel kulüpler. Ekipman standartları yüksek — estetik, marka uyumu ve misafir hazır sunum performans kadar önemlidir. Hizmet beklentileri arasında beyaz eldiven teslimatı, özel depolama çözümleri ve konsiyerj düzeyinde destek bulunur.
      features:
        - Ahşap dokulu EVA ve metalik detaylarla premium bitişli tahtalar
        - Kulüp marka yönergelerine özel renk eşleştirme
        - 'Konsiyerj teslimatı: her sezon için önceden şişirilmiş, düzenlenmiş ve etiketlenmiş'
        - Öncelikli yanıt SLA ile özel hesap yönetimi
