tests:
  - title: Basınç Testi
    standard: İç Spesifikasyon AF-PT-001
    description: Şişirilebilir odalar, önerilen çalışma sınırının 1,25 katına kadar basınçlandırılır ve 30 dakika boyunca tutulur. Basınç düşüşü, malzemelerin ve dikişlerin hava geçirmezliği ve yapısal bütünlüğünü doğrulamak için ölçülür.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Etki Testi
    standard: Dahili Teknik AF-IT-002
    description: Ürünler, standart düşürme ağırlıkları ve sarkaç cihazlarından kontrollü darbelere maruz kalır. Bu yöntem, engeller, iskeleler ve enkazlarla çarpışmalara karşı delme direnci, yırtık yayılımı ve yapısal dayanıklılık değerlendirilir.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Direnç Testi
    standard: İç Test Protokolü
    description: Malzeme örnekleri, hızlandırılmış hava koşulları odalarında UVA-340 lambalarına 1.000 saat boyunca maruz+ bırakılır. Dengeleyici paketlerini doğrulamak için renk değişimi (Delta E), parlak tutma ve çekme dayanımı kaybını UV ölçürüz.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Aşınmaya Dayanıklılık Testi
    standard: İç Test Protokolü
    description: Malzeme örnekleri, 500g/1.000g yük altında 1.000 döngü boyunca CS-10 aşındırıcı tekerleklere maruz bırakılır. Kütle kaybı ve görsel aşınma derecelendirmesi, kaplamanın kum, çakıl ve tekrar fırlatmaya karşı dayanıklılığını belirler.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Düşük Sıcaklık Performans Testi
    standard: Dahili Spesifikasyon AF-LT-003
    description: Montajlı ürünler ve malzeme numuneleri -20°C, -10°C ve 0°C’de 24 saat boyunca şartlandırılır ve ardından esneme testine tabi tutulur. PVC’ın çatlama veya delaminasyon olmadan esnek kalıp kalmadığını doğrularız.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Kaldırma Kuvveti ve Yük Kapasitesi Testi
    standard: İç Test Protokolü
    description: Ürünler, kontrollü bir havuzda 1,25x nominal kapasiteye kademeli olarak yüklenir. Serbest tahta, stabilite ve kendi kendini boşaltma performansı kaydedilir. Her modelin nominal kapasitesi matematiksel ve ampirik olarak doğrulanır.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Manevra Kabileti Testi
    standard: Dahili Teknik Özellikler AF-MT-004
    description: Su üzerindeki denemeler, dönüş yarıçapı, ivme, planlama süresi ve çeşitli yük koşullarında kürek/motor tepkisini ölçür. Gerçek dünya kullanım özellikleri tasarım hedefleri karşısında doğrulanır.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Su Geçirmezlik Testi
    standard: Dahili Spesifikasyon AF-WT-005
    description: Monte edilen her ürün, tüm dikişler, vanalar ve bağlantı yerlerinde 0.5 bar sprey testinden geçirilir. 5 dakikalık basınçlı batma testi, kamre ve valf su geçirmezliğini doğrular. Gönderime öncesi sıfır sızıntı standardı.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: Test Prosedürleri
  title: Her Aşamada Titiz Testler
commitment:
  title: Bağlılığımız
  body: Bu titiz test prosedürleri sayesinde, {SITE} müşterilerine şişme SUP panolarımızın sadece yüksek performanslı olmakla kalmayıp aynı zamanda uzun ömürlü olduğunu, böylece suda sayısız keyifli ve güvenli macerayı garanti ettiğini sağlar. Kalite laboratuvarımız üretimden bağımsız olarak çalışır ve doğrudan yönetime rapor verir.
  cta: Test dokümantasyonu talep etme
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock, basınç, darbe, UV, aşınma, düşük sıcaklık, yüzdürme, manevra kabiliyeti ve su geçirmezlik kapsayan 8 protokollü bir kalite test programını yürütmektedir. Son 12 aylık sevkiyatlarda %99,3 kusursuz ürün oranı.
  points:
    - '8 test protokolü: basınç, darbe, UV, aşınma, düşük sıcaklık, yüzdürme, manevra kabiliyeti ve su geçirmezlik'
    - Son 12 aylık sevkiyatlarda %99,3 hata oranı yok
    - Her birim, nominal basıncın 1,25 katı ile 24-48 saat tutulur ve maksimum %5 düşüş toleransı vardır
    - UV hızlandırılmış hava koşullarına dayanıklılık testi (1.000+ saat) ve kaplama aşınma direnci testi
