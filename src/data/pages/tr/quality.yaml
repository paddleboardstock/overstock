tests:
  - title: Basınç Testi
    standard: ISO 6185-1 | Dahili Teknik AF-PT-001
    description: Şişirilebilir odalar, önerilen çalışma sınırının 1,25 katına kadar basınçlandırılır ve 30 dakika boyunca tutulur. Basınç düşüşü, malzemelerin ve dikişlerin hava geçirmezliği ve yapısal bütünlüğünü doğrulamak için ölçülür.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Etki Testi
    standard: Dahili Teknik AF-IT-002
    description: Ürünler, standart düşürme ağırlıkları ve sarkaç cihazlarından kontrollü darbelere maruz kalır. Bu yöntem, engeller, iskeleler ve enkazlarla çarpışmalara karşı delme direnci, yırtık yayılımı ve yapısal dayanıklılık değerlendirilir.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Direnç Testi
    standard: ASTM G154 |ISO 4892-3
    description: Malzeme örnekleri, hızlandırılmış hava koşulları odalarında UVA-340 lambalarına 1.000 saat boyunca maruz+ bırakılır. Dengeleyici paketlerini doğrulamak için renk değişimi (Delta E), parlak tutma ve çekme dayanımı kaybını UV ölçürüz.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Aşınmaya Dayanıklılık Testi
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Malzeme örnekleri, 500g/1.000g yük altında 1.000 döngü boyunca CS-10 aşındırıcı tekerleklere maruz bırakılır. Kütle kaybı ve görsel aşınma derecelendirmesi, kaplamanın kum, çakıl ve tekrar fırlatmaya karşı dayanıklılığını belirler.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Düşük Sıcaklık Performans Testi
    standard: Dahili Teknik Özellikler AF-LT-003 | MIL-STD-810G
    description: Monte edilen ürünler ve malzeme kuponları 24 saat boyunca -20°C, -10°C ve 0°C sıcaklıklarında kondisyon yapılıyor ve ardından esnek testlerden geçiyor. Bunu PVC doğruluyoruz ve Hypalon çatlama veya delaminasyon olmadan esnek kalıyoruz.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Kaldırma Kuvveti ve Yük Kapasitesi Testi
    standard: ISO 6185-1 |ISO 12402
    description: Ürünler, kontrollü bir havuzda 1,25x nominal kapasiteye kademeli olarak yüklenir. Serbest tahta, stabilite ve kendi kendini boşaltma performansı kaydedilir. Her modelin nominal kapasitesi matematiksel ve ampirik olarak doğrulanır.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Manevra Kabileti Testi
    standard: Dahili Teknik Özellikler AF-MT-004
    description: Su üzerindeki denemeler, dönüş yarıçapı, ivme, planlama süresi ve çeşitli yük koşullarında kürek/motor tepkisini ölçür. Gerçek dünya kullanım özellikleri tasarım hedefleri karşısında doğrulanır.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Su Geçirmezlik Testi
    standard: ISO 6185-1 §7.3 | Dahili Teknik Özellikler AF-WT-005
    description: Monte edilen her ürün, tüm dikişler, vanalar ve bağlantı yerlerinde 0.5 bar sprey testinden geçirilir. 5 dakikalık basınçlı batma testi, kamre ve valf su geçirmezliğini doğrular. Gönderime öncesi sıfır sızıntı standardı.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
