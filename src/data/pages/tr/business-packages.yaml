faq:
  title: Paket SSS
  questions:
    - q: Paketler için minimum sipariş miktarı nedir?
      a: Club Starter Paketi minimum 10 birim içerir. Resort ve Marka paketleri ihtiyaçlarınıza göre MOQs ile özelleştirilebilir.
    - q: Teslimat ne kadar sürer?
      a: Standart üretim sipariş onayından itibaren 30–45 gün sürer. Hızlandırılmış üretim ek ücret karşılığında mevcuttur.
    - q: Ekipman renklerini ve markalamayı özelleştirebilir miyim?
      a: Evet. Tüm paketlerde tam özelleştirme vardır — pano renkleri, logo baskıları ve ambalaj tasarımı.
    - q: Satış sonrası destek sağlıyor musunuz?
      a: Evet. Her paket, çevrimiçi bakım kılavuzlarımıza, video eğitimlerimize ve yedek parça sipariş sistemine erişim içerir.
