content_customer_types:
  tagline: Kime Hizmet Veriyoruz
  title: B2B Alıcıları için Üretilmiştir<br />— Perakende Alıcılar Değil
  subtitle: Paddle Board Overstock, dört farklı müşteri türü için üretim yapmaktadır. Her birinin öncelikleri farklıdır ve biz tümüne çözüm sunmaktayız.
  items:
    - title: Marka Sahipleri / Özel Etiket
      description: Özel ürün tasarımı, özel marka grafikleri, markanız altında uyumluluk belgeleri ve konseptten konteynere kadar özel mühendislik desteği.
      icon: tabler:palette
      cta: Talep OEM/ODM Teklifi
      cta_href: /request-quotation
    - title: Distribütörler / Toptancılar
      description: Bölge koruması, rekabetçi toptan fiyatlandırma, pazarlama destek kitleri, ürün eğitimi ve pazarınız için tam uyum belgeleri.
      icon: tabler:world
      cta: Bayilik Başvurusu Yap
      cta_href: /dealers-distributors
    - title: Tatil Köyleri / Kiralama Operatörleri
      description: Ticari sınıf dayanıklılık, filo boyutu tavsiyesi, karışık model konteyner siparişleri, yedek parça stratejisi ve tatil köyü markalı ekipman paketleri.
      icon: tabler:beach
      cta: Ticari Paket Al
      cta_href: /solutions/resorts
    - title: Kurtarma / Hükümet / Profesyonel
      description: Hypalon/CSM inşaatı, SOLAS uyumluluk seçenekleri, proje özelinde sertifikalandırma, ihale dokümantasyonu desteği ve NDA korumalı mühendislik.
      icon: tabler:shield
      cta: Bir Projeyi Tartış
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Yetenek
  title: Ne Alırsınız<br />Paddle Board Overstock ile
  subtitle: Tam mühendislik, kalite ve uyum desteği ile doğrudan fabrika erişimi — ticaret şirketi değil.
  columns: 2
  items:
    - title: OEM/ODM Özelleştirme
      description: Özel gövde tasarımı, boru malzemesi (PVC veya Hypalon/CSM), konsol düzeni, oturma düzeni, markalaşma, renkler ve paketleme. Küçük değişikliklerden tam özel mühendisliğe kadar.
      icon: tabler:adjustments
    - title: Düşük MOQ, Hızlı Örnekleme
      description: 'RIB: 2-5 birim (mevcut kalıp). SUP: SKU başına 5-10 birim. Özel kalıplar: 200+ birim. Markanızı taşıyan ön üretim örnekleri 7-14 gün içinde.'
      icon: tabler:rocket
    - title: Üretime Hazır Kalite
      description: Her bir ünite, PSI için 24-48 saat boyunca nominalin 1,25 katı basınca dayanıklılık testi yapılmıştır. AQL 2,5 / ISO 2859 başına %99,3 kusursuzluk oranı. Her gövde için 100 maddelik kalite kontrol listesi.
      icon: tabler:certificate
    - title: Tam Uyum Dokümantasyonu
      description: CE 2013/53/AB (RCD), ISO 9001:2015 (SGS), BSCI sosyal denetim, REACH uyumluluk, UKCA işaretleme. Modele özgü DoC ve üretici plaka verileri dahil.
      icon: tabler:file-certificate
    - title: 30-45 Gün Teslim Süresi
      description: Standart üretim 30-45 gün FOB Qingdao. Prototipler 7-14 gün. Acele üretim mevcut. Konteyner yükleme planları ve ISPM-15 ambalajlama dahil.
      icon: tabler:truck-delivery
    - title: Satış Sonrası & Yedek Parçalar
      description: Tekneler/kayaklar/RIBs için 5 yıl garanti, SUP/aksesuarlar için 2 yıl. Yedek parça tedariki öncelikli gönderim ile. Garanti talebi işleme desteği.
      icon: tabler:lifebuoy
content_categories:
  tagline: Ürün Kategorileri
  title: 5 Kategori,<br />64 CE-Onaylı Modeller
  subtitle: 2,4 m RIB ihalelerden 15 ft SUP tahtalara — tamamı Qingdao ISO 9001 tesisimizde üretilmektedir.
  items:
    - title: RIB Tekneler
      description: 2,4 m ile 7,0 m arasında alüminyum veya GRP gövdelere sahip. PVC veya Hypalon/CSM tüpler. CE 2013/53/EU uyarınca. Devriye, dalış, kurtarma ve ticari konfigürasyonlar.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Şişme Botlar
      description: 2,0 m ile 5,0 m arasında alüminyum taban, kontrplak taban veya hava-döşeme seçenekleri ile. Balıkçılık, eğlence ve yardımcı model.
      icon: tabler:sailboat
      link: /products
    - title: SUP Tahtalar
      description: 4 inç ve 6 inç Drop-Stitch ile 9ft ila 15ft. Çok amaçlı, gezi, yoga ve balıkçılık modelleri. Ticari sınıf mevcut.
      icon: tabler:swimming
      link: /products
    - title: Kano/Kajaklar
      description: 1 kişilik ila 3 kişilik şişme kanolar. Rekreasyon ve gezi modelleri Drop-Stitch taban seçenekleri ile.
      icon: tabler:kayak
      link: /products
    - title: Güvenlik Aksesuarları
      description: CE-sertifikalı can yelekleri, atma ipleri, tamir kitleri, pompalar ve seyir ışıkları. USCG Tip III/V onaylı PFD'ler.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Fabrika Gücü
  title: Denetime Hazır Üretim<br />Qingdao'da
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO 9001 Tesis — Gerçek Üretici, Ticaret Şirketi Değil</h3>
  items:
    - title: 6 Adanmış Üretim Hattı
      description: Ayrı RIB, şişme bot, SUP, kano, güvenlik ekipmanı ve OEM/ODM hatları. Her biri adanmış QC kontrol noktaları ve üretim planlaması ile.
    - title: '%100 Basınç Testi'
      description: Her şişme bölüm, dereceli PSI değerinin 1,25 katına kadar basınçlandırılır ve 24-48 saat boyunca tutulur. Test sonuçları gövde seri numarasına (HIN) bağlıdır.
    - title: Gövde Başına İzlenebilirlik
      description: 'HIN seviyesi üretim kayıtları, her gövde için 21+ veri alanı: malzeme partisi, kaynakçı kimliği, basınç test sonucu, nihai konfigürasyon ve teslimat hedefi.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² ISO 9001 üretim tesisi Qingdao'da RIB üretim hatları ile
content_compliance:
  tagline: Uyumluluk ve Kalite Kanıtı
  title: Belgelendirilmiş Kanıt,<br />Sadece İddialar Değil
  subtitle: Her uyumluluk iddiası, doğrulamanız için model özel belgelerle desteklenir.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Kalite yönetim sistemi TÜV Rheinland/SGS tarafından sertifikalandırılmıştır. Yıllık gözetim denetimleri. Gelen malzemeden sevkiyata kadar belgelenmiş QC süreçleri.
      icon: tabler:certificate
    - title: CE 2013/53/EU uyarınca (RCD)
      description: 64 model, model özel Uygunluk Beyanları ile. Uygulanabilir modüllere göre uygunluk değerlendirmesi. Her gövde için HIN kaydı ve üretici plakası verileri.
      icon: tabler:file-certificate
    - title: BSCI Sosyal Uyumluluk
      description: Yıllık BSCI denetimi SGS tarafından yapıldı. Tesisimizde etik işçi uygulamaları, işyeri güvenliği ve çevresel yönetim doğrulandı.
      icon: tabler:users
    - title: REACH & UKCA
      description: Tüm PVC ve yapıştırıcı malzemeler AB REACH yönetmeliğine uygundur. UKCA işareti Birleşik Krallık pazarı için mevcuttur. Malzeme güvenlik veri listeleri talep üzerine sağlanır.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Süreci — Özetten Konteynere
  items:
    - title: Adım 1:<span class="font-medium">Gereksinimler</span>
      description: Ürün özelliklerinizi, hedef pazarınızı, miktarınızı ve uyumluluk gereksinimlerinizi paylaşın. Mühendislik ekibimiz 48 saat içinde inceleme yapar.
      icon: tabler:file-text
    - title: Adım 2:<span class="font-medium">Teklif</span>
      description: Pazarınız için özellikler, malzeme seçenekleri, MOQ, fiyatlandırma, teslim süresi ve uyumluluk kapsamını içeren ayrıntılı bir teklif alın.
      icon: tabler:clipboard-list
    - title: Adım 3:<span class="font-medium">Prototip</span>
      description: Markanızla ön üretim örneği 7-14 gün içinde. 1,25 katı nominal basınçta tam kalite testi. Numune ücreti üretime mahsup edilir.
      icon: tabler:settings
    - title: Adım 4:<span class="font-medium">Üretim</span>
      description: Numune onayından sonra Qingdao'da 30-45 gün üretim. Süreç içi kalite kontrol noktaları, basınç testi ve her bir birim için 100 puanlık nihai denetim.
      icon: tabler:building-factory
    - title: Adım 5:<span class="font-medium">Teslimat</span>
      description: Konteyner yükleme planı, ISPM-15 ahşap sandıklama, uyum belgeleri paketi ve FOB Qingdao sevkiyatı ile tam ihracat evrakları.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM şişme bot üretim süreci, tasarımdan konteyner sevkiyatına kadar
blog_latest:
  title: Sanayi ve Teknik İçgörüler
  information: |
    RCD uyum kılavuzları, OEM/ODM süreç makaleleri, malzeme karşılaştırmaları,
    ve Paddle Board Overstock mühendislik ekibinden fabrika denetimi kaynakları.
faqs:
  title: B2B Satın Alma SSS
  subtitle: Markalar, distribütörler ve ticari işletmecilerden Paddle Board Overstock ile OEM/ODM üretimi hakkında sık sorulan sorular.
  columns: 2
  items:
    - title: Siz bir üretici misiniz yoksa ticaret şirketi mi?
      description: Biz kalite, malzeme ve teslim süreleri üzerinde tam kontrol sağlayan dikey entegrasyonlu bir fabrikayız. İşletme lisansı ve üretim kapsamı fabrika denetimi sırasında doğrulanabilir.
      icon: tabler:building-factory
      category: all
    - title: Senin OEM/ODM sürecin nedir?
      description: Gereksinimler incelemesi (48 saat) ile prototip önerisine (7-14 gün) ve üretime (30-45 gün FOB Qingdao) kadar. Tam mühendislik desteği, uyumluluk dokümantasyonu ve tüm gövde boyunca izlenebilirlik.
      icon: tabler:route
      category: all
    - title: Senin MOQ gereksinimlerin nelerdir?
      description: 'RIB tekneler: model başına 2-5 adet (mevcut kalıp), özel kalıplar için 200+. SUP panolar: SKU başına 5-10 adet. Karışık model konteyner siparişleri mevcuttur. Değerlendirme için örnek siparişler 2-5 adet olarak verilebilir.'
      icon: tabler:sort-ascending
      category: all
    - title: Hangi özelleştirme seçenekleri mevcut?
      description: Gövde tasarımı, boru malzemesi (PVC veya Hypalon/CSM), boru çapı, konsol düzeni, oturma yerleri, direksiyon, yakıt sistemi, güverte düzeni, marka renkleri, logo grafikleri, EVA ped tasarımı, perakende ambalajlama ve kullanıcı kılavuzu markalaması.
      icon: tabler:adjustments
      category: all
    - title: Pazarım için hangi uyum belgelerini sağlayabilirsiniz?
      description: CE 2013/53/AB'ye göre DoC, UKCA işaretleme, ISO 9001 sertifikası (SGS), BSCI denetim raporu, REACH uyumluluk, malzeme test raporları, basınç testi kayıtları ve modele özel üretici plakası verileri. Pazar özelinde belgeler talep üzerine sağlanır.
      icon: tabler:file-certificate
      category: all
    - title: Numune alma ve üretim teslim süresi nedir?
      description: 'Ön üretim örnekleri: 7-14 iş günü. Standart üretim: 30-45 gün FOB Qingdao. Hızlı üretim ek maliyet karşılığında mevcuttur. Yoğun sezon (Mart-Haziran) teslim sürelerini uzatabilir.'
      icon: tabler:clock
      category: all
    - title: Bir fabrika denetimi veya canlı video turu ayarlayabilir miyim?
      description: Evet. Qingdao tesisimizde yerinde fabrika denetimleri, 3-5 gün önceden bildirim ile hoşgörüyle karşılanır. WhatsApp/Zoom üzerinden canlı video turlarına hemen ulaşılabilir. Üçüncü taraf denetimleri (SGS, BV, TÜV) kabul edilir.
      icon: tabler:video
      category: all
    - title: Gönderimden önce hangi kalite kontrolleri yapılmaktadır?
      description: 1,25 kat basınç dayanım testi (24-48 saat), dikiş soyulma testi, 100 maddelik nihai kontrol listesi, boyutsal doğrulama, görsel muayene, uyum belgelerinin doğrulanması ve ambalaj bütünlüğü kontrolü. Hepsi ISO 9001 prosedürlerine uygundur.
      icon: tabler:clipboard-check
      category: all
