content_compliance:
  tagline: Kalite & Test
  title: Test Edilmiş Kalite<br />Belgelenmiş
  subtitle: Her kalite iddiası, üretim hattımızdaki basınç testleri, parti kayıtları ve ölçülen kusur oranları gibi gerçek rakamlarla desteklenmektedir.
  items:
    - title: '%100 Basınç Testinden Geçti'
      description: Her tahta 1,25x nominal PSI değerine kadar şişirilir ve gönderilmeden önce tutulur. Bir dikiş, valf veya ilmik ipliği arızalanırsa kart asla fabrikadan çıkmaz.
      icon: tabler:shield-check
    - title: '%99,3 Kusursuzluk Oranı'
      description: Her üretim partisinde ölçülür. Bu sayı pazarlamadan değil, kendi son denetim kayıtlarımızdan geliyor.
      icon: tabler:gauge
    - title: Seri İzlenebilirliği
      description: Her kart bir üretim parti kodu taşır; bu nedenle garanti talepleri ve kalite kontrolleri, kesin malzemelere ve işlemlere kadar uzanır.
      icon: tabler:clipboard-check
    - title: 2 Yıl SUP Garanti
      description: Her SUP tahta ve aksesuar 2 yıl kapsamındadır — drop-stitch dikişler, şişirme valfleri ve aksesuarlar dahil. İddialar hızlı bir şekilde çözülür.
      icon: tabler:lifebuoy
steps:
  title: Çıkıştan Suya Kadar — Siparişiniz Nasıl Gönderilir
  items:
    - title: '1. Adım: <span class="font-medium">Panonuzu Seçin</span>'
      description: Genel alan, tur, yoga ve çocuk modelleri arasından seçim yapın. Satın alma rehberlerimiz, tahta boyutu ve tarzınızı kürek çekmenize uydurmanıza yardımcı olur.
      icon: tabler:clipboard-list
    - title: '2. Adım: <span class="font-medium">Güvenli Ödeme</span>'
      description: Stripe veya PayPal ile güvenli şekilde ödeme yapın. Tüm büyük kredi ve banka kartları kabul edilir. Hesap gerekmez — sipariş onayı gelen kutunuza gelir.
      icon: tabler:file-text
    - title: '3. Adım: <span class="font-medium">Kalite Denetimi</span>'
      description: Her kart %100 basınç testinden geçer ve paketlenmeden önce tam PSI kalite kontrol listesiyle kontrol edilir.
      icon: tabler:settings
    - title: '4. Adım: <span class="font-medium">Hızlı Gönderim</span>'
      description: Stokta siparişler Weihai fabrikamızdan 2-3 iş günü içinde gönderiliyor. Acil siparişler için hızlı işlem sağlanıyor.
      icon: tabler:building-factory
    - title: '5. Adım: <span class="font-medium">Takip Edilen Teslimat</span>'
      description: Dünya çapında 50 ülkeye gönderilen gönderiler takip+ edildi. 2 yıllık garantiniz ve hızlı satış sonrası desteğiniz, kartınızın geldiği gün başlar.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
