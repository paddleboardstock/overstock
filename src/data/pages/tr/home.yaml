faqs:
  title: SUP Sipariş ve Ürün SSS
  subtitle: Gümrük SUP tahtalarımız, sipariş, ödeme, kargo ve garanti hakkında sıkça sorular.
  columns: 2
  items:
    - title: SUP'yi öğrenmek zor mu?
      description: Hiç de hayır. Çoğu yeni başlayan ilk seansında ayağa kalkıp kürek çeker. Genel olarak SUP kullanılan boardlarımız, ilk kez kürek çekenler için özel olarak tasarlanmış ekstra geniş stabil platformlara sahiptir. Sakin suda başlayın ve dakikalar içinde seyir yapmış olursunuz.
      icon: tabler:swimming
      category: sup
    - title: Ağırlık limiti nedir?
      description: Genel destek SUPs 220 lbs'ye kadar ve tur ile yoga platformları 250 lbs'ye kadar destek sağlıyor. Her ürün sayfasında sürücünün tam ağırlık kapasitesi listeleniyor, böylece tahtayı ihtiyaçlarınıza göre eşleştirebilirsiniz.
      icon: tabler:adjustments
      category: sup
    - title: Şişme SUP ile seyahat edebilir miyim?
      description: Kesinlikle. Her pano sırt Paddle Board Overstock çantası boyutunda bir taşıma çantasına sığdırılır. Sadece 18-22 lbs ağırlığında, plaja, göle veya havaalanı terminallerine taşımak kolaydır. Seyahatten önce havayolu bagaj politikanızı kontrol edin.
      icon: tabler:truck-delivery
      category: sup
    - title: Kutuda ne geliyor?
      description: Her biri Paddle Board Overstock SUP tahta, seyahat sırt çantası, el pompası, ayarlanabilir kürek, çıkarılabilir yüzgeç, bobin tasması ve tamir kiti dahildir.
      icon: tabler:clipboard-list
      category: sup
    - title: Fiyatlarınız neden perakende fiyatlardan daha düşük?
      description: Çin, Weihai'deki kendi üretim tesisimizden doğrudan fabrika fazlası ve tasfiye partileri satıyoruz — aracı yok, perakende fiyat farkı yok. Bu, tipik perakende fiyatlarının %60'a varan indirimle tamamen SUP paketler ve aynı CE-sertifikalı kalite anlamına gelir.
      icon: tabler:certificate
      category: orders
    - title: Nasıl sipariş verip ödeme yapabilirim?
      description: SUP paketinizi sepete ekleyin ve Stripe veya PayPal ile güvenli bir şekilde ödeme yapın. Tüm büyük kredi ve banka kartlarını kabul ediyoruz. Her sipariş, tam bir fatura ile e-posta yoluyla onaylanır.
      icon: tabler:file-text
      category: orders
    - title: Dünya çapında gönderim yapıyor musunuz?
      description: Evet. AB, Kuzey Amerika, Asya-Pasifik, Orta Doğu ve Afrika genelinde 50+ ülkeye gönderim yapıyoruz. Stokta bulunan siparişler genellikle 2-3 iş günü içinde gönderilir ve her paket için takip sağlanır.
      icon: tabler:route
      category: orders
    - title: SUP kartları hangi garantiyi içeriyor?
      description: 'Her SUP tahta ve aksesuar, tahta kendisi, drop-stitch dikişler ve şişirme valfleri dahil olmak üzere 2 yıllık garanti kapsamındadır. Talepler haftalar içinde değil, günler içinde çözülür: online başvuru yapın ve biz tamir eder veya değiştiririz.'
      icon: tabler:lifebuoy
      category: orders
