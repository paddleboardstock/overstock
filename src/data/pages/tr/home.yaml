features:
  id: features
  tagline: Neden Satın Almalısınız Paddle Board Overstock
  title: Gerçek Fabrika,<br />Gerçek Tasarruf
  subtitle: Fabrikada doğrudan fazla stok ve tasfiye SUP paketleri — perakende fiyat farkı olmadan kanıtlanmış kalite.
  columns: 2
  items:
    - title: Perakende Fiyatında %60'a Kadar Indirim
      description: Fabrika fazla stok ve indirim partilerini doğrudan satıyoruz — aracı yok, perakende farkı yok. Aynı panolar başka yerlerde tam fiyata, burada da indirim fiyatlarıyla satıyor.
      icon: tabler:rocket
    - title: Tam Paketler
      description: 'Her biri SUP tam bir paket olarak geliyor: tahta, seyahat sırt çantası, el pompası, ayarlanabilir kürek, çıkarılabilir yüzgeç, bobin tasma ve onarım kiti.'
      icon: tabler:clipboard-list
    - title: Kanıtlanmış Kalite
      description: Her kart gönderilmeden önce 1,25x nominal PSI'da %100 basınç testine tabi tutulur. Her partide %99,3 kusursuzluk oranı.
      icon: tabler:shield-check
    - title: Minimum Sipariş Yok
      description: Tam olarak ihtiyacınız olanı satın alın. Sepete bir pano ekleyin, ödeme yapın, tamam; minimum tutar yok, fiyat teklifi süreci yok, bekleme yok.
      icon: tabler:adjustments
    - title: Hızlı Dünya Nakliye
      description: Stokta siparişler Weihai'den 2-3 iş günü içinde gönderilir.+ AB, Kuzey Amerika, Asya-Pasifik ve ötesinde 50 ülkeye izlenmiş teslimat.
      icon: tabler:truck-delivery
    - title: 2 Yıl SUP Garanti
      description: Her SUP kart ve aksesuar 2 yıl boyunca kapsama altındadır — drop-stitch dikişler, şişlik vanaları ve aksesuarlar dahil. Talepler haftalar içinde değil, günler içinde çözülür.
      icon: tabler:lifebuoy
