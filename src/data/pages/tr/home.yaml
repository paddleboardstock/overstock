content_workshop:
  isReversed: true
  tagline: Fabrika Gücü
  title: İndirimli Fiyatlarımızın<br />Gerçek Olma Nedeni
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Gerçek Fabrika, Gerçek Tasarruf — Her Tahta Weihai Tesisimizden Gönderilir</h3>
  items:
    - title: Büyük Markalarla Aynı Üretim Hatları
      description: 12.000 m²’lik Weihai fabrikamız, uluslararası markalar ve kendi fazla stok partilerimiz için aynı hatlarda aynı malzemelerle tahtalar üretir.
    - title: '%100 Basınç Testi'
      description: Her tahta, nakliye öncesi 1.25x nominal PSI basınçla şişirilir ve tutulur. Her AQL başına %99,3 kusursuzluk oranı 2.5 / ISO 2859.
    - title: Aracı Yok
      description: Tahtalar doğrudan fabrikanızdan kapınıza gönderilir. Dağıtıcı ve perakende ekleme yok — işte indirimli fiyatların perakendenin %60 altına düşmesinin nedeni.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² Weihai fabrikası, şişme SUP üretim hatları ile
content_compliance:
  tagline: Uyumluluk ve Kalite Kanıtı
  title: Sertifikalı Kalite,<br />Belgelendirilmiş
  subtitle: Her uyumluluk iddiası, doğrulamanız için mevcut olan sertifikalar ve modele özel belgelerle desteklenir.
  items:
    - title: ISO 9001:2015
      description: Kalite yönetim sistemi TÜV Rheinland/SGS tarafından sertifikalandırılmıştır. Yıllık gözetim denetimleri. Gelen malzemeden sevkiyata kadar belgelenmiş QC süreçleri.
      icon: tabler:certificate
    - title: CE Sertifikalı
      description: İlgili AB yönergelerine göre 13 CE-sertifikalı SUP model, her biri model özel Uygunluk Beyanı ve üretici plakası verileri ile.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Tüm PVC ve yapıştırıcı malzemeler AB REACH yönetmeliğine uygundur. UKCA işaretlemesi İngiltere pazarı için mevcuttur. Malzeme güvenlik veri sayfaları istek üzerine sağlanır.
      icon: tabler:shield-check
    - title: 2 Yıl SUP Garanti
      description: Her SUP tahta ve aksesuar 2 yıl kapsamındadır — drop-stitch dikişler, şişirme valfleri ve aksesuarlar dahil. İddialar hızlı bir şekilde çözülür.
      icon: tabler:lifebuoy
steps:
  title: Çıkıştan Suya Kadar — Siparişiniz Nasıl Gönderilir
  items:
    - title: Adım 1:<span class="font-medium">Tahta Seçimi</span>
      description: Genel alan, tur, yoga ve çocuk modelleri arasından seçim yapın. Satın alma rehberlerimiz, tahta boyutu ve tarzınızı kürek çekmenize uydurmanıza yardımcı olur.
      icon: tabler:clipboard-list
    - title: Adım 2:<span class="font-medium">Güvenli Ödeme</span>
      description: Stripe veya PayPal ile güvenli şekilde ödeme yapın. Tüm büyük kredi ve banka kartları kabul edilir. Hesap gerekmez — sipariş onayı gelen kutunuza gelir.
      icon: tabler:file-text
    - title: Adım 3:<span class="font-medium">Kalite Denetimi</span>
      description: Her kart %100 basınç testinden geçer ve paketlenmeden önce tam PSI kalite kontrol listesiyle kontrol edilir.
      icon: tabler:settings
    - title: Adım 4:<span class="font-medium">Hızlı Sevk</span>
      description: Stokta siparişler Weihai fabrikamızdan 2-3 iş günü içinde gönderiliyor. Acil siparişler için hızlı işlem sağlanıyor.
      icon: tabler:building-factory
    - title: Adım 5:<span class="font-medium">İzli Teslimat</span>
      description: Dünya çapında 50 ülkeye gönderilen gönderiler takip+ edildi. 2 yıllık garantiniz ve hızlı satış sonrası desteğiniz, kartınızın geldiği gün başlar.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Güvenli Ödeme Çıkışından Takip Edilen Dünya Çapında Teslimata Sipariş Süreci
