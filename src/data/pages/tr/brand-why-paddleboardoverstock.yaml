features3_reasons:
  tagline: Neden Paddle Board Overstock’ü Seçmelisiniz
  title: Bizimle Ortak Olmanız İçin Yedi Sebep
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Ticaret Değil, Gerçek Üretim
      description: Biz 12.000 m²’lik bir fabrikaya sahibiz ve işletiyoruz. Paddle Board Overstock’den satın aldığınızda, tahtanızı tasarlayan, mühendisliğini yapan ve üreten kişilerden doğrudan satın almış oluyorsunuz — aracısız, perakende fiyat farkı yok.
      icon: tabler:building-factory
    - title: 2. Mühendislik Odaklı Yaklaşım
      description: Tasarım sürecimiz ürün kategorisiyle değil, kullanım şekli ile başlar. Gövde şekli, malzeme seçimi ve konfigürasyonu, tahtanın nasıl kullanılacağına göre optimize ederiz.
      icon: tabler:engine
    - title: 3. Kanıtlanmış Kalite
      description: Her tahta, sevkiyat öncesi %100 basınç testinden geçer ve 1.25x belirtilen PSI değerine göre test edilir. Her partide ölçülen %99,3 kusursuz oran — sadece iddia değil.
      icon: tabler:shield-check
    - title: 4. Kürekçi Öncelikli Tasarım
      description: 'Gövde sanatı, renk serisi, aksesuar montajları ve tamamlanmış paketler — gerçek kürek kullanımına göre tasarlanmış tahtalar: tur, yoga, balıkçılık, fitness ve aile eğlencesi.'
      icon: tabler:swimming
    - title: 5. Küresel Lojistik
      description: Weihai fabrikamızdan 50+ ülkeye doğrudan nakliye, tam takip ve gümrük işlemleri ile.
      icon: tabler:truck-delivery
    - title: 6. Ömür Boyu Destek
      description: Yıllar önce ürettiğimiz tahtaları destekliyoruz. Orijinal yedek parçalar, teknik tavsiye, onarım rehberi — ekibimiz ihtiyaç duyduğunuzda yanınızda.
      icon: tabler:lifebuoy
    - title: 7. Dürüst Spesifikasyonlar
      description: Gerçek yük kapasiteleri, gerçek boyutlar, gerçek ağırlık. Pazarlama abartısı yok. Yayınladığımız şey, aldığınız şeydir — bağımsız testlerle doğrulanmıştır.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dünya Çapında Markalar Tarafından Güvenilen
  title: Ortaklarımızın Söyledikleri
  items:
    - content: Tahtam eksiksiz kutusunda fabrika taze olarak geldi. Haftalık iki sezon kürek çekmeye rağmen hala mükemmel şekilde hava tutuyor.
      name: — Sarah M., Hafta Sonu Kürekçisi, Florida
    - content: Satın almadan önce haftalarca teknik özellikleri karşılaştırdım. Paddle Board Overstock, gerçek ağırlıklar ve gerçek basınçları yayınlayan tek markaydı. Listelenen bilgiler tam olarak ulaşan bilgilerdi.
      name: — Tomasz K., Tur Kürekçisi, Polonya
    - content: Şimdi bütün aile kürek çekiyor. Bir tahta ile başladık ve dört tahta ile sona erdik — kalite karar vermeyi kolaylaştırdı.
      name: — Angela R., Aile Kürekçisi, Avustralya
