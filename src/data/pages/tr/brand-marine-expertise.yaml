hero:
  tagline: Denizcilik Uzmanlığı
  title: Deniz Mühendisliği On On Yıllar<br />Her Gövdede
  subtitle: Aquafarer, önemli olduğunda performans gösteren su araçları üretmek için derin malzeme bilimi, hassas üretim ve gerçek dünya testlerini birleştirir.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer deniz mühendisliği ve Ar-Ge ekibi çalışıyor
expertise_materials:
  tagline: Malzeme Bilimi
  title: Doğru Malzemeyi Seçmek<br />Her Uygulama İçin
  subtitle: Üç temel malzeme ile çalışıyoruz — her biri belirli kullanım durumları ve performans gereksinimleri için seçilmiştir.
  columns: 3
  items:
    - title: Deniz Kalitesinde PVC
      description: 1100 denye PVC kumaş — en çok yönlü malzememiz. UV-stabilize, aşınmaya dayanıklı ve REACH uyumlu. Ağırlık ve maliyet verimliliğinin önemli olduğu eğlence amaçlı tekneler, SUP tahtalar ve kanolar için ideal.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Üstün kimyasal direnç ve UV stabilitesi. Hypalon tekneleri, doğru bakım ile 15-20 yıl dayanabilir. Uzun süreli dayanıklılığın kritik olduğu ticari, kurtarma ve askeri uygulamalar için tavsiye edilir.
      icon: tabler:shield
    - title: Fiberglas ve Alüminyum
      description: Derin V fiberglas gövdeler, RIBs ve devriye botları için — zorlu koşullarda dalgaları yarma performansı. Maksimum sağlamlık ve yük kapasitesi gerektiren ağır hizmet ticari iş tekneleri için alüminyum gövdeler.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Üretim Yetenekleri
  title: Hassas Üretim<br />Her Adımda
  subtitle: 12.000 m²'lik tesisimiz, üretimin her aşaması için özel makinelerle donatılmıştır.
  columns: 2
  items:
    - title: CNC Kesme
      description: Bilgisayar kontrollü kesim, minimal atık ile hassas ve tekrarlanabilir kumaş panelleri sağlar. Her parça tasarlandığı gibi tam olarak uyar.
      icon: tabler:cpu
    - title: Yüksek Frekanslı Kaynak
      description: Endüstriyel HF kaynak, esas malzemeden daha güçlü dikişler oluşturur. Tutarlı sıcaklık ve basınç kontrolü, her üretim rununda hava geçirmez contalar sağlar.
      icon: tabler:bolt
    - title: Damlacık Dikişli Çekirdek Montajı
      description: Binlerce polyester iplik, üst ve alt kumaş katmanlarını birbirine bağlayarak yüksek basınçlı şişirmeye (15-20 PSI) izin verir ve sağlam, stabil SUP panolar ve zeminler sağlar.
      icon: tabler:building-arch
    - title: Basınç Testi
      description: Her şişirilebilir ürün kargoya verilmeden önce basınç testinden geçirilir. RIB tüpler, belirtilen basıncın 1,25 katında test edilir — eğer burada dayanırsa, suda da performans gösterecektir.
      icon: tabler:wind
    - title: Dikiş Mukavemeti Testi
      description: Her üretim partisi için rastgele örnekler yıkıcı dikiş dayanımı testine tabi tutulur. Sonuçlar kaydedilir ve belirli üretim serilerine izlenebilir.
      icon: tabler:files
    - title: Su Testi
      description: Her RIB modeli, sertifikasyon öncesinde deneme seferlerinden geçer. Kıyı koşullarında yapılan gerçek dünya testleri, performans, kullanım ve stabiliteyi doğrular.
      icon: tabler:ripple
expertise_design:
  tagline: Tasarım ve Mühendislik
  title: Gerçek Koşullar İçin Tasarlandı
  subtitle: Tasarım felsefemiz, teknenin nasıl kullanılacağını belirleyerek başlar — ardından mühendisliği bu kullanım durumu etrafında inşa eder.
  items:
    - title: Deep-V Gövde Tasarımı
      description: Fiberglas gövdelerimiz, her modelin uzunluğu ve amaçlanan kullanımı için optimize edilmiş hesaplanmış deadrise açılarına sahiptir. Sert sularda performans için daha dik V, stabilite için daha sığ V.
    - title: Çok Odacıklı Güvenlik
      description: Her teknede 3-7 bağımsız hava odası bulunur. Bir bölme zarar görürse, kalan odalar tekneyi yüzdürmeye ve işlevsel tutmaya devam eder.
    - title: Ergonomik Düzen
      description: Konsol konumu, tüp yüksekliği ve koltuk yerleşimi, uzun süreli kullanımlar sırasında operatörün konforu göz önünde bulundurularak tasarlanmıştır — devriye, balık tutma veya taşıma olsun.
    - title: Özel Konfigürasyon
      description: Tüp renkleri, konsol konfigürasyonu, yakıt kapasitesi, aksesuar montajları — her model, belirli operasyonel gereksinimlere uyacak şekilde özelleştirilebilir.
