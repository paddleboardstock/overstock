hero:
  tagline: Deniz Uzmanlığı
  title: Deniz Mühendisliği On On Yıllar<br />Her Tahtada
  subtitle: Paddle Board Overstock, önemli olduğunda performans gösteren tahtalar üretmek için derin malzeme bilimi, hassas üretim ve gerçek dünya testlerini birleştirir.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock deniz mühendisliği ve AR-GE ekibi çalışıyor
expertise_materials:
  tagline: Malzeme Bilimi
  title: Doğru Malzemeyi Seçmek<br />Her Uygulama İçin
  subtitle: Üç temel malzeme ile çalışıyoruz — her biri belirli kullanım durumları ve performans gereksinimleri için seçilmiştir.
  columns: 3
  items:
    - title: Deniz Sınıfı PVC
      description: 1100 denye PVC kumaş — en çok yönlü malzememiz. UV-stabilize, aşınmaya dayanıklı ve zamanla test edilmiş. Ağırlık, sertlik ve maliyet verimliliğinin önemli olduğu SUP tahtalar için ideal.
      icon: tabler:droplet
    - title: Drop-Stitch Çekirdek
      description: Binlerce polyester iplik, üst ve alt kumaş katmanlarını birbirine bağlar, böylece sert, stabil bir sürüş için yüksek basınçlı şişirme (15 PSI) mümkün olur, ancak yine de bir sırt çantasına sığacak şekilde katlanabilir.
      icon: tabler:building-arch
    - title: EVA Güverte Köpüğü
      description: Oluklu, yüksek yoğunluklu EVA köpük tam uzunlukta tutuş, düşmelerde yastıklama ve imza sanat serisi tahtalarımız için bir tuval sağlar.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Üretim Yetenekleri
  title: Hassas Üretim<br />Her Adımda
  subtitle: 12.000 m²'lik tesisimiz, üretimin her aşaması için özel makinelerle donatılmıştır.
  columns: 2
  items:
    - title: CNC Kesme
      description: Bilgisayar kontrollü kesim, minimal atık ile hassas ve tekrarlanabilir kumaş panelleri sağlar. Her parça tasarlandığı gibi tam olarak uyar.
      icon: tabler:cpu
    - title: Yüksek Frekanslı Kaynak
      description: Endüstriyel HF kaynak, esas malzemeden daha güçlü dikişler oluşturur. Tutarlı sıcaklık ve basınç kontrolü, her üretim rununda hava geçirmez contalar sağlar.
      icon: tabler:bolt
    - title: Damlacık Dikişli Çekirdek Montajı
      description: Binlerce polyester iplik, üst ve alt kumaş katmanlarını birbirine bağlayarak yüksek basınçlı şişirmeye (15-20 PSI) izin verir ve sağlam, stabil SUP panolar ve zeminler sağlar.
      icon: tabler:building-arch
    - title: Basınç Testi
      description: Her tahta nakliyat öncesi basınç testinden geçirilir, 1.25x nominal basınçta tutulur — eğer burada dayanırsa, suda performans gösterecektir.
      icon: tabler:wind
    - title: Dikiş Mukavemeti Testi
      description: Her üretim partisi için rastgele örnekler yıkıcı dikiş dayanımı testine tabi tutulur. Sonuçlar kaydedilir ve belirli üretim serilerine izlenebilir.
      icon: tabler:files
    - title: Su Testi
      description: Her tahta tasarımı gerçek su testlerinden geçer. Sahil koşullarında yapılan gerçek dünya kürek deneyleri, performansı, kullanım kolaylığını ve dengeyi doğrular.
      icon: tabler:ripple
expertise_design:
  tagline: Tasarım ve Mühendislik
  title: Gerçek Koşullar İçin Tasarlandı
  subtitle: Tasarım felsefemiz, tahtanın nasıl kullanılacağıyla başlar — ardından mühendisliği bu kullanım durumuna göre inşa eder.
  items:
    - title: Tahta Şekli ve Konturu
      description: Uzunluk, genişlik ve rocker, her modelin amaçlanan kullanımına göre ayarlanır — kayma için daha uzun tur hatları, denge ve yoga için daha geniş plan şekilleri.
    - title: Kenar ve Orta Çubuk Takviyesi
      description: Takviye edilmiş kenarlar ve orta çubuklar sertlik ekler ve darbeleri emer — tahtaların sezonlar boyunca en çok zorlandığı yerlerdir.
    - title: Gövde Düzeni ve Tutuş
      description: Durma alanı, tutacak yerleri, D-halkası montajları ve tutuş bölgeleri gerçek kürek pozlarına göre tasarlanır — ister gezi, balık tutma ister yoga olsun.
    - title: Sanat ve Renk Serisi
      description: Tahta üzeri artwork, renk şemaları ve aksesuar montajları — her seri belirli bir kürek kişiliğine uyacak şekilde tasarlanır.
cta:
  title: Belirli bir uygulamayı mı düşünüyorsunuz?
  subtitle: Ekibimiz, kürek stilinize uygun doğru tahta, boyut ve ekipmanı seçmenize yardımcı olabilir.
  actions:
    - variant: primary
      text: Mühendislerimizden bilgi alın
      href: /contact
    - text: Ürün yelpazesini görüntüle
