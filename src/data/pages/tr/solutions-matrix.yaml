hero:
  tagline: Sektör Çözümleri Matrisi
  title: Senaryo Tabanlı Deniz Çözümleri<br />Profesyonel Operasyonlar İçin
  subtitle: Amaç için tasarlanmış şişirilebilir su araçları ve RIBs, kurtarma, kiralık filo, yat yardımcısı ve ticari balıkçılık uygulamaları için yapılandırılmıştır — her biri teknik özellikler ve özelleştirme seçenekleri ile desteklenmektedir.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock çeşitli endüstriler için profesyonel denizcilik çözümleri
direct_answer: 'Paddle Board Overstock, ticari deniz operasyonları için senaryo-uyarlanmış şişirilebilir deniz araçları ve RIB çözümleri sunar: takviye edilmiş Hypalon tüplere ve çok bölmeli güvenlik sistemine sahip kurtarma ve devriye botları, düşük bakım gereksinimi için 1.2 mm PVC ve sıcak hava ile kaynaklı dikişlere sahip kiralama filoları SUPs ve kanolar, derin V alüminyum gövdeye sahip lüks yat botları RIBs, olta tutucular ve canlı yem sistemleri ile donatılmış ağır hizmet balıkçılık konfigürasyonları.'
solution_a:
  tagline: Çözüm A
  title: Deniz Kurtarma &<br />Ticari Devriye
  subtitle: Profesyonel acil müdahale ve kolluk kuvvetleri operasyonları için yüksek hızlı, çok odacıklı güvenlik RIBs.
  badge: Heavy-Duty Series
  description: Deniz kurtarma ve devriye RIBs yüksek yoğunluklu güçlendirilmiş Hypalon/PVC hava tüpleri ile çok odacıklı bağımsız yüzdürme tasarımına sahip olarak inşa edilmiştir. Her gemi, profesyonel sınıf reflektör bant, kurtarma tutma ipleri ve hızlı şişirme vanaları ile donatılmıştır. Derin-V fiberglas gövdeler, yüksek hızlarda ve sert deniz koşullarında olağanüstü kararlılık sağlar.
  features:
    - title: Çok Odacıklı Güvenlik
      description: 4–6 bağımsız hava odası — herhangi bir tek oda delinmesi bile pozitif yüzdürmeyi korur
    - title: Takviyeli Boru Kumaşı
      description: 1,2 mm Hypalon CSM veya çift katmanlı sıcak hava kaynaklı dikişlerle 1.680 DTEX PVC
    - title: Profesyonel Seviye
      description: SOLAS reflektif bant, kurtarma tutma ipleri, çekme pruvakları, hızlı salınımlı halat
    - title: Yüksek Hızlı Gövde
      description: Konfigürasyona bağlı olarak 25–45 knot için derecelendirilmiş Derin V fiberglas veya alüminyum gövde
  recommended_models:
    - RIB 450 Devriye
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Gövde Malzemesi
      value: Fiberglas / Deniz Tipi Alüminyum
    - label: Tüp Kumaş
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Maksimum Hız
      value: 25–45 düğüm
    - label: Kapasite
      value: 6–12 kişi
    - label: Motor Aralığı
      value: 40–200 HP
    - label: Sertifikasyon
      value: CE / ISO 9001
solution_b:
  tagline: Çözüm B
  title: Su Sporları Kiralama &<br />Tatil Köyü Filosu Ekipmanı
  subtitle: Günlük kiralama amaçlı tatil köyleri, kulüpler ve tur operasyonları için ultra dayanıklı, düşük bakım gerektiren şişme SUPs, kanolar ve tekneler.
  badge: Rental-Grade
  description: Kiralama filomuzun ekipmanları en yüksek dayanıklılık ve en düşük bakım maliyeti için tasarlanmıştır. UV bozulmasına ve sık çarpma hasarına karşı dirençli üç katmanlı sıcak hava kaynaklı dikiş teknolojisine sahip 1,2 mm takviyeli PVC kullanıyoruz. Drop-stitch yapısı, panoların yüzlerce kiralama döngüsünden sonra bile sertliğini korumasını sağlar. Tüm modeller güçlendirilmiş D-halkaları, aşınmaya dayanıklı kenar bantları ve ticari sınıf valflar ile donatılmıştır.
  features:
    - title: Ticari Sınıf PVC
      description: 1,2 mm takviyeli PVC ve UV stabilizatörler — tüketici sınıfı malzemelerden 3 kat daha kalın
    - title: Sıcak Hava Kaynaklı Dikişler
      description: Üç katmanlı füzyon kaynağı — yapıştırıcı bağlantıdan daha güçlü, delaminasyona karşı dirençli
    - title: Drop-Stitch Sertlik
      description: 2 iplik/inç kare ile 1.680 DTEX çekirdek — sert tahta benzeri sertliğe sahip 20 PSI seviyesine kadar derecelendirilmiş
    - title: Filo Hazır Tasarım
      description: Güçlendirilmiş D-halkalar, ticari Halkey-Roberts valflar, aşınmaya dayanıklı kenar bantları
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Tüp Malzemesi
      value: 1,0–1,2 mm Takviyeli PVC
    - label: Dikiş Teknolojisi
      value: Üç katmanlı sıcak hava kaynağı
    - label: Max Basınç
      value: 15–20 PSI (drop-stitch modeller)
    - label: UV Direnci
      value: 1.000+ saat hızlandırılmış test
    - label: Garanti
      value: Modeline bağlı olarak 2–5 yıl
    - label: Bakım
      value: Minimum — durulayıp saklayın
solution_c:
  tagline: Çözüm C
  title: Yat Botları &<br />Lüks Su Araçları
  subtitle: Süperyat depolama ve konuk taşımacılığı için tasarlanmış, hafif, yüksek performanslı RIB botlar, lüks işçilik ve tasarım ile.
  badge: Premium Series
  description: Yat botlarımız RIBs, hafif yapıyı lüks estetik ile birleştirir. Deep-V alüminyum veya fiberglas gövdeler, olağanüstü sürüş kalitesi ve kolay vinç kaldırma sağlar. Renk uyumlu tüp grafikler, premium döşeme ve özel kumanda konsolu seçenekleri ile mevcuttur. Kompakt saklama boyutları, süperyat garajları ve güverte saklaması için idealdir.
  features:
    - title: Hafif Yapı
      description: Deniz sınıfı alüminyum gövdeler, fiberglasa göre ağırlığı %30 azaltarak kolay kaldırma sağlar
    - title: Deep-V Performans
      description: 18–22 derece deadrise gövde, dalgalı sularda düzgün sürüş ve mükemmel iz sürebilirliği sağlar
    - title: Lüks İşçilik & Tasarım
      description: Özel döşeme, renk uyumlu tüpler, premium kumanda konsolu, paslanmaz paket
    - title: Kompakt Depolama
      description: Süperyat garajları için tasarlanmıştır — kompakt saklama için şişirilebilir tüpler
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Gövde Tipi
      value: Deep-V Alüminyum / Fiberglas
    - label: Deadrise
      value: 18–22 derece
    - label: Maksimum Hız
      value: 30–40 knot
    - label: Kuru Ağırlık
      value: 120–350 kg (alüminyum gövde)
    - label: Vinçle Kaldırma Hazır
      value: Evet — kaldırma noktaları standart
    - label: Depolama
      value: Şişirilebilir tüpler, üst üste konabilir
