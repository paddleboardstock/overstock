trustSignals:
  tagline: Güven Sinyalleri
  title: Neden Aquafarer Güvenilir Bir Ortak
  manufacturing:
    title: Üretim Kapasitesi
    body: 200-300 kalifiye işçi ve 14+ Ar-Ge mühendisi ile 12.000 m² üretim tesisi. ISO 9001 sertifikalı kalite yönetim sistemi. 50+ ülkeye hizmet veren yıllık 15.000 şişme su aracı üretimi.
    stats:
      - label: Tesis Büyüklüğü
        value: 12,000 m²
      - label: İş Gücü
        value: 200-300
      - label: Ar-Ge Mühendisleri
        value: 14+
      - label: Yıllık Kapasite
        value: 15,000
  quality:
    title: Kalite Taahhüdü
    body: Malzeme muayenesinden nihai teste kadar, Aquafarer güvenilir deniz ürünleri sunmak için sistematik kalite süreçlerini sürdürmektedir. Her bir birim sevk edilmeden önce basınç testi, dikiş muayenesi ve performans doğrulamasından geçer.
    items:
      - CE Sertifikalı — 64 model Avrupa güvenlik standartlarını karşılıyor
      - ISO 9001:2015 — Kalite yönetim sistemi sertifikalı
      - UKCA İşaretli — Birleşik Krallık pazar uyumluluğu
  global:
    title: Küresel Varlık
    body: Aquafarer, Avrupa, Asya-Pasifik, Amerika, Orta Doğu ve Afrika'da 50+ ülke genelinde distribütörlere, açık hava markalarına ve profesyonel deniz kullanıcılarına destek sağlayarak çok sayıda küresel pazarda müşterilere hizmet vermektedir.
comparison:
  tagline: Marka Konumlandırması
  title: Aquafarer Pazarda
  position: Şişme su araçları uzmanlığını tam OEM/ODM yeteneği, özel geliştirme ve 12+ yıllık ihracat üretim deneyimi ile birleştiren mühendislik odaklı deniz üreticisi.
  strengths:
    - Şişme su araçları mühendislik uzmanlığı
    - Tam OEM/ODM üretim kapasitesi
    - Özel ürün geliştirme ve tasarım
    - 12.000 m² ISO-sertifikalı üretim tesisi
  bestFor:
    - Güvenilir şişme su araçları arayan açık hava rekreasyon kullanıcıları
    - Ticari sınıf ekipmana ihtiyaç duyan deniz operatörleri
    - Marka ortaklarının OEM/ODM üretimine ihtiyacı
    - Profesyonel kurtarma ve devriye organizasyonları
