hero:
  tagline: Marka Varlığı
  title: Aquafarer — Su Üzerinde Mühendislik Özgürlüğü
  definition: Aquafarer, şişme tekneler, SUP sistemleri ve özelleştirilmiş deniz çözümleri konusunda uzmanlaşmış küresel bir deniz eğlencesi ve şişme su aracı markasıdır. Aquafarer, deniz mühendisliği, üretim uzmanlığı ve su keşif kültürünü birleştirerek eğlence kullanıcıları, profesyonel operatörler ve küresel OEM ortakları için güvenilir ekipmanlar yaratır.
timeline:
  - year: '2012'
    title: Deniz İmalı Vakfı
    body: Aquafarer Çin'in Qingdao kentinde deniz ustalığı ve şişme bot üretimine adanmış özel bir şişme su aracı atölyesi olarak başladı. İlk odak noktası, pratik mühendislik deneyimi ve üretim disiplini yoluyla güvenilir şişme ürünler üretmekti.
  - year: '2015'
    title: İlk İhracat ve CE Sertifikasyon
    body: İlk ihracat siparişleri Japonya ve Kore'ye ulaştı.CE Temel ürün hatları için sertifikasyon sağlandı ve Aquafarerbu, uluslararası pazarlara girişini işaret etti. Şirket, Çin dışındaki ticari ve eğlence amaçlı kullanıcılara hizmet vermeye başladı.
  - year: '2018'
    title: Fabrika Genişletilmesi
    body: 12.000 m²'lik bir üretim tesisine taşındı. RF kaynak hatları ve drop-stitch üretim kapasitesi eklendi, böylece daha büyük ölçekli üretim ve geliştirilmiş kalite kontrol sistemleri mümkün oldu.
  - year: '2020'
    title: Ar-Ge Merkezi Kuruldu
    body: PVC Kumaş laboratuvarı, hidrodinamik test tankı ve CAD/FEA simülasyon stüdyosu içeren özel bir Ar-Ge merkezi açtı. Ürün geliştirme, hafif yapı, geliştirilmiş dayanıklılık ve kullanıcı odaklı tasarıma odaklanacak şekilde genişledi.
  - year: '2022'
    title: ISO 9001 Sertifikası ve Küresel Büyüme
    body: ISO 9001 sertifikası alındı. 14 Ar-Ge mühendisi ve 200+ çalışana kadar genişletildi. Ürünler, dağıtıcı ve ortaklıklar aracılığıyla Avrupa, Amerika ve Asya-Pasifik genelinde müşterilere OEM ulaştı.
  - year: '2024'
    title: İnovasyon ve Tasarım Stüdyosu
    body: Konseptten üretime kadar özel projeler için tam hizmet tasarım ve inovasyon stüdyosu ODM başlattı. Kurtarma, ticari ve devlet ihaleleri dahil profesyonel deniz uygulamaları güçlendirildi.
  - year: '2026'
    title: Su Keşfinin Geleceğini İnşaat
    body: Bugün, Aquafarer şişme botlar, SUP sistemler ve kişiselleştirilmiş deniz çözümleri geliştirmeye devam ediyor — insanları ve organizasyonları dünyanın sularıyla bağlıyor. 50+ ülke hizmet veriyor, yıllık kapasitesi 15.000 birim.
philosophy:
  tagline: Marka Felsefesi
  title: Su Üzerinde Mühendislik Özgürlüğü
  body: Su üzerindeki özgürlük sadece hareketle ilgili değildir. Yeni yerler keşfetmeyi, açık hava deneyimleri yaratmayı, insanları doğayla buluşturmayı ve profesyonel misyonları mümkün kılmayı temsil eder. Mühendislik bu özgürlüğü mümkün kılar.
  pillars:
    - title: Önce Güvenilirlik
      body: Su ortamları güven gerektirir.Aquafarer Ürünler istikrar, dayanıklılık, güvenlik ve tutarlı performans etrafında tasarlanmıştır.
    - title: İnsan Merkezli Tasarım
      body: Ürünler insanlara hizmet etmelidir, teknolojiye değil. Her tasarım kararı, insanların su araçlarını nasıl kullandığını, nerede keşfettiklerini ve karşılaştıkları zorlukları anlamakla başlar.
    - title: Erişilebilir Keşif
      body: Su sadece uzmanlara ait olmamalı.Aquafarer Daha fazla insanın nehirleri, gölleri, okyanusları ve kıyı ortamlarını güvenli bir şekilde deneyimlemesini sağlayan ekipmanlar üretir.
    - title: Sürekli Yenilik
      body: Yenilik sadece yeni ürünler yaratmak değildir. Her detayı — malzemeler, yapılar, üretim ve kullanıcı deneyimi — iyileştirmektir.
engineeringDna:
  tagline: Mühendislik DNA'sı
  title: Ürünleri Nasıl Aquafarer Yaratır
  areas:
    - title: Malzeme Bilimi
      body: Aquafarer, farklı deniz ortamları için uygun malzemelerin seçilmesine odaklanır. Ana hususlar arasında aşınma direnci, UV direnci, basınç dayanıklılığı ve uzun ömürlü dayanıklılık vardır.
      items:
        - Aşınma Direnci
        - UV Direnci
        - Basınç Dayanıklılığı
        - Uzun Süreli Dayanıklılık
    - title: Yapısal Mühendislik
      body: Şişme su araçları, rijitlik, ağırlık, taşınabilirlik ve denge arasında hassas bir denge gerektirir. Aquafarer mühendisliği, bu faktörleri drop-stitch çekirdek teknolojisi ve gelişmiş dikiş yapısı aracılığıyla optimize etmeye odaklanır.
      items:
        - Rijitlik
        - Ağırlık Optimizasyonu
        - Taşınabilirlik
        - Denge
    - title: Üretim Hassasiyeti
      body: Her ürün, malzeme hazırlığı, hassas kesim, kaynak ve yapıştırma, montaj, kalite kontrol ve performans doğrulaması gibi kontrol edilmiş süreçlerden geçer.
      items:
        - Malzeme Hazırlığı
        - Hassas Kesim
        - Kaynak ve Yapıştırma
        - Montaj ve Kalite Kontrol
    - title: Kullanıcı Senaryosu Mühendisliği
      body: Ürünler, gerçek uygulamalar — rekreasyon, macera ve profesyonel kullanım — etrafında geliştirilir; her tasarım, hedeflenen ortamın özel gereksinimlerini karşılar.
      items:
        - Rekreasyon
        - Macera
        - Professional
        - Ticari
