hero:
  tagline: Kalite Kontrol Laboratuvarı
  title: Test Laboratuvarı ve Kalite Güvencesi
  subtitle: Bağımsız kalite laboratuvarı — her birim sevkıyat öncesi test edilir
intro: Paddle Board Overstock, üretimden bağımsız olarak çalışan özel bir kalite kontrol laboratuvarı işletir. Her parti hammadde ve her tamamlanmış pano, serbest bırakılmadan önce belgelenmiş denetim protokollerinden geçer. Kalite kontrol ekibimiz, tarafsız kalite kararlarını sağlamak için doğrudan yönetime rapor verir.
highlights:
  - value: 100%
    label: Birimler basınç testinden geçmiştir
    detail: Her oda, her pano
  - value: 48 h
    label: Hava tutma test süresi
    detail: 1.25× nominal basınçta
  - value: '&lt;%5'
    label: İzin verilen maksimum basınç düşüşü
    detail: 24 saatlik bekletme süresi boyunca
  - value: 99.3%
    label: Kusursuz oran
    detail: Son 12 aylık sevkiyatlar
test_procedures:
  - title: Hammadde Denetimi
    description: Her gelen PVC, drop-stitch kumaş, EVA köpük ve donanım partisi kabul öncesi test edilir. Çekme dayanımı, yırtılma direnci ve UV direnci doğrulanır. Uygun olmayan malzemeler karantinaya alınır ve iade edilir.
    standards:
      - Çekme dayanımı (min 350 N/cm)
      - Yırtılma direnci
      - UV direnci (1.000 saat)
  - title: Süreç İçi QC Kontrol Noktaları
    description: Üretim operatörleri her aşamada kendi kendine denetim yapar. QC denetçileri vardiya boyunca rastgele örnekleme gerçekleştirir. Kaynak soyulma testleri her 50 birimde yapılır. Boyutsal kontroller her 20. panelde yapılır.
    standards:
      - Her 50 birimde soyma testi
      - İç 100 maddelik kontrol listesi
      - Rastgele örnekleme denetimleri
  - title: 48 Saatlik Hava Tutma Testi
    description: Her tüp hazne, nominal basıncın %125’ine şişirilir ve 48 saat tutulur. Basınç sensörleri sıcaklık telafisi ile sürekli kayıt yapar. %5 basınç düşüşünü aşan herhangi bir hazne otomatik olarak parti yeniden denetimini tetikler.
    standards:
      - 1,25x nominal basınç tutma
      - '%5 maks basınç düşüşü'
  - title: Yük ve Denge Testi
    description: Tamamlanmış panolar, kararlılık, üst seviye ve taşıma testleri için maksimum nominal kapasitede test edilir. Her pano, nihai inceleme onayından önce su testine tabi tutulur.
    standards:
      - 1,25x nominal yük doğrulaması
      - Su testi
equipment:
  - name: Evrensel Test Makinesi (çekme)
    spec: 5 kN kapasiteli
  - name: Basınç Sızıntı Test Cihazı
    spec: Çok kanallı, 0–50 psi, veri kaydı
  - name: UV Hava Koşullarına Dayanıklılık Kabini
    spec: UVA-340, 1.000 saat döngüleri
  - name: Kalınlık Ölçer (dijital)
    spec: 0,01 mm çözünürlük
  - name: Soyma Test Cihazı (kaynak)
    spec: Motorlu, 50 N kapasite
  - name: Sıcaklık Odası
    spec: -40 °C ila +100 °C
  - name: Kaçak Tespit Tankı
    spec: 6 m × 2 m, aydınlatmalı
tldr:
  summary: 'Paddle Board Overstock kalite laboratuvarı, üretimden bağımsız olarak faaliyet göstermektedir ve belgelenmiş iç protokollere göre çekme, soyma, UV ve basınç testleri yapmaktadır. Tüm birimler %100 oranında 1,25 kat nominal basınçta basınç testi uygulamasına tabi tutulmaktadır. Hatasız oranı: son 12 aylık sevkiyatlarda %99,3.'
  points:
    - Bağımsız laboratuvar, tarafsız kalite doğrulaması için üretimden ayrılmıştır
    - Her bir birim için 24-48 saat süreyle 1,25 kat nominal basınçta %100 basınç testi yapılır
    - Her testi yöneten belgelenmiş iç protokoller
    - Son 12 aylık sevkiyatlarda %99,3 hata oranı yok
    - Taşımadan önce her birim, 6 aşamalı kalite kontrol sürecinden geçirilir
