testimonial:
  content: Aquafarer, üç tatil köyü mülkümüzdeki tüm sahil etkinliği programımızı tasarladı ve donattı. 80 SUPs, 40 kano, güvenlik altyapısı ve personel eğitimi — hepsi tek bir sevkiyatla teslim edildi. İlk sezonda misafirlerimizin su etkinliklerine katılımı %60 arttı.
  name: Sophie Laurent
  title: Misafir Deneyimi Direktörü, Azure Bay Resorts — Phuket, Tayland
content_segments:
  tagline: Tatil Köyü Profilleri
  title: Kıyı Otelcilik Çözümleri<br />Mülk Türüne Göre
  subtitle: Her tatil köyü mülkünün benzersiz bir misafir profili, etkinlik karışımı ve operasyonel ritmi vardır — butik eko-lodjlardan geniş lüks sahil tatil köylerine kadar. Mülk sınıfına ve misafir beklentilerine uygun su sporları programları tasarlıyoruz.
  items:
    - title: Sahil Lüks Tatil Köyleri
      subtitle: VIP transferler, su etkinlikleri, premium misafir deneyimi
      description: Lüks sahil mülkleri — Four Seasons, Aman ve benzeri lüks gruplar — su sporlarının önemli bir misafir ayrıcalığı olduğu yerler, memnuniyet puanlarını ve ek gelirleri artırır. Filonun premium görünmesi, yaş grupları ve yetenek seviyeleri arasında çeşitlilik sunması ve tatil köyünün mevcut konsiyerj ve rezervasyon sistemleri ile sorunsuz entegre olması gerekir. Misafir görünümü beklentileri son derece yüksektir — ekipmanın durumu ve sunumu doğrudan 5 yıldızlı yorumları etkiler.
      features:
        - 'Premium markalı filo: SUPs, kanolar, pedal botlar ve küçük RIB servis botları'
        - 'Misafire hazır sunum: tatil köyü renkleri ile uyumlu, logo marka uygulaması, düzenlenmiş ekipman gösterimi'
        - VIP misafir transferleri için küçük lüks RIB, özel döşeme ve renk uyumu ile
        - 'Entegre güvenlik altyapısı: şamandıra hatları, cankurtaran istasyonları, AED'
        - 'Gelir yönetimi: dinamik fiyat şablonları, ek satış eğitimi, paket birleştirme'
    - title: Özel Ada Tatil Köyleri
      subtitle: Her hava koşulunda misafir taşımacılığı — hiç duraklama, tam güvenilirlik
      description: Özel ada tatil köyleri, teknenin ana karaya tek bağlantı olduğu uzak bölgelerde faaliyet gösterir. Günlük misafir transferleri, malzeme taşımaları ve acil tıbbi tahliyeler tek bir gemiye bağlıdır — herhangi bir kesinti doğrudan misafir deneyimini ve tatil köyü operasyonlarını etkiler. Bu operatörler, her hava koşullarında güvenilir çalışan, minimum bakım gerektiren ve kritik güvenilirlik için yedek sistemlere sahip bir tekneye ihtiyaç duyarlar. Tekne, misafirler adaya vardığında da güzel bir şekilde sunulmalıdır.
      features:
        - Tam hava koşulları ve ağır hizmet tüpleriyle her hava koşulunda RIB konfigürasyon
        - Sıfır kesinti süresi için çift motorlu veya yedek motor desteği
        - Hypalon Uzaktan hizmette 5-8 yıl ömürlü ticari düzeyde inşaat
        - Sahada bakım için erişilebilir bileşenlerle kolay bakım tasarımı
        - Özel tatil köyü markası ve premium döşeme uyumlu ada estetiği
    - title: Göl Kenarı ve Eko Tatil Merkezleri
      subtitle: Doğayla entegre misafir deneyimleri
      description: Göl kenarındaki mülkler, eko-lodgelar ve doğa inzivaları sessiz, düşük etkili su aktiviteleri sunmakta ve doğal ortamı tamamlamaktadır. Ekipmanlar mümkün olduğunca motorsuz olmalı, sınırlı alanlı tekne evlerinde kolayca saklanmalı ve tüm misafirler için ortam deneyimini korumak amacıyla sessiz kullanılmalıdır.
      features:
        - 'Motorsuz filo: SUPs, kayaklar, kano ve kürekli tekneler'
        - Konuk kullanımı için sessiz elektrikli pompa şişirme istasyonları
        - Sürdürülebilirlik markasıyla uyumlu çevre dostu malzemeler ve ambalajlar
        - Depolama rafları ve tekne organizasyon sistemleri şunları içeriyordu
    - title: Plaj Kulüpleri
      subtitle: Misafir transferleri, eğlence, küçük lüks RIBs
      description: Plaj kulüpleri, ekipmanların atmosferin bir parçası olduğu yüksek enerjili, görsel odaklı bir ortam işletmektedir. RIBs Yakınlardaki otellerden veya iskelelerden misafir transferleri için küçük lükslere ve misafir eğlencesi için su oyuncaklarına ihtiyaç duyarlar — jet ski çekme, şişme kaydıraklar ve paddle boardlar. Filo şık görünmeli, kullanımı kolay olmalı ve farklı beceri seviyelerine sahip misafirlerin günlük kullanımına dayanmalıdır. Yoğun saatlerde depolama ve hızlı kullanıma hazır olmak kritik öneme sahiptir.
      features:
        - RIB Misafir transferi ve tender hizmeti için kompakt lüks (3,3-4,3m)
        - 'Su oyuncakları: konuk eğlencesi için çekilebilir şişme malzemeler, SUP tahtalar, kayaklar'
        - Plaj kulübü görsel kimliğine uygun özel renk ve markalama
        - Yüksek devri gerektiren operasyonlar için hızlı fırlatma ve geri alma sistemleri
        - Hypalon Günlük tuzlu suya maruz kalma UVve
    - title: Özel Üye Kulüpleri ve Yat Kulüpleri
      subtitle: Liman ulaşımı, üye ihaleleri, özel su sporları
      description: Su sporları ve tekne taşımacılığının gelir kaynağı değil, üye faydası olduğu özel kulüpler. Ekipmanlar daha yüksek estetik standartlara uymalı, üyeler için talep üzerine hazır olmalı ve minimum personel denetimi gerektirmelidir. Marina yat kulüpleri özellikle liman taşımacılığı için tenderlere ihtiyaç duyar — üyeleri iskele, demirleme ve kıyı arasında taşımak. Depolama ve bakım üyeler için görünmez olmalıdır.
      features:
        - RIB Liman taşımacılığı ve üye transfer hizmeti için yüksek kaliteli ihale teklifleri
        - 'Premium ekipman: EVA deckler, özel üye renkleri, markalı döşeme'
        - Personel olmadan üye erişimi için kendi kendine hizmet ödeme sistemi
        - Sezon dışı depolama ve yıllık yenileme programı
    - title: Macera ve Aktivite Odaklı Oteller
      subtitle: Rehberli turlar, SUP yoga, şnorkel gezileri, grup aktiviteleri
      description: Macera destinasyonu olarak kendini konumlandıran tesisler — rehberli turlar, SUP yoga, gün batımı paddle aktiviteleri, şnorkel gezileri ve grup aktiviteleri sunmaktadır. Filonun hem serbest kiralama hem de rehberli program modellerini desteklemesi gerekir; ekipman, misafirlerin kendi başına kullanımı ile eğitmen liderliğindeki turlar arasında sorunsuz geçiş yapabilmelidir. Bu tesislerin, yüksek frekansta misafir değişimleri için dayanıklı ekipmanlara ve grup aralarında kolay temizlenebilirliğe ihtiyacı vardır.
      features:
        - Çok yönlü karma filo, kiralama + rehberli tur modellerini destekler
        - Tandem kayaklar ve grup aktiviteleri için ekstra stabil SUP platformlar
        - 'Rehber ekipmanı: eğitmen tahtaları, su geçirmez kutular, su geçirmez iletişim araçları'
        - 'Mevsimlik ekipman rotasyonu: yaz filosu → kış depolama programı'
        - Günlük misafir kullanımı için dayanıklı yapı, minimum bakım gerektirir
