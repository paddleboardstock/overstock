testimonial:
  content: Paddle Board Overstock üç tatil köyü mülkü boyunca tüm plaj aktivite programımızı tasarladı ve donattı. 120 SUPs, güvenlik altyapısı ve personel eğitimi — hepsi tek bir gönderide sağlandı. Konuklarımızın su aktivitelerine katılımı ilk sezonda %60 arttı.
  name: Sophie Laurent
  title: Misafir Deneyimi Direktörü, Azure Bay Resorts — Phuket, Tayland
content_segments:
  tagline: Tatil Köyü Profilleri
  title: Kıyı Otelcilik Çözümleri<br />Mülk Türüne Göre
  subtitle: Her tatil köyü mülkünün benzersiz bir misafir profili, etkinlik karışımı ve operasyonel ritmi vardır — butik eko-lodjlardan geniş lüks sahil tatil köylerine kadar. Mülk sınıfına ve misafir beklentilerine uygun su sporları programları tasarlıyoruz.
  items:
    - title: Sahil Lüks Tatil Köyleri
      subtitle: VIP transferler, su etkinlikleri, premium misafir deneyimi
      description: Lüks sahil mülkleri — Four Seasons, Aman ve benzeri lüks gruplar — su sporlarının önemli bir misafir ayrıcalığı olduğu yerler, memnuniyet puanlarını ve ek gelirleri artırır. Filonun premium görünmesi, yaş grupları ve yetenek seviyeleri arasında çeşitlilik sunması ve tatil köyünün mevcut konsiyerj ve rezervasyon sistemleri ile sorunsuz entegre olması gerekir. Misafir görünümü beklentileri son derece yüksektir — ekipmanın durumu ve sunumu doğrudan 5 yıldızlı yorumları etkiler.
      features:
        - Uyumlu tatil köyü renklerinde premium markalı SUPs filosu
        - 'Misafire hazır sunum: tatil köyü renkleri ile uyumlu, logo marka uygulaması, düzenlenmiş ekipman gösterimi'
        - Premium konuk deneyimleri ve fotoğraf anları için özel sanat serisi tahtalar
        - 'Entegre güvenlik altyapısı: şamandıra hatları, cankurtaran istasyonları, AED'
        - 'Gelir yönetimi: dinamik fiyat şablonları, ek satış eğitimi, paket birleştirme'
    - title: Özel Ada Tatil Köyleri
      subtitle: Sessiz, kendi kendine yeten misafir su aktiviteleri
      description: 'Özel ada tatil köyleri, lojistiğin karmaşık olduğu ve her teslimatın önemli olduğu uzak bölgelerde faaliyet göstermektedir. Misafir su aktivitelerinin kendi kendine yetebilmesi gerekir: kompakt şekilde depolanan, talep üzerine şişirilen, minimum bakım gerektiren ve misafirler geldiğinde güzel görünen ekipmanlar. Filomuzun programlarını deniz uçağı ve deniz taşımacılığı zamanlarına göre planlıyoruz ve dayanıklı yapımız ekipmanı uzun sezonlar boyunca ana kara desteği olmadan misafir hazır tutar.'
      features:
        - Kompakt şişme filo — uzak adalarda verimli şekilde taşınır ve depolanır
        - Çok sezonlu misafir kullanımı için ticari sınıf PVC yapısı
        - Dahil edilmiş onarım kitleri ve video rehberliği ile kolay yerinde bakım
        - Ada estetiğine uygun özelleştirilmiş tatil köyü markalaması
    - title: Göl Kenarı ve Eko Tatil Merkezleri
      subtitle: Doğayla entegre misafir deneyimleri
      description: Göl kenarı mülkleri, ekolojik tesisler ve doğal ortamı tamamlayan sessiz, düşük etkili su aktiviteleri sunan doğa kaçışları. Ekipman mümkün olduğunca motorsuz olmalı, alan sınırlı olduğunda kolayca depolanabilmeli ve tüm misafirler için ortam deneyimini koruyacak şekilde sessiz olmalıdır.
      features:
        - Doğa esinli sanat serisi motorsuz SUP filo
        - Konuk kullanımı için sessiz elektrikli pompa şişirme istasyonları
        - Sürdürülebilirlik markasıyla uyumlu çevre dostu malzemeler ve ambalajlar
        - Depolama rafları ve iskele tarafı organizasyon sistemleri dahil
    - title: Plaj Kulüpleri
      subtitle: Misafir eğlencesi ve sahil atmosferi
      description: Plaj kulüpleri, yüksek enerjili ve görsel odaklı bir ortam işletir ve ekipman atmosferin bir parçasıdır. Misafir eğlencesi için şık paddle board’lara, sahil aktiviteleri için SUP kiralamalarına ve mekan kadar güzel görünen ekipmana ihtiyaç duyarlar. Filonun kullanımı kolay olmalı, değişken beceri düzeyine sahip misafirlerin günlük kullanımına dayanmalı ve yoğun saatlerde hızlıca devreye girebilmelidir.
      features:
        - Mekan dekoru olarak da kullanılan imza sanat serisi SUPs
        - Misafir eğlencesi için kiralamaya hazır SUP filo
        - Plaj kulübü görsel kimliğine uygun özel renk ve markalama
        - Yüksek devri gerektiren operasyonlar için hızlı fırlatma ve geri alma sistemleri
        - Günlük tuzlu suya dayanıklı UV yapı
    - title: Özel Üye Kulüpleri ve Yat Kulüpleri
      subtitle: Üye su sporları ve özel kürek programları
      description: Su sporlarının gelir kaynağı yerine üye faydası olduğu özel kulüpler. Ekipman daha yüksek estetik standartlara uymalı, üyeler için talep üzerine hazır bulunmalı ve minimum personel gözetimi gerektirmelidir. Marina yat kulüpleri, liman etrafında üye rekreasyonu için markalı SUP filolar kullanır. Depolama ve bakım üyeler tarafından görünmez olmalıdır.
      features:
        - Üye su sporları için premium markalı SUP filolar
        - 'Premium ekipman: EVA deckler, özel üye renkleri, markalı döşeme'
        - Personel olmadan üye erişimi için kendi kendine hizmet ödeme sistemi
        - Sezon dışı depolama ve yıllık yenileme programı
    - title: Macera ve Aktivite Odaklı Oteller
      subtitle: Rehberli turlar, SUP yoga, şnorkel gezileri, grup aktiviteleri
      description: Macera destinasyonu olarak kendini konumlandıran tesisler — rehberli turlar, SUP yoga, gün batımı paddle aktiviteleri, şnorkel gezileri ve grup aktiviteleri sunmaktadır. Filonun hem serbest kiralama hem de rehberli program modellerini desteklemesi gerekir; ekipman, misafirlerin kendi başına kullanımı ile eğitmen liderliğindeki turlar arasında sorunsuz geçiş yapabilmelidir. Bu tesislerin, yüksek frekansta misafir değişimleri için dayanıklı ekipmanlara ve grup aralarında kolay temizlenebilirliğe ihtiyacı vardır.
      features:
        - Çok yönlü karma filo, kiralama + rehberli tur modellerini destekler
        - Grup aktiviteleri için ekstra stabil SUP platformlar
        - 'Rehber ekipmanı: eğitmen tahtaları, su geçirmez kutular, su geçirmez iletişim araçları'
        - 'Mevsimlik ekipman rotasyonu: yaz filosu → kış depolama programı'
        - Günlük misafir kullanımı için dayanıklı yapı, minimum bakım gerektirir
