how_to_choose:
  title: Doğru Boyutu Nasıl Seçilir
  cards:
    - title: SUP Yönetim Kurulları
      description: Boyu, ağırlığınıza ve kullanım amacınıza göre seçin. Daha geniş tahtalar (32"+) daha fazla stabilite sunar. Daha uzun tahtalar (11-12 ft) tur için daha iyi yön tutar. Daha ağır kürekçiler daha yüksek hacimli tahtalara ihtiyaç duyar.
    - title: Kano
      description: Tek kanolar (9 ft) tek başına seyahat ve nehirler için en iyisidir. İkili kanolar (12 ft) iki kürekçiyi veya bir yetişkin ve ekipmanını alır. Toplam yük, ekipman dahil ağırlık kapasitesini kontrol edin.
    - title: Botlar & RIBs
      description: Bot uzunluğunu yolcu sayısına ve kullanım amacına göre seçin. Daha büyük RIBs (4.5 m+) açık deniz ve kurtarma için uygundur. Daha küçük botlar (2.7 m) servis botu ve balıkçılık platformu olarak çalışır.
