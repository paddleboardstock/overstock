hero:
  title: Boyut ve Özellikler Kılavuzu
  subtitle: Her Paddle Board Overstock ürün için boyutlar, kapasiteler ve önerilen kullanım alanları.
categories:
  SUP: Performanstan ödün vermeden taşınabilirlik için tasarlanmış şişirilebilir SUP panolar. Kilonuza ve kürek çekme tarzınıza uygun doğru boyu seçin.
  ACCESSORY: Tahtanızı tamamlayan aksesuarlar ve paketler. Birden fazla seçenekle evrensel boyut.
