how_to_choose:
  title: Doğru Boyutu Nasıl Seçilir
  cards:
    - title: Her Yönlü SUP Tahtaları
      description: ~11 ft’lik her yönlü panolarımız (32" genişliğinde, 6 inç drop-stitch) denge, hız ve kapasiteyi dengeler. Tahta hacmini kilonuza göre eşleştirin — daha ağır kürekçiler daha fazla hacme ihtiyaç duyar.
    - title: Genişlik ve Kalınlık
      description: Daha geniş tahtalar (32"+) yeni başlayanlar, yoga ve balıkçılık için daha fazla denge sağlar. 15 PSI uzunluğunda 6 inç kalınlık, sürücü ve ekipman altında güverteyi rijit tutar.
    - title: Paketler ve Aksesuarlar
      description: Her tahta, tam bir paket olarak gönderilir — tahta, seyahat sırt çantası, el pompası, ayarlanabilir kürek, çıkarılabilir yüzgeç, spiral kayış ve onarım kiti. Sürücü ve ekipmanı için maksimum yükü kontrol edin.
