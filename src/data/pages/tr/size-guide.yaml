hero:
  title: Boyut ve Özellikler Kılavuzu
  subtitle: Her Paddle Board Overstock ürünü için boyutlar, kapasiteler ve önerilen kullanım alanları.
categories:
  inflatable: Taşınabilirlikten ödün vermeden performans sunan şişme SUPs ve kanolar. Ağırlığınıza ve kürek çekme tarzınıza uygun doğru boyutu seçin.
  rib: Kıyı seyri, devriye ve profesyonel deniz operasyonları için sert gövdeli şişme botlar. Uzunluk ve motor kapasitesine göre seçim yapın.
  accessory: Su aracınızı tamamlayacak aksesuarlar ve güvenlik ekipmanları. Evrensel boyutlandırma ve birden fazla seçenek.
