breadcrumb: OEM/ODM Üretici
tldr:
  summary: Aquafarer doğrudan OEMfabrikadan /ODM üreticidir. 12.000 m² ISO 9001:2015 tesis, yıllık 15.000 birim üretim, CE/BSCI/REACH/UKCA uyum, MOQs 2-10 birim arasında düşük.
  points:
    - 12.000 m² ISO 9001:2015 sertifikalı Qingdao tesisi
    - Yıllık 15.000 birim kapasite ve 200-300 nitelikli işçi
    - CE 2013/53/EU, UKCA, BSCIREACH , uyum
    - 'Düşük MOQs: 2-5 adet (RIB), standart modeller için 5-10 adet (SUP)'
    - + Qingdao nakliye yapan 50 ihracat ülkesi FOB
