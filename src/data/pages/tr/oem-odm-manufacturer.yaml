process_section:
  eyebrow: Sürecimiz
  title: Uçtan OEMUca /ODM İş Akışı
  subtitle: Tasarım brifinginden konteyner yüklemesine kadar — özel etiketli şişme su aracınıza altı adım.
  steps:
    - step: '01'
      title: Teknik Özellikler ve Tasarım Özeti
      desc: Hedef özelliklerinizi, CAD çizimlerinizi veya referans ürününüzü paylaşın. Mühendislik ekibimiz, fiyat vermeden önce malzemeleri, boyutları ve uyumluluk gereksinimlerini (CE, BSCI) inceler.
    - step: '02'
      title: 3D Kalıp Prototipi
      desc: CNCSUP Tahtalar, kayaklar gövdeleri ve bileşenler için özel kalıplar tasarlar ve makine RIB yaparız. Prototip örnekleri onayınız için 15–20 iş günü içinde üretilir.
    - step: '03'
      title: Malzeme Seçimi ve Örnek Üretimi
      desc: Askeri kalite PVC (0,9mm–1,2mm) Hypalon CSMveya çekirdek kumaşlar arasında seçim yapabilirsiniz. Markanızın drop-stitch renkleri, logosu ve ambalajıyla ön üretim örnekleri üretiyoruz.
    - step: '04'
      title: CE Fabrika Denetimi ve Uyum
      desc: Her OEM emir, uyum beyannamesi CE , ISO 9001 izlenebilirlik kayıtları, BSCI sosyal uyumluluk raporu ve REACH maddi beyanlar gibi uyumluluk belgeleri içerir.
    - step: '05'
      title: Toplu Üretim ve Hat İçi QC
      desc: Üretim çalışmaları, 100 puanlık kalite kontrol listemizi takip eder. Her ünite paketlemeden önce 24 saat basınç tutma testi, dikiş soyulma testi ve görsel denetimden geçer.
    - step: '06'
      title: FOB Qingdao Lojistik ve Nakliye
      desc: Bitmiş ürünler Qingdao limanında paletlenir, shrink ambalajlanır ve konteyner olarak yüklenir. Tüm ihracat belgelerini, gümrük işlemlerini ve gerçek zamanlı sevkiyat takibi sağlıyoruz.
capabilities_section:
  eyebrow: Üretim Yetenekleri
  title: Ne İnşakatlıyoruz
  subtitle: Küresel ortaklar için altı temel üretim kapasitesi B2B .
  items:
    - title: Drop-Stitch SUP Karton Üretimi
      desc: drop-stitch Sert, yüksek basınçlı (15–20PSI) ayakta kürek tahtaları için tam boy çekirdek laminasyonu. Özel uzunluk, genişlik, kalınlık, sallama profili ve grafik tasarım.
    - title: PVC Şişme Bot Üretimi
      desc: Yüksek frekanslı kaynaklı PVC tekneler, tenderler ve spor tekneler. Çoklu oda konfigürasyonları, zemin seçenekleri (çıta, hava güvertesi, roll-up) ve aksesuar entegrasyonu.
    - title: Hypalon RIB Tekne Üretimi
      desc: Hypalon CSM Fiberglas veya alüminyum derin V gövdelere bağlanmış ticari sınıf tüpler. Devriye, kurtarma, tur ve dalış operasyonları için 3,3 m ile 6,0 m uzunluğunda.
    - title: Özel Etiket ve Özel Markalama
      desc: 'Tam özel etiket hizmeti: özel logo ısı transferi veya serigrafi, markalı ambalaj (perakende kutular, taşıma çantaları), dilinizde kullanım kılavuzları ve barkod/UPCkayıt.'
    - title: Özel Kalıp ve Takım Tasarımı
      desc: Kendi içinde bulunan 3D CAD/CAM mühendislik ekibi. Benzersiz gövde şekilleri, güverte konfigürasyonları ve aksesuar montaj noktaları için özel alüminyum ve kompozit kalıplar tasarlayıp üretiyoruz.
    - title: OEM Aksesuarlar ve Kitting
      desc: Can yeleği (CE12402), çift hareketli pompalar, karbon/naylon kürekler, tamir kitleri, taşıma çantaları ve tasma montajları. Perakendede hazır sunum için tam donanım ve paket paketleme.
experience_section:
  eyebrow: Gerçek Dünya Deneyimi
  title: Markaları Oluşturan Ortaklıklar
  subtitle: Üretim / üretim için ortaklık yapan markalar ve organizasyonlardan gerçek Aquafarer OEMODM hikayeler.
  stories:
    - quote: Bir Aquafarer peçete üzerinde bir eskiz ve gereksinimler listesiyle ayıldık. Sekiz ay sonra, üretime hazır bir ürün ilk CE denemede sertifikadan geçti.
      narrative: Üretim için yeni bir tasarıma sahip Avrupalı bir girişim SUP Aquafarer ODM . Aquafarer Ar-Ge ekibi, konsepti CAD tasarımı, FEA yapısal analizi, hidrodinamik simülasyon, kalıp üretimi, prototip üretimi ve üretim aletleri üzerinden taşıdı. Girişimin kurucusu süreç boyunca Qingdao'yu üç kez ziyaret etti. Son ürün, CE herhangi bir değişiklik olmadan sertifikasyon geçti — kurucunun bu sonucu Aquafarermühendislik ekibinin Avrupa düzenleyici gereksinimlerini baştan anlamasına bağlıyor.
      context: Avrupa SUP marka lansmanı, 2023-2024
      source: Brand Founder
    - quote: NDA Koruma ve IP güvenliği seviyesi, Aquafarer özel tasarımlarımızı paylaşma konusunda bize güven veriyor. Bizim fikri mülkiyetimizi kendi fikrinlerinmiş gibi görüyorlar.
      narrative: ABD merkezli bir deniz ekipmanı şirketi, özel valf teknolojisine sahip bir şirket, büyük ölçekte üretim yaparken fikri mülkiyetlerini koruyabilecek bir üretim ortağına ihtiyaç duyuyordu. Beş Çinli üreticiyi denetledikten sonra, Aquafarer fabrikanın IP koruma protokollerine, güvenli tasarım dosya işlemesine ve sıkı gizlilik sözleşmelerine istekli olarak seçim yaptılar. Ortaklık, dört yıl içinde hiç IP vakası yaşanmayan üç ürün hattı üretti.
      context: ABD deniz ekipman şirketi, OEM 2021'den beri ortaklık
      source: Operasyonlardan Sorumlu Başkan Yardımcısı
