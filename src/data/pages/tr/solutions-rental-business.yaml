testimonial:
  content: Yerel bir dükkandan 5 tahta kiralıyordum ve gelirimin %60'ını onlara kaybediyordum. Paddle Board Overstock kendi 15 SUPslık filomu kurmama yardımcı oldu. Sağladıkları ROI hesaplayıcısı 4 ayda başa baş noktaya geleceğimi gösteriyordu — aslında 3 ay sürdü. Şimdi 30 tahtaya genişliyorum ve kano ekliyorum.
  name: Daniel Okonkwo
  title: Sahibi, Lakeland SUP Kiralamalar — Ontario, Kanada
content_segments:
  tagline: Kiralama Profilleri
  title: Su Sporları Kiralama Çözümleri<br />Operatör Tipine Göre
  subtitle: Farklı kiralama operasyonlarının farklı ihtiyaçları vardır — küçük sahil kenarı SUP kiralamalarından büyük ölçekli tatil köyü su sporları merkezlerine kadar. Ekipman paketlerimizi ve destek modelimizi buna göre özelleştiriyoruz.
  items:
    - title: Plaj ve Göl Kenarı SUP Kiralamaları
      subtitle: Yüksek hacimli, düşük karmaşıklıkta işlemler
      description: Operatörler, ayakta kullanılan sörf tahtaları ve kayıkları doğrudan plaj ziyaretçilerine ve göl ziyaretçilerine kiralar. Önceliğiniz, kiralamalar arasındaki dönüş süresini en aza indirmek, ekipmanı sürekli kullanımda tutmak ve küçük bir depolama alanıyla mevsimsel talep artışlarını yönetmektir.
      features:
        - Şişirilebilir SUP filoları, düz şekilde katlanabilir — iskele veya römork gerekmez
        - Ticari sınıf PVC, sezonda 100+ kiralama döngüsü için derecelendirilmiştir
        - Hızlı kuruyan, aynı gün yeniden kiralama için UV-a dayanıklı kumaş
        - Filonun kolay tanımlanması için renk kodlu pano aralıkları
    - title: Tatil Köyü ve Otel Su Sporları Merkezleri
      subtitle: Misafir deneyimi ve marka uyumu
      description: Tesis içinde su sporları sunan tatil köyleri ve oteller. Ekipman, premium görünmeli, başlangıç ve orta düzeydeki misafirler için güvenilir şekilde çalışmalı ve tesisin mevcut aktivite rezervasyon ve faturalama iş akışlarıyla uyumlu olmalıdır.
      features:
        - Tatil köyü renkleriyle uyumlu özel markalı SUP tahtalar ve can yelekleri
        - 'Karışık filo: SUPs, kano, pedal bot ve küçük RIB botlar'
        - Plajda şişirme için sessiz, yakıtsız elektrikli pompa çözümleri
        - Personel eğitimi ve bakım onboarding dahil
    - title: Tekne ve RIB Kiralama Operatörleri
      subtitle: Ticari sınıf gemi kiralama filoları
      description: Saatlik veya yarım günlük olarak motorlu tekneler — RIB botlar, şişme botlar ve küçük sürat tekneleri — kiralayan operatörler. Filonuz deniz güvenliği düzenlemelerine uygun olmalı, yoğun misafir kullanımına dayanmalı ve kiralama aralarında mekanik arızaları minimize etmelidir.
      features:
        - RIB paketleri ile 30–90 HP dıştan takma motor uyumlu transomlar
        - Uzun vadeli yapısal bütünlük için deniz sınıfı kontrplak zemin panelleri
        - Daha hızlı işlem için hızlı başlatma vana sistemleri
        - Yedek parça kiti + çağrıldığında teknik destek SLA
    - title: Tur ve Macera Operatörleri
      subtitle: Rehberli gezi filoları
      description: Rehberli su sporu turları düzenleyen operatörler — SUP safari turları, mağara kanosu, şnorkel gezileri veya ada gezisi RIB turları. Ekipman, yeni başlayan tur misafirleri için yeterince stabil olmalı, gruplar arasında temizlemesi hızlı olmalı ve çeşitli su koşullarında günlük rehberli kullanıma dayanıklı olmalıdır.
      features:
        - İlk kez binecekler için ekstra stabil SUP platformlar (32" genişliğinde+)
        - Çift/tandem kano seçenekleri, çift/grup tur konfigürasyonları için
        - Şnorkel ekipmanları, kuru çantalar ve soğutucular için yerleşik yük kapasiteleri
        - Ticari operasyonlar için CE + USCG uyumluluk dokümantasyonu
