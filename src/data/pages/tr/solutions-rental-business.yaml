        description: 10 SUP board, kürekler, pompalar, can yelekleri ve tamir setleri — başlatmak için gereken her şey
      - title: Depolama Çözümleri
        description: Şişirilebilir ekipman düz bir şekilde paketlenir — depo veya römorka gerek yok
      - title: Kiralık Kalite Yapı
        description: Günlük kiralama kullanımı için inşa edilmiş ticari sınıf yapı
      - title: Başlangıç Pazarlaması
        description: Hizmetinizi başlatmanıza yardımcı olacak markalı fotoğraf öğeleri ve kiralama menüsü şablonları
    cta_text: Kiralama Filosunu Başlatın
    cta_href: /contact
