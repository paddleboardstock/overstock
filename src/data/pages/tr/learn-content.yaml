articles:
  sup:
    - title: SUP Temeller — Yeni Başlayanlar İçin Rehber
      desc: Bir aceminin bilmesi gereken her şey — tahta türleri, raket boyutları, duruş ve ilk gün ipuçları.
    - title: SUP Boyut Rehberi
      desc: Ağırlığınıza, beceri seviyenize ve kürek çekme tarzınıza uygun doğru tahta uzunluğunu, genişliğini ve hacmini bulun.
    - title: Şişme ve Sert Tahta
      desc: Hangisi sizin için doğru? Taşınabilirlik, performans, dayanıklılık ve maliyet karşılaştırıldı.
    - title: Orta Düzey Teknikler
      desc: Gelişmiş kürek çekme teknikleri, dönüş teknikleri ve dalgalı suda kontrol ile kürek çekme becerilerinizi yükseltin.
    - title: Şişme SUP Nasıl Seçilir
      desc: Ana faktörleri keşfedin — yapı, kalınlık, palet kurulumu ve dahil edilmiş aksesuarlar.
    - title: Su Güvenliği
      desc: Hava durumu okuma, PFD seçimi, kendi kurtarma ve grup kürek çekme dahil temel güvenlik bilgileri.
  inflatable-boat:
    - title: Malzeme Referansı
      desc: PVC, Hypalon, drop-stitch, denye dereceleri — şişme ekipmanınızın neyden yapıldığını anlayın.
    - title: PVC vs Hypalon
      desc: Şişme botlar için PVC ve Hypalon kumaşların kesin karşılaştırması — dayanıklılık, UV direnci ve maliyet.
    - title: Drop-Stitch Çekirdek Açıklaması
      desc: Binlerce iç ipliğin 12-15 PSI’de yüksek performanslı şişme SUPs için nasıl sert bir platform oluşturduğunu öğrenin.
    - title: Şişme Teknolojisi Genel Bakış
      desc: Şişme botlar ve SUPs nasıl üretilir — malzeme yerleştirmeden valf sistemleri ve dikiş kaynaklarına kadar.
    - title: Rigidi Şişme Bot (RIB) Rehberi
      desc: RIB yapısı, gövde türleri, tüp malzemeleri ve ihtiyaçlarınıza uygun doğru RIB seçimi hakkında her şey.
    - title: Şişme Bot vs RIB
      desc: Geleneksel şişme botlar ile sert gövdeli şişme botlar arasındaki ana farklar ve çeşitli kullanım durumları.
  water-safety:
    - title: Su Güvenliği Rehberi
      desc: Her kürekçi için temel güvenlik bilgileri — hava durumu, PFD’ler, kendi kurtarma ve grup kürek çekme protokolleri.
    - title: Can Yeleği & PFD Rehberi
      desc: SUP, kano, tekne ve profesyonel kullanım için doğru kişisel can kurtarma cihazını nasıl seçilir.
    - title: SUP Güvenlik Kontrol Listesi
      desc: Her ayakta kürek tahtası kullanıcısının suya çıkmadan önce takip etmesi gereken ön-gemi güvenlik kontrol listesi.
    - title: Soğuk Suyla Kürek Çekme Güvenliği
      desc: Soğuk su koşullarında kürek çekerken alınması gereken temel önlemler, ekipman ve teknikler.
    - title: Başlangıç Seviyesi Kürek Hataları
      desc: İlk kez kürek çekenlerin yaptığı yaygın hatalar ve bunlardan nasıl kaçınılacağı, daha güvenli ve keyifli bir deneyim için.
    - title: CE Sertifikası Açıklaması
      desc: CE sertifikasının şişme su araçları için ne anlama geldiği — standartlar, testler ve güvenlik açısından neden önemli olduğu.
ui:
  read_guide: Kılavuzu oku →
  card_tech: Deniz güvenliği mühendisliği ve malzeme testi
  card_products: Aquafarer ürün kataloğunun tamamını keşfedin
  card_trust: CE, ISO ve BSCI uyumluluk
materials:
  intro_p1: Bir şişme su aracının performansı, dayanıklılığı ve güvenliği neredeyse tamamen yapımında kullanılan malzemelere bağlıdır. Tüpleri oluşturan kumaşlardan, SUP tahtaya sertlik veren ipliklere kadar her malzeme seçimi, ürünün su üzerindeki performansını ve dayanıklılığını etkiler.
  intro_p2: 'Bu rehber, modern şişme su araçlarında kullanılan dört temel malzemeyi kapsar: PVC kumaş, Hypalon CSM kauçuk, drop-stitch çekirdek yapısı ve EVA köpük döşeme. Bu malzemeleri anlamak, ihtiyaçlarınıza uygun ürünü seçmenize ve maksimum ömür için bakımını yapmanıza yardımcı olacaktır.'
  labels:
    advantages: Avantajlar
    limitations: Sınırlamalar
    best_for: 'En iyi kullanım alanları:'
  items:
    - name: PVC (Polivinil klorür)
      summary: Rekreasyonel şişme botlar ve SUPs için endüstri standardı. Çok katmanlı lamine kumaş, erişilebilir bir fiyat noktasında mükemmel ağırlık-hasır oranı sunar.
      pros:
        - Uygun fiyatlı — Hypalon’ten %30-50 daha ucuz
        - Hafif ve kullanımı kolay
        - Doğru kaplamalarla iyi UV direnci
        - Geniş renk ve bitiş seçenekleri
        - PVC yamaları ve solvent yapıştırıcı ile kolay onarım
      cons:
        - Hypalon’ya göre daha kısa ömür (7-10 yıl)
        - Soğuk hava koşullarında daha az esnek
        - Daha düşük kimyasal direnç
        - Zamanla plastikleştirici göçü gelişebilir
      best_for: Rekreasyon amaçlı SUPs, bütçe dostu botlar, kiralama filoları, mevsimlik kullanım, tatlı su ve kıyı ortamları.
    - name: Hypalon (CSM Kauçuk)
      summary: Olağanüstü dayanıklılık, UV direnci ve uzun ömrü ile bilinen premium sentetik kauçuk malzeme. Ticari ve askeri sınıf şişme botlar için altın standart.
      pros:
        - Olağanüstü UV ve ozon direnci
        - Uygun bakım ile 15-20 yıl ömür
        - Mükemmel soğuk hava esnekliği
        - Üstün kimyasal ve yağ direnci
        - PVC'den daha uzun süre renk korur
      cons:
        - PVC'den önemli ölçüde daha pahalı
        - Daha ağır kumaş ağırlığı
        - Daha az renk seçeneği
        - Onarım için özel yapıştırıcılar gerekir
        - Dünya çapında daha az üretim tesisi
      best_for: Ticari RIBs, arama ve kurtarma, askeri uygulamalar, tropik iklimler, uzun süreli filo sahipliği.
    - name: Drop-Stitch Çekirdek
      summary: Şişirilebilir SUPs'i devrim niteliğinde değiştiren teknoloji. Üst ve alt kumaş katmanlarını birbirine bağlayan binlerce polyester iplik, sert kabuk performansı için yüksek basınçlı şişirme sağlar.
      pros:
        - 12-20 PSI arasında son derece sert
        - Hafif — tam boy board için 18-30 lbs
        - Depolama ve seyahat için düz katlanabilir
        - Mükemmel darbe direnci
        - Sıcaklık aralıklarında tutarlı performans
      cons:
        - Yüksek basınçlı pompa gerektirir
        - Delik onarımı tek katmanlıdan daha karmaşıktır
        - Standart şişirilebilirlerden daha yüksek üretim maliyeti
        - Zamanla basınç kaybı periyodik olarak doldurmayı gerektirir
      best_for: Ayakta kürek tahtaları, kayıklar, şişme botlar için hava platformları, şişirilebilir taşınabilirlik ile sert performans gerektiren herhangi bir uygulama.
    - name: EVA Köpük Güverte
      summary: SUP tahtaları ve bot güvertelerinde çekiş pedleri için kullanılan kapalı hücre EVA (etilen-vinil asetat) köpük. Yastıklama, kavrama ve termal izolasyon sağlar.
      pros:
        - Islak veya kuru mükemmel kaymaz kavrama
        - Uzun kürek turlarında yorgunluğu azaltan yastıklama
        - Soğuk güverte yüzeyinden termal izolasyon
        - UV ve tuzlu suya dayanıklı
        - Çok renkli parça birleştirme ve lazerle kazınmış tasarımlarda mevcut
      cons:
        - 2-3 yıl ağır kullanım ile aşınabilir
        - Delaminasyonu önlemek için düzgün bir şekilde yapıştırılmalıdır
        - Yapısal değil — sertliği etkilemez
        - Hafif ağırlık ekler (tahta başına 200-400 g)
      best_for: SUP güverte çekişi, tekne güvertesi yastığı, kayak koltuğu konforu, kaymaz ayak gerektiren her yüzey.
  selection:
    title: Malzeme Seçim Rehberi
    subtitle: 'Ana kullanım amacınıza göre doğru malzemeyi seçin:'
    headers:
      - Kullanım Durumu
      - Önerilen Malzeme
      - Neden
    rows:
      - - Rekreatif SUP kürek sporu
        - Drop-stitch PVC
        - Hafif, sert, uygun fiyatlı — gündelik kürekçiler için ideal denge
      - - Aile teknesi / göl teknesi
        - PVC (1100 denier)
        - Maliyet açısından etkili, kolay tamir edilebilir, rekreatif kullanım için yeterli dayanıklılık
      - - Ticari RIB / devriye teknesi
        - Hypalon CSM
        - Maksimum UV direnci, 15-20 yıl ömür, kimyasal/yağ direnci
      - - Kiralık filo SUP tahtaları
        - Drop-stitch PVC + EVA güverte
        - Dayanıklı, tamir edilebilir, yüksek devirli kullanım için iyi değer
      - - Arama ve kurtarma operasyonları
        - Hypalon CSM
        - Aşırı koşullarda güvenilirlik, soğuk esnekliği, kimyasal direnç
      - - Turlama / keşif kayığı
        - Drop-stitch PVC
        - Seyahat için paketlenebilir taşınabilirlikle sert performans
  deep_dive:
    title: Derin Dalış Rehberleri
    topics:
      - title: Deniz Kalitesinde PVC
        desc: Çok katmanlı lamine PVC kumaş — UV direnci, aşınma testi ve denier derecelendirmesi açıklanmıştır.
      - title: PVC vs Hypalon
        desc: İki baskın şişme tekne malzemesinin kesin karşılaştırması — maliyet, ömür, UV direnci.
      - title: Drop-Stitch Çekirdek
        desc: Binlerce iç ipliğin 12-15 PSI basınçta sert, yüksek basınçlı şişme yapıları nasıl oluşturduğu.
      - title: RF Kaynak Teknolojisi
        desc: Yüksek frekans kaynak, güçlü ve tutarlı dikişler oluşturur — nasıl çalışır ve neden önemlidir.
      - title: PSI ve Performans
        desc: Şişme SUPs ve botlar için hava basıncının neden önemli olduğu — sertlik, ağırlık kapasitesi ve sürüş kalitesi.
      - title: Kalite Testi
        desc: Basınç testi, yüzdürme testleri, UV yaşlandırma ve tahribat testi — kalite sürecimiz.
      - title: EVA Köpük Güverteler
        desc: Kapalı hücre EVA köpük güverte pedleri — SUP ve bot güverteleri için tutuş, konfor ve dayanıklılık.
      - title: Malzeme Bakımı
        desc: Şişme ürünler için temizlik, UV koruma, küf önleme ve depolama en iyi uygulamaları.
