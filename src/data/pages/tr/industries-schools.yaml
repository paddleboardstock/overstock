hero:
  tagline: Su Sporları Okulları ve Eğitim Merkezleri
  title: Ekipman Çözümleri<br />SUP ve Kano Okulları için
  subtitle: Kürek okulları, sörf eğitimi, kano eğitimi ve her ölçekten su sporları eğitim programları için güvenilir, ticari seviyede ekipman.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP okullar ve eğitim merkezleri için boardlar
direct_answer: Aquafarer, dünya çapındaki SUP ve kano okullarına ticari seviyede boardlar, güvenlik ekipmanları ve eğitmen paketleri sağlar. Ekipmanımız günlük eğitim kullanımına yönelik olarak üretilmiştir — daha kalın PVC, takviye edilmiş drop-stitch gövdeler ve yeni başlayanlara güven veren, eğitmenlere güvenilirlik sağlayan stabil gövde tasarımları. Paketler özelleştirilmiş marka, yedek parça programları ve eğitim kaynakları içerir.
solution_offerings:
  - title: Okul Başlangıç Paketi
    subtitle: Yeni programlar ve küçük eğitim merkezleri için
    badge: Popular
    features:
      - title: Öğrenci Boardları
        description: Başlangıç dersleri için stabil platforma sahip 10–25 çok amaçlı SUP board veya eğlence kanoları
      - title: Eğitmen Boardları
        description: Koçluk için ekstra stabilite ve kaymaz EVA güverteli daha geniş, daha uzun boardlar
      - title: Güvenlik Ekipmanları
        description: Aynı renkte can yelekleri, kayışlar, düdükler ve atma torbaları
      - title: Depolama ve Taşıma
        description: Üst üste konabilir board rafları, yastıklı kano sehpaları ve taşıma arabaları
      - title: Müfredat Desteği
        description: Ders şablonları, güvenlik kontrol listeleri ve beceri ilerleme rehberleri
    cta_text: Okulum Paketi Başlat
    cta_href: /contact
  - title: Okul Premium Paketi
    subtitle: Kurulu okullar ve çok programlı işletmeciler için
    badge: Best Value
    features:
      - title: Tam Filosu
        description: Karışık filo (çok amaçlı, tur, çocuk boyu) ile 25–50 board veya kano
      - title: Eğitmen Filosu
        description: Yerleşik ses sistemi montajlı 3–5 özel eğitmen boardu
      - title: Güvenlik İstasyonu
        description: PFDler, telsizler, ilk yardım ve tabelalar ile merkezi güvenlik ekipmanı istasyonu
      - title: Marka Paketi
        description: Boardlar, kürekler, PFDler ve üniformalara tam logo baskısı
      - title: Bakım Programı
        description: Üç aylık bakım kitleri, yedek parça paketleri ve onarım eğitimi
    cta_text: Premium Paket Oluştur
    cta_href: /contact
  - title: Okul Franchise Paketi
    subtitle: Çok lokasyonlu zincirler ve franchise operatörleri için
    badge: Enterprise
    features:
      - title: Filo Standardizasyonu
        description: Tüm lokasyonlarda tutarlı öğrenci deneyimi için aynı ekipman
      - title: Merkezi Sipariş
        description: Toplu sipariş, toplu fiyatlandırma ve merkezi yedek parça yönetimi
      - title: Eğitmen Eğitimi
        description: Tüm eğitmenler için ekipman kullanımı ve bakım sertifikasyonu
      - title: Ortak Marka
        description: Franchise ile ortak markalama + Aquafarer ortak markalama seçenekleri
      - title: Genişleme Desteği
        description: Büyüme danışmanlığı, ekipman tahmini ve yeni lokasyon kurulumu
    cta_text: Franchise Planını Görüşün
    cta_href: /contact
benefits:
  - title: Günlük Eğitim İçin Tasarlandı
    description: Daha kalın PVC ve takviye edilmiş raylar, öğrencilerin günlük kullanımına, kum üzerine düşmelere ve taşlı inişlere dayanır.
    icon: tabler:shield
  - title: Kararlı Öğrenme Platformları
    description: Daha geniş gövdeler ve daha düz rockerlar, yeni başlayanlara güven verir. Eğitmenler, ekipman yerine öğretmeye odaklanır.
    icon: tabler:scale
  - title: Kolay Depolama ve Taşıma
    description: Şişirilebilir tasarım, küçük alanlarda saklanabilir. Sönmüş tahtalar, mobil eğitim için standart araç bagajlarına sığar.
    icon: tabler:box-seam
  - title: Özel Markalama
    description: Her tahtada okul logoları ve renkleri. Sizin markanız, sizin kimliğiniz — genel kiralık ekipman değil.
    icon: tabler:brush
content_segments:
  tagline: Okul Profilleri
  title: Su Sporları Eğitim Çözümleri<br />Program Türüne Göre
  subtitle: Paddle okulları, sörf akademileri, üniversite programları ve franchise operatörleri, müfredat entegrasyonundan çok lokasyonlu filo standardizasyonuna kadar farklı operasyonel zorluklarla karşılaşır. Ekipman paketlerini eğitim modeline göre yapılandırıyoruz.
  items:
    - title: Bağımsız SUP & Kano Okulları
      subtitle: Sahip işletilen eğitim merkezleri
      description: Küçükten orta büyüklüğe okullar, sahibi-eğitmenler tarafından yürütülür ve SUP dersleri, kano eğitimi ve sertifika kursları sunar. Ekipman, günlük eğitim kullanımı için yeterince dayanıklı, küçük işletme bütçesi için uygun fiyatlı ve tek bir filoda yeni başlayanlardan orta seviyeye kadar öğrencileri destekleyecek kadar çok yönlü olmalıdır.
      features:
        - Başlangıç dersleri için her yönden stabil SUP tahtalar ve eğlence amaçlı kayakslar
        - Sudan öğretim için ekstra stabiliteye sahip eğitmen özel tahtaları
        - Ders planı şablonları ve beceri ilerleme kılavuzları dahil
        - Takas indirimleri ile yıllık ekipman yenileme programı
    - title: Üniversite ve Yüksekokul Rekreasyon Programları
      subtitle: Büyük ölçekli öğrenci rekreasyon filoları
      description: Üniversite rekreasyon departmanları, kampüs rekreasyon olanaklarının bir parçası olarak kürek kulüpleri, kiralama programları ve öğretim kursları yürütmektedir. Ekipman, dönemler boyunca yoğun kullanım görür, kolay ödünç alma/teslim sistemleri gerektirir ve ilk kez öğrencilerden ileri düzey kürekçilere kadar değişen beceri seviyelerine dayanıklı olmalıdır.
      features:
        - Kurumsal kullanım döngüleri için derecelendirilmiş yüksek dayanıklılığa sahip PVC yapı
        - Kolay yönetim için beceri seviyesine göre renk kodlu filolar
        - RFID veya etiket tabanlı envanter takip sistemi uyumluluğu
        - Döneme dayalı sipariş ve ödeme koşulları ile toplu fiyatlandırma
    - title: Sörf Okulları ve Sörf Akademileri
      subtitle: Kıyı sörf eğitim programları
      description: Sörf okulları, okyanus ortamında SUP sörf, yüzü koyun kürek ve sörf kayığı becerilerini öğretmektedir. Ekipman, sörf bölgesi koşullarına dayanabilmelidir — darbe direnci, kum ve tuzlu su toleransı ve saatlik dersler arasında kolay durulama ve yeniden kullanım.
      features:
        - Takviye edilmiş kenarlara ve darbe dayanıklı yapıya sahip sörfe özgü şekiller
        - Öğrenci güvenliği için yumuşak yüzgeç seçenekleri ve spiral kayışlar
        - Dersler arasında kuruyan hızlı durulanabilir kumaş
        - Sezon sonu denetimi ve yenilemeleri ile filo değiştirme programı
    - title: Franchise ve Çok Şubeli Zincirler
      subtitle: Şubeler arasında standart ekipman
      description: Çok şubeli operatörler, birden fazla şehir veya bölgede standart eğitim programları yürütmektedir. Şubeler arasında filo tutarlılığı çok önemlidir — her öğrenci, hangi franchise şubesini ziyaret ederse etsin aynı ekipmanı deneyimlemelidir. Merkezi sipariş, marka standardı ve ölçekleme desteği gereklidir.
      features:
        - Tüm franchise şubelerinde aynı filo özellikleri
        - Hacim fiyatlandırmalı merkezi toplu sipariş
        - 'Ortak marka seçenekleri: franchise markası + Aquafarer ortak marka'
        - 'Yeni şube kurulum kiti: ekipman, tabelalar ve açılış envanteri'
