timeline:
  - year: '2012'
    title: Deniz İmalı Vakfı
    body: Paddle Board Overstock, Çin'in Weihai kentinde denizcilik ustalığı ve tahta üretimine adanmış özel bir şişme sörf tahtası atölyesi olarak başladı. Erken dönemde odak, pratik mühendislik deneyimi ve üretim disiplini sayesinde güvenilir şişme ürünler yaratmaktı.
  - year: '2015'
    title: İlk İhracatlar
    body: İlk ihracat siparişleri Japonya ve Kore'ye ulaştı ve bu, Paddle Board Overstock'ın uluslararası pazarlara girişini işaret etti. Şirket, Çin'in ötesinde kürekçilere ve su sporları meraklılarına hizmet vermeye başladı.
  - year: '2018'
    title: Fabrika Genişletilmesi
    body: 12.000 m²'lik bir üretim tesisine taşındı. RF kaynak hatları ve drop-stitch üretim kapasitesi eklendi, böylece daha büyük ölçekli üretim ve geliştirilmiş kalite kontrol sistemleri mümkün oldu.
  - year: '2020'
    title: Ar-Ge Merkezi Kuruldu
    body: PVC Kumaş laboratuvarı, hidrodinamik test tankı ve CAD/FEA simülasyon stüdyosu içeren özel bir Ar-Ge merkezi açtı. Ürün geliştirme, hafif yapı, geliştirilmiş dayanıklılık ve kullanıcı odaklı tasarıma odaklanacak şekilde genişledi.
  - year: '2022'
    title: Küresel Büyüme
    body: Ar-Ge ekibi 14 mühendise ve 200+ işçiye genişletildi. Panolar, Avrupa, Amerika ve Asya-Pasifik genelindeki kürekçilere ulaştı ve 50+ ülkeye gönderildi.
  - year: '2024'
    title: İnovasyon ve Tasarım Stüdyosu
    body: Yeni tahta serisi için konseptten üretime kadar tam hizmet tasarım ve inovasyon stüdyosu başlattı. İmza sanat serisi destelerimizi ve turne platformlarımızı genişletti.
  - year: '2026'
    title: Su Keşfinin Geleceğini İnşaat
    body: Bugün, Paddle Board Overstock şişme SUP tahtalar, kürek ekipmanları ve özelleştirilmiş deniz çözümleri geliştirmeye devam ediyor — insanları ve organizasyonları dünyanın sularıyla buluşturuyor. 50+ ülkeye hizmet veriliyor, yıllık 15.000 birim kapasite.
content_founding:
  tagline: Başlangıç
  title: Sahilde Doğdu
  subtitle: "Paddle Board Overstock, bir tahta ve bir vizyon ile Weihai'deki bir sahil atölyesinde başladı: Gerçek deniz koşullarına dayanabilecek şişme paddle boardlar yapmak."
  paragraphs:
    - 2012 yılında, kurucularımız piyasada bir boşluk gördü — çoğu şişme tahta ya uygun fiyatlı ama güvenilmezdi ya da yüksek kaliteli ama aşırı pahalıydı. Hem kalite hem de değer sunan bir üretici için yer olduğuna inanıyorlardı.
    - İlk gövde elle inşa edildi, yerel sularda test edildi ve balıkçılar ile küçük ticari işletmecilerden gelen gerçek geri bildirimlere dayanarak geliştirildi. Bu geri besleme döngüsü — inşa et, test et, dinle, geliştir — bugün mühendislik felsefemizin merkezinde duruyor.
    - 2015 yılına gelindiğinde, kullanıcıların haberi Weihai'nin ötesine yayılmıştı. Asya genelindeki kürekçiler ve su sporu dükkanları tahtalar talep etmeye başladı. Yerel bir atölye olarak başlayan iş, küresel bir marka haline geliyordu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock erken üretim atölyesi ve imalat
content_growth:
  tagline: Büyüme ve Yenilik
  title: Atölyeden 12.000 m²'lik tesise
  subtitle: İnsanlara, ekipmana ve süreçlere sürekli yapılan yatırımlar, Paddle Board Overstock'ü modern bir denizcilik üretim tesisine dönüştürdü.
  paragraphs:
    - Talep arttıkça, tesisimiz de büyüdü. Küçük bir atölyeden 12.000 m²'lik bir fabrikaya genişledik ve SUP tahtalar, aksesuarlar ve güvenlik ekipmanları için özel üretim hatlarına sahip olduk.
    - CNC Kesme makinelerine, yüksek frekanslı kaynak ekipmanlarına, drop stitch üretim hatlarına ve kapsamlı test donanımlarına yatırım yaptık — bu sayede üretim kalitesinin her yönünü kontrol edebildik.
    - Bugün, 200-300 kişilik ekibimizde deniz mühendisleri, malzeme bilimcileri, kalite kontrol uzmanları ve yetenekli zanaatkarlar bulunmaktadır — bunların birçoğu Paddle Board Overstock'te ilk günlerden beri çalışmaktadır.
founder:
  tagline: Kurucu ile Tanışın
  title: Bir Su Adamı tarafından inşa edildi
  subtitle: Kurucu David Chen, üretim uzmanlığını ve hayat boyu süren su sporları tutkusunu bir araya getiriyor — bu kombinasyon, Paddle Board Overstock'ın ürün geliştirme yaklaşımını tanımlıyor.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Paddle Board Overstock Kurucusu
  story:
    - David Chen, denizin tatil destinasyonu değil bir yaşam biçimi olduğu Weihai kıyılarında büyüdü. Gençliğini Sarı Deniz'de kürek çekerek, yelken açarak ve balık tutarak geçirdi — bu deneyimler ona kürek tahtalarının dayanması gereken koşulları sezgisel olarak anlama yeteneği kazandırdı.
    - Paddle Board Overstock'ı kurmadan önce, David on yıl boyunca deniz ürünleri üretiminde çalıştı ve üretim, kalite ve uluslararası ticaret alanlarında deneyim kazandı. Avrupa ve Kuzey Amerika pazarları için üretim ve kalite programlarını yönetti ve küresel kürekçilerin beklentilerini birinci elden öğrendi.
    - "2012 yılında, Paddle Board Overstock'i basit bir misyonla kurdu: Kendi ailesiyle su üzerinde güvenle kullanabileceği şişirilebilir kürek tahtaları üretmek. Bu kişisel standart — bunu kullanır mıydım? — fabrikadan çıkan her ürün için nihai test olarak kalmaktadır."
    - Bugün, David ürün stratejisini yönetiyor ve Ar-Ge ekibini denetliyor; yeni tasarımları kişisel olarak inceleyip prototipleri Weihai açıklarındaki sularda test ediyor. O, harika ürünlerin hem mühendisliği hem de deneyimi anlamaktan geldiğine inanıyor.
philosophy:
  tagline: Marka Felsefesi
  title: Su Üzerinde Mühendislik Özgürlüğü
  body: Su üzerindeki özgürlük sadece hareketle ilgili değildir. Yeni yerler keşfetmeyi, açık hava deneyimleri yaratmayı, insanları doğayla buluşturmayı ve profesyonel misyonları mümkün kılmayı temsil eder. Mühendislik bu özgürlüğü mümkün kılar.
  pillars:
    - title: Önce Güvenilirlik
      body: Su ortamları güven talep eder. Paddle Board Overstock ürünleri denge, dayanıklılık, güvenlik ve tutarlı performans etrafında tasarlanmıştır.
    - title: İnsan Merkezli Tasarım
      body: Ürünler insanlara hizmet etmeli, teknolojiye değil. Her tasarım kararı, insanların tahtalarını nasıl kullandığını, neleri keşfettiklerini ve hangi zorluklarla karşılaştıklarını anlamakla başlar.
    - title: Erişilebilir Keşif
      body: Su sadece uzmanlara ait olmamalıdır. Paddle Board Overstock, daha fazla insanın nehirleri, gölleri, okyanusları ve kıyı ortamlarını güvenle deneyimlemesini sağlayan ekipmanlar yaratır.
    - title: Sürekli Yenilik
      body: Yenilik sadece yeni ürünler yaratmak değildir. Her detayı — malzemeler, yapılar, üretim ve kullanıcı deneyimi — iyileştirmektir.
engineeringDna:
  tagline: Mühendislik DNA'sı
  title: Paddle Board Overstock Ürünleri Nasıl Yaratıyor
  areas:
    - title: Malzeme Bilimi
      body: Paddle Board Overstock, farklı deniz ortamları için uygun malzemelerin seçilmesine odaklanır. Ana dikkate alınan hususlar aşınma direnci, UV direnci, basınç stabilitesi ve uzun vadeli dayanıklılıktır.
      items:
        - Aşınma Direnci
        - UV Direnci
        - Basınç Dayanıklılığı
        - Uzun Süreli Dayanıklılık
    - title: Yapısal Mühendislik
      body: Şişme kürek tahtaları, sertlik, ağırlık, taşınabilirlik ve denge arasında hassas bir denge gerektirir. Paddle Board Overstock mühendisliği, bu faktörleri drop-stitch temel teknolojisi ve gelişmiş dikiş yapısı aracılığıyla optimize etmeye odaklanır.
      items:
        - Rijitlik
        - Ağırlık Optimizasyonu
        - Taşınabilirlik
        - Denge
    - title: Üretim Hassasiyeti
      body: Her ürün, malzeme hazırlığı, hassas kesim, kaynak ve yapıştırma, montaj, kalite kontrol ve performans doğrulaması gibi kontrol edilmiş süreçlerden geçer.
      items:
        - Malzeme Hazırlığı
        - Hassas Kesim
        - Kaynak ve Yapıştırma
        - Montaj ve Kalite Kontrol
    - title: Kullanıcı Senaryosu Mühendisliği
      body: Ürünler, gerçek kürek uygulamaları etrafında geliştirilir — eğlence, macera, aile ve tur — böylece her tasarım, hedeflenen ortamın özel gereksinimlerini karşılar.
      items:
        - Rekreasyon
        - Macera
        - Aile
        - Turlama
trustSignals:
  tagline: Güven Sinyalleri
  title: Neden Paddle Board Overstock Güvenebileceğiniz Bir Marka
  manufacturing:
    title: Üretim Kapasitesi
    body: 200-300 kalifiye işçi ve 14+ Ar-Ge mühendisi ile 12.000 m² üretim tesisi. Yılda 15.000 pano üretimi, 50+ ülkedeki kürekçileri kapsıyor.
    stats:
