hero:
  tagline: Hikayemiz
  title: Paddle Board Overstock — Suda Özgürlük Mühendisliği
  subtitle: 'Bir kıyı atölyesinden küresel bir deniz üreticisine — yolculuğumuz inatçı bir inanç üzerine kurulu: paddle boardlar önem teşkil edecek şekilde tasarlanmalıdır, çünkü öyleler.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock fabrikanın ve Weihai'deki denizcilik üretim tesisinin
