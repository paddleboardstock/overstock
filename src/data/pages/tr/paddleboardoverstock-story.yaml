  quality:
    title: Kalite Taahhüdü
    body: Malzeme incelemesinden son teste kadar, Paddle Board Overstock güvenilir deniz ürünleri sunmak için sistematik kalite süreçlerini sürdürür. Her birim, sevkiyat öncesi basınç testi, dikiş incelemesi ve performans doğrulamasından geçer.
    items:
      - '%99,3 kusursuz sevkiyat oranı'
      - Tüm panolar 1,25x nominal PSI basınç ile %100 test edilmiştir
      - Her panoya 2 yıllık garanti
  global:
