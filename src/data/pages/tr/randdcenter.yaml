hero:
  tagline: Ar-Ge Merkezi
  title: AR-GE Merkezi
  subtitle: İlerleme Odaklı
intro:
  - AquafarerAraştırma ve Geliştirme (Ar&D) Merkezi, su sporları ekipmanlarını devrim niteliğinde dönüştürme misyonumuzun itici gücü. Şişme ayakta kürek tahtası () ve teknelerde durmaksızın yenilik yaparak küresel ölçekte su sporları tutkunlarını daha güvenli, daha rahat ve daha keyifli ürünlerle güçlendiriyoruzSUPs. Mühendisler, tasarımcılar ve tutkulu su sporları uzmanlarından oluşan adanmış ekibimiz, sektörün geleceğini şekillendiriyor ve kalite, performans ve sürdürülebilirlik için çıtayı sürekli yükseltiyor.
  - Ar-Ge tesisimiz, malzeme bilimcilerini, deniz mimarlarını ve üretim mühendislerini tek bir çatı altında bir araya getiriyor. Kumaş formülasyonu ve gövde simülasyonundan kaynak süreci geliştirmeye ve tam ölçekli deniz denemelerine kadar, ürün geliştirmenin her aşaması verilerle yönlendirilir ve testlerle doğrulanır.
mission:
  tagline: Misyonumuz
  title: Su Sporlarının Geleceğini Yenilik Etmek
  pillars:
    - icon: lightning
      title: Teknolojik Gelişme
      desc: Üstün ürün performansı ve uzun ömür için yeni malzemeler, tasarımlar ve üretimde öncülük etmek.
    - icon: design
      title: Kullanıcı Merkezli Tasarım
      desc: Ergonomik ve sezgisel ürün tasarımı sayesinde kullanıcı ihtiyaçlarını derinlemesine anlamak ve aşmak.
    - icon: globe
      title: Sürdürülebilir Uygulamalar
      desc: Çevre dostu malzemeler ve süreçler kullanarak çevresel ayak izimizi en aza indirmek.
    - icon: shield
      title: Tavizsiz Güvenlik
      desc: Titiz testler ve sertifikasyon yoluyla en yüksek güvenlik standartlarını sağlamak.
pillars:
  - title: Teknolojik Gelişme
    desc: Yeni malzemeler, tasarımlar ve üretim süreçlerinde öncülük ederek üstün ürün performansı ve uzun ömür sunmak.
    icon: tech
  - title: İleri Malzemeler
    desc: PVCHypalonGelişmiş ürün özellikleri için en son , , kompozit ve sürdürülebilir alternatiflerin araştırılması.
    icon: materials
