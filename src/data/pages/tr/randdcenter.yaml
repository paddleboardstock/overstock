capabilities:
  tagline: Yetenekler
  title: Ar-Ge Yetenekleri
  subtitle: Ürün geliştirme üzerinde uçtan uca kontrol sağlayan dört temel disiplin, hammadde araştırmasından nihai sertifikaya kadar.
  groups:
    - title: Malzeme Bilimi ve Kumaş Teknolojisi
      items:
        - PVC ve Hypalon formülasyon analizi ve optimizasyonu
        - UV stabilizasyon, alev geciktimesi ve anti-mikrobiyal katkı geliştirme
        - Çok katmanlı kumaş laminasyonu ve yapışma mühendisliği
        - Hızlandırılmış yaşlanma testi (UVtermik, nem, tuz spreyi)
    - title: Gövde Mühendisliği ve Hidrodinamik
      items:
        - Parametrik 3D gövde tasarımı ve CFD optimizasyonu
        - Sonlu eleman analizi ile yapısal ve darbe yükleri
        - Ölçek model çekme havuzu testi ve performans doğrulaması
        - Özel görev profilleri için özel gövde geliştirme
    - title: Kaynak ve Birleştirme Teknolojisi
      items:
        - RF dielektrik kaynak süreci geliştirme ve optimizasyon
        - Sıcak hava, sıcak kama ve ultrasonik kaynak yöntemleri
        - Yapıştırıcı ile birleştirme ve dikiş bandı kalifikasyonu
        - Kaynak dayanıklılık modellemesi ve ömür tahmini
    - title: Test, Sertifikasyon ve Uyumluluk
      items:
        - Kalite yönetimi ve CE uyumluluk testi
        - Bağımsız üçüncü taraf test ve sertifikasyon desteği
        - Satın alma yeterliliği için özel test protokolü geliştirme
        - Hizmet içi arıza analizi ve kök neden araştırması
