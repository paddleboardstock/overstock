rd_services:
  tagline: Özel Ar-Ge
  title: Ortaklar için Ar-Ge Hizmetleri
  services:
    - title: Özel Malzeme Geliştirme
      desc: İşletim ortamınıza ve performans hedeflerinize uygun özel kumaş formülasyonları, lamine tabakalar ve yapıştırıcı sistemler geliştiriyoruz.
    - title: OEM / ODM Ürün Mühendisliği
      desc: Tasarım eskizlerinden üretime hazır mühendislik paketlerine kadar — ekibimiz teknelerinizi markanız altında tasarlayabilir, prototip oluşturabilir ve doğrulayabilir.
    - title: Üçüncü Taraf Test ve Sertifikasyon
      desc: Bağımsız malzeme testi, ürün doğrulama ve sertifikasyon desteği için ISO-uyumlu test tesislerimizi kullanın.
  cta: Ar-Ge gereksinimlerinizi → görüşün
  cta_link: /contact
vision:
  tagline: Vizyonumuz
  title: Su Sporlarının Geleceğini Şekillendirmek
  body: Aquafarer, sürekli yenilik, sarsılmaz kalite ve güvenlik ile sürdürülebilirliğe sıkı bağlılık yoluyla şişme bot ve SUP endüstrisine öncülük etmeyi hedefliyor — nihayetinde dünya genelindeki su sporu meraklılarının deneyimlerini zenginleştiriyor. Aquafarer Ar-Ge Merkezi, tutkunun yenilikle buluştuğu yer olup su sporu endüstrisi için yeni standartlar belirliyor.
labs_section:
  tagline: Laboratuvarlar
  title: Laboratuvarlarımız
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Kumaş Laboratuvarı
      description: Deniz ortamlarında uzun vadeli güvenilirliği sağlamak için PVC ve Hypalon boru kumaşlarının çekme dayanımı, UV direnci, aşınma ve düşük sıcaklık esnekliği açısından sürekli araştırılması ve test edilmesi.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Hull Mühendislik Stüdyosu
      description: HDPE, alüminyum ve fiberglas gövdelerin CAD tabanlı tasarımı ve sonlu eleman analizi. Her gövde, ilk prototip yapılmadan önce gerilme dağılımı ve darbe direnci açısından dijital olarak simüle edilir.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF Kaynak Merkezi
      description: Hassas sıcaklık ve basınç kontrolüne sahip, yüksek dayanıklılığa ve hava geçirmezliğe sahip dikişler üreten, denizcilik endüstrisi standartlarını karşılayan şişme araçlar için özel radyo frekansı kaynak tesisi.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hidrodinamik Test Tankı
      description: Yük ve deniz koşullarının çeşitli aralıklarında gövde formunu, sürükleme performansını, stabiliteyi ve yakıt verimliliğini optimize etmek için kendi test tankımızda ölçekli model testi.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototip Atölyesi
      description: Yeni modellerin inşa edildiği, donatıldığı ve deneme seyrine çıkarıldığı tam ölçekli prototip ve donatma tesisi. Her prototip, üretim onayı öncesinde en az 20 saatlik su içi test programından geçer.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Kalite ve Muayene Laboratuvarı
      description: Her teknelerin atölyeden çıkmadan yayınlanan spesifikasyonlarımıza uygun olmasını sağlamak için çekme testi, hava tutma döngü testi, dikiş soyma testleri ve malzeme sertifikasyonu gerçekleştiren özel kalite güvence laboratuvarı.
      href: /randdcenter/quality-inspection-lab
