hero:
  tagline: Endonezya
  title: Toptan SUP Panolar için<br />Endonezya İşletmeleri
  subtitle: Bali su sporları mağazaları, ada tatil köyleri ve takımadalar genelindeki işletmeciler — Çin'den gönderilen 5 üniteden yepyeni fazla stok tahtalar, karışık modeller.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Endonezya tatil köyleri ve Bali su sporları dükkanları için fazla stok panoları
direct_answer: Paddle Board Overstock SUP Endonezya işletmelerine — Bali'deki su sporları dükkanlarına, Lombok'tan Gillis'e ve ötesine ada tatil köyleri, plaj kulüpleri ve kiralama şirketleri — yepyeni fazla şişme tahtalar tedarik eder. Toptan siparişler, Weihai, Çin'den ekspres hava yükü veya konsolide deniz yükü ile gönderilen karışık modellerle birlikte 5 karttan başlıyor. Her kart %100 baskı testine tabi tutulur ve 2 Yıllık SUP Garanti kapsamındadır.
tldr_points:
  - 5 karttan toptan — toplam miktara göre fiyatlandırılmış karışık modeller
  - Bali'nin su sporları ekonomisine ve ülke genelindeki ada tatil köylerine hizmet vermek
  - Çin–Endonezya arasında kısa yük hatları, hava veya deniz
  - '%100 basınç testinden geçti, SUP her kartta 2 Yıl Garanti'
overview_section:
  tagline: Pazar Genel Bakış
  title: Endonezya SUP Pazarı
  paragraphs:
    - Endonezya, Asya'nın büyük su sporları ekonomilerinden biri ve Bali, onun atan kalbi. Seminyak ve Canggu'nun sahil kulüplerinden Sanur ve Nusa Dua'nın sakin lagünlerine kadar, kürek tahtaları her yerde ortaya çıkıyor — resiflerin üzerinden gün doğumu kürekleri, SUP yoga dersleri, lagün turları ve otel misafir programları. Bali'nin ötesinde, Lombok, Gili Adaları ve takımadalar genelinde büyüyen turizm sahneleri aynı modeli takip ediyor.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: dayanıklılık, UV performans ve tamir edilebilirliği, katalog parlatmasından daha önemlidir. Siparişler 5–20 kart içerir, dersler, kiralamalar ve perakende sergi için karışıktır.
  customer_types:
    - title: Bali Su Sporları Dükkanları
      description: Sanur, Semynyak ve Canggu operatörleri SUP kuruldu ve sörf, dalış ve şnorkel hatlarına katkı sağladı.
    - title: Ada Tatil Köyleri ve Plaj Kulüpleri
      description: Bali, Lombok ve Gillis'teki tatil köyleri ve plaj kulüpleri misafir kürek ve SUP yoga programları düzenliyor.
    - title: Tur ve Kira Operatörleri
      description: Lagün ve mangrov tur operatörleri ile saatlik kiralama standları filoları mevsimsel olarak yeniliyor.
shipping_section:
  title: Endonezya'ya Gemi
  paragraphs:
    - Endonezya, Çin'deki Weihai'deki üssümüzden en kısa yük hatlarından biridir. Ekspres hava yükü Denpasar ve Jakarta'ya hızlı şekilde örnekler ve 1–3 board siparişi taşır; konsolide deniz yükü ise Tanjung Priok, Tanjung Benoa ve diğer limanlar üzerinden 5–20 board toptan siparişi hizmet vermektedir. Her iki seçenek de varış noktanız için tahmini geçiş süreleriyle birlikte sunulur.
    - Ticari fatura ve paketleme listesi temizliği için gerekli olan, doğru HS kodları ve beyannan değerlerle birlikte sağlıyoruz. İthalat vergileri ve vergileri Endonezya kurallarına göre ithalatçı tarafından ödenmelidir.
  customs_note: Spor ekipmanları için Endonezya onayı belgeler açısından duyarlıdır — gümrük komisyoncunuz (PPJK) ile birlikte mevcut gümrük ve vergi muamelesini onaylayın. Eksiksiz ve tutarlı evrak hazırlığında bulunuyoruz ve aracı kurum taleplerine hızlıca yanıt veriyoruz.
faq_section:
  title: Endonezya SSS
  items:
    - q: Çin'den Bali'ye yük ne kadar hızlıdır?
      a: Endonezya, Weihai'ye en yakın yük noktalarımızdan biridir. Denpasar veya Jakarta'ya ekspres hava denemeleri ve küçük siparişler için en hızlı seçenektir; konsolide deniz yükü ise toptan siparişler için bir transit penceresi ile fiyatlandırılır. Her ikisi de teklifinizde ayrıntılı olarak belirtilmiştir.
    - q: Tahtalar tropikal bölgede günlük kiralama kullanımına uygun UV mu?
      a: Evet — drop-stitch PVC 50 ülkedeki filolara günlük kiralama döngüleri için uygun inşaat+ derecelendirilmiş. Standart bakım (tuzlu sudan sonra durulama, gölgeli depolama) onları Bali güneşinin birçok mevsiminde hizmette tutuyor.
    - q: Su sporları mağazası siparişi nasıl görünüyor?
      a: Genellikle dersler ve kiralamalar için dengeli genel modeller ile perakende sergisi için birkaç premium sanat edisyonu arasında karışık 5–15 tahta — bir sevkiyat, toplam miktara göre fiyatlandırılır.
    - q: PPJK'mızı belgelerle destekleyebilir misiniz?
      a: Evet. Her sipariş, doğru HS kodları ve beyan edilen değerler ile birlikte bir ticari fatura ve paket listesi ile gönderilir ve brokeriniz ek belgelere ihtiyaç duyduğunda hızlıca yanıt veririz.
