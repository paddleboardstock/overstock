hero_text:
  tagline: Kaynaklar
  title: İndirme Merkezi ve Kürek Rehberleri
  subtitle: Şişme tahtanızı seçmenize, kullanmanıza ve keyfini çıkarmanıza yardımcı olacak ürün katalogları, satın alma rehberleri ve bakım SUP talimatları.
features3_downloads:
  tagline: İndirilenler
  title: Ürün Dokümantasyonu<br />& Kürek Kaynakları
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 SUP Ürün Kataloğu
      description: 'Tüm Paddle Board Overstock SUP ürün yelpazesi: her yöne sahip kartlar, sanat serileri ve aksesuarlar, tam teknik özellikler ve paket içeriğiyle. PDF formatı.'
      icon: tabler:file-text
    - title: Şişme SUP Alıcı Rehberi
      description: 'İlk tahtanızı nasıl seçersiniz: uzunluk, genişlik, kalınlık, hacm, sürücünün ağırlığı ve hangi tahta şekli kürek çekme tarzınıza uyur.'
      icon: tabler:file-description
    - title: SUP Beden ve Uyum Rehberi
      description: Tahta hacmini ve boyutlarını kilo ve beceri seviyenize göre eşleştirin; eğlence, tur, yoga ve fitness için aktiviteye özel öneriler edin.
      icon: tabler:clipboard-check
    - title: Board Bakım ve Bakım Rehberi
      description: 'Kartınızı yeni gibi tutun: temizlik, kurutma, saklama, UV koruma, valf bakımı ve küçük onarım talimatları.'
      icon: tabler:tool
    - title: Şişme Tahta Malzemeleri Rehberi
      description: PVC yapı, drop-stitch çekirdekler, EVA güverte pedleri ve 15 PSI rijitliğin performans ile dayanıklılık için ne anlama geldiği.
      icon: tabler:files
    - title: Başlangıç SUP
      description: 'İlk kez kürekçi olmak için temel temel şeyler: şişirme, taşıma, fırlatma, temel vuruşlar ve ilk güne ayakta durmanızı sağlayacak güvenlik temel unsurları.'
      icon: tabler:swimming
faqs:
  title: Sık Sorulan Sorular
  subtitle: Boardlarımız, sipariş vermemiz ve suya çıkma hakkında sıkça sorulan sorular.
  columns: 2
  items:
    - title: Board'a ne dahil?
      description: Her tam paket tahta, ayarlanabilir kürek, yüksek akışlı pompa, tasma, tamir kiti ve sırt çantasını içerir. Kürek ve Pompa Seti ayrıca ayrı olarak da mevcuttur.
      icon: tabler:package
    - title: Enflasyon ne kadar sürer?
      description: Dahil edilen yüksek akışlı pompa ile çoğu paddler tam basınca 8-12 dakikada ulaşır. Elektrikli pompalar da çalışır — sadece valfin yakınında yazılmış nominal basınçta durun.
      icon: tabler:clock
    - title: Doğru tahtayı nasıl seçebilirim?
      description: 'Ağırlık ve kürek çekme tarzınızla başlayın: acemiler ve aileler Explorer 11 gibi geniş ve stabil platformları sever SUP ; yoga kürekçileri tam güvertede çekişi tercih eder; tur kürekçileri ise sert, akıcı şekiller ister. Ekibimiz memnuniyetle tavsiye eder.'
      icon: tabler:help-circle
    - title: Hangi ödeme yöntemlerini kabul ediyorsunuz?
      description: Büyük kredi kartları, PayPal ve banka transferi kabul ediyoruz. Tüm fiyatlar tam paketi kapsıyor — gizli ekstra yok.
      icon: tabler:currency-dollar
    - title: Teslimat ne kadar sürer?
      description: Siparişler fabrikamızdan gönderilir ve genellikle bölgenize göre 5-10 iş günü içinde ulaşır. Her sipariş için takip sağlanır.
      icon: tabler:truck-delivery
    - title: Board'um garanti kapsamında mı?
      description: Evet — her board üretim hatalarına karşı garantilidir ve her ünite fabrikadan çıkmadan önce 24-48 saat boyunca belirtilen basıncının 1,25 katına kadar basınç testinden geçirilir. Garanti talep oranımız %2'nin altındadır.
      icon: tabler:shield-check
cta:
  title: Doğru board'u bulmakta yardım mı lazım?
  subtitle: Board seçimi, boyutlandırma veya sipariş soruları hakkında dürüst tavsiye almak için ekibimizle iletişime geçin.
  actions:
    - variant: primary
      text: Ekibimizle iletişime geçin
      href: /contact
