hero_text:
  tagline: Kaynaklar
  title: İndirme Merkezi ve Alıcı Rehberleri
  subtitle: Bilgiye dayalı tedarik kararları almanıza yardımcı olmak için ürün kataloglarına, OEM rehberlerine, alıcı kontrol listelerine ve teknik dokümantasyona erişin.
features3_downloads:
  tagline: İndirilenler
  title: Ürün Dokümantasyonu<br />& Alıcı Kaynakları
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 Deniz Ürünleri Kataloğu
      description: Tam ürün yelpazesi, RIB tekneler, şişme tekneler, SUP boardlar, kayıklar ve aksesuarları içerir. Teknik özellikler, yapılandırmalar ve seçenekler. PDF formatında.
      icon: tabler:file-text
    - title: OEM Üretim Rehberi
      description: 'OEM/ODM ortaklıkları hakkında bilmeniz gereken her şey: süreç genel bakışı, minimum sipariş miktarları, özelleştirme seçenekleri, kalite kontrol ve nakliye.'
      icon: tabler:building-factory
    - title: RIB Tekne Alıcı Rehberi
      description: 'Doğru RIB nasıl seçilir: gövde malzemeleri, boru malzemeleri, motor seçimi, boyut değerlendirmeleri ve farklı uygulamalar için yapılandırma seçenekleri.'
      icon: tabler:file-description
    - title: SUP Tedarikçi Kontrol Listesi
      description: 'Bir SUP kart üreticisi seçerken dikkate alınması gereken temel hususlar: kalite göstergeleri, sertifikasyon gereklilikleri, MOQ hususları ve fabrika denetiminde nelere bakılacağı.'
      icon: tabler:clipboard-check
    - title: Şişme Bot Malzeme Rehberi
      description: 'PVC vs Hypalon: farklı deniz uygulamaları için dayanıklılık, UV direnci, kullanım ömrü, tamir seçenekleri ve maliyet değerlendirmelerinin karşılaştırması.'
      icon: tabler:files
    - title: Özel Üretim Bilgi Formu Şablonu
      description: Ürün brifing şablonumuzu indirin. Gereksinimlerinizi doldurun ve bize gönderin, aynı hafta içinde fiyat teklifi ve fizibilite değerlendirmesi alabilirsiniz.
      icon: tabler:template
faqs:
  title: Sık Sorulan Sorular
  subtitle: Ürünlerimiz, üretim sürecimiz ve ortaklık modelimizle ilgili sık sorulan sorular.
  columns: 2
  items:
    - title: Minimum sipariş miktarı nedir?
      description: MOQ ürün kategorisine göre değişir. RIB tekneler genellikle model başına 10 birimden başlar. SUP panolar 50 birimden başlar. Ürünle ilgili MOQ bilgileri için satış ekibimizle iletişime geçin.
      icon: tabler:help-circle
    - title: Sipariş vermeden önce numune alabilir miyim?
      description: Evet. Aquafarer, seri üretimden önce değerlendirme için örnek üretim sağlar. Örneklerin maliyeti pazarlığa açıktır ve genellikle ilk üretim siparişine mahsup edilir.
      icon: tabler:package
    - title: Hangi ödeme koşulları mevcuttur?
      description: Standart şartlar, siparişle birlikte %30 depozito ve sevkiyat öncesi %70 ödemedir. Uygun müşteriler için akreditif şartları mevcuttur. Düzenlemeleri görüşmek için finans ekibimizle iletişime geçin.
      icon: tabler:currency-dollar
    - title: Üretim ne kadar sürer?
      description: 'Tipik teslim süreleri: RIB tekneler 30-45 gün, SUP sörf tahtaları 20-30 gün, şişme botlar 25-35 gün. Özel geliştirme prototipleme için 15-30 gün ekler.'
      icon: tabler:calendar-clock
    - title: Ürünleriniz hangi sertifikalara sahip?
      description: CE AB pazarları için sertifikasyon, ABD Sahil Güvenlik onaylı üretim, ISO kalite sistemi, BSCI uyumluluk ve REACH malzeme uyumluluğu.
      icon: tabler:certificate
    - title: Özel ambalaj ve marka hizmeti sunuyor musunuz?
      description: Evet. Logonuz, renkleriniz ve marka kimliğinizle özel ambalaj sağlıyoruz. Özel ambalaj için MOQ, ürün kategorisine bağlıdır.
      icon: tabler:color-swatch
cta:
  title: Doğru kaynağı bulmakta yardıma mı ihtiyacınız var?
  subtitle: Ürün seçimi, OEM ortaklıkları veya teknik özellikler konusunda kişiselleştirilmiş rehberlik için ekibimizle iletişime geçin.
  actions:
    - variant: primary
      text: Ekibimizle iletişime geçin
      href: /contact
