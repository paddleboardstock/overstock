features3_solutions:
  tagline: Çözümler
  title: Su Maceranız<br />İş Ortağı
  isBeforeContent: false
  columns: 3
  items:
    - title: Su Sporları Kulüpleri
      description: SUP kulüpleri, kano kulüpleri, sörf okulları ve eğitim merkezleri için eksiksiz ekipman paketleri, özel marka uygulamaları ve bakım programları.
      icon: tabler:users
      link: /solutions/clubs
    - title: Su Sporları RIBs
      description: Yelken okulları, su sporları merkezleri ve etkinlik organizasyonları için amaçına uygun RIBs. Profesyonel su sporları için antrenör botları, çekme botları ve düzenleme tekneleri.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Tatil Köyleri ve Oteller
      description: Hizmet mülkleri için filo ekipmanı, güvenlik sistemleri, personel eğitimi ve gelir yönetimi ile premium su sporları programları.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Su Marka Girişimcileri
      description: Yeni marka sahipleri için düşük MOQs ile özel etiket OEM/ODM üretimi, özel ürün tasarımı, paketleme ve küresel sevkiyat.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Dalış Merkezi Botları
      description: Dalış operasyonları için kolay giriş/çıkış, ekipman depolama ve optimize edilmiş motor konfigürasyonlarıyla stabil RIB platformlar.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Kurtarma ve Acil Durum Su Araçları
      description: Arama ve kurtarma, acil müdahale ve sahil güvenlik operasyonları için tasarlanmış yüksek hızlı RIBs ve şişme botlar.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Yat Yardımcı Bot Çözümleri
      description: Süperyatları ve eğlence gemilerini tamamlayan kompakt, şık RIB yardımcı botlar. Kolay depolama, güçlü performans.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Balıkçı Botu Çözümleri
      description: Ticari ve rekreasyonel balıkçılık operasyonları için stabil, dayanıklı şişme botlar ve RIBs.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Deniz Turizmi Ekipmanları
      description: Rezortlar, tur operatörleri ve su sporları kiralama işletmeleri için filo hazır şişme botlar, SUP tahtalar ve kanolar.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Açık Deniz Enerjisi RIBs
      description: Petrol ve gaz platformu desteği, rüzgar çiftliği personel transferi, deniz altı kablo incelemesi ve deniz inşaatı için ağır hizmet RIBs.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Su Ürünleri Çalışma Botları
      description: Balık çiftçiliği, inci yetiştiriciliği ve okyanus çiftçiliği için korozyona dayanıklı RIBs. Hypalon tüpler, paslanmaz çelik donanım, günlük kullanıma dayanıklılık.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Deniz Araştırma ve Ölçüm
      description: Oşinografik araştırmalar, çevresel izleme, su kalitesi örnekleme ve üniversite eğitim programları için stabil, cihazlara hazır RIBs.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Ticari Çalışma Botları
      description: Devriye, ölçüm, taşıma ve açık deniz lojistiği için ağır hizmet RIBs. Ticari operasyonların zorlu taleplerine göre üretilmiştir.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Hangi Yol İşletmenize Uygun Emin Değil Misiniz?
  subtitle: Bize operasyonunuzu anlatın — doğru ekipman paketi, marka programı veya özel çözümü önereceğiz.
  actions:
    - variant: primary
      text: Ücretsiz Danışmanlık Alın
      href: /contact
