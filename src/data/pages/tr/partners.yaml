hero:
  tagline: Ortaklar ve Dağıtım
  title: Bir Paddle Board Overstock Ortağı Olun<br />— Küresel Dağıtım Ağı
  subtitle: Paddle Board Overstock'in küresel ortak ağına katılın. 50+ ülkede denizcilik dağıtıcıları, tekne satıcıları, ekipman perakendecileri ve marka ortakları ile çalışıyoruz.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstock küresel ortak ve dağıtıcı ağı
content_programs:
  tagline: Ortak Programları
  title: Ortak Programları<br />Büyüme İçin Tasarlandı
  subtitle: İster bir distribütör, satıcı ister marka ortağı olun, Paddle Board Overstock işinizi desteklemek için tasarlanmış programlar sunar.
  columns: 3
  items:
    - title: Distribütör Programı
      description: Hacim fiyatlandırması, pazarlama desteği ve doğrudan fabrika erişimi ile özel bölge dağıtımı. Bölge büyüklüğüne göre minimum taahhüt gereklidir.
      icon: tabler:world
    - title: Satıcı Programı
      description: Doğrudan satıcı fiyatlandırması, ürün eğitimi, pazarlama materyalleri ve perakende mağazalar ile çevrimiçi mağazalar için garanti desteği.
      icon: tabler:building-store
    - title: OEM/ODM Ortaklığı
      description: Özel markalama, paketleme ve ürün özellikleri ile tam hizmet OEM ve ODM üretimi. Fikirden konteynıra kadar.
      icon: tabler:certificate
    - title: Marka Ortaklığı
      description: Deniz ve açık hava eğlence alanında yerleşik markalar için birlikte marka oluşturma, özel etiketleme ve özel model programları.
      icon: tabler:stars
    - title: Hükümet & Kurumsal
      description: Hükümet kurumları, sahil güvenlik, askeri ve insani yardım kuruluşları için tercih edilen tedarikçi programları. İhale hazır belgeler.
      icon: tabler:building-community
    - title: Tatil Köyü & Kiralama Ortağı
      description: Tatil köyleri, dalış merkezleri ve dünya çapındaki kiralama operasyonları için filo fiyatlandırması, tutarlı kalite ve özel markalama.
      icon: tabler:sun
content_benefits:
  tagline: Neden Bizimle Ortak Olmalısınız
  title: Ortaklar Paddle Board Overstock'ü Neden Seçiyor
  subtitle: Ortaklarımız gerçek üretim kapasitesinden, tutarlı kaliteden ve hızlı destekten faydalanır.
  list:
    - 'Doğrudan Fabrika Erişimi: Üretim ekibimizle doğrudan çalışın — aracılar yok. Daha hızlı yanıtlar, daha iyi fiyatlar ve üretimin tam görünürlüğü elde edin.'
    - 'Özelleştirmeye Hazır: Ürünlerinizi özel renkler, logolar, ambalaj ve özelliklerle markalayın. Minimum sipariş miktarları pazarınıza göre ayarlanmıştır.'
    - 'Kalite Garantili: ISO 9001 sertifikalı üretim CE, UKCA ve BSCI uygunluğu ile. Her ürün sevkiyat öncesi test edilir.'
    - "Küresel Lojistik: Qingdao, Çin'den FOB, CIF ve DDP seçenekleri ile gönderim. Kuzey Amerika dağıtımı için Montclair, CA, ABD'de depo."
    - 'Pazarlama Desteği: Satış çabalarınızı desteklemek için ürün katalogları, fotoğrafçılık, teknik dokümantasyon ve dijital varlıklar.'
    - 'Eğitim ve Destek: Satış ekibinize ürün eğitimi, müşterilerinize teknik destek ve garanti hizmeti koordinasyonu.'
content_process:
  tagline: Ortak Nasıl Olunur
  title: Basit Ortaklık Süreci
  subtitle: Ortaklık sürecimiz basittir — sizi Paddle Board Overstock ürünlerini hızlı bir şekilde satacak hale getirmek için tasarlanmıştır.
  items:
    - title: 'Adım 1: Başvuru Gönderin'
      description: Şirket profiliniz, hedef pazarınız ve ürün ilgileriniz ile ortak başvuru formumuzu doldurun.
    - title: 'Adım 2: Yeterlilik İncelemesi'
      description: Ortaklık ekibimiz başvurunuzu inceler ve fırsatları görüşmek üzere 3 iş günü içinde sizinle iletişime geçer.
    - title: 'Adım 3: Anlaşma ve Kurulum'
      description: Ortaklık sözleşmesini imzalayın, hesabınızı kurun ve ortak fiyatlandırma, pazarlama materyalleri ve ürün örneklerini alın.
    - title: 'Adım 4: Eğitim ve Başlangıç'
      description: Ürün eğitimi, satış desteği ve pazarlama materyalleri sağlanır. Satışa başlamaya hazırsınız.
cta:
  title: Paddle Board Overstock ortağı olmaya hazır mısınız?
  subtitle: Ortaklık başvurusu yapın ve ekibimiz 3 iş günü içinde yanıt verecektir.
  actions:
    - variant: primary
      text: Ortaklık başvurusu yap
      href: /contact
    - text: Ürünlerimizi görüntüle
      href: /products
