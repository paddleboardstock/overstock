hero:
  tagline: Uluslararası Denizcilik
  title: Uluslararası Denizcilik —<br />50 Ülkeye Ekspres ve Deniz Taşımacılığı+
  subtitle: Her sipariş Weihai, Çin lojistik üssümüzden gönderilir. Örnekler ve acil stoklar için ekspres hava yükü veya küçük işletmeler toptan siparişleri için konsolide deniz yükü seçin.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Uluslararası nakliye için paketlenmiş tahtalar
direct_answer: Paddle Board Overstock Çin'in Weihai kentinden 50'den fazla ülkeye gönderilir. Ekspres hava yükü 1–3 kart, örnek siparişler ve acil stok taşımak; konsolide deniz taşımacılığı, 5–20 kartlık toptan siparişler için ekonomik bir seçenektir. Her sevkiyat kapıdan kapıya takip içerir ve her pano %100 basınç testinden geçer ve gönderilmeden önce tam aksesuar kitiyle paketlenir.
tldr_points:
  - 'Ekspres hava taşımacılığı: 1–3 kart, numuneler, acil stoklar — en hızlı seçenek'
  - 'Deniz yükü: 5–20 gemi toptan sipariş — en düşük yük maliyeti'
  - 50 ülkeye yapılan her sevkiyatın kapı kapı takibi+
  - Yük, sigorta, gümrük kontrolü ve ithalat vergileri teklifinizde detaylandırılmıştır — belirsiz bir hep söz vermeyin
from_china:
  tagline: Çin'den Nakliye
  title: Emirlerin Nereden Gönderildiği
  description: Tüm siparişler, üretim ve depolama operasyonumuzun kalbi olan Weihai, Çin'deki lojistik üssümüzden gönderilmektedir. Weihai, Shandong eyaletinde doğrudan deniz ve hava yük bağlantılarına sahip büyük bir kıyı liman şehridir ve bu da geçiş sürelerini ve yük maliyetlerini Asya, Amerika, Afrika, Avrupa ve Orta Doğu'daki destinasyonlara rekabetçi tutuyor.
modes_section:
  tagline: İki Seçenek
  title: Ekspres Nakliye veya Deniz Taşımacılığı
  subtitle: Doğru kargo yöntemi, panoları ne kadar hızlı istediğinize ve kaç tane sipariş ettiğinize bağlıdır. Her sorguda her iki seçenek de teklif ediliyor.
  express:
    name: Seçenek A — Ekspres Nakliye
    best_for: 1–3 tahta, örnek ve acil stok için en iyisi
    description: Air Express, küçük siparişleri ve örnek kartları haftalar içinde değil, günler içinde kapınıza getirir. Daha büyük siparişten önce bir modeli test ederken ya da sezon ortasında en çok satan bir modeli stoklarken idealdir.
    features:
      - 1–3 kart, tek model veya karışık model örnekleri
      - İki seçenek arasında en hızlı ulaşım — varış noktası başına teklif edilen
      - Büyük bir ekspres taşıyıcı ile kapıdan kapıya takip
      - 'Tipik kullanım: örnekler, acil stoklar, küçük ilk siparişler'
  sea:
    name: Seçenek B — Deniz Yükü
    best_for: 5–20 kart toptan ve perakendeci siparişleri için en iyisi
    description: Konsolide deniz yükü, küçük işletmeler toptan siparişleri için ekonomik bir tercihtir. Kartlar, Weihai'den tek bir konsolide sevkiyatla paketlenir ve böylece kart başına yük maliyeti düşük tutulur.
    features:
      - 5–20 karton perakendeci ve toptan siparişler
      - İki seçenek arasında en düşük yük maliyeti
      - Konsolide paketleme — bir sevkiyat, bir gümrük
      - 'Tipik kullanım: mevsimsel stoklar, karışık model toptan siparişler'
