process_section:
  tagline: Gönderim Nasıl Çalışır
  title: Depomuzdan Kapınıza
  steps:
    - title: Nakliye Seçenekleri ile Teklif
      description: Her teklif, varış noktanız için nakliye seçeneklerini — ekspres ve deniz — tahmini transit süreleriyle birlikte listeler, böylece sizin için hiçbir şey önceden belirlenmez.
    - title: Kalite Kontrol ve Paketleme
      description: Tahtalar %100 basınç testine tabi tutulur, ardından pompa, kürek, leash, yüzgeç, sırt çantası ve onarım kiti ile paketlenir — perakende satışta sunduğumuz aynı eksiksiz pakettir.
    - title: Weihai’den Sevk
      description: Gönderiniz, seçtiğiniz nakliye yöntemiyle lojistik merkezimizden çıkar ve kapıdan kapıya takip bilgisi aynı gün sizinle paylaşılır.
    - title: Gümrük İşlemleri
      description: İthalat için gereken ticari fatura ve paketleme listesini sağlıyoruz. Ülkenizdeki ithalat vergileri ve harçları ithalatçının sorumluluğundadır — aşağıdaki gümrük bölümüne bakınız.
    - title: Teslimat ve İnceleme
      description: Teslimatı aldığınızda kontrol edin. Eğer herhangi bir hasar veya eksiklik varsa, fotoğraflar ve sipariş numaranızla bizimle iletişime geçin — kayıp ve hasarlı ürün politikamıza aşağıda bakınız.
customs_section:
  tagline: Gümrük ve Vergiler
  title: Gümrük Vergileri ve İthalat Harçları
  subtitle: Gönderim sorumluluklarını belirsiz vaatler yerine açıkça belirtiyoruz. İşte tam olarak kimin neyi üstlendiği.
  items:
    - title: Bizim Karşıladıklarımız
      description: Teklifinize varış noktasına olan nakliye ücreti dahildir ve tüm ihracat belgelerini — ticari fatura, paketleme listesi ve gönderi takibini hazırlayıp sağlarız.
    - title: İthalatçının Karşıladıkları
      description: İthalat vergileri, KDV/GST ve varış ülkesindeki diğer vergiler ithalatçı tarafından (siz veya işiniz) ülkenizin kurallarına göre ödenir. Biz, nakliye tekliflerimize belirsiz vergi vaatleri eklemeyiz.
    - title: Gümrük İşlemleri Desteği
      description: Evraklarımız tam ve tutarlıdır — doğru HS kodları, beyanan değerler ve yönetim kurulu standartları — bu da onay işlemlerini sorunsuz sağlar. Eğer aracı kurumunuz veya gümrük ofisiniz ek belgeye ihtiyaç duyarsa, biz sağlarız.
    - title: Sipariş Vermeden Önce Yerel Fiyatlarınızı Kontrol Edin
      description: Şişirilebilir su sporları ekipmanlarının gümrük oranları ülkeye göre değişir. Ülkenizin ithalat kurallarını kontrol edin veya sorunuzu sorun — bölgesel piyasa rehberlerimizde önemli pazarlar için gümrük notları bulunur.
lost_damaged:
  title: Kayıp veya Hasarlı Sevkiyatlar
  description: Teslimatınız geldiğinde kontrol edin. Nadiren bir kart hasarlı gelirse veya paket eksikse, sipariş numaranız ve ambalaj ile kartın net fotoğraflarıyla mümkün olan en kısa sürede bizimle iletişime geçin. Her vakayı ayrı ayrı değerlendiriyoruz — bu durum yedek parça, yedek kart veya etkilenen ürün için iade anlamına gelir. Üretim hataları ayrı olarak 2 Yıllık Garanti kapsamında SUP karşılanır.
destinations_section:
  tagline: Gönderdiğimiz Yer
  title: 50+ Ülke ve Artan Dönem
  description: Dünya çapında gönderme yapıyoruz ve ana bölgesel pazarlarımız için ayrıntılı rehberler sunuyoruz. Her pazar rehberi, yerel müşteri türlerini, gönderim notlarını ve o bölge için gümrük ipuçlarını kapsar.
  regions_label: Bölgesel Rehberler
  countries_label: Country Rehberleri
faq_section:
  title: Gönderim SSS
  items:
    - q: Ekspres kargo ne kadar sürer?
      a: Ekspres ulaşım süresi varış noktasına bağlıdır — her sorgulamada, herhangi bir karara gelmeden önce ülkeniz için tahmini ulaşım süresini alıntılıyoruz.
    - q: Deniz taşımacılığı ne kadar sürer?
      a: Deniz taşımacılığı, varış limanı ve seyir programlarına göre değişiklik gösterir. Siparişinizle birlikte varış noktanız için tahmini bir pencere belirtiriz ve sevkiyat ayrıldıktan sonra takip alırsınız.
    - q: Hangi nakliye yöntemini seçmeliyim?
      a: 1–3 kart, numune veya acil stok için ekspres. Deniz yükü ise 5–20 kartlık toptan siparişler için, burada araç başına maliyet hızdan daha önemlidir. Her ikisini de karşılaştırmak için teklif veriyoruz.
    - q: İthalat vergileri ve vergiler kargo maliyetine dahil mi?
      a: Hayır. Yük ayrı olarak belirtilir ve ithalat vergileri, KDV/GST ve destinasyon vergileri ülkenizin kurallarına göre ithalatçının sorumluluğundadır. Gümrük işlemlerinin sorunsuz kalması için eksiksiz ve doğru evraklar sağlıyoruz.
    - q: Ülkenize gönderiyor musunuz?
      a: 50 ülkeye gönderme yapıyoruz+. Aşağıdaki bölgesel ve ülke rehberlerimizi inceleyin veya sadece sorunuzu sorabilirsiniz — mevcut hizmeti adresinize onaylayacağız.
    - q: Siparişimi takip edebilir miyim?
      a: Evet. Her sevkiyat — ekspres ya da deniz — sevk gününde sizinle paylaştığımız kapıdan kapıya takip içerir.
cta:
  title: Ülkeniz için bir kargo teklifi alın
  subtitle: Varış yerinizi ve hedef sipariş boyutunuzu bize söyleyin — biz de nakliye seçenekleri, toplu taşıma tahminleri ve toplam maliyetle yanıt vereceğiz.
  actions:
    - variant: primary
      text: Kargo Teklifi İste Yapın
      href: /wholesale-paddle-boards#inquiry
    - text: Toptan Panolara Göz Atın
      href: /wholesale-paddle-boards
