hero:
  tagline: Hakkında
  title: '{SITE} Hakkında'
  subtitle: Ham maddeden bitmiş tekneye kadar yatay entegre bir su sporları üreticisi
intro:
  - "Paddle Board Overstock, tek bir misyonla 2012 yılında kuruldu: hem kalitede hem de suda performans gösteren su sporları ekipmanları tasarlamak ve üretmek. Odaklanmış bir SUP board atölyesi olarak başlayan iş, Qingdao Ekonomi Geliştirme Bölgesi'nde 12.000 metrekarelik entegre bir üretim tesisine dönüştü ve burada şişme tekneler, RIBs, kayaklar, SUP boardlar, güvenlik ekipmanları ve 50+ ülkedeki müşteriler için aksesuarlar üretiyor."
  - Bugün, Paddle Board Overstock bir fabrika markası olarak faaliyet göstermektedir — her şeyi tek çatı altında tasarlıyor, mühendislik yapıyor, prototip üretiyor, imal ediyor ve test ediyoruz. Bu dikey entegrasyon, malzeme seçimi, üretim kalitesi ve teslimat süreleri üzerinde doğrudan kontrol sahibi olmamızı sağlar. Her tekne, ekibimiz tarafından, ekipmanımızda, standartlarımıza göre üretilmektedir.
  - Dünya genelinde eğlence kullanıcıları, ticari işletmeler, devlet kurumları ve marka ortaklarına hizmet veriyoruz. OEM ve ODM programlarımız, işletmelerin fabrika altyapısına yatırım yapmadan kendi ürün hatlarını başlatmalarına yardımcı olur. İster tek bir prototipe, ister tam bir üretim serisine ihtiyacınız olsun, ekibimiz sizi kavramsal aşamadan denize hazır teslimata kadar yönlendirir.
