values:
  - title: Kalite Öncelikli
    desc: Fabrikamızdan çıkan her tekne, sevkiyat öncesinde zorunlu hava tutma, dikiş soyulma ve sistem testlerinden geçer.
  - title: Dikey Entegrasyon
    desc: Kesimden PVC nihai montaja kadar her aşamayı kontrol ediyoruz; böylece yüklenici verimsizliklerini ortadan kaldırıyor ve tutarlı kaliteyi sağlıyoruz.
  - title: Güvenlik Standart Olarak
    desc: CE sertifikası, ürettiklerimizin temelini oluşturur. 64 CE-sertifikalı modelimiz, eğlence ve ticari kullanım için AB güvenlik standartlarını karşılamaktadır.
  - title: Ortak Odaklı
    desc: Şeffaflık, güvenilirlik ve ortak büyüme yoluyla OEM, ODM ve özel marka ortaklarla uzun vadeli ilişkiler kuruyoruz.
services:
  - title: OEM Üretim
    desc: Özelliklerinize göre üretim yapıyoruz. Tasarımlarınızı paylaşın, mühendislik ekibimiz prototip, kalıp ve üretimi üstlenir.
  - title: ODM Çözümler
    desc: Kanıtlanmış platform tasarımlarımızla başlayın. Boyut, renk, grafik ve ambalajları özelleştirerek kendi benzersiz ürün hattınızı oluşturun.
  - title: Özel Marka
    desc: Marka adınız, logonuz, ambalajınız. Ürünler, tam marka entegrasyonu ile satışa hazır olarak gelir.
  - title: Özel Markalama
    desc: Güverte pedi baskısı, gövde grafikleri, tüp çıkartmaları ve özel etiketler — her yüzeyde tutarlı marka görünürlüğü.
certifications:
  - name: CE Sertifikası
    desc: Tekne ve su araçlarımız, AB Rekreasyonel Tekne Direktifi (2013/53/EU) ve ilgili uyumlu standartlara uygundur.
    scope: Tekne ve su araçları
  - name: null
    desc: Şişme su araçlarının tasarım, üretim ve dağıtımı için kalite yönetim sistemi sertifikalıdır.
