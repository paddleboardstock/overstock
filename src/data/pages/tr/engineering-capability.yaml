content_capability:
  tagline: Mühendislik Yeteneği
  title: Mühendisliğimiz Ne<br />Takım Teslim Eder
  subtitle: Paddle Board Overstock mühendisliği, pazar araştırmasından ve tasarım konseptinden prototip üretimi, test ve seri üretime kadar ürün yaşam döngüsünün tamamını kapsar.
  items:
    - title: Endüstriyel Tasarım
      description: Endüstriyel tasarım ekibimiz, müşteri gereksinimleri, pazar araştırması ve rekabet analizinden yola çıkarak estetik, işlevsellik ve üretilebilirliği dengeleyen ürün konseptleri geliştirir. Kalıp üretimine başlamadan önce müşteri incelemesi için 2B eskizler, 3B görselleştirmeler ve spesifikasyon belgeleri hazırlarız.
      features:
        - Konsept geliştirme ve fizibilite çalışmaları
        - 2B tasarım çizimleri ve 3B görselleştirmeler
        - Malzeme seçimi ve teknik şartname
        - Üretim için tasarım (DFM) analizi
        - Ergonomik ve güvenlik değerlendirmesi
    - title: Yapısal Mühendislik
      description: Yapısal mühendislerimiz şişme bot mimarisi konusunda uzmanlaşmıştır — gövde tasarımı, tüp bölmesi konfigürasyonu, drop-stitch çekirdek mühendisliği ve yük dağılımı. Her tasarım, yapısal bütünlük, ağırlık optimizasyonu ve ilgili standartlara uygunluk (CE, ISO, AS) açısından analiz edilir.
      features:
        - Hesaplanmış su kesme açılarına sahip Deep-V fiberglass gövde tasarımı
        - Güvenlik ve yüzdürme için çok bölmeli boru konfigürasyonu
        - Drop-stitch çekirdek spesifikasyonu ve yoğunluk optimizasyonu
        - Yük taşıyan bileşenler için sonlu eleman analizi
        - Ağırlık dağılımı ve denge hesaplamaları
    - title: 3D Modelleme ve CAD
      description: Tüm ürün tasarımları, prototip kalıp yapımına başlamadan önce 3D CAD'de geliştirilir. Mühendislerimiz, ürün modellemesi için SolidWorks ve Rhino 3D kullanır ve bu sayede müşteriler üretime başlamadan önce tüp profilinden konsol düzenine kadar her detayı inceleyebilir.
      features:
        - Tam 3D CAD modelleme SolidWorks ve Rhino 3D'de
        - Müşteri sunumları için foto-gerçekçi render
        - Üretim için teknik çizim paketleri
        - 3D modellerden kalıp ve takım tasarımı
        - Hassas kesim için CAD'den CNC doğrudan veri transferi
    - title: Prototip Üretim & Test
      description: Seri üretimden önce, her yeni ürün prototip aşamasından geçer. Müşteri değerlendirmesi için fonksiyonel prototipler üretiriz, ardından bunları tam test protokolümüzden geçiririz — basınç testi, stabilite testi, yük testi ve su testleri. Prototip aşamasındaki tasarım iterasyonları hızlı ve maliyet-etkin olur.
      features:
        - Hızlı prototip kalıp (15-20 gün teslim süresi)
        - Gerçek dünya değerlendirmesi için fonksiyonel prototip
        - Üretim onayından önce tam test protokolü
        - Test sonuçlarına bağlı olarak iteratif tasarım iyileştirmesi
        - Üretim kalıbı öncesi müşteri onay aşaması
    - title: Özel Aksesuar Entegrasyonu
      description: Birçok OEM projesi, müşteri tarafından sağlanan veya üçüncü taraf aksesuarların entegrasyonunu gerektirir — özel konsollar, özel oturma düzenleri, elektronik sistemler, dalış ekipmanı montajları veya marka öğeleri. Mühendislik ekibimiz, tüm aksesuarların entegrasyon tasarımını, yapısal uyumunu ve kalite doğrulamasını yönetir.
      features:
        - Konsol tasarımı ve gösterge paneli düzeni
        - Özel oturma ve döşeme entegrasyonu
        - Elektronik sistem tasarımı ve kablolama
        - Dalış ve kurtarma ekipmanı montaj sistemleri
        - Marka ve grafik uygulama spesifikasyonları
content_process:
  tagline: Geliştirme Süreci
  title: Konseptten<br />Üretime
  subtitle: Ürün geliştirme sürecimiz, riski minimize etmek, zaman çizelgelerini sıkıştırmak ve üretim hazırlığını ilk günden sağlamak için tasarlanmış yapılandırılmış 6 aşamalı bir iş akışını takip eder.
  stages:
    - stage: '01'
      title: Gereksinimler & Araştırma
      duration: 1-2 hafta
      description: Müşteri ile birlikte ürün spesifikasyonlarını, hedef pazar gereksinimlerini, düzenleyici uygunluk ihtiyaçlarını ve ticari hedefleri tanımlarız. Bu aşama, sonraki tüm çalışmaları yönlendiren bir Ürün Gereksinimleri Belgesi (PRD) üretir.
      deliverables: PRD, pazar analizi, rekabet benchmarkı, ön maliyet tahmini
    - stage: '02'
      title: Konsept Tasarımı
      duration: 2-3 hafta
      description: Endüstriyel tasarım ekibi, Ürün Gereksinimleri Dokümanı (PRD) temelinde ürün konseptleri geliştirir. Birden fazla tasarım seçeneği 3D görselleştirmeler, malzeme önerileri ve ilk mühendislik değerlendirmeleri ile sunulur. Müşteri, detaylı geliştirme için yönü seçer.
      deliverables: 3D kavramsal görselleştirmeler, malzeme spesifikasyonları, tasarım gerekçesi, ön BOM
    - stage: '03'
      title: Detaylı Mühendislik
      duration: 2-4 hafta
      description: Seçilen konsept tamamen mühendislik çalışmalarıyla hazırlanmıştır — 3D CAD modelleme, yapısal analiz, boru konfigürasyonu, gövde tasarımı, aksesuar entegrasyonu ve üretim dokümantasyonu. Tüm boyutlar, malzemeler ve süreçler kalıp için belirtilmiştir.
      deliverables: Tam 3D CAD modeli, mühendislik çizimleri, nihai BOM, takım tezgahı spesifikasyonları, QC planı
    - stage: '04'
      title: Prototip oluşturma
      duration: 2-3 hafta
      description: Prototip araçları üretilir ve fonksiyonel örnekler oluşturulur. Müşteri prototipi PRD spesifikasyonlarına göre inceler. Testler, kararlaştırılan protokole göre yapılır. Üretim kalıplarından önce geri bildirimlere dayanarak tasarım ayarlamaları yapılır.
      deliverables: Fonksiyonel prototip, test raporu, tasarım revizyon logu, müşteri onay belgesi
    - stage: '05'
      title: Üretim Araçları
      duration: 2-3 hafta
      description: Prototip onaylandıktan sonra, üretim aletleri devreye alınır — kalıplar, kaynak jigleri, kesim programları, montaj düzenekleri. Kalite kontrol belgeleri ve denetim kriterleri kesinleştirilir. Süreç doğrulaması için deneme çalışması yapılır.
      deliverables: Üretim takımı, süreç dokümantasyonu, KK denetim planı, deneme çalışması raporu
    - stage: '06'
      title: Toplu Üretim ve Kalite Kontrol
      duration: Sürekli
      description: Tam üretim, her aşamada süreç içi kalite kontrol ile başlar. İlk ürünler incelenir ve parti serbest bırakılmadan önce onaylanır. Üretim süreci boyunca sürekli kalite izleme, hata takibi ve sürekli iyileştirme yapılır.
      deliverables: Üretim programı, KF raporları, parti izlenebilirlik kayıtları, sevkiyat dokümantasyonu
content_customization:
  tagline: Özelleştirme Seçenekleri
  title: Ne Olabilir<br />Özelleştirilmiş
  subtitle: Ürünlerimizin neredeyse her yönü, müşteri gereksinimlerini karşılamak için özelleştirilebilir. Aşağıda en yaygın özelleştirme kategorileri bulunmaktadır.
  columns: 3
  items:
    - title: Gövde ve Yapı
      description: Özel gövde uzunluğu, en genişlik, deadrise açısı, tüp çapı, bölüm konfigürasyonu ve malzeme sınıfı.
      icon: tabler:sailboat
    - title: Renkler ve Grafikler
      description: Tüp rengi (PVC/Hypalon), gövde gelcoatı rengi, konsol rengi, güverte grafikleri, logo yerleşimi ve ambalaj tasarımı.
      icon: tabler:palette
    - title: Konsol ve Kontroller
      description: Orta konsol, yan konsol veya dümenli direksiyon. Özel gösterge paneli düzeni, anahtar yerleşimi ve dümen pozisyonu.
      icon: tabler:steering-wheel
    - title: Oturma ve Döşeme
      description: Jokey koltukları, sıra koltukları, lüks döşeme, renk uyumlu dikiş, katlanabilir veya çıkarılabilir düzenlemeler.
      icon: tabler:armchair
    - title: Aksesuarlar ve Ekipman
      description: Dalış merdivenleri, depo rafları, çekme direkleri, T-tavanlar, Bimini tavanlar, ses sistemleri, navigasyon elektroniği ve güvenlik ekipmanları.
      icon: tabler:backpack
    - title: Ambalajlama & Marka Oluşturma
      description: Özel perakende ambalajları, özel markalı kutular, marka işaretli nakliye kartonları, asma etiketler ve kullanıcı kılavuzları, müşteri dilinde.
      icon: tabler:box
content_industries:
  tagline: Endüstri Uygulamaları
  title: Mühendislik Çözümleri<br />Sektöre Göre
  subtitle: Mühendislik ekibimiz, her biri farklı gereksinimlere ve performans kriterlerine sahip geniş bir deniz uygulamaları yelpazesi için ürünler geliştirdi.
  columns: 3
  items:
    - title: Dalış Operasyonları
      description: Ticari dalış merkezleri için güçlendirilmiş güverteler, dalış merdiveni entegrasyonu, tank depolama sistemleri ve stabil platformlar.
      icon: tabler:lifebuoy
    - title: Kurtarma & Acil Durum
      description: SAR operasyonları için yüksek hızlı gövde tasarımları, kendi kendini boşaltan güverteler, ekipman montaj sistemleri ve çok odacıklı güvenlik yapılandırmaları.
      icon: tabler:alert-triangle
    - title: Deniz Turizmi
      description: Yolcu konforu düzenlemeleri, güneşlik entegrasyonu, biniş sistemleri ve ada transfer operasyonları için yakıt tasarruflu yapılandırmalar.
      icon: tabler:beach
    - title: Yat Yardımcıları
      description: Vinç saklama için kompakt tasarımlar, lüks bitiş seçenekleri, ana gemi renkleri ile uyum, yüksek performanslı çekme özellikleri.
      icon: tabler:sailboat
    - title: Balıkçılık & Su Ürünleri
      description: Düz güverte yapılandırmaları, canlı havuz entegrasyonu, olta tutucu düzenlemeleri, sürekli tuzlu suya maruz kalmaya dayanıklı donanımlar.
      icon: tabler:fish
    - title: Liman & Endüstriyel
      description: Ağır hizmet gövde takviyesi, iş botu düzenlemeleri, personel taşıma yapılandırmaları ve açık deniz operasyonları için ekipman entegrasyonu.
      icon: tabler:ship
