hero:
  tagline: Paddle Board Overstock Akademisi
  title: Öğrenme Merkezi
  subtitle: Her beceri seviyesi için rehberler ve öğreticiler — SUP temellerden ileri kurtarma tekniklerine kadar
categories:
  - level: Başlangıç
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Temeller
        desc: Ayakta kürek sörfü (stand-up paddleboarding) temellerini öğrenin — duruş, kürek çekme tekniği ve denge.
        slug: beginner-sup-guide
      - title: Kürek Teknikleri
        desc: İleri kürek, süpürme küreği, çekme küreği ve düşük destek — temel kürek hareketlerinde ustalaşın.
        slug: sup-paddle-guide
      - title: Önce Güvenlik
        desc: Hava kontrolleri, PFD kullanımı, emniyet ipi kuralları ve kendi kendine kurtarma dahil temel güvenlik uygulamaları.
        slug: sup-safety-guide
  - level: Orta Seviye
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Tur Temelleri
        desc: Saatler süren kürek gezilerini planlama — navigasyon, su tüketimi, tempo ayarlama ve rüzgar tahminlerini okuma.
        slug: touring-sup-guide
      - title: Hava Durumu Okuma
        desc: Deniz tahminlerini yorumlama, bulut desenlerini tanımlama ve rüzgarın su üzerindeki etkilerini anlama.
        slug: weather-planning-water-sports
      - title: Navigasyon Temelleri
        desc: Harita okuma, pusula kullanımı, GPS noktaları ve kıyı boyunca kürek rotası planlama.
        slug: sup-navigation-guide
      - title: Gelgit Farkındalığı
        desc: Gelgit döngülerini, akıntıları ve bunların kalkış zamanlaması ile rota seçimine etkilerini anlama.
        slug: understanding-tides
  - level: İleri Seviye
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Çok Günlü Gezi Planlama
        desc: Sefer lojistiği — ekipman seçimi, yiyecek planlama, güvenlik protokolleri ve acil durum iletişim bilgileri.
        slug: sup-travel-guide
      - title: Kurtarma Teknikleri
        desc: Kendi kendine kurtarma, T-kurtarma, kayaklar için Eskimo kurtarma ve açık suda çekme protokolleri.
        slug: sup-self-rescue
      - title: Gece Küreği
        desc: Karanlıktan sonra navigasyon — aydınlatma gereksinimleri, rota hafızası, grup iletişimi ve tehlike farkındalığı.
        slug: sup-navigation-guide
  - level: Bakım
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Temizlik ve Bakım
        desc: Tatlı su ile durulama, UV koruması, küf önleme ve her seanstan sonra doğru kurutma teknikleri.
        slug: inflatable-sup-maintenance
      - title: Depolama Rehberi
        desc: Şişme tahtalar ve botları saklamak için en iyi uygulamalar — boşaltma, katlama, sıcaklık kontrolü ve raf ömrü.
        slug: inflatable-sup-storage
      - title: Onarım Temelleri
        desc: Küçük delikleri, dikiş sızıntılarını ve vana sorunlarını PVC onarım kitleri ve yama teknikleri ile düzeltin.
        slug: inflatable-sup-repair
      - title: Vana Bakımı
        desc: Vana tiplerini belirleyin (Halkey-Roberts, Boston, Leafield), kalıntılardan temizleyin ve arızalı sapları değiştirin.
        slug: inflatable-sup-repair
knowledge_center_tagline: Bilgi Merkezi
knowledge_center_title: Deniz Ekipmanları ve Endüstri Kılavuzları
knowledge_center_subtitle: Deniz profesyonelleri, filo operatörleri ve su sporları meraklıları için uzman bilgisi ve satın alma kılavuzları.
knowledge_sections:
  - title: RIB Bot Bilgisi
    tagline: Sert Şişme Bot Kılavuzları
    desc: RIB botları hakkında her şey — gövde tasarımı, malzemeler, motor seçimi, bakım ve ticari ve eğlence amaçlı kullanım için satın alma tavsiyeleri.
    guides:
      - title: Doğru RIB Botu Seçme
        desc: RIB seçimi için eksiksiz rehber — boyut, motor gücü, tüp malzemesi, gövde tipi ve kullanım amacı.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB ve Şişme Bot
        desc: Sert şişme bot ve geleneksel şişme bot farkları — gövde tasarımı, performans, dayanıklılık ve kapasite karşılaştırması.
        href: /compare/rib-vs-dinghy
      - title: Ticari RIB ve Rekreasyonel RIB
        desc: Ticari sınıf ve rekreasyonel RIB botları — yapı standartları, malzemeler, ömür, maliyet ve sertifikalar.
        href: /compare/commercial-vs-recreational-rib
      - title: Alüminyum ve Fiberglas Gövde
        desc: Alüminyum ve fiberglas gövdeleri RIB botları için ağırlık, maliyet, dayanıklılık ve korozyon direnci açısından karşılaştırın.
        href: /compare/aluminum-vs-fiberglass
  - title: Şişme Bot Kılavuzu
    tagline: Şişme Su Araçları Bilgisi
    desc: Şişme botlar hakkında kapsamlı kılavuzlar — PVC ve Hypalon, yapım yöntemleri, güvenlik standartları ve bakım en iyi uygulamaları.
    guides:
      - title: PVC ve Hypalon Malzeme Kılavuzu
        desc: Şişme bot yapımı için PVC ve Hypalon CSM arasındaki kesin karşılaştırma.
        href: /compare/pvc-vs-hypalon
      - title: Şişme Botlar Nasıl Yapılır
        desc: Üretim süreci — malzeme kesimi, HF kaynak, dikiş yapımı, basınç testi ve kalite kontrol.
        href: /learn/inflatable-technology
      - title: Şişme Bot Güvenlik Kılavuzu
        desc: Güvenlik standartları, yük kapasitesi, doğru şişirme, kalkış öncesi kontroller ve acil durum prosedürleri.
        href: /learn/water-safety
      - title: Şişme Bot Bakımı
        desc: Şişme botlar ve RIBs için temizlik, saklama, UV koruması, kış hazırlığı ve onarım.
        href: /v2/inflatable-boat-maintenance
  - title: Tekne Bilgisi
    tagline: Şişme Bot ve RIB Merkezi
    desc: Dingilerden RIBs'e kadar tüm şişme bot türleri, malzemeler, yapım yöntemleri, bakım ve güvenlik hakkında teknik rehberler.
    guides:
      - title: Şişme Bot Türleri
        desc: Dingiler, RIBs, kanolar ve yardımcı botlar — farkları öğrenin ve doğru olanı seçin.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Teknolojisi
        desc: Binlerce iç ipliğin nasıl sert, yüksek basınçlı şişme yapılar oluşturduğunu öğrenin.
        href: /learn/drop-stitch-core
      - title: Malzeme Referansı
        desc: PVC denye derecelendirmeleri, kumaş ağırlıkları, UV direnci ve deniz sınıfı malzemeler açıklamaları.
        href: /learn/materials
      - title: RIB vs Dingi
        desc: Farklı kullanım durumları için sert şişme botları geleneksel şişme dingilerle karşılaştırın.
        href: /compare/rib-vs-dinghy
  - title: SUP Bilgisi
    tagline: Ayakta Kürek Tahtası Rehberleri
    desc: SUP tahtaları hakkında her şey — şişme ve sert, tahta boyutları, malzeme teknolojisi ve tüm beceri seviyeleri için uzman tavsiyeleri.
    guides:
      - title: Şişme vs Sert SUP
        desc: iSUP'leri ve sert epoksi tahtaları taşınabilirlik, dayanıklılık, performans ve değer açısından karşılaştırın.
        href: /learn/sup
      - title: SUP Tahta Boyutları Rehberi
        desc: Uzunluk, genişlik ve kalınlığın denge, hız ve manevra kabiliyeti üzerindeki etkileri.
        href: /learn/sup
      - title: SUP Bakım ve Özen
        desc: Şişme SUP tahtaları için temizlik, saklama, UV koruması ve onarım ipuçları.
        href: /v2/inflatable-sup-maintenance
      - title: İlk SUP Seçiminiz
        desc: Kilo, beceri seviyesi ve kullanım amacınıza uygun doğru ayakta kürek tahtasını seçmek için başlangıç rehberi.
        href: /learn/sup
  - title: Dalış Ekipmanları Rehberi
    tagline: Ticari Dalış Botu Bilgisi
    desc: Dalış merkezleri, dalış operatörleri ve ticari dalış ekipleri için dalış botları, dalış RIBs ve ekipmanları hakkında özel rehberler.
    guides:
      - title: Dalış Merkezleri için En İyi RIB Bot
        desc: Dalış merkezinize uygun dalış RIB seçimi — kapasite, konfigürasyon ve bütçe kriterleri.
        href: /solutions-diving-center-boats
      - title: Dalış RIB Konfigürasyon Rehberi
        desc: Dalış RIBs için gerekli özellikler — tüp rafları, merdiven sistemleri, dalış platformu ve ekipman depolama.
        href: /solutions-diving-center-boats
  - title: Yat Yardımcı Bot Rehberi
    tagline: Süperyat ve Deniz Servis Botları Çözümleri
    desc: Mükemmel yat servis botunu seçme kılavuzları — şişme servis botları, RIB botlar, depolama çözümleri ve servis botu aksesuarları.
    guides:
      - title: Yat Servis Botu Nasıl Seçilir
        desc: Yatınız için bir servis botu seçerken dikkate alınması gereken faktörler — boyut, malzeme, motor ve depolama.
        href: /solutions-yacht-tender-solutions
      - title: Şişme vs RIB Botlar
        desc: Performans, dayanıklılık ve depolama açısından şişme botları sert şişme botlarla karşılaştırın.
        href: /compare/rib-vs-dinghy
  - title: Kurtarma Ekipmanları Kılavuzu
    tagline: Arama ve Kurtarma Su Araçları Bilgisi
    desc: Sahil güvenlik, cankurtaranlar ve afet yardım ekipleri için kurtarma botları, SAR su araçları ve acil müdahale ekipmanları üzerine profesyonel kılavuzlar.
    guides:
      - title: SAR Botu Seçim Kılavuzu
        desc: Doğru arama ve kurtarma botunu nasıl seçersiniz — hız, kapasite, dayanıklılık ve özel ekipman gereksinimleri.
        href: /solutions-rescue-watercraft
      - title: Kurtarma Operasyonları İçin Ticari RIB
        desc: Neden ticari sınıf RIBs profesyonel arama ve kurtarma ekipleri tarafından dünya çapında tercih edilmektedir.
        href: /use-cases/search-and-rescue
