hero:
  tagline: Paddle Board Overstock Akademi
  title: Öğrenme Merkezi
  subtitle: Her beceri seviyesi için rehberler ve öğreticiler — SUP temellerden ileri kurtarma tekniklerine kadar
categories:
  - level: Başlangıç
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Temeller
        desc: Ayakta kürek sörfü (stand-up paddleboarding) temellerini öğrenin — duruş, kürek çekme tekniği ve denge.
        slug: beginner-sup-guide
      - title: Kürek Teknikleri
        desc: İleri kürek, süpürme küreği, çekme küreği ve düşük destek — temel kürek hareketlerinde ustalaşın.
        slug: sup-paddle-guide
      - title: Önce Güvenlik
        desc: Hava kontrolleri, PFD kullanımı, emniyet ipi kuralları ve kendi kendine kurtarma dahil temel güvenlik uygulamaları.
        slug: sup-safety-guide
  - level: Orta Seviye
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Tur Temelleri
        desc: Saatler süren kürek gezilerini planlama — navigasyon, su tüketimi, tempo ayarlama ve rüzgar tahminlerini okuma.
        slug: touring-sup-guide
      - title: Hava Durumu Okuma
        desc: Deniz tahminlerini yorumlama, bulut desenlerini tanımlama ve rüzgarın su üzerindeki etkilerini anlama.
        slug: weather-planning-water-sports
      - title: Navigasyon Temelleri
        desc: Harita okuma, pusula kullanımı, GPS noktaları ve kıyı boyunca kürek rotası planlama.
        slug: sup-navigation-guide
      - title: Gelgit Farkındalığı
        desc: Gelgit döngülerini, akıntıları ve bunların kalkış zamanlaması ile rota seçimine etkilerini anlama.
        slug: understanding-tides
  - level: İleri Seviye
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Çok Günlü Gezi Planlama
        desc: Sefer lojistiği — ekipman seçimi, yiyecek planlama, güvenlik protokolleri ve acil durum iletişim bilgileri.
        slug: sup-travel-guide
      - title: Kurtarma Teknikleri
        desc: Açık sularda kendi kurtarma, T-kurtarma ve çekme protokolleri.
        slug: sup-self-rescue
      - title: Gece Küreği
        desc: Karanlıktan sonra navigasyon — aydınlatma gereksinimleri, rota hafızası, grup iletişimi ve tehlike farkındalığı.
        slug: sup-navigation-guide
  - level: Bakım
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Temizlik ve Bakım
        desc: Tatlı su ile durulama, UV koruması, küf önleme ve her seanstan sonra doğru kurutma teknikleri.
        slug: inflatable-sup-maintenance
      - title: Depolama Rehberi
        desc: Şişme tahtaları saklamak için en iyi uygulamalar — havasını boşaltma, katlama, sıcaklık kontrolü ve rafta kalma süresi.
        slug: inflatable-sup-storage
      - title: Onarım Temelleri
        desc: Küçük delikleri, dikiş sızıntılarını ve vana sorunlarını PVC onarım kitleri ve yama teknikleri ile düzeltin.
        slug: inflatable-sup-repair
      - title: Vana Bakımı
        desc: Vana tiplerini belirleyin (Halkey-Roberts, Boston, Leafield), kalıntılardan temizleyin ve arızalı sapları değiştirin.
        slug: inflatable-sup-repair
knowledge_center_tagline: Bilgi Merkezi
knowledge_center_title: Paddle Board Rehberleri ve Bilgisi
knowledge_center_subtitle: Her seviyeden su sporcusu için uzman rehberler ve satın alma tavsiyeleri.
knowledge_sections:
  - title: Bord Teknolojisi ve İnşaat
    tagline: Sürekli Tahtanızın İçinde
    desc: Şişme stand up paddle tahtaları nasıl inşa edilir — drop-stitch çekirdekler, lamine katmanlar, EVA güverteler ve fabrika basınç testleri.
    guides:
      - title: Paddle Tahtaları Nasıl Yapılır
        desc: Malzeme kesiminden ve lamine işleminden %100 basınç testine kadar — her kartın fabrikadan nasıl çıktığını görün.
        href: /factory/process
      - title: Drop-Stitch Temel Teknoloji
        desc: Binlerce iç ipliğin nasıl sert, yüksek basınçlı şişirilebilir bir yapı oluşturduğunu.
        href: /learn/drop-stitch-core
      - title: Malzeme Referansı
        desc: PVC denye derecelendirmeleri, kumaş ağırlıkları, UV direnci ve güverte malzemeleri açıklandı.
        href: /learn/materials
      - title: Şişirilebilir Tahta Teknolojisi
        desc: Kaynaklı dikişler, ray yapımı ve tahtanızı sert ve hava geçirmez tutan vana sistemleri.
        href: /learn/inflatable-technology
  - title: Satın Alma Kılavuzları
    tagline: Doğru Tahtayı Seçin
    desc: İlk ya da sonraki şişme SUP’nizi seçmek için ihtiyacınız olan her şey, boyuttan yapıya kadar.
    guides:
      - title: Şişme SUP Nasıl Seçilir
        desc: Ana faktörler — yapım, kalınlık, kanat düzeni ve dahil olan aksesuarlar.
        href: /guides/how-to-choose-your-sup/
      - title: Stand-Up Paddleboarding Nedir?
        desc: Spora, ekipmana dostane bir giriş ve şişme tahtaların başlamayı neden kolaylaştırdığı.
        href: /guides/what-is-sup
      - title: Şişme ve Sert Tahta
        desc: iSUP'leri ve sert epoksi tahtaları taşınabilirlik, dayanıklılık, performans ve değer açısından karşılaştırın.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Boyut Rehberi
        desc: Ağırlığınıza, beceri seviyenize ve kürek çekme tarzınıza uygun doğru tahta uzunluğunu, genişliğini ve hacmini bulun.
        href: /size-guide
  - title: Beceriler ve Güvenlik
    tagline: Güvenle Kürek Çekin
    desc: Her oturum için pratik bilgiler — yeni başlayanlar için temel bilgiler, su güvenliği, bakım ve onarım.
    guides:
      - title: SUP Temeller — Yeni Başlayanlar İçin Rehber
        desc: Bir aceminin bilmesi gereken her şey — tahta türleri, raket boyutları, duruş ve ilk gün ipuçları.
        href: /v2/beginner-sup-guide
      - title: Su Güvenliği Temelleri
        desc: Hava durumu kontrolleri, PFD seçimi, bağlılık kuralları, kendi kendine kurtarma ve grup halinde kürek çekme en iyi uygulamaları.
        href: /learn/water-safety
      - title: SUP Bakım ve Özen
        desc: Şişme SUP tahtaları için temizlik, depolama, UV koruma ve bakım ipuçları.
        href: /v2/inflatable-sup-maintenance
      - title: Tahta Onarım Temelleri
        desc: Küçük delikleri, dikiş sızıntılarını ve vana sorunlarını PVC onarım kitleri ve yama teknikleri ile düzeltin.
        href: /v2/inflatable-sup-repair
