hero:
  tagline: Sertifikalar & Standartlar
  title: Kalite Sertifikaları<br />& Uyum Standartları
  subtitle: Paddle Board Overstock ürünleri, uluslararası deniz güvenliği standartlarına, kalite yönetim sistemlerine ve çevresel düzenlemelere uygun olarak üretilmektedir.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock kalite sertifikaları ve uyum belgeleri
content_certifications:
  tagline: Sertifikalarımız
  title: Sertifikalı Kalite,<br />Küresel Olarak Tanınan
  subtitle: 64 CE sertifikalı model ve tüm fabrikanın sertifikaları, kalite, güvenlik ve çevresel sorumluluğa olan bağlılığımızı göstermektedir.
  items:
    - title: CE Sertifikalı
      description: 64 CE sertifikalı modeller, rekreasyonel su araçları için Avrupa CE işaretleme gerekliliklerine uyarak, güvenlik, sağlık ve çevre koruma standartlarının karşılanmasını sağlar.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Kalite yönetim sistemimiz ISO 9001:2015 sertifikalıdır ve şişme su araçları ile deniz ekipmanlarının tasarım, üretim ve dağıtım süreçlerini kapsamaktadır.
      icon: tabler:clipboard-check
    - title: UKCA İşaretli
      description: İngiltere pazarında satılan ürünler, deniz ekipmanları ve kişisel su araçları için İngiltere düzenlemelerine uygunluğu doğrulayan UKCA işaretini taşır.
      icon: tabler:shield
    - title: BSCI Uyumlu
      description: Paddle Board Overstock, etik üretim uygulamalarını, adil çalışma koşullarını ve tedarik zinciri sorumluluğunu göstermek için BSCI (İş Sosyal Uyum Girişimi) denetiminden geçirilmiştir.
      icon: tabler:heart-handshake
    - title: REACH Uyumlu
      description: Paddle Board Overstock ürünlerinde kullanılan tüm malzemeler, kimyasal güvenlik için AB REACH düzenlemelerine uygundur ve PVC, Hypalon veya bileşenlerimizde yasaklı madde bulunmamaktadır.
      icon: tabler:flask
    - title: Malzeme Testi
      description: Kumaşlar, çekme dayanımı, yırtılma direnci, UV bozulma ve soğuk çatlama performansı açısından test edilir. Her üretim partisi örneklenir ve doğrulanır.
      icon: tabler:test-pipe
content_factory:
  tagline: Fabrika Standartları
  title: Üretim Mükemmelliği<br />— Belirlenen Şartlara Göre Üretilmiştir
  subtitle: 12.000 m² tesisimiz, üretimin her aşamasında sıkı kalite kontrol protokolleri altında faaliyet göstermektedir.
  list:
    - 'Gelen Malzeme Muayenesi: Tüm ham maddeler — PVC kumaş, Hypalon, alüminyum, kontrplak, yapıştırıcılar — üretime girmeden önce şartnamelere göre test edilir.'
    - 'Üretim İçi Kalite Kontrol: Her üretim aşamasında belgelenmiş kalite kontrol noktaları vardır. Kaynak dayanımı, dikiş hizalaması, vana montajı ve bağlantı torku hat üzerinde doğrulanır.'
    - 'Basınç Testi: Her şişme hazne, 1,25× nominal basınca 24–48 saat süreyle basınç testine tabi tutulur. Kaçak oranı, ISO 6185’e göre kabul edilebilir sınırlar içinde olmalıdır.'
    - 'Nihai Muayene: Tamamlanmış ürünler, sevkıyat öncesinde boyutsal doğruluk, kozmetik yüzey, aksesuar eksiksizliği ve paketleme bütünlüğü açısından incelenir.'
    - 'Parti İzlenebilirliği: Her ürün, hammaddeden bitmiş ürüne kadar tam izlenebilirlik sağlayan üretim parti kayıtlarına bağlı bir seri numarası taşır.'
content_safety:
  tagline: Deniz Güvenliği Standartları
  title: Önce Güvenlik<br />— Güvenilir İşlem İçin Tasarlanmıştır
  subtitle: Paddle Board Overstock ürünleri, ticari ve eğlence amaçlı kullanım için uluslararası deniz güvenliği standartlarını karşılayacak şekilde tasarlanmış ve test edilmiştir.
  items:
    - title: ISO 6185
      description: Şişme botlar, yapı, denge, kaldırma kapasitesi ve yük taşıma açısından ISO 6185 standartlarına uygundur.
      icon: tabler:sailboat
    - title: ABYC Standartları
      description: Elektrik sistemleri ve yakıt sistemleri, güvenli kurulum ve işletme için ABYC (Amerikan Tekne & Yat Konseyi) standartlarına uygun olarak tasarlanmıştır.
      icon: tabler:bolt
    - title: SOLAS Uygunluk
      description: Güvenlik ekipmanları ve can kurtarma cihazları, uygulanabilir olduğunda SOLAS (Denizde Hayatın Güvenliği) gereksinimlerini karşılamaktadır.
      icon: tabler:lifebuoy
cta:
  title: Projeniz için sertifikalı ürünlere mi ihtiyacınız var?
  subtitle: Pazarınız için sertifikasyon gereksinimlerini, dokümantasyon ve uygunluğu tartışmak için ekibimizle iletişime geçin.
  actions:
    - variant: primary
      text: Sertifika belgelerini talep et
      href: /contact
    - text: Kalite sayfamızı görüntüle
      href: /quality
