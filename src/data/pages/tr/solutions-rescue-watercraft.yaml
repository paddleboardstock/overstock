content_challenge:
  tagline: Zorluk
  title: Kurtarma Operasyonları Gerektirdiği<br />Ödün Vermeyen Güvenilirlik
  subtitle: Arama ve kurtarma organizasyonları ekstrem güvenlik sorumluluğu altında çalışır — her bot arızası kabul edilemez sonuçlar doğurur.
  paragraphs:
    - Kurtarma operasyonlarında başarı ve başarısızlık arasındaki fark dakikalarla ölçülür. Bot hemen fırlatılmaya hazır olmalı, zorlu koşullarda çalışabilmeli ve yolcularla güvenli bir şekilde dönmelidir. Güvenlik sorumluluğu mutlak — bir kurtarma görevi sırasında mekanik bir arıza, tamir maliyeti değil, kaybedilen bir hayattır.
    - SAR botlarının mağdurlara hızla ulaşmak için yüksek hıza ve güvenli kurtarma operasyonları için olağanüstü stabiliteye sahip olması gerekir. Kurtarma ekipmanları, tıbbi malzemeler ve iletişim cihazlarını sıklıkla sınırlı güvertede taşıyabilmelidir. Devlet hizmetinde çalışan botlar, kamu alım bütçelerini haklı çıkarmak için uzun hizmet ömrü (10-15 + yıl) de gerektirir.
    - Operatör ve arama açısından görünürlük kritiktir. Konsol tasarımı 360 derece görüş sağlamalı ve bot hava araçları ve diğer gemiler tarafından kolayca görülebilir olmalıdır.
    - Paddle Board Overstock kurtarma RIBs, bu gereksinimler için tabandan tasarlanmıştır — kendi kendine boşalan güverteler, takviye edilmiş gövdeler, navigasyon sistemleri ve devriye modellerinde standart olarak vinç direkleri ile birlikte.
content_solution:
  tagline: Çözümümüz
  title: Amaç için Tasarlanmış Kurtarma RIBs
  subtitle: Her Paddle Board Overstock kurtarma botu SOLAS ve ulusal SAR standartlarını karşılamak veya aşmak için tasarlanmıştır.
  list:
    - Kendi kendine boşalan güverte — kurtarma operasyonları sırasında stabilite için su otomatik olarak tahliye edilir
    - Takviye edilmiş derin-V gövde — zorlu sularda öngörülebilir manevra kabiliyeti ile yüksek hızda performans
    - Tam navigasyon ışıkları takımı — her hava koşulunda gün ve gece operasyonu
    - Vince uygun direk ve halat — gemi çekme veya kurtarma kızağı operasyonlarına hazır
    - Ekipman montaj plakaları — radyo, arama ışığı, siren ve tıbbi ekipman
    - Birden fazla motor konfigürasyonu — tek dıştan takma motor veya çift motor ile yedeklilik
    - Yüksek görünürlüklü tüp renkleri — maksimum görünürlük için turuncu, sarı veya kırmızı
content_segments:
  tagline: Kurtarma Profilleri
  title: Arama ve Kurtarma Deniz Araçları Çözümleri<br />Kuruluş Türüne Göre
  subtitle: Farklı kurtarma organizasyonları farklı yetkiler, bütçe döngüleri ve işletim ortamlarına göre faaliyet gösterir — kıyı gönüllü ekiplerinden ulusal sahil güvenlik filolarına kadar. Her kurtarma RIB görevi profiline uygun şekilde konfigüre edilir.
  items:
    - title: Sahil Güvenlik ve Devlet SAR Kurumları
      subtitle: Mutlak güvenlik sorumluluğu — görev kritik filo standartları
      description: Devlet SAR kurumları deniz operasyonlarında en yüksek güvenlik sorumluluğunu taşır. Her tekne aşırı koşullarda kusursuz performans göstermelidir — bir kurtarma görevi sırasında ekipman arızası kabul edilemez. Satın alma kararları, ön maliyetten ziyade 10-15 yıllık hizmet ömrü boyunca toplam sahip olma maliyeti ile yönlendirilir. Kurumlar, yıllarca kıyı devriyesine dayanabilen, sıkı ulusal standartları karşılayan ve dağıtılmış istasyonlarda tutarlı performans sağlayan gemilere ihtiyaç duyar. Kapsamlı uygunluk belgeleri ve çok yıllı servis anlaşmaları zorunludur.
      features:
        - SOLAS ve ulusal SAR standartlarına uygunluk belgeleri paketi
        - Filo genelinde parça ortaklığı — istasyon düzeyinde envanter karmaşıklığını azaltır
        - Görev kritik yedeklilik için çift motor konfigürasyonu
        - 10-15 yıllık hizmet ömrü tasarımı ile planlı bakım programları
        - Her hava koşuluna uygunluk — sert deniz durumları için güçlendirilmiş derin V gövde
    - title: Can Kurtaran ve Plaj Kurtarma Hizmetleri
      subtitle: Hızlı konuşlandırma, sığ su operasyonları
      description: Sörf bölgelerinden çıkarılabilen, sığ kıyı sularında çalışabilen ve dakikalar içinde yüzücülere veya mahsur kalan teknelere ulaşabilen hızlı müdahale teknelerine ihtiyaç duyan belediye ve plaj cankurtaran hizmetleri. Ekipman, küçük bir araçla plajda çekilebilecek veya elle taşınabilecek kadar hafif olmalıdır.
      features:
        - Sörf bölgesi ve kıyı operasyonları için sığ draftlı RIB gövde
        - Pruva kaldırma kulbu ve omurgalık koruması ile plajdan indirilebilir
        - Entegre kurtarma kızak veya kurtarma yüzücü platformu
        - Yüksek görünürlüklü turuncu veya sarı tüp renkleri standart
    - title: İtfaiye Kurtarma Departmanları
      subtitle: Yangın pompası entegrasyonu, ekipman montajı, hızlı müdahale
      description: İtfaiye kurtarma deniz birimleri, su kenarındaki yapı yangınlarına, tekne yangınlarına ve su tabanlı kurtarma olaylarına müdahale eder. Bu tekneler, stabil ve hızlı müdahale platformuna entegre edilmiş yangın pompaları, monitörler, hortum depolama ve solunum cihazları taşımalıdır. Departmanlar ayrıca bu tekneleri sel müdahalesi ve karşılıklı yardım operasyonları için kullanır. Konsol düzenleri, mürettebat hareket alanını kısıtlamadan pompa kontrolleri, radyo sistemleri ve acil durum aydınlatmasını barındıracak şekilde tasarlanmalıdır.
      features:
        - Pruvada monte edilmiş yangın monitörü ve pompa entegrasyon paketi
        - Yangın pompası, hortum depolama ve BA setleri için özel ekipman montajı
        - Pompa kontrolleri, radyo ve acil durum aydınlatması için konfigüre edilebilir konsol düzeni
        - Yangın söndürme su tahliyesi ve stabilite için kendi kendini boşaltan güverte
        - 'Gece operasyonları paketi: arama ışığı, sahne aydınlatması, mavi/kırmızı ışık çubuğu'
    - title: Deniz Polisi ve Liman Güvenliği
      subtitle: Engelleme, devriye, biniş operasyonları
      description: Deniz kolluk kuvvetleri ise yüksek hızlı takip, şüpheli gemiye binme ve liman güvenlik devriyesi yapabilen gemilere ihtiyaç duyar. Bu tekneler, uygulama ekipmanları ve silahları için güvenli depolama, kıyı komutanlığı ile iletişim entegrasyonu ve biniş ekibi operasyonları için yeterli güverte alanına sahip olmalıdır. Gece operasyonları kabiliyeti ve düşük profilli yaklaşım, engelleme görevleri için gereklidir.
      features:
        - Yüksek hızlı takip yeteneği — 40+ knot maksimum hızda planlama gövdesi
        - Silah dolabı ve uygulama ekipmanı depolama bölmelerini güvence altına alın
        - Polis radyosu, MDT ve iletişim sistemleri için konsol entegrasyonu
        - 'Gece operasyon paketi: IR spot ışığı, FLIR montajı, gizli aydınlatma'
        - Kaymaz yüzeye sahip güçlendirilmiş biniş platformu
        - Mavi/kırmızı acil durum aydınlatması ve siren sistemi
    - title: Gönüllü SAR ve Kar Amacı Gütmeyen Kuruluşlar
      subtitle: Hibe fonlu, topluluk temelli kıyı ve göl operasyonları
      description: Topluluk temelli kurtarma grupları, devletin SAR kapsamının sınırlı olduğu göllerde, nehirlerde ve kıyı bölgelerinde faaliyet gösterir. Genellikle bağışlar veya devlet hibeleriyle finanse edilen bu kuruluşlar, gönüllülerin minimum özel eğitimle güvenle kullanabileceği, güvenilir, az bakım gerektiren bir gemiye ihtiyaç duyar. Hibe tedarik döngüleri, teknelerin sabit bütçeler içinde kalırken uyum gereksinimlerini karşılaması gerektiği anlamına gelir.
      features:
        - Daha düşük satın alma ve işletme maliyeti için optimize edilmiş tek dış motorlu konfigürasyon
        - Daha PVC düşük bakım ve kolay saha onarımı için inşaat
        - Gönüllü operatörler için elektronik karmaşıklığı en aza indiren çok fonksiyonlu konsol
        - Fonlama başvuruları için hibe uyumu dokümantasyon paketi
        - Özel römork veya vinç olmadan sahil suya indirme için hafif tasarım
    - title: Sel Kurtarma ve Afet Müdahalesi
      subtitle: İç bölgelerdeki sel baskını, sığ su, enkaz dolu ortamlar
      description: Sel kurtarma belirgin bir operasyonel profildir — tekneler, su altında kalan kentsel alanlarda, enkaz dolu akıntılarda ve su altında olan engellerin görünmediği son derece sığ sularda çalışır. Operatörler, su basmış sokaklarda yol alabilecek, enkazı aşabilen ve mağdurları binalardan ve araçlardan çıkarabilen gemilere ihtiyaç duyar. Sığ suya dayanıklılığı ve akıntıda takılma tehlikeleriyle çalışma yeteneği kritik öneme sahiptir. Bu tekneler genellikle itfaiye departmanları, sivil savunma ve afet yardım STK'ları tarafından konuşlandırılır.
      features:
        - Ultra sığ suya sahip gövde — 30-50 cm derinlikte çalışır
        - Batık engeller için enkaz saptıran baş ve güçlendirilmiş boru koruması
        - Sel suyu akışı ve mağdurların kurtarılması için kendi kendine tahsis edilen teras
        - Hava keşif görüşü için yüksek görünürlüklü turuncu veya sarı tüpler
        - Helikopter taşımacılığı ve karayolu kullanımı için hafif tasarım
        - Kaldırma ve ip kurtarma operasyonları için güçlendirilmiş kaldırma noktaları
