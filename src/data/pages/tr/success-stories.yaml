hero:
  tagline: Başarı Hikayeleri
  title: Gerçek Sonuçlar<br />Su İşletme Kurucuları
  subtitle: Dünya genelinde kulüplerin, tatil köylerinin ve girişimcilerin Aquafarer ekipman ve destekle karlı su sporları operasyonlarını nasıl inşa ettiğini görün.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer müşteri başarı hikayeleri
stories:
  - title: Bir Akdeniz Tatil Köyü Nasıl Karlı Bir SUP Kiralama İşletmesi Kurdu
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5 yıldızlı plaj tatil köyü — Yunanistan
    problem: Tatil köyünün memnuniyet puanlarını artırmak ve yeni bir gelir kaynağı yaratmak için kaliteli misafir su aktivitelerine ihtiyacı vardı, ancak ekipman, güvenlik altyapısı ve personel uzmanlığı eksikti.
    solution: Aquafarer, tatil köyü renkleri ve logosuyla 50 adet özel markalı SUP tahtası, cankurtaran istasyonu ve şamandıra hatları dahil tam güvenlik sistemi ve ekipman kullanımı, misafir eğitimi ve güvenlik protokollerini kapsayan 3 günlük personel eğitim programı ile teslim etti.
    result:
      - İlk ay içinde 300+ haftalık misafir etkinliği rezerve edildi
      - 'Su aktiviteleri için misafir memnuniyeti puanları: 4,8/5'
      - 'Yeni yıllık yan gelir: 180.000$'
      - İlk işletme sezonunda sıfır güvenlik olayı
      - Ekipman değiştirme maliyeti önceki tedarikçiye göre %40 azaldı
    quote:
      text: Aquafarer sadece tahtaları teslim etmedi — bize eksiksiz bir misafir deneyimi oluşturmakta yardımcı oldu. Su sporları programımız bir sezonda sıfırdan resortun en önemli özelliğine dönüştü.
      author: Tatil Köyü Genel Müdürü
    cta_text: Tatil Köyü Çözümünüzü Kurun
    cta_href: /solutions/resorts
  - title: Bir Avustralya Startup'ı 90 Günde Nasıl Bir Su Markası Kurdu
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: İlk kez girişimci — Avustralya
    problem: Bir açık hava meraklısı, Avustralya pazarı için kendi SUP markasını başlatmak istedi ancak üretim deneyimi, tedarikçi ilişkileri yoktu ve sınırlı sermayesi vardı.
    solution: Aquafarer'nin Marka Lansmanı Paketi, ürün seçimi danışmanlığı, özel logo ve renk tasarımı, askı etiketli markalı perakende ambalajı, CE sertifikasyon belgeleri ve FOB ile Sydney'e nakliyeyi sağladı.
    result:
      - İlk temas sonrası 75 günde 200 tahtalık ilk sevkiyat teslim edildi
      - Marka, varışından itibaren 2 hafta içinde Shopify + Amazon AU'da piyasaya sürüldü
      - İlk stok 45 günde tükendi
      - 'Ortalama kar marjı: perakende fiyatlandırmada %55'
      - 'İkinci sipariş: Lansmandan itibaren 60 gün içinde 500 birim verildi'
    quote:
      text: Marka fikrim vardı ama üretim bilgim sıfırdı. Aquafarer tüm süreç boyunca adeta elimi tuttu — doğru pano tasarımını seçmekten ilk siparişimi kutusundan çıkarmaya kadar. Hayalden teslimata 90 gün.
      author: Kurucu, Avustralya SUP Markası
    cta_text: Markanızı Başlatın
    cta_href: /solutions/entrepreneurs
  - title: Bir Tayland Plaj Kulübü 10 Panodan 80 Panele Nasıl Yükseldi
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Su Sporları Kulübü — Tayland
    problem: Phuket'te küçük bir sahil kulübü, hobi olarak yürütülen işletmeden turistlere hizmet veren profesyonel bir kiralama işine geçmek zorundaydı, ancak tutarlı kalite ve fiyat sunan güvenilir bir ekipman tedarikçisi bulamıyordu.
    solution: Aquafarer'ın Kulüp Başlangıç Paketi (10 board, kürek, güvenlik ekipmanı, marka çalışması) ile başlayan kulüp, 18 ay boyunca Premium Paket programı aracılığıyla büyüdü.
    result:
      - 18 ay içinde 10 boarddan 80 boarda tutarlı kalite ve fiyatla büyüdü
      - Aynı tedarikçiyle kano ve pedal bot kiralama eklendi
      - Özel kulüp markası turistler arasında marka bilinirliğini artırdı
      - Bakım maliyetleri önceki bütçe ekipmanına göre %60 azaldı
      - Artık yoğun sezonda günlük 150+ kiralama yapılıyor
    quote:
      text: Kulüp Başlangıç Paketi mükemmel bir giriş noktasıydı. İşimiz büyüdükçe, Aquafarer bizimle büyüdü — aynı kalite, aynı fiyat, sürpriz yok.
      author: Kulüp Sahibi, Phuket
    cta_text: Kulüp Paketini Başlat
    cta_href: /solutions/clubs
  - title: Karayipler Resort Zincirinin 5 Tesisinde Su Sporlarını Standartlaştırma Yöntemi
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Resort zinciri — Karayipler
    problem: 5 tesise sahip lüks bir resort zinciri, tüm konumlarda tutarlı su sporları ekipmanı kalitesi ve marka çalışması ile merkezi tedarik ve sezonluk yenileme planlamasına ihtiyaç duyuyordu.
    solution: Aquafarer, birleştirilmiş markalama, paylaşılan yedek parça stoğu ve yıllık yenileme programı ile 300 SUPs ve 100 kano içeren çok tesisli bir filoyu teslim etti.
    result:
      - Tüm 5 tesiste standartlaştırılmış misafir deneyimi sağlandı
      - Konsolide satın alma ve hacim fiyatlandırma ile %30 maliyet tasarrufu
      - Merkezi yedek parça stoğu, durma süresini %80 azalttı
      - Yıllık ekipman yenileme programı sezon sonu telaşını ortadan kaldırdı
      - Misafirlerin su sporlarına katılımı yıllık bazda %45 arttı
    cta_text: Resort Programınızı Tasarlayın
    cta_href: /solutions/resorts
