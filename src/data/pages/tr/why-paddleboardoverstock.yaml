reasons:
  tagline: Paddle Board Overstock Farkı
  title: Bizi Farklı Kılan
  isBeforeContent: false
  columns: 3
  items:
    - title: Gerçek Üretim, Ticaret Değil
      description: 12.000 m²'lik bir fabrikaya sahibiz ve işletiyoruz. Paddle Board Overstock ile ortaklık yaptığınızda, ürünlerinizi tasarlayan, mühendislik yapan ve üreten kişilerle doğrudan çalışırsınız — aracısız.
      icon: tabler:building-factory
    - title: Mühendislik Odaklı Yaklaşım
      description: Tasarım sürecimiz ürün kategorisinden ziyade kullanım senaryosu ile başlar. Gövde şekli, malzeme seçimi ve konfigürasyonu, tahtanın suda nasıl kullanılacağını optimize edecek şekilde tasarlanır.
      icon: tabler:engine
    - title: Kanıtlanmış Kalite
      description: Her tahta, sevkiyat öncesi 24-48 saat boyunca nominal basıncının 1.25 katına kadar basınç testine tabi tutulur ve sevkiyatlarımızın %99,3'ü kusursuz gelir — garanti ile desteklenmiştir.
      icon: tabler:award
    - title: Kürekçi Öncelikli Tasarım
      description: 'Her model, kürek çekme şeklinizle başlar: Başlangıç için stabil platformlar, gezi için aerodinamik şekiller ve yoga için tam boy güverteler. Biz, vitrin özellikleri için değil, gerçek kürekçiler için tasarlıyoruz.'
      icon: tabler:adjustments
    - title: Global Lojistik
      description: Kaliforniya'da ABD deposu, Weihai'den doğrudan sevkiyat, acil siparişler için hava kargo. Tüm dünya genelinde gümrük evrak işleri ve belgeleri biz hallediyoruz.
      icon: tabler:truck-delivery
    - title: Ömür Boyu Destek
      description: 20 yıl önce ürettiğimiz tahtaların arkasında duruyoruz. Orijinal yedek parçalar, teknik danışmanlık, tamir rehberi — ekibimiz ihtiyaç duyduğunuz her an yanınızda, nerede olursanız olun.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dünya Çapında Kürekçiler Tarafından Güveniliyor
  title: Kürekçilerin Söyledikleri
  items:
    - content: Okyanus Viyajerim sakin göl sabahlarından dalgalı sahil öğleden sonralarına kadar her şeyi halletti. İki sezon sonra, hala yeni gibi görünüyor ve sürüşü aynı.
      name: — Eğlence Amaçlı Kürekçi, Kaliforniya
    - content: İlk şişme tahtamı çevrimiçi alırken gergindim, fakat şişirdiğim an kalite açıktı. Sert, stabil ve güzel bitirilmiş.
      name: — İlk Kez SUP Sahibi, Almanya
    - content: Her yaz hafta sonu ailecek kürek çekiyoruz. Üç tahta, sıfır sorun, ve çocuklar parlak tasarımları çok seviyor.
      name: — Aile Kürekçisi, Avustralya
    - content: Basınç testi pazarlama konuşması değil — tahtam tam basınçta taş gibi ve haftalık kürek çekmeye rağmen bir yıl sonra bile uzama göstermiyor.
      name: — Haftalık Kürekçi, Hollanda
cta:
  title: Mükemmel Tahtanızı Bulmaya Hazır Mısınız?
  subtitle: Doğru tahtayı seçmek için kürek uzmanlarımızla dürüst tavsiyeler için konuşun — baskı yok, sadece gerçek yardım.
  actions:
    - variant: primary
      text: Ekibimizle konuşun
      href: /contact
    - text: Ürün kataloğunu indirin
      href: /resources
