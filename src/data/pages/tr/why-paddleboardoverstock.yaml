hero:
  tagline: Neden Paddle Board Overstock
  title: Farklı Yapıldı. Dayanacak Şekilde Yapıldı.<br />Dünya Çapında Su Maceralarının Arkasındaki Tahtalar
  subtitle: Sadece bir fabrika değil — dünyadaki aileler, maceraperestler ve kulüpler için premium şişme SUP tahtaları tasarlayan, test eden ve üreten bir kürekçilerin ve mühendislerin ekibi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock üretim kalitesi ve uzmanlığı
pillars:
  tagline: Kalitenin Üç Dirseği
  title: Dünya Çapında Kürekçilerin Paddle Board Overstock'ı Seçme Nedenleri
  subtitle: ''
  columns: 3
  items:
    - title: Ticari Kullanım İçin Tasarlandı
      description: Tahtalarımız yıllarca düzenli kürek çekmeye uygun olarak tasarlanmıştır. Ticari sınıf PVC, güçlendirilmiş drop-stitch çekirdekler, UV stabil malzemeler ve saha testli donanım, düşük bakım ve suda daha uzun ömür anlamına gelir.
      icon: tabler:building-factory
      callToAction:
        text: Ticari ürün serisini görün
        href: /products
    - title: Standartların Ötesinde Test Edildi
      description: Her tahta, fabrikamızdan çıkmadan önce 24-48 saat boyunca nominal basıncının 1.25 katına kadar şişirilir — %100 basınç testi yapılmış, %99,3 kusursuz. Tahtanız suya düşmeden önce dayanıklılığı kanıtlanmıştır.
      icon: tabler:shield-check
      callToAction:
        text: Testlerimizi nasıl yaptığımızı görün
        href: /quality
    - title: Küresel Koşullar İçin İnşa Edildi
      description: 'Ürünler her iklim için optimize edilmiştir: Avrupa için soğuk su PVC formülasyonları, Orta Doğu ve Avustralya için UV-dayanıklı malzemeler, Güneydoğu Asya için nem önleyici işlemler. Her sevkiyat, hedef ortamına uygun şekilde kalibre edilir.'
      icon: tabler:world
