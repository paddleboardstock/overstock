content_challenge:
  tagline: Iššūkis
  title: Jūrų turizmo poreikiai<br />Patikimi, keleiviams paruošti laivai
  subtitle: Turizmo operatoriams reikia laivų, galinčių kasdien pervežti keleivius, kintančias jūros sąlygas ir aukštus svečių lūkesčius – tuo pačiu užtikrinant žemą priežiūrą ir pelningą veiklą.
  paragraphs:
    - Salų turizmo operatoriai tokiose vietose kaip Maldyvai, Filipinai, Indonezija ir Tailandas vykdo kasdienius keleivių pervežimus, nardymo su vamzdeliu ir jūrų ekskursijas. Jų laivai plaukioja 300+ dienų per metus sūriame vandenyje su minimaliu priežiūros prastovų laiku.
    - '**Salos pervežimai** reikalauja greito ir patogaus keleivių pervežimo tarp kurortų, oro uostų ir nardymo vietų. Keleiviai tikisi sklandaus važiavimo, lengvo įlipimo ir apsaugos nuo saulės bei purslų. Lėtas ar nepatogus laivas tiesiogiai veikia svečių pasitenkinimą ir pakartotinius užsakymus.'
    - '**Banginių ir delfinų stebėjimui** operatoriams reikia valčių, kurios galėtų greitai pasiekti laukinę gamtą, palaikyti stabilias stebėjimo platformas ir veikti tyliai, kad netrikdytų jūrų gyvūnijos. Greitis, stabilumas ir manevringumas yra labai svarbūs – keleiviai tikisi artimų susidūrimų be jūros ligos.'
    - '**Nuotykių turizmas** įmonės organizuoja pakrančių tyrinėjimo ekskursijas, urvų ekskursijas ir jūrų laukinės gamtos patirtis. Jų laivai plaukioja įvairiomis aplinkomis – nuo atviro vandenyno iki seklių įlankų – reikalaujančių universalių korpuso konstrukcijų ir patikimos konstrukcijos.'
    - Visuose segmentuose pagrindiniai rūpesčiai yra atsparumas korozijai, kuro efektyvumas ir keleivių komfortas. Valtis, kuri sugenda arba reikalauja dažnų remontų, reiškia prarastas pajamas, atšauktas ekskursijas ir sugadintą reputaciją.
content_solution:
  tagline: Mūsų sprendimas
  title: Turizmo lygis RIBs<br />& Flotilės įranga
  subtitle: Aquafarer tiekia tiek komercinius RIB laivus keleivių pervežimui, tiek laivyno įrangą (SUPsbaidares, pripučiamus laivus) kurortų veiklos programoms – visa tai iš vieno tiekėjo.
  list:
    - Komerciniai keleiviai RIBs nuo 4,8 m iki 8 m – pritaikyti salų pervežimams, nardymo turams ir laukinės gamtos stebėjimui
    - Patogios sėdimos vietos su atlošais ir saulės skėčiu – keleivių komfortas 1–2 valandų ekskursijos metu
    - Platus plotis ir gilus V formos korpusas stabilumui – sumažina jūros ligą ir gerina keleivių pasitikėjimą
    - Ramūs variklių režimai laukinės gamtos stebėjimui – minimalus trikdymas jūrų gyvūnams
    - Nardymo kopėčios ir plaukimo platforma – būtinos nardymo ir plaukimo išvykoms
    - Individualus prekės ženklas ir spalvų schemos — jūsų įmonės logotipas ir laivyno apipavidalinimas ant kiekvieno laivo
    - Didmeninių užsakymų laivyno kainodara RIB — nuoseklios specifikacijos daugialaivių operacijose
    - SUP lentos, baidarės ir pripučiamos valtys kurortinėse svečių veiklos programose
    - Atsarginės dalys ir techninės priežiūros palaikymas – sumažinkite prastovas turistų sezono metu
content_segments:
  tagline: Turizmo segmentai
  title: Jūrų turizmo sprendimai<br />Pagal operacijos tipą
  subtitle: Skirtingos turizmo veiklos reikalauja skirtingų laivų konfigūracijų.Aquafarer Atitinka jūsų RIB konkrečią paraišką.
  items:
    - title: Salų pervežimo operatoriai
      subtitle: Maldyvai, Filipinai, Indonezija, Tailandas — kasdienis svečių transportas
      description: Salų turizmo operatoriai Pietryčių Azijoje ir Maldyvuose kasdien vykdo keleivių pervežimus tarp oro uostų, kurortų ir nardymo vietų – dažnai 300+ dienų per metus. Valtis yra svečių patirties pagrindas. Gedimas reiškia įstrigusius svečius, atšauktus užsakymus ir reputacijos žalą. Šiems operatoriams reikia laivų, kurie išgyventų dažną naudojimą atokiose vietovėse, kur techninė pagalba ribota ir detalių sunku gauti.
      features:
        - Komercinės klasės statyba, skirta 300+ darbo dienų per metus
        - Patogios suoliuko vietos su atlošais 8–16 keleivių
        - T-top arba Bimini saulės skydelis tropinei saulei ir purškalų apsaugai
        - Plati įlaipinimo platforma patogiam svečių priėjimui su bagažu
        - Sausos sandėliavimo vietos svečių krepšiams ir kurorto atsargoms
        - Ekonomiškas 4 taktų išorinis variklis — mažos eksploatacinės sąnaudos vienam reisui
        - Sunkiasvoris Hypalon vamzdis 5–8 metų tarnavimo laiką tropinėse sąlygose
        - Lengvai prižiūrimas dizainas — prieinami komponentai nuotoliniam aptarnavimui
    - title: Banginių stebėjimo operatoriai
      subtitle: Atvira jūra, greitis iki stebėjimo zonų, stabili platforma
      description: Banginių stebėjimas yra sezoninis, bet vertingas turizmo segmentas, veikiantis tokiose vietovėse kaip Hervey Bay (Australija), Kaikoura (Naujoji Zelandija), Baja Kalifornija (Meksika) ir Azorai. Operatoriai turi greitai pasiekti stebėjimo vietas jūroje prieš banginiams nardant ar judant toliau, palaikyti stabilią platformą ilgesniam stebėjimo laikotarpiui ir veikti tyliai, kad netrukdytų jūriniams žinduoliams. Keleivių komfortas 2–4 valandų ekskursijų metu tiesiogiai veikia atsiliepimus ir pakartotinius užsakymus. Lėtas ar nestabilus laivas reiškia praleistus stebėjimus ir grąžintas ekskursijas.
      features:
        - 7–10 m RIB konfigūracijos atviro vandens pajėgumams atviroje jūroje
        - Tylus 4 taktų išorinis variklis — minimalūs triukšmo ir vibracijos trikdžiai
        - Deep-V korpusas su puikiu stabilumu ramybės būsenoje – patogi stebėjimo platforma
        - Priekinė apžvalgos platforma su turėklais svečių fotografijai
        - Pilna apsauga nuo oro sąlygų — T-top arba uždara konsolė jūrinėms sąlygoms
        - Ergonomiškos sėdimos vietos, pritaikytos 2–4 valandų ekskursijos patogumui
        - Jūrinės kokybės medžiagos, skirtos ilgesniam sūraus vandens poveikiui ir UV atsparumui
    - title: Delfinų stebėjimo operatoriai
      subtitle: Greitas persekiojimas, kelių keleivių talpa, tylus priartėjimas
      description: Delfinų stebėjimo operatoriams reikia kitokio gebėjimų balanso. Delfinai yra greitesni ir žaismingesni nei banginiai, todėl jiems reikia valčių, kurios gali greitai įsibėgėti, tiksliai manevruoti ir priartėti prie būrių jų neišgąsdindami. Šios kelionės paprastai veža daugiau keleivių per kelionę ir veikia arčiau kranto. Tylus valdymas yra itin svarbus – delfinai, pripratę prie garsių variklių, vengia valčių, taip sumažindami pastebėjimų sėkmę. Operatoriams taip pat reikia patikimų laivų kasdieniams daugiareisiniams maršrutams turistų sezono metu.
      features:
        - 5,5–8 m RIB – vikrumui, greičiui ir prieigai prie seklaus vandens
        - Greitas pagreitis siekiant aktyvių delfinų būrių
        - Tylus išmetimas ir žemos vibracijos korpusas artimam priartėjimui
        - Stabili platforma lankytojams stebėti ir fotografuoti
        - Didelė keleivių talpa (10–18 asmenų) piko sezono ekskursijoms
        - Priekinė sėdėjimo zona arti vandens delfinų stebėjimui
        - Seklus grimzlė pakrančių ir įlankų operacijoms
    - title: Nuotykiai ir ekoturizmas
      subtitle: Pakrančių tyrinėjimas, urvų ekskursijos, susitikimai su laukine gamta
      description: Nuotykių turizmo operatoriai plaukioja įvairiose aplinkose – atviruose vandenyno kirtimuose, seklių lagūnų tyrinėjimuose, pakrančių urvų prieigose ir susitikimuose su jūrų laukine gamta. Jų laivams reikalingas universalumas, kad jie galėtų atlaikyti įvairias jūros sąlygas, patvarumas atlaikant nuotolinį naudojimą, ir nedidelė grimzlė prieinant prie saugomų įlankų ir paplūdimio prieplaukų. Įrangos patikimumas yra itin svarbus – gedimas atokioje vietoje gali sugadinti ekskursiją ir kelti pavojų svečiams.
      features:
        - Seklus grimzlės korpusas lagūnai, urvams ir paplūdimiui
        - Sustiprintas korpusas ir Hypalon vamzdžiai mišrios aplinkos patvarumui
        - Lanksti sėdėjimo vieta – galima konfigūruoti pagal skirtingus ekskursijų tipus ir grupių dydžius
        - Įrangos tvirtinimo taškai fotografijos ir specializuotai įrangai
        - Lengva išsilaipinimo galimybė paplūdimyje — sustiprinta kilio ir vamzdžio apsauga
        - Apsauga nuo oro sąlygų svečių komfortui ilgesnių ekskursijų metu
    - title: Kurortų veiklos parkai
      subtitle: Pilnos svečių vandens sporto programos — RIBs, SUPs, baidarės, saugumas
      description: Kurortai, siūlantys vandens sportą kaip svečių patirties dalį, turi turėti flotilę, kuri subalansuotų įvairovę, patvarumą ir prekės ženklo pristatymą. Flotilėje paprastai yra laivų svečių RIBs ekskursijoms ir pervežimams, SUPs baidarės savarankiškam tyrinėjimui ir pripučiamos valtys grupinėms nardymo kelionėms. Valdyti mišrios įrangos tipus per sezoninius svečių srautus reikalauja nuoseklios kokybės, lengvos priežiūros ir vieningo prekės ženklo. Sugedusi ar susidėvėjusi įranga tiesiogiai veikia svečių atsiliepimus ir pajamas.
      features:
        - RIB Tenderiai svečių ekskursijoms, pervežimams ir nardymo kelionėms
        - SUP lentos ir baidarės savarankiškoms svečių veikloms
        - Pripučiamos valtys grupinėms ekskursijoms ir nardymui nuo kranto iki rifo
        - Pilnas individualus ženklinimas ant visos įrangos — vieningas kurorto pristatymas
        - 'Saugos įrangos paketas: PFD, švilpukai, pirmoji pagalba, plūdurų lynai'
        - Personalo mokymo medžiaga įrangos tvarkymui ir svečių saugumui
content_benefits:
  tagline: Pagrindinės naudos
  title: Aquafarer Kodėl<br />Jūrų turizmas
  subtitle: Komercinė RIBs ir flotilės įranga, kuria pasitiki turizmo operatoriai 50+ šalių kasdieniam keleivių pervežimui.
  list:
    - Sukurta 300+ darbo dienų per metus — komercinio lygio patvarumas kasdienėms turizmo operacijoms
    - Platus laivų dydžių pasirinkimas (nuo 3,3 m iki 8 m) — vienas tiekėjas visiems jūsų jūros turizmo poreikiams
    - Hypalon arba PVC vamzdinės galimybės — pasirinkite pagal savo eksploatacijos aplinką ir biudžetą
    - Individualus flotilės ženklinimas — vieningas visų laivų ir įrangos vaizdas su jūsų įmonės identitetu
    - Keleivių komforto funkcijos — patogios sėdynės, saulės skydas, lengvas lipimas, stabilus plaukimas
    - 'Greita gamyba: 30–45 dienos standartinėms RIB konfigūracijoms'
    - 'Kiekio kainos flotilės užsakymams: 3+ laivams arba 10+ įrangos vienetų'
cta:
  title: Sukurkite savo turizmo flotilę
  subtitle: Pasakykite apie savo keleivių talpą, maršrutus ir ženklinimo reikalavimus — mes rekomenduosime optimalų RIB konfigūraciją jūsų turizmo verslui.
  actions:
    - variant: primary
      text: Prašyti flotilės kainoraščio
      href: /contact
    - text: Peržiūrėti RIB modelius
      href: /products
