hero:
  tagline: Viešbučiai, kurortai ir svetingumas
  title: Aukščiausios kokybės priekrantės patirtys<br />Skirta viešbučiams, kurortams ir jachtklubams
  subtitle: Pilnai paruošti vandens sporto programos pakrančių viešbučiams, privačių salų kurortams, paplūdimio klubams ir jachtklubams — nuo svečių įrangos ir RIB valtelių iki saugumo sistemų ir personalo mokymo.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock pripučiamos valtys kurorto priekrantės veikloms
direct_answer: Paddle Board Overstock bendradarbiauja su viešbučiais, kurortais, privačiomis salomis, paplūdimio klubais ir jachtklubais visame pasaulyje, kad sukurtų aukščiausios kokybės priekrantės patirtis. Mūsų sprendimai apima SUP nuomos flotiles, vadovaujamus ekskursinius baidarių turus, RIBs valteles svečių transportavimui, mažas prabangias RIBs paplūdimio klubų pervežimams ir pilnas saugumo sistemas. Kiekviena įrangos dalis gali būti paženklinta jūsų objekto logotipu ir spalvų schema. Taip pat teikiame personalo mokymus, programos dizaino konsultacijas ir flotilės keitimo planavimą, kad būtų užtikrinta nuosekli kokybė visais sezonais.
solution_offerings:
  - title: Kurorto standartinis paketas
    subtitle: Mažiems ir vidutinio dydžio objektams (50–150 kambarių)
    badge: Popular
    features:
      - title: Svečių flotilė
        description: 20–50 SUPs ir baidarių su kurorto logotipu ir spalvomis
      - title: Saugumo infrastruktūra
        description: Gelbėtojų bokšteliai, plūduriuojančios linijos, saugumo ženklinimas ir pirmos pagalbos stotys
      - title: Sandėliavimas ir priežiūra
        description: Lentynų sistemos, pripūtimo stotys ir kasdienės patikros sąrašai
      - title: Personalas ir mokymai
        description: Vietoje organizuojamos veiklos personalo orientacijos apie įrangos naudojimą ir svečių saugumą
      - title: Paleidimo palaikymas
        description: Programos vadovas su kainų šablonais, atsakomybės atsisakymo formomis ir veiklos tvarkaraščiais
    cta_text: Sukurkite savo kurorto sprendimą
    cta_href: /contact
  - title: Prabangi kurorto programa
    subtitle: Prabangiems objektams ir didelio masto operacijoms
    badge: Premium
    features:
      - title: Aukščiausios kokybės flotilė
        description: 50–100 + SUPs, baidarių, pedalinių valtelių ir RIBs valtelių su pilnu pritaikymu
      - title: Pažangus saugumas
        description: Gelbėtojų bokštai, radijo sistema, gelbėjimo lenta, AED ir avarinių veiksmų planas
      - title: Svečių patirtis
        description: Registracijos kioskas, įrangos ekspozicija, persirengimo pavėsinės, kranto sandėliavimas
      - title: Pajamų programa
        description: Dinaminės kainos gidas, papildomų pardavimų mokymai, paketo įtraukimo strategijos
      - title: Sezoninis palaikymas
        description: Ne sezono laikymo, sezono pabaigos patikrinimas, užsakymų atnaujinimas
    cta_text: Pagerinkite kurorto patirtį
    cta_href: /contact
