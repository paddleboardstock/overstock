testimonial:
  content: Paddle Board Overstock suprojektavo ir aprūpino visą mūsų paplūdimio veiklos programą trijuose kurorto objektuose. 80 SUPs, 40 baidarių, saugumo infrastruktūra ir personalo mokymai — visa tai pristatyta vienu siuntiniu. Svečių dalyvavimas vandens veiklose padidėjo 60% per pirmą sezoną.
  name: Sophie Laurent
  title: Svečio patirties direktorė, Azure Bay Resorts — Phuketas, Tailandas
content_segments:
  tagline: Kurorto profiliai
  title: Vandens pramogų sprendimai prie vandens<br />Pagal objekto tipą
  subtitle: Kiekvienas kurorto objektas turi unikalų svečių profilį, veiklų derinį ir operacinį ritmą — nuo boutique ekolodžų iki didelių prabangių paplūdimio kurortų. Mes kuriame vandens sporto programas, atitinkančias objekto klasę ir svečių lūkesčius.
  items:
    - title: Prabangūs kurortai prie paplūdimio
      subtitle: VIP pervežimai, vandens veiklos, aukščiausios klasės svečių patirtis
      description: Aukštos klasės paplūdimio objektai — Four Seasons, Aman ir panašios prabangios grupės — kur vandens sportas yra pagrindinė svečių pasitenkinimo ir papildomų pajamų priemonė. Flotilė turi atrodyti prabangiai, siūlyti įvairovę įvairių amžiaus grupių ir gebėjimų lygio svečiams bei sklandžiai integruotis su kurorto esamomis konsjeržo ir užsakymų sistemomis. Svečių estetiniai lūkesčiai yra labai aukšti — įrangos būklė ir pateikimas tiesiogiai veikia 5 žvaigždučių atsiliepimus.
      features:
        - 'Premium prekinio ženklo flotilė: SUPs, baidarės, pedalų valtys ir mažos RIB pagalbinės valtys'
        - 'Svečiams paruoštas pateikimas: derinamos su kurorto spalvomis, logotipo ženklinimas, eksponuojama įranga'
        - Maži prabangūs RIB VIP svečių pervežimams su pritaikytomis apmušalų medžiagomis ir spalvų derinimu
        - 'Integruota saugumo infrastruktūra: plūdės linijos, gelbėtojų stotys, AED'
        - 'Pajamų valdymas: dinaminio kainodaros šablonai, papildomų paslaugų mokymai, paketinis įpakavimas'
    - title: Privatūs salų kurortai
      subtitle: Visų oro sąlygų svečių transportas – nulis prastovų, absoliutus patikimumas
      description: Privatūs salų kurortai veikia atokiose vietovėse, kur laivas yra vienintelis ryšys su žemynu. Kasdieniai svečių pervežimai, tiekimo reisai ir skubios medicininės evakuacijos priklauso nuo vieno laivo – bet koks prastovos laikotarpis tiesiogiai veikia svečių patirtį ir kurorto veiklą. Šiems operatoriams reikia laivo, kuris patikimai plauktų bet kokiomis oro sąlygomis, reikalautų minimalios priežiūros ir turėtų atsargines sistemas misijai kritiškai svarbiam patikimumui. Laivas taip pat turi atrodyti puikiai atvykstant svečiams į salą.
      features:
        - Visų oro sąlygų RIB konfigūracija su pilnu oro sąlygų korpusu ir tvirtais vamzdžiais
        - Dviejų variklių arba atsarginių variklių aprūpinimas nulio prastovų veikimui
        - Komercinės klasės Hypalon statyba 5–8 metų nuotoliniam naudojimui
        - Lengvai prižiūrimas dizainas su prieinamais komponentais aptarnavimui vietoje
        - Individualus kurorto prekės ženklas ir aukščiausios kokybės apmušalai, derantys su salos estetika
    - title: Ežero pakrantės ir ekologiški kurortai
      subtitle: Gamtoje integruotos svečių patirtys
      description: Ežero pakrantės objektai, eko-nameliai ir gamtos poilsio vietos siūlo ramias, mažo poveikio vandens veiklas, kurios papildo natūralią aplinką. Įranga turėtų būti nevaroma, kur įmanoma, lengvai laikoma ribotos vietos valčių nameliuose ir tyli naudojimo metu, kad visiems svečiams būtų išlaikyta aplinkos atmosfera.
      features:
        - 'Nemotorinė flotilė: SUPs, baidarės, kanojos ir irklinės valtys'
        - Tylios elektrinės siurblių pripūtimo stotys pagal poreikį svečiams
        - Ekologiškos medžiagos ir pakuotės, atitinkančios tvarumo prekės ženklą
        - Sandėliavimo lentynos ir valčių namelių organizavimo sistemos buvo įtrauktos
    - title: Paplūdimio klubai
      subtitle: Svečių pervežimai, pramogos, nedidelis prabangumas RIBs
      description: Paplūdimio klubai veikia energingoje, vizualiai orientuotoje aplinkoje, kur įranga yra atmosferos dalis. Jiems reikia nedidelės prabangos RIBs svečių pervežimui iš netoliese esančių viešbučių ar prieplaukų, o vandens žaislų – vandens motociklų vilkimui, pripučiamoms čiuožykloms ir irklentėms. Flotilė turi atrodyti stilingai, lengvai valdoma ir atlaikyti kasdienį naudojimą svečių, turinčių skirtingus įgūdžių lygius. Laikymas ir greitas išdėstymas yra itin svarbūs piko valandomis.
      features:
        - Kompaktiška prabanga RIB (3,3–4,3 m) keleivių pervežimui ir tenderio aptarnavimui
        - 'Vandens žaislai: tempiami pripučiami žaislai, SUP lentos, baidarės svečių pramogai'
        - Individuali spalva ir prekės ženklas atitinka paplūdimio klubo vizualinį identitetą
        - Greito paleidimo ir paėmimo sistemos didelės apyvartos operacijoms
        - Patvari Hypalon konstrukcija kasdieniam sūraus vandens poveikiui ir UV
    - title: Privatūs narių klubai ir jachtklubai
      subtitle: Uosto transportas, narių konkursai, išskirtiniai vandens sportai
      description: Privatūs klubai, kuriuose vandens sportas ir laivų transportas yra narių nauda, o ne pajamų šaltinis. Įranga turi atitikti aukštesnius estetinius standartus, būti prieinama nariams pagal poreikį ir reikalauti minimalios darbuotojų priežiūros. Marina jachtklubai ypač reikalingi uosto transporto tenderiams – narių perkėlimui tarp prieplaukos, prieplaukos ir kranto. Laikymas ir priežiūra turėtų būti nematomi nariams.
      features:
        - Aukštos klasės RIB uosto transporto ir narių perdavimo paslaugos konkursai
        - 'Premium įranga: EVA lentos, individualios narių spalvos, firminė apdaila'
        - Savitarnos atsiskaitymo sistema narių prieigai be personalo
        - Ne sezono saugojimo ir metinio atnaujinimo programa
    - title: Nuotykių ir veiklų viešbučiai
      subtitle: Ekskursijos su gidu, SUP joga, nardymo su vamzdeliu išvykos, grupinės veiklos
      description: Nuosavybės, kurios save pozicionuoja kaip nuotykių vietas – siūlančios ekskursijas su gidu, SUP jogą, saulėlydžio plaukimus, nardymo su vamzdeliu išvykas ir grupines veiklas. Laivynas turi palaikyti tiek savarankiško nuomos, tiek su gidu vykdomų programų modelius, su įranga, kuri lengvai pereina nuo svečių savarankiško naudojimo prie instruktorų vedamų turų. Šioms nuosavybėms reikia patvarios įrangos, tinkamos dažnam naudojimui, su paprastu valymu tarp svečių grupių.
      features:
        - Universalus mišrus laivynas, palaikantis nuomos + ir su gidu vykdomų turų modelius
        - Tandeminiai baidarės ir ypač stabilios SUP platformos grupinėms veikloms
        - 'Gido įranga: instruktoriaus lentos, sandarios dėžės, vandeniui atsparūs komunikacijos įrenginiai'
        - 'Sezoninė įrangos rotacija: vasaros laivynas → žiemos saugojimo programa'
        - Patvari konstrukcija, skirta kasdieniam svečių naudojimui su minimalia priežiūra
