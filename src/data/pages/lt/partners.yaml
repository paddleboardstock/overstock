hero:
  tagline: Partneriai ir platinimas
  title: Tapskite Paddle Board Overstock partneriu<br />— Tarptautinė platinimo tinklas
  subtitle: Prisijunkite prie Paddle Board Overstock pasaulinio partnerių tinklo. Bendradarbiaujame su jūrų prekių platintojais, valtinių pardavėjais, įrangos mažmenininkais ir prekės ženklų partneriais 50+ šalių.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstock pasaulinis partnerių ir platintojų tinklas
content_programs:
  tagline: Partnerių programos
  title: Partnerių programos<br />Kuriama augimui
  subtitle: Nesvarbu, ar esate platintojas, pardavėjas, ar prekės ženklo partneris, Paddle Board Overstock siūlo programas, sukurtas jūsų verslui palaikyti.
  columns: 3
  items:
    - title: Platintojų programa
      description: Išskirtinė teritorijos platinimo galimybė su kiekybės kainodara, marketingo pagalba ir tiesiogine prieiga prie gamyklos. Reikalingas minimalus įsipareigojimas, priklausomai nuo teritorijos dydžio.
      icon: tabler:world
    - title: Pardavėjų programa
      description: Tiesioginės pardavėjo kainos, produktų mokymai, marketingo medžiaga ir garantijos palaikymas mažmeninėse parduotuvėse ir internetinėse parduotuvėse.
      icon: tabler:building-store
    - title: OEM/ODM partnerystė
      description: Pilno aptarnavimo OEM ir ODM gamyba su individualiu ženklinimu, pakavimu ir produkto specifikacijomis. Nuo idėjos iki konteinerio.
      icon: tabler:certificate
    - title: Prekės ženklo partnerystė
      description: Bendras ženklinimas, privatus ženklas ir išskirtinių modelių programos žinomiems prekės ženklams jūrų ir lauko poilsio srityje.
      icon: tabler:stars
    - title: Vyriausybinė ir institucinė
      description: Pageidaujamos tiekėjų programos vyriausybinėms agentūroms, pakrančių apsaugai, kariuomenei ir humanitarinėms organizacijoms. Dokumentacija parengta konkursams.
      icon: tabler:building-community
    - title: Kurortų ir nuomojamų paslaugų partneris
      description: Flotilės kainodara, nuolatinė kokybė ir individualus ženklinimas kurortams, nardymo centrams ir nuomos operacijoms visame pasaulyje.
      icon: tabler:sun
content_benefits:
  tagline: Kodėl verta tapti partneriu
  title: Kodėl partneriai renkasi Paddle Board Overstock
  subtitle: Mūsų partneriai gauna realias gamybos galimybes, pastovią kokybę ir greitą pagalbą.
  list:
    - 'Tiesioginė prieiga prie gamyklos: Dirbkite tiesiogiai su mūsų gamybos komanda — be tarpininkų. Gaukite greitesnius atsakymus, geresnes kainas ir visišką gamybos matomumą.'
    - 'Paruošta pritaikymui: Ženklinkite savo produktus pasirinktomis spalvomis, logotipais, pakavimu ir specifikacijomis. Minimalūs užsakymų kiekiai pritaikyti jūsų rinkai.'
    - 'Kokybė garantuota: ISO 9001 sertifikuota gamyba su CE, UKCA ir BSCI atitiktimis. Kiekvienas produktas išbandomas prieš išsiunčiant.'
    - 'Tarptautinė logistika: Siuntimas iš Qingdao, Kinijos su FOB, CIF ir DDP pasirinkimais. JAV sandėlis MontClaire, Kalifornija, Šiaurės Amerikos platinimui.'
    - 'Marketingo pagalba: Produktų katalogai, fotografija, techninė dokumentacija ir skaitmeninė medžiaga, palaikanti jūsų pardavimus.'
    - 'Mokymai ir pagalba: Produktų mokymai jūsų pardavimo komandai, techninė pagalba jūsų klientams ir garantinio aptarnavimo koordinavimas.'
content_process:
  tagline: Kaip tapti partneriu
  title: Paprastas partnerystės procesas
  subtitle: Mūsų partnerystės procesas yra paprastas – sukurtas, kad galėtumėte greitai pradėti parduoti Paddle Board Overstock produktus.
  items:
    - title: '1 žingsnis: Pateikite paraišką'
      description: Užpildykite mūsų partnerių paraiškos formą su jūsų įmonės profiliu, tiksliniais rinkos segmentais ir produktų interesais.
    - title: '2 žingsnis: Kvalifikacijos peržiūra'
      description: Mūsų partnerystės komanda peržiūri jūsų paraišką ir per 3 darbo dienas susisiekia su jumis, kad aptartų galimybes.
    - title: '3 žingsnis: Susitarimas ir nustatymas'
      description: Pasirašykite partnerystės sutartį, sukurkite savo paskyrą ir gaukite partnerių kainodarą, rinkodaros medžiagą bei produktų pavyzdžius.
    - title: '4 žingsnis: Mokymai ir paleidimas'
      description: Teikiami produktų mokymai, pardavimų palaikymas ir rinkodaros medžiaga. Jūs esate pasiruošę pradėti pardavinėti.
cta:
  title: Pasiruošę tapti Paddle Board Overstock partneriu?
  subtitle: Prašome pateikti paraišką dėl partnerystės, ir mūsų komanda atsakys per 3 darbo dienas.
  actions:
    - variant: primary
      text: Pateikti paraišką dėl partnerystės
      href: /contact
    - text: Peržiūrėti mūsų produktus
      href: /products
