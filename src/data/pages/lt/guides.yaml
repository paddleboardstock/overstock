hero:
  tagline: Vadovai
  title: Pirmą kartą naudojate SUP?
  subtitle: Praktiniai vadovai, padėsiantys pasirinkti, naudoti ir mėgautis pripučiamą vandens sporto įrangą.
size_guide:
  tagline: Dydis ir specifikacijos
  title: Raskite tinkamą dydį savo poreikiams
  desc: Palyginkite produkto matmenis, svorio talpą ir rekomenduojamą naudojimą. Nesvarbu, ar jums reikia turistinio SUP, kompaktiško kajako, ar komercinio RIB — mūsų dydžių gidas padeda pasirinkti tinkamą variantą.
  link_label: Pilnas dydžių gidas su produkto specifikacijomis →
  link: /size-guide
  cards:
    - title: SUP Lentos
      desc: Pasirinkite ilgį pagal savo svorį ir numatytą naudojimą. Platesnės lentos (32"+) siūlo daugiau stabilumo. Ilgesnės lentos (11–12 pėdų) geriau kryptingai juda turistinėse kelionėse.
    - title: Baidarės
      desc: Vienvietės kajakai (9 pėd.) solo kelionėms ir upėms. Dvivietės kajakai (12 pėd.) dviem irkluotojams arba vienam su įranga. Visada tikrinkite svorio talpą.
    - title: Valtys ir RIBs
      desc: Pasirinkite ilgį pagal keleivių skaičių ir naudojimą. Didžiosios RIBs (4,5 m+) skirtos jūroje ir gelbėjimui. Mažesnės valtys (2,7 m) kaip pernešimo priemonės ir žvejybos platformos.
