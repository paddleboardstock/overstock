hero:
  tagline: CE & RCD Atitiktis
  title: RIB Laivo CE Atitiktis<br />& Techninė dokumentacija
  subtitle: Aquafarer RIB laivai ir pripučiami vandens transporto priemonės yra suprojektuoti ir dokumentuoti pagal ES rinkos atitiktį pagal Laisvalaikio laivų direktyvą 2013/53/ES. Nuo rizikos vertinimo iki Atitikties deklaracijos mes teikiame modeliui specifinę atitikties dokumentaciją kiekvienam korpusui.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: RIB Laivo CE atitikties dokumentacija ir sertifikavimas
direct_answer: Aquafarer teikia modeliui specifinę RCD 2013/53/ES atitikties dokumentaciją RIB laivams ir pripučiamiems vandens transporto priemonėms, įskaitant techninius failus, Atitikties deklaracijas, statytojo lenteles ir savininko vadovus – viskas suderinta su EN ISO 6185, ISO 12217 ir taikomais suderintais standartais.
