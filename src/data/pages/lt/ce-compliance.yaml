content_scope:
  tagline: Atitikties apimtis
  title: Kuriems produktams reikia<br />RCD atitikties?
  subtitle: Laisvalaikio laivų direktyva 2013/53/ES taikoma laivams, kurių korpuso ilgis nuo 2,5 m iki 24 m. Pirmas žingsnis siekiant atitikties yra apimties supratimas.
  items:
    - title: RIB Laivai (2,5–24 m)
      description: Kietojo korpuso pripučiami laivai, kurių ilgis nuo 2,5 m iki 24 m, patenka į RCD. Dizaino kategorijos nuo A iki D taikomos priklausomai nuo numatytų jūrų sąlygų ir didžiausios vėjo jėgos.
      icon: tabler:sailboat
    - title: Pripučiami laivai (mažesni nei 2,5 m)
      description: Maži pripučiami laivai ir kateriai, trumpesni nei 2,5 m, gali būti iš dalies atleisti nuo RCD, tačiau vis tiek reikalauja CE ženklinimo pagal kitas taikomas direktyvas ir EN ISO 6185 konstrukcijos standartus.
      icon: tabler:sailboat
    - title: SUP Lentutės ir priedai
      description: Stovimos irklentės (SUP) nepatenka į RCD apimtį. Tačiau susijusios asmeninės plūdrumo priemonės (PFD) reikalauja CE ženklinimo pagal asmeninės apsaugos priemonių reglamentą (ES) 2016/425 su USCG III/V tipo patvirtinimu, kur tai taikoma.
      icon: tabler:swimming
    - title: Iš dalies baigti laivai
      description: Laivai, tiekiami be variklio ar specifinių įrengimų, reikalauja Statytojo deklaracijos dėl iš dalies baigto laivo, o pilna RCD atitiktis turi būti įgyvendinta galutinio statytojo ar importuotojo.
      icon: tabler:tool
content_trust_layers:
  tagline: Trijų sluoksnių patikimumo sistema
  title: Atitikties informacija<br />— Dalijamasi tinkamu lygiu
  subtitle: Ne visi atitikties duomenys turi būti viešai skelbiami internete. Mes naudojame trijų sluoksnių požiūrį, kuris apsaugo intelektinę nuosavybę ir tuo pačiu didina pirkėjų pasitikėjimą.
  items:
    - title: Sluoksnis 1 — Viešasis tinklalapis
      description: Nuorodos į standartus, paaiškintos atitikties priemonės, išvardyti dokumentų tipai, sertifikavimo apimtis pagal modelių šeimą. Nėra tikrų sertifikatų, bandymų duomenų ar patentuotų inžinerinių detalių.
      icon: tabler:world
    - title: 2 sluoksnis — Bendrinimas po užklausos
      description: 'Po kvalifikuoto tyrimo: pateiktas redaguotas DoC pavyzdys, statytojo plokštelės nuotrauka, taikomų standartų sąrašas, atitikties kontrolinis sąrašas ir medžiagų sertifikavimo santraukos — pasidalinta pagal sąžiningo naudojimo taisykles.'
      icon: tabler:mail
    - title: 3 sluoksnis — NDA / Užsakymo etapas
      description: Pilnas techninis failas, rizikos vertinimai, stabilumo skaičiavimai, bandymų ataskaitos, medžiagų partijų įrašai ir gamybos sekamumo dokumentacija — dalijamasi tik pagal NDA su patvirtintais pirkėjais.
      icon: tabler:lock
content_standards:
  tagline: Taikomi standartai
  title: ISO ir EN standartai<br />Mes statome iki
  subtitle: Mūsų produktai yra sukurti ir išbandyti pagal suderintus standartus pagal RCD. Nurodomi standartų numeriai ir pavadinimai; visos standartų pilnos versijos lieka ISO autorių teisių saugomos.
  items:
    - title: LT ISO 6185-3
      description: 'Pripučiami laivai — 3 dalis: Laivai, kurių maksimalios variklio galios yra 15 kW ar daugiau. Konstrukcijos, stabilumo, plūdrumo ir žmogaus į vandens įkritimą atsigavimo reikalavimai RIBs.'
      icon: tabler:file-text
    - title: LT ISO 6185-4
      description: 'Pripučiamieji laivai — 4 dalis: Laivai su maksimalia variklio galia 15 kW ir didesne arba lygi 4,5 kW. Papildomi konstrukciniai ir stabilumo reikalavimai.'
      icon: tabler:file-text
    - title: ISO 12215 Serija
      description: Mažosios valtys — Korpuso konstrukcija ir matmenys. Korpuso, denio ir pertvarų konstruktorius stiklo pluošto ir aliuminio RIB korpusams.
      icon: tabler:ruler-2
    - title: LT ISO 10240
      description: Mažos valtys — Savininko vadovas. Privalomas turinys ir formatas savininko vadovui, kuris pristatomas su kiekviena RIB valtimi ES.
      icon: tabler:book
    - title: LT ISO 14945
      description: Mažosios valtys — Statytojo plokštelė. Informacija turi būti pažymėta ant statytojo plokštelės, nuolat pritvirtintos prie kiekvienos valties.
      icon: tabler:badge
    - title: ISO 8666
      description: Mažoji laivyba — Pagrindiniai duomenys. Standartizuoti matavimai ir parametrai, užtikrinantys vienodą specifikaciją visuose produkto dokumentuose.
      icon: tabler:dimensions
content_process:
  tagline: Atitikties procesas
  title: 6 žingsnių CE atitiktis<br />Darbo eiga
  subtitle: Nuo projekto apimties iki serijinio lygio sekamumo — kiekvienas RIB modelis laikosi nustatyto atitikties kelio.
  steps:
    - number: '01'
      title: Projekto apimtis ir klasifikacija
      description: Apibrėžti RIB modelį, projektavimo kategoriją (A/B/C/D), maksimalų dalyvių skaičių, naudingąją apkrovą, variklio galią ir tikslinę rinką. Nustatyti, ar RCD tai taikoma ir kuris atitikties vertinimo modulis reikalingas.
      timeline: 2–3 dienos
    - number: '02'
      title: Taikomų reikalavimų identifikavimas
      description: Nustatyti visus taikomus esminius saugos reikalavimus iš RCD I priedo, atitinkamų harmonizuotų standartų (EN ISO 6185, 12215, 10240, 14945) ir bet kokių papildomų nacionalinių reikalavimų tikslinei rinkai.
      timeline: 3–5 dienos
    - number: '03'
      title: Dizainas ir techninė dokumentacija
      description: 'Sukurkite pagrindinį techninį failą: bendruosius išdėstymo brėžinius, stabilumo ir plūdrumo skaičiavimus, rizikos vertinimą, medžiagų specifikacijas ir sistemų saugos analizę (kuras, elektra, vairavimas).'
      timeline: 10–15 dienų
    - number: '04'
      title: Produktų patikra ir testavimas
      description: Atlikti fizinę patikrą – slėgio bandymus esant 1,25 karto didesniam nei nominaliam slėgiui 24–48 valandas, stabilumo ir plūdrumo testus, apkrovos bandymus ir sistemų paleidimą. Fiksuoti visus bandymų rezultatus kiekvienam korpusui.
      timeline: 5–7 dienos
    - number: '05'
      title: Žymėjimo ir pristatymo dokumentacija
      description: Priesagos CE žymėjimas, gamintojo plokštė (EN ISO 14945) ir HIN/CIN (korpuso identifikacinis numeris). Paruoškite ES atitikties deklaraciją, savininko vadovą (EN ISO 10240) ir atitikties kontrolinį sąrašą.
      timeline: 2–3 dienos
    - number: '06'
      title: Serijinio lygio sekamumas
      description: Kiekvienas korpusas gauna unikalų korpuso įrašą, susiejantį jį su pagrindiniu techniniu failu, gamybos partija, medžiagų sertifikatais, bandymų rezultatais ir galutine konfigūracija. Įrašai saugomi 10+ metų už RCD.
      timeline: Tęsinys
content_document_cards:
  tagline: Dokumentų tipai
  title: Atitikties dokumentas<br />Kortos
  subtitle: Tai yra dokumentų tipai, kuriuos ruošiame ir prižiūrime kiekvienam CEsertifikuotam RIB modeliui. Pavyzdžiai prieinami pagal kvalifikuotą užklausą.
  items:
    - title: CE / RCD Atitikties sertifikatas
      description: Modeliui specifinis sertifikatas, patvirtinantis, kad laivas atitinka visus taikomus RCD 2013/53/ES esminius saugos reikalavimus, išduodamas gamintojo, prireikus įtraukiant informuotą instituciją.
      icon: tabler:certificate
    - title: ES atitikties deklaracija (DoC)
      description: Gamintojo arba įgalioto atstovo pasirašyta deklaracija, kurioje išvardytos taikomos direktyvos, standartai, atitikties modulis ir informuotos institucijos duomenys. Reikalaujama kiekvienam modeliui, pateikiamam ES rinkai.
      icon: tabler:file-check
    - title: Gamintojo plokštė (EN ISO 14945)
      description: Nuolat pritvirtinta plokštelė, rodanti maksimalų žmonių skaičių, didžiausią variklio galią, dizaino kategoriją ir gamintojo identifikaciją. Turi išlikti įskaitoma visą laivo eksploatavimo laiką.
      icon: tabler:badge
    - title: Naudotojo vadovas (EN ISO 10240)
      description: Išsamus vadovas, apimantis saugų eksploatavimą, avarines procedūras, priežiūros grafikus ir saugos įspėjimus. Privalomas kiekvienam RIB , pristatytam ES.
      icon: tabler:book
    - title: ISO Testavimo ir inspekcijos ataskaitos
      description: Slėgio bandymų įrašai (1,25x / 24–48 val.), stabilumo ir plūdrumo bandymų rezultatai, medžiagų bandymų sertifikatai ir matmenų patikros ataskaitos – visa tai susieta su konkrečiais korpuso numeriais.
      icon: tabler:test-pipe
    - title: Medžiagos atsekamumo įrašai
      description: Partijų lygio atsekamumas vamzdelių audiniui, klijams, stiklo pluoštui ir furnitūrai. Susieja kiekvieną gamybos vienetą su gaunamomis medžiagų sertifikatais ir IQC patikros rezultatais.
      icon: tabler:link
    - title: Kokybės patikra ir kokybės kontrolės įrašai
      description: 100 taškų kokybės kontrolinis sąrašas vienetui, kokybės kontrolės įrašai procese, neatitikimo ataskaitos ir korekciniai veiksmai. Gamybos sekamumo grandinės dalis.
      icon: tabler:clipboard-check
    - title: Projekto dokumentų paketas
      description: Kiekvieno korpuso dokumentacijos paketas, įskaitant galutinį konfigūracijos įrašą, variklio ir įrangos montavimo detales, priėmimo į tarnybą kontrolinį sąrašą ir pristatymo dokumentus.
      icon: tabler:package
content_design_categories:
  tagline: RCD dizaino kategorijos
  title: Dizaino kategorijos A–D<br />— Ką jie reiškia
  subtitle: Jis RCD priskiria projektavimo kategorijas pagal maksimalų vėjo stiprumą ir reikšmingą bangų aukštį, kurį laivas turi atlaikyti.
  items:
    - title: A kategorija — vandenynas
      description: Skirta ilgesnėms kelionėms, kai vėjo jėga gali viršyti Beaufort 8 (>40 mazgų) ir reikšmingas bangų aukštis gali viršyti 4 m. Reikalauja griežčiausios konstrukcinės ir stabilumo patikros.
      icon: tabler:ripple
    - title: B kategorija — jūrinė veikla
      description: Sukurta jūrinėms kelionėms su vėjo jėga iki Beaufort 8 (≤40 mazgų) ir reikšmingu bangų aukščiu iki 4 m. Tinkama pakrantės ir pusiau atviriems vandenims.
      icon: tabler:anchor
    - title: C kategorija — Inshore
      description: Sukurta pakrantės kelionėms su vėjo jėga iki Beaufort 6 (≤27 mazgai) ir reikšmingu bangų aukščiu iki 2 m. Dauguma rekreacinių RIBs patenka į šią kategoriją.
      icon: tabler:sun
    - title: D kategorija — Apsaugota
      description: Sukurta apsaugotiems vandenims su vėjo jėga iki Beaufort 4 (≤16 mazgų) ir reikšmingu bangų aukščiu iki 0,3 m. Ežerai, upės ir saugomi uostai.
      icon: tabler:pool
content_hin:
  tagline: Laivo identifikavimas
  title: HIN / CIN ir statytojo plokštelė
  subtitle: Kiekvienam RIB laivui pagal EN ISO 14945 ir reikalavimus reikia korpuso identifikacijos numerio (HIN) arba laivo identifikacinio numerio (CIN) ir statytojo numerio RCD .
  items:
    - title: Korpuso identifikacinis numeris (HIN)
      description: Unikalus 14 simbolių kodas, nuolat pažymėtas dešinėje borto pusėje, koduojantis gamintojo kodą (MIC), modelio metus, gamybos metus ir serijos numerį. Reikalingas įėjimui į ES rinką.
      icon: tabler:hash
    - title: Laivo identifikacinis numeris (CIN)
      description: Pagal EN ISO 10087 – paslėptą antrinį identifikacinį numerį, patalpintą paslėptoje vietoje dėl apsaugos nuo vagystės ir atsekamumo.
      icon: tabler:eye-off
    - title: Statybininko plokštės turinys
      description: Didžiausias žmonių skaičius, didžiausia variklio galia (kW), maksimalus krovinys (kg), dizaino kategorija, gamintojo pavadinimas ir CE žymė – visa tai nuolat rodoma korozijai atsparioje plokštėje.
      icon: tabler:badge
content_tech_file:
  tagline: Techninė failo struktūra
  title: Pagrindinis techninis failas<br />& Hull rekordas
  subtitle: 'Mūsų dokumentacijos sistema turi dviejų lygių struktūrą: pagrindinę techninę bylą kiekvienai modelių šeimai ir individualius korpuso įrašus kiekvienam pagamintam laivui.'
  items:
    - title: Pagrindinis techninis failas
      description: 'Apima visą modelių šeimos atitikties dokumentaciją: bendrą išdėstymą, rizikos vertinimą, stabilumo/plūdrumo skaičiavimus, medžiagų specifikacijas, taikomus standartus ir atitikties vertinimo įrašus. Saugoma 10+ metų.'
      icon: tabler:folder
    - title: Korpuso įrašas (sekamumas vienam laivui)
      description: 'Kiekvienas korpusas turi unikalų įrašą, jungiantį jį su pagrindiniu techniniu failu: HIN, gamybos data, vamzdžio partija, medžiagų sertifikatai, slėgio bandymų rezultatas, galutinė konfigūracija, variklio įrengimas ir pristatymo vieta.'
      icon: tabler:file-description
    - title: Klientų atitikties paketas
      description: Kiekvieno korpuso pristatymo paketas, įskaitant DoC, gamintojo plokštės nuotrauką, naudotojo vadovą, bandymų santrauką ir galutinės konfigūracijos lapą – pateikiamas kartu su kiekvienu RIB išsiųstu į ES.
      icon: tabler:package
content_material_cert:
  tagline: Medžiagų sertifikavimas
  title: Medžiagos atsekamumas &<br />Sertifikavimo įrodymai
  subtitle: Kokybiški RIB laivai prasideda nuo kontroliuojamų medžiagų ir dokumentuotų procesų. Žemiau pateikiame, kaip organizuojame medžiagų sertifikavimą kiekvienai kritinei komponentų grupei.
  items:
    - title: Pripučiamų vamzdelių medžiagos atsekamumas
      description: PVC ir CSM/Hypalon vamzdžių medžiagos parenkamos pagal numatytą naudojimą, klimato sąlygas ir tikslinę rinką. Tiekėjų techniniai duomenys (TDS), medžiagų partijų informacija, audinio partijų atsekamumas, UV senėjimo testų ataskaitos ir REACH/SVHC deklaracijos yra prieinamos sutartoje projekto dokumentacijos apimtyje.
      icon: tabler:circle
    - title: Jūrinio aliuminio atsekamumas
      description: Aliuminio korpuso RIB projektams lydinio kokybė, storis ir medžiagų partijos yra kontroliuojamos pagal patvirtintą specifikaciją. Medžiagų bandymų sertifikatai (MTC/MTR), EN 10204 3.1 dokumentacija, cheminės sudėties ir mechaninių savybių ataskaitos bei šilumos/lotų sekamumas pateikiami ten, kur sutarta.
      icon: tabler:rectangle
    - title: GRP korpuso medžiagų ir procesų valdymas
      description: Stiklo pluošto korpusui RIBsgelcoat, derva, stiklo pluošto armavimas ir šerdies medžiagos valdomos pagal kontroliuojamas specifikacijas. Medžiagų TDS/SDS, partijų įrašai, laminato specifikacijos bei kietinimo ir dirbtuvių valdymo įrašai yra prieinami pagal projekto sutartį.
      icon: tabler:layers-subtract
    - title: Komponentų dokumentacijos palaikymas
      description: Pasirinktiems komponentams – įskaitant EVA terasos medžiagas, sėdimas vietas, nerūdijančio plieno furnitūrą, kuro sistemas, elektros įrangą ir jūrinius priedus – tiekėjų dokumentacija koordinuojama pagal galutinę konfigūraciją ir paskirties rinkos reikalavimus.
      icon: tabler:package
    - title: Atitikties apimties pranešimas
      description: Sertifikatai, testavimo ataskaitos ir atitikties dokumentai taikomi tik konkrečiam produkto modeliui, medžiagai, komponentui, gamybos partijai ar projekto apimčiai, nurodytam atitinkamame dokumente. Susisiekite su mumis su savo tiksline rinka, numatomu naudojimu ir techniniais reikalavimais, kad prieš pateikiant užsakymą būtų galima patvirtinti atitinkamą dokumentų paketą.
      icon: tabler:info-circle
faq:
  title: CE Atitiktis — Dažniausiai užduodami klausimai
  questions:
    - q: Ar visi Aquafarer RIB laivai yra CE sertifikuoti ES rinkai?
      a: RIB mūsų kataloge esantys laivai yra suprojektuoti ir dokumentuoti pagal RCD 2013/53/ES atitiktį pagal taikomas ES direktyvas.CE Žymėjimas taikomas pagal modelį ir konfigūraciją. Susisiekite su mumis dėl modelio specifinio atitikties apimties dokumento.
    - q: Kuo skiriasi RCD atitiktis ir CE žymėjimas?
      a: RCD (Rekreacinių amatų direktyva 2013/53/ES) yra ES teisės aktas, nustatantis esminius saugos reikalavimus.CE Žymėjimas yra vizualus simbolis, dedamas ant produkto, kuris buvo įvertintas ir patvirtintas atitinkantis šiuos reikalavimus. Produktas turi atitikti reikalavimus, RCD kad galėtų nešioti CE ženklą.
    - q: Ar kiekvienam laivui pateikiate atitikties deklaracijas?
      a: Taip. Kiekvienas RIB laivas, pristatytas ES rinkai, apima modeliui būdingą ES atitikties deklaraciją, kurioje išvardytos taikomos direktyvos, harmonizuoti standartai, atitikties vertinimo modulis ir informuotų institucijų duomenys.
    - q: Kokį atitikties vertinimo modulį Aquafarer naudojate?
      a: Modulis priklauso nuo projektavimo kategorijos ir laivo tipo. Dauguma RIB C projektavimo kategorijos modelių naudoja A modulį (vidinė gamybos kontrolė). A/B klasės laivams ar specifinėms konfigūracijoms+gali būti taikomi B, C arba B D moduliai,+jei dalyvauja informuota institucija. Patariame dėl tinkamo modulio kiekvienam projektui.
    - q: Ar galite pasidalinti atitikties dokumentais prieš pateikdami užsakymą?
      a: Po kvalifikuoto užklausos pateikiame atitikties apimties dokumentą, kuriame nurodyti taikomi standartai, atitikties maršrutas ir dokumentų tipai, prieinami jūsų vertinamam modeliui. Pilni techniniai failai dalijami NDA po užsakymo patvirtinimo.
    - q: Kas yra korpuso identifikavimo numeris (HIN) ir ar jis įtrauktas?
      a: HIN yra 14 simbolių unikalus identifikatorius, nuolat pažymėtas ant kiekvieno laivo, koduojantis gamintojo kodą (MIC), modelio žymėjimą, gamybos metus ir serijos numerį. Jis privalomas visiems RIB laivams, įtrauktiems į ES rinką, ir įtrauktas į kiekvieną Aquafarer RIB.
    - q: Kiek laiko saugomi techniniai failai?
      a: Pagal RCD 2013/53/ES reikalavimus gamintojas turi saugoti techninį failą ne vėliau kaip 10 metų nuo paskutinės produkto pateikimo į rinką datos.Aquafarer Turi pilną techninę dokumentaciją visiems pagamintiems modeliams.
    - q: Ar padedate vykdyti importuotojų įsipareigojimus pagal RCD?
      a: 'Taip. Mes pateikiame dokumentų paketą, kurio ES importuotojams reikia savo pareigoms įvykdyti: techninę prieigą prie failų, DoC, gamintojo numerį, savininko vadovą ir produktų atsekamumo įrašus. Importuotojo atsakomybės pagal juos RCD aiškiai aprašytos mūsų atitikties vadove.'
cta:
