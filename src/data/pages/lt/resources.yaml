hero_text:
  tagline: Ištekliai
  title: Atsisiuntimų centras ir pirkėjų gidai
  subtitle: Prieiga prie gaminių katalogų, OEM gidų, pirkėjų kontrolinių sąrašų ir techninės dokumentacijos, padedančios priimti pagrįstus pirkimo sprendimus.
features3_downloads:
  tagline: Atsisiuntimai
  title: Produktų dokumentacija<br />ir pirkėjų ištekliai
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 m. jūrinių produktų katalogas
      description: Pilnas produktų asortimentas, įskaitant RIB valtis, pripučiamas valtis, SUP lentas, baidares ir priedus. Techninės specifikacijos, konfigūracijos ir parinktys. PDF formato.
      icon: tabler:file-text
    - title: OEM gamybos vadovas
      description: 'Visa, ką reikia žinoti apie OEM/ODM partnerystes: proceso apžvalga, minimalūs užsakymo kiekiai, pritaikymo galimybės, kokybės kontrolė ir siuntimas.'
      icon: tabler:building-factory
    - title: RIB valtims pirkėjo gidas
      description: 'Kaip pasirinkti tinkamą RIB: korpuso medžiagos, vamzdžių medžiagos, variklio pasirinkimas, dydžio svarstymai ir konfigūracijos parinktys skirtingoms paskirtims.'
      icon: tabler:file-description
    - title: SUP tiekėjo kontrolinis sąrašas
      description: 'Svarbiausi veiksniai renkantis SUP lentų gamintoją: kokybės rodikliai, sertifikavimo reikalavimai, MOQ svarstymai ir į ką atkreipti dėmesį vykdant gamyklos auditą.'
      icon: tabler:clipboard-check
    - title: Pripučiamos valties medžiagos vadovas
      description: 'PVC vs Hypalon: atsparumo, UV pasipriešinimo, ilgaamžiškumo, remonto galimybių ir sąnaudų palyginimas skirtingoms jūrinėms aplikacijoms.'
      icon: tabler:files
    - title: Individualaus gamybos briefo šablonas
      description: Atsisiųskite mūsų produkto briefo šabloną. Užpildykite jūsų reikalavimus ir grąžinkite mums dėl tos pačios savaitės kainos pasiūlymo ir tinkamumo įvertinimo.
      icon: tabler:template
faqs:
  title: Dažniausiai užduodami klausimai
  subtitle: Dažniausiai užduodami klausimai apie mūsų produktus, gamybos procesą ir partnerystės modelį.
  columns: 2
  items:
    - title: Koks yra minimalus užsakymo kiekis?
      description: MOQ priklauso nuo produktų kategorijos. RIB valtys paprastai prasideda nuo 10 vienetų kiekvienam modeliui. SUP lentos nuo 50 vienetų. Susisiekite su mūsų pardavimų komanda dėl konkrečios produkto MOQ informacijos.
      icon: tabler:help-circle
    - title: Ar galiu gauti pavyzdžius prieš pateikiant užsakymą?
      description: Taip. Paddle Board Overstock teikia pavyzdžių gamybą vertinimui prieš masinę gamybą. Pavyzdžių kaina derinama ir dažnai kreditinių lėšų pavidalu pritaikoma pirmajam gamybos užsakymui.
      icon: tabler:package
    - title: Kokios yra mokėjimo sąlygos?
      description: 'Standartinės sąlygos: 30 % depozitas su užsakymu, 70 % prieš siuntimą. LC sąlygos teikiamos kvalifikuotiems klientams. Susisiekite su mūsų finansų komanda dėl susitarimų.'
      icon: tabler:currency-dollar
    - title: Kiek laiko užtrunka gamyba?
      description: 'Įprasti terminai: RIB valtys 30–45 dienos, SUP lentos 20–30 dienų, pripučiamos valtys 25–35 dienų. Individualus kūrimas prideda 15–30 dienų prototipų gamybai.'
      icon: tabler:calendar-clock
    - title: Kokie sertifikatai turi jūsų produktai?
      description: CE sertifikacija ES rinkai, JAV krantinės apsaugos patvirtintas gamybos procesas, ISO kokybės sistema, BSCI atitiktis ir REACH medžiagų atitiktis.
      icon: tabler:certificate
    - title: Ar siūlote individualią pakuotę ir prekės ženklą?
      description: Taip. Mes teikiame individualią pakuotę su jūsų logotipu, spalvomis ir prekės ženklo identitetu. MOQ už individualią pakuotę priklauso nuo produkto kategorijos.
      icon: tabler:color-swatch
cta:
