content_challenge:
  tagline: Iššūkis
  title: Akvakultūros reikalavimai<br />Įranga, atspari sūriam vandeniui
  subtitle: Žuvų ūkiai, perlų ūkiai ir jūrų ranchai veikia labiausiai cheminėms medžiagoms imlioje marine aplinkoje — ilgalaikė ekspozicija sūriam vandeniui, kuro ir pašaro likučiai bei nuolatinis kasdienis naudojimas.
  paragraphs:
    - Akvakultūros operacijos vykdomos 365 dienas per metus atvirose pakrančių ir jūrų zonose. Darbo laivai, naudojami narvų patikrinimui, pašaro transportavimui, perlų linijų priežiūrai ir įrangos aptarnavimui, nuolat patenka į sūrią vandenį, UV patiria ekspoziciją ir sąlytį su chemikalais iš kuro, žuvų pašaro ir priešužslinkimo medžiagų.
    - '**Korozija yra pagrindinis priešas** — standartinė jūrinė įranga greitai suprastėja tokiose sąlygose. Išoriniai varikliai, priekabų rėmai ir korpuso tvirtinimai reikalauja nuolatinės pakeitimo. Operatoriams reikia laivų, pagamintų iš korozijai atsparių medžiagų, kurie gali ištverti daugelį metų šioje aplinkoje nesusilpnėdami.'
    - '**Kasdienis patikimumas yra kritiškai svarbus** — sugedęs darbo laivas reiškia praleistus pašaro grafikus, vėluojančias derliaus nuėmimo datas ir brangius gamybos nuostolius. Perlų ūkiams vienos dienos patikrinimo praleidimas gali reikšti didelę derliaus žalą. Žuvų ūkiams vėluojantis pašaravimas paveikia augimo tempą ir pelningumą.'
    - Paddle Board Overstock akvakultūros RIBs laiveliai suprojektuoti su korozijai atsparia įranga, sunkiųjų darbų Hypalon vamzdžiais ir sustiprintu korpusu, skirtu būtent žuvininkystės, perlų auginimo ir jūrų ranchų poreikiams.
content_solution:
  tagline: Mūsų sprendimas
  title: Tiksliai sukurtas RIBs<br />Akvakultūros pramonei
  subtitle: Kiekvienas Paddle Board Overstock akvakultūros darbo laivas sukurtas atlaikyti agresyvios sūrios jūros sąlygas ir užtikrinti patikimą kasdieninę veiklą.
  list:
    - Jūrinio lygio Hypalon vamzdžiai — puiki atsparumas UV, sūriam vandeniui, kurui ir žuvų pašaro chemikalams
    - 316 nerūdijančio plieno įranga visame laive — nėra rūdijimo ilgai esant sūriame vandenyje
    - Sustiprintos apsauginės juostos ir puskilinės apsauga dėl pakartotinio kontaktavimo su prieplaukų ir narvų konstrukcijomis
    - Savaime nusausinamas denis lengvam plovimui ir drenažui po pašaro transportavimo ir derliaus nuėmimo operacijų
    - Plokščio denio konfigūracija pašarų maišams, derliaus dėžėms ir įrangai nešti
    - Išorinės konfigūracijos nuo 15 HP iki 60 HP — optimizuotos pagal naudingosios apkrovos ir kuro efektyvumą
    - Ryškiai matomos vamzdžių spalvų parinktys, leidžiančios lengvai pastebėti didelius ūkius
content_segments:
  tagline: Akvakultūros profiliai
  title: Darbo valčių sprendimai<br />Pagal akvakultūros tipą
  subtitle: Skirtingos akvakultūros įmonės turi skirtingus darbo valčių reikalavimus – nuo mažų lanksčių žuvų RIBs narvų apžiūrai iki stabilių perlų auginimo platformų ir sunkiųjų darbo valčių jūrų gyvulininkystei.
  items:
    - title: Žuvininkystės veikla
      subtitle: Narvo patikra, pašaro transportavimas, derliaus palaikymas
      description: Jūrinės žuvų fermos valdo narvus atvirose pakrantės ir atviro kranto vietose. Darbo valtys kasdien naudojamos narvų tinklų patikrai, šėrimo operacijoms, derliaus palaikymui ir įrangos priežiūrai. Pagrindinis iššūkis yra korozija – laivai nuolat veikiami sūraus vandens, žuvų pašarų likučių ir kuro. Patikimas darbo laivas yra būtinas, nes praleistas šėrimas ar vėluojantis derlius tiesiogiai veikia gamybos rezultatus ir pelningumą.
      features:
        - 'Agresyvios aplinkos paketas: 316 nerūdijančio plieno furnitūros, jūrinės klasės lydinio komponentai'
        - Plokščias denio išdėstymas pašarų maišų ir derliaus dėžės transportavimui
        - Savaime išsitraukiantis denis lengvam plovimui po eksploatacijos
        - Hypalon vamzdeliai su cheminėms medžiagoms atspariomis dangomis, skirtomis pašarui ir kurui
        - Sustiprintos trinančios juostos dažnam narvo ir dokų kontaktui
    - title: Perlų auginimo operacijos
      subtitle: Stabilus perlų linijos patikros ir derliaus nuėmimo transportas
      description: Perlų ūkiams reikalingi stabilūs, patikimi darbo laivai kasdieniam transportavimui tarp perlų linijų, austrių tinklų apžiūrai ir derliaus rinkimui. Šios operacijos vyksta atokiose pakrantės vietovėse su ribota priežiūros infrastruktūra. Valtis turi būti pakankamai stabili, kad įgula galėtų dirbti tikrindama perlų linijas, su lengvu įlipimu ir pakankama denio erdve nuskintoms austrėms, tinklams ir atsargoms gabenti. Patikimumas ir paprasta priežiūra yra itin svarbūs atokiose vietovėse.
      features:
        - Stabilios korpuso konstrukcijos nuolatinei įgulai perlų linijos patikrinimo metu
        - Plokščias denis su neslystančia danga saugiam įgulos judėjimui
        - Žemas bortas, leidžiantis lengvai pasiekti austrių tinklą ir derliaus nuėmimą
        - Paprasta išorinė konfigūracija patogiam aptarnavimui vietoje
        - Korozijai atsparus vamzdis ir furnitūros korpusas nuolatiniam druskos vandens poveikiui
    - title: Vandenynų gyvulininkystė ir jūrų gerinimas
      subtitle: Jaunimo transportavimas, narvo priežiūra, stebėsena, palaikymas
      description: Vandenynų gyvulininkystės operacijos apima jauniklių paleidimą į valdomas jūrines aplinkas, augimo stebėseną ir gerinimo konstrukcijų aptarnavimą. Darbo valtys turi gabenti gyvus jauniklius aeruotuose konteineriuose, gabenti stebėjimo įrangą ir pasiekti seklias pakrantės išleidimo vietas. Korpuso konstrukcija turi subalansuoti nešimo talpą su negilia grimzle paplūdimio ir estuarijos prieigai.
      features:
        - Denio erdvė aeruotiems jauniklių transportavimo konteineriams ir stebėjimo įrangai
        - Negili grimzlė paplūdimio ir estuarijos išleidimo vietų prieigai
        - Lengvas išsilaipinimas paplūdimyje — sustiprinta kilio ir priekio apsauga
        - Įrangos tvirtinimo taškai elektronikai ir mėginių ėmimo įrangai stebėti
        - Didelio patvarumo Hypalon vamzdžiai, atsparūs mišrios smėlio ir jūros vandens sąlygoms
