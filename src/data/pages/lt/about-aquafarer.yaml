values:
  - title: Kokybė pirmiausia
    desc: Kiekvienas laivas, išplaukiantis iš mūsų gamyklos, praeina privalomą oro sulaikymo, siūlės nuėmimo ir sistemų testavimą prieš išsiuntimą.
  - title: Vertikali integracija
    desc: Mes kontroliuojame kiekvieną etapą – nuo PVC pjovimo iki galutinio surinkimo – pašalindami rangovų neefektyvumą ir užtikrindami nuoseklią kokybę.
  - title: Saugumas kaip standartas
    desc: CE Sertifikavimas yra pagrindas tam, ką kuriame. Mūsų 64 CEsertifikuoti modeliai atitinka ES saugumo standartus rekreaciniam ir komerciniam naudojimui.
  - title: Partnerio centriškumas
    desc: Mes kuriame ilgalaikius santykius su OEM, ODM, ir privačių prekių ženklų partneriais per skaidrumą, patikimumą ir bendrą augimą.
services:
  - title: OEM Gamyba
    desc: Mes statome pagal jūsų specifikacijas. Dalinkitės savo brėžiniais, o mūsų inžinierių komanda rūpinasi prototipavimu, įrankių kūrimu ir gamyba.
  - title: ODM Sprendimai
    desc: Pradėkite nuo mūsų patikrintų platformų dizainų. Pritaikykite dydį, spalvą, grafiką ir pakuotę, kad sukurtumėte savo unikalią produktų liniją.
  - title: Privatus prekės ženklas
    desc: Jūsų prekės ženklas, logotipas, pakuotė. Produktai atkeliauja į mažmeninę prekybą su pilna prekės ženklo integracija.
  - title: Individualus prekės ženklas
    desc: Denio paklotų spauda, korpuso grafika, vamzdelių lipdukai ir individualios etiketės – nuoseklus prekės ženklo matomumas kiekviename paviršiuje.
certifications:
  - name: CE Sertifikavimas
    desc: Mūsų laivai ir vandens transporto priemonės atitinka ES laisvalaikio laivų direktyvą (2013/53/ES) ir atitinkamus suderintus standartus.
    scope: Valtys ir vandens transporto priemonės
  - name: null
    desc: Kokybės valdymo sistema, sertifikuota pripučiamų vandens transporto priemonių projektavimui, gamybai ir platinimui.
    scope: Visa įstaiga
  - name: null
    desc: Pripučiamos valtys — saugumo ir našumo reikalavimai sustiprintoms ir kieto korpuso pripučiamoms valtims.
    scope: RIB & pripučiamos linijos
