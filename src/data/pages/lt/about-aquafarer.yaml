hero:
  tagline: Apie
  title: Apie {SITE}
  subtitle: Vertikaliai integruotas vandens sporto įrangos gamintojas — nuo žaliavų iki baigto laivo
intro:
  - 'Aquafarer buvo įkurtas 2012 m. su vienu tikslu: projektuoti ir gaminti vandens sporto įrangą, kuri veiktų taip pat gerai vandenyje, kaip ir kokybės ataskaitoje. Tai, kas prasidėjo kaip specializuota SUP lentų dirbtuvė, išaugo į 12 000 kvadratinių metrų integruotą gamyklos kompleksą Qingdao ekonominės plėtros zonoje, gaminant pripučiamas valtis, RIBs, baidares, SUP lentas, saugos įrangą ir aksesuarus klientams 50+ šalių.'
  - Šiandien Aquafarer veikia kaip gamyklos prekės ženklas — mes projektuojame, inžinerijojame, kuriame prototipus, gaminame ir testuojame viską po vienu stogu. Ši vertikali integracija suteikia tiesioginę kontrolę pasirinkiant medžiagas, gamybos kokybę ir pristatymo laikus. Kiekviena valtis gaminama mūsų žmonių, mūsų įranga, pagal mūsų standartus.
  - Mes aptarnaujame laisvalaikio naudotojus, komercinius operatorius, vyriausybines agentūras ir prekių ženklus visame pasaulyje. Mūsų OEM ir ODM programos padeda verslams paleisti savo produktų linijas nesinvestuojant į gamyklos infrastruktūrą. Nesvarbu, ar jums reikia vieno prototipo, ar pilnos gamybos partijos, mūsų komanda jus veda nuo idėjos iki jūrai paruošto pristatymo.
