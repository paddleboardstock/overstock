hero:
  tagline: Paddle Board Overstock Individuali laboratorija
  title: Sukurkite savo<br />Vandens transporto priemonę
  subtitle: OEM, ODM, privačios prekės ženklo ir individualaus ženklinimo paslaugos verslams visame pasaulyje. Nuo vieno prototipo iki pilnos gamybos.
  cta: Pradėkite savo projektą
  footer_link: /contact
steps_section:
  tagline: Kaip tai veikia
  title: Nuo koncepcijos iki gamybos
  subtitle: Keturi žingsniai nuo jūsų idėjos iki paruošto jūrai produkto.
  steps:
    - num: '01'
      title: Pasirinkite savo lentą
      desc: Pasirinkite iš mūsų pagrindinių modelių — SUP, baidarės, katerio arba RIB. Pasirinkite dydį, medžiagą ir spalvą.
    - num: '02'
      title: Įkelkite savo dizainą
      desc: Atsiųskite mums savo logotipą, kūrinį arba prekės ženklo gaires. Mūsų dizaino komanda paruoš skaitmeninį įrodymą.
    - num: '03'
      title: AI maketo peržiūra
      desc: Peržiūrėkite fotorealistinį AI sugeneruotą jūsų individualios lentos maketą prieš pradedant gamybą.
    - num: '04'
      title: Gamyba ir pristatymas
      desc: Patvirtinus, jūsų užsakymas patenka į mūsų ISO sertifikuotą gamybos liniją. Gaminių pristatymo terminas nuo 30 dienų.
services_section:
  tagline: Paslaugos
  title: Gamybos paslaugos pasauliniams prekės ženklams
  subtitle: Lankstūs bendradarbiavimo modeliai — nuo gamybos pagal sutartį iki pilno prekės ženklo kūrimo paslaugų.
  items:
    - title: OEM Gamyba
      desc: Mes gaminame jūsų dizainus pagal specifikacijas — jūsų intelektinė nuosavybė, jūsų brėžiniai, jūsų kokybės standartai. Pilnas NDA apsauga.
      icon: ⚙️
    - title: ODM Sprendimai
      desc: Pasirinkite iš 50+ patikrintų platformų ir pritaikykite dydį, spalvą, grafinius elementus bei pakuotę.
      icon: 🎨
    - title: Privatus prekės ženklas
      desc: Jūsų prekės ženklas mūsų produktuose — logotipas, pakuotė, etiketės, instrukcijos. Paruošta prekybai iš karto.
      icon: 🏷️
    - title: Individualus prekės ženklas
      desc: Denio kilimėlio spausdinimas, korpuso grafika, vamzdelių lipdukai ir individualios etiketės — pilnas prekės ženklo integravimas.
      icon: ✨
capabilities_section:
  tagline: Galimybės
  title: Gamybos ir pritaikymo galimybės
  subtitle: Visa, ką reikia žinoti prieš pateikiant užsakymą.
  capabilities:
    - label: Užsakymo apimtis
      value: MOQ 5–10 vienetų (SUP/baidarė), 2–5 vienetai (RIB)
    - label: Pristatymo laikas
      value: 30–45 dienos standartinės; 15–20 dienų prototipams
    - label: Individualizavimas
      value: Dydis, forma, spalva, grafika, pakuotė, įranga
    - label: Medžiagos
      value: PVC, Hypalon, drop-stitch, stiklo pluoštas, aliuminis
    - label: Spauda
      value: Skaitmeninė (CMYK), šilkografija, karštasis perkėlimas, sublimacija
    - label: Sertifikacija
      value: CE, ISO 9001, BSCI, UKCA (palaikymas pasauliniam atitikties užtikrinimui)
why_section:
  tagline: Kodėl Paddle Board Overstock
  title: Viena gamykla. Vienas standartas. Nė vienos kompromiso.
  points:
    - text: 12 000 kv. m integruotos gamybos patalpos
      highlight: 12 000 kv. m
    - text: 200–300 kvalifikuotų darbuotojų ir inžinierių
      highlight: 200-300
    - text: 15 000 valčių pagaminama kasmet
      highlight: 15,000
    - text: ISO 9001 sertifikuota kokybės vadyba
      highlight: ISO 9001
    - text: CE sertifikuoti produktai ES rinkai
      highlight: CE
  cta: Peržiūrėti gamyklos duomenis
  cta_link: /factory
  contact:
    title: Ar pasiruošę aptarti savo projektą?
    desc: Mūsų komanda atsako per 24 valandas su preliminaria kaina.
