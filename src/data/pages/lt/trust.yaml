features3_certifications:
  title: Sertifikatai ir atitiktis
  subtitle: Kiekvienas produktas yra nepriklausomai išbandytas; 64 modeliai yra CE sertifikuoti pagal tarptautinius standartus.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Sertifikavimas
      description: 64 CE sertifikuoti modeliai per SUPs, baidares, valčių ir RIBs atitinka Europos CE saugos standartą laisvalaikio vandens transportui. Kiekvienas produktas prieš palikdamas fabriką praeina spaudimo, plūdrumo ir apkrovos testus.
      icon: tabler:certificate
    - title: ''
      description: Mūsų 12 000 m² Qingdao gamykla veikia pagal ISO 9001 kokybės valdymo sistemą. Kiekvienas gamybos partija yra sekama, dokumentuojama ir tikrinama.
      icon: tabler:clipboard-check
    - title: BSCI Socialinis atitikimas
      description: Mes turime BSCI sertifikatą, užtikrinantį etišką darbo praktiką, saugias darbo sąlygas ir atsakingą požiūrį į aplinką visoje tiekimo grandinėje.
      icon: tabler:users
    - title: REACH & RoHS
      description: Visos medžiagos — PVC, Hypalon, EVA putos, klijai — atitinka ES REACH ir RoHS reglamentus. Nėra draudžiamų medžiagų, nėra kompromisų.
      icon: tabler:flask
    - title: Medžiagų tyrimų laboratorija
      description: Įmonės medžiagų laboratorija tikrina kiekvienos audinio partijos tempimo stiprumą, UV atsparumą, siūlių vientisumą ir dilimą prieš gamybą.
      icon: tabler:microscope
    - title: 5 metų laivo garantija
      description: Paddle Board Overstock valtys turi 5 metų ribotą garantiją vamzdžių audiniui, siūlėms ir korpusui. SUP lentos ir priedai turi 2 metų garantiją. Mes remiame tai, ką sukuriame.
      icon: tabler:shield-check
testimonials:
  tagline: Kliento pasitikėjimas
  title: Ką sako mūsų klientai
  subtitle: Nuo pirmą kartą irkluojančių iki profesionalių laivyno operatorių – sužinokite, kodėl jie pasitiki Paddle Board Overstock.
  items:
    - content: Mes aprūpinome visą nuomos flotilę su Paddle Board Overstock RIBs — 12 valčių trijose vietose. Po dviejų sezonų, jokių gedimų. CE sertifikavimo dokumentacija padarė draudimo patvirtinimą sklandų. Jų inžinerijos komanda net pritaikė vamzdžių spalvas, kad atitiktų mūsų prekės ženklą.
      name: Marco Valenti
      title: Operacijų direktorius, Adriatic Adventure Tours — Dubrovnikas, Kroatija
    - content: Kaip pirmą kartą perkantis, nerimavau dėl kokybės užsakant iš užsienio. ISO Dokumentacija ir nepriklausomi testų ataskaitos, kurias jie pasidalino dar prieš manęs paklausus, suteikė visišką pasitikėjimą. Lenta atvyko per 6 dienas ir pranoko mano lūkesčius.
      name: James Thornton
      title: SUP Explorer 11 savininkas — Vankuveris, Kanada
    - content: Mes eksploatuojame 24 Paddle Board Overstock RIBs visoje mūsų pakrančių patrulių flotilėje. Jų QC procesas yra vienodas kiekviename partijose — tokia pati siūlių kokybė, tokia pati vožtuvo vieta, tokia pati slėgio klasė kiekvieną kartą. Šis pakartojamumas yra svarbus, kai nuo įrangos priklausys gyvybės.
      name: Lt. Commander Andres Reyes
      title: Jūrų pirkimų pareigūnas, Filipinų pakrančių apsaugos pagalbinė tarnyba — Manila, Filipinai
features3_lab:
  title: Įmonės bandymų ir kokybės laboratorija
  subtitle: Kiekviena medžiagos partija ir galutinis produktas praeina mūsų vietoje esančią bandymų laboratoriją prieš siunčiant.
  columns: 3
  isBeforeContent: true
  items:
    - title: Tempimo stiprumo bandymai
      description: 'Kiekvienas PVC audinio ritinys testuojamas pagal ASTM D751 standartus. Minimalus reikalavimas: 350 N/cm skersai ir išilgai. Atmestos partijos grąžinamos tiekėjui — mes atmetame maždaug 3% gaunamų medžiagų.'
      icon: tabler:scale
    - title: UV Paacceleruotas senėjimas
      description: Audinių pavyzdžiai praeina 1 000 valandų QUV paacceleruotą atmosferos poveikio testą (ASTM G154). Tempimo stiprumo išlaikymas po UV poveikio turi būti didesnis nei 80%. Produktai įvertinti 3+ metų lauko naudojimui.
      icon: tabler:sun
    - title: Siūlių atplėšimo stipris
      description: RF suvirintos siūlės testuojamos minimalų 5 N/mm atplėšimo stiprį (ASTM D751). Rankomis klijuotos Hypalon siūlės testuojamos 3,5 N/mm. Kiekvienos gamybos partijos siūlių pavyzdžiai yra destruktyviai testuojami ir archyvuojami.
      icon: tabler:stack
    - title: 24–48 valandų slėgio išlaikymas
      description: 'Kiekvienas pripučiamas produktas pripučiamas iki 1,25x nominalaus PSI ir stebimas 24–48 valandas. Didžiausias leistinas slėgio kritimas: 5%. Produktai, nepraėję šio bandymo, perdirbami ir testuojami iš naujo prieš siuntimą.'
      icon: tabler:wind
    - title: Vožtuvo ciklo testavimas
      description: Kiekvienas vožtuvo dizainas praeina per 10 000 atidarymo-uždarymo ciklų mūsų laboratorijoje. Vožtuvai turi palaikyti sandarumą prie 1,25x nominalaus slėgio po ciklų. Visi Paddle Board Overstock vožtuvai įvertinti 5+ metų reguliariam naudojimui.
      icon: tabler:rotate
    - title: Atsparumas šalčio įtrūkimams
      description: Medžiagos testuojamos -30°C 4 valandas pagal ISO 4646. Draudžiama įtrūkimai ar trūkinėjimas. Produktai įvertinti žiemai, laikymui ir naudojimui šaltame vandenyje iki -10°C aplinkos temperatūros.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kaip mes užtikriname kokybę
  subtitle: Nuo žaliavų patikros iki galutinio slėgio bandymo — kiekvienas produktas praeina griežtą kokybės grandinę.
  items:
    - title: Žaliavų inspekcija
      description: Kiekvienas PVC audinio ritinys testuojamas dėl storio, tempimo stiprumo ir UV atsparumo prieš pateikimą į gamybą.
      icon: tabler:search
    - title: Proceso metu vykdoma QC
      description: Suvirinimo siūlės, vožtuvų įrengimas ir kamerų sujungimai tikrinami kiekvienoje surinkimo stotelėje.
      icon: tabler:eye
    - title: Slėgio Testavimas
      description: Kiekvienas pripučiamas gaminys pripučiamas iki 1,25 karto ir PSI laikomas 24–48 valandas, kad būtų patikrintas oro sulaikymas ir siūlės vientisumas.
      icon: tabler:wind
    - title: Galutinė apžiūra
      description: Kiekvienas vienetas tikrinamas dėl apdailos, furnitūros ir pakuotės prieš patvirtinant siuntimą. Partijų mėginiai siunčiami į mūsų laboratoriją destruktyviems bandymams.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Dažniausiai užduodami klausimai apie laivus
  subtitle: Dažni klausimai apie mūsų kieto korpuso pripučiamus laivus.
  columns: 2
  items:
    - title: Kokius RIB laivų dydžius Paddle Board Overstock siūlo?
      description: Siūlome 35 RIB modelius nuo 2,5 m iki 7,6 m, apimančius viską nuo kompaktiškų tenderių iki sunkiųjų komercinių ir patrulinių laivų. Kiekvienas modelis siūlomas su keliomis konfigūracijos galimybėmis.
    - title: Kuo skiriasi RIB pripučiama valtis nuo tradicinės pripučiamos valties?
      description: A RIB (Stand-Hull Inflatable Boat) sujungia masyvų stiklo pluošto arba aliuminio gilų V formos korpusą su pripučiamu Hypalon arba PVC vamzdiniu laivu. Tai suteikia kieto laivo stabilumą ir keliamąją talpą su smūgių sugerimu ir plūdrumu, būdingu pripučiamam laivui.
    - title: Su kokiais varikliais yra suderinami Paddle Board Overstock RIBs?
      description: Mes RIBs palaikome išorinius variklius nuo 3 HP iki 250, HP priklausomai nuo modelio. Kiekviename produkto puslapyje nurodoma maksimali įvertinta variklio galia. Rekomenduojame pasitarti su savo pardavėju dėl idealaus varianto.
    - title: Ar esate Paddle Board Overstock RIBs CE sertifikuoti?
      description: Taip. Visi laisvalaikio RIB modeliai yra CE sertifikuoti pagal taikomus Europos standartus pramoginiams vandens transporto priemonėms. Komerciniai ir patruliniai modeliai atitinka papildomus stabilumo ir apkrovos reikalavimus.
    - title: Kokia yra RIB laivų garantija?
      description: Visi Paddle Board Overstock RIBs turi 5 metų ribotą garantiją vamzdžių audiniui, siūlėms ir korpusui; pripūtimo vožtuvai apdrausti 5 metams; gamykloje sumontuoti priedai – 1 metus.
    - title: Kiek oro kamerų Paddle Board Overstock RIBs turi?
      description: Mūsų RIBs modelyje yra nuo 3 iki 7 nepriklausomų oro kamerų, priklausomai nuo modelio ilgio. Šis daugiakameris dizainas užtikrina, kad laivas išliktų plūduriuojantis net jei vienas skyrius būtų pažeistas.
faqs_inflatable:
  title: Dažniausiai užduodami klausimai apie pripučiamus laivus
  subtitle: Dažni klausimai apie mūsų pripučiamus valtis, baidares ir valtis.
  columns: 2
  items:
    - title: Kokios medžiagos naudojamos Paddle Board Overstock pripučiamuose laivuose?
      description: Naudojame karinės klasės PVC (1100 denierių) ir premium Hypalon/CSM gumos, priklausomai nuo modelio. Abi medžiagos yra UVstabilizuotos, atsparios dilimui ir atitinka ES REACH bei RoHS reglamentus.
    - title: Kiek laiko tarnauja pripučiamos valtys?
      description: Tinkamai prižiūrint, kokybiška PVC pripučiama valtis tarnauja 7–10 metų, o Hypalon modeliai – 15–20 metų. Reguliarus valymas, UV apsauga ir tinkamas laikymas žymiai prailgina tarnavimo laiką.
    - title: Kokia priežiūra reikalinga pripučiamai valčiai?
      description: Pagrindinė priežiūra apima skalavimą šviežiu vandeniu po kiekvieno naudojimo (ypač sūriame vandenyje), džiovinimą prieš sandėliavimą, kasmetinį vožtuvų sandariklių tikrinimą ir UV apsauginio skysčio naudojimą ant vamzdelių. Venkite ilgalaikio saulės poveikio, kai nenaudojate.
    - title: Ar pripučiamos valtys gali būti naudojamos sūriame vandenyje?
      description: Taip. Visos Paddle Board Overstock pripučiamos valtys yra skirtos tiek gėlo, tiek sūraus vandens naudojimui. Rekomenduojame nuplauti gėlu vandeniu ir kruopščiai išdžiovinti po kontakto su sūriu vandeniu, kad išvengtumėte prilipimo korozijos ir audinio druskos kristalizacijos.
    - title: Kaip laikyti pripučiamą valtį?
      description: Išleiskite valtį, išvalykite ir visiškai išdžiovinkite prieš sandėliavimą. Valykite laisvai (venkite sandarių lankstymų), laikykite vėsioje ir sausoje vietoje, toli nuo tiesioginių saulės spindulių, ir saugokite betonines grindis, kad išvengtumėte drėgmės sugėrimo.
    - title: Kokia yra Paddle Board Overstock pripučiamų valčių svorio talpa?
      description: Svorio ribos svyruoja nuo 290 kg mūsų mažiausiems modeliams iki daugiau nei 2000 kg didesniems komerciniams laivams. Kiekviename produkto puslapyje nurodoma didžiausia apkrovos riba jūsų konkrečiam modeliui.
faqs_sup:
  title: SUP Lentų DUK
  subtitle: Dažniausiai užduodami klausimai apie mūsų stovimųjų irklentžių lentas.
  columns: 2
  items:
    - title: Kokie SUP lentų dydžiai yra prieinami?
      description: Siūlome SUP lentas nuo 9 pėdų iki 12 pėdų, įskaitant universalias, turizmo, jogai skirtas ir specialius dizainus. Mūsų pardavimų lyderiai yra Tropical Breeze (10 pėdų) ir Ocean Voyager (11 pėdų).
    - title: Kas yra drop-stitch konstrukcija?
      description: Drop-stitch konstrukcija naudoja tūkstančius poliesterio siūlų, jungiančių lentos viršutinį ir apatinį sluoksnius, leidžiant lentai išlaikyti didelį oro slėgį (15–20 PSI) ir suteikiant tvirtą, stabilų paviršių. Tai yra pramonės standartas aukščiausios klasės pripučiamoms SUPs.
    - title: Kokia yra SUP lentų svorio riba?
      description: Mūsų SUP lentos palaiko iki 150 kg, priklausomai nuo modelio ir tūrį. Leviathan Wake lenta yra mūsų didžiausios talpos modelis, sukurtas didesniems irkluojantiesiems bei jogai.
    - title: Ar siūlote pilnas SUP komplektacijas?
      description: Taip. Kiekviena SUP lenta pristatoma su pilnu komplektu, įskaitant 3 dalių aliuminio irklą, aukšto slėgio rankinį pompos įrankį, spiralės pavadėlį, kelioninę kuprinę ir remonto rinkinį. Kai kurie modeliai taip pat turi nuimamą pelekų komplektą.
    - title: Kokia yra SUP lentų garantija?
      description: Visos Paddle Board Overstock SUP lentos turi 2 metų garantiją nuo gamybos defektų, įskaitant siūlių plyšius, vožtuvų defektus ir medžiagos sluoksnių atskyrimą normaliai naudojant.
    - title: Kiek laiko užtrunka pripūsti SUP lentą?
      description: Naudojant pridėtą rankinį pompos įrankį, pilnas pripūtimas iki 15 PSI užtrunka maždaug 8–12 minučių. Greitesniam pripūtimui rekomenduojame mūsų Paddle Board Overstock 12V elektrinę pompą, kuri pripučia lentą per mažiau nei 4 minutes.
cta:
  title: Norite pamatyti sertifikatus patys?
  subtitle: Užsisakykite mūsų sertifikatų portfelį, gamyklos patikrinimo ataskaitas arba medžiagų atitikties dokumentus. Jokių NDA nereikia.
  actions:
    - variant: primary
      text: Prašyti sertifikavimo dokumentų
      href: /contact
    - text: Apsilankykite mūsų gamyklos puslapyje
      href: /factory
