cta:
  title: Nežinote, nuo ko pradėti?
  desc: Pasirinkite mūsų įgūdžių vertinimo testą, kad rastumėte tinkamus gidus ir įrangą pagal savo lygį.
  label: Susisiekite su mumis →
  link: /contact
