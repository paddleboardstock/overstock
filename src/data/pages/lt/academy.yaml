hero:
  tagline: Aquafarer Akademija
  title: Mokymosi centras
  subtitle: Gidai ir pamokos visiems įgūdžių lygiams — nuo SUP pagrindų iki pažangių gelbėjimo technikų
categories:
  - level: Pradedantysis
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Pagrindai
        desc: Išmokite stacionaraus irklavimo pagrindus — stovėseną, irklavimo techniką ir pusiausvyrą.
        slug: beginner-sup-guide
      - title: Irklavimo technikos
        desc: Pirmyn, sukamoji, traukimo ir žemo pasipriešinimo technikos — įvaldykite esminius irklo judesius.
        slug: sup-paddle-guide
      - title: Saugumas pirmiausia
        desc: Esminės saugos praktikos, įskaitant oro sąlygų tikrinimą, PFD naudojimą, lyno taisykles ir savigelbėjimą.
        slug: sup-safety-guide
  - level: Vidutinis
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Turizmo pagrindai
        desc: Planuojant kelių valandų irklavimus — navigacija, hidratacija, tempas ir vėjo prognozių skaitymas.
        slug: touring-sup-guide
      - title: Oro sąlygų skaitymas
        desc: Interpretacija jūrų prognozių, debesų formacijų atpažinimas ir vėjo poveikio vandeniui supratimas.
        slug: weather-planning-water-sports
      - title: Navigacijos pagrindai
        desc: Žemėlapių skaitymas, kompaso naudojimas, GPS taškų nustatymas ir pakrančių maršrutų planavimas.
        slug: sup-navigation-guide
      - title: Potvynių suvokimas
        desc: Potvynių ciklų, srovių ir jų poveikio paleidimo laikui bei maršrutui supratimas.
        slug: understanding-tides
  - level: Išplėstinė
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Daugiadienio kelionės planavimas
        desc: Ekspedicijos logistika — įrangos parinkimas, maisto planavimas, saugos protokolai ir skubios pagalbos kontaktai.
        slug: sup-travel-guide
      - title: Gelbėjimo technikos
        desc: Savigelbėjimas, T-gelbėjimas, eskimotavimas baidarėms ir gilinimo vandenyse tempimo protokolai.
        slug: sup-self-rescue
      - title: Naktinis irklavimas
        desc: Navigacija po tamsos — apšvietimo reikalavimai, maršruto įsiminimas, grupės komunikacija ir pavojų suvokimas.
        slug: sup-navigation-guide
  - level: Priežiūra
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Valymas ir priežiūra
        desc: Plauti gėlu vandeniu, UV apsauga, pelėsio prevencija ir tinkamas džiovinimo metodas po kiekvienos sesijos.
        slug: inflatable-sup-maintenance
      - title: Laikymo gidas
        desc: Geriausios praktikos, skirtos pripučiamiems lentoms ir valtim saugoti — išleidimas, lankstymas, temperatūros kontrolė ir tarnavimo laikas.
        slug: inflatable-sup-storage
      - title: Remonto pagrindai
        desc: Mažoms skylutėms, siūlių pratekėjimui ir vožtuvų problemoms taisyti naudokite PVC remonto rinkinius ir remonto pleistrų metodus.
        slug: inflatable-sup-repair
      - title: Vožtuvo priežiūra
        desc: Nustatykite vožtuvų tipus (Halkey-Roberts, Boston, Leafield), pašalinkite nešvarumus ir pakeiskite defektuotus stiebus.
        slug: inflatable-sup-repair
knowledge_center_tagline: Žinių centras
knowledge_center_title: Jūrų įrangos ir pramonės vadovai
knowledge_center_subtitle: Ekspertų žinios ir pirkimo gidai jūrų profesionalams, laivynų operatoriams ir vandens sporto entuziastams.
knowledge_sections:
  - title: RIB Dirbtinių valtų žinios
    tagline: Tvirto pripučiamo laivo vadovai
    desc: Viskas apie RIB valtis — korpuso dizainas, medžiagos, variklio pasirinkimas, priežiūra ir pirkimo patarimai tiek komerciniam, tiek rekreaciniam naudojimui.
    guides:
      - title: Kaip pasirinkti tinkamą RIB valtį
        desc: Visiškas gidai, kaip pasirinkti RIB — dydis, variklio galia, vamzdžių medžiaga, korpuso tipas ir numatytas naudojimas.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB prieš pripučiamą valtį
        desc: Tvirta pripučiamo laivo kontra tradiciniam pripučiamam kateriui — palyginami korpuso dizainas, našumas, patvarumas ir talpa.
        href: /compare/rib-vs-dinghy
      - title: Komercinis RIB prieš pramoginį RIB
        desc: Komercinio lygio prieš rekreacinę RIB valtį — konstrukcijos standartai, medžiagos, tarnavimo laikas, kaina ir sertifikatai.
        href: /compare/commercial-vs-recreational-rib
      - title: Aliuminio prieš stiklo pluošto korpusą
        desc: Palyginkite aliuminio ir stiklo pluošto korpusus RIB valtimis pagal svorį, kainą, patvarumą ir atsparumą korozijai.
        href: /compare/aluminum-vs-fiberglass
  - title: Pripučiamos valties vadovas
    tagline: Pripučiamų vandens transporto priemonių žinios
    desc: Išsamūs gidai apie pripučiamas valtis — PVC prieš Hypalon, konstrukcijos metodai, saugumo standartai ir priežiūros geriausios praktikos.
    guides:
      - title: PVC prieš Hypalon medžiagų vadovas
        desc: Galutinis PVC ir Hypalon CSM palyginimas pripučiamų valčių gamybai.
        href: /compare/pvc-vs-hypalon
      - title: Kaip gaminamos pripučiamos valtys
        desc: Gamybos procesas — medžiagos pjovimas, HF suvirinimas, siūlių konstrukcija, slėgio testavimas ir kokybės kontrolė.
        href: /learn/inflatable-technology
      - title: Pripučiamų valčių saugos vadovas
        desc: Saugumo standartai, apkrovos talpa, tinkamas pripūtimas, patikrinimai prieš išvykstant ir avarinės procedūros.
        href: /learn/water-safety
      - title: Pripučiamo laivo priežiūra
        desc: Valymas, saugojimas, UV apsauga, žiemojimas ir pripučiamų valčių ir RIBs remontas.
        href: /v2/inflatable-boat-maintenance
  - title: Valčių žinios
    tagline: Pripučiamas laivas ir RIB centras
    desc: Techniniai vadovai apie pripučiamų valčių tipus, medžiagas, gamybos metodus, priežiūrą ir saugumą — nuo valtelių iki RIBs.
    guides:
      - title: Pripučiamų valčių tipai
        desc: Valtelės, RIBs, baidarės ir pagalbinės valtys — sužinokite skirtumus ir pasirinkite tinkamą.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch technologija
        desc: Kaip tūkstančiai vidinių siūlių sukuria tvirtas, aukšto slėgio pripučiamas struktūras.
        href: /learn/drop-stitch-core
      - title: Medžiagų vadovas
        desc: PVC denjerio reitingai, audinio svoriai, UV atsparumas ir jūrinės klasės medžiagos paaiškintos.
        href: /learn/materials
      - title: RIB prieš valtį
        desc: Palyginkite kietas pripučiamas valtis su tradicinėmis pripučiamomis valtelėmis įvairiems naudojimo atvejams.
        href: /compare/rib-vs-dinghy
  - title: SUP žinios
    tagline: Stovimojo irklavimo lentų vadovai
    desc: Viskas apie SUP lentas — pripučiamos ir kietos, lentos matmenys, medžiagų technologija ir ekspertų patarimai visiems įgūdžių lygiams.
    guides:
      - title: Pripučiamos vs kietos SUP
        desc: Palyginkite iSUP ir kietas epoksidines lentas pagal nešiojamumą, patvarumą, našumą ir vertę.
        href: /learn/sup
      - title: SUP lentos matmenų vadovas
        desc: Kaip ilgis, plotis ir storis veikia stabilumą, greitį ir manevringumą.
        href: /learn/sup
      - title: SUP Priežiūra ir rūpinimasis
        desc: Valymo, laikymo, UV apsauga ir pripučiamos SUP lentos remonto patarimai.
        href: /v2/inflatable-sup-maintenance
      - title: Tinkamos pirmos SUP pasirinkimas
        desc: Pradedančiojo vadovas apie tobulos stovimos irklavimo lentos pasirinkimą pagal jūsų svorį, įgūdžių lygį ir numatytą naudojimą.
        href: /learn/sup
  - title: Nardymo įrangos vadovas
    tagline: Komercinių nardymo valčių žinios
    desc: Specializuoti vadovai apie nardymo valtis, nardymo RIBs ir įrangą nardymo centrams, nardymo operatoriams ir komercinėms nardymo komandoms.
    guides:
      - title: Geriausia RIB valtis nardymo centrams
        desc: Kaip pasirinkti tinkamą nardymo RIB jūsų nardymo centrui — talpa, konfigūracija ir biudžeto aspektai.
        href: /solutions-diving-center-boats
      - title: Nardymo RIB konfigūracijos vadovas
        desc: Pagrindinės funkcijos nardymo RIBs — bakų laikikliai, kopėtėlių sistemos, nardymo platforma ir įrangos saugojimas.
        href: /solutions-diving-center-boats
  - title: Jachtų pagalbinė valtis vadovas
    tagline: Superjachtų ir jūrų pagalbinių laivelių sprendimai
    desc: Gidai, kaip pasirinkti idealų jachtos pagalbinį laivelį — pripučiamus laivelius, RIB laivelius, sandėliavimo sprendimus ir pagalbinių laivelių priedus.
    guides:
      - title: Kaip pasirinkti jachtos pagalbinį laivelį
        desc: Veiksniai, į kuriuos reikia atsižvelgti renkantis pagalbinį laivelį savo jachtai — dydis, medžiaga, variklis ir sandėliavimas.
        href: /solutions-yacht-tender-solutions
      - title: Pripučiami vs RIB laiveliai
        desc: Palyginkite pripučiamus katerio tipo laivelius su standžiais pripučiamais katerio laiveliais pagal našumą, patvarumą ir laikymo galimybes.
        href: /compare/rib-vs-dinghy
  - title: Gelbėjimosi įrangos gidas
    tagline: Paieškos ir gelbėjimo vandens transporto žinios
    desc: Profesionalūs gidai apie gelbėjimo valtis, SAR vandens transporto priemones ir avarines atsakomosios reakcijos įrangą pakrančių apsaugos tarnyboms, gelbėtojams ir stichinių nelaimių komandų naudotojams.
    guides:
      - title: SAR valties pasirinkimo gidas
        desc: Kaip pasirinkti tinkamą paieškos ir gelbėjimo valtį — greitis, talpa, patvarumas ir specialios įrangos reikalavimai.
        href: /solutions-rescue-watercraft
      - title: Komerciniai RIB gelbėjimo operacijoms
        desc: Kodėl komercinės klasės RIBs yra pageidaujamas pasirinkimas profesionalioms paieškos ir gelbėjimo komandoms visame pasaulyje.
        href: /use-cases/search-and-rescue
