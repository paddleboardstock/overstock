hero:
  tagline: OEM/ODM Gamyba
  title: OEM & Privatūs ženklai gamyba
  subtitle: Nuo koncepcijos iki konteinerio — pritaikykite kiekvieną savo pripučiamų vandens transporto priemonių linijos detalę
intro: Aquafarer siūlo visapusiškas OEM ir ODM paslaugas prekės ženklams, platintojams ir vyriausybinėms agentūroms visame pasaulyje. Turėdami 10+ metų eksporto patirtį ir 12 000 m² ISO 9001 & BSCI sertifikuotą gamyklą, mes tvarkome viską nuo gaminio dizaino ir formos kūrimo iki pilno masto gamybos, pakavimo ir logistikos.
