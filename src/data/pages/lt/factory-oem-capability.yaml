why_us:
  - title: Vertikali integracija
    description: Mes turime savo gamyklą, formas ir tiekimo grandinę — be tarpininkų, be subrangovų. Tai suteikia mums kontrolę kokybės, kaštų ir pristatymo atžvilgiu.
  - title: Dviejų lygio sertifikavimas
    description: ISO 9001 kokybės valdymo ir BSCI socialinio atitikties sertifikatai. Gamyklos audito ataskaitos pateikiamos pagal poreikį.
  - title: CE Atitiktis
    description: Visi standartiniai modeliai turi CE 2013/53/ES sertifikatą. Užsakomieji modeliai gali būti CE sertifikuoti per mūsų nustatytą procesą.
  - title: Žemas MOQ
    description: Pradėkite nuo vos 5 vienetų standartinių modelių. Padedame naujiems prekės ženklams startuoti nesukeliant per didelės atsargų rizikos.
