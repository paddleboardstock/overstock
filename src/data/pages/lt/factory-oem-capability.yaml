services:
  - title: Gaminio dizainas ir inžinerija
    description: Mūsų vidinė MTTP komanda dirba su jūsų koncepcija ar specifikacija, kad sukurtų CAD brėžinius, 3D modelius ir prototipus. Siūlome formų kūrimą, korpuso formos optimizavimą ir medžiagų pasirinkimo gaires.
  - title: Individualizuotas ženklinimas ir grafika
    description: Visų spalvų skaitmeninis spausdinimas, šilkografija, reljefo raštai ir etikečių parinktys. Mes kuriame prekės ženklo specifinę denio grafiką, vamzdžių ženklinimą ir prekybai paruoštą pakavimą.
  - title: Medžiagų ir specifikacijų pritaikymas
    description: Rinkitės iš PVC (standartinių, ekologiškų, atsparių ugniai), Hypalon/CSM, drop-stitch ir mišrių konstrukcijų. Pritaikytos vamzdžių spalvos, audinių storiai ir stiprinimo parinktys.
  - title: Pakavimas ir logistika
    description: Individualizuotas mažmeninio pakavimo dizainas, privatūs dėžės ženklai, vakuuminis pakavimas, palečių surinkimas ir konteinerio pakrovimas. Galimos FOB Qingdao, CIF ar DDP pristatymo sąlygos.
