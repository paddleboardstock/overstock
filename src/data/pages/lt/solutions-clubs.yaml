hero:
  tagline: Vandens sporto klubai
  title: Įranga ir sprendimai<br />Plaukimo klubams ir treniruočių centrams
  subtitle: Pilni įrangos paketai, instruktorų įranga, prekės ženklų sprendimai ir priežiūros palaikymas SUP klubams, baidarių klubams, banglenčių mokykloms ir vandens sporto treniruočių centrams bet kokio dydžio.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP lentos vandens sporto klubams ir nuomos parkams
direct_answer: Aquafarer teikia pilną įrangos sprendimą vandens sporto klubams ir treniruočių centrams visame pasaulyje. Mūsų klubo paketai apima SUP lentas, baidares, irklius, pompas, remonto rinkinius ir saugos įrangą už konkurencingą didmeninę kainą su žemu MOQs. Kiekvienas paketas gali būti pritaikytas su klubo logotipais, prekės ženklo spalvomis ir individualizuota pakuote. Taip pat teikiame priežiūros mokymus, atsarginių dalių pagalbą ir įrangos rotacijos programas, kad maksimaliai pailgintume jūsų flotilės tarnavimo laiką.
solution_offerings:
  - title: Klubo pradžios paketas
    subtitle: Naujai įkuriamiems klubams su 10–30 narių
    badge: Best Seller
    features:
      - title: Pagrindinė įranga
        description: 10–30 SUP lentų arba baidarių su atitinkamais irkliais, pompomis ir remonto rinkiniais
      - title: Saugos įranga
        description: Gelbėjimosi liemenės, švilpukai, pavadėlių komplektai klubo spalvomis prie kiekvienos lentos
      - title: Instruktorių įranga
        description: Specifinės trenerio lentos su neslystančia danga ir papildomu stabilumu
      - title: Prekės ženklo paketas
        description: Individualus logotipo spausdinimas ant lentų, irklių ir pakuotės
      - title: Mokymo medžiaga
        description: Pradedančiųjų pamokų vadovai, saugos protokolai ir priežiūros patikrinimų sąrašai
    cta_text: Sukurti mano klubo paketą
    cta_href: /contact
  - title: Klubo Premium paketas
    subtitle: Nustatytiems klubams ir kelių vietų operatoriams
    badge: Professional
    features:
      - title: Visa laivynas
        description: 30–100 mišrios flotilės lentų, baidarių ir priedų
      - title: Išplėstinė saugos sistema
        description: RFID įrangos sekimas, pažeidimų ataskaitų programa, saugos ženklinimas
      - title: Personalas ir mokymai
        description: Instruktorių sertifikavimo ir įrangos priežiūros seminarai vietoje
      - title: Rinkodaros palaikymas
        description: Profesionali fotografija, brošiūros ir socialinių tinklų šablonai
      - title: Pakeitimo programa
        description: Kasmetinis įrangos atnaujinimas su nuolaidomis ir mainų galimybėmis
    cta_text: Mėgaukitės savo klubą
    cta_href: /contact
