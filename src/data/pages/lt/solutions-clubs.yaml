testimonial:
  content: Mes pradėjome nuo „Club Starter Package“ mūsų banglenčių mokyklai Portugijoje. 20 lentų, irklai, liemenės — viskas atvyko per 3 savaites. Po dviejų sezonų mes atnaujinome į „Pro Package“. Individualus ženklinimas su mūsų logotipu smarkiai pagerino mūsų profesionalų įvaizdį.
  name: Ricardo Santos
  title: Savininkas, Algarve Surf Academy — Lagosas, Portugalija
content_segments:
  tagline: Klubo profiliai
  title: Vandens sporto klubų sprendimai<br />Pagal klubo tipą
  subtitle: Nuo universitetų irklavimo klubų iki išskirtinių privačių jachtų klubų — kiekvieno tipo klubui reikalinga unikaliai pritaikyta įranga, naudojimo modeliai ir biudžeto struktūros. Mes pritaikome kiekvieną paketą pagal klubo modelį.
  items:
    - title: Universitetų ir kolegijų irklavimo klubai
      subtitle: Studentų naudojami flotiliai
      description: Studentų valdoma arba institucijų remiama irklavimo ir baidarių programa universitetų laisvalaikio skyriams. Įranga patiria didelę naudojimo dažnumą ir aukštą pasikeitimų dažnį per skirtingus įgūdžių lygius kiekvieną semestrą. Patvarumas ir lengva taisomumas yra kritiškai svarbūs, be to, svarbu draugiška kaina studentų organizacijoms.
      features:
        - Labai patvari PVC konstrukcija, skirta studentų naudojimo ciklams
        - Spalvų koduotos lentos pagal įgūdžių lygius, palengvinančias flotilės valdymą
        - Remonto rinkinys + su vaizdo pagalba prieinama su kiekvienu užsakymu
        - Nuolaidos studentų organizacijoms ir mokėjimo terminai pagal semestrą
    - title: Bendruomenės ir socialiniaiklubų klubai
      subtitle: Narystė pagrįsti poilsio klubai
      description: Bendruomenės klubai, siūlantys nariams SUP, baidarių ir socialinės irklavimo patirtis. Įrangos reikia subalansuoti tarp našumo ir komforto įvairaus amžiaus vartotojams, o ženklinimas turi skatinti klubo tapatybę ir narių pasididžiavimą. Sandėliavimo efektyvumas yra itin svarbus klubams, veikiančiams ribotose pakrantės prieigos vietose.
      features:
        - 'Mišri flotilė: universalūs SUPs, turizmo lentos ir rekreacinės baidarės'
        - 'Pilnas klubo ženklinimas: pasirinktinės spalvos, logotipo spausdinimas, pažymėti gelbėjimosi liemenės (PFD)'
        - Kompaktiški sandėliavimo sprendimai pripučiamos įrangos saugojimui
        - 'Narystės auginimo pradžios rinkinys: rekomendacijų kortelės, ženklinta fotografija'
    - title: Burlenčių mokyklos ir Burlenčių baidarių akademijos
      subtitle: Pakrantės našumas ir mokymas
      description: Burlenčių orientuotose mokyklose mokoma SUP banglenčių sportas, burlenčių baidarių sportas ir bangų važinėjimo įgūdžiai. Įranga turi tinkamai veikti bangavimo sąlygomis – būti manevringa, jautri ir pakankamai patvari, kad atlaikytų pasikartojančius kritimus, smėlio abrazyvą ir jūros druskos poveikį be greito susidėvėjimo.
      features:
        - Trumpesnės, platesnės SUP formos, optimizuotos bangų manevringumui
        - Sustiprinta borto konstrukcija smūgiams bangose atlaikyti
        - 'Burlenčių specifinė saugos įranga: susuktos virvelės, minkštos mentės pasirinkimai'
        - Flotilės keitimo programa su sezono mainų nuolaidomis
    - title: Įmonių ir privačių jachtų klubai
      subtitle: Premium klasės nario patirtis
      description: Išskirtiniai privačių klubų pasiūlymai, siūlantys vandens sportą kaip premium paslaugą nariams. Įrangos standartai yra aukšti — estetika, prekės ženklo suderinamumas ir svečiams paruošta prezentacija yra tokia pat svarbi kaip našumas. Paslaugų lūkesčiai apima baltos pirštinės pristatymą, individualius sandėliavimo sprendimus ir konsjeržo lygio palaikymą.
      features:
        - Premium apdailos lentos su medžio rašto EVA ir metaliniais akcentais
        - Pasirinktinių spalvų derinimas pagal klubo prekinio ženklo gaires
        - 'Konsjeržo pristatymas: iš anksto pripūstos, paruoštos ir pažymėtos kiekvienam sezonui'
        - Skirtas paskyros valdymas su prioritetiniu atsakymo SLA
