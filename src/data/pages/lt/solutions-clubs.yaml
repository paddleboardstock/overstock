packages_section:
  title: Klubo įrangos paketai
  subtitle: Pasirinkite tinkamą paketą pagal jūsų klubo dydį. Visi paketai apima tiesioginę kainodarą iš gamyklos, individualias prekės ženklo pritaikymo galimybes ir tarptautinį pristatymą.
  featured_label: Populiariausi
  packages:
    - name: Klubo pradininkų paketas
      description: Tinka augantiems klubams su 10-30 narių
      audience: Maži klubai ir banglenčių mokyklos
      items:
        - 10-20 SUP lentų arba baidarių
        - Irklai, pompos ir remonto rinkiniai
        - Gelbėjimosi liemenės ir apsauginė įranga (CE sertifikuota)
        - Pagrindinis logotipo ženklinimas ant lentų
        - 1 metų garantija ir techninė pagalba
      cta: Gauti pradinio paketo pasiūlymą
      ctaHref: /request-quotation
    - name: Klubo Pro paketas
      description: Tinka įsitvirtinusiems klubams su 30-100 narių
      audience: Vidutiniai klubai ir treniruočių centrai
      featured: true
      items:
        - 30-60 mišrių laivynų (SUP + baidarė)
        - Premijos irklai, aukšto našumo pompos
        - Pilnas saugumo paketas su laikymo stelažais
        - Pilnas individualus ženklinimas (lentų + pakavimas)
        - RFID nuomos sekimo sistema
        - Darbuotojų mokymai ir rinkodaros medžiaga
        - 2 metų garantija ir prioriteto aptarnavimas
        - Metinė laivyno atnaujinimo programa
      cta: Gauti Pro paketo pasiūlymą
      ctaHref: /request-quotation
    - name: Klubo Enterprise paketas
      description: Tinka dideliems klubams su 100+ narių
      audience: Dideli klubai ir daugia vietų operatoriai
      items:
        - 60-100+ mišrių laivynų su RIB pagalbiniais laivais
        - Komercinės klasės pompos, įrankiai ir atsarginės dalys
        - Pilna saugumo sistema su gelbėjimosi įranga
        - Pilnas OEM/ODM individualus gamyba
        - RFID + POS integracija
        - Mokymas vietoje ir operacijų vadovas
        - 3 metų garantija ir paskirtas paskyros vadybininkas
        - Sezoninė flotilės rotacija ir senų prekių mainų programa
      cta: Gauti įmonės pasiūlymą
      ctaHref: /request-quotation
