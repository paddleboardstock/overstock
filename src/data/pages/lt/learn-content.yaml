articles:
  sup:
    - title: SUP Pagrindai — Pradedančiojo vadovas
      desc: Viskas, ką turi žinoti pradedantysis — lentų tipai, raketės dydis, stovėjimo pozicija ir patarimai pirmai dienai.
    - title: SUP Dydžių vadovas
      desc: Raskite tinkamą lentos ilgį, plotį ir tūrį pagal savo svorį, įgūdžius ir irklavimo stilių.
    - title: Pripučiama vs kieta lenta
      desc: Kas jums tinka? Lyginama nešiojimo patogumas, našumas, patvarumas ir kaina.
    - title: Tarpiniai metodai
      desc: Pagerinkite savo irklavimą pažangiais mostais, posūkio technikomis ir bangų sąlygomis.
    - title: Kaip pasirinkti pripučiamą SUP
      desc: Naršykite pagrindinius veiksnius — konstrukciją, storį, pelekų išdėstymą ir pridedamus aksesuarus.
    - title: Vandens sauga
      desc: Būtinos saugos žinios, įskaitant orų skaitymą, PFD pasirinkimą, savęs gelbėjimą ir grupinę irklavimo praktiką.
  inflatable-boat:
    - title: Medžiagų vadovas
      desc: PVC, Hypalon, drop-stitch, denjerio įvertinimai — supraskite, iš ko pagaminta jūsų pripučiama įranga.
    - title: PVC prieš Hypalon
      desc: Išsamus PVC ir Hypalon audinių pripučiamoms valtelėms palyginimas — patvarumas, UV atsparumas ir kaina.
    - title: Drop-Stitch Branduolio paaiškinimas
      desc: Kaip tūkstančiai vidinių siūlių sukuria standžią platformą prie 12–15 PSI aukšto našumo pripučiamiems SUPs.
    - title: Pripučiamos technologijos apžvalga
      desc: Kaip yra konstruojamos pripučiamos valtys ir SUPs — nuo medžiagų sluoksniavimo iki vožtuvų sistemų ir siūlių suvirinimo.
    - title: Rigidinė pripučiama valtis (RIB) vadovas
      desc: Visa informacija apie RIB konstrukciją, korpuso tipus, vamzdžių medžiagas ir tinkamo RIB pasirinkimą pagal jūsų poreikius.
    - title: Pripučiama valtis prieš RIB
      desc: Pagrindiniai skirtumai tarp tradicinių pripučiamų valtelių ir rigidinių korpusų pripučiamų valtelių įvairiems naudojimo atvejams.
  water-safety:
    - title: Vandens saugos vadovas
      desc: Būtinos saugos žinios kiekvienam irklavimo entuziastui — oras, PFD (asmens nešiojamos plūdrumo priemonės), savęs gelbėjimas ir grupinės irklavimo taisyklės.
    - title: Gelbėjimosi liemenės ir PFD vadovas
      desc: Kaip pasirinkti tinkamą asmeninę plūdrumo priemonę SUP, baidarėms, laivybai ir profesionaliam naudojimui.
    - title: SUP saugos kontrolinis sąrašas
      desc: Prieš pradedant irkluoti, kiekvienas stovimojo irklavimo lentos naudotojas turėtų laikytis priešpradžios saugos kontrolinio sąrašo.
    - title: Šalto vandens irklavimo sauga
      desc: Būtinos atsargumo priemonės, įranga ir technikos, norint saugiai irkluoti šalto vandens sąlygomis.
    - title: Pradedančiųjų irklavimo klaidos
      desc: Dažniausiai pasitaikančios klaidos pirmą kartą irkluotojų ir kaip jų išvengti, kad patirtis būtų saugesnė ir malonesnė.
    - title: CE Sertifikavimas paaiškintas
      desc: Ką CE sertifikavimas reiškia pripučiamoms vandens transporto priemonėms — standartai, testavimas ir kodėl tai svarbu saugumui.
ui:
  read_guide: Skaityti vadovą →
  card_tech: Marine saugos inžinerija ir medžiagų testavimas
  card_products: Išnagrinėkite visą Paddle Board Overstock produktų katalogą
  card_trust: CE, ISO ir BSCI atitikimas
materials:
  intro_p1: Pripučiamo vandens transporto priemonės našumas, patvarumas ir saugumas beveik visiškai priklauso nuo medžiagų, naudotų jos konstrukcijoje. Nuo audinio, sudarančio vamzdelius, iki siūlų, kurie suteikia SUP lentai standumą, kiekvienas medžiagų pasirinkimas veikia, kaip produktas elgsis vandenyje ir kiek ilgai tarnaus.
  intro_p2: 'Šiame vadove aptariamos keturios pagrindinės šiuolaikinių pripučiamų vandens transporto priemonių medžiagos: PVC audinys, Hypalon CSM guma, drop-stitch branduolio konstrukcija ir EVA putplasčio denis. Supratimas apie šias medžiagas padės jums pasirinkti tinkamą produktą pagal poreikius ir prižiūrėti jį maksimaliai ilgam tarnavimo laikui.'
  labels:
    advantages: Privalumai
    limitations: Apribojimai
    best_for: 'Geriausiai tinka:'
  items:
    - name: PVC (Polivinilo chloridas)
      summary: Pramoginių pripučiamų valtelių ir SUPs pramonės standartas. Daugiasluoksnis laminuotas audinys suteikia puikų stiprumo ir svorio santykį už prieinamą kainą.
      pros:
        - Ne brangu — 30–50 % pigiau nei Hypalon
        - Lengvas ir lengvai valdomas
        - Geras UV atsparumas su tinkamomis dangomis
        - Platus spalvų ir apdailos pasirinkimas
        - Lengva tvarkyti su PVC pleistrais ir tirpiklio klijais
      cons:
        - Trumpesnė tarnavimo trukmė nei Hypalon (7–10 metų)
        - Mažiau lankstus šaltose temperatūrose
        - Mažesnis cheminis atsparumas
        - Laikui bėgant gali atsirasti plastifikatoriaus migracija
      best_for: Pramoginės SUPs, biudžetinės valtys, nuomai skirtos flotilės, sezoninis naudojimas, gėlas ir jūros vanduo.
    - name: Hypalon (CSM guma)
      summary: Premium sintetinis gumos sluoksnis, žinomas dėl išskirtinio patvarumo, UV atsparumo ir ilgaamžiškumo. Aukso standartas komercinėms ir karinėms pripučiamoms valtim.
      pros:
        - Išskirtinis UV ir ozono atsparumas
        - Gyvenimo trukmė 15–20 metų su tinkama priežiūra
        - Puikus lankstumas šaltame klimate
        - Aukštesnis cheminis ir alyvos atsparumas
        - Ilgiau išlaiko spalvą nei PVC
      cons:
        - Žymiai brangesnis nei PVC
        - Sunkesnė audinio masė
        - Mažiau spalvų variantų
        - Remontas reikalauja specialių klijų
        - Mažiau gamybos įmonių pasaulyje
      best_for: Komercinės RIBs, paieškos ir gelbėjimo, kariniai panaudojimai, tropiniai klimatai, ilgalaikė floto nuosavybė.
    - name: Drop-stitch šerdis
      summary: Technologija, kuri revoliucionizavo pripučiamus SUPs. Tūkstančiai poliesterio siūlų jungia viršutinį ir apatinį audinio sluoksnius, leidžiant didelio slėgio pripūtumą rigidžiam, kietam apvalkalui.
      pros:
        - Labai standus esant 12–20 PSI
        - Lengvas — 18–30 svarų pilno dydžio lentai
        - Sulankstomas plokščiai sandėliavimui ir kelionėms
        - Puikus smūgio atsparumas
        - Nuoseklus veikimas skirtingose temperatūrose
      cons:
        - Reikalauja aukšto slėgio pompos
        - Įdūrimų taisymas sudėtingesnis nei vieno sluoksnio
        - Didesnės gamybos sąnaudos nei standartiniams pripučiamiems gaminiams
        - Slėgio kritimas laikui bėgant reikalauja periodinio papildymo
      best_for: Braidymo lentos, baidarės, pripučiamos valčių grindys, bet kuri praktika, reikalaujanti rigidžių savybių ir pripučiamo pritaikomumo.
    - name: EVA putų denis
      summary: Uždarojo tipo EVA (etileno-vinilacetato) putos naudojamos traukos pado lentoms ir valtims. Suteikia amortizaciją, sukibimą ir šiluminę izoliaciją.
      pros:
        - Puikus neslydimas sukibimas drėgnas ar sausas
        - Amortizacija sumažina nuovargį ilgose irkavimo sesijose
        - Šiluminė izoliacija nuo šaltos grindų dangos
        - UV ir atsparios druskingam vandeniui
        - Galima įsigyti kelių spalvų blokų ar lazeriu graviruotus dizainus
      cons:
        - Gali dėvėtis naudojant sunkiai 2–3 metus
        - Turi būti tinkamai priklijuotas, kad būtų išvengta delaminacijos
        - Nestruktūrinis — neturi įtakos standumui
        - Šiek tiek padidina svorį (200–400 g vienai lentai)
      best_for: SUP denio sukibimas, laivo denio pagalvėlė, kanojų sėdynių patogumas, bet kokia paviršius, kuriam reikalinga neslystančia eiga.
  selection:
    title: Medžiagų pasirinkimo vadovas
    subtitle: 'Pasirinkite tinkamą medžiagą pagal pagrindinę naudojimo paskirtį:'
    headers:
      - Naudojimo dėklas
      - Rekomenduojama medžiaga
      - Kodėl
    rows:
      - - Laisvalaikio SUP irklavimas
        - Drop-stitch PVC
        - Lengva, stabili, prieinama — idealus balansas atsitiktiniams irkluotojams
      - - Šeimos valtis / ežero valtis
        - PVC (1100 denier)
        - Ekonomiška, lengva taisyti, pakankamas tvarumas rekreaciniam naudojimui
      - - Komercinė RIB / patrulinė valtis
        - Hypalon CSM
        - Maksimali UV atsparumas, 15–20 metų tarnavimo laikotarpis, atsparumas chemikalams/alieju
      - - Nuomos flotilės SUP lentos
        - Drop-stitch PVC + EVA denis
        - Patvari, tinkama taisyti, geras kainos ir kokybės santykis intensyviaam naudojimui
      - - Paieškos ir gelbėjimo operacijos
        - Hypalon CSM
        - Patikimumas ekstremaliomis sąlygomis, lankstumas šaltyje, atsparumas chemikalams
      - - Turizmo / ekspedicinių kanojų naudojimas
        - Drop-stitch PVC
        - Stabili veikla su sulankstomu nešiojimu kelionėms
  deep_dive:
    title: Giluminio nardymo vadovai
    topics:
      - title: Jūrų Klasės PVC
        desc: Daugiapluoštė laminuota PVC medžiaga — UV atsparumas, dilimo testavimas ir denier reitingai paaiškinti.
      - title: PVC prieš Hypalon
        desc: Išsamus dviejų dominuojančių pripučiamų valčių medžiagų palyginimas — kaina, tarnavimo laikas, UV atsparumas.
      - title: Drop-stitch šerdis
        desc: Kaip tūkstančiai vidinių siūlų sukuria stabilią, aukšto slėgio pripučiamą struktūrą prie 12–15 PSI.
      - title: RF suvirinimo technologija
        desc: Aukšto dažnio suvirinimas sukuria tvirtus, nuoseklius siūles — kaip tai veikia ir kodėl tai svarbu.
      - title: PSI & Našumas
        desc: Kodėl oro slėgis yra svarbus pripučiamoms SUPs ir valčių — standumas, svorio talpa ir važiavimo kokybė.
      - title: Kokybės tikrinimas
        desc: Slėgio testavimas, plūdrumo testai, UV senėjimas ir destruktyvus testavimas — mūsų kokybės procesas.
      - title: EVA Putų deniai
        desc: Uždarojo tipo EVA putų denio pagalvėlės — sukibimas, komfortas ir ilgaamžiškumas SUP ir valčių deniams.
      - title: Medžiagų priežiūra
        desc: Valymas, UV apsauga, pelėsio prevencija ir geriausios saugojimo praktikos pripučiamoms prekėms.
