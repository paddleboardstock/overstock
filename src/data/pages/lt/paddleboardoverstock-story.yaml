hero:
  tagline: Mūsų istorija
  title: Paddle Board Overstock — Inžinerinė laisvė vandenyje
  subtitle: 'Nuo pakrantės dirbtuvių iki pasaulinio jūrų gamintojo – mūsų kelionė paremta užsispyrusiu įsitikinimu: vandens transporto priemonės turi būti kuriamos taip, lyg jos būtų svarbios, nes jos tikrai svarbios.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock gamykla ir jūrų gamybos objektas Čingdao
