hero:
  tagline: Inžinerijos baltoji knyga
  title: Drop-Stitch Technologija ir Medžiagų Mokslas:<br />Šiuolaikinių pripučiamų vandens transporto priemonių inžinerija
  subtitle: Autoritetinga techninė referencija, apimanti drop-stitch pagrindinės konstrukcijos, PVC ir Hypalon medžiagų palyginimą, aukšto slėgio talpų standumo testavimą ir vandens transporto priemonių gamybos standartus.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-design-discussion-lab.webp
    alt: Paddle Board Overstock MTEP laboratorija — medžiagų testavimas ir inžinerija
direct_answer: Drop-stitch technologija naudoja tūkstančius vidinių poliesterio siūlų, jungiančių pripučiamo branduolio viršutinį ir apatinį audinio sluoksnius. Išpūtus iki 15–20 PSI, šie siūlai veikia kaip įtempio elementai, neleidžiantys išsipūsti ir sukuriantys tvirtą struktūrą, kuri prilygsta kietojo korpuso konstrukcijai. Derinant su pažangiomis PVC arba Hypalon audinių danga ir RF suvirinimu, tai leidžia pagaminti nešiojamas, aukštos kokybės pripučiamas vandens transporto priemones, tinkamas profesionaliam, komerciniam ir laisvalaikio naudojimui.
section_drop_stitch:
  title: Drop-Stitch Konstrukcinė inžinerija
  subtitle: Kaip tūkstančiai siūlų paverčia lankstų audinį į tvirtą struktūrą
  content: |
    Drop-stitch (taip pat žinomas kaip „drop-stitch audinys“ arba „drop-stitch branduolys“) reiškia proveržį pripučiamų struktūrų inžinerijoje. Principas yra apgaulingai paprastas: tūkstančiai atskirų poliesterio siūlų yra vienu metu įausti į du atskirus pagrindo audinio sluoksnius, jungianti viršutinę ir apatines plokštes 90 laipsnių kampu.

    Kai uždaras skyrius yra prispaustas, vidinis oro slėgis veikia vienodai visomis kryptimis — stengdamasis priversti viršutinę ir apatines plokštes atsiskirti į cilindrinę formą. Tūkstančiai drop-stitch siūlų atsispiria šiam atskyrimui, perduodami apkrovą įtempio kryptimi palei siūlo ašį. Rezultatas yra plokščia, tvirta plokštė, galinti atlaikyti 15–20 PSI vidinį slėgį.

    Esant 20 PSI, 1 m² drop-stitch plokštė patiria apie 14 000 kg bendros vidinės jėgos — tačiau siūlų matrica išlaiko ją tobulai plokščią. Tai suteikia drop-stitch struktūroms tokį stiprumo ir svorio santykį, kuris prilygsta tradicinėms kietosioms medžiagoms.
