section_testing:
  title: Testavimo ir saugumo protokolai
  subtitle: Paddle Board Overstockkokybės užtikrinimo sistema kiekvienai gamybos partijai
  protocols:
    - title: 1,25 karto įvertintas slėgio laikymo testas
      description: Kiekvienas surinktas indas pripučiamas iki 1,25 karto didesnio nei nurodyta darbinė slėgis ir laikomas 24–48 valandas. Bet koks slėgio kritimas, viršijantis 2%, sukelia atmetimą ir perdirbimą.
      standard: ISO 6185
    - title: Siūlės lupimo stiprumo testas
      description: Kiekvienos gamybos partijos suvirinimo ir klijavimo siūlės mėginiai tikrinami dėl atsparumo, naudojant kalibruotą įtempimo įrangą. Reikalingas minimalus atsparumas lupimui – 4 kN/m.
      standard: ISO 2411
    - title: Audinio tempimo bandymas
      description: Įeinantys audinio ritiniai yra tikrinami tempimo stiprumo ir pailginimo tiek metmenų, tiek ataudų kryptimis. Atmetimo slenkstis mažesnis nei 3 000 N/5 PVCcm .
      standard: ISO 1421
    - title: UV Pagreitintas oro poveikis
      description: Medžiagos mėginiai yra 1 000+ valandų pagreitintos UV ekspozicijos būdu apdorojami QUV bandymų kamerose. Leidžiama maksimali 15 % tempiamojo stiprumo nuostolių.
      standard: ASTM G154
    - title: Vožtuvų ir jungčių vientisumas
      description: Kiekvienas vožtuvo mazgas tikrinamas dėl sandarumo esant 1,25 karto didesniam slėgiui. Nuotėkio vožtuvai tikrinami dėl vienpusio sandariklio veikimo.
      standard: ISO 12402
section_manufacturing:
