      scope: Cheminė sauga — ribotos medžiagos medžiagose ir dangose
section_faq:
  title: Techninis DUK
  questions:
    - q: Kaip ji drop-stitch lyginama su tradicine kieto korpuso konstrukcija?
      a: Šiuolaikinės drop-stitch šerdys, kurių dydis 20, PSI pasiekia 85–90 % panašių EPS putų/stiklo pluošto kietų korpusų standumo, tuo pačiu būdamos visiškai išleidžiamos transportavimui. Kompromisas yra šiek tiek didesnis svoris ir mažesnis galutinis standumas, tačiau daugumai rekreacinių ir komercinių taikymų skirtumas yra nereikšmingas.
    - q: Koks sriegio tankis laikomas aukščiausios kokybės?
      a: Aukščiausios kokybės drop-stitch audiniai naudoja 2 siūlus kvadratiniam colyje (apie 3 100 siūlų m²), austus iš 1 680 DTEX poliesterio siūlų. Pradinio lygio audiniai naudoja 1 siūlą kvadratiniame colyje su 1 100 DTEX siūlų.
    - q: Ar Hypalon galima suvirinti taipPVC?
      a: Ne. Hypalon/CSM negali būti RF suvirintas. Jis turi būti surinktas naudojant rankomis užteptą kontaktinį cementą, kuris gamybą padaro darbo imlesnę ir siūles priklauso nuo operatoriaus įgūdžių.PVC Galima suvirinti RF arba karšto oro suvirinimu, kad būtų užtikrinta nuosekli, automatizuota siūlės kokybė.
    - q: Koks yra maksimalus saugus slėgis pripučiamoms valtims?
      a: Standartinės pripučiamos valties vamzdžiai veikia 8–12 . PSIDrop-stitch Grindys veikia 12–20 PSI. Aukšto slėgio drop-stitch šerdys (SUPs) gali veikti 20–25 PSI. Kiekvienas produktas turi slėgio mažinimo vožtuvus, sukalibruotus taip, kad būtų išvengta per didelio pripūtimo.
    - q: Kiek laiko užtrunka pagaminti individualų pripučiamą laivą?
      a: Standartinė OEM gamyba trunka 30–45 dienas nuo užsakymo patvirtinimo iki FOB Qingdao. Individualių formų kūrimas prideda 15–20 dienų prototipo gamybai ir bandymams.
