features3_solutions:
  tagline: Sprendimai
  title: Jūsų vandens nuotykis<br />Verslo partneris
  isBeforeContent: false
  columns: 3
  items:
    - title: Vandens sporto klubai
      description: Pilni įrangos paketai, pritaikytas prekės ženklo ženklinimas ir priežiūros programos SUP klubams, baidarių klubams, banglenčių mokykloms ir treniruočių centrams.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vandens sportas RIBs
      description: Specialiai sukurti RIBs burlaivių mokykloms, vandens sporto centrams ir renginių organizatoriams. Trenerių laivai, tempimo laivai ir maršalo kateriai profesionaliam vandens sportui.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Kurortai ir viešbučiai
      description: Premium klasės vandens sporto programos su įrangos flotile, saugos sistemomis, personalo mokymu ir pajamų valdymu viešbučių objektams.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Vandens prekių ženklų verslininkai
      description: Privataus prekės ženklo OEM/ODM gamyba su maža MOQs, pritaikytu produkto dizainu, pakuote ir pasauline siunta naujiems prekių ženklų savininkams.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Nardymo centrų laivai
      description: Stabilios RIB platformos su lengva įlaipinimo/išlaipinimo sistema, įrangos saugojimo galimybėmis ir variklių konfigūracijomis, optimizuotomis nardymo operacijoms.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Gelbėjimo ir avariniai vandens laivai
      description: Didelio greičio RIBs ir pripučiami laivai, skirti paieškai ir gelbėjimui, skubios pagalbos reakcijai ir pakrančių apsaugos operacijoms.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Jachtų pagalbiniai laivai
      description: Kompaktiški, stilingi RIB pagalbiniai laivai, kurie papildo prabangias jachtas ir rekreacinius laivus. Lengvas saugojimas, galingas veikimas.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Žvejybos laivų sprendimai
      description: Stabilūs, patvarūs pripučiami laivai ir RIBs, pritaikyti komercinei ir rekreacinei žvejybai.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Jūrų turizmo įranga
      description: Paruošti flotilės pripučiami valtys, SUP lentos ir baidarės kurortams, turų operatoriams ir vandens sporto įrangos nuomos verslams.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Vėlinė energija RIBs
      description: Atsparūs apkrovoms RIBs naftos ir dujų platformų palaikymui, vėjo jėgainių komandos pervežimui, povandeninių kabelių patikrinimui ir jūrų statybai.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Akvakultūros darbo valtys
      description: Korozijai atsparūs RIBs žuvininkystei, perlamutro auginimui ir jūrų fermoms. Hypalon vamzdžiai, nerūdijančio plieno įranga, kasdienio naudojimo patvarumas.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Jūrų tyrimų ir apžvalgos
      description: Stabilūs, instrumentams paruošti RIBs vandenynografiniams tyrimams, aplinkos stebėsenai, vandens kokybės mėginių ėmimui ir universitetų mokymo programoms.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komercinės darbo valtys
      description: Atsparūs apkrovoms RIBs patruliavimui, apžvalgai, transportui ir vėlinesi logistikai. Sukurta komercinių operacijų griežtiems reikalavimams.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Nežinote, kuri kryptis tinka jūsų verslui?
  subtitle: Paprašykite papasakoti apie jūsų veiklą — mes rekomenduosime tinkamą įrangos paketą, prekinio ženklo programą ar individualų sprendimą.
  actions:
    - variant: primary
      text: Gaukite nemokamą konsultaciją
      href: /contact
