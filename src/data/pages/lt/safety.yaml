certifications:
  - title: CE Sertifikavimas (ES 2016/425)
    standard: PPE reglamentas (ES) 2016/425 | EN ISO 12402
    description: Visa Aquafarer saugos įranga atitinka CE ženklinimo reikalavimus pagal Europos asmeninės apsaugos įrangos reglamentą. Kiekvienas produktas yra nepriklausomai išbandytas TÜV Rheinland, Europos pranešta institucija. Mūsų pripučiamieji laivai ir RIBs atitinka laisvalaikio laivų direktyvą 2013/53/ES (RCD) C ir D kategorijų reikalavimus.
    body: CE sertifikavimas apima pagrindinius sveikatos ir saugos reikalavimus asmeninėms plaukimo priemonėms ir pripučiamiems vandens laivams. TÜV Rheinland kasmet tikrina mūsų gamybos įrenginius, kad užtikrintų nuolatinį atitikimą.
  - title: SOLAS — Gyvybės jūroje sauga
    standard: SOLAS III skyrius | LSA kodeksas
    description: Life Vest Pro atitinka SOLAS reglamentus, skirtus offshore ir komercinėms jūrų operacijoms. Išbandytas 24 val. plūdrumo išlaikymui, automatinio pripildymo panirdamas ir veikimui jūros sąlygomis iki 5 stiprumo banga. Atitinka III skyriaus reikalavimus gelbėjimo liemenėms komerciniuose laivuose.
    body: SOLAS patvirtinimas reikalauja nepriklausomo bandymo praneštos institucijos dėl plūdrumo, stiprumo, matomumo ir automatinio aktyvavimo. Mūsų Life Vest Pro turi pilną SOLAS tipo patvirtinimą su MED sertifikavimu.
  - title: USCG III tipo / V tipo
    standard: 46 CFR 160 dalis | USCG patvirtinimas
    description: Pasirinkti Aquafarer gelbėjimo liemenės atitinka Jungtinių Valstijų pakrančių apsaugos klasifikaciją III tipo (plūduriavimo pagalba) ir V tipo (specialaus naudojimo) įrenginiams. Tinka uždaroms akvatorijoms, pakrantės kruizams ir komercinėms operacijoms, reikalaujančioms USCG patvirtintų PFD.
    body: USCG patvirtinimas reikalauja bandymo CG pripažintoje nepriklausomoje laboratorijoje. V tipo patvirtinimas apima hibridines pripučiamas konstrukcijas, kurias reikia aktyvuoti rankiniu arba automatiniu būdu.
  - title: BSCI Socialinis atitikimas
    standard: amfori BSCI elgesio kodeksas
    description: Mūsų gamykla kasmet tikrinama pagal amfori Verslo socialinio atitikimo iniciatyvą (BSCI). Tai patikrina etišką darbo praktiką, darbo vietų saugumą, sąžiningas darbo valandas ir aplinkos vadybą mūsų 12 000 m² gamybos patalpose.
    body: BSCI atitikimas yra privalomas Europos mažmenininkams ir importuotojams. Mūsų dabartinis BSCI reitingas yra "C" (geras), patikrintas SGS.
  - title: REACH & RoHS Atitiktis
    standard: ES REACH reglamentas (EB) 1907/2006 |RoHS Direktyva 2011/65/ES
    description: Visi PVC gaminiuose naudojami junginiai, klijai ir dangos Aquafarer atitinka ES REACH cheminių medžiagų saugos reikalavimus ir RoHS pavojingų medžiagų apribojimus. Kiekvienai produktų linijai yra prieinami medžiagų saugos duomenų lapai (MSDS).
    body: REACH atitiktis užtikrina, kad jokios ribotos SVHC medžiagos neviršytų ribinių ribų. Reguliarūs trečiųjų šalių laboratoriniai tyrimai patvirtina nuolatinę atitiktį kiekvienai gamybos partijai.
  - title: ISO 9001:2015 Kokybės valdymas
    standard: ISO 9001:2015 |TÜV Reino kraštas sertifikuotas
    description: Mūsų kokybės valdymo sistema yra ISO 9001:2015 sertifikuota TÜV Rheinland, apimanti projektavimą, gamybą, testavimą ir aptarnavimą po pardavimo. Kasmetiniai stebėsenos auditai užtikrina nuolatinį tobulinimą ir procesų kontrolę.
    body: ISO 9001 sertifikavimas reikalauja dokumentuotos kokybės politikos, vidinių auditų, vadovų peržiūrų, korekcinių veiksmų procedūrų ir sekamų gamybos įrašų.
testimonial:
  quote: Mes įsigijome saugos įrangą iš kelių tiekėjų visoje Azijoje.Aquafarer yra vienintelis gamintojas, kuris iš CE anksto pateikė pilną dokumentaciją SOLAS , sertifikatus ir trečiųjų šalių testų ataskaitas – be prašymo.
  author: Erikas Lindströmas
  title: Saugos pareigūnas
  company: Baltijos jūrų tiekimas
  location: Suomija
content_overpressure:
  tagline: Viršslėgio sauga
  title: RIB Vamzdelio slėgis<br />Valdymas karštame klimate
  subtitle: Pripučiamo vamzdžio slėgis didėja didėjant temperatūrai. Per didelio slėgio supratimas ir valdymas apsaugo nuo pažeidimų ir užtikrina saugų veikimą tropinėse ir dykumų aplinkose.
  items:
    - title: Boyle slėgio atleidimo vožtuvai
      description: Aquafarer RIB Vamzdeliai aprūpinti per didelio slėgio išleidimo vožtuvais, kurie automatiškai išleidžia perteklinį slėgį virš nominalios ribos. Apsaugo nuo siūlės įtempimo ir galimo vamzdžių sprogimo dėl saulės šildymo.
      icon: tabler:gauge
    - title: Slėgio pokytis nuo ryto iki vidurdienio
      description: Vamzdelis, pripūstas iki 3,5 °C PSI esant 20°C, gali pasiekti 4,5 °C+ PSI esant 40°C saulės spinduliams. Visada pripūskite iki rekomenduojamo intervalo apatinės ribos karštame klimate ir leiskite slėgio vožtuvui valdyti perteklinį slėgį.
      icon: tabler:sun
    - title: Rekomenduojamas darbinis slėgis
      description: 'PVC Vamzdžiai: 3.0-3.5 PSI veikimo, 4.5 PSI max. Hypalon Vamzdelių: 3.5-4.0 PSI veikimo, 5.0 PSI max. Visada matuokite 1.25x įvertintą (4.4 PSI , PVC5.0 PSI ) Hypalonpagal Aquafarer kokybės kontrolės standartus.'
      icon: tabler:chart-bar
    - title: Saulės poveikio geriausios praktikos
      description: Laikykite RIBs pavėsyje, kai nenaudojate. Naudokite UVapsauginius dangčius ilgesniam inkaravimui. Patikrinkite ir reguliuokite vamzdžio slėgį prieš ir po piko saulės valandų. Niekada neviršykite maksimalaus leistino slėgio.
      icon: tabler:umbrella
    - title: Avarinis slėgio sumažinimas
      description: Jei vamzdelis atrodo per kietas arba išleidimo vožtuvas išleidžia orą, išleiskite orą per Halkey-Roberts arba karinį vožtuvą, kol slėgis grįš į darbinį diapazoną. Nešiokitės slėgio matuoklį tiksliems rodmenims.
      icon: tabler:alert-circle
