hero:
  tagline: Saugumas
  title: Saugos standartai ir sertifikavimas
  subtitle: Kiekvienas Aquafarer produktas patiria griežtus bandymus, ir 64 CE sertifikuoti modeliai atitinka tarptautinius saugos standartus laisvalaikiui ir profesionaliam naudojimui. ISO 9001 sertifikuota gamykla.
