content_challenge:
  tagline: Iššūkis
  title: Jachtų prieplaukos valtys reikalauja<br />Veikimo ir išvaizdos
  subtitle: Jachtos prieplaukos valtis yra daugiau nei mažoji valtis — tai pagrindinės jachtos pratęsimas ir kokybės ženklas.
  paragraphs:
    - Jachtos savininkams ir kapitonams reikia valtis, kurios gerai veikia, užima mažai vietos ir estetiškai atrodo. Prieplaukos valtis turi papildyti jachtos estetiką, tuo pačiu užtikrinant patikimą transportavimą svečiams ir įgulai.
    - '**Sandėliavimas yra kritiškai svarbus** — valtis turi tilpti ant denio, garaže arba ant davitų. Svoris yra svarbus paleidimo ir pakėlimo sistemoms. Paddle Board Overstock RIBs pasižymi puikiu galios ir svorio santykiu su kompaktiniu sandėliavimo profiliu.'
    - '**Veikimo lūkesčiai yra aukšti** — svečiai tikisi sklandaus, sauso plaukimo, perkeliamiesiems į krantą. Variklio parinktys turi suderinti greitį, nuotolį ir triukšmo lygį, kad būtų užtikrinta aukščiausio lygio patirtis. Nuomos operacijoms valtis naudojama kasdien ir turi atlaikyti dažną naudojimą.'
    - '**Išvaizda yra svarbi** — netinkamai parinkta ar nudėvėta valtis gadina bendrą jachtos įvaizdį. Individualiai parinktos vamzdžių spalvos, apmušalai ir prekės ženklo elementai užtikrina, kad valtis atrodytų tarsi priklausanti jachtai.'
content_solution:
  tagline: Mūsų sprendimas
  title: Prieplaukos valčių konfigūracijos<br />Kiekvienai jachtos paskirčiai
  subtitle: Paddle Board Overstock RIB prieplaukos valtys gali būti pritaikytos pagal jūsų laivo tipą, operacijos specifiką ir sandėliavimo reikalavimus — nuo superjachtų statytojų specifikacijų iki nuomos flotilės programų.
  list:
    - Individualios vamzdžių spalvos, pritaikytos prie pagrindinės valtės arba ją papildančios — bet kokia RAL spalva galima Hypalon arba PVC vamzdžiams
    - Individualūs apmušalai ir siuvimas — aukščiausios kokybės jūrinis vinilas su spalvų derinimu ir logotipo siuvinėjimu
    - Konsolės arba vairuotojo vairavimas — pasirinkite pagal naudojimo režimą ir operatoriaus pageidavimą
    - Stiklo pluošto deep-V korpusas sklandžiam, sauso plaukimo pojūčiui įvairiomis jūrų sąlygomis
    - Kompaktiškas sandėliavimas — defliacijos arba lizdai terasos garažui, spintelėms ar kranų saugojimui
    - Hypalon vamzdeliai UV atsparumui ir ilgalaikei išvaizdos išsaugojimui
    - Pakėlimo taškai ir vilkimo žiedai yra standartiniai visuose modeliuose
    - Pasirenkamas lanko uždangalas, pilnas uždangalas ir apsauginės trinties apsaugos
    - 'Variklių diapazonas: nuo 15 HP iki 60 HP — išorinės arba vairo valdymo konfigūracijos'
    - OEM/privatus ženklinimas prieinamas jachtų statytojams ir jūrų pardavėjams
content_segments:
  tagline: Klientų profiliai
  title: Jachtų pagalbiniai laivai<br />Pagal kliento tipą
  subtitle: Skirtingi jachtų pramonės segmentai turi unikalius reikalavimus.Paddle Board Overstock Konkursai konfigūruojami pagal kiekvieną paraišką.
  items:
    - title: Superjachtų statytojai
      subtitle: OEM Tenderio integracija — individualūs matmenys, spalvos ir medžiagos
      description: 'Jachtų statytojai susiduria su pasikartojančiu iššūkiu: kiekvienas naujas laivas turi unikalius matmenų, svorio apribojimus ir estetinius lūkesčius. Tenderis turi puikiai integruotis su motininio laivo kranų sistema, tilpti į tikslius garažo matmenis ir atitikti daugiamilijoninės jachtos dizaino kalbą. Bet koks neatitikimas – neteisinga vamzdžio spalva, neteisingas pakėlimo taško išdėstymas, nesuderinamas svoris – vėluoja pristatymą ir blogai atspindi statytoją.Paddle Board Overstock Tiesiogiai bendradarbiauja su statytojų pirkimų ir projektavimo komandomis, kad pateiktų konkursus su individualiomis RAL vamzdžių spalvomis, atitinkančia apmušalais, prekės ženklu pažymėtomis konsolės plokštėmis ir pilnais OEM dokumentacijos paketais.'
      features:
        - Individualios matmenų specifikacijos, atitinkančios garažo ir krano apribojimus
        - Bet kokios RAL tūbelės spalva ir atitinkama apmušalų apdaila — pateikti dizaino patvirtinimo pavyzdžiai
        - OEM Ženklinimas ant konsolių, vamzdžių ir sėdynių atlošų
        - Pakėlimo taško ir davitų pritaikymo patvirtinimas kiekvienam modeliui
        - Korpuso svoris, optimizuotas nurodytoms paleidimo ir gelbėjimo sistemoms
        - Didelio kiekio pristatymo grafikas, suderintas su gamybos terminais
    - title: Jachtų valdymo įmonės
      subtitle: Standartizuoti parko konkursai — pasaulinė parama, minimalus prastovų laikas
      description: Valdymo įmonės prižiūri kelias jachtas, veikiančias Viduržemio jūroje, Karibuose, Pietų Ramiajame vandenyne ir už jos ribų. Jų pagrindinis poreikis yra patikimumas – sugedęs laivas atokiame uoste reiškia įgulos viršvalandžius, svečių skundus ir brangius paskutinės minutės pakeitimus. Standartizuotos laivyno specifikacijos sumažina įgulos mokymo laiką įvairiuose laivuose ir supaprastina atsarginių dalių valdymą.Paddle Board Overstock Siūlo daugialaivių laivyno kainas, nuoseklias specifikacijas tarp užsakymų ir pasaulinę atsarginių dalių paramą valdymo įmonėms, turinčioms laivus keliuose regionuose.
      features:
        - Standartizuotos specifikacijos visam valdomam parkui
        - Keičiamos atsarginės dalys visuose parko tenderiuose
        - Automobilių parko kainos ir didmeninės nuolaidos daugiabučių užsakymams
        - Pasaulinis atsarginių dalių prieinamumas — greitas pristatymas į bet kurį uostą
        - Nuosekli įgulos aptarnavimo ir priežiūros dokumentacija
        - Daugiapadalinių pristatymo koordinavimas į skirtingas laivų vietas
    - title: Jachtų nuomos operatoriai
      subtitle: Didelio dažnio kasdienės operacijos — ilgaamžiškumas nepažeidžiant išvaizdos
      description: 'Nuomos tenderiai susiduria su sunkiausiu jachtų pramonės veiklos grafiku: kasdieniais svečių pervežimais, kelionėmis į krantą, vandens sporto palaikymu ir uosto aptarnavimo užduotimis – dažnai 200+ operacijų per nuomos sezoną. Tenderis turi atrodyti nepriekaištingai kiekvieno svečio perdavimo metu, atlaikant nuolatinį įlaipinimą, sūraus vandens poveikį ir variklio valandas. Išvaizdos blogėjimas yra tiesioginė verslo problema – nusidėvėjęs tenderis veikia svečių atsiliepimus ir nuomos kainas.Paddle Board Overstock Nuomos tenderiai konfigūruojami su atnaujinta apmušalais, tvirtais Hypalon vamzdžiais ir sustiprintomis tvarkymo zonomis, užtikrinančiomis ilgalaikį patvarumą ir išlaikant pristatymo kokybę.'
      features:
        - Sunkiasvoris Hypalon vamzdis — 5–8 metų tarnavimo laikas kasdieniuose užsakomuosiuose reisuose
        - Sustiprinti įlaipinimo laiptai ir laikymo lynai dažnam naudojimui
        - Aukščiausios kokybės, dėmėms atspari vinilo apdaila – lengvas valymas tarp užsakymų
        - Lengvai valomi neslystantys denio paviršiai
        - Patikimi išoriniai paketai su patogiu aptarnavimu greitam aptarnavimui
        - Kosmetinės kokybės medžiagos, kurios išlaiko išvaizdą per visus užsakomuosius sezonus
    - title: Jachtų pardavėjai ir brokeriai
      subtitle: Patikimas tenderio tiekimas laivų užbaigimui ir perpardavimo vertei
      description: Prekybininkams ir brokeriams reikia stabilaus kokybiškų tenderių tiekimo, kuris papildytų jų parduodamus laivus – atitiktų prekės ženklo pozicionavimą ir pagerintų pirkėjo patirtį. Nenuoseklus tenderis ar tiekimo vėlavimas gali atidėti jachtos perdavimą arba sumažinti pardavimo pristatymą. Prekybininkams reikalinga nuosekli kokybė visose partijose, patikimi pristatymo terminai ir konkurencingos kainos, kad išlaikytų pelningumą.Paddle Board Overstock Siūlo pardavėjams inventoriaus programas su sezoniniu pristatymo grafiku, bendro prekės ženklo galimybėmis ekspozicijų ekspozicijoms ir prioritetiniu paskirstymu piko sezono metu.
      features:
        - Atsargų užpildymo programos su pagal poreikį prieinamais modeliais
        - Sezoninis pristatymo grafikas, suderintas su perdavimo kalendoriumi
        - Atstovų bendras ženklinimas konsolėje ir vamzdeliuose ekspozicijų ekspozicijai
        - Nuosekli kokybė ir specifikacija visuose partijų užsakymuose
        - Konkurencinga prekybininkų kainodara su apimties pagrindu veikiančiu lygiu
