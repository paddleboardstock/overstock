tests:
  - title: Slėgio Testavimas
    standard: ISO 6185-1 | Vidinė specifikacija AF-PT-001
    description: Pripučiamos kameros yra slėgiuojamos 1,25 karto virš rekomenduojamos veikimo ribos ir laikomos 30 minučių. Slėgio mažėjimas matuojamas siekiant patikrinti sandarumą ir medžiagų bei siūlių konstrukcinį vientisumą.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Poveikio testavimas
    standard: Vidinė specifikacija AF-IT-002
    description: Produktai patiria kontroliuojamus smūgius iš standartizuotų kritimo svorių ir švytuoklės įrangos. Tai vertina atsparumą pradurimams, plyšimų plitimą ir konstrukcinį atsparumą susidūrimams su kliūtimis, dokais ir nuolaužomis.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Atsparumo testavimas
    standard: ASTM G154 |ISO 4892-3
    description: Medžiagos mėginiai yra veikiami UVA-340 lempų pagreitintose oro sąlygų kamerose 1 000+ valandų. Mes matuojame spalvos pokytį (Delta E), blizgesio išlaikymą ir tempiamojo stiprumo nuostolius, kad patvirtintume UV stabilizatorių paketus.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Atsparumas trinties testavimui
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Medžiagos mėginiai apdorojami CS-10 abrazyviniais ratais, veikiant 500g/1 000g apkrovai 1 000 ciklų. Masės praradimas ir vizualinis nusidėvėjimas lemia dangos patvarumą smėliui, žvyrui ir pakartotiniam paleidimui.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Žemos temperatūros našumo testavimas
    standard: Vidinė specifikacija AF-LT-003 | MIL-STD-810G
    description: Surinkti produktai ir medžiagų kuponai kondicionuojami -20°C, -10°C ir 0°C temperatūroje 24 valandas, po to testuojami lanksčiai. Mes tai patikriname PVC ir Hypalon išliekame lankstūs, nesutrūkinėdami ar nesiskeldami.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Plūdrumo ir apkrovos talpos testavimas
    standard: ISO 6185-1 |ISO 12402
    description: Produktai yra palaipsniui apkraunami iki 1,25 karto nominalios talpos kontroliuojamame baseine. Fiksuojamas laisvas bortas, stabilumas ir savaime ištuštėjantis veikimas. Kiekvieno modelio nominali talpa yra matematiškai ir empiriškai patvirtinta.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Manevringumo testavimas
    standard: Vidinė specifikacija AF-MT-004
    description: Vandens bandymai matuoja posūkio spindulį, pagreitį, planavimo laiką ir irklų/variklių atsaką įvairiomis apkrovos sąlygomis. Realios valdymo charakteristikos yra patvirtinamos pagal projektinius tikslus.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Sandarumo testavimas
    standard: ISO 6185-1 §7.3 | Vidinė specifikacija AF-WT-005
    description: Kiekvienas surinktas produktas yra purškiamas 0,5 bar temperatūroje visuose siūlėse, vožtuvuose ir jungtyse. 5 minučių slėginio panardinimo testas patvirtina kameros ir vožtuvo sandarumą. Prieš išsiuntimą taikomas nulio nuotėkio standartas.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
