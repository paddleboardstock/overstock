hero:
  tagline: Vandens tyrinėjimų žinios
  title: Mokykis
  subtitle: |
    Vadovai, pamokos ir gilios analizės — viskas, ko reikia tyrinėti<br />
    plaukti su pasitikėjimu. Nuo pirmojo SUP pasirinkimo iki pažangių technikų įvaldymo.
  taglineSection: Žinios kiekvienam irkluotojui. Nuo pradedančiojo iki profesionalo.
featured:
  tagline: Pasiūlytos temos
  title: Pradėkite savo mokymosi kelionę
  subtitle: Nesvarbu, ar esate naujokas vandens sporte, ar norite pakelti įgūdžių lygį, mūsų gidai jums padės.
  items:
    - title: SUP Pagrindai
      description: Viskas, ką turi žinoti pradedantysis — lentų tipai, raketės dydis, stovėjimo pozicija ir patarimai pirmai dienai.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Pripučiama vs kieta lenta
      description: Kuris jums tinkamiausias? Mes palyginame nešiojamumą, našumą, patvarumą ir kainą šalia vienas kito.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Vandens sauga
      description: Esminės saugos žinios, kurias turi turėti kiekvienas irklavimo entuziastas — oras, gelbėjimosi liemenės, savisauga ir dar daugiau.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Medžiagų vadovas
      description: PVC prieš Hypalon, drop-stitch technologija, atsparumo įvertinimai — supraskite, iš ko pagaminta jūsų įranga.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Dydžių vadovas
      description: Raskite tinkamą lentos ilgį, plotį ir tūrį pagal savo svorį, įgūdžius ir irklavimo stilių.
      icon: tabler:ruler
      href: /size-guide
    - title: Tarpiniai metodai
      description: Pagerinkite savo irklavimą pažangiais mostais, posūkio technikomis ir bangų sąlygomis.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
