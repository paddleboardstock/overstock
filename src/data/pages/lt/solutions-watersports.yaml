content_challenge:
  tagline: Iššūkis
  title: Vandens sporto veikla<br />Paklausos universalumas RIBs
  subtitle: Buriavimo mokykloms, vandens sporto centrams ir renginių organizatoriams reikia valčių, galinčių atlikti kelias funkcijas – treniravimą, tempimą, saugumą ir transportą – dažnai per kelias valandas keisdamos funkcijas.
  paragraphs:
    - Vandens sportas yra viena įvairiausių jūrų pramonės šakų – apimanti buriavimo mokymus, motorines veiklas, tokias kaip vandenlenčių sportas ir vandens slidinėjimas, bei varžybinius renginius visais lygiais. Kiekvienai programai reikalingos skirtingos laivų galimybės, tačiau daugeliui operatorių reikia vienos flotilės, galinčios atlikti kelias funkcijas kasdieniame tvarkaraštyje.
    - '**Buriavimo mokykloms** reikia trenerio, RIBs kuris būtų pakankamai stabilus, kad instruktoriai galėtų stovėti ir demonstruoti, pakankamai greitas, kad greitai pasiektų apvirtusius buriuotojus, ir pakankamai tvirtas pakartotiniams išsilaipinimams paplūdimyje. Laivas turi būti matomas, manevringas siaurose prieplaukos erdvėse ir galintis tempti burlaivius atgal į krantą, kai vėjas nurimsta.'
    - '**Vandens sporto centrai** bėgimo vandens slidinėjimui, vandenlenčių sportui ir tempiamiems vamzdiniams vamzdeliams reikalauja specialiai sukurtų vilkimo valčių su pastoviomis bangos savybėmis, stipriu šoniniu pagreičiu ir išplėstu kuro diapazonu dviejų iš eilės važiuotojų sesijoms. Stabilumas esant mažam greičiui yra kritiškai svarbus važiuotojo pakėlimui ir saugumo stebėsenai.'
    - '**Renginių organizacijos**, valdančios regatas, triatlonus ir vandens sporto varžybas, reikalauja maršalų ir saugos valčių, galinčių patruliuoti trasų ribas, vykdyti taisyklių laikymąsi, reaguoti į ekstremalias situacijas ir transporto pareigūnus — visa tai išlaikant profesionalią išvaizdą ir patikimą pasirodymą per daugiadienius renginius.'
    - Visų trijų segmentų bendras bruožas – poreikis būti universaliam, patvariam ir profesionaliai aprūpintam RIBs , kad galėtų veikti įvairiomis sąlygomis su minimaliu prastovų laiku.Aquafarer Stato vandens sporto sistemas, RIBs pritaikytas kiekvienai iš šių specifinių funkcijų.
content_solution:
  tagline: Mūsų sprendimas
  title: Vandens sportas RIBs<br />Sukurta kiekvienam vaidmeniui
  subtitle: Aquafarer Vandens sportas RIBs suprojektuotas modulinėmis konfigūracijomis, leidžiančiomis vienai valčių platformai atlikti įvairias funkcijas visoje jūsų veikloje.
  list:
    - Stabilus korpuso dizainas — instruktoriai gali stovėti ir judėti užtikrintai, mokydami iš valties
    - Vilkimo stulpai ir vilkimo lynų tvirtinimo taškai vandens slidinėjimui, vandenlenčių sportui ir vamzdžių vilkimui
    - Greitas pagreitis su tinkamu variklio ir korpuso suderinimu vandens sporto tempimui
    - Profesionalūs sėdimų vietų išdėstymai instruktoriui, treneriui ar oficialiam komfortui ilgų sesijų metu vandenyje
    - Pilna konsolė su priekiniu stiklu, navigacijos elektronika, VHF radiju ir saugos įrangos saugykla
    - Hypalon PVC Jūrinės klasės vamzdeliai — UV ir atsparūs sūriam vandeniui ilgesniam tarnavimo laikui
    - Neslystanti denio danga — saugus įgulos judėjimas, kai deniai sušlapę nuo purslų ar raitelių atgavimo
    - Individualūs ženklinimo ir lipdukų rinkiniai – atitinka jūsų mokyklos, centro ar renginio spalvas
    - Kranų kėlimo taškai ir paplūdimio nusileidimo stiprinimas kasdieniam paleidimui ir atstatymui
    - Ekonomiškos 4 taktų išorinės konfigūracijos, skirtos ilgesnėms kasdienėms darbo valandoms
content_segments:
  tagline: Vandens sporto profiliai
  title: RIB Sprendimai<br />Pagal vandens sporto tipą
  subtitle: Skirtingos vandens sporto operacijos reikalauja skirtingų valčių konfigūracijų – kiekvieną pritaikome RIB konkrečiam vaidmeniui, kurį ji atliks.
  items:
    - title: Buriavimo mokyklos ir mokymo centrai
      subtitle: Treneris RIBs buriavimo mokymams, saugos apsaugai ir burlaivių vilkimui
      description: Buriavimo mokyklos veikia apsaugotose įlankose, ežeruose ir pakrančių vandenyse – visus metus organizuoja mokymus pradedantiesiems ir pažengusiems buriuotojams. Treneris RIB tarnauja kaip mobili mokymo platforma, saugos laivas ir vilkimo valtis. Instruktoriams reikia stabilios terasos, kur galėtų stovėti ir demonstruoti, greito reagavimo, kad pasiektų apvirtusius mokinius, ir tvirtos konstrukcijos kasdieniams išsilaipinimams paplūdimyje bei manevravimui prieplaukoje. Patikimumas yra svarbiausias – sulūžęs ekonominis laivas reiškia atšauktas pamokas ir nusivylusius mokinius. Valtis taip pat turėtų atrodyti profesionaliai, atspindinti mokyklos kokybę.
      features:
        - Stabili platforma su žemu bortu dėstytojo ir studento bendravimui iš arti
        - Neslystantis denis ir griebimo turėklai instruktoriaus saugumui stovint ir judant
        - Vilkimo stulpas ir pavadėlis sugrąžinant sugedusius burlaivius į krantą
        - Greito planavimo korpusas greitam reagavimui į apvirtusius ar dreifuojančius studentus
        - Kompaktiškas ilgis (4,3–5,2 m) patogiam vežimui ir laikymui tarp sezonų
        - Ryškios spalvų parinktys lengvam stebėjimui treniruočių aikštelėje
        - Propelerio apsaugos galimybės mokinių saugumui manevruojant artimoje distancijoje
    - title: Vandens sporto centrai ir vilkimo operatoriai
      subtitle: Vilkimas RIBs vandens slidinėjimui, vandenlenčių sportui ir pripučiamiems vamzdiniams važiavimams
      description: Vandens sporto centrai, veikiantys ežeruose, upėse ir pakrančių ruožuose, kasdien vykdo didelio masto vilkimo operacijas – vandens slidinėjimą, vandenlenčių sportą, kelio lentas ir traukimo metro važiavimus turistams ir vietiniams gyventojams. Vilkimo valtis turi turėti nuoseklias bangos savybes, stiprų pagreitį, kad keleiviai greitai įliptų į lėktuvą, ir stabilų žemo greičio valdymą keleiviams pasiimti ir atsigauti po kritimo. Šios valtys plaukioja sekliuose vandenyse prie krantų, todėl reikia sustiprinto korpuso ir sraigto apsaugos. Kuro efektyvumas svarbus, kai kasdien važiuojama iš eilės 8–10 valandų. Valtis taip pat tarnauja kaip saugumo platforma – veža vairuotoją, stebėtoją ir kartais autobusą – ir atrodo patraukli mokantiems klientams.
      features:
        - Specialiai pritaikyta variklio galia stipriam šūviui iš skylės ir pastoviam tempimo greičiui
        - Vilkimo stulpai ir virvės tvirtinimo taškai išdėstyti optimaliam raitelio traukos kampui
        - Sklandus, nuspėjamas pėdsakas patogiam ir saugiam vairuotojui
        - Žemo greičio stabilumas saugiam vairuotojo pakilimui ir kritimo atsigavimui
        - Sustiprintas kilis ir korpusas dažnoms paplūdimio ir seklaus vandens operacijoms
        - Propelerio tunelis arba apsauga sekliose veikimo zonose
        - Padidinta kuro talpa 6–8 valandoms nuolatinio vilkimo operacijų
        - Vairuotojo ir stebėtojo sėdynės su aiškia matomumu į raitelį bet kuriuo metu
    - title: Įvykių ir varžybų organizacijos
      subtitle: Maršalo, saugumo ir oficialaus transporto RIBs jūrų renginiams
      description: Regatos organizatoriai, triatlono lenktynių vadovai ir vandens sporto varžybų koordinatoriai turi patikimus, profesionaliai atrodančius RIBs kursų valdymui, saugumui ir oficialiam transportui. Šie laivai patruliuoja trasos ribose, užtikrina varžybų taisyklių laikymąsi, suteikia pirmąją medicinos pagalbą ir transportuoja teisėjus bei žiniasklaidos atstovus. Renginiai vyksta bet kokiu oru — vėjas, bangavimas ir srovės reikalauja stabilaus valdymo ir patikimos veiklos. Laivų išvaizda svarbi, nes ji reprezentuoja renginio prekės ženklą dalyvių, žiūrovų ir žiniasklaidos akivaizdoje. Daugiadieniai renginiai reikalauja laivų, kurie galėtų dirbti diena iš dienos, turint minimalų priežiūros pertraukų laiką.
      features:
        - Stabili korpusas stovintiems pareigūnams ir saugiam kameros naudojimui bet kokiomis sąlygomis
        - Pilna navigacijos įranga — GPS žemėlapių spausdintuvas, VHF radijas ir navigacijos žibintai ankstyvais rytais ir vėlai vakare
        - Pirmosios pagalbos medicinos priemonių saugykla skubiai pagalbai
        - Profesionalūs prekės ženklo ir lipdukų paketai renginio rėmėjų matomumui
        - Įvairios sėdynių konfiguracijos pareigūnams, žiniasklaidai ir medicinos darbuotojams
        - Greitas planavimo greitis greitam trasos perkėlimui ir skubiai pagalbai
        - Apsauginė konsolė nuo oro sąlygų ir vėjo stiklas patogumui ilgoje vandens budėjimo trukmėje
        - Patvari vamzdinė konstrukcija kontaktui prie uosto perpildytose renginių marinose
