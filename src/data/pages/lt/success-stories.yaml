stories:
  - title: Kaip Viduržemio jūros kurortas sukūrė pelningą SUP nuomos verslą
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5 žvaigždučių paplūdimio kurortas — Graikija
    problem: Kurortui reikėjo aukščiausios kokybės svečių vandens pramogų, siekiant padidinti pasitenkinimo rodiklius ir sukurti naują pajamų srautą, tačiau trūko įrangos, saugos infrastruktūros ir darbuotojų patirties.
    solution: Aquafarer pristatė 50 nuožmiai ženklintų SUP lentų kurorto spalvų ir logotipo deriniu, pilną saugos sistemą, įskaitant gelbėtojų postą ir bortelių linijas, bei trijų dienų darbuotojų mokymo programą, apimančią įrangos naudojimą, svečių instruktažą ir saugos protokolus.
    result:
      - Pirmą mėnesį užregistruota 300+ savaitinių svečių veiklų
      - 'Svečių pasitenkinimas vandens pramogomis: 4.8/5'
      - 'Naujos metinės papildomos pajamos: 180 tūkst. USD'
      - Pirmąjį veiklos sezoną neįvyko jokių saugos incidentų
      - Įrangos pakeitimo kaina sumažinta 40% lyginant su ankstesniu tiekėju
    quote:
      text: Aquafarer ne tik pristatė lentas — jie padėjo mums sukurti visą svečių patirtį. Mūsų vandens sporto programa vieno sezono metu tapo kurorto akcentu.
      author: Kurorto generalinis direktorius
    cta_text: Sukurkite savo kurorto sprendimą
    cta_href: /solutions/resorts
  - title: Kaip Australijos startuolis sukūrė vandens prekės ženklą per 90 dienų
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Pradedantysis verslininkas — Australija
    problem: Lauko entuziastas norėjo pradėti savo SUP prekės ženklą Australijos rinkai, bet neturėjo gamybos patirties, tiekėjų ryšių ir turėjo ribotą kapitalą.
    solution: „Aquafarer“ Prekės Ženklo Paleidimo Paketas suteikė produktų pasirinkimo konsultaciją, individualų logotipų ir spalvų dizainą, prekės ženklo mažmeninės pakuotės su etiketėmis, CE sertifikavimo dokumentaciją ir FOB išsiuntimą į Sidnėjų.
    result:
      - Pirmasis 200 lentų siuntos pristatymas įvyko per 75 dienas nuo pirmojo kontakto
      - Prekės ženklas paleistas Shopify ir + Amazon AU per 2 savaites nuo atvykimo
      - Pradinis inventorius parduotas per 45 dienas
      - 'Vidutinė marža: 55% nuo mažmeninės kainos'
      - 'Antrasis užsakymas: 500 vienetų užsakytas per 60 dienų nuo paleidimo'
    quote:
      text: Turėjau idėją dėl prekės ženklo, bet neturėjau gamybos žinių. Aquafarer tiesioginiame procese lydėjo mane nuo tinkamo lentos dizaino pasirinkimo iki pirmos siuntos atidarymo. 90 dienų nuo svajonės iki pristatymo.
      author: Įkūrėjas, Australijos SUP Prekės Ženklas
    cta_text: Paleiskite savo prekės ženklą
    cta_href: /solutions/entrepreneurs
  - title: Kaip Tailando paplūdimio klubas išplėtė nuo 10 iki 80 lentų
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Vandens sporto klubas — Tailandas
    problem: Mažas paplūdimio SUP klubas Pukete turėjo pereiti nuo hobio veiklos prie profesionalios nuomos įmonės, teikiančios paslaugas turistams, tačiau nesugebėjo rasti patikimo įrangos tiekėjo su nuolatine kokybe ir kainomis.
    solution: Pradėję nuo Aquafarer „Klubo pradžios paketo“ (10 lentų, irklų, saugos įrangos, prekės ženklo), klubas augo per 18 mėnesių su „Premium paketo“ programa.
    result:
      - Per 18 mėnesių išplėtė nuo 10 iki 80 lentų, išlaikant nuolatinę kokybę ir kainas
      - Įtraukė baidarių ir pedalinių valtelių nuomą naudojant tą patį tiekėją
      - Individualus klubo prekės ženklas padidino turistų prekinio ženklo atpažinimą
      - Priežiūros išlaidos sumažėjo 60% palyginti su ankstesnės įrangos biudžetu
      - Dabar kasdien aptarnauja 150+ nuomų pikų metu
    quote:
      text: „Klubo pradžios paketas“ buvo puiki pradžio pradžią. Kai mūsų verslas augo, Aquafarer augo kartu su mumis — ta pati kokybė, tos pačios kainos, jokio siurprizo.
      author: Klubo savininkas, Puketas
    cta_text: Pradėkite savo klubo paketą
    cta_href: /solutions/clubs
  - title: Kaip Karibų kurortų tinklas standartizavo vandens sportą penkiose vietose
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Kurortų tinklas — Karibai
    problem: Prabangus kurortų tinklas, turintis 5 objektus, reikėjo nuolatinės vandens sporto įrangos kokybės ir prekės ženklo visose vietose, su centralizuota pirkimų valdymu ir sezono pakaitalų planavimu.
    solution: 'Aquafarer pristatė daugelio objekto flotilę: 300 SUPs ir 100 baidarių su vieningu prekės ženklu, bendru atsarginių dalių inventoriu ir metiniu pakeitimo grafiku su kiekybiniu kainų nustatymu.'
    result:
      - Standartizavo svečių patirtį visose 5 vietose
      - 30% sąnaudų sumažinimas per konsoliduotus pirkimus ir kiekybinį kainų nustatymą
      - Centralizuotas atsarginių dalių inventorius sumažino prastovą 80%
      - Metinė įrangos atnaujinimo programa pašalino sezono pabaigos skubėjimą
      - Svečių dalyvavimas vandens sporte padidėjo 45% per metus
    cta_text: Sukurkite savo kurorto programą
    cta_href: /solutions/resorts
