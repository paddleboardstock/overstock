features3_cases:
  tagline: Išskirtiniai atvejai
  title: Individualūs sprendimai<br />Tikriems iššūkiams
  isBeforeContent: false
  columns: 3
  items:
    - title: Balio nardymo centro kasdienės veiklos atnaujinimas
      customer: Mėlynojo vandenyno nardymo centras
      country: Indonezija
      industry: Komercinis nardymo centras
      challenge: Blue Ocean Diving Center Balio saloje valdė senesnį stiklo pluošto nardymo laivą su ribota denio erdve, sudėtingu nardymo įlipimu ir dideliu priežiūros lygiu tropinėse sūraus vandens sąlygose. Įrangos krovimas buvo perpildytas, pasiruošimo laikas ilgas, o nestabili platforma kėlė saugumo problemų tarptautiniams turistams – įskaitant pirmą kartą nardančius ir vyresnio amžiaus keliautojus. Centras organizuoja 3–5 nardymo reisus kasdien, 200+ dienų per metus.
      solution: Aquafarer tiekė individualų 6,8 m Professional Diving modelį RIB su išplėstu denio išdėstymu, optimizuotu nardymo įrangos saugojimui, plačiomis nerūdijančio plieno nardymo kopėčiomis, tvirtais Hypalon vamzdžiais UV ir atsparumu sūriam vandeniui, neslystančio denio paviršiumi ir talpyklų laikymo sprendimais. Konfigūracija buvo sukurta atsižvelgiant į nardymo centro kasdienį darbo procesą – ne pagal standartinį rekreacinio laivo išdėstymą.
      product: 6,8 m profesionalus šuolis RIBį vandenį
      results: Didesnė darbo erdvė pagerino įrangos paruošimo efektyvumą. Nardytojai patyrė saugesnį ir lengvesnį įlaipinimą. Priežiūros reikalavimai žymiai sumažėjo. Centras įgijo pajėgumų aptarnauti daugiau klientų piko sezono metu su didesniu pasitikėjimu. Tai RIB tapo kasdienio nardymo operacijų pagrindu.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Mūsų nardymo valtis nėra tik transportas. Tai yra mūsų kasdienės veiklos pagrindas.Aquafarer RIB Tai suteikia mūsų komandai daugiau pasitikėjimo, kai kasdien vyksta keli nardymo kelioniai.
      icon: tabler:lifebuoy
    - title: Phuket nardymo centro profesionalus RIB atnaujinimas
      customer: Ocean Explorer nardymo centras
      country: Tailandas
      industry: Komercinis nardymo centras
      challenge: Ocean Explorer nardymo centras Pukete, Tailande, turėjo atsinaujinti nuo tradicinio stiklo pluošto nardymo laivo, kuris negalėjo patenkinti augančios klientų paklausos. Ribota denio erdvė neefektyviai paruošė įrangą. Sudėtingas įlaipinimas kėlė saugumo iššūkių tarptautiniams turistams. Aukšti priežiūros reikalavimai tropinių sūrių vandenų sąlygomis padidino veiklos išlaidas. Centras vykdo kelis kasdienius reisus, 200+ dienų per metus.
      solution: Aquafarer pristatė pritaikytą 6,8 m komercinį nardymą RIB su optimizuotu darbo denio išdėstymu nardymo bakų saugojimui, įrangos paruošimui ir narų judėjimui. Savybės apėmė plačią nardymo kopėčią su nerūdijančio plieno turėklais, tvirtą vamzdžių konstrukciją iš UVatsparių medžiagų, neslystančias grindis, talpyklų laikymo sprendimą, profesionalią konsolę ir keleivių sėdynes – visa tai pritaikyta komercinėms nardymo operacijoms.
      product: 6,8 m komercinis šuolis RIBį vandenį
      results: Didesnis denio plotas leido greičiau organizuoti įrangą ir efektyviau dirbti kasdien. Klientų įlaipinimo komfortas ir saugumas žymiai pagerėjo. Techninės priežiūros prastovos sumažėjo dėl jūrinės klasės statybos. Nardymo centras galėjo aptarnauti daugiau klientų piko sezono metu ir užtikrintai plėsti profesionalias nardymo paslaugas.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Nardymo centrui valtis nėra tik transportas. Tai svarbi mūsų kasdienės veiklos dalis. TaiAquafarer RIB suteikia mūsų komandai pasitikėjimo kasdien vykdyti kelis nardymo reisus su didesniu saugumu ir efektyvumu.
      icon: tabler:lifebuoy
    - title: Europos nardymo centro laivynas
      customer: BlueMed nardymo centrai
      country: Graikija
      industry: Nardymas ir jūrų turizmas
      challenge: Reikėjo 12 nardymo konfigūracijų RIBs nardymo centrų tinklui keliose Graikijos salose. Kiekvienam laivui reikėjo individualių nardymo kopėčių, talpyklų 8 talpykloms ir stabilios platformos atviro vandens narų įėjimui. Flotilė turėjo atvykti per 60 dienų turistiniam sezonui prasidedant.
      solution: Pagaminta 12 RIB 520 nardymo modelių su integruotais bakų laikikliais, nardymo kopėčiomis ir ypač plačiomis Hypalon vamzdžių sistemomis stabilumui įlaipinant. Kiekvienas laivas buvo pažymėtas klientų laivyno dažymu. Visi 12 laivų buvo atlikti slėgio testai ir išsiųsti iš Čingdao per 55 dienas.
      product: RIB 520 nardymas
      results: Visi 12 laivų buvo pristatyti laiku turistiniam sezonui. Flotilė kasdien veikia jau 18+ mėnesių be jokių medžiagų gedimų. Antraisiais metais klientas užsakė dar 6 vienetus.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 nardymas buvo mūsų kasdienių nardymo operacijų pagrindas. Stabilumas ramybės būsenoje puikus, o talpyklų laikymo išdėstymas užtikrina terasos švarą ir saugumą mūsų svečiams.
      icon: tabler:lifebuoy
    - title: Australijos platintojų OEM programa
      customer: Pacific Watersports Pty Ltd
      country: Australija
      industry: OEM/ODM Gamyba
      challenge: Australijos platintojui reikėjo privačios etiketės SUP plokščių asortimento konkurencingomis kainomis, kad galėtų konkuruoti su Kinijos tiesioginio pardavimo prekių ženklais. Reikėjo 8 unikalių modelių nuo pradedančiųjų iki pažengusiųjų, su individualia grafika, individualiu pakuočių dizainu ir tiesioginiu pristatymu į mažmenines parduotuves.
      solution: Sukurti 8 SUP modeliai (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) su išskirtiniu Australijos grafikos paketu. Individuali mažmeninės prekybos pakuotė su QR kodais, vedančiais į vaizdo įrašus. Logistika iš Čingdao sukonfigūruota tiesiai į Australijos parduotuves.
      product: Custom SUP Line (8 modeliai)
      results: Koncepcija – pirmas pristatymas per 90 dienų. Pirmojo sezono mažmeninės prekybos rodiklis – 85%. Platintojas išplėtė partnerystę, įtraukdamas pripučiamų laivų liniją antraisiais metais.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer Per SUP 90 dienų pristatė visą liniją – nuo pradinio dizaino iki mažmeninės prekybos salės. Kokybė prilygsta prekės ženklams, kurie parduodami už dvigubai didesnę kainą.
      icon: tabler:arrows-exchange
    - title: Artimųjų Rytų gelbėjimo laivų tiekimas
      customer: Nacionalinė civilinės gynybos tarnyba
      country: Jungtiniai Arabų Emyratai
      industry: Paieška ir gelbėjimas
      challenge: Civilinės gynybos organizacijai reikėjo 20 patrulių RIBs pakrančių paieškai ir gelbėjimui, uosto saugumui ir potvynių valdymui. Reikėjo savisiurbimo denių, pilnų navigacijos komplektų (GPS, radaras, VHF), ryškiai matomų oranžinių vamzdžių ir atitikties vietiniams jūrų reglamentams.
      solution: Tiekiama 20 RIB 450 Patrol modelių su savaime išsitraukiančiais deniais, Garmin navigacijos komplektais, LED prožektoriais, SOLAS atspindinčia juosta ir ryškiai matomomis oranžinėmis Hypalon lempomis. Kiekvienas laivas buvo CEsertifikuotas ir išbandytas pagal ISO 6185 standartus. Dokumentacijos pakete buvo vietinės registracijos atitikties sertifikatai.
      product: RIB 450 patrulis
      results: Laivynas dislokuotas penkiose pakrantės stotyse. Laivai veikė esant ekstremaliam karščiui (45°C+) be vamzdžių degradacijos. Patruliavimo nuotolis ir kuro efektyvumas viršijo specifikacijas 12%.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450-asis patrulis viršijo mūsų operacinius reikalavimus. Esant ekstremalioms karščio sąlygoms, Hypalon UV vamzdžiai po 24 mėnesių kasdienio naudojimo nerodo jokių nusidėvėjimo požymių.
      icon: tabler:alert-triangle
    - title: Europos OEM prekės ženklo partnerystė
      customer: Šiaurės jūros jūrų įranga BV
      country: Nyderlandai
      industry: OEM/ODM Gamyba
      challenge: Įsitvirtinęs Europos jūrų prekės ženklas norėjo plėstis į RIB rinką neinvestuodamas į gamybos įrenginius. Reikėjo "white-label" partnerio, galinčio pagaminti 5 RIB modelius (3,9–6,2 mln) su privačiu prekės ženklu, CE sertifikavimu ir išskirtinėmis ES platinimo teisėmis.
      solution: Sudaryta baltos etiketės gamybos sutartis 5 RIB modeliams. Kiekvienas modelis pažymėtas klientų logotipais ir spalvų schema.CE Kiekvienam modeliui parengta sertifikavimo dokumentacija. Suteiktos išskirtinės ES platinimo teisės su minimaliais užsakymų įsipareigojimais. Techninė dokumentacija ir atsarginių dalių katalogas pateiktas vietiniam aptarnavimo tinklui.
      product: Custom RIB Line (5 modeliai)
      results: Pasirašyta daugiametė sutartis. Pirmoji 50 vienetų gamybos partija išsiųsta per 75 dienas. Prekės ženklas pristatytas METSTRADE, sulaukęs teigiamo atstovybių priėmimo.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Dirbdami Aquafarer su jais galėjome įžengti į RIB rinką be gamyklos statybos – jie pristatė pilną, paruoštą sprendimą su CE sertifikavimu ir atstovybių palaikymo dokumentais.
      icon: tabler:building
    - title: Karibų kurortinė flotilė
      customer: Paradise Island Resorts Ltd
      country: Bahamos
      industry: Jūrų turizmas ir svetingumas
      challenge: 'Prabangiam kurortui reikėjo pilnos vandens sporto įrangos flotilės svečių veikloms: 40 SUP lentų ekskursijoms su gidu, 20 baidarių lagūnų tyrinėjimui, 10 pripučiamų valčių svečių pervežimams ir žvejybos išvykoms, taip pat priedų. Visa įranga reikalavo individualaus kurorto ženklinimo ir turėjo būti pristatyta iki turistų sezono piko.'
      solution: 'Parengė pilną vandens sporto paketą: 40 SUP Voyager lentų (universalus modelis), 20 Explorer baidarių, 10 AirDeck 360 pripučiamų valčių, taip pat PFD, irklus, siurblius ir remonto rinkinius. Visa įranga atspausdinta su kurorto logotipu ir tropine spalvų schema. Konteinerinė siunta su pilnu inventoriaus sąrašu.'
      product: Pilnas vandens sporto paketas (70+ vienetų)
      results: Flotilė atvyko likus 6 savaitėms iki piko sezono. Vandens sporto lankytojų pasitenkinimo rodikliai padidėjo 40% lyginant su praėjusiais metais. Įranga tarnavo 3 sezonus, atliekant tik įprastą priežiūrą.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Pilnas paketas reiškė, kad gavome viską, ko reikėjo vienoje siuntoje – lentas, baidares, valtis ir priedus, visus prekės ženklus ir paruoštus svečiams. Mūsų svečiams patinka įrangos kokybė.
      icon: tabler:beach
    - title: Kvinslando komercinio nardymo centro RIB atnaujinimas
      customer: Komercinis nardymo centras
      country: Australija
      industry: Komercinis nardymas ir jūrų paslaugos
      challenge: Kvinslande įsikūręs komercinis nardymo centras, specializuojantis jūrų infrastruktūros inspekcijoje, uostų priežiūroje ir povandeniniuose remonto projektuose, eksploatavo senstantį darbo laivą. Augant projektų paklausai, senasis laivas tapo našta – dažna priežiūra trikdė tvarkaraščius, išdėstymas nebuvo pritaikytas šiuolaikinėms nardymo operacijoms (ribota vieta cilindrams, įrankiams ir įrangai), o įgulos komfortas ilgų operacijų metu buvo prastas. Įmonei reikėjo laivo, galinčio kasdien palaikyti profesionalią veiklą.
      solution: Aquafarer atliko išsamią kliento nardymo darbo eigos, tipinio projekto trukmės, įgulos dydžio ir įrangos poreikių operacinę analizę. Remdamasis šia analize, Aquafarer pristatė individualizuotą profesionalą RIB su funkcionaliu denio išdėstymu, optimizuotu įrangos paruošimui ir narų judėjimui, profesionaliomis sėdimomis vietomis ilgesniam transportavimo laikotarpiui, pagerintu stabilumu saugesniam narų įėjimui ir išėjimui bei nardymo palaikymo funkcijomis, integruotomis į dizainą.
      product: Individualus profesionalus nardymas RIB
      results: Naujasis RIB tapo patikima kasdienio darbo platforma. Įrangos paruošimas tapo greitesnis dėl optimizuoto išdėstymo. Įgula pranešė apie pagerėjusį komfortą ir saugumą ilgų operacijų metu. Profesionali laivo išvaizda sustiprino klientų pasitikėjimą dirbant su uosto operatoriais ir jūrų rangovais. Nardymo centras gavo laivą, atitinkantį jų profesionalią tarnybą.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Mums reikėjo laivo, kuris galėtų kasdien palaikyti mūsų verslą, o ne tik transporto priemonės. Aquafarer bendradarbiavo su mumis, kad suprastų mūsų operacinius reikalavimus, ir pristatė RIB sprendimą, tinkantį mūsų komercinių nardymų darbų eigai.
      icon: tabler:lifebuoy
    - title: JAV Pakrančių patrulių sutartis
      customer: Atlanto pakrantės saugumo agentūra
      country: Jungtinės Amerikos Valstijos
      industry: Jūrų saugumas ir teisėsaugos veikla
      challenge: JAV pakrančių apsaugos agentūra reikėjo sunkiųjų patrulių RIBs operacijoms atviroje jūroje. Reikėjo dviejų variklių konfigūracijos atsargumo užtikrinimui, šarvuotos konsolės įgulos apsaugai, karinio standarto elektronikos (šifruoti ryšiai, FLIR, radaras) ir atitikimo JAV pakrančių apsaugos reglamentams.
      solution: Sukurtas RIB 600 Patrol su dviejų 115 HP pakabinamais varikliais, šarvuota konsolė su balistinės apsaugos, FLIR terminis vaizdavimas, šifruoti VHF/UHF ryšiai ir integruotos ginkluotės montavimo vietos. Korpuso stiprinimas greitam sulaikymo manevrams. Visa elektronika integruota ir patikrinta gamykloje. Pateikti USCG atitikties dokumentai.
      product: RIB 600 Patrol (dviejų variklių)
      results: Laivai pasiekė 52 mazgų maksimalų greitį priėmimo bandymų metu. Agentūra pranešė apie 95% misijos parengimo rodiklį per pirmuosius 12 mėnesių. Pateiktas papildomas užsakymas 8 vienetams.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Dviejų variklių RIB 600 suteikia mūsų įguloms greitį ir atsarginę sistemą, reikalingą atviroje jūroje sulaikymo operacijoms. Šarvuota konsolė suteikia kritinę apsaugą nesumažinant našumo.
      icon: tabler:shield
cta:
