content_challenge:
  tagline: Iššūkis
  title: Jūrų tyrimų poreikiai<br />Stabilios, instrumentams paruoštos platformos
  subtitle: Moksliniai darbo laivai turi užtikrinti stabilią platformą jautriai įrangai, tylų veikimą, kad netrikdytų laukinės gamtos, ir lanksčius išdėstymus įvairiai tyrimų įrangai.
  paragraphs:
    - Jūrų tyrimams ir aplinkos stebėsenai reikalingi darbo laivai, kurie tarnauja kaip mobilios laboratorijos. Skirtingai nei komerciniai ar laisvalaikio laivai, tyrimai RIBs turi būti pritaikyti jautriai elektroninei įrangai, vandens ir nuosėdų mėginių ėmimo įrangai, o kartais ir gyvų mėginių transportavimui – visa tai užtikrinant stabilią platformą tiksliam duomenų rinkimui.
    - '**Platformos stabilumas yra kritiškai svarbus** — Sonaras, aidų zondavimo įrenginiai ir CTD (laidumas, temperatūra, gylis) profiliatoriai reikalauja stabilaus korpuso ramybės būsenoje ir lėtu greičiu. Per didelis bangos ar korpuso judėjimas įveda triukšmą į mokslinius duomenis. Giluminio V formos korpusas su geromis stabilumo savybėmis yra būtinas.'
    - '**Instrumentų integracija** — Tyrimų laivams reikia tvirtinimo taškų GPS antenoms, sonaro keitiklių, mėginių ėmimo svirtims ir duomenų registravimo įrangai. Konsolės erdvė turi talpinti kelis ekranus, prietaisų energijos paskirstymą ir saugią jautrios elektronikos saugyklą.'
    - '**Tylus veikimas** — Jūrų biologijos tyrimams ir aplinkos stebėsenai variklių triukšmas ir korpuso vibracija gali išgąsdinti jūrų gyvybę ir pakenkti elgesio stebėjimui. Tylūs išoriniai konfigūracijos ir sumažintos vibracijos korpuso dizainai yra svarbūs moksliniams tyrimams.'
    - Paddle Board Overstock RIBs Tyrimai kuriami naudojant stabilias korpuso platformas, integruotas įrangos tvirtinimo sistemas ir tylias išorines konfigūracijas moksliniams ir aplinkos stebėsenos taikymams.
content_solution:
  tagline: Mūsų sprendimas
  title: Specialiai sukurti tyrimai RIBs<br />Mokslo ir aplinkosaugos darbams
  subtitle: Kiekvienas Paddle Board Overstock tyrimas RIB yra sukonfigūruotas kaip stabili, pritaikoma platforma moksliniams instrumentams ir lauko mėginių ėmimo įrangai.
  list:
    - Gilios V formos stiklo pluošto korpusas, pasižymintis puikiu stabilumu ramybės būsenoje ir lėtu tyrimų greičiu
    - Plokščio denio išdėstymas su įrangos tvirtinimo plokštelėmis sonarui, GPS ir mėginių ėmimo įrangai
    - Konsolė sukonfigūruota keliems ekranams — braižytuvas, garso sistema, duomenų registratorius
    - 12V ir 24V priedų galios paskirstymas moksliniams instrumentams
    - Tylus 4 taktų išorinis variklis — minimalios vibracijos ir triukšmo laukinės gamtos stebėjimams
    - Pasirenkamas žemos bangos korpuso dizainas, užtikrinantis minimalų trikdymą duomenų rinkimo metu
    - Individualios tūbelių spalvos mokslinių tyrimų institucijų prekės ženklui ir parko identifikavimui
content_segments:
  tagline: Tyrimų profiliai
  title: Jūrų mokslo sprendimai<br />Pagal programos tipą
  subtitle: Skirtingos tyrimų taikymo sritys turi unikalius laivų reikalavimus – nuo universitetų mokymo platformų iki aplinkos tyrimų laivų ir vandens kokybės stebėjimoRIBs.
  items:
    - title: Universitetų jūrų mokslų programos
      subtitle: Mokymo platformos, studentų ekskursijos, pakrančių tyrimai
      description: Jūrų mokslų universitetams ir okeanografijos skyriams reikia patikimų, universalių darbo valčių lauko kursams, studentų tyrimų projektams ir dėstytojų vadovaujamoms pakrančių apžiūroms. Valtis turi būti lengvai valdoma studentams, prižiūrimiems priežiūroje, pakankamai stabili praktiniam instrumentų naudojimui ir pakankamai patvari, kad ją dažnai naudotų įvairūs naudotojai per akademinius laikotarpius. Biudžeto apribojimai akademinėje aplinkoje daro svarbius aspektus dėl ekonomiškumo ir mažos priežiūros.
      features:
        - Stabili platforma studentų instrumentų diegimui ir atkūrimo praktikai
        - Lengvas valdymas — kultivatoriaus arba vienos konsolės konfigūracija prižiūrimam studentų naudojimui
        - Tvirti Hypalon vamzdžiai dažniems išsilaipinimams paplūdimyje ir studentų tvarkymui
        - Įrangos montavimas mokomojo lygio sonarui, secchi diskui ir mėginių ėmimo įrangai
        - Ekonomiškas PVC pasirinkimas akademinėms programoms su biudžeto apribojimais
    - title: Jūrų tyrimų institutai
      subtitle: Tyrimas RIBs su instrumentų integracija, GPS, mėginių ėmimo įranga
      description: Specializuotos jūrų tyrimų organizacijos, vykdančios pakrančių ir jūrų tyrimus, turi profesionaliai sukonfigūruotus tyrimus RIBs su integruota įranga. Šie laivai turi sonaro sistemas batimetriniams žemėlapiams sudaryti, CTD profiliatorius vandens stulpelio analizei, nuosėdų mėginių ėmimo įrenginius ir biologinės informacijos surinkimo įrangą. Laivas turi užtikrinti stabilią platformą lėtu matavimo greičiu, turėti pakankamai denio vietos įrangos išskleidimui ir pasiūlyti švarią 12V/24V elektros energiją elektronikai.
      features:
        - Integruotas sonaro keitiklio montavimas — per korpusą arba transomo konfigūracija
        - GPS antenos montavimas ir konsolės integracija geodezinei navigacijai
        - CTD ir vandens mėginių ėmimo zona su saugiais tvirtinimo taškais
        - 12V/24V pagalbinis maitinimo paskirstymas instrumentams ir duomenų kaupiklių
        - Stabili lėtu greičiu (3–6 mazgai) dėl matavimo linijos tikslumo
        - Pasirenkamas A formos rėmas arba kranas sunkesnei mėginių ėmimo įrangai dislokuoti
    - title: Aplinkos stebėsena ir apsauga
      subtitle: Ekologiniai tyrimai, laukinės gamtos stebėjimas, buveinių vertinimas
      description: Aplinkosaugos NVO, vyriausybinės agentūros ir gamtosaugos organizacijos atlieka jūrų ekologinius tyrimus, laukinės gamtos populiacijų stebėseną ir buveinių vertinimus. Šioms operacijoms reikalingi tylūs, mažo poveikio laivai, galintys priartėti prie jautrių buveinių netrikdant laukinės gamtos. Valtys turi turėti kamerų įrangą, GPS transektų žemėlapiams ir mėginių ėmimo įrangą vandens ir nuosėdų surinkimui. Žema banga ir minimalus variklio triukšmas yra itin svarbūs elgesio stebėjimo tyrimams.
      features:
        - Ramus 4 taktų išorinis variklis — minimalus trikdymas jūrų laukinei gamtai
        - Stabili stebėjimo platforma fotografijai ir vaizdo dokumentacijai
        - Įrangos montavimas kamerų rinkiniams, GPS sekimo įrenginiams ir lauko kompiuteriams
        - Seklus grimzdumas leidžia pasiekti pakrančių pelkes, mangroves ir žiočių zonas
        - Lengvai valomi denio ir vamzdžių paviršiai dezinfekcijai tarp vietovių
    - title: Vandens kokybės stebėjimas ir testavimas
      subtitle: Reguliarūs mėginių ėmimo žygiai, teršalų sekimas, atitikties priežiūra
      description: Vandens kokybės stebėjimo organizacijos reguliariai atlieka mėginių ėmimo žygius pakrančių zonose, uostuose ir vidaus vandenyse, kad stebėtų taršos lygius, dumblių žydėjimą ir laikymąsi aplinkosaugos reglamentų. Šioms operacijoms reikalingi efektyvūs, patikimi laivai nuolatiniams vizitams į fiksuotas mėginių ėmimo stotis. Laive turi būti galima gabenti mėginių ėmimo įrangą, šaldytuvus mėginių išsaugojimui ir lauko testavimo įrankius — su lengvai plaunamais denio paviršiais tarp mėginių ėmimo vietų, kad būtų išvengta kryžminės taršos.
      features:
        - Skirta mėginių ėmimo stoties zona su šaldytuvu ir įrangos sandėliavimu
        - Lengvai valomi denio ir vamzdžių paviršiai dezinfekcijai tarp vietovių
        - GPS integracija tiksliam grįžimui į fiksuotas mėginių koordinates
        - Kompaktiškas dydis leidžia patekti į ribotas vandens teritorijas ir siauras kanalus
        - Kuro taupantis laivo variklis ekonomiškiems reguliariems mėginių ėmimo žygiams
