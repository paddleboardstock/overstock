hero:
  tagline: Gyvenimo būdas
  title: The Paddle Board Overstock<br />Gyvenimo būdas
  subtitle: Sukurta tiems, kurie gyvena ant vandens — nuo savaitgalių tyrinėtojų iki komercinių operatorių, kurie kasdien priklauso nuo savo įrangos.
values:
  - icon: 🌊
    title: Gimė ant vandens
    desc: Kiekvienas dizainas prasideda nuo supratimo, kaip elgiasi vanduo. Mes projektuojame nuo sąlygų ribos į vidų — nes vandenynas yra mūsų mokytojas, o ne darbo vieta.
  - icon: 🔧
    title: Sukurta tarnauti ilgai
    desc: Tvariausias produktas yra tas, kurio nereikia keisti. Jūrinės klasės medžiagos, drop-stitch branduoliai, įvertinti iki 15 PSI, ir siūlės, kurios išlieka visą sezoną.
  - icon: 🏆
    title: Prieinama pagal dizainą
    desc: Vandens sportas neturėtų būti prabangos dalykas. Profesionali našumo kokybė už kainą, kuri prasminga šeimoms, gidams ir mažiems operatoriams — ne tik komercinėms laivynams.
  - icon: 🌍
    title: Pasaulinė bendruomenė
    desc: 'Nuo Qingdao pakrantės iki ežerų Europoje, upių Pietryčių Azijoje ir įlankų Amerikoje — mūsų klientai turi vieną bendrą dalyką: meilę buvimui ant vandens.'
  - icon: ♻️
    title: Atsakinga gamyba
    desc: CNC-optimizuotas medžiagų išdėstymas sumažina atliekų kiekį iki 5%. Patvari konstrukcija mažina keitimo ciklus. Mes kuriame ilgaamžiškumui, nes tai yra tvariausias pasirinkimas.
  - icon: 🤝
    title: Tarnauti, kuri tęsiasi
    desc: Dviejų dešimtmečių senumo korpusai vis dar kreipiasi į mus dėl atsarginių dalių. Mūsų garantijos atsakymo laikas vidutiniškai 24 valandos. Mes neišnykstame po pardavimo — esame čia visam produkto gyvavimo laikui.
