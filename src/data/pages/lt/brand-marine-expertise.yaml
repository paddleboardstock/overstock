hero:
  tagline: Jūrų Ekspertizė
  title: Dešimtmečiai Jūrų Inžinerijos<br />Kiekviename Korpuse
  subtitle: Paddle Board Overstock sujungia gilias medžiagų mokslo žinias, tikslų gamybos procesą ir realaus pasaulio testavimą, kad sukurtų vandens transporto priemones, kurios veikia tada, kai tai svarbu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock jūrų inžinerijos ir MTEP komanda darbe
expertise_materials:
  tagline: Medžiagų Mokslas
  title: Tinkamos Medžiagos Pasirinkimas<br />Kiekvienai Paskirčiai
  subtitle: Mes dirbame su trimis pagrindinėmis medžiagomis – kiekviena parinkta specifiniams naudojimo atvejams ir našumo reikalavimams.
  columns: 3
  items:
    - title: Jūrų Klasės PVC
      description: 1100 denierių PVC audinys – mūsų universaliausia medžiaga. UV-stabilizuotas, atsparus trinčiai ir REACH atitinka standartus. Idealiai tinka pramoginiams laivams, SUP lentoms ir baidarėms, kai svarbu svoris ir kaina.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Aukštesnė atsparumas cheminėms medžiagoms ir UV stabilumas. Hypalon laivai gali tarnauti 15-20 metų tinkamai prižiūrimi. Rekomenduojama komercinėms, gelbėjimo ir kariniais tikslams, kur ilgalaikis patvarumas yra kritiškai svarbus.
      icon: tabler:shield
    - title: Stiklo Pluoštas ir Aliuminis
      description: Deep-V stiklo pluošto korpusai RIBs ir patrulinėms valtims – bangų skaldymo našumas sudėtingomis sąlygomis. Aliuminio korpusai sunkiems komerciniams darbo laivams, kuriems reikalinga maksimalus stiprumas ir apkrovos talpa.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Gamybos Galimybės
  title: Tikslioji Gamyba<br />Kiekviename Etape
  subtitle: Mūsų 12 000 m² patalpose įrengta speciali įranga kiekvienam gamybos etapui.
  columns: 2
  items:
    - title: CNC Pjovimas
      description: Kompiuterizuotas pjovimas užtikrina tiksliai, pakartotinai gaminamą audinį su minimaliais nuostoliais. Kiekvienas gabalas tiksliai atitinka projektą.
      icon: tabler:cpu
    - title: Aukšto Dažnio Suvirinimas
      description: Pramoninis HF suvirinimas sukuria siūles, stipresnes už pagrindinę medžiagą. Nuolatinė temperatūros ir slėgio kontrolė užtikrina sandarius siūlus kiekviename gamybos cikle.
      icon: tabler:bolt
    - title: Drop Stitch Core Surinkimas
      description: Tūkstančiai poliesterio siūlų jungia viršutinį ir apatinį audinio sluoksnius, leidžiant aukšto slėgio pripūtimą (15-20 PSI) standžioms, stabiliosioms SUP lentoms ir grindims.
      icon: tabler:building-arch
    - title: Slėgio Testavimas
      description: Kiekvienas pripučiamas produktas prieš siuntimą yra slėgio testuojamas. RIB vamzdžiai yra testuojami 1,25x nominalaus slėgio – jei atlaiko, veiks vandeniu.
      icon: tabler:wind
    - title: Siūlių Stiprumo Testavimas
      description: Atsitiktinės kiekvieno gamybos partijos mėginiai yra sunaikinimo principu testuojami siūlių stiprumui. Rezultatai registruojami ir yra susiejami su konkrečiais gamybos ciklais.
      icon: tabler:files
    - title: Vandens Testavimas
      description: Kiekvienas RIB modelis praeina jūrų bandymus prieš sertifikavimą. Tikras bandymas pakrantės sąlygomis patvirtina našumą, valdomumą ir stabilumą.
      icon: tabler:ripple
expertise_design:
  tagline: Dizainas ir inžinerija
  title: Sukurta realioms sąlygoms
  subtitle: Mūsų dizaino filosofija prasideda nuo to, kaip bus naudojamas laivas — tada inžinerija kuriama pagal šį naudojimo atvejį.
  items:
    - title: Deep-V kėbulo dizainas
      description: Mūsų stiklo pluošto korpusai turi apskaičiuotus deadrise kampus, optimizuotus pagal kiekvieno modelio ilgį ir numatytą naudojimą. Stačiau V – šiurkštėms vandens sąlygoms, sekliau – stabilumui.
    - title: Daugiakamerės saugos sistemos
      description: Kiekviename laive yra 3–7 nepriklausomos oro kameros. Jei viena kamera pažeista, likusios kameros palaiko laivo plūdrumą ir veikimą.
    - title: Ergonomiška išdėstymas
      description: Konsolės padėtis, vamzdžio aukštis ir sėdynių išdėstymas suprojektuoti operatoriaus komfortui ilgo naudojimo metu – ar tai būtų patruliavimas, žvejyba ar transportavimas.
    - title: Individuali konfigūracija
      description: Vamzdžių spalvos, konsolės konfigūracija, kuro talpa, priedų tvirtinimo vietos – kiekvienas modelis gali būti pritaikytas konkretiems operaciniams reikalavimams.
cta:
