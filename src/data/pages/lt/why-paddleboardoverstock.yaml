reasons:
  tagline: Paddle Board Overstock skirtumas
  title: Kas mus išskiria
  isBeforeContent: false
  columns: 3
  items:
    - title: Tikras gamyba, ne prekyba
      description: Turime ir valdome 12 000 m² gamyklą. Bendradarbiaudami su Paddle Board Overstock dirbate tiesiogiai su žmonėmis, kurie projektuoja, konstruiuoja ir gamina jūsų produktus — be tarpininkų.
      icon: tabler:building-factory
    - title: Inžinerijos vadovaujamas požiūris
      description: Mūsų dizaino procesas prasideda nuo naudojimo atvejo, o ne produkto kategorijos. Mes optimizuojame korpuso formą, medžiagų pasirinkimą ir konfigūraciją pagal tai, kaip įranga bus faktiškai naudojama komercinėse aplinkose.
      icon: tabler:engine
    - title: Sertifikuota kokybė
      description: CE sertifikuotas, ISO kokybės sistema, BSCI atitinka reikalavimus, REACH atitinka reikalavimus, USCG III/V tipo patvirtintos gelbėjimosi liemenės; visi produktai atitinka taikomus tarptautinius standartus.
      icon: tabler:certificate
    - title: Lankstus OEM/ODM
      description: Vamzdžių spalvos, konsolės išdėstymas, prekės ženklo ženklinimas, pakavimas — pritaikome pagal jūsų specifikacijas. Nėra minimalios užsakymo ribos. Pradėkite su prototipu, didinkite gamybą su pasitikėjimu.
      icon: tabler:adjustments
    - title: Pasaulinė logistika
      description: Sandėlis JAV Kalifornijoje, tiesioginis siuntimas iš Qingdao, skubiems užsakymams – oro transportu. Mes tvarkome muitinės dokumentus ir dokumentaciją visame pasaulyje.
      icon: tabler:truck-delivery
    - title: Viso gyvenimo palaikymas
      description: Mes palaikome laivus, kuriuos pastatėme prieš 20 metų. Tikros atsarginės dalys, techninės konsultacijos, remonto gairės – mūsų komanda yra pasiekiama, kai jums reikia, nesvarbu, kur esate.
      icon: tabler:lifebuoy
testimonials:
  tagline: Pasitikima prekės ženklais visame pasaulyje
  title: Ką sako mūsų partneriai
  items:
    - content: Mes bendradarbiavome su keliais gamintojais Kinijoje, bet Paddle Board Overstock išsiskiria inžinerine parama ir nuolatine kokybe. Jie traktuoja mūsų prekės ženklą kaip savo.
      name: — OEM Partneris, Europos vandens sporto prekės ženklas
    - content: Jų Hypalon RIBs mūsų flotilėje naudojami jau daugiau nei 5 metus. Maža priežiūra, puikus UV atsparumas. 5 metų garantija ant vamzdžių suteikia mums pasitikėjimo.
      name: — Flotilės operatorius, Vidurio Rytų kurortų grupė
    - content: Paddle Board Overstock komanda padėjo mums sukurti individualų SUP lentos dizainą nuo koncepcijos iki gamybos per 90 dienų. Kokybė pranoko mūsų lūkesčius.
      name: — Platintojas, Australijos vandens sportas
    - content: Kaip mažos įmonės savininkas, aš jaudinausi dėl MOQs. Paddle Board Overstock dirbo pagal mano biudžetą ir padėjo man paleisti savo prekės ženklą tik su 50 lentų. Dabar užsakau 500.
      name: — Prekės ženklo įkūrėjas, JAV SUP nuomos įmonė
cta:
  title: Pasiruošę plėtoti savo vandens verslą?
  subtitle: Susisiekite su mūsų komanda dėl nemokamos konsultacijos. Nėra jokių įsipareigojimų – tik sąžiningos rekomendacijos apie įrangą ir gamybą.
  actions:
    - variant: primary
      text: Pasikalbėkite su mūsų komanda
      href: /contact
    - text: Atsisiųskite produktų katalogą
      href: /resources
