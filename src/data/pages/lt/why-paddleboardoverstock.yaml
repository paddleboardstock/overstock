hero:
  tagline: Kodėl Paddle Board Overstock
  title: Kitaip sukurta. Sukurta verslui.<br />Partneris už vandens nuotykius visame pasaulyje
  subtitle: Ne tik gamintojas — verslo partneris, kuris projektuoja, inžineruoja ir tiekia komercinės klasės įrangą klubams, kurortams, nuomos operatoriams ir naujoms vandens prekių ženklams.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock gamybos kokybė ir ekspertizė
pillars:
  tagline: Trys partnerystės stulpai
  title: Kodėl pasaulio vandens verslai renkasi Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Sukurtas komerciniam naudojimui
      description: Mūsų įranga sukurta kasdieniam nuomojimui, o ne savaitgalio pramogoms. Komercinės kokybės PVC, sustiprinti drop-stitch branduoliai, UV stabilios Hypalon parinktys ir lauke patikrinta įranga reiškia mažesnę priežiūros reikmę, ilgesnį tarnavimo laiką ir didesnį ROI jūsų veiklai.
      icon: tabler:building-factory
      callToAction:
        text: Žr. komercinę produktų liniją
        href: /products
    - title: Nuo idėjos iki rinkos
      description: 'Paleiskite savo vandens sporto prekės ženklą per 90 dienų. Mes jus lydime kiekviename žingsnyje: koncepcijos patikrinimas, produktų pasirinkimas, prototipas, gamyba, pakuotės dizainas ir pasaulinis siuntimas. Nėra spaudimo dėl minimalios užsakymo apimties — pradėkite mažai, augkite pasitikėdami savimi.'
      icon: tabler:rocket
      callToAction:
        text: Pradėkite savo prekės ženklo kelionę
        href: /oem-odm-blueprint
    - title: Sukurtas pasaulinėms sąlygoms
      description: 'Produktai, optimizuoti kiekvienam klimatui: šaltam vandeniui skirti PVC mišiniai Europai, UV-atsparios medžiagos Artimiesiems Rytams ir Australijai, drėgmei atsparios priemonės Pietryčių Azijai. Kiekviena siunta yra pritaikyta tikslinės aplinkos sąlygoms.'
      icon: tabler:world
