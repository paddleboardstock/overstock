content_version_control:
  tagline: Versijų kontrolė
  title: Piešimo versija<br />Valdymas
  subtitle: Kiekvienas brėžinys turi kontroliuojamą peržiūros sistemą. Visada patikrinkite, ar turite dabartinę versiją prieš naudodami brėžinius projekto planavimui.
  items:
    - title: Pataisymų sekimas
      description: Kiekvienas brėžinys turi versijos kodą (Rev-A, Rev-B, Rev-C), išleidimo datą, paskutinį peržiūrėtą datą, taikomą modelį/konfigūraciją, vienetus, failo dydį ir formatą. Atsisiųsti galima tik "Current" versiją.
      icon: tabler:git-branch
    - title: Piešimo būsenos pranešimas
      description: Visi vieši brėžiniai pažymėti "Tik preliminarus išdėstymas – ne statybai, sertifikavimui ar gamybai. Matmenys priklauso nuo galutinės specifikacijos ir užsakymo patvirtinimo." Tai apsaugo abi šalis nuo netinkamo taikymo.
      icon: tabler:alert-circle
    - title: Atnaujinimų pranešimai
      description: Kai modelio specifikacija pasikeičia, brėžinio peržiūra atnaujinama, o ankstesnės versijos pažymimos kaip "Pakeistos". Registruoti vartotojai, atsisiuntę DXF/DWG paketus, apie reikšmingus atnaujinimus informuojami el. paštu.
      icon: tabler:bell
faq:
  title: Techniniai brėžiniai – dažniausiai užduodami klausimai
  questions:
    - q: Ar GA PDF failai tikrai nemokami?
      a: Taip. Pagrindinių modelių bendrojo išdėstymo PDF failai yra prieinami nemokamai – užpildykite trumpą kvalifikacijos formą žemiau ir atsisiuntimo nuoroda bus išsiųsta el. paštu per 1 darbo dieną. Juose pateikiama planavimo lygio informacija, pakankama projekto vertinimui, erdvės paskirstymui ir preliminariam specifikacijų peržiūrėjimui.
    - q: Kaip pasiekti DXF/DWG failus?
      a: Užpildykite trumpą kvalifikacijos formą atsisiuntimo puslapyje su savo įmonės pavadinimu, projekto tipu ir numatomu naudojimu. Patvirtinti prašymai per 1 darbo dieną gauna atsisiuntimo nuorodą el. paštu.
    - q: Ar galiu gauti STEP/IGES 3D modelius?
      a: STEP arba IGES 3D modelių failai yra prieinami per mūsų projekto paraiškos procesą. Pateikite savo projekto apimtį, integracijos reikalavimus, terminus ir pirkimo ketinimus. Gali būti patvirtinta – paprastai per 3–5 darbo dienas.
    - q: Kodėl ribojate prieigą prie detalesnių failų?
      a: Korpuso geometrija, formų duomenys ir konstrukciniai skaičiavimai atspindi daugelio metų mokslinių tyrimų ir plėtros investicijas ir yra pagrindinė gamybos intelektinė nuosavybė. Mes teikiame viską, ko reikia pirkimų planavimui ir projektų integracijai, tuo pačiu saugodami galimybę toliau investuoti į naujų produktų kūrimą.
    - q: Ar brėžiniuose yra gamybos detalės?
      a: Ne. Vieši ir lengvos formos brėžiniai apima pirkimų lygio informaciją planavimui ir specifikacijoms. Gamybos lygio detalės (laminavimo grafikai, įrankių trajektorijos, pjovimo išplėtimai) dalijamos tik NDA su patvirtintais užsakymais.
    - q: Ar yra brėžinių individualioms ar pusiau individualioms RIB konfigūracijoms?
      a: Individualūs projekto brėžiniai parengiami OEMkaip dalis /ODM vystymo proceso. Jei vertinate individualų RIB projektą, susisiekite su mumis ir pateikite savo reikalavimus, ir mes pateiksime projekto specifinius GA brėžinius kaip pasiūlymo dalį.
