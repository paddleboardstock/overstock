hero:
  tagline: Techniniai brėžiniai ir CAD
  title: RIB ir pripučiamasis laivas<br />Techninių brėžinių ir CAD atsisiuntimai
  subtitle: Planavimo lygio GA brėžiniai, matmenų lentelės ir denio išdėstymo planai projektui įvertinti ir specifikacijai. Prieiga prie techninių brėžinių tinkamu lygiu — nuo viešųjų PDF iki projektinio lygio STEP failų.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB laivų techniniai brėžiniai ir CAD atsisiuntimai
direct_answer: Paddle Board Overstock teikia pirkimo lygio techninius brėžinius RIB laivams ir pripučiamiems vandens transporto priemonėms — įskaitant bendro išdėstymo (GA) PDF, matmenų lenteles ir denio išdėstymo brėžinius. Detalesni formatai (DXF/DWG, STEP/IGES) prieinami pateikus kvalifikuotą užklausą arba projekto paraišką.
stats:
  - value: GA PDF
    label: Nemokamas atsisiuntimas
    detail: Bendras išdėstymas pagal modelį
  - value: DXF/DWG
    label: Lengvas prieigos formos
    detail: Planavimo lygio 2D CAD
  - value: STEP/IGES
    label: Projekto paraiška
    detail: 3D modelis integracijai
  - value: NDA Tik
    label: Struktūriniai brėžiniai
    detail: Denio laminavimas, formų duomenys
content_tiers:
  tagline: Atsisiuntimo lygiai
  title: Keturi prieigos lygiai<br />— Tinkamas detalumas tinkamam etapui
  subtitle: Mes teikiame pirkimo lygio brėžinius, o ne gamybos lygio failus. Kiekvienas lygis atitinka skirtingą projekto etapą.
  items:
    - title: 1 lygis — Viešasis PDF
      description: Bendras išdėstymas (GA), 4 vaizdų matmenų brėžinys ir denio išdėstymas PDF formatu. Galima nemokamai atsisiųsti. Pakanka projektavimo, erdvės paskirstymo ir preliminarios specifikacijos peržiūrai.
      icon: tabler:file-type-pdf
    - title: 2 lygis — Lengvas DXF/DWG
      description: 2D CAD failai (DXF arba DWG) planavimo lygio išdėstymo integracijai. Reikalauja trumpos kvalifikacijos formos (įmonės pavadinimas, projekto tipas, numatytas naudojimas). Nėra įtraukti struktūriniai ar gamybos duomenys.
      icon: tabler:file-code
    - title: 3 lygis — Projekto paraiška STEP/IGES
      description: 3D modelių failai (STEP arba IGES) sistemų integracijai, įrangos projektavimui arba jūrinių architektūrų koordinavimui. Reikalauja projekto paraiškos su apimtimi, laiko grafiku ir pirkimo ketinimais. Patvirtinimas būtinas.
      icon: tabler:cube
    - title: 4 lygis — NDA Inžinerija
      description: Denio struktūrinių brėžinių, laminavimo tvarkaraščių, vamzdžių pjovimo išplėtimų ir formų duomenys. Galima tik per NDA patvirtinus užsakymus. Tai gamybos lygio failai — nėra skirti viešam platinimui.
      icon: tabler:lock
content_included:
  tagline: Kas įtraukta
  title: Brėžinių turinys<br />Pagal modelį
  subtitle: Kiekvienas modelis turi standartinį brėžinių paketą, apimantį esminę planavimo informaciją B2B pirkėjams ir projektų inžinieriams.
  items:
    - title: Bendra sąranga (GA)
      description: Šoninis profilis, viršutinė projekcija ir skerspjūvis, rodantys korpuso formą, vamzdžio padėtį, konsolės vietą, sėdynių išdėstymą, kuro sistemą ir pagrindinius matmenis (LOA, plotis, vamzdžio skersmuo, korpuso nuolydžio kampas). Atnaujinimo būsena ir autorių teisės pažymėtos pavadinimo bloke.
      icon: tabler:layout
    - title: 4 vaizdų matmenų brėžinys
      description: Šoninis, priekinis, galinis ir viršutinis vaizdai su bendrais matmenimis transporto planavimui (aukštis ant priekabos, plotis konteineriui, svoris kėlimui). Įtraukia veikimo ir transportavimo konfigūracijas.
      icon: tabler:ruler-2
    - title: Denio išplanavimo ir įrangos planas
      description: Viršutinio denio vaizdas, rodantis konsolės pagrindą, sėdynių vietas, D-formos žiedų vietas, navigacinio apšvietimo vietas, liuko siurblio prieigos vietas, baterijų/kuro skyrių ir įrangos tvirtinimo taškus. Ribotas tikslumas dėl patentuotų sąsajų.
      icon: tabler:map
    - title: Transportavimo ir pakavimo brėžinys
      description: Konteinerio pakrovimo planas, vežimėlio matmenys, svorio paskirstymas ir kėlimo taškų pozicijos logistikos planavimui. Įtrauktos standartinės ir individualios pakavimo parinktys.
      icon: tabler:truck
content_protection:
  tagline: IP apsauga
  title: Ko mes nedalijamės<br />ir kodėl
  subtitle: Inžinerinio intelektinio turto apsauga užtikrina, kad galime toliau investuoti į MTEP, tuo pačiu pateikdami pirkėjams viską, ko reikia projektų planavimui.
  items:
    - title: Korpuso formos pagrindo duomenys
      description: Jungties ir formos geometrija, CNC įrankių takai ir laminavimo šablonai yra patentuota gamybos informacija. Jie nesidalijami jokiu prieigos lygiu už patvirtintų NDA sutarčių ribų.
      icon: tabler:ban
    - title: Vamzdžio pjovimo išplėtimai
      description: Plokščios pjovimo failai vamzdžių audiniams yra gamybos lygmens duomenys. Prieinami tik pagal NDA su patvirtintais gamybos užsakymais ir dalijami tik su sutarties šalimi.
      icon: tabler:ban
    - title: Struktūriniai skaičiavimai
      description: Išsamūs įtempimo analizės, FEA rezultatų ir laminato tvarkaraščio dokumentai yra jautrūs atitikties reikalavimams ir dalijami tik su praneštomis institucijomis ir NDA klientais atitikties vertinimo metu.
      icon: tabler:ban
    - title: Konkurentų tikrinimas
      description: Mes pasiliekame teisę atsisakyti CAD prieigos prašymų, kurie atrodo, kad yra iš konkurentų, studentų be projekto konteksto arba šalių be teisėto pirkimo ketinimo.
      icon: tabler:shield
content_models:
  tagline: Galimi modeliai
  title: Techniniai brėžiniai<br />Prieinamumas pagal modelį
  subtitle: GA PDF atsisiuntimai prieinami mūsų pagrindiniams RIB ir pripučiamiems laivų modeliams. Susisiekite su mumis dėl konkrečių modelių brėžinių, kurie nepateikti sąraše.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, GRP deep-V korpusas, Hypalon arba PVC vamzdžiai, centrinė konsolė. Disponible GA, matmenys, denio išdėstymas ir transportavimo planas. Dizaino kategorija C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP vidutinio stiprumo-V korpusas, Hypalon arba PVC vamzdeliai, šoninė arba centrinė konsolė. Bendras išplanavimas (GA) ir matmenys pateikiami. Klasės kategorija C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP korpusas, PVC vamzdeliai, vairas arba konsolė. Bendras išplanavimas (GA) ir matmenys pateikiami. Klasės kategorija C/D.
      icon: tabler:sailboat
    - title: AF380 pripučiama valtis
      description: 3,8 m pripučiama valtelė, aliuminio grindys, PVC vamzdeliai. Bendras išplanavimas ir pakavimo matmenys pateikiami. Atitinka EN ISO 6185 standartą.
      icon: tabler:sailboat
    - title: AF320 pripučiama valtis
      description: 3,2 m pripučiama valtis, oro grindų pagrindas, PVC vamzdeliai. Bendras išplanavimas ir pakavimo matmenys pateikiami. Atitinka EN ISO 6185 standartą.
      icon: tabler:sailboat
