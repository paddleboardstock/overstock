content_founding:
  tagline: Pradžia
  title: Gimęs prie krantinės
  subtitle: 'Aquafarer pradėjo dirbti pakrantės dirbtuvėse Čingdao su viena valtimi ir vizija: sukurti pripučiamus vandens laivus, galinčius atlaikyti tikras jūrines sąlygas.'
  paragraphs:
    - 2012 metais mūsų įkūrėjai pastebėjo rinkos spragą – dauguma pripučiamų laivų buvo arba prieinami, bet nepatikimi, arba aukštos kokybės, bet labai brangūs. Jie tikėjo, kad yra vietos gamintojui, kuris tiektų tiek kokybę, tiek vertę.
    - Pirmasis korpusas buvo pagamintas rankomis, išbandytas vietiniuose vandenyse ir patobulintas remiantis realiu žvejų ir smulkių komercinių operatorių grįžtamuoju ryšiu. Šis grįžtamojo ryšio ciklas – statyti, testuoti, klausytis, tobulinti – išlieka mūsų inžinerinės filosofijos pagrindu iki šiol.
    - Iki 2015 metų žinia jau buvo pasklidusi už Čingdao ribų. Tarptautiniai platintojai pradėjo prašyti pavyzdžių. Tai, kas prasidėjo kaip vietinis seminaras, tapo pasauliniu tiekėju.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Ankstyvoji gamybos dirbtuvė ir gamyba
content_growth:
  tagline: Augimas ir inovacijos
  title: Nuo dirbtuvių iki 12 000 m² patalpų
  subtitle: Nuolatinės investicijos į žmones, įrangą ir procesus virto Aquafarer modernia jūrų gamybos įmone.
  paragraphs:
    - Augant paklausai, augo ir mūsų gamykla. Išplėtėme veiklą nuo mažos dirbtuvės iki 12 000 m² gamyklos su specialiomis gamybos linijomis RIB valtims, pripučiamoms valtims SUP , lentoms ir priedams.
    - Investavome į CNC pjovimo stakles, aukšto dažnio suvirinimo įrangą, lašinio dygsnio gamybos linijas ir išsamius bandymų įrenginius – leidžiančius mums kontroliuoti kiekvieną gamybos kokybės aspektą.
    - Šiandien mūsų 200–300 žmonių komandoje yra jūrų inžinieriai, medžiagų mokslininkai, kokybės kontrolės specialistai ir kvalifikuoti amatininkai – daugelis jų dirba Aquafarer nuo pat pradžių.
content_mission:
  tagline: Mūsų misija
  title: Inžinerinė laisvė vandenyje
  subtitle: Kiekvienas Aquafarer produktas yra sukurtas tam, kad padėtų žmonėms tyrinėti, dirbti ir klestėti vandenyje — patikimai, saugiai ir už prieinamą kainą.
  list:
    - Dizainuoti vandens transporto priemones, kurios veikia tikrose jūrų sąlygose — ne tik popieriuje
    - Užmegzkite tvirtus partnerystės ryšius su platintojais ir prekės ženklais per patikimą OEM/ODM aptarnavimą
    - Nuolat tobulinkite savo gamybos procesus, kad suteiktumėte didesnę vertę
    - Palaikykite kiekvieną produktą autentiškomis atsarginėmis dalimis ir technine kompetencija
