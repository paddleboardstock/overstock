hero:
  title: Dydžių ir specifikacijų gidas
  subtitle: Matmenys, talpos ir rekomenduojamas naudojimas kiekvienam Paddle Board Overstock produktui.
categories:
  inflatable: Pripučiami SUPs ir kajakai, skirti patogiam transportavimui nepakenkiant našumui. Pasirinkite tinkamą dydį pagal savo svorį ir irklavimo stilių.
  rib: Kietos korpuso pripučiamos valtys pakrančių navigacijai, patruliavimui ir profesionalioms jūrų operacijoms. Rinkitės pagal ilgį ir variklio galią.
  accessory: Priedai ir saugos įranga, papildanti jūsų vandens transporto priemonę. Universalus dydis su keliomis parinktimis.
table:
  headers:
