how_to_choose:
  title: Kaip pasirinkti tinkamą dydį
  cards:
    - title: SUP Lentos
      description: Pasirinkite ilgį pagal savo svorį ir numatytą naudojimą. Platesnės lentos (32"+) suteikia daugiau stabilumo. Ilgesnės lentos (11–12 ft) geriau tinka turizmui. Sunkesni irkluotojai turi rinktis didesnės talpos lentas.
    - title: Baidarės
      description: Vienvietės kajakai (9 ft) geriausi solo kelionėms ir upėms. Dvigubi kajakai (12 ft) tinka dviem irkluotojams arba vienam su įranga. Patikrinkite svorio talpą, įskaitant visą įrangą.
    - title: Valtys ir RIBs
      description: Valties ilgį rinkitės pagal keleivių skaičių ir numatytą naudojimą. Didžiosios RIBs (4,5 m+) tinkamos jūrinei navigacijai ir gelbėjimui. Mažesnės valtys (2,7 m) tinka kaip pagalbinės valtys ir žvejybos platformos.
