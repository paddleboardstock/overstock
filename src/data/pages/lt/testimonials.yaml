testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Savininjas, Algarve Surf Academy
    location: Lagos, Portugalija
    content: Pradėjome nuo Klubo Pradžios Paketo mūsų banglenčių mokyklai. 20 lentų, irklai, liemenės — viskas atvyko per 3 savaites. Po dviejų sezonų mes atnaujinome į Pro Paketą. Individualus ženklinimas su mūsų logotipu labai pakėlė mūsų profesionalų įvaizdį.
    rating: 5
    product: Klubo pradžios paketas
    source: solutions/clubs
  - category: clubs
    name: Klubo savininkas
    title: Vandens sporto klubas
    location: Phuket, Tailandas
    content: Klubo Pradžios Paketas buvo puikus startas. Augant mūsų verslui, Paddle Board Overstock augo kartu su mumis — ta pati kokybė, ta pati kaina, jokių netikėtumų. Per 18 mėnesių padidinome lentų skaičių nuo 10 iki 80.
    rating: 5
    product: Klubo Pradžios + Premium Paketas
    source: success-stories
  - category: resorts
    name: Kurorto generalinis direktorius
    title: 5 žvaigždučių paplūdimio kurortas
    location: Graikija
    content: Paddle Board Overstock ne tik pristatė lentas — jie padėjo sukurti pilną svečių patirtį. Mūsų vandens sporto programa per vieną sezoną tapo kurorto akcentu. 300+ savaitinių užsakymų ir 180 000 $ metinių pajamų.
    rating: 5
    product: Prabangi kurorto programa
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Svečio patirties direktorė, Azure Bay Resorts
    location: Phuket, Tailandas
    content: Paddle Board Overstock suprojektavo ir aprūpino mūsų visą paplūdimio veiklų programą trijuose kurorto objektuose. 80 SUPs, 40 baidarių, saugumo infrastruktūra ir personalo mokymai — visa tai pristatyta vienu siuntimu. Svečių dalyvavimas pirmą sezoną padidėjo 60%.
    rating: 5
    product: Prabangi kurorto programa
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Įkūrėjas, Shoreline Paddle Co.
    location: Kalifornijoje, JAV
    content: Aš pradėjau savo SUP prekės ženklą neturėdamas jokios patirties šioje pramonėje. Paddle Board Overstock komanda vedė mane nuo produkto parinkimo iki individualaus logotipo dizaino ir pakuotės. Mano pirmasis konteineris atvyko per 11 savaičių, o aš išpardaviau per 3 mėnesius „Amazon“.
    rating: 5
    product: Pradinis Prekės Ženklo Paleidimas
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Įkūrėjas
    title: Australijos SUP prekės ženklas
    location: Australija
    content: Turėjau idėją dėl prekės ženklo, bet neturėjau gamybos žinių. Paddle Board Overstock tiesioginiame procese lydėjo mane nuo tinkamo lentos dizaino pasirinkimo iki pirmos siuntos atidarymo. 90 dienų nuo svajonės iki pristatymo.
    rating: 5
    product: Prekės ženklo pristatymo paketas
    source: success-stories
  - category: rental
    name: Danielis Okonkvo
    title: Savininkas, Lakeland SUP nuoma
    location: Ontario, Kanada
    content: Aš nuomodavau 5 lentas iš vietinio parduotuvės ir prarasdavau 60% pajamų jiems. Paddle Board Overstock padėjo man sukurti savo 15 SUPs flotilę. ROI skaičiuoklė rodė atsipirkimą per 4 mėnesius — užtruko 3. Dabar plečiu iki 30 lentų.
    rating: 5
    product: Transporto priemonių pradžios rinkinys
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Operacijų direktorius, Adriatic Adventure Tours
    location: Dubrovnikas, Kroatija
    content: Mes aprūpinome visą savo nuomojamą flotilę Paddle Board Overstock RIBs — 12 valčių trijose vietose. Po dviejų sezonų, jokių gedimų. CE sertifikavimo dokumentacija užtikrino sklandžią draudimo patvirtinimą. Jų inžinerijos komanda netgi pritaikė vamzdžių spalvas.
    rating: 5
    product: Flotilės plėtros rinkinys
    source: trust
  - category: rental
    name: Lt. Commander Andres Reyes
    title: Jūrų pirkimų pareigūnas, Filipinų pakrančių apsaugos pagalbinė tarnyba
    location: Manila, Filipinai
    content: Mes eksploatuojame 24 Paddle Board Overstock RIBs visoje mūsų pakrančių patrulių flotilėje. Jų QC procesas yra vienodas kiekviename partijose — tokia pati siūlių kokybė, tokia pati vožtuvo vieta, tokia pati slėgio klasė kiekvieną kartą. Šis pakartojamumas yra svarbus, kai nuo įrangos priklausys gyvybės.
    rating: 5
    product: RIB patrulių flotilė
    source: trust
  - category: consumers
    name: Sarah K.
    title: Pirmą kartą SUP savininkė
    location: Tahoe ežeras, JAV
    content: Stabilus net visiškai pradedantiesiems. Pirmą dieną išsinešiau ant ežero ir niekada nenukritau. Pilnas komplektas su pompa ir irkliu reiškė, kad buvau vandenyje po 20 minučių nuo dėžės atidarymo.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 savininkas
    location: Vankuveris, Kanada
    content: Kaip pirmą kartą perkantis, nerimavau dėl kokybės užsakant iš užsienio. ISO Dokumentacija ir nepriklausomi testų ataskaitos, kurias jie pasidalino dar prieš manęs paklausus, suteikė visišką pasitikėjimą. Lenta atvyko per 6 dienas ir pranoko mano lūkesčius.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike'as R.
    title: Laisvalaikio baidarininkas
    location: Florida, JAV
    content: Stipri konstrukcijos kokybė. Geriau susidoroja su pakrančių bangavimu nei tikėjausi iš pripučiamo. Supakavau į automobilio bagažinę savaitgalio kelionei — pripučiama prie paleidimo rampos per mažiau nei 4 minutes.
    rating: 5
    product: Pripučiama baidarė
