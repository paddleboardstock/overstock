content_challenge:
  tagline: Iššūkis
  title: Jūrinės energijos poreikiai<br />Ekstremalios aplinkos patikimumas
  subtitle: Jūrinės energetikos operacijos išnaudoja įrangą iki ribos – ekstremalios oro sąlygos, atokios vietovės, nuolatiniai darbo ciklai ir nulinė gedimų tolerancija.
  paragraphs:
    - Jūrinė energetikos pramonė veikia pačiose sudėtingiausiose jūrinėse aplinkose pasaulyje. Darbo laivai palaiko naftos ir dujų platformas, vėjo turbinų įrenginius, povandeninių kabelių eksploatavimą ir jūrų statybos projektus – dažnai atviroje jūroje su ribotais oro langais. Įrangos gedimas yra ne tik brangus, bet ir pavojingas.
    - '**Saugumas yra aukščiausias prioritetas** — Įgulos perkėlimo laivai privalo saugiai veikti jūros sąlygomis, kurios sustabdytų kitas operacijas. Stabilumas perdavimo vietoje, patikimas variklio veikimas bet kokiomis oro sąlygomis ir tvirta konstrukcija, leidžianti pakartotinai prisišvartuoti prie jūrinių konstrukcijų, yra privalomi reikalavimai.'
    - '**Visų oro sąlygų pajėgumas yra būtinas** — Jūrinės vėjo jėgainės ir naftos platformos veikia visus metus. Darbo laivai turi veikti esant stiprioms bangoms, stipriam vėjui ir ribotam matomumui. Dienos ir nakties operacijoms reikalingos pilnos navigacijos sistemos ir patikimos apšvietimo sistemos.'
    - '**Jūrinio vėjo sektorius sparčiai auga** — Visame pasaulyje įrengiama tūkstančiai naujų turbinų, kurioms reikia reguliaraus įgulos perkėlimo, įrankių pervežimo ir techninės priežiūros. Tai sukuria nuolatinę paklausą specialiai įgulos perkėlimo laivams (CTV) ir palaikymuiRIBs.'
    - Paddle Board Overstock jūrinė energija RIBs yra projektuojama naudojant sustiprintus gilios V formos korpusus, sunkiuosius Hypalon vamzdžius, pilnas navigacijos sistemas ir saugos sistemas, skirtas ekstremalioms jūrinės energetikos eksploatavimo sąlygoms.
content_solution:
  tagline: Mūsų sprendimas
  title: Specialiai pastatyta jūroje RIBs<br />Energetikos pramonei
  subtitle: Kiekviena Paddle Board Overstock jūrinė energija RIB sukurta saugiai, patikimai veiklai ekstremaliomis jūrinėmis sąlygomis – nuo Šiaurės jūros iki Pietryčių Azijos.
  list:
    - Sustiprintas gilus V formos korpusas, skirtas našumui audringoje jūroje ir nuspėjamam valdymui
    - Sunkiosios Hypalon konstrukcijos vamzdžiai UV su cheminiu atsparumu ilgalaikei tarnybai jūroje
    - 316 nerūdijančio plieno furnitūros — nėra korozijos nuolat veikiant sūriam vandeniui
    - 'Pilnas navigacijos komplektas: GPS, radaras, VHF, naktiniai navigacijos žibintai — standartinė įranga jūriniuose modeliuose'
    - Savaime išsikraunantis denis saugiam veikimui įlaipinimo jūros sąlygomis
    - Kelios variklių konfigūracijos – vienas arba du išoriniai dėl misijos atsargumo
    - Vilkimo postas ir sunkiosios tvirtovės platformų ir plūdurų tvarkymui
    - Didelio matomumo vamzdžių spalvos identifikavimui atviroje jūroje darbo vietose
content_segments:
  tagline: Energijos profiliai
  title: Jūrinės energijos sprendimai<br />Pagal programos tipą
  subtitle: Skirtingi jūrinės energetikos sektoriai turi unikalius darbo laivų reikalavimus – nuo platformų palaikymo RIBs iki vėjo jėgainių CTV ir povandeninių inspektavimo laivų.
  items:
    - title: Jūrinės naftos ir dujų platformos palaikymas
      subtitle: Įgulos perkėlimas, įrangos tiekimas, platformos saugos budėjimas
      description: Naftos ir dujų platformoms reikia kasdienio įgulos keitimo, įrangos ir tiekimo transportavimo bei saugos budėjimo užtikrinimo. Darbo valtys turi saugiai veikti aplink platformų konstrukcijas, stipriose srovėse ir kintančioje jūros būsenoje, bei užtikrinti tikslų stoties palaikymą personalo perkėlimo kopėčiomis ar laiptais metu. Ekstremalios aplinkos – angliavandeniliai, cheminės medžiagos, nuolatinis druskos purškimas – reikalauja korozijai atsparios konstrukcijos ir patikimo veikimo.
      features:
        - Įgulos perkėlimo konfigūracija su saugiu įlipimu ir turėklais
        - Korozijai atsparios Hypalon vamzdeliai ir 316 nerūdijančio plieno furnitūros
        - Sustiprintos trinančios lentos dažnam platformos sparno kontaktui
        - Savaime išsipildanti terasa riebaluotam vandeniui ir cheminiam nuplovimui
        - Didelės talpos kuro bakas ilgesniam nuotoliui jūroje
        - Dviejų variklių variantas misijai kritiškai svarbiai atsargai
    - title: Jūrinių vėjo jėgainių veikla
      subtitle: Įgulos perkėlimas, turbinos priežiūra, įrankių transportavimas
      description: Jūrinis vėjas yra sparčiausiai augantis jūrų energetikos sektorius. Operatoriams reikalingi įgulos perkėlimo laivai (CTV), kurie saugiai pervežtų technikus į turbinų prieigos platformas jūros būsenoje iki 1,5 m reikšmingo bangų aukščio. Stabilumas perkėlimo metu, bet kokiomis oro sąlygomis ir patikimas kasdienis veikimas yra labai svarbūs. Vėjo jėgainių aptarnavimo laivai veikia griežtu grafiku – bet koks prastovų laikas atidėlioja turbinų paleidimą ar priežiūrą, tiesiogiai paveikdamas energijos gamybos pajamas.
      features:
        - Optimizuota korpuso forma stabiliam įgulos perkėlimui prie turbinos pagrindo
        - Deep-V įėjimas patogiam važiavimui atviroje jūroje su bangavimu ir bangavimu
        - Pilna apsauga nuo oro sąlygų — uždara konsolė arba vairavimo kabina įgulai užtikrinti komfortą
        - Denio vieta įrankiams, atsarginėms dalims ir aptarnavimo įrangai
        - Naktinių operacijų paketas pratęstoms žiemos pamainoms dienos metu
        - Ramus išorinis valdymas, užtikrinant minimalų triukšmo poveikį jūrų aplinkai
    - title: Povandeninių kabelių ir vamzdynų palaikymas
      subtitle: Inspekcija, priežiūra, ROV palaikymas, apžiūra
      description: Povandeninių kabelių ir vamzdynų operatoriams reikia darbo valčių maršrutų tikrinimui, techninės priežiūros palaikymui, ROV operacijoms ir tyrimų užduotims. Šiems laivams reikalingos stabilios platformos povandeninės įrangos diegimui ir atgavimui, tikslus žemo greičio manevravimas kabelių sekimui ir patikimas eksploatavimas pakrančių ir jūroje. Laivų stabilumas yra kritiškai svarbus sonaro ir tyrimų įrangos tikslumui.
      features:
        - Stabili platforma lėtu greičiu kabelių sekimui ir žvalgymo operacijoms
        - Atviro denio išdėstymas ROV išdėstymui, kabelių ritinėliai ir matavimo įranga
        - Įrangos montavimo plokštės sonarui, GPS ir geodezijos įrankiams
        - Mažo bangavimo korpuso dizainas, siekiant minimaliai trikdyti jūrų dugną inspekcijos metu
        - Tikslus lėto greičio manevravimas su jautriu pakabinamu vairavimu
    - title: Jūrų inžinerijos ir statybos palaikymas
      subtitle: Personalo transportas, medžiagų tiekimas, nardymo palaikymas
      description: Jūrų inžinerijos rangovai, dirbantys prie uosto statybos, pakrančių apsaugos ir jūrinės įrangos montavimo projektų, reikia universalių darbo laivų personalo pervežimui tarp statybos laivų ir kranto, medžiagų ir įrankių tiekimui, nardymo palaikymui ir vietos apžiūroms. Šie laivai veikia aktyviose statybos zonose su daugeliu laivų, ribota manevravimo vieta ir kintančiomis jūrų sąlygomis. Patvarumas ir universalumas yra itin svarbūs.
      features:
        - Daugiafunkcinė denio išdėstymo sistema personalui, medžiagoms ir nardymo įrangai
        - Nardymo kopėčios ir įrangos montavimas nardymo palaikymo operacijoms
        - Stiprios kilpų ir vilkimo stulpelio konstrukcijos statybos aikštelės manevravimui
        - Tvirta Hypalon konstrukcija atspari statybinių šiukšlių poveikiui ir trinčiai
        - Lankstus sėdynių išdėstymas — personalo transportavimui arba krovinio režimui
