hero:
  tagline: Procesas
  title: Gamybos procesas
  subtitle: Nuo žaliavos iki jūroje paruošto laivo – kiekvienas žingsnis mūsų kontrolėje
  back_label: Grįžti į gamyklą
  back_link: /factory
intro: Skirtingai nei prekių ženklai, kurie gamybą perduoda trečiųjų šalių gamykloms, Aquafarer patys valdo ir eksploatuoja visą gamybos grandinę. Ši vertikali integracija leidžia mums išlaikyti griežtą kokybės kontrolę kiekviename etape, greitai reaguoti į individualius reikalavimus ir tiekti nuoseklią produkto kokybę partija po partijos. Štai kaip mūsų gamykloje statomas laivas.
steps:
  - step: '01'
    title: Medžiagų priėmimas ir patikra
    description: Kiekviena atvykstanti PVC audinio, stiklo pluošto kilimėlio, dervos ir furnitūros partija tikrinama pagal specifikacijas. Audinių mėginiai tikrinami dėl tempimo stiprumo, storio vienodumo ir UV atsparumo prieš išleidžiant į gamybą. Neatitinkančios medžiagos yra karantinuojamos ir grąžinamos.
    duration: 1–2 dienos
  - step: '02'
    title: Automatinis PVC pjovimas
    description: Patvirtinti audiniai dedami ant automatinės CNC pjovimo mašinos ir pjaustomi su submilimetriniu tikslumu. Kompiuteriu optimizuotas lizdas išdėsto plokštes taip, kad sumažintų atliekų kiekį – paprastai mažiau nei 5%. Pjaustytos plokštės pažymėtos pagal laivo modelį ir kamerą, tada sujungiamos į komplektus pervežimui į suvirinimo dirbtuves.
    duration: 2–4 valandos vienam laivo rinkiniui
  - step: '03'
    title: Vamzdžių šiluminis sandarinimas ir suvirinimas
    description: Plokštės tvirtinamos ir klijuojamos naudojant šilumos sandarinimo mašinas su karšto oro suvirinimu kontroliuojamoje 200–600 °C temperatūroje. Pagrindinės siūlės sustiprinamos RF dielektriniu suvirinimu, kad būtų pagamintos sandarios, didelio stiprumo jungtys. Baigtos kameros pripučiamos iki 1,25× darbinio slėgio, užtikrinant 30 minučių oro sulaikymo patvirtinimą.
    duration: 1–2 dienos kiekvienam laivui
  - step: '04'
    title: Stiklo pluošto RIB korpuso apdaila
    description: RIB Laivų korpusai gaminami naudojant rankomis uždengtą stiklo pluošto liejimą. Stiklo pluošto kilimėlio sluoksniai ir austi rovai rankomis valcuojami su poliesterio arba vinilesterio derva tiksliose formose. Kiekvienas sluoksnis vakuumuotas, užtikrinant vienodą laminato kokybę. Korpusas padengiamas gelcoat, kad paviršius būtų itin blizgusUV, atsparus jūrai.
    duration: 2–4 dienos kiekvienam korpusui
  - step: '05'
    title: SUP Spauda ir dekoravimas
    description: SUP Plokštės plokštės grafika naudojama skaitmeniniu spausdinimu pilnų spalvų fotokokybės dizainams ir šilkografija patvariems logotipams bei pasikartojantiems raštams. Spaudiniai kietinami ir sandarinami, kad būtų UV atsparūs trinimui.
    duration: 1–2 dienos
  - step: '06'
    title: Galutinis surinkimas ir rigavimas
    description: Stiklo pluošto korpusai ir PVC vamzdžių mazgai sujungiami surinkimo linijoje. Variklis montuojamas, vairavimo ir droselio valdikliai sujungiami, įrengiama kuro sistema, o visa elektros instaliacija sujungta. Kiekvienas laivas laikosi 100 punktų surinkimo sąrašo su privalomu patvirtinimu kiekviename etape.
    duration: 2–3 dienos
  - step: '07'
    title: Kokybės testavimas ir apžiūra
    description: 'Kiekviena baigta valtis privalo praeiti kokybės patikrinimus: kameros oro sulaikymo testą, sistemų veikimo patikrinimą, tvirtinimo detalių sukimo momento patikrinimą ir kosmetinę apžiūrą. Individualūs ir prototipiniai modeliai taip pat patiria jūrinius bandymus vandenyje, apimančius greitį, valdymą, stabilumą ir ištvermę.'
    duration: 1–2 dienos
  - step: '08'
    title: Pakavimas ir siuntimas
    description: Valtys išleidžiamos, sulankstomos pagal procedūrą, supakuojamos į tvirtus pintus maišus arba faneros dėžes ir pakraunamos siuntimui. Kiekviena siunta pažymėta modeliu, serijos numeriu ir paskirties vieta. Mes koordinuojame su krovinių ekspeditoriais FCL ir LCL konteinerių siuntoms visame pasaulyje.
    duration: 1 diena
