workshops_section:
  tagline: Dirbtuvės
  title: Gamybos dirbtuvės
  workshops:
    - title: PVC Pjovimas ir medžiagų paruošimas
      description: Automatinės CNC pjovimo mašinos apdoroja PVC, Hypalon, ir drop-stitch audinius submilimetriniu tikslumu. Kompiuteriu optimizuotas įdėjimas sumažina medžiagų atliekas ir užtikrina, kad kiekviena plokštė atitiktų savo matmenų specifikacijas prieš suvirinimą.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Vamzdžių suvirinimas ir šilumos sandarinimas
      description: Specializuota suvirinimo dirbtuvė su šilumos sandarinimo mašinomis ir RF dielektriniais presais. Karšto oro šilumos sandarikliai sujungia ir saugo PVC vamzdžių kameras, o RF suvirinimai sukuria aukšto stiprumo sandarias siūles, viršijančias ISO 9001 reikalavimus.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Korpuso gamyba — stiklo pluoštas
      description: RIB Valčių korpusai gaminami naudojant rankomis uždengiamą stiklo pluošto profilį su poliesterio ir vinilo dervos sistemomis. Kiekvienas sluoksnis rankomis valcuojamas ir vakuumuojamas, užtikrinant nuoseklią kokybę. Gelcoat purškimo kabina suteikia aukšto blizgesio, UVatsparią jūrinei apdailai.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Spauda ir dekoravimas
      description: SUP Kartonai dekoruojami skaitmeniniu spausdinimu pilnų spalvų grafikai ir šilkografija logotipams bei pasikartojantiems raštams. Skaitmeniniai spausdintuvai kuria fotokokybės terasų dizainus, o šilkografija užtikrina patvarius, ryškius prekės ženklo ženklus.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Galutinis surinkimas ir rigavimas
      description: Surinkimo linija, kurioje sujungiami stiklo pluošto korpusai ir PVC vamzdžiai, montuojami varikliai, sujungiami vairavimas ir valdymas, o elektros sistemos prijungtos laidais. Kiekvienas laivas laikosi 100 punktų surinkimo sąrašo, kurį patvirtina komandos vadovas.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Kokybės testavimas ir apžiūra
      description: Kiekviena baigta valtis privalo atlikti oro sulaikymo testus, siūlės lupimo patikrinimą ir pilną sistemų patikrą prieš siunčiant. Mūsų kokybės laboratorija veikia nepriklausomai nuo gamybos ir tiesiogiai atsiskaito vadovybei.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
