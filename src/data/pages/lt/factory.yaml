qc_section:
  tagline: Kokybės kontrolė
  title: Testavimo ir kokybės užtikrinimo procesas
  subtitle: Kiekvienas laivas prieš išsiuntimą yra privalomai testuojamas. Mūsų kokybės laboratorija veikia nepriklausomai nuo gamybos ir tiesiogiai atsiskaito vadovybei.
  steps:
    - step: '1'
      title: Žaliavų inspekcija
      desc: PVC, Hypalon, ir drop-stitch audiniai prieš pradedant gamybą praeina tempimo bandymus (ASTM D751), plyšimo sklidimą ir UV atsparumo patikrinimą.
    - step: '2'
      title: 48 valandų oro sulaikymo testas
      desc: Kiekviena vamzdžio kamera pripučiama iki 125 % nominalaus slėgio ir laikoma 48 valandas. Slėgio kritimas, viršijantis 5 %, sukelia automatinį atmetimą ir siūlės pakartotinę apžiūrą.
    - step: '3'
      title: Apkrovos ir balanso testavimas
      desc: Baigti laivai pakraunami iki maksimalios nominalios talpos ir tikrinami dėl stabilumo, borto ir valdymo. Kiekvienas laivas yra testuojamas vandenyje prieš galutinę apžiūrą.
oem_section:
  tagline: OEM Projektai
  title: Prekės ženklo ir OEM partnerystės atvejų analizės
  subtitle: Nuo idėjos iki konteinerio – kaip padedame pasauliniams prekės ženklams pristatyti ir plėsti pripučiamų vandens transporto priemonių linijas.
  cases:
    - challenge: Europos lauko prekių mažmenininkui reikėjo privačios etiketės SUP linijos su unikaliomis terasos grafikomis, ekologiška PVCir prekybai paruošta pakuote – visa tai pristatyta per 60 dienų.
      solution: Sukūrėme individualius skaitmeninius spausdinimo failus, suradome REACHPVCatitinkančius reikalavimus ir suspaudėme mėginių ėmimą iš 3 raundų į 1, bendradarbiaudami su dizaino komanda mūsų Qingdao gamykloje.
      result: 55 dienos nuo pasirašyto pašto iki FOB2 400 vienetų per 4 SKU. Pakartotinis užsakymas pateiktas prieš atvykstant pirmajam konteineriui.
    - challenge: JAV vandens sporto startuoliui reikėjo aukštos klasės drop-stitch baidarės su individualia korpuso forma, bendro prekės ženklo pakuote ir BSCI sertifikavimu mažmeninei prekybai.
      solution: Pritaikė esamą drop-stitch baidarių formą su modifikuotu sūpynių profiliu, sukūrė bendro prekės ženklo pakuočių dizainą ir pateikė pilną BSCI audito dokumentaciją.
      result: Sėkmingai įtrauktas į 3 pagrindines JAV lauko tinklų parduotuves. Pirmaisiais metais parduota 5 000+ vienetų su 98 % pardavimų rodikliu.
    - challenge: Australijos platintojas reikalavo CEsertifikuoto RIB asortimento su individualiomis vamzdžių spalvomis, Hypalon atnaujinimo galimybe ir atitiktimi Australijos standartui AS 1799.
      solution: Pagamino priešgamybinius pavyzdžius su 4 vamzdelių spalvų variantais, gautus CSM Hypalon iš Japonijos tiekėjo, ir koordinavo trečiųjų šalių AS 1799 atitikties testavimą.
      result: 3 modelių RIB serija pristatyta Australijos/Naujosios Zelandijos rinkoje. Po to sekė vyriausybės konkursas 12 patrulių modeliamsRIBs.
faq_section:
  tagline: DUK
  title: B2B & OEM Dažniausiai užduodami klausimai
  questions:
    - q: Koks yra minimalus užsakymo kiekis (MOQ) OEM pripučiamoms SUP lentoms?
      a: MOQ standartiniams modeliams prasideda nuo 5–10 vienetų OEM . Individualios formos ir privačios etiketės projektai reikalauja mažiausiai 200 vienetų, priklausomai nuo sudėtingumo. Bandomieji užsakymai ir mėginių rinkimai yra prieinami naujų prekės ženklų pristatymams.
    - q: Aquafarer Ar turi BSCI sertifikatą?
      a: Taip. Mūsų gamykla palaiko galiojančią BSCI socialinės atitikties sertifikaciją (audito ataskaita prieinama pagal užklausą). Taip pat turime ISO 9001:2015 kokybės valdymui, o 64 mūsų produktų modeliai CE turi sertifikatą (TÜVRheinland).REACH ir RoHS atitikties dokumentai pateikiami su kiekviena OEM siunta.
    - q: Koks yra įprastas užsakymo pateikimo laikas OEM ?
      a: Standartinis pristatymo laikas yra 30–45 dienos nuo patvirtintos užsakymo sutarties ir avanso. Individualaus liejimo formos kūrimas prideda 15–20 dienų įrankių gamybai. Mes siūlome pagreitintą gamybą skubiems užsakymams ir sezoniniams pikams prieš vasarą (sausis–kovas).
    - q: Ar galite išsiųsti FOB Qingdao arba CIF į mūsų uostą?
      a: Taip. Mes siunčiame į FOB Qingdao, CIF pagrindinius pasaulinius uostus ir DDP kvalifikuotiems partneriams. Mūsų logistikos komanda tvarko konteinerių rezervavimą, eksporto dokumentaciją ir muitinės formalumus. Mes siunčiame į 50+ šalių visoje ES, JAV, AU ir Azijos rinkose.
b2b_moq: 'Standartas MOQ: 5–10 vienetų vienam modeliui (SUP/baidarė/drop-stitch). RIB MOQ: 2–5 vienetai. Naujiems partneriams laukiami bandymo užsakymai.'
production_flow:
  tagline: Gamybos srautas
  title: Nuo medžiagos iki baigtos valties
  subtitle: Kiekvienas laivas pereina 6 gamybos etapus, kiekviename žingsnyje yra kokybės patikros punktai. Nė jokių trumpųjų kelių, nė vienos praleistos patikros.
  stages:
    - stage: '01'
      title: Medžiagų priėmimas ir gaunamasis kokybės kontrolė
      description: Visos gaunamos medžiagos registruojamos pagal partijos/numerio numerį mūsų ERP sistemoje. PVC audinio ritės, drop-stitch šerdys, vožtuvai, klijai ir įranga yra izoliacijoje iki QC patvirtinimo.
      qc_check: Tempimo stipris (ASTM D751), plyšio atsparumas (ISO 4674), storio matuoklis, klijų klampumas, vizualinė defektų tikrinimas
      qc_threshold: Išbandyta 100 % partijų. Atmesti, jei tempimo stipris < 90 % nuo specifikacijos, plyšimas < minimalios specifikacijos arba bet koks vizualinis defektas
      responsibility: Atvykstanti QC komanda (3 inspektoriai)
    - stage: '02'
      title: CNC Pjovimas ir medžiagų paruošimas
      description: Kompiuteriu optimizuotas išdėstymas išdėsto plokštes ant PVC žaliavos, kad būtų sumažintas atliekų kiekis. Automatinės CNC pjovimo mašinos palaiko 0,1 mm pozicinį tikslumą.
      qc_check: Matmenų patikrinimas pagal CAD DXF failus, kraštų kokybės patikrinimas, skydelių skaičiaus patikrinimas
      qc_threshold: Išmatuojamas kiekvienas 20-asis skydelis. Tolerancija ±0,5 mm. Atmesti partiją, jei daugiau nei 2% pažeidžia toleranciją
      responsibility: Pjovimo dirbtuvės vadovas
    - stage: '03'
      title: Suvirinimas ir Drop-Stitch klijavimas
      description: Drop-stitch branduoliai yra sujungti su išoriniais PVC sluoksniais naudojant karštą laminavimą. Vamzdžių ertmės yra suvirintos RF arba karšto oro būdu. Bėgių juostos yra trijų sluoksnių fuzijos būdu sujungtos.
      qc_check: Atplėšimo testas kas 50 vienetų (ASTM D751), siūlės plotio matavimas, karšto oro temperatūros įrašų peržiūra, vizualinė siūlės apžiūra prie apšvietimo iš nugaros
      qc_threshold: Apsaugos stipris mažiausiai 8 N/cm. Suvirinimo pločio tolerancija ±1 mm. Bet koks matomas kanalizavimas = atmesti
      responsibility: Suvirinimo kokybės kontrolė (2 inspektoriai per pamainą)
    - stage: '04'
      title: Surinkimas ir įrengimas
      description: 'Laivai perkeliami į galutinę surinkimo vietą, kur sujungiami visi komponentai: korpuso + vamzdžiai, montuojami vožtuvai, D-formos žiedai, rankenos, plaukiojimo pelekų dėžutės ir nešimo krepšio tvirtinimas. Kiekviena vienetė laikosi 100 taškų surinkimo kontrolinio sąrašo.'
      qc_check: 100 punktų tikrinimo sąrašo patvirtinimas kiekvienam vienetui, vožtuvo funkcijos testas (10 atidarymo/uždarymo ciklų), aparatinės įrangos sukimo momento patikrinimas, vizualinė apžiūra
      qc_threshold: 'Nulinės klaidos politika saugai kritiškiems elementams (vožtuvai, D formos žiedai, rankenos). Nedideli kosmetiniai trūkumai: AQL 2,5 (ISO 2859)'
      responsibility: Surinkimo komandos vadovas + linijos kokybės kontrolė
    - stage: '05'
      title: Slėgio bandymas ir kokybės laikymas
      description: Kiekviena kamera pripučiama iki 1,25× nominalaus slėgio (dažniausiai 20–25 PSI) ir laikoma 24–48 valandas. Slėgio jutikliai fiksuoja nuolat. Kameros, kurių slėgis nukrenta daugiau nei 5%, yra atmestos ir siunčiamos siūlių pakartotiniam patikrinimui.
      qc_check: 24 val. slėgio palaikymo žurnalas, sensoriaus kalibracija tikrinama kasdien, temperatūra kompensuojamas slėgio matavimas, siūlės pakartotinis patikrinimas po taisymo
      qc_threshold: Maksimalus 5 % slėgio kritimas per 24 valandas esant stabiliai temperatūrai. Bet kuri kamera, viršijanti šią reikšmę = 100 % visos gamybos partijos pakartotinis testavimas
      responsibility: Kokybės laboratorija (nepriklausoma nuo gamybos, atsiskaito vadovybei)
    - stage: '06'
      title: Galutinė apžiūra ir pakavimas
      description: Galutinė vizualinė ir funkcinė patikra. Paviršiaus defektai, spalvų nuoseklumas, etikečių/konteinerių patikra, pakuotės vientisumas ir priedų pilnumas. Vienetai vakuumuojami, supakuojami į dėžes ir paletizuojami konteinerių pakrovimui.
      qc_check: Pilnas vizualinis patikrinimas, priedų kontrolinis sąrašasSKU, pakuotės kritimo testas (1 m, atsitiktinis mėginys), etiketės/brūkšninio kodo nuskaitymo patvirtinimas
      qc_threshold: AQL 2,5 – dideliems defektams, AQL 4,0 – smulkiems. Nulinė tolerancija saugos defektams. 100% vienetų vizualiai patikrinti
      responsibility: Galutinė kokybės kontrolės komanda (4 inspektoriai) + Pakavimo komandos vadovas
