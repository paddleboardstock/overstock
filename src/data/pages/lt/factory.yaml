hero:
  tagline: Gamykla
  title: Gamykla ir gamyba
  subtitle: 12 000 m2 integruotos gamybos – nuo žaliavų iki baigtų laivų
intro:
  - KaipAquafarer Qingdao Manufacturing Hub** gamyklos prekės ženklas, Aquafarer jis kontroliuoja kiekvieną gamybos etapą – nuo žaliavų PVC ir stiklo pluošto atvežimo iki galutinės laivo apžiūros prieš pristatymą. Mūsų gamybos patalpos Qingdao ekonominės plėtros zonoje užima 12 000 kvadratinių metrų plotą ir talpina specializuotas dirbtuves PVC pjovimui, vamzdžių šilumos sandarinimui, stiklo pluošto RIB korpusų gamybai, SUP skaitmeniniam spausdinimui, galutiniam surinkimui ir kokybės testavimui.
  - Integruodami projektavimą, inžineriją, prototipų kūrimą, gamybą ir testavimą po vienu stogu, pašaliname sutartinės gamybos neefektyvumą ir išlaikome tiesioginę kontrolę gamybos kokybei, medžiagų pasirinkimui ir pristatymo terminams. Kiekvienas laivas, išplaukiantis iš mūsų dirbtuvių, yra statomas mūsų žmonių, mūsų įranga, pagal mūsų standartus.
