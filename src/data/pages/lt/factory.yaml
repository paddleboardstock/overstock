testing_section:
  tagline: Kokybės kontrolė
  title: Testavimo ir kokybės užtikrinimo procesas
  description: Kiekvienas laivas prieš išsiuntimą yra privalomai testuojamas. Mūsų kokybės laboratorija veikia nepriklausomai nuo gamybos ir tiesiogiai atsiskaito vadovybei.
  steps:
    - title: Žaliavų inspekcija
      desc: PVC, Hypalon, ir drop-stitch audiniai yra tempiamieji bandymai, plyšimo sklidimas ir UV atsparumo patikrinimas prieš pradedant gamybą.
    - title: 48 valandų oro sulaikymo testas
      desc: Kiekviena vamzdžio kamera pripučiama iki 125 % nominalaus slėgio ir laikoma 48 valandas. Slėgio kritimas, viršijantis 5 %, sukelia automatinį atmetimą ir siūlės pakartotinę apžiūrą.
    - title: Apkrovos ir balanso testavimas
      desc: Baigti laivai pakraunami iki maksimalios nominalios talpos ir tikrinami dėl stabilumo, borto ir valdymo. Kiekvienas laivas yra testuojamas vandenyje prieš galutinę apžiūrą.
case_studies:
  tagline: OEM Projektai
  title: Prekės ženklo ir OEM partnerystės atvejų analizės
  description: Nuo idėjos iki konteinerio – kaip padedame pasauliniams prekės ženklams pristatyti ir plėsti pripučiamų vandens transporto priemonių linijas.
  labels:
    challenge: Iššūkis
    solution: Sprendimas
    result: Rezultatas
  cards:
    - challenge: Europos lauko prekių mažmenininkui reikėjo privačios etiketės SUP linijos su unikaliomis terasos grafikomis, ekologiška PVCir prekybai paruošta pakuote – visa tai pristatyta per 60 dienų.
      solution: Sukūrėme individualius skaitmeninius spausdinimo failus, suradome REACHPVCatitinkančius reikalavimus ir suspaudėme mėginių ėmimą iš 3 raundų į 1, bendradarbiaudami su dizaino komanda mūsų Qingdao gamykloje.
      result: 55 dienos nuo pasirašyto pašto iki FOB2 400 vienetų per 4 SKU. Pakartotinis užsakymas pateiktas prieš atvykstant pirmajam konteineriui.
    - challenge: JAV vandens sporto startuoliui reikėjo aukštos klasės drop-stitch baidarės su individualia korpuso forma, bendro prekės ženklo pakuote ir BSCI sertifikavimu mažmeninei prekybai.
      solution: Pritaikė esamą drop-stitch baidarių formą su modifikuotu sūpynių profiliu, sukūrė bendro prekės ženklo pakuočių dizainą ir pateikė pilną BSCI audito dokumentaciją.
      result: Sėkmingai įtrauktas į 3 pagrindines JAV lauko tinklų parduotuves. Pirmaisiais metais parduota 5 000+ vienetų su 98 % pardavimų rodikliu.
    - challenge: Australijos platintojas reikalavo CEsertifikuoto RIB asortimento su individualiomis vamzdžių spalvomis, Hypalon atnaujinimo galimybe ir atitiktimi Australijos standartui AS 1799.
      solution: Pagamino priešgamybinius pavyzdžius su 4 vamzdelių spalvų variantais, gautus CSM Hypalon iš Japonijos tiekėjo, ir koordinavo trečiųjų šalių AS 1799 atitikties testavimą.
      result: 3 modelių RIB serija pristatyta Australijos/Naujosios Zelandijos rinkoje. Po to sekė vyriausybės konkursas 12 patrulių modeliamsRIBs.
