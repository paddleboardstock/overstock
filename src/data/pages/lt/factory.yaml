material_traceability:
  tagline: Sekamumas
  title: Medžiagos sekimas ir partijų kontrolė
  description: Kiekvienai žaliavos partijai mūsų sistemoje priskiriamas unikalus partijos numeris ERP . Nuo atvykimo iki gamybos iki galutinio produkto kiekvieno laivo medžiagų sąrašas susiejamas su originalia tiekėjo partija. Tai leidžia visiškai atsekti bet kokį kokybės ar atitikties patikrinimą aukštyn grandyje.
  system: Individualios ERP (vidinės sistemos) + fizinės partijų žymos kiekvienam darbo užsakymui
  coverage: 100% gamybos medžiagų — PVC, Hypalon, drop-stitch audiniai, klijai, vožtuvai, aparatūra, pakuotė
  records_retained: 10 metų (pagal CE 2013/53/ES reikalavimą)
  suppliers:
    - material: Jūrų laivyno laipsnis PVC
      source: Kinijos ir Korėjos tiekėjai
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch Audinys
      source: Viduje atliekamas pynimas + išorinis partneris
      certified: Vidinis kokybės kontrolės + tiekėjas ISO 9001
    - material: Lempos ir aparatinė įranga
      source: Chinese OEM suppliers
      certified: ISO 9001, medžiagų sertifikatai kiekvienai partijai
