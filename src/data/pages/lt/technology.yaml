testimonial:
  quote: Kas išskiria Aquafarer, tai jų medžiagų mokslas. Jie ne tik surenka komponentus — jie kuria PVC mišinius, suvirinimo parametrus ir konstrukcijos sluoksnius viduje. Ši vertikali integracija matoma galutiniame produkte.
  author: David Park
  title: Produkto vystymo vadybininkas
  company: Bluewater Sports Equipment
  location: Australija
sections:
  - title: Drop-stitch šerdis
    standard: 12-15 PSI darbinis slėgis
    description: Tūkstančiai vidinių poliesterio siūlų sujungia viršutinius ir apatinius sluoksnius, sukuriant standžią struktūrą esant 12-15 PSI. Ši technologija naudojama profesionalioseklirklinių lentų ir pripučiamų lenktyninių valčių gamyboje. Mūsų drop-stitch tankis optimizuotas pagal modelį idealiam stangrumo ir svorio balansui.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS pagrindo diagrama
  - title: Jūrų Klasės PVC
    standard: Suvirinta fuzijos būdu | UV / sūraus vandens / atspari trinčiai
    description: Daugiasluoksnė laminuota PVC medžiaga, skirta jūrų aplinkai. Kiekvienas sluoksnis sujungtas fuzijos būdu, o ne klijuotas, taip eliminuojant delaminacijos riziką. Patikrinta dėl UV atsparumo (ASTM G154, 1 000+ valandų), korozijos sūraus vandens (ISO 9227) ir trinčiai (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC sluoksnis
  - title: Hypalon vamzdžiai
    standard: CSM guma | UV / cheminė / atspari ekstremalioms temperatūroms
    description: Naudojama RIB modeliuose, Hypalon (CSM) guma suteikia pranašesnį UV ir cheminį atsparumą, palyginti su standartine PVC. Hypalon vamzdžiai išlaiko lankstumą ekstremaliomis temperatūromis ir atsparūs degradacijai dėl kuro ir alyvos poveikio. Visos siūlės rankomis dėliojamos sertifikuotų technikų.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Oro denio grindys
    standard: Aukšto slėgio pripučiama | Pakeičia fanerą/aliuminį
    description: Aukšto slėgio pripučiamų grindų sistema, keičianti tradicines fanerines ar aliumines lentų grindis. Sumažina surinkimo laiką, bendrą svorį ir sandėliavimo tūrį, tuo pačiu užtikrinant pakankamą standumą stovėjimui, žvejybai ir vaikščiojimui. Išbandyta, kad atlaikytų 200 kg paskirstytą apkrovą.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Oro denis
