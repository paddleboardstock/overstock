label: Garantija
headline: Aquafarer Gamintojo ribota garantija
subtitle: Aquafarer užtikrina kiekvieno mūsų gaminamo pripučiamos jūrinės produkcijos kokybę. Ši Ribota garantija nurodo jūsų Aquafarer produkto garantijos sąlygas ir aprėptį.
seo:
  headline: Aquafarer Pripučiamos valties garantija – 5 metų ribota garantija | Aquafarer
  description: Aquafarer suteikia 5 metų ribotą garantiją pagrindiniam vamzdžio audiniui, siūlėms ir stiklo pluošto korpuso struktūrinei integrei. Taip pat apima pripūtimo vožtuvus ir gamykloje sumontuotus priedus. Pilnos Aquafarer pripučiamos valties garantijos sąlygos.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ši Ribota garantija taikoma naujiems Aquafarer prekės ženklo pripučiamiems jūriniams produktams, įsigytiems tiesiogiai iš Aquafarer arba iš įgalioto Aquafarer pardavėjo ar mažmenininko. Galiojimo data nustatoma pagal tvirtinamą pradinės mažmeninės prekybos pirkimo datą.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantijos aprėptis ir trukmė</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Pagrindinio vamzdžio audinio vientisumas (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Stiklo pluošto korpuso struktūrinė integracija</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Pripučiamo vamzdžio siūlių sandarumas</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Pripūtimo vožtuvų veikimas</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 metai</h3>
        <p class="text-sm text-gray-600 mt-1">Gamykloje sumontuoti priedai ir pagalbinė įranga</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 metai*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercinis, nuomos ar flotilių naudojimas – visos dalys</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komercinis, valstybinis, čarterinis, nuomos ar mokymo naudojimas sumažina garantijos laikotarpį iki 1 metų. Varžybų ar konkurencijos naudojimas visiškai panaikina garantiją.</p>
  </div>

  <h2>Kas yra apimta</h2>
  <h3>Pagrindinio vamzdžio audinys (5 metai)</h3>
  <p>Aquafarer garantuoja pagrindinį vamzdžio audinį nuo pralaidumo blogėjimo, kuris ženkliai ribotų produkto gebėjimą išlaikyti veiksmingą pripūtimą. Tai taikoma CSM (Hypalon) dengtam audiniui ir visoms kitoms vamzdžio audiniui naudojamoms medžiagoms.</p>

  <h3>Stiklo pluošto korpuso struktūrinė integre (5 metai)</h3>
  <p>Produktams su stiklo pluoštu sustiprintu plastiko (FRP) korpusu pagrindinė kompozitinė struktūra yra garantuojama nuo struktūrinių gedimų dėl medžiagų ar gamybos defektų.</p>

  <h3>Pripučiamo vamzdžio siūlių sandarumas (5 metai)</h3>
  <p>Pripučiamų vamzdžių siūlės, sujungtos gamybos metu, yra garantuojamos nuo gamybos defektų, kurie lemia reikšmingą oro nutekėjimą per siūlę. Periodinė apžiūra ir tinkamo pripūtimo slėgio palaikymas yra aprėpties sąlygos.</p>

  <h3>Pripūtimo vožtuvų veikimas (5 metai)</h3>
  <p>Oro pripūtimo vožtuvai, originaliai sumontuoti Aquafarer, yra garantuojami nuo medžiagų arba gamybos defektų, kurie trukdo vožtuvui išlaikyti orą pagal numatytą funkciją.</p>

  <h3>Gamykloje sumontuoti priedai (1 metai)</h3>
  <p>Komponentai ir įranga, pagaminti Aquafarer ir originaliai sumontuoti gamykloje, yra garantuojami nuo medžiagų ir gamybos defektų vienerius metus. Tai neapima trečiųjų šalių prekių, kurios yra apdraustos tik pagal jų gamintojų garantijas.</p>

  <h2>Kas nėra apimta</h2>
  <ul>
    <li>Kosmetiniai defektai, įskaitant spalvos pakitimus, dėmes, išblukimą, kalkėjimą ar bet kokius išvaizdos pasikeitimus</li>
    <li>Dūriai, įpjovimai, plyšimai, plyšimai ar kita fizinė žala</li>
    <li>Įtrūkimai, įtrūkimai, trynimasis, braižymas ar nykimas dėl trinties ar kontakto</li>
    <li>Degradacija dėl UV šviesos poveikio, oro sąlygų ar atmosferos sąlygų</li>
    <li>Pažeidimai dėl kontakto su kuru, tirpikliais, rūgštimis, šarminėmis medžiagomis ar cheminėmis medžiagomis</li>
    <li>Žala dėl aplaidumo, netinkamo naudojimo, piktnaudžiavimo, nelaimingo atsitikimo ar įprasto nusidėvėjimo</li>
    <li>Gelcoat ar dažų paviršiaus problemos (pūslės, skilimas, spalvos pakitimai, blukimas)</li>
    <li>Žala nuo smūgio, streso, netinkamos atramos ar tempimo</li>
    <li>Žala dėl netinkamos infliacijos/defliacijos arba nepatvirtintų infliacijos priemonių naudojimo</li>
    <li>Trečiųjų šalių įranga, komponentai ar sistemos (apdraustos atitinkamų gamintojų)</li>
  </ul>

  <h2>Gamintojo pareiga ir teisių gynimo priemonė</h2>
  <p>AquafarerVienintelė ir išskirtinė prievolė yra Aquafarerbet kurio komponento, nustatyto kaip defektuoto medžiagų ar darbo kokybės ir apdrausto šia garantija, remontas arba pakeitimas pagal savo pasirinkimą. Remontą ar keitimą atlieka arba Aquafarer jo paskirta įgaliota aptarnavimo įstaiga. Suremontuoti ar pakeisti komponentai galioja tik nepasibaigusį pradinės garantijos laikotarpį.</p>

  <h2>Garantijos sąlygos</h2>
  <ul>
    <li><strong>Registracija:</strong>Produktas turi būti tinkamai užregistruotas, kaip nurodyta garantijos sąlygose.</li>
    <li><strong>Priežiūra:</strong>Produktas turi būti prižiūrimas laikantis Aquafarerpaskelbtų gairių, įskaitant periodinę apžiūrą ir tinkamų infliacijos slėgių priežiūrą.</li>
    <li><strong>Bendradarbiavimas:</strong>Pirkėjas privalo visiškai ir greitai bendradarbiauti visais klausimais, susijusiais su Aquafarer garantijos reikalavimais.</li>
    <li><strong>Pirminis pirkėjas:</strong>Ši garantija suteikiama išimtinai pradiniam galutiniam pirkėjui ir nėra perleidžiama.</li>
  </ul>

  <h2>Komercinis naudojimas</h2>
  <p>Jei produktas naudojamas komerciniam, valstybiniam, ne pelno siekiančiam, charterio, nuomos, mokymo ar bet kokiam kitam tikslui, išskyrus privačią pramogą, visų komponentų garantijos laikotarpis sumažinamas iki vienerių (1) metų nuo pradinės mažmeninės prekybos datos. Naudojimas lenktynėse, greičio ar ištvermės varžybose iš karto ir negrįžtamai panaikina garantiją.</p>

  <h2>Kaip pateikti garantinį reikalavimą</h2>
  <p>Susisiekite Aquafarer su savo įgaliotu pardavėju su pirkimo įrodymu ir išsamiu problemos aprašymu.Aquafarer Peržiūrėsime pretenziją ir pateiksime apžiūros bei aptarnavimo instrukcijas.</p>
  <p>Dėl garantinio aptarnavimo klausimų prašome susisiekti su mumis per mūsų<a href="/contact" class="text-sky-600 underline">Kontaktų puslapis</a>su jūsų užsakymo numeriu ir produkto duomenimis.</p>

  <h2>Trečiųjų šalių daiktai</h2>
  <p>Įranga, komponentai ar sistemos, pagamintos trečiųjų šalių (net jei jas įdiegė Aquafarer), yra išimtinai apdraustos bet kokia jų gamintojo siūloma garantija.Aquafarer aiškiai atsisako bet kokios garantijos atsakomybės už tokius trečiųjų šalių gaminius.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Šis garantijos pareiškimas yra pilnos Aquafarer gamintojo ribotos garantijos santrauka. Pilnas teisinis garantijos dokumentas reglamentuoja visas garantijos sąlygas ir nuostatas. Specifikacijos gali būti keičiamos be įspėjimo.Aquafarer yra Aquafarer Qingdao gamybos centro gamyklos prekės ženklas.
  </p>
