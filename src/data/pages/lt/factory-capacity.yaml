hero:
  tagline: Gamybos pajėgumai
  title: Gamybos pajėgumai ir metinė produkcija
  subtitle: 12 000 m² patalpos, gaminančios 15 000 valtelių per metus su galimybe didinti apimtis
intro: Aquafarer valdo vieną didžiausių skirtų pripučiamų valtelių gamyklų Qingdao mieste, Kinijoje. Mūsų 12 000 m² gamykla padalyta į šešias specializuotas dirbtuves, veikiančias lygiagrečiai, suteikiančias galimybę gaminti 15 000 valtelių per metus SUP, baidarės, valtelių RIB ir saugos įrangos linijose.
highlights:
  - value: 12,000 m²
    label: Bendra gamybos patalpos erdvė
    detail: 6 specializuotose dirbtuvėse
  - value: 15,000
    label: Kasmet gaminami laivai
    detail: SUPs, baidarės, RIBs, valteliai, saugos įranga
  - value: 200-300
    label: Įgudusi darbo jėga
    detail: 25+ inžinieriai, 2 pamainos per dieną
  - value: 50+
    label: Eksporto šalys
    detail: ES, JAV, AU, Artimieji Rytai, Azija
  - value: 30–45
    label: Standartinis pristatymo laikas (dienomis)
    detail: Nuo užsakymo patvirtinimo iki FOB
  - value: 10+
    label: Eksporto patirties metai
    detail: Nuo 2012 m
workshops:
  - title: SUP lentų gamyba
    description: '4 paralelės surinkimo linijos pripučiamoms SUP lentoms. Kiekviena linija gali pagaminti 50–80 lentų per pamainą. Skaitmeninio ir ekraninio spausdinimo stotys veikia lygiagrečiai. Metinė SUP gamybos talpa: 8 000+ lentų.'
    output: 8 000+ SUPs/metus
  - title: RIB Valtelių gamyba
    description: 'Skirta stiklo pluošto korpusų dirbtuvė su 6 formavimo stotimis RIB korpusams iki 7,6 m. Vamzdžių suvirinimo ir surinkimo zona gali tvarkyti 3–5 RIBs vienu metu. Metinė RIB gamybos talpa: 2 000+ valtelių.'
    output: 2 000+ RIBs/metus
  - title: Pripučiamos valtelių ir valtelių gamyba
    description: 'Daugelio paskirčių gamybos linijos pripučiamiems valteliams, baidarėms ir valteliams. Karšto oro suvirinimo stotys, RF dielektriniai presai ir surinkimo darbo vietos perskirstomos pagal užsakymų sudėtį. Metinė gamybos talpa: 5 000+ vienetų.'
    output: 5 000+ vienetų/metus
  - title: Saugos įranga
    description: 'Atskira švari gamybos zona gelbėjimosi liemenėms ir saugos įrangai. Skirtos siuvimo, putų įdėjimo ir bandymų stotys. Metinė gelbėjimosi liemenių gamybos talpa: 50 000+ vienetų.'
    output: 50 000+ gelbėjimosi liemenių/metus
oem_capacity:
  moq: 'SUP: 5–10 vienetų | RIB: 2–5 vienetai | Baidarės/Valtelės: 10–20 vienetų | Speciali forma: 200+ vienetų'
  lead_time: Standartinis 30–45 dienų. Pavyzdys 15–20 dienų. Skubus užsakymas galimas.
  payment: T/T 30% avansas + 70% prieš siuntimą. Priimama L/C, Western Union.
