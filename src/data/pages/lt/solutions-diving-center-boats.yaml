content_challenge:
  tagline: Iššūkis
  title: Kodėl nardymo centrams reikia<br />Specialiai statomi laivai
  subtitle: Nardymo operacijos kelia unikalius reikalavimus vandens transporto priemonėms – reikalavimus, kurių bendrosios paskirties laivai dažnai neįvykdo.
  paragraphs:
    - Komerciniai nardymo centrai veikia 200–300 dienų per metus, kasdien vykdydami 3–5 nardymo reisus. Kiekvienai kelionei reikia pervežti 10–20 nardymo bakų, pilną BCD įrangą, reguliatorius, pelekus, kaukes, saugos įrangą, instruktorių įrangą ir keleivius. Universalus laivas tiesiog negali atlaikyti tokio operacinio intensyvumo.
    - '**Ribota denio erdvė** — Dauguma pramoginių valčių yra sukurtos greičiui ir keleivių komfortui, o ne įrangos valdymui. Kai bakai, įranga ir narai dalijasi ta pačia erdve, pailgėja pasiruošimo laikas, judėjimas tampa sudėtingas, o saugumo rizikos didėja.'
    - '**Sudėtingas nardymo įlipimas** — Tarptautiniams turistams, pirmą kartą nardantiems ir vyresnio amžiaus keliautojams reikia saugaus ir lengvo įlipimo bei išlipimo. Aukšta įlaipinimo pozicija, ribota rankų atrama ir nestabilios platformos sukelia diskomfortą ir saugumo pavojus — ypač kai nardytojai neša 30 kg įrangos.'
    - '**Sūraus vandens korozija ir UV pažeidimai** — Tropinės aplinkos pagreitina medžiagų degradaciją. Standartiniai PVC vamzdžiai gali išblukti, leisti vandenį ir reikalauti keitimo per 3 metus. Metalinių komponentų korozija didina priežiūros išlaidas ir veiklos prastovas.'
    - '**Stabilumas ramybėje** — Nardytojams reikia stabilios platformos, kai jie ruošiasi, įeina į vandenį ir vėl lipa į laivą. Nepakankamas stabilumas kelia saugumo riziką ir neigiamai veikia klientų patirtį.'
    - '**Didelės eksploatacinės išlaidos** — Kuro efektyvumas svarbus, kai kasdien vyksta keli reisai. Valtis, kuri sunaudoja daugiau kuro, tiesiogiai sumažina pelno maržas. Komerciniai nardymo operatoriai labiau rūpinasi kasdienėmis eksploatavimo sąnaudomis nei didžiausiu greičiu.'
content_solution:
  tagline: Mūsų sprendimas
  title: Sukurta aplink realybę<br />Nardymo operacijos
  subtitle: Kiekvienas Paddle Board Overstock nardymas RIB yra pritaikytas specifiniams komercinių nardymo centrų poreikiams – ne pritaikytas rekreacinio laivo dizainui.
  list:
    - Didelis darbo denio išdėstymas – skirtas nardymo bakų saugojimui, įrangos paruošimui ir narų judėjimui, ne tik keleivių sėdimoms vietoms
    - Profesionali nardymo kopėčių sistema su nerūdijančio plieno turėklais — platus, žemas laiptelis – saugus ir lengvas narų įlipimas ir išėjimas
    - Ypač platūs Hypalon arba PVC vamzdiniai — suteikia stabilią įlaipinimo platformą ir pagerina plūdrumą, kai narai juda deniu
    - Integruotos talpyklų laikymo lentynos — palaiko mažą svorį, denį švarų ir įrangos organizavimą greitesniam kelionės atlikimui
    - EVA Neslystantis denio paviršius — sumažina slydimo riziką, kai denis šlapias ir narai juda su sunkia įranga
    - Konsolė padėta, kad nardytojai vandenyje būtų aiškiai matomi — tai labai svarbu instruktorių saugumo stebėsenai
    - Variklių pasirinkimas nuo 40 HP iki 115 HP — vieno arba dviejų konfigūracijų, optimizuotas kuro taupymui per kelias kasdienes keliones
    - Jūrinės klasės konstrukcija — sunkios vamzdžių medžiagos su UV atsparumu sūriam vandeniui, sustiprinta konstrukcija kasdieniam komerciniam naudojimui
    - Individualios nardymo kopėčių ir platformos konfigūracijos — pritaikytos jūsų veikiančiam vandens gyliui ir nardytojo profiliui
    - Įrangos tvirtinimo plokštės sonarui, GPS ir ryšio įrangai
content_models:
  tagline: Rekomenduojami modeliai
  title: Nardymo RIB konfigūracijos
  subtitle: Mūsų populiariausi nardymo RIB modeliai – kiekvienas su individualia nardymo konfigūracija.
  items:
    - title: RIB 500 Diver
      description: '5,0 m stiklo pluošto RIB su nardymo kopėčiomis, bakų laikikliais, neslystančia denio danga ir 60 HP išorinėmis valtimis. Idealu mažoms nardymo mokykloms ir uždarų vandens operacijų, vykdančioms 1–2 reisus per dieną. Talpa: 8 asmenys.'
    - title: RIB 520 Diver
      description: '5,2 m RIB su pagerintu stabilumu, ilgesnio nuotolio kuro baku, nardymo kopėčiomis, talpyklos saugykla ir 90 HP mm varikliu. Tinkamas pakrančių nardymo centrams, vykdantiems kelis kasdienius reisus. Talpa: 10 asmenų.'
    - title: RIB 550 Diver
      description: '5,5 m RIB su dideliu denio išdėstymu, profesionaliomis nardymo kopėčiomis, bakų laikikliais ir sunkiosios konstrukcijos vamzdžiais. Sukurta kurorto nardymo operacijoms su mišriomis keleivių grupėmis. Talpa: 10 asmenų.'
    - title: RIB 580 Diver Pro
      description: '5,8 m sunkiasvoris RIB su dviejų variklių pasirinkimu, integruota nardymo platforma, pilna navigacijos įranga ir maksimaliu denio plotu. Profesionalioms nardymui atviruose vandenyse, vykdant 3–5 reisus per dieną. Talpa: 12 asmenų.'
content_dive_resorts:
  tagline: Nardymo kurortams
  title: Premium Dive RIBs<br />Kurorto svetingumo veiklai
  subtitle: Prabangus nardymas RIBs skirtas svečių komfortui, prekės ženklo įvaizdžiui ir sezono piko pajėgumui – kur laivo patirtis yra tokia pat svarbi kaip ir pats nardymas.
  paragraphs:
    - Nardymo kurortai iš esmės skiriasi nuo komercinių nardymo centrų. Jūsų svečiai yra turistai, mokantys už pilną aukščiausios klasės patirtį – ir laivas yra svarbi šios patirties dalis. Funkcionuojantis darbo laivas, kuris atrodo pramoninis ar nepatogus, sukuria pastebimą atotrūkį tarp kurorto kokybės ir vandens patirties.
    - '**Patirties skirtumo problema** — Svečias, apsistojęs penkių žvaigždučių apartamentuose su aukštos klasės maitinimu ir profesionaliu aptarnavimu, neturėtų lipti į senstantį aliuminio laivą su kietais suoliukais ir be pavėsio. Šis kontrastas gadina prabangos įvaizdį, kurį jūsų kurortas kruopščiai kūrė. Valtis nėra tik transportas – tai mobilus jūsų prekės ženklo pratęsimas.'
    - '**Prekės ženklo įvaizdis kaip konkurencinis pranašumas** — Kiekviena nardymo kelionė yra prekės ženklo sąlyčio taškas. Premium prekės ženklas RIB su individualiomis kurorto spalvomis, integruotais logotipais ir suderinta apdaila tampa plaukiojančiu prekės ženklo ambasadoriumi. Svečiai jį fotografuoja, dalijasi socialiniuose tinkluose ir prisimena. Konkurencingose vietose, tokiose kaip Maldyvai, Balis ar Karibai, laivų kokybė gali būti lemiamas veiksnys pakartotiniams užsakymams.'
    - '**Komfortas skatina pasitenkinimą ir atsiliepimus** — Ilgos kelionės į nardymo vietas tropiniame karštyje turėtų būti malonios, o ne varginančios. Aukštos klasės sėdimos vietos su ergonomiškais atlošais, T-top arba Bimini apsauga nuo saulės, sklandus įlipimas per plačias nardymo kopėčias ir stabili platforma ramybėje tiesiogiai veikia svečių pasitenkinimo įvertinimus, internetinius atsiliepimus ir grįžimo kainas. VIP svečiai, vyresnio amžiaus keliautojai ir šeimos ypač jautrūs komfortui.'
    - '**Piko sezono pajėgumas ir pajamos** — Sezono metu (Kalėdos, pavasario atostogos, vasara) nardymo operacijos gali vykdyti 4–6 reisus per dieną su nuolatinėmis svečių grupėmis. Jums reikia laivo, kuris atlaikytų intensyvumą neaukojant patirties. Greitas atlikimas, patikimas veikimas ir minimalus prastovų laikas tiesiogiai veikia pajamas ir reputaciją. Vienas laivo gedimas piko savaitę gali kainuoti dešimtis tūkstančių prarastų užsakymų.'
    - '**Individualizavimas kaip išskirtinumas** — Paddle Board Overstock Premium Dive RIBs yra visiškai pritaikomas: kurorto spalvų schemos ir korpuso grafika, individualūs logotipai, aukščiausios kokybės apmušalai kurorto spalvomis, T-top arba Bimini saulės skydelio pasirinkimai, aukščiausios kokybės jūrinės garso sistemos, neslystanti tikmedžio stiliaus EVA terasa, integruota nardymo bako saugykla ir plačios nardymo kopėčios su turėklais. Jūsų valtis tampa neatsiejama kurorto patirties dalimi.'
    - '**Verslo atvejis** — Premija RIB kainuoja daugiau iš karto, bet duoda grąžą dėl didesnio svečių pasitenkinimo, stipresnio prekės ženklo įvaizdžio, padidėjusių pakartotinių užsakymų, galimybės taikyti didesnes kainas, sumažinto priežiūros prastovų laiko ir ilgesnio tarnavimo laiko tropinėse sūraus vandens sąlygose. Tai investicija į svečių patirtį, o ne veiklos išlaidos.'
content_diving_profiles:
  tagline: Nardymo centrų profiliai
  title: Nardymo centrų tipai<br />Mes statome
  subtitle: Skirtingos nardymo operacijos reikalauja skirtingų valčių konfigūracijų. Mes pritaikome kiekvieną pagal RIB jūsų nardymo verslo specifinius poreikius.
  items:
    - title: Nardymo mokyklos ir mokymo centrai
      subtitle: Rekreacinis nardymas, sertifikavimo kursai, kasdienės turistinės kelionės
      description: Šie centrai veikia ištisus metus tropinėse vietose, kasdien vykdydami keliones tarptautiniams turistams ir sertifikavimo studentams. Laivas yra kasdienės veiklos centras – jis turi vežti sunkią įrangą, dažnai įlaipinti keleivius ir ilgai praleisti laiką sūriame vandenyje. Kiekviena prastovos valanda reiškia atšauktus nardymus ir prarastas pajamas.
      features:
        - Didelė darbo denis 10–20 nardymo bakų, BCD ir keleivių įrangos
        - Platus nardymo kopėčios su nerūdijančio plieno turėklais, kad būtų lengva įlipti
        - Ypač platūs Hypalon vamzdžiai stabiliai platformai nardytojo įėjimo/išėjimo metu
        - Neslystanti EVA denio danga saugumui, kai terasa šlapia
        - Ekonomiškos keturtakčių variklių konfigūracijos, skirtos+ 200 dienų per metus eksploatacijai
        - Sunkiosios PVC arba Hypalon konstrukcijos, skirtos tropinio sūraus vandens patvarumui
        - Talpyklų laikymo lentynos integruotos į denio išdėstymą, o ne vėliau įrengtos
    - title: Komerciniai ir pramoniniai nardymo operatoriai
      subtitle: Uosto priežiūra, povandeninė apžiūra, jūrų inžinerija
      description: Šie profesionalūs operatoriai dirba su jūrų infrastruktūros projektais – uostų inspektavimu, povandeniniu remontu, kabelių klojimu ir pakrančių inžinerija. Jų valtis yra mobili darbo platforma, o ne tik transportas. Įgulai reikia vietos įrankiams, apžiūros įrangai ir nardymo sistemoms. Patikimumas yra labai svarbus, nes projekto grafikai yra fiksuoti, o vėlavimai brangūs.
      features:
        - Pagerintas stabilumas saugioms darbo sąlygoms atvirame vandenyje
        - Sustiprintas korpusas sunkios įrangos kroviniams ir dažnoms operacijoms
        - Didelė atvira terasa, pritaikyta įrankių laikymui ir įrangos paruošimui
        - Profesionalios sėdimos vietos įgulos patogumui ilgų jūrinių operacijų metu
        - Variklio atsarginės parinktys eksploataciniam saugumui
        - Pilnas navigacijos komplektas, įskaitant GPS, sonarą ir ryšio įrangą
        - Individualios nardymo platformos ir kopėčių konfigūracijos pramoniniam naudojimui
    - title: Gyvenamoji parama ir ekspediciniai aptarnavimo laivai
      subtitle: Kelių dienų nardymo safariai, nuotolinės atolų ekspedicijos, tyrimų palaikymas
      description: Gyvenamųjų laivų operatoriams ir ekspedicijų komandoms reikia kompaktiškų, patikimų RIBs laivų, kuriuos galima nuleisti į vandenį ir kasdien ištraukti. Šie laivai tarnauja kaip motininių laivų pagalbiniai laivai, gabena narus į rifus, gabena įrangą ir teikia skubią pagalbą atokiose vietovėse. Jie turi būti pakankamai tvirti atvirų vandenų kirtimams, bet kompaktiški sandėliavimui.
      features:
        - Kompaktiškas dizainas (4,5–5,5 m) kranų paleidimui ir denio saugojimui
        - Sustiprintas korpusas dažniems išsilaipinimams paplūdimiuose ir navigacijai rifuose
        - Sunkiosios kėlimo vietos kasdienėms krano ar kranų operacijoms
        - Narų kopėčios su žemu profiliu lengvam įplaukimui ir išėjimui į vandenį
        - Patvarios vamzdžių medžiagos, atsparios ilgalaikei saulei ir druskai
        - Kuro nuotolis 50+ jūrmylių tarp degalų papildymų
        - Greito pripūtimo/išpūtimo vamzdelių variantai vietos taupymui
    - title: Nardymo kurortas ir svetingumo veikla
      subtitle: Nardymas kurorte, VIP svečių aptarnavimas, salos pervežimai
      description: Šie operatoriai orientuojasi į turistus, kurie tikisi aukščiausios klasės patirties. Laivas turi derinti veiklos efektyvumą su svečių komfortu ir prekės ženklo pristatymu. Skirtingai nei grynai komerciniai operatoriai, kurortų nardymo centrams reikia laivų, kurie atrodo gerai, patogiai plaukia ir atspindi turto kokybę – tuo pačiu patikimai atliekant kasdienius nardymo darbus.
      features:
        - Aukščiausios klasės sėdimos vietos su ergonomiškais atlošais svečių patogumui
        - T-top arba Bimini apsauga nuo saulės nuo tropinės saulės
        - Individualios spalvų schemos ir logotipo integracija atitinka kurorto prekės ženklą
        - Platus nardymo kopėčios su turėklais, kad būtų patogu įlaipinti svečius
        - Teak stiliaus EVA terasa užtikrina aukštą išvaizdą ir neslystantį saugumą
        - Tylus variklio konfigūravimas, užtikrinantis minimalų triukšmo trikdymą.
        - Integruota šaldytuvo saugykla svečių gėrimams ir rankšluosčiams
content_segments:
  tagline: Nardymo kurorto profiliai
  title: Kurortų tipai, kuriuos aptarnaujame<br />Su individualiais RIB sprendimais
  subtitle: Kiekvienas nardymo kurortas yra skirtingas. Mes kuriame RIB konfigūracijas pagal jūsų kurorto tipą, svečių profilį ir veiklos aplinką.
  items:
    - title: Prabangūs salos nardymo kurortai
      subtitle: Maldyvai, Fidžis, Bora Bora, Karibai
      description: Šie kurortai aptarnauja turtingus keliautojus, kurie tikisi, kad kiekviena detalė atspindės prabangą. Laivas turi derėti prie viešbučio – individualios kurorto spalvos, integruotas prekės ženklas, aukštos klasės sėdimos vietos ir pilna apsauga nuo saulės yra neabejotini. Svečiai dažnai fotografuoja valtį socialiniams tinklams, todėl ji tampa matomu prekės ženklo turtu.
      features:
        - Pilnai pritaikyta korpuso spalva ir grafika, atitinkanti Resort VI
        - Aukštos kokybės apmušalai su derančia kurorto spalvų palete
        - T-top arba hardtop saulės skydelis su integruota garsiakalbių sistema
        - Platus nardymo kopėčios su turėklais, kad būtų lengva įlipti su kurorto apranga.
        - Šaldytas šaldytuvas aukštos kokybės gėrimams ir rankšluosčiams
        - Teak tipo EVA terasa prabangiam vaizdui ir neslystančiam saugumui
        - Tylus variklio konfigūravimas, užtikrinantis minimalų triukšmo trikdymą.
    - title: Butikiniai ekologiški nardymo kurortai
      subtitle: Pajūrio nuosavybės, ekologiški sodai, tvarumo orientacija
      description: Mažesnės nuosavybės atokiose pakrantės vietovėse, kurios pabrėžia aplinkos atsakomybę ir autentiškas patirtis. Šie kurortai turi turėti patikimas, mažai priežiūros reikalaujančias valtis, galinčias veikti nepriklausomai su ribota technine pagalba. Kuro efektyvumas ir patvarumas yra svarbesni nei maksimalus greitis. Valtis turėtų atspindėti natūralią aplinką.
      features:
        - Kuro taupūs 4 taktų išoriniai varikliai
        - Atsparūs Hypalon vamzdžiai ilgai tarnybai atokiose vietovėse
        - Saulės energijai pritaikyta elektros sistema nepriklausomam įkrovimui
        - Kompaktiška denio išdėstymo schema 8–10 svečių, turint minimalų poveikį aplinkai
        - Lengva priežiūra — lengvai pasiekiami komponentai vietinei priežiūrai
        - Neutralios spalvų parinktys, kurios derėtų prie natūralios aplinkos
        - Lengva konstrukcija kranto ir seklumos operacijoms
    - title: Premiami gyvojo laivo operatoriai
      subtitle: Daugadienės nardymo safarijos, ekspedicinis nardymas, atokūs atolai
      description: 'Gyvojo laivo operatoriams reikalingos pagalbinės valtys, kurios atlieka daugelį funkcijų: nardytojų transportavimą prie rifų, įrangos pervežimą, avarinę pagalbą ir svečių ekskursijas. RIB turi būti pakankamai kompaktiška, kad tilptų denio saugojimui arba būtų galima traukti, tuo pačiu pakankamai galinga atviruose vandenyse esant įvairioms sąlygoms. Kasdienis paleidimas ir pakėlimas reikalauja tvirtos konstrukcijos.'
      features:
        - Kompaktiškas dizainas (4,5–5,5 m) denio saugojimui arba traukimui už gyvojo laivo
        - Sustiprintas korpusas dažniems išsilaipinimams paplūdimiuose ir navigacijai rifuose
        - Greitai pripučiami/nuleidžiami vamzdžiai efektyviam saugojimui
        - Nardytojų kopėčios su žemu profiliu lengvam įlipimui iš vandens
        - Atsparūs kėlimo taškai davitams ar kranų paleidimo sistemoms
        - Kuro nuotolis 50+ jūrmylių tarp degalų papildymų
        - Patvarios vamzdžių medžiagos, atsparios saulei, druskai ir kurui
    - title: VIP privačių užsakymų operacijos
      subtitle: Ultra prabangūs privatūs salos, žvaigždžių svečiai, įmonių užsakymai
      description: Aukščiausias kurorto svetingumo lygis, kur kiekviena detalė yra personalizuota, o lūkesčiai – dideli. Valtis turi būti nepriekaištinga, beveik tyli ir su sklandžiu aptarnavimu. Privatumas, komfortas ir estetinis tobulumas yra svarbiausi. Šie klientai nėra jautrūs kainai, bet ypatingai jautrūs kokybei.
      features:
        - Ultra-premium sėdynės su individualiu siuvimu ir šildomomis parinktimis
        - Garso slopinimo variklio skyrius beveik tyliam plaukiojimui
        - Pilno uždengimo galimybė privatumo ir oro apsaugai
        - Integruota pramogų sistema su jūrinio lygio garsiakalbiais
        - Individuali šlapio baro arba atsigaivinimo stoties įranga
        - Vonios/keitimosi privatumo uždengimas
        - Skirta įgulos stotis su ryšio ir navigacijos įranga
        - Derinanti pagalbinė valtis – suderintas pagrindinis laivas ir pagalbinė RIB
content_benefits:
  tagline: Pagrindinės naudos
  title: Paddle Board Overstock Kodėl<br />Nardymo operacijos
  subtitle: Specialiai nardymui sukurta RIBs, kuria pasitiki komercinės nardymo centrai 30+ šalių — sukurta kasdienei eksploatacijai, o ne retam naudojimui.
  list:
    - Sukurta 200–300 veikimo dienų per metus — ne savaitgaliams skirtas laivas, o kasdieninė darbo platforma
    - Hypalon arba kariniai PVC vamzdžiai – didžiausias patvarumas tropinėse sūraus vandens sąlygose su UV atsparumu
    - Platus vamzdžio dizainas suteikia stabilų įlipimo į platformą pagrindą nardymo su įranga entuziastams — saugesnis įlipimas ir išlipimas visiems patirties lygiams
    - Denio išdėstymas optimizuotas įrangos darbui — bakams, įrankiams ir keleiviams kiekvienam skirta atskira vieta
    - Individualiai pritaikyti nardymo kopėčių ir platformų išdėstymai — nėra standartinio sprendimo, kiekviena valtis pritaikyta jūsų veiklai
    - Variklio atsargumo galimybės (vienas/dvigubas) — operacinis saugumas, kai narai yra vandenyje
    - Mažesnės kasdienės eksploatacijos sąnaudos — optimizuotas degalų efektyvumas ir sumažintos priežiūros reikmės
    - 'Greitas pristatymas: nuo užsakymo iki siuntimo 30–60 dienų standartinėms konfigūracijoms'
