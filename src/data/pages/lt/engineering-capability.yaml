  subtitle: Dalinkitės savo produkto reikalavimais, tikslinė rinka ir laiko grafiku — mūsų inžinerijos komanda atsakys su kūrimo pasiūlymu ir sąnaudų įvertinimu per 48 valandas.
  actions:
    - variant: primary
      text: Pradėkite savo projektą
