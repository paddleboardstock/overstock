content_capability:
  tagline: Inžinerijos pajėgumas
  title: Kas mūsų inžinerija<br />Komanda pristato
  subtitle: Aquafarer inžinerija apima visą produkto gyvavimo ciklą — nuo rinkos tyrimų ir koncepcijos kūrimo iki prototipų gamybos, testavimo ir masinės gamybos.
  items:
    - title: Pramoninis dizainas
      description: Mūsų pramoninio dizaino komanda dirba remdamasi klientų reikalavimais, rinkos tyrimais ir konkurencine analize, siekdama sukurti produktų koncepcijas, kurios subalansuoja estetiką, funkcionalumą ir gaminamumą. Mes kuriame 2D eskizus, 3D vizualizacijas ir specifikacijų dokumentus klientų peržiūrai prieš pradedant gamybinių įrankių gamybą.
      features:
        - Koncepcijos vystymas ir pagrįstumo studijos
        - 2D dizaino brėžiniai ir 3D vizualizacijos
        - Medžiagų pasirinkimas ir specifikacija
        - Gamybai skirtas projektavimas (DFM) analizė
        - Ergonomikos ir saugos įvertinimas
    - title: Statybinė Inžinerija
      description: Mūsų konstrukcijų inžinieriai specializuojasi pripučiamų valtelių architektūroje – korpuso projektavime, vamzdžio kamerų išdėstyme, drop-stitch pagrindiniame inžinerijoje ir apkrovos pasiskirstyme. Kiekvienas projektas yra analizuojamas dėl konstrukcinio patvarumo, svorio optimizavimo ir atitikties atitinkamiems standartams (CE, ISO, AS).
      features:
        - Giliai V formos stiklo pluošto korpuso dizainas su apskaičiuotais nuolydžio kampais
        - Daugiaskylių vamzdžio konfigūracija saugumui ir plūdrumui
        - Drop-stitch branduolio specifikacija ir tankio optimizavimas
        - Baigtinių elementų analizė apkrovą nešančioms detalėms
        - Svorio pasiskirstymo ir stabilumo skaičiavimai
    - title: 3D modeliavimas ir CAD
      description: Visi produktų dizainai kuriami 3D CAD prieš pradedant prototipo gamybą. Mūsų inžinieriai naudoja SolidWorks ir Rhino 3D produktų modeliavimo darbams, leidžiant klientams peržiūrėti kiekvieną detalę — nuo vamzdžio profilio iki valdymo pulto išdėstymo — prieš įsipareigojant gamybai.
      features:
        - Pilnas 3D CAD modeliavimas naudojant SolidWorks ir Rhino 3D
        - Fotorealistinis atvaizdavimas klientų pristatymams
        - Techninio braižymo paketai gamybai
        - Kalimų formų ir įrankių projektavimas pagal 3D modelius
        - Tiesioginis CAD į CNC duomenų perdavimas tiksliniam pjovimui
    - title: Prototipų kūrimas ir testavimas
      description: Prieš masinę gamybą kiekvienas naujas produktas pereina per prototipo etapą. Mes kuriame funkcinius prototipus kliento vertinimui, o tada juos išbandome pagal mūsų visą testavimo protokolą — slėgio testavimą, stabilumo testavimą, apkrovos testavimą ir vandens bandymus. Dizaino iteracijos prototipo etape yra greitos ir ekonomiškos.
      features:
        - Greito prototipo įrankiai (15–20 dienų apyvarta)
        - Funkcinis prototipas realiam pasauliui vertinimui
        - Pilnas testavimo protokolas prieš gamybos patvirtinimą
        - Iteratyvus dizaino tobulinimas remiantis testų rezultatais
        - Kliento patvirtinimo etapas prieš gamybos įrankių gamybą
    - title: Individualių priedų integracija
      description: Daugelyje OEM projektų reikalinga klientų pateiktų arba trečiųjų šalių priedų integracija – pritaikytų konsolių, specializuotų sėdynių, elektroninių sistemų, nardymo įrangos laikiklių ar ženklo elementų. Mūsų inžinerijos komanda rūpinasi visų priedų integracijos dizainu, struktūriniu pritaikymu ir kokybės patikrinimu.
      features:
        - Konsolės dizainas ir prietaisų skydelio išdėstymas
        - Individualių sėdynių ir apmušalų integracija
        - Elektroninės sistemos projektavimas ir laidų klojimas
        - Nardymo ir gelbėjimo įrangos montavimo sistemos
        - Prekinio ženklo ir grafinės taikymo specifikacijos
content_process:
  tagline: Plėtros procesas
  title: Nuo sąvokos<br />į gamybą
  subtitle: Mūsų produktų kūrimo procesas vyksta pagal struktūrizuotą 6 etapų darbo eigą, sukurtą siekiant sumažinti riziką, sutrumpinti terminus ir užtikrinti gamybos pasirengimą nuo pirmos dienos.
  stages:
    - stage: '01'
      title: Reikalavimai ir tyrimai
      duration: 1–2 savaitės
      description: Mes dirbame su klientu, kad apibrėžtume produkto specifikacijas, tikslinės rinkos reikalavimus, reguliavimo atitikties poreikius ir komercinius tikslus. Šiame etape sukuriamas Produkto reikalavimų dokumentas (PRD), kuris vadovauja visam tolesniam darbui.
      deliverables: PRD, rinkos analizė, konkurencinis etalonas, preliminari sąnaudų sąmata
    - stage: '02'
      title: Koncepto dizainas
      duration: 2–3 savaitės
      description: Pramoninio dizaino komanda kuria produkto koncepcijas remdamasi PRD. Pateikiamos kelios dizaino galimybės su 3D vizualizacijomis, medžiagų rekomendacijomis ir pradinėmis inžinerinėmis vertinimo ataskaitomis. Užsakovas pasirenka kryptį tolesniam detalizuosiam vystymui.
      deliverables: 3D koncepcijos vizualizacijos, medžiagų specifikacijos, dizaino pagrindimas, preliminarus medžiagų sąrašas
    - stage: '03'
      title: Išsamioji inžinerija
      duration: 2–4 savaitės
      description: Pasirinkta koncepcija pilnai suprojektuota — 3D CAD modeliavimas, struktūrinė analizė, vamzdžių konfigūracija, korpuso projektavimas, priedų integracija ir gamybos dokumentacija. Visi matmenys, medžiagos ir procesai nurodyti įrankiams.
      deliverables: Pilnas 3D CAD modelis, inžineriniai brėžiniai, galutinė medžiagų sąmata, įrankių specifikacijos, kokybės kontrolės planas
    - stage: '04'
      title: Prototipavimas
      duration: 2–3 savaitės
      description: Pagaminti prototipo įrankiai ir sukuriami funkciniai pavyzdžiai. Klientas peržiūri prototipą pagal PRD specifikacijas. Testavimas atliekamas pagal sutartą protokolą. Dizaino korekcijos atliekamos remiantis atsiliepimais prieš gamybinius įrankius.
      deliverables: Funkcinis prototipas, bandomasis ataskaita, dizaino pakeitimų žurnalas, kliento patvirtinimo dokumentas
    - stage: '05'
      title: Gamybos įrankiai
      duration: 2–3 savaitės
      description: Kai prototipas patvirtinamas, pradinis gamybos įrankių gamybos etapas — formos, suvirinimo įrankiai, pjovimo programos, surinkimo laikikliai — pradedamas. QC dokumentacija ir patikros kriterijai galutinai nustatomi. Atliekamas bandomasis paleidimas proceso patikrinimui.
      deliverables: Gamybos įrankiai, proceso dokumentacija, kokybės kontrolės tikrinimo planas, bandomojo paleidimo ataskaita
    - stage: '06'
      title: Masinė gamyba ir kokybės kontrolė
      duration: Tęsinys
      description: Pilna gamyba prasideda nuo proceso metu atliekamos kokybės kontrolės kiekviename etape. Pirmieji gaminiai yra tikrinami ir patvirtinami prieš partijai leidžiant. Nuolatinis kokybės stebėjimas, defektų sekimas ir nuolatinis tobulinimas viso gamybos ciklo metu.
      deliverables: Gamybos tvarkaraštis, kokybės kontrolės ataskaitos, partijų sekamumo įrašai, siuntimo dokumentacija
content_customization:
  tagline: Tinkinimo parinktys
  title: Kas gali būti<br />Individualizuotas
  subtitle: Beveik kiekvieną mūsų produktų aspektą galima pritaikyti pagal kliento reikalavimus. Žemiau pateikiamos dažniausiai pasitaikančios pritaikymo kategorijos.
  columns: 3
  items:
    - title: Korpusas ir struktūra
      description: Individualus korpuso ilgis, denio plotis, borto kampas, vamzdžio skersmuo, kamerų išdėstymas ir medžiagos kokybė.
      icon: tabler:sailboat
    - title: Spalvos ir grafika
      description: Vamzdžio spalva (PVC/Hypalon), korpuso gelio spalva, konsolės spalva, denio grafika, logotipo išdėstymas ir pakuotės dizainas.
      icon: tabler:palette
    - title: Konsolė ir valdikliai
      description: Centrinė konsolė, šoninė konsolė arba vairas. Pasirinktinis prietaisų skydelio išdėstymas, jungiklių vieta ir vairo padėtis.
      icon: tabler:steering-wheel
    - title: Sėdimosios vietos ir apmušalai
      description: Lenktynininko sėdynės, suoliuko sėdimos vietos, prabangus apmušalas, siuvimas derinamas prie spalvos, sulankstomos arba nuimamos konfigūracijos.
      icon: tabler:armchair
    - title: Priedai ir įranga
      description: Nardymo kopėčios, bakų laikikliai, vilkimo stulpeliai, T formos stogeliai, Bimini stogeliai, garso sistemos, navigacijos elektronika ir saugos įranga.
      icon: tabler:backpack
    - title: Pakuotė ir prekės ženklas
      description: Individualizuota mažmeninė pakuotė, privačios etiketės dėžutės, siuntimo kartonai su prekės ženklo ženklais, pakabinamos etiketės ir vartotojo vadovai kliento kalba.
      icon: tabler:box
content_industries:
  tagline: Pramonės programos
  title: Inžineriniai sprendimai<br />pagal pramonę
  subtitle: Mūsų inžinerijos komanda sukūrė produktus įvairioms jūrų panaudojimo sritims — kiekvienam su skirtingais reikalavimais ir veikimo kriterijais.
  columns: 3
  items:
    - title: Nardymo operacijos
      description: Sustiprinti deniai, nardymo kopėčių integracija, bakų laikymo sistemos ir stabilios platformos komerciniams nardymo centrams visame pasaulyje.
      icon: tabler:lifebuoy
    - title: Gelbėjimas ir skubioji pagalba
      description: Didelio greičio korpuso konstrukcijos, savaime nusausinantys deniai, įrangos montavimo sistemos ir daugiakanalės saugos konfigūracijos paieškos ir gelbėjimo operacijoms.
      icon: tabler:alert-triangle
    - title: Jūrų turizmas
      description: Keleivių komforto išdėstymai, saulės skydelio integracija, įlaipinimo sistemos ir degalus taupančios konfigūracijos salų pervežimo operacijoms.
      icon: tabler:beach
    - title: Jachtų priekabos
      description: Kompaktiški dizainai davit saugojimui, prabangūs apdailos variantai, derančios motininio laivo spalvos ir aukštos kokybės tempimo charakteristikos.
      icon: tabler:sailboat
    - title: Žvejyba ir akvakultūra
      description: Plokščios denio konfigūracijos, integruota gyvų žuvų talpa, meškerių laikiklių išdėstymas, korozijai atspari įranga nuolatiniam kontaktui su sūraus vandens.
      icon: tabler:fish
    - title: Uostas ir pramonė
      description: Tvirtos korpuso stiprinimo konstrukcijos, darbo laivų išdėstymas, personalo transportavimo konfigūracija ir įrangos integracija jūriniams darbams.
      icon: tabler:ship
