hero:
  tagline: Tarptautinė pristatymo apimtis
  title: Aptarnaujame 50 šalių<br />Visame pasaulio žemyne
  subtitle: Nuo Europos pakrančių patrulių operatorių iki Australijos vandens sporto platintojų ir Vidurio Rytų gelbėjimo komandų — Paddle Board Overstock valtys yra vandenyje visame pasaulyje.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock pasaulinė jūrų gamyba ir platinimas
stats:
  title: Pasaulinis pasiekiamumas
  stats:
    - title: Šalys
      amount: 50+
    - title: Eksporto rinkos
      amount: Europa, Amerika, Azija, Viduriniai Rytai, Okeanija
    - title: Gamyba
      amount: Qingdao, Kinija
    - title: JAV sandėlis
      amount: Montclair, Kalifornija
features3_markets:
  tagline: Pagrindinės rinkos
  title: Regioninė patirtis<br />vietiniams poreikiams
  subtitle: Suprantame, kad skirtingose rinkose yra skirtingi reguliavimo reikalavimai, pageidavimai ir naudojimo atvejai.
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa ir JK
      description: CE-sertifikuoti produktai atitinkantys EN ISO 6185 standartus. Stipri paklausa RIBs, pripučiamoms valtimis ir SUP lentoms Europos Sąjungos rinkose. JK platintojai vertina mūsų greitą pristatymą.
      icon: tabler:map-pin
    - title: Šiaurės Amerika
      description: US Coast Guard patvirtinta gamyba. JAV sandėlis Montclair, Kalifornijoje greitam Vakarų pakrantės pristatymui. Auganti paklausa žvejybos valtims, gelbėjimo laivams ir laisvalaikio SUPs.
      icon: tabler:map-pin
    - title: Australija ir Okeanija
      description: Stipri rinka RIB valtims ir pripučiamiems pagalbinėms valtelėms. Australijos platintojai vertina mūsų Hypalon valtis už atsparumą UV esant intensyviai saulės šviesai. Greitas pristatymas iš mūsų Azijos gamyklos.
      icon: tabler:map-pin
    - title: Viduriniai Rytai
      description: Auganti patrulių ir gelbėjimo valčių paklausa. Mūsų aliuminio korpuso RIBs yra populiarios tarp pasienio ir saugos operatorių. Individualios konfigūracijos aukštos temperatūros aplinkoms.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribucijos tinklas
  title: Bendradarbiaujame su platintojais<br />Visame pasaulyje
  subtitle: Dirbame su patikimais jūrų įrangos platintojais, OEM prekės ženklais ir vyriausybės pirkimų agentūromis.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerystės
      description: Privatus prekės ženklo gamyba pasauliniams vandens sporto prekės ženklams. Mes tvarkome visa nuo dizaino iki gamybos ir tiesioginio pristatymo.
      icon: tabler:building
    - title: Platintojų tinklas
      description: Įgalioti platintojai 20+ šalių turi atsargų ir teikia vietinę pagalbą. Naujų platintojų užklausos laukiamos.
      icon: tabler:users
    - title: Vyriausybinė ir institucinė
      description: Tiesioginis tiekimas pakrančių apsaugos tarnyboms, paieškos ir gelbėjimo organizacijoms bei karinėms pirkimų programoms. Atitiktis institucinių pirkimų reikalavimams.
      icon: tabler:building-community
steps2_logistics:
  title: Pasaulinė logistika ir palaikymas
  subtitle: Nuo gamyklos iki paskirties vietos — mes valdome visą tiekimo grandinę.
  items:
    - title: Siuntimo parinktys
      description: Jūrų krovinių gabenimas (FOB Qingdao), oro krovinių gabenimas skubioms užsakymams ir ekspresinis kurjeris pavyzdžiams ir atsarginėms dalims.
      icon: tabler:truck-delivery
    - title: JAV sandėlis
      description: 'Atsargos laikomos Montclaire, Kalifornijoje, greitam pristatymui visoje Šiaurės Amerikoje. Vakarų pakrantė: 2–3 dienos, Centrinė dalis: 3–4 dienos, Rytų pakrantė: 4–5 dienos.'
      icon: tabler:building-warehouse
    - title: Atsarginės dalys
      description: Originalios Paddle Board Overstock atsarginės dalys ir vartojimo medžiagos laikomos sandėlyje visus metus. Įprastos dalys išsiunčiamos per 24 valandas.
      icon: tabler:package
    - title: Techninė pagalba
      description: Tiesioginė linija į mūsų inžinerijos komandą techniniams klausimams, taisymo patarimams ir pertvarkymo palaikymui. Mes remiame laivus, kuriuos pagaminome prieš 20 metų.
      icon: tabler:headset
cta:
  title: Norite tapti platintoju?
  subtitle: Mes aktyviai plečiame savo distribucijos tinklą. Susisiekite su mūsų eksporto komanda, kad aptartume partnerystės galimybes.
  actions:
    - variant: primary
      text: Bendradarbiavimo užklausa
      href: /contact
    - text: Peržiūrėkite mūsų produktų asortimentą
      href: /products
