hero:
  tagline: Sertifikatai ir standartai
  title: Kokybės sertifikatai<br />& Atitikties standartai
  subtitle: Aquafarer produktai gaminami laikantis tarptautinių jūrų saugos standartų, kokybės vadybos sistemų ir aplinkosaugos reikalavimų.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarer kokybės sertifikatai ir atitikties dokumentacija
content_certifications:
  tagline: Mūsų sertifikatai
  title: Sertifikuota kokybė,<br />Pasaulyje pripažinta
  subtitle: 64 CE sertifikuoti modeliai ir visos gamyklos sertifikatai rodo mūsų įsipareigojimą kokybei, saugumui ir aplinkos atsakomybei.
  items:
    - title: CE Sertifikuota
      description: 64 CE-sertifikuoti modeliai atitinka Europos CE ženklinimo reikalavimus laisvalaikio vandens transporto priemonėms, užtikrinant saugos, sveikatos ir aplinkos apsaugos standartų laikymąsi.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Mūsų kokybės vadybos sistema yra ISO 9001:2015 sertifikuota, apimanti pripučiamų vandens transporto priemonių ir jūrinės įrangos projektavimą, gamybą ir platinimą.
      icon: tabler:clipboard-check
    - title: UKCA Pažymėta
      description: Jungtinės Karalystės rinkoje parduodami produktai turi UKCA ženklinimą, patvirtinantį atitiktį JK reguliavimams dėl jūrinės įrangos ir asmeninių vandens transporto priemonių.
      icon: tabler:shield
    - title: BSCI Atitinkantis
      description: Aquafarer yra BSCI (Verslo socialinio atitikties iniciatyva) audituojamas, patvirtinantis etišką gamybos praktiką, sąžiningas darbo sąlygas ir atsakingą tiekimo grandinės valdymą.
      icon: tabler:heart-handshake
    - title: REACH Atitinka
      description: Visos medžiagos, naudojamos Aquafarer produktuose, atitinka ES REACH cheminio saugumo reglamentus, užtikrindamos, kad mūsų PVC, Hypalon ar komponentuose nebūtų jokių ribojamų medžiagų.
      icon: tabler:flask
    - title: Medžiagų bandymas
      description: Audiniai testuojami dėl tempimo stiprio, plyšimo atsparumo, UV gedimo ir atsparumo šalčiui įtrūkiams. Kiekviena gamybos partija imama mėginiams ir tikrinama.
      icon: tabler:test-pipe
content_factory:
  tagline: Gamyklos standartai
  title: Gamybos tobulumas<br />— Pagaminta pagal specifikaciją
  subtitle: Mūsų 12 000 m² ploto įrengimas veikia pagal griežtus kokybės kontrolės protokolus kiekviename gamybos etape.
  list:
    - 'Gautų medžiagų tikrinimas: visos žaliavos — PVC audinys, Hypalon, aliuminis, fanera, klijai — tikrinamos pagal specifikacijas prieš patenkant į gamybą.'
    - 'Proceso metu atliekama kokybės kontrolė: kiekviename gamybos etape yra dokumentuoti kokybės kontrolės kontroliniai taškai. Suvirinimo stiprumas, siūlių suderinimas, vožtuvų įrengimas ir sujungimų sukimo momentas tikrinami tiesiogiai gamybos procese.'
    - 'Slėgio testavimas: Kiekviena pripučiama kamera testuojama slėgiu, lygiu 1,25 kartus didesniu už nominalų slėgį, 24–48 valandas. Nuotėkio lygis turi būti leistinose ribose pagal ISO 6185.'
    - 'Galutinė patikra: Baigti gaminiai tikrinami dėl matmenų tikslumo, išorinio apdailos kokybės, priedų pilnumo ir pakavimo vientisumo prieš siunčiant.'
    - 'Serijų sekamumas: Kiekvienas produktas turi serijinį numerį, susietą su gamybos partijos įrašais, leidžiantį visiškai sekti nuo žaliavos iki gatavo produkto.'
content_safety:
  tagline: Jūrų saugos standartai
  title: Saugumas pirmiausia<br />— Sukurta patikimam veikimui
  subtitle: Aquafarer gaminiai sukurti ir išbandyti taip, kad atitiktų tarptautinius jūrų saugos standartus tiek komerciniam, tiek pramoginiam naudojimui.
  items:
    - title: ISO 6185
      description: Pripučiamieji valtis atitinka ISO 6185 standartus dėl konstrukcijos, stabilumo, plūdrumo ir krovininės talpos.
      icon: tabler:sailboat
    - title: ABYC standartai
      description: Elektros ir kuro tiekimo sistemos atitinka ABYC (Amerikos laivų ir jachtų tarybos) standartus saugiam montavimui ir naudojimui.
      icon: tabler:bolt
    - title: SOLAS Atitiktis
      description: Saugos įranga ir gelbėjimo priemonės atitinka SOLAS (Gyvybės apsauga jūroje) reikalavimus, kur tai taikoma.
      icon: tabler:lifebuoy
