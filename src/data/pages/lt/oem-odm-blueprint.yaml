faq:
  title: OEM/ODM — Dažniausiai užduodami klausimai
  questions:
    - q: Kokia yra minimali užsakymo kiekio (MOQ) sąlyga individualiems pripučiamiesiems SUPs?
      a: Standartiniams modeliams su esamomis formomis MOQ pradedi nuo 5–10 vienetų kiekvienam dizainui. Visiškai individualizuotoms formoms ir įrankiams MOQ paprastai yra 200+ vienetų. Dirbame su startuoliais ir kylančiais prekės ženklais, kad rastume tinkamus įėjimo taškus.
    - q: Kiek laiko OEM trunka mėginių ėmimo procesas?
      a: Standartiniai prototipo pavyzdžiai baigiami per 7–14 darbo dienų po dizaino patvirtinimo. Skubūs užsakymai gali būti prioritetizuojami per 5–7 dienas už papildomą mokestį.
    - q: Kuo skiriasi PVC Hypalon pripučiamos valtys ir pripučiamos valtys?
      a: PVC yra lengvesnis, prieinamesnis ir pasižymi puikiu lankstumu šaltam orui.Hypalon (CSM) užtikrina aukščiausios kokybės UV ir atsparumo ozonui savybes su ilgesniu tarnavimo laiku (10–15 metų, palyginti su 5–8 metais). Rekomenduojame PVC daugumai rekreacinių taikymų ir Hypalon komerciniam bei profesiniam naudojimui.
    - q: Ar galite pritaikyti pripučiamo įrenginio formą ir dizainą?
      a: Taip. Mūsų R&D komanda gali sukurti individualias formas bet kokiai korpuso formai, plokštės kontūrui ar vamzdžių konfigūracijai. Naudojame CNCapdirbtas aliuminio formas tikslumui ir nuoseklumui.
    - q: Ar teikiate gamyklos audito paslaugas?
      a: Laukiame vietinių ir trečiųjų šalių gamyklų auditų mūsų 12 000 m² patalpose Čingdao. Palaikome ISO 9001 ir BSCI sertifikatus bei galime dalintis audito ataskaitomis NDAapie .
    - q: Kokias siuntimo sąlygas siūlote?
      a: Siūlome FOB Qingdao (standartinį), CIF, ir DDP siuntimo sąlygas. Visuose užsakymuose yra konteinerių pakrovimas ir pilna eksporto dokumentacija OEM .
content_profiles:
  tagline: Prekės ženklų profiliai
  title: OEM / Privati etikečių gamyba<br />Pagal kliento tipą
  subtitle: Skirtingi prekės ženklų profiliai turi skirtingus reikalavimus – mes OEMpritaikome savoODM / paslaugas pagal jūsų verslo modelį, mastelį ir rinkos strategiją.
  items:
    - title: Startuolių vandens transporto priemonių prekės ženklai
      subtitle: ŽemasMOQ, greitas pakilimas
      description: Verslininkai ir įkūrėjai, pradėję savo pirmąją SUPs, kanojų ar pripučiamų valčių liniją. Jums reikia gamybos partnerio, kuris elgtųsi su jūsų prekės ženklu kaip su savo pačių — su žemais įėjimo reikalavimais, lankstiomis partijos apimtimis ir praktine dizaino pagalba kiekviename žingsnyje.
      features:
        - MOQ nuo 50–100 vienetų per SKU, o ne tūkstančius
        - Iš anksto egzistuojanti pelėsių biblioteka, leidžianti išvengti įrankių gamybos išlaidų
        - 'Pilnas prekės ženklo paketas: logotipas, vamzdelio grafika, pakuotė, pakabinamos etiketės'
        - Pirmas pavyzdys – patvirtinimas prieš gamybą
    - title: Įsitvirtinę jūrų prekių ženklai
      subtitle: OEM Mastelis CEsu /ISO Atitiktis
      description: Esami valčių, PWC ar jūrinių priedų prekių ženklai prideda pripučiamus vandens transporto priemonių modelius į savo portfelį. Reikia nuoseklios kokybės visose gamybos partijose, atitikties pasaulinėms rinkoms ir gebėjimo kartu kurti individualius korpusus ar vamzdžių formas.
      features:
        - Individuali 3D formų inžinerija nuosaviems dizainams
        - CE 2013/53/ES, UKCAUSCG , atitikties dokumentacija
        - BSCI Socialinių auditų ataskaitos dėl mažmenininkų atitikties
        - Dedikuotas paskyros valdymas + prioritetinės gamybos vietos
    - title: DTC ir elektroninės prekybos prekės ženklai
      subtitle: Paruoštas tiekimui mažmeninės prekybos pakavimas dideliu mastu
      description: Internetu pirmiausia parduodami prekės ženklai per Amazon, Shopify arba savo internetines parduotuves. Pakavimas, išpakavimo patirtis ir nuosekli vieneto kokybė yra labai svarbūs. Jums reikia gamyklos, kuri suprastų elektroninės prekybos greičio ir grąžinimo rodiklio dinamika.
      features:
        - Paruoštas mažmeninei prekybai dėžutės dizainas + kortelės įterpimo spausdinimas
        - Vakuuminis pakavimas / padėklų paruošimas ekonomiškam siuntimui
        - EAN / UPC brūkšninių kodų ir muitinės dokumentai
        - Mišrių konteinerių konsolidavimas, siekiant optimizuoti galutinę kainą
    - title: Gyvenimo stiliaus ir lauko prekės ženklai
      subtitle: Baltos etiketės dizainas + kategorijos plėtra
      description: Drabužių, lauko įrangos ar kelionių prekės ženklai, įžengiantys į vandens sporto kategoriją po savo etikete. Galbūt neturite vidaus jūrų inžinerijos ekspertų — todėl jums reikia partnerio, kuris galėtų jus palydėti nuo koncepcijos iki konteinerio su minimaliais trukdžiais.
      features:
        - Tendencijų tyrimai ir koncepcijos nuotaikos lentos
        - Bendrai ženklintos ribotos leidimo versijos ir sezoninės spalvų gaminės
        - Dizaino iki pavyzdžio ciklas per 10–14 darbo dienų
        - 'Pilna logistika: gamykla → sandėlis → vartotojas'
