faq:
  title: Paketo DUK
  questions:
    - q: Koks yra minimalus siuntinių užsakymo kiekis?
      a: Club Starter paketas turi mažiausiai 10 vienetų. Kurorto ir prekės ženklo paketai yra pritaikyti pagal jūsų poreikius su lanksčiu MOQs.
    - q: Kiek laiko trunka pristatymas?
      a: Standartinė gamyba trunka 30–45 dienas nuo užsakymo patvirtinimo. Pagreitinta gamyba siūloma už papildomą mokestį.
    - q: Ar galiu pritaikyti įrangos spalvas ir prekės ženklą?
      a: Taip. Visi paketai apima pilną pritaikymą – kartonų spalvas, logotipo spaudinius ir pakuotės dizainą.
    - q: Ar teikiate pagalbą po pardavimo?
      a: Taip. Kiekvienas paketas apima prieigą prie mūsų internetinių priežiūros vadovų, vaizdo pamokų ir atsarginių dalių užsakymo sistemos.
