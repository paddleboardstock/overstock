features3_what_we_build:
  title: Ką mes gaminame
  subtitle: Sutelktas produktų asortimentas, kurį puikiai pažįstame – jokie neišbaigti eksperimentai, jokio simbolinio ženklinimo.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB valtys
      description: Aliuminio korpusas RIBs nuo 3,3 m iki 7,5 m. Sukurtos patruliavimui, nardymui, žvejybai ir šeimos naudojimui.
      icon: tabler:ship
    - title: Pripučiamieji laiveliai
      description: PVC ir Hypalon pripučiamos klampinės valtys nuo 2,4 m iki 4,2 m. Lengvos, tvirtos ir lengvai laikomos.
      icon: tabler:speedboat
    - title: Superjahtų valtims
      description: Kompaktiškos, aukštos spec. RIBs individualiai pritaikytos jūsų pagrindinės laivo išvaizdai.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Priedai
      description: Irklai, siurbliai, dangčiai, džiovinimo maišai, kuro bakai ir elektronika. Visi pritaikyti mūsų valtims.
      icon: tabler:package
    - title: Atnaujinimas ir remontas
      description: Vietinis vamzdžių keitimas, elektronikos atnaujinimas ir variklių patobulinimai.
      icon: tabler:tool
    - title: Individualūs projektai
      description: Projektuojame pagal užsakymą komerciniams, moksliniams ir kariniams klientams.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Valtyčių projektavimas ir inžinerijos diskusija
steps2_values:
  title: Mūsų vertybės
  subtitle: Trys principai, kurie formavo kiekvieną produktą nuo pirmos dienos.
  items:
    - title: Kurk taip, tarsi tai gabena tavo šeimą
      description: Kiekviena laivo korpuso dalis, suvirinimas ir tvirtinimo elementas yra vertinama taip, tarsi jį naudotų mūsų pačių šeimos.
      icon: tabler:heart
    - title: Inžinierius prieš mes parduodame
      description: Jei specifikacija klaidinga, mes keičiame specifikaciją — niekada klientą.
      icon: tabler:settings
    - title: Palaikymas, kuris trunka ilgiau nei garantija
      description: Dvidešimties metų korpusai vis dar skambina mums dėl atsarginių dalių, ir mes vis dar atsakome.
      icon: tabler:headset
steps2_milestones:
  title: Svarbūs įvykiai
  subtitle: Trumpa Paddle Board Overstock istorijos versija.
  isReversed: true
  items:
    - title: Įsteigta pakrantės dirbtuvėse
      description: Įkūrė du laivų architektai su CNC malūnu ir užsispyrusia idėja.
      icon: tabler:building-factory
    - title: Pirmieji 1 000 korpusų pristatyti
      description: Pasiekta mūsų septintaisiais metais, daugiausia per žodinę reklamą ir pasikartojančius klientus.
      icon: tabler:circle-check
    - title: Tarptautinė eksporto programa
      description: Dabar pristatoma į 50+ šalių su vietiniais palaikymo partneriais penkiuose žemynuose.
      icon: tabler:world
    - title: Nauja pasaulinė veiklos struktūra
      description: 2026 m. rugsėjį prekės ženklo veikla buvo perkelta iš Qingdao Vatrad Group į Weihai Dongjilian Co., Ltd. (Niujosas, JAV); Qingdao gamybos centras toliau vykdo mokslinius tyrimus ir plėtrą, gamybą bei tiesioginį eksporto iš gamyklos.
      icon: tabler:building-skyscraper
features2_locations:
  title: Mūsų vietos
  tagline: Rask mus
  columns: 3
  items:
    - title: Būstinė ir dirbtuvės
      description: Pajūrio pramoninis parkas, pastatas 4 — lankymas tik pagal išankstinę sutartį, nuo pirmadienio iki penktadienio.
    - title: ES paslaugų centras
      description: Viduržemio jūros uostas – atnaujinimas, remontas ir garantinis aptarnavimas Europos klientams.
    - title: APAC partnerių tinklas
      description: Įgalioti aptarnavimo partneriai Australijoje, Japonijoje, Singapūre ir Honkonge.
brand_hub_tagline: Prekės ženklas
brand_hub_title: Tyrinėkite mūsų prekės ženklą
brand_hub_subtitle: Giliau pasinerkite į mūsų jūrų inžinerijos patirtį, pasaulinę veiklą ir principus, kurie mus varo.
brand_hub_cards:
  - title: Jūrų ekspertizė
    desc: Kelerius dešimtmečius trunkanti medžiagotyros, tikslios gamybos ir realaus pasaulio testavimo patirtis — nuo PVC/Hypalon gamybos iki gilios V formos korpuso dizaino ir drop-stitch technologijos.
    link: /brand-marine-expertise
    link_label: Sužinokite daugiau →
  - title: Pasaulinė buvimas
    desc: Siuntimas į 50+ šalių iš mūsų Qingdao įrenginio su įgaliotais aptarnavimo partneriais visoje Europoje, Azijos ir Ramiojo vandenyno regione bei Amerikoje.
    link: /brand-global-presence
    link_label: Sužinokite daugiau →
  - title: Kodėl Paddle Board Overstock
    desc: Vertikali integracija, dviguba sertifikacija (ISO 9001 + BSCI), CE atitiktis ir žemos MOQs – sukurtas prekės ženklams, platintojams ir valstybės agentūroms.
    link: /brand-why-paddleboardoverstock
    link_label: Sužinokite daugiau →
production_section:
  tagline: Gamybos meistriškumas
  title: Užtikriname puikų meistriškumą
  description: Paddle Board Overstock gamybos linija skirta aukštos kokybės, patvariems ir aukštos našumo pripučiamų valtis produktams gaminti.
  cards:
    - title: Patyrusi technikų komanda
      items:
        - Profesionalios žinios apie PVC, Hypalon ir jūrinius materiali
        - Tikslus darbas pjaustant, klijuojant ir montuojant priedus
        - Nuolatinis mokymasis, siekiant įvaldyti naujausias gamybos technologijas
    - title: Pažangios gamybos įrangos
      items:
        - CNC pjaustymo įranga tiksliam audinio pjovimui su minimaliu klaidų lygiu
        - Didelio tikslumo šilumos/šalto klijavimo technologija sandariems, patvariems siūlėms
        - Profesionali sandarumo ir tempimo bandymų įranga
    - title: Brandus valdymo sistema
      items:
        - Standartizuoti gamybos procesai su aiškiais kokybės standartais
        - Taupi gamybos filosofija, mažinanti atliekas ir didinanti efektyvumą
        - Efektyvus tiekimo grandinės valdymas su patikimais tiekėjų partneriais
    - title: Griežta kokybės kontrolė
      items:
        - Sertifikuota kokybės valdymo sistema
        - 'Daugiapakopė tikrinimo sistema: žaliava, proceso metu, galutinis išsiuntimas'
        - Griežti sandarumo ir patvarumo bandymai prieš siunčiant
global_ops_section:
  tagline: Pasaulinė operacijų architektūra
  title_html: Vienas prekės ženklas,<span class="text-white/90">dvi pagrindinės bazės</span>
  description_html: Nuo 2026 m. rugsėjo Paddle Board Overstock valdo<strong class="text-white">Weihai Dongjilian Co., Ltd.</strong>(Naujojo Meksiko, JAV) – pasaulinė vienetė distribucijai, komerciniams B2B pardavimams, sutarčių sudarymui, sąskaitų faktūrų išrašymui ir aptarnavimui po pardavimo. Tyrimų ir plėtros, gamybos ir kokybės kontrolė lieka<strong class="text-white">Paddle Board Overstock Qingdao gamybos centre</strong>, kuris siunčia kiekvieną užsakymą tiesiai iš gamyklos, FOB Qingdao. Perėjimas pakeitė tik tai, kas pasirašo jūsų sutartį – ne kas gamina jūsų valtį.
  stats:
    - value: 2,400+
      label: Korpūs tiekiami visame pasaulyje
    - value: 50+
      label: Eksportuojančios šalys
    - value: 10+
      label: Gamybos metai
