hero:
  tagline: Apie mus
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock gamykla ir dirbtuvės
  title: |
    Jūrų inžinerija,<br />
    pastatė<span class="text-accent dark:text-white">Paddle Board Overstock</span>kelias
  subtitle: 'Pradėjome pakrantės dirbtuvėje su viena valtimi ir tvirtai tikėjome: jūros produktai turi būti kuriami taip, lyg jie būtų svarbūs, nes jie tokie yra. Šiandien siųsime į daugiau nei 50 šalių, tačiau kiekvienas korpusas vis dar praeina per tas pačias rankas, kurios pradėjo įmonę.'
