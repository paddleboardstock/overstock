hero:
  tagline: Pramonės sprendimų matrica
  title: Scenarijais pagrįsti jūrų sprendimai<br />Profesiniams veiksmams
  subtitle: Specialiai sukurti pripučiami vandens laivai ir RIBs, pritaikyti gelbėjimo, nuomos flotilės, jachtų pagalbiniams laivams ir komerciniam žvejybos naudojimui — kiekvienas paremta techninėmis specifikacijomis ir pritaikymo galimybėmis.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock profesionalūs jūriniai sprendimai įvairioms pramonės šakoms
direct_answer: 'Paddle Board Overstock teikia scenarijus atitinkančius pripučiamus vandens laivus ir RIB sprendimus komercinei jūrų veiklai: gelbėjimo ir patrulių valtis su sustiprintais Hypalon vamzdžiais ir daugiasluoksnėmis saugos kameromis, nuomos flotilės SUPs ir baidarės su 1,2 mm PVC ir karštu oru suvirintais siūlėmis ilgalaikiam atsparumui priežiūrai, prabangių jachtų vairalazdes su gilia V formos aliuminio korpusu RIBs, ir sunkiems žvejybos poreikiams skirtos konfigūracijos su meškerių laikikliais ir gyvų žuvų rezervuarų sistemomis.'
solution_a:
  tagline: Sprendimas A
  title: Jūrinė gelbėjimo tarnyba &<br />Komercinė patrulė
  subtitle: Aukšto greičio, daugiakamario saugos RIBs profesionalioms avarinėms reagavimo ir teisėsaugos operacijoms.
  badge: Heavy-Duty Series
  description: Mūsų jūrų gelbėjimo ir patrulių RIBs yra pagaminti iš sustiprintų aukšto tankio Hypalon/PVC oro vamzdžių, turinčių daugiasluoksnę nepriklausomo plūduriavimo konstrukciją. Kiekviena valtis yra aprūpinta profesionalios klasės atspindinčia juosta, gelbėjimo virvėmis ir greito užpildymo vožtuvais, skirtais paruošimui naudojimui. Gilus V formos stiklo pluošto korpusas užtikrina išskirtinį stabilumą dideliu greičiu ir esant banguotoms jūros sąlygoms.
  features:
    - title: Daugiakamerės saugos sistemos
      description: 4–6 nepriklausomos oro kameros – bet koks vienos kameros pradurimas palaiko teigiamą plūdrumą
    - title: Sustiprintos vamzdinės medžiagos
      description: 1,2 mm Hypalon CSM arba 1 680 DTEX PVC su dvigubo sluoksnio karšto oro suvirintomis siūlėmis
    - title: Profesionalus lygis
      description: SOLAS atspindinti juosta, gelbėjimo kilpos, tempimo laikikliai, greito išmetimo dažytojo lynas
    - title: Didelio greičio korpusas
      description: Giliai V formos stiklo pluošto arba aliuminio korpusas, kurio greitis įvertintas 25–45 mazgais, priklausomai nuo konfigūracijos
  recommended_models:
    - RIB 450 patrulis
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Korpuso medžiaga
      value: Stiklo pluoštas / Jūrinio laipsnio aliuminis
    - label: Vamzdinė medžiaga
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Didžiausias greitis
      value: 25–45 mazgų
    - label: Talpa
      value: 6–12 asmenų
    - label: Variklio diapazonas
      value: 40–200 HP
    - label: Sertifikacija
      value: CE / ISO 9001
solution_b:
  tagline: Sprendimas B
  title: Vandens sporto įrangos nuoma &<br />Kurorto flotilės įranga
  subtitle: Itin patvarūs, mažai priežiūros reikalaujantys pripučiami SUPs, baidarės ir valtys, sukurtos kasdieniam nuomojimui kurortuose, klubuose ir turizmo paslaugose.
  badge: Rental-Grade
  description: Mūsų nuomos parkui skirtos įrangos konstrukcija sukurta maksimaliai patvari ir mažiausioms priežiūros sąnaudoms. Naudojame 1,2 mm sustiprintą PVC su trigubo sluoksnio karšto oro suvirinimo siūlių technologija, kuri atspari UV degradacijai ir dažniem susidūrimų pažeidimams. Drop-stitch konstrukcija užtikrina, kad lentos išlaikytų standumą net po šimtų nuomos ciklų. Visuose modeliuose yra sustiprinti D-formos žiedai, atsparios trinčiai bėgių juostos ir komercinės klasės vožtuvai.
  features:
    - title: Komercinės klasės PVC
      description: 1,2 mm armuotas PVC su UV stabilizatoriais — 3 kartus storesnis nei vartotojams skirti medžiagos
    - title: Karštuoju oru suvirintos siūlės
      description: Trijų sluoksnių suvirinimas sujungimu — stipresnis už klijais sujungimą, atsparus delaminacijai
    - title: Drop-Stitch Standumas
      description: 1 680 DTEX branduolių su 2 gijų/kv. colyje — įvertinta iki 20 PSI dėl kietmedžio plokštės tipo standumo
    - title: Paruošta flottai dizainas
      description: Sustiprinti D formos žiedai, komercinės Halkey-Roberts vožtuvai, atsparios dilimui bėgių juostos
  recommended_models:
    - SUP Gepardo šuolis
    - SUP Vandenynų Keliautojas
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Vamzdžio Medžiaga
      value: 1,0–1,2 mm sustiprintas PVC
    - label: Siūlių technologija
      value: Trijų sluoksnių karšto oro suvirinimas
    - label: Didžiausias slėgis
      value: 15–20 PSI (drop-stitch modeliai)
    - label: Atsparumas UV spinduliams
      value: 1 000+ valandų spartintas testavimas
    - label: Garantija
      value: 2–5 metai, priklausomai nuo modelio
    - label: Priežiūra
      value: Minimalus — praplauti ir laikyti
solution_c:
  tagline: Sprendimas C
  title: Jachtų valtelių &<br />Prabangių vandens transporto priemonių
  subtitle: Lengvos, aukštos kokybės RIB valtelės, skirtos prabangių jachtų laikymui ir keleivių transportavimui, su prabanga apdaila.
  badge: Premium Series
  description: Mūsų jachtų valtelių RIBs derina lengvą konstrukciją su prabangia estetika. Giliai-V aliuminio arba stiklo pluošto korpusai suteikia puikią plaukimo kokybę ir lengvą kelimą davitais. Galima su spalvai pritaikytomis grafikos detalėmis, premium apmušalais ir individualia konsolės išdėstymo galimybe. Kompaktiški laikymo matmenys daro jas idealias superjachtų garažams ir denio saugojimui.
  features:
    - title: Lengva konstrukcija
      description: Jūrinės klasės aliuminio korpusai sumažina svorį 30 % lyginant su stiklo pluoštu, kad būtų lengva kelti
    - title: Deep-V našumas
      description: 18–22 laipsnių deadrise korpusas suteikia sklandų plaukimą banguotose sąlygose ir puikų stabilumą
    - title: Prabangi apdaila
      description: Individualūs apmušalai, spalvai pritaikyti vamzdžiai, premium vairavimo konsolė, nerūdijančio plieno paketas
    - title: Kompaktiškas laikymas
      description: Sukurta superjachtų garažams — pripučiami vamzdžiai kompaktiškam saugojimui
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Korpuso tipas
      value: Deep-V Aliuminis / Stiklo pluoštas
    - label: Deadrise
      value: 18–22 laipsniai
    - label: Didžiausias greitis
      value: 30–40 mazgų
    - label: Sausasis svoris
      value: 120–350 kg (aliuminio korpusas)
    - label: Paruošta kelimui davitu
      value: Taip — pakėlimo taškai standartiniai
    - label: Sandėliavimas
      value: Pripučiami vamzdžiai, dėti vieną ant kito
