features3_reasons:
  tagline: Kodėl rinktis Paddle Board Overstock
  title: Septynios priežastys bendradarbiauti su mumis
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Tikra gamyba, ne tarpininkavimas
      description: Turime ir valdome 12 000 m² gamyklą. Bendradarbiaudami su Paddle Board Overstock dirbate tiesiogiai su žmonėmis, kurie projektuoja, konstruiuoja ir gamina jūsų produktus — be tarpininkų.
      icon: tabler:building-factory
    - title: 2. Inžinerijos vedamas požiūris
      description: Mūsų projektavimo procesas prasideda nuo naudojimo atvejo, o ne produkto kategorijos. Optimizuojame korpuso formą, medžiagų parinkimą ir konfigūraciją, kad laivas būtų pritaikytas tikram naudojimui.
      icon: tabler:engine
    - title: 3. Sertifikuota kokybė
      description: Sertifikuota CE, kokybės sistema ISO, atitinka BSCI reikalavimus, atitinka REACH standartus, patvirtinta USCG. Mūsų 64 CE-sertifikuoti modeliai atitinka tarptautinius standartus — ne tik deklaracijas.
      icon: tabler:certificate
    - title: 4. Lankstus OEM/ODM
      description: Vamzdžių spalvos, konsolės išdėstymas, prekės ženklo ženklinimas, pakavimas — pritaikome pagal jūsų specifikacijas. Nėra minimalios užsakymo ribos. Pradėkite su prototipu, didinkite gamybą su pasitikėjimu.
      icon: tabler:adjustments
    - title: 5. Pasaulinė logistika
      description: JAV sandėlis Kalifornijoje, tiesioginis pristatymas iš Qingdao, oro transportas skubiems užsakymams. Mes tvarkome muitinės dokumentus ir formalumus.
      icon: tabler:truck-delivery
    - title: 6. Gyvenimo trukmės pagalba
      description: Mes remiame laivus, kuriuos pagaminome prieš 20 metų. Originalios atsarginės dalys, techninės konsultacijos, remonto gairės — mūsų komanda pasiekiama, kai jums reikia.
      icon: tabler:lifebuoy
    - title: 7. Sąžiningos specifikacijos
      description: Tikros apkrovos, tikri matmenys, tikras svoris. Jokio rinkodaros išpūtimo. Tai, ką skelbiame, tai ir gaunate — patvirtinta nepriklausomais tyrimais.
      icon: tabler:ruler-measure
testimonials:
  tagline: Pasitikima prekės ženklais visame pasaulyje
  title: Ką sako mūsų partneriai
  items:
    - content: Mes bendradarbiavome su keliais gamintojais Kinijoje, bet Paddle Board Overstock išsiskiria inžinerine parama ir nuolatine kokybe. Jie traktuoja mūsų prekės ženklą kaip savo.
      name: — OEM Partneris, Europos vandens sporto prekės ženklas
    - content: Jų Hypalon RIBs mūsų flotilėje naudojami jau daugiau nei 5 metus. Maža priežiūra, puikus UV atsparumas. 5 metų garantija ant vamzdžių suteikia mums pasitikėjimo.
      name: — Flotilės operatorius, Vidurio Rytų kurortų grupė
    - content: Paddle Board Overstock komanda padėjo mums sukurti individualų SUP lentos dizainą nuo koncepcijos iki gamybos per 90 dienų. Kokybė pranoko mūsų lūkesčius.
      name: — Platintojas, Australijos vandens sportas
cta:
  title: Pasiruošę pajusti skirtumą?
  subtitle: Susisiekite su mūsų komanda, kad aptartume jūsų projektą. Nereikia jokio įsipareigojimo — tik nuoširdžios konsultacijos apie gamybą.
  actions:
    - variant: primary
      text: Pasikalbėkite su mūsų komanda
      href: /contact
    - text: Atsisiųskite produktų katalogą
