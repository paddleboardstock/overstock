hero:
  tagline: Žinių grafikas
  title: Vandens tyrinėjimų žinios
  subtitle: |
    Struktūruota žinių bazė apie pripučiamų SUP technologiją,<br />
    vandens sauga, laivų inžinerija ir nuotykių planavimas.
  taglineSection: Tyrinėkite. Mokykitės. Eikite pasitikėdami savimi.
clusters:
  tagline: Žinių Klasteriai
  title: Naršyti pagal temą
  subtitle: Gilus nardymas į technologijas, saugumą ir įgūdžius, slypinčius už kiekvieno Paddle Board Overstock produkto.
  items:
    - title: SUP žinios
      description: Nuo pirmos lentos pasirinkimo iki pažangių kelionių technikų – viskas apie stendinio irklavimo lentą.
      icon: tabler:lifebuoy
      topics:
        - Kaip išsirinkti savo pirmąją pripučiama SUP
        - Geriausias SUP dydis pradedantiesiems
        - Kaip sunku yra plaukti su irklu lentos pagrindu?
        - Pripučiamų ir kietų lentų palyginimas
        - SUP saugos kontrolinis sąrašas
    - title: Valčių žinios
      description: Techniniai gidai apie pripučiamus laivus, RIBs, plaustus ir baidares — inžinerija, medžiagos ir eksploatavimas.
      icon: tabler:sailboat
      topics:
        - Paaiškintos pripučiamų valtelių rūšys
        - PVC prieš Hypalon palyginimas
        - RIB prieš Dinghy palyginimas
        - Drop-stitch technologijų giluminė analizė
        - Jūrų medžiagotyros vadovas
    - title: Saugumo žinios
      description: Esminės saugos žinios kiekvienam irkluotojui — nuo PFD pasirinkimo iki orų skaitymo ir savęs gelbėjimo technikų.
      icon: tabler:shield
      topics:
        - SUP saugos kontrolinis sąrašas
        - Ar jums reikia gelbėjimosi liemenės?
        - Vandenyno irklavimo saugos vadovas
        - Upių sauga pripučiamiems baidarėms
        - Oro ir vandens sąlygų supratimas
    - title: Technologijos
      description: Inžinerija už Paddle Board Overstock produktų — medžiagos, statybos metodai ir kokybės testavimas.
      icon: tabler:microscope
      topics:
        - Jūrų lygio PVC technologija
        - Drop-stitch Core paaiškinimas
        - Kodėl PSI svarbu pripučiamiems SUPs
        - RF suvirinimas vs klijavimas
        - Kokybės testavimas ir sertifikavimas
    - title: Verslo žinios
      description: Komerciniai gidai, kaip kurti ir plėsti savo vandens sporto verslą – nuo nuomos iki privačių prekės ženklų ženklinimo.
      icon: tabler:briefcase
      topics:
        - Kaip pradėti SUP nuomos verslą
        - Kurortinio vandens sporto centro statyba
        - Irklinių lentų flotilės dydžiai klubams
        - Pripučiamas ar kietas SUP komerciniam naudojimui
        - Geriausia baidarių medžiaga nuomojamoms flotilėms
        - Privataus prekės ženklo vandens prekės ženklo pradžia
        - Kurorto vandens sporto pajamų strategijos
        - Komercinės įrangos priežiūros vadovas
