process_steps:
  title: 6 žingsnių OEM/ODM procesas
  subtitle: Nuo dizaino užduoties iki FOB Qingdao — supaprastintas darbo procesas
  steps:
    - number: '01'
      title: Dizaino užduotis ir 3D CAD modeliavimo kūrimas
      description: Pasidalinkite savo tikslais, etalono produktu arba koncepcija. Mūsų inžinierių komanda parengia detalias CAD schemas ir 3D vizualizacijas jūsų patvirtinimui.
      timeline: 3–5 dienos
    - number: '02'
      title: Medžiagų parinkimas ir audinio testavimas
      description: Pasirinkite iš karinės klasės PVC (0,9–1,2 mm), Hypalon CSM arba drop-stitch branduolio audinių. Atlikome tempimo stiprumo, dangos sukibimo ir UV stabilumo testus.
      timeline: 2–3 dienos
    - number: '03'
      title: Greitas prototipavimas ir pavyzdžių gamyba
      description: Mes CNC apdirbame individualias formas ir gaminame priešgamybinius pavyzdžius su jūsų prekės ženklo spalvomis, logotipu ir nurodytomis medžiagomis. Pavyzdžiai siunčiami jūsų patvirtinimui.
      timeline: 7–14 dienų
    - number: '04'
      title: 24–48 val. didelio slėgio laikymo testas
      description: Kiekvienas prototipas pereina griežtą slėgio išlaikymo testą esant 1,25x nominaliam slėgiui. Atliekami siūlių atplaišos testai ir matmenų patikrinimas.
      timeline: 1–2 dienos
    - number: '05'
      title: CE/ISO Kokybės tikrinimas ir pakavimas
      description: 100 taškų kokybės patikrinimo sąrašas. Kiekviena vienetai tikrinama prieš pakavimą į mažmeninei prekybai paruoštą pakuotę. CE atitikties deklaracija ir BSCI ataskaita apie atitiktį pridedami.
      timeline: 2–3 dienos
    - number: '06'
      title: FOB Qingdao gabenimas ir logistika
      description: Užbaigti gaminiai sumontuojami ant palečių, apvyniojami plėvele ir įkeliami į konteinerius Qingdao uoste. Pilna eksporto dokumentacija, muito formalumai ir realaus laiko sekimas.
      timeline: 7–14 dienų
