content_challenge:
  tagline: Iššūkis
  title: Gelbėjimo operacijų reikalavimai<br />Nepakeičiamas patikimumas
  subtitle: Paieškos ir gelbėjimo organizacijos veikia esant dideliam saugumo atsakomybei — kiekviena valties gedimo situacija turi nepriimtinų pasekmių.
  paragraphs:
    - Gelbėjimo operacijose skirtumas tarp sėkmės ir nesėkmės matuojamas minutėmis. Valtis turi būti pasiruošusi išplaukti iš karto, veikti sudėtingomis sąlygomis ir saugiai grįžti su keleiviais. Saugumo atsakomybė yra visiška — mechaninis gedimas gelbėjimo misijos metu nėra remonto kaina, tai prarasta gyvybė.
    - SAR valtys turi turėti didelį greitį, kad greitai pasiektų aukas, kartu su nepaprasta stabilumu saugioms atgabenimo operacijoms. Jos turi gabenti gelbėjimo įrangą, medicinines priemones ir ryšio įrangą — dažnai ribotoje denio erdvėje. Valtys, dirbančios valstybės paslaugose, taip pat turi ilgą tarnavimo laiką (10–15 + metų), kad pagrįstų viešųjų pirkimų biudžetus.
    - Matomumas, tiek operatoriui, tiek paieškos metu, yra itin svarbus. Konsolės dizainas turi suteikti 360 laipsnių matomumą, o valtis turi būti labai matoma orlaiviams ir kitoms valtims.
    - Paddle Board Overstock gelbėjimo RIBs valtys yra suprojektuotos nuo kilio iki denio pagal šiuos reikalavimus — su automatinio vandens nutekėjimo deniais, sustiprintu korpusu, navigacijos įranga ir vilkimo stulpais, kurie standartiniai patrulių modeliuose.
content_solution:
  tagline: Mūsų sprendimas
  title: Tiksliai suprojektuota gelbėjimo RIBs
  subtitle: Kiekviena Paddle Board Overstock gelbėjimo valtis yra suprojektuota atitikti arba viršyti SOLAS ir nacionalinius SAR standartus.
  list:
    - Savarankiškai nusausinantis denis — vanduo nuteka automatiškai stabilumui atgabenimo operacijų metu
    - Sustiprintas gilus-V korpusas — gebėjimas veikti audringuose vandenyse su prognozuojamu valdymu dideliu greičiu
    - Pilna navigacijos šviesų įranga — veikia dieną ir naktį bet kokiomis oro sąlygomis
    - Vilkimo stulpas ir vilkimo virvė — pasiruošę kito laivo tempimui arba gelbėjimo rogės operacijoms
    - Įrangos tvirtinimo plokštės — radijas, paieškos šviesa, sirena ir medicinos įranga
    - Kelių variklių konfigūracijos — vienas išorinis arba dviejų variklių atsarginis
    - Didelio matomumo vamzdžių spalvos — oranžinė, geltona arba raudona maksimaliam matomumui
content_segments:
  tagline: Gelbėjimo profiliai
  title: Paieškos ir gelbėjimo vandens transporto sprendimai<br />Pagal organizacijos tipą
  subtitle: Skirtingos gelbėjimo organizacijos veikia pagal skirtingus įgaliojimus, biudžeto ciklus ir veiklos aplinkas – nuo pakrančių savanorių įgulų iki nacionalinių pakrančių apsaugos laivynų. Kiekvieną gelbėjimo operaciją pritaikome RIB pagal misijos profilį.
  items:
    - title: Pakrančių apsaugos ir vyriausybinės SAR agentūros
      subtitle: Absoliuti saugumo atsakomybė — misijai kritiniai parko standartai
      description: Vyriausybinės SAR agentūros prisiima aukščiausią saugumo atsakomybę jūrų operacijose. Kiekvienas laivas turi nepriekaištingai veikti ekstremaliomis sąlygomis – įrangos gedimas gelbėjimo misijos metu nėra pasirinkimas. Pirkimo sprendimus lemia bendros nuosavybės išlaidos per 10–15 metų tarnavimo laiką, o ne pradinė kaina. Agentūroms reikalingi laivai, kurie išgyventų daugelį pakrančių patruliavimo, atitiktų griežtus nacionalinius standartus ir užtikrintų nuoseklų veikimą paskirstytose stotyse. Privaloma yra išsami atitikties dokumentacija ir daugiamečiai paslaugų susitarimai.
      features:
        - SOLAS ir nacionalinių SAR standartų atitikties dokumentacijos paketo
        - Visos flotilės dalių bendrumas — sumažinti stoties lygio inventoriaus sudėtingumą
        - Dviejų variklių konfigūracija misijai kritiškai svarbiai atsargai
        - 10–15 metų tarnybos trukmės dizainas su suplanuotomis priežiūros programomis
        - Visų oro sąlygų pajėgumas — sustiprintas gilios V formos korpusas audringoms jūros sąlygoms
    - title: Gelbėtojų ir paplūdimio gelbėjimo tarnybos
      subtitle: Greito paleidimo, sekliuose vandenyse operacijos
      description: Savivaldybių ir paplūdimio gelbėtojų paslaugos, kurioms reikalingos greito reagavimo laivai, galintys plaukti per bangų zonas, veikti sekliuose pakrantės vandenyse ir pasiekti plaukikus ar nelaimės ištiktus laivus per kelias minutes. Įranga turi būti pakankamai lengva, kad būtų galima tempti paplūdimyje mažu automobiliu arba rankiniu būdu.
      features:
        - Seklaus grimzlės RIB korpusas bangų zonų ir pakrantės operacijoms
        - Paplūdimio paleidimo galimybė, su priekinio kėlimo rankena ir kilio apsauga
        - Integruotos gelbėjimo rogės arba gelbėjimo plaukikų platforma
        - Ryškiai matomų oranžinių arba geltonų vamzdžių spalvų standartas
    - title: Priešgaisrinės gelbėjimo tarnybos
      subtitle: Gaisrinių siurblių integracija, įrangos montavimas, greitas reagavimas
      description: Gaisrų gelbėjimo jūrų vienetai reaguoja į gaisrus prie vandens pakrantės, laivų gaisrus ir gelbėjimo incidentus vandenyje. Šie laivai turi turėti gaisrinius siurblius, monitorius, žarnų saugyklas ir kvėpavimo aparatūrą – visa tai integruota į stabilią, greito reagavimo platformą. Departamentai taip pat naudoja šiuos laivus potvynių valdymui ir tarpusavio pagalbos operacijoms. Konsolės išdėstymai turi talpinti siurblių valdymą, radijo sistemas ir avarinį apšvietimą, nepažeidžiant denio vietos įgulos judėjimui.
      features:
        - Priekyje montuojamas ugnies monitorius su siurblio integracijos paketu
        - Specialios įrangos tvirtinimas gaisro siurbliui, žarnų laikymui ir BA komplektams
        - Konsolės išdėstymas konfigūruojamas siurblių valdymui, radijui ir avariniam apšvietimui
        - Savaime išsitraukianti denis gaisro gesinimui, vandens nutekėjimui ir stabilumui
        - 'Naktinių operacijų paketas: prožektorius, scenos apšvietimas, mėlynos/raudonos šviesos juosta'
    - title: Jūrų policija ir uosto saugumas
      subtitle: Sulaikymo, patruliavimo, įsiveržimo operacijos
      description: Jūrų teisėsaugos padaliniams reikalingi laivai, galintys greitai persekioti, įtartinų laivų šturmuoti ir patruliuoti uoste. Šie laivai turi turėti saugią saugojimo vietą kontrolės įrangai ir ginklams, ryšių integraciją su kranto vadovybe ir pakankamą denio erdvę įsiveržimo komandų operacijoms. Naktinių operacijų galimybės ir žemo profilio priartėjimas yra būtini trukdymo misijoms.
      features:
        - Didelio greičio persekiojimo galimybė — obliuojantis korpusas su 40+ mazgų maksimaliu greičiu
        - Apsaugokite ginklų spintelių ir kontrolės priemonių saugojimo skyrius
        - Konsolės integracija policijos radijo, MDT ir ryšių sistemoms
        - 'Naktinių operacijų paketas: IR prožektorius, FLIR tvirtinimas, slaptas apšvietimas'
        - Sustiprinta įlaipinimo platforma su neslystančiu paviršiumi
        - Mėlynas/raudonas avarinis apšvietimas ir sirenų sistema
    - title: Savanoriškos paieškos ir gelbėjimo (SAR) ir ne pelno organizacijos
      subtitle: Dotacijomis finansuojamos, bendruomenės pagrindu vykdomos pakrančių ir ežerų operacijos
      description: Bendruomenės pagrindu veikiančios gelbėjimo grupės veikia ežeruose, upėse ir pakrančių zonose, kur vyriausybės SAR aprėptis yra ribota. Dažnai finansuojamos aukomis ar vyriausybės dotacijomis, šios organizacijos reikalauja maksimalios galimybės už dolerį – patikimo, mažai priežiūros reikalaujančio laivo, kurį savanoriai gali saugiai valdyti su minimaliais specializuotais mokymais. Dotacijų gavimo ciklai reiškia, kad laivai turi atitikti reikalavimus ir laikytis nustatytų biudžetų.
      features:
        - Vieno išorinio variklio konfigūracija, optimizuota mažesnėms įsigijimo ir eksploatavimo sąnaudoms
        - PVC Statyba – mažesnė priežiūra ir lengvas lauko remontas
        - Daugiafunkcinė konsolė, mažinanti elektroninį sudėtingumą savanoriams operatoriams
        - Dotacijų atitikties dokumentų paketas finansavimo paraiškoms
        - Lengvas dizainas paplūdimio nuleidimui be specialios priekabos ar krano
    - title: Potvynių gelbėjimas ir reagavimas į nelaimes
      subtitle: Vidaus potvyniai, seklus vanduo, nuolaužų pilnos aplinkos
      description: Potvynių gelbėjimas yra atskiras operacinis profilis – valtys veikia užtvindytose miesto teritorijose, nuolaužomis užpildytose srovėse ir itin sekliose vandenyse, kur nematomi panirę kliūtys. Operatoriams reikalingi laivai, galintys plaukti per užtvindytas gatves, prasibrauti pro nuolaužas ir ištraukti aukas iš pastatų bei transporto priemonių. Seklios grimzlės galimybės yra kritiškai svarbios, kaip ir gebėjimas veikti srovėje, kai yra kliūčių pavojus. Šiuos laivus dažnai naudoja ugniagesių tarnybos, civilinės gynybos ir nelaimių pagalbos NVO.
      features:
        - Labai seklus grimzlės korpusas — veikia 30–50 cm gylyje
        - Nuolaužų nukreipimo priekis ir sustiprinta vamzdžių apsauga panirusiems kliūtims
        - Savaime išsipildanti terasa potvynio vandens nutekėjimui ir nukentėjusiųjų surinkimui
        - Didelio matomumo oranžiniai arba geltoni vamzdžiai oro žvalgybai
        - Lengvas dizainas sraigtasparnių transportui ir kelių dislokavimui
        - Sustiprinti kėlimo taškai kėlimo taškams kėlimo ir virvių gelbėjimo operacijoms
