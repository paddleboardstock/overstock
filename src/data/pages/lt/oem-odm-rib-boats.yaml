content_customization:
  tagline: Ką galima pritaikyti
  title: RIB Individualizavimas<br />Parinktys
  subtitle: Kiekvienas laivo elementas RIB gali būti pritaikytas jūsų taikymui, rinkai ir prekės ženklo reikalavimams.
  items:
    - title: Korpusas ir konstrukcija
      description: Korpuso ilgis (2,5–8,5 m), korpuso medžiaga (GRP stiklo pluošto arba jūrinės klasės aliuminis), korpuso spalva (gelcoat arba dažyta), kilio profilis (gilus V, vidutinis V, plokščias), transomo tipas (uždaras su laikikliu arba gręžiniu) ir konstrukcinis sutvirtinimas komerciniams kroviniams.
      icon: tabler:sailboat
    - title: Vamzdelis ir apykaklė
      description: Vamzdelio medžiaga (0,9–1,2 mm PVC arba 1,4–1,7 mm Hypalon/CSM), vamzdžio skersmuo (40–55 cm), kamerų skaičius (3–7), vožtuvo tipas (Halkey-Roberts, Leafield D7 arba Boston), vamzdžio spalva (standartinė arba individuali) ir apykaklės kūgio/kūgio konfigūracija.
      icon: tabler:circle
    - title: Kaladės ir konsolės išdėstymas
      description: Centrinė konsolė, šoninė konsolė arba vairo valdymas. Sėdimų vietų išdėstymas (jockey sėdynės, suoliukai, atraminės sėdynės). Denio danga (putplasčioEVA tikmedžio išvaizda, neslystantys dažai arba plikas GRP). Įrangos tvirtinimo taškai, rankenėlės ir D formos žiedo pozicijos.
      icon: tabler:layout-dashboard
    - title: Elektrika ir navigacija
      description: Navigaciniai žibintai (LED), dugno siurblio sistema, baterijų valdymas, VHF radijo įrengimas, GPS/žemėlapių braižytuvo montavimas, USB įkrovimo lizdai ir jungiklių skydelio konfigūracija.
      icon: tabler:bolt
    - title: Prekės ženklas ir grafika
      description: Korpuso ir vamzdžių grafika (šilkografija, šilumos perdavimas, UV skaitmeninis spausdinimas), logotipų išdėstymas, individualios spalvų schemos, identifikaciniai ženklai ir individuali savininko dokumentacija su jūsų prekės ženklu.
      icon: tabler:palette
    - title: Sauga ir atitiktis
      description: Projektavimo kategorijos įvertinimas (A/B/C/D kiekvienamRCD), gaisro gesinimo sistema, kuro sistemos specifikacija (nešiojamas bakas, fiksuotas bakas, po deniu) ir atitikties dokumentacijos paketas jūsų tikslinei rinkai.
      icon: tabler:shield
content_applications:
  tagline: Programų konfigūracijos
  title: RIB Konfigūracijos<br />Pagal taikymą
  subtitle: Skirtingos misijos reikalauja skirtingų konfigūracijų. Štai patikrintos konfigūracijos dažniausiai naudojamoms RIB programoms.
  items:
    - title: Gelbėjimas ir patruliavimas
      description: Gilus V formos korpusas, Hypalon vamzdžiai, savaime išsitraukiantis denis, papildomos sėdynės, rankenos, navigaciniai žibintai ir sunkiosios D-formos žiedai.RCD Dizaino kategorija B arba C. Ugniai atspari kuro sistema ir komercinės klasės elektros įranga.
      icon: tabler:lifebuoy
    - title: Nardymo palaikymas
      description: Platus bortas, galinės įlaipinimo kopėčios, tankų stovo pozicijos, papildomi D formos žiedai, nardymo vėliavos tvirtinimas, sustiprintas užpakalis dviem išoriniams varikliais ir neslystantis pilno denio EVA uždengimas.
      icon: tabler:mask
    - title: Turizmas ir komercija
      description: Keleivių sertifikuotas išdėstymas su suoliuko sėdimomis vietomis, saulės skėčiu/Bimini, rankenėlėmis, sausa saugykla ir dviguba baterijų sistema.RCD C kategorija. Sukurta kurortinių ir užsakomųjų laivų parkų operacijoms.
      icon: tabler:beach
    - title: Žvejyba
      description: Atvira denio išdėstymas, meškerės laikiklių vietos, gyvo masalo šulinys, žuvų ieškiklio laikiklis, traukimo variklio laikiklis, sustiprintas transomas ir nešiojama kuro sistema. Centrinės arba šoninės konsolės pasirinkimai.
      icon: tabler:fish
    - title: Laisvalaikio ir Jachtų kateriai
      description: Lengvas korpusas, PVC vamzdžiai, patogios sėdynės, teleskopinis vairas arba kompaktiška konsolė, pakėlimo taškai davitui ir nuimamas kuro bakas. RCD Kategorija C arba D.
      icon: tabler:sailboat
    - title: Profesionalus darbų kateris
      description: Aliuminio korpuso pasirinkimas, didelio stiprumo sustiprinimai, hidraulinis vairavimas, komercinės klasės elektros sistema, radarų arka ir įrangos integravimo taškai pagal misiją. Individualus atitikties užtikrinimas pagal projektą.
      icon: tabler:anchor
process_steps:
  title: 7 žingsnių RIB OEM/ODM vystymo procesas
  subtitle: Nuo projekto santraukos iki aptarnavimo po pardavimo — aiškiai apibrėžtas darbo procesas su konkrečiais etapais ir pristatymais
  steps:
    - number: '01'
      title: Projekto santrauka ir reikalavimai
      description: Apibrėžkite tikslinę paskirtį, korpuso dydį, vamzdžių medžiagą, atitikties reikalavimus ir prekės ženklo poreikius. Mes vertiname įgyvendinamumą ir patvirtiname bendradarbiavimo modelį (OEM/ODM/Pusiau užsakoma/Visiškai užsakoma).
      timeline: 3–5 dienos
    - number: '02'
      title: Techninis peržiūrėjimas ir įgyvendinamumas
      description: Inžinerijos komanda peržiūri struktūrinį įgyvendinamumą, stabilumo ir plūdrumo skaičiavimus, atitikties kelią ir medžiagų prieinamumą. Nustatome esamus liejimo formų poreikius arba reikalingas individualias liejimo formas.
      timeline: 5–7 dienos
    - number: '03'
      title: Pasiūlymas ir kainoraštis
      description: Gaukite detalią pasiūlą su specifikacijomis, 3D vizualizacijomis arba bendroji brėžiniais (GA), atitikties ribomis, terminų grafiku ir vieneto kainomis, pagrįstomis kiekybiniais lygiais ir MOQ.
      timeline: 5–7 dienos
    - number: '04'
      title: Dizaino patvirtinimas ir pavyzdžių gamyba
      description: Patvirtinkite galutinį GA, denio išdėstymą ir vamzdžių konfigūraciją. Mes pagaminame priešgamybinį pavyzdį su jūsų prekinio ženklo spalvomis, logotipu ir nurodytomis medžiagomis jūsų fiziniam patikrinimui.
      timeline: 15–20 dienų
    - number: '05'
      title: Pavyzdžio patvirtinimas ir QC protokolas
      description: 'Patikrinkite ir patvirtinkite pavyzdį. Apibrėžkite gamybos QC protokolą: spaudimo testas (1,25x / 24–48 val.), matmenų patikrinimai ir atitikties dokumentacijos kontrolinis sąrašas pagal korpusą.'
      timeline: 3–5 dienos
    - number: '06'
      title: Masinė gamyba ir kokybės kontrolė
      description: Visas gamybos ciklas su 100 punktų QC kontroliniu sąrašu vienetui. Procesų kontrolė, spaudimo testavimas ir serijinė perkamumo atsekamumo. CE/ISO dokumentacija rengiama lygiagrečiai.
      timeline: 30–45 dienos
    - number: '07'
      title: Pakuotė, siuntimas ir aptarnavimas po pardavimo
      description: Individuali pakuotė (standartinė, paruošta pardavimui arba ant padėklų), eksporto dokumentacija, konteinerio pakavimas ir logistika. Įtraukti atsarginių dalių rinkiniai ir priežiūros dokumentacija.
      timeline: 7–14 dienų
certifications:
  title: Atitiktis ir sertifikacija RIB kateriams
  subtitle: Kiekvienas individualus RIB užsakymas siunčiamas su modeliu specifine atitikties dokumentacija
  items:
    - name: CE 2013/53/ES
      description: RCD atitiktis pagal modelį ir dizaino kategoriją — įtraukti DoC, statytojo plokštelė, savininko vadovas
      badge: CE
    - name: ISO 9001:2015
      description: Kokybės vadybos sistema, sertifikuota SGS, apimanti projektavimą, gamybą ir platinimą
      badge: ISO
    - name: EN ISO 6185
      description: Pripučiamų valčių konstrukcijos standartas — stabilumas, plūdrumas ir žmogaus vandenyje atgavimas
      badge: 6185
    - name: LT ISO 14945
      description: Kūrėjo plokštelės standartas — nuolatinė žymė su identifikacijos ir talpos informacija
      badge: 14945
    - name: BSCI
      description: Socialinės atitikties auditas etiškai gaminant — reikalaujama ES mažmenininkų
      badge: BSCI
    - name: REACH
      description: ES chemijos saugos atitiktis PVC, Hypalon, klijams ir dangoms
      badge: REACH
content_service_modules:
  tagline: Paslaugų moduliai
  title: OEM/ODM Paslaugos<br />Moduliai
  subtitle: Kiekvienas projektas sujungia tinkamus paslaugų modulius. Ne kiekvienam projektui reikia visų modulių — mes planuojame tik tai, ko jūsų projektui reikia.
  items:
    - title: Inžinerinė peržiūra ir įgyvendinamumas
      description: 'Korpuso platformos įvertinimas, struktūrinio įgyvendinamumo patikra, stabilumo ir plūdrumo patikrinimas, atitikties kelio identifikavimas ir medžiagų prieinamumo patvirtinimas. Rezultatas: įgyvendinamumo ataskaita su rekomendacija tęsėti ar ne.'
      icon: tabler:math-function
    - title: Projektavimas ir konfigūracija
      description: 'GA brėžinys, denio išdėstymas, vamzdžių konfigūracija, kabinos ir sėdynių pozicijos, įrangos tvirtinimo planas ir spalvų / medžiagų pasirinkimas. Rezultatas: patvirtintas GA ir konfigūracijos specifikacija.'
      icon: tabler:ruler
    - title: Pavyzdys ir prototipas
      description: Priešgamybinis pavyzdys su patvirtintomis spalvomis, logotipu ir nurodytomis medžiagomis fizinei apžiūrai. Įtrauktas pavyzdžio patvirtinimo protokolas, patikros kontrolinis sąrašas ir pakeitimų prašymo procesas.
      icon: tabler:3d-cube-sphere
    - title: Gamyba ir kokybės kontrolė
      description: Masinė gamyba su 100 taškų kokybės kontrolės sąrašu kiekvienai vienetui, proceso metu atliekama patikra, slėgio testavimas (1,25x / 24–48 val.), ir serijinė atsekamumas. CE/ISO dokumentacija paruošta lygiagrečiai.
      icon: tabler:clipboard-check
    - title: Prekės ženklas ir pakavimas
      description: Privataus logotipo pritaikymas, individualios korpuso ir vamzdžių grafikos, dokumentai savininkui su prekės ženklu, pakavimas paruoštas mažmeninei prekybai arba ant palečių, atsarginių dalių rinkinio paruošimas.
      icon: tabler:palette
    - title: Eksportas ir dokumentacija
      description: Eksporto pakavimas, konteinerių pakavimo planas, FOB/CIF/DDP dokumentacija, atitikties dokumentai pagal paskirties rinką ir po pristatymo komunikacijos protokolas.
      icon: tabler:world
content_risk_control:
  tagline: Rizikos ir pristatymo kontrolė
  title: Projektų rizikos ir<br />pristatymo valdymas
  subtitle: Profesionalūs OEM/ODM pirkėjai tiek pat rūpinasi rizikos kontrole, kiek ir produkto kokybe. Štai kaip mes tai valdome.
  items:
    - title: Apimties ir nuosavybės apibrėžimas
      description: 'Prieš pradedant kūrimą, raštu apibrėžiame: pritaikymo apimtį, įrankių reikalavimus, pavyzdinius patvirtinimo kriterijus, brėžinių ir formų nuosavybę bei dokumentacijos atsakomybę. Nėra jokių neaiškumų, kas ką valdo.'
      icon: tabler:file-text
    - title: Pokyčių kontrolės procesas
      description: Visi specifikacijos pakeitimai po projektavimo patvirtinimo vyksta pagal dokumentuotą pakeitimų prašymo procesą su poveikio vertinimu (kaina, terminas, atitiktis). Jokie nepatvirtinti pakeitimai nepatenka į gamybą.
      icon: tabler:arrows-diff
    - title: Partijos nuoseklumo garantija
      description: 50-asis vienetas atitinka pirmąjį patvirtintą pavyzdį. Patvirtintos specifikacijos yra užšaldomos, medžiagos ir proceso parametrai užrakinami, o proceso metu esantys kontroliniai taškai tikrina nuoseklumą visoje gamybos partijoje.
      icon: tabler:repeat
    - title: Pristatymas ir pajėgumų skaidrumas
      description: Pristatymo terminai pateikiami pagal faktinę gamybos apimtį, medžiagų atsargų lygį ir esamą užsakymų krūvį – o ne pagal siekiamus tikslus. Gamybos grafikas su etapais pateikiami kiekvienam užsakymui.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Dažniausiai užduodami klausimai
  questions:
    - q: Kuo skiriasi OEM ODM RIB laivai ir laivai?
      a: 'OEM (Originalios įrangos gamyba): pateikiate detalias specifikacijas, o mes kuriame jūsų dizainą.ODM (Originalus dizainas gamyboje): pasirenkate patikrintą Paddle Board Overstock RIB platformą, kurią pritaikome pagal jūsų pageidaujamas savybes ir prekės ženklą.ODM yra greitesnė ir pigesnė;OEM suteikia maksimalų dizaino valdymą.'
    - q: Ar galiu pritaikyti RIB korpuso formą ir dydį?
      a: Taip. Siūlome pusiau individualias esamų korpuso formų modifikacijas (skirtingi denio išdėstymai, vamzdžių konfigūracijos) ir pilną individualių korpusų kūrimą su naujomis CNCapdirbtomis formomis. Pusiau individualūs projektai gali prasidėti nuo 2–5 vienetų; visiškai individualūs paprastai reikalauja didesnių įsipareigojimų.
    - q: Kokios vamzdžių medžiagos yra prieinamos individualiems RIBsužsakymams?
      a: Siūlome 0,9–1,2 mm plokštę PVC rekreaciniam ir lengvam komerciniam naudojimui, o 1,4–1,7 mm Hypalon/CSM profesinėms, gelbėjimo ir komercinėms reikmėms, kurioms reikalingas išskirtinis UV atsparumas ozonui (10–15 metų tarnavimo laikas prieš 5–8 metusPVC).
    - q: Ar galite konfigūruoti RIBs specifines programas, tokias kaip gelbėjimas, nardymas ar žvejyba?
      a: Taip. Mes palaikome patikrintus konfigūracijos šablonus gelbėjimo/patruliavimo, nardymo palaikymo, turizmo/užsakomųjų, žvejybos, jachtų aptarnavimo ir profesionalių darbo valčių taikymams. Kiekviename šablone pateikiamas rekomenduojamas korpuso tipas, vamzdžių medžiaga, denio išdėstymas ir įranga – kurią vėliau pritaikome pagal jūsų konkrečius poreikius.
    - q: Kokios informacijos jums reikia RIB OEMpasiūlymui /ODM pasiūlymui?
      a: Tikslinė paskirtis, pageidaujamas korpuso ilgis, vamzdžio medžiagos pasirinkimas (PVCarba Hypalon), apytikslis kiekis ir pristatymo grafikas, tikslinės rinkos atitikties reikalavimai bei bet kokie etaloniniai produktai ar specifikacijos. Kuo daugiau detalių pateiksite, tuo greitesnis ir tikslesnis bus mūsų pasiūlymas.
    - q: Kas yra MOQ pritaikytoms RIB valtims?
      a: Esamoms korpuso formoms su standartinėmis modifikacijomis MOQ pradžia yra 2–5 vienetai vienam projektui. Individualioms formoms ir visiškai individualiam vystymui MOQ priklauso nuo projekto sudėtingumo – paprastai 10–20 vienetų pusiau individualiems ir 30 visiškai+ pritaikytiems su naujais įrankiais.
    - q: Kas valdo individualias formas ir brėžinius?
      a: Formos, sukurtos naudojant Paddle Board Overstock bazinius dizainus Paddle Board Overstock , lieka nuosavybe. Visiškai individualios formos, užsakytos ir apmokėtos kliento, gali būti perduotos kliento nuosavybei pagal sutarties sąlygas. Visos formos nuosavybės sąlygos dokumentuojamos prieš pradedant projektą.
    - q: Kaip individualiai RIBs supakuoti eksportui?
      a: 'Standartas: individuali lopšio + tempiamoji plėvelė konteinerių pakrovimui. Premium: tinkama mažmeninei prekybai, vakuuminė pakuotė arba paletė. Siūlome FOB Qingdao, CIF, ir DDP siuntimą. Pilna eksporto dokumentacija ir muitinės patvirtinimas įskaičiuoti.'
