        description: Didmeninės kainos visiems SUP lentoms, baidarėms, RIBs ir aksesuarams
      - title: Skirtas sąskaitų vadybininkas
        description: Vienas kontaktinis asmuo užsakymams, pagalbai ir produktų informacija
      - title: Rinkodaros medžiagos
        description: Produktų nuotraukos, specifikacijų lapai, bukletai ir skaitmeninės medžiagos jūsų kalba
      - title: Logistikos palaikymas
        description: Siuntų koordinavimas, muitinės dokumentacija ir sandėlio pristatymas
      - title: Mėginių programa
        description: Nuolaidžiamos mėginių užsakymų kainos salonų ekspozicijoms ir platintojų demonstracijoms
    cta_text: Pateikite paraišką partnerystei
    cta_href: /contact
  - title: Premium platintojo paketas
    subtitle: Patyrusiems platintojams, turintiems daugialypį šalių aprėptį
    badge: Best Value
    features:
      - title: Pakopinės kainos
        description: Kainų lygiai pagal apimtį su ketvirčio grąžinimo programomis
      - title: Išskirtinė teritorija
        description: Apsaugotos distribucijos teisės jūsų regionui ar šaliai
      - title: Tiesioginio pristatymo programa
        description: Jūsų klientams pristatoma tiesiai iš mūsų sandėlių su jūsų ženklu
      - title: Privataus ženklinimo paslaugos
        description: Pilnas OEM/ODM palaikymas jūsų pačių prekių ženklui — lentos, valtis ir aksesuarai
      - title: Prioritetinė pagalba
        description: 48 valandų atsakymo garantija, paskirtas logistikos koordinatorius ir skubūs užsakymai
    cta_text: Atsinaujinti partnerystę
    cta_href: /contact
  - title: Pagrindinis platintojas
    subtitle: Skirta didelio masto regioniniams ir nacionaliniams platintojams
    badge: Enterprise
    features:
      - title: Strateginė partnerystė
        description: Bendras verslo planavimas, rinkos plėtros lėšos ir bendros rinkodaros programos
      - title: Individualus produktų kūrimas
        description: Išskirtiniai produktų dizainai ir specifikacijos jūsų rinkai
      - title: Vietinis sandėlio palaikymas
        description: Inventoriaus konsignacija, vietinių atsarginių dalių atsargos ir regioninio aptarnavimo centro įrengimas
      - title: Platintojų tinklo palaikymas
        description: Mokymo programos, sertifikavimo kursai ir platintojų paieškos integracija
      - title: Metinis partnerių susitikimas
        description: Strategijos susitikimai, produktų peržiūra ir tinklo kūrimas su pasauliniais partneriais
    cta_text: Išnagrinėkite pagrindinę partnerystę
    cta_href: /contact
benefits:
  - title: Tiesioginė prieiga prie gamintojo
    description: Be tarpininkų. Jūs dirbate tiesiogiai su fabriku, kuris projektuoja, inžineruoja ir gamina kiekvieną produktą.
    icon: tabler:building-factory
  - title: Konkurencingos maržos
    description: Didmeninės kainos su kiekybinėmis nuolaidomis, nuolaidų programomis ir apsaugotomis teritorijomis.
    icon: tabler:coin
  - title: Rinkodaros palaikymas
    description: Profesionalūs produktų ištekliai, lokalizuoti lankstinukai ir bendrai ženklintos rinkodaros kampanijos.
    icon: tabler:chart-bar
  - title: Logistikos partnerystė
    description: Koordinuotas siuntimas, muitinės palaikymas ir vietiniai sandėlių variantai, kad sumažintumėte logistikos išlaidas.
    icon: tabler:truck-delivery
content_segments:
  tagline: Partnerių profiliais
  title: Platinimo partnerystės modeliai<br />Pagal partnerio tipą
  subtitle: Skirtingi platintojai turi skirtingus rinkos pasiekimų pranašumus – regioninę infrastruktūrą, elektroninės prekybos pasiekiamumą, specializuotą mažmeninę prekybą ar daugialypius prekių portfelius. Mes struktūrizuojame partnerystės sąlygas, kainų lygius ir palaikymo lygį pagal kiekvieno partnerio profilį.
  items:
    - title: Regioniniai jūrų platintojai
      subtitle: Teritorijos išskirtinė B2B platinimas
      description: Įsitvirtinę platintojai su sandėlių infrastruktūra, platintojų tinklais ir logistikos galimybėmis, aptarnaujantys jūrų platintojus, vandens sporto mažmenininkus ir nuomos operatorius tam tikroje geografinėje teritorijoje. Jums reikalinga pilna produktų linija, apsaugotos kainos ir galimybė aptarnauti platintojų sąskaitas su vietinėmis atsargomis ir palaikymu.
      features:
        - Išskirtinė teritorijos apsauga su minimaliomis įsipareigojimų sąlygomis
        - Pilno katalogo didmeninės kainos su ketvirtinėmis apimčių nuolaidomis
        - Vietinės atsargų konsignacijos programa greitai judantiems SKU
        - Prekybininkų tinklo mokymai ir bendros prekės ženklo rinkodaros programos
    - title: El. prekyba ir internetiniai mažmenininkai
      subtitle: Skaitmeninėms platformoms pirmiausia skirtos paskirstymo kanalai
      description: Internetiniai mažmenininkai, parduodantys vandens sporto įrangą per Amazon, eBay ar savo el. prekybos platformas. Greitas pateikimas į rinką, konkurencingos kainos ir tiesioginės logistikos vartotojui yra kritiniai. Jums reikia partnerio, galinčio pristatyti individualius užsakymus pagal jūsų prekės ženklą su greitu vykdymu ir nulinės atsargos rizika.
      features:
        - 'Drop-ship programa: tiesioginis gamyklos vykdymas su jūsų ženklu'
        - Realaus laiko atsargų API tiekimas jūsų el. prekybos platformai
        - Amazon Seller Central integracija su EAN/UPC palaikymu
        - Grąžinimų logistika ir garantinių reikalavimų tvarkymas įtrauktas
    - title: Specializuoti vandens sporto mažmenininkai
      subtitle: Fizinės parduotuvės partneriai
      description: Fizinės mažmeninės parduotuvės, specializuojančios vandens sporto įrangoje – aptarnaujančios vietinius buriuotojus, žvejus ir laivininkus su tiesioginiais pardavimais, demonstracijomis ir po pardavimo aptarnavimu. Jums reikia mažmeninei prekybai optimizuotų pakuočių, demonstracinių vienetų programų ir pardavimo vietos medžiagų, kurios konvertuoja atėjusius klientus.
      features:
        - 'Demonstracinio vieneto programa: nuolaidos parodymams salone'
        - Mažmeninėms parduotuvėms paruošta pakuotė su lentynos optimizavimu
        - Pardavimo vietos stendai, palyginimo lentelės ir pirkėjo gidas
        - Personalizuotų parduotuvės darbuotojų mokymai ir sertifikavimo programa
    - title: Multi-prekių ženklų ir universalinių parduotuvių platintojai
      subtitle: Plačiapranslinė sporto prekių platinimas
      description: Didelio masto platintojai, aptarnaujantys universalines parduotuves, didžiųjų parduotuvių tinklus ir sporto prekių prekybos tinklus su multi-prekių katalogais. Nuoseklumas, atitikties dokumentacija ir tiekėjo atitiktis yra būtini – kiekvienas SKU turi atitikti specifikus mažmenininko pakuotės, etikečių ir kokybės standartus.
      features:
        - 'Mažmenininko atitikties dokumentacija: pakuotės specifikacijos, brūkšninis kodas, etiketės'
        - EDI/ASN integracija su pagrindinėmis mažmeninės prekybos užsakymų sistemomis
        - Tiekėjo valdomų atsargų ir automatinio papildymo programos
        - Dedicated account management su 24 valandų atsako SLA
