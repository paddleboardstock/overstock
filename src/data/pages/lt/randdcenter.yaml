rd_services:
  tagline: Individuali tyrimų ir plėtros veikla
  title: Tyrimų ir plėtros paslaugos partneriams
  services:
    - title: Individualių medžiagų kūrimas
      desc: Mes kuriame individualias audinių formules, laminatų sluoksnius ir klijų sistemas, pritaikytas jūsų eksploatacinei aplinkai ir našumo tikslams.
    - title: OEM / ODM Produktų inžinerija
      desc: Nuo koncepcijos eskizų iki gamybai paruoštų inžinerinių paketų — mūsų komanda gali projektuoti, kurti prototipus ir patvirtinti laivus pagal jūsų prekės ženklą.
    - title: Trečiųjų šalių bandymai ir sertifikavimas
      desc: Naudokite mūsų ISO atitinkančias bandymų patalpas nepriklausomam medžiagų testavimui, produktų patikrinimui ir sertifikavimo pagalbai.
  cta: Aptarkite savo tyrimų ir plėtros reikalavimus →
  cta_link: /contact
vision:
  tagline: Mūsų vizija
  title: Formuojant vandens sporto ateitį
  body: Aquafarer siekia vadovauti pripučiamų valčių ir SUP pramonei per nuolatinę inovaciją, nepalaužiamą kokybę ir tvirtą įsipareigojimą saugumui bei tvarumui — galutinai praturtinant vandens sporto entuziastų patirtis visame pasaulyje. Aquafarer MTPI centras yra vieta, kur aistra susitinka su inovacija, nustatant naujus standartus vandens sporto pramonėje.
labs_section:
  tagline: Laboratorija
  title: Mūsų laboratorijos
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Audinių Laboratorija
      description: Nuolatiniai PVC ir Hypalon vamzdinių audinių tyrimai ir bandymai dėl tempimo stiprumo, UV atsparumo, trinčiai ir lankstumo esant žemai temperatūrai, siekiant užtikrinti ilgalaikį patikimumą jūrų aplinkoje.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Heilo inžinerijos studija
      description: CAD pagrindu atliekamas HDPE, aliuminio ir stiklo pluošto korpusų projektavimas bei galutinių elementų analizė. Kiekvienas korpusas skaitmeniniu būdu simuliuojamas dėl įtempių paskirstymo ir smūgiams atsparumo dar prieš pirmojo prototipo sukūrimą.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF suvirinimo centras
      description: Specializuota radijo dažnių suvirinimo įranga su tikslia temperatūros ir slėgio kontrole, gaminanti didelio stiprumo, sandarias siūles, atitinkančias jūrinės pramoginės įrangos standartus pripučiamiems valtims.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hidrodinaminis bandymų rezervuaras
      description: Mastelio modelio bandymai mūsų paties bandymų talpykloje siekiant optimizuoti korpuso formą, sklendimo savybes, stabilumą ir kuro efektyvumą esant įvairiam krūtims ir jūros sąlygoms.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototipų dirbtuvės
      description: Pilno masto prototipų gamybos ir įrengimo įrenginių, kuriuose kuriami, montuojami ir atliekami jūrų bandymai nauji modeliai. Kiekvienas prototipas praeina bent 20 valandų trukmės vandens bandymų programą prieš patvirtinimą gamybai.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Kokybės ir tikrinimo laboratorija
      description: Specializuota kokybės užtikrinimo laboratorija, atliekanti tempimo testus, oro sulaikymo ciklus, siūlių atplėšimo testus ir medžiagų sertifikavimą, siekiant užtikrinti, kad kiekviena iš dirbtuvės išleidžiama valtis atitiktų mūsų paskelbtas specifikacijas.
      href: /randdcenter/quality-inspection-lab
