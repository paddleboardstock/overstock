hero:
  tagline: MTEP centras
  title: Mokslinių tyrimų ir plėtros centras
  subtitle: Sutelktas į pažangą
intro:
  - Aquafarer tyrimų ir plėtros (R&D) centras yra pagrindinė jėga, vedanti mūsų misiją revoliucionizuoti vandens sporto įrangą. Mes suteikiame vandens sporto entuziastams visame pasaulyje saugesnius, patogesnius ir malonesnius produktus per nenutrūkstamą inovaciją pripučiamuose stovėjimo irklavimo lentose (SUPs) bei valtyse. Mūsų atsidavusi inžinierių, dizainerių ir aistringų vandens sporto ekspertų komanda formuoja pramonės ateitį, nuolat keliaudama kokybės, našumo ir tvarumo standartus.
  - Mūsų MTEP centras sujungia medžiagų mokslininkus, laivų architektus ir gamybos inžinierius po vienu stogu. Nuo audinio formulės ir korpuso modeliavimų iki sujungimo proceso kūrimo ir pilno masto jūrų bandymų, kiekvienas produkto kūrimo etapas grindžiamas duomenimis ir patvirtinamas testavimu.
mission:
  tagline: Mūsų misija
  title: Inovacijos vandens sporto ateityje
  pillars:
    - icon: lightning
      title: Technologinė pažanga
      desc: Naujoviškų medžiagų, dizainų ir gamybos diegimas, siekiant užtikrinti aukštesnę produktų našumą ir ilgaamžiškumą.
    - icon: design
      title: Vartotojui orientuotas dizainas
      desc: Giliai suprasti ir viršyti vartotojų poreikius per ergonomišką ir intuityvų produktų dizainą.
    - icon: globe
      title: Tvariosios praktikos
      desc: Mažinant mūsų poveikį aplinkai naudojant ekologiškas medžiagas ir procesus.
    - icon: shield
      title: Nesuderinama sauga
      desc: Užtikrinant aukščiausius saugumo standartus griežtu testavimu ir sertifikavimu.
pillars:
  - title: Technologinė pažanga
    desc: Inovatyvių naujų medžiagų, dizainų ir gamybos procesų kūrimas siekiant užtikrinti aukštesnę produktų kokybę ir ilgaamžiškumą.
    icon: tech
  - title: Pažangiosios medžiagos
    desc: Tyrinėjami pažangiausi PVC, Hypalon, kompozitai ir tvarios alternatyvos siekiant pagerinti produkto savybes.
    icon: materials
  - title: Tvarumas
    desc: 'Esminis įsipareigojimas: Mes esame įsipareigoję aplinkos apsaugai per tvarią gamybą ir perdirbamas medžiagas.'
    icon: sustainability
capabilities:
  tagline: Galimybės
  title: MTTP pajėgumai
  subtitle: Keturi pagrindiniai dalykai, suteikiantys mums visapusišką kontrolę per produktų kūrimą — nuo žaliavų tyrimų iki galutinės sertifikacijos.
  groups:
    - title: Medžiagų mokslas ir audinių technologija
      items:
        - PVC ir Hypalon formulės analizė ir optimizavimas
        - UV stabilizavimas, atsparumo ugniai ir antimikrobinių priedų kūrimas
        - Daugiasluoksnės audinio laminavimo ir sukibimo inžinerija
        - Pagreitinto senėjimo testavimas (UV, temperatūros, drėgmės, druskos purškimo)
    - title: Korpusų inžinerija ir hidrodinamika
      items:
        - Parametrinis 3D korpuso projektavimas ir CFD optimizavimas
        - Galutinių elementų analizė struktūriniams ir smūgio apkrovoms
        - Mastelio modelių tramplino bandymai ir našumo patikrinimas
        - Individualių korpusų kūrimas specialioms misijoms
    - title: Suvirinimo ir sujungimo technologijos
      items:
        - RF dielktrinės suvirinimo proceso kūrimas ir optimizavimas
        - Karšto oro, karšto pleišto ir ultragarso suvirinimo metodai
        - Klijų jungimo ir siūlių juostos kvalifikacija
        - Suvirinimų stiprumo modeliavimo ir eksploatacijos trukmės prognozavimas
    - title: Bandymai, sertifikavimas ir atitiktis
      items:
        - Kokybės valdymas ir CE atitikties bandymai
        - Nepriklausomas trečiųjų šalių bandymas ir sertifikavimo pagalba
        - Individualių bandymų protokolų kūrimas pirkimų kvalifikacijai
        - Eksploatacijos metu kilusių gedimų analizė ir priežasties nustatymas
