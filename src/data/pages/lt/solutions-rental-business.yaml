testimonial:
  content: Aš nuomodavausi 5 lentas iš vietinės parduotuvės ir praradau 60 % savo pajamų jiems. Aquafarer padėjo man sukurti savo 15 SUPs flotilę. Pateiktas ROI skaičiuoklis parodė, kad atsipirksiu per 4 mėnesius — iš tikrųjų prireikė 3. Dabar aš plečiu iki 30 lentų ir pridedu kajakus.
  name: Danielis Okonkvo
  title: Savininkas, Lakeland SUP Nuoma — Ontario, Kanada
content_segments:
  tagline: Nuomos profiliai
  title: Vandens sporto įrangos nuomos sprendimai<br />Pagal operatoriaus tipą
  subtitle: Skirtingos nuomos veiklos turi skirtingus poreikius – nuo mažų paplūdimio SUP nuomų iki didelio masto kurortų vandens sporto centrų. Mes atitinkamai pritaikome mūsų įrangos paketus ir palaikymo modelį.
  items:
    - title: Paplūdimio ir ežero pakrantės SUP nuoma
      subtitle: Didelio tūrio, mažos sudėtingumo operacijos
      description: Operatoriai, kurie nuomoja stovimus irklavimo lentas bei baidares tiesiog paplūdimio lankytojams ir ežero svečiams. Jūsų prioritetas yra minimizuoti nuomos laiką tarp klientų, išlaikyti įrangos judėjimą ir valdyti sezoninius paklausos šuolius, turint mažą sandėliavimo plotą.
      features:
        - Pripučiamų SUP laivynų, kurie susideda plokščiai – nereikia dokų ar priekabos
        - Komercinės klasės PVC, skirta 100+ nuomos ciklams per sezoną
        - Greitai džiūstantis, UV atsparus audinys, tinkamas pakartotiniam išnuomojimui tą pačią dieną
        - Spalvotai koduotų lentelių diapazonai patogiam laivyno atpažinimui
    - title: Poilsio ir viešbučių vandens sporto centrai
      subtitle: Svečių patirtis ir prekės ženklo atitikimas
      description: Kurortai ir viešbučiai, teikiantys vandens sporto galimybes vietoje. Įranga turi atrodyti prabangi, patikimai veikti nuo pradedančiųjų iki vidutinio lygio svečių ir integruotis į kurorto esamas veiklų užsakymo ir atsiskaitymo sistemas.
      features:
        - Individualiai ženklinti SUP lentos ir gelbėjimosi liemenės, atitinkančios kurorto spalvas
        - 'Įvairi įranga: SUPs, kajakai, pedalų valtys ir mažos RIB pagalbinės valtis'
        - Tylūs, be kuro, elektriniai pripūtimo sprendimai paplūdimyje
        - Įtraukta personalo mokymo ir priežiūros programa
    - title: Valčių ir RIB nuomos operatoriai
      subtitle: Komercinės klasės laivų nuomos flotilės
      description: Operatoriai, nuomojantys varomus laivus — RIB pagalbines valtis, pripučiamas valtis ir mažus greitaeigius laivelius — valandoms arba pusei dienos. Jūsų flotilė turi atitikti jūrų saugumo reikalavimus, atlaikyti intensyvų svečių naudojimą ir sumažinti mechaninį prastovų laiką tarp nuomų.
      features:
        - RIB paketai su 30–90 HP paruoštomis išoriniams varikliams užpakalinėmis dalimis
        - Jūrų klasės faneros grindų plokštės ilgalaikei struktūrinei tvirtumui
        - Greito paleidimo vožtuvų sistemos spartesniam eksploatavimui
        - Atsarginių detalių rinkinys +, techninės pagalbos SLA pagal poreikį
    - title: Ekskursijų ir nuotykių operatoriai
      subtitle: Gidų vedamų ekskursijų flotilės
      description: Operatoriai, organizuojantys vadovaujamas vandens sporto ekskursijas — SUP safarius, urvų kajaką, nardymo su vamzdeliu išvykas arba salų turus RIB. Įranga turi būti pakankamai stabili pradedantiesiems turistams, greitai valoma tarp grupių ir pakankamai patvari kasdieniam vadovaujamam naudojimui įvairiomis vandens sąlygomis.
      features:
        - Ypač stabilios SUP platformos (32" pločio+) pradedantiesiems
        - Tandeminiai kajakai porų / grupinių ekskursijų konfigūracijoms
        - Įmontuota transportavimo talpa nardymo įrangai, sausoms kuprinėms ir aušintuvams
        - CE + USCG atitikties dokumentacija komercinėms operacijoms
