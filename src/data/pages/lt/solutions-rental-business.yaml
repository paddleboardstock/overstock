hero:
  tagline: Nuomos verslo sprendimai
  title: Sukurti pelningą vandens sportą<br />Nuomos verslas su Aquafarer
  subtitle: Pilni nuomos parkų paketai SUP klubams, paplūdimio kurortams, ežerų operatoriams ir vandens sporto centrams — nuo įrangos parinkimo iki parko valdymo ir priežiūros palaikymo.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-paddle-girls-team.webp
    alt: Aquafarer vandens sporto nuomos flotilė veiksme
direct_answer: Aquafarer teikia visapusiškus nuomos verslo sprendimus vandens sporto operatoriams. Nuo pradedantiesiems tinkamų SUP laivyno vienetų iki komercinės klasės RIB nuomos, mes padedame pasirinkti tinkamą įrangą, optimizuoti laivyno dydį jūsų vietovėje, sumažinti techninės priežiūros prastovas ir padidinti pajamų iš vienos nuomos rodiklius. Mūsų nuomai patikrinti produktai pasižymi komercinės klasės PVC konstrukcija, lengvu taisymu ir pripučiamu dizainu, kuris pašalina sandėliavimo sąnaudas. Nesvarbu, ar pradedate naują nuomos verslą, ar atnaujinate esamą laivyną, Aquafarer suteikia įrangą ir ekspertizę, kad sukurtumėte pelningą vandens sporto nuomos verslą.
solution_offerings:
  - title: Transporto priemonių pradžios rinkinys
    subtitle: Naujoms nuomos operacijoms, testuojant rinką
    badge: Popular
    features:
      - title: Laivyno vertinimas
        description: Ekspertų analizė apie jūsų vietą, svečių demografiją ir pajamų tikslus, siekiant įvertinti jūsų automobilių parką
      - title: Pradinė įranga
        description: 10 SUP lentų su irklentėmis, pompomis, gelbėjimosi liemenėmis ir remonto rinkiniais – viskas, ko reikia paleisti
      - title: Sandėliavimo sprendimai
        description: Pripučiamą įrangą galima susukti plokščiai — laikymui nereikia nei prieplaukos, nei priekabos
      - title: Saugos atitiktis
        description: Visa įranga CE sertifikuota komercinio lygio konstrukcijai, skirta kasdienai nuomai
      - title: Pradmenų rinkodara
        description: Prekės ženklo fotografijos ištekliai ir nuomos meniu šablonai, padedantys jums pristatyti savo paslaugą
    cta_text: Pradėti nuomos parką
    cta_href: /contact
  - title: Flotilės plėtros rinkinys
    subtitle: Veiklos plėtrai didinant pajėgumus ir įvairovę
    badge: Premium
    features:
      - title: Mišrios flotilės dizainas
        description: SUPs, kanojų, pripučiamų valtis ir RIBs derinys, skirtas patenkinti įvairius svečių pageidavimus
      - title: Tūrio kainodara
        description: Sluoksniuota didmeninė kainodara 20+ vienetų flotilėms su privilegijuotomis logistikos kainomis
      - title: Individualus prekės ženklas
        description: Logotipo spausdinimas ant įrangos, firminiai gelbėjimosi liemenės ir individualios spalvų parinktys jūsų nuomos parkui
      - title: Priežiūros programa
        description: Atsarginių dalių rinkinys, personalo remontavimo mokymai ir tiesioginė prieiga prie techninės pagalbos
      - title: Pajamų optimizavimas
        description: Duomenimis pagrįstos rekomendacijos dėl kainodaros, įrangos apsikeitimo ir sezoninių transporto priemonių parko koregavimų
    cta_text: Plėsti Mano Flotilę
    cta_href: /contact
