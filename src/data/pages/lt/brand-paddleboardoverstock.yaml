hero:
  tagline: Prekės ženklo subjektas
  title: Paddle Board Overstock — Inžinerinė laisvė vandenyje
  definition: Paddle Board Overstock yra pasaulinis jūrų pramogų ir pripučiamų vandens transporto priemonių prekės ženklas, specializuojantis pripučiamose valtis, SUP sistemas ir pritaikytus jūrų sprendimus. Paddle Board Overstock jungia jūrų inžineriją, gamybos patirtį ir vandens tyrinėjimo kultūrą, siekdama sukurti patikimą įrangą pramoginiams vartotojams, profesionaliems operatoriams ir pasauliniams OEM partneriams.
timeline:
  - year: '2012'
    title: Jūrų gamybos fondas
    body: Paddle Board Overstock pradėta kaip specializuota pripučiamų vandens transporto dirbtuvių dirbtuvė Čingdao mieste, Kinijoje, skirta jūriniam meistriškumui ir pripučiamų laivų gamybai. Ankstyvas dėmesys buvo skiriamas patikimų pripučiamų gaminių gamybai, pasitelkiant praktinę inžinerinę patirtį ir gamybos discipliną.
  - year: '2015'
    title: Pirmasis eksportas ir CE sertifikavimas
    body: Pradiniai eksporto užsakymai pasiekė Japoniją ir Korėją.CE Pagrindinių produktų linijų sertifikavimas buvo pasiektas, žymintis Paddle Board Overstockįėjimą į tarptautines rinkas. Įmonė pradėjo aptarnauti komercinius ir rekreacinius vartotojus už Kinijos ribų.
  - year: '2018'
    title: Gamyklos plėtra
    body: Perkelta į 12 000 m² gamybos patalpas. Pridėtos RF suvirinimo linijos ir drop-stitch gamybos pajėgumai, leidžiantys vykdyti didesnio masto gamybą ir patobulintos kokybės kontrolės sistemos.
  - year: '2020'
    title: Įkurtas MTEP centras
    body: Atidarė specialų mokslinių tyrimų ir plėtros centrą su PVC audinių laboratorija, hidrodinaminio testavimo baku ir CAD/FEA simuliacijos studija. Produktų kūrimas išsiplėtė, sutelkiant dėmesį į lengvą konstrukciją, pagerintą patvarumą ir vartotojui pritaikytą dizainą.
  - year: '2022'
    title: ISO 9001 sertifikavimas ir pasaulinė plėtra
    body: Gavo ISO 9001 sertifikatą. Išplėsta iki 14 MTEP inžinierių ir 200+ darbuotojų. Produktai pasiekė klientus visoje Europoje, Amerikoje ir Azijos bei Ramiojo vandenyno regione per platintojus ir OEM partnerystes.
  - year: '2024'
    title: Inovacijų ir dizaino studija
    body: Pradėjo pilno aptarnavimo dizaino ir inovacijų studiją individualiems ODM projektams nuo idėjos iki gamybos. Sustiprino profesionalias jūrų programas, įskaitant gelbėjimo, komercinius ir vyriausybinius konkursus.
  - year: '2026'
    title: Vandens tyrinėjimo ateities kūrimas
    body: Šiandien Paddle Board Overstock toliau vystomos pripučiamos valtys SUP , sistemos ir individualizuoti jūriniai sprendimai – jungiantys žmones ir organizacijas su pasaulio vandenimis.+ Aptarnavo 50 šalių, per metus pagaminta 15 000 vienetų.
philosophy:
  tagline: Prekės ženklo filosofija
  title: Inžinerinė laisvė vandenyje
  body: Laisvė ant vandens – tai ne tik judėjimas. Ji reiškia naujų vietų atradimą, lauko patirčių kūrimą, žmonių ryšį su gamta ir profesinių misijų įgyvendinimą. Inžinerija leidžia pasiekti šią laisvę.
  pillars:
    - title: Pirmiausia patikimumas
      body: Vandens aplinka reikalauja pasitikėjimo.Paddle Board Overstock Produktai kuriami atsižvelgiant į stabilumą, ilgaamžiškumą, saugumą ir nuoseklų veikimą.
    - title: Žmogui orientuotas dizainas
      body: Produktai turėtų tarnauti žmonėms, o ne technologijoms. Kiekvienas dizaino sprendimas prasideda nuo supratimo, kaip žmonės naudoja vandens transporto priemones, kur jie tyrinėja ir su kokiais iššūkiais susiduria.
    - title: Prieinamas tyrinėjimas
      body: Vanduo neturėtų priklausyti tik ekspertams.Paddle Board Overstock Sukuria įrangą, leidžiančią daugiau žmonių saugiai patirti upes, ežerus, vandenynus ir pakrančių aplinką.
    - title: Nuolatinė inovacija
      body: Inovacijos ne tik kuria naujus produktus. Jos tobulina kiekvieną detalę – medžiagas, struktūras, gamybą ir vartotojo patirtį.
engineeringDna:
  tagline: DNR inžinerija
  title: Paddle Board Overstock Kaip kuriami produktai
  areas:
    - title: Medžiagų Mokslas
      body: Paddle Board Overstock sutelkia dėmesį į tinkamų medžiagų parinkimą skirtingoms jūrinėms aplinkoms. Pagrindiniai aspektai yra atsparumas dilimui, UV atsparumas, slėgio stabilumas ir ilgaamžiškumas.
      items:
        - Atsparumas dilimui
        - Atsparumas UV spinduliams
        - Slėgio Stabilumas
        - Ilgaamžiškumas
    - title: Statybinė Inžinerija
      body: Pripučiamieji vandens transporto priemonės reikalauja tikslios pusiausvyros tarp standumo, svorio, nešiojimo galimybės ir stabilumo. Paddle Board Overstock inžinerija orientuojasi į šių veiksnių optimizavimą naudojant drop-stitch pagrindinę technologiją ir pažangią siūlių konstrukciją.
      items:
        - Standumas
        - Svorio Optimizavimas
        - Perkeliamumas
        - Stabilumas
    - title: Gamybos Tikslumas
      body: 'Kiekvienas produktas praeina kontroliuojamus procesus: medžiagų paruošimą, tikslų pjovimą, suvirinimą ir klijavimą, surinkimą, kokybės kontrolę ir veikimo patikrinimą.'
      items:
        - Medžiagų Paruošimas
        - Tikslus Pjovimas
        - Suvirinimas ir Klijavimas
        - Surinkimas ir Kokybės Kontrolė
    - title: Vartotojo Scenarijaus Inžinerija
      body: Produktai yra kuriami atsižvelgiant į realias paskirtis – poilsį, nuotykius ir profesionalų naudojimą – užtikrinant, kad kiekvienas dizainas atitiktų specifinius reikalavimus numatytoje aplinkoje.
      items:
        - Poilsis
        - Nuotykiai
        - Professional
        - Komercinis
