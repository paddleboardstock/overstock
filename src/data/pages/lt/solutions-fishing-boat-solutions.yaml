content_challenge:
  tagline: Iššūkis
  title: Žvejybos valčių poreikiai<br />Stabilumas, nuotolis ir patvarumas
  subtitle: Nesvarbu, ar valdote komercines žvejybos valtis, valdyti kooperatyvo laivyną, ar vykdote žvejybos ekskursijas — jūsų valtis turi patikimai veikti kasdien.
  paragraphs:
    - Žvejybos valtys reikalauja stabilios platformos linijoms traukti, laimikio tvarkymui ir saugiam judėjimui deniu. Pripučiamieji ir RIBs suteikia natūralią stabilumą dėl vamzdžių konstrukcijos — tai didelis pranašumas prieš panašaus ilgio standžias laivų korpusus.
    - Kuro efektyvumas svarbus žvejybos operacijose, kur veiklos sąnaudos tiesiogiai veikia pelningumą. RIBs ir pripučiamieji laivai yra lengvesni už atitinkamus standžius laivus, reikalauja mažiau galios ir degina mažiau kuro — kritiškai svarbu komerciniams operatoriams, kurie vykdo valčių eksploatavimą kasdien, ir kooperatyvams tvarkant biudžetus.
    - Patvarumas jūrų aplinkoje yra esminis. Druskingas vanduo, UV poveikis ir nuolatinis naudojimas reikalauja medžiagų, kurios gali atlaikyti sunkius sąlygas be degradacijos. Komercinių ir kooperatyvinių operatorių patikimumas tiesiogiai veikia pajamas — sulūžusi valtis reiškia prarastas žvejybos dienas.
    - Aquafarer žvejybos konfigūracijos apima meškerių laikiklius, echoskopus, masalų skyrius, gyvų žuvų talpas ir krovinio tvarkymo sprendimus, skirtus rimtoms žvejybos programoms komercinėje, kooperatyvinėje ir rekreacinėje veikloje.
content_solution:
  tagline: Mūsų sprendimas
  title: Žvejybai pasiruošusios konfigūracijos
  subtitle: Kiekviena Aquafarer žvejybos valtis gali būti paruošta pagal jūsų konkrečias žvejybos reikmes.
  list:
    - Meškerių laikiklių montavimas — gamyklinis arba paruoštas aftermarket montavimui
    - Echoskopo/GPS montavimo plokštė konsolės pozicijoje
    - Masalų skyrius arba gyvos žuvies talpas nuomos ir komerciniams operatoriams
    - Šaldymo/ saugojimo konfigūracijos laimikio tvarkymui
    - Deep-V korpusas užpakaliniam veikimui — stabilus ramybės būsenoje, lygus dideliu greičiu
    - PVC arba Hypalon vamzdelių pasirinkimai — Hypalon ilgesniam UV ekspozicijos laikui
    - Išoriniai varikliai svyruoja nuo 15 HP iki 115, HP priklausomai nuo modelio ir taikymo
content_segments:
  tagline: Žvejybos profiliai
  title: Pripučiamų žvejybinių valčių sprendimai<br />Pagal operatoriaus tipą
  subtitle: Nuo pakrantės sportinės žvejybos iki komercinio ilgųjų meškerių žvejybos – skirtingos žvejybos operacijos reikalauja skirtingos korpuso konfigūracijos, galios diapazonų ir denio įrangos. Kiekvieną valtį pritaikome prie žvejybos, vandenų ir darbo stiliaus.
  items:
    - title: Komercinės žvejybos įmonės
      subtitle: Laivyno darbo valtys kasdienėms žvejybos operacijoms, tinklų tvarkymui, laimikio transportavimui
      description: Komercinės žvejybos įmonės eksploatuoja darbo valtis tinklų klojimui ir ištraukimui, spąstų priežiūrai, ilgųjų linijų traukimui ir laimikio transportavimui. Šie laivai kasdien dirba sūriame vandenyje ir turi atlaikyti didelius krovinius, nuolatinį denio tvarkymą ir ilgas darbo valandas. Kuro efektyvumas ir mažas priežiūros lygis yra kritiškai svarbūs laivyno pelningumui. Laivas turi užtikrinti stabilias darbo platformas įgulos įrangai ir laimikiui įvairiomis jūros sąlygomis.
      features:
        - Plokščio denio išdėstymas tinklų tvarkymui, spąstų krovimui ir žuvų laikymui
        - Ekonomiškas 40-115 HP išorinis variklis su mažomis dienos eksploatavimo sąnaudomis
        - Tvirti Hypalon vamzdeliai kasdieniam naudojimui atsparūs trintims
        - Sustiprintos trinančios lentos dažnam kontaktui su prieplauka ir laivu
        - Savaime išsitraukiantis denis lengvam plovimui po eksploatacijos
        - Laivyno kainos ir nuoseklios specifikacijos daugialaiviams
    - title: Užsakomosios žvejybos operatoriai
      subtitle: Daugiakeleivis komfortas, bagažo valdymas, saugos sertifikatas
      description: Operatoriai vykdo pusės dienos ir visos dienos žvejybos užsakymus – nuo pakrantės rifų žvejybos iki dugninės žvejybos. Jūsų laivui reikia keleivių sėdimų vietų su saugumo sertifikatais, pakankamai vietos keliems žvejams ir integruotais gyvaisiais šuliniais, kad masalas ir laimikis būtų švieži visos kelionės metu. Svečių komfortas tiesiogiai veikia kelionių apžvalgas, pakartotinius užsakymus ir internetinius įvertinimus.
      features:
        - Konsolinis vairavimas su amortizuojančiomis sportinėmis sėdynėmis
        - Gamykloje montuojami strypų laikikliai (4–8 padėtys)
        - 60–115 išorinis HP nuotolis jūriniam kruiziniam greičiui
        - CE C arba B kategorijos sertifikavimas komerciniams keleiviniams traukiniams
        - Bimini arba T-top saulės skydelis svečių patogumui ilgesnėse kelionėse
    - title: Amatininkų ir smulkaus masto komerciniai žvejai
      subtitle: Patikimi darbo laivai kasdieniam pragyvenimui
      description: Nepriklausomi žvejai, kurie pagrindinį pajamų šaltinį naudoja savo valtį – tinklų klojimą, žuvų spąstų priežiūrą ar meškerių tvarkymą prie kranto. Jūsų prioritetas – kuro taupymas, paprasta priežiūra, kurią galite atlikti patys, ir valtis, kuri galėtų priimti vidutinį kiekį laimikio ir įrangos, neprarandant stabilumo.
      features:
        - Ekonomiškas 15–40 išorinis variklis HP su mažomis eksploatacinėmis sąnaudomis
        - Hypalon CSM Vamzdeliai ilgesniam UV ir trinties atsparumui
        - Plokščio denio išdėstymas tinklų tvarkymui ir žuvų laikymui
        - Lengva išsilaipinimo galimybė paplūdimyje su pripučiama kilio apsauga
    - title: Žvejybos kooperatyvai
      subtitle: Laimikio surinkimas, narių transportavimas, tiekimo paskirstymas
      description: Žvejybos kooperatyvai valdo bendruomeninius laivynus, skirtus sugauti iš narių žvejų, gabenti atsargas į atokias žvejų bendruomenes ir paskirstyti laimikį rinkoms. Šiems darbo laivams reikalinga didelė krovinio talpa, patikimas kasdienis veikimas ir lengva priežiūra atokiose vietovėse. Kooperatyvai dažnai veikia besivystančiuose regionuose, kur dalių prieinamumas ir aptarnavimo galimybės yra ribotos, todėl būtinos paprastos išorinės konfigūracijos ir patvari konstrukcija.
      features:
        - Didelė krovinio talpa laimikiui ir atsargoms gabenti
        - Paprasta išorinė konfigūracija patogiam aptarnavimui vietoje
        - Sunkieji PVC arba Hypalon statybiniai, kad būtų lankstesnis biudžetas
        - Plokščias denis su tvirtinimo taškais kroviniui pritvirtinti
        - Ekonomiška veikla, mažinanti bendradarbiavimo veiklos sąnaudas
    - title: Sporto ir medžioklės žvejybos entuziastai
      subtitle: Rezultatai ir stilius rimtiems žvejams
      description: Patyrę žvejai ieško pajėgios žvejybos platformos, kuri užtikrintų greitį tolimose vietovėse, stabilias stovėjimo pozicijas ir aukščiausios kokybės užbaigimą. Valtis turi jaustis kaip namuose, nesvarbu, ar plaukia dvi mylias nuo kranto iki rifo, ar tyrinėja atokias estuarijos užkampio vietas.
      features:
        - Deep-V RIB korpusas sklandžiam važiavimui banguojant
        - Žuvies ieškiklio/GPS tvirtinimo plokštelė iš anksto prijungta prie konsolės
        - Baitwell ir aušintuvas integruoti į galinės sėdynės modulį
        - Individualios EVA denio spalvų parinktys, atitinkančios valties/vamzdžio grafiką
    - title: Žvejybos gidas ir ekoturizmo operatoriai
      subtitle: Žvejybos patirtys su gidu atvykstantiems žvejams
      description: Gidai veda mažas žvejų grupes į produktyvias žvejybos vietas – dažnai derindami žvejybą su ekoturizmo elementais, tokiais kaip paukščių stebėjimas ar mangrovių tyrinėjimas. Valtis turi būti sausa ir patogi svečiams, nepratusiems prie mažų valčių, su lengvu įlipimu ir pavėsiu.
      features:
        - Gamykloje sumontuoti Bimini arba T-top tvirtinimo taškai
        - Sklandžios įlaipinimo kopėčios lengvam pakartotiniam įlipimui
        - Tylus 4 taktų išorinis variklis, siekiant sumažinti trikdžius
        - Sausos sandėliavimo vietos svečių telefonams, piniginėms, fotoaparatams
