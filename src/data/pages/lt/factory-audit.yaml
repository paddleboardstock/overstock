hero:
  tagline: Gamyklos auditas ir įrodymai
  title: Gamyklos audito paruošimas<br />& Kokybės įrodymai
  subtitle: Viską, ką B2B pirkėjai patikrina gamyklos vizito metu – nuo gamybos autentiškumo ir atitikties dokumentų iki gamybos sekamumo ir kokybės kontrolės sistemų. Auditui paruošti kasdien.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock Gamyklos audito paruošimas ir kokybės įrodymai
direct_answer: Paddle Board Overstock prižiūri auditui paruoštą 12 000 m² Qingdao gamyklą su dokumentuotais kokybės kontrolės procesais, medžiagų sekamumu, HIN lygio gamybos įrašais ir atitikties dokumentais kiekvienam korpusui. Vietoje ir virtualios gamyklos ekskursijos kvalifikuotiems pirkėjams.
