  - value: 100%
    label: Slėgio testavimas
    detail: Kiekvienas vienetas, 1,25x / 24-48 val.
  - value: HIN
    label: Kiekvieno korpuso sekamumas
    detail: Pilni partijos iki pristatymo įrašai
content_priorities:
  tagline: Ką klientai tikrina
  title: 8 dalykai, kuriuos pirkėjai patikrina<br />Kiekvieno gamyklos apsilankymo metu
  subtitle: Remiantis 50+ šalių pirkėjų atsiliepimais, tai yra aštuoni prioritetai, kuriuos klientai įvertina prieš B2B pateikdami užsakymą.
  items:
    - title: Tikras gamintojas
      description: 'Ar jūs esate tikroji gamykla, o ne prekybos įmonė? Pirkėjų patikrinimas: verslo subjektas, tikra gamybos įranga, darbuotojai, valdantys mašinas, esami gamybos užsakymai ir svetainės bei dirbtuvių nuoseklumas.'
      icon: tabler:building-factory
    - title: Produkto pritaikymas taikymui
      description: Ar jie RIB atitinka jų specifinį naudojimo atvejį? Kurortų, gelbėjimo, nardymo, žvejybos ir patrulių operatoriai turi iš esmės skirtingus reikalavimus. Pirkėjai vertina denio išdėstymą, vamzdžių medžiagas ir įrangos pasirinkimus eksponuojamame laive.
      icon: tabler:target
    - title: Kokybės stabilumas ir atkuriamumas
      description: Ar 50-asis vienetas toks pat geras kaip pirmasis? Pirkėjai tikrina kokybės kontrolės sistemas, proceso kontrolės punktus, neatitikimų tvarkymą ir prašo peržiūrėti įrašus iš kelių gamybos partijų, kad patikrintų nuoseklumą.
      icon: tabler:repeat
    - title: Atitikties dokumento autentiškumas
      description: Ar CE sertifikatai priklauso nuo modelio? Ar DoC pasirašo tikras asmuo? Ar atitiktį galima patikrinti pagal korpuso numerį? Pirkėjai tikrina bendrus reikalavimus, o ne modelio specifinius dokumentus.
      icon: tabler:file-certificate
    - title: Individualizavimo vykdymas
      description: Ar gamykla iš tiesų gali pateikti individualias konfigūracijas? Pirkėjai ieško įrodymų apie ankstesnius individualius projektus, eksponuojamų prototipų pavyzdžių, inžinerinių brėžinių ir galimybės aptarti techninius pakeitimus vietoje.
      icon: tabler:adjustments
    - title: Pristatymo laikas ir talpa
      description: 'Ar nurodyti terminai yra realistiški? Pirkėjai vertina: esamą gamybos apimtį, turimą pajėgumą, darbuotojų skaičių, medžiagų atsargas ir ar gamykloje yra gamybos planavimo sistema.'
      icon: tabler:clock
    - title: Kaina ir prekybos sąlygos
      description: 'Ar kainos yra skaidrios? Ar FOB kainos aiškios? Pirkėjai tikrina: vieneto kainos suskirstymą, įrankių gamybos kaštus, pakavimo išlaidas ir ar gamykla gali tvarkyti DDP ar CIF sudaryti sąlygas su tinkama eksporto dokumentacija.'
      icon: tabler:currency-dollar
    - title: Po pardavimo ir atsarginės dalys
      description: 'Kas vyksta po pristatymo? Pirkėjai vertina: atsarginių dalių prieinamumą, garantijos procesą, vamzdžių pakeitimo sekcijas, vožtuvų keitimą ir ar gamykla turi dokumentuotą po pardavimo protokolą.'
      icon: tabler:headset
content_tour:
  tagline: Gamyklos ekskursijos maršrutas
  title: Audito turas —<br />Ką pamatysi
  subtitle: Mūsų standartinė gamyklos ekskursija seka apibrėžtą maršrutą, skirtą atsakyti į pirkėjų klausimus kiekvienoje stotyje.
  items:
    - title: 1. Susitikimų kambarys — įmonės pristatymas
      description: Verslo licencija, ISO 9001 ir BSCI sertifikatai, eksporto licencijos bei įmonės istorija. Trumpa gamybos galimybių ir atitikties apimties apžvalga.
      icon: tabler:users
    - title: 2. Žaliavų sandėlis — IQC stotis
      description: Gaunamų medžiagų patikros įrašai, audinių partijų sertifikatai, klijai ir furnitūros pavyzdžiai. Prieš pradedant gamybą sužinokite, kaip testuojamos medžiagos.
      icon: tabler:building-warehouse
    - title: 3. Vamzdžių gamyba — RF suvirinimas ir rankinis klijavimas
      description: Gyvo vamzdžio suvirinimo ar klijavimo procesas, siūlės stiprumo bandymų demonstracijos ir vožtuvų montavimas. Stebėkite kamerų konstrukciją ir kokybės patikros punktus.
      icon: tabler:flame
    - title: 4. Korpuso laminavimas — GRP dirbtuvės
      description: Stiklo pluošto klojimo procesas, gelcoat tepimas ir korpuso kietinimas. Žiūrėkite laminavimo grafiką ir konstrukcinį sutvirtinimą skirtingiems RIB modeliams.
      icon: tabler:layers-subtract
    - title: 5. Surinkimas ir integracija
      description: Korpuso vamzdžių sujungimas, konsolės ir sėdynių montavimas, elektros ir kuro sistemų integracija bei įrangos montavimas. Stebėkite gamybos liniją veikiančią.
      icon: tabler:tool
    - title: 6. Slėgio bandymų stotis
      description: 24–48 valandų slėgio laikymo testas esant 1,25 karto didesniam slėgiui. Peržiūrėkite bandymų įrašus, slėgio matuoklius ir praėjo/nepraėjo kriterijus. Žiūrėkite, kaip testų rezultatai susieti su korpuso serijiniais numeriais.
      icon: tabler:gauge
    - title: 7. Galutinė apžiūra ir kokybės kontrolė
      description: 100 punktų kokybės kontrolinis sąrašas vienetui, matmenų patikra, kosmetinė apžiūra ir pakuotės vientisumo patikra. Peržiūrėkite neatitikimų žurnalus ir korekcinių veiksmų įrašus.
      icon: tabler:clipboard-check
    - title: 8. Dokumentų peržiūros kambarys
      description: Atitikties dokumentacija pagal modelį (DoC, gamintojo plokštelė, savininko vadovas), gamybos sekamumo įrašai, HIN registras ir medžiagų partijų sekimo duomenų bazės demonstracija.
      icon: tabler:folder
content_qc_chain:
  tagline: Kokybės įrodymai
  title: 8 etapų QC grandinė<br />— Patikrinama kiekviename žingsnyje
  subtitle: Mūsų kokybės kontrolės grandinė apima nuo atvykstančių medžiagų iki galutinio išsiuntimo, su dokumentuotais įrodymais kiekviename etape.
  items:
    - title: '1 etapas: Įeinančių medžiagų inspekcija'
      description: Kiekviena PVC, Hypalon, stiklo pluošto, aliuminio, klijų ir furnitūros partija yra tikrinama pagal specifikacijas prieš pradedant gamybą. Tempimo stiprumas, dangos sukibimas ir matmenų patikrinimai pagal AQL 2,5/ISO2859.
      icon: tabler:package
    - title: '2 etapas: vamzdžių suvirinimas / klijavimo kokybės kontrolė'
      description: Siūlės stiprumo testavimas kiekvienai gamybos partijai. RF suvirinimo parametrai stebimi ir fiksuojami. Rankomis klijuotos siūlės tikrinamos dėl tolygaus klijavimo dangos ir kietėjimo laiko.
      icon: tabler:flame
    - title: '3 etapas: korpuso laminavimo kokybės kontrolė'
      description: Gelcoat storio matavimas, stiklo pluošto sluoksnio patikra pagal laminavimo grafiką ir kietėjimo laiko stebėjimas. Struktūrinio pastiprinimo pozicijos patikrintos pagal inžinerinius brėžinius.
      icon: tabler:layers-subtract
    - title: '4 etapas: Surinkimo ir integracijos kokybės kontrolė'
      description: Korpuso vamzdžio jungties vientisumas, konsolės ir sėdynės tvirtinimo sukimo momentas, elektros tęstinumas ir kuro sistemos nuotėkio testas. Kiekvienas montavimo taškas buvo patikrintas pagal modelio specifinį surinkimo kontrolinį sąrašą.
      icon: tabler:tool
    - title: '5 etapas: Slėgio laikymo testas'
      description: Kiekviena pripučiama kamera buvo pripūsta iki 1,25 karto, PSI įvertinta ir laikyta 24–48 valandas. Slėgio kritimas užfiksuotas kiekvienoje kameroje. Užfiksuotas praėjo/nepraėjo slenkstis. Susieta su korpuso serijos numeriu.
      icon: tabler:gauge
    - title: '6 etapas: Galutinė apžiūra'
      description: 100 punktų kokybės kontrolinis sąrašas, apimantis matmenų tikslumą, kosmetinį apdailą, priedų pilnumą, dokumentacijos paketą ir pakuotės vientisumą. Nepriklausomas nuo gamybos komandos.
      icon: tabler:clipboard-check
    - title: '7 etapas: Atitikties dokumentacija'
      description: Modelio specifinis DoC, gamintojo plokštelių patikra, naudotojo vadovo pilnumas ir HIN registro įvedimas. Visi atitikties dokumentai paruošti ir patikrinti prieš išsiuntimą.
      icon: tabler:file-certificate
    - title: '8 etapas: Siuntos atlaisvinimas ir atsekamumas'
      description: Galutiniam leidimui reikia įveikti visus kokybės kontrolės etapus, užbaigti atitikties dokumentus ir patvirtinti siuntimo dokumentus. Korpuso įrašas uždarytas ir archyvuotas 10+ metų saugojimui.
      icon: tabler:truck
content_traceability:
  tagline: Gamybos atsekamumas
  title: HIN → pagrindinis failas →<br />Korpuso rekordinis → pristatymas
  subtitle: Kiekvienas RIB laivas turi unikalų korpuso identifikacijos numerį, susietą su pilna gamybos ir atitikties įrašų grandine.
  items:
    - title: Korpuso identifikacinis numeris (HIN)
      description: 14 simbolių unikalus identifikatorius, nuolat pažymėtas kiekviename laive. Koduoja gamintojo kodą (MIC), modelio žymėjimą, gamybos metus ir serijos numerį. Raktas, atrakinantis visą atsekamumo grandinę.
      icon: tabler:hash
    - title: Pagrindinis techninis failas
      description: Modelių šeimos atitikties ir inžinerinė dokumentacija. Apima bendrosios aviacijos brėžinius, rizikos vertinimą, stabilumo skaičiavimus, medžiagų specifikacijas ir taikomus standartus. Susieta su visais to modelio korpusais.
      icon: tabler:folder
    - title: Individualus korpuso rekordas
      description: 'Kiekvieno korpuso gamybos įrašas: HIN, gamybos data, vamzdžių partija, medžiagų sertifikatai, slėgio bandymų rezultatas, galutinė konfigūracija, variklio specifikacijos, kokybės kontroliniai rezultatai ir pristatymo tikslas. 21+ duomenų laukas kiekvienam korpusui.'
      icon: tabler:file-description
    - title: Klientų atitikties paketas
      description: Kiekvienam korpusui skirtas pristatymo paketas, įskaitant DoC, gamintojo plokštės nuotrauką, naudotojo vadovą, atitikties kontrolinį sąrašą ir galutinės konfigūracijos lapą. Išsiųstas kartu su laivu ir archyvuotas gamykloje 10+ metų.
      icon: tabler:package
content_red_flags:
  tagline: Audito spąstai
  title: Įspėjamieji pirkėjai<br />Lengvai atpažįstama
  subtitle: Dažnos problemos, kurios mažina pirkėjų pasitikėjimą gamyklų auditų metu. Mes proaktyviai sprendžiame kiekvieną iš jų.
  items:
    - title: Bendros CE pretenzijos be modelio apimties
      description: '"Visi produktai CE sertifikuoti" nenurodant, kuri direktyva, kokie modeliai ir kuris atitikties modulis. Raudona vėliava: rodo, kad atitiktis yra paviršutiniška, o ne pagal modelį ar konfigūraciją.'
      icon: tabler:alert-triangle
    - title: Nėra fizinių bandymų įrodymų
      description: 'Slėgio testų teiginiai be testų įrašų, matuoklių ar bandymų stoties, matomos gamyklos grindyse. Raudona vėliava: kokybės teiginiai negali būti patikrinti vizito metu.'
      icon: tabler:alert-triangle
    - title: Trūkstamos medžiagos atsekamumas
      description: 'Nėra partijų įrašų, nėra gaunamos inspekcijos ar ryšio tarp medžiagų sertifikatų ir gatavų produktų. Įspėjamasis ženklas: nėra galimybės susieti kokybės problemas su šaltiniu.'
      icon: tabler:alert-triangle
    - title: Bendroji dokumentacija
      description: 'Vienas DoC, apimantis visus modelius, be HIN specifinių įrašų ar "šabloninių" atitikties dokumentų. Raudona vėliava: atitiktis nėra susieta su atskirais gamybos vienetais.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Siuntimas ir pakuotė
  title: RIB Valties konteineris<br />Įkrovimas ir dėžės
  subtitle: Mūsų siuntimo sprendimai apsaugo jūsų investiciją iš Čingdao į paskirties uostą. Konteinerių pakrovimo planai ir dėžių specifikacijos prieinamos kiekvienam modeliui.
  items:
    - title: 20 pėdų konteinerių konfigūracijos
      description: 'Standartinis 20 pėdų konteineris: 1–2 RIB valtys (4,0–5,5 m), išdėstytos viena ant kitos, denis ir vamzdžiai atskirti, arba 8–12 SUP lentų. Galimos mišrios RIB + SUP konfigūracijos. Išsamus pakrovimo planas pateikiamas kiekvienam užsakymui.'
      icon: tabler:box
    - title: 40 pėdų konteinerių konfigūracijos
      description: 'Standartinis 40 pėdų konteineris: 2–4 RIB laivai (iki 7,0 m) su korpusais ir vamzdžiais sukrauti, arba 20–30 SUP lentų. 40 pėdų būstinė skirta aukštesniems RIB modeliams. Optimizuotas pakavimas sumažina siuntimo vienetui kainą.'
      icon: tabler:container
    - title: Medinės dėžės RIB korpusams
      description: Aliuminio ir GRP korpusai supakuoti specialiai pritaikytose medinėse dėžėse su putų paminkštinimu, drėgmės barjeru ir plieninėmis juostomis. Dėžių matmenys ir svoris pagal modelį prieinami logistikos planavimui. ISPM-15 terminio apdorojimo medienos sertifikavimas įskaičiuotas.
      icon: tabler:wood
    - title: Vamzdinių ir denio atskyrimo pakavimas
      description: Vamzdeliai buvo išleidžiami ir sulankstomi atskirai nuo korpusų, kad būtų efektyviau vietoje. Denio plokštės, konsolės ir sėdynės buvo supakuotos apsauginiu apvalkalu kartu su tvirtinimo įrangos rinkiniais. Surinkimo instrukcijos buvo įtrauktos į kiekvieną siuntą.
      icon: tabler:package
    - title: Apsauga nuo drėgmės ir korozijos
      description: VCI antikorozinis popierius aliuminio komponentams, silikagelio drėgmės kaupiklių paketams ir vakuumu sandarinamiems aparatiniams maišams. Apsaugo nuo kondensato pažeidimų per 30–45 dienų kelionę jūra.
      icon: tabler:droplet-off
    - title: FOB Qingdao dokumentacija
      description: Krovinio važtaraštis, komercinė sąskaita, pakavimo sąrašas, kilmės pažymėjimas ir atitikties dokumentai kiekvienam siuntiniui. FCL ir LCL konsolidavimas prieinamas. Muitinės dokumentų palaikymas ES, JAV ir Artimųjų Rytų rinkoms.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Patikros įrodymai
  title: Audito įrodymai<br />Galite patikrinti vietoje
  subtitle: Gamyklų vizitų metu klientai gali patikrinti konkrečius įrodymus kiekvienoje gamybos zonoje. Štai į ką atkreipti dėmesį – ir ką ruošiame kiekvienam auditui.
  areas:
    - area: Žaliavų sandėlis
      what_to_verify: Ar medžiagos yra stabilios? Ar vyksta maišymas partijomis?
      evidence: Gaunamos inspekcijos įrašai, partijų etiketės, FIFO saugojimas, tiekėjų patvirtinimo sąrašas, medžiagų sertifikatai (PVC, Hypalonstiklo pluoštas, aliuminis, klijai, furnitūra)
      icon: tabler:building-warehouse
    - area: Vamzdžių gamyba
      what_to_verify: Kaip užtikrinamas siūlės tvirtumas ir sandarumas?
      evidence: Procesų kortelės, pirmojo straipsnio patvirtinimas, slėgio bandymų įrašai pagal kamerą, remonto ir pakartotinio testavimo žurnalai, vožtuvų montavimo įrašai
      icon: tabler:flame
    - area: Korpuso gamyba
      what_to_verify: Kaip kontroliuojamas struktūrinis nuoseklumas?
      evidence: Kontroliuojamų procesų dokumentai, kokybės patikros punktai, pusgaminių numeracija, gelcoat storio matavimai, laminavimo grafiko patikra
      icon: tabler:layers-subtract
    - area: Surinkimo zona
      what_to_verify: Kaip pasirenkamos dalys gali būti apsaugotos nuo neteisingo surinkimo?
      evidence: BOM, darbo užsakymai, konfigūracijos kontroliniai sąrašai, darbo vietos apžiūros kortelės, sukimo momento ir funkciniai patikrinimai pagal modelį
      icon: tabler:tool
    - area: Bandymų stotis
      what_to_verify: Kaip patvirtinate, kad valtis yra tvarkinga prieš pristatymą?
      evidence: Testavimo procedūros, instrumentų sąrašas, kalibravimo įrašai, slėgio testų žurnalai (1,25x / 24-48 val.), funkcinių bandymų kontroliniai surašai, dokumentuoti išlaikymo/nepraėjimo kriterijai
      icon: tabler:gauge
    - area: Neatitikimo zona
      what_to_verify: Kaip sprendžiami defektai?
      evidence: Izoliacijos etiketės, NCR žurnalai, pagrindinių priežasčių analizė, pertvarkymo patvirtinimo įrašai, CAPA (korekcinių ir prevencinių veiksmų) stebėjimas
      icon: tabler:alert-triangle
    - area: Baigtų prekių sandėlis
      what_to_verify: Kaip išvengti neteisingo siuntimo ir žalos?
      evidence: Baigtų produktų etiketės, užsakymų atitikimo įrašai, pakuotės standartai, priešsiuntinės patikros įrašai
      icon: tabler:box
    - area: Atsarginės dalys ir po pardavimo
      what_to_verify: Ar galite palaikyti ilgalaikį post-pardavimą?
      evidence: Dažniausios atsarginių dalių sąrašas, atsargų strategija, dalių numeravimo sistema, garantinių procesų dokumentacija, priežiūros pamokos
      icon: tabler:headset
content_closing_script:
  tagline: Auditas pagal užsakymą
  title: Iš "Factory Visit"<br />Patvirtintam projektui
  subtitle: Sėkmingas auditas neturėtų baigtis nuotraukomis ir rankos paspaudimu. Prieš išeidami užtikriname, kad būtų užfiksuoti trys komerciniai rezultatai.
  items:
    - title: Patvirtinti techninę konfigūraciją
      description: Sutarkite dėl modelio, taikymo, pagrindinių pasirinkimų, tikslinės rinkos, numatomo kiekio ir pristatymo grafiko – visa tai dokumentuota prieš išvykimą.
      icon: tabler:checklist
    - title: Patvirtinti kito žingsnio dokumentus
      description: 'Apibrėžkite, kas Paddle Board Overstock pateikiama toliau: atnaujintas GA, konfigūracijos sąrašas, citata, dokumentų kontrolinis sąrašas, pavyzdinis planas arba NDA – su konkrečiais terminais.'
      icon: tabler:file-plus
    - title: Patvirtinti abipusę laiko juostą
      description: Atnaujinta konfigūracija ir preliminari sąmata per 3 darbo dienas. Pavyzdžio ar išvaizdos patvirtinimas per 7 dienas. Inžinerinė peržiūra arba trečiosios šalies apžiūra per 14 dienų. Kito posėdžio data ir atsakingos šalys užrakintos.
      icon: tabler:calendar
faq:
  title: Gamyklos auditas — dažniausiai užduodami klausimai
  questions:
    - q: Ar galiu apsilankyti gamykloje asmeniškai?
      a: Taip. Laukiame gamyklų auditų mūsų 12 000 m² plote Čingdao. Mūsų standartinė ekskursija apima 8 stotis nuo žaliavų sandėlio iki dokumentų peržiūros kambario. Pradiniam kvalifikavimui taip pat siūlomos virtualios gamyklos ekskursijos vaizdo skambučiais.
    - q: Ar priimate trečiųjų šalių auditus (BSCI, SMETA)? SGS
      a: Taip. Mes palaikome BSCI sertifikatus (Intertek) ir sveikiname klientui pritaikytus audito protokolus. Taip pat galime SGS TÜV organizuoti patikrinimus pagal užklausą. Audito ataskaitos prieinamos pagal NDA.
    - q: Ar vizito metu galiu pamatyti slėgio testus?
      a: Mūsų slėgio bandymų stotis yra standartinio ekskursijos maršruto dalis. Priklausomai nuo gamybos grafiko, galite stebėti aktyvius slėgio bandymus su matuoklių rodmenimis ir bandymų įrašais. Slėgio bandymų žurnalai kiekvienam korpusui visada prieinami peržiūrai.
    - q: Kaip tvarkotės su neatitinkančiais produktais?
      a: Neatitinkantys vienetai yra atskiriami, dokumentuojami ir peržiūrimi pagal mūsų ISO 9001 korekcinių veiksmų procesą. Atliekama pagrindinių priežasčių analizė, įgyvendinami korekciniai veiksmai ir tvarkomi įrašai. Pirkėjai gali peržiūrėti mūsų NCR žurnalą audito metu.
    - q: Kokia atitikties dokumentacija yra prieinama peržiūrai?
      a: 'Audito metu galite peržiūrėti: modeliui būdingus DoC pavyzdžius, gamintojo plokštelių specifikacijas, HIN registrą, savininko vadovo juodraščius, taikomų standartų sąrašus ir atitikties vertinimo įrašus pagal modelių šeimą.'
    - q: Kaip užsisakyti virtualią gamyklos ekskursiją?
      a: Susisiekite su mūsų pardavimų komanda, kad suplanuotumėte tiesioginę vaizdo ekskursiją per WhatsApp, Zoom ar Teams. Laikomės to paties 8 stočių maršruto ir galime susitelkti į konkrečias vietas pagal jūsų interesus. Įprasta virtuali ekskursija trunka 45–60 minučių.
    - q: Ar gamykla yra tikrasis gamintojas, ar prekybos įmonė?
      a: Paddle Board Overstock yra tikrasis gamintojas. Mes valdome gamyklą Laixi, Qingdao. Verslo licencija, gamybos apimtis ir fizinė gamyba yra patikrinamos audito metu.
    - q: Kokius kokybiškus įrašus galiu peržiūrėti?
      a: Gaunamų medžiagų patikros įrašai, proceso kokybės kontrolės patikros punktai, slėgio bandymų žurnalai, 100 punktų galutinės patikros kontroliniai sąrašai, atitikties ataskaitos, korekcinių veiksmų įrašai ir kiekvieno korpuso atsekamumo įrašai. Visi palaikomi pagal ISO 9001 reikalavimus.
