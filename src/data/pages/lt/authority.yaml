hero:
  tagline: Autoriteto centras
  title: Kodėl Aquafarer?<br />Pasitikėjimas, sukurtas per dešimtmetį
  subtitle: Kiekviena valtis, kurią mes statome, neša 10+ metų jūrinės inžinerijos, sertifikuotų kokybės sistemų ir tūkstančių sėkmingų operacijų visame pasaulyje svorį. Todėl pramonės profesionalai renkasi Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer jūrų gamybos įrenginys ir inžinerijos komanda
stats:
  title: Aquafarer pagal skaičius
  stats:
    - title: Veiklos metai
      amount: Nuo 2012 m
    - title: MTEP inžinieriai
      amount: 50+
    - title: Aptarnaujamos šalys
      amount: 50+
    - title: Įranga pristatyta
      amount: 15,000+
features3_brand:
  tagline: Kas mes esame
  title: Prekės ženklo pagrindas<br />ir paveldas
  subtitle: Istorija, žinios ir pasaulinis pasiekiamumas, kurie apibrėžia Aquafarer kaip patikimą jūros įrangos gamintoją.
  isBeforeContent: false
  columns: 3
  items:
    - title: Apie Aquafarer
      description: Įkurta 2012 m. Qingdao mieste, Kinijoje. Nuo pakrantės dirbtuvių iki 12 000 m² ploto įrenginio — visa Aquafarer istorija.
      icon: tabler:building-factory
      link: /about
    - title: Prekės ženklo istorija
      description: Kaip jūrų inžinierių komanda siekė padaryti profesionalius pripučiamus vandens laivus prieinamus visame pasaulyje.
      icon: tabler:book
      link: /brand-story
    - title: Jūrų pramonės ekspertizė
      description: Gilus medžiagų mokslas, preciziška gamyba ir praktiniai bandymai — dešimtmečių jūrų inžinerija kiekvienoje korpuso dalyje.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Tarptautinė pristatymo apimtis
      description: Aptarnaujame 50+ šalių visuose žemynuose. Regioninė ekspertizė vietos reguliavimo reikalavimams ir rinkos pageidavimams.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Kodėl Aquafarer
      description: Kas mus išskiria — kokybė, pritaikymas pagal užsakymą, tiesioginė gamyklos kaina ir visalaikis palaikymas komerciniams operatoriams.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Mūsų komanda
      description: Susipažinkite su vadovybe — jūrų inžinieriais, medžiagų mokslininkais ir gamybos ekspertais, kurie verčia Aquafarer judėti į priekį.
      icon: tabler:users
      link: /brand/team
    - title: Inžinerijos komanda
      description: 78+ bendros MTEP metų, 40+ platformų, 12 sertifikatų, 1200+ OEM projektų. Techninė komanda už kiekvieno produkto.
      icon: tabler:engine
      link: /engineering-team
    - title: MTEP centras
      description: Korpuso inžinerija, RF suvirinimas, PVC laboratorija, prototipų kūrimas, bandymų bakas ir kokybės laboratorija – mūsų pilnas mokslinių tyrimų ir plėtros centras.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Pasitikėjimas ir kokybė
  title: Sertifikatai, kokybė<br />& Įrodymas
  subtitle: Nepriklausomi sertifikatai, griežti testai ir tikri įrodymai, rodantys mūsų įsipareigojimą kokybei.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifikatai
      description: CE, ISO 9001, UKCA, BSCI, REACH — pilna sertifikavimo dokumentacija ir atitiktis pasaulinėms rinkoms.
      icon: tabler:shield-check
      link: /certifications
    - title: Kokybė ir testavimas
      description: Kiekvienas produktas buvo patikrintas slėgyje prieš išsiunčiant. Siūlės stiprumas, UV pasipriešinimas, plūdrumas – patikrinti kiekviename etape.
      icon: tabler:clipboard-check
      link: /quality
    - title: Įrodymai ir įrodymai
      description: Testų rezultatai, diegimo nuotraukos, trečiųjų šalių inspekcijos ataskaitos ir atvejų analizės, patvirtinančios Aquafarer kokybę.
      icon: tabler:file-check
      link: /evidence
    - title: Žinių grafikas
      description: Išnagrinėkite Aquafarer subjektų grafiką – produktus, technologijas, sertifikatus ir ryšius susietoje žinių bazėje.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vadovybė
  title: Susipažinkite su komanda<br />Už nugaros Aquafarer
  subtitle: Pramonės ekspertizė, apimanti jūrų inžineriją, medžiagų mokslą, kokybės valdymą ir pasaulinę B2B prekybą.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — įkūrėjas ir generalinis direktorius
      description: 15+ metų jūrų gamyboje. Anksčiau vadovavo MTEP didelėje Kinijos laivų gamykloje. Turi kelis patentus pripučiamų laivų projektavime.
      icon: tabler:crown
    - title: Zhang Wei — vyriausiasis inžinierius
      description: 20+ metų patirties PVCgamybojeHypalon ir gilios V formos korpuso projektavime. Buvęs techninis direktorius Europos jūrų inžinerijos įmonėje.
      icon: tabler:engine
    - title: Chen Ming — R&D vadovas
      description: Medžiagų mokslo daktaro laipsnis. Specializuojasi drop-stitch technologijose ir aukšto dažnio suvirinime. 10+ metų darbo tekstilės kompozituose.
      icon: tabler:flask
    - title: Liu Qiang — gamybos direktorius
      description: 18+ metų "lean" gamyboje. Six Sigma juodasis diržas. Įdiegta ISO 9001 kokybės sistema visose gamybos linijose.
      icon: tabler:settings
    - title: Wang Fang — kokybės vadovas
      description: 12+ metų jūrų kokybės kontrolėje. Sertifikuotas CE ir ISO auditorius. Prižiūri kiekvienos gamybos partijos testavimą.
      icon: tabler:shield-check
    - title: Helen Lee — pardavimų direktorė
      description: 15+ metų tarptautinės B2B prekybos srityje. Valdė OEM/ODM partnerystes 30+ šalių. Laisvai kalba 4 kalbomis.
      icon: tabler:briefcase
cta:
  title: Norite patikrinti mūsų prisijungimo duomenis?
  subtitle: Susisiekite su mumis dėl sertifikatų kopijų, trečiųjų šalių patikrinimo ataskaitų arba norėdami suplanuoti gamyklos vizitą.
  actions:
    - variant: primary
      text: Prašyti įgaliojimų
      href: /contact
    - text: Peržiūrėti sertifikavimo duomenis
      href: /certifications
