direct_answer: Aquafarer Siūlo atstovybių ir platinimo partnerystes su teritorijos apsauga, konkurencingomis didmeninėmis kainomis, rinkodaros palaikymo rinkiniais ir pilna atitikties dokumentacija (CE, ISO 9001, BSCI).MOQ Pradžia – 10–20 vienetų už užsakymą su specialiu paskyros valdymu.
