content_benefits:
  tagline: Partnerystės privalumai
  title: Kodėl platintojai<br />pasirenka Aquafarer
  subtitle: Partnerystė, skirta jūrų platintojams, kuriems reikalingas patikimas tiekimas, konkurencingos pelno maržos ir profesionali pagalba.
  items:
    - title: Teritorijos apsauga
      description: Išskirtinės arba pusiau išskirtinės teritorijos teisės kvalifikuotiems platintojams. Rinkos žemėlapių sudarymas ir kanalų konfliktų valdymas, siekiant apsaugoti jūsų investicijas į Aquafarer prekės ženklo kūrimą savo regione.
      icon: tabler:map-pin
    - title: Konkurencinga didmeninė kainodara
      description: Kainodara pagal metinius apimties įsipareigojimus. Maržos apsauginė kainodaros struktūra su išankstinėmis kainų garantijomis ir skaidriu sąnaudų suskirstymu (FOBQingdao pagrindas).
      icon: tabler:currency-dollar
    - title: Rinkodaros palaikymo rinkinys
      description: Profesionali produktų fotografija, specifikacijų lapai, atitikties dokumentacijos šablonai, socialinių tinklų turinys ir bendro prekės ženklo rinkodaros medžiaga. Kasmet atnaujinama su naujų produktų pristatymais.
      icon: tabler:photo
    - title: Techninis mokymas
      description: Produktų mokymai jūsų pardavimų komandai (virtualūs arba vietoje), techninės priežiūros ir remonto mokymai aptarnavimo technikams, klientams skirti DUK ir trikčių šalinimo vadovai.
      icon: tabler:school
    - title: Atsarginės dalys ir po pardavimo
      description: Specialus atsarginių dalių tiekimas su prioritetiniu siuntimu. Keičiamos vamzdžių dalys, vožtuvai, sparneliai ir remonto rinkiniai greitam užsakymų įvykdymui. Garantinių pretenzijų nagrinėjimo palaikymas.
      icon: tabler:tool
    - title: Atitikties dokumentacija
      description: 'Pilnas atitikties dokumentacijos paketas jūsų rinkai: CE DoC, gamintojo plokštelių duomenys, savininkų vadovai ir reguliavimo registracijos palaikymas. Pašalina jūsų atitikties naštą.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Ko ieškome
  title: Platintojas<br />Reikalavimai
  subtitle: Ieškome partnerių, kurie profesionaliai atstovautų ir palaikytų Aquafarer produktus savo teritorijoje.
  items:
    - title: Teritorijos ir rinkos žinios
      description: Įsitvirtinusi pozicija jūrininkų, vandens sporto ar lauko pramogų rinkoje. Supratimas apie vietinius reglamentus, vartotojų pageidavimus ir vandens transporto produktų platinimo kanalus.
      icon: tabler:target
    - title: Pramonės patirtis
      description: Mažiausiai 2 metų patirtis platinant jūrinę, lauko ar sporto įrangą. Įrodyta patirtis su tarptautiniais prekių ženklais ir B2B didmenine prekyba.
      icon: tabler:briefcase
    - title: Parodų salė arba sandėlis
      description: Fizinė patalpa produktų ekspozicijai, atsargų saugojimui ir klientų aptarnavimui. Galimybė prižiūrėti demonstracinius įrenginius ir atsarginių dalių atsargas savo teritorijoje.
      icon: tabler:building-store
    - title: Įsipareigojimas prekės ženklo standartams
      description: Norą išlaikyti Aquafarer prekės ženklo pristatymo standartus, teikti klientų aptarnavimą pagal mūsų paslaugų protokolus ir dalyvauti kasmetiniuose produktų mokymų atnaujinimuose.
      icon: tabler:star
content_process:
  tagline: Paraiškų teikimo procesas
  title: 4 žingsnių dalintojas<br />Paraiškų teikimo procesas
  subtitle: Nuo pirmojo užklausimo iki pirmojo siuntimo – paprastas įvedimo procesas.
  steps:
    - number: '01'
      title: Pradinė užklausa ir kvalifikacija
      description: Pateikite savo platintojo paraišką su įmonės informacija, dominančia teritorija, esamomis produktų linijomis ir metiniais apimties įvertinimais. Peržiūrime per 5 darbo dienas.
      timeline: 5 dienos
    - number: '02'
      title: Verslo apžvalga ir sąlygos
      description: Virtualus susitikimas, kuriame aptariama teritorijos strategija, kainodaros lygiai ir partnerystės sąlygos. Peržiūrėkite atitikties dokumentacijos reikalavimus savo rinkai.NDA Pasirašykite, jei reikia.
      timeline: 1–2 savaitės
    - number: '03'
      title: Pavyzdinė tvarka ir vertinimas
      description: Pateikite pradinį pavyzdinį užsakymą (2–5 vienetai) pagal platintojo kainą rinkos vertinimui ir komandos mokymams. Įtraukta pilna atitikties dokumentacija ir demonstracinė parengtis.
      timeline: 30–45 dienos
    - number: '04'
      title: Partnerystės pradžia ir palaikymas
      description: Pirmas konteinerio užsakymas su aktyvuota teritorijos apsauga. Rinkodaros rinkinys pristatytas, pardavimų komanda apmokyta ir paskirtas paskyręs paskyros vadybininką. Vykdomi ketvirtiniai verslo vertinimai.
      timeline: Tęsinys
content_application_docs:
  tagline: Paraiškos dokumentai
  title: Reikalingi dokumentai<br />Dealer Application
  subtitle: Norėdami kreiptis dėl Aquafarer atstovybės, prašome paruošti šiuos dokumentus ir informaciją mūsų peržiūros komandai.
  items:
    - title: Verslo registracijos pažymėjimas
      description: Galiojantis įmonės registracijos dokumentas, nurodantis juridinio asmens pavadinimą, registruotą adresą ir veiklos sritį, apimančią jūros, sporto ar lauko įrangos platinimą.
      icon: tabler:file-text
    - title: Teritorijos aprėpties planas
      description: Dominanti geografinė teritorija, esamas mažmeninės prekybos ar platinimo tinklas, tikslinės klientų grupės ir siūlomas metinis kiekis pagal produktų kategorijas (RIB, SUP, baidarės).
      icon: tabler:map
    - title: Ekspozicijų salės ar sandėlio galimybės
      description: Fizinė patalpa produktų ekspozicijai, atsargų saugojimui ir klientų aptarnavimui. Nuotraukos arba planai, rodantys demonstracinę erdvę ir atsarginių dalių saugojimo talpą.
      icon: tabler:building
    - title: Finansinių galimybių ataskaita
      description: 'Banko nuoroda arba finansinė ataskaita, patvirtinanti galimybę pateikti pradinį konteinerių užsakymą ir palaikyti atsargas. Minimalus pradinis užsakymas: vienas 20 pėdų konteineris (10–20 vienetų mišrių modelių).'
      icon: tabler:coin
    - title: Po pardavimo aptarnavimo pajėgumai
      description: Aptarnavimo technikai apmokyti arba apmokyti pripučiamų valčių priežiūrai ir remontui. Garantinių pretenzijų nagrinėjimo galimybės ir atsarginių dalių atsargų įsipareigojimas.
      icon: tabler:tool
    - title: Ankstesnės prekės ženklo nuorodos
      description: Dabartinių ar buvusių jūrų/sporto įrangos prekių ženklų sąrašas. Kontaktų rekomendacijos pateikiamos abipusiu susitarimu. Startuoliai, neturintys ankstesnės platinimo patirties, gali atitikti griežtesnį finansinį įsipareigojimą.
      icon: tabler:users
faq:
  title: Salonų programa — Dažniausiai užduodami klausimai
  questions:
    - q: Koks yra minimalus užsakymo kiekis platintojams?
      a: Platintojas MOQ pradeda nuo 10–20 vienetų užsakymui, su lankstumu mišriems modeliams (RIBpripučiamiems, ). SUPPradiniai 2–5 vienetų pavyzdiniai užsakymai yra prieinami platintojo kainodaroje rinkos vertinimui.
    - q: Ar siūlote išskirtines teritorijos teises?
      a: Išskirtinės teritorijos teisės suteikiamos kvalifikuotiems platintojams, kurie laikosi metinių apimties įsipareigojimų ir palaiko prekės ženklo standartus. Pusiau išskirtinės ir neišskirtinės sutartys taip pat prieinamos besivystančiose rinkose.
    - q: Kokią rinkodaros pagalbą teikiate?
      a: Siūlome išsamų rinkodaros rinkinį, įskaitant profesionalią produktų fotografiją, specifikacijų lapus, atitikties dokumentacijos šablonus, socialinių tinklų turinio biblioteką ir bendro prekės ženklo medžiagą. Kasmet atnaujinama su naujų produktų pristatymais.
    - q: Kaip tvarkomi garantiniai reikalavimai?
      a: 'Platintojai yra pirmasis kontaktinis asmuo garantinių pretenzijų bylose. Mes užtikriname aiškius garantijos kriterijus, nuotraukų dokumentacijos protokolus ir greitą keitimą ar kredito apdorojimą. Garantijos sąlygos: 5 metų apribojimas laivo vamzdžių audiniui/siūlėms/korpusui; 2 metai SUP ir priedai.'
    - q: Ar galiu privačiai ženklinti Aquafarer produktus savo prekės ženklu?
      a: Taip, per mūsų OEM/ODM programą. Privačios etiketės galimybės apima individualias lempų grafikas, konsolės prekės ženklą, mažmeninės prekybos pakuotes ir atitikties dokumentus jūsų prekės ženklu. Daugiau informacijos rasite mūsų OEM/ODM paslaugų puslapyje.
    - q: Kokie atitikties dokumentai įtraukiami platintojams?
      a: Kiekviena siunta apima modelio specifinius CE DoC, gamintojo numerių duomenis, savininko vadovus ir siuntimo dokumentus. Taip pat teikiame reguliavimo registracijos palaikymą jūsų teritorijai ir padedame su vietiniais atitikties reikalavimais.
