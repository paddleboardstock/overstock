hero:
  tagline: Įranga
  title: Gamybos įranga ir mechanizmai
  subtitle: Pramoninės klasės įranga pjovimui, suvirinimui, spausdinimui ir surinkimui
  back_label: Grįžti į gamyklą
  back_link: /factory
categories:
  - title: Pjovimas ir medžiagų paruošimas
    items:
      - name: Automatinė PVC pjovimo mašina
        spec: CNC-valdomas, 6,5 m × 2,5 m, 0,1 mm tikslumas
        desc: Kompiuteriu valdomas automatinis pjovimo įrenginys PVC, Hypalon ir drop-stitch audiniams. Programinė įranga optimizuoja medžiagų panaudojimą, kad atliekos būtų mažesnės nei 5%.
      - name: Audinių išskleidėjas
        spec: Maksimalus plotis 3 m, įtampos valdymas
        desc: Išdėlioja audinį vienu ar keliomis sluoksnių eilėmis su įtampos kontrole, kad prieš pjovimą nebūtų deformacijos.
  - title: Vamzdžių suvirinimas ir klijavimas
    items:
      - name: Šilumos sandarinimo mašina
        spec: Karšto oro suvirinimas, kintama 200–600 °C, 0,5–5 m/min
        desc: Karšto oro sandarinimo įrenginys vamzdžių siūlėms sujungti ir suvirinti PVC ir Hypalon. Naudojamas tvirtinimui, sandarinimui ir vamzdžių kamerų bei plūdžių jungčių sujungimui.
      - name: Dielektrinis RF presas
        spec: 15 kW, plokštė 2000 × 600 mm
        desc: Radijo dažnio suvirinimo presas pagrindinėms ilginėms siūlėms, skersiniams ir didelių kamerų gamybai.
      - name: CNC-valdomas RF suvirinimo įrenginys
        spec: 8 kW, XY stalas 2500 × 1200 mm
        desc: Programuojamas lenktų siūlių suvirinimas sudėtingoms geometrinėms formoms, logotipų reljefams ir preciziškam detalių sujungimui.
  - title: RIB korpuso gamyba
    items:
      - name: Stiklo pluošto rankinio klojimo formos
        spec: Keli liejimo formos RIB korpusams iki 6 m ilgio
        desc: Tradicinis rankinis stiklų pluošto liejimas su poliesterio ir vinilesterio dervų sistemomis. Kiekvienas sluoksnis rankomis ritinėjamas ir vakuumuojamas siekiant nuoseklaus laminato kokybės ir tvirtumo.
      - name: Gelcoat purškimo kabina
        spec: Temperatūros valdymas, filtruotai tiekiamas oras
        desc: Gelkotio padengimas RIB korpusams. Užtikrina blizgantį, UV-atsparų paviršių su tikslia storio kontrole.
      - name: CNC freza (5 ašių)
        spec: 3 m × 2 m × 1 m darbinė zona, aušinamas vandeniu velenas
        desc: Korpuso įdėklų, konsolės formų, sėdynių pagrindų ir individualių laikiklių apdirbimas.
  - title: SUP Spauda ir dekoravimas
    items:
      - name: Skaitmeninis spausdintuvas
        spec: Aukštos raiškos rašalinių spausdintuvų spausdinimas, iki 2 m spausdinimo pločio
        desc: Skaitmeninis tiesioginis spausdinimas ant audinio pilno spalvų SUP denio grafikoms. Spausdina individualius raštus, gradientus ir nuotraukų kokybės vaizdus naudojant UV-atsparius vandens pagrindo rašalus.
      - name: Šilkografijos mašina
        spec: Rankinis ir pusiau automatinis, daugiaspalvis registravimas
        desc: Šilkografija SUP lentų logotipams, prekės ženklo ženklams ir pasikartojantiems raštams. Užtikrina patvarų, nepermatomą spausdinimą su ryškia spalvų sodrumu.
  - title: Surinkimas ir įrengimas
    items:
      - name: Variklio keltuvas
        spec: 500 kg talpa, reguliuojama pločio juosta
        desc: Saugus išorinių variklių nuo 2,5 iki 60 AG montavimas.
      - name: Konsolės maketo rėmas
        spec: Reguliuojamas aukštis ir kampas
        desc: Vairavimo, akseleratoriaus ir prietaisų skydelių priešmontavimo paruošimas.
      - name: Hidraulinio žarnų suspaudimo įrenginys
        spec: Iki 1" vidinis skersmuo, skaitmeninis slėgio matuoklis
        desc: Individualios ilgio hidraulinių vairavimo žarnų jungtys su užspaudžiamais antgaliais.
      - name: Elektros laidų skydelis
        spec: 3 m × 1,5 m, iš anksto atspausdinti laidų schemos
        desc: Pilnų elektros laidynų surinkimas ir testavimas ne ant valties.
  - title: Testavimas ir kokybės kontrolė
    items:
      - name: Universalus tempimo testeris
        spec: 50 kN, / ASTM D751
        desc: Audinių partijų lūžimo jėgos, tempimo atspindžio ir skiautinių plyšimo testavimas.
      - name: Oro išlaikymo testavimo įrenginys
        spec: Programuojamas, 30 min slėgio palaikymas
        desc: Automatinis slėgio palaikymo testas kiekvienam vamzdelių skyriui prieš surinkimą.
      - name: Siūlių atplėšimo testeris
        spec: Motorinis 180° atplėšimas 100 mm/min greičiu
        desc: Suvirinimo ir klijuotų siūlių atsparumo lupimu testavimas pagal ISO 6185.
      - name: Ksenono lanko klimato kameros testavimas
        spec: 2000 valandų poveikis
        desc: UV atsparumo testavimas spalvos pasikeitimui ir stiprumo išlaikymui.
