breadcrumb: OEM/ODM Gamintojas
tldr:
  summary: Aquafarer yra tiesiogiai iš gamyklos OEM/ODM gamintojas. 12 000 m² ISO 9001:2015 sertifikuota gamykla, 15 000 vienetų metinė produkcija, CE/BSCI/REACH/UKCA atitiktis, mažas MOQs nuo 2–10 vienetų.
  points:
    - 12 000 m² ISO 9001:2015 sertifikuota Qingdao gamykla
    - 15 000 vienetų metinis pajėgumas su 200–300 kvalifikuotų darbuotojų
    - CE 2013/53/ES, UKCA, BSCI, REACH atitiktis
    - 'Mažas MOQs: 2–5 vienetai (RIB), 5–10 vienetų (SUP) standartiniams modeliams'
    - 50+ eksporto šalių su FOB Qingdao siuntimu
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 Sertifikuota
      desc: SGS audituota kokybės vadybos sistema visuose gamybos linijose.
      variant: cert
    - icon: ⭐
      title: CE & UKCA Atitinka
      desc: Pilna atitiktis ES 2013/53/ES ir JK ženklinimo reikalavimams.
      variant: cert
    - icon: ⭐
      title: BSCI Socialinis Auditas
      desc: Patvirtintos etiškos darbo praktikos ir darbo vietos standartai.
      variant: standard
    - icon: ⭐
