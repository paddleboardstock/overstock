      desc: 'Standartiniai RIB modeliai nuo 2–5 vienetų, SUP nuo 5–10 vienetų. Individualus liejimas: 200+.'
      variant: standard
process_section:
  eyebrow: Mūsų Procesas
  title: End-to-End OEM/ODM darbo eiga
  subtitle: Nuo dizaino brief iki konteinerio pakrovimo — šeši žingsniai Jūsų privatų ženklą turinčiam pripučiamajam vandens transportui.
  steps:
    - step: '01'
      title: Specifikacija ir Dizaino Brief
      desc: Pasidalykite savo tikslinėmis specifikacijomis, CAD brėžiniais arba pavyzdiniu produktu. Mūsų inžinierių komanda peržiūri medžiagas, matmenis ir atitikties reikalavimus (CE, BSCI) prieš pateikiant pasiūlymą.
    - step: '02'
      title: 3D formos prototipų gamyba
      desc: Mes projektuojame ir CNC-apdirbame individualias formas SUP lentoms, baidarių korpusams ir RIB komponentams. Prototipų pavyzdžius pagaminame per 15–20 darbo dienų Jūsų patvirtinimui.
    - step: '03'
      title: Medžiagų parinkimas ir pavyzdžių gamyba
      desc: Pasirinkite iš karinės klasės PVC (0,9 mm–1,2 mm), Hypalon CSM arba drop-stitch pagrindinių audinių. Pagaminame priešgamybinius pavyzdžius su Jūsų prekės ženklo spalvomis, logotipu ir pakuote patvirtinimui.
    - step: '04'
      title: CE Gamyklo Auditas ir Atitiktis
      desc: Kiekvienas OEM užsakymas apima atitikties dokumentaciją — CE atitikties deklaraciją, ISO 9001 sekamumo įrašus, BSCI socialinės atitikties ataskaitą ir REACH medžiagų deklaracijas.
    - step: '05'
      title: Masinė gamyba ir vidinė kokybės kontrolė
      desc: Gamybos partijos laikosi mūsų 100 punktų kokybės kontrolinio sąrašo. Kiekvienas vienetas pereina 24 valandų slėgio išlaikymo testą, siūlių atsiplėšimo testą ir vizualinę apžiūrą prieš pakavimą.
    - step: '06'
      title: FOB Qingdao Logistika ir Siuntimas
      desc: Baigti gaminiai yra padėklais, supakuoti į plėvelę ir pakraunami į konteinerį Qingdao uoste. Mes tvarkome visus eksporto dokumentus, muitinės formalumus ir teikiame realaus laiko siuntų stebėjimą.
capabilities_section:
  eyebrow: Gamybos Galimybės
  title: Ką mes statome
  subtitle: Šešios pagrindinės gamybos galimybės pasauliniams B2B partneriams.
  items:
    - title: Drop-Stitch SUP Plokščių gamyba
      desc: Pilno ilgio drop-stitch šerdies laminavimas standžioms, aukšto slėgio (15–20) PSIstovinčioms irklentėms. Individualus ilgis, plotis, storis, svirtelių profilis ir grafinis dizainas.
    - title: PVC Pripučiamų valčių gamyba
      desc: Aukšto dažnio suvirintos PVC jachtos, tenderiai ir sportiniai laivai. Kelių kamerų konfigūracijos, grindų pasirinkimai (slat, oro denis, pakeliamas) ir priedų integracija.
    - title: Hypalon RIB Valčių gamyba
      desc: Komercinės klasės Hypalon CSM vamzdžiai, sujungti su stiklo pluošto arba aliuminio giliais V formos korpusais. 3,3–6,0 m ilgio patruliavimui, gelbėjimui, ekskursijoms ir nardymo operacijoms.
    - title: Privati etiketė ir individualus prekės ženklas
      desc: 'Pilna privačios etiketės paslauga: individualus logotipo šilumos perdavimas arba šilkografija, firminė pakuotė (mažmeninės prekybos dėžutės, nešiojimo maišeliai), naudotojo vadovai jūsų kalba ir brūkšniniai kodai /UPC registracija.'
    - title: Individualių formų ir įrankių dizainas
      desc: Vidinė 3D CAD/CAM inžinerijos komanda. Mes projektuojame ir gaminame individualias aliuminio ir kompozitines formas, skirtas unikalioms korpuso formoms, denio konfigūracijoms ir priedų tvirtinimo taškams.
    - title: OEM Priedai ir įranga
      desc: Gelbėjimosi liemenės (CE12402), dvigubo veikimo siurbliai, anglies/nailono mentelės, remonto rinkiniai, nešiojimo krepšiai ir pavadėlių komplektai. Pilnas komplektas ir pakuotė prekybai paruoštam pristatymui.
experience_section:
  eyebrow: Reali patirtis
  title: Partnerystės, kurios kūrė prekės ženklus
  subtitle: Tikros istorijos iš prekės ženklų ir organizacijų, kurios bendradarbiavo su Aquafarer OEM/ODM gamyba.
  stories:
    - quote: Atėjome Aquafarer su eskizu ant servetėlės ir reikalavimų sąrašu. Po aštuonių mėnesių turėjome gamybai paruoštą produktą, kuris išlaikė CE sertifikatą iš pirmo karto.
      narrative: Europos startuolis su nauju SUP dizainu buvo Aquafarer pasirinktas ODM gamybai. Aquafarer R&D komanda koncepciją išplėtė per CAD projektavimą, FEA struktūrinę analizę, hidrodinaminę simuliaciją, formų kūrimą, prototipų gamybą ir gamybos įrankius. Startuolio įkūrėjas proceso metu tris kartus lankėsi Čingdao. Galutinis produktas buvo CE sertifikuotas be jokių pakeitimų – įkūrėjas šį rezultatą priskiria Aquafarerinžinierių komandai, kuri nuo pat pradžių suprato Europos reguliavimo reikalavimus.
      context: Europos SUP prekės ženklo pristatymas, 2023–2024
      source: Brand Founder
    - quote: NDA Apsaugos ir intelektinės nuosavybės saugumo lygis Aquafarer suteikia mums pasitikėjimo dalintis savo nuosavybiniais dizainais. Jie elgiasi su mūsų intelektine nuosavybe tarsi su savo.
      narrative: JAV įsikūrusi jūrų įrangos įmonė, turinti patentuotą vožtuvų technologiją, ieškojo gamybos partnerio, galinčio apsaugoti jų intelektinę nuosavybę gamindama dideliu mastu. Patikrinę penkis Kinijos gamintojus, jie pasirinko Aquafarer pagal gamyklos intelektinės nuosavybės apsaugos protokolus, saugų projektavimo failų tvarkymą ir pasirengimą pasirašyti griežtas konfidencialumo sutartis. Partnerystė per ketverius metus pagamino tris produktų linijas be jokių IP incidentų.
      context: JAV jūrų įrangos įmonė, OEM partnerystė nuo 2021 metų
      source: Veiklos viceprezidentas
