stories:
  tagline: Tyrinėtojų istorijos
  title: Tikros nuotykiai iš tikrų žmonių
  subtitle: Išgirskite baidarininkus, šeimas ir profesionalus, kurie vandenyje naudoja Aquafarer įrangą.
  items:
    - name: Sara ir Maikas
      title: SUP „Explorer 11“ savininkai, Kanada
      content: Mes mūsų Explorer 11 pasiėmėme savaitės kelionei per Algonkinų parką. Jie puikiai tvarkėsi su perkėlimais ir ežero kirtimais. drop-stitch konstrukcija reiškė, kad galėjome pripūsti iki 15 PSI ir gauti kietos lentos našumą iš sulankstomos lentos.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Algonkino parkas, Kanada
    - name: Karlosas R.
      title: Gepardo „Surge“ raitelis, Ispanija
      content: Cheetah Surge yra mano pasirinkimas pakrantės plaukimui. Gyva dizaino išvaizda patraukia dėmesį paplūdimyje, o stabilumas suteikia pasitikėjimo lengvuose bangavimuose. Jis puikiai valdomas tiek kelionėms, tiek tiesiog žiūrint saulėlydį.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Kosta Brava, Ispanija
    - name: Lina ir šeima
      title: Plaukiojantys Lotus irklavėjai, Švedija
      content: Šeimos savaitgalio nuotykiai archipelage. „Flowing Lotus“ yra pakankamai stabilus, kad mano dukra galėtų stovėti ant jo, kai aš irklu. Išsipučia per mažiau nei 10 minučių – nereikia prikabinamų priekabų, tik grynas šeimos smagumas vandenyje.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Stokholmo archipelagas, Švedija
    - name: Lt. Cmdr. Andres
      title: Vandenyno Keliautojas tyrinėtojas, Filipinai
      content: Aš naudoju savo Ocean Voyager ilgų pakrančių turų aplink Palawan. Po mėnesių kasdienio naudojimo tropinėmis sąlygomis lenta vis dar veikia kaip nauja. Turistinė forma prasiskverbia per bangavimą, kuris sustabdytų silpnesnes lentas.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palavanas, Filipinai
    - name: Emma T.
      title: Tropical Breeze pirmą kartą, Australija
      content: Aš niekada nebuvau ant SUP. Tropical Breeze yra toks stabilus, kad jaučiausi užtikrintai pirmą kartą bandydamas. Dabar irkluoju kiekvieną savaitgalį. Mokymosi kreivė praktiškai lygi nuliui — o lenta atrodo nuostabiai ant vandens.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australija
