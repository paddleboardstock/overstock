philosophy:
  tagline: Dizaino filosofija
  title: Inžinerijos vadovaujamas dizainas<br />— Kiekviena smulkmena svarbi
  subtitle: Mūsų inžinerijos filosofija remiasi trimis principais, kurie vadovauja kiekvienam mūsų kuriamam produktui.
  list:
    - 'Patikimumas Pirma: Kiekvienas Paddle Board Overstock produktas yra testuojamas, kad atlaikytų realias sąlygas — nuo gelbėjimo operacijų šaltame vandenyje iki nuomos tropiniuose kurortuose. Mes sukuriame papildomus inžinerinius sprendimus ten, kur tai svarbiausia.'
    - 'Gaminimo tikslumas: mūsų įrenginiai naudoja CNC pjovimą, aukšto dažnio suvirinimą ir automatizuotą slėgio testavimą. Kiekvienas siūlė, kiekvienas vožtuvas, kiekviena jungtis atitinka dokumentuotas specifikacijas.'
    - 'Nuolatinė inovacija: Mūsų MTEP komanda nuolat vertina naujas medžiagas, gamybos metodus ir dizaino patobulinimus. Mes nelaukiame problemų – mes jas numatome.'
