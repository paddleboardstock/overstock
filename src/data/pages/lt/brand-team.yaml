hero:
  tagline: Mūsų komanda
  title: Žmonės Už Paddle Board Overstock<br />— Inžinerija Laisvei Ant Vandens
  subtitle: Įkurta 2012 m. Kinijos Qingdao mieste, Paddle Board Overstock buvo sukurta jūrinių inžinierių, medžiagų mokslininkų ir vandens sporto entuziastų, kurie tikėjo profesionalių pripučiamų vandens transporto priemonių prieinamumu visame pasaulyje.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock pilnos komandos nuotrauka — inžinerija, gamyba ir vadovavimas
founding:
  tagline: Mūsų Įkūrimas
  title: Iš Pakrantės Dirbtuvės<br />į 12 000 m² Įrenginį
  subtitle: Paddle Board Overstock buvo įsteigta jūrinių inžinierių komandos, turinčios dešimtmečių patirtį pripučiamų valtelių projektavime, PVC/Hypalon gamyboje ir pasaulinėje jūrų įrangos gamyboje.
  items:
    - title: 'Įkurta: 2012'
      description: iš Qingdao, Kinija — svarbus jūrų hub su giliu laivų statybos paveldu.
      icon: tabler:calendar
    - title: 200–300 Darbuotojų
      description: Įskaitant 50+ MTTP inžinierių, kokybės kontrolės specialistų ir gamybos technikų.
      icon: tabler:users
    - title: 12 000 m² Įrenginys
      description: Specializuota gamyklos teritorija su 6 gamybos linijomis RIBs, pripučiamiems valteliams ir SUP lentoms.
      icon: tabler:building-factory
    - title: 50+ Aptarnaujamų Šalių
      description: Eksportuojama į Europą, Ameriką, Artimuosius Rytus, Azijos ir Ramiojo vandenyno regioną ir Afriką.
      icon: tabler:globe
