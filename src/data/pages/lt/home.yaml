content_customer_types:
  tagline: Kam mes aptarnaujame
  title: Sukurta B2B pirkėjams<br />— Ne mažmeninės prekybos pirkėjai
  subtitle: Aquafarer gamina keturiems klientų tipams. Kiekvienas turi skirtingas prioritetus, ir mes juos visus atsižvelgiame.
  items:
    - title: Prekės ženklo savininkai / Privatūs ženklai
      description: Individualus produkto dizainas, privačiojo prekės ženklo grafika, atitikties dokumentacija jūsų prekės ženklui ir specializuota inžinerinė pagalba nuo koncepcijos iki konteinerio.
      icon: tabler:palette
      cta: Užklausa OEM/ODM Pasiūlymas
      cta_href: /request-quotation
    - title: Platintojai / didmenininkai
      description: Teritorijos apsauga, konkurencingos didmeninės kainos, rinkodaros palaikymo rinkiniai, produktų mokymai ir pilna atitikties dokumentacija jūsų rinkai.
      icon: tabler:world
      cta: Kreipkitės dėl atstovybės
      cta_href: /dealers-distributors
    - title: Kurortai / Nuomos operatoriai
      description: Komercinio lygio patvarumas, patarimai dėl parko dydžio, mišrių modelių konteinerių užsakymai, atsarginių dalių strategija ir kurorto prekės ženklo įrangos paketai.
      icon: tabler:beach
      cta: Įsigykite komercinį paketą
      cta_href: /solutions/resorts
    - title: Gelbėjimas / Vyriausybė / Profesionalas
      description: Hypalon/CSM statybos, SOLAS atitikties parinktys, projekto specifinis sertifikavimas, konkurso dokumentacijos palaikymas ir NDA-apsaugota inžinerija.
      icon: tabler:shield
      cta: Aptarkite projektą
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Galimybės
  title: Ką gauni<br />su Aquafarer
  subtitle: Tiesioginė prieiga prie gamyklos su pilnu inžineriniu, kokybės ir atitikties palaikymu – ne prekybos įmonė.
  columns: 2
  items:
    - title: OEM/ODM Individualizavimas
      description: Individualus korpuso dizainas, vamzdžių medžiaga (PVCarba Hypalon/CSM), konsolės išdėstymas, sėdimos vietos, prekės ženklas, spalvos ir pakuotė. Nuo smulkių modifikacijų iki visiškai individualios inžinerijos.
      icon: tabler:adjustments
    - title: ŽemasMOQ, greitas mėginių ėmimas
      description: 'RIB: 2-5 vienetai (esama forma). SUP: 5-10 vienetų už SKU. Individualios formos: 200+ vienetų. Priešgamybiniai pavyzdžiai su jūsų prekės ženklu per 7-14 dienų.'
      icon: tabler:rocket
    - title: Gamybai paruošta kokybė
      description: Kiekvienas vienetas buvo išbandytas 1,25 karto slėgyje, PSI įvertintas 24–48 valandas. 99,3 % defektų nebuvimo rodiklis AQL 2,5 / ISO 2859 vienetams. 100 taškų kokybės kontrolinis sąrašas kiekvienam korpusui.
      icon: tabler:certificate
    - title: Pilna atitikties dokumentacija
      description: CE pagal 2013/53/ES (RCD), ISO 9001:2015 (SGS), BSCI socialinį auditą, REACH atitiktį, UKCA žymėjimą. Įtraukti modelio specifiniai DoC ir gamintojo plokštelių duomenys.
      icon: tabler:file-certificate
    - title: 30–45 dienų pasiruošimo laikas
      description: Standartinė gamyba – 30–45 dienos FOB , Čingdao. Prototipai – 7–14 dienų. Galima skubi gamyba. Konteinerių pakrovimo planai ir ISPM-15 dėžės.
      icon: tabler:truck-delivery
    - title: Po pardavimo ir atsarginės dalys
      description: 5 metų garantija laivams/baidarėmsRIBs/, 2 metai SUP/ aksesuarams. Atsarginių dalių tiekimas su prioritetiniu pristatymu. Garantijos pretenzijų nagrinėjimo palaikymas.
      icon: tabler:lifebuoy
content_categories:
  tagline: Produktų kategorijos
  title: 5 kategorijos,<br />64 CEsertifikuoti modeliai
  subtitle: Nuo 2,4 m RIB ilgio tenderių iki 15 pėdų SUP lentų – visa tai pagaminta mūsų ISO Qingdao 9001 gamykloje.
  items:
    - title: RIB Valtys
      description: 2,4 m iki 7,0 m su aliuminio arba GRP korpusais. PVC arba Hypalon/CSM vamzdžiai. CE pagal 2013/53/ES. Patruliavimo, narų, gelbėjimo ir komercinės konfigūracijos.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Pripučiamieji valtis
      description: 2,0 m iki 5,0 m su aliuminiu grindų, faneros grindų arba oro denio variantais. Žvejybos, poilsio ir pagalbinių valtelių modeliai.
      icon: tabler:sailboat
      link: /products
    - title: SUP Lentų
      description: Nuo 9 pėdų iki 15 pėdų su 4 colių ir 6 colių Drop-Stitch. Visapusiški, turizmo, jogos ir žvejybos modeliai. Galima įsigyti komercinės kokybės.
      icon: tabler:swimming
      link: /products
    - title: Baidarės
      description: 1 asmens iki 3 asmenų pripučiami baidarės. Laisvalaikio ir kelionių modeliai su Drop-Stitch grindų pasirinkimais.
      icon: tabler:kayak
      link: /products
    - title: Saugos priedai
      description: CE-sertifikuotos gelbėjimosi liemenės, metami virvės, remonto rinkiniai, pompų ir navigacijos žibintai. USCG III/V tipo patvirtintos gelbėjimosi liemenės.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Gamyklos stiprumas
  title: Auditui paruošta gamyba<br />Qingdaue
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001 Įrengimas — Tikras gamintojas, ne prekybos įmonė</h3>
  items:
    - title: 6 specializuotos gamybos linijos
      description: Atskirkite RIB, pripučiamą valtį, SUP, baidarę, saugos įrangą ir OEM/ODM lynus. Kiekvienam numatyti specialūs kokybės kontrolės tikrinimo taškai ir gamybos planavimas.
    - title: 100% Slėgio Testuota
      description: Kiekviena pripučiama kamera, pripūsta iki 1,25 karto nominalios vertės PSI ir palaikoma 24–48 valandas. Bandymo rezultatai susieti su korpuso serijiniu numeriu (HIN).
    - title: Viso korpuso sekamumas
      description: 'HIN lygio gamybos įrašai su 21+ duomenų laukais kiekvienam korpusui: medžiagos partija, suvirintojo ID, slėgio testo rezultatas, galutinė konfigūracija ir pristatymo vieta.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12 000 m² ISO 9001 gamybos cechas Qingdao su RIB gamybos linijomis
content_compliance:
  tagline: Atitikties ir kokybės įrodymas
  title: Dokumentuoti įrodymai<br />Ne tik pretenzijos
  subtitle: Kiekviena atitikties pretenzija yra paremta modeliu specifine dokumentacija, prieinama jūsų patikrinimui.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Kokybės vadybos sistema, sertifikuota TÜV Rheinland/SGS. Metiniai priežiūros auditai. Dokumentuoti kokybės kontrolės procesai nuo gaunamų medžiagų iki siuntinių išleidimo.
      icon: tabler:certificate
    - title: CE pagal 2013/53/ES (RCD)
      description: 64 modeliai su konkrečiais kiekvienam modeliui Skirtais Atitikties Pareiškimais. Atitikties vertinimas pagal taikomas modulių nuostatas. HIN registracija ir statytojo plokštelės duomenys kiekvienam korpusui.
      icon: tabler:file-certificate
    - title: BSCI Socialinė atitiktis
      description: Metinis BSCI auditas, kurį vykdė SGS. Patikrintos etiškos darbo praktikos, darbo sauga ir aplinkos valdymas mūsų įmonėje.
      icon: tabler:users
    - title: REACH & UKCA
      description: Visos PVC ir klijavimo medžiagos atitinka ES REACH reglamentą. UKCA ženklinimas prieinamas JK rinkai. Medžiagų saugos duomenų lapai pateikiami pagal užklausą.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Procesas — Nuo santraukos iki konteinerio
  items:
    - title: 1 žingsnis:<span class="font-medium">Reikalavimai</span>
      description: Pasidalykite savo produkto specifikacijomis, tiksline rinka, kiekiu ir atitikties reikalavimais. Mūsų inžinerijos komanda peržiūrės per 48 valandas.
      icon: tabler:file-text
    - title: 2 žingsnis:<span class="font-medium">Pasiūlymas</span>
      description: Gaukite išsamų pasiūlymą su specifikacijomis, medžiagų pasirinkimais, MOQ, kainomis, pristatymo terminu ir jūsų rinkai taikomu atitikties sritimi.
      icon: tabler:clipboard-list
    - title: 3 žingsnis:<span class="font-medium">Prototipas</span>
      description: Išankstinio gamybos pavyzdys su jūsų prekės ženklu per 7–14 dienų. Viso kokybės testavimas esant 1,25 karto didesniam nei nominalus slėgiui. Pavyzdžio kaina įskaičiuojama į gamybos kainą.
      icon: tabler:settings
    - title: 4 žingsnis:<span class="font-medium">Gamyba</span>
      description: 30-45 dienų gamyba FOB Qingdao po mėginio patvirtinimo. Gamybos metu QC kontrolės taškai, slėgio testavimas ir 100 taškų galutinė patikra kiekvienam vienetui.
      icon: tabler:building-factory
    - title: 5 žingsnis:<span class="font-medium">Pristatymas</span>
      description: Konteinerių pakrovimo planas, ISPM-15 medinių dėžių paruošimas, atitikties dokumentų paketas ir FOB Qingdao siunta su visa eksporto dokumentacija.
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer OEM/ODM pripučiamų valtelių gamybos procesas nuo dizaino iki konteinerio siuntimo
blog_latest:
  title: Pramonės ir techninės įžvalgos
  information: |
    RCD atitikties gairės, OEM/ODM proceso straipsniai, medžiagų palyginimai,
    ir gamyklos patikros išteklius iš Aquafarer inžinerijos komandos.
faqs:
  title: B2B Pirkimų DUK
  subtitle: Dažnai užduodami prekės ženklų, platintojų ir komercinių operatorių klausimai apie Aquafarer gamybą OEM/ODM.
  columns: 2
  items:
    - title: Ar jūs esate gamintojas ar prekybos įmonė?
      description: Mes esame vertikaliai integruota gamykla, turinti visišką kontrolę dėl kokybės, medžiagų ir gamybos terminų. Verslo licenciją ir gamybos apimtį galima patikrinti gamyklos audito metu.
      icon: tabler:building-factory
      category: all
    - title: Koks yra jūsų OEM/ODM procesas?
      description: Reikalavimų peržiūra (48 val.) iki pasiūlymo prototipui (7–14 dienų) iki gamybos (30–45 dienos FOB Qingdao). Visapusiška inžinerinė pagalba, atitikties dokumentacija ir kiekvieno korpuso sekamumas visą laiką.
      icon: tabler:route
      category: all
    - title: Kokie yra jūsų MOQ reikalavimai?
      description: 'RIB Valtys: 2–5 vienetai modeliui (esama forma), 200 vienetų+ individualioms formoms.SUP Lentos: 5–10 vienetų kiekvienamSKU. Galimi mišrių modelių konteinerių užsakymai. Pavyzdiniai užsakymai po 2–5 vienetus vertinimui.'
      icon: tabler:sort-ascending
      category: all
    - title: Kokios pritaikymo galimybės yra prieinamos?
      description: Korpuso dizainas, vamzdžių medžiaga (PVCarba Hypalon/CSM), vamzdžio skersmuo, konsolės išdėstymas, sėdimos vietos, vairavimas, kuro sistema, denio išdėstymas, prekės ženklo spalvos, logotipo grafika, EVA aikštelės dizainas, mažmeninė pakuotė ir naudotojo vadovo prekės ženklas.
      icon: tabler:adjustments
      category: all
    - title: Kokius atitikties dokumentus galite pateikti mano rinkai?
      description: CE DoC pagal 2013/53/ES, UKCA žymėjimas, ISO 9001 sertifikatas (SGS), BSCI audito ataskaita, REACH atitiktis, medžiagų bandymų ataskaitos, slėgio bandymų žurnalai ir modeliui būdingi gamintojo plokščių duomenys. Rinkai specifinė dokumentacija pagal užklausą.
      icon: tabler:file-certificate
      category: all
    - title: Koks yra mėginių ėmimo ir gamybos laikas?
      description: 'Priešgamybiniai pavyzdžiai: 7–14 darbo dienų. Standartinė gamyba: 30–45 dienos FOB Qingdao. Skubi gamyba prieinama už papildomą kainą. Piko sezonas (kovas–birželis) gali pratęsti gamybos laiką.'
      icon: tabler:clock
      category: all
    - title: Ar galiu suorganizuoti gamyklos auditą arba gyvą vaizdo turą?
      description: Taip. Vietoje atliekami gamyklos auditai mūsų Qingdao gamykloje laukiami su 3–5 dienų įspėjimu. Tiesioginės vaizdo ekskursijos per WhatsApp/Zoom pasiekiamos nedelsiant. Trečiųjų šalių inspekcijos (SGS, BV TÜVir ) yra pritaikytos.
      icon: tabler:video
      category: all
    - title: Kokios kokybės patikros atliekamos prieš siuntimą?
      description: 1,25 karto įvertintas slėgio laikymo testas (24-48 val.), siūlės plombavimo testavimas, 100 punktų galutinė patikros kontrolinė lentelė, matmenų patikra, kosmetinė apžiūra, atitikties dokumentų patikrinimas ir pakuotės vientisumo patikra. Visa pagal ISO 9001 procedūras.
      icon: tabler:clipboard-check
      category: all
