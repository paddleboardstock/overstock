      link: /accessory
content_workshop:
  isReversed: true
  tagline: Gamyklos stiprumas
  title: Kodėl mūsų išpardavimo kainos<br />Yra tikri
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Tikra gamykla, tikros taupymo galimybės — kiekviena lenta siunčiama iš mūsų Weihaio patalpos</h3>
  items:
    - title: Tos pačios gamybos linijos kaip didžiosios prekės ženklai
      description: Mūsų 12 000 m² Weihaio gamykla gamina plokštes tarptautiniams prekiniams ženklams ir mūsų pačių perteklinių partijų gamybai tų pačių linijų ir tų pačių medžiagų pagalba.
    - title: 100% Slėgio Testuota
      description: Kiekviena plokštė yra presuojama iki 1,25 karto nominalios PSI ir laikoma prieš išsiunčiant. 99,3% be defektų rodiklis pagal AQL 2,5 / ISO 2859.
    - title: Be tarpininkų
      description: Lentos pristatomos tiesiai iš gamyklos į jūsų duris. Nėra platintojų antkainio, nėra mažmeninės prekybos antkainio — taip likvidavimo kainos išlieka iki 60 % mažesnės nei mažmeninė kaina.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² Weihai gamykla su pripučiama SUP gamybos linijomis
content_compliance:
  tagline: Atitikties ir kokybės įrodymas
  title: Sertifikuota kokybė,<br />Dokumentuota
  subtitle: Kiekviena atitikties deklaracija yra patvirtinta sertifikatais ir konkrečiam modeliui skirtu dokumentu, kurį galite patikrinti.
  items:
    - title: ISO 9001:2015
      description: Kokybės vadybos sistema, sertifikuota TÜV Rheinland/SGS. Metiniai priežiūros auditai. Dokumentuoti kokybės kontrolės procesai nuo gaunamų medžiagų iki siuntinių išleidimo.
      icon: tabler:certificate
    - title: CE Sertifikuota
      description: 13 CE sertifikuoti SUP modeliai pagal taikomą ES direktyvą, kiekvienam su modeliu susijusi atitikties deklaracija ir gamintojo plokštelės duomenimis.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Visos PVC ir klijavimo medžiagos atitinka ES REACH reglamentą. UKCA ženklinimas prieinamas JK rinkai. Medžiagų saugos duomenų lapai pateikiami pagal užklausą.
      icon: tabler:shield-check
    - title: 2 metų SUP garantija
      description: Kiekviena SUP lenta ir priedas padengti 2 metus — drop-stitch siūlės, pripūtimo vožtuvai ir priedai įtraukti. Pretenzijos sprendžiamos greitai.
      icon: tabler:lifebuoy
