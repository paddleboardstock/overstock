features:
  id: features
  tagline: Kodėl verta pirkti iš Paddle Board Overstock
  title: Real Factory,<br />Tikrosios santaupos
  subtitle: Gamykloje tiekiami pertekliniai sandėliai ir išpardavimo SUP paketai – sertifikuota kokybė be mažmeninės prekybos antkainio.
  columns: 2
  items:
    - title: Iki 60% nuolaida mažmeninei prekybai
      description: Mes parduodame gamyklos perteklių ir išpardavimo partijas tiesiogiai – be tarpininkų, be mažmeninės kainos. Tas pačias plokštes, kurios kitur parduodamos už pilną kainą, čia už išpardavimo kainas.
      icon: tabler:rocket
    - title: Pilni paketai
      description: 'Kiekvienas SUP komplektas yra pilnas: lenta, kelioninė kuprinė, rankinis siurblys, reguliuojama mentelė, nuimamas pelekas, ritės pavadėlis ir remonto rinkinys.'
      icon: tabler:clipboard-list
    - title: Sertifikuota kokybė
      description: 13 CE sertifikuoti SUP modeliai pagal taikomus ES direktyvas. Kiekviena plokštė prieš išsiuntimą 100 % išbandoma 1,25 karto didesniu nei nurodytas PSI slėgiu. 99,3 % defektų neturintis rodiklis pagal AQL 2.5.
      icon: tabler:certificate
    - title: Ne MOQ — Pirmojo įsakymo lenta
      description: Perteklinių prekių išvalymas reiškia, kad vieno vieneto užsakymai yra laukiami. Įdėkite lentą į krepšelį, atsiskaitymas – viskas. Nėra minimalaus užsakymo, nėra pasiūlymų proceso.
      icon: tabler:adjustments
    - title: Greitas pasaulinis siuntimas
      description: Sandėlyje esantys užsakymai iš Weihai išsiunčiami per 2–3 darbo dienas. Sekėme pristatymą į 50+ šalių ES, Šiaurės Amerikoje, Azijos ir Ramiojo vandenyno regione bei už jos ribų.
      icon: tabler:truck-delivery
    - title: 2 metų SUP garantija
      description: Kiekviena SUP plokštė ir priedas yra apdrausti 2 metus – drop-stitch siūlės, pripūtimo vožtuvai ir priedai įskaičiuoti. Pretenzijos išsprendžiamos per dienas, o ne savaites.
      icon: tabler:lifebuoy
