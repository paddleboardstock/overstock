  title: Nuo kasos iki vandens – kaip jūsų užsakymas siunčiamas
  items:
    - title: 1 žingsnis:<span class="font-medium">Pasirinkite savo lentą</span>
      description: Rinkitės iš universalių, turistinių, jogos ir vaikų modelių. Mūsų pirkimo gidai padės pritaikyti lentos dydį ir stilių prie jūsų irklavimo.
      icon: tabler:clipboard-list
    - title: 2 žingsnis:<span class="font-medium">Saugus išsiregistravimas</span>
      description: Mokėkite saugiai naudodami Stripe arba PayPal. Priimamos visos pagrindinės kredito ir debeto kortelės. Sąskaita nereikalinga – užsakymo patvirtinimas pasiekia jūsų pašto dėžutę.
      icon: tabler:file-text
    - title: 3 žingsnis:<span class="font-medium">Kokybės patikra</span>
      description: Kiekviena lenta yra 100% slėgiu patikrinta 1,25 karto ir PSI patikrinta pagal pilną kokybės kontrolinį sąrašą prieš ją supakuojant.
      icon: tabler:settings
    - title: 4 žingsnis:<span class="font-medium">Greitasis dispečeris</span>
      description: Užsakymai iš mūsų Weihai gamyklos išsiunčiami per 2–3 darbo dienas. Skubus aptarnavimas galimas skubiems užsakymams.
      icon: tabler:building-factory
    - title: 5 žingsnis:<span class="font-medium">Sekamas pristatymas</span>
      description: Sekamas pristatymas visame pasaulyje į 50+ šalių. Jūsų 2 metų garantija ir operatyvus aptarnavimas po pardavimo įsigalioja tą pačią dieną, kai atkeliauja jūsų plokštė.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
