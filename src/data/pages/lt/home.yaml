faqs:
  title: SUP Užsakymų ir produktų DUK
  subtitle: Dažni klausimai apie mūsų išvalymo SUP lentas, užsakymus, apmokėjimą, siuntimą ir garantiją.
  columns: 2
  items:
    - title: Ar SUP sunku išmokti?
      description: Visiškai ne. Dauguma pradedančiųjų atsistoja ir irkluoja per pirmąją treniruotę. Mūsų universalios SUP lentos turi ypač plačias stabilias platformas, sukurtas specialiai pradedantiesiems. Pradėkite ramioje vandenyje ir per kelias minutes galėsite plaukti.
      icon: tabler:swimming
      category: sup
    - title: Kokia yra svorio riba?
      description: Mūsų universalus SUPs palaikymas iki 220 svarų, o turizmo ir jogos platformos – iki 250 svarų. Kiekviename produkto puslapyje nurodyta tiksli motociklininko svorio talpa, kad galėtumėte pritaikyti lentą pagal savo poreikius.
      icon: tabler:adjustments
      category: sup
    - title: Ar galiu keliauti su pripučiama SUP?
      description: Tikrai taip. Kiekviena Paddle Board Overstock lenta telpa į kuprinės dydžio dėžę. Svoris vos 18–22 svarai, todėl lengva nešti iki paplūdimio, ežero ar oro uostų terminalų. Prieš kelionę pasitikrinkite savo oro linijų bagažo politiką.
      icon: tabler:truck-delivery
      category: sup
    - title: Kas yra dėžutėje?
      description: Kiekviename Paddle Board Overstock SUP komplekte yra lenta, kelioninis kuprinė, rankinis siurblys, reguliuojama mentelė, nuimamas pelekas, pavadėlis su ritiniu ir remonto rinkinys.
      icon: tabler:clipboard-list
      category: sup
    - title: Kodėl jūsų kainos yra mažesnės nei mažmeninės?
      description: Mes parduodame gamyklos perteklinius ir likučių krovinius tiesiai iš savo gamybos įrenginio Weihai, Kinijoje — be tarpininkų, be mažmeninės kainos antkainio. Tai reiškia, kad visi SUP paketai yra iki 60% pigesni nei įprastos mažmeninės kainos, su ta pačia CE sertifikuota kokybe.
      icon: tabler:certificate
      category: orders
    - title: Kaip pateikti užsakymą ir sumokėti?
      description: Įdėkite savo SUP paketą į krepšelį ir saugiai atsiskaitykite su Stripe arba PayPal. Mes priimame visas pagrindines kredito ir debeto korteles. Kiekvienas užsakymas patvirtinamas el. paštu su pilna sąskaita faktūra.
      icon: tabler:file-text
      category: orders
    - title: Ar siuntžiate į visą pasaulį?
      description: Taip. Mes siunčiame į 50+ šalių visoje ES, Šiaurės Amerikoje, Azijos ir Ramiojo vandenyno regione, Artimuosiuose Rytuose ir Afrikoje. Užsakymai, turintys prekių sandėlyje, paprastai išsiunčiami per 2–3 darbo dienas, kiekvienam siuntiniui suteikiant sekimo numerį.
      icon: tabler:route
      category: orders
    - title: Kokią garantiją suteikia SUP plokštės?
      description: 'Kiekviena SUP lenta ir priedas yra padengti 2 metų garantija – įskaitant pačią lentą, drop-stitch siūles ir pripildymo vožtuvus. Pretenzijos sprendžiamos per kelias dienas, o ne savaites: pateikite internetu, ir mes sutaisysime arba pakeisime.'
      icon: tabler:lifebuoy
      category: orders
