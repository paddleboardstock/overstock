hero:
  tagline: Vandens sporto mokyklos ir treniruočių centrai
  title: Įrangos sprendimai<br />Skirta SUP ir baidarių mokykloms
  subtitle: Patikima, komercinės klasės įranga irklavimo mokykloms, banglenčių pamokoms, baidarių treniruotėms ir vandens sporto mokymo programoms bet kokio masto.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP lentos mokykloms ir mokymo centrams
direct_answer: Paddle Board Overstock tiekia SUP ir baidarių mokyklas visame pasaulyje komercinės klasės lentomis, apsaugos įranga ir instruktorių paketais. Mūsų įranga sukurta kasdienei mokymo veiklai — storesnės PVC, sustiprinti drop-stitch branduoliai ir stabilūs korpusų dizainai suteikia pradedantiesiems pasitikėjimo, o instruktoriams — patikimumo. Paketai apima individualų ženklinimą, atsarginių detalių programas ir mokymosi išteklius.
solution_offerings:
  - title: Mokyklos pradžios rinkinys
    subtitle: Naujiems programoms ir mažiems mokymo centrams
    badge: Popular
    features:
      - title: Studentų tarybos
        description: 10–25 universalinių SUP valčių ar rekreacinių baidarių su stabiliais pagrindais pradedantiesiems pamokoms
      - title: Instruktorių lentos
        description: Platesnės, ilgesnės lentos su papildomu stabilumu ir neslystančiomis EVA denio dalimis treniruotėms
      - title: Saugos įranga
        description: Gelbėjimosi liemenės, pavadėliai, švilpukai ir metimo maišeliai derinamos spalvos
      - title: Sandėliavimas ir transportavimas
        description: Dėvimieji lentų stelažai, paminkštinti baidarių laikikliai ir transportavimo vežimėliai
      - title: Ugdymo programos palaikymas
        description: Pamokų šablonai, saugos kontroliniai sąrašai ir įgūdžių tobulėjimo vadovai
    cta_text: Pradėti mano mokyklos paketą
    cta_href: /contact
  - title: Mokyklos premium paketas
    subtitle: Nustatytoms mokykloms ir kelių programų operatoriams
    badge: Best Value
    features:
      - title: Visa laivynas
        description: 25–50 lentos arba baidarės su mišria flotile (universalios, turizmo, jaunimo dydžių)
      - title: Instruktorių flotilė
        description: 3–5 specializuotų mokytojų lentų su įmontuotomis garso sistemos laikikliais
      - title: Saugumo stotis
        description: Centralizuota saugos įrangos stotis su gelbėjimosi liemenėmis, radijo stotimis, pirmosios pagalbos priemonėmis ir ženklinimu
      - title: Prekės ženklo paketas
        description: Pilnas logotipo atspaudavimas ant lentų, irklų, gelbėjimosi liemenių ir uniformų
      - title: Priežiūros programa
        description: Ketvirčio priežiūros rinkiniai, atsarginių dalių paketai ir remonto mokymai
    cta_text: Premium paketo kūrimas
    cta_href: /contact
  - title: Mokyklos franšizės paketas
    subtitle: Skirta daugialokacijų tinklams ir franšizės operatoriams
    badge: Enterprise
    features:
      - title: Transporto priemonių standartizavimas
        description: Visos vietos turi identišką įrangą, kad būtų užtikrinta nuosekli studentų patirtis
      - title: Centrinis užsakymas
        description: Konsoliduoti užsakymai, didmeninės kainos ir centralizuota atsarginių dalių valdymas
      - title: Instruktorių mokymai
        description: Įrangos naudojimo ir priežiūros sertifikavimas visiems instruktorams
      - title: Bendrasis ženklinimas
        description: Bendras žymėjimas su franšize + Paddle Board Overstock bendro ženklo parinktys
      - title: Plėtros palaikymas
        description: Mastelio konsultacijos, įrangos prognozavimas ir naujų lokacijų įrengimas
    cta_text: Aptarti franšizės planą
    cta_href: /contact
benefits:
  - title: Sukurta kasdieniam mokymui
    description: Storesnės PVC ir sustiprintos bėgimo takeliai atlaiko kasdienį studentų naudojimą, kritimus ant smėlio ir akmenuotą nusileidimą.
    icon: tabler:shield
  - title: Stabilios mokymosi platformos
    description: Platesnės korpuso dalys ir plokštesni rockeriai suteikia pasitikėjimo pradedantiesiems. Instruktoriai gali sutelkti dėmesį į mokymą, o ne įrangą.
    icon: tabler:scale
  - title: Lengvas laikymas ir transportavimas
    description: Pripučiamas dizainas leidžia laikyti mažose erdvėse. Nupūstos lentos telpa į standartinių automobilių bagažines mobiliam mokymui.
    icon: tabler:box-seam
  - title: Individualus prekės ženklas
    description: Mokyklos logotipai ir spalvos ant kiekvienos lentos. Jūsų prekės ženklas, jūsų tapatybė — ne bendros nuomojamos įrangos.
    icon: tabler:brush
content_segments:
  tagline: Mokyklos profilis
  title: Vandens sporto mokymo sprendimai<br />Pagal programos tipą
  subtitle: Irklavimo mokyklos, banglenčių akademijos, universitetų programos ir franšizės operatoriai susiduria su skirtingais operacijų iššūkiais — nuo programos integracijos iki daugialokacijų transporto priemonių standartizavimo. Mes konfigūruojame įrangos paketus, kad atitiktų mokymo modelį.
  items:
    - title: Nepriklausomos SUP ir baidarių mokyklos
      subtitle: Savininko valdomi mokymo centrai
      description: Mažos ir vidutinės mokyklos, kuriomis vadovauja savininkai-instruktoriai, siūlantys SUP pamokas, baidarių mokymą ir sertifikavimo kursus. Įranga turi būti pakankamai tvirta kasdieniam mokymui, prieinama mažam verslo biudžetui ir pakankamai universali, kad visoje transporto priemonių flotilėje aptarnautų tiek pradedančiuosius, tiek vidutinio lygio studentus.
      features:
        - Stabilios visapusiškos SUP lentos ir pramoginiai baidarės pradedančiųjų pamokoms
        - Instruktoriams skirtos lentos su papildomu stabilumu mokymui vandenyje
        - Įtraukti pamokų planų šablonai ir įgūdžių progresavimo gaires
        - Metinė įrangos atnaujinimo programa su senos įrangos nuolaidomis
    - title: Universitetų ir kolegijų rekreacijos programos
      subtitle: Didelės studentų rekreacijos įrangos flotilės
      description: Universitetų rekreacijos skyriai valdantys irklavimo klubus, nuomos programas ir mokomuosius kursus kaip dalį campus rekreacijos pasiūlymų. Įranga patiria intensyvų naudojimą semestrų metu, reikalingos lengvai naudojamos įregistravimo/išregistravimo sistemos ir turi atlaikyti skirtingo lygio įgūdžius – nuo pirmą kartą besimokančių studentų iki pažengusių irkluojančių.
      features:
        - Aukšto patvarumo PVC konstrukcija, skirta instituciniam naudojimui
        - Spalvotai koduotos flotilės pagal įgūdžių lygį lengvam valdymui
        - Suderinamumas su RFID arba lipdukų inventoriaus sekimo sistema
        - Didesni užsakymai su semestrų pagrindu nustatytomis užsakymo ir apmokėjimo sąlygomis
    - title: Banglenčių mokyklos ir banglenčių akademijos
      subtitle: Pajūrio banglenčių mokymo programos
      description: Banglenčių mokyklos, mokančios SUP banglenčių, gulimojo irklavimo ir banglenčių baidarių įgūdžių vandenynuose. Įranga turi atlaikyti banglenčių zonos sąlygas – atsparumą smūgiams, atsparumą smėliui ir sūriam vandeniui, bei lengvą plovimą ir grąžinimą po valandinių pamokų.
      features:
        - Banglenčių specifinės formos su sustiprintais bortais ir atsparia smūgiams konstrukcija
        - Minkštos pelekų parinktys ir susukami pavadėliai studentų saugumui
        - Greitai džiūstantis audinys, kuris išdžiūsta tarp pamokų rotacijų
        - Flotilės atnaujinimo programa su sezono pabaigos patikrinimu ir atnaujinimu
    - title: Franšizės ir daugialokacinės grandinės
      subtitle: Standartizuota įranga visose vietose
      description: Daugelio vietų operatoriai vykdantys standartizuotas mokymo programas keliuose miestuose ar regionuose. Svarbiausia visose vietose užtikrinti flotilės nuoseklumą – kiekvienas studentas turėtų turėti tą pačią įrangos patirtį, nepriklausomai nuo franšizės vietos. Esminiai yra centralizuotas užsakymas, prekinio ženklo vienodumas ir palaikymas plėtrai.
      features:
        - Vienodos flotilės specifikacijos visose franšizės vietose
        - Centralizuotas bendras užsakymas su kiekybiniu kainų nustatymu
        - 'Bendro prekinio ženklo galimybės: franšizės prekinis ženklas + Paddle Board Overstock bendro prekinio ženklo partnerystė'
        - 'Naujos vietos įrangos komplektas: įranga, ženklinimas ir pradinis inventorius'
