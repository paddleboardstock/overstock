hero:
  tagline: Afrique
  title: Conseils en gros SUP pour<br />Détaillants et opérateurs africains
  subtitle: Les opérateurs de tourisme côtier et les détaillants de sports nautiques à travers l’Afrique — des panneaux de surstock SUP tout neufs à partir de 5 unités, des modèles mixtes, des trains express ou maritimes.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Panneaux de surstock SUP pour les détaillants et exploitants côtiers africains
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves SUP en surstock aux entreprises à travers l’Afrique — de l’Afrique du Sud et du Kenya au Maroc, au Ghana, à la Tanzanie et en Égypte. Les commandes en gros commencent à 5 planches avec des modèles mixtes en une seule cargaison, envoyées depuis Weihai, Chine, par fret aérien express ou fret maritime consolidé. Chaque planche est testée à 100 % par pression et couverte par la garantie de 2 ans SUP .
tldr_points:
  - Vente en gros à partir de 5 cartes — modèles mixtes, tarifés par quantité totale
  - Au service des marchés touristiques côtiers de l’Afrique du Nord jusqu’au Cap
  - Fret aérien express ou maritim consolidé depuis Weihai, Chine
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché africain SUP
  paragraphs:
    - Africa's coastline runs tens of thousands of kilometers through wildly different water worlds — the Atlantic surf towns of Morocco and South Africa, the reef-protected lagoons of Kenya and Tanzania, the Red Sea resorts of Egypt, and the growing beach scenes of West Africa. In each of them, stand-up paddle is finding its audience: des touristes cherchant une première activité aquatique sûre, et des habitants construisant de véritables communautés de pagaieurs.
    - Les entreprises qui achètent SUP des planches ici sont généralement petites et entrepreneuriales — des boutiques de surf qui ajoutent une option en eau calme, des stations balnéaires qui développent des programmes d’activités, des opérateurs de plongée et de sports nautiques élargissant leur offre, et des lodges de safari et plage qui ajoutent des baies au coucher du soleil. Ils commandent en petites flottes, et ils ont besoin de planches qui fonctionnent le premier jour et tiennent la route saison après saison.
  customer_types:
    - title: Stations balnéaires et lodges côtiers
      description: Les stations balnéaires et les safaris-et-lodges de plage ajoutent SUP des sessions pour les invités — petites flottes mixtes, réapprovisionnement saisonnier facile.
    - title: Opérateurs de sports nautiques et plongée
      description: Les opérateurs existants ajoutent SUP des locations et des leçons en parallèle des opérations de plongée ou de cerf-volant.
    - title: Boutiques de surf et de plage
      description: Les commerçants des villes africaines de surf bien établies s’élargissent vers des eaux calmes et font des tournées SUP pour les locaux et les touristes.
shipping_section:
  title: Navire vers l’Afrique
  paragraphs:
    - Les commandes sont expédiées depuis Weihai, en Chine. Le fret aérien express transporte des échantillons, 1 à 3 commandes de bord et des réapprovisionnements urgents vers les principaux aéroports africains ; le fret maritime consolidé dessert 5 à 20 commandes de gros à bord via les principaux ports de la région. Les deux options sont indiquées avec des temps de transit estimés pour votre destination spécifique.
    - Nous préparons une documentation complète à l’exportation — facture commerciale et liste de conditionnement — et pouvons accompagner votre courtier pour toute paperasse supplémentaire requise par le processus de dédouanement.
  customs_note: Les régimes d’importation varient considérablement selon les pays africains, et les taux de droits sur les équipements sportifs changent périodiquement. Confirmez les règles actuelles auprès de votre autorité locale ou de l’agent de compensation avant de commander ; nous fournissons toute la documentation standard.
faq_section:
  title: FAQ Afrique
  items:
    - q: Quels marchés africains desservez-vous ?
      a: Nous expédions à travers le continent, avec des guides dédiés pour l’Afrique du Sud et le Kenya — ainsi que des destinations du Maroc et de l’Égypte au Ghana et à la Tanzanie. Confirmez votre localisation dans votre demande de devis.
    - q: Une petite loge peut-elle commander seulement quelques conseils ?
      a: Oui — c’est exactement pour eux que le modèle surstock est conçu. Cinq planches sont le minimum, les modèles mixtes sont les bienvenus, et de petites premières flottes sont courantes chez les clients du complexe.
    - q: Comment les locations tient-elles en eau salée et au soleil ?
      a: Les planches utilisent la construction drop-stitch PVC que nous fournissons aux flottes de location dans le monde entier. Rincez-les après une utilisation en eau salée et rangez-les à l’ombre lorsque c’est possible — un entretien standard qui permet de garder les planches de location en état de service pendant plusieurs saisons.
    - q: Quelles sont les étapes de paiement et de livraison ?
      a: Vous demandez un devis, nous confirmons le stock et proposons le prix unitaire ainsi que les options de transport, vous approuvez le devis final, et nous testons, emballons et expédions avec suivi porte-à-porte. Les conditions de paiement sont confirmées lors de la demande de devis.
