content_challenge:
  tagline: Le défi
  title: "Les Bateaux de Pêche Ont Besoin<br />de Stabilité, d'Autonomie et de Durabilité"
  subtitle: 'Que vous exploitiez des navires de pêche commerciaux, gériez une flotte coopérative ou organisiez des charters de pêche, votre bateau doit fonctionner de manière fiable chaque jour.'
  paragraphs:
    - 'Les bateaux de pêche ont besoin de plateformes stables pour travailler les lignes, manipuler les captures et se déplacer en sécurité sur le pont. Les bateaux gonflables et les RIB offrent une stabilité inhérente grâce à la conception de leurs flotteurs, un avantage considérable par rapport aux coques rigides de longueur comparable.'
    - "L'efficacité énergétique est essentielle pour les opérations de pêche dont les coûts d'exploitation ont un impact direct sur la rentabilité. Les RIB et les bateaux gonflables sont plus légers que les bateaux rigides équivalents, nécessitent moins de puissance et consomment moins de carburant — un facteur déterminant pour les opérateurs commerciaux qui naviguent quotidiennement et pour les coopératives qui gèrent les budgets de leur flotte."
    - "La durabilité en milieu marin est indispensable. L'eau salée, l'exposition aux UV et l'utilisation constante exigent des matériaux capables de résister à des conditions difficiles sans se dégrader. Pour les opérateurs commerciaux et les coopératives, la fiabilité influe directement sur les revenus : un bateau en panne signifie des jours de pêche perdus."
    - "Les configurations de pêche Paddle Board Overstock incluent portes-cannes, sondeurs, viviers à appâts, cuves de conservation et solutions de manutention de charge conçues pour les applications de pêche exigeantes, qu'elles soient commerciales, coopératives ou récréatives."
content_solution:
  tagline: Notre solution
  title: 'Configurations Prêtes pour la Pêche'
  subtitle: 'Chaque bateau de pêche Paddle Board Overstock peut être configuré selon votre application de pêche spécifique.'
  list:
    - 'Montage de portes-cannes — installé en usine ou prêt pour une installation sur le marché secondaire'
    - 'Plaque de montage sondeur/GPS à la position de la console'
    - 'Options de vivier à appâts ou de cuve de conservation pour les opérateurs de charter et commerciaux'
    - 'Configurations glacière/stockage pour la manipulation des captures'
    - "Coque en V profond pour les capacités hauturières — stable à l'arrêt, confortable à la vitesse"
    - 'Options de flotteurs en PVC ou Hypalon — Hypalon pour une exposition prolongée aux UV'
    - "Moteur hors-bord de 15 CV à 115 CV selon le modèle et l'application"
content_segments:
  tagline: Profils de pêche
  title: "Solutions de Bateaux Gonflables de Pêche<br />Par Type d'Opérateur"
  subtitle: 'De la pêche sportive côtière à la pêche commerciale à la palangre : chaque opération de pêche exige des configurations de coque, des gammes de puissance et des aménagements de pont différents. Nous adaptons chaque bateau à la pêcherie, aux eaux et au style de travail.'
  items:
    - title: Entreprises de Pêche Commerciale
      subtitle: 'Bateaux de travail pour les opérations de pêche quotidiennes, la manipulation des filets et le transport des captures'
      description: "Les entreprises de pêche commerciale exploitent des bateaux de travail pour poser et relever les filets, entretenir les casiers, pêcher à la palangre et transporter les captures. Ces bateaux travaillent chaque jour en eau salée et doivent supporter de lourdes charges, une manipulation constante sur le pont et de longues heures d'exploitation. L'efficacité énergétique et un faible entretien sont essentiels à la rentabilité de la flotte. Le bateau doit offrir des plateformes de travail stables permettant à l'équipage de manipuler le matériel et les captures dans des conditions de mer variables."
      features:
        - "Pont plat pour la manipulation des filets, l'empilement des casiers et le stockage du poisson"
        - "Hors-bord 40-115 CV économe en carburant pour un faible coût d'exploitation quotidien"
        - "Flotteurs Hypalon renforcés pour une résistance à l'abrasion en usage quotidien"
        - 'Listons de frottement renforcés pour les contacts fréquents avec les pontons et les navires'
        - 'Pont autovidangeable pour un rinçage facile après les opérations'
        - 'Tarifs flotte et spécifications constantes pour les opérateurs multi-navires'
    - title: Opérateurs de Charter de Pêche
      subtitle: 'Confort pour plusieurs passagers, manipulation des captures, certification de sécurité'
      description: "Les opérateurs qui proposent des charters de pêche à la demi-journée et à la journée complète, de la pêche sur les récifs côtiers à la pêche au fond en haute mer. Votre bateau a besoin de sièges passagers avec certifications de sécurité, d'un espace de pont généreux pour plusieurs pêcheurs et de cuves de conservation intégrées pour garder appâts et captures frais tout au long de la sortie. Le confort des clients influence directement les avis, les réservations répétées et les notes en ligne."
      features:
        - 'Pilotage depuis la console avec sièges baquets amortisseurs de chocs'
        - 'Portes-cannes installés en usine (4 à 8 positions)'
        - 'Hors-bord 60-115 CV pour des vitesses de croisière hauturières'
        - 'Certification CE catégorie C ou B pour les opérations commerciales de transport de passagers'
        - 'Bimini ou T-top pour protéger les clients du soleil lors des sorties prolongées'
    - title: Pêcheurs Artisanaux et Commerciaux à Petite Échelle
      subtitle: Des bateaux de travail fiables pour le gagne-pain quotidien
      description: 'Des pêcheurs indépendants qui dépendent de leur bateau comme source de revenus principale : poser des filets, entretenir des casiers ou pêcher à la ligne depuis la côte. Vos priorités : économie de carburant, entretien simple que vous pouvez effectuer vous-même et un bateau qui supporte des charges modérées de captures et de matériel sans sacrifier la stabilité.'
      features:
        - "Hors-bord 15-40 CV économe pour un faible coût d'exploitation"
        - "Flotteurs Hypalon CSM pour une meilleure résistance aux UV et à l'abrasion"
        - 'Pont plat pour la manipulation des filets et le stockage du poisson'
        - 'Échouage facile sur la plage grâce à la protection de quille gonflable'
    - title: Coopératives de Pêche
      subtitle: 'Collecte des captures, transport des membres, distribution des fournitures'
      description: "Les coopératives de pêche exploitent des flottes communautaires pour collecter les captures des pêcheurs membres, transporter des fournitures vers des communautés de pêche isolées et distribuer la production vers les marchés. Ces bateaux de travail requièrent une capacité de charge utile élevée, un fonctionnement quotidien fiable et un entretien simple dans des zones reculées. Les coopératives opèrent souvent dans des régions en développement où la disponibilité des pièces détachées et l'accès aux services sont limités, ce qui rend les configurations hors-bord simples et la construction durable essentielles."
      features:
        - 'Capacité de charge utile élevée pour transporter captures et fournitures'
        - 'Configuration hors-bord simple pour un entretien facile sur place'
        - 'Construction robuste en PVC ou Hypalon pour une flexibilité budgétaire'
        - "Pont plat avec points d'arrimage pour sécuriser la cargaison"
        - "Fonctionnement économe minimisant les coûts d'exploitation de la coopérative"
    - title: Passionnés de Pêche Sportive et au Gros
      subtitle: Performance et style pour les pêcheurs exigeants
      description: "Des pêcheurs expérimentés à la recherche d'une plateforme de pêche performante : vitesse vers des zones de pêche éloignées, positions de combat stables debout et finitions haut de gamme. Le bateau doit se sentir comme à la maison, que l'on parcoure deux milles jusqu'à un récif ou que l'on explore des estuaires reculés."
      features:
        - 'Coque RIB en V profond pour une navigation confortable par mer agitée'
        - 'Plaque de montage sondeur/GPS précâblée à la console'
        - 'Vivier à appâts et glacière intégrés au module du siège arrière'
        - 'Options de couleur EVA personnalisées assorties aux graphismes du bateau et des flotteurs'
    - title: Guides de Pêche et Opérateurs d'Écotourisme
      subtitle: Expériences de pêche guidées pour les pêcheurs de passage
      description: "Des guides qui emmènent de petits groupes de pêcheurs visiteurs vers des spots de pêche productifs, souvent en combinant la pêche avec des éléments d'écotourisme comme l'observation des oiseaux ou l'exploration des mangroves. Le bateau doit rester sec et confortable pour des invités peu habitués aux petites embarcations, avec un embarquement facile et des options d'ombrage."
      features:
        - 'Points de montage pour Bimini ou T-top installés en usine'
        - 'Échelle de bain à entrée douce pour un rembarquement facile'
        - 'Hors-bord 4 temps silencieux pour minimiser les perturbations'
        - 'Compartiments de rangement secs pour téléphones, portefeuilles et caméras des invités'

