hero:
  tagline: Centre R&D
  title: Centre de R & D
  subtitle: Axé sur le progrès

intro:
  - Le centre de recherche et développement (R&D) d'Aquafarer est la force motrice de notre mission de révolutionner les équipements de sports nautiques. Nous donnons aux passionnés de sports nautiques du monde entier des produits plus sûrs, plus confortables et plus agréables grâce à une innovation incessante dans les planches de stand-up paddle (SUP) et les bateaux gonflables. Notre équipe dédiée d'ingénieurs, de designers et d'experts passionnés des sports nautiques façonne l'avenir de l'industrie, relevant constamment le niveau en matière de qualité, de performance et de durabilité.
  - Notre installation R&D réunit des scientifiques des matériaux, des architectes navals et des ingénieurs de production sous un même toit. De la formulation des tissus et de la simulation de coque au développement des processus de soudage et aux essais en mer à grande échelle, chaque étape du développement produit est guidée par les données et validée par des tests.

mission:
  tagline: Notre mission
  title: Innover l'avenir des sports nautiques
  pillars:
    - icon: lightning
      title: Progrès technologique
      desc: Pionnier des nouveaux matériaux, designs et fabrications pour des performances et une longévité supérieures.
    - icon: design
      title: Conception centrée sur l'utilisateur
      desc: Comprendre profondément et dépasser les besoins des utilisateurs grâce à un design ergonomique et intuitif.
    - icon: globe
