pillars:
  - title: Progrès technologique
    desc: Pionnier des nouveaux matériaux, designs et processus de fabrication pour des performances et une longévité supérieures.
    icon: tech
  - title: Matériaux avancés
    desc: Recherche de PVC, Hypalon, composites et alternatives durables de pointe pour des caractéristiques produit améliorées.
    icon: materials
  - title: Durabilité
    desc: 'Un engagement fondamental : Nous sommes dédiés à la gestion environnementale par une fabrication durable et des matériaux recyclables.'
    icon: sustainability

capabilities:
  tagline: Capacités
  title: Capacités R&D
  subtitle: Quatre disciplines clés qui nous donnent un contrôle de bout en bout sur le développement produit — de la recherche sur les matières premières à la certification finale.
  groups:
    - title: Science des matériaux & technologie des tissus
      items:
        - Analyse et optimisation des formulations PVC et Hypalon
        - Développement de stabilisation UV, ignifugation et additifs antimicrobiens
        - Laminage multicouche et ingénierie d'adhésion
        - Tests de vieillissement accéléré (UV, thermique, humidité, brouillard salin)
    - title: Ingénierie de coque & hydrodynamique
      items:
        - Conception paramétrique de coque 3D et optimisation CFD
        - Analyse par éléments finis pour les charges structurelles et d'impact
        - Essais en bassin de remorquage sur maquette et validation des performances
        - Développement de coques personnalisées pour profils de mission spéciaux
    - title: Technologie de soudage & d'assemblage
      items:
        - Développement et optimisation des procédés de soudage diélectrique RF
        - Méthodes de soudage à air chaud, à coin chaud et par ultrasons
        - Qualification des joints collés et des bandes de joint
        - Modélisation de la résistance des soudures et prédiction de durée de vie
    - title: Tests, certification & conformité
      items:
        - Tests de conformité , et CE
        - Tests et certification par tierce partie indépendante
        - Développement de protocoles de test personnalisés pour qualification d'approvisionnement
        - Analyse des défaillances en service et recherche des causes profondes

