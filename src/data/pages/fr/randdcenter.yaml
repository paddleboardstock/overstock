rd_services:
  tagline: R&D personnalisée
  title: Services R&D pour partenaires
  services:
    - title: Développement de matériaux sur mesure
      desc: Nous développons des formulations de tissus, des empilements de stratifiés et des systèmes adhésifs adaptés à votre environnement d'exploitation et à vos objectifs de performance.
    - title: Ingénierie produit OEM / ODM
      desc: Des croquis de concept aux dossiers techniques prêts pour la production — notre équipe peut concevoir, prototyper et valider des bateaux sous votre marque.
    - title: Tests & certification par tiers
      desc: Utilisez nos installations de test conformes ISO pour des tests de matériaux indépendants, une validation produit et un soutien à la certification.
  cta: Discuter de vos besoins R&D →
  cta_link: /contact

vision:
  tagline: Notre vision
  title: Façonner l'avenir des sports nautiques
  body: Aquafarer s'efforce de mener l'industrie du bateau pneumatique et du SUP grâce à une innovation continue, une qualité inébranlable et un engagement ferme envers la sécurité et la durabilité — enrichissant ainsi les expériences des passionnés de sports nautiques dans le monde entier. Le centre R&D Aquafarer est l'endroit où la passion rencontre l'innovation, établissant de nouvelles normes pour l'industrie des sports nautiques.

labs_section:
  tagline: Laboratoires
  title: Nos laboratoires
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: Laboratoire des tissus PVC
      description: Recherche et tests continus des tissus pour tubes PVC et Hypalon pour la résistance à la traction, la résistance aux UV, l'abrasion et la flexibilité à basse température pour garantir une fiabilité à long terme dans les environnements marins.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studio d'ingénierie de coque
      description: Conception assistée par ordinateur et analyse par éléments finis des coques en PEHD, aluminium et fibre de verre. Chaque coque est simulée numériquement pour la répartition des contraintes et la résistance aux chocs avant la construction du premier prototype.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Centre de soudage RF
      description: Installation de soudage par radiofréquence dédiée avec contrôle précis de la température et de la pression, produisant des joints étanches à haute résistance qui dépassent les normes ISO 6185 pour les embarcations gonflables.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Bassin d'essais hydrodynamiques
      description: Tests sur maquette dans notre bassin d'essais interne pour optimiser la forme de coque, les performances de planage, la stabilité et l'efficacité énergétique dans une gamme de conditions de charge et de mer.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Atelier de prototypage
      description: Installation de prototypage et gréement à grande échelle où les nouveaux modèles sont construits, équipés et testés en mer. Chaque prototype subit un programme minimum de 20 heures de tests dans l'eau avant approbation de production.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratoire qualité & inspection
      description: Laboratoire d'assurance qualité dédié effectuant des tests de traction, des cycles de rétention d'air, des tests de pelage des soudures et une certification des matériaux pour garantir que chaque bateau quittant l'atelier répond à nos spécifications publiées.
      href: /randdcenter/quality-inspection-lab
