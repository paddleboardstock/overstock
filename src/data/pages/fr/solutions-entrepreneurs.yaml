testimonial:
  content: J'ai lancé ma marque SUP sans aucune expérience dans l'industrie. L'équipe d'Paddle Board Overstock m'a guidé depuis la sélection des produits jusqu'à la conception et l'emballage du logo personnalisé. Mon premier conteneur est arrivé en 11 semaines et je l'ai vendu en 3 mois sur Amazon. Je commande maintenant mon troisième conteneur.
  name: Michel Parc
  title: Fondateur, Shoreline Paddle Co. — Californie, États-Unis
content_segments:
  tagline: Profils d'entrepreneurs
  title: Lancement de marque de sports nautiques<br />Par type d'entrepreneur
  subtitle: 'Différents fondateurs ont des atouts différents : expertise en commerce électronique, connexions industrielles, portée du contenu ou infrastructure de distribution. Nous adaptons le programme de lancement OEM/ODM en fonction de votre position de départ et de votre ambition de croissance.'
  items:
    - title: Amazon FBA et vendeurs de commerce électronique
      subtitle: Créateurs de marque à évolution rapide et basés sur les données
      description: Vendeurs en ligne expérimentés lançant des produits de sports nautiques sur Amazon, Walmart ou dans leurs propres magasins Shopify. Vous savez comment optimiser les annonces, gérer le PPC et lire les données de catégorie, mais vous avez besoin d'un partenaire de fabrication qui comprend la vitesse du commerce électronique, les taux de retour et les fluctuations saisonnières de la demande.
      features:
        - Emballage prêt pour la vente au détail, optimisé pour les limites de dimensions FBA
        - Génération de codes-barres EAN/UPC et documentation conforme aux exigences Amazon
        - Faible MOQ (2–5 unités par SKU pour RIB, 5–10 pour SUP) pour tester la demande avant de passer à l'échelle
        - Consolidation de conteneurs mixtes pour optimiser le coût de revient unitaire
    - title: Influenceurs fitness et mode de vie en plein air
      subtitle: Créateurs de marques axés sur le public
      description: "Créateurs de contenu, coachs fitness et personnalités du plein air avec un public engagé prêt à adhérer à une marque lifestyle. Vous apportez la communauté et l'histoire de la marque : nous nous occupons de l'ingénierie, de la conformité, de l'emballage et de la logistique du produit afin que vous puissiez vous concentrer sur le contenu et la conversion."
      features:
        - 'Personnalisation de marque rapide : cycle d''échantillons de 2 semaines avec logo + couleurs'
        - Éditions limitées co-brandées et sorties de coloris saisonniers
        - Soutien à la production de photographies lifestyle et de contenus vidéo
        - 'Exécution directe au consommateur : drop shipping de l''usine → au client'
    - title: Les distributeurs régionaux s'adressent directement aux consommateurs
      subtitle: Les opérateurs B2B lancent leur propre marque
      description: "Distributeurs établis d'équipements marins ou de plein air qui souhaitent lancer leur propre marque parallèlement ou à la place de la revente de produits tiers. Vous disposez déjà d'une infrastructure d'entrepôt, de relations logistiques et d'une base de clients : vous avez besoin d'un partenaire d'usine capable de fournir une qualité de marque privée à grande échelle."
      features:
        - Conceptions de produits exclusives pour votre territoire de marché
        - Développement complet de moules OEM pour des formes et spécifications propriétaires
        - Documentation de conformité localisée (CE, UKCA, USCG) pour votre région
        - 'Emballage co-brandé : marque du distributeur + marque de qualité Paddle Board Overstock'
    - title: Fondateurs de marque pour la première fois
      subtitle: Création de marque guidée de bout en bout
      description: Entrepreneurs passionnés sans aucune expérience dans l’industrie des sports nautiques et souhaitant créer une marque à partir de zéro. Vous avez besoin d'un partenaire qui vous accompagne à chaque étape – de la sélection et de la dénomination des produits à la conception de l'emballage et à la logistique du premier conteneur – avec des délais clairs et une tarification transparente.
      features:
        - Sélection consultative de produits parmi plus de 50 modèles de base éprouvés
        - 'Package d''identité de marque : dénomination, logo, palette de couleurs, conception de l''emballage'
        - Délai de 60 à 90 jours du concept à la première expédition
        - Chef de projet dédié pour les nouveaux propriétaires de marque
