process_section:
  eyebrow: Notre processus
  title: Processus OEM/ODM de bout en bout
  subtitle: Du cahier des charges au chargement du conteneur — six étapes vers votre engin nautique gonflable en marque blanche.
  steps:
    - step: '01'
      title: Spécifications & cahier des charges
      desc: Partagez vos spécifications cibles, vos plans CAO ou un produit de référence. Notre équipe d’ingénierie examine les matériaux, les dimensions et les exigences de conformité (CE, BSCI) avant d’établir le devis.
    - step: '02'
      title: Prototypage de moules 3D
      desc: Nous concevons et usinons par CNC des moules sur mesure pour les planches de SUP, les coques de kayaks et les composants de RIB. Des échantillons prototypes sont produits sous 15 à 20 jours ouvrés pour validation.
    - step: '03'
      title: Sélection des matériaux & production d’échantillons
      desc: Choisissez parmi le PVC de qualité militaire (0,9 mm à 1,2 mm), le CSM Hypalon ou les tissus à âme drop-stitch. Nous produisons des échantillons de pré-production avec vos couleurs de marque, votre logo et votre emballage pour validation.
    - step: '04'
      title: Audit usine CE & conformité
      desc: Chaque commande OEM inclut la documentation de conformité — déclaration CE de conformité, enregistrements de traçabilité ISO 9001, rapport de conformité sociale BSCI et déclarations de matériaux REACH.
    - step: '05'
      title: Production en série & contrôle en ligne
      desc: Les campagnes de production suivent notre checklist qualité en 100 points. Chaque unité subit un test de rétention de pression de 24 heures, un test de pelage des coutures et une inspection visuelle avant emballage.
    - step: '06'
      title: Logistique FOB Qingdao & expédition
      desc: Les produits finis sont palettisés, filmés et chargés en conteneur au port de Qingdao. Nous gérons toute la documentation d’export, le dédouanement et fournissons un suivi d’expédition en temps réel.
capabilities_section:
  eyebrow: Capacités de production
  title: Ce que nous fabriquons
  subtitle: Six capacités de production clés pour les partenaires B2B du monde entier.
  items:
    - title: Fabrication de planches de SUP drop-stitch
      desc: Lamination d’âme drop-stitch sur toute la longueur pour des planches de stand-up paddle rigides à haute pression (15 à 20 PSI). Longueur, largeur, épaisseur, profil de rocker et design graphique personnalisés.
    - title: Production de bateaux gonflables PVC
      desc: Annexes, tenders et bateaux de sport en PVC soudés haute fréquence. Configurations multi-compartiments multiples, options de plancher (lattes, pont gonflable, enroulable) et intégration d’accessoires.
    - title: Fabrication de RIB en Hypalon
      desc: Flotteurs CSM Hypalon de qualité commerciale collés sur des coques en fibre de verre ou aluminium à V profond. Longueurs de 3,3 m à 6,0 m pour les opérations de patrouille, de sauvetage, de tourisme et de plongée.
    - title: Marque blanche & personnalisation
      desc: 'Service complet de marque blanche : sérigraphie ou transfert thermique de votre logo, emballage à votre marque (boîtes retail, sacs de transport), manuels utilisateur dans votre langue et enregistrement de codes-barres/UPC.'
    - title: Conception de moules & outillages sur mesure
      desc: Équipe d’ingénierie 3D CAO/FAO interne. Nous concevons et fabriquons des moules en aluminium et en matériaux composites pour des formes de coque uniques, des configurations de pont et des points de fixation d’accessoires.
    - title: Accessoires OEM & kitting
      desc: Gilets de sauvetage (CE 12402), pompes double action, pagaies carbone/nylon, kits de réparation, sacs de transport et leashs. Kitting complet et packaging ensemble pour une présentation prête à la vente.
experience_section:
  eyebrow: Expérience terrain
  title: Des partenariats qui ont bâti des marques
  subtitle: Des histoires réelles de marques et d’organisations ayant choisi Paddle Board Overstock pour leur fabrication OEM/ODM.
  stories:
    - quote: Nous sommes venus chez Paddle Board Overstock avec un croquis sur une serviette et une liste d’exigences. Huit mois plus tard, nous avions un produit prêt pour la production qui a réussi la certification CE du premier coup.
      narrative: Une startup européenne avec un design de SUP novateur s’est adressée à Paddle Board Overstock pour une fabrication ODM. L’équipe R&D d’Paddle Board Overstock a conduit le concept à travers la conception CAO, l’analyse structurelle par éléments finis, la simulation hydrodynamique, la création du moule, la fabrication du prototype et l’outillage de production. Le fondateur de la startup s’est rendu trois fois à Qingdao pendant le processus. Le produit final a obtenu la certification CE sans aucune modification — un résultat que le fondateur attribue à la compréhension dès le départ des exigences réglementaires européennes par l’équipe d’ingénierie d’Paddle Board Overstock.
      context: Lancement d’une marque européenne de SUP, 2023-2024
      source: Fondateur de la marque
    - quote: Le niveau de protection par NDA et de sécurité de la PI chez Paddle Board Overstock nous donne la confiance nécessaire pour partager nos conceptions propriétaires. Ils traitent notre PI comme la leur.
      narrative: Une entreprise américaine d’équipement nautique détenant une technologie de valve propriétaire recherchait un partenaire de fabrication capable de protéger sa PI tout en produisant à grande échelle. Après avoir audité cinq fabricants chinois, elle a choisi Paddle Board Overstock pour ses protocoles de protection de la PI, sa gestion sécurisée des fichiers de conception et sa volonté de signer des NDA stricts. Ce partenariat a produit trois gammes de produits en quatre ans, sans aucun incident de PI.
      context: Entreprise américaine d’équipement nautique, partenariat OEM depuis 2021
      source: Vice-président des opérations
