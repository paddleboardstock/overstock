breadcrumb: Fabricant OEM/ODM
tldr:
  summary: Paddle Board Overstock est un fabricant OEM/ODM intervenant directement depuis son usine. Site de 12 000 m² certifié ISO 9001:2015, capacité annuelle de 15 000 unités, conformité CE/BSCI/REACH/UKCA, MOQ réduits à partir de 2 à 10 unités.
  points:
    - Usine de Qingdao de 12 000 m² certifiée ISO 9001:2015
    - Capacité annuelle de 15 000 unités avec 200 à 300 ouvriers qualifiés
    - Conformité CE 2013/53/EU, UKCA, BSCI, REACH
    - 'MOQ réduits : 2 à 5 unités (RIB), 5 à 10 unités (SUP) pour les modèles standards'
    - Export vers plus de 50 pays, expédition FOB Qingdao
