hero:
  tagline: Histoires de réussite
  title: Résultats réels des<br />créateurs d'entreprises liées à l'eau
  subtitle: Découvrez comment des clubs, des centres de villégiature et des entrepreneurs du monde entier ont construit des opérations de sports nautiques rentables avec l'équipement et le soutien d'Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Témoignages de clients Paddle Board Overstock
stories:
  - title: Comment une station méditerranéenne a bâti une entreprise rentable de location de SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: Complexe balnéaire 5 étoiles — Grèce
    problem: La station avait besoin d'activités nautiques haut de gamme pour augmenter les taux de satisfaction et créer une nouvelle source de revenus, mais manquait d'équipement, d'infrastructures de sécurité et d'expertise du personnel.
    solution: Paddle Board Overstock a livré 50 planches SUP de marque personnalisée avec les couleurs et le logo du complexe, un système de sécurité complet comprenant un poste de secours et des lignes de bouées, ainsi qu'un programme de formation du personnel de 3 jours couvrant la manipulation de l'équipement, les instructions pour les clients et les protocoles de sécurité.
    result:
      - Plus de 300 activités clients réservées par semaine dès le premier mois
      - 'Scores de satisfaction des clients pour les activités nautiques : 4,8/5'
      - 'Nouveau revenu annexe annuel : 180 000 $'
      - Zéro incident de sécurité lors de la première saison d'exploitation
      - Coût de remplacement des équipements réduit de 40 % par rapport au fournisseur précédent
    quote:
      text: "Paddle Board Overstock ne s'est pas contenté de livrer des planches : ils nous ont aidés à créer une expérience client complète. Notre programme de sports nautiques est passé de zéro à un moment phare de la station en une seule saison."
      author: Directeur général du complexe
    cta_text: Créez votre solution resort
    cta_href: /solutions/resorts
  - title: Comment une startup australienne a construit une marque d'eau en 90 jours
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Entrepreneur pour la première fois — Australie
    problem: Un passionné de plein air souhaitait lancer sa propre marque de SUP pour le marché australien, mais n'avait aucune expérience en matière de fabrication, aucune relation avec les fournisseurs et un capital limité.
    solution: Le package de lancement de marque d'Paddle Board Overstock comprenait une consultation sur la sélection des produits, une conception de logo et de couleur personnalisée, un emballage de vente au détail de marque avec étiquettes volantes, une documentation de certification CE et une expédition FOB à Sydney.
    result:
      - Première expédition de 200 planches livrée en 75 jours après le premier contact
      - Marque lancée sur Shopify + Amazon AU moins de 2 semaines après l'arrivée
      - Stock initial épuisé en 45 jours
      - 'Marge moyenne : 55 % sur les prix de détail'
      - 'Deuxième commande : 500 unités passées moins de 60 jours après le lancement'
    quote:
      text: J'avais l'idée de la marque mais aucune connaissance en fabrication. Paddle Board Overstock m'a littéralement tenu la main tout au long du processus, depuis le choix du bon modèle de planche jusqu'au déballage de mon premier envoi. 90 jours du rêve à la livraison.
      author: Fondateur, marque australienne de SUP
    cta_text: Lancez votre marque
    cta_href: /solutions/entrepreneurs
  - title: Comment un club de plage thaïlandais est passé de 10 à 80 planches
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Club de sports nautiques — Thaïlande
    problem: Un petit club de SUP en bord de mer à Phuket avait besoin de passer d'une activité de loisir à une entreprise de location professionnelle au service des touristes, mais ne parvenait pas à trouver un fournisseur d'équipement fiable offrant une qualité et des prix constants.
    solution: En commençant par le forfait de démarrage Paddle Board Overstock's Club (10 planches, pagaies, équipement de sécurité, image de marque), le club s'est développé grâce au programme Premium Package sur 18 mois.
    result:
      - Passage de 10 à 80 planches en 18 mois, avec une qualité et des prix constants
      - Ajout de locations de kayaks et de pédalos auprès du même fournisseur
      - La personnalisation aux couleurs du club a renforcé la notoriété de la marque auprès des touristes
      - Coûts de maintenance réduits de 60 % par rapport aux équipements économiques précédents
      - Désormais 150+ locations quotidiennes en haute saison
    quote:
      text: 'Le forfait Club Starter était le point d’entrée idéal. Au fur et à mesure que notre entreprise se développait, Paddle Board Overstock grandissait avec nous : même qualité, même prix, pas de surprises.'
      author: Propriétaire du club, Phuket
    cta_text: Démarrez votre forfait club
    cta_href: /solutions/clubs
  - title: Comment une chaîne de villégiature des Caraïbes a standardisé les sports nautiques dans 5 propriétés
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Chaîne de villégiature — Caraïbes
    problem: Une chaîne de complexes hôteliers de luxe comptant 5 propriétés avait besoin d'une qualité et d'une image de marque constantes pour les équipements de sports nautiques sur tous les sites, avec un approvisionnement centralisé et une planification des remplacements saisonniers.
    solution: Paddle Board Overstock a livré une flotte multi-propriétés de 300 SUP et 100 kayaks avec une marque unifiée, un inventaire partagé de pièces de rechange et un calendrier de remplacement annuel avec tarification au volume.
    result:
      - Expérience client standardisée dans les 5 propriétés
      - Réduction des coûts de 30 % grâce aux achats groupés et aux tarifs de volume
      - Un stock centralisé de pièces détachées a réduit les temps d'arrêt de 80 %
      - Le programme annuel de renouvellement des équipements a éliminé la course de fin de saison
      - La participation des clients aux sports nautiques a augmenté de 45 % en glissement annuel
    cta_text: Concevez votre programme resort
    cta_href: /solutions/resorts
