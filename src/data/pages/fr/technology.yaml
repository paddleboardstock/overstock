testimonial:
  quote: Ce qui m'a convaincu, c'est la construction. Des coutures soudées par fusion au lieu de la colle, un noyau drop-stitch qui paraît solide à 15 PSI, et aucune oscillation lorsque je recule pour tourner. Deux ans plus tard, aucun problème.
  author: Marta Keller
  title: Acheteur vérifié
  company: Pagaie de tourisme sur lac
  location: Allemagne
sections:
  - title: Drop-Stitch Noyau
    standard: Pression de fonctionnement 12-15 PSI
    description: Des milliers de fils de polyester internes relient les couches supérieures et inférieures, créant une structure rigide à 12-15 PSI. C'est la même technologie utilisée pour les planches de paddle professionnelles. Notre densité drop-stitch est optimisée par modèle pour l'équilibre idéal entre rigidité et poids.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagramme du noyau DS
  - title: Marine Grade PVC
    standard: Soudé par fusion | UV / eau salée / testé à l'abrasion
    description: Tissu PVC laminé multi-couches évalué pour les environnements marins. Chaque couche est soudée par fusion plutôt que collée, éliminant les risques de délamination. Testé pour résistance UV (1 000 + heures), corrosion par l'eau salée et abrasion.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Couche PVC
  - title: Système de pont EVA
    standard: Motifs confortables, adhérents et de la série artistique
    description: Le mousse de pont complet EVA offre adhérence, amorti et l'apparence caractéristique de la série artistique. Les panneaux découpés avec précision sont disposés en motifs homogènes — pas de graphismes imprimés à rayer, pas de cire nécessaire.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Pont EVA
  - title: Système de rails à triple couche
    standard: Fusion thermosoudée | Surconstruite dans la zone de plus grande contrainte
    description: Les bandes de rail sont en fusion thermosoudée triple couche et enveloppées autour du bord de la planche — la zone de plus grande contrainte sur tout gonflable. C'est là que les planches bon marché échouent en premier ; les nôtres sont surconstruites.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Système de rail
