testimonial:
  quote: Ce qui distingue Paddle Board Overstock, c'est leur science des matériaux. Ils ne se contentent pas d'assembler des composants — les composés PVC, les paramètres de soudage et la structure stratifiée sont conçus en interne. Cette intégration verticale se voit dans le produit final.
  author: David Park
  title: Responsable du développement produit
  company: Bluewater Sports Equipment
  location: Australie

sections:
  - title: Noyau drop-stitch
    standard: Pression de service 12-15 PSI
    description: Des milliers de fils de polyester internes relient les couches supérieure et inférieure, créant une structure rigide à 12-15 PSI. C'est la même technologie que celle des planches de paddle professionnelles et des bateaux de course pneumatiques. La densité drop-stitch est optimisée par modèle pour l'équilibre idéal entre rigidité et poids.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Schéma du noyau drop-stitch
  - title: PVC de qualité marine
    standard: Soudé par fusion | Testé UV / eau de mer / abrasion
    description: Toile PVC laminée multicouche conçue pour les environnements marins. Chaque couche est soudée par fusion plutôt que collée, éliminant les risques de délamination. Testée pour la résistance aux UV (ASTM G154, 1 000+ heures), à la corrosion en eau de mer (ISO 9227) et à l'abrasion (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Couche de PVC
  - title: Flotteurs Hypalon
    standard: Caoutchouc CSM | Résistant UV / produits chimiques / températures extrêmes
    description: Utilisé sur les modèles RIB, le caoutchouc Hypalon (CSM) offre une résistance supérieure aux UV et aux produits chimiques par rapport au PVC standard. Les flotteurs Hypalon conservent leur flexibilité à des températures extrêmes et résistent à la dégradation due au carburant et à l'huile. Toutes les coutures sont réalisées à la main par des techniciens certifiés.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Plancher Air Deck
    standard: Gonflable haute pression | Remplace le contreplaqué/aluminium
    description: Système de plancher gonflable haute pression remplaçant les planchers traditionnels en contreplaqué ou lattes d'aluminium. Réduit le temps de montage, le poids total et le volume de rangement tout en offrant une rigidité suffisante pour rester debout, pêcher et marcher. Testé pour supporter une charge répartie de 200+ kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Plancher gonflable

