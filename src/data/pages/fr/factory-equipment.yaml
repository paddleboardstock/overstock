hero:
  tagline: Équipement
  title: Équipements et machines de fabrication
  subtitle: Équipements de qualité industrielle couvrant la découpe, la soudure, l’impression et l’assemblage
  back_label: Retour à l’usine
  back_link: /factory
categories:
  - title: Découpe et préparation des matériaux
    items:
      - name: PVC Machine de découpe automatique
        spec: CNC-contrôlé, 6,5 m × 2,5 m, précision de 0,1 mm
        desc: Machine de découpe automatique contrôlée par ordinateur pour PVC et drop-stitch tissus. Le logiciel de nesting optimise l’utilisation des matériaux à moins de 5 % de déchets.
      - name: Écarteur de tissu
        spec: Largeur maximale de 3 m, alimentation contrôlée par la tension
        desc: Pose le tissu en une ou plusieurs couches avec une ou plusieurs couches contrôlées pour éviter toute déformation avant la coupe.
  - title: Soudage et collage
    items:
      - name: Machine à thermoscellement
        spec: Soudure à air chaud, variable 200–600 °C, 0,5–5 m/min
        desc: Machine à thermoscellement à air chaud pour coller et souder PVC des laminés, des bandes de rail et des joints de chambre. Utilisée pour le scellage, le scellement et drop-stitch la fusion des joints du noyau.
      - name: Presse RF diélectrique
        spec: 15 kW, platine 2000 × 600 mm
        desc: Presse à soudure radiofréquence pour les joints longitudinaux principaux, les assemblages entre le soudeur et le tube et la fabrication en grande chambre.
      - name: CNC-Soudeur RF contrôlé
        spec: 8 kW, table XY 2500 × 1200 mm
        desc: Soudure programmable à couture courbe pour des géométries complexes, embossage de logo et patchwork de précision.
  - title: Art de deck & finition
    items:
      - name: EVA Machine à découper des terrasses
        spec: CNC Coupe au couteau, 2 m de largeur
        desc: Découpe précise des EVA panneaux en mousse de terrasse pour des motifs de terrasse de la série Art. Chaque panneau est découpé à la hauteur pour un ajustement complet du pont sans couture.
      - name: Presse à lamination de pont
        spec: Contrôle de température et pression
        desc: Fixe EVA les panneaux du pont à la surface du plancher avec une adhésion constante sur toute la surface du plateau.
  - title: SUP Impression et décoration
    items:
      - name: Imprimante numérique
        spec: Jet d’encre haute résolution, largeur d’impression allant jusqu’à 2 m
        desc: Impression numérique directement sur tissu pour SUP des graphiques de deck en couleur intégrale. Imprime des motifs personnalisés, des dégradés et des images de qualité photo avec UV des encres à base d’eau résistantes.
      - name: Machine à sérigraphie
        spec: Enregistrement manuel et semi-automatique, multicolore
        desc: Sérigraphie pour SUP logos en carton, marques de marque et motifs répétitifs. Offre des impressions durables et opaques avec une saturation colorée vibrante.
  - title: Montage final
    items:
      - name: Station de couple de soupapes
        spec: Test de fonctionnement calibré sur 10 cycles
        desc: Il installe et serre les soupapes de gonflage, puis teste chaque soupape sur 10 cycles d’ouverture/fermeture.
      - name: Boîte à palmes et poseur à anneau D
        spec: Aligné sur gabarits, durci par adhésif
        desc: Positionnez et lient les boîtes à dérives, les anneaux en D et les poignées aux emplacements exacts des plateaux selon les spécifications du modèle.
  - title: Tests et contrôle qualité
    items:
      - name: Testeur universel de traction
        spec: Capacité de 50 kN
        desc: Tests de force de rupture, d’allongement à la rupture et de propagation de déchirure pour les lots de tissus.
      - name: Plateforme d’essai de rétention d’air
        spec: Programmable, maintien de pression de 30 minutes
        desc: Test automatisé de maintien de pression pour chaque chambre de tube avant l’assemblage.
      - name: Testeur de peeling de couture
        spec: Déplacement motorisé de 180° à 100 mm/min
        desc: Tests de résistance au décollement des soudures et des joints collés selon le protocole interne.
      - name: Chambre d’altération à l’arc xénon
        spec: Exposition 2000 h
        desc: UV Tests de résistance pour le changement de couleur et la rétention de la force.
cta:
  title: Vous souhaitez une visite d’usine ?
  desc: Nous accueillons les visiteurs dans notre installation de Weihai. Découvrez nos équipements et nos procédés en personne.
  label: Planifiez une visite →
  link: /contact
tldr:
  summary: Paddle Board Overstock exploite 12 000 m² d'espace de production équipé de machines automatiques de découpe PVC, de soudeuses RF haute fréquence, de stations de découpe et de finition de ponts EVA, de presses de thermoscellage et de dispositifs d'assemblage final. Chaque planche subit un test de maintien de pression à 1,25 fois la pression nominale.
  points:
    - Découpe automatique PVC avec une précision CNC
    - Soudage RF haute fréquence pour l'intégrité des coutures
    - Stations de découpe de pont EVA et de finition manuelle
    - Dispositifs de serrage des vannes et d'assemblage des boîtes d'ailerons
    - Test de maintien de pression à 1,25 fois la pression nominale sur 100 % des planches
