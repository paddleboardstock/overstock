workshops:
  - title: Production de Planches SUP
    description: '4 lignes d''assemblage parallèles pour planches SUP gonflables. Chaque ligne peut produire 50 à 80 planches par équipe. Les postes d''impression numérique et de sérigraphie fonctionnent en parallèle. Capacité SUP annuelle : 8,000+ planches.'
    output: '8,000+ SUPs/an'
  - title: Production de Bateaux RIB
    description: 'Atelier dédié aux coques en fibre de verre avec 6 postes de moulage pour coques RIB jusqu''à 7.6 m. La zone de soudage et d''assemblage des tubes traite 3 à 5 RIB simultanément. Capacité RIB annuelle : 2,000+ bateaux.'
    output: '2,000+ RIBs/an'
  - title: Bateaux Gonflables & Annexes
    description: 'Lignes de production polyvalentes pour bateaux gonflables, kayaks et annexes. Les postes de soudage à air chaud, les presses diélectriques RF et les postes d''assemblage sont reconfigurés selon le mix de commandes. Capacité annuelle : 5,000+ unités.'
    output: '5,000+ unités/an'
  - title: Équipements de Sécurité
    description: 'Zone de production en salle blanche séparée pour les gilets de sauvetage et équipements de sécurité. Postes dédiés de couture, d''insertion de mousse et de test. Capacité annuelle en gilets de sauvetage : 50,000+ unités.'
    output: '50,000+ gilets de sauvetage/an'

oem_capacity:
  moq: 'SUP : 5–10 unités | RIB : 2–5 unités | Kayak/Annexe : 10–20 unités | Moule personnalisé : 200+ unités'
  lead_time: 'Délai standard 30–45 jours. Échantillons 15–20 jours. Production accélérée disponible.'
  payment: 'T/T 30 % d''acompte + 70 % avant expédition. L/C, Western Union acceptés.'
