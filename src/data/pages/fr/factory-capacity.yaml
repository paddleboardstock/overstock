hero:
  tagline: Capacité de Production
  title: Capacité de Fabrication & Production Annuelle
  subtitle: Installation de 12,000 m² produisant 15,000 bateaux par an, avec une marge d'expansion

intro: Aquafarer exploite l'une des plus grandes usines dédiées à la fabrication d'embarcations gonflables à Qingdao, en Chine. Notre usine de 12,000 m² est organisée en six ateliers spécialisés fonctionnant en parallèle, ce qui nous donne la capacité de produire 15,000 bateaux par an sur les gammes SUP, kayak, annexe, RIB et équipements de sécurité.

highlights:
  - value: 12,000 m²
    label: Surface de fabrication totale
