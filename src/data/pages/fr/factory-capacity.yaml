hero:
  tagline: Capacité de production
  title: Capacité de fabrication et production annuelle
  subtitle: Installations de 12 000 m² produisant 15 000 planches par an avec possibilité de montée en charge
intro: Paddle Board Overstock exploite l'une des plus grandes installations de fabrication de planches gonflables SUP dédiées à Weihai, en Chine. Notre usine de 12 000 m² est organisée en six ateliers spécialisés fonctionnant en parallèle, nous permettant de produire 15 000 planches par an pour les gammes all-around, touring et art-series SUP.
highlights:
  - value: 12,000 m²
    label: Superficie totale de l'usine
    detail: À travers 6 ateliers spécialisés
  - value: 15,000
    label: Tableaux produits annuellement
    detail: Gammes all-around, touring et art-series SUPs
  - value: 200-300
    label: Main-d'œuvre qualifiée
    detail: 25+ ingénieurs, 2 équipes/jour
  - value: 50+
    label: Pays d'exportation
    detail: UE, États-Unis, Australie, Moyen-Orient, Asie
  - value: 2-3
    label: Jours ouvrables pour l'expédition
    detail: Les commandes en stock quittent rapidement Weihai
  - value: 10+
    label: Années d'expérience à l'export
    detail: Depuis 2012
workshops:
  - title: SUP Production de planches
    description: "4 lignes d'assemblage parallèles pour planches gonflables SUP. Chaque ligne peut produire 50 à 80 planches par équipe. Les stations d’impression numérique et de sérigraphie fonctionnent simultanément. Capacité annuelle SUP : 8 000+ planches."
    output: 8 000+ SUPs/an
  - title: Art de deck & EVA finition
    description: Atelier dédié à la finition des planches art-series. Découpe EVA précise, motifs de planches posés à la main et coupe finale. La capacité annuelle couvre l’ensemble de la gamme art-series.
    output: Gamme complète art-series
  - title: Drop-Stitch Laminage
    description: 'Les lignes de laminage thermique assemblent les cœurs drop-stitch aux laminés extérieurs PVC. Les bandes de rails sont fusionnées en triple couche pour une résistance étanche. Capacité annuelle : 15 000+ cœurs.'
    output: 15 000+ cœurs/an
  - title: Accessoires et emballage
    description: Lignes d'assemblage et de conditionnement des accessoires pour pompes, pagaies, laisses et kits de réparation. Les planches sont emballées sous vide, mises en boîte et palettisées pour l'expédition dans le monde entier.
    output: Packages complets, prêts à expédier
