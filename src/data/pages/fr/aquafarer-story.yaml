hero:
  tagline: Notre Histoire
  title: "Aquafarer — Ingénierie de la Liberté sur l'Eau"
  subtitle: "D'un atelier côtier à un fabricant maritime mondial — notre parcours repose sur une conviction inébranlable : les embarcations doivent être conçues comme si elles comptaient, parce qu'elles comptent."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Usine Aquafarer et installation de fabrication maritime à Qingdao

