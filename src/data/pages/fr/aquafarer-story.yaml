timeline:
  - year: '2012'
    title: 'Fondation de la fabrication maritime'
    body: "Aquafarer a débuté comme un atelier spécialisé d'embarcations gonflables à Qingdao, en Chine, dédié à l'artisanat maritime et à la fabrication de bateaux pneumatiques. L'accent initial était mis sur la construction de produits gonflables fiables grâce à une expérience pratique en ingénierie et à une discipline de fabrication."
  - year: '2015'
    title: 'Première exportation et certification CE'
    body: "Les premières commandes d'exportation ont atteint le Japon et la Corée. La certification CE a été obtenue pour les gammes de produits principales, marquant l'entrée d'Aquafarer sur les marchés internationaux. L'entreprise a commencé à servir des utilisateurs commerciaux et récréatifs au-delà de la Chine."
  - year: '2018'
    title: "Extension de l'usine"
    body: 'Déménagement dans une installation de production de 12 000 m². Ajout de lignes de soudage HF et de capacité de production drop-stitch, permettant une fabrication à plus grande échelle et des systèmes de contrôle qualité améliorés.'
  - year: '2020'
    title: 'Création du centre R&D'
    body: "Ouverture d'un centre R&D dédié avec laboratoire de tissus PVC, bassin d'essais hydrodynamiques et studio de simulation CAO/EF. Le développement de produits s'est concentré sur la construction légère, la durabilité améliorée et la conception centrée sur l'utilisateur."
  - year: '2022'
    title: 'Certification et croissance mondiale'
    body: "Obtention de la certification ISO 9001. Expansion à 14 ingénieurs R&D et 200+ collaborateurs. Les produits ont atteint des clients en Europe, aux Amériques et en Asie-Pacifique grâce à des partenariats de distribution et d'OEM."
  - year: '2024'
    title: "Studio d'innovation et de design"
    body: "Lancement d'un studio de design et d'innovation complet pour des projets ODM sur mesure, du concept à la production. Renforcement des applications marines professionnelles, y compris les appels d'offres de sauvetage, commerciaux et gouvernementaux."
  - year: '2026'
    title: "Construire l'avenir de l'exploration aquatique"
    body: "Aujourd'hui, Aquafarer continue de développer des bateaux pneumatiques, des systèmes SUP et des solutions marines personnalisées — connectant les personnes et les organisations aux eaux du monde. 50+ pays desservis, 15 000 unités de capacité annuelle."

content_founding:
  tagline: Les débuts
  title: 'Né sur le front de mer'
  subtitle: 'Aquafarer a démarré dans un atelier côtier à Qingdao avec un bateau et une vision : construire des embarcations gonflables capables de résister à de véritables conditions marines.'
  paragraphs:
    - "En 2012, nos fondateurs ont identifié une lacune sur le marché — la plupart des bateaux pneumatiques étaient soit abordables mais peu fiables, soit de haute qualité mais prohibitivement chers. Ils croyaient qu'il y avait de la place pour un fabricant offrant à la fois qualité et valeur."
    - "La première coque a été construite à la main, testée dans les eaux locales et affinée sur la base des retours réels des pêcheurs et des petits opérateurs commerciaux. Cette boucle de rétroaction — construire, tester, écouter, améliorer — reste au cœur de notre philosophie d'ingénierie aujourd'hui."
    - "En 2015, le bouche-à-oreille s'était répandu au-delà de Qingdao. Des distributeurs internationaux ont commencé à demander des échantillons. Ce qui avait commencé comme un atelier local devenait un fournisseur mondial."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Atelier de production et fabrication des débuts d'Aquafarer

content_growth:
  tagline: Croissance et innovation
  title: "De l'atelier à une installation de 12 000 m²"
  subtitle: "Des investissements continus dans les personnes, l'équipement et les processus ont transformé Aquafarer en une installation de fabrication maritime moderne."
  paragraphs:
    - "À mesure que la demande augmentait, notre installation s'agrandissait. Nous sommes passés d'un petit atelier à une usine de 12 000 m² avec des lignes de production dédiées aux bateaux RIB, bateaux pneumatiques, planches SUP et accessoires."
    - "Nous avons investi dans des machines de découpe CNC, des équipements de soudage haute fréquence, des lignes de production drop-stitch et des bancs d'essai complets — nous permettant de contrôler chaque aspect de la qualité de production."
    - "Aujourd'hui, notre équipe de 200-300 personnes comprend des ingénieurs maritimes, des scientifiques des matériaux, des spécialistes du contrôle qualité et des artisans qualifiés — dont beaucoup sont chez Aquafarer depuis les premiers jours."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Installation de production moderne d'Aquafarer

founder:
  tagline: Le fondateur
  title: Conçu par un homme de mer
  subtitle: >-
    Le fondateur David Chen réunit expertise de fabrication et passion de toute une vie pour les
    sports nautiques — une combinaison qui définit l'approche d'Aquafarer en matière de développement
    produit.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Fondateur d'Aquafarer
  story:
    - >-
      David Chen a grandi sur la côte de Qingdao, où la mer n'était pas une destination de vacances
      mais un mode de vie. Il a passé sa jeunesse à faire du kayak, de la voile et de la pêche dans
      la mer Jaune — des expériences qui lui ont donné une compréhension intuitive de ce que les
      embarcations doivent endurer.
    - >-
      Avant de fonder Aquafarer, David a passé une décennie dans la fabrication nautique, en
      couvrant la production, la qualité et le commerce international. Il a piloté des programmes OEM
      pour des marques européennes et nord-américaines, apprenant de première main les standards et
      les attentes des marchés mondiaux.
    - >-
      En 2012, il a fondé Aquafarer avec une mission simple — construire des embarcations gonflables
      auxquelles il confierait sa propre famille sur l'eau. Ce critère personnel (l'utiliserais-je
      moi-même ?) reste le test final pour chaque produit qui quitte l'usine.
    - >-
      Aujourd'hui, David dirige la stratégie produit et supervise l'équipe R&D : il examine
      personnellement les nouveaux designs et teste les prototypes sur les eaux de Qingdao. Il est
      convaincu que les grands produits naissent de la compréhension à la fois de l'ingénierie et de
      l'expérience.

philosophy:
  tagline: 'Philosophie de la marque'
  title: "Ingénierie de la Liberté sur l'Eau"
  body: "La liberté sur l'eau ne concerne pas seulement le mouvement. Elle représente la découverte de nouveaux lieux, la création d'expériences en plein air, la connexion des personnes avec la nature et la réalisation de missions professionnelles. L'ingénierie rend cette liberté possible."
  pillars:
    - title: 'Fiabilité avant tout'
      body: 'Les environnements aquatiques exigent la confiance. Les produits Aquafarer sont conçus pour la stabilité, la durabilité, la sécurité et des performances constantes.'
    - title: "Conception centrée sur l'humain"
      body: 'Les produits doivent servir les personnes, pas la technologie. Chaque décision de conception commence par la compréhension de la façon dont les gens utilisent les embarcations, où ils explorent et à quels défis ils font face.'
    - title: 'Exploration accessible'
      body: "L'eau ne devrait pas appartenir uniquement aux experts. Aquafarer crée des équipements qui permettent à davantage de personnes de vivre en toute sécurité des expériences sur les rivières, les lacs, les océans et les environnements côtiers."
    - title: 'Innovation continue'
      body: "L'innovation ne consiste pas seulement à créer de nouveaux produits. C'est améliorer chaque détail — matériaux, structures, fabrication et expérience utilisateur."

engineeringDna:
  tagline: "ADN d'ingénierie"
  title: 'Comment Aquafarer crée des produits'
  areas:
    - title: 'Science des matériaux'
      body: "Aquafarer se concentre sur la sélection de matériaux appropriés pour différents environnements marins. Les considérations clés incluent la résistance à l'abrasion, la résistance aux UV, la stabilité à la pression et la durabilité à long terme."
      items: ["Résistance à l'abrasion", 'Résistance aux UV', 'Stabilité à la pression', 'Durabilité à long terme']
    - title: 'Ingénierie structurelle'
      body: "Les embarcations gonflables nécessitent un équilibre précis entre rigidité, poids, portabilité et stabilité. L'ingénierie Aquafarer se concentre sur l'optimisation de ces facteurs grâce à la technologie drop-stitch et à la construction avancée des joints."
      items: ['Rigidité', 'Optimisation du poids', 'Portabilité', 'Stabilité']
    - title: 'Précision de fabrication'
      body: 'Chaque produit passe par des processus contrôlés : préparation des matériaux, découpe de précision, soudage et assemblage, montage, inspection qualité et vérification des performances.'
      items: ['Préparation des matériaux', 'Découpe de précision', 'Soudage & Assemblage', 'Montage & CQ']
    - title: "Ingénierie des scénarios d'utilisation"
      body: "Les produits sont développés autour d'applications réelles — loisirs, aventure et usage professionnel — garantissant que chaque conception répond aux exigences spécifiques de son environnement prévu."
      items: ['Loisirs', 'Aventure', 'Professionnel', 'Commercial']

