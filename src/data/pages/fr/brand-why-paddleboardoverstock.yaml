features3_reasons:
  tagline: Pourquoi choisir Paddle Board Overstock
  title: 'Sept raisons de s''associer à nous'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Une vraie fabrication, pas du négoce'
      description: 'Nous possédons et exploitons une usine de 12 000 m². En travaillant avec Paddle Board Overstock, vous êtes en relation directe avec les personnes qui conçoivent, réalisent et fabriquent vos produits, sans intermédiaires.'
      icon: tabler:building-factory
    - title: '2. Une approche axée sur l''ingénierie'
      description: 'Notre processus de conception part de l''usage réel, pas de la catégorie du produit. Nous optimisons la forme de la coque, le choix des matériaux et la configuration en fonction de l''utilisation effective du bateau.'
      icon: tabler:engine
    - title: '3. Qualité certifiée'
      description: 'Certification CE, système qualité ISO, conformité BSCI, conformité REACH, approbation USCG. Nos 64 modèles certifiés CE respectent les normes internationales, pas seulement en théorie.'
      icon: tabler:certificate
    - title: '4. OEM/ODM flexible'
      description: 'Couleurs des flotteurs, disposition de la console, marquage, emballage : nous personnalisons selon vos spécifications. Aucune pression sur les quantités minimales. Commencez par un prototype et montez en échelle en toute confiance.'
      icon: tabler:adjustments
    - title: '5. Logistique mondiale'
      description: 'Entrepôt aux États-Unis (Californie), expédition directe depuis Qingdao, fret aérien pour les commandes urgentes. Nous gérons les formalités douanières et la documentation.'
      icon: tabler:truck-delivery
    - title: '6. Assistance à vie'
      description: 'Nous soutenons des bateaux construits il y a 20 ans. Pièces détachées d''origine, conseils techniques, guides de réparation : notre équipe est disponible quand vous avez besoin de nous.'
      icon: tabler:lifebuoy
    - title: '7. Des spécifications honnêtes'
      description: 'Charges réelles, dimensions réelles, poids réel. Aucune exagération marketing. Ce que nous publions est ce que vous recevez, vérifié par des tests indépendants.'
      icon: tabler:ruler-measure
testimonials:
  tagline: La confiance des marques du monde entier
  title: Ce que disent nos partenaires
  items:
    - content: 'Nous avons travaillé avec plusieurs fabricants en Chine, mais Paddle Board Overstock se distingue par son support d''ingénierie et sa qualité constante. Ils traitent notre marque comme la leur.'
      name: '— Partenaire OEM, marque européenne de sports nautiques'
    - content: 'Leurs RIB en Hypalon sont en service dans notre flotte depuis plus de 5 ans. Entretien minimal, excellente résistance aux UV. La garantie de 5 ans sur les flotteurs nous donne confiance.'
      name: '— Exploitant de flotte, groupe hôtelier du Moyen-Orient'
    - content: 'L''équipe d''Paddle Board Overstock nous a aidés à développer une planche de SUP sur mesure, du concept à la production, en 90 jours. La qualité a dépassé nos attentes.'
      name: '— Distributeur, sports nautiques australiens'
cta:
