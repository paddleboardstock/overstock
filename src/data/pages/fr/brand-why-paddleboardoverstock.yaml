features3_reasons:
  tagline: Pourquoi choisir Paddle Board Overstock
  title: Sept raisons de s’associer à nous
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Fabrication réelle, pas commerce
      description: Nous possédons et exploitons une usine de 12 000 m². Lorsque vous achetez chez Paddle Board Overstock, vous achetez directement auprès des personnes qui conçoivent, ingénient et construisent votre carte — sans intermédiaires, sans marge de détail.
      icon: tabler:building-factory
    - title: 2. Approche dirigée par l’ingénierie
      description: Notre processus de conception commence par le cas d’usage, pas par la catégorie de produit. Nous optimisons la forme de la coque, le choix des matériaux et la configuration selon la manière dont la carte sera réellement utilisée.
      icon: tabler:engine
    - title: 3. Qualité éprouvée
      description: Chaque carte est testée à 100 % par pression à 1,25 fois la classification PSI avant d’être expédiée. Un taux sans défaut de 99,3 % — mesuré sur chaque lot, pas seulement déclaré.
      icon: tabler:shield-check
    - title: 4. Conception du pagayeur d’abord
      description: 'Illustrations de terrasse, séries de couleurs, supports d’accessoires et packs complets — des planches conçues autour du vrai paddle : randonnée, yoga, pêche, fitness et plaisir en famille.'
      icon: tabler:swimming
    - title: 5. Logistique mondiale
      description: Livraison directe de notre usine de Weihai aux pagayeurs dans 50+ pays, avec suivi complet et gestion douane.
      icon: tabler:truck-delivery
    - title: 6. Soutien à vie
      description: Nous supportons les cartes que nous avons construites il y a des années. Pièces détachées authentiques, conseils techniques, conseils de réparation — notre équipe est disponible quand vous en avez besoin.
      icon: tabler:lifebuoy
    - title: 7. Spécifications honnêtes
      description: Vraies évaluations de charge, dimensions réelles, poids réel. Pas d’inflation marketing. Ce que nous publions, c’est ce que vous obtenez — vérifié par des tests indépendants.
      icon: tabler:ruler-measure
testimonials:
  tagline: Digne de confiance par des marques du monde entier
  title: Ce que disent nos partenaires
  items:
    - content: Ma planche est arrivée neuve d’usine avec tout dans la boîte. Deux saisons de pagaie hebdomadaire et elle retient toujours parfaitement l’air.
      name: — Sarah M., Pagayeuse du week-end, Floride
    - content: J'ai comparé les spécifications pendant des semaines avant d'acheter. Paddle Board Overstock était la seule marque publiant de vrais poids et de vraies pressions. Ce qu'ils listent correspond à ce que l'on obtient.
      name: — Tomasz K., Pagayeur de randonnée, Pologne
    - content: Toute la famille pagaye maintenant. Nous avons commencé avec une planche et avons fini avec quatre — la qualité a rendu le choix facile.
      name: — Angela R., Pagayeuse en famille, Australie
