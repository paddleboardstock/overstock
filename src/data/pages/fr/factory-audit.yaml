content_priorities:
  tagline: Ce que les clients vérifient
  title: 8 éléments que les acheteurs vérifient<br />à chaque visite d'usine
  subtitle: Sur la base des commentaires d'acheteurs de plus de 50 pays, voici les huit priorités que les clients évaluent avant de passer une commande B2B.
  items:
    - title: Véritable fabricant
      description: "Êtes-vous une véritable usine et non une société commerciale ? Les acheteurs vérifient : l'entité commerciale, les équipements de production réels, les employés qui utilisent les machines, les commandes de production en cours sur le terrain et la cohérence du site Web et de l'atelier."
      icon: tabler:building-factory
    - title: Produit adapté à l'application
      description: Le RIB correspond-il à leur cas d’utilisation spécifique ? Les opérateurs de centres de villégiature, de sauvetage, de plongée, de pêche et de patrouille ont des exigences fondamentalement différentes. Les acheteurs évaluent la disposition du pont, le matériau des tubes et les options d'équipement sur le bateau présenté.
      icon: tabler:target
    - title: Stabilité de la qualité et reproductibilité
      description: La 50ème unité est-elle aussi bonne que la 1ère ? Les acheteurs examinent les systèmes de contrôle qualité, les points de contrôle en cours de processus, le traitement des non-conformités et demandent à consulter les enregistrements de plusieurs cycles de production pour vérifier la cohérence.
      icon: tabler:repeat
    - title: Authenticité du document de conformité
      description: Les certificats CE sont-ils spécifiques à un modèle ? La DoC est-elle signée par une personne réelle ? La conformité peut-elle être vérifiée par numéro de coque ? Les acheteurs vérifient les réclamations générales par rapport à la documentation spécifique au modèle.
      icon: tabler:file-certificate
    - title: Exécution de la personnalisation
      description: L’usine peut-elle réellement fournir des configurations personnalisées ? Les acheteurs recherchent des preuves de projets personnalisés antérieurs, des échantillons de prototypes exposés, des dessins techniques et la possibilité de discuter des modifications techniques sur place.
      icon: tabler:adjustments
    - title: Délai et capacité
      description: "Les délais annoncés sont-ils réalistes ? Les acheteurs évaluent : le volume de production actuel, la capacité disponible, la taille de la main-d'œuvre, les niveaux de stock de matériaux et si l'usine dispose d'un système de planification de la production."
      icon: tabler:clock
    - title: Prix et conditions commerciales
      description: "Les prix sont-ils transparents ? Les prix FOB sont-ils clairs ? Les acheteurs vérifient : la répartition des prix unitaires, les coûts d'outillage, les coûts d'emballage et si l'usine peut gérer les conditions DDP ou CIF avec la documentation d'exportation appropriée."
      icon: tabler:currency-dollar
    - title: Après-vente et pièces de rechange
      description: "Que se passe-t-il après la livraison ? Les acheteurs évaluent : la disponibilité des pièces de rechange, le processus de garantie, les sections de tube de remplacement, le remplacement des vannes et si l'usine dispose d'un protocole après-vente documenté."
      icon: tabler:headset
content_tour:
  tagline: Itinéraire de visite d'usine
  title: Visite d'audit —<br />Ce que vous verrez
  subtitle: Notre visite d'usine standard suit un itinéraire défini conçu pour répondre aux questions des acheteurs à chaque station.
  items:
    - title: 1. Salle de réunion — Présentation de l'entreprise
      description: Licence commerciale, certificats ISO 9001 et BSCI, licences d'exportation et historique de l'entreprise. Aperçu rapide des capacités de production et de la portée de la conformité.
      icon: tabler:users
    - title: 2. Entrepôt de matières premières — Station IQC
      description: Dossiers d’inspection des matériaux entrants, certificats de lots de tissus, échantillons d’adhésifs et de matériel. Découvrez comment les matériaux sont testés avant d'entrer en production.
      icon: tabler:building-warehouse
    - title: 3. Fabrication de tubes — Soudage RF et collage manuel
      description: Processus de soudage ou de collage de tubes sous tension, démonstrations de tests de résistance des coutures et installation de vannes. Observez la construction chambre par chambre et les points de contrôle de qualité.
      icon: tabler:flame
    - title: 4. Stratification de coque – Atelier GRP
      description: Processus de superposition de la fibre de verre, application du gelcoat et durcissement de la coque. Voir le calendrier de stratification et de renforcement structurel pour les différents modèles de RIB.
      icon: tabler:layers-subtract
    - title: 5. Assemblage et intégration
      description: Jonction coque-tube, installation de la console et du siège, intégration du système électrique et de carburant et montage de l'équipement. Observez la chaîne de production en fonctionnement.
      icon: tabler:tool
    - title: 6. Station d'essai de pression
      description: Test de maintien de pression de 24 à 48 heures à 1,25 fois la pression nominale. Affichez les enregistrements de tests, les manomètres et les critères de réussite/échec. Découvrez comment les résultats des tests sont liés aux numéros de série de la coque.
      icon: tabler:gauge
    - title: 7. Inspection finale et contrôle qualité
      description: Liste de contrôle qualité en 100 points par unité, vérification dimensionnelle, inspection cosmétique et contrôle de l'intégrité de l'emballage. Examiner les journaux de non-conformité et les enregistrements d'actions correctives.
      icon: tabler:clipboard-check
    - title: 8. Salle de révision des documents
      description: Documentation de conformité par modèle (DoC, plaque constructeur, manuel du propriétaire), enregistrements de traçabilité de la production, registre HIN et démonstration de la base de données de suivi des lots de matériaux.
      icon: tabler:folder
content_qc_chain:
  tagline: Preuve de qualité
  title: Chaîne de contrôle qualité en 8 étapes<br /> — Vérifiable à chaque étape
  subtitle: Notre chaîne de contrôle qualité s'étend de l'arrivée des matériaux jusqu'à l'expédition finale, avec des preuves documentées à chaque étape.
  items:
    - title: Étape 1 : Inspection des matériaux entrants
      description: Chaque lot de PVC, Hypalon, fibre de verre, aluminium, adhésifs et quincaillerie est testé par rapport aux spécifications avant d'entrer en production. Résistance à la traction, adhérence du revêtement et contrôles dimensionnels selon AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: Étape 2 : Soudage des tubes / Collage QC
      description: Tests de résistance au pelage des coutures par lot de production. Paramètres de soudure RF surveillés et enregistrés. Coutures collées à la main vérifiées pour une couverture adhésive et un temps de durcissement constants.
      icon: tabler:flame
    - title: Étape 3 : CQ de stratification de la coque
      description: Mesure de l'épaisseur du gelcoat, vérification de la stratification de la fibre de verre selon le calendrier du stratifié et surveillance du temps de durcissement. Positions des renforts structurels vérifiées par rapport aux dessins techniques.
      icon: tabler:layers-subtract
    - title: Étape 4 : Assemblage et contrôle qualité de l'intégration
      description: Intégrité des joints coque-tube, couple de montage de la console et du siège, continuité électrique et test d'étanchéité du système de carburant. Chaque point d'installation a été vérifié par rapport à la liste de contrôle d'assemblage spécifique au modèle.
      icon: tabler:tool
    - title: 'Étape 5 : Test de maintien de la pression'
      description: Chaque chambre gonflable est pressurisée à 1,25x PSI et maintenue pendant 24 à 48 heures. Chute de pression enregistrée par chambre. Seuil de réussite/échec documenté. Lié au numéro de série de la coque.
      icon: tabler:gauge
    - title: Étape 6 : Inspection finale
      description: Liste de contrôle qualité en 100 points couvrant la précision dimensionnelle, la finition cosmétique, l'exhaustivité des accessoires, la documentation et l'intégrité de l'emballage. Indépendant de l'équipe de production.
      icon: tabler:clipboard-check
    - title: 'Étape 7 : Documentation de conformité'
      description: DoC spécifique au modèle, vérification de la plaque du constructeur, exhaustivité du manuel du propriétaire et entrée du registre HIN. Tous les documents de conformité préparés et vérifiés avant la libération de l'expédition.
      icon: tabler:file-certificate
    - title: 'Étape 8 : Libération et traçabilité des expéditions'
      description: La version finale nécessite que toutes les étapes de contrôle qualité soient réussies, que la documentation de conformité soit complète et que la documentation d'expédition soit vérifiée. Dossier de coque fermé et archivé pour une conservation de plus de 10 ans.
      icon: tabler:truck
content_traceability:
  tagline: Traçabilité de la production
  title: HIN → Fichier maître →<br />Dossier de coque → Livraison
  subtitle: Chaque bateau RIB porte un numéro d'identification de coque unique lié à une chaîne complète d'enregistrement de production et de conformité.
  items:
    - title: Numéro d'identification de coque (HIN)
      description: Identifiant unique de 14 caractères marqué en permanence sur chaque bateau. Encode le code du fabricant (MIC), la désignation du modèle, l’année de production et le numéro de série. La clé qui ouvre toute la chaîne de traçabilité.
      icon: tabler:hash
    - title: Dossier Technique Maître
      description: La documentation de conformité et d’ingénierie pour la famille de modèles. Contient des dessins GA, une évaluation des risques, des calculs de stabilité, des spécifications de matériaux et des normes applicables. Lié à toutes les coques de ce modèle.
      icon: tabler:folder
    - title: Record de coque individuel
      description: 'Dossier de production par coque : HIN, date de production, lot de tubes, certificats de matériaux, résultat du test de pression, configuration finale, spécifications du moteur, résultats de la liste de contrôle qualité et destination de livraison. Plus de 21 champs de données par coque.'
      icon: tabler:file-description
    - title: Pack Conformité Client
      description: Forfait de livraison par coque comprenant la DoC, la photo de la plaque de constructeur, le manuel du propriétaire, la liste de contrôle de conformité et la feuille de configuration finale. Expédié avec le bateau et archivé à l'usine pendant plus de 10 ans.
      icon: tabler:package
content_red_flags:
  tagline: Pièges de l’audit
  title: Acheteurs de signaux d'alarme<br />Repérez facilement
  subtitle: Problèmes courants qui minent la confiance des acheteurs lors des audits d’usine. Nous abordons chacun de manière proactive.
  items:
    - title: Revendications CE générales sans portée du modèle
      description: '"Tous les produits certifiés CE" sans préciser quelle directive, quels modèles, et quel module de conformité. Drapeau rouge : suggère que la conformité est superficielle plutôt que par modèle et par configuration.'
      icon: tabler:alert-triangle
    - title: Aucune preuve de tests physiques
      description: "Réclamations relatives aux tests de pression sans enregistrements de test, jauges ou station de test visibles dans l'usine. Drapeau rouge : les allégations de qualité ne peuvent pas être vérifiées lors de la visite."
      icon: tabler:alert-triangle
    - title: Traçabilité des matières manquantes
      description: "Aucun enregistrement de lot, aucune inspection à la réception ou aucun lien entre les certificats de matériaux et les produits finis. Drapeau rouge : aucun moyen de retracer les problèmes de qualité jusqu'à la source."
      icon: tabler:alert-triangle
    - title: Documentation générique
      description: 'Une seule DoC couvrant tous les modèles, aucun enregistrement spécifique au HIN ni aucun document de conformité « modèle ». Drapeau rouge : la conformité n’est pas liée aux unités de production individuelles.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Expédition et emballage
  title: Chargement et calage<br />des RIB en conteneur
  subtitle: Nos solutions d'expédition protègent votre investissement de Qingdao jusqu'au port de destination. Plans de chargement conteneur et spécifications de calage disponibles pour chaque modèle.
  items:
    - title: Configurations conteneur 20 pieds
      description: 'Conteneur 20 pieds standard : 1 à 2 bateaux RIB (4,0 à 5,5 m) imbriqués avec pont et tubes séparés, ou 8 à 12 planches de SUP. Configurations mixtes RIB + SUP disponibles. Plan de chargement détaillé fourni à chaque commande.'
      icon: tabler:box
    - title: Configurations conteneur 40 pieds
      description: 'Conteneur 40 pieds standard : 2 à 4 bateaux RIB (jusqu''à 7,0 m) avec coques imbriquées et tubes empilés, ou 20 à 30 planches de SUP. 40 pieds HQ disponible pour les modèles de RIB plus hauts. Rangement optimisé en volume réduisant le coût d''expédition par unité.'
      icon: tabler:container
    - title: Calage bois pour coques de RIB
      description: Coques en aluminium et GRP calées dans des caisses en bois sur mesure avec rembourrage mousse, barrière anti-humidité et feuillard acier. Dimensions et poids des caisses par modèle disponibles pour la planification logistique. Certification bois traité thermiquement ISPM-15 incluse.
      icon: tabler:wood
    - title: Emballage avec séparation tubes et pont
      description: Tubes dégonflés et pliés séparément des coques pour un gain d'espace. Plots de pont, consoles et sièges emballés dans un film protecteur avec kits de quincaillerie de montage. Instructions de remontage incluses avec chaque expédition.
      icon: tabler:package
    - title: Protection contre l'humidité et la corrosion
      description: Papier anticorrosion VCI pour les composants en aluminium, sachets déshydratants de gel de silice et sacs de quincaillerie sous vide. Prévient les dommages liés à la condensation pendant le transit maritime de 30 à 45 jours.
      icon: tabler:droplet-off
    - title: Documentation FOB Qingdao
      description: Connaissement, facture commerciale, liste de colisage, certificat d'origine et documentation de conformité par expédition. Consolidation FCL et LCL disponible. Soutien douanier pour les marchés de l'UE, des États-Unis et du Moyen-Orient.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Preuves vérifiables sur place
  title: Des preuves d'audit<br />vérifiables sur place
  subtitle: Lors des visites d'usine, les clients peuvent vérifier des preuves précises dans chaque zone de production. Voici ce qu'il convient de contrôler — et ce que nous préparons pour chaque audit.
  areas:
    - area: Entrepôt de matières premières
      what_to_verify: Les matériaux sont-ils correctement stockés ? Y a-t-il mélange de lots ?
      evidence: Dossiers d'inspection à réception, étiquettes de lot, stockage FIFO, liste d'approbation des fournisseurs, certificats matériaux (PVC, Hypalon, fibre de verre, aluminium, colles, quincaillerie)
      icon: tabler:building-warehouse
    - area: Production des flotteurs
      what_to_verify: Comment la résistance des coutures et l'étanchéité sont-elles garanties ?
      evidence: Fiches de processus, validation du premier article, relevés d'essais de pression par compartiment, journaux de réparation et de re-essai, relevés de pose des valves
      icon: tabler:flame
    - area: Production de la coque
      what_to_verify: Comment la cohérence structurelle est-elle maîtrisée ?
      evidence: Documents de processus maîtrisés, points de contrôle qualité, numérotation des produits semi-finis, mesures d'épaisseur du gelcoat, vérification du plan de stratification
      icon: tabler:layers-subtract
    - area: Zone d'assemblage
      what_to_verify: Comment prévenir les erreurs d'assemblage des options ?
      evidence: Nomenclatures (BOM), ordres de fabrication, listes de contrôle de configuration, fiches d'inspection par poste, contrôles de couple et fonctionnels par modèle
      icon: tabler:tool
    - area: Station d'essais
      what_to_verify: Comment confirmer que le bateau est conforme avant expédition ?
      evidence: Procédures d'essais, liste des instruments, relevés d'étalonnage, journaux d'essais de pression (1,25x / 24-48h), listes de contrôle des essais fonctionnels, critères de réussite et d'échec documentés
      icon: tabler:gauge
    - area: Zone des non-conformités
      what_to_verify: Comment les défauts sont-ils traités ?
      evidence: Étiquettes de mise en quarantaine, journaux des non-conformités (NCR), analyse des causes racines, enregistrements d'approbation de la reprise, suivi CAPA (actions correctives et préventives)
      icon: tabler:alert-triangle
    - area: Entrepôt de produits finis
      what_to_verify: Comment prévenir les erreurs d'expédition et les dommages ?
      evidence: Étiquettes des produits finis, enregistrements de correspondance des commandes, normes d'emballage, relevés d'inspection avant expédition
      icon: tabler:box
    - area: Pièces de rechange & service après-vente
      what_to_verify: Pouvez-vous assurer un SAV sur le long terme ?
      evidence: Liste des pièces de rechange courantes, stratégie de stock, système de numérotation des pièces, documentation du processus de garantie, tutoriels d'entretien
      icon: tabler:headset

content_closing_script:
  tagline: De l'audit à la commande
  title: De la visite d'usine<br />au projet confirmé
  subtitle: Un audit réussi ne devrait pas se terminer par des photos et une poignée de main. Avant votre départ, nous veillons à ce que trois résultats commerciaux soient documentés.
  items:
    - title: Confirmer la configuration technique
      description: Accord sur le modèle, l'application, les options clés, le marché cible, la quantité estimée et le calendrier de livraison — le tout documenté avant votre départ.
      icon: tabler:checklist
    - title: Confirmer les documents de la prochaine étape
      description: "Définition de ce qu'Aquafarer fournit ensuite : GA révisé, liste de configuration, devis, liste de documents, plan d'échantillons ou NDA — avec des délais précis."
      icon: tabler:file-plus
    - title: Confirmer le calendrier commun
      description: Configuration révisée et devis préliminaire sous 3 jours ouvrés. Confirmation d'échantillon ou d'apparence sous 7 jours. Revue d'ingénierie ou inspection par un tiers sous 14 jours. Date de la prochaine réunion et responsables arrêtés.
      icon: tabler:calendar

faq:
  title: Audit d'usine - Foire aux questions
  questions:
    - q: Puis-je visiter l’usine en personne ?
      a: Oui. Nous acceptons les audits d'usine sur site dans nos installations de Qingdao de 12 000 m². Notre visite standard couvre 8 stations, de l'entrepôt de matières premières à la salle de révision des documents. Des visites virtuelles d'usine par appel vidéo sont également disponibles pour la qualification initiale.
    - q: Acceptez-vous les audits tiers (BSCI, SMETA, SGS) ?
      a: Oui. Nous maintenons la certification BSCI (Intertek) et acceptons les protocoles d'audit spécifiques aux clients. Nous pouvons également organiser des inspections SGS ou TÜV sur demande. Les rapports d’audit sont disponibles sous NDA.
    - q: Puis-je voir des tests de pression pendant la visite ?
      a: Notre station de test de pression fait partie de l'itinéraire de visite standard. En fonction du calendrier de production, vous pouvez observer des tests de pression actifs avec des lectures de jauge et des enregistrements de tests. Les journaux de tests de pression par coque sont toujours disponibles pour examen.
    - q: Comment gérer les produits non conformes ?
      a: Les unités non conformes sont séparées, documentées et examinées selon notre processus d'action corrective ISO 9001. Une analyse des causes profondes est effectuée, des actions correctives sont mises en œuvre et des enregistrements sont conservés. Les acheteurs peuvent consulter notre journal NCR lors des audits.
    - q: Quels documents de conformité sont disponibles pour examen ?
      a: "Au cours de l'audit, vous pouvez consulter : des échantillons de DoC spécifiques au modèle, les spécifications de la plaque de construction, le registre HIN, les versions préliminaires du manuel du propriétaire, les listes de normes applicables et les dossiers d'évaluation de la conformité par famille de modèles."
    - q: Comment réserver une visite virtuelle de l'usine ?
      a: Contactez notre équipe commerciale pour planifier une visite vidéo en direct via WhatsApp, Zoom ou Teams. Nous suivons le même itinéraire en 8 stations et pouvons nous concentrer sur des domaines spécifiques en fonction de vos intérêts. Une visite virtuelle typique dure de 45 à 60 minutes.
    - q: L'usine est-elle le véritable fabricant ou une société commerciale ?
      a: Aquafarer est le fabricant actuel. Nous exploitons l'usine de Laixi, Qingdao. La licence commerciale, le périmètre de fabrication et la production physique sont tous vérifiables lors de l'audit.
    - q: Quels enregistrements de qualité puis-je examiner ?
      a: Dossiers d'inspection des matériaux entrants, points de contrôle de qualité en cours de processus, journaux de tests de pression, listes de contrôle d'inspection finale en 100 points, rapports de non-conformité, enregistrements d'actions correctives et enregistrements de traçabilité par coque. Le tout maintenu selon les exigences ISO 9001.
