reasons:
  tagline: La différence Paddle Board Overstock
  title: Ce qui nous distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Vraie fabrication, pas du négoce
      description: Nous possédons et exploitons une usine de 12 000 m². Quand vous travaillez avec Paddle Board Overstock, vous travaillez directement avec les personnes qui conçoivent, développent et fabriquent vos produits — sans intermédiaires.
      icon: tabler:building-factory
    - title: Une approche menée par l'ingénierie
      description: Notre processus de conception commence par le cas d’usage, pas par la catégorie de produit. Nous optimisons la forme de la coque, le choix des matériaux et la configuration selon la manière dont la planche sera réellement utilisée sur l’eau.
      icon: tabler:engine
    - title: Qualité éprouvée
      description: Chaque carte est testée à 1,25 fois sa pression nominale pendant 24 à 48 heures avant expédition, et 99,3 % de nos expéditions arrivent sans défaut — garantis par notre garantie.
      icon: tabler:award
    - title: Conception Paddler-First
      description: 'Chaque modèle commence par la façon dont vous pagayez : plateformes stables pour débutants, formes profilées pour les randonnées, et decks grandeur nature pour le yoga. Nous concevons pour de vrais pagayeurs, pas pour les spécifications de showroom.'
      icon: tabler:adjustments
    - title: Logistique mondiale
      description: Entrepôt aux États-Unis en Californie, expédition directe depuis Weihai, fret aérien pour les commandes urgentes. Nous gérons les formalités douanières et la documentation partout dans le monde.
      icon: tabler:truck-delivery
    - title: Accompagnement à vie
      description: Nous sommes derrière des panneaux que nous avons construits il y a 20 ans. Pièces détachées authentiques, conseils techniques, conseils en réparation — notre équipe est là quand vous avez besoin de nous, où que vous soyez.
      icon: tabler:lifebuoy
testimonials:
  tagline: Confiance des pagayeurs du monde entier
  title: Ce que disent les pagayeurs
  items:
    - content: Mon Ocean Voyager a géré tout, des matins calmes sur les lacs aux après-midis côtiers agités. Deux saisons plus tard, il a toujours l’air et le rouler comme neuf.
      name: — Pagayeur de loisirs, Californie
    - content: J’étais nerveux à l’idée d’acheter ma première planche gonflable en ligne, mais la qualité était évidente dès que je l’ai gonflée. Rigide, stable et magnifiquement finie.
      name: — SUP Propriétaire pour la première fois, Allemagne
    - content: Nous pagayons en famille chaque week-end d’été. Trois planches, aucun problème, et les enfants adorent les designs colorés.
      name: — Family Paddler, Australie
    - content: Le test de pression n’est pas un discours marketing — ma planche est solide comme un roc à pleine pression et ne montre aucune étirement après un an de pagaie hebdomadaire.
      name: — Weekly Paddler, Pays-Bas
