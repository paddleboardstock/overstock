hero:
  tagline: Pourquoi Paddle Board Overstock
  title: Construit différemment. Construit pour durer.<br />Les conseils derrière Water Adventures Worldwide
  subtitle: Pas seulement une usine — une équipe de pagayeurs et d’ingénieurs qui conçoivent, testent et construisent des planches gonflables haut SUP de gamme pour les familles, les aventuriers et les clubs du monde entier.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Qualité de fabrication et expertise Paddle Board Overstock
pillars:
  tagline: Trois piliers de la qualité
  title: Pourquoi les pagayeurs du monde entier choisissent Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Conçu pour un usage commercial
      description: Nos planches sont conçues pour des années de pagaie régulière. Des PVC drop-stitch noyaux commerciaux renforcés, des UV matériaux stables et du matériel testé sur le terrain signifient un entretien plus faible et une durée de vie plus longue sur l’eau.
      icon: tabler:building-factory
      callToAction:
        text: Voir la gamme de produits commerciaux
        href: /products
    - title: Testés au-delà des normes
      description: Chaque planche est gonflée à 1,25 fois sa pression nominale pendant 24 à 48 heures avant de quitter notre usine — testée à 100 % en pression, sans défaut à 99,3 %. Votre planche a prouvé sa résistance avant même d’atteindre l’eau.
      icon: tabler:shield-check
      callToAction:
        text: Voyez comment nous testons
        href: /quality
    - title: Conçu pour des conditions mondiales
      description: "Des produits optimisés pour chaque climat : formulations PVC eau froide pour l'Europe, matériaux résistants aux UV pour le Moyen-Orient et l'Australie, traitements anti-humidité pour l'Asie du Sud-Est. Chaque expédition est calibrée selon l'environnement de destination."
      icon: tabler:world
