hero:
  tagline: Repères
  title: Nouveau sur le SUP ?
  subtitle: Des guides pratiques pour vous aider à choisir, utiliser et profiter des équipements gonflables de sports nautiques.
size_guide:
  tagline: Taille et spécifications
  title: Trouvez la bonne taille pour vos besoins
  desc: Comparez les dimensions des produits, les capacités de poids et les utilisations recommandées. Que vous ayez besoin d'un SUP de randonnée, d'un kayak compact ou d'un RIB commercial, notre guide des tailles vous aide à choisir le bon ajustement.
  link_label: Guide complet avec spécifications du produit →
  link: /size-guide
  cards:
    - title: Planches SUP
      desc: Choisissez la longueur en fonction de votre poids et de l'utilisation prévue. Les planches plus larges (32"+) offrent plus de stabilité. Les planches plus longues (11 à 12 pieds) conviennent mieux au tourisme.
    - title: des Kayaks
      desc: Kayaks simples (9 pieds) pour les déplacements en solo et les rivières. Kayaks tandem (12 pieds) pour deux pagayeurs ou un avec équipement. Vérifiez toujours la capacité de poids.
    - title: Dériveurs et semi-rigides
      desc: Choisissez la longueur en fonction du nombre de passagers et de l'utilisation. Des semi-rigides plus grands (4,5 m+) pour l'offshore et le sauvetage. Des canots plus petits (2,7 m) comme annexes et plates-formes de pêche.
