hero:
  tagline: Repères
  title: Nouveau sur le SUP ?
  subtitle: Des guides pratiques pour vous aider à choisir, utiliser et profiter des équipements gonflables de sports nautiques.
size_guide:
  tagline: Taille et spécifications
  title: Trouvez la bonne taille pour vos besoins
  desc: Comparez les dimensions de la planche, les capacités de charge et les utilisations recommandées. Que vous souhaitiez une planche tout-terrain stable ou une forme de touring plus rapide — notre guide des tailles vous aide à choisir le bon choix.
  link_label: Guide complet avec spécifications du produit →
  link: /size-guide
  cards:
    - title: Planches SUP Polyvalentes
      desc: Nos planches d'environ 11 pieds (32 pouces de large) équilibrent stabilité, vitesse et capacité. Le cœur de 6 pouces drop-stitch à 15 PSI maintient le pont rigide pour les pagayeurs de tous niveaux.
    - title: Largeur et stabilité
      desc: Les planches plus larges (32") offrent plus de stabilité pour les débutants, le yoga et la pêche. Une épaisseur de 6 pouces ajoute de la rigidité et une capacité de poids pour le pratiquant et son équipement.
    - title: Forfaits et accessoires
      desc: Chaque planche est livrée en tant que package complet — planche, sac à dos de voyage, pompe à main, pagaie réglable, aileron amovible, leash en spirale et kit de réparation. Vérifiez la charge maximale pour le pilote ainsi que le matériel.
