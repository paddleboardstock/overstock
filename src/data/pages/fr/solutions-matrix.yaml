hero:
  tagline: Matrice de solutions industrielles
  title: Solutions marines basées sur des scénarios<br />Pour les opérations professionnelles
  subtitle: Des embarcations gonflables et des RIB spécialement conçus et configurés pour les applications de sauvetage, de flotte de location, d'annexes de yacht et de pêche commerciale, chacun étant soutenu par des spécifications techniques et des options de personnalisation.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Solutions marines professionnelles Paddle Board Overstock pour diverses industries
direct_answer: "Paddle Board Overstock propose des solutions de motomarines et de RIB conçues pour les opérations maritimes commerciales : bateaux de sauvetage et de patrouille avec tubes Hypalon renforcés et sécurité multi-chambres, flottes de location de SUP et kayaks avec PVC de 1,2 mm et coutures soudées à l'air chaud pour une durabilité nécessitant peu d'entretien, annexes de yacht de luxe avec coque en aluminium à V profond et configurations de pêche robustes avec porte-cannes et systèmes de vivier."
solution_a:
  tagline: SolutionA
  title: Sauvetage maritime et<br />Patrouille commerciale
  subtitle: RIB de sécurité multi-chambres à grande vitesse pour les opérations professionnelles d'intervention d'urgence et d'application de la loi.
  badge: Heavy-Duty Series
  description: Nos RIB de sauvetage et de patrouille maritimes sont construits avec des tubes à air renforcés en Hypalon/PVC haute densité dotés d'une conception de flottaison indépendante à plusieurs chambres. Chaque navire est équipé de bandes réfléchissantes de qualité professionnelle, de lignes de sauvetage et de valves à gonflage rapide pour être prêt au déploiement. Les coques en fibre de verre Deep-V offrent une stabilité exceptionnelle à grande vitesse et dans des conditions de mer agitées.
  features:
    - title: Sécurité multi-chambres
      description: 4 à 6 chambres à air indépendantes — toute perforation à chambre unique maintient une flottaison positive
    - title: Tissu tubulaire renforcé
      description: Hypalon CSM 1,2 mm ou PVC 1 680 DTEX avec coutures soudées à air chaud double couche
    - title: Qualité professionnelle
      description: Bande réfléchissante SOLAS, lignes de sauvetage, taquets de remorquage, ligne de peintre à dégagement rapide
    - title: Coque à grande vitesse
      description: Coque en fibre de verre ou en aluminium Deep-V conçue pour 25 à 45 nœuds selon la configuration
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Matériau de la coque
      value: Fibre de verre/aluminium de qualité marine
    - label: Tissu tubulaire
      value: Hypalon CSM 1,2 mm / PVC 1 680 DTEX
    - label: Vitesse maximale
      value: 25 à 45 nœuds
    - label: Capacité
      value: 6 à 12 personnes
    - label: Gamme de moteurs
      value: 40 à 200 CV
    - label: Attestation
      value: CE/OIN 9001
solution_b:
  tagline: SolutionB
  title: Location de sports nautiques et<br />équipement de la flotte du complexe
  subtitle: SUP, kayaks et bateaux gonflables ultra-durables et nécessitant peu d'entretien, conçus pour une utilisation quotidienne en location dans les centres de villégiature, les clubs et les agences touristiques.
  badge: Rental-Grade
  description: Notre flotte d'équipements de location est conçue pour la plus grande durabilité et les coûts d'entretien les plus bas. Nous utilisons du PVC renforcé de 1,2 mm avec une technologie de soudure à air chaud à trois couches qui résiste à la dégradation par les UV et aux dommages fréquents dus aux collisions. La construction en point tombant garantit que les planches conservent leur rigidité même après des centaines de cycles de location. Tous les modèles comportent des anneaux en D renforcés, des bandes de rail résistantes à l'abrasion et des vannes de qualité commerciale.
  features:
    - title: PVC de qualité commerciale
      description: PVC renforcé de 1,2 mm avec stabilisateurs UV — 3 fois plus épais que les matériaux grand public
    - title: Coutures soudées à l'air chaud
      description: Soudage par fusion triple couche — plus résistant que le collage, résiste au délaminage
    - title: Rigidité du point de chute
      description: Noyau 1 680 DTEX avec 2 fils/pouce carré — évalué à 20 PSI pour une rigidité semblable à celle d'un panneau dur
    - title: Conception prête pour la flotte
      description: Anneaux en D renforcés, valves Halkey-Roberts commerciales, bandes de rail résistantes à l'abrasion
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Matériau du tube
      value: PVC renforcé de 1,0 à 1,2 mm
    - label: Technologie de couture
      value: Soudage à air chaud triple couche
    - label: Pression maximale
      value: 15 à 20 PSI (modèles à point de chute)
    - label: Résistance aux UV
      value: Plus de 1 000 heures de tests accélérés
    - label: Garantie
      value: 2 à 5 ans selon le modèle
    - label: Entretien
      value: Minime – rincer et conserver
solution_c:
  tagline: SolutionC
  title: Annexes pour yachts et<br />Embarcations de luxe
  subtitle: Des annexes RIB légères et performantes conçues pour le stockage des superyachts et le transport des invités avec un ajustement et une finition luxueux.
  badge: Premium Series
  description: Nos semi-rigides pour yachts allient construction légère et esthétique luxueuse. Les coques en aluminium ou en fibre de verre Deep-V offrent une qualité de navigation exceptionnelle et un levage facile des bossoirs. disponible avec des graphismes en tube de couleurs assorties, un revêtement haut de gamme et des configurations de console personnalisées. Les dimensions de stockage compactes les rendent idéales pour les garages de superyachts et le stockage sur le pont.
  features:
    - title: Construction légère
      description: Les coques en aluminium de qualité marine réduisent le poids de 30 % par rapport à la fibre de verre pour un levage facile
    - title: Performances en V profond
      description: Coque morte de 18 à 22 degrés pour une conduite en douceur dans le clapot et un excellent suivi
    - title: Ajustement et finition de luxe
      description: Sellerie personnalisée, tubes de couleur assortie, console de pilotage haut de gamme, ensemble en acier inoxydable
    - title: Rangement compact
      description: Conçu pour les garages de superyachts — tubes dégonflables pour un rangement compact
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Type de coque
      value: Aluminium / Fibre de verre Deep-V
    - label: Mort
      value: 18-22 degrés
    - label: Vitesse maximale
      value: 30 à 40 nœuds
    - label: Poids sec
      value: 120-350 kg (coque en aluminium)
    - label: Prêt pour le levage de bossoir
      value: Oui — norme sur les points de levage
    - label: Stockage
      value: Tubes dégonflables, empilables
