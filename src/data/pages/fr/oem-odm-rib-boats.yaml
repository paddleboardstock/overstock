comparison_matrix:
  title: 'OEM ou ODM : quel modèle convient à votre projet ?'
  subtitle: Quatre modes de collaboration, chacun avec différents niveaux d'implication de l'usine et de contrôle de la marque
  columns:
    - header: Mode collaboratif
    - header: Votre rôle de marque
    - header: Rôle de l'aquaculteur
  rows:
    - option: Fabrication OEM
      standard: Fournir la marque, les spécifications et les exigences de conformité
      premium: Construisez selon vos spécifications en utilisant nos moules et lignes de production existants
    - option: Personnalisation ODM
      standard: Sélectionnez un modèle de base, personnalisez les fonctionnalités et l'image de marque
      premium: Adaptez la plateforme RIB éprouvée avec les modifications souhaitées
    - option: RIB semi-personnalisé
      standard: Définir la longueur de la coque, le matériau des tubes, la disposition du pont et l'équipement
      premium: Modifier la coque existante avec une configuration de tubes et un plan de pont personnalisés
    - option: Développement entièrement personnalisé
      standard: Fournir le concept et les exigences du marché cible
      premium: 'Conception à partir de zéro : coque, moule et documentation complète personnalisés'
content_customization:
  tagline: Ce qui peut être personnalisé
  title: Personnalisation RIB<br />Options
  subtitle: Chaque élément d'un bateau RIB peut être adapté aux exigences de votre application, de votre marché et de votre marque.
  items:
    - title: Coque et structure
      description: Longueur de la coque (2,5 à 8,5 m), matériau de la coque (fibre de verre GRP ou aluminium de qualité marine), couleur de la coque (gelcoat ou peint), profil de quille (V profond, V modéré, plat), type de tableau arrière ( tableau arrière fermé avec support ou puits) et renforcement structurel pour les exigences de charge commerciale.
      icon: tabler:sailboat
    - title: Tube et Collier
      description: Matériau du tube (PVC de 0,9 à 1,2 mm ou Hypalon/CSM de 1,4 à 1,7 mm), diamètre du tube (40 à 55 cm), nombre de chambres (3 à 7), type de valve (Halkey-Roberts, Leafield D7 ou Boston), couleur du tube (standard ou personnalisé) et configuration du collier cône/cône.
      icon: tabler:circle
    - title: Disposition du pont et de la console
      description: Console centrale, console latérale ou barre franche. Disposition des sièges (sièges jockey, banquettes, sièges traversins). Revêtement de pont (mousse EVA aspect teck, peinture antidérapante ou PRV nu). Points de montage de l'équipement, barres d'appui et positions des anneaux en D.
      icon: tabler:layout-dashboard
    - title: Électricité et navigation
      description: Feux de navigation (LED), système de pompe de cale, gestion de la batterie, installation radio VHF, montage GPS/traceur, ports de chargement USB et configuration du panneau de commutation.
      icon: tabler:bolt
    - title: Image de marque et graphisme
      description: Graphiques de coques et de tubes (sérigraphie, transfert thermique, impression numérique UV), placement de logos, schémas de couleurs sur mesure, marquages d'identification et documentation personnalisée du propriétaire avec votre marque.
      icon: tabler:palette
    - title: Sécurité et conformité
      description: Classement de catégorie de conception (A/B/C/D par RCD), système d'extinction d'incendie, spécifications du système de carburant (réservoir portable, réservoir fixe, sous le pont) et dossier de documentation de conformité pour votre marché cible.
      icon: tabler:shield
content_applications:
  tagline: Configurations d'application
  title: Configurations RIB<br />Par application
  subtitle: Différentes missions nécessitent différentes configurations. Voici des configurations éprouvées pour les applications RIB les plus courantes.
  items:
    - title: Sauvetage et patrouille
      description: Coque en V profond, tubes Hypalon, pont auto-videur, sièges traversins, poignées de maintien, feux de navigation et anneaux en D robustes. Conception RCD de catégorie B ou C. Système de carburant résistant au feu et système électrique de qualité commerciale.
      icon: tabler:lifebuoy
    - title: Assistance plongée
      description: Large poutre, échelle d'embarquement arrière, emplacements pour porte-réservoirs, anneaux en D supplémentaires, support de drapeau de plongée, tableau arrière renforcé pour moteurs hors-bord jumeaux et revêtement antidérapant en EVA sur tout le pont.
      icon: tabler:mask
    - title: Tourisme & Commercial
      description: Aménagement certifié passager avec banquette, parasol/Bimini, barres d'appui, stockage à sec et système de double batterie. RCD Catégorie C. Conçu pour les opérations de villégiature et de flottes charter.
      icon: tabler:beach
    - title: Pêche
      description: Disposition du pont ouvert, positions des porte-cannes, puits d'appâts vivants, support pour détecteur de poissons, support pour moteur de pêche à la traîne, tableau arrière renforcé et système de carburant portable. Options de console centrale ou de console latérale.
      icon: tabler:fish
    - title: Annexe de loisirs et de yacht
      description: Coque légère, tubes PVC, sièges confortables, barre télescopique ou console compacte, points de levage pour bossoir et réservoir de carburant amovible. RCD Catégorie C ou D.
      icon: tabler:sailboat
    - title: Bateau de travail professionnel
      description: Option de coque en aluminium, renfort robuste, direction hydraulique, système électrique de qualité commerciale, arceau de radar et points d'intégration d'équipements spécifiques à la mission. Conformité personnalisée par projet.
      icon: tabler:anchor
process_steps:
  title: Processus de développement OEM/ODM RIB en 7 étapes
  subtitle: 'De la description du projet au service après-vente : un flux de travail défini avec des jalons et des livrables clairs'
  steps:
    - number: '01'
      title: Résumé du projet et exigences
      description: Définissez l'application cible, la taille de la coque, le matériau du tube, les exigences de conformité et les besoins en matière de marque. Nous évaluons la faisabilité et confirmons le modèle de collaboration (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3 à 5 jours
    - number: '02'
      title: Examen technique et faisabilité
      description: L'équipe d'ingénierie examine la faisabilité structurelle, les calculs de stabilité et de flottabilité, le chemin de conformité et la disponibilité des matériaux. Nous identifions les moules existants ou les besoins en moules personnalisés.
      timeline: 5 à 7 jours
    - number: '03'
      title: Proposition et devis
      description: Recevez une proposition détaillée comprenant les spécifications, les rendus 3D ou les dessins GA, la portée de conformité, le calendrier et les prix unitaires basés sur les niveaux de volume et le MOQ.
      timeline: 5 à 7 jours
    - number: '04'
      title: Confirmation de conception et échantillonnage
      description: Approuver l’AG final, la disposition du pont et la configuration des tubes. Nous produisons un échantillon de pré-production avec les couleurs de votre marque, votre logo et les matériaux spécifiés pour votre inspection physique.
      timeline: 15 à 20 jours
    - number: '05'
      title: Approbation des échantillons et protocole de contrôle qualité
      description: 'Inspecter et approuver l’échantillon. Définir le protocole de contrôle qualité de production : test de pression (1,25x / 24–48h), contrôles dimensionnels et liste de contrôle de la documentation de conformité par coque.'
      timeline: 3 à 5 jours
    - number: '06'
      title: Production de masse et contrôle qualité
      description: Production complète avec liste de contrôle QC de 100 points par unité. Inspections en cours de processus, tests de pression et traçabilité au niveau série. Documentation CE/ISO préparée en parallèle.
      timeline: 30 à 45 jours
    - number: '07'
      title: Emballage, expédition et après-vente
      description: Emballage personnalisé (standard, prêt à la vente au détail ou palettisé), documentation d'exportation, chargement des conteneurs et logistique. Kits de pièces de rechange et documentation de maintenance inclus.
      timeline: 7 à 14 jours
certifications:
  title: Conformité et certifications pour les bateaux semi-rigides
  subtitle: Chaque commande de RIB personnalisée est livrée avec une documentation de conformité spécifique au modèle
  items:
    - name: CE 2013/53/UE
      description: Conformité RCD par modèle et catégorie de conception - DoC, plaque de constructeur, manuel du propriétaire inclus
      badge: CE
    - name: ISO 9001:2015
      description: Système de gestion de la qualité certifié par SGS couvrant la conception, la production et la distribution
      badge: ISO
    - name: EN ISO 6185
      description: Norme de construction de bateaux pneumatiques — stabilité, flottabilité et récupération d'un homme à la mer
      badge: 6185
    - name: EN ISO 14945
      description: Norme de plaque du constructeur — identification marquée en permanence et informations sur la capacité
      badge: 14945
    - name: BSCI
      description: Audit de conformité sociale pour la fabrication éthique — requis par les détaillants de l'UE
      badge: BSCI
    - name: ATTEINDRE
      description: Conformité européenne en matière de sécurité chimique pour le PVC, l'Hypalon, les adhésifs et les revêtements
      badge: REACH
content_service_modules:
  tagline: Modules de service
  title: Modules de service<br />OEM/ODM
  subtitle: Chaque projet combine les modules de service appropriés. Tous les projets n'ont pas besoin de tous les modules — nous définissons le périmètre selon vos seuls besoins.
  items:
    - title: Revue d'ingénierie & faisabilité
      description: 'Évaluation de la plateforme de coque, contrôle de faisabilité structurelle, vérification de la stabilité et de la flottabilité, identification du chemin de conformité et confirmation de la disponibilité des matériaux. Livrable : rapport de faisabilité avec recommandation go/no-go.'
      icon: tabler:math-function
    - title: Design & configuration
      description: 'Plan GA, aménagement du pont, configuration des flotteurs, positions de la console et des assises, plan d''implantation des équipements et choix des couleurs et matériaux. Livrable : GA approuvé et spécification de configuration.'
      icon: tabler:ruler
    - title: Échantillon & prototype
      description: Échantillon de pré-production avec couleurs et logo approuvés et matériaux spécifiés, pour inspection physique. Inclut protocole d'approbation de l'échantillon, liste de contrôle d'inspection et processus de demande de modification.
      icon: tabler:3d-cube-sphere
    - title: Production & contrôle qualité
      description: Production en série avec liste de contrôle qualité de 100 points par unité, inspections en cours de fabrication, essais de pression (1,25x / 24-48h) et traçabilité au niveau du numéro de série. Documentation CE/ISO préparée en parallèle.
      icon: tabler:clipboard-check
    - title: Marquage & emballage
      description: Apposition du logo en marque propre, habillages personnalisés de coque et de flotteurs, documentation propriétaire à votre marque, emballage prêt pour la vente ou palettisé et préparation des kits de pièces de rechange.
      icon: tabler:palette
    - title: Export & documentation
      description: Emballage export, plan de chargement conteneur, documentation FOB/CIF/DDP, dossier de conformité par marché de destination et protocole de communication après livraison.
      icon: tabler:world

content_risk_control:
  tagline: Maîtrise des risques & livraison
  title: Gestion des risques<br />et des délais de livraison
  subtitle: Les acheteurs OEM/ODM professionnels attachent autant d'importance à la maîtrise des risques qu'à la qualité du produit. Voici comment nous la gérons.
  items:
    - title: Définition du périmètre & de la propriété
      description: 'Avant le début du développement, nous définissons par écrit : périmètre de personnalisation, exigences d''outillage, critères d''approbation des échantillons, propriété des plans et des moules et responsabilités documentaires. Aucune ambiguïté sur qui possède quoi.'
      icon: tabler:file-text
    - title: Processus de gestion des modifications
      description: Toute modification de spécification après validation du design suit un processus documenté de demande de modification avec évaluation d'impact (coût, délais, conformité). Aucune modification non approuvée n'entre en production.
      icon: tabler:arrows-diff
    - title: Garantie de cohérence des lots
      description: La 50e unité est identique au 1er échantillon approuvé. Les spécifications approuvées sont gelées, les paramètres matériaux et processus verrouillés, et des points de contrôle en cours de fabrication vérifient la cohérence sur toute la série.
      icon: tabler:repeat
    - title: Transparence sur les délais & la capacité
      description: Les délais sont calculés sur la base de la capacité de production réelle, des niveaux de stock de matières et de la charge de commandes en cours — et non d'objectifs théoriques. Un planning de production avec jalons datés est fourni pour chaque commande.
      icon: tabler:calendar-stats

faq:
  title: RIB OEM/ODM — Foire aux questions
  questions:
    - q: Quelle est la différence entre OEM et ODM pour les bateaux RIB ?
      a: "OEM (Original Equipment Manufacturing) : vous fournissez des spécifications détaillées et nous construisons votre conception. ODM (Original Design Manufacturing) : vous sélectionnez une plate-forme Aquafarer RIB éprouvée et nous la personnalisons avec les fonctionnalités et la marque souhaitées. L'ODM est plus rapide et moins coûteux ; L'OEM offre un contrôle maximal de la conception."
    - q: Puis-je personnaliser la forme et la taille de la coque du RIB ?
      a: Oui. Nous proposons des modifications semi-personnalisées des moules de coque existants (différentes configurations de pont, configurations de tubes) et un développement de coque entièrement personnalisé avec de nouveaux moules usinés CNC. Les projets semi-personnalisés peuvent démarrer avec 2 à 5 unités ; la personnalisation complète nécessite généralement des engagements plus élevés.
    - q: Quels matériaux de tubes sont disponibles pour les RIB personnalisés ?
      a: Nous proposons du PVC de 0,9 à 1,2 mm pour un usage récréatif et commercial léger, et de l'Hypalon/CSM de 1,4 à 1,7 mm pour les applications professionnelles, de sauvetage et commerciales nécessitant une résistance supérieure aux UV et à l'ozone (durée de vie de 10 à 15 ans contre 5 à 8 ans pour le PVC).
    - q: Pouvez-vous configurer des RIB pour des applications spécifiques comme le sauvetage, la plongée ou la pêche ?
      a: Oui. Nous maintenons des modèles de configuration éprouvés pour les applications de sauvetage/patrouille, d'assistance à la plongée, de tourisme/affrètement, de pêche, d'annexe de yacht et de bateau de travail professionnel. Chaque modèle comprend le type de coque recommandé, le matériau des tubes, la disposition du pont et l'équipement, que nous personnalisons ensuite selon vos besoins précis.
    - q: De quelles informations avez-vous besoin pour un devis RIB OEM/ODM ?
      a: Application cible, longueur de coque souhaitée, préférence en matière de matériau de tube (PVC ou Hypalon), quantité approximative et calendrier de livraison, exigences de conformité du marché cible et tout produit ou spécification de référence. Plus vous fournissez de détails, plus notre devis sera rapide et précis.
    - q: Quel est le MOQ pour les bateaux RIB personnalisés ?
      a: 'Pour les moules de coque existants avec des modifications standard, le MOQ commence à 2 à 5 unités par conception. Pour les moules personnalisés et le développement entièrement personnalisé, le MOQ dépend de la complexité du projet : généralement 10 à 20 unités pour les produits semi-personnalisés et plus de 30 pour les produits entièrement personnalisés avec de nouveaux outils.'
    - q: À qui appartiennent les moules et les dessins personnalisés ?
      a: Les moules développés à partir des conceptions de base Aquafarer restent la propriété d'Aquafarer. Les moules entièrement personnalisés commandés et payés par le client peuvent être attribués à la propriété du client selon les termes du contrat. Toutes les conditions de propriété des moules sont documentées avant le début du projet.
    - q: Comment les RIB personnalisés sont-ils conditionnés pour l’exportation ?
      a: "Standard : berceau sur mesure + film étirable pour le chargement des conteneurs. Premium : emballage prêt à la vente, sous vide ou palettisé. Nous proposons l'expédition FOB Qingdao, CIF et DDP. Documentation d'exportation complète et dédouanement inclus."
