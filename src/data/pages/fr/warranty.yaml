label: Garantie
headline: Paddle Board Overstock Garantie Limitée du Fabricant
subtitle: Paddle Board Overstock garantit la qualité de chaque planche gonflable SUP que nous fabriquons. Cette Garantie Limitée définit les termes et la couverture pour votre planche Paddle Board Overstock.
seo:
  headline: Paddle Board Overstock SUP Garantie — Garantie Limitée de 2 Ans | Paddle Board Overstock
  description: Paddle Board Overstock offre une garantie limitée de 2 ans couvrant les coutures de drop-stitch, la construction des rails, les valves d'inflation et les accessoires inclus sur chaque planche SUP. Termes et conditions complets.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Cette Garantie Limitée s'applique aux nouvelles planches gonflables Paddle Board Overstock de marque achetées directement auprès de la boutique en ligne Paddle Board Overstock. La date d'effet correspond à la date vérifiable de l'achat initial.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Couverture et Durée de la Garantie</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Ans</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch structure du noyau et du pont</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Ans</h3>
          <p class="text-sm text-gray-600 mt-1">Construction des rails et des coutures</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Ans</h3>
          <p class="text-sm text-gray-600 mt-1">Fonctionnement des valves d'inflation</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Ans</h3>
          <p class="text-sm text-gray-600 mt-1">Accessoires inclus (pompe, pagaie, leash, aileron)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 An*</h3>
          <p class="text-sm text-gray-600 mt-1">Usage commercial, de location ou en flotte — tous les composants</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*L'utilisation commerciale, de location ou en flotte réduit la garantie à 1 an. L'utilisation en course ou en compétition annule totalement la garantie.</p>
    </div>

    <h2>Ce qui est couvert</h2>
    <h3>Drop-Stitch Structure du Noyau et du Pont (2 Ans)</h3>
    <p>Le noyau interne drop-stitch et la structure externe de la planche sont garantis contre les défauts de fabrication compromettant la capacité de la planche à maintenir l'inflation opérationnelle et la rigidité.</p>

    <h3>Construction des Rails et des Coutures (2 Ans)</h3>
    <p>Les coutures et bandes de rail à triple couche, assemblées lors de la fabrication, sont garanties contre les défauts de fabrication entraînant des fuites d'air importantes par la couture. L'inspection périodique et le maintien de la pression d'inflation appropriée sont des conditions de cette couverture.</p>

    <h3>Fonctionnement des Valves d'Inflation (2 Ans)</h3>
    <p>Les valves d'air installées initialement par Paddle Board Overstock sont garanties contre les défauts de fabrication des matériaux ou de la main-d'œuvre empêchant la valve de retenir l'air conformément à sa conception.</p>

    <h3>Accessoires Inclus (2 Ans)</h3>
    <p>La pompe, la pagaie ajustable, le leash, l'aileron amovible et d'autres composants inclus dans votre pack de planche sont garantis contre les défauts de matériaux et de fabrication.</p>

    <h2>Ce qui n'est pas couvert</h2>
    <ul>
      <li>Défauts esthétiques incluant la décoloration, les taches, le blanchiment, la craie ou tout changement d'apparence</li>
      <li>Piqûres, coupures, déchirures, lacérations ou autres dommages physiques</li>
      <li>Fissures, craquelures, abrasions, éraflures ou détérioration due au frottement ou au contact</li>
      <li>Dégradation due à l'exposition à la lumière UV, aux intempéries ou aux conditions atmosphériques</li>
      <li>Dommages causés par le contact avec des solvants, acides, alcalis ou produits chimiques</li>
      <li>Dommages dus à la négligence, à une utilisation inappropriée, à des abus, à un accident ou à une usure normale</li>
      <li>Dommages dus à un impact, à un stress, à un support inadéquat ou au transport</li>
      <li>Dommages dus à une inflation ou déflation inappropriée ou à l’utilisation de dispositifs d’inflation non approuvés</li>
      <li>Équipements, composants ou systèmes tiers (couverts par leurs fabricants respectifs)</li>
    </ul>

    <h2>Obligation du fabricant et recours</h2>
    <p>Paddle Board Overstock l’obligation exclusive et exclusive de la réparation ou du remplacement, à Paddle Board Overstock sa discrétion, de tout composant jugé défectueux en matériaux ou en qualité de fabrication et couvert par cette garantie. Les réparations ou remplacements sont effectués par Paddle Board Overstock ou par son centre de service désigné. Les composants réparés ou remplacés ne sont garantis que pour la portion non expirée de la période de garantie initiale.</p>

    <h2>Conditions de garantie</h2>
    <ul>
      <li><strong>Entretien :</strong>Le produit doit être entretenu conformément aux Paddle Board Overstock directives publiées par 's, y compris des inspections périodiques et le maintien des pressions de gonflage appropriées.</li>
      <li><strong>Coopération :</strong>L’acheteur doit coopérer pleinement et rapidement Paddle Board Overstock dans toutes les questions relatives aux réclamations de garantie.</li>
      <li><strong>Acheteur initial :</strong>Cette garantie est étendue exclusivement à l’acheteur final initial et n’est pas transférable.</li>
    </ul>

    <h2>Usage commercial</h2>
    <p>Si le produit est utilisé à des fins commerciales, de location ou de flotte, la période de garantie pour tous les composants est réduite à un (1) an à partir de la date d’achat initiale. L’utilisation en course, en compétition de vitesse ou d’endurance annule immédiatement et irrévocablement la garantie.</p>

    <h2>Comment faire une réclamation de garantie</h2>
    <p>Paddle Board Overstock Contactez-le avec une preuve d’achat et une description détaillée du problème.Paddle Board Overstock examinera la réclamation et fournira les instructions pour l’inspection et le service.</p>
    <p>Pour toute question de service sous garantie, veuillez nous contacter via notre<a href="/contact" class="text-sky-600 underline">Page de contact</a>avec votre numéro de commande et les détails du produit.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Cette déclaration de garantie est un résumé de la Paddle Board Overstock garantie limitée complète du fabricant. Le document légal complet de garantie régit tous les termes et conditions de la garantie. Les spécifications peuvent être modifiées sans préavis.Paddle Board Overstock est une marque d’usine du Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
