hero:
  tagline: Solutions pour détaillants
  title: Planches de paddle pour détaillants —<br />Approvisionnez votre boutique avec des planches en surstock SUP
  subtitle: Fourniture en gros adaptée aux petites entreprises de planches gonflables neuves SUP pour magasins de plage, vendeurs en ligne et détaillants sportifs. Commencez à partir de 5 planches, mélangez n'importe quel modèle en stock et expédiez dans 50+ pays.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Planches gonflables neuves en surstock prêtes pour les étagères des magasins
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves en surstock aux détaillants indépendants du monde entier. Les commandes en gros commencent à seulement 5 planches, et vous pouvez mélanger n'importe quel modèle en stock dans un seul envoi — ainsi un petit magasin peut stocker des planches polyvalentes, de randonnée et de la série Art sans remplir un conteneur. Chaque planche est testée à 100% sous pression avant l'expédition et couverte par la garantie de 2 ans SUP. Les commandes sont expédiées depuis notre base de Weihai, en Chine, par fret aérien express ou transport maritime consolidé vers plus de 50 pays.
tldr_label: Réponse rapide pour détaillants
packages_section:
  badge: Retail Stock Packages
  title: Approvisionnez votre magasin selon le type d'activité
  subtitle: Des magasins de plage aux boutiques en ligne — commandes de départ flexibles conçues pour les détaillants indépendants.
solution_offerings:
  - title: Stock de départ pour magasins de plage et surf
    subtitle: Pour les détaillants côtiers servant les touristes et les locaux
    badge: Popular
    features:
      - title: Petites commandes de départ
        description: Commencez avec 5 planches et réassortissez au fur et à mesure de la saison — aucun engagement sur conteneur
      - title: Meilleures ventes mixtes
        description: Combinez des planches polyvalentes stables pour débutants et des modèles style surf pour les locaux dans une seule commande
      - title: Forfaits complets
        description: Chaque planche est livrée avec son kit complet d'accessoires — pagaie, pompe, leash et sac prêts pour l'étagère
      - title: Option de réassort rapide
        description: Le fret aérien express permet d'obtenir rapidement à votre porte 1 à 3 planches supplémentaires lorsqu'un modèle est en rupture
      - title: Stock prêt pour présentation
        description: Planches neuves, scellées en usine, qui font bonne impression en magasin et en ligne
    cta_text: Planifiez le stock de mon magasin
    cta_href: /wholesale-paddle-boards#inquiry
  - title: Stock pour boutique en ligne
    subtitle: Pour les vendeurs e-commerce et marketplaces
    badge: Growing
    features:
      - title: Testez la catégorie à moindre coût
        description: Commencez avec une commande mixte de 5 planches pour savoir quels modèles votre marché achète avant d’étendre l’offre
      - title: Différenciation série Art
        description: EVA assemblage en blocs et imprimés artistiques qui se démarquent dans les annonces des marketplaces
      - title: Stock favorable à la photographie
        description: Unités neuves et cohérentes — chaque client reçoit la planche montrée dans l'annonce
      - title: Prix Direct Usine
        description: L'approvisionnement en surstock maintient les coûts unitaires bas sans risque de volume
      - title: Géographie Mondiale de Livraison Directe
        description: Expédiez à votre entrepôt ou point de distribution dans 50+ pays
    cta_text: Planifiez Mon Stock en Ligne
    cta_href: /wholesale-paddle-boards#inquiry
  - title: Gamme de Vente au Détail Sports & Plein Air
    subtitle: Pour les magasins de sport ajoutant une catégorie SUP
    badge: Range
    features:
      - title: Assortiment Échelonné
        description: Planches d'entrée polyvalentes, de touring moyen et d'art haut de gamme pour couvrir différents niveaux de prix
      - title: Flexibilité saisonnière
        description: Tailles de commande adaptées à votre saison — pas d'obligation de stock toute l'année
      - title: Assistance Garantie
        description: La Garantie de 2 Ans SUP soutient votre promesse de service après-vente
      - title: Fiches Techniques & Médias
        description: Spécifications produit et images pour soutenir la présentation en rayon et au catalogue
      - title: Fret Maritime Consolidé
        description: Expédition économique pour les commandes saisonnières plus importantes
    cta_text: Planifiez Ma Gamme de Détail
    cta_href: /wholesale-paddle-boards#inquiry
