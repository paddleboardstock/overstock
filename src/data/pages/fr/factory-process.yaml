hero:
  tagline: Processus
  title: Procédé de fabrication
  subtitle: De la matière première à la planche prête pour la mer — chaque étape sous notre contrôle
  back_label: Retour à l’usine
  back_link: /factory
intro: Contrairement aux marques qui externalisent la production à des usines tierces, Paddle Board Overstock elle possède et exploite toute sa chaîne de production. Cette intégration verticale nous permet de maintenir un contrôle qualité strict à chaque étape et de fournir une qualité de produit cohérente lot après lot. Voici comment une carte est construite dans notre installation.
steps:
  - step: '01'
    title: Réception et inspection des matériaux
    description: Chaque lot entrant de PVC tissu, drop-stitch noyau, EVA mousse et quincaillerie est inspecté selon les spécifications. Les échantillons de tissu sont testés pour la résistance à la traction, l’uniformité de l’épaisseur et UV la résistance avant leur mise en production. Les matériaux non conformes sont mis en quarantaine et retournés.
    duration: 1–2 jours
  - step: '02'
    title: PVC Coupe automatique
    description: Les tissus approuvés sont posés sur la CNC machine de découpe automatique et découpés avec une précision submillimétrique. Le nesting optimisé par ordinateur organise les panneaux pour minimiser les déchets — généralement en dessous de 5 %. Les panneaux découpés sont étiquetés par modèle de panneau et par chambre, puis regroupés pour être transférés à l’atelier de soudure.
    duration: 2 à 4 heures par kit de planche
  - step: '03'
    title: Étanchéité thermique et soudure de tubes
    description: Les panneaux sont fixés et collés à l’aide de machines thermoscellantes avec soudure à air chaud à des températures contrôlées de 200 à 600 °C. Les joints principaux sont renforcés par soudure diélectrique RF pour des joints étanches et résistants. Les chambres terminées sont gonflées à 1,25 × de pression de travail pour une validation de rétention d’air de 30 minutes.
    duration: 1 à 2 jours par conseil
  - step: '04'
    title: Art de deck & EVA finition
    description: 'Les decks de la série Art prennent forme ici : EVA des panneaux en mousse taillés avec précision sont posés en motifs complets, collés et découpés à la main. Adhérents, confortables et durables — le style signature de chaque planche de la série Art.'
    duration: 1–2 jours
  - step: '05'
    title: SUP Impression et décoration
    description: SUP Les graphiques de plateau sont appliqués par l’impression numérique pour des designs en couleur à la qualité photo, et la sérigraphie pour des logos durables et des motifs répétitifs. Les impressions sont durcies et scellées pour UV une résistance à l’abrasion.
    duration: 1–2 jours
  - step: '06'
    title: Montage final et montage
    description: 'Les cartes reçoivent leurs composants finaux : les soupapes sont torquées et testées en fonction, les anneaux en D, les poignées et les boîtes à dérives sont installés, et la fixation de la laisse est sécurisée. Chaque carte suit une liste de contrôle d’assemblage de 100 points avec une validation obligatoire à chaque étape.'
    duration: 2 à 3 jours
  - step: '07'
    title: Tests et inspections qualité
    description: 'Chaque planche achevée subit une porte de qualité obligatoire : test de rétention d’air dans la chambre, vérification du fonctionnement des systèmes, vérification du couple des fixations et inspection esthétique. Les constructions personnalisées et prototypes font également l’objet d’essais en mer en mer couvrant vitesse, maniabilité, stabilité et endurance.'
    duration: 1–2 jours
  - step: '08'
    title: Emballage et expédition
    description: Les planches sont dégonflées, roulées et emballées dans des sacs à dos de voyage avec pompe, pagaie, dérive, laisse et kit de réparation, puis emballées pour le transport et le fret. Chaque colis est étiqueté avec modèle, numéro de série et destination. Nous expédions dans 50+ pays à travers le monde.
    duration: 1 jour
