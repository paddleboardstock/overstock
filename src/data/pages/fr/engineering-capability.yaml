content_capability:
  tagline: Capacité d'ingénierie
  title: Ce que notre équipe d'ingénierie<br />offre
  subtitle: L'ingénierie Paddle Board Overstock couvre le cycle de vie complet du produit, depuis l'étude de marché et la conception jusqu'au prototypage, aux tests et à la production de masse.
  items:
    - title: Dessin industriel
      description: Notre équipe de conception industrielle travaille à partir des exigences des clients, des études de marché et de l'analyse concurrentielle pour développer des concepts de produits qui équilibrent l'esthétique, la fonctionnalité et la fabricabilité. Nous produisons des croquis 2D, des rendus 3D et des documents de spécifications pour examen par le client avant de nous engager dans l'outillage.
      features:
        - Développement de concepts et études de faisabilité
        - Dessins de conception 2D et rendus 3D
        - Sélection et spécification des matériaux
        - Analyse de conception pour la fabrication (DFM)
        - Évaluation ergonomique et de sécurité
    - title: Ingénierie des structures
      description: "Nos ingénieurs en structure sont spécialisés dans l'architecture des bateaux pneumatiques : conception de la coque, configuration des chambres tubulaires, ingénierie du noyau à points de chute et répartition de la charge. Chaque conception est analysée pour en vérifier l'intégrité structurelle, l'optimisation du poids et la conformité aux normes en vigueur (CE, ISO, AS)."
      features:
        - Conception de coques en fibre de verre à V profond avec angles de deadrise calculés
        - Configuration de tubes multicompartiments pour la sécurité et la flottabilité
        - Spécification de l'âme en drop-stitch et optimisation de la densité
        - Analyse par éléments finis des composants porteurs
        - Calculs de répartition des poids et de stabilité
    - title: Modélisation 3D et CAO
      description: Toutes les conceptions de produits sont développées en CAO 3D avant le début de l'outillage du prototype. Nos ingénieurs utilisent SolidWorks et Rhino 3D pour la modélisation de produits, permettant aux clients d'examiner chaque détail, du profil du tube à la disposition de la console, avant de s'engager dans la production.
      features:
        - Modélisation CAO 3D complète dans SolidWorks et Rhino 3D
        - Rendus photoréalistes pour les présentations clients
        - Dossiers de plans techniques pour la production
        - Conception de moules et d'outillages à partir de modèles 3D
        - Transfert direct des données CAO vers CNC pour une découpe de précision
    - title: Prototypage et tests
      description: "Avant la production en série, chaque nouveau produit passe par la phase de prototype. Nous construisons des prototypes fonctionnels pour l'évaluation des clients, puis les soumettons à notre protocole de test complet : tests de pression, tests de stabilité, tests de charge et essais à l'eau. Les itérations de conception au stade du prototype sont rapides et rentables."
      features:
        - Outillage rapide de prototypes (délai de 15 à 20 jours)
        - Prototype fonctionnel pour une évaluation en conditions réelles
        - Protocole d'essais complet avant validation de la production
        - Affinage itératif de la conception sur la base des résultats d'essais
        - Jalon d'approbation client avant l'outillage de production
    - title: Intégration d'accessoires personnalisés
      description: "De nombreux projets OEM nécessitent l'intégration d'accessoires fournis par le client ou tiers : consoles personnalisées, sièges spécialisés, systèmes électroniques, supports d'équipement de plongée ou éléments de marque. Notre équipe d’ingénierie gère la conception d’intégration, l’adaptation structurelle et la validation qualité de tous les accessoires."
      features:
        - Conception de consoles et agencement des tableaux de bord
        - Intégration de sièges et de sellerie personnalisés
        - Conception et câblage des systèmes électroniques
        - Systèmes de fixation pour équipements de plongée et de sauvetage
        - Spécifications d'application de branding et de graphiques
content_process:
  tagline: Processus de développement
  title: Du concept<br />à la production
  subtitle: Notre processus de développement de produits suit un flux de travail structuré en 6 étapes conçu pour minimiser les risques, réduire les délais et garantir la préparation à la fabrication dès le premier jour.
  stages:
    - stage: '01'
      title: Exigences et recherche
      duration: 1-2 semaines
      description: Nous travaillons avec le client pour définir les spécifications du produit, les exigences du marché cible, les besoins de conformité réglementaire et les objectifs commerciaux. Cette étape produit un document d'exigences du produit (PRD) qui guide tous les travaux ultérieurs.
      deliverables: PRD, analyse de marché, benchmark concurrentiel, estimation préliminaire des coûts
    - stage: '02'
      title: Conception conceptuelle
      duration: 2-3 semaines
      description: L'équipe de design industriel développe des concepts de produits basés sur le PRD. Plusieurs options de conception sont présentées avec des rendus 3D, des recommandations de matériaux et des évaluations techniques initiales. Le client sélectionne la direction pour un développement détaillé.
      deliverables: Rendus de concept 3D, spécifications des matériaux, justification de la conception, nomenclature préliminaire
    - stage: '03'
      title: Ingénierie détaillée
      duration: 2-4 semaines
      description: "Le concept sélectionné est entièrement conçu : modélisation CAO 3D, analyse structurelle, configuration des tubes, conception de la coque, intégration des accessoires et documentation de production. Toutes les dimensions, matériaux et processus sont spécifiés pour l'outillage."
      deliverables: Modèle CAO 3D complet, dessins techniques, nomenclature finale, spécifications d'outillage, plan de contrôle qualité
    - stage: '04'
      title: Prototypage
      duration: 2-3 semaines
      description: Des outils prototypes sont produits et des échantillons fonctionnels sont construits. Le client examine le prototype par rapport aux spécifications PRD. Les tests sont effectués selon un protocole convenu. Les ajustements de conception sont effectués en fonction des commentaires avant l'outillage de production.
      deliverables: Prototype fonctionnel, rapport de test, journal de révision de conception, document de signature du client
    - stage: '05'
      title: Outillage de production
      duration: 2-3 semaines
      description: "Une fois le prototype approuvé, l'outillage de production est mis en service : moules, gabarits de soudage, programmes de découpe, montages d'assemblage. La documentation CQ et les critères d’inspection sont finalisés. Essai effectué pour la validation du processus."
      deliverables: Outillage de production, documentation des processus, plan d'inspection QC, rapport d'essai
    - stage: '06'
      title: Production de masse et contrôle qualité
      duration: En cours
      description: La production complète commence par un contrôle qualité en cours de processus à chaque étape. Les premiers articles sont inspectés et approuvés avant la libération des lots. Surveillance continue de la qualité, suivi des défauts et amélioration continue tout au long du cycle de vie de la production.
      deliverables: Calendrier de production, rapports de contrôle qualité, enregistrements de traçabilité des lots, documentation d'expédition
content_customization:
  tagline: Options de personnalisation
  title: Ce qui peut être<br />personnalisé
  subtitle: Presque tous les aspects de nos produits peuvent être personnalisés pour répondre aux exigences des clients. Vous trouverez ci-dessous les catégories de personnalisation les plus courantes.
  columns: 3
  items:
    - title: Coque et structure
      description: Longueur de coque personnalisée, largeur de faisceau, angle d'inclinaison, diamètre du tube, configuration de la chambre et qualité du matériau.
      icon: tabler:sailboat
    - title: Couleurs et graphiques
      description: Couleur du tube (PVC/Hypalon), couleur du gelcoat de la coque, couleur de la console, graphismes du pont, placement du logo et conception de l'emballage.
      icon: tabler:palette
    - title: Console et commandes
      description: Console centrale, console latérale ou barre franche. Disposition personnalisée du tableau de bord, placement des commutateurs et position de la barre.
      icon: tabler:steering-wheel
    - title: Sièges et revêtements
      description: Sièges jockey, banquettes, sellerie luxe, surpiqûres de couleur assortie, configurations rabattables ou amovibles.
      icon: tabler:armchair
    - title: Accessoires et équipements
      description: Échelles de plongée, supports de réservoir, pylônes de remorquage, T-tops, Bimini tops, systèmes audio, électronique de navigation et équipements de sécurité.
      icon: tabler:backpack
    - title: Emballage et image de marque
      description: Emballages de vente au détail personnalisés, boîtes de marque privée, cartons d'expédition portant les marques de la marque, étiquettes volantes et manuels d'utilisation dans la langue du client.
      icon: tabler:box
content_industries:
  tagline: Applications industrielles
  title: Solutions d'ingénierie<br />par secteur
  subtitle: Notre équipe d'ingénierie a développé des produits pour une large gamme d'applications marines, chacune avec des exigences et des critères de performance distincts.
  columns: 3
  items:
    - title: Opérations de plongée
      description: Ponts renforcés, intégration d'échelles de plongée, systèmes de stockage de réservoirs et plates-formes stables pour les centres de plongée commerciaux du monde entier.
      icon: tabler:lifebuoy
    - title: Sauvetage et urgence
      description: Conceptions de coques à grande vitesse, ponts autovideurs, systèmes de montage d'équipement et configurations de sécurité multi-chambres pour les opérations SAR.
      icon: tabler:alert-triangle
    - title: Tourisme marin
      description: Aménagements de confort des passagers, intégration de pare-soleil, systèmes d'embarquement et configurations économes en carburant pour les opérations de transfert entre îles.
      icon: tabler:beach
    - title: Tenders pour yachts
      description: Des conceptions compactes pour le stockage des bossoirs, des options de finition luxueuses, des couleurs assorties au vaisseau-mère et des caractéristiques de remorquage hautes performances.
      icon: tabler:sailboat
    - title: Pêche et aquaculture
      description: Configurations de pont plat, intégration de vivier, dispositions de porte-cannes, matériel résistant à la corrosion pour une exposition continue à l'eau salée.
      icon: tabler:fish
    - title: Portuaire & Industriel
      description: Renforcement de coque robuste, aménagements de bateaux de travail, configurations de transport de personnel et intégration d'équipements pour les opérations offshore.
      icon: tabler:ship
