  tagline: À propos
  title: À propos de {SITE}
  subtitle: Un fabricant d'articles de sports nautiques verticalement intégré — de la matière première au bateau fini
intro:
  - "Aquafarer a été fondé en 2012 avec une mission unique: concevoir et fabriquer des équipements de sports nautiques qui performent aussi bien sur l'eau que dans le rapport qualité. Ce qui a commencé comme un atelier spécialisé de planches SUP est devenu une usine de fabrication intégrée de 12 000 mètres carrés dans la zone de développement économique de Qingdao, produisant des bateaux pneumatiques, RIB, kayaks, planches SUP, équipements de sécurité et accessoires pour des clients dans plus de 50 pays."
  - Aujourd'hui, Aquafarer opère comme une marque d'usine — nous concevons, développons, prototypons, fabriquons et testons tout sous un même toit. Cette intégration verticale nous donne un contrôle direct sur la sélection des matériaux, la qualité de fabrication et les délais de livraison. Chaque bateau est construit par nos équipes, sur nos équipements, selon nos normes.
  - Nous servons des utilisateurs récréatifs, des opérateurs commerciaux, des agences gouvernementales et des partenaires de marque dans le monde entier. Nos programmes OEM et ODM aident les entreprises à lancer leurs propres gammes de produits sans investir dans l'infrastructure d'usine. Que vous ayez besoin d'un prototype unique ou d'une série de production complète, notre équipe vous accompagne du concept à la livraison prête pour la mer.
