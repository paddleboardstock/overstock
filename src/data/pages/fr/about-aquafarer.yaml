values:
  - title: La qualité d'abord
    desc: Chaque bateau quittant notre usine passe des tests obligatoires de rétention d'air, de pelage des soudures et de vérification des systèmes avant expédition.
  - title: Intégration verticale
    desc: Nous contrôlons chaque étape — de la découpe du PVC à l'assemblage final — éliminant les inefficacités des sous-traitants et garantissant une qualité constante.
  - title: La sécurité comme standard
    desc: La certification CE est au cœur de ce que nous construisons. Nos 64 modèles certifiés CE répondent aux normes de sécurité de l'UE pour un usage récréatif et commercial.
  - title: Centré sur le partenaire
    desc: Nous construisons des relations à long terme avec nos partenaires OEM, ODM et marque blanche grâce à la transparence, la fiabilité et la croissance partagée.
services:
  - title: Fabrication OEM
    desc: Nous fabriquons selon vos spécifications. Partagez vos dessins, et notre équipe d'ingénierie s'occupe du prototypage, de l'outillage et de la production.
  - title: Solutions ODM
    desc: Partez de nos conceptions de plateformes éprouvées. Personnalisez la taille, la couleur, les graphismes et l'emballage pour créer votre gamme de produits unique.
  - title: Marque blanche
    desc: Votre nom de marque, votre logo, votre emballage. Les produits arrivent prêts à la vente avec une intégration complète de la marque.
  - title: Image de marque personnalisée
    desc: Impression du deck, graphismes de coque, décalcomanies de tubes et étiquettes personnalisées — présence de marque cohérente sur chaque surface.
certifications:
  - name: Certification CE
    desc: Nos bateaux et embarcations sont conformes à la directive européenne sur les bateaux de plaisance (2013/53/EU) et aux normes harmonisées pertinentes.
    scope: Bateaux et embarcations
