content_system:
  tagline: Aperçu du système CQ
  title: Qualité intégrée<br />Cadre de contrôle
  subtitle: Notre système de contrôle qualité fonctionne de manière indépendante de la production et rend compte directement à la direction. Aucun lot n'est expédié sans une libération de qualité signée par le laboratoire de qualité.
  items:
    - title: Laboratoire de Qualité Indépendant
      description: Notre laboratoire de qualité fonctionne comme une fonction distincte de la production. Les inspecteurs de contrôle qualité rendent compte au Responsable Qualité, et non au Directeur de Production. Cette indépendance organisationnelle garantit que les décisions en matière de qualité sont prises de manière objective — les délais de production ne prévalent jamais sur les exigences de qualité.
      features:
        - Rend compte directement à la direction, indépendamment de la production
        - Autorisé à arrêter la production pour des problèmes de qualité
        - 12 inspecteurs QC dédiés à toutes les étapes
        - Tous les équipements de test sont calibrés annuellement
    - title: Traçabilité des lots
      description: Chaque lot de matière première se voit attribuer un numéro de lot unique dans notre système ERP. De l'arrivée des matières à la production jusqu'au produit fini, la nomenclature de chaque carte renvoie aux lots de fournisseurs d'origine. Cela permet une traçabilité complète en amont pour toute demande liée à la qualité ou à la conformité.
      features:
        - Suivi de lots basé sur ERP depuis le matériau jusqu'au produit fini
        - Étiquettes de lot physiques sur chaque ordre de travail
        - 100 % de couverture des matériaux — PVC, drop-stitch, EVA mousse, matériel, adhésifs
        - Dossiers conservés pendant 10 ans
    - title: Gestion de la qualité
      description: Nos procédures de contrôle qualité suivent des protocoles internes documentés. Les résultats des tests sont enregistrés, traçables et examinés par notre laboratoire de qualité indépendant. Taux de défaut de 0,7 % sur les expéditions des 12 derniers mois.
      features:
        - Protocoles internes de contrôle qualité documentés, examinés annuellement
        - Taux de 99,3 % sans défaut sur les expéditions des 12 derniers mois
        - Tolérance zéro pour les défauts critiques pour la sécurité
        - Dossiers conservés pendant 10 ans
content_inspection:
  tagline: Étapes d’inspection
  title: Six étapes<br />Processus d’inspection
  subtitle: Chaque produit passe par 6 étapes d’inspection avec des points de contrôle qualité documentés. Les défauts sont détectés tôt, les actions correctives sont immédiates, et chaque lot est entièrement traçable.
  stages:
    - stage: '1'
      title: Inspection des matériaux entrants
      description: Tous les matériaux entrants sont enregistrés par lot/numéro de lot et mis en quarantaine jusqu’à la signature du contrôle qualité.PVC Les rouleaux de tissu sont testés pour leur résistance à la traction, la résistance à la déchirure et leur épaisseur.Drop-stitch Les cœurs, vannes, adhésifs et matériels sont inspectés visuellement et mesurés selon les spécifications.
      checks: Résistance à la traction, résistance à la déchirure, jauge d'épaisseur, viscosité de l'adhésif, inspection visuelle des défauts
      threshold: 100 % des lots testés. Rejeter si la résistance à la traction < 90 % de la spécification, déchirure < minimum de la spécification, ou tout défaut visuel
    - stage: '2'
      title: QC en cours de traitement — Découpe et préparation
      description: CNC- les panneaux découpés sont vérifiés dimensionnellement par rapport aux fichiers sources CAO tous les 20 panneaux. La qualité des bords est inspectée pour détecter des effilochages, des coupes inégales ou des dérives dimensionnelles. Le nombre de panneaux est vérifié par rapport au BOM pour chaque lot de production avant que les matériaux ne passent à la soudure.
      checks: Contrôle dimensionnel par rapport aux fichiers CAD DXF, inspection de la qualité des bords, vérification du nombre de panneaux
      threshold: Tolérance ±0,5 mm. Rejetez le lot si >2 % hors tolérance
    - stage: '3'
      title: Contrôle qualité en cours de processus — Soudage et collage
      description: Pendant la production, la qualité de la soudure est continuellement surveillée. Les tests de pelage sont réalisés sur des échantillons toutes les 50 unités. La largeur de soudure est mesurée selon les spécifications. Les registres de température de l’air chaud sont examinés pour en assurer la cohérence. Chaque joint est inspecté visuellement sous rétroéclairage pour détecter des canalisations ou des vides.
      checks: Test de décollement toutes les 50 unités, mesure de la largeur de soudure, revue du journal de température de l’air chaud, inspection des joints rétroéclairés
      threshold: 'Résistance au décollement : minimum 8 N/cm. Tolérance de largeur de ±soudure : 1 mm. Tout canal visible = rejet'
    - stage: '4'
      title: Contrôle qualité-assemblage
      description: Chaque unité suit une liste de contrôle d’assemblage de 100 points approuvée par le chef d’équipe. Le fonctionnement des soupapes est testé à travers 10 cycles d’ouverture/fermeture. Le couple matériel est vérifié. L’inspection visuelle couvre la finition de surface, la cohérence des couleurs, le placement des étiquettes et la complétude des accessoires.
      checks: Liste de contrôle en 100 points par unité, test de fonctionnement des soupapes, vérification du couple matériel, inspection visuelle
      threshold: 'Politique zéro défaut sur les éléments critiques pour la sécurité (vannes, anneaux en D, poignées). Esthétique mineur : cible sans défaut à 99,3 %'
    - stage: '5'
      title: Test de pression
      description: Chaque chambre est gonflée à 1,25 × de pression nominale et maintenue pendant 24 à 48 heures. Les capteurs de pression enregistrent en continu tout au long de la période de retenue. Les relevés compensés par la température garantissent la précision. Toute chambre dépassant 5 % de chute de pression est rejetée et envoyée pour réinspection des joints avec un retest à 100 % de l’ensemble du lot de production.
      checks: Journal de maintien de pression sur 24-48h, calibration du capteur vérifiée quotidiennement, lecture compensée par température, retest de la jointure après réparation
      threshold: Chute de pression maximale de 5 % sur 24 heures à température stable. Dépasser = 100 % de retest de tout le lot
    - stage: '6'
      title: Inspection finale et libération de l’expédition
      description: Inspection visuelle et fonctionnelle finale avant l’emballage. Les défauts de surface, la cohérence des couleurs, la vérification de l’étiquette/BIN, l’intégrité de l’emballage et la complétude des accessoires sont vérifiés par rapport à la commande du client. Les unités sont emballées sous vide, emballées et palettisées. La validation finale du contrôle qualité est requise avant toute sortie de produit de l’usine.
      checks: Inspection visuelle complète, liste de contrôle des accessoires par SKU application, test de chute d’emballage (échantillon aléatoire de 1 million), vérification de la balayage de l’étiquette/code-barres
      threshold: Défauts de sécurité à tolérance zéro. Cible sans défaut à 99,3 %. 100 % des unités inspectées visuellement
content_equipment:
  tagline: Équipements de test
  title: Laboratoire QC<br />Équipement
  subtitle: Notre laboratoire qualité est équipé d’équipements de test spécialisés pour la vérification des matériaux, l’intégrité de la soudure et la validation des performances du produit.
  columns: 3
  items:
    - title: Machine d’essai de traction
      description: Mesure la résistance à la traction et l’allongement du tissu selon le protocole de test interne. Utilisé pour la qualité de qualité entrante de tous PVC drop-stitch les lots et des lots de tissus.
      icon: tabler:scale
    - title: Chambre de température
      description: Chambre environnementale pour UV les essais de résistance et les tests de flexibilité à basse température. Simule des conditions de fonctionnement extrêmes.
      icon: tabler:temperature
    - title: Capteurs de pression et enregistreurs
      description: Capteurs de pression numériques avec journalisation continue des données pour des tests de rétention d’air de 24 à 48 heures. Compensation de température pour la précision.
      icon: tabler:wind
    - title: Banc d’essai de décollage
      description: Équipement calibré de test de pelage pour la vérification de la résistance des joints de soudure. Échantillons aléatoires de chaque lot de production.
      icon: tabler:files
    - title: Bassin de détection de fuites
      description: Réservoir d’eau pour les tests de fuite submergée dans les chambres gonflées. Détection visuelle des bulles pour la vérification de l’intégrité des joints et des vannes.
      icon: tabler:ripple
    - title: Outils d’inspection
      description: Outils de mesure calibrés — jauges d’épaisseur, clés dynamométriques, étriers dimensionnels, testeurs de dureté pour stations de contrôle qualité de production.
      icon: tabler:tools
content_metrics:
  tagline: Performance QC
  title: Contrôle de qualité<br />Métriques
  subtitle: Données réelles de réussite/échec de notre chaîne de production. Ces indicateurs sont surveillés quotidiennement et examinés mensuellement par la direction.
  columns: 3
  items:
    - title: 100 % des unités testées
      description: Chaque chambre de chaque panneau est testée sous pression avant l’expédition. Pas d’échantillonnage — inspection à 100 % de l’intégrité de la pression.
      icon: tabler:check
    - title: < Chute de pression de 5 %
      description: Perte maximale de pression autorisée sur 24 à 48 heures à 1,25× pression nominale. Toute chambre dépassant ce seuil déclenche un nouveau test par lots.
      icon: tabler:gauge
    - title: 99,3 % sans défaut
      description: Taux sans défaut sur les expéditions sur 12 mois à venir. Tolérance zéro pour les défauts critiques pour la sécurité.
      icon: tabler:clipboard-check
    - title: Attente de 24 à 48 heures
      description: Les planches sont conservées 24 à 48 heures selon le modèle et le lot. Les capteurs de pression enregistrent en continu tout au long de la période de retenue.
      icon: tabler:clock
    - title: 1,25× Pression de test
      description: Marge de sécurité sur chaque chambre — testée à 25 % au-dessus de la pression nominale pour garantir une marge supérieure aux conditions maximales de fonctionnement.
      icon: tabler:arrow-up
    - title: 0 % de défauts de sécurité
      description: Politique de tolérance zéro pour les défauts critiques pour la sécurité — vannes, anneaux en D, joints et chambres de flottabilité. Tout défaut = réinspection à 100 %.
      icon: tabler:shield
