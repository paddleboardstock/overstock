tldr:
  summary: "Système de contrôle qualité en six étapes : inspection des matériaux, contrôle qualité en cours de processus, vérification du soudage, contrôle qualité de l'assemblage, test de pression à 1,25 fois la pression nominale, et inspection finale. Test de pression de 100 % des unités. Taux de conformité de 99,3 % selon un échantillonnage de AQL 2,5."
  points:
    - "Contrôle qualité en six étapes : inspection des matériaux, contrôle qualité en cours de processus, vérification de la soudure, contrôle qualité de l'assemblage, test de pression à 1,25x, et inspection finale à 100 points"
    - Inspection finale de 100 points sur chaque carte avant l'emballage
    - 100 % des unités subissent une mise en attente de 24 à 48 heures à 1,25 fois la pression nominale avec une tolérance de chute maximale de 5 %
    - AQL Échantillonnage de 2,5 assurant un taux de 99,3 % sans défaut
    - 'Contrôle qualité de soudure : test de pelage, vérification de la largeur de la soudure et inspection des soudures avec rétroéclairage sur chaque joint soudé'
