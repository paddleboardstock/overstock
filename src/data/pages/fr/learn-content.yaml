materials:
  intro_p1: Les performances, la durabilité et la sécurité d’une planche à pagaie gonflable dépendent presque entièrement des matériaux utilisés dans sa construction. Du stratifié qui forme la coque aux filetages qui assurent la rigidité d’une SUP planche, chaque choix de matériau influence la performance du produit sur l’eau et sa durée de vie.
  intro_p2: 'Ce guide couvre les trois matériaux principaux utilisés dans les planches pneumatiques modernes : le PVC stratifié, le drop-stitch noyau et EVA la mousse de plateau. Comprendre ces matériaux vous aidera à choisir la planche adaptée à vos besoins et à la maintenir pour une durée de vie maximale.'
  labels:
    advantages: Avantages
    limitations: Limitations
    best_for: 'Idéal pour :'
  items:
    - name: PVC (chlorure de polyvinyle)
      summary: La norme industrielle pour SUPs les stratifiables gonflables. Le tissu laminé multicouches offre un excellent rapport résistance/poids à un prix accessible.
      pros:
        - Excellent rapport qualité-prix
        - Léger et facile à manipuler
        - Bonne UV résistance avec des revêtements appropriés
        - Large gamme de couleurs et de finitions
        - Facile à réparer avec PVC des patchs et de l’adhésif solvant
      cons:
        - Espérance de vie typique de 7 à 10 ans avec des soins appropriés
        - Moins flexible par temps froid
        - Résistance chimique plus faible
        - Peut développer une migration du plastifiant au fil du temps
      best_for: Activités de loisirs et de randonnée SUPs, pagaie en famille, usage saisonnier, environnements d’eau douce et côtières.
    - name: Drop-Stitch Noyau
      summary: La technologie qui a révolutionné SUPs les fils gonflables . Des milliers de fils de polyester relient les couches supérieures et inférieures du tissu, permettant un gonflage à haute pression pour des performances rigides et rigides.
      pros:
        - Extrêmement rigide à 12-20 PSI ans
        - Léger — 18-30 lbs pour une planche de taille normale
        - Se plie à plat pour le stockage et le transport
        - Excellente résistance aux chocs
        - Performance constante sur différentes plages de température
      cons:
        - Nécessite une pompe haute pression
        - La réparation des perforations est plus complexe qu'avec une couche unique
        - Coût de fabrication plus élevé que les gonflables standard
        - La perte de pression au fil du temps nécessite une recharge périodique
      best_for: Planches de paddle et tout équipement nécessitant des performances rigides avec la portabilité d'un gonflable.
    - name: EVA Revêtement en mousse
      summary: Mousse à cellules fermées EVA (éthylène-acétate de vinyle) utilisée pour les pads de traction sur les planches SUP. Offre un amorti, une adhérence et une isolation thermique — et porte les designs de la série artistique.
      pros:
        - Excellente adhérence antidérapante, mouillée ou sèche
        - L'amorti réduit la fatigue lors de longues sessions de pagayage
        - Isolation thermique contre la surface froide de la planche
        - UV et résistant à l'eau salée
        - Disponible en compositions multicolores et designs gravés au laser
      cons:
        - Peut s'user avec un usage intensif sur 2-3 ans
        - Doit être correctement collé pour éviter la délamination
        - Non structurel — n'affecte pas la rigidité
        - Ajoute un léger poids (200-400 g par planche)
      best_for: SUP traction du pont, designs de la série artistique, et toute surface nécessitant une adhérence antidérapante.
  selection:
    title: Guide de sélection des matériaux
    subtitle: "Choisissez le bon matériau en fonction de votre cas d'utilisation principal :"
    headers:
      - Cas d'utilisation
      - Matériau recommandé
      - Pourquoi
    rows:
      - - Paddle récréatif SUP
        - Drop-stitch PVC
        - Léger, rigide, abordable — équilibre idéal pour les pagayeurs occasionnels
      - - Paddle familial et débutants
        - Large drop-stitch PVC (32"+)
        - Stable et indulgent — confiance pour les pagayeurs débutants
      - - Pêche et pagaie avec équipement lourd
        - Large drop-stitch PVC avec pont complet EVA
        - Stabilité supplémentaire pour se tenir debout et lancer, volume élevé pour le matériel
      - - Planches de flotte de location SUP
        - Drop-stitch PVC + EVA pont
        - Durable, réparable, bon rapport qualité-prix pour une utilisation à fort roulement
      - - Touring et longues balades
        - Drop-stitch PVC (~3,35 m)
        - Meilleure trajectoire et glisse efficace sur la distance
      - - Yoga et pagaie fitness
        - Large drop-stitch PVC avec pont complet EVA
        - Plateforme stable et confortable pour les postures et les entraînements
  deep_dive:
    title: Guides approfondis
    topics:
      - title: Marine Grade PVC
        desc: Tissu PVC stratifié en plusieurs couches — résistance UV, tests d'abrasion et évaluations en deniers expliqués.
      - title: PVC Couches de stratifié
        desc: Comment le stratifié en plusieurs couches PVC équilibre résistance, poids et résistance UV.
      - title: Drop-Stitch Noyau
        desc: Comment des milliers de fils internes créent des structures gonflables rigides et haute pression à 15 PSI.
      - title: Technologie de soudure RF
        desc: La soudure à haute fréquence crée des coutures solides et cohérentes — comment cela fonctionne et pourquoi c'est important.
      - title: PSI et performance
        desc: Pourquoi la pression de l'air est importante pour les SUPs gonflables — rigidité, capacité de charge et qualité de glisse.
      - title: Contrôle de qualité
        desc: Tests de pression, tests de flottabilité, vieillissement UV et tests destructifs — notre processus de contrôle qualité.
      - title: Ponts en mousse EVA
        desc: Cales de pont en mousse à cellules fermées EVA — traction, confort et durabilité pour les ponts SUP.
      - title: Entretien du matériel
        desc: Nettoyage, protection UV, prévention de la moisissure et bonnes pratiques de stockage pour les produits gonflables.
