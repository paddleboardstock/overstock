articles:
  sup:
    - title: SUP Bases — Guide du Débutant
      desc: Tout ce qu'un débutant doit savoir — types de planches, taille de la pagaie, position et conseils pour le premier jour.
    - title: Guide des tailles SUP
      desc: Trouvez la bonne longueur, largeur et volume de planche pour votre poids, votre niveau et votre style de pagaie.
    - title: Planches gonflables vs planches dures
      desc: Lequel vous convient ? Portabilité, performance, durabilité et coût comparés.
    - title: Techniques intermédiaires
      desc: Améliorez votre pagaie avec des coups avancés, des techniques de virage et la gestion des eaux agitées.
    - title: Comment choisir un SUP gonflable
      desc: Naviguez parmi les facteurs clés — construction, épaisseur, configuration des ailerons et accessoires inclus.
    - title: Sécurité de l'eau
      desc: Connaissances essentielles en matière de sécurité, y compris la lecture de la météo, le choix de PFD, l’auto-sauvetage et le pagayage en groupe.
  inflatable-boat:
    - title: Référence des matériaux
      desc: Noyaux Drop-stitch, laminés PVC, mousse de pont EVA et valeurs de denier — comprenez de quoi votre planche est faite.
    - title: EVA Art de la Planche expliqué
      desc: Comment les blocs multicolores EVA sont découpés et assemblés à la main pour former un art de pont en pièces qui ne s’efface ni ne se décolle.
    - title: Drop-Stitch Noyau expliqué
      desc: Comment des milliers de fils internes créent une plateforme rigide à 15 PSI pour des SUPs gonflables haute performance.
    - title: Présentation de la technologie des gonflables
      desc: Comment sont construits les paddle boards gonflables — de l’empilage des matériaux aux systèmes de valves et aux soudures de coutures.
    - title: Construction des rails et des coutures
      desc: Comment les bandes de rail en triple couche et les coutures soudées RF maintiennent votre planche hermétique sous pression complète.
    - title: Pourquoi 15 PSI est important
      desc: Comment la pression d’air libère la performance rigide d’une planche dure à partir d’un gonflable transportable.
  water-safety:
    - title: Guide de sécurité aquatique
      desc: Connaissances essentielles en matière de sécurité pour chaque pagayeur — météo, Gilets de sauvetage, auto-sauvetage et protocoles de pagayage en groupe.
    - title: Guide des gilets de sauvetage et PFD
      desc: Comment choisir le bon dispositif de flottaison pour le stand-up paddle — niveaux de flottabilité, ajustement et confort.
    - title: Checklist de sécurité SUP
      desc: Checklist de sécurité pré-lancement que chaque pagayeur de stand-up paddle devrait suivre avant de se mettre à l’eau.
    - title: Sécurité en pagaie en eau froide
      desc: Précautions, équipements et techniques essentiels pour pagayer dans des conditions d’eau froide.
    - title: Erreurs de pagayage pour débutants
      desc: Erreurs courantes des pagayeurs débutants et comment les éviter pour une expérience plus sûre et agréable.
    - title: PFD Laisse et règles de sécurité
      desc: Quand une laisse est essentielle, quels PFD types conviennent SUP à , et l’équipement de sécurité que chaque pagayeur doit porter.
