hero:
  tagline: Mode de vie
  title: Le Paddle Board Overstock<br />Mode de vie
  subtitle: Conçu pour ceux qui vivent sur l’eau — des explorateurs du week-end aux pagayeurs quotidiens qui comptent les jours entre les sessions.
values:
  - icon: 🌊
    title: Né sur l’eau
    desc: Chaque conception commence par comprendre comment l’eau se comporte. Nous ingénions de la limite des conditions vers l’intérieur — parce que l’océan est notre enseignant, pas notre lieu de travail.
  - icon: 🔧
    title: Construit pour durer
    desc: Le produit le plus durable est celui qui n’a pas besoin d’être remplacé. Matériaux de qualité marine, drop-stitch noyaux évalués à 15 PSI, et joints qui durent plus longtemps que la saison.
  - icon: 🏆
    title: Accessible par conception
    desc: Les sports nautiques ne devraient pas être un luxe. Des performances professionnelles à un prix qui a du sens pour les familles, les guides et les pagayeurs quotidiens — pas seulement pour les professionnels.
  - icon: 🌍
    title: Communauté mondiale
    desc: 'De la côte de Weihai aux lacs en Europe, en passant par les rivières d’Asie du Sud-Est et les baies des Amériques — nos clients partagent une chose : l’amour d’être sur l’eau.'
  - icon: ♻️
    title: Fabrication responsable
    desc: CNC- Un nidification optimisée réduit les déchets matériels en dessous de 5 %. La construction durable réduit les cycles de remplacement. Nous construisons pour la longévité car c’est le choix le plus durable.
  - icon: 🤝
    title: Un soutien durable
    desc: Les cartes que nous avons fabriquées il y a des années nous appellent encore pour des pièces détachées. Notre réponse garantie dure en moyenne 24 heures. Nous ne disparayons pas après la vente — nous sommes là pour la durée de vie du produit.
