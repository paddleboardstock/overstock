team_section:
  tagline: L’équipe
  title: Les personnes derrière les planches
  description: Notre siège de Weihai abrite une équipe de recherche et développement de 14+ personnes couvrant les matériaux, la conception structurelle et les processus de production. Autour d’eux opère l’équipe élargie qui gère le contrôle de la qualité, l’inventaire, la logistique et l’assistance que vous contactez — les mêmes personnes, que vous achetiez une planche ou vingt.
