hero:
  tagline: À propos
  title: À propos Paddle Board Overstock
  subtitle: Depuis 2012, nous mettons de nouvelles planches gonflables SUP entre les mains de pagayeurs et de petits détaillants dans 50+ pays — stock excédentaire, prix honnêtes et une garantie que nous respectons réellement.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Des planches gonflables toutes neuves SUP
direct_answer: Paddle Board Overstock est une marque d’équipement pour sports nautiques fondée en 2012 et basée à Weihai, en Chine. Nous vendons des planches gonflables SUP neuves issues de stocks excédentaires — un mélange de production excédentaire de notre propre base de production et de stock soigneusement sélectionné provenant d’usines partenaires — directement aux pagayeurs de fin de gamme et aux petits détaillants dans 50+ pays. Chaque planche est testée à 100 % en pression, garantie 2 SUP ans, et expédiée par fret express ou maritime.
tldr_points:
  - Fondée en 2012, basée à Weihai, en Chine — l’un des SUP principaux pôles industriels mondiaux
  - 'Modèle surstock : cartes neuves à un prix inférieur au prix de détail, pas d’intermédiaires'
  - 'L’inventaire est mixte : production excédentaire de notre base plus des stocks d’usines partenaires vérifiés'
  - 50+ pays desservis, taux de réussite à 99,3 % à l’inspection finale, garantie de 2 ans SUP
story_section:
  tagline: Notre histoire
  title: Pourquoi nous vendons le surstock
  paragraphs:
    - Paddle Board Overstock lancée en 2012 à Weihai, en Chine — une ville côtière de la province du Shandong qui est devenue l’un des pôles de fabrication de pneumatiques les plus importants au monde SUP . À partir de cette base, nous avons passé plus d’une décennie à fabriquer des planches à pagaie gonflables et à les expédier dans le monde entier.
    - Along the way we noticed something that shapes everything we do today: Chaque saison de production laisse derrière elle des planches toutes neuves et parfaitement en bon état — des surplus, des commandes annulées, les coloris de la saison dernière. Pendant ce temps, les détaillants indépendants du monde entier ont été exclus du commerce de gros parce que les fournisseurs traditionnels exigeaient des commandes de taille contenante.
    - Cet écart est notre activité. En vendant des stocks excédentaires — production excédentaire de notre propre base de Weihai, plus des stocks soigneusement sélectionnés d’usines partenaires — nous pouvons proposer des planches toutes neuves à des prix bien inférieurs à ceux du commerce de détail habituel, en quantités adaptées à un seul pagayeur ou à une commande de cinq planches. Rien n’est d’occasion, rien n’est un second ; c’est simplement un stock qui mérite un client plutôt qu’un entrepôt.
model_section:
  tagline: Notre modèle économique
  title: Comment fonctionne le modèle de surstock
  items:
    - title: Tout neuf, jamais utilisé
      description: Chaque panneau que nous vendons est tout neuf et inutilisé. Le surstock signifie surplus et excédentaire — pas des retours, pas des reconditionnés, pas des secondes.
    - title: Inventaire mixte
      description: Notre stock combine la production excédentaire de notre propre base de fabrication de Weihai avec le stock sélectionné dans des usines partenaires que nous tenons au même niveau de qualité. Les sources sont mixtes ; les standards ne le sont pas.
    - title: Tarifs inférieurs au détail
      description: Le surstock nous coûte moins cher à acquérir, donc il vous coûte moins cher d’acheter. Pas de prix catalogue gonflé, pas de fausses remises — juste des prix honnêtes sur le vrai stock.
    - title: Vente en gros favorable aux petites entreprises
      description: La vente en gros commence à 5 planches, pas en conteneurs. Les petits détaillants peuvent mélanger n’importe quels modèles en stock en une seule commande et choisir le fret express ou maritime.
    - title: Expédition directe à vous
      description: Les commandes sont expédiées directement depuis notre base logistique de Weihai à votre porte dans 50+ pays — express pour des échantillons et petites commandes, fret maritime consolidé pour la vente en gros.
quality_section:
  tagline: Qualité & Garantie
  title: La qualité derrière chaque planche
  subtitle: Le prix des surstocks ne signifie jamais des normes assouplies. Chaque conseil — quelle que soit sa source — passe par le même processus avant d’être expédié.
  items:
    - title: 100 % testé sous pression
      description: Chaque planche est gonflée et testée à la pression de 15 PSI avant expédition. Aucune planche n'est expédiée sans test, quelle que soit la provenance de son inventaire.
    - title: Test de surcharge jusqu'à 1,25x
      description: Les planches de nos séries de production sont testées par échantillon au-delà de la pression nominale — maintenues à 1,25x de la pression de service pendant 24 à 48 heures pour vérifier les coutures, les valves et la construction drop-stitch.
    - title: Taux de réussite à l’inspection finale de 99,3 %
      description: Notre processus d’inspection finale valide 99,3 % des planches comme étant sans défaut — et la petite fraction qui échoue n’entre jamais dans notre inventaire excédentaire.
    - title: Garantie de 2 ans SUP
      description: Chaque planche SUP bénéficie d’une garantie SUP de 2 ans couvrant les défauts de fabrication. La même garantie s’applique à chaque client dans chacun de nos 50+ marchés.
