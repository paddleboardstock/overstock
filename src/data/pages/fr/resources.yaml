faqs:
  title: Frequently Asked Questions
  subtitle: 'Common questions about our boards, ordering, and getting on the water.'
  columns: 2
  items:
    - title: What is included with my board?
      description: 'Every complete package includes the board, adjustable paddle, high-flow pump, leash, repair kit, and backpack. The Oars & Pump Set is also available separately.'
      icon: tabler:package
    - title: How long does inflation take?
      description: 'With the included high-flow pump, most paddlers reach full pressure in 8-12 minutes. Electric pumps work too — just stop at the rated pressure printed near the valve.'
      icon: tabler:clock
    - title: How do I choose the right board?
      description: 'Start with your weight and paddling style: beginners and families love wide, stable platforms like the SUP Explorer 11; yoga paddlers prefer full-deck traction; touring paddlers want rigid, streamlined shapes. Our team is happy to recommend.'
      icon: tabler:help-circle
    - title: What payment methods do you accept?
      description: 'We accept major credit cards, PayPal, and bank transfer. All prices include the complete package — no hidden extras.'
      icon: tabler:currency-dollar
    - title: How long does delivery take?
      description: 'Orders ship from our factory and typically arrive within 5-10 business days depending on your region. Tracking is provided for every order.'
      icon: tabler:truck-delivery
    - title: Is my board covered by warranty?
      description: 'Yes — every board is covered against manufacturing defects, and every unit is pressure-tested to 1.25x its rated pressure for 24-48 hours before leaving the factory. Our warranty claim rate is under 2%.'
      icon: tabler:shield-check
