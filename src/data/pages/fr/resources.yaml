hero_text:
  tagline: Ressources
  title: Centre de téléchargement et guides de pagaie
  subtitle: Catalogues de produits, guides d’achat et instructions d’entretien pour vous aider à choisir, utiliser et apprécier votre SUP planche gonflable.
features3_downloads:
  tagline: Téléchargements
  title: Documentation produit<br />& Ressources sur la pagaie
  isBeforeContent: false
  columns: 2
  items:
    - title: Catalogue de produits 2026 SUP
      description: 'La gamme complète Paddle Board Overstock SUP : planches polyvalentes, séries d’art et accessoires, avec les spécifications complètes et le contenu du paquet. Format PDF.'
      icon: tabler:file-text
    - title: SUP Guide d’achat gonflable
      description: 'Comment choisir votre première planche : longueur, largeur, épaisseur, volume, correspondance du poids du rider, et quelle forme de planche correspond à votre style de pagayage.'
      icon: tabler:file-description
    - title: SUP Guide taille et ajustement
      description: Adaptez le volume et les dimensions de la planche à votre poids et à votre niveau, avec des recommandations spécifiques à chaque activité pour les loisirs, les randonnées, le yoga et la forme physique.
      icon: tabler:clipboard-check
    - title: Guide d’entretien et d’entretien des pensions
      description: 'Gardez votre planche neuve : nettoyage, séchage, rangement, UV protection, entretien des vannes et petites réparations.'
      icon: tabler:tool
    - title: Guide des matériaux pour planches gonflables
      description: PVC Construction, drop-stitch cœurs, EVA pads de terrasse, et ce PSI que la rigidité 15 signifie en termes de performance et de durabilité.
      icon: tabler:files
    - title: Commencer avec SUP
      description: 'Bases pour un pagayeur débutant : gonflage, portage, lancement, coups de base et essentiels de sécurité pour vous mettre debout dès le premier jour.'
      icon: tabler:swimming
faqs:
  title: Questions Fréquemment Posées
  subtitle: Questions fréquentes sur nos planches, la commande et la façon de monter sur l’eau.
  columns: 2
  items:
    - title: Qu’est-ce qui est inclus avec ma planche ?
      description: Chaque pack complet comprend la planche, la pagaie réglable, la pompe à haut débit, la laisse, le kit de réparation et le sac à dos. Le set Rames & Pompe est également disponible séparément.
      icon: tabler:package
    - title: Combien de temps l’inflation prend-elle ?
      description: Avec la pompe à haut débit incluse, la plupart des pagayeurs atteignent la pleine pression en 8 à 12 minutes. Les pompes électriques fonctionnent aussi — il suffit de s’arrêter à la pression nominale affichée près de la vanne.
      icon: tabler:clock
    - title: Comment choisir la bonne planche ?
      description: 'Commencez par votre poids et votre style de pagaie : les débutants et les familles adorent les plateformes larges et stables comme SUP l’Explorer 11 ; les pagayeurs de yoga préfèrent la traction sur tout le pont ; les pagayeurs de randonnée veulent des formes rigides et profilées. Notre équipe est ravie de vous recommander.'
      icon: tabler:help-circle
    - title: Quels modes de paiement acceptez-vous ?
      description: Nous acceptons les principales cartes de crédit, PayPal et virements bancaires. Tous les prix incluent le forfait complet — sans suppléments cachés.
      icon: tabler:currency-dollar
    - title: Combien de temps prend la livraison ?
      description: Les commandes sont expédiées depuis notre usine et arrivent généralement dans un délai de 5 à 10 jours ouvrés selon votre région. Le suivi est fourni pour chaque commande.
      icon: tabler:truck-delivery
    - title: Mon planche est-elle couverte par la garantie ?
      description: Oui — chaque planche est couverte contre les défauts de fabrication, et chaque unité est testée à la pression de 1,25 fois sa pression nominale pendant 24 à 48 heures avant de quitter l'usine. Notre taux de réclamation de garantie est inférieur à 2 %.
      icon: tabler:shield-check
cta:
  title: Besoin d'aide pour trouver la bonne planche ?
  subtitle: Contactez notre équipe pour des conseils honnêtes sur le choix de la planche, le dimensionnement ou les questions de commande.
  actions:
    - variant: primary
      text: Contactez notre équipe
      href: /contact
