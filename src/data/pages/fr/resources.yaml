hero_text:
  tagline: Ressources
  title: 'Centre de téléchargement et guides d''achat'
  subtitle: 'Accédez aux catalogues produits, aux guides OEM, aux listes de contrôle des acheteurs et à la documentation technique pour prendre des décisions d''achat éclairées.'
features3_downloads:
  tagline: Téléchargements
  title: 'Documentation produit<br />et ressources acheteurs'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Catalogue de produits marins 2026'
      description: 'Gamme complète de produits, notamment des bateaux RIB, des bateaux gonflables, des planches de SUP, des kayaks et des accessoires. Spécifications, configurations et options. Format PDF.'
      icon: tabler:file-text
    - title: 'Guide de fabrication OEM'
      description: 'Tout ce qu''il faut savoir sur les partenariats OEM/ODM : aperçu du processus, quantités minimales de commande, options de personnalisation, contrôle qualité et expédition.'
      icon: tabler:building-factory
    - title: 'Guide d''achat des bateaux RIB'
      description: 'Comment choisir le bon RIB : matériaux de coque, matériaux des flotteurs, sélection du moteur, considérations de taille et options de configuration pour différentes applications.'
      icon: tabler:file-description
    - title: 'Liste de contrôle des fournisseurs de SUP'
      description: 'Points clés lors du choix d''un fabricant de planches de SUP : indicateurs de qualité, exigences de certification, considérations sur les MOQ et ce qu''il faut vérifier lors d''un audit d''usine.'
      icon: tabler:clipboard-check
    - title: 'Guide des matériaux pour bateaux gonflables'
      description: 'PVC ou Hypalon : comparaison de la durabilité, de la résistance aux UV, de la durée de vie, des options de réparation et des considérations de coût pour différentes applications marines.'
      icon: tabler:files
    - title: 'Modèle de brief pour fabrication personnalisée'
      description: 'Téléchargez notre modèle de brief produit. Renseignez vos exigences puis renvoyez-le-nous : vous recevrez un devis et une évaluation de faisabilité sous une semaine.'
      icon: tabler:template
faqs:
  title: Questions fréquentes
  subtitle: 'Questions courantes sur nos produits, notre processus de fabrication et notre modèle de partenariat.'
  columns: 2
  items:
    - title: Quelle est la quantité minimale de commande ?
      description: 'La MOQ varie selon la catégorie de produit. Les bateaux RIB partent généralement de 10 unités par modèle, et les planches de SUP de 50 unités. Contactez notre équipe commerciale pour connaître la MOQ propre à chaque produit.'
      icon: tabler:help-circle
    - title: Puis-je obtenir des échantillons avant de passer commande ?
      description: 'Oui. Paddle Board Overstock fabrique des échantillons pour évaluation avant la production en série. Le coût des échantillons est négociable et souvent déduit de la première commande de production.'
      icon: tabler:package
    - title: Quelles conditions de paiement proposez-vous ?
      description: 'Conditions standard : acompte de 30 % à la commande, solde de 70 % avant expédition. Conditions LC possibles pour les clients qualifiés. Contactez notre équipe financière pour en discuter.'
      icon: tabler:currency-dollar
    - title: Quel est le délai de production ?
      description: 'Délais habituels : bateaux RIB 30 à 45 jours, planches de SUP 20 à 30 jours, bateaux gonflables 25 à 35 jours. Le développement sur mesure ajoute 15 à 30 jours pour les prototypes.'
      icon: tabler:calendar-clock
    - title: Quelles certifications vos produits possèdent-ils ?
      description: 'Certification CE pour les marchés de l''UE, fabrication homologuée par les garde-côtes américains (USCG), système qualité ISO, conformité BSCI et conformité des matériaux REACH.'
      icon: tabler:certificate
    - title: Proposez-vous un emballage et un marquage personnalisés ?
      description: 'Oui. Nous fournissons un emballage personnalisé avec votre logo, vos couleurs et votre identité de marque. La MOQ pour l''emballage personnalisé dépend de la catégorie de produit.'
      icon: tabler:color-swatch
cta:
  title: 'Besoin d''aide pour trouver la bonne ressource ?'
  subtitle: 'Contactez notre équipe pour des conseils personnalisés sur la sélection de produits, les partenariats OEM ou les spécifications techniques.'
  actions:
    - variant: primary
      text: Contactez notre équipe
      href: /contact