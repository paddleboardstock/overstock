stories:
  tagline: Histoires d'explorateurs
  title: De vraies aventures de vraies personnes
  subtitle: Écoutez les pagayeurs, les familles et les professionnels qui utilisent le matériel Paddle Board Overstock sur l'eau.
  items:
    - name: Sarah & Mike
      title: SUP Propriétaires d'Explorer 11, Canada
      content: Nous avons emmené nos Explorer 11 pour un voyage d'une semaine dans le parc Algonquin. Ils ont très bien géré les portages et les traversées de lacs. La construction drop-stitch signifiait que nous pouvions gonfler à 15 PSI et obtenir des performances de planche rigide d'une planche transportable.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Parc Algonquin, Canada
    - name: Carlos R.
      title: Cavalier de Cheetah Surge, Espagne
      content: Le Cheetah Surge est mon choix pour la navigation côtière. Son design vif attire les regards sur la plage, et sa stabilité me donne confiance dans les petits rouleaux. Il se manie à merveille que je fasse du tourisme ou que je profite simplement du coucher du soleil.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Espagne
    - name: Lina et sa famille
      title: Pagaies Lotus fluides, Suède
      content: Aventures familiales du week-end sur l'archipel. Le Lotus Flottant est suffisamment stable pour que ma fille puisse se tenir debout pendant que je pagaye. Se gonfle en moins de 10 minutes — pas besoin de remorque, juste du pur plaisir en famille sur l'eau.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Archipel de Stockholm, Suède
    - name: Andres D.
      title: Explorateur Ocean Voyager, Philippines
      content: J'utilise mon Ocean Voyager pour des excursions côtières longue distance autour de Palawan. Après des mois d'utilisation quotidienne dans des conditions tropicales, la planche fonctionne encore comme neuve. La forme de la planche de randonnée traverse les clapotis qui arrêteront des planches moins performantes.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Philippines
    - name: Emma T.
      title: Tropical Breeze, débutant, Australie
      content: Je n'avais jamais été sur un SUP auparavant. Le Tropical Breeze est si stable que je me suis senti en confiance dès ma première tentative. Maintenant je pagaye tous les week-ends. La courbe d'apprentissage est pratiquement nulle — et la planche est magnifique sur l'eau.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australie
