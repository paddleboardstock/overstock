process_section:
  tagline: Comment fonctionne la livraison
  title: De notre entrepôt à votre porte
  steps:
    - title: Devis avec options de fret
      description: Chaque devis détaille les options de fret pour votre destination — express et maritime — avec les délais de transit estimés, afin que rien ne soit décidé à votre place.
    - title: Contrôle qualité et emballage
      description: Les planches sont testées à 100 % sous pression, puis emballées avec pompe, pagaie, leash, aileron, sac à dos et kit de réparation — le même package complet que nous vendons au détail.
    - title: Expédition depuis Weihai
      description: Votre envoi quitte notre base logistique avec la méthode de fret que vous avez choisie et le suivi porte-à-porte vous est communiqué le jour même.
    - title: Dédouanement
      description: Nous fournissons la facture commerciale et la liste de colisage nécessaires pour l'importation. Les droits et taxes d'importation dans votre pays sont à la charge de l'importateur — voir la section douane ci-dessous.
    - title: Livraison et inspection
      description: Inspectez votre livraison à l'arrivée. Si quelque chose est endommagé ou manquant, contactez-nous avec des photos et votre numéro de commande — voir notre politique sur les pertes et dommages ci-dessous.
customs_section:
  tagline: Douanes et taxes
  title: Droits de douane et taxes à l'importation
  subtitle: Nous restons explicites sur les responsabilités liées au fret plutôt que de faire des promesses vagues. Voici exactement qui est responsable de quoi.
  items:
    - title: Ce que nous couvrons
      description: Votre devis inclut le coût du fret jusqu'à votre destination, et nous préparons et fournissons tous les documents d'exportation — facture commerciale, liste de colisage et suivi de l'envoi.
    - title: Ce que couvre l'importateur
      description: Les droits d'importation, TVA/TVH, et toutes taxes du pays de destination sont à la charge de l'importateur (vous ou votre entreprise) selon les règles de votre pays. Nous n'incluons pas de promesses fiscales vagues dans nos devis de fret.
    - title: Assistance pour le dédouanement
      description: Nos documents sont complets et cohérents — codes HS corrects, valeurs déclarées et spécifications de tableau — ce qui permet à la dédouanée de se débarrasser en douceur. Si votre courtier ou bureau des douanes a besoin de documents supplémentaires, nous les fournissons.
    - title: Vérifiez vos tarifs locaux avant de commander
      description: Les tarifs sur les équipements pneumatiques de sports nautiques varient selon les pays. Consultez les règles d’importation de votre pays ou posez votre question dans votre demande — nos guides régionaux des marchés incluent des notes de douane pour les principaux marchés.
lost_damaged:
  title: Expéditions perdues ou endommagées
  description: Inspectez votre livraison à son arrivée. Dans le cas rare où une planche arrive endommagée ou qu’un colis manque, contactez-nous dès que possible avec votre numéro de commande et des photos claires de l’emballage et de la carte. Nous évaluons chaque cas individuellement — selon le cas, cela signifie une pièce de remplacement, une carte de remplacement ou un remboursement pour l’article concerné. Les défauts de fabrication sont couverts séparément par notre garantie de 2 ans SUP .
destinations_section:
  tagline: Où nous expédions
  title: 50+ pays et ça continue
  description: Nous expedions dans le monde entier, avec des guides détaillés pour nos principaux marchés régionaux. Chaque guide de marché couvre les types de clients locaux, les notes d’expédition et les conseils douaniers pour cette région.
  regions_label: Guides régionaux
  countries_label: Guides de pays
faq_section:
  title: FAQ sur la livraison
  items:
    - q: Combien de temps prend l’expédition express ?
      a: Le temps de transit express dépend de la destination — nous estimons le temps de transit estimé pour votre pays à chaque demande, avant que vous ne vous engagez.
    - q: Combien de temps prend le transport maritime ?
      a: Le transit maritime varie selon le port de destination et les horaires de navigation. Nous estimons une fenêtre estimée pour votre destination avec votre commande, et vous recevez un suivi dès le départ de l’expédition.
    - q: Quelle méthode d'expédition devrais-je choisir ?
      a: Express pour 1 à 3 planches, échantillons ou réapprovisionnements urgents. Fret maritime pour 5 à 20 commandes de gros sur table, où le coût par planche compte plus que la rapidité. Nous estimons les deux pour que vous puissiez comparer.
    - q: Les droits d’importation et les taxes sont-ils inclus dans les frais d’expédition ?
      a: Non. Le fret est devisé séparément et les droits d’importation, la TVA/GST et les taxes de destination sont la responsabilité de l’importateur selon les règles de votre pays. Nous fournissons une documentation complète et précise pour assurer la fluidité du dédouanement.
    - q: Expédiez-vous dans mon pays ?
      a: Nous expédions dans 50+ pays. Consultez nos guides régionaux et par pays ci-dessous, ou posez simplement votre question — nous confirmerons le service actuel à votre adresse.
    - q: Puis-je suivre ma commande ?
      a: Oui. Chaque expédition — express ou maritime — inclut un suivi porte-à-porte que nous partageons avec vous le jour de l’expédition.
