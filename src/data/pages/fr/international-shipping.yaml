hero:
  tagline: Expédition Internationale
  title: Expédition Internationale —<br />Fret Express et Maritime vers 50+ pays
  subtitle: Chaque commande est expédiée depuis notre base logistique de Weihai, en Chine. Choisissez le fret aérien express pour les échantillons et les réapprovisionnements urgents, ou le fret maritime consolidé pour les commandes en gros des petites entreprises.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP planches emballées pour l'expédition internationale
direct_answer: Paddle Board Overstock expédie vers plus de 50 pays depuis Weihai, en Chine. Le fret aérien express transporte 1 à 3 planches, les commandes d'échantillons et les réapprovisionnements urgents ; le fret maritime consolidé est l'option économique pour les commandes en gros de 5 à 20 planches. Chaque envoi inclut un suivi porte-à-porte et chaque planche est testée sous pression à 100 % et emballée avec son kit complet d'accessoires avant l'expédition.
tldr_points:
  - 'Fret aérien express : 1 à 3 planches, échantillons, réapprovisionnements urgents — option la plus rapide'
  - 'Fret maritime : commandes en gros de 5 à 20 planches — coût de transport par planche le plus bas'
  - Suivi porte-à-porte sur chaque envoi vers 50+ pays
  - Le fret, l'assurance, le dédouanement et les droits d'importation sont détaillés dans votre devis — aucune promesse vague tout compris
from_china:
  tagline: Expédition depuis la Chine
  title: D'où les commandes sont expédiées
  description: Toutes les commandes sont expédiées depuis notre base logistique à Weihai, en Chine — le cœur de notre production et de notre activité d'entreposage. Weihai est une grande ville portuaire côtière dans la province du Shandong avec des liaisons directes par fret maritime et aérien, ce qui maintient des délais de transit et des coûts de fret compétitifs vers les destinations en Asie, Amériques, Afrique, Europe et Moyen-Orient.
modes_section:
  tagline: Deux Options
  title: Expédition Express ou Fret Maritime
  subtitle: La méthode de fret appropriée dépend de la rapidité avec laquelle vous avez besoin des planches et du nombre de planches commandées. Les deux options sont chiffrées à chaque demande de devis.
  express:
    name: Option A — Expédition Express
    best_for: Idéal pour 1 à 3 planches, échantillons et réapprovisionnements urgents
    description: Le fret aérien express livre les petites commandes et les planches échantillons à votre porte en quelques jours, et non en semaines. Idéal lorsque vous testez un modèle avant une commande plus importante, ou pour le réapprovisionnement d'un best-seller en cours de saison.
    features:
      - 1 à 3 planches, modèles uniques ou échantillons de modèles mixtes
      - Transit le plus rapide des deux options — devis par destination
      - Suivi porte-à-porte avec un transporteur express majeur
      - 'Usage typique : échantillons, réapprovisionnements urgents, petites premières commandes'
  sea:
    name: Option B — Fret Maritime
    best_for: Idéal pour les commandes en gros et pour les détaillants de 5 à 20 planches
    description: Le fret maritime consolidé est le choix économique pour les commandes en gros des petites entreprises. Les planches sont emballées ensemble dans un envoi consolidé depuis Weihai, ce qui maintient le coût de fret par planche bas.
    features:
      - Commandes de 5 à 20 planches pour détaillants et ventes en gros
      - Coût de fret par planche le plus bas des deux options
      - Emballage consolidé — un envoi, un dédouanement
      - 'Usage typique : réapprovisionnements saisonniers, commandes en gros de modèles mixtes'
