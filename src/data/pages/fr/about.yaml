hero:
  tagline: À propos de nous
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Usine et atelier de surstock de Paddle Board
  title: À propos du <span class="text-accent dark:text-white">Surstock de paddle board</span>
  subtitle: De toutes nouvelles planches de SUP gonflables à des prix de surstock et de liquidation — soutenues par notre propre fabrication Weihai depuis 2012, vente en gros de modèles mixtes pour les petits détaillants et expédition flexible dans le monde entier.
stats:
  title: En chiffres
  columns: 4
  stats:
    - title: Capacité de production annuelle
      amount: 15 000 unités
    - title: Pays expédiés
      amount: 50+
    - title: Cartes testées sous pression
      amount: 100%
    - title: Ingénieurs R&D
      amount: 14+
features3_what_we_build:
  title: Ce que nous construisons
  subtitle: "Une gamme de produits ciblée que nous connaissons parfaitement : pas d'expériences à moitié terminées, pas d'ingénierie de badges."
  columns: 3
  isBeforeContent: true
  items:
    - title: Planches SUP gonflables
      description: SUP polyvalents et de randonnée de 10' à 12 pieds. Stables, rigides et complets avec pompe, pagaie et laisse.
      icon: tabler:swimming
    - title: Jeux de séries artistiques
      description: 'Illustrations de pont EVA emblématiques : Cheetah Surge, Tropical Breeze, Medusa Glow et plus encore.'
      icon: tabler:hexagons
    - title: Forfaits complets
      description: 'Chaque planche est livrée dans un kit complet : planche, sac à dos, pompe, pagaie, aileron, leash et kit de réparation.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessoires
      description: Pompes, pagaies, laisses, kits de réparation et sacs étanches. Le tout assorti à nos planches.
      icon: tabler:tool
    - title: Entretien et réparation
      description: Assistance de réparation en interne, pièces de rechange et conseils d'entretien pour garder votre planche sur l'eau pendant des années.
      icon: tabler:settings
    - title: Clubs et flottes de location
      description: Équipement en vrac pour les clubs, les écoles et les flottes de location avec soutien direct de l'usine.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Discussion sur la conception et l’ingénierie du conseil d’administration
steps2_values:
  title: Nos valeurs
  subtitle: Trois principes qui ont façonné chaque produit depuis le premier jour.
  items:
    - title: Construisez comme s'il transportait votre famille
      description: Chaque planche, couture et valve est traitée comme si nos propres familles l'utilisaient.
      icon: tabler:heart
    - title: Ingénieur avant de vendre
      description: Si une spécification est erronée, nous la modifions – jamais le client.
      icon: tabler:settings
    - title: Un support qui dure plus longtemps que la garantie
      description: Les planches que nous avons construites il y a des années nous appellent toujours pour des pièces de rechange, et nous continuons à les récupérer.
      icon: tabler:headset
steps2_milestones:
  title: Jalons
  subtitle: Une version courte de l’histoire de Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fondée à Weihai
      description: Un atelier côtier dédié aux planches de SUP gonflables drop-stitch.
      icon: tabler:building-factory
    - title: Campus de production de 12 000 m²
      description: Extension à une installation dédiée avec une capacité de production de soudage RF et de point de chute.
      icon: tabler:circle-check
    - title: Programme d'exportation internationale
      description: Expédition désormais vers plus de 50 pays avec des options de fret express et maritime.
      icon: tabler:world
    - title: Surstock et concentration sur la vente en gros
      description: En septembre 2026, les opérations de la marque ont été transférées du groupe Qingdao Vatrad à Weihai Dongjilian Co., Ltd. ; le centre de fabrication de Weihai poursuit la R&D, la production et l'expédition directe vers l'usine.
      icon: tabler:building-skyscraper
features2_locations:
  title: Nos implantations
  tagline: Trouvez-nous
  columns: 3
  items:
    - title: Siège social et atelier
      description: Parc industriel côtier, bâtiment 4 — ouvert du lundi au vendredi pour des visites sur rendez-vous.
    - title: Centre de services de l'UE
      description: Port méditerranéen — support de réaménagement, de réparation et de garantie pour les clients européens.
    - title: Réseau de partenaires APAC
      description: Partenaires de service agréés en Australie, au Japon, à Singapour et à Hong Kong.
brand_hub_tagline: Marque
brand_hub_title: Explorez notre marque
brand_hub_subtitle: Plongez plus profondément dans notre expertise en ingénierie maritime, notre présence mondiale et les principes qui nous animent.
brand_hub_cards:
  - title: Expertise maritime
    desc: Des décennies de science des matériaux, de fabrication de précision et de tests en conditions réelles, des noyaux à points de chute aux coutures soudées et aux ponts de la série artistique.
    link: /brand-marine-expertise
    link_label: En savoir plus →
  - title: Pourquoi le surstock de paddle board
    desc: Prix ​​​​direct d'usine, planches 100 % testées sous pression et garantie de 2 ans – conçues pour les pagayeurs, les familles et les amateurs de sports nautiques.
    link: /brand-why-paddleboardoverstock
    link_label: En savoir plus →
