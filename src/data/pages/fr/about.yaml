hero:
  tagline: à propos
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Atelier Paddle Board Overstock
  title: |
    Ingénierie marine, <br />
    façon <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: "Nous avons commencé dans un atelier côtier avec un seul bateau et une conviction inébranlable : les produits marins doivent être conçus comme s'ils comptaient, parce qu'ils comptent. Aujourd'hui, nous expédions dans plus de 50 pays, mais chaque coque passe encore entre les mêmes mains qui ont fondé l'entreprise."

stats:
  title: En chiffres
  columns: 4
  stats:
    - title: Coques livrées
      amount: '2,400+'
    - title: Pays desservis
      amount: '50+'
    - title: Années d'expérience cumulée
      amount: '60'
    - title: Délai moyen de réponse sous garantie (heures)
      amount: '24'

features3_what_we_build:
  title: Ce que nous construisons
  subtitle: Une gamme de produits ciblée que nous maîtrisons de A à Z — pas d'expériences inachevées, pas d'ingénierie d'étiquette.
  columns: 3
  isBeforeContent: true
  items:
    - title: Bateaux RIB
      description: RIB à coque aluminium de 3,3 m à 7,5 m. Conçus pour la patrouille, la plongée, la pêche et un usage familial.
      icon: tabler:ship
    - title: Bateaux pneumatiques
      description: Annexe pneumatiques PVC et Hypalon de 2,4 m à 4,2 m. Légers, robustes et faciles à ranger.
      icon: tabler:speedboat
    - title: Annexes pour superyachts
      description: RIB compacts et haut de gamme construits sur mesure pour correspondre au style de votre navire mère.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessoires
      description: Avirons, pompes, housses, sacs étanches, réservoirs de carburant et électronique. Tous adaptés à nos bateaux.
      icon: tabler:package
    - title: Réfection et réparation
      description: Remplacement de boudin en interne, rénovation électronique et mise à niveau moteur.
      icon: tabler:tool
    - title: Constructions sur mesure
      description: Conception projet par projet pour clients commerciaux, scientifiques et militaires.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Construction de bateau sur mesure

steps2_values:
  title: Nos valeurs
  subtitle: Trois principes qui façonnent chaque produit depuis le premier jour.
  items:
    - title: Construire comme pour votre famille
      description: Chaque coque, soudure et fixation est traitée comme si nos propres familles allaient l'utiliser.
      icon: tabler:heart
    - title: Concevoir avant de vendre
      description: Si une spécification est erronée, nous modifions la spécification — jamais le client.
      icon: tabler:settings
    - title: Un service qui dépasse la garantie
      description: Les coques de vingt ans nous appellent encore pour des pièces détachées, et nous répondons toujours.
      icon: tabler:headset

steps2_milestones:
  title: Jalons
  subtitle: Une version courte de l'histoire de Paddle Board Overstock.
  isReversed: true
  items:
    - title: Fondé dans un atelier côtier
      description: Lancé par deux architectes navals avec une fraiseuse CNC et une idée tenace.
      icon: tabler:building-factory
    - title: Premières 1 000 coques livrées
      description: Atteint en sept ans, principalement par le bouche-à-oreille et la fidélisation des clients.
      icon: tabler:circle-check
    - title: Programme d'exportation international
      description: Expédition vers plus de 50 pays avec des partenaires de support localisés sur cinq continents.
      icon: tabler:world
    - title: Une nouvelle structure opérationnelle mondiale
      description: 'En septembre 2026, l’exploitation de la marque est passée de Qingdao Vatrad Group à Weihai Dongjilian Co., Ltd. (Nouveau-Mexique, États-Unis) ; le site de production de Qingdao continue d’assurer la R&D, la production et l’export direct usine.'
      icon: tabler:building-skyscraper

features2_locations:
  title: Nos sites
  tagline: Nous trouver
  columns: 3
  items:
    - title: Siège social et atelier
      description: Parc industriel côtier, bâtiment 4 — ouvert du lundi au vendredi pour les visites sur rendez-vous.
    - title: Centre de service UE
      description: Port méditerranéen — réfection, réparation et support sous garantie pour les clients européens.
    - title: Réseau de partenaires APAC
      description: Partenaires de service agréés en Australie, au Japon, à Singapour et à Hong Kong.
brand_hub_tagline: Marque
brand_hub_title: Découvrez notre marque
brand_hub_subtitle: Plongez au cœur de notre expertise en ingénierie marine, notre présence mondiale et les principes qui nous animent.
brand_hub_cards:
  - title: Expertise Marine
    desc: 'Des décennies de science des matériaux, de fabrication de précision et de tests réels — de la fabrication PVC/Hypalon à la conception de coques en V profond et à la technologie drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'En savoir plus →'
  - title: Présence Mondiale
    desc: 'Expédition vers plus de 50 pays depuis notre installation de Qingdao avec des partenaires de service agréés en Europe, Asie-Pacifique et Amériques.'
    link: /brand-global-presence
    link_label: 'En savoir plus →'
  - title: Pourquoi Paddle Board Overstock
    desc: 'Intégration verticale, double certification (ISO 9001 + BSCI), conformité CE et MOQ faibles — conçu pour les marques, distributeurs et agences gouvernementales.'
    link: /brand-why-paddleboardoverstock
    link_label: 'En savoir plus →'

production_section:
  tagline: 'Excellence de production'
  title: 'Un savoir-faire d’exception'
  description: 'La ligne de production Paddle Board Overstock est dédiée à la fabrication de produits gonflables de haute qualité, durables et performants.'
  cards:
    - title: 'Équipe de techniciens expérimentés'
      items:
        - 'Expertise professionnelle des matériaux PVC, Hypalon et marins'
        - 'Savoir-faire précis en découpe, assemblage et installation d’accessoires'
        - 'Formation continue aux dernières technologies de production'
    - title: 'Équipements de production avancés'
      items:
        - 'Découpe CNC pour une coupe de tissu précise avec une erreur minimale'
        - 'Assemblage thermique/à froid de haute précision pour des coutures étanches et durables'
        - 'Équipements professionnels de test d’étanchéité et de résistance à la traction'
    - title: 'Système de gestion éprouvé'
      items:
        - 'Processus de production standardisés avec des normes de qualité claires'
        - 'Philosophie de production lean réduisant les déchets et améliorant l’efficacité'
        - 'Gestion efficace de la chaîne d’approvisionnement avec des partenariats fournisseurs fiables'
    - title: 'Contrôle qualité strict'
      items:
        - 'Système de management de la qualité certifié'
        - 'Inspection multi-étapes : matières premières, en cours de production, contrôle final'
        - 'Tests rigoureux d’étanchéité et de durabilité avant expédition'

global_ops_section:
  tagline: 'Architecture opérationnelle mondiale'
  title_html: 'Une marque, <span class="text-white/90">deux pôles</span>'
  description_html: 'Depuis septembre 2026, Paddle Board Overstock est exploité par <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (Nouveau-Mexique, États-Unis) — l’entité mondiale pour la distribution, les ventes B2B commerciales, les contrats, la facturation et le service après-vente. La R&D, la production et le contrôle qualité restent au <strong class="text-white">pôle de fabrication Paddle Board Overstock Qingdao</strong>, qui expédie chaque commande directement depuis l’usine, FOB Qingdao. Cette transition a changé qui signe votre contrat — pas qui construit votre bateau.'
  stats:
    - value: '2,400+'
      label: 'Coques livrées dans le monde entier'
    - value: '50+'
      label: 'Pays d’exportation'
    - value: '10+'
      label: 'Années de fabrication'
