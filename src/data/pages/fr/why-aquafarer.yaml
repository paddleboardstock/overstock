hero:
  tagline: Pourquoi Aquafarer
  title: 'Conçu différemment. Conçu pour le business.<br />Le partenaire des aventures nautiques dans le monde'
  subtitle: "Pas seulement un fabricant — un partenaire commercial qui conçoit, développe et livre des équipements de qualité professionnelle pour les clubs, resorts, opérateurs de location et marques nautiques émergentes."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Qualité de fabrication et expertise Aquafarer

pillars:
  tagline: Les trois piliers du partenariat
  title: Pourquoi les entreprises nautiques du monde entier choisissent Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Conçu pour un usage commercial
      description: 'Nos équipements sont conçus pour la location quotidienne, pas pour les loisirs du week-end. PVC de qualité professionnelle, âmes drop-stitch renforcées, options Hypalon résistantes aux UV et quincaillerie éprouvée sur le terrain signifient moins de maintenance, une durée de vie plus longue et un meilleur retour sur investissement pour votre activité.'
      icon: tabler:building-factory
      callToAction:
        text: Voir la gamme de produits commerciaux
        href: /products
    - title: "De l'idée au marché"
      description: "Lancez votre marque de sports nautiques en 90 jours. Nous vous guidons à chaque étape : validation du concept, sélection des produits, prototype, production, design de l'emballage et expédition mondiale. Sans pression de quantité minimale — démarrez petit, développez-vous en toute confiance."
      icon: tabler:rocket
      callToAction:
        text: Lancez votre marque
        href: /oem-odm-blueprint
    - title: Conçu pour des conditions mondiales
      description: "Des produits optimisés pour chaque climat : formulations PVC eau froide pour l'Europe, matériaux résistants aux UV pour le Moyen-Orient et l'Australie, traitements anti-humidité pour l'Asie du Sud-Est. Chaque expédition est calibrée selon l'environnement de destination."
      icon: tabler:world

stats:
  title: La confiance en chiffres
  stats:
    - title: Années d'activité
      amount: Depuis 2012
    - title: Bateaux construits
      amount: 15,000+
    - title: Clients fidèles
      amount: '85%'
    - title: Réclamations de garantie
      amount: '<2%'

reasons:
  tagline: La différence Aquafarer
  title: Ce qui nous distingue
  isBeforeContent: false
  columns: 3
  items:
    - title: Vraie fabrication, pas du négoce
      description: "Nous possédons et exploitons une usine de 12 000 m². Quand vous travaillez avec Aquafarer, vous travaillez directement avec les personnes qui conçoivent, développent et fabriquent vos produits — sans intermédiaires."
      icon: tabler:building-factory
    - title: "Une approche menée par l'ingénierie"
      description: "Notre processus de conception part de l'usage réel, pas de la catégorie de produit. Nous optimisons la forme de la coque, le choix des matériaux et la configuration en fonction de la manière dont l'équipement sera réellement utilisé dans des environnements commerciaux."
      icon: tabler:engine
    - title: Qualité certifiée
      description: 'Certifié CE, système de qualité ISO, conforme BSCI, conforme REACH, approuvé USCG. Chaque produit respecte les normes internationales — pas seulement en théorie.'
      icon: tabler:certificate
    - title: OEM/ODM flexible
      description: 'Couleurs des flotteurs, configuration de la console, branding, emballage — nous personnalisons selon vos spécifications. Sans pression de quantité minimale. Commencez par un prototype, développez-vous en toute confiance.'
      icon: tabler:adjustments
    - title: Logistique mondiale
      description: "Entrepôt aux États-Unis en Californie, expédition directe depuis Qingdao, fret aérien pour les commandes urgentes. Nous gérons les formalités douanières et la documentation partout dans le monde."
      icon: tabler:truck-delivery
    - title: Accompagnement à vie
      description: "Nous accompagnons les bateaux que nous avons construits il y a 20 ans. Pièces détachées d'origine, conseils techniques, guide de réparation — notre équipe est disponible quand vous avez besoin de nous, où que vous soyez."
      icon: tabler:lifebuoy

testimonials:
  tagline: La confiance des marques du monde entier
  title: Ce que disent nos partenaires
  items:
    - content: "Nous avons travaillé avec plusieurs fabricants en Chine, mais Aquafarer se distingue par son support d'ingénierie et sa qualité constante. Ils traitent notre marque comme la leur."
      name: '— Partenaire OEM, marque européenne de sports nautiques'
    - content: "Leurs RIB en Hypalon sont en service dans notre flotte depuis plus de 5 ans. Maintenance minimale, excellente tenue aux UV. La garantie de 5 ans sur les flotteurs nous donne confiance."
      name: '— Opérateur de flotte, groupe de resorts du Moyen-Orient'
    - content: "L'équipe Aquafarer nous a aidés à développer un design de planche SUP personnalisé, du concept à la production, en 90 jours. La qualité a dépassé nos attentes."
      name: '— Distributeur, Watersports australien'
    - content: "En tant que propriétaire d'une petite entreprise, je m'inquiétais des quantités minimales. Aquafarer a travaillé avec mon budget et m'a aidé à lancer ma marque avec seulement 50 planches. Aujourd'hui, je commande 500."
      name: '— Fondateur de marque, société de location de SUP aux États-Unis'

cta:
  title: 'Prêt à développer votre activité nautique ?'
  subtitle: 'Contactez notre équipe pour une consultation gratuite. Sans engagement — seulement des conseils honnêtes sur les équipements et la fabrication.'
  actions:
    - variant: primary
      text: Parler à notre équipe
      href: /contact
    - text: Télécharger le catalogue produits
      href: /resources