hero:
  tagline: Vente en gros de modèles mixtes
  title: Paddle boards en gros de modèles mixtes —<br />Mélangez différents SUP modèles dans un seul ordre
  subtitle: Pourquoi limiter votre budget à un seul modèle ? Combinez toutes SUP les planches en stock — éditions all-around, touring, surf et art — en une seule commande en gros, pour un total aussi bas que 5 planches.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Un ordre varié de SUP différents modèles de planches gonflables de Paddle Board Overstock
direct_answer: Le modèle mixte en gros permet à un petit SUP détaillant de commander plusieurs modèles différents en un seul envoi consolidé au lieu d’une seule table. Paddle Board Overstock À , tout modèle en stock peut être combiné, le minimum de commande est de 5 cartes au total, et la quantité totale détermine le fourchet tarifaire. Les commandes mixtes sont expédiées de Weihai, Chine, par fret express aérien (1 à 3 planches) ou par fret maritime consolidé (5 à 20 planches) vers 50+ pays, et chaque planche est testée à 100 % par pression et couverte par la garantie de 2 ans SUP .
tldr_points:
  - Mélangez tous les modèles en stock SUP dans un seul ordre — pas de minimum par modèle
  - La quantité totale de commande (et non par modèle) fixe votre fourchette de prix
  - Commencez par 5 cartes au total — construites pour les petits détaillants, pas pour des conteneurs
  - 'Un seul envoi consolidé : un coût de fret, un dédouanement, une livraison'
why_mixed:
  tagline: Pourquoi métissé ?
  title: Mélange et assort. Achète plus de variété. Dépense moins.
  subtitle: Une étagère de planches identiques sert un type de pagayeur. Une commande mixte transforme le même budget en une gamme complète de produits.
  items:
    - title: Plus de variété sur votre étagère
      description: Combinez des planches polyvalentes pour débutants, des planches de randonnée pour les aventuriers et des planches de style surf pour les riders — une commande couvre toute votre gamme de clients.
    - title: Risque par modèle moindre
      description: Au lieu de miser votre saison sur un seul modèle, commandez 2 à 4 exemplaires de chaque. Si un modèle se vend plus que les autres, réapprovisionnez-le à la prochaine commande avec de vraies données de ventes.
    - title: Testez ce qui se vend sur votre marché
      description: Chaque plage, lac et ville a une demande différente. Une première commande mixte est la recherche de marché la moins chère qui existe — stockez six modèles, voyez lesquels se vendent.
    - title: Marges améliorées sur les éditions Art
      description: Les planches premium de la série art (Leviathan Wake, Medusa Glow, Ocean Voyager) offrent des prix de vente plus élevés. Mélangez-en quelques-unes dans une base de planches polyvalentes pour augmenter votre marge moyenne.
    - title: Un seul envoi consolidé
      description: Une commande mixte signifie une réservation de fret, une dédouanation et une livraison — au lieu de cinq expéditions distinctes provenant de cinq fournisseurs distincts.
how_it_works:
  tagline: Comment ça marche
  title: Comment fonctionne un ordre mixte de modèles
  steps:
    - title: Choisissez votre mix
      description: Choisissez les modèles et quantités pour votre marché — ou utilisez le sélecteur ci-dessous pour dessiner une combinaison et voir en temps réel le nombre de cartes et la mise à jour de la valeur totale.
    - title: Demander un devis
      description: Envoyez-nous le mélange. Nous confirmons le stock actuel pour chaque modèle et estimons les prix unitaires, ainsi que les options de fret express et maritime vers votre pays.
    - title: Confirmez l’ordre
      description: Approuvez le devis final — modèles, quantités, fret, total. Nous verrouillons le stock et planifions l'expédition depuis Weihai.
    - title: Nous Testons Chaque Planche
      description: Chaque planche de votre commande mixte est testée à 100 % sous pression jusqu'à 15 PSI avant l'emballage — même norme pour chaque modèle, qu'il s'agisse d'un tout-terrain d'entrée de gamme ou d'une édition artistique.
    - title: Une Livraison à Votre Porte
      description: La commande mixte complète est expédiée ensemble — livraison express par avion pour les petites commandes, fret maritime consolidé pour 5 à 20 planches — avec suivi porte à porte.
