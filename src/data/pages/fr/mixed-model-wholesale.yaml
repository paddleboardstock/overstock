who_benefits:
  tagline: Qui Peut Bénéficier
  title: Pour Qui Est Destiné le Wholesale à Modèles Mixtes
  items:
    - title: Importateurs Débutants
      description: Tester la catégorie SUP avec un éventail de modèles au lieu de s'engager sur un seul SKU en vrac.
    - title: Détaillants de Plage Saisonniers
      description: Boutiques qui ont besoin de planches pour débutants pour les touristes et d'éditions premium pour les locaux — dans la même commande de réapprovisionnement.
    - title: Vendeurs en ligne
      description: Lister plusieurs modèles à la fois pour savoir quels designs, longueurs et usages se vendent le mieux.
    - title: Flottes de location et écoles
      description: Flottes ayant besoin de tailles de planches variées pour différents poids de riders et types de leçons, et non d'une flotte à spécification unique.
faq_section:
  title: FAQ Modèles Mixtes
  items:
    - q: Y a-t-il une quantité minimale par modèle ?
      a: Non. Le minimum de 5 planches s'applique à la commande totale, pas à chaque modèle. Vous pourriez commander 5 modèles différents, une planche chacun.
    - q: Le mélange de modèles change-t-il le prix ?
      a: Le prix de gros par unité est indiqué par modèle, mais votre niveau de tarification s'améliore avec le nombre total de planches — mélanger les modèles ne vous pénalise pas.
    - q: Puis-je mélanger planches et accessoires ?
      a: Oui — pagaies de rechange, pompes et kits de réparation peuvent être ajoutés à une commande mixte. Demandez-le dans votre formulaire de demande.
    - q: Comment savoir quels modèles conviennent à mon marché ?
      a: Envoyez-nous une note sur vos clients (côtiers ou intérieurs, touristes ou locaux, débutants ou riders) dans le formulaire de demande et nous vous recommanderons un mélange.
