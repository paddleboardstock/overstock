  title: 'Solutions Aquatiques<br />Pour Chaque Public'
  subtitle: 'Des clubs et resorts aux créateurs de marques, centres de plongée, services de secours et flottes de pêche — Aquafarer livre des équipements conçus sur mesure pour chaque activité nautique.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Bateaux RIB Aquafarer pour applications marines professionnelles dans le monde entier
