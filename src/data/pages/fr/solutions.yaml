features3_solutions:
  tagline: Solutions
  title: 'Votre Partenaire Pour<br />Les Aventures Nautiques'
  isBeforeContent: false
  columns: 3
  items:
    - title: Clubs de sports nautiques
      description: 'Paquets complets d''équipement, marquage personnalisé et programmes de maintenance pour clubs de SUP, clubs de kayak, écoles de surf et centres de formation.'
      icon: tabler:users
      link: /solutions/clubs
    - title: RIBs de sports nautiques
      description: 'RIBs conçus sur mesure pour écoles de voile, centres de sports nautiques et organisateurs d''événements. Bateaux d''entraîneurs, de remorquage et de sécurité pour les sports nautiques professionnels.'
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorts et hôtels
      description: 'Programmes de sports nautiques premium avec équipement de flotte, systèmes de sécurité, formation du personnel et gestion des revenus pour les établissements hôteliers.'
      icon: tabler:beach
      link: /solutions/resorts
    - title: Entrepreneurs de marques nautiques
      description: 'Fabrication OEM/ODM en marque privée avec quantités minimales de commande réduites, design de produit personnalisé, emballage et expédition mondiale pour les nouveaux propriétaires de marque.'
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Bateaux de centres de plongée
      description: 'Plateformes RIB stables avec entrée et sortie faciles, rangement d''équipement et configurations moteur optimisées pour les opérations de plongée.'
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Embarcations de sauvetage et de secours
      description: 'RIBs rapides et bateaux gonflables conçus pour les opérations de recherche et sauvetage, les interventions d''urgence et les garde-côtes.'
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Solutions de tender de yacht
      description: 'Tenders RIB compacts et élégants qui complètent les superyachts et les embarcations de plaisance. Rangement facile, performances puissantes.'
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Solutions de bateaux de pêche
      description: 'Bateaux gonflables et RIBs stables et durables configurés pour les opérations de pêche commerciale et récréative.'
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Équipement de tourisme marin
      description: 'Bateaux gonflables, planches de SUP et kayaks prêts pour les flottes, pour resorts, tours opérateurs et sociétés de location de sports nautiques.'
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIBs énergie offshore
      description: 'RIBs renforcés pour le support des plateformes pétrolières et gazières, le transfert d''équipages vers les parcs éoliens, l''inspection de câbles sous-marins et la construction maritime.'
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Embarcations de travail aquacoles
      description: 'RIBs résistants à la corrosion pour l''aquaculture de poissons, la culture de perles et l''élevage océanique. Tubes Hypalon, quincaillerie en acier inoxydable, durabilité pour usage quotidien.'
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Recherche et études marines
      description: 'RIBs stables prêts pour instruments de recherche océanographique, surveillance environnementale, échantillonnage de la qualité de l''eau et programmes universitaires.'
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Embarcations de travail commerciales
      description: 'RIBs renforcés pour la patrouille, les études, le transport et la logistique offshore. Conçus pour les exigences rigoureuses des opérations commerciales.'
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: 'Vous ne savez pas quelle voie convient à votre entreprise ?'
  subtitle: 'Parlez-nous de votre activité — nous vous recommanderons le package d''équipement, le programme de marque ou la solution sur mesure adapté.'
  actions:
    - variant: primary
      text: Demandez une consultation gratuite
      href: /contact