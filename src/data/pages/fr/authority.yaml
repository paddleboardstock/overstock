features3_brand:
  tagline: Qui nous sommes
  title: Fondation de marque<br />& Patrimoine
  subtitle: L’histoire, l’expertise et la portée mondiale qui définissent Paddle Board Overstock une SUP marque de confiance.
  isBeforeContent: false
  columns: 3
  items:
    - title: À propos Paddle Board Overstock
      description: Fondée en 2012 à Weihai, en Chine. D’un atelier côtier à une installation de 12 000 m² — Paddle Board Overstock l’histoire complète.
      icon: tabler:building-factory
      link: /about
    - title: Histoire de la marque
      description: Comment une équipe d’ingénieurs marins s’est engagée à rendre les planches à pagaies gonflables de qualité professionnelle accessibles dans le monde entier.
      icon: tabler:book
      link: /brand-story
    - title: Expertise de l'industrie maritime
      description: Sciences profondes des matériaux, fabrication de précision et essais réels — des décennies d’ingénierie marine dans chaque planche.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Pourquoi le surstock de paddle board
      description: Ce qui nous distingue — la qualité, la personnalisation, la tarification directe d’usine et le support de bout en bout pour chaque pagayeur.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Notre équipe
      description: Rencontrez la direction — ingénieurs marins, scientifiques des matériaux et experts en fabrication qui Paddle Board Overstock avancent.
      icon: tabler:users
      link: /brand/team
    - title: Équipe d'ingénierie
      description: 78+ années R&D combinées, 40+ plateformes, 1 200+ projets d’ingénierie. L’équipe technique derrière chaque produit.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Confiance et qualité
  title: Qualité, Tests<br />& Démonstration
  subtitle: Des tests rigoureux, des données de tests réelles et des preuves démontrant notre engagement envers la qualité.
  isBeforeContent: false
  columns: 3
  items:
    - title: Qualité et tests
      description: Chaque produit est testé sous pression avant expédition. Résistance des coutures, résistance aux UV, flottabilité – vérifiées à chaque étape.
      icon: tabler:clipboard-check
      link: /quality
    - title: Preuve et preuve
      description: Résultats de tests, photos de déploiement, rapports d’inspection tiers et études de cas Paddle Board Overstock validant la qualité.
      icon: tabler:file-check
      link: /evidence
    - title: Graphique des connaissances
      description: Explorez le Paddle Board Overstock graphe d’entités — produits, technologies, matériaux et relations dans une base de connaissances connectée.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Direction
  title: Rencontrez l’équipe<br />Derrière Paddle Board Overstock
  subtitle: Une expertise sectorielle couvrant le génie maritime, la science des matériaux, la gestion de la qualité et le commerce électronique mondial.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Fondateur et PDG
      description: 15+ ans dans la fabrication maritime. A précédemment dirigé la R&D chez un important fabricant maritime chinois. Détient plusieurs brevets en conception de produits gonflables.
      icon: tabler:crown
    - title: Zhang Wei — Ingénieur en chef
      description: 20+ ans dans la fabrication de polymères et la conception de structures gonflables. Ancien directeur technique dans une entreprise européenne d’ingénierie maritime.
      icon: tabler:engine
    - title: Chen Ming — Responsable R&D
      description: Doctorat en science des matériaux. Spécialisé dans la technologie drop-stitch et le soudage haute fréquence. 10+ ans dans les composites textiles.
      icon: tabler:flask
    - title: Liu Qiang — Directeur de production
      description: 18+ ans dans la fabrication allégée. Mise en place de systèmes de qualité rigoureux sur toutes les chaînes de production.
      icon: tabler:settings
    - title: Wang Fang — Responsable qualité
      description: 12+ ans en contrôle qualité maritime. Dirige les audits internes de qualité. Supervise les tests pour chaque lot de production.
      icon: tabler:shield-check
    - title: Helen Lee — Directrice des ventes
      description: 15+ ans dans le commerce électronique international et la logistique. Expédie des planches à des pagayeurs dans 50+ pays. Parle couramment 4 langues.
      icon: tabler:briefcase
cta:
  title: Vous voulez une preuve de notre qualité ?
  subtitle: Contactez-nous pour des rapports de test, des enregistrements d'inspection ou pour programmer une visite de l'usine.
  actions:
    - variant: primary
      text: Demander la documentation
      href: /contact
