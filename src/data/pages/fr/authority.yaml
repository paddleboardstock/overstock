hero:
  tagline: Centre d'autorité
  title: Pourquoi Paddle Board Overstock ?<br />Une confiance bâtie sur une décennie
  subtitle: Chaque bateau que nous construisons porte le poids de plus de 10 ans d’ingénierie maritime, de systèmes de qualité certifiés et de milliers d’opérations réussies dans le monde entier. C'est pourquoi les professionnels du secteur choisissent Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Installation de fabrication marine Paddle Board Overstock et équipe d’ingénierie
