features3_brand:
  tagline: Qui nous sommes
  title: Fondation de marque<br />& Patrimoine
  subtitle: L'histoire, l'expertise et la portée mondiale qui définissent Paddle Board Overstock en tant que fabricant d'équipements marins de confiance.
  isBeforeContent: false
  columns: 3
  items:
    - title: À propos d'Paddle Board Overstock
      description: "Fondée en 2012 à Qingdao, en Chine. D'un atelier côtier à une installation de 12 000 m² : toute l'histoire d'Paddle Board Overstock."
      icon: tabler:building-factory
      link: /about
    - title: Histoire de la marque
      description: Comment une équipe d’ingénieurs maritimes a décidé de rendre les embarcations gonflables de qualité professionnelle accessibles dans le monde entier.
      icon: tabler:book
      link: /brand-story
    - title: Expertise de l'industrie maritime
      description: "Science approfondie des matériaux, fabrication de précision et tests en conditions réelles : des décennies d'ingénierie marine dans chaque coque."
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Présence mondiale
      description: Au service de plus de 50 pays sur tous les continents. Expertise régionale pour les exigences réglementaires locales et les préférences du marché.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Pourquoi Paddle Board Overstock
      description: 'Ce qui nous distingue : qualité, personnalisation, prix directs en usine et assistance de bout en bout pour les opérateurs commerciaux.'
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Notre équipe
      description: 'Rencontrez les dirigeants : ingénieurs maritimes, scientifiques des matériaux et experts en fabrication qui font avancer Paddle Board Overstock.'
      icon: tabler:users
      link: /brand/team
    - title: Équipe d'ingénierie
      description: Plus de 78 années de R&D combinées, plus de 40 plateformes, 12 certifications, plus de 1 200 projets OEM. L'équipe technique derrière chaque produit.
      icon: tabler:engine
      link: /engineering-team
    - title: Centre de R&D
      description: "Ingénierie de coque, soudage RF, laboratoire PVC, prototypage, réservoir d'essai et laboratoire de qualité : notre installation complète de recherche et développement."
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Confiance et qualité
  title: Certifications, qualité<br />& preuve
  subtitle: Des certifications indépendantes, des tests rigoureux et des preuves réelles qui démontrent notre engagement envers la qualité.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifications
      description: CE, ISO 9001, UKCA, BSCI, REACH — documentation complète de certification et conformité pour les marchés mondiaux.
      icon: tabler:shield-check
      link: /certifications
    - title: Qualité et tests
      description: Chaque produit est testé sous pression avant expédition. Résistance des coutures, résistance aux UV, flottabilité – vérifiées à chaque étape.
      icon: tabler:clipboard-check
      link: /quality
    - title: Preuve et preuve
      description: Résultats des tests, photos de déploiement, rapports d'inspection tiers et études de cas validant la qualité Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Graphique des connaissances
      description: "Explorez le graphique d'entité Paddle Board Overstock : produits, technologies, certifications et relations dans une base de connaissances connectée."
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Direction
  title: Rencontrez l'équipe<br />Derrière Paddle Board Overstock
  subtitle: Une expertise industrielle qui couvre l'ingénierie maritime, la science des matériaux, la gestion de la qualité et le commerce B2B mondial.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Fondateur et PDG
      description: Plus de 15 ans dans la fabrication maritime. Auparavant dirigé la recherche et le développement chez un important constructeur de bateaux chinois. Détient plusieurs brevets dans la conception de bateaux pneumatiques.
      icon: tabler:crown
    - title: Zhang Wei — Ingénieur en chef
      description: Plus de 20 ans dans la fabrication de PVC/Hypalon et la conception de coques en V profond. Ancien directeur technique d'une société européenne d'ingénierie maritime.
      icon: tabler:engine
    - title: Chen Ming — Responsable R&D
      description: Doctorat en science des matériaux. Spécialisé dans la technologie drop-stitch et le soudage haute fréquence. 10+ ans dans les composites textiles.
      icon: tabler:flask
    - title: Liu Qiang — Directeur de production
      description: 18+ ans d'expérience dans la fabrication Lean. Ceinture noire Six Sigma. Mise en œuvre des systèmes qualité ISO 9001 sur toutes les lignes de production.
      icon: tabler:settings
    - title: Wang Fang — Responsable qualité
      description: 12+ ans d'expérience dans le contrôle de la qualité marine. Auditeur certifié CE et ISO. Supervise les tests pour chaque lot de production.
      icon: tabler:shield-check
    - title: Helen Lee — Directrice des ventes
      description: Plus de 15 ans dans le commerce international B2B. Gestion des partenariats OEM/ODM dans plus de 30 pays. Parle couramment 4 langues.
      icon: tabler:briefcase
