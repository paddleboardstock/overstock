hero:
  tagline: Centre d'autorité
  title: Pourquoi Paddle Board Overstock?<br />Une confiance construite sur une décennie
  subtitle: Chaque planche que nous construisons porte le poids de 10+ ans d’ingénierie maritime, un contrôle qualité rigoureux et des milliers de pagayeurs sur l’eau à travers le monde. C’est pourquoi les pagayeurs Paddle Board Overstock choisissent .
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Installation de fabrication maritime et équipe d’ingénierie
