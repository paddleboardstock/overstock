tests:
  - title: Test de pression
    description: Les chambres gonflables sont soumises à des pressions dépassant leurs limites de fonctionnement recommandées pendant des périodes prolongées. Cela vérifie l'étanchéité à l'air et l'intégrité structurelle du matériau et des soudures, garantissant que le produit résiste à l'utilisation prévue et à une éventuelle surpression sans défaillance ni fuite.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
    standard: ISO 6185-1 | Spécifications internes AF-PT-001
  - title: Test d'impact
    description: Les produits sont soumis à des impacts contrôlés de différents poids et angles. Cela évalue la résistance du matériau aux perforations, déchirures et dommages causés par les collisions avec des obstacles dans l'eau, démontrant durabilité et longévité.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    standard: Spécification interne AF-IT-002
  - title: Test de résistance aux UV
    description: Les produits finis sont exposés à une lumière solaire simulée pendant des durées prolongées pour évaluer la résistance du matériau à la dégradation, la décoloration et l'affaiblissement causés par une exposition prolongée aux UV — essentiel pour les bateaux utilisés dans les environnements tropicaux et très ensoleillés.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
    standard: ASTM G154 | ISO 4892-3
  - title: Test de résistance à l'abrasion
    description: Des échantillons de matériau sont frottés contre des surfaces abrasives pendant un nombre défini de cycles sous pression contrôlée. Cela mesure la capacité du matériau à résister à l'usure due à une utilisation répétée, au contact avec le sable, les roches ou autres surfaces, garantissant une durabilité à long terme.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
    standard: ASTM D751 (Taber) | ISO 5470-1
  - title: Test de performance à basse température
    description: Les produits sont testés dans des environnements froids pour évaluer leur fonctionnalité et durabilité dans diverses conditions de température, évitant le durcissement ou la fissuration dans les eaux froides. Essentiel pour les bateaux destinés à une utilisation hivernale ou en haute latitude.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
    standard: Spécifications internes AF-LT-003 | MIL-STD-810G
  - title: Test de flottabilité & capacité de charge
    description: Les produits sont testés avec différents poids pour déterminer leur capacité de charge maximale et garantir qu'ils supportent en toute sécurité les utilisateurs et l'équipement. La capacité nominale de chaque modèle est vérifiée avant sa commercialisation.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
    standard: ISO 6185-1 | ISO 12402
  - title: Test de maniabilité
    description: Les produits sont testés pour leur réactivité aux entrées de pagaie ou de moteur, évaluant le rayon de braquage et la facilité de manœuvre. Des essais sur l'eau valident que la maniabilité réelle correspond aux spécifications de conception.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    standard: Spécifications internes AF-MT-004
  - title: Test d'étanchéité
    description: Les produits entièrement assemblés sont immergés ou soumis à des jets d'eau pour vérifier l'absence de fuites à travers les soudures, valves ou matériaux. Chaque bateau passe un contrôle d'étanchéité obligatoire avant expédition.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
    standard: ISO 6185-1 §7.3 | Spécifications internes AF-WT-005
