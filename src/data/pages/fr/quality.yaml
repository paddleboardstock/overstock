tests:
  - title: Test de pression
    standard: Spécification interne AF-PT-001
    description: Les chambres gonflables sont pressurisées à 1,25 fois la limite de fonctionnement recommandée et maintenues pendant 30 minutes. La perte de pression est mesurée pour valider l'étanchéité à l'air et l'intégrité structurelle des matériaux et des coutures.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Essai de résistance aux chocs
    standard: Spécification interne AF-IT-002
    description: Les produits sont soumis à des impacts contrôlés à l'aide de poids de chute standardisés et d'un appareil à pendule. Cela permet d'évaluer la résistance à la perforation, la propagation des déchirures et la résilience structurelle face aux collisions avec des obstacles, des quais et des débris.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Test de résistance
    standard: Protocole de Test Interne
    description: Des échantillons de matériaux sont exposés à des lampes UVA-340 dans des chambres de vieillissement accéléré pendant 1 000+ heures. Nous mesurons le changement de couleur (Delta E), la rétention de brillance et la perte de résistance à la traction pour valider les packs de stabilisateurs UV.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Test de résistance à l'abrasion
    standard: Protocole de Test Interne
    description: Les échantillons de matériaux sont soumis à des meules abrasives CS-10 sous des charges de 500 g/1 000 g pendant 1 000 cycles. La perte de masse et l'évaluation visuelle de l'usure déterminent la durabilité du revêtement face au sable, au gravier et aux lancements répétés.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Tests de performance à basse température
    standard: Spécification interne AF-LT-003
    description: Les produits et matériaux assemblés sont conditionnés à -20°C, -10°C et 0°C pendant 24 heures puis testés en flexion. Nous vérifions que PVC cela reste flexible sans fissures ni délamination.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Essais de flottabilité et de capacité de charge
    standard: Protocole de Test Interne
    description: Les produits sont chargés progressivement jusqu’à 1,25 fois la capacité nominale dans un pool contrôlé. Le franc-bord, la stabilité et les performances auto-drainantes sont enregistrées. La capacité nominale de chaque modèle est vérifiée mathématiquement et empiriquement.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Essais de maniabilité
    standard: Spécifications internes AF-MT-004
    description: Les essais en eau mesurent le rayon de braquage, l’accélération, le temps de planage et la réponse à palettes/moteurs sur une gamme de conditions de charge. Les caractéristiques de maniabilité réelles sont validées par rapport aux objectifs de conception.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Essais d’étancheté
    standard: Spécification interne AF-WT-005
    description: Chaque produit assemblé est testé par pulvérisation à 0,5 bar sur toutes les coutures, vannes et raccords. Un test de submersion sous pression de 5 minutes valide l’étanche de la chambre et des vannes. Norme zéro fuite avant l’expédition.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
