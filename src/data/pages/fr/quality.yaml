commitment:
  title: Notre engagement
  body: Grâce à ces procédures de test rigoureuses, {SITE} offre aux clients l’assurance que nos planches gonflables SUP sont non seulement performantes, mais aussi conçues pour durer — garantissant d’innombrables aventures agréables et sûres sur l’eau. Notre laboratoire de qualité fonctionne indépendamment de la production et rend compte directement à la direction.
  cta: Demande de documentation de test
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock exploite un programme de test de qualité à 8 protocoles couvrant la pression, l'impact, UV, l'abrasion, les basses températures, la flottabilité, la maniabilité et l'étanchéité. Taux de 99,3 % sans défaut sur les expéditions des 12 derniers mois.
  points:
    - '8 protocoles de test : pression, impact, UV, abrasion, basse température, flottabilité, maniabilité et étanchéité'
    - Taux de 99,3 % sans défaut sur les expéditions des 12 derniers mois
    - Chaque unité subit une mise en attente de 24 à 48 heures à une pression de 1,25 fois la pression nominale avec une tolérance de chute maximale de 5%
    - UV vieillissement accéléré (1 000+ heures) et test de résistance à l'abrasion du revêtement
