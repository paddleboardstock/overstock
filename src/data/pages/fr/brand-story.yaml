content_founding:
  tagline: Les débuts
  title: 'Nés sur le front de mer'
  subtitle: 'Paddle Board Overstock a démarré dans un atelier côtier à Qingdao avec un bateau et une vision : construire des embarcations gonflables capables de tenir dans des conditions maritimes réelles.'
  paragraphs:
    - "En 2012, nos fondateurs ont identifié une lacune sur le marché — la plupart des bateaux gonflables étaient soit abordables mais peu fiables, soit de haute qualité mais prohibitifs. Ils ont cru en l'existence d'une place pour un fabricant offrant à la fois qualité et valeur."
    - "La première coque a été construite à la main, testée dans les eaux locales et perfectionnée grâce aux retours réels de pêcheurs et de petits opérateurs commerciaux. Cette boucle — construire, tester, écouter, améliorer — reste au cœur de notre philosophie d'ingénierie aujourd'hui."
    - "En 2015, la réputation d'Paddle Board Overstock avait dépassé Qingdao. Des distributeurs internationaux ont commencé à demander des échantillons. Ce qui avait commencé comme un atelier local devenait un fournisseur mondial."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Premier atelier de production Paddle Board Overstock et fabrication
content_growth:
  tagline: Croissance et innovation
  title: "De l'atelier à un site de 12,000 m²"
  subtitle: 'Un investissement continu dans les personnes, les équipements et les process a transformé Paddle Board Overstock en un site de fabrication maritime moderne.'
  paragraphs:
    - "À mesure que la demande grandissait, notre site aussi. Nous sommes passés d'un petit atelier à une usine de 12,000 m² avec des lignes de production dédiées aux bateaux RIB, aux bateaux gonflables, aux SUP et aux accessoires."
    - "Nous avons investi dans des machines de découpe CNC, des équipements de soudure haute fréquence, des lignes de production drop stitch et des bancs d'essai complets — nous permettant de maîtriser chaque aspect de la qualité de production."
    - "Aujourd'hui, notre équipe de 200-300 personnes comprend des ingénieurs maritimes, des spécialistes des matériaux, des experts en contrôle qualité et des artisans qualifiés — dont beaucoup sont chez Paddle Board Overstock depuis les premiers jours."
content_mission:
  tagline: Notre mission
  title: "L'ingénierie de la liberté sur l'eau"
  subtitle: "Chaque produit Paddle Board Overstock est conçu pour aider les gens à explorer, travailler et s'épanouir sur l'eau — de manière fiable, sûre et abordable."
  list:
    - 'Concevoir des embarcations qui performent dans des conditions maritimes réelles — pas seulement sur le papier'
    - 'Bâtir des partenariats durables avec les distributeurs et les marques grâce à un service OEM/ODM fiable'
    - 'Améliorer en continu nos process de fabrication pour offrir plus de valeur'
    - "Assurer le suivi de chaque produit avec des pièces détachées d'origine et une expertise technique"
cta:
  title: 'Prêt à vous associer à un fabricant<br />qui se soucie de la qualité ?'
  subtitle: 'Contactez notre équipe pour discuter de votre projet OEM/ODM — sans pression de commande minimum, juste des conseils honnêtes.'
  actions:
    - variant: primary
      text: Démarrer une conversation
      href: /contact
    - text: Découvrir nos produits
