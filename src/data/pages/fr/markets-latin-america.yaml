hero:
  tagline: Amérique Latine
  title: Conseils en gros SUP pour<br />Détaillants latino-américains
  subtitle: Des paddle boards tout neufs en surstock pour les boutiques de plage, les flottes de location et les vendeurs en ligne à travers l’Amérique latine — de 5 planches, modèles mixtes, express ou fret maritime.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Des planches en surstock pour les détaillants de paddle boards d’Amérique latine
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves SUP en surstock aux petits détaillants à travers l’Amérique latine — du Mexique et du Brésil en passant par la Colombie, le Pérou, le Chili et l’Argentine. Les commandes en gros commencent à 5 planches avec des modèles mixtes les bienvenues, et chaque commande est expédiée depuis Weihai, Chine, par fret express aérien ou fret maritime consolidé. Les planches sont testées à 100 % sous pression et couvertes par la garantie de 2 ans SUP .
tldr_points:
  - En gros à partir de 5 cartes — modèles mixtes en une seule commande, tarifé par quantité totale
  - Fret aérien express ou maritim consolidé depuis Weihai, Chine
  - Les marchés hispanophones et portugais desservent toute la région
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché latino-américain SUP
  paragraphs:
    - L’Amérique latine est l’un des marchés du stand-up paddle à la croissance la plus rapide au monde. De longues côtes sur deux océans, des économies bien établies du tourisme balnéaire et une forte culture des sports de planche offrent aux commerçants indépendants de Tulum à Florianópolis une base croissante de clients — des touristes prenant leur premier cours, des pagayeurs le week-end, et une communauté locale de SUP courses et de surf en pleine expansion.
    - The retail landscape is dominated by small and mid-sized independent shops: Des écoles de pagaie en bord de mer qui vendent ce qu’elles louent, des boutiques de surf qui ajoutent SUP des lignes, et des vendeurs en ligne qui importent directement pour la première fois. Ces entreprises ont rarement besoin de conteneurs entiers d’un seul modèle — elles ont besoin de 5 à 20 planches par commande, combinées entre des modèles adaptés aux débutants et quelques éditions premium.
  customer_types:
    - title: Détaillants de Beach Town
      description: Les boutiques dans les villes de villégiature qui servent les touristes — ils ont besoin de planches débutantes durables en grande quantité, ainsi que quelques modèles haut de gamme pour exposition et vente.
    - title: Écoles de pagaie et flottes de location
      description: Les écoles associent les cours au commerce de détail, et les flottes de location rafraîchissent les planches chaque saison avec des commandes de modèles mixtes.
    - title: Vendeurs en ligne
      description: Les vendeurs de commerce électronique en langue espagnole et portugaise introduisant cette SUP catégorie sur leur marché national sans risque à l’échelle des conteneurs.
shipping_section:
  title: Expédition vers l’Amérique latine
  paragraphs:
    - Les commandes sont expédiées depuis notre base logistique à Weihai, en Chine. Échantillons de combinaisons de fret express aérien, 1 à 3 commandes d’embarquement et réapprovisionnements urgents ; le fret maritime consolidé est la voie économique pour 5 à 20 commandes de gros à bord vers les principaux ports de la région.
    - Nous fournissons des documents d’exportation complets et précis — factures commerciales et liste de conditionnement — pour assurer la fluidité du dédouanement. Les droits d’importation et taxes sont fixés par votre pays et payable par l’importateur ; nous ne regroupons jamais de promesses vagues « taxes incluses » dans un devis de fret.
  customs_note: Les règles d’importation et les taux de droits varient considérablement selon les pays d’Amérique latine. Vérifiez le régime d’importation actuel de votre pays pour les équipements de sports nautiques gonflables avant de commander, et demandez-nous toute documentation supplémentaire dont votre courtier a besoin.
faq_section:
  title: FAQ sur l’Amérique latine
  items:
    - q: Puis-je obtenir un devis en espagnol ou en portugais ?
      a: Notre équipe travaille avec des acheteurs à travers l’Amérique latine et peut gérer les devis et les confirmations de commande pour les clients hispanophones et portugais. Posez votre question dans votre question.
    - q: Est-ce que vous expédiez dans mon pays en Amérique latine ?
      a: Nous expedions dans toute la région — Mexique, Brésil, Colombie, Pérou, Chili, Argentine, Équateur et au-delà. Confirmez votre destination exacte dans votre demande de devis et nous vérifierons le service de fret en cours.
    - q: Quel est le minimum de gros pour les détaillants latino-américains ?
      a: Cinq planches au total, en mélangeant tous les modèles en stock. Ce total détermine votre niveau de tarification — vous pouvez combiner des éditions polyvalentes, de tourisme et artistiques dans un même envoi.
    - q: Qui paie les droits d'importation dans mon pays ?
      a: C'est vous, en tant qu'importateur, selon les règles de votre pays. Nous fournissons une documentation correcte et complète (facture commerciale, liste de colisage) afin que le dédouanement soit prévisible — consultez notre page d'expédition internationale pour tous les détails.
