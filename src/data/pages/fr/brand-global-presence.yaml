hero:
  tagline: Présence Mondiale
  title: "Présents dans Plus de 50 Pays<br />sur Tous les Continents"
  subtitle: "Des opérateurs de patrouille côtière européens aux distributeurs australiens de sports nautiques en passant par les équipes de secours du Moyen-Orient — les bateaux Paddle Board Overstock naviguent dans le monde entier."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabrication et distribution marines mondiales Paddle Board Overstock
stats:
  title: Portée Mondiale
  stats:
    - title: Pays
      amount: '50+'
    - title: Marchés d'Exportation
      amount: Europe, Amériques, Asie, Moyen-Orient, Océanie
    - title: Production
      amount: Qingdao, Chine
    - title: Entrepôt aux États-Unis
      amount: Montclair, CA
features3_markets:
  tagline: Marchés Clés
  title: "Expertise Régionale<br />pour des Exigences Locales"
  subtitle: "Nous comprenons que chaque marché a ses propres exigences réglementaires, préférences et cas d'utilisation."
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe et Royaume-Uni
      description: "Produits certifiés CE conformes aux normes EN ISO 6185. Forte demande de RIB, bateaux gonflables et planches SUP sur les marchés de l'UE. Les distributeurs britanniques apprécient notre rapidité de traitement."
      icon: tabler:map-pin
    - title: Amérique du Nord
      description: "Fabrication approuvée par les garde-côtes américains. Entrepôt américain à Montclair, CA pour une livraison rapide sur la côte ouest. Demande croissante de bateaux de pêche, embarcations de secours et SUPs récréatifs."
      icon: tabler:map-pin
    - title: Australie et Océanie
      description: "Marché solide pour les RIB et les annexes gonflables. Les distributeurs australiens apprécient nos bateaux en Hypalon pour leur résistance aux UV sous un soleil intense. Expédition rapide depuis notre installation en Asie."
      icon: tabler:map-pin
    - title: Moyen-Orient
      description: "Demande croissante de bateaux de patrouille et de secours. Nos RIB à coque en aluminium sont populaires auprès des garde-côtes et des opérateurs de sécurité. Configurations personnalisées pour les environnements à haute température."
      icon: tabler:map-pin
features3_distribution:
  tagline: Réseau de Distribution
  title: "Partenariat avec des Distributeurs<br />dans le Monde Entier"
  subtitle: "Nous travaillons avec des distributeurs d'équipements marins établis, des marques OEM et des agences d'achat gouvernementales."
  isBeforeContent: false
  columns: 3
  items:
    - title: Partenariats OEM/ODM
      description: "Fabrication en marque privée pour les marques mondiales de sports nautiques. Nous gérons tout, de la conception à la production en passant par l'expédition directe."
      icon: tabler:building
    - title: Réseau de Distributeurs
      description: "Des distributeurs agréés dans plus de 20 pays détiennent du stock et offrent un support local. Les candidatures de nouveaux distributeurs sont les bienvenues."
      icon: tabler:users
    - title: Gouvernement et Institutions
      description: "Fourniture directe aux garde-côtes, organisations de recherche et de sauvetage et programmes d'achat militaires. Conformité aux exigences d'approvisionnement institutionnel."
      icon: tabler:building-community
steps2_logistics:
  title: 'Logistique et Support Mondiaux'
  subtitle: "De l'usine à la destination — nous gérons toute la chaîne d'approvisionnement."
  items:
    - title: Options d'Expédition
      description: "Fret maritime (FOB Qingdao), fret aérien pour les commandes urgentes et coursier express pour les échantillons et pièces de rechange."
      icon: tabler:truck-delivery
    - title: Entrepôt aux États-Unis
      description: "Stock à Montclair, CA pour une livraison rapide dans toute l'Amérique du Nord. Côte ouest : 2-3 jours, centre : 3-4 jours, côte est : 4-5 jours."
      icon: tabler:building-warehouse
    - title: Pièces de Rechange
      description: "Pièces de rechange et consommables Paddle Board Overstock authentiques en stock toute l'année. Les pièces courantes sont expédiées sous 24 heures."
      icon: tabler:package
    - title: Support Technique
      description: "Ligne directe avec notre équipe d'ingénierie pour les questions techniques, les conseils de réparation et le support de rénovation. Nous assurons le support des bateaux construits il y a 20 ans."
      icon: tabler:headset
cta:
  title: "Souhaitez-vous devenir distributeur ?"
  subtitle: "Nous étendons activement notre réseau de distribution. Contactez notre équipe export pour discuter des opportunités de partenariat."
  actions:
    - variant: primary
      text: Demande de partenariat
      href: /contact
    - text: Voir notre gamme de produits
      href: /products
