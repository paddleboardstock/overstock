hero:
  tagline: Paddle Board Overstock Académie
  title: Centre d'apprentissage
  subtitle: Guides et tutoriels pour tous les niveaux de compétence — des bases SUP aux techniques de sauvetage avancées
categories:
  - level: Débutant
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Bases
        desc: Apprenez les fondamentaux du paddle board — position, technique de coup de pagaie et équilibre.
        slug: beginner-sup-guide
      - title: Techniques de pagaie
        desc: Coup de pagaie avant, coup de balayage, coup de tirage et appui bas — maîtrisez les mouvements essentiels de la pagaie.
        slug: sup-paddle-guide
      - title: Sécurité d'abord
        desc: Pratiques de sécurité essentielles incluant la vérification météorologique, l'utilisation de PFD, les règles de laisse et l'auto-sauvetage.
        slug: sup-safety-guide
  - level: Intermédiaire
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Essentiels du touring
        desc: Planification de sorties de plusieurs heures — navigation, hydratation, rythme et lecture des prévisions de vent.
        slug: touring-sup-guide
      - title: Lecture de la météo
        desc: Interpréter les prévisions marines, identifier les formations nuageuses et comprendre les effets du vent sur l'eau.
        slug: weather-planning-water-sports
      - title: Bases de la navigation
        desc: Lecture de cartes, utilisation de la boussole, points GPS et planification d'itinéraire pour le paddling côtier.
        slug: sup-navigation-guide
      - title: Conscience des marées
        desc: Compréhension des cycles de marée, des courants et de leur effet sur le moment de mise à l'eau et le tracé de la route.
        slug: understanding-tides
  - level: Avancé
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planification de sorties de plusieurs jours
        desc: Logistique d'expédition — sélection du matériel, planification des repas, protocoles de sécurité et contacts d'urgence.
        slug: sup-travel-guide
      - title: Techniques de sauvetage
        desc: Auto-sauvetage, sauvetage en T et protocoles de remorquage en eau libre.
        slug: sup-self-rescue
      - title: Paddling de nuit
        desc: Navigation après la tombée de la nuit — exigences d'éclairage, mémorisation de l'itinéraire, communication de groupe et attention aux dangers.
        slug: sup-navigation-guide
  - level: Entretien
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Nettoyage et entretien
        desc: Rinçage à l'eau douce, protection UV, prévention de la moisissure et techniques de séchage appropriées après chaque séance.
        slug: inflatable-sup-maintenance
      - title: Guide de rangement
        desc: Best practices for storing inflatable boards — deflation, folding, temperature control, and shelf life.
        slug: inflatable-sup-storage
      - title: Repair Basics
        desc: Fix small punctures, seam leaks, and valve issues with PVC repair kits and patch techniques.
        slug: inflatable-sup-repair
      - title: Valve Maintenance
        desc: Identify valve types (Halkey-Roberts, Boston, Leafield), clean debris, and replace faulty stems.
        slug: inflatable-sup-repair
knowledge_center_tagline: Knowledge Center
knowledge_center_title: Paddle Board Guides & Knowledge
knowledge_center_subtitle: Expert guides and buying advice for paddle boarders of every level.
knowledge_sections:
  - title: Board Technology & Construction
    tagline: Inside Your Paddle Board
    desc: How inflatable paddle boards are built — drop-stitch cores, laminate layers, EVA decks, and factory pressure testing.
    guides:
      - title: How Paddle Boards Are Made
        desc: From material cutting and lamination to 100% pressure testing — see how every board leaves the factory.
        href: /factory/process
      - title: Drop-Stitch Core Technology
        desc: How thousands of internal threads create a rigid, high-pressure inflatable structure.
        href: /learn/drop-stitch-core
      - title: Materials Reference
        desc: PVC denier ratings, fabric weights, UV resistance, and deck materials explained.
        href: /learn/materials
      - title: Inflatable Board Technology
        desc: Welded seams, rail construction, and valve systems that keep your board stiff and airtight.
        href: /learn/inflatable-technology
  - title: Buying Guides
    tagline: Choose the Right Board
    desc: Everything you need to pick your first — or next — inflatable SUP, from sizing to construction.
    guides:
      - title: How to Choose an Inflatable SUP
        desc: The key factors — construction, thickness, fin setup, and included accessories.
        href: /guides/how-to-choose-your-sup/
      - title: What Is Stand-Up Paddleboarding?
        desc: A friendly introduction to the sport, the gear, and why inflatable boards make it easy to start.
        href: /guides/what-is-sup
      - title: Inflatable vs Hard Board
        desc: Compare i SUPs and hard epoxy boards across portability, durability, performance, and value.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Size Guide
        desc: Find the right board length, width, and volume for your weight, skill, and paddling style.
        href: /size-guide
  - title: Compétences & Sécurité
    tagline: Pagaie avec Confiance
    desc: Connaissances pratiques pour chaque session — bases pour débutants, sécurité sur l'eau, entretien et réparation.
    guides:
      - title: SUP Bases — Guide du Débutant
        desc: Tout ce qu'un débutant doit savoir — types de planches, taille de la pagaie, position et conseils pour le premier jour.
        href: /v2/beginner-sup-guide
      - title: Essentiels de la Sécurité sur l'Eau
        desc: Vérifications météorologiques, sélection PFD, règles de leash, auto-sauvetage et meilleures pratiques pour pagayer en groupe.
        href: /learn/water-safety
      - title: SUP Entretien & Soins
        desc: Nettoyage, rangement, protection UV et conseils d'entretien pour les planches gonflables SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Bases de la Réparation de Planche
        desc: Fix small punctures, seam leaks, and valve issues with PVC repair kits and patch techniques.
        href: /v2/inflatable-sup-repair
