faq:
  title: OEM/ODM — Questions Fréquemment Posées
  questions:
    - q: Quelle est la quantité minimale de commande (MOQ) pour les SUP gonflables personnalisés ?
      a: Pour les modèles standard avec moules existants, la MOQ commence à 5–10 unités par design. Pour les moules et outillages entièrement personnalisés, la MOQ est généralement de 200+ unités. Nous travaillons avec les startups et les marques émergentes pour trouver des points d'entrée viables.
    - q: Quelle est la MOQ pour les bateaux RIB personnalisés ?
      a: Les modèles RIB démarrent à 2–5 unités par design avec des moules existants, tandis que les moules RIB entièrement personnalisés exigent des engagements plus importants. Nous travaillons avec les startups et les marques établies pour trouver des points d'entrée viables.
    - q: Combien de temps dure le processus d'échantillonnage OEM ?
      a: Les échantillons de prototype standard sont réalisés sous 7 à 14 jours ouvrés après l'approbation du design. Les commandes urgentes peuvent être priorisées à 5–7 jours moyennant des frais supplémentaires.
    - q: Quelle est la différence entre le PVC et l'Hypalon pour les bateaux gonflables ?
      a: Le PVC est plus léger, plus abordable et offre une excellente flexibilité par temps froid. L'Hypalon (CSM) offre une résistance supérieure aux UV et à l'ozone avec une durée de vie plus longue (10–15 ans contre 5–8 ans). Nous recommandons le PVC pour la plupart des usages récréatifs et l'Hypalon pour l'usage commercial/professionnel.
    - q: Pouvez-vous personnaliser la forme et le design du gonflable ?
      a: Oui. Notre équipe R&D peut développer des moules personnalisés pour toute forme de coque, contour de planche ou configuration de flotteur. Nous utilisons des moules en aluminium usinés par CNC pour la précision et la constance.
    - q: Proposez-vous des services d'audit d'usine ?
      a: Nous accueillons favorablement les audits d'usine sur site et par des tiers dans nos installations de 12 000 m² à Qingdao. Nous maintenons les certifications ISO 9001 et BSCI et pouvons partager les rapports d'audit sous NDA.
    - q: Quelles conditions d'expédition proposez-vous ?
      a: Nous proposons les conditions FOB Qingdao (standard), CIF et DDP. Le chargement du conteneur et la documentation d'exportation complète sont inclus dans toutes les commandes OEM.

content_profiles:
  tagline: Profils de Marque
  title: 'Fabrication OEM / Marque Privée<br /> par Type de Client'
  subtitle: 'Les différents profils de marque impliquent des exigences distinctes — nous adaptons nos services OEM/ODM à votre modèle économique, à votre échelle et à votre stratégie de mise sur le marché.'
  items:
    - title: Marques de Navigation Startups
      subtitle: MOQ faible, montée en puissance rapide
      description: "Entrepreneurs et fondateurs lançant leur première gamme de bateaux RIB, SUP ou bateaux gonflables. Vous avez besoin d'un partenaire de fabrication qui traite votre marque comme la sienne — avec des seuils d'entrée bas, des tailles de lot flexibles et un accompagnement de conception pratique à chaque étape."
      features:
        - 'MOQ dès 2–5 unités (RIB) / 5–10 unités (SUP) par SKU'
        - "Bibliothèque de moules existante pour éviter les coûts d'outillage"
        - 'Pack de marque complet : logo, graphismes du flotteur, emballage, étiquettes suspendues'
        - "Flux échantillon d'abord — approbation avant production"
    - title: Marques Marines Établies
      subtitle: Échelle OEM avec conformité CE/ISO
      description: "Marques existantes de bateaux, jet-skis ou accessoires marins ajoutant des embarcations gonflables à leur portefeuille. Vous avez besoin d'une qualité constante au fil des séries, d'une conformité réglementaire pour les marchés mondiaux et de la capacité à co-concevoir des coques ou des formes de flotteur personnalisées."
      features:
        - 'Ingénierie personnalisée de moules 3D pour les designs exclusifs'
        - 'Documentation de conformité CE 2013/53/EU, UKCA, USCG'
        - "Rapports d'audit social BSCI pour la conformité des distributeurs"
        - 'Gestion de compte dédiée + créneaux de production prioritaires'
    - title: Marques DTC et E-Commerce
      subtitle: Emballage prêt à vendre à grande échelle
      description: "Marques digital-first vendant via Amazon, Shopify ou leurs propres boutiques en ligne. L'emballage, l'expérience de déballage et la qualité constante des unités sont essentiels. Vous avez besoin d'une usine qui comprend la dynamique de vitesse de vente et de taux de retour du e-commerce."
      features:
        - "Conception de coffret prêt à vendre + impression d'encarts"
        - 'Emballage sous vide / palettisation pour un transport économique'
        - 'Codes-barres EAN / UPC et documentation prête pour la douane'
        - 'Consolidation de conteneurs mixtes pour optimiser le coût rendu'
    - title: Opérateurs de Location et d'Hôtellerie
      subtitle: Flottes de qualité commerciale pour resorts et entreprises de location
      description: "Les resorts, centres de sports nautiques et opérateurs de location ont besoin de flottes durables et réparables avec une marque cohérente. Nous proposons des tarifs flotte, des conteneurs multi-modèles et un support de pièces de rechange pendant des années d'exploitation."
      features:
        - 'Tarifs flotte sur les commandes de conteneurs multi-modèles'
        - 'Options de flotteur et de pont durables de qualité commerciale'
        - 'Kits de pièces de rechange et formation à la maintenance'
        - 'Marque cohérente sur les flottes de SUP, RIB et kayak'

