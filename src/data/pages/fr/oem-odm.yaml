process_steps:
  title: Processus OEM/ODM en 6 Étapes
  subtitle: Du brief de conception au FOB Qingdao — un processus rationalisé
  steps:
    - number: '01'
      title: Brief de Conception et Modélisation CAO 3D
      description: Partagez vos spécifications cibles, votre produit de référence ou votre concept. Notre équipe d'ingénieurs élabore des plans CAO détaillés et des rendus 3D pour votre approbation.
      timeline: 3–5 jours
    - number: '02'
      title: Sélection des Matériaux et Tests des Tissus
      description: Choisissez entre le PVC de qualité militaire (0,9–1,2 mm), l'Hypalon CSM ou les tissus à noyau drop-stitch. Nous effectuons des tests de résistance à la traction, d'adhérence du revêtement et de stabilité aux UV.
      timeline: 2–3 jours
    - number: '03'
      title: Prototypage Rapide et Production d'Échantillons
      description: Nous usinons des moules personnalisés par CNC et produisons des échantillons de préproduction avec les couleurs de votre marque, votre logo et les matériaux spécifiés. Les échantillons sont expédiés pour votre approbation.
      timeline: 7–14 jours
    - number: '04'
      title: Test de Maintien de Pression de 24 à 48 Heures
      description: Chaque prototype subit des tests rigoureux de rétention de pression à 1,25x la pression nominale. Des tests de pelage des soudures et une vérification dimensionnelle sont effectués.
      timeline: 1–2 jours
    - number: '05'
      title: Contrôle Qualité CE/ISO et Emballage
      description: Checklist qualité à 100 points. Chaque unité est inspectée avant l'emballage prêt à vendre. Déclaration de conformité CE et rapport de conformité BSCI inclus.
      timeline: 2–3 jours
    - number: '06'
      title: Expédition FOB Qingdao et Logistique
      description: Les produits finis sont palettisés, filmés sous rétraction et chargés en conteneur au port de Qingdao. Documentation d'exportation complète, dédouanement et suivi en temps réel.
      timeline: 7–14 jours

