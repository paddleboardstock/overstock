content_challenge:
  tagline: Le défi
  title: Exigences de l'aquaculture<br />Équipements résistants à l'eau salée
  subtitle: Les fermes piscicoles, les fermes perlières et les ranchs océaniques fonctionnent dans l’environnement marin le plus agressif chimiquement – exposition prolongée à l’eau salée, résidus de carburant et d’aliments et utilisation quotidienne continue.
  paragraphs:
    - Les opérations aquacoles fonctionnent 365 jours par an dans des environnements côtiers exposés et au large. Les bateaux de travail utilisés pour l'inspection des cages, le transport des aliments, la maintenance des lignes de perles et l'entretien des équipements sont confrontés à une immersion constante dans l'eau salée, à l'exposition aux UV et au contact de produits chimiques provenant des carburants, des aliments pour poissons et des traitements antisalissures.
    - '**La corrosion est l''ennemi principal** — Les équipements marins standard se détériorent rapidement dans ces conditions. Moteurs hors-bord, châssis de remorques et équipements de coque doivent être remplacés en permanence. Les exploitants ont besoin de bateaux construits en matériaux résistants à la corrosion, capables de supporter des années dans cet environnement sans se dégrader.'
    - '**La fiabilité quotidienne est cruciale** — Un bateau de travail en panne signifie des programmes d''alimentation manqués, des récoltes retardées et des pertes de production coûteuses. Pour les fermes perlières, une seule journée d''inspection manquée peut entraîner des dommages importants sur la récolte. Pour les fermes piscicoles, un retard d''alimentation affecte les taux de croissance et la rentabilité.'
    - Les RIB aquacoles d'Paddle Board Overstock sont conçus avec une quincaillerie résistante à la corrosion, des tubes Hypalon ultra-résistants et des coques renforcées spécialement destinées aux conditions exigeantes de la pisciculture, de la perliculture et de l'élevage en mer.
content_solution:
  tagline: Notre solution
  title: RIB spécialement conçus<br />Pour l'industrie de l'aquaculture
  subtitle: Chaque bateau de travail aquacole Paddle Board Overstock est conçu pour résister aux environnements d'eau salée agressifs tout en offrant des performances quotidiennes fiables.
  list:
    - Tubes Hypalon de qualité marine — résistance supérieure aux UV, à l'eau salée, aux carburants et aux produits chimiques des aliments pour poissons
    - Quincaillerie en acier inoxydable 316 sur l'ensemble du bateau — aucune rouille en cas d'exposition prolongée à l'eau salée
    - Bourrelets de protection renforcés et protection de quille pour les contacts répétés avec les quais et les cages
    - Pont autovideur pour un lavage et un drainage faciles après les opérations de transport d'aliments et de récolte
    - Configuration de pont plat pour transporter sacs d'aliments, bacs de récolte et équipements
    - Configurations hors-bord de 15 à 60 CV — optimisées pour l'équilibre entre charge utile et consommation de carburant
    - Options de couleurs de tubes à haute visibilité pour un repérage facile sur l'ensemble des grandes surfaces d'exploitation
content_segments:
  tagline: Profils aquacoles
  title: Solutions pour bateaux de travail<br />Par type d'aquaculture
  subtitle: "Différentes opérations aquacoles ont des exigences différentes en matière de bateaux de travail : des petits semi-rigides agiles pour l'inspection des cages à poissons aux plates-formes de transport stables pour la perliculture et aux bateaux de travail robustes pour l'élevage en mer."
  items:
    - title: Opérations de pisciculture
      subtitle: Inspection des cages, transport des aliments, aide à la récolte
      description: "Les fermes piscicoles marines exploitent des cages dans des zones côtières et offshore exposées. Les bateaux de travail sont utilisés quotidiennement pour l'inspection des filets de cage, les opérations d'alimentation, le soutien à la récolte et l'entretien des équipements. Le principal défi est la corrosion : les bateaux sont constamment exposés à l’eau salée, aux résidus d’aliments pour poissons et au carburant. Un bateau de travail fiable est essentiel car une alimentation manquée ou une récolte retardée affectent directement le rendement et la rentabilité de la production."
      features:
        - 'Pack environnement agressif : quincaillerie en acier inoxydable 316, composants en alliages de qualité marine'
        - Aménagement de pont plat pour le transport des sacs d'aliments et des bacs de récolte
        - Pont autovideur pour un rinçage facile après les opérations
        - Tubes Hypalon avec revêtement résistant aux agents chimiques pour l'exposition aux aliments et aux carburants
        - Bourrelets de protection renforcés pour les contacts fréquents avec les cages et les quais
    - title: Exploitations perlières
      subtitle: Transport stable pour l'inspection et la récolte des lignes de perles
      description: Les fermes perlières nécessitent des bateaux de travail stables et fiables pour le transport quotidien entre les lignes de perles, l'inspection des filets à huîtres et la collecte des récoltes. Ces opérations se déroulent dans des zones côtières isolées avec une infrastructure de maintenance limitée. Le bateau doit être suffisamment stable pour que l'équipage puisse travailler tout en inspectant les lignes de perles, avec un embarquement facile et un espace de pont suffisant pour transporter les huîtres, les filets et les fournitures récoltés. La fiabilité et la facilité d’entretien sont essentielles dans les exploitations agricoles éloignées.
      features:
        - Conception de coque stable pour l'équipage debout lors de l'inspection des lignes de perles
        - Pont plat avec surface antidérapante pour des déplacements sûrs de l'équipage
        - Faible franc-bord pour un accès facile aux filets à huîtres et à la récolte
        - Configuration hors-bord simple pour un entretien facile sur site
        - Ensemble de tubes et de quincaillerie résistant à la corrosion pour une exposition continue à l'eau salée
    - title: Élevage en mer et mise en valeur du milieu marin
      subtitle: Transport de juvéniles, entretien des cages, soutien au suivi
      description: Les opérations d'élevage en milieu marin impliquent la libération de stocks juvéniles dans des environnements marins gérés, la surveillance de la croissance et l'entretien des structures d'amélioration. Les bateaux de travail doivent transporter des juvéniles vivants dans des conteneurs aérés, transporter du matériel de surveillance et accéder aux sites de lâcher côtiers peu profonds. La conception de la coque doit équilibrer la capacité de charge avec un faible tirant d'eau pour l'accès à la plage et à l'estuaire.
      features:
        - Espace de pont pour conteneurs de transport aéré des juvéniles et matériel de surveillance
        - Tirant d'eau faible pour l'accès aux sites de lâcher sur les plages et dans les estuaires
        - Échouage facile sur la plage — quille renforcée et protection d'étrave
        - Points de fixation pour l'électronique de surveillance et le matériel de prélèvement d'échantillons
        - Tubes Hypalon très résistants pour une durabilité dans les conditions mêlant sable et eau de mer
