faq:
  title: FAQ sur les forfaits
  questions:
    - q: Quelle est la quantité minimum de commande pour les colis ?
      a: Le forfait Club Starter comprend un minimum de 10 unités. Les forfaits Resort et Brand sont personnalisés selon vos besoins avec des MOQ flexibles.
    - q: Combien de temps prend la livraison ?
      a: La production standard est de 30 à 45 jours à compter de la confirmation de la commande. Une production accélérée est disponible moyennant des frais supplémentaires.
    - q: Puis-je personnaliser les couleurs et la marque de l'équipement ?
      a: "Oui. Tous les forfaits incluent une personnalisation complète : couleurs du tableau, impressions de logo et conception de l'emballage."
    - q: Fournissez-vous un support après-vente ?
      a: Oui. Chaque forfait comprend l'accès à nos guides de maintenance en ligne, à nos didacticiels vidéo et à notre système de commande de pièces détachées.
