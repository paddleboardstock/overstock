hero:
  tagline: Indonésie
  title: Conseils en gros SUP pour<br />Entreprises indonésiennes
  subtitle: Boutiques de sports nautiques, stations balnéaires insulaires et exploitants à travers l’archipel — des planches neuves de 5 unités, modèles mixtes, expédiées depuis la Chine.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Panneaux de surstock SUP pour les complexes indonésiens et les boutiques de sports nautiques de Bali
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves en surstock SUP aux entreprises indonésiennes — boutiques de sports nautiques à Bali, stations balnéaires de Lombok à Gillis et au-delà, clubs de plage et opérateurs de location. Les commandes en gros commencent à 5 planches avec des modèles mixtes en un seul envoi, envoyées de Weihai, Chine, par fret aérien express ou fret maritime consolidé. Chaque planche est testée à 100 % par pression et couverte par la garantie de 2 ans SUP .
tldr_points:
  - Vente en gros à partir de 5 cartes — modèles mixtes, tarifés par quantité totale
  - Au service de l’économie des sports nautiques et des stations balnéaires insulaires à travers tout le pays
  - Courtes routes de fret Chine–Indonésie, aériennes ou maritimes
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché indonésien SUP
  paragraphs:
    - L’Indonésie est l’une des grandes économies asiatiques des sports nautiques, et Bali en est le cœur battant. Des clubs de plage de Seminyak et Canggu aux lagunes calmes de Sanur et Nusa Dua, les planches de pagaie apparaissent partout — pagaies au lever du soleil au-dessus des récifs, SUP cours de yoga, excursions sur les lagunes et programmes pour les hôtels. Au-delà de Bali, Lombok, les îles Gili et la scène touristique en pleine expansion à travers l’archipel suivent le même schéma.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: La durabilité UV , la performance et la réparabilité comptent plus que le vernis du catalogue. Les commandes sont de 5 à 20 tableaux, mélangées pour les cours, la location et l’exposition au détail.
  customer_types:
    - title: Boutiques de sports nautiques de Bali
      description: Des opérateurs établis à Sanur, Seminyak et Canggu, ajoutant SUP aux lignes de surf, de plongée et de snorkeling.
    - title: Complexes insulaires et clubs de plage
      description: Des stations et clubs de plage à Bali, Lombok et Gillis proposent des programmes de pagaie et de yoga pour les SUP invités.
    - title: Opérateurs de tours et de location
      description: Des voyagistes de lagon et de mangroves ainsi que des stands de location à l’heure rafraîchissent les flottes selon la saison.
shipping_section:
  title: Navire vers l’Indonésie
  paragraphs:
    - L’Indonésie est l’une des voies de fret les plus courtes depuis notre base de Weihai, en Chine. Le fret aérien express transporte des échantillons et 1 à 3 commandes de montage rapidement vers Denpasar et Jakarta ; Consolidated Sea Freight dessert 5 à 20 commandes de gros à bord via Tanjung Priok, Tanjung Benoa et d’autres ports. Les deux options sont indiquées avec des temps de transit estimés pour votre destination.
    - Nous fournissons les factures commerciales et les décharges de liste de conditionnement requises, avec les codes HS corrects et les valeurs déclarées. Les droits d’importation et taxes sont exigibles par l’importateur selon les règles indonésiennes.
  customs_note: La décharge indonésienne pour le matériel sportif est sensible à la documentation — travaillez avec votre courtier en douane (PPJK) pour confirmer le traitement actuel des droits de douane et des impôts. Nous fournissons une paperasse complète et cohérente et répondons rapidement aux demandes des courtiers.
faq_section:
  title: FAQ sur l’Indonésie
  items:
    - q: À quelle vitesse le fret est-il de Chine à Bali ?
      a: L’Indonésie est l’une de nos destinations de fret les plus proches depuis Weihai. L’avion express vers Denpasar ou Jakarta est l’option la plus rapide pour les échantillons et les petites commandes ; le fret maritime consolidé est indiqué avec une fenêtre de transit pour les commandes en gros. Les deux sont détaillés dans votre devis.
    - q: Les planches conviennent-elles à une location quotidienne en tropical UV?
      a: Oui — drop-stitch PVC la construction est homologuée pour des cycles de location quotidiens que nous fournissons aux flottes dans 50+ pays. Les soins standards (rinçage après eau salée, stockage à l’ombre) les maintiennent en service pendant de nombreuses saisons du soleil de Bali.
    - q: À quoi ressemble une commande dans un magasin de sports nautiques ?
      a: Typiquement 5 à 15 planches mélangées entre des modèles polyvalents stables pour les cours et les locations et quelques éditions artistiques premium pour l'affichage en magasin — un envoi, prix basé sur la quantité totale.
    - q: Pouvez-vous soutenir notre PPJK avec de la documentation ?
      a: Oui. Chaque commande est expédiée avec une facture commerciale et une liste de colisage avec les codes SH corrects et les valeurs déclarées, et nous répondons rapidement lorsque votre transitaire a besoin de documents supplémentaires.
