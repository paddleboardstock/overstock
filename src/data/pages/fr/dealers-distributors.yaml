content_benefits:
  tagline: Avantages du partenariat
  title: Pourquoi les distributeurs<br />Choisissent Paddle Board Overstock
  subtitle: Un partenariat conçu pour les distributeurs maritimes qui ont besoin d'un approvisionnement fiable, de marges compétitives et d'un soutien professionnel.
  items:
    - title: Protection du territoire
      description: Droits territoriaux exclusifs ou semi-exclusifs pour distributeurs qualifiés. Cartographie du marché et gestion des conflits de canaux pour protéger votre investissement dans la construction de la marque Paddle Board Overstock dans votre région.
      icon: tabler:map-pin
    - title: Prix de gros compétitifs
      description: Tarification échelonnée basée sur les engagements de volume annuels. Structure tarifaire protégeant les marges avec garanties de prix anticipées et ventilation transparente des coûts (base FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Kit d'aide au marketing
      description: Photographies professionnelles de produits, fiches techniques, modèles de documentation de conformité, contenu pour les réseaux sociaux et supports marketing comarqués. Mis à jour chaque année avec les lancements de nouveaux produits.
      icon: tabler:photo
    - title: Formation technique
      description: Formation produit pour votre équipe commerciale (virtuelle ou sur site), formation à la maintenance et à la réparation pour vos techniciens de service, ainsi qu'une FAQ et des guides de dépannage destinés aux clients.
      icon: tabler:school
    - title: Pièces de rechange et après-vente
      description: Fourniture dédiée de pièces détachées avec expédition prioritaire. Sections de tubes de remplacement, vannes, ailettes et kits de réparation disponibles pour une exécution rapide des commandes. Assistance au traitement des réclamations au titre de la garantie.
      icon: tabler:tool
    - title: Documents de conformité
      description: "Ensemble complet de documentation de conformité pour votre marché : CE DoC, données de plaque de constructeur, manuels du propriétaire et assistance à l'enregistrement réglementaire. Élimine votre fardeau de conformité."
      icon: tabler:file-certificate
content_requirements:
  tagline: Ce que nous recherchons
  title: Distributeur<br />Exigences
  subtitle: Nous recherchons des partenaires capables de représenter et de soutenir professionnellement les produits Paddle Board Overstock sur leur territoire.
  items:
    - title: Connaissance du territoire et du marché
      description: Présence établie sur le marché de la marine, des sports nautiques ou des loisirs de plein air. Compréhension des réglementations locales, des préférences des consommateurs et des canaux de distribution des produits nautiques.
      icon: tabler:target
    - title: Expérience de l'industrie
      description: Minimum 2 ans d'expérience dans la distribution d'équipements marins, de plein air ou sportifs. Expérience avérée auprès de marques internationales et d’opérations de vente en gros B2B.
      icon: tabler:briefcase
    - title: Showroom ou entrepôt
      description: Installation physique pour l'affichage des produits, le stockage des stocks et le service client. Capacité à maintenir des unités de démonstration et un inventaire de pièces de rechange pour votre territoire.
      icon: tabler:building-store
    - title: Engagement envers les normes de la marque
      description: Volonté de maintenir les normes de présentation de la marque Paddle Board Overstock, de fournir un support client conformément à nos protocoles de service et de participer aux mises à jour annuelles de la formation sur les produits.
      icon: tabler:star
content_process:
  tagline: Processus de candidature
  title: Concessionnaire en 4 étapes<br />Processus de candidature
  subtitle: "De la demande initiale à la première expédition : un processus d'intégration simple."
  steps:
    - number: '01'
      title: Enquête initiale et qualification
      description: Soumettez votre demande de distributeur avec les détails de l'entreprise, le territoire d'intérêt, les gammes de produits actuelles et les estimations de volume annuel. Nous examinons dans les 5 jours ouvrables.
      timeline: 5 jours
    - number: '02'
      title: Examen commercial et conditions
      description: Réunion virtuelle pour discuter de la stratégie territoriale, des niveaux de tarification et des conditions de partenariat. Passez en revue les exigences en matière de documentation de conformité pour votre marché. Signature NDA si nécessaire.
      timeline: 1-2 semaines
    - number: '03'
      title: Exemple de commande et évaluation
      description: Passez une commande initiale d'échantillon (2 à 5 unités) au prix du distributeur pour l'évaluation du marché et la formation de l'équipe. Documentation complète de conformité et préparation de la démonstration incluses.
      timeline: 30-45 jours
    - number: '04'
      title: Lancement et support du partenariat
      description: Première commande de conteneurs avec protection du territoire activée. Kit marketing livré, équipe commerciale formée et responsable de compte dédié assigné. Revues commerciales trimestrielles en cours.
      timeline: En cours
content_application_docs:
  tagline: Documents de candidature
  title: Documents requis<br />pour la candidature concessionnaire
  subtitle: Pour candidater à une concession Paddle Board Overstock, veuillez préparer les documents et informations suivants pour notre équipe d'examen.
  items:
    - title: Certificat d'immatriculation de l'entreprise
      description: Document d'enregistrement d'entreprise valide indiquant la raison sociale, l'adresse enregistrée et le champ d'activité couvrant la distribution d'équipements marins, sportifs ou de plein air.
      icon: tabler:file-text
    - title: Plan de couverture territoriale
      description: Territoire géographique visé, réseau de vente ou de distribution existant, segments de clients cibles et volume annuel proposé par catégorie de produits (RIB, SUP, kayak).
      icon: tabler:map
    - title: Capacité de showroom ou d'entrepôt
      description: Local physique pour l'exposition des produits, le stockage et le service client. Photos ou plans d'étage montrant la zone de démonstration et la capacité de stockage des pièces détachées.
      icon: tabler:building
    - title: Attestation de capacité financière
      description: 'Référence bancaire ou états financiers confirmant la capacité à passer une commande conteneur initiale et à maintenir un stock. Commande initiale minimale : un conteneur de 20 pieds (10 à 20 unités, modèles mixtes).'
      icon: tabler:coin
    - title: Capacité de support après-vente
      description: Techniciens de service formés ou formables à l'entretien et à la réparation de bateaux pneumatiques. Capacité de traitement des réclamations de garantie et engagement de stock de pièces détachées.
      icon: tabler:tool
    - title: Références de marques antérieures
      description: Liste des marques d'équipements marins ou sportifs actuellement ou précédemment distribuées. Références de contact disponibles d'un commun accord. Les startups sans expérience de distribution peuvent être retenues avec un engagement financier plus solide.
      icon: tabler:users
faq:
  title: Programme de concession — Foire aux questions
  questions:
    - q: Quelle est la quantité minimum de commande pour les distributeurs ?
      a: Le MOQ du distributeur commence à 10-20 unités par commande, avec une flexibilité pour les modèles mixtes (RIB, gonflable, SUP). Des échantillons initiaux de commandes de 2 à 5 unités sont disponibles au prix du distributeur pour une évaluation du marché.
    - q: Offrez-vous des droits territoriaux exclusifs ?
      a: Des droits de territoire exclusifs sont disponibles pour les distributeurs qualifiés qui respectent leurs engagements de volume annuel et maintiennent les normes de la marque. Des accords semi-exclusifs et non exclusifs sont également disponibles pour les marchés émergents.
    - q: Quel support marketing apportez-vous ?
      a: Nous fournissons un kit marketing complet comprenant des photographies professionnelles de produits, des fiches techniques, des modèles de documentation de conformité, une bibliothèque de contenu pour les réseaux sociaux et des documents comarqués. Mis à jour chaque année avec les lancements de nouveaux produits.
    - q: Comment sont traitées les demandes de garantie ?
      a: Les distributeurs servent de premier point de contact pour les réclamations au titre de la garantie. Nous fournissons des critères de garantie clairs, des protocoles de documentation photo et un remplacement rapide ou un traitement de crédit. Conditions de garantie : 5 ans limités sur le tissu/coutures/coque du tube du bateau ; 2 ans sur SUP et accessoires.
    - q: Puis-je commercialiser des produits Paddle Board Overstock sous ma propre marque ?
      a: Oui, via notre programme OEM/ODM. Les options de marque privée incluent des graphiques de tubes personnalisés, la marque de la console, l'emballage de vente au détail et la documentation de conformité sous votre marque. Consultez notre page de services OEM/ODM pour plus de détails.
    - q: Quelle documentation de conformité est incluse pour les distributeurs ?
      a: Chaque expédition comprend la DoC CE spécifique au modèle, les données de la plaque du constructeur, les manuels du propriétaire et la documentation d'expédition. Nous fournissons également une assistance en matière d'enregistrement réglementaire pour votre territoire et vous aidons à répondre à toutes les exigences de conformité locales.
