  items:
    - title: Propriétaires de marques / Marque blanche
      description: 'Conception de produits sur mesure, habillage en marque blanche, documentation de conformité sous votre marque et accompagnement technique dédié, du concept au conteneur.'
      icon: tabler:palette
      cta: Demander un devis OEM/ODM
      cta_href: /request-quotation
    - title: Distributeurs / Grossistes
      description: 'Protection de territoire, tarifs de gros compétitifs, kits de support marketing, formation produit et documentation de conformité complète pour votre marché.'
      icon: tabler:world
      cta: Devenir revendeur
      cta_href: /dealers-distributors
    - title: Resorts / Loueurs
      description: 'Durabilité à usage commercial, dimensionnement de flotte, commandes conteneur multi-modèles, stratégie de pièces détachées et équipements personnalisés au nom du resort.'
      icon: tabler:beach
      cta: Obtenir une offre commerciale
      cta_href: /solutions/resorts
    - title: Secours / Institutions / Professionnels
      description: "Construction Hypalon/CSM, options de conformité SOLAS, certification spécifique au projet, appui documentaire pour vos appels d'offres et ingénierie sous NDA."
      icon: tabler:shield
      cta: Discuter d'un projet
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Capacités OEM/ODM
  title: 'Ce que vous obtenez<br />chez Aquafarer'
  subtitle: "Accès direct à l'usine avec ingénierie, qualité et conformité intégrées — pas une société de négoce."
  columns: 2
  items:
    - title: Personnalisation OEM/ODM
      description: "Forme de coque, matériau des tubes (PVC ou Hypalon/CSM), agencement de la console, assises, branding, couleurs et emballage. De la retouche légère à l'ingénierie 100 % sur mesure."
      icon: tabler:adjustments
    - title: MOQ faibles, échantillons rapides
      description: 'RIB : 2-5 unités (moule existant). SUP : 5-10 unités par SKU. Moules sur mesure : 200+ unités. Échantillons de pré-production à votre marque en 7-14 jours.'
      icon: tabler:rocket
    - title: Qualité prête pour la production
      description: 'Chaque unité testée en pression à 1,25× la pression nominale pendant 24-48 h. 99,3 % sans défaut selon AQL 2,5 / ISO 2859. Check-list de 100 points par coque.'
      icon: tabler:certificate
    - title: Documentation de conformité complète
      description: 'CE selon 2013/53/EU (RCD), ISO 9001:2015 (SGS), audit social BSCI, conformité REACH, marquage UKCA. DoC et plaque constructeur spécifiques à chaque modèle.'
      icon: tabler:file-certificate
    - title: Délai de 30-45 jours
      description: 'Production standard 30-45 jours FOB Qingdao. Prototypes en 7-14 jours. Production accélérée possible. Plans de chargement conteneur et emballage ISPM-15 inclus.'
      icon: tabler:truck-delivery
    - title: Après-vente & pièces détachées
      description: 'Garantie 5 ans sur bateaux, kayaks et RIB, 2 ans sur SUP et accessoires. Fourniture de pièces en expédition prioritaire. Appui au traitement des réclamations.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Catégories de produits
  title: '5 catégories,<br />64 modèles certifiés CE'
  subtitle: 'Des annexes RIB de 2,4 m aux SUP de 15 pieds — tout est fabriqué dans notre usine ISO 9001 de Qingdao.'
  items:
    - title: Bateaux RIB
      description: '2,4 m à 7,0 m avec coques aluminium ou GRP. Tubes PVC ou Hypalon/CSM. CE selon 2013/53/EU. Configurations patrouille, plongée, sauvetage et professionnelles.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Bateaux pneumatiques
      description: '2,0 m à 5,0 m avec plancher aluminium, plancher marine ou plancher gonflable. Modèles pêche, loisir et annexe.'
      icon: tabler:sailboat
      link: /products
    - title: SUP / Paddles
      description: '9 à 15 pieds en Drop-Stitch 4 et 6 pouces. Modèles allround, randonnée, yoga et pêche. Versions à usage commercial disponibles.'
      icon: tabler:swimming
      link: /products
    - title: Kayaks
      description: 'Kayaks gonflables 1 à 3 places. Modèles loisir et randonnée, avec option plancher Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Accessoires de sécurité
      description: 'Gilets de sauvetage certifiés CE, lignes de sauvetage, kits de réparation, pompes et feux de navigation. Gilets approuvés USCG Type III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Force industrielle
  title: 'Une production prête<br />pour vos audits'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² certifiés ISO 9001 — un vrai fabricant, pas une société de négoce</h3>
  items:
    - title: 6 lignes de production dédiées
      description: 'Lignes séparées RIB, bateaux pneumatiques, SUP, kayaks, équipements de sécurité et OEM/ODM. Chacune avec ses points de contrôle qualité et sa planification.'
    - title: 100 % testés en pression
      description: 'Chaque chambre gonflée à 1,25× la pression nominale et maintenue 24-48 h. Résultats rattachés au numéro de coque (HIN).'
    - title: Traçabilité par coque
      description: 'Dossiers de production au niveau HIN avec plus de 21 champs par coque : lot matière, identifiant du soudeur, résultat du test de pression, configuration finale et destination.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: 'Usine Aquafarer de 12 000 m² certifiée ISO 9001 à Qingdao, lignes de production RIB'

content_compliance:
  tagline: Conformité & preuves qualité
  title: 'Des preuves documentées,<br />pas des promesses'
  subtitle: "Chaque affirmation de conformité s'appuie sur une documentation spécifique au modèle, disponible pour votre vérification."
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Système de management de la qualité certifié par TÜV Rheinland/SGS. Audits de surveillance annuels. Processus QC documentés de la réception matière à la libération pour expédition.'
      icon: tabler:certificate
    - title: CE selon 2013/53/EU (RCD)
      description: '64 modèles avec déclarations de conformité spécifiques. Évaluation de conformité selon les modules applicables. Enregistrement HIN et plaque constructeur pour chaque coque.'
      icon: tabler:file-certificate
    - title: Conformité sociale BSCI
      description: 'Audit BSCI annuel réalisé par SGS. Pratiques de travail éthiques, sécurité et management environnemental vérifiés sur tout notre site.'
      icon: tabler:users
    - title: REACH & UKCA
      description: "Tous les matériaux PVC et colles sont conformes au règlement REACH de l'UE. Marquage UKCA disponible pour le marché britannique. Fiches de données de sécurité sur demande."
      icon: tabler:shield-check

steps:
  title: Le processus OEM/ODM — du brief au conteneur
  items:
    - title: 'Étape 1 : <span class="font-medium">Besoins</span>'
      description: 'Partagez vos spécifications produit, votre marché cible, les quantités et vos exigences de conformité. Notre équipe ingénierie analyse tout sous 48 h.'
      icon: tabler:file-text
    - title: 'Étape 2 : <span class="font-medium">Proposition</span>'
      description: 'Vous recevez une proposition détaillée : spécifications, options matériaux, MOQ, prix, délai et périmètre de conformité pour votre marché.'
      icon: tabler:clipboard-list
    - title: 'Étape 3 : <span class="font-medium">Prototype</span>'
      description: "Échantillon de pré-production à votre marque en 7-14 jours. Tests qualité complets à 1,25× la pression nominale. Coût de l'échantillon déduit de la production."
      icon: tabler:settings
    - title: 'Étape 4 : <span class="font-medium">Production</span>'
      description: "Production de 30-45 jours FOB Qingdao après validation de l'échantillon. Points de contrôle en cours de production, tests de pression et inspection finale de 100 points sur chaque unité."
      icon: tabler:building-factory
    - title: 'Étape 5 : <span class="font-medium">Livraison</span>'
      description: "Plan de chargement conteneur, emballage bois ISPM-15, dossier de conformité et expédition FOB Qingdao avec documents d'export complets."
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: "Processus de fabrication OEM/ODM d'Aquafarer, de la conception au conteneur"

blog_latest:
  title: Analyses secteur & technique
  information: |
    Guides de conformité RCD, articles sur le processus OEM/ODM, comparatifs
    matériaux et ressources d'audit usine — par l'équipe ingénierie Aquafarer.

faqs:
  title: FAQ achats B2B
  subtitle: 'Les questions les plus fréquentes des marques, distributeurs et opérateurs commerciaux sur la fabrication OEM/ODM chez Aquafarer.'
  columns: 2
  items:
    - title: Êtes-vous fabricant ou société de négoce ?
      description: "Nous sommes une usine verticalement intégrée, avec un contrôle total sur la qualité, les matériaux et les délais. Licence commerciale et périmètre de production vérifiables lors d'un audit d'usine."
      icon: tabler:building-factory
      category: all
    - title: Comment se déroule votre processus OEM/ODM ?
      description: "De l'analyse des besoins (48 h) à la proposition, puis le prototype (7-14 jours) et la production (30-45 jours FOB Qingdao). Avec accompagnement ingénierie complet, documentation de conformité et traçabilité par coque à chaque étape."
      icon: tabler:route
      category: all
    - title: Quels sont vos MOQ ?
      description: "RIB : 2-5 unités par modèle (moule existant), 200+ pour un moule sur mesure. SUP : 5-10 unités par SKU. Commandes conteneur multi-modèles possibles. Commandes d'échantillons dès 2-5 unités pour évaluation."
      icon: tabler:sort-ascending
      category: all
    - title: Quelles options de personnalisation proposez-vous ?
      description: 'Forme de coque, matériau des tubes (PVC ou Hypalon/CSM), diamètre des tubes, agencement de la console, assises, direction, circuit carburant, agencement du pont, couleurs de marque, graphismes logo, design des pads EVA, emballage retail et manuel utilisateur à votre marque.'
      icon: tabler:adjustments
      category: all
    - title: Quels documents de conformité pour mon marché ?
      description: "DoC CE selon 2013/53/EU, marquage UKCA, certificat ISO 9001 (SGS), rapport d'audit BSCI, conformité REACH, rapports d'essais matériaux, relevés de tests de pression et plaque constructeur spécifique par modèle. Documentation propre à votre marché sur demande."
      icon: tabler:file-certificate
      category: all
    - title: Quels sont les délais d'échantillonnage et de production ?
      description: "Échantillons de pré-production : 7-14 jours ouvrés. Production standard : 30-45 jours FOB Qingdao. Production accélérée possible avec surcoût. En haute saison (mars-juin), les délais peuvent s'allonger."
      icon: tabler:clock
      category: all
    - title: Peut-on organiser un audit d'usine ou une visite vidéo en direct ?
      description: 'Oui. Les audits sur site à Qingdao sont les bienvenus avec 3-5 jours de préavis. Visites vidéo en direct via WhatsApp/Zoom disponibles immédiatement. Inspections par des tiers (SGS, BV, TÜV) possibles.'
      icon: tabler:video
      category: all
    - title: Quels contrôles qualité avant expédition ?
      description: "Test de maintien en pression à 1,25× la pression nominale (24-48 h), test de pelage des soudures, check-list d'inspection finale de 100 points, vérification dimensionnelle, contrôle cosmétique, vérification de la documentation de conformité et test d'intégrité de l'emballage. Selon les procédures ISO 9001."
      icon: tabler:clipboard-check
      category: all

