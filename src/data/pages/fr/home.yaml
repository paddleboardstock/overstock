  subtitle: Que ce soit votre première séance ou votre cinquantième, il existe un tableau de dégagement correspondant à votre manière de pagayer.
  items:
    - title: Débutants
      description: Planches extra-larges et stables sur tous les côtés qui rendent votre première séance facile — la plupart des débutants se tiennent debout en quelques minutes.
      icon: tabler:swimming
      cta: Boutique Débutant-Friendly SUPs
      cta_href: /supboard
    - title: Familles
      description: Planches stables que toute la famille peut partager, plus des modèles plus légers pour enfants — du matériel qui se range dans la voiture et se gonfle en quelques minutes.
      icon: tabler:beach
      cta: Acheter des forfaits familiaux
      cta_href: /products
    - title: Pagaies de tourisme et de fitness
      description: Planches de randonnée plus longues et plus rapides et plateformes de yoga sur toute la surface pour les pagayeurs qui vont loin.
      icon: tabler:route
      cta: Acheter des planches de touring et de yoga
      cta_href: /supboard
    - title: Pêcheurs
      description: Plateformes ultra-stables avec des supports pour équipement et de la place pour un refroidisseur — moulées à partir d'un pont plat et silencieux.
      icon: tabler:lifebuoy
      cta: Boutique de pêche SUPs
      cta_href: /products
features:
  id: features
  tagline: Pourquoi acheter chez Paddle Board Overstock
  title: Véritable usine,<br />De vraies économies
  subtitle: 'Forfaits SUP en surstock et en liquidation directement en usine : qualité éprouvée sans majoration de détail.'
  columns: 2
  items:
    - title: Jusqu'à 60 % de réduction sur le prix de détail
      description: Nous vendons directement les surplus et les lots de déstockage d'usine — sans intermédiaires, sans majoration de vente au détail. Les mêmes cartes qui se vendent au prix fort ailleurs, aux prix de déstockage ici.
      icon: tabler:rocket
    - title: Forfaits complets
      description: 'Chaque SUP est livré en tant que package complet : planche, sac à dos de voyage, pompe à main, pagaie réglable, aileron amovible, leash en spirale et kit de réparation.'
      icon: tabler:clipboard-list
    - title: Qualité éprouvée
      description: Chaque planche passe les mêmes contrôles d'inspection que le stock de détail à plein prix — testée avant expédition, traçable grâce au code de lot.
      icon: tabler:shield-check
    - title: Pas de commande minimum
      description: Achetez exactement ce dont vous avez besoin. Ajoutez un tableau au panier, payez, c'est terminé — pas de minimum, pas de processus de devis, pas d'attente.
      icon: tabler:adjustments
    - title: Livraison rapide dans le monde entier
      description: Les commandes en stock sont expédiées depuis Weihai sous 2 à 3 jours ouvrables. Livraison suivie vers 50+ pays à travers l'UE, l'Amérique du Nord, l'Asie-Pacifique et au-delà.
      icon: tabler:truck-delivery
    - title: Garantie de 2 ans SUP
      description: Chaque SUP planche et accessoire est couvert pendant 2 ans — coutures drop-stitch, valves de gonflage et accessoires compris. Les réclamations sont traitées en quelques jours, pas en semaines.
      icon: tabler:lifebuoy
