content_workshop:
  isReversed: true
  tagline: Force de l’usine
  title: Pourquoi nos prix de liquidation<br />sont réels
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Vraie usine, vraies économies — chaque planche est expédiée depuis notre site de Weihai</h3>
  items:
    - title: Mêmes chaînes de production que les grandes marques
      description: Notre usine de Weihai de 12 000 m² fabrique des planches pour des marques internationales et nos propres lots excédentaires sur les mêmes lignes avec les mêmes matériaux.
    - title: Testée à 100 % sous pression
      description: Chaque planche est pressurisée à 1,25x la valeur nominale PSI et maintenue avant expédition. Taux de défauts de 99,3 % par AQL 2,5 / ISO 2859.
    - title: Sans intermédiaires
      description: Les planches sont expédiées directement de l’usine à votre porte. Pas de majoration distributrice, pas de majoration de détail — c’est ainsi que le prix de liquidation reste jusqu’à 60 % en dessous du prix de détail.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Usine de Weihai de 12 000 m² avec lignes de production de gonflables SUP
content_compliance:
  tagline: Preuve de conformité et de qualité
  title: Qualité certifiée,<br />Documentée
  subtitle: Chaque revendication de conformité est étayée par des certificats et une documentation spécifique au modèle disponible pour vérification.
  items:
    - title: ISO 9001:2015
      description: Système de gestion de la qualité certifié par TÜV Rheinland/SGS. Audits de surveillance annuels. Processus de Q.C. documentés depuis la réception du matériel jusqu’à l’expédition.
      icon: tabler:certificate
    - title: CE Certifié
      description: 13 modèles CE-certifiés SUP selon les directives européennes applicables, chacun avec une déclaration de conformité spécifique au modèle et les données de plaque constructeur.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Tous les matériaux PVC et adhésifs respectent le règlement européen REACH. Marquage UKCA disponible pour le marché britannique. Fiches de données de sécurité des matériaux disponibles sur demande.
      icon: tabler:shield-check
    - title: Garantie de 2 ans SUP
      description: Chaque planche SUP et accessoire est couvert par deux ans — coutures drop-stitch, valves de gonflage et accessoires inclus. Les réclamations sont traitées rapidement.
      icon: tabler:lifebuoy
steps:
  title: Du passage en caisse à l'eau — Comment votre commande est expédiée
  items:
    - title: Étape 1 :<span class="font-medium">Choisissez votre planche</span>
      description: Choisissez parmi les modèles polyvalents, de randonnée, de yoga et pour enfants. Nos guides d'achat vous aident à choisir la taille et le style de planche adaptés à votre pratique du paddle.
      icon: tabler:clipboard-list
    - title: Étape 2 :<span class="font-medium">Paiement sécurisé</span>
      description: Payez en toute sécurité avec Stripe ou PayPal. Toutes les principales cartes de crédit et de débit sont acceptées. Aucun compte requis — la confirmation de commande arrive dans votre boîte de réception.
      icon: tabler:file-text
    - title: Étape 3 :<span class="font-medium">Inspection de qualité</span>
      description: Chaque carte est testée à 100 % sous une pression de 1,25 fois la valeur nominale PSI et vérifiée selon une liste de contrôle qualité complète avant d'être emballée.
      icon: tabler:settings
    - title: Étape 4 :<span class="font-medium">Expédition rapide</span>
      description: Les commandes en stock sont expédiées depuis notre usine de Weihai sous 2 à 3 jours ouvrables. Un traitement urgent est disponible pour les commandes urgentes.
      icon: tabler:building-factory
    - title: Étape 5 :<span class="font-medium">Livraison suivie</span>
      description: Expédition suivie dans le monde entier vers 50+ pays. Votre garantie de 2 ans et le support après-vente réactif commencent le jour de l'arrivée de votre planche.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP processus de commande depuis le paiement sécurisé jusqu'à la livraison suivie dans le monde entier
