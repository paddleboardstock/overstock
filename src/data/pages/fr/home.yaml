content_workshop:
  isReversed: true
  tagline: Force de l’usine
  title: Pourquoi nos prix de liquidation<br />sont réels
  content: <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Une vraie usine, de vraies économies — Chaque planche est expédiée depuis notre usine de Weihai</h3>
  items:
    - title: Mêmes chaînes de production que les grandes marques
      description: Notre usine de Weihai de 12 000 m² fabrique des planches pour des marques internationales et nos propres lots excédentaires sur les mêmes lignes avec les mêmes matériaux.
    - title: Tout neuf, jamais utilisé
      description: Les tableaux en surstock sont des surplus inutilisés provenant de commandes de production terminées — des stocks neufs d'usine, complets avec tous les accessoires d'emballage et la garantie.
    - title: Sans intermédiaires
      description: Les planches sont expédiées directement de l'usine de Weihai à votre porte — sans distributeurs, sans majoration du commerce de détail.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Usine de Weihai de 12 000 m² avec lignes de production de gonflables SUP
content_compliance:
  tagline: Qualité et tests
  title: Qualité testée,<br />Documentée
  subtitle: 'Chaque réclamation de qualité est étayée par des chiffres réels provenant de notre chaîne de production : tests de pression, enregistrements de lots et taux de défauts mesurés.'
  items:
    - title: 100 % testé sous pression
      description: Chaque planche est gonflée à 1,25x PSI et maintenue avant son expédition. Si une couture, une valve ou un fil à point tombé tombe en panne, la planche ne quitte jamais l'usine.
      icon: tabler:shield-check
    - title: Taux sans défaut de 99,3 %
      description: Basé sur l'inspection des expéditions sortantes au cours des 12 derniers mois — à partir de nos propres dossiers d'inspection, et non du marketing.
      icon: tabler:gauge
    - title: Traçabilité des lots
      description: Chaque carte porte un code de lot de production, de sorte que les demandes de garantie et les contrôles de qualité remontent aux matériaux et aux tirages exacts.
      icon: tabler:clipboard-check
    - title: Garantie de 2 ans SUP
      description: Chaque planche SUP et accessoire est couvert par deux ans — coutures drop-stitch, valves de gonflage et accessoires inclus. Les réclamations sont traitées rapidement.
      icon: tabler:lifebuoy
steps:
  title: Du passage en caisse à l'eau — Comment votre commande est expédiée
  items:
    - title: 'Étape 1 : <span class="font-medium">Choisissez votre planche</span>'
      description: Choisissez parmi les modèles polyvalents, de randonnée, de yoga et pour enfants. Nos guides d'achat vous aident à choisir la taille et le style de planche adaptés à votre pratique du paddle.
      icon: tabler:clipboard-list
    - title: 'Étape 2 : <span class="font-medium">Paiement sécurisé</span>'
      description: Payez en toute sécurité avec Stripe ou PayPal. Toutes les principales cartes de crédit et de débit sont acceptées. Aucun compte requis — la confirmation de commande arrive dans votre boîte de réception.
      icon: tabler:file-text
    - title: 'Étape 3 : <span class="font-medium">Inspection qualité</span>'
      description: Chaque carte est testée à 100 % sous une pression de 1,25 fois la valeur nominale PSI et vérifiée selon une liste de contrôle qualité complète avant d'être emballée.
      icon: tabler:settings
    - title: 'Étape 4 : <span class="font-medium">Expédition rapide</span>'
      description: Les commandes en stock sont expédiées depuis notre usine de Weihai sous 2 à 3 jours ouvrables. Un traitement urgent est disponible pour les commandes urgentes.
      icon: tabler:building-factory
    - title: 'Étape 5 : <span class="font-medium">Livraison suivie</span>'
      description: Expédition suivie dans le monde entier vers 50+ pays. Votre garantie de 2 ans et le support après-vente réactif commencent le jour de l'arrivée de votre planche.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP processus de commande depuis le paiement sécurisé jusqu'à la livraison suivie dans le monde entier
