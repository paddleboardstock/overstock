faqs:
  title: SUP Commande et FAQ produit
  subtitle: Questions courantes sur nos cartes en liquidation SUP, la commande, le paiement, la livraison et la garantie.
  columns: 2
  items:
    - title: Est-ce que SUP est difficile à apprendre ?
      description: Pas du tout. La plupart des débutants se lèvent et pagaient lors de leur première séance. Nos planches tout-terrain SUP disposent de plateformes larges et stables conçues spécialement pour les pagayeurs débutants. Commencez sur une eau calme et vous naviguerez en quelques minutes.
      icon: tabler:swimming
      category: souper
    - title: Quelle est la limite de poids ?
      description: Notre support polyvalent SUPs supporte jusqu'à 220 lb et les plateformes de tourisme et de yoga supportent jusqu'à 250 lb. Chaque page produit indique la capacité exacte de poids du rider afin que vous puissiez adapter le surf à vos besoins.
      icon: tabler:adjustments
      category: souper
    - title: Puis-je voyager avec un SUP gonflable ?
      description: Absolument. Chaque planche Paddle Board Overstock se range dans un étui de transport de la taille d'un sac à dos. Pesant seulement 18 à 22 livres, il est facile à transporter à la plage, au lac ou dans les terminaux d'aéroport. Vérifiez la politique de bagages de votre compagnie aérienne avant de voyager.
      icon: tabler:truck-delivery
      category: souper
    - title: Qu'y a-t-il dans la boîte ?
      description: Chaque Paddle Board Overstock SUP comprend la planche, un sac à dos de voyage, une pompe à main, une pagaie réglable, un aileron amovible, une laisse en spirale et un kit de réparation.
      icon: tabler:clipboard-list
      category: souper
    - title: Pourquoi vos prix sont-ils inférieurs à ceux du commerce de détail ?
      description: Nous vendons des surplus de stock d'usine (des planches neuves provenant de commandes de production terminées) provenant de notre propre base de fabrication de Weihai et de partenaires de production sélectionnés. Aucune majoration au détail ni intermédiaire signifie des forfaits SUP complets jusqu'à 60 % de réduction sur les prix de détail habituels, avec la même qualité testée sous pression.
      icon: tabler:shield-check
      category: ordres
    - title: Comment passer une commande et payer ?
      description: Ajoutez votre SUP package au panier et procédez au paiement en toute sécurité avec Stripe ou PayPal. Nous acceptons toutes les principales cartes de crédit et de débit. Chaque commande est confirmée par e-mail avec une facture complète.
      icon: tabler:file-text
      category: ordres
    - title: Expédiez-vous dans le monde entier ?
      description: Oui. Nous expédions vers 50+ pays à travers l'UE, l'Amérique du Nord, l'Asie-Pacifique, le Moyen-Orient et l'Afrique. Les commandes en stock sont généralement expédiées sous 2 à 3 jours ouvrables avec un suivi fourni pour chaque colis.
      icon: tabler:route
      category: ordres
    - title: Quelle garantie les cartes SUP incluent-elles ?
      description: "Chaque planche SUP et accessoire est couvert par une garantie de 2 ans — y compris la planche elle-même, les joints drop-stitch et les valves d'inflation. Les réclamations sont traitées en quelques jours, pas en semaines : déposez votre demande en ligne et nous réparons ou remplaçons."
      icon: tabler:lifebuoy
      category: ordres
