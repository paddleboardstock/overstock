hero:
  tagline: Partenaires et Distribution
  title: 'Devenez Partenaire Aquafarer<br />— Réseau Mondial de Distribution'
  subtitle: "Rejoignez le réseau mondial de partenaires d'Aquafarer. Nous travaillons avec des distributeurs marins, des concessionnaires de bateaux, des détaillants d'équipement et des partenaires de marque dans plus de 50 pays."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Réseau mondial de partenaires et distributeurs Aquafarer
content_programs:
  tagline: Programmes Partenaires
  title: 'Programmes Partenaires<br />Conçus pour la Croissance'
  subtitle: "Que vous soyez distributeur, concessionnaire ou partenaire de marque, Aquafarer propose des programmes conçus pour soutenir votre activité."
  columns: 3
  items:
    - title: 'Programme Distributeur'
      description: "Distribution exclusive par territoire avec tarifs dégressifs, support marketing et accès direct à l'usine. Engagement minimum requis selon la taille du territoire."
      icon: tabler:world
    - title: 'Programme Concessionnaire'
      description: "Tarifs concessionnaire directs, formation produit, supports marketing et assistance sous garantie pour les magasins physiques et les boutiques en ligne."
      icon: tabler:building-store
    - title: 'Partenariat OEM/ODM'
      description: "Fabrication OEM et ODM complète avec branding personnalisé, emballage et spécifications produit. Du concept au conteneur."
      icon: tabler:certificate
    - title: 'Partenariat de Marque'
      description: "Co-branding, marque privée et programmes de modèles exclusifs pour les marques établies dans le secteur marin et les loisirs de plein air."
      icon: tabler:stars
    - title: 'Gouvernement et Institutions'
      description: "Programmes de fournisseur privilégié pour les agences gouvernementales, les garde-côtes, les forces armées et les organisations humanitaires. Documentation prête pour les appels d'offres."
      icon: tabler:building-community
    - title: 'Partenaire Resort et Location'
      description: "Tarifs flotte, qualité constante et branding personnalisé pour les resorts, les centres de plongée et les opérations de location dans le monde entier."
      icon: tabler:sun
content_benefits:
  tagline: Pourquoi Devenir Partenaire
  title: "Pourquoi les Partenaires Choisissent Aquafarer"
  subtitle: "Nos partenaires bénéficient d'une réelle capacité de fabrication, d'une qualité constante et d'un support réactif."
  list:
    - "Accès Direct à l'Usine : Travaillez directement avec notre équipe de fabrication — sans intermédiaires. Des réponses plus rapides, de meilleurs tarifs et une visibilité totale sur la production."
    - 'Personnalisation Prête : Personnalisez vos produits avec des couleurs, logos, emballages et spécifications sur mesure. Quantités minimales de commande adaptées à votre marché.'
    - 'Qualité Garantie : Production certifiée ISO 9001 avec conformité CE, UKCA et BSCI. Chaque produit est testé avant expédition.'
    - 'Logistique Mondiale : Expédition depuis Qingdao, Chine, avec options FOB, CIF et DDP. Entrepôt américain à Montclair, CA pour la distribution en Amérique du Nord.'
    - 'Support Marketing : Catalogues produits, photographie, documentation technique et ressources numériques pour soutenir vos efforts de vente.'
    - "Formation et Support : Formation produit pour votre équipe commerciale, support technique pour vos clients et coordination du service de garantie."
content_process:
  tagline: Comment Devenir Partenaire
  title: 'Processus de Partenariat Simple'
  subtitle: "Notre processus de partenariat est simple — conçu pour vous permettre de vendre rapidement les produits Aquafarer."
  items:
    - title: "Étape 1 : Soumettre une Demande"
      description: "Complétez notre formulaire de demande de partenariat avec le profil de votre entreprise, votre marché cible et vos intérêts produit."
    - title: "Étape 2 : Examen de Qualification"
      description: "Notre équipe partenariats examine votre demande et vous contacte sous 3 jours ouvrables pour discuter des opportunités."
    - title: "Étape 3 : Accord et Mise en Place"
      description: "Signez un accord de partenariat, configurez votre compte et recevez les tarifs partenaires, les supports marketing et les échantillons produits."
    - title: "Étape 4 : Formation et Lancement"
      description: "Formation produit, support commercial et supports marketing fournis. Vous êtes prêt à commencer à vendre."
cta:
  title: "Prêt à devenir partenaire Aquafarer ?"
  subtitle: "Soumettez votre demande de partenariat et notre équipe répondra sous 3 jours ouvrables."
  actions:
    - variant: primary
      text: Demander un partenariat
      href: /contact
    - text: Voir nos produits
      href: /products
