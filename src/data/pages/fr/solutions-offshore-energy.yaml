content_challenge:
  tagline: Le défi
  title: Demandes d'énergie offshore<br />Fiabilité dans les environnements extrêmes
  subtitle: 'Les opérations énergétiques offshore poussent les équipements à leurs limites : conditions météorologiques extrêmes, sites éloignés, cycles de service continus et tolérance zéro en cas de panne.'
  paragraphs:
    - L'industrie de l'énergie offshore opère dans les environnements marins les plus exigeants de la planète. Les bateaux de travail soutiennent les plateformes pétrolières et gazières, les installations d'éoliennes en mer, les opérations de câbles sous-marins et les projets de construction marine — souvent en pleine mer, dans des fenêtres météo limitées. Une défaillance d'équipement n'est pas seulement coûteuse, elle est dangereuse.
    - '**La sécurité est la priorité absolue** — Les navires de transfert de personnel doivent opérer en toute sécurité dans des états de mer qui arrêteraient toute autre opération. La stabilité au moment du transfert, la fiabilité des moteurs par tous les temps et une construction robuste pour les amarrages répétés contre les structures offshore sont des exigences incontournables.'
    - '**La capacité tous temps est essentielle** — Les parcs éoliens offshore et les plateformes pétrolières fonctionnent toute l''année. Les bateaux de travail doivent performer dans des mers fortes, des vents violents et une visibilité réduite. Les opérations de jour comme de nuit exigent des équipements de navigation complets et des systèmes d''éclairage fiables.'
    - '**Le secteur de l''éolien offshore croît rapidement** — Des milliers de nouvelles turbines sont installées dans le monde, chacune exigeant des transferts réguliers de personnel, du transport d''outillage et un soutien de maintenance. Cela crée une demande soutenue pour des navires de transfert de personnel (CTV) et des RIB de soutien spécialement conçus.'
    - Les RIB pour l'énergie offshore d'Paddle Board Overstock sont conçus avec des coques deep-V renforcées, des tubes Hypalon ultra-résistants, des équipements de navigation complets et des systèmes de sécurité adaptés aux conditions extrêmes des opérations d'énergie offshore.
content_solution:
  tagline: Notre solution
  title: RIB offshore spécialement conçus<br />Pour le secteur de l'énergie
  subtitle: Chaque RIB d'énergie offshore Paddle Board Overstock est conçu pour un fonctionnement sûr et fiable dans des conditions marines extrêmes, de la mer du Nord à l'Asie du Sud-Est.
  list:
    - Coque deep-V renforcée pour des performances en eau agitée et une maniabilité prévisible
    - Tubes Hypalon ultra-résistants avec résistance aux UV et aux produits chimiques pour un service offshore prolongé
    - Quincaillerie en acier inoxydable 316 — aucune corrosion en exposition continue à l'eau de mer
    - 'Équipement de navigation complet : GPS, radar, VHF, feux de navigation nocturne — en standard sur les modèles offshore'
    - Pont autovideur pour une exploitation sûre dans les conditions de mer embarquante
    - Configurations moteurs multiples — simple ou double hors-bord pour la redondance de mission
    - Mât de remorquage et taquets ultra-résistants pour la manutention des plateformes et des bouées
    - Couleurs de tubes haute visibilité pour l'identification sur les chantiers offshore
content_segments:
  tagline: Profils énergétiques
  title: Solutions énergétiques offshore<br />Par type d'application
  subtitle: Différents secteurs de l’énergie offshore ont des exigences uniques en matière de bateaux de travail – des RIB de support de plate-forme aux CTV de parcs éoliens en passant par les navires d’inspection sous-marins.
  items:
    - title: Prise en charge des plates-formes pétrolières et gazières offshore
      subtitle: Transfert d'équipage, fourniture de matériel, veille sécurité de la plateforme
      description: Les plates-formes pétrolières et gazières nécessitent un changement d’équipage quotidien, un transport d’équipements et de fournitures ainsi qu’une couverture de sécurité. Les bateaux de travail doivent opérer en toute sécurité autour des structures de plate-forme, dans des courants forts et des états de mer variables, et maintenir un maintien précis en position pendant le transfert du personnel via une échelle ou une passerelle. L'environnement extrême (hydrocarbures, produits chimiques, brouillard salin constant) exige une construction résistante à la corrosion et des performances fiables.
      features:
        - Configuration de transfert de personnel avec accès d'embarquement sûr et mains courantes
        - Tubes Hypalon anticorrosion et quincaillerie en acier inoxydable 316
        - Bourrelets de protection renforcés pour les contacts fréquents avec les défenses de plateforme
        - Pont autovideur pour eaux huileuses et rinçage chimique
        - Réservoir de carburant haute capacité pour un rayon d'action offshore étendu
        - Option bimoteur pour une redondance critique de mission
    - title: Exploitation de parcs éoliens offshore
      subtitle: Transfert d'équipage, maintenance turbine, transport outillage
      description: "L’éolien offshore est le secteur de l’énergie marine qui connaît la croissance la plus rapide. Les opérateurs ont besoin de navires de transfert d'équipage (CTV) capables de transférer en toute sécurité les techniciens vers les plates-formes d'accès aux turbines dans des états de mer allant jusqu'à 1,5 m de hauteur de vague significative. La stabilité pendant le transfert, la capacité par tous les temps et un fonctionnement quotidien fiable sont essentiels. Les navires de service des parcs éoliens fonctionnent selon des horaires serrés : tout temps d'arrêt retarde la mise en service ou la maintenance des turbines, affectant directement les revenus de production d'énergie."
      features:
        - Forme de coque optimisée pour un transfert stable du personnel à la base des turbines
        - Entrée deep-V pour un confort de navigation dans les clapots et les houles offshore
        - Protection météo complète — console fermée ou timonerie pour le confort de l'équipage
        - Espace de pont pour l'outillage, les pièces détachées et le matériel de service
        - Pack opérations de nuit pour les quarts d'hiver limités par la lumière du jour
        - Fonctionnement hors-bord silencieux pour un impact sonore minimal sur l'environnement marin
    - title: Assistance pour câbles et pipelines sous-marins
      subtitle: Inspection, maintenance, support ROV, enquête
      description: Les opérateurs de câbles et de pipelines sous-marins ont besoin de bateaux de travail pour l'inspection des itinéraires, l'assistance à la maintenance, les opérations ROV et les tâches d'enquête. Ces navires nécessitent des plates-formes stables pour déployer et récupérer les équipements sous-marins, des manœuvres précises pour le suivi des câbles et un fonctionnement fiable dans les environnements côtiers et offshore. La stabilité du bateau est essentielle à la précision du sonar et de l’équipement d’arpentage.
      features:
        - Plateforme stable à basse vitesse pour le suivi de câbles et les opérations d'inspection
        - Aménagement de pont ouvert pour le déploiement de ROV, les tourets de câbles et le matériel d'inspection
        - Platines de fixation d'équipements pour sonar, GPS et instrumentation d'inspection
        - Conception de coque à faible sillage pour une perturbation minimale des fonds marins pendant l'inspection
        - Manœuvres précises à basse vitesse avec une direction hors-bord réactive
    - title: Ingénierie maritime et soutien à la construction
      subtitle: Transport de personnel, approvisionnement en matériel, accompagnement en plongée
      description: Les entrepreneurs en ingénierie maritime travaillant sur des projets de construction portuaire, de protection côtière et d'installation en mer ont besoin de bateaux de travail polyvalents pour le transport du personnel entre les navires de construction et le rivage, la fourniture de matériaux et d'outils, l'assistance à la plongée et les études de site. Ces bateaux opèrent dans des zones de construction actives avec plusieurs navires, un espace de manœuvre restreint et des conditions de mer variables. La durabilité et la polyvalence sont primordiales.
      features:
        - Aménagement de pont polyvalent pour le personnel, les matériaux et l'équipement de plongée
        - Échelle de plongée et fixations d'équipement pour les opérations de soutien à la plongée
        - Taquets ultra-résistants et mât de remorquage pour les manœuvres sur les chantiers de construction
        - Construction Hypalon robuste résistante aux débris de chantier et à l'abrasion
        - Configurations de sièges modulables — mode transport de personnel ou cargo
