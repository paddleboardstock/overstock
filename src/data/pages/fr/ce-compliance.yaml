content_scope:
  tagline: Portée de conformité
  title: Quels produits doivent être<br />conformes aux RCD ?
  subtitle: La directive 2013/53/UE sur les bateaux de plaisance s'applique aux bateaux de plaisance dont la longueur de coque est comprise entre 2,5 m et 24 m. Comprendre la portée est la première étape vers la conformité.
  items:
    - title: Bateaux semi-rigides (2,5 à 24 m)
      description: Les bateaux pneumatiques rigides dont la coque mesure entre 2,5 m et 24 m relèvent du RCD. Les catégories de conception A à D s'appliquent en fonction des conditions de mer prévues et de la force maximale du vent.
      icon: tabler:sailboat
    - title: Bateaux pneumatiques (moins de 2,5 m)
      description: Les petits bateaux pneumatiques et canots pneumatiques de moins de 2,5 m peuvent être partiellement exemptés du RCD mais nécessitent toujours le marquage CE en vertu d'autres directives applicables et des normes de construction EN ISO 6185.
      icon: tabler:sailboat
    - title: Planches et accessoires SUP
      description: Les planches de stand-up paddle ne relèvent pas du champ d'application du RCD. Cependant, les dispositifs de flottaison individuels (VFI) associés nécessitent le marquage CE en vertu du règlement EPI (UE) 2016/425 avec l'approbation USCG Type III/V, le cas échéant.
      icon: tabler:swimming
    - title: Bateaux partiellement terminés
      description: Les bateaux livrés sans moteur ni installations spécifiques nécessitent une déclaration du constructeur pour les embarcations partiellement achevées, avec une conformité totale au RCD complétée par le constructeur final ou l'importateur.
      icon: tabler:tool
content_trust_layers:
  tagline: Système de confiance à trois niveaux
  title: Informations de conformité<br /> — Partagées au bon niveau
  subtitle: Toutes les données de conformité n’appartiennent pas à un site Web public. Nous suivons une approche à trois niveaux qui protège la propriété intellectuelle tout en renforçant la confiance des acheteurs.
  items:
    - title: Couche 1 – Site Web public
      description: Normes référencées, parcours de conformité expliqués, types de documents répertoriés, périmètre de certification par famille de modèles. Pas de certificats réels, de données de test ou de détails techniques exclusifs.
      icon: tabler:world
    - title: Couche 2 – Partage post-enquête
      description: "Après une enquête qualifiée : échantillon DoC expurgé, photo de la plaque du constructeur, liste des normes applicables, liste de contrôle de conformité et résumés de certification des matériaux – partagés selon des conditions d'utilisation équitable."
      icon: tabler:mail
    - title: Couche 3 – NDA / Étape de commande
      description: Dossier technique complet, évaluations des risques, calculs de stabilité, rapports de tests, enregistrements de lots de matériaux et documentation de traçabilité de la production – partagés uniquement sous NDA avec les acheteurs confirmés.
      icon: tabler:lock
content_standards:
  tagline: Normes applicables
  title: Normes ISO et EN<br />Nous construisons selon
  subtitle: Nos produits sont conçus et testés par rapport aux normes harmonisées du RCD. Les numéros et noms standards sont référencés ; les textes standards complets restent protégés par le droit d'auteur ISO.
  items:
    - title: EN ISO 6185-3
      description: "Bateaux pneumatiques — Partie 3 : Bateaux d'une puissance motrice maximale de 15 kW ou plus. Exigences en matière de construction, de stabilité, de flottabilité et de récupération d'un homme à la mer pour les RIB."
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: "Bateaux pneumatiques — Partie 4 : Bateaux d'une puissance motrice maximale de 15 kW et supérieure ou égale à 4,5 kW. Exigences supplémentaires en matière de structure et de stabilité."
      icon: tabler:file-text
    - title: Série ISO 12215
      description: Petites embarcations — Construction de coque et échantillonnages. Conception structurelle de la coque, du pont et des cloisons pour les coques RIB en fibre de verre et en aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Petite embarcation — Manuel du propriétaire. Contenu et format requis pour le manuel du propriétaire accompagnant chaque bateau RIB livré dans l'UE.
      icon: tabler:book
    - title: EN ISO 14945
      description: Petite embarcation — Plaque du constructeur. Informations à marquer sur la plaque du constructeur fixée en permanence sur chaque embarcation.
      icon: tabler:badge
    - title: OIN 8666
      description: Petites embarcations — Données principales. Mesures et paramètres standardisés pour des spécifications cohérentes dans toute la documentation produit.
      icon: tabler:dimensions
content_process:
  tagline: Processus de conformité
  title: Conformité CE en 6 étapes<br />Flux de travail
  subtitle: De la portée du projet à la traçabilité au niveau série, chaque modèle RIB suit un chemin de conformité défini.
  steps:
    - number: '01'
      title: Portée et classification du projet
      description: Définissez le modèle RIB, la catégorie de conception (A/B/C/D), le nombre maximum de personnes, la charge utile, la puissance du moteur et le marché cible. Déterminez si le RCD s’applique et quel module d’évaluation de la conformité est requis.
      timeline: 2 à 3 jours
    - number: '02'
      title: Identification des exigences applicables
      description: Identifiez toutes les exigences essentielles de sécurité applicables de l'annexe I du RCD, les normes harmonisées pertinentes (EN ISO 6185, 12215, 10240, 14945) et toutes les exigences nationales supplémentaires pour le marché cible.
      timeline: 3 à 5 jours
    - number: '03'
      title: Conception et documentation technique
      description: "Créer le dossier technique principal : dessins d'agencement général, calculs de stabilité et de flottabilité, évaluation des risques, spécifications des matériaux et analyse de la sécurité des systèmes (carburant, électrique, direction)."
      timeline: 10 à 15 jours
    - number: '04'
      title: Vérification et tests du produit
      description: 'Effectuer une vérification physique : tests de pression à 1,25 fois la pression nominale pendant 24 à 48 heures, tests de stabilité et de flottabilité, tests de charge et mise en service des systèmes. Enregistrez tous les résultats des tests par coque.'
      timeline: 5 à 7 jours
    - number: '05'
      title: Documentation de marquage et de livraison
      description: Apposer le marquage CE, la plaque constructeur (EN ISO 14945) et le HIN/CIN (numéro d'identification de la coque). Préparez la déclaration de conformité UE, le manuel du propriétaire (EN ISO 10240) et la liste de contrôle de conformité.
      timeline: 2 à 3 jours
    - number: '06'
      title: Traçabilité au niveau série
      description: Chaque coque reçoit un enregistrement de coque unique le reliant au dossier technique principal, au lot de production, aux certificats de matériaux, aux résultats des tests et à la configuration finale. Dossiers conservés pendant plus de 10 ans par RCD.
      timeline: En cours
content_document_cards:
  tagline: Types de documents
  title: Document de conformité<br />Cartes
  subtitle: Ce sont les types de documents que nous préparons et maintenons pour chaque modèle RIB certifié CE. Des échantillons sont disponibles sur demande qualifiée.
  items:
    - title: Certificat de conformité CE/RCD
      description: Certificat spécifique au modèle confirmant que l'engin répond à toutes les exigences essentielles de sécurité applicables du RCD 2013/53/UE, délivré par le fabricant avec la participation d'un organisme notifié si nécessaire.
      icon: tabler:certificate
    - title: Déclaration de conformité UE (DoC)
      description: Déclaration signée par le fabricant ou son représentant autorisé, répertoriant les directives, normes, modules de conformité et détails de l'organisme notifié applicables. Obligatoire pour chaque modèle mis sur le marché de l’UE.
      icon: tabler:file-check
    - title: Plaque constructeur (EN ISO 14945)
      description: Plaque apposée en permanence indiquant le nombre maximum de personnes, la puissance maximale du moteur, la catégorie de conception et l'identification du fabricant. Doit rester lisible pendant toute la durée de vie de l'engin.
      icon: tabler:badge
    - title: Manuel du propriétaire (EN ISO 10240)
      description: Manuel complet couvrant un fonctionnement sûr, les procédures d'urgence, les calendriers de maintenance et les avertissements de sécurité. Obligatoire pour tout RIB livré dans l'UE.
      icon: tabler:book
    - title: Rapports de test et d'inspection ISO
      description: Dossiers d'essais de pression (1,25x/24-48 h), résultats d'essais de stabilité et de flottabilité, certificats d'essais de matériaux et rapports de vérification dimensionnelle, tous liés à des numéros de coque spécifiques.
      icon: tabler:test-pipe
    - title: Dossiers de traçabilité des matériaux
      description: Traçabilité au niveau des lots pour le tissu tubulaire, les adhésifs, la fibre de verre et le matériel. Relie chaque unité de production aux certificats de matériaux entrants et aux résultats d’inspection IQC.
      icon: tabler:link
    - title: Inspection de la qualité et dossiers de contrôle qualité
      description: Liste de contrôle qualité en 100 points par unité, enregistrements de contrôle qualité en cours de processus, rapports de non-conformité et actions correctives. Fait partie de la chaîne de traçabilité de la production.
      icon: tabler:clipboard-check
    - title: Pack de documents de projet
      description: Ensemble de documentation par coque comprenant l'enregistrement de configuration finale, les détails d'installation du moteur et de l'équipement, la liste de contrôle de mise en service et la documentation de livraison.
      icon: tabler:package
content_design_categories:
  tagline: Catégories de conception de RCD
  title: Catégories de conception A à D<br /> – Ce qu'elles signifient
  subtitle: Le RCD attribue des catégories de conception en fonction de la force maximale du vent et de la hauteur de vague significative pour laquelle l'engin est conçu pour résister.
  items:
    - title: Catégorie A — Océan
      description: Conçu pour les voyages prolongés où la force du vent peut dépasser Beaufort 8 (> 40 nœuds) et la hauteur significative des vagues peut dépasser 4 m. Nécessite la vérification structurelle et de stabilité la plus rigoureuse.
      icon: tabler:ripple
    - title: Catégorie B – Offshore
      description: Conçu pour les voyages au large avec une force de vent jusqu'à Beaufort 8 (≤40 nœuds) et une hauteur de vague importante jusqu'à 4 m. Convient aux eaux côtières et semi-exposées.
      icon: tabler:anchor
    - title: Catégorie C — Côtier
      description: Conçu pour les voyages côtiers avec une force de vent jusqu'à Beaufort 6 (≤27 nœuds) et une hauteur de vague importante jusqu'à 2 m. La plupart des RIB récréatifs entrent dans cette catégorie.
      icon: tabler:sun
    - title: Catégorie D — Abrité
      description: Conçu pour les eaux abritées avec une force de vent allant jusqu'à Beaufort 4 (≤16 nœuds) et une hauteur de vague importante jusqu'à 0,3 m. Lacs, rivières et ports protégés.
      icon: tabler:pool
content_hin:
  tagline: Identification de l'artisanat
  title: Plaque HIN/CIN & Constructeur
  subtitle: Chaque bateau RIB nécessite un numéro d'identification de coque (HIN) ou un numéro d'identification de métier (CIN) et une plaque de constructeur conformément aux exigences de la norme EN ISO 14945 et du RCD.
  items:
    - title: Numéro d'identification de coque (HIN)
      description: Un code unique de 14 caractères marqué en permanence sur le côté tribord du tableau arrière, codant le code du fabricant (MIC), l'année modèle, l'année de production et le numéro de série. Requis pour l’entrée sur le marché de l’UE.
      icon: tabler:hash
    - title: Numéro d'identification de l'artisanat (CIN)
      description: Conformément à la norme EN ISO 10087, un numéro d'identification secondaire caché placé dans un endroit dissimulé à des fins antivol et de traçabilité.
      icon: tabler:eye-off
    - title: Contenu de la plaque du constructeur
      description: Nombre maximum de personnes, puissance maximale du moteur (kW), charge maximale (kg), catégorie de conception, nom du fabricant et marquage CE, le tout affiché en permanence sur une plaque résistante à la corrosion.
      icon: tabler:badge
content_tech_file:
  tagline: Structure du dossier technique
  title: Dossier technique principal<br />et dossier de coque
  subtitle: 'Notre système de documentation suit une structure à deux niveaux : le dossier technique principal pour chaque famille de modèles et les dossiers de coque individuels pour chaque bateau produit.'
  items:
    - title: Dossier Technique Maître
      description: "Contient la documentation complète de conformité pour une famille de modèles : disposition générale, évaluation des risques, calculs de stabilité/flottabilité, spécifications des matériaux, normes applicables et dossiers d'évaluation de la conformité. Conservé pendant plus de 10 ans."
      icon: tabler:folder
    - title: Dossier de coque (traçabilité par bateau)
      description: 'Chaque coque possède un enregistrement unique la reliant au dossier technique principal : HIN, date de production, lot de tubes, certificats de matériaux, résultat des tests de pression, configuration finale, installation du moteur et destination de livraison.'
      icon: tabler:file-description
    - title: Pack Conformité Client
      description: Contenu de livraison par coque comprenant la DoC, la photo de la plaque du constructeur, le manuel du propriétaire, le résumé des tests et la feuille de configuration finale — fourni avec chaque RIB expédié vers l'UE.
      icon: tabler:package
content_material_cert:
  tagline: Certification des matériaux
  title: Traçabilité des matériaux &<br />preuves de certification
  subtitle: >-
    Les RIB de qualité commencent par des matériaux contrôlés et des processus documentés. Voici
    comment nous organisons la certification des matériaux pour chaque groupe de composants
    critiques.
  items:
    - title: Traçabilité des matériaux de tubes gonflables
      description: >-
        Les matériaux de tubes PVC et CSM/Hypalon sont sélectionnés selon l'usage prévu, les
        conditions climatiques et le marché cible. Fiches techniques fournisseur (TDS), informations
        de lot matière, traçabilité des rouleaux de tissu, rapports d'essais UV et de vieillissement
        ainsi que déclarations REACH/SVHC sont disponibles dans le périmètre documentaire convenu par
        projet.
      icon: tabler:circle
    - title: Traçabilité de l'aluminium marin
      description: >-
        Pour les projets de RIB à coque aluminium, la nuance d'alliage, l'épaisseur et les lots
        matière sont contrôlés selon la spécification approuvée. Certificats matière (MTC/MTR),
        documentation EN 10204 3.1, rapports de composition chimique et de propriétés mécaniques et
        traçabilité colada/lot sont fournis selon les termes convenus.
      icon: tabler:rectangle
    - title: Coque GRP — contrôle des matériaux et des processus
      description: >-
        Pour les RIB à coque polyester, le gelcoat, la résine, les renforts en fibre de verre et les
        matériaux d'âme sont gérés via des spécifications contrôlées. TDS/SDS des matériaux,
        enregistrements de lots, spécifications de stratification et registres de polymérisation et
        de contrôle atelier sont disponibles sur accord de projet.
      icon: tabler:layers-subtract
    - title: Appui documentaire aux composants
      description: >-
        Pour les composants sélectionnés — matériaux de pont EVA, assises, quincaillerie inox,
        systèmes carburant, équipements électriques et accessoires marins — la documentation
        fournisseur applicable est coordonnée selon la configuration finale et les exigences du
        marché de destination.
      icon: tabler:package
    - title: Avis sur le périmètre de conformité
      description: >-
        Certificats, rapports d'essais et documents de conformité s'appliquent uniquement au modèle
        de produit, au matériau, au composant, au lot de production ou au périmètre de projet indiqué
        dans le document concerné. Contactez-nous avec votre marché cible, l'usage prévu et les
        exigences techniques afin de confirmer le dossier documentaire applicable avant la commande.
      icon: tabler:info-circle

faq:
  title: Conformité CE – Foire aux questions
  questions:
    - q: Tous les bateaux Paddle Board Overstock RIB sont-ils certifiés CE pour le marché de l'UE ?
      a: Les bateaux RIB de notre catalogue sont conçus et documentés pour être conformes au RCD 2013/53/UE conformément aux directives européennes applicables. Le marquage CE s'applique par modèle et par configuration. Contactez-nous pour obtenir un document de portée de conformité spécifique au modèle.
    - q: Quelle est la différence entre la conformité RCD et le marquage CE ?
      a: La RCD (Directive sur les bateaux de plaisance 2013/53/UE) est la législation européenne qui fixe les exigences essentielles de sécurité. Le marquage CE est le symbole visuel apposé sur un produit qui a été évalué et confirmé comme répondant à ces exigences. Un produit doit être conforme au RCD avant de pouvoir porter le marquage CE.
    - q: Fournissez-vous des déclarations de conformité avec chaque bateau ?
      a: Oui. Chaque bateau RIB livré sur le marché de l'UE comprend une déclaration de conformité UE spécifique au modèle répertoriant les directives applicables, les normes harmonisées, le module d'évaluation de la conformité et les détails de l'organisme notifié.
    - q: Quel module d’évaluation de la conformité Paddle Board Overstock utilise-t-il ?
      a: Le module dépend de la catégorie de conception et du type de bateau. La plupart des modèles RIB de la catégorie de conception C utilisent le module A (contrôle de production interne). Pour les bateaux de catégorie de conception A/B ou les configurations spécifiques, le module B+C ou B+D peut s'appliquer avec la participation d'un organisme notifié. Nous vous conseillons sur le module approprié par projet.
    - q: Pouvez-vous partager la documentation de conformité avant de passer une commande ?
      a: Après une demande qualifiée, nous partageons un document de portée de conformité répertoriant les normes applicables, la voie de conformité et les types de documents disponibles pour le modèle que vous évaluez. Les fichiers techniques complets sont partagés sous NDA après confirmation de commande.
    - q: Qu'est-ce qu'un numéro d'identification de coque (HIN) et est-il inclus ?
      a: Le HIN est un identifiant unique de 14 caractères marqué en permanence sur chaque bateau, codant le code du fabricant (MIC), la désignation du modèle, l'année de production et le numéro de série. Il est obligatoire pour tous les bateaux RIB mis sur le marché de l'UE et est inclus sur chaque RIB Paddle Board Overstock.
    - q: Combien de temps les dossiers techniques sont-ils conservés ?
      a: Conformément aux exigences du RCD 2013/53/UE, le fabricant doit conserver le dossier technique pendant au moins 10 ans à compter de la dernière date de mise sur le marché du produit. Paddle Board Overstock maintient une documentation technique complète pour tous les modèles produits.
    - q: Aidez-vous les importateurs à respecter leurs obligations en vertu du RCD ?
      a: "Oui. Nous fournissons le dossier de documentation dont les importateurs de l'UE ont besoin pour remplir leurs obligations : accès aux dossiers techniques, DoC, plaque du constructeur, manuel du propriétaire et enregistrements de traçabilité des produits. Les responsabilités des importateurs en vertu du RCD sont clairement documentées dans notre guide de conformité."
