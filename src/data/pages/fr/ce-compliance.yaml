hero:
  tagline: Conformité CE et RCD
  title: Conformité CE des bateaux RIB<br />& documentation technique
  subtitle: Les bateaux Paddle Board Overstock RIB et les motomarines gonflables sont conçus et documentés pour être conformes au marché de l'UE en vertu de la directive sur les bateaux de plaisance 2013/53/UE. De l'évaluation des risques à la déclaration de conformité, nous fournissons une documentation de conformité spécifique au modèle pour chaque coque.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Documentation et certification de conformité CE pour bateau RIB
direct_answer: Paddle Board Overstock fournit une documentation de conformité RCD 2013/53/UE spécifique au modèle pour les bateaux RIB et les motomarines pneumatiques, y compris des fichiers techniques, des déclarations de conformité, des plaques de constructeur et des manuels du propriétaire, tous alignés sur les normes EN ISO 6185, ISO 12217 et les normes harmonisées applicables.
