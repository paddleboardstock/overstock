hero:
  tagline: Certifications et Normes
  title: 'Certifications de Qualité<br />et Normes de Conformité'
  subtitle: "Les produits Paddle Board Overstock sont fabriqués conformément aux normes internationales de sécurité maritime, aux systèmes de gestion de la qualité et aux réglementations environnementales."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Certifications de qualité Paddle Board Overstock et documentation de conformité
content_certifications:
  tagline: Nos Certifications
  title: 'Qualité Certifiée,<br />Reconnue Mondialement'
  subtitle: "64 modèles certifiés CE et des certifications à l'échelle de l'usine démontrent notre engagement envers la qualité, la sécurité et la responsabilité environnementale."
  items:
    - title: 'Certifié CE'
      description: "64 modèles certifiés CE sont conformes aux exigences de marquage CE européen pour les embarcations de loisir, garantissant le respect des normes de sécurité, de santé et de protection de l'environnement."
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: "Notre système de gestion de la qualité est certifié ISO 9001:2015, couvrant la conception, la fabrication et la distribution d'embarcations gonflables et d'équipements marins."
      icon: tabler:clipboard-check
    - title: 'Marqué UKCA'
      description: "Les produits vendus sur le marché britannique portent le marquage UKCA, confirmant la conformité aux réglementations du Royaume-Uni pour les équipements marins et les embarcations de plaisance."
      icon: tabler:shield
    - title: 'Conforme BSCI'
      description: "Paddle Board Overstock est audité selon BSCI (Business Social Compliance Initiative), démontrant des pratiques de fabrication éthiques, des conditions de travail équitables et une responsabilité de la chaîne d'approvisionnement."
      icon: tabler:heart-handshake
    - title: 'Conforme REACH'
      description: "Tous les matériaux utilisés dans les produits Paddle Board Overstock sont conformes au règlement européen REACH sur la sécurité chimique, garantissant l'absence de substances restreintes dans notre PVC, notre Hypalon ou nos composants."
      icon: tabler:flask
    - title: 'Essais de Matériaux'
      description: "Les tissus sont testés pour la résistance à la traction, la résistance à la déchirure, la dégradation aux UV et la performance au froid. Chaque lot de production est échantillonné et vérifié."
      icon: tabler:test-pipe
content_factory:
  tagline: Normes d'Usine
  title: 'Excellence de Fabrication<br />— Construite selon Spécification'
  subtitle: "Notre installation de 12 000 m² fonctionne selon des protocoles de contrôle qualité stricts à chaque étape de la production."
  list:
    - 'Inspection des Matériaux Entrants : Toutes les matières premières — tissu PVC, Hypalon, aluminium, contreplaqué, adhésifs — sont testées par rapport aux spécifications avant d''entrer en production.'
    - 'Contrôle Qualité en Cours de Fabrication : Chaque étape de production dispose de points de contrôle qualité documentés. La résistance des soudures, l''alignement des coutures, l''installation des valves et le couple de serrage sont vérifiés en ligne.'
    - "Essais de Pression : Chaque chambre gonflable est soumise à un essai de pression à 1,25× la pression nominale pendant 24-48 heures. Le taux de fuite doit être nul pour réussir l'essai."
    - "Inspection Finale : Les produits finis sont inspectés pour la précision dimensionnelle, la finition esthétique, la complétude des accessoires et l'intégrité de l'emballage avant expédition."
    - 'Traçabilité des Lots : Chaque produit porte un numéro de série lié aux registres de lot de production, permettant une traçabilité complète de la matière première au produit fini.'
content_safety:
  tagline: Normes de Sécurité Maritime
  title: 'La Sécurité d''Abord<br />— Conçue pour un Fonctionnement Fiable'
  subtitle: "Les produits Paddle Board Overstock sont conçus et testés pour répondre aux normes internationales de sécurité maritime pour un usage commercial et récréatif."
  items:
    - title: 'ISO 6185'
      description: "Les bateaux gonflables sont conformes aux normes ISO 6185 pour la construction, la stabilité, la flottabilité et la capacité de charge."
      icon: tabler:sailboat
    - title: 'Normes ABYC'
      description: "Les systèmes électriques et de carburant suivent les normes ABYC (American Boat & Yacht Council) pour une installation et un fonctionnement sûrs."
      icon: tabler:bolt
    - title: 'Conformité SOLAS'
      description: "Les équipements de sécurité et les dispositifs de sauvetage répondent aux exigences SOLAS (Safety of Life at Sea) lorsque cela s'applique."
      icon: tabler:lifebuoy
cta:
  title: 'Besoin de produits certifiés pour votre projet ?'
  subtitle: "Contactez notre équipe pour discuter des exigences de certification, de la documentation et de la conformité pour votre marché."
  actions:
    - variant: primary
      text: Demander les documents de certification
      href: /contact
    - text: Voir notre page qualité
      href: /quality
