testimonial:
  content: Paddle Board Overstock a conçu et équipé l'ensemble de notre programme d'activités de plage sur trois propriétés de resort. 120 SUPs, infrastructures de sécurité et formation du personnel — le tout livré en une seule expédition. La participation des clients aux activités nautiques a augmenté de 60 % lors de la première saison.
  name: Sophie St-Laurent
  title: Directeur de l'expérience client, Azure Bay Resorts — Phuket, Thaïlande
content_segments:
  tagline: Profils des stations
  title: Solutions d'hospitalité en bord de mer<br />Par type de propriété
  subtitle: Chaque propriété de villégiature a un profil de clientèle, une combinaison d'activités et un rythme opérationnel uniques – des éco-lodges de charme aux vastes complexes hôteliers de luxe en bord de mer. Nous concevons des programmes de sports nautiques adaptés à la catégorie de propriété et aux attentes des clients.
  items:
    - title: Resorts de luxe en bord de mer
      subtitle: Transferts VIP, activités nautiques, expérience client premium
      description: "Propriétés haut de gamme en bord de mer – Four Seasons, Aman et autres groupes de luxe similaires – où les sports nautiques sont un atout majeur pour les clients, générant des scores de satisfaction et des revenus accessoires. La flotte doit avoir un aspect haut de gamme, offrir une variété de groupes d'âge et de niveaux de compétence, et s'intégrer parfaitement aux systèmes de conciergerie et de réservation existants du complexe. Les attentes des clients en matière d'apparence sont extrêmement élevées : l'état et la présentation de l'équipement affectent directement les avis 5 étoiles."
      features:
        - Parc de SUPs de marque premium aux couleurs assorties des resorts
        - "Présentation prête pour les clients : couleurs assorties des resorts, logo et mise en scène de l'équipement"
        - Planches de la série artistique signature pour des expériences premium et des moments photo des clients
        - 'Infrastructure de sécurité intégrée : lignes de bouées, postes de sauveteurs, DAE'
        - "Gestion des revenus : modèles de tarification dynamique, formation à l'upsell, regroupement de forfaits"
    - title: Complexes hôteliers sur des îles privées
      subtitle: Activités aquatiques calmes et autonomes pour les invités
      description: 'Les complexes privés sur les îles opèrent dans des endroits isolés où la logistique est complexe et chaque livraison compte. Les activités aquatiques pour les visiteurs doivent être autonomes : un équipement qui se stocke de manière compacte, se gonfle à la demande, nécessite un entretien minimal et se présente parfaitement à l’arrivée des clients. Nous planifions des programmes de flotte autour des fenêtres d’hydravions et de fret maritime, et notre construction durable maintient les équipements prêts aux visiteurs pendant de longues saisons sans soutien du continent.'
      features:
        - Flotte compacte gonflable — navires et approvisionnements efficaces sur des îles isolées
        - Construction de qualité PVC commerciale pour un usage multisaison pour les invités
        - Entretien facile sur site avec kits de réparation inclus et conseils vidéo
        - Un branding personnalisé de station balnéaire assorti à l’esthétique de l’île
    - title: Resorts écologiques et au bord du lac
      subtitle: Expériences clients intégrées à la nature
      description: Des propriétés en bord de lac, des eco-lodges et des retraites nature proposant des activités aquatiques calmes et à faible impact qui complètent l’environnement naturel. L’équipement doit être non motorisé autant que possible, facile à ranger là où l’espace est limité, et silencieux à l’utilisation afin de préserver l’expérience ambiante de tous les invités.
      features:
        - SUP Flotte non motorisée dans une série d’art inspirée de la nature
        - Stations de gonflage silencieuses pour pompes électriques destinées à la demande aux invités
        - Matériaux et emballages écologiques alignés sur la durabilité
        - Les racks de stockage et les systèmes d’organisation portuaire comprenaient
    - title: Clubs de plage
      subtitle: Animation des invités et ambiance en bord de mer
      description: Les beach clubs offrent un environnement dynamique et visuel où l’équipement fait partie de l’ambiance. Ils ont besoin de paddles élégants pour les divertissements des invités, SUP de locations pour les activités en bord de mer, et d’équipements aussi élégants que le lieu lui-même. La flotte doit être facile à exploiter, résister à une utilisation quotidienne par des invités de niveaux de compétence variés, et être déployée rapidement aux heures de pointe.
      features:
        - Séries d’art SUPs emblématiques qui servent aussi de décoration de lieu
        - Flotte prête à la location SUP pour le divertissement des invités
        - Couleur personnalisée et image de marque correspondant à l’identité visuelle du beach club
        - Systèmes de lancement et de récupération rapides pour des opérations à forte rotation
        - UV- construction résistante pour une exposition quotidienne à l’eau salée
    - title: Clubs de membres privés et clubs nautiques
      subtitle: Sports nautiques membres et programmes exclusifs de pagaie
      description: Clubs privés où les sports nautiques sont un avantage pour les membres plutôt qu’un moteur de revenus. L’équipement doit répondre à des standards esthétiques plus élevés, être disponible à la demande pour les membres et nécessiter une supervision minimale du personnel. Les clubs nautiques de la marina utilisent SUP des flottes de marque pour les loisirs des membres autour du port. Le stockage et l’entretien doivent être invisibles pour les membres.
      features:
        - Flottes de marque premium SUP pour les sports nautiques membres
        - 'Équipement haut de gamme : EVA decks, couleurs personnalisées des membres, rembourrage de marque'
        - Système de paiement en libre-service pour l’accès des membres sans personnel
        - Stockage hors saison et programme annuel de renouvellement
    - title: Hôtels axés sur l'aventure et les activités
      subtitle: Visites guidées, SUP yoga, excursions de plongée en apnée, activités de groupe
      description: Propriétés se positionnant comme des destinations d'aventure - proposant des visites guidées, du SUP yoga, des pagaies au coucher du soleil, des excursions de plongée en apnée et des activités de groupe. La flotte doit prendre en charge à la fois les modèles de location gratuite et de programmes guidés, avec un équipement qui permet une transition transparente entre l'utilisation personnelle des clients et les visites guidées par un instructeur. Ces propriétés nécessitent des équipements durables pour un roulement à haute fréquence, avec un nettoyage facile entre les groupes de clients.
      features:
        - Flotte mixte polyvalente supportant des modèles de visite guidée en location +
        - Plateformes SUP extra-stables pour les activités de groupe
        - "Équipement du guide : planches d'instructeur, caissons étanches, communications étanches"
        - "Rotation saisonnière de l'équipement : flotte d'été → programme de stockage hivernal"
        - Construction durable conçue pour un usage quotidien par les invités avec un entretien minimal
