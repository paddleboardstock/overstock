hero:
  tagline: Hôtels, centres de villégiature et hospitalité
  title: Expériences premium au bord de l'eau<br />Pour hôtels, complexes hôteliers et clubs de yachting
  subtitle: Programmes de sports nautiques clés en main pour les hôtels en bord de mer, complexes sur îles privées, clubs de plage et clubs de yachting — de l'équipement pour les clients et les systèmes de sécurité à la formation du personnel et à la conception du programme.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock SUP planches pour les activités au bord de l'eau du complexe
direct_answer: Paddle Board Overstock collabore avec des hôtels, complexes hôteliers, îles privées, clubs de plage et clubs de yachting dans le monde entier pour créer des expériences premium au bord de l'eau. Nos solutions incluent des flottes de location SUP, du matériel pour visites guidées, des systèmes de sécurité complets et des équipements personnalisés pour chaque établissement. Chaque équipement peut être brandé avec le logo et les couleurs de votre établissement. Nous fournissons également la formation du personnel, la consultation pour la conception des programmes et la planification du remplacement des flottes afin de garantir une qualité constante tout au long des saisons.
solution_offerings:
  - title: Forfait Standard Complexe
    subtitle: Pour les propriétés de petite à moyenne taille (50 à 150 pièces)
    badge: Popular
    features:
      - title: Flotte invitée
        description: 20–50 SUPs avec les couleurs et logos du complexe
      - title: Infrastructure de sécurité
        description: Postes de secours, lignes de bouées, signalisation de sécurité et postes de premiers secours
      - title: Stockage et entretien
        description: Systèmes de racks, stations de gonflage et listes de contrôle d'inspection quotidienne
      - title: Formation du personnel
        description: Orientation sur place pour le personnel des activités sur la manipulation de l'équipement et la sécurité des invités
      - title: Prise en charge du lancement
        description: Playbook du programme avec modèles de tarification, formulaires de renonciation et calendriers d'activités
    cta_text: Concevez ma solution pour le complexe
    cta_href: /contact
  - title: Forfait Premium Complexe
    subtitle: Pour les propriétés de luxe et les opérations d’envergure
    badge: Premium
    features:
      - title: Flotte Premium
        description: 50–100+ SUPs avec personnalisation complète
      - title: Sécurité avancée
        description: Tours de secours, système radio, tableau de sauvetage, DEA et plan d'action d'urgence
      - title: Expérience client
        description: Borne d'enregistrement, exposition d'équipement, cabines pour se changer, stockage en bord de plage
      - title: Programme de revenus
        description: Guide de tarification dynamique, formation à la vente incitative, stratégies de regroupement de packages
      - title: Assistance saisonnière
        description: Stockage hors saison, contrôle de fin de saison, commande de rafraîchissement
    cta_text: Améliorez l'expérience du resort
    cta_href: /contact
