testimonial:
  content: Aquafarer a conçu et équipé l'ensemble de notre programme d'activités de plage dans trois propriétés de villégiature. 80 SUP, 40 kayaks, une infrastructure de sécurité et une formation du personnel, le tout livré en un seul envoi. La participation de nos invités aux activités nautiques a augmenté de 60 % dès la première saison.
  name: Sophie St-Laurent
  title: Directeur de l'expérience client, Azure Bay Resorts — Phuket, Thaïlande
content_segments:
  tagline: Profils des stations
  title: Solutions d'accueil au bord de l'eau<br />Par type de propriété
  subtitle: Chaque propriété de villégiature a un profil de clientèle, une combinaison d'activités et un rythme opérationnel uniques – des éco-lodges de charme aux vastes complexes hôteliers de luxe en bord de mer. Nous concevons des programmes de sports nautiques adaptés à la catégorie de propriété et aux attentes des clients.
  items:
    - title: Resorts de luxe en bord de mer
      subtitle: Transferts VIP, activités nautiques, expérience client premium
      description: "Propriétés haut de gamme en bord de mer – Four Seasons, Aman et autres groupes de luxe similaires – où les sports nautiques sont un atout majeur pour les clients, générant des scores de satisfaction et des revenus accessoires. La flotte doit avoir un aspect haut de gamme, offrir une variété de groupes d'âge et de niveaux de compétence, et s'intégrer parfaitement aux systèmes de conciergerie et de réservation existants du complexe. Les attentes des clients en matière d'apparence sont extrêmement élevées : l'état et la présentation de l'équipement affectent directement les avis 5 étoiles."
      features:
        - 'Flotte premium de marque : SUP, kayaks, pédalos et petites annexes RIB'
        - 'Présentation prête pour les clients : couleurs assorties à la station, personnalisation au logo, mise en scène de l''équipement'
        - Petit RIB de luxe pour les transferts de clients VIP avec sellerie personnalisée et coloris assortis
        - 'Infrastructure de sécurité intégrée : lignes de bouées, postes de secours, DEA'
        - 'Gestion des revenus : modèles de tarification dynamique, formation à la vente incitative, regroupement de packages'
    - title: Complexes hôteliers sur des îles privées
      subtitle: "Transport d'invités par tous les temps : zéro temps d'arrêt, fiabilité absolue"
      description: "Les complexes insulaires privés opèrent dans des endroits éloignés où le bateau est la seule connexion avec le continent. Les transferts quotidiens des clients, les approvisionnements et les évacuations médicales d'urgence dépendent d'un seul navire : tout temps d'arrêt a un impact direct sur l'expérience client et les opérations du complexe. Ces opérateurs ont besoin d'un bateau qui fonctionne de manière fiable dans toutes les conditions météorologiques, nécessite un minimum d'entretien et dispose de systèmes de secours pour une fiabilité essentielle à leur mission. Le bateau doit également être magnifiquement présenté lorsque les invités arrivent sur l'île."
      features:
        - Configuration RIB tout temps avec protection climatique complète et tubes renforcés
        - Prévision de moteurs jumelés ou d'un moteur de secours pour des opérations sans temps d'arrêt
        - Construction Hypalon de qualité commerciale pour une durée de vie de 5 à 8 ans en service dans des sites isolés
        - Conception à entretien facile avec composants accessibles pour la maintenance sur place
        - Branding de station personnalisé et sellerie haut de gamme en harmonie avec l'esthétique de l'île
    - title: Resorts écologiques et au bord du lac
      subtitle: Expériences clients intégrées à la nature
      description: Propriétés au bord du lac, écolodges et retraites naturelles proposant des activités nautiques calmes et à faible impact qui complètent l'environnement naturel. L'équipement doit être non motorisé dans la mesure du possible, facile à ranger dans des hangars à bateaux à espace limité et silencieux lors de son utilisation afin de préserver l'expérience ambiante de tous les invités.
      features:
        - 'Flotte non motorisée : SUP, kayaks, canoës et pédalos'
        - Stations de gonflage à pompe électrique silencieuse pour une utilisation par les clients à la demande
        - Matériaux et emballages écologiques alignés sur l'image de marque durable
        - Racks de stockage et systèmes d'organisation de hangar à bateaux inclus
    - title: Clubs de plage
      subtitle: Transferts invités, animations, petits RIB de luxe
      description: Les clubs de plage gèrent un environnement à haute énergie et visuellement axé où l'équipement fait partie de l'atmosphère. Ils ont besoin de petits semi-rigides de luxe pour les transferts des invités depuis les hôtels ou les quais à proximité, ainsi que de jouets aquatiques pour le divertissement des invités – remorquage de jet ski, toboggans gonflables et planches à pagaie. La flotte doit être élégante, facile à utiliser et résister à une utilisation quotidienne par des clients de différents niveaux de compétence. Le stockage et le déploiement rapide sont essentiels pendant les heures de pointe.
      features:
        - RIB de luxe compact (3,3-4,3 m) pour les transferts de clients et le service d'annexe
        - 'Jouets aquatiques : bouées tractables gonflables, planches de SUP, kayaks pour le divertissement des clients'
        - Couleur et personnalisation sur mesure accordées à l'identité visuelle du club de plage
        - Systèmes rapides de mise à l'eau et de récupération pour des opérations à fort roulement
        - Construction Hypalon durable pour une exposition quotidienne à l'eau salée et aux UV
    - title: Clubs de membres privés et clubs nautiques
      subtitle: Transport portuaire, appels d'offres, sports nautiques exclusifs
      description: Clubs privés où les sports nautiques et le transport par bateau constituent un avantage pour les membres plutôt qu'une source de revenus. L'équipement doit répondre à des normes esthétiques plus élevées, être disponible sur demande pour les membres et nécessiter une supervision minimale du personnel. Les clubs nautiques des marinas ont spécifiquement besoin d'appels d'offres pour le transport portuaire, c'est-à-dire pour déplacer les membres entre le quai, l'amarrage et le rivage. Le stockage et la maintenance doivent être invisibles pour les membres.
      features:
        - Annexes RIB haut de gamme pour le transport portuaire et le service de transfert des membres
        - 'Équipement premium : ponts EVA, couleurs de membres personnalisées, sellerie aux couleurs de la marque'
        - Système de retrait en libre-service pour l'accès des membres sans personnel
        - Stockage hors saison et programme de rafraîchissement annuel
    - title: Hôtels axés sur l'aventure et les activités
      subtitle: Visites guidées, SUP yoga, excursions de plongée en apnée, activités de groupe
      description: Propriétés se positionnant comme des destinations d'aventure - proposant des visites guidées, du SUP yoga, des pagaies au coucher du soleil, des excursions de plongée en apnée et des activités de groupe. La flotte doit prendre en charge à la fois les modèles de location gratuite et de programmes guidés, avec un équipement qui permet une transition transparente entre l'utilisation personnelle des clients et les visites guidées par un instructeur. Ces propriétés nécessitent des équipements durables pour un roulement à haute fréquence, avec un nettoyage facile entre les groupes de clients.
      features:
        - Flotte mixte polyvalente compatible avec les modèles de location + excursions guidées
        - Kayaks biplaces et plateformes SUP très stables pour les activités de groupe
        - 'Équipement d''encadrement : planches d''instructeur, coffres étanches, systèmes de communication imperméables'
        - 'Rotation saisonnière de l''équipement : flotte d''été → programme de stockage hivernal'
        - Construction durable conçue pour un usage quotidien par les clients avec un entretien minimal
