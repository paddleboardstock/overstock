hero:
  tagline: Hôtels, centres de villégiature et hospitalité
  title: Expériences haut de gamme au bord de l'eau<br />Pour les hôtels, centres de villégiature et clubs nautiques
  subtitle: Programmes de sports nautiques clé en main pour les hôtels en bord de mer, les complexes hôteliers sur des îles privées, les clubs de plage et les yacht clubs — depuis l'équipement des invités et les annexes RIB jusqu'aux systèmes de sécurité et à la formation du personnel.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Bateaux pneumatiques Aquafarer pour les activités au bord de l'eau en station
direct_answer: Aquafarer s'associe à des hôtels, des complexes hôteliers, des îles privées, des clubs de plage et des yacht clubs du monde entier pour créer des expériences au bord de l'eau haut de gamme. Nos solutions comprennent des flottes de location de SUP, des kayaks de visite guidée, des semi-rigides tendres pour le transport des invités, des petits semi-rigides de luxe pour les transferts des clubs de plage et des systèmes de sécurité complets. Chaque pièce d’équipement peut être marquée du logo et de la palette de couleurs de votre propriété. Nous proposons également une formation du personnel, des conseils en matière de conception de programmes et une planification du remplacement de la flotte pour garantir une qualité constante au fil des saisons.
solution_offerings:
  - title: Forfait Standard Complexe
    subtitle: Pour les propriétés de petite à moyenne taille (50 à 150 pièces)
    badge: Popular
    features:
      - title: Flotte invitée
        description: 20 à 50 SUP et kayaks aux couleurs et logos de la station
      - title: Infrastructure de sécurité
        description: Postes de secours, lignes de bouées, signalisation de sécurité et postes de premiers secours
      - title: Stockage et entretien
        description: Systèmes de racks, stations de gonflage et listes de contrôle d'inspection quotidienne
      - title: Formation du personnel
        description: Orientation sur place pour le personnel des activités sur la manipulation de l'équipement et la sécurité des invités
      - title: Prise en charge du lancement
        description: Playbook du programme avec modèles de tarification, formulaires de renonciation et calendriers d'activités
    cta_text: Concevoir ma solution de station
    cta_href: /contact
  - title: Forfait Premium Complexe
    subtitle: Pour les propriétés de luxe et les opérations d’envergure
    badge: Premium
    features:
      - title: Flotte Premium
        description: Plus de 50 à 100 SUP, kayaks, pédalos et semi-rigides avec personnalisation complète
      - title: Sécurité avancée
        description: Tours de secours, système radio, tableau de sauvetage, DEA et plan d'action d'urgence
      - title: Expérience client
        description: Borne d'enregistrement, exposition d'équipement, cabines pour se changer, stockage en bord de plage
      - title: Programme de revenus
        description: Guide de tarification dynamique, formation à la vente incitative, stratégies de regroupement de packages
      - title: Assistance saisonnière
        description: Stockage hors saison, contrôle de fin de saison, commande de rafraîchissement
    cta_text: Améliorer l'expérience de la station
    cta_href: /contact
