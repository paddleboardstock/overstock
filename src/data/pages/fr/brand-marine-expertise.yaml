hero:
  tagline: Expertise maritime
  title: Décennies de génie maritime<br />dans chaque plateau
  subtitle: Paddle Board Overstock combine science des matériaux approfondie, fabrication de précision et tests réels pour produire des cartes qui fonctionnent quand cela compte.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Équipe d’ingénierie marine et de R&D au travail
expertise_materials:
  tagline: Science des matériaux
  title: Choisir le bon matériau<br />pour chaque application
  subtitle: Nous travaillons avec trois matériaux clés — chacun sélectionné pour des cas d’usage spécifiques et des exigences de performance.
  columns: 3
  items:
    - title: Marine Grade PVC
      description: Tissu à 1100 deniers PVC — notre matériau le plus polyvalent. UV- Stabilisé, résistant à l’abrasion et éprouvé dans le temps. Idéal pour SUP les planches où le poids, la rigidité et l’efficacité des coûts comptent.
      icon: tabler:droplet
    - title: Drop-Stitch Noyau
      description: Des milliers de fils de polyester relient les couches de tissu supérieure et inférieure, permettant un gonflage à haute pression (15 PSI) pour une conduite rigide et stable qui se roule tout de même dans un sac à dos.
      icon: tabler:building-arch
    - title: EVA Mousse de terrasse
      description: La mousse rainurée et haute EVA densité offre une prise sur toute la longueur, un amorti pour les chutes et une toile pour nos decks signature de la série Art.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Capacités de fabrication
  title: Fabrication de précision<br />à chaque étape
  subtitle: Notre installation de 12 000 m² est équipée de machines spécialisées pour chaque étape de la production.
  columns: 2
  items:
    - title: CNC Coupe
      description: La découpe contrôlée par ordinateur garantit des panneaux en tissu précis et reproductibles avec un minimum de gaspillage. Chaque pièce s’ajuste exactement comme prévu.
      icon: tabler:cpu
    - title: Soudage à haute fréquence
      description: Le soudage industriel HF crée des joints plus solides que le matériau de base. Un contrôle constant de la température et de la pression assure des joints hermétiques à chaque cycle de production.
      icon: tabler:bolt
    - title: Assemblage du noyau à point tombant
      description: Des milliers de fils de polyester relient les couches de tissu supérieure et inférieure, permettant un gonflage à haute pression (15-20 PSI) pour SUP les planches et planches rigides et stables.
      icon: tabler:building-arch
    - title: Test de pression
      description: Chaque planche est testée en pression avant l’expédition, maintenue à 1,25 fois la pression nominale — si elle tient bon, elle fonctionnera sur l’eau.
      icon: tabler:wind
    - title: Essai de résistance des coutures
      description: Des échantillons aléatoires de chaque lot de production subissent des tests destructifs de résistance des joints. Les résultats sont consignés et traçables à des séries de production spécifiques.
      icon: tabler:files
    - title: Tests d’eau
      description: Chaque conception de planche subit des essais en eau réelle. Le pagayage dans des conditions côtières réelles valide les performances, la maniabilité et la stabilité.
      icon: tabler:ripple
expertise_design:
  tagline: Conception et ingénierie
  title: Conçu pour les conditions réelles
  subtitle: Notre philosophie de conception commence par la manière dont la planche sera utilisée — puis nous construisons l'ingénierie autour de ce cas d'utilisation.
  items:
    - title: Forme et contour de la planche
      description: La longueur, la largeur et le rocker sont ajustés en fonction de l'utilisation prévue de chaque modèle — des contours plus longs pour la glisse, des shapes plus larges pour la stabilité et le yoga.
    - title: Renforcement des rails et du stringer
      description: Les rails et stringers centraux renforcés ajoutent de la rigidité et absorbent les impacts — là où les planches subissent le plus d'usure saison après saison.
    - title: Disposition du pont et traction
      description: La zone de positionnement, l'emplacement des poignées, les fixations en D et les zones de traction sont conçus autour des postures réelles de pagayage — que ce soit en promenade, pour la pêche ou pour pratiquer le yoga.
    - title: Art et séries de couleurs
      description: Les œuvres sur le pont, les schémas de couleurs et les supports d'accessoires — chaque série est conçue pour correspondre à une personnalité de pagayage distincte.
cta:
  title: Vous avez une application spécifique en tête ?
  subtitle: Notre équipe peut vous aider à choisir la planche, la taille et l'équipement adaptés à votre style de pagayage.
  actions:
    - variant: primary
      text: Demandez à nos ingénieurs
      href: /contact
    - text: Voir la gamme de produits
      href: /products
