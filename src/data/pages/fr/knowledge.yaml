hero:
  tagline: Graphique des connaissances
  title: Connaissance de l'exploration de l'eau
  subtitle: |
    Une base de connaissances structurée couvrant la technologie des SUP gonflables,<br />
    sécurité de l'eau, ingénierie de planche et planification d'aventure.
  taglineSection: Explorez. Apprenez. Avancez avec confiance.
clusters:
  tagline: Groupes de connaissances
  title: Explorer par sujet
  subtitle: Plongées approfondies dans la technologie, la sécurité et les compétences derrière chaque produit Paddle Board Overstock.
  items:
    - title: SUP Connaissance
      description: De choisir votre première planche aux techniques de randonnée avancées — tout sur le stand-up paddle.
      icon: tabler:lifebuoy
      topics:
        - Comment choisir votre premier SUP gonflable
        - Meilleure taille de SUP pour les débutants
        - À quel point le paddle board est-il difficile ?
        - Comparaison entre planche gonflable et planche rigide
        - SUP liste de contrôle de sécurité
    - title: Technologie des cartes
      description: Analyses techniques approfondies sur les cœurs drop-stitch, les stratifiés PVC, les rails et les valves — comment les SUPs gonflables sont conçus.
      icon: tabler:anchor
      topics:
        - Comment les SUPs gonflables sont fabriqués
        - PVC couches de stratifié expliquées
        - Construction de rail et de couture
        - Drop-stitch exploration approfondie de la technologie
        - art de deck expliqué
    - title: Connaissances en matière de sécurité
      description: Connaissances essentielles en matière de sécurité pour chaque pagayeur — de la sélection de PFD à la lecture de la météo en passant par les techniques d'auto-sauvetage.
      icon: tabler:shield
      topics:
        - SUP liste de contrôle de sécurité
        - Avez-vous besoin d'un gilet de sauvetage ?
        - Guide de sécurité pour la pagaie en mer
        - Sécurité des rivières et des courants pour les pagayeurs
        - Sensibilisation aux conditions météorologiques et à l'état de l'eau
    - title: Technologie
      description: L'ingénierie derrière les produits Paddle Board Overstock — matériaux, méthodes de construction et tests de qualité.
      icon: tabler:microscope
      topics:
        - Technologie PVC de qualité marine
        - Explication du noyau Drop-stitch
        - Pourquoi PSI est important pour les SUPs gonflables
        - Soudage RF vs collage
        - Tests de qualité sur chaque planche
    - title: Connaissances sur les clubs et la location
      description: Guides pratiques pour gérer un programme SUP — des opérations de location aux flottes de stations et de clubs.
      icon: tabler:briefcase
      topics:
        - Comment démarrer une entreprise de location SUP
        - Construire une base nautique de villégiature
        - Dimensionnement de la flotte de paddle board pour les clubs
        - Gonflable vs dur SUP pour un usage commercial
        - Meilleures planches SUP pour les flottes de location
        - Stratégies de revenus des sports nautiques dans les stations balnéaires
        - Guide d'entretien des équipements commerciaux
