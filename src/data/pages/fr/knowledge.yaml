hero:
  tagline: Graphique de Connaissances
  title: Exploration des Connaissances Nautiques
  subtitle: |
    Une base de connaissances structurée couvrant la technologie SUP gonflable,<br />
    la sécurité nautique, l'ingénierie des bateaux et la planification d'aventures.
  taglineSection: Explorez. Apprenez. Partez en toute confiance.
clusters:
  tagline: Groupes de Connaissances
  title: Explorer par thème
  subtitle: Plongées approfondies dans la technologie, la sécurité et les compétences derrière chaque produit Paddle Board Overstock.
  items:
    - title: Connaissances SUP
      description: Du choix de votre première planche aux techniques de randonnée avancées — tout sur le stand-up paddle.
      icon: tabler:lifebuoy
      topics:
        - Comment choisir votre premier SUP gonflable
        - Meilleure taille de SUP pour débutants
        - Le paddle est-il difficile ?
        - Comparaison SUP gonflable vs rigide
        - Liste de sécurité SUP
    - title: Connaissances Bateaux
      description: Guides techniques sur les bateaux gonflables, RIBs, annexes et kayaks — ingénierie, matériaux et fonctionnement.
      icon: tabler:sailboat
      topics:
        - Types de bateaux gonflables expliqués
        - Comparaison PVC vs Hypalon
        - Comparaison RIB vs Annexe
        - Technologie drop-stitch approfondie
        - Guide des matériaux marins
    - title: Connaissances Sécurité
      description: Connaissances de sécurité essentielles pour chaque pagayeur — du choix du VFI à la lecture météo en passant par les techniques d'auto-sauvetage.
      icon: tabler:shield
      topics:
        - Liste de sécurité SUP
        - Avez-vous besoin d'un gilet de sauvetage ?
        - Guide de sécurité en pagayage océanique
        - Sécurité en rivière pour kayaks gonflables
        - Connaissance des conditions météo et aquatiques
    - title: Technologie
      description: L'ingénierie derrière les produits Paddle Board Overstock — matériaux, méthodes de construction et tests qualité.
      icon: tabler:microscope
      topics:
        - Technologie PVC marine
        - Noyau drop-stitch expliqué
        - Pourquoi le PSI est important pour les SUP gonflables
        - Soudure RF vs liaison adhésive
        - Tests qualité et certification
    - title: Business Knowledge
      description: Guides commerciaux pour créer et développer votre entreprise de sports nautiques – des opérations de location à la marque privée.
      icon: tabler:briefcase
      topics:
        - Comment démarrer une entreprise de location SUP
        - Construire une base nautique de villégiature
        - Dimensionnement de la flotte de paddle board pour les clubs
        - Gonflable vs dur SUP pour un usage commercial
        - Meilleur matériel de kayak pour les flottes de location
        - Créer une marque d'eau de marque privée
        - Stratégies de revenus des sports nautiques dans les stations balnéaires
        - Guide d'entretien des équipements commerciaux
