process_steps:
  title: Processus en 6 étapes OEM/ODM
  subtitle: Du cahier des charges à FOB Qingdao — un flux de travail simplifié
  steps:
    - number: '01'
      title: Cahier des charges et modélisation 3D CAO
      description: Partagez vos spécifications cibles, produit de référence ou concept. Notre équipe d'ingénierie développe des dessins CAO détaillés et des rendus 3D pour votre approbation.
      timeline: 3 à 5 jours
    - number: '02'
      title: Sélection des matériaux et test des tissus
      description: Choisissez parmi des tissus de qualité militaire PVC (0,9–1,2 mm), Hypalon CSM ou drop-stitch cœur. Nous effectuons des tests de résistance à la traction, d'adhérence du revêtement et de stabilité UV.
      timeline: 2 à 3 jours
    - number: '03'
      title: Prototypage rapide et production d'échantillons
      description: Nous CNC des moules personnalisés et produisons des échantillons de pré-production avec vos couleurs de marque, votre logo et les matériaux spécifiés. Les échantillons sont expédiés pour votre approbation.
      timeline: 7 à 14 jours
    - number: '04'
      title: Test de maintien sous haute pression de 24 à 48 heures
      description: Chaque prototype subit des tests rigoureux de rétention de pression à 1,25 fois la pression nominale. Des tests de délaminage des coutures et une vérification dimensionnelle sont effectués.
      timeline: 1–2 jours
    - number: '05'
      title: Inspection de la qualité et emballage CE/ISO
      description: Liste de contrôle de qualité de 100 points. Chaque unité est inspectée avant l'emballage prêt à la vente. Déclaration de conformité CE et rapport de conformité BSCI inclus.
      timeline: 2 à 3 jours
    - number: '06'
      title: Expédition et logistique FOB Qingdao
      description: Produits finis palettisés, emballés sous film rétractable et chargés en conteneur au port de Qingdao. Documentation d'exportation complète, dédouanement et suivi en temps réel.
      timeline: 7 à 14 jours
