faq:
  title: OEM/ODM — Questions Fréquemment Posées
  questions:
    - q: Quelle est la quantité minimale de commande (MOQ) pour les SUPs gonflables personnalisés ?
      a: Pour les modèles standard avec des moules existants, MOQ commence à 5 à 10 unités par design. Pour des moules et des outillages entièrement personnalisés, MOQ est généralement de 200 unités. Nous travaillons avec des start-ups et des marques émergentes pour trouver des points d'entrée réalisables.
    - q: Combien de temps le processus de l'échantillon OEM prend-il ?
      a: Les échantillons de prototype standard sont réalisés dans un délai de 7 à 14 jours ouvrables après l'approbation du design. Les commandes urgentes peuvent être priorisées en 5 à 7 jours moyennant des frais supplémentaires.
    - q: Quelle est la différence entre PVC et Hypalon pour les bateaux gonflables ?
      a: PVC est plus léger, plus abordable et offre une excellente flexibilité par temps froid. Hypalon (CSM) fournit une meilleure résistance à UV et à l'ozone avec une durée de vie plus longue (10 à 15 ans contre 5 à 8 ans). Nous recommandons PVC pour la plupart des applications récréatives et Hypalon pour un usage commercial/professionnel.
    - q: Pouvez-vous personnaliser la forme et le design de l'inflatable ?
      a: Oui. Notre équipe R&D peut développer des moules sur mesure pour n’importe quelle forme de coque, contour de planche ou configuration de tube. Nous utilisons des moules en aluminium usinés CNC pour la précision et la constance.
    - q: Fournissez-vous des services d'audit d'usine ?
      a: Nous accueillons des audits d'usine sur site et par des tiers dans notre installation de 12 000 m² à Qingdao. Nous maintenons les certifications ISO 9001 et BSCI et pouvons partager les rapports d'audit sous NDA.
    - q: Quels sont les conditions d'expédition que vous proposez ?
      a: Nous proposons des conditions de livraison FOB Qingdao (standard), CIF et DDP. Le chargement des conteneurs et la documentation complète pour l'exportation sont inclus dans toutes les commandes OEM.
content_profiles:
  tagline: Profils de marque
  title: OEM / Fabrication de marque privée<br />Par type de client
  subtitle: Les différents profils de marques ont des exigences distinctes — nous adaptons nos services OEM/ODM pour correspondre à votre modèle commercial, à votre envergure et à votre stratégie de mise sur le marché.
  items:
    - title: Marques de véhicules nautiques en démarrage
      subtitle: Faible MOQ, montée rapide
      description: Entrepreneurs et fondateurs lançant leur première ligne de SUPs, kayaks ou bateaux gonflables. Vous avez besoin d'un partenaire de fabrication qui considère votre marque comme la sienne — avec des seuils d'entrée faibles, des tailles de lots flexibles et un accompagnement en conception à chaque étape.
      features:
        - MOQ aussi peu que 50–100 unités par SKU, pas des milliers
        - Bibliothèque de moules préexistante pour éviter les coûts d'outillage
        - 'Pack de marque complet : logo, graphismes pour tube, emballage, étiquettes suspendues'
        - Flux de travail échantillon-premier — approuver avant la production
    - title: Marques Marines Établies
      subtitle: OEM échelle avec CE/ISO conformité
      description: Marques existantes de bateaux, de PWCs ou d'accessoires marins ajoutant des engins nautiques gonflables à leur portefeuille. Vous avez besoin d'une qualité constante à travers les séries de production, de la conformité réglementaire pour les marchés mondiaux, et de la capacité à co-concevoir des coques ou des formes de tubes personnalisées.
      features:
        - Ingénierie de moules 3D personnalisés pour des designs propriétaires
        - CE 2013/53/UE, UKCA, documentation de conformité USCG
        - Rapports d'audit social BSCI pour la conformité des détaillants
        - Gestion de compte dédiée + créneaux de production prioritaires
    - title: Marques DTC et E-Commerce
      subtitle: Emballage prêt pour la vente au détail à grande échelle
      description: Des marques en ligne vendant via Amazon, Shopify ou leurs propres boutiques en ligne. L'emballage, l'expérience de déballage et la qualité uniforme des unités sont essentiels. Vous avez besoin d'une usine qui comprenne la dynamique de vitesse et de taux de retour du commerce électronique.
      features:
        - Conception de boîte prête pour la vente au détail + impression de carte d'insertion
        - Emballage sous vide / palettisation pour un transport économique
        - Code-barres EAN / UPC et documentation prête pour la douane
        - Consolidation de conteneurs mixtes pour optimiser le coût rendu
    - title: Marques de style de vie et de plein air
      subtitle: Conception en marque blanche + extension de catégorie
      description: Vêtements, équipements de plein air ou marques de voyage entrant dans la catégorie des sports nautiques sous leur propre label. Vous n'avez peut-être pas d'expertise en ingénierie marine en interne — vous avez donc besoin d'un partenaire qui peut vous guider du concept au conteneur avec un minimum de friction.
      features:
        - Recherche de tendances et planches d'ambiance conceptuelles
        - Éditions limitées co-marquées et couleurs saisonnières
        - Cycle de conception à échantillon en 10 à 14 jours ouvrables
        - 'Logistique de bout en bout : usine → entrepôt → consommateur'
