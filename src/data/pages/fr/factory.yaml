hero:
  tagline: Usine
  title: Usine et fabrication
  subtitle: 12 000 m² de fabrication intégrée — de la matière première jusqu'au panneau fini
intro:
  - En tant que marque d'usine du **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock contrôle chaque étape de la production — de l'arrivée des matières premières PVC et drop-stitch à l'inspection finale avant livraison de la carte terminée. Notre installation de fabrication dans la zone de développement économique de Weihai s'étend sur 12 000 mètres carrés et abrite des ateliers dédiés à la découpe de PVC, au thermo-scellage et au soudage, à la finition artistique des cartes, à l'assemblage final et aux tests de qualité.
  - En intégrant la conception, l'ingénierie, le prototypage, la fabrication et les tests sous un même toit, nous éliminons les inefficacités de la fabrication sous contrat et maintenons un contrôle direct sur la qualité de fabrication, la sélection des matériaux et les délais de livraison. Chaque carte qui quitte notre atelier est fabriquée par notre personnel, sur notre équipement, selon nos standards.
