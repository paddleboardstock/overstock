workshops_section:
  tagline: Ateliers
  title: Ateliers de Fabrication
  workshops:
    - title: Découpe PVC & Préparation des Matériaux
      description: Les machines de découpe CNC automatiques traitent les tissus PVC, Hypalon et drop-stitch avec une précision submillimétrique. Le nesting optimisé par ordinateur minimise les déchets de matériau et garantit que chaque panneau respecte ses spécifications dimensionnelles avant soudage.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Soudage de Tubes & Thermoscellage
      description: Atelier de soudage dédié avec machines de thermoscellage et presses diélectriques RF. Les thermoscelleuses à air chaud lient et fusionnent les chambres des tubes PVC, tandis que les soudures RF produisent des joints hermétiques haute résistance qui dépassent les exigences ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Production de Coques RIB — Fibre de Verre
      description: Les coques de bateaux RIB sont produites par moulage en fibre de verre par stratification manuelle avec des systèmes de résine polyester et vinylester. Chaque couche est roulée à la main et mise sous vide pour une qualité constante. La cabine de pulvérisation gelcoat offre une finition marine haute brillance résistante aux UV.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: Impression & Décoration SUP
      description: Les planches SUP sont décorées par impression numérique pour graphiques couleur et sérigraphie pour logos et motifs répétés. Les imprimantes numériques produisent des designs de pont photo-réalistes, tandis que la sérigraphie offre des marques de marque durables et vives.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Assemblage Final & Gréement
      description: Chaîne d'assemblage où les coques en fibre de verre et les tubes PVC sont accouplés, les moteurs sont montés, la direction et les commandes sont connectées, et les systèmes électriques sont câblés. Chaque bateau suit une liste de contrôle d'assemblage en 100 points signée par le chef d'équipe.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Tests Qualité & Inspection
      description: Chaque bateau fini subit un test obligatoire de rétention d'air, une vérification de pelage des joints et une vérification complète des systèmes avant expédition. Notre laboratoire qualité opère indépendamment de la production et rapporte directement à la direction.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp

