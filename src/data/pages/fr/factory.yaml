qc_section:
  tagline: Contrôle Qualité
  title: Processus de Test et Assurance Qualité
  subtitle: Chaque bateau subit des tests obligatoires avant expédition. Notre laboratoire qualité opère indépendamment de la production et rapporte directement à la direction.
  steps:
    - step: '1'
      title: Inspection des Matières Premières
      desc: Les tissus PVC, Hypalon et drop-stitch subissent un test de traction (ASTM D751), de propagation de déchirure et de vérification de résistance UV avant que tout lot n'entre en production.
    - step: '2'
      title: Test de Rétention d'Air de 48 Heures
      desc: Chaque chambre de tube est gonflée à 125 % de la pression nominale et maintenue pendant 48 heures. Une chute de pression inférieure à 5 % déclenche un rejet automatique et une réinspection des joints.
    - step: '3'
      title: Test de Charge et d'Équilibre
      desc: Les bateaux finis sont chargés à la capacité maximale nominale et testés pour la stabilité, le franc-bord et la maniabilité. Chaque embarcation est testée sur l'eau avant l'inspection finale.

oem_section:
  tagline: Projets OEM
  title: Études de Cas de Partenariat Marque et OEM
  subtitle: Du concept au conteneur — comment nous aidons les marques mondiales à lancer et développer leurs gammes d'embarcations gonflables.
  cases:
    - challenge: Un détaillant européen d'outdoor avait besoin d'une ligne SUP marque privée avec des graphiques de pont uniques, du PVC écologique et un emballage prêt pour la vente au détail — le tout livré en 60 jours.
      solution: Développement de fichiers d'impression numérique personnalisés, approvisionnement en PVC conforme REACH et compression de l'échantillonnage de 3 tours à 1 en co-implantant l'équipe de design dans notre usine de Qingdao.
      result: 55 jours du bon de commande signé au FOB. 2 400 unités sur 4 SKUs. Commande répétée avant l'arrivée du premier conteneur.
    - challenge: Une startup américaine de sports nautiques avait besoin d'un kayak drop-stitch haute performance avec forme de coque personnalisée, emballage co-marqué et certification BSCI pour le placement en magasin.
      solution: Adaptation du moule de kayak drop-stitch existant avec profil de rocker modifié, développement de l'emballage co-marqué et fourniture de la documentation complète d'audit BSCI.
      result: Listé avec succès dans 3 grandes chaînes outdoor américaines. 5 000+ unités en première année avec 98 % de taux de vente.
    - challenge: Un distributeur australien nécessitait une gamme RIB certifiée CE avec couleurs de tubes personnalisées, option de mise à niveau Hypalon et conformité à la norme australienne AS 1799.
      solution: Production d'échantillons de pré-production avec 4 variantes de couleur de tubes, approvisionnement en Hypalon CSM auprès d'un fournisseur japonais et coordination des tests de conformité AS 1799 par un tiers.
      result: Gamme RIB de 3 modèles lancée sur le marché AU/NZ. Suivie d'un appel d'offres gouvernemental pour 12 RIB de patrouille.

faq_section:
  tagline: FAQ
  title: Questions Fréquemment Posées B2B et OEM
  questions:
    - q: Quelle est la quantité minimale de commande (MOQ) pour les planches SUP gonflables OEM ?
      a: La MOQ commence à 5–10 unités pour les modèles OEM standard. Les moules personnalisés et les projets marque privée nécessitent un minimum de 200 unités selon la complexité. Les commandes d'essai et les échantillons sont disponibles pour les lancements de nouvelles marques.
    - q: Paddle Board Overstock détient-il la certification BSCI ?
      a: Oui. Notre usine maintient une certification de conformité sociale BSCI valide (rapport d'audit disponible sur demande). Nous détenons également ISO 9001:2015 pour le management qualité, et 64 de nos modèles portent la certification CE (TÜV Rheinland). La documentation de conformité REACH et RoHS est fournie avec chaque expédition OEM.
    - q: Quel est le délai de livraison typique pour une commande OEM ?
      a: Le délai standard est de 30 à 45 jours à compter du bon de commande confirmé et du dépôt. Le développement de moule personnalisé ajoute 15 à 20 jours pour l'outillage. Nous proposons une production accélérée pour les commandes urgentes et les rushes saisonniers durant la fenêtre pré-été (janv–mars).
    - q: Pouvez-vous expédier FOB Qingdao ou CIF vers notre port ?
      a: Oui. Nous expédions FOB Qingdao, CIF vers les grands ports mondiaux et DDP pour les partenaires qualifiés. Notre équipe logistique gère la réservation de conteneurs, la documentation d'exportation et le dédouanement. Nous expédions dans 50+ pays à travers les marchés UE, USA, AU et Asie.

b2b_moq: "MOQ standard : 5–10 unités par modèle (SUP/kayak/drop-stitch). MOQ RIB : 2–5 unités. Commandes d'essai bienvenues pour les nouveaux partenariats."

production_flow:
  tagline: Flux de Production
  title: De la Matière au Bateau Fini
  subtitle: Chaque bateau passe par 6 étapes de production avec des points de contrôle CQ à chaque étape. Pas de raccourcis, pas d'inspections sautées.
  stages:
    - stage: '01'
      title: Réception des Matières & CQ Entrant
      description: Toutes les matières entrantes sont enregistrées par numéro de lot dans notre système ERP. Les rouleaux de tissu PVC, les noyaux drop-stitch, les vannes, les adhésifs et la quincaillerie sont mis en quarantaine jusqu'à l'approbation du CQ.
      qc_check: "Résistance à la traction (ASTM D751), résistance au déchirement (ISO 4674), jauge d'épaisseur, viscosité de l'adhésif, inspection visuelle des défauts"
      qc_threshold: '100% des lots testés. Rejet si traction < 90% de la spécification, déchirement < min spécifié, ou tout défaut visuel'
      responsibility: Équipe CQ entrante (3 inspecteurs)
    - stage: '02'
      title: Découpe CNC & Préparation des Matériaux
      description: Le nesting optimisé par ordinateur dispose les panneaux sur le stock PVC pour minimiser les déchets. Les machines de découpe CNC automatiques maintiennent une précision de position de 0,1 mm.
      qc_check: 'Contrôle dimensionnel par rapport aux fichiers DXF CAO, inspection de la qualité des bords, vérification du nombre de panneaux'
      qc_threshold: 'Chaque 20e panneau mesuré. Tolérance ±0,5 mm. Rejet du lot si >2% hors tolérance'
      responsibility: Chef d'atelier de découpe
    - stage: '03'
      title: Soudage & Liaison Drop-Stitch
      description: Les noyaux drop-stitch sont liés aux laminés PVC extérieurs par thermolamination. Les chambres des tubes sont soudées par RF ou air chaud. Les bandes de rail sont liées par fusion triple couche.
      qc_check: "Test de pelage toutes les 50 unités (ASTM D751), mesure de largeur de soudure, relevé de température d'air chaud, inspection visuelle des joints sous contre-jour"
      qc_threshold: 'Résistance au pelage min 8 N/cm. Tolérance de largeur de soudure ±1 mm. Tout canal visible = rejet'
      responsibility: CQ soudage (2 inspecteurs par équipe)
    - stage: '04'
      title: Assemblage & Gréement
      description: "Les bateaux passent à l'assemblage final où tous les composants sont accouplés : coque + tubes, vannes installées, anneaux D, poignées, boîtes à dérive et sac de transport. Chaque unité suit une liste de contrôle d'assemblage en 100 points."
      qc_check: 'Validation de la liste de contrôle en 100 points par unité, test de fonction des vannes (10 cycles ouverture/fermeture), vérification du couple de serrage, inspection visuelle'
      qc_threshold: 'Politique zéro défaut sur les articles critiques pour la sécurité (vannes, anneaux D, poignées). Esthétique mineure : AQL 2.5 (ISO 2859)'
      responsibility: Chef d'équipe d'assemblage + CQ de ligne
    - stage: '05'
      title: Test de Pression & Quarantaine Qualité
      description: Chaque chambre est gonflée à 1,25× la pression nominale (généralement 20-25 PSI) et maintenue pendant 24 à 48 heures. Les capteurs de pression enregistrent en continu. Les chambres dépassant 5% de chute de pression sont rejetées et envoyées pour réinspection des joints.
      qc_check: 'Relevé de pression 24h, calibration du capteur vérifiée quotidiennement, lecture de pression compensée en température, retest des joints après réparation'
      qc_threshold: 'Max 5% de chute de pression sur 24h à température stable. Toute chambre dépassant ce seuil = retest 100% de tout le lot de production'
      responsibility: Laboratoire qualité (indépendant de la production, rapporte à la direction)
    - stage: '06'
      title: Inspection Finale & Emballage
      description: Inspection visuelle et fonctionnelle finale. Défauts de surface, consistance des couleurs, vérification des étiquettes/BIN, intégrité de l'emballage et exhaustivité des accessoires. Les unités sont emballées sous vide, mises en carton et palettisées pour le chargement en conteneur.
      qc_check: "Inspection visuelle complète, liste de contrôle des accessoires par SKU, test de chute d'emballage (1 m, échantillon aléatoire), vérification par scan d'étiquette/code-barres"
      qc_threshold: 'AQL 2.5 pour les défauts majeurs, AQL 4.0 pour les défauts mineurs. Tolérance zéro pour les défauts de sécurité. 100% des unités inspectées visuellement'
      responsibility: Équipe CQ finale (4 inspecteurs) + Chef d'équipe emballage

