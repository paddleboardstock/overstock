material_traceability:
  tagline: Traçabilité
  title: Suivi des Matériaux et Contrôle des Lots
  description: Chaque lot de matière première reçoit un numéro de lot unique dans notre système ERP. De l'arrivée à travers la production jusqu'au produit fini, la nomenclature de chaque bateau remonte au lot fournisseur d'origine. Cela permet une traçabilité amont complète pour toute enquête qualité ou conformité.
  system: ERP personnalisé (système interne) + étiquettes de lot physiques sur chaque ordre de fabrication
  coverage: 100% des matériaux de production — PVC, Hypalon, tissu drop-stitch, adhésifs, vannes, quincaillerie, emballage
  records_retained: 10 ans (selon exigence CE 2013/53/UE)
  suppliers:
    - material: PVC de qualité marine
      source: Fournisseurs chinois et coréens
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Fournisseur japonais
      certified: ISO 9001, REACH
    - material: Tissu drop-stitch
      source: Tissage interne + partenaire externe
      certified: CQ interne + ISO 9001 fournisseur
    - material: Vannes et Quincaillerie
      source: Fournisseurs OEM chinois
      certified: ISO 9001, certificats matière par lot

