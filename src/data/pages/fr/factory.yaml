material_traceability:
  tagline: Traçabilité
  title: Suivi des matériaux et contrôle des lots
  description: Chaque lot de matière première se voit attribuer un numéro de lot unique dans notre système ERP. De l'arrivée à la production jusqu'au produit fini, la nomenclature de chaque planche est liée au lot d'origine du fournisseur. Cela permet une traçabilité complète en amont pour toute question de qualité.
  system: Étiquettes de lot physiques personnalisées ERP (système interne) + sur chaque ordre de travail
  coverage: 100 % des matériaux de production — PVC, tissu drop-stitch, mousse EVA, adhésifs, vannes, matériel, emballage
  records_retained: 10 ans
