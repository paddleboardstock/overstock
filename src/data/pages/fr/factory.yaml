hero:
  tagline: Usine
  title: Usine & Fabrication
  subtitle: 12 000 m² de fabrication intégrée — de la matière première au bateau fini

intro:
  - En tant que marque d'usine de l'**Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock contrôle chaque étape de la production — de l'arrivée des matières premières PVC et fibre de verre à l'inspection finale avant expédition du bateau fini. Notre installation de fabrication dans la Zone de Développement Économique de Qingdao s'étend sur 12 000 mètres carrés et abrite des ateliers dédiés pour la découpe PVC, le thermoscellage des tubes, la production de coques RIB en fibre de verre, l'impression numérique SUP, l'assemblage final et les tests qualité.
  - En intégrant conception, ingénierie, prototypage, fabrication et tests sous un même toit, nous éliminons les inefficacités de la fabrication contractuelle et maintenons un contrôle direct sur la qualité de construction, la sélection des matériaux et les délais de livraison. Chaque bateau qui quitte notre atelier est construit par notre personnel, sur nos équipements, selon nos normes.

