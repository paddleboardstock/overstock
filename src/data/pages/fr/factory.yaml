workshops_section:
  tagline: Ateliers
  title: Ateliers de fabrication
  workshops:
    - title: PVC Découpe et préparation des matériaux
      description: Les machines de découpe automatiques CNC traitent les tissus PVC et drop-stitch avec une précision submillimétrique. Le nidification optimisée par ordinateur minimise le gaspillage de matériel et garantit que chaque panneau respecte ses spécifications dimensionnelles avant le soudage.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Soudage et scellage thermique
      description: Atelier de soudage dédié avec machines de thermoscellement et presses diélectriques RF. Les soudeurs à air chaud drop-stitch lient et fusionnent les noyaux et les bandes de rails, tandis que les soudures RF produisent des joints hermétiques à haute résistance.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Art de deck & EVA finition
      description: 'Les decks de la série Art prennent forme ici : EVA des panneaux en mousse taillés avec précision sont posés en motifs complets, collés et taillés à la main pour une finition adhérente, confortable et durable — le look signature de chaque planche de la série Art.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Impression et décoration
      description: SUP Les planches sont décorées à l’aide de l’impression numérique pour des graphiques en couleur et de la sérigraphie pour les logos et motifs répétitifs. Les imprimantes numériques produisent des designs de platines de qualité photo, tandis que la sérigraphie donne des marques durables et vives.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montage final et montage
      description: Chaîne de montage où les planches reçoivent leurs vannes, anneaux en D, poignées, ailettes et attaches de laisse. Chaque planche suit une liste de contrôle d’assemblage de 100 points approuvée par le chef d’équipe.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Tests et inspections qualité
      description: Chaque carte terminée subit des tests obligatoires de rétention d’air, une vérification du décollement des joints et une vérification complète des systèmes avant l’expédition. Notre laboratoire qualité fonctionne indépendamment de la production et rend compte directement à la direction.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
