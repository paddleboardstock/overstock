qc_section:
  tagline: Contrôle de qualité
  title: Processus de test et d’assurance qualité
  subtitle: Chaque conseil subit des tests obligatoires avant l’expédition. Notre laboratoire qualité fonctionne indépendamment de la production et rend compte directement à la direction.
  steps:
    - step: '1'
      title: Inspection des matières premières
      desc: PVC et drop-stitch les tissus subissent des tests de traction, de la propagation des déchirures et UV de la vérification de la résistance avant toute production de groupe.
    - step: '2'
      title: Test de rétention d’air de 48 heures
      desc: Chaque chambre de tableau est gonflée à 125 % de la pression nominale et maintenue pendant 48 heures. Une chute de pression supérieure à 5 % déclenche un rejet automatique et une réinspection de la jointure.
    - step: '3'
      title: Test de charge et d'équilibrage
      desc: Les planches terminées sont chargées à leur capacité nominale maximale et testées pour la stabilité, le franc-bord et la maniabilité. Chaque planche est testée à l'eau avant l'inspection finale.
faq_section:
  tagline: FAQ
  title: Questions Fréquemment Posées
  questions:
    - q: Où sont fabriqués vos paddle boards ?
      a: Chaque planche est fabriquée dans notre propre usine de 12 000 m² à Weihai, en Chine. Nous ne sous-traitons pas — la conception, les matériaux, le soudage, l'assemblage et les tests se déroulent tous sous un même toit, donc la qualité ne dépend jamais d'un tiers.
    - q: Comment vos prix peuvent-ils être tellement plus bas que ceux du commerce de détail ?
      a: Nous vendons des surplus d'usine et des lots de liquidation directement depuis notre propre site de production — sans intermédiaires, sans majoration de détail. Cela signifie des packages complets SUP avec jusqu'à 60 % de réduction par rapport aux prix de détail habituels, avec la même qualité éprouvée.
    - q: Qu'est-ce qui est inclus avec un tableau ?
      a: 'Chaque SUP est livré en tant que package complet : planche, sac à dos de voyage, pompe à main, pagaie réglable, aileron amovible, leash en spirale et kit de réparation.'
    - q: À quelle vitesse les commandes sont-elles expédiées ?
      a: Les commandes en stock quittent notre usine de Weihai dans un délai de 2 à 3 jours ouvrables avec une livraison suivie vers 50+ pays à travers l'UE, l'Amérique du Nord, l'Asie-Pacifique et au-delà.
production_flow:
  tagline: Flux de production
  title: Du matériau à la planche finie
  subtitle: Chaque carte passe par 6 étapes de production avec des points de contrôle qualité à chaque étape. Pas de raccourcis, pas d'inspections sautées.
  stages:
    - stage: '01'
      title: Réception des matériaux et contrôle qualité entrant
      description: Tous les matériaux entrants sont enregistrés par numéro de lot/numéro de série dans notre système ERP. Les rouleaux de tissu PVC, les noyaux drop-stitch, les valves, les adhésifs et le matériel sont mis en quarantaine jusqu'à l'approbation du contrôle qualité.
      qc_check: Résistance à la traction, résistance à la déchirure, jauge d'épaisseur, viscosité de l'adhésif, inspection visuelle des défauts
      qc_threshold: 100 % des lots testés. Rejeter si la résistance à la traction < 90 % de la spécification, déchirure < minimum de la spécification, ou tout défaut visuel
      responsibility: Équipe QC entrante (3 inspecteurs)
    - stage: '02'
      title: CNC Découpe et préparation des matériaux
      description: Le nidage optimisé par ordinateur dispose les panneaux sur du stock PVC pour minimiser les déchets. Les machines de découpe CNC automatiques maintiennent une précision de positionnement de 0,1 mm.
      qc_check: Contrôle dimensionnel par rapport aux fichiers CAD DXF, inspection de la qualité des bords, vérification du nombre de panneaux
      qc_threshold: Chaque 20e panneau est mesuré. Tolérance ±0,5 mm. Rejeter le lot si >2 % hors tolérance
      responsibility: Responsable de l'atelier de découpe
    - stage: '03'
      title: Soudage et Drop-Stitch Collage
      description: Drop-stitch Les noyaux sont liés aux stratifiés extérieurs PVC par lamination à chaud. Les chambres de tubes sont soudées par RF ou par air chaud. Les bandes de rail sont fusionnées en triple couche.
      qc_check: Test de pelage tous les 50 unités, mesure de la largeur de soudure, revue du journal de température de l'air chaud, inspection visuelle du joint sous rétroéclairage
      qc_threshold: Résistance au pelage min 8 N/cm. Tolérance de largeur de soudure ±1 mm. Tout canalisations visibles = rejet
      responsibility: Contrôle qualité de soudure (2 inspecteurs par service)
    - stage: '04'
      title: Assemblage et montage
      description: 'Les cartes passent à l’assemblage final où tous les composants sont installés : valves installées, anneaux en D, poignées, boîtes à dérives et raccord pour sacs de transport. Chaque unité suit une liste de contrôle d’assemblage en 100 points.'
      qc_check: Validation par unité de la liste de contrôle en 100 points, test de fonctionnement des soupapes (10 cycles d’ouverture/fermeture), vérification du couple matériel, inspection visuelle
      qc_threshold: Politique zéro défaut pour les éléments critiques pour la sécurité (vannes, anneaux en D, poignées). Défauts esthétiques mineurs dans des limites esthétiques strictes
      responsibility: Contrôle qualité de ligne de conduite d’équipe d’assemblage +
    - stage: '05'
      title: Contrôle de pression et maintien de la qualité
      description: Chaque chambre est gonflée à une pression nominale de 1,25× (généralement 20–25 PSI) et maintenue pendant 24 à 48 heures. Les capteurs de pression enregistrent en continu. Les chambres dépassant 5 % de perte de pression sont rejetées et envoyées pour réinspection des joints.
      qc_check: Journal de maintien de pression sur 24h, calibration du capteur vérifiée quotidiennement, lecture de pression compensée par la température, retest de la jonction après réparation
      qc_threshold: Chute de pression maximale de 5 % sur 24 heures à température stable. Toute chambre dépassant ce niveau = retest à 100 % de l’ensemble du lot de production
      responsibility: Laboratoire qualité (indépendant de la production, rendant compte à la direction)
    - stage: '06'
      title: Inspection finale et emballage
      description: Inspection visuelle et fonctionnelle finale. Défauts de surface, cohérence des couleurs, vérification de l’étiquette/BIN, intégrité de l’emballage et complétude des accessoires. Les unités sont emballées sous vide, emballées et palettesées pour le chargement des conteneurs.
      qc_check: Inspection visuelle complète, liste de contrôle des accessoires par SKU appareil, test de chute d’emballage (1 m, échantillon aléatoire), vérification de l’étiquette/code-barres
      qc_threshold: Tolérance zéro pour les défauts de sécurité. Défauts esthétiques dans des limites strictes. 100 % des unités inspectées visuellement
      responsibility: Équipe QC finale (4 inspecteurs) + Chef d’équipe d’emballage
