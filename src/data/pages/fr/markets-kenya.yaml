hero:
  tagline: Kenya
  title: Conseils en gros SUP pour<br />Entreprises kenyanes
  subtitle: Diani, Watamu, Mombasa et Nairobi — exploitants de plage, stations balnéaires et détaillants qui stockent de toutes nouvelles planches de surstock à partir de 5 unités, modèles mixtes.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Panneaux de surstock SUP pour les stations balnéaires kenyanes et les exploitants
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves en surstock SUP aux entreprises kényanes — opérateurs de plage et complexes balnéaires sur Diani, Watamu, Nyali et la côte autour de Mombasa, ainsi que des détaillants et des écoles atteignant la communauté croissante de pagayeurs de Nairobi. Les commandes en gros commencent à 5 planches avec des modèles mixtes en une seule cargaison, envoyées depuis Weihai, Chine, par fret aérien express ou fret maritime consolidé. Chaque planche est testée à 100 % par pression et couverte par la garantie de 2 SUP ans.
tldr_points:
  - Vente en gros à partir de 5 cartes — modèles mixtes, tarifés par quantité totale
  - Au service du tourisme balnéaire de l’océan Indien au Kenya et des annexes de safari-lodge
  - Fret aérien express ou maritim consolidé depuis Weihai, Chine
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché kényan SUP
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: une activité en eau calme qui convient aux clients du complexe, aux journées sans vent des écoles de kitesurf, et aux balades au coucher du soleil au-dessus du récif.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: les lodges et camps ajoutant des séances de pagaie à leurs menus d’activités. Entre les opérateurs de plage, les hôtels, les écoles de kitesurf et de plongée élargissant leur offre, et une petite mais croissante scène de pagaie à Nairobi, les commandes sont petites et pratiques — 5 à 15 planches de modèles stables, durables et polyvalents, avec une ou deux éditions premium à exposer.
  customer_types:
    - title: Exploitants de plage
      description: Les exploitants de Diani, Watamu et Mombasa ajoutent SUP des locations et des cours pour les touristes.
    - title: Complexes et lodges de safari et plage
      description: Les stations balnéaires et les lodges ajoutent des programmes pour les visiteurs SUP avec des flottes mixtes compactes.
    - title: Écoles de kitesurf et de plongée
      description: Les écoles de sports nautiques existantes élargissent leur offre avec des activités de pagaie en eaux calmes.
shipping_section:
  title: Navire vers le Kenya
  paragraphs:
    - Les commandes sont expédiées depuis Weihai, Chine. Le transport aérien express transporte des échantillons et 1 à 3 commandes de bord vers l’aéroport Jomo Kenyatta de Nairobi et la côte ; Consolidated Sea Freight dessert 5 à 20 commandes de gros à bord via le port de Mombasa. Les estimations de transit pour votre destination sont incluses dans votre devis.
    - Nous fournissons les factures commerciales et les décharges de liste de conditionnement requises, avec les codes HS corrects et les valeurs déclarées. Les droits d’importation et taxes sont exigibles par l’importateur selon les règles kényanes.
  customs_note: Vérifiez le traitement actuel des droits de douane et de la fiscalité pour les équipements de sport avec votre agent de compensation avant de commander — la structure tarifaire du Kenya évolue périodiquement. Nous fournissons une documentation complète et cohérente pour assurer un dégagement fluide.
faq_section:
  title: Kenya FAQ
  items:
    - q: Les boards peuvent-ils atteindre directement Diani ou Watamu ?
      a: Les devis de livraison porte-à-porte couvrent les destinations côtières, en utilisant la logistique depuis l’aéroport d’arrivée ou le port de Mombasa. Notez votre emplacement exact dans la demande et nous fixerons le prix spécifiquement.
    - q: À quoi ressemble une commande de départ d’opérateur de plage ?
      a: 'Généralement 5 à 10 planches : modèles stables et polyvalents pour les leçons touristiques et la location, plus une ou deux éditions premium pour l’exposition. Modèles mixtes, une livraison, tarifée en quantité totale.'
    - q: Les planches conviennent-elles aux eaux chaudes de lagune et aux eaux plates de récif ?
      a: Oui — des conditions calmes, chaudes et peu profondes sont exactement ce pour quoi les SUPs gonflables polyvalents sont conçus, et la construction flexible des ailerons et de drop-stitch gère bien les atterrissages sur sable et sur les récifs plats.
    - q: Comment le fret est-il indiqué pour le Kenya ?
      a: Air express vers Nairobi ou la côte pour les échantillons et les petites commandes ; fret maritime groupé vers Mombasa pour les quantités en gros. Les deux sont détaillés dans votre devis avec les temps de transit estimés.
