testimonial:
  content: Je louais 5 planches dans un magasin local et je perdais 60 % de mes revenus pour eux. Paddle Board Overstock m'a aidé à constituer ma propre flotte de 15 SUPs. Le calculateur ROI qu'ils ont fourni montrait que je serais à l'équilibre en 4 mois — cela a en réalité pris 3. Maintenant, je m'étends à 30 planches.
  name: Daniel Okonkwo
  title: Propriétaire, Lakeland SUP Rentals — Ontario, Canada
content_segments:
  tagline: Profils de location
  title: Solutions de location de sports nautiques<br />Par type d'opérateur
  subtitle: Différentes opérations de location ont des besoins différents – de la petite location de SUP en bord de mer aux centres de sports nautiques à grande échelle. Nous adaptons nos packages d’équipement et notre modèle de support en conséquence.
  items:
    - title: Location de SUP sur la plage et au bord du lac
      subtitle: Opérations à grand volume et peu complexes
      description: Opérateurs louant des stand-up paddle boards directement aux vacanciers de la plage et aux visiteurs du lac. Votre priorité est de minimiser le temps de rotation entre les locations, de garder le matériel en circulation et de gérer les pics saisonniers de demande avec un petit espace de stockage.
      features:
        - Flottes de SUP gonflables qui se replient à plat — aucun quai ou remorque nécessaire
        - PVC de qualité commerciale, conçu pour 100+ cycles de location par saison
        - Tissu à séchage rapide et résistant à UV pour être prêt à relouer le même jour
        - Gammes de planches codées par couleur pour une identification facile de la flotte
    - title: Centres de sports nautiques Resort & Hôtel
      subtitle: Expérience client et alignement de la marque
      description: Complexes hôteliers et hôtels proposant des sports nautiques sur place. L'équipement doit avoir un aspect haut de gamme, fonctionner de manière fiable pour les clients débutants à intermédiaires et s'intégrer aux flux de réservation et de facturation d'activités existants du complexe.
      features:
        - Planches et gilets de sauvetage personnalisés à l'image de la station et assortis aux couleurs du resort
        - 'Flotte mixte : toutes pratiques, touring et série artistique'
        - Solutions de pompe électrique silencieuse et sans carburant pour gonflage sur la plage
        - Formation du personnel et intégration à la maintenance incluses
    - title: Locations Boutique & Mobile
      subtitle: Services de location éphémère et de livraison
      description: Opérateurs apportant les planches directement au client — livraisons sur la plage de l'hôtel, stations de location éphémères lors d'événements et installations mobiles. Le matériel doit être rapide à déployer, facile à transporter et présentable au premier regard, avec une taille de flotte flexible selon les événements et la demande saisonnière.
      features:
        - Transport de planches à dos — pas de remorque nécessaire
        - Gonflage rapide pour une installation à la demande en moins de 15 minutes
        - Équipement présentable qui semble haut de gamme au premier regard
        - Taille de flotte flexible pour événements et demande saisonnière
    - title: Opérateurs de voyages et d'aventure
      subtitle: Flottes d'excursions guidées
      description: Opérateurs assurant des visites guidées de sports nautiques — safaris SUP, excursions de snorkeling et tours d'exploration côtière. Le matériel doit être suffisamment stable pour les novices, rapide à nettoyer entre les groupes et assez durable pour un usage quotidien guidé dans diverses conditions aquatiques.
      features:
        - Plateformes SUP extra-stables (32" de large+) pour les débutants
        - Plateformes stables extra-larges pour photos de couples/groupes lors de tours
        - Capacité de rangement intégrée pour équipement de snorkeling, sacs étanches et glacières
        - Kits de sécurité pour opérations de tours commerciaux
