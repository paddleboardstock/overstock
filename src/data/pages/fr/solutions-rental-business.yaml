testimonial:
  content: Je louais 5 planches dans un magasin local et je perdais 60 % de mes revenus grâce à eux. Aquafarer m'a aidé à construire ma propre flotte de 15 SUP. Le calculateur de retour sur investissement qu'ils ont fourni a montré que j'atteindrais le seuil de rentabilité en 4 mois – il en a en fait fallu 3. Maintenant, je passe à 30 planches et j'ajoute des kayaks.
  name: Daniel Okonkwo
  title: Propriétaire, Lakeland SUP Rentals — Ontario, Canada
content_segments:
  tagline: Profils de location
  title: Solutions de location de sports nautiques<br />Par type d'opérateur
  subtitle: Différentes opérations de location ont des besoins différents – de la petite location de SUP en bord de mer aux centres de sports nautiques à grande échelle. Nous adaptons nos packages d’équipement et notre modèle de support en conséquence.
  items:
    - title: Location de SUP sur la plage et au bord du lac
      subtitle: Opérations à grand volume et peu complexes
      description: Opérateurs louant des planches à pagaie et des kayaks directement aux amateurs de plage et aux visiteurs du lac. Votre priorité est de minimiser les délais d'exécution entre les locations, de maintenir les équipements en rotation et de gérer les pics de demande saisonniers avec une faible empreinte de stockage.
      features:
        - Flottes de SUP gonflables qui se rangent à plat — pas besoin de ponton ni de remorque
        - PVC de qualité commerciale conçu pour plus de 100 cycles de location par saison
        - Tissu à séchage rapide et résistant aux UV pour une remise en location le jour même
        - Gammes de planches codées par couleur pour une identification facile de la flotte
    - title: Centres de sports nautiques Resort & Hôtel
      subtitle: Expérience client et alignement de la marque
      description: Complexes hôteliers et hôtels proposant des sports nautiques sur place. L'équipement doit avoir un aspect haut de gamme, fonctionner de manière fiable pour les clients débutants à intermédiaires et s'intégrer aux flux de réservation et de facturation d'activités existants du complexe.
      features:
        - Planches de SUP et gilets de sauvetage personnalisés aux couleurs du resort
        - 'Flotte mixte : SUP, kayaks, pédalos et petites annexes RIB'
        - Solutions de pompes électriques silencieuses et sans carburant pour le gonflage sur la plage
        - Formation du personnel et prise en main de l'entretien incluses
    - title: Opérateurs de location de bateaux et de semi-rigides
      subtitle: Flotte de location de navires de qualité commerciale
      description: Opérateurs louant des navires à moteur – annexes RIB, bateaux pneumatiques et petits runabouts – à l'heure ou à la demi-journée. Votre flotte doit respecter les réglementations en matière de sécurité maritime, résister à une utilisation intensive par les clients et minimiser les temps d'arrêt mécanique entre les charters.
      features:
        - Packs RIB avec tableaux arrière prêts pour hors-bords de 30 à 90 CV
        - Panneaux de plancher en contreplaqué de qualité marine pour une intégrité structurelle durable
        - Systèmes de valves à lancement rapide pour une rotation plus rapide
        - Kit de pièces de rechange + support technique SLA sur appel
    - title: Opérateurs de voyages et d'aventure
      subtitle: Flottes d'excursions guidées
      description: "Opérateurs organisant des visites guidées de sports nautiques : safaris SUP, kayak dans les grottes, excursions de plongée en apnée ou visites RIB d'île en île. L'équipement doit être suffisamment stable pour les invités novices, rapide à nettoyer entre les groupes et suffisamment durable pour une utilisation guidée quotidienne dans diverses conditions d'eau."
      features:
        - Plateformes SUP extra-stables (largeur de 82 cm et plus) pour les débutants
        - Options de kayaks biplaces pour les configurations de visites en couple ou en groupe
        - Capacité de chargement intégrée pour le matériel de plongée, les sacs étanches et les glacières
        - Documentation de conformité CE + USCG pour les opérations commerciales
