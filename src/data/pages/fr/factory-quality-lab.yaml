hero:
  tagline: Laboratoire de Contrôle Qualité
  title: Laboratoire de Test & Assurance Qualité
  subtitle: Laboratoire de qualité indépendant — chaque unité testée avant expédition
intro: Paddle Board Overstock exploite un laboratoire de contrôle qualité dédié qui fonctionne indépendamment de la production. Chaque lot de matière première et chaque planche finie passe par des protocoles d'inspection documentés avant la libération. Notre équipe QC rapporte directement à la direction, garantissant des décisions de qualité impartiales.
highlights:
  - value: 100%
    label: Unités testées sous pression
    detail: Chaque chambre, chaque planche
  - value: 48 h
    label: Durée du test de maintien de l'air
    detail: À 1,25× pression nominale
  - value: <5%
    label: Chute de pression maximale autorisée
    detail: Sur une période de maintien de 24 heures
  - value: 99.3%
    label: Taux sans défaut
    detail: Expéditions des 12 derniers mois
test_procedures:
  - title: Inspection des matières premières
    description: Chaque lot entrant de PVC, tissu drop-stitch, mousse EVA et matériel est testé avant acceptation. La résistance à la traction, la résistance à la déchirure et la résistance UV sont vérifiées. Les matériaux non conformes sont mis en quarantaine et retournés.
    standards:
      - Résistance à la traction (min 350 N/cm)
      - Résistance à la déchirure
      - Résistance UV (1 000 h)
  - title: Points de contrôle QC en cours de production
    description: Les opérateurs de production effectuent une auto-inspection à chaque étape. Les auditeurs QC réalisent des échantillonnages aléatoires tout au long du quart. Des tests de pelage des soudures sont effectués tous les 50 unités. Les vérifications dimensionnelles ont lieu tous les 20 panneaux.
    standards:
      - Test de pelage tous les 50 unités
      - Liste de contrôle interne à 100 points
      - Audits par échantillonnage aléatoire
  - title: Test de rétention d’air de 48 heures
    description: Chaque chambre de tube est gonflée à 125 % de la pression nominale et maintenue pendant 48 heures. Les capteurs de pression enregistrent en continu avec compensation de la température. Toute chambre dépassant une chute de pression de 5 % déclenche une réinspection automatique du lot.
    standards:
      - Maintien à 1,25× pression nominale
      - Chute de pression max <5 %
  - title: Test de charge et d'équilibrage
    description: Les planches complètes sont testées à la capacité nominale maximale pour la stabilité, le franc-bord et la maniabilité. Chaque planche subit un test à l'eau avant l'approbation finale de l'inspection.
    standards:
      - Vérification de charge 1,25× pression nominale
      - Test de l'eau
equipment:
  - name: Machine d'essai universelle (traction)
    spec: Capacité 5 kN
  - name: Testeur de dépression
    spec: Multicanal, 0–50 psi, enregistrement de données
  - name: UV Chambre de vieillissement
    spec: UVA-340, cycles de 1 000 h
  - name: Jauge d'épaisseur (numérique)
    spec: Résolution 0,01 mm
  - name: Testeur de pelage (soudure)
    spec: Motorisé, capacité 50 N
  - name: Chambre de température
    spec: -40 °C à +100 °C
  - name: Bassin de détection de fuites
    spec: 6 m × 2 m, éclairé
tldr:
  summary: 'Le laboratoire de contrôle qualité Paddle Board Overstock fonctionne indépendamment de la production, réalisant des tests de traction, de pelage, UV et de pression conformément aux protocoles internes documentés. 100 % des unités subissent un test de maintien de pression à 1,25 fois la pression nominale. Taux sans défaut : 99,3 % sur les livraisons des 12 derniers mois.'
  points:
    - Laboratoire indépendant séparé de la production pour une vérification impartiale de la qualité
    - 100 % de tests de pression à 1,25 fois la pression nominale pendant 24 à 48 heures par unité
    - Protocoles internes documentés régissant chaque test
    - Taux de 99,3 % sans défaut sur les expéditions des 12 derniers mois
    - Chaque unité inspectée à travers un contrôle qualité en 6 étapes avant expédition
