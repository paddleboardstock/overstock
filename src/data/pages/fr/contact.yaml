hero_text:
  tagline: Contact
  title: ENTREZ EN CONTACT
contact_form:
  id: form
  title: Envoyez-nous un message
  subtitle: Pour des questions concernant une commande, des conseils sur les tailles ou le support produit, envoyez-nous un message. Nous répondons dans un délai d'un jour ouvrable.
  email_to: info@paddleboardoverstock.com
  submit_button: Envoyer une demande → Obtenir un devis
  success_message: Merci ! Votre message a été reçu dans notre boîte de réception. Nous répondrons dans un délai d'un jour ouvrable.
  error_message: Une erreur est survenue lors de l'envoi de votre message. Veuillez réessayer ou nous envoyer un e-mail directement.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam : veuillez résoudre ce qui suit'
  fields:
    - name: Prénom
      label: Prénom
      row: 1
    - name: Nom
      label: Nom de famille
      row: 1
    - name: Nom de l'entreprise
      label: Nom de l'entreprise
      row: 2
    - name: address
      label: Adresse
      row: 3
    - name: zip
      label: Code postal
      row: 4
    - name: country
      label: Pays
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TÉL
      row: 5
      type: tel
      withCountryCode: true
    - name: Volume de commande
      label: Volume de commande estimé
      row: 6
      type: select
      options:
        - value: ''
          label: Pour combien de planches faites-vous vos achats ?...
        - value: one
          label: Une seule planche
        - value: 2-4
          label: 2–4 planches
        - value: 5-plus
          label: 5+ planches (famille, club ou location)
    - name: customization
      label: En quoi pouvons-nous vous aider ?
      row: 7
      type: select
      options:
        - value: ''
          label: Sélectionnez un sujet...
        - value: none
          label: Question générale sur le produit
        - value: sizing
          label: Aide pour choisir la bonne planche
        - value: order
          label: Commande, paiement ou expédition
        - value: warranty
          label: Assistance pour la garantie ou la réparation
    - name: produitIntérêt
      label: Catégories de produits d'intérêt
      row: 8
      type: select
      options:
        - value: ''
          label: Sélectionner une catégorie de produit...
        - value: all
          label: Tous les produits / Catalogue complet
        - value: sup
          label: SUP Planches / Stand up paddle
        - value: packages
          label: Kits complets SUP
        - value: accessory
          label: Accessoires (pompes, pagaies, sacs)
    - name: subject
      label: Sujet
      row: 9
    - name: message
      label: Message
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Autres moyens de nous contacter
  columns: 3
  items:
    - title: Aide à la commande
      description: Questions sur les produits, conseils de taille et support de commande.
      icon: tabler:shopping-bag
    - title: Support technique
      description: Garantie, réparations, pièces détachées et questions d'utilisation.
      icon: tabler:tool
    - title: Presse & partenariats
      description: Kits médias, parrainage et collaboration dans l'industrie.
      icon: tabler:news
    - title: Téléphone
      description: +1 279 732 3333 (Siège US) · +86 13305324192 (usine)
      icon: tabler:headset
    - title: E-mail
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Siège mondial & facturation
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Notre emplacement
  subtitle: Visitez notre centre de fabrication à Weihai
  address: Weihai, Shandong, Chine
