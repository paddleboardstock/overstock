content_challenge:
  tagline: Le défi
  title: 'Les opérations de sauvetage exigent<br />une fiabilité sans compromis'
  subtitle: 'Les organisations de recherche et de sauvetage opèrent sous une responsabilité de sécurité extrême — chaque défaillance d''embarcation a des conséquences inacceptables.'
  paragraphs:
    - 'Dans les opérations de sauvetage, la marge entre le succès et l''échec se mesure en minutes. L''embarcation doit être prête à appareiller immédiatement, opérer dans des conditions difficiles et rentrer en toute sécurité avec ses passagers. La responsabilité de sécurité est absolue — une panne mécanique pendant une mission de sauvetage n''est pas un coût de réparation, c''est une vie perdue.'
    - 'Les bateaux SAR doivent allier une vitesse élevée pour atteindre rapidement les victimes à une stabilité exceptionnelle pour des opérations de récupération en toute sécurité. Ils doivent transporter l''équipement de sauvetage, les fournitures médicales et le matériel de communication — souvent sur un pont à l''espace limité. Les bateaux au service des gouvernements doivent aussi avoir une longue durée de vie (10-15+ ans) pour justifier les budgets publics d''acquisition.'
    - 'La visibilité — pour l''opérateur comme pour la recherche — est essentielle. La console doit offrir une visibilité à 360 degrés, et l''embarcation doit être très visible depuis les aéronefs et les autres navires.'
    - 'Les RIB de sauvetage Paddle Board Overstock sont conçus de la quille au pont pour répondre à ces exigences — avec des ponts autovideurs, des coques renforcées, des ensembles de navigation et des chandeliers de remorquage de série sur les modèles de patrouille.'
content_solution:
  tagline: Notre solution
  title: 'Des RIB de sauvetage conçus sur mesure'
  subtitle: 'Chaque bateau de sauvetage Paddle Board Overstock est conçu pour respecter ou dépasser les normes SOLAS et SAR nationales.'
  list:
    - 'Pont autovideur — l''eau s''évacue automatiquement pour la stabilité pendant les opérations de récupération'
    - 'Coque en V profond renforcée — tenue en mer agitée avec un comportement prévisible à grande vitesse'
    - 'Jeu complet de feux de navigation — opérationnel de jour comme de nuit par tous les temps'
    - 'Chandelier de remorquage et ligne de remorque — prêts pour le remorquage de navires ou les opérations avec traîneau de sauvetage'
    - 'Plaques de montage d''équipement — radio, projecteur, sirène et matériel médical'
    - 'Plusieurs configurations moteur — un seul hors-bord ou redondance à double moteur'
    - 'Couleurs de flotteurs très visibles — orange, jaune ou rouge pour une visibilité maximale'
content_segments:
  tagline: Profils de sauvetage
  title: 'Solutions d''embarcations SAR<br />Par type d''organisation'
  subtitle: 'Différentes organisations de sauvetage opèrent sous des mandats, des cycles budgétaires et des environnements d''exploitation différents — des équipages côtiers bénévoles aux flottes nationales de garde-côtes. Nous configurons chaque RIB de sauvetage en fonction du profil de mission.'
  items:
    - title: 'Garde-côtes et agences SAR gouvernementales'
      subtitle: 'Responsabilité de sécurité absolue — normes de flotte critiques pour la mission'
      description: 'Les agences SAR gouvernementales portent la plus haute responsabilité de sécurité dans les opérations maritimes. Chaque embarcation doit fonctionner parfaitement dans des conditions extrêmes — une panne d''équipement pendant une mission de sauvetage n''est pas une option. Les décisions d''achat sont dictées par le coût total de possession sur 10-15 ans de service, et non par le prix initial. Les agences ont besoin de navires qui survivent à des années de patrouille côtière, respectent des normes nationales strictes et offrent des performances constantes entre des stations réparties. Un dossier de conformité complet et des contrats de service pluriannuels sont obligatoires.'
      features:
        - 'Dossier documentaire de conformité aux normes SOLAS et SAR nationales'
        - 'Parc de pièces commun à toute la flotte — réduit la complexité des stocks au niveau des stations'
        - 'Configuration à double moteur pour une redondance critique en mission'
        - 'Conception pour une durée de vie de 10-15 ans avec programmes de maintenance planifiée'
        - 'Capacité tout temps — coque en V profond renforcée pour les mers difficiles'
    - title: 'Services de maîtres-nageurs sauveteurs et de sauvetage de plage'
      subtitle: 'Opérations à lancement rapide en eaux peu profondes'
      description: 'Les services de maîtres-nageurs sauveteurs municipaux et de plage ont besoin d''embarcations à réponse rapide capables de franchir la zone de déferlement, d''opérer dans les eaux côtières peu profondes et d''atteindre nageurs ou embarcations en détresse en quelques minutes. L''équipement doit être assez léger pour être remorqué sur la plage par un petit véhicule ou à la main.'
      features:
        - 'Coque RIB à faible tirant d''eau pour les zones de déferlement et les eaux côtières'
        - 'Lancement depuis la plage possible grâce à la poignée de levage à l''avant et à la protection de quille'
        - 'Traîneau de sauvetage intégré ou plateforme pour sauveteur à l''eau'
        - 'Flotteurs orange ou jaune très visibles de série'
    - title: 'Services d''incendie et de secours'
      subtitle: 'Intégration de pompe à incendie, montage d''équipement, réponse rapide'
      description: 'Les unités maritimes de lutte contre l''incendie interviennent sur les feux de structures riveraines, les feux de navires et les incidents de sauvetage aquatique. Ces embarcations doivent transporter des pompes à incendie, des lances monitors, du stockage de tuyaux et des appareils respiratoires — le tout intégré dans une plateforme stable à réponse rapide. Les services les utilisent aussi pour la réponse aux inondations et les opérations d''entraide. L''agencement des consoles doit accueillir les commandes de pompe, les systèmes radio et l''éclairage de secours sans sacrifier l''espace de pont nécessaire à la circulation de l''équipage.'
      features:
        - 'Lance monitor de pont avant avec kit d''intégration de pompe'
        - 'Montage d''équipement dédié pour pompe à incendie, stockage de tuyaux et appareils respiratoires'
        - 'Console configurable pour commandes de pompe, radio et éclairage de secours'
        - 'Pont autovideur pour l''évacuation de l''eau d''extinction et la stabilité'
        - 'Kit opérations de nuit : projecteur, éclairage de scène, rampe de feux bleu/rouge'
    - title: 'Police maritime et sûreté portuaire'
      subtitle: 'Interdiction, patrouille, opérations d''abordage'
      description: 'Les unités de police maritime exigent des embarcations capables de poursuites à grande vitesse, d''abordage de navires suspects et de patrouilles de sûreté portuaire. Ces bateaux doivent disposer de rangements sécurisés pour le matériel d''intervention et les armes, d''une intégration de communication avec le commandement à terre et d''un espace de pont suffisant pour les équipes d''abordage. La capacité d''opérer de nuit et l''approche discrète sont essentielles pour les missions d''interdiction.'
      features:
        - 'Capacité de poursuite à grande vitesse — coque planante avec vitesse de pointe de plus de 40 nœuds'
        - 'Armoire à armes sécurisée et compartiments de rangement pour le matériel d''intervention'
        - 'Intégration console pour radio police, MDT et systèmes de communication'
        - 'Kit opérations de nuit : projecteur IR, support FLIR, éclairage discret'
        - 'Plateforme d''abordage renforcée avec surface antidérapante'
        - 'Système d''éclairage de secours bleu/rouge et sirène'
    - title: 'Organisations SAR bénévoles et à but non lucratif'
      subtitle: 'Opérations côtières et lacustres communautaires financées par subventions'
      description: 'Les groupes de sauvetage communautaires opèrent sur les lacs, les rivières et les zones côtières où la couverture SAR publique est limitée. Souvent financées par des dons ou des subventions publiques, ces organisations ont besoin d''un maximum de capacité par euro — une embarcation fiable et nécessitant peu d''entretien que des bénévoles peuvent utiliser en sécurité avec une formation minimale. Les cycles de subventions imposent que les bateaux respectent les exigences réglementaires tout en restant dans des budgets fixes.'
      features:
        - 'Configuration à un seul hors-bord optimisée pour réduire les coûts d''acquisition et d''exploitation'
        - 'Construction PVC pour un entretien réduit et une réparation facile sur le terrain'
        - 'Console multifonction minimisant la complexité électronique pour les opérateurs bénévoles'
        - 'Dossier documentaire de conformité aux subventions pour les demandes de financement'
        - 'Conception légère pour un lancement depuis la plage sans remorque ni grue dédiées'
    - title: 'Sauvetage en inondation et réponse aux catastrophes'
      subtitle: 'Inondations intérieures, eaux peu profondes, environnements chargés de débris'
      description: 'Le sauvetage en inondation est un profil opérationnel distinct — les bateaux opèrent dans des zones urbaines inondées, des courants chargés de débris et des eaux extrêmement peu profondes où les obstacles immergés sont invisibles. Les opérateurs ont besoin d''embarcations capables de naviguer dans les rues inondées, de franchir les débris et d''extraire les victimes des bâtiments et des véhicules. Le faible tirant d''eau est essentiel, tout comme la capacité d''opérer dans le courant en présence de risques d''accrochage. Ces bateaux sont souvent déployés par les pompiers, la protection civile et les ONG de secours en cas de catastrophe.'
      features:
        - 'Coque à tirant d''eau ultra faible — opérationnel dans 30-50 cm d''eau'
        - 'Étrave déflectrice de débris et protection renforcée des flotteurs contre les obstacles immergés'
        - 'Pont autovideur pour l''évacuation des eaux d''inondation et la récupération des victimes'
        - 'Flotteurs orange ou jaune très visibles pour la reconnaissance aérienne'
        - 'Conception légère pour le transport par hélicoptère et le déploiement routier'
        - 'Points de levage renforcés pour les opérations de levage et de sauvetage à la corde'
