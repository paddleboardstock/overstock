hero:
  tagline: Écoles et centres de formation de sports nautiques
  title: Solutions d'équipement<br />Pour les écoles de SUP et de kayak
  subtitle: Équipement fiable de qualité commerciale pour les écoles de paddle, les cours de surf, la formation en kayak et les programmes d'éducation aux sports nautiques à toute échelle.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Planches SUP Aquafarer pour écoles et centres de formation
direct_answer: "Aquafarer fournit aux écoles de SUP et de kayak du monde entier des planches de qualité commerciale, des équipements de sécurité et des packages d'instructeur. Notre équipement est conçu pour un usage pédagogique quotidien : PVC plus épais, noyaux renforcés à points de chute et conceptions de coque stables qui donnent confiance aux débutants et fiabilité aux instructeurs. Les packages incluent une marque personnalisée, des programmes de pièces de rechange et des ressources de formation."
solution_offerings:
  - title: Forfait de démarrage scolaire
    subtitle: Pour les nouveaux programmes et les petits centres de formation
    badge: Popular
    features:
      - title: Planches pour étudiants
        description: 10 à 25 planches SUP polyvalentes ou kayaks récréatifs avec plates-formes stables pour les cours pour débutants
      - title: Planches d'instructeur
        description: Planches plus larges et plus longues avec une stabilité supplémentaire et des ponts EVA antidérapants pour le coaching
      - title: Équipement de sécurité
        description: Gilets de sauvetage, laisses, sifflets et sacs à lancer de couleurs assorties
      - title: Stockage et transport
        description: Supports à planches empilables, berceaux de kayak rembourrés et chariots de transport
      - title: Soutien au programme
        description: Modèles de cours, listes de contrôle de sécurité et guides de progression des compétences
    cta_text: Démarrer mon forfait scolaire
    cta_href: /contact
  - title: Forfait Premium Scolaire
    subtitle: Pour les écoles établies et les opérateurs multi-programmes
    badge: Best Value
    features:
      - title: Flotte complète
        description: 25 à 50 planches ou kayaks avec flotte mixte (tout autour, randonnée, tailles jeunes)
      - title: Flotte d'instructeurs
        description: 3 à 5 planches d'instructeur spécialisées avec supports de système audio intégrés
      - title: Poste de sécurité
        description: Poste d'équipement de sécurité centralisé avec VFI, radios, premiers secours et signalisation
      - title: Forfait de marque
        description: Impression complète du logo sur les planches, les pagaies, les VFI et les uniformes
      - title: Programme d'entretien
        description: Kits de maintenance trimestriels, lots de pièces de rechange et formation à la réparation
    cta_text: Composer mon forfait Premium
    cta_href: /contact
  - title: Forfait franchise scolaire
    subtitle: Pour les chaînes multi-sites et les opérateurs de franchise
    badge: Enterprise
    features:
      - title: Standardisation de la flotte
        description: Équipement identique sur tous les sites pour une expérience étudiante cohérente
      - title: Commande centrale
        description: Commandes consolidées, tarification de gros et gestion centralisée des pièces de rechange
      - title: Formation d'instructeur
        description: Certification en manutention et maintenance du matériel pour tous les instructeurs
      - title: Co-marquage
        description: Branding commun avec franchise + options de co-branding Aquafarer
      - title: Prise en charge de l'extension
        description: Consultation sur la mise à l'échelle, prévision des équipements et configuration d'un nouvel emplacement
    cta_text: Discuter du plan de franchise
    cta_href: /contact
benefits:
  - title: Conçu pour l'enseignement quotidien
    description: Le PVC plus épais et les rails renforcés résistent à l'utilisation quotidienne des étudiants, aux chutes sur le sable et aux atterrissages rocheux.
    icon: tabler:shield
  - title: Plateformes d'apprentissage stables
    description: Des coques plus larges et des rockers plus plats donnent confiance aux débutants. Les instructeurs se concentrent sur l’enseignement et non sur l’équipement.
    icon: tabler:scale
  - title: Rangement et transport faciles
    description: Magasins de conception gonflable dans de petits espaces. Les planches dégonflées tiennent dans les coffres des véhicules standards pour un enseignement mobile.
    icon: tabler:box-seam
  - title: Image de marque personnalisée
    description: Logos et couleurs de l'école sur chaque planche. Votre marque, votre identité, pas du matériel de location générique.
    icon: tabler:brush
content_segments:
  tagline: Profils d'écoles
  title: Solutions d'éducation aux sports nautiques<br />Par type de programme
  subtitle: Les écoles de paddle, les académies de surf, les programmes universitaires et les opérateurs de franchise sont chacun confrontés à des défis opérationnels différents, de l'intégration des programmes à la standardisation des flottes multi-sites. Nous configurons les packs d'équipements en fonction du modèle pédagogique.
  items:
    - title: Écoles indépendantes de SUP et de kayak
      subtitle: Centres de formation gérés par leur propriétaire
      description: Écoles de petite et moyenne taille gérées par des propriétaires-instructeurs proposant des cours de SUP, des formations en kayak et des cours de certification. L'équipement doit être suffisamment durable pour un usage pédagogique quotidien, abordable pour le budget d'une petite entreprise et suffisamment polyvalent pour servir les étudiants débutants à intermédiaires dans une seule flotte.
      features:
        - Planches SUP polyvalentes stables et kayaks récréatifs pour les cours pour débutants
        - Planches spécifiques aux instructeurs avec stabilité accrue pour le coaching depuis l'eau
        - Modèles de plans de cours et guides de progression des compétences inclus
        - Programme annuel de renouvellement de l'équipement avec remises pour reprise
    - title: Programmes de loisirs universitaires et collégiaux
      subtitle: Flottes de loisirs étudiantes à grande échelle
      description: Départements de loisirs universitaires gérant des clubs de paddle, des programmes de location et des cours d'enseignement dans le cadre des offres de loisirs du campus. L'équipement est confronté à une utilisation maximale au cours des semestres, nécessite des systèmes d'enregistrement/départ faciles et doit résister à des niveaux de compétence variés, des étudiants débutants aux pagayeurs avancés.
      features:
        - Construction PVC de haute durabilité conçue pour les cycles d'utilisation institutionnelle
        - Flottes codées par couleur selon le niveau de compétence pour une gestion facile
        - Compatibilité avec les systèmes de suivi d'inventaire par RFID ou autocollants
        - Tarifs de gros avec commandes et conditions de paiement semestrielles
    - title: Écoles et académies de surf
      subtitle: Programmes d'enseignement du surf côtier
      description: "Écoles de surf enseignant les compétences en SUP surf, en prone paddle et en surf kayak dans les environnements océaniques. L'équipement doit résister aux conditions de la zone de surf : résistance aux chocs, tolérance au sable et à l'eau salée et rotation et retour faciles entre les cours horaires."
      features:
        - Formes spécifiques au surf avec rails renforcés et construction résistante aux chocs
        - Options d'ailerons souples et laisses enroulées pour la sécurité des étudiants
        - Tissu à rinçage rapide qui sèche entre les rotations de cours
        - Programme de remplacement de flotte avec inspection et renouvellement en fin de saison
    - title: Franchise et chaînes multi-emplacements
      subtitle: Équipement standardisé sur tous les sites
      description: "Opérateurs multisites proposant des programmes de formation standardisés dans plusieurs villes ou régions. La cohérence de la flotte entre les sites est primordiale : chaque étudiant doit bénéficier de la même expérience en matière d'équipement, quel que soit le site de franchise qu'il visite. La commande centralisée, l’uniformité de la marque et la prise en charge de la mise à l’échelle sont essentielles."
      features:
        - Spécifications de flotte identiques dans tous les sites de franchise
        - Commande consolidée centralisée avec tarifs de volume
        - 'Options de co-branding : marque de franchise + co-branding Aquafarer'
        - 'Kit de lancement d''un nouveau site : équipement, signalétique et stock d''ouverture'
cta:
  title: Prêt à équiper votre école ?
  subtitle: Contactez notre équipe pour un plan d’équipement personnalisé. Nous travaillons avec des écoles de toutes tailles.
  actions:
    - variant: primary
      text: Parlez à notre équipe
      href: /contact
    - text: Voir le catalogue de produits
      href: /products
