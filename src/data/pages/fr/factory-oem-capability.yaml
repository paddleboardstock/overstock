hero:
  tagline: Fabrication OEM/ODM
  title: Fabrication OEM & Marque Privée
  subtitle: Du concept au conteneur — personnalisez chaque détail de votre gamme d'embarcations gonflables

intro: Paddle Board Overstock propose des services OEM et ODM complets pour les marques, distributeurs et agences gouvernementales du monde entier. Avec plus de 10 ans d'expérience à l'export et une usine certifiée ISO 9001 & BSCI de 12,000 m², nous gérons tout, de la conception produit et du développement de moules à la production à grande échelle, l'emballage et la logistique.

