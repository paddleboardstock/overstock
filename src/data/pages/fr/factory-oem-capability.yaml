services:
  - title: Conception Produit & Ingénierie
    description: Notre équipe R&D interne travaille à partir de votre concept ou de votre cahier des charges pour développer des plans CAO, des modèles 3D et des prototypes. Nous proposons la conception de moules, l'optimisation des formes de coque et des conseils sur la sélection des matériaux.
  - title: Marque & Graphiques Personnalisés
    description: Impression numérique pleine couleur, sérigraphie, gaufrage et options d'étiquettes. Nous développons des graphiques de pont spécifiques à la marque, un marquage des flotteurs et un emballage prêt pour la vente au détail.
  - title: Personnalisation des Matériaux & Spécifications
    description: Choisissez parmi le PVC (standard, écologique, ignifugé), l'Hypalon/CSM, le drop-stitch et les constructions hybrides. Couleurs de flotteurs personnalisées, grammages de tissu et options de renforcement.
  - title: Emballage & Logistique
    description: Emballage de détail personnalisé, cartons marque privée, emballage sous vide, palettisation et chargement en conteneur. Conditions d'expédition FOB Qingdao, CIF ou DDP disponibles.

