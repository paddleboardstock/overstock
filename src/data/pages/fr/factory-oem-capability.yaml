why_us:
  - title: Intégration Verticale
    description: Nous possédons notre usine, nos moules et notre chaîne d'approvisionnement — pas d'intermédiaires, pas de sous-traitants. Cela nous donne un contrôle total sur la qualité, les coûts et les délais.
  - title: Double Certification
    description: Management de la qualité ISO 9001 et certification de conformité sociale BSCI. Rapports d'audit d'usine disponibles sur demande.
  - title: Conformité CE
    description: Tous les modèles standard portent la certification CE 2013/53/EU. Les modèles personnalisés peuvent être certifiés CE via notre processus établi.
  - title: MOQ Faible
    description: Commencez avec seulement 5 unités pour les modèles standard. Nous aidons les marques émergentes à se lancer sans surcharger leurs stocks.