hero:
  tagline: Afrique du Sud
  title: Conseils en gros SUP pour<br />Commerçants de détail sud-africains
  subtitle: Boutiques et opérateurs de Cape Town, Durban et de la Garden Route — planches à pagaie neuves en surplus à partir de 5 unités, modèles variés, expédiées de Chine.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Planches en surplus SUP pour les détaillants et opérateurs sud-africains
direct_answer: Paddle Board Overstock fournit des planches à pagaie gonflables neuves en surplus aux entreprises sud-africaines — boutiques et écoles à Cape Town, Durban et le long de la Garden Route, opérateurs de location et vendeurs en ligne. Les commandes en gros commencent à partir de 5 planches avec des modèles mélangés dans un seul envoi, expédiées depuis Weihai, Chine par fret aérien express ou fret maritime consolidé. Chaque planche est testée à 100 % sous pression et couverte par la garantie SUP de 2 ans.
tldr_points:
  - Vente en gros à partir de 5 cartes — modèles mixtes, tarifés par quantité totale
  - Desservir le marché de détail des sports de glisse le plus établi d'Afrique
  - Fret aérien express ou maritim consolidé depuis Weihai, Chine
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le Marché SUP Sud-Africain
  paragraphs:
    - L'Afrique du Sud possède le marché des sports de glisse le plus mature du continent. Cape Town combine des parcours de downwind de classe mondiale et des lagunes d'eau calme avec une culture du surf profonde ; Durban offre des plages à eau chaude toute l'année ; les lagunes de Knysna et Plettenberg Bay sur la Garden Route sont parfaites pour la pagaie de loisir. Une infrastructure de détail bien établie et une véritable communauté locale de pagayeurs — des surfeurs SUP aux pagayeurs de fitness sur eau plate — distinguent ce marché.
    - Buyers here are seasoned: Boutiques de surf avec de véritables surfaces de vente, écoles de pagaie avec flottes, et opérateurs d'aventure combinant SUP avec kayak et circuits à vélo. Ils évaluent le matériel comme des professionnels — construction, garantie et réparabilité — et commandent par petites quantités réfléchies de 5 à 20 planches, mélangeant des modèles polyvalents pour la location avec des éditions premium pour le mur de vente.
  customer_types:
    - title: Boutiques de Surf & Paddle
      description: Détaillants établis de Cape Town et Durban ajoutant ou étendant les lignes SUP pour la communauté locale de pagayeurs.
    - title: Écoles de Pagaie & Locations
      description: Écoles et flottes de location sur les lagunes et plages à eau calme renouvelant leurs planches selon un véritable cycle de remplacement.
    - title: Opérateurs d'Aventure
      description: Opérateurs de la Garden Route et du Cap-Occidental ajoutant SUP à leurs offres d'aventure multi-activités.
shipping_section:
  title: Expédition vers l'Afrique du Sud
  paragraphs:
    - Les commandes sont expédiées depuis Weihai, Chine. Le fret aérien express transporte les échantillons et les commandes de 1 à 3 planches vers Johannesburg et Cape Town ; le fret maritime consolidé dessert les commandes en gros de 5 à 20 planches à travers Durban, Cape Town et d'autres ports. Les estimations de transit pour votre destination sont incluses dans votre devis.
    - Nous fournissons la facture commerciale et la liste de colisage nécessaires pour le dédouanement, avec les codes SH corrects et les valeurs déclarées. Les droits d'importation et la TVA sont à la charge de l'importateur selon la réglementation sud-africaine.
  customs_note: Le dédouanement SARS est basé sur la documentation — confirmez le traitement actuel des droits et de la TVA pour le matériel sportif gonflable avec votre agent en douane avant de commander. Nous fournissons des documents complets et cohérents et répondons rapidement aux demandes du courtier.
faq_section:
  title: FAQ Afrique du Sud
  items:
    - q: Les planches conviennent-elles aux conditions mixtes de Cape Town ?
      a: Oui. Les modèles polyvalents conviennent à l'eau plate des lagunes et aux journées calmes sur la côte, et la gamme comprend des planches orientées touring pour des pagayages plus longs. Pour les parcours de downwind en pleine mer, les pagayeurs expérimentés doivent discuter de leur cas d'utilisation spécifique avec nous avant de commander.
    - q: À quoi ressemble une commande de boutique ?
      a: 'Typiquement 5 à 20 planches : une base de modèles polyvalents pour les cours et les locations plus des éditions artistiques premium pour le mur de vente — modèles mélangés, un seul envoi, prix basé sur la quantité totale.'
    - q: Comment le fret est-il estimé pour l'Afrique du Sud ?
      a: Expédiez par avion vers Johannesburg ou Le Cap pour les échantillons et petites commandes ; fret maritime consolidé vers Durban ou Le Cap pour les quantités en gros. Les deux sont détaillés dans votre devis avec les délais de transit estimés.
    - q: Qui s'occupe des droits d'importation et de la TVA ?
      a: C'est vous, en tant qu'importateur, via votre agent en douane conformément aux règles de la SARS. Nous fournissons la facture commerciale et la liste de colisage avec les codes SH corrects et les valeurs déclarées.
