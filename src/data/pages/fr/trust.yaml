features3_lab:
  title: Laboratoire d'essais & qualité interne
  subtitle: >-
    Chaque lot de matériau et chaque produit fini passe par notre laboratoire d'essais sur site avant
    expédition.
  columns: 3
  isBeforeContent: true
  items:
    - title: Essai de résistance à la traction
      description: >-
        Chaque rouleau de tissu PVC est testé selon ASTM D751. Exigence minimale : 350 N/cm en chaîne
        et en trame. Les lots refusés sont renvoyés au fournisseur — nous rejetons environ 3 % des
        matières entrantes.
      icon: tabler:scale
    - title: Vieillissement accéléré UV
      description: >-
        Des échantillons de tissu subissent 1 000 heures d'exposition QUV (ASTM G154). La rétention
        de résistance à la traction doit dépasser 80 % après exposition UV. Produits conçus pour 3+
        ans d'usage extérieur.
      icon: tabler:sun
    - title: Résistance au pelage des soudures
      description: >-
        Soudures HF testées à 5 N/mm minimum (ASTM D751). Coutures Hypalon collées à la main testées
        à 3,5 N/mm. Chaque lot de production fait l'objet d'échantillons de couture testés de manière
        destructive et archivés.
      icon: tabler:stack
    - title: Maintien en pression 24–48 h
      description: >-
        Chaque produit gonflable est gonflé à 1,25× la pression nominale et surveillé pendant 24–48
        heures. Chute de pression maximale admissible : 5 %. Les produits échouant à ce test sont
        repris et retestés avant expédition.
      icon: tabler:wind
    - title: Essai de cycles de valve
      description: >-
        Chaque conception de valve subit 10 000 cycles ouverture-fermeture en laboratoire. Les valves
        doivent rester étanches à 1,25× la pression nominale après cyclage. Toutes les valves
        Paddle Board Overstock sont conçues pour 5+ ans d'usage régulier.
      icon: tabler:rotate
    - title: Résistance au froid
      description: >-
        Matériaux testés à -30 °C pendant 4 heures selon ISO 4646. Aucune fissuration ni
        fragilisation admise. Produits adaptés au stockage hivernal et à l'utilisation en eau froide
        jusqu'à -10 °C de température ambiante.
      icon: tabler:snowflake

steps2_manufacturing:
  title: 'Comment nous garantissons la qualité'
  subtitle: "De l'inspection des matières premières au test de pression final — chaque produit passe par une chaîne qualité rigoureuse."
  items:
    - title: 'Inspection Matières Premières'
      description: "Chaque rouleau de tissu PVC est testé pour l'épaisseur, la résistance à la traction et la résistance UV avant d'entrer en production."
      icon: 'tabler:search'
    - title: 'CQ en Cours de Process'
      description: "Les soudures, installations de valves et liaisons de chambres sont inspectées à chaque poste durant l'assemblage."
      icon: 'tabler:eye'
    - title: 'Test de Pression'
      description: "Chaque produit gonflable est gonflé à 1,25x la pression nominale et maintenu 24-48 heures pour vérifier la rétention d'air et l'intégrité des joints."
      icon: 'tabler:wind'
    - title: 'Inspection Finale'
      description: "Chaque unité est inspectée pour la finition, la quincaillerie et l'emballage avant d'être approuvée pour expédition. Des échantillons de lots vont au laboratoire pour tests destructifs."
      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'FAQ Bateaux RIB'
  subtitle: 'Questions courantes sur nos bateaux gonflables à coque rigide.'
  columns: 2
  items:
    - title: 'Quelles tailles de RIB Paddle Board Overstock propose-t-il ?'
      description: 'Nous proposons 35 modèles RIB de 2,5 m à 7,6 m, couvrant des annexes compactes aux bateaux de travail et de patrouille lourds. Chaque modèle est disponible avec plusieurs options de configuration.'
    - title: 'Quelle est la différence entre un RIB et un bateau gonflable traditionnel ?'
      description: "Un RIB (Rigid-Hull Inflatable Boat) combine une coque solide en fibre de verre ou aluminium en forme de V profond avec des tubes gonflables en Hypalon ou PVC. Cela offre la stabilité et la capacité de charge d'un bateau rigide avec l'absorption des chocs et la flottabilité d'un gonflable."
    - title: 'Quels moteurs sont compatibles avec les RIB Paddle Board Overstock ?'
      description: "Nos RIB supportent des moteurs hors-bord de 3 CV à 250 CV selon le modèle. Chaque page produit liste la puissance moteur maximale. Nous recommandons de consulter votre revendeur pour l'association idéale."
    - title: 'Les RIB Paddle Board Overstock sont-ils certifiés CE ?'
      description: 'Oui. Tous les modèles RIB loisirs sont certifiés CE selon les normes européennes applicables pour les embarcations de loisir. Les modèles commerciaux et de patrouille répondent à des exigences supplémentaires de stabilité et de charge.'
    - title: 'Quelle est la garantie sur les bateaux RIB ?'
      description: "Tous les RIB Paddle Board Overstock sont livrés avec une garantie standard d'un an contre les défauts de fabrication, couvrant le délaminage de coque, la défaillance des joints de tubes, les défauts de valves et les problèmes de quincaillerie."
    - title: 'Combien de chambres à air les RIB Paddle Board Overstock ont-ils ?'
      description: 'Nos RIB disposent de 3 à 7 chambres à air indépendantes selon la longueur du modèle. Cette conception multi-chambres garantit que le bateau reste à flot même si un compartiment est compromis.'

faqs_inflatable:
  title: 'FAQ Bateaux Gonflables'
  subtitle: 'Questions courantes sur nos annexes, kayaks et bateaux gonflables.'
  columns: 2
  items:
    - title: 'Quels matériaux sont utilisés dans les bateaux gonflables Paddle Board Overstock ?'
      description: "Nous utilisons du PVC de qualité militaire (1100 deniers) et du caoutchouc Hypalon/CSM premium selon le modèle. Les deux matériaux sont stabilisés aux UV, résistants à l'abrasion et conformes aux règlements UE REACH et RoHS."
    - title: 'Combien de temps durent les bateaux gonflables ?'
      description: 'Avec un entretien approprié, un bateau gonflable en PVC de qualité dure 7 à 10 ans, tandis que les modèles Hypalon peuvent durer 15 à 20 ans. Un nettoyage régulier, une protection UV et un stockage approprié prolongent considérablement la durée de vie.'
    - title: 'Quel entretien est requis pour un bateau gonflable ?'
      description: "L'entretien de base inclut le rinçage à l'eau douce après chaque utilisation (surtout en eau salée), le séchage avant stockage, la vérification annuelle des joints de valve et l'application de protection UV sur les tubes. Évitez l'exposition prolongée au soleil lorsqu'il n'est pas utilisé."
    - title: 'Les bateaux gonflables peuvent-ils être utilisés en eau salée ?'
      description: "Oui. Tous les bateaux gonflables Paddle Board Overstock sont conçus pour une utilisation en eau douce et salée. Nous recommandons de rincer à l'eau douce et de sécher complètement après une exposition à l'eau salée pour éviter la corrosion des ferrures et la cristallisation du sel dans le tissu."
    - title: 'Comment stocker un bateau gonflable ?'
      description: "Dégonflez, nettoyez et séchez complètement le bateau avant stockage. Roulez-le sans serrer (évitez les plis serrés), stockez dans un endroit frais et sec à l'abri du soleil, et évitez les sols en béton pour empêcher la remontée d'humidité."
    - title: 'Quelle est la capacité de poids des bateaux gonflables Paddle Board Overstock ?'
      description: 'Les capacités de poids vont de 290 kg pour nos plus petits modèles à plus de 2000 kg pour les grandes embarcations commerciales. Chaque page produit liste la charge maximale pour votre modèle spécifique.'

faqs_sup:
  title: 'FAQ Planches SUP'
  subtitle: 'Questions courantes sur nos planches de stand-up paddle.'
  columns: 2
  items:
    - title: 'Quelles tailles de planches SUP sont disponibles ?'
      description: "Nous proposons des planches SUP de 9 pi à 12 pi, incluant des designs polyvalents, de randonnée, yoga et spécialisés. Nos modèles les plus vendus incluent la Tropical Breeze (10 pi) et l'Ocean Voyager (11 pi)."
    - title: "Qu'est-ce que la construction drop-stitch ?"
      description: "La construction drop-stitch utilise des milliers de fils polyester reliant les couches supérieure et inférieure de la planche, lui permettant de maintenir une pression d'air élevée (15–20 PSI) et d'offrir une plateforme rigide et stable. C'est la norme industrielle pour les SUP gonflables premium."
    - title: 'Quelle est la limite de poids pour les planches SUP ?'
      description: "Nos planches SUP supportent jusqu'à 150 kg selon le modèle et le volume. La Leviathan Wake est notre modèle à plus haute capacité, conçu pour les gabarits plus lourds et l'utilisation en yoga."
    - title: 'Proposez-vous des kits SUP complets ?'
      description: "Oui. Chaque planche SUP est livrée avec un kit complet incluant une pagaie aluminium 3 pièces, une pompe manuelle haute pression, une laisse spirale, un sac à dos de voyage et un kit de réparation. Certains modèles incluent également un jeu d'ailerons amovibles."
    - title: 'Quelle est la garantie sur les planches SUP ?'
      description: "Toutes les planches SUP Paddle Board Overstock bénéficient d'une garantie d'un an contre les défauts de fabrication, incluant la défaillance des joints, les défauts de valves et le délaminage des matériaux en usage normal."
    - title: 'Combien de temps faut-il pour gonfler une planche SUP ?'
      description: 'Avec la pompe manuelle fournie, un gonflage complet à 15 PSI prend environ 8 à 12 minutes. Pour un gonflage plus rapide, nous recommandons notre pompe électrique Paddle Board Overstock 12V, qui gonfle une planche en moins de 4 minutes.'

