features3_certifications:
  title: Qualité et tests
  subtitle: Chaque carte est testée dans notre propre laboratoire avant son expédition — chiffres réels, enregistrements réels, aucune affirmation marketing.
  columns: 3
  isBeforeContent: true
  items:
    - title: Construit dans notre propre usine
      description: Nous possédons et exploitons une usine Weihai de 12 000 m². Chaque lot de production est traçable, documenté et inspecté — sans fabrication mystère externalisée.
      icon: tabler:building-factory
    - title: Laboratoire d’essais de matériaux
      description: Le laboratoire interne des matériaux teste la résistance à la traction, UV la résistance, l’intégrité des coutures et l’abrasion pour chaque lot de tissu avant la production.
      icon: tabler:microscope
    - title: Matériaux de qualité marine
      description: UV- PVC stabilisés, drop-stitch cœurs et EVA mousse de terrasse — choisis et testés pour les saisons de soleil, de sel et d’abus.
      icon: tabler:flask
    - title: Garantie de 2 ans SUP
      description: Paddle Board Overstock SUP Les planches bénéficient d’une garantie de 2 ans contre les défauts de fabrication, y compris les joints, les vannes et la délamination des matériaux. Nous garantissons ce que nous construisons.
      icon: tabler:shield-check
testimonials:
  tagline: Confiance client
  title: Ce que disent nos clients
  subtitle: Des pagayeurs débutants aux explorateurs chevronnés — voyez pourquoi ils font Paddle Board Overstock confiance.
  items:
    - content: En tant qu’acheteur pour la première fois, j’étais nerveux à l’idée de commander à l’étranger. L’équipe a répondu à toutes les questions avec de vraies photos et des dossiers de test avant même que je ne pose la question. Le conseil est arrivé en 6 jours et a dépassé mes attentes.
      name: James Thornton
      title: SUP Propriétaire d’Explorer 11 — Vancouver, Canada
features3_lab:
  title: Laboratoire interne de tests et qualité
  subtitle: Chaque lot de matériau et produit fini passe par notre laboratoire d’essais sur site avant d’être expédié.
  columns: 3
  isBeforeContent: true
  items:
    - title: Essai de résistance à la traction
      description: 'Chaque PVC rouleau de tissu est testé en interne pour sa résistance à la traction. Exigence minimale : 350 N/cm de chaîne et de trame. Les lots rejetés sont retournés au fournisseur — nous rejetons environ 3 % des matériaux entrants.'
      icon: tabler:scale
    - title: UV Vieillissement accéléré
      description: Les échantillons de tissu subissent une vieillissement accélérée de 1 000 UV heures. La résistance à la traction doit retenir 80+ % après exposition. Produits conçus pour 3+ ans d’utilisation en extérieur.
      icon: tabler:sun
    - title: Résistance au peeling de la couture
      description: Les joints soudés sont testés jusqu’à une résistance minimale au décollement de 5 N/mm. Chaque lot de production a des échantillons de joints testés et archivés de manière destructive.
      icon: tabler:stack
    - title: Maintien de pression de 24 à 48 heures
      description: 'Chaque produit gonflable gonflé à 1,25x de la classification PSI et surveillé pendant 24 à 48 heures. Perte de pression maximale autorisée : 5 %. Les produits qui échouent à ce test sont retravaillés et testés à nouveau avant l’expédition.'
      icon: tabler:wind
    - title: Essais du cycle des soupapes
      description: Chaque conception de vanne subit 10 000 cycles ouvert-fermement dans notre laboratoire. Les vannes doivent maintenir une étanchéité hermétique à 1,25 fois la pression nominale après cycles. Toutes Paddle Board Overstock les vannes sont homologuées pour 5+ ans d’utilisation régulière.
      icon: tabler:rotate
    - title: Résistance aux fissures froides
      description: Les matériaux sont testés à -30°C pendant 4 heures. Aucune fissuration ni fragilité autorisée. Les produits sont conçus pour le stockage hivernal et l’utilisation en eau froide jusqu’à -10°C à température ambiante.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Comment garantir la qualité
  subtitle: De l’inspection des matières premières aux tests de pression finaux — chaque produit passe par une chaîne de qualité rigoureuse.
  items:
    - title: Inspection des matières premières
      description: Chaque rouleau de PVC tissu est testé pour son épaisseur, sa résistance à la traction et UV sa résistance avant d’entrer en production.
      icon: tabler:search
    - title: Contrôle qualité en cours de traitement
      description: Les joints de soudure, les installations de vannes et les liaisons de chambre sont inspectés à chaque station lors de l’assemblage.
      icon: tabler:eye
    - title: Test de pression
      description: Chaque produit gonflable est gonflé à 1,25x de la classification PSI et maintenu pendant 24 à 48 heures pour vérifier la rétention d’air et l’intégrité des joints.
      icon: tabler:wind
    - title: Inspection finale
      description: Chaque unité est inspectée pour la finition, la quincaillerie et l’emballage avant d’être approuvée pour l’expédition. Les échantillons de lots sont envoyés à notre laboratoire pour des essais destructifs.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP FAQ sur les conseils
  subtitle: Questions fréquentes sur nos planches de paddle debout.
  columns: 2
  items:
    - title: Quelles SUP tailles de plateau sont disponibles ?
      description: Nous proposons SUP des planches allant de 9 ft à 12 ft, incluant des modèles polyvalents, de tourisme, de yoga et des designs spécialisés. Nos modèles les plus vendus incluent le Tropical Breeze (10 ft) et l’Ocean Voyager (11 ft).
    - title: Qu’est-ce que drop-stitch la construction ?
      description: Drop-stitch La construction utilise des milliers de filets en polyester reliant les couches supérieure et inférieure de la planche, lui permettant de supporter une haute pression d’air (15–20 PSI) et d’obtenir une plateforme rigide et stable. C’est la norme industrielle pour les modèles gonflables haut SUPs de gamme.
    - title: Quelle est la limite de poids pour SUP les planches ?
      description: Nos SUP planches supportent jusqu’à 150 kg selon le modèle et le volume. La Leviathan Wake Board est notre modèle le plus performant, conçu pour les riders plus grands et l’utilisation du yoga.
    - title: SUP Proposez-vous des forfaits complets ?
      description: Oui. Chaque SUP planche est livrée avec un ensemble complet comprenant une pagaie en aluminium en 3 parties, une pompe manuelle haute pression, une laisse à ressorts, un sac à dos de voyage et un kit de réparation. Certains modèles incluent également un ensemble de dérives amovibles.
    - title: Quelle est la garantie sur SUP les planches ?
      description: Toutes Paddle Board Overstock SUP les cartes bénéficient d’une garantie de 2 ans contre les défauts de fabrication, y compris la rupture des joints, les défauts de vannes et la délamination des matériaux en usage normal.
    - title: Combien de temps faut-il pour gonfler une SUP planche ?
      description: Avec la pompe manuelle incluse, un gonflage complet jusqu’à 15 PSI dure environ 8 à 12 minutes. Pour un inflation plus rapide, nous recommandons notre Paddle Board Overstock pompe électrique 12V, qui gonfle une planche en moins de 4 minutes.
