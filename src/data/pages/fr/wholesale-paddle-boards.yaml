who_section:
  tagline: Qui nous fournissons
  title: Construit pour les entreprises indépendantes de sports nautiques
  items:
    - title: Magasins de plage et de surf
      description: Petits détaillants côtiers qui ont besoin de 5 à 15 planches par saison, mélangées entre des modèles polyvalents pour les touristes et des planches de style surf pour les locaux.
    - title: Vendeurs en ligne
      description: Les magasins de commerce électronique et les vendeurs sur les places de marché testant la catégorie SUP sans s'engager à acheter un conteneur complet d'un seul modèle.
    - title: Flottes de location et écoles
      description: Opérations de location et SUP écoles complétant les flottes — planches durables, modèles mixtes pour servir différentes tailles de clients, et support de garantie.
    - title: Stations et voyagistes
      description: Hôtels, stations insulaires et voyagistes ajoutant SUP à leur gamme d'activités avec de petites flottes initiales et un réapprovisionnement saisonnier facile.
how_to_order:
  tagline: Comment ça marche
  title: Comment passer une commande en gros
  steps:
    - title: Parcourir l'inventaire
      description: Examinez les 11 modèles en stock ci-dessus ou utilisez le sélecteur de modèles mixtes pour créer une combinaison adaptée à vos clients.
    - title: Demander un devis
      description: Envoyez-nous les modèles, les quantités estimées, votre pays et la vitesse d'expédition préférée en utilisant le formulaire de demande ci-dessous. Nous répondons avec les prix unitaires et les options d'expédition.
    - title: Confirmer et Payer
      description: Approuvez le devis final — modèles, quantités, mode de transport, et total. Les conditions de paiement sont confirmées lors du devis.
    - title: Nous Testons, Emballons et Expédions
      description: Chaque planche est testée à 100 % sous pression, emballée avec son kit complet d'accessoires, et envoyée depuis Weihai. Vous recevez un suivi pour tout le trajet.
