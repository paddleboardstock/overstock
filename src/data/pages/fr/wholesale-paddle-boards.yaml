faq_section:
  title: FAQ Grossiste
  items:
    - q: Quelle est la commande minimale pour le gros ?
      a: Cinq planches. Notre modèle de surstock est conçu pour les petits détaillants — vous n'avez pas besoin de remplir un conteneur pour obtenir le tarif de gros.
    - q: Puis-je mélanger différents modèles SUP dans une même commande en gros ?
      a: Oui. Les commandes de modèles mixtes sont l'un des plus grands avantages de l'achat de stock en surplus — combinez tous les modèles en stock dans un seul envoi, et le nombre total de planches détermine votre niveau de tarification. Voir notre page de gros pour modèles mixtes pour plus de détails.
    - q: Est-ce que les planches sont toutes neuves ?
      a: Oui. Chaque carte est entièrement neuve, un surplus d'inventaire inutilisé — jamais des secondes, des reconditionnées ou des retours clients. Chaque carte est testée à 100 % sous pression avant expédition.
    - q: Combien moins cher le gros est-il que le détail ?
      a: Les prix unitaires de gros sont indiqués par commande en fonction des modèles et des quantités, et sont sensiblement inférieurs aux prix de détail indiqués ci-dessus. Demandez un devis pour votre combinaison cible et nous le tariferons exactement.
    - q: Quelle méthode d'expédition devrais-je choisir ?
      a: Le fret aérien express convient aux 1–3 planches, aux échantillons et aux réassorts urgents. Le fret maritime groupé est le choix économique pour les commandes de détaillants de 5–20 planches. Nous proposons les deux options à chaque demande de devis.
    - q: Quelle garantie les cartes en gros offrent-elles ?
      a: La même garantie de 2 ans SUP que nous offrons à chaque client, dans chacun des 50+ pays vers lesquels nous expédions.
    - q: Expédiez-vous dans mon pays ?
      a: Nous expédions actuellement dans plus de 50 pays, avec des guides régionaux pour l'Amérique latine, l'Asie du Sud-Est, l'Afrique, le Moyen-Orient, et des marchés clés incluant le Mexique, le Brésil, les Philippines, l'Indonésie, la Thaïlande, l'Afrique du Sud, le Kenya et les Émirats arabes unis. Demandez-le dans votre demande de devis et nous confirmerons le service actuel à votre adresse.
