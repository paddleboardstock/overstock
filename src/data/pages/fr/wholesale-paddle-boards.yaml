hero:
  tagline: Conseils de vente en gros SUP
  title: Paddle boards gonflables en gros<br />pour les petites entreprises
  subtitle: Des planches neuves en surstock SUP en quantités adaptées aux petites entreprises. Commandez 5 à 20 planches, mélangez n’importe quels modèles dans une seule cargaison, et choisissez un transport express aérien ou maritime vers 50+ pays.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Planches gonflables en gros SUP Paddle Board Overstock prêtes à l’expédition
direct_answer: Paddle Board Overstock Fournit des planches gonflables neuves SUP en surstock aux petits détaillants du monde entier. Il n’y a pas de commande minimale importante — une commande en gros commence à seulement 5 planches, et vous pouvez mixer n’importe quel modèle en stock en une seule commande. Les planches sont expédiées depuis notre base de Weihai, en Chine, par fret express aérien (1 à 3 planches, échantillons ou réapprovisionnements urgents) ou par fret maritime consolidé (5 à 20 commandes de détaillants de planches). Chaque planche est testée à 100 % sous pression avant l’expédition et couverte par notre garantie de 2 ans SUP .
tldr_points:
  - 'Faible MOQ: les commandes en gros commencent à 5 plateaux — dimensionnés pour les petites boutiques, pas pour des conteneurs'
  - 'Commandes de modèles mixtes : combinez tous SUP les modèles en stock dans une seule livraison'
  - 'Deux options d’expédition : fret aérien express pour 1 à 3 embarquements, fret maritime pour 5 à 20 commandes de bord'
  - 'Stock tout neuf : 100 % testé sous pression, taux de réussite à l’inspection finale de 99,3 %, garantie de 2 ans SUP'
why_retailers:
  title: Pourquoi les petits détaillants choisissent SUP les planches de surstock
  subtitle: Vous n’avez pas besoin d’un entrepôt ou d’un budget pour conteneurs pour acheter à prix de gros.
  items:
    - title: Quantités favorables aux petites entreprises
      description: Le gros traditionnel demande des centaines d’unités par commande. Notre modèle de surstock est conçu pour les boutiques indépendantes — commencez avec 5 planches et augmentez votre commande au fur et à mesure que votre magasin grandit.
    - title: Vrai prix de gros sans engagement de volume
      description: Parce que nous vendons des stocks excédentaires — production excédentaire et stock soigneusement sélectionné auprès d’usines partenaires sélectionnées — vous obtenez une tarification unitaire au niveau du volume sans le risque de volume.
    - title: Mélangez les modèles pour correspondre à vos clients
      description: Les boutiques de plage, les boutiques de vêtements sur les lacs et les magasins de la ville servent différents pagayeurs. Mélangez des modèles polyvalents, de tourisme et de style surf SUP en une seule commande pour que votre étagère corresponde à la demande locale.
    - title: Tout neuf, jamais utilisé
      description: Chaque planche de notre stock excédentaire est neuve et inutilisée — ni quelques secondes, ni retours. Chaque planche est testée à 100 % sous pression avant de quitter l’entrepôt.
    - title: Expédition internationale rapide et flexible
      description: Le fret aérien express reçoit rapidement 1 à 3 commandes de bord ou d’échantillons à votre porte ; le fret maritime consolidé maintient le coût par planche bas sur 5 à 20 commandes de détaillants de tableaux.
    - title: Garanti par une vraie garantie
      description: Wholesale ne signifie pas non supporté. Chaque SUP carte bénéficie de notre garantie de 2 ans SUP , la même couverture que nous offrons à chaque client dans 50+ pays.
pricing_section:
  tagline: Prix ​​de gros
  title: Prix de gros simple et transparent
  subtitle: Le prix est proposé par commande en fonction des modèles, des quantités et du mode d’expédition que vous choisissez. Aucun frais caché — le devis que vous recevez correspond au prix que vous payez.
  points:
    - title: Classé par quantité
      description: Les prix des unités diminuent à mesure que la taille des commandes augmente. Une commande de 10 conseils coûte mieux par conseil qu’une commande de 5 ; une commande de 20 conseils encore meilleur.
    - title: Les modèles mixtes comptent pour un total
      description: Votre niveau de réduction est basé sur le nombre total de cartes dans la commande — pas par modèle. Mélanger 4 modèles différents × 3 cartes chacun compte comme une commande de 12 cartes.
    - title: Cité avec options d'expédition
      description: Chaque devis inclut à la fois des options de fret express et maritime avec des délais de transit estimés, afin que vous puissiez choisir l'équilibre entre rapidité et coût qui correspond à votre calendrier de réapprovisionnement.
    - title: Aucun compte ou abonnement requis
      description: Il n'y a pas de club de vente en gros auquel adhérer et pas de frais annuel. Demandez un devis, confirmez la commande, et nous expédions.
