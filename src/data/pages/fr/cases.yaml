features3_cases:
  tagline: Cas en vedette
  title: Solutions personnalisées<br />Pour de vrais défis
  isBeforeContent: false
  columns: 3
  items:
    - title: Mise à niveau des opérations quotidiennes du centre de plongée de Bali
      customer: Centre de plongée Océan Bleu
      country: Indonésie
      industry: Centre de plongée commerciale
      challenge: Le centre de plongée Blue Ocean à Bali exploitait un ancien bateau de plongée en fibre de verre avec un espace de pont limité, un embarquement difficile pour les plongeurs et un entretien élevé dans des conditions d'eau salée tropicale. Le chargement de l'équipement était bondé, le temps de préparation était long et la plate-forme instable créait des problèmes de sécurité pour les touristes internationaux, y compris les plongeurs débutants et les voyageurs plus âgés. Le centre organise 3 à 5 sorties de plongée par jour, plus de 200 jours par an.
      solution: Paddle Board Overstock a fourni un RIB de plongée professionnel personnalisé de 6,8 m avec une disposition de pont étendue optimisée pour le stockage de l'équipement de plongée, une large échelle de plongée en acier inoxydable, des tubes Hypalon robustes pour la résistance aux UV et à l'eau salée, une surface de pont antidérapante et une solution de stockage de réservoir. La configuration a été conçue autour du flux de travail quotidien du centre de plongée, et non sur la base d'une configuration standard d'un bateau de plaisance.
      product: Plongée professionnelle 6,8 m RIB
      results: Une zone de travail plus grande améliore l’efficacité de la préparation des équipements. Les plongeurs ont pu embarquer plus facilement et en toute sécurité. Les besoins en maintenance ont été considérablement réduits. Le centre a gagné en capacité de gérer davantage de clients en haute saison avec une plus grande confiance. Le RIB est devenu la base des opérations de plongée quotidiennes.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Notre bateau de plongée n'est pas seulement un moyen de transport. C'est la base de notre fonctionnement quotidien. Paddle Board Overstock RIB donne à notre équipe plus de confiance lorsqu'elle organise plusieurs sorties de plongée chaque jour.
      icon: tabler:lifebuoy
    - title: Professionnel du centre de plongée de Phuket RIB Surclassement
      customer: Centre de plongée Ocean Explorer
      country: Thaïlande
      industry: Centre de plongée commerciale
      challenge: Le centre de plongée Ocean Explorer de Phuket, en Thaïlande, avait besoin de moderniser son bateau de plongée traditionnel en fibre de verre qui ne pouvait pas répondre à la demande croissante des clients. L'espace limité sur le pont rendait la préparation de l'équipement inefficace. L'embarquement difficile a créé des problèmes de sécurité pour les touristes internationaux. Les exigences de maintenance élevées dans des conditions d’eau salée tropicale ont augmenté les coûts d’exploitation. Le centre organise plusieurs voyages quotidiens, plus de 200 jours par an.
      solution: Paddle Board Overstock a livré un RIB de plongée commerciale personnalisé de 6,8 m avec une disposition optimisée du pont de travail pour le stockage des bouteilles de plongée, la préparation de l'équipement et le mouvement des plongeurs. Les caractéristiques comprenaient une large échelle de plongée avec des mains courantes en acier inoxydable, une construction en tube robuste avec des matériaux résistants aux UV, un sol antidérapant, une solution de stockage de réservoir, une console professionnelle et des sièges passagers, le tout configuré pour les opérations de plongée commerciales.
      product: Plongée commerciale 6,8 m RIB
      results: Une plus grande surface de pont a permis une organisation plus rapide de l'équipement et un flux de travail quotidien plus efficace. Le confort et la sécurité d’embarquement des clients se sont considérablement améliorés. Les temps d'arrêt pour maintenance ont diminué grâce à la construction de qualité marine. Le centre de plongée pourrait servir davantage de clients pendant la haute saison et étendre ses services de plongée professionnels en toute confiance.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Pour un centre de plongée, le bateau n’est pas qu’un simple moyen de transport. C'est une partie importante de notre fonctionnement quotidien. Paddle Board Overstock RIB donne à notre équipe la confiance nécessaire pour organiser plusieurs sorties de plongée chaque jour avec une meilleure sécurité et efficacité.
      icon: tabler:lifebuoy
    - title: Flotte du Centre Européen de Plongée
      customer: Centres de plongée BlueMed
      country: Grèce
      industry: Plongée et tourisme marin
      challenge: Nécessite 12 RIB configurés pour la plongée pour une chaîne de centres de plongée sur plusieurs îles grecques. Chaque bateau avait besoin d'une échelle de plongée personnalisée, d'un stockage pour 8 réservoirs et d'une plate-forme stable pour l'entrée des plongeurs en eau libre. La flotte devait arriver dans les 60 jours pour le début de la saison touristique.
      solution: Produit 12 modèles RIB 520 Dive avec supports de réservoir intégrés, échelles de plongée et tubes extra-larges Hypalon pour la stabilité à l'embarquement. Chaque bateau portait la livrée de la flotte du client. Les 12 bateaux ont été testés sous pression et expédiés à partir du Qingdao dans les 55 jours.
      product: RIB 520 Plongée
      results: Les 12 bateaux livrés à temps pour la saison touristique. La flotte est en activité quotidiennement depuis plus de 18 mois sans aucune panne matérielle. Le client a commandé 6 unités supplémentaires au cours de la deuxième année.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Le RIB 520 Dive est l'épine dorsale de nos opérations de plongée quotidiennes. La stabilité au repos est excellente et la disposition du stockage en réservoir maintient le pont propre et sûr pour nos invités.
      icon: tabler:lifebuoy
    - title: Programme de distributeur australien OEM
      customer: Pacific Watersports Pty Ltd
      country: Australie
      industry: OEM/ODM Fabrication
      challenge: Le distributeur australien avait besoin d'une gamme de cartons SUP de marque privée à des prix compétitifs pour rivaliser avec les marques chinoises destinées directement aux consommateurs. Nécessite 8 modèles uniques couvrant les niveaux débutant à avancé, avec des graphiques personnalisés, un emballage personnalisé et une livraison directe aux points de vente.
      solution: Développement de 8 modèles SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) avec un package graphique australien exclusif. Emballage de vente au détail personnalisé avec des codes QR renvoyant vers des vidéos de configuration. Logistique de livraison directe configurée à partir du Qingdao directement vers les magasins de détail australiens.
      product: Ligne SUP personnalisée (8 modèles)
      results: Concept jusqu'à la première expédition dans 90 jours. Taux de vente au détail de 85 % lors de la première saison. Le distributeur a élargi son partenariat pour inclure une gamme de bateaux pneumatiques au cours de la deuxième année.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock a livré une ligne SUP complète en 90 jours, de la conception initiale à la vente au détail. La qualité correspond aux marques vendues à deux fois le prix.
      icon: tabler:arrows-exchange
    - title: Fourniture de bateaux de sauvetage au Moyen-Orient
      customer: Autorité nationale de protection civile
      country: Émirats arabes unis
      industry: Recherche et sauvetage
      challenge: L'organisation de la protection civile avait besoin de 20 RIB prêts à patrouiller pour la recherche et le sauvetage côtiers, la sécurité portuaire et la réponse aux inondations. Ponts auto-videurs requis, suites de navigation complètes (GPS, radar, VHF), tubes orange haute visibilité et respect des réglementations maritimes locales.
      solution: Fourni 20 modèles RIB 450 Patrol avec ponts auto-videurs, suites de navigation Garmin, projecteurs LED, bande réfléchissante SOLAS et tubes orange Hypalon haute visibilité. Chaque bateau était certifié CE et testé selon les normes ISO 6185. Le dossier de documentation comprenait des certificats de conformité pour l'enregistrement local.
      product: RIB 450 Patrouille
      results: Flotte déployée sur 5 stations côtières. Les bateaux ont fonctionné dans des températures extrêmes (45°C+) sans dégradation des tubes. L'autonomie et le rendement énergétique des patrouilles ont dépassé les spécifications de 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: Le RIB 450 Patrol a dépassé nos besoins opérationnels. Dans des conditions de chaleur extrême, les tubes Hypalon ne présentent aucun signe de dégradation UV après 24 mois d'utilisation quotidienne.
      icon: tabler:alert-triangle
    - title: Partenariat de marque européen OEM
      customer: North Sea Marine Equipment B.V.
      country: Pays-Bas
      industry: OEM/ODM Fabrication
      challenge: Une marque maritime européenne bien établie souhaitait se développer sur le marché RIB sans investir dans des installations de fabrication. Nous avions besoin d'un partenaire en marque blanche capable de produire 5 modèles RIB (3,9 m à 6,2 m) avec une marque privée, une certification CE et des droits de distribution exclusifs dans l'UE.
      solution: Établissement d'un accord de fabrication en marque blanche pour 5 modèles RIB. Chaque modèle est marqué des logos des clients et d'une palette de couleurs. CE Documentation de certification préparée pour chaque modèle. Droits de distribution exclusifs dans l’UE accordés avec des engagements de commande minimum. Documentation technique et catalogue de pièces de rechange fournis pour le réseau de service local.
      product: Ligne RIB personnalisée (5 modèles)
      results: Accord pluriannuel signé. Première production de 50 unités expédiées sous 75 jours. Marque lancée à METSTRADE avec un accueil positif des concessionnaires.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: "Travailler avec Paddle Board Overstock nous a permis d'entrer sur le marché RIB sans construire d'usine : ils ont fourni une solution clé en main complète avec la certification CE et la documentation d'assistance du concessionnaire."
      icon: tabler:building
    - title: Flotte de villégiature des Caraïbes
      customer: Paradise Island Resorts Ltd.
      country: Bahamas
      industry: Tourisme maritime et hôtellerie
      challenge: "Le complexe de luxe avait besoin d'une flotte complète d'équipements de sports nautiques pour les activités des clients : 40 planches SUP pour les visites guidées, 20 kayaks pour l'exploration du lagon, 10 bateaux pneumatiques pour les transferts des invités et les excursions de pêche, ainsi que des accessoires. Tous les équipements nécessitaient une image de marque personnalisée et devaient être livrés avant la haute saison touristique."
      solution: "Produit un ensemble complet de sports nautiques : 40 planches SUP Voyager (modèle All-Around), 20 kayaks Explorer, 10 bateaux gonflables AirDeck 360, ainsi que des VFI, des pagaies, des pompes et des kits de réparation. Tous les équipements imprimés avec le logo du complexe et des couleurs tropicales. Expédition conteneurisée avec manifeste d'inventaire complet."
      product: Forfait sports nautiques complet (70+ unités)
      results: La flotte est arrivée 6 semaines avant la haute saison. Les scores de satisfaction des clients pour les activités de sports nautiques ont augmenté de 40 % d'une année sur l'autre. L'équipement a duré 3 saisons avec seulement un entretien de routine.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: "L'approche globale signifie que nous avons reçu tout ce dont nous avions besoin en un seul envoi : planches, kayaks, bateaux et accessoires, tous de marque et prêts à être utilisés par les clients. Nos clients apprécient la qualité des équipements."
      icon: tabler:beach
    - title: Centre de plongée commerciale du Queensland RIB Surclassement
      customer: Centre de plongée commerciale
      country: Australie
      industry: Services de plongée commerciale et maritime
      challenge: "Un centre de plongée commercial basé dans le Queensland, spécialisé dans l'inspection des infrastructures maritimes, l'entretien des ports et les projets de réparation sous-marine, exploitait un bateau de travail vieillissant. À mesure que la demande du projet augmentait, l'ancien navire est devenu un handicap : une maintenance fréquente a entraîné des perturbations dans le calendrier, l'aménagement n'était pas conçu pour les opérations de plongée modernes (espace limité pour les bouteilles, les outils et l'équipement) et le confort de l'équipage pendant les opérations de longue durée était médiocre. L'entreprise avait besoin d'un navire capable de soutenir ses opérations professionnelles au quotidien."
      solution: Paddle Board Overstock a mené une analyse opérationnelle détaillée du flux de travail de plongée du client, de la durée typique du projet, de la taille de l'équipage et des exigences en matière d'équipement. Sur la base de cette analyse, Paddle Board Overstock a livré un RIB professionnel personnalisé avec un agencement de pont fonctionnel optimisé pour la préparation de l'équipement et le mouvement des plongeurs, des sièges professionnels pour des périodes de transport plus longues, une stabilité améliorée pour une entrée et une sortie plus sûres des plongeurs et des fonctionnalités d'assistance à la plongée intégrées dans la conception.
      product: Plongée professionnelle sur mesure RIB
      results: Le nouveau RIB est devenu une plateforme de travail fiable au quotidien. La préparation des équipements est devenue plus rapide grâce à la disposition optimisée. L'équipage a signalé une amélioration du confort et de la sécurité lors des opérations de longue durée. L'apparence professionnelle du bateau a renforcé la confiance des clients lorsqu'ils travaillent avec des opérateurs portuaires et des entrepreneurs maritimes. Le centre de plongée a acquis un navire à la hauteur du professionnalisme de son service.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Nous avions besoin d'un bateau capable de soutenir notre activité au quotidien, et pas seulement d'un navire de transport. Paddle Board Overstock a travaillé avec nous pour comprendre nos exigences opérationnelles et a fourni une solution RIB qui correspond à notre flux de travail de plongée commerciale.
      icon: tabler:lifebuoy
    - title: Contrat de patrouille côtière américaine
      customer: Agence de sécurité côtière de l'Atlantique
      country: États-Unis
      industry: Sécurité maritime et application de la loi
      challenge: L'agence américaine de sécurité côtière avait besoin de semi-rigides de patrouille robustes pour les opérations d'interception en eau libre. Configuration bimoteur nécessaire pour la redondance, console blindée pour la protection de l'équipage, électronique de spécification militaire (communications cryptées, FLIR, radar) et conformité aux réglementations de la Garde côtière américaine.
      solution: Conçu RIB 600 Patrol avec configuration hors-bord double 115 HP, console blindée avec protection balistique, imagerie thermique FLIR, communications VHF/UHF cryptées et points de montage d'armes intégrés. Coque renforcée pour les manœuvres d'interception à grande vitesse. Toute l'électronique intégrée et testée en usine. USCG documentation de conformité fournie.
      product: RIB 600 Patrol (Bimoteur)
      results: Les bateaux ont atteint une vitesse de pointe de 52 nœuds lors des essais d'acceptation. L'agence a signalé un taux de préparation à la mission de 95 % au cours des 12 premiers mois. Commande supplémentaire passée pour 8 unités.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Le bimoteur RIB 600 offre à nos équipages la rapidité et la redondance nécessaires aux opérations d'interception en eau libre. La console blindée offre une protection critique sans compromettre les performances.
      icon: tabler:shield
