features3_cases:
  tagline: Histoires en Vedette
  title: Planches Réelles<br />Pour de Vraies Aventures
  isBeforeContent: false
  columns: 3
  items:
    - title: Du Canapé au Stand dès le Premier Essai
      customer: Pagayeur Débutant
      country: Allemagne
      industry: Loisir pour Débutant
      challenge: Anna n'avait jamais pagayé auparavant et était nerveuse à propos de l'équilibre, de l'eau froide et de paraître ridicule devant les autres. Vivant dans un petit appartement à Munich, elle n'avait également aucun endroit pour stocker une planche rigide et pas de galerie de toit pour le transport.
      solution: Le SUP Explorer 11 offre une plateforme large et stable qui pardonne les premiers coups de pagaie hésitants. Le package complet — planche, pagaie ajustable, pompe, leash et sac — lui permettait de tout transporter à pied jusqu'au lac. De la boîte à l'eau en moins de 20 minutes, sans besoin d'expérience.
      product: SUP Explorateur 11
      results: Anna s'est levée dès sa toute première tentative et a pagayé pendant une heure sans tomber. Deux mois plus tard, elle pagaye trois fois par semaine et a rejoint un groupe local. La planche se range dans un sac à dos qui tient dans son placard d'entrée.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Je m'attendais à passer ma première journée à nager à côté de la planche. Au lieu de cela, je glissais sur le lac en quelques minutes — je n'arrivais pas à croire à quel point elle est stable.
      icon: tabler:school
    - title: Une Planche, Deux Enfants, Zéro Réclamation
      customer: Famille de Quatre
      country: Italie
      industry: Récréation familiale
      challenge: Marco et Giulia voulaient une activité estivale pour laquelle leurs deux enfants laisseraient réellement leurs écrans. Les précédentes gonflables bon marché se déformaient, fuyaient aux coutures et se dégonflaient en plein paddle — les enfants avaient perdu confiance après une mauvaise expérience.
      solution: La Série Tropical Breeze apporte une véritable ambiance de vacances sur une île — soleil, cocotiers et scènes de plage — qui a donné envie aux enfants de se mettre à l'eau. Le noyau drop-stitch reste rigide à 15 PSI, et chaque planche est testée à 1,25 fois sa pression nominale pendant 24 à 48 heures en usine avant expédition.
      product: Série Tropical Breeze
      results: La famille pagaie désormais chaque week-end de juin à septembre. Après une saison complète avec le passage des enfants, la planche ne montre ni stress des coutures ni décoloration. Leur fille a commencé à demander sa propre planche pour son anniversaire.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: Les enfants se disputent la place pour pagayer. Après les planches bon marché essayées auparavant, celle-ci semble conçue exactement pour durer avec notre famille.
      icon: tabler:users
    - title: Un Studio de Yoga Flottant au Lever du Soleil
      customer: Pratiquant de Yoga
      country: Indonésie
      industry: SUP Yoga & Méditation
      challenge: Putu enseigne le yoga à Bali et voulait faire passer sa pratique sur l’eau, mais ses premières tentatives sur une planche empruntée lui semblaient glissantes et instables. Maintenir une posture en dérivant sur l’eau libre demande de l’adhérence, de la stabilité et un design apaisant.
      solution: La série Flowing Lotus associe des œuvres de lotus, koi et libellules à un tapis de traction gravé au laser qui maintient mains et pieds ancrés dans le chien vers le bas. Le large contour tout autour et l’épaisseur de 6 pouces créent une plateforme flottante stable pour les flux et la méditation assise.
      product: Série Lotus Fluide
      results: Putu anime désormais de petits cours de yoga au lever SUP du soleil deux fois par semaine. Ses élèves réservent des semaines à l’avance, et le tableau est devenu la signature de ses cours — les œuvres d’art font la moitié de son marketing pour elle.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: S’entraîner sur l’eau change tout. La planche est assez stable pour la pose du corbeau, et le motif du lotus donne à chaque cours un rituel.
      icon: tabler:heart
    - title: Couleur intégrée dans le matériau — littéralement
      customer: Créateur de contenu de voyage
      country: Portugal
      industry: Réseaux sociaux et création de contenu
      challenge: Miguel tourne du contenu de paddle pour gagner sa vie. Les planches imprimées qu’il utilisait auparavant ont perdu leur couleur en une saison d’eau salée et de soleil — ses images ont commencé à paraître fatiguées, et les fans ont remarqué les plateformes de terrasse qui s’écaillaient.
      solution: L'édition Cheetah Surge construit son motif guépard à partir de pièces modulaires multicolores découpées plutôt que d'encre en surface. Les couleurs font partie de la mousse elle-même, donc l'eau salée, UV, et le trafic piéton sont beaucoup moins susceptibles de faire disparaître, d'écailler ou de rayer le motif.
      product: Édition Cheetah Surge
      results: Un an complet de tournages côtiers plus tard, le plateau paraît tout neuf à l’écran. Ses extraits au lever du soleil depuis l’Algarve sont devenus son contenu le plus performant, et le plateau lui-même apparaît dans des dizaines de collaborations avec des marques.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Mes anciens plateaux ont vieilli plus vite que mon contenu. Le Cheetah ressemble exactement au premier jour après un an dans l’océan — mes abonnés ne cessent de me demander quel filtre j’utilise. Ce n’est pas un filtre. C’est le plateau.
      icon: tabler:camera
    - title: Expéditions côtières du week-end
      customer: Pagayeur de randonnée côtière
      country: Australie
      industry: Tourisme et Exploration
      challenge: Tom voulait pagayer dans les baies calmes et les promontoires de la Gold Coast lors de circuits de plusieurs heures, mais les planches légères à prix se sont contractées sous la houle et l’ont laissé épuisé après une heure. Il avait besoin d’une rigidité qu’elle pouvait porter seul jusqu’aux points d’arrivée à distance.
      solution: La série Ocean Voyager combine une œuvre de tortue marine en bleu sarcelle profond et corail avec un drop-stitch noyau rigide qui conserve sa forme malgré une légère houle côtière. Avec environ 20 lbs dans son sac à dos, Tom peut la randonner jusqu’à des plages qu’aucune voiture ne peut atteindre, la gonfler avec la pompe incluse, et faire des excursions pendant des heures.
      product: Série Ocean Voyager
      results: Tom a désormais cartographié onze itinéraires côtiers, dont une traversée matinale complète qu’il considérait autrefois comme dépassée par ses compétences. La planche reste rigide du lancement au déjeuner, et le design de la tortue de mer est devenu sa signature reconnaissable sur l’eau.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Les planches rigides ressemblent à des planches rigides, et celle-ci se porte comme un sac à dos. Elle a ouvert toute une côte que je ne pourrais jamais atteindre avec une voiture et une remorque.
      icon: tabler:compass
    - title: Fitness complet du corps, zéro frais de salle de sport
      customer: Pagayeur de fitness
      country: Canada
      industry: Fitness & Entraînement
      challenge: Priya voulait un entraînement complet à faible impact qui ne ressemble pas à un entraînement. La course lui faisait mal aux genoux, et la salle de sport lui semblait répétitive — elle avait arrêté toutes les routines en six semaines.
      solution: 'La série Dolphin Wave a transformé l’exercice en jeu : pagayer brûle des calories, renforce le tronc et les épaules, et met à l’épreuve l’équilibre, tout en déraissant devant le paysage de Vancouver. Le pont stable de 32 pouces pardonne les coups maladroits tout en exigeant un micro-équilibre constant — une salle de sport déguisée en planche à pagaie.'
      product: Série Dolphin Wave
      results: Priya pagaie cinq matins par semaine avant le travail et maintient cette routine depuis 14 mois — son record personnel pour tous les plans d’exercice. Ses amis rejoignent désormais son club hebdomadaire de pagaie, et ses genoux n’ont jamais été aussi heureux.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Je n’ai jamais eu à me forcer à aller pagayer. L’entraînement est réel — j’ai juste arrêté de m’en rendre compte parce que je suis trop occupé à profiter de l’eau.
      icon: tabler:trophy
    - title: Un labrador de 30 kilos et un pont très stable
      customer: Pagayeur avec un chien
      country: États-Unis
      industry: Pagayer avec des animaux de compagnie
      challenge: Jake voulait amener son Labrador, Biscuit, sur l’eau, mais sa vieille planche étroite s’est transformée en sous-marin dès que le chien a sauté à bord. Des griffes ont aussi déchiré le pont bon marché en quelques semaines.
      solution: La série Leviathan Wake offre une large plateforme à fort volume qui transporte un pagayeur plus un passager de 30 kilos sans se lamenter. Le EVA pont de traction survit aux griffes qui avaient détruit sa planche précédente, et le totem de la baleine bleue offre à Biscuit un « endroit » bien visible pour s’asseoir.
      product: Série Leviathan Wake
      results: Biscuit saute maintenant à bord sur commande et chevauche la proue comme une figure de proue. Deux étés plus tard, le pont ne montre aucun dommage aux griffes, et leurs pagaies de rivière sont devenues le contenu le plus apprécié du fil de Jake.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: J’ai acheté une planche et pris un second. Le pont a enlevé tout ce qu’un gros chien mouillé pouvait lui lancer — littéralement.
      icon: tabler:dog
    - title: Budget étudiant, qualité au prix plein
      customer: Étudiant universitaire
      country: Pologne
      industry: Mode de vie étudiant
      challenge: Kasia est étudiante à Gdansk avec un budget étudiant et une routine estivale sur les lacs. Chaque planche bon marché qu’elle trouvait était soit fragile, soit laide, ou les deux — et les planches de qualité coûtaient plus cher que son budget mensuel de nourriture.
      solution: La série Medusa Glow associe une construction haut de gamme — drop-stitch noyau, PSI rigidité 15, illustrations de méduse en vert menthe assemblées à partir de blocs découpés EVA — à Paddle Board Overstock des tarifs de liquidation directs d’usine qui évitent toutes les marges intermédiaires.
      product: Série Medusa Glow
      results: Kasia payait moins de la moitié de ce que vendent des planches premium comparables localement. Sa planche a survécu à une saison complète de sessions quotidiennes sur le lac et à une semaine sur la plage baltique, et trois camarades ont commandé la leur après avoir essayé la sienne.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Je m’attendais à des compromis entre le budget étudiant. À la place, j’ai eu un tableau que mes amis pensaient coûter trois fois plus cher — et il a duré plus que deux des leurs.
      icon: tabler:backpack
    - title: Largage depuis une plateforme stable
      customer: Pêcheur du week-end
      country: États-Unis
      industry: Pêche occasionnelle SUP
      challenge: Devon pêche dans des eaux calmes trop peu profondes pour qu’une embarcation à moteur puisse l’atteindre. Il avait besoin d’une barque à pagaies suffisamment stable pour lancer debout, assez robuste pour des hameçons et du matériel, et assez légère pour être portée sur un sentier à l’aube.
      solution: La série Jungle Mandala lui offre une large plateforme rigide pour lancer des lancers, avec une terrasse hibiscus et colibri bleu Tiffany qui reste fraîche sous le soleil du matin. La planche se prépare à la taille d’un sac à dos pour le sentier, se gonfle en quelques minutes au bord de l’eau, et la PVC peau renforcée se débarrasse des accrocs et des collisions avec les nageoires.
      product: Série Jungle Mandala
      results: Devon atteint désormais trois criques de frai que personne d’autre ne peut pêcher. Son taux de capture a doublé au cours de la saison, et la planche — hameçons, cordier inclus — semble toujours prête pour un nouvel été.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Me tenir debout SUP a complètement changé ma façon de pêcher. Cette planche est assez stable pour lancer, monter l’hameçon et attraper un poisson — tout cela sans être mouillé.
      icon: tabler:fish
