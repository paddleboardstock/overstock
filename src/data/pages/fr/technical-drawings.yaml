content_tiers:
  tagline: Télécharger les niveaux
  title: Quatre niveaux d'accès<br />— Le bon détail pour la bonne étape
  subtitle: Nous fournissons des dessins au niveau de l’approvisionnement, et non des fichiers au niveau de la fabrication. Chaque niveau correspond à une étape différente du projet.
  items:
    - title: Niveau 1 — PDF public
      description: Disposition générale (GA), dessin dimensionnel à 4 vues et plan de pont au format PDF. Disponible en téléchargement gratuit. Suffisant pour la planification du projet, l’attribution de l’espace et l’examen préliminaire des spécifications.
      icon: tabler:file-type-pdf
    - title: Niveau 2 — Forme légère DXF/DWG
      description: Fichiers CAO 2D (DXF ou DWG) pour l'intégration de la mise en page au niveau de la planification. Nécessite un court formulaire de qualification (nom de l’entreprise, type de projet, utilisation prévue). Aucune donnée structurelle ou de fabrication incluse.
      icon: tabler:file-code
    - title: Niveau 3 — Demande de projet STEP/IGES
      description: Fichiers de modèles 3D (STEP ou IGES) pour l'intégration de systèmes, la conception d'équipements ou la coordination d'architecture navale. Nécessite une demande de projet avec la portée, le calendrier et l'intention d'achat. Sous réserve d'approbation.
      icon: tabler:cube
    - title: Niveau 4 — Ingénierie NDA
      description: Dessins structurels de la coque, calendriers de stratification, expansions de découpe de tubes et données de moule. Disponible uniquement sous NDA avec commandes confirmées. Il s’agit de fichiers de fabrication – non destinés à une distribution publique.
      icon: tabler:lock
content_included:
  tagline: Ce qui est inclus
  title: Contenu du dessin<br />Par modèle
  subtitle: Chaque modèle dispose d'un ensemble de dessins standard couvrant les informations de planification essentielles pour les acheteurs B2B et les ingénieurs de projet.
  items:
    - title: Disposition générale (AG)
      description: Profil latéral, vue de dessus et coupe transversale montrant la forme de la coque, la position du tube, l'emplacement de la console, les sièges, le système de carburant et les dimensions clés (LOA, poutre, diamètre du tube, angle d'inclinaison). État de la révision et droit d'auteur indiqués sur le cartouche.
      icon: tabler:layout
    - title: Dessin dimensionnel à 4 vues
      description: Vues latérales, avant, arrière et de dessus avec dimensions d'encombrement pour la planification du transport (hauteur sur remorque, poutre pour conteneur, poids à soulever). Comprend les configurations opérationnelles et de transport.
      icon: tabler:ruler-2
    - title: Plan d'aménagement et d'équipement du pont
      description: Vue du pont de haut en bas montrant la base de la console, la position des sièges, l'emplacement des anneaux en D, la position des feux de navigation, l'accès à la pompe de cale, le compartiment batterie/carburant et les points de montage de l'équipement. Précision limitée sur les interfaces propriétaires.
      icon: tabler:map
    - title: Dessin de transport et d’emballage
      description: Plan de chargement des conteneurs, dimensions des berceaux, répartition du poids et positions des points de levage pour la planification logistique. Comprend des options d’emballage standard et personnalisées.
      icon: tabler:truck
content_protection:
  tagline: Protection IP
  title: Ce que nous ne partageons pas<br />et pourquoi
  subtitle: La protection de notre propriété intellectuelle technique garantit que nous pouvons continuer à investir dans la R&D tout en fournissant tout ce dont les acheteurs ont besoin pour la planification de projets.
  items:
    - title: Données de base du moule de coque
      description: La géométrie des bouchons et des moules, les parcours d'outils CNC et les modèles de stratification sont des atouts de fabrication exclusifs. Ils ne sont partagés à aucun niveau d’accès en dehors des contrats NDA confirmés.
      icon: tabler:ban
    - title: Extensions de coupe de tubes
      description: Les fichiers de découpe à plat pour le tissu tubulaire sont des données de niveau fabrication. Disponible uniquement sous NDA avec ordres de production confirmés et partagé uniquement avec le contractant.
      icon: tabler:ban
    - title: Calculs structurels
      description: L'analyse détaillée des contraintes, les résultats FEA et les calendriers de laminage sont des documents sensibles en matière de conformité, partagés uniquement avec les organismes notifiés et les clients liés par NDA pendant le processus d'évaluation de la conformité.
      icon: tabler:ban
    - title: Sélection des concurrents
      description: Nous nous réservons le droit de refuser les demandes d'accès CAO qui semblent provenir de concurrents, d'étudiants sans contexte de projet ou de parties sans intention légitime d'approvisionnement.
      icon: tabler:shield
