content_version_control:
  tagline: Gestion des versions
  title: Gestion des versions<br />des plans
  subtitle: Chaque plan suit un système de révision contrôlé. Vérifiez toujours que vous disposez de la révision en cours avant d'utiliser les plans pour la planification de votre projet.
  items:
    - title: Suivi des révisions
      description: Chaque plan comporte un code de révision (Rev-A, Rev-B, Rev-C), une date d'émission, une date de dernière vérification, le modèle ou la configuration concernés, les unités, la taille du fichier et le format. Seule la révision "en cours" est disponible au téléchargement.
      icon: tabler:git-branch
    - title: Avertissement sur le statut des plans
      description: Tous les plans publics portent la mention "Disposition préliminaire uniquement — à ne pas utiliser pour la construction, la certification ou la production. Dimensions sujettes à la spécification finale et à la confirmation de commande." Cela protège les deux parties contre toute utilisation impropre.
      icon: tabler:alert-circle
    - title: Notifications de mise à jour
      description: Lorsque la spécification d'un modèle change, la révision du plan est mise à jour et les versions précédentes sont marquées "remplacées". Les utilisateurs inscrits ayant téléchargé des packs DXF/DWG sont informés par e-mail des mises à jour importantes.
      icon: tabler:bell

faq:
  title: Dessins techniques — Foire aux questions
  questions:
    - q: Les PDF GA sont-ils vraiment téléchargeables gratuitement ?
      a: Oui. Les PDF de disposition générale de nos principaux modèles sont disponibles gratuitement. Ils contiennent des informations au niveau de la planification suffisantes pour l'évaluation du projet, l'allocation de l'espace et l'examen préliminaire des spécifications.
    - q: Comment accéder aux fichiers DXF/DWG ?
      a: Remplissez le court formulaire de qualification sur la page de téléchargement avec le nom de votre entreprise, le type de projet et l'utilisation prévue. Les demandes approuvées reçoivent un lien de téléchargement par e-mail dans un délai d'un jour ouvrable.
    - q: Puis-je obtenir des modèles 3D STEP/IGES ?
      a: Les fichiers de modèles 3D STEP ou IGES sont disponibles via notre processus de candidature à un projet. Fournissez la portée de votre projet, les exigences d’intégration, le calendrier et l’intention d’achat. Sous réserve d’approbation – généralement dans les 3 à 5 jours ouvrables.
    - q: Pourquoi restreignez-vous l’accès aux fichiers plus détaillés ?
      a: La géométrie de la coque, les données de moulage et les calculs structurels représentent des années d'investissement en R&D et constituent la propriété intellectuelle fondamentale de la fabrication. Nous fournissons tout le nécessaire pour la planification des achats et l'intégration des projets tout en protégeant notre capacité à continuer d'investir dans le développement de nouveaux produits.
    - q: Les dessins incluent-ils des détails de fabrication ?
      a: Non. Les dessins publics et les dessins légers contiennent des informations au niveau de l'approvisionnement pour la planification et les spécifications. Les détails au niveau de la fabrication (calendriers de stratification, parcours d'outils, extensions de coupe) sont partagés uniquement sous NDA avec les commandes confirmées.
    - q: Des dessins sont-ils disponibles pour les configurations RIB personnalisées ou semi-personnalisées ?
      a: Les dessins de projets personnalisés sont préparés dans le cadre du processus de développement OEM/ODM. Si vous évaluez un projet RIB personnalisé, contactez-nous avec vos exigences et nous vous fournirons des dessins GA spécifiques au projet dans le cadre de la proposition.
