hero:
  tagline: Dessins techniques et CAO
  title: RIB et bateau pneumatique<br />Dessins techniques et téléchargements CAO
  subtitle: Dessins GA au niveau de la planification, feuilles de dimensions et plans de pont pour l'évaluation et la spécification du projet. Accédez aux dessins techniques au bon niveau, des fichiers PDF publics aux fichiers STEP au niveau du projet.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Dessins techniques et téléchargements CAO de bateaux RIB
direct_answer: Aquafarer fournit des dessins techniques au niveau de l'approvisionnement pour les bateaux RIB et les motomarines pneumatiques, y compris des PDF d'agencement général (GA), des feuilles de dimensions et des dessins d'aménagement du pont. Des formats plus détaillés (DXF/DWG, STEP/IGES) sont disponibles sur demande qualifiée ou sur demande de projet.
