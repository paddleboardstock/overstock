      body: Norme internationale
      scope: Bateaux pneumatiques — construction, stabilité, flottaison, tests de pression
    - name: ATTEINDRE
      body: Règlement UE
      scope: Sécurité chimique — substances restreintes dans les matériaux et les revêtements
section_faq:
  title: FAQ technique
  questions:
    - q: Comment le dropstitch se compare-t-il à la construction traditionnelle à coque rigide ?
      a: Les noyaux modernes à points de chute à 20 PSI atteignent 85 à 90 % de la rigidité des coques dures comparables en mousse EPS/fibre de verre, tout en étant entièrement dégonflables pour le transport. Le compromis est un poids légèrement plus élevé et une rigidité ultime inférieure, mais pour la plupart des applications récréatives et commerciales, la différence est négligeable.
    - q: Quelle densité de fil est considérée comme une qualité supérieure ?
      a: Les tissus à point de chute haut de gamme utilisent 2 fils par pouce carré (environ 3 100 fils par m²) tissés à partir de fil de polyester 1 680 DTEX. Les tissus d'entrée de gamme utilisent 1 fil par pouce carré avec un fil 1 100 DTEX.
    - q: L'Hypalon peut-il être soudé comme le PVC ?
      a: Non. L’Hypalon/CSM ne peut pas être soudé par RF. Il doit être assemblé à l’aide de colle de contact appliquée à la main, ce qui rend la production plus exigeante en main-d’œuvre et les coutures dépendent des compétences de l’opérateur. Le PVC peut être soudé par RF ou par air chaud pour une qualité de couture constante et automatisée.
    - q: Quelle est la pression maximale de sécurité pour les bateaux pneumatiques ?
      a: Les tubes de bateau pneumatique standard fonctionnent entre 8 et 12 PSI. Les sols à points de chute fonctionnent entre 12 et 20 PSI. Les noyaux de point de chute (SUP) à haute pression peuvent fonctionner entre 20 et 25 PSI. Chaque produit comprend des soupapes de surpression calibrées pour éviter un gonflage excessif.
    - q: Combien de temps faut-il pour fabriquer un bateau pneumatique sur mesure ?
      a: La production OEM standard dure 30 à 45 jours à compter de la confirmation de la commande jusqu'à FOB Qingdao. Le développement de moules personnalisés ajoute 15 à 20 jours pour la production et les tests de prototypes.
