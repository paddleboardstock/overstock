how_to_choose:
  title: Comment choisir la bonne taille
  cards:
    - title: Planches SUP Polyvalentes
      description: Nos planches polyvalentes d'environ 11 pieds (32" de large, 6 pouces drop-stitch) équilibrent stabilité, vitesse et capacité. Associez le volume de la planche à votre poids — les pagayeurs plus lourds ont besoin de plus de volume.
    - title: Largeur et épaisseur
      description: Les planches plus larges (32"+) offrent plus de stabilité pour les débutants, le yoga et la pêche. Épaisseur de 6 pouces à 15 PSI pour garder le pont rigide sous le pagayeur et le matériel.
    - title: Forfaits et accessoires
      description: Chaque planche est livrée en tant que package complet — planche, sac à dos de voyage, pompe à main, pagaie réglable, aileron amovible, leash en spirale et kit de réparation. Vérifiez la charge maximale pour le pilote ainsi que le matériel.
