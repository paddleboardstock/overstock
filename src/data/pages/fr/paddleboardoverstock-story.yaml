timeline:
  - year: '2012'
    title: Fondation de la Fabrication Marine
    body: Paddle Board Overstock a commencé comme un atelier spécialisé de planches gonflables à Weihai, en Chine, dédié à l’artisanat maritime et à la fabrication de planches. L’objectif initial était de construire des produits gonflables fiables grâce à une expérience pratique en ingénierie et à une discipline de fabrication.
  - year: '2015'
    title: Premières exportations
    body: Les commandes d’exportation initiales ont atteint le Japon et la Corée, marquant Paddle Board Overstock l’entrée de la société sur les marchés internationaux. La société a commencé à servir des pagayeurs et des passionnés de sports nautiques au-delà de la Chine.
  - year: '2018'
    title: Expansion de l’usine
    body: Déplacé dans une usine de production de 12 000 m². Ajout de lignes de soudage RF et drop-stitch de capacité de production, permettant une fabrication à plus grande échelle et des systèmes de contrôle qualité améliorés.
  - year: '2020'
    title: Centre de R&D établi
    body: Ouverture d’un centre dédié de R&D avec PVC laboratoire de tissus, réservoir d’essai hydrodynamique et studio de simulation CAO/FEA. Le développement produit s’est étendu pour se concentrer sur une construction légère, une durabilité améliorée et une conception centrée sur l’utilisateur.
  - year: '2022'
    title: Croissance mondiale
    body: Étendu à 14 ingénieurs R&D et 200+ ouvriers. Les planches atteignirent des pagayeurs à travers l’Europe, les Amériques et la région Asie-Pacifique, expédiant vers 50+ pays.
  - year: '2024'
    title: Studio d’Innovation et de Design
    body: Lancement d’un studio de design et d’innovation complet pour de nouvelles séries de planches, du concept à la production. Élargi nos decks signature de la série artistique et nos plateformes de tournée.
  - year: '2026'
    title: Construire l’avenir de l’exploration aquatique
    body: Aujourd’hui, Paddle Board Overstock continue de développer SUP des planches gonflables, du matériel de pagaie et des solutions marines personnalisées — reliant les personnes et les organisations aux eaux du monde. 50+ pays desservis, une capacité annuelle de 15 000 unités.
content_founding:
  tagline: Le début
  title: Né sur le front de mer
  subtitle: 'Paddle Board Overstock commencé dans un atelier côtier à Weihai avec une seule planche et une vision : construire des planches gonflables capables de supporter de réelles conditions marines.'
  paragraphs:
    - En 2012, nos fondateurs ont constaté un vide sur le marché — la plupart des planches gonflables étaient soit abordables mais peu fiables, soit de haute qualité mais prohibitivement chères. Ils pensaient qu’il y avait de la place pour un fabricant offrant à la fois qualité et valeur.
    - La première coque a été construite à la main, testée dans les eaux locales, et affinée sur la base de véritables retours des pêcheurs et des petits opérateurs commerciaux. Cette boucle de rétroaction — construire, tester, écouter, améliorer — reste au cœur de notre philosophie d’ingénierie aujourd’hui.
    - En 2015, la nouvelle s’était répandue au-delà de Weihai. Les pagayeurs et les boutiques de sports nautiques à travers l’Asie ont commencé à demander des planches. Ce qui avait commencé comme un atelier local devenait une marque mondiale.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Atelier de production et fabrication précoces
content_growth:
  tagline: Croissance et innovation
  title: De l’atelier à une installation de 12 000 m²
  subtitle: L’investissement continu dans les personnes, les équipements et les processus s’est Paddle Board Overstock transformé en une usine moderne de fabrication maritime.
  paragraphs:
    - À mesure que la demande augmentait, notre installation augmentait également. Nous sommes passés d’un petit atelier à une usine de 12 000 m² avec des lignes de production dédiées pour SUP les planches, accessoires et équipements de sécurité.
    - Nous avons investi dans CNC des machines de découpe, des équipements de soudure haute fréquence, des lignes de production à point de chute et des bancs d’essai complets — ce qui nous a permis de contrôler chaque aspect de la qualité de production.
    - Aujourd’hui, notre équipe de 200 à 300 personnes comprend des ingénieurs marins, des spécialistes des matériaux, des spécialistes du contrôle qualité et des artisans qualifiés — dont beaucoup sont là Paddle Board Overstock depuis les débuts.
founder:
  tagline: Rencontrez le fondateur
  title: Construit par un Waterman
  subtitle: Le fondateur David Chen réunit expertise en fabrication et une passion de toujours pour les sports nautiques — une combinaison qui définit la Paddle Board Overstock manière dont l’approche du développement des produits.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Fondateur de Paddle Board Overstock
  story:
    - David Chen a grandi sur la côte de Weihai, où la mer n’était pas une destination de vacances mais un mode de vie. Il a passé sa jeunesse à pagayer, naviguer et pêcher dans la mer Jaune — des expériences qui lui ont permis de comprendre intuitivement ce que les planches à pagaie doivent supporter.
    - Avant de fonder Paddle Board Overstock, David a passé une décennie dans la fabrication maritime, travaillant dans la production, la qualité et le commerce international. Il a dirigé des programmes de production et de qualité pour les marchés européens et nord-américains, apprenant de première main les attentes des pagayeurs mondiaux.
    - 'En 2012, il a Paddle Board Overstock fondé avec une mission simple : construire des planches de pagaie gonflables qu’il confierait à sa propre famille sur l’eau. Cette norme personnelle — l’utiliserais-je ? — reste le test final pour chaque produit qui sort de l’usine.'
    - Aujourd’hui, David dirige la stratégie produit et supervise l’équipe R&D, examinant personnellement les nouveaux designs et testant les prototypes sur les eaux au large de Weihai. Il estime que de grands produits viennent de la compréhension à la fois de l’ingénierie et de l’expérience.
philosophy:
  tagline: Philosophie de la marque
  title: Liberté d’ingénierie sur l’eau
  body: La liberté sur l’eau ne se limite pas au mouvement. Elle représente la découverte de nouveaux lieux, la création d’expériences en plein air, le lien entre les gens et la nature et la possibilité de missions professionnelles. L’ingénierie rend cette liberté possible.
  pillars:
    - title: La fiabilité avant tout
      body: Les environnements aquatiques exigent la confiance.Paddle Board Overstock Les produits sont conçus autour de la stabilité, de la durabilité, de la sécurité et de la performance constante.
    - title: Conception centrée sur l’humain
      body: Les produits doivent servir les gens, pas la technologie. Chaque décision de conception commence par comprendre comment les gens utilisent leurs planches, où ils explorent et quels défis ils rencontrent.
    - title: Accessible Exploration
      body: L’eau ne devrait pas appartenir uniquement aux spécialistes.Paddle Board Overstock Crée des équipements permettant à plus de personnes de découvrir en toute sécurité les rivières, les lacs, les océans et les environnements côtiers.
    - title: Innovation continue
      body: L'innovation ne consiste pas seulement à créer de nouveaux produits. Il s'agit d'améliorer chaque détail — matériaux, structures, fabrication, et expérience utilisateur.
engineeringDna:
  tagline: ADN de l'ingénierie
  title: Comment Paddle Board Overstock crée des produits
  areas:
    - title: Science des matériaux
      body: Paddle Board Overstock se concentre sur la sélection des matériaux appropriés pour différents environnements marins. Les principales considérations incluent la résistance à l'abrasion, la résistance à UV, la stabilité sous pression, et la durabilité à long terme.
      items:
        - Résistance à l'abrasion
        - Résistance aux UV
        - Stabilité sous pression
        - Durabilité à long terme
    - title: Ingénierie des structures
      body: Les planches à pagaie gonflables nécessitent un équilibre précis entre rigidité, poids, portabilité et stabilité. L'ingénierie de Paddle Board Overstock se concentre sur l'optimisation de ces facteurs grâce à la technologie de base drop-stitch et à la construction avancée des coutures.
      items:
        - Rigidité
        - Optimisation du poids
        - Portabilité
        - Stabilité
    - title: Précision de fabrication
      body: 'Chaque produit passe par des processus contrôlés : préparation des matériaux, découpe de précision, soudage et collage, assemblage, inspection qualité et vérification des performances.'
      items:
        - Préparation des matériaux
        - Découpe de précision
        - Soudage et collage
        - Assemblage & Contrôle qualité
    - title: Ingénierie scénarios d'utilisation
      body: Les produits sont développés autour de véritables applications de paddle — loisir, aventure, famille et randonnée — garantissant que chaque conception répond aux exigences spécifiques de son environnement prévu.
      items:
        - Loisirs
        - Aventure
        - Famille
        - Randonnée
