hero:
  tagline: Notre histoire
  title: Paddle Board Overstock — Ingénierie de la liberté sur l’eau
  subtitle: 'D’un atelier côtier à un fabricant maritime mondial — notre parcours repose sur une conviction obstinée : les planches à pagaie doivent être conçues comme elles comptent, car elles comptent.'
