hero:
  tagline: Philippines
  title: Conseils en gros SUP pour<br />Entreprises philippines
  subtitle: Stations balnéaires insulaires, clubs de plage et opérateurs de pagaie d’El Nido et Siargao à Boracay — des planches neuves en surstock à partir de 5 unités, modèles mixtes, expédiées depuis la Chine.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Panneaux de surstock SUP pour les stations balnéaires et les opérateurs de pagaies des Philippines
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves en surstock SUP aux entreprises philippines — stations balnéaires insulaires à Palawan et Siargao, clubs de plage à Boracay et Cebu, opérateurs de location et de voyages, ainsi que petits détaillants. Les commandes en gros commencent à 5 planches avec des modèles mixtes en une seule cargaison, envoyées depuis Weihai, Chine, par fret express aérien ou fret maritime consolidé. Chaque planche est testée à 100 % par pression et couverte par la garantie de 2 ans SUP .
tldr_points:
  - Vente en gros à partir de 5 cartes — modèles mixtes, tarifés par quantité totale
  - Au service des stations balnéaires insulaires et des clubs de plage à travers l’archipel philippin
  - Fret aérien express ou maritim consolidé depuis Weihai, Chine
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché philippin SUP
  paragraphs:
    - Avec plus de sept mille îles, les Philippines sont conçues pour le paddle debout. Les lagunes d’El Nido et Coron, la scène décontractée de surf et d’îles de Siargao, l’énergie de beach club de Boracay, et l’économie de plongée et de sports nautiques de Cebu créent tous une demande constante — des touristes qui font une pagaie au lever du soleil dans un lagon calcaire aux habitants qui construisent SUP des communautés de fitness et de yoga à Manille et au-delà.
    - The buyers are typically resort and tour operators: des stations balnéaires insulaires qui ajoutent une activité pour les invités sans carburant, sans moteur et sans licence ; des opérateurs touristiques qui saut d’île en île élargissant leur offre ; et de petits commerces desservant la communauté nationale des pagayeurs. Les commandes sont petites — 5 à 20 planches — et se mélangent entre des planches stables et polyvalentes pour les débutants et quelques éditions premium pour un aspect en façade de resort.
  customer_types:
    - title: Stations balnéaires sur l’île
      description: Les complexes de Palawan, Siargao et Boracay ajoutent des programmes pour les invités SUP avec des flottes mixtes compactes.
    - title: Opérateurs touristiques
      description: Le voyage d’île en île et les opérateurs de lagon ajoutent des arrêts en pagaie à leurs itinéraires.
    - title: Commerces et écoles locales
      description: Des écoles et boutiques en ville desservant la communauté philippine croissante de pagaie et SUP de yoga.
shipping_section:
  title: Navire vers les Philippines
  paragraphs:
    - Les commandes sont expédiées depuis Weihai, Chine. Le fret aérien express transporte des échantillons et 1 à 3 commandes de bord rapidement vers Manille et Cebu ; le fret maritime consolidé sert 5 à 20 commandes de gros à bord via Manille et d’autres ports philippins. Les estimations de transit pour votre destination — métropole Manille ou province — sont incluses dans votre devis.
    - Nous fournissons les factures commerciales et les exigences de décharge de liste d’emballage, avec les codes HS corrects et les valeurs déclarées. Les droits d’importation et taxes sont exigibles par l’importateur selon les règles philippines.
  customs_note: Pour les destinations provinciales, la livraison finale depuis le port ou l’aéroport est indiquée dans l’estimation porte-à-porte. Confirmez le traitement actuel des droits d’importation pour le matériel sportif auprès de votre courtier ; nous fournissons la documentation complète.
faq_section:
  title: Philippines FAQ
  items:
    - q: Combien de temps prend l’expédition vers les Philippines ?
      a: Cela dépend de la méthode. Le fret aérien express vers Manille ou Cebu est l’option la plus rapide pour les échantillons et 1 à 3 commandes à bord ; le fret maritime consolidé convient à 5 à 20 commandes de gros à bord et est devisé avec une fenêtre de transit pour votre port. Les deux devis sont détaillés dans votre devis avant que vous ne vous engagez.
    - q: Les conseils peuvent-ils atteindre des îles provinciales comme Palawan ou Siargao ?
      a: Oui — la livraison porte-à-porte vers des destinations provinciales est incluse dans l'estimation du fret, en utilisant la logistique intérieure depuis le port ou l'aéroport d'arrivée. Notez l'estimation et les options dans votre demande et nous en établirons le prix spécifiquement.
    - q: À quoi ressemble une flotte de départ pour un complexe touristique ?
      a: 'Généralement 5 à 10 planches : modèles stables et polyvalents pour les cours pour clients et le paddle libre, plus une ou deux éditions artistiques premium pour la plage. Modèles variés, un seul envoi, tarif basé sur la quantité totale.'
    - q: Ces planches conviennent-elles à un usage dans les lagons et sur les récifs plats ?
      a: Oui — les conditions calmes, peu profondes et en eau chaude sont exactement ce pour quoi les planches gonflables polyvalentes SUP sont conçues, et l'aileron flexible ainsi que la construction durable drop-stitch gèrent bien les atterrissages sur les récifs plats et les plages.
