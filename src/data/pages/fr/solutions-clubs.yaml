hero:
  tagline: Clubs de sports nautiques
  title: Équipement et solutions pour<br />les clubs de paddle et les centres de formation
  subtitle: Ensembles complets d'équipement, équipement d'instructeur, image de marque et assistance à la maintenance pour les clubs de SUP, les clubs de kayak, les écoles de surf et les centres de formation aux sports nautiques de toute taille.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Planches SUP Paddle Board Overstock pour clubs de sports nautiques et flottes de location
direct_answer: Paddle Board Overstock fournit des solutions d'équipement de bout en bout pour les clubs de sports nautiques et les centres de formation du monde entier. Nos forfaits club comprennent des planches SUP, des kayaks, des pagaies, des pompes, des kits de réparation et des équipements de sécurité à des prix de gros compétitifs avec de faibles MOQ. Chaque emballage peut être personnalisé avec les logos du club, les couleurs de la marque et un emballage personnalisé. Nous proposons également des formations à la maintenance, une assistance en matière de pièces de rechange et des programmes de rotation des équipements pour maximiser la durée de vie de votre flotte.
solution_offerings:
  - title: Forfait de démarrage du club
    subtitle: Pour les clubs émergents de 10 à 30 membres
    badge: Best Seller
    features:
      - title: Équipement de base
        description: 10 à 30 planches de SUP ou kayaks avec pagaies, pompes et kits de réparation assortis
      - title: Équipement de sécurité
        description: Gilets de sauvetage, sifflets et ensembles de laisses aux couleurs du club pour chaque planche
      - title: Équipement de l'instructeur
        description: Planches spécifiques aux autocars avec ponts antidérapants et stabilité supplémentaire
      - title: Forfait de marque
        description: Impression de logo personnalisé sur les planches, les pagaies et les emballages
      - title: Matériel de formation
        description: Guides de cours pour débutants, protocoles de sécurité et listes de contrôle de maintenance
    cta_text: 'Créer mon forfait club'
    cta_href: /contact
  - title: Forfait Club Premium
    subtitle: Pour les clubs établis et les opérateurs multi-sites
    badge: Professional
    features:
      - title: Flotte complète
        description: 30 à 100 flottes mixtes de SUP, kayaks et accessoires
      - title: Système de sécurité avancé
        description: Suivi des équipements RFID, application de rapport de dommages, signalisation de sécurité
      - title: Formation du personnel
        description: Atelier de certification d'instructeur et d'entretien des équipements sur place
      - title: Assistance marketing
        description: Photographie professionnelle, brochures et modèles de réseaux sociaux
      - title: Programme de remplacement
        description: Actualisation annuelle de l'équipement à des tarifs réduits avec options d'échange
    cta_text: 'Développer mon club'
    cta_href: /contact
benefits:
  - icon: gear
