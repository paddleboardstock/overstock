hero:
  tagline: Clubs de sports nautiques
  title: Équipements & Solutions<br />Pour les clubs de paddle et les centres de formation
  subtitle: Forfaits complets d’équipement, matériel pour les instructeurs, branding et support de maintenance pour les clubs SUP, écoles de surf et centres de formation aux sports nautiques de toutes tailles.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP planches pour les clubs de sports nautiques et les parcs de location
direct_answer: Paddle Board Overstock fournit des solutions d’équipement clés en main pour les clubs et centres de formation aux sports nautiques dans le monde entier. Nos forfaits pour clubs comprennent des planches SUP, des pagaies, des pompes, des kits de réparation et des équipements de sécurité à prix club direct usine. Chaque forfait peut être personnalisé avec les logos du club, des couleurs de marque et des emballages personnalisés. Nous proposons également une formation à la maintenance, un support de pièces de rechange et des programmes de rotation d’équipement pour maximiser la durée de vie de votre flotte.
solution_offerings:
  - title: Forfait de démarrage du club
    subtitle: Pour les clubs émergents de 10 à 30 membres
    badge: Best Seller
    features:
      - title: Équipement de base
        description: 10 à 30 planches SUP avec pagayes assorties, pompes et kits de réparation
      - title: Équipement de sécurité
        description: Gilets de sauvetage, sifflets et ensembles de laisses aux couleurs du club pour chaque planche
      - title: Équipement de l'instructeur
        description: Planches spécifiques aux autocars avec ponts antidérapants et stabilité supplémentaire
      - title: Forfait de marque
        description: Impression de logo personnalisé sur les planches, les pagaies et les emballages
      - title: Matériel de formation
        description: Guides de cours pour débutants, protocoles de sécurité et listes de contrôle de maintenance
    cta_text: Construire mon forfait club
    cta_href: /contact
  - title: Forfait Club Premium
    subtitle: Pour les clubs établis et les opérateurs multi-sites
    badge: Professional
    features:
      - title: Flotte complète
        description: Flotte mixte de 30 à 100 SUPs et accessoires
      - title: Système de sécurité avancé
        description: Suivi des équipements RFID, application de rapport de dommages, signalisation de sécurité
      - title: Formation du personnel
        description: Formation des instructeurs sur site et atelier d’entretien du matériel
      - title: Assistance marketing
        description: Photographie professionnelle, brochures et modèles de réseaux sociaux
      - title: Programme de remplacement
        description: Actualisation annuelle de l'équipement à des tarifs réduits avec options d'échange
    cta_text: Échelle de mon club
    cta_href: /contact
