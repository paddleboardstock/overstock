testimonial:
  content: Nous avons commencé avec le Club Starter Package pour notre école de surf au Portugal. 20 planches, pagaies, gilets — tout est arrivé dans les 3 semaines. Après deux saisons, nous sommes passés au package Pro. Le branding personnalisé avec notre logo a changé la donne pour notre image professionnelle.
  name: Ricardo Santos
  title: Propriétaire, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Profils de clubs
  title: Solutions pour clubs de sports nautiques<br />Par type de club
  subtitle: Des clubs de paddle universitaires aux yacht clubs privés exclusifs, chaque type de club a des besoins en équipement, des modèles d'utilisation et des structures budgétaires uniques. Nous adaptons chaque forfait pour qu'il corresponde au modèle du club.
  items:
    - title: Clubs de paddle universitaires et collégiaux
      subtitle: Flottes étudiantes à forte utilisation
      description: Clubs de paddle gérés par des étudiants ou soutenus par des établissements proposant des programmes de SUP et de kayak pour les départements de loisirs universitaires. L’équipement est confronté à une utilisation à haute fréquence et à un taux de rotation élevé sur plusieurs niveaux de compétence chaque semestre. La durabilité et la facilité de réparation sont essentielles, ainsi que des prix abordables pour les organisations étudiantes.
      features:
        - 'Construction PVC ultra-résistante conçue pour les cycles d’utilisation étudiants'
        - 'Gammes de planches codées par couleur selon le niveau pour une gestion facile de la flotte'
        - 'Kit de réparation + assistance vidéo à la demande inclus avec chaque commande'
        - 'Tarifs préférentiels pour les organisations étudiantes et paiement échelonné par semestre'
    - title: Clubs communautaires et sociaux de paddle
      subtitle: Clubs récréatifs dirigés par leurs membres
      description: Clubs communautaires proposant à leurs membres des expériences de SUP, de kayak et de canotage social. L'équipement doit équilibrer performance et confort pour une large tranche d'âge, avec une image de marque qui favorise l'identité du club et la fierté des membres. L’efficacité du stockage est essentielle pour les clubs opérant à partir d’un accès limité au front de mer.
      features:
        - 'Flotte mixte : SUP polyvalents, planches de randonnée et kayaks de loisir'
        - 'Image de marque complète du club : couleurs personnalisées, impression du logo, gilets de sauvetage personnalisés'
        - 'Solutions de stockage compactes pour les équipements gonflables'
        - 'Kit de démarrage pour la croissance des adhésions : cartes de parrainage, photographie personnalisée'
    - title: Écoles de surf et académies de surf kayak
      subtitle: Performance et coaching côtier
      description: "Écoles axées sur le surf qui enseignent le SUP surf, le surf kayak et le wave riding. L'équipement doit fonctionner dans des conditions de surf : maniable, réactif et suffisamment durable pour supporter les effacements répétés, l'abrasion du sable et l'exposition à l'eau salée sans dégradation rapide."
      features:
        - 'Formes de SUP plus courtes et plus larges optimisées pour la maniabilité dans les vagues'
        - 'Construction de rails renforcée pour résister aux impacts dans les vagues'
        - 'Équipement de sécurité spécifique au surf : leashes en spirale, options d’ailerons souples'
        - 'Programme de remplacement de flotte avec remises saisonnières sur la reprise'
    - title: Clubs nautiques corporatifs et privés
      subtitle: Expériences de membre Premium
      description: "Clubs privés exclusifs proposant des sports nautiques comme commodité premium pour les membres. Les normes d'équipement sont élevées : l'esthétique, l'alignement de la marque et la présentation prête pour les invités sont aussi importants que la performance. Les attentes en matière de service incluent une livraison en gants blancs, des solutions de stockage personnalisées et une assistance de niveau concierge."
      features:
        - 'Planches à finition premium avec EVA effet bois et accents métalliques'
        - 'Personnalisation des couleurs selon les directives de la marque du club'
        - 'Livraison conciergerie : pré-gonflées, préparées et étiquetées pour chaque saison'
        - 'Gestion de compte dédiée avec SLA de réponse prioritaire'
