testimonial:
  content: Nous avons commencé avec le Club Starter Package pour notre école de surf au Portugal. 20 planches, pagaies, gilets — tout est arrivé dans les 3 semaines. Après deux saisons, nous sommes passés au package Pro. Le branding personnalisé avec notre logo a changé la donne pour notre image professionnelle.
  name: Ricardo Santos
  title: Propriétaire, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Profils de clubs
  title: Solutions pour clubs de sports nautiques<br />Par type de club
  subtitle: Des clubs de paddle universitaires aux yacht clubs privés exclusifs, chaque type de club a des besoins en équipement, des modèles d'utilisation et des structures budgétaires uniques. Nous adaptons chaque forfait pour qu'il corresponde au modèle du club.
  items:
    - title: Clubs de paddle universitaires et collégiaux
      subtitle: Flottes étudiantes à forte utilisation
      description: Clubs de paddle dirigés par des étudiants ou soutenus par des institutions, proposant SUP programmes pour les services de loisirs universitaires. Le matériel subit une utilisation à haute fréquence et à rotation rapide à travers plusieurs niveaux de compétence chaque semestre. La durabilité et la facilité de réparation sont cruciales, ainsi qu'une tarification adaptée aux budgets des organisations étudiantes.
      features:
        - Construction PVC extra-durable évaluée pour les cycles d'utilisation étudiante
        - Gammes de planches codées par couleur selon le niveau de compétence pour une gestion facile de la flotte
        - Kit de réparation + avec support vidéo disponible sur demande inclus à chaque commande
        - Tarification avec remise pour les organisations étudiantes et conditions de paiement basées sur le semestre
    - title: Clubs communautaires et sociaux de paddle
      subtitle: Clubs récréatifs dirigés par leurs membres
      description: Clubs communautaires offrant des expériences de pagaie et sociales SUP à leurs membres. Les équipements doivent équilibrer performance et confort pour une large tranche d'âge, avec un branding qui favorise l'identité du club et la fierté des membres. L'efficacité du stockage est essentielle pour les clubs opérant avec un accès limité au littoral.
      features:
        - 'Flotte mixte : SUPs polyvalentes et de randonnée'
        - 'Branding complet du club : couleurs personnalisées, impression du logo, gilets de sauvetage brandés'
        - Solutions de stockage compactes pour les équipements gonflables
        - 'Kit de démarrage pour la croissance des membres : cartes de parrainage, photographie brandée'
    - title: Écoles de surf & Académies SUP
      subtitle: Performance et coaching côtier
      description: Écoles axées sur le surf enseignant les compétences de surf et de glisse SUP. Les équipements doivent être performants dans les conditions de surf — maniables, réactifs et assez durables pour résister aux chutes répétées, à l'abrasion du sable et à l'exposition à l'eau salée sans dégradation rapide.
      features:
        - Formes plus courtes et plus larges SUP optimisées pour la maniabilité dans le surf
        - Construction de rails renforcée pour la résistance aux impacts dans les vagues
        - 'Équipements de sécurité spécifiques au surf : leashs enroulés, options à ailerons souples'
        - Programme de remplacement de flotte avec remises saisonnières à l'échange
    - title: Clubs nautiques corporatifs et privés
      subtitle: Expériences de membre Premium
      description: "Clubs privés exclusifs proposant des sports nautiques comme commodité premium pour les membres. Les normes d'équipement sont élevées : l'esthétique, l'alignement de la marque et la présentation prête pour les invités sont aussi importants que la performance. Les attentes en matière de service incluent une livraison en gants blancs, des solutions de stockage personnalisées et une assistance de niveau concierge."
      features:
        - Planche à finition premium avec imitation bois EVA et accents métalliques
        - Correspondance de couleur personnalisée selon les directives de la marque du club
        - 'Livraison concierge : pré-gonflée, mise en scène et étiquetée pour chaque saison'
        - Gestion de compte dédiée avec SLA de réponse prioritaire
