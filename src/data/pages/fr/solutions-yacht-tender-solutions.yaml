content_challenge:
  tagline: Le défi
  title: 'Les tenders de yacht exigent<br />performance et présentation'
  subtitle: "Un tender de yacht est bien plus qu'une annexe — c'est une extension du navire mère et un gage de qualité."
  paragraphs:
    - "Propriétaires de yachts et capitaines ont besoin de tenders performants, compacts au stockage et d'un bel aspect. Le tender doit compléter l'esthétique du yacht tout en assurant un transport fiable des invités et de l'équipage."
    - "**Le stockage est essentiel** — Le tender doit trouver sa place sur le pont, dans un garage ou sur des davits. Le poids est déterminant pour les systèmes de mise à l'eau et de récupération. Les RIB Paddle Board Overstock offrent un excellent rapport puissance/poids avec des profils de stockage compacts."
    - "**Les exigences de performance sont élevées** — Les invités s'attendent à une navigation confortable et sèche lors des transferts à terre. Les options de moteur doivent équilibrer vitesse, autonomie et niveau sonore pour une expérience premium. En opération de charter, le tender est utilisé quotidiennement et doit supporter un usage intensif."
    - "**L'apparence compte** — Un tender non assorti ou usé nuit à la présentation générale du yacht. Des couleurs de flotteurs personnalisées, une sellerie et un branding assortis garantissent que le tender s'intègre parfaitement."
content_solution:
  tagline: Notre solution
  title: 'Configurations de tender<br />Pour chaque application nautique'
  subtitle: "Les tenders RIB Paddle Board Overstock peuvent être personnalisés pour s'adapter à votre navire, votre type d'opération et vos exigences de stockage — des spécifications de chantiers de superyachts aux programmes de flotte charter."
  list:
    - 'Couleurs de flotteurs personnalisées assorties ou complémentaires au navire mère — toutes les couleurs RAL disponibles pour flotteurs Hypalon ou PVC'
    - 'Sellerie et coutures personnalisées — vinyle marine premium avec correspondance des couleurs et broderie de logo'
    - "Direction console ou barre — selon le mode d'utilisation et la préférence de l'opérateur"
    - 'Coque en V profond en fibre de verre pour une navigation confortable et sèche dans diverses conditions de mer'
    - "Stockage compact — se dégonfle ou s'empile pour un garage de pont, une soute ou des davits"
    - "Flotteurs Hypalon pour une résistance aux UV et une préservation durable de l'apparence"
    - 'Points de levage et anneaux de remorquage de série sur tous les modèles'
    - 'Capote de proue, capote intégrale et protections anti-frottement en option'
    - 'Gamme de moteurs : de 15 HP à 60 HP — configurations hors-bord ou barre'
    - 'Marquage OEM/privé disponible pour les chantiers navals et les distributeurs marines'
content_segments:
  tagline: Profils clients
  title: 'Solutions de tenders pour yachts<br />Par type de client'
  subtitle: 'Les différents segments du secteur du yachting ont des exigences uniques. Paddle Board Overstock configure des tenders adaptés à chaque application.'
  items:
    - title: Chantiers de superyachts
      subtitle: Intégration OEM du tender — dimensions, couleurs et matériaux personnalisés
      description: "Les chantiers navals font face à un défi récurrent : chaque nouveau navire présente des contraintes dimensionnelles, des limites de poids et des attentes esthétiques uniques. Le tender doit s'intégrer parfaitement au système de davits du navire mère, s'insérer dans des dimensions de garage précises et s'accorder au langage de design d'un yacht de plusieurs millions d'euros. Tout écart — couleur de flotteur incorrecte, emplacement de points de levage inadéquat, poids incompatible — retarde la livraison et rejaillit sur l'image du chantier. Paddle Board Overstock travaille directement avec les équipes d'approvisionnement et de design des chantiers pour livrer des tenders avec couleurs RAL de flotteurs personnalisées, sellerie assortie, panneaux de console marqués et dossiers de documentation OEM complets."
      features:
        - 'Spécifications dimensionnelles personnalisées conformes aux contraintes du garage et des davits'
        - 'Toute couleur RAL de flotteur et sellerie assortie — échantillons de validation design fournis'
        - 'Marquage OEM sur console, flotteurs et dossiers de sièges'
        - "Validation de l'ajustement des points de levage et des davits pour chaque modèle"
        - "Poids de coque optimisé pour les systèmes de mise à l'eau et de récupération spécifiés"
        - 'Planification des livraisons en série alignée sur les calendriers de production'
    - title: Sociétés de gestion de yachts
      subtitle: Tenders de flotte standardisés — support mondial, temps d'arrêt minimaux
      description: "Les sociétés de gestion supervisent plusieurs yachts opérant en Méditerranée, dans les Caraïbes, dans le Pacifique Sud et au-delà. Leur besoin central est la fiabilité — un tender en panne dans un port isolé signifie des heures supplémentaires d'équipage, des plaintes d'invités et des remplacements coûteux de dernière minute. Des spécifications de flotte standardisées réduisent le temps de formation de l'équipage entre les navires et simplifient la gestion des pièces de rechange. Paddle Board Overstock propose des tarifs de flotte multinavires, des spécifications cohérentes entre les commandes et un support mondial de pièces détachées pour les sociétés de gestion dont les navires opèrent dans plusieurs régions."
      features:
        - "Spécifications standardisées sur l'ensemble de la flotte gérée"
        - 'Pièces de rechange interchangeables sur tous les tenders de la flotte'
        - 'Tarifs de flotte et remises sur volume pour les commandes multi-unités'
        - 'Disponibilité mondiale des pièces détachées — expédition rapide vers tout port'
        - "Documentation de service et de maintenance uniforme pour l'équipage"
        - 'Coordination des livraisons multi-unités vers différents emplacements de navires'
    - title: Opérateurs de charter
      subtitle: Opérations quotidiennes à haute fréquence — durabilité sans compromis sur l'apparence
      description: "Les tenders de charter subissent le calendrier opérationnel le plus exigeant du secteur : transferts quotidiens d'invités, sorties à terre, support de sports nautiques et navette portuaire — souvent plus de 200 opérations par saison de charter. Le tender doit rester impeccable à chaque remise aux invités tout en résistant aux embarquements continus, à l'exposition à l'eau salée et aux heures de moteur. La dégradation esthétique est une préoccupation commerciale directe — un tender usé affecte les avis des invités et les tarifs de charter. Paddle Board Overstock configure les tenders de charter avec une sellerie améliorée, des flotteurs Hypalon renforcés et des zones de manipulation consolidées pour une durabilité à long terme qui préserve la qualité de présentation."
      features:
        - 'Flotteurs Hypalon renforcés — durée de vie de 5 à 8 ans en service charter quotidien'
        - "Marchepieds d'embarquement et lignes d'appui renforcés pour un usage fréquent"
        - 'Sellerie vinyle premium résistante aux taches — nettoyage facile entre deux charters'
        - 'Surfaces de pont antidérapantes faciles à nettoyer'
        - 'Packages hors-bord fiables avec accès maintenance facile pour une rotation rapide'
        - "Matériaux de qualité esthétique qui conservent l'apparence au fil des saisons de charter"
    - title: Distributeurs et courtiers de yachts
      subtitle: Approvisionnement fiable en tenders pour la finalisation des navires et la valeur de revente
      description: "Les distributeurs et courtiers ont besoin d'un approvisionnement stable en tenders de qualité qui complètent les navires qu'ils vendent — en phase avec le positionnement de la marque et améliorant l'expérience de l'acheteur. Un tender incohérent ou un retard d'approvisionnement peut retarder la livraison d'un yacht ou nuire à la présentation d'une annonce. Les distributeurs exigent une qualité constante entre les lots, des délais fiables et des prix compétitifs pour préserver leurs marges. Paddle Board Overstock propose des programmes de stock distributeurs avec planification des livraisons saisonnières, des options de co-marquage pour la présentation en showroom et une allocation prioritaire en haute saison."
      features:
        - 'Programmes de stock avec modèles disponibles à la demande'
        - 'Planification des livraisons saisonnières alignée sur le calendrier des remises de navires'
        - 'Co-marquage distributeur sur console et flotteurs pour la présentation en showroom'
        - 'Qualité et spécifications constantes sur toutes les commandes par lots'
        - 'Tarifs distributeurs compétitifs avec niveaux basés sur le volume'
