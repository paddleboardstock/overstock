testimonials:
  - category: pros
    name: Ricardo Santos
    title: Propriétaire, Algarve Surf Academy
    location: Lagos, Portugal
    content: Nous avons commencé avec le Club Starter Package pour notre école de surf. 20 planches, pagaies, gilets — tout est arrivé dans les 3 semaines. Après deux saisons, nous sommes passés au package Pro. Le branding personnalisé avec notre logo a changé la donne pour notre image professionnelle.
    rating: 5
    product: Forfait de démarrage du club
    source: solutions/clubs
  - category: pros
    name: Propriétaire du club
    title: Club de sports nautiques
    location: Phuket, Thaïlande
    content: 'Le forfait Club Starter était le point d’entrée idéal. Au fur et à mesure que notre entreprise se développait, Paddle Board Overstock grandissait avec nous : même qualité, même prix, pas de surprises. Nous sommes passés de 10 à 80 planches en 18 mois.'
    rating: 5
    product: Club Starter + Forfait Premium
    source: success-stories
  - category: stations balnéaires
    name: Directeur général du complexe
    title: Complexe balnéaire 5 étoiles
    location: Grèce
    content: "Paddle Board Overstock ne s'est pas contenté de livrer des planches : ils nous ont aidés à créer une expérience client complète. Notre programme de sports nautiques est passé de zéro à un moment phare de la station en une seule saison. Plus de 300 réservations hebdomadaires et 180 000 $ de revenus annuels."
    rating: 5
    product: Forfait Premium Complexe
    source: success-stories
  - category: stations balnéaires
    name: Sophie St-Laurent
    title: Directeur de l'expérience client, Azure Bay Resorts
    location: Phuket, Thaïlande
    content: Paddle Board Overstock a conçu et équipé l'ensemble de notre programme d'activités de plage dans trois propriétés de villégiature. 80 SUP, 40 kayaks, une infrastructure de sécurité et une formation du personnel, le tout livré en un seul envoi. La participation des invités a augmenté de 60 % au cours de la première saison.
    rating: 5
    product: Forfait Premium Complexe
    source: solutions/resorts
  - category: entrepreneurs
    name: Michel Parc
    title: Fondateur, Shoreline Paddle Co.
    location: Californie, États-Unis
    content: J'ai lancé ma marque SUP sans aucune expérience dans l'industrie. L'équipe d'Paddle Board Overstock m'a guidé depuis la sélection des produits jusqu'à la conception et l'emballage du logo personnalisé. Mon premier conteneur est arrivé en 11 semaines et je l'ai vendu en 3 mois sur Amazon.
    rating: 5
    product: Lancement de la marque Starter
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Fondateur
    title: Marque australienne de SUP
    location: Australie
    content: J'avais l'idée de la marque mais aucune connaissance en fabrication. Paddle Board Overstock m'a littéralement tenu la main tout au long du processus, depuis le choix du bon modèle de planche jusqu'au déballage de mon premier envoi. 90 jours du rêve à la livraison.
    rating: 5
    product: Forfait de lancement de marque
    source: success-stories
  - category: de location
    name: Daniel Okonkwo
    title: Propriétaire, Lakeland SUP Rentals
    location: British Columbia, Canada
    content: Je louais 5 planches dans un magasin local et je perdais 60 % de mes revenus grâce à eux. Paddle Board Overstock m'a aidé à construire ma propre flotte de 15 SUP. Le calculateur de retour sur investissement a montré le seuil de rentabilité en 4 mois – il en a fallu 3. Maintenant, je passe à 30 cartes.
    rating: 5
    product: Kit de démarrage de flotte
    source: solutions/rental-business
  - category: de location
    name: Marco Valenti
    title: Directeur des opérations, Adriatic Adventure Tours
    location: Dubrovnik, Croatie
    content: Nous avons équipé toute notre flotte de location de semi-rigides Paddle Board Overstock – 12 bateaux répartis sur trois sites. Deux saisons passées, zéro échec. La documentation de certification CE a rendu l’approbation de l’assurance transparente. Leur équipe d'ingénieurs a même personnalisé les couleurs des tubes.
    rating: 5
    product: Kit d'extension de flotte
    source: trust
  - category: de location
    name: Lieutenant-commandant Andres Reyes
    title: Responsable des achats maritimes, Garde côtière auxiliaire des Philippines
    location: Manille, Philippines
    content: 'Nous exploitons 24 Paddle Board Overstock RIB dans notre flotte de patrouille côtière. Leur processus de contrôle qualité est cohérent pour chaque lot : même qualité de couture, même emplacement de valve, même pression nominale à chaque fois. Cette répétabilité est importante lorsque des vies dépendent de l’équipement.'
    rating: 5
    product: Flotte de patrouille RIB
    source: trust
  - category: consommateurs
    name: Sarah K.
    title: Premier propriétaire de SUP
    location: Lac Tahoe, États-Unis
    content: Stable même pour un débutant complet. Je l'ai sorti sur le lac le premier jour et je ne suis jamais tombé. Le package complet avec pompe et pagaie m'a permis d'être sur l'eau 20 minutes après avoir ouvert la boîte.
    rating: 5
    product: SUP Explorateur 11
  - category: consommateurs
    name: James Thornton
    title: Propriétaire du SUP Explorer 11
    location: Vancouver, Canada
    content: En tant que premier acheteur, j’étais nerveux à l’idée de commander des produits de qualité à l’étranger. La documentation ISO et les rapports de tests tiers qu'ils ont partagés avant même que je le demande m'ont donné une totale confiance. La planche est arrivée en 6 jours et a dépassé mes attentes.
    rating: 5
    product: SUP Explorateur 11
    source: trust
  - category: consommateurs
    name: Mike R.
    title: Kayakiste récréatif
    location: Floride, États-Unis
    content: Qualité de construction solide. Gère bien mieux les côtelettes côtières que ce à quoi je m’attendais d’un bateau gonflable. Je l'ai emballé dans le coffre de ma voiture pour un week-end – gonflé sur la rampe en moins de 4 minutes.
    rating: 5
    product: Kayak gonflable
