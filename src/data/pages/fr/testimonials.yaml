testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Propriétaire, Algarve Surf Academy
    location: Lagos, Portugal
    content: Nous avons commencé avec le Club Starter Package pour notre école de surf. 20 planches, pagaies, gilets — tout est arrivé dans les 3 semaines. Après deux saisons, nous sommes passés au package Pro. Le branding personnalisé avec notre logo a changé la donne pour notre image professionnelle.
    rating: 5
    product: Forfait de démarrage du club
    source: solutions/clubs
  - category: clubs
    name: Propriétaire du club
    title: Club de sports nautiques
    location: Phuket, Thaïlande
    content: Le Pack de démarrage pour club était le point d'entrée parfait. À mesure que notre entreprise grandissait, Paddle Board Overstock grandissait avec nous — même qualité, mêmes prix, pas de surprises. Nous sommes passés de 10 à 80 planches en 18 mois.
    rating: 5
    product: Club Starter + Forfait Premium
    source: success-stories
  - category: resorts
    name: Directeur général du complexe
    title: Complexe balnéaire 5 étoiles
    location: Grèce
    content: Paddle Board Overstock ne se contentait pas de livrer des planches — ils nous ont aidés à créer une expérience client complète. Notre programme de sports nautiques est passé de zéro à l’attraction phare du complexe en une saison. 300+ réservations hebdomadaires et 180 000 $ de revenus annuels.
    rating: 5
    product: Forfait Premium Complexe
    source: success-stories
  - category: resorts
    name: Sophie St-Laurent
    title: Directeur de l'expérience client, Azure Bay Resorts
    location: Phuket, Thaïlande
    content: Paddle Board Overstock a conçu et équipé l'ensemble de notre programme d'activités de plage sur trois propriétés de villégiature. 120 SUPs, infrastructures de sécurité et formation du personnel — tout livré en un seul envoi. La participation des clients a augmenté de 60 % lors de la première saison.
    rating: 5
    product: Forfait Premium Complexe
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Propriétaire, Lakeland SUP Rentals
    location: British Columbia, Canada
    content: Je louais 5 planches dans un magasin local et je perdais 60 % de mes revenus au profit de ce magasin. Paddle Board Overstock m'a aidé à constituer ma propre flotte de 15 SUPs. Le calculateur ROI montrait le seuil de rentabilité en 4 mois — il a fallu 3 mois. Maintenant, je passe à 30 planches.
    rating: 5
    product: Kit de démarrage de flotte
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Directeur des opérations, Adriatic Adventure Tours
    location: Dubrovnik, Croatie
    content: Nous avons équipé toute notre flotte de location SUP avec des planches Paddle Board Overstock — 30 planches réparties sur trois sites. Deux saisons plus tard, zéro défaillance. La qualité constante de chaque lot a facilité notre choix, et leur équipe a même assorti les couleurs à notre marque.
    rating: 5
    product: Forfait Flotte de Location
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Proprietaire, Locations SUP du Lac de Garde
    location: Lac de Garde, Italie
    content: Nos planches de location sortent cinq fois par jour en haute saison. Depuis le passage à Paddle Board Overstock, les plaintes pour dommages ont presque disparu et les clients ne cessent de demander où ils peuvent acheter leur propre planche.
    rating: 5
    product: Forfait Flotte de Location
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Premier propriétaire de SUP
    location: Lac Tahoe, États-Unis
    content: Stable même pour un débutant complet. Je l'ai sorti sur le lac le premier jour et je ne suis jamais tombé. Le package complet avec pompe et pagaie m'a permis d'être sur l'eau 20 minutes après avoir ouvert la boîte.
    rating: 5
    product: SUP Explorateur 11
  - category: consumers
    name: James Thornton
    title: Propriétaire du SUP Explorer 11
    location: Vancouver, Canada
    content: En tant que premier acheteur, j'étais nerveux à l'idée de commander depuis l'étranger. La qualité de construction s'est imposée dès que j'ai ouvert la boîte — rigide, coutures parfaites, et elle est arrivée en seulement 6 jours.
    rating: 5
    product: SUP Explorateur 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Paddleur du Week-end
    location: Floride, États-Unis
    content: Qualité de construction solide. Gère bien mieux les côtelettes côtières que ce à quoi je m’attendais d’un bateau gonflable. Je l'ai emballé dans le coffre de ma voiture pour un week-end – gonflé sur la rampe en moins de 4 minutes.
    rating: 5
    product: SUP Brise Tropicale
