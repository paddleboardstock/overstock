hero:
  tagline: Notre équipe
  title: 'Les personnes derrière Paddle Board Overstock<br />— L''ingénierie de la liberté sur l''eau'
  subtitle: 'Fondée en 2012 à Qingdao, en Chine, Paddle Board Overstock a été créée par des ingénieurs marins, des scientifiques des matériaux et des passionnés de sports nautiques qui croyaient qu''il fallait rendre les embarcations gonflables de qualité professionnelle accessibles dans le monde entier.'
  image:
    src: /images/team-all.webp
    alt: Photo de toute l'équipe Paddle Board Overstock — ingénierie, production et direction
founding:
  tagline: Notre fondation
  title: 'D''un atelier côtier<br />à une installation de 12 000 m²'
  subtitle: 'Paddle Board Overstock a été fondée par une équipe d''ingénieurs marins cumulant des décennies d''expérience dans la conception de bateaux gonflables, la fabrication PVC/Hypalon et la production mondiale d''équipements marins.'
  items:
    - title: 'Fondée : 2012'
      description: 'Établie à Qingdao, en Chine — un pôle maritime majeur doté d''un riche héritage de construction navale.'
      icon: tabler:calendar
    - title: '200-300 employés'
      description: 'Dont 50+ ingénieurs R&D, des spécialistes du contrôle qualité et des techniciens de production.'
      icon: tabler:users
    - title: 'Installation de 12 000 m²'
      description: 'Usine de fabrication dédiée avec 6 lignes de production pour les RIB, les bateaux gonflables et les planches SUP.'
      icon: tabler:building-factory
    - title: '50+ pays desservis'
      description: 'Exportation vers l''Europe, les Amériques, le Moyen-Orient, l''Asie-Pacifique et l''Afrique.'
      icon: tabler:globe
leadership:
  tagline: Direction
  title: 'Leadership en management & ingénierie'
  subtitle: 'Notre équipe de direction réunit une expertise approfondie en ingénierie marine, en commerce international et en management de la qualité.'
  columns: 3
  items:
    - title: 'Fondateur & PDG'
      name: 'Toby Liu'
      description: '15+ ans dans la fabrication marine. Auparavant responsable R&D chez un grand constructeur de bateaux chinois. Détient plusieurs brevets dans la conception de bateaux gonflables.'
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: 'Ingénieur en chef'
      name: 'Zhang Wei'
      description: '20+ ans dans la fabrication PVC/Hypalon et la conception de coques en V profond. Ancien directeur technique d''un bureau d''ingénierie marine européen.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Responsable R&D'
      name: 'Chen Ming'
      description: 'Doctorat en science des matériaux. Spécialiste de la technologie drop-stitch et du soudage haute fréquence. 10+ ans dans les composites textiles.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Directeur de production'
      name: 'Liu Qiang'
      description: '18+ ans dans le lean manufacturing et l''optimisation des lignes de production. Ceinture noire Six Sigma. A mis en place des systèmes qualité ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Responsable qualité'
      name: 'Wang Fang'
      description: '12+ ans dans le contrôle qualité marine. Auditrice certifiée CE et ISO. Supervise les tests de chaque lot de production.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Directrice commerciale & des opérations'
      name: 'Helen Lee'
      description: '15+ ans dans le commerce B2B international. A géré des partenariats OEM/ODM dans plus de 30 pays. Parle 4 langues.'
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Philosophie de conception
  title: 'Une conception guidée par l''ingénierie<br />— Chaque détail compte'
  subtitle: 'Notre philosophie d''ingénierie repose sur trois principes qui guident chaque produit que nous construisons.'
  list:
    - 'Fiabilité avant tout : chaque produit Paddle Board Overstock est testé pour résister aux conditions réelles — des opérations de sauvetage en eau froide aux locations dans les resorts tropicaux. Nous sur-ingénierons là où cela compte le plus.'
    - 'Précision de fabrication : nos installations utilisent la découpe CNC, le soudage haute fréquence et des tests de pression automatisés. Chaque couture, chaque valve, chaque raccord respecte des spécifications documentées.'
    - 'Innovation continue : notre équipe R&D évalue en permanence de nouveaux matériaux, de nouvelles méthodes de production et des améliorations de conception. Nous n''attendons pas les problèmes — nous les anticipons.'
cta:
  title: 'Vous souhaitez discuter d''un projet avec notre équipe ?'
  subtitle: 'Nos ingénieurs sont prêts à vous conseiller sur la sélection des produits, la personnalisation et les partenariats OEM/ODM.'
  actions:
    - variant: primary
      text: Contacter notre équipe
      href: /contact
    - text: Voir nos produits
      href: /products
