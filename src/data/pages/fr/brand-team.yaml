hero:
  tagline: Notre équipe
  title: Les personnes derrière Paddle Board Overstock<br />— Ingénierie de la liberté sur l'eau
  subtitle: Fondée en 2012 à Weihai, en Chine, Paddle Board Overstock a été créée par des ingénieurs marins, des scientifiques des matériaux et des passionnés de sports nautiques qui croyaient en l'accessibilité mondiale des planches à pagaie gonflables de qualité professionnelle.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock photo complète de l'équipe — ingénierie, production et direction
founding:
  tagline: Notre fondation
  title: D'un atelier côtier<br />à une installation de 12 000 m²
  subtitle: Paddle Board Overstock a été fondée par une équipe d'ingénieurs marins ayant des décennies d'expérience combinée dans la conception de SUP gonflables, la construction drop-stitch, et la fabrication mondiale de sports nautiques.
  items:
    - title: 'Fondée : 2012'
      description: Établie à Weihai, en Chine — un important hub maritime avec un profond héritage en construction navale.
      icon: tabler:calendar
    - title: 200-300 employés
      description: Comprenant 14+ ingénieurs R&D, spécialistes du contrôle qualité et techniciens de production.
      icon: tabler:users
    - title: Installation de 12 000 m²
      description: Usine de production dédiée avec 6 lignes de production pour les planches et accessoires SUP.
      icon: tabler:building-factory
    - title: 50+ pays desservis
      description: Exportation vers l’Europe, les Amériques, le Moyen-Orient, l’Asie-Pacifique et l’Afrique.
      icon: tabler:globe
leadership:
  tagline: Direction
  title: Direction et leadership en ingénierie
  subtitle: Notre équipe dirigeante réunit une expertise approfondie en ingénierie maritime, commerce international et gestion de la qualité.
  columns: 3
  items:
    - title: Fondateur et PDG
      name: Toby Liu
      description: 15+ ans dans la fabrication maritime. A précédemment dirigé la R&D chez un important fabricant maritime chinois. Détient plusieurs brevets en conception de produits gonflables.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Ingénieur en chef
      name: Zhang Wei
      description: 20+ ans dans la fabrication de polymères et la conception de structures gonflables. Ancien directeur technique dans une entreprise européenne d’ingénierie maritime.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Directeur de la R&D
      name: Chen Ming
      description: PhD en science des matériaux. Spécialiste de la technologie drop-stitch et des procédés de soudure haute fréquence. 10+ ans dans les composites textiles.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Directeur de production
      name: Liu Qiang
      description: 18+ ans dans la fabrication allégée et l'optimisation des lignes de production. A construit les systèmes de qualité derrière notre taux de défauts de 99,3 %.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Responsable Qualité
      name: Wang Fang
      description: 12+ ans dans le contrôle qualité maritime. Supervise les tests de pression, de couture et de charge pour chaque lot de production avant sa mise sur le marché.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Directrice des Ventes et des Opérations
      name: Helen Lee
      description: 15+ ans dans le commerce électronique international et la logistique. Expédie des planches à des pagayeurs dans 50+ pays. Parle couramment 4 langues.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Philosophie de Conception
  title: Conception Axée sur l'Ingénierie<br />— Chaque Détail Compte
  subtitle: Notre philosophie d'ingénierie repose sur trois principes qui guident chaque produit que nous fabriquons.
  list:
    - "Fiabilité Avant Tout : Chaque produit Paddle Board Overstock est testé pour résister aux conditions réelles — des expéditions en eau froide aux locations sur des plages tropicales. Nous surconcevons là où c'est le plus important."
    - 'Précision de Fabrication : Nos installations utilisent la découpe CNC, le soudage haute fréquence et des tests de pression automatisés. Chaque couture, chaque valve, chaque raccord répond aux spécifications documentées.'
    - "Innovation Continue : Notre équipe R&D évalue continuellement de nouveaux matériaux, méthodes de production et améliorations de conception. Nous n'attendons pas les problèmes — nous les anticipons."
cta:
  title: Vous voulez discuter d'un projet avec notre équipe ?
  subtitle: Notre équipe est prête à vous aider à choisir la bonne planche, les accessoires et le matériel adaptés à votre style de pagaie.
  actions:
