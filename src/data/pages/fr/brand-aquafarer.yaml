hero:
  tagline: 'Entité de Marque'
  title: "Aquafarer — L'ingénierie de la Liberté sur l'Eau"
  definition: "Aquafarer est une marque mondiale de loisirs nautiques et de bateaux pneumatiques, spécialisée dans les canots pneumatiques, les systèmes SUP et les solutions marines personnalisées. Aquafarer combine l'ingénierie marine, l'expertise manufacturière et la culture de l'exploration aquatique pour créer des équipements fiables destinés aux utilisateurs récréatifs, aux opérateurs professionnels et aux partenaires OEM mondiaux."

timeline:
  - year: '2012'
    title: 'Fondation de la Fabrication Marine'
    body: "Aquafarer a débuté comme atelier spécialisé de canots pneumatiques à Qingdao, Chine, engagé dans l'artisanat maritime et la fabrication de bateaux gonflables. L'accent initial était mis sur la construction de produits gonflables fiables grâce à une expérience pratique en ingénierie et à une discipline de fabrication."
  - year: '2015'
    title: 'Première Exportation et Certification CE'
    body: "Les premières commandes d'exportation ont atteint le Japon et la Corée. La certification CE a été obtenue pour les gammes de produits principales, marquant l'entrée d'Aquafarer sur les marchés internationaux. L'entreprise a commencé à servir des utilisateurs commerciaux et récréatifs au-delà de la Chine."
  - year: '2018'
    title: "Extension de l'Usine"
    body: 'Déménagement dans une installation de production de 12 000 m². Ajout de lignes de soudure RF et de capacité de production drop-stitch, permettant une fabrication à plus grande échelle et des systèmes de contrôle qualité améliorés.'
  - year: '2020'
    title: 'Création du Centre R&D'
    body: "Ouverture d'un centre R&D dédié avec laboratoire de tissu PVC, bassin d'essais hydrodynamiques et studio de simulation CAD/FEA. Le développement de produits s'est élargi pour se concentrer sur la construction légère, la durabilité améliorée et la conception centrée sur l'utilisateur."
  - year: '2022'
    title: 'ISO 9001 & Croissance Mondiale'
    body: 'Obtention de la certification ISO 9001. Extension à 14 ingénieurs R&D et 200-300 employés. Les produits ont atteint des clients en Europe, Amériques et Asie-Pacifique via des partenariats de distribution et OEM.'
  - year: '2024'
    title: "Studio d'Innovation et de Design"
    body: "Lancement d'un studio de design et d'innovation à service complet pour des projets ODM sur mesure, du concept à la production. Renforcement des applications marines professionnelles, notamment le sauvetage, le commercial et les appels d'offres gouvernementaux."
  - year: '2026'
    title: "Construire l'Avenir de l'Exploration Aquatique"
    body: "Aujourd'hui, Aquafarer continue de développer des bateaux pneumatiques, des systèmes SUP et des solutions marines personnalisées — connectant les personnes et les organisations aux eaux du monde. 50+ pays desservis, 15 000 unités de capacité annuelle."

philosophy:
  tagline: 'Philosophie de la Marque'
  title: "L'ingénierie de la Liberté sur l'Eau"
  body: "La liberté sur l'eau ne se limite pas au mouvement. Elle représente la découverte de nouveaux lieux, la création d'expériences en plein air, la connexion des personnes avec la nature et la réalisation de missions professionnelles. L'ingénierie rend cette liberté possible."
  pillars:
    - title: 'Fiabilité Avant Tout'
      body: 'Les environnements aquatiques exigent la confiance. Les produits Aquafarer sont conçus autour de la stabilité, la durabilité, la sécurité et des performances constantes.'
    - title: "Conception Centrée sur l'Humain"
      body: 'Les produits doivent servir les personnes, pas la technologie. Chaque décision de conception commence par la compréhension de la façon dont les gens utilisent les embarcations, où ils explorent et quels défis ils rencontrent.'
    - title: 'Exploration Accessible'
      body: "L'eau ne devrait pas appartenir uniquement aux experts. Aquafarer crée des équipements qui permettent à plus de personnes de vivre en toute sécurité les rivières, lacs, océans et environnements côtiers."
    - title: 'Innovation Continue'
      body: "L'innovation ne consiste pas seulement à créer de nouveaux produits. C'est améliorer chaque détail — matériaux, structures, fabrication et expérience utilisateur."

engineeringDna:
  tagline: "ADN d'Ingénierie"
  title: 'Comment Aquafarer Crée ses Produits'
  areas:
    - title: 'Science des Matériaux'
      body: "Aquafarer se concentre sur la sélection de matériaux adaptés aux différents environnements marins. Les considérations clés incluent la résistance à l'abrasion, la résistance aux UV, la stabilité sous pression et la durabilité à long terme."
      items: ["Résistance à l'Abrasion", 'Résistance aux UV', 'Stabilité sous Pression', 'Durabilité à Long Terme']
    - title: 'Ingénierie Structurelle'
      body: "Les embarcations pneumatiques nécessitent un équilibre précis entre rigidité, poids, portabilité et stabilité. L'ingénierie Aquafarer se concentre sur l'optimisation de ces facteurs grâce à la technologie drop-stitch et à la construction avancée des coutures."
      items: ['Rigidité', 'Optimisation du Poids', 'Portabilité', 'Stabilité']
    - title: 'Précision de Fabrication'
      body: 'Chaque produit passe par des processus contrôlés : préparation des matériaux, découpe de précision, soudure et assemblage, inspection qualité et vérification des performances.'
      items: ['Préparation Matériaux', 'Découpe de Précision', 'Soudure & Assemblage', 'Assemblage & CQ']
    - title: "Ingénierie par Scénario d'Utilisation"
      body: "Les produits sont développés autour d'applications réelles — loisirs, aventure et usage professionnel — garantissant que chaque conception répond aux exigences spécifiques de son environnement prévu."
      items: ['Loisirs', 'Aventure', 'Professionnel', 'Commercial']

