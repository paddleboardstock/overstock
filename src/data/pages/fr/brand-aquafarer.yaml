    title: 'Engagement Qualité'
    body: "De l'inspection des matériaux aux tests finaux, Aquafarer maintient des processus qualité systématiques pour livrer des produits marins fiables. Chaque unité subit des tests de pression, d'inspection des coutures et de vérification des performances avant expédition."
