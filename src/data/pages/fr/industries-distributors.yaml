hero:
  tagline: Distributeurs & vente en gros de sports nautiques
  title: 'Partenariat de gros<br />pour les distributeurs de sports nautiques'
  subtitle: 'Devenez partenaire de distribution Paddle Board Overstock. Accédez à notre catalogue complet, à des tarifs de gros exclusifs, au drop-shipping et à un interlocuteur dédié.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Usine Paddle Board Overstock et distribution de gros

direct_answer: 'Paddle Board Overstock propose des partenariats de gros complets aux distributeurs de sports nautiques du monde entier. Les partenaires bénéficient de tarifs de gros sur tout le catalogue, d’un gestionnaire de compte dédié, de supports marketing et d’une assistance logistique. Nous offrons des capacités de drop-shipping, le marquage privé et des quantités minimum de commande flexibles adaptées à votre modèle commercial.'

solution_offerings:
  - title: Distributor Starter
    subtitle: Pour les nouveaux partenariats et les distributeurs régionaux
    badge: Popular
    features:
      - title: Accès au catalogue complet
        description: Tarifs de gros sur toutes les planches de SUP, kayaks, RIB et accessoires
      - title: Gestionnaire de compte dédié
        description: Un interlocuteur unique pour les commandes, l’assistance et les informations produits
      - title: Supports marketing
        description: Photos produits, fiches techniques, brochures et ressources numériques dans votre langue
      - title: Assistance logistique
        description: Coordination des expéditions, documents douaniers et livraison en entrepôt
      - title: Programme d’échantillons
        description: Commandes d’échantillons à prix réduit pour vitrines et démonstrations chez les revendeurs
    cta_text: Candidater au partenariat
    cta_href: '/contact'

  - title: Distributor Premium
    subtitle: Pour les distributeurs établis couvrant plusieurs pays
    badge: Best Value
    features:
      - title: Tarifs par paliers
        description: Paliers de prix basés sur les volumes avec programmes de remises trimestrielles
      - title: Territoire exclusif
        description: Droits de distribution protégés pour votre région ou votre pays
      - title: Programme de drop-shipping
        description: Expédition directe à vos clients depuis nos entrepôts, sous votre marque
      - title: Marquage privé
        description: Soutien OEM/ODM complet pour votre propre marque — planches, bateaux et accessoires
      - title: Assistance prioritaire
        description: Garantie de réponse sous 48 heures, coordinateur logistique dédié et commandes accélérées
    cta_text: Évoluer vers Premium
    cta_href: '/contact'

  - title: Master Distributor
    subtitle: Pour les grands distributeurs régionaux et nationaux
    badge: Enterprise
    features:
      - title: Partenariat stratégique
        description: Planification commerciale conjointe, fonds de développement de marché et programmes de co-marketing
      - title: Développement de produits sur mesure
        description: Designs et spécifications de produits exclusifs pour votre marché
      - title: Soutien d’entrepôt local
        description: Stock en consignation, pièces de rechange locales et création d’un centre de service régional
      - title: Soutien au réseau de revendeurs
        description: Programmes de formation, cours de certification et intégration d’un localisateur de revendeurs
      - title: Sommet annuel des partenaires
        description: Réunions stratégiques, avant-premières produits et networking avec les partenaires mondiaux
    cta_text: Découvrir le partenariat Master
    cta_href: '/contact'

benefits:
  - title: Accès direct au fabricant
    description: Pas d’intermédiaires. Vous travaillez directement avec l’usine qui conçoit, développe et produit chaque produit.
    icon: tabler:building-factory
  - title: Marges compétitives
    description: Tarifs de gros avec remises volume, programmes de ristournes et territoires protégés.
    icon: tabler:coin
  - title: Soutien marketing
    description: Ressources produits professionnelles, brochures localisées et campagnes marketing en co-branding.
    icon: tabler:chart-bar
  - title: Partenariat logistique
    description: Expéditions coordonnées, assistance douanière et options d’entrepôt local pour réduire vos coûts logistiques.
    icon: tabler:truck-delivery

content_segments:
  tagline: Profils de partenaires
  title: 'Modèles de partenariat de distribution<br />par type de partenaire'
  subtitle: 'Les distributeurs apportent des atouts différents — infrastructure régionale, portée e-commerce, vente spécialisée ou portefeuilles multi-marques. Nous structurons les conditions de partenariat, les paliers tarifaires et les niveaux de soutien pour correspondre à chaque profil.'
  items:
    - title: Distributeurs maritimes régionaux
      subtitle: Distribution B2B à territoire exclusif
      description: 'Distributeurs établis disposant d’entrepôts, de réseaux de revendeurs et de capacités logistiques au service des concessionnaires maritimes, des détaillants de sports nautiques et des loueurs sur un territoire géographique défini. Vous avez besoin d’une gamme complète, de prix protégés et de la capacité de servir les comptes revendeurs avec stock et soutien locaux.'
      features:
        - 'Protection exclusive de territoire avec engagements minimum'
        - 'Tarifs de gros sur tout le catalogue avec remises trimestrielles sur les volumes'
        - 'Programme de stock en consignation pour les références à rotation rapide'
        - 'Formation du réseau de revendeurs et programmes marketing en co-branding'
    - title: E-commerce et détaillants en ligne
      subtitle: Canaux de distribution digital first
      description: 'Détaillants en ligne vendant des équipements de sports nautiques via Amazon, eBay ou leur propre plateforme e-commerce. La rapidité de mise sur le marché, des prix compétitifs et une logistique directe vers le consommateur sont essentielles. Vous avez besoin d’un partenaire capable d’expédier des commandes unitaires sous votre marque, avec un traitement rapide et zéro risque de stock.'
      features:
        - 'Programme de drop-shipping : traitement direct depuis l’usine sous votre marque'
        - 'Flux API de stock en temps réel pour votre plateforme e-commerce'
        - 'Intégration Amazon Seller Central avec prise en charge EAN/UPC'
        - 'Logistique des retours et traitement des réclamations de garantie inclus'
    - title: Détaillants spécialisés en sports nautiques
      subtitle: Partenaires showroom physiques
      description: 'Magasins physiques spécialisés dans les équipements de sports nautiques — au service des pagayeurs, pêcheurs et plaisanciers locaux avec vente en personne, démonstrations et service après-vente. Vous avez besoin d’ emballages optimisés pour la vente au détail, de programmes d’unités de démonstration et de matériel en point de vente qui convertit les clients de passage.'
      features:
        - 'Programme d’unités de démonstration : planches d’exposition à prix réduit'
        - 'Emballages prêts pour la vente avec conception de boîtes optimisée pour les rayons'
        - 'Présentoirs en point de vente, tableaux comparatifs et guides d’achat'
        - 'Formation et certification du personnel en magasin'
    - title: Distributeurs multi-marques et grands magasins
      subtitle: Distribution d’articles de sport à large assortiment
      description: 'Distributeurs à grande échelle servant les grands magasins, les enseignes de grande distribution et les chaînes d’articles de sport avec des catalogues multi-marques. La cohérence, la documentation de conformité et le respect des exigences des distributeurs sont essentiels — chaque référence doit satisfaire les normes d’emballage, d’étiquetage et de qualité propres à chaque distributeur.'
      features:
        - 'Documentation de conformité distributeur : spécifications d’emballage, codes-barres, étiquetage'
        - 'Intégration EDI/ASN pour les systèmes de commande des grands distributeurs'
        - 'Gestion des stocks par le fournisseur et programmes de réapprovisionnement automatique'
        - 'Gestion de compte dédiée avec SLA de réponse sous 24 heures'

cta:
  title: 'Devenez partenaire de distribution'
