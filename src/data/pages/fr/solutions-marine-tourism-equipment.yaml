content_challenge:
  tagline: Le défi
  title: 'Le tourisme marin exige<br />des navires fiables et prêts pour les passagers'
  subtitle: 'Les opérateurs touristiques ont besoin de bateaux capables de gérer des transferts quotidiens de passagers, des conditions de mer variables et des attentes élevées de la clientèle — tout en maintenant des coûts de maintenance réduits et des opérations rentables.'
  paragraphs:
    - "Les opérateurs de tourisme insulaire dans des destinations comme les Maldives, les Philippines, l'Indonésie et la Thaïlande assurent des transferts quotidiens de passagers, des sorties de snorkeling et des excursions marines. Leurs bateaux opèrent plus de 300 jours par an en environnement d'eau salée avec un temps d'immobilisation minimal pour la maintenance."
    - '**Les transferts inter-îles** exigent un transport rapide et confortable des passagers entre les resorts, les aéroports et les sites de plongée. Les passagers attendent une navigation fluide, un embarquement facile et une protection contre le soleil et les embruns. Un bateau lent ou inconfortable affecte directement la satisfaction des clients et les réservations répétées.'
    - "**Les opérateurs d'observation des baleines et des dauphins** ont besoin de bateaux capables d'atteindre rapidement la faune, de maintenir des plateformes d'observation stables et d'opérer en silence pour ne pas déranger la vie marine. La vitesse, la stabilité et la manœuvrabilité sont essentielles — les passagers attendent des rencontres rapprochées sans mal de mer."
    - "**Les entreprises de tourisme d'aventure** proposent des excursions d'exploration côtière, des visites de grottes et des expériences avec la faune marine. Leurs bateaux naviguent dans des environnements variés — du grand large aux criques peu profondes — exigeant des coques polyvalentes et une construction fiable."
    - 'Dans tous les segments, la résistance à la corrosion, le rendement énergétique et le confort des passagers sont les préoccupations majeures. Un bateau qui tombe en panne ou exige des réparations fréquentes signifie des pertes de revenus, des excursions annulées et une réputation entachée.'
content_solution:
  tagline: Notre solution
  title: 'Semi-rigides de qualité touristique<br />et équipement de flotte'
  subtitle: "Paddle Board Overstock fournit à la fois des semi-rigides commerciaux pour le transport de passagers et de l'équipement de flotte (SUP, kayaks, bateaux gonflables) pour les programmes d'activités des resorts — le tout auprès d'un seul fournisseur."
  list:
    - "Semi-rigides commerciaux de 4,8 m à 8 m — configurés pour les transferts inter-îles, les excursions de snorkeling et l'observation de la faune"
    - 'Sièges confortables avec dossiers et pare-soleil — confort des passagers pour des excursions de 1 à 2 heures'
    - 'Bau large et coque en V profond pour la stabilité — réduit le mal de mer et renforce la confiance des passagers'
    - "Options de moteur silencieux pour l'observation de la faune — perturbation minimale des animaux marins"
    - 'Échelle de plongée et plateforme de baignade — essentielles pour les excursions de snorkeling et de baignade'
    - 'Personnalisation de marque et schémas de couleurs — le logo de votre entreprise et la livrée de votre flotte sur chaque navire'
    - 'Tarifs flotte pour les commandes groupées de RIB — spécifications homogènes sur les opérations multi-bateaux'
    - "Paddleboards SUP, kayaks et bateaux gonflables pour les programmes d'activités des clients en resort"
    - "Support pièces détachées et maintenance — minimisation des temps d'arrêt pendant les hautes saisons touristiques"
content_segments:
  tagline: Segments touristiques
  title: "Solutions de tourisme marin<br />par type d'opération"
  subtitle: 'Les différentes opérations touristiques exigent des configurations de bateau différentes. Paddle Board Overstock associe le RIB adapté à votre application spécifique.'
  items:
    - title: Opérateurs de transfert inter-îles
      subtitle: 'Maldives, Philippines, Indonésie, Thaïlande — transport quotidien de clients'
      description: "Les opérateurs de tourisme insulaire d'Asie du Sud-Est et des Maldives assurent des transferts quotidiens de passagers entre aéroports, resorts et sites de plongée — souvent plus de 300 jours par an. Le bateau est la colonne vertébrale de l'expérience client. Une panne signifie des clients bloqués, des réservations annulées et une atteinte à la réputation. Ces opérateurs ont besoin de bateaux qui survivent à une utilisation intensive dans des zones isolées où le support de maintenance est limité et les pièces difficiles à trouver."
      features:
        - "Construction de qualité commerciale conçue pour plus de 300 jours d'exploitation par an"
        - 'Banquettes confortables avec dossiers pour 8 à 16 passagers'
        - 'T-top ou bimini pour la protection contre le soleil tropical et les embruns'
        - "Plateforme d'embarquement large pour un accès facile des clients avec bagages"
        - 'Compartiments de rangement secs pour les sacs des clients et les provisions du resort'
        - "Hors-bord 4 temps économe en carburant — coût d'exploitation réduit par trajet"
        - 'Boudins Hypalon robustes pour une durée de vie de 5 à 8 ans en conditions tropicales'
        - 'Conception facile à entretenir — composants accessibles pour la maintenance en zone isolée'
    - title: Opérateurs d'observation des baleines
      subtitle: "Capacité offshore, vitesse vers les zones d'observation, plateforme stable"
      description: "L'observation des baleines est un segment touristique saisonnier mais à forte valeur ajoutée, actif dans des régions comme Hervey Bay (Australie), Kaikoura (Nouvelle-Zélande), la Basse-Californie (Mexique) et les Açores. Les opérateurs doivent atteindre rapidement les zones d'observation en mer avant que les baleines ne plongent ou ne s'éloignent, maintenir une plateforme stable pendant les périodes d'observation prolongées et opérer en silence pour ne pas déranger les mammifères marins. Le confort des passagers pendant les excursions de 2 à 4 heures affecte directement les avis et les réservations répétées. Un bateau lent ou instable signifie des observations manquées et des excursions remboursées."
      features:
        - 'Configurations RIB de 7 à 10 m pour la capacité offshore en eaux libres'
        - 'Hors-bord 4 temps silencieux — nuisance sonore et vibratoire minimale'
        - "Coque en V profond avec excellente stabilité au repos — plateforme d'observation confortable"
        - "Plateforme d'observation à la proue avec garde-corps pour la photographie des clients"
        - 'Protection météo complète — T-top ou console fermée pour les conditions offshore'
        - 'Sièges ergonomiques conçus pour le confort des excursions de 2 à 4 heures'
        - "Matériaux de qualité marine pour une exposition prolongée à l'eau salée et la résistance aux UV"
    - title: Opérateurs d'observation des dauphins
      subtitle: 'Poursuite rapide, forte capacité de passagers, approche silencieuse'
      description: "L'observation des dauphins exige un équilibre différent de capacités. Les dauphins sont plus rapides et plus joueurs que les baleines : les bateaux doivent accélérer rapidement, manœuvrer avec précision et approcher les groupes sans les effrayer. Ces excursions transportent généralement plus de passagers par trajet et opèrent plus près des côtes. L'opération silencieuse est essentielle — les dauphins habitués aux moteurs bruyants évitent les bateaux, réduisant le taux d'observations. Les opérateurs ont aussi besoin de bateaux fiables pour les rotations quotidiennes multiples pendant les hautes saisons touristiques."
      features:
        - "RIB de 5,5 à 8 m pour l'agilité, la vitesse et l'accès aux eaux peu profondes"
        - 'Accélération rapide pour atteindre les groupes de dauphins actifs'
        - "Échappement silencieux et coque à faible vibration pour l'approche rapprochée"
        - "Plateforme stable au repos pour l'observation et la photographie des clients"
        - 'Forte capacité de passagers (10 à 18 personnes) pour les excursions de haute saison'
        - "Zone de sièges à la proue pour l'observation des dauphins près de l'eau"
        - "Tirant d'eau réduit pour les opérations côtières et en baie"
    - title: Tourisme d'aventure et écotourisme
      subtitle: 'Exploration côtière, visites de grottes, rencontres avec la faune'
      description: "Les opérateurs de tourisme d'aventure naviguent dans des environnements variés — traversées en haute mer, exploration de lagons peu profonds, accès aux grottes côtières et rencontres avec la faune marine. Leurs bateaux doivent être polyvalents pour des conditions de mer variables, durables pour une utilisation en zone isolée et dotés d'un tirant d'eau réduit pour accéder aux criques protégées et aux plages. La fiabilité de l'équipement est primordiale — une panne en zone isolée peut ruiner une excursion et mettre en danger les clients."
      features:
        - "Coque à tirant d'eau réduit pour l'accès aux lagons, grottes et plages"
        - 'Coque renforcée et boudins Hypalon pour la durabilité en environnements mixtes'
        - "Sièges flexibles — reconfigurables pour différents types d'excursions et tailles de groupes"
        - 'Points de fixation pour le matériel photographique et les équipements spécialisés'
        - 'Échouage facile sur plage — quille et boudins renforcés'
        - 'Protection météo pour le confort des clients pendant les excursions prolongées'
    - title: Flottes d'activités de resorts
      subtitle: 'Programmes complets de sports nautiques — RIB, SUP, kayaks, sécurité'
      description: "Les resorts qui proposent des sports nautiques dans le cadre de l'expérience client ont besoin d'une flotte qui combine variété, durabilité et image de marque. La flotte comprend généralement des RIB pour les excursions et transferts des clients, des SUP et kayaks pour l'exploration autonome et des bateaux gonflables pour les sorties de snorkeling en groupe. La gestion de types d'équipements mixtes sur des volumes de clients saisonniers exige une qualité constante, une maintenance facile et une image de marque unifiée. Une panne ou un équipement usé affecte directement les avis des clients et les revenus."
      features:
        - 'Tenders RIB pour les excursions, transferts et sorties de snorkeling des clients'
        - 'Paddleboards SUP et kayaks pour les activités autonomes des clients'
        - 'Bateaux gonflables pour les excursions en groupe et le snorkeling plage-récif'
        - "Personnalisation complète de marque sur tout l'équipement — présentation unifiée du resort"
        - 'Pack de sécurité : gilets de sauvetage, sifflets, premiers secours, lignes de flottaison'
        - 'Supports de formation du personnel pour la manipulation des équipements et la sécurité des clients'
