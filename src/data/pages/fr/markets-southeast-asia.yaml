hero:
  tagline: Asie du Sud-Est
  title: Conseils en gros SUP pour<br />Entreprises d’Asie du Sud-Est
  subtitle: Des stations balnéaires insulaires, des clubs de plage et des boutiques de pagaie des Philippines à Bali et Phuket — des planches neuves en surstock à partir de 5 unités, modèles mixtes, expédiées de Chine.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Des planches de surstock pour les stations balnéaires et les boutiques de pagaie d’Asie du Sud-Est
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves SUP en surstock à des entreprises de toute l’Asie du Sud-Est — stations balnéaires insulaires, clubs de plage, opérateurs de location et petits détaillants aux Philippines, en Indonésie, en Thaïlande, au Vietnam, en Malaisie et ailleurs. La vente en gros commence avec 5 planches avec des modèles mixtes en une seule commande, expédiées de Weihai, Chine, par avion express ou fret maritime consolidé. Chaque planche est testée à 100 % sous pression et couverte par la garantie de 2 ans SUP .
tldr_points:
  - Modèle mixte en gros à partir de 5 plateaux — conçu pour les stations balnéaires et les petits magasins, pas pour des conteneurs
  - Courtes liaisons de fret de la Chine vers les ports et aéroports d’Asie du Sud-Est
  - UV Planches durables et hautes, adaptées à un usage tropical toute l’année
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché d’Asie du Sud-Est SUP
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: le bureau d’activités du complexe, l’opérateur du beach club et l’école de pagaie de l’île.
    - La scène commerciale de la région est dominée par des entreprises exploitées par leurs propriétaires qui servent à la fois les touristes et une communauté locale de pagaieurs en pleine croissance. Ils commandent en petites quantités — 5 à 20 planches — et ont besoin de planches qui résistent UV aux cycles de location tropicales, d’eau salée et quotidiennes, et non de prototypes de salons professionnels.
  customer_types:
    - title: Complexes insulaires et clubs de plage
      description: Les programmes d’activités de la station SUP s’ajoutent à leur gamme, commandant des flottes mixtes qui accueillent les débutants et les clients réguliers.
    - title: Location et tours opérateurs
      description: Des opérateurs assurent des locations horaires et des visites de mangroves ou de lagon, remplaçant les panneaux de flotte usés selon la saison.
    - title: Magasins locaux de pagaie
      description: De petites boutiques desservant la communauté locale en pleine expansion de la SUP région, allant des pagayeurs du week-end aux SUP cours de yoga.
shipping_section:
  title: Navire vers l’Asie du Sud-Est
  paragraphs:
    - L’Asie du Sud-Est est l’une de nos régions de fret les plus proches de Weihai, en Chine — les courtes routes maritimes et les voies aériennes express directes assurent à la fois le temps de transit et les coûts de fret. Les combinaisons de fret express offrent des échantillons et 1 à 3 commandes urgentes à bord ; le fret maritime consolidé est le choix économique pour 5 à 20 commandes de gros à bord vers les principaux ports régionaux.
    - Nous fournissons la facture commerciale et la liste d’emballage dont votre courtier a besoin, avec les codes HS corrects et les valeurs déclarées. Les droits d’importation et taxes respectent les règles de votre pays et sont payables par l’importateur.
  customs_note: Les procédures douanières varient selon les membres de l’AS EAN. Consultez les règles d’importation de votre pays pour les équipements de sport gonflables, et demandez dans votre demande si vous avez besoin de documents spécifiques — nous les préparons.
faq_section:
  title: FAQ sur l’Asie du Sud-Est
  items:
    - q: Dans quels pays d’Asie du Sud-Est envoyez-vous ?
      a: Les Philippines, l’Indonésie, la Thaïlande, le Vietnam, la Malaisie et au-delà — ainsi que des guides nationaux dédiés aux Philippines, à l’Indonésie et à la Thaïlande. Confirmez votre destination exacte dans votre demande de devis.
    - q: Les planches sont-elles adaptées à une utilisation tropicale toute l’année ?
      a: Oui. Les planches sont construites avec drop-stitch PVC une construction conçue pour une utilisation quotidienne dans UV des conditions chaudes et élevées — les mêmes planches que nous fournissons aux flottes de location dans 50+ pays. L’entretien standard (rinçage après eau salée, stockage à l’ombre) les maintient en service pendant des années.
    - q: À quoi ressemble une petite commande de station hôtelière ?
      a: "Typiquement 5 à 15 planches : une base de modèles polyvalents adaptés aux débutants pour les invités, plus quelques éditions d'art premium pour exposition, photos et vente au détail. Modèles mixtes dans un même envoi, prix selon la quantité totale."
    - q: À quelle vitesse les planches peuvent-elles atteindre la région ?
      a: L'Asie du Sud-Est est l'une des pistes de fret les plus courtes depuis notre base de Weihai. L'envoi express par avion est l'option la plus rapide pour les échantillons et les petites commandes ; le fret maritime est chiffré par destination pour les quantités de gros. Les deux sont détaillés dans votre devis.
