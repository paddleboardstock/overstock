content_challenge:
  tagline: Le défi
  title: Demandes de recherche marine<br />Plateformes stables et prêtes pour les instruments
  subtitle: Les bateaux de travail scientifiques doivent fournir une plate-forme stable pour les instruments sensibles, un fonctionnement silencieux pour éviter de déranger la faune et des aménagements flexibles pour divers équipements de recherche.
  paragraphs:
    - La recherche marine et la surveillance environnementale exigent des bateaux de travail qui servent de laboratoires mobiles. Contrairement aux navires commerciaux ou de plaisance, les RIB de recherche doivent accueillir une instrumentation électronique sensible, des équipements d'échantillonnage de l'eau et des sédiments et parfois le transport de spécimens vivants — tout en maintenant une plate-forme stable pour une collecte de données précise.
    - '**La stabilité de la plate-forme est essentielle** — Le sonar, les sondeurs et les profileurs CTD (conductivité, température, profondeur) exigent une coque stable à l''arrêt et à basse vitesse. Un sillage excessif ou des mouvements de coque introduisent du bruit dans les données scientifiques. Une coque en V profond dotée de bonnes caractéristiques de stabilité est indispensable.'
    - '**Intégration des instruments** — Les navires de recherche nécessitent des points de fixation pour antennes GPS, transducteurs sonar, bras d''échantillonnage et équipements d''enregistrement de données. L''espace de la console doit accueillir plusieurs écrans, la distribution électrique des instruments et un rangement sécurisé pour l''électronique sensible.'
    - '**Fonctionnement silencieux** — Pour les études de biologie marine et la surveillance environnementale, le bruit du moteur et les vibrations de la coque peuvent effrayer la vie marine et compromettre les observations comportementales. Les configurations hors-bord silencieuses et les conceptions de coque à vibrations réduites sont importantes pour les applications de recherche.'
    - Les RIB de recherche Paddle Board Overstock sont conçus avec des plates-formes de coque stables, des systèmes de fixation d'équipements intégrés et des configurations hors-bord silencieuses pour les applications scientifiques et de surveillance environnementale.
content_solution:
  tagline: Notre solution
  title: RIB de recherche spécialement conçus<br />Pour les travaux scientifiques et environnementaux
  subtitle: Chaque RIB de recherche Paddle Board Overstock est configuré comme une plate-forme stable et personnalisable pour l'instrumentation scientifique et l'équipement d'échantillonnage sur le terrain.
  list:
    - Coque en fibre de verre à V profond offrant une excellente stabilité à l'arrêt et aux vitesses d'enquête lentes
    - Pont plat avec platines de fixation d'équipements pour sonar, GPS et matériel d'échantillonnage
    - Console configurée pour plusieurs écrans — traceur, sondeur, enregistreur de données
    - Distribution d'alimentation d'accessoires 12 V et 24 V pour les instruments scientifiques
    - Hors-bord 4 temps silencieux — vibrations et bruit minimaux pour les études de la faune
    - Conception de coque à faible sillage en option pour une perturbation minimale pendant la collecte de données
    - Couleurs de tubes personnalisées pour l'image de marque des instituts de recherche et l'identification des flottes
content_segments:
  tagline: Profils de recherche
  title: Solutions pour les sciences marines<br />Par type d'application
  subtitle: Différentes applications de recherche ont des exigences uniques en matière de navires – des plates-formes d'enseignement universitaire aux navires d'étude environnementale en passant par les RIB de surveillance de la qualité de l'eau.
  items:
    - title: Programmes universitaires de sciences marines
      subtitle: Plateformes pédagogiques, sorties étudiantes, recherche côtière
      description: Les universités de sciences marines et les départements d'océanographie ont besoin de bateaux de travail fiables et polyvalents pour enseigner des cours sur le terrain, des projets de recherche d'étudiants et des études côtières dirigées par des professeurs. Le bateau doit être facile à utiliser pour les étudiants sous supervision, suffisamment stable pour le déploiement pratique d'instruments et suffisamment durable pour une utilisation fréquente par plusieurs utilisateurs au cours des trimestres universitaires. Les contraintes budgétaires dans les milieux universitaires font que la rentabilité et la faible maintenance sont des considérations importantes.
      features:
        - Plate-forme stable pour l'exercice de déploiement et de récupération des instruments par les étudiants
        - Utilisation facile — configuration à barre franche ou console simple pour un usage étudiant supervisé
        - Tubes Hypalon durables pour les échouages fréquents et la manipulation par les étudiants
        - Fixation d'équipements pour sonar pédagogique, disque de Secchi et matériel d'échantillonnage
        - Option PVC économique pour les programmes universitaires à budget restreint
    - title: Instituts de recherche marine
      subtitle: RIB d'enquête avec intégration d'instruments, GPS et équipement d'échantillonnage
      description: Les organisations de recherche marine dédiées menant des enquêtes côtières et offshore ont besoin de RIB d'enquête configurés par des professionnels avec une instrumentation intégrée. Ces navires transportent des systèmes sonar pour la cartographie bathymétrique, des profileurs CTD pour l'analyse de la colonne d'eau, des échantillonneurs de sédiments et des équipements de collecte biologique. Le bateau doit fournir une plate-forme stable à des vitesses d'enquête lentes, disposer d'un espace suffisant sur le pont pour le déploiement de l'équipement et offrir une alimentation propre de 12 V/24 V pour l'électronique.
      features:
        - Fixation intégrée de transducteur sonar — configuration traversante ou sur tableau arrière
        - Fixation d'antenne GPS et intégration à la console pour une navigation de niveau enquête
        - Zone de déploiement CTD et échantillonneur d'eau avec points d'arrimage sécurisés
        - Distribution d'alimentation auxiliaire 12 V/24 V pour instruments et enregistreurs de données
        - Stable à basse vitesse (3 à 6 nœuds) pour la précision des lignes d'enquête
        - Portique en A ou bossoir en option pour déployer des équipements d'échantillonnage plus lourds
    - title: Surveillance et conservation de l'environnement
      subtitle: Enquêtes écologiques, observation de la faune, évaluation de l'habitat
      description: Les ONG environnementales, les agences gouvernementales et les organisations de conservation mènent des études écologiques marines, une surveillance des populations d'animaux sauvages et des évaluations de l'habitat. Ces opérations nécessitent des navires silencieux et à faible impact, capables de s'approcher des habitats sensibles sans déranger la faune. Les bateaux doivent transporter du matériel photographique, un GPS pour la cartographie des transects et du matériel d'échantillonnage pour la collecte de l'eau et des sédiments. Un faible sillage et un bruit de moteur minimal sont essentiels pour les études d'observation comportementale.
      features:
        - Hors-bord 4 temps silencieux — perturbation minimale de la faune marine
        - Plate-forme d'observation stable pour la documentation photo et vidéo
        - Fixation d'équipements pour supports caméra, traceurs GPS et ordinateurs de terrain
        - Faible tirant d'eau pour accéder aux zones humides côtières, aux mangroves et aux estuaires
        - Surfaces de pont et de tubes faciles à nettoyer pour la décontamination entre les sites
    - title: Surveillance et tests de la qualité de l'eau
      subtitle: Échantillonnages réguliers, suivi des polluants, contrôle de la conformité
      description: Les organismes de surveillance de la qualité de l'eau effectuent régulièrement des échantillonnages dans les zones côtières, les ports et les voies navigables intérieures pour suivre les niveaux de pollution, la prolifération d'algues et le respect des réglementations environnementales. Ces opérations nécessitent des bateaux efficaces et fiables pour des visites répétées aux stations d'échantillonnage fixes. Le navire doit transporter du matériel d'échantillonnage, des glacières pour la conservation des échantillons et du matériel d'essai sur le terrain, avec un lavage facile du pont entre les sites d'échantillonnage pour éviter toute contamination croisée.
      features:
        - Zone dédiée de station d'échantillonnage avec glacière et rangement d'équipements
        - Pont et surfaces de tubes faciles à nettoyer pour une décontamination entre les sites
        - Intégration GPS pour un retour précis aux coordonnées d'échantillonnage fixes
        - Taille compacte pour l'accès aux voies navigables restreintes et aux chenaux étroits
        - Hors-bord économe en carburant pour des campagnes d'échantillonnage régulières économiques
