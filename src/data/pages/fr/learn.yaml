hero:
  tagline: Connaissance de l'exploration de l'eau
  title: Apprendre
  subtitle: |
    Guides, tutoriels et approfondissements — tout ce dont vous avez besoin pour explorer<br />
    nager avec confiance. Du choix de votre premier SUP à la maîtrise des techniques avancées.
  taglineSection: Des connaissances pour chaque pagayeur. Du débutant au professionnel.
featured:
  tagline: Sujets en vedette
  title: Commencez votre parcours d'apprentissage
  subtitle: Que vous soyez nouveau dans les sports nautiques ou que vous cherchiez à progresser, nos guides sont là pour vous.
  items:
    - title: SUP Bases
      description: Tout ce qu'un débutant doit savoir — types de planches, taille de la pagaie, position et conseils pour le premier jour.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Planches gonflables vs planches dures
      description: Lequel est fait pour vous ? Nous comparons la portabilité, les performances, la durabilité et le coût côte à côte.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Sécurité de l'eau
      description: Connaissances de sécurité essentielles que tout pagayeur devrait avoir — météo, gilets de sauvetage, auto-secours, et plus encore.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Guide des matériaux
      description: Drop-stitch noyaux, PVC stratifiés, EVA mousse de pont — comprenez de quoi votre planche est faite.
      icon: tabler:hexagons
      href: /learn/materials
    - title: Guide des tailles SUP
      description: Trouvez la bonne longueur, largeur et volume de planche pour votre poids, votre niveau et votre style de pagaie.
      icon: tabler:ruler
      href: /size-guide
    - title: Techniques intermédiaires
      description: Améliorez votre pagaie avec des coups avancés, des techniques de virage et la gestion des eaux agitées.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
