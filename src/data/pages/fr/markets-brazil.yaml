hero:
  tagline: Brésil
  title: Conseils en gros SUP pour<br />Détaillants brésiliens
  subtitle: Pour les boutiques et opérateurs de Rio et Florianópolis jusqu’à la côte nord-est — des paddleboards neuves en surstock de 5 unités, modèles mixtes, expédiées de Chine.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Tableaux de surstock SUP pour les détaillants de plage brésiliens et les écoles de pagaie
direct_answer: Paddle Board Overstock fournit des planches gonflables neuves en surstock SUP aux entreprises brésiliennes — écoles de pagaie et boutiques à Rio de Janeiro, Florianópolis et sur la côte nord-est, opérateurs de location et vendeurs en ligne. Les commandes en gros commencent à 5 planches avec des modèles mixtes en une seule cargaison, envoyées de Weihai, Chine, par fret aérien express ou fret maritime consolidé. Chaque planche est testée à 100 % sous pression et couverte par la garantie de 2 ans SUP .
tldr_points:
  - Vente en gros à partir de 5 cartes — modèles mixtes, tarifés par quantité totale
  - Au service de la culture balnéaire brésilienne de Rio au Nord-Est
  - Fret aérien express ou maritim consolidé depuis Weihai, Chine
  - 100 % testé sous pression, garantie de 2 SUP ans sur chaque carte
overview_section:
  tagline: Aperçu du marché
  title: Le marché brésilien SUP
  paragraphs:
    - Le Brésil est l’un des marchés de stand-up paddle les plus naturels au monde. La culture de la plage est une culture nationale — de la scène du stand up paddle sur les lagunes de Rio et le mélange de surf et d’eau plate de Florianópolis aux eaux chaudes et calmes du Nord-Est au Ceará, au Pernambuco et à Bahia. Les écoles de pagaie, les locations de lagunes, ainsi que les communautés de surf et sous le vent SUP s’élèvent toutes d’une population immense passionnée de sport.
    - Les acheteurs brésiliens sont généralement des entreprises exploitées par leurs propriétaires — stands de location au bord de la lagune, écoles de plage, boutiques de surf qui ajoutent SUP des files d’attente, et des vendeurs en ligne nationaux en croissance. Ils commandent en petites quantités (5 à 20 planches), et ils se soucient de leur durabilité pour un usage quotidien et de la compétitivité des prix sur un marché aux coûts d’importation significatifs.
  customer_types:
    - title: Écoles Lagoon & Beach
      description: Des écoles et des opérateurs locatifs sur les lagunes de Rio et les plages calmes du Nord-Est proposent des cours et des locations horaires.
    - title: Boutiques de surf
      description: Des détaillants de surf établis ajoutent des eaux calmes et des randonnées SUP pour la communauté locale de pagayeurs.
    - title: Vendeurs en ligne
      description: Des vendeurs de commerce électronique nationaux importent SUP des stocks pour servir l’immense marché intérieur brésilien.
shipping_section:
  title: Navire pour le Brésil
  paragraphs:
    - Les commandes sont expédiées depuis Weihai, en Chine. Le fret aérien express transporte des échantillons et 1 à 3 commandes de bord vers les principaux aéroports du Brésil ; le fret maritime consolidé dessert 5 à 20 commandes de gros à bord via des ports comme Santos et d’autres portes côtières. Les estimations de transit pour votre destination sont incluses dans votre devis.
    - Nous fournissons la facture commerciale et la liste de conditionnement requises pour la décharge, avec les codes HS corrects et les valeurs déclarées. Les droits d’importation et taxes sont exigibles par l’importateur selon les règles brésiliennes.
  customs_note: Les taxes d’importation du Brésil sur les articles de sport sont importantes et varient selon la classification des produits. Confirmez les droits de douane actuels, la TVA et les éventuels frais au niveau de l’État auprès de votre courtier douanier (despachante) avant de commander — nous fournissons la documentation complète mais ne regroupons pas les taxes d’importation dans les devis de fret.
faq_section:
  title: FAQ sur le Brésil
  items:
    - q: Les devis et le support peuvent-ils être gérés en portugais ?
      a: Oui — nous travaillons avec des acheteurs parlant portugais. Posez votre demande et nous nous occuperons de votre devis et de votre commande en portugais.
    - q: Les taxes à l’importation du Brésil sont-elles incluses dans vos prix ?
      a: Non. Les droits d’importation, la TVA et les taxes au niveau de l’État sont la responsabilité de l’importateur selon les règles brésiliennes. Nous estimons clairement et séparément les tarifs et le fret, et fournissons les documents dont votre despachante a besoin.
    - q: À quoi ressemble une première commande pour une école de plage brésilienne ?
      a: 'Typiquement 5 à 15 planches : modèles durables polyvalents pour les cours et la location à l’heure, plus quelques éditions premium pour l’exposition en magasin. Modèles mélangés dans un même envoi, tarification basée sur la quantité totale.'
    - q: Expédiez-vous par voie maritime vers le Brésil ?
      a: Oui — le fret maritime groupé dessert les ports brésiliens pour des commandes en gros de 5 à 20 planches, avec devis selon la destination. L’expédition express par avion est disponible pour les échantillons et les petites commandes urgentes.
