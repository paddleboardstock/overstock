certifications:
  - title: Certification CE (UE 2016/425)
    standard: Règlement EPI (UE) 2016/425 | EN ISO 12402
    description: Tous les équipements de sécurité Paddle Board Overstock respectent les exigences de marquage CE au titre du règlement européen sur les équipements de protection individuelle. Chaque produit est testé de manière indépendante par TÜV Rheinland, organisme notifié européen. Nos bateaux pneumatiques et nos RIB satisfont aux exigences des catégories C et D de la directive sur les embarcations de plaisance 2013/53/UE (RCD).
    body: La certification CE couvre les exigences essentielles de santé et de sécurité pour les dispositifs de flottabilité individuels et les embarcations pneumatiques. TÜV Rheinland audite chaque année notre site de production pour vérifier la conformité continue.
  - title: SOLAS — Sauvegarde de la vie humaine en mer
    standard: SOLAS Chapitre III | Code LSA
    description: Le gilet de sauvetage Pro est conforme aux règlements SOLAS pour les opérations maritimes offshore et commerciales. Testé pour une rétention de flottabilité de 24 heures, un gonflage automatique à l’immersion et des performances jusqu’à force 5. Respecte les exigences du Chapitre III pour les gilets de sauvetage des navires commerciaux.
    body: L’approbation SOLAS exige des tests indépendants par un organisme notifié portant sur la flottabilité, la résistance, la visibilité et le déclenchement automatique. Notre gilet de sauvetage Pro dispose de l’homologation de type SOLAS complète avec certification MED.
  - title: USCG Type III / Type V
    standard: 46 CFR Partie 160 | Approbation USCG
    description: Certains gilets de sauvetage Paddle Board Overstock répondent à la classification de la United States Coast Guard pour les équipements de Type III (aide à la flottabilité) et de Type V (usage spécial). Adaptés aux eaux abritées, à la croisière côtière et aux opérations commerciales exigeant des gilet homologués USCG.
    body: L’approbation USCG exige des tests par un laboratoire indépendant reconnu par la Garde côtière. L’approbation de Type V couvre les modèles gonflables hybrides à activation manuelle ou automatique.
  - title: Conformité sociale BSCI
    standard: Code de conduite amfori BSCI
    description: Notre usine est auditée chaque année dans le cadre de l’initiative amfori Business Social Compliance Initiative (BSCI). Cela atteste de pratiques de travail éthiques, de la sécurité sur le lieu de travail, d’horaires de travail équitables et d’une gestion environnementale sur notre site de production de 12 000 m².
    body: La conformité BSCI est un prérequis pour les détaillants et importateurs européens. Notre notation BSCI actuelle est « C » (Bien), auditée par SGS.
  - title: Conformité REACH & RoHS
    standard: Règlement REACH (CE) 1907/2006 | Directive RoHS 2011/65/UE
    description: Tous les composés PVC, adhésifs et revêtements utilisés dans les produits Paddle Board Overstock respectent le règlement européen REACH sur la sécurité chimique et les restrictions RoHS sur les substances dangereuses. Les fiches de données de sécurité (MSDS) sont disponibles pour chaque gamme de produits.
    body: La conformité REACH garantit l’absence de substances SVHC restreintes au-delà des seuils limites. Des tests réguliers en laboratoire indépendant vérifient la conformité continue de chaque lot de production.
  - title: Management de la qualité ISO 9001:2015
    standard: ISO 9001:2015 | Certifié par TÜV Rheinland
    description: Notre système de management de la qualité est certifié ISO 9001:2015 par TÜV Rheinland et couvre la conception, la production, les tests et le service après-vente. Des audits de surveillance annuels garantissent l’amélioration continue et la maîtrise des processus.
    body: La certification ISO 9001 exige des politiques qualité documentées, des audits internes, des revues de direction, des procédures d’actions correctives et des enregistrements de production traçables.

testimonial:
  quote: Nous avons acheté des équipements de sécurité auprès de plusieurs fournisseurs en Asie. Paddle Board Overstock est le seul fabricant à avoir fourni d’emblée la documentation CE complète, les certificats SOLAS et les rapports d’essais tiers — sans que nous ayons à les demander.
  author: Erik Lindström
  title: Responsable sécurité
  company: Baltic Marine Supply
  location: Finlande

content_overpressure:
  tagline: Sécurité surpression
  title: 'Gestion de la pression des tubes RIB<br />en climat chaud'
  subtitle: 'La pression des tubes gonflables augmente avec la température. Comprendre et maîtriser la surpression prévient les dommages et garantit une utilisation sûre en environnements tropicaux et désertiques.'
  items:
    - title: 'Valves de surpression Boyle'
      description: 'Les tubes RIB Paddle Board Overstock sont équipés de valves de surpression qui évacuent automatiquement l’excès de pression au-delà du maximum autorisé. Cela prévient la contrainte des coutures et l’éclatement potentiel des tubes dus au chauffage solaire.'
      icon: tabler:gauge
    - title: 'Variation de pression du matin à midi'
      description: 'Un tube gonflé à 3,5 PSI à 20 °C peut atteindre plus de 4,5 PSI sous un soleil à 40 °C. Gonflez toujours au bas de la plage recommandée en climat chaud et laissez la valve de surpression gérer l’excédent de pression.'
      icon: tabler:sun
    - title: 'Pressions de fonctionnement recommandées'
      description: 'Tubes PVC : 3,0–3,5 PSI en fonctionnement, 4,5 PSI maximum. Tubes Hypalon : 3,5–4,0 PSI en fonctionnement, 5,0 PSI maximum. Testez toujours à 1,25 fois la pression nominale (4,4 PSI pour le PVC, 5,0 PSI pour l’Hypalon) selon les standards QC Paddle Board Overstock.'
      icon: tabler:chart-bar
    - title: 'Bonnes pratiques en cas d’exposition solaire'
      description: 'Rangez les RIB à l’ombre lorsqu’ils ne sont pas utilisés. Utilisez des bâches anti-UV pour le mouillage prolongé. Vérifiez et ajustez la pression des tubes avant et après les heures de fort ensoleillement. Ne dépassez jamais la pression nominale maximale.'
      icon: tabler:umbrella
    - title: 'Dépressurisation d’urgence'
      description: 'Si le tube semble trop dur ou que la valve de surpression s’évente, relâchez l’air via la valve Halkey-Roberts ou la valve militaire jusqu’au retour dans la plage de fonctionnement. Emportez toujours un manomètre pour des lectures précises.'
      icon: tabler:alert-circle

