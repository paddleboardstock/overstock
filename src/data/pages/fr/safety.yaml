testimonial:
  quote: J'ai vérifié le journal de test de pression fourni avec ma planche et j'ai envoyé deux questions par e-mail au service client concernant le gonflage en pleine chaleur estivale. Ils ont répondu avec des chiffres précis le jour même. C'est plus que ce qu'aucune boutique n'a jamais fait pour moi.
  author: Sofia Marchetti
  title: Acheteur vérifié
  company: Pagayeuse côtière
  location: Italie
content_overpressure:
  tagline: Sécurité de la pression
  title: Pression de la planche<br />Gestion de la pression dans les climats chauds
  subtitle: La pression d'une planche gonflable augmente avec la température. Comprendre et gérer la surpression protège votre planche et maintient chaque session en sécurité.
  items:
    - title: Pourquoi la pression augmente
      description: L'air se dilate avec la chaleur. Une planche gonflée à 15 PSI à 20°C peut atteindre 1-2 PSI au soleil à 40°C — la même physique qui rend une planche fraichement gonflée trempée et dure à midi.
      icon: tabler:gauge
    - title: Pression de fonctionnement recommandée
      description: Gonflez à 12-15 PSI, comme indiqué près de la valve. La plage recommandée équilibre rigidité, sécurité et durée de vie des coutures — plus n'est pas mieux.
      icon: tabler:chart-bar
    - title: Meilleures pratiques pour les climats chauds
      description: Gonflez à la limite inférieure de la plage pendant les journées chaudes. Relâchez un peu d'air avant une exposition prolongée au soleil et ne laissez jamais une planche entièrement gonflée cuire sur la plage.
      icon: tabler:sun
    - title: Exposition au soleil et stockage
      description: Rangez les planches à l'ombre et partiellement dégonflées lorsqu'elles ne sont pas utilisées. Utilisez un sac de planche pour la protection UV. Rincez et séchez avant de rouler pour le stockage.
      icon: tabler:umbrella
    - title: Si la planche semble très dure
      description: Libérez de l'air par la valve jusqu'à ce que la planche revienne dans la plage recommandée. Transportez le manomètre sur votre pompe pour des lectures précises — une planche surgonflée met inutilement les coutures sous pression.
      icon: tabler:alert-circle
