testing_process_tagline: Notre processus de test
testing_process_title: Comment nous testons la sécurité
testing_stat_1_desc: Test de gonflage à pression de service — chaque chambre est gonflée à 1,25 fois la pression nominale pendant 24 à 48 heures de maintien de la pression
testing_stat_2_desc: Test d’immersion dans l’eau — chaque produit est immergé pendant 24 heures pour vérifier l’intégrité des coutures et la performance de flottabilité
testing_stat_3_desc: Chaque planche subit une vérification obligatoire du pelage des coutures, de la rétention d’air et une vérification complète des systèmes avant expédition
