hero:
  tagline: Sécurité
  title: Normes de sécurité & certification
  subtitle: Chaque produit Paddle Board Overstock subit des tests rigoureux, et 64 modèles certifiés CE respectent les normes de sécurité internationales pour un usage récréatif et professionnel. Usine certifiée ISO 9001.

