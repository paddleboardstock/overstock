content_challenge:
  tagline: Le défi
  title: Pourquoi les centres de plongée<br />ont besoin de bateaux spécialisés
  subtitle: Les opérations de plongée imposent des exigences uniques aux embarcations — des exigences que les bateaux polyvalents ne satisfont souvent pas.
  paragraphs:
    - Les bateaux de plongée doivent être stables au repos pour un embarquement et un débarquement sûrs, surtout lorsque les plongeurs sont équipés d'un matériel lourd. Une plateforme étroite ou instable crée des risques de sécurité et limite la capacité opérationnelle.
    - Le rangement du matériel est un autre facteur critique. Les bouteilles, poids, équipements de plongée et matériel de sécurité nécessitent un espace de rangement dédié qui maintient le pont dégagé et accessible.
    - La fiabilité du moteur est non négociable. Quand des plongeurs sont dans l'eau, le bateau doit être prêt à se déplacer à tout moment. Les configurations bimoteurs sont souvent préférées pour la redondance.
    - Aquafarer répond à ces exigences avec des configurations RIB spécialement conçues — coques en V profond stables, larges tubes pour l'embarquement, rangement intégré des bouteilles et options moteur optimisées pour les opérations de plongée.
    - "**Stabilité au repos** — Les plongeurs ont besoin d'une plate-forme stable pour se préparer, entrer dans l'eau et remonter à bord. Une stabilité insuffisante crée des risques pour la sécurité et a un impact négatif sur l’expérience client."
    - "**Coûts d'exploitation élevés** — L'efficacité énergétique est importante lorsque vous effectuez plusieurs trajets chaque jour. Un bateau qui consomme plus de carburant réduit directement les marges bénéficiaires. Les opérateurs de plongée commerciale se soucient davantage des coûts d’exploitation quotidiens que de la vitesse de pointe."
content_solution:
  tagline: Notre solution
  title: Configuré pour la plongée
  subtitle: Chaque RIB de plongée Aquafarer est construit autour des besoins spécifiques des opérations de plongée commerciales et récréatives.
  list:
    - Larges tubes Hypalon ou PVC pour une plateforme d'embarquement stable — les plongeurs embarquent et débarquent en toute confiance
    - Râteliers à bouteilles intégrés — maintiennent le poids bas et le pont dégagé
    - Console positionnée pour une visibilité claire des plongeurs dans l'eau
    - Échelle de plongée optionnelle pour remonter facilement
    - Options moteur de 40 CV à 115 CV — configuration simple ou bimoteur
    - Plaques de montage pour sonar, GPS et équipements de communication
    - Capacité de carburant adaptée aux besoins d'autonomie opérationnelle
    - Construction de qualité marine — matériaux de tube robustes résistants aux UV et à l'eau salée, structure renforcée pour un usage commercial quotidien
    - Configurations d'échelle et de plate-forme de plongée personnalisées - adaptées à votre profondeur d'eau opérationnelle et à votre profil de plongeur
    - Plaques de montage d'équipement pour sonar, GPS et matériel de communication
