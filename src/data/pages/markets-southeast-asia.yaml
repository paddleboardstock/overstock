overview_section:
  tagline: Market Overview
  title: The Southeast Asian SUP Market
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: the resort activity desk, the beach-club operator, and the island paddle school.
    - The region's retail scene is dominated by owner-operated businesses that serve both tourists and a fast-growing local paddling community. They order in small batches — 5 to 20 boards — and they need boards that survive tropical UV, salt water, and daily rental cycles, not trade-show prototypes.
  customer_types:
    - title: Island Resorts & Beach Clubs
      description: Resort activity programs adding SUP to their lineup, ordering mixed fleets that serve first-timers and repeat guests.
    - title: Rental & Tour Operators
      description: Operators running hourly rentals and mangrove or lagoon tours, replacing worn fleet boards seasonally.
    - title: Local Paddle Shops
      description: Small shops serving the region's growing local SUP community, from weekend paddlers to SUP yoga classes.
shipping_section:
  title: Ship to Southeast Asia
  paragraphs:
    - Southeast Asia is one of our closest freight regions from Weihai, China — short sea routes and direct express air lanes keep both transit time and freight cost friendly. Express air freight suits samples and 1–3 board urgent orders; consolidated sea freight is the economical choice for 5–20 board wholesale orders to major regional ports.
    - We provide the commercial invoice and packing list your broker needs, with correct HS codes and declared values. Import duties and taxes follow your country's rules and are payable by the importer.
  customs_note: Customs procedures vary between ASEAN members. Check your country's import rules for inflatable sports equipment, and ask in your inquiry if you need specific documentation — we prepare it.
faq_section:
  title: Southeast Asia FAQ
  items:
    - q: Which Southeast Asian countries do you ship to?
      a: The Philippines, Indonesia, Thailand, Vietnam, Malaysia, and beyond — plus dedicated country guides for the Philippines, Indonesia, and Thailand. Confirm your exact destination in your quote request.
    - q: Are the boards suitable for tropical, year-round use?
      a: Yes. The boards are built with drop-stitch PVC construction rated for daily use in warm, high-UV conditions — the same boards we supply to rental fleets in 50+ countries. Standard care (rinse after salt water, shade storage) keeps them in service for years.
    - q: What does a small resort order look like?
      a: "Typically 5–15 boards: a base of beginner-friendly all-around models for guests, plus a few premium art editions for display, photos, and retail sale. Mixed models in one shipment, priced by total quantity."
    - q: How fast can boards reach the region?
      a: Southeast Asia is one of the shortest freight lanes from our Weihai base. Express air is the fastest option for samples and small orders; sea freight is quoted per destination for wholesale quantities. Both are itemized in your quote.
