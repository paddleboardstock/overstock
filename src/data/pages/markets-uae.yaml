overview_section:
  tagline: Market Overview
  title: The UAE SUP Market
  paragraphs:
    - The UAE has built a year-round waterfront lifestyle economy. Dubai's beach clubs run paddle sessions alongside brunches; Abu Dhabi's mangroves are one of the region's most popular calm-water paddling destinations; hotel beaches from JBR to Saadiyat offer guest SUP programs; and a large, active expat community paddles through the cooler months with real commitment. Events and fitness communities keep demand visible and social.
    - Buyers here are professional operators with high presentation standards: five-star hotel watersports teams, beach clubs whose boards appear in guests' photos, mangrove tour operators, and premium retailers. They order deliberately — 5–20 boards, mixing reliable all-around models for guest programs with premium art editions that look right on a luxury waterfront.
  customer_types:
    - title: Hotel & Beach Club Operators
      description: Dubai and Abu Dhabi hotel watersports programs and beach clubs running guest paddle sessions with premium presentation.
    - title: Mangrove & Tour Operators
      description: Abu Dhabi mangrove operators and coastal tour businesses adding SUP itineraries.
    - title: Retailers
      description: Shops and online sellers serving the UAE's expat and local paddling community.
shipping_section:
  title: Ship to the UAE
  paragraphs:
    - Orders ship from Weihai, China. Express air freight carries samples and 1–3 board orders fast into Dubai and Abu Dhabi; consolidated sea freight serves 5–20 board wholesale orders through Jebel Ali and other UAE ports. Both options are quoted with estimated transit times for your destination.
    - We provide the commercial invoice and packing list clearance requires, with correct HS codes and declared values. Import duties and taxes are payable by the importer under UAE rules.
  customs_note: UAE customs processes are efficient but documentation-sensitive. Confirm current duty and tax treatment for sports equipment with your clearing agent; we provide complete, consistent paperwork and respond quickly to broker requests.
faq_section:
  title: UAE FAQ
  items:
    - q: How fast is freight from China to the UAE?
      a: The UAE is one of our quickest freight destinations from Weihai — express air into Dubai or Abu Dhabi for samples and small orders, consolidated sea freight to Jebel Ali for wholesale quantities. Both are itemized in your quote with transit estimates.
    - q: Do the boards handle the UAE's summer heat?
      a: "Yes, with basic care: store boards deflated and shaded through peak summer heat, avoid leaving inflated boards on hot sand or deck surfaces, and rinse after sea use. These are the same guidelines we give beach-club operators across the region."
    - q: What does a beach club or hotel order look like?
      a: "Typically 5–20 boards: stable all-around models for guest programs, plus premium art editions — Leviathan Wake, Medusa Glow, Ocean Voyager — that look right on a luxury waterfront. Mixed models, one shipment."
    - q: Can you supply documentation for UAE clearance?
      a: Yes. Every order ships with a commercial invoice and packing list with correct HS codes and declared values, and we respond quickly when your broker requests extra documentation.
