hero:
  tagline: O nás
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Továrna a dílna Aquafareru
  title: |
    Námořní inženýrství,<br />
    postavené po <span class="text-accent dark:text-white">Aquafarer</span> způsobu
  subtitle: 'Začali jsme v pobřežní dílně s jednou lodí a tvrdohlavým přesvědčením: námořní produkty by měly být konstruovány tak, jako by na nich záleželo — protože záleží. Dnes dodáváme do více než 50 zemí, ale každý trup stále prochází rukama těch, kteří firmu založili.'

stats:
  title: Ve číslech
  columns: 4
  stats:
    - title: Dodaných trupů
      amount: '2,400+'
    - title: Obsluhovaných zemí
      amount: '50+'
    - title: Let kombinovaných zkušeností
      amount: '60'
    - title: Průměrná odezva na záruční požadavek (hodiny)
      amount: '24'

features3_what_we_build:
  title: Co vyrábíme
  subtitle: Zaměřená produktová řada, kterou známe do posledního detailu — žádné nedokončené experimenty, žádný badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB čluny
      description: Hliníkové RIB od 3,3 m do 7,5 m. Navržené pro hlídkování, potápění, rybolov a rodinné vyžití.
      icon: tabler:ship
    - title: Nafukovací čluny
      description: PVC a Hypalon nafukovací čluny od 2,4 m do 4,2 m. Lehké, odolné a snadno skladovatelné.
      icon: tabler:speedboat
    - title: Tendry pro superyachty
      description: Kompaktní vysoce výkonné RIB vyráběné na míru vzhledu vaší mateřské lodi.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Příslušenství
      description: Vesla, pumpy, kryty, suché vaky, palivové nádrže a elektronika. Vše sladěné s našimi loďmi.
      icon: tabler:package
    - title: Refit a opravy
      description: Výměna trubek, modernizace elektroniky a upgrade motorů ve vlastních prostorách.
      icon: tabler:tool
    - title: Zakázková výroba
      description: Design projekt po projektu pro komerční, vědecké a vojenské zákazníky.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Diskuse o designu a inženýrství lodí

steps2_values:
  title: Naše hodnoty
  subtitle: Tři principy, které formovaly každý výrobek od prvního dne.
  items:
    - title: Stavět, jako by na palubě byla vaše rodina
      description: S každým trupem, svarem a spojovacím materiálem zacházíme, jako by ho používala naše vlastní rodina.
      icon: tabler:heart
    - title: Nejprve konstruovat, pak prodávat
      description: Pokud je specifikace chybná, měníme specifikaci — nikdy zákazníka.
      icon: tabler:settings
    - title: Podpora, která přetrvá i po skončení záruky
      description: Dvacet let staré trupy se na nás stále obracejí po náhradní díly a my stále zvedáme telefon.
      icon: tabler:headset

steps2_milestones:
  title: Milníky
  subtitle: Krátká verze příběhu Aquafarer.
  isReversed: true
  items:
    - title: Založeno v pobřežní dílně
      description: Zakládají dva námořní architekti s CNC frézkou a tvrdohlavým nápadem.
      icon: tabler:building-factory
    - title: Prvních 1 000 trupů dodáno
      description: Dosáhnuto v sedmém roce působení, především díky ústnímu šíření a opakovaným zákazníkům.
      icon: tabler:circle-check
    - title: Mezinárodní exportní program
      description: Dnes dodáváme do více než 50 zemí s lokalizovanými podpornými partnery na pěti kontinentech.
      icon: tabler:world
    - title: Nová globální provozní struktura
      description: 'V září 2026 se provoz značky přesunul ze skupiny Qingdao Vatrad Group k Aquafarer LLC (Nové Mexiko, USA); výrobní centrum v Čching-tau pokračuje ve vývoji, výrobě a exportu přímo z továrny.'
      icon: tabler:building-skyscraper

features2_locations:
  title: Naše lokality
  tagline: Najděte nás
  columns: 3
  items:
    - title: Sídlo a dílna
      description: Pobřežní průmyslový park, budova 4 — otevřeno po–pá, návštěvy po domluvě.
    - title: Servisní centrum EU
      description: Středomořský přístav — modernizace, opravy a záruční podpora pro evropské zákazníky.
    - title: Síť partnerů v APAC
      description: Autorizovaní servisní partneři v Austrálii, Japonsku, Singapuru a Hongkongu.

brand_hub_tagline: Značka
brand_hub_title: Prozkoumejte naši značku
brand_hub_subtitle: Ponořte se hlouběji do naší odbornosti v námořním inženýrství, globální působnosti a principů, které nás ženou vpřed.

brand_hub_cards:
  - title: Námořní odbornost
    desc: Desetiletí materiálových věd, přesné výroby a testování v reálných podmínkách — od zpracování PVC/Hypalon po konstrukci trupů deep-V a technologii drop-stitch.
    link: /brand-marine-expertise
    link_label: Dozvědět se víc →
  - title: Globální působení
    desc: Dodávky do více než 50 zemí z našeho zařízení v Čching-tau s autorizovanými servisními partnery po celé Evropě, asijsko-pacifickém regionu a Amerikách.
    link: /brand-global-presence
    link_label: Dozvědět se víc →
  - title: Proč Aquafarer
    desc: Vertikální integrace, dvojí certifikace (ISO 9001 + BSCI), soulad s CE a nízké minimální objednávky — vytvořeno pro značky, distributory a vládní organizace.
    link: /brand-why-aquafarer
    link_label: Dozvědět se víc →

production_section:
  tagline: 'Excelence ve výrobě'
  title: 'Zaručená dokonalá řemeslná práce'
  description: 'Výrobní linka Aquafarer je zasvěcena výrobě vysoce kvalitních, odolných a výkonných nafukovacích člunů.'
  cards:
    - title: 'Zkušený tým techniků'
      items:
        - 'Odborné znalosti PVC, Hypalonu a námořních materiálů'
        - 'Přesná řemeslná práce při střihu, lepení a instalaci příslušenství'
        - 'Průběžné školení ke zvládnutí nejnovějších výrobních technologií'
    - title: 'Pokročilé výrobní vybavení'
      items:
        - 'CNC střihací zařízení pro přesný střih textilií s minimální odchylkou'
        - 'Vysoce přesné lepení za tepla i za studena pro vzduchotěsné a odolné švy'
        - 'Profesionální zařízení pro zkoušky vzduchotěsnosti a pevnosti v tahu'
    - title: 'Zralý systém řízení'
      items:
        - 'Standardizované výrobní procesy s jasnými standardy kvality'
        - 'Filozofie štíhlé výroby snižující plýtvání a zvyšující efektivitu'
        - 'Efektivní řízení dodavatelského řetězce se spolehlivými partnerskými dodavateli'
    - title: 'Přísná kontrola kvality'
      items:
        - 'certifikovaný systém managementu kvality'
        - 'Vícestupňová kontrola: suroviny, ve výrobě, finální před expedicí'
        - 'Přísné testy vzduchotěsnosti a odolnosti před odesláním'

global_ops_section:
  tagline: 'Globální provozní architektura'
  title_html: 'Jedna značka, <span class="text-white/90">dvě centra</span>'
  description_html: 'Od září 2026 značku Aquafarer provozuje <strong class="text-white">Aquafarer LLC</strong> (Nové Mexiko, USA) — globální subjekt pro distribuci, komerční B2B prodej, smlouvy, fakturaci a poprodejní servis. Vývoj, výroba a kontrola kvality zůstávají ve <strong class="text-white">výrobním centru Aquafarer v Čching-tau</strong>, které každou objednávku expeduje přímo z továrny, FOB Čching-tau. Změna se dotkla toho, kdo podepisuje vaši smlouvu — ne toho, kdo staví vaši loď.'
  stats:
    - value: '2,400+'
      label: 'Trupů dodáno celosvětově'
    - value: '50+'
      label: Exportních zemí
    - value: '10+'
      label: 'Let výroby'
