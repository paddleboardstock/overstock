hero:
  tagline: Globální přítomnost
  title: Poskytujeme služby ve více než 50 zemích<br />na každém kontinentu
  subtitle: Od evropských pobřežních hlídkových operátorů přes australské distributory vodních sportů až po záchranné týmy na Blízkém východě – Paddle Board Overstock lodí je na vodě po celém světě.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Globální výroba a distribuce Paddle Board Overstocku
stats:
  title: Globální dosah
  stats:
    - title: země
      amount: 50+
    - title: Exportní trhy
      amount: Evropa, Amerika, Asie, Blízký východ, Oceánie
    - title: Výroba
      amount: Qingdao, China
    - title: Americký sklad
      amount: Montclair, CA
features3_markets:
  tagline: Klíčové trhy
  title: Regionální odbornost<br />pro místní požadavky
  subtitle: Chápeme, že různé trhy mají různé regulační požadavky, preference a případy použití.
  isBeforeContent: false
  columns: 4
  items:
    - title: Evropa a Spojené království
      description: CE-certifikované produkty splňující normy EN ISO 6185. Silná poptávka po RIB, nafukovacích člunech a prknech SUP na trzích EU. Britští distributoři oceňují naši rychlou odezvu.
      icon: tabler:map-pin
    - title: Severní Amerika
      description: Výroba schválená pobřežní stráží USA. Americký sklad v Montclair, CA pro rychlé dodání na západní pobřeží. Rostoucí poptávka po rybářských člunech, záchranných plavidlech a rekreačních SUP.
      icon: tabler:map-pin
    - title: Austrálie a Oceánie
      description: Silný trh pro RIB lodě a nafukovací tendry. Australští distributoři oceňují naše čluny Hypalon pro odolnost vůči UV záření v drsných slunečních podmínkách. Rychlé odeslání z našeho závodu v Asii.
      icon: tabler:map-pin
    - title: Střední východ
      description: Rostoucí poptávka po hlídkových a záchranných člunech. Naše RIB s hliníkovým trupem jsou oblíbené u operátorů pobřežní stráže a bezpečnostních služeb. Vlastní konfigurace pro prostředí s vysokou teplotou.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribuční síť
  title: Partnerství s distributory<br />po celém světě
  subtitle: Spolupracujeme se zavedenými distributory námořního vybavení, OEM značkami a vládními zadavateli.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerství
      description: Výroba privátních značek pro světové značky vodních sportů. Zajistíme vše od návrhu přes výrobu až po dropshipping.
      icon: tabler:building
    - title: Distributorská síť
      description: Autorizovaní distributoři ve více než 20 zemích mají sklad a poskytují místní podporu. Nové dotazy distributorů vítány.
      icon: tabler:users
    - title: Vládní a institucionální
      description: Přímé dodávky pro pobřežní stráže, pátrací a záchranné organizace a vojenské programy nákupu. Soulad s požadavky institucionálního zadávání zakázek.
      icon: tabler:building-community
steps2_logistics:
  title: Globální logistika a podpora
  subtitle: Od továrny po místo určení – řídíme celý dodavatelský řetězec.
  items:
    - title: Možnosti dopravy
      description: Námořní přeprava (FOB Qingdao), letecká přeprava pro urgentní objednávky a expresní kurýr pro vzorky a náhradní díly.
      icon: tabler:truck-delivery
    - title: Americký sklad
      description: 'Sklad v Montclair, CA pro rychlé dodání po celé Severní Americe. Západní pobřeží: 2-3 dny, střední: 3-4 dny, východní pobřeží: 4-5 dní.'
      icon: tabler:building-warehouse
    - title: Náhradní díly
      description: Originální náhradní díly a spotřební materiál za Paddle Board Overstock skladem po celý rok. Běžné díly expedujeme do 24 hodin.
      icon: tabler:package
    - title: Technická podpora
      description: Přímá linka na náš technický tým s technickými dotazy, radami při opravách a podporou při opravách. Podporujeme lodě, které jsme postavili před 20 lety.
      icon: tabler:headset
cta:
  title: Chcete se stát distributorem?
  subtitle: Aktivně rozšiřujeme naši distribuční síť. Kontaktujte náš exportní tým a proberte možnosti partnerství.
  actions:
    - variant: primary
      text: Dotaz na partnerství
      href: /contact
    - text: Prohlédněte si naši produktovou řadu
      href: /products

