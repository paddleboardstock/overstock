content_version_control:
  tagline: Kontrola verzí
  title: Verze výkresu<br />Správa
  subtitle: Každý výkres se řídí systémem řízených revizí. Před použitím výkresů pro plánování projektu vždy ověřte, že máte aktuální revizi.
  items:
    - title: Sledování revizí
      description: Každý výkres nese kód revize (Rev-A, Rev-B, Rev-C), datum vydání, datum poslední revize, použitelný model/konfiguraci, jednotky, velikost souboru a formát. Ke stažení je k dispozici pouze "Aktuální" revize.
      icon: tabler:git-branch
    - title: Oznámení o stavu výkresu
      description: Všechny veřejné výkresy jsou označeny "Pouze předběžné rozvržení — ne pro konstrukci, certifikaci nebo výrobní použití. Rozměry podléhají konečné specifikaci a potvrzení objednávky." To chrání obě strany před nesprávným použitím.
      icon: tabler:alert-circle
    - title: Aktualizovat oznámení
      description: Když se změní specifikace modelu, aktualizuje se revize výkresu a předchozí verze jsou označeny jako „Nahrazeno“. Registrovaní uživatelé, kteří si stáhli balíčky DXF/DWG, jsou informováni o významných aktualizacích prostřednictvím e-mailu.
      icon: tabler:bell
faq:
  title: Technické výkresy — Často kladené otázky
  questions:
    - q: Jsou GA PDF opravdu zdarma?
      a: Ano. Soubory PDF s obecnými podmínkami pro naše hlavní modely jsou k dispozici zdarma – vyplňte níže uvedený krátký kvalifikační formulář a odkaz ke stažení vám bude doručen e-mailem do 1 pracovního dne. Obsahují informace na úrovni plánování dostatečné pro vyhodnocení projektu, přidělení prostoru a předběžné přezkoumání specifikací.
    - q: Jak získám přístup k souborům DXF/DWG?
      a: Vyplňte krátký kvalifikační formulář na stránce stahování s názvem vaší společnosti, typem projektu a zamýšleným použitím. Schválené žádosti obdrží odkaz ke stažení e-mailem do 1 pracovního dne.
    - q: Mohu získat 3D modely STEP/IGES?
      a: Soubory 3D modelů STEP nebo IGES jsou k dispozici prostřednictvím našeho procesu projektové žádosti. Uveďte rozsah projektu, požadavky na integraci, časovou osu a záměr nákupu. Podléhá schválení – obvykle do 3–5 pracovních dnů.
    - q: Proč omezujete přístup k souborům s vyššími detaily?
      a: Geometrie trupu, údaje o formách a strukturální výpočty představují roky investic do výzkumu a vývoje a jsou hlavním výrobním IP. Poskytujeme vše potřebné pro plánování nákupu a integraci projektů a zároveň chráníme naši schopnost pokračovat v investicích do vývoje nových produktů.
    - q: Obsahují výkresy výrobní detaily?
      a: Ne. Veřejné výkresy a výkresy v lehké formě obsahují informace na úrovni nákupu pro plánování a specifikaci. Podrobnosti na úrovni výroby (plány laminace, dráhy nástroje, rozšíření řezání) jsou sdíleny pouze v rámci NDA s potvrzenými objednávkami.
    - q: Jsou k dispozici výkresy pro vlastní nebo semi-vlastní konfigurace RIB?
      a: Vlastní projektové výkresy jsou připravovány jako součást vývojového procesu OEM/ODM. Pokud hodnotíte zakázkový projekt RIB, kontaktujte nás se svými požadavky a my jako součást návrhu poskytneme výkresy GA specifické pro daný projekt.
