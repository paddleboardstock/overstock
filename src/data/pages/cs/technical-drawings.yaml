hero:
  tagline: Technické výkresy a CAD
  title: RIB & nafukovací člun<br />Stažení technických výkresů a CAD
  subtitle: Výkresy GA na úrovni plánování, listy rozměrů a rozvržení paluby pro hodnocení a specifikaci projektu. Získejte přístup k technickým výkresům na správné úrovni – od veřejných souborů PDF po soubory STEP na úrovni projektu.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Technické výkresy RIB člunů a CAD soubory ke stažení
direct_answer: Aquafarer poskytuje technické výkresy na úrovni nákupu pro RIB čluny a nafukovací plavidla – včetně souborů PDF s celkovým uspořádáním (GA), rozměrových listů a výkresů rozložení paluby. Formáty s vyššími detaily (DXF/DWG, STEP/IGES) jsou k dispozici na základě kvalifikovaného dotazu nebo projektové žádosti.
stats:
  - value: GA PDF
    label: Zdarma ke stažení
    detail: Obecné uspořádání podle modelu
  - value: DXF/DWG
    label: Přístup k lehké formě
    detail: 2D CAD na úrovni plánování
  - value: STEP/IGES
    label: Žádost o projekt
    detail: 3D model pro integraci
  - value: Pouze NDA
    label: Konstrukční výkresy
    detail: Laminování trupu, data formy
content_tiers:
  tagline: Stáhnout Tiers
  title: Čtyři úrovně přístupu<br />— Správný detail pro správnou scénu
  subtitle: Poskytujeme výkresy na úrovni nákupu, nikoli soubory na úrovni výroby. Každá úroveň odpovídá jiné fázi projektu.
  items:
    - title: Úroveň 1 — Veřejné PDF
      description: Obecné uspořádání (GA), 4-pohledový rozměrový výkres a rozložení paluby ve formátu PDF. K dispozici ke stažení zdarma. Dostatečná pro plánování projektu, alokaci prostoru a předběžnou kontrolu specifikací.
      icon: tabler:file-type-pdf
    - title: Úroveň 2 — Light Form DXF/DWG
      description: 2D CAD soubory (DXF nebo DWG) pro integraci rozvržení na úrovni plánování. Vyžaduje krátký kvalifikační formulář (název společnosti, typ projektu, zamýšlené použití). Nejsou zahrnuty žádné konstrukční nebo výrobní údaje.
      icon: tabler:file-code
    - title: Úroveň 3 — Projektová aplikace STEP/IGES
      description: Soubory 3D modelů (STEP nebo IGES) pro systémovou integraci, návrh vybavení nebo koordinaci námořní architektury. Vyžaduje projektovou žádost s rozsahem, časovou osou a záměrem nákupu. Podléhá schválení.
      icon: tabler:cube
    - title: Úroveň 4 – NDA Engineering
      description: Strukturální výkresy trupu, plány laminace, expanze řezání trubek a data formy. Dostupné pouze v rámci NDA s potvrzenými objednávkami. Toto jsou soubory na úrovni výroby – nejsou určeny pro veřejnou distribuci.
      icon: tabler:lock
content_included:
  tagline: Co je zahrnuto
  title: Obsah výkresu<br />Na model
  subtitle: Každý model má standardní výkresový balíček obsahující základní plánovací informace pro B2B nákupčí a projektové inženýry.
  items:
    - title: obecné ujednání (GA)
      description: Boční profil, pohled shora a příčný řez zobrazující tvar trupu, polohu trubky, umístění konzoly, sedlo, palivový systém a klíčové rozměry (LOA, nosník, průměr trubky, úhel náklonu). Stav revize a autorská práva jsou uvedeny v záhlaví.
      icon: tabler:layout
    - title: Rozměrový výkres se 4 pohledy
      description: Boční, přední, zadní a horní pohledy s celkovými rozměry pro plánování přepravy (výška na přívěsu, nosník pro kontejner, hmotnost pro zvedání). Zahrnuje provozní a přepravní konfigurace.
      icon: tabler:ruler-2
    - title: Rozložení paluby a plán vybavení
      description: Pohled shora dolů zobrazující základnu konzoly, polohy sedadel, umístění D-kroužků, polohy navigačních světel, přístup k drenážnímu čerpadlu, přihrádku na baterii/palivo a upevňovací body zařízení. Omezená přesnost na proprietárních rozhraních.
      icon: tabler:map
    - title: Kreslení dopravy a balení
      description: Plán nakládání kontejnerů, rozměry kolébky, rozložení hmotnosti a pozice zvedacích bodů pro plánování logistiky. Zahrnuje standardní a vlastní možnosti balení.
      icon: tabler:truck
content_protection:
  tagline: IP ochrana
  title: Co nesdílíme<br />& Proč
  subtitle: Ochrana našeho inženýrského IP zajišťuje, že můžeme pokračovat v investicích do výzkumu a vývoje a zároveň poskytovat vše, co kupující potřebují pro plánování projektu.
  items:
    - title: Údaje o jádru formy trupu
      description: Geometrie zástrčky a formy, dráhy CNC nástrojů a laminovací šablony jsou vlastní výrobní aktiva. Nejsou sdíleny na žádné úrovni přístupu mimo potvrzené smlouvy NDA.
      icon: tabler:ban
    - title: Rozšíření pro řezání trubek
      description: Řezací pilníky s plochým vzorem pro hadicovou tkaninu jsou data na úrovni výroby. Dostupné pouze v rámci NDA s potvrzenými výrobními objednávkami a sdílené pouze se smluvní stranou.
      icon: tabler:ban
    - title: Strukturální výpočty
      description: Podrobná analýza napětí, výsledky FEA a harmonogramy laminátů jsou dokumenty citlivé na shodu, které jsou během procesu posuzování shody sdíleny pouze s notifikovanými osobami a klienty vázanými na NDA.
      icon: tabler:ban
    - title: Screening konkurentů
      description: Vyhrazujeme si právo odmítnout žádosti o přístup ke CAD, které se zdají být od konkurentů, studentů bez kontextu projektu nebo stran bez legitimního záměru získat zakázku.
      icon: tabler:shield
content_models:
  tagline: Dostupné modely
  title: Technický nákres<br />Dostupnost podle modelu
  subtitle: GA PDF ke stažení jsou k dispozici pro naše hlavní modely RIB a nafukovacích člunů. Kontaktujte nás pro konkrétní modelové výkresy, které nejsou uvedeny.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, GRP deep-V trup, Hypalon nebo PVC trubky, středová konzola. GA, rozměry, rozložení paluby a plán dopravy k dispozici. Kategorie designu C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP středně V trup, Hypalon nebo PVC trubky, boční nebo středová konzola. GA a rozměry k dispozici. Kategorie designu C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP trup, PVC trubky, kormidlo nebo konzola. GA a rozměry k dispozici. Kategorie designu C/D.
      icon: tabler:sailboat
    - title: Nafukovací člun AF380
      description: 3,8 m nafukovací člun, hliníková podlaha, PVC trubek. Dostupné rozměry GA a balení. Vyhovuje normě EN ISO 6185.
      icon: tabler:sailboat
    - title: Nafukovací člun AF320
      description: Nafukovací člun 3,2 m, podlaha vzduchové paluby, PVC trubek. Dostupné rozměry GA a balení. Vyhovuje normě EN ISO 6185.
      icon: tabler:sailboat
