benefits:
  - title: Vytvořeno pro každodenní výuku
    description: Tlustší PVC a zesílené kolejnice odolají každodennímu používání studenty, pádům na písku a kamenitým přistáním.
    icon: tabler:shield
  - title: Stabilní vzdělávací platformy
    description: Širší trupy a plošší rockery dodávají začátečníkům jistotu. Instruktoři se zaměřují na výuku, ne na vybavení.
    icon: tabler:scale
  - title: Snadné skladování a přeprava
    description: Nafukovací designové obchody do malých prostor. Vyfouknuté desky se hodí do standardních kufrů vozidel pro mobilní výuku.
    icon: tabler:box-seam
  - title: Vlastní branding
    description: Školní loga a barvy na každé tabuli. Vaše značka, vaše identita – ne běžné půjčovny.
    icon: tabler:brush
content_segments:
  tagline: Školní profily
  title: Řešení vzdělávání ve vodních sportech<br />Podle typu programu
  subtitle: Školy pádla, surfařské akademie, univerzitní programy a provozovatelé franšízy čelí různým provozním výzvám – od integrace učebních osnov až po standardizaci vozového parku na více místech. Konfigurujeme balíčky vybavení tak, aby odpovídaly vzdělávacímu modelu.
  items:
    - title: Nezávislé SUP a kajakářské školy
      subtitle: Školicí střediska provozovaná vlastníky
      description: Malé až středně velké školy provozované majiteli-instruktory nabízejícími SUP lekcí, kajakářských školení a certifikačních kurzů. Vybavení musí být dostatečně odolné pro každodenní výukové použití, dostupné pro rozpočet malé firmy a dostatečně univerzální, aby sloužilo začátečníkům až středně pokročilým studentům v rámci jediné flotily.
      features:
        - Stabilní všestranné SUP prkna a rekreační kajaky pro lekce pro začátečníky
        - Prkna specifická pro instruktory s extra stabilitou pro trénink z vody
        - Součástí jsou šablony plánů lekcí a průvodce progresem dovedností
        - Roční program obnovy vybavení se slevami na protiúčet
    - title: Univerzitní a vysokoškolské rekreační programy
      subtitle: Velké studentské rekreační flotily
      description: Univerzitní rekreační oddělení provozující kluby pádla, programy pronájmu a instruktážní kurzy jako součást nabídky rekreace v kampusu. Vybavení čelí maximálnímu využití během semestrů, vyžaduje snadné systémy přihlášení/odhlášení a musí odolat různým úrovním dovedností od začátečníků až po pokročilé vodáky.
      features:
        - Konstrukce s vysokou životností PVC určená pro cykly institucionálního použití
        - Barevně odlišené flotily podle úrovně dovedností pro snadnou správu
        - Kompatibilita systému sledování zásob na bázi RFID nebo nálepek
        - Hromadné ceny s objednávkovými a platebními podmínkami na základě semestru
    - title: Surfové školy a surfové akademie
      subtitle: Výukové programy pro pobřežní surfování
      description: Školy surfování vyučující SUP surfování, pádlování na břiše a surfování na kajaku v prostředí oceánu. Vybavení musí zvládat podmínky surfovací zóny – odolnost proti nárazu, odolnost vůči písku a slané vodě a snadné oplachování a vracení mezi hodinovými lekcemi.
      features:
        - Tvary specifické pro surfování se zesílenými kolejnicemi a konstrukcí odolnou proti nárazu
        - Možnosti měkkých ploutví a stočená vodítka pro bezpečnost studentů
        - Tkanina pro rychlé máchání, která mezi jednotlivými lekcemi schne
        - Program výměny vozového parku s kontrolou a obnovou na konci sezóny
    - title: Franšízové ​​a multilokační řetězce
      subtitle: Standardizované vybavení napříč lokalitami
      description: Operátoři z různých míst provozují standardizované školicí programy ve více městech nebo regionech. Konzistence vozového parku napříč lokalitami je prvořadá – každý student by měl mít stejné zkušenosti s vybavením bez ohledu na to, kterou franšízovou lokalitu navštíví. Centralizované řazení, jednotnost značky a podpora škálování jsou zásadní.
      features:
        - Identické specifikace vozového parku ve všech franšízových lokalitách
        - Centralizované konsolidované objednávání s objemovými cenami
        - 'Možnosti co-brandingu: franšízová značka + Paddle Board Overstock co-brand'
        - 'Nová sada pro nastavení umístění: vybavení, značení a otevírací inventář'
