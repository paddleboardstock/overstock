hero:
  tagline: Školy a výcviková střediska vodních sportů
  title: Řešení vybavení<br />Pro SUP a školy kajaku
  subtitle: Spolehlivé vybavení komerční úrovně pro školy pádla, výuku surfování, výcvik na kajaku a vzdělávací programy pro vodní sporty v jakémkoli měřítku.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP prkna Paddle Board Overstock pro školy a tréninková centra
direct_answer: Paddle Board Overstock dodává SUP a kajakářským školám po celém světě prkna na komerční úrovni, bezpečnostní vybavení a balíčky pro instruktory. Naše vybavení je navrženo pro každodenní výukové použití – silnější PVC, zesílená jádra s vyšívacím stehem a stabilní konstrukce trupu, které dodávají začátečníkům jistotu a instruktorům spolehlivost. Balíčky zahrnují vlastní značku, programy náhradních dílů a školicí zdroje.
