testimonial:
  content: Paddle Board Overstock navrhl a vybavil celý náš program plážových aktivit ve třech resortech. 80 SUP, 40 kajaků, bezpečnostní infrastruktura a školení personálu – vše dodáno v jedné zásilce. Účast našich hostů na vodních aktivitách se v první sezóně zvýšila o 60 %.
  name: Sophie Laurentová
  title: Ředitel pro zkušenosti hostů, Azure Bay Resorts – Phuket, Thajsko
content_segments:
  tagline: Profily resortů
  title: Waterfront Hospitality Solutions<br />Podle typu nemovitosti
  subtitle: Každý resort má jedinečný profil hosta, mix aktivit a provozní rytmus – od butikových ekologických chat až po rozlehlá luxusní plážová letoviska. Navrhujeme programy vodních sportů, které odpovídají třídě nemovitosti a očekávání hostů.
  items:
    - title: Luxusní resorty na pláži
      subtitle: VIP transfery, vodní aktivity, prémiový zážitek pro hosty
      description: Špičkové plážové nemovitosti – Four Seasons, Aman a podobné luxusní skupiny – kde jsou vodní sporty prvotřídním vybavením hostů, které řídí skóre spokojenosti a vedlejší příjmy. Vozový park musí vypadat prémiově, nabízet rozmanitost napříč věkovými skupinami a úrovněmi schopností a hladce se integrovat se stávajícími systémy concierge a rezervačními systémy resortu. Očekávání vzhledu hostů jsou extrémně vysoká — stav vybavení a prezentace přímo ovlivňují 5hvězdičkové recenze.
      features:
        - 'Prémiová značková flotila: SUP, kajaky, šlapadla a malé RIB tendry'
        - 'Prezentace připravená pro hosty: sladěné barvy resortu, logo branding, scénické vystavení vybavení'
        - Malý luxus RIB za přepravu VIP hostů s vlastním čalouněním a přizpůsobením barev
        - 'Integrovaná bezpečnostní infrastruktura: bóje, stanoviště plavčíků, AED'
        - 'Správa výnosů: dynamické šablony cen, školení upsell, sdružování balíčků'
    - title: Soukromá ostrovní letoviska
      subtitle: Doprava hostů za každého počasí — nulové prostoje, absolutní spolehlivost
      description: Soukromá ostrovní letoviska fungují na odlehlých místech, kde je loď jediným spojením s pevninou. Každodenní přesuny hostů, zásobování a nouzové lékařské evakuace závisí na jediném plavidle – jakékoli prostoje přímo ovlivňují zážitek hostů a provoz letoviska. Tito operátoři potřebují loď, která spolehlivě jezdí za všech povětrnostních podmínek, vyžaduje minimální údržbu a má záložní systémy pro kritickou spolehlivost. Loď se také musí krásně prezentovat, když hosté dorazí na ostrov.
      features:
        - Konfigurace do každého počasí RIB s úplným krytem proti povětrnostním vlivům a odolnými trubkami
        - K dispozici dvoumotorový nebo záložní motor pro operace s nulovými prostoji
        - Komerční konstrukce Hypalon pro životnost 5-8 let ve vzdáleném servisu
        - Konstrukce se snadnou údržbou s přístupnými součástmi pro servis na místě
        - Vlastní značka resortu a prémiové čalounění odpovídající estetice ostrova
    - title: Resorty u jezer a eko resorty
      subtitle: Zážitky hostů integrované s přírodou
      description: Nemovitosti u jezera, eko-chaty a přírodní útočiště nabízející klidné vodní aktivity s nízkým dopadem, které doplňují přírodní prostředí. Vybavení by mělo být tam, kde je to možné, bez motoru, mělo by se snadno skladovat v loděnicích s omezeným prostorem a mělo by být tiché, aby se zachovalo prostředí pro všechny hosty.
      features:
        - 'Nemotorizovaná flotila: SUP, kajaky, kánoe a šlapadla'
        - Tiché nafukovací stanice s elektrickým čerpadlem pro hosty na vyžádání
        - Ekologické materiály a obaly v souladu se značkou udržitelnosti
        - Včetně skladovacích regálů a systémů organizace loděnic
    - title: Plážové kluby
      subtitle: Transfery hostů, zábava, malé luxusní RIB
      description: Plážové kluby provozují vysoce energetické, vizuálně zaměřené prostředí, kde je vybavení součástí atmosféry. Potřebují malé luxusní RIB pro přepravu hostů z okolních hotelů nebo doků a vodní hračky pro zábavu hostů – vodní skútry, nafukovací skluzavky a paddleboardy. Vozový park musí vypadat stylově, snadno se ovládat a vydržet každodenní používání hosty s různou úrovní dovedností. Skladování a rychlé nasazení jsou kritické ve špičce.
      features:
        - Kompaktní luxusní RIB (3,3-4,3 m) pro transfery hostů a nabídkové služby
        - 'Hračky do vody: tažné nafukovací čluny, prkna SUP, kajaky pro zábavu hostů'
        - Vlastní barva a značka odpovídající vizuální identitě plážového klubu
        - Systémy rychlého spouštění a vyhledávání pro operace s vysokým obratem
        - Odolná konstrukce Hypalon pro každodenní vystavení slané vodě a UV záření
    - title: Soukromé členské kluby a jachtařské kluby
      subtitle: Přístavní doprava, členské tendry, exkluzivní vodní sporty
      description: Soukromé kluby, kde jsou vodní sporty a lodní doprava spíše přínosem pro členy než zdrojem příjmů. Vybavení musí splňovat vyšší estetické standardy, být dostupné na vyžádání pro členy a vyžadovat minimální dohled personálu. Marina jachtařských klubů konkrétně potřebuje výběrová řízení na přístavní dopravu – přesun členů mezi dokem, kotvištěm a břehem. Skladování a údržba by měly být pro členy neviditelné.
      features:
        - Špičková RIB výběrová řízení na přístavní dopravu a službu transferu členů
        - 'Prémiové vybavení: paluby EVA, vlastní barvy členů, značkové čalounění'
        - Samoobslužný odhlašovací systém pro přístup členů bez personálu
        - Mimosezónní skladování a roční obnovovací program
    - title: Hotely zaměřené na dobrodružství a aktivity
      subtitle: Prohlídky s průvodcem, SUP jóga, výlety se šnorchlováním, skupinové aktivity
      description: Nemovitosti, které se staví jako dobrodružné destinace – nabízejí prohlídky s průvodcem, SUP jógu, pádla při západu slunce, výlety za šnorchlováním a skupinové aktivity. Flotila musí podporovat modely bezplatného pronájmu i řízeného programu s vybavením, které plynule přechází mezi vlastními prohlídkami hostů a prohlídkami vedenými instruktory. Tyto objekty potřebují odolné vybavení pro vysokofrekvenční obrat se snadným čištěním mezi skupinami hostů.
      features:
        - Všestranný smíšený vozový park podporující pronájem + modely prohlídek s průvodcem
        - Tandemové kajaky a extra stabilní plošiny SUP pro skupinové aktivity
        - 'Vybavení průvodce: instruktorské desky, suché boxy, vodotěsné komunikátory'
        - 'Sezónní rotace vybavení: letní vozový park → zimní skladovací program'
        - Odolná konstrukce určená pro každodenní používání hostů s minimální údržbou
