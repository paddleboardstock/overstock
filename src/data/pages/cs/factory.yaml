material_traceability:
  tagline: Sledovatelnost
  title: Sledování materiálu a kontrola šarží
  description: Každá šarže suroviny má v našem ERP systému přiděleno jedinečné číslo šarže. Od dodání přes výrobu až po hotový výrobek se kusovník každé lodi vrací zpět k původní šarži dodavatele. To umožňuje plnou zpětnou sledovatelnost pro jakýkoli dotaz na kvalitu nebo shodu.
  system: Vlastní ERP (interní systém) + fyzické značky šarže na každém pracovním příkazu
  coverage: 100 % výrobních materiálů — PVC, Hypalon, tkanina s kapkovým stehem, lepidla, ventily, hardware, obaly
  records_retained: 10 let (podle požadavků CE 2013/53/EU)
  suppliers:
    - material: Námořní třída PVC
      source: Čínští a korejští dodavatelé
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japonský dodavatel
      certified: ISO 9001, REACH
    - material: Drop-stitch tkanina
      source: Vlastní tkalcovna + externí partner
      certified: Interní QC + dodavatel ISO 9001
    - material: Ventily a hardware
      source: Čínští OEM dodavatelé
      certified: ISO 9001, materiálové certifikáty na šarži
