hero:
  tagline: Továrna
  title: Továrna a výroba
  subtitle: 12 000 m2 integrované výroby – od surovin až po hotovou loď
intro:
  - Jako tovární značka **Aquafarer Qingdao Manufacturing Hub** kontroluje Aquafarer každou fázi výroby – od dodání surového PVC a sklolaminátových materiálů až po konečnou předdodávkovou kontrolu hotové lodi. Náš výrobní závod v zóně ekonomického rozvoje Qingdao se rozkládá na ploše 12 000 metrů čtverečních a nachází se v něm specializované dílny pro řezání PVC, tepelné těsnění trubek, výrobu trupů RIB ze skelných vláken, digitální tisk SUP, konečnou montáž a testování kvality.
  - Integrací návrhu, inženýrství, prototypování, výroby a testování pod jednu střechu eliminujeme neefektivitu smluvní výroby a udržujeme přímou kontrolu nad kvalitou sestavení, výběrem materiálu a dodacími lhůtami. Každá loď, která opouští naši dílnu, je postavena našimi lidmi, na našem vybavení, podle našich standardů.
