workshops_section:
  tagline: Workshopy
  title: Výrobní dílny
  workshops:
    - title: PVC Řezání a příprava materiálu
      description: Automatické CNC řezací stroje zpracovávají tkaniny PVC, Hypalon a drop-stitch se submilimetrovou přesností. Počítačově optimalizované skládání minimalizuje plýtvání materiálem a zajišťuje, že každý panel před svařováním splňuje své rozměrové specifikace.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Svařování trubek a tepelné těsnění
      description: Vyhrazená svářecí dílna se stroji na tepelné svařování a vysokofrekvenčními dielektrickými lisy. Horkovzdušné tepelné spoje spojují a spojují PVC trubkové komory, zatímco RF svary vytvářejí vysoce pevné vzduchotěsné švy, které překračují požadavky ISO 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Výroba trupu — sklolaminát
      description: RIB lodních trupů se vyrábí pomocí ručního lisování ze skelných vláken se systémy polyesterových a vinylesterových pryskyřic. Každá vrstva je ručně válcovaná a vakuově zabalená pro konzistentní kvalitu. Stříkací kabina Gelcoat poskytuje námořní povrchovou úpravu s vysokým leskem a odolností proti UV záření.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Tisk a dekorace
      description: Desky SUP jsou zdobeny digitálním tiskem pro plnobarevnou grafiku a sítotiskem pro loga a opakující se vzory. Digitální tiskárny vytvářejí návrhy palub ve fotografické kvalitě, zatímco sítotisk poskytuje odolné a živé značky značky.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Konečná montáž a vybavení
      description: Montážní linka, kde se spojují sklolaminátové trupy a PVC trubky, montují se motory, připojují se řízení a ovládací prvky a propojují elektrické systémy. Každá loď se řídí 100bodovým kontrolním seznamem sestavy podepsaným vedoucím týmu.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Testování a kontrola kvality
      description: Každá dokončená loď prochází před odesláním povinným testem zadržení vzduchu, ověřením odlupování švů a kompletní kontrolou systémů. Naše laboratoř kvality funguje nezávisle na výrobě a podléhá přímo managementu.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
