qc_section:
  tagline: Kontrola kvality
  title: Proces testování a zajištění kvality
  subtitle: Každá loď prochází před odesláním povinným testováním. Naše laboratoř kvality funguje nezávisle na výrobě a podléhá přímo managementu.
  steps:
    - step: '1'
      title: Kontrola surovin
      desc: PVC, Hypalon a tkaniny s kapkovým stehem procházejí zkouškou v tahu (ASTM D751), šířením roztržení a ověřením odolnosti vůči UV záření předtím, než jakákoli šarže vstoupí do výroby.
    - step: '2'
      title: 48hodinový test retence vzduchu
      desc: Každá trubková komora je nafouknuta na 125 % jmenovitého tlaku a udržována po dobu 48 hodin. Pokles tlaku pod 5 % spustí automatické vyřazení a novou kontrolu švu.
    - step: '3'
      title: Testování zátěže a vyvážení
      desc: Dokončené lodě jsou naloženy na maximální jmenovitou kapacitu a testovány na stabilitu, volný bok a manipulaci. Každá nádoba je před závěrečnou kontrolou testována vodou.
oem_section:
  tagline: OEM Projekty
  title: Případové studie o značce a partnerství OEM
  subtitle: Od konceptu ke kontejneru – jak pomáháme globálním značkám uvést a rozšířit jejich řady nafukovacích plavidel.
  cases:
    - challenge: Evropský outdoorový prodejce potřeboval řadu SUP privátní značky s jedinečnou grafikou paluby, ekologickým PVC a balením připraveným pro maloobchod – vše dodáno do 60 dnů.
      solution: Vyvinuté vlastní digitální tiskové soubory, PVC vyhovující REACH a komprimované vzorkování ze 3 kol na 1 společným umístěním konstrukčního týmu v naší továrně Qingdao.
      result: 55 dní od podepsané objednávky do FOB. 2 400 jednotek ve 4 SKU. Opakujte objednávku zadanou před příchodem prvního kontejneru.
    - challenge: Americký startup zaměřený na vodní sporty potřeboval vysoce výkonný kajak s padacím stehem s vlastním tvarem trupu, co-brandovým balením a certifikací BSCI pro maloobchodní umístění.
      solution: Upravil stávající formu na kajak s vyšívacím stehem s upraveným profilem rocker, vyvinul obalový obal pod společnou značkou a poskytl úplnou dokumentaci auditu BSCI.
      result: Úspěšně uvedena ve 3 hlavních amerických outdoorových řetězcích. 5 000+ jednotek v prvním roce s 98% mírou prodeje.
    - challenge: Australský distributor požadoval CE certifikovanou řadu RIB s vlastními barvami trubek, Hypalon možnost upgradu a soulad s australskou normou AS 1799.
      solution: Vyráběly předprodukční vzorky se 4 barevnými variantami zkumavek, získávaly CSM Hypalon od japonského dodavatele a koordinovaly testování shody s AS 1799 třetí stranou.
      result: 3-modelová řada RIB uvedena na trh AU/NZ. Následovalo vítězství ve vládním tendru na 12 hlídkových RIB.
faq_section:
  tagline: FAQ
  title: B2B & OEM Často kladené otázky
  questions:
    - q: Jaké je minimální objednací množství (MOQ) pro OEM nafukovacích SUP prken?
      a: MOQ začíná na 5–10 jednotkách pro standardní modely OEM. Vlastní formy a projekty soukromých značek vyžadují minimálně 200 jednotek v závislosti na složitosti. Pro uvedení nové značky na trh jsou k dispozici zkušební objednávky a vzorky.
    - q: Má Aquafarer certifikaci BSCI?
      a: Ano. Naše továrna má platnou certifikaci sociální shody BSCI (revizní zpráva je k dispozici na vyžádání). Jsme také držiteli ISO 9001:2015 pro řízení kvality a 64 našich modelů nese CE certifikaci (TÜV Rheinland). Dokumentace o shodě REACH a RoHS dodávaná s každou zásilkou OEM.
    - q: Jaká je typická dodací lhůta pro objednávku OEM?
      a: Standardní dodací lhůta je 30–45 dní od potvrzení objednávky a vkladu. Vlastní vývoj formy přidává 15–20 dní na nástroje. V předletním období (leden–březen) nabízíme zrychlenou výrobu pro urgentní objednávky a sezónní návaly.
    - q: Můžete poslat FOB Qingdao nebo CIF do našeho přístavu?
      a: Ano. Dodáváme FOB Qingdao, CIF hlavních světových přístavů a ​​DDP pro kvalifikované partnery. Náš logistický tým spravuje rezervaci kontejnerů, exportní dokumentaci a celní odbavení. Dodáváme do více než 50 zemí na trzích EU, USA, AU a Asie.
b2b_moq: 'Standardní MOQ: 5–10 jednotek na model (SUP/kajak/prošívání). RIB MOQ: 2–5 jednotek. Zkušební objednávky vítány pro nová partnerství.'
production_flow:
  tagline: Výrobní tok
  title: Od materiálu po hotovou loď
  subtitle: Každá loď prochází 6 výrobními fázemi s kontrolními body QC na každém kroku. Žádné zkratky, žádné vynechané kontroly.
  stages:
    - stage: '01'
      title: Příjem materiálu a příchozí kontrola kvality
      description: Všechny příchozí materiály jsou v našem ERP systému evidovány podle čísla šarže/šarže. PVC rolí látky, vyšívaných jader, ventilů, lepidel a hardwaru je v karanténě až do odhlášení kontroly kvality.
      qc_check: Pevnost v tahu (ASTM D751), odolnost proti roztržení (ISO 4674), tloušťkoměr, viskozita lepidla, vizuální skenování defektů
      qc_threshold: 100 % testovaných šarží. Odmítněte, pokud je tah < 90 % specifikace, trhlina < spec min nebo jakákoliv vizuální vada
      responsibility: Příchozí tým kontroly kvality (3 inspektoři)
    - stage: '02'
      title: CNC řezání a příprava materiálu
      description: Počítačově optimalizované hnízdění rozmístí panely na PVC skladu, aby se minimalizoval odpad. Automatické CNC řezací stroje zachovávají polohovou přesnost 0,1 mm.
      qc_check: Kontrola rozměrů proti souborům CAD DXF, kontrola kvality hran, ověření počtu panelů
      qc_threshold: Každý 20. panel měřen. Tolerance ±0,5 mm. Odmítněte šarži, pokud je > 2 % mimo toleranci
      responsibility: Vedení řezací dílny
    - stage: '03'
      title: Svařování a lepení drop-stitch
      description: Jádra drop-stitch jsou spojena s vnějšími PVC lamináty pomocí tepelné laminace. Trubkové komory jsou svařovány RF nebo horkovzdušně. Kolejnicové pásy jsou třívrstvé tavně lepené.
      qc_check: Test odlupování každých 50 jednotek (ASTM D751), měření šířky svaru, kontrola protokolu teploty horkého vzduchu, vizuální kontrola švu pod podsvícením
      qc_threshold: Pevnost v odlupování min 8 N/cm. Tolerance šířky svaru ±1 mm. Jakýkoli viditelný channeling = odmítnutí
      responsibility: Kontrola kvality svařování (2 inspektoři za směnu)
    - stage: '04'
      title: Montáž a vybavení
      description: 'Čluny se přesunou ke konečné montáži, kde jsou všechny komponenty spojeny: trup + trubky, nainstalované ventily, D-kroužky, rukojeti, krabice s ploutvemi a upevnění tašky na přenášení. Každá jednotka se řídí 100bodovým kontrolním seznamem montáže.'
      qc_check: 100bodový kontrolní seznam odhlášení na jednotku, test funkce ventilu (10 cyklů otevření/zavření), ověření utahovacího momentu hardwaru, vizuální kontrola
      qc_threshold: 'Zásady nulových vad u položek kritických z hlediska bezpečnosti (ventily, D-kroužky, rukojeti). Drobná kosmetika: AQL 2,5 (ISO 2859)'
      responsibility: Vedení montážního týmu + linka QC
    - stage: '05'
      title: Testování tlaku a udržení kvality
      description: Každá komora je nafouknuta na 1,25× jmenovitý tlak (typicky 20–25 PSI) a udržována po dobu 24–48 hodin. Tlakové senzory se nepřetržitě zaznamenávají. Komory překračující 5% pokles tlaku jsou odmítnuty a odeslány k opětovné kontrole švu.
      qc_check: 24h deník udržování tlaku, kalibrace senzoru ověřena denně, teplotně kompenzovaný odečet tlaku, opakovaný test švu po opravě
      qc_threshold: Max. 5% pokles tlaku za 24 hodin při stabilní teplotě. Každá komora, která toto překročí = 100% retest celé výrobní šarže
      responsibility: Laboratoř kvality (nezávislá na výrobě, reporty managementu)
    - stage: '06'
      title: Závěrečná kontrola a balení
      description: Závěrečná vizuální a funkční kontrola. Povrchové vady, barevná konzistence, ověření štítku/BIN, neporušenost balení a kompletnost příslušenství. Jednotky jsou vakuově baleny, baleny do krabic a paletizovány pro nakládání kontejnerů.
      qc_check: Kompletní vizuální kontrola, kontrolní seznam příslušenství podle SKU, test pádu obalu (1 m, náhodný vzorek), ověření naskenováním štítku/čárového kódu
      qc_threshold: AQL 2,5 pro velké vady, AQL 4,0 pro drobné. Nulová tolerance na bezpečnostní závady. 100 % jednotek vizuálně zkontrolováno
      responsibility: Finální QC tým (4 inspektoři) + vedení balícího týmu
