content_challenge:
  tagline: Výzva
  title: Nabídky jachet vyžadují<br />Výkon a prezentace
  subtitle: Tendr na jachtu je víc než jen malý člun – je to prodloužení mateřského plavidla a prohlášení o kvalitě.
  paragraphs:
    - Majitelé a kapitáni jachet potřebují nabídky, které fungují dobře, skladují se kompaktně a krásně prezentují. Nabídka by měla doplňovat estetiku jachty a zároveň poskytovat spolehlivou přepravu hostů a posádky.
    - '**Skladování je kritické** — Nabídka se musí vejít na palubu, do garáže nebo na davits. Hmotnost je důležitá pro startovací a záchranné systémy. Aquafarer RIB nabízí vynikající poměry výkonu a hmotnosti s kompaktními skladovacími profily.'
    - '**Očekávaný výkon je vysoký** — Hosté očekávají hladkou a suchou jízdu při přesunu na břeh. Možnosti motoru musí vyvážit rychlost, dojezd a úroveň hluku, aby bylo dosaženo prvotřídního zážitku. U charterových operací probíhá výběrové řízení denně a musí vydržet časté používání.'
    - '**Na vzhledu záleží** — Neodpovídající nebo opotřebovaná nabídka narušuje celkovou prezentaci jachty. Vlastní barvy trubek, čalounění a značky zajišťují, že nabídka vypadá tak, jak patří.'
content_solution:
  tagline: Naše řešení
  title: Konfigurace výběrového řízení<br />Pro každou aplikaci jachty
  subtitle: Nabídky Aquafarer RIB lze přizpůsobit tak, aby odpovídaly vašemu plavidlu, typu operace a požadavkům na skladování – od specifikací pro stavitele superjachet až po programy charterové flotily.
  list:
    - Vlastní barvy zkumavek, aby odpovídaly nebo doplňovaly mateřskou nádobu – jakákoliv barva RAL dostupná pro zkumavky Hypalon nebo PVC
    - Zakázkové čalounění a prošívání — prémiový vinyl námořní třídy s barevnou shodou a výšivkou loga
    - Řízení konzoly nebo oje – vyberte si na základě způsobu použití a preferencí operátora
    - Sklolaminátový trup deep-V pro hladkou a suchou jízdu v různých podmínkách na moři
    - Kompaktní úložiště – vyfoukne se nebo se uloží do garáže, skříňky nebo zábradlí
    - Hypalon trubice pro UV odolnost a dlouhodobé zachování vzhledu
    - Závěsné body a tažná oka standardně u všech modelů
    - Volitelný kryt luku, úplný kryt a ochranné chrániče proti oděru
    - 'Rozsah motoru: 15 HP až 60 HP – konfigurace s přívěsným motorem nebo kormidlem'
    - OEM/soukromé značení dostupné pro stavitele jachet a námořní prodejce
content_segments:
  tagline: Profily zákazníků
  title: Řešení nabídek pro jachty<br />Podle typu zákazníka
  subtitle: Různé segmenty jachtařského průmyslu mají jedinečné požadavky. Aquafarer konfiguruje nabídky tak, aby odpovídaly každé aplikaci.
  items:
    - title: Stavitelé superjachet
      subtitle: OEM integrace nabídek – vlastní rozměry, barvy a materiály
      description: 'Stavitelé jachet čelí opakující se výzvě: každé nové plavidlo má jedinečná rozměrová omezení, hmotnostní limity a estetická očekávání. Nabídka se musí dokonale integrovat se systémem otočného jeřábu mateřského plavidla, musí se vejít do přesných rozměrů garáže a musí odpovídat designovému jazyku jachty v hodnotě mnoha milionů eur. Jakýkoli nesoulad – špatná barva trubky, nesprávné umístění zvedacího bodu, nekompatibilní hmotnost – zpomaluje dodávku a špatně se odráží na staviteli. Aquafarer spolupracuje přímo s dodavatelskými a projekčními týmy na dodání nabídek s vlastními barvami trubek RAL, odpovídajícím čalouněním, značkovými konzolovými panely a kompletními balíčky OEM dokumentace.'
      features:
        - Vlastní rozměrové specifikace odpovídající garážovým a davitovým omezením
        - Jakákoli barva trubky RAL a odpovídající čalounění – vzorky schválení designu poskytnuty
        - OEM značky na konzole, trubce a opěradlech sedadel
        - Ověření uložení zvedacího bodu a davit pro každý model
        - Hmotnost trupu optimalizovaná pro specifické startovací a vyprošťovací systémy
        - Plánování hromadného doručení v souladu s harmonogramem výroby
    - title: Společnosti pro správu jachet
      subtitle: Nabídky standardizované pro vozový park — globální podpora, minimální prostoje
      description: Manažerské společnosti dohlížejí na několik jachet provozovaných ve Středozemním moři, Karibiku, jižním Pacifiku a dále. Jejich základním požadavkem je spolehlivost – nefunkční výběrové řízení ve vzdáleném přístavu znamená přesčasy posádky, stížnosti hostů a drahé výměny na poslední chvíli. Standardizované specifikace flotily zkracují dobu výcviku posádky napříč plavidly a zjednodušují správu náhradních dílů. Aquafarer nabízí ceny pro flotilu více lodí, konzistentní specifikace napříč objednávkami a globální podporu náhradních dílů pro správcovské společnosti s plavidly ve více regionech.
      features:
        - Standardizované specifikace pro celý spravovaný vozový park
        - Vyměnitelné náhradní díly napříč všemi fleetovými tendry
        - Ceny vozového parku a množstevní slevy pro objednávky více jednotek
        - Globální dostupnost náhradních dílů – rychlé dodání do jakéhokoli přístavu
        - Konzistentní dokumentace servisu a údržby pro posádku
        - Koordinace dodávek více jednotek na různá místa plavidel
    - title: Provozovatelé charterových jachet
      subtitle: Vysokofrekvenční každodenní provoz — odolnost bez kompromisů ve vzhledu
      description: 'Výběrová řízení na charterové plavby čelí nejnáročnějšímu provoznímu plánu v odvětví jachtařství: každodenní přesuny hostů, výlety na pobřeží, podpora vodních sportů a výběrová řízení v přístavech – často více než 200 operací za charterovou sezónu. Nabídka musí vypadat nedotčeně při každém předání hostem a zároveň vydržet nepřetržité nastupování, vystavení slané vodě a motohodiny. Zhoršení vzhledu je přímým obchodním problémem – opotřebovaná nabídka ovlivňuje hodnocení hostů a ceny pronájmu. Aquafarer konfiguruje výběrová řízení na charter s vylepšeným čalouněním, odolnými trubicemi Hypalon a zesílenými manipulačními plochami pro dlouhodobou odolnost, která zachovává kvalitu prezentace.'
      features:
        - Těžké Hypalon trubky – životnost 5-8 let při každodenním charterovém provozu
        - Zesílené nástupní schůdky a manipulační lana pro časté používání
        - Prémiové vinylové čalounění odolné vůči skvrnám – snadné čištění mezi pronájmy
        - Snadno čistitelné protiskluzové povrchy paluby
        - Spolehlivé přívěsné balíky se snadným servisním přístupem pro těsné obrátky
        - Materiály kosmetické kvality, které si zachovávají vzhled během charterových sezón
    - title: Prodejci a makléři jachet
      subtitle: Spolehlivá nabídka nabídky pro dokončení plavidla a hodnotu při dalším prodeji
      description: Prodejci a makléři potřebují stabilní nabídku kvalitních nabídek, které doplňují plavidla, která prodávají – odpovídající pozici značky a zvyšující zkušenost kupujícího. Nekonzistentní nabídka nebo zpoždění dodávek může zpozdit předání jachty nebo omezit prezentaci nabídky. Prodejci vyžadují konzistentní kvalitu napříč šaržemi, spolehlivé dodací lhůty a konkurenceschopné ceny, aby si udrželi marže. Aquafarer nabízí programy zásob prodejců se sezónním plánováním dodávek, možnostmi co-brandingu pro vystavení v showroomu a přidělováním priorit během hlavní sezóny.
      features:
        - Programy skladování zásob s modely dostupnými na vyžádání
        - Plánování sezónních dodávek v souladu s kalendářem předání
        - Co-branding prodejce na konzole a tubusech pro vystavení v showroomu
        - Konzistentní kvalita a specifikace napříč všemi dávkovými objednávkami
        - Konkurenční ceny dealerů s úrovní založenou na objemu
