hero:
  tagline: Náš příběh
  title: Aquafarer — Inženýrská svoboda na vodě
  subtitle: 'Od pobřežní dílny ke globálnímu námořnímu výrobci – naše cesta je postavena na tvrdohlavém přesvědčení: plavidla by měla být konstruována tak, jak na nich záleží, protože na nich záleží.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Továrna a výrobní závod Aquafarer v Qingdao
