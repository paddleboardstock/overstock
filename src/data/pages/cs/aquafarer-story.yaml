timeline:
  - year: '2012'
    title: Nadace námořní výroby
    body: Aquafarer začala jako specializovaná dílna na výrobu nafukovacích plavidel v Qingdao v Číně, která se zavázala k námořnímu řemeslu a výrobě nafukovacích člunů. Prvotním zaměřením bylo vytváření spolehlivých nafukovacích produktů prostřednictvím praktických inženýrských zkušeností a výrobní disciplíny.
  - year: '2015'
    title: První export a certifikace CE
    body: Počáteční exportní objednávky dorazily do Japonska a Koreje. Certifikace CE byla dosažena pro základní produktové řady, což znamená vstup společnosti Aquafarer na mezinárodní trhy. Společnost začala sloužit komerčním a rekreačním uživatelům mimo Čínu.
  - year: '2018'
    title: Rozšíření továrny
    body: Přemístěna do výrobního závodu o rozloze 12 000 m². Přidány RF svařovací linky a výrobní kapacita drop-stitch, což umožňuje výrobu ve větším měřítku a vylepšené systémy kontroly kvality.
  - year: '2020'
    title: Zřízeno R&D centrum
    body: Otevřeno specializované R&D centrum s PVC látkovou laboratoří, hydrodynamickou testovací nádrží a CAD/FEA simulačním studiem. Vývoj produktu se rozšířil a zaměřil se na lehkou konstrukci, zlepšenou odolnost a design zaměřený na uživatele.
  - year: '2022'
    title: Certifikace a globální růst
    body: Dosáhl certifikace ISO 9001. Rozšířeno na 14 R&D inženýrů a 200+ pracovníků. Produkty se dostaly k zákazníkům v celé Evropě, Americe a Asii a Tichomoří prostřednictvím distributorů a OEM partnerství.
  - year: '2024'
    title: Studio inovací a designu
    body: Zahájení kompletního designového a inovačního studia pro zakázkové ODM projekty, od konceptu až po výrobu. Posílené profesionální námořní aplikace včetně záchranných, komerčních a vládních výběrových řízení.
  - year: '2026'
    title: Budování budoucnosti průzkumu vody
    body: Dnes společnost Aquafarer pokračuje ve vývoji nafukovacích člunů, systémů SUP a přizpůsobených námořních řešení – spojujících lidi a organizace se světovými vodami. Obsluhováno více než 50 zemí, roční kapacita 15 000 jednotek.
content_founding:
  tagline: Počátek
  title: Narozen na nábřeží
  subtitle: 'Aquafarer začal v pobřežní dílně v roce Qingdao s jednou lodí a vizí: postavit nafukovací plavidlo, které by zvládlo skutečné mořské podmínky.'
  paragraphs:
    - V roce 2012 naši zakladatelé viděli mezeru na trhu – většina nafukovacích člunů byla buď cenově dostupná, ale nespolehlivá, nebo vysoce kvalitní, ale neúměrně drahá. Věřili, že existuje prostor pro výrobce, který dodává kvalitu i hodnotu.
    - První trup byl vyroben ručně, testován v místních vodách a vylepšován na základě skutečné zpětné vazby od rybářů a malých komerčních provozovatelů. Tato smyčka zpětné vazby – sestavujte, testujte, poslouchejte, vylepšujte – zůstává jádrem naší dnešní inženýrské filozofie.
    - Do roku 2015 se informace rozšířily za Qingdao. Mezinárodní distributoři začali vyžadovat vzorky. To, co začalo jako místní dílna, se stalo globálním dodavatelem.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Raná výrobní dílna a výroba Aquafareru
content_growth:
  tagline: Růst a inovace
  title: Od dílny po 12 000 m² zařízení
  subtitle: Neustálé investice do lidí, vybavení a procesů přeměnily Aquafarer na moderní námořní výrobní zařízení.
  paragraphs:
    - Jak rostla poptávka, rostlo i naše zařízení. Rozšířili jsme se z malé dílny na továrnu o rozloze 12 000 m² s vyhrazenými výrobními linkami pro čluny RIB, nafukovací čluny, prkna SUP a příslušenství.
    - Investovali jsme do CNC řezacích strojů, vysokofrekvenčního svařovacího zařízení, drop stitch výrobních linek a komplexních testovacích zařízení – což nám umožňuje kontrolovat každý aspekt kvality výroby.
    - Dnes náš tým 200-300 zahrnuje námořní inženýry, materiálové vědce, specialisty na kontrolu kvality a zkušené řemeslníky – z nichž mnozí jsou u Aquafarer již od počátků.
founder:
  tagline: Seznamte se se zakladatelem
  title: Postavil vodník
  subtitle: Zakladatel David Chen spojuje výrobní znalosti a celoživotní vášeň pro vodní sporty – kombinaci, která definuje, jak Aquafarer přistupuje k vývoji produktů.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — zakladatel společnosti Aquafarer
  story:
    - David Chen vyrostl na pobřeží Qingdao, kde moře nebylo destinací pro dovolenou, ale způsobem života. Své mládí strávil jízdou na kajaku, plachtěním a rybařením ve Žlutém moři – zážitky, které mu daly intuitivní pochopení toho, co musí plavidla vydržet.
    - Před založením Aquafarer strávil David deset let v námořní výrobě, pracoval napříč výrobou, kvalitou a mezinárodním obchodem. Řídil OEM programů pro evropské a severoamerické značky, přičemž se z první ruky naučil standardy a očekávání globálních trhů.
    - 'V roce 2012 založil Aquafarer s jednoduchým posláním: postavit nafukovací plavidlo, kterému by svěřil svou vlastní rodinu na vodě. Ten osobní standard – použil bych to? — zůstává konečným testem pro každý výrobek, který opouští továrnu.'
    - Dnes David vede produktovou strategii a dohlíží na tým R&D, osobně kontroluje nové návrhy a testuje prototypy na vodách mimo Qingdao. Věří, že skvělé produkty pocházejí z pochopení techniky i zkušeností.
philosophy:
  tagline: Filozofie značky
  title: Inženýrská svoboda na vodě
  body: Svoboda na vodě není jen o pohybu. Představuje objevování nových míst, vytváření outdoorových zážitků, propojení lidí s přírodou a umožnění profesionálních misí. Inženýrství tuto svobodu umožňuje.
  pillars:
    - title: Spolehlivost na prvním místě
      body: Vodní prostředí vyžaduje důvěru. Aquafarer produktů je navrženo s ohledem na stabilitu, odolnost, bezpečnost a konzistentní výkon.
    - title: Design zaměřený na člověka
      body: Produkty by měly sloužit lidem, ne technologiím. Každé rozhodnutí o designu začíná pochopením toho, jak lidé používají plavidla, kde zkoumají a jakým výzvám čelí.
    - title: Přístupný průzkum
      body: Voda by neměla patřit jen odborníkům. Aquafarer vytváří vybavení, které umožňuje více lidem bezpečně zažít řeky, jezera, oceány a pobřežní prostředí.
    - title: Neustálá inovace
      body: Inovace neznamená pouze vytváření nových produktů. Zlepšuje každý detail – materiály, struktury, výrobu a uživatelskou zkušenost.
engineeringDna:
  tagline: Inženýrská DNA
  title: Jak Aquafarer vytváří produkty
  areas:
    - title: Materiálová věda
      body: Aquafarer se zaměřuje na výběr vhodných materiálů pro různá mořská prostředí. Mezi klíčové aspekty patří odolnost proti oděru, UV odolnost, tlaková stabilita a dlouhodobá životnost.
      items:
        - Odolnost proti oděru
        - UV odolnost
        - Stabilita tlaku
        - Dlouhodobá životnost
    - title: Pozemní inženýrství
      body: Nafukovací plavidla vyžadují přesnou rovnováhu mezi tuhostí, hmotností, přenosností a stabilitou. Aquafarer inženýrství se zaměřuje na optimalizaci těchto faktorů prostřednictvím technologie drop-stitch jádra a pokročilé konstrukce švů.
      items:
        - Tuhost
        - Optimalizace hmotnosti
        - Přenosnost
        - Stabilita
    - title: Výrobní přesnost
      body: 'Každý výrobek prochází řízenými procesy: příprava materiálu, přesné řezání, svařování a lepení, montáž, kontrola kvality a ověřování výkonu.'
      items:
        - Příprava materiálu
        - Přesné řezání
        - Svařování a lepení
        - Montáž a kontrola kvality
    - title: Inženýrství uživatelských scénářů
      body: Produkty jsou vyvíjeny na základě skutečných aplikací – rekreace, dobrodružství a profesionální použití – zajišťující, že každý design splňuje specifické požadavky zamýšleného prostředí.
      items:
        - Rekreace
        - Dobrodružství
        - Profesionální
        - Komerční
trustSignals:
  tagline: Důvěřujte signálům
  title: Proč je Aquafarer spolehlivý partner
  manufacturing:
    title: Výrobní kapacita
    body: Výrobní závod o rozloze 12 000 m² s 200–300 kvalifikovanými pracovníky a více než 14 inženýry výzkumu a vývoje. ISO 9001 certifikovaný systém managementu kvality. Roční produkce 15 000 jednotek nafukovacích plavidel sloužících více než 50 zemím.
    stats:
      - label: Velikost zařízení
        value: 12 000 m²
      - label: Pracovní síla
        value: 200-300
      - label: Inženýři výzkumu a vývoje
        value: 14+
      - label: Roční kapacita
        value: 15 000
  quality:
    title: Závazek kvality
    body: Od inspekce materiálu až po závěrečné testování, Aquafarer udržuje systematické procesy kvality, aby dodávala spolehlivé námořní produkty. Každá jednotka před odesláním prochází tlakovou zkouškou, kontrolou švů a ověřením výkonu.
    items:
      - CE Certifikováno — 64 modelů splňuje evropské bezpečnostní normy
      - ISO 9001:2015 — Certifikován systém managementu kvality
      - UKCA Označeno — Shoda s britským trhem
  global:
    title: Globální přítomnost
    body: Aquafarer slouží zákazníkům na různých globálních trzích, podporuje distributory, outdoorové značky a profesionální námořní uživatele ve více než 50 zemích v Evropě, Asii a Tichomoří, Americe, na Středním východě a v Africe.
comparison:
  tagline: Umístění značky
  title: Aquafarer na trhu
  position: Námořní výrobce zaměřený na inženýrství kombinující odborné znalosti v oblasti nafukovacích plavidel s plnou schopností OEM/ODM, zakázková řešení a hluboké výrobní zkušenosti.
  strengths:
    - Zkušenosti s inženýrstvím nafukovacích plavidel
    - Plná výrobní kapacita OEM/ODM
    - Vývoj a design produktů na zakázku
    - 12 000 m² ISO 9001 certifikovaný výrobní závod
  bestFor:
    - Venkovní rekreační uživatelé, kteří hledají spolehlivé nafukovací vodní skútry
    - Provozovatelé námořní dopravy vyžadující vybavení komerční úrovně
    - Značkoví partneři potřebují OEM/ODM výrobu
    - Profesionální záchranné a hlídkové organizace
