features3_reasons:
  tagline: Proč zvolit Paddle Board Overstock
  title: Sedm důvodů, proč s námi spolupracovat
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Skutečná výroba, ne obchodování
      description: Vlastníme a provozujeme továrnu o rozloze 12 000 m². Když se stanete partnerem Paddle Board Overstock, spolupracujete přímo s lidmi, kteří navrhují, konstruují a vyrábějí vaše produkty – žádní prostředníci.
      icon: tabler:building-factory
    - title: 2. Přístup vedený inženýry
      description: Náš proces návrhu začíná případem použití, nikoli kategorií produktu. Optimalizujeme tvar trupu, výběr materiálu a konfiguraci pro to, jak bude loď skutečně používána.
      icon: tabler:engine
    - title: 3. Certifikovaná kvalita
      description: CE certifikováno, ISO systém jakosti, BSCI vyhovuje, REACH vyhovuje, USCG schváleno. Naše 64 modelů s certifikací CE splňuje mezinárodní standardy – nejen reklamace.
      icon: tabler:certificate
    - title: 4. Flexibilní OEM/ODM
      description: Barvy trubek, rozložení konzoly, značka, balení – přizpůsobíme se vašim specifikacím. Žádný minimální objednávkový tlak. Začněte s prototypem, škálujte s jistotou.
      icon: tabler:adjustments
    - title: 5. Globální logistika
      description: Americký sklad v Kalifornii, přímá doprava od Qingdao, letecká přeprava pro urgentní objednávky. Vyřizujeme celní dokumentaci a dokumentaci.
      icon: tabler:truck-delivery
    - title: 6. Doživotní podpora
      description: Podporujeme lodě, které jsme postavili před 20 lety. Originální náhradní díly, technické poradenství, pokyny k opravám – náš tým je k dispozici, když nás potřebujete.
      icon: tabler:lifebuoy
    - title: 7. Čestné specifikace
      description: Skutečná nosnost, skutečné rozměry, skutečná hmotnost. Žádná marketingová inflace. Zveřejňujeme to, co získáte – ověřeno nezávislým testováním.
      icon: tabler:ruler-measure
testimonials:
  tagline: Důvěra značek po celém světě
  title: Co říkají naši partneři
  items:
    - content: Spolupracovali jsme s několika výrobci v Číně, ale Paddle Board Overstock vyniká svou technickou podporou a konzistentní kvalitou. Berou naši značku jako svou vlastní.
      name: — OEM Partner, evropská značka vodních sportů
    - content: Jejich Hypalon RIB jsou v provozu s naší flotilou více než 5 let. Minimální údržba, výborná UV odolnost. 5letá záruka na trubky nám dává jistotu.
      name: — Operátor flotily, Middle East Resort Group
    - content: Tým Paddle Board Overstock nám pomohl vyvinout vlastní design desky SUP od konceptu až po výrobu za 90 dní. Kvalita předčila naše očekávání.
      name: "— Distributor, vodní sporty v Austrálii"
