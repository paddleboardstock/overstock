features3_cases:
  tagline: Vybrané případy
  title: Vlastní řešení<br />Pro skutečné výzvy
  isBeforeContent: false
  columns: 3
  items:
    - title: Denní aktualizace provozu potápěčského centra na Bali
      customer: Blue Ocean Diving Center
      country: Indonésie
      industry: Komerční potápěčské centrum
      challenge: Blue Ocean Diving Center na Bali provozovalo starší potápěčský člun ze skleněných vláken s omezeným prostorem na palubě, obtížným nastupováním potápěčů a vysokou údržbou v podmínkách tropické mořské vody. Nakládání vybavení bylo přeplněné, příprava byla dlouhá a nestabilní plošina vyvolávala bezpečnostní obavy pro mezinárodní turisty – včetně prvních potápěčů a starších cestovatelů. Středisko pořádá 3-5 potápěčských výletů denně, více než 200 dní v roce.
      solution: Aquafarer dodal zakázkový 6,8m profesionální potápěčský přístroj RIB s rozšířeným uspořádáním paluby optimalizovaným pro uložení potápěčského vybavení, širokým potápěčským žebříkem z nerezové oceli, odolnými Hypalon trubicemi pro odolnost proti UV záření a slané vodě, protiskluzovým povrchem paluby a řešením pro skladování nádrže. Konfigurace byla navržena podle denního pracovního postupu potápěčského centra – nevycházela ze standardního uspořádání rekreačních lodí.
      product: 6,8 m profesionální potápění RIB
      results: Větší pracovní plocha zlepšila efektivitu přípravy zařízení. Potápěči zažili bezpečnější a snadnější nástup. Požadavky na údržbu se výrazně snížily. Středisko získalo kapacitu pro odbavení více zákazníků během hlavní sezóny s větší jistotou. RIB se stalo základem každodenních potápěčských operací.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Naše potápěčská loď není jen doprava. Je to základ našeho každodenního provozu. Aquafarer RIB dává našemu týmu větší jistotu při pořádání několika potápěčských výletů každý den.
      icon: tabler:lifebuoy
    - title: Profesionální upgrade RIB pro potápěčské centrum v Phuketu
      customer: Potápěčské centrum Ocean Explorer
      country: Thajsko
      industry: Komerční potápěčské centrum
      challenge: Potápěčské centrum Ocean Explorer v Phuketu v Thajsku potřebovalo modernizovat tradiční potápěčskou loď ze skelných vláken, která nedokázala držet krok s rostoucí poptávkou zákazníků. Omezený prostor paluby způsobil, že příprava vybavení byla neefektivní. Obtížné nastupování znamenalo bezpečnostní problémy pro mezinárodní turisty. Vysoké nároky na údržbu v podmínkách tropické slané vody zvyšovaly provozní náklady. Středisko provozuje několik denních cest, více než 200 dní v roce.
      solution: Aquafarer dodal přizpůsobené 6,8m komerční potápění RIB s optimalizovaným uspořádáním pracovní plošiny pro skladování akvalungových nádrží, přípravu vybavení a pohyb potápěče. Mezi vlastnosti patří široký potápěčský žebřík s nerezovými madly, robustní trubková konstrukce z materiálů odolných vůči UV záření, protiskluzová podlaha, řešení pro skladování nádrže, profesionální konzole a sedadla pro cestující – vše konfigurované pro komerční potápěčské operace.
      product: 6,8 m komerční potápění RIB
      results: Větší plocha paluby umožnila rychlejší organizaci zařízení a efektivnější každodenní pracovní postup. Komfort a bezpečnost nastupování zákazníků se výrazně zlepšily. Prostoje při údržbě se snížily díky stavbě na námořní úrovni. Potápěčské centrum by mohlo během hlavní sezóny sloužit více zákazníkům a s jistotou rozšířit profesionální potápěčské služby.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Pro potápěčské centrum není loď jen přepravou. Je důležitou součástí našeho každodenního provozu. Aquafarer RIB dává našemu týmu jistotu, že bude každý den podnikat několik potápěčských výletů s lepší bezpečností a efektivitou.
      icon: tabler:lifebuoy
    - title: Flotila evropských potápěčských center
      customer: Potápěčská centra BlueMed
      country: Řecko
      industry: Potápění a námořní turistika
      challenge: Požadovaných 12 potápěčských konfigurovaných RIB pro řetězec potápěčských center na více řeckých ostrovech. Každá loď potřebovala vlastní potápěčský žebřík, zásobník na 8 nádrží a stabilní plošinu pro vstup potápěčů na otevřené vodě. Flotila musela dorazit do 60 dnů na začátek turistické sezóny.
      solution: Vyrobeno 12 RIB 520 ponorných modelů s integrovanými stojany na nádrže, potápěčskými žebříky a extra širokými Hypalon trubkami pro stabilitu nastupování. Každá loď byla označena barvou vozového parku zákazníka. Všech 12 lodí tlakově testováno a odesláno z Qingdao do 55 dnů.
      product: RIB 520 Ponor
      results: Všech 12 lodí dodáno včas na turistickou sezónu. Flotila je v každodenním provozu 18+ měsíců s nulovými poruchami materiálu. Zákazník si v roce 2 objednal 6 dalších jednotek.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 Dive byl páteří našich každodenních potápěčských operací. Stabilita v klidu je vynikající a uspořádání nádrže udržuje palubu čistou a bezpečnou pro naše hosty.
      icon: tabler:lifebuoy
    - title: Australský distributorský program OEM
      customer: Pacific Watersports Pty Ltd
      country: Austrálie
      industry: OEM/ODM Výroba
      challenge: Australský distributor potřeboval řadu desek SUP soukromé značky za konkurenční ceny, aby mohl konkurovat čínským značkám přímo pro spotřebitele. Požadovaných 8 jedinečných modelů od začátečníků až po pokročilé, s vlastní grafikou, vlastním balením a dodáním do maloobchodních prodejen.
      solution: Vyvinuto 8 SUP modelů (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) s exkluzivním australským grafickým balíčkem. Vlastní maloobchodní balení s QR kódy odkazujícími na videa nastavení. Drop-ship logistika nakonfigurovaná od Qingdao přímo do australských maloobchodních prodejen.
      product: Vlastní řada SUP (8 modelů)
      results: Koncepce do první zásilky za 90 dní. Maloobchodní míra prodeje 85 % v první sezóně. Distributor ve druhém roce rozšířil partnerství o řadu nafukovacích člunů.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Společnost Aquafarer dodala kompletní řadu SUP za 90 dní – od počátečního návrhu až po prodejní plochu. Kvalita odpovídá značkám prodávaným za dvojnásobnou cenu.
      icon: tabler:arrows-exchange
    - title: Zásobování záchranných člunů na Středním východě
      customer: Národní úřad civilní obrany
      country: Spojené arabské emiráty
      industry: Vyhledávání a záchrana
      challenge: Organizace civilní obrany potřebovala 20 RIB připravených na hlídkování pro pobřežní pátrání a záchranu, zabezpečení přístavů a ​​reakci na povodně. Požadované samovylévací paluby, kompletní navigační soupravy (GPS, radar, VHF), dobře viditelné oranžové trubice a soulad s místními námořními předpisy.
      solution: Dodáno 20 modelů RIB 450 Patrol se samovysouvacími palubami, navigačními sadami Garmin, LED světlomety, SOLAS reflexní páskou a dobře viditelnými oranžovými Hypalon trubicemi. Každá loď byla CE certifikována a testována podle norem ISO 6185. Balíček dokumentace obsahoval certifikáty shody pro místní registraci.
      product: RIB 450 Hlídka
      results: Flotila rozmístěna přes 5 pobřežních stanic. Lodě byly provozovány v extrémních vedrech (45°C+) bez degradace trubek. Dosah hlídek a palivová účinnost překročily specifikace o 12 %.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450 Patrol překročila naše provozní požadavky. V extrémních tepelných podmínkách nevykazují trubice Hypalon žádné známky degradace UV zářením po 24 měsících každodenního používání.
      icon: tabler:alert-triangle
    - title: Evropské partnerství OEM značek
      customer: North Sea Marine Equipment BV
      country: Nizozemí
      industry: OEM/ODM Výroba
      challenge: Zavedená evropská námořní značka chtěla expandovat na trh RIB bez investic do výrobních zařízení. Potřebovali jsme partnera s bílou značkou, který by byl schopen vyrobit 5 RIB modelů (3,9 až 6,2 m) s privátní značkou, CE certifikací a výhradními distribučními právy v EU.
      solution: Založena dohoda o výrobě bílých štítků pro 5 RIB modelů. Každý model je označen logem zákazníků a barevným schématem. CE certifikační dokumentace připravená pro každý model. Výhradní distribuční práva v EU udělená se závazky minimální objednávky. Technická dokumentace a katalog náhradních dílů pro místní servisní síť.
      product: Vlastní řada RIB (5 modelů)
      results: Podepsána víceletá smlouva. První výrobní série 50 kusů odeslaná do 75 dnů. Značka uvedena na METSTRADE s pozitivním přijetím dealerů.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Práce s Aquafarer nám umožnila vstoupit na trh RIB, aniž bychom museli stavět továrnu – dodali kompletní řešení na klíč s certifikací CE a dokumentací podpory prodejce.
      icon: tabler:building
    - title: Karibská rekreační flotila
      customer: Paradise Island Resorts Ltd
      country: Bahamy
      industry: Mořská turistika a pohostinství
      challenge: 'Luxusní resort potřeboval kompletní flotilu vybavení pro vodní sporty pro aktivity hostů: 40 SUP tabulí pro prohlídky s průvodcem, 20 kajaků pro průzkum laguny, 10 nafukovacích člunů pro přepravu hostů a rybářské výlety, plus příslušenství. Veškeré vybavení vyžadovalo vlastní značku resortu a muselo být dodáno před hlavní turistickou sezónou.'
      solution: 'Vyrobený kompletní balíček pro vodní sporty: 40 SUP prken Voyager (model All-Around), 20 kajaků Explorer, 10 nafukovacích člunů AirDeck 360, plus PFD, pádla, pumpy a opravárenské sady. Veškeré vybavení potištěné logem resortu a tropickým barevným schématem. Kontejnerová zásilka s úplným inventárním seznamem.'
      product: Kompletní balíček vodních sportů (70+ jednotek)
      results: Flotila dorazila 6 týdnů před hlavní sezónou. Skóre spokojenosti hostů s vodními sporty se meziročně zvýšilo o 40 %. Zařízení vydrželo 3 sezóny pouze s běžnou údržbou.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Přístup kompletního balíčku znamenal, že jsme dostali vše, co jsme potřebovali, v jedné zásilce – prkna, kajaky, lodě a příslušenství, vše značkové a připravené k použití pro hosty. Naši hosté milují kvalitu vybavení.
      icon: tabler:beach
    - title: Upgrade RIB pro komerční potápěčské centrum v Queenslandu
      customer: Komerční potápěčské centrum
      country: Austrálie
      industry: Komerční potápění a námořní služby
      challenge: Komerční potápěčské centrum se sídlem v Queenslandu specializující se na inspekci námořní infrastruktury, údržbu přístavů a ​​podvodní opravy provozovalo stárnoucí pracovní člun. Jak poptávka po projektu rostla, staré plavidlo se stalo problémem – častá údržba způsobila narušení plánování, uspořádání nebylo navrženo pro moderní potápěčské operace (omezený prostor pro láhve, nástroje a vybavení) a pohodlí posádky během dlouhých operací bylo špatné. Společnost potřebovala plavidlo, které by mohlo podporovat jejich profesionální operace každý pracovní den.
      solution: Aquafarer provedl podrobnou provozní analýzu potápěčského pracovního postupu zákazníka, typického trvání projektu, velikosti posádky a požadavků na vybavení. Na základě této analýzy Aquafarer dodal přizpůsobený profesionální RIB s funkčním uspořádáním paluby optimalizovaným pro přípravu vybavení a pohyb potápěče, profesionálním sezením pro delší dobu přepravy, zvýšenou stabilitou pro bezpečnější vstup a výstup potápěče a funkcemi podpory potápění integrovanými do designu.
      product: Vlastní profesionální potápění RIB
      results: Nový RIB se stal spolehlivou každodenní pracovní platformou. Příprava zařízení se díky optimalizovanému uspořádání zrychlila. Posádka oznámila zlepšení pohodlí a bezpečnosti během dlouhých operací. Profesionální vzhled lodi posílil důvěru zákazníků při spolupráci s provozovateli přístavů a ​​námořními dodavateli. Potápěčské centrum získalo plavidlo, které odpovídalo profesionalitě jejich služeb.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Potřebovali jsme loď, která by mohla podporovat naše podnikání každý den, nejen plavidlo pro přepravu. Aquafarer s námi spolupracoval na pochopení našich provozních požadavků a dodal RIB řešení, které vyhovuje našemu pracovnímu postupu v oblasti komerčního potápění.
      icon: tabler:lifebuoy
    - title: Smlouva o pobřežní hlídce USA
      customer: Agentura pro bezpečnost pobřeží Atlantiku
      country: Spojené státy
      industry: Námořní bezpečnost a vymáhání práva
      challenge: Americká pobřežní bezpečnostní agentura vyžadovala těžké hlídkové RIB pro operace na otevřené vodě. Potřebná konfigurace se dvěma motory pro redundanci, pancéřová konzola pro ochranu posádky, elektronika pro armádu (šifrovaná komunikace, FLIR, radar) a soulad s předpisy Pobřežní stráže USA.
      solution: Zkonstruovaná hlídka RIB 600 s dvojitou vnější konfigurací 115 HP, pancéřovou konzolou s balistickou ochranou, termovizí FLIR, šifrovanou komunikací VHF/UHF a integrovanými upevňovacími body zbraní. Trup vyztužený pro vysokorychlostní zásahové manévry. Veškerá elektronika integrována a testována ve výrobě. USCG předložena dokumentace shody.
      product: RIB 600 Patrol (dvojitý motor)
      results: Lodě dosáhly maximální rychlosti 52 uzlů během přejímacích zkoušek. Agentura oznámila 95% míru připravenosti na misi za prvních 12 měsíců. Dodatečná objednávka na 8 jednotek.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Dvoumotorový RIB 600 poskytuje našim posádkám rychlost a redundanci požadovanou pro operace na otevřené vodě. Pancéřová konzola poskytuje kritickou ochranu bez kompromisů ve výkonu.
      icon: tabler:shield
