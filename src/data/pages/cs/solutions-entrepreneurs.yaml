testimonial:
  content: Spustil jsem svou značku SUP s nulovými zkušenostmi v oboru. Tým Aquafarer mě provedl od výběru produktu až po vlastní návrh loga a balení. Můj první kontejner dorazil za 11 týdnů a na Amazonu jsem se vyprodal za 3 měsíce. Nyní objednávám svůj třetí kontejner.
  name: Michael Park
  title: Zakladatel Shoreline Paddle Co. — Kalifornie, USA
content_segments:
  tagline: Profily podnikatelů
  title: Zavedení značky vodních sportů<br />Podle typu podnikatele
  subtitle: Různí zakladatelé přicházejí s různými silnými stránkami – odbornými znalostmi v oblasti elektronického obchodování, průmyslovými propojeními, dosahem obsahu nebo distribuční infrastrukturou. Spouštěcí program OEM/ODM přizpůsobíme tak, aby odpovídal vaší výchozí pozici a ambicím růstu.
  items:
    - title: Amazon FBA a prodejci elektronického obchodu
      subtitle: Rychle škálovatelní tvůrci značek řízení daty
      description: Zkušení online prodejci spouštějící produkty pro vodní sporty na Amazonu, Walmartu nebo svých vlastních obchodech Shopify. Víte, jak optimalizovat výpisy, spravovat PPC a číst data kategorií – ale potřebujete výrobního partnera, který rozumí rychlosti elektronického obchodování, návratnosti a sezónním výkyvům poptávky.
      features:
        - Balení připravené pro maloobchodní prodej optimalizované pro limity rozměrů FBA
        - Generování čárových kódů EAN/UPC a dokumentace v souladu s Amazon
        - Nízká MOQ (2–5 jednotek na SKU pro RIB, 5–10 pro SUP) pro testování poptávky před škálováním
        - Konsolidace smíšených kontejnerů pro optimalizaci nákladů na vykládku na jednotku
    - title: Fitness a outdoor influenceři
      subtitle: Tvůrci značek na prvním místě
      description: Tvůrci obsahu, fitness trenéři a outdoorové osobnosti se zaujatým publikem připraveným koupit si značku životního stylu. Přinášíte komunitu a příběh značky – my se staráme o produktové inženýrství, dodržování předpisů, balení a logistiku, takže se můžete soustředit na obsah a konverzi.
      features:
        - 'Rychlý vlastní branding: 2týdenní vzorkový cyklus s logem + barvami'
        - Co-brandované limitované edice a sezónní barevné kapky
        - Podpora lifestylové fotografie a produkce video obsahu
        - 'Plnění přímo spotřebiteli: továrna → expedice zákazníkovi'
    - title: Regionální distributoři míří přímo ke spotřebiteli
      subtitle: B2B operátoři spouštějí vlastní značku
      description: Zavedení distributoři námořního nebo outdoorového vybavení, kteří chtějí uvést na trh svou vlastní značku vedle produktů třetích stran nebo místo jejich dalšího prodeje. Již máte skladovou infrastrukturu, logistické vztahy a zákaznickou základnu – potřebujete továrního partnera, který dokáže dodávat kvalitu soukromých značek ve velkém měřítku.
      features:
        - Exkluzivní návrhy produktů pro vaše tržní území
        - Kompletní vývoj forem OEM pro vlastní tvary a specifikace
        - Lokalizovaná dokumentace shody (CE, UKCA, USCG) pro váš region
        - 'Co-brandové balení: značka distributora + značka kvality Aquafarer'
    - title: První zakladatelé značky
      subtitle: Řízené komplexní vytváření značky
      description: Vášniví podnikatelé s nulovými zkušenostmi v oboru vodních sportů, kteří chtějí vybudovat značku od nuly. Potřebujete partnera, který vás drží za ruku v každé fázi – od výběru produktu a pojmenování až po obalový design a logistiku prvního kontejneru – s jasnými časovými osami a transparentními cenami.
      features:
        - Poradenský výběr produktů z více než 50 osvědčených základních návrhů
        - 'Balíček identity značky: pojmenování, logo, barevná paleta, design obalu'
        - 60–90denní lhůta od konceptu po první zásilku
        - Specializovaný projektový manažer pro začínající vlastníky značky
