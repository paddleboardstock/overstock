features3_certifications:
  title: Certifikace a shoda
  subtitle: Každý produkt je nezávisle testován; 64 modelů má certifikaci CE podle mezinárodních standardů.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Certifikace
      description: 64 modelů s certifikací CE v kategoriích SUP, kajaky, čluny a RIB splňuje evropský bezpečnostní standard CE pro rekreační plavidla. Každý produkt prochází před opuštěním továrny tlakovými, vztlakovými a zátěžovými zkouškami.
      icon: tabler:certificate
    - title: ''
      description: Naše zařízení o rozloze 12 000 m² Qingdao funguje v rámci systému řízení kvality ISO 9001. Každá výrobní šarže je sledovatelná, dokumentovaná a kontrolovaná.
      icon: tabler:clipboard-check
    - title: Sociální soulad BSCI
      description: Máme certifikaci BSCI, která zajišťuje etické pracovní postupy, bezpečné pracovní podmínky a odpovědnost vůči životnímu prostředí v celém našem dodavatelském řetězci.
      icon: tabler:users
    - title: REACH & RoHS
      description: Všechny materiály — PVC, Hypalon, EVA pěna, lepidla — splňují předpisy EU REACH a RoHS. Žádné omezené látky, žádné kompromisy.
      icon: tabler:flask
    - title: Laboratoř pro testování materiálů
      description: Vlastní laboratoř materiálů testuje pevnost v tahu, odolnost vůči UV záření, integritu švů a otěr pro každou šarži tkaniny před výrobou.
      icon: tabler:microscope
    - title: 5letá záruka na loď
      description: Na čluny Aquafarer se vztahuje 5letá omezená záruka na tkaninu trubek, švy a trup. SUP desky a příslušenství mají 2letou záruku. Stojíme si za tím, co budujeme.
      icon: tabler:shield-check
testimonials:
  tagline: Důvěra zákazníků
  title: Co říkají naši zákazníci
  subtitle: Od začínajících vodáků po profesionální provozovatele vozového parku – podívejte se, proč důvěřují Aquafarer.
  items:
    - content: Vybavili jsme celou naši flotilu půjčoven Aquafarer RIB – 12 lodí na třech místech. Dvě sezóny za sebou, nula neúspěchů. Certifikační dokumentace CE zajistila bezproblémové schvalování pojištění. Jejich inženýrský tým dokonce přizpůsobil barvy trubek tak, aby odpovídaly naší značce.
      name: Marco Valenti
      title: Provozní ředitel, Adriatic Adventure Tours — Dubrovník, Chorvatsko
    - content: Jako první kupující jsem byl nervózní z kvalitního objednání ze zámoří. Dokumentace ISO a zprávy o testech třetích stran, které sdíleli, než jsem se jich zeptal, mi poskytly naprostou důvěru. Deska dorazila za 6 dní a předčila má očekávání.
      name: James Thornton
      title: SUP Majitel Explorer 11 — Vancouver, Kanada
    - content: V naší pobřežní hlídkové flotile provozujeme 24 Aquafarer RIB. Jejich proces kontroly kvality je konzistentní u každé šarže – stejná kvalita švu, stejné umístění ventilu, pokaždé stejný tlak. Tato opakovatelnost je důležitá, když život závisí na zařízení.
      name: Velitel Andres Reyes
      title: Úředník pro námořní zakázky, pomocná jednotka filipínské pobřežní stráže – Manila, Filipíny
features3_lab:
  title: Laboratoř interního testování a kvality
  subtitle: Každá šarže materiálu a hotový výrobek před odesláním prochází naší zkušební laboratoří na místě.
  columns: 3
  isBeforeContent: true
  items:
    - title: Testování pevnosti v tahu
      description: 'Každá PVC role látky je testována podle norem ASTM D751. Minimální požadavek: 350 N/cm osnova a útek. Odmítnuté šarže se vrací dodavateli — odmítáme přibližně 3 % došlých materiálů.'
      icon: tabler:scale
    - title: UV zrychlené stárnutí
      description: Vzorky látek podléhají 1000 hodinovému QUV zrychlenému zvětrávání (ASTM G154). Zachování pevnosti v tahu musí po vystavení UV záření překročit 80 %. Produkty hodnocené na 3+ roky venkovního použití.
      icon: tabler:sun
    - title: Síla odlupování švů
      description: RF svarové švy testovány při minimální pevnosti v odlupování 5 N/mm (ASTM D751). Ručně lepené Hypalon švy testované na 3,5 N/mm. Každá výrobní šarže má vzorky švů destruktivně testovány a archivovány.
      icon: tabler:stack
    - title: Udržení tlaku 24–48 hodin
      description: 'Každý nafukovací výrobek se nafoukl na 1,25x jmenovitý PSI a monitoroval se po dobu 24–48 hodin. Maximální povolený pokles tlaku: 5 %. Produkty, které v tomto testu neprojdou, jsou před odesláním přepracovány a znovu testovány.'
      icon: tabler:wind
    - title: Testování cyklu ventilů
      description: Každá konstrukce ventilu prochází v naší laboratoři 10 000 cykly otevření-zavření. Ventily musí po cyklování udržovat vzduchotěsné těsnění při 1,25násobku jmenovitého tlaku. Všechny Aquafarer ventily jsou dimenzovány na 5+ let pravidelného používání.
      icon: tabler:rotate
    - title: Odolnost proti praskání za studena
      description: Materiály testovány při -30°C po dobu 4 hodin na ISO 4646. Není povoleno žádné praskání nebo křehnutí. Výrobky určené pro zimní skladování a použití ve studené vodě do okolní teploty -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Jak zajišťujeme kvalitu
  subtitle: Od kontroly surovin až po závěrečné tlakové zkoušky – každý produkt prochází přísným řetězcem kvality.
  items:
    - title: Kontrola surovin
      description: Každá role tkaniny PVC je před uvedením do výroby testována na tloušťku, pevnost v tahu a odolnost vůči UV záření.
      icon: tabler:search
    - title: Průběžná kontrola kvality
      description: Během montáže se na každé stanici kontrolují svary, instalace ventilů a spoje komor.
      icon: tabler:eye
    - title: Tlakové zkoušky
      description: Každý nafukovací výrobek je nafouknut na 1,25x jmenovitý PSI a držen po dobu 24–48 hodin, aby se ověřilo zadržování vzduchu a integrita švů.
      icon: tabler:wind
    - title: Závěrečná kontrola
      description: Každá jednotka je před schválením k odeslání zkontrolována na povrchovou úpravu, hardware a balení. Dávkové vzorky putují do naší laboratoře k destruktivnímu testování.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Časté dotazy o lodích
  subtitle: Časté dotazy týkající se našich nafukovacích člunů s pevným trupem.
  columns: 2
  items:
    - title: Jaké velikosti RIB lodí nabízí Aquafarer?
      description: Nabízíme 35 modelů RIB v rozsahu od 2,5 m do 7,6 m, které pokrývají vše od kompaktních tendrů až po těžká komerční a hlídková plavidla. Každý model je k dispozici s více možnostmi konfigurace.
    - title: Jaký je rozdíl mezi RIB a tradičním nafukovacím člunem?
      description: Nafukovací člun RIB (pevný trup) kombinuje pevný trup deep-V ze sklolaminátu nebo hliníku s nafukovacími trubkami Hypalon nebo PVC. Tím získáte stabilitu a nosnost tvrdého člunu s tlumením nárazů a nadnášením nafukovacího člunu.
    - title: Jaké motory jsou kompatibilní s Aquafarer RIB?
      description: Naše RIB podporují přívěsné motory od 3 HP do 250 HP v závislosti na modelu. Na každé stránce produktu je uveden maximální jmenovitý výkon motoru. Ideální shodu doporučujeme konzultovat s vaším prodejcem.
    - title: Je certifikováno Aquafarer RIB CE?
      description: Ano. Všechny rekreační modely RIB jsou certifikovány CE podle platných evropských norem pro rekreační plavidla. Komerční a hlídkové modely splňují dodatečné požadavky na stabilitu a zatížení.
    - title: Jaká je záruka na lodě RIB?
      description: Všechny Aquafarer RIB přicházejí s 5letou omezenou zárukou na tkaninu trubky, švy a trup; nafukovací ventily kryté na 5 let; příslušenství instalované ve výrobě kryté po dobu 1 roku.
    - title: Kolik vzduchových komor má Aquafarer RIB?
      description: Naše RIB mají 3 až 7 nezávislých vzduchových komor v závislosti na délce modelu. Tato vícekomorová konstrukce zajišťuje, že loď zůstane na hladině, i když je jedna komora ohrožena.
faqs_inflatable:
  title: Časté dotazy k nafukovacím člunům
  subtitle: Časté dotazy týkající se našich nafukovacích člunů, kajaků a člunů.
  columns: 2
  items:
    - title: Jaké materiály se používají v nafukovacích člunech Aquafarer?
      description: V závislosti na modelu používáme vojenskou gumu PVC (1100 denier) a prémiovou gumu Hypalon/CSM. Oba materiály jsou UV stabilizované, odolné proti oděru a vyhovují předpisům EU REACH a RoHS.
    - title: Jak dlouho vydrží nafukovací čluny?
      description: Při správné péči vydrží kvalitní nafukovací člun PVC 7–10 let, zatímco modely Hypalon vydrží 15–20 let. Pravidelné čištění, UV ochrana a správné skladování výrazně prodlužují životnost.
    - title: Jakou údržbu vyžaduje nafukovací člun?
      description: Základní údržba zahrnuje opláchnutí sladkou vodou po každém použití (zejména ve slané vodě), vysušení před uskladněním, každoroční kontrolu těsnění ventilů a aplikaci UV ochrany na trubky. Vyhněte se dlouhodobému pobytu na slunci, když se nepoužívá.
    - title: Lze nafukovací čluny používat ve slané vodě?
      description: Ano. Všechny nafukovací čluny Aquafarer jsou určeny pro sladkovodní i slanou vodu. Po vystavení slané vodě doporučujeme opláchnout sladkou vodou a důkladně osušit, aby se zabránilo korozi lícování a krystalizaci solí na tkaninách.
    - title: Jak uložím nafukovací člun?
      description: Před uskladněním člun úplně vypusťte, vyčistěte a vysušte. Volně rolujte (vyhněte se těsným záhybům), skladujte na chladném suchém místě mimo dosah přímého slunečního záření a chraňte betonové podlahy, aby se zabránilo pronikání vlhkosti.
    - title: Jaká je nosnost nafukovacích člunů Aquafarer?
      description: Nosnosti se pohybují od 290 kg pro naše nejmenší modely až po více než 2000 kg pro větší komerční plavidla. Na každé stránce produktu je uvedena maximální nosnost pro váš konkrétní model.
faqs_sup:
  title: SUP Nejčastější dotazy ohledně rady
  subtitle: Časté dotazy ohledně našich stojacích paddle boardů.
  columns: 2
  items:
    - title: Jaké velikosti SUP desek jsou k dispozici?
      description: Nabízíme SUP prkna od 9 stop do 12 stop, včetně všestranných, turistických, jógových a speciálních designů. Mezi naše nejprodávanější modely patří Tropical Breeze (10 stop) a Ocean Voyager (11 stop).
    - title: Co je to drop-stitch konstrukce?
      description: Konstrukce drop-stitch využívá tisíce polyesterových nití spojujících horní a spodní vrstvu desky, což umožňuje udržet vysoký tlak vzduchu (15–20 PSI) a dosáhnout tuhé a stabilní platformy. Toto je průmyslový standard pro prémiové nafukovací SUP.
    - title: Jaký je hmotnostní limit pro SUP desek?
      description: Naše desky SUP udrží až 150 kg v závislosti na modelu a objemu. Prkno Leviathan Wake je náš model s nejvyšší kapacitou, určený pro větší jezdce a použití jógy.
    - title: Nabízíte kompletní balíčky SUP?
      description: Ano. Každá paluba SUP se dodává s kompletním balením včetně 3dílného hliníkového pádla, vysokotlaké ruční pumpy, vodítka na cívku, cestovního batohu a sady na opravu. Některé modely obsahují také odnímatelnou sadu ploutví.
    - title: Jaká je záruka na desky SUP?
      description: Všechny desky Aquafarer SUP mají 2letou záruku na výrobní vady, včetně selhání švů, vad ventilů a delaminace materiálu při normálním používání.
    - title: Jak dlouho trvá nafouknutí prkna SUP?
      description: Pomocí přiložené ruční pumpy trvá plné nafouknutí na 15 PSI přibližně 8–12 minut. Pro rychlejší nafouknutí doporučujeme naši Aquafarer 12V elektrickou pumpu, která nafoukne prkno za méně než 4 minuty.
