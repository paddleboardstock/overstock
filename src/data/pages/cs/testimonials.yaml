testimonials:
  - category: kluby
    name: Ricardo Santos
    title: Majitel, Algarve Surf Academy
    location: Lagos, Portugal
    content: Začali jsme s Club Starter Package pro naši školu surfování. 20 desek, pádla, vesty — vše dorazilo do 3 týdnů. Po dvou sezónách jsme upgradovali na balíček Pro. Vlastní značka s naším logem změnila naši profesionální image.
    rating: 5
    product: Klubový startovací balíček
    source: solutions/clubs
  - category: kluby
    name: Majitel klubu
    title: Klub vodních sportů
    location: Phuket, Thailand
    content: Club Starter Package byl perfektním vstupním bodem. Jak naše podnikání rostlo, Aquafarer rostlo s námi – stejná kvalita, stejné ceny, žádná překvapení. Změnili jsme od 10 do 80 desek za 18 měsíců.
    rating: 5
    product: Klubový startér + prémiový balíček
    source: success-stories
  - category: letoviska
    name: Generální ředitel resortu
    title: 5hvězdičkový plážový resort
    location: Řecko
    content: Aquafarer nejenom dodali nástěnky – pomohli nám vytvořit kompletní zážitek pro hosty. Náš program vodních sportů se během jedné sezóny posunul od nuly k vrcholnému středisku. Více než 300 týdenních rezervací a roční tržby 180 tisíc dolarů.
    rating: 5
    product: Resort Premium balíček
    source: success-stories
  - category: letoviska
    name: Sophie Laurentová
    title: Ředitel pro zkušenosti hostů, Azure Bay Resorts
    location: Phuket, Thailand
    content: Aquafarer navrhl a vybavil celý náš program plážových aktivit ve třech resortech. 80 SUP, 40 kajaků, bezpečnostní infrastruktura a školení personálu – vše dodáno v jedné zásilce. Účast hostů se v první sezóně zvýšila o 60 %.
    rating: 5
    product: Resort Premium balíček
    source: solutions/resorts
  - category: podnikatelé
    name: Michael Park
    title: Zakladatel Shoreline Paddle Co.
    location: Kalifornie, USA
    content: Spustil jsem svou značku SUP s nulovými zkušenostmi v oboru. Tým Aquafarer mě provedl od výběru produktu až po vlastní návrh loga a balení. Můj první kontejner dorazil za 11 týdnů a na Amazonu jsem se vyprodal za 3 měsíce.
    rating: 5
    product: Základní spuštění značky
    source: solutions/entrepreneurs
  - category: podnikatelé
    name: Zakladatel
    title: Australská značka SUP
    location: Austrálie
    content: Měl jsem nápad na značku, ale nulové výrobní znalosti. Aquafarer mě doslova držel za ruku během celého procesu – od výběru správného designu desky až po rozbalení mé první zásilky. 90 dní od snu po doručení.
    rating: 5
    product: Spouštěcí balíček značky
    source: success-stories
  - category: pronájem
    name: Daniel Okonkwo
    title: Majitel, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Pronajal jsem si 5 desek z místního obchodu a přišel jsem o 60 % svých příjmů. Aquafarer mi pomohlo vybudovat vlastní flotilu 15 SUP. Kalkulátor návratnosti investic ukázal hranici rentability za 4 měsíce — trvalo to 3. Nyní se rozšiřuji na 30 desek.
    rating: 5
    product: Startovací sada flotily
    source: solutions/rental-business
  - category: pronájem
    name: Marco Valenti
    title: Provozní ředitel, Adriatic Adventure Tours
    location: Dubrovník, Chorvatsko
    content: Vybavili jsme celou naši flotilu půjčoven Aquafarer RIB – 12 lodí na třech místech. Dvě sezóny za sebou, nula neúspěchů. Certifikační dokumentace CE zajistila bezproblémové schvalování pojištění. Jejich inženýrský tým dokonce přizpůsobil barvy trubek.
    rating: 5
    product: Sada pro rozšíření vozového parku
    source: trust
  - category: pronájem
    name: Velitel Andres Reyes
    title: Důstojník pro námořní zakázky, pomocná jednotka filipínské pobřežní stráže
    location: Manila, Filipíny
    content: V naší pobřežní hlídkové flotile provozujeme 24 Aquafarer RIB. Jejich proces kontroly kvality je konzistentní u každé šarže – stejná kvalita švu, stejné umístění ventilu, pokaždé stejný tlak. Tato opakovatelnost je důležitá, když život závisí na zařízení.
    rating: 5
    product: RIB Hlídková flotila
    source: trust
  - category: spotřebitelů
    name: Sarah K.
    title: První majitel SUP
    location: Lake Tahoe, USA
    content: Stabilní i pro úplného začátečníka. První den jsem to vzal na jezero a nikdy jsem nespadl. Kompletní balení s pumpičkou a pádlem znamenalo, že jsem byl na vodě 20 minut po otevření krabice.
    rating: 5
    product: SUP Explorer 11
  - category: spotřebitelů
    name: James Thornton
    title: SUP Vlastník Explorer 11
    location: Vancouver, Kanada
    content: Jako první kupující jsem byl nervózní z kvalitního objednání ze zámoří. Dokumentace ISO a zprávy o testech třetích stran, které sdíleli, než jsem se jich zeptal, mi poskytly naprostou důvěru. Deska dorazila za 6 dní a předčila má očekávání.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: spotřebitelů
    name: Mike R.
    title: Rekreační kajakář
    location: Florida, USA
    content: Solidní kvalita sestavení. Zvládá pobřežní kotletu mnohem lépe, než jsem očekával od nafukovačky. Zabalil jsem ho do kufru auta na víkendový výlet – nafouknutý u rampy za méně než 4 minuty.
    rating: 5
    product: Nafukovací kajak
