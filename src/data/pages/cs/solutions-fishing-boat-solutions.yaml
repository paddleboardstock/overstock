content_challenge:
  tagline: Výzva
  title: Rybářské lodě potřebují<br />stabilitu, dosah a odolnost
  subtitle: Ať už provozujete komerční rybářská plavidla, řídíte družstevní flotilu nebo provozujete rybářské chartery – vaše loď musí každý den spolehlivě fungovat.
  paragraphs:
    - Rybářské lodě potřebují stabilní plošiny pro pracovní šňůry, manipulaci s úlovkem a bezpečný pohyb po palubě. Nafukovací čluny a RIB nabízejí vlastní stabilitu díky své trubkové konstrukci – významná výhoda oproti tuhým trupům podobné délky.
    - Spotřeba paliva je důležitá pro rybolovné operace, kde provozní náklady přímo ovlivňují ziskovost. RIB a nafukovací čluny jsou lehčí než ekvivalentní pevné čluny, vyžadují méně energie a spalují méně paliva – což je zásadní pro komerční provozovatele provozující čluny denně a družstva spravující rozpočty flotily.
    - Odolnost v mořském prostředí je zásadní. Slaná voda, UV záření a neustálé používání vyžadují materiály, které vydrží drsné podmínky bez degradace. Pro komerční a družstevní provozovatele spolehlivost přímo ovlivňuje příjem – rozbitá loď znamená ztracené dny rybolovu.
    - Aquafarer rybářské konfigurace zahrnují držáky prutů, hledače ryb, jímky s návnadou, živou šachtu a řešení pro manipulaci s nákladem navržená pro seriózní rybářské aplikace v komerčních, družstevních a rekreačních provozech.
content_solution:
  tagline: Naše řešení
  title: Konfigurace připravené k rybolovu
  subtitle: Každá rybářská loď Aquafarer může být nakonfigurována pro vaši konkrétní rybářskou aplikaci.
  list:
    - Montáž držáku tyče – instalovaná ve výrobě nebo připravená pro instalaci na trhu
    - Montážní deska Fishfinder/GPS na pozici konzoly
    - Možnosti návnady nebo livewell pro charterové a komerční provozovatele
    - Konfigurace chladiče/úložiště pro manipulaci s úlovky
    - Trup Deep-V pro offshore schopnosti — stabilní v klidu, hladký při rychlosti
    - Možnosti trubice PVC nebo Hypalon — Hypalon pro prodloužené vystavení UV záření
    - Rozsah přívěsného motoru od 15 HP do 115 HP v závislosti na modelu a aplikaci
content_segments:
  tagline: Rybářské profily
  title: Řešení nafukovacích rybářských člunů<br />Podle typu provozovatele
  subtitle: Od pobřežního sportovního rybolovu po komerční lov na dlouhou lovnou šňůru – různé rybolovné operace vyžadují různé konfigurace trupu, výkonové rozsahy a nastavení na palubě. Každou loď přizpůsobujeme tak, aby odpovídala lovišti, vodám a pracovnímu stylu.
  items:
    - title: Komerční rybářské společnosti
      subtitle: Fleetové pracovní čluny pro každodenní rybolov, manipulaci se sítí, přepravu úlovků
      description: Komerční rybářské společnosti provozují pracovní čluny pro nasazování a vytahování sítí, obsluhu pastí, lov na dlouhé šňůry a přepravu úlovků. Tyto čluny pracují každý den v prostředí se slanou vodou a musí vydržet velké zatížení, neustálou manipulaci s palubou a dlouhou provozní dobu. Pro ziskovost vozového parku je rozhodující spotřeba paliva a nenáročná údržba. Plavidlo musí poskytovat stabilní pracovní plošiny pro posádku manipulující s výstrojí a úlovkem v různých podmínkách na moři.
      features:
        - Ploché uspořádání paluby pro manipulaci se sítí, stohování pastí a skladování ryb
        - Přívěsný motor s nízkou spotřebou paliva 40-115 HP pro nízké denní provozní náklady
        - Odolné trubky Hypalon pro odolnost proti oděru při každodenním používání
        - Zesílené třecí lišty pro častý kontakt s dokem a plavidlem
        - Samovysouvací paluba pro snadné umytí po operacích
        - Ceny vozového parku a konzistentní specifikace pro provozovatele více plavidel
    - title: Provozovatelé charterového rybolovu
      subtitle: Komfort pro více cestujících, ovladatelnost, bezpečnostní certifikace
      description: Provozovatelé provozující půldenní a celodenní rybolovné charty – od pobřežního útesového rybolovu po pobřežní rybolov při dně. Vaše loď potřebuje sedadla pro pasažéry s bezpečnostními certifikacemi, dostatek prostoru na palubě pro více rybářů a integrované živáky pro udržení čerstvé návnady a úlovku po celou dobu plavby. Pohodlí hostů přímo ovlivňuje recenze cest, opakované rezervace a online hodnocení.
      features:
        - Konzolové řízení se sedadly tlumícími nárazy
        - Držáky prutů instalované ve výrobě (4–8 pozic)
        - 60–115 HP vnější dosah pro cestovní rychlosti na moři
        - CE Certifikace kategorie C nebo B pro komerční provoz cestujících
        - Bimini nebo sluneční clona T-top pro pohodlí hostů na delších cestách
    - title: Řemeslní a drobní komerční rybáři
      subtitle: Spolehlivé pracovní lodě pro každodenní život
      description: Nezávislí rybáři, kteří spoléhají na svou loď jako na svůj primární zdroj příjmu – nastavování sítí, ošetřování rybích pastí nebo manipulace s vlasci u břehu. Vaší prioritou je úspora paliva, jednoduchá údržba, kterou zvládnete sami, a loď, která zvládá středně velké množství úlovků a vybavení, aniž by obětovala stabilitu.
      features:
        - Spotřeba paliva 15–40 HP přívěsný motor pro nízké provozní náklady
        - Hypalon CSM trubice pro zvýšenou odolnost vůči UV záření a otěru
        - Ploché uspořádání paluby pro manipulaci se sítí a skladování ryb
        - Snadné přistání na pláž s nafukovací ochranou kýlu
    - title: Rybářská družstva
      subtitle: Sběr úlovků, doprava členů, distribuce zásob
      description: Rybářská družstva provozují komunitní flotily pro sběr úlovků od členských rybářů, přepravu zásob do vzdálených rybářských komunit a distribuci úrody na trhy. Tyto pracovní lodě vyžadují vysokou nosnost, spolehlivý každodenní provoz a snadnou údržbu na odlehlých místech. Družstva často působí v rozvojových regionech, kde je dostupnost dílů a přístup k službám omezený, a proto jsou jednoduché vnější konfigurace a odolná konstrukce zásadní.
      features:
        - Vysoká nosnost pro tažení úlovků a zásob
        - Jednoduchá konfigurace přívěsného motoru pro snadný servis na místě
        - Těžká konstrukce PVC nebo Hypalon pro flexibilitu rozpočtu
        - Plochá paluba s upevňovacími body pro zajištění nákladu
        - Energeticky úsporný provoz minimalizující kooperativní provozní náklady
    - title: Nadšenci sportovního a herního rybolovu
      subtitle: Výkon a styl pro seriózní rybáře
      description: Zkušení rybáři, kteří hledají schopnou rybářskou platformu, která přináší rychlost na vzdálená místa, stabilní bojové pozice vestoje a prvotřídní tvar a konečnou úpravu. Loď se musí cítit jako doma, ať už běží dvě míle od pobřeží k útesu nebo prozkoumává vzdálené stojaté vody v ústí řek.
      features:
        - Trup Deep-V RIB pro hladkou jízdu v řezu
        - Fishfinder/GPS montážní deska předem zapojená na konzole
        - Baitwell a chladič integrované do modulu zadního sedadla
        - Vlastní barevné možnosti paluby EVA odpovídající grafice lodi/tubusu
    - title: Rybářský průvodce a provozovatelé ekologických výletů
      subtitle: Rybářské zážitky s průvodcem pro rybáře na návštěvě
      description: Průvodci, kteří vezmou malé skupiny navštěvujících rybářů na produktivní rybářská místa – často kombinující rybolov s prvky ekoturistiky, jako je pozorování ptáků nebo průzkum mangrovů. Loď musí jezdit suchá a pohodlná pro hosty, kteří nejsou zvyklí na malé lodě, se snadným nastupováním a možností stínu.
      features:
        - Horní část Bimini nebo montážní body T-top instalované ve výrobě
        - Nástupní žebřík s hladkým nástupem pro snadné opětovné nastupování
        - Tichý 4taktní přívěsný motor pro minimalizaci rušení
        - Suché úložné prostory pro telefony hostů, peněženky, fotoaparáty
