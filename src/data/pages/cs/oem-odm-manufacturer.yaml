breadcrumb: OEM/ODM Výrobce
tldr:
  summary: Aquafarer je přímo z továrny výrobce OEM/ODM. 12 000 m² ISO 9001:2015 zařízení, 15 000 jednotek ročně, shoda CE/BSCI/REACH/UKCA, nízké MOQ od 2-10 jednotek.
  points:
    - 12 000 m² ISO 9001:2015 certifikované Qingdao zařízení
    - 15 000 jednotek ročně s 200-300 kvalifikovanými pracovníky
    - CE 2013/53/EU, UKCA, BSCI, REACH soulad
    - 'Nízké MOQ: 2–5 jednotek (RIB), 5–10 jednotek (SUP) pro standardní modely'
    - 50+ exportních zemí s přepravou FOB Qingdao
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 Certifikováno
      desc: Systém řízení kvality auditovaný společností SGS na všech výrobních linkách.
      variant: cert
    - icon: ⭐
      title: Vyhovuje CE & UKCA
      desc: Plná shoda s požadavky na značení EU 2013/53/EU a Spojeného království.
      variant: cert
    - icon: ⭐
      title: BSCI Sociální audit
      desc: Ověřené etické pracovní postupy a normy na pracovišti.
      variant: standard
    - icon: ⭐
      title: Nízké MOQ od 2 jednotek
      desc: 'Standardní modely RIB od 2-5 jednotek, SUP od 5-10 jednotek. Vlastní forma: 200+.'
      variant: standard
process_section:
  eyebrow: Náš proces
  title: Kompletní proces OEM/ODM
  subtitle: Od stručného návrhu po naložení kontejneru – šest kroků k vašemu nafukovacímu plavidlu soukromé značky.
  steps:
    - step: '01'
      title: Specifikace & Stručný návrh
      desc: Sdílejte své cílové specifikace, výkresy CAD nebo referenční produkt. Náš technický tým před cenovou nabídkou zkontroluje materiály, rozměry a požadavky na shodu (CE, BSCI).
    - step: '02'
      title: 3D prototypování forem
      desc: Navrhujeme a vyrábíme zakázkové formy na CNC strojích pro SUP prkna, trupy kajaků a RIB komponenty. Vzorky prototypů vyrobené během 15–20 pracovních dnů pro vaše schválení.
    - step: '03'
      title: Výběr materiálu a výroba vzorků
      desc: Vyberte si z vojenských materiálů PVC (0,9 mm–1,2 mm), Hypalon CSM nebo jádrových tkanin s kapkovým stehem. Vyrábíme předprodukční vzorky s barvami vaší značky, logem a balením pro odhlášení.
    - step: '04'
      title: CE Tovární audit a dodržování předpisů
      desc: Každá OEM objednávka obsahuje dokumentaci o shodě — CE prohlášení o shodě, ISO 9001 záznamů sledovatelnosti, BSCI zprávu o sociální shodě a REACH prohlášení o materiálu.
    - step: '05'
      title: Hromadná výroba a inline kontrola kvality
      desc: Výrobní série se řídí naším 100bodovým kontrolním seznamem kvality. Každá jednotka prochází 24hodinovým testem udržení tlaku, testováním odlupování švů a vizuální kontrolou před zabalením.
    - step: '06'
      title: FOB Qingdao Logistika a doprava
      desc: Hotové zboží je paletováno, zabaleno do smršťovací fólie a naloženo do kontejneru v přístavu Qingdao. Zpracováváme veškerou exportní dokumentaci, celní odbavení a poskytujeme sledování zásilek v reálném čase.
capabilities_section:
  eyebrow: Výrobní schopnosti
  title: Co stavíme
  subtitle: Šest hlavních produkčních schopností pro globální B2B partnery.
  items:
    - title: Drop-Stitch SUP Výroba desek
      desc: Laminace jádra po celé délce drop-stitch pro pevné, vysokotlaké (15–20 PSI) stojací paddleboardy. Vlastní délka, šířka, tloušťka, profil kolébky a grafický design.
    - title: PVC Výroba nafukovacích člunů
      desc: Vysokofrekvenčně svařované PVC čluny, tendry a sportovní čluny. Více konfigurací komor, možnosti podlahy (lamely, vzduchová deska, rolovací) a integrace příslušenství.
    - title: Hypalon RIB Výroba lodí
      desc: Trubky komerční třídy Hypalon CSM spojené se sklolaminátovým nebo hliníkovým deep-V trupem. Délka 3,3 m až 6,0 m pro hlídkové, záchranné, turistické a potápěčské operace.
    - title: Private Label a vlastní branding
      desc: 'Kompletní služby privátních značek: vlastní logo přenos tepla nebo sítotisk, značkové obaly (maloobchodní krabice, tašky), uživatelské příručky ve vašem jazyce a registrace čárových kódů/UPC.'
    - title: Vlastní návrh forem a nástrojů
      desc: Vlastní tým inženýrů 3D CAD/CAM. Navrhujeme a vyrábíme na zakázku hliníkové a kompozitní formy pro jedinečné tvary trupu, konfigurace palub a montážní body příslušenství.
    - title: OEM Příslušenství a výstroj
      desc: Záchranné vesty (CE 12402), pumpy s dvojím účinkem, uhlíková/nylonová pádla, opravárenské sady, tašky na přenášení a sestavy vodítek. Kompletní sada a balení pro maloobchodní prezentaci.
experience_section:
  eyebrow: Zkušenosti ze skutečného světa
  title: Partnerství, která vybudovala značky
  subtitle: Skutečné příběhy značek a organizací, které uzavřely partnerství s Aquafarer pro výrobu OEM/ODM.
  stories:
    - quote: Do Aquafarer jsme došli s náčrtem na ubrousku a seznamem požadavků. O osm měsíců později jsme měli produkt připravený k výrobě, který na první pokus prošel certifikací CE.
      narrative: Evropský startup s neotřelým designem SUP oslovil společnost Aquafarer pro výrobu ODM. Výzkumný a vývojový tým Aquafarer prošel konceptem pomocí CAD designu, FEA strukturální analýzy, hydrodynamické simulace, tvorby forem, výroby prototypů a výrobních nástrojů. Zakladatel startupu navštívil Qingdao během procesu třikrát. Konečný produkt prošel certifikací CE bez jakýchkoliv úprav – výsledek zakladatel připisuje technickému týmu společnosti Aquafarer, který od začátku rozumí evropským regulačním požadavkům.
      context: Uvedení evropské značky SUP, 2023-2024
      source: Zakladatel značky
    - quote: Úroveň ochrany NDA a zabezpečení IP na Aquafarer nám dává jistotu, že můžeme sdílet naše proprietární návrhy. Zacházejí s naší IP, jako by byla jejich vlastní.
      narrative: Americká společnost zabývající se námořním vybavením s vlastní technologií ventilů potřebovala výrobního partnera, který by dokázal chránit jejich IP při výrobě ve velkém. Po auditu pěti čínských výrobců vybrali Aquafarer na základě továrních protokolů ochrany IP, bezpečného zacházení se soubory návrhu a ochoty podepsat přísné smlouvy NDA. Partnerství vytvořilo během čtyř let tři produktové řady s nulovými IP incidenty.
      context: Americká společnost pro námořní vybavení, partnerství OEM od roku 2021
      source: VP provozu
