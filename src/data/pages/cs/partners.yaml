hero:
  tagline: Partneři a distribuce
  title: Staňte se partnerem Aquafarer<br />— Global Distribution Network
  subtitle: Připojte se ke globální partnerské síti Aquafarer. Spolupracujeme s námořními distributory, prodejci lodí, prodejci vybavení a značkovými partnery ve více než 50 zemích.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Globální síť partnerů a distributorů Aquafareru
content_programs:
  tagline: Partnerské programy
  title: Partnerské programy<br />Postaveno pro růst
  subtitle: Ať už jste distributor, prodejce nebo partner značky, Aquafarer nabízí programy určené na podporu vašeho podnikání.
  columns: 3
  items:
    - title: Distributorský program
      description: Exkluzivní teritoriální distribuce s objemovými cenami, marketingovou podporou a přímým továrním přístupem. Požadovaný minimální závazek na základě velikosti území.
      icon: tabler:world
    - title: Program pro prodejce
      description: Přímé ceny prodejců, školení o produktech, marketingové materiály a záruční podpora pro maloobchody a online obchody.
      icon: tabler:building-store
    - title: OEM/ODM Partnerství
      description: Kompletní výroba OEM a ODM s vlastní značkou, balením a specifikacemi produktů. Od konceptu ke kontejneru.
      icon: tabler:certificate
    - title: Partnerství značky
      description: Co-branding, privátní značka a exkluzivní modelové programy pro zavedené značky v námořním a venkovním rekreačním prostoru.
      icon: tabler:stars
    - title: Vládní a institucionální
      description: Programy preferovaných dodavatelů pro vládní agentury, pobřežní stráže, vojenské a humanitární organizace. Dokumentace připravená k výběrovému řízení.
      icon: tabler:building-community
    - title: Partner pro resorty a půjčovny
      description: Ceny vozového parku, konzistentní kvalita a vlastní značka pro letoviska, potápěčská centra a půjčovny po celém světě.
      icon: tabler:sun
content_benefits:
  tagline: Proč spolupracovat s námi
  title: Proč partneři volí Aquafarer
  subtitle: Naši partneři těží ze skutečných výrobních kapacit, stálé kvality a vstřícné podpory.
  list:
    - 'Přímý přístup do továrny: Pracujte přímo s naším výrobním týmem – žádní prostředníci. Získejte rychlejší odezvy, lepší ceny a plný přehled o výrobě.'
    - 'Připraveno na přizpůsobení: Označte své produkty vlastními barvami, logy, obaly a specifikacemi. Minimální množství objednávky přizpůsobené vašemu trhu.'
    - 'Zaručená kvalita: ISO 9001 certifikovaná výroba s CE, UKCA a BSCI. Každý produkt byl před odesláním testován.'
    - 'Globální logistika: Odeslání z Qingdao, Čína s možnostmi FOB, CIF a DDP. Americký sklad v Montclair, CA pro severoamerickou distribuci.'
    - 'Marketingová podpora: Katalogy produktů, fotografie, technická dokumentace a digitální prostředky na podporu vašeho prodejního úsilí.'
    - 'Školení a podpora: Školení produktů pro váš prodejní tým, technická podpora pro vaše zákazníky a koordinace záručního servisu.'
content_process:
  tagline: Jak se stát partnerem
  title: Jednoduchý proces partnerství
  subtitle: Náš proces partnerství je přímočarý – navržený tak, aby vám rychle prodal Aquafarer produktů.
  items:
    - title: 'Krok 1: Odešlete žádost'
      description: Vyplňte přihlášku našeho partnera s profilem vaší společnosti, cílovým trhem a zájmy o produkty.
    - title: 'Krok 2: Kontrola kvalifikace'
      description: Náš partnerský tým zkontroluje vaši žádost a do 3 pracovních dnů vás kontaktuje, abychom projednali příležitosti.
    - title: 'Krok 3: Dohoda a nastavení'
      description: Podepište smlouvu o partnerství, nastavte si účet a získejte partnerské ceny, marketingové materiály a vzorky produktů.
    - title: 'Krok 4: Školení a spuštění'
      description: Poskytovali školení produktu, podporu prodeje a marketingovou záruku. Jste připraveni začít prodávat.
cta:
  title: Jste připraveni stát se partnerem Aquafarer?
  subtitle: Požádejte o partnerství a náš tým odpoví do 3 pracovních dnů.
  actions:
    - variant: primary
      text: Požádejte o partnerství
      href: /contact
    - text: Prohlédněte si naše produkty
      href: /products

