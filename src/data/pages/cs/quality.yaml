tests:
  - title: Tlakové zkoušky
    standard: ISO 6185-1 | Interní specifikace AF-PT-001
    description: Nafukovací komory jsou natlakovány na 1,25násobek doporučeného provozního limitu a udržovány po dobu 30 minut. Pokles tlaku se měří za účelem ověření vzduchotěsnosti a strukturální integrity materiálů a švů.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Dopadové testování
    standard: Interní specifikace AF-IT-002
    description: Výrobky jsou vystaveny řízeným nárazům od standardizovaných pádových závaží a kyvadlového aparátu. Hodnotí se odolnost proti propíchnutí, šíření trhlin a odolnost konstrukce proti srážkám s překážkami, doky a úlomky.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: Testování odolnosti vůči UV záření
    standard: ASTM G154 | ISO 4892-3
    description: Vzorky materiálu jsou vystaveny lampám UVA-340 v komorách se zrychleným zvětráváním po dobu 1000+ hodin. Měříme změnu barvy (Delta E), zachování lesku a ztrátu pevnosti v tahu, abychom ověřili balíčky UV stabilizátorů.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Testování odolnosti proti oděru
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Vzorky materiálu jsou vystaveny brusným kotoučům CS-10 při zatížení 500 g/1 000 g po 1 000 cyklů. Ztráta hmotnosti a vizuální klasifikace opotřebení určují odolnost povlaku proti písku, štěrku a opakovanému spouštění.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Testování výkonu při nízkých teplotách
    standard: Interní specifikace AF-LT-003 | MIL-STD-810G
    description: Sestavené produkty a materiálové kupóny se kondicionují při -20 °C, -10 °C a 0 °C po dobu 24 hodin a poté se zkouší ohybem. Ověřujeme, že PVC a Hypalon zůstávají pružné bez praskání nebo delaminace.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Testování vztlaku a nosnosti
    standard: ISO 6185-1 | ISO 12402
    description: Produkty jsou postupně zatěžovány na 1,25násobek jmenovité kapacity v řízeném bazénu. Zaznamenává se volný bok, stabilita a výkon samovypouštění. Jmenovitá kapacita každého modelu je matematicky a empiricky ověřena.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Testování manévrovatelnosti
    standard: Interní specifikace AF-MT-004
    description: Zkoušky na vodě měří poloměr otáčení, zrychlení, dobu hoblování a odezvu pádla/motoru v celé řadě podmínek zatížení. Manipulační vlastnosti v reálném světě jsou ověřeny podle cílů návrhu.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Testování vodotěsnosti
    standard: ISO 6185-1 §7.3 | Interní specifikace AF-WT-005
    description: Každý sestavený produkt je testován nástřikem při 0,5 baru na všechny švy, ventily a armatury. 5minutový test ponořením pod tlakem ověřuje vodotěsnost komory a ventilu. Norma nulového úniku před odesláním.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: Testovací postupy
  title: Přísné testování v každé fázi
commitment:
  title: Náš závazek
  body: Prostřednictvím těchto přísných testovacích postupů poskytuje {SITE} zákazníkům jistotu, že naše nafukovací SUP a čluny jsou nejen vysoce výkonné, ale také vyrobené tak, aby vydržely – zajišťují nespočet příjemných a bezpečných dobrodružství na vodě. Naše laboratoř kvality funguje nezávisle na výrobě a podléhá přímo managementu.
  cta: Vyžádejte si zkušební dokumentaci
  cta_link: /contact

