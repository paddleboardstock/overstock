hero:
  tagline: Matice průmyslových řešení
  title: Námořní řešení založená na scénářích<br />Pro profesionální operace
  subtitle: Účelově zkonstruované nafukovací vodní skútry a RIB konfigurované pro aplikace záchrany, pronájmu flotily, jachtařských nabídek a komerčního rybolovu – každá je podpořena technickými specifikacemi a možnostmi přizpůsobení.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Profesionální námořní řešení Aquafareru pro různá odvětví
direct_answer: 'Aquafarer dodává nafukovací plavidla navržená podle scénáře a RIB řešení pro komerční námořní operace: záchranné a hlídkové čluny s vyztuženými Hypalon trubkami a vícekomorovou bezpečností, pronájem flotily SUP a kajaků s 1,2 mm PVC a horkovzdušným svařováním s dlouhou životností pro luxusní hlavní spoje deep-V hliníková žebra trupu a rybářské konfigurace pro těžký provoz s držáky prutů a systémy livewell.'
solution_a:
  tagline: Řešení A
  title: Námořní záchrana a<br />komerční hlídka
  subtitle: Vysokorychlostní, vícekomorové bezpečnostní RIB pro profesionální nouzové reakce a operace pro vymáhání práva.
  badge: Heavy-Duty Series
  description: Naše námořní záchranné a hlídkové RIB jsou konstruovány se zesílenými vzduchovými trubicemi s vysokou hustotou Hypalon/PVC s vícekomorovým nezávislým flotačním designem. Každá nádoba je vybavena reflexní páskou profesionální kvality, záchrannými uchopovacími šňůrami a ventily pro rychlé nafouknutí pro připravenost k nasazení. Sklolaminátové trupy Deep-V poskytují výjimečnou stabilitu při vysokých rychlostech a v drsných podmínkách na moři.
  features:
    - title: Vícekomorová bezpečnost
      description: 4–6 nezávislých vzduchových komor – každé jednokomorové propíchnutí udržuje pozitivní flotaci
    - title: Vyztužená trubková tkanina
      description: 1,2 mm Hypalon CSM nebo 1 680 DTEX PVC s dvouvrstvými švy svařovanými horkým vzduchem
    - title: Profesionální stupeň
      description: SOLAS reflexní páska, záchranné drapáky, tažné zarážky, rychloupínací lakovací šňůra
    - title: Vysokorychlostní trup
      description: Deep-V sklolaminátový nebo hliníkový trup dimenzovaný na 25–45 uzlů v závislosti na konfiguraci
  recommended_models:
    - RIB 450 Hlídka
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materiál trupu
      value: Sklolaminát / hliník námořní třídy
    - label: Tkanina na trubky
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Maximální rychlost
      value: 25–45 uzlů
    - label: Kapacita
      value: 6–12 osob
    - label: Rozsah motoru
      value: 40–200 HP
    - label: Osvědčení
      value: CE / ISO 9001
solution_b:
  tagline: Řešení B
  title: Půjčovna vybavení pro vodní sporty <br />v resortu
  subtitle: Mimořádně odolné nafukovací SUP, kajaky a čluny nenáročné na údržbu vyrobené pro každodenní pronájem v letoviscích, klubech a turistických provozech.
  badge: Rental-Grade
  description: Naše vybavení pro pronájem vozového parku je navrženo pro co nejvyšší odolnost a nejnižší náklady na údržbu. Používáme 1,2 mm zesílené PVC s třívrstvou technologií horkovzdušných svařovaných švů, která odolává UV degradaci a častému poškození kolizemi. Konstrukce drop-stitch zajišťuje, že si desky udrží tuhost i po stovkách cyklů pronájmu. Všechny modely jsou vybaveny zesílenými D-kroužky, otěruvzdornými pásy kolejnic a ventily komerční třídy.
  features:
    - title: Komerční třída PVC
      description: 1,2 mm vyztužený PVC s UV stabilizátory — 3x silnější než materiály pro spotřebitele
    - title: Horkovzdušné svařované švy
      description: Trojvrstvé tavné svařování – pevnější než lepení, odolává delaminaci
    - title: Tuhost drop-stitch
      description: Jádro 1 680 DTEX se 2 závity/čtvereční palec – dimenzováno na 20 PSI pro tuhost podobnou sololitu
    - title: Design připravený pro flotily
      description: Vyztužené D-kroužky, komerční ventilky Halkey-Roberts, otěruvzdorné lišty
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materiál trubky
      value: 1,0–1,2 mm Vyztuženo PVC
    - label: Technologie švů
      value: Třívrstvé svařování horkým vzduchem
    - label: Maximální tlak
      value: 15–20 PSI (modely s kapkovým stehem)
    - label: UV odolnost
      value: 1 000+ hodin zrychleného testování
    - label: Záruka
      value: 2–5 let v závislosti na modelu
    - label: Údržba
      value: Minimální – opláchněte a uložte
solution_c:
  tagline: Řešení C
  title: Yacht Tenders &<br />Luxusní plavidla
  subtitle: Lehké, vysoce výkonné RIB tendry určené pro skladování superjachet a přepravu hostů s luxusním střihem a povrchovou úpravou.
  badge: Premium Series
  description: Naše jachtařské plachetnice RIB kombinují lehkou konstrukci s luxusní estetikou. Hliníkové nebo laminátové trupy Deep-V poskytují výjimečnou kvalitu jízdy a snadné zvedání davu. k dispozici s barevně sladěnou grafikou trubek, prémiovým čalouněním a přizpůsobeným rozložením konzoly. Díky kompaktním rozměrům jsou ideální pro garáže superjachet a palubní sklady.
  features:
    - title: Lehká konstrukce
      description: Námořní hliníkové trupy snižují hmotnost o 30 % oproti sklolaminátu pro snadné zvedání
    - title: Výkon Deep-V
      description: Trup Deadrise 18–22 stupňů pro hladkou jízdu v řezu a vynikající sledování
    - title: Luxusní Fit & Finish
      description: Zakázkové čalounění, barevně sladěné trubky, prémiová konzola kormidla, nerezové balení
    - title: Kompaktní úložiště
      description: Navrženo pro garáže superjachet — vyfukovací trubky pro kompaktní uložení
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Typ trupu
      value: Deep-V hliník / sklolaminát
    - label: Deadrise
      value: 18-22 stupňů
    - label: Maximální rychlost
      value: 30–40 uzlů
    - label: Suchá hmotnost
      value: 120–350 kg (hliníkový trup)
    - label: Davit Lift připraven
      value: Ano – standardní zvedací body
    - label: Skladování
      value: Vyfukovací trubky, stohovatelné
