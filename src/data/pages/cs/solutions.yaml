features3_solutions:
  tagline: Řešení
  title: Vaše vodní dobrodružství<br />Obchodní partner
  isBeforeContent: false
  columns: 3
  items:
    - title: Kluby vodních sportů
      description: Kompletní balíčky vybavení, vlastní značky a programy údržby pro SUP kluby, kajakářské kluby, školy surfování a tréninková centra.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vodní sporty RIB
      description: Účelová žebra pro školy plachtění, centra vodních sportů a organizace akcí. Kočárové čluny, vlečné čluny a maršálské plavidlo pro profesionální vodní sporty.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorty a hotely
      description: Prémiové programy vodních sportů s vybavením vozového parku, bezpečnostními systémy, školením personálu a řízením příjmů pro pohostinské objekty.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Podnikatelé značky vody
      description: Výroba privátní značky OEM/ODM s nízkými MOQ, zakázkovým designem produktů, balením a globální dopravou pro nové vlastníky značek.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Potápěčské centrum Lodě
      description: Stabilní RIB platformy se snadným vstupem/výstupem, uložením vybavení a konfigurací motoru optimalizovanou pro potápěčské operace.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Záchranné a nouzové plavidlo
      description: Vysokorychlostní RIB a nafukovací čluny určené pro pátrací a záchranné operace, nouzové reakce a operace pobřežní stráže.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Nabídka řešení pro jachty
      description: Kompaktní, stylové nabídky RIB, které doplňují superjachty a rekreační plavidla. Snadné skladování, vysoký výkon.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Řešení rybářských člunů
      description: Stabilní, odolné nafukovací čluny a RIB konfigurované pro komerční a rekreační rybolov.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Vybavení pro námořní turistiku
      description: Nafukovací čluny připravené pro flotilu, prkna SUP a kajaky pro letoviska, cestovní kanceláře a půjčovny vodních sportů.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIB pro offshore energetiku
      description: Vysoce odolná RIB pro podporu ropných a plynových plošin, přesun posádky větrných farem, inspekci podmořských kabelů a stavbu lodí.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Pracovní lodě akvakultury
      description: Žebra odolná proti korozi pro chov ryb, pěstování perel a mořské farmy. Hypalon trubek, kování z nerezové oceli, odolnost při každodenním používání.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Mořský výzkum a průzkum
      description: Stabilní RIB připravené pro přístroje pro oceánografický výzkum, monitorování životního prostředí, vzorkování kvality vody a univerzitní výukové programy.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komerční pracovní lodě
      description: Vysoce odolné RIB pro hlídkování, průzkum, přepravu a pobřežní logistiku. Postaveno pro přísné požadavky komerčních provozů.
      icon: tabler:ship
      link: /commercial-workboats
