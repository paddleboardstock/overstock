content_capability:
  tagline: Inženýrské schopnosti
  title: Co náš inženýrský<br />tým přináší
  subtitle: Aquafarer inženýrství pokrývá celý životní cyklus produktu – od průzkumu trhu a návrhu konceptu přes prototypování, testování a hromadnou výrobu.
  items:
    - title: Průmyslový design
      description: Náš tým průmyslového designu pracuje na základě požadavků zákazníků, průzkumu trhu a konkurenčních analýz, aby vyvinul koncepty produktů, které vyvažují estetiku, funkčnost a vyrobitelnost. Vyrábíme 2D náčrty, 3D vizualizace a dokumenty se specifikacemi pro klientskou kontrolu před tím, než se pustíme do výroby nástrojů.
      features:
        - Vývoj koncepce a studie proveditelnosti
        - 2D návrhové výkresy a 3D vizualizace
        - Výběr materiálu a specifikace
        - Návrh pro výrobní (DFM) analýzu
        - Ergonomické a bezpečnostní hodnocení
    - title: Pozemní inženýrství
      description: Naši stavební inženýři se specializují na architekturu nafukovacích člunů – design trupu, konfiguraci trubkové komory, konstrukci jádra drop-stitch a rozložení zátěže. Každý návrh je analyzován z hlediska strukturální integrity, optimalizace hmotnosti a souladu s příslušnými normami (CE, ISO, AS).
      features:
        - Konstrukce trupu ze skelných vláken Deep-V s vypočítanými úhly náklonu
        - Vícekomorová konfigurace trubek pro bezpečnost a vztlak
        - Specifikace jádra drop-stitch a optimalizace hustoty
        - Analýza konečných prvků pro nosné komponenty
        - Výpočty rozložení hmotnosti a stability
    - title: 3D modelování a CAD
      description: Všechny návrhy produktů jsou vyvíjeny v 3D CAD před zahájením prototypového nástroje. Naši inženýři používají SolidWorks a Rhino 3D pro modelování produktů, což klientům umožňuje zkontrolovat každý detail – od profilu trubky po rozložení konzoly – předtím, než se pustí do výroby.
      features:
        - Plné 3D CAD modelování v SolidWorks a Rhino 3D
        - Fotorealistické vykreslování pro klientské prezentace
        - Technické výkresové balíčky pro výrobu
        - Návrh forem a nástrojů z 3D modelů
        - Přímý přenos dat z CAD do CNC pro přesné řezání
    - title: Prototypování a testování
      description: Před hromadnou výrobou prochází každý nový produkt fází prototypu. Vytváříme funkční prototypy pro klientské hodnocení a poté je podrobujeme našemu úplnému testovacímu protokolu – tlakové zkoušce, testování stability, zátěžové testování a vodní testy. Iterace návrhu ve fázi prototypu jsou rychlé a nákladově efektivní.
      features:
        - Rychlé prototypové nástroje (15-20denní obrat)
        - Funkční prototyp pro hodnocení v reálném světě
        - Kompletní testovací protokol před odhlášením z výroby
        - Iterativní vylepšení designu na základě výsledků testů
        - Milník schválení klienta před výrobou nástrojů
    - title: Vlastní integrace příslušenství
      description: Mnoho projektů OEM vyžaduje integraci klientem dodaného příslušenství nebo příslušenství třetích stran – zakázkové konzole, specializovaná sedadla, elektronické systémy, držáky na potápěčské vybavení nebo prvky značky. Náš inženýrský tým řídí návrh integrace, strukturální přizpůsobení a ověřování kvality veškerého příslušenství.
      features:
        - Design konzoly a uspořádání přístrojové desky
        - Vlastní integrace sedadel a čalounění
        - Návrh a elektroinstalace elektronických systémů
        - Montážní systémy potápěčského a záchranného vybavení
        - Branding a specifikace grafických aplikací
content_process:
  tagline: Vývojový proces
  title: Od konceptu<br />k výrobě
  subtitle: Náš proces vývoje produktů se řídí strukturovaným 6fázovým pracovním postupem navrženým tak, aby minimalizoval rizika, zkrátil časové osy a zajistil připravenost výroby od prvního dne.
  stages:
    - stage: '01'
      title: Požadavky a výzkum
      duration: 1-2 týdny
      description: Spolupracujeme s klientem na definování produktových specifikací, požadavků cílového trhu, požadavků na dodržování předpisů a obchodních cílů. Tato fáze vytváří dokument o požadavcích na produkt (PRD), kterým se řídí všechny následující práce.
      deliverables: PRD, analýza trhu, konkurenční benchmark, předběžný odhad nákladů
    - stage: '02'
      title: Koncept designu
      duration: 2-3 týdny
      description: Tým průmyslového designu vyvíjí produktové koncepty založené na PRD. Nabízí se více možností návrhu s 3D vykreslováním, doporučeními materiálů a počátečními technickými posouzeními. Klient si vybere směr pro detailní vývoj.
      deliverables: 3D vykreslování konceptu, specifikace materiálu, zdůvodnění návrhu, předběžný kusovník
    - stage: '03'
      title: Detailní inženýrství
      duration: 2-4 týdny
      description: Vybraný koncept je plně navržen — 3D CAD modelování, strukturální analýza, konfigurace trubek, návrh trupu, integrace příslušenství a výrobní dokumentace. Všechny rozměry, materiály a procesy jsou specifikovány pro nástroje.
      deliverables: Plný 3D model CAD, technické výkresy, konečný kusovník, specifikace nástrojů, plán kontroly kvality
    - stage: '04'
      title: Prototypování
      duration: 2-3 týdny
      description: Vyrábí se prototypové nástroje a vyrábí se funkční vzorky. Klient posoudí prototyp podle specifikací PRD. Testování se provádí podle dohodnutého protokolu. Konstrukční úpravy se provádějí na základě zpětné vazby před výrobou nástrojů.
      deliverables: Funkční prototyp, zkušební zpráva, protokol revizí návrhu, dokument odhlášení klienta
    - stage: '05'
      title: Výrobní nástroje
      duration: 2-3 týdny
      description: Po schválení prototypu jsou uvedeny do provozu výrobní nástroje – formy, svařovací přípravky, řezací programy, montážní přípravky. Dokumentace kontroly kvality a kritéria kontroly jsou dokončeny. Proveden zkušební provoz pro ověření procesu.
      deliverables: Výrobní nástroje, dokumentace procesu, plán kontroly kvality, zpráva o zkušebním provozu
    - stage: '06'
      title: Hromadná výroba a QC
      duration: Pokračující
      description: Plná výroba začíná průběžnou kontrolou kvality v každé fázi. První výrobky jsou zkontrolovány a schváleny před uvolněním šarže. Průběžné sledování kvality, sledování závad a neustálé zlepšování v průběhu celého životního cyklu výroby.
      deliverables: Výrobní plán, QC zprávy, záznamy sledovatelnosti šarží, přepravní dokumentace
content_customization:
  tagline: Možnosti přizpůsobení
  title: Co lze<br />přizpůsobit
  subtitle: Téměř každý aspekt našich produktů lze přizpůsobit požadavkům klienta. Níže jsou uvedeny nejběžnější kategorie přizpůsobení.
  columns: 3
  items:
    - title: Trup a struktura
      description: Zakázková délka trupu, šířka nosníku, úhel sklonu, průměr trubky, konfigurace komory a jakost materiálu.
      icon: tabler:sailboat
    - title: Barvy a grafika
      description: Barva trubky (PVC/Hypalon), barva gelcoatu trupu, barva konzoly, grafika paluby, umístění loga a design obalu.
      icon: tabler:palette
    - title: Konzole a ovládací prvky
      description: Středová konzola, boční konzola nebo řízení oje. Vlastní uspořádání přístrojové desky, umístění spínačů a pozice kormidla.
      icon: tabler:steering-wheel
    - title: Sedadla a čalounění
      description: Sedadla pro žokeje, lavicové sezení, luxusní čalounění, barevně sladěné prošívání, skládací nebo odnímatelné konfigurace.
      icon: tabler:armchair
    - title: Příslušenství a vybavení
      description: Potápěčské žebříky, tankové nosiče, tažné pylony, T-topy, Bimini topy, zvukové systémy, navigační elektronika a bezpečnostní vybavení.
      icon: tabler:backpack
    - title: Balení a branding
      description: Vlastní maloobchodní balení, krabice se soukromými štítky, přepravní kartony se značkami, visací štítky a uživatelské příručky v jazyce klienta.
      icon: tabler:box
content_industries:
  tagline: Průmyslové aplikace
  title: Inženýrská řešení<br />podle odvětví
  subtitle: Náš inženýrský tým vyvinul produkty pro širokou škálu námořních aplikací – každý s odlišnými požadavky a výkonnostními kritérii.
  columns: 3
  items:
    - title: Potápěčské operace
      description: Vyztužené paluby, integrace potápěčského žebříku, skladovací systémy nádrží a stabilní platformy pro komerční potápěčská centra po celém světě.
      icon: tabler:lifebuoy
    - title: Záchrana a pohotovost
      description: Vysokorychlostní konstrukce trupu, samovykládací paluby, systémy montáže zařízení a vícekomorové bezpečnostní konfigurace pro SAR operace.
      icon: tabler:alert-triangle
    - title: Mořská turistika
      description: Uspořádání pro pohodlí cestujících, integrace sluneční clony, nástupní systémy a konfigurace s nízkou spotřebou paliva pro ostrovní přesuny.
      icon: tabler:beach
    - title: Nabídky na jachty
      description: Kompaktní design pro uložení na davit, luxusní možnosti povrchové úpravy, odpovídající barvy mateřské lodi a vysoce výkonné tažné vlastnosti.
      icon: tabler:sailboat
    - title: Rybolov a akvakultura
      description: Konfigurace ploché paluby, integrace livewell, uspořádání držáků tyčí, hardware odolný proti korozi pro nepřetržité vystavení slané vodě.
      icon: tabler:fish
    - title: Přístav a průmysl
      description: Vyztužení trupu pro velké zatížení, uspořádání pracovních člunů, konfigurace přepravy osob a integrace vybavení pro operace na moři.
      icon: tabler:ship
