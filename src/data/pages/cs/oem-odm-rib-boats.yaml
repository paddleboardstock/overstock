content_customization:
  tagline: Co lze přizpůsobit
  title: RIB Přizpůsobení<br />Možnosti
  subtitle: Každý prvek lodi RIB lze přizpůsobit vaší aplikaci, požadavkům trhu a značky.
  items:
    - title: Trup a strukturální
      description: Délka trupu (2,5–8,5 m), materiál trupu (sklolaminát GRP nebo lodní hliník), barva trupu (gelcoat nebo lakovaná), profil kýlu (deep-V, střední V, plochý), typ příčky (uzavřená příčka s držákem nebo šachtou) a konstrukční vyztužení pro požadavky komerčního zatížení.
      icon: tabler:sailboat
    - title: Trubice a límec
      description: Materiál trubice (0,9–1,2 mm PVC nebo 1,4–1,7 mm Hypalon/CSM), průměr trubice (40–55 cm), počet komor (3–7), typ ventilu (Halkey-Roberts, Leafield D7 nebo Boston), barva trubice (standardní nebo vlastní konfigurace) a límcový kužel.
      icon: tabler:circle
    - title: Rozložení paluby a konzole
      description: Středová konzola, boční konzola nebo řízení oje. Uspořádání sedadel (sedadla žokeje, lavice, podpěrná sedadla). Pokrytí paluby (EVA pěna se vzhledem teakového dřeva, protiskluzová barva nebo holé GRP). Montážní body zařízení, záchytné lišty a pozice D-kroužků.
      icon: tabler:layout-dashboard
    - title: Elektrotechnika a navigace
      description: Navigační světla (LED), systém stokové pumpy, správa baterie, instalace VHF rádia, montáž GPS/kartplotteru, nabíjecí porty USB a konfigurace přepínacího panelu.
      icon: tabler:bolt
    - title: Branding a grafika
      description: Grafika trupu a trubek (sítotisk, přenos tepla, UV digitální tisk), umístění loga, barevná schémata na zakázku, identifikační označení a vlastní dokumentace vlastníka s vaší značkou.
      icon: tabler:palette
    - title: Bezpečnost a dodržování předpisů
      description: Klasifikace konstrukční kategorie (A/B/C/D na RCD), protipožární systém, specifikace palivového systému (přenosná nádrž, pevná nádrž, podpalubí) a balíček dokumentace shody pro váš cílový trh.
      icon: tabler:shield
content_applications:
  tagline: Konfigurace aplikací
  title: RIB Konfigurace<br />Podle aplikace
  subtitle: Různé mise vyžadují různé konfigurace. Zde jsou osvědčená nastavení pro nejběžnější RIB aplikace.
  items:
    - title: Záchrana a hlídka
      description: Hluboký V trup, Hypalon trubky, samovysouvací paluba, podpěrná sedadla, madla, navigační světla a odolné D-kroužky. Provedení RCD kategorie B nebo C. Ohnivzdorný palivový systém a komerční elektroinstalace.
      icon: tabler:lifebuoy
    - title: Podpora potápění
      description: Široký nosník, zadní nástupní žebřík, pozice na stojanu na nádrže, extra D-kroužky, držák na potápěčskou vlajku, zesílená příčka pro dva přívěsné motory a protiskluzové zakrytí celé paluby EVA.
      icon: tabler:mask
    - title: Turistika a obchod
      description: Uspořádání certifikované pro cestující s lavicovým sedadlem, slunečníkem/Bimini, madly, suchým úložištěm a systémem dvou baterií. RCD kategorie C. Navrženo pro rekreační a charterové operace flotily.
      icon: tabler:beach
    - title: Rybolov
      description: Uspořádání otevřené paluby, pozice držáku prutů, studna pro živou návnadu, držák na vyhledávač ryb, držák motoru na trolling, zesílená příčka a přenosný palivový systém. Možnosti středové konzoly nebo boční konzoly.
      icon: tabler:fish
    - title: Nabídka pro volný čas a jachty
      description: Lehký trup, PVC trubky, pohodlné sezení, teleskopická oj nebo kompaktní konzola, zvedací body pro davit a odnímatelná palivová nádrž. RCD kategorie C nebo D.
      icon: tabler:sailboat
    - title: Profesionální pracovní člun
      description: Volitelný hliníkový trup, robustní výztuha, hydraulické řízení, komerčně dostupná elektrika, radarový oblouk a body integrace vybavení pro konkrétní misi. Vlastní soulad s projektem.
      icon: tabler:anchor
process_steps:
  title: 7-krokový RIB OEM/ODM vývojový proces
  subtitle: Od stručných informací k projektu až po poprodejní služby – definovaný pracovní postup s jasnými milníky a výstupy
  steps:
    - number: '01'
      title: Stručný popis projektu a požadavky
      description: Definujte cílovou aplikaci, velikost trupu, materiál trubky, požadavky na shodu a potřeby značky. Posoudíme proveditelnost a potvrdíme model spolupráce (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 dní
    - number: '02'
      title: Technická kontrola a proveditelnost
      description: Inženýrský tým přezkoumává konstrukční proveditelnost, výpočty stability a vztlaku, cestu shody a dostupnost materiálu. Identifikujeme stávající formy nebo vlastní požadavky na formy.
      timeline: 5–7 dní
    - number: '03'
      title: Nabídka a nabídka
      description: Získejte podrobný návrh včetně specifikací, 3D vykreslování nebo výkresů GA, rozsahu shody, časové osy a jednotkové ceny na základě úrovní objemu a MOQ.
      timeline: 5–7 dní
    - number: '04'
      title: Potvrzení návrhu a odběr vzorků
      description: Schválit finální GA, rozložení paluby a konfiguraci trubky. Vyrobíme předvýrobní vzorek s barvami vaší značky, logem a specifikovanými materiály pro vaši fyzickou kontrolu.
      timeline: 15–20 dní
    - number: '05'
      title: Vzorový protokol schválení a kontroly kvality
      description: 'Zkontrolujte a schvalte vzorek. Definujte protokol kontroly kvality výroby: tlaková zkouška (1,25x / 24–48h), rozměrové kontroly a kontrolní seznam dokumentace shody pro každý trup.'
      timeline: 3–5 dní
    - number: '06'
      title: Hromadná výroba a kontrola kvality
      description: Plná výroba se 100bodovým kontrolním seznamem kontroly kvality na jednotku. Průběžné kontroly, tlakové zkoušky a sledovatelnost sériové úrovně. Paralelně připravená dokumentace CE/ISO.
      timeline: 30–45 dní
    - number: '07'
      title: Balení, doprava a poprodejní servis
      description: Vlastní balení (standardní, maloobchodní nebo paletizované), exportní dokumentace, nakládání kontejnerů a logistika. Včetně sad náhradních dílů a dokumentace údržby.
      timeline: 7–14 dní
certifications:
  title: Shoda a certifikace pro RIB lodě
  subtitle: Každá zakázková RIB objednávka je dodávána s dokumentací o shodě specifické pro daný model
  items:
    - name: CE 2013/53/EU
      description: Shoda s proudovým chráničem RCD podle modelu a kategorie designu — prohlášení o shodě, štítek výrobce, uživatelská příručka je součástí dodávky
      badge: CE
    - name: ISO 9001:2015
      description: Systém řízení kvality certifikovaný společností SGS pokrývající návrh, výrobu a distribuci
      badge: ISO
    - name: EN ISO 6185
      description: Standardní konstrukce nafukovacího člunu – stabilita, vztlak a zotavení člověka přes palubu
      badge: 6185
    - name: EN ISO 14945
      description: Norma stavebního štítku — trvale označené identifikační a kapacitní údaje
      badge: 14945
    - name: BSCI
      description: Audit sociální shody pro etickou výrobu – požadovaný maloobchodníky v EU
      badge: BSCI
    - name: REACH
      description: Shoda EU pro chemickou bezpečnost pro PVC, Hypalon, lepidla a nátěry
      badge: REACH
content_service_modules:
  tagline: Servisní moduly
  title: OEM/ODM Služba<br />Moduly
  subtitle: Každý projekt kombinuje správné moduly služeb. Ne každý projekt potřebuje každý modul – zaměříme se pouze na to, co váš projekt vyžaduje.
  items:
    - title: Technická revize a proveditelnost
      description: 'Posouzení platformy trupu, kontrola proveditelnosti konstrukce, ověření stability a vztlaku, identifikace cesty shody a potvrzení dostupnosti materiálu. Výstup: zpráva o proveditelnosti s doporučením jít/nego.'
      icon: tabler:math-function
    - title: Design a konfigurace
      description: 'GA výkres, rozložení paluby, konfigurace trubek, pozice konzoly a sedadel, plán montáže zařízení a výběr barvy/materiálu. Výstup: schválená specifikace GA a konfigurace.'
      icon: tabler:ruler
    - title: Vzorek a prototyp
      description: Předprodukční vzorek se schválenými barvami, logem a specifikovanými materiály pro fyzickou kontrolu. Zahrnuje protokol o schválení vzorku, kontrolní seznam kontroly a proces žádosti o změnu.
      icon: tabler:3d-cube-sphere
    - title: Výroba a kontrola kvality
      description: Hromadná výroba se 100bodovým kontrolním seznamem kontroly kvality na jednotku, kontrolami během procesu, tlakovým testováním (1,25x / 24-48h) a sledovatelností na sériové úrovni. Paralelně připravená dokumentace CE/ISO.
      icon: tabler:clipboard-check
    - title: Branding a balení
      description: Aplikace loga soukromé značky, vlastní grafika trupu a trubek, značková dokumentace vlastníka, balení připravené pro maloobchod nebo palety a příprava sady náhradních dílů.
      icon: tabler:palette
    - title: Export a dokumentace
      description: Exportní balení, plán nakládky kontejnerů, dokumentace FOB/CIF/DDP, papírování shody podle cílového trhu a komunikační protokol po dodání.
      icon: tabler:world
content_risk_control:
  tagline: Kontrola rizik a dodávek
  title: Řízení rizik projektu a<br />Dodávky
  subtitle: Profesionálním OEM/ODM kupujícím záleží na kontrole rizik stejně jako na kvalitě produktu. Zde je návod, jak to zvládneme.
  items:
    - title: Rozsah a definice vlastnictví
      description: 'Před zahájením vývoje písemně definujeme: rozsah přizpůsobení, požadavky na nástroje, kritéria schválení vzorků, vlastnictví výkresů a forem a odpovědnosti za dokumentaci. Žádné nejasnosti o tom, kdo co vlastní.'
      icon: tabler:file-text
    - title: Proces změny řízení
      description: Všechny změny specifikací po potvrzení návrhu se řídí dokumentovaným procesem žádosti o změnu s posouzením dopadu (náklady, časový plán, soulad). Do výroby nevstupují žádné neschválené úpravy.
      icon: tabler:arrows-diff
    - title: Záruka konzistence šarže
      description: 50. jednotka odpovídá 1. schválenému vzorku. Schválené specifikace jsou zmrazeny, parametry materiálu a procesu jsou uzamčeny a kontrolní body v průběhu procesu ověřují konzistenci během výrobního cyklu.
      icon: tabler:repeat
    - title: Transparentnost dodání a kapacity
      description: Dodací lhůty jsou uváděny na základě skutečné výrobní kapacity, stavu zásob materiálu a aktuálního vytížení zakázek – nikoli aspiračních cílů. Výrobní plán s mezními daty poskytovanými na objednávku.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Často kladené otázky
  questions:
    - q: Jaký je rozdíl mezi OEM a ODM pro lodě RIB?
      a: 'OEM (Original Equipment Manufacturing): poskytnete podrobné specifikace a my vytvoříme váš návrh. ODM (Original Design Manufacturing): vyberete si osvědčenou platformu Paddle Board Overstock RIB a my ji přizpůsobíme vašim požadovaným funkcím a brandingu. ODM je rychlejší a levnější; OEM nabízí maximální kontrolu nad designem.'
    - q: Mohu přizpůsobit tvar a velikost trupu RIB?
      a: Ano. Nabízíme částečně zakázkové úpravy stávajících forem trupu (různé uspořádání paluby, konfigurace trubek) a úplný vlastní vývoj trupu s novými CNC obráběnými formami. Semi-custom projekty mohou začít na 2-5 jednotek; Úplná zakázka obvykle vyžaduje vyšší závazky.
    - q: Jaké materiály trubek jsou k dispozici pro vlastní RIB?
      a: Nabízíme 0,9-1,2 mm PVC pro rekreační a lehké komerční použití a 1,4-1,7 mm Hypalon/CSM pro profesionální, záchranné a komerční aplikace vyžadující vynikající odolnost vůči UV záření a ozónu (životnost 10-15 let oproti 5-8 letům PVC).
    - q: Můžete nakonfigurovat RIB pro konkrétní aplikace, jako je záchrana, potápění nebo rybaření?
      a: Ano. Udržujeme osvědčené konfigurační šablony pro aplikace záchrany/hlídky, potápěčské podpory, turistiky/pronájmu, rybaření, výběrových řízení na jachty a profesionálních pracovních člunů. Každá šablona obsahuje doporučený typ trupu, materiál trubky, rozložení paluby a vybavení – které pak přizpůsobíme vašim přesným požadavkům.
    - q: Jaké informace potřebujete pro cenovou nabídku RIB OEM/ODM?
      a: Cílová aplikace, požadovaná délka trupu, preferovaný materiál trubek (PVC nebo Hypalon), přibližné množství a harmonogram dodávek, požadavky na shodu s cílovým trhem a jakékoli referenční produkty nebo specifikace. Čím více podrobností poskytnete, tím rychlejší a přesnější bude naše nabídka.
    - q: Jaké je MOQ pro vlastní RIB lodě?
      a: U stávajících forem trupu se standardními úpravami začíná MOQ na 2-5 jednotkách na návrh. U zakázkových forem a úplného zakázkového vývoje závisí MOQ na složitosti projektu – obvykle 10–20 jednotek pro semi-custom a 30+ pro plně zakázkové s novými nástroji.
    - q: Kdo vlastní vlastní formy a výkresy?
      a: Formy vyvinuté s použitím Paddle Board Overstock základních konstrukcí zůstávají vlastnictvím Paddle Board Overstock. Plně zakázkové formy objednané a placené klientem mohou být přiřazeny do vlastnictví klienta podle smluvních podmínek. Všechny podmínky vlastnictví formy jsou zdokumentovány před zahájením projektu.
    - q: Jak jsou vlastní RIB zabaleny pro export?
      a: 'Standard: vlastní kolébka + stretch-wrap pro nakládání kontejnerů. Premium: balení připravené pro maloobchod, vakuové balení nebo paletování. Nabízíme dopravu FOB Qingdao, CIF a DDP. Kompletní exportní dokumentace a celní odbavení v ceně.'
