faq:
  title: Nejčastější dotazy k balíčku
  questions:
    - q: Jaké je minimální objednací množství pro balíčky?
      a: Klubový startovací balíček má minimálně 10 jednotek. Balíčky Resort a Brand jsou přizpůsobeny vašim potřebám pomocí flexibilních MOQ.
    - q: Jak dlouho trvá doručení?
      a: Standardní výroba je 30–45 dní od potvrzení objednávky. Zrychlená výroba je k dispozici za příplatek.
    - q: Mohu přizpůsobit barvy a značky vybavení?
      a: Ano. Všechny balíčky zahrnují úplné přizpůsobení – barvy desek, potisk loga a design balení.
    - q: Poskytujete poprodejní podporu?
      a: Ano. Každý balíček zahrnuje přístup k našim online příručkám údržby, video tutoriálům a systému objednávání náhradních dílů.
