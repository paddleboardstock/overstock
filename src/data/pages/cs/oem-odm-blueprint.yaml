process_steps:
  title: 6-krokový proces OEM/ODM
  subtitle: Od stručného návrhu k FOB Qingdao – zjednodušený pracovní postup
  steps:
    - number: '01'
      title: Stručný návrh a 3D CAD modelování
      description: Podělte se o své cílové specifikace, referenční produkt nebo koncept. Náš technický tým vyvine podrobné CAD výkresy a 3D rendery pro vaše schválení.
      timeline: 3–5 dní
    - number: '02'
      title: Výběr materiálu a testování látek
      description: Vyberte si z vojenských materiálů PVC (0,9–1,2 mm), Hypalon CSM nebo jádrových tkanin s kapkovým stehem. Provádíme zkoušky pevnosti v tahu, přilnavosti nátěru a UV stability.
      timeline: 2–3 dny
    - number: '03'
      title: Rychlé prototypování a výroba vzorků
      description: Zakázkové formy CNC obrábíme a vyrábíme předvýrobní vzorky s barvami vaší značky, logem a specifikovanými materiály. Vzorky odeslány ke schválení.
      timeline: 7–14 dní
    - number: '04'
      title: 24–48hodinový vysokotlaký udržovací test
      description: Každý prototyp prochází přísným testem udržení tlaku při 1,25násobku jmenovitého tlaku. Provádějí se zkoušky odlupování švů a ověřování rozměrů.
      timeline: 1–2 dny
    - number: '05'
      title: CE/ISO Kontrola kvality a balení
      description: 100bodový kontrolní seznam kvality. Každá jednotka je před balením pro maloobchod zkontrolována. Včetně CE prohlášení o shodě a BSCI zprávy o shodě.
      timeline: 2–3 dny
    - number: '06'
      title: FOB Qingdao Přeprava a logistika
      description: Hotové zboží paletováno, zabaleno do smršťovací fólie a naloženo do kontejneru v přístavu Qingdao. Kompletní exportní dokumentace, celní odbavení a sledování v reálném čase.
      timeline: 7–14 dní
