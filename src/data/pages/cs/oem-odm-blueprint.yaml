faq:
  title: OEM/ODM — Často kladené otázky
  questions:
    - q: Jaké je minimální množství objednávky (MOQ) pro vlastní nafukovací SUP?
      a: U standardních modelů se stávajícími formami začíná MOQ na 5–10 jednotkách na návrh. Pro plně vlastní formy a nástroje je MOQ obvykle 200+ jednotek. Spolupracujeme se startupy a rozvíjejícími se značkami, abychom našli proveditelné vstupní body.
    - q: Jak dlouho trvá proces vzorku OEM?
      a: Standardní prototypové vzorky jsou dokončeny do 7–14 pracovních dnů po schválení návrhu. Urychlené objednávky lze upřednostnit na 5–7 dní za příplatek.
    - q: Jaký je rozdíl mezi PVC a Hypalon pro nafukovací čluny?
      a: PVC je lehčí, dostupnější a nabízí vynikající flexibilitu v chladném počasí. Hypalon (CSM) poskytuje vynikající odolnost vůči UV záření a ozónu s delší životností (10–15 let oproti 5–8 let). Doporučujeme PVC pro většinu rekreačních aplikací a Hypalon pro komerční/profesionální použití.
    - q: Můžete si přizpůsobit tvar a design nafukovačky?
      a: Ano. Náš výzkumný a vývojový tým může vyvinout vlastní formy pro jakýkoli tvar trupu, obrys desky nebo konfiguraci trubky. Pro přesnost a konzistenci používáme CNC obráběné hliníkové formy.
    - q: Poskytujete služby továrního auditu?
      a: V našem závodě o rozloze 12 000 m² Qingdao vítáme audity továrny na místě i třetí stranou. Udržujeme certifikace ISO 9001 a BSCI a můžeme sdílet zprávy o auditu na NDA.
    - q: Jaké přepravní podmínky nabízíte?
      a: Nabízíme dodací podmínky FOB Qingdao (standardní), CIF a DDP. Nakládání kontejnerů a úplná exportní dokumentace jsou součástí všech objednávek OEM.
content_profiles:
  tagline: Profily značek
  title: OEM / Výroba soukromých značek<br />Podle typu zákazníka
  subtitle: Různé profily značek přicházejí s odlišnými požadavky – naše služby OEM/ODM přizpůsobujeme tak, aby odpovídaly vašemu obchodnímu modelu, rozsahu a strategii uvedení na trh.
  items:
    - title: Startupové značky plavidel
      subtitle: Nízké MOQ, rychlý náběh
      description: Podnikatelé a zakladatelé uvedení své první řady SUP, kajaků nebo nafukovacích člunů. Potřebujete výrobního partnera, který zachází s vaší značkou jako se svou vlastní – s nízkými vstupními prahy, flexibilními velikostmi šarží a praktickým návrhem na každém kroku.
      features:
        - MOQ jen 50–100 jednotek na SKU, nikoli tisíce
        - Již existující knihovna forem pro přeskočení nákladů na nástroje
        - 'Kompletní balení značky: logo, grafika trubice, balení, visačky'
        - Pracovní postup na prvním místě – schválení před výrobou
    - title: Zavedené námořní značky
      subtitle: Stupnice OEM s vyhověním CE/ISO
      description: Stávající značky lodí, PWC nebo námořního příslušenství přidávají do svého portfolia nafukovací plavidla. Potřebujete konzistentní kvalitu ve všech výrobních sériích, soulad s předpisy pro globální trhy a schopnost společně navrhovat vlastní trupy nebo tvary trubek.
      features:
        - Zakázkové inženýrství 3D forem pro proprietární návrhy
        - CE 2013/53/EU, UKCA, USCG dokumentace shody
        - BSCI zpráv o sociálním auditu pro dodržování požadavků maloobchodníků
        - Vyhrazená správa účtů + prioritní produkční sloty
    - title: DTC a značky elektronického obchodu
      subtitle: Balení připravené pro maloobchodní prodej ve velkém měřítku
      description: První online značky, které prodávají prostřednictvím Amazonu, Shopify nebo svých vlastních webových obchodů. Zásadní význam má balení, zkušenost s vybalováním a konzistentní kvalita jednotky. Potřebujete továrnu, která rozumí dynamice rychlosti a návratnosti elektronického obchodování.
      features:
        - Design krabice připravený pro maloobchod + potisk vložených karet
        - Vakuové balení / paletizace pro nákladově efektivní dopravu
        - Čárový kód EAN / UPC a celní dokumentace
        - Konsolidace smíšených kontejnerů pro optimalizaci nákladů na vykládku
    - title: Lifestyle & Outdoor značky
      subtitle: White-label design + rozšíření kategorie
      description: Oblečení, outdoorové vybavení nebo cestovní značky vstupující do kategorie vodních sportů pod svou vlastní značkou. Možná nemáte vlastní odborné znalosti v oblasti námořního inženýrství – takže potřebujete partnera, který vás provede od konceptu ke kontejneru s minimálním třením.
      features:
        - Nástěnky pro výzkum trendů a koncepty
        - Co-brandované limitované edice a sezónní barevné provedení
        - Cyklus od návrhu po vzorek za 10–14 pracovních dnů
        - 'End-to-end logistika: továrna → sklad → spotřebitel'
