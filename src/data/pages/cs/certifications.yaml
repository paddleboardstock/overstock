hero:
  tagline: Certifikace a standardy
  title: Certifikace kvality<br />a standardy shody
  subtitle: Aquafarer produktů je vyrobeno v souladu s mezinárodními námořními bezpečnostními normami, systémy řízení kvality a ekologickými předpisy.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Certifikace kvality a dokumentace shody Aquafareru
content_certifications:
  tagline: Naše certifikace
  title: Certifikovaná kvalita,<br />celosvětově uznávaná
  subtitle: 64 modelů s certifikací CE a certifikace celé továrny prokazují náš závazek ke kvalitě, bezpečnosti a odpovědnosti za životní prostředí.
  items:
    - title: CE Certifikováno
      description: 64 modelů s certifikací CE vyhovuje evropským požadavkům na označování CE pro rekreační plavidla, což zajišťuje splnění norem bezpečnosti, zdraví a ochrany životního prostředí.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Náš systém řízení kvality je certifikován ISO 9001:2015, který zahrnuje návrh, výrobu a distribuci nafukovacích plavidel a námořního vybavení.
      icon: tabler:clipboard-check
    - title: UKCA Označeno
      description: Produkty prodávané na britském trhu nesou označení UKCA potvrzující shodu s britskými předpisy pro námořní vybavení a vodní skútry.
      icon: tabler:shield
    - title: BSCI Vyhovující
      description: Aquafarer má audit BSCI (Business Social Compliance Initiative), což prokazuje etické výrobní postupy, spravedlivé pracovní podmínky a odpovědnost za dodavatelský řetězec.
      icon: tabler:heart-handshake
    - title: REACH Vyhovující
      description: Všechny materiály použité v produktech Aquafarer vyhovují předpisům EU REACH pro chemickou bezpečnost, což zajišťuje, že v našich PVC, Hypalon nebo součástech nejsou žádné omezené látky.
      icon: tabler:flask
    - title: Materiálové testování
      description: Tkaniny jsou testovány na pevnost v tahu, odolnost proti roztržení, degradaci UV zářením a odolnost proti praskání za studena. Každá výrobní šarže je vzorkována a ověřena.
      icon: tabler:test-pipe
content_factory:
  tagline: Tovární standardy
  title: Dokonalost výroby<br />— Vyrobeno podle specifikací
  subtitle: Náš závod o rozloze 12 000 m² funguje v každé fázi výroby podle přísných protokolů kontroly kvality.
  list:
    - 'Vstupní kontrola materiálu: Všechny suroviny – PVC tkanina, Hypalon, hliník, překližka, lepidla – jsou před vstupem do výroby testovány podle specifikací.'
    - 'Průběžná kontrola kvality: Každá výrobní fáze má zdokumentované kontrolní body QC. Pevnost svaru, vyrovnání švu, instalace ventilu a krouticí moment montáže jsou ověřeny inline.'
    - 'Tlakové testování: Každá nafukovací komora je tlakově testována při 1,25× jmenovitém tlaku po dobu 24–48 hodin. Míra úniku musí být v přijatelných mezích na ISO 6185.'
    - 'Závěrečná kontrola: Dokončené produkty jsou před odesláním kontrolovány na rozměrovou přesnost, kosmetickou úpravu, úplnost příslušenství a integritu balení.'
    - 'Sledovatelnost šarže: Každý výrobek nese sériové číslo spojené se záznamy o výrobní šarži, což umožňuje plnou sledovatelnost od suroviny až po hotové zboží.'
content_safety:
  tagline: Normy námořní bezpečnosti
  title: Bezpečnost především<br />— Navrženo pro spolehlivý provoz
  subtitle: Aquafarer produktů je navrženo a testováno tak, aby splňovaly mezinárodní normy námořní bezpečnosti pro komerční a rekreační použití.
  items:
    - title: ISO 6185
      description: Nafukovací čluny splňují normy ISO 6185 pro konstrukci, stabilitu, vztlak a nosnost.
      icon: tabler:sailboat
    - title: Standardy ABYC
      description: Elektrické systémy a palivové systémy splňují normy ABYC (American Boat & Yacht Council) pro bezpečnou instalaci a provoz.
      icon: tabler:bolt
    - title: SOLAS Soulad
      description: Bezpečnostní vybavení a záchranné prostředky splňují požadavky SOLAS (Bezpečnost života na moři), kde je to vhodné.
      icon: tabler:lifebuoy
