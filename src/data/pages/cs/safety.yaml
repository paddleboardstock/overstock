certifications:
  - title: Certifikace CE (EU 2016/425)
    standard: Nařízení OOP (EU) 2016/425 | EN ISO 12402
    description: Všechna bezpečnostní zařízení Paddle Board Overstock splňují požadavky na označování CE podle evropského nařízení o osobních ochranných prostředcích. Každý produkt je nezávisle testován TÜV Rheinland, evropským notifikovaným orgánem. Naše nafukovací čluny a RIB splňují požadavky směrnice o rekreačních plavidlech 2013/53/EU (RCD) kategorie C a D.
    body: Certifikace CE pokrývá základní zdravotní a bezpečnostní požadavky na osobní plovací zařízení a nafukovací plavidla. TÜV Rheinland každoročně provádí audit našeho výrobního zařízení, aby ověřil průběžnou shodu.
  - title: SOLAS — Bezpečnost života na moři
    standard: SOLAS Kapitola III | LSA Kód
    description: Life Vest Pro splňuje předpisy SOLAS pro offshore a komerční námořní operace. Testováno na 24hodinovou retenci vztlaku, automatické nafukování po ponoření a výkonnost na moři až do síly 5. Splňuje požadavky kapitoly III na záchranné vesty na komerčních plavidlech.
    body: Schválení SOLAS vyžaduje nezávislé testování notifikovaným orgánem na vztlak, pevnost, viditelnost a automatickou aktivaci. Naše Life Vest Pro má plné schválení typu SOLAS s certifikací MED.
  - title: USCG Typ III / Typ V
    standard: 46 CFR část 160 | USCG Schválení
    description: Vybrané záchranné vesty Paddle Board Overstock splňují klasifikaci pobřežní stráže Spojených států pro zařízení typu III (pomůcka pro flotaci) a typu V (speciální použití). Vhodné pro chráněné vody, pobřežní plavbu a komerční provoz vyžadující USCG schválených PFD.
    body: USCG schválení vyžaduje testování nezávislou laboratoří uznávanou CG. Schválení typu V zahrnuje hybridní nafukovací konstrukce, které vyžadují manuální nebo automatickou aktivaci.
  - title: Sociální soulad BSCI
    standard: amfori BSCI Kodex chování
    description: Naše továrna je každoročně auditována v rámci iniciativy amfori Business Social Compliance Initiative (BSCI). To ověřuje etické pracovní postupy, bezpečnost na pracovišti, spravedlivou pracovní dobu a environmentální management v našem výrobním závodě o rozloze 12 000 m².
    body: Shoda BSCI je nezbytným předpokladem pro evropské maloobchodníky a dovozce. Naše současné hodnocení BSCI je „C“ (dobré), auditováno společností SGS.
  - title: REACH & RoHS Soulad
    standard: Nařízení EU REACH (ES) 1907/2006 | RoHS Směrnice 2011/65/EU
    description: Všech PVC sloučenin, lepidel a nátěrů používaných v Paddle Board Overstock produktech vyhovuje REACH předpisům EU o chemické bezpečnosti a RoHS omezením pro nebezpečné látky. Pro každou produktovou řadu jsou k dispozici bezpečnostní listy materiálu (MSDS).
    body: Shoda REACH zajišťuje, že žádné omezené látky SVHC překračují prahové limity. Pravidelné laboratorní testy třetí strany ověřují průběžnou shodu pro každou výrobní dávku.
  - title: ISO 9001:2015 Management kvality
    standard: ISO 9001:2015 | TÜV Rheinland Certifikováno
    description: Náš systém řízení kvality je ISO 9001:2015 certifikován TÜV Rheinland, který zahrnuje návrh, výrobu, testování a poprodejní servis. Každoroční dozorové audity zajišťují neustálé zlepšování a kontrolu procesů.
    body: Certifikace ISO 9001 vyžaduje zdokumentované zásady kvality, interní audity, kontroly managementu, postupy nápravných opatření a sledovatelné výrobní záznamy.
testimonial:
  quote: Bezpečnostní vybavení jsme odebírali od různých dodavatelů z celé Asie. Paddle Board Overstock je jediným výrobcem, který předem poskytl úplnou dokumentaci CE, SOLAS certifikáty a zprávy o zkouškách třetích stran – bez vyžádání.
  author: Erik Lindström
  title: Bezpečnostní důstojník
  company: Baltic Marine Supply
  location: Finsko
content_overpressure:
  tagline: Bezpečnost při přetlaku
  title: RIB Tlak v trubkách<br />Řízení v horkém klimatu
  subtitle: Tlak v nafukovací trubici se zvyšuje s teplotou. Pochopení a řízení přetlaku zabraňuje poškození a zajišťuje bezpečný provoz v tropickém a pouštním prostředí.
  items:
    - title: Boyle přetlakové ventily
      description: Trubky Paddle Board Overstock RIB jsou vybaveny přetlakovými pojistnými ventily, které automaticky odvětrávají přetlak nad jmenovité maximum. Zabraňuje namáhání švů a potenciálnímu prasknutí trubky v důsledku solárního ohřevu.
      icon: tabler:gauge
    - title: Změna tlaku od rána do poledne
      description: Trubice nafouknutá na 3,5 PSI při 20 °C může dosáhnout 4,5+ PSI při vystavení slunci 40 °C. V horkém podnebí vždy nafukujte na spodní hranici doporučeného rozsahu a nechte přetlakový ventil řídit přetlak.
      icon: tabler:sun
    - title: Doporučené provozní tlaky
      description: 'PVC trubky: 3,0-3,5 PSI provozní, 4,5 PSI max. Hypalon trubky: 3,5-4,0 PSI provozní, 5,0 PSI max. Vždy testujte při hodnocení 1,25x (4,4 PSI pro PVC, 5,0 PSI pro Hypalon) podle norem QC Paddle Board Overstock.'
      icon: tabler:chart-bar
    - title: Doporučené postupy expozice slunci
      description: Pokud RIB nepoužíváte, skladujte je ve stínu. Pro delší kotvení používejte UV ochranné kryty. Zkontrolujte a upravte tlak trubice před a po špičce slunečních hodin. Nikdy nepřekračujte maximální jmenovitý tlak.
      icon: tabler:umbrella
    - title: Nouzové odtlakování
      description: Pokud se trubice zdá příliš pevná nebo se odvzdušňuje pojistný ventil, vypusťte vzduch přes Halkey-Roberts nebo vojenský ventil, dokud se tlak nevrátí do provozního rozsahu. Pro přesné měření mějte u sebe manometr.
      icon: tabler:alert-circle
