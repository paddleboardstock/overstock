hero:
  tagline: Náš tým
  title: Lidé za Aquafarer<br />— Inženýrská svoboda na vodě
  subtitle: Aquafarer, která byla založena v roce 2012 v Qingdao v Číně, byla postavena námořními inženýry, materiálovými vědci a nadšenci do vodních sportů, kteří věřili ve zpřístupnění profesionálních nafukovacích plavidel po celém světě.
  image:
    src: /images/team-all.webp
    alt: Fotografie celého týmu Aquafareru — inženýrství, výroba a vedení
founding:
  tagline: Naše založení
  title: Od pobřežní dílny<br />až po zařízení o rozloze 12 000 m²
  subtitle: Aquafarer byla založena týmem námořních inženýrů s desítkami let kombinovaných zkušeností s konstrukcí nafukovacích člunů, výrobou PVC/Hypalon a globální výrobou námořního vybavení.
  items:
    - title: "Založeno: 2012"
      description: Založena v Qingdao, Čína – hlavní námořní uzel s hlubokým dědictvím stavby lodí.
      icon: tabler:calendar
    - title: 200-300 zaměstnanců
      description: Včetně 50+ R&D inženýrů, specialistů na kontrolu kvality a výrobních techniků.
      icon: tabler:users
    - title: 12 000 m² zařízení
      description: Specializovaný výrobní závod se 6 výrobními linkami pro RIB, nafukovací čluny a SUP prkna.
      icon: tabler:building-factory
    - title: Obsluhováno více než 50 zemí
      description: Export do Evropy, Ameriky, Středního východu, Asie a Tichomoří a Afriky.
      icon: tabler:globe
leadership:
  tagline: Vedení
  title: Vedení managementu a inženýrství
  subtitle: Náš vedoucí tým spojuje hluboké odborné znalosti v oblasti námořního inženýrství, mezinárodního obchodu a řízení kvality.
  columns: 3
  items:
    - title: Zakladatel a CEO
      name: Toby Liu
      description: 15+ let v námořní výrobě. Dříve vedl výzkum a vývoj u významného čínského výrobce lodí. Je držitelem několika patentů v designu nafukovacího člunu.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: Hlavní inženýr
      name: Zhang Wei
      description: 20+ let ve výrobě PVC/Hypalon a deep-V designu trupu. Bývalý technický ředitel v evropské firmě zabývající se námořním inženýrstvím.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Vedoucí výzkumu a vývoje
      name: Chen Ming
      description: PhD v oboru materiálové vědy. Specializuje se na technologii kapkového stehu a vysokofrekvenční svařovací procesy. 10+ let v textilních kompozitech.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Výrobní ředitel
      name: Liu Qiang
      description: Více než 18 let v oblasti štíhlé výroby a optimalizace výrobních linek. Černý pás Six Sigma. Implementováno ISO 9001 systémů kvality.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Manažer kvality
      name: Wang Fang
      description: 12+ let v námořní kontrole kvality. Certifikovaný auditor CE a ISO. Dohlíží na testování každé výrobní šarže.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Obchodní a provozní ředitel
      name: Helen Lee
      description: 15+ let v mezinárodním B2B obchodu. Spravováno OEM/ODM partnerství ve více než 30 zemích. Plynule 4 jazyky.
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Filozofie designu
  title: Design pod vedením inženýrů<br />— Na každém detailu záleží
  subtitle: Naše inženýrská filozofie se soustředí na tři principy, kterými se řídí každý produkt, který vyrábíme.
  list:
    - 'Spolehlivost na prvním místě: Každý Aquafarer produkt je testován, aby obstál v reálných podmínkách – od záchranných operací ve studené vodě po pronájmy tropických letovisek. Překonstruujeme tam, kde na tom záleží nejvíce.'
    - 'Výrobní přesnost: Naše zařízení využívají CNC řezání, vysokofrekvenční svařování a automatizované tlakové zkoušky. Každý šev, každý ventil, každá armatura splňuje dokumentované specifikace.'
    - 'Neustálé inovace: Náš R&D tým neustále vyhodnocuje nové materiály, výrobní metody a konstrukční vylepšení. Nečekáme na problémy – my je předvídáme.'
cta:
  title: Chcete diskutovat o projektu s naším týmem?
