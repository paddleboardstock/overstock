label: Záruka
headline: Aquafarer Omezená záruka výrobce
subtitle: Aquafarer stojí za kvalitou každého nafukovacího námořního produktu, který vyrábíme. Tato omezená záruka stanoví podmínky a pokrytí pro váš produkt Aquafarer.
seo:
  headline: Aquafarer Záruka na nafukovací člun – 5letá omezená záruka | Aquafarer
  description: Aquafarer nabízí 5letou omezenou záruku na tkaninu primární trubky, švy a integritu konstrukce trupu ze skelných vláken. Také zahrnuje nafukovací ventily a továrně instalované příslušenství. Úplné podmínky záruky na nafukovací člun Aquafarer.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Tato omezená záruka se vztahuje na nové nafukovací námořní produkty značky Aquafarer zakoupené přímo od společnosti Aquafarer nebo od autorizovaného prodejce či obchodníka Aquafarer. Účinným datem je ověřitelné datum původního maloobchodního nákupu.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Rozsah a doba trvání záruky</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Integrita primární tkaniny trubek (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturální integrita sklolaminátového trupu</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Schopnost švů nafukovacích trubek udržet vzduch</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Funkčnost plnicího ventilu</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 rok</h3>
        <p class="text-sm text-gray-600 mt-1">Z výroby instalované příslušenství a pomocné armatury</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 rok*</h3>
        <p class="text-sm text-gray-600 mt-1">Komerční, půjčovací nebo flotilní využití – všechny komponenty</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komerční, vládní, charterové, půjčovací nebo instruktážní využití sráží záruku na 1 rok. Závodní nebo soutěžní využití záruku zcela ruší.</p>
  </div>

  <h2>Co je kryto zárukou</h2>
  <h3>Primární tkanina trubek (5 let)</h3>
  <p>Aquafarer poskytuje záruku na hlavní tkaninu trubek proti zhoršení porozity, které podstatně ohrožuje schopnost produktu udržet provozní tlak. Toto se vztahuje na tkaninu potaženou CSM (Hypalon) a všechny ostatní tkaniny trubek použité ve výrobě.</p>

  <h3>Strukturální integrita sklolaminátového trupu (5 let)</h3>
  <p>U produktů se sklolaminátovým (FRP) trupem je základní kompozitová konstrukce kryta zárukou proti strukturálnímu selhání v důsledku vad materiálu nebo zpracování.</p>

  <h3>Schopnost švů nafukovacích trubek udržet vzduch (5 let)</h3>
  <p>Švy nafukovacích trubek, spojované během výroby, jsou kryty zárukou proti výrobním vadám způsobujícím podstatný únik vzduchu švem. Podmínkou krytí je periodická kontrola a udržování odpovídajících plnicích tlaků.</p>

  <h3>Funkčnost plnicího ventilu (5 let)</h3>
  <p>Vzduchové plnicí ventily původně instalované společností Aquafarer jsou kryty zárukou proti výrobním vadám materiálu nebo zpracování, které brání ventilu udržet vzduch tak, jak je navržen.</p>

  <h3>Z výroby instalované příslušenství (1 rok)</h3>
  <p>Komponenty a armatury vyrobené společností Aquafarer a původně instalované v továrně jsou kryty zárukou proti vadám materiálu a zpracování po dobu jednoho roku. To se nevztahuje na položky třetích stran, které jsou kryty pouze zárukami jejich příslušných výrobců.</p>

  <h2>Co není kryto zárukou</h2>
  <ul>
    <li>Kosmetické vady včetně zabarvení, skvrn, vyblednutí, křídování nebo jakékoli změny vzhledu</li>
    <li>Propíchnutí, řezy, trhliny, roztržení nebo jiné fyzické poškození</li>
    <li>Prasklinky, praskliny, oděr, odření nebo zhoršení v důsledku tření nebo kontaktu</li>
    <li>Degradace v důsledku expozice UV záření, povětrnostním vlivům nebo atmosférickým podmínkám</li>
    <li>Poškození kontaktem s palivy, rozpouštědly, kyselinami, zásadami nebo chemikáliemi</li>
    <li>Poškození z nedbalosti, nesprávného použití, týrání, nehody nebo běžného opotřebení</li>
    <li>Problémy povrchu gelcoatů nebo nátěrů (puchýře, prasklinky, zabarvení, vyblednutí)</li>
    <li>Poškození nárazem, napětím, nesprávným uložením nebo přepravou na přívěsu</li>
    <li>Poškození z nesprávného nafouknutí/vyfouknutí nebo použití neschválených plnicích zařízení</li>
    <li>Vybavení, komponenty nebo systémy třetích stran (kryty jejich příslušnými výrobci)</li>
  </ul>

  <h2>Povinnost výrobce a náprava</h2>
  <p>Jedinou a výhradní povinností společnosti Aquafarer je oprava nebo náhrada – dle volby Aquafarer – jakékoli komponenty, u které bylo zjištěno, že je vadná z hlediska materiálu nebo zpracování a je kryta touto zárukou. Opravy nebo náhrady provádí Aquafarer nebo jeho určené autorizované servisní zařízení. Opravené nebo nahrazené komponenty jsou kryty zárukou pouze po zbývající část původní záruční doby.</p>

  <h2>Podmínky záruky</h2>
  <ul>
    <li><strong>Registrace:</strong> Produkt musí být řádně zaregistrován podle ustanovení záručních podmínek.</li>
    <li><strong>Údržba:</strong> Produkt musí být udržován v souladu s publikovanými pokyny společnosti Aquafarer, včetně periodické kontroly a udržování odpovídajících plnicích tlaků.</li>
    <li><strong>Spolupráce:</strong> Kupující musí plně a neprodleně spolupracovat se společností Aquafarer ve všech záležitostech týkajících se záručních nároků.</li>
    <li><strong>Původní kupující:</strong> Tato záruka je poskytována výhradně původnímu koncovému kupujícímu a není přenositelná.</li>
  </ul>

  <h2>Komerční využití</h2>
  <p>Pokud je produkt používán ke komerčním, vládním, neziskovým, charterovým, půjčovacím, instruktážním nebo jakýmkoli jiným účelům než soukromá rekreace, záruční doba pro všechny komponenty se sráží na jeden (1) rok od původního data maloobchodního nákupu. Využití v závodech, rychlostních nebo vytrvalostních soutěžích okamžitě a neodvolatelně ruší záruku zcela.</p>

  <h2>Jak uplatnit záruční nárok</h2>
  <p>Kontaktujte společnost Aquafarer nebo svého autorizovaného prodejce s dokladem o nákupu a podrobným popisem problému. Aquafarer nárok posoudí a poskytne pokyny pro kontrolu a servis.</p>
  <p>Dotazy k záručnímu servisu nám zasílejte prostřednictvím naší <a href="/contact" class="text-sky-600 underline">kontaktní stránky</a> s číslem objednávky a údaji o produktu.</p>

  <h2>Položky třetích stran</h2>
  <p>Vybavení, komponenty nebo systémy vyrobené třetími stranami (i když je instalovala společnost Aquafarer) jsou kryty výhradně případnou zárukou jejich příslušného výrobce. Aquafarer výslovně popírá jakoukoli záruční odpovědnost za takové položky třetích stran.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Toto záruční prohlášení je shrnutím úplné Omezené záruky výrobce Aquafarer. Úplný právní záruční dokument řídí veškeré záruční podmínky. Technické specifikace se mohou měnit bez předchozího upozornění. Aquafarer je tovární značka výrobního centra Aquafarer Qingdao.
  </p>
