hero:
  tagline: Výrobní kapacita
  title: Výrobní kapacita a roční produkce
  subtitle: Zařízení o rozloze 12 000 m² produkující 15 000 lodí ročně s prostorem pro přizpůsobení
intro: Aquafarer provozuje jedno z největších vyhrazených výrobních závodů na výrobu nafukovacích člunů v Qingdao v Číně. Naše továrna o rozloze 12 000 m² je organizována do šesti specializovaných dílen fungujících paralelně, což nám dává kapacitu na výrobu 15 000 lodí ročně napříč SUP, kajaky, čluny, RIB a linky bezpečnostního vybavení.
highlights:
  - value: 12 000 m²
    label: Celková výrobní podlaha
    detail: Přes 6 specializovaných dílen
  - value: 15,000
    label: Lodě vyráběné ročně
    detail: SUPy, kajaky, RIB, čluny, bezpečnostní vybavení
  - value: 200-300
    label: Kvalifikovaná pracovní síla
    detail: 25+ inženýrů, 2 směny/den
  - value: 50+
    label: Exportní země
    detail: EU, USA, AU, Střední východ, Asie
  - value: 30–45
    label: Standardní dodací lhůta (dny)
    detail: Od potvrzení objednávky do FOB
  - value: 10+
    label: Dlouholeté zkušenosti s exportem
    detail: Od roku 2012
workshops:
  - title: SUP Výroba desek
    description: '4 paralelní montážní linky pro nafukovací prkna SUP. Každá linka dokáže vyrobit 50–80 desek za směnu. Souběžně běží stanice digitálního tisku a sítotisku. Roční kapacita SUP: 8 000+ desek.'
    output: 8 000+ SUP/rok
  - title: RIB Výroba lodí
    description: 'Specializovaná dílna na výrobu trupů ze skelných vláken se 6 formovacími stanicemi pro RIB trupů do 7,6 m. Oblast svařování a montáže trubek zvládne 3–5 RIB současně. Roční kapacita RIB: 2 000+ lodí.'
    output: 2000+ RIB/rok
  - title: Nafukovací člun a člun
    description: 'Víceúčelové výrobní linky pro nafukovací čluny, kajaky a čluny. Horkovzdušné svařovací stanice, vysokofrekvenční dielektrické lisy a montážní pracoviště jsou překonfigurovány na základě objednávky. Roční kapacita: 5 000+ jednotek.'
    output: 5 000+ jednotek/rok
  - title: Bezpečnostní zařízení
    description: 'Oddělený prostor pro výrobu záchranných vest a bezpečnostního vybavení v čistých prostorách. Vyhrazené šití, vkládání pěny a testovací stanice. Roční kapacita záchranné vesty: 50 000+ jednotek.'
    output: 50 000+ záchranných vest/rok
oem_capacity:
  moq: 'SUP: 5–10 jednotek | RIB: 2–5 jednotek | Kajak/Dinghy: 10–20 jednotek | Vlastní forma: 200+ jednotek'
  lead_time: Standardní 30–45 dní. Vzorek 15–20 dní. Spěch k dispozici.
  payment: T/T 30% záloha + 70% před odesláním. L/C, přijímáme Western Union.

