hero_text:
  tagline: Zdroje
  title: Centrum stahování a průvodce kupujícími
  subtitle: Získejte přístup ke katalogům produktů, příručkám OEM, kontrolním seznamům kupujících a technické dokumentaci, které vám pomohou přijímat informovaná rozhodnutí o nákupu.
features3_downloads:
  tagline: Stahování
  title: Produktová dokumentace<br />a zdroje pro kupující
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog námořních produktů 2026
      description: Kompletní sortiment zahrnující RIB čluny, nafukovací čluny, SUP prkna, kajaky a příslušenství. Specifikace, konfigurace a možnosti. ve formátu PDF.
      icon: tabler:file-text
    - title: Průvodce OEM výrobou
      description: 'Vše, co potřebujete vědět o partnerstvích OEM/ODM: přehled procesů, minimální objednací množství, možnosti přizpůsobení, kontrola kvality a doprava.'
      icon: tabler:building-factory
    - title: RIB Průvodce kupujícím lodí
      description: 'Jak vybrat správný RIB: materiály trupu, materiály trubek, výběr motoru, úvahy o velikosti a možnosti konfigurace pro různé aplikace.'
      icon: tabler:file-description
    - title: SUP Kontrolní seznam dodavatelů
      description: 'Klíčová hlediska při výběru výrobce desek SUP: indikátory kvality, požadavky na certifikaci, úvahy o MOQ a na co se zaměřit při auditu továrny.'
      icon: tabler:clipboard-check
    - title: Průvodce materiálem nafukovacího člunu
      description: 'PVC vs Hypalon: srovnání trvanlivosti, odolnosti vůči UV záření, životnosti, možností oprav a nákladů na různé námořní aplikace.'
      icon: tabler:files
    - title: Zakázková výroba stručná šablona
      description: Stáhněte si naši šablonu stručného popisu produktu. Vyplňte své požadavky a zašlete nám jej k vypracování cenové nabídky a posouzení proveditelnosti ve stejný týden.
      icon: tabler:template
faqs:
  title: Často kladené otázky
  subtitle: Běžné otázky týkající se našich produktů, výrobního procesu a modelu partnerství.
  columns: 2
  items:
    - title: Jaké je minimální množství objednávky?
      description: MOQ se liší podle kategorie produktu. RIB lodě obvykle začínají od 10 jednotek na model. SUP desky od 50 jednotek. Informace o MOQ konkrétních produktech získáte od našeho prodejního týmu.
      icon: tabler:help-circle
    - title: Mohu získat vzorky před zadáním objednávky?
      description: Ano. Aquafarer poskytuje výrobu vzorků pro hodnocení před hromadnou výrobou. Náklady na vzorky jsou smluvní a často se připisují k první výrobní zakázce.
      icon: tabler:package
    - title: Jaké platební podmínky jsou k dispozici?
      description: Standardní podmínky jsou 30% záloha s objednávkou, 70% před odesláním. Podmínky LC dostupné pro kvalifikované zákazníky. Kontaktujte náš finanční tým a domluvte se na podmínkách.
      icon: tabler:currency-dollar
    - title: Jak dlouho trvá výroba?
      description: 'Typické dodací lhůty: RIB člunů 30-45 dní, SUP prkna 20-30 dní, nafukovací čluny 25-35 dní. Vlastní vývoj přidává 15–30 dní na prototypování.'
      icon: tabler:calendar-clock
    - title: Jaké certifikace nesou vaše produkty?
      description: CE certifikace pro trhy EU, výroba schválená Pobřežní stráží USA, ISO systém kvality, BSCI shoda a REACH materiál.
      icon: tabler:certificate
    - title: Nabízíte vlastní balení a branding?
      description: Ano. Poskytujeme zakázkové balení s vaším logem, barvami a identitou značky. MOQ pro vlastní balení závisí na kategorii produktu.
      icon: tabler:color-swatch
cta:
  title: Potřebujete pomoc s nalezením správného zdroje?
  subtitle: Kontaktujte náš tým pro personalizované rady ohledně výběru produktů, OEM partnerství nebo technických specifikací.
  actions:
    - variant: primary
      text: Kontaktujte náš tým
      href: /contact

