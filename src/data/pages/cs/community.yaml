stories:
  tagline: Příběhy průzkumníků
  title: Skutečná dobrodružství od skutečných lidí
  subtitle: Poslechněte si vodáky, rodiny a profesionály, kteří na vodě používají vybavení Paddle Board Overstock.
  items:
    - name: Sarah a Mike
      title: SUP Majitelé Explorer 11, Kanada
      content: Vzali jsme naše Explorer 11 na týdenní výlet po parku Algonquin. Krásně zvládli převozy a přejezdy přes jezero. Konstrukce drop-stitch znamenala, že jsme mohli nafouknout na 15 PSI a získat výkon pevné desky ze sbalitelné desky.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Jezdec Cheetah Surge, Španělsko
      content: Cheetah Surge je můj cíl pro pobřežní plavby. Živý design otočí hlavu na pláži a stabilita mi dodává jistotu v lehkém sekání. Krásně se ovládá, ať už jsem na turné nebo si jen užívám západ slunce.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Španělsko
    - name: Lina a rodina
      title: Floating Lotus paddlers, Švédsko
      content: Víkendová rodinná dobrodružství na souostroví. Flowing Lotus je dostatečně stabilní, aby na něm moje dcera stála, zatímco já pádluji. Nafoukne se za méně než 10 minut — není potřeba žádný přívěs, jen čistá rodinná zábava na vodě.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholmské souostroví, Švédsko
    - name: pplk. Andres
      title: Průzkumník Ocean Voyager, Filipíny
      content: Svůj Ocean Voyager používám na dálkové pobřežní výlety po Palawanu. Po měsících každodenního používání v tropických podmínkách je prkno stále jako nové. Cestovní tvar prořezává řez, který by zastavil menší prkna.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipíny
    - name: Emma T.
      title: Tropical Breeze poprvé, Austrálie
      content: Nikdy předtím jsem nebyl na SUP. Tropical Breeze je tak stabilní, že jsem se na první pokus cítil sebejistě. Teď pádluji každý víkend. Křivka učení je v podstatě nulová – a deska vypadá na vodě úžasně.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Austrálie
