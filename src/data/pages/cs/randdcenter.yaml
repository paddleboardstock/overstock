hero:
  tagline: Výzkumné a vývojové centrum
  title: Centrum výzkumu a vývoje
  subtitle: Zaměřeno na pokrok
intro:
  - Výzkumné a vývojové (R&D) centrum společnosti Aquafarer je hybnou silou našeho poslání převratně změnit vybavení pro vodní sporty. Milovníkům vodních sportů po celém světě poskytujeme bezpečnější, pohodlnější a příjemnější produkty prostřednictvím vytrvalých inovací v oblasti nafukovacích paddleboardů (SUP) a člunů. Náš oddaný tým inženýrů, designérů a vášnivých odborníků na vodní sporty utváří budoucnost tohoto odvětví a neustále zvyšuje laťku kvality, výkonu a udržitelnosti.
  - Naše výzkumné a vývojové zařízení sdružuje materiálové vědce, námořní architekty a výrobní inženýry pod jednou střechou. Od formulace tkaniny a simulace trupu až po vývoj svařovacího procesu a úplné zkoušky na moři, každá fáze vývoje produktu je řízena daty a ověřena testováním.
mission:
  tagline: Naše poslání
  title: Inovace budoucnosti vodních sportů
  pillars:
    - icon: lightning
      title: Technologický pokrok
      desc: Průkopník nových materiálů, designů a výroby pro vynikající výkon a dlouhou životnost produktu.
    - icon: design
      title: Design zaměřený na uživatele
      desc: Hluboké pochopení a překonání potřeb uživatelů prostřednictvím ergonomického a intuitivního designu produktu.
    - icon: globe
      title: Udržitelné postupy
      desc: Minimalizace naší ekologické stopy používáním ekologických materiálů a procesů.
    - icon: shield
      title: Bezkompromisní bezpečnost
      desc: Zajištění nejvyšších bezpečnostních standardů prostřednictvím přísného testování a certifikace.
pillars:
  - title: Technologický pokrok
    desc: Průkopník nových materiálů, návrhů a výrobních procesů s cílem zajistit vynikající výkon produktu a dlouhou životnost.
    icon: tech
  - title: Pokročilé materiály
    desc: Zkoumání špičkových PVC, Hypalon, kompozitů a udržitelných alternativ pro vylepšené vlastnosti produktu.
    icon: materials
  - title: Udržitelnost
    desc: 'Základní závazek: Jsme oddáni péči o životní prostředí prostřednictvím udržitelné výroby a recyklovatelných materiálů.'
    icon: sustainability
capabilities:
  tagline: Schopnosti
  title: Schopnosti výzkumu a vývoje
  subtitle: Čtyři základní disciplíny, které nám poskytují úplnou kontrolu nad vývojem produktů – od výzkumu surovin až po konečnou certifikaci.
  groups:
    - title: Materiálová věda a technologie tkanin
      items:
        - PVC a Hypalon formulační analýza a optimalizace
        - UV stabilizace, zpomalení hoření a vývoj antimikrobiálních aditiv
        - Vícevrstvá laminace tkanin a adhezní inženýrství
        - Zrychlené testování stárnutí (UV, teplo, vlhkost, solná mlha)
    - title: Konstrukce trupu a hydrodynamika
      items:
        - Parametrický 3D návrh trupu a optimalizace CFD
        - Analýza konečných prvků pro strukturální a rázové zatížení
        - Testování tažných nádrží v měřítku a ověřování výkonu
        - Vlastní vývoj trupu pro speciální profily misí
    - title: Technologie svařování a spojování
      items:
        - Vývoj a optimalizace procesu RF dielektrického svařování
        - Metody svařování horkým vzduchem, horkým klínem a ultrazvukem
        - Kvalifikace lepení a lepení švů
        - Modelování pevnosti svaru a predikce životnosti
    - title: Testování, certifikace a shoda
      items:
        - Řízení kvality a CE testování shody
        - Nezávislá podpora testování a certifikace třetí stranou
        - Vývoj vlastního testovacího protokolu pro kvalifikaci nákupu
        - Analýza provozních poruch a vyšetřování hlavních příčin
