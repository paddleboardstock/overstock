rd_services:
  tagline: Vlastní výzkum a vývoj
  title: Služby výzkumu a vývoje pro partnery
  services:
    - title: Vývoj materiálu na zakázku
      desc: Vyvíjíme zakázková složení tkanin, vrstvené sestavy a lepicí systémy přizpůsobené vašemu provoznímu prostředí a výkonnostním cílům.
    - title: OEM / ODM Produktové inženýrství
      desc: Od koncepčních náčrtů až po technické balíčky připravené k výrobě – náš tým může navrhnout, prototypovat a ověřit lodě pod vaší značkou.
    - title: Testování a certifikace třetí stranou
      desc: Využijte naše testovací zařízení vyhovující ISO pro nezávislé testování materiálů, validaci produktů a podporu certifikace.
  cta: Prodiskutujte své požadavky na výzkum a vývoj →
  cta_link: /contact
vision:
  tagline: Naše vize
  title: Formování budoucnosti vodních sportů
  body: Aquafarer se snaží vést nafukovací člun a průmysl SUP prostřednictvím neustálých inovací, neochvějné kvality a trvalého závazku k bezpečnosti a udržitelnosti – což v konečném důsledku obohacuje zkušenosti milovníků vodních sportů po celém světě. Centrum výzkumu a vývoje Aquafarer je místo, kde se vášeň snoubí s inovací a nastavuje nové standardy pro odvětví vodních sportů.
labs_section:
  tagline: Laboratoře
  title: Naše laboratoře
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: Laboratoř PVC tkanin
      description: Nepřetržitý výzkum a testování tkanin PVC a Hypalon z hlediska pevnosti v tahu, odolnosti vůči UV záření, otěru a pružnosti při nízkých teplotách, aby byla zajištěna dlouhodobá spolehlivost v mořském prostředí.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studio inženýrství trupů
      description: CAD-řízený design a analýza konečných prvků HDPE, hliníku a trupů ze skelných vláken. Každý trup je digitálně simulován z hlediska rozložení napětí a odolnosti proti nárazu před vyrobením prvního prototypu.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF svářečské centrum
      description: Specializované zařízení pro vysokofrekvenční svařování s přesnou regulací teploty a tlaku, vytvářející vysoce pevné, vzduchotěsné švy, které splňují normy námořního průmyslu pro nafukovací plavidla.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hydrodynamická zkušební nádrž
      description: Testování zmenšeného modelu v naší interní testovací nádrži pro optimalizaci tvaru trupu, hoblování, stability a spotřeby paliva v celé řadě zatížení a podmínek na moři.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypový workshop
      description: Zařízení na výrobu prototypů a vybavení v plném měřítku, kde se staví, montují a zkouší na moři nové modely. Každý prototyp prochází před schválením výroby minimálně 20hodinovým testovacím programem ve vodě.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratoř kvality a kontroly
      description: Specializovaná laboratoř pro zajištění kvality provádějící zkoušky tahem, cyklování zadržování vzduchu, zkoušky odlupování švů a certifikaci materiálu, aby bylo zajištěno, že každá loď opouštějící dílnu splňuje naše zveřejněné specifikace.
      href: /randdcenter/quality-inspection-lab

