content_challenge:
  tagline: Výzva
  title: Požadavky akvakultury<br />Zařízení odolné vůči slané vodě
  subtitle: Rybí farmy, perlové farmy a oceánské ranče fungují v chemicky nejagresivnějším mořském prostředí – dlouhodobé vystavení slané vodě, zbytky paliva a krmiva a nepřetržité každodenní používání.
  paragraphs:
    - Akvakultura probíhá 365 dní v roce v exponovaných pobřežních a pobřežních prostředích. Pracovní čluny používané pro kontrolu klecí, přepravu krmiva, údržbu perlové šňůry a servis zařízení čelí neustálému ponoření do slané vody, vystavení UV záření a chemickému kontaktu z paliv, krmiva pro ryby a přípravků proti usazeninám.
    - '**Koroze je primární nepřítel** — Standardní námořní vybavení se v těchto podmínkách rychle kazí. Přívěsné motory, rámy přívěsů a kování trupu vyžadují neustálou výměnu. Provozovatelé potřebují lodě vyrobené z materiálů odolných proti korozi, které mohou v tomto prostředí přežít roky bez degradace.'
    - '**Denní spolehlivost je kritická** — Porouchaný pracovní člun znamená promeškané plány krmení, opožděné sklizně a drahé výrobní ztráty. Pro perlové farmy může jediný den zmeškané kontroly znamenat značné škody na úrodě. U rybích farem ovlivňuje opožděné krmení rychlost růstu a ziskovost.'
    - Paddle Board Overstock akvakulturní RIB jsou zkonstruovány s korozivzdorným hardwarem, odolnými Hypalon trubkami a vyztuženými trupy navrženými speciálně pro náročné podmínky chovu ryb, pěstování perel a mořské farmy.
content_solution:
  tagline: Naše řešení
  title: Účelová RIB<br />Pro průmysl akvakultury
  subtitle: Každý pracovní člun Paddle Board Overstock pro akvakulturu je navržen tak, aby vydržel agresivní prostředí se slanou vodou a zároveň poskytoval spolehlivý každodenní výkon.
  list:
    - Trubky mořské třídy Hypalon – vynikající odolnost vůči UV záření, slané vodě, palivům a chemikáliím pro krmení ryb
    - Nerezové kování 316 – žádná koroze při dlouhodobém vystavení slané vodě
    - Zesílené třecí lišty a ochrana kýlu pro opakovaný kontakt s dokem a klecí
    - Samovysouvací plošina pro snadné mytí a odvodnění po přepravě krmiva a sklizni
    - Konfigurace s plochou palubou pro přenášení pytlů na krmení, sběrných nádob a vybavení
    - Vnější konfigurace od 15 HP do 60 HP – optimalizované pro užitečné zatížení vs. palivovou účinnost
    - Vysoce viditelné barevné možnosti trubice pro snadné nanášení na velké zemědělské plochy
content_segments:
  tagline: Profily akvakultury
  title: Řešení pracovních člunů<br />Podle typu akvakultury
  subtitle: Různé provozy akvakultury mají různé požadavky na pracovní čluny – od malých agilních RIB pro kontrolu rybích klecí až po stabilní přepravní plošiny pro chov perel a těžké pracovní čluny pro oceánské farmy.
  items:
    - title: Provoz chovu ryb
      subtitle: Kontrola klecí, doprava krmiva, podpora sklizně
      description: Mořské rybí farmy provozují klece v exponovaných pobřežních a pobřežních lokalitách. Pracovní lodě se denně používají pro kontrolu sítě klecí, krmení, podporu sklizně a údržbu zařízení. Primárním problémem je koroze – lodě jsou neustále vystaveny slané vodě, zbytkům krmiva pro ryby a palivu. Spolehlivý pracovní člun je nezbytný, protože zmeškané krmení nebo opožděná sklizeň přímo ovlivňuje produkci a ziskovost.
      features:
        - 'Balíček pro agresivní prostředí: kování z nerezové oceli 316, komponenty z námořní slitiny'
        - Ploché uspořádání paluby pro přepravu pytle na krmení a sběrného koše
        - Samovysouvací paluba pro snadné umytí po operacích
        - Hypalon trubky s chemicky odolným povlakem pro expozici krmivu a palivu
        - Zesílené třecí lišty pro častý kontakt s klecí a dokem
    - title: Provoz perlových farem
      subtitle: Stabilní přeprava pro kontrolu perlové linky a sklizeň
      description: Perlové farmy vyžadují stabilní a spolehlivé pracovní lodě pro každodenní přepravu mezi perlami, kontrolu sítí ústřic a sběr sklizně. Tyto operace probíhají ve vzdálených pobřežních lokalitách s omezenou infrastrukturou údržby. Loď musí být dostatečně stabilní, aby z ní mohla posádka pracovat při prohlídce šňůr s perlami, se snadným nastupováním a dostatečným prostorem na palubě pro přepravu sklizených ústřic, sítí a zásob. Spolehlivost a snadná údržba jsou na odlehlých farmách zásadní.
      features:
        - Stabilní konstrukce trupu pro stojící posádku při kontrole perlové linie
        - Plochá paluba s protiskluzovým povrchem pro bezpečný pohyb posádky
        - Nízký volný bok pro snadný přístup k síti ústřic a sklizni
        - Jednoduchá konfigurace přívěsného motoru pro snadný servis na místě
        - Tuba a hardware odolný proti korozi pro nepřetržité vystavení slané vodě
    - title: Mořské ranče a posílení mořských ekosystémů
      subtitle: Transport mláďat, obsluha klecí, podpora monitoringu
      description: Oceánské farmářské operace zahrnují vypouštění nedospělých populací do spravovaných mořských prostředí, sledování růstu a údržbu vylepšených struktur. Pracovní čluny potřebují přepravovat živá mláďata v provzdušňovaných kontejnerech, nést monitorovací zařízení a přistupovat k mělkým místům vypouštění na pobřeží. Konstrukce trupu musí vyvážit nosnost s mělkým ponorem pro přístup na pláž a ústí.
      features:
        - Palubní prostor pro provzdušňované přepravní kontejnery pro mladistvé a monitorovací zařízení
        - Mělký ponor pro přístup na pláž a ústí řek
        - Snadné přistání na pláž – zesílený kýl a ochrana přídě
        - Montážní body zařízení pro monitorování elektroniky a vzorkovacího zařízení
        - Odolné trubky Hypalon pro odolnost v podmínkách smíšeného písku a mořské vody
