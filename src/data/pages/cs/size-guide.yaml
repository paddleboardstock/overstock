how_to_choose:
  title: Jak vybrat správnou velikost
  cards:
    - title: SUP Desky
      description: Délku zvolte podle své hmotnosti a zamýšleného použití. Širší prkna (32"+) nabízejí větší stabilitu. Delší prkna (11-12 stop) lépe vedou na turistiku. Těžší vodáci potřebují prkna s větším objemem.
    - title: Kajaky
      description: Jednokajaky (9 stop) jsou nejlepší pro sólové cestování a řeky. Tandemové kajaky (12 stop) pojme dva vodáky nebo jednoho dospělého s vybavením. Zkontrolujte nosnost pro celkové zatížení včetně výstroje.
    - title: Čluny a žebra
      description: Vyberte délku člunu podle počtu cestujících a zamýšleného použití. Větší RIB (4,5 m+) jsou vhodné pro offshore a záchranu. Menší čluny (2,7 m) fungují jako tendry a rybářské plošiny.

