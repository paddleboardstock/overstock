hero:
  title: Průvodce velikostmi a specifikacemi
  subtitle: Rozměry, kapacity a doporučené použití pro každý Aquafarer produkt.
categories:
  inflatable: Nafukovací SUP a kajaky navržené pro přenositelnost bez obětování výkonu. Přizpůsobte správnou velikost své váze a stylu pádlování.
  rib: Nafukovací čluny s pevným trupem pro pobřežní plavbu, hlídkování a profesionální námořní operace. Vybírejte podle délky a objemu motoru.
  accessory: Příslušenství a bezpečnostní vybavení pro doplnění vašeho plavidla. Univerzální velikost s více možnostmi.
