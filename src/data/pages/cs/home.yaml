content_customer_types:
  tagline: Koho obsluhujeme
  title: 'Stavěno pro B2B kupující<br />— ne pro maloobchod'
  subtitle: 'Aquafarer vyrábí pro čtyři typy zákazníků. Každý má jiné priority a my jim všem vyhovíme.'
  items:
    - title: 'Vlastníci značek / private label'
      description: 'Návrh produktu na míru, grafika soukromých značek, dokumentace shody pod vaší značkou a vyhrazená inženýrská podpora od konceptu až po kontejner.'
      icon: tabler:palette
      cta: 'Požádat o nabídku OEM/ODM'
      cta_href: /request-quotation
    - title: 'Distributoři / velkoobchodníci'
      description: 'Ochrana teritoria, konkurenceschopné velkoobchodní ceny, marketingové podpůrné sady, produktové školení a kompletní dokumentace shody pro váš trh.'
      icon: tabler:world
      cta: 'Žádat o dealerskou smlouvu'
      cta_href: /dealers-distributors
    - title: 'Resorty / půjčovny'
      description: 'Komerční odolnost, poradenství při velikosti flotily, smíšené kontejnerové objednávky více modelů, strategie náhradních dílů a balíčky vybavení s brandem resortu.'
      icon: tabler:beach
      cta: 'Získat komerční balíček'
      cta_href: /solutions/resorts
    - title: 'Záchrana / vláda / profesionálové'
      description: 'Konstrukce z Hypalonu/CSM, možnosti shody se SOLAS, certifikace pro konkrétní projekt, podpora dokumentace pro tendry a inženýrství chráněné NDA.'
      icon: tabler:shield
      cta: Probrat projekt
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Schopnosti OEM/ODM
  title: 'Co získáte<br />s Aquafarerem'
  subtitle: 'Přímý přístup k továrně s plnou inženýrskou, kvalitativní a compliance podporou — ne obchodní společnost.'
  columns: 2
  items:
    - title: Customizace OEM/ODM
      description: 'Návrh trupu na míru, materiál trubek (PVC nebo Hypalon/CSM), rozložení konzoly, sezení, branding, barvy a balení. Od drobných úprav po kompletní custom inženýrství.'
      icon: tabler:adjustments
    - title: Nízké MOQ, rychlé vzorkování
      description: 'RIB: 2-5 ks (existující forma). SUP: 5-10 ks na SKU. Vlastní formy: 200+ ks. Předprodukční vzorky s vaším brandingem do 7-14 dnů.'
      icon: tabler:rocket
    - title: Kvalita připravená k výrobě
      description: 'Každý kus tlakově testován na 1,25× jmenovitého PSI po dobu 24-48 hodin. Míra bezvadnosti 99,3 % dle AQL 2,5 / ISO 2859. 100bodová kontrolní lista na každý trup.'
      icon: tabler:certificate
    - title: Kompletní dokumentace shody
      description: 'CE dle 2013/53/EU (RCD), ISO 9001:2015 (SGS), sociální audit BSCI, shoda REACH, označení UKCA. DoC pro konkrétní model a data výrobního štítku zahrnuty.'
      icon: tabler:file-certificate
    - title: Dodací lhůta 30–45 dní
      description: 'Standardní výroba 30-45 dní FOB Čching-tao. Prototypy 7-14 dní. Možná expresní výroba. Plány nakládky kontejnerů a ISPM-15 bednění zahrnuty.'
      icon: tabler:truck-delivery
    - title: Poprodejní servis a náhradní díly
      description: '5letá záruka na čluny/kajaky/RIB, 2letá na SUP/příslušenství. Dodávky náhradních dílů s prioritní přepravou. Podpora při vyřizování záručních nároků.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Produktové kategorie
  title: '5 kategorií,<br />64 modelů s certifikací CE'
  subtitle: 'Od RIB tenderů 2,4 m po SUP boardy 15 ft — vše vyráběno v našem zařízení ISO 9001 v Čching-tau.'
  items:
    - title: RIB čluny
      description: '2,4 m až 7,0 m s hliníkovými nebo GRP trupy. Trubky PVC nebo Hypalon/CSM. CE dle 2013/53/EU. Konfigurace pro hlídkování, potápění, záchranu a komerční použití.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Nafukovací čluny
      description: '2,0 m až 5,0 m s hliníkovým dnem, dnem z překližky nebo vzduchovým dnem. Modely pro rybolov, rekreaci a jako tender.'
      icon: tabler:sailboat
      link: /products
    - title: 'SUP Boards'
      description: '9 ft až 15 ft v 4palcové a 6palcové drop-stitch konstrukci. Modely all-round, touring, jógové a rybářské. Komerční provedení k dispozici.'
      icon: tabler:swimming
      link: /products
    - title: Kajaky
      description: 'Nafukovací kajaky pro 1 až 3 osoby. Rekreační a touring modely s volitelným drop-stitch dnem.'
      icon: tabler:kayak
      link: /products
    - title: Bezpečnostní příslušenství
      description: 'Certifikované CE záchranné vesty, záchranná lana, opravné sady, pumpy a navigační světla. PFD schválené dle USCG Type III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Silné stránky továrny
  title: 'Výroba připravená k auditu<br />v Čching-tau'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Závod ISO 9001 o rozloze 12 000 m² — skutečný výrobce, ne obchodní společnost</h3>
  items:
    - title: '6 vyhrazených výrobních linek'
      description: 'Samostatné linky pro RIB, nafukovací čluny, SUP, kajaky, bezpečnostní vybavení a OEM/ODM. Každá s vlastními QC kontrolními body a plánováním výroby.'
    - title: '100% tlakové testování'
      description: 'Každá nafukovací komora natlakována na 1,25× jmenovitého PSI a držena 24-48 hodin. Výsledky testů navázány na sériové číslo trupu (HIN).'
    - title: 'Sledovatelnost každého trupu'
      description: 'Výrobní záznamy na úrovni HIN s 21+ datovými poli na trup: šarže materiálu, ID svářeče, výsledek tlakového testu, finální konfigurace a cíl dodání.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Výrobní závod Aquafarer o rozloze 12 000 m² s certifikací ISO 9001 v Qingdao s výrobními linkami RIB

content_compliance:
  tagline: Compliance a důkaz kvality
  title: 'Zdokumentované důkazy,<br />ne jen tvrzení'
  subtitle: 'Každé tvrzení o shodě je podloženo dokumentací pro konkrétní model, kterou si můžete ověřit.'
  items:
    - title: 'ISO 9001:2015 (SGS)'
      description: 'Systém managementu kvality certifikován TÜV Rheinland/SGS. Roční dohledové audity. Zdokumentované QC procesy od příchozího materiálu po uvolnění zásilky.'
      icon: tabler:certificate
    - title: 'CE dle 2013/53/EU (RCD)'
      description: '64 modelů s prohlášeními o shodě pro konkrétní model. Posuzování shody dle příslušných modulů. Registrace HIN a data výrobního štítku pro každý trup.'
      icon: tabler:file-certificate
    - title: 'Sociální shoda BSCI'
      description: 'Roční audit BSCI od SGS. Ověřené etické pracovní postupy, bezpečnost na pracovišti a environmentální management v celém našem závodě.'
      icon: tabler:users
    - title: 'REACH & UKCA'
      description: 'Veškeré materiály PVC a lepidla splňují nařízení EU REACH. Označení UKCA k dispozici pro britský trh. Bezpečnostní listy materiálů na vyžádání.'
      icon: tabler:shield-check

steps:
  title: 'Proces OEM/ODM — od zadání po kontejner'
  items:
    - title: 'Krok 1: <span class="font-medium">Požadavky</span>'
      description: 'Sdílejte specifikace produktu, cílový trh, množství a požadavky na shodu. Náš inženýrský tým je posoudí do 48 hodin.'
      icon: tabler:file-text
    - title: 'Krok 2: <span class="font-medium">Nabídka</span>'
      description: 'Obdržíte detailní nabídku se specifikacemi, materiálovými volbami, MOQ, cenami, dodací lhůtou a rozsahem shody pro váš trh.'
      icon: tabler:clipboard-list
    - title: 'Krok 3: <span class="font-medium">Prototyp</span>'
      description: 'Předprodukční vzorek s vaším brandingem do 7-14 dnů. Kompletní testování kvality na 1,25× jmenovitého tlaku. Cena vzorku započítána do výroby.'
      icon: tabler:settings
    - title: 'Krok 4: <span class="font-medium">Výroba</span>'
      description: 'Výroba 30-45 dní FOB Čching-tao po schválení vzorku. Průběžné QC kontroly, tlakové testy a 100bodová finální kontrola každého kusu.'
      icon: tabler:building-factory
    - title: 'Krok 5: <span class="font-medium">Dodání</span>'
      description: 'Plán nakládky kontejneru, ISPM-15 dřevěné bednění, balíček dokumentace shody a přeprava FOB Čching-tao s kompletními exportními dokumenty.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Výrobní proces OEM/ODM nafukovacích člunů Aquafareru od designu po expedici v kontejnerech

blog_latest:
  title: Oborové a technické poznatky
  information: |
    Průvodci shodou RCD, články o procesu OEM/ODM, srovnání materiálů
    a zdroje pro inspekce továrny od inženýrského týmu Aquafarer.

faqs:
  title: B2B nákupy — časté otázky
  subtitle: 'Časté otázky značek, distributorů a komerčních provozovatelů ohledně výroby OEM/ODM s Aquafarerem.'
  columns: 2
  items:
    - title: Jste výrobce, nebo obchodní společnost?
      description: 'Jsme vertikálně integrovaná továrna s plnou kontrolou kvality, materiálů a dodacích lhůt. Živnostenský list a rozsah výroby ověřitelný při auditu továrny.'
      icon: tabler:building-factory
      category: all
    - title: Jak vypadá váš proces OEM/ODM?
      description: 'Posouzení požadavků (48 h), nabídka, prototyp (7-14 dní), výroba (30-45 dní FOB Čching-tao). Kompletní inženýrská podpora, dokumentace shody a sledovatelnost každého trupu.'
      icon: tabler:route
      category: all
    - title: Jaké jsou vaše požadavky na MOQ?
      description: 'RIB čluny: 2-5 ks na model (existující forma), 200+ pro vlastní formy. SUP boardy: 5-10 ks na SKU. Smíšené kontejnerové objednávky více modelů k dispozici. Vzorkovací objednávky 2-5 ks pro ověření.'
      icon: tabler:sort-ascending
      category: all
    - title: Jaké možnosti customizace jsou k dispozici?
      description: 'Návrh trupu, materiál trubek (PVC nebo Hypalon/CSM), průměr trubek, rozložení konzoly, sezení, řízení, palivový systém, rozložení paluby, barvy značky, grafiky loga, design EVA podložek, maloobchodní balení a branding manuálů.'
      icon: tabler:adjustments
      category: all
    - title: Jaké dokumenty shody můžete poskytnout pro můj trh?
      description: 'CE DoC dle 2013/53/EU, označení UKCA, certifikát ISO 9001 (SGS), zpráva z auditu BSCI, shoda REACH, zprávy z testů materiálů, protokoly tlakových testů a data výrobních štítků pro konkrétní model. Dokumentace pro konkrétní trh na vyžádání.'
      icon: tabler:file-certificate
      category: all
    - title: Jaká je dodací lhůta vzorkování a výroby?
      description: 'Předprodukční vzorky: 7-14 pracovních dnů. Standardní výroba: 30-45 dní FOB Čching-tao. Expresní výroba za příplatek. V horní sezoně (březen-červen) se lhůty mohou prodloužit.'
      icon: tabler:clock
      category: all
    - title: Mohu si domluvit audit továrny nebo živou video prohlídku?
      description: 'Ano. Audity továrny na místě v našem závodě v Čching-tau vítáme s 3-5denním předstihem. Živé video prohlídky přes WhatsApp/Zoom okamžitě k dispozici. Inspekce třetích stran (SGS, BV, TÜV) umožňujeme.'
      icon: tabler:video
      category: all
    - title: Jaké kontroly kvality proběhnou před odesláním?
      description: 'Tlakový test na 1,25× jmenovitého tlaku (24-48 h), test pevnosti švů v ohybu, 100bodová finální kontrolní lista, kontrola rozměrů, kontrola vzhledu, ověření dokumentace shody a kontrola integrity balení. Vše dle procedur ISO 9001.'
      icon: tabler:clipboard-check
      category: all

