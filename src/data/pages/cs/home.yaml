content_customer_types:
  tagline: Koho obsluhujeme
  title: Desky pro každého<br />Druh pádlera
  subtitle: Ať už je to vaše první či padesátá lekce, existuje deska pro kanoi odpovídající tomu, jak pádlujete.
  items:
    - title: Začátečníci
      description: Extra široké, stabilní desky vhodné pro začátečníky, které usnadňují první lekci — většina začátečníků dokáže stát na desce během několika minut.
      icon: tabler:swimming
      cta: Nakupujte pro začátečníky SUPs
      cta_href: /supboard
    - title: Rodiny
      description: Stabilní prkna, která může sdílet celá rodina, plus lehčí modely pro děti — vybavení, které se vejde do auta a nafoukne během několika minut.
      icon: tabler:beach
      cta: Nakupujte rodinné balíčky
      cta_href: /products
    - title: Turisté a fitness pádlery
      description: Delší, rychlejší turistická prkna a jóga platformy s celou palubou pro pádlery, kteří zdolávají větší vzdálenosti.
      icon: tabler:route
      cta: Nakupujte turistická a jóga prkna
      cta_href: /supboard
    - title: Rybáři
      description: Ultra-stabilní platformy s držáky na vybavení a prostorem pro chladič — házejte ze tiché, hladké paluby.
      icon: tabler:lifebuoy
      cta: Nakupujte rybářské SUPs
      cta_href: /products
features:
  id: features
  tagline: Proč nakupovat od Paddle Board Overstock
  title: Skutečná továrna,<br />Skutečné úspory
  subtitle: Přímý tovární přebytek a výprodejové SUP balíčky — certifikovaná kvalita bez maloobchodní marže.
  columns: 2
  items:
    - title: Až 60 % sleva z maloobchodní ceny
      description: Prodáváme přímo tovární přebytek a výprodejové série — bez prostředníků, bez maloobchodní marže. Ta samá prkna, která se jinde prodávají za plnou cenu, tu jsou za výprodejové ceny.
      icon: tabler:rocket
    - title: Kompletní balíčky
      description: 'Každé SUP přichází jako kompletní balíček: prkno, cestovní batoh, ruční pumpa, nastavitelné pádlo, odnímatelná ploutev, spirálové vodítko a opravná sada.'
      icon: tabler:clipboard-list
    - title: Certifikovaná kvalita
      description: 13 CE-certifikovaných SUP modelů dle příslušných směrnic EU. Každé prkno je 100% tlakově testováno při 1,25x nominálním PSI před odesláním. 99,3% bezvadná míra dle AQL 2.5.
      icon: tabler:certificate
    - title: Žádné MOQ — objednejte jedno prkno
      description: Výprodej přebytků znamená, že jsou vítány objednávky jednotlivých kusů. Přidejte prkno do košíku, objednejte, hotovo. Žádné minimální množství, žádný proces nacenění.
      icon: tabler:adjustments
    - title: Rychlé celosvětové doručení
      description: Objednávky skladem jsou odeslány z Weihai do 2-3 pracovních dnů. Sledované doručení do 50+ zemí v rámci EU, Severní Ameriky, Asie-Pacific a dalších.
      icon: tabler:truck-delivery
    - title: 2letá záruka SUP
      description: Každé SUP prkno a příslušenství má 2letou záruku — včetně drop-stitch švů, ventilů pro nafukování a příslušenství. Reklamace jsou řešeny během dní, ne týdnů.
      icon: tabler:lifebuoy
content_categories:
  tagline: Kategorie produktů
  title: Jedna produktová řada,<br />Správně provedené
  subtitle: Nafukovací SUP prkna a příslušenství — vše vyrobeno v našem Weihai ISO 9001 zařízení.
  items:
    - title: SUP Desky
      description: Všestranný nafukovací SUPs od 9 do 12 stop. Stabilní, odolný a vybavený pumpou, pádlem, vodítkem a batohem.
      icon: tabler:swimming
      link: /supboard
    - title: Turné SUPs
      description: Delší a rychlejší desky s obrysy pro jezera, řeky a pobřežní průzkum.
      icon: tabler:route
      link: /supboard
    - title: Jóga a fitness SUPs
      description: Extra široké, ultra-stabilní plošiny s celoplošnými podložkami na jógu a cvičení na vodě.
      icon: tabler:users
      link: /supboard
    - title: Děti SUPs
      description: Lehčí, kratší desky pro děti — drop-stitch stejná kvalita v balení vhodném pro děti.
      icon: tabler:lifebuoy
      link: /products
    - title: Příslušenství
      description: Pumpy, pádla, záchranné vesty, vodítka, opravárenské sady a náhradní díly pro každé prkno, které prodáváme.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Tovární pevnost
  title: Proč naše výprodejové ceny<br />Jsou skuteční
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Skutečná továrna, skutečné úspory — Každá deska je odesílána z našeho zařízení ve Weihai</h3>
  items:
    - title: Stejné výrobní linky jako u hlavních značek
      description: Naše továrna Weihai o rozloze 12 000 m² vyrábí desky pro mezinárodní značky a vlastní přebytkové dávky na stejných linkách se stejnými materiály.
    - title: 100% tlaková zkouška
      description: Každé prkno je natlakováno na hodnotu 1,25x PSI a drženo před odesláním. 99,3% bezvadná míra na AQL 2,5 / ISO 2859.
    - title: Žádní prostředníci
      description: Desky jsou dodávány přímo z továrny až k vašim dveřím. Žádná přirážka distributora, žádná maloobchodní přirážka — právě proto zůstává cena slevy až o 60 % nižší než maloobchodní.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Továrna Weihai o rozloze 12 000 m² s SUP výrobními linkami nafukovacích zařízení
content_compliance:
  tagline: Shoda a důkazy kvality
  title: Certifikovaná kvalita,<br />Dokumentováno
  subtitle: Každý nárok na dodržování předpisů je podložen certifikáty a dokumentací specifickou pro model, která je k dispozici pro vaše ověření.
  items:
    - title: ISO 9001:2015
      description: Systém řízení kvality certifikovaný TÜV společností Rheinland/SGS. Roční kontrolní audity. Dokumentované procesy kontroly kvality od příchozího materiálu až po uvolnění zásilky.
      icon: tabler:certificate
    - title: CE Certifikováno
      description: 13 CE-certifikovaných SUP modelů podle příslušných směrnic EU, každý s modelově specifickým prohlášením o shodě a údaji na výrobní značce.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Všechny PVC a lepicí materiály splňují předpisy EU REACH .UKCA Označení dostupné pro britský trh. Bezpečnostní listy materiálů na vyžádání.
      icon: tabler:shield-check
    - title: 2letá záruka SUP
      description: SUP Každá deska a příslušenství byly kryty na 2 roky — drop-stitch včetně švů, nafukovacích ventilů a příslušenství. Nároky byly vyřešeny rychle.
      icon: tabler:lifebuoy
steps:
  title: Od pokladny k vodě — jak je vaše objednávka odeslána
  items:
    - title: Krok 1:<span class="font-medium">Vyberte si svou desku</span>
      description: Vyberte si z modelů all-around, touring, yoga a pro děti. Naše nákupní průvodce vám pomohou sladit velikost a styl desky s vaším pádlováním.
      icon: tabler:clipboard-list
    - title: Krok 2:<span class="font-medium">Bezpečný pokladna</span>
      description: Plaťte bezpečně přes Stripe nebo PayPal. Přijímáme všechny hlavní kreditní a debetní karty. Není potřeba účet — potvrzení objednávky dorazí do vaší e-mailové schránky.
      icon: tabler:file-text
    - title: Krok 3:<span class="font-medium">Kontrola kvality</span>
      description: Každá deska je 100 % testována tlakem při 1,25násobku jmenovité hodnoty PSI a kontrolována podle kompletního kontrolního seznamu kvality, než je zabalená.
      icon: tabler:settings
    - title: Krok 4:<span class="font-medium">Rychlé odeslání</span>
      description: Objednávky skladem jsou odesílány z naší továrny ve Weihai během 2-3 pracovních dnů. Pro naléhavé objednávky je k dispozici expresní vyřízení.
      icon: tabler:building-factory
    - title: Krok 5:<span class="font-medium">Doručení s možností sledování</span>
      description: Sledované celosvětové zasílání do 50+ zemí. Vaše dvouletá záruka a pohotová poprodejní podpora začínají od dne, kdy vaše deska dorazí.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP proces objednávky od zabezpečeného pokladního procesu po sledované doručení po celém světě
blog_latest:
  title: SUP Průvodce a technické poznatky
  information: |
    Průvodci nákupem, technika pádlování, nezbytnosti pro bezpečnost a konstrukce
    výzkum od týmu Paddle Board Overstock.
faqs:
  title: SUP Objednávání a FAQ o produktech
  subtitle: Běžné otázky ohledně našich výprodejových SUP desek, objednávání, platby, dopravy a záruky.
  columns: 2
  items:
    - title: Je těžké se naučit SUP?
      description: Vůbec ne. Většina začátečníků vstane a pádluje během své první lekce. Naše všestranné desky SUP mají extra široké stabilní platformy navržené speciálně pro začínající pádlaře. Začněte na klidné vodě a během několika minut budete plachtit.
      icon: tabler:swimming
      category: sup
    - title: Jaký je hmotnostní limit?
      description: Naše všestranná SUPs podpírá až 220 lb a platformy pro turistiku a jógu podporují až 250 lb. Každá stránka produktu uvádí přesnou nosnost jezdce, abyste mohli desku přizpůsobit svým potřebám.
      icon: tabler:adjustments
      category: sup
    - title: Mohu cestovat s nafukovadlem SUP?
      description: Rozhodně. Každá Paddle Board Overstock deska se vejde do batohu velikosti přenášecího pouzdra. Váží pouhých 18–22 lb, takže se snadno přenáší na pláž, k jezeru nebo přes letištní terminály. Před cestou si zkontrolujte zásady přepravy zavazadel vaší letecké společnosti.
      icon: tabler:truck-delivery
      category: sup
    - title: Co je v krabici?
      description: Každý Paddle Board Overstock SUP zahrnuje desku, cestovní batoh, ruční pumpu, nastavitelnou pádl, odnímatelnou ploutev, spirálové vodítko a opravný kit.
      icon: tabler:clipboard-list
      category: sup
    - title: Proč jsou vaše ceny nižší než v maloobchodě?
      description: Prodáváme přebytečné zásoby z výroby a vyřazené série přímo z našeho výrobního závodu v Weihai, Čína — bez zprostředkovatelů, bez maloobchodní přirážky. To znamená kompletní SUP balíčky až se 60% slevou z běžných maloobchodních cen, se stejnou kvalitou certifikovanou CE.
      icon: tabler:certificate
      category: orders
    - title: Jak mohu objednat a zaplatit?
      description: Přidejte svůj SUP balíček do košíku a bezpečně zaplaťte přes Stripe nebo PayPal. Přijímáme všechny hlavní kreditní a debetní karty. Každá objednávka je potvrzena e-mailem s úplnou fakturou.
      icon: tabler:file-text
      category: orders
    - title: Doručujete do celého světa?
      description: Ano. Doručujeme do 50+ zemí v EU, Severní Americe, Asii a Tichomoří, na Střední východ a do Afriky. Objednávky na skladě jsou obvykle odesílány během 2-3 pracovních dnů a sledovací číslo je poskytnuto pro každý balík.
      icon: tabler:route
      category: orders
    - title: Jakou záruku mají SUP desky?
      description: 'Každá SUP deska a příslušenství je kryto dvouletou zárukou — včetně samotné desky, drop-stitch švů a ventilů pro nafouknutí. Reklamace jsou vyřízeny během několika dní, nikoli týdnů: podání probíhá online a my opravíme nebo vyměníme.'
      icon: tabler:lifebuoy
      category: orders
