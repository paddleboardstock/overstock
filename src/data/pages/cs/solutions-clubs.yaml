        - Kompletní bezpečnostní balíček s úložnými policemi
        - Kompletní vlastní branding (deska + obal)
        - RFID sledovací systém pronájmu
        - Školení zaměstnanců a marketingové materiály
        - 2letá záruka a prioritní podpora
        - Roční program obnovy vozového parku
