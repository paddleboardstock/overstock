testimonial:
  content: Začali jsme s klubovým startovacím balíčkem pro naši školu surfování v Portugalsku. 20 desek, pádla, vesty — vše dorazilo do 3 týdnů. Po dvou sezónách jsme upgradovali na balíček Pro. Vlastní značka s naším logem změnila naši profesionální image.
  name: Ricardo Santos
  title: Majitel, Algarve Surf Academy — Lagos, Portugalsko
content_segments:
  tagline: Profily klubů
  title: Řešení klubů vodních sportů<br />Podle typu klubu
  subtitle: Od univerzitních pádlových klubů po exkluzivní soukromé jachtařské kluby – každý typ klubu má jedinečné potřeby na vybavení, způsoby použití a rozpočtové struktury. Každý balíček přizpůsobíme tak, aby odpovídal modelu klubu.
  items:
    - title: Univerzitní a vysokoškolské pádlové kluby
      subtitle: Vysoce využívané studentské flotily
      description: Studenty provozované nebo institucemi podporované kluby pádla provozující SUP a kajakářské programy pro univerzitní rekreační oddělení. Vybavení je v každém semestru vystaveno vysokofrekvenčnímu použití s ​​vysokým obratem na různých úrovních dovedností. Odolnost a snadná opravitelnost jsou zásadní, spolu s cenově výhodnými cenami pro studentské organizace.
      features:
        - Mimořádně odolná konstrukce PVC určená pro cykly používané studenty
        - Barevně odlišená deska se pohybuje podle úrovně dovedností pro snadnou správu vozového parku
        - Opravná sada + on-call video podpora součástí každé objednávky
        - Slevové ceny studentských organizací a platební podmínky na základě semestru
    - title: Komunitní pádlovací a společenské kluby
      subtitle: Členství-řízené rekreační kluby
      description: Komunitní kluby nabízející členům SUP, kajak a společenské pádlování. Vybavení musí vyvažovat výkon a pohodlí pro širokou věkovou skupinu, se značkou, která podporuje klubovou identitu a hrdost členů. Efektivita skladování je klíčová pro kluby fungující z omezeného přístupu na nábřeží.
      features:
        - 'Smíšený vozový park: všestranné SUP, turistická prkna a rekreační kajaky'
        - 'Kompletní branding klubu: vlastní barvy, tisk loga, značkové PFD'
        - Kompaktní úložná řešení pro nafukovací vybavení
        - 'Startovací sada pro růst členství: karty doporučení, značková fotografie'
    - title: Školy surfování a akademie surfování na kajaku
      subtitle: Pobřežní výkon a koučování
      description: Školy zaměřené na surfování vyučující SUP surfování, surfování na kajaku a dovednosti v jízdě na vlnách. Zařízení musí fungovat v podmínkách surfování – musí být ovladatelné, citlivé a dostatečně odolné, aby zvládlo opakované vytírání, otěr pískem a vystavení slané vodě bez rychlé degradace.
      features:
        - Kratší, širší tvary SUP optimalizované pro manévrovatelnost při surfování
        - Zesílená konstrukce kolejnic pro odolnost proti nárazu ve vlnách
        - 'Bezpečnostní výbava specifická pro surfování: stočená vodítka, možnosti s měkkými ploutvemi'
        - Program výměny vozového parku se sezónními slevami na výměnu
    - title: Firemní a soukromé jachtařské kluby
      subtitle: Prémiové členské zkušenosti
      description: Exkluzivní soukromé kluby nabízející vodní sporty jako prémiové vybavení pro členy. Standardy vybavení jsou vysoké – estetika, sladění značky a prezentace připravená pro hosty jsou stejně důležité jako výkon. Očekávané služby zahrnují dodávku v bílých rukavicích, vlastní řešení úložiště a podporu na úrovni concierge.
      features:
        - Prémiové povrchové desky s kresbou dřeva EVA a kovovými akcenty
        - Vlastní přizpůsobení barev podle pokynů klubové značky
        - 'Concierge doručení: předem nafouknuté, připravené a označené pro každou sezónu'
        - Vyhrazená správa účtů s prioritní odezvou SLA
