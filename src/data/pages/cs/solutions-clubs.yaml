hero:
  tagline: Kluby vodních sportů
  title: Vybavení a řešení<br />Pro pádlovací kluby a tréninková centra
  subtitle: Kompletní balíčky vybavení, vybavení pro instruktory, branding a podpora údržby pro SUP kluby, kajakářské kluby, školy surfování a tréninková centra vodních sportů jakékoli velikosti.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: SUP prkna Aquafarer pro kluby vodních sportů a půjčovací flotily
direct_answer: Aquafarer poskytuje komplexní řešení vybavení pro kluby vodních sportů a školicí střediska po celém světě. Naše klubové balíčky zahrnují SUP prkna, kajaky, pádla, pumpy, opravárenské sady a bezpečnostní vybavení za konkurenční velkoobchodní ceny s nízkými MOQ. Každý balíček lze upravit pomocí klubových log, značkových barev a personalizovaných obalů. Poskytujeme také školení údržby, podporu náhradních dílů a programy rotace zařízení, abychom maximalizovali životnost vašeho vozového parku.
