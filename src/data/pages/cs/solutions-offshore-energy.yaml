content_challenge:
  tagline: Výzva
  title: Energetické nároky na moři<br />Extrémní ekologická spolehlivost
  subtitle: Energetické operace na moři tlačí zařízení na limity – extrémní počasí, odlehlá místa, nepřetržité pracovní cykly a nulová tolerance k selhání.
  paragraphs:
    - Offshore energetický průmysl funguje v nejnáročnějších mořských prostředích na Zemi. Pracovní lodě podporují ropné a plynové plošiny, instalace větrných turbín, provozy podmořských kabelů a námořní stavební projekty – často v podmínkách otevřeného oceánu s omezenými okny počasí. Selhání zařízení je nejen nákladné, ale také nebezpečné.
    - '**Bezpečnost je nejvyšší prioritou** — Plavidla pro přesun posádky musí fungovat bezpečně ve státech na moři, které by zastavily ostatní operace. Povinnými požadavky jsou stabilita v místě přesunu, spolehlivý výkon motoru za každého počasí a robustní konstrukce pro opakované připojování k konstrukcím na moři.'
    - '**Schopnost za každého počasí je nezbytná** — Pobřežní větrné farmy a ropné plošiny fungují celoročně. Pracovní lodě musí fungovat v rozbouřeném moři, silném větru a omezené viditelnosti. Denní a noční provoz vyžaduje kompletní navigační soupravy a spolehlivé osvětlovací systémy.'
    - '**Sektor pobřežních větrných elektráren rychle roste** — Po celém světě se instalují tisíce nových turbín, z nichž každá vyžaduje pravidelný přesun posádky, přepravu nářadí a podporu údržby. To vytváří trvalou poptávku po účelových plavidlech pro přepravu posádky (CTV) a podpůrných plavidlech RIB.'
    - Paddle Board Overstock pobřežních energetických RIB je zkonstruováno s vyztuženými deep-V trupy, odolnými Hypalon tubusy, kompletními navigačními soupravami a bezpečnostními systémy navrženými pro extrémní podmínky pobřežních energetických operací.
content_solution:
  tagline: Naše řešení
  title: Účelově postavená Offshore RIB<br />Pro energetický průmysl
  subtitle: Každá Paddle Board Overstock energie na moři RIB je navržena pro bezpečný a spolehlivý provoz v extrémních mořských podmínkách – od Severního moře po jihovýchodní Asii.
  list:
    - Zesílený deep-V trup pro výkon na drsné vodě a předvídatelné ovládání
    - Odolné Hypalon trubky s UV a chemickou odolností pro rozšířené offshore služby
    - Hardware z nerezové oceli 316 – žádná koroze při trvalém vystavení slané vodě
    - 'Kompletní navigační sada: GPS, radar, VHF, noční navigační světla – standard na offshore modelech'
    - Samovysouvací paluba pro bezpečný provoz při nástupu na moře
    - Více konfigurací motoru – jeden nebo dva přívěsné motory pro redundanci mise
    - Tažná tyč a robustní zarážky pro manipulaci s plošinou a bójí
    - Vysoce viditelné barvy trubek pro identifikaci na offshore pracovištích
content_segments:
  tagline: Energetické profily
  title: Offshore Energy Solutions<br />Podle typu aplikace
  subtitle: Různá pobřežní energetická odvětví mají jedinečné požadavky na pracovní čluny – od RIB na podporu platformy přes CTV na větrné farmy až po podmořská inspekční plavidla.
  items:
    - title: Podpora offshore platformy pro těžbu ropy a zemního plynu
      subtitle: Přesun osádky, zásobování vybavením, bezpečnostní pohotovost na plošině
      description: Ropné a plynové plošiny vyžadují každodenní výměnu posádky, přepravu vybavení a zásob a bezpečnostní pohotovostní pokrytí. Pracovní čluny musí bezpečně provozovat kolem konstrukcí plošiny, v silných proudech a proměnlivých stavech moře a udržovat přesné umístění během přesunu personálu po žebříku nebo lávce. Extrémní prostředí – uhlovodíky, chemikálie, konstantní solná mlha – vyžaduje konstrukci odolnou proti korozi a spolehlivý výkon.
      features:
        - Konfigurace přesunu posádky s bezpečným nástupem a madly
        - Trubky Hypalon odolné proti korozi a kování z nerezové oceli 316
        - Zesílené třecí proužky pro častý kontakt s blatníkem platformy
        - Samovysouvací paluba pro zaolejovanou vodu a chemické mytí
        - Vysokokapacitní palivová nádrž pro prodloužený provozní dosah na moři
        - Možnost se dvěma motory pro kritickou redundanci
    - title: Provoz větrné farmy na moři
      subtitle: Přesun osádky, údržba turbíny, doprava nářadí
      description: Pobřežní větrná energie je nejrychleji rostoucím odvětvím mořské energie. Operátoři potřebují plavidla pro přepravu posádky (CTV), která mohou bezpečně přemístit techniky na plošiny pro přístup k turbínám v mořských státech až do 1,5 m významné výšky vlny. Stabilita během přesunu, schopnost za každého počasí a spolehlivý každodenní provoz jsou kritické. Servisní plavidla větrných farem fungují podle napjatých harmonogramů – jakékoli prostoje zdržují uvedení turbíny do provozu nebo údržbu, což má přímý dopad na příjmy z výroby energie.
      features:
        - Optimalizovaný tvar trupu pro stabilní přesun posádky na základně turbíny
        - Deep-V vstup pro pohodlnou jízdu v offshore sekání a bobtnání
        - Úplná ochrana proti povětrnostním vlivům — uzavřená konzola nebo kormidelna pro pohodlí posádky
        - Prostor pro nářadí, náhradní díly a servisní vybavení
        - Balíček nočního provozu pro prodloužené zimní směny s omezeným denním světlem
        - Tichý provoz přívěsu pro minimální dopad hluku na mořské prostředí
    - title: Podpora podmořských kabelů a potrubí
      subtitle: Kontrola, údržba, podpora ROV, průzkum
      description: Provozovatelé podmořských kabelů a potrubí potřebují pracovní čluny pro kontrolu trasy, podporu údržby, operace ROV a průzkumné úkoly. Tato plavidla vyžadují stabilní platformy pro nasazení a obnovu podvodního vybavení, přesné nízkorychlostní manévrování pro sledování kabelů a spolehlivý provoz v pobřežních a pobřežních prostředích. Stabilita lodi je rozhodující pro přesnost sonaru a průzkumného zařízení.
      features:
        - Stabilní platforma při nízké rychlosti pro sledování kabelů a průzkumné operace
        - Rozvržení otevřené paluby pro nasazení ROV, kabelové cívky a průzkumné zařízení
        - Montážní desky zařízení pro sonar, GPS a přístrojové vybavení průzkumu
        - Konstrukce trupu s nízkým vlněním pro minimální narušení mořského dna během inspekce
        - Přesné manévrování při nízké rychlosti s citlivým přívěsným řízením
    - title: Námořní inženýrství a podpora výstavby
      subtitle: Doprava osob, zásobování materiálem, podpora potápění
      description: Dodavatelé námořního inženýrství, kteří pracují na výstavbě přístavů, ochraně pobřeží a instalacích na moři, potřebují všestranné pracovní čluny pro přepravu osob mezi stavebními plavidly a pobřežím, dodávky materiálu a nástrojů, podporu potápění a průzkumy míst. Tyto lodě operují v aktivních stavebních zónách s více plavidly, omezeným manévrovacím prostorem a proměnlivými podmínkami na moři. Odolnost a všestrannost jsou prvořadé.
      features:
        - Víceúčelové rozložení paluby pro personál, materiály a potápěčské vybavení
        - Potápěčský žebřík a montáž vybavení pro podpůrné potápěčské operace
        - Odolné zarážky a tažné zařízení pro manévrování na staveništi
        - Robustní konstrukce Hypalon pro odolnost proti stavebním nečistotám a oděru
        - Flexibilní konfigurace sedadel — přeprava posádky nebo režim nákladu
