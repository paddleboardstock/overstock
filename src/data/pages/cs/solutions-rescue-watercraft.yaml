content_challenge:
  tagline: Výzva
  title: Požadavky na záchranné operace<br />Nekompromisní spolehlivost
  subtitle: Pátrací a záchranné organizace pracují s extrémní odpovědností za bezpečnost – každé selhání lodi s sebou nese nepřijatelné následky.
  paragraphs:
    - Při záchranných operacích se hranice mezi úspěchem a neúspěchem měří v minutách. Loď musí být připravena ke spuštění okamžitě, pracovat v drsných podmínkách a bezpečně se vrátit s cestujícími. Odpovědnost za bezpečnost je absolutní – mechanická porucha během záchranné mise není nákladem na opravu, je to ztráta života.
    - SAR čluny potřebují vysokou rychlost, aby se rychle dostaly k obětem, v kombinaci s výjimečnou stabilitou pro bezpečné záchranné operace. Musí nést záchranné vybavení, lékařský materiál a komunikační zařízení – často v omezeném prostoru paluby. Lodě provozované ve státních službách také potřebují dlouhou životnost (10–15+ let), aby ospravedlnily rozpočty na veřejné zakázky.
    - Viditelnost, jak pro operátora, tak pro vyhledávání, je kritická. Konstrukce konzoly musí poskytovat 360stupňovou viditelnost a loď by měla být dobře viditelná pro letadla a jiná plavidla.
    - Aquafarer záchranné RIB jsou konstruovány od kýlu nahoru pro tyto požadavky – se samovysouvacími palubami, zesílenými trupy, navigačními soupravami a vlečnými sloupy standardními u hlídkových modelů.
content_solution:
  tagline: Naše řešení
  title: Účelová záchranná žebra
  subtitle: Každý záchranný člun Aquafarer je navržen tak, aby splňoval nebo překračoval SOLAS a národní normy SAR.
  list:
    - Samovysouvací paluba – voda automaticky odtéká, aby byla zajištěna stabilita během vyprošťovacích operací
    - Zesílený deep-V trup – schopnost bouřlivé vody s předvídatelnou ovladatelností při rychlosti
    - Kompletní sada navigačních světel – funkční ve dne i v noci za všech povětrnostních podmínek
    - Vlečný sloup a vlečné lano – připraveno pro tažení plavidla nebo operace záchranných saní
    - Montážní desky zařízení — rádio, světlomet, siréna a lékařské vybavení
    - Více konfigurací motoru — redundance s jedním přívěsným motorem nebo dvěma motory
    - Barvy trubice s vysokou viditelností — oranžová, žlutá nebo červená pro maximální viditelnost
content_segments:
  tagline: Záchranné profily
  title: Řešení pro vyhledávání a záchranu vodních skútrů<br />Podle typu organizace
  subtitle: Různé záchranné organizace působí v rámci různých mandátů, rozpočtových cyklů a provozních prostředí – od pobřežních dobrovolných posádek po národní flotily pobřežní stráže. Každou záchranu RIB nakonfigurujeme tak, aby odpovídala profilu mise.
  items:
    - title: Pobřežní stráž a vládní SAR agentury
      subtitle: Absolutní odpovědnost za bezpečnost – kritické standardy vozového parku
      description: Vládní agentury SAR nesou nejvyšší odpovědnost za bezpečnost v námořních operacích. Každá loď musí fungovat bezchybně v extrémních podmínkách – selhání vybavení během záchranné mise není možné. Rozhodnutí o nákupu se řídí celkovými náklady na vlastnictví po dobu životnosti 10–15 let, nikoli cenou předem. Agentury potřebují plavidla, která přežijí roky pobřežních hlídek, splňují přísné národní standardy a poskytují konzistentní výkon napříč distribuovanými stanicemi. Povinná je komplexní dokumentace shody a víceleté servisní smlouvy.
      features:
        - SOLAS a balíček dokumentace shody s národními normami SAR
        - Shoda dílů v rámci celého vozového parku – snižuje složitost inventáře na úrovni stanice
        - Konfigurace se dvěma motory pro kritickou redundanci
        - Konstrukce s životností 10-15 let s plánovanými programy údržby
        - Schopnost za každého počasí – zesílený deep-V trup pro rozbouřené moře
    - title: Plavčík a plážová záchranná služba
      subtitle: Rychlé spuštění, operace v mělké vodě
      description: Městské a plážové plavčíky, které potřebují plavidla rychlé reakce, která dokážou vyrazit přes příbojové zóny, operovat v mělkých pobřežních vodách a dostat se k plavcům nebo plavidlům v nouzi během několika minut. Vybavení musí být dostatečně lehké pro plážové tažení malým vozidlem nebo ručně.
      features:
        - Trup s mělkým ponorem RIB pro příbojovou zónu a provoz na pobřeží
        - Možnost spouštění na pláž s rukojetí pro zvedání přídě a chráničem kýlu
        - Integrované záchranné saně nebo platforma pro záchranné plavce
        - Standardem jsou vysoce viditelné oranžové nebo žluté barvy trubek
    - title: Hasičské záchranné složky
      subtitle: Integrace požárního čerpadla, montáž zařízení, rychlá reakce
      description: Hasičské záchranné námořní jednotky reagují na požáry na nábřeží, požáry plavidel a záchranné incidenty na vodní bázi. Tyto čluny musí nést požární čerpadla, monitory, sklad hadic a dýchací přístroje – vše integrované do stabilní platformy s rychlou odezvou. Oddělení také používají tato plavidla pro reakci na povodně a operace vzájemné pomoci. Uspořádání konzoly musí obsahovat ovládání čerpadel, rádiové systémy a nouzové osvětlení, aniž by došlo k ohrožení prostoru na palubě pro pohyb posádky.
      features:
        - Požární monitor namontovaný na přídi s integračním balíčkem čerpadla
        - Montáž vyhrazeného vybavení pro požární čerpadlo, skladování hadic a sady BA
        - Rozvržení konzoly konfigurovatelné pro ovládání čerpadel, rádia a nouzového osvětlení
        - Samovysouvací paluba pro odtok vody z hašení a stabilitu
        - 'Balíček nočních operací: světlomet, osvětlení scény, pruh modrého/červeného světla'
    - title: Námořní policie a bezpečnost přístavu
      subtitle: Zákaz, hlídka, operace nastupování
      description: Námořní donucovací jednotky vyžadují plavidla schopná vysokorychlostního pronásledování, podezřelé nastupování na plavidlo a bezpečnostní hlídky v přístavu. Tyto čluny musí mít bezpečné úložiště pro donucovací zařízení a zbraně, komunikační integraci s pobřežním velením a dostatečný prostor na palubě pro operace naloďovacího týmu. Schopnost nočního provozu a nízkoprofilový přístup jsou zásadní pro mise se zákazem.
      features:
        - Schopnost vysokorychlostního pronásledování — hoblování trupu s maximální rychlostí 40 uzlů a více
        - Zabezpečte skříňku na zbraně a úložné prostory pro donucovací zařízení
        - Integrace konzoly pro policejní rádiové, MDT a komunikační systémy
        - 'Balíček nočních operací: IR reflektor, držák FLIR, skryté osvětlení'
        - Vyztužená nástupní plošina s protiskluzovým povrchem
        - Modré/červené nouzové osvětlení a siréna
    - title: Dobrovolník SAR a neziskové organizace
      subtitle: Pobřežní a jezerní operace financované z grantů
      description: Komunitní záchranné skupiny působí v jezerech, řekách a pobřežních oblastech, kde je vládní SAR pokrytí omezené. Tyto organizace často financované z darů nebo vládních grantů potřebují maximální kapacitu za dolar – spolehlivé plavidlo s nízkou údržbou, které mohou dobrovolníci bezpečně provozovat s minimálním specializovaným školením. Cykly zadávání grantů znamenají, že lodě musí splňovat požadavky na shodu a přitom zůstat v rámci pevně stanovených rozpočtů.
      features:
        - Konfigurace s jedním přívěsným motorem optimalizovaná pro nižší pořizovací a provozní náklady
        - Konstrukce PVC pro nižší nároky na údržbu a snadné opravy v terénu
        - Multifunkční konzole minimalizující elektronickou složitost pro dobrovolné operátory
        - Dokumentační balíček grantů pro žádosti o financování
        - Lehká konstrukce pro spouštění na pláž bez vyhrazeného přívěsu nebo jeřábu
    - title: Záchrana při povodních a reakce na katastrofy
      subtitle: Vnitrozemské záplavy, mělká voda, prostředí zatížené troskami
      description: Záchrana před povodněmi je odlišný operační profil – lodě operují v zaplavených městských oblastech, proudech naplněných troskami a extrémně mělké vodě, kde jsou ponořené překážky neviditelné. Operátoři potřebují plavidla, která dokážou proplouvat zaplavenými ulicemi, protlačovat trosky a vytahovat oběti z budov a vozidel. Schopnost mělkého ponoru je kritická, stejně jako schopnost pracovat v proudu s nebezpečím zachycení. Tyto čluny jsou často nasazovány hasičskými sbory, civilní obranou a nevládními organizacemi pro pomoc při katastrofách.
      features:
        - Ultra-mělký ponorný trup — funguje v 30-50 cm vody
        - Příď odvádějící nečistoty a zesílená ochrana trubky pro ponořené překážky
        - Samovylévací paluba pro odtok povodňové vody a zotavení obětí
        - Vysoce viditelné oranžové nebo žluté tubusy pro viditelnost při leteckém průzkumu
        - Lehká konstrukce pro přepravu vrtulníkem a silniční nasazení
        - Vyztužené zvedací body pro záchranné operace zvedákem a lanem
