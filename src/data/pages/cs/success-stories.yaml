hero:
  tagline: Příběhy úspěšných
  title: Skutečné výsledky od<br />stavitelů vodních podniků
  subtitle: Podívejte se, jak kluby, střediska a podnikatelé po celém světě vybudovali ziskové provozy vodních sportů s Aquafarer vybavením a podporou.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Úspěšné příběhy zákazníků Aquafareru
stories:
  - title: Jak si středomořské letovisko vybudovalo ziskový pronájem SUP
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5hvězdičkové plážové letovisko — Řecko
    problem: Středisko potřebovalo prémiové vodní aktivity pro hosty, aby zvýšilo skóre spokojenosti a vytvořilo nový tok příjmů, ale postrádalo vybavení, bezpečnostní infrastrukturu a odborné znalosti personálu.
    solution: Aquafarer dodal 50 tabulí SUP na zakázku s barvami a logem resortu, kompletní bezpečnostní systém včetně stanoviště plavčíků a bójí a 3denní program školení zaměstnanců zahrnující manipulaci se zařízením, pokyny pro hosty a bezpečnostní protokoly.
    result:
      - 300+ týdenních aktivit pro hosty rezervovaných během prvního měsíce
      - 'Skóre spokojenosti hostů s vodními aktivitami: 4,8/5'
      - 'Nový roční vedlejší příjem: 180 000 USD'
      - Nulové bezpečnostní incidenty v první provozní sezóně
      - Náklady na výměnu zařízení se snížily o 40 % oproti předchozímu dodavateli
    quote:
      text: Aquafarer nejenom dodali nástěnky – pomohli nám vytvořit kompletní zážitek pro hosty. Náš program vodních sportů se během jedné sezóny posunul od nuly k vrcholnému středisku.
      author: Generální ředitel resortu
    cta_text: Sestavte své resortové řešení
    cta_href: /solutions/resorts
  - title: Jak australský startup vybudoval značku vody za 90 dní
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: První podnikatel — Austrálie
    problem: Outdoorový nadšenec chtěl spustit svou vlastní značku SUP pro australský trh, ale neměl žádné výrobní zkušenosti, žádné dodavatelské vztahy a omezený kapitál.
    solution: Balíček uvedení značky Aquafarer poskytl konzultace ohledně výběru produktu, vlastní logo a barevný design, značkové maloobchodní balení se závěsnými štítky, CE certifikační dokumentaci a FOB dopravu do Sydney.
    result:
      - První zásilka 200 desek doručena do 75 dnů od prvního kontaktu
      - Značka byla spuštěna na Shopify + Amazon AU do 2 týdnů od příjezdu
      - Počáteční zásoby byly vyprodány za 45 dní
      - 'Průměrná marže: 55 % z maloobchodních cen'
      - 'Druhá objednávka: 500 jednotek zadaných do 60 dnů od uvedení na trh'
    quote:
      text: Měl jsem nápad na značku, ale nulové výrobní znalosti. Aquafarer mě doslova držel za ruku během celého procesu – od výběru správného designu desky až po rozbalení mé první zásilky. 90 dní od snu po doručení.
      author: Zakladatel, australská značka SUP
    cta_text: Spusťte svou značku
    cta_href: /solutions/entrepreneurs
  - title: Jak se thajský plážový klub změnil z 10 na 80 desek
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Klub vodních sportů — Thajsko
    problem: Malý plážový klub SUP v Phuketu potřeboval přejít z hobby provozu na profesionální půjčovnu sloužící turistům, ale nemohl najít spolehlivého dodavatele vybavení s konzistentní kvalitou a cenou.
    solution: Počínaje Aquafarer Club Starter Package (10 prken, pádla, bezpečnostní vybavení, branding) se klub během 18 měsíců rozrostl prostřednictvím programu Premium Package.
    result:
      - Škálováno z 10 na 80 desek za 18 měsíců se stálou kvalitou a cenou
      - Přidána půjčovna kajaků a šlapadel od stejného dodavatele
      - Vlastní značka klubu zvýšila povědomí o značce mezi turisty
      - Náklady na údržbu se snížily o 60 % oproti předchozímu rozpočtovému vybavení
      - Nyní nabízí více než 150 denních pronájmů během hlavní sezóny
    quote:
      text: Club Starter Package byl perfektním vstupním bodem. Jak naše podnikání rostlo, Aquafarer rostlo s námi – stejná kvalita, stejné ceny, žádná překvapení.
      author: Majitel klubu, Phuket
    cta_text: Zahajte svůj klubový balíček
    cta_href: /solutions/clubs
  - title: Jak řetězec karibských letovisek standardizoval vodní sporty napříč 5 vlastnostmi
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Řetězec letovisek — Karibik
    problem: Síť luxusních resortů s 5 nemovitostmi potřebovala konzistentní kvalitu vybavení pro vodní sporty a branding ve všech lokalitách, s centralizovaným nákupem a plánováním sezónních výměn.
    solution: Aquafarer dodal flotilu 300 SUP a 100 kajaků se sjednocenou značkou, sdílenými zásobami náhradních dílů a ročním plánem výměny s objemovými cenami.
    result:
      - Standardizovaná zkušenost hostů ve všech 5 zařízeních
      - 30% snížení nákladů díky konsolidovanému nákupu a množstevnímu stanovení cen
      - Centralizovaný inventář náhradních dílů zkrátil prostoje o 80 %
      - Každoroční program obnovy vybavení eliminoval tahanice na konci sezóny
      - Účast hostů na vodních sportech se meziročně zvýšila o 45 %.
    cta_text: Navrhněte svůj resortový program
    cta_href: /solutions/resorts
