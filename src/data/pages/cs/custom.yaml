hero:
  tagline: Aquafarer Vlastní laboratoř
  title: Navrhněte si vlastní<br />vodní loď
  subtitle: OEM, ODM, privátní značka a služby vlastní značky pro podniky po celém světě. Od jediného prototypu až po plné výrobní série.
  cta: Spusťte svůj projekt
  footer_link: /contact
steps_section:
  tagline: Jak to funguje
  title: Od konceptu k výrobě
  subtitle: Čtyři kroky od vašeho nápadu k hotovému produktu připravenému k moři.
  steps:
    - num: '01'
      title: Vyberte si svou tabuli
      desc: Vyberte si z našich základních modelů — SUP, kajak, člun nebo RIB. Vyberte si velikost, materiál a barvu.
    - num: '02'
      title: Nahrajte svůj design
      desc: Pošlete nám své logo, umělecká díla nebo pokyny ke značce. Náš návrhářský tým připraví digitální nátisk.
    - num: '03'
      title: Recenze makety AI
      desc: Před zahájením výroby si prohlédněte fotorealistickou maketu své vlastní desky vygenerovanou AI.
    - num: '04'
      title: Výroba a dodávka
      desc: Jakmile bude vaše objednávka schválena, vstupuje na naši ISO-certifikovanou výrobní linku. Dodací lhůty od 30 dnů.
services_section:
  tagline: Služby
  title: Výrobní služby pro světové značky
  subtitle: Flexibilní modely zapojení — od smluvní výroby po kompletní budování značky.
  items:
    - title: OEM Výroba
      desc: Vyrábíme vaše návrhy podle specifikace – vaší IP, vašich výkresů, vašich standardů kvality. Plná ochrana NDA.
      icon: ⚙️
    - title: ODM Řešení
      desc: Vyberte si z více než 50 osvědčených platforem a přizpůsobte si velikost, barvu, grafiku a balení.
      icon: 🎨
    - title: Soukromá značka
      desc: Vaše značka na našich produktech — logo, obaly, visačky, návody. Připraveno pro maloobchod po vybalení.
      icon: 🏷️
    - title: Vlastní branding
      desc: Palubní tamponový tisk, grafika trupu, obtisky trubek a vlastní štítky – plná integrace značky.
      icon: ✨
capabilities_section:
  tagline: Schopnosti
  title: Možnosti výroby a přizpůsobení
  subtitle: Vše, co potřebujete vědět před zadáním objednávky.
  capabilities:
    - label: Objem objednávky
      value: MOQ 5–10 jednotek (SUP/kajak), 2–5 jednotek (RIB)
    - label: Dodací lhůta
      value: standardně 30–45 dní; 15–20 dní u prototypů
    - label: Přizpůsobení
      value: Velikost, tvar, barva, grafika, balení, hardware
    - label: Materiály
      value: PVC, Hypalon, kapkový steh, sklolaminát, hliník
    - label: Tisk
      value: Digitální (CMYK), sítotisk, přenos tepla, sublimace
    - label: Osvědčení
      value: CE, ISO 9001, BSCI, UKCA (podpora globálního souladu)
why_section:
  tagline: Proč Aquafarer
  title: Jedna továrna. Jeden standard. Nulové kompromisy.
  points:
    - text: Integrovaný výrobní závod o rozloze 12 000 m2
      highlight: 12 000 m2
    - text: 200-300 kvalifikovaných pracovníků a inženýrů
      highlight: 200-300
    - text: 15 000 vyrobených lodí ročně
      highlight: 15 000
    - text: ISO 9001 certifikovaný management kvality
      highlight: ISO 9001
    - text: CE certifikovaných produktů pro trh EU
      highlight: CE
  cta: Zobrazit detaily továrny
  cta_link: /factory
  contact:
    title: Jste připraveni diskutovat o svém projektu?
    desc: Náš tým odpoví do 24 hodin s předběžnou cenovou nabídkou.

