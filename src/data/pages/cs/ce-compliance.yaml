content_scope:
  tagline: Rozsah shody
  title: Které produkty vyžadují<br />soulad s RCD?
  subtitle: Směrnice o rekreačních plavidlech 2013/53/EU se vztahuje na rekreační plavidla s délkou trupu mezi 2,5 m a 24 m. Pochopení rozsahu je prvním krokem k souladu.
  items:
    - title: RIB Lodě (2,5–24 m)
      description: Pevné nafukovací čluny s délkou trupu od 2,5 m do 24 m spadají pod RCD. Konstrukční kategorie A až D platí v závislosti na zamýšlených podmínkách na moři a maximální síle větru.
      icon: tabler:sailboat
    - title: Nafukovací čluny (do 2,5 m)
      description: Malé nafukovací čluny a čluny do 2,5 m mohou být částečně vyňaty z RCD, ale stále vyžadují označení CE podle jiných platných směrnic a stavebních norem EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Desky a příslušenství
      description: Stand-up paddle boardy jsou mimo rozsah RCD. Nicméně související osobní plovací zařízení (PFD) vyžadují označení CE podle nařízení OOP (EU) 2016/425 se schválením USCG typu III/V tam, kde je to vhodné.
      icon: tabler:swimming
    - title: Částečně dokončené lodě
      description: Lodě dodávané bez motoru nebo specifické instalace vyžadují prohlášení stavitele pro částečně dokončené plavidlo s úplným splněním RCD vyplněným konečným stavitelem nebo dovozcem.
      icon: tabler:tool
content_trust_layers:
  tagline: Třívrstvý důvěryhodný systém
  title: Informace o shodě<br />— Sdílené na správné úrovni
  subtitle: Ne všechna data o shodě patří na veřejný web. Dodržujeme třívrstvý přístup, který chrání IP a zároveň buduje důvěru kupujících.
  items:
    - title: Vrstva 1 — Veřejné webové stránky
      description: Odkazované normy, vysvětlené cesty shody, uvedené typy dokumentů, rozsah certifikace podle rodiny modelů. Žádné skutečné certifikáty, testovací data nebo proprietární technické detaily.
      icon: tabler:world
    - title: Vrstva 2 – Sdílení po dotazu
      description: 'Po kvalifikovaném dotazu: redigovaný vzorek DoC, fotografie stavebního štítku, seznam příslušných norem, kontrolní seznam shody a souhrny certifikace materiálů – sdílené za podmínek spravedlivého použití.'
      icon: tabler:mail
    - title: Vrstva 3 — NDA / Fáze objednávky
      description: Úplný technický soubor, posouzení rizik, výpočty stability, zprávy o zkouškách, záznamy o dávkách materiálu a dokumentace sledovatelnosti výroby – sdílené pouze v rámci NDA s potvrzenými kupujícími.
      icon: tabler:lock
content_standards:
  tagline: Platné normy
  title: ISO & EN normy<br />Vytváříme podle
  subtitle: Naše výrobky jsou navrženy a testovány podle harmonizovaných norem podle směrnice RCD. Odkazují se na standardní čísla a názvy; plné standardní texty zůstávají ISO autorským právem.
  items:
    - title: EN ISO 6185-3
      description: 'Nafukovací čluny — Část 3: Čluny s maximálním výkonem motoru 15 kW nebo více. Požadavky na konstrukci, stabilitu, vztlak a zotavení člověka přes palubu pro RIB.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Nafukovací čluny — Část 4: Čluny s maximálním výkonem motoru 15 kW a vyšším nebo rovným 4,5 kW. Další požadavky na konstrukci a stabilitu.'
      icon: tabler:file-text
    - title: Řada ISO 12215
      description: Malá plavidla — Konstrukce trupu a hranolů. Konstrukční návrh trupu, paluby a přepážek pro sklolaminátové a hliníkové RIB trupy.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Malé řemeslo — Návod k obsluze. Požadovaný obsah a formát uživatelské příručky doprovázející každou loď RIB dodanou v EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Malé řemeslo — Stavitelský štítek. Informace, které mají být vyznačeny na štítku výrobce trvale připevněném ke každému plavidlu.
      icon: tabler:badge
    - title: ISO 8666
      description: Malé plavidlo — Základní údaje. Standardizované měření a parametry pro konzistentní specifikaci v celé produktové dokumentaci.
      icon: tabler:dimensions
content_process:
  tagline: Proces shody
  title: 6-krok CE Compliance<br />Workflow
  subtitle: Od rozsahu projektu po sledovatelnost na sériové úrovni – každý model RIB sleduje definovanou cestu souladu.
  steps:
    - number: '01'
      title: Rozsah a klasifikace projektu
      description: Definujte model RIB, konstrukční kategorii (A/B/C/D), maximální počet osob, užitečné zatížení, výkon motoru a cílový trh. Určete, zda se použije RCD a který modul posuzování shody je vyžadován.
      timeline: 2–3 dny
    - number: '02'
      title: Identifikace příslušných požadavků
      description: Identifikujte všechny použitelné základní bezpečnostní požadavky z přílohy I RCD, příslušné harmonizované normy (EN ISO 6185, 12215, 10240, 14945) a jakékoli další národní požadavky pro cílový trh.
      timeline: 3–5 dní
    - number: '03'
      title: Design & Technická dokumentace
      description: 'Vytvořte hlavní technický soubor: výkresy celkového uspořádání, výpočty stability a vztlaku, posouzení rizik, materiálové specifikace a analýza bezpečnosti systémů (palivové, elektrické, řízení).'
      timeline: 10–15 dní
    - number: '04'
      title: Ověřování a testování produktů
      description: Proveďte fyzické ověření — tlakové zkoušky při 1,25násobku jmenovitého tlaku po dobu 24–48 hodin, zkoušky stability a vztlaku, zátěžové zkoušky a uvedení systému do provozu. Zaznamenejte všechny výsledky testů na trup.
      timeline: 5–7 dní
    - number: '05'
      title: Značení a dodací dokumentace
      description: Připojte označení CE, štítek výrobce (EN ISO 14945) a HIN/CIN (identifikační číslo trupu). Připravte EU prohlášení o shodě, uživatelskou příručku (EN ISO 10240) a kontrolní seznam shody.
      timeline: 2–3 dny
    - number: '06'
      title: Sledovatelnost na sériové úrovni
      description: Každý trup obdrží jedinečný záznam o trupu, který jej spojuje s hlavním technickým souborem, výrobní šarží, materiálovými certifikáty, výsledky zkoušek a konečnou konfigurací. Záznamy uchovávané po dobu 10 a více let na RCD.
      timeline: Pokračující
content_document_cards:
  tagline: Typy dokumentů
  title: Doklad o shodě<br />Karty
  subtitle: Toto jsou typy dokumentů, které připravujeme a udržujeme pro každý CE certifikovaný RIB model. Vzorky jsou k dispozici na základě kvalifikovaného dotazu.
  items:
    - title: CE / Certifikát shody RCD
      description: Certifikát specifický pro daný model potvrzující, že plavidlo splňuje všechny příslušné základní bezpečnostní požadavky RCD 2013/53/EU, vydaný výrobcem se zapojením notifikované osoby, kde je to požadováno.
      icon: tabler:certificate
    - title: EU prohlášení o shodě (DoC)
      description: Podepsané prohlášení výrobcem nebo zplnomocněným zástupcem, uvádějící platné směrnice, normy, modul shody a podrobnosti o notifikované osobě. Vyžadováno pro každý model uvedený na trh EU.
      icon: tabler:file-check
    - title: Stavební štítek (EN ISO 14945)
      description: Trvale připevněný štítek zobrazující maximální počet osob, maximální výkon motoru, konstrukční kategorii a identifikaci výrobce. Musí zůstat čitelné po dobu životnosti plavidla.
      icon: tabler:badge
    - title: Návod k obsluze (EN ISO 10240)
      description: Komplexní příručka zahrnující bezpečný provoz, nouzové postupy, plány údržby a bezpečnostní varování. Povinné za každých RIB dodaných v EU.
      icon: tabler:book
    - title: ISO Testovací a kontrolní zprávy
      description: Záznamy o tlakových zkouškách (1,25x / 24–48h), výsledky zkoušek stability a vztlaku, certifikáty o zkouškách materiálu a zprávy o ověření rozměrů – to vše spojené s konkrétními čísly trupu.
      icon: tabler:test-pipe
    - title: Záznamy o sledovatelnosti materiálu
      description: Sledovatelnost na úrovni šarže pro hadicovou tkaninu, lepidla, sklolaminát a hardware. Propojuje každou výrobní jednotku s příchozími materiálovými certifikáty a výsledky kontroly IQC.
      icon: tabler:link
    - title: Kontrola kvality & QC záznamy
      description: 100bodový kontrolní seznam kvality na jednotku, průběžné záznamy kontroly kvality, zprávy o neshodě a nápravná opatření. Část řetězce sledovatelnosti výroby.
      icon: tabler:clipboard-check
    - title: Balíček projektových dokumentů
      description: Balíček dokumentace pro trup včetně záznamu o konečné konfiguraci, podrobností o instalaci motoru a vybavení, kontrolního seznamu pro uvedení do provozu a dodací dokumentace.
      icon: tabler:package
content_design_categories:
  tagline: Kategorie designu RCD
  title: Kategorie designu A–D<br />— Co znamenají
  subtitle: RCD přiděluje konstrukční kategorie založené na maximální síle větru a významné výšce vln, které má plavidlo odolat.
  items:
    - title: Kategorie A – Oceán
      description: Navrženo pro delší plavby, kde síla větru může přesáhnout Beaufort 8 (>40 uzlů) a významná výška vlny může přesáhnout 4 m. Vyžaduje nejpřísnější ověření konstrukce a stability.
      icon: tabler:ripple
    - title: Kategorie B – Offshore
      description: Navrženo pro pobřežní plavby se silou větru až Beaufort 8 (≤40 uzlů) a významnou výškou vln až 4 m. Vhodné pro pobřežní a poloexponované vody.
      icon: tabler:anchor
    - title: Kategorie C – Pobřežní
      description: Navrženo pro pobřežní plavby se silou větru až Beaufort 6 (≤27 uzlů) a významnou výškou vln až 2 m. Většina rekreačních RIB spadá do této kategorie.
      icon: tabler:sun
    - title: Kategorie D – Chráněné
      description: Navrženo pro chráněné vody se silou větru až Beaufort 4 (≤16 uzlů) a významnou výškou vln až 0,3 m. Jezera, řeky a chráněné přístavy.
      icon: tabler:pool
content_hin:
  tagline: Identifikace řemesla
  title: HIN / CIN & Stavební deska
  subtitle: Každá loď RIB vyžaduje identifikační číslo trupu (HIN) nebo identifikační číslo plavidla (CIN) a štítek výrobce podle požadavků EN ISO 14945 a RCD.
  items:
    - title: Identifikační číslo trupu (HIN)
      description: Jedinečný 14místný kód trvale vyznačený na pravoboku zrcadla, kódující kód výrobce (MIC), modelový rok, rok výroby a sériové číslo. Vyžaduje se pro vstup na trh EU.
      icon: tabler:hash
    - title: Identifikační číslo plavidla (CIN)
      description: Podle EN ISO 10087 skryté sekundární identifikační číslo umístěné na skrytém místě pro účely ochrany proti krádeži a sledovatelnosti.
      icon: tabler:eye-off
    - title: Obsah stavebního štítku
      description: Maximální počet osob, maximální výkon motoru (kW), maximální zatížení (kg), konstrukční kategorie, název výrobce a označení CE – to vše trvale zobrazeno na štítku odolném proti korozi.
      icon: tabler:badge
content_tech_file:
  tagline: Technická struktura souboru
  title: Hlavní technický soubor<br />& Záznam trupu
  subtitle: 'Náš dokumentační systém má dvouúrovňovou strukturu: hlavní technický soubor pro každou modelovou rodinu a individuální záznamy trupu pro každou vyrobenou loď.'
  items:
    - title: Hlavní technický soubor
      description: 'Obsahuje kompletní dokumentaci shody pro modelovou řadu: obecné uspořádání, posouzení rizik, výpočty stability/vztlaku, materiálové specifikace, platné normy a záznamy o posouzení shody. Uchováváno 10+ let.'
      icon: tabler:folder
    - title: Záznam trupu (sledovatelnost podle člunu)
      description: 'Každý trup má jedinečný záznam, který jej propojuje s hlavním technickým souborem: HIN, datum výroby, šarže trubek, materiálové certifikáty, výsledek tlakové zkoušky, konečná konfigurace, instalace motoru a místo dodání.'
      icon: tabler:file-description
    - title: Compliance balíček pro zákazníky
      description: Dodací balíček na trup včetně DoC, fotografie stavebního štítku, uživatelské příručky, shrnutí testu a konečného konfiguračního listu – dodává se s každou RIB zaslanou do EU.
      icon: tabler:package
content_material_cert:
  tagline: Materiálová certifikace
  title: Sledovatelnost materiálu a<br />certifikační důkazy
  subtitle: Kvalitní RIB lodě začínají kontrolovanými materiály a dokumentovanými procesy. Níže je uvedeno, jak organizujeme certifikaci materiálů pro každou kritickou skupinu komponent.
  items:
    - title: Sledovatelnost materiálu nafukovacích trubek
      description: Materiály trubek PVC a CSM/Hypalon se vybírají podle zamýšleného použití, klimatických podmínek a cílového trhu. Technická data dodavatele (TDS), informace o šarži materiálu, sledovatelnost šarže tkaniny, zprávy o testech UV a povětrnostních vlivů a prohlášení REACH/SVHC jsou k dispozici v rámci dohodnutého rozsahu projektové dokumentace.
      icon: tabler:circle
    - title: Sledovatelnost mořského hliníku
      description: U projektů s hliníkovým trupem RIB se třída slitiny, tloušťka a šarže materiálu řídí podle schválené specifikace. Certifikáty o zkoušce materiálu (MTC/MTR), dokumentace EN 10204 3.1, zprávy o chemickém složení a mechanických vlastnostech a sledovatelnost tepla/šarže jsou dodávány tam, kde je to dohodnuto.
      icon: tabler:rectangle
    - title: GRP Řízení materiálu a procesu trupu
      description: U laminátových trupových RIB jsou gelcoat, pryskyřice, sklolaminátové výztuže a materiály jádra spravovány prostřednictvím kontrolovaných specifikací. Materiál TDS/SDS, záznamy šarží, specifikace laminátu a záznamy o vytvrzování a dílenské kontrole jsou k dispozici po dohodě o projektu.
      icon: tabler:layers-subtract
    - title: Podpora dokumentace komponent
      description: Pro vybrané komponenty – včetně EVA materiálů paluby, sedadel, hardwaru z nerezové oceli, palivových systémů, elektrického vybavení a lodního příslušenství – je příslušná dokumentace dodavatele koordinována na základě konečné konfigurace a požadavků cílového trhu.
      icon: tabler:package
    - title: Oznámení o rozsahu shody
      description: Certifikáty, protokoly o zkouškách a dokumenty o shodě platí pouze pro konkrétní model výrobku, materiál, součást, výrobní šarži nebo rozsah projektu uvedený v příslušném dokumentu. Kontaktujte nás s vaším cílovým trhem, zamýšleným použitím a technickými požadavky, aby bylo možné před zadáním objednávky potvrdit příslušnou dokumentaci.
      icon: tabler:info-circle
faq:
  title: CE Soulad — Často kladené otázky
  questions:
    - q: Jsou všechny lodě Aquafarer RIB CE certifikovány pro trh EU?
      a: RIB lodí v našem katalogu je navrženo a zdokumentováno pro shodu s RCD 2013/53/EU podle platných směrnic EU. Označení CE platí na základě modelu a konfigurace. Kontaktujte nás pro dokument s rozsahem shody konkrétního modelu.
    - q: Jaký je rozdíl mezi vyhověním RCD a označením CE?
      a: RCD (Recreational Craft Directive 2013/53/EU) je legislativa EU, která stanovuje základní bezpečnostní požadavky. Označení CE je vizuální symbol umístěný na výrobku, který byl posouzen a potvrzen jako splňující tyto požadavky. Výrobek musí být v souladu se směrnicí RCD, než může nést značku CE.
    - q: Poskytujete prohlášení o shodě s každou lodí?
      a: Ano. Každá loď RIB dodaná na trh EU obsahuje prohlášení o shodě EU specifické pro daný model se seznamem použitelných směrnic, harmonizovaných norem, modulu posuzování shody a podrobností o notifikovaném orgánu.
    - q: Jaký modul posuzování shody používá Aquafarer?
      a: Modul závisí na konstrukční kategorii a typu lodi. Většina modelů RIB v konstrukční kategorii C používá modul A (interní řízení výroby). Pro čluny konstrukční kategorie A/B nebo specifické konfigurace může být se zapojením notifikované osoby použit modul B+C nebo B+D. Poradíme s vhodným modulem pro každý projekt.
    - q: Můžete nám před zadáním objednávky sdílet dokumentaci shody?
      a: Po kvalifikovaném dotazu sdílíme dokument o rozsahu shody se seznamem použitelných norem, cesty shody a typů dokumentů dostupných pro model, který hodnotíte. Úplné technické soubory jsou sdíleny v rámci NDA po potvrzení objednávky.
    - q: Co je to identifikační číslo trupu (HIN) a je součástí dodávky?
      a: HIN je 14místný jedinečný identifikátor trvale vyznačený na každé lodi, který kóduje kód výrobce (MIC), označení modelu, rok výroby a sériové číslo. Je povinný pro všechny lodě RIB uvedené na trh EU a je obsažen na každé Aquafarer RIB.
    - q: Jak dlouho jsou technické soubory uchovávány?
      a: Podle požadavků RCD 2013/53/EU musí výrobce uchovávat technickou dokumentaci po dobu nejméně 10 let od posledního data uvedení výrobku na trh. Aquafarer vede úplnou technickou dokumentaci pro všechny vyrobené modely.
    - q: Pomáháte s plněním povinností dovozce podle směrnice RCD?
      a: 'Ano. Poskytujeme balíček dokumentace, který dovozci do EU potřebují ke splnění svých povinností: přístup k technickým souborům, prohlášení o shodě, štítek výrobce, uživatelská příručka a záznamy o sledovatelnosti produktu. Odpovědnosti dovozce podle směrnice RCD jsou jasně zdokumentovány v našem průvodci dodržováním předpisů.'
