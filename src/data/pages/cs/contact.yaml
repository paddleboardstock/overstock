hero_text:
  tagline: Kontakt
  title: KONTAKTUJTE SE
contact_form:
  id: form
  title: Pošlete nám zprávu
  subtitle: Pro cenové nabídky, technické dotazy nebo partnerství nám napište. Odpovídáme do jednoho pracovního dne.
  email_to: info@aquafarer.com
  submit_button: Odeslat poptávku → Získat nabídku
  success_message: Děkujeme! Vaše zpráva dorazila do naší schránky. Odpovíme do jednoho pracovního dne.
  error_message: Při odesílání zprávy se něco pokazilo. Zkuste to prosím znovu nebo nám napište přímo e-mail.
  default_country_code: '+1'
  captcha:
    label: 'Antispam: vyřešte prosím následující'
  fields:
    - name: firstName
      label: Jméno
      row: 1
    - name: lastName
      label: Příjmení
      row: 1
    - name: companyName
      label: Společnost
      row: 2
    - name: address
      label: Adresa
      row: 3
    - name: zip
      label: PSČ
      row: 4
    - name: country
      label: Země
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Odhadovaný objem objednávky
      row: 6
      type: select
      options:
        - value: ''
          label: Vyberte odhadovaný objem...
        - value: sample
          label: Pouze vzorky / prototypy
        - value: 5-10
          label: 5–10 ks (standardní MOQ)
        - value: 100-500
          label: 100–500 kusů
        - value: 500-plus
          label: 500+ ks (objemové ceny)
    - name: customization
      label: Potřebujete customizaci?
      row: 7
      type: select
      options:
        - value: ''
          label: Vyberte typ customizace...
        - value: none
          label: Standardní produkt (bez customizace)
        - value: logo
          label: Pouze vlastní logo / branding
        - value: full
          label: Plné OEM (velikost, barva, grafika, balení)
        - value: consultation
          label: Nevím — potřebuji konzultaci
    - name: productInterest
      label: Kategorie produktů zájmu
      row: 8
      type: select
      options:
        - value: ''
          label: Vyberte kategorii produktu...
        - value: all
          label: Všechny produkty / Celý katalog
        - value: sup
          label: SUP desky / paddleboardy
        - value: kayak
          label: Nafukovací kajaky
        - value: rib
          label: RIB čluny
        - value: dinghy
          label: Loďky / Tendry
        - value: safety
          label: Bezpečnostní vybavení / záchranné vesty
        - value: accessory
          label: Příslušenství (pumpy, vesla, tašky)
    - name: subject
      label: Předmět
      row: 9
    - name: message
      label: Zpráva
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Další způsoby, jak nás kontaktovat
  columns: 3
  items:
    - title: Obchodní dotazy
      description: Nabídky, konfigurace, žádosti o dealera a hromadné objednávky.
      icon: tabler:shopping-bag
    - title: Technická podpora
      description: Záruka, opravy, náhradní díly a provozní dotazy.
      icon: tabler:tool
    - title: Tisk a partnerství
      description: Mediální sady, sponzoring a spolupráce v oboru.
      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (americké ústředí) · +86 13305324192 (továrna)
      icon: tabler:headset
    - title: E-mail
      description: info@aquafarer.com
      icon: tabler:mail
    - title: Globální centrála a fakturace
      description: Aquafarer LLC, New Mexico, Spojené státy americké
      icon: tabler:map-pin
map:
  title: Naše poloha
  subtitle: Navštivte náš výrobní hub v Qingdao
  address: Economic Development Zone, Laixi, Qingdao, China, 266600
  zoom: 15

