values:
  - title: Kvalita na prvním místě
    desc: Každá loď, která opouští naši továrnu, prochází před odesláním povinným testem zadržování vzduchu, odlupováním švů a testováním systémů.
  - title: Vertikální integrace
    desc: Kontrolujeme každou fázi – od PVC řezání až po konečnou montáž – eliminujeme neefektivitu dodavatele a zajišťujeme stálou kvalitu.
  - title: Bezpečnost jako standard
    desc: Certifikace CE je jádrem toho, co vyrábíme. Naše 64 modelů s certifikací CE splňuje bezpečnostní normy EU pro rekreační a komerční použití.
  - title: Partnersky zaměřené
    desc: Budujeme dlouhodobé vztahy s OEM, ODM a partnery se soukromými značkami prostřednictvím transparentnosti, spolehlivosti a sdíleného růstu.
services:
  - title: OEM Výroba
    desc: Stavíme podle vašich specifikací. Sdílejte své výkresy a náš technický tým se postará o prototypování, nástroje a výrobu.
  - title: ODM Řešení
    desc: Začněte s našimi osvědčenými návrhy platforem. Přizpůsobte si velikost, barvu, grafiku a balení, abyste vytvořili svou jedinečnou produktovou řadu.
  - title: Soukromá značka
    desc: Vaše značka, vaše logo, váš obal. Produkty přicházejí připravené pro maloobchod s plnou integrací značky.
  - title: Vlastní branding
    desc: Palubní tamponový tisk, grafika trupu, obtisky trubek a vlastní štítky – konzistentní přítomnost značky na každém povrchu.
certifications:
  - name: CE Certifikace
    desc: Naše lodě a plavidla splňují směrnici EU o rekreačních plavidlech (2013/53/EU) a příslušné harmonizované normy.
    scope: Lodě a plavidla
  - name: null
    desc: Certifikovaný systém managementu kvality pro návrh, výrobu a distribuci nafukovacích plavidel.
    scope: Celé zařízení
  - name: null
    desc: Nafukovací čluny – požadavky na bezpečnost a výkon pro nafukovací čluny se zesíleným a pevným trupem.
    scope: RIB & nafukovací šňůry
