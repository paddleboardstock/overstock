factory_details:
  - label: Velikost zařízení
    value: 12 000 m² (130 000 stop²) integrovaný kampus v zóně ekonomického rozvoje Qingdao
  - label: Roční kapacita
    value: 15 000 lodí včetně SUP, kajaků, člunů, RIB a bezpečnostního vybavení
  - label: R&D tým
    value: Více než 25 inženýrů napříč produktovým designem, vědou o materiálech a inženýrstvím kvality
  - label: Klíčové vybavení
    value: CNC řezací stoly, RF dielektrické svářečky, horkovzdušné tmely, digitální tiskárny, sklolaminátové formy, zkušební zařízení na zadržování vzduchu
  - label: Výrobní linky
    value: '6 vyhrazených linek: PVC řezání, svařování trubek, pokládání trupu ze skelných vláken, SUP montáž, RIB montáž, konečná kontrola kvality'
  - label: Roční objem exportu
    value: 8 milionů USD+ exportováno do více než 50 zemí v Evropě, Americe, Asii a Tichomoří a na Středním východě
