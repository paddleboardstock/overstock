hero:
  tagline: O
  title: O webu {SITE}
  subtitle: Vertikálně integrovaný výrobce vodních sportů – od surovin až po hotové lodě
intro:
  - 'Paddle Board Overstock byla založena v roce 2012 s jediným posláním: navrhovat a vyrábět vybavení pro vodní sporty, které na vodě funguje stejně dobře jako ve zprávě o kvalitě. To, co začalo jako soustředěná dílna na prkna SUP, se rozrostlo na integrovaný výrobní závod o rozloze 12 000 metrů čtverečních v zóně ekonomického rozvoje Qingdao, který vyrábí nafukovací čluny, RIB, kajaky, prkna SUP, bezpečnostní vybavení a příslušenství pro zákazníky ve více než 50 zemích.'
  - Dnes Paddle Board Overstock funguje jako tovární značka – vše navrhujeme, konstruujeme, prototypujeme, vyrábíme a testujeme pod jednou střechou. Tato vertikální integrace nám dává přímou kontrolu nad výběrem materiálu, kvalitou sestavení a dodacími lhůtami. Každá loď je postavena našimi lidmi, na našem vybavení, podle našich standardů.
  - Poskytujeme služby rekreačním uživatelům, komerčním operátorům, vládním agenturám a značkovým partnerům po celém světě. Naše programy OEM a ODM pomáhají podnikům zavádět vlastní produktové řady bez investic do tovární infrastruktury. Ať už potřebujete jeden prototyp nebo celou výrobní sérii, náš tým vás provede od konceptu až po dodávku připravenou k moři.
