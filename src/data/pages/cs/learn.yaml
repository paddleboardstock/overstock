hero:
  tagline: Znalosti o průzkumu vody
  title: Učit se
  subtitle: |
    Průvodci, výukové programy a hloubkové ponory – vše, co potřebujete k sebevědomí<br /> prozkoumávání vody. Od výběru prvního SUP až po zvládnutí pokročilých technik.
  taglineSection: Znalosti pro každého vodáka. Od začátečníka po profesionála.
featured:
  tagline: Doporučená témata
  title: Začněte svou cestu učení
  subtitle: Ať už jste ve vodních sportech nováčci nebo se chcete posunout o úroveň výš, naši průvodci vám pomohou.
  items:
    - title: SUP Základy
      description: Vše, co začátečník potřebuje vědět – typy prkna, velikost pádla, postoj a tipy pro první den.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Nafukovací vs pevná deska
      description: který je pro vás ten pravý? Porovnáváme přenositelnost, výkon, odolnost a náklady vedle sebe.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Bezpečnost vody
      description: Základní bezpečnostní znalosti, které by měl mít každý vodák – počasí, PFD, sebezáchrana a další.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Průvodce materiály
      description: PVC vs Hypalon, technologie drop-stitch, hodnocení denier – pochopte, z čeho je vaše vybavení vyrobeno.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Průvodce velikostí
      description: Najděte správnou délku, šířku a objem prkna pro vaši váhu, dovednosti a styl pádlování.
      icon: tabler:ruler
      href: /size-guide
    - title: Středně pokročilé techniky
      description: Zlepšete své pádlování s pokročilými údery, technikami otáčení a manipulací na drsné vodě.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
