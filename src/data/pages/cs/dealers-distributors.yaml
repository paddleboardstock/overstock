content_benefits:
  tagline: Výhody partnerství
  title: Proč si distributoři<br />vyberte Paddle Board Overstock
  subtitle: Partnerství navržené pro námořní distributory, kteří potřebují spolehlivé dodávky, konkurenceschopné marže a profesionální podporu.
  items:
    - title: Ochrana území
      description: Výhradní nebo částečně výhradní územní práva pro kvalifikované distributory. Mapování trhu a řízení konfliktů kanálů pro ochranu vašich investic do budování značky Paddle Board Overstock ve vašem regionu.
      icon: tabler:map-pin
    - title: Konkurenční velkoobchodní ceny
      description: Odstupňované ceny na základě ročních objemových závazků. Cenová struktura chránící marže s předběžnými cenovými zárukami a transparentním rozpisem nákladů (základ FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Sada marketingové podpory
      description: Profesionální produktová fotografie, specifikace, šablony dokumentace shody, obsah sociálních médií a marketingové materiály se společnou značkou. Aktualizováno každoročně uvedením nových produktů.
      icon: tabler:photo
    - title: Technické školení
      description: Školení o produktu pro váš prodejní tým (virtuální nebo na místě), školení údržby a oprav pro vaše servisní techniky a často kladené dotazy a průvodce řešením problémů se zákazníky.
      icon: tabler:school
    - title: Náhradní díly a poprodejní služby
      description: Vyhrazená dodávka náhradních dílů s prioritní dopravou. K dispozici jsou náhradní díly trubek, ventily, žebra a opravárenské sady pro rychlé vyřízení objednávky. Podpora vyřízení reklamace.
      icon: tabler:tool
    - title: Dokumentace o shodě
      description: 'Kompletní balíček dokumentace shody pro váš trh: CE DoC, údaje na štítku výrobce, uživatelské příručky a regulační podpora registrace. Odstraňuje vaši zátěž související s dodržováním předpisů.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Co hledáme
  title: Distributor<br />Požadavky
  subtitle: Hledáme partnery, kteří mohou profesionálně zastupovat a podporovat Paddle Board Overstock produktů na jejich území.
  items:
    - title: Znalost území a trhu
      description: Zavedená přítomnost na trhu s mořskými, vodními sporty nebo venkovní rekreací. Pochopení místních předpisů, spotřebitelských preferencí a distribučních kanálů pro produkty pro plavidla.
      icon: tabler:target
    - title: Zkušenosti z oboru
      description: Minimálně 2 roky zkušeností s distribucí námořního, outdoorového nebo sportovního vybavení. Osvědčená zkušenost s mezinárodními značkami a B2B velkoobchodními operacemi.
      icon: tabler:briefcase
    - title: Showroom nebo sklad
      description: Fyzické zařízení pro vystavení produktu, skladování inventáře a zákaznický servis. Schopnost udržovat ukázkové jednotky a inventář náhradních dílů pro vaše území.
      icon: tabler:building-store
    - title: Závazek k dodržování standardů značky
      description: Ochota udržovat Paddle Board Overstock standardy prezentace značky, poskytovat zákaznickou podporu podle našich servisních protokolů a účastnit se každoročních aktualizací produktových školení.
      icon: tabler:star
content_process:
  tagline: Proces aplikace
  title: 4krokový prodejce<br />Proces aplikace
  subtitle: Od počátečního dotazu k první zásilce – jednoduchý proces nalodění.
  steps:
    - number: '01'
      title: Počáteční dotaz a kvalifikace
      description: Odešlete žádost o distributora s podrobnostmi o společnosti, zájmovém území, aktuálních produktových řadách a ročních odhadech objemu. Zkontrolujeme do 5 pracovních dnů.
      timeline: 5 dní
    - number: '02'
      title: Obchodní recenze a podmínky
      description: Virtuální schůzka k projednání územní strategie, cenových úrovní a podmínek partnerství. Zkontrolujte požadavky na dokumentaci shody pro váš trh. V případě potřeby podepsání NDA.
      timeline: 1-2 týdny
    - number: '03'
      title: Vzorová objednávka a hodnocení
      description: Zadejte počáteční vzorovou objednávku (2–5 jednotek) za cenu distributora za účelem vyhodnocení trhu a školení týmu. Kompletní dokumentace shody a příprava demo v ceně.
      timeline: 30-45 dní
    - number: '04'
      title: Spuštění partnerství a podpora
      description: První objednávka kontejneru s aktivovanou ochranou území. Dodán marketingový balíček, vyškolený prodejní tým a přidělen specializovaný account manager. Průběžné čtvrtletní obchodní hodnocení.
      timeline: Pokračující
content_application_docs:
  tagline: Aplikační dokumenty
  title: Dokumenty požadované<br />pro aplikaci prodejce
  subtitle: Chcete-li požádat o zastoupení Paddle Board Overstock, připravte si následující dokumenty a informace pro náš kontrolní tým.
  items:
    - title: Osvědčení o obchodní registraci
      description: Platný dokument o registraci společnosti, který obsahuje název právnické osoby, registrovanou adresu a rozsah podnikání pokrývající distribuci námořního, sportovního nebo outdoorového vybavení.
      icon: tabler:file-text
    - title: Plán pokrytí území
      description: Geografické území zájmu, stávající maloobchodní nebo distribuční síť, cílové segmenty zákazníků a navrhovaný roční objem podle kategorie produktu (RIB, SUP, kajak).
      icon: tabler:map
    - title: Možnost showroomu nebo skladu
      description: Fyzické zařízení pro vystavení produktu, skladování inventáře a zákaznický servis. Fotografie nebo půdorysy ukazující ukázkovou oblast a skladovací kapacitu náhradních dílů.
      icon: tabler:building
    - title: Prohlášení o finanční způsobilosti
      description: 'Bankovní reference nebo finanční výkaz potvrzující schopnost zadat počáteční objednávku kontejneru a udržovat zásoby. Minimální počáteční objednávka: jeden 20ft kontejner (10-20 jednotek smíšené modely).'
      icon: tabler:coin
    - title: Kapacita poprodejní podpory
      description: Servisní technici vyškolení nebo vyškolení pro údržbu a opravy nafukovacích člunů. Schopnost zpracování reklamace a závazek zásob náhradních dílů.
      icon: tabler:tool
    - title: Předchozí reference značek
      description: Seznam distribuovaných současných nebo předchozích značek námořního/sportovního vybavení. Kontaktní reference po vzájemné dohodě. Startupy bez předchozích zkušeností s distribucí se mohou kvalifikovat se silnějším finančním závazkem.
      icon: tabler:users
faq:
  title: Program dealerství — Často kladené otázky
  questions:
    - q: Jaké je minimální množství objednávky pro distributory?
      a: MOQ distributora začíná na 10-20 jednotkách na objednávku, s flexibilitou pro smíšené modely (RIB, nafukovací, SUP). Počáteční vzorové objednávky 2-5 jednotek jsou k dispozici za cenu distributora pro tržní vyhodnocení.
    - q: Nabízíte exkluzivní územní práva?
      a: Pro kvalifikované distributory, kteří splňují roční objemové závazky a udržují standardy značky, jsou k dispozici výhradní územní práva. Poloexkluzivní a nevýhradní ujednání jsou k dispozici také pro rozvíjející se trhy.
    - q: Jakou marketingovou podporu poskytujete?
      a: Poskytujeme komplexní marketingovou sadu zahrnující profesionální produktovou fotografii, listy se specifikacemi, šablony dokumentace shody, knihovnu obsahu sociálních médií a materiály se společnou značkou. Aktualizováno každoročně uvedením nových produktů.
    - q: Jak se řeší záruční reklamace?
      a: 'Distributoři slouží jako první kontaktní místo pro záruční reklamace. Poskytujeme jasná záruční kritéria, fotodokumentační protokoly a rychlé vyřízení výměny nebo kreditu. Záruční podmínky: 5 let omezená na tkaninu/švy/trup lodi; 2 roky na SUP a příslušenství.'
    - q: Mohu soukromě označit Paddle Board Overstock produkty pod svou vlastní značkou?
      a: Ano, prostřednictvím našeho programu OEM/ODM. Možnosti soukromých značek zahrnují vlastní grafiku trubek, značku konzoly, maloobchodní balení a dokumentaci shody pod vaší značkou. Podrobnosti najdete na naší stránce služeb OEM/ODM.
    - q: Jaká dokumentace shody je zahrnuta pro distributory?
      a: Každá zásilka obsahuje prohlášení o shodě CE specifické pro daný model, údaje na štítku výrobce, uživatelské příručky a přepravní dokumentaci. Poskytujeme také regulační registrační podporu pro vaše území a pomáháme s místními požadavky na shodu.
