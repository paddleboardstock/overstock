hero:
  tagline: Program dealerství
  title: Staňte se Paddle Board Overstock<br />Distributorem
  subtitle: Staňte se partnerem CE-certifikovaného výrobce RIB a nafukovacích plavidel obsluhujícího více než 50 zemí. Ochrana území, marketingová podpora a konkurenceschopné ceny pro zavedené námořní distributory.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Prodejní a distribuční program Paddle Board Overstocku
direct_answer: Paddle Board Overstock nabízí obchodní zastoupení a distribuční partnerství s ochranou území, konkurenční velkoobchodní ceny, sady marketingové podpory a úplnou dokumentaci shody (CE, ISO 9001, BSCI). MOQ začíná na 10-20 jednotkách na objednávku s vyhrazenou správou účtu.
