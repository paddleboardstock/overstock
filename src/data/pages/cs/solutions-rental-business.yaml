testimonial:
  content: Pronajal jsem si 5 desek z místního obchodu a přišel jsem o 60 % svých příjmů. Aquafarer mi pomohlo vybudovat vlastní flotilu 15 SUP. Kalkulačka návratnosti investic, kterou poskytli, ukázala, že bych se prolomil dokonce za 4 měsíce — ve skutečnosti to trvalo 3. Nyní se rozšiřuji na 30 prken a přidávám kajaky.
  name: Daniel Okonkwo
  title: Majitel, Lakeland SUP Rentals — Ontario, Kanada
content_segments:
  tagline: Pronájem profilů
  title: Řešení půjčovny vodních sportů<br />Podle typu provozovatele
  subtitle: Různé půjčovny mají různé potřeby – od malých pronájmů SUP u pláže až po velká střediska vodních sportů v resortech. Podle toho přizpůsobujeme naše balíčky vybavení a model podpory.
  items:
    - title: Pláž a jezero SUP Pronájem
      subtitle: Velkoobjemové operace s nízkou složitostí
      description: Provozovatelé pronajímající paddleboardy a kajaky přímo návštěvníkům pláže a návštěvníkům jezera. Vaší prioritou je minimalizovat dobu pronájmů, udržovat zařízení v rotaci a zvládat sezónní výkyvy poptávky s malou skladovací plochou.
      features:
        - Nafukovací SUP flotily, které se balí naplocho – není potřeba dok ani přívěs
        - Komerční úroveň PVC pro více než 100 cyklů pronájmu za sezónu
        - Rychleschnoucí tkanina odolná vůči UV záření pro připravenost k opětovnému zapůjčení ještě tentýž den
        - Barevně odlišené řady desek pro snadnou identifikaci vozového parku
    - title: Střediska vodních sportů Resort & Hotel
      subtitle: Zkušenosti hostů a sladění značky
      description: Resorty a hotely nabízející vodní sporty jako vlastní vybavení. Vybavení musí vypadat prémiově, spolehlivě fungovat u začátečníků až středně pokročilých hostů a musí se integrovat se stávajícími pracovními postupy rezervace a fakturace v resortu.
      features:
        - Na zakázku značkové SUP desky a záchranné vesty v barvách resortu
        - 'Smíšený vozový park: SUP, kajaky, šlapadla a malé RIB tendry'
        - Tiché řešení elektrického čerpadla bez paliva pro nafukovaní na pláži
        - Včetně školení personálu a údržby
    - title: Operátoři půjčovny lodí a RIB
      subtitle: Flotily pronájmu plavidel komerční úrovně
      description: Provozovatelé pronajímající poháněná plavidla – RIB nabídek, nafukovacích člunů a malých kolotočů – na hodinu nebo půl dne. Vaše flotila musí splňovat námořní bezpečnostní předpisy, odolat náročnému používání hosty a minimalizovat mechanické prostoje mezi jednotlivými pronájmy.
      features:
        - RIB balíky s 30–90 HP příčníky připravené na zavěšení
        - Překližkové podlahové panely námořní kvality pro dlouhodobou strukturální integritu
        - Rychloupínací ventilové systémy pro rychlejší obrat
        - Sada náhradních dílů + technická podpora na zavolání SLA
    - title: Operátoři výletů a dobrodružství
      subtitle: Výletní flotily s průvodcem
      description: Provozovatelé provozující prohlídky vodních sportů s průvodcem — SUP safari, jeskynní kajakování, šnorchlování nebo RIB výlety po ostrovech. Vybavení musí být dostatečně stabilní pro začínající hosty, rychle se čistí mezi skupinami a dostatečně odolné pro každodenní použití s ​​průvodcem v různých vodních podmínkách.
      features:
        - Extra stabilní SUP platformy (32" široká+) pro začínající jezdce
        - Možnosti tandemového kajaku pro párové/skupinové konfigurace výletů
        - Vestavěná nákladová kapacita pro šnorchlovací vybavení, suché vaky a chladiče
        - CE + USCG dokumentace shody pro komerční provoz
