hero:
  tagline: Obchodní řešení v oblasti pronájmu
  title: Vybudujte si ziskové vodní sporty<br />Pronájem s Aquafarer
  subtitle: Kompletní balíčky pronájmu vozového parku pro SUP kluby, plážová letoviska, provozovatele jezer a střediska vodních sportů – od výběru vybavení po správu vozového parku a podporu údržby.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-paddle-girls-team.webp
    alt: Půjčovací flotila vodních sportů Aquafarer v akci
direct_answer: Aquafarer poskytuje komplexní řešení pronájmu pro provozovatele vodních sportů. Pomůžeme vám vybrat správné vybavení, optimalizovat velikost vozového parku pro vaši lokalitu, minimalizovat prostoje na údržbu a maximalizovat výnosy z pronájmů, od flotil SUP pro začátečníky až po pronájmy RIB na komerční úrovni. Naše produkty osvědčené v půjčovně se vyznačují komerční PVC konstrukcí, snadnou opravou a nafukovacím designem, který eliminuje náklady na skladování. Ať už zahajujete novou půjčovnu nebo modernizujete stávající vozový park, Aquafarer poskytuje vybavení a odborné znalosti k vybudování ziskové půjčovny vodních sportů.
solution_offerings:
  - title: Startovací sada flotily
    subtitle: Pro nové nájemní provozy testování trhu
    badge: Popular
    features:
      - title: Posouzení vozového parku
        description: Odborná analýza vaší polohy, demografických údajů hostů a cílů příjmů, abyste mohli velikost vaší flotily
      - title: Startovací zařízení
        description: 10 SUP desek s pádly, pumpami, záchrannými vestami a opravnými sadami – vše, co potřebujete ke spuštění
      - title: Řešení úložiště
        description: Nafukovací vybavení se balí naplocho – ke skladování není potřeba přístaviště lodí ani přívěs
      - title: Soulad s bezpečností
        description: Veškeré vybavení CE certifikováno s konstrukcí na komerční úrovni pro každodenní pronájem
      - title: Startovací marketing
        description: Značkové fotografické prostředky a šablony nabídek k pronájmu, které vám pomohou spustit vaši službu
    cta_text: Start Rental Fleet
    cta_href: /contact
  - title: Sada pro rozšíření vozového parku
    subtitle: Pro rostoucí operace zvyšující kapacitu a rozmanitost
    badge: Premium
    features:
      - title: Design smíšené flotily
        description: Kombinace SUP, kajaků, nafukovacích člunů a RIB pro různé preference hostů
      - title: Objemové ceny
        description: Odstupňované velkoobchodní ceny pro flotily 20+ jednotek s preferenčními logistickými sazbami
      - title: Vlastní branding
        description: Tisk loga na vybavení, značkové záchranné vesty a vlastní barevné možnosti pro váš vozový park
      - title: Program údržby
        description: Sada náhradních dílů, školení oprav pro personál a přímý přístup k technické podpoře
      - title: Optimalizace příjmů
        description: Doporučení na základě dat o cenách, rotaci vybavení a sezónních úpravách vozového parku
    cta_text: Scale My Fleet
    cta_href: /contact
