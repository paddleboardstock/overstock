  read_guide: Přečtěte si návod →
  card_tech: Námořní bezpečnostní inženýrství a testování materiálů
  card_products: Prozkoumejte celý produktový katalog Aquafarer
  card_trust: CE, ISO a BSCI soulad
materials:
  intro_p1: Výkon, odolnost a bezpečnost nafukovacího plavidla závisí téměř výhradně na materiálech použitých při jeho konstrukci. Od tkaniny, která tvoří trubky, až po závity, které dodávají desce SUP její tuhost, každá volba materiálu ovlivňuje, jak se produkt chová na vodě a jak dlouho vydrží.
  intro_p2: 'Tato příručka pokrývá čtyři základní materiály používané v moderních nafukovacích plavidlech: PVC tkanina, Hypalon CSM pryž, konstrukce jádra s kapkovým stehem a EVA pěnové obložení. Pochopení těchto materiálů vám pomůže vybrat ten správný produkt pro vaše potřeby a udržovat jej pro maximální životnost.'
  labels:
    advantages: Výhody
    limitations: Omezení
    best_for: 'Nejlepší pro:'
  items:
    - name: PVC (polyvinylchlorid)
      summary: Průmyslový standard pro rekreační nafukovací čluny a SUP. Vícevrstvá laminovaná tkanina nabízí vynikající poměr pevnosti a hmotnosti za dostupnou cenu.
      pros:
        - Cenově dostupné – o 30–50 % levnější než Hypalon
        - Lehký a snadno ovladatelný
        - Dobrá odolnost proti UV záření se správnými nátěry
        - Široká škála barev a povrchových úprav
        - Snadná oprava pomocí PVC záplat a rozpouštědlového lepidla
      cons:
        - Kratší životnost než Hypalon (7-10 let)
        - Méně flexibilní při nízkých teplotách
        - Nižší chemická odolnost
        - Může vyvinout migraci změkčovadla v průběhu času
      best_for: Rekreační SUP, levné lodě, pronájem flotil, sezónní použití, sladkovodní a pobřežní prostředí.
    - name: Hypalon (CSM Guma)
      summary: Prémiový syntetický kaučukový materiál známý pro mimořádnou trvanlivost, odolnost proti UV záření a dlouhou životnost. Zlatý standard pro komerční a vojenské nafukovací čluny.
      pros:
        - Výjimečná odolnost vůči UV záření a ozónu
        - Životnost 15-20 let při správné péči
        - Vynikající pružnost v chladném počasí
        - Vynikající chemická a olejová odolnost
        - Zachová barvu déle než PVC
      cons:
        - Výrazně dražší než PVC
        - Vyšší gramáž látky
        - Méně barevných možností
        - Opravy vyžadují speciální lepidla
        - Méně výrobních závodů po celém světě
      best_for: Komerční žebra, vyhledávání a záchrana, vojenské aplikace, tropické klima, dlouhodobé vlastnictví flotily.
    - name: Drop-stitch jádro
      summary: Technologie, která způsobila revoluci v nafukovacích SUP. Tisíce polyesterových nití spojují vrchní a spodní vrstvu látky, což umožňuje vysokotlaké nafouknutí pro pevný výkon s tvrdou skořepinou.
      pros:
        - Extrémně tuhý při 12-20 PSI
        - Nízká hmotnost – 18–30 lb pro desku plné velikosti
        - Složí se naplocho pro skladování a cestování
        - Vynikající odolnost proti nárazu
        - Konzistentní výkon v celém rozsahu teplot
      cons:
        - Vyžaduje vysokotlaké čerpadlo
        - Oprava propíchnutí je složitější než jednovrstvá
        - Vyšší výrobní náklady než u standardních nafukovaček
        - Ztráta tlaku v průběhu času vyžaduje pravidelné doplňování
      best_for: Stand-up paddle boardy, kajaky, vzduchové paluby pro nafukovací čluny, jakákoli aplikace vyžadující pevný výkon s nafukovací přenositelností.
    - name: EVA Pěnová paluba
      summary: Pěna s uzavřenými buňkami EVA (etylen-vinylacetát) používaná pro trakční podložky na prknech SUP a palubách lodí. Poskytuje odpružení, přilnavost a tepelnou izolaci.
      pros:
        - Vynikající protiskluzová přilnavost za mokra i za sucha
        - Tlumení snižuje únavu na dlouhých pádlech
        - Tepelná izolace od studeného povrchu paluby
        - Odolné proti UV záření a slané vodě
        - K dispozici ve vícebarevném blokování a laserem gravírovaných vzorech
      cons:
        - Může se nosit při intenzivním používání po dobu 2-3 let
        - Musí být řádně spojeny, aby se zabránilo delaminaci
        - Není strukturální — neovlivňuje tuhost
        - Přidá malou hmotnost (200-400 g na desku)
      best_for: SUP trakce na palubě, polstrování paluby lodi, pohodlí sedla kajaku, jakýkoli povrch vyžadující protiskluzový základ.
  selection:
    title: Průvodce výběrem materiálu
    subtitle: 'Vyberte si správný materiál na základě vašeho primárního případu použití:'
    headers:
      - Případ použití
      - Doporučený materiál
      - Proč
    rows:
      - - Rekreační SUP pádlování
        - Drop-stitch PVC
        - Lehký, pevný, cenově dostupný — ideální vyvážení pro příležitostné vodáky
      - - Rodinný člun / jezerní člun
        - PVC (1100 denier)
        - Cenově výhodné, snadno opravitelné, dostatečná životnost pro rekreační použití
      - - Komerční RIB / hlídkový člun
        - Hypalon CSM
        - Maximální odolnost proti UV záření, životnost 15-20 let, odolnost vůči chemikáliím/olejům
      - - Pronájem vozového parku SUP desek
        - Drop-stitch PVC + EVA balíček
        - Odolná, opravitelná, dobrá hodnota pro použití s ​​vysokým obratem
      - - Pátrací a záchranné operace
        - Hypalon CSM
        - Spolehlivost v extrémních podmínkách, pružnost za studena, chemická odolnost
      - - Turistický / expediční kajak
        - Drop-stitch PVC
        - Pevný výkon s přenositelností na cesty
  deep_dive:
    title: Průvodci hlubokého ponoru
    topics:
      - title: Námořní třída PVC
        desc: Vícevrstvá laminovaná tkanina PVC — odolnost vůči UV záření, testování oděru a hodnocení denier.
      - title: PVC vs. Hypalon
        desc: Definitivní srovnání dvou dominantních materiálů nafukovacích člunů — cena, životnost, odolnost vůči UV záření.
      - title: Drop-stitch jádro
        desc: Jak tisíce vnitřních závitů vytvářejí tuhé, vysokotlaké nafukovací struktury při 12-15 PSI.
      - title: Technologie RF svařování
        desc: Vysokofrekvenční svařování vytváří pevné, konzistentní švy – jak to funguje a proč na tom záleží.
      - title: PSI a výkon
        desc: Proč je tlak vzduchu pro nafukovací SUP a čluny důležitý – tuhost, nosnost a jízdní vlastnosti.
      - title: Testování kvality
        desc: Tlakové zkoušky, zkoušky vztlaku, UV stárnutí a destruktivní zkoušky – náš proces kvality.
      - title: EVA Pěnové paluby
        desc: Pěnové vycpávky s uzavřenými buňkami EVA – trakce, pohodlí a odolnost pro SUP a paluby lodí.
      - title: Péče o materiál
        desc: Čištění, UV ochrana, prevence plísní a doporučené postupy skladování pro nafukovací produkty.

