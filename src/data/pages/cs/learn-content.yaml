articles:
  sup:
    - title: SUP Základy — Průvodce pro začátečníky
      desc: Vše, co začátečník potřebuje vědět – typy prkna, velikost pádla, postoj a tipy pro první den.
    - title: SUP Průvodce velikostí
      desc: Najděte správnou délku, šířku a objem prkna pro vaši váhu, dovednosti a styl pádlování.
    - title: Nafukovací vs pevná deska
      desc: který je pro vás ten pravý? Přenosnost, výkon, odolnost a náklady v porovnání.
    - title: Středně pokročilé techniky
      desc: Zlepšete své pádlování s pokročilými údery, technikami otáčení a manipulací na drsné vodě.
    - title: Jak vybrat nafukovací člun SUP
      desc: Orientujte se v klíčových faktorech – konstrukci, tloušťce, nastavení žeber a přiloženého příslušenství.
    - title: Bezpečnost vody
      desc: Základní bezpečnostní znalosti včetně čtení počasí, výběru PFD, sebezáchrany a skupinového pádlování.
  inflatable-boat:
    - title: Reference materiálů
      desc: PVC, Hypalon, drop-stitch, denier hodnocení – pochopte, z čeho je vaše nafukovací zařízení vyrobeno.
    - title: PVC vs. Hypalon
      desc: Definitivní srovnání látek PVC a Hypalon pro nafukovací čluny – trvanlivost, odolnost vůči UV záření a náklady.
    - title: Vysvětlení jádra Drop-Stitch
      desc: Jak tisíce vnitřních závitů vytvářejí pevnou platformu při 12-15 PSI pro vysoce výkonné nafukovací SUP.
    - title: Přehled nafukovací technologie
      desc: Jak se konstruují nafukovací čluny a SUP – od nanášení materiálu až po ventilové systémy a švové svařování.
    - title: Průvodce pro pevný nafukovací člun (RIB).
      desc: Vše o konstrukci RIB, typech trupu, materiálech trubek a výběru správného RIB pro vaše potřeby.
    - title: Nafukovací člun vs RIB
      desc: Klíčové rozdíly mezi tradičními nafukovacími čluny a nafukovacími čluny s pevným trupem pro různé případy použití.
  water-safety:
    - title: Průvodce bezpečností vody
      desc: Základní bezpečnostní znalosti pro každého pádlaře – počasí, PFD, sebezáchrana a protokoly skupinového pádlování.
    - title: Záchranná vesta a průvodce PFD
      desc: Jak vybrat správné osobní plovací zařízení pro SUP, jízdu na kajaku, plavbu na lodi a profesionální použití.
    - title: SUP Bezpečnostní kontrolní seznam
      desc: Bezpečnostní kontrolní seznam před startem by měl každý paddleboardista dodržovat, než udeří do vody.
    - title: Bezpečnost pádlování ve studené vodě
      desc: Základní opatření, vybavení a techniky pro pádlování v podmínkách studené vody.
    - title: Chyby v pádlování začátečníků
      desc: Časté chyby, kterých se vodáci poprvé dopouštějí, a jak se jich vyvarovat pro bezpečnější a příjemnější zážitek.
    - title: CE Vysvětlení certifikace
      desc: Co znamená certifikace CE pro nafukovací plavidlo — normy, testování a proč je důležité pro bezpečnost.
