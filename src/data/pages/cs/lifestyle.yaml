hero:
  tagline: životní styl
  title: Paddle Board Overstock<br />Životní styl
  subtitle: Vytvořeno pro ty, kteří žijí na vodě – od víkendových průzkumníků po komerční operátory, kteří jsou každý den závislí na svém vybavení.
values:
  - icon: 🌊
    title: Narozen na vodě
    desc: Každý návrh začíná pochopením toho, jak se voda chová. Inženýrujeme od okraje podmínek dovnitř – protože oceán je naším učitelem, ne naším pracovištěm.
  - icon: 🔧
    title: Postaveno tak, aby vydrželo
    desc: Nejudržitelnější produkt je ten, který nepotřebuje výměnu. Námořní materiály, vyšívaná jádra do 15 PSI a švy, které vydrží celou sezónu.
  - icon: 🏆
    title: Přístupné podle návrhu
    desc: Vodní sporty by neměly být luxusem. Výkon na profesionální úrovni za cenu, která má smysl pro rodiny, průvodce a malé operátory – nejen pro komerční flotily.
  - icon: 🌍
    title: Globální komunita
    desc: 'Od pobřeží Qingdao po jezera v Evropě, řeky v jihovýchodní Asii a zálivy v Americe – naši zákazníci sdílejí jednu věc: lásku k pobytu na vodě.'
  - icon: ♻️
    title: Odpovědná výroba
    desc: CNC-optimalizované hnízdění snižuje množství odpadu pod 5 %. Odolná konstrukce snižuje cykly výměny. Stavíme pro dlouhou životnost, protože to je nejudržitelnější volba.
  - icon: 🤝
    title: Podpora, která trvá
    desc: Dvacet let staré trupy nás stále volají po náhradních dílech. Naše záruční odezva je v průměru 24 hodin. Po prodeji nezmizíme – jsme tu po celou dobu životnosti produktu.
