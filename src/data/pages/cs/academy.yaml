hero:
  tagline: Aquafarer Akademie
  title: Vzdělávací centrum
  subtitle: Příručky a tutoriály pro každou úroveň dovedností – od základů SUP po pokročilé záchranné techniky
categories:
  - level: Začátečník
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Základy
        desc: Naučte se základy paddleboardingu vestoje – postoj, techniku ​​úderů a rovnováhu.
        slug: beginner-sup-guide
      - title: Pádlové techniky
        desc: Zdvih vpřed, tah tahem, tah a nízká vzpěra – ovládněte základní pohyby pádla.
        slug: sup-paddle-guide
      - title: Bezpečnost především
        desc: Základní bezpečnostní postupy včetně kontrol počasí, používání PFD, pravidel pro vodítka a sebezáchrany.
        slug: sup-safety-guide
  - level: Střední
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Základy pro túry
        desc: Plánování vícehodinových pádel – navigace, hydratace, tempo a čtení předpovědí větru.
        slug: touring-sup-guide
      - title: Čtení počasí
        desc: Interpretujte mořské předpovědi, identifikujte vzory oblačnosti a pochopte účinky větru na vodu.
        slug: weather-planning-water-sports
      - title: Základy navigace
        desc: Čtení map, použití kompasu, navigační body GPS a plánování trasy pro pobřežní pádlování.
        slug: sup-navigation-guide
      - title: Povědomí o přílivu a odlivu
        desc: Pochopení přílivových cyklů, proudů a toho, jak ovlivňují načasování a směrování startu.
        slug: understanding-tides
  - level: Moderní
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Plánování vícedenních výletů
        desc: Expediční logistika — výběr vybavení, plánování jídla, bezpečnostní protokoly a nouzové kontakty.
        slug: sup-travel-guide
      - title: Záchranné techniky
        desc: Sebezáchrana, T-záchrana, eskymácká záchrana pro kajaky a vlečné protokoly pro otevřenou vodu.
        slug: sup-self-rescue
      - title: Noční pádlování
        desc: Navigace po setmění – požadavky na osvětlení, paměť trasy, skupinová komunikace a povědomí o nebezpečí.
        slug: sup-navigation-guide
  - level: Údržba
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Čištění a péče
        desc: Oplach sladkovodní vodou, UV ochrana, prevence plísní a správné techniky sušení po každém sezení.
        slug: inflatable-sup-maintenance
      - title: Průvodce skladováním
        desc: Nejlepší postupy pro skladování nafukovacích prken a člunů – vyfukování, skládání, kontrola teploty a trvanlivost.
        slug: inflatable-sup-storage
      - title: Základy oprav
        desc: Opravte malé propíchnutí, netěsnosti ve švech a problémy s ventily pomocí opravných sad a oprav PVC.
        slug: inflatable-sup-repair
      - title: Údržba ventilů
        desc: Identifikujte typy ventilů (Halkey-Roberts, Boston, Leafield), vyčistěte nečistoty a vyměňte vadné vřetena.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centrum znalostí
knowledge_center_title: Námořní vybavení a průmysloví průvodci
knowledge_center_subtitle: Odborné znalosti a průvodce nákupem pro námořní profesionály, provozovatele flotil a nadšence do vodních sportů.
knowledge_sections:
  - title: RIB Lodní znalosti
    tagline: Pevná vodítka pro nafukovací čluny
    desc: Vše o RIB lodích – design trupu, materiály, výběr motoru, údržba a poradenství při nákupu pro komerční a rekreační využití.
    guides:
      - title: Jak vybrat správnou loď RIB
        desc: Kompletní průvodce výběrem RIB – velikost, výkon motoru, materiál trubky, typ trupu a zamýšlené použití.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs nafukovací člun
        desc: Pevný nafukovací člun vs tradiční nafukovací člun – porovnání konstrukce trupu, výkonu, odolnosti a kapacity.
        href: /compare/rib-vs-dinghy
      - title: Komerční RIB vs. rekreační RIB
        desc: Komerční vs. rekreační RIB lodě – konstrukční normy, materiály, životnost, náklady a certifikace.
        href: /compare/commercial-vs-recreational-rib
      - title: Hliník vs sklolaminátový trup
        desc: Porovnejte hliníkové a laminátové trupy pro RIB lodě z hlediska hmotnosti, ceny, životnosti a odolnosti proti korozi.
        href: /compare/aluminum-vs-fiberglass
  - title: Průvodce nafukovacím člunem
    tagline: Znalosti nafukovacích plavidel
    desc: Komplexní průvodce nafukovacími čluny — PVC vs Hypalon, konstrukční metody, bezpečnostní normy a osvědčené postupy údržby.
    guides:
      - title: PVC vs Hypalon Průvodce materiálem
        desc: Definitivní srovnání mezi PVC a Hypalon CSM pro konstrukci nafukovacího člunu.
        href: /compare/pvc-vs-hypalon
      - title: Jak se vyrábějí nafukovací čluny
        desc: Výrobní proces — řezání materiálu, HF svařování, konstrukce švů, tlakové zkoušky a kontrola kvality.
        href: /learn/inflatable-technology
      - title: Bezpečnostní průvodce nafukovacích člunů
        desc: Bezpečnostní normy, nosnost, správné nafouknutí, kontroly před odjezdem a nouzové postupy.
        href: /learn/water-safety
      - title: Údržba nafukovacích člunů
        desc: Čištění, skladování, UV ochrana, zazimování a opravy nafukovacích člunů a RIB.
        href: /v2/inflatable-boat-maintenance
  - title: Lodní znalosti
    tagline: Nafukovací člun a RIB Hub
    desc: Technické příručky týkající se typů nafukovacích člunů, materiálů, konstrukčních metod, údržby a bezpečnosti – od člunů po RIB.
    guides:
      - title: Typy nafukovacích člunů
        desc: Čluny, RIB, kajaky a tendra — naučte se rozdíly a vyberte si ten správný.
        href: /v2/inflatable-boat-buying-guide
      - title: Technologie Drop-Stitch
        desc: Jak tisíce vnitřních závitů vytvářejí tuhé, vysokotlaké nafukovací konstrukce.
        href: /learn/drop-stitch-core
      - title: Reference materiálů
        desc: Vysvětlení hodnocení PVC denier, hmotnosti látek, odolnosti vůči UV záření a materiálů námořní kvality.
        href: /learn/materials
      - title: RIB vs člun
        desc: Porovnejte pevné nafukovací čluny s tradičními nafukovacími čluny pro různé případy použití.
        href: /compare/rib-vs-dinghy
  - title: SUP Znalosti
    tagline: Vodítka na paddleboard ve stoje
    desc: Vše o SUP prknech – nafukovací vs. pevné, rozměry prkna, materiálové technologie a odborné rady pro všechny úrovně dovedností.
    guides:
      - title: Nafukovací vs tvrdý SUP
        desc: Porovnejte iSUP a tvrdé epoxidové desky z hlediska přenosnosti, odolnosti, výkonu a hodnoty.
        href: /learn/sup
      - title: SUP Průvodce rozměry desky
        desc: Jak délka, šířka a tloušťka ovlivňují stabilitu, rychlost a manévrovatelnost.
        href: /learn/sup
      - title: SUP Údržba a péče
        desc: Tipy pro čištění, skladování, ochranu proti UV záření a opravy pro nafukovací prkna SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Výběr prvního SUP
        desc: Průvodce pro začátečníky k výběru správného paddleboardu na stojan pro vaši váhu, úroveň dovedností a zamýšlené použití.
        href: /learn/sup
  - title: Průvodce potápěčským vybavením
    tagline: Znalost komerčních potápěčských člunů
    desc: Specializovaní průvodci na potápěčských člunech, potápěčských žebrách a vybavení pro potápěčská centra, operátory potápění a komerční potápěčské týmy.
    guides:
      - title: Nejlepší RIB loď pro potápěčská centra
        desc: Jak vybrat správný ponor RIB pro vaše potápěčské centrum – kapacita, konfigurace a rozpočet.
        href: /solutions-diving-center-boats
      - title: Konfigurační průvodce ponorem RIB
        desc: Základní funkce potápěčských RIB – stojany na nádrže, žebříkové systémy, potápěčská plošina a úložiště vybavení.
        href: /solutions-diving-center-boats
  - title: Průvodce výběrovými řízeními na jachty
    tagline: Superyacht & Marine Tender řešení
    desc: Průvodce výběrem perfektní nabídky pro jachty – nafukovací nabídky, nabídky RIB, úložná řešení a příslušenství pro nabídky.
    guides:
      - title: Jak vybrat nabídku na jachtu
        desc: Faktory, které je třeba vzít v úvahu při výběru nabídky pro vaši jachtu – velikost, materiál, motor a sklad.
        href: /solutions-yacht-tender-solutions
      - title: Nafukovací vs RIB Nabídky
        desc: Porovnejte nabídky pro nafukovací člun s pevnými nabídkami pro nafukovací čluny z hlediska výkonu, odolnosti a skladnosti.
        href: /compare/rib-vs-dinghy
  - title: Průvodce záchranným vybavením
    tagline: Znalosti vyhledávání a záchrany vodních skútrů
    desc: Profesionální průvodci na záchranných člunech, SAR plavidlech a vybavení pro reakci na mimořádné události pro pobřežní stráž, plavčíky a týmy pro pomoc při katastrofách.
    guides:
      - title: SAR Průvodce výběrem lodi
        desc: Jak vybrat správný pátrací a záchranný člun – rychlost, kapacita, odolnost a požadavky na specializované vybavení.
        href: /solutions-rescue-watercraft
      - title: Komerční RIB pro záchranné operace
        desc: Proč jsou RIB komerční kvality preferovanou volbou pro profesionální pátrací a záchranné týmy po celém světě.
        href: /use-cases/search-and-rescue
