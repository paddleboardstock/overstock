trustSignals:
  tagline: Důvěřujte signálům
  title: Proč je Paddle Board Overstock spolehlivý partner
  manufacturing:
    title: Výrobní kapacita
    body: Výrobní závod o rozloze 12 000 m² s 200–300 kvalifikovanými pracovníky a více než 14 inženýry výzkumu a vývoje. ISO 9001 certifikovaný systém managementu kvality. Roční produkce 15 000 jednotek nafukovacích plavidel sloužících více než 50 zemím.
    stats:
      - label: Velikost zařízení
        value: 12 000 m²
      - label: Pracovní síla
        value: 200-300
      - label: Inženýři výzkumu a vývoje
        value: 14+
      - label: Roční kapacita
        value: 15 000
  quality:
    title: Závazek kvality
    body: Od inspekce materiálu až po závěrečné testování, Paddle Board Overstock udržuje systematické procesy kvality, aby dodávala spolehlivé námořní produkty. Každá jednotka před odesláním prochází tlakovou zkouškou, kontrolou švů a ověřením výkonu.
    items:
      - CE Certifikováno — 64 modelů splňuje evropské bezpečnostní normy
      - ISO 9001:2015 — Certifikován systém managementu kvality
      - UKCA Označeno — Shoda s britským trhem
  global:
    title: Globální přítomnost
    body: Paddle Board Overstock slouží zákazníkům na různých globálních trzích, podporuje distributory, outdoorové značky a profesionální námořní uživatele ve více než 50 zemích v Evropě, Asii a Tichomoří, Americe, na Středním východě a v Africe.
comparison:
  tagline: Umístění značky
  title: Paddle Board Overstock na trhu
  position: Námořní výrobce zaměřený na strojírenství kombinující odborné znalosti v oblasti nafukovacích plavidel s plnou schopností OEM/ODM, zakázkový vývoj a více než 12 let zkušeností s exportní výrobou.
  strengths:
    - Zkušenosti s inženýrstvím nafukovacích plavidel
    - Plná výrobní kapacita OEM/ODM
    - Vývoj a design produktů na zakázku
    - 12 000 m² ISO-certifikované výrobní zařízení
  bestFor:
    - Venkovní rekreační uživatelé, kteří hledají spolehlivé nafukovací vodní skútry
    - Provozovatelé námořní dopravy vyžadující vybavení komerční úrovně
    - Značkoví partneři potřebují OEM/ODM výrobu
    - Profesionální záchranné a hlídkové organizace

