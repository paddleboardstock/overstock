hero:
  tagline: Entita značky
  title: Paddle Board Overstock — Inženýrská svoboda na vodě
  definition: Paddle Board Overstock je globální značka pro námořní rekreaci a nafukovací plavidla specializující se na nafukovací čluny, systémy SUP a přizpůsobená námořní řešení. Paddle Board Overstock spojuje námořní inženýrství, výrobní odborné znalosti a kulturu průzkumu vody a vytváří spolehlivé vybavení pro rekreační uživatele, profesionální operátory a globální OEM partnery.
timeline:
  - year: '2012'
    title: Nadace námořní výroby
    body: Paddle Board Overstock začala jako specializovaná dílna na výrobu nafukovacích plavidel v Qingdao v Číně, která se zavázala k námořnímu řemeslu a výrobě nafukovacích člunů. Prvotním zaměřením bylo vytváření spolehlivých nafukovacích produktů prostřednictvím praktických inženýrských zkušeností a výrobní disciplíny.
  - year: '2015'
    title: První export a certifikace CE
    body: Počáteční exportní objednávky dorazily do Japonska a Koreje. Certifikace CE byla dosažena pro základní produktové řady, což znamená vstup společnosti Paddle Board Overstock na mezinárodní trhy. Společnost začala sloužit komerčním a rekreačním uživatelům mimo Čínu.
  - year: '2018'
    title: Rozšíření továrny
    body: Přemístěna do výrobního závodu o rozloze 12 000 m². Přidány RF svařovací linky a výrobní kapacita drop-stitch, což umožňuje výrobu ve větším měřítku a vylepšené systémy kontroly kvality.
  - year: '2020'
    title: Zřízeno R&D centrum
    body: Otevřeno specializované R&D centrum s PVC látkovou laboratoří, hydrodynamickou testovací nádrží a CAD/FEA simulačním studiem. Vývoj produktu se rozšířil a zaměřil se na lehkou konstrukci, zlepšenou odolnost a design zaměřený na uživatele.
  - year: '2022'
    title: ISO 9001 a globální růst
    body: Dosáhl certifikace ISO 9001. Rozšířeno na 14 R&D inženýrů a 200+ pracovníků. Produkty se dostaly k zákazníkům v celé Evropě, Americe a Asii a Tichomoří prostřednictvím distributorů a OEM partnerství.
  - year: '2024'
    title: Studio inovací a designu
    body: Zahájení kompletního designového a inovačního studia pro zakázkové ODM projekty, od konceptu až po výrobu. Posílené profesionální námořní aplikace včetně záchranných, komerčních a vládních výběrových řízení.
  - year: '2026'
    title: Budování budoucnosti průzkumu vody
    body: Dnes společnost Paddle Board Overstock pokračuje ve vývoji nafukovacích člunů, systémů SUP a přizpůsobených námořních řešení – spojujících lidi a organizace se světovými vodami. Obsluhováno více než 50 zemí, roční kapacita 15 000 jednotek.
philosophy:
  tagline: Filozofie značky
  title: Inženýrská svoboda na vodě
  body: Svoboda na vodě není jen o pohybu. Představuje objevování nových míst, vytváření outdoorových zážitků, propojení lidí s přírodou a umožnění profesionálních misí. Inženýrství tuto svobodu umožňuje.
  pillars:
    - title: Spolehlivost na prvním místě
      body: Vodní prostředí vyžaduje důvěru. Paddle Board Overstock produktů je navrženo s ohledem na stabilitu, odolnost, bezpečnost a konzistentní výkon.
    - title: Design zaměřený na člověka
      body: Produkty by měly sloužit lidem, ne technologiím. Každé rozhodnutí o designu začíná pochopením toho, jak lidé používají plavidla, kde zkoumají a jakým výzvám čelí.
    - title: Přístupný průzkum
      body: Voda by neměla patřit jen odborníkům. Paddle Board Overstock vytváří vybavení, které umožňuje více lidem bezpečně zažít řeky, jezera, oceány a pobřežní prostředí.
    - title: Neustálá inovace
      body: Inovace neznamená pouze vytváření nových produktů. Zlepšuje každý detail – materiály, struktury, výrobu a uživatelskou zkušenost.
engineeringDna:
  tagline: Inženýrská DNA
  title: Jak Paddle Board Overstock vytváří produkty
  areas:
    - title: Materiálová věda
      body: Paddle Board Overstock se zaměřuje na výběr vhodných materiálů pro různá mořská prostředí. Mezi klíčové aspekty patří odolnost proti oděru, UV odolnost, tlaková stabilita a dlouhodobá životnost.
      items:
        - Odolnost proti oděru
        - UV odolnost
        - Stabilita tlaku
        - Dlouhodobá životnost
    - title: Pozemní inženýrství
      body: Nafukovací plavidla vyžadují přesnou rovnováhu mezi tuhostí, hmotností, přenosností a stabilitou. Paddle Board Overstock inženýrství se zaměřuje na optimalizaci těchto faktorů prostřednictvím technologie drop-stitch jádra a pokročilé konstrukce švů.
      items:
        - Tuhost
        - Optimalizace hmotnosti
        - Přenosnost
        - Stabilita
    - title: Výrobní přesnost
      body: 'Každý výrobek prochází řízenými procesy: příprava materiálu, přesné řezání, svařování a lepení, montáž, kontrola kvality a ověřování výkonu.'
      items:
        - Příprava materiálu
        - Přesné řezání
        - Svařování a lepení
        - Montáž a kontrola kvality
    - title: Inženýrství uživatelských scénářů
      body: Produkty jsou vyvíjeny na základě skutečných aplikací – rekreace, dobrodružství a profesionální použití – zajišťující, že každý design splňuje specifické požadavky zamýšleného prostředí.
      items:
        - Rekreace
        - Dobrodružství
        - Profesionální
        - Komerční
