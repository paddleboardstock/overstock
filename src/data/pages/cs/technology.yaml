testimonial:
  quote: To, co odlišuje Aquafarer, je jejich materiálová věda. Nekomponenty pouze montují – konstruují PVC sloučeniny, parametry svarů a konstrukční uspořádání ve firmě. Tato vertikální integrace se projevuje v konečném produktu.
  author: David Park
  title: Manažer vývoje produktů
  company: Bluewater Sports Equipment
  location: Austrálie
sections:
  - title: Drop-stitch jádro
    standard: Provozní tlak 12-15 PSI
    description: Tisíce vnitřních polyesterových nití spojují horní a spodní vrstvu a vytvářejí pevnou strukturu při 12-15 PSI. Jedná se o stejnou technologii používanou u profesionálních paddleboardů a nafukovacích závodních člunů. Naše hustota drop-stitch je optimalizována pro každý model pro ideální rovnováhu mezi tuhostí a hmotností.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Diagram drop-stitch jádra
  - title: Námořní třída PVC
    standard: Fusion-svařované | UV / slaná voda / testováno na otěr
    description: Vícevrstvá laminovaná tkanina PVC určená pro mořské prostředí. Každá vrstva je spíše tavně svařena než slepena, což eliminuje rizika delaminace. Testováno na odolnost vůči UV záření (ASTM G154, 1000+ hodin), korozi slanou vodou (ISO 9227) a otěru (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC vrstva
  - title: Hypalon Trubky
    standard: CSM pryž | Odolné vůči UV záření / chemikáliím / extrémním teplotám
    description: Při použití na modelech RIB poskytuje pryž Hypalon (CSM) vynikající odolnost vůči UV záření a chemikáliím ve srovnání se standardními PVC. Trubky Hypalon si zachovávají pružnost při extrémních teplotách a odolávají degradaci působením paliva a oleje. Všechny švy jsou ručně položeny certifikovanými techniky.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Podlaha vzduchové paluby
    standard: Vysokotlaké nafukovací | Nahrazuje překližku/hliník
    description: Vysokotlaký nafukovací podlahový systém nahrazující tradiční překližkové nebo hliníkové lamelové podlahy. Zkracuje dobu montáže, celkovou hmotnost a úložný objem a zároveň poskytuje dostatečnou tuhost pro stání, rybaření a chůzi. Testováno na podporu 200+ kg rozložené zátěže.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Vzduchové dno
