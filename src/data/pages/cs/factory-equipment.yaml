hero:
  tagline: Zařízení
  title: Výrobní zařízení a stroje
  subtitle: Průmyslová zařízení pro řezání, svařování, tisk a montáž
  back_label: Zpět do továrny
  back_link: /factory
categories:
  - title: Řezání a příprava materiálu
    items:
      - name: Automatický řezací stroj PVC
        spec: CNC řízené, 6,5 m × 2,5 m, přesnost 0,1 mm
        desc: Počítačem řízený automatický řezací stroj pro PVC, Hypalon a tkaniny s kapkovým stehem. Nesting software optimalizuje využití materiálu pod 5 % odpadu.
      - name: Rozmetadlo tkaniny
        spec: 3 m max. šířka, posuv řízený tahem
        desc: Pokládá látku do jedné nebo více vrstev s kontrolovaným napětím, aby se zabránilo deformaci před řezáním.
  - title: Svařování a lepení trubek
    items:
      - name: Stroj na tepelné těsnění
        spec: Horkovzdušné svařování, variabilní 200–600 °C, 0,5–5 m/min
        desc: Horkovzdušný tepelný svařovací stroj pro lepení a svařování PVC a Hypalon trubkových švů. Používá se pro lepení, těsnění a tavení trubkových komor a plovákových spojů.
      - name: Dielektrický RF lis
        spec: 15 kW, deska 2000 × 600 mm
        desc: Radiofrekvenční svařovací lis pro hlavní podélné švy, spoje mezi příčníkem a trubkou a velkokomorovou výrobu.
      - name: CNC řízená RF svářečka
        spec: 8 kW, stůl XY 2500 × 1200 mm
        desc: Programovatelné svařování se zakřiveným švem pro složité geometrie, embosování loga a precizní patchwork.
  - title: RIB Výroba trupu
    items:
      - name: Sklolaminátové Ruční Lay-Up formy
        spec: Více forem pro RIB trupy do 6 m LOA
        desc: Tradiční ruční lití ze skelných vláken se systémy polyesterových a vinylesterových pryskyřic. Každá vrstva je ručně válcovaná a vakuově zabalená pro konzistentní kvalitu a pevnost laminátu.
      - name: Gelcoat stříkací kabina
        spec: Teplotně řízená ventilace filtrovaného vzduchu
        desc: Gelcoat aplikace pro RIB trupy. Poskytuje vysoce lesklý povrch odolný vůči UV záření s přesnou kontrolou tloušťky.
      - name: CNC router (5osý)
        spec: Plášť 3 m × 2 m × 1 m, vodou chlazené vřeteno
        desc: Obrábění vložek trupu, forem konzol, základů sedadel a vlastních držáků.
  - title: SUP Tisk a dekorace
    items:
      - name: Digitální tiskárna
        spec: Inkoustová tiskárna s vysokým rozlišením, šířka tisku až 2 m
        desc: Digitální tisk přímo na látku pro plnobarevnou grafiku SUP paluby. Tiskne vlastní vzory, přechody a obrázky ve fotografické kvalitě pomocí inkoustů na vodní bázi odolných vůči UV záření.
      - name: Sítotiskový stroj
        spec: Ruční a poloautomatická, vícebarevná registrace
        desc: Sítotisk pro SUP loga desek, značky a opakující se vzory. Poskytuje odolné, neprůhledné výtisky se zářivou sytostí barev.
  - title: Montáž a vybavení
    items:
      - name: Zvedák motoru
        spec: Nosnost 500 kg, nastavitelná rozpěrná tyč
        desc: Bezpečná montáž přívěsných motorů od 2,5 do 60 hp.
      - name: Mock-up rám konzole
        spec: Nastavitelná výška a úhel
        desc: Předmontáž řízení, škrticí klapky a přístrojových desek před instalací.
      - name: Hydraulický lis na hadice
        spec: Do 1" ID, digitální manometr
        desc: Sestavy hydraulických hadic řízení vlastní délky se zalisovanými koncovkami.
      - name: Deska elektrického svazku
        spec: 3 m × 1,5 m, předtištěná schémata zapojení
        desc: Off-lodní montáž a testování kompletních elektrických svazků.
  - title: Testování a kontrola kvality
    items:
      - name: Univerzální zkoušečka tahu
        spec: 50 kN, / ASTM D751
        desc: Testování pevnosti při přetržení, prodloužení při přetržení a roztržení pro šarže látek.
      - name: Testovací zařízení na zadržování vzduchu
        spec: Programovatelné, 30minutové udržení tlaku
        desc: Automatizovaný test udržení tlaku pro každou komoru trubky před montáží.
      - name: Tester odlupování švů
        spec: Motorizované 180° odlupování rychlostí 100 mm/min
        desc: Testování pevnosti svaru a odlupování lepeného švu podle ISO 6185.
      - name: Xenon-Arc zvětrávací komora
        spec: 2000 h expozice
        desc: Testování odolnosti vůči UV záření pro změnu barvy a zachování pevnosti.
