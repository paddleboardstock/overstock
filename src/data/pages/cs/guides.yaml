hero:
  tagline: Průvodci
  title: Jste novým uživatelem SUP?
  subtitle: Praktické příručky, které vám pomohou vybrat, používat a užívat si nafukovací vybavení pro vodní sporty.
size_guide:
  tagline: Velikost a specifikace
  title: Najděte správnou velikost pro své potřeby
  desc: Porovnejte rozměry produktu, nosnost a doporučené použití. Ať už potřebujete turistický kajak SUP, kompaktní kajak nebo komerční kajak RIB – náš průvodce velikostí vám pomůže vybrat ten správný.
  link_label: Průvodce v plné velikosti se specifikacemi produktu →
  link: /size-guide
  cards:
    - title: SUP Desky
      desc: Délku zvolte podle své hmotnosti a zamýšleného použití. Širší prkna (32"+) nabízejí větší stabilitu. Delší prkna (11–12 stop) lépe vedou na turistiku.
    - title: Kajaky
      desc: Jednoduché kajaky (9 stop) pro sólo cestování a řeky. Tandemové kajaky (12 stop) pro dva vodáky nebo jednoho s vybavením. Vždy zkontrolujte nosnost.
    - title: Čluny a žebra
      desc: Vyberte délku podle počtu cestujících a použití. Větší RIB (4,5 m+) pro offshore a záchranu. Menší čluny (2,7 m) jako tendry a rybářské plošiny.

