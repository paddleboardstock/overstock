content_segments:
  tagline: Profily partnerů
  title: Distribuční modely partnerství<br />Podle typu partnera
  subtitle: Různí distributoři přinášejí různé silné stránky pro vstup na trh – regionální infrastrukturu, dosah elektronického obchodu, speciální maloobchod nebo portfolia více značek. Strukturujeme podmínky partnerství, cenové úrovně a úrovně podpory tak, aby odpovídaly profilu každého partnera.
  items:
    - title: Regionální námořní distributoři
      subtitle: Územně exkluzivní B2B distribuce
      description: Etablovaní distributoři se skladovou infrastrukturou, sítěmi prodejců a logistickými schopnostmi sloužící námořním prodejcům, prodejcům vodních sportů a provozovatelům půjčoven v rámci definovaného geografického území. Potřebujete kompletní produktovou řadu, chráněné ceny a schopnost obsluhovat účty prodejců s místním skladem a podporou.
      features:
        - Exkluzivní ochrana území s minimálními podmínkami závazku
        - Kompletní katalogové velkoobchodní ceny se čtvrtletními množstevními slevami
        - Program místních skladových zásilek pro rychloobrátkové SKU
        - Školení dealerské sítě a programy společného marketingu
    - title: Elektronický obchod a online prodejci
      subtitle: Digital-first distribuční kanály
      description: Internetoví maloobchodníci prodávající vybavení pro vodní sporty prostřednictvím Amazonu, eBay nebo vlastních platforem elektronického obchodu. Rozhodující jsou rychlost uvedení na trh, konkurenceschopné ceny a logistika přímo ke spotřebiteli. Potřebujete partnera, který dokáže zasílat jednotlivé objednávky pod vaší značkou s rychlým plněním a nulovým rizikem zásob.
      features:
        - 'Program Drop-ship: plnění vaší značky přímo z výroby'
        - Zdroj API inventáře v reálném čase pro vaši platformu elektronického obchodu
        - Integrace Amazon Seller Central s podporou EAN/UPC
        - Včetně logistiky vrácení a zpracování záručních reklamací
    - title: Specializovaní prodejci vodních sportů
      subtitle: Partneři kamenných showroomů
      description: Fyzické maloobchodní prodejny specializující se na vybavení pro vodní sporty – poskytující místním vodákům, rybářům a vodákům osobní prodej, ukázky a poprodejní servis. Potřebujete obaly optimalizované pro maloobchod, programy předváděcích jednotek a materiály pro prodejní místa, které převedou zákazníky, kteří vás mohou navštívit.
      features:
        - 'Program demo jednotek: zlevněné výstavní panely v showroomu'
        - Balení připravené pro maloobchodní prodej s designem krabice optimalizovaným pro police
        - Displeje v místě prodeje, srovnávací tabulky a průvodce kupujícími
        - Školení a certifikační program zaměstnanců v prodejně
    - title: Distributoři více značek a obchodních domů
      subtitle: Široká distribuce sportovního zboží
      description: Velcí distributoři obsluhující obchodní domy, velkoprodejce a řetězce se sportovním zbožím s katalogy různých značek. Důslednost, dokumentace shody a shoda dodavatele jsou prvořadé – každá jednotka SKU musí splňovat specifické normy pro balení, označování a kvalitu maloobchodníka.
      features:
        - 'Dokumentace o shodě prodejce: specifikace balení, čárový kód, označení'
        - Integrace EDI/ASN pro objednávkové systémy velkých maloobchodníků
        - Zásoby řízené dodavatelem a programy automatického doplňování
        - Vyhrazená správa účtů s 24hodinovou odezvou SLA
