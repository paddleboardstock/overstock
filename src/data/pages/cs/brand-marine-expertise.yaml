hero:
  tagline: Námořní expertizy
  title: Desetiletí námořního inženýrství<br />v každém trupu
  subtitle: Aquafarer kombinuje hlubokou materiálovou vědu, přesnou výrobu a testování v reálném světě a vyrábí plavidla, která fungují, když je to důležité.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Námořní inženýrský a vývojový tým Aquafareru při práci
expertise_materials:
  tagline: Materiálová věda
  title: Výběr správného materiálu<br />pro každou aplikaci
  subtitle: Pracujeme se třemi základními materiály – každý vybraný pro konkrétní případy použití a požadavky na výkon.
  columns: 3
  items:
    - title: Námořní třída PVC
      description: Tkanina 1100 denier PVC — náš nejuniverzálnější materiál. UV stabilizované, odolné proti oděru a vyhovující REACH. Ideální pro rekreační lodě, prkna SUP a kajaky, kde záleží na hmotnosti a hospodárnosti.
      icon: tabler:droplet
    - title: Prémiové Hypalon/CSM
      description: Vynikající chemická odolnost a UV stabilita. Hypalon lodě mohou při správné péči vydržet 15-20 let. Doporučeno pro komerční, záchranné a vojenské aplikace, kde je kritická dlouhodobá životnost.
      icon: tabler:shield
    - title: Sklolaminát a hliník
      description: Sklolaminátové trupy Deep-V pro RIB a hlídkové čluny – výkon při řezání vln v drsných podmínkách. Hliníkové trupy pro těžké komerční pracovní lodě vyžadující maximální pevnost a nosnost.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Výrobní schopnosti
  title: Přesná výroba<br />na každém kroku
  subtitle: Náš závod o rozloze 12 000 m² je vybaven specializovaným strojním zařízením pro každou fázi výroby.
  columns: 2
  items:
    - title: CNC řezání
      description: Počítačem řízené řezání zajišťuje přesné, opakovatelné látkové panely s minimálním odpadem. Každý kus sedí přesně podle návrhu.
      icon: tabler:cpu
    - title: Vysokofrekvenční svařování
      description: Průmyslové HF svařování vytváří švy pevnější než základní materiál. Konzistentní regulace teploty a tlaku zajišťuje vzduchotěsné utěsnění při každé výrobě.
      icon: tabler:bolt
    - title: Sestava jádra Drop Stitch
      description: Tisíce polyesterových nití spojují vrchní a spodní textilní vrstvy, což umožňuje vysokotlaké nafouknutí (15-20 PSI) pro tuhé, stabilní SUP desky a podlahy.
      icon: tabler:building-arch
    - title: Tlakové zkoušky
      description: Každý nafukovací výrobek je před odesláním tlakově testován. RIB trubek je testováno při 1,25x jmenovitém tlaku – pokud tam vydrží, bude fungovat na vodě.
      icon: tabler:wind
    - title: Testování pevnosti švu
      description: Náhodné vzorky z každé výrobní šarže procházejí destruktivním testováním pevnosti švu. Výsledky jsou protokolovány a sledovatelné ke konkrétním výrobním sériím.
      icon: tabler:files
    - title: Testování vody
      description: Každý model RIB prochází před certifikací námořními zkouškami. Testování v reálném světě v pobřežních podmínkách ověřuje výkon, ovladatelnost a stabilitu.
      icon: tabler:ripple
expertise_design:
  tagline: Design a konstrukce
  title: Navrženo pro skutečné podmínky
  subtitle: Naše filozofie designu začíná tím, jak bude loď používána – a poté stavíme inženýrství kolem tohoto případu použití.
  items:
    - title: Design trupu s hlubokým V
      description: Naše sklolaminátové trupy mají vypočítané úhly mrtvého stoupání optimalizované pro délku každého modelu a zamýšlené použití. Strmější V pro výkon v drsné vodě, mělčí pro stabilitu.
    - title: Vícekomorová bezpečnost
      description: Každá loď má 3-7 nezávislých vzduchových komor. Pokud je ohrožena jedna komora, zbývající komory udrží loď nad vodou a provozuschopnou.
    - title: Ergonomické rozložení
      description: Poloha konzoly, výška trubky a umístění sedadla jsou navrženy s ohledem na pohodlí operátora při dlouhodobém používání – ať už při hlídkování, rybaření nebo přepravě.
    - title: Vlastní konfigurace
      description: Barvy trubek, konfigurace konzoly, kapacita paliva, držáky příslušenství – každý model lze upravit tak, aby odpovídal specifickým provozním požadavkům.
