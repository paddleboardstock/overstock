hero:
  tagline: OEM/ODM Výroba
  title: OEM & Výroba soukromých značek
  subtitle: Od konceptu po kontejner – přizpůsobte si každý detail své řady nafukovacích plavidel
intro: Paddle Board Overstock nabízí komplexní služby OEM a ODM pro značky, distributory a vládní agentury po celém světě. S více než 10 lety zkušeností s exportem a 12 000 m² ISO 9001 & BSCI certifikované továrny se zabýváme vším od návrhu produktu a vývoje forem až po plnohodnotnou výrobu, balení a logistiku.
