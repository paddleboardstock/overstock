why_us:
  - title: Vertikální integrace
    description: Vlastníme naši továrnu, formy a dodavatelský řetězec – žádní prostředníci, žádní subdodavatelé. To nám dává kontrolu nad kvalitou, cenou a dodáním.
  - title: Duální certifikace
    description: ISO 9001 management kvality a BSCI certifikace sociální shody. Zprávy o auditu továrny jsou k dispozici na vyžádání.
  - title: CE Soulad
    description: Všechny standardní modely mají certifikaci CE 2013/53/EU. Vlastní modely mohou být CE certifikovány prostřednictvím našeho zavedeného procesu.
  - title: Nízké MOQ
    description: Začněte s pouhými 5 jednotkami u standardních modelů. Pomáháme rozvíjejícím se značkám na trh, aniž bychom přetěžovali zásoby.

