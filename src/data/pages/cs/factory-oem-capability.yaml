services:
  - title: Produktový design a inženýrství
    description: Náš interní R&D tým pracuje s vaším konceptem nebo specifikací na vývoji CAD výkresů, 3D modelů a prototypů. Nabízíme návrh forem, optimalizaci tvaru trupu a poradenství při výběru materiálu.
  - title: Vlastní branding a grafika
    description: Plnobarevný digitální tisk, sítotisk, ražba a možnosti štítků. Vyvíjíme grafiku palubek specifickou pro značku, branding tub a balení připravené pro maloobchod.
  - title: Přizpůsobení materiálu a specifikace
    description: Vyberte si z PVC (standardní, ekologické, nehořlavé), Hypalon/CSM, drop-stitch a hybridních konstrukcí. Zakázkové barvy trubky, váhy látky a možnosti zesílení.
  - title: Balení a logistika
    description: Zakázkové maloobchodní balení, privátní krabice, vakuové balení, paletizace a nakládání kontejnerů. Dostupné dodací podmínky FOB Qingdao, CIF nebo DDP.
