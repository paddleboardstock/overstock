hero:
  tagline: Proč Aquafarer
  title: Postaveno jinak. Vytvořeno pro podnikání.<br />Partner Behind Water Adventures Worldwide
  subtitle: Nejen výrobce – obchodní partner, který navrhuje, konstruuje a dodává vybavení na komerční úrovni pro kluby, resorty, provozovatele půjčoven a nové vodní značky.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Výrobní kvalita a odbornost Aquafareru
pillars:
  tagline: Tři pilíře partnerství
  title: Proč si světové vodohospodářské podniky vybírají Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Navrženo pro komerční použití
      description: Naše vybavení je navrženo pro denní pronájem, ne víkendovou rekreaci. Komerční třída PVC, zesílená jádra drop-stitch, možnosti UV stabilní Hypalon a hardware testovaný v terénu znamenají nižší údržbu, delší životnost a vyšší návratnost investic pro váš provoz.
      icon: tabler:building-factory
      callToAction:
        text: Viz komerční produktová řada
        href: /products
    - title: Od nápadu k trhu
      description: 'Spusťte svou značku vodních sportů za 90 dní. Provedeme vás každým krokem: ověření konceptu, výběr produktu, prototyp, výroba, návrh balení a globální doprava. Žádný tlak na minimální objednávku – začněte v malém, škálujte s jistotou.'
      icon: tabler:rocket
      callToAction:
        text: Začněte svou cestu značky
        href: /oem-odm-blueprint
    - title: Stvořeno pro globální podmínky
      description: 'Produkty optimalizované pro každé klima: formulace se studenou vodou PVC pro Evropu, materiály odolné vůči UV záření pro Střední východ a Austrálii, úpravy proti vlhkosti pro jihovýchodní Asii. Každá zásilka je kalibrována pro své cílové prostředí.'
      icon: tabler:world
