reasons:
  tagline: Rozdíl Aquafarer
  title: Co nás odlišuje
  isBeforeContent: false
  columns: 3
  items:
    - title: Skutečná výroba, ne obchodování
      description: Vlastníme a provozujeme továrnu o rozloze 12 000 m². Když se stanete partnerem Aquafarer, spolupracujete přímo s lidmi, kteří navrhují, konstruují a vyrábějí vaše produkty – žádní prostředníci.
      icon: tabler:building-factory
    - title: Technologický přístup
      description: Náš proces návrhu začíná případem použití, nikoli kategorií produktu. Optimalizujeme tvar trupu, výběr materiálu a konfiguraci pro to, jak bude zařízení skutečně používáno v komerčním prostředí.
      icon: tabler:engine
    - title: Certifikovaná kvalita
      description: CE certifikováno, ISO systém jakosti, BSCI vyhovující, REACH vyhovující, USCG schválené záchranné vesty typu III/V; všechny produkty splňují platné mezinárodní normy.
      icon: tabler:certificate
    - title: Flexibilní OEM/ODM
      description: Barvy trubek, rozložení konzoly, značka, balení – přizpůsobíme se vašim specifikacím. Žádný minimální objednávkový tlak. Začněte s prototypem, škálujte s jistotou.
      icon: tabler:adjustments
    - title: Globální logistika
      description: Americký sklad v Kalifornii, přímá doprava od Qingdao, letecká přeprava pro urgentní objednávky. Celní papírování a dokumentaci zpracováváme po celém světě.
      icon: tabler:truck-delivery
    - title: Doživotní podpora
      description: Podporujeme lodě, které jsme postavili před 20 lety. Originální náhradní díly, technické poradenství, pokyny k opravám – náš tým je k dispozici, když nás potřebujete, ať jste kdekoli.
      icon: tabler:lifebuoy
testimonials:
  tagline: Důvěra značek po celém světě
  title: Co říkají naši partneři
  items:
    - content: Spolupracovali jsme s několika výrobci v Číně, ale Aquafarer vyniká svou technickou podporou a konzistentní kvalitou. Berou naši značku jako svou vlastní.
      name: — OEM Partner, evropská značka vodních sportů
    - content: Jejich Hypalon RIB jsou v provozu s naší flotilou více než 5 let. Minimální údržba, výborná UV odolnost. 5letá záruka na trubky nám dává jistotu.
      name: — Operátor flotily, Middle East Resort Group
    - content: Tým Aquafarer nám pomohl vyvinout vlastní design desky SUP od konceptu až po výrobu za 90 dní. Kvalita předčila naše očekávání.
      name: "— Distributor, vodní sporty v Austrálii"
    - content: Jako majitel malého podniku jsem se obával MOQ. Aquafarer pracovalo s mým rozpočtem a pomohlo mi spustit moji značku s pouhými 50 deskami. Nyní objednávám 500.
      name: — Zakladatel značky, US SUP Rental Company
cta:
  title: Jste připraveni vybudovat svůj podnik s vodou?
  subtitle: Kontaktujte náš tým pro bezplatnou konzultaci. Žádné závazky – pouze upřímné rady ohledně vybavení a výroby.
  actions:
    - variant: primary
      text: Promluvte si s naším týmem
      href: /contact
    - text: Stáhněte si katalog produktů
