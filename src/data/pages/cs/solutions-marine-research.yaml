content_challenge:
  tagline: Výzva
  title: Požadavky mořského výzkumu<br />Stabilní platformy připravené pro přístroje
  subtitle: Vědecké pracovní čluny musí poskytovat stabilní platformu pro citlivé přístrojové vybavení, tichý provoz, aby nedošlo k rušení divoké zvěře, a flexibilní uspořádání pro různé výzkumné vybavení.
  paragraphs:
    - Mořský výzkum a monitorování životního prostředí vyžadují pracovní lodě, které slouží jako mobilní laboratoře. Na rozdíl od komerčních nebo rekreačních plavidel musí výzkumná RIB obsahovat citlivé elektronické přístroje, zařízení na odběr vzorků vody a sedimentů a někdy i transport živých vzorků – to vše při zachování stabilní platformy pro přesný sběr dat.
    - '**Stabilita platformy je kritická** — Sonar, echoloty a profily CTD (vodivost, teplota, hloubka) vyžadují stabilní trup v klidu a při nízké rychlosti. Nadměrný pohyb brázdy nebo trupu vnáší do vědeckých údajů hluk. deep-V trup s dobrými charakteristikami stability je nezbytný.'
    - '**Integrace přístrojů** — Výzkumná plavidla potřebují montážní body pro GPS antény, sonarové převodníky, vzorkovací ramena a zařízení pro záznam dat. Prostor konzoly musí pojmout více displejů, rozvod energie pro nástroje a bezpečné úložiště pro citlivou elektroniku.'
    - '**Tichý provoz** — Pro průzkumy mořské biologie a monitorování životního prostředí mohou hluk motoru a vibrace trupu vyděsit mořský život a ohrozit pozorování chování. Tiché vnější konfigurace a konstrukce trupu se sníženými vibracemi jsou důležité pro výzkumné aplikace.'
    - Aquafarer výzkumné RIB jsou navrženy se stabilními platformami trupu, integrovanými systémy montáže zařízení a tichými vnějšími konfiguracemi pro vědecké aplikace a aplikace monitorování životního prostředí.
content_solution:
  tagline: Naše řešení
  title: Účelová výzkumná RIB<br />Pro vědu a práci v oblasti životního prostředí
  subtitle: Každý Aquafarer výzkum RIB je nakonfigurován jako stabilní, přizpůsobitelná platforma pro vědecké přístroje a zařízení pro odběr vzorků v terénu.
  list:
    - Sklolaminátový trup Deep-V s vynikající stabilitou v klidu a při nízkých rychlostech průzkumu
    - Rozložení ploché paluby s montážními deskami pro sonar, GPS a vzorkovací zařízení
    - Konzole konfigurovaná pro více displejů — plotr, siréna, záznamník dat
    - 12V a 24V doplňkový rozvod napájení pro vědecké přístroje
    - Tichý 4taktní přívěsný motor — minimální vibrace a hluk pro průzkumy divoké zvěře
    - Volitelný design trupu s nízkou probuzením pro minimální rušení při sběru dat
    - Zakázkové barvy trubky pro značkování výzkumné instituce a identifikaci loďstva
content_segments:
  tagline: Výzkum profilů
  title: Řešení námořní vědy<br />Podle typu aplikace
  subtitle: Různé výzkumné aplikace mají jedinečné požadavky na plavidla – od univerzitních výukových platforem přes plavidla pro průzkum životního prostředí až po RIB pro monitorování kvality vody.
  items:
    - title: Univerzitní programy námořní vědy
      subtitle: Výukové platformy, studentské exkurze, pobřežní výzkum
      description: Námořní univerzity a oceánografická oddělení potřebují spolehlivé, všestranné pracovní lodě pro výuku terénních kurzů, studentské výzkumné projekty a pobřežní průzkumy vedené fakultami. Loď musí být snadno ovladatelná pro studenty pod dohledem, dostatečně stabilní pro praktické nasazení nástrojů a dostatečně odolná pro časté používání více uživateli napříč akademickými podmínkami. Kvůli rozpočtovým omezením v akademickém prostředí je důležitá nákladová efektivita a nízká údržba.
      features:
        - Stabilní platforma pro nácvik nasazení a obnovy studentských nástrojů
        - Snadné ovládání — konfigurace s ojem nebo s jednou konzolí pro studenty pod dohledem
        - Odolné trubky Hypalon pro časté přistávání na pláži a manipulaci se studenty
        - Montáž zařízení pro výukový sonar, secchiho disk a vzorkovací zařízení
        - Nákladově efektivní varianta PVC pro akademické programy s omezeným rozpočtem
    - title: Ústavy mořského výzkumu
      subtitle: Průzkum RIB s integrací přístroje, GPS, vzorkovací zařízení
      description: Specializované organizace pro mořský výzkum provádějící pobřežní a pobřežní průzkumy potřebují profesionálně nakonfigurované průzkumné RIB s integrovaným vybavením. Tyto nádoby nesou sonarové systémy pro batymetrické mapování, profily CTD pro analýzu vodního sloupce, vzorkovače sedimentů a zařízení pro biologický sběr. Loď musí poskytovat stabilní platformu při nízkých rychlostech průzkumu, mít dostatek prostoru na palubě pro rozmístění vybavení a nabízet čisté 12V/24V napájení pro elektroniku.
      features:
        - Integrovaná montáž sonarového měniče – konfigurace skrz trup nebo příčku
        - Montáž antény GPS a integrace konzoly pro navigaci na úrovni průzkumu
        - Oblast pro nasazení CTD a vzorkovače vody s bezpečnými upevňovacími body
        - Pomocný napájecí rozvod 12V/24V pro přístroje a ústředny
        - Stabilní při nízké rychlosti (3-6 uzlů) pro přesnost průzkumné linie
        - Volitelný A-rám nebo davit pro nasazení těžšího vzorkovacího zařízení
    - title: Monitorování a ochrana životního prostředí
      subtitle: Ekologické průzkumy, pozorování zvěře, hodnocení stanovišť
      description: Environmentální nevládní organizace, vládní agentury a ochranářské organizace provádějí mořské ekologické průzkumy, sledování populace divoké zvěře a hodnocení stanovišť. Tyto operace vyžadují tichá plavidla s nízkým dopadem, která se mohou přiblížit k citlivým stanovištím, aniž by rušila divokou zvěř. Lodě musí vozit kamerové vybavení, GPS pro mapování transektů a vzorkovací zařízení pro sběr vody a sedimentů. Nízké vlnění a minimální hluk motoru jsou zásadní pro studie pozorování chování.
      features:
        - Tichý čtyřtaktní přívěsný motor – minimální rušení mořské zvěře
        - Stabilní pozorovací platforma pro fotografování a video dokumentaci
        - Montáž vybavení pro kamerové soupravy, GPS trackery a polní počítače
        - Mělký ponor pro přístup k pobřežním mokřadům, mangrovům a ústím řek
        - Snadno čistitelné povrchy palub a trubek pro dekontaminaci mezi místy
    - title: Monitorování a testování kvality vody
      subtitle: Pravidelné odběry vzorků, sledování znečišťujících látek, sledování souladu
      description: Organizace monitorující kvalitu vody provádějí pravidelné odběry vzorků v pobřežních zónách, přístavech a vnitrozemských vodních cestách, aby sledovaly úrovně znečištění, výkvět řas a dodržování ekologických předpisů. Tyto operace vyžadují účinné a spolehlivé čluny pro opakované návštěvy pevných vzorkovacích stanic. Nádoba musí nést zařízení na odběr vzorků, chladiče pro uchování vzorků a vybavení pro testování v terénu – se snadným mytím paluby mezi místy odběru, aby se zabránilo křížové kontaminaci.
      features:
        - Prostor vyhrazené vzorkovací stanice s chladičem a skladem zařízení
        - Snadno čistitelné povrchy palub a trubek pro dekontaminaci mezi pracovišti
        - Integrace GPS pro přesný návrat k pevným souřadnicím vzorkování
        - Kompaktní velikost pro přístup k omezeným vodním tokům a úzkým kanálům
        - Přívěsný motor s nízkou spotřebou paliva pro nákladově efektivní pravidelné odběry vzorků
