hero:
  tagline: Diagram znalostí
  title: Znalosti o průzkumu vody
  subtitle: |
    Strukturovaná znalostní báze zahrnující nafukovací SUP technologii,<br /> vodní bezpečnost, lodní inženýrství a plánování dobrodružství.
  taglineSection: Prozkoumat. Učit se. Jděte s důvěrou.
clusters:
  tagline: Znalostní klastry
  title: Prozkoumejte podle tématu
  subtitle: Hluboké ponory do technologie, bezpečnosti a dovedností za každým Aquafarer produktem.
  items:
    - title: SUP Znalosti
      description: Od výběru prvního prkna až po pokročilé turistické techniky – vše o paddleboardingu ve stoje.
      icon: tabler:lifebuoy
      topics:
        - Jak si vybrat svou první nafukovačku SUP
        - Nejlepší velikost SUP pro začátečníky
        - Jak náročné je paddleboarding?
        - Porovnání nafukovací a tvrdé desky
        - SUP bezpečnostní kontrolní seznam
    - title: Lodní znalosti
      description: Technické příručky pro nafukovací čluny, RIB, čluny a kajaky – inženýrství, materiály a provoz.
      icon: tabler:sailboat
      topics:
        - Vysvětlení typů nafukovacích člunů
        - Srovnání PVC vs Hypalon
        - Srovnání RIB vs Dinghy
        - Hluboký ponor technologie drop-stitch
        - Průvodce vědou o mořském materiálu
    - title: Bezpečnostní znalosti
      description: Základní bezpečnostní znalosti pro každého vodáka – od výběru PFD přes čtení počasí až po sebezáchranné techniky.
      icon: tabler:shield
      topics:
        - SUP bezpečnostní kontrolní seznam
        - Potřebujete záchrannou vestu?
        - Bezpečnostní průvodce oceánským pádlováním
        - Bezpečnost na řece pro nafukovací kajaky
        - Povědomí o počasí a stavu vody
    - title: Technologie
      description: Inženýrství za Aquafarer produkty – materiály, konstrukční metody a testování kvality.
      icon: tabler:microscope
      topics:
        - Námořní technologie PVC
        - Vysvětlení jádra drop-stitch
        - Proč PSI záleží na nafukovacích SUP
        - RF svařování vs lepení
        - Testování a certifikace kvality
    - title: Obchodní znalosti
      description: Komerční příručky pro budování a rozšiřování vašeho podnikání v oblasti vodních sportů – od pronájmů až po branding soukromých značek.
      icon: tabler:briefcase
      topics:
        - Jak začít s pronájmem SUP
        - Vybudování střediska vodních sportů
        - Dimenzování flotily paddleboardů pro kluby
        - Nafukovací vs tvrdý SUP pro komerční použití
        - Nejlepší kajakářský materiál pro půjčovny flotil
        - Založení privátní značky vody
        - Strategie příjmů z vodních sportů v resortech
        - Průvodce údržbou komerčních zařízení
