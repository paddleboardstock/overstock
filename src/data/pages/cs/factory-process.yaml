hero:
  tagline: Proces
  title: Výrobní proces
  subtitle: Od suroviny až po loď připravenou k moři – každý krok pod naší kontrolou
  back_label: Zpět do továrny
  back_link: /factory
intro: Na rozdíl od značek, které zadávají výrobu továrnám třetích stran, Aquafarer vlastní a provozuje celý svůj výrobní řetězec. Tato vertikální integrace nám umožňuje udržovat přísnou kontrolu kvality v každé fázi, rychle reagovat na zákaznické požadavky a dodávat konzistentní kvalitu produktu šarži po šarži. Zde je návod, jak se v našem zařízení staví loď.
steps:
  - step: '01'
    title: Příjem a kontrola materiálu
    description: Každá příchozí šarže PVC tkaniny, sklolaminátové rohože, pryskyřice a hardwaru je kontrolována podle specifikace. Vzorky látek jsou před uvedením do výroby testovány na pevnost v tahu, rovnoměrnost tloušťky a odolnost vůči UV záření. Neshodné materiály jsou umístěny do karantény a vráceny.
    duration: 1–2 dny
  - step: '02'
    title: Automatické řezání PVC
    description: Schválené tkaniny jsou položeny na automatickém CNC řezacím stroji a řezány se submilimetrovou přesností. Počítačově optimalizované vnoření uspořádá panely tak, aby minimalizovaly odpad – obvykle pod 5 %. Nařezané panely jsou označeny podle modelu lodi a komory a poté svázány pro přepravu do svařovací dílny.
    duration: 2–4 hodiny na sadu lodi
  - step: '03'
    title: Tepelné těsnění a svařování trubek
    description: Panely se lepí a lepí pomocí tepelných svařovacích strojů s horkovzdušným svařováním při kontrolovaných teplotách 200–600 °C. Hlavní švy jsou vyztuženy vysokofrekvenčním dielektrickým svařováním pro vzduchotěsné, vysoce pevné spoje. Dokončené komory se nafouknou na 1,25× pracovní tlak pro 30minutovou validaci zadržení vzduchu.
    duration: 1–2 dny na loď
  - step: '04'
    title: Lisování trupu ze skelných vláken RIB
    description: RIB lodních trupů se vyrábí pomocí ručního lisování ze skelných vláken. Vrstvy sklolaminátové rohože a tkaného rovingu jsou ručně válcovány polyesterovou nebo vinylesterovou pryskyřicí v přesných formách. Každá vrstva je vakuově zabalena pro konzistentní kvalitu laminátu. Trup je povrchově upraven gelcoatem pro vysoce lesklý mořský povrch odolný vůči UV záření.
    duration: 2–4 dny na trup
  - step: '05'
    title: SUP Tisk a dekorace
    description: SUP grafika paluby je aplikována pomocí digitálního tisku pro plnobarevné návrhy ve fotografické kvalitě a sítotiskem pro odolná loga a opakující se vzory. Tisky jsou vytvrzeny a zataveny pro odolnost proti UV záření a oděru.
    duration: 1–2 dny
  - step: '06'
    title: Konečná montáž a vybavení
    description: Sklolaminátové trupy a PVC trubkové sestavy jsou spojeny na montážní lince. Motor je namontován, řízení a ovládání plynu jsou připojeny, palivový systém je nainstalován a je zapojen celý elektrický svazek. Každá loď se řídí 100bodovým kontrolním seznamem sestavení s povinným odhlášením v každé fázi.
    duration: 2–3 dny
  - step: '07'
    title: Testování a kontrola kvality
    description: 'Každá dokončená loď prochází povinnou kontrolou kvality: testem retence vzduchu v komoře, kontrolou funkce systému, ověřením utahovacího momentu upevňovacích prvků a kosmetickou kontrolou. Zakázkové a prototypové stavby také procházejí zkouškami ve vodě, které zahrnují rychlost, ovladatelnost, stabilitu a odolnost.'
    duration: 1–2 dny
  - step: '08'
    title: Balení a doprava
    description: Čluny se vyfouknou, složí podle postupu, zabalí do odolných tkaných pytlů nebo překližkových přepravek a naloží k odeslání. Každý balíček je označen modelem, sériovým číslem a místem určení. Koordinujeme s dopravci pro FCL a LCL kontejnerové zásilky po celém světě.
    duration: 1 den
