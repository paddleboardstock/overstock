content_challenge:
  tagline: Výzva
  title: Námořní cestovní ruch vyžaduje<br />Spolehlivá plavidla připravená pro cestující
  subtitle: Provozovatelé cestovního ruchu potřebují lodě, které zvládnou každodenní přesuny cestujících, měnící se podmínky na moři a vysoká očekávání hostů – při zachování nízké údržby a ziskovosti provozu.
  paragraphs:
    - Provozovatelé ostrovního cestovního ruchu v destinacích, jako jsou Maledivy, Filipíny, Indonésie a Thajsko, provozují každodenní transfery cestujících, výlety za šnorchlováním a výlety po moři. Jejich lodě fungují více než 300 dní v roce v prostředí se slanou vodou s minimálními prostoji na údržbu.
    - '**Ostrovní transfery** vyžadují rychlou a pohodlnou přepravu cestujících mezi letovisky, letišti a potápěčskými místy. Cestující očekávají hladkou jízdu, snadné nastupování a ochranu před sluncem a stříkající vodou. Pomalá nebo nepohodlná loď přímo ovlivňuje spokojenost hostů a opakované rezervace.'
    - Provozovatelé **pozorování velryb a delfínů** potřebují čluny, které se rychle dostanou k divočině, udrží stabilní pozorovací plošiny a fungují tiše, aby nerušily mořský život. Rychlost, stabilita a manévrovatelnost jsou kritické – cestující očekávají blízkost, aniž by pociťovali mořskou nemoc.
    - Společnosti zabývající se **dobrodružnou turistikou** provozují pobřežní průzkumné zájezdy, exkurze do jeskyní a zážitky s mořskou divočinou. Jejich lodě se plaví v různých prostředích – od otevřeného oceánu po mělké zátoky – vyžadující všestranné návrhy trupu a spolehlivou konstrukci.
    - Ve všech segmentech jsou hlavními zájmy odolnost proti korozi, spotřeba paliva a pohodlí cestujících. Loď, která selže nebo vyžaduje časté opravy, znamená ztrátu příjmů, zrušené zájezdy a poškozenou pověst.
content_solution:
  tagline: Naše řešení
  title: RIB<br />a vybavení flotily cestovního ruchu
  subtitle: Paddle Board Overstock poskytuje jak komerční čluny RIB pro provoz s cestujícími, tak vybavení flotily (SUP, kajaky, nafukovací čluny) pro programy rekreačních aktivit – vše od jednoho dodavatele.
  list:
    - Komerční osobní RIB od 4,8 m do 8 m – konfigurované pro ostrovní transfery, šnorchlování a pozorování divoké zvěře
    - Pohodlné sezení s opěradly a slunečníkem — pohodlí cestujících po dobu 1-2 hodinové prohlídky
    - Široký nosník a deep-V trup pro stabilitu — snižuje mořskou nemoc a zvyšuje jistotu cestujících
    - Tiché možnosti motoru pro pozorování divoké zvěře — minimální rušení mořských živočichů
    - Potápěčský žebřík a plavecká plošina – nezbytné pro šnorchlování a plavání
    - Vlastní značky a barevná schémata — logo vaší společnosti a nátěr flotily na každém plavidle
    - Fleetové ceny pro hromadné objednávky RIB — konzistentní specifikace pro operace s více loděmi
    - SUP prkna, kajaky a nafukovací čluny pro rekreační programy aktivit pro hosty
    - Náhradní díly a podpora údržby — minimalizujte prostoje během hlavní turistické sezóny
content_segments:
  tagline: Segmenty cestovního ruchu
  title: Řešení pro mořskou turistiku<br />Podle typu operace
  subtitle: Různé turistické operace vyžadují různé konfigurace lodí. Paddle Board Overstock odpovídá pravému RIB vaší konkrétní aplikaci.
  items:
    - title: Operátoři ostrovních transferů
      subtitle: Maledivy, Filipíny, Indonésie, Thajsko – denní doprava hostů
      description: Provozovatelé ostrovního cestovního ruchu v jihovýchodní Asii a na Maledivách provozují každodenní transfery cestujících mezi letišti, letovisky a potápěčskými místy – často více než 300 dní v roce. Loď je páteří zážitku hostů. Porucha znamená uvízlé hosty, zrušené rezervace a poškození pověsti. Tito operátoři potřebují čluny, které přežijí vysokofrekvenční použití ve vzdálených místech, kde je omezená podpora údržby a kde je obtížné získat díly.
      features:
        - Komerční konstrukce ohodnocená na 300+ provozních dnů za rok
        - Pohodlné lavicové sezení s opěradly pro 8-16 cestujících
        - T-top nebo Bimini sluneční clona pro ochranu před tropickým sluncem a sprejem
        - Široká nástupní platforma pro snadný přístup hostů se zavazadly
        - Suché úložné přihrádky na tašky pro hosty a vybavení resortu
        - Úsporný čtyřtaktní přívěsný motor — nízké provozní náklady na jednu cestu
        - Odolné trubky Hypalon pro životnost 5-8 let v tropických podmínkách
        - Design se snadnou údržbou — dostupné komponenty pro servis na vzdáleném místě
    - title: Operátoři pozorování velryb
      subtitle: Offshore schopnost, rychlost na pozorovací plochy, stabilní platforma
      description: Pozorování velryb je sezónní, ale vysoce hodnotný turistický segment působící v regionech jako Hervey Bay (Austrálie), Kaikoura (Nový Zéland), Baja California (Mexiko) a Azory. Operátoři se musí rychle dostat do pobřežních pozorovacích oblastí, než se velryby ponoří nebo se přesunou dál, udržovat stabilní plošinu po delší dobu pozorování a pracovat tiše, aby nerušili mořské savce. Komfort cestujících během 2-4hodinových prohlídek přímo ovlivňuje recenze a opakované rezervace. Pomalá nebo nestabilní loď znamená zmeškaná pozorování a vrácené zájezdy.
      features:
        - Konfigurace 7-10 m RIB pro využití na moři na otevřené vodě
        - Tichý 4taktní přívěsný motor — minimální rušení hlukem a vibracemi
        - Trup Deep-V s vynikající stabilitou v klidu — pohodlná vyhlídková plošina
        - Příďová pozorovací plošina s madly pro fotografování hostů
        - Úplná ochrana proti povětrnostním vlivům — T-top nebo přiložená konzola pro podmínky na moři
        - Ergonomické sezení navržené pro pohodlí 2-4hodinové prohlídky
        - Materiály mořské kvality pro prodloužené vystavení slané vodě a odolnost vůči UV záření
    - title: Operátoři sledování delfínů
      subtitle: Rychlé pronásledování, kapacita pro více cestujících, tichý přístup
      description: Operátoři sledování delfínů potřebují jinou rovnováhu schopností. Delfíni jsou rychlejší a hravější než velryby a vyžadují čluny, které dokážou rychle zrychlit, přesně manévrovat a přiblížit se k luskám, aniž by je vyděsily. Tyto zájezdy obvykle přepravují více cestujících na cestu a fungují blíže k pobřeží. Tichý provoz je kritický – delfíni, kteří si zvyknou na hlasité motory, se budou vyhýbat lodím, což snižuje úspěšnost pozorování. Provozovatelé také potřebují spolehlivé lodě pro denní plány vícenásobných výletů během hlavní turistické sezóny.
      features:
        - 5,5-8 m RIB pro obratnost, rychlost a přístup do mělké vody
        - Rychlé zrychlení pro dosažení aktivních lusků delfínů
        - Tichý výfuk a trup s nízkými vibracemi pro blízké přiblížení
        - Stabilní plošina v klidu pro prohlížení a fotografování hostů
        - Vysoká kapacita cestujících (10-18 osob) pro výlety v hlavní sezóně
        - Posezení na přídi pro pozorování delfínů v blízkosti vody
        - Mělký ponor pro pobřežní a zálivové operace
    - title: Dobrodružná a ekologická turistika
      subtitle: Průzkum pobřeží, prohlídky jeskyní, setkání s divokou zvěří
      description: Provozovatelé dobrodružné turistiky se pohybují v různých prostředích – plavby přes otevřený oceán, průzkum mělkých lagun, přístup do pobřežních jeskyní a setkání s mořskou divočinou. Jejich čluny potřebují všestrannost, aby zvládly různé mořské podmínky, odolnost, aby vydržely použití na vzdáleném místě, a mělký ponor pro přístup k chráněným zátokám a přistáním na pláže. Spolehlivost zařízení je prvořadá – porucha na vzdáleném místě může zkazit prohlídku a ohrozit hosty.
      features:
        - Trup s mělkým ponorem pro přístup do laguny, jeskyně a pláže
        - Vyztužený trup a Hypalon trubky pro odolnost ve smíšeném prostředí
        - Flexibilní sezení – přestavitelné pro různé typy zájezdů a velikosti skupin
        - Upevňovací body vybavení pro fotografické vybavení a specializované vybavení
        - Snadné přistání na pláži – zesílený kýl a ochrana trubky
        - Ochrana proti povětrnostním vlivům pro pohodlí hostů během delších výletů
    - title: Flotily rekreačních aktivit
      subtitle: Kompletní programy vodních sportů pro hosty — RIB, SUP, kajaky, bezpečnost
      description: Resorty nabízející vodní sporty jako součást zážitku pro hosty potřebují flotilu, která vyvažuje rozmanitost, trvanlivost a prezentaci značky. Flotila obvykle zahrnuje RIB pro výlety a transfery hostů, SUP a kajaky pro průzkum s vlastním průvodcem a nafukovací čluny pro skupinové šnorchlování. Správa smíšených typů zařízení napříč sezónními objemy hostů vyžaduje konzistentní kvalitu, snadnou údržbu a jednotnou značku. Porucha nebo opotřebované vybavení přímo ovlivňuje hodnocení hostů a příjmy.
      features:
        - RIB výběrových řízení na výlety pro hosty, transfery a výlety za šnorchlováním
        - SUP prkna a kajaky pro aktivity hostů s vlastním průvodcem
        - Nafukovací čluny pro skupinové výlety a šnorchlování od pláže k útesu
        - Kompletní vlastní branding na veškerém vybavení — jednotná prezentace resortu
        - 'Balíček bezpečnostní výbavy: PFD, píšťalky, první pomoc, bóje'
        - Školicí materiály zaměstnanců pro manipulaci s vybavením a bezpečnost hostů
