content_priorities:
  tagline: Co klienti ověřují
  title: 8 věcí, které kupující ověřují<br />při každé návštěvě továrny
  subtitle: Na základě zpětné vazby od kupujících z více než 50 zemí jde o osm priorit, které klienti posoudí před zadáním B2B objednávky.
  items:
    - title: Skutečný výrobce
      description: 'Jste skutečná továrna, ne obchodní společnost? Kupující kontrolují: obchodní subjekt, skutečné výrobní zařízení, zaměstnance obsluhující stroje, aktuální výrobní zakázky na podlaze a konzistenci webu a dílny.'
      icon: tabler:building-factory
    - title: Produkt vhodný pro aplikaci
      description: Odpovídá RIB jejich konkrétnímu případu použití? Operátoři resortů, záchranářů, potápěčských, rybářských a hlídkových mají zásadně odlišné požadavky. Kupující hodnotí uspořádání paluby, materiál trubek a možnosti vybavení na vystavené lodi.
      icon: tabler:target
    - title: Kvalita Stabilita a reprodukovatelnost
      description: Je 50. jednotka stejně dobrá jako ta 1? Kupující zkoumají systémy kontroly kvality, průběžné kontrolní body, řešení neshod a žádají o zobrazení záznamů z více výrobních sérií, aby ověřili konzistenci.
      icon: tabler:repeat
    - title: Autenticita dokladu o shodě
      description: Jsou CE certifikáty specifické pro model? Je DoC podepsáno skutečnou osobou? Lze ověřit shodu podle čísla trupu? Kupující kontrolují plošné nároky vs. dokumentaci specifickou pro daný model.
      icon: tabler:file-certificate
    - title: Provedení přizpůsobení
      description: Může továrna skutečně dodat vlastní konfigurace? Kupující hledají důkazy o minulých zakázkových projektech, vystavené vzorky prototypů, technické výkresy a možnost diskutovat o technických úpravách na místě.
      icon: tabler:adjustments
    - title: Dodací lhůta a kapacita
      description: 'Jsou uvedené časové osy reálné? Kupující hodnotí: aktuální objem výroby, dostupnou kapacitu, velikost pracovní síly, stav zásob materiálu a zda má továrna systém plánování výroby.'
      icon: tabler:clock
    - title: Cena a obchodní podmínky
      description: 'Jsou ceny transparentní? Je cena FOB jasná? Kupující ověřují: rozpis jednotkové ceny, náklady na nástroje, náklady na balení a zda továrna dokáže zpracovat podmínky DDP nebo CIF se správnou exportní dokumentací.'
      icon: tabler:currency-dollar
    - title: Poprodejní a náhradní díly
      description: 'Co se stane po doručení? Kupující hodnotí: dostupnost náhradních dílů, záruční proces, náhradní díly trubek, výměnu ventilů a zda má továrna zdokumentovaný poprodejní protokol.'
      icon: tabler:headset
content_tour:
  tagline: Prohlídková trasa továrny
  title: Audit Tour —<br />Co uvidíte
  subtitle: Naše standardní prohlídka továrny sleduje definovanou trasu navrženou tak, aby odpovídala na dotazy kupujících na každé stanici.
  items:
    - title: 1. Zasedací místnost — Představení společnosti
      description: Obchodní licence, certifikáty ISO 9001 a BSCI, vývozní licence a historie společnosti. Rychlý přehled produkčních možností a rozsahu shody.
      icon: tabler:users
    - title: 2. Sklad surovin – stanice IQC
      description: Záznamy o vstupní kontrole materiálu, certifikáty šarže látek, lepidla a vzorky hardwaru. Podívejte se, jak se materiály testují před vstupem do výroby.
      icon: tabler:building-warehouse
    - title: 3. Výroba trubek — RF svařování a ruční lepení
      description: Živý proces svařování nebo lepení trubek, ukázky testu pevnosti švu a instalace ventilu. Dodržujte konstrukci jednotlivých komor a kontrolní body kvality.
      icon: tabler:flame
    - title: 4. Laminování trupu — GRP Workshop
      description: Proces kladení skleněných vláken, aplikace gelcoatu a vytvrzování trupu. Podívejte se na plán laminace a strukturální vyztužení pro různé modely RIB.
      icon: tabler:layers-subtract
    - title: 5. Montáž a integrace
      description: Spojení trupu a trubky, montáž konzoly a sedadla, integrace elektrického a palivového systému a montáž zařízení. Sledujte provoz výrobní linky.
      icon: tabler:tool
    - title: 6. Tlaková zkušební stanice
      description: 24-48h test udržení tlaku při 1,25násobku jmenovitého tlaku. Prohlédněte si záznamy testů, tlakoměry a kritéria vyhovění/nevyhovění. Podívejte se, jak jsou výsledky testů propojeny se sériovými čísly trupu.
      icon: tabler:gauge
    - title: 7. Závěrečná kontrola a kontrola kvality
      description: 100bodový kontrolní seznam kvality na jednotku, ověřování rozměrů, kosmetická kontrola a kontrola integrity balení. Zkontrolujte protokoly o neshodě a záznamy o nápravných opatřeních.
      icon: tabler:clipboard-check
    - title: 8. Místnost pro kontrolu dokumentů
      description: Dokumentace o shodě pro každý model (DoC, štítek výrobce, uživatelská příručka), záznamy sledovatelnosti výroby, registr HIN a ukázka databáze sledování dávek materiálu.
      icon: tabler:folder
content_qc_chain:
  tagline: Důkaz kvality
  title: 8stupňový řetěz QC<br />— Ověřitelný na každém kroku
  subtitle: Náš řetězec kontroly kvality probíhá od příchozích materiálů až po konečnou zásilku s dokumentovanými důkazy v každé fázi.
  items:
    - title: 'Fáze 1: Vstupní kontrola materiálu'
      description: Každá šarže PVC, Hypalon, sklolaminátu, hliníku, lepidel a hardwaru je před uvedením do výroby testována podle specifikací. Pevnost v tahu, přilnavost povlaku a rozměrové kontroly za AQL 2,5/ISO 2859.
      icon: tabler:package
    - title: 'Fáze 2: Svařování trubek / lepení QC'
      description: Testování pevnosti odlupování švů na výrobní šarži. Parametry RF svaru monitorovány a zaznamenávány. Ručně lepené švy kontrolované na konzistentní pokrytí lepidlem a dobu vytvrzování.
      icon: tabler:flame
    - title: 'Fáze 3: Laminace trupu QC'
      description: Měření tloušťky gelcoatu, ověření vrstvení skelných vláken podle plánu laminátu a sledování doby vytvrzování. Polohy konstrukční výztuže ověřené podle technických výkresů.
      icon: tabler:layers-subtract
    - title: 'Fáze 4: Montáž a integrace QC'
      description: Integrita spoje trupu a trubky, točivý moment montáže konzoly a sedadla, elektrická kontinuita a test těsnosti palivového systému. Každý instalační bod byl ověřen podle kontrolního seznamu sestavy specifického pro daný model.
      icon: tabler:tool
    - title: 'Fáze 5: Test udržení tlaku'
      description: Každá nafukovací komora byla natlakována na 1,25x jmenovitý PSI a udržována po dobu 24-48 hodin. Pokles tlaku zaznamenaný na komoru. Zdokumentován práh pro úspěšné/nevyhovující. Souvisí se sériovým číslem trupu.
      icon: tabler:gauge
    - title: 'Fáze 6: Závěrečná kontrola'
      description: 100bodový kontrolní seznam kvality zahrnující rozměrovou přesnost, kosmetickou úpravu, úplnost příslušenství, dokumentaci a integritu balení. Nezávislý na produkčním týmu.
      icon: tabler:clipboard-check
    - title: 'Fáze 7: Dokumentace o shodě'
      description: Prohlášení o shodě specifické pro model, ověření štítku výrobce, úplnost uživatelské příručky a záznam v registru HIN. Všechny dokumenty o shodě připravené a ověřené před uvolněním zásilky.
      icon: tabler:file-certificate
    - title: 'Fáze 8: Uvolnění zásilky a sledovatelnost'
      description: Konečné vydání vyžaduje, aby prošly všechny fáze kontroly kvality, byla dokončena dokumentace shody a byla ověřena přepravní dokumentace. Záznam trupu uzavřen a archivován pro uchovávání 10+ let.
      icon: tabler:truck
content_traceability:
  tagline: Sledovatelnost výroby
  title: HIN → Hlavní soubor →<br />Záznam trupu → Doručení
  subtitle: Každá loď RIB nese jedinečné identifikační číslo trupu spojené s kompletním řetězcem záznamů o výrobě a souladu.
  items:
    - title: Identifikační číslo trupu (HIN)
      description: Jedinečný 14místný identifikátor trvale vyznačený na každé lodi. Kóduje kód výrobce (MIC), označení modelu, rok výroby a sériové číslo. Klíč, který odemyká celý řetězec sledovatelnosti.
      icon: tabler:hash
    - title: Hlavní technický soubor
      description: Shoda a technická dokumentace pro rodinu modelů. Obsahuje výkresy GA, posouzení rizik, stabilitní výpočty, materiálové specifikace a platné normy. Propojeno se všemi trupy tohoto modelu.
      icon: tabler:folder
    - title: Individuální rekord trupu
      description: 'Záznam o výrobě podle trupu: HIN, datum výroby, šarže trubek, materiálové certifikáty, výsledek tlakové zkoušky, konečná konfigurace, specifikace motoru, výsledky kontrolního seznamu kvality a místo dodání. 21+ datových polí na trup.'
      icon: tabler:file-description
    - title: Compliance balíček pro zákazníky
      description: Balíček dodávky na trup včetně DoC, fotografie stavebního štítku, uživatelské příručky, kontrolního seznamu shody a konečného konfiguračního listu. Odesláno s lodí a archivováno v továrně více než 10 let.
      icon: tabler:package
content_red_flags:
  tagline: Úskalí auditu
  title: Kupující Red Flags<br />Snadno si všimnete
  subtitle: Běžné problémy, které podkopávají důvěru kupujících během továrních auditů. Každému se proaktivně věnujeme.
  items:
    - title: Plošné CE Nároky bez rozsahu modelu
      description: '"Všechny produkty CE certifikované" bez uvedení které směrnice, které modely a který modul shody. Červená vlajka: naznačuje, že shoda je spíše povrchní než podle modelu a konfigurace.'
      icon: tabler:alert-triangle
    - title: Žádné důkazy fyzického testování
      description: 'Nároky na tlakové zkoušky bez záznamů o zkouškách, měřidel nebo zkušební stanice viditelných v továrně. Červená vlajka: nároky na kvalitu nelze ověřit během návštěvy.'
      icon: tabler:alert-triangle
    - title: Chybí sledovatelnost materiálu
      description: 'Žádné záznamy o šaržích, žádná vstupní kontrola nebo žádná vazba mezi materiálovými certifikáty a hotovými výrobky. Červená vlajka: žádný způsob, jak sledovat problémy s kvalitou až ke zdroji.'
      icon: tabler:alert-triangle
    - title: Obecná dokumentace
      description: 'Jedno prohlášení o shodě pro všechny modely, žádné záznamy specifické pro HIN nebo dokumenty o shodě se „šablonou“. Červená vlajka: dodržování není vázáno na jednotlivé výrobní jednotky.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Doprava a balení
  title: RIB Lodní kontejner<br />Nakládání a přeprava
  subtitle: Naše přepravní řešení chrání vaši investici od Qingdao do cílového přístavu. Plány nakládání kontejnerů a specifikace přepravek jsou k dispozici pro každý model.
  items:
    - title: Konfigurace 20ft kontejnerů
      description: 'Standardní 20ft kontejner: 1-2 RIB čluny (4,0-5,5m) zasazené s palubou a oddělenými trubkami nebo 8-12 SUP prken. K dispozici jsou smíšené konfigurace RIB + SUP. Podrobný plán nakládky poskytnut na objednávku.'
      icon: tabler:box
    - title: Konfigurace 40ft kontejnerů
      description: 'Standardní 40ft kontejner: 2-4 RIB čluny (až 7,0 m) s vloženými trupy a naskládanými trubkami nebo 20-30 SUP prken. 40 stop HQ k dispozici pro vyšší modely RIB. Balení s optimalizovaným objemem snižuje náklady na přepravu na jednotku.'
      icon: tabler:container
    - title: Dřevěná bedna pro RIB trupy
      description: Hliníkové a GRP trupy zabalené v dřevěných bednách na míru s pěnovou výplní, bariérou proti vlhkosti a ocelovou páskou. Rozměry a hmotnost přepravky na model k dispozici pro plánování logistiky. ISPM-15 certifikace tepelně upraveného dřeva v ceně.
      icon: tabler:wood
    - title: Separační balení trubek a palubek
      description: Trubky se vyfouknou a složí odděleně od trupů pro úsporu místa. Palubní desky, konzoly a sedadla zabalené v ochranném obalu s montážními sadami. Návod k opětovné montáži je součástí každé zásilky.
      icon: tabler:package
    - title: Ochrana proti vlhkosti a korozi
      description: VCI antikorozní papír pro hliníkové komponenty, silikagelové vysoušecí balíčky a vakuově uzavřené hardwarové sáčky. Zabraňuje poškození kondenzací během 30-45denní plavby oceánem.
      icon: tabler:droplet-off
    - title: FOB Qingdao Dokumentace
      description: Nákladní list, obchodní faktura, seznam balení, osvědčení o původu a dokumentace shody na zásilku. K dispozici je konsolidace FCL a LCL. Podpora celní dokumentace pro trhy EU, USA a Středního východu.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Ověřovací důkaz
  title: Důkaz auditu<br />Můžete ověřit na místě
  subtitle: Během návštěv továrny si klienti mohou ověřit konkrétní důkazy v každé výrobní oblasti. Zde je to, co hledat – a co připravujeme na každý audit.
  areas:
    - area: Sklad surovin
      what_to_verify: Jsou materiály stabilní? Existuje dávkové míchání?
      evidence: Záznamy o příchozí kontrole, štítky šarží, skladování FIFO, seznam schválení dodavatele, materiálové certifikáty (PVC, Hypalon, sklolaminát, hliník, lepidla, hardware)
      icon: tabler:building-warehouse
    - area: Výroba trubek
      what_to_verify: Jak je zaručena pevnost švu a vzduchotěsnost?
      evidence: Procesní karty, potvrzení prvního článku, záznamy o tlakových zkouškách na komoru, protokoly oprav a opakovaných zkoušek, záznamy o instalaci ventilů
      icon: tabler:flame
    - area: Výroba trupu
      what_to_verify: Jak se kontroluje konzistence struktury?
      evidence: Dokumenty řízeného procesu, kontrolní body kvality, číslování polotovarů, měření tloušťky gelcoatu, ověřování harmonogramu laminace
      icon: tabler:layers-subtract
    - area: Montážní prostor
      what_to_verify: Jak je zabráněno chybné montáži volitelných dílů?
      evidence: Kusovník, pracovní příkazy, konfigurační kontrolní seznamy, kontrolní karty pracovních stanic, krouticí moment a funkční kontroly podle modelu
      icon: tabler:tool
    - area: Testovací stanice
      what_to_verify: Jak před dodáním potvrdíte, že loď je v pořádku?
      evidence: Zkušební postupy, seznam přístrojů, kalibrační záznamy, protokoly tlakových zkoušek (1,25x / 24-48h), kontrolní seznamy funkčních zkoušek, zdokumentovaná kritéria vyhovění/neúspěchu
      icon: tabler:gauge
    - area: Oblast neshody
      what_to_verify: Jak se řeší závady?
      evidence: Štítky izolace, protokoly NCR, analýza hlavních příčin, záznamy o schválení přepracování, sledování CAPA (nápravné a preventivní opatření)
      icon: tabler:alert-triangle
    - area: Sklad hotových výrobků
      what_to_verify: Jak zabráníte chybné zásilce a poškození?
      evidence: Etikety hotových výrobků, záznamy o párování objednávek, standardy balení, záznamy o kontrole před odesláním
      icon: tabler:box
    - area: Náhradní díly a poprodejní služby
      what_to_verify: Můžete podpořit dlouhodobý poprodejní servis?
      evidence: Seznam běžných náhradních dílů, strategie zásob, systém číslování dílů, dokumentace procesu záruky, návody na údržbu
      icon: tabler:headset
content_closing_script:
  tagline: Audit na zakázku
  title: Od návštěvy továrny<br />k potvrzenému projektu
  subtitle: Úspěšný audit by neměl končit fotkami a podáním ruky. Před odjezdem zajistíme zdokumentování tří komerčních výstupů.
  items:
    - title: Potvrďte technickou konfiguraci
      description: Dohodněte se na modelu, aplikaci, klíčových možnostech, cílovém trhu, odhadovaném množství a harmonogramu dodávek – vše zdokumentováno před odjezdem.
      icon: tabler:checklist
    - title: Potvrďte dokumenty dalšího kroku
      description: 'Definujte, co Paddle Board Overstock poskytuje dále: revidované GA, konfigurační seznam, nabídka, kontrolní seznam dokumentů, vzorový plán nebo NDA – s konkrétními časovými osami.'
      icon: tabler:file-plus
    - title: Potvrďte vzájemnou časovou osu
      description: Upravená konfigurace a předběžná nabídka do 3 pracovních dnů. Potvrzení vzorku nebo vzhledu do 7 dnů. Technická kontrola nebo kontrola třetí stranou do 14 dnů. Datum příští schůzky a odpovědné osoby uzamčeny.
      icon: tabler:calendar
faq:
  title: Tovární audit — Často kladené otázky
  questions:
    - q: Mohu továrnu navštívit osobně?
      a: Ano. Vítáme audity na místě v našem závodě o rozloze 12 000 m² Qingdao. Naše standardní prohlídka zahrnuje 8 stanic od skladu surovin po místnost pro kontrolu dokumentů. Pro počáteční kvalifikaci jsou k dispozici také virtuální prohlídky továrny prostřednictvím videohovoru.
    - q: Přijímáte audity třetích stran (BSCI, SMETA, SGS)?
      a: Ano. Udržujeme certifikaci BSCI (Intertek) a vítáme protokoly auditu specifické pro zákazníka. Na požádání můžeme zajistit i prohlídky SGS nebo TÜV. Auditní zprávy jsou k dispozici v rámci NDA.
    - q: Mohu během návštěvy vidět tlakové zkoušky?
      a: Naše tlaková zkušební stanice je součástí standardní prohlídkové trasy. V závislosti na výrobním plánu můžete sledovat aktivní tlakové zkoušky s údaji na manometru a zkušebními záznamy. Protokoly tlakových zkoušek na trup jsou vždy k dispozici ke kontrole.
    - q: Jak zacházíte s nevyhovujícími produkty?
      a: Nevyhovující jednotky jsou odděleny, zdokumentovány a přezkoumány podle našeho ISO 9001 procesu nápravných opatření. Provádí se analýza hlavních příčin, jsou implementována nápravná opatření a jsou udržovány záznamy. Kupující si mohou během auditů prohlédnout náš protokol NCR.
    - q: Jaká dokumentace shody je k dispozici ke kontrole?
      a: 'Během auditu si můžete prohlédnout: vzorky prohlášení o shodě specifické pro daný model, specifikace štítku výrobce, registr HIN, návrhy příruček vlastníka, seznamy příslušných norem a záznamy o posouzení shody podle rodiny modelů.'
    - q: Jak si zarezervuji prohlídku virtuální továrny?
      a: Kontaktujte náš prodejní tým a naplánujte si živou videoprohlídku přes WhatsApp, Zoom nebo Teams. Sledujeme stejnou trasu s 8 stanicemi a můžeme se zaměřit na konkrétní oblasti na základě vašich zájmů. Typická virtuální prohlídka trvá 45-60 minut.
    - q: Je továrna skutečným výrobcem nebo obchodní společností?
      a: Paddle Board Overstock je skutečný výrobce. Provozujeme továrnu v Laixi, Qingdao. Obchodní licence, rozsah výroby a fyzická výroba jsou ověřitelné během auditu.
    - q: Jaké záznamy o kvalitě mohu zkontrolovat?
      a: Záznamy o vstupní kontrole materiálu, průběžné kontrolní body kontroly kvality, protokoly tlakových zkoušek, 100bodové kontrolní seznamy závěrečné kontroly, zprávy o neshodě, záznamy o nápravných opatřeních a záznamy sledovatelnosti podle trupu. Vše udržováno podle požadavků ISO 9001.
cta:
  title: Zarezervujte si prohlídku továrny
  subtitle: Naplánujte si prohlídku továrny na živé video nebo si naplánujte návštěvu našeho zařízení Qingdao přímo na místě. Podívejte se na naši produkci, systémy kontroly kvality a dokumentaci shody z první ruky.
