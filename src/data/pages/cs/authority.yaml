features3_brand:
  tagline: Kdo jsme
  title: Základy značky<br />a její dědictví
  subtitle: Příběh, odbornost a globální dosah, které definují Aquafarer jako důvěryhodného výrobce námořního vybavení.
  isBeforeContent: false
  columns: 3
  items:
    - title: Asi Aquafarer
      description: Společnost byla založena v roce 2012 v Qingdao, Čína. Od pobřežní dílny po zařízení o rozloze 12 000 m² – celý příběh Aquafarer.
      icon: tabler:building-factory
      link: /about
    - title: Příběh značky
      description: Jak se tým námořních inženýrů rozhodl zpřístupnit profesionální nafukovací plavidla po celém světě.
      icon: tabler:book
      link: /brand-story
    - title: Odbornost v námořním průmyslu
      description: Hluboká materiálová věda, precizní výroba a testování v reálném světě – desetiletí námořního inženýrství v každém trupu.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globální přítomnost
      description: Slouží více než 50 zemím na všech kontinentech. Regionální expertizy pro místní regulační požadavky a tržní preference.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Proč Aquafarer
      description: Co nás odlišuje – kvalita, přizpůsobení, přímé výrobní ceny a komplexní podpora pro komerční operátory.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Náš tým
      description: Seznamte se s vedením – námořními inženýry, materiálovými vědci a odborníky na výrobu, kteří jedou Aquafarer vpřed.
      icon: tabler:users
      link: /brand/team
    - title: Inženýrský tým
      description: 78+ kombinovaných let výzkumu a vývoje, 40+ platforem, 12 certifikací, 1200+ OEM projektů. Za každým produktem stojí technický tým.
      icon: tabler:engine
      link: /engineering-team
    - title: Výzkumné a vývojové centrum
      description: Konstrukce trupu, RF svařování, PVC laboratoř, prototypování, testovací nádrž a laboratoř kvality – naše kompletní výzkumné a vývojové zařízení.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Důvěra a kvalita
  title: Certifikace, kvalita<br /> & důkaz
  subtitle: Nezávislé certifikace, přísné testování a skutečné důkazy, které prokazují náš závazek ke kvalitě.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifikace
      description: CE, ISO 9001, UKCA, BSCI, REACH — úplná certifikační dokumentace a soulad pro globální trhy.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalita a testování
      description: Každý produkt před odesláním tlakově testován. Pevnost švu, odolnost proti UV záření, vztlak – ověřeno v každé fázi.
      icon: tabler:clipboard-check
      link: /quality
    - title: Důkazy a důkazy
      description: Výsledky testů, fotografie nasazení, kontrolní zprávy třetích stran a případové studie ověřující kvalitu Aquafarer.
      icon: tabler:file-check
      link: /evidence
    - title: Diagram znalostí
      description: Prozkoumejte graf entity Aquafarer – produkty, technologie, certifikace a vztahy v propojené znalostní bázi.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vedení
  title: Seznamte se s týmem<br />Za Aquafarer
  subtitle: Odborné znalosti v tomto oboru, které zahrnují námořní inženýrství, vědu o materiálech, řízení kvality a globální B2B obchod.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu - zakladatel a CEO
      description: 15+ let v námořní výrobě. Dříve vedl výzkum a vývoj u významného čínského výrobce lodí. Je držitelem několika patentů v designu nafukovacího člunu.
      icon: tabler:crown
    - title: Zhang Wei - hlavní inženýr
      description: 20+ let ve výrobě PVC/Hypalon a deep-V designu trupu. Bývalý technický ředitel v evropské firmě zabývající se námořním inženýrstvím.
      icon: tabler:engine
    - title: Chen Ming – vedoucí výzkumu a vývoje
      description: PhD v oboru materiálové vědy. Specializuje se na technologii kapkového stehu a vysokofrekvenční svařování. 10+ let v textilních kompozitech.
      icon: tabler:flask
    - title: Liu Qiang - výrobní ředitel
      description: 18+ let v štíhlé výrobě. Černý pás Six Sigma. Implementováno ISO 9001 systémů kvality na všech výrobních linkách.
      icon: tabler:settings
    - title: Wang Fang — manažer kvality
      description: 12+ let v námořní kontrole kvality. Certifikovaný auditor CE a ISO. Dohlíží na testování každé výrobní šarže.
      icon: tabler:shield-check
    - title: Helen Lee — obchodní ředitelka
      description: 15+ let v mezinárodním B2B obchodu. Spravováno OEM/ODM partnerství ve více než 30 zemích. Plynule 4 jazyky.
      icon: tabler:briefcase
