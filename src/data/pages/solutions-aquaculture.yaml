content_challenge:
  tagline: The Challenge
  title: 'Aquaculture Demands<br />Saltwater-Tough Equipment'
  subtitle: 'Fish farms, pearl farms, and ocean ranches operate in the most chemically aggressive marine environment — prolonged saltwater exposure, fuel and feed residues, and continuous daily use.'
  paragraphs:
    - 'Aquaculture operations run 365 days a year in exposed coastal and offshore environments. Workboats used for cage inspection, feed transport, pearl line maintenance, and equipment servicing face constant saltwater immersion, UV exposure, and chemical contact from fuels, fish feed, and anti-foulant treatments.'
    - '**Corrosion is the primary enemy** — Standard marine equipment deteriorates rapidly in these conditions. Outboard motors, trailer frames, and hull fittings need constant replacement. Operators need boats built with corrosion-resistant materials that can survive years in this environment without degrading.'
    - '**Daily reliability is critical** — A broken workboat means missed feeding schedules, delayed harvests, and expensive production losses. For pearl farms, a single day of missed inspection can mean significant crop damage. For fish farms, delayed feeding affects growth rates and profitability.'
    - 'Aquafarer aquaculture RIBs are engineered with corrosion-resistant hardware, heavy-duty Hypalon tubes, and reinforced hulls designed specifically for the demanding conditions of fish farming, pearl cultivation, and ocean ranching operations.'
content_solution:
  tagline: Our Solution
  title: 'Purpose-Built RIBs<br />For the Aquaculture Industry'
  subtitle: 'Every Aquafarer aquaculture workboat is designed to withstand aggressive saltwater environments while delivering reliable daily performance.'
  list:
    - 'Marine-grade Hypalon tubes — superior resistance to UV, saltwater, fuels, and fish feed chemicals'
    - '316 stainless steel hardware throughout — no rust in prolonged saltwater exposure'
    - 'Reinforced rubbing strakes and keel guard for repeated dock and cage contact'
    - 'Self-bailing deck for easy washing and drainage after feed transport and harvest operations'
    - 'Flat deck configuration for carrying feed bags, harvest bins, and equipment'
    - 'Outboard configurations from 15 HP to 60 HP — optimized for payload vs. fuel efficiency'
    - 'High-visibility tube color options for easy spotting across large farm areas'
content_segments:
  tagline: Aquaculture Profiles
  title: 'Workboat Solutions<br />By Aquaculture Type'
  subtitle: 'Different aquaculture operations have different workboat requirements — from small agile RIBs for fish cage inspection to stable transport platforms for pearl farming and heavy-duty workboats for ocean ranching.'
  items:
    - title: Fish Farming Operations
      subtitle: Cage inspection, feed transport, harvest support
      description: 'Marine fish farms operate cages in exposed coastal and offshore locations. Workboats are used daily for cage net inspection, feeding operations, harvest support, and equipment maintenance. The primary challenge is corrosion — boats are constantly exposed to saltwater, fish feed residues, and fuel. A reliable workboat is essential because missed feeding or delayed harvest directly affects production output and profitability.'
      features:
        - 'Aggressive-environment package: 316 stainless steel hardware, marine-grade alloy components'
        - 'Flat deck layout for feed bag and harvest bin transport'
        - 'Self-bailing deck for easy wash-down after operations'
        - 'Hypalon tubes with chemical-resistant coating for feed and fuel exposure'
        - 'Reinforced rubbing strakes for frequent cage and dock contact'
    - title: Pearl Farming Operations
      subtitle: 'Stable transport for pearl line inspection and harvest'
      description: 'Pearl farms require stable, reliable workboats for daily transport between pearl lines, inspection of oyster nets, and harvest collection. These operations run in remote coastal locations with limited maintenance infrastructure. The boat must be stable enough for crew to work from while inspecting pearl lines, with easy boarding and ample deck space for carrying harvested oysters, nets, and supplies. Reliability and easy maintenance are critical in remote farm locations.'
      features:
        - 'Stable hull design for standing crew during pearl line inspection'
        - 'Flat deck with non-slip surface for safe crew movement'
        - 'Low freeboard for easy oyster net and harvest access'
        - 'Simple outboard configuration for easy on-site servicing'
        - 'Corrosion-resistant tube and hardware package for continuous saltwater exposure'
    - title: Ocean Ranching & Marine Enhancement
      subtitle: 'Juvenile transport, cage servicing, monitoring support'
      description: 'Ocean ranching operations involve releasing juvenile stock into managed marine environments, monitoring growth, and servicing enhancement structures. Workboats need to transport live juvenile stock in aerated containers, carry monitoring equipment, and access shallow coastal release sites. Hull design must balance carrying capacity with shallow draft for beach and estuary access.'
      features:
        - 'Deck space for aerated juvenile transport containers and monitoring gear'
        - 'Shallow draft for beach and estuary release site access'
        - 'Easy beach landing — reinforced keel and bow protection'
        - 'Equipment mounting points for monitoring electronics and sampling gear'
        - 'Heavy-duty Hypalon tubes for durability in mixed sand and seawater conditions'
