hero:
  tagline: Brand Entity
  title: Paddle Board Overstock — Engineering Freedom On Water
  definition: Paddle Board Overstock is a global SUP brand specializing in inflatable stand-up paddle boards, complete paddling packages, and gear built for real water adventure. Paddle Board Overstock combines marine engineering, in-house manufacturing, and a passion for water exploration to create reliable equipment for paddlers, families, and water sports enthusiasts worldwide.
timeline:
  - year: "2012"
    title: Marine Manufacturing Foundation
    body: Paddle Board Overstock began as a specialized inflatable paddle board workshop in Weihai, China, committed to marine craftsmanship and board manufacturing. The early focus was building reliable inflatable products through practical engineering experience and manufacturing discipline.
  - year: "2015"
    title: First Exports
    body: Initial export orders reached Japan and Korea, marking Paddle Board Overstock's entry into international markets. The company began serving paddlers and water sports enthusiasts beyond China.
  - year: "2018"
    title: Factory Expansion
    body: Relocated to a 12,000 m² production facility. Added RF welding lines and drop-stitch production capacity, enabling larger-scale manufacturing and improved quality control systems.
  - year: "2020"
    title: R&D Center Established
    body: Opened a dedicated R&D center with PVC fabric lab, hydrodynamic test tank, and CAD/FEA simulation studio. Product development expanded to focus on lightweight construction, improved durability, and user-centered design.
  - year: "2022"
    title: Global Growth
    body: Expanded to 14 R&D engineers and 200+ workers. Boards reached paddlers across Europe, the Americas, and Asia-Pacific, shipping to 50+ countries.
  - year: "2024"
    title: Innovation & Design Studio
    body: Launched a full-service design and innovation studio for new board series, from concept to production. Expanded our signature art-series decks and touring platforms.
  - year: "2026"
    title: Building The Future Of Water Exploration
    body: Today, Paddle Board Overstock continues to develop inflatable SUP boards, paddling gear, and customized marine solutions — connecting people and organizations with the world's waters. 50+ countries served, 15,000 units annual capacity.
philosophy:
  tagline: Brand Philosophy
  title: Engineering Freedom On Water
  body: Freedom on water is not only about movement. It represents discovering new places, creating outdoor experiences, connecting people with nature, and enabling professional missions. Engineering makes that freedom possible.
  pillars:
    - title: Reliability First
      body: Water environments demand trust. Paddle Board Overstock products are designed around stability, durability, safety, and consistent performance.
    - title: Human-Centered Design
      body: Products should serve people, not technology. Every design decision begins with understanding how people use their boards, where they explore, and what challenges they face.
    - title: Accessible Exploration
      body: Water should not belong only to experts. Paddle Board Overstock creates equipment that allows more people to safely experience rivers, lakes, oceans, and coastal environments.
    - title: Continuous Innovation
      body: Innovation is not only creating new products. It is improving every detail — materials, structures, manufacturing, and user experience.
engineeringDna:
  tagline: Engineering DNA
  title: How Paddle Board Overstock Creates Products
  areas:
    - title: Material Science
      body: Paddle Board Overstock focuses on selecting appropriate materials for different marine environments. Key considerations include abrasion resistance, UV resistance, pressure stability, and long-term durability.
      items:
        - Abrasion Resistance
        - UV Resistance
        - Pressure Stability
        - Long-Term Durability
    - title: Structural Engineering
      body: Inflatable paddle boards require precise balance between rigidity, weight, portability, and stability. Paddle Board Overstock engineering focuses on optimizing these factors through drop-stitch core technology and advanced seam construction.
      items:
        - Rigidity
        - Weight Optimization
        - Portability
        - Stability
    - title: Manufacturing Precision
      body: "Every product goes through controlled processes: material preparation, precision cutting, welding and bonding, assembly, quality inspection, and performance verification."
      items:
        - Material Prep
        - Precision Cutting
        - Welding & Bonding
        - Assembly & QC
    - title: User Scenario Engineering
      body: Products are developed around real applications — recreation, adventure, and professional use — ensuring each design meets the specific demands of its intended environment.
      items:
        - Recreation
        - Adventure
        - Professional
        - Commercial
