overview_section:
  tagline: Market Overview
  title: The African SUP Market
  paragraphs:
    - Africa's coastline runs tens of thousands of kilometers through wildly different water worlds — the Atlantic surf towns of Morocco and South Africa, the reef-protected lagoons of Kenya and Tanzania, the Red Sea resorts of Egypt, and the growing beach scenes of West Africa. In each of them, stand-up paddle is finding its audience: tourists looking for a safe first water activity, and locals building genuine paddling communities.
    - The businesses buying SUP boards here are typically small and entrepreneurial — surf shops adding a flat-water option, beach resorts building activity programs, dive and watersports operators widening their offer, and safari-and-beach lodges adding sunset paddles. They order in small fleets, and they need boards that work the first day and hold up through season after season.
  customer_types:
    - title: Coastal Resorts & Lodges
      description: Beach resorts and safari-and-beach lodges adding SUP sessions for guests — small mixed fleets, easy seasonal restocking.
    - title: Watersports & Dive Operators
      description: Existing operators adding SUP rentals and lessons alongside dive or kite operations.
    - title: Surf & Beach Shops
      description: Retailers in Africa's established surf towns broadening into flat-water and touring SUP for locals and tourists.
shipping_section:
  title: Ship to Africa
  paragraphs:
    - Orders ship from Weihai, China. Express air freight carries samples, 1–3 board orders, and urgent restocks to major African airports; consolidated sea freight serves 5–20 board wholesale orders through the region's main ports. Both options are quoted with estimated transit times for your specific destination.
    - We prepare complete export documentation — commercial invoice and packing list — and can support your broker with any additional paperwork the clearance process requires.
  customs_note: Import regimes differ widely between African countries, and duty rates on sports equipment change periodically. Confirm current rules with your local authority or clearing agent before ordering; we supply all standard documentation.
faq_section:
  title: Africa FAQ
  items:
    - q: Which African markets do you serve?
      a: We ship across the continent, with dedicated guides for South Africa and Kenya — plus destinations from Morocco and Egypt to Ghana and Tanzania. Confirm your location in your quote request.
    - q: Can a small lodge order just a few boards?
      a: Yes — that is exactly who the overstock model is built for. Five boards is the minimum, mixed models welcome, and small first fleets are common among resort customers.
    - q: How do rentals hold up in salt water and sun?
      a: The boards use drop-stitch PVC construction we supply to rental fleets worldwide. Rinse after salt-water use and store shaded when possible — standard care that keeps rental boards serviceable across many seasons.
    - q: What are the payment and shipping steps?
      a: You request a quote, we confirm stock and quote unit pricing plus freight options, you approve the final quote, and we test, pack, and ship with door-to-door tracking. Payment terms are confirmed at quoting.
