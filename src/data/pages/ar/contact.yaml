hero_text:
  tagline: اتصل بنا
  title: تواصل معنا
contact_form:
  id: form
  title: أرسل لنا رسالة
  subtitle: لأسئلة الطلبات، نصائح الحجم أو دعم المنتج، أرسل لنا رسالة. نرد خلال يوم عمل واحد.
  email_to: info@paddleboardoverstock.com
  submit_button: إرسال استفسار → الحصول على عرض سعر
  success_message: شكرًا! لقد وصلت رسالتك إلى صندوق الوارد لدينا. سنرد خلال يوم عمل واحد.
  error_message: حدث خطأ عند إرسال رسالتك. يرجى المحاولة مرة أخرى أو مراسلتنا عبر البريد الإلكتروني مباشرة.
  default_country_code: '+1'
  captcha:
    label: 'مكافحة البريد العشوائي: يرجى حل ما يلي'
  fields:
    - name: الاسم الأول
      label: الاسم الأول
      row: 1
    - name: اسم العائلة
      label: الاسم الأخير
      row: 1
    - name: اسم الشركة
      label: اسم الشركة
      row: 2
    - name: address
      label: العنوان
      row: 3
    - name: zip
      label: الرمز البريدي
      row: 4
    - name: country
      label: الدولة
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: البريد الإلكتروني
      row: 5
      type: email
    - name: tel
      label: الهاتف
      row: 5
      type: tel
      withCountryCode: true
    - name: حجم الطلب
      label: حجم الطلب المقدر
      row: 6
      type: select
      options:
        - value: ''
          label: كم عدد الألواح التي تبحث عن شرائها؟...
        - value: one
          label: لوح واحد فقط
        - value: 2-4
          label: 2–4 ألواح
        - value: 5-plus
          label: 5+ ألواح (عائلية، نادٍ، أو للإيجار)
    - name: customization
      label: بماذا يمكننا المساعدة؟
      row: 7
      type: select
      options:
        - value: ''
          label: اختر موضوعًا...
        - value: none
          label: سؤال عام عن المنتج
        - value: sizing
          label: مساعدة في اختيار اللوح المناسب
        - value: order
          label: الطلب، الدفع أو الشحن
        - value: warranty
          label: الدعم الخاص بالضمان أو الإصلاح
    - name: ProductInterest
      label: فئات المنتجات المهتم بها
      row: 8
      type: select
      options:
        - value: ''
          label: اختر فئة المنتج...
        - value: all
          label: جميع المنتجات / الكتالوج الكامل
        - value: sup
          label: SUP ألواح / ألواح تجديف
        - value: packages
          label: حزم SUP كاملة
        - value: accessory
          label: ملحقات (مضخات، مجاديف، حقائب)
    - name: subject
      label: الموضوع
      row: 9
    - name: message
      label: رسالة
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: طرق أخرى للتواصل معنا
  columns: 3
  items:
    - title: مساعدة بالطلب
      description: أسئلة عن المنتجات، نصائح حول المقاسات، ودعم الطلب.
      icon: tabler:shopping-bag
    - title: الدعم الفني
      description: الضمان، الإصلاحات، قطع الغيار وأسئلة التشغيل.
      icon: tabler:tool
    - title: الصحافة والشراكات
      description: مجموعات الإعلام، الرعاية والتعاون الصناعي.
      icon: tabler:news
    - title: الهاتف
      description: +1 279 732 3333 (المقر الأمريكي) · +86 13305324192 (المصنع)
      icon: tabler:headset
    - title: البريد الإلكتروني
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: المقر العالمي والفواتير
      description: شركة ويهاي دونغجيليان المحدودة
      icon: tabler:map-pin
map:
  title: موقعنا
  subtitle: زيارة مركز التصنيع في ويهاي
  address: ويهاي، شاندونغ، الصين
  zoom: 15
