features3_certifications:
  title: الجودة والاختبار
  subtitle: يتم اختبار كل لوحة في مختبرنا الخاص قبل شحنها — أرقام حقيقية، سجلات حقيقية، لا ادعاءات تسويقية.
  columns: 3
  isBeforeContent: true
  items:
    - title: مصنوع في مصنعنا الخاص
      description: نحن نملك وندير منشأة بمساحة 12,000 متر مربع في ويهاي. كل دفعة إنتاج يمكن تتبعها، وتوثيقها، وفحصها — لا يوجد تصنيع غامض خارجي.
      icon: tabler:building-factory
    - title: مختبر اختبار المواد
      description: يختبر مختبر المواد الداخلي قوة الشد، مقاومة UV، تكامل اللحامات، ومقاومة التآكل لكل دفعة من الأقمشة قبل الإنتاج.
      icon: tabler:microscope
    - title: مواد بدرجة بحرية
      description: UV-مُثبت PVC، ونوى drop-stitch، ورغوة سطح EVA — مختارة ومختبرة لمواسم من الشمس والملح والإساءة.
      icon: tabler:flask
    - title: ضمان لمدة سنتين SUP
      description: لوحات Paddle Board Overstock SUP مغطاة بضمان لمدة سنتين ضد عيوب التصنيع، بما في ذلك اللحامات والصمامات وفصل المواد. نحن ندعم ما نقوم ببنائه.
      icon: tabler:shield-check
testimonials:
  tagline: ثقة العملاء
  title: ماذا يقول عملاؤنا
  subtitle: من المتجدّدين في التجديف إلى المستكشفين المخضرمين — اكتشف لماذا يثقون بـ Paddle Board Overstock.
  items:
    - content: كمشتري لأول مرة، كنت متوتراً بشأن الطلب من الخارج. أجاب الفريق على كل سؤال بصور حقيقية وسجلات اختبار قبل أن أسأل حتى. وصلت اللوحة في 6 أيام وتجاوزت توقعاتي.
      name: جيمس ثورنتون
      title: SUP مالك Explorer 11 — فانكوفر، كندا
features3_lab:
  title: مختبر الاختبارات والجودة الداخلي
  subtitle: تمر كل دفعة من المواد والمنتج النهائي عبر مختبر الاختبار الموجود في الموقع قبل شحنه.
  columns: 3
  isBeforeContent: true
  items:
    - title: اختبار قوة الشد
      description: 'يتم اختبار كل PVC لفة قماش لقوة الشد داخل المصنع. الحد الأدنى المطلوب: 350 نيوتن/سم في السداة والفيت. يتم إعادة الدفعات المرفوضة إلى المورد — نرفض حوالي 3% من المواد الواردة.'
      icon: tabler:scale
    - title: UV الشيخوخة المتسارعة
      description: تخضع عينات الأقمشة لتسريع التعرض للعوامل الجوية لمدة 1,000 ساعة. يجب أن تحتفظ قوة الشد بنسبة 80٪ بعد التعرض. يتم تصنيف المنتجات لمدة 3 سنوات للاستخدام الخارجي.
      icon: tabler:sun
    - title: قوة تقشير الدرزة
      description: يتم اختبار اللحامات الملحومة بقوة تقشير لا تقل عن 5 نيوتن/مم. كل دفعة إنتاجية يتم اختبارها وأرشفتها بشكل تدميري.
      icon: tabler:stack
    - title: عقد الضغط لمدة 24-48 ساعة
      description: 'يتم نفخ كل منتج قابل للنفخ إلى تصنيف 1.25x PSI ويتم مراقبته لمدة 24-48 ساعة. الحد الأقصى المسموح به لانخفاض الضغط: 5%. تتم إعادة صياغة المنتجات التي تفشل في هذا الاختبار وإعادة اختبارها قبل الشحن.'
      icon: tabler:wind
    - title: اختبار دورة الصمامات
      description: كل تصميم صمام يخضع ل 10,000 دورة فتح وإغلاق في مختبرنا. يجب أن تحافظ الصمامات على ختم محكم عند ضغط مصنف 1.25 ضعف بعد الدورة. جميع Paddle Board Overstock الصمامات مصنفة لمدة 5+ سنوات من الاستخدام المنتظم.
      icon: tabler:rotate
    - title: مقاومة الكراك البارد
      description: يتم اختبار المواد عند -30°م لمدة 4 ساعات. لا يسمح بالتشقق أو الهشاشة. المنتجات المصنفة للتخزين الشتوي واستخدام المياه الباردة حتى -10°C في درجة الحرارة المحيطة.
      icon: tabler:snowflake
steps2_manufacturing:
  title: كيف نضمن الجودة
  subtitle: من فحص المواد الخام إلى اختبار الضغط النهائي — يمر كل منتج بسلسلة جودة صارمة.
  items:
    - title: تفتيش المواد الخام
      description: يتم اختبار كل لفة PVC قماش من حيث السماكة، وقوة الشد، UV والمقاومة قبل دخول الإنتاج.
      icon: tabler:search
    - title: مراقبة الجودة أثناء العملية
      description: يتم فحص لحامات اللحام، وتركيبات الصمامات، وروابط الحجرة في كل محطة أثناء التجميع.
      icon: tabler:eye
    - title: اختبار الضغط
      description: يتم نفخ كل منتج قابل للنفخ إلى تصنيف 1.25x PSI والاحتفاظ به لمدة 24–48 ساعة للتحقق من احتباس الهواء وسلامة الدرز.
      icon: tabler:wind
    - title: التفتيش النهائي
      description: يتم فحص كل وحدة من حيث التشطيب، والأجهزة، والتغليف قبل الموافقة على الشحن. تذهب عينات الدفعات إلى مختبرنا لإجراء اختبارات تدمرة.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP الأسئلة الشائعة عن المجلس
  subtitle: أسئلة شائعة حول ألواح التجديف الواقفة لدينا.
  columns: 2
  items:
    - title: ما SUP هي أحجام الألواح المتوفرة؟
      description: نقدم SUP ألواح تتراوح من 9 إلى 12 قدم، تشمل التصاميم الشاملة، والجولات، واليوغا، والتصاميم المتخصصة. تشمل نماذجنا الأكثر مبيعا Tropical Breeze (10 أقدام) وأوشن فوياجر (11 قدم).
    - title: ما هو drop-stitch البناء؟
      description: Drop-stitch يستخدم البناء آلاف خيوط البوليستر التي تربط الطبقتين العلوية والسفلى من اللوح، مما يسمح له بتحمل ضغط هواء مرتفع (15–20 PSI) وتحقيق منصة صلبة ومستقرة. هذا هو المعيار الصناعي للنفخ الفاخر SUPs.
    - title: ما هو الحد الأقصى SUP للوزن للألواح؟
      description: SUP تدعم لوحنا حتى 150 كجم حسب الطراز والحجم. لوح ليفايثان ويك هو أعلى موديل لدينا من حيث السعة، مصمم للركاب الأكبر حجما واستخدام اليوغا.
    - title: هل تقدمون SUP باقات كاملة؟
      description: نعم. SUP كل لوحة تشحن مع حزمة كاملة تشمل مجدافا من الألمنيوم مكون من 3 قطع، مضخة يدوية عالية الضغط، مقود لولبي، حقيبة سفر، وعدة إصلاح. بعض الطرازات تتضمن أيضا مجموعة زعانف قابلة للإزالة.
    - title: ما هو الضمان على SUP اللوحات؟
      description: Paddle Board Overstock SUP جميع الألواح تحمل ضمانا لمدة سنتين ضد عيوب التصنيع، بما في ذلك فشل الدرز، وعيوب الصمامات، وتآكل المواد أثناء الاستخدام العادي.
    - title: كم يستغرق نفخ SUP اللوح؟
      description: باستخدام المضخة اليدوية المرفقة، يستغرق النفخ الكامل إلى 15 PSI حوالي 8-12 دقيقة. للحصول على نفخ أسرع، نوصي Paddle Board Overstock بمضخة كهربائية 12 فولت، التي تنتفخ اللوح في أقل من 4 دقائق.
