features3_certifications:
  title: الشهادات والامتثال
  subtitle: كل منتج يتم اختباره بشكل مستقل؛ و64 طرازًا معتمدًا من CE وفق المعايير الدولية.
  columns: 3
  isBeforeContent: true
  items:
    - title: شهادة CE
      description: 64 طرازًا معتمدًا من CE تشمل ألواح SUP والكاياك والقوارب الصغيرة وRIB وتلبي معيار السلامة الأوروبي CE للمراكب الترفيهية. يخضع كل منتج لاختبار الضغط والطفو والحمولة قبل مغادرة المصنع.
      icon: tabler:certificate
    - title: ''
      description: منشأتنا في تشينغداو بمساحة 12,000 م² تعمل تحت نظام إدارة جودة ISO 9001:2015. كل دفعة إنتاج قابلة للتتبع وموثقة ومفحوصة.
      icon: tabler:clipboard-check
    - title: الامتثال الاجتماعي BSCI
      description: نحن معتمدون BSCI، مما يضمن ممارسات عمل أخلاقية وظروف عمل آمنة ومسؤولية بيئية عبر سلسلة التوريد لدينا.
      icon: tabler:users
    - title: REACH وRoHS
      description: جميع المواد — PVC وHypalon ورغوة EVA والمواد اللاصقة — تمتثل للوائح EU REACH وRoHS. لا مواد مقيدة، لا حلول وسط.
      icon: tabler:flask
    - title: مختبر اختبار المواد
      description: يختبر مختبر المواد الداخلي قوة الشد ومقاومة الأشعة فوق البنفسجية وسلامة اللحامات والتآكل لكل دفعة قماش قبل الإنتاج.
      icon: tabler:microscope
    - title: ضمان سنتين
      description: كل منتج أكوافارير يأتي مع ضمان سنتين ضد عيوب التصنيع. نحن نقف وراء ما نبنيه.
      icon: tabler:shield-check
testimonials:
  tagline: ثقة العملاء
  title: ماذا يقول عملاؤنا
  subtitle: من المجدفين لأول مرة إلى مشغلي الأسطول المحترفين — انظر لماذا يثقون بأكوافارير.
  items:
    - content: جهزنا أسطول التأجير بالكامل بقوارب RIB من أكوافارير. موسمان، ولا عطل واحد. شهادة CE جعلت الموافقة التأمينية seamless.
      name: ماركو ف.
      title: مشغل سياحي، كرواتيا
    - content: كمشتري لأول مرة، كنت متوتراً بشأن الجودة. وثائق ISO وتقارير الاختبار التي شاركوها أعطتني ثقة كاملة.
      name: جيمس تي.
      title: مالك SUP Explorer 11، كندا
    - content: نعمل مع أكوافارير لوحدات الدوريات الساحلية لدينا. عملية مراقبة الجودة لديهم متسقة عبر كل دفعة — تلك الموثوقية تهم في العمليات الحرجة.
      name: النقيب أندريس
      title: المشتريات البحرية، الفلبين
steps2_manufacturing:
  title: كيف نضمن الجودة
  subtitle: من فحص المواد الخام إلى اختبار الضغط النهائي — كل منتج يمر عبر سلسلة جودة صارمة.
  items:
    - title: فحص المواد الخام
      description: كل لفة من قماش PVC يتم اختبارها من حيث السمك وقوة الشد ومقاومة الأشعة فوق البنفسجية قبل دخول الإنتاج.
      icon: tabler:search
    - title: مراقبة الجودة أثناء التصنيع
      description: يتم فحص لحامات اللحام وتركيبات الصمامات وروابط الغرف في كل محطة أثناء التجميع.
      icon: tabler:eye
    - title: اختبار الضغط
      description: كل منتج قابل للنفخ يتم نفخه إلى 1.25x PSI المصنف ويحتفظ به لمدة 24-48 ساعة للتحقق من احتباس الهواء وسلامة اللحامات.
      icon: tabler:wind
    - title: الفحص النهائي
      description: يتم فحص كل وحدة من حيث التشطيب والأجهزة والتغليف قبل الموافقة على الشحن. تذهب عينات الدفعات إلى مختبرنا للاختبار التدميري.
      icon: tabler:clipboard-check
faqs_rib:
  title: أسئلة شائعة عن قوارب RIB
  subtitle: أسئلة شائعة حول قواربنا ذات الهيكل الصلب القابلة للنفخ.
  columns: 2
  items:
    - title: ما أحجام قوارب RIB التي تقدمها أكوافارير؟
      description: نقدم 35 موديل RIB تتراوح من 2.5 م إلى 7.6 م، تغطي كل شيء من القوارب الصغيرة المدمجة إلى القوارب التجارية الثقيلة ودوريات. كل موديل متاح مع خيارات تكوين متعددة.
    - title: ما الفرق بين RIB والقارب القابل للنفخ التقليدي؟
      description: RIB (قارب قابل للنفخ بهيكل صلب) يجمع بين هيكل صلب من الألياف الزجاجية أو الألومنيوم على شكل V عميق مع أنابيب قابلة للنفخ من Hypalon أو PVC. يمنحك هذا ثبات وسعة حمولة القارب الصلب مع امتصاص الصدمات والطفو للقارب القابل للنفخ.
    - title: ما المحركات المتوافقة مع قوارب RIB من أكوافارير؟
      description: قوارب RIB لدينا تدعم محركات خارجية من 3 HP إلى 250 HP حسب الموديل. كل صفحة منتج تدرج أقصى قوة محرك مقدرة. نوصي باستشارة وكيلك للعثور على المطابقة المثالية.
    - title: هل قوارب RIB من أكوافارير معتمدة CE؟
      description: نعم. جميع موديلات RIB الترفيهية معتمدة CE وفق المعايير الأوروبية المطبقة للمراكب الترفيهية. تلبي موديلات التجارية والدوريات متطلبات استقرار وحمولة إضافية.
    - title: ما هو الضمان على قوارب RIB؟
      description: جميع قوارب RIB من أكوافارير تأتي مع ضمان قياسي لمدة سنة واحدة ضد عيوب التصنيع، تغطي انفصال الهيكل وفشل لحام الأنابيب وعيوب الصمامات ومشاكل الأجهزة.
    - title: كم غرفة هواء تمتلك قوارب RIB من أكوافارير؟
      description: قوارب RIB لدينا تحتوي على 3 إلى 7 غرف هواء مستقلة حسب طول الموديل. يضمن هذا التصميم متعدد الغرف بقاء القارب طافياً حتى لو تعرضت إحدى المقصورات للاختراق.
faqs_inflatable:
  title: أسئلة شائعة عن القوارب القابلة للنفخ
  subtitle: أسئلة شائعة حول قواربنا القابلة للنفخ والكاياك والقوارب.
  columns: 2
  items:
    - title: ما المواد المستخدمة في قوارب أكوافارير القابلة للنفخ؟
      description: نستخدم PVC بدرجة عسكرية (1100 denier) ومطاط Hypalon/CSM الفاخر، حسب الموديل. كلا المادتين مثبتتان ضد الأشعة فوق البنفسجية ومقاومتان للتآكل ومتوافقتان مع لوائح EU REACH وRoHS.
    - title: كم تدوم القوارب القابلة للنفخ؟
      description: مع العناية المناسبة، يدوم قارب PVC القابل للنفخ عالي الجودة 7–10 سنوات، بينما يمكن لموديلات Hypalon أن تدوم 15–20 سنة. التنظيف المنتظم والحماية من الأشعة فوق البنفسجية والتخزين المناسب يطيل عمر الخدمة بشكل كبير.
    - title: ما الصيانة المطلوبة للقارب القابل للنفخ؟
      description: تشمل الصيانة الأساسية الشطف بالماء العذب بعد كل استخدام (خاصة في المياه المالحة)، والتجفيف قبل التخزين، وفحص أختام الصمامات سنوياً، وتطبيق واقي من الأشعة فوق البنفسجية على الأنابيب. تجنب التعرض لأشعة الشمس لفترات طويلة عند عدم الاستخدام.
    - title: هل يمكن استخدام القوارب القابلة للنفخ في المياه المالحة؟
      description: نعم. جميع قوارب أكوافارير القابلة للنفخ مصممة للاستخدام في كل من المياه العذبة والمالحة. نوصي بالشطف بالماء العذب والتجفيف جيداً بعد التعرض للمياه المالحة لمنع تآكل التركيبات وتبلور الملح في القماش.
    - title: كيف أخزن القارب القابل للنفخ؟
      description: افرغ الهواء ونظف وجفف القارب تماماً قبل التخزين. لفه بشكل فضفاض (تجنب الطيات الضيقة)، وخزنه في مكان بارد وجاف بعيداً عن أشعة الشمس المباشرة، وابقَه بعيداً عن الأرضيات الخرسانية لمنع امتصاص الرطوبة.
    - title: ما سعة الوزن لقوارب أكوافارير القابلة للنفخ؟
      description: تتراوح سعات الوزن من 290 كجم لأصغر موديلاتنا إلى أكثر من 2000 كجم للقوارب التجارية الأكبر. كل صفحة منتج تدرج أقصى حمولة مقدرة لموديلك المحدد.
faqs_sup:
  title: أسئلة شائعة عن ألواح SUP
  subtitle: أسئلة شائعة حول ألواح التجديف الوقوف.
  columns: 2
  items:
    - title: ما أحجام ألواح SUP المتوفرة؟
      description: نقدم ألواح SUP من 9 قدم إلى 12 قدم، بما في ذلك التصاميم متعددة الاستخدامات والجولات واليوغا والتصاميم المتخصصة. تشمل موديلاتنا الأكثر مبيعاً Tropical Breeze (10 قدم) وOcean Voyager (11 قدم).
    - title: ما هو بناء الخياطة المتساقطة؟
      description: يستخدم بناء الخياطة المتساقطة آلاف الخيوط المصنوعة من البوليستر التي تربط الطبقتين العلوية والسفلية من اللوح، مما يسمح له بالاحتفاظ بضغط هواء عالٍ (15–20 PSI) وتحقيق منصة صلبة ومستقرة. هذا هو المعيار الصناعي لألواح SUP القابلة للنفخ الفاخرة.
    - title: ما حد الوزن لألواح SUP؟
      description: ألواح SUP لدينا تدعم حتى 150 كجم حسب الموديل والحجم. لوح Leviathan Wake هو موديلنا الأعلى سعة، مصمم للراكبين الأكبر حجماً واستخدام اليوغا.
    - title: هل تقدمون حزم SUP كاملة؟
      description: نعم. كل لوح SUP يُشحن مع حزمة كاملة تتضمن مجداف ألومنيوم ثلاثي القطع ومضخة ضغط عالي يدوية وحبل ربط ملفوف وحقيبة ظهر للسفر وطقم إصلاح. بعض الموديلات تتضمن أيضاً مجموعة زعانف قابلة للإزالة.
    - title: ما هو الضمان على ألواح SUP؟
      description: جميع ألواح SUP من أكوافارير تحمل ضمان سنة واحدة ضد عيوب التصنيع، بما في ذلك فشل اللحامات وعيوب الصمامات وانفصال المواد تحت الاستخدام العادي.
    - title: كم يستغرق نفخ لوح SUP؟
      description: باستخدام المضخة اليدوية المرفقة، يستغرق النفخ الكامل إلى 15 PSI حوالي 8–12 دقيقة. للنفخ الأسرع، نوصي بمضخة أكوافارير الكهربائية 12V، التي تنفخ اللوح في أقل من 4 دقائق.
cta:
