features3_lab:
  title: مختبر الاختبارات والجودة الداخلي
  subtitle: تمر كل دفعة من المواد والمنتج النهائي عبر مختبر الاختبار الموجود في الموقع قبل شحنه.
  columns: 3
  isBeforeContent: true
  items:
    - title: اختبار قوة الشد
      description: 'يتم اختبار كل لفة قماش PVC وفقًا لمعايير ASTM D751. الحد الأدنى المطلوب: 350 نيوتن/سم من السداة واللحمة. يتم إرجاع الدفعات المرفوضة إلى المورد - فنحن نرفض حوالي 3% من المواد الواردة.'
      icon: tabler:scale
    - title: الأشعة فوق البنفسجية تسارع الشيخوخة
      description: تخضع عينات القماش للتجوية المتسارعة QUV لمدة 1000 ساعة (ASTM G154). يجب أن يتجاوز الاحتفاظ بقوة الشد 80٪ بعد التعرض للأشعة فوق البنفسجية. منتجات مصنفة للاستخدام الخارجي لأكثر من 3 سنوات.
      icon: tabler:sun
    - title: قوة تقشير اللحامات
      description: تم اختبار الدرزات الملحومة RF عند الحد الأدنى من قوة التقشير 5 نيوتن/مم (ASTM D751). تم اختبار طبقات Hypalon الملصقة يدويًا عند 3.5 نيوتن/مم. تحتوي كل دفعة إنتاج على عينات التماس التي تم اختبارها وحفظها بشكل مدمر.
      icon: tabler:stack
    - title: عقد الضغط لمدة 24-48 ساعة
      description: 'يتم نفخ كل منتج قابل للنفخ إلى تصنيف 1.25x PSI ويتم مراقبته لمدة 24-48 ساعة. الحد الأقصى المسموح به لانخفاض الضغط: 5%. تتم إعادة صياغة المنتجات التي تفشل في هذا الاختبار وإعادة اختبارها قبل الشحن.'
      icon: tabler:wind
    - title: اختبار دورات الصمامات
      description: يخضع كل تصميم للصمام إلى 10000 دورة إغلاق مفتوح في مختبرنا. يجب أن تحافظ الصمامات على إغلاق محكم عند ضغط مقنن 1.25x بعد ركوب الدراجات. جميع الصمامات Paddle Board Overstock مصنفة للاستخدام المنتظم لأكثر من 5 سنوات.
      icon: tabler:rotate
    - title: مقاومة الكراك البارد
      description: تم اختبار المواد عند -30 درجة مئوية لمدة 4 ساعات لكل ISO 4646. غير مسموح بالتشقق أو التقصف. المنتجات المُصنفة للتخزين في فصل الشتاء واستخدام الماء البارد حتى -10 درجة مئوية في درجة الحرارة المحيطة.
      icon: tabler:snowflake

