content_challenge:
  tagline: التحدي
  title: عمليات الإنقاذ تتطلب<br />موثوقية بلا مساومة
  subtitle: تعمل منظمات البحث والإنقاذ تحت مسؤوليات السلامة القصوى - فكل فشل في القارب يحمل عواقب غير مقبولة.
  paragraphs:
    - وفي عمليات الإنقاذ، يتم قياس الهامش بين النجاح والفشل بالدقائق. يجب أن يكون القارب جاهزًا للانطلاق فورًا، والعمل في ظروف قاسية، والعودة بأمان مع الركاب. إن مسؤولية السلامة مطلقة - فالعطل الميكانيكي أثناء مهمة الإنقاذ لا يمثل تكلفة إصلاح، بل يمثل خسارة في الأرواح.
    - SAR تحتاج القوارب إلى سرعة عالية للوصول إلى الضحايا بسرعة، بالإضافة إلى ثبات استثنائي لعمليات انتشال آمنة. يجب أن يحملوا معدات الإنقاذ والإمدادات الطبية ومعدات الاتصالات - غالبًا في مساحة محدودة على سطح السفينة. تحتاج القوارب العاملة في الخدمة الحكومية أيضًا إلى عمر خدمة طويل (10-15+ سنة) لتبرير ميزانيات المشتريات العامة.
    - الرؤية، سواء للمشغل أو لأعمال البحث، أمر بالغ الأهمية. يجب أن يوفر تصميم الكونسول رؤية بزاوية 360 درجة، ويجب أن يكون القارب مرئيًا بوضوح للطائرات والسفن الأخرى.
    - قوارب RIB الإنقاذ من Aquafarer مُصممة من عارضة القارب صعودًا لتلبية هذه المتطلبات — مع أسطح ذاتية التصريف وهياكل معززة وأطقم ملاحة وأعمدة قطر قياسية في طرازات الدورية.
content_solution:
  tagline: الحل لدينا
  title: قوارب RIB إنقاذ مخصصة الغرض
  subtitle: كل قارب إنقاذ من Aquafarer مصمم لتلبية أو تجاوز معايير SOLAS ومعايير البحث والإنقاذ الوطنية.
  list:
    - سطح ذاتي التصريف — يتم تصريف المياه تلقائيًا لضمان الاستقرار أثناء عمليات الاسترجاع
    - هيكل deep-V معزز — قدرة على المياه الهائجة مع تحكم يمكن التنبؤ به عند السرعات العالية
    - طقم أضواء ملاحة كامل — تشغيل نهارًا وليلاً في جميع الأحوال الجوية
    - عمود قطر وحبل قطر — جاهز لقطر السفن أو عمليات زلاجات الإنقاذ
    - لوحات تثبيت المعدات — راديو وكشاف وصفارة ومعدات طبية
    - تعدد تكوينات المحركات — محرك خارجي واحد أو تكرار بمحركين
    - ألوان أنابيب عالية الرؤية — برتقالي أو أصفر أو أحمر لأقصى درجات الرؤية
content_segments:
  tagline: ملفات تعريف الإنقاذ
  title: حلول البحث والإنقاذ للمركبات المائية<br />حسب نوع المنظمة
  subtitle: تعمل منظمات الإنقاذ المختلفة بموجب ولايات ودورات ميزانية وبيئات تشغيل مختلفة - بدءًا من أطقم المتطوعين الساحليين وحتى أساطيل خفر السواحل الوطنية. نقوم بتكوين كل عملية إنقاذ RIB لتتناسب مع ملف تعريف المهمة.
  items:
    - title: خفر السواحل والحكومة SAR الوكالات
      subtitle: مسؤولية السلامة المطلقة - معايير الأسطول ذات المهام الحرجة
      description: تتحمل الوكالات الحكومية SAR أعلى مسؤولية تتعلق بالسلامة في العمليات البحرية. يجب أن يؤدي كل قارب أداءً لا تشوبه شائبة في الظروف القاسية - ولا يعد تعطل المعدات أثناء مهمة الإنقاذ خيارًا. تعتمد قرارات الشراء على التكلفة الإجمالية للملكية على مدى فترة خدمة تتراوح من 10 إلى 15 عامًا، وليس السعر المقدم. تحتاج الوكالات إلى سفن يمكنها البقاء على قيد الحياة لسنوات من الدوريات الساحلية، وتفي بالمعايير الوطنية الصارمة، وتقدم أداءً ثابتًا عبر المحطات الموزعة. تعد وثائق الامتثال الشاملة واتفاقيات الخدمة متعددة السنوات إلزامية.
      features:
        - SOLAS وحزمة وثائق الامتثال للمعايير الوطنية SAR
        - القواسم المشتركة للأجزاء على مستوى الأسطول - تقليل تعقيد المخزون على مستوى المحطة
        - تكوين ثنائي المحرك للتكرار في المهام الحرجة
        - تصميم بعمر خدمة يتراوح بين 10 إلى 15 عامًا مع برامج الصيانة المجدولة
        - القدرة على تحمل جميع الأحوال الجوية - بدن معزز deep-V لحالات البحر الهائج
    - title: خدمات الإنقاذ والإنقاذ على الشاطئ
      subtitle: عمليات الإطلاق السريع في المياه الضحلة
      description: تحتاج خدمات الإنقاذ البلدية والشاطئية إلى سفن استجابة سريعة يمكنها الانطلاق عبر مناطق ركوب الأمواج، والعمل في المياه الضحلة القريبة من الشاطئ، والوصول إلى السباحين أو القوارب المتعثرة في غضون دقائق. يجب أن تكون المعدات خفيفة الوزن بما يكفي لقطرها على الشاطئ بواسطة مركبة صغيرة أو يدويًا.
      features:
        - هيكل ذو مسودة ضحلة RIB لمنطقة ركوب الأمواج والتشغيل على الشاطئ
        - قادرة على الإطلاق على الشاطئ بمقبض رفع القوس وواقي العارضة
        - زلاجات إنقاذ متكاملة أو منصة سباح إنقاذ
        - ألوان أنبوبية برتقالية أو صفراء عالية الوضوح قياسية
    - title: أقسام الإنقاذ من الحرائق
      subtitle: تكامل مضخة الحريق، وتركيب المعدات، والاستجابة السريعة
      description: تستجيب الوحدات البحرية للإنقاذ من الحرائق لحرائق هياكل الواجهة البحرية وحرائق السفن وحوادث الإنقاذ المائية. يجب أن تحمل هذه القوارب مضخات إطفاء، وأجهزة مراقبة، وخراطيم تخزين، وأجهزة تنفس - وكلها مدمجة في منصة مستقرة وسريعة الاستجابة. تستخدم الإدارات أيضًا هذه السفن للاستجابة للفيضانات وعمليات المساعدة المتبادلة. يجب أن تستوعب تخطيطات وحدة التحكم أدوات التحكم في المضخة وأنظمة الراديو وإضاءة الطوارئ دون المساس بمساحة سطح السفينة لحركة الطاقم.
      features:
        - جهاز مراقبة الحريق مُثبت على القوس مع حزمة متكاملة للمضخة
        - تركيب معدات مخصصة لمضخة الحريق، وتخزين الخراطيم، ومجموعات BA
        - تخطيط وحدة التحكم قابل للتكوين للتحكم في المضخة والراديو وإضاءة الطوارئ
        - سطح ذاتي الكفالة لمكافحة جريان المياه والاستقرار
        - 'حزمة العمليات الليلية: كشاف، إضاءة المشهد، شريط الضوء الأزرق/الأحمر'
    - title: الشرطة البحرية وأمن الموانئ
      subtitle: عمليات المنع والدوريات والصعود إلى الطائرة
      description: تتطلب وحدات إنفاذ القانون البحري سفنًا قادرة على المطاردة عالية السرعة، والصعود على متن السفن المشتبه بها، ودوريات أمن الميناء. يجب أن تحتوي هذه القوارب على مخزن آمن لمعدات التنفيذ والأسلحة، وتكامل الاتصالات مع قيادة الشاطئ، ومساحة كافية على سطح السفينة لعمليات فريق الصعود. تعد القدرة على العمليات الليلية والنهج غير البارز أمرًا ضروريًا لمهام الحظر.
      features:
        - قدرة مطاردة عالية السرعة — تخطيط الهيكل بسرعة قصوى تزيد عن 40 عقدة
        - تأمين خزانة الأسلحة ومقصورات تخزين معدات الإنفاذ
        - تكامل وحدة التحكم لراديو الشرطة، وMDT، وأنظمة الاتصالات
        - 'حزمة العمليات الليلية: كشاف IR، حامل FLIR، إضاءة سرية'
        - منصة صعود معززة مع سطح غير قابل للانزلاق
        - إضاءة الطوارئ ونظام صفارة الإنذار باللون الأزرق/الأحمر
    - title: التطوعية SAR والمنظمات غير الربحية
      subtitle: العمليات الساحلية والبحيرات المجتمعية الممولة من المنح
      description: تعمل مجموعات الإنقاذ المجتمعية في البحيرات والأنهار والمناطق الساحلية حيث تكون التغطية الحكومية SAR محدودة. تحتاج هذه المنظمات، التي يتم تمويلها في كثير من الأحيان عن طريق التبرعات أو المنح الحكومية، إلى أقصى قدر من القدرة مقابل كل دولار - وهي سفينة موثوقة ومنخفضة الصيانة يمكن للمتطوعين تشغيلها بأمان مع الحد الأدنى من التدريب المخصص. تعني دورات شراء المنح أن القوارب يجب أن تستوفي متطلبات الامتثال مع البقاء ضمن الميزانيات الثابتة.
      features:
        - تم تحسين التكوين الخارجي الفردي لتقليل تكلفة الاستحواذ والتشغيل
        - PVC البناء لصيانة أقل وإصلاح ميداني سهل
        - وحدة تحكم متعددة الوظائف تقلل من التعقيد الإلكتروني للمشغلين المتطوعين
        - حزمة وثائق الامتثال للمنحة لطلبات التمويل
        - تصميم خفيف الوزن للانطلاق على الشاطئ بدون مقطورة أو رافعة مخصصة
    - title: الإنقاذ من الفيضانات والاستجابة للكوارث
      subtitle: الفيضانات الداخلية والمياه الضحلة والبيئات المحملة بالحطام
      description: إن الإنقاذ من الفيضانات هو ملف تشغيلي متميز - تعمل القوارب في المناطق الحضرية التي غمرتها الفيضانات، والتيارات المليئة بالحطام، والمياه الضحلة للغاية حيث تكون العوائق المغمورة غير مرئية. يحتاج المشغلون إلى سفن يمكنها التنقل في الشوارع التي غمرتها الفيضانات، والدفع عبر الحطام، وانتشال الضحايا من المباني والمركبات. تعد القدرة على السحب الضحل أمرًا بالغ الأهمية، وكذلك القدرة على العمل في التيار مع مخاطر العوائق. غالبًا ما يتم نشر هذه القوارب من قبل أقسام الإطفاء والدفاع المدني والمنظمات غير الحكومية للإغاثة في حالات الكوارث.
      features:
        - بدن ذو غاطس ضحل للغاية - يعمل في 30-50 سم من الماء
        - قوس مضاد للحطام وحماية أنبوبية معززة للعوائق المغمورة
        - سطح إنقاذ ذاتي لجريان مياه الفيضانات وانتعاش الضحايا
        - أنابيب برتقالية أو صفراء عالية الوضوح لرؤية الاستطلاع الجوي
        - تصميم خفيف الوزن لنقل طائرات الهليكوبتر والنشر على الطرق
        - نقاط رفع معززة لعمليات إنقاذ الرافعات والحبال
