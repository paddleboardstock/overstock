hero:
  tagline: قصص النجاح
  title: نتائج حقيقية من بناة أعمال المياه
  subtitle: شاهد كيف قامت النوادي والمنتجعات ومشغلو التأجير حول العالم ببناء برامج رياضات مائية مزدهرة بمعدات Paddle Board Overstock والدعم.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: قصص نجاح عملاء Paddle Board Overstock
stories:
  - title: كيف بنى منتجع البحر الأبيض المتوسط شركة مربحة لتأجير SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: منتجع شاطئي 5 نجوم – اليونان
    problem: كان المنتجع بحاجة إلى أنشطة مائية متميزة للضيوف لزيادة درجات الرضا وإنشاء مصدر جديد للإيرادات، لكنه كان يفتقر إلى المعدات والبنية التحتية للسلامة وخبرة الموظفين.
    solution: قامت Paddle Board Overstock بتسليم 50 لوحة SUP ذات علامة تجارية مخصصة مع ألوان المنتجع وشعاره، ونظام أمان كامل بما في ذلك محطة الإنقاذ وخطوط العوامات، وبرنامج تدريب للموظفين لمدة 3 أيام يغطي التعامل مع المعدات وتعليمات الضيوف وبروتوكولات السلامة.
    result:
      - أكثر من 300 نشاط للضيوف محجوز أسبوعيًا خلال الشهر الأول
      - 'درجات رضا الضيوف عن الأنشطة المائية: 4.8/5'
      - 'إيرادات سنوية إضافية جديدة: 180 ألف دولار'
      - حوادث سلامة معدومة في أول موسم تشغيلي
      - تكلفة استبدال المعدات انخفضت بنسبة 40% مقارنة بالمورد السابق
    quote:
      text: لم تقم Paddle Board Overstock بتسليم اللوحات فحسب، بل ساعدتنا في بناء تجربة كاملة للضيوف. انتقل برنامج الرياضات المائية الخاص بنا من الصفر إلى تسليط الضوء على المنتجع في موسم واحد.
      author: مدير عام المنتجع
    cta_text: ابنِ حل المنتجع الخاص بك
    cta_href: /solutions/resorts
  - title: كيف صعد نادي الشاطئ التايلاندي من 10 إلى 80 لوحة
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: نادي الرياضات المائية - تايلاند
    problem: احتاج نادي SUP صغير على شاطئ البحر في فوكيت إلى التوسع من مجرد هواية إلى شركة تأجير احترافية تخدم السياح، لكنه لم يتمكن من العثور على مورد معدات موثوق به بجودة وأسعار متسقة.
    solution: بدءًا من باقة Paddle Board Overstock's Club Starter (10 ألواح، ومجاديف، ومعدات السلامة، والعلامة التجارية)، نما النادي من خلال برنامج Premium Package على مدار 18 شهرًا.
    result:
      - التوسع من 10 إلى 80 لوحة خلال 18 شهرًا بجودة وأسعار ثابتة
      - تمت إضافة دروس يوغا ولياقة بدنية SUP إلى الجدول الأسبوعي
      - الهوية المخصصة للنادي عززت التعرف على العلامة التجارية بين السياح
      - تكاليف الصيانة انخفضت بنسبة 60% مقارنة بالمعدات الاقتصادية السابقة
      - نخدم الآن أكثر من 150 عملية تأجير يوميًا في ذروة الموسم
    quote:
      text: كانت حزمة Club Starter هي نقطة الدخول المثالية. مع نمو أعمالنا، نمت Paddle Board Overstock معنا - نفس الجودة، ونفس السعر، ولا توجد مفاجآت.
      author: مالك النادي، فوكيت
    cta_text: ابدأ باقة النادي الخاصة بك
    cta_href: /solutions/clubs
  - title: كيف قامت سلسلة منتجعات كاريبية بتوحيد الرياضات المائية عبر 5 عقارات
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: سلسلة المنتجعات - منطقة البحر الكاريبي
    problem: احتاجت سلسلة منتجعات فاخرة تضم 5 عقارات إلى جودة وعلامة تجارية متسقة لمعدات الرياضات المائية في جميع المواقع، مع الشراء المركزي والتخطيط للاستبدال الموسمي.
    solution: قدمت Paddle Board Overstock أسطولًا متعدد الخصائص مكونًا من 400 SUPs بعلامة تجارية موحدة، ومخزون مشترك من قطع الغيار، وجدول استبدال سنوي بأسعار كمية.
    result:
      - تجربة ضيوف موحدة عبر جميع العقارات الخمسة
      - خفض التكاليف بنسبة 30% من خلال الشراء الموحد وأسعار الكميات
      - مخزون قطع الغيار المركزي قلل فترات التوقف بنسبة 80%
      - برنامج التجديد السنوي للمعدات أنهى الاندفاع في نهاية الموسم
      - مشاركة الضيوف في الرياضات المائية ارتفعت بنسبة 45% على أساس سنوي
    cta_text: صمم برنامج المنتجع الخاص بك
    cta_href: /solutions/resorts
