hero:
  tagline: قصص النجاح
  title: نتائج حقيقية من بناة أعمال المياه
  subtitle: شاهد كيف قامت النوادي والمنتجعات ورجال الأعمال حول العالم ببناء عمليات رياضات مائية مربحة باستخدام معدات ودعم Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
