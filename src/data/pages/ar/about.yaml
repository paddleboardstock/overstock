hero:
  tagline: عن الشركة
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: مصنع Paddle Board Overstock ورشة العمل
  title: |
    هندسة بحرية، <br />
    بطريقة <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: 'بدأنا في ورشة ساحلية بقارب واحد وإيمان راسخ: المنتجات البحرية يجب أن تُهندس كما لو كانت مهمة، لأنها كذلك. اليوم نشحن إلى أكثر من 40 دولة، لكن كل هيكل لا يزال يمر عبر نفس الأيدي التي بدأت الشركة.'

stats:
  title: بالأرقام
  columns: 4
  stats:
    - title: هياكل تم تسليمها
      amount: '2,400+'
    - title: دول تم الشحن إليها
      amount: '50+'
    - title: سنوات الخبرة المشتركة
      amount: '60'
    - title: متوسط وقت الاستجابة للضمان (ساعات)
      amount: '24'

features3_what_we_build:
  title: ما نبني
  subtitle: خط إنتاجي مركّز نعرفه تماماً — لا تجارب نصف مكتملة، ولا هندسة شعارات.
  columns: 3
  isBeforeContent: true
  items:
    - title: قوارب RIB
      description: قوارب RIB بهيكل ألومنيوم من 3.3 م إلى 7.5 م. مصممة للدوريات والغوص والصيد والاستخدام العائلي.
      icon: tabler:ship
    - title: قوارب قابلة للنفخ
      description: زوارق قابلة للنفخ من PVC وهيبالون من 2.4 م إلى 4.2 م. خفيفة وقوية وسهلة التخزين.
      icon: tabler:speedboat
    - title: زوارق اليخوت الفاخرة
      description: قوارب RIB مدمجة عالية المواصفات مصممة خصيصاً لتتناسب مع مظهر يختك الرئيسي.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: الإكسسوارات
      description: مجاذيف، مضخات، أغطية، حقائب جافة، خزانات وقود وإلكترونيات. جميعها متوافقة مع قواربنا.
      icon: tabler:package
    - title: تجديد وإصلاح
      description: استبدال الأنابيب داخلياً، تحديث الإلكترونيات وترقية المحركات.
      icon: tabler:tool
    - title: تصنيع مخصص
      description: تصميم حسب المشروع للعملاء التجاريين والعلميين والعسكريين.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: مناقشة تصميم وهندسة القوارب

steps2_values:
  title: قيمنا
  subtitle: ثلاثة مبادئ شكّلت كل منتج منذ اليوم الأول.
  items:
    - title: اصنع وكأنه يحمل عائلتك
      description: كل هيكل ولحام ومثبت يُعالج وكأن عائلاتنا هي من ستستخدمه.
      icon: tabler:heart
    - title: اهندس قبل أن تبيع
      description: إذا كانت المواصفة خاطئة، نغيّر المواصفة — وليس العميل.
      icon: tabler:settings
    - title: دعم يدوم أطول من الضمان
      description: هياكل عمرها عشرون عاماً لا تزال تتصل بنا لطلب قطع الغيار، وما زلنا نرد.
      icon: tabler:headset

steps2_milestones:
  title: محطات بارزة
  subtitle: نسخة مختصرة من قصة Paddle Board Overstock.
  isReversed: true
  items:
    - title: تأسست في ورشة ساحلية
      description: بدأها مهندسان بحريان بماكينة CNC وفكرة ثابتة.
      icon: tabler:building-factory
    - title: أول 1,000 هيكل تم تسليمها
      description: تحقق في عامنا السابع، معظمه عن طريق الكلام الشفهي والعملاء المتكررين.
      icon: tabler:circle-check
    - title: برنامج التصدير الدولي
      description: نشحن الآن إلى أكثر من 40 دولة مع شركاء دعم محليين في خمس قارات.
      icon: tabler:world

features2_locations:
  title: مواقعنا
  tagline: جدنا
  columns: 3
  items:
    - title: المقر الرئيسي والورشة
      description: مجمع صناعي ساحلي، مبنى 4 — مفتوح من الاثنين إلى الجمعة للزيارات بالموعد.
    - title: مركز الخدمة الأوروبي
      description: ميناء متوسطي — تجديد وإصلاح وخدمات ضمان للعملاء الأوروبيين.
    - title: شبكة شركاء آسيا والمحيط الهادئ
      description: شركاء خدمة معتمدون في أستراليا واليابان وسنغافورة وهونغ كونغ.
brand_hub_tagline: 'العلامة التجارية'
brand_hub_title: 'استكشف علامتنا التجارية'
brand_hub_subtitle: 'تعمّق في خبرتنا في الهندسة البحرية وحضورنا العالمي والمبادئ التي تحرّكنا.'

brand_hub_cards:
  - title: 'الخبرة البحرية'
    desc: 'عقود من علم المواد والتصنيع الدقيق والاختبار في ظروف واقعية — من تصنيع PVC/Hypalon إلى تصميم هياكل V العميقة وتقنية drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'اعرف المزيد →'
  - title: 'الحضور العالمي'
    desc: 'الشحن إلى أكثر من 50 دولة من منشأتنا في تشينغداو مع شركاء خدمة معتمدين في أوروبا وآسيا والمحيط الهادئ والأمريكتين.'
    link: /brand-global-presence
    link_label: 'اعرف المزيد →'
  - title: 'لماذا Paddle Board Overstock'
    desc: 'التكامل الرأسي، والشهادات المزدوجة (ISO 9001 + BSCI)، ومطابقة معايير CE، وحدود طلبات دنيا منخفضة — صُممنا ذلك للعلامات التجارية والموزعين والجهات الحكومية.'
    link: /brand-why-paddleboardoverstock
    link_label: 'اعرف المزيد →'

production_section:
  tagline: 'التميز الإنتاجي'
  title: 'ضمان حرفية استثنائية'
  description: 'يكرّس خط الإنتاج لدى Paddle Board Overstock جهوده لتصنيع منتجات قابلة للنفخ عالية الجودة ومتينة وعالية الأداء.'
  cards:
    - title: 'فريق فنيين ذوو خبرة'
      items:
        - 'معرفة مهنية بمواد PVC وHypalon والمواد البحرية'
        - 'حرفية دقيقة في القص واللحام وتركيب الملحقات'
        - 'تدريب مستمر لإتقان أحدث تقنيات الإنتاج'
    - title: 'معدات إنتاج متقدمة'
      items:
        - 'معدات قطع CNC لقصّ الأقمشة بدقة عالية وبأخطاء دنيا'
        - 'لحام حراري/بارد عالي الدقة لدرزات محكمة ومتينة'
        - 'معدات احترافية لاختبار إحكام الهواء ومقاومة الشد'
    - title: 'نظام إدارة ناضج'
      items:
        - 'عمليات إنتاج معيارية بمعايير جودة واضحة'
        - 'فلسفة الإنتاج الرشيد التي تقلل الهدر وترفع الكفاءة'
        - 'إدارة فعّالة لسلسلة التوريد مع شراكات موثوقة'
    - title: 'مراقبة جودة صارمة'
      items:
        - 'نظام إدارة جودة معتمد'
        - 'فحص متعدد المراحل: المواد الخام، أثناء الإنتاج، الفحص النهائي'
        - 'اختبارات صارمة للإحكام والمتانة قبل الشحن'

global_ops_section:
  tagline: 'الهيكل التشغيلي العالمي'
  title_html: 'علامة واحدة، <span class="text-white/90">مركزان</span>'
  description_html: 'منذ سبتمبر 2026، تُدار Paddle Board Overstock بواسطة <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (نيو مكسيكو، الولايات المتحدة) — الكيان العالمي المسؤول عن التوزيع والمبيعات التجارية B2B والعقود والفوترة وخدمات ما بعد البيع. يبقى البحث والتطوير والإنتاج ومراقبة الجودة في <strong class="text-white">مركز تصنيع Paddle Board Overstock في تشينغداو</strong> الذي يشحن كل طلب مباشرة من المصنع، FOB تشينغداو. غيّر هذا الانتقال من يوقّع عقدك — لا من يصنع قاربك.'
  stats:
    - value: '2,400+'
      label: 'هيكل تم تسليمه عالمياً'
    - value: '50+'
      label: 'دولة نصدر إليها'
    - value: '10+'
      label: 'سنوات من التصنيع'
