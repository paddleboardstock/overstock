testimonial:
  quote: ما يميز Aquafarer هو علمهم المادي. إنهم لا يقومون فقط بتجميع المكونات - بل يقومون بتصميم المركبات PVC ومعلمات اللحام والتخطيط الهيكلي داخل الشركة. يظهر هذا التكامل الرأسي في المنتج النهائي.
  author: ديفيد بارك
  title: مدير تطوير المنتجات
  company: Bluewater Sports Equipment
  location: أستراليا
sections:
  - title: قطرة غرزة الأساسية
    standard: ضغط التشغيل 12-15 رطل لكل بوصة مربعة
    description: الآلاف من خيوط البوليستر الداخلية تربط الطبقات العلوية والسفلية، مما يخلق هيكلًا صلبًا عند 12-15 رطل لكل بوصة مربعة. هذه هي نفس التقنية المستخدمة في ألواح التجديف الاحترافية وقوارب السباق القابلة للنفخ. تم تحسين كثافة الغرز المتدلية لدينا لكل نموذج لتحقيق التوازن المثالي بين الصلابة والوزن.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: مخطط نواة Drop-Stitch
  - title: من الدرجة البحرية PVC
    standard: الانصهار الملحومة | تم اختباره بالأشعة فوق البنفسجية/المياه المالحة/التآكل
    description: قماش مصفح متعدد الطبقات PVC مُصنف للبيئات البحرية. يتم لحام كل طبقة بالانصهار بدلاً من لصقها، مما يزيل مخاطر التصفيح. تم اختباره لمقاومة الأشعة فوق البنفسجية (ASTM G154، أكثر من 1000 ساعة)، والتآكل في المياه المالحة (ISO 9227)، والتآكل (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: طبقة PVC
  - title: Hypalon أنابيب
    standard: CSM مطاط | الأشعة فوق البنفسجية / المواد الكيميائية / مقاومة درجات الحرارة القصوى
    description: يستخدم في موديلات RIB، يوفر المطاط Hypalon (CSM) مقاومة فائقة للأشعة فوق البنفسجية والمواد الكيميائية مقارنةً بالمعيار PVC. Hypalon تحافظ الأنابيب على المرونة في درجات الحرارة القصوى وتقاوم التدهور الناتج عن التعرض للوقود والزيت. يتم وضع جميع الدرزات يدويًا بواسطة فنيين معتمدين.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: أرضية سطح الهواء
    standard: نفخ الضغط العالي | يستبدل الخشب الرقائقي/الألومنيوم
    description: نظام أرضيات قابل للنفخ عالي الضغط يحل محل الأرضيات الخشبية التقليدية أو ألواح الألومنيوم. يقلل من وقت الإعداد والوزن الإجمالي وحجم التخزين مع توفير الصلابة الكافية للوقوف وصيد الأسماك والمشي. تم اختباره لدعم حمولة موزعة تزيد عن 200 كجم.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: أرضية هوائية (Air Deck)
