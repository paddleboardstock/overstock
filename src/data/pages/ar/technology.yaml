testimonial:
  quote: ما جعلني أقتنع هو البناء. لحامات اندماجية بدلاً من الغراء، نواة drop-stitch تبدو صلبة عند 15 PSI، ولا أي اهتزاز عندما أبتعد للدوران. بعد عامين، لا توجد مشاكل.
  author: مارتا كيلر
  title: مشتري مُحقق
  company: متجدفة جولات البحيرة
  location: ألمانيا
sections:
  - title: Drop-Stitch النواة
    standard: ضغط تشغيل 12-15 PSI
    description: آلاف الخيوط الداخلية من البوليستر تربط بين الطبقات العلوية والسفلية، مكونة هيكلًا صلبًا عند 12-15 PSI. هذه هي نفس التقنية المستخدمة في ألواح التجديف الاحترافية. كثافة drop-stitch لدينا محسنة حسب الموديل لتحقيق التوازن المثالي بين الصلابة والوزن.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: مخطط نواة DS
  - title: من الدرجة البحرية PVC
    standard: لحام اندماجي | UV / مقاوم للمياه المالحة / مقاوم للاهتراء
    description: قماش PVC متعدد الطبقات مصفوف وملتصق مصمم للبيئات البحرية. كل طبقة ملحومة بالاندماج بدلاً من اللصق، مما يلغي مخاطر انفصال الطبقات. تم اختباره لمقاومة UV (1,000+ ساعة)، التآكل بالمياه المالحة، والاهتراء.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: طبقة PVC
  - title: نظام سطح EVA
    standard: أنماط سلسلة الفن المريحة والممسوكة
    description: رغوة EVA كاملة على السطح توفر الامساك والتوسيد والمظهر المميز لسلسلة الفن. يتم وضع الألواح المقطوعة بدقة ضمن أنماط بدون فواصل — لا رسوم مطبوعة يمكن خدشها، ولا حاجة للشمع.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: سطح EVA
  - title: نظام حواف ثلاثي الطبقات
    standard: ملتصق بالاندماج | مبني بشكل زائد في منطقة الإجهاد الأعلى
    description: أشرطة السكك الحديدية ملتصقة بالاندماج ثلاثية الطبقات وملفوفة حول حافة اللوح — وهي منطقة الإجهاد الأعلى في أي لوح قابل للنفخ. هنا تفشل الألواح الرخيصة أولاً؛ لوحاتنا مبنية بشكل زائد.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: نظام السكك الحديدية
