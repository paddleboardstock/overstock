content_system:
  tagline: نظرة عامة على نظام مراقبة الجودة
  title: الجودة المتكاملة<br />إطار التحكم
  subtitle: يعمل نظام مراقبة الجودة لدينا بشكل مستقل عن الإنتاج ويقدم تقاريره مباشرة إلى الإدارة. لا يتم شحن أي دفعة دون إصدار جودة موقع من مختبر الجودة.
  items:
    - title: مختبر جودة مستقل
      description: مختبر الجودة لدينا يعمل كوظيفة مستقلة عن الإنتاج. مشرفو مراقبة الجودة يقدمون تقاريرهم إلى مدير الجودة، وليس إلى مدير الإنتاج. تضمن هذه الاستقلالية التنظيمية أن يتم اتخاذ قرارات الجودة بشكل موضوعي — حيث لا تطغى مواعيد الإنتاج على متطلبات الجودة.
      features:
        - يرفع تقاريره مباشرةً للإدارة، مستقلاً عن الإنتاج
        - مخول بوقف الإنتاج لأسباب تتعلق بالجودة
        - 12 مفتش جودة مخصص عبر جميع المراحل
        - جميع معدات الاختبار يتم معايرتها سنويًا
    - title: قابلية تتبع الدفعات
      description: يتم تخصيص رقم دفعة فريد لكل مجموعة من المواد الخام في نظام ERP الخاص بنا. من وصول المواد مرورًا بالإنتاج وصولاً إلى المنتج النهائي، ترتبط فاتورة المواد لكل لوحة بالدفعات الأصلية للموردين. هذا يتيح تتبع كامل للوراء لأي استفسار يتعلق بالجودة أو الامتثال.
      features:
        - تتبع الدُفعات المعتمد على ERP من المواد إلى المنتج النهائي
        - بطاقات الدفعة المادية على كل أمر عمل
        - تغطية المادة بنسبة 100% — PVC، drop-stitch، EVA رغوة، معدات، مواد لاصقة
        - الوثائق محفوظة لمدة 10 سنوات
    - title: إدارة الجودة
      description: تتبع إجراءات مراقبة الجودة لدينا بروتوكولات داخلية موثقة. يتم تسجيل نتائج الاختبارات، ويمكن تتبعها، ويتم مراجعتها من قبل مختبر الجودة المستقل لدينا. معدل خلو من العيوب بنسبة 99.3% عبر الشحنات خلال الاثني عشر شهرًا الماضية.
      features:
        - بروتوكولات مراقبة الجودة الداخلية الموثقة، يتم مراجعتها سنوياً
        - معدل خالٍ من العيوب بنسبة 99.3٪ عبر شحنات الأشهر الـ12 الماضية
        - صفر تسامح مع العيوب الحرجة للسلامة
        - الوثائق محفوظة لمدة 10 سنوات
content_inspection:
  tagline: مراحل الفحص
  title: ست مراحل<br />عملية التفتيش
  subtitle: يمر كل منتج بست مراحل فحص مع نقاط تحقق QC موثقة. يتم اكتشاف العيوب مبكرًا، وتتخذ الإجراءات التصحيحية فورًا، وكل دفعة قابلة للتتبع بالكامل.
  stages:
    - stage: '1'
      title: تفتيش المواد الواردة
      description: يتم تسجيل جميع المواد الواردة بواسطة رقم الدفعة / الرقم المسلسل وتوضع في حجر صحي حتى توقيع قسم مراقبة الجودة. PVC يتم اختبار بكرات القماش لقوة الشد، ومقاومة التمزق، والسماكة. Drop-stitch يتم فحص القلبات والصمامات والمواد اللاصقة والأدوات الميكانيكية بصريًا وقياسها مقارنة بالمواصفات.
      checks: قوة الشد، مقاومة التمزق، مقياس السمك، لزوجة اللاصق، مسح العيوب البصرية
      threshold: تم اختبار 100% من الدفعات. ارفض إذا كان الشد أقل من 90% من المواصفات، أو التمزق < الحد الأدنى للمواصفات، أو أي عيب بصري
    - stage: '2'
      title: مراقبة الجودة أثناء العملية — التقطيع والتحضير
      description: يتم فحص الألواح المقطوعة CNC من حيث الأبعاد مقابل ملفات CAD المصدرية لكل لوحة عشرين. يتم فحص جودة الحافة للتحقق من التمزق أو القطوع غير المستوية أو الانحرافات البعدية. يتم التحقق من عدد الألواح مقابل قائمة المواد لكل دفعة إنتاجية قبل نقل المواد إلى اللحام.
      checks: فحص الأبعاد مقابل ملفات CAD DXF، وفحص جودة الحافة، والتحقق من عدد اللوحات
      threshold: التحمل ±0.5مم. ارفض الدفعة إذا كان أكثر من 2% خارج التحمل
    - stage: '3'
      title: مراقبة الجودة أثناء العملية — اللحام والربط
      description: أثناء الإنتاج، يتم مراقبة جودة اللحام باستمرار. تُجرى اختبارات التقشير على العينات كل 50 وحدة. يُقاس عرض اللحام وفقًا للمواصفات. يتم مراجعة سجلات درجة حرارة الهواء الساخن للتحقق من الاتساق. يتم فحص كل غرزة بصريًا تحت الإضاءة الخلفية للكشف عن القنوات أو الفراغات.
      checks: اختبار التقشير لكل 50 وحدة، قياس عرض اللحام، مراجعة سجل درجة حرارة الهواء الساخن، فحص وصلة الإضاءة الخلفية
      threshold: قوة الالتصاق القصوى 8 نيوتن/سم. تحمل عرض اللحام ±1 مم. أي تآكل مرئي = رفض
    - stage: '4'
      title: مراقبة جودة التجميع
      description: يتبع كل وحدة قائمة فحص تجميع مكونة من 100 نقطة يتم توقيعها من قبل قائد الفريق. يتم اختبار وظيفة الصمام من خلال 10 دورات فتح/إغلاق. يتم التحقق من عزم الحلقة للأجهزة. يشمل الفحص البصري تشطيب السطح، اتساق اللون، وضع الملصق، واكتمال الملحقات.
      checks: قائمة فحص من 100 نقطة لكل وحدة، اختبار وظيفة الصمام، التحقق من عزم شد الأجهزة، الفحص البصري
      threshold: 'سياسة عدم وجود عيوب على العناصر الحرجة للسلامة (الصمامات، الحلقات D، المقابض). العيوب الطفيفة الجمالية: هدف خالٍ من العيوب بنسبة 99.3%'
    - stage: '5'
      title: اختبار الضغط
      description: يتم نفخ كل حجرة إلى 1.25× من الضغط المقدر وتُحافظ عليه لمدة 24-48 ساعة. تقوم حساسات الضغط بتسجيل مستمر طوال فترة الاحتفاظ. قراءة مع تعويض درجة الحرارة تضمن الدقة. أي حجرة يتجاوز انخفاض الضغط فيها 5% تُرفض وتُرسل لإعادة فحص اللحام مع إعادة اختبار 100% لكامل دفعة الإنتاج.
      checks: سجل الضغط لمدة 24-48 ساعة، التحقق من معايرة المستشعر يوميًا، قراءة مع تعويض درجة الحرارة، إعادة اختبار اللحام بعد الإصلاح
      threshold: انخفاض الضغط بحد أقصى 5٪ خلال 24 ساعة عند درجة حرارة مستقرة. تجاوز ذلك = إعادة اختبار 100٪ لكامل الدفعة
    - stage: '6'
      title: التفتيش النهائي وإطلاق الشحنة
      description: الفحص البصري والوظيفي النهائي قبل التعبئة. يتم فحص عيوب السطح، وتناسق اللون، والتحقق من الملصق/رمز الصندوق، وسلامة التعبئة، واكتمال الملحقات وفقًا لطلب العميل. تُعبأ الوحدات بالتفريغ الهوائي، وتوضَع في صناديق، وترص على منصات. يتطلب الحصول على توقيع قسم الرقابة النهائية على الجودة قبل خروج أي منتج من المصنع.
      checks: الفحص البصري الكامل، قائمة التحقق من الملحقات وفقًا لـ SKU، اختبار سقوط التغليف (عينة عشوائية بارتفاع 1 متر)، التحقق من مسح الملصق/الرمز الشريطي
      threshold: عدم التسامح مطلقاً مع عيوب السلامة. الهدف هو 99.3٪ خالٍ من العيوب. جميع الوحدات يتم فحصها بصرياً بنسبة 100٪
content_equipment:
  tagline: معدات الاختبار
  title: مختبر فحص الجودة<br />معدات
  subtitle: مختبر الجودة لدينا مجهز بمعدات اختبار متخصصة للتحقق من المواد وسلامة اللحام والتحقق من أداء المنتج.
  columns: 3
  items:
    - title: آلة اختبار الشد
      description: يقيس قوة شد القماش وتمددها وفقًا لبروتوكول الاختبار الداخلي. يُستخدم لفحص الجودة الواردة لجميع دفعات القماش PVC وdrop-stitch.
      icon: tabler:scale
    - title: غرفة الحرارة
      description: غرفة بيئية لاختبار مقاومة UV واختبار المرونة عند درجات الحرارة المنخفضة. تحاكي ظروف التشغيل القصوى.
      icon: tabler:temperature
    - title: أجهزة استشعار الضغط ومسجلات البيانات
      description: أجهزة استشعار الضغط الرقمية مع تسجيل بيانات مستمر لاختبارات احتجاز الهواء لمدة 24-48 ساعة. معوضة حرارياً من أجل الدقة.
      icon: tabler:wind
    - title: جهاز اختبار التقشير
      description: معدات اختبار التقشير المعايرة للتحقق من قوة اللحام. عينات عشوائية من كل دفعة إنتاج.
      icon: tabler:files
    - title: خزان كشف التسرب
      description: خزان ماء لاختبار التسرب تحت الماء للغرف المنفوخة. الكشف البصري عن الفقاعات للتحقق من سلامة اللحامات والصمامات.
      icon: tabler:ripple
    - title: أدوات الفحص
      description: أدوات القياس المعايرة — مقاييس السمك، مفاتيح عزم الدوران، المقاييس البعدية، مختبرات اختبار الصلابة لمحطات مراقبة الجودة في الإنتاج.
      icon: tabler:tools
content_metrics:
  tagline: أداء مراقبة الجودة
  title: مراقبة الجودة<br />المقاييس
  subtitle: بيانات النجاح/الفشل الحقيقية من خط الإنتاج لدينا. يتم مراقبة هذه المقاييس يوميًا ومراجعتها شهريًا من قبل الإدارة.
  columns: 3
  items:
    - title: تم اختبار 100% من الوحدات
      description: يتم اختبار كل غرفة في كل لوحة بالضغط قبل الشحن. لا يتم أخذ عينات — فحص 100٪ على سلامة الضغط.
      icon: tabler:check
    - title: <انخفاض الضغط أقل من 5%
      description: أقصى خسارة ضغط مسموح بها خلال 24-48 ساعة عند 1.25× الضغط المقدر. أي حجرة تتجاوز هذا الحد تُسبب إعادة اختبار الدفعة.
      icon: tabler:gauge
    - title: 99.3٪ خالية من العيوب
      description: نسبة الخلو من العيوب عبر شحنات الاثني عشر شهرًا الأخيرة. صفر تسامح بالنسبة للعيوب الحرجة للسلامة.
      icon: tabler:clipboard-check
    - title: احتجاز لمدة 24-48 ساعة
      description: تُحتفظ اللوحات لمدة 24-48 ساعة حسب الطراز والدفعة. تسجل حساسات الضغط باستمرار طوال مدة الاحتفاظ.
      icon: tabler:clock
    - title: 1.25× ضغط الاختبار
      description: هامش الأمان في كل غرفة — تم اختباره عند 25٪ فوق الضغط المقدر لضمان وجود هامش أعلى من ظروف التشغيل القصوى.
      icon: tabler:arrow-up
    - title: 0% عيوب السلامة
      description: سياسة عدم التسامح مطلقًا مع العيوب الحرجة للسلامة — الصمامات، حلقات D، اللحامات، وغرف الطفو. أي عيب = إعادة فحص بنسبة 100٪.
      icon: tabler:shield
