hero:
  tagline: مصفوفة حلول الصناعة
  title: الحلول البحرية القائمة على السيناريوهات<br />للعمليات الاحترافية
  subtitle: قوارب مائية قابلة للنفخ وضلعات RIB مصممة خصيصًا لهذا الغرض وتم تكوينها لأغراض الإنقاذ، وأسطول الإيجار، ومناقصات اليخوت، وتطبيقات الصيد التجاري - كل منها مدعوم بالمواصفات الفنية وخيارات التخصيص.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock حلول بحرية احترافية للصناعات المتنوعة
direct_answer: 'توفر Paddle Board Overstock حلولاً للمركبات المائية القابلة للنفخ وحلول RIB للعمليات البحرية التجارية: قوارب الإنقاذ والدوريات مع أنابيب Hypalon المعززة والسلامة متعددة الغرف، وأسطول تأجير SUPs وزوارق الكاياك مع طبقات PVC ملحومة بالهواء الساخن مقاس 1.2 مم من أجل متانة منخفضة الصيانة، ومناقصات اليخوت الفاخرة مع أضلاع هيكل من الألومنيوم العميق على شكل حرف V، وتكوينات صيد للخدمة الشاقة مع حاملات القضبان وأنظمة العيش.'
solution_a:
  tagline: الحل أ
  title: الإنقاذ البحري والدوريات التجارية
  subtitle: أضلاع RIBs آمنة عالية السرعة ومتعددة الغرف للاستجابة المهنية لحالات الطوارئ وعمليات إنفاذ القانون.
  badge: Heavy-Duty Series
  description: تم تصنيع أضلاع الإنقاذ والدوريات البحرية الخاصة بنا باستخدام أنابيب هواء معززة من مادة Hypalon/PVC عالية الكثافة تتميز بتصميم تعويم مستقل متعدد الغرف. وقد تم تجهيز كل سفينة بشريط عاكس من الدرجة الاحترافية، وخطوط انتزاع الإنقاذ، وصمامات النفخ السريع للاستعداد للنشر. توفر هياكل الألياف الزجاجية Deep-V استقرارًا استثنائيًا عند السرعات العالية وفي ظروف البحر القاسية.
  features:
    - title: سلامة متعددة الغرف
      description: 4-6 غرف هواء مستقلة - أي ثقب في حجرة واحدة يحافظ على التعويم الإيجابي
    - title: نسيج أنبوبي مقوى
      description: 1.2 ملم Hypalon CSM أو 1,680 DTEX PVC مع طبقات مزدوجة ملحومة بالهواء الساخن
    - title: الدرجة المهنية
      description: شريط SOLAS العاكس، وخطوط انتزاع الإنقاذ، ومرابط السحب، وخط الرسام سريع التحرير
    - title: بدن عالي السرعة
      description: هيكل من الألياف الزجاجية أو الألومنيوم على شكل حرف V مُقدر بـ 25-45 عقدة حسب التكوين
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: مادة هال
      value: الألياف الزجاجية / الألومنيوم البحري
    - label: نسيج الأنبوب
      value: 1.2 ملم هيبالون CSM / 1,680 DTEX PVC
    - label: السرعة القصوى
      value: 25-45 عقدة
    - label: سعة
      value: 6-12 شخص
    - label: نطاق المحرك
      value: 40-200 حصان
    - label: شهادة
      value: سي / إسو 9001
solution_b:
  tagline: الحل ب
  title: تأجير الرياضات المائية ومعدات أسطول المنتجعات
  subtitle: سفن SUP وزوارق الكاياك والقوارب القابلة للنفخ فائقة المتانة ومنخفضة الصيانة مصممة للاستخدام اليومي للإيجار في المنتجعات والنوادي والعمليات السياحية.
  badge: Rental-Grade
  description: تم تصميم معدات أسطول الإيجار لدينا لتحقيق أعلى مستويات المتانة وأقل تكلفة للصيانة. نحن نستخدم بولي كلوريد الفينيل المقوى بسمك 1.2 مم مع تقنية التماس الملحومة بالهواء الساخن ثلاثية الطبقات التي تقاوم التدهور الناتج عن الأشعة فوق البنفسجية والأضرار المتكررة عند الاصطدام. يضمن البناء ذو الغرز المنسدل الحفاظ على صلابة الألواح حتى بعد مئات دورات الإيجار. تتميز جميع الطرازات بحلقات على شكل حرف D معززة، وأشرطة قضبان مقاومة للتآكل، وصمامات من الدرجة التجارية.
  features:
    - title: PVC من الدرجة التجارية
      description: بولي كلوريد الفينيل المقوى بسمك 1.2 مم مع مثبتات للأشعة فوق البنفسجية - أكثر سمكًا بمقدار 3 مرات من المواد الاستهلاكية
    - title: طبقات ملحومة بالهواء الساخن
      description: لحام دمج ثلاثي الطبقات - أقوى من الترابط اللاصق، ويقاوم التصفيح
    - title: قطرة غرزة صلابة
      description: 1,680 نواة DTEX مع خيطين/بوصة مربعة - مصنفة إلى 20 رطل لكل بوصة مربعة لصلابة تشبه الألواح الصلبة
    - title: تصميم جاهز للأسطول
      description: حلقات على شكل حرف D معززة، وصمامات Halkey-Roberts التجارية، وأشرطة قضبان مقاومة للتآكل
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: مادة الأنبوب
      value: 1.0-1.2 ملم من البولي فينيل كلوريد المقوى
    - label: تكنولوجيا التماس
      value: لحام ثلاثي الطبقات بالهواء الساخن
    - label: أقصى ضغط
      value: 15-20 رطل لكل بوصة مربعة (نماذج الغرز المنسدل)
    - label: مقاومة الأشعة فوق البنفسجية
      value: أكثر من 1000 ساعة من الاختبار المتسارع
    - label: ضمان
      value: من 2 إلى 5 سنوات حسب الموديل
    - label: صيانة
      value: الحد الأدنى - اشطفه وخزنه
solution_c:
  tagline: الحل ج
  title: مناقصات اليخوت والمراكب المائية الفاخرة
  subtitle: مناقصات RIB خفيفة الوزن وعالية الأداء مصممة لتخزين اليخوت الفاخرة ونقل الضيوف بملاءمة وتشطيبات فاخرة.
  badge: Premium Series
  description: تجمع أضلاع اليخت الخاصة بنا بين البناء خفيف الوزن والجماليات الفاخرة. توفر هياكل الألمنيوم أو الألياف الزجاجية العميقة على شكل حرف V جودة قيادة استثنائية وسهولة رفع الرافعة. متوفر برسومات أنبوبية متطابقة الألوان، وتنجيد ممتاز، وتخطيطات مخصصة لوحدة التحكم. أبعاد التخزين المدمجة تجعلها مثالية لجراجات اليخوت الفاخرة وتخزين سطح السفينة.
  features:
    - title: بناء خفيف الوزن
      description: تعمل هياكل الألومنيوم البحرية على تقليل الوزن بنسبة 30% مقارنة بالألياف الزجاجية لسهولة الرفع
    - title: أداء عميق على شكل حرف V
      description: بدن يبلغ ارتفاعه 18-22 درجة لركوب سلس في الفرم وتتبع ممتاز
    - title: ملاءمة وتشطيب فاخر
      description: تنجيد مخصص، وأنابيب مطابقة الألوان، ووحدة تحكم ممتازة في القيادة، وحزمة مقاومة للصدأ
    - title: تخزين مدمج
      description: مصممة لجراجات اليخوت الفاخرة – أنابيب قابلة للنفخ للتخزين المدمج
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: نوع الهيكل
      value: الألومنيوم العميق / الألياف الزجاجية
    - label: الموت
      value: 18-22 درجة
    - label: السرعة القصوى
      value: 30-40 عقدة
    - label: الوزن الجاف
      value: 120-350 كجم (هيكل من الألومنيوم)
    - label: رافعة دافيت جاهزة
      value: نعم — نقاط الرفع قياسية
    - label: تخزين
      value: أنابيب قابلة للنفخ، قابلة للتكديس
