hero:
  tagline: مركز الهيئة
  title: لماذا Paddle Board Overstock؟<br />ثقة بُنيت على مدى عقد من الزمن
  subtitle: كل لوح نصنعه يحمل وزن 10+ سنوات من الهندسة البحرية، ومراقبة الجودة الصارمة، وآلاف من مستخدمي المجذاف حول العالم. لهذا السبب يختار المجدفون Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock منشأة تصنيع بحرية وفريق هندسي
