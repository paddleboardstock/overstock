hero:
  tagline: مركز الهيئة
  title: لماذا Aquafarer؟<br />ثقة بنيت على مدى عقد من الزمن
  subtitle: يحمل كل قارب نبنيه ثقل أكثر من 10 سنوات من الهندسة البحرية وأنظمة الجودة المعتمدة وآلاف العمليات الناجحة في جميع أنحاء العالم. ولهذا السبب يختار محترفو الصناعة Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: منشأة التصنيع البحرية Aquafarer وفريق الهندسة
