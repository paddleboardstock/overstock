features3_brand:
  tagline: من نحن
  title: مؤسسة العلامة التجارية<br />والتراث
  subtitle: القصة والخبرة والنطاق العالمي الذي يميز Paddle Board Overstock كعلامة تجارية موثوقة SUP.
  isBeforeContent: false
  columns: 3
  items:
    - title: حول Paddle Board Overstock
      description: تأسست في 2012 في ويهاي، الصين. من ورشة ساحلية إلى منشأة بمساحة 12,000 م² — القصة الكاملة لـ Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: قصة العلامة التجارية
      description: كيف شرع فريق من المهندسين البحريين لجعل ألواح التجديف القابلة للنفخ باحترافية متاحة في جميع أنحاء العالم.
      icon: tabler:book
      link: /brand-story
    - title: خبرة الصناعة البحرية
      description: علم المواد المتطور، التصنيع الدقيق، والاختبار الواقعي — عقود من الهندسة البحرية في كل لوح.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Why Paddle Board Overstock
      description: ما يميزنا — الجودة، التخصيص، الأسعار المباشرة من المصنع، والدعم الشامل لكل مجدف.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: فريقنا
      description: تعرف على القيادة — مهندسو بحار، علماء مواد، وخبراء تصنيع يقودون Paddle Board Overstock إلى الأمام.
      icon: tabler:users
      link: /brand/team
    - title: الفريق الهندسي
      description: 78+ سنة مجتمعة في البحث والتطوير، 40+ منصة، 1,200+ مشروع هندسي. الفريق الفني وراء كل منتج.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: الثقة والجودة
  title: الجودة، الاختبار<br />والدليل
  subtitle: اختبارات صارمة، بيانات اختبار واقعية، وأدلة تثبت التزامنا بالجودة.
  isBeforeContent: false
  columns: 3
  items:
    - title: الجودة والاختبار
      description: كل منتج يُجرى عليه اختبار الضغط قبل الشحن. قوة اللحام، مقاومة UV، الطفو — تم التحقق منها في كل مرحلة.
      icon: tabler:clipboard-check
      link: /quality
    - title: الدليل والبرهان
      description: نتائج الاختبارات، صور النشر، تقارير التفتيش من طرف ثالث، ودراسات حالة تُثبت جودة Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: الرسم البياني المعرفي
      description: استكشف رسم كيان Paddle Board Overstock — المنتجات، التقنيات، المواد، والعلاقات في قاعدة معرفة مترابطة.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: قيادة
  title: تعرف على الفريق<br />وراء Paddle Board Overstock
  subtitle: خبرة صناعية تمتد إلى الهندسة البحرية، علم المواد، إدارة الجودة، والتجارة الإلكترونية العالمية.
  isBeforeContent: false
  columns: 3
  items:
    - title: توبى ليو — المؤسس والرئيس التنفيذي
      description: 15+ سنة في التصنيع البحري. سبق أن قاد البحث والتطوير في شركة تصنيع بحرية صينية كبرى. حاصل على براءات اختراع متعددة في تصميم المنتجات القابلة للنفخ.
      icon: tabler:crown
    - title: تشانغ وي - كبير المهندسين
      description: 20+ سنة في تصنيع البوليمرات وتصميم الهياكل القابلة للنفخ. قام سابقًا بمنصب المدير التقني في شركة هندسة بحرية أوروبية.
      icon: tabler:engine
    - title: تشن مينغ – رئيس قسم البحث والتطوير
      description: دكتوراه في علم المواد. متخصص في تكنولوجيا drop-stitch واللحام عالي التردد. 10+ سنوات في المركبات النسيجية.
      icon: tabler:flask
    - title: ليو تشيانغ - مدير الإنتاج
      description: 18+ سنة في التصنيع الرشيق. نفذ أنظمة جودة صارمة عبر جميع خطوط الإنتاج.
      icon: tabler:settings
    - title: وانغ فانغ – مدير الجودة
      description: 12+ سنوات في مراقبة جودة المنتجات البحرية. يقود عمليات تدقيق الجودة الداخلية. يشرف على الاختبارات لكل دفعة إنتاج.
      icon: tabler:shield-check
    - title: هيلين لي - مدير المبيعات
      description: 15+ عامًا في التجارة الإلكترونية الدولية والخدمات اللوجستية. يقوم بشحن الألواح للمتجدفين في 50+ دولة. يجيد 4 لغات بطلاقة.
      icon: tabler:briefcase
