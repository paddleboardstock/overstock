features3_brand:
  tagline: من نحن
  title: مؤسسة العلامة التجارية<br />والتراث
  subtitle: القصة والخبرة والانتشار العالمي هي التي تحدد Aquafarer كشركة مصنعة موثوقة للمعدات البحرية.
  isBeforeContent: false
  columns: 3
  items:
    - title: حول أكوافارير
      description: تأسست عام 2012 في مدينة تشينغداو، الصين. من ورشة ساحلية إلى منشأة بمساحة 12000 متر مربع - قصة Aquafarer الكاملة.
      icon: tabler:building-factory
      link: /about
    - title: قصة العلامة التجارية
      description: كيف شرع فريق من المهندسين البحريين في جعل المركبات المائية القابلة للنفخ ذات المستوى الاحترافي متاحة في جميع أنحاء العالم.
      icon: tabler:book
      link: /brand-story
    - title: خبرة الصناعة البحرية
      description: علوم المواد العميقة، والتصنيع الدقيق، والاختبارات الواقعية - عقود من الهندسة البحرية في كل هيكل.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: الحضور العالمي
      description: نخدم أكثر من 50 دولة في كل قارة. الخبرة الإقليمية للمتطلبات التنظيمية المحلية وتفضيلات السوق.
      icon: tabler:globe
      link: /brand-global-presence
    - title: لماذا أكوافارير
      description: ما يميزنا هو الجودة والتخصيص وتسعير المصنع المباشر والدعم الشامل للمشغلين التجاريين.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: فريقنا
      description: تعرف على القيادة - المهندسين البحريين، وعلماء المواد، وخبراء التصنيع الذين يقودون Aquafarer إلى الأمام.
      icon: tabler:users
      link: /brand/team
    - title: الفريق الهندسي
      description: أكثر من 78 عامًا من البحث والتطوير المشترك، وأكثر من 40 منصة، و12 شهادة، وأكثر من 1200 مشروع تصنيع المعدات الأصلية. الفريق الفني وراء كل منتج.
      icon: tabler:engine
      link: /engineering-team
    - title: مركز البحث والتطوير
      description: هندسة الهيكل، واللحام بالترددات اللاسلكية، ومختبر PVC، والنماذج الأولية، وخزان الاختبار، ومختبر الجودة - منشأتنا الكاملة للبحث والتطوير.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: الثقة والجودة
  title: الشهادات والجودة <br /> والإثبات
  subtitle: الشهادات المستقلة والاختبارات الصارمة والأدلة الحقيقية التي تثبت التزامنا بالجودة.
  isBeforeContent: false
  columns: 3
  items:
    - title: الشهادات
      description: CE، ISO 9001، UKCA، BSCI، REACH — وثائق الشهادات الكاملة والامتثال للأسواق العالمية.
      icon: tabler:shield-check
      link: /certifications
    - title: الجودة والاختبار
      description: تم اختبار ضغط كل منتج قبل الشحن. قوة التماس، ومقاومة الأشعة فوق البنفسجية، والطفو - يتم التحقق منها في كل مرحلة.
      icon: tabler:clipboard-check
      link: /quality
    - title: الدليل والبرهان
      description: نتائج الاختبار، وصور النشر، وتقارير فحص الطرف الثالث، ودراسات الحالة التي تثبت جودة Aquafarer.
      icon: tabler:file-check
      link: /evidence
    - title: الرسم البياني المعرفي
      description: استكشف الرسم البياني لكيان Aquafarer - المنتجات والتقنيات والشهادات والعلاقات في قاعدة معرفية متصلة.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: قيادة
  title: تعرف على الفريق<br />الذي يقف خلف Aquafarer
  subtitle: خبرة صناعية تشمل الهندسة البحرية وعلوم المواد وإدارة الجودة والتجارة العالمية بين الشركات.
  isBeforeContent: false
  columns: 3
  items:
    - title: توبي ليو - المؤسس والرئيس التنفيذي
      description: أكثر من 15 عامًا في التصنيع البحري. سبق له أن قاد البحث والتطوير في شركة صينية كبرى لتصنيع القوارب. حاصل على براءات اختراع متعددة في تصميم القارب القابل للنفخ.
      icon: tabler:crown
    - title: تشانغ وي - كبير المهندسين
      description: أكثر من 20 عامًا في تصنيع PVC / Hypalon وتصميم الهيكل العميق. مدير فني سابق في شركة الهندسة البحرية الأوروبية.
      icon: tabler:engine
    - title: تشن مينغ – رئيس قسم البحث والتطوير
      description: دكتوراه في علم المواد. متخصص في تكنولوجيا الغرز المتساقطة واللحام عالي التردد. 10+ سنوات في مركبات النسيج.
      icon: tabler:flask
    - title: ليو تشيانغ - مدير الإنتاج
      description: أكثر من 18 عامًا في التصنيع الهزيل. الحزام الأسود في ستة سيجما. تطبيق أنظمة الجودة ISO 9001 في جميع خطوط الإنتاج.
      icon: tabler:settings
    - title: وانغ فانغ – مدير الجودة
      description: أكثر من 12 عامًا في مراقبة الجودة البحرية. مدقق معتمد من CE وISO. يشرف على الاختبار لكل دفعة إنتاج.
      icon: tabler:shield-check
    - title: هيلين لي - مدير المبيعات
      description: أكثر من 15 عامًا في التجارة الدولية B2B. إدارة شراكات OEM/ODM في أكثر من 30 دولة. يجيد 4 لغات.
      icon: tabler:briefcase
cta:
  title: هل تريد التحقق من بيانات اعتمادنا؟
  subtitle: اتصل بنا للحصول على نسخ الشهادات، أو تقارير التفتيش من طرف ثالث، أو لتحديد موعد لزيارة المصنع.
  actions:
