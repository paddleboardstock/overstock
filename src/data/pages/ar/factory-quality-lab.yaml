hero:
  tagline: مختبر ضبط الجودة
  title: مختبر الاختبارات وضمان الجودة
  subtitle: مختبر جودة مستقل بعمليات ISO 9001 — يتم اختبار كل وحدة قبل الشحن

intro: تشغل Aquafarer مختبراً مخصصاً لضبط الجودة يعمل بشكل مستقل عن الإنتاج. تخضع كل دفعة من المواد الخام وكل قارب مكتمل لبروتوكولات فحص موثقة قبل الإفراج عنها. يرفع فريق QC تقاريره مباشرة إلى الإدارة، بما يضمن قرارات جودة غير منحازة.

highlights:
  - value: 100%
    label: وحدات مختبَرة بالضغط
    detail: كل حجرة، كل قارب
  - value: 48 h
    label: مدة اختبار الاحتفاظ بالهواء
    detail: عند 1.25× من الضغط الاسمي
  - value: '&lt;5%'
    label: أقصى هبوط مسموح للضغط
    detail: خلال فترة ثبات مدتها 24 ساعة
  - value: AQL 2.5
    label: حد العيوب الرئيسية
    detail: حسب أخذ العينات ISO 2859

test_procedures:
  - title: فحص المواد الخام
    description: تُختبر كل دفعة واردة من PVC وHypalon وقماش drop-stitch والتجهيزات المعدنية قبل قبولها. يتم التحقق من مقاومة الشد (ASTM D751) ومقاومة التمزق (ISO 4674) ومقاومة الأشعة فوق البنفسجية. توضع المواد غير المطابقة في الحجر وتُرجع.
    standards:
      - ASTM D751 (الشد)
      - ISO 4674 (التمزق)
      - ISO 4892 (UV)
  - title: نقاط تدقيق QC أثناء الإنتاج
    description: يجري مشغلو الإنتاج فحصاً ذاتياً في كل مرحلة. يقوم مدققو QC بأخذ عينات عشوائية طوال الوردية. تُجرى اختبارات تقشير اللحام كل 50 وحدة. وتتم الفحوصات البعدية كل 20 لوحاً.
    standards:
      - ASTM D751 (التقشير)
      - قائمة تحقق داخلية من 100 نقطة
      - أخذ العينات وفق ISO 2859
  - title: اختبار الاحتفاظ بالهواء لمدة 48 ساعة
    description: تُنفخ كل حجرة من أنبوب القارب حتى 125% من الضغط الاسمي وتُحفظ لمدة 48 ساعة. تسجّل مجسات الضغط باستمرار مع تعويض درجة الحرارة. أي حجرة يتجاوز هبوط ضغطها 5% تفعّل إعادة فحص تلقائية للدفعة.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: اختبار الحمل والتوازن
    description: تُختبر القوارب المكتملة عند السعة الاسمية القصوى من حيث الثبات والارتفاع فوق خط الماء وسهولة القيادة. تخضع كل سفينة لاختبار في الماء قبل الاعتماد في الفحص النهائي.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: آلة اختبارات شاملة (الشد)
    spec: 5 kN، متوافقة مع ASTM D751
  - name: جهاز اختبار تلاشي الضغط
    spec: متعدد القنوات، 0–50 psi، مع تسجيل بيانات
  - name: غرفة اختبار التعرض للأشعة فوق البنفسجية
    spec: ISO 4892، دورات 1,000 ساعة
  - name: مقياس سماكة (رقمي)
    spec: دقة 0.01 مم
  - name: جهاز اختبار التقشير (لحام)
    spec: بمحرك، بسعة 50 N
  - name: غرفة حرارية
    spec: "-40 °C إلى +100 °C"
  - name: خزان كشف التسريبات
    spec: 6 م × 2 م، مضاء
