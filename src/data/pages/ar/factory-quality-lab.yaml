hero:
  tagline: مختبر مراقبة الجودة
  title: مختبر الاختبارات وضمان الجودة
  subtitle: مختبر جودة مستقل — كل وحدة تُختبر قبل الشحن
intro: Paddle Board Overstock يدير مختبر مراقبة جودة مخصص يعمل بشكل مستقل عن الإنتاج. كل دفعة من المواد الخام وكل لوحة تامة تمر عبر بروتوكولات تفتيش موثقة قبل الإطلاق. يقوم فريق مراقبة الجودة لدينا بالتقرير مباشرة للإدارة، مما يضمن اتخاذ قرارات جودة نزيهة.
highlights:
  - value: 100%
    label: تم اختبار الضغط على الوحدات
    detail: كل غرفة، كل لوحة
  - value: 48 h
    label: مدة اختبار احتفاظ الهواء
    detail: عند 1.25× الضغط المقدر
  - value: <5%
    label: أقصى انخفاض مسموح بالضغط
    detail: خلال فترة الاحتفاظ 24 ساعة
  - value: 99.3%
    label: معدل خلو العيوب
    detail: الشحنات الـ 12 شهر الماضية
test_procedures:
  - title: تفتيش المواد الخام
    description: يتم اختبار كل دفعة واردة من PVC، قماش drop-stitch، رغوة EVA، والأجهزة قبل القبول. يتم التحقق من قوة الشد، مقاومة التمزق، ومقاومة UV. تُحجز المواد غير المطابقة ويتم إرجاعها.
    standards:
      - قوة الشد (350 نيوتن/سم كحد أدنى)
      - مقاومة التمزق
      - مقاومة UV (1,000 ساعة)
  - title: نقاط فحص مراقبة الجودة خلال العملية
    description: يقوم مشغلو الإنتاج بفحص ذاتي في كل مرحلة. يقوم مراجعي الجودة بأخذ عينات عشوائية طوال الوردية. يتم إجراء اختبارات تقشير اللحام كل 50 وحدة. تحدث الفحوصات البُعدية لكل لوحة 20.
    standards:
      - اختبار التقشير كل 50 وحدة
      - قائمة فحص داخلية من 100 نقطة
      - مراجعات عينات عشوائية
  - title: اختبار احتفاظ الهواء لمدة 48 ساعة
    description: يتم نفخ كل غرفة أنبوبية إلى 125% من الضغط المقدر وتُحفظ لمدة 48 ساعة. تقوم أجهزة استشعار الضغط بالتسجيل المستمر مع تعويض الحرارة. أي غرفة تتجاوز انخفاض ضغط 5% تؤدي إلى إعادة فحص الدفعة تلقائيًا.
    standards:
      - الاحتفاظ عند 1.25x الضغط المقدر
      - <5% الحد الأقصى لانخفاض الضغط
  - title: اختبار الحمل والتوازن
    description: تُختبر اللوحات المكتملة عند الحد الأقصى للقدرة المقررة للتحقق من الاستقرار، الخلو من المياه، وسهولة التعامل. تمر كل لوحة باختبار المياه قبل الموافقة على الفحص النهائي.
    standards:
      - التحقق من التحميل عند 1.25x المقدار المقدر
      - اختبار المياه
equipment:
  - name: آلة الاختبار الشاملة (شد)
    spec: سعة 5 كيلو نيوتن
  - name: جهاز اختبار تدهور الضغط
    spec: متعدد القنوات، 0–50 رطل/بوصة²، تسجيل البيانات
  - name: UV غرفة التحمل للطقس
    spec: UVA-340، دورات لمدة 1000 ساعة
  - name: جهاز قياس السمك (رقمي)
    spec: دقة 0.01 مم
  - name: جهاز اختبار التقشير (لحام)
    spec: محرك، سعة 50 نيوتن
  - name: غرفة الحرارة
    spec: -40 °م إلى +100 °م
  - name: خزان كشف التسرب
    spec: 6 م × 2 م، مضاءة
