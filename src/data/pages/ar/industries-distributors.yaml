content_segments:
  tagline: الملفات الشخصية للشركاء
  title: نماذج شراكة التوزيع<br />حسب نوع الشريك
  subtitle: يجلب الموزعون المختلفون نقاط قوة مختلفة في السوق - البنية التحتية الإقليمية، أو الوصول إلى التجارة الإلكترونية، أو البيع بالتجزئة المتخصصة، أو المحافظ متعددة العلامات التجارية. نحن ننظم شروط الشراكة ومستويات التسعير ومستويات الدعم لتتناسب مع ملف تعريف كل شريك.
  items:
    - title: الموزعين البحريين الإقليميين
      subtitle: التوزيع B2B الحصري للمنطقة
      description: موزعون راسخون يتمتعون ببنية تحتية للمستودعات وشبكات الوكلاء وقدرات لوجستية يخدمون التجار البحريين وتجار التجزئة للرياضات المائية ومشغلي التأجير داخل منطقة جغرافية محددة. أنت بحاجة إلى خط إنتاج كامل وأسعار محمية والقدرة على خدمة حسابات التجار بالمخزون والدعم المحلي.
      features:
        - حماية حصرية للإقليم مع شروط التزام أدنى
        - أسعار جملة على كامل الكتالوج مع حوافز فصلية حسب الحجم
        - برنامج أمانة مخزون محلي لأصناف SKU سريعة الحركة
        - تدريب شبكة الوكلاء وبرامج تسويق بالعلامة المشتركة
    - title: التجارة الإلكترونية وتجار التجزئة عبر الإنترنت
      subtitle: قنوات التوزيع الرقمية الأولى
      description: يبيع تجار التجزئة عبر الإنترنت معدات الرياضات المائية من خلال Amazon أو eBay أو منصات التجارة الإلكترونية الخاصة بهم. تعد سرعة الوصول إلى السوق، والأسعار التنافسية، والخدمات اللوجستية المباشرة للمستهلك أمرًا بالغ الأهمية. أنت بحاجة إلى شريك يمكنه تسليم الطلبات الفردية تحت علامتك التجارية مع تحقيق سريع وبدون مخاطر تتعلق بالمخزون.
      features:
        - 'برنامج الشحن المباشر: تنفيذ الطلبات من المصنع مباشرة بعلامتكم التجارية'
        - تغذية مخزون فورية عبر API لمنصة التجارة الإلكترونية الخاصة بكم
        - تكامل مع Amazon Seller Central ودعم EAN/UPC
        - لوجستيات الإرجاع ومعالجة مطالبات الضمان مشمولة
    - title: تجار التجزئة المتخصصين في الرياضات المائية
      subtitle: شركاء صالة عرض الطوب وقذائف الهاون
      description: متاجر بيع بالتجزئة فعلية متخصصة في معدات الرياضات المائية - تخدم هواة التجديف والصيادين وراكبي القوارب المحليين من خلال المبيعات الشخصية والعروض التوضيحية وخدمة ما بعد البيع. أنت بحاجة إلى التعبئة والتغليف المُحسّنة للبيع بالتجزئة، وبرامج الوحدات التجريبية، ومواد نقاط البيع التي تعمل على تحويل العملاء الدائمين.
      features:
        - 'برنامج وحدات العرض: ألواح عرض صالة العرض بأسعار مخفضة'
        - تغليف جاهز للتجزئة بتصميم صناديق محسّن للأرفف
        - حوامل عرض نقاط البيع وجداول المقارنة وأدلة الشراء
        - تدريب موظفي المتجر وبرنامج اعتماد
    - title: موزعون متعددو العلامات التجارية والمتاجر
      subtitle: توزيع السلع الرياضية على نطاق واسع
      description: موزعون على نطاق واسع يخدمون المتاجر الكبرى وتجار التجزئة الكبار وسلاسل السلع الرياضية التي تحتوي على كتالوجات متعددة العلامات التجارية. يعد الاتساق ووثائق الامتثال وامتثال البائع أمرًا بالغ الأهمية - يجب أن يفي كل SKU بمعايير التغليف والملصقات والجودة الخاصة ببائعي التجزئة.
      features:
        - 'وثائق الامتثال للمتاجر: مواصفات التغليف والباركود والملصقات'
        - تكامل EDI/ASN لأنظمة الطلب لدى كبرى المتاجر
        - مخزون مُدار من المورّد وبرامج تجديد تلقائي
        - إدارة حساب مخصصة مع SLA استجابة خلال 24 ساعة
