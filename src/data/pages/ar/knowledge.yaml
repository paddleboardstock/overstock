hero:
  tagline: الرسم البياني المعرفي
  title: معرفة استكشاف المياه
  subtitle: |
    قاعدة معرفية منظمة تغطي تقنية SUP القابلة للنفخ,<br />
    سلامة المياه، هندسة الألواح، وتخطيط المغامرات.
  taglineSection: استكشف. تعلّم. انطلق بثقة.
clusters:
  tagline: مجموعات المعرفة
  title: استكشف حسب الموضوع
  subtitle: غوص عميق في التكنولوجيا والسلامة والمهارات وراء كل منتج Paddle Board Overstock.
  items:
    - title: SUP المعرفة
      description: من اختيار لوحك الأول إلى تقنيات التجوال المتقدمة — كل شيء عن التجديف بالوقوف على اللوح.
      icon: tabler:lifebuoy
      topics:
        - كيفية اختيار أول SUP قابل للنفخ
        - أفضل حجم SUP للمبتدئين
        - ما مدى صعوبة ركوب اللوح المجداف؟
        - مقارنة بين القارب القابل للنفخ واللوح الصلب
        - قائمة التحقق من السلامة SUP
    - title: تكنولوجيا اللوحات
      description: الغوص التقني العميق في نوى drop-stitch، صفائح PVC، القضبان، والصمامات — كيف يتم تصميم SUPs القابلة للنفخ.
      icon: tabler:anchor
      topics:
        - كيف تُصنع SUPs القابلة للنفخ
        - PVC شرح طبقات الل laminate
        - بناء السكة والخياطة
        - Drop-stitch الغوص العميق في التكنولوجيا
        - شرح فن مجموعة الورق EVA
    - title: معرفة السلامة
      description: المعرفة الأساسية بالسلامة لكل من يركب الزوارق — من اختيار PFD إلى قراءة الطقس إلى تقنيات الإنقاذ الذاتي.
      icon: tabler:shield
      topics:
        - قائمة التحقق من السلامة SUP
        - هل تحتاج إلى سترة نجاة؟
        - دليل سلامة التجديف في المحيط
        - سلامة الأنهار والتيارات للمتجدفين
        - الوعي بحالة الطقس والمياه
    - title: تكنولوجيا
      description: الهندسة وراء منتجات Paddle Board Overstock — المواد، وطرق البناء، واختبارات الجودة.
      icon: tabler:microscope
      topics:
        - تكنولوجيا بدرجة البحرية PVC
        - شرح نواة Drop-stitch
        - لماذا PSI مهم لـ SUPs القابلة للنفخ
        - اللحام بالراديو فرك مقابل الربط باللاصق
        - اختبار الجودة على كل لوح
    - title: معرفة الأندية والتأجير
      description: أدلة عملية لإدارة برنامج SUP — من عمليات التأجير إلى أساطيل المنتجعات والأندية.
      icon: tabler:briefcase
      topics:
        - كيف تبدأ مشروع تأجير SUP
        - بناء مركز للرياضات المائية بالمنتجع
        - تحجيم أسطول ألواح التجديف للأندية
        - نفخ مقابل الصلب SUP للاستخدام التجاري
        - أفضل ألواح SUP لأساطيل التأجير
        - استراتيجيات إيرادات الرياضات المائية في المنتجع
        - دليل صيانة المعدات التجارية
