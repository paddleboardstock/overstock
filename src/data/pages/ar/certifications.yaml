hero:
  tagline: الشهادات والمعايير
  title: 'شهادات الجودة<br />ومعايير الامتثال'
  subtitle: 'تُصنع منتجات Paddle Board Overstock بما يتوافق مع معايير السلامة البحرية الدولية وأنظمة إدارة الجودة واللوائح البيئية.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: شهادات الجودة ووثائق المطابقة من Paddle Board Overstock
content_certifications:
  tagline: شهاداتنا
  title: 'جودة معتمدة،<br />ومعترف بها عالميًا'
  subtitle: '64 طرازًا معتمدًا من CE وشهادات على مستوى المصنع تُظهر التزامنا بالجودة والسلامة والمسؤولية البيئية.'
  items:
    - title: 'شهادة CE'
      description: 'تلتزم 64 طرازًا معتمدًا من CE بمتطلبات علامة CE الأوروبية للقوارب الترفيهية، مما يضمن استيفاء معايير السلامة والصحة والحماية البيئية.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'نظام إدارة الجودة لدينا معتمد وفق ISO 9001:2015، ويغطي تصميم وتصنيع وتوزيع القوارب القابلة للنفخ والمعدات البحرية.'
      icon: tabler:clipboard-check
    - title: 'علامة UKCA'
      description: 'تحمل المنتجات المباعة في السوق البريطانية علامة UKCA، مؤكدةً الامتثال للوائح المملكة المتحدة للمعدات البحرية والقوارب الترفيهية.'
      icon: tabler:shield
    - title: 'متوافق مع BSCI'
      description: 'تخضع Paddle Board Overstock لتدقيق BSCI (مبادرة الامتثال الاجتماعي للأعمال)، مما يُظهر ممارسات تصنيع أخلاقية وظروف عمل عادلة ومسؤولية في سلسلة التوريد.'
      icon: tabler:heart-handshake
    - title: 'متوافق مع REACH'
      description: 'تلتزم جميع المواد المستخدمة في منتجات Paddle Board Overstock بلوائح REACH الخاصة بالاتحاد الأوروبي للسلامة الكيميائية، مما يضمن خلو PVC وHypalon والمكونات لدينا من المواد المقيدة.'
      icon: tabler:flask
    - title: 'اختبار المواد'
      description: 'تُختبر الأقمشة من حيث مقاومة الشد ومقاومة التمزق والتدهور بفعل الأشعة فوق البنفسجية والأداء في التشقق البارد. تُؤخذ عينات من كل دفعة إنتاج وتُتحقق.'
      icon: tabler:test-pipe
content_factory:
  tagline: معايير المصنع
  title: 'التميز في التصنيع<br />— مصنوع وفق المواصفات'
  subtitle: 'تعمل منشأتنا التي تبلغ مساحتها 12,000 m² وفق بروتوكولات صارمة لمراقبة الجودة في كل مرحلة من مراحل الإنتاج.'
  list:
    - 'فحص المواد الواردة: تُختبر جميع المواد الخام — قماش PVC وHypalon والألومنيوم والخشب الرقائقي والمواد اللاصقة — مقابل المواصفات قبل دخولها الإنتاج.'
    - 'مراقبة الجودة أثناء العملية: لكل مرحلة إنتاج نقاط تفتيش QC موثقة. تُتحقق قوة اللحام ومحاذاة الدرزات وتركيب الصمامات وعزم ربط التجهيزات في خط الإنتاج.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.25× rated pressure for 24-48 hours. Leak rate must be zero for passing grade.'
    - 'الفحص النهائي: تُفحص المنتجات المكتملة من حيث دقة الأبعاد والتشطيب الجمالي واكتمال الملحقات وسلامة التغليف قبل الشحن.'
    - 'تتبع الدفعات: يحمل كل منتج رقمًا تسلسليًا مرتبطًا بسجلات دفعة الإنتاج، مما يتيح تتبعًا كاملًا من المادة الخام إلى المنتجات النهائية.'
content_safety:
  tagline: معايير السلامة البحرية
  title: 'السلامة أولًا<br />— مصمم للتشغيل الموثوق'
  subtitle: 'تُصمم منتجات Paddle Board Overstock وتُختبر لتلبية معايير السلامة البحرية الدولية للاستخدام التجاري والترفيهي.'
  items:
    - title: 'ISO 6185'
      description: 'تلتزم القوارب القابلة للنفخ بمعايير ISO 6185 الخاصة بالبناء والثبات والطفو وسعة التحميل.'
      icon: tabler:sailboat
    - title: 'معايير ABYC'
      description: 'تتبع الأنظمة الكهربائية وأنظمة الوقود معايير ABYC (المجلس الأمريكي للقوارب واليخوت) للتركيب والتشغيل الآمنين.'
      icon: tabler:bolt
    - title: 'الامتثال لـ SOLAS'
      description: 'تلتزم معدات السلامة ووسائل الإنقاذ بمتطلبات SOLAS (السلامة في البحر) حيثما ينطبق ذلك.'
      icon: tabler:lifebuoy
cta:
  title: 'هل تحتاج إلى منتجات معتمدة لمشروعك؟'
  subtitle: 'تواصل مع فريقنا لمناقشة متطلبات الشهادات والتوثيق والامتثال لسوقك.'
  actions:
