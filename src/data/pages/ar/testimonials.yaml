testimonials:
  - category: clubs
    name: ريكاردو سانتوس
    title: مالك أكاديمية الغارف لركوب الأمواج
    location: لاغوس، البرتغال
    content: لقد بدأنا بحزمة Club Starter لمدرسة ركوب الأمواج لدينا. 20 لوحًا ومجدافًا وسترات - وصل كل شيء في غضون 3 أسابيع. بعد موسمين، قمنا بالترقية إلى الحزمة الاحترافية. كانت العلامة التجارية المخصصة مع شعارنا بمثابة تغيير في صورتنا الاحترافية.
    rating: 5
    product: باقة النادي المبتدئة
    source: solutions/clubs
  - category: clubs
    name: مالك النادي
    title: نادي الرياضات المائية
    location: فوكيت، تايلاند
    content: كانت حزمة بدء النادي نقطة الدخول المثالية. ومع نمو أعمالنا، نما Paddle Board Overstock معنا — نفس الجودة، نفس الأسعار، بدون مفاجآت. قمنا بتوسيعنا من 10 إلى 80 لوحة في 18 شهرًا.
    rating: 5
    product: باقة Club Starter + Premium
    source: success-stories
  - category: resorts
    name: مدير عام المنتجع
    title: منتجع شاطئي 5 نجوم
    location: اليونان
    content: Paddle Board Overstock لم يقتصروا على تسليم الألواح فقط — بل ساعدونا في بناء تجربة ضيافة كاملة. برنامج الرياضات المائية لدينا تحول من لا شيء ليصبح أبرز معلم في المنتجع خلال موسم واحد. 300+ حجز أسبوعي و180 ألف دولار من الإيرادات السنوية.
    rating: 5
    product: باقة المنتجع المميزة
    source: success-stories
  - category: resorts
    name: صوفي لوران
    title: مدير تجربة الضيوف، منتجعات Azure Bay
    location: فوكيت، تايلاند
    content: Paddle Board Overstock صممت وجهزت برنامجنا الكامل لأنشطة الشاطئ عبر ثلاث منتجعات. 120 SUPs، بنية تحتية للسلامة، وتدريب الموظفين — كلها تم تقديمها في شحنة واحدة. زادت مشاركة الضيوف بنسبة 60% في الموسم الأول.
    rating: 5
    product: باقة المنتجع المميزة
    source: solutions/resorts
  - category: rental
    name: دانيال أوكونكو
    title: مالك شركة Lakeland SUP Rentals
    location: أونتاريو، كندا
    content: كنت أستأجر 5 ألواح من متجر محلي وأخسر 60% من عائداتي لديهم. Paddle Board Overstock ساعدوني في بناء أسطول خاص بي من 15 SUPs. أظهر حاسوب ROI نقطة التعادل خلال 4 أشهر — استغرق الأمر 3 أشهر فقط. الآن أنا أقوم بتوسيع العدد إلى 30 لوحاً.
    rating: 5
    product: مجموعة بداية الأسطول
    source: solutions/rental-business
  - category: rental
    name: ماركو فالنتي
    title: مدير العمليات، جولات المغامرات الأدرياتيكية
    location: دوبروفنيك، كرواتيا
    content: قمنا بتجهيز أسطول تأجير SUP بالكامل بألواح Paddle Board Overstock — 30 لوحاً في ثلاث مواقع. بعد موسمين، صفر أعطال. الجودة المتسقة في كل دفعة جعلت اختيارنا سهلاً، وفريقهم قام حتى بمطابقة الألوان مع علامتنا التجارية.
    rating: 5
    product: حزمة أسطول التأجير
    source: trust
  - category: rental
    name: إيلينا مارشيتّي
    title: مالكة، تأجير SUP بحيرة غاردا
    location: بحيرة غاردا، إيطاليا
    content: ألواح التأجير لدينا تخرج خمس مرات في اليوم خلال موسم الذروة. منذ التحول إلى Paddle Board Overstock، انخفضت شكاوى الأضرار إلى ما يقارب الصفر، ويستمر العملاء في السؤال عن أماكن شراء لوحهم الخاص.
    rating: 5
    product: حزمة أسطول التأجير
    source: solutions/rental-business
  - category: consumers
    name: سارة ك.
    title: مالك SUP لأول مرة
    location: بحيرة تاهو بالولايات المتحدة الأمريكية
    content: مستقرة حتى بالنسبة للمبتدئين كاملة. أخرجته من البحيرة في أول يوم لي ولم يسقط أبدًا. الحزمة الكاملة مع المضخة والمجداف تعني أنني كنت على الماء بعد 20 دقيقة من فتح الصندوق.
    rating: 5
    product: SUP إكسبلورر 11
  - category: consumers
    name: جيمس ثورنتون
    title: مالك SUP إكسبلورر 11
    location: فانكوفر، كندا
    content: بصفتي مشتري لأول مرة، كنت متوترة من الطلب من الخارج. جودة التصنيع كانت واضحة منذ اللحظة التي فتحته فيها — صلب، وخياطة خالية من العيوب، ووصل في 6 أيام فقط.
    rating: 5
    product: SUP إكسبلورر 11
    source: trust
  - category: consumers
    name: مايك ر.
    title: راكب الأمواج في عطلة نهاية الأسبوع
    location: فلوريدا، الولايات المتحدة الأمريكية
    content: جودة البناء الصلبة. يتعامل مع القطع الساحلية بشكل أفضل مما كنت أتوقع من نفخ. قمت بتعبئتها في صندوق سيارتي لرحلة نهاية الأسبوع - تم نفخها عند المنحدر في أقل من 4 دقائق.
    rating: 5
    product: SUP نسيم استوائي
