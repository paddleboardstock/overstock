testimonials:
  - category: الأندية
    name: ريكاردو سانتوس
    title: مالك أكاديمية الغارف لركوب الأمواج
    location: لاغوس، البرتغال
    content: لقد بدأنا بحزمة Club Starter لمدرسة ركوب الأمواج لدينا. 20 لوحًا ومجدافًا وسترات - وصل كل شيء في غضون 3 أسابيع. بعد موسمين، قمنا بالترقية إلى الحزمة الاحترافية. كانت العلامة التجارية المخصصة مع شعارنا بمثابة تغيير في صورتنا الاحترافية.
    rating: 5
    product: باقة النادي المبتدئة
    source: solutions/clubs
  - category: الأندية
    name: مالك النادي
    title: نادي الرياضات المائية
    location: فوكيت، تايلاند
    content: كانت حزمة Club Starter هي نقطة الدخول المثالية. مع نمو أعمالنا، نمت Paddle Board Overstock معنا - نفس الجودة، ونفس السعر، ولا توجد مفاجآت. قمنا بتوسيع نطاق العمل من 10 إلى 80 لوحة في 18 شهرًا.
    rating: 5
    product: باقة Club Starter + Premium
    source: success-stories
  - category: المنتجعات
    name: مدير عام المنتجع
    title: منتجع شاطئي 5 نجوم
    location: اليونان
    content: لم تقم Paddle Board Overstock بتسليم اللوحات فحسب، بل ساعدتنا في بناء تجربة كاملة للضيوف. انتقل برنامج الرياضات المائية الخاص بنا من الصفر إلى تسليط الضوء على المنتجع في موسم واحد. أكثر من 300 حجز أسبوعي وإيرادات سنوية تبلغ 180 ألف دولار.
    rating: 5
    product: باقة المنتجع المميزة
    source: success-stories
  - category: المنتجعات
    name: صوفي لوران
    title: مدير تجربة الضيوف، منتجعات Azure Bay
    location: فوكيت، تايلاند
    content: قامت شركة Paddle Board Overstock بتصميم وتجهيز برنامج الأنشطة الشاطئية بالكامل عبر ثلاثة منتجعات. 80 مركبة SUP، و40 قارب كاياك، وبنية تحتية للسلامة، وتدريب الموظفين - يتم تسليمها جميعًا في شحنة واحدة. زادت مشاركة الضيوف بنسبة 60٪ في الموسم الأول.
    rating: 5
    product: باقة المنتجع المميزة
    source: solutions/resorts
  - category: رواد الأعمال
    name: مايكل بارك
    title: مؤسس شركة شورلاين بادل
    location: كاليفورنيا، الولايات المتحدة الأمريكية
    content: لقد أطلقت علامتي التجارية SUP دون أي خبرة في الصناعة. أرشدني فريق Paddle Board Overstock من اختيار المنتج إلى تصميم الشعار المخصص والتعبئة والتغليف. وصلت حاويتي الأولى خلال 11 أسبوعًا، وتم بيعها خلال 3 أشهر على أمازون.
    rating: 5
    product: إطلاق العلامة التجارية المبتدئة
    source: solutions/entrepreneurs
  - category: رواد الأعمال
    name: مؤسس
    title: ماركة SUP الأسترالية
    location: أستراليا
    content: كانت لدي فكرة العلامة التجارية ولكن لم تكن لدي أي معرفة بالتصنيع. أمسكت Paddle Board Overstock بيدي خلال العملية برمتها - بدءًا من اختيار تصميم اللوحة المناسب وحتى فتح شحنتي الأولى. 90 يومًا من الحلم إلى التسليم.
    rating: 5
    product: حزمة إطلاق العلامة التجارية
    source: success-stories
  - category: تأجير
    name: دانيال أوكونكو
    title: مالك شركة Lakeland SUP Rentals
    location: أونتاريو، كندا
    content: كنت أستأجر 5 لوحات من متجر محلي وخسرت 60% من إيراداتي لصالحهم. لقد ساعدتني Paddle Board Overstock في بناء أسطولي الخاص المكون من 15 مركبة SUP. أظهرت حاسبة عائد الاستثمار نقطة التعادل في 4 أشهر - وقد استغرق الأمر 3 أشهر. والآن أقوم بالتوسيع إلى 30 لوحة.
    rating: 5
    product: مجموعة بداية الأسطول
    source: solutions/rental-business
  - category: تأجير
    name: ماركو فالنتي
    title: مدير العمليات، جولات المغامرات الأدرياتيكية
    location: دوبروفنيك، كرواتيا
    content: لقد قمنا بتجهيز أسطولنا المستأجر بالكامل بـ Paddle Board Overstock RIBs - 12 قاربًا في ثلاثة مواقع. موسمين، صفر إخفاقات. جعلت وثائق شهادة CE الموافقة على التأمين سلسة. حتى أن فريقهم الهندسي قام بتخصيص ألوان الأنبوب.
    rating: 5
    product: مجموعة توسيع الأسطول
    source: trust
  - category: تأجير
    name: الملازم أول أندريس رييس
    title: ضابط المشتريات البحرية، مساعد خفر السواحل الفلبيني
    location: مانيلا، الفلبين
    content: نقوم بتشغيل 24 قطعة Paddle Board Overstock RIBs عبر أسطول الدوريات الساحلية لدينا. إن عملية مراقبة الجودة الخاصة بهم متسقة عبر كل دفعة - نفس جودة التماس، ونفس وضع الصمام، ونفس معدل الضغط في كل مرة. إن التكرار مهم عندما تعتمد الحياة على المعدات.
    rating: 5
    product: أسطول دورية RIB
    source: trust
  - category: المستهلكين
    name: سارة ك.
    title: مالك SUP لأول مرة
    location: بحيرة تاهو بالولايات المتحدة الأمريكية
    content: مستقرة حتى بالنسبة للمبتدئين كاملة. أخرجته من البحيرة في أول يوم لي ولم يسقط أبدًا. الحزمة الكاملة مع المضخة والمجداف تعني أنني كنت على الماء بعد 20 دقيقة من فتح الصندوق.
    rating: 5
    product: سوب إكسبلورر 11
  - category: المستهلكين
    name: جيمس ثورنتون
    title: مالك سوب إكسبلورر 11
    location: فانكوفر، كندا
    content: باعتباري مشتريًا لأول مرة، كنت متوترًا بشأن جودة الطلب من الخارج. لقد أعطتني وثائق ISO وتقارير اختبار الطرف الثالث التي شاركوها قبل أن أسألها الثقة الكاملة. وصل المجلس في 6 أيام وتجاوز توقعاتي.
    rating: 5
    product: سوب إكسبلورر 11
    source: trust
  - category: المستهلكين
    name: مايك ر.
    title: كايكر الترفيهية
    location: فلوريدا، الولايات المتحدة الأمريكية
    content: جودة البناء الصلبة. يتعامل مع القطع الساحلية بشكل أفضل مما كنت أتوقع من نفخ. قمت بتعبئتها في صندوق سيارتي لرحلة نهاية الأسبوع - تم نفخها عند المنحدر في أقل من 4 دقائق.
    rating: 5
    product: نفخ كاياك
