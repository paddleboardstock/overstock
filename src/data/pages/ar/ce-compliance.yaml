hero:
  tagline: الامتثال لـ CE وRCD
  title: امتثال RIB Boat CE <br /> والوثائق الفنية
  subtitle: تم تصميم قوارب Aquafarer RIB والمراكب المائية القابلة للنفخ وتوثيقها لتتوافق مع سوق الاتحاد الأوروبي بموجب توجيهات القوارب الترفيهية 2013/53/EU. بدءًا من تقييم المخاطر وحتى إعلان المطابقة، نقدم وثائق امتثال خاصة بالنموذج لكل هيكل.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: وثائق وشهادة الامتثال لـ RIB boat CE
direct_answer: توفر Aquafarer وثائق الامتثال الخاصة بنموذج RCD 2013/53/EU للقوارب RIB والمراكب المائية القابلة للنفخ، بما في ذلك الملفات الفنية وإعلانات المطابقة ولوحات البناء وأدلة المالك - وكلها متوافقة مع EN ISO 6185 وISO 12217 والمعايير المنسقة المعمول بها.
