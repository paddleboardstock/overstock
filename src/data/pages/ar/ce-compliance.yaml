content_scope:
  tagline: نطاق الامتثال
  title: ما هي المنتجات التي تحتاج إلى التوافق مع RCD؟
  subtitle: ينطبق توجيه المراكب الترفيهية رقم 2013/53/EU على المراكب الترفيهية التي يتراوح طول هيكلها بين 2.5 مترًا و24 مترًا. فهم النطاق هو الخطوة الأولى نحو الامتثال.
  items:
    - title: قوارب RIB (2.5–24 م)
      description: تندرج القوارب الصلبة القابلة للنفخ التي يتراوح طول هيكلها من 2.5 مترًا إلى 24 مترًا ضمن التجمع الكونغولي من أجل الديمقراطية. تنطبق فئات التصميم من أ إلى د اعتمادًا على ظروف البحر المقصودة والحد الأقصى لقوة الرياح.
      icon: tabler:sailboat
    - title: قوارب مطاطية (أقل من 2.5 متر)
      description: قد يتم إعفاء القوارب الصغيرة القابلة للنفخ والزوارق التي يقل طولها عن 2.5 متر جزئيًا من RCD ولكنها لا تزال تتطلب علامة CE بموجب التوجيهات الأخرى المعمول بها ومعايير البناء EN ISO 6185.
      icon: tabler:sailboat
    - title: لوحات SUP وملحقاتها
      description: ألواح التجديف واقفة تقع خارج نطاق التجمع الكونغولي من أجل الديمقراطية. ومع ذلك، تتطلب أجهزة التعويم الشخصية المرتبطة بها (PFDs) علامة CE بموجب لائحة معدات الحماية الشخصية (الاتحاد الأوروبي) 425/2016 مع موافقة خفر السواحل الأمريكي من النوع III/V حيثما ينطبق ذلك.
      icon: tabler:swimming
    - title: قوارب مكتملة جزئيا
      description: تتطلب القوارب التي يتم تسليمها بدون محرك أو تركيبات محددة تصريحًا من الشركة المصنعة للمركبة المكتملة جزئيًا، مع استكمال الامتثال الكامل لـ RCD من قبل شركة البناء النهائية أو المستورد.
      icon: tabler:tool
content_trust_layers:
  tagline: نظام الثقة ثلاثي الطبقات
  title: معلومات الامتثال<br />— تتم مشاركتها على المستوى المناسب
  subtitle: لا تنتمي جميع بيانات الامتثال إلى موقع ويب عام. نحن نتبع نهجًا ثلاثي الطبقات يحمي الملكية الفكرية مع بناء ثقة المشتري.
  items:
    - title: الطبقة 1 - الموقع العام
      description: المعايير المرجعية، طرق المطابقة الموضحة، أنواع المستندات المدرجة، نطاق الاعتماد لكل عائلة نموذجية. لا توجد شهادات فعلية، أو بيانات اختبار، أو تفاصيل هندسية خاصة.
      icon: tabler:world
    - title: الطبقة الثانية – مشاركة ما بعد الاستفسار
      description: 'بعد استفسار مؤهل: عينة DoC المنقحة، وصورة لوحة الشركة المصنعة، وقائمة المعايير المعمول بها، وقائمة التحقق من الامتثال، وملخصات شهادات المواد - تتم مشاركتها بموجب شروط الاستخدام العادل.'
      icon: tabler:mail
    - title: الطبقة 3 - NDA / مرحلة الطلب
      description: الملف الفني الكامل، وتقييمات المخاطر، وحسابات الاستقرار، وتقارير الاختبار، وسجلات دفعة المواد، ووثائق تتبع الإنتاج - تتم مشاركتها فقط بموجب اتفاقية عدم الإفشاء مع المشترين المؤكدين.
      icon: tabler:lock
content_standards:
  tagline: المعايير المعمول بها
  title: معايير ISO وEN<br />نحن نبني عليها
  subtitle: تم تصميم منتجاتنا واختبارها وفقًا للمعايير المنسقة بموجب RCD. تتم الإشارة إلى الأرقام والأسماء القياسية؛ تظل النصوص القياسية الكاملة محمية بحقوق الطبع والنشر وفقًا لـ ISO.
  items:
    - title: إن آيزو 6185-3
      description: 'القوارب القابلة للنفخ - الجزء 3: القوارب التي تبلغ قوة محركها القصوى 15 كيلو واط أو أكثر. متطلبات البناء والاستقرار والطفو والانتعاش من فوق سطح السفينة لـ RIBs.'
      icon: tabler:file-text
    - title: إن آيزو 6185-4
      description: 'القوارب القابلة للنفخ – الجزء الرابع: القوارب ذات قوة محرك قصوى تبلغ 15 كيلووات وأكبر من أو تساوي 4.5 كيلووات. متطلبات هيكلية واستقرارية إضافية.'
      icon: tabler:file-text
    - title: سلسلة آيزو 12215
      description: المراكب الصغيرة – بناء الهيكل والمسح. التصميم الهيكلي للهيكل والسطح والحواجز لهياكل RIB المصنوعة من الألياف الزجاجية والألومنيوم.
      icon: tabler:ruler-2
    - title: إن آيزو 10240
      description: مركبة صغيرة – دليل المالك. المحتوى والتنسيق المطلوب لدليل المالك المصاحب لكل قارب RIB يتم تسليمه في الاتحاد الأوروبي.
      icon: tabler:book
    - title: إن إسو 14945
      description: مركبة صغيرة – لوحة البناء. المعلومات التي يجب وضع علامة عليها على لوحة البناء المرفقة بشكل دائم بكل مركبة.
      icon: tabler:badge
    - title: ايزو 8666
      description: المراكب الصغيرة – البيانات الرئيسية. قياسات ومعلمات موحدة للمواصفات المتسقة عبر جميع وثائق المنتج.
      icon: tabler:dimensions
content_process:
  tagline: عملية الامتثال
  title: الامتثال لـ CE في 6 خطوات<br />سير العمل
  subtitle: من نطاق المشروع إلى إمكانية التتبع على المستوى التسلسلي - يتبع كل نموذج RIB مسار امتثال محدد.
  steps:
    - number: '01'
      title: نطاق المشروع وتصنيفه
      description: تحديد نموذج RIB، وفئة التصميم (A/B/C/D)، والحد الأقصى لعدد الأشخاص، والحمولة، وقوة المحرك، والسوق المستهدف. تحديد ما إذا كان RCD ينطبق وما هي وحدة تقييم المطابقة المطلوبة.
      timeline: 2-3 أيام
    - number: '02'
      title: تحديد المتطلبات المطبقة
      description: تحديد جميع متطلبات السلامة الأساسية المطبقة من الملحق الأول لـ RCD، والمعايير المنسقة ذات الصلة (EN ISO 6185، 12215، 10240، 14945)، وأي متطلبات وطنية إضافية للسوق المستهدفة.
      timeline: 3-5 أيام
    - number: '03'
      title: التصميم والتوثيق الفني
      description: 'إنشاء الملف الفني الرئيسي: رسومات الترتيب العام، وحسابات الاستقرار والطفو، وتقييم المخاطر، ومواصفات المواد، وتحليل سلامة الأنظمة (الوقود، والكهرباء، والتوجيه).'
      timeline: 10-15 يوما
    - number: '04'
      title: التحقق من المنتج واختباره
      description: إجراء التحقق المادي - اختبار الضغط عند ضغط مقدر 1.25x لمدة 24-48 ساعة، واختبارات الاستقرار والطفو، واختبارات الحمل، وتشغيل الأنظمة. تسجيل جميع نتائج الاختبار لكل بدن.
      timeline: 5-7 أيام
    - number: '05'
      title: وثائق العلامات والتسليم
      description: علامة CE ولوحة البناء (EN ISO 14945) وHIN/CIN (رقم تعريف الهيكل). قم بإعداد إعلان المطابقة للاتحاد الأوروبي ودليل المالك (EN ISO 10240) وقائمة التحقق من الامتثال.
      timeline: 2-3 أيام
    - number: '06'
      title: إمكانية التتبع على المستوى التسلسلي
      description: يتلقى كل هيكل سجل هيكل فريدًا يربطه بالملف الفني الرئيسي، دفعة الإنتاج، شهادات المواد، نتائج الاختبار، والتكوين النهائي. تم الاحتفاظ بالسجلات لمدة تزيد عن 10 سنوات لكل التجمع الكونغولي من أجل الديمقراطية.
      timeline: مستمر
content_document_cards:
  tagline: أنواع المستندات
  title: وثيقة الامتثال<br />البطاقات
  subtitle: هذه هي أنواع المستندات التي نقوم بإعدادها وصيانتها لكل نموذج RIB معتمد من CE. العينات متاحة عند الاستفسار المؤهل.
  items:
    - title: شهادة الامتثال CE / RCD
      description: شهادة خاصة بالطراز تؤكد أن المركبة تلبي جميع متطلبات السلامة الأساسية المعمول بها في RCD 2013/53/EU، الصادرة عن الشركة المصنعة بمشاركة الهيئة المبلغة عند الاقتضاء.
      icon: tabler:certificate
    - title: إعلان المطابقة للاتحاد الأوروبي (DoC)
      description: إعلان موقع من الشركة المصنعة أو الممثل المعتمد، يتضمن التوجيهات المعمول بها والمعايير ووحدة المطابقة وتفاصيل الهيئة المبلغة. مطلوب لكل طراز معروض في سوق الاتحاد الأوروبي.
      icon: tabler:file-check
    - title: لوحة البناء (EN ISO 14945)
      description: لوحة مثبتة بشكل دائم توضح الحد الأقصى للأشخاص، والحد الأقصى لقوة المحرك، وفئة التصميم، وتحديد الشركة المصنعة. يجب أن تظل مقروءة طوال عمر المركبة.
      icon: tabler:badge
    - title: دليل المالك (EN ISO 10240)
      description: دليل شامل يغطي التشغيل الآمن وإجراءات الطوارئ وجداول الصيانة وتحذيرات السلامة. إلزامي لكل RIB يتم تسليمه في الاتحاد الأوروبي.
      icon: tabler:book
    - title: تقارير اختبار وفحص ISO
      description: سجلات اختبار الضغط (1.25x / 24–48 ساعة)، ونتائج اختبار الاستقرار والطفو، وشهادات اختبار المواد، وتقارير التحقق من الأبعاد - كلها مرتبطة بأرقام هيكل محددة.
      icon: tabler:test-pipe
    - title: سجلات تتبع المواد
      description: إمكانية التتبع على مستوى الدفعة لنسيج الأنبوب والمواد اللاصقة والألياف الزجاجية والأجهزة. ربط كل وحدة إنتاج بشهادات المواد الواردة ونتائج فحص IQC.
      icon: tabler:link
    - title: فحص الجودة وسجلات مراقبة الجودة
      description: قائمة مراجعة الجودة المكونة من 100 نقطة لكل وحدة، وسجلات مراقبة الجودة قيد التشغيل، وتقارير عدم المطابقة، والإجراءات التصحيحية. جزء من سلسلة تتبع الإنتاج.
      icon: tabler:clipboard-check
    - title: حزمة وثائق المشروع
      description: حزمة الوثائق لكل هيكل بما في ذلك سجل التكوين النهائي وتفاصيل تركيب المحرك والمعدات وقائمة التحقق من التشغيل ووثائق التسليم.
      icon: tabler:package
content_design_categories:
  tagline: فئات تصميم التجمع الكونغولي من أجل الديمقراطية
  title: فئة التصميم من أ إلى د<br />— ماذا تعني
  subtitle: يقوم RCD بتعيين فئات التصميم بناءً على الحد الأقصى لقوة الرياح وارتفاع الموجة الكبير الذي تم تصميم المركبة لتحمله.
  items:
    - title: الفئة أ - المحيط
      description: مصممة للرحلات الطويلة حيث قد تتجاوز قوة الرياح 8 بوفورت (> 40 عقدة) وقد يتجاوز ارتفاع الأمواج الكبير 4 أمتار. يتطلب التحقق الهيكلي والاستقرار الأكثر صرامة.
      icon: tabler:ripple
    - title: الفئة ب - في الخارج
      description: مُصمم للرحلات البحرية بقوة رياح تصل إلى بوفورت 8 (40 عقدة) وارتفاع أمواج كبير يصل إلى 4 أمتار. مناسبة للمياه الساحلية وشبه المكشوفة.
      icon: tabler:anchor
    - title: الفئة ج - الشاطئ
      description: مصممة للرحلات الساحلية مع قوة رياح تصل إلى بوفورت 6 (27 عقدة) وارتفاع أمواج كبير يصل إلى 2 متر. تقع معظم الأضلاع الترفيهية الترفيهية في هذه الفئة.
      icon: tabler:sun
    - title: الفئة د – محمية
      description: مصممة للمياه المحمية بقوة رياح تصل إلى بوفورت 4 (16 عقدة) وارتفاع موجة كبير يصل إلى 0.3 متر. البحيرات والأنهار والموانئ المحمية.
      icon: tabler:pool
content_hin:
  tagline: تحديد الحرفة
  title: HIN / CIN ولوحة البناء
  subtitle: يتطلب كل قارب RIB رقم تعريف الهيكل (HIN) أو رقم تعريف المركبة (CIN) ولوحة البناء وفقًا لمتطلبات EN ISO 14945 وRCD.
  items:
    - title: رقم تعريف الهيكل (HIN)
      description: رمز فريد مكون من 14 حرفًا تم وضع علامة دائمة عليه على الجانب الأيمن من العارضة، ورمز الشركة المصنعة المشفر (MIC)، وسنة الطراز، وسنة الإنتاج، والرقم التسلسلي. مطلوب لدخول سوق الاتحاد الأوروبي.
      icon: tabler:hash
    - title: رقم تعريف المركبة (CIN)
      description: وفقًا لمعيار EN ISO 10087، يتم وضع رقم تعريف ثانوي مخفي في مكان مخفي لأغراض مكافحة السرقة وإمكانية التتبع.
      icon: tabler:eye-off
    - title: محتوى لوحة البناء
      description: الحد الأقصى لعدد الأشخاص، والحد الأقصى لقدرة المحرك (كيلوواط)، والحد الأقصى للحمل (كجم)، وفئة التصميم، واسم الشركة المصنعة، وعلامة CE - كلها معروضة بشكل دائم على لوحة مقاومة للتآكل.
      icon: tabler:badge
content_tech_file:
  tagline: هيكل الملف الفني
  title: الملف الفني الرئيسي <br /> وسجل هال
  subtitle: 'يتبع نظام التوثيق الخاص بنا هيكلًا من مستويين: الملف الفني الرئيسي لكل عائلة نموذجية، وسجلات الهيكل الفردية لكل قارب يتم إنتاجه.'
  items:
    - title: الملف الفني الرئيسي
      description: 'يحتوي على وثائق الامتثال الكاملة لعائلة النماذج: الترتيب العام، وتقييم المخاطر، وحسابات الاستقرار/الطفو، ومواصفات المواد، والمعايير المعمول بها، وسجلات تقييم المطابقة. تم الاحتفاظ بها لمدة تزيد عن 10 سنوات.'
      icon: tabler:folder
    - title: سجل الهيكل (إمكانية التتبع لكل قارب)
      description: 'يحتوي كل هيكل على سجل فريد يربطه بالملف الفني الرئيسي: HIN، وتاريخ الإنتاج، ومجموعة الأنابيب، وشهادات المواد، ونتيجة اختبار الضغط، والتكوين النهائي، وتثبيت المحرك، ووجهة التسليم.'
      icon: tabler:file-description
    - title: حزمة امتثال العملاء
      description: حزمة التسليم لكل هيكل، بما في ذلك DoC، وصورة لوحة البناء، ودليل المالك، وملخص الاختبار، وورقة التكوين النهائية - المقدمة مع كل RIB يتم شحنه إلى الاتحاد الأوروبي.
      icon: tabler:package
faq:
  title: الامتثال لـ CE — الأسئلة المتداولة
  questions:
    - q: هل جميع قوارب Aquafarer RIB حاصلة على شهادة CE لسوق الاتحاد الأوروبي؟
      a: تم تصميم قوارب RIB الموجودة في كتالوجنا وتوثيقها لتتوافق مع RCD 2013/53/EU وفقًا لتوجيهات الاتحاد الأوروبي المعمول بها. تنطبق علامة CE على كل طراز وعلى أساس التكوين. اتصل بنا للحصول على وثيقة نطاق الامتثال الخاصة بالنموذج.
    - q: ما هو الفرق بين الامتثال للتجمع الكونغولي من أجل الديمقراطية وعلامة CE؟
      a: RCD (توجيه المركبات الترفيهية 2013/53/EU) هو تشريع الاتحاد الأوروبي الذي يحدد متطلبات السلامة الأساسية. علامة CE هي الرمز المرئي الذي يتم وضعه على المنتج الذي تم تقييمه وتأكيد استيفائه لتلك المتطلبات. يجب أن يتوافق المنتج مع RCD قبل أن يتمكن من حمل علامة CE.
    - q: هل تقدمون إقرارات المطابقة مع كل قارب؟
      a: نعم. يتضمن كل قارب RIB يتم تسليمه إلى سوق الاتحاد الأوروبي إعلان مطابقة خاص بنموذج الاتحاد الأوروبي يدرج التوجيهات المعمول بها والمعايير المنسقة ووحدة تقييم المطابقة وتفاصيل الهيئة المُخطرة.
    - q: ما هي وحدة تقييم المطابقة التي تستخدمها Aquafarer؟
      a: تعتمد الوحدة على فئة التصميم ونوع القارب. تستخدم معظم نماذج RIB في فئة التصميم C الوحدة A (التحكم الداخلي في الإنتاج). بالنسبة للقوارب من فئة التصميم A/B أو التكوينات المحددة، قد يتم تطبيق الوحدة B+C أو B+D بمشاركة الهيئة المبلغة. نحن ننصح بشأن الوحدة المناسبة لكل مشروع.
    - q: هل يمكنك مشاركة وثائق الامتثال قبل تقديم الطلب؟
      a: بعد إجراء استفسار مؤهل، نشارك مستند نطاق الامتثال الذي يسرد المعايير المعمول بها ومسار المطابقة وأنواع المستندات المتاحة للنموذج الذي تقوم بتقييمه. تتم مشاركة الملفات الفنية الكاملة بموجب اتفاقية عدم الإفشاء بعد تأكيد الطلب.
    - q: ما هو رقم تعريف الهيكل (HIN) وهل تم تضمينه؟
      a: HIN عبارة عن معرف فريد مكون من 14 حرفًا يتم تمييزه بشكل دائم على كل قارب، وترميز رمز الشركة المصنعة (MIC)، وتعيين النموذج، وسنة الإنتاج، والرقم التسلسلي. إنه إلزامي لجميع قوارب RIB الموجودة في سوق الاتحاد الأوروبي ويتم تضمينه في كل قوارب Aquafarer RIB.
    - q: ما هي مدة الاحتفاظ بالملفات الفنية؟
      a: وفقًا لمتطلبات RCD 2013/53/EU، يجب على الشركة المصنعة الاحتفاظ بالملف الفني لمدة 10 سنوات على الأقل من تاريخ آخر تاريخ طرح المنتج في السوق. تحتفظ Aquafarer بالوثائق الفنية الكاملة لجميع النماذج المنتجة.
    - q: هل تساعد في الوفاء بالتزامات المستورد بموجب التجمع الكونغولي من أجل الديمقراطية؟
      a: 'نعم. نحن نقدم حزمة الوثائق التي يحتاجها مستوردو الاتحاد الأوروبي للوفاء بالتزاماتهم: الوصول إلى الملفات الفنية، وDoC، ولوحة البناء، ودليل المالك، وسجلات تتبع المنتج. إن مسؤوليات المستورد بموجب RCD موثقة بوضوح في دليل الامتثال الخاص بنا.'
