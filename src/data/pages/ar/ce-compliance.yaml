content_material_cert:
  tagline: شهادة المواد
  title: إمكانية تتبع المواد وأدلة الشهادة
  subtitle: الجودة RIB تبدأ القوارب بمواد خاضعة للرقابة وعمليات موثقة. فيما يلي كيفية تنظيم شهادة المواد لكل مجموعة مكونة مهمة.
  items:
    - title: إمكانية تتبع مادة الأنبوب القابل للنفخ
      description: يتم اختيار مواد الأنابيب PVC وCSM/Hypalon وفقًا للاستخدام المقصود والظروف المناخية والسوق المستهدف. تتوفر البيانات الفنية للموردين (TDS)، ومعلومات مجموعة المواد، وإمكانية تتبع مجموعة القماش، وتقارير اختبار الأشعة فوق البنفسجية والعوامل الجوية، وإعلانات REACH/SVHC ضمن نطاق وثائق المشروع المتفق عليه.
      icon: tabler:circle
    - title: إمكانية تتبع الألومنيوم البحري
      description: بالنسبة لمشاريع هيكل الألومنيوم RIB، يتم التحكم في درجة السبائك والسمك ودفعات المواد وفقًا للمواصفات المعتمدة. يتم توفير شهادات اختبار المواد (MTC/MTR)، ووثائق EN 10204 3.1، وتقارير التركيب الكيميائي والخصائص الميكانيكية، وإمكانية تتبع الحرارة/الدفعة عند الاتفاق عليه.
      icon: tabler:rectangle
    - title: GRP التحكم في مادة الهيكل والعمليات
      description: بالنسبة للأضلاع ذات الهيكل المصنوع من الألياف الزجاجية، تتم إدارة طبقة الجيلاتين والراتنج وتعزيز الألياف الزجاجية والمواد الأساسية من خلال مواصفات خاضعة للرقابة. تتوفر المواد TDS/SDS، وسجلات الدُفعات، ومواصفات الصفائح، وسجلات المعالجة ومراقبة ورشة العمل عند اتفاقية المشروع.
      icon: tabler:layers-subtract
    - title: دعم توثيق المكونات
      description: بالنسبة للمكونات المحددة - بما في ذلك مواد سطح السفينة EVA، والمقاعد، والأجهزة المصنوعة من الفولاذ المقاوم للصدأ، وأنظمة الوقود، والمعدات الكهربائية والملحقات البحرية - يتم تنسيق وثائق المورد المعمول بها بناءً على التكوين النهائي ومتطلبات سوق الوجهة.
      icon: tabler:package
    - title: إشعار نطاق الامتثال
      description: تنطبق الشهادات وتقارير الاختبار ووثائق الامتثال فقط على طراز المنتج أو المادة أو المكون أو دفعة الإنتاج أو نطاق المشروع المحدد المذكور في المستند ذي الصلة. اتصل بنا وأخبرنا بالسوق المستهدف والاستخدام المقصود والمتطلبات الفنية حتى يمكن تأكيد حزمة الوثائق المعمول بها قبل تقديم الطلب.
      icon: tabler:info-circle

