hero:
  tagline: لماذا Aquafarer
  title: مصنوع بشكل مختلف. مصنوع للأعمال. الشريك وراء مغامرات المياه حول العالم
  subtitle: ليس مجرد مصنع — بل شريك تجاري يصمم ويهندس ويوفر معدات تجارية المستوى للأندية والمنتجعات ومشغلي التأجير والعلامات التجارية المائية الناشئة.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer جودة التصنيع والخبرة
pillars:
  tagline: أركان الشراكة الثلاثة
  title: لماذا تختار شركات المياه في العالم Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: مصمّم للاستخدام التجاري
      description: تم تصميم معداتنا للإيجار اليومي، وليس للترفيه في عطلة نهاية الأسبوع. النواة التجارية PVC، والنوى المعززة drop-stitch، وخيارات Hypalon المستقرة UV، والأجهزة المجربة ميدانيًا تعني صيانة أقل، وعمر أطول، وأداء أعلى ROI لعملياتك.
      icon: tabler:building-factory
      callToAction:
        text: انظر خط الإنتاج التجاري
        href: /products
    - title: من الفكرة إلى السوق
      description: 'أطلق علامتك التجارية لمعدات الرياضات المائية في 90 يومًا. نحن نرشدك خلال كل خطوة: التحقق من صحة الفكرة، اختيار المنتج، النموذج الأولي، الإنتاج، تصميم التغليف، والشحن العالمي. لا يوجد ضغط على الحد الأدنى للطلبات — ابدأ صغيرًا وتوسع بثقة.'
      icon: tabler:rocket
      callToAction:
        text: ابدأ رحلتك مع العلامة التجارية
        href: /oem-odm-blueprint
    - title: مصمّم للظروف العالمية
      description: 'منتجات محسّنة لكل مناخ: تركيبات للمياه الباردة PVC لأوروبا، مواد مقاومة UV للشرق الأوسط وأستراليا، علاجات ضد الرطوبة لجنوب شرق آسيا. كل شحنة تتم معايرتها وفق بيئة وجهتها.'
      icon: tabler:world
