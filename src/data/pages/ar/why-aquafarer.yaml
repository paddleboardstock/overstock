reasons:
  tagline: الفرق Aquafarer
  title: ما الذي يميزنا
  isBeforeContent: false
  columns: 3
  items:
    - title: التصنيع الحقيقي، ليس التجارة
      description: نحن نمتلك وندير مصنعًا بمساحة 12,000 متر مربع. عندما تتعاون مع Aquafarer، تعمل مباشرة مع الأشخاص الذين يصممون ويهندسون ويبنون منتجاتك — دون وسطاء.
      icon: tabler:building-factory
    - title: نهج يقوده الهندسة
      description: تبدأ عملية التصميم لدينا بحالة الاستخدام، وليس بفئة المنتج. نحن نعمل على تحسين شكل الهيكل، اختيار المواد، والتكوين بما يتناسب مع كيفية استخدام المعدات بالفعل في البيئات التجارية.
      icon: tabler:engine
    - title: جودة معتمدة
      description: CE معتمد، ISO نظام جودة، BSCI متوافق، REACH متوافق، USCG سترات نجاة معتمدة من النوع III/V؛ جميع المنتجات تفي بالمعايير الدولية المعمول بها.
      icon: tabler:certificate
    - title: مرن OEM/ODM
      description: ألوان الأنابيب، تخطيط وحدة التحكم، العلامة التجارية، التغليف — نحن نخصص وفقًا لمواصفاتك. لا يوجد ضغط على الحد الأدنى للطلب. ابدأ بنموذج أولي، وطور بثقة.
      icon: tabler:adjustments
    - title: اللوجستية العالمية
      description: مستودع أمريكي في كاليفورنيا، الشحن المباشر من تشينغداو، الشحن الجوي للطلبات العاجلة. نحن نتعامل مع الأوراق والوثائق الجمركية في جميع أنحاء العالم.
      icon: tabler:truck-delivery
    - title: دعم مدى الحياة
      description: نحن ندعم القوارب التي بنيناها قبل 20 عامًا. قطع الغيار الأصلية، النصائح التقنية، إرشادات الإصلاح — فريقنا متاح عندما تحتاجون إلينا، أينما كنتم.
      icon: tabler:lifebuoy
testimonials:
  tagline: موثوق به من قبل العلامات التجارية حول العالم
  title: ماذا يقول شركاؤنا
  items:
    - content: لقد عملنا مع عدة مصنّعين في الصين، لكن Aquafarer يبرز بسبب دعمهم الهندسي وجودتهم المستمرة. إنهم يعاملون علامتنا التجارية كما لو كانت ملكهم.
      name: — OEM شريك، علامة تجارية أوروبية للرياضات المائية
    - content: لقد كانت Hypalon RIBs الخاصة بهم في خدمة أسطولنا لأكثر من 5 سنوات. صيانة قليلة، ومقاومة ممتازة UV. توفر الضمان لمدة 5 سنوات على الأنابيب لنا الثقة.
      name: — مشغل الأسطول، مجموعة منتجعات الشرق الأوسط
    - content: فريق Aquafarer ساعدنا في تطوير تصميم لوحة SUP مخصص من الفكرة إلى الإنتاج في 90 يومًا. الجودة فاقت توقعاتنا.
      name: — موزع، الرياضات المائية الأسترالية
    - content: بصفتي صاحب مشروع صغير، كنت قلقًا بشأن MOQs. Aquafarer عمل مع ميزانيتي وساعدني على إطلاق علامتي التجارية باستخدام 50 لوحة فقط. والآن أنا أطلب 500.
      name: — مؤسس العلامة التجارية، الولايات المتحدة SUP شركة تأجير
