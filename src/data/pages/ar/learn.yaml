hero:
  tagline: معرفة استكشاف المياه
  title: تعلّم
  subtitle: |
    أدلة، دروس تعليمية، وعمليات استكشافية متعمقة — كل ما تحتاجه للاستكشاف<br />
    الماء بثقة. من اختيار أول SUP لك إلى إتقان التقنيات المتقدمة.
  taglineSection: المعرفة لكل متزلج على المجداف. من المبتدئ إلى المحترف.
featured:
  tagline: المواضيع المميزة
  title: ابدأ رحلتك التعليمية
  subtitle: سواء كنت جديدًا على الرياضات المائية أو تبحث عن تحسين مستواك، فإن أدلتنا تغطي كل ما تحتاجه.
  items:
    - title: SUP الأساسيات
      description: كل ما يحتاج المبتدئون لمعرفته — أنواع الألواح، قياس المجداف، الوضعية، ونصائح اليوم الأول.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: الألواح القابلة للنفخ مقابل الألواح الصلبة
      description: أيهما يناسبك؟ نحن نقارن بين القابلية للنقل، الأداء، المتانة، والتكلفة جنبًا إلى جنب.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: سلامة المياه
      description: المعرفة الأساسية للسلامة التي يجب أن يمتلكها كل راكب زوارق — الطقس، وسترات النجاة، والإنقاذ الذاتي، وأكثر.
      icon: tabler:shield
      href: /learn/water-safety
    - title: دليل المواد
      description: Drop-stitch النوى، PVC الطبقات، EVA رغوة اللوح — افهم مما مصنوع لوحك.
      icon: tabler:hexagons
      href: /learn/materials
    - title: دليل الحجم SUP
      description: اعثر على طول اللوح المناسب، عرضه، وحجمه وفقًا لوزنك، مهارتك، وأسلوب التجديف الخاص بك.
      icon: tabler:ruler
      href: /size-guide
    - title: تقنيات متوسطة
      description: ارتقِ بمستوى التجديف الخاص بك باستخدام الحركات المتقدمة وتقنيات الدوران والتعامل مع المياه الهائجة.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
