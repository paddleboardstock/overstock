hero:
  tagline: 'معرفة استكشاف المياه'
  title: 'تعلم'
  subtitle: |
    أدلة، دروس تعليمية، وغوص عميق — كل ما تحتاجه لاستكشاف<br />
    الماء بثقة. من اختيار أول SUP لك إلى إتقان التقنيات المتقدمة.
  taglineSection: 'معرفة لكل مجداف. من المبتدئ إلى المحترف.'

featured:
  tagline: 'مواضيع مميزة'
  title: 'ابدأ رحلة التعلم'
  subtitle: 'سواء كنت جديداً في الرياضات المائية أو تتطلع للارتقاء بمستواك، أدلتنا تغطيك.'
  items:
    - title: 'أساسيات SUP'
      description: 'كل ما يحتاج المبتدئ معرفته — أنواع الألواح، حجم المجداف، الوقوف، ونصائح اليوم الأول.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'قابل للنفخ مقابل اللوح الصلب'
      description: 'أيهما مناسب لك؟ نقارن بين قابلية النقل والأداء والمتانة والتكلفة جنباً إلى جنب.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'السلامة المائية'
      description: 'معرفة سلامة أساسية يجب أن يمتلكها كل مجداف — الطقس، سترات النجاة، الإنقاذ الذاتي، والمزيد.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'دليل المواد'
      description: 'PVC مقابل Hypalon، تقنية الخياطة المتساقطة، تصنيفات denier — افهم مما صنعت معداتك.'
      icon: 'tabler:hexagons'
      href: '/learn/materials'
    - title: 'دليل حجم SUP'
      description: 'اعثر على طول اللوح المناسب وعرضه وحجمه لوزنك ومهاراتك وأسلوب تجديفك.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'تقنيات متوسطة'
      description: 'ارفع مستوى تجديفك بضربات متقدمة وتقنيات دوران والتعامل مع المياه المضطربة.'
      icon: 'tabler:ripple'
      href: '/learn/intermediate-techniques'

