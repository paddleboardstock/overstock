hero_text:
  tagline: الموارد
  title: تحميل أدلة المركز والتجديف
  subtitle: كتالوجات المنتجات، أدلة الشراء، وتعليمات العناية لمساعدتك في اختيار واستخدام والاستمتاع بلوحك القابل للنفخ SUP .
features3_downloads:
  tagline: التنزيلات
  title: توثيق المنتج<br />& موارد التجديف
  isBeforeContent: false
  columns: 2
  items:
    - title: كتالوج المنتجات لعام 2026 SUP
      description: 'Paddle Board Overstock SUP المجموعة الكاملة: لوحات شاملة، سلاسل فنية، وإكسسوارات، مع المواصفات الكاملة ومحتويات الحزمة. صيغة PDF.'
      icon: tabler:file-text
    - title: دليل المشتري القابل للنفخ SUP
      description: 'كيفية اختيار لوحك الأول: الطول، العرض، السماكة، الحجم، تطابق وزن الراكب، وأي شكل لوح يناسب أسلوب التجديف الخاص بك.'
      icon: tabler:file-description
    - title: SUP دليل المقاسات والملاءمة
      description: طابق حجم وأبعاد اللوحة مع وزنك ومستوى مهارتك، مع توصيات خاصة بالأنشطة الترفيهية، والجولات، واليوغا، واللياقة البدنية.
      icon: tabler:clipboard-check
    - title: دليل العناية بالألواح والصيانة
      description: 'حافظ على لوحك كالجديد: التنظيف، التجفيف، التخزين، UV الحماية، العناية بالصمامات، وتعليمات الإصلاح البسيطة.'
      icon: tabler:tool
    - title: دليل مواد الألواح القابلة للنفخ
      description: PVC البناء، drop-stitch النوى، EVA وسادات السطح، وما PSI تعنيه صلابة 15 للأداء والمتانة.
      icon: tabler:files
    - title: البدء مع SUP
      description: 'أساسيات التجديف لأول مرة: النفخ، الحمل، الإطلاق، الضربات الأساسية، وأساسيات السلامة لجعلك واقفا في اليوم الأول.'
      icon: tabler:swimming
faqs:
  title: الأسئلة الشائعة
  subtitle: أسئلة شائعة حول ألوابنا، والطلب، والصعود إلى الماء.
  columns: 2
  items:
    - title: ما الذي يتضمنه لوحتي؟
      description: تشمل كل حزمة كاملة اللوح، المجداف القابل للتعديل، مضخة عالية التدفق، المقود، طقم الإصلاح، وحقيبة الظهر. مجموعة المجاديف والمضخات متوفرة أيضا بشكل منفصل.
      icon: tabler:package
    - title: كم يستغرق التضخم؟
      description: مع المضخة عالية التدفق المرفقة، يصل معظم المجدفين إلى الضغط الكامل خلال 8-12 دقيقة. تعمل المضخات الكهربائية أيضا — فقط توقف عند الضغط المصنف المطبوع بالقرب من الصمام.
      icon: tabler:clock
    - title: كيف أختار اللوح المناسب؟
      description: 'ابدأ بوزنك وأسلوب التجديف: المبتدئون والعائلات يحبون المنصات الواسعة والثابتة مثل SUP Explorer 11؛ المجدفون في اليوغا يفضلون التماسك الكامل على سطح اللعبة؛ والمتجولون يفضلون أشكالا صلبة وانسيابية. فريقنا سعيد بالتوصية.'
      icon: tabler:help-circle
    - title: ما هي طرق الدفع التي تقبلها؟
      description: نقبل بطاقات الائتمان الكبرى، وPayPal، والتحويلات البنكية. تشمل جميع الأسعار الباقة الكاملة — دون إضافات مخفية.
      icon: tabler:currency-dollar
    - title: كم من الوقت يستغرق التسليم؟
      description: تشحن الطلبات من مصنعنا وتصل عادة خلال 5-10 أيام عمل حسب منطقتك. يتم توفير تتبع لكل طلب.
      icon: tabler:truck-delivery
    - title: هل لوحتي مغطاة بالضمان؟
      description: نعم — كل لوح مغطى ضد عيوب التصنيع، ويتم اختبار كل وحدة تحت الضغط حتى 1.25 ضعف ضغطها المقدر لمدة 24-48 ساعة قبل مغادرة المصنع. معدل مطالبات الضمان لدينا أقل من 2%.
      icon: tabler:shield-check
cta:
  title: هل تحتاج مساعدة في العثور على اللوح المناسب؟
  subtitle: تواصل مع فريقنا للحصول على نصائح صادقة حول اختيار اللوح، تحديد الحجم، أو أسئلة الطلب.
  actions:
    - variant: primary
      text: تواصل مع فريقنا
      href: /contact
