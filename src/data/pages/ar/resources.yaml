hero_text:
  tagline: الموارد
  title: 'مركز التنزيلات وأدلة المشترين'
  subtitle: 'احصل على كتالوجات المنتجات وأدلة OEM وقوائم التحقق الخاصة بالمشترين والوثائق التقنية لمساعدتك على اتخاذ قرارات شراء مدروسة.'
features3_downloads:
  tagline: التنزيلات
  title: 'وثائق المنتجات<br />وموارد المشترين'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'كتالوج المنتجات البحرية 2026'
      description: 'التشكيلة الكاملة للمنتجات بما فيها قوارب RIB والقوارب القابلة للنفخ ولوحات SUP وزوارق الكاياك والملحقات. المواصفات والتكوينات والخيارات. بصيغة PDF.'
      icon: tabler:file-text
    - title: 'دليل التصنيع OEM'
      description: 'كل ما تحتاج معرفته عن شراكات OEM/ODM: نظرة عامة على العملية، وكميات الطلب الأدنى، وخيارات التخصيص، ومراقبة الجودة، والشحن.'
      icon: tabler:building-factory
    - title: 'دليل شراء قوارب RIB'
      description: 'كيفية اختيار قارب RIB المناسب: مواد البدن، مواد الأنابيب، اختيار المحرك، اعتبارات الحجم وخيارات التكوين للاستخدامات المختلفة.'
      icon: tabler:file-description
    - title: 'قائمة التحقق لمورّد SUP'
      description: 'اعتبارات رئيسية عند اختيار مصنع لوحات SUP: مؤشرات الجودة، متطلبات الشهادات، اعتبارات MOQ، وما يجب البحث عنه في تدقيق المصنع.'
      icon: tabler:clipboard-check
    - title: 'دليل مواد القوارب القابلة للنفخ'
      description: 'PVC مقابل Hypalon: مقارنة المتانة ومقاومة الأشعة فوق البنفسجية والعمر الافتراضي وخيارات الإصلاح واعتبارات التكلفة للاستخدامات البحرية المختلفة.'
      icon: tabler:files
    - title: 'قالب موجز التصنيع المخصص'
      description: 'نزّل قالب موجز المنتجات لدينا. املأ متطلباتك وأعده إلينا للحصول على عرض سعر خلال نفس الأسبوع وتقييم الجدوى.'
      icon: tabler:template
faqs:
  title: الأسئلة الشائعة
  subtitle: 'أسئلة شائعة حول منتجاتنا وعملية التصنيع ونموذج الشراكة.'
  columns: 2
  items:
    - title: ما هي كمية الطلب الأدنى؟
      description: 'تتفاوت كمية الطلب الأدنى حسب فئة المنتج. تبدأ قوارب RIB عادةً من 10 وحدات لكل طراز، ولوحات SUP من 50 وحدة. تواصل مع فريق المبيعات لدينا للحصول على معلومات MOQ الخاصة بكل منتج.'
      icon: tabler:help-circle
    - title: هل يمكنني الحصول على عينات قبل تقديم الطلب؟
      description: 'نعم. تقدم Aquafarer إنتاج عينات للتقييم قبل الإنتاج بالجملة. تكاليف العينات قابلة للتفاوض وتُخصم غالباً من قيمة أول أمر إنتاج.'
      icon: tabler:package
    - title: ما هي شروط الدفع المتاحة؟
      description: 'الشروط القياسية: دفعة مقدمة 30% عند الطلب و70% قبل الشحن. تتوفر شروط LC للعملاء المؤهلين. تواصل مع فريقنا المالي لمناقشة الترتيبات.'
      icon: tabler:currency-dollar
    - title: كم تستغرق عملية الإنتاج؟
      description: 'المدد النموذجية: قوارب RIB من 30 إلى 45 يوماً، ولوحات SUP من 20 إلى 30 يوماً، والقوارب القابلة للنفخ من 25 إلى 35 يوماً. ويضيف التطوير المخصص 15-30 يوماً للنماذج الأولية.'
      icon: tabler:calendar-clock
    - title: ما الشهادات التي تحملها منتجاتكم؟
      description: 'شهادة CE لأسواق الاتحاد الأوروبي، وتصنيع معتمد من خفر السواحل الأمريكي، ونظام جودة ISO، والامتثال لمعيار BSCI، ومطابقة المواد للوائح REACH.'
      icon: tabler:certificate
    - title: هل تقدمون تغليفاً وعلامة تجارية مخصصة؟
      description: 'نعم. نوفر تغليفاً مخصصاً بشعاركم وألوانكم وهوية علامتكم التجارية. يختلف الحد الأدنى لكمية الطلب للتغليف المخصص حسب فئة المنتج.'
      icon: tabler:color-swatch
cta:
  title: 'هل تحتاج إلى مساعدة في العثور على المورد المناسب؟'
  subtitle: 'تواصل مع فريقنا للحصول على إرشادات مخصصة حول اختيار المنتجات أو شراكات OEM أو المواصفات التقنية.'
  actions:
    - variant: primary
      text: تواصل مع فريقنا
      href: /contact
