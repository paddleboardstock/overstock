timeline:
  - year: '2012'
    title: مؤسسة التصنيع البحري
    body: Paddle Board Overstock بدأت كورشة متخصصة لألواح المجاديف المطاطية في ويهاي، الصين، ملتزمة بالحرف البحرية وتصنيع الألواح. كان التركيز المبكر على بناء منتجات قابلة للنفخ موثوقة من خلال الخبرة الهندسية العملية وانضباط التصنيع.
  - year: '2015'
    title: أولى الصادرات
    body: وصلت طلبات التصدير الأولية إلى اليابان وكوريا، مما Paddle Board Overstock شكل دخول الأسواق الدولية. بدأت الشركة في خدمة المجدفين وعشاق الرياضات المائية خارج الصين.
  - year: '2018'
    title: توسيع المصنع
    body: تم نقله إلى منشأة إنتاج بمساحة 12,000 متر مربع. أضيفت خطوط لحام RF drop-stitch وقدرة إنتاجية، مما مكن من تصنيع أوسع وتحسين أنظمة مراقبة الجودة.
  - year: '2020'
    title: إنشاء مركز البحث والتطوير
    body: افتتح مركز بحث وتطوير مخصص يضم PVC مختبر أقمشة، خزان اختبار هيدروديناميكي، واستوديو محاكاة CAD/FEA. توسع تطوير المنتجات ليركز على البناء الخفيف، وتحسين المتانة، والتصميم المرتكز على المستخدم.
  - year: '2022'
    title: النمو العالمي
    body: توسعت إلى 14 مهندس بحث وتطوير و200+ عامل. وصلت الألواح إلى المجدفين في أوروبا والأمريكتين وآسيا والمحيط الهادئ، وشحنت إلى 50+ دولة.
  - year: '2024'
    title: استوديو الابتكار والتصميم
    body: أطلقنا استوديو تصميم وابتكار متكامل الخدمات لسلاسل الألواح الجديدة، من الفكرة إلى الإنتاج. وسعنا مجموعات اللوحات الفنية المميزة ومنصات الجولات.
  - year: '2026'
    title: بناء مستقبل استكشاف المياه
    body: اليوم، Paddle Board Overstock تواصل تطوير الألواح القابلة للنفخ SUP ، ومعدات التجديف، والحلول البحرية المخصصة — مما يربط الأفراد والمنظمات بمياه العالم. خدم 50+ دولة، بسعة سنوية تبلغ 15,000 وحدة.
content_founding:
  tagline: البداية
  title: ولدت على الواجهة البحرية
  subtitle: 'Paddle Board Overstock بدأ في ورشة ساحلية في ويهاي مع لوح واحد ورؤية: بناء ألواح تجديف قابلة للنفخ يمكنها التعامل مع الظروف البحرية الحقيقية.'
  paragraphs:
    - في عام 2012، لاحظ مؤسسونا فجوة في السوق — حيث كانت معظم الألواح القابلة للنفخ إما ميسورة التكلفة لكنها غير موثوقة، أو عالية الجودة لكنها باهظة الثمن. كانوا يعتقدون أن هناك مجالا لمصنع يقدم الجودة والقيمة معا.
    - تم بناء الهيكل الأول يدويا، واختباره في المياه المحلية، وتحسينه بناء على ردود فعل حقيقية من الصيادين والمشغلين التجاريين الصغار. تظل حلقة التغذية الراجعة — البناء، الاختبار، الاستماع، التحسين — في صميم فلسفتنا الهندسية اليوم.
    - بحلول عام 2015، انتشرت الأخبار إلى ما وراء ويهاي. بدأ المجدفون ومتاجر الرياضات المائية في آسيا بطلب الألواح. ما بدأ كورشة محلية أصبح علامة تجارية عالمية.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock ورشة الإنتاج المبكرة والتصنيع
content_growth:
  tagline: النمو والابتكار
  title: من ورشة عمل إلى منشأة بمساحة 12,000 متر مربع
  subtitle: تحول الاستثمار المستمر في الأفراد والمعدات والعمليات Paddle Board Overstock إلى منشأة تصنيع بحرية حديثة.
  paragraphs:
    - ومع تزايد الطلب، ازداد أيضا منشأتنا. توسعنا من ورشة صغيرة إلى مصنع بمساحة 12,000 متر مربع مع خطوط إنتاج مخصصة SUP للألواح والإكسسوارات ومعدات السلامة.
    - استثمرنا في CNC آلات القطع، ومعدات اللحام عالية التردد، وخطوط إنتاج الغرز المنخفضة، وأجهزة اختبار شاملة — مما أتاح لنا التحكم في كل جانب من جوانب جودة الإنتاج.
    - اليوم، يضم فريقنا المكون من 200 إلى 300 مهندسين بحريين، وعلماء مواد، ومتخصصين في مراقبة الجودة، وحرفيين مهرة — العديد منهم يعملون Paddle Board Overstock منذ الأيام الأولى.
founder:
  tagline: تعرف على المؤسس
  title: بناه رجل الماء
  subtitle: يجمع المؤسس ديفيد تشين بين خبرة التصنيع وشغفه الدائم بالرياضات المائية — وهو مزيج يحدد كيفية Paddle Board Overstock التعامل مع تطوير المنتجات.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: ديفيد تشين — مؤسس Paddle Board Overstock
  story:
    - نشأ ديفيد تشين على ساحل ويهاي، حيث لم يكن البحر وجهة عطلات بل أسلوب حياة. قضى شبابه في التجديف والإبحار وصيد الأسماك في البحر الأصفر — تجارب منحته فهما حدسيا لما يجب أن تتحمله ألواح التجديف.
    - قبل تأسيسه Paddle Board Overstock، قضى ديفيد عقدا من الزمن في التصنيع البحري، حيث عمل في مجالات الإنتاج والجودة والتجارة الدولية. قاد برامج الإنتاج والجودة للأسواق الأوروبية والأمريكية الشمالية، وتعلم توقعات المجدفين العالميين عن كثب.
    - 'في عام 2012، أسس Paddle Board Overstock بمهمة بسيطة: بناء ألواح تجديف قابلة للنفخ يثق بها مع عائلته على الماء. ذلك المعيار الشخصي — هل سأستخدم هذا؟ — يظل الاختبار النهائي لكل منتج يخرج من المصنع.'
    - اليوم، يقود ديفيد استراتيجية المنتج ويشرف على فريق البحث والتطوير، حيث يراجع شخصيا التصاميم الجديدة ويختبر النماذج الأولية في مياه ويهاي. يؤمن بأن المنتجات الرائعة تأتي من فهم الهندسة والتجربة معا.
philosophy:
  tagline: فلسفة العلامة التجارية
  title: حرية الهندسة على الماء
  body: الحرية على الماء ليست فقط عن الحركة. إنها تمثل اكتشاف أماكن جديدة، وخلق تجارب خارجية، وربط الناس بالطبيعة، وتمكين المهام المهنية. الهندسة تجعل هذه الحرية ممكنة.
  pillars:
    - title: الموثوقية أولا
      body: تتطلب بيئات المياه الثقة.Paddle Board Overstock تم تصميم المنتجات حول الاستقرار، والمتانة، والسلامة، والأداء المتسق.
    - title: التصميم المتمحور حول الإنسان
      body: يجب أن تخدم المنتجات الناس، لا التكنولوجيا. كل قرار تصميم يبدأ بفهم كيفية استخدام الناس لوحاتهم، وأين يستكشفون، وما هي التحديات التي يواجهونها.
    - title: الاستكشاف المتاح
      body: يجب ألا يكون الماء ملكا للخبراء فقط.Paddle Board Overstock يبتكر معدات تتيح لعدد أكبر من الناس تجربة الأنهار والبحيرات والمحيطات والبيئات الساحلية بأمان.
    - title: الابتكار المستمر
      body: الابتكار ليس مجرد ابتكار منتجات جديدة. بل هو تحسين كل تفصيل — المواد، الهياكل، التصنيع، وتجربة المستخدم.
engineeringDna:
  tagline: الهندسة في الجينات
  title: كيف Paddle Board Overstock يبتكر المنتجات
  areas:
    - title: علوم المواد
      body: يركز Paddle Board Overstock على اختيار المواد المناسبة لبيئات بحرية مختلفة. تشمل الاعتبارات الرئيسية مقاومة التآكل، مقاومة UV، استقرار الضغط، والمتانة على المدى الطويل.
      items:
        - مقاومة التآكل
        - مقاومة UV
        - استقرار الضغط
        - المتانة طويلة الأمد
    - title: الهندسة الإنشائية
      body: تتطلب ألواح التجديف القابلة للنفخ توازناً دقيقاً بين الصلابة، الوزن، قابلية الحمل، والاستقرار. تركز هندسة Paddle Board Overstock على تحسين هذه العوامل من خلال تقنية الجوهر drop-stitch وبناء اللحامات المتقدمة.
      items:
        - الصلابة
        - تحسين الوزن
        - قابلية الحمل
        - الاستقرار
    - title: دقة التصنيع
      body: 'يمر كل منتج بعمليات محكومة: تجهيز المواد، القطع الدقيق، اللحام واللاصق، التجميع، فحص الجودة، والتحقق من الأداء.'
      items:
        - تجهيز المواد
        - القطع الدقيق
        - اللحام والربط
        - التجميع وفحص الجودة
    - title: هندسة سيناريو المستخدم
      body: يتم تطوير المنتجات حول تطبيقات التجديف الواقعية — الترفيه، المغامرة، العائلة، والجولات — لضمان أن كل تصميم يلبي متطلبات البيئة المقصودة.
      items:
        - الترفيه
        - المغامرة
        - العائلة
        - الجولات
