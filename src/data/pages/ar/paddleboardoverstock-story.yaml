hero:
  tagline: قصتنا
  title: Paddle Board Overstock — حرية الهندسة على الماء
  subtitle: 'من ورشة ساحلية إلى مصنع بحري عالمي — رحلتنا مبنية على إيمان عنيد: يجب تصميم ألواح التجديف كما لو كانت مهمة، لأنها كذلك.'
  image:
