hero:
  tagline: الشراكات والتوزيع
  title: 'كن شريكًا لـ Aquafarer<br />— شبكة توزيع عالمية'
  subtitle: "انضم إلى شبكة الشركاء العالمية لـ Aquafarer. نتعامل مع موزعي معدات الرياضات المائية وتجار القوارب ومتاجر تجزئة المعدات وشركاء العلامات التجارية في أكثر من 50 دولة."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: شبكة الشركاء والموزعين العالمية من Aquafarer
content_programs:
  tagline: برامج الشراكة
  title: 'برامج شراكة<br />مصممة للنمو'
  subtitle: 'سواء كنت موزعًا أو تاجر تجزئة أو شريك علامة تجارية، تقدم Aquafarer برامج مصممة لدعم عملك.'
  columns: 3
  items:
    - title: برنامج الموزعين
      description: 'توزيع إقليمي حصري مع أسعار الكميات ودعم تسويقي ووصول مباشر إلى المصنع. الحد الأدنى من الالتزام مطلوب بناءً على حجم المنطقة.'
      icon: tabler:world
    - title: برنامج الوكلاء
      description: 'أسعار مباشرة للتجار، وتدريب على المنتجات، ومواد تسويقية، ودعم ضمان للمتاجر الفعلية والمتاجر الإلكترونية.'
      icon: tabler:building-store
    - title: شراكة OEM/ODM
      description: 'تصنيع OEM وODM متكامل مع علامة تجارية مخصصة وتغليف ومواصفات منتج مخصصة. من الفكرة إلى الحاوية.'
      icon: tabler:certificate
    - title: شراكة العلامة التجارية
      description: 'برامج العلامات المشتركة والعلامات الخاصة والطرازات الحصرية للعلامات التجارية الراسخة في مجال الرياضات المائية والترفيه في الهواء الطلق.'
      icon: tabler:stars
    - title: 'الجهات الحكومية والمؤسسية'
      description: 'برامج مورّد مفضل للجهات الحكومية وخفر السواحل والجيش والمنظمات الإنسانية. توثيق جاهز للمناقصات.'
      icon: tabler:building-community
    - title: 'شريك المنتجعات والتأجير'
      description: 'أسعار الأسطول وجودة متسقة وعلامة تجارية مخصصة للمنتجعات ومراكز الغطس وعمليات التأجير في جميع أنحاء العالم.'
      icon: tabler:sun
content_benefits:
  tagline: لماذا الشراكة معنا
  title: 'لماذا يختار الشركاء Aquafarer'
  subtitle: 'يستفيد شركاؤنا من قدرة تصنيع حقيقية وجودة متسقة ودعم سريع الاستجابة.'
  list:
    - 'وصول مباشر إلى المصنع: اعمل مباشرة مع فريق التصنيع لدينا — بدون وسطاء. احصل على ردود أسرع وأسعار أفضل ورؤية كاملة للإنتاج.'
    - 'جاهز للتخصيص: ضع علامتك التجارية على منتجاتك بألوان وشعارات وتغليف ومواصفات مخصصة. كميات طلب أدنى مصممة وفقًا لسوقك.'
    - 'جودة مضمونة: إنتاج معتمد ISO 9001 مع توافق CE وUKCA وBSCI. كل منتج يُختبر قبل الشحن.'
    - 'خدمات لوجستية عالمية: الشحن من تشينغداو، الصين بخيارات FOB وCIF وDDP. مستودع في الولايات المتحدة بمونتكلير، كاليفورنيا للتوزيع في أمريكا الشمالية.'
    - 'دعم تسويقي: كتالوجات المنتجات والتصوير الفوتوغرافي والتوثيق الفني والأصول الرقمية لدعم جهودك البيعية.'
    - 'تدريب ودعم: تدريب على المنتجات لفريق المبيعات لديك، ودعم فني لعملائك، وتنسيق خدمات الضمان.'
content_process:
  tagline: كيف تصبح شريكًا
  title: 'عملية شراكة بسيطة'
  subtitle: 'عملية الشراكة لدينا مباشرة — مصممة لتبدأ بيع منتجات Aquafarer بسرعة.'
  items:
    - title: 'الخطوة 1: تقديم الطلب'
      description: 'أكمل نموذج طلب الشراكة مع ملف شركتك والسوق المستهدف والمنتجات التي تهمك.'
    - title: 'الخطوة 2: مراجعة التأهيل'
      description: 'يراجع فريق الشراكات لدينا طلبك ويتواصل معك خلال 3 أيام عمل لمناقشة الفرص.'
    - title: 'الخطوة 3: الاتفاقية والإعداد'
      description: 'وقّع اتفاقية الشراكة، وأعد حسابك، واستلم أسعار الشريك والمواد التسويقية وعينات المنتجات.'
    - title: 'الخطوة 4: التدريب والإطلاق'
      description: 'تدريب على المنتجات ودعم للمبيعات ومواد تسويقية جاهزة. أنت جاهز لبدء البيع.'
cta:
  title: 'هل أنت مستعد لتصبح شريكًا لـ Aquafarer؟'
  subtitle: 'قدّم طلب شراكة وسيرد فريقنا خلال 3 أيام عمل.'
  actions:
