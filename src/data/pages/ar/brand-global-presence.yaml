features3_markets:
  tagline: الأسواق الرئيسية
  title: 'خبرة إقليمية<br />لمتطلبات محلية'
  subtitle: 'ندرك أن الأسواق المختلفة لها متطلبات تنظيمية وتفضيلات وحالات استخدام مختلفة.'
  isBeforeContent: false
  columns: 4
  items:
    - title: أوروبا والمملكة المتحدة
      description: 'منتجات معتمدة بشهادة CE وتتوافق مع معايير EN ISO 6185. طلب قوي على قوارب RIB والقوارب القابلة للنفخ ولوحات SUP في أسواق الاتحاد الأوروبي. يقدّر الموزعون البريطانيون سرعة استجابتنا.'
      icon: tabler:map-pin
    - title: أمريكا الشمالية
      description: 'تصنيع معتمد من خفر السواحل الأمريكية. مستودع في الولايات المتحدة بمونتكلير، كاليفورنيا لتسليم سريع على الساحل الغربي. طلب متنامٍ على قوارب الصيد وقوارب الإنقاذ ولوحات SUP الترفيهية.'
      icon: tabler:map-pin
    - title: أستراليا وأوقيانوسيا
      description: 'سوق قوي لقوارب RIB والقوارب المساعدة القابلة للنفخ. يقدّر الموزعون الأستراليون قوارب Hypalon لدينا لمقاومتها للأشعة فوق البنفسجية تحت شمس قاسية. شحن سريع من منشأتنا في آسيا.'
      icon: tabler:map-pin
    - title: الشرق الأوسط
      description: 'طلب متنامٍ على قوارب الدورية والإنقاذ. قوارب RIB بهيكل ألمنيوم تحظى بشعبية لدى مشغّلي خفر السواحل والأمن. تكوينات مخصصة للبيئات عالية الحرارة.'
      icon: tabler:map-pin
features3_distribution:
  tagline: شبكة التوزيع
  title: 'شراكات مع الموزعين<br />حول العالم'
  subtitle: 'نتعاون مع موزعي معدات بحرية راسخين وعلامات OEM وجهات الشراء الحكومية.'
  isBeforeContent: false
  columns: 3
  items:
    - title: شراكات OEM/ODM
      description: 'تصنيع بعلامة خاصة للعلامات العالمية للرياضات المائية. نتولى كل شيء من التصميم إلى الإنتاج إلى الشحن المباشر.'
      icon: tabler:building
    - title: شبكة الموزعين
      description: 'موزعون معتمدون في أكثر من 20 دولة يحتفظون بالمخزون ويقدمون الدعم المحلي. نرحب باستفسارات الموزعين الجدد.'
      icon: tabler:users
    - title: الحكومة والمؤسسات
      description: 'توريد مباشر لخفر السواحل ومنظمات البحث والإنقاذ وبرامج المشتريات العسكرية. التوافق مع متطلبات المشتريات المؤسسية.'
      icon: tabler:building-community
steps2_logistics:
  title: 'الخدمات اللوجستية والدعم العالمي'
  subtitle: 'من المصنع إلى الوجهة — ندير سلسلة التوريد بأكملها.'
  items:
    - title: خيارات الشحن
      description: 'الشحن البحري (FOB تشينغداو)، والشحن الجوي للطلبات العاجلة، وخدمة البريد السريع للعينات وقطع الغيار.'
      icon: tabler:truck-delivery
    - title: مستودع الولايات المتحدة
      description: 'مخزون في مونتكلير، كاليفورنيا للتسليم السريع في جميع أنحاء أمريكا الشمالية. الساحل الغربي: 2-3 أيام، الوسط: 3-4 أيام، الساحل الشرقي: 4-5 أيام.'
      icon: tabler:building-warehouse
    - title: قطع الغيار
      description: 'قطع غيار ومستهلكات Paddle Board Overstock الأصلية متوفرة طوال العام. القطع الشائعة تُشحن خلال 24 ساعة.'
      icon: tabler:package
    - title: الدعم الفني
      description: 'خط مباشر مع فريقنا الهندسي للأسئلة التقنية ونصائح الإصلاح ودعم التجديد. ندعم القوارب التي بنيناها قبل 20 عامًا.'
      icon: tabler:headset
cta:
  title: 'هل ترغب في أن تصبح موزعًا؟'
  subtitle: 'نوسّع شبكة التوزيع لدينا بفاعلية. تواصل مع فريق التصدير لدينا لمناقشة فرص الشراكة.'
  actions:
    - variant: primary
      text: استفسار عن شراكة
      href: /contact
    - text: استعرض تشكيلة منتجاتنا
      href: /products
