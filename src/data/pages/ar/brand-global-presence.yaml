hero:
  tagline: حضور عالمي
  title: 'نخدم أكثر من 50 دولة<br />في كل قارة'
  subtitle: 'من مشغّلي الدوريات الساحلية الأوروبيين إلى موزعي الرياضات المائية الأستراليين وفرق الإنقاذ في الشرق الأوسط — قوارب Paddle Board Overstock تبحر في جميع أنحاء العالم.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: التصنيع والتوزيع البحري العالمي من Paddle Board Overstock
stats:
  title: انتشار عالمي
  stats:
    - title: الدول
