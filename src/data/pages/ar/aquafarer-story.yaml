hero:
  tagline: قصتنا
  title: Aquafarer — هندسة الحرية على الماء
  subtitle: 'من ورشة ساحلية إلى شركة تصنيع بحرية عالمية — رحلتنا مبنية على إيمان راسخ: يجب أن تُصمم القوارب كما لو كانت مهمة، لأنها كذلك.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: مصنع Aquafarer ومنشأة التصنيع البحري في تشينغداو
