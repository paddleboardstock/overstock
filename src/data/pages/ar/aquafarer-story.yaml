founder:
  tagline: تعرف على المؤسس
  title: بناه رجل الماء
  subtitle: يجمع المؤسس ديفيد تشين بين خبرة التصنيع والشغف الدائم بالرياضات المائية - وهو مزيج يحدد كيفية تعامل Aquafarer مع تطوير المنتج.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: ديفيد تشين — مؤسس Aquafarer
  story:
    - نشأ ديفيد تشين على ساحل Qingdao، حيث لم يكن البحر وجهة لقضاء العطلات بل أسلوب حياة. لقد أمضى شبابه في التجديف بالكاياك والإبحار وصيد الأسماك في البحر الأصفر، وهي تجارب منحته فهمًا بديهيًا لما تحتاج المراكب المائية إلى تحمله.
    - قبل تأسيس Aquafarer، أمضى ديفيد عقدًا من الزمن في التصنيع البحري، حيث عمل في مجالات الإنتاج والجودة والتجارة الدولية. لقد أدار برامج OEM للعلامات التجارية الأوروبية وأمريكا الشمالية، وتعلم معايير وتوقعات الأسواق العالمية بشكل مباشر.
    - 'في عام 2012، أسس Aquafarer بمهمة بسيطة: بناء مركبة مائية قابلة للنفخ يمكن أن يثق بها مع عائلته على الماء. هذا المعيار الشخصي – هل سأستخدمه؟ - يبقى الاختبار النهائي لكل منتج يخرج من المصنع.'
    - اليوم، يقود ديفيد استراتيجية المنتج ويشرف على فريق البحث والتطوير، ويقوم شخصيًا بمراجعة التصميمات الجديدة واختبار النماذج الأولية على المياه قبالة Qingdao. وهو يعتقد أن المنتجات الرائعة تأتي من فهم كل من الهندسة والخبرة.

