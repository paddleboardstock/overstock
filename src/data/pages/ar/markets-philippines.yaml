hero:
  tagline: الفلبين
  title: الألواح بالجملة SUP<br />الأعمال التجارية الفلبينية
  subtitle: منتجعات الجزر، نوادي الشاطئ، ومشغلو التجديف من إل نيدو وسيارغاو إلى بوراكاي — ألواح جديدة كليا من 5 وحدات، نماذج مختلطة، شحنت من الصين.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: ألواح التخزين SUP الزائد لمنتجعات الجزر الفلبينية ومشغلي التجديف
direct_answer: Paddle Board Overstock يزود الشركات الفلبينية بألواح قابلة للنفخ جديدة وفائضة المخزون SUP — منتجعات الجزر في بالاوان وسيارغاو، نوادي الشاطئ في بوراكاي وسيبو، ومنظمي التأجير والسياحات، وتجار التجزئة الصغار. تبدأ طلبات الجملة من 5 ألواح مع نماذج مختلطة في شحنة واحدة، ترسل من ويهاي، الصين عبر الشحن الجوي السريع أو الشحن البحري الموحد. كل لوحة تختبر 100٪ من حيث الضغط ومغطاة بضمان لمدة سنتين SUP .
tldr_points:
  - الجملة ابتداء من 5 ألواح — نماذج مختلطة، السعر حسب إجمالي الكمية
  - خدمة المنتجعات الجزرية والنوادي الشاطئية عبر أرخبيل الفلبين
  - شحن جوي سريع أو شحن بحري موحد من ويهاي، الصين
  - اختبار الضغط 100%، وضمان SUP لمدة سنتين على كل لوح
overview_section:
  tagline: نظرة عامة على السوق
  title: السوق الفلبيني SUP
  paragraphs:
    - مع أكثر من سبعة آلاف جزيرة، تبنى الفلبين للتجديف الواقف. بحيرات إل نيدو وكورون، ومشهد ركوب الأمواج والجزر الهادئ في سيارغاو، وطاقة نوادي الشاطئ في بوراكاي، واقتصاد الغوص والرياضات المائية في سيبو كلها تخلق طلبا ثابتا — من السياح الذين يركبون التجديف عند شروق الشمس في بحيرة حجرية إلى بناء SUP مجتمعات لياقة بدنية ويوغا في مانيلا وخارجها.
    - The buyers are typically resort and tour operators: منتجعات الجزيرة تضيف نشاطا للضيوف لا يحتاج إلى وقود، ولا محرك، ولا ترخيص؛ ومنظمو الرحلات المتنقلين بين الجزر الذين يوسعون عرضهم؛ ومتاجر صغيرة تخدم مجتمع التجديف المحلي. الطلبات صغيرة — من 5 إلى 20 لوحا — ومختلطة بين ألواح شاملة مستقرة للمبتدئين وبعض الإصدارات المميزة للمظهر الواجهة للمنتجع.
  customer_types:
    - title: منتجعات الجزيرة
      description: أضافت منتجعات بالاوان وسيارغاو وبوراكاي SUP برامج ضيوف بأساطيل مختلطة مدمجة.
    - title: منظمو الرحلات
      description: أضاف منظمو التنقل بين الجزر وجولات البحيرات محطات تجديف إلى مساراتهم.
    - title: المحلات والمدارس المحلية
      description: مدارس ومتاجر مقرها المدينة تخدم مجتمع التجديف واليوغا المتنامي في الفلبين SUP .
shipping_section:
  title: السفينة إلى الفلبين
  paragraphs:
    - ترسل الطلبات من ويهاي، الصين. الشحن الجوي السريع ينقل عينات وطلبات لوح 1–3 بسرعة إلى مانيلا وسيبو؛ تخدم شركة الشحن البحري الموحدة طلبات الجملة من 5 إلى 20 لوحا عبر مانيلا وموانئ فلبينية أخرى. تقديرات النقل لوجهتك — مترو مانيلا أو المقاطعة — مدرجة في عرض سعرك.
    - نوفر متطلبات التخليص من قوائم التعبئة، مع رموز HS الصحيحة والقيم المعلنة. تدفع الرسوم والضرائب على الاستيراد بموجب القواعد الفلبينية.
  customs_note: بالنسبة للوجهات الإقليمية، يتم عرض التسليم النهائي من الميناء أو المطار كجزء من تقدير التوصيل من باب إلى باب. تأكد من معالجة الرسوم الحالية للمعدات الرياضية مع وسيطك؛ نحن نوفر الوثائق الكاملة.
faq_section:
  title: الأسئلة الشائعة عن الفلبين
  items:
    - q: كم يستغرق الشحن إلى الفلبين؟
      a: يعتمد ذلك على الطريقة. الشحن الجوي السريع إلى مانيلا أو سيبو هو الخيار الأسرع للعينات و1–3 طلبات من المجلس؛ الشحن البحري الموحد يناسب 5–20 طلبات بالجملة على لوح ويتم عرضه مع نافذة عبور لميناءك. يتم تفصيل كلا التقديرين في عرض السعر قبل الالتزام.
    - q: هل يمكن للألواح الوصول إلى جزر إقليمية مثل بالاوان أو سيارغاو؟
      a: نعم — يتم اقتباس تكلفة التوصيل من الباب إلى الباب إلى الوجهات الإقليمية كجزء من تقدير الشحن، باستخدام الخدمات اللوجستية المحلية من ميناء الوصول أو المطار. لاحظ التقدير والخيارات في استفسارك وسنقوم بتسعيرها بشكل محدد.
    - q: كيف يبدو أسطول البداية في المنتجع؟
      a: 'عادةً 5–10 ألواح: نماذج مستقرة شاملة للدروس الضيفية والتجديف الحر، بالإضافة إلى واحدة أو اثنتين من الإصدارات الفنية المميزة لشاطئ البحر. نماذج مختلطة، شحنة واحدة، يتم تحديد السعر حسب الكمية الإجمالية.'
    - q: هل اللوحات مناسبة لاستخدام البحيرة والشعاب المرجانية؟
      a: نعم — الظروف الهادئة والضيقة والمياه الدافئة هي بالضبط ما صُممت من أجله جميع ألواح SUP القابلة للنفخ، والزعنفة المرنة والبنية المتينة لـ drop-stitch تتعامل جيدًا مع الهبوط على الشعاب المرجانية والغطس على الشاطئ.
