features3_cases:
  tagline: القصص المميزة
  title: اللوحات الحقيقية<br />للمغامرات الحقيقية
  isBeforeContent: false
  columns: 3
  items:
    - title: من الأريكة إلى الوقوف في المحاولة الأولى
      customer: مجدف لأول مرة
      country: ألمانيا
      industry: الترفيه للمبتدئين
      challenge: لم تكن آنا قد جدفت من قبل وكانت قلقة بشأن التوازن، والماء البارد، والظهور بمظهر أحمق أمام الآخرين. وبما أنها تعيش في شقة صغيرة في ميونيخ، لم يكن لديها مكان لتخزين لوح صلب ولا رف للسقف.
      solution: SUP تقدم إكسبلورر 11 منصة واسعة ومستقرة تغفر عن الضربات الأولى المتذبذبة. الحزمة الكاملة — لوح، مجداف قابل للتعديل، مضخة، رباط، وحقيبة — سمحت لها بحمل كل شيء إلى البحيرة سيرا على الأقدام. من الصندوق إلى الماء في أقل من 20 دقيقة، دون الحاجة إلى خبرة.
      product: SUP إكسبلورر 11
      results: وقفت آنا في محاولتها الأولى وتجدفت لمدة ساعة دون أن تسقط. بعد شهرين، تجدف ثلاث مرات في الأسبوع وانضمت إلى مجموعة لقاء محلية. تجمع اللوح في حقيبة ظهر تتسع في خزانة الممر الخاصة بها.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: كنت أتوقع أن أقضي أول يوم لي أسبح بجانب اللوح. لكن بدلا من ذلك، كنت أتحرك عبر البحيرة خلال دقائق — لم أصدق مدى استقرارها.
      icon: tabler:school
    - title: لوحة واحدة، طفلان، لا شكاوى
      customer: عائلة مكونة من أربعة أفراد
      country: إيطاليا
      industry: الترفيه العائلي
      challenge: ماركو وجوليا أرادوا نشاطا صيفيا يترك أطفالهما شاشاتهما من أجله. كانت الألواح القابلة للنفخ الرخيصة السابقة تتشوه، وتتسرب من الفواصل، وتنفد الهواء أثناء التجديف — فقد الأطفال ثقتهم بعد سباحة سيئة.
      solution: تقدم سلسلة النسيم الاستوائي لوحة عطلة كاملة للجزيرة — أشعة الشمس، بساتين جوز الهند، ومشاهد الشاطئ — جعلت الأطفال يرغبون في الصعود إلى الماء. drop-stitch يعمل النواة بثبات عند 15 PSI درجة، وكل لوح يختبر الضغط إلى 1.25 ضعف ضغطه الموصوف لمدة 24-48 ساعة في المصنع قبل الشحن.
      product: سلسلة النسيم الاستوائي
      results: العائلة الآن تجدف كل عطلة نهاية أسبوع من يونيو إلى سبتمبر. بعد موسم كامل من حركة الأطفال، لا يظهر على اللوح أي ضغط في الخياطة أو تلاشي. بدأت ابنتهما تطلب لوحها الخاص في عيد ميلادها.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: يتشاجر الأطفال حول من يأتي دوره في التجديف. بعد الألواح الرخيصة التي جربناها سابقا، يبدو أن هذه الألواح بنيت لتبقى على قيد الحياة لعائلتنا بالضبط.
      icon: tabler:users
    - title: استوديو يوغا عائم في صن رايز
      customer: ممارس اليوغا
      country: أندونيسيا
      industry: SUP اليوغا والتأمل
      challenge: بوتو تدرس اليوغا في بالي وأرادت أن تأخذ تدريبها على الماء، لكن محاولاتها الأولى على لوح مستعار شعرت بأنها زلقة وغير مستقرة. الحفاظ على وضعية أثناء الانجراف في المياه المفتوحة يتطلب قبضة وثباتا وتصميما يبعث على الهدوء.
      solution: تجمع سلسلة اللوتس المتدفقة بين فن اللوتس، والكوي، واليعسوب مع وسادة جر منقوشة بالليزر تحافظ على تثبيت اليدين والقدمين في الكلب المنخفض. تشكل الخطوط العريضة الشاملة وسماكتها 6 إنشات منصة عائمة ثابتة للتدفقات والتأمل الجالس.
      product: سلسلة اللوتس المتدفقة
      results: بوتو الآن تقود دروس يوغا صغيرة عند شروق الشمس SUP مرتين في الأسبوع. يحجز طلابها قبل أسابيع، وأصبح المجلس علامة صفوفها — حيث يقوم العمل الفني بنصف تسويقها نيابة عنها.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: التدريب على الماء يغير كل شيء. اللوح ثابت بما يكفي لوضعية الغراب، وتصميم اللوتس يجعل كل درس يبدو وكأنه طقس.
      icon: tabler:heart
    - title: اللون المدمج في المادة — حرفيًا
      customer: منشئ محتوى السفر
      country: البرتغال
      industry: وسائل التواصل الاجتماعي وإنشاء المحتوى
      challenge: ميغيل يطلق محتوى المجاديف لكسب رزقه. الألواح المطبوعة التي كان يستخدمها سابقا فقدت لونها خلال موسم من ماء البحر والشمس — بدأت لقطاته تبدو متعبة، ولاحظ المتابعون تقشر وسادات السطح.
      solution: تقوم نسخة Cheetah Surge ببناء نسق الفهد الخاص بها من خلال تجميع قطع ملونة متعددة مقطوعة بدقة بدلاً من الحبر السطحي. الألوان جزء من الرغوة نفسها، لذا فإن مياه البحر، و UV، وحركة الأقدام أقل احتمالاً بكثير أن تسبب تلاشي التصميم أو تقشيره أو خدشه.
      product: نسخة شيتا شارج
      results: بعد عام كامل من التصوير الساحلي، تبدو اللوحة جديدة تماما على الكاميرا. أصبحت مقاطع شروق الشمس التي قام بها من ألغارف هي أفضل محتوى له على الإطلاق، وظهر اللوح نفسه في عشرات التعاونات مع العلامات التجارية.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: لوحاتي القديمة تقدمت في العمر أسرع من محتواي. يبدو الشيتا مطابقا لليوم الأول بعد عام في المحيط — متابعيني يستمرون في السؤال عن الفلتر الذي أستخدمه. ليس فلترا. إنه اللوحة.
      icon: tabler:camera
    - title: رحلات الساحل في عطلة نهاية الأسبوع
      customer: مجداف الجولات الساحلية
      country: أستراليا
      industry: التجوال والاستكشاف
      challenge: كان توم يريد التجديف في الخلجان الهادئة ورؤوس ساحل الذهب في جولات متعددة الساعات، لكن الألواح الاقتصادية الخفيفة الوزن كانت تثني أثناء الرحلة وتركته مرهقا بعد ساعة. كان بحاجة إلى صلابة يمكنه حملها منفردا إلى الرحلات البعيدة.
      solution: تجمع سلسلة أوشن فوياجر بين عمل فني لسلحفاة باللون الأزرق المخضر العميق والمرجاني مع drop-stitch نواة صلبة تحافظ على شكلها حتى خلال تموجات ساحلية خفيفة. بحوالي 20 رطلا في حقيبتها، يمكن لتوم أن تنزها إلى شواطئ لا تصل إليها سيارة، وتنفيخها بالمضخة المرفقة، وجولة لساعات.
      product: سلسلة رحالة المحيط
      results: قام توم الآن برسم خريطة لأحد عشر طريقا ساحليا، بما في ذلك عبور صباحي كامل كان يعتبر سابقا خارج نطاق مهاراته. يبقى اللوح جامدا من الإطلاق حتى الغداء، وأصبح تصميم السلحفاة البحرية توقيعه المميز على الماء.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: الألواح الصلبة تشعر وكأنها ألواح صلبة، وهذه الألواح تحمل كحقيبة ظهر. فتح لي ساحل كامل لم أستطع الوصول إليه بسيارة أو مقطورة.
      icon: tabler:compass
    - title: لياقة كاملة للجسم، بدون رسوم للنادي الرياضي
      customer: متجدف اللياقة البدنية
      country: كندا
      industry: اللياقة البدنية والتدريب
      challenge: كانت بريا تريد تمرينا كاملا منخفض التأثير لا يشعر وكأنه تمرين. الجري كان يؤلم ركبتيها، وكان الذهاب إلى النادي الرياضي متكررا — توقفت عن كل الروتين خلال ستة أسابيع.
      solution: 'حولت سلسلة دولفين ويف التمارين إلى لعب: التجديف يحرق السعرات الحرارية، ويبني قوة الجذع والكتف، ويتحدى التوازن، وكل ذلك أثناء الانحراف متجاوزا مناظر فانكوفر. السطح المستقر الذي يبلغ طوله 32 بوصة يتحمل الضربات المتعثرة مع استمرار التوازن الدقيق — صالة ألعاب رياضية متخفية في شكل لوح تجديف.'
      product: سلسلة موجات الدولفين
      results: بريا تجدف خمسة صباحات في الأسبوع قبل العمل وقد حافظت على هذا الروتين لمدة 14 شهرا — وهو رقم قياسي لها في أي خطة تمارين على الإطلاق. ينضم أصدقاؤها الآن إلى نادي التجديف الأسبوعي لديها، وركبتيها لم تكن أكثر سعادة من قبل.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: لم أضطر أبدا لإجبار نفسي على التجديف. التمرين حقيقي — توقفت عن ملاحظته لأنني كنت مشغولا جدا بالاستمتاع بالماء.
      icon: tabler:trophy
    - title: لابرادور يزن 30 كيلو وسطح واحد مستقر جدا
      customer: المجدف مع كلب
      country: الولايات المتحدة
      industry: التجديف مع الحيوانات الأليفة
      challenge: أراد جيك أن يجلب لابرادور الخاص به، بسكويت، إلى الماء، لكن لوحه الضيق القديم تحول إلى غواصة بمجرد أن قفز الكلب على متنها. كما مزق المخالب منصة السطح الرخيصة خلال أسابيع.
      solution: تقدم سلسلة ليفايثان ويك منصة واسعة وعالية الحجم تحمل راكبا يزن 30 كيلو دون أن يغرق. EVA سطح الجر ينجو من المخالب التي دمرت لوحه السابق، وتماثل الحوت الأزرق يمنح بسكويت "مكانا" واضحا للجلوس عليه.
      product: سلسلة ليفياثان ويك
      results: يقفز بسكويت الآن على متن السفينة بأمر ويركب المقدمة كأنه رأس تمثالي. بعد صيفين، لا يظهر أي ضرر في المخالب، وأصبحت مجاديف النهر الخاصة بهم المحتوى الأكثر شعبية في موجز جيك.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: اشتريت لوحا وحصلت على مساعد أولى. السطح تجاهل كل ما يمكن أن يرميه كلب مبلل كبير — حرفيا.
      icon: tabler:dog
    - title: ميزانية الطلاب، جودة السعر الكامل
      customer: طالب جامعي
      country: بولندا
      industry: أسلوب حياة الطلاب
      challenge: كاسيا طالبة في غدانسك بميزانية طلابية وروتين بحيرة صيفي. كل لوح رخيص وجدته كان إما هشا أو قبيحا أو كلاهما — والألواح عالية الجودة تكلف أكثر من ميزانيتها الشهرية للطعام.
      solution: تجمع سلسلة ميدوسا غلو بين البناء الفاخر — drop-stitch النواة، PSI 15 صلابة، وفن قنديل البحر باللون الأخضر النعناعي المجمع من كتل مقطوعة EVA بالقالب — مع Paddle Board Overstock تسعير التخفيضات المباشرة من المصنع يتجاوز هامش ربح الوسطاء.
      product: سلسلة ميدوسا الوهجة
      results: كانت كاسيا تدفع أقل من نصف ما تباع عليه الألواح الفاخرة المماثلة محليا. صمدت لوحتها لموسم كامل من جلسات البحيرة اليومية وأسبوع شاطئ البلطيق، وطلب ثلاثة من زملاءها لوحهم بعد تجربتها.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: كنت أتوقع تنازلات ميزانية الطلاب. بدلا من ذلك، حصلت على لوحة كان أصدقائي يعتقدون أنها تكلف ثلاثة أضعاف — واستمر أكثر من اثنين من لوحهم.
      icon: tabler:backpack
    - title: الانطلاق من منصة مستقرة
      customer: صياد نهاية الأسبوع
      country: الولايات المتحدة
      industry: SUP الصيد العشوائي
      challenge: ديفون يصطاد في المياه الهادئة الضحلة التي لا تستطيع أي مركبة الوصول إليها. كان بحاجة إلى قارب تجديف مستقر بما يكفي ليرمي منه وهو واقف، قوي بما يكفي للخطاطيف والمعدات، وخفيفا بما يكفي ليحمله على المسار عند الفجر.
      solution: سلسلة ماندالا الأدغال تمنحه منصة وقوف واسعة وصلبة للرمي، مع سطح من الكركديه وطائر الطنان بلون تيفاني الأزرق يبقى باردا تحت شمس الصباح. اللوح يمتلئ بحجم حقيبة الظهر للدخول إلى المسار، وينتفخ خلال دقائق عند حافة الماء، PVC والجلد المعزز يتجاهل العقبات الخطافية وضربات الزعانف.
      product: سلسلة ماندالا الأدغال
      results: الآن يصل ديفون إلى ثلاث خلجان تكاثر لا يستطيع أحد غيره الصيد. تضاعف معدل صيده خلال الموسم، ولا يزال اللوح — سواء كان خطاطيف، أو خيط، وكل شيء — يبدو جاهزا لصيف آخر.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: الوقوف على السمك SUP غير تماما طريقة صيدي. هذا اللوح مستقر بما يكفي لرمي، وتثبيت الخطاف، واصطياد السمكة — كل ذلك دون أن أبتل.
      icon: tabler:fish
cta:
  title: هل أنت مستعد لكتابة قصة تجديف خاصة بك؟
  subtitle: كل Paddle Board Overstock لوح يشحن بالكامل ومختبر 100٪ من الضغط. أخبرنا كيف تجدف وسنساعدك في العثور على اللوح المناسب.
  actions:
    - variant: primary
      text: ابحث عن لوحتك
      href: /supboard
    - text: تصفح جميع اللوحات
      href: /products
