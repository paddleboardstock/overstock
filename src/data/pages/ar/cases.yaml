features3_cases:
  tagline: حالات مميزة
  title: حلول مخصصة<br />للتحديات الحقيقية
  isBeforeContent: false
  columns: 3
  items:
    - title: ترقية العمليات اليومية لمركز بالي للغوص
      customer: مركز المحيط الأزرق للغوص
      country: أندونيسيا
      industry: مركز الغوص التجاري
      challenge: قام مركز بلو أوشن للغوص في بالي بتشغيل قارب غوص قديم مصنوع من الألياف الزجاجية مع مساحة محدودة على سطح السفينة، وصعوبة صعود الغواصين، وصيانة عالية في ظروف المياه المالحة الاستوائية. كان تحميل المعدات مزدحمًا، وكان وقت التحضير طويلًا، وأثارت المنصة غير المستقرة مخاوف تتعلق بالسلامة لدى السياح الدوليين - بما في ذلك الغواصين لأول مرة والمسافرين الأكبر سنًا. يقوم المركز بإجراء 3-5 رحلات غوص يوميًا، أكثر من 200 يوم سنويًا.
      solution: Aquafarer قدمت غوصًا احترافيًا مخصصًا بطول 6.8 مترًا RIB مع تصميم سطح موسع مُحسّن لتخزين معدات الغوص، وسلم غوص عريض من الفولاذ المقاوم للصدأ، وأنابيب Hypalon للخدمة الشاقة لمقاومة الأشعة فوق البنفسجية والمياه المالحة، وسطح سطح غير قابل للانزلاق، وحل تخزين الخزان. تم تصميم التكوين وفقًا لسير العمل اليومي لمركز الغوص - وليس بناءً على تخطيط قياسي للقارب الترفيهي.
      product: 6.8 م غوص احترافي RIB
      results: تعمل منطقة العمل الأكبر على تحسين كفاءة إعداد المعدات. شهد الغواصون صعودًا أكثر أمانًا وسهولة. انخفضت متطلبات الصيانة بشكل كبير. اكتسب المركز القدرة على التعامل مع المزيد من العملاء خلال موسم الذروة بثقة أكبر. أصبح RIB أساس عمليات الغوص اليومية.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: قارب الغوص الخاص بنا ليس مجرد وسيلة نقل. إنه أساس عمليتنا اليومية. Aquafarer RIB يمنح فريقنا المزيد من الثقة عند القيام برحلات غوص متعددة كل يوم.
      icon: tabler:lifebuoy
    - title: مركز بوكيت للغوص الاحترافي RIB ترقية
      customer: مركز أوشن إكسبلورر للغوص
      country: تايلاند
      industry: مركز الغوص التجاري
      challenge: كان مركز Ocean Explorer للغوص في فوكيت بتايلاند بحاجة إلى الترقية من قارب الغوص التقليدي المصنوع من الألياف الزجاجية والذي لا يمكنه مواكبة الطلب المتزايد من العملاء. مساحة سطح السفينة المحدودة جعلت إعداد المعدات غير فعال. أدى الصعود الصعب إلى خلق تحديات تتعلق بالسلامة للسياح الدوليين. أدت متطلبات الصيانة العالية في ظروف المياه المالحة الاستوائية إلى زيادة تكاليف التشغيل. يقوم المركز بتشغيل رحلات يومية متعددة، أكثر من 200 يوم في السنة.
      solution: Aquafarer قدم غوصًا تجاريًا مخصصًا بطول 6.8 مترًا RIB مع تخطيط سطح العمل الأمثل لتخزين خزانات الغوص وإعداد المعدات وحركة الغواص. تضمنت الميزات سلمًا عريضًا للغوص مع درابزين من الفولاذ المقاوم للصدأ، وبناء أنبوبي عالي التحمل بمواد مقاومة للأشعة فوق البنفسجية، وأرضية غير قابلة للانزلاق، وحل تخزين الخزان، ووحدة تحكم احترافية، ومقاعد للركاب - جميعها مهيأة لعمليات الغوص التجارية.
      product: 6.8 م غوص تجاري RIB
      results: أتاحت مساحة السطح الأكبر تنظيمًا أسرع للمعدات وسير عمل يومي أكثر كفاءة. تحسنت راحة وأمان العملاء على متن الطائرة بشكل ملحوظ. انخفض وقت توقف الصيانة مع البناء من الدرجة البحرية. يمكن لمركز الغوص أن يخدم المزيد من العملاء خلال موسم الذروة ويوسع خدمات الغوص الاحترافية بثقة.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: بالنسبة لمركز الغوص، القارب ليس مجرد وسيلة نقل. إنه جزء مهم من عمليتنا اليومية. Aquafarer RIB يمنح فريقنا الثقة للقيام برحلات غوص متعددة كل يوم بأمان وكفاءة أفضل.
      icon: tabler:lifebuoy
    - title: أسطول مركز الغوص الأوروبي
      customer: مراكز الغوص بلوميد
      country: اليونان
      industry: الغوص والسياحة البحرية
      challenge: مطلوب 12 ضلعًا تم تكوينه للغوص لسلسلة من مراكز الغوص عبر العديد من الجزر اليونانية. يحتاج كل قارب إلى سلم غوص مخصص، وخزان تخزين يتسع لـ 8 خزانات، ومنصة مستقرة لدخول الغواصين في المياه المفتوحة. يجب أن يصل الأسطول خلال 60 يومًا لبدء الموسم السياحي.
      solution: تم إنتاج 12 RIB 520 نموذج غوص مع رفوف خزانات متكاملة وسلالم غوص وأنابيب Hypalon واسعة للغاية لتحقيق استقرار الصعود. تم تمييز كل قارب بعلامة أسطول العملاء. تم اختبار الضغط على جميع القوارب الـ 12 وشحنها من Qingdao خلال 55 يومًا.
      product: RIB 520 غطس
      results: تم تسليم جميع القوارب الـ 12 في الوقت المحدد للموسم السياحي. ظل الأسطول قيد التشغيل اليومي لأكثر من 18 شهرًا دون أي أعطال مادية. طلب العميل 6 وحدات إضافية في العام الثاني.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: لقد كان RIB 520 Dive العمود الفقري لعمليات الغوص اليومية لدينا. يعد الاستقرار أثناء الراحة ممتازًا، ويحافظ تصميم خزان التخزين على سطح السفينة نظيفًا وآمنًا لضيوفنا.
      icon: tabler:lifebuoy
    - title: برنامج الموزع الأسترالي OEM
      customer: باسيفيك ووترسبورتس بي تي واي المحدودة
      country: أستراليا
      industry: OEM/ODM التصنيع
      challenge: احتاج الموزع الأسترالي إلى مجموعة لوحات SUP ذات علامة خاصة وبأسعار تنافسية للتنافس مع العلامات التجارية الصينية الموجهة مباشرة إلى المستهلك. مطلوب 8 نماذج فريدة تغطي المستوى المبتدئ وحتى المستوى المتقدم، مع رسومات مخصصة، وتغليف مخصص، وتنفيذ التسليم الفوري لمنافذ البيع بالتجزئة.
      solution: تم تطوير 8 نماذج SUP (All-Around، Touring، Yoga، Kids، Sport، Ultra-Compact، Ultra-Stable، Whitewater) مع حزمة رسومات أسترالية حصرية. تغليف مخصص للبيع بالتجزئة مع رموز QR المرتبطة بمقاطع فيديو الإعداد. تم تكوين الخدمات اللوجستية للشحن المباشر من Qingdao مباشرة إلى متاجر البيع بالتجزئة الأسترالية.
      product: خط SUP مخصص (8 نماذج)
      results: مفهوم الشحنة الأولى في 90 يومًا. نسبة بيع التجزئة تصل إلى 85% في الموسم الأول. قام الموزع بتوسيع الشراكة لتشمل خط القوارب القابلة للنفخ في العام الثاني.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer سلمت خط SUP كاملاً في 90 يومًا - من التصميم الأولي إلى طابق البيع بالتجزئة. تتطابق الجودة مع العلامات التجارية التي تبيع ضعف السعر.
      icon: tabler:arrows-exchange
    - title: الشرق الأوسط لتوريد قوارب الإنقاذ
      customer: الهيئة الوطنية للدفاع المدني
      country: الإمارات العربية المتحدة
      industry: البحث والإنقاذ
      challenge: احتاجت منظمة الدفاع المدني إلى 20 قطعة ضلعية جاهزة للدوريات للبحث والإنقاذ الساحلي، وأمن الموانئ، والاستجابة للفيضانات. مطلوب أسطح ذاتية الكفالة، وأجنحة ملاحية كاملة (GPS، رادار، VHF)، وأنابيب برتقالية عالية الوضوح، والامتثال للوائح البحرية المحلية.
      solution: تم توفير 20 RIB 450 طرازًا من نماذج الدوريات مع أسطح ذاتية الكفالة، وأجنحة الملاحة من Garmin، وكشافات LED، وشريط عاكس SOLAS، وأنابيب Hypalon برتقالية عالية الوضوح. تم اعتماد كل قارب CE وتم اختباره وفقًا لمعايير ISO 6185. وتضمنت حزمة الوثائق شهادات الامتثال للتسجيل المحلي.
      product: RIB 450 باترول
      results: الأسطول منتشر عبر 5 محطات ساحلية. تعمل القوارب في درجات حرارة شديدة (45 درجة مئوية +) دون أي تدهور في الأنبوب. تجاوز نطاق الدورية وكفاءة استهلاك الوقود المواصفات بنسبة 12٪.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: لقد تجاوزت دورية RIB 450 متطلباتنا التشغيلية. في ظروف الحرارة الشديدة، لا تظهر الأنابيب Hypalon أي علامات لتدهور الأشعة فوق البنفسجية بعد 24 شهرًا من الاستخدام اليومي.
      icon: tabler:alert-triangle
    - title: شراكة العلامة التجارية الأوروبية OEM
      customer: بحر الشمال للمعدات البحرية بي في
      country: هولندا
      industry: OEM/ODM التصنيع
      challenge: أرادت العلامة التجارية البحرية الأوروبية الراسخة التوسع في سوق RIB دون الاستثمار في مرافق التصنيع. مطلوب شريك ذو علامة بيضاء قادر على إنتاج 5 نماذج RIB (من 3.9 م إلى 6.2 م) بعلامة تجارية خاصة وشهادة CE وحقوق توزيع حصرية في الاتحاد الأوروبي.
      solution: تم إنشاء اتفاقية تصنيع العلامة البيضاء لـ 5 نماذج RIB. يحمل كل طراز شعارات العملاء ونظام الألوان. CE وثائق الشهادة المعدة لكل موديل. حقوق التوزيع الحصرية للاتحاد الأوروبي ممنوحة مع التزامات الحد الأدنى للطلب. الوثائق الفنية وكتالوج قطع الغيار المقدمة لشبكة الخدمة المحلية.
      product: خط RIB مخصص (5 نماذج)
      results: تم توقيع اتفاقية متعددة السنوات. تم شحن أول عملية إنتاج لـ 50 وحدة خلال 75 يومًا. تم إطلاق العلامة التجارية في METSTRADE مع استقبال إيجابي للمتداولين.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: العمل مع Aquafarer سمح لنا بدخول السوق RIB دون بناء مصنع - لقد قدموا حلاً كاملاً جاهزًا مع شهادة CE ووثائق دعم الوكيل.
      icon: tabler:building
    - title: أسطول المنتجع الكاريبي
      customer: منتجعات جزيرة بارادايس المحدودة
      country: جزر البهاما
      industry: السياحة البحرية والضيافة
      challenge: 'يحتاج المنتجع الفاخر إلى أسطول كامل من معدات الرياضات المائية لأنشطة الضيوف: 40 SUP لوحًا للجولات المصحوبة بمرشدين، و20 قارب كاياك لاستكشاف البحيرة، و10 قوارب قابلة للنفخ لنقل الضيوف ورحلات صيد الأسماك، بالإضافة إلى الملحقات. تحتاج جميع المعدات إلى علامة تجارية مخصصة للمنتجع ويجب تسليمها قبل ذروة الموسم السياحي.'
      solution: 'تم إنتاج حزمة كاملة للرياضات المائية: 40 SUP لوحة Voyager (نموذج شامل)، 20 قوارب الكاياك Explorer، 10 قوارب قابلة للنفخ AirDeck 360، بالإضافة إلى PFDs، والمجاديف، والمضخات، ومجموعات الإصلاح. جميع المعدات مطبوعة بشعار المنتجع ونظام الألوان الاستوائية. شحنة في حاويات مع بيان المخزون الكامل.'
      product: باقة الرياضات المائية الكاملة (+70 وحدة)
      results: وصل الأسطول قبل 6 أسابيع من موسم الذروة. ارتفعت درجات رضا الضيوف عن أنشطة الرياضات المائية بنسبة 40% مقارنة بالعام الماضي. استمرت المعدات لمدة 3 مواسم مع الصيانة الروتينية فقط.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: ويعني نهج الحزمة الكاملة أننا تلقينا كل ما نحتاجه في شحنة واحدة - الألواح، وزوارق الكاياك، والقوارب، والملحقات كلها تحمل علامات تجارية وجاهزة لاستخدام الضيوف. ضيوفنا يحبون جودة المعدات.
      icon: tabler:beach
    - title: مركز الغوص التجاري في كوينزلاند RIB ترقية
      customer: مركز الغوص التجاري
      country: أستراليا
      industry: الغوص التجاري والخدمات البحرية
      challenge: كان مركز الغوص التجاري في كوينزلاند والمتخصص في فحص البنية التحتية البحرية وصيانة الموانئ ومشاريع الإصلاح تحت الماء يقوم بتشغيل قارب عمل قديم. مع نمو الطلب على المشروع، أصبحت السفينة القديمة عبئًا - تسببت الصيانة المتكررة في اضطرابات في الجدولة، ولم يتم تصميم التصميم لعمليات الغوص الحديثة (مساحة محدودة للأسطوانات والأدوات والمعدات)، وكانت راحة الطاقم أثناء العمليات الطويلة سيئة. كانت الشركة بحاجة إلى سفينة يمكنها دعم عملياتها المهنية في كل يوم عمل.
      solution: Aquafarer أجرى تحليلاً تشغيليًا تفصيليًا لسير عمل غوص العملاء ومدة المشروع النموذجية وحجم الطاقم ومتطلبات المعدات. بناءً على هذا التحليل، قدمت Aquafarer منصة احترافية مخصصة RIB مع تخطيط سطح وظيفي محسّن لإعداد المعدات وحركة الغواص، ومقاعد احترافية لفترات نقل أطول، وثبات معزز لدخول وخروج الغواص بشكل أكثر أمانًا، وميزات دعم الغوص المدمجة في التصميم.
      product: الغوص الاحترافي المخصص RIB
      results: أصبحت RIB الجديدة منصة عمل يومية موثوقة. أصبح إعداد المعدات أسرع بفضل التصميم الأمثل. أفاد الطاقم بتحسن الراحة والسلامة أثناء العمليات الطويلة. عزز المظهر الاحترافي للقارب ثقة العملاء عند العمل مع مشغلي الموانئ والمقاولين البحريين. حصل مركز الغوص على سفينة تتناسب مع احترافية خدمتهم.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: كنا بحاجة إلى قارب يمكنه دعم أعمالنا كل يوم، وليس مجرد سفينة للنقل. Aquafarer عمل معنا لفهم متطلباتنا التشغيلية وقدم RIB حلاً يناسب سير عمل الغوص التجاري لدينا.
      icon: tabler:lifebuoy
    - title: عقد الدوريات الساحلية الأمريكية
      customer: وكالة الأمن الساحلي الأطلسي
      country: الولايات المتحدة
      industry: الأمن البحري وإنفاذ القانون
      challenge: طلبت وكالة أمن السواحل الأمريكية دورية ثقيلة من RIBs لعمليات الاعتراض في المياه المفتوحة. هناك حاجة إلى تكوين محرك مزدوج للتكرار، ووحدة تحكم مدرعة لحماية الطاقم، وإلكترونيات ذات مواصفات عسكرية (اتصالات مشفرة، FLIR، رادار)، والامتثال للوائح خفر السواحل الأمريكية.
      solution: تم تصميم RIB 600 باترول مع تكوين خارجي مزدوج 115 HP ووحدة تحكم مدرعة مع حماية باليستية وتصوير حراري FLIR واتصالات VHF/UHF مشفرة ونقاط تركيب أسلحة متكاملة. تم تعزيز الهيكل لمناورات الاعتراض عالية السرعة. تم دمج جميع الأجهزة الإلكترونية واختبارها في المصنع. USCG وثائق الامتثال المقدمة.
      product: RIB 600 باترول (محرك مزدوج)
      results: حققت القوارب سرعة قصوى تبلغ 52 عقدة أثناء تجارب القبول. أبلغت الوكالة عن معدل جاهزية للمهمة بنسبة 95% خلال الأشهر الـ 12 الأولى. تم تقديم طلب إضافي لـ 8 وحدات.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: يمنح المحرك المزدوج RIB 600 لأطقمنا السرعة والتكرار المطلوبين لعمليات اعتراض المياه المفتوحة. توفر وحدة التحكم المدرعة حماية مهمة دون المساس بالأداء.
      icon: tabler:shield
