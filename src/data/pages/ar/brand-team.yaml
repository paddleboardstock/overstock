hero:
  tagline: فريقنا
  title: الأشخاص وراء Paddle Board Overstock<br />— هندسة الحرية على الماء
  subtitle: تأسست في 2012 في ويهاي، الصين، تم بناء Paddle Board Overstock بواسطة مهندسي بحار وعلماء مواد وعشاق الرياضات المائية الذين كانوا يؤمنون بجعل ألواح التجديف القابلة للنفخ ذات المستوى الاحترافي متاحة في جميع أنحاء العالم.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock صورة كاملة للفريق — الهندسة، الإنتاج، والقيادة
founding:
  tagline: تأسيسنا
  title: من ورشة ساحلية<br />إلى منشأة بمساحة 12,000 م²
  subtitle: تأسست Paddle Board Overstock بواسطة فريق من مهندسي البحار الذين يمتلكون عقودًا من الخبرة المجمعة في تصميم SUP القابلة للنفخ، وبناء drop-stitch، وتصنيع الرياضات المائية عالميًا.
  items:
    - title: 'تأسست: 2012'
      description: أُنشئت في ويهاي، الصين — مركز بحري رئيسي يتمتع بتراث بناء السفن العميق.
      icon: tabler:calendar
    - title: 200-300 موظف
      description: بما في ذلك 14+ مهندس بحث وتطوير، ومتخصصين في مراقبة الجودة، وفنيي إنتاج.
      icon: tabler:users
    - title: منشأة بمساحة 12,000 م²
      description: مصنع مخصص للانتاج مع 6 خطوط إنتاج لألواح SUP والإكسسوارات.
      icon: tabler:building-factory
    - title: 50+ دولة نخدمها
      description: تصدير إلى أوروبا والأمريكتين والشرق الأوسط وآسيا والمحيط الهادئ وأفريقيا.
      icon: tabler:globe
leadership:
  tagline: قيادة
  title: القيادة والإدارة الهندسية
  subtitle: يجمع فريق القيادة لدينا بين خبرة عميقة في الهندسة البحرية، والتجارة الدولية، وإدارة الجودة.
  columns: 3
  items:
    - title: المؤسس والرئيس التنفيذي
      name: توبي ليو
      description: 15+ سنة في التصنيع البحري. سبق أن قاد البحث والتطوير في شركة تصنيع بحرية صينية كبرى. حاصل على براءات اختراع متعددة في تصميم المنتجات القابلة للنفخ.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: المهندس الرئيسي
      name: تشانغ ويي
      description: 20+ سنة في تصنيع البوليمرات وتصميم الهياكل القابلة للنفخ. قام سابقًا بمنصب المدير التقني في شركة هندسة بحرية أوروبية.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: رئيس قسم البحث والتطوير
      name: تشن مينغ
      description: دكتوراه في علوم المواد. متخصص في تكنولوجيا drop-stitch وعمليات اللحام عالية التردد. 10+ سنوات في المركبات النسيجية.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: مدير الإنتاج
      name: ليو تشيانغ
      description: 18+ عامًا في التصنيع الرشيق وتحسين خطوط الإنتاج. بنى أنظمة الجودة التي تقف وراء معدل العيوب البالغ 99.3%.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: مدير الجودة
      name: وانغ فانغ
      description: 12+ عامًا في مراقبة الجودة البحرية. يشرف على اختبار الضغط والخياطة والحمل لكل دفعة إنتاج قبل الإصدار.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: مدير المبيعات والعمليات
      name: هيلين لي
      description: 15+ عامًا في التجارة الإلكترونية الدولية والخدمات اللوجستية. يقوم بشحن الألواح للمتجدفين في 50+ دولة. يجيد 4 لغات بطلاقة.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: فلسفة التصميم
  title: تصميم بقيادة الهندسة<br />— كل تفصيلة مهمة
  subtitle: تركز فلسفة الهندسة لدينا على ثلاثة مبادئ توجه كل منتج نقوم ببنائه.
  list:
    - 'أولاً الموثوقية: يتم اختبار كل Paddle Board Overstock منتج لتحمل ظروف العالم الواقعي — من رحلات المياه الباردة إلى تأجير الشواطئ الاستوائية. نحن نصنع هندسة فائقة حيث يهم الأمر أكثر.'
    - 'دقة التصنيع: تستخدم منشآتنا تقنيات CNC القطع، اللحام بتردد عالي، واختبار الضغط الآلي. كل خياطة، كل صمام، كل قطعة تركيب تتوافق مع المواصفات الموثقة.'
    - 'الابتكار المستمر: يقوم فريق البحث والتطوير لدينا بتقييم المواد الجديدة وطرق الإنتاج وتحسينات التصميم باستمرار. نحن لا ننتظر حدوث المشكلات — نحن نتوقعها.'
cta:
  title: هل ترغب في مناقشة مشروع مع فريقنا؟
  subtitle: فريقنا جاهز لمساعدتك في اختيار اللوح الملائم، والإكسسوارات، والمعدات لأسلوب تجديفك.
  actions:
