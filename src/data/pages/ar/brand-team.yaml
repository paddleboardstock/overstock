hero:
  tagline: فريقنا
  title: 'الأشخاص الذين يقفون خلف Aquafarer<br />— هندسة الحرية على الماء'
  subtitle: 'تأسست Aquafarer في عام 2012 في تشينغداو بالصين على يد مهندسين بحريين وعلماء مواد ومحبي الرياضات المائية الذين آمنوا بجعل القوارب القابلة للنفخ الاحترافية في متناول الجميع حول العالم.'
  image:
    src: /images/team-all.webp
    alt: صورة فريق Aquafarer الكامل — الهندسة والإنتاج والقيادة
founding:
  tagline: تأسيسنا
  title: 'من ورشة على الساحل<br />إلى منشأة بمساحة 12,000 م²'
  subtitle: 'تأسست Aquafarer على يد فريق من المهندسين البحريين بعقود من الخبرة المتراكمة في تصميم القوارب القابلة للنفخ، والتصنيع من PVC/Hypalon، وإنتاج المعدات البحرية عالميًا.'
  items:
    - title: "التأسيس: 2012"
      description: 'تأسست في تشينغداو بالصين — مركز بحري رئيسي بتراث عريق في بناء السفن.'
      icon: tabler:calendar
    - title: 200-300 موظف
      description: 'بما في ذلك أكثر من 50 مهندس بحث وتطوير ومتخصصي ضبط الجودة وفنيي الإنتاج.'
      icon: tabler:users
    - title: منشأة بمساحة 12,000 م²
      description: 'مصنع مخصص بـ 6 خطوط إنتاج لقوارب RIB والقوارب القابلة للنفخ ولوحات SUP.'
      icon: tabler:building-factory
    - title: 'خدمة أكثر من 50 دولة'
      description: 'التصدير إلى أوروبا والأمريكتين والشرق الأوسط وآسيا والمحيط الهادئ وأفريقيا.'
      icon: tabler:globe
leadership:
  tagline: القيادة
  title: 'الإدارة والقيادة الهندسية'
  subtitle: 'يجمع فريق القيادة لدينا خبرة عميقة في الهندسة البحرية والتجارة الدولية وإدارة الجودة.'
  columns: 3
  items:
    - title: المؤسس والرئيس التنفيذي
      name: 'Toby Liu'
      description: 'أكثر من 15 عامًا في التصنيع البحري. قاد سابقًا قسم البحث والتطوير لدى كبرى شركات تصنيع القوارب الصينية. حاصل على عدة براءات اختراع في تصميم القوارب القابلة للنفخ.'
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: كبير المهندسين
      name: 'Zhang Wei'
      description: 'أكثر من 20 عامًا في تصنيع PVC/Hypalon وتصميم هياكل deep-V. مدير فني سابق في شركة أوروبية للهندسة البحرية.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: رئيس قسم البحث والتطوير
      name: 'Chen Ming'
      description: 'دكتوراه في علوم المواد. متخصص في تقنية drop-stitch وعمليات اللحام عالي التردد. أكثر من 10 أعوام في المركبات النسيجية.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: مدير الإنتاج
      name: 'Liu Qiang'
      description: 'أكثر من 18 عامًا في التصنيع الرشيق وتحسين خطوط الإنتاج. حاصل على Six Sigma Black Belt. طبّق أنظمة جودة ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: مدير الجودة
      name: 'Wang Fang'
      description: 'أكثر من 12 عامًا في ضبط الجودة البحرية. مدقق معتمد CE وISO. يشرف على اختبار كل دفعة إنتاج.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'مدير المبيعات والعمليات'
      name: 'Helen Lee'
      description: 'أكثر من 15 عامًا في التجارة B2B الدولية. أدار شراكات OEM/ODM في أكثر من 30 دولة. يجيد 4 لغات.'
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: فلسفة التصميم
  title: 'تصميم تقوده الهندسة<br />— كل تفصيلة لها أهميتها'
  subtitle: 'تتمحور فلسفتنا الهندسية حول ثلاثة مبادئ توجّه كل منتج نصنعه.'
  list:
    - 'الموثوقية أولًا: كل منتج من Aquafarer يُختبر ليتحمل الظروف الواقعية — من عمليات الإنقاذ في المياه الباردة إلى تأجير المنتجعات الاستوائية. نبالغ في إحكام الهندسة حيث يكون الأمر أهم.'
    - 'دقة التصنيع: تستخدم منشآتنا القطع بـ CNC واللحام عالي التردد واختبارات الضغط المؤتمتة. كل درزة وصمام وتجهيزة تستوفي المواصفات الموثقة.'
    - 'الابتكار المستمر: يقيّم فريق البحث والتطوير لدينا باستمرار المواد الجديدة وأساليب الإنتاج وتحسينات التصميم. لا ننتظر المشاكل — نستبقها.'
cta:
  title: 'هل ترغب في مناقشة مشروع مع فريقنا؟'
  subtitle: 'مهندسونا جاهزون لتقديم المشورة بشأن اختيار المنتجات والتخصيص وشراكات OEM/ODM.'
  actions:
    - variant: primary
      text: تواصل مع فريقنا
      href: /contact
    - text: استعرض منتجاتنا
      href: /products
