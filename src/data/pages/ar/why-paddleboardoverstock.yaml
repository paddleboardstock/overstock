hero:
  tagline: لماذا Paddle Board Overstock
  title: مبنية بشكل مختلف. مبنية لتدوم.<br />الألواح وراء مغامرات الماء حول العالم
  subtitle: ليس مجرد مصنع — بل فريق من المجدفين والمهندسين الذين يصممون ويختبرون ويبنون ألواح مطاطية SUP فاخرة للعائلات والمغامرين والأندية حول العالم.
  image:
