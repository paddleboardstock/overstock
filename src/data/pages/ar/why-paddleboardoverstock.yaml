reasons:
  tagline: الفرق Paddle Board Overstock
  title: ما الذي يميزنا
  isBeforeContent: false
  columns: 3
  items:
    - title: التصنيع الحقيقي، ليس التجارة
      description: نحن نمتلك وندير مصنعًا بمساحة 12,000 متر مربع. عندما تتعاون مع Paddle Board Overstock، تعمل مباشرة مع الأشخاص الذين يصممون ويهندسون ويبنون منتجاتك — دون وسطاء.
      icon: tabler:building-factory
    - title: نهج يقوده الهندسة
      description: تبدأ عملية التصميم لدينا من حالة الاستخدام، وليس فئة المنتج. نقوم بتحسين شكل الهيكل، واختيار المواد، والتكوين لكيفية استخدام اللوح فعليا على الماء.
      icon: tabler:engine
    - title: جودة مثبتة
      description: كل لوحة تختبر الضغط حتى يصل الضغط إلى 1.25 ضعف ضغطها المصنف لمدة 24-48 ساعة قبل الشحن، وتصل 99.3٪ من شحناتنا بدون عيوب — مدعوما بضماننا.
      icon: tabler:award
    - title: تصميم المجداف أولا
      description: 'كل نموذج يبدأ بكيفية تجديفك: منصات مستقرة للمبتدئين، أشكال انسيابية للجولات، ومجموعات كاملة الحجم لليوغا. نحن نصمم للمجدفين الحقيقيين، وليس لمواصفات صالات العرض.'
      icon: tabler:adjustments
    - title: اللوجستية العالمية
      description: مستودع أمريكي في كاليفورنيا، الشحن المباشر من ويهاي، الشحن الجوي للطلبات العاجلة. نحن نتعامل مع الأوراق والوثائق الجمركية في جميع أنحاء العالم.
      icon: tabler:truck-delivery
    - title: دعم مدى الحياة
      description: نحن نقف خلف ألواح بنيناها قبل 20 عاما. قطع غيار أصلية، نصائح فنية، إرشادات إصلاح — فريقنا موجود عندما تحتاجنا أينما كنت.
      icon: tabler:lifebuoy
testimonials:
  tagline: موثوق من قبل شركة بادلرز وورلدوايد
  title: ما يقوله المجدفون
  items:
    - content: سيارتي Ocean Voyager تعاملت مع كل شيء من صباحات البحيرة الهادئة إلى بعد الظهر الساحلي المتقلب. بعد موسمين، لا تزال تبدو وتتحرك كالجديدة.
      name: — مجدف ترفيهي، كاليفورنيا
    - content: كنت متوترا عند شراء أول لوح قابل للنفخ عبر الإنترنت، لكن الجودة كانت واضحة منذ اللحظة التي نفختها فيها. صلبة، مستقرة، ومنتهية بشكل جميل.
      name: — SUP مالك لأول مرة، ألمانيا
    - content: نجدف كعائلة كل عطلة نهاية أسبوع صيفية. ثلاثة ألواح صغيرة، لا مشاكل، والأطفال يحبون التصاميم الزاهية.
      name: — عائلة بادلر، أستراليا
    - content: اختبار الضغط ليس مجرد حديث تسويقي — لوحي متين تماما عند الضغط الكامل ولا يظهر أي تماطد بعد عام من التجديف الأسبوعي.
      name: — مجلة ويكلي بادلر، هولندا
cta:
