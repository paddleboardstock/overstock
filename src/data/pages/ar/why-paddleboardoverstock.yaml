pillars:
  tagline: ثلاثة أعمدة للجودة
  title: لماذا يختار Paddle Board Overstock المجدفون في جميع أنحاء العالم
  subtitle: ''
  columns: 3
  items:
    - title: مصمّم للاستخدام التجاري
      description: ألواح التجديف لدينا مصممة لسنوات من التجديف المنتظم. PVC النوى التجارية المعززة drop-stitch ، UV المواد المستقرة، والأجهزة المختبرة ميدانيا تعني صيانة أقل وعمر أطول على الماء.
      icon: tabler:building-factory
      callToAction:
        text: انظر خط الإنتاج التجاري
        href: /products
    - title: اختبار خارج المعايير
      description: كل لوحة منفوخة إلى 1.25 ضعف ضغطها المعدل لمدة 24-48 ساعة قبل مغادرة المصنع — 100٪ اختبار ضغط و99.3٪ خالية من العيوب. لوحتك تثبت قوتها قبل أن تصل إلى الماء.
      icon: tabler:shield-check
      callToAction:
        text: انظر كيف نختبر
        href: /quality
    - title: مصمّم للظروف العالمية
      description: 'منتجات محسّنة لكل مناخ: تركيبات للمياه الباردة PVC لأوروبا، مواد مقاومة UV للشرق الأوسط وأستراليا، علاجات ضد الرطوبة لجنوب شرق آسيا. كل شحنة تتم معايرتها وفق بيئة وجهتها.'
      icon: tabler:world
