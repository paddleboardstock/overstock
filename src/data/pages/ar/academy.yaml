hero:
  tagline: أكاديمية Paddle Board Overstock
  title: مركز التعلم
  subtitle: أدلة وبرامج تعليمية لكل مستوى من مستويات المهارة - بدءًا من الأساسيات SUP وحتى تقنيات الإنقاذ المتقدمة
categories:
  - level: مبتدئ
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP الأساسيات
        desc: تعلم أساسيات رياضة التجديف واقفًا - الوقوف، وتقنية الضربة، والتوازن.
        slug: beginner-sup-guide
      - title: تقنيات التجديف
        desc: الضربة الأمامية، والضربة الاجتياحية، وضربة السحب، والدعامة المنخفضة - أتقن حركات المجداف الأساسية.
        slug: sup-paddle-guide
      - title: السلامة أولا
        desc: ممارسات السلامة الأساسية بما في ذلك فحص الطقس واستخدام PFD وقواعد المقود والإنقاذ الذاتي.
        slug: sup-safety-guide
  - level: متوسط
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: أساسيات السياحة
        desc: تخطيط المجاذيف لعدة ساعات - الملاحة، والترطيب، والسرعة، وقراءة توقعات الرياح.
        slug: touring-sup-guide
      - title: قراءة الطقس
        desc: تفسير التنبؤات البحرية وتحديد أنماط السحب وفهم تأثيرات الرياح على الماء.
        slug: weather-planning-water-sports
      - title: أساسيات الملاحة
        desc: قراءة المخططات واستخدام البوصلة ونقاط الطريق لنظام تحديد المواقع العالمي (GPS) وتخطيط الطريق للتجديف الساحلي.
        slug: sup-navigation-guide
      - title: الوعي المد والجزر
        desc: فهم دورات المد والجزر والتيارات وكيفية تأثيرها على توقيت الإطلاق والتوجيه.
        slug: understanding-tides
  - level: متقدم
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: تخطيط الرحلات لعدة أيام
        desc: الخدمات اللوجستية للبعثة - اختيار المعدات، وتخطيط الطعام، وبروتوكولات السلامة، والاتصالات في حالات الطوارئ.
        slug: sup-travel-guide
      - title: تقنيات الإنقاذ
        desc: بروتوكولات الإنقاذ الذاتي، وإنقاذ T، والسحب في المياه المفتوحة.
        slug: sup-self-rescue
      - title: التجديف الليلي
        desc: التنقل بعد حلول الظلام - متطلبات الإضاءة، وذاكرة المسار، والتواصل الجماعي، والتوعية بالمخاطر.
        slug: sup-navigation-guide
  - level: صيانة
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: التنظيف والعناية
        desc: شطف بالمياه العذبة، وحماية UV، ومنع العفن، وتقنيات التجفيف الصحيحة بعد كل جلسة.
        slug: inflatable-sup-maintenance
      - title: دليل التخزين
        desc: أفضل ممارسات لتخزين الألواح القابلة للنفخ — التفريغ من الهواء، الطي، التحكم في الحرارة، وفترة الصلاحية.
        slug: inflatable-sup-storage
      - title: أساسيات الإصلاح
        desc: أصلح الثقوب الصغيرة وتسربات التماس ومشكلات الصمامات باستخدام مجموعات الإصلاح وتقنيات التصحيح PVC.
        slug: inflatable-sup-repair
      - title: صيانة الصمام
        desc: تحديد أنواع الصمامات (Halkey-Roberts، وBoston، وLeafield)، وتنظيف الحطام، واستبدال السيقان المعيبة.
        slug: inflatable-sup-repair
knowledge_center_tagline: مركز المعرفة
knowledge_center_title: أدلة ومعرفة ركوب لوح التجديف
knowledge_center_subtitle: أدلة خبراء ونصائح للشراء لراكبي لوح التجديف من جميع المستويات.
knowledge_sections:
  - title: تكنولوجيا بناء الألواح
    tagline: داخل لوح التجديف الخاص بك
    desc: كيف تُصنع ألواح التجديف القابلة للنفخ — نوى drop-stitch، طبقات لامينات، أسطح EVA، واختبار الضغط في المصنع.
    guides:
      - title: كيفية صنع ألواح التجديف
        desc: من تقطيع المواد واللّامينة إلى اختبار الضغط بنسبة 100٪ — شاهد كيف يغادر كل لوح المصنع.
        href: /factory/process
      - title: تكنولوجيا النواة Drop-Stitch
        desc: كيف تخلق آلاف الخيوط الداخلية هيكلًا صلبًا وقابلًا للنفخ عالي الضغط.
        href: /learn/drop-stitch-core
      - title: مرجع المواد
        desc: تفسيرات تصنيفات PVC الدنير، أوزان الأقمشة، مقاومة UV، ومواد السطح.
        href: /learn/materials
      - title: تكنولوجيا الألواح القابلة للنفخ
        desc: الحامات الملحومة، بناء الحواف، وأنظمة الصمامات التي تحافظ على صلابة اللوح وعدم تسرب الهواء.
        href: /learn/inflatable-technology
  - title: أدلة الشراء
    tagline: اختر اللوح المناسب
    desc: كل ما تحتاجه لاختيار أول لوح — أو التالي — قابل للنفخ SUP، من الحجم إلى البناء.
    guides:
      - title: كيفية اختيار لوح قابل للنفخ SUP
        desc: العوامل الرئيسية — البناء، السماكة، إعداد الزعنفة، والإكسسوارات المرفقة.
        href: /guides/how-to-choose-your-sup/
      - title: ما هو ركوب لوح التجديف الواقف؟
        desc: مقدمة ودية للرياضة، المعدات، ولماذا تجعل الألواح القابلة للنفخ من السهل البدء.
        href: /guides/what-is-sup
      - title: الألواح القابلة للنفخ مقابل الألواح الصلبة
        desc: قارن بين iSUPs وألواح الإيبوكسي الصلبة من حيث قابلية النقل والمتانة والأداء والقيمة.
        href: /compare/inflatable-vs-hardboard
      - title: دليل الحجم SUP
        desc: اعثر على طول اللوح المناسب، عرضه، وحجمه وفقًا لوزنك، مهارتك، وأسلوب التجديف الخاص بك.
        href: /size-guide
  - title: المهارات والسلامة
    tagline: التجديف بثقة
    desc: المعرفة العملية لكل جلسة — أساسيات المبتدئين، سلامة المياه، العناية، والإصلاح.
    guides:
      - title: SUP الأساسيات — دليل المبتدئين
        desc: كل ما يحتاج المبتدئون لمعرفته — أنواع الألواح، قياس المجداف، الوضعية، ونصائح اليوم الأول.
        href: /v2/beginner-sup-guide
      - title: أساسيات سلامة المياه
        desc: فحص الطقس، اختيار PFD، قواعد الحبل، الإنقاذ الذاتي، وأفضل الممارسات للتجديف الجماعي.
        href: /learn/water-safety
      - title: SUP الصيانة والعناية
        desc: التنظيف، التخزين، حماية UV، ونصائح العناية بالألواح القابلة للانتفاخ SUP.
        href: /v2/inflatable-sup-maintenance
      - title: أساسيات إصلاح الألواح
        desc: أصلح الثقوب الصغيرة وتسربات التماس ومشكلات الصمامات باستخدام مجموعات الإصلاح وتقنيات التصحيح PVC.
        href: /v2/inflatable-sup-repair
