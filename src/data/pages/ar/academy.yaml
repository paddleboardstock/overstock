hero:
  tagline: Aquafarer الأكاديمية
  title: مركز التعلم
  subtitle: أدلة وبرامج تعليمية لكل مستوى من مستويات المهارة - بدءًا من الأساسيات SUP وحتى تقنيات الإنقاذ المتقدمة
categories:
  - level: مبتدئ
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP الأساسيات
        desc: تعلم أساسيات رياضة التجديف واقفًا - الوقوف، وتقنية الضربة، والتوازن.
        slug: beginner-sup-guide
      - title: تقنيات التجديف
        desc: الضربة الأمامية، والضربة الاجتياحية، وضربة السحب، والدعامة المنخفضة - أتقن حركات المجداف الأساسية.
        slug: sup-paddle-guide
      - title: السلامة أولا
        desc: ممارسات السلامة الأساسية بما في ذلك فحص الطقس واستخدام PFD وقواعد المقود والإنقاذ الذاتي.
        slug: sup-safety-guide
  - level: متوسط
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: أساسيات السياحة
        desc: تخطيط المجاذيف لعدة ساعات - الملاحة، والترطيب، والسرعة، وقراءة توقعات الرياح.
        slug: touring-sup-guide
      - title: قراءة الطقس
        desc: تفسير التنبؤات البحرية وتحديد أنماط السحب وفهم تأثيرات الرياح على الماء.
        slug: weather-planning-water-sports
      - title: أساسيات الملاحة
        desc: قراءة المخططات واستخدام البوصلة ونقاط الطريق لنظام تحديد المواقع العالمي (GPS) وتخطيط الطريق للتجديف الساحلي.
        slug: sup-navigation-guide
      - title: الوعي المد والجزر
        desc: فهم دورات المد والجزر والتيارات وكيفية تأثيرها على توقيت الإطلاق والتوجيه.
        slug: understanding-tides
  - level: متقدم
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: تخطيط الرحلات لعدة أيام
        desc: الخدمات اللوجستية للبعثة - اختيار المعدات، وتخطيط الطعام، وبروتوكولات السلامة، والاتصالات في حالات الطوارئ.
        slug: sup-travel-guide
      - title: تقنيات الإنقاذ
        desc: الإنقاذ الذاتي، والإنقاذ على شكل حرف T، وإنقاذ الإسكيمو لزوارق الكاياك، وبروتوكولات القطر للمياه المفتوحة.
        slug: sup-self-rescue
      - title: التجديف الليلي
        desc: التنقل بعد حلول الظلام - متطلبات الإضاءة، وذاكرة المسار، والتواصل الجماعي، والتوعية بالمخاطر.
        slug: sup-navigation-guide
  - level: صيانة
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: التنظيف والعناية
        desc: الشطف بالمياه العذبة، والحماية من الأشعة فوق البنفسجية، والوقاية من العفن الفطري، وتقنيات التجفيف المناسبة بعد كل جلسة.
        slug: inflatable-sup-maintenance
      - title: دليل التخزين
        desc: أفضل الممارسات لتخزين الألواح والقوارب القابلة للنفخ - الانكماش، والطي، والتحكم في درجة الحرارة، ومدة الصلاحية.
        slug: inflatable-sup-storage
      - title: أساسيات الإصلاح
        desc: أصلح الثقوب الصغيرة وتسربات التماس ومشكلات الصمامات باستخدام مجموعات الإصلاح وتقنيات التصحيح PVC.
        slug: inflatable-sup-repair
      - title: صيانة الصمام
        desc: تحديد أنواع الصمامات (Halkey-Roberts، وBoston، وLeafield)، وتنظيف الحطام، واستبدال السيقان المعيبة.
        slug: inflatable-sup-repair
knowledge_center_tagline: مركز المعرفة
knowledge_center_title: المعدات البحرية وأدلة الصناعة
knowledge_center_subtitle: معرفة الخبراء وأدلة الشراء للمحترفين البحريين ومشغلي الأساطيل وعشاق الرياضات المائية.
knowledge_sections:
  - title: RIB معرفة القارب
    tagline: أدلة القوارب الصلبة القابلة للنفخ
    desc: كل شيء عن RIB القوارب - تصميم الهيكل والمواد واختيار المحرك والصيانة ونصائح الشراء للاستخدام التجاري والترفيهي.
    guides:
      - title: كيفية اختيار القارب المناسب RIB
        desc: دليل كامل لاختيار RIB — الحجم، وقوة المحرك، ومادة الأنبوب، ونوع الهيكل، والاستخدام المقصود.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB مقابل القارب القابل للنفخ
        desc: قارب صلب قابل للنفخ مقابل زورق قابل للنفخ تقليدي - مقارنة تصميم الهيكل والأداء والمتانة والقدرة.
        href: /compare/rib-vs-dinghy
      - title: تجاري RIB مقابل ترفيهي RIB
        desc: قوارب تجارية مقابل قوارب ترفيهية RIB - معايير البناء والمواد والعمر والتكلفة والشهادات.
        href: /compare/commercial-vs-recreational-rib
      - title: الألومنيوم مقابل هال الألياف الزجاجية
        desc: قارن بين هياكل الألومنيوم والألياف الزجاجية للقوارب RIB من حيث الوزن والتكلفة والمتانة ومقاومة التآكل.
        href: /compare/aluminum-vs-fiberglass
  - title: دليل القارب القابل للنفخ
    tagline: نفخ المعرفة المائية
    desc: أدلة شاملة عن القوارب القابلة للنفخ — PVC مقابل Hypalon، وطرق البناء، ومعايير السلامة، وأفضل ممارسات الصيانة.
    guides:
      - title: PVC مقابل Hypalon دليل المواد
        desc: مقارنة نهائية بين PVC و Hypalon CSM لبناء قارب قابل للنفخ.
        href: /compare/pvc-vs-hypalon
      - title: كيف يتم صناعة القوارب القابلة للنفخ
        desc: عملية التصنيع - قطع المواد، واللحام عالي التردد، وبناء التماس، واختبار الضغط، ومراقبة الجودة.
        href: /learn/inflatable-technology
      - title: دليل سلامة القوارب القابلة للنفخ
        desc: معايير السلامة، سعة الحمولة، التضخم المناسب، فحوصات ما قبل المغادرة، وإجراءات الطوارئ.
        href: /learn/water-safety
      - title: صيانة القوارب القابلة للنفخ
        desc: التنظيف والتخزين والحماية من الأشعة فوق البنفسجية والتجهيز لفصل الشتاء وإصلاح القوارب القابلة للنفخ والأضلاع.
        href: /v2/inflatable-boat-maintenance
  - title: معرفة القارب
    tagline: قارب قابل للنفخ وRIB المحور
    desc: أدلة فنية تغطي أنواع القوارب القابلة للنفخ، والمواد، وطرق البناء، والصيانة، والسلامة - من الزوارق المطاطية إلى الأضلاع المطاطية.
    guides:
      - title: أنواع القوارب القابلة للنفخ
        desc: القوارب المطاطية، والأضلاع، وزوارق الكاياك، والمناقصات - تعرف على الاختلافات واختر النوع المناسب.
        href: /v2/inflatable-boat-buying-guide
      - title: تقنية الغرزة المتساقطة
        desc: كيف تقوم الآلاف من الخيوط الداخلية بإنشاء هياكل صلبة قابلة للنفخ عالية الضغط.
        href: /learn/drop-stitch-core
      - title: مرجع المواد
        desc: PVC شرح تقييمات الدنير وأوزان القماش ومقاومة الأشعة فوق البنفسجية والمواد البحرية.
        href: /learn/materials
      - title: RIB ضد زورق
        desc: قارن بين القوارب الصلبة القابلة للنفخ والقوارب المطاطية التقليدية لحالات الاستخدام المختلفة.
        href: /compare/rib-vs-dinghy
  - title: SUP المعرفة
    tagline: أدلة لوح التجديف واقفًا
    desc: كل شيء عن اللوحات SUP — القابلة للنفخ مقابل الصلبة، وأبعاد اللوحة، وتكنولوجيا المواد، ومشورة الخبراء لجميع مستويات المهارة.
    guides:
      - title: نفخ مقابل الصلب SUP
        desc: قارن بين iSUPs وألواح الإيبوكسي الصلبة من حيث قابلية النقل والمتانة والأداء والقيمة.
        href: /learn/sup
      - title: SUP دليل أبعاد اللوحة
        desc: كيف يؤثر الطول والعرض والسمك على الاستقرار والسرعة والقدرة على المناورة.
        href: /learn/sup
      - title: SUP الصيانة والعناية
        desc: نصائح التنظيف والتخزين والحماية من الأشعة فوق البنفسجية وإصلاح الألواح SUP القابلة للنفخ.
        href: /v2/inflatable-sup-maintenance
      - title: اختيارك الأول SUP
        desc: دليل المبتدئين لاختيار لوح التجديف المناسب لوزنك ومستوى مهارتك والاستخدام المقصود.
        href: /learn/sup
  - title: دليل معدات الغوص
    tagline: المعرفة بقوارب الغوص التجارية
    desc: مرشدون متخصصون في قوارب الغوص وأضلاع الغوص ومعدات مراكز الغوص ومشغلي الغوص وفرق الغوص التجارية.
    guides:
      - title: أفضل RIB قارب لمراكز الغوص
        desc: كيفية اختيار الغوص المناسب RIB لمركز الغوص الخاص بك - اعتبارات السعة والتكوين والميزانية.
        href: /solutions-diving-center-boats
      - title: الغوص RIB دليل التكوين
        desc: الميزات الأساسية لأضلاع الغوص - رفوف الخزانات، وأنظمة السلم، ومنصة الغوص، وتخزين المعدات.
        href: /solutions-diving-center-boats
  - title: دليل عطاءات اليخوت
    tagline: اليخوت الفاخرة وحلول العطاءات البحرية
    desc: أدلة حول اختيار مناقصة اليخوت المثالية - المناقصات القابلة للنفخ، والمناقصات RIB، وحلول التخزين، وملحقات العطاء.
    guides:
      - title: كيفية اختيار مناقصة لليخوت
        desc: العوامل التي يجب مراعاتها عند اختيار مناقصة لليخت الخاص بك – الحجم والمواد والمحرك والتخزين.
        href: /solutions-yacht-tender-solutions
      - title: نفخ مقابل RIB المناقصات
        desc: قارن مناقصات القوارب القابلة للنفخ بمناقصات القوارب القابلة للنفخ الصلبة من حيث الأداء والمتانة والقدرة على التخزين.
        href: /compare/rib-vs-dinghy
  - title: دليل معدات الإنقاذ
    tagline: البحث والإنقاذ المعرفة المائية
    desc: مرشدون محترفون على قوارب الإنقاذ والمراكب المائية SAR ومعدات الاستجابة للطوارئ لخفر السواحل ورجال الإنقاذ وفرق الإغاثة في حالات الكوارث.
    guides:
      - title: SAR دليل اختيار القارب
        desc: كيفية اختيار قارب البحث والإنقاذ المناسب - السرعة والقدرة والمتانة ومتطلبات المعدات المتخصصة.
        href: /solutions-rescue-watercraft
      - title: تجاري RIB لعمليات الإنقاذ
        desc: لماذا تعد RIBs من الدرجة التجارية الخيار المفضل لفرق البحث والإنقاذ المحترفة في جميع أنحاء العالم.
        href: /use-cases/search-and-rescue
