hero:
  tagline: العملية
  title: عملية التصنيع
  subtitle: من المواد الخام إلى اللوح الجاهز للبحر — كل خطوة تحت سيطرتنا
  back_label: العودة إلى المصنع
  back_link: /factory
intro: على عكس العلامات التجارية التي تعتمد على مصانع طرف ثالث للإنتاج، تمتلك Paddle Board Overstock وتدير كامل سلسلة التصنيع الخاصة بها. تتيح لنا هذه التكامل العمودي الحفاظ على رقابة صارمة على الجودة في كل مرحلة وتقديم جودة منتج متسقة دفعة بعد دفعة. فيما يلي كيفية بناء اللوح في مصنعنا.
steps:
  - step: '01'
    title: استلام وفحص المواد
    description: يتم فحص كل دفعة واردة من قماش PVC، ونواة drop-stitch، ورغوة EVA، والقطع الميكانيكية مقابل المواصفات. يتم اختبار عينات القماش على مقاومة الشد، وتجانس السماكة، ومقاومة UV قبل السماح بالإنتاج. المواد غير المطابقة يتم عزلها وإرجاعها.
    duration: 1–2 يوم
  - step: '02'
    title: القطع الآلي PVC
    description: يتم وضع الأقمشة المعتمدة على ماكينة القطع الآلية CNC وقطعها بدقة دون ملليمتر. يوزع الترتيب الأمثل للكمبيوتر الألواح لتقليل الهدر — عادةً إلى أقل من 5%. يتم وسم الألواح المقطوعة حسب موديل اللوح والحجرة، ثم ربطها لانتقالها إلى ورشة اللحام.
    duration: 2-4 ساعات لكل مجموعة لوح
  - step: '03'
    title: لحام وأختام الحرارة للأنابيب
    description: تتم تثبيت وربط الألواح باستخدام ماكينات الختم الحراري مع لحام بالهواء الساخن عند درجات حرارة من 200-600 °م. يتم تعزيز اللحامات الرئيسية بلحام RF العازل للحصول على وصلات محكمة وقوية. يتم نفخ الحُجر المكتملة إلى 1.25 ضعف ضغط العمل لمدة 30 دقيقة للتحقق من احتجاز الهواء.
    duration: 1-2 يوم لكل لوح
  - step: '04'
    title: فن الجناح و EVA التشطيب
    description: 'لوحات سلسلة الفن تتشكل هنا: توضع ألواح رغوة EVA المقطوعة بدقة في أنماط اللوحة الكاملة، وتُلصق، وتُقص باليد. مريحة، متينة، وقابضة — المظهر المميز لكل لوح من سلسلة الفن.'
    duration: 1–2 يوم
  - step: '05'
    title: SUP الطباعة والزخرفة
    description: يتم تطبيق رسومات سطح لوحة SUP باستخدام الطباعة الرقمية للحصول على تصاميم كاملة الألوان بجودة الصور، والطباعة بالشاشة للشعارات والأنماط المتكررة المتينة. يتم تثبيت ومقاومة الطباعة ضد UV والتآكل.
    duration: 1–2 يوم
  - step: '06'
    title: التجميع النهائي والتركيب
    description: 'تستقبل الألواح مكوناتها النهائية: يتم شد الصمامات وفحص وظيفتها، تركيب الحلقات، المقابض، وصناديق الزعانف، وتثبيت حامل الحبل. يتبع كل لوح قائمة فحص تتكون من 100 نقطة مع توقيع إلزامي في كل مرحلة.'
    duration: 2-3 أيام
  - step: '07'
    title: اختبار الجودة والتفتيش
    description: 'يخضع كل لوح مكتمل لاختبار جودة إلزامي: اختبار احتباس الهواء للحجرة، فحص وظيفة النظام، التحقق من شد المشابك، وفحص تجميلي. تصاميم مخصصة ونماذج أولية تخضع أيضًا لاختبارات على الماء تشمل السرعة، والمناورة، والثبات، والتحمل.'
    duration: 1–2 يوم
  - step: '08'
    title: التغليف والشحن
    description: يتم تفريغ الهواء من الألواح، ولفها، وتعبئتها في حقائب سفر مع المضخة، والمجداف، والزعنفة، والحبل، ومجموعة الإصلاح، ثم وضعها في صناديق للشحن عبر البريد أو الشحن البحري. يتم وسم كل عبوة بالموديل، والرقم التسلسلي، والوجهة. نقوم بالشحن إلى 50+ دولة حول العالم.
    duration: 1 يوم
