      - title: معدات البداية
        description: 10 ألواح SUP مزودة بالمجاديف والمضخات وسترات النجاة وأدوات الإصلاح - كل ما تحتاجه للانطلاق
      - title: حلول التخزين
        description: يتم حزم المعدات القابلة للنفخ بشكل مسطح - لا حاجة إلى رصيف للقوارب أو مقطورة للتخزين
      - title: الامتثال للسلامة
        description: جميع المعدات حاصلة على شهادة CE مع بنية تجارية للاستخدام اليومي للإيجار
      - title: بداية التسويق
        description: أصول التصوير الفوتوغرافي ذات العلامات التجارية وقوالب قائمة الإيجار لمساعدتك في إطلاق خدمتك
    cta_text: Start Rental Fleet
    cta_href: /contact
