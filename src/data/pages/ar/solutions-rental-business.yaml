testimonial:
  content: كنت أستأجر 5 ألواح من متجر محلي وأفقد 60٪ من إيراداتي لهم. Paddle Board Overstock ساعدني في بناء أسطولي الخاص المكون من 15 SUPs. أظهر حاسبة ROI التي قدموها لي أنني سأصل إلى نقطة التعادل في 4 أشهر — استغرق الأمر بالفعل 3 أشهر. الآن أقوم بتوسيع العدد إلى 30 لوحًا.
  name: دانيال أوكونكو
  title: مالك شركة Lakeland SUP Rentals — أونتاريو، كندا
content_segments:
  tagline: ملفات تعريف الإيجار
  title: حلول تأجير رياضات مائية<br />حسب نوع المشغل
  subtitle: لعمليات التأجير المختلفة احتياجات مختلفة - بدءًا من تأجير SUP الصغير على شاطئ البحر إلى مراكز الرياضات المائية بالمنتجعات واسعة النطاق. نقوم بتصميم حزم المعدات الخاصة بنا ونموذج الدعم وفقًا لذلك.
  items:
    - title: إيجارات الشاطئ والبحيرات SUP
      subtitle: عمليات كبيرة الحجم ومنخفضة التعقيد
      description: المشغلون الذين يؤجرون ألواح التجديف الواقفة مباشرة لرواد الشاطئ وزوار البحيرة. أولويتك هي تقليل وقت التحويل بين الإيجارات، والحفاظ على المعدات في الدوران، وإدارة ذروة الطلب الموسمية بمساحة تخزين صغيرة.
      features:
        - أساطيل قابلة للنفخ SUP يمكن طيها بشكل مسطح — لا حاجة لرصيف أو مقطورة
        - درجة تجارية PVC مصنفة لـ 100 + دورة تأجير لكل موسم
        - قماش سريع الجفاف، مقاوم لـ UV جاهز لإعادة التأجير في نفس اليوم
        - نطاقات الألواح ملونة لسهولة تحديد الأسطول
    - title: مراكز الرياضات المائية بالمنتجعات والفنادق
      subtitle: تجربة الضيف ومواءمة العلامة التجارية
      description: المنتجعات والفنادق التي تقدم الرياضات المائية كوسيلة راحة في الموقع. يجب أن تبدو المعدات متميزة، وأن تعمل بشكل موثوق عبر الضيوف المبتدئين إلى المتوسطين، وأن تتكامل مع سير عمل حجز الأنشطة والفوترة الحالي في المنتجع.
      features:
        - ألواح وسترات نجاة مخصصة بعلامة تجارية تتناسب مع ألوان المنتجع
        - 'أسطول مختلط: ألواح شاملة، ألواح جولات، وسلسلة فنية'
        - حلول مضخات كهربائية هادئة وخالية من الوقود للنفخ على الشاطئ
        - تدريب الموظفين وشامل دمج الصيانة متضمن
    - title: تأجير بوتيك و متنقل
      subtitle: خدمات التأجير المؤقتة والقائمة على التوصيل
      description: المشغلون يقومون بإحضار الألواح مباشرة إلى العميل — توصيلات الشواطئ بالفنادق، محطات التأجير المؤقتة في الفعاليات، والترتيبات المتنقلة. يجب أن يكون المعدات سهلة النشر، سهلة النقل، ومظهرها جذاب للوهلة الأولى، مع إمكانية تعديل حجم الأسطول حسب الفعاليات والمتطلبات الموسمية.
      features:
        - نقل الألواح على شكل حقيبة ظهر — لا حاجة لمقطورة
        - نفخ سريع لإعداد عند الطلب في أقل من 15 دقيقة
        - معدات جذابة تبدو فاخرة عند الظهور لأول مرة
        - مرونة في حجم الأسطول للفعاليات والمتطلبات الموسمية
    - title: منظمي الرحلات والمغامرات
      subtitle: أساطيل الرحلات المصحوبة بمرشدين
      description: المشغلون يديرون جولات رياضات مائية موجهة — رحلات سفاري، رحلات سنوركل، وجولات استكشاف ساحلية. يجب أن تكون المعدات مستقرة بما يكفي للمبتدئين، وسهلة التنظيف بين المجموعات، ومتينة للاستخدام اليومي الموجه في ظروف مائية متنوعة.
      features:
        - منصات SUP مستقرة للغاية (عرض 32 بوصة +) للركاب الجدد
        - منصات مستقرة كبيرة جدًا لصور الجولات للأزواج/المجموعات
        - سعة شحن مدمجة لأدوات الغوص، الحقائب الجافة، والثلاجات المحمولة
        - حزم معدات السلامة لتشغيل الجولات التجارية
