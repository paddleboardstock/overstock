testimonial:
  content: كنت أستأجر 5 لوحات من متجر محلي وخسرت 60% من إيراداتي لصالحهم. لقد ساعدتني Aquafarer في بناء أسطولي الخاص المكون من 15 مركبة SUP. أظهرت حاسبة عائد الاستثمار التي قدموها أنني سأحقق التعادل في 4 أشهر - لقد استغرق الأمر في الواقع 3 أشهر. الآن أقوم بالتوسيع إلى 30 لوحًا وإضافة قوارب الكاياك.
  name: دانيال أوكونكو
  title: مالك شركة Lakeland SUP Rentals — أونتاريو، كندا
content_segments:
  tagline: ملفات تعريف الإيجار
  title: حلول تأجير الرياضات المائية<br />حسب نوع المشغل
  subtitle: لعمليات التأجير المختلفة احتياجات مختلفة - بدءًا من تأجير SUP الصغير على شاطئ البحر إلى مراكز الرياضات المائية بالمنتجعات واسعة النطاق. نقوم بتصميم حزم المعدات الخاصة بنا ونموذج الدعم وفقًا لذلك.
  items:
    - title: إيجارات الشاطئ والبحيرات SUP
      subtitle: عمليات كبيرة الحجم ومنخفضة التعقيد
      description: يقوم المشغلون بتأجير ألواح التجديف وقوارب الكاياك مباشرةً لرواد الشاطئ وزوار البحيرة. أولويتك هي تقليل وقت الاستجابة بين الإيجارات، والحفاظ على دوران المعدات، وإدارة الزيادات الموسمية في الطلب من خلال مساحة تخزين صغيرة.
      features:
        - أساطيل SUP قابلة للنفخ تُحفظ مسطحة — لا حاجة إلى رصيف أو مقطورة
        - PVC بجودة تجارية مصنف لأكثر من 100 دورة إيجار في الموسم
        - قماش سريع الجفاف ومقاوم للأشعة فوق البنفسجية لجاهزية إعادة التأجير في نفس اليوم
        - مجموعات ألواح مرمزة بالألوان لسهولة تمييز الأسطول
    - title: مراكز الرياضات المائية بالمنتجعات والفنادق
      subtitle: تجربة الضيف ومواءمة العلامة التجارية
      description: المنتجعات والفنادق التي تقدم الرياضات المائية كوسيلة راحة في الموقع. يجب أن تبدو المعدات متميزة، وأن تعمل بشكل موثوق عبر الضيوف المبتدئين إلى المتوسطين، وأن تتكامل مع سير عمل حجز الأنشطة والفوترة الحالي في المنتجع.
      features:
        - ألواح SUP وسدادات نجاة مخصصة بشعارك وبألوان المنتجع
        - 'أسطول متنوع: SUPs وكاياكات وقوارب دواسة وقوارب RIB صغيرة'
        - حلول مضخات كهربائية هادئة وخالية من الوقود للنفخ على الشاطئ
        - تشمل تدريب الموظفين والتأهيل على الصيانة
    - title: مشغلي تأجير القوارب والضلع
      subtitle: أساطيل تأجير السفن التجارية
      description: يقوم المشغلون بتأجير السفن التي تعمل بالطاقة - مناقصات RIB، والقوارب القابلة للنفخ، والمراكب الصغيرة - بالساعة أو نصف يوم. يجب أن يفي أسطولك بلوائح السلامة البحرية، وأن يتحمل الاستخدام المكثف للضيوف، ويقلل من وقت التوقف الميكانيكي بين الرحلات المستأجرة.
      features:
        - باقات RIB مع لوحات مؤخرة جاهزة لمحركات خارجية بقوة 30–90 حصانًا
        - ألواح أرضية من الخشب الرقائقي بجودة بحرية لسلامة هيكلية طويلة الأمد
        - أنظمة صمامات إطلاق سريع لدوران أسرع
        - طقم قطع غيار + دعم فني SLA عند الطلب
    - title: منظمي الرحلات والمغامرات
      subtitle: أساطيل الرحلات المصحوبة بمرشدين
      description: يقوم المشغلون بجولات الرياضات المائية المصحوبة بمرشدين - رحلات السفاري SUP، أو التجديف بالكاياك في الكهوف، أو رحلات الغطس الاستكشافية، أو جولات RIB للتنقل بين الجزر. يجب أن تكون المعدات مستقرة بما يكفي للضيوف المبتدئين، وسريعة التنظيف بين المجموعات، ومتينة بما يكفي للاستخدام اليومي المصحوب بمرشدين في ظروف مائية متنوعة.
      features:
        - منصات SUP فائقة الثبات (عرض 82 سم فأكثر) للمستخدمين لأول مرة
        - خيارات كاياك مزدوج لتكوينات جولات الأزواج والمجموعات
        - سعة حمولة مدمجة لمعدات الغطس والأكياس المقاومة للماء والثلاجات
        - توثيق مطابقة CE + USCG للعمليات التجارية
