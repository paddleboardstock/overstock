        description: مزيج من SUPs وقوارب الكاياك والقوارب القابلة للنفخ والأضلاع لخدمة تفضيلات الضيوف المتنوعة
      - title: تسعير الحجم
        description: أسعار الجملة المتدرجة لأساطيل مكونة من أكثر من 20 وحدة بأسعار لوجستية تفضيلية
      - title: العلامات التجارية المخصصة
        description: طباعة الشعار على المعدات وسترات النجاة ذات العلامات التجارية وخيارات الألوان المخصصة لأسطول الإيجار الخاص بك
      - title: برنامج الصيانة
        description: مجموعة قطع الغيار، والتدريب على الإصلاح للموظفين، والوصول المباشر إلى الدعم الفني
      - title: تحسين الإيرادات
        description: توصيات مبنية على البيانات بشأن التسعير وتناوب المعدات وتعديلات الأسطول الموسمية
    cta_text: Scale My Fleet
