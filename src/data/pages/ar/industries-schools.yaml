hero:
  tagline: مدارس الرياضات المائية ومراكز التدريب
  title: حلول المعدات<br />لمدارس SUP وKayak
  subtitle: معدات موثوقة من الدرجة التجارية لمدارس التجديف، وتعليم ركوب الأمواج، والتدريب على قوارب الكاياك، وبرامج تعليم الرياضات المائية على أي نطاق.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: لوحات Aquafarer SUP للمدارس ومراكز التدريب
direct_answer: تقوم Aquafarer بتزويد مدارس SUP وقوارب الكاياك في جميع أنحاء العالم بألواح من الدرجة التجارية، ومعدات السلامة، وحزم المدربين. تم تصميم أجهزتنا للاستخدام التعليمي اليومي - بولي كلوريد الفينيل السميك، وقلوب معززة للخياطة المتدلية، وتصميمات هيكل ثابتة تمنح المبتدئين الثقة وموثوقية المدربين. تتضمن الحزم العلامات التجارية المخصصة، وبرامج قطع الغيار، وموارد التدريب.
solution_offerings:
  - title: حزمة المدرسة المبتدئة
    subtitle: للبرامج الجديدة ومراكز التدريب الصغيرة
    badge: Popular
    features:
      - title: ألواح الطلاب
        description: 10-25 لوح SUP شامل أو قوارب الكاياك الترفيهية مع منصات ثابتة لدروس المبتدئين
      - title: ألواح المدربين
        description: ألواح أوسع وأطول مع ثبات إضافي وأسطح EVA غير قابلة للانزلاق للتدريب
      - title: معدات السلامة
        description: سترات النجاة والمقاود والصفارات وأكياس النجاة بألوان متطابقة
      - title: التخزين والنقل
        description: رفوف ألواح قابلة للتكديس، وحوامل قوارب الكاياك المبطنة، ودمى النقل
      - title: دعم المناهج
        description: قوالب الدروس وقوائم التحقق من السلامة وأدلة تقدم المهارات
    cta_text: ابدأ باقة مدرستي
    cta_href: /contact
  - title: باقة المدرسة المتميزة
    subtitle: للمدارس القائمة ومشغلي البرامج المتعددة
    badge: Best Value
    features:
      - title: أسطول كامل
        description: 25-50 لوحًا أو قوارب كاياك بأسطول مختلط (شامل، للرحلات، بأحجام الشباب)
      - title: أسطول المدربين
        description: 3-5 لوحات تعليمية متخصصة مزودة بتركيبات نظام صوت مدمجة
      - title: محطة السلامة
        description: محطة معدات أمان مركزية مزودة بأجهزة PFD وأجهزة راديو وإسعافات أولية ولافتات
      - title: حزمة العلامات التجارية
        description: طباعة الشعار بالكامل على اللوحات والمجاديف وPFDs والزي الرسمي
      - title: برنامج الصيانة
        description: مجموعات الصيانة ربع السنوية، وحزم قطع الغيار، والتدريب على الإصلاح
    cta_text: جهّز الباقة المميزة
    cta_href: /contact
  - title: باقة امتياز المدرسة
    subtitle: للسلاسل متعددة المواقع ومشغلي الامتياز
    badge: Enterprise
    features:
      - title: توحيد الأسطول
        description: معدات متطابقة في جميع المواقع للحصول على تجربة طلابية متسقة
      - title: الترتيب المركزي
        description: الطلب الموحد، والتسعير بالجملة، والإدارة المركزية لقطع الغيار
      - title: تدريب المدربين
        description: شهادة التعامل مع المعدات وصيانتها لجميع المعلمين
      - title: العلامة التجارية المشتركة
        description: علامة تجارية مشتركة مع امتياز + خيارات العلامة التجارية المشتركة لـ Aquafarer
      - title: دعم التوسع
        description: استشارة حول التوسع، والتنبؤ بالمعدات، وإعداد الموقع الجديد
    cta_text: ناقش خطة الامتياز التجاري
    cta_href: /contact
benefits:
  - title: مصممة للتعليمات اليومية
    description: تتحمل القضبان المعززة المصنوعة من مادة PVC السميكة الاستخدام اليومي للطلاب، والسقوط على الرمال، والهبوط الصخري.
    icon: tabler:shield
  - title: منصات التعلم المستقرة
    description: تمنح الهياكل الأوسع والأرجحة المسطحة الثقة للمبتدئين. يركز المدربون على التدريس وليس على المعدات.
    icon: tabler:scale
  - title: سهولة التخزين والنقل
    description: مخازن تصميم قابلة للنفخ في المساحات الصغيرة. تتناسب الألواح المفرغة مع صناديق السيارات القياسية للتدريس المتنقل.
    icon: tabler:box-seam
  - title: العلامات التجارية المخصصة
    description: شعارات المدرسة وألوانها على كل لوحة. علامتك التجارية، هويتك - وليس معدات التأجير العامة.
    icon: tabler:brush
content_segments:
  tagline: ملفات تعريف المدرسة
  title: حلول تعليم الرياضات المائية<br />حسب نوع البرنامج
  subtitle: تواجه كل من مدارس التجديف وأكاديميات ركوب الأمواج والبرامج الجامعية ومشغلي الامتياز تحديات تشغيلية مختلفة - بدءًا من تكامل المناهج الدراسية وحتى توحيد الأسطول متعدد المواقع. نقوم بتكوين حزم المعدات لتتناسب مع النموذج التعليمي.
  items:
    - title: مدارس SUP وKayak المستقلة
      subtitle: مراكز التدريب التي يديرها المالك
      description: مدارس صغيرة ومتوسطة الحجم يديرها مدربون مالكون ويقدمون دروس SUP والتدريب على قوارب الكاياك ودورات الشهادات. يجب أن تكون المعدات متينة بما يكفي للاستخدام التعليمي اليومي، وبأسعار معقولة لميزانية الأعمال الصغيرة، ومتعددة الاستخدامات بما يكفي لخدمة المبتدئين وحتى الطلاب المتوسطين في أسطول واحد.
      features:
        - ألواح SUP متعددة الاستخدامات ثابتة وكاياك ترفيهي لدروس المبتدئين
        - ألواح مخصصة للمدربين بثبات إضافي للتدريب من على الماء
        - قوالب خطط الدروس وأدلة تطور المهارات مشمولة
        - برنامج تجديد سنوي للمعدات مع خصومات المقايضة
    - title: البرامج الترفيهية للجامعات والكليات
      subtitle: أساطيل ترفيهية للطلاب واسعة النطاق
      description: تدير أقسام الترفيه بالجامعة نوادي التجديف وبرامج الإيجار والدورات التعليمية كجزء من عروض الترفيه بالحرم الجامعي. تواجه المعدات ذروة الاستخدام خلال الفصول الدراسية، وتتطلب أنظمة تسجيل وصول/مغادرة سهلة، ويجب أن تتحمل مستويات مهارات متنوعة بدءًا من الطلاب لأول مرة وحتى ممارسي رياضة التجديف المتقدمين.
      features:
        - هيكل PVC عالي التحمل مصنّف لدورات الاستخدام المؤسسي
        - أسطول مرمّز بالألوان حسب مستوى المهارة لسهولة الإدارة
        - توافق مع أنظمة تتبع المخزون القائمة على RFID أو الملصقات
        - أسعار جملة مع طلبات وشروط دفع على أساس فصلي
    - title: مدارس ركوب الأمواج وأكاديميات ركوب الأمواج
      subtitle: برامج تعليم ركوب الأمواج الساحلية
      description: تقوم مدارس ركوب الأمواج بتدريس مهارات ركوب الأمواج SUP والتجديف المنبطح وركوب الأمواج بقوارب الكاياك في بيئات المحيط. يجب أن تتعامل المعدات مع ظروف منطقة ركوب الأمواج - مقاومة الصدمات، وتحمل الرمال والمياه المالحة، وسهولة الشطف والإرجاع بين الدروس كل ساعة.
      features:
        - أشكال مخصصة للسيرف مع حواف معززة وهيكل مقاوم للصدمات
        - خيارات زعانف ناعمة وأحزمة ملفوفة لسلامة الطلاب
        - قماش سريع الشطف يجف بين فترات الدروس
        - برنامج استبدال الأسطول مع فحص وتجديد في نهاية الموسم
    - title: سلاسل الامتياز والمواقع المتعددة
      subtitle: معدات موحدة عبر المواقع
      description: مشغلون متعددو المواقع يديرون برامج تدريب موحدة عبر مدن أو مناطق متعددة. يعد اتساق الأسطول عبر المواقع أمرًا بالغ الأهمية - يجب أن يتمتع كل طالب بنفس تجربة المعدات بغض النظر عن موقع الامتياز الذي يزوره. يعد الطلب المركزي وتوحيد العلامات التجارية ودعم التوسع أمرًا ضروريًا.
      features:
        - مواصفات أسطول متطابقة في جميع فروع الامتياز التجاري
        - طلبات مركزية موحدة بأسعار الكمية
        - 'خيارات العلامة التجارية المشتركة: علامة الامتياز + علامة Aquafarer المشتركة'
        - 'حزمة تجهيز الفرع الجديد: معدات ولوحات إرشادية ومخزون الافتتاح'
