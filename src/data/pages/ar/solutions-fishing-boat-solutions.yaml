content_challenge:
  tagline: التحدي
  title: قوارب الصيد تحتاج إلى<br />استقرار ومدى ومتانة
  subtitle: سواء كنت تدير سفن صيد تجارية، أو تدير أسطولًا تعاونيًا، أو تدير مواثيق صيد - يحتاج قاربك إلى الأداء بشكل موثوق كل يوم.
  paragraphs:
    - تحتاج قوارب الصيد إلى منصات ثابتة للعمل بالخيوط ومناولة الصيد والتحرك بأمان على سطح القارب. توفر القوارب القابلة للنفخ وقوارب RIB استقرارًا متأصلًا بفضل تصميم الأنابيب — وهي ميزة كبيرة مقارنة بالهياكل الصلبة المماثلة في الطول.
    - تعد كفاءة استهلاك الوقود أمرًا مهمًا لعمليات الصيد حيث تؤثر تكاليف التشغيل بشكل مباشر على الربحية. تعد القوارب المطاطية ذات الضلع والقوارب القابلة للنفخ أخف وزنًا من القوارب الصلبة المماثلة، وتتطلب طاقة أقل وتحرق وقودًا أقل - وهو أمر بالغ الأهمية للمشغلين التجاريين الذين يقومون بتشغيل القوارب يوميًا والتعاونيات التي تدير ميزانيات الأسطول.
    - المتانة في البيئات البحرية أمر ضروري. تتطلب المياه المالحة والتعرض للأشعة فوق البنفسجية والاستخدام المستمر مواد يمكنها تحمل الظروف القاسية دون تدهور. بالنسبة للمشغلين التجاريين والتعاونيين، تؤثر الموثوقية بشكل مباشر على الدخل - فالقارب المكسور يعني أيام صيد ضائعة.
    - Aquafarer تتضمن تكوينات الصيد حاملات القضبان، وأجهزة تحديد الأسماك، وآبار الطعم، والآبار الحية، وحلول مناولة البضائع المصممة لتطبيقات الصيد الجادة عبر العمليات التجارية والتعاونية والترفيهية.
content_solution:
  tagline: الحل لدينا
  title: تكوينات جاهزة للصيد
  subtitle: يمكن تكوين كل قارب صيد من Aquafarer ليناسب تطبيق الصيد المحدد لديك.
  list:
    - تثبيت حامل الصنارة — مثبت من المصنع أو جاهز للتركيب لاحقًا
    - لوحة تثبيت جهاز تحديد الأسماك/GPS في موضع الكونسول
    - خيارات حوض الطعم أو الحوض الحي لمشغلي الرحلات البحرية والعمليات التجارية
    - تكوينات الثلاجة/التخزين لمناولة الصيد
    - هيكل deep-V للقدرة في أعالي البحار — ثابت عند التوقف وسلس عند السرعة
    - خيارات الأنابيب PVC أو Hypalon — Hypalon للتعرض الممتد للأشعة فوق البنفسجية
    - مدى المحركات الخارجية من 15 حصانًا إلى 115 حصانًا حسب الطراز والتطبيق
content_segments:
  tagline: ملامح الصيد
  title: حلول قوارب الصيد القابلة للنفخ<br />حسب نوع المشغل
  subtitle: من الصيد الرياضي على الشاطئ إلى الصيد بالخيوط الطويلة التجارية - تتطلب عمليات الصيد المختلفة تكوينات مختلفة للهيكل، ونطاقات الطاقة، والإعدادات على سطح السفينة. نحن نصمم كل قارب ليتناسب مع مصايد الأسماك والمياه وأسلوب العمل.
  items:
    - title: شركات الصيد التجارية
      subtitle: أسطول قوارب العمل لعمليات الصيد اليومية، ومناولة الشباك، ونقل الصيد
      description: تقوم شركات الصيد التجارية بتشغيل قوارب عمل لوضع الشباك واسترجاعها، وخدمة المصائد، والخيوط الطويلة، ونقل الصيد. تعمل هذه القوارب يوميًا في بيئات المياه المالحة ويجب أن تتحمل الأحمال الثقيلة والتعامل المستمر مع سطح السفينة وساعات العمل الطويلة. تعتبر كفاءة استهلاك الوقود وانخفاض الصيانة أمرًا بالغ الأهمية لربحية الأسطول. يجب أن توفر السفينة منصات عمل مستقرة لمعدات مناولة الطاقم والصيد في الظروف البحرية المختلفة.
      features:
        - تصميم سطح مسطح للتعامل مع الشباك وتكديس المصائد وتخزين الأسماك
        - كفاءة في استهلاك الوقود 40-115 HP خارجي لتكلفة تشغيل يومية منخفضة
        - أنابيب Hypalon شديدة التحمل لمقاومة التآكل أثناء الاستخدام اليومي
        - خطوط فرك معززة للاتصال المتكرر بالرصيف والسفينة
        - سطح ذاتي الكفالة لسهولة الغسيل بعد العمليات
        - تسعير الأسطول ومواصفات متسقة لمشغلي السفن المتعددة
    - title: مشغلي الصيد الميثاق
      subtitle: راحة الركاب المتعددين، التعامل مع الإمساك، شهادة السلامة
      description: يدير المشغلون مواثيق صيد لمدة نصف يوم ويوم كامل - بدءًا من صيد الشعاب المرجانية القريبة من الشاطئ وحتى الصيد في قاع البحر. يحتاج القارب الخاص بك إلى مقاعد للركاب مع شهادات السلامة، ومساحة واسعة على سطح السفينة للعديد من الصيادين، وبئر حية متكاملة للحفاظ على الطُعم والصيد طازجًا طوال الرحلة. تؤثر راحة الضيوف بشكل مباشر على تقييمات الرحلات والحجوزات المتكررة والتقييمات عبر الإنترنت.
      features:
        - عجلة قيادة كونسول مع مقاعد دلو ممتصة للصدمات
        - حاملات قضبان مثبتة في المصنع (4-8 مواضع)
        - 60–115 HP النطاق الخارجي لسرعات الإبحار البحرية
        - CE شهادة الفئة C أو B لعمليات الركاب التجارية
        - مظلة بيميني أو T-top لراحة الضيوف في الرحلات الطويلة
    - title: الصيادون الحرفيون والتجاريون على نطاق صغير
      subtitle: قوارب عمل موثوقة لكسب العيش اليومي
      description: الصيادون المستقلون الذين يعتمدون على قواربهم كمصدر دخل أساسي لهم - مثل تركيب الشباك، أو رعاية مصائد الأسماك، أو الصيد بالقرب من الشاطئ. أولويتك هي الاقتصاد في استهلاك الوقود، والصيانة البسيطة التي يمكنك إجراؤها بنفسك، والقارب الذي يتعامل مع الأحمال المعتدلة من الصيد والعتاد دون التضحية بالاستقرار.
      features:
        - كفاءة في استهلاك الوقود 15–40 HP خارجي لتكلفة تشغيل منخفضة
        - Hypalon CSM أنابيب لمقاومة ممتدة للأشعة فوق البنفسجية والتآكل
        - تصميم سطح مسطح للتعامل مع الشباك وتخزين الأسماك
        - إمكانية الهبوط على الشاطئ بسهولة مع حماية العارضة القابلة للنفخ
    - title: تعاونيات الصيد
      subtitle: جمع المصيد ونقل الأعضاء وتوزيع الإمدادات
      description: تدير تعاونيات الصيد أساطيل مجتمعية لجمع المصيد من الصيادين الأعضاء، ونقل الإمدادات إلى مجتمعات الصيد النائية، وتوزيع الحصاد على الأسواق. تحتاج قوارب العمل هذه إلى سعة حمولة عالية، وتشغيل يومي موثوق، وسهولة الصيانة في المواقع النائية. تعمل التعاونيات غالبًا في المناطق النامية حيث يكون توافر قطع الغيار والوصول إلى الخدمة محدودًا، مما يجعل التكوينات الخارجية البسيطة والبناء الدائم أمرًا ضروريًا.
      features:
        - قدرة حمولة عالية لنقل المصيد والإمدادات
        - تكوين خارجي بسيط لسهولة الخدمة في الموقع
        - هيكل عالي التحمل PVC أو Hypalon لمرونة الميزانية
        - سطح مسطح مزود بنقاط ربط لتأمين البضائع
        - عملية موفرة للوقود تقلل من تكاليف التشغيل التعاوني
    - title: عشاق الرياضة وصيد الأسماك
      subtitle: الأداء والأناقة للصيادين الجادين
      description: الصيادون ذوو الخبرة الذين يبحثون عن منصة صيد قادرة على توفير السرعة إلى الأراضي البعيدة، وأوضاع قتال ثابتة، وملاءمة ولمسة نهائية ممتازة. يجب أن يشعر القارب وكأنه في منزله سواء كان يسير على بعد ميلين من الشاطئ إلى الشعاب المرجانية أو يستكشف المياه النائية في مصبات الأنهار.
      features:
        - هيكل Deep-V RIB لركوب سلس في الفرم
        - لوحة تركيب Fishfinder/GPS موصلة مسبقًا بوحدة التحكم
        - بيتويل والمبرد مدمجان في وحدة المقعد الخلفي
        - خيارات ألوان سطح السفينة EVA مخصصة تتوافق مع رسومات القارب/الأنبوب
    - title: دليل الصيد ومنظمي الرحلات البيئية
      subtitle: تجارب صيد بصحبة مرشدين لزيارة الصيادين
      description: المرشدون الذين يأخذون مجموعات صغيرة من الصيادين الزائرين إلى مواقع الصيد المنتجة - غالبًا ما يجمعون بين الصيد وعناصر السياحة البيئية مثل مراقبة الطيور أو استكشاف أشجار المانغروف. يجب أن يكون القارب جافًا ومريحًا للضيوف غير المعتادين على القوارب الصغيرة، مع خيارات الصعود والظل السهلة.
      features:
        - نقاط التثبيت العلوية أو T-top مثبتة في المصنع
        - سلم صعود سلس للدخول لسهولة إعادة الصعود
        - محرك خارجي هادئ رباعي الأشواط لتقليل الإزعاج
        - مساحات تخزين جافة لهواتف الضيوف والمحافظ والكاميرات
