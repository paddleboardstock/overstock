faq:
  title: الأسئلة الشائعة حول الحزمة
  questions:
    - q: ما هو الحد الأدنى لكمية الطلب للحزم؟
      a: تحتوي باقة Club Starter على 10 وحدات على الأقل. يتم تخصيص باقات المنتجعات والعلامات التجارية حسب احتياجاتك من خلال موك مرنة.
    - q: كم من الوقت يستغرق التسليم؟
      a: الإنتاج القياسي هو 30-45 يومًا من تأكيد الطلب. الإنتاج المعجل متاح مقابل رسوم إضافية.
    - q: هل يمكنني تخصيص ألوان المعدات والعلامة التجارية؟
      a: نعم. تتضمن جميع الحزم تخصيصًا كاملاً - ألوان اللوحة ومطبوعات الشعار وتصميم العبوة.
    - q: هل تقدمون دعم ما بعد البيع؟
      a: نعم. تتضمن كل حزمة إمكانية الوصول إلى أدلة الصيانة عبر الإنترنت ودروس الفيديو ونظام طلب قطع الغيار.
