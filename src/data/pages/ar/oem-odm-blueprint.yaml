process_steps:
  title: عملية مكونة من 6 خطوات OEM/ODM
  subtitle: من موجز التصميم إلى FOB تشينغداو — سير عمل مبسط
  steps:
    - number: '01'
      title: موجز التصميم والنمذجة ثلاثية الأبعاد باستخدام CAD
      description: شارك مواصفاتك المستهدفة، أو المنتج المرجعي، أو الفكرة. يقوم فريقنا الهندسي بتطوير رسومات CAD التفصيلية وتصويرات ثلاثية الأبعاد لموافقتك.
      timeline: 3-5 أيام
    - number: '02'
      title: اختيار المواد واختبار الأقمشة
      description: اختر من الأقمشة العسكرية الدرجة PVC (0.9–1.2 مم)، Hypalon CSM، أو drop-stitch الأساسية. نحن نجري اختبارات القوة الشد، التصاق الطلاء، واستقرار UV.
      timeline: 2-3 أيام
    - number: '03'
      title: النمذجة السريعة وإنتاج العينات
      description: نحن نصنع قوالب مخصصة باستخدام ماكينة CNC وننتج عينات قبل الإنتاج بألوان علامتكم التجارية وشعاركم والمواد المحددة. يتم شحن العينات لموافقتكم.
      timeline: 7-14 يومًا
    - number: '04'
      title: اختبار التحمل بالضغط العالي لمدة 24–48 ساعة
      description: يخضع كل نموذج أولي لاختبار دقيق للحفاظ على الضغط عند 1.25 ضعف الضغط المقدر. يتم إجراء اختبارات تقشر اللحامات والتحقق من الأبعاد.
      timeline: 1–2 يوم
    - number: '05'
      title: CE/ISO فحص الجودة والتعبئة
      description: قائمة فحص جودة من 100 نقطة. يتم فحص كل وحدة قبل التعبئة الجاهزة للبيع بالتجزئة. CE إخطار بالامتثال و BSCI تقرير الامتثال متضمنان.
      timeline: 2-3 أيام
    - number: '06'
      title: FOB شحن ولوجستيات تشينغداو
      description: البضائع الجاهزة مُكدسة على منصات نقل، ومغلفة بالشرنك، ومحمّلة في الحاويات في ميناء تشينغداو. مستندات تصدير كاملة، تخليص جمركي، وتتبع لحظي.
      timeline: 7-14 يومًا
