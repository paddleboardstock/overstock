  title: مركز البحث والتطوير
  subtitle: محورنا التقدم

intro:
  - مركز البحث والتطوير (R&D) لدى أكوافارر هو القوة الدافعة وراء مهمتنا لإحداث ثورة في معدات الرياضات المائية. نمكّن عشاق الرياضات المائية في جميع أنحاء العالم بمنتجات أكثر أماناً وراحة ومتعة من خلال الابتكار الدؤوب في ألواح التجديف الوقوف القابلة للنفخ (SUPs) والقوارب. وفريقنا المتفاني من المهندسين والمصممين وخبراء الرياضات المائية المتحمسين يشكّل مستقبل الصناعة، ويرفع باستمرار سقف الجودة والأداء والاستدامة.
  - يجمع مرفق R&D لدينا بين علماء المواد والمهندسين البحريين ومهندسي الإنتاج تحت سقف واحد. ومن صياغة الأقمشة ومحاكاة الهيكل إلى تطوير عمليات اللحام وتجارب البحر بالحجم الكامل، تُقاد كل مرحلة من تطوير المنتج بالبيانات وتُتحقق منها بالاختبار.

