      desc: ضمان أعلى معايير السلامة من خلال اختبار وشهادات صارمة.

pillars:
  - title: التطور التكنولوجي
    desc: ريادة مواد وتصاميم وعمليات تصنيع جديدة لتقديم أداء ومنتج متفوق وطول عمر.
    icon: tech
  - title: مواد متقدمة
    desc: دراسة PVC وHypalon والمركبات والبدائل المستدامة المتطورة لتعزيز خصائص المنتج.
    icon: materials
