rd_services:
  tagline: بحث وتطوير مخصص
  title: خدمات البحث والتطوير للشركاء
  services:
    - title: تطوير مواد مخصصة
      desc: نطوّر صيغ أقمشة مخصصة ومكدسات طبقات لاصقة وأنظمة لاصقة مصممة لبيئتك التشغيلية وأهداف الأداء.
    - title: هندسة منتجات OEM / ODM
      desc: من رسومات الفكرة إلى حزم هندسية جاهزة للإنتاج — يمكن لفريقنا تصميم القوارب ونمذجتها والتحقق منها تحت علامتك التجارية.
    - title: اختبار واعتماد من طرف ثالث
      desc: استخدم مرافق الاختبار المتوافقة مع ISO لدينا لاختبار المواد المستقل والتحقق من المنتج ودعم الاعتماد.
  cta: ناقش متطلبات البحث والتطوير لديك →
  cta_link: /contact

vision:
  tagline: رؤيتنا
  title: تشكيل مستقبل الرياضات المائية
  body: تسعى أكوافارر لقيادة صناعة القوارب واللوحات SUP القابلة للنفخ من خلال الابتكار المستمر والجودة الثابتة والالتزام الراسخ بالسلامة والاستدامة — مما يثري في النهاية تجارب عشاق الرياضات المائية في جميع أنحاء العالم. ومركز أكوافارر للبحث والتطوير هو حيث يلتقي الشغف بالابتكار، ويضع معايير جديدة لصناعة الرياضات المائية.

labs_section:
  tagline: المختبرات
  title: مختبراتنا
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: مختبر أقمشة PVC
      description: بحث واختبار مستمر لأقمشة أنابيب PVC وHypalon من حيث القوة الشدّية ومقاومة الأشعة فوق البنفسجية والبلى والمرونة عند درجات الحرارة المنخفضة لضمان الموثوقية طويلة الأمد في البيئات البحرية.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: استوديو هندسة الهيكل
      description: تصميم مدفوع بـ CAD وتحليل العناصر المحدودة لهياكل HDPE والألمنيوم والألياف الزجاجية. ويُحاكى كل هيكل رقمياً لتوزيع الإجهاد ومقاومة الصدمات قبل بناء النموذج الأول.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: مركز لحام RF
      description: مرفق لحام بالتردد الراديوي مخصص مع تحكم دقيق في درجة الحرارة والضغط، ينتج وصلات محكمة الهواء عالية المتانة تلبي معايير صناعة القوارب القابلة للنفخ.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: حوض اختبار الديناميكا المائية
      description: اختبار النماذج المقياس في حوض الاختبار الداخلي لدينا لتحسين شكل الهيكل وأداء الانزلاق والاستقرار وكفاءة الوقود عبر مجموعة من أحمال وظروف البحر.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: ورشة النماذج الأولية
      description: مرفق نماذج وتجهيز بالحجم الكامل حيث تُبنى الطرازات الجديدة وتُركّب وتُجرّب بحرياً. ويخضع كل نموذج أولي لبرنامج اختبار في الماء لا يقل عن 20 ساعة قبل اعتماد الإنتاج.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: مختبر الجودة والفحص
      description: مختبر مخصص لضمان الجودة يجري اختبار الشدّ ودورات الاحتفاظ بالهواء واختبارات تقشير المفاصل واعتماد المواد لضمان أن كل قارب يغادر الورشة يلبي مواصفاتنا المنشورة.
      href: /randdcenter/quality-inspection-lab
