    desc: 'التزام جوهري: نحن ملتزمون بالمسؤولية البيئية من خلال التصنيع المستدام والمواد القابلة لإعادة التدوير.'
    icon: sustainability

capabilities:
  tagline: القدرات
  title: قدرات البحث والتطوير
  subtitle: أربعة تخصصات أساسية تمنحنا سيطرة شاملة على تطوير المنتج — من بحث المواد الخام إلى الاعتماد النهائي.
  groups:
    - title: علوم المواد وتقنية الأقمشة
      items:
        - تحليل وتحسين صياغة PVC وHypalon
        - تطوير تثبيت الأشعة فوق البنفسجية ومقاومة اللهب والإضافات المضادة للميكروبات
        - هندسة التصاق وترقيق الأقمشة متعددة الطبقات
        - اختبار الشيخوخة المعجّل (الأشعة فوق البنفسجية، الحرارة، الرطوبة، رذاذ الملح)
    - title: هندسة الهيكل والديناميكا المائية
      items:
        - تصميم هيكل ثلاثي الأبعاد معامل وترشيد CFD
        - تحليل العناصر المحدودة للأحمال الهيكلية والصدمية
        - اختبار نماذج مقياس في حوض القطر والتحقق من الأداء
        - تطوير هيكل مخصص لملفات مهام خاصة
    - title: تقنية اللحام والوصل
      items:
        - تطوير وتحسين عملية لحام RF ثنائي الاستقطاب
        - طرق اللحام بالهواء الساخن والإسفين الساخن والموجات فوق الصوتية
        - تأهيل الالتصاق اللاصق وشريط المفصل
        - نمذجة قوة اللحام والتنبؤ بالعمر الافتراضي
    - title: الاختبار والاعتماد والامتثال
      items:
        - إدارة الجودة واختبار الامتثال CE
        - دعم الاختبار والاعتماد المستقل من طرف ثالث
        - تطوير بروتوكول اختبار مخصص لتأهيل المشتريات
        - تحليل الفشل أثناء الخدمة والتحقيق في السبب الجذري

