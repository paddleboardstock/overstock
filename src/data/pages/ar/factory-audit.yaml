    detail: سجلات كاملة من الدفعة إلى التسليم
content_priorities:
  tagline: ما يتحقق منه العملاء
  title: 8 أشياء يتحقق منها المشترون<br />في كل زيارة للمصنع
  subtitle: استنادًا إلى التعليقات الواردة من أكثر من 50 مشتريًا من الدول، هذه هي الأولويات الثمانية التي يقوم العملاء بتقييمها قبل تقديم طلب B2B.
  items:
    - title: الصانع الحقيقي
      description: 'هل أنت المصنع الفعلي، وليس شركة تجارية؟ يتحقق المشترون من: الكيان التجاري، ومعدات الإنتاج الحقيقية، وآلات تشغيل الموظفين، وأوامر الإنتاج الحالية على الأرض، واتساق ورشة العمل على الويب.'
      icon: tabler:building-factory
    - title: المنتج مناسب للتطبيق
      description: هل يتطابق RIB مع حالة الاستخدام المحددة الخاصة بهم؟ لدى مشغلي المنتجعات والإنقاذ والغوص وصيد الأسماك والدوريات متطلبات مختلفة بشكل أساسي. يقوم المشترون بتقييم تخطيط سطح السفينة، والمواد الأنبوبية، وخيارات المعدات على القارب المعروض.
      icon: tabler:target
    - title: استقرار الجودة وقابلية التكرار
      description: هل الوحدة الخمسين جيدة مثل الأولى؟ يقوم المشترون بفحص أنظمة مراقبة الجودة، ونقاط التفتيش أثناء العملية، ومعالجة عدم المطابقة، ويطلبون رؤية السجلات من عمليات الإنتاج المتعددة للتحقق من الاتساق.
      icon: tabler:repeat
    - title: صحة وثيقة الامتثال
      description: هل شهادات CE خاصة بنموذج معين؟ هل تم توقيع وثيقة التعاون من قبل شخص حقيقي؟ هل يمكن التحقق من الامتثال لكل رقم بدن؟ يتحقق المشترون من المطالبات الشاملة مقابل الوثائق الخاصة بالطراز.
      icon: tabler:file-certificate
    - title: تنفيذ التخصيص
      description: هل يمكن للمصنع بالفعل تقديم تكوينات مخصصة؟ يبحث المشترون عن أدلة على المشاريع المخصصة السابقة، وعينات النماذج الأولية المعروضة، والرسومات الهندسية، والقدرة على مناقشة التعديلات الفنية على الفور.
      icon: tabler:adjustments
    - title: المهلة الزمنية والقدرة
      description: 'هل الجداول الزمنية المقتبسة واقعية؟ يقوم المشترون بتقييم: حجم الإنتاج الحالي، والقدرة المتاحة، وحجم القوى العاملة، ومستويات مخزون المواد، وما إذا كان المصنع لديه نظام لتخطيط الإنتاج.'
      icon: tabler:clock
    - title: شروط السعر والتجارة
      description: 'هل الأسعار شفافة؟ هل تسعير FOB واضح؟ يتحقق المشترون من: تفاصيل سعر الوحدة، وتكاليف الأدوات، وتكاليف التعبئة والتغليف، وما إذا كان المصنع يمكنه التعامل مع شروط DDP أو CIF مع وثائق التصدير المناسبة.'
      icon: tabler:currency-dollar
    - title: خدمات ما بعد البيع وقطع الغيار
      description: 'ماذا يحدث بعد الولادة؟ يقوم المشترون بتقييم: توفر قطع الغيار، وعملية الضمان، واستبدال أقسام الأنابيب، واستبدال الصمامات، وما إذا كان المصنع لديه بروتوكول موثق لما بعد البيع.'
      icon: tabler:headset
content_tour:
  tagline: طريق جولة المصنع
  title: جولة التدقيق —<br />ما ستراه
  subtitle: تتبع جولة المصنع القياسية لدينا مسارًا محددًا مصممًا للإجابة على أسئلة المشتري في كل محطة.
  items:
    - title: 1. غرفة الاجتماعات – مقدمة عن الشركة
      description: الرخصة التجارية وشهادات ISO 9001 وBSCI وتراخيص التصدير وتاريخ الشركة. نظرة عامة سريعة على قدرات الإنتاج ونطاق الامتثال.
      icon: tabler:users
    - title: 2. مستودع المواد الخام – محطة IQC
      description: سجلات فحص المواد الواردة وشهادات دفعة النسيج والمواد اللاصقة وعينات الأجهزة. تعرف على كيفية اختبار المواد قبل دخولها مرحلة الإنتاج.
      icon: tabler:building-warehouse
    - title: 3. تصنيع الأنابيب - اللحام بالترددات اللاسلكية واللصق اليدوي
      description: عملية لحام أو لصق الأنبوب المباشر، وعروض اختبار قوة التماس، وتركيب الصمامات. مراقبة بناء كل غرفة على حدة ونقاط تفتيش الجودة.
      icon: tabler:flame
    - title: 4. تصفيح الهيكل – ورشة عمل GRP
      description: عملية وضع الألياف الزجاجية، وتطبيق الجلكوت، ومعالجة الهيكل. راجع جدول التصفيح والتعزيز الهيكلي لنماذج RIB المختلفة.
      icon: tabler:layers-subtract
    - title: 5. التجميع والتكامل
      description: ربط أنبوب الهيكل، وتركيب وحدة التحكم والمقعد، وتكامل النظام الكهربائي ونظام الوقود، وتركيب المعدات. مراقبة خط الإنتاج قيد التشغيل.
      icon: tabler:tool
    - title: 6. محطة اختبار الضغط
      description: اختبار تثبيت الضغط لمدة 24-48 ساعة عند ضغط مقنن 1.25x. عرض سجلات الاختبار، وأجهزة قياس الضغط، ومعايير النجاح / الفشل. تعرف على كيفية ربط نتائج الاختبار بالأرقام التسلسلية للبدن.
      icon: tabler:gauge
    - title: 7. التفتيش النهائي ومراقبة الجودة
      description: قائمة فحص الجودة المكونة من 100 نقطة لكل وحدة، والتحقق من الأبعاد، وفحص مستحضرات التجميل، والتحقق من سلامة العبوة. مراجعة سجلات عدم المطابقة وسجلات الإجراءات التصحيحية.
      icon: tabler:clipboard-check
    - title: 8. غرفة مراجعة الوثائق
      description: وثائق الامتثال لكل نموذج (DoC، لوحة البناء، دليل المالك)، وسجلات تتبع الإنتاج، وسجل HIN، وعرض قاعدة بيانات تتبع دفعة المواد.
      icon: tabler:folder
content_qc_chain:
  tagline: أدلة الجودة
  title: سلسلة مراقبة الجودة ذات 8 مراحل<br />— يمكن التحقق منها في كل خطوة
  subtitle: تمتد سلسلة مراقبة الجودة لدينا من المواد الواردة إلى الشحن النهائي، مع أدلة موثقة في كل مرحلة.
  items:
    - title: 'المرحلة 1: فحص المواد الواردة'
      description: يتم اختبار كل دفعة من PVC، وHypalon، والألياف الزجاجية، والألومنيوم، والمواد اللاصقة، والأجهزة وفقًا للمواصفات قبل دخولها مرحلة الإنتاج. قوة الشد، والتصاق الطلاء، وفحوصات الأبعاد وفقًا لمعيار AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'المرحلة 2: لحام الأنبوب / لصق مراقبة الجودة'
      description: اختبار قوة تقشير التماس لكل دفعة إنتاج. مراقبة وتسجيل معلمات اللحام RF. تم فحص الدرزات الملصقة يدويًا للتأكد من التغطية اللاصقة المتسقة ووقت المعالجة.
      icon: tabler:flame
    - title: 'المرحلة 3: تصفيح الهيكل ومراقبة الجودة'
      description: قياس سُمك الطبقة الجيلاتيكية، والتحقق من طبقة الألياف الزجاجية وفقًا لجدول الصفائح، ومراقبة وقت المعالجة. تم التحقق من مواقع التسليح الهيكلية وفقًا للرسومات الهندسية.
      icon: tabler:layers-subtract
    - title: 'المرحلة 4: التجميع والتكامل ومراقبة الجودة'
      description: سلامة مفصل أنبوب الهيكل، وعزم دوران وحدة التحكم والمقعد، والاستمرارية الكهربائية، واختبار تسرب نظام الوقود. تم التحقق من كل نقطة تثبيت وفقًا لقائمة مراجعة التجميع الخاصة بالطراز.
      icon: tabler:tool
    - title: 'المرحلة 5: اختبار عقد الضغط'
      description: يتم ضغط كل حجرة قابلة للنفخ إلى 1.25x تصنيف PSI ويتم الاحتفاظ بها لمدة 24-48 ساعة. انخفاض الضغط المسجل لكل غرفة. تم توثيق عتبة النجاح/الفشل. مرتبطة بالرقم التسلسلي للبدن.
      icon: tabler:gauge
    - title: 'المرحلة 6: التفتيش النهائي'
      description: قائمة فحص الجودة المكونة من 100 نقطة تغطي دقة الأبعاد والتشطيب التجميلي واكتمال الملحقات وحزمة الوثائق وسلامة التغليف. مستقلة عن فريق الإنتاج.
      icon: tabler:clipboard-check
    - title: 'المرحلة السابعة: توثيق الامتثال'
      description: DoC الخاص بالنموذج، والتحقق من لوحة البناء، واكتمال دليل المالك، وإدخال تسجيل HIN. تم إعداد جميع وثائق الامتثال والتحقق منها قبل إطلاق الشحنة.
      icon: tabler:file-certificate
    - title: 'المرحلة 8: إطلاق الشحنة وإمكانية تتبعها'
      description: يتطلب الإصدار النهائي اجتياز جميع مراحل مراقبة الجودة، وإكمال وثائق الامتثال، والتحقق من وثائق الشحن. تم إغلاق سجل هال وحفظه في الأرشيف لمدة تزيد عن 10 سنوات.
      icon: tabler:truck
content_traceability:
  tagline: إمكانية تتبع الإنتاج
  title: HIN → الملف الرئيسي →<br />سجل الهيكل → التسليم
  subtitle: يحمل كل قارب RIB رقم تعريف فريدًا للهيكل مرتبطًا بسلسلة سجلات الإنتاج والامتثال الكاملة.
  items:
    - title: رقم تعريف الهيكل (HIN)
      description: معرف فريد مكون من 14 حرفًا يتم وضع علامة دائمة عليه على كل قارب. يشفر رمز الشركة المصنعة (MIC)، وتعيين النموذج، وسنة الإنتاج، والرقم التسلسلي. المفتاح الذي يفتح سلسلة التتبع الكاملة.
      icon: tabler:hash
    - title: الملف الفني الرئيسي
      description: وثائق الامتثال والهندسة للعائلة النموذجية. يحتوي على رسومات GA وتقييم المخاطر وحسابات الاستقرار ومواصفات المواد والمعايير المعمول بها. ترتبط بجميع هياكل هذا النموذج.
      icon: tabler:folder
    - title: سجل هال الفردي
      description: 'سجل الإنتاج لكل هيكل: HIN، تاريخ الإنتاج، دفعة الأنبوب، شهادات المواد، نتيجة اختبار الضغط، التكوين النهائي، مواصفات المحرك، نتائج قائمة التحقق من الجودة، ووجهة التسليم. أكثر من 21 حقل بيانات لكل هيكل.'
      icon: tabler:file-description
    - title: حزمة امتثال العملاء
      description: حزمة التسليم لكل هيكل بما في ذلك DoC، وصورة لوحة البناء، ودليل المالك، وقائمة التحقق من الامتثال، وورقة التكوين النهائية. يتم شحنه مع القارب وحفظه في المصنع لمدة تزيد عن 10 سنوات.
      icon: tabler:package
content_red_flags:
  tagline: مطبات التدقيق
  title: مشتري الأعلام الحمراء<br />يمكن العثور عليهم بسهولة
  subtitle: المشكلات الشائعة التي تقوض ثقة المشتري أثناء عمليات تدقيق المصنع. نحن نتعامل مع كل واحد بشكل استباقي.
  items:
    - title: مطالبات CE الشاملة بدون نطاق النموذج
      description: '"جميع المنتجات حاصلة على شهادة CE" دون تحديد التوجيه والنماذج ووحدة المطابقة. العلم الأحمر: يشير إلى أن الامتثال سطحي وليس لكل نموذج أو لكل تكوين.'
      icon: tabler:alert-triangle
    - title: لا توجد أدلة الاختبار البدني
      description: 'مطالبات اختبار الضغط دون وجود سجلات اختبار أو أجهزة قياس أو محطة اختبار مرئية على أرضية المصنع. العلم الأحمر: لا يمكن التحقق من مطالبات الجودة أثناء الزيارة.'
      icon: tabler:alert-triangle
    - title: إمكانية تتبع المواد المفقودة
      description: 'لا توجد سجلات دفعة، ولا تفتيش وارد، أو لا يوجد رابط بين شهادات المواد والمنتجات النهائية. العلم الأحمر: لا توجد طريقة لتتبع مشكلات الجودة إلى المصدر.'
      icon: tabler:alert-triangle
    - title: التوثيق العام
      description: 'DoC واحد يغطي جميع النماذج، ولا توجد سجلات خاصة بـ HIN، أو مستندات الامتثال "القالبة". العلم الأحمر: لا يرتبط الامتثال بوحدات الإنتاج الفردية.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: الشحن والتغليف
  title: تحميل وتغليف قوارب RIB<br />في الحاويات
  subtitle: حلول الشحن لدينا تحمي استثمارك من تشينغداو إلى ميناء الوصول. خطط تحميل الحاويات ومواصفات التغليف متاحة لكل طراز.
  items:
    - title: تكوينات حاوية 20 قدمًا
      description: 'حاوية 20 قدمًا القياسية: 1-2 قوارب RIB (4.0-5.5 م) متداخلة مع فصل السطح والأنابيب، أو 8-12 لوح SUP. تكوينات مختلطة RIB + SUP متاحة. يتم توفير خطة تحميل مفصلة مع كل طلب.'
      icon: tabler:box
    - title: تكوينات حاوية 40 قدمًا
      description: 'حاوية 40 قدمًا القياسية: 2-4 قوارب RIB (حتى 7.0 م) مع هياكل متداخلة وأنابيب مكدسة، أو 20-30 لوح SUP. حاوية 40 قدمًا HQ متاحة لطرازات RIB الأعلى. التعبئة المحسّنة بالحجم تقلل تكلفة الشحن لكل وحدة.'
      icon: tabler:container
    - title: تغليف خشبي لهياكل RIB
      description: هياكل الألمنيوم وGRP معبة في صناديق خشبية مخصصة مع حشوة إسفنجية وحاجز ضد الرطوبة وأحزمة فولاذية. أبعاد الصناديق ووزنها لكل طراز متاحة للتخطيط اللوجستي. شهادة الخشب المعالج حراريًا ISPM-15 مشمولة.
      icon: tabler:wood
    - title: تغليف مع فصل الأنابيب والسطح
      description: أنابيب مفرغة من الهواء ومطوية بشكل منفصل عن الهياكل لكفاءة المساحة. ألواح السطح والكونسولات والمقاعد معبة في غلاف واقٍ مع مجموعات تجهيزات التجميع. تعليمات إعادة التجميع مشمولة مع كل شحنة.
      icon: tabler:package
    - title: الحماية من الرطوبة والتآكل
      description: ورق مضاد للتآكل VCI لمكونات الألمنيوم، وأكياس هلام السيليكا المجفف، وأكياس التجهيزات المفرغة من الهواء. يمنع أضرار التكاثف خلال عبور البحر من 30 إلى 45 يومًا.
      icon: tabler:droplet-off
    - title: توثيق FOB تشينغداو
      description: بوليصة الشحن والفاتورة التجارية وقائمة التعبئة وشهادة المنشأ وتوثيق المطابقة لكل شحنة. تجميع FCL وLCL متاح. دعم توثيق الجمارك لأسواق الاتحاد الأوروبي والولايات المتحدة والشرق الأوسط.
      icon: tabler:file-text
faq:
  title: تدقيق المصنع — الأسئلة المتداولة
  questions:
    - q: هل يمكنني زيارة المصنع شخصيا؟
      a: نعم. نحن نرحب بعمليات تدقيق المصنع في الموقع في منشأتنا في مدينة تشينغداو التي تبلغ مساحتها 12000 متر مربع. تغطي جولتنا القياسية 8 محطات من مستودع المواد الخام إلى غرفة مراجعة الوثائق. تتوفر أيضًا جولات افتراضية في المصنع عبر مكالمة فيديو للتأهيل الأولي.
    - q: هل تقبل عمليات تدقيق الطرف الثالث (BSCI، SMETA، SGS)؟
      a: نعم. نحن نحافظ على شهادة BSCI (Intertek) ونرحب ببروتوكولات التدقيق الخاصة بالعميل. يمكننا أيضًا ترتيب عمليات فحص SGS أو TÜV عند الطلب. تقارير التدقيق متاحة بموجب اتفاقية عدم الإفشاء.
    - q: هل يمكنني رؤية اختبار الضغط أثناء الزيارة؟
      a: تعد محطة اختبار الضغط الخاصة بنا جزءًا من مسار الجولة القياسي. اعتمادًا على جدول الإنتاج، يمكنك ملاحظة اختبارات الضغط النشطة من خلال قراءات المقياس وسجلات الاختبار. سجلات اختبار الضغط لكل هيكل متاحة دائمًا للمراجعة.
    - q: كيف تتعامل مع المنتجات غير المطابقة؟
      a: يتم فصل الوحدات غير المطابقة وتوثيقها ومراجعتها وفقًا لعملية الإجراءات التصحيحية الخاصة بمعيار ISO 9001. يتم إجراء تحليل السبب الجذري، وتنفيذ الإجراءات التصحيحية، والاحتفاظ بالسجلات. يمكن للمشترين مراجعة سجل NCR الخاص بنا أثناء عمليات التدقيق.
    - q: ما هي وثائق الامتثال المتاحة للمراجعة؟
      a: 'أثناء التدقيق، يمكنك مراجعة: عينات DoC الخاصة بالنموذج، ومواصفات لوحة البناء، وسجل HIN، ومسودات دليل المالك، وقوائم المعايير المعمول بها، وسجلات تقييم المطابقة لكل عائلة نموذجية.'
    - q: كيف يمكنني حجز جولة افتراضية في المصنع؟
      a: اتصل بفريق المبيعات لدينا لتحديد موعد جولة فيديو مباشرة عبر WhatsApp أو Zoom أو Teams. نحن نتبع نفس الطريق المكون من 8 محطات ويمكننا التركيز على مناطق محددة بناءً على اهتماماتك. الجولة الافتراضية النموذجية هي 45-60 دقيقة.
    - q: هل المصنع هو المصنع الفعلي أم شركة تجارية؟
      a: Aquafarer هي الشركة المصنعة الفعلية. نقوم بتشغيل المصنع في Laixi، Qingdao. يمكن التحقق من رخصة العمل ونطاق التصنيع والإنتاج المادي أثناء عملية التدقيق.
    - q: ما هي سجلات الجودة التي يمكنني مراجعتها؟
      a: سجلات فحص المواد الواردة، ونقاط تفتيش مراقبة الجودة أثناء العملية، وسجلات اختبار الضغط، وقوائم فحص الفحص النهائية المكونة من 100 نقطة، وتقارير عدم المطابقة، وسجلات الإجراءات التصحيحية، وسجلات التتبع لكل هيكل. تمت صيانتها جميعًا وفقًا لمتطلبات ISO 9001.
