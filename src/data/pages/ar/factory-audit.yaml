hero:
  tagline: تدقيق المصنع والأدلة
  title: إعداد تدقيق المصنع وأدلة الجودة
  subtitle: كل ما يتحقق منه المشترون في مجال B2B أثناء زيارة المصنع - بدءًا من أصالة التصنيع ووثائق الامتثال وحتى إمكانية تتبع الإنتاج وأنظمة مراقبة الجودة. جاهز للتدقيق، كل يوم.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: إعداد تدقيق مصنع Aquafarer وأدلة الجودة
direct_answer: تحتفظ Aquafarer بمنشأة Qingdao جاهزة للتدقيق تبلغ مساحتها 12,000 متر مربع مع عمليات مراقبة الجودة الموثقة، وإمكانية تتبع المواد، وسجلات الإنتاج على مستوى HIN، ووثائق الامتثال لكل هيكل. تتوفر جولات المصنع في الموقع وجولات افتراضية للمشترين المؤهلين.
stats:
  - value: 12000 متر مربع
    label: منشأة ISO 9001
    detail: حرم التصنيع في تشينغداو
  - value: 6
