content_audit_evidence:
  tagline: أدلة التحقق
  title: أدلة التدقيق<br />يمكنك التحقق منها في الموقع
  subtitle: أثناء زيارات المصنع، يمكن للعملاء التحقق من الأدلة المحددة في كل منطقة إنتاج. إليك ما يجب البحث عنه — وما نقوم بإعداده لكل عملية تدقيق.
  areas:
    - area: مستودع المواد الخام
      what_to_verify: هل المواد مستقرة؟ هل يوجد خلط دفعة؟
      evidence: سجلات التفتيش الواردة، ملصقات الدفعات، تخزين FIFO، قائمة موافقة الموردين، شهادات المواد (PVC، Hypalon، الألياف الزجاجية، الألومنيوم، المواد اللاصقة، الأجهزة)
      icon: tabler:building-warehouse
    - area: إنتاج الأنابيب
      what_to_verify: كيف يتم ضمان قوة التماس وضيق الهواء؟
      evidence: بطاقات العملية، وتأكيد المادة الأولى، وسجلات اختبار الضغط لكل غرفة، وسجلات الإصلاح وإعادة الاختبار، وسجلات تركيب الصمام
      icon: tabler:flame
    - area: إنتاج الهياكل
      what_to_verify: كيف يتم التحكم في الاتساق الهيكلي؟
      evidence: وثائق العمليات الخاضعة للرقابة، ونقاط تفتيش الجودة، وترقيم المنتجات شبه النهائية، وقياسات سمك طبقة الجيلاتين، والتحقق من جدول التصفيح
      icon: tabler:layers-subtract
    - area: منطقة التجميع
      what_to_verify: كيف يتم منع الأجزاء الاختيارية من سوء التجميع؟
      evidence: قائمة مكونات الصنف وأوامر العمل وقوائم مراجعة التكوين وبطاقات فحص محطة العمل وعزم الدوران والفحوصات الوظيفية لكل طراز
      icon: tabler:tool
    - area: محطة الاختبار
      what_to_verify: كيف تتأكد من أن القارب جيد قبل التسليم؟
      evidence: إجراءات الاختبار، وقائمة الأدوات، وسجلات المعايرة، وسجلات اختبار الضغط (1.25x / 24-48 ساعة)، وقوائم فحص الاختبار الوظيفي، ومعايير النجاح/الفشل الموثقة
      icon: tabler:gauge
    - area: منطقة عدم المطابقة
      what_to_verify: كيف يتم معالجة العيوب؟
      evidence: ملصقات العزل، وسجلات NCR، وتحليل السبب الجذري، وسجلات الموافقة على إعادة العمل، وتتبع CAPA (الإجراءات التصحيحية والوقائية)
      icon: tabler:alert-triangle
    - area: مستودع البضائع تامة الصنع
      what_to_verify: كيف يمكنك منع سوء الشحن والأضرار؟
      evidence: ملصقات المنتج النهائي، وسجلات مطابقة الطلب، ومعايير التعبئة والتغليف، وسجلات التفتيش قبل الشحن
      icon: tabler:box
    - area: قطع الغيار وخدمات ما بعد البيع
      what_to_verify: هل يمكنك دعم ما بعد البيع على المدى الطويل؟
      evidence: قائمة قطع الغيار الشائعة، واستراتيجية المخزون، ونظام ترقيم الأجزاء، ووثائق عملية الضمان، ودروس الصيانة
      icon: tabler:headset
content_closing_script:
  tagline: التدقيق حسب الطلب
  title: من زيارة المصنع<br />إلى المشروع المؤكد
  subtitle: لا ينبغي أن ينتهي التدقيق الناجح بالصور والمصافحة. قبل المغادرة، نتأكد من توثيق ثلاث نتائج تجارية.
  items:
    - title: تأكيد التكوين الفني
      description: اتفق على النموذج والتطبيق والخيارات الرئيسية والسوق المستهدف والكمية المقدرة وجدول التسليم - وكل ذلك موثق قبل المغادرة.
      icon: tabler:checklist
    - title: قم بتأكيد مستندات الخطوة التالية
      description: 'حدد ما يوفره Aquafarer بعد ذلك: GA المنقحة، أو قائمة التكوين، أو عرض الأسعار، أو قائمة مراجعة المستندات، أو خطة العينة، أو NDA - مع جداول زمنية محددة.'
      icon: tabler:file-plus
    - title: تأكيد الجدول الزمني المتبادل
      description: التكوين المنقح والاقتباس الأولي في غضون 3 أيام عمل. تأكيد العينة أو المظهر خلال 7 أيام. المراجعة الهندسية أو التفتيش من طرف ثالث خلال 14 يومًا. موعد الاجتماع القادم والجهات المسؤولة مغلقة.
      icon: tabler:calendar

