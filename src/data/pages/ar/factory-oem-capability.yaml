why_us:
  - title: التكامل الرأسي
    description: نمتلك مصنعنا وقوالبنا وسلسلة التوريد الخاصة بنا — بدون وسطاء وبدون مقاولين من الباطن. يمنحنا ذلك التحكم في الجودة والتكلفة والتسليم.
  - title: شهادة مزدوجة
    description: إدارة جودة ISO 9001 وشهادة الامتثال الاجتماعي BSCI. تقارير تدقيق المصنع متاحة عند الطلب.
  - title: مطابقة CE
    description: جميع الطرازات القياسية تحمل شهادة CE 2013/53/EU. يمكن اعتماد الطرازات المخصصة وفق CE من خلال عمليتنا الراسخة.
  - title: MOQ منخفض
    description: ابدأ بـ 5 وحدات فقط للطرازات القياسية. نساعد العلامات التجارية الناشئة على الإطلاق دون تضخيم المخزون.
