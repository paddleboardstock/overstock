hero:
  tagline: تصنيع OEM/ODM
  title: تصنيع OEM والعلامات الخاصة
  subtitle: من الفكرة إلى الحاوية — خصص كل تفصيل في خط قواربك القابلة للنفخ

intro: تقدم Aquafarer خدمات شاملة OEM وODM للعلامات التجارية والموزعين والجهات الحكومية حول العالم. بخبرة تزيد عن 10 سنوات في التصدير ومصنع بمساحة 12,000 م² معتمد وفق ISO 9001 وBSCI، نتولى كل شيء من تصميم المنتج وتطوير القوالب إلى الإنتاج الكامل والتغليف والخدمات اللوجستية.

