services:
  - title: تصميم وهندسة المنتجات
    description: يعمل فريق البحث والتطوير الداخلي لدينا مع مفهومك أو مواصفاتك لتطوير رسومات CAD ونماذج ثلاثية الأبعاد ونماذج أولية. نقدم تصميم القوالب وتحسين أشكال الهياكل والإرشاد في اختيار المواد.
  - title: العلامات التجارية والرسومات المخصصة
    description: طباعة رقمية بالألوان الكاملة وطباعة شبكية ونقش بارز وخيارات ملصقات. نطور رسومات أغطية خاصة بالعلامة التجارية وعلامات الأنابيب وتغليف جاهز للبيع بالتجزئة.
  - title: تخصيص المواد والمواصفات
    description: اختر من بين PVC (قياسي، صديق للبيئة، مقاوم للحريق) وHypalon/CSM وdrop-stitch والهياكل الهجينة. ألوان أنابيب مخصصة وأوزان أقمشة وخيارات تعزيز.
  - title: التغليف والخدمات اللوجستية
    description: تغليف تجزئة مخصص وعلب بعلامة خاصة وتغليف فراغي وتنظيم على منصات نقالة وتحميل حاويات. شروط شحن FOB Qingdao أو CIF أو DDP متاحة.

