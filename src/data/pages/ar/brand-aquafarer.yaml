hero:
  tagline: 'الكيان التجاري'
  title: 'أكوافارير — هندسة الحرية على الماء'
  definition: 'أكوافارير هي علامة تجارية عالمية للمراكب المائية الترفيهية والقوارب القابلة للنفخ، متخصصة في القوارب القابلة للنفخ وألواح SUP والحلول البحرية المخصصة. تجمع أكوافارير بين الهندسة البحرية وخبرات التصنيع وثقافة استكشاف المياه لإنشاء معدات موثوقة للمستخدمين الترفيهيين والمشغلين المحترفين والشركاء العالميين OEM.'

timeline:
  - year: '2012'
    title: 'تأسيس التصنيع البحري'
    body: 'بدأت أكوافارير كورقة عمل متخصصة في القوارب القابلة للنفخ في تشينغداو، الصين، ملتزمة بالحرفية البحرية وتصنيع القوارب القابلة للنفخ. كان التركيز المبكر على بناء منتجات قابلة للنفخ موثوقة من خلال الخبرة الهندسية العملية والانضباط التصنيعي.'
  - year: '2015'
    title: 'أول تصدير وشهادة CE'
    body: 'وصلت طلبات التصدير الأولى إلى اليابان وكوريا. تم تحقيق شهادة CE لخطوط المنتجات الأساسية، مما يمثل دخول أكوافارير إلى الأسواق الدولية. بدأت الشركة في خدمة المستخدمين التجاريين والترفيهيين خارج الصين.'
  - year: '2018'
    title: 'توسعة المصنع'
    body: 'تم الانتقال إلى منشأة إنتاج بمساحة 12,000 متر مربع. تم إضافة خطوط لحام RF وطاقة إنتاجية للخياطة المتساقطة، مما أتاح التصنيع على نطاق أوسع وتحسين أنظمة مراقبة الجودة.'
  - year: '2020'
    title: 'إنشاء مركز البحث والتطوير'
    body: 'تم افتتاح مركز بحث وتطوير مخصص بمختبر أقمشة PVC وخزان اختبار هيدروديناميكي واستوديو محاكاة CAD/FEA. توسع تطوير المنتجات للتركيز على البناء خفيف الوزن وتحسين المتانة والتصميم المتمحور حول المستخدم.'
  - year: '2022'
    title: 'النمو العالمي'
    body: 'تم تحقيق شهادة ISO 9001. توسع الفريق إلى 14 مهندس بحث وتطوير و200+ عامل. وصلت المنتجات إلى عملاء عبر أوروبا والأمريكتين وآسيا والمحيط الهادئ من خلال شراكات الموزعين وOEM.'
  - year: '2024'
    title: 'استوديو الابتكار والتصميم'
    body: 'إطلاق استوديو تصميم وابتكار متكامل لمشاريع ODM المخصصة، من المفهوم إلى الإنتاج. تعزيز التطبيقات البحرية المهنية بما في ذلك القوارب الإنقاذ والتجارية والحكومية.'
  - year: '2026'
    title: 'بناء مستقبل استكشاف المياه'
    body: 'تواصل أكوافارير اليوم تطوير القوارب القابلة للنفخ وأنظمة SUP والحلول البحرية المخصصة — ربط الناس والمنظمات بمياه العالم. أكثر من 50 دولة تم خدمتها، طاقة إنتاجية سنوية تزيد عن 15,000 وحدة.'

philosophy:
  tagline: 'فلسفة العلامة التجارية'
  title: 'هندسة الحرية على الماء'
  body: 'الحرية على الماء ليست فقط حول الحركة. إنها تمثل اكتشاف أماكن جديدة، خلق تجارب في الهواء الطلق، ربط الناس بالطبيعة، وتمكين المهام المهنية. الهندسة تجعل هذه الحرية ممكنة.'
  pillars:
    - title: 'الموثوقية أولاً'
      body: 'البيئات المائية تتطلب الثقة. منتجات أكوافارير مصممة حول الاستقرار والمتانة والسلامة والأداء المتسق.'
    - title: 'التصميم المتمحور حول الإنسان'
      body: 'يجب أن تخدم المنتجات الناس، وليس التكنولوجيا. كل قرار تصميم يبدأ بفهم كيفية استخدام الناس للمراكب المائية، وأين يستكشفون، وما التحديات التي يواجهونها.'
    - title: 'الاستكشاف المتاح'
      body: 'يجب ألا تكون المياه مخصصة للخبراء فقط. تصنع أكوافارير معدات تسمح لمزيد من الناس بتجربة الأنهار والبحيرات والمحيطات والبيئات الساحلية بأمان.'
    - title: 'الابتكار المستمر'
      body: 'الابتكار ليس فقط إنشاء منتجات جديدة. إنه تحسين كل التفاصيل — المواد والهياكل والتصنيع وتجربة المستخدم.'

engineeringDna:
  tagline: 'الحمض النووي الهندسي'
  title: 'كيف تصنع أكوافارير المنتجات'
  areas:
    - title: 'علم المواد'
      body: 'تركز أكوافارير على اختيار المواد المناسبة للبيئات البحرية المختلفة. تشمل الاعتبارات الرئيسية مقاومة التآكل ومقاومة الأشعة فوق البنفسجية وثبات الضغط والمتانة طويلة المدى.'
      items: ['مقاومة التآكل', 'مقاومة الأشعة فوق البنفسجية', 'ثبات الضغط', 'المتانة طويلة المدى']
    - title: 'الهندسة الإنشائية'
      body: 'تتطلب المراكب القابلة للنفخ توازناً دقيقاً بين الصلابة والوزن وقابلية النقل والثبات. تركز هندسة أكوافارير على تحسين هذه العوامل من خلال تقنية الخياطة المتساقطة وبناء اللحامات المتقدم.'
      items: ['الصلابة', 'تحسين الوزن', 'قابلية النقل', 'الثبات']
    - title: 'دقة التصنيع'
      body: 'يمر كل منتج بعمليات مراقبة: تحضير المواد، القطع الدقيق، اللحام والربط، التجميع، فحص الجودة، والتحقق من الأداء.'
      items: ['تحضير المواد', 'القطع الدقيق', 'اللحام والربط', 'التجميع وفحص الجودة']
    - title: 'هندسة سيناريوهات المستخدم'
      body: 'يتم تطوير المنتجات حول التطبيقات الحقيقية — الترفيه والمغامرة والاستخدام المهني — لضمان أن كل تصميم يلبي المتطلبات المحددة لبيئته المقصودة.'
      items: ['ترفيه', 'مغامرة', 'مهني', 'تجاري']

