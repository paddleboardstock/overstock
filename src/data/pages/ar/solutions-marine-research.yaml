content_challenge:
  tagline: التحدي
  title: تتطلب الأبحاث البحرية منصات مستقرة وجاهزة للأدوات
  subtitle: يجب أن توفر قوارب العمل العلمية منصة مستقرة للأجهزة الحساسة، والتشغيل الهادئ لتجنب إزعاج الحياة البرية، وتخطيطات مرنة لمعدات البحث المتنوعة.
  paragraphs:
    - تتطلب الأبحاث البحرية والرصد البيئي قوارب عمل تعمل كمختبرات متنقلة. وخلافًا للسفن التجارية أو الترفيهية، يجب أن تتسع قوارب RIB البحثية لأجهزة إلكترونية حساسة ومعدات لأخذ عينات من المياه والرواسب وأحيانًا لنقل عينات حية — مع الحفاظ في الوقت نفسه على منصة ثابتة لجمع بيانات دقيقة.
    - '**ثبات المنصة أمر بالغ الأهمية** — تتطلب أجهزة السونار وأجهزة قياس العمق ومقاييس CTD (التوصيلية، درجة الحرارة، العمق) بدنًا ثابتًا عند التوقف وعند السرعات المنخفضة. فالموجة الخلفية المفرطة أو حركة البدن تُدخل تشويشًا في البيانات العلمية. ولذلك يعد بدن V العميق ذو خصائص الثبات الجيدة أمرًا ضروريًا.'
    - '**دمج الأجهزة** — تحتاج السفن البحثية إلى نقاط تثبيت لهوائيات GPS ومحولات السونار وأذرع أخذ العينات ومعدات تسجيل البيانات. ويجب أن يتسع فضاء وحدة التحكم لشاشات متعددة وتوزيع الطاقة للأجهزة وتخزين آمن للإلكترونيات الحساسة.'
    - '**التشغيل الهادئ** — في المسوحات الخاصة بعلم الأحياء البحرية والرصد البيئي، يمكن لضوضاء المحرك واهتزاز البدن أن تخيف الكائنات البحرية وتضعف عمليات الرصد السلوكي. ولذلك تُعد تكوينات المحركات الخارجية الهادئة وتصاميم البدن منخفضة الاهتزاز مهمة للتطبيقات البحثية.'
    - صُممت قوارب RIB البحثية من Aquafarer ببدن ثابت ومنظومات متكاملة لتثبيت المعدات وتكوينات محركات خارجية هادئة لتطبيقات البحث العلمي والرصد البيئي.
content_solution:
  tagline: الحل لدينا
  title: أضلاع بحثية مبنية لهذا الغرض<br />للعلم والعمل البيئي
  subtitle: تم تكوين كل RIB لأبحاث Aquafarer كمنصة مستقرة وقابلة للتخصيص للأجهزة العلمية ومعدات أخذ العينات الميدانية.
  list:
    - بدن من الألياف الزجاجية على شكل V عميق بثبات ممتاز عند التوقف وعند سرعات المسح المنخفضة
    - تخطيط سطح مستوٍ مع ألواح لتثبيت المعدات الخاصة بالسونار وGPS وأدوات أخذ العينات
    - وحدة تحكم مهيأة لشاشات متعددة — راسم الخرائط، وجهاز قياس العمق، ومسجل البيانات
    - توزيع طاقة الملحقات بجهد 12 فولت و24 فولت للأجهزة العلمية
    - محرك خارجي رباعي الأشواط هادئ — اهتزاز وضوضاء أدنى لمسوحات الحياة البرية
    - تصميم بدن اختياري بموجة خلفية منخفضة لتقليل الإزعاج أثناء جمع البيانات
    - ألوان أنابيب مخصصة لهوية مؤسسات البحث العلمي وتمييز الأسطول
content_segments:
  tagline: ملفات تعريف الأبحاث
  title: حلول العلوم البحرية<br />حسب نوع التطبيق
  subtitle: تتميز التطبيقات البحثية المختلفة بمتطلبات فريدة من نوعها - بدءًا من منصات التدريس الجامعي وحتى سفن المسح البيئي وحتى أضلاع مراقبة جودة المياه.
  items:
    - title: برامج العلوم البحرية الجامعية
      subtitle: منصات التدريس، الرحلات الميدانية للطلاب، البحوث الساحلية
      description: تحتاج جامعات العلوم البحرية وأقسام علم المحيطات إلى قوارب عمل موثوقة ومتعددة الاستخدامات لتدريس الدورات الميدانية ومشاريع أبحاث الطلاب والمسوحات الساحلية التي يقودها أعضاء هيئة التدريس. يجب أن يكون القارب سهل التشغيل للطلاب تحت الإشراف، ومستقرًا بما يكفي لنشر الأدوات العملية، ومتينًا بدرجة كافية للاستخدام المتكرر من قبل العديد من المستخدمين عبر الفصول الأكاديمية. إن قيود الميزانية في البيئات الأكاديمية تجعل من فعالية التكلفة وانخفاض الصيانة اعتبارات مهمة.
      features:
        - منصة ثابتة لتدريب الطلاب على نشر الأجهزة واسترجاعها
        - سهولة التشغيل — تكوين بمقود يدوي أو وحدة تحكم مفردة للاستخدام الطلابي تحت الإشراف
        - أنابيب Hypalon متينة تتحمل النزول المتكرر على الشاطئ وتداول الطلاب
        - تثبيت المعدات لسونار تعليمي وقرص سكي وأدوات أخذ العينات
        - خيار PVC اقتصادي للبرامج الأكاديمية محدودة الميزانية
    - title: معاهد البحوث البحرية
      subtitle: مسح الأضلاع مع تكامل الأجهزة ونظام تحديد المواقع العالمي (GPS) ومعدات أخذ العينات
      description: تحتاج منظمات البحوث البحرية المخصصة التي تجري مسوحات ساحلية وبحرية إلى أضلاع مسح RIBs مهيأة بشكل احترافي ومزودة بأجهزة متكاملة. تحمل هذه السفن أنظمة السونار لرسم خرائط قياس الأعماق، وملفات تعريف CTD لتحليل عمود الماء، وأخذ عينات من الرواسب، ومعدات جمع بيولوجية. يجب أن يوفر القارب منصة مستقرة بسرعات مسح بطيئة، وأن يتمتع بمساحة واسعة على سطح السفينة لنشر المعدات، ويوفر طاقة نظيفة بجهد 12 فولت/24 فولت للإلكترونيات.
      features:
        - تثبيت متكامل لمحول السونار — تكوين عبر البدن أو على المؤخرة
        - تثبيت هوائي GPS مع الدمج في وحدة التحكم للملاحة بدقة المسوحات
        - منطقة نشر أجهزة CTD وأخذ عينات المياه مع نقاط تثبيت آمنة
        - توزيع طاقة مساعد بجهد 12 فولت/24 فولت للأجهزة ومسجلات البيانات
        - ثبات عند السرعات المنخفضة (3-6 عقد) لدقة خطوط المسح
        - إطار على شكل حرف A أو رافعة صغيرة اختيارية لإنزال معدات أخذ العينات الأثقل
    - title: مراقبة البيئة والحفاظ عليها
      subtitle: المسوحات البيئية ومراقبة الحياة البرية وتقييم الموائل
      description: تقوم المنظمات البيئية غير الحكومية والوكالات الحكومية ومنظمات الحفاظ على البيئة بإجراء مسوحات بيئية بحرية ومراقبة سكان الحياة البرية وتقييمات الموائل. تتطلب هذه العمليات سفنًا هادئة ومنخفضة التأثير يمكنها الاقتراب من الموائل الحساسة دون إزعاج الحياة البرية. تحتاج القوارب إلى حمل معدات الكاميرا، ونظام تحديد المواقع العالمي (GPS) لرسم الخرائط المقطعية، ومعدات أخذ العينات لجمع المياه والرواسب. يعد الاستيقاظ المنخفض والحد الأدنى من ضجيج المحرك أمرًا بالغ الأهمية لدراسات المراقبة السلوكية.
      features:
        - محرك خارجي رباعي الأشواط هادئ — أدنى إزعاج للحياة البرية البحرية
        - منصة رصد ثابتة للتوثيق بالصور والفيديو
        - تثبيت المعدات لحوامل الكاميرات وأجهزة تتبع GPS والحواسيب الميدانية
        - غاطس ضحل للوصول إلى الأراضي الرطبة الساحلية وغابات المانغروف ومصبات الأنهار
        - أسطح سطح القارب والأنابيب سهلة التنظيف لإزالة التلوث بين المواقع
    - title: مراقبة واختبار جودة المياه
      subtitle: عمليات أخذ العينات المنتظمة، وتتبع الملوثات، ومراقبة الامتثال
      description: تقوم منظمات مراقبة جودة المياه بإجراء عمليات أخذ عينات منتظمة عبر المناطق الساحلية والموانئ والممرات المائية الداخلية لتتبع مستويات التلوث وتكاثر الطحالب والامتثال للوائح البيئية. تحتاج هذه العمليات إلى قوارب فعالة وموثوقة للقيام بزيارات متكررة إلى محطات أخذ العينات الثابتة. يجب أن تحمل السفينة معدات أخذ العينات، ومبردات لحفظ العينات، ومعدات الاختبار الميداني - مع سهولة غسل السطح بين مواقع أخذ العينات لمنع التلوث المتبادل.
      features:
        - منطقة مخصصة لمحطة أخذ العينات مع ثلاجة محمولة وتخزين للمعدات
        - سطح قارب وأسطح أنابيب سهلة التنظيف لإزالة التلوث بين المواقع
        - دمج GPS للعودة الدقيقة إلى إحداثيات أخذ العينات الثابتة
        - حجم مضغوط للوصول إلى الممرات المائية المقيدة والقنوات الضيقة
        - محرك خارجي موفر للوقود لجولات أخذ عينات منتظمة اقتصادية
