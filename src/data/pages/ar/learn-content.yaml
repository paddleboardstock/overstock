articles:
  sup:
    - title: SUP الأساسيات — دليل المبتدئين
      desc: كل ما يحتاج المبتدئون لمعرفته — أنواع الألواح، قياس المجداف، الوضعية، ونصائح اليوم الأول.
    - title: دليل الحجم SUP
      desc: اعثر على طول اللوح المناسب، عرضه، وحجمه وفقًا لوزنك، مهارتك، وأسلوب التجديف الخاص بك.
    - title: الألواح القابلة للنفخ مقابل الألواح الصلبة
      desc: أيهما الأنسب لك؟ قابلية الحمل، والأداء، والمتانة، والتكلفة مقارنة بك.
    - title: تقنيات متوسطة
      desc: ارتقِ بمستوى التجديف الخاص بك باستخدام الحركات المتقدمة وتقنيات الدوران والتعامل مع المياه الهائجة.
    - title: كيفية اختيار لوح قابل للنفخ SUP
      desc: تنقل بين العوامل الرئيسية — البناء، السماكة، إعداد الزعانف، والإكسسوارات المرفقة.
    - title: سلامة المياه
      desc: معرفة أساسية بالسلامة تشمل قراءة الطقس، PFD والاختيار، والإنقاذ الذاتي، والتجديف الجماعي.
  inflatable-boat:
    - title: مرجع المواد
      desc: Drop-stitch النواة، PVC الألواح المعدنية، EVA رغوة السطح، وتصنيفات الدينير — افهم مما يتكون لوحك.
    - title: EVA شرح فن سطح اللوح
      desc: كيف يتم قطع كتل متعددة الألوان EVA بالقوالب وتجميعها يدويًا لتصبح فناً على سطح البطاقات مع الحفاظ على ثبات اللون لفترة طويلة.
    - title: Drop-Stitch شرح الجوهر
      desc: كيف تخلق آلاف الخيوط الداخلية منصة صلبة عند 15 PSI للنفخ عالي الأداء SUPs.
    - title: نظرة عامة على تقنية النفخ
      desc: كيفية بناء ألواح المجاديف القابلة للنفخ — من وضع المواد إلى أنظمة الصمامات ولحام الدرز.
    - title: بناء السكك الحديدية والدرزة
      desc: كيف تحافظ أحزمة السكك الحديدية ثلاثية الطبقات والدرزات الملحومة بالترددات الراديوية على إحكام لوحتك عند الضغط الكامل.
    - title: لماذا 15 PSI مهمة
      desc: كيف يفتح ضغط الهواء أداء صلبا على الألواح الصلبة من جهاز نفخ قابل للتعبئة.
  water-safety:
    - title: دليل سلامة المياه
      desc: معرفة أساسية بالسلامة لكل مجدف — الطقس، أنظمة PFD، الإنقاذ الذاتي، وبروتوكولات التجديف الجماعية.
    - title: سترة النجاة PFD والدليل
      desc: كيفية اختيار جهاز الطفو الشخصي المناسب للتزلج على الألواح الواقفة — تقييمات الطفو، الملاءمة، والراحة.
    - title: SUP قائمة التحقق من السلامة
      desc: قائمة التحقق من السلامة قبل الإطلاق يجب على كل متسابق مجداف واقفا اتباعها قبل النزول إلى الماء.
    - title: سلامة التجديف بالماء البارد
      desc: الاحتياطات الأساسية، المعدات، والتقنيات للتجديف في ظروف المياه الباردة.
    - title: أخطاء المبتدئين في التجديف
      desc: الأخطاء الشائعة التي يرتكبها المجدفون لأول مرة وكيفية تجنبها للحصول على تجربة أكثر أمانا ومتعة.
    - title: قواعد المقود PFD والسلامة
      desc: متى يكون المقود ضروريا، أي PFD الأنواع تناسب SUP، ومعدات السلامة التي يجب أن يحملها كل مجدف.
