articles:
  sup:
    - title: أساسيات SUP — دليل للمبتدئين
      desc: 'كل ما يحتاجه المبتدئ: أنواع الألواح، حجم المجداف، الوقفة ونصائح أول يوم على الماء.'
    - title: دليل مقاسات SUP
      desc: اعثر على الطول والعرض والحجم المناسبين للوح وفق وزنك ومستواك وأسلوب تجديفك.
    - title: لوح SUP قابل للنفخ أم لوح صلب
      desc: أيهما يناسبك؟ مقارنة سهولة النقل والأداء والمتانة والتكلفة.
    - title: التقنيات المتوسطة
      desc: طوّر تجديفك بضربات مجداف متقدمة وتقنيات دوران والتعامل مع المياه المضطربة.
    - title: كيف تختار لوح SUP قابل للنفخ
      desc: 'العوامل الرئيسية: البناء، السماكة، توزيع الزعانف والملحقات المضمّنة.'
    - title: السلامة المائية
      desc: 'معرفة أساسية بالسلامة: قراءة الطقس، اختيار سترة النجاة (PFD)، الإنقاذ الذاتي والتجديف الجماعي.'
  inflatable-boat:
    - title: مرجع المواد
      desc: PVC وHypalon والخيوط المتقاطعة وتصنيف denier — اعرف ممّ يتكون قاربك القابل للنفخ.
    - title: مقارنة PVC مقابل Hypalon
      desc: 'المقارنة الشاملة لأقمشة PVC وHypalon للقوارب القابلة للنفخ: المتانة ومقاومة الأشعة فوق البنفسجية والتكلفة.'
    - title: تقنية الخيوط المتقاطعة مشروحة
      desc: كيف تخلق آلاف الخيوط الداخلية منصة صلبة عند ضغط 12-15 PSI لألواح SUP عالية الأداء.
    - title: نظرة عامة على تقنية النفخ
      desc: 'كيف تُبنى القوارب وألواح SUP القابلة للنفخ: من طبقات المواد إلى أنظمة الصمامات ولحام الوصلات.'
    - title: دليل القوارب ذات الهيكل الصلب (RIB)
      desc: كل شيء عن بناء قوارب RIB وأنواع الهياكل ومواد الأنابيب واختيار القارب المناسب لاحتياجاتك.
    - title: قارب قابل للنفخ أم RIB
      desc: الفروقات الرئيسية بين القوارب القابلة للنفخ التقليدية والقوارب ذات الهيكل الصلب حسب الاستخدام.
  water-safety:
    - title: دليل السلامة المائية
      desc: 'معرفة أساسية بالسلامة لكل مجداف: الطقس، سترات النجاة (PFD)، الإنقاذ الذاتي وبروتوكولات التجديف الجماعي.'
    - title: دليل سترات النجاة وأجهزة الطفو
      desc: كيف تختار جهاز الطفو الشخصي المناسب لرياضة SUP والكاياك والإبحار والاستخدام المهني.
    - title: قائمة فحص السلامة لألواح SUP
      desc: قائمة فحص السلامة قبل النزول إلى الماء التي يجب أن يتبعها كل ممارس للوح التجديف.
    - title: السلامة في المياه الباردة
      desc: احتياطات أساسية ومعدات وتقنيات للتجديف في ظروف المياه الباردة.
    - title: أخطاء المبتدئين في التجديف
      desc: الأخطاء الشائعة لدى المجدفين لأول مرة وكيفية تجنبها لتجربة أكثر أمانًا ومتعة.
    - title: شهادة CE مشروحة
      desc: 'ماذا تعني شهادة CE للقوارب القابلة للنفخ: المعايير والاختبارات وأهميتها للسلامة.'
ui:
  read_guide: اقرأ الدليل →
  card_tech: هندسة السلامة البحرية واختبار المواد
  card_products: استكشف كتالوج منتجات Aquafarer الكامل
  card_trust: امتثال CE وISO وBSCI
materials:
  intro_p1: تعتمد أداء القارب القابل للنفخ ومتانته وسلامته بشكل شبه كامل على المواد المستخدمة في تصنيعه. من القماش الذي يشكّل الأنابيب إلى الخيوط التي تمنح لوح SUP صلابته — كل اختيار للمواد يؤثر على سلوك المنتج في الماء وعلى عمره الافتراضي.
  intro_p2: 'يغطي هذا الدليل المواد الأساسية الأربع المستخدمة في القوارب القابلة للنفخ الحديثة: قماش PVC، ومطاط Hypalon CSM، وبناء القلب بالخيوط المتقاطعة، وأسطح الرغوة EVA. فهم هذه المواد سيساعدك على اختيار المنتج المناسب لاحتياجاتك والعناية به لأطول عمر ممكن.'
  labels:
    advantages: المزايا
    limitations: القيود
    best_for: 'الأفضل لـ:'
  items:
    - name: PVC (بولي فينيل كلوريد)
      summary: المعيار الصناعي للقوارب القابلة للنفخ وألواح SUP الترفيهية. القماش المتعدد الطبقات المصفح يوفر نسبة ممتازة من القوة إلى الوزن بسعر في متناول الجميع.
      pros:
        - سعر ميسور — أرخص بنسبة 30-50% من Hypalon
        - خفيف الوزن وسهل التعامل
        - مقاومة جيدة للأشعة فوق البنفسجية مع الطبقات المناسبة
        - مجموعة واسعة من الألوان والتشطيبات
        - سهل الإصلاح برقع PVC ومواد لاصقة بالمذيبات
      cons:
        - عمر افتراضي أقصر من Hypalon (7-10 سنوات)
        - مرونة أقل في درجات الحرارة المنخفضة
        - مقاومة كيميائية أدنى
        - قد يحدث فيه هجرة الملدنات مع مرور الوقت
      best_for: ألواح SUP الترفيهية، القوارب الاقتصادية، أساطيل التأجير، الاستخدام الموسمي، المياه العذبة والبيئات الساحلية.
    - name: Hypalon (مطاط CSM)
      summary: مادة مطاطية اصطناعية فائقة الجودة تشتهر بمتانة استثنائية ومقاومة للأشعة فوق البنفسجية وطول العمر. المعيار الذهبي للقوارب القابلة للنفخ التجارية والعسكرية.
      pros:
        - مقاومة استثنائية للأشعة فوق البنفسجية والأوزون
        - عمر افتراضي 15-20 سنة مع العناية المناسبة
        - مرونة ممتازة في الطقس البارد
        - مقاومة فائقة للمواد الكيميائية والزيوت
        - يحافظ على لونه لفترة أطول من PVC
      cons:
        - أغلى بكثير من PVC
        - وزن القماش أثقل
        - خيارات ألوان أقل
        - تتطلب الإصلاحات مواد لاصقة متخصصة
        - عدد أقل من مصانع الإنتاج حول العالم
      best_for: قوارب RIB التجارية، البحث والإنقاذ، التطبيقات العسكرية، المناخات الاستوائية، الملكية طويلة الأمد للأساطيل.
    - name: القلب بالخيوط المتقاطعة
      summary: التقنية التي أحدثت ثورة في ألواح SUP القابلة للنفخ. آلاف خيوط البوليستر تربط بين طبقتي القماش العلوية والسفلية، مما يسمح بالنفخ عند ضغط عالٍ لأداء يضاهي اللوح الصلب.
      pros:
        - صلابة فائقة عند 12-20 PSI
        - خفيف الوزن — 18-30 lbs للوح بالحجم الكامل
        - يُطوى بشكل مسطح للتخزين والسفر
        - مقاومة ممتازة للصدمات
        - أداء ثابت عبر جميع نطاقات درجات الحرارة
      cons:
        - يتطلب مضخة ضغط عالٍ
        - إصلاح الثقوب أكثر تعقيدًا من الطبقة الواحدة
        - تكلفة تصنيع أعلى من المنتجات القابلة للنفخ القياسية
        - فقدان الضغط بمرور الوقت يتطلب إعادة نفخ دورية
      best_for: ألواح التجديف الوقوف، الكاياك، الأرضيات الهوائية للقوارب القابلة للنفخ، وأي تطبيق يتطلب صلابة مع سهولة نفخ ونقل.
    - name: سطح من رغوة EVA
      summary: رغوة EVA بخلايا مغلقة (إيثيلين-فينيل أسيتات) تُستخدم لبسط الجر على ألواح SUP وأسطح القوارب. توفر امتصاصًا للصدمات وقبضة وعزلًا حراريًا.
      pros:
        - قبضة مانعة للانزلاق ممتازة مبللة أو جافة
        - الامتصاص يقلل التعب في رحلات التجديف الطويلة
        - عزل حراري عن سطح السطح البارد
        - مقاومة للأشعة فوق البنفسجية والمياه المالحة
        - متوفرة بتركيبات متعددة الألوان وتصاميم محفورة بالليزر
      cons:
        - قد تتآكل مع الاستخدام المكثف خلال 2-3 سنوات
        - يجب لصقها بشكل صحيح لمنع التطبق
        - غير إنشائية — لا تؤثر على الصلابة
        - تضيف وزنًا طفيفًا (200-400 غرام للوح)
      best_for: بسط الجر لألواح SUP، تبطين أسطح القوارب، راحة مقاعد الكاياك، وأي سطح يتطلب وقوفًا مانعًا للانزلاق.
  selection:
    title: دليل اختيار المواد
    subtitle: 'اختر المادة المناسبة بناءً على استخدامك الأساسي:'
    headers:
      - الاستخدام
      - المادة الموصى بها
      - لماذا
    rows:
      - - تجديف SUP ترفيهي
        - PVC بالخيوط المتقاطعة
        - خفيف وصلب وبسعر ميسور — التوازن المثالي للمجدافين العارضين
      - - قارب عائلي / قارب بحيري
        - PVC (1100 دنير)
        - اقتصادي، سهل الإصلاح، ومتانة كافية للاستخدام الترفيهي
      - - قارب RIB تجاري / قارب دورية
        - Hypalon CSM
        - أقصى مقاومة للأشعة فوق البنفسجية، عمر افتراضي 15-20 سنة، مقاومة للمواد الكيميائية والزيوت
      - - أسطول ألواح SUP للتأجير
        - PVC بالخيوط المتقاطعة + سطح EVA
        - متين وقابل للإصلاح وقيمة ممتازة للاستخدام المكثف
      - - عمليات البحث والإنقاذ
        - Hypalon CSM
        - موثوقية في الظروف القاسية، مرونة في البرد، مقاومة كيميائية
      - - كاياك سياحي / رحلات استكشافية
        - PVC بالخيوط المتقاطعة
        - أداء صلب مع قابلية الطي للسفر
  deep_dive:
    title: أدلة معمقة
    topics:
      - title: PVC بدرجة بحرية
        desc: قماش PVC مصفح متعدد الطبقات — مقاومة الأشعة فوق البنفسجية، اختبارات التآكل وتصنيفات denier مشروحة.
      - title: مقارنة PVC مقابل Hypalon
        desc: المقارنة الشاملة للمادتين المهيمنتين في القوارب القابلة للنفخ — التكلفة والعمر ومقاومة الأشعة فوق البنفسجية.
      - title: القلب بالخيوط المتقاطعة
        desc: كيف تخلق آلاف الخيوط الداخلية هياكل قابلة للنفخ صلبة عند ضغط عالٍ 12-15 PSI.
      - title: تقنية اللحام عالي التردد
        desc: اللحام عالي التردد يخلق دروزات قوية ومتسقة — كيف يعمل ولماذا هو مهم.
      - title: PSI والأداء
        desc: لماذا يهم ضغط الهواء لألواح SUP والقوارب القابلة للنفخ — الصلابة وسعة التحميل وجودة الإبحار.
      - title: اختبارات الجودة
        desc: اختبارات الضغط، اختبارات الطفو، التقادم بالأشعة فوق البنفسجية والاختبارات التدميرية — عملية ضبط الجودة لدينا.
      - title: أسطح رغوة EVA
        desc: بسط رغوة EVA بخلايا مغلقة — الجر والراحة والمتانة لأسطح SUP والقوارب.
      - title: العناية بالمواد
        desc: التنظيف، الحماية من الأشعة فوق البنفسجية، منع العفن وأفضل ممارسات تخزين المنتجات القابلة للنفخ.
