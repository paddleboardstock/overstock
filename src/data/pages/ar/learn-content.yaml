materials:
  intro_p1: تعتمد أداء ومتانت وسلامة لوح المجداف القابل للنفخ بشكل شبه كامل على المواد المستخدمة في بنائها. من الطبقة اللامانيتية التي تشكل الهيكل إلى الخيوط التي تمنح SUP اللوح صلابته، يؤثر كل اختيار للمادة على أداء المنتج على الماء ومدة استمراره.
  intro_p2: 'يغطي هذا الدليل المواد الأساسية الثلاث المستخدمة في ألواح المجاديف القابلة للنفخ الحديثة: PVC الألواح الصغيرة، drop-stitch والنواة، EVA والألواح الرغوية. فهم هذه المواد سيساعدك في اختيار اللوح المناسب لاحتياجاتك وصيانته لأقصى عمر عمري.'
  labels:
    advantages: المزايا
    limitations: القيود
    best_for: 'الأفضل ل:'
  items:
    - name: PVC (البولي فينيل كلورايد)
      summary: المعيار الصناعي للنفخ SUPs. القماش متعدد الطبقات المصفح يوفر نسبة قوة إلى وزن ممتازة بسعر مناسب.
      pros:
        - قيمة ممتازة مقابل المال
        - خفيف الوزن وسهل التعامل
        - مقاومة جيدة UV مع الطلاءات المناسبة
        - مجموعة واسعة من الألوان والتشطيبات
        - سهل الإصلاح باستخدام PVC الرقع واللاصق المذيب
      cons:
        - العمر الافتراضي النموذجي من 7 إلى 10 سنوات مع العناية المناسبة
        - أقل مرونة في درجات الحرارة الباردة
        - مقاومة كيميائية أقل
        - يمكن أن تتطور هجرة الملدنات مع مرور الوقت
      best_for: الترفيه SUPs والجولات، التجديف العائلي، الاستخدام الموسمي، البيئات المائية العذبة والساحلية.
    - name: Drop-Stitch النواة
      summary: التقنية التي أحدثت ثورة في الطبقات القابلة للنفخ SUPs. آلاف خيوط البوليستر تربط بين طبقات القماش العلوية والسفلية، مما يسمح بالنفخ بالضغط العالي لتحقيق أداء صلب.
      pros:
        - صارم جدا عند 12-20 PSI
        - خفيفة الوزن — 18-30 رطل للوح كامل الحجم
        - تنطوي لتصبح مسطحة للتخزين والسفر
        - مقاومة ممتازة للصدمات
        - أداء ثابت عبر نطاقات درجات الحرارة
      cons:
        - تتطلب مضخة عالية الضغط
        - إصلاح الثقب أكثر تعقيدًا من الطبقة الواحدة
        - تكلفة تصنيع أعلى من الزوارق القابلة للنفخ القياسية
        - فقدان الضغط مع مرور الوقت يتطلب تعبئة دورية
      best_for: ألواح التجديف الواقفة وأي معدات تحتاج إلى أداء صلب مع قابلية النقل القابل للنفخ.
    - name: EVA سطح رغوي
      summary: رغوة EVA مغطاة بالخلايا المغلقة (إيثيلين-فينيل أسيتات) تُستخدم لوسائد الاحتكاك على ألواح SUP. توفر التخميد، والقبضة، والعزل الحراري — وتحمل تصاميم سلسلة الفن.
      pros:
        - قبضة غير قابلة للانزلاق ممتازة سواء كانت رطبة أو جافة
        - التخميد يقلل من التعب أثناء التجديف الطويل
        - عزل حراري من سطح اللوح البارد
        - UV ومقاوم للمياه المالحة
        - متوفرة بألوان متعددة مصنوعة من قطع متداخلة وتصاميم منقوشة بالليزر
      cons:
        - يمكن أن تتحمل الاستخدام المكثف لمدة 2-3 سنوات
        - يجب أن تكون ملتصقة بشكل صحيح لمنع الانفصال
        - غير بنيوي — لا يؤثر على الصلابة
        - يضيف وزنًا طفيفًا (200-400 غرام لكل لوح)
      best_for: SUP قبضة سطح اللوح، تصاميم سلسلة الفن على اللوح، وأي سطح يحتاج إلى مقاومة للانزلاق.
  selection:
    title: دليل اختيار المواد
    subtitle: 'اختر المادة المناسبة بناءً على حالة الاستخدام الأساسية:'
    headers:
      - حالة الاستخدام
      - المادة الموصى بها
      - السبب
    rows:
      - - تجديف ترفيهي SUP
        - Drop-stitch PVC
        - خفيف الوزن، صلب، ميسور التكلفة — التوازن المثالي للمتجدفين العاديين
      - - تجديف الأسرة والمبتدئين
        - واسع drop-stitch PVC (32"+)
        - مستقر وسهل التسامح — الثقة للمبتدئين في التجديف
      - - صيد الأسماك والتجديف مع الكثير من المعدات
        - واسع drop-stitch PVC مع سطح EVA كامل
        - استقرار إضافي للوقوف والصيد، حجم كبير للمعدات
      - - ألواح أسطول الإيجار SUP
        - Drop-stitch PVC + EVA سطح
        - متين، قابل للإصلاح، قيمة جيدة للاستخدام عالي الدوران
      - - التجوال والتجديف لمسافات طويلة
        - Drop-stitch PVC (~11 قدم)
        - تتبع أفضل وكفاءة انزلاق لمسافات طويلة
      - - تجديف اليوغا واللياقة البدنية
        - واسع drop-stitch PVC مع سطح EVA كامل
        - منصة مستقرة ومريحة للحركات والتمارين
  deep_dive:
    title: أدلة الغوص العميق
    topics:
      - title: من الدرجة البحرية PVC
        desc: قماش PVC متعدد الطبقات — مقاومة UV، اختبار التآكل، وشرح تصنيفات الدنير.
      - title: طبقات اللمعان PVC
        desc: كيف يوازن PVC متعدد الطبقات القوة والوزن ومقاومة UV.
      - title: Drop-Stitch النواة
        desc: كيف تخلق آلاف الخيوط الداخلية هياكل قابلة للنفخ صلبة وعالية الضغط عند 15 PSI.
      - title: تكنولوجيا اللحام بالتردد اللاسلكي
        desc: اللحام عالي التردد يخلق خياطة قوية ومتسقة — كيف يعمل ولماذا هو مهم.
      - title: PSI والأداء
        desc: لماذا يهم ضغط الهواء للألواح القابلة للنفخ SUPs — الصلابة، سعة الوزن، وجودة الركوب.
      - title: اختبار الجودة
        desc: اختبار الضغط، اختبارات الطفو، تقادم UV، واختبارات التحطيم — عملية الجودة لدينا.
      - title: سطوح الفوم EVA
        desc: ألواح مطاطية EVA ذات خلايا مغلقة — الثبات، الراحة، والمتانة لأسطح SUP.
      - title: العناية بالمواد
        desc: التنظيف، حماية UV، منع العفن، وأفضل الممارسات لتخزين المنتجات القابلة للنفخ.
