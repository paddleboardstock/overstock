faq_section:
  title: الأسئلة الشائعة حول الجملة
  items:
    - q: ما هو الحد الأدنى للطلب بالجملة؟
      a: خمس لوحات. نموذجنا لزيادة المخزون مُصمم لتجار التجزئة الصغار — لا تحتاج إلى تعبئة حاوية للحصول على سعر الجملة.
    - q: هل يمكنني خلط نماذج مختلفة في طلب واحد بالجملة؟
      a: نعم. الطلبات المختلطة للنماذج هي واحدة من أكبر مزايا شراء المخزون الزائد — يمكنك دمج أي نماذج متوفرة في شحنة واحدة، ويحدد إجمالي عدد اللوحات مستوى تسعيرك. راجع صفحة الجملة للمنتجات المختلطة لمزيد من التفاصيل.
    - q: هل الألواح جديدة تمامًا؟
      a: نعم. كل لوحة جديدة تمامًا، مخزون فائض غير مستخدم — لم يتم استخدامها من قبل أو إعادة تصنيعها أو إرجاعها من العملاء. كل لوحة يتم اختبارها بالضغط 100٪ قبل الشحن.
    - q: كم أقل سعر الجملة مقارنة بسعر التجزئة؟
      a: يتم اقتباس سعر الوحدة بالجملة لكل طلب بناءً على النماذج والكميات، ويكون أقل بشكل كبير من أسعار التجزئة المذكورة أعلاه. اطلب عرض أسعار لمزيجك المستهدف وسنحدد السعر بالضبط.
    - q: ما طريقة الشحن التي يجب أن أختارها؟
      a: الشحن الجوي السريع مناسب لـ 1–3 ألواح، العينات، وأعادة التخزين العاجلة. الشحن البحري الموحد هو الخيار الاقتصادي لطلبات التجار التي تتراوح بين 5–20 لوحة. نقدم كلا الخيارين مع كل استفسار.
    - q: ما الضمان الذي تحمله الألواح بالجملة؟
      a: نفس الضمان لمدة سنتين SUP الذي نقدمه لكل عميل، في جميع الدول ال50+ التي نشحن إليها.
    - q: هل تشحنون إلى بلدي؟
      a: نحن نشحن حاليًا إلى أكثر من 50 دولة، مع أدلة إقليمية لأمريكا اللاتينية، جنوب شرق آسيا، أفريقيا، الشرق الأوسط، والأسواق الرئيسية بما في ذلك المكسيك، البرازيل، الفلبين، إندونيسيا، تايلاند، جنوب أفريقيا، كينيا، والإمارات. اسأل عند طلب عرض السعر وسنؤكد الخدمة الحالية لعنوانك.
