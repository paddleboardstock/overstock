hero:
  tagline: اللوحات بالجملة SUP
  title: ألواح التجديف القابلة للنفخ بالجملة<br />للأعمال الصغيرة
  subtitle: ألواح جديدة كليا بكميات SUP مناسبة للأعمال الصغيرة. اطلب 5–20 لوحا، وامزج أي نماذج في شحنة واحدة، واختر الشحن الجوي أو البحري السريع إلى 50+ دولة.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: ألواح نفخ بالجملة SUP Paddle Board Overstock جاهزة للشحن
direct_answer: Paddle Board Overstock يزود الألواح القابلة للنفخ الجديدة الفائضة SUP لتجار التجزئة الصغار حول العالم. لا يوجد حد أدنى كبير للطلب — يبدأ الطلب بالجملة من 5 ألواح فقط، ويمكنك خلط أي نماذج متوفرة في الطلب الواحد. تشحن الألواح من قاعدتنا في ويهاي، الصين عبر الشحن الجوي السريع (1–3 لوحات، عينات، أو إعادة تخزين عاجلة) أو الشحن البحري الموحد (طلبات تجار التجزئة من 5 إلى 20 لوحا). كل لوحة تختبر 100٪ من الضغط قبل الإرسال ومغطاة بضمان لمدة سنتين SUP .
tldr_points:
  - 'منخفضة MOQ: تبدأ طلبات الجملة من 5 ألواح — بحجم المتاجر الصغيرة، وليس لتحميل الحاويات'
  - 'طلبات الطرازات المختلطة: اجمع أي SUP نماذج متوفرة في المخزون في شحنة واحدة'
  - 'خياران للشحن: الشحن الجوي السريع ل 1–3 لوحات، الشحن البحري لطلبات من 5 إلى 20 لوحا'
  - 'سهم جديد كليا: اختبار ضغط بنسبة 100٪، معدل نجاح الفحص النهائي 99.3٪، ضمان لمدة سنتين SUP'
why_retailers:
  title: لماذا يختار تجار التجزئة الصغار SUP ألواح التخزين الزائد
  subtitle: لا تحتاج إلى مستودع أو ميزانية حاوية للشراء بأسعار جملة.
  items:
    - title: كميات مناسبة للأعمال الصغيرة
      description: البيع بالجملة التقليدي يتطلب مئات الوحدات لكل طلب. نموذج الفائض لدينا مصمم للمتاجر المستقلة — ابدأ بخمس ألواح وزد طلبك مع نمو المتجر.
    - title: التسعير الحقيقي بالجملة بدون الالتزام بالحجم
      description: لأننا نبيع مخزون فائض — فائض الإنتاج ومخزون متورد بعناية من مصانع شركاء مختارة — تحصل على تسعير وحدات على مستوى الحجم دون مخاطر مستوى الحجم.
    - title: امزج النماذج لتتناسب مع عملائك
      description: تخدم متاجر الشاطئ، ومحلات تجهيز البحيرات، ومتاجر المدينة متجدفين مختلفين. امزج بين النماذج الشاملة، والجولات، ونماذج على طريقة ركوب الأمواج SUP في طلب واحد حتى يتناسب رفوفك مع الطلب المحلي.
    - title: جديد تماما، لم يستخدم أبدا
      description: كل لوح في مخزوننا الزائد جديد تماما وغير مستخدم — ليس ثوان ولا إرجاع. كل لوح يختبر الضغط بنسبة 100٪ قبل مغادرته المستودع.
    - title: الشحن الدولي السريع والمرن
      description: الشحن الجوي السريع يحصل على 1–3 لوحات أو طلبات عينات إلى باب منزلك بسرعة؛ الشحن البحري الموحد يحافظ على تكلفة السفينة منخفضة على طلبات تجار التجزئة من 5 إلى 20 لوحا.
    - title: مدعوم بضمان حقيقي
      description: الجملة لا تعني عدم الدعم. SUP كل لوحة تحمل ضمان السنتين SUP ، وهو نفس التغطية التي نقدمها لكل عميل في 50+ دولة.
pricing_section:
  tagline: تسعير الجملة
  title: تسعير جملة بسيط وشفاف
  subtitle: يتم عرض الأسعار لكل طلب بناء على النماذج والكميات وطريقة الشحن التي تختارها. لا توجد رسوم خفية — العرض الذي تحصل عليه هو السعر الذي تدفعه.
  points:
    - title: مرتبة حسب الكمية
      description: أسعار الوحدات تنخفض مع زيادة حجم الطلب. سعر طلب العشرة لوحات أفضل لكل مجلس مقارنة بطلب من 5 لوحات؛ طلب 20 لوحة أفضل من ذلك.
    - title: النماذج المختلطة تحتسب ضمن مجموع واحد
      description: يتم تحديد مستوى الخصم الخاص بك بناءً على العدد الإجمالي للوحات في الطلب - وليس لكل نموذج. خلط 4 نماذج مختلفة × 3 لوحات لكل منها يُحسب كطلب مكون من 12 لوحة.
    - title: مقتبس مع خيارات الشحن
      description: يتضمن كل عرض أسعار خيارات الشحن الجوي والبحري مع أوقات العبور المقدرة، بحيث يمكنك اختيار التوازن بين السرعة والتكلفة الذي يناسب جدول إعادة التوريد الخاص بك.
    - title: لا يلزم حساب أو عضوية
      description: لا يوجد نادي جملة للانضمام إليه ولا رسوم سنوية. اطلب عرض سعر، أكد الطلب، وسنقوم بالشحن.
