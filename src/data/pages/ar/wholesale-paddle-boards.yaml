who_section:
  tagline: من نزود
  title: مصمم للأعمال المستقلة في الرياضات المائية
  items:
    - title: محلات الشاطئ وركوب الأمواج
      description: تجار التجزئة الصغار على الساحل الذين يحتاجون من 5 إلى 15 لوحًا في الموسم، مختلطة بين الطرازات الشاملة للسياح ولوحات ركوب الأمواج بأسلوب السرف للمحليين.
    - title: البائعون عبر الإنترنت
      description: متاجر التجارة الإلكترونية والبائعون في الأسواق يقومون باختبار فئة SUP دون الالتزام بحاوية كاملة من نموذج واحد.
    - title: أساطيل الإيجار والمدارس
      description: عمليات الإيجار و SUP المدارس التي تكمل أساطيلها — ألواح متينة، نماذج متنوعة لخدمة أحجام مختلفة من العملاء، ودعم الضمان.
    - title: المنتجعات وشركات الجولات السياحية
      description: الفنادق والمنتجعات الجزيرة ووكلاء الجولات يضيفون SUP إلى قائمة نشاطاتهم بأساطيل أولية صغيرة وإعادة تخزين موسمية سهلة.
how_to_order:
  tagline: كيف يعمل
  title: كيفية تقديم طلب بالجملة
  steps:
    - title: تصفح المخزون
      description: راجع الطرز الـ11 المتوفرة أعلاه أو استخدم محدد النموذج المختلط لصياغة مزيج يناسب عملاءك.
    - title: طلب عرض سعر
      description: أرسل لنا النماذج والكميات المقدرة وبلدك وسرعة الشحن المفضلة باستخدام نموذج الاستفسار أدناه. سنرد بأسعار الوحدة وخيارات الشحن.
    - title: تأكيد ودفع
      description: وافق على العرض النهائي — النماذج، الكميات، طريقة الشحن، والإجمالي. يتم تأكيد شروط الدفع عند تقديم العرض.
    - title: نحن نختبر، نغلف، ونشحن
      description: يتم اختبار كل لوحة بنسبة 100%، وتُغلف مع مجموعة الإكسسوارات الكاملة الخاصة بها، وتُرسل من ويهاي. ستتلقى تتبعًا لكامل الرحلة.
