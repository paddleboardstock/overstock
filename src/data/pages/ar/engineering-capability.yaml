content_capability:
  tagline: القدرة الهندسية
  title: ما يقدمه فريقنا الهندسي<br />
  subtitle: تغطي هندسة Aquafarer دورة حياة المنتج الكاملة - بدءًا من أبحاث السوق وتصميم المفاهيم وحتى النماذج الأولية والاختبار والإنتاج الضخم.
  items:
    - title: التصميم الصناعي
      description: يعمل فريق التصميم الصناعي لدينا بناءً على متطلبات العملاء وأبحاث السوق والتحليل التنافسي لتطوير مفاهيم المنتج التي توازن بين الجماليات والوظائف وقابلية التصنيع. نحن ننتج رسومات ثنائية الأبعاد وعروضًا ثلاثية الأبعاد ومستندات المواصفات لمراجعتها من قبل العميل قبل الالتزام بالأدوات.
      features:
        - تطوير المفاهيم ودراسات الجدوى
        - رسومات تصميم ثنائية الأبعاد وعرض ثلاثي الأبعاد
        - اختيار المواد وتحديد مواصفاتها
        - تحليل التصميم للتصنيع (DFM)
        - تقييم بيئة العمل والسلامة
    - title: الهندسة الإنشائية
      description: يتخصص مهندسونا الإنشائيون في هندسة القوارب القابلة للنفخ - تصميم الهيكل، وتكوين غرفة الأنبوب، والهندسة الأساسية للخياطة المتدلية، وتوزيع الأحمال. يتم تحليل كل تصميم من أجل السلامة الهيكلية، وتحسين الوزن، والامتثال للمعايير ذات الصلة (CE، ISO، AS).
      features:
        - تصميم بدن من الألياف الزجاجية على شكل V عميق بزوايا ميل محسوبة
        - تكوين أنابيب متعددة الحجرات من أجل السلامة والطفو
        - تحديد مواصفات النواة بتقنية الدروب ستيتش وتحسين الكثافة
        - تحليل العناصر المحدودة للمكونات الحاملة للأحمال
        - حسابات توزيع الوزن والثبات
    - title: النمذجة ثلاثية الأبعاد وCAD
      description: يتم تطوير جميع تصميمات المنتجات باستخدام برنامج CAD ثلاثي الأبعاد قبل بدء استخدام أدوات النموذج الأولي. يستخدم مهندسونا SolidWorks وRhino 3D لنمذجة المنتج، مما يسمح للعملاء بمراجعة كل التفاصيل - بدءًا من ملف تعريف الأنبوب وحتى تخطيط وحدة التحكم - قبل الالتزام بالإنتاج.
      features:
        - نمذجة كاملة ثلاثية الأبعاد باستخدام SolidWorks و Rhino 3D
        - عروض واقعية تشبه الصور الفوتوغرافية لعرضها على العملاء
        - حزم الرسومات الفنية للإنتاج
        - تصميم القوالب والعدد من النماذج ثلاثية الأبعاد
        - نقل مباشر للبيانات من CAD إلى CNC للقطع الدقيق
    - title: النماذج الأولية والاختبار
      description: قبل الإنتاج الضخم، يمر كل منتج جديد بمرحلة النموذج الأولي. نحن نبني نماذج أولية وظيفية لتقييم العميل، ثم نخضعها لبروتوكول الاختبار الكامل الخاص بنا - اختبار الضغط، واختبار الثبات، واختبار الحمل، وتجارب المياه. تعتبر تكرارات التصميم في مرحلة النموذج الأولي سريعة وفعالة من حيث التكلفة.
      features:
        - عدد أولية سريعة للنماذج (تسليم خلال 15-20 يومًا)
        - نموذج أولي عملي للتقييم في الظروف الواقعية
        - بروتوكول اختبار كامل قبل اعتماد الإنتاج
        - تحسين تكراري للتصميم بناءً على نتائج الاختبارات
        - مرحلة موافقة العميل قبل عدد الإنتاج
    - title: تكامل الملحقات المخصصة
      description: تتطلب العديد من مشاريع OEM تكامل الملحقات التي يقدمها العميل أو ملحقات الطرف الثالث - وحدات التحكم المخصصة، أو المقاعد المتخصصة، أو الأنظمة الإلكترونية، أو حوامل معدات الغوص، أو عناصر العلامة التجارية. يدير فريقنا الهندسي تصميم التكامل والتكيف الهيكلي والتحقق من جودة جميع الملحقات.
      features:
        - تصميم الكونسول وتخطيط لوحة العدادات
        - دمج مقاعد وتنجيد مخصص
        - تصميم الأنظمة الإلكترونية وتمديد الأسلاك
        - أنظمة تثبيت معدات الغوص والإنقاذ
        - مواصفات تطبيق العلامة التجارية والرسومات
content_process:
  tagline: عملية التطوير
  title: من المفهوم<br />إلى الإنتاج
  subtitle: تتبع عملية تطوير منتجاتنا سير عمل منظم مكون من 6 مراحل مصمم لتقليل المخاطر وضغط الجداول الزمنية وضمان جاهزية التصنيع من اليوم الأول.
  stages:
    - stage: '01'
      title: المتطلبات والأبحاث
      duration: 1-2 أسابيع
      description: نحن نعمل مع العميل لتحديد مواصفات المنتج ومتطلبات السوق المستهدفة واحتياجات الامتثال التنظيمي والأهداف التجارية. تنتج هذه المرحلة وثيقة متطلبات المنتج (PRD) التي توجه جميع الأعمال اللاحقة.
      deliverables: PRD، تحليل السوق، المعيار التنافسي، التقدير الأولي للتكلفة
    - stage: '02'
      title: تصميم المفهوم
      duration: 2-3 أسابيع
      description: يقوم فريق التصميم الصناعي بتطوير مفاهيم المنتج بناءً على PRD. يتم تقديم خيارات تصميم متعددة مع عروض ثلاثية الأبعاد وتوصيات المواد والتقييمات الهندسية الأولية. يختار العميل الاتجاه للتطوير التفصيلي.
      deliverables: عروض المفاهيم ثلاثية الأبعاد، مواصفات المواد، الأساس المنطقي للتصميم، قائمة مكونات الصنف الأولية
    - stage: '03'
      title: الهندسة التفصيلية
      duration: 2-4 أسابيع
      description: تم تصميم المفهوم المحدد بالكامل - نمذجة CAD ثلاثية الأبعاد، والتحليل الهيكلي، وتكوين الأنبوب، وتصميم الهيكل، وتكامل الملحقات، ووثائق الإنتاج. يتم تحديد جميع الأبعاد والمواد والعمليات للأدوات.
      deliverables: نموذج CAD ثلاثي الأبعاد كامل، رسومات هندسية، قائمة مكونات الصنف النهائية، مواصفات الأدوات، خطة مراقبة الجودة
    - stage: '04'
      title: النماذج الأولية
      duration: 2-3 أسابيع
      description: يتم إنتاج أدوات النموذج الأولي وبناء العينات الوظيفية. يقوم العميل بمراجعة النموذج الأولي وفقًا لمواصفات PRD. يتم إجراء الاختبار وفقًا للبروتوكول المتفق عليه. يتم إجراء تعديلات التصميم بناءً على التعليقات قبل أدوات الإنتاج.
      deliverables: النموذج الوظيفي، تقرير الاختبار، سجل مراجعة التصميم، وثيقة تسجيل خروج العميل
    - stage: '05'
      title: أدوات الإنتاج
      duration: 2-3 أسابيع
      description: بمجرد الموافقة على النموذج الأولي، يتم تشغيل أدوات الإنتاج - القوالب وأدوات اللحام وبرامج القطع وتركيبات التجميع. تم الانتهاء من وثائق مراقبة الجودة ومعايير التفتيش. تم إجراء التشغيل التجريبي للتحقق من صحة العملية.
      deliverables: أدوات الإنتاج، وثائق العملية، خطة فحص مراقبة الجودة، تقرير التشغيل التجريبي
    - stage: '06'
      title: الإنتاج الضخم ومراقبة الجودة
      duration: مستمر
      description: يبدأ الإنتاج الكامل بمراقبة الجودة أثناء العملية في كل مرحلة. يتم فحص المقالات الأولى والموافقة عليها قبل إصدار الدفعة. مراقبة الجودة المستمرة وتتبع العيوب والتحسين المستمر طوال دورة حياة الإنتاج.
      deliverables: جدول الإنتاج وتقارير مراقبة الجودة وسجلات تتبع الدفعات ووثائق الشحن
content_customization:
  tagline: خيارات التخصيص
  title: ما يمكن تخصيصه
  subtitle: يمكن تخصيص كل جانب من جوانب منتجاتنا تقريبًا لتلبية متطلبات العميل. فيما يلي فئات التخصيص الأكثر شيوعًا.
  columns: 3
  items:
    - title: هال والهيكل
      description: طول الهيكل المخصص، وعرض الشعاع، وزاوية الارتفاع، وقطر الأنبوب، وتكوين الغرفة، ودرجة المواد.
      icon: tabler:sailboat
    - title: الألوان والرسومات
      description: لون الأنبوب (PVC/Hypalon)، ولون طلاء الهيكل، ولون وحدة التحكم، ورسومات سطح السفينة، ووضع الشعار، وتصميم العبوة.
      icon: tabler:palette
    - title: وحدة التحكم وعناصر التحكم
      description: الكونسول الوسطي، الكونسول الجانبي، أو عجلة القيادة. تخطيط لوحة العدادات المخصص، وموضع التبديل، وموضع الدفة.
      icon: tabler:steering-wheel
    - title: المقاعد والمفروشات
      description: مقاعد الفارس، مقاعد البدلاء، المفروشات الفاخرة، خياطة مطابقة الألوان، تكوينات قابلة للطي أو قابلة للإزالة.
      icon: tabler:armchair
    - title: الملحقات والمعدات
      description: سلالم الغوص، ورفوف الخزانات، وأبراج السحب، وقمم T، وقمم بيميني، وأنظمة الصوت، وإلكترونيات الملاحة، ومعدات السلامة.
      icon: tabler:backpack
    - title: التعبئة والتغليف والعلامات التجارية
      description: عبوات مخصصة للبيع بالتجزئة، وصناديق ذات علامات خاصة، وعلب شحن تحمل علامات تجارية، وعلامات تعليق، وأدلة مستخدم بلغة العميل.
      icon: tabler:box
content_industries:
  tagline: تطبيقات الصناعة
  title: الحلول الهندسية<br />حسب الصناعة
  subtitle: قام فريقنا الهندسي بتطوير منتجات لمجموعة واسعة من التطبيقات البحرية - لكل منها متطلبات ومعايير أداء مميزة.
  columns: 3
  items:
    - title: عمليات الغوص
      description: أسطح معززة، وتكامل سلم الغوص، وأنظمة تخزين الخزانات، ومنصات مستقرة لمراكز الغوص التجارية في جميع أنحاء العالم.
      icon: tabler:lifebuoy
    - title: الإنقاذ والطوارئ
      description: تصميمات بدن عالية السرعة، وأسطح ذاتية الكفالة، وأنظمة تركيب المعدات، وتكوينات أمان متعددة الغرف لعمليات البحث والإنقاذ.
      icon: tabler:alert-triangle
    - title: السياحة البحرية
      description: تصميمات لراحة الركاب، وتكامل مظلات الشمس، وأنظمة الصعود إلى الطائرة، وتكوينات موفرة للوقود لعمليات نقل الجزيرة.
      icon: tabler:beach
    - title: زوارق تندر لليخوت
      description: تصميمات مدمجة لتخزين دافيت، وخيارات تشطيب فاخرة، وألوان الأم المطابقة، وخصائص القطر عالية الأداء.
      icon: tabler:sailboat
    - title: صيد الأسماك وتربية الأحياء المائية
      description: تكوينات السطح المسطح، وتكامل Livewell، وتخطيطات حامل القضبان، وأجهزة مقاومة للتآكل للتعرض المستمر للمياه المالحة.
      icon: tabler:fish
    - title: الميناء والصناعية
      description: تعزيز الهيكل للخدمة الشاقة، وتخطيطات زوارق العمل، وتكوينات نقل الأفراد، وتكامل المعدات للعمليات البحرية.
      icon: tabler:ship
