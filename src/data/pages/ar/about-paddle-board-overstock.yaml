team_section:
  tagline: الفريق
  title: الأشخاص وراء اللوحات
  description: قاعدة ويهاي لدينا تأوي فريق بحث وتطوير مكون من 14 شخصًا يغطي المواد، وتصميم الهياكل، وعمليات الإنتاج. حولهم يعمل الفريق الأوسع الذي يدير مراقبة الجودة، والمخزون، واللوجستيات، والدعم الذي تتواصل معه عندما تتصل بنا — نفس الأشخاص، سواء كنت تشتري لوحة واحدة أو عشرين.
