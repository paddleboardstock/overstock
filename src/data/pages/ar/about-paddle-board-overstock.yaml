hero:
  tagline: حول
  title: حول Paddle Board Overstock
  subtitle: منذ عام 2012، بدأنا في وضع ألواح قابلة للنفخ جديدة SUP كليا في أيدي المجدفين وتجار التجزئة الصغار في 50+ دولة — مخزون زائد، أسعار عادلة، وضمان نحترمه فعلا.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock ألواح قابلة للنفخ جديدة كليا SUP
direct_answer: Paddle Board Overstock هي علامة تجارية لمعدات الرياضات المائية تأسست في عام 2012 ومقرها في ويهاي، الصين. نبيع ألواح قابلة للنفخ جديدة SUP كليا من مخزون فائض — مزيج من فائض الإنتاج من قاعدتنا الصناعية ومخزون مختار بعناية من مصانع الشركاء — مباشرة إلى المجدفين في الأطراف وتجار التجزئة الصغار في 50+ دولة. كل لوح يخضع لاختبار الضغط بنسبة 100٪، مدعوم بضمان لمدة سنتين SUP ، ويشحن عبر الشحن السريع أو البحري.
tldr_points:
  - تأسس في 2012، ومقره في ويهاي، الصين — أحد SUP المراكز الصناعية الرئيسية في العالم
  - 'نموذج المخزون الزائد: لوحات جديدة تماما بأسعار أقل من سعر التجزئة، بدون وسطاء'
  - 'المخزون متنوع المصدر: فائض الإنتاج من قاعدتنا بالإضافة إلى مخزون مصنع شركاء تم التحقق منه'
  - 50+ دولة تم خدمتها، معدل نجاح 99.3٪ في الفحص النهائي، ضمان لمدة سنتين SUP
story_section:
  tagline: قصتنا
  title: لماذا نبيع المخزون الزائد
  paragraphs:
    - Paddle Board Overstock بدأت في عام 2012 في ويهاي، الصين — وهي مدينة ساحلية في مقاطعة شاندونغ نمت لتصبح واحدة من أهم مراكز التصنيع القابلة للنفخ في العالم SUP . من هذا القاعدة، قضينا أكثر من عقد في صنع ألواح التجديف القابلة للنفخ وشحنها إلى جميع أنحاء العالم.
    - Along the way we noticed something that shapes everything we do today: كل موسم إنتاج يترك خلفه لوحات جديدة وجيدة تماما — فائض، طلبات ملغاة، ألوان الموسم الماضي. في الوقت نفسه، تم منع تجار التجزئة المستقلين حول العالم من البيع بالجملة لأن الموردين التقليديين طالبوا بطلبات بحجم الحاويات.
    - هذه الفجوة هي عملنا. من خلال بيع مخزون فائض — فائض الإنتاج من قاعدة ويهاي الخاصة بنا، بالإضافة إلى مخزون مختار بعناية من مصانع شريكة — يمكننا تقديم ألواح جديدة بأسعار أقل بكثير من المخزون العادي، بكميات تناسب مجدفا واحدا أو طلبية متجر مكون من خمسة ألواح. لا شيء مستعمل، ولا شيء ثان؛ إنه ببساطة مخزون يستحق عميلا بدلا من مستودع.
model_section:
  tagline: نموذج أعمالنا
  title: كيف يعمل نموذج الفائض
  items:
    - title: جديد تماما، لم يستخدم أبدا
      description: كل لوحة نبيعها جديدة تماما وغير مستخدمة. فائض المخزون يعني فائض ومخزون — وليس إرجاعات، ولا تجديدات، ولا ثواني.
    - title: جرد المصادر المختلطة
      description: تجمع مخزوننا بين فائض الإنتاج من قاعدة تصنيع ويهاي الخاصة بنا مع مخزون مختارة من المصانع الشريكة التي نحتفظ بها بنفس معيار الجودة. المصادر مختلطة؛ أما المعايير فلا تكون.
    - title: تسعير أقل من سعر التجزئة
      description: المخزون الزائد يكلفنا أقل للشراء، لذا يكلفك أقل للشراء. لا سعر مبالغ فيه، ولا خصومات وهمية — فقط أسعار صادقة على المخزون الحقيقي.
    - title: البيع بالجملة الصديق للأعمال الصغيرة
      description: يبدأ الجملة من 5 لوحات، وليس من شحنات الحاويات. يمكن لتجار التجزئة الصغار خلط أي نماذج متوفرة في الطلب الواحد واختيار الشحن السريع أو البحري.
    - title: الشحن المباشر إليك
      description: تشحن الطلبات مباشرة من قاعدة اللوجستيات في ويهاي إلى باب منزلك في 50+ دولة — إكسبريس للعينات والطلبات الصغيرة، والشحن البحري الموحد للبيع بالجملة.
quality_section:
  tagline: الجودة والضمان
  title: الجودة وراء كل لوحة
  subtitle: تسعير المخزون الزائد لا يعني أبدا تخفيف المعايير. كل لوحة — مهما كان مصدرها — تمر بنفس العملية قبل الشحن.
  items:
    - title: تم اختبار الضغط بنسبة 100%
      description: يتم نفخ كل لوح فردي واختباره بالضغط إلى 15 PSI قبل الإرسال. لا يتم شحن أي لوح دون اختباره، بغض النظر عن مصدر مخزونه.
    - title: تم اختبار التحميل الزائد حتى 1.25 ضعف
      description: يتم اختبار الألواح من دفعات إنتاجنا عينياً بأكثر من الضغط المقدر — تُبقى عند 1.25 ضعف ضغط التشغيل لمدة 24–48 ساعة للتحقق من اللحامات والصمامات وبناء drop-stitch.
    - title: معدل اجتياز التفتيش النهائي 99.3%
      description: تمر عملية التفتيش النهائية لدينا 99.3٪ من اللوحات دون عيوب — والجزء الصغير الذي يفشل لا يدخل أبدًا مخزون الفائض لدينا.
    - title: ضمان لمدة سنتين SUP
      description: كل لوحة SUP تحمل ضمانًا لمدة سنتين SUP يغطي عيوب التصنيع. ينطبق نفس الضمان على كل عميل في كل واحدة من أسواقنا البالغ عددها 50+.
