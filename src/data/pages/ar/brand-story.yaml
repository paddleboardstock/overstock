content_founding:
  tagline: البداية
  title: 'وُلدنا على الواجهة المائية'
  subtitle: 'بدأت Paddle Board Overstock في ورشة ساحلية في تشينغداو بقارب واحد ورؤية واحدة: بناء مراكب قابلة للنفخ قادرة على تحمل الظروف البحرية الحقيقية.'
  paragraphs:
    - 'في عام 2012، رأى مؤسسونا فجوة في السوق — معظم القوارب القابلة للنفخ كانت إما بأسعار معقولة لكن غير موثوقة، أو عالية الجودة لكن باهظة الثمن بشكل مانع. آمنوا بأن هناك مكاناً لشركة مصنّعة تقدم الجودة والقيمة معاً.'
    - 'صُنع الهيكل الأول يدوياً، واختُبر في المياه المحلية، وحُسّن بناءً على ملاحظات حقيقية من الصيادين ومشغلي الأعمال الصغيرة. هذه الدورة — نبني، نختبر، نستمع، نحوّن — تظل جوهر فلسفتنا الهندسية حتى اليوم.'
    - 'بحلول عام 2015، انتشرت سمعتنا خارج تشينغداو. بدأ الموزعون الدوليون بطلب عينات. ما بدأ كورشة محلية كان يتحول إلى مورد عالمي.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: ورشة الإنتاج المبكرة في Paddle Board Overstock والتصنيع
content_growth:
  tagline: النمو والابتكار
  title: 'من ورشة إلى منشأة بمساحة 12,000 م²'
  subtitle: 'الاستثمار المستمر في الناس والمعدات والعمليات حوّل Paddle Board Overstock إلى منشأة تصنيع بحري حديثة.'
  paragraphs:
    - 'مع نمو الطلب، نمت منشأتنا أيضاً. توسعنا من ورشة صغيرة إلى مصنع بمساحة 12,000 م² مع خطوط إنتاج مخصصة لقوارب RIB والقوارب القابلة للنفخ وألواح SUP والملحقات.'
    - 'استثمرنا في آلات القطع بالتحكم الرقمي CNC ومعدات اللحام عالية التردد وخطوط إنتاج الدرز المتقاطع وأجهزة اختبار شاملة — مما يتيح لنا التحكم في كل جانب من جوانب جودة الإنتاج.'
    - 'اليوم، يضم فريقنا المكوّن من 200-300 شخص مهندسين بحريين وعلماء مواد ومتخصصي مراقبة جودة وحرفيين مهرة — كثير منهم مع Paddle Board Overstock منذ الأيام الأولى.'
content_mission:
  tagline: مهمتنا
  title: 'هندسة الحرية على الماء'
  subtitle: 'كل منتج من Paddle Board Overstock مصمم لمساعدة الناس على الاستكشاف والعمل والازدهار على الماء — بموثوقية وأمان وسعر معقول.'
  list:
    - 'تصميم مراكب تؤدي أداءً في الظروف البحرية الحقيقية — وليس على الورق فقط'
    - 'بناء شراكات دائمة مع الموزعين والعلامات التجارية عبر خدمة OEM/ODM موثوقة'
    - 'تحسين عمليات التصنيع باستمرار لتقديم قيمة أفضل'
    - 'دعم كل منتج بقطع غيار أصلية وخبرة فنية'
