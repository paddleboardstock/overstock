features3_reasons:
  tagline: لماذا تختار Paddle Board Overstock
  title: سبعة أسباب للشراكة معنا
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. التصنيع الحقيقي، وليس التجارة
      description: نحن نمتلك وندير مصنعًا بمساحة 12,000 متر مربع. عندما تشتري من Paddle Board Overstock، تشتري مباشرة من الأشخاص الذين يصممون ويهندسون ويبنون لوحتك — بدون وسطاء، وبدون زيادة في التجزئة.
      icon: tabler:building-factory
    - title: 2. النهج القائم على الهندسة
      description: تبدأ عملية التصميم لدينا بحالة الاستخدام، وليس بفئة المنتج. نحن نحسن شكل الهيكل، واختيار المواد، والتكوين بناءً على كيفية استخدام اللوح فعليًا.
      icon: tabler:engine
    - title: ٣. جودة مثبتة
      description: يتم اختبار كل لوحة بنسبة 100٪ على ضغط 1.25x من التصنيف PSI قبل شحنها. معدل عيوب يبلغ 99.3٪ — مقاس على كل دفعة، وليس مجرد إدعاء.
      icon: tabler:shield-check
    - title: ٤. تصميم يركز على المجذفين
      description: 'فن اللوح، سلسلة الألوان، حوامل الملحقات، والحزم الكاملة — ألواح مصممة حول التجديف الواقعي: الجولات، اليوغا، الصيد، اللياقة البدنية، ومتعة العائلة.'
      icon: tabler:swimming
    - title: ٥. اللوجستيات العالمية
      description: الشحن المباشر من مصنعنا في ويهاي إلى المتجدفين في 50+ دولة، مع تتبع كامل ومتابعة الجمارك.
      icon: tabler:truck-delivery
    - title: ٦. الدعم مدى الحياة
      description: نحن ندعم اللوحات التي صممناها قبل سنوات. قطع غيار أصلية، نصائح فنية، إرشادات الإصلاح — فريقنا متاح عندما تحتاج إلينا.
      icon: tabler:lifebuoy
    - title: 7. المواصفات الصادقة
      description: تصنيفات التحميل الحقيقية، الأبعاد الحقيقية، الوزن الحقيقي. لا تضخيم تسويقي. ما ننشره هو ما تحصل عليه — تم التحقق منه من خلال اختبارات مستقلة.
      icon: tabler:ruler-measure
testimonials:
  tagline: موثوق به من قبل العلامات التجارية حول العالم
  title: ماذا يقول شركاؤنا
  items:
    - content: وصلت لوحتي جديدة من المصنع مع كل شيء في الصندوق. بعد موسمَين من التجديف الأسبوعي وما زال يحتفظ بالهواء بشكل مثالي.
      name: — سارة م., راكبة قارورة نهاية الأسبوع, فلوريدا
    - content: لقد قارنت المواصفات لأسابيع قبل الشراء. Paddle Board Overstock كان العلامة التجارية الوحيدة التي تنشر الأوزان الحقيقية والضغوط الحقيقية. ما يدرجونه هو ما يظهر بالفعل.
      name: — توماش ك., راكب تورينغ, بولندا
    - content: أصبحت العائلة بأكملها الآن تركب القوارب. بدأنا بلوحة واحدة وانتهى بنا الأمر بأربع — الجودة جعلت القرار سهلاً.
      name: — أنجيلا ر., راكبة عائلية, أستراليا
