content_customer_types:
  tagline: من نخدم
  title: 'مصمم لمشتري B2B<br />— وليس للمتسوقين الأفراد'
  subtitle: 'تصنع Paddle Board Overstock لأربعة أنواع من العملاء. لكل نوع أولويات مختلفة — ونحن نلبيها جميعاً.'
  items:
    - title: أصحاب العلامات / العلامات الخاصة
      description: 'تصميم منتجات مخصص، رسومات بالعلامة الخاصة، وثائق مطابقة تحت علامتك التجارية، ودعم هندسي مخصص من الفكرة حتى الحاوية.'
      icon: tabler:palette
      cta: اطلب عرض سعر OEM/ODM
      cta_href: /request-quotation
    - title: الموزعون / تجار الجملة
      description: 'حماية إقليمية، أسعار جملة تنافسية، حزم دعم تسويقي، تدريب على المنتجات، ووثائق مطابقة كاملة لسوقك.'
      icon: tabler:world
      cta: قدّم طلب وكالة
      cta_href: /dealers-distributors
    - title: المنتجعات / مشغلوا التأجير
      description: 'متانة بدرجة تجارية، استشارات لتحديد حجم الأسطول، طلبات حاويات بموديلات مختلطة، استراتيجية قطع الغيار، وحزم معدات بعلامة المنتجع.'
      icon: tabler:beach
      cta: احصل على حزمة تجارية
      cta_href: /solutions/resorts
    - title: الإنقاذ / الجهات الحكومية / المحترفون
      description: 'هيكل Hypalon/CSM، خيارات مطابقة SOLAS، شهادات مخصصة لكل مشروع، دعم وثائق المناقصات، وهندسة محمية باتفاقية عدم إفصاح NDA.'
      icon: tabler:shield
      cta: ناقش مشروعاً
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: قدرات OEM/ODM
  title: 'ما تحصل عليه<br />مع Paddle Board Overstock'
  subtitle: 'وصول مباشر إلى المصنع مع دعم كامل للهندسة والجودة والمطابقة — لسنا شركة تجارية.'
  columns: 2
  items:
    - title: تخصيص OEM/ODM
      description: 'تصميم هيكل مخصص، مواد الأنابيب (PVC أو Hypalon/CSM)، تخطيط الكونسول، المقاعد، العلامة التجارية، الألوان والتغليف. من التعديلات الطفيفة إلى الهندسة المخصصة بالكامل.'
      icon: tabler:adjustments
    - title: حد أدنى منخفض للطلب وعينات سريعة
      description: 'RIB: 2–5 وحدات (قالب موجود). SUP: 5–10 وحدات لكل SKU. قوالب مخصصة: 200+ وحدة. عينات ما قبل الإنتاج بعلامتك التجارية خلال 7–14 يوماً.'
      icon: tabler:rocket
    - title: جودة جاهزة للإنتاج
      description: 'كل وحدة تُختبر بالضغط عند 1.25× من ضغط PSI المقنن لمدة 24–48 ساعة. 99.3% خالية من العيوب وفق AQL 2.5 / ISO 2859. قائمة فحص جودة من 100 نقطة لكل هيكل.'
      icon: tabler:certificate
    - title: وثائق مطابقة كاملة
      description: 'CE وفق 2013/53/EU (RCD)، ISO 9001:2015 (SGS)، تدقيق اجتماعي BSCI، مطابقة REACH، علامة UKCA. بيان مطابقة لكل موديل وبيانات لوحة الصانع مشمولة.'
      icon: tabler:file-certificate
    - title: مدة تنفيذ 30–45 يوماً
      description: 'الإنتاج القياسي 30–45 يوماً FOB تشينغداو. النماذج الأولية خلال 7–14 يوماً. إنتاج عاجل متاح. خطط تحميل الحاويات وتغليف ISPM-15 مشمولة.'
      icon: tabler:truck-delivery
    - title: ما بعد البيع وقطع الغيار
      description: 'ضمان 5 سنوات على القوارب/الكاياك/RIB، وسنتين على SUP/الملحقات. توريد قطع الغيار بشحن ذي أولوية. دعم معالجة مطالبات الضمان.'
      icon: tabler:lifebuoy

content_categories:
  tagline: فئات المنتجات
  title: '5 فئات،<br />64 موديلاً معتمداً بشهادة CE'
  subtitle: 'من قوارب RIB التندر بطول 2.4 م إلى لوحات SUP بطول 15 قدماً — كلها مصنعة في منشأتنا المعتمدة ISO 9001 في تشينغداو.'
  items:
    - title: قوارب RIB
      description: 'من 2.4 إلى 7.0 م بهياكل ألمنيوم أو GRP. أنابيب PVC أو Hypalon/CSM. CE وفق 2013/53/EU. تكوينات الدوريات والغوص والإنقاذ والاستخدام التجاري.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: قوارب قابلة للنفخ
      description: 'من 2.0 إلى 5.0 م بخيارات أرضية ألمنيوم أو خشب رقائقي أو سطح هوائي. موديلات الصيد والترفيه والتندر.'
      icon: tabler:sailboat
      link: /products
    - title: لوحات SUP
      description: 'من 9 إلى 15 قدماً بتقنية Drop-Stitch بسماكة 4 و6 بوصات. موديلات متعددة الاستخدامات والجولات واليوغا والصيد. متوفرة بجودة تجارية.'
      icon: tabler:swimming
      link: /products
    - title: قوارب الكاياك
      description: 'كاياك قابل للنفخ لشخص إلى ثلاثة أشخاص. موديلات ترفيهية وجولات بخيارات أرضية Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: ملحقات السلامة
      description: 'سترات نجاة معتمدة CE، حبال إنقاذ، أطقم إصلاح، مضخات وأضواء ملاحية. سترات نجاة معتمدة USCG النوع III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: قوة المصنع
  title: 'تصنيع جاهز للتدقيق<br />في تشينغداو'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">منشأة ISO 9001 بمساحة 12,000 م² — مصنع حقيقي وليس شركة تجارية</h3>
  items:
    - title: 6 خطوط إنتاج مخصصة
      description: 'خطوط منفصلة لقوارب RIB والقوارب القابلة للنفخ وSUP والكاياك ومعدات السلامة وOEM/ODM. كل خط بنقاط فحص QC مخصصة وتخطيط إنتاج خاص به.'
    - title: اختبار ضغط 100%
      description: 'كل حجرة هوائية تُضخ حتى 1.25× من الضغط المقنن وتُحفظ لمدة 24–48 ساعة. ترتبط نتائج الاختبار برقم الهيكل التسلسلي (HIN).'
    - title: تتبع لكل هيكل
      description: 'سجلات إنتاج على مستوى HIN بأكثر من 21 حقلاً لكل هيكل: دفعة المادة، معرف اللحام، نتيجة اختبار الضغط، التكوين النهائي ووجهة التسليم.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: منشأة Paddle Board Overstock للتصنيع المعتمدة ISO 9001 بمساحة 12,000 م² في تشينغداو مع خطوط إنتاج RIB

content_compliance:
  tagline: المطابقة وإثبات الجودة
  title: 'أدلة موثقة،<br />وليس مجرد ادعاءات'
  subtitle: 'كل ادعاء متعلق بالمطابقة مدعوم بوثائق خاصة بكل موديل متاحة لتحققك.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'نظام إدارة جودة معتمد من TÜV Rheinland/SGS. تدقيقات مراقبة سنوية. عمليات QC موثقة من استلام المواد حتى الإفراج عن الشحنة.'
      icon: tabler:certificate
    - title: CE وفق 2013/53/EU (RCD)
      description: '64 موديلاً مع بيانات مطابقة خاصة بكل موديل. تقييم المطابقة وفق الوحدات المعمول بها. تسجيل HIN وبيانات لوحة الصانع لكل هيكل.'
      icon: tabler:file-certificate
    - title: المطابقة الاجتماعية BSCI
      description: 'تدقيق BSCI سنوي من SGS. ممارسات عمل أخلاقية موثقة وسلامة في مكان العمل وإدارة بيئية في جميع أنحاء منشأتنا.'
      icon: tabler:users
    - title: REACH و UKCA
      description: 'جميع مواد PVC واللواصق تتوافق مع لائحة REACH الأوروبية. علامة UKCA متاحة للسوق البريطانية. بطاقات بيانات سلامة المواد عند الطلب.'
      icon: tabler:shield-check

steps:
  title: عملية OEM/ODM — من المتطلبات إلى الحاوية
  items:
    - title: 'الخطوة 1: <span class="font-medium">المتطلبات</span>'
      description: 'شارك مواصفات منتجك وسوقك المستهدف والكميات ومتطلبات المطابقة. يراجع فريقنا الهندسي خلال 48 ساعة.'
      icon: tabler:file-text
    - title: 'الخطوة 2: <span class="font-medium">العرض</span>'
      description: 'استلم عرضاً مفصلاً بالمواصفات وخيارات المواد وحد الطلب الأدنى والأسعار ومدة التنفيذ ونطاق المطابقة لسوقك.'
      icon: tabler:clipboard-list
    - title: 'الخطوة 3: <span class="font-medium">النموذج الأولي</span>'
      description: 'عينة ما قبل الإنتاج بعلامتك التجارية خلال 7–14 يوماً. اختبارات جودة كاملة عند 1.25× الضغط المقنن. تُخصم تكلفة العينة من قيمة الإنتاج.'
      icon: tabler:settings
    - title: 'الخطوة 4: <span class="font-medium">الإنتاج</span>'
      description: 'إنتاج 30–45 يوماً FOB تشينغداو بعد اعتماد العينة. نقاط فحص QC أثناء العمل واختبارات ضغط وفحص نهائي من 100 نقطة لكل وحدة.'
      icon: tabler:building-factory
    - title: 'الخطوة 5: <span class="font-medium">التسليم</span>'
      description: 'خطة تحميل الحاويات، تغليف خشبي ISPM-15، حزمة وثائق المطابقة، وشحن FOB تشينغداو مع أوراق تصدير كاملة.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: عملية تصنيع القوارب القابلة للنفخ OEM/ODM لدى Paddle Board Overstock — من التصميم إلى الشحن بالحاويات

