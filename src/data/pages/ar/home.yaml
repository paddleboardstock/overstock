content_customer_types:
  tagline: من نخدم
  title: لوحات تناسب كل أنواع رياضات التجديف
  subtitle: سواء كانت جلستك الأولى أو الخمسون، هناك لوح تخفيض مناسب لطريقة تجديفك.
  items:
    - title: المبتدئون
      description: ألواح واسعة ومستقرة تجعل جلستك الأولى سهلة — معظم المبتدئين يقفون خلال دقائق.
      icon: tabler:swimming
      cta: تسوق للمبتدئين SUPs
      cta_href: /supboard
    - title: العائلات
      description: ألواح مستقرة يمكن للعائلة كلها مشاركتها، بالإضافة إلى نماذج أخف للأطفال — معدات يمكن حزمها في السيارة وينتفخ خلال دقائق.
      icon: tabler:beach
      cta: تسوق حزم عائلية
      cta_href: /products
    - title: متنزهو وجامعو اللياقة البدنية
      description: ألواح التجديف الطويلة والأسرع ومنصات اليوغا كاملة السطح للمتنزهين الذين يقطعون مسافات طويلة.
      icon: tabler:route
      cta: تسوق ألواح التجديف واليوغا
      cta_href: /supboard
    - title: صيادو الأسماك
      description: منصات فائقة الاستقرار مع نقاط لتركيب المعدات ومساحة لثلاجة — القذف من سطح هادئ ومستوٍ.
      icon: tabler:lifebuoy
      cta: تسوق معدات الصيد SUPs
      cta_href: /products
features:
  id: features
  tagline: لماذا الشراء من Paddle Board Overstock
  title: مصنع حقيقي، توفير حقيقي
  subtitle: حزم SUP للمخزون الزائد والتخليص مباشرة من المصنع - جودة مثبتة بدون علامات التجزئة.
  columns: 2
  items:
    - title: خصم يصل إلى 60% على التجزئة
      description: نبيع زيادات المخزون ومجموعات التصفية مباشرة — بدون وسطاء، بدون زيادة سعر التجزئة. نفس الألواح التي تُباع بسعر كامل في أماكن أخرى، بأسعار تصفية هنا.
      icon: tabler:rocket
    - title: حزم كاملة
      description: 'كل SUP يأتي كحزمة كاملة: لوح، حقيبة سفر، مضخة يدوية، مجداف قابل للتعديل، زعنفة قابلة للإزالة، حبل لولبي، ومجموعة إصلاح.'
      icon: tabler:clipboard-list
    - title: جودة مثبتة
      description: تمر كل لوحة بنفس مراحل التفتيش مثل مخزون التجزئة بسعر كامل — تُختبر قبل شحنها، ويمكن تتبعها بواسطة رمز الدفعة.
      icon: tabler:shield-check
    - title: لا يوجد حد أدنى للطلب
      description: شراء ما تحتاجه بالضبط. أضف لوحة إلى سلة التسوق، وقم بالدفع، وقد تم ذلك - لا يوجد حد أدنى، ولا توجد عملية عرض أسعار، ولا انتظار.
      icon: tabler:adjustments
    - title: شحن عالمي سريع
      description: طلبات المخزون تشحن من ويهاي خلال 2-3 أيام عمل. توصيل متتبع إلى 50+ دولة في الاتحاد الأوروبي، أمريكا الشمالية، آسيا والمحيط الهادئ، وما بعدها.
      icon: tabler:truck-delivery
    - title: ضمان لمدة سنتين SUP
      description: كل لوح وإكسسوار SUP مغطى لمدة سنتين — يشمل drop-stitch اللحامات، صمامات النفخ، والإكسسوارات. يتم حل المطالبات خلال أيام، وليس أسابيع.
      icon: tabler:lifebuoy
content_categories:
  tagline: فئات المنتجات
  title: خط إنتاج واحد،<br />تم تنفيذه بشكل صحيح
  subtitle: ألواح SUP القابلة للنفخ وملحقاتها - كلها مصنوعة في مصنع Weihai الخاص بنا.
  items:
    - title: لوحات SUP
      description: قابلة للنفخ بشكل عام SUPs من 9 إلى 12 قدم. مستقرة، متينة، ومزودة بمضخة، مجداف، رباط، وحقيبة ظهر.
      icon: tabler:swimming
      link: /supboard
    - title: الجولات SUPs
      description: لوحات أطول وأسرع مع مخططات سياحية للبحيرات والأنهار والاستكشاف الساحلي.
      icon: tabler:route
      link: /supboard
    - title: اليوغا واللياقة البدنية SUPs
      description: منصات عريضة جدا ومستقرة للغاية مع وسادات سطح كاملة الطول لليوغا والتمارين على الماء.
      icon: tabler:users
      link: /supboard
    - title: الأطفال SUPs
      description: ألواح أخف وزنا وأقصر بحجم الأطفال — نفس drop-stitch الجودة في حزمة مناسبة للأطفال.
      icon: tabler:lifebuoy
      link: /products
    - title: الإكسسوارات
      description: مضخات، ومجاديف، وسترات نجاة، وأرباط، ومجموعات إصلاح، وقطع غيار لكل لوح نبيعه.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: قوة المصنع
  title: لماذا أسعار التصفية لدينا<br />حقيقية
  content: <h3 class="text-2xl Font-bold Tracking-tight dark:text-white sm:text-3xl mb-2">مصنع حقيقي، توفير حقيقي - يتم شحن كل لوحة من منشأة Weihai الخاصة بنا</h3>
  items:
    - title: نفس خطوط الإنتاج التي تميز بها العلامات التجارية الكبرى
      description: مصنعنا الذي تبلغ مساحته 12,000 متر مربع يصنع ألواح لعلامات تجارية دولية ودفعاتنا الخاصة بفائض المخزون على نفس الخطوط وبنفس المواد.
    - title: جديد تماما، لم يستخدم أبدا
      description: لوحات فائض المخزون هي فائض غير مستخدم من أوامر الإنتاج المكتملة — مخزون جديد من المصنع، كامل مع جميع ملحقات العبوة والضمان.
    - title: لا وسطاء
      description: ترسل الألواح مباشرة من مصنع ويهاي إلى بابك — بدون موزعين، بدون زيادة سعر التجزئة.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock مصنع ويهاي بمساحة 12,000 متر مربع مع خطوط إنتاج قابلة للنفخ SUP
content_compliance:
  tagline: الجودة والاختبار
  title: تم اختبار الجودة،<br />موثقة
  subtitle: يتم دعم كل مطالبة بالجودة بأرقام حقيقية من خط الإنتاج لدينا - اختبارات الضغط، وسجلات الدفعات، ومعدلات العيوب المقاسة.
  items:
    - title: تم اختبار الضغط بنسبة 100%
      description: يتم نفخ كل لوحة إلى 1.25x PSI ويتم الاحتفاظ بها قبل شحنها. في حالة فشل التماس أو الصمام أو خيط الغرزة المنسدل، فإن اللوحة لا تغادر المصنع أبدًا.
      icon: tabler:shield-check
    - title: معدل خالٍ من العيوب بنسبة 99.3%
      description: استنادًا إلى فحص الشحنات الصادرة خلال فترة الاثني عشر شهرًا الماضية — وفقًا لسجلات التفتيش الخاصة بنا، وليس التسويق.
      icon: tabler:gauge
    - title: قابلية تتبع الدفعات
      description: تحمل كل لوحة رمز دفعة إنتاج، لذا فإن مطالبات الضمان وفحوصات الجودة تعود إلى المواد المحددة وعمليات التشغيل.
      icon: tabler:clipboard-check
    - title: ضمان لمدة سنتين SUP
      description: كل SUP لوحة وملحقات تم تغطيتها لمدة سنتين — drop-stitch مع الدرز، وصمامات النفخ، والإكسسوارات. تم حل المطالبات بسرعة.
      icon: tabler:lifebuoy
steps:
  title: من الدفع إلى الماء — كيف يتم شحن طلبك
  items:
    - title: 'الخطوة 1: <span class="font-medium">اختر اللوحة التي تناسبك</span>'
      description: اختر من بين عارضات الجولات واليوغا والأطفال. مرشداتنا للشراء تساعدك على مطابقة حجم وأسلوب اللوح مع رحلتك.
      icon: tabler:clipboard-list
    - title: 'الخطوة 2: <span class="font-medium">الدفع الآمن</span>'
      description: ادفع بأمان باستخدام Stripe أو PayPal. جميع بطاقات الائتمان والخصم الرئيسية مقبولة. لا حاجة لحساب — تأكيد الطلب يصل إلى بريدك الإلكتروني.
      icon: tabler:file-text
    - title: 'الخطوة 3: <span class="font-medium">فحص الجودة</span>'
      description: كل لوحة تختبر 100٪ بضغط بنسبة 1.25x PSI وتتم فحصها مقابل قائمة جودة كاملة قبل تعبئتها.
      icon: tabler:settings
    - title: 'الخطوة 4: <span class="font-medium">الإرسال السريع</span>'
      description: الطلبات المتوفرة في المخزون تشحن من مصنع ويهاي خلال يومين إلى ثلاثة أيام عمل. يتوفر التعامل السريع للطلبات العاجلة.
      icon: tabler:building-factory
    - title: 'الخطوة 5: <span class="font-medium">تتبع التسليم</span>'
      description: تم تتبع الشحن العالمي إلى 50+ دولة. يبدأ ضمان السنتين والدعم السريع بعد البيع من يوم وصول لوحتك.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP عملية الطلب من الدفعة الآمنة إلى التوصيل العالمي المتتبع
blog_latest:
  title: SUP الأدلة والرؤى التقنية
  information: |-
    أدلة الشراء، وتقنية التجديف، وأساسيات السلامة، والبناء
    بحث من فريق Paddle Board Overstock.
faqs:
  title: SUP الأسئلة الشائعة حول الطلب والمنتجات
  subtitle: أسئلة شائعة حول لوحات التخفيض SUP ، والطلب، والدفع، والشحن، والضمان.
  columns: 2
  items:
    - title: هل SUP من الصعب التعلم؟
      description: على الإطلاق. معظم المبتدئين يقفون ويتجدفون في جلستهم الأولى. SUP تتميز لوحاتنا الشاملة بمنصات مستقرة عريضة جدا مصممة خصيصا للمجدفين لأول مرة. ابدأ بالماء الهادئ وستجدف في غضون دقائق.
      icon: tabler:swimming
      category: رشفة
    - title: ما هو الحد الأقصى للوزن؟
      description: SUPs دعمنا الشامل يصل إلى 220 رطلا، ومنصات الرحلات واليوغا تدعم حتى 250 رطلا. كل صفحة منتج تذكر سعة وزن الراكب بالضبط حتى تتمكن من مطابقة اللوح حسب احتياجاتك.
      icon: tabler:adjustments
      category: رشفة
    - title: هل يمكنني السفر مع جهاز نفخSUP؟
      description: بالتأكيد. كل Paddle Board Overstock لوحة تجمع في حقيبة حمل بحجم حقيبة ظهر. بوزن 18-22 رطلا فقط، من السهل حملها إلى الشاطئ أو البحيرة أو عبر صالات المطار. تحقق من سياسة أمتعة الطيران قبل السفر.
      icon: tabler:truck-delivery
      category: رشفة
    - title: ماذا يأتي في الصندوق؟
      description: كل منها Paddle Board Overstock SUP يشمل اللوح، حقيبة السفر، مضخة يدوية، مجداف قابل للتعديل، زعنفة قابلة للإزالة، طوق لولبي، وعدة إصلاح.
      icon: tabler:clipboard-list
      category: رشفة
    - title: لماذا أسعاركم أقل من أسعار التجزئة؟
      description: نحن نبيع مخزون المصنع الزائد - اللوحات الجديدة تمامًا المتبقية من طلبات الإنتاج المكتملة - والتي يتم الحصول عليها من قاعدة التصنيع Weihai الخاصة بنا وشركاء الإنتاج المختارين. عدم وجود هوامش ربح للبيع بالتجزئة وعدم وجود وسطاء يعني توفير حزم SUP كاملة بخصم يصل إلى 60% على أسعار التجزئة النموذجية، بنفس الجودة التي تم اختبارها بالضغط.
      icon: tabler:shield-check
      category: طلبات
    - title: كيف أقوم بوضع طلب والدفع؟
      description: أضف حزمة SUP الخاصة بك إلى العربة وأكمل الدفع بأمان عبر Stripe أو PayPal. نحن نقبل جميع بطاقات الائتمان والخصم الرئيسية. يتم تأكيد كل طلب عبر البريد الإلكتروني مع فاتورة كاملة.
      icon: tabler:file-text
      category: طلبات
    - title: هل تشحنون دوليًا؟
      description: نعم. نحن نشحن إلى 50+ دولة عبر الاتحاد الأوروبي، أمريكا الشمالية، آسيا والمحيط الهادئ، الشرق الأوسط، وأفريقيا. عادةً ما يتم شحن الطلبات المتوفرة في المخزون خلال 2-3 أيام عمل مع توفير تتبع لكل طرد.
      icon: tabler:route
      category: طلبات
    - title: ما الضمان الذي تتضمنه لوحات SUP؟
      description: 'كل لوحة SUP والملحقات مشمولة بضمان لمدة سنتين — بما في ذلك اللوحة نفسها، وخياطات drop-stitch وصمامات النفخ. يتم حل المطالبات في أيام، وليس أسابيع: قدمها عبر الإنترنت وسنقوم بالإصلاح أو الاستبدال.'
      icon: tabler:lifebuoy
      category: طلبات
