faqs:
  title: الأسئلة الشائعة لمشتريات B2B
  subtitle: 'أسئلة شائعة من العلامات التجارية والموزعين والمشغلين التجاريين حول التصنيع OEM/ODM مع Paddle Board Overstock.'
  columns: 2
  items:
    - title: هل أنتم مصنع أم شركة تجارية؟
      description: 'نحن مصنع متكامل رأسياً بتحكم كامل في الجودة والمواد ومدد التنفيذ. يمكن التحقق من الرخصة التجارية ونطاق الإنتاج خلال تدقيق المصنع.'
      icon: tabler:building-factory
      category: all
    - title: كيف تجري عملية OEM/ODM لديكم؟
      description: 'من مراجعة المتطلبات (48 ساعة) إلى العرض ثم النموذج الأولي (7–14 يوماً) ثم الإنتاج (30–45 يوماً FOB تشينغداو). دعم هندسي كامل ووثائق مطابقة وتتبع لكل هيكل طوال العملية.'
      icon: tabler:route
      category: all
    - title: ما هي متطلبات الحد الأدنى للطلب؟
      description: 'قوارب RIB: 2–5 وحدات لكل موديل (قالب موجود)، و200+ للقوالب المخصصة. لوحات SUP: 5–10 وحدات لكل SKU. طلبات حاويات بموديلات مختلطة متاحة. طلبات عينات من 2–5 وحدات للتقييم.'
      icon: tabler:sort-ascending
      category: all
    - title: ما خيارات التخصيص المتاحة؟
      description: 'تصميم الهيكل، مواد الأنابيب (PVC أو Hypalon/CSM)، قطر الأنابيب، تخطيط الكونسول، المقاعد، التوجيه، نظام الوقود، تخطيط السطح، ألوان العلامة، رسومات الشعار، تصميم حصائر EVA، تغليف التجزئة، وعلامة دليل المالك.'
      icon: tabler:adjustments
      category: all
    - title: ما وثائق المطابقة التي يمكنكم توفيرها لسوقنا؟
      description: 'بيان CE وفق 2013/53/EU، علامة UKCA، شهادة ISO 9001 (SGS)، تقرير تدقيق BSCI، مطابقة REACH، تقارير اختبار المواد، سجلات اختبار الضغط، وبيانات لوحة الصانع لكل موديل. وثائق مخصصة للسوق عند الطلب.'
      icon: tabler:file-certificate
      category: all
    - title: ما هي مدة العينات والإنتاج؟
      description: 'عينات ما قبل الإنتاج: 7–14 يوم عمل. الإنتاج القياسي: 30–45 يوماً FOB تشينغداو. إنتاج عاجل متاح بتكلفة إضافية. قد تمتد المدد في موسم الذروة (مارس–يونيو).'
      icon: tabler:clock
      category: all
    - title: هل يمكنني ترتيب تدقيق مصنع أو جولة فيديو مباشرة؟
      description: 'نعم. تدقيقات ميدانية في منشأتنا بتشينغداو مرحب بها بإشعار مسبق 3–5 أيام. جولات فيديو مباشرة عبر WhatsApp/Zoom متاحة فوراً. نستوعب فحوصات الجهات الخارجية (SGS، BV، TÜV).'
      icon: tabler:video
      category: all
    - title: ما فحوصات الجودة التي تُجرى قبل الشحن؟
      description: 'اختبار احتفاظ بالضغط عند 1.25× المقنن (24–48 ساعة)، اختبار قشر اللحامات، قائمة فحص نهائي من 100 نقطة، تحقق الأبعاد، فحص المظهر، التحقق من وثائق المطابقة، وفحص سلامة التغليف. كل ذلك وفق إجراءات ISO 9001.'
      icon: tabler:clipboard-check
      category: all

