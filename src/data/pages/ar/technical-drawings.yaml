content_version_control:
  tagline: إدارة الإصدارات
  title: نسخة الرسم<br />الإدارة
  subtitle: يتبع كل رسم نظام مراجعة خاضع للرقابة. تأكد دائمًا من حصولك على المراجعة الحالية قبل استخدام الرسومات لتخطيط المشروع.
  items:
    - title: تتبع المراجعات
      description: يحمل كل رسم رمز مراجعة (Rev-A، وRev-B، وRev-C)، وتاريخ الإصدار، وتاريخ آخر مراجعة، والنموذج/التكوين المطبق، والوحدات، وحجم الملف، والتنسيق. النسخة "الحالية" فقط متاحة للتنزيل.
      icon: tabler:git-branch
    - title: إشعار حالة الرسم
      description: تم وضع علامة على جميع الرسومات العامة بأنها "تخطيط أولي فقط - وليس للبناء أو إصدار الشهادات أو الاستخدام في الإنتاج. وتخضع الأبعاد للمواصفات النهائية وتأكيد الطلب." وهذا يحمي كلا الطرفين من سوء التطبيق.
      icon: tabler:alert-circle
    - title: تحديث الإخطارات
      description: عندما تتغير مواصفات النموذج، يتم تحديث مراجعة الرسم ويتم وضع علامة "تم استبدال" على الإصدارات السابقة. يتم إخطار المستخدمين المسجلين الذين قاموا بتنزيل حزم DXF/DWG بالتحديثات المهمة عبر البريد الإلكتروني.
      icon: tabler:bell

