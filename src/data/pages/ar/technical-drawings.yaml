hero:
  tagline: الرسومات الفنية وCAD
  title: الضلع والقارب القابل للنفخ<br />الرسومات الفنية وتنزيلات التصميم بمساعدة الكمبيوتر (CAD).
  subtitle: رسومات GA على مستوى التخطيط، وأوراق الأبعاد، وتخطيطات سطح السفينة لتقييم المشروع ومواصفاته. يمكنك الوصول إلى الرسومات الفنية على المستوى المناسب — بدءًا من ملفات PDF العامة وحتى ملفات STEP على مستوى المشروع.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: الرسومات الفنية لقارب RIB وتنزيلات CAD
direct_answer: توفر Aquafarer رسومات فنية على مستوى الشراء لقوارب RIB والمراكب المائية القابلة للنفخ - بما في ذلك ملفات PDF الخاصة بالترتيب العام (GA) وأوراق الأبعاد ورسومات تخطيط سطح السفينة. تتوفر التنسيقات ذات التفاصيل الأعلى (DXF/DWG، STEP/IGES) عند الاستفسار المؤهل أو تطبيق المشروع.
