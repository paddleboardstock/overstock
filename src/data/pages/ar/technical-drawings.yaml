content_tiers:
  tagline: تحميل الطبقات
  title: أربعة مستويات وصول<br />— التفاصيل الصحيحة للمرحلة المناسبة
  subtitle: نحن نقدم رسومات على مستوى المشتريات، وليس ملفات على مستوى التصنيع. يتطابق كل مستوى مع مرحلة مختلفة من المشروع.
  items:
    - title: المستوى 1 – ملف PDF العام
      description: الترتيب العام (GA)، ورسم الأبعاد بأربعة طرق عرض، وتخطيط سطح السفينة بتنسيق PDF. متاح للتنزيل المجاني. كافية لتخطيط المشروع وتخصيص المساحة ومراجعة المواصفات الأولية.
      icon: tabler:file-type-pdf
    - title: المستوى 2 — النموذج الخفيف DXF/DWG
      description: ملفات CAD ثنائية الأبعاد (DXF أو DWG) لتكامل التخطيط على مستوى التخطيط. يتطلب نموذج تأهيل قصير (اسم الشركة، نوع المشروع، الاستخدام المقصود). لم يتم تضمين أي بيانات هيكلية أو تصنيعية.
      icon: tabler:file-code
    - title: المستوى 3 — تطبيق المشروع STEP/IGES
      description: ملفات نماذج ثلاثية الأبعاد (STEP أو IGES) لتكامل النظام، أو تصميم التجهيز، أو تنسيق الهندسة المعمارية البحرية. يتطلب تطبيق المشروع مع النطاق والجدول الزمني ونية الشراء. تخضع للموافقة.
      icon: tabler:cube
    - title: المستوى 4 - هندسة التجمع الوطني الديمقراطي
      description: الرسومات الهيكلية للهيكل، وجداول التصفيح، وتوسعات قطع الأنابيب، وبيانات القالب. متاح فقط بموجب اتفاقية عدم الإفشاء مع الطلبات المؤكدة. هذه ملفات على مستوى التصنيع، وليست مخصصة للتوزيع العام.
      icon: tabler:lock
content_included:
  tagline: ما هو مدرج
  title: محتويات الرسم<br />لكل نموذج
  subtitle: يحتوي كل نموذج على حزمة رسم قياسية تغطي معلومات التخطيط الأساسية لمشتري B2B ومهندسي المشاريع.
  items:
    - title: الترتيب العام (GA)
      description: المظهر الجانبي، والمنظر العلوي، والمقطع العرضي يوضح شكل الهيكل، وموضع الأنبوب، وموقع وحدة التحكم، والمقاعد، ونظام الوقود، والأبعاد الرئيسية (LOA، والعارضة، وقطر الأنبوب، وزاوية الارتفاع الميت). تم ملاحظة حالة المراجعة وحقوق الطبع والنشر على كتلة العنوان.
      icon: tabler:layout
    - title: 4-عرض رسم الأبعاد
      description: مناظر جانبية وأمامية وخلفية وعلوية مع الأبعاد الإجمالية لتخطيط النقل (الارتفاع على المقطورة، والعارضة للحاوية، والوزن للرفع). يشمل التكوينات التشغيلية والنقل.
      icon: tabler:ruler-2
    - title: تخطيط سطح السفينة وخطة المعدات
      description: منظر من أعلى إلى أسفل يُظهر قاعدة وحدة التحكم، ومواضع المقاعد، ومواقع الحلقة D، ومواضع مصابيح الملاحة، والوصول إلى مضخة ماء آسن، وحجرة البطارية/الوقود، ونقاط تركيب المعدات. دقة محدودة على واجهات الملكية.
      icon: tabler:map
    - title: رسم النقل والتغليف
      description: خطة تحميل الحاويات وأبعاد الحامل وتوزيع الوزن ومواضع نقاط الرفع للتخطيط اللوجستي. يتضمن خيارات التغليف القياسية والمخصصة.
      icon: tabler:truck
content_protection:
  tagline: حماية الملكية الفكرية
  title: ما الذي لا نشاركه<br />ولماذا
  subtitle: تضمن حماية الملكية الفكرية الهندسية لدينا إمكانية مواصلة الاستثمار في البحث والتطوير مع الاستمرار في توفير كل ما يحتاجه المشترون لتخطيط المشروع.
  items:
    - title: البيانات الأساسية لقوالب هال
      description: تُعد هندسة التوصيل والعفن، ومسارات أدوات CNC، وقوالب التصفيح من أصول التصنيع الخاصة. ولا تتم مشاركتها في أي مستوى وصول خارج عقود NDA المؤكدة.
      icon: tabler:ban
    - title: توسعات قطع الأنبوب
      description: ملفات القطع ذات النمط المسطح للنسيج الأنبوبي هي بيانات على مستوى التصنيع. متاح فقط بموجب اتفاقية عدم الإفشاء مع أوامر الإنتاج المؤكدة ومشاركتها فقط مع الطرف المتعاقد.
      icon: tabler:ban
    - title: الحسابات الهيكلية
      description: إن تحليل الضغط التفصيلي ونتائج FEA والجداول الزمنية هي مستندات حساسة للامتثال تتم مشاركتها فقط مع الهيئات المبلغة والعملاء المرتبطين بـ NDA أثناء عملية تقييم المطابقة.
      icon: tabler:ban
    - title: فحص المنافسين
      description: نحن نحتفظ بالحق في رفض طلبات الوصول إلى التصميم بمساعدة الكمبيوتر (CAD) التي تبدو وكأنها واردة من منافسين أو طلاب ليس لديهم سياق مشروع أو أطراف ليس لديها نية شراء مشروعة.
      icon: tabler:shield
content_models:
  tagline: النماذج المتاحة
  title: الرسم الفني<br />التوفر حسب الطراز
  subtitle: تتوفر تنزيلات GA PDF لنماذج RIB الرئيسية والقوارب القابلة للنفخ. اتصل بنا للحصول على رسومات نموذجية محددة غير مدرجة.
  items:
    - title: AF580 ضلع
      description: هيكل RIB بطول 5.8 م، وهيكل GRP عميق على شكل حرف V، وأنابيب Hypalon أو PVC، ووحدة تحكم مركزية. تتوفر GA والأبعاد وتخطيط السطح وخطة النقل. فئة التصميم ج.
      icon: tabler:sailboat
    - title: AF520 ضلع
      description: هيكل RIB بطول 5.2 متر، أو هيكل GRP على شكل حرف V متوسط، أو أنابيب Hypalon أو PVC، أو وحدة تحكم جانبية أو مركزية. GA والأبعاد المتاحة. فئة التصميم ج.
      icon: tabler:sailboat
    - title: AF430 ضلع
      description: 4.3 م RIB، هيكل GRP، أنابيب PVC، محراث أو وحدة تحكم. GA والأبعاد المتاحة. فئة التصميم ج/د.
      icon: tabler:sailboat
    - title: AF380 قارب قابل للنفخ
      description: زورق قابل للنفخ بطول 3.8 متر، أرضية من الألومنيوم، وأنابيب PVC. تتوفر أبعاد GA والتعبئة. متوافقة مع معايير ISO 6185.
      icon: tabler:sailboat
    - title: AF320 قارب قابل للنفخ
      description: قارب قابل للنفخ بطول 3.2 متر، أرضية سطح هوائي، أنابيب PVC. تتوفر أبعاد GA والتعبئة. متوافقة مع معايير ISO 6185.
      icon: tabler:sailboat
faq:
  title: الرسومات الفنية – الأسئلة المتداولة
  questions:
    - q: هل ملفات GA PDF مجانية التنزيل حقًا؟
      a: نعم. تتوفر ملفات PDF للترتيب العام لنماذجنا الرئيسية مجانًا. أنها تحتوي على معلومات على مستوى التخطيط كافية لتقييم المشروع، وتخصيص المساحة، ومراجعة المواصفات الأولية.
    - q: كيف يمكنني الوصول إلى ملفات DXF/DWG؟
      a: أكمل نموذج التأهيل القصير الموجود على صفحة التنزيل مع اسم شركتك ونوع المشروع والاستخدام المقصود. تتلقى الطلبات التي تمت الموافقة عليها رابط تنزيل عبر البريد الإلكتروني خلال يوم عمل واحد.
    - q: هل يمكنني الحصول على نماذج STEP/IGES 3D؟
      a: تتوفر ملفات نماذج STEP أو IGES 3D من خلال عملية تقديم طلبات المشروع لدينا. قم بتوفير نطاق مشروعك ومتطلبات التكامل والجدول الزمني ونية الشراء. تخضع للموافقة - عادةً خلال 3-5 أيام عمل.
    - q: لماذا تقوم بتقييد الوصول إلى الملفات ذات التفاصيل الأعلى؟
      a: تمثل هندسة الهيكل وبيانات القالب والحسابات الهيكلية سنوات من الاستثمار في البحث والتطوير وهي الملكية الفكرية الأساسية للتصنيع. نحن نقدم كل ما هو مطلوب لتخطيط المشتريات وتكامل المشاريع مع حماية قدرتنا على مواصلة الاستثمار في تطوير المنتجات الجديدة.
    - q: هل تتضمن الرسومات تفاصيل التصنيع؟
      a: لا. تحتوي الرسومات العامة والخفيفة على معلومات على مستوى الشراء للتخطيط والمواصفات. تتم مشاركة التفاصيل على مستوى التصنيع (جداول التصفيح، ومسارات الأدوات، وتوسعات القطع) فقط بموجب اتفاقية عدم الإفشاء (NDA) مع الطلبات المؤكدة.
    - q: هل الرسومات متاحة لتكوينات RIB المخصصة أو شبه المخصصة؟
      a: يتم إعداد رسومات المشروع المخصصة كجزء من عملية تطوير OEM/ODM. إذا كنت تقوم بتقييم مشروع RIB مخصص، فاتصل بنا وأخبرنا بمتطلباتك وسنقدم رسومات GA الخاصة بالمشروع كجزء من الاقتراح.
