body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  ينطبق هذا الضمان المحدود على Paddle Board Overstock الألواح القابلة للنفخ ذات العلامات التجارية الجديدة SUP التي يتم شراؤها مباشرة من Paddle Board Overstock المتجر الإلكتروني. تاريخ السرية هو تاريخ الشراء الأصلي القابل للتحقق من التاريخ.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">تغطية الضمان ومدة الضمان</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
