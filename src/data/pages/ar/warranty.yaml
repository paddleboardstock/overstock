label: Warranty
headline: Paddle Board Overstock Manufacturer Limited Warranty
subtitle: Paddle Board Overstock stands behind the quality of every inflatable SUP board we manufacture. This Limited Warranty sets forth the terms and coverage for your Paddle Board Overstock board.
seo:
  headline: Paddle Board Overstock SUP Warranty — 2-Year Limited Warranty | Paddle Board Overstock
  description: Paddle Board Overstock offers a 2-year limited warranty covering drop-stitch seams, rail construction, inflation valves, and included accessories on every SUP board. Full terms and conditions.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
      This Limited Warranty applies to new Paddle Board Overstock branded inflatable SUP boards purchased directly from the Paddle Board Overstock online store. The effective date is the verifiable date of original purchase.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Warranty Coverage &amp; Duration</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Years</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch core &amp; deck structure</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Years</h3>
          <p class="text-sm text-gray-600 mt-1">Rail &amp; seam construction</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Years</h3>
          <p class="text-sm text-gray-600 mt-1">Inflation valve functionality</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Years</h3>
          <p class="text-sm text-gray-600 mt-1">Included accessories (pump, paddle, leash, fin)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Year*</h3>
          <p class="text-sm text-gray-600 mt-1">Commercial, rental, or fleet use — all components</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Commercial, rental, or fleet use reduces warranty to 1 year. Racing or competition use voids warranty entirely.</p>
    </div>

    <h2>What Is Covered</h2>
    <h3>Drop-Stitch Core &amp; Deck Structure (2 Years)</h3>
    <p>The internal drop-stitch core and outer structure of the board are warranted against manufacturing defects that compromise the board's ability to maintain operational inflation and rigidity.</p>

    <h3>Rail &amp; Seam Construction (2 Years)</h3>
    <p>The seams and triple-layer rail bands, where joined during manufacture, are warranted against manufacturing defects that result in substantial air leakage through the seam. Periodic inspection and maintenance of appropriate inflation pressures are conditions of coverage.</p>

    <h3>Inflation Valve Functionality (2 Years)</h3>
    <p>Air inflation valves originally installed by Paddle Board Overstock are warranted against manufacturing defects in materials or workmanship that prevent the valve from holding air as designed.</p>

    <h3>Included Accessories (2 Years)</h3>
    <p>The pump, adjustable paddle, leash, removable fin, and other components included with your board package are warranted against defects in material and workmanship.</p>

    <h2>What Is Not Covered</h2>
    <ul>
      <li>Cosmetic flaws including discoloration, staining, fading, chalking, or any alteration in appearance</li>
      <li>Punctures, cuts, tears, rips, or other physical damage</li>
      <li>Crazing, cracking, abrasion, scuffing, or deterioration from friction or contact</li>
      <li>Degradation from UV light exposure, weathering, or atmospheric conditions</li>
      <li>Damage from contact with solvents, acids, alkalis, or chemicals</li>
      <li>Damage from negligence, improper use, abuse, accident, or normal wear and tear</li>
      <li>Damage from impact, stress, improper support, or transport</li>
      <li>Damage from improper inflation/deflation or use of non-approved inflation devices</li>
      <li>Third-party equipment, components, or systems (covered by their respective manufacturers)</li>
    </ul>

    <h2>Manufacturer's Obligation &amp; Remedy</h2>
    <p>Paddle Board Overstock's sole and exclusive obligation is the repair or replacement, at Paddle Board Overstock's option, of any component determined to be defective in materials or workmanship and covered under this warranty. Repairs or replacements are performed by Paddle Board Overstock or its designated service facility. Components repaired or replaced are warranted only for the unexpired portion of the original warranty period.</p>

    <h2>Conditions of Warranty</h2>
    <ul>
      <li><strong>Maintenance:</strong> The product must be maintained in accordance with Paddle Board Overstock's published guidelines, including periodic inspection and maintenance of appropriate inflation pressures.</li>
      <li><strong>Cooperation:</strong> The purchaser must fully and promptly cooperate with Paddle Board Overstock in all matters pertaining to warranty claims.</li>
      <li><strong>Original Purchaser:</strong> This warranty is extended exclusively to the original end-user purchaser and is not transferable.</li>
    </ul>

    <h2>Commercial Use</h2>
    <p>If the product is used for commercial, rental, or fleet purposes, the warranty period for all components is reduced to one (1) year from the original date of purchase. Use in racing, speed or endurance competition immediately and irrevocably voids the warranty entirely.</p>

    <h2>How to Make a Warranty Claim</h2>
    <p>Contact Paddle Board Overstock with proof of purchase and a detailed description of the issue. Paddle Board Overstock will review the claim and provide instructions for inspection and service.</p>
    <p>For warranty service inquiries, please contact us through our <a href="/contact" class="text-sky-600 underline">contact page</a> with your order number and product details.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
      This warranty statement is a summary of the complete Paddle Board Overstock Manufacturer's Limited Warranty. The full legal warranty document governs all warranty terms and conditions. Specifications subject to change without notice. Paddle Board Overstock is a factory brand of the Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
