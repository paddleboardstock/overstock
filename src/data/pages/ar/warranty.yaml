    <h2>ما الذي يتم تغطيته</h2>
    <h3>Drop-Stitch هيكل النواة والسطح (سنتان)</h3>
    <p>drop-stitch النواة الداخلية والبنية الخارجية للوح مضمونة ضد عيوب التصنيع التي تؤثر على قدرة اللوحة على الحفاظ على التضخم التشغيلي وصلابته.</p>

    <h3>السكك الحديدية والدرزة للبناء (سنتان)</h3>
    <p>اللحامات وأحزمة السكك الثلاثية الطبقات، عند ربطها أثناء التصنيع، مضمونة ضد عيوب التصنيع التي تؤدي إلى تسرب هواء كبير عبر الوصلة. الفحص الدوري والصيانة لضغوط الانتفاخ المناسبة هي شروط التغطية.</p>

    <h3>وظيفة صمام النفخ (سنتان)</h3>
    <p>صمامات نفخ الهواء التي تم تركيبها في الأصل Paddle Board Overstock مضمونة ضد عيوب التصنيع في المواد أو جودة التصنيع التي تمنع الصمام من احتفاظ الهواء كما هو مصمم.</p>

    <h3>الإكسسوارات المشمولة (سنتان)</h3>
    <p>المضخة، والمجداف القابل للتعديل، والرباط، وزعنفة الإزالة، وغيرها من المكونات المرفقة مع حزمة اللوح الخاصة بك مضمونة ضد العيوب في المادة وجودة الصنع.</p>

    <h2>ما الذي لا يغطي</h2>
    <ul>
      <li>عيوب جمالية تشمل تغير اللون، البقع، التلاشي، الطباشير، أو أي تغيير في المظهر</li>
      <li>ثقوب، جروح، تمزق، تمزق، أو أضرار جسدية أخرى</li>
      <li>التجعد أو التشقق أو الخدش أو التدهور الناتج عن الاحتكاك أو التلامس</li>
      <li>التدهور الناتج عن UV التعرض للضوء أو العوامل الجوية أو الظروف الجوية</li>
      <li>الضرر الناتج عن ملامسة المذيبات أو الأحماض أو القلويات أو المواد الكيميائية</li>
      <li>الأضرار الناتجة عن الإهمال أو الاستخدام غير السليم أو سوء المعاملة أو الحوادث أو البلى الطبيعي</li>
      <li>ضرر نتيجة الصدمة أو الإجهاد أو الدعم غير المناسب أو النقل</li>
      <li>ضرر ناتج عن النفخ/التفريغ غير السليم أو استخدام أجهزة نفخ غير معتمدة</li>
      <li>المعدات أو المكونات أو الأنظمة التابعة لأطراف ثالثة (المغطاة من قبل الشركات المصنعة الخاصة بها)</li>
    </ul>

    <h2>التزام الشركة المصنعة والعلاج</h2>
    <p>الالتزام الوحيد والحصري لـ Paddle Board Overstock هو إصلاح أو استبدال، حسب اختيار Paddle Board Overstock، لأي مكون يتبين أنه معيب في المواد أو الصنعة ومغطى بموجب هذا الضمان. يتم إجراء الإصلاحات أو الاستبدال بواسطة Paddle Board Overstock أو منشأتها الخدمية المعينة. المكونات التي تم إصلاحها أو استبدالها مضمونة فقط للفترة غير المنتهية من فترة الضمان الأصلية.</p>

    <h2>شروط الضمان</h2>
    <ul>
      <li><strong>الصيانة:</strong>يجب الحفاظ على المنتج وفقًا للإرشادات المنشورة من Paddle Board Overstock، بما في ذلك التفتيش الدوري وصيانة الضغوط المناسبة للنفخ.</li>
      <li><strong>التعاون:</strong>يجب على المشتري التعاون بشكل كامل وسريع مع Paddle Board Overstock في جميع الأمور المتعلقة بمطالبات الضمان.</li>
      <li><strong>المشتري الأصلي:</strong>تمتد هذه الضمانة حصريًا للمشتري الأصلي النهائي وليست قابلة للتحويل.</li>
    </ul>

    <h2>الاستخدام التجاري</h2>
    <p>إذا تم استخدام المنتج للأغراض التجارية أو الإيجار أو الأسطول، فإن فترة الضمان لجميع المكونات تُختصر إلى سنة واحدة (1) من تاريخ الشراء الأصلي. الاستخدام في السباقات أو السرعة أو منافسات التحمل يبطل الضمان فورًا وبشكل لا رجعة فيه بالكامل.</p>

    <h2>كيفية تقديم طلب ضمان</h2>
    <p>اتصل بـ Paddle Board Overstock مع إثبات الشراء ووصف مفصل للمشكلة. سيقوم Paddle Board Overstock بمراجعة المطالبة وتقديم التعليمات للفحص والخدمة.</p>
    <p>للاستفسارات حول خدمة الضمان، يرجى الاتصال بنا عبر<a href="/contact" class="text-sky-600 underline">صفحة الاتصال</a>مع رقم طلبك وتفاصيل المنتج.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  تعد بيان الضمان هذا ملخصًا للضمان المحدود الكامل للشركة المصنعة Paddle Board Overstock. الوثيقة القانونية الكاملة للضمان تحكم جميع شروط وأحكام الضمان. قد تتغير المواصفات دون إشعار. Paddle Board Overstock هي علامة تجارية للمصنع في مركز تصنيع ويهاي Paddle Board Overstock.
