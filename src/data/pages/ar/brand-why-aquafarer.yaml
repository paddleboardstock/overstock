features3_reasons:
  tagline: لماذا تختار Aquafarer
  title: 'سبعة أسباب للشراكة معنا'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. تصنيع حقيقي، وليس تجارة'
      description: 'نمتلك ونشغّل مصنعًا بمساحة 12,000 م². عند الشراكة مع Aquafarer، تعمل مباشرة مع الأشخاص الذين يصممون ويهندسون ويبنون منتجاتك — دون وسطاء.'
      icon: tabler:building-factory
    - title: '2. نهج تقوده الهندسة'
      description: 'تبدأ عملية التصميم لدينا من حالة الاستخدام، لا من فئة المنتج. نحسّن شكل البدن واختيار المواد والتكوين وفقًا لطريقة استخدام القارب فعليًا.'
      icon: tabler:engine
    - title: '3. جودة معتمدة'
      description: 'شهادة CE، ونظام جودة ISO، والتوافق مع BSCI وREACH، واعتماد USCG. نماذجنا الـ64 الحاصلة على شهادة CE تستوفي المعايير الدولية — وليس مجرد ادعاءات.'
      icon: tabler:certificate
    - title: '4. OEM/ODM مرن'
      description: 'ألوان الأنابيب، وتخطيط الكونسول، والعلامة التجارية، والتغليف — نخصص كل شيء وفقًا لمواصفاتك. لا ضغط للحد الأدنى للطلب. ابدأ بنموذج أولي وتوسّع بثقة.'
      icon: tabler:adjustments
    - title: '5. لوجستيات عالمية'
      description: 'مستودع في الولايات المتحدة بكاليفورنيا، وشحن مباشر من تشينغداو، وشحن جوي للطلبات العاجلة. نتولى أوراق الجمارك والوثائق.'
      icon: tabler:truck-delivery
    - title: '6. دعم مدى الحياة'
      description: 'ندعم القوارب التي بنيناها قبل 20 عامًا. قطع غيار أصلية، ونصائح تقنية، وإرشادات للإصلاح — فريقنا متاح عندما تحتاج إلينا.'
      icon: tabler:lifebuoy
    - title: '7. مواصفات صادقة'
      description: 'أحمال حقيقية، وأبعاد حقيقية، ووزن حقيقي. لا مبالغات تسويقية. ما ننشره هو ما تحصل عليه — مثبت باختبارات مستقلة.'
      icon: tabler:ruler-measure
testimonials:
  tagline: موثوق من العلامات حول العالم
  title: ماذا يقول شركاؤنا
  items:
    - content: 'تعاملنا مع عدة مصانع في الصين، لكن Aquafarer تتميز بدعمها الهندسي وجودتها المتسقة. يتعاملون مع علامتنا كأنها علامتهم.'
      name: '— شريك OEM، علامة أوروبية للرياضات المائية'
    - content: 'قوارب RIB من Hypalon لديهم تعمل في أسطولنا منذ أكثر من 5 سنوات. صيانة ضئيلة ومقاومة ممتازة للأشعة فوق البنفسجية. ضمان 5 سنوات على الأنابيب يمنحنا الثقة.'
      name: '— مشغّل أسطول، مجموعة منتجعات في الشرق الأوسط'
    - content: 'ساعدنا فريق Aquafarer على تطوير تصميم مخصص للوحة SUP من الفكرة إلى الإنتاج خلال 90 يومًا. تجاوزت الجودة توقعاتنا.'
      name: '— موزع، رياضات مائية أسترالية'
cta:
  title: 'هل أنت مستعد لتجربة الفرق؟'
  subtitle: 'تواصل مع فريقنا لمناقشة مشروعك. لا التزام مطلوب — فقط نصائح صادقة حول التصنيع.'
  actions:
    - variant: primary
      text: تحدث مع فريقنا
      href: /contact
    - text: تحميل كتالوج المنتجات
      href: /resources
