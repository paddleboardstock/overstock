process_section:
  tagline: كيف يعمل الشحن
  title: من مخزننا إلى بابك
  steps:
    - title: عرض الأسعار مع خيارات الشحن
      description: يضمّ كل عرض أسعار تفاصيل خيارات الشحن لوجهتك — السريع والبحري — مع أوقات تقديرية للنقل، حتى لا يُتخذ أي قرار نيابة عنك.
    - title: فحص الجودة والتعبئة
      description: تُختبر الألواح بنسبة 100% للضغط، ثم تُعبأ بالمضخة والمجداف والسلسلة والزعنفة والحقيبة ومجموعة الإصلاح — نفس الحزمة الكاملة التي نبيعها بالجملة.
    - title: الإرسال من ويهاي
      description: تغادر شحنتك قاعدة اللوجستيات لدينا بالطريقة التي اخترتها للشحن ويتم مشاركة التتبع من الباب إلى الباب معك في نفس اليوم.
    - title: التخليص الجمركي
      description: نحن نقدم الفاتورة التجارية وقائمة التعبئة التي تحتاجها للاستيراد. الرسوم الجمركية والضرائب في بلدك هي مسؤولية المستورد — انظر قسم الجمارك أدناه.
    - title: التسليم والفحص
      description: قم بفحص تسليمك عند الوصول. إذا كان هناك أي شيء تالف أو مفقود، اتصل بنا مع صور ورقم طلبك — انظر سياسة الفقدان والتلف أدناه.
customs_section:
  tagline: الجمارك والرسوم
  title: الرسوم الجمركية وضرائب الاستيراد
  subtitle: نحن نوضح مسؤوليات الشحن بشكل صريح بدلاً من إعطاء وعود غامضة. إليك بالضبط من المسؤول عن ماذا.
  items:
    - title: ما الذي نغطيه
      description: يشمل عرض السعر الخاص بك تكلفة الشحن إلى وجهتك، ونقوم بإعداد وتوفير جميع مستندات التصدير — الفاتورة التجارية، قائمة التعبئة، وتتبع الشحنة.
    - title: ما يغطيه المستورد
      description: الرسوم الجمركية، ضريبة القيمة المضافة/ضريبة السلع والخدمات، وأي ضرائب في بلد الوجهة يتحملها المستورد (أنت أو عملك) حسب قوانين بلدك. نحن لا ندرج وعود ضريبية غامضة في عروض أسعار الشحن لدينا.
    - title: دعم التخليص الجمركي
      description: أوراقنا كاملة ومتسقة — رموز HS الصحيحة، القيم المعلنة، ومواصفات اللوحة — وهذا ما يجعل التخليص سلسا. إذا كان وسيطك أو مكتب الجمارك بحاجة إلى مستندات إضافية، نوفرها.
    - title: تحقق من الأسعار المحلية قبل الطلب
      description: تختلف معدلات الرسوم على معدات الرياضات المائية القابلة للنفخ من دولة لأخرى. تحقق من قواعد الاستيراد في بلدك أو اسأل في استفسارك — فأرشحتنا الإقليمية للأسواق تتضمن ملاحظات جمركية للأسواق الرئيسية.
lost_damaged:
  title: الشحنات المفقودة أو التالفة
  description: افحص توصيلك عند وصوله. في حالة نادرة وصلت لوحة تالفة أو فقدت طرد، تواصل معنا في أقرب وقت ممكن مع رقم طلبك وصور واضحة للتغليف واللوحة. نقوم بتقييم كل حالة بشكل فردي — حسب الحالة، وهذا يعني قطعة بديلة، أو لوحة بديلة، أو استرداد للعنصر المتضرر. العيوب التصنيعية مغطاة بشكل منفصل ضمن ضمان السنتين SUP لدينا.
destinations_section:
  tagline: أين نشحن
  title: 50+ دولة وما زلت تتزايد
  description: نحن نشحن إلى جميع أنحاء العالم، مع أدلة مفصلة لأسواقنا الإقليمية الرئيسية. يغطي كل دليل سوق أنواع العملاء المحليين، وملاحظات الشحن، ونصائح الجمارك لتلك المنطقة.
  regions_label: المرشدون الإقليميون
  countries_label: أدلة الريف
faq_section:
  title: الأسئلة الشائعة حول الشحن
  items:
    - q: كم يستغرق الشحن السريع؟
      a: وقت النقل السريع يعتمد على الوجهة — نحن نعرض الوقت المقدر للعبور لبلدك مع كل استفسار، قبل أن تلتزم بأي شيء.
    - q: كم يستغرق الشحن البحري؟
      a: تختلف رحلات الشحن البحري حسب الموانئ الوجهية وجداول الإبحار. نقدم عرض نافذة زمنية تقديرية لوجهتك مع طلبك، وستتلقى التتبع بمجرد مغادرة الشحنة.
    - q: ما طريقة الشحن التي يجب أن أختارها؟
      a: الشحن السريع ل 1–3 لوحات، عينات، أو إعادة تخزين عاجلة. الشحن البحري لطلبات الجملة من 5 إلى 20 لوحا حيث التكلفة لكل لوح أهم من السرعة. نحن نقدم عرض السعر لتتمكن من المقارنة.
    - q: هل تشمل الرسوم والضرائب على الواردات ضمن تكلفة الشحن؟
      a: لا. يتم عرض الشحن بشكل منفصل، والرسوم الجمركية على الاستيراد، وضريبة القيمة المضافة/ضريبة السلع والنقل، وضرائب الوجهة هي مسؤولية المستورد بموجب قواعد بلدك. نوفر أوراقا كاملة ودقيقة للحفاظ على سلاسة التصفيص.
    - q: هل تشحنون إلى بلدي؟
      a: نحن نشحن إلى 50+ دولة. راجع أدلتنا الإقليمية والقطرية أدناه، أو ببساطة اسأل في استفسارك — سنؤكد الخدمة الحالية إلى عنوانك.
    - q: هل يمكنني تتبع طلبي؟
      a: نعم. كل شحنة — سواء كانت سريعة أو بحرية — تتضمن تتبع من باب إلى باب نشاركه معك في يوم الإرسال.
