hero:
  tagline: الشحن الدولي
  title: الشحن الدولي —<br />الشحن السريع والشحن البحري إلى 50+ دولة
  subtitle: كل طلب يشحن من قاعدة الخدمات اللوجستية في ويهاي في الصين. اختر الشحن الجوي السريع للعينات وإعادة التخزين العاجلة، أو الشحن البحري الموحد لطلبات الجملة للشركات الصغيرة.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP ألواح معبأة للشحن الدولي
direct_answer: Paddle Board Overstock تشحن إلى أكثر من 50 دولة من ويهاي، الصين. تحمل شحنات الشحن الجوي السريعة 1–3 لوحات، وطلبات عينات، وإعادة تخزين عاجلة؛ الشحن البحري الموحد هو الخيار الاقتصادي لطلبات الجملة من 5 إلى 20 لوحا. تشمل كل شحنة تتبع من باب إلى باب، وكل لوحة تختبر 100٪ على الضغط وتعبئ مع مجموعة الإكسسوارات الكاملة قبل الإرسال.
tldr_points:
  - 'الشحن الجوي السريع: 1–3 لوحات، عينات، إعادة تخزين عاجلة — الخيار الأسرع'
  - 'الشحن البحري: طلبات جملة من 5 إلى 20 لوح — أقل تكلفة شحن لكل لوح'
  - تتبع من باب إلى باب على كل شحنة إلى 50+ دولة
  - يتم تفصيل الشحن والتأمين، والتخليص الجمركي، ورسوم الاستيراد في عرض السعر الخاص بك — دون وعود شاملة غامضة
from_china:
  tagline: الشحن من الصين
  title: من أين ترسل الطلبات
  description: جميع الطلبات ترسل من قاعدة اللوجستيات لدينا في ويهاي، الصين — قلب عمليات الإنتاج والتخزين لدينا. ويهاي هي مدينة ساحلية رئيسية في مقاطعة شاندونغ مع وصلات مباشرة للشحن البحري والجوي، مما يحافظ على أوقات النقل وتكاليف الشحن تنافسية لوجهات عبر آسيا والأمريكتين وأفريقيا وأوروبا والشرق الأوسط.
modes_section:
  tagline: خياران
  title: الشحن السريع أو الشحن البحري
  subtitle: طريقة الشحن المناسبة تعتمد على مدى سرعة حاجتك للألواح وعدد الطلبات التي تطلبها. كلا الخيارين يتم ذكرهما مع كل استفسار.
  express:
    name: الخيار أ — الشحن السريع
    best_for: الأفضل لألواح 1–3، وعينات، وإعادة تخزين عاجلة
    description: ترسل Air Express طلبات صغيرة ولوحات عينات إلى باب المنزل خلال أيام وليس أسابيع. مثالي عندما تختبر نموذجا قبل طلب أكبر، أو تعيد تزويد منتج من الأكثر مبيعا في منتصف الموسم.
    features:
      - 1–3 لوحات، نماذج فردية، أو نماذج مختلطة
      - أسرع عبور بين الخيارين — مقتبسين لكل وجهة
      - تتبع من باب إلى باب مع ناقل سريع رئيسي
      - 'الاستخدام النموذجي: عينات، إعادة تخزين عاجلة، طلبات أولى صغيرة'
  sea:
    name: الخيار ب — الشحن البحري
    best_for: الأفضل لطلبات الجملة والتجزئة من 5 إلى 20 لوحا
    description: الشحن البحري الموحد هو الخيار الاقتصادي لطلبات الجملة للشركات الصغيرة. يتم تعبئة الألواح معا في شحنة موحدة واحدة من ويهاي، مما يحافظ على انخفاض تكلفة الشحن لكل لوح.
    features:
      - طلبات من 5 إلى 20 لوحة وطلبات بيع بالجملة
      - أقل تكلفة شحن لكل لوح بين الخيارين
      - التعبئة الموحدة — شحنة واحدة، وتخفيض واحد
      - 'الاستخدام النموذجي: إعادة تخزين موسمية، طلبات جملة متعددة النماذج'
