      label: الجدول الزمني للمشروع
      type: يختار
      required: true
      options:
        - عاجل (خلال 30 يومًا)
        - قياسي (30-60 يومًا)
        - مخطط (60-90 يومًا)
        - تخطيط مستقبلي (90+ يومًا)
    - name: رسالة
      label: تفاصيل المشروع ومتطلباته
      type: منطقة النص
      required: false
      placeholder: قم بوصف مشروعك وطلبك وأي متطلبات محددة...
