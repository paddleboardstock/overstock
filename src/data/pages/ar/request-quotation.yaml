hero_text:
  tagline: احصل على عرض أسعار
  title: اطلب عرض أسعار<br />لمشروعك
  subtitle: أخبرنا عن متطلباتك وسيقوم فريقنا بالرد عليك بتقديم عرض أسعار تفصيلي خلال يومي عمل.
steps2_process:
  title: كيف يعمل
  subtitle: أربع خطوات بسيطة من الاستفسار إلى الاقتباس.
  items:
    - title: 'الخطوة 1: أرسل متطلباتك'
      description: املأ النموذج أدناه بنوع منتجك وكميته ومواصفاته. كلما زادت التفاصيل التي تقدمها، كلما كان عرض الأسعار الخاص بك أكثر دقة.
      icon: tabler:file-text
    - title: 'الخطوة 2: نقوم بالمراجعة وتقديم المشورة'
      description: يقوم فريقنا الهندسي بمراجعة متطلباتك وقد يتصل بك للتوضيح. نحن نقدم توصيات بشأن تكوين المنتج وخياراته.
      icon: tabler:users
    - title: 'الخطوة 3: احصل على عرض الأسعار الخاص بك'
      description: ستتلقى عرض أسعار تفصيليًا يتضمن تسعير الوحدة وموك والمدة الزمنية وشروط الدفع وخيارات الشحن. عادة خلال 48 ساعة.
      icon: tabler:currency-dollar
    - title: 'الخطوة 4: العينة والإنتاج'
      description: بعد قبول عرض الأسعار، ننتقل إلى إنتاج العينات (إن أمكن) أو مباشرة إلى الإنتاج الضخم. تحديثات منتظمة طوال العملية.
      icon: tabler:building-factory
content_form:
  tagline: نموذج الاقتباس
  title: أخبرنا عن مشروعك
  subtitle: جميع الحقول التي تحتوي على * مطلوبة.
  fields:
    - name: فئة المنتج
      type: يختار
      options:
        - قارب RIB
        - قارب قابل للنفخ
        - لوح SUP
        - كاياك قابل للنفخ
        - سترة نجاة
        - ملحق بحري
        - OEM/ODM مخصص
    - name: طلب
      type: يختار
      options:
        - مركز غوص
        - الصيد
        - السياحة البحرية / المنتجع
        - البحث والإنقاذ
        - تندر اليخت
        - قارب عمل تجاري
        - حكومي / عسكري
        - OEM / علامة خاصة
        - شخصي / ترفيهي
        - غير ذلك
    - name: كمية
      type: نص
      placeholder: على سبيل المثال 50 وحدة
    - name: السوق المستهدف
      type: نص
      placeholder: على سبيل المثال أوروبا وأمريكا الشمالية والشرق الأوسط
    - name: بلد التسليم
      type: نص
      placeholder: على سبيل المثال إيطاليا، الإمارات العربية المتحدة، الولايات المتحدة الأمريكية، أستراليا
    - name: تفضيل المواد
      type: يختار
      options:
        - بدون تفضيل
        - PVC بجودة بحرية (1100 dtex)
        - هيبالون فاخر / CSM
        - هيكل من الألياف الزجاجية
        - هيكل من الألومنيوم
    - name: متطلبات المحرك
      type: نص
      placeholder: على سبيل المثال خارجي 60 حصان بدون محرك توأم 115 حصان
    - name: التخصيص مطلوب
      type: نص
      placeholder: على سبيل المثال الألوان المخصصة، والعلامات التجارية / الشعار، والتغليف، والتجهيزات الخاصة
    - name: الجدول الزمني
      type: نص
      placeholder: على سبيل المثال التسليم في غضون 90 يوما
    - name: متطلبات إضافية
      type: منطقة النص
      placeholder: قم بوصف طلبك أو المواصفات الفنية أو أي متطلبات خاصة - بما في ذلك الرسومات المرجعية أو المواصفات أو الروابط إذا كانت متوفرة
    - name: تحميل المواصفات
      type: ملف
      placeholder: قم بتحميل ورقة المواصفات أو الرسم أو المستند المرجعي (PDF، DWG، DXF)
    - name: تحميل الشعار / العمل الفني
      type: ملف
      placeholder: قم بتحميل شعارك أو عملك الفني للعلامة التجارية المخصصة (AI، EPS، PNG)
content_rfq_types:
  tagline: نظام RFQ من 3 طبقات
  title: اختر مستوى الاستفسار المناسب<br />
  subtitle: تحتاج المشاريع المختلفة إلى مستويات مختلفة من التفاصيل. حدد النموذج الذي يتوافق مع مرحلة الشراء الخاصة بك.
  items:
    - title: استفسار سريع
      description: 5-6 حقول، 30 ثانية. للاتصال الأولي أو الأسئلة العامة أو متابعة تنزيل الموارد. نقوم بالرد خلال 24 ساعة بالمعلومات الأساسية والخطوات التالية.
      icon: tabler:bolt
    - title: طلب عرض الأسعار القياسي
      description: 8-10 حقول، 2 دقيقة. للحصول على عروض أسعار منتجات محددة مع اختيار النموذج والكمية ومتطلبات التسليم. احصل على عرض أسعار مفصل خلال 48 ساعة.
      icon: tabler:file-text
    - title: طلب عرض أسعار المشروع
      description: 10-14 حقلاً، 5 دقائق. بالنسبة لـ RIB، أو أسطول المنتجعات، أو مشاريع الإنقاذ، أو المشاريع الحكومية التي تتطلب تكوينًا مخصصًا، ووثائق الامتثال، وتخطيط التوريد متعدد السنوات. تم تعيين مدير مشروع مخصص.
      icon: tabler:clipboard-list
form_quick:
  title: استفسار سريع
  subtitle: اتصال سريع للأسئلة العامة وطلبات المعلومات الأولية.
  fields:
    - name: الاسم الكامل
      label: الاسم الكامل
      type: نص
      required: true
      placeholder: اسمك الكامل
    - name: بريد الأعمال
      label: البريد الإلكتروني للأعمال
      type: بريد إلكتروني
      required: true
      placeholder: you@company.com
    - name: اسم الشركة
      label: اسم الشركة
      type: نص
      required: true
      placeholder: شركتك
    - name: نوع المشتري
      label: أنا ...
      type: يختار
      required: true
      options:
        - موزع / مستورد
        - مالك العلامة التجارية / علامة خاصة
        - منتجع / مركز مائي
        - مشغل تأجير
        - جهة حكومية / إنقاذ
        - مشغل غوص / صيد
        - مهندس بحري / تجديد
        - غير ذلك
    - name: ProductInterest
      label: مصلحة المنتج
      type: تحديد متعدد
      required: true
      options:
        - قوارب RIB
        - قوارب قابلة للنفخ
        - ألواح SUP
        - معدات السلامة
        - ملحقات
        - OEM/ODM مخصص
    - name: رسالة
      label: ماذا تحتاج؟
      type: منطقة النص
      required: false
      placeholder: وصف مختصر لاحتياجاتك...
form_standard:
  title: طلب عرض الأسعار القياسي
  subtitle: طلب عرض أسعار تفصيلي لمنتجات وكميات محددة.
  fields:
    - name: الاسم الكامل
      label: الاسم الكامل
      type: نص
      required: true
    - name: بريد الأعمال
      label: البريد الإلكتروني للأعمال
      type: بريد إلكتروني
      required: true
    - name: اسم الشركة
      label: اسم الشركة
      type: نص
      required: true
    - name: نوع المشتري
      label: نوع المشتري
      type: يختار
      required: true
    - name: ProductModel
      label: طراز / نوع المنتج
      type: نص
      required: true
      placeholder: على سبيل المثال، AF580 RIB، AF380 قابل للنفخ
    - name: كمية
      label: الكمية المقدرة
      type: نص
      required: true
      placeholder: على سبيل المثال، 10-20 وحدة
    - name: السوق المستهدف
      label: السوق المستهدف / المنطقة
      type: نص
      required: true
      placeholder: على سبيل المثال، الاتحاد الأوروبي وأمريكا الشمالية والشرق الأوسط
    - name: DeliveryTimeline
      label: التسليم المطلوب
      type: يختار
      required: true
      options:
        - خلال 30 يومًا
        - 30-60 يومًا
        - 60-90 يومًا
        - تخطيط مسبق (90+ يومًا)
        - مجرد بحث
    - name: الامتثال مطلوب
      label: متطلبات الامتثال
      type: تحديد متعدد
      required: false
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - لا شيء / غير متأكد
    - name: رسالة
      label: تفاصيل إضافية
      type: منطقة النص
      required: false
form_project:
  title: طلب عرض أسعار المشروع
  subtitle: استعلام شامل عن المشروع فيما يتعلق بالأسطول أو المشتريات المخصصة أو الحكومية.
  fields:
    - name: الاسم الكامل
      label: الاسم الكامل
      type: نص
      required: true
    - name: بريد الأعمال
      label: البريد الإلكتروني للأعمال
      type: بريد إلكتروني
      required: true
    - name: اسم الشركة
      label: اسم الشركة
      type: نص
      required: true
    - name: نوع المشتري
      label: نوع المشتري
      type: يختار
      required: true
    - name: نوع المشروع
      label: نوع المشروع
      type: يختار
      required: true
      options:
        - أسطول منتجع / فندق
        - أسطول تأجير
        - أسطول إنقاذ / دورية
        - أسطول مركز غوص
        - المشتريات الحكومية
        - علامة خاصة / OEM
        - طلب مخزون للوكيل
        - غير ذلك
    - name: أنواع القوارب
      label: أنواع القوارب المطلوبة
      type: تحديد متعدد
      required: true
      options:
        - قوارب RIB
        - قوارب قابلة للنفخ / زوارق صغيرة
        - ألواح SUP
        - كاياك
        - معدات السلامة
    - name: حجم الأسطول
      label: حجم الأسطول / نطاق الكمية
      type: نص
      required: true
      placeholder: على سبيل المثال، 20-50 وحدة على مدى 12 شهرًا
    - name: المتطلبات المخصصة
