content_challenge:
  tagline: التحدي
  title: متطلبات الطاقة البحرية<br />الموثوقية القصوى للبيئة
  subtitle: تعمل عمليات الطاقة البحرية على دفع المعدات إلى أقصى الحدود — الطقس القاسي، والمواقع النائية، ودورات العمل المستمرة، وعدم التسامح مطلقًا مع الفشل.
  paragraphs:
    - تعمل صناعة الطاقة البحرية (الأوفشور) في أكثر البيئات البحرية تطلباً على وجه الأرض. تدعم قوارب العمل منصات النفط والغاز، وتركيبات توربينات الرياح البحرية، وعمليات الكابلات تحت البحر، ومشاريع البناء البحري — وغالباً في أعالي البحار ضمن نوافذ مناخية محدودة. إن تعطل المعدات ليس مكلفاً فحسب، بل إنه خطير أيضاً.
    - '**السلامة هي الأولوية القصوى** — يجب أن تعمل سفن نقل الأطقم بأمان في حالات بحرية كانت ستوقف أي عمليات أخرى. الاستقرار عند نقطة النقل، والأداء الموثوق للمحركات في جميع الأحوال الجوية، والبناء المتين للرسو المتكرر على المنشآت البحرية — كلها متطلبات إلزامية.'
    - '**قدرة جميع الأحوال الجوية أمر أساسي** — تعمل مزارع الرياح البحرية ومنصات النفط على مدار العام. يجب أن تؤدي قوارب العمل في البحار الهائجة والرياح القوية وضيق الرؤية. تتطلب العمليات الليلية والنهارية أطقم ملاحة كاملة وأنظمة إضاءة موثوقة.'
    - '**قطاع طاقة الرياح البحرية ينمو بسرعة** — يتم تركيب آلاف التوربينات الجديدة حول العالم، ويتطلب كل منها نقلاً منتظماً للأطقم ونقل المعدات ودعم الصيانة. هذا يخلق طلباً مستمراً على سفن نقل الأطقم (CTV) وقوارب RIB الداعمة المخصصة لهذا الغرض.'
    - صُممت قوارب RIB لطاقة البحر من Paddle Board Overstock ببدنات deep-V معززة، وأنابيب Hypalon عالية التحمل، وأطقم ملاحة كاملة، وأنظمة سلامة مصممة للظروف القاسية لعمليات الطاقة البحرية.
content_solution:
  tagline: الحل لدينا
  title: أضلاع ضلعية خارجية مصممة خصيصًا لهذا الغرض<br />لصناعة الطاقة
  subtitle: تم تصميم كل وحدة RIB للطاقة البحرية في Paddle Board Overstock من أجل التشغيل الآمن والموثوق في الظروف البحرية القاسية - من بحر الشمال إلى جنوب شرق آسيا.
  list:
    - بدن deep-V معزز للأداء في المياه الهائجة والتعامل القابل للتنبؤ
    - أنابيب Hypalon عالية التحمل مقاومة للأشعة فوق البنفسجية والمواد الكيميائية لخدمة بحرية ممتدة
    - تجهيزات من الفولاذ المقاوم للصدأ 316 — لا صدأ مع التعرض المستمر لمياه البحر
    - 'طقم ملاحة كامل: GPS ورادار وVHF وأضواء ملاحة ليلية — قياسي في الطرازات البحرية'
    - سطح سفينة ذاتي التفريغ لتشغيل آمن في ظروف الأمواج المتلاطمة
    - تكوينات محركات متعددة — محرك خارجي مفرد أو مزدوج لتكرار المهمة
    - سارية قطر وحلقات تثبيت عالية التحمل للتعامل مع المنصات والعوامات
    - ألوان أنابيب عالية الوضوح للتعرف عليها في مواقع العمل البحرية
content_segments:
  tagline: ملفات تعريف الطاقة
  title: حلول الطاقة البحرية<br />حسب نوع التطبيق
  subtitle: تتمتع قطاعات الطاقة البحرية المختلفة بمتطلبات فريدة من نوعها لقوارب العمل - بدءًا من RIBs لدعم المنصات وحتى CTVs في مزارع الرياح إلى سفن التفتيش تحت سطح البحر.
  items:
    - title: دعم منصات النفط والغاز البحرية
      subtitle: نقل الطاقم، توريد المعدات، الاستعداد لسلامة المنصة
      description: تتطلب منصات النفط والغاز تغييرًا يوميًا للطاقم، ونقل المعدات والإمدادات، وتغطية الاستعداد للسلامة. يجب أن تعمل قوارب العمل بأمان حول هياكل المنصات، في التيارات القوية وحالات البحر المتغيرة، وأن تحافظ على دقة المحطات أثناء نقل الأفراد عبر السلم أو الممر. تتطلب البيئة القاسية - الهيدروكربونات والمواد الكيميائية ورذاذ الملح المستمر - إنشاءات مقاومة للتآكل وأداءً موثوقًا.
      features:
        - تهيئة نقل الأطقم مع صعود آمن ومساكات يد
        - أنابيب Hypalon مقاومة للصدأ وتجهيزات من الفولاذ المقاوم للصدأ 316
        - أحزمة احتكاك معززة للملامسة المتكررة مع واقيات المنصة
        - سطح سفينة ذاتي التفريغ للمياه الزيتية والغسل الكيميائي
        - خزان وقود عالي السعة لمدى تشغيلي بحري موسع
        - خيار المحرك المزدوج لتكرار حرج للمهمة
    - title: عمليات مزرعة الرياح البحرية
      subtitle: نقل الطاقم، صيانة التوربينات، نقل الأدوات
      description: تعتبر طاقة الرياح البحرية القطاع الأسرع نمواً في مجال الطاقة البحرية. يحتاج المشغلون إلى سفن نقل الطاقم (CTVs) التي يمكنها نقل الفنيين بأمان إلى منصات الوصول إلى التوربينات في الحالات البحرية التي يصل ارتفاع الأمواج فيها إلى 1.5 متر. يعد الاستقرار أثناء النقل والقدرة على التعامل مع جميع الأحوال الجوية والتشغيل اليومي الموثوق أمرًا بالغ الأهمية. تعمل سفن خدمة مزرعة الرياح وفق جداول زمنية ضيقة - أي توقف عن العمل يؤدي إلى تأخير تشغيل التوربينات أو صيانتها، مما يؤثر بشكل مباشر على إيرادات إنتاج الطاقة.
      features:
        - شكل بدن محسّن لنقل ثابت للأطقم عند قاعدة التوربين
        - دخول deep-V لرحلة مريحة في موج البحر وتلاطم الأمواج البحرية
        - حماية مناخية كاملة — كنسول مغلق أو غرفة قيادة لراحة الطاقم
        - مساحة سطح للمعدات وقطع الغيار وأجهزة الخدمة
        - حزمة العمليات الليلية لنوبات الشتاء المحدودة بساعات النهار
        - تشغيل هادئ للمحرك الخارجي لأقل تأثير ضوضائي على البيئة البحرية
    - title: دعم الكابلات البحرية وخطوط الأنابيب
      subtitle: التفتيش والصيانة ودعم ROV والمسح
      description: يحتاج مشغلو الكابلات وخطوط الأنابيب تحت سطح البحر إلى قوارب عمل لفحص الطريق، ودعم الصيانة، وعمليات المركبات ROV، ومهام المسح. تتطلب هذه السفن منصات مستقرة لنشر واستعادة المعدات تحت الماء، ومناورة دقيقة لتتبع الكابلات، وتشغيل موثوق في البيئات الساحلية والبحرية. يعد استقرار القارب أمرًا بالغ الأهمية لدقة أجهزة السونار والمسح.
      features:
        - منصة مستقرة عند السرعة المنخفضة لتتبع الكابلات وعمليات المسح
        - تخطيط سطح مفتوح لنشر مركبات ROV وبكرات الكابلات ومعدات المسح
        - صفائح تثبيت للمعدات للسونار وGPS وأجهزة المسح
        - تصميم بدن بأثر موجي منخفض لأقل تأثير على قاع البحر أثناء التفتيش
        - مناورة دقيقة عند السرعة المنخفضة مع توجيه خارجي مستجيب
    - title: الهندسة البحرية ودعم البناء
      subtitle: نقل الأفراد، وتوريد المواد، ودعم الغوص
      description: يحتاج مقاولو الهندسة البحرية الذين يعملون في بناء الموانئ، وحماية السواحل، ومشاريع التركيب البحرية إلى قوارب عمل متعددة الاستخدامات لنقل الأفراد بين سفن البناء والشاطئ، وتوريد المواد والأدوات، ودعم الغوص، ومسوحات الموقع. تعمل هذه القوارب في مناطق البناء النشطة مع سفن متعددة، ومساحة مناورة محدودة، وظروف بحرية متغيرة. المتانة والتنوع أمر بالغ الأهمية.
      features:
        - تخطيط سطح متعدد الأغراض للأفراد والمواد ومعدات الغوص
        - سلم غوص ومثبتات معدات لعمليات دعم الغوص
        - حلقات تثبيت عالية التحمل وسارية قطر للمناورة في مواقع البناء
        - بناء Hypalon متين يقاوم مخلفات البناء والاحتكاك
        - تكوينات مقاعد مرنة — وضع نقل الأطقم أو وضع الشحن
