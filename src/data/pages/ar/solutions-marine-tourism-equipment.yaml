content_challenge:
  tagline: التحدي
  title: متطلبات السياحة البحرية<br />سفن موثوقة وجاهزة لنقل الركاب
  subtitle: يحتاج مشغلو السياحة إلى قوارب يمكنها التعامل مع عمليات النقل اليومية للركاب، وظروف البحر المتغيرة، وتوقعات عالية للضيوف - مع الحفاظ على صيانة منخفضة والعمليات مربحة.
  paragraphs:
    - يقوم مشغلو السياحة في الجزر في وجهات مثل جزر المالديف والفلبين وإندونيسيا وتايلاند بتشغيل عمليات نقل الركاب يوميًا ورحلات الغطس والرحلات البحرية. تعمل قواربهم لأكثر من 300 يوم سنويًا في بيئات المياه المالحة مع الحد الأدنى من فترات التوقف عن العمل للصيانة.
    - '**تتطلب رحلات النقل بين الجزر** نقلًا سريعًا ومريحًا للركاب بين المنتجعات والمطارات ومواقع الغوص. يتوقع الركاب قيادة سلسة، وسهولة الصعود إلى الطائرة، والحماية من أشعة الشمس والرذاذ. يؤثر القارب البطيء أو غير المريح بشكل مباشر على رضا الضيوف وتكرار الحجوزات.'
    - '**يحتاج مشغلو **مراقبة الحيتان والدلافين** إلى قوارب يمكنها الوصول إلى الحياة البرية بسرعة، والحفاظ على منصات مشاهدة مستقرة، والعمل بهدوء لتجنب إزعاج الحياة البحرية. تعد السرعة والاستقرار والقدرة على المناورة أمرًا بالغ الأهمية - حيث يتوقع الركاب لقاءات قريبة دون الشعور بدوار البحر.'
    - '**سياحة المغامرات** تنظم شركات **جولات استكشاف ساحلية ورحلات استكشافية في الكهوف وتجارب الحياة البرية البحرية. تبحر قواربهم في بيئات متنوعة - من المحيط المفتوح إلى الخلجان الضحلة - مما يتطلب تصميمات هيكل متعددة الاستخدامات وبنية موثوقة.'
    - في جميع القطاعات، تعد مقاومة التآكل، وكفاءة استهلاك الوقود، وراحة الركاب من أهم الاهتمامات. القارب الذي يتعطل أو يتطلب إصلاحات متكررة يعني خسارة الإيرادات وإلغاء الجولات والسمعة المتضررة.
content_solution:
  tagline: الحل لدينا
  title: أضلاع من الدرجة السياحية ومعدات الأسطول
  subtitle: Paddle Board Overstock توفر كلا من القوارب RIB التجارية لعمليات الركاب ومعدات الأسطول (SUPs، قوارب الكاياك، المطاطية) لبرامج أنشطة المنتجع - كل ذلك من مورد واحد.
  list:
    - أضلاع الركاب التجارية من 4.8 م إلى 8 م - مهيأة للانتقال إلى الجزيرة وجولات الغطس ومشاهدة الحياة البرية
    - مقاعد مريحة مع مساند للظهر ومظلة للشمس — راحة الركاب لمدة جولة تتراوح من ساعة إلى ساعتين
    - شعاع عريض وبدن deep-V لتحقيق الاستقرار - يقلل من دوار البحر ويحسن ثقة الركاب
    - خيارات محرك هادئة لمشاهدة الحياة البرية - الحد الأدنى من الإزعاج للحيوانات البحرية
    - سلم الغوص ومنصة السباحة — ضروريان لرحلات الغطس والسباحة
    - العلامات التجارية المخصصة وأنظمة الألوان - شعار شركتك وأسطول الأسطول على كل سفينة
    - تسعير الأسطول للطلبات بالجملة RIB - مواصفات متسقة عبر عمليات القوارب المتعددة
    - SUP ألواح وزوارق الكاياك والقوارب القابلة للنفخ لبرامج أنشطة الضيوف في المنتجع
    - قطع الغيار ودعم الصيانة - تقليل وقت التوقف عن العمل خلال مواسم الذروة السياحية
content_segments:
  tagline: قطاعات السياحة
  title: حلول السياحة البحرية<br />حسب نوع العملية
  subtitle: تتطلب العمليات السياحية المختلفة تكوينات مختلفة للقوارب. Paddle Board Overstock يطابق RIB الصحيح لتطبيقك المحدد.
  items:
    - title: مشغلي نقل الجزيرة
      subtitle: جزر المالديف، الفلبين، إندونيسيا، تايلاند - نقل يومي للضيوف
      description: يدير مشغلو السياحة في الجزر في جنوب شرق آسيا وجزر المالديف عمليات نقل يومية للركاب بين المطارات والمنتجعات ومواقع الغوص - غالبًا أكثر من 300 يوم في السنة. القارب هو العمود الفقري لتجربة الضيف. الانهيار يعني الضيوف الذين تقطعت بهم السبل، والحجوزات الملغاة، والإضرار بالسمعة. يحتاج هؤلاء المشغلون إلى قوارب تصمد أمام الاستخدام عالي التردد في المواقع النائية حيث يكون دعم الصيانة محدودًا ويصعب الحصول على قطع الغيار.
      features:
        - تم تصنيف البناء من الدرجة التجارية لأكثر من 300 يوم تشغيل سنويًا
        - مقاعد طويلة مريحة مع مساند للظهر تتسع لـ 8 إلى 16 راكبًا
        - T-top أو مظلة بيميني للحماية من الشمس الاستوائية والرذاذ
        - منصة صعود واسعة لتسهيل وصول الضيوف بأمتعتهم
        - حجرات تخزين جافة لحقائب الضيوف ومؤن المنتجع
        - محرك خارجي رباعي الأشواط موفر للوقود — تكلفة تشغيل منخفضة لكل رحلة
        - أنابيب Hypalon شديدة التحمل لمدة 5-8 سنوات في الظروف الاستوائية
        - تصميم سهل الصيانة — مكونات يمكن الوصول إليها لخدمة المواقع البعيدة
    - title: مشغلي مراقبة الحيتان
      subtitle: القدرة البحرية، والسرعة في مناطق المشاهدة، ومنصة مستقرة
      description: تعد مشاهدة الحيتان قطاعًا سياحيًا موسميًا ولكنه عالي القيمة يعمل في مناطق مثل خليج هيرفي (أستراليا)، وكيكورا (نيوزيلندا)، وباجا كاليفورنيا (المكسيك)، وجزر الأزور. يجب على المشغلين الوصول إلى مناطق المشاهدة البحرية بسرعة قبل أن تغوص الحيتان أو تتحرك، والحفاظ على منصة مستقرة لفترات مراقبة ممتدة، والعمل بهدوء لتجنب إزعاج الثدييات البحرية. تؤثر راحة الركاب خلال الجولات التي تستغرق من 2 إلى 4 ساعات بشكل مباشر على التقييمات والحجوزات المتكررة. القارب البطيء أو غير المستقر يعني عدم وجود مشاهدات وجولات مستردة.
      features:
        - تكوينات 7-10 م RIB للقدرة البحرية في المياه المفتوحة
        - محرك خارجي هادئ رباعي الأشواط - الحد الأدنى من الضوضاء وإزعاج الاهتزاز
        - هيكل عميق على شكل حرف V مع ثبات ممتاز أثناء الراحة - منصة مشاهدة مريحة
        - منصة مراقبة القوس مع درابزين لتصوير الضيوف
        - حماية كاملة من الطقس — T-top أو وحدة تحكم مغلقة للظروف البحرية
        - مقاعد مريحة مصممة لتوفير الراحة لمدة 2-4 ساعات
        - مواد من الدرجة البحرية للتعرض للمياه المالحة لفترة طويلة ومقاومة للأشعة فوق البنفسجية
    - title: مشغلي مراقبة الدلافين
      subtitle: مطاردة سريعة، سعة ركاب متعددة، اقتراب هادئ
      description: يحتاج مشغلو مشاهدة الدلافين إلى توازن مختلف في القدرات. الدلافين أسرع وأكثر مرحًا من الحيتان، وتتطلب قوارب يمكنها التسريع بسرعة، والمناورة بدقة، والاقتراب من القرون دون إخافتها. تحمل هذه الجولات عادةً عددًا أكبر من الركاب في كل رحلة وتعمل بالقرب من الشاطئ. يعد التشغيل الهادئ أمرًا بالغ الأهمية - فالدلافين التي اعتادت على المحركات الصاخبة ستتجنب القوارب، مما يقلل من نجاح الرؤية. يحتاج المشغلون أيضًا إلى قوارب موثوقة لجداول الرحلات اليومية المتعددة خلال مواسم الذروة السياحية.
      features:
        - 5.5-8 م RIB للرشاقة والسرعة والوصول إلى المياه الضحلة
        - تسريع سريع للوصول إلى قرون الدلفين النشطة
        - عادم هادئ وبدن منخفض الاهتزاز للاقتراب القريب
        - منصة مستقرة لمشاهدة الضيوف والتصوير الفوتوغرافي
        - سعة ركاب عالية (10-18 شخصًا) لجولات موسم الذروة
        - منطقة جلوس مقوسة لمشاهدة الدلافين بالقرب من المياه
        - مشروع ضحل للعمليات الساحلية والخليجية
    - title: المغامرة والسياحة البيئية
      subtitle: استكشاف السواحل وجولات الكهوف ولقاءات الحياة البرية
      description: يتنقل مشغلو سياحة المغامرات في بيئات متنوعة - معابر المحيط المفتوحة، واستكشاف البحيرات الضحلة، والوصول إلى الكهوف الساحلية، ومواجهات الحياة البرية البحرية. تحتاج قواربهم إلى التنوع للتعامل مع الظروف البحرية المتنوعة، والمتانة لتحمل الاستخدام في المواقع البعيدة، والغاطس الضحل للوصول إلى الخلجان المحمية والأماكن الشاطئية. تعد موثوقية المعدات أمرًا بالغ الأهمية - فقد يؤدي أي عطل في مكان بعيد إلى إفساد الجولة وتعريض الضيوف للخطر.
      features:
        - بدن ذو سحب ضحل للوصول إلى البحيرة والكهف والشاطئ
        - هيكل مقوى وأنابيب Hypalon لمتانة البيئة المختلطة
        - مقاعد مرنة - يمكن إعادة تشكيلها لتناسب أنواع الجولات المختلفة وأحجام المجموعات
        - نقاط تركيب المعدات الخاصة بمعدات التصوير الفوتوغرافي والمعدات المتخصصة
        - إمكانية الهبوط السهل على الشاطئ — حماية معززة للعارضة والأنبوب
        - حماية من الطقس لراحة الضيوف أثناء الجولات الطويلة
    - title: أساطيل أنشطة المنتجع
      subtitle: برامج كاملة للرياضات المائية للضيوف - RIBs وSUPs وقوارب الكاياك والسلامة
      description: تحتاج المنتجعات التي تقدم الرياضات المائية كجزء من تجربة الضيوف إلى أسطول يوازن بين التنوع والمتانة وعرض العلامة التجارية. يشتمل الأسطول عادةً على RIBs لرحلات الضيوف وانتقالاتهم، وSUPs وزوارق الكاياك للاستكشاف الذاتي، والقوارب القابلة للنفخ لجولات الغطس الجماعية. تتطلب إدارة أنواع المعدات المختلطة عبر أعداد الضيوف الموسمية جودة متسقة وسهولة الصيانة وعلامة تجارية موحدة. يؤثر تعطل المعدات أو تهالكها بشكل مباشر على تقييمات الضيوف وإيراداتهم.
      features:
        - RIB عطاءات لرحلات الضيوف والانتقالات ورحلات الغطس
        - SUP ألواح وقوارب الكاياك لأنشطة الضيوف ذاتية التوجيه
        - قوارب قابلة للنفخ للجولات الجماعية والغطس من الشاطئ إلى الشعاب المرجانية
        - علامة تجارية مخصصة بالكامل على جميع المعدات — عرض تقديمي موحد للمنتجع
        - 'مجموعة معدات السلامة: PFDs، صفارات، الإسعافات الأولية، خطوط العوامات'
        - مواد تدريب الموظفين للتعامل مع المعدات وسلامة الضيوف
