  title: معايير السلامة والشهادات
  subtitle: يخضع كل منتج من Aquafarer لاختبارات صارمة، ويستوفي 64 طرازًا معتمدًا من CE معايير السلامة الدولية للاستخدام الترفيهي والمهني. مصنع معتمد ISO 9001.
