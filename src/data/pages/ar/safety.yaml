certifications:
  - title: شهادة CE (الاتحاد الأوروبي 2016/425)
    standard: لائحة معدات الحماية الشخصية (الاتحاد الأوروبي) 2016/425 | EN ISO 12402
    description: تتوافق جميع معدات السلامة من Aquafarer مع متطلبات علامة CE بموجب لائحة الاتحاد الأوروبي لمعدات الحماية الشخصية. يخضع كل منتج لاختبارات مستقلة من TÜV Rheinland، وهي جهة إخطار أوروبية. تستوفي قواربنا القابلة للنفخ وقوارب RIB متطلبات الفئتين C وD من توجيه القوارب الترفيهية 2013/53/EU (RCD).
    body: تغطي شهادة CE المتطلبات الأساسية للصحة والسلامة لأجهزة الطفو الشخصية والقوارب القابلة للنفخ. تقوم TÜV Rheinland بتدقيق منشأة الإنتاج لدينا سنويًا للتحقق من الاستمرار في الامتثال.
  - title: SOLAS — السلامة في البحر
    standard: الفصل الثالث من SOLAS | مدونة LSA
    description: يستوفي Life Vest Pro لوائح SOLAS للعمليات البحرية التجارية والبعيدة عن الساحل. تم اختباره للاحتفاظ بالطافوية لمدة 24 ساعة، والانتفاخ التلقائي عند الغمر، والأداء في حالات بحرية تصل إلى قوة 5. يستوفي متطلبات الفصل الثالث لسترات النجاة على السفن التجارية.
    body: يتطلب اعتماد SOLAS اختبارات مستقلة من جهة إخطار للطافوية والمتانة والرؤية والتفعيل التلقائي. يحمل Life Vest Pro اعتماد نوع SOLAS كاملًا مع شهادة MED.
  - title: USCG نوع III / نوع V
    standard: 46 CFR الجزء 160 | اعتماد USCG
    description: تستوفي سترات النجاة المختارة من Aquafarer تصنيف خفر سواحل الولايات المتحدة لأجهزة النوع III (مساعد الطفو) والنوع V (الاستخدام الخاص). مناسبة للمياه المحمية والإبحار الساحلي والعمليات التجارية التي تتطلب PFD معتمدة من USCG.
    body: يتطلب اعتماد USCG اختبارات من مختبر مستقل معترف به من خفر السواحل. يشمل اعتماد النوع V تصميمات نفخ هجينة تتطلب تفعيلًا يدويًا أو تلقائيًا.
  - title: الامتثال الاجتماعي BSCI
    standard: مدونة قواعد السلوك amfori BSCI
    description: تخضع مصنعنا لتدقيق سنوي بموجب مبادرة الامتثال الاجتماعي للأعمال (BSCI) من amfori. يتحقق ذلك من ممارسات العمل الأخلاقية وسلامة مكان العمل وساعات العمل العادلة والإدارة البيئية في منشأة الإنتاج التي تبلغ مساحتها 12,000 م².
    body: الامتثال لـ BSCI شرط مسبق لتجار التجزئة والمستوردين الأوروبيين. تقييم BSCI الحالي لدينا هو "C" (جيد)، بتدقيق من SGS.
  - title: الامتثال لـ REACH وRoHS
    standard: لائحة REACH للاتحاد الأوروبي (EC) 1907/2006 | توجيه RoHS 2011/65/EU
    description: تتوافق جميع مركبات PVC واللواصق والطلاءات المستخدمة في منتجات Aquafarer مع لوائح السلامة الكيميائية REACH الأوروبية وقيود المواد الخطرة RoHS. تتوفر أوراق بيانات سلامة المواد (MSDS) لكل خط منتجات.
    body: يضمن الامتثال لـ REACH عدم وجود مواد SVHC المقيدة فوق الحدود المسموحة. تتحقق الاختبارات المخبرية المنتظمة من أطراف ثالثة من الاستمرار في الامتثال لكل دفعة إنتاج.
  - title: إدارة الجودة ISO 9001:2015
    standard: ISO 9001:2015 | معتمد من TÜV Rheinland
    description: نظام إدارة الجودة لدينا معتمد وفق ISO 9001:2015 من TÜV Rheinland، ويغطي التصميم والإنتاج والاختبار وخدمة ما بعد البيع. تضمن التدقيقات الرقابية السنوية التحسين المستمر وضبط العمليات.
    body: يتطلب اعتماد ISO 9001 سياسات جودة موثقة وتدقيقات داخلية ومراجعات إدارية وإجراءات تصحيحية وسجلات إنتاج قابلة للتتبع.
testimonial:
  quote: لقد تعاقدنا مع عدة موردين لمعدات السلامة في جميع أنحاء آسيا. Aquafarer هي الشركة المصنعة الوحيدة التي قدمت وثائق CE الكاملة وشهادات SOLAS وتقارير اختبارات الأطراف الثالثة مسبقًا — دون أن نطلب ذلك.
  author: Erik Lindström
  title: مسؤول السلامة
  company: Baltic Marine Supply
  location: فنلندا
content_overpressure:
  tagline: سلامة الضغط الزائد
  title: إدارة ضغط أنابيب RIB<br />في المناخات الحارة
  subtitle: ترتفع ضغوط الأنابيب القابلة للنفخ مع درجة الحرارة. فهم إدارة الضغط الزائد والتحكم فيه يمنع التلف ويضمن تشغيلًا آمنًا في البيئات الاستوائية والصحراوية.
  items:
    - title: صمامات تخفيف ضغط Boyle
      description: مجهزة أنابيب RIB من Aquafarer بصمامات تخفيف الضغط الزائد التي تفرغ تلقائيًا الضغط الزائد فوق الحد الأقصى المقدر. يمنع ذلك إجهاد اللحامات وانفجار الأنبوب المحتمل بسبب التسخين الشمسي.
      icon: tabler:gauge
    - title: تغير الضغط من الصباح إلى الظهيرة
      description: قد يصل أنبوب منفوخ إلى 3.5 PSI عند 20 درجة مئوية إلى 4.5+ PSI عند التعرض للشمس عند 40 درجة مئوية. انفخ دائمًا إلى الحد الأدنى من النطاق الموصى به في المناخات الحارة ودع صمام التخفيف يدير الضغط الزائد.
      icon: tabler:sun
    - title: ضغوط التشغيل الموصى بها
      description: 'أنابيب PVC: تشغيل 3.0-3.5 PSI، بحد أقصى 4.5 PSI. أنابيب Hypalon: تشغيل 3.5-4.0 PSI، بحد أقصى 5.0 PSI. اختبر دائمًا عند 1.25x المقدر (4.4 PSI لـ PVC، 5.0 PSI لـ Hypalon) وفق معايير QC لـ Aquafarer.'
      icon: tabler:chart-bar
    - title: أفضل ممارسات التعرض للشمس
      description: خزن قوارب RIB في مناطق مظللة عند عدم الاستخدام. استخدم أغطية واقية من الأشعة فوق البنفسجية للرسو لفترات طويلة. تحقق من ضغط الأنبوب واضبطه قبل وبعد ساعات الذروة الشمسية. لا تتجاوز أبدًا الضغط الأقصى المقدر.
      icon: tabler:umbrella
    - title: خفض الضغط في حالات الطوارئ
      description: إذا شعرت بأن الأنبوب صلب جدًا أو كان صمام التخفيف يفرغ الهواء، حرر الهواء عبر صمام Halkey-Roberts أو الصمام العسكري حتى يعود الضغط إلى نطاق التشغيل. احمل مقياس ضغط للحصول على قراءات دقيقة.
      icon: tabler:alert-circle
