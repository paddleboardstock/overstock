qc_section:
  tagline: مراقبة الجودة
  title: عملية الاختبار وضمان الجودة
  subtitle: كل لوحة تخضع لاختبارات إلزامية قبل الشحن. مختبر الجودة لدينا يعمل بشكل مستقل عن الإنتاج ويرفع تقاريره مباشرة للإدارة.
  steps:
    - step: '1'
      title: تفتيش المواد الخام
      desc: تخضع أقمشة PVC و drop-stitch لاختبارات الشد، وانتشار التمزق، والتحقق من مقاومة UV قبل دخول أي دفعة للإنتاج.
    - step: '2'
      title: اختبار احتفاظ الهواء لمدة 48 ساعة
      desc: يتم نفخ كل غرفة لوح إلى 125٪ من الضغط المصنف ويتم الاحتفاظ بها لمدة 48 ساعة. انخفاض الضغط الذي يتجاوز 5٪ يؤدي إلى الرفض التلقائي وإعادة فحص الدرز.
    - step: '3'
      title: اختبار الحمل والتوازن
      desc: يتم تحميل الألواح المكتملة إلى أقصى قدرة مصنفة واختبار الاستقرار، والحرارة، والتحكم. يتم اختبار كل لوحة بالماء قبل الفحص النهائي.
faq_section:
  tagline: الأسئلة الشائعة
  title: الأسئلة الشائعة
  questions:
    - q: أين تصنع ألواح المجداف الخاصة بكم؟
      a: كل لوحة تصنع في مصنعنا الخاص الذي تبلغ مساحته 12,000 متر مربع في ويهاي، الصين. نحن لا نقوم بالتعهيد الخارجي — التصميم، المواد، اللحام، التجميع، والاختبار كلها تتم تحت سقف واحد، لذا الجودة لا تعتمد أبدا على طرف ثالث.
    - q: كيف أسعاركم أقل بكثير من أسعار التجزئة؟
      a: نحن نبيع كميات زائدة من المصنع ودفعات التصفية مباشرة من منشأتنا الإنتاجية الخاصة — بدون وسطاء، ولا هامش ربح للبيع بالتجزئة. وهذا يعني SUP حزم كاملة بخصم يصل إلى 60٪ من أسعار التجزئة النموذجية، بنفس الجودة التي تم اختبارها بالضغط.
    - q: ما الذي يتضمنه اللوح؟
      a: 'كل SUP شحن كحزمة كاملة: لوح، حقيبة سفر، مضخة يدوية، مجداف قابل للتعديل، زعنفة قابلة للإزالة، طوق ملفوف، وعدة إصلاح.'
    - q: ما مدى سرعة شحن الطلبات؟
      a: تغادر الطلبات المتوفرة في المخزون مصنعنا في ويهاي خلال يومين إلى ثلاثة أيام عمل، مع توصيل متتبع إلى 50+ دولة عبر الاتحاد الأوروبي وأمريكا الشمالية وآسيا والمحيط الهادئ وما بعدها.
production_flow:
  tagline: تدفق الإنتاج
  title: من المادة إلى اللوح النهائي
  subtitle: كل لوحة تمر بست مراحل إنتاج مع نقاط مراقبة جودة في كل خطوة. لا طرق مختصرة، ولا تفتيشات متجاوزة.
  stages:
    - stage: '01'
      title: استلام المواد ومراقبة الجودة الواردة
      description: جميع المواد الواردة يتم تسجيلها حسب رقم الدفعة/الدفعة في ERP نظامنا.PVC يتم عزل لفائف الأقمشة، drop-stitch والنوى، والصمامات، واللاصقات، والأجهزة حتى انتهاء الموافقة على مراقبة الجودة.
      qc_check: قوة الشد، مقاومة التمزق، مقياس السمك، لزوجة اللاصق، مسح العيوب البصرية
      qc_threshold: تم اختبار 100% من الدفعات. ارفض إذا كان الشد أقل من 90% من المواصفات، أو التمزق < الحد الأدنى للمواصفات، أو أي عيب بصري
      responsibility: فريق مراقبة الجودة الوارد (3 مفتشين)
    - stage: '02'
      title: CNC القطع وتحضير المواد
      description: يقوم التعشيش المحسّن بالكمبيوتر بوضع الألواح على مخزون PVC لتقليل النفايات. تحافظ آلات القطع الأوتوماتيكية CNC على دقة موضعية تبلغ 0.1 مم.
      qc_check: فحص الأبعاد مقابل ملفات CAD DXF، وفحص جودة الحافة، والتحقق من عدد اللوحات
      qc_threshold: تم قياس كل لوحة 20. التسامح ± 0.5 ملم. رفض الدفعة إذا كان > 2% من التسامح
      responsibility: ورشة قطع الرصاص
    - stage: '03'
      title: اللحام Drop-Stitch والربط
      description: Drop-stitch تربط النوى PVC بالطبقات الخارجية باستخدام التغليف الحراري. حجرات الأنابيب ملحومة بالترددات الراديوية أو ملحومة بالهواء الساخن. أشرطة السكك الحديدية مرتبطة بثلاث طبقات بنظام الاندماج.
      qc_check: اختبار التقشير كل 50 وحدة، قياس عرض اللحام، مراجعة سجل درجة حرارة الهواء الساخن، فحص الدرزات البصرية تحت الإضاءة الخلفية
      qc_threshold: قوة التقشير لا تقل عن 8 ن/سم. التسامح مع عرض اللحام ± 1 مم. أي توجيه مرئي = رفض
      responsibility: مراقبة جودة اللحام (2 مفتشين لكل نوبة عمل)
    - stage: '04'
      title: التجميع والتركيب
      description: 'تنتقل الألواح إلى التجميع النهائي حيث يتم تركيب جميع المكونات: تركيب الصمامات، حلقات D، المقابض، صناديق الزعانف، وتركيب حقيبة الحمل. تتبع كل وحدة قائمة تحقق مكونة من 100 نقطة.'
      qc_check: تسجيل الخروج من قائمة التحقق المكونة من 100 نقطة لكل وحدة، واختبار وظيفة الصمام (10 دورات فتح/إغلاق)، والتحقق من عزم دوران الأجهزة، والفحص البصري
      qc_threshold: سياسة عدم وجود عيوب على العناصر الحرجة للسلامة (الصمامات، حلقات D، المقابض). العيوب التجميلية الطفيفة ضمن حدود تجميلية صارمة.
      responsibility: قيادة فريق التجميع + خط مراقبة الجودة
    - stage: '05'
      title: اختبار الضغط وعقد الجودة
      description: يتم نفخ كل غرفة إلى 1.25× الضغط المصنف (عادة 20–25 PSI) وتُحافظ لمدة 24–48 ساعة. تسجل حساسات الضغط بشكل مستمر. الغرف التي تتجاوز هبوط الضغط فيها 5% يتم رفضها وإرسالها لإعادة فحص اللحامات.
      qc_check: سجل تثبيت الضغط لمدة 24 ساعة، والتحقق من معايرة المستشعر يوميًا، وقراءة الضغط المعوض لدرجة الحرارة، وإعادة اختبار التماس بعد الإصلاح
      qc_threshold: الحد الأقصى لانخفاض الضغط بنسبة 5% على مدار 24 ساعة عند درجة حرارة مستقرة. أي غرفة تتجاوز هذا = إعادة اختبار 100% لدفعة الإنتاج بأكملها
      responsibility: مختبر الجودة (مستقل عن الإنتاج، يقدم تقاريره إلى الإدارة)
    - stage: '06'
      title: التفتيش النهائي والتعبئة
      description: الفحص البصري والوظيفي النهائي. عيوب السطح، واتساق الألوان، والتحقق من الملصق/صندوق التعريف، وسلامة التغليف، واكتمال الملحقات. يتم تعبئة الوحدات بالتفريغ، وصناديقها، ومنصات تحميلها لتحميل الحاويات.
      qc_check: الفحص البصري الكامل، وقائمة مراجعة الملحقات لكل SKU، واختبار سقوط العبوة (1 متر، عينة عشوائية)، والتحقق من المسح الضوئي للملصق/الرمز الشريطي
      qc_threshold: عدم التسامح مع عيوب السلامة. العيوب التجميلية ضمن حدود صارمة. يتم فحص 100% من الوحدات بصريًا.
      responsibility: فريق مراقبة الجودة النهائي (4 مفتشين) + قائد فريق التعبئة
