workshops_section:
  tagline: ورش العمل
  title: ورش التصنيع
  workshops:
    - title: تقطيع PVC وتحضير المواد
      description: آلات تقطيع CNC تلقائية تعالج أقمشة PVC وdrop-stitch بدقة دون ملليمتر. يقلل الترتيب المثالي المحوسب من نفايات المواد ويضمن أن كل لوحة تفي بالمواصفات البعدية قبل اللحام.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: اللحام والختم الحراري
      description: ورشة لحام مخصصة مزودة بماكينات الختم الحراري ومكابس العزل الكهربي بترددات الراديو. اللحامات بالهواء الساخن تربط وتلحم رقائق drop-stitch الأساسية وأشرطة القضبان، بينما تولد اللحامات بترددات الراديو دروزًا محكمة وعالية القوة.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: فن الجناح و EVA التشطيب
      description: 'تتشكل مجموعات الزلاجات الفنية هنا: يتم وضع لوحات الفوم المقطوعة بدقة EVA في أنماط الزلاجات الكاملة، وتُلتصق وتُقَطع يدوياً للحصول على لمسة نهائية متينة ومريحة ومقاومة للانزلاق — المظهر المميز لكل لوح من سلسلة الفن.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP الطباعة والزخرفة
      description: يتم تزيين الألواح باستخدام الطباعة الرقمية للرسومات الملونة بالكامل والطباعة بالشاشة للشعارات والأنماط المتكررة. تنتج الطابعات الرقمية تصاميم لسطح اللوح بجودة الصور، بينما توفر الطباعة بالشاشة علامات تجارية زاهية ودائمة.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: التجميع النهائي والتركيب
      description: خط التجميع حيث تتلقى الألواح صماماتها، وحلقات D، والمقابض، والزعانف، وموصلات الحبل. تتبع كل لوحة قائمة تحقق من التجميع مكونة من 100 نقطة يتم توقيعها من قبل قائد الفريق.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: اختبار الجودة والتفتيش
      description: كل لوحة مكتملة تخضع لاختبار الاحتفاظ بالهواء الإلزامي، والتحقق من تقشير اللحامات، وفحص كامل للأنظمة قبل الشحن. يعمل مختبر الجودة لدينا بشكل مستقل عن الإنتاج ويرفع تقاريره مباشرة للإدارة.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
