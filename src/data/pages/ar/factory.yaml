production_flow:
  tagline: عملية الإنتاج
  title: من المواد إلى القارب النهائي
  subtitle: يمر كل قارب عبر 6 مراحل إنتاج مع نقاط تفتيش لمراقبة الجودة في كل خطوة. لا توجد اختصارات، لا عمليات التفتيش التي تم تخطيها.
  stages:
    - stage: '01'
      title: استلام المواد ومراقبة الجودة الواردة
      description: يتم تسجيل جميع المواد الواردة برقم الدفعة/الدفعة في نظام تخطيط موارد المؤسسات (ERP) الخاص بنا. PVC يتم عزل لفات القماش ونوى الغرز المتدلية والصمامات والمواد اللاصقة والأجهزة حتى تسجيل خروج مراقبة الجودة.
      qc_check: قوة الشد (ASTM D751)، مقاومة التمزق (ISO 4674)، مقياس السمك، لزوجة المادة اللاصقة، فحص العيوب البصرية
      qc_threshold: تم اختبار 100% من الدفعات. ارفض إذا كان الشد أقل من 90% من المواصفات، أو التمزق < الحد الأدنى للمواصفات، أو أي عيب بصري
      responsibility: فريق مراقبة الجودة الوارد (3 مفتشين)
    - stage: '02'
      title: القطع باستخدام الحاسب الآلي وإعداد المواد
      description: يقوم التعشيش المحسّن بالكمبيوتر بوضع الألواح على مخزون PVC لتقليل النفايات. تحافظ آلات القطع الأوتوماتيكية CNC على دقة موضعية تبلغ 0.1 مم.
      qc_check: فحص الأبعاد مقابل ملفات CAD DXF، وفحص جودة الحافة، والتحقق من عدد اللوحات
      qc_threshold: تم قياس كل لوحة 20. التسامح ± 0.5 ملم. رفض الدفعة إذا كان > 2% من التسامح
      responsibility: ورشة قطع الرصاص
    - stage: '03'
      title: اللحام وربط الغرز المتساقطة
      description: يتم ربط قلوب الغرز المتدلية بالصفائح الخارجية PVC باستخدام التصفيح الحراري. غرف الأنبوب ملحومة بالترددات اللاسلكية أو ملحومة بالهواء الساخن. أشرطة السكك الحديدية عبارة عن اندماج ثلاثي الطبقات.
      qc_check: اختبار التقشير كل 50 وحدة (ASTM D751)، قياس عرض اللحام، مراجعة سجل درجة حرارة الهواء الساخن، فحص التماس البصري تحت الإضاءة الخلفية
      qc_threshold: قوة التقشير لا تقل عن 8 ن/سم. التسامح مع عرض اللحام ± 1 مم. أي توجيه مرئي = رفض
      responsibility: مراقبة جودة اللحام (2 مفتشين لكل نوبة عمل)
    - stage: '04'
      title: التجميع والتجهيز
      description: 'تنتقل القوارب إلى التجميع النهائي حيث يتم تزاوج جميع المكونات: الهيكل + الأنابيب، والصمامات المثبتة، والحلقات على شكل حرف D، والمقابض، وصناديق الزعانف، وتركيبات حقيبة الحمل. تتبع كل وحدة قائمة مرجعية للتجميع مكونة من 100 نقطة.'
      qc_check: تسجيل الخروج من قائمة التحقق المكونة من 100 نقطة لكل وحدة، واختبار وظيفة الصمام (10 دورات فتح/إغلاق)، والتحقق من عزم دوران الأجهزة، والفحص البصري
      qc_threshold: 'سياسة عدم وجود عيوب في العناصر الهامة للسلامة (الصمامات والحلقات على شكل حرف D والمقابض). مستحضرات تجميل ثانوية: AQL 2.5 (ISO 2859)'
      responsibility: قيادة فريق التجميع + خط مراقبة الجودة
    - stage: '05'
      title: اختبار الضغط وعقد الجودة
      description: يتم نفخ كل غرفة إلى ضغط مقنن 1.25 × (عادةً 20-25 رطل لكل بوصة مربعة) ويتم الاحتفاظ بها لمدة 24-48 ساعة. تقوم أجهزة استشعار الضغط بالتسجيل بشكل مستمر. يتم رفض الغرف التي يزيد فيها انخفاض الضغط عن 5% ويتم إرسالها لإعادة فحص التماس.
      qc_check: سجل تثبيت الضغط لمدة 24 ساعة، والتحقق من معايرة المستشعر يوميًا، وقراءة الضغط المعوض لدرجة الحرارة، وإعادة اختبار التماس بعد الإصلاح
      qc_threshold: الحد الأقصى لانخفاض الضغط بنسبة 5% على مدار 24 ساعة عند درجة حرارة مستقرة. أي غرفة تتجاوز هذا = إعادة اختبار 100% لدفعة الإنتاج بأكملها
      responsibility: مختبر الجودة (مستقل عن الإنتاج، يقدم تقاريره إلى الإدارة)
    - stage: '06'
      title: التفتيش النهائي والتعبئة
      description: الفحص البصري والوظيفي النهائي. عيوب السطح، واتساق الألوان، والتحقق من الملصق/صندوق التعريف، وسلامة التغليف، واكتمال الملحقات. يتم تعبئة الوحدات بالتفريغ، وصناديقها، ومنصات تحميلها لتحميل الحاويات.
      qc_check: الفحص البصري الكامل، وقائمة مراجعة الملحقات لكل SKU، واختبار سقوط العبوة (1 متر، عينة عشوائية)، والتحقق من المسح الضوئي للملصق/الرمز الشريطي
      qc_threshold: AQL 2.5 للعيوب الكبيرة، AQL 4.0 للعيوب البسيطة. عدم التسامح مطلقًا مع عيوب السلامة. تم فحص 100% من الوحدات بصريًا
      responsibility: فريق مراقبة الجودة النهائي (4 مفتشين) + قائد فريق التعبئة
