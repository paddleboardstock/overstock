  tagline: مراقبة الجودة
  title: عملية الاختبار وضمان الجودة
  description: كل لوحة تخضع لاختبارات إلزامية قبل الشحن. مختبر الجودة لدينا يعمل بشكل مستقل عن الإنتاج ويرفع تقاريره مباشرة للإدارة.
  steps:
    - title: تفتيش المواد الخام
      desc: تخضع أقمشة PVC و drop-stitch لاختبارات الشد، وانتشار التمزق، والتحقق من مقاومة UV قبل دخول أي دفعة للإنتاج.
    - title: اختبار احتفاظ الهواء لمدة 48 ساعة
      desc: يتم نفخ كل غرفة لوح إلى 125٪ من الضغط المصنف ويتم الاحتفاظ بها لمدة 48 ساعة. انخفاض الضغط الذي يتجاوز 5٪ يؤدي إلى الرفض التلقائي وإعادة فحص الدرز.
    - title: اختبار الحمل والتوازن
      desc: يتم تحميل الألواح المكتملة إلى أقصى قدرة مصنفة واختبار الاستقرار، والحرارة، والتحكم. يتم اختبار كل لوحة بالماء قبل الفحص النهائي.
