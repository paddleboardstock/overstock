hero:
  tagline: المصنع
  title: المصنع والتصنيع
  subtitle: 12,000 م² من التصنيع المتكامل — من المواد الخام إلى اللوحة النهائية
intro:
  - باعتباره العلامة التجارية للمصنع في **Paddle Board Overstock مركز تصنيع ويهاي**، Paddle Board Overstock تتحكم في كل مرحلة من مراحل الإنتاج — من وصول المواد الخام PVC وdrop-stitch إلى الفحص النهائي قبل التسليم للوحة النهائية. تمتد منشأتنا التصنيعية في منطقة التطوير الاقتصادي في ويهاي على مساحة 12,000 متر مربع وتضم ورش عمل مخصصة لتقطيع PVC، الختم الحراري واللحام، إنهاء فنون اللوحات، التجميع النهائي، واختبار الجودة.
  - من خلال دمج التصميم والهندسة والنماذج الأولية والتصنيع والاختبار تحت سقف واحد، نحن نقضي على عدم الكفاءة في التصنيع التعاقدي ونحافظ على السيطرة المباشرة على جودة التصنيع واختيار المواد والجداول الزمنية للتسليم. كل لوحة تخرج من ورشتنا تم بناؤها بواسطة موظفينا، على معداتنا، وفقًا لمعاييرنا.
