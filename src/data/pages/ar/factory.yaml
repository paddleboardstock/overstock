hero:
  tagline: مصنع
  title: المصنع والتصنيع
  subtitle: 12,000 m2 من التصنيع المتكامل — من المواد الخام إلى قارب مكتمل
intro:
  - بصفتها علامة تجارية تابعة لمصنع **Paddle Board Overstock Qingdao Manufacturing Hub**، تتحكم أكوافارر في كل مرحلة من مراحل الإنتاج — من وصول مواد PVC والزجاج الخام إلى الفحص النهائي قبل التسليم للقارب المكتمل. وتمتد منشأتنا التصنيعية في منطقة تشينغداو للتنمية الاقتصادية على مساحة 12,000 متر مربع وتضم ورشاً مخصصة للقطع PVC، والختم الحراري للأنابيب، وإنتاج هيكل RIB من الألياف الزجاجية، والطباعة الرقمية SUP، والتجميع النهائي، واختبار الجودة.
  - من خلال دمج التصميم والهندسة والنماذج الأولية والتصنيع والاختبار تحت سقف واحد، نلغي قصور التصنيع التعاقدي ونحتفظ بسيطرة مباشرة على جودة البناء واختيار المواد وجداول التسليم. وكل قارب يغادر ورشتنا يبنيه أشخاصنا، باستخدام معداتنا، وفق معاييرنا.
