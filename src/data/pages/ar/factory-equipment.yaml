hero:
  tagline: معدات
  title: معدات التصنيع والآلات
  subtitle: معدات صناعية في مجالات القطع، اللحام، الطباعة، والتجميع
  back_label: العودة إلى المصنع
  back_link: /factory
categories:
  - title: القطع وتحضير المواد
    items:
      - name: ماكينة القطع الأوتوماتيكية PVC
        spec: CNC-محكمة، 6.5 م × 2.5 م، دقة 0.1 مم
        desc: آلة قص أوتوماتيكية تتحكم بها الحاسوب PVC drop-stitch للأقمشة. برنامج التعشيش يحسن استخدام المواد إلى أقل من 5٪ من الفضلات.
      - name: منشط الأقمشة
        spec: عرض أقصى 3 أمتار، تغذية متحكم بها بالتوتر
        desc: يضع القماش في طبقات واحدة أو متعددة مع شد متحكم فيه لمنع التشوه قبل القص.
  - title: اللحام والربط
    items:
      - name: ماكينة الختم بالحرارة
        spec: اللحام بالهواء الساخن، متغير بين 200–600 درجة مئوية، 0.5–5 م/دقيقة
        desc: آلة ختم حراري بالهواء الساخن لربط PVC ولحام الطبقات، وأحزمة السكك الحديدية، ودرزات الحجرة. تستخدم للتثبيت والختم ودمج drop-stitch وصلات النواة.
      - name: مكبس RF عازل
        spec: 15 كيلوواط، ألواح 2000 × 600 مم
        desc: مكبس لحام بترددات راديوية للفواصل الطولية الرئيسية، وصلات الترانسوم إلى الأنبوب، وتصنيع الحجرات الكبيرة.
      - name: CNC- لحام RF متحكم فيه
        spec: 8 كيلوواط، XY طاولة 2500 × 1200 مم
        desc: لحام منحني قابل للبرمجة للهندسات المعقدة، ونقش الشعار، والترقيع الدقيقة.
  - title: فن الطرح والتشطيب
    items:
      - name: EVA ماكينة تقطيع السطح
        spec: CNC قطع بالسكين بعرض 2 متر
        desc: قطع دقيق EVA لألواح الفوم على السطح لأنماط السطح من سلسلة الفن. يتم قطع كل لوحة لتكون مناسبة كاملة للسطح بسلاسة.
      - name: مكبس تغليف السطح
        spec: التحكم في درجة الحرارة والضغط
        desc: يربط EVA ألواح السطح بسطح اللوح مع التصاق ثابت عبر كامل مساحة السطح.
  - title: SUP الطباعة والزخرفة
    items:
      - name: طابعة رقمية
        spec: نفث حبر عالي الدقة، عرض طباعة يصل إلى 2 متر
        desc: طباعة رقمية مباشرة على القماش SUP لرسومات السطح الملونة بالكامل. تطبع أنماطا مخصصة، تدرجات وصور بجودة فوتوغرافية باستخدام UV أحبار مقاومة للماء.
      - name: آلة الطباعة بالشاشة
        spec: تسجيل يدوي وشبه أوتوماتيكي متعدد الألوان
        desc: طباعة شاشة SUP لشعارات اللوحة، وعلامات العلامة التجارية، والأنماط المتكررة. توفر مطبوعات متينة ومعتمة مع تشبع ألوان زاهية.
  - title: الجمعية النهائية
    items:
      - name: محطة عزم الصمام
        spec: اختبار دالة معاير من 10 دورات
        desc: يركب ويعزم صمامات النفخ، ثم يختبر وظيفة كل صمام خلال 10 دورات فتح وإغلاق.
      - name: صندوق الزعنفة ومحدد الحلقة D
        spec: محاذي للجيج، ومعالجة بالمادة اللاصقة
        desc: تضع وتربط صناديق الزعانف، وحلقات D، والمقابض في مواقع سطح السطح الدقيقة حسب مواصفات الطراز.
  - title: الاختبار ومراقبة الجودة
    items:
      - name: جهاز اختبار الشد الشامل
        spec: سعة 50 كيلو نيوتن
        desc: اختبار قوة الكسر، والتمد عند الكسر، وانتشار التمزق لدفعات القماش.
      - name: منصة اختبار الاحتفاظ بالهواء
        spec: قابل للبرمجة، بالضغط لمدة 30 دقيقة
        desc: اختبار تثبيت الضغط الآلي لكل غرفة أنابيب قبل التجميع.
      - name: اختبار تقشير الدرزات
        spec: تقشير محرك بزاوية 180° بسرعة 100 مم/دقيقة
        desc: اختبار قوة تقشير اللحام واللحام المرتبط حسب بروتوكول داخلي.
      - name: غرفة تآكل قوس الزينون
        spec: تعريض 2000 ساعة
        desc: UV اختبار المقاومة لتغير اللون والحفاظ على القوة.
