hero:
  tagline: نمط الحياة
  title: Paddle Board Overstock<br />نمط الحياة
  subtitle: مصممة لأولئك الذين يعيشون على الماء — من مستكشفي عطلة نهاية الأسبوع إلى المتسابقين اليوميين الذين يعدون الأيام بين الجلسات.
values:
  - icon: 🌊
    title: مولود على الماء
    desc: يبدأ كل تصميم بفهم كيفية تصرف الماء. نحن نقوم بالهندسة من حافة الظروف إلى الداخل — لأن المحيط هو معلمنا، وليس مكان عملنا.
  - icon: 🔧
    title: مصممة لتدوم
    desc: أكثر المنتجات استدامة هو المنتج الذي لا يحتاج إلى استبدال. مواد بحرية عالية الجودة، نوى drop-stitch مصنفة حتى 15 PSI، وخياطة تدوم أطول من الموسم.
  - icon: 🏆
    title: متاحة حسب التصميم
    desc: رياضة الماء لا يجب أن تكون رفاهية. أداء بمستوى احترافي بسعر مناسب للعائلات، والمرشدين، والمتسابقين اليوميين — وليس فقط للمحترفين.
  - icon: 🌍
    title: المجتمع العالمي
    desc: 'من ساحل ويهاي إلى البحيرات في أوروبا، والأنهار في جنوب شرق آسيا، والخليجات في الأمريكتين — يشارك عملاؤنا شيئًا واحدًا: حب التواجد على الماء.'
  - icon: ♻️
    title: تصنيع مسؤول
    desc: CNC - القصوصة المحسّنة تقلل من هدر المواد إلى أقل من 5٪. البناء المتين يقلل من دورات الاستبدال. نحن نبني من أجل طول العمر لأن ذلك هو الخيار الأكثر استدامة.
  - icon: 🤝
    title: دعم يدوم
    desc: الألواح التي بنيناها منذ سنوات لا تزال تستدعي أجزاء غيار منا. متوسط استجابة الضمان لدينا 24 ساعة. نحن لا نختفي بعد البيع — نحن هنا طوال عمر المنتج.
