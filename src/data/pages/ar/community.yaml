stories:
  tagline: قصص المستكشفين
  title: مغامرات حقيقية من أشخاص حقيقيين
  subtitle: استمع إلى آراء المجدفين والعائلات والمحترفين الذين يستخدمون معدات Paddle Board Overstock على الماء.
  items:
    - name: سارة ومايك
      title: مالكو Explorer 11، كندا
      content: أخذنا زوارق Explorer 11 الخاصة بنا في رحلة استمرت أسبوعًا عبر منتزه ألجونكوين. تعاملت بشكل رائع مع النقليات وعبور البحيرات. سمحت لنا drop-stitch البناء بتضخيمها إلى 15 PSI والحصول على أداء لوحة صلبة من لوحة قابلة للحمل.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: منتزه ألغونكوين، كندا
    - name: كارلوس ر.
      title: راكب شيتهار سيرج، إسبانيا
      content: كيتا سيرج هو خيارتي المفضلة للإبحار على الساحل. التصميم النابض بالحياة يجذب الأنظار على الشاطئ، والاستقرار يمنحني الثقة في الأمواج الخفيفة. يتعامل بشكل جميل سواء كنت أستمتع بجولة أو فقط أستمتع بغروب الشمس.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: كوستا برافا، إسبانيا
    - name: لينا والعائلة
      title: مجذوفو زهرة اللوتس المتدفقة، السويد
      content: مغامرات عائلية نهاية الأسبوع في الأرخبيل. زهرة اللوتس المتدفقة مستقرة بما يكفي لتقف ابنتي عليها بينما أفرد المجداف. تنتفخ في أقل من 10 دقائق — لا حاجة لمقطورة، مجرد متعة عائلية نقية على الماء.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: أرخبيل ستوكهولم، السويد
    - name: أندريس د.
      title: مستكشف المحيط جوياجر، الفلبين
      content: أستخدم قاربي Ocean Voyager للجولات الساحلية الطويلة حول بالاوان. بعد أشهر من الاستخدام اليومي في الظروف الاستوائية، لا يزال اللوح يعمل كما لو كان جديدًا. الشكل المخصص للجولات يقطع الأمواج المتقطعة التي قد توقف الألواح الأقل جودة.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: بالاوان، الفلبين
    - name: إيما ت.
      title: تروبيكال بريز لأول مرة، أستراليا
      content: لم أكن قد ركبت طائرة من SUP قبل. النسيم الاستوائي مستقر جدا لدرجة أنني شعرت بالثقة في أول محاولة. الآن أجدف كل عطلة نهاية أسبوع. منحنى التعلم شبه صفر — واللوح يبدو مذهلا على الماء.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: جولد كوست، أستراليا
