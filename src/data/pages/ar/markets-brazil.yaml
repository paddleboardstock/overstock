hero:
  tagline: البرازيل
  title: الألواح بالجملة SUP<br />تجار التجزئة البرازيليون
  subtitle: للمتاجر والمشغلين من ريو وفلوريانوبوليس إلى الساحل الشمالي الشرقي — ألواح تجديف جديدة من 5 وحدات، نماذج مختلطة، شحنت من الصين.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: ألواح التخزين الزائد SUP لتجار الشواطئ البرازيلية ومدارس التجديف
direct_answer: Paddle Board Overstock يزود الشركات البرازيلية بألواح قابلة للنفخ فائض المخزون — SUP مدارس التجديف والمتاجر في ريو دي جانيرو، فلوريانوبوليس والساحل الشمالي الشرقي، ومشغلي التأجير، والبائعين عبر الإنترنت. تبدأ طلبات الجملة من 5 ألواح مع نماذج مختلطة في شحنة واحدة، ترسل من ويهاي، الصين عبر الشحن الجوي السريع أو الشحن البحري الموحد. كل لوحة مختبרת 100٪ من الضغط ومغطاة بضمان لمدة سنتين SUP .
tldr_points:
  - الجملة ابتداء من 5 ألواح — نماذج مختلطة، السعر حسب إجمالي الكمية
  - خدمة ثقافة الشاطئ البرازيلية من ريو إلى الشمال الشرقي
  - شحن جوي سريع أو شحن بحري موحد من ويهاي، الصين
  - اختبار الضغط 100%، وضمان SUP لمدة سنتين على كل لوح
overview_section:
  tagline: نظرة عامة على السوق
  title: السوق البرازيلي SUP
  paragraphs:
    - البرازيل هي واحدة من أكثر أسواق التجديف الطبيعية الطبيعية على وجه الأرض. ثقافة الشواطئ هي ثقافة وطنية — من مشهد التجديف الواقف في بحيرات ريو ومزيج الأمواج والمياه المسطحة في فلوريانوبوليس إلى المياه الدافئة والهادئة في الشمال الشرقي في سيارا وبيرنامبوكو وباهيا. مدارس التجديف، وتأجير البحيرات، SUP ومجتمعات الرياح وركوب الأمواج كلها تستقطب سكان ضخمين مهووسين بالرياضة.
    - عادة ما يكون المشترون البرازيليون من الشركات التي يديرها المالكون — مثل أكشاك الإيجار على جانب البحيرة، ومدارس الشاطئ، ومحلات ركوب الأمواج SUP التي تضيف خطوطا، وبائعي التجارة الإلكترونية المحليين المتنامين. يطلبون على دفعات صغيرة (5–20 لوحا)، ويهتمون بالمتانة للاستخدام اليومي وتنافسية الأسعار في سوق ذي تكاليف استيراد كبيرة.
  customer_types:
    - title: مدارس لاجون آند بيتش
      description: المدارس ومشغلو التأجير في بحيرات ريو وشواطئ الشمال الشرقي الهادئة التي تقدم دروسا وتأجير بالساعة.
    - title: محلات ركوب الأمواج
      description: أضاف تجار ركوب الأمواج المعروفون الرحلات الجوية للمياه المستوية والجولات SUP لمجتمع التجديف المحلي.
    - title: البائعون عبر الإنترنت
      description: بائعو التجارة الإلكترونية المحليون يستوردون SUP المخزون لخدمة السوق الداخلية الضخمة للبرازيل.
shipping_section:
  title: السفينة إلى البرازيل
  paragraphs:
    - ترسل الطلبات من ويهاي، الصين. الشحن الجوي السريع يحمل عينات و1–3 طلبات على متن الطائرات إلى المطارات الرئيسية في البرازيل؛ تخدم الشحن البحري الموحد طلبات الجملة من 5 إلى 20 لوحة عبر موانئ مثل سانتوس وبوابات ساحلية أخرى. تقديرات النقل لوجهتك مدرجة في عرض السعر.
    - نوفر الفواتير التجارية وقائمة التعبئة المطلوبة للتخليص، مع رموز HS الصحيحة والقيم المعلنة. تدفع الرسوم والضرائب على الاستيراد بموجب القواعد البرازيلية.
  customs_note: ضرائب الاستيراد البرازيلية على السلع الرياضية كبيرة وتختلف حسب تصنيف المنتج. تأكد من الرسوم الجمركية الحالية، وضريبة القيمة المضافة، وأي رسوم على مستوى الولاية مع وسيط الجمارك الخاص بك (despachante) قبل الطلب — نحن نوفر مستندات كاملة لكن لا ندمج ضرائب الاستيراد في عروض أسعار الشحن.
faq_section:
  title: الأسئلة الشائعة عن البرازيل
  items:
    - q: هل يمكن التعامل مع العروض والدعم باللغة البرتغالية؟
      a: نعم — نحن نعمل مع مشترين يتحدثون البرتغالية. اسأل في استفسارك وسنتولى عرض العرض والطلب بالبرتغالية.
    - q: هل تدرج ضرائب الاستيراد البرازيلية في أسعاركم؟
      a: لا. الرسوم الجمركية، وضريبة القيمة المضافة، والضرائب على مستوى الولاية هي مسؤولية المستورد بموجب القواعد البرازيلية. نحن نعرض أسعار اللوحات والشحن بوضوح وبشكل منفصل، ونوفر الأوراق التي تحتاجها البطاقة الخاصة بك.
    - q: كيف يبدو الطلب الأول لمدرسة شاطئية في البرازيل؟
      a: 'عادةً 5–15 لوحًا: نماذج متينة للاستخدام العام للدروس والإيجار بالساعة، بالإضافة إلى بعض الإصدارات الفاخرة للعرض في المتاجر. نماذج مختلطة في شحنة واحدة، ويتم التسعير حسب الكمية الإجمالية.'
    - q: هل تشحنون عن طريق البحر إلى البرازيل؟
      a: نعم — الشحن البحري الموحد يخدم الموانئ البرازيلية للطلبات الجملة من 5–20 لوحًا، ويتم اقتباس السعر حسب الوجهة. الشحن الجوي السريع متاح للعينات والطلبات الصغيرة العاجلة.
