testimonial:
  quote: وصل اللوح مع سجلات الاختبار التي كنت قادرًا على قراءتها فعليًا - رقم الدفعة، سجل اختبار الضغط، كل شيء. بعد ثلاث مواسم من الاستخدام الكثيف، لا يزال يحتفظ بالهواء كما في اليوم الأول.
  author: توم ريلي
  title: مشتري مُحقق
  company: راكب الزوارق في عطلة نهاية الأسبوع
  location: إيرلندا
