tests:
  - title: اختبار الضغط
    standard: المواصفة الداخلية AF-PT-001
    description: يتم ضغط الغرف القابلة للنفخ إلى 1.25 مرة من حد التشغيل الموصى به ويتم الاحتفاظ بها لمدة 30 دقيقة. يتم قياس اضمحلال الضغط للتحقق من صحة إحكام الهواء والسلامة الهيكلية للمواد والطبقات.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: اختبار التأثير
    standard: المواصفات الداخلية AF-IT-002
    description: تخضع المنتجات لتأثيرات خاضعة للرقابة من الأوزان المسقطة القياسية وأجهزة البندول. يقوم هذا بتقييم مقاومة الثقب وانتشار التمزق والمرونة الهيكلية ضد الاصطدامات بالعقبات والأرصفة والحطام.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV اختبار المقاومة
    standard: بروتوكول الاختبار الداخلي
    description: تعرض عينات المواد لأشعة UVA-340 في غرف التعرض للطقس المسرّع لمدة 1000 ساعة+. نقيس تغير اللون (Delta E)، واحتفاظ اللمعان، وفقدان قوة الشد للتحقق من صحة حزم المثبتات UV.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: اختبار مقاومة التآكل
    standard: بروتوكول الاختبار الداخلي
    description: يتم إخضاع عينات المواد إلى عجلات جلخ CS-10 تحت أحمال 500 جم/1000 جم لمدة 1000 دورة. يحدد فقدان الكتلة وتصنيف التآكل البصري متانة الطلاء ضد الرمل والحصى والإطلاق المتكرر.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: اختبار أداء درجات الحرارة المنخفضة
    standard: المواصفة الداخلية AF-LT-003
    description: يتم تكييف المنتجات المجمعة وعينات المواد عند -20°م، -10°م، و0°م لمدة 24 ساعة ثم يتم اختبار الانثناء. نتحقق من أن PVC يظل مرنًا دون تشقق أو تقشر.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: اختبار الطفو وسعة الحمولة
    standard: بروتوكول الاختبار الداخلي
    description: يتم تحميل المنتجات بشكل متزايد إلى سعة مقدرة تبلغ 1.25x في مجموعة يتم التحكم فيها. يتم تسجيل أداء لوح الطفو والثبات والصرف الذاتي. يتم التحقق من القدرة المقدرة لكل نموذج رياضيًا وتجريبيًا.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: اختبار القدرة على المناورة
    standard: المواصفات الداخلية AF-MT-004
    description: تقيس التجارب على الماء نصف قطر الدوران، والتسارع، ووقت التخطيط، واستجابة المجداف/المحرك عبر مجموعة من ظروف التحميل. يتم التحقق من صحة خصائص التعامل مع العالم الحقيقي مقابل أهداف التصميم.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: اختبار مقاومة الماء
    standard: المواصفة الداخلية AF-WT-005
    description: يتم اختبار كل منتج تم تجميعه بالرش عند ضغط 0.5 بار على جميع الدرزات والصمامات والتجهيزات. يتحقق اختبار الغمر المضغوط لمدة 5 دقائق من مقاومة الماء للغرفة والصمام. معيار عدم التسرب قبل الشحن.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: إجراءات الاختبار
  title: اختبارات صارمة في كل مرحلة
commitment:
  title: التزامنا
  body: من خلال هذه الإجراءات الصارمة للاختبار، يقدم {SITE} للعملاء التأكيد على أن ألواح SUP القابلة للنفخ لدينا ليست عالية الأداء فحسب، بل مصممة أيضًا لتدوم — مما يضمن العديد من المغامرات الممتعة والآمنة على الماء. مختبر الجودة لدينا يعمل بشكل مستقل عن الإنتاج ويرفع تقاريره مباشرة إلى الإدارة.
  cta: طلب وثائق الاختبار
  cta_link: /contact
