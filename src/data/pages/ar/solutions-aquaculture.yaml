content_challenge:
  tagline: التحدي
  title: متطلبات تربية الأحياء المائية<br />معدات مقاومة للمياه المالحة
  subtitle: تعمل مزارع الأسماك ومزارع اللؤلؤ ومزارع المحيطات في البيئات البحرية الأكثر عدوانية كيميائيًا - التعرض للمياه المالحة لفترة طويلة، وبقايا الوقود والأعلاف، والاستخدام اليومي المستمر.
  paragraphs:
    - تعمل أنشطة الاستزراع المائي على مدار 365 يومًا في السنة في بيئات ساحلية وبحرية قاسية. تُواجه قوارب العمل المستخدمة في فحص الأقفاص ونقل الأعلاف وصيانة خطوط اللؤلؤ وخدمة المعدات غمرًا مستمرًا في المياه المالحة وتعرضًا للأشعة فوق البنفسجية وتلامسًا كيميائيًا مع الوقود وأعلاف الأسماك ومعالجات مضادة للحشف.
    - '**التآكل هو العدو الرئيسي** — تتدهور المعدات البحرية القياسية بسرعة في هذه الظروف. تتطلب المحركات الخارجية وهياكل المقطورات وتجهيزات البدن استبدالًا مستمرًا. يحتاج المشغلون إلى قوارب مبنية من مواد مقاومة للتآكل قادرة على تحمل سنوات في هذه البيئة دون تدهور.'
    - '**الموثوقية اليومية أمر بالغ الأهمية** — تعطل قارب العمل يعني تفويت جداول التغذية وتأخر الحصاد وخسائر إنتاج مكلفة. في مزارع اللؤلؤ، قد يعني يوم فحص واحد فائت أضرارًا كبيرة في المحصول. في مزارع الأسماك، يؤثر تأخر التغذية على معدلات النمو والربحية.'
    - صُممت قوارب RIB للاستزراع المائي من Aquafarer بتجهيزات مقاومة للتآكل وأنابيب Hypalon فائقة التحمل وبدنات معززة، مبنية خصيصًا للظروف القاسية لتربية الأسماك وزراعة اللؤلؤ وتربية المحيطات.
content_solution:
  tagline: الحل لدينا
  title: قوارب RIB مصممة خصيصًا<br />لصناعة الاستزراع المائي
  subtitle: تم تصميم كل قارب عمل للاستزراع المائي من Aquafarer لتحمل بيئات المياه المالحة القاسية مع تقديم أداء يومي موثوق.
  list:
    - أنابيب Hypalon بجودة بحرية — مقاومة فائقة للأشعة فوق البنفسجية والمياه المالحة والوقود والمواد الكيميائية في أعلاف الأسماك
    - تجهيزات من الفولاذ المقاوم للصدأ 316 في جميع أنحاء القارب — لا صدأ مع التعرض المطول للمياه المالحة
    - أحزمة احتكاك معززة وواقي عارضة لتحمل التلامس المتكرر مع الأرصفة والأقفاص
    - سطح ذاتي التفريغ لسهولة الغسل والتصريف بعد نقل الأعلاف وعمليات الحصاد
    - تكوين سطح مسطح لنقل أكياس الأعلاف وصناديق الحصاد والمعدات
    - تكوينات المحركات الخارجية من 15 إلى 60 حصانًا — محسّنة لموازنة الحمولة وكفاءة الوقود
    - خيارات ألوان الأنابيب عالية الرؤية لسهولة تحديد القارب عبر مساحات المزارع الكبيرة
content_segments:
  tagline: لمحات عن تربية الأحياء المائية
  title: حلول قوارب العمل<br />حسب نوع الاستزراع المائي
  subtitle: تتطلب عمليات تربية الأحياء المائية المختلفة متطلبات مختلفة لقوارب العمل - بدءًا من الضلع الصغيرة الرشيقة لفحص أقفاص الأسماك وحتى منصات النقل المستقرة لاستزراع اللؤلؤ وقوارب العمل الثقيلة لتربية الماشية في المحيطات.
  items:
    - title: عمليات الاستزراع السمكي
      subtitle: فحص القفص، نقل الأعلاف، دعم الحصاد
      description: تقوم مزارع الأسماك البحرية بتشغيل الأقفاص في المواقع الساحلية والبحرية المكشوفة. تُستخدم قوارب العمل يوميًا لفحص شبكة الأقفاص وعمليات التغذية ودعم الحصاد وصيانة المعدات. التحدي الرئيسي هو التآكل، حيث تتعرض القوارب باستمرار للمياه المالحة وبقايا أعلاف الأسماك والوقود. يعد قارب العمل الموثوق به أمرًا ضروريًا لأن عدم التغذية أو تأخر الحصاد يؤثر بشكل مباشر على إنتاج الإنتاج والربحية.
      features:
        - 'حزمة البيئات القاسية: تجهيزات من الفولاذ المقاوم للصدأ 316، ومكونات سبائك بجودة بحرية'
        - تخطيط سطح مسطح لنقل أكياس الأعلاف وصناديق الحصاد
        - سطح ذاتي التفريغ لسهولة الغسل بعد العمليات
        - أنابيب Hypalon بطبقة مقاومة للمواد الكيميائية لتحمل التعرض للأعلاف والوقود
        - أحزمة احتكاك معززة للتلامس المتكرر مع الأقفاص والأرصفة
    - title: عمليات زراعة اللؤلؤ
      subtitle: نقل مستقر لفحص خط اللؤلؤ والحصاد
      description: تتطلب مزارع اللؤلؤ قوارب عمل مستقرة وموثوقة للنقل اليومي بين خطوط اللؤلؤ وفحص شباك المحار وجمع الحصاد. تتم هذه العمليات في مواقع ساحلية نائية ذات بنية تحتية محدودة للصيانة. يجب أن يكون القارب مستقرًا بدرجة كافية ليتمكن الطاقم من العمل أثناء فحص خطوط اللؤلؤ، مع سهولة الصعود ومساحة واسعة على سطح السفينة لحمل المحار والشباك والإمدادات التي تم حصادها. تعد الموثوقية وسهولة الصيانة أمرًا بالغ الأهمية في مواقع المزارع النائية.
      features:
        - تصميم بدن ثابت لطاقم واقف أثناء فحص خطوط اللؤلؤ
        - سطح مسطح بملمس مانع للانزلاق لحركة آمنة للطاقم
        - جانب منخفض لسهولة الوصول إلى شبكات المحار والحصاد
        - تكوين بسيط للمحرك الخارجي لسهولة الصيانة في الموقع
        - حزمة أنابيب وتجهيزات مقاومة للتآكل للتعرض المستمر للمياه المالحة
    - title: تربية المحيطات وتعزيز الحياة البحرية
      subtitle: نقل صغار الأسماك، خدمة الأقفاص، دعم المراقبة
      description: تتضمن عمليات تربية الماشية في المحيطات إطلاق مخزون صغير في بيئات بحرية مُدارة، ومراقبة النمو، وخدمة هياكل التعزيز. تحتاج قوارب العمل إلى نقل مخزون الأحداث الحية في حاويات هوائية، وحمل معدات المراقبة، والوصول إلى مواقع الإطلاق الساحلية الضحلة. يجب أن يوازن تصميم الهيكل بين القدرة الاستيعابية والغاطس الضحل للوصول إلى الشاطئ ومصب النهر.
      features:
        - مساحة على السطح لحاويات نقل مهواة لصغار الأسماك ومعدات المراقبة
        - غاطس ضحل للوصول إلى مواقع الإطلاق على الشواطئ وفي مصبات الأنهار
        - رسو سهل على الشاطئ — عارضة معززة وحماية للمقدمة
        - نقاط تثبيت المعدات لإلكترونيات المراقبة وأدوات أخذ العينات
        - أنابيب Hypalon فائقة التحمل من أجل المتانة في ظروف مختلطة من الرمال ومياه البحر
