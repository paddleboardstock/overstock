  items:
    - title: المستوردون لأول مرة
      description: اختبار فئة SUP بمجموعة من النماذج بدلاً من الالتزام بنموذج واحد بالجملة SKU.
    - title: تجار التجزئة في الشواطئ الموسمية
      description: المتاجر التي تحتاج إلى ألواح للمبتدئين للسياح وإصدارات مميزة للسكان المحليين — في نفس طلب إعادة التخزين.
