faq_section:
  title: الأسئلة الشائعة حول النماذج المختلطة
  items:
    - q: هل هناك حد أدنى لكل نموذج؟
      a: لا. الحد الأدنى 5 ألواح ينطبق على الطلب الكلي، وليس على كل نموذج. يمكنك طلب 5 نماذج مختلفة، لوح واحد لكل نموذج.
    - q: هل تغيير النماذج يغير السعر؟
      a: سعر الجملة لكل نموذج يتم تحديده حسب الوحدة، لكن درجتك السعرية تتحسن مع العدد الإجمالي للألواح — المزج بين النماذج لا يفرض عليك أي عقوبة.
    - q: هل يمكنني مزج الألواح مع الإكسسوارات؟
      a: نعم — يمكن إضافة المجاديف الاحتياطية، والمضخات، وأطقم الإصلاح إلى طلب مختلط. اسأل في استفسارك.
    - q: كيف أعرف أي النماذج تناسب سوقي؟
      a: أرسل لنا ملاحظة عن عملائك (ساحلي أم داخلي، سياح أم سكان محليون، مبتدئين أم راكبين) في نموذج الاستفسار وسنوصي بمزيج.
