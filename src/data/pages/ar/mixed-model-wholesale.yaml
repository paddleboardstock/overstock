hero:
  tagline: النماذج المختلطة للجملة
  title: ألواح التجديف المختلطة للجملة —<br />مزج نماذج مختلفة SUP بترتيب واحد
  subtitle: لماذا تحدد ميزانيتك في نموذج واحد؟ اجمع بين SUP أي ألواح متوفرة في المخزون — الشاملة، والجولات، وركوب الأمواج، والرسومات — في طلب بالجملة واحد، بمجموع يصل إلى 5 ألواح فقط.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: ترتيب مختلط من نماذج الألواح القابلة للنفخ SUP المختلفة من Paddle Board Overstock
direct_answer: يتيح البيع بالجملة المختلط للبائع الصغير طلب عدة SUP نماذج مختلفة في شحنة موحدة واحدة بدلا من كمية كبيرة من لوحة واحدة. عند Paddle Board Overstock، يمكن دمج أي نماذج متوفرة في المخزون، والحد الأدنى للطلب هو 5 ألواح إجمالا، والكمية الكلية تحدد مستوى التسعير. تشحن الطلبات المختلطة من ويهاي، الصين عبر الشحن الجوي السريع (1–3 لوحات) أو الشحن البحري الموحد (5–20 لوحة) إلى 50+ دولة، وكل لوحة تختبر 100٪ من حيث الضغط ومغطاة بضمان لمدة سنتين SUP .
tldr_points:
  - اخلط أي SUP موديلات متوفرة في المخزون في طلب واحد — لا يوجد حد أدنى لكل موديل
  - كمية الطلب الكلية (وليس كل كمية لكل نموذج) تحدد مستوى التسعير الخاص بك
  - ابدأ بخمسة ألواح إجمالا — مصممة لتجار التجزئة الصغيرين، وليس لأحمال الحاويات
  - 'شحنة واحدة موحدة: تكلفة شحن واحدة، تخليص جمركي واحد، تسليم واحد'
why_mixed:
  tagline: لماذا مختلط؟
  title: مزج ومطابقة. اشتر المزيد من التنوع. أنفق أقل.
  subtitle: رف من ألواح متطابقة يخدم نوعا واحدا من المجدفين. الطلب المختلط يحول نفس الميزانية إلى خط إنتاج كامل.
  items:
    - title: المزيد من التنوع على رفك
      description: اجمع بين ألواح شاملة للمبتدئين، وألواح الجولة للمغامرين، وألواح على طراز ركوب الأمواج للركاب — طلب واحد يغطي كامل مجموعة عملائك.
    - title: المخاطر الأقل لكل نموذج
      description: بدلا من المراهنة على موسمك على نموذج واحد، اطلب 2-4 من كل موديل. إذا تفوق أحد الطرازات على البقية، أعد تزويده بالطلب التالي ببيانات مبيعات حقيقية.
    - title: اختبر ما يباع في سوقك
      description: كل شاطئ وبحيرة ومدينة لها طلب مختلف. الطلب الأول المختلط هو أرخص بحث سوق موجود — ستة نماذج، شاهد أيها يتحرك.
    - title: هوامش أفضل في إصدارات الفن
      description: لوحات اللوحات الفنية الفاخرة (ليفياثان ويك، ميدوسا جلو، أوشن فوياجر) تقدم مبيعات أعلى. امزج بعضها في قاعدة من الألواح الشاملة لرفع هامش ربحك المتوسط.
    - title: شحنة واحدة موحدة
      description: الطلب المختلط يعني حجز شحن واحد، وتخليص جمركي واحد، وتسليم واحد — بدلا من خمس شحنات منفصلة من خمسة موردين منفصلين.
how_it_works:
  tagline: كيف يعمل
  title: كيف يعمل ترتيب النماذج المختلطة
  steps:
    - title: اختر المزيج الذي تناسبك
      description: اختر النماذج والكميات لسوقك — أو استخدم المحدد أدناه لرسم تركيبة ومشاهدة عدد اللوحات وتحديث القيمة الإجمالية مباشرة.
    - title: طلب عرض سعر
      description: أرسل لنا المزيج. نؤكد أسعار المخزون الحالي لكل موديل وعرض سعر الوحدات بالإضافة إلى خيارات الشحن السريع والشحن البحري إلى بلدك.
    - title: أكد الأمر
      description: اعتمد العرض النهائي — النماذج، الكميات، الشحن، المجموع. نقوم بتأمين المخزون وجدولة الشحن من ويهاي.
    - title: نحن نختبر كل لوحة
      description: يتم اختبار كل لوح في طلبك المختلط بنسبة 100% للضغط حتى 15 PSI قبل التعبئة — نفس المعيار لكل نموذج، سواء كان نموذجاً مبتدئاً شاملاً أو نسخة فنية.
    - title: توصيل واحد إلى باب منزلك
      description: تشحن الطلبات المختلطة بالكامل معًا — شحن جوي سريع للطلبات الصغيرة، وشحن بحري موحد من 5 إلى 20 لوحًا — مع تتبع من الباب إلى الباب.
