breadcrumb: مصنّع OEM/ODM
tldr:
  summary: Paddle Board Overstock مصنّع OEM/ODM يعمل مباشرة من المصنع. منشأة بمساحة 12,000 م² حاصلة على شهادة ISO 9001:2015، وطاقة إنتاجية سنوية تبلغ 15,000 وحدة، وامتثال CE/BSCI/REACH/UKCA، وحد أدنى للطلب (MOQ) يبدأ من 2-10 وحدات.
  points:
    - منشأة في تشينغداو بمساحة 12,000 م² حاصلة على شهادة ISO 9001:2015
    - طاقة سنوية تبلغ 15,000 وحدة مع 200-300 عامل ماهر
    - امتثال CE 2013/53/EU وUKCA وBSCI وREACH
    - 'حد أدنى منخفض للطلب: 2-5 وحدات (RIB)، 5-10 وحدات (SUP) للطرازات القياسية'
    - التصدير إلى أكثر من 50 دولة مع شحن FOB تشينغداو
trust_badges:
  badges:
    - icon: ⭐
      title: شهادة ISO 9001:2015
      desc: نظام إدارة جودة تدققه SGS عبر جميع خطوط الإنتاج.
      variant: cert
    - icon: ⭐
      title: امتثال CE وUKCA
      desc: امتثال كامل للتوجيه UE 2013/53/EU ومتطلبات وضع العلامات البريطانية.
      variant: cert
    - icon: ⭐
      title: تدقيق اجتماعي BSCI
      desc: ممارسات عمل أخلاقية ومعايير مكان عمل تم التحقق منها.
      variant: standard
    - icon: ⭐
      title: حد أدنى للطلب من وحدتين
      desc: 'طرازات RIB القياسية من 2-5 وحدات، وSUP من 5-10 وحدات. قالب مخصص: 200+.'
      variant: standard
process_section:
  eyebrow: عمليتنا
  title: سير عمل OEM/ODM شامل
  subtitle: من موجز التصميم إلى تحميل الحاوية — ست خطوات نحو قاربك القابل للنفخ بعلامتك التجارية الخاصة.
  steps:
    - step: '01'
      title: المواصفات وموجز التصميم
      desc: شارك مواصفاتك المستهدفة أو رسومات CAD أو منتجًا مرجعيًا. يراجع فريق الهندسة لدينا المواد والأبعاد ومتطلبات الامتثال (CE، BSCI) قبل تقديم عرض السعر.
    - step: '02'
      title: نمذجة القوالب ثلاثية الأبعاد
      desc: نصمم ونشكّل بأجهزة CNC قوالب مخصصة لألواح SUP وهياكل الكاياك ومكونات RIB. تُنتج عينات النماذج الأولية خلال 15-20 يوم عمل لموافقتك.
    - step: '03'
      title: اختيار المواد وإنتاج العينات
      desc: اختر من بين PVC بجودة عسكرية (0.9-1.2 مم) أو Hypalon CSM أو أقمشة النواة drop-stitch. ننتج عينات ما قبل الإنتاج بألوان علامتك التجارية وشعارك وتغليفك للاعتماد النهائي.
    - step: '04'
      title: تدقيق مصنع CE والامتثال
      desc: يتضمن كل طلب OEM وثائق امتثال — إعلان مطابقة CE، وسجلات تتبع ISO 9001، وتقرير الامتثال الاجتماعي BSCI، وإعلانات مواد REACH.
    - step: '05'
      title: الإنتاج بالجملة والرقابة أثناء التصنيع
      desc: تتبع دفعات الإنتاج قائمة فحص الجودة المكونة من 100 نقطة لدينا. تخضع كل وحدة لاختبار احتفاظ بالضغط لمدة 24 ساعة، واختبار قوة اللحامات، وفحص بصري قبل التغليف.
    - step: '06'
      title: خدمات لوجستية FOB تشينغداو والشحن
      desc: تُنقل المنتجات النهائية على منصات وتُغلف وتُحمّل في حاويات في ميناء تشينغداو. نتولى جميع وثائق التصدير والتخليص الجمركي ونوفر تتبعًا للشحنة في الوقت الفعلي.
capabilities_section:
  eyebrow: قدرات التصنيع
  title: ماذا نصنع
  subtitle: ست قدرات إنتاج أساسية لشركاء B2B حول العالم.
  items:
    - title: تصنيع ألواح SUP بتقنية drop-stitch
      desc: تثبيت نواة drop-stitch على كامل الطول لألواح stand-up paddle صلبة عالية الضغط (15-20 PSI). طول وعرض وسماكة ومنحنى rocker وتصميم جرافيكي مخصصة.
    - title: إنتاج القوارب القابلة للنفخ من PVC
      desc: قوارب dinghy وtender وقوارب رياضية من PVC ملحومة بالترددات العالية. تكوينات غرف متعددة، وخيارات أرضية (شرائح، سطح هوائي، قابلة للف)، وتكامل الملحقات.
    - title: تصنيع قوارب RIB من Hypalon
      desc: أنابيب Hypalon CSM بجودة تجارية ملتصقة بهياكل من الألياف الزجاجية أو الألمنيوم على شكل V عميق. أطوال من 3.3 م إلى 6.0 م لعمليات الدورية والإنقاذ والجولات والغوص.
    - title: العلامات الخاصة والعلامة التجارية المخصصة
      desc: 'خدمة علامة خاصة كاملة: شعار مخصص بالطباعة الحرارية أو الشاشية، وتغليف بالعلامة التجارية (علب تجزئة، حقائب حمل)، وأدلة مستخدم بلغتك، وتسجيل الباركود/UPC.'
    - title: تصميم القوالب والعُدد المخصصة
      desc: فريق هندسي داخلي ثلاثي الأبعاد CAD/CAM. نصمم ونصنع قوالب ألمنيوم ومركبة مخصصة لأشكال هياكل فريدة وتكوينات سطح ونقاط تثبيت ملحقات.
    - title: ملحقات OEM والتجهيز في مجموعات
      desc: سترات نجاة (CE 12402)، ومضخات مزدوجة الحركة، ومجاديف كربون/نايلون، وعدد إصلاح، وحقائب حمل، وأحزمة أمان. تجهيز كامل في مجموعات وتغليف حزم لعرض جاهز للبيع.
experience_section:
  eyebrow: خبرة ميدانية حقيقية
  title: شراكات صنعت علامات تجارية
  subtitle: قصص حقيقية من علامات تجارية ومؤسسات اختارت Paddle Board Overstock لتصنيع OEM/ODM.
  stories:
    - quote: جئنا إلى Paddle Board Overstock برسم تخطيطي على منديل وقائمة متطلبات. بعد ثمانية أشهر، كان لدينا منتج جاهز للإنتاج اجتاز شهادة CE من المحاولة الأولى.
      narrative: توجهت شركة ناشئة أوروبية بتصميم SUP مبتكر إلى Paddle Board Overstock لتصنيع ODM. أخذ فريق البحث والتطوير لدى Paddle Board Overstock المفهوم عبر تصميم CAD، والتحليل الإنشائي FEA، والمحاكاة الهيدروديناميكية، وصنع القالب، وتصنيع النموذج الأولي، وعُدد الإنتاج. زار مؤسس الشركة الناشئة تشينغداو ثلاث مرات خلال العملية. اجتاز المنتج النهائي شهادة CE دون أي تعديلات — نتيجة يعزوها المؤسس إلى فهم فريق الهندسة في Paddle Board Overstock للمتطلبات التنظيمية الأوروبية منذ البداية.
      context: إطلاق علامة SUP أوروبية، 2023-2024
      source: مؤسس العلامة التجارية
    - quote: مستوى حماية NDA وأمن الملكية الفكرية في Paddle Board Overstock يمنحنا الثقة لمشاركة تصاميمنا الخاصة. يتعاملون مع ملكيتنا الفكرية كأنها ملكهم.
      narrative: احتاجت شركة أمريكية لمعدات بحرية تملك تقنية صمامات خاصة إلى شريك تصنيع قادر على حماية ملكيتها الفكرية مع الإنتاج على نطاق واسع. بعد تدقيق خمسة مصنّعين صينيين، اختارت Paddle Board Overstock بناءً على بروتوكولات حماية الملكية الفكرية للمصنع، والتعامل الآمن مع ملفات التصميم، والاستعداد للتوقيع على اتفاقيات NDA صارمة. أنتجت الشراكة ثلاث خطوط منتجات على مدى أربع سنوات دون أي حوادث تتعلق بالملكية الفكرية.
      context: شركة أمريكية لمعدات بحرية، شراكة OEM منذ 2021
      source: نائب رئيس العمليات
