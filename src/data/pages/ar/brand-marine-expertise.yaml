hero:
  tagline: Marine Expertise
  title: عقود من الهندسة البحرية<br />في كل لوحة
  subtitle: Paddle Board Overstock يجمع بين علم المواد العميق، والتصنيع الدقيق، والاختبارات الواقعية لإنتاج ألواح تؤدي عندما يكون الأمر مهما.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock فريق الهندسة البحرية والبحث والتطوير في العمل
expertise_materials:
  tagline: علوم المواد
  title: اختيار المادة المناسبة<br />لكل تطبيق
  subtitle: نعمل مع ثلاث مواد أساسية — كل منها يختار لحالات استخدام محددة ومتطلبات أداء.
  columns: 3
  items:
    - title: من الدرجة البحرية PVC
      description: قماش 1100 دينير PVC — أكثر المواد تنوعا لدينا. UV- مستقر، مقاوم للاحتكاك، ومختبر زمنيا. مثالي SUP للألواح حيث الوزن والصلابة والكفاءة في التكلفة مهمة.
      icon: tabler:droplet
    - title: Drop-Stitch النواة
      description: تربط آلاف خيوط البوليستر بين طبقات القماش العلوية والسفلية، مما يسمح بنفخ الضغط العالي (15 PSI) لرحلة صلبة ومستقرة لا تزال تتدحرج على شكل حقيبة ظهر.
      icon: tabler:building-arch
    - title: EVA رغوة السطح
      description: الفوم عالي الكثافة والمخدد EVA يوفر ثباتا كامل الطول، وتوسيدا للسقوط، ولوحة لمجموعات الفن المميزة لدينا.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: قدرات التصنيع
  title: التصنيع الدقيق<br />في كل خطوة
  subtitle: منشأتنا التي تبلغ مساحتها 12,000 متر مربع مجهزة بآلات متخصصة لكل مرحلة من مراحل الإنتاج.
  columns: 2
  items:
    - title: CNC القطع
      description: القطع الذي يتم التحكم فيه بالحاسوب يضمن لوحات قماشية دقيقة وقابلة للتكرار مع أقل هدر ممكن. كل قطعة تناسب تماما كما تم تصميمها.
      icon: tabler:cpu
    - title: اللحام عالي التردد
      description: اللحام الصناعي بتردد عالي الكثافة يخلق فواصل أقوى من المادة الأساسية. التحكم المستمر في درجة الحرارة والضغط يضمن إحكام إحكام الهواء في كل عملية إنتاج.
      icon: tabler:bolt
    - title: تجميع نواة الغرز الدريم
      description: تربط آلاف خيوط البوليستر بين طبقات الأقمشة العلوية والسفلية، مما يسمح بالنفخ عالي الضغط (15-20 PSI) SUP للألواح والأرضيات الصلبة والمستقرة.
      icon: tabler:building-arch
    - title: اختبار الضغط
      description: يتم اختبار الضغط على كل لوح قبل الشحن، ويثبت عند ضغط 1.25 ضعف الضغط المصنف — إذا استمر في هذا الوضع، فيؤدي أداء على الماء.
      icon: tabler:wind
    - title: اختبار قوة الدرزة
      description: تخضع عينات عشوائية من كل دفعة إنتاجية لاختبارات تدميرية لقوة الدرز. يتم تسجيل النتائج ويمكن تتبعها إلى عمليات إنتاج محددة.
      icon: tabler:files
    - title: اختبار المياه
      description: كل تصميم لوح يخضع لتجارب بالماء الحقيقي. التجديف في ظروف الشواطئ الواقعية يتحقق من الأداء والتعامل والثبات.
      icon: tabler:ripple
expertise_design:
  tagline: التصميم والهندسة
  title: مصمم للظروف الحقيقية
  subtitle: تبدأ فلسفة تصميمنا بكيفية استخدام اللوح ثم نبني الهندسة حول ذلك الاستخدام.
  items:
    - title: شكل اللوح ومحيطه
      description: يتم ضبط الطول والعرض والانحناءات لكل نموذج وفقًا لاستخدامه المقصود — خطوط أطول للجولات لتحقيق الانزلاق، وأشكال أعرض للثبات واليوغا.
    - title: تقوية الحافة والخيط المركزي
      description: تضيف الحواف المقواة والخيوط المركزية الصلابة وتمتص الصدمات — وهي الأماكن التي تتعرض فيها الألواح لأكبر قدر من الإجهاد موسمًا بعد موسم.
    - title: تخطيط السطح والتماسك
      description: تم تصميم مناطق الوقوف، ومكان المقبض، ومثبتات حلقات D، ومناطق التماسك وفقًا لوضعيات التجديف الحقيقية — سواء كان للتجوال، أو الصيد، أو ممارسة اليوغا.
    - title: الفن وسلسلة الألوان
      description: الرسومات على السطح، ومخططات الألوان، ومثبتات الإكسسوارات — كل سلسلة مصممة لتناسب شخصية تجديف مميزة.
cta:
  title: هل لديك تطبيق محدد في ذهنك؟
  subtitle: يمكن لفريقنا مساعدتك في اختيار اللوح والحجم والمعدات المناسبة لأسلوب التجديف الخاص بك.
