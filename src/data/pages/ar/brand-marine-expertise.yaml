hero:
  tagline: خبرة بحرية
  title: 'عقود من الهندسة البحرية<br />في كل بدن'
  subtitle: 'تجمع Aquafarer بين علم المواد المتعمق والتصنيع الدقيق والاختبار الواقعي لإنتاج قوارب تؤدي أداءها عندما يكون ذلك مهمًا.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: فريق الهندسة البحرية والبحث والتطوير في Aquafarer أثناء العمل
expertise_materials:
  tagline: علم المواد
  title: 'اختيار المادة المناسبة<br />لكل تطبيق'
  subtitle: 'نعمل مع ثلاث مواد أساسية — اختيرت كل منها لحالات استخدام ومتطلبات أداء محددة.'
  columns: 3
  items:
    - title: PVC بدرجة بحرية
      description: 'قماش PVC بوزن 1100 دينير — مادتنا الأكثر تنوعًا. مستقر ضد الأشعة فوق البنفسجية، مقاوم للاحتكاك، ومتوافق مع لائحة REACH. مثالي للقوارب الترفيهية وألواح SUP والكاياك حيث تهم كفاءة الوزن والتكلفة.'
      icon: tabler:droplet
    - title: هيبالون/CSM فاخر
      description: 'مقاومة كيميائية فائقة واستقرار ضد الأشعة فوق البنفسجية. يمكن لقوارب الهيبالون أن تدوم 15-20 عامًا مع العناية المناسبة. موصى به للتطبيقات التجارية وإنقاذ الأرواح والعسكرية حيث تكون المتانة طويلة الأمد حرجة.'
      icon: tabler:shield
    - title: الألياف الزجاجية والألمنيوم
      description: 'بدنات من الألياف الزجاجية ذات V عميق للقوارب RIB وقوارب الدوريات — أداء يشق الأمواج في الظروف القاسية. بدنات ألمنيوم لقوارب العمل التجارية الشاقة التي تتطلب أقصى قوة وقدرة تحميل.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: قدرات التصنيع
  title: 'تصنيع دقيق<br />في كل خطوة'
  subtitle: 'منشأتنا البالغة 12,000 م² مجهزة بآلات متخصصة لكل مرحلة من مراحل الإنتاج.'
  columns: 2
  items:
    - title: قطع CNC
      description: 'يضمن القطع المتحكم به حاسوبيًا ألواح قماش دقيقة وقابلة للتكرار بأقل هدر. كل قطعة تناسب التصميم تمامًا.'
      icon: tabler:cpu
    - title: لحام الترددات العالية
      description: 'ينشئ اللحام HF الصناعي درزات أقوى من المادة الأساسية. يضمن التحكم المتسق في درجة الحرارة والضغط أختامًا محكمة في كل دفعة إنتاج.'
      icon: tabler:bolt
    - title: تجميع نواة الدروب ستيتش
      description: 'آلاف خيوط البوليستر تربط طبقتي القماش العلوية والسفلية، مما يسمح بالنفخ عالي الضغط (15-20 PSI) لألواح SUP وأرضيات صلبة ومستقرة.'
      icon: tabler:building-arch
    - title: اختبار الضغط
      description: 'يخضع كل منتج قابل للنفخ لاختبار الضغط قبل الشحن. تُختبر أنابيب RIB عند 1.25 ضعف الضغط المقنن — إذا صمدت هناك، فستؤدي أداءها في الماء.'
      icon: tabler:wind
    - title: اختبار قوة الدرزات
      description: 'تخضع عينات عشوائية من كل دفعة إنتاج لاختبارات قوة درزات إتلافية. تُسجل النتائج ويمكن تتبعها حتى دفعات إنتاج محددة.'
      icon: tabler:files
    - title: الاختبار في الماء
      description: 'يخضع كل طراز RIB لتجارب بحرية قبل الاعتماد. يتحقق الاختبار الواقعي في الظروف الساحلية من الأداء والمناورة والاستقرار.'
      icon: tabler:ripple
expertise_design:
  tagline: التصميم والهندسة
  title: 'مهندس لظروف حقيقية'
  subtitle: 'تبدأ فلسفتنا في التصميم من كيفية استخدام القارب — ثم نبني الهندسة حول حالة الاستخدام تلك.'
  items:
    - title: تصميم بدن V عميق
      description: "تتميز بدناتنا من الألياف الزجاجية بزوايا ميل محسوبة ومحسنة وفق طول كل طراز واستخدامه المقصود. زاوية V أكثر حدة للأداء في المياه الهائجة، وأكثر ضحالة من أجل الثبات."
    - title: سلامة متعددة الغرف
      description: 'يضم كل قارب 3-7 غرف هواء مستقلة. إذا تعرض أحد الأقسام للتلف، تحافظ الغرف المتبقية على طفو القارب واستمرار تشغيله.'
    - title: تخطيط مريح
      description: 'موضع وحدة التحكم وارتفاع الأنبوب ومكان المقاعد مصممة حول راحة المشغل أثناء الاستخدام الممتد — سواء في الدورية أو الصيد أو النقل.'
    - title: تهيئة مخصصة
      description: 'ألوان الأنابيب، تهيئة وحدة التحكم، سعة الوقود، حوامل الملحقات — يمكن تخصيص كل طراز ليناسب متطلبات تشغيلية محددة.'
cta:
  title: 'هل لديك تطبيق محدد في ذهنك؟'
  subtitle: 'يمكن لفريقنا الهندسي تقديم المشورة بشأن اختيار المواد والتصميم والتصنيع لمشروعك.'
  actions:
