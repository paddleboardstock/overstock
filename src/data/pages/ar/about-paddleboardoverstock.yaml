  tagline: الشهادات
  title: تصنيع معتمد CE و ISO
  subtitle: نماذجنا الـ64 الحاصلة على شهادة CE تلبي معايير السلامة والجودة الدولية.

values:
  - title: الجودة أولاً
    desc: كل قارب يغادر مصنعنا يجتاز اختبارات إلزامية لاحتباس الهواء وتقشير الدرزات والأنظمة قبل الشحن.
  - title: التكامل الرأسي
    desc: نتحكم في كل مرحلة — من قطع PVC إلى التجميع النهائي — مما يلغي أوجه القصور لدى المقاولين ويضمن جودة متسقة.
  - title: السلامة كمعيار
    desc: شهادة CE جوهر ما نصنعه. نماذجنا الـ64 الحاصلة على شهادة CE تلبي معايير السلامة الأوروبية للاستخدام الترفيهي والتجاري.
  - title: التركيز على الشريك
    desc: نبني علاقات طويلة الأمد مع شركاء OEM و ODM و private label من خلال الشفافية والموثوقية والنمو المشترك.

services:
  - title: تصنيع OEM
    desc: ننتج وفقاً لمواصفاتك. شاركنا رسوماتك، وفريقنا الهندسي يتولى النمذجة الأولية والأدوات والإنتاج.
  - title: حلول ODM
    desc: ابدأ من منصات التصميم المثبتة لدينا. خصص الحجم واللون والرسومات والتغليف لإنشاء خط منتجاتك الفريد.
  - title: Private Label
    desc: اسم علامتك التجارية، شعارك، تغليفك. تصل المنتجات جاهزة للبيع بالتجزئة مع تكامل كامل للعلامة التجارية.
  - title: العلامة التجارية المخصصة
    desc: طباعة سطح اللوح، رسومات الهيكل، ملصقات الأنابيب، وملصقات مخصصة — حضور ثابت للعلامة التجارية على كل سطح.

certifications:
  - name: شهادة CE
    desc: قواربنا ومركباتنا المائية تتوافق مع توجيهات الاتحاد الأوروبي للمركبات الترفيهية (2013/53/EU) والمعايير المنسقة ذات الصلة.
    scope: القوارب والمركبات المائية
  - name:
    desc: نظام إدارة الجودة معتمد لتصميم وتصنيع وتوزيع المركبات المائية القابلة للنفخ.
    scope: المنشأة بأكملها
  - name:
    desc: القوارب القابلة للنفخ — متطلبات السلامة والأداء للقوارب القابلة للنفخ المقواة وذات الهيكل الصلب.
    scope: خطوط RIB والقابلة للنفخ

