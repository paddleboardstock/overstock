hero:
  tagline: عن الشركة
  title: 'عن {SITE}'
  subtitle: شركة مصنعة لمعدات الرياضات المائية متكاملة رأسياً — من المادة الخام إلى القارب النهائي

intro:
  - 'تأسست Paddle Board Overstock في عام 2012 بمهمة واحدة: تصميم وتصنيع معدات الرياضات المائية التي تؤدي أداءً جيداً على الماء كما في تقرير الجودة. ما بدأ كورشة عمل مركزة على ألواح SUP نما إلى منشأة تصنيع متكاملة بمساحة 12,000 متر مربع في منطقة التنمية الاقتصادية في تشينغداو، لإنتاج القوارب القابلة للنفخ و RIB والكاياك وألواح SUP ومعدات السلامة والإكسسوارات لعملاء في أكثر من 50 دولة.'
  - اليوم، تعمل Paddle Board Overstock كعلامة تجارية مصنعة — نصمم ونطور ونصنع النماذج الأولية وننتج ونختبر كل شيء تحت سقف واحد. يمنحنا هذا التكامل الرأسي سيطرة مباشرة على اختيار المواد وجودة البناء وجداول التسليم. كل قارب يبنيه فريقنا، على معداتنا، وفقاً لمعاييرنا.
  - نخدم المستخدمين الترفيهيين والمشغلين التجاريين والوكالات الحكومية وشركاء العلامات التجارية في جميع أنحاء العالم. تساعد برامج OEM و ODM الخاصة بنا الشركات على إطلاق خطوط منتجاتها الخاصة دون الاستثمار في البنية التحتية للمصنع. سواء كنت بحاجة إلى نموذج أولي واحد أو دفعة إنتاج كاملة، فإن فريقنا يرشدك من المفهوم إلى التسليم الجاهز للبحر.

