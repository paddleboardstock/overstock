factory_details:
  - label: حجم المنشأة
    value: حرم جامعي متكامل 12,000 متر مربع (130,000 قدم مربع) في منطقة التنمية الاقتصادية في تشينغداو
  - label: السعة السنوية
    value: 15,000 قارب بما في ذلك SUP والكاياك والزوارق و RIB ومعدات السلامة
  - label: فريق البحث والتطوير
    value: أكثر من 25 مهندساً في تصميم المنتجات وعلوم المواد وهندسة الجودة
  - label: المعدات الرئيسية
    value: طاولات قطع CNC، ماكينات لحام RF عازلة، ماكينات إحكام هواء ساخن، طابعات رقمية، قوالب ألياف زجاجية، أجهزة اختبار احتباس الهواء
  - label: خطوط الإنتاج
    value: '6 خطوط متخصصة: قطع PVC، لحام الأنابيب، تشكيل هيكل الألياف الزجاجية، تجميع SUP، تجميع RIB، مراقبة الجودة النهائية'
  - label: حجم التصدير السنوي
    value: أكثر من 8 ملايين دولار أمريكي تصدير إلى أكثر من 50 دولة عبر أوروبا والأمريكتين وآسيا والمحيط الهادئ والشرق الأوسط

