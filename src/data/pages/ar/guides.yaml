hero:
  tagline: أدلة
  title: هل أنت جديد في SUP؟
  subtitle: أدلة عملية لمساعدتك في اختيار معدات الرياضات المائية القابلة للنفخ واستخدامها والاستمتاع بها.
size_guide:
  tagline: الحجم والمواصفات
  title: اعثر على الحجم المناسب لاحتياجاتك
  desc: قارن أبعاد المنتج وقدرات الوزن والاستخدامات الموصى بها. سواء كنت بحاجة إلى SUP للتجول، أو قارب كاياك صغير، أو RIB تجاري - يساعدك دليل المقاسات الخاص بنا على اختيار المقاس المناسب.
  link_label: دليل بالحجم الكامل مع مواصفات المنتج →
  link: /size-guide
  cards:
    - title: لوحات SUP
      desc: اختر الطول بناءً على وزنك والاستخدام المقصود. توفر الألواح الأوسع (32 بوصة+) مزيدًا من الثبات. وتتتبع الألواح الأطول (11-12 قدمًا) بشكل أفضل أثناء التجول.
    - title: قوارب الكاياك
      desc: قوارب كاياك فردية (9 أقدام) للسفر الفردي والأنهار. قوارب الكاياك الترادفية (12 قدمًا) لشخصين أو لشخص واحد مزود بمعدات. تحقق دائمًا من سعة الوزن.
    - title: القوارب والأضلاع
      desc: اختر الطول حسب عدد الركاب واستخدامهم. أضلاع أكبر (4.5 م +) للإنقاذ والبحر. قوارب صغيرة (2.7 م) كمراكب ومنصات للصيد.
