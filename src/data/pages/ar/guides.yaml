hero:
  tagline: أدلة
  title: هل أنت جديد في SUP؟
  subtitle: أدلة عملية لمساعدتك في اختيار معدات الرياضات المائية القابلة للنفخ واستخدامها والاستمتاع بها.
size_guide:
  tagline: الحجم والمواصفات
  title: اعثر على الحجم المناسب لاحتياجاتك
  desc: قارن بين أبعاد اللوح، وسعات الوزن، والاستخدامات الموصى بها. سواء كنت تريد لوحًا ثابتًا متعدد الاستخدامات أو شكلاً أسرع للجولات — يساعدك دليل الأحجام الخاص بنا على اختيار الحجم المناسب.
  link_label: دليل بالحجم الكامل مع مواصفات المنتج →
  link: /size-guide
  cards:
    - title: ألواح SUP متعددة الاستخدامات
      desc: ألواحنا بطول ~11 قدمًا (عرض 32") توازن بين الثبات والسرعة والسعة. النواة البالغ سمكها 6 بوصات drop-stitch عند 15 PSI تجعل السطح صلبًا للمتجدفين من جميع المستويات.
    - title: العرض والثبات
      desc: الألواح الأوسع (32"+) توفر مزيدًا من الاستقرار للمبتدئين، واليوغا، وصيد الأسماك. سمك 6 بوصات يضيف الصلابة والقدرة على تحمل وزن الراكب بالإضافة إلى المعدات.
    - title: الطرود والاكسسوارات
      desc: يتم شحن كل لوح كمجموعة كاملة — اللوح، حقيبة السفر، المضخة اليدوية، المجذاف القابل للتعديل، الزعنفة القابلة للإزالة، الحبل الحلزوني، ومجموعة الإصلاح. تحقق من الحد الأقصى للتحميل للراكب بالإضافة إلى المعدات.
