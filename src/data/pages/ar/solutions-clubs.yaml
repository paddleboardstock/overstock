testimonial:
  content: لقد بدأنا بحزمة Club Starter لمدرسة ركوب الأمواج لدينا في البرتغال. 20 لوحًا ومجدافًا وسترات - وصل كل شيء في غضون 3 أسابيع. بعد موسمين، قمنا بالترقية إلى الحزمة الاحترافية. كانت العلامة التجارية المخصصة مع شعارنا بمثابة تغيير في صورتنا الاحترافية.
  name: ريكاردو سانتوس
  title: مالك أكاديمية الغارف لركوب الأمواج – لاغوس، البرتغال
content_segments:
  tagline: ملفات تعريف النادي
  title: حلول نادي الرياضات المائية<br />حسب نوع النادي
  subtitle: بدءًا من نوادي التجديف الجامعية وحتى نوادي اليخوت الخاصة الحصرية، يتمتع كل نوع من الأندية باحتياجات فريدة من المعدات وأنماط الاستخدام وهياكل الميزانية. نحن نصمم كل حزمة لتتناسب مع نموذج النادي.
  items:
    - title: نوادي التجديف بالجامعات والكليات
      subtitle: أساطيل طلابية عالية الاستخدام
      description: نوادي التجديف التي يديرها الطلاب أو تدعمها المؤسسات، تدير برامج SUP وقوارب الكاياك لأقسام الترفيه بالجامعة. تواجه المعدات استخدامًا عالي التردد ومعدل دوران مرتفع عبر مستويات مهارات متعددة في كل فصل دراسي. تعد المتانة وسهولة الإصلاح أمرًا بالغ الأهمية، إلى جانب الأسعار الملائمة للميزانية بالنسبة للمنظمات الطلابية.
      features:
        - 'هيكل PVC فائق التحمل مصمم لدورات الاستخدام الطلابية'
        - 'نطاقات ألواح مرمّزة بالألوان حسب المستوى لسهولة إدارة الأسطول'
        - 'طقم إصلاح + دعم فيديو عند الطلب مع كل طلبية'
        - 'أسعار مخفضة للمنظمات الطلابية ودفع على أساس الفصل الدراسي'
    - title: مجداف المجتمع والنوادي الاجتماعية
      subtitle: الأندية الترفيهية القائمة على العضوية
      description: النوادي المجتمعية التي تقدم تجارب SUP وقوارب الكاياك والتجديف الاجتماعي للأعضاء. تحتاج المعدات إلى تحقيق التوازن بين الأداء والراحة لمجموعة عمرية واسعة، مع وجود علامة تجارية تعزز هوية النادي وفخر الأعضاء. تعد كفاءة التخزين أمرًا أساسيًا للأندية التي تعمل من خلال الوصول المحدود إلى الواجهة البحرية.
      features:
        - 'أسطول مختلط: ألواح SUP متعددة الاستخدامات وألواح جولات وكاياكات ترفيهية'
        - 'هوية كاملة للنادي: ألوان مخصصة وطباعة الشعار وسُتَر نجاة تحمل العلامة'
        - 'حلول تخزين مدمجة للمعدات القابلة للنفخ'
        - 'حزمة البدء لزيادة العضوية: بطاقات إحالة وتصوير بهوية النادي'
    - title: مدارس ركوب الأمواج وأكاديميات ركوب الأمواج كاياك
      subtitle: الأداء الساحلي والتدريب
      description: تقوم المدارس التي تركز على رياضة ركوب الأمواج بتدريس مهارات ركوب الأمواج SUP والتجديف بالكاياك وركوب الأمواج. يجب أن تعمل المعدات في ظروف ركوب الأمواج - بحيث تكون قابلة للمناورة وسريعة الاستجابة ومتينة بما يكفي للتعامل مع عمليات المسح المتكررة وتآكل الرمال والتعرض للمياه المالحة دون تدهور سريع.
      features:
        - 'أشكال SUP أقصر وأعرض محسّنة للمناورة في الأمواج'
        - 'بناء حواف معزّز لمقاومة الصدمات في الأمواج'
        - 'معدات سلامة مخصصة للتصفح: أحبال لولبية وخيارات زعانف ناعمة'
        - 'برنامج استبدال الأسطول مع خصومات موسمية على المقايضة'
    - title: نوادي اليخوت الخاصة والشركات
      subtitle: تجارب الأعضاء المميزة
      description: نوادي خاصة حصرية تقدم الرياضات المائية كوسيلة راحة متميزة للأعضاء. تعتبر معايير المعدات عالية - فالجماليات ومواءمة العلامة التجارية والعرض التقديمي الجاهز للضيوف لا تقل أهمية عن الأداء. تتضمن توقعات الخدمة التسليم الفوري وحلول التخزين المخصصة والدعم على مستوى الكونسيرج.
      features:
        - 'ألواح بتشطيب فاخر مع EVA يحاكي الخشب ولمسات معدنية'
        - 'مطابقة الألوان وفق إرشادات هوية النادي'
        - 'تسليم بخدمة الكونسيرج: منفوخة ومجهزة وموسومة لكل موسم'
        - 'إدارة حساب مخصصة مع اتفاقية استجابة ذات أولوية'
