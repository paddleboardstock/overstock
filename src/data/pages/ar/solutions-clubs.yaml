testimonial:
  content: لقد بدأنا بحزمة Club Starter لمدرسة ركوب الأمواج لدينا في البرتغال. 20 لوحًا ومجدافًا وسترات - وصل كل شيء في غضون 3 أسابيع. بعد موسمين، قمنا بالترقية إلى الحزمة الاحترافية. كانت العلامة التجارية المخصصة مع شعارنا بمثابة تغيير في صورتنا الاحترافية.
  name: ريكاردو سانتوس
  title: مالك أكاديمية الغارف لركوب الأمواج – لاغوس، البرتغال
content_segments:
  tagline: ملفات تعريف النادي
  title: حلول لأندية الرياضات المائية<br />حسب نوع النادي
  subtitle: بدءًا من نوادي التجديف الجامعية وحتى نوادي اليخوت الخاصة الحصرية، يتمتع كل نوع من الأندية باحتياجات فريدة من المعدات وأنماط الاستخدام وهياكل الميزانية. نحن نصمم كل حزمة لتتناسب مع نموذج النادي.
  items:
    - title: نوادي التجديف بالجامعات والكليات
      subtitle: أساطيل طلابية عالية الاستخدام
      description: أندية تجديف يديرها الطلاب أو مدعومة من المؤسسات تقدم برامج SUP لأقسام الترفيه الجامعي. تواجه المعدات استخدامًا عالي التردد وعالي التدوير عبر مستويات مهارة متعددة في كل فصل دراسي. المتانة وسهولة الإصلاح أمران بالغ الأهمية، إلى جانب التسعير المناسب للميزانية للمنظمات الطلابية.
      features:
        - بناء PVC فائق المتانة مصمم لدورات استخدام الطلاب
        - مجموعة ألواح ملونة حسب مستوى المهارة لتسهيل إدارة الأسطول
        - مجموعة إصلاح + ودعم فيديو عند الطلب مشمول مع كل طلب
        - تسعير خصم للمنظمات الطلابية وشروط دفع وفق الفصول الدراسية
    - title: مجداف المجتمع والنوادي الاجتماعية
      subtitle: الأندية الترفيهية القائمة على العضوية
      description: الأندية المجتمعية التي تقدم SUP وتجارب التجديف الاجتماعية للأعضاء. يحتاج المعدات إلى التوازن بين الأداء والراحة لمجموعة عمرية واسعة، مع تصميمات تجارية تعزز هوية النادي وفخر الأعضاء. كفاءة التخزين مهمة للأندية التي تعمل من وصول محدود إلى الواجهة المائية.
      features:
        - 'أسطول مختلط: SUPs العامة والجولات'
        - 'العلامة التجارية الكاملة للنادي: ألوان مخصصة، طباعة الشعار، سترة النجاة بعلامة النادي'
        - حلول تخزين مدمجة للمعدات القابلة للنفخ
        - 'حزمة بداية نمو العضوية: بطاقات إحالة، تصوير بعلامة النادي'
    - title: مدارس ركوب الأمواج وأكاديميات SUP
      subtitle: الأداء الساحلي والتدريب
      description: مدارس مخصصة لركوب الأمواج تعلم مهارات ركوب الأمواج وركوب الأمواج على الأمواج SUP. يجب أن تؤدي المعدات بشكل جيد في ظروف الأمواج – قابلة للمناورة، مستجيبة، ومتينة بما يكفي لتحمل الانزلاقات المتكررة، تآكل الرمال، والتعرض للمياه المالحة دون تدهور سريع.
      features:
        - أشكال أقصر وأوسع SUP محسنة لمناورة الأمواج
        - بناء حواف معزز لمقاومة الصدمات في الأمواج
        - 'معدات السلامة المخصصة لركوب الأمواج: حبال ملفوفة، خيارات زعانف ناعمة'
        - برنامج استبدال الأسطول مع خصومات استبدال موسمية
    - title: نوادي اليخوت الخاصة والشركات
      subtitle: تجارب الأعضاء المميزة
      description: نوادي خاصة حصرية تقدم الرياضات المائية كوسيلة راحة متميزة للأعضاء. تعتبر معايير المعدات عالية - فالجماليات ومواءمة العلامة التجارية والعرض التقديمي الجاهز للضيوف لا تقل أهمية عن الأداء. تتضمن توقعات الخدمة التسليم الفوري وحلول التخزين المخصصة والدعم على مستوى الكونسيرج.
      features:
        - ألواح ذات تشطيب فاخر بنقش خشبي EVA ولمسات معدنية
        - مطابقة الألوان المخصصة لتوجيهات علامة النادي
        - 'التوصيل بنمط الكونسيرج: مسبق النفخ، جاهز للعرض، وموسوم لكل موسم'
        - إدارة حساب مخصصة مع استجابة أولوية SLA
