features3_solutions:
  tagline: الحلول
  title: مغامرتك المائية<br />شريك العمل
  isBeforeContent: false
  columns: 3
  items:
    - title: نوادي الرياضات المائية
      description: حزم المعدات الكاملة والعلامات التجارية المخصصة وبرامج الصيانة للأندية SUP ونوادي قوارب الكاياك ومدارس ركوب الأمواج ومراكز التدريب.
      icon: tabler:users
      link: /solutions/clubs
    - title: الرياضات المائية
      description: RIBs مصممة خصيصًا لمدارس الإبحار ومراكز الرياضات المائية ومنظمات الأحداث. قوارب المدربين، وقوارب السحب، وقوارب المارشال للرياضات المائية الاحترافية.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: المنتجعات والفنادق
      description: برامج الرياضات المائية المتميزة مع معدات الأسطول وأنظمة السلامة وتدريب الموظفين وإدارة الإيرادات لمنشآت الضيافة.
      icon: tabler:beach
      link: /solutions/resorts
    - title: رواد الأعمال في مجال العلامات التجارية للمياه
      description: تصنيع العلامة الخاصة OEM/ODM بموك منخفضة وتصميم المنتجات المخصصة والتعبئة والشحن العالمي لأصحاب العلامات التجارية الجديدة.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: قوارب مركز الغوص
      description: منصات RIB ثابتة مع دخول/خروج سهل وتخزين للمعدات وتكوينات محركات محسّنة لعمليات الغوص.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: قوارب الإنقاذ والطوارئ
      description: قوارب RIB عالية السرعة وقوارب قابلة للنفخ مصممة للبحث والإنقاذ والاستجابة للطوارئ وعمليات خفر السواحل.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: حلول القوارب المساعدة لليخوت
      description: قوارب RIB مساعدة مدمجة وأنيقة تكمل اليخوت الفاخرة والقوارب الترفيهية. تخزين سهل وأداء قوي.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: حلول قوارب الصيد
      description: قوارب قابلة للنفخ ثابتة ومتينة وقوارب RIB مهيأة لعمليات الصيد التجارية والترفيهية.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: معدات السياحة البحرية
      description: قوارب قابلة للنفخ جاهزة للأسطول وألواح SUP وزوارق كاياك للمنتجعات ومشغلي الجولات وشركات تأجير الرياضات المائية.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: أضلاع الطاقة البحرية
      description: أضلاع RIBs شديدة التحمل لدعم منصات النفط والغاز، ونقل طاقم مزرعة الرياح، وفحص الكابلات البحرية، والإنشاءات البحرية.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: قوارب العمل لتربية الأحياء المائية
      description: أضلاع مقاومة للتآكل لتربية الأسماك وزراعة اللؤلؤ وتربية الماشية في المحيطات. Hypalon أنابيب، أجزاء صلبة من الفولاذ المقاوم للصدأ، متانة الاستخدام اليومي.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: البحوث والمسح البحري
      description: أضلاع RIBs مستقرة وجاهزة للأدوات لأبحاث علوم المحيطات، والرصد البيئي، وأخذ عينات من جودة المياه، وبرامج التدريس الجامعي.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: قوارب العمل التجارية
      description: قوارب RIB فائقة التحمل للدوريات والمسح والنقل والخدمات اللوجستية البحرية. مصممة للمتطلبات الصارمة للعمليات التجارية.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: لست متأكدًا من المسار الذي يناسب عملك؟
  subtitle: أخبرنا عن العملية التي تقوم بها - سنوصي بحزمة المعدات المناسبة، أو برنامج العلامة التجارية، أو الحل المخصص.
  actions:
