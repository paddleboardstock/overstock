hero:
  tagline: برنامج الوكلاء
  title: كن موزعًا لـ Aquafarer
  subtitle: شريك مع شركة تصنيع RIB والمراكب المائية القابلة للنفخ المعتمدة من CE والتي تخدم أكثر من 50 دولة. حماية الأراضي، ودعم التسويق، والأسعار التنافسية للموزعين البحريين المعتمدين.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: برنامج بيع وتوزيع Aquafarer
direct_answer: تقدم Aquafarer شراكات للوكلاء والتوزيع مع حماية المنطقة، وأسعار الجملة التنافسية، ومجموعات دعم التسويق، ووثائق الامتثال الكاملة (CE، ISO 9001، BSCI). يبدأ موك بـ 10-20 وحدة لكل طلب مع إدارة حساب مخصصة.
