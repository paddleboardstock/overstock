content_benefits:
  tagline: فوائد الشراكة
  title: لماذا الموزعين<br />يختارون Aquafarer
  subtitle: شراكة مصممة للموزعين البحريين الذين يحتاجون إلى إمدادات موثوقة وهوامش تنافسية ودعم احترافي.
  items:
    - title: حماية الإقليم
      description: حقوق الأراضي الحصرية أو شبه الحصرية للموزعين المؤهلين. رسم خرائط السوق وإدارة صراعات القنوات لحماية استثمارك في بناء العلامة التجارية Aquafarer في منطقتك.
      icon: tabler:map-pin
    - title: أسعار الجملة التنافسية
      description: التسعير المتدرج على أساس التزامات الحجم السنوية. هيكل تسعير محمي للهامش مع ضمانات الأسعار المسبقة وتفاصيل التكلفة الشفافة (أساس FOB Qingdao).
      icon: tabler:currency-dollar
    - title: مجموعة دعم التسويق
      description: التصوير الفوتوغرافي الاحترافي للمنتج، وأوراق المواصفات، وقوالب وثائق الامتثال، ومحتوى الوسائط الاجتماعية، والمواد التسويقية ذات العلامات التجارية المشتركة. يتم تحديثها سنويًا مع إطلاق المنتجات الجديدة.
      icon: tabler:photo
    - title: التدريب الفني
      description: التدريب على المنتج لفريق المبيعات لديك (افتراضي أو في الموقع)، والتدريب على الصيانة والإصلاح لفنيي الخدمة لديك، والأسئلة الشائعة التي تواجه العملاء وأدلة استكشاف الأخطاء وإصلاحها.
      icon: tabler:school
    - title: قطع الغيار وخدمات ما بعد البيع
      description: توريد قطع الغيار المخصصة مع أولوية الشحن. تتوفر أقسام الأنابيب والصمامات والزعانف ومجموعات الإصلاح البديلة لتلبية الطلب بسرعة. دعم معالجة مطالبة الضمان.
      icon: tabler:tool
    - title: توثيق الامتثال
      description: 'حزمة وثائق الامتثال الكاملة لسوقك: CE DoC، وبيانات لوحة البناء، وأدلة المالك، ودعم التسجيل التنظيمي. يزيل عبء الامتثال الخاص بك.'
      icon: tabler:file-certificate
content_requirements:
  tagline: ما نبحث عنه
  title: الموزع<br />المتطلبات
  subtitle: نحن نبحث عن شركاء يمكنهم تمثيل ودعم منتجات Aquafarer بشكل احترافي في أراضيهم.
  items:
    - title: معرفة المنطقة والسوق
      description: تواجد راسخ في سوق الرياضات البحرية أو المائية أو الترفيهية في الهواء الطلق. فهم اللوائح المحلية وتفضيلات المستهلك وقنوات التوزيع لمنتجات المراكب المائية.
      icon: tabler:target
    - title: تجربة الصناعة
      description: خبرة لا تقل عن سنتين في توزيع المعدات البحرية أو الخارجية أو الرياضية. سجل حافل مع العلامات التجارية العالمية وعمليات البيع بالجملة بين الشركات.
      icon: tabler:briefcase
    - title: صالة العرض أو المستودع
      description: منشأة مادية لعرض المنتجات وتخزين المخزون وخدمة العملاء. القدرة على الحفاظ على الوحدات التجريبية ومخزون قطع الغيار لمنطقتك.
      icon: tabler:building-store
    - title: الالتزام بمعايير العلامة التجارية
      description: الاستعداد للحفاظ على معايير عرض العلامة التجارية Aquafarer، وتوفير دعم العملاء وفقًا لبروتوكولات الخدمة الخاصة بنا، والمشاركة في تحديثات التدريب السنوية على المنتج.
      icon: tabler:star
content_process:
  tagline: عملية التقديم
  title: عملية تقديم الطلب من 4 خطوات للموزع
  subtitle: من الاستفسار الأولي إلى الشحنة الأولى - عملية تأهيل مباشرة.
  steps:
    - number: '01'
      title: الاستفسار الأولي والتأهيل
      description: أرسل طلب الموزع الخاص بك مع تفاصيل الشركة والمنطقة محل الاهتمام وخطوط الإنتاج الحالية وتقديرات الحجم السنوية. نقوم بالمراجعة خلال 5 أيام عمل.
      timeline: 5 أيام
    - number: '02'
      title: مراجعة الأعمال والشروط
      description: اجتماع افتراضي لمناقشة استراتيجية المنطقة ومستويات التسعير وشروط الشراكة. قم بمراجعة متطلبات وثائق الامتثال الخاصة بالسوق الخاص بك. توقيع NDA إذا لزم الأمر.
      timeline: 1-2 أسابيع
    - number: '03'
      title: عينة من الطلب والتقييم
      description: قم بتقديم طلب عينة أولي (2-5 وحدات) بسعر الموزع لتقييم السوق وتدريب الفريق. تم تضمين وثائق الامتثال الكاملة والإعداد التجريبي.
      timeline: 30-45 يوما
    - number: '04'
      title: إطلاق الشراكة والدعم
      description: تم تفعيل طلب الحاوية الأول مع حماية المنطقة. تم تسليم أدوات التسويق، وتدريب فريق المبيعات، وتعيين مدير حساب مخصص. مراجعات الأعمال الفصلية المستمرة.
      timeline: مستمر
content_application_docs:
  tagline: مستندات التقديم
  title: المستندات المطلوبة<br />لتقديم طلب الوكالة
  subtitle: للتقديم على وكالة Aquafarer، يرجى تجهيز المستندات والمعلومات التالية لفريق المراجعة لدينا.
  items:
    - title: شهادة السجل التجاري
      description: وثيقة تسجيل شركة سارية تُظهر الاسم القانوني للكيان والعنوان المسجل ونطاق النشاط التجاري الذي يشمل توزيع المعدات البحرية أو الرياضية أو معدات الأنشطة الخارجية.
      icon: tabler:file-text
    - title: خطة التغطية الإقليمية
      description: المنطقة الجغرافية المستهدفة، وشبكة التجزئة أو التوزيع الحالية، وشرائح العملاء المستهدفة، والحجم السنوي المقترح حسب فئة المنتج (RIB، SUP، كاياك).
      icon: tabler:map
    - title: قدرة صالة العرض أو المستودع
      description: منشأة مادية لعرض المنتجات وتخزين المخزون وخدمة العملاء. صور أو مخططات توضح منطقة العرض التوضيحي وسعة تخزين قطع الغيار.
      icon: tabler:building
    - title: بيان القدرة المالية
      description: 'مرجع بنكي أو قائمة مالية تؤكد القدرة على تقديم طلب حاوية أولي والحفاظ على المخزون. الحد الأدنى للطلب الأولي: حاوية 20 قدمًا (10-20 وحدة بنماذج متنوعة).'
      icon: tabler:coin
    - title: قدرة الدعم بعد البيع
      description: فنيو خدمة مدربون أو قابلون للتدريب على صيانة وإصلاح القوارب القابلة للنفخ. قدرة على معالجة مطالبات الضمان والتزام بمخزون قطع الغيار.
      icon: tabler:tool
    - title: مراجع العلامات التجارية السابقة
      description: قائمة العلامات التجارية للمعدات البحرية أو الرياضية الموزعة حاليًا أو سابقًا. مراجع الاتصال متاحة بموجب اتفاق متبادل. يمكن للشركات الناشئة دون خبرة توزيع سابقة التأهل بالتزام مالي أقوى.
      icon: tabler:users
faq:
  title: برنامج الوكالة — الأسئلة المتداولة
  questions:
    - q: ما هو الحد الأدنى لكمية الطلب للموزعين؟
      a: يبدأ موك الموزع بـ 10-20 وحدة لكل طلب، مع مرونة للنماذج المختلطة (RIB، القابل للنفخ، SUP). تتوفر طلبات العينات الأولية المكونة من 2-5 وحدات بأسعار الموزع لتقييم السوق.
    - q: هل تقدمون حقوق الأراضي الحصرية؟
      a: تتوفر حقوق الأراضي الحصرية للموزعين المؤهلين الذين يستوفون التزامات الحجم السنوية ويحافظون على معايير العلامة التجارية. الترتيبات شبه الحصرية وغير الحصرية متاحة أيضًا للأسواق الناشئة.
    - q: ما هو الدعم التسويقي الذي تقدمونه؟
      a: نحن نقدم مجموعة أدوات تسويقية شاملة تتضمن التصوير الفوتوغرافي الاحترافي للمنتجات، وأوراق المواصفات، ونماذج وثائق الامتثال، ومكتبة محتوى الوسائط الاجتماعية، والمواد ذات العلامات التجارية المشتركة. يتم تحديثها سنويًا مع إطلاق المنتجات الجديدة.
    - q: كيف يتم التعامل مع مطالبات الضمان؟
      a: 'يعمل الموزعون كنقطة الاتصال الأولى لمطالبات الضمان. نحن نقدم معايير ضمان واضحة، وبروتوكولات توثيق الصور، والاستبدال السريع أو معالجة الائتمان. شروط الضمان: 5 سنوات محدودة على نسيج/طبقات/هيكل أنبوب القارب؛ ضمان لمدة عامين على SUP والملحقات.'
    - q: هل يمكنني وضع علامة خاصة على منتجات Aquafarer تحت علامتي التجارية الخاصة؟
      a: نعم، من خلال برنامج OEM/ODM لدينا. تتضمن خيارات العلامة الخاصة رسومات أنبوبية مخصصة، والعلامة التجارية لوحدة التحكم، والتغليف للبيع بالتجزئة، ووثائق الامتثال تحت اسم علامتك التجارية. راجع صفحة خدمات OEM/ODM الخاصة بنا للحصول على التفاصيل.
    - q: ما هي وثائق الامتثال المضمنة للموزعين؟
      a: تتضمن كل شحنة مستند CE DoC الخاص بالطراز، وبيانات لوحة البناء، وأدلة المالك، ووثائق الشحن. كما نقدم أيضًا دعم التسجيل التنظيمي لمنطقتك ونساعد في تلبية أي متطلبات امتثال محلية.
