content_service_modules:
  tagline: وحدات الخدمة
  title: OEM/ODM الخدمة<br />الوحدات
  subtitle: يجمع كل مشروع بين وحدات الخدمة المناسبة. لا يحتاج كل مشروع إلى كل وحدة، فنحن نحدد فقط ما يتطلبه مشروعك.
  items:
    - title: المراجعة الهندسية والجدوى
      description: 'تقييم منصة الهيكل، وفحص الجدوى الهيكلية، والتحقق من الاستقرار والطفو، وتحديد مسار الامتثال، وتأكيد توافر المواد. الإخراج: تقرير جدوى مع توصية بالاستمرار/عدم الاستمرار.'
      icon: tabler:math-function
    - title: التصميم والتكوين
      description: 'رسم GA، وتخطيط سطح السفينة، وتكوين الأنبوب، ووحدة التحكم ومواضع الجلوس، وخطة تركيب المعدات، واختيار اللون/المادة. الإخراج: GA المعتمدة ومواصفات التكوين.'
      icon: tabler:ruler
    - title: عينة ونموذج أولي
      description: عينة ما قبل الإنتاج بألوان وشعار ومواد محددة معتمدة للفحص المادي. يتضمن بروتوكول الموافقة على العينة وقائمة فحص الفحص وعملية طلب التغيير.
      icon: tabler:3d-cube-sphere
    - title: الإنتاج ومراقبة الجودة
      description: إنتاج ضخم مع قائمة مراجعة لمراقبة الجودة مكونة من 100 نقطة لكل وحدة، وعمليات فحص أثناء العملية، واختبار الضغط (1.25x / 24-48 ساعة)، وإمكانية التتبع على المستوى التسلسلي. CE/ISO الوثائق المعدة بالتوازي.
      icon: tabler:clipboard-check
    - title: العلامات التجارية والتعبئة والتغليف
      description: تطبيق شعار العلامة الخاصة، ورسومات الهيكل والأنابيب المخصصة، ووثائق المالك ذات العلامة التجارية، والتغليف الجاهز للبيع بالتجزئة أو على منصات نقالة، وإعداد مجموعة قطع الغيار.
      icon: tabler:palette
    - title: التصدير والتوثيق
      description: تعبئة الصادرات، خطة تحميل الحاويات، FOB/CIF/DDP الوثائق، أوراق الامتثال لكل سوق الوجهة، وبروتوكول الاتصالات بعد التسليم.
      icon: tabler:world
content_risk_control:
  tagline: مراقبة المخاطر والتسليم
  title: مخاطر المشروع وإدارة التسليم
  subtitle: يهتم المشترون المحترفون OEM/ODM بالتحكم في المخاطر بقدر اهتمامهم بجودة المنتج. وهنا كيف نديرها.
  items:
    - title: النطاق وتعريف الملكية
      description: 'قبل بدء التطوير، نحدد كتابيًا: نطاق التخصيص، ومتطلبات الأدوات، ومعايير الموافقة على العينات، وملكية الرسومات والقوالب، ومسؤوليات التوثيق. لا يوجد غموض حول من يملك ماذا.'
      icon: tabler:file-text
    - title: عملية التحكم بالتغيير
      description: تتبع جميع تغييرات المواصفات بعد تأكيد التصميم عملية طلب تغيير موثقة مع تقييم التأثير (التكلفة، والجدول الزمني، والامتثال). لا توجد تعديلات غير معتمدة تدخل الإنتاج.
      icon: tabler:arrows-diff
    - title: ضمان اتساق الدفعة
      description: الوحدة الخمسين تتطابق مع العينة الأولى المعتمدة. يتم تجميد المواصفات المعتمدة، ويتم قفل معلمات المواد والعملية، وتتحقق نقاط التفتيش أثناء العملية من الاتساق عبر عملية الإنتاج.
      icon: tabler:repeat
    - title: شفافية التسليم والقدرة
      description: يتم تحديد المهل الزمنية بناءً على القدرة الإنتاجية الفعلية ومستويات مخزون المواد وحمل الطلب الحالي - وليس الأهداف الطموحة. جدول الإنتاج مع التواريخ الهامة المقدمة لكل طلب.
      icon: tabler:calendar-stats

