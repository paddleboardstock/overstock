faq:
  title: RIB OEM/ODM - الأسئلة المتداولة
  questions:
    - q: ما هو الفرق بين OEM و ODM لقوارب RIB؟
      a: 'OEM (تصنيع المعدات الأصلية): أنت تقدم مواصفات تفصيلية ونحن نبني التصميم الخاص بك. ODM (تصنيع التصميم الأصلي): يمكنك تحديد منصة Aquafarer RIB التي أثبتت جدواها ونقوم بتخصيصها حسب الميزات والعلامات التجارية التي تريدها. ODM أسرع وأقل تكلفة. يوفر OEM أقصى قدر من التحكم في التصميم.'
    - q: هل يمكنني تخصيص شكل وحجم هيكل RIB؟
      a: نعم. نحن نقدم تعديلات شبه مخصصة على قوالب الهيكل الموجودة (تخطيطات سطح السفينة المختلفة، وتكوينات الأنابيب) وتطوير الهيكل المخصص بالكامل باستخدام قوالب جديدة مُشكَّلة باستخدام الحاسب الآلي. يمكن أن تبدأ المشاريع شبه المخصصة بـ 2-5 وحدات؛ يتطلب التخصيص الكامل عادةً التزامات أعلى.
    - q: ما هي مواد الأنبوب المتوفرة للأضلاع RIBs المخصصة؟
      a: نحن نقدم 0.9-1.2 مم PVC للاستخدام الترفيهي والتجاري الخفيف، و1.4-1.7 مم Hypalon/CSM للتطبيقات المهنية والإنقاذية والتجارية التي تتطلب مقاومة فائقة للأشعة فوق البنفسجية والأوزون (عمر 10-15 عامًا مقابل 5-8 سنوات للـ PVC).
    - q: هل يمكنك تكوين RIBs لتطبيقات محددة مثل الإنقاذ أو الغوص أو صيد الأسماك؟
      a: نعم. نحن نحتفظ بقوالب تكوين مثبتة للإنقاذ/الدوريات، ودعم الغوص، والسياحة/الاستئجار، وصيد الأسماك، ومناقصات اليخوت، وتطبيقات قوارب العمل الاحترافية. يتضمن كل قالب نوع الهيكل الموصى به، والمواد الأنبوبية، وتخطيط السطح، والمعدات - والتي نقوم بعد ذلك بتخصيصها وفقًا لمتطلباتك الدقيقة.
    - q: ما هي المعلومات التي تحتاجها للحصول على عرض أسعار RIB OEM/ODM؟
      a: التطبيق المستهدف، وطول الهيكل المطلوب، وتفضيل مادة الأنبوب (PVC أو Hypalon)، والكمية التقريبية وجدول التسليم، ومتطلبات الامتثال للسوق المستهدفة، وأي منتجات أو مواصفات مرجعية. كلما قدمت تفاصيل أكثر، أصبح عرض الأسعار الخاص بنا أسرع وأكثر دقة.
    - q: ما هو موك لقوارب RIB المخصصة؟
      a: بالنسبة لقوالب الهيكل الموجودة مع التعديلات القياسية، يبدأ موك بـ 2-5 وحدات لكل تصميم. بالنسبة للقوالب المخصصة والتطوير المخصص الكامل، يعتمد موك على مدى تعقيد المشروع - عادةً 10-20 وحدة لشبه مخصصة و30+ للتخصيص الكامل مع الأدوات الجديدة.
    - q: من يملك القوالب والرسومات المخصصة؟
      a: تظل القوالب التي تم تطويرها باستخدام تصميمات قاعدة Aquafarer ملكية خاصة بـ Aquafarer. يمكن تخصيص القوالب المخصصة بالكامل والتي يتم طلبها ودفع ثمنها من قبل العميل لملكية العميل وفقًا لشروط العقد. يتم توثيق جميع شروط ملكية القالب قبل بدء المشروع.
    - q: كيف يتم تعبئة RIBs المخصصة للتصدير؟
      a: 'قياسي: مهد مخصص + غلاف مطاطي لتحميل الحاويات. قسط: التعبئة والتغليف الجاهزة للبيع بالتجزئة، حزمة فراغ، أو على منصات نقالة. نحن نقدم الشحن FOB Qingdao وCIF وDDP. وثائق التصدير الكاملة والتخليص الجمركي متضمنة.'
