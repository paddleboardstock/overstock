content_customization:
  tagline: ما يمكن تخصيصه
  title: تخصيص RIB<br />الخيارات
  subtitle: يمكن تصميم كل عنصر من عناصر قارب RIB وفقًا لمتطلبات التطبيق والسوق والعلامة التجارية الخاصة بك.
  items:
    - title: هال والهيكلية
      description: طول الهيكل (2.5-8.5 م)، مادة الهيكل (ألياف زجاجية GRP أو ألومنيوم من الدرجة البحرية)، لون الهيكل (طبقة هلامية أو مطلية)، شكل العارضة (عميق على شكل V، معتدل على شكل حرف V، مسطح)، نوع العارضة (عارضة مغلقة مع قوس أو بئر)، والتعزيز الهيكلي لمتطلبات الحمل التجاري.
      icon: tabler:sailboat
    - title: أنبوب وطوق
      description: مادة الأنبوب (0.9-1.2 مم PVC أو 1.4-1.7 مم Hypalon/CSM)، قطر الأنبوب (40-55 سم)، عدد الغرف (3-7)، نوع الصمام (Halkey-Roberts، Leafield D7، أو Boston)، لون الأنبوب (قياسي أو مخصص)، وتكوين مخروطي/تفتق طوق.
      icon: tabler:circle
    - title: تخطيط سطح السفينة ووحدة التحكم
      description: الكونسول الوسطي، الكونسول الجانبي، أو عجلة القيادة. تصميم المقاعد (مقاعد الفارس، مقاعد البدلاء، المقاعد الداعمة). غطاء السطح (مظهر خشب الساج الرغوي EVA، طلاء غير قابل للانزلاق، أو GRP العاري). نقاط تركيب المعدات، وقضبان الإمساك، ومواضع الحلقة على شكل حرف D.
      icon: tabler:layout-dashboard
    - title: الكهربائية والملاحة
      description: أضواء الملاحة (LED)، ونظام مضخة ماء آسن، وإدارة البطارية، وتركيب راديو VHF، وتركيب GPS/مخطط الرسم البياني، ومنافذ شحن USB، وتكوين لوحة التبديل.
      icon: tabler:bolt
    - title: العلامات التجارية والرسومات
      description: رسومات الهيكل والأنبوب (طباعة الشاشة، ونقل الحرارة، والطباعة الرقمية بالأشعة فوق البنفسجية)، ووضع الشعار، وأنظمة الألوان المخصصة، وعلامات التعريف، ووثائق المالك المخصصة مع علامتك التجارية.
      icon: tabler:palette
    - title: السلامة والامتثال
      description: تصنيف فئة التصميم (A/B/C/D لكل RCD)، ونظام إخماد الحرائق، ومواصفات نظام الوقود (خزان محمول، خزان ثابت، خزان سفلي)، وحزمة وثائق الامتثال للسوق المستهدف.
      icon: tabler:shield
content_applications:
  tagline: تكوينات التطبيق
  title: تكوينات RIB<br />حسب التطبيق
  subtitle: تتطلب المهام المختلفة تكوينات مختلفة. فيما يلي إعدادات مثبتة لتطبيقات RIB الأكثر شيوعًا.
  items:
    - title: الإنقاذ والدورية
      description: هيكل عميق على شكل حرف V، وأنابيب هيبالون، وسطح ذاتي الكفالة، ومقاعد داعمة، ومقابض للإمساك، وأضواء الملاحة، وحلقات على شكل حرف D للخدمة الشاقة. فئة تصميم RCD B أو C. نظام وقود مقاوم للحريق وكهربائي من الدرجة التجارية.
      icon: tabler:lifebuoy
    - title: دعم الغوص
      description: شعاع عريض، وسلم صعود خلفي، ومواضع حامل الخزان، وحلقات D إضافية، وحامل علم الغوص، ورافعة معززة للألواح الخارجية المزدوجة، وغطاء EVA كامل السطح غير قابل للانزلاق.
      icon: tabler:mask
    - title: السياحية والتجارية
      description: تصميم معتمد للركاب مع مقاعد طويلة، ومظلة/بيميني، وقضبان إمساك، وتخزين جاف، ونظام بطارية مزدوج. RCD الفئة C. مصممة لعمليات المنتجعات والأسطول المستأجر.
      icon: tabler:beach
    - title: صيد السمك
      description: تصميم سطح مفتوح، ومواضع حامل القضيب، وبئر الطعم الحي، وحامل مكتشف الأسماك، وحامل محرك التصيد، ورافعة معززة، ونظام وقود محمول. خيارات الكونسول الوسطي أو الكونسول الجانبي.
      icon: tabler:fish
    - title: مناقصة الترفيه واليخوت
      description: هيكل خفيف الوزن، وأنابيب PVC، ومقاعد مريحة، ومحراث متداخل أو وحدة تحكم مدمجة، ونقاط رفع للرافعة، وخزان وقود قابل للإزالة. التجمع الكونغولي من أجل الديمقراطية الفئة C أو D.
      icon: tabler:sailboat
    - title: قارب العمل المهني
      description: خيار الهيكل المصنوع من الألومنيوم، والتعزيز للخدمة الشاقة، والتوجيه الهيدروليكي، والقوس الكهربائي التجاري، وقوس الرادار، ونقاط تكامل المعدات الخاصة بالمهمة. الامتثال المخصص لكل مشروع.
      icon: tabler:anchor
process_steps:
  title: عملية تطوير RIB OEM/ODM مكونة من 7 خطوات
  subtitle: من ملخص المشروع إلى ما بعد البيع - سير عمل محدد بمراحل وتسليمات واضحة
  steps:
    - number: '01'
      title: ملخص المشروع ومتطلباته
      description: حدد التطبيق المستهدف وحجم الهيكل ومواد الأنبوب ومتطلبات الامتثال واحتياجات العلامة التجارية. نقوم بتقييم الجدوى وتأكيد نموذج التعاون (OEM/ODM/شبه مخصص/مخصص بالكامل).
      timeline: 3-5 أيام
    - number: '02'
      title: المراجعة الفنية والجدوى
      description: يقوم الفريق الهندسي بمراجعة الجدوى الهيكلية، وحسابات الاستقرار والطفو، ومسار الامتثال، وتوافر المواد. نحدد القوالب الموجودة أو متطلبات القالب المخصص.
      timeline: 5-7 أيام
    - number: '03'
      title: الاقتراح والاقتباس
      description: احصل على عرض تفصيلي يتضمن المواصفات والعروض ثلاثية الأبعاد أو رسومات GA ونطاق الامتثال والجدول الزمني وتسعير الوحدة بناءً على مستويات الحجم وموك.
      timeline: 5-7 أيام
    - number: '04'
      title: تأكيد التصميم وأخذ العينات
      description: الموافقة على GA النهائي وتخطيط السطح وتكوين الأنبوب. نحن ننتج عينة ما قبل الإنتاج بألوان علامتك التجارية وشعارك والمواد المحددة للفحص الفعلي.
      timeline: 15-20 يوما
    - number: '05'
      title: الموافقة على العينة وبروتوكول مراقبة الجودة
      description: 'فحص العينة والموافقة عليها. حدد بروتوكول مراقبة جودة الإنتاج: اختبار الضغط (1.25x / 24–48 ساعة)، وفحوصات الأبعاد، وقائمة مراجعة وثائق الامتثال لكل هيكل.'
      timeline: 3-5 أيام
    - number: '06'
      title: الإنتاج الضخم ومراقبة الجودة
      description: يتم تشغيل الإنتاج الكامل مع قائمة مراجعة مراقبة الجودة المكونة من 100 نقطة لكل وحدة. عمليات التفتيش أثناء العملية، واختبار الضغط، والتتبع على المستوى التسلسلي. تم إعداد وثائق CE/ISO بالتوازي.
      timeline: 30-45 يوما
    - number: '07'
      title: التعبئة والشحن وخدمات ما بعد البيع
      description: التغليف المخصص (قياسي، أو جاهز للبيع بالتجزئة، أو على منصات نقالة)، ووثائق التصدير، وتحميل الحاويات، والخدمات اللوجستية. مجموعات قطع الغيار ووثائق الصيانة متضمنة.
      timeline: 7-14 يومًا
