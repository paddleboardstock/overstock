content_challenge:
  tagline: التحدي
  title: القوارب المساعدة لليخوت تتطلب<br />أداءً ومظهرًا أنيقًا
  subtitle: القارب المساعد لليخت هو أكثر من مجرد قارب صغير — إنه امتداد للسفينة الأم وبيان عن الجودة.
  paragraphs:
    - يحتاج أصحاب اليخوت والقباطنة إلى مناقصات ذات أداء جيد، وتخزينها بشكل مضغوط، وتقديمها بشكل جميل. يجب أن يكمل العطاء جماليات اليخت مع توفير وسائل نقل موثوقة للضيوف وأفراد الطاقم.
    - '**التخزين أمر بالغ الأهمية** — يجب أن يتم وضع سفينة العطاء على سطح السفينة أو في المرآب أو على رافعات الرفع. الوزن مهم لأنظمة الإطلاق والاسترداد. Aquafarer توفر RIBs نسبًا ممتازة من القوة إلى الوزن مع ملفات تعريف تخزين مدمجة.'
    - '**توقعات الأداء مرتفعة** — يتوقع الضيوف رحلة سلسة وجافة عند نقلهم إلى الشاطئ. يجب أن توازن خيارات المحرك بين السرعة والمدى ومستويات الضوضاء للحصول على تجربة متميزة. بالنسبة لعمليات التأجير، يتم تشغيل العطاء يوميًا ويجب أن يتحمل الاستخدام المتكرر.'
    - '**المظهر مهم** — العطاء غير المتطابق أو البالي ينتقص من العرض العام لليخت. تضمن ألوان الأنابيب والمفروشات والعلامات التجارية المخصصة أن يبدو العطاء كما لو كان ينتمي إليه.'
content_solution:
  tagline: الحل لدينا
  title: تكوينات العطاء<br />لكل تطبيق لليخوت
  subtitle: Aquafarer RIB يمكن تخصيص المناقصات لتتناسب مع سفينتك ونوع التشغيل ومتطلبات التخزين - بدءًا من مواصفات صانع اليخوت الفاخرة وحتى برامج الأسطول المستأجر.
  list:
    - ألوان أنبوبية مخصصة لتتناسب مع الوعاء الأم أو تكمله — يتوفر أي لون RAL للأنابيب Hypalon أو PVC
    - تنجيد وخياطة مخصصة - فينيل بحري فاخر مع مطابقة الألوان وتطريز الشعار
    - وحدة التحكم أو توجيه المحراث — اختر بناءً على نمط الاستخدام وتفضيلات المشغل
    - هيكل مصنوع من الألياف الزجاجية deep-V لركوب سلس وجاف في الظروف البحرية المختلفة
    - تخزين مدمج - يفرغ أو يعشش لجراج سطح السفينة، أو الخزانة، أو تخزين الرافعة
    - Hypalon أنابيب لمقاومة الأشعة فوق البنفسجية والحفاظ على المظهر على المدى الطويل
    - نقاط الرفع وحلقات السحب قياسية في جميع الطرازات
    - غطاء مقوس اختياري، وغطاء كامل، وواقيات حماية
    - 'نطاق المحرك: 15 HP إلى 60 HP — تكوينات خارجية أو محراث'
    - OEM/ العلامات الخاصة متاحة لبناة اليخوت وتجار البحرية
content_segments:
  tagline: ملفات تعريف العملاء
  title: حلول عطاءات اليخوت<br />حسب نوع العميل
  subtitle: قطاعات صناعة اليخوت المختلفة لها متطلبات فريدة. Aquafarer يقوم بتهيئة المناقصات لتتناسب مع كل طلب.
  items:
    - title: بناة اليخوت الفاخرة
      subtitle: OEM تكامل العطاء - الأبعاد والألوان والمواد المخصصة
      description: 'يواجه صانعو اليخوت تحديًا متكررًا: كل سفينة جديدة لديها قيود أبعاد فريدة وحدود للوزن وتوقعات جمالية. يجب أن تتكامل العطاءات بشكل مثالي مع نظام الرفع للسفينة الأم، وأن تتلاءم مع أبعاد المرآب الدقيقة، وتتوافق مع لغة التصميم الخاصة باليخت الذي تبلغ قيمته عدة ملايين من اليورو. أي عدم تطابق - لون أنبوب خاطئ، وضع غير صحيح لنقطة الرفع، وزن غير متوافق - يؤخر التسليم وينعكس بشكل سيء على منشئ المنتج. Aquafarer يعمل مباشرة مع فرق المشتريات والتصميم الخاصة بالباني لتقديم المناقصات بألوان أنبوب RAL المخصصة والمفروشات المطابقة ولوحات التحكم ذات العلامات التجارية وحزم الوثائق OEM الكاملة.'
      features:
        - مواصفات الأبعاد المخصصة التي تتوافق مع قيود المرآب والرافعة
        - أي لون لأنبوب RAL ومواد تنجيد مطابقة - يتم توفير عينات الموافقة على التصميم
        - OEM علامة تجارية على وحدة التحكم والأنبوب وظهور المقاعد
        - التحقق من صحة نقطة الرفع وملاءمة الرافعة لكل نموذج
        - تم تحسين وزن الهيكل لأنظمة الإطلاق والاسترداد المحددة
        - تتماشى جدولة التسليم بالجملة مع الجداول الزمنية للإنتاج
    - title: شركات إدارة اليخوت
      subtitle: المناقصات الموحدة للأسطول - دعم عالمي، والحد الأدنى من فترات التوقف عن العمل
      description: تشرف شركات الإدارة على العديد من اليخوت العاملة عبر البحر الأبيض المتوسط ​​ومنطقة البحر الكاريبي وجنوب المحيط الهادئ وخارجها. إن حاجتهم الأساسية هي الموثوقية - فتعطل العطاء في ميناء بعيد يعني العمل الإضافي للطاقم، وشكاوى الضيوف، واستبدالات باهظة الثمن في اللحظة الأخيرة. تعمل مواصفات الأسطول الموحدة على تقليل وقت تدريب الطاقم عبر السفن وتبسيط إدارة قطع الغيار. Aquafarer يقدم أسعارًا لأساطيل متعددة السفن ومواصفات متسقة عبر الطلبات ودعمًا عالميًا لقطع الغيار لشركات الإدارة التي لديها سفن في مناطق متعددة.
      features:
        - مواصفات موحدة عبر الأسطول المُدار بالكامل
        - قطع غيار قابلة للتبديل في جميع مناقصات الأسطول
        - تسعير الأسطول وخصومات الحجم للطلبات متعددة الوحدات
        - توافر قطع الغيار عالميًا — شحن سريع إلى أي ميناء
        - وثائق الخدمة والصيانة المتسقة للطاقم
        - تنسيق تسليم الوحدات المتعددة إلى مواقع السفن المختلفة
    - title: مشغلي تأجير اليخوت
      subtitle: عمليات يومية عالية التردد - المتانة دون المساس بالمظهر
      description: 'تواجه مناقصات الاستئجار الجدول التشغيلي الأكثر صعوبة في صناعة اليخوت: النقل اليومي للضيوف، والرحلات الشاطئية، ودعم الرياضات المائية، ومناقصات الموانئ - غالبًا ما تزيد عن 200 عملية في موسم الاستئجار. يجب أن يبدو العطاء أصليًا عند تسليم كل ضيف مع تحمل الصعود المستمر والتعرض للمياه المالحة وساعات المحرك. يعد تدهور المظهر مصدر قلق تجاري مباشر - حيث تؤثر العطاءات البالية على تقييمات الضيوف وأسعار الاستئجار. Aquafarer يقوم بتكوين عطاءات الاستئجار من خلال تنجيد مطور وأنابيب Hypalon للخدمة الشاقة ومناطق مناولة معززة لتحقيق متانة طويلة الأمد تحافظ على جودة العرض التقديمي.'
      features:
        - أنابيب Hypalon للخدمة الشاقة - عمر 5-8 سنوات في خدمة التأجير اليومية
        - خطوات صعود معززة ومعالجة خطوط الإمساك للاستخدام المتكرر
        - تنجيد فينيل ممتاز مقاوم للبقع - تنظيف سهل بين المواثيق
        - أسطح سطحية سهلة التنظيف وغير قابلة للانزلاق
        - مجموعات خارجية موثوقة مع سهولة الوصول إلى الخدمة لتحقيق إنجاز دقيق
        - مواد من فئة مستحضرات التجميل تحافظ على المظهر عبر مواسم الاستئجار
    - title: تجار وسماسرة اليخوت
      subtitle: توريد مناقصة موثوقة لإكمال السفينة وقيمة إعادة البيع
      description: يحتاج التجار والوسطاء إلى إمدادات مستقرة من المناقصات عالية الجودة التي تكمل السفن التي يبيعونها - بما يتوافق مع وضع العلامة التجارية ويعزز تجربة المشتري. يمكن أن تؤدي العطاءات غير المتسقة أو تأخير العرض إلى تأخير تسليم اليخت أو تقليل عرض القائمة. يحتاج التجار إلى جودة متسقة عبر الدفعات، وفترات زمنية موثوقة، وأسعار تنافسية للحفاظ على الهوامش. Aquafarer يقدم برامج مخزون الوكلاء مع جدولة التسليم الموسمية، وخيارات العلامة التجارية المشتركة لعرض صالة العرض، وتخصيص الأولوية خلال موسم الذروة.
      features:
        - برامج تخزين المخزون مع النماذج المتاحة حسب الطلب
        - جدولة التسليم الموسمية تتماشى مع تقويم التسليم
        - العلامة التجارية المشتركة للموزع على وحدة التحكم والأنابيب لعرضها في صالة العرض
        - جودة ومواصفات متسقة عبر جميع الطلبات المجمعة
        - أسعار تنافسية للموزعين مع مستوى يعتمد على الحجم
