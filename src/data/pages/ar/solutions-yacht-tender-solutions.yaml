  list:
    - خفيفة الوزن وصغيرة الحجم عند تفريغها من الهواء - سهلة التخزين في المرآب أو الخزانة أو حامل سطح السفينة
    - Hypalon البناء - مقاومة فائقة للأشعة فوق البنفسجية لتخزين المارينا في الشمس الاستوائية
