hero:
  tagline: قدرة الإنتاج
  title: القدرة التصنيعية والإنتاج السنوي
  subtitle: مرفق بمساحة 12,000 م² ينتج 15,000 لوح سنويًا مع إمكانية التوسع
intro: Paddle Board Overstock تدير واحدة من أكبر مرافق تصنيع الألواح القابلة للنفخ المخصصة في ويهاي، الصين. مصنعنا الذي تبلغ مساحته 12,000 م² منظم في ست ورش متخصصة تعمل بالتوازي، مما يمنحنا القدرة على إنتاج 15,000 لوح سنويًا على جميع خطوط الألواح الشاملة والجولات والسلسلة الفنية SUP.
highlights:
  - value: 12,000 m²
    label: إجمالي مساحة التصنيع
    detail: عبر 6 ورش متخصصة
  - value: 15,000
    label: عدد اللوحات المنتجة سنويًا
    detail: جميع أنواع الألواح، الجولات والسلسلة الفنية SUPs
  - value: 200-300
    label: قوى عاملة ماهرة
    detail: 25+ مهندسًا، ورديتان/اليوم
  - value: 50+
    label: الدول المصدرة
    detail: الاتحاد الأوروبي، الولايات المتحدة، أستراليا، الشرق الأوسط، آسيا
  - value: 2-3
    label: أيام العمل للشحن
    detail: الطلبات المتوفرة في المخزون تغادر ويهاي بسرعة
  - value: 10+
    label: سنوات الخبرة في التصدير
    detail: منذ 2012
workshops:
  - title: SUP إنتاج الألواح
    description: '4 خطوط تجميع موازية للألواح القابلة للنفخ SUP. يمكن لكل خط إنتاج 50–80 لوحًا لكل وردية. تعمل محطات الطباعة الرقمية والطباعة بالشاشة بالتوازي. الطاقة السنوية: 8,000+ لوح.'
    output: 8,000+ SUPs/سنة
  - title: فن الجناح و EVA التشطيب
    description: ورشة مخصصة لتشطيب الألواح الفنية. قص دقيق EVA، نماذج الألواح موضوعة يدويًا، وقص نهائي. تغطي الطاقة السنوية كامل مجموعة الألواح الفنية.
    output: مجموعة كاملة من الألواح الفنية
  - title: Drop-Stitch الترقق
    description: 'خطوط الترقق الحراري تربط النوى drop-stitch بأغلفة PVC الخارجية. أحزمة الألواح الثلاثية الطبقات ملتحمة لتوفير قوة محكمة الإغلاق. القدرة السنوية: 15,000+ نواة.'
    output: 15,000+ نواة/سنة
  - title: الإكسسوارات والتعبئة
    description: خطوط تجميع وتعبئة الإكسسوارات للمضخات والمجاديف والأحبال ومجموعات الإصلاح. يتم تعبئة الألواح تفريغياً، ثم وضعها في صناديق وأسلوب تحزيم على منصات للنقل حول العالم.
    output: حزم كاملة، جاهزة للشحن
