hero:
  tagline: الطاقة الإنتاجية
  title: الطاقة الإنتاجية والإنتاج السنوي
  subtitle: منشأة بمساحة 12,000 م² تنتج 15,000 قارب سنويًا مع مساحة للتوسع

intro: تدير Aquafarer واحدة من أكبر المنشآت المتخصصة في تصنيع القوارب القابلة للنفخ في تشينغداو، الصين. مصنعنا البالغة مساحته 12,000 م² مقسم إلى ستة ورش متخصصة تعمل بالتوازي، مما يمنحنا القدرة على إنتاج 15,000 قارب سنويًا عبر خطوط SUP والكاياك والقوارب الصغيرة وRIB ومعدات السلامة.

highlights:
  - value: 12,000 m²
    label: إجمالي مساحة الإنتاج
    detail: موزعة على 6 ورش متخصصة
  - value: 15,000
    label: القوارب المنتجة سنويًا
    detail: SUPs وكاياكات وRIBs وقوارب صغيرة ومعدات سلامة
  - value: 200-300
    label: عمالة ماهرة
    detail: أكثر من 25 مهندسًا، وورديتان/يوم
  - value: 50+
    label: أسواق التصدير
    detail: الاتحاد الأوروبي، الولايات المتحدة، أستراليا، الشرق الأوسط، آسيا
  - value: 30–45
    label: مدة التسليم القياسية (أيام)
    detail: من تأكيد أمر الشراء إلى FOB
  - value: 10+
    label: سنوات من خبرة التصدير
    detail: منذ 2012

workshops:
  - title: إنتاج ألواح SUP
    description: '4 خطوط تجميع متوازية لألواح SUP القابلة للنفخ. كل خط يمكنه إنتاج 50-80 لوحًا لكل وردية. محطات الطباعة الرقمية والطباعة الشبكية تعمل بالتزامن. الطاقة السنوية لـ SUP: أكثر من 8,000 لوح.'
    output: 8,000+ SUP/سنويًا
  - title: إنتاج قوارب RIB
    description: 'ورشة مخصصة للهياكل المصنوعة من الألياف الزجاجية تحتوي على 6 محطات قوالب لهياكل RIB حتى 7.6 م. منطقة لحام الأنابيب والتجميع تتعامل مع 3-5 قوارب RIB في آن واحد. الطاقة السنوية لـ RIB: أكثر من 2,000 قارب.'
    output: 2,000+ RIB/سنويًا
  - title: القوارب القابلة للنفخ والقوارب الصغيرة
    description: 'خطوط إنتاج متعددة الأغراض للقوارب القابلة للنفخ والكاياكات والقوارب الصغيرة. محطات اللحام بالهواء الساخن ومكابس RF العازلة ومحطات التجميع تُعاد تهيئتها حسب مزيج الطلبات. الطاقة السنوية: أكثر من 5,000 وحدة.'
    output: 5,000+ وحدة/سنويًا
  - title: معدات السلامة
    description: 'منطقة إنتاج منفصلة بغرفة نظيفة لسترات النجاة ومعدات السلامة. خياطة مخصصة وإدخال الإسفنج ومحطات اختبار. الطاقة السنوية لسترات النجاة: أكثر من 50,000 وحدة.'
    output: 'أكثر من 50,000 سترة نجاة/سنويًا'

oem_capacity:
  moq: 'SUP: 5-10 وحدات | RIB: 2-5 وحدات | كاياك/قارب صغير: 10-20 وحدة | قالب مخصص: 200+ وحدة'
  lead_time: 'القياسي 30-45 يومًا. العينة 15-20 يومًا. خدمة عاجلة متاحة.'
  payment: 'T/T دفعة مقدمة 30% + 70% قبل الشحن. يتم قبول L/C وWestern Union.'
