testimonial:
  content: قامت شركة Paddle Board Overstock بتصميم وتجهيز برنامج الأنشطة الشاطئية بالكامل عبر ثلاثة منتجعات. 80 مركبة SUP، و40 قارب كاياك، وبنية تحتية للسلامة، وتدريب الموظفين - يتم تسليمها جميعًا في شحنة واحدة. زادت مشاركة ضيوفنا في الأنشطة المائية بنسبة 60% في الموسم الأول.
  name: صوفي لوران
  title: مدير تجربة الضيوف، منتجعات Azure Bay - فوكيت، تايلاند
content_segments:
  tagline: ملفات تعريف المنتجع
  title: حلول الضيافة على الواجهة البحرية<br />حسب نوع العقار
  subtitle: تتمتع كل ملكية منتجعية بملف تعريف فريد للضيوف ومزيج من الأنشطة وإيقاع تشغيلي - بدءًا من النزل الصديقة للبيئة وحتى المنتجعات الفاخرة المترامية الأطراف على شاطئ البحر. نقوم بتصميم برامج الرياضات المائية التي تتوافق مع فئة الفندق وتوقعات الضيوف.
  items:
    - title: منتجعات فاخرة على شاطئ البحر
      subtitle: نقل كبار الشخصيات، والأنشطة المائية، وتجربة ضيوف متميزة
      description: العقارات الراقية المطلة على الشاطئ - مثل فور سيزونز وأمان والمجموعات الفاخرة المماثلة - حيث تعتبر الرياضات المائية من وسائل الراحة المميزة للضيوف مما يؤدي إلى تحقيق درجات الرضا والإيرادات الإضافية. يجب أن يبدو الأسطول متميزًا، وأن يقدم تنوعًا عبر الفئات العمرية ومستويات القدرة، وأن يتكامل بسلاسة مع أنظمة الكونسيرج والحجز الموجودة في المنتجع. توقعات ظهور الضيف مرتفعة للغاية - تؤثر حالة المعدات وطريقة العرض بشكل مباشر على تقييمات الخمس نجوم.
      features:
        - 'أسطول فاخر يحمل العلامة التجارية: SUPs وقوارب الكاياك وقوارب الدواسات وقوارب تندر RIB صغيرة'
        - 'عرض جاهز للضيوف: ألوان مطابقة لألوان المنتجع، وعلامة تجارية بالشعار، وعرض مُنسّق للمعدات'
        - قارب RIB فاخر صغير لنقل كبار الشخصيات مع تنجيد مخصص ومطابقة الألوان
        - 'بنية تحتية متكاملة للسلامة: خطوط العوامات، ومنصات الإنقاذ، وجهاز AED'
        - 'إدارة الإيرادات: قوالب التسعير الديناميكي، والتدريب على زيادة المبيعات، وتجميع الحزم'
    - title: منتجعات الجزيرة الخاصة
      subtitle: نقل الضيوف في جميع الأحوال الجوية - بدون توقف، وموثوقية مطلقة
      description: تعمل منتجعات الجزر الخاصة في مواقع نائية حيث يكون القارب هو وسيلة الاتصال الوحيدة بالبر الرئيسي. تعتمد عمليات النقل اليومية للضيوف وعمليات الإمدادات والإجلاء الطبي في حالات الطوارئ على سفينة واحدة - وأي فترة توقف عن العمل تؤثر بشكل مباشر على تجربة الضيوف وعمليات المنتجع. يحتاج هؤلاء المشغلون إلى قارب يعمل بشكل موثوق في جميع الظروف الجوية، ويتطلب الحد الأدنى من الصيانة، ولديه أنظمة احتياطية للاعتمادية في المهام الحرجة. يجب أيضًا أن يكون القارب جميلًا عند وصول الضيوف إلى الجزيرة.
      features:
        - تكوين RIB لجميع الأحوال الجوية مع حماية كاملة من الطقس وأنابيب معززة
        - تجهيز بمحرك مزدوج أو محرك احتياطي لعمليات بدون توقف
        - بناء Hypalon بجودة تجارية لعمر افتراضي من 5 إلى 8 سنوات في الخدمة النائية
        - تصميم سهل الصيانة بمكونات يسهل الوصول إليها للصيانة في الموقع
        - علامة تجارية مخصصة للمنتجع وتنجيد فاخر يتناسب مع جمالية الجزيرة
    - title: منتجعات ليكسايد آند إيكو
      subtitle: تجارب ضيوف متكاملة مع الطبيعة
      description: توفر العقارات الواقعة على ضفاف البحيرة والنزل البيئية والملاذات الطبيعية أنشطة مائية هادئة ومنخفضة التأثير تكمل البيئة الطبيعية. يجب أن تكون المعدات غير مزودة بمحركات حيثما أمكن، وأن تكون سهلة التخزين في مراكب ذات مساحة محدودة، وأن تكون هادئة الاستخدام للحفاظ على التجربة المحيطة لجميع الضيوف.
      features:
        - 'أسطول غير مزود بمحركات: SUPs وقوارب كاياك وقوارب كانو وقوارب دواسة'
        - محطات نفخ بمضخات كهربائية هادئة لاستخدام الضيوف عند الطلب
        - مواد وتغليف صديقة للبيئة تتوافق مع العلامة التجارية للاستدامة
        - تشمل أنظمة الرفوف وأنظمة تنظيم حظائر القوارب
    - title: نوادي الشاطئ
      subtitle: نقل الضيوف والترفيه وضلع صغير فاخر
      description: تدير نوادي الشاطئ بيئة عالية الطاقة ومركزة بصريًا حيث تكون المعدات جزءًا من الغلاف الجوي. إنهم بحاجة إلى أحزمة صغيرة فاخرة لنقل الضيوف من الفنادق أو الأرصفة القريبة، وألعاب مائية لترفيه الضيوف - سحب جت سكي، ومنزلقات قابلة للنفخ، وألواح التجديف. يجب أن يبدو الأسطول أنيقًا وسهل التشغيل ويتحمل الاستخدام اليومي من قبل الضيوف بمستويات مهارات مختلفة. يعد التخزين والنشر السريع أمرًا بالغ الأهمية خلال ساعات الذروة.
      features:
        - قارب RIB فاخر مدمج (3.3-4.3 م) لنقل الضيوف وخدمة التندر
        - 'ألعاب مائية: عوامات قابلة للسحب، وألواح SUP، وقوارب كاياك لترفيه الضيوف'
        - لون وعلامة تجارية مخصصان يتماشيان مع الهوية البصرية لنادي الشاطئ
        - أنظمة إطلاق واسترجاع سريعة لعمليات ذات دوران مرتفع
        - بناء Hypalon متين لتحمل التعرض اليومي للمياه المالحة والأشعة فوق البنفسجية
    - title: نوادي الأعضاء الخاصة ونوادي اليخوت
      subtitle: نقل الميناء، مناقصات الأعضاء، الرياضات المائية الحصرية
      description: النوادي الخاصة حيث تعتبر الرياضات المائية والنقل بالقوارب منفعة للأعضاء وليست مصدرًا للإيرادات. يجب أن تلبي المعدات معايير جمالية أعلى، وأن تكون متاحة عند الطلب للأعضاء، وتتطلب الحد الأدنى من إشراف الموظفين. تحتاج نوادي اليخوت في مارينا على وجه التحديد إلى مناقصات للنقل في الميناء - نقل الأعضاء بين الرصيف والمرسى والشاطئ. يجب أن يكون التخزين والصيانة غير مرئيين للأعضاء.
      features:
        - قوارب RIB تندر عالية المستوى للنقل المينائي وخدمة نقل الأعضاء
        - 'معدات فاخرة: أسطح EVA، وألوان مخصصة للأعضاء، وتنجيد بالعلامة التجارية'
        - نظام إعارة ذاتي الخدمة لوصول الأعضاء دون موظفين
        - التخزين في غير الموسم وبرنامج تحديث سنوي
    - title: فنادق تركز على المغامرة والأنشطة
      subtitle: الجولات المصحوبة بمرشدين ويوجا SUP ورحلات الغطس والأنشطة الجماعية
      description: تضع العقارات نفسها كوجهات للمغامرة - حيث تقدم جولات بصحبة مرشدين، ويوجا SUP، والمجاديف عند غروب الشمس، ورحلات الغطس، والأنشطة الجماعية. يحتاج الأسطول إلى دعم كل من نماذج التأجير المجاني والبرامج الموجهة، مع المعدات التي تنتقل بسلاسة بين الاستخدام الذاتي للضيوف والجولات التي يقودها المدرب. تحتاج هذه العقارات إلى معدات متينة لدوران عالي التردد، مع سهولة التنظيف بين مجموعات الضيوف.
      features:
        - أسطول مختلط متعدد الاستخدامات يدعم نماذج التأجير + الجولات المصحوبة بمرشد
        - كاياكات تاندم ومنصات SUP فائقة الثبات للأنشطة الجماعية
        - 'معدات المرشد: ألواح المدربين، وصناديق محكمة، واتصالات مقاومة للماء'
        - 'تناوب موسمي للمعدات: أسطول الصيف → برنامج التخزين الشتوي'
        - بناء متين معتمد للاستخدام اليومي من قبل الضيوف بأقل صيانة
