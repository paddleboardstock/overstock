testimonial:
  content: Paddle Board Overstock صممت وجهزت برنامج الأنشطة الشاطئية بالكامل لدينا عبر ثلاثة منتجعات. 120 SUPs، بنية السلامة التحتية، وتدريب الموظفين — جميعها تم توصيلها في شحنة واحدة. زادت مشاركة نزلائنا في الأنشطة المائية بنسبة 60٪ في الموسم الأول.
  name: صوفي لوران
  title: مدير تجربة الضيوف، منتجعات Azure Bay - فوكيت، تايلاند
content_segments:
  tagline: ملفات تعريف المنتجع
  title: حلول الضيافة على الواجهة البحرية<br />حسب نوع العقار
  subtitle: تتمتع كل ملكية منتجعية بملف تعريف فريد للضيوف ومزيج من الأنشطة وإيقاع تشغيلي - بدءًا من النزل الصديقة للبيئة وحتى المنتجعات الفاخرة المترامية الأطراف على شاطئ البحر. نقوم بتصميم برامج الرياضات المائية التي تتوافق مع فئة الفندق وتوقعات الضيوف.
  items:
    - title: منتجعات فاخرة على شاطئ البحر
      subtitle: نقل كبار الشخصيات، والأنشطة المائية، وتجربة ضيوف متميزة
      description: العقارات الراقية المطلة على الشاطئ - مثل فور سيزونز وأمان والمجموعات الفاخرة المماثلة - حيث تعتبر الرياضات المائية من وسائل الراحة المميزة للضيوف مما يؤدي إلى تحقيق درجات الرضا والإيرادات الإضافية. يجب أن يبدو الأسطول متميزًا، وأن يقدم تنوعًا عبر الفئات العمرية ومستويات القدرة، وأن يتكامل بسلاسة مع أنظمة الكونسيرج والحجز الموجودة في المنتجع. توقعات ظهور الضيف مرتفعة للغاية - تؤثر حالة المعدات وطريقة العرض بشكل مباشر على تقييمات الخمس نجوم.
      features:
        - أسطول بعلامة تجارية مميزة من SUPs بألوان المنتجعات المطابقة
        - 'عرض جاهز للضيوف: ألوان المنتجعات المطابقة، شعار العلامة التجارية، عرض المعدات بشكل منسق'
        - ألواح سلسلة الفن المميزة لتجارب نزلاء مميزة وللحظات التصوير
        - 'بنية السلامة المتكاملة: خطوط عوامة، محطات إنقاذ، جهاز إزالة الرجفان الخارجي الآلي (AED)'
        - 'إدارة الإيرادات: قوالب تسعير ديناميكية، تدريب على البيع الإضافي، تجميع الباقات'
    - title: منتجعات الجزيرة الخاصة
      subtitle: أنشطة مائية هادئة ومكتفية ذاتيا للضيوف
      description: 'المنتجعات الخاصة في الجزر تعمل في مواقع نائية حيث اللوجستيات معقدة وكل توصيل مهم. يجب أن تكون أنشطة المياه للضيوف مكتفية ذاتيا: معدات تخزن بشكل مكثف، وتنتفخ عند الطلب، وتتطلب صيانة قليلة، وتظهر بشكل جميل عند وصول الضيوف. نخطط لبرامج الأسطول حول نوافذ الطائرات البحرية والشحن البحري، وبناءنا المتين يحافظ على تجهيز المعدات للضيوف طوال المواسم الطويلة دون دعم من البر الرئيسي.'
      features:
        - أسطول مدمج قابل للنفخ — السفن والمخازن بكفاءة في الجزر النائية
        - بناء من الدرجة التجارية PVC للاستخدام متعدد المواسم للضيوف
        - صيانة سهلة في الموقع مع مجموعات إصلاح مرفقة وإرشادات فيديو
        - علامة منتجع مخصصة تتناسب مع جمالية الجزيرة
    - title: منتجعات ليكسايد آند إيكو
      subtitle: تجارب ضيوف متكاملة مع الطبيعة
      description: العقارات على ضفاف البحيرة، والنزل البيئية، والمنتجعات الطبيعية التي تقدم أنشطة مائية هادئة منخفضة التأثير تكمل البيئة الطبيعية. يجب أن تكون المعدات غير مزودة بمحركات حيثما أمكن، وسهلة التخزين حيث تكون المساحة محدودة، وسهلة الاستخدام للحفاظ على التجربة المحيطة لجميع الضيوف.
      features:
        - SUP أسطول غير محرك في سلسلة فنية مستوحاة من الطبيعة
        - محطات نفخ مضخة كهربائية هادئة لاستخدام الضيوف عند الطلب
        - المواد والتغليف الصديقة للبيئة تتماشى مع العلامة التجارية المستدامة
        - تشمل رفوف التخزين وأنظمة تنظيم الرصيف
    - title: نوادي الشاطئ
      subtitle: الترفيه للضيوف وأجواء الواجهة البحرية
      description: تدير نوادي الشاطئ بيئة عالية الطاقة ومركزة على البصر حيث تكون المعدات جزءا من الأجواء. تحتاج إلى ألواح تجديف أنيقة للترفيه عن الضيوف، SUP وتأجير للأنشطة على الشاطئ، ومعدات تبدو جيدة مثل المكان نفسه. يجب أن يكون الأسطول سهل التشغيل، ويتحمل الاستخدام اليومي من قبل الضيوف ذوي مستويات المهارة المختلفة، وأن ينشر بسرعة خلال ساعات الذروة.
      features:
        - سلاسل فنية مميزة SUPs تستخدم أيضا كزينة للأماكن
        - أسطول مستعد للإيجار SUP للترفيه الضيفي
        - لون مخصص وعلامة تجارية متطابقة مع الهوية البصرية لنادي الشاطئ
        - أنظمة الإطلاق والاسترجاع السريع للعمليات ذات معدل الدوران العالي
        - UV- بناء مقاوم للتعرض اليومي لمياه البحر
    - title: نوادي الأعضاء الخاصة ونوادي اليخوت
      subtitle: الرياضات المائية وبرامج التجديف الحصرية للأعضاء
      description: النوادي الخاصة التي تعتبر فيها الرياضات المائية فائدة للأعضاء أكثر من كونها مصدر دخل. يجب أن تلبي المعدات معايير جمالية أعلى، وتكون متاحة عند الطلب للأعضاء، وتتطلب إشراف موظف محدود. تستخدم أندية اليخوت في مارينا SUP أساطيل تحمل علامات تجارية للترفيه حول الميناء. يجب أن يكون التخزين والصيانة غير مرئيين للأعضاء.
      features:
        - أساطيل تحمل علامات تجارية مميزة SUP للرياضات المائية الأعضاء
        - 'المعدات الفاخرة: EVA الطابق، ألوان الأعضاء المخصصة، التنجيد المعروف'
        - نظام الدفع الذاتي للأعضاء بدون موظفين
        - التخزين خارج الموسم وبرنامج التحديث السنوي
    - title: فنادق تركز على المغامرة والأنشطة
      subtitle: الجولات المصحوبة بمرشدين ويوجا SUP ورحلات الغطس والأنشطة الجماعية
      description: تضع العقارات نفسها كوجهات للمغامرة - حيث تقدم جولات بصحبة مرشدين، ويوجا SUP، والمجاديف عند غروب الشمس، ورحلات الغطس، والأنشطة الجماعية. يحتاج الأسطول إلى دعم كل من نماذج التأجير المجاني والبرامج الموجهة، مع المعدات التي تنتقل بسلاسة بين الاستخدام الذاتي للضيوف والجولات التي يقودها المدرب. تحتاج هذه العقارات إلى معدات متينة لدوران عالي التردد، مع سهولة التنظيف بين مجموعات الضيوف.
      features:
        - أسطول مختلط متعدد الاستخدامات يدعم نماذج الجولات الإرشادية للإيجار +
        - منصات SUP فائقة الاستقرار للأنشطة الجماعية
        - 'معدات المرشد: لوحات المدربين، صناديق مقاومة للماء، اتصالات مقاومة للماء'
        - 'تدوير المعدات الموسمية: أسطول الصيف → برنامج التخزين الشتوي'
        - هيكل متين مصمم للاستخدام اليومي من قبل الضيوف مع الحد الأدنى من الصيانة
