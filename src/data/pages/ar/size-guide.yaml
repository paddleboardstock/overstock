how_to_choose:
  title: كيفية اختيار الحجم المناسب
  cards:
    - title: ألواح SUP متعددة الاستخدامات
      description: ألواحنا الشاملة بطول ~11 قدم (عرض 32"، سمك 6 إنش drop-stitch) توازن بين الاستقرار، السرعة، والسعة. طابق حجم اللوحة مع وزنك — المتجدفون الأثقل بحاجة إلى حجم أكبر.
    - title: العرض والسمك
      description: الألواح الأوسع (32"+) توفر استقراراً أكبر للمبتدئين، اليوغا، والصيد. سمك 6 إنش عند 15 PSI يحافظ على صلابة سطح اللوحة تحت الراكب والمعدات.
    - title: الطرود والاكسسوارات
      description: يتم شحن كل لوح كمجموعة كاملة — اللوح، حقيبة السفر، المضخة اليدوية، المجذاف القابل للتعديل، الزعنفة القابلة للإزالة، الحبل الحلزوني، ومجموعة الإصلاح. تحقق من الحد الأقصى للتحميل للراكب بالإضافة إلى المعدات.
