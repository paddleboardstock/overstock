  rib: قوارب قابلة للنفخ بهيكل صلب للملاحة الساحلية والدوريات والعمليات البحرية المهنية. اختر حسب الطول وسعة المحرك.
  accessory: إكسسوارات ومعدات سلامة لتكملة مركبتك المائية. مقاسات عالمية مع خيارات متعددة.

