hero:
  tagline: Jūras Ekspertīze
  title: Desmitgades Jūras Inženierijā<br />Katram Korpusa Segmentam
  subtitle: Paddle Board Overstock apvieno dziļas materiālu zinātnes zināšanas, precīzu ražošanu un reālus testus, lai radītu ūdens transportlīdzekļus, kas darbojas tad, kad tas ir svarīgi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock jūras inženierijas un pētniecības un attīstības komanda darbībā
expertise_materials:
  tagline: Materiālu zinātne
  title: Pareizā Materiāla Izvēle<br />katram pielietojumam
  subtitle: Mēs strādājam ar trim galvenajiem materiāliem — katrs izvēlēts konkrētiem lietojumiem un veiktspējas prasībām.
  columns: 3
  items:
    - title: Jūras Klases PVC
      description: 1100 denjē PVC audums — mūsu visdaudzpusīgākais materiāls. UV-stabilizēts, izturīgs pret nodilumu un REACH atbilstošs standartiem. Ideāli piemērots atpūtas laivām, SUP dēļiem un kajakiem, kur svarīgi ir svara un izmaksu efektivitāte.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Izcilā ķīmiskā izturība un UV stabilitāte. Hypalon laivas var ilgt 15-20 gadus, ja tiek pienācīgi rūpētas. Ieteicams komerciāliem, glābšanas un militāriem pielietojumiem, kur ilgtermiņa izturība ir kritiska.
      icon: tabler:shield
    - title: Stikla Šķiedra & Alumīnijs
      description: Deep-V stikla šķiedras korpusi RIBs un patrulējošām laivām — viļņu šķeļoša veiktspēja raupjā vidē. Alumīnija korpusi smagiem komerciāliem darba kuģiem, kuriem nepieciešama maksimāla izturība un kravnesība.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Ražošanas Iespējas
  title: Precīza Ražošana<br />katrā posmā
  subtitle: Mūsu 12 000 m² platība ir aprīkota ar specializētām iekārtām katram ražošanas posmam.
  columns: 2
  items:
    - title: CNC Griešana
      description: Datorizēta griešana nodrošina precīzas, atkārtojamas auduma paneles ar minimāliem atkritumiem. Katrs gabals precīzi atbilst dizainam.
      icon: tabler:cpu
    - title: Augstas Frekvences Metināšana
      description: Industriālā HF metināšana rada šuves, kas ir stiprākas nekā pamata materiāls. Konsistenta temperatūras un spiediena kontrole nodrošina gaisa necaurlaidīgas šuves katrā ražošanas partijā.
      icon: tabler:bolt
    - title: Drop Stitches Serdes Montāža
      description: Tūkstošiem poliestera diegu savieno augšējo un apakšējo auduma slāni, ļaujot augsta spiediena uzpildi (15-20 PSI) stingriem, stabilajiem SUP dēļiem un grīdām.
      icon: tabler:building-arch
    - title: Spiediena Pārbaude
      description: Katrs piepūšamais produkts tiek pārbaudīts spiedienā pirms nosūtīšanas. RIB caurules tiek pārbaudītas 1.25x nominālā spiediena — ja tur notur, tas darbosies ūdenī.
      icon: tabler:wind
    - title: Šuves Izturības Pārbaude
      description: Izlases paraugi no katras ražošanas partijas tiek pakļauti destruktīvai šuves izturības pārbaudei. Rezultāti tiek dokumentēti un izsekojami konkrētai ražošanas partijai.
      icon: tabler:files
    - title: Ūdens Testēšana
      description: Katrs RIB modelis piedalās jūras izmēģinājumos pirms sertifikācijas. Testēšana reālās piekrastes apstākļos apstiprina veiktspēju, vadāmību un stabilitāti.
      icon: tabler:ripple
expertise_design:
  tagline: Dizains un inženierija
  title: Izstrādāts reāliem apstākļiem
  subtitle: Mūsu dizaina filozofija sākas ar to, kā laiva tiks izmantota — pēc tam tiek veidota inženierija ap šo lietošanas scenāriju.
  items:
    - title: Deep-V korpusa dizains
      description: Mūsu stikla šķiedras korpusiem ir aprēķināti leņķi, kas optimizēti katra modeļa garumam un paredzētajam pielietojumam. Stiprāks V laukiem ūdeņiem labākai veiktspējai, seklāks stabilitātei.
    - title: Daudzkameru drošība
      description: Katrai laivai ir 3–7 neatkarīgas gaisa kameras. Ja viena nodalījums tiek bojāts, pārējās kameras uztur laivu uz ūdens un darbspējīgu.
    - title: Ergonomisks izkārtojums
      description: Konsoles novietojums, caurules augstums un sēdekļu izvietojums ir veidoti, ņemot vērā operatora ērtības ilgstošas lietošanas laikā — vai tas būtu patrulēšana, zveja vai pārvadāšana.
    - title: Pielāgota konfigurācija
      description: Cauruļu krāsas, konsoles konfigurācija, degvielas ietilpība, piederumu stiprinājumi — katru modeli var pielāgot, lai tas atbilstu konkrētām operacionālajām prasībām.
