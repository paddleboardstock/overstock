hero:
  tagline: Mūsu komanda
  title: Cilvēki aiz Paddle Board Overstock<br />— Inženierija brīvībai uz ūdens
  subtitle: 2012. gadā dibinātais Paddle Board Overstock tika izveidots jūras inženieru, materiālu zinātnieku un ūdens sporta entuziastu vārdā, kuri ticēja profesionāla līmeņa piepūšamo ūdenslīdēju pieejamībai visā pasaulē.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock pilna komandas foto — inženierija, ražošana un vadība
founding:
  tagline: Mūsu dibināšana
  title: No piekrastes darbnīcas<br />līdz 12 000 m² objektam
  subtitle: Paddle Board Overstock dibināja jūras inženieru komanda ar gadu desmitiem ilgu kopēju pieredzi piepūšamo laivu projektēšanā, PVC/Hypalon ražošanā un globālajā jūras aprīkojuma ražošanā.
  items:
    - title: 'Dibināts: 2012. gadā'
      description: Dibināts Ķīnas Cetjuanā — lielā jūras ostas centrā ar bagātu kuģu būvniecības vēsturi.
      icon: tabler:calendar
    - title: 200-300 darbinieki
      description: Ieskaitot 50+ pētniecības un izstrādes inženierus, kvalitātes kontroles speciālistus un ražošanas tehniķus.
      icon: tabler:users
    - title: 12 000 m² objekts
      description: Speciāla ražošanas rūpnīca ar 6 ražošanas līnijām RIBs, piepūšamajām laivām un SUP dēļiem.
      icon: tabler:building-factory
    - title: 50+ apkalpotās valstis
      description: Eksports uz Eiropu, Ameriku, Tuvajiem Austrumiem, Āzijas un Klusā okeāna reģionu, kā arī Āfriku.
      icon: tabler:globe
leadership:
  tagline: Vadība
  title: Vadība un inženierijas līderība
  subtitle: Mūsu vadības komanda apvieno dziļu pieredzi jūras inženierijā, starptautiskajā tirdzniecībā un kvalitātes vadībā.
  columns: 3
  items:
    - title: Dibinātājs un izpilddirektors
      name: Toby Liu
      description: 15+ gadi jūras ražošanā. Iepriekš vadīja pētniecību un attīstību lielā ķīniešu laivu ražotājā. Vairāki patenti piepūšamo laivu dizainā.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Galvenais inženieris
      name: Zhang Wei
      description: 20+ gadi PVC/Hypalon ražošanā un dziļās V formas korpusa dizainā. Bijušais tehniskais direktors Eiropas jūras inženierijas firmā.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Pētniecības un izstrādes vadītājs
      name: Chen Ming
      description: Doktora grāds materiālu zinātnē. Specializējas drop-stitch tehnoloģijā un augstas frekvences metināšanas procesos. 10+ gadi tekstilmožu kompozītmateriālu jomā.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ražošanas direktors
      name: Liu Cjiangs
      description: 18 gadi taupīgajā ražošanā un ražošanas līniju optimizācijā. Sešu Sigma melnā josta. Ieviesti ISO 9001 kvalitātes sistēmas.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Kvalitātes vadītājs
      name: Vangs Fangs
      description: 12+ gadi jūras kvalitātes kontrolē. Sertificēts CE un ISO auditors. Uzrauga testēšanu katrā ražošanas partijā.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Pārdošanas un operāciju direktors
      name: Helēna Lī
      description: 15+ gadi starptautiskajā B2B tirdzniecībā. Pārvaldīja OEM/ODM partnerattiecības 30+ valstīs. Brīvi runā 4 valodās.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Dizaina filozofija
  title: Inženierijas vadīta projektēšana<br />— Katrs sīkums ir svarīgs
  subtitle: Mūsu inženierijas filozofija balstās uz trim principiem, kas vada katru produktu, ko mēs izstrādājam.
  list:
    - 'Uzticamība pirmajā vietā: katrs Paddle Board Overstock produkts tiek testēts, lai izturētu reālās dzīves apstākļus — no glābšanas operācijām aukstā ūdenī līdz tropisko kūrortu nomai. Mēs pārmērīgi inženierojam tur, kur tas ir visnozīmīgāk.'
    - 'Ražošanas precizitāte: Mūsu uzņēmuma iekārtas izmanto CNC griešanu, augstas frekvences metināšanu un automatizētu spiediena testēšanu. Katrs šuvums, katrs vārsts, katrs savienojums atbilst dokumentētajām specifikācijām.'
    - 'Nepārtraukta inovācija: Mūsu pētniecības un attīstības komanda nepārtraukti novērtē jaunus materiālus, ražošanas metodes un dizaina uzlabojumus. Mēs negaidām problēmas — mēs tās prognozējam.'
