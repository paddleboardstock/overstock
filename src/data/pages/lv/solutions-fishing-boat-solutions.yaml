content_challenge:
  tagline: Izaicinājums
  title: Zvejas laivu vajadzības<br />Stabilitāte, darbības rādiuss un izturība
  subtitle: Neatkarīgi no tā, vai jūs vadāt komerciālās zvejas kuģus, pārvaldāt kooperatīvu floti vai veicat zvejas čarterus — jūsu laivai jādarbojas uzticami katru dienu.
  paragraphs:
    - Zvejas laivām ir nepieciešamas stabilas platformas darbam ar līnijām, uztveri un drošai pārvietošanai pa klāju. Piepūšamās laivas un RIBs nodrošina dabisku stabilitāti caur savu cauruļu konstrukciju — būtiska priekšrocība salīdzinājumā ar līdzīgas garuma cietajiem korpusiem.
    - Degvielas efektivitāte ir svarīga zvejas darbībās, kur ekspluatācijas izmaksas tieši ietekmē rentabilitāti. RIBs un piepūšamās laivas ir vieglākas nekā to ekvivalentu cietās laivas, prasot mazāku jaudu un patērējot mazāk degvielas — būtiski komerciāliem operatoriem, kuri katru dienu izmanto laivas, un kooperatīviem, kas pārvalda flotes budžetus.
    - Izturība jūras vidē ir būtiska. Sālsūdens, UV iedarbība un pastāvīga lietošana prasa materiālus, kas iztur skarbos apstākļus bez bojājumu rašanās. Komerciāliem un kooperatīvu operatoriem uzticamība tieši ietekmē ieņēmumus — salūzusi laiva nozīmē zaudētas zvejas dienas.
    - Aquafarer zvejas konfigurācijās ietilpst makšķerauklu turētāji, zivju meklētāji, māneklis tvertnes, dzīvie tvertnes un kravas apstrādes risinājumi, kas paredzēti nopietnām zvejas darbībām gan komerciāliem, gan kooperatīviem, gan rekreācijas lietotājiem.
content_solution:
  tagline: Mūsu risinājums
  title: Zvejai sagatavotas konfigurācijas
  subtitle: Katra Aquafarer zvejas laiva var tikt konfigurēta jūsu konkrētajai zvejas darbībai.
  list:
    - Makšķerauklu turētāju montāža — rūpnīcā uzstādīta vai gatava pēcpārdošanas montāžai
    - Zivju meklētāja/GPS montāžas plāksne konsoles pozīcijā
    - Mānekļa tvertnes vai dzīvo zivju tvertnes opcijas čartera un komerciāliem operatoriem
    - Dzesētāju/glabāšanas konfigurācijas loma uztverei
    - Deep-V korpuss atklātām ūdens platībām — stabils atpūtas laikā, gluds ātrumā
    - PVC vai Hypalon lampu varianti — Hypalon ilgstošai UV ekspozīcijai
    - Ārējo dzinēju diapazons svārstās no 15 HP līdz 115 atkarībā HP no modeļa un pielietojuma
content_segments:
  tagline: Makšķerēšanas profili
  title: Piepūšamo makšķerēšanas laivu risinājumi<br />Pēc operatora tipa
  subtitle: No piekrastes sporta makšķerēšanas līdz komerciālai garās līnijas zvejai — dažādas zvejas operācijas prasa atšķirīgas korpusa konfigurācijas, jaudas diapazonus un uz klāja uzstādītas iekārtas. Mēs pielāgojam katru laivu atbilstoši zvejai, ūdeņiem un darba stilam.
  items:
    - title: Komerciālās zvejas uzņēmumi
      subtitle: Flotes darba laivas ikdienas zvejas operācijām, tīklu apstrādei, loma pārvadāšanai
      description: Komerciālās zvejas uzņēmumi ekspluatē darba laivas tīklu izvietošanai un atgūšanai, slazdu apkopei, garo līniju izvilkšanai un loma pārvadāšanai. Šīs laivas strādā katru dienu sālsūdens apstākļos un tām jāiztur smagas kravas, pastāvīga klāja apstrāde un garas darba stundas. Degvielas ekonomija un zema uzturēšana ir kritiski svarīgi flotes peļņai. Kuģim jānodrošina stabilas darba platformas apkalpes apkalpes aprīkojumam un lomai dažādos jūras apstākļos.
      features:
        - Plakana klāja izkārtojums tīklu apstrādei, slazdu kārtošanai un zivju uzglabāšanai
        - Degvielu taupošs 40-115 HP ārdzinējs ar zemām ikdienas ekspluatācijas izmaksām
        - Izturīgas Hypalon caurules nodiluma izturībai ikdienas lietošanā
        - Pastiprinātas berzes dēļi biežai saskarei ar piestātni un kuģi
        - Pašizsūknējošs klājs ērtai mazgāšanai pēc operācijām
        - Flotes cenas un konsekventas specifikācijas daudzkuģu operatoriem
    - title: Čartera zvejas operatori
      subtitle: Daudzpasažieru komforts, ķeršanas vadība, drošības sertifikāts
      description: Operatori organizē pusdienas un pilnas dienas makšķerēšanas čarterus — no piekrastes rifu zvejas līdz jūras grunts makšķerēšanai. Jūsu laivai nepieciešamas pasažieru sēdvietas ar drošības sertifikātiem, plaša klāja vieta vairākiem makšķerniekiem un integrētas dzīvās tvertnes, lai ēsma un loma būtu svaiga visa ceļojuma laikā. Viesu komforts tieši ietekmē ceļojumu atsauksmes, atkārtotas rezervācijas un tiešsaistes vērtējumus.
      features:
        - Konsoles stūre ar triecienus absorbējošiem sporta sēdekļiem
        - Rūpnīcā uzstādītie stieņu turētāji (4–8 pozīcijas)
        - 60–115 HP ārborda diapazons jūras kruīza ātrumam
        - CE C vai B kategorijas sertifikācija komerciālajiem pasažieru pārvadājumiem
        - Bimini vai T-top saulessargs viesu komfortam garākos braucienos
    - title: Amatniecības un maza mēroga komerciālie zvejnieki
      subtitle: Uzticamas darba laivas ikdienas iztikai
      description: Neatkarīgie zvejnieki, kuri paļaujas uz savu laivu kā galveno ienākumu avotu — tīklu izvietošanu, zivju slazdu kopšanu vai makšķerēšanas makšķerēšanu pie krasta. Jūsu prioritāte ir degvielas ekonomija, vienkārša apkope, ko varat veikt pats, un laiva, kas spēj apstrādāt mērenu lomu un aprīkojuma daudzumu, nezaudējot stabilitāti.
      features:
        - Degvielas ekonomisks 15–40 HP ārdzinējs zemām ekspluatācijas izmaksām
        - Hypalon CSM caurules pagarinātai UV un nodiluma izturībai
        - Plakana klāja izkārtojums tīklu apstrādei un zivju uzglabāšanai
        - Viegla izkāpšana krastā ar piepūšamo ķīli
    - title: Zvejas kooperatīvi
      subtitle: Loma noķeršanas kolekcionēšanā, biedru transportēšanā, piegādes sadales organizēšanā
      description: Zvejas kooperatīvi pārvalda kopienas kuģu floteles, lai vāktu lomu no biedru zvejniekiem, transportētu piegādes uz attālām zvejas kopienām un sadalītu ražu tirgos. Šiem darba laivām nepieciešama augsta kravnesība, uzticama ikdienas darbība un viegla apkope attālos rajonos. Kooperatīvi bieži darbojas attīstības reģionos, kur rezerves daļu pieejamība un servisa iespējas ir ierobežotas, tāpēc būtiski ir vienkārši ārējie dzinēju risinājumi un izturīga konstrukcija.
      features:
        - Augsta kravnesība lomas un piegādes pārvadāšanai
        - Vienkārša ārējā konfigurācija ērtai apkalpošanai uz vietas
        - Smags PVC vai Hypalon konstrukcija finansiālai elastībai
        - Plakans klājs ar nostiprinājuma punktiem kravas fiksēšanai
        - Degvielu taupoša darbība, kas samazina kooperatīva darbības izmaksas
    - title: Sporta un makšķerēšanas entuziasti
      subtitle: Veiktspēja un stils nopietniem makšķerniekiem
      description: Pieredzējuši makšķernieki, kas meklē spējīgu zvejas platformu, kas nodrošina ātrumu līdz tālām zvejas vietām, stabilas stāvēšanas cīņas pozīcijas un augstas kvalitātes apdari. Laivai jābūt ērtai gan braucot divas jūdzes jūrā līdz rifu, gan izpētot attālas estuārija aizmugures.
      features:
        - Dziļā-V RIB korpuss gludai braukšanai viļņainā ūdenī
        - Zvejas ekrāna/GPS stiprinājuma plāksne iepriekš pieslēgta pie konsoles
        - Dzīvs ēdiena tvertne un ledusskapis integrēti aizmugurējā sēdeklī
        - Pielāgoti EVA klāja krāsas varianti, kas atbilst laivas/bušas grafikai
    - title: Zvejas gidi un ekotūrisma operatori
      subtitle: Vadīti zvejas piedzīvojumi viesojoties
      description: Gidi, kas ved nelielas grupas viesu makšķerniekus uz ražīgām zvejas vietām — bieži apvienojot zveju ar ekotūrisma elementiem, piemēram, putnu vērošanu vai mangrovju izpēti. Laivai jābūt sausai un ērtai viesiem, kas nav pieraduši pie mazām laivām, ar vieglu iekāpšanu un nojumēm.
      features:
        - Bimini vai T-top stiprinājuma punkti rūpnīcā uzstādīti
        - Gluda kāpņu iekāpšana ērtai atkārtotai iekāpšanai
        - Klusais 4-taktu ārējais dzinējs traucējuma samazināšanai
        - Sausas uzglabāšanas nodalījumi viesu telefoniem, maciņiem, kamerām
