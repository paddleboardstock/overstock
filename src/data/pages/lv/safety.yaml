certifications:
  - title: CE Sertifikācija (ES 2016/425)
    standard: PPE regula (ES) 2016/425 | EN ISO 12402
    description: Visa Paddle Board Overstock drošības aprīkojuma atbilstība Eiropas CE individuālo aizsardzības līdzekļu regulējuma marķēšanas prasībām. Katrs produkts tiek neatkarīgi testēts TÜV Rheinland, Eiropas Paziņotajā institūcijā. Mūsu piepūšamās laivas atbilst RIBs Rekreācijas laivu direktīvas 2013/53/ES (RCD) C un D kategorijas prasībām.
    body: CE Sertifikācija aptver būtiskas veselības un drošības prasības personīgajām peldošajām ierīcēm un piepūšamajiem ūdens transportlīdzekļiem.TÜV Rheinland ik gadu veic mūsu ražošanas iekārtas auditu, lai pārbaudītu turpmāko atbilstību.
  - title: SOLAS — Dzīvības drošība jūrā
    standard: SOLAS III nodaļa | LSA kods
    description: Glābšanas vestes Pro atbilst SOLAS noteikumiem jūras un komerciālajām jūras operācijām. Testēts 24 stundu peldspējas saglabāšanai, automātiskai uzpūšanai iegremdēšanas brīdī un veiktspējai jūras stāvokļos līdz 5. spēkam. Atbilst III nodaļas prasībām glābšanas vestēm komerciālo kuģu sastāvā.
    body: SOLAS Apstiprināšanai nepieciešama neatkarīga pārbaudīta iestāde, lai pārbaudītu peldošumu, izturību, redzamību un automātisku aktivizāciju. Mūsu Life Vest Pro ir pilna SOLAS tipa apstiprināšana ar MED sertifikāciju.
  - title: USCG III tips / V tips
    standard: 46 CFR 160. daļa |USCG Apstiprinājums
    description: Izvēlētās Paddle Board Overstock glābšanas vestes atbilst ASV Krasta apsardzes klasifikācijai III tipa (peldlīdzeklis) un V tipa (speciālas lietošanas) ierīcēm. Piemērotas aizsargātiem ūdeņiem, piekrastes kruīziem un komerciālām operācijām, kurām nepieciešamas USCGapstiprinātas PFD.
    body: USCG apstiprināšana prasa testēšanu CG atzītā neatkarīgā laboratorijā. V tipa apstiprinājums ietver hibrīdus piepūšamus dizainus, kuriem nepieciešama manuāla vai automātiska aktivizācija.
  - title: BSCI Sociālā atbilstība
    standard: Amfori BSCI uzvedības kodekss
    description: Mūsu rūpnīca tiek auditēta ik gadu saskaņā ar amfori Business Social Compliance Initiative (BSCI). Tas apliecina ētiskas darba prakses, darba drošību, godīgu darba laiku un vides pārvaldību mūsu 12 000 m² ražošanas objektā.
    body: atbilstība BSCI ir priekšnoteikums Eiropas mazumtirgotājiem un importētājiem. Mūsu pašreizējais BSCI vērtējums ir "C" (Labs), ko auditē SGS.
  - title: REACH & RoHS Atbilstība
    standard: ES REACH Regula (EK) 1907/2006 |RoHS Direktīva 2011/65/ES
    description: Visi PVC savienojumi, līmes un pārklājumi, kas tiek izmantoti Paddle Board Overstock produktos, atbilst ES REACH ķīmiskās drošības noteikumiem un RoHS bīstamo vielu ierobežojumiem. Materiālu drošības datu lapas (MSDS) ir pieejamas katrai produktu līnijai.
    body: REACH atbilstība nodrošina, ka neviena ierobežota SVHC viela nepārsniedz sliekšņa robežas. Regulāra neatkarīgu laboratoriju testēšana pārbauda nepārtrauktu atbilstību katrai ražošanas partijai.
  - title: ISO 9001:2015 Kvalitātes vadība
    standard: ISO 9001:2015 |TÜV Rheinland sertificēts
    description: Mūsu kvalitātes vadības sistēma ir ISO 9001:2015 sertificēta TÜV Rheinland, aptverot dizainu, ražošanu, testēšanu un pēcpārdošanas servisu. Ikgadējie uzraudzības auditi nodrošina nepārtrauktu uzlabošanu un procesu kontroli.
    body: ISO 9001 sertifikācijai nepieciešamas dokumentētas kvalitātes politikas, iekšējie auditi, vadības pārskati, korektīvo darbību procedūras un izsekojami ražošanas ieraksti.
testimonial:
  quote: Mēs esam iegādājušies drošības aprīkojumu no vairākiem piegādātājiem visā Āzijā.Paddle Board Overstock ir vienīgais ražotājs, kas sniedza pilnu CE dokumentāciju, SOLAS sertifikātus un trešo pušu testu atskaites jau iepriekš — bez pieprasījuma.
  author: Eriks Lindstrēms
  title: Drošības virsnieks
  company: Baltijas jūras apgāde
  location: Somija
content_overpressure:
  tagline: Pārsprieguma drošība
  title: RIB Caurules spiediens<br />Pārvaldība karstā klimatā
  subtitle: Piepūšamo cauruļu spiediens palielinās ar temperatūru. Pārmērīga spiediena izpratne un pārvaldība novērš bojājumus un nodrošina drošu darbību tropu un tuksneša vidēs.
  items:
    - title: Boila spiediena atvieglošanas vārsti
      description: Paddle Board Overstock RIB Caurules ir aprīkotas ar pārsprieguma atvieglošanas vārstiem, kas automātiski izvada lieko spiedienu virs nominālā maksimuma. Tas novērš šuvju spriegumu un iespējamu cauruļu plīsumu saules sildīšanas dēļ.
      icon: tabler:gauge
    - title: No rīta līdz pusdienlaikam spiediena maiņa
      description: Caurule, kas piepūsta līdz 3,5 grādiem PSI pie 20°C, var sasniegt 4,5 grādus+ PSI pie 40°C saules iedarbības. Vienmēr uzpūš līdz ieteiktā diapazona apakšējai robežai karstā klimatā un ļauj atvieglošanas vārstam kontrolēt lieko spiedienu.
      icon: tabler:sun
    - title: Ieteicamie darba spiedieni
      description: 'PVC Lampas: 3.0-3.5 PSI darbojošas, 4.5 PSI max. Hypalon Lampas: 3.5-4.0 PSI darbojas, 5.0 PSI max. Vienmēr testējiet ar 1.25x nominālo (4.4 PSI , PVC5.0 PSI ) Hypalonatbilstoši Paddle Board Overstock kvalitātes kontroles standartiem.'
      icon: tabler:chart-bar
    - title: Saules iedarbības labākās prakses
      description: Uzglabājiet RIBs ēnainās vietās, kad netiek lietots. Izmantojiet UVaizsargpārklājumus ilgstošai piestātnei. Pārbaudiet un regulējiet caurules spiedienu pirms un pēc saules maksimuma stundām. Nekad nepārsniedziet maksimālo nominālo spiedienu.
      icon: tabler:umbrella
    - title: Avārijas dehermetizācija
      description: Ja caurule šķiet pārāk cieta vai atbrīvošanas vārsts izvada gaisu, izlaidiet gaisu caur Halkey-Roberts vai militāro vārstu, līdz spiediens atgriežas darbības diapazonā. Ņemiet līdzi spiediena mērītāju precīziem rādījumiem.
      icon: tabler:alert-circle
