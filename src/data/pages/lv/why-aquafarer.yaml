reasons:
  tagline: Aquafarer Atšķirība
  title: Kas mūs izceļ
  isBeforeContent: false
  columns: 3
  items:
    - title: Īsta ražošana, nevis tirdzniecība
      description: Mums pieder un mēs vadām 12 000 m² lielu rūpnīcu. Kad jūs sadarbojaties ar Aquafarer, jūs strādājat tieši ar cilvēkiem, kuri projektē, inženierē un ražo jūsu produktus — bez starpniekiem.
      icon: tabler:building-factory
    - title: Inženierzinātnēs balstīta pieeja
      description: Mūsu projektēšanas process sākas ar lietošanas gadījumu, nevis produkta kategoriju. Mēs optimizējam korpusa formu, materiālu izvēli un konfigurāciju tam, kā aprīkojums tiks reāli izmantots komerciālajā vidē.
      icon: tabler:engine
    - title: Sertificēta kvalitāte
      description: CE sertificēts, ISO kvalitātes sistēma, BSCI atbilstība, REACH atbilstība, USCG Type III/V apstiprinātas glābšanas vestes; visi produkti atbilst attiecīgajiem starptautiskajiem standartiem.
      icon: tabler:certificate
    - title: Elastīgs OEM/ODM
      description: Cauruļu krāsas, konsoles izkārtojums, zīmola identitāte, iepakojums — mēs pielāgojam jūsu specifikācijām. Nav minimālā pasūtījuma spiediena. Sāciet ar prototipu, attīstiet ar pārliecību.
      icon: tabler:adjustments
    - title: Globālā loģistika
      description: ASV noliktava Kalifornijā, tieša piegāde no Qingdao, gaisa transports steidzamiem pasūtījumiem. Mēs veicam muitas dokumentāciju un dokumentu kārtošanu visā pasaulē.
      icon: tabler:truck-delivery
    - title: Mūža atbalsts
      description: Mēs atbalstām laivas, ko esam uzbūvējuši pirms 20 gadiem. Oriģinālās rezerves daļas, tehniskie padomi, remonta norādījumi — mūsu komanda ir pieejama, kad vien jums nepieciešams, kur vien jūs atrodaties.
      icon: tabler:lifebuoy
testimonials:
  tagline: Pasaules zīmolu uzticība
  title: Ko mūsu partneri saka
  items:
    - content: Mēs esam strādājuši ar vairākām ražotnēm Ķīnā, bet Aquafarer izceļas ar savu inženiertehnisko atbalstu un konsekventu kvalitāti. Viņi izturas pret mūsu zīmolu kā pret savu.
      name: — OEM Partneris, Eiropas ūdenssporta zīmols
    - content: Viņu Hypalon RIBs mūsu flotē ir bijuši vairāk nekā 5 gadus. Minimāla apkope, izcila UV izturība. Piecu gadu garantija uz caurulēm dod mums pārliecību.
      name: — Flotes operators, Tuvāko Austrumu kūrortu grupa
    - content: Aquafarer komanda palīdzēja mums izstrādāt pielāgotu SUP dēļa dizainu no koncepcijas līdz ražošanai 90 dienu laikā. Kvalitāte pārsniedza mūsu cerības.
      name: — Izplatītājs, Austrālijas ūdenssporta joma
    - content: Kā mazā uzņēmuma īpašnieks, es biju noraizējies par MOQs. Aquafarer sadarbojās ar manu budžetu un palīdzēja man uzsākt manu zīmolu ar tikai 50 dēļiem. Tagad es pasūtu 500.
      name: — Zīmola dibinātājs, ASV SUP nomas uzņēmums
cta:
  title: Gatavs attīstīt savu ūdens biznesu?
  subtitle: Sazinieties ar mūsu komandu, lai saņemtu bezmaksas konsultāciju. Nav nekādu saistību — tikai godīgi padomi par aprīkojumu un ražošanu.
  actions:
    - variant: primary
      text: Runājiet ar mūsu komandu
      href: /contact
    - text: Lejupielādējiet produktu katalogu
      href: /resources
