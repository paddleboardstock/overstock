hero:
  tagline: Kāpēc Aquafarer
  title: Cits veidots. Veidots uzņēmējdarbībai.<br />Partneris aiz ūdens piedzīvojumiem visā pasaulē
  subtitle: Ne tikai ražotājs — biznesa partneris, kas projektē, izstrādā un piegādā komerciālai lietošanai paredzētu aprīkojumu klubiem, kūrortiem, nomas operatoriem un jaunattīstības ūdens zīmoliem.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer ražošanas kvalitāte un pieredze
pillars:
  tagline: Trīs partnerības pīlāri
  title: Kāpēc pasaules ūdens uzņēmumi izvēlas Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Paredzēts komerciālai lietošanai
      description: Mūsu aprīkojums ir izstrādāts ikdienas noma, nevis brīvdienu atpūtu. Komerciālas pakāpes PVC, pastiprināti drop-stitch kodi, UV stabilas Hypalon iespējas un lauka pārbaudīta aparatūra nozīmē zemākas uzturēšanas izmaksas, ilgāku kalpošanas laiku un lielāku ROI jūsu darbībai.
      icon: tabler:building-factory
      callToAction:
        text: Skatīt komerciālā produkta līniju
        href: /products
    - title: No idejas līdz tirgum
      description: 'Palaidiet savu ūdens sporta zīmolu 90 dienu laikā. Mēs vēršamies pie jums katrā solī: koncepta apstiprināšana, produkta izvēle, prototips, ražošana, iepakojuma dizains un globāla nosūtīšana. Nav minimālā pasūtījuma spiediena — sāciet mazu, paplašinieties droši.'
      icon: tabler:rocket
      callToAction:
        text: Sāciet savu zīmola ceļojumu
        href: /oem-odm-blueprint
    - title: Veidots globālajiem apstākļiem
      description: 'Produkti optimizēti katram klimatam: aukstūdens PVC formulējumi Eiropai, UV izturīgi materiāli Tuvajiem Austrumiem un Austrālijai, pret mitrumu aizsargājoša apstrāde Dienvidaustrumāzijai. Katrs sūtījums tiek kalibrēts atbilstoši tā galamērķa vidēm.'
      icon: tabler:world
