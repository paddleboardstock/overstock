hero:
  tagline: Nozaru risinājumu matrica
  title: Situācijām balstīti jūras risinājumi<br />Profesionālām operācijām
  subtitle: Speciāli izstrādāti piepūšamie ūdens transportlīdzekļi un RIBs, kas paredzēti glābšanas, nomas flotes, jahtu tenderu un komerciālās zvejas vajadzībām — katrs ar tehniskajiem parametriem un pielāgošanas iespējām.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock profesionāli jūras risinājumi dažādām nozarēm
direct_answer: 'Paddle Board Overstock piedāvā situācijām inženierizētas piepūšamās ūdens transportlīdzekļu un RIB risinājumus komerciālām jūras operācijām: glābšanas un patrulēšanas laivas ar pastiprinātiem Hypalon caurulēm un daudzkameru drošību, nomas flotes SUPs un kajaki ar 1,2 mm PVC un karstā gaisa metinātām šuvēm ilglaicīgai izturībai, luksusa jahtu tenderus ar Deep-V alumīnija korpusu RIBs un smagā tipa zvejas konfigurācijas ar makšķerēšanas turētājiem un dzīvo zivju tvertnēm.'
solution_a:
  tagline: Risinājums A
  title: Jūras glābšana &<br />Komerciālā patrulēšana
  subtitle: Ātrgaitas, daudzkameru drošības RIBs profesionālai ārkārtas reaģēšanai un tiesībaizsardzības operācijām.
  badge: Heavy-Duty Series
  description: Mūsu jūras glābšanas un patrulēšanas RIBs ir izgatavotas no pastiprinātām augstas blīvuma Hypalon/PVC gaisa caurulēm ar daudzkameru neatkarīgas peldspējas dizainu. Katrs kuģis ir aprīkots ar profesionālas klases atstarojošu lenti, glābšanas auklām un ātrās piepūšanas vārstiem gatavībai darbībai. Deep-V stikla šķiedras korpusi nodrošina izcilu stabilitāti lielos ātrumos un raupjos jūras apstākļos.
  features:
    - title: Daudzkameru drošība
      description: 4–6 neatkarīgas gaisa kameras — jebkuras vienas kameras caurduršana uztur pozitīvu peldspēju
    - title: Pastiprinoša cauruļu auduma konstrukcija
      description: 1,2 mm Hypalon CSM vai 1 680 DTEX PVC ar divslāņu karstā gaisa metinātām šuvēm
    - title: Profesionala klase
      description: SOLAS atstarojoša lente, glābšanas auklas, vilkšanas klītes, ātrās atbrīvošanas piestiprināšanas auklas
    - title: Ātrgaitas korpuss
      description: Deep-V stikla šķiedras vai alumīnija korpuss, novērtēts 25–45 mezgli atkarībā no konfigurācijas
  recommended_models:
    - RIB 450. patruļa
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Korpusa materiāls
      value: Stikla šķiedras / jūras klases alumīnijs
    - label: Cauruļu audums
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Maksimālais ātrums
      value: 25–45 mezgli
    - label: Jauda
      value: 6–12 personu
    - label: Dzinēja diapazons
      value: 40–200 HP
    - label: Sertifikācija
      value: CE / ISO 9001
solution_b:
  tagline: Risinājums B
  title: Ūdenssporta aprīkojuma noma &<br />Atpūtas kompleksa flotes aprīkojums
  subtitle: Ultraizturīgs, zema apkope pieprasošs piepūšamais SUPs, kajaki un laivas, kas paredzētas ikdienas nomas izmantošanai kūrortos, klubos un tūrisma uzņēmumos.
  badge: Rental-Grade
  description: Mūsu nomas flotes aprīkojums ir izstrādāts maksimālai izturībai un minimālām uzturēšanas izmaksām. Mēs izmantojam 1,2 mm pastiprinātu PVC ar trīsslāņu karstgaisa metinātas šuves tehnoloģiju, kas iztur UV noārdīšanos un biežas sadursmju bojājumus. Drop-stitch konstrukcija nodrošina, ka dēļi saglabā stingrību pat pēc simtiem nomas ciklu. Visos modeļos ir pastiprināti D-gredzeni, abrazijizturīgi sliecju siksnas un komerciālas klases vārsti.
  features:
    - title: Komerciālas kvalitātes PVC
      description: 1,2 mm pastiprināts PVC ar UV stabilizatoriem — 3 reizes biezāks nekā patērētāja klases materiāli
    - title: Karstā gaisa metinātās šuves
      description: Trīskārtējas slāņu sapludināšanas metināšana — spēcīgāka par līmēšanu, iztur delamināciju
    - title: Drop-Stitch Stīvums
      description: 1 680 DTEX kodolu ar 2 pavedieniem/cm² — novērtēts līdz 20 PSI cietības dēļ, līdzīgi kā plāksnei
    - title: Flotes gatavs dizains
      description: Stiprināti D-veida gredzeni, komerciālie Halkey-Roberts vārsti, nodilumizturīgas sliežu lentes
  recommended_models:
    - SUP Ātrās geparda kustības uzliesmojums
    - SUP Okeāna ceļotājs
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Caurules materiāls
      value: 1,0–1,2 mm Pastiprināts PVC
    - label: Šuvju tehnoloģija
      value: Trīsslāņu karstgaisa metināšana
    - label: Maksimālais spiediens
      value: 15–20 PSI (drop-stitch modeļi)
    - label: UV Izturība
      value: 1 000+ stundu paātrinātā testēšana
    - label: Garantija
      value: 2–5 gadi atkarībā no modeļa
    - label: Apkope
      value: Minimāla — skalot un uzglabāt
solution_c:
  tagline: Risinājums C
  title: Jahtu tenderi &<br />Luksusa ūdens transportlīdzekļi
  subtitle: Viegls, augstas veiktspējas RIB tenderis, paredzēts superjahtu glabāšanai un viesu pārvadāšanai ar luksusa apdari.
  badge: Premium Series
  description: Mūsu jahtu tenderi RIBs apvieno vieglu konstrukciju ar luksusa estētiku. Deep-V alumīnija vai stikla šķiedras korpusi nodrošina izcilu braukšanas kvalitāti un vieglu pacelšanu ar davitu. Pieejami ar krāsām saskaņotiem cauruļu grafiskiem dizainiem, premium apdari un pielāgotu konsoles izkārtojumu. Kompaktas uzglabāšanas dimensijas padara tos ideāli piemērotus superjahtu garāžām un klāja glabāšanai.
  features:
    - title: Viegls dizains
      description: Jūras kvalitātes alumīnija korpusi samazina svaru par 30% salīdzinājumā ar stikla šķiedru, kas nodrošina vieglu pacelšanu
    - title: Deep-V veiktspēja
      description: 18–22 grādu deadrize korpuss gludam braucienam viļņainos apstākļos un lieliskai maršruta izsekošanai
    - title: Luksusa apdare
      description: Pielāgota apdare, krāsām saskaņoti caurules, premium stūres konsole, nerūsējošā pakete
    - title: Kompakts glabāšana
      description: Paredzēts superjahtu garāžām — piepūšamas caurules kompakta uzglabāšanai
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Korpusa tips
      value: Deep-V Alumīnijs / Stikla šķiedra
    - label: Deadrīze
      value: 18–22 grādi
    - label: Maksimālais ātrums
      value: 30–40 mezgli
    - label: Sausais svars
      value: 120–350 kg (alumīnija korpuss)
    - label: Davit pacelšanai gatavs
      value: Jā — pacelšanas punkti standarta
    - label: Uzglabāšana
      value: Piepūšamas caurules, sakraujamas
